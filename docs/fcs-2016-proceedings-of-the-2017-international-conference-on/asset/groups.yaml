    # Intl'' Conf. Foundations of Computer Science | FCS''17 |


    conclude from these results that using the structure of critical graphs increases
    the probability of finding hard instances. Moreover, the exact size of a cover
    is highly useful for determining the quality of the solutions determined by NuMVC


    # 7. Conclusions


    This paper introduced the concept of critical graphs for the vertex-cover problem,
    which graphs cannot be reduced without reducing their number of vertices. By starting
    with random vertices, it allows us to generate random graphs from which we can
    estimate the size of optimal cover for testing. The random process is parameterized
    by the number of vertices, cover as well as number of edges. We introduced a set
    of extensions that allow us to generate a sufficiently large set of critical graphs
    as base for constructing graphs. We showed that our extensions allow to refine
    the process very effectively.


    In general, another application potential is the construction of graphs with instances
    that are difficult to solve. With our realistic heuristic NuMVC and Greedy we
    estimated the minimum cover by more than 100 vertices for graphs generated with
    our process with 3500 vertices. By analyzing the behavior of NuMVC and Greedy
    on random graphs with a structure like ours, we observed that these instances
    appear necessary for hard instances. We will continue this research in the future.


    In general, critical graphs are interesting objects to study the understanding
    of hard problems. Our proposed generation process, if we were aware of all critical
    instances, one could easily create all graphs from our process. Through this,
    we think that the task of finding critical instances is from complete. We have
    started the systematic search of small instances and will continue report on their
    findings in the future.


    Furthermore, we analyzed the quality of GulantGraphs for benchmarking purposes.
    At an early stage, we found that instances with a small size of internal cliques
    were solvable by local-search algorithms such as NuMVC, which shows that the verification
    of partial results is crucial. We plan to continue our research in the direction
    of constructing larger graphs from GulantGraphs and will also report on them.


