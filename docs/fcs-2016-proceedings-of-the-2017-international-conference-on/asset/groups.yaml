    This implies that advanced search could be designed that essentially compare between
    two array elements [1] to identify the smaller key array elements inside the larger
    search pool. With that perception, the concept pertaining to multiple key search
    strategy was introduced by the author to the computing community back in


    It is also possible to design an n-tiered binary search algorithm, where n ≥ 3.
