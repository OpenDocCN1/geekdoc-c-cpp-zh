    # 1. 引言


    给定一个简单图 $G=(V,E)$，令 $N(v)$ 表示 $v$ 在 $G$ 中的开邻域，$N[v]$ 表示 $v$ 在 $G$ 中的闭邻域空u$ 和 $v$
    之间的距离 $d(u,v)$ 是它们在 $G$ 中路径的长度。$G$ 的 $d$-支配集是 $G$ 的顶点集合 $V$，使得 $V$ 中的每个顶点到 $V$
    中某些顶点的距离都在 $d$ 以内。


    给定图 $G$、$d$-DOMINATING SET 和正整数 $k$，问题是确定 $G$ 是否有一个大小最多为 $k$ 的 $d$-支配集。


    研究充分的 $k$-DOMINATING SET 问题可以认为是 $d=1$ 时 $d$-DOMINATING SET 的一个特例。支配集的概念由 Slater
    [1] 和 Hed [2] 引入。支配集在无线网络中的应用由 Wu 和 Li [3] 引入；Prathiba 等 [4] 研究了扩展图中寻找支配集的问题 [5]。关于距离支配的更多细节和参考文献，请参见
    Hemming [6]。


    参数化复杂度是一个处理不可计算性问题的强大框架。参数化问题是实例集合 $(x,k)$。参数化问题被认为是固定参数可行的，如果存在一个依赖于 $k$ 的算法，能够在
    $f(k) \cdot poly(|x|)$ 时间内解决问题。通常情况下，关键图是研究困难问题的有趣对象。如果我们意识到所有关键图，就可以很容易地创建所有图。通过这一点，我们认为寻找困难实例的任务是至关重要的。在早期阶段，我们发现具有小尺寸的实例可以通过局部搜索算法解决，这表明验证部分结果是至关重要的。我们将继续在该方向的研究。


