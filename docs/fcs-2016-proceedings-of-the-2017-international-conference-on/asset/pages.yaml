  md: '# Foreword


    It gives us pleasure to introduce this collection of papers to be presented at
    the 2017 International Conference on Foundations of Computer Science (FCS''17),
    July 17-20, 2017, at Monte Carlo Resort, Las Vegas, USA.


    An important mission of the World Congress in Computer Science, Computer Engineering,
    and Application, CSE (a federated congress to which this conference is affiliated)
    is providing a unique platform for a diverse community of constituents composed
    of scholars, researchers, developers, and practitioners. The CSE makes concerted
    effort to reach out to participants affiliated with diverse entities (such as
    universities, institutions, organizations, government agencies, and research centers).
    The congress also aims to include participants from institutes that have teaching
    as their main mission and those that have research as their main mission. By any
    definition of diversity, this congress is the most diverse scientific meeting
    in USA. We are proud to report that this federated congress has participants from
    64 different nations representing variety of personal and scientific experiences
    that arise from differences in culture and values. As seen (see below), the program
    committee of this conference as well as the program committee of all tracks of
    the federated congress is as diverse as its authors and participants.


    The program committee was to include all who submitted for consideration. About
    half of the submissions were outside the United States. Each submitted paper was
    peer-reviewed by two experts in the field for originality, clarity, impact, and
    soundness. In cases of contradictory recommendations, a member of the program
    committee was charged to make the final decision; often, this seeking help from
    all interested editors. In papers whose authors included a member of the program
    committee it was evaluated using the double-blind review process. One to the exception
    above double-blind review was for papers that were submitted directly to chairs/organizers
    of pre-approved sessions/workshops; in these cases, the chairs/organizers were
    responsible for the evaluation of such submissions. The overall acceptance rate
    for regular papers was 19%; 8% of the remaining papers were accepted as posters
    (at the time of this writing, we had not accepted a couple of individual tracks).


    We are very grateful to the many colleagues who offered their services in organizing
    the conference. In particular, we would like to thank the members of Program Committee
    of FCS''17, members of the steering Committee, and members of committees of federated
    congress that have tracks within the scope of FCS. Many individuals listed below,
    will be requested by the conference to provide their expertise and services for
    selecting papers (extended versions) in journal special issues as well as for
    publication in research books (to be prepared for publishers including: Springer,
    Elsevier, BMC, and others).


