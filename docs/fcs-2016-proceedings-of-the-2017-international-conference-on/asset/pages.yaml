  md: '# 2 Locks designed for NUMA system


    # 2.1 Lock Cohorting


    Cohort lock [2] is consisted of two levels of locks: global lock and local lock.
    Global lock is shared by all threads in NUMA system, and local lock is only shared
    with same node in NUMA system. The thread needs to acquire both locks by a sequence
    of local lock and first global lock and then executes the critical section. When
    a thread releases the lock it checks waiting thread in the same node. If there
    is a waiting thread in the same node, a lock holding releases the local lock first,
    then passes the global lock to the waiting thread in the same node.


    Cohort lock gives priority to the thread in the same node using the intra-node
    cache; inter-node traffic and misses can be reduced, however cohort lock occurs
    in the thread trying to acquire the lock in other nodes. It is because cohort
    lock holding does not release a global lock to the other nodes. To solve this
    problem, cohort lock sets a threshold to make a global lock held in a specific
    node continually. After a thread meets the threshold, it must release the global
    lock to yield the lock to other nodes. This threshold is called handoff and is
    set to 64.


    Calciu et al. [1] sets patience limit to 1000:


    (a) Read 98%, Writer 2%


    ![](img/447fbed58dc921d81e92b3d3f8047037_27_0.png)


    (b) Read 50%, Writer 50%


    ![](img/447fbed58dc921d81e92b3d3f8047037_27_1.png)


    # 2.2 NUMA-Reader-Writer Locks


    NUMA-reader-writer lock [1] is designed based on cohort lock to limit migrations
    between waiting writers by releasing global lock. When a writer meets the threshold
    in the same node, a writer transfers global lock to other waiting writers in the
    same node. Furthermore, to get high performance, this lock maximizes the concurrency
    by balancing readers and writer operations. The readers actually do not need to
    access the shared resource concurrently, so they do not execute the critical section
    protected by the locks. To implement this, it uses reader indicators in each node,
    adding when a reader acquires a lock and deallocating when it releases. Writers
    for acquiring a lock only check the reader indicator whether a reader is in the
    critical section.


    NUMA-reader-writer locks present three different preferences: writer-preference,
    reader-preference, and neutral preference. Writer-preference and reader-preference
    give a priority to critical section regardless of order to critical section. This
    may cause starvation operation to each preference. To overcome this, lock algorithm
    adopts the patience limit blocking preference operation continuously. For example,
    with a writer preference, a reader waits over patience limit, sets a barrier flag
    and the writers are blocked until a barrier finish to execute critical section.


    (c) Read 10%, Writer 90%


