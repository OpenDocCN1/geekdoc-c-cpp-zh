  md: '# Analysis and Evaluation of Locks designed for NUMA system


    Joohaan Hong, Seokyeong Jung, Kihyun Yun, and Minsoo Ryu

    Department of Computer Science and Engineering, Hanyang University, Seoul, Korea

    [jjhong, sykyung, kihyun]@rtcc.hanyang.ac.kr, msryu@hanyang.ac.kr


    **Abstract** - As systems grow to multi-core and multicore systems for high performance,
    Non-Uniform Memory Access (NUMA) architecture is widely adopted in recent computing
    systems. In NUMA systems, lock primitives such as spinlock become bottleneck by
    causing frequent inter-node traffic. For improving performance in NUMA architectures,
    lock evaluation is cautiously necessary to maintain cache traffic and coherence.

    in this paper, we evaluate two locks designed for NUMA architecture: Cohort Lock
    and NUMA-Reader-Writer Lock. We analyze the performance with readwrite workloads
    using a microbenchmark. We evaluate with various settings to improve throughput
    in two parameters: handoff in Cohort Lock and maximum performance limit in NUMA-Reader-Writer
    Lock Evaluation shows that throughput improved up to 3% when we apply appropriate
    settings in tunable parameters.


    **Keywords:** NUMA, reader-writer lock


    # 1 Introduction


    Currently, most performance systems use hardware platforms with two or more sockets
    and several cores per socket. In this hardware platform, multicore and multi-socket
    systems use Non-Uniform Memory Access (NUMA) architecture is structured as two
    or more nodes which are connected by local caches and memory. Each cache and memory
    of each node can be accessed by other nodes; however, the access time to inter-node
    is less than to intra-node.


    As the number of cores grows in a NUMA system, parallel programming is key for
    performance since cores operate at the same time. Applications are designed for
    parallel programming, performance is limited by shared resource that can be accessed
    simultaneously. Especially, for shared resource is restricted for performance
    caused by long latencies in NUMA system. The reason for this is inter-node traffic
    after intra-node traffic. By using intra-node, reducing cache traffic, and minimizing
    cache


    misses are key for improving performance of lock algorithm.

    MCS lock [3] is widely known as scalable in shared resource. MCS lock maintains
    a queue-based wait list for acquiring the lock. The head becomes the head of the
    queue-based list and the thread which tries to acquire the lock is added to the
    tail of queue-based list, pointing to itself and on a local variable. When the
    head is added to release the lock, the thread notifies its successor in the queue-based
    list. When the successor receives the notification, it stops spinning and acquires
    the lock, the thread becomes the head of the queue. This lock avoids bursts of
    cache traffic. When a lock is released by permitting only the successor to acquire
    the lock. However, the performance significantly suffered in NUMA system due to
    the inter-node traffic updating and monitoring the tail of the lock.


    The hierarchical Lock (HBO) [4] is designed for reducing remote access. When a
    thread tries to acquire shared resource it waits for a backoff time until the
    lock is expired, and tries to acquire the lock for shared resource again. The
    backoff time can be adapted, so a shared holding thread can shorten the backoff
    to reduce coherence changes. Adaptive lock can reduce cache coherence traffic;
    however, it needs a lock parameter to get scalable result for every platform,
    so cannot give a given performance and fairness issue [2].


    We discussed two locks for the shared resources in multi-threaded, but the performance
    is not scalable in NUMA system. Therefore, we need to analyze the lock in NUMA
    system for further consideration.


    In this paper, we examine the locks designed for the NUMA system, and evaluate
    the performance in readwrite workload scenarios. We also attempt to find out appropriate
    settings to improve throughput in tunable parameters. We describe to analyze the
    scalable NUMA lock in Section 2. We provide an experimental evaluation in Section
    3.'
