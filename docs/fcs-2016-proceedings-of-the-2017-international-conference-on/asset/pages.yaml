  md: '# # Critical Graphs for the Minimum-Vertex-Cover Problem


    Andreas Jakoby(2), Naveen Kumar Goswami, Eik List, Stefan Lucas


    Faculty of Media, Bauhaus-Universität Weimar, Bauhausstr. 11, D-9943, Weimar,
    Germany

    <firstname.lastname>@uni-weimar.de


    **Abstract—** In the context of the chromatic number, a critical graph is an instance
    where the deletion of any element would decrease its chromatic number. Instances
    have shown to be interesting objects of study for deepening the understanding
    of the optimization problem.


    This work introduces critical graphs in context of *Vertex Cover*. We discuss
    their potential for the generation of larger graphs with known solutions. Firstly,
    we propose a parametric-graph generation process which preserves the knowledge
    of the minimum cover. Secondly, we conduct a systematic search for small critical
    graphs. Thirdly, we evaluate the applicability for benchmarking by reporting on
    a series of experiments using the state-of-the-art heuristic solver NuMVC.


    **Keywords:** critical graphs, minimum vertex cover, graph generation, benchmark


    # # 1. Introduction


    *The Vertex Cover Problem.* A vertex cover $C$ for a graph $G = (V, E)$ defines
    a subset of vertices $C \subseteq V$ such that every edge $e \in E$ is incident
    to at least one vertex in $C$. A minimum vertex cover (MVC) is a cover with the
    smallest possible size. The task of finding a minimum cover in a graph is a NP-hard
    optimization problem [3], and its decision version of the 21 original NP-complete
    problems solved by Karp [6]. While the construction of a maximal matching yields
    a tight approximation-2 algorithm, it is NP-hard to approach within a factor of
    2 [7] $P \neq NP$, according to the Unique Games Conjecture; however one can achieve
    an approximation ratio of $2-o(1)$ [5].


    The MVC problem is strongly related to others finding a minimum vertex cover is
    equivalent to finding a Maximum Independent Set (MIS), i.e., a subset of vertices
    where no two vertices share an edge. An instance can also be reduced into an instance
    of Minimum-Size Clique (MVC) and moreover, there is a straight-forward reduction
    of a (binary) Constraint Satisfaction Problem (CSP) to MIS. In practice, the MVC
    problem plays an important role in network security, industrial machine assembly,
    or facility location [7], [8], [16]. Furthermore, MVC algorithms can be used for
    solving problems e.g., in of social networks, pattern recognition, and alignment
    of protein sequences in bioinformatics [8], [10].


    **Critical Graphs.** Graphs are called critical if they are minimal with regards
    to a certain property. More precisely, an edge of graph $G$ is called a critical
    element if its deletion would decrease the minimum cover. The concept of critical
    graphs is mostly used in works on the chromatic number, but it can also be of
    interest for the MVC problem, where we call a graph critical if it is critical
    to help us understand the complexity of the Vertex Cover problem or to find more
    efficient solvers.


    **Randomized Graph Generation.** Critical graphs can serve as base for constructing
    larger graphs. Since critical instances provide an easily determined cover, a
    randomized graph-generation process of criticality could create large instances
    while maintaining the knowledge about the solution. One application could be the
    dedicated generation of hard instances for benchmarking. Following a series of
    previous graph-generation methods [9], the use of critical graphs for the minimum
    vertex cover has been benefited by Xu and al [15], [18] and revised in [12].


    **Contribution.** This work studies critical graphs for the Minimum Vertex Cover
    problem. We propose a new easily applicable graph-generation process which can
    create possible graphs while preserving the knowledge of the minimum cover. To
    implement this efficiently, we restrict the search to a set that ensures a critical
    graph while maintaining the criticality. Secondly, we systematically search for
    small critical instances. As an observation, if all critical graphs for the MVC
    problem were known, our restricted process could generate all possible critical
    graphs. We report on a series of experiments with the state-of-the-art heuristic
    solver NuMVC [11] on instances that were generated by our randomized generation
    process.


    **Outline.** In Section 2 defines critical graphs. Section 3 describes our approach
    for generating random hard graphs from critical graphs. Section 5 presents our
    used instances, Extensions. Section 6 details the details of the experiments and
    Section 7 concludes.'
