    We illustrate our overall record implementation in Figure 1. As shown in Figure
    1, Target thread invokes a system call to provide the service provided by kernel.
    If resources are needed during the system calling, the kernel requires the hardware.
    This communication affects the behavior of the target thread. The Record-Reply
    module in the kernel catches external factors that have a non-deterministic effect
    on the target thread and creates event list in the order processed. The list are
    sent to the Record-Reply monitor. The Record-Reply Monitor processes stores this
    list as the log in the storage.


    The user mode is the user process context that is stored before the jump to kernel
    mode.


    When the target thread shares the shared memory, the Record-Reply module changes
    the access permission of the shared memory page to No Access. When the target
    thread accesses the shared memory, data exception occurs. When an exception occurs
    to shared memory access, the Record-Reply module restores the permission so that
    it can access memory. Next, the data from the shared memory that target thread
    was trying to access. Finally, set a breakpoint interrupt in the user mode address
    where the exception occurred. When return to user mode in kernel mode, the target
    can access shared memory by executing the instruction that caused the exception.
    After that, a breakpoint counter moves to the next instruction, a breakpoint mismatch
    occurs. The Record-Reply module changes the bit of the shared memory page to No
    Access in order to recover the state of the target thread.


