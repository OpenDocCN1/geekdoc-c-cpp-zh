    # 3 Evaluation


    In this section, we evaluated the locks for NUMA system, and analyzed the performance
    by varying write workload ratios. We also experimented with various values in
    two tunable parameters: handoff bound in Cohort Lock and patience limit in NUMA-Reader
    Writer Lock. We implemented all locks in C with GCC 4.6 at optimization level.
    These 18 experiments were conducted on the machine with 2 nodes, 256 CPUs, six
    cores per node, and each lock has two hardware threads, which means a total 24
    hardware threads context.


    Cohort lock be implemented with off-the-shelf locks, a partitioned lock, a MCS
    queue lock, and a simple test-and-setback lock. We implemented two types of cohort
    locks: CTL-TKT and C-MO-MCS. CTL-TKT is implemented for global lock and a partitioned
    lock for a local lock. C-MO-MCS is a simple test-and-setback lock for local lock.
    These cohort locks outperform any combination of cohort lock and NUMA-reader writer
    lock based on de-facto values presented in this section.


    external, outlying sections, probability for reading or writing. Each critical
    section of reading and writing accesses one or two variables with 64 cores. We
    evaluated 4 types of reading and critical section, and time of non-critical section
    elapsed alternately during 10 seconds.


    Figure 1 represents the throughput of various locks in 10 seconds in varying-read
    workload loads. The locks designed for NUMA system show high performance than
    the state-of-the-art locks, mocks, and pivot relax lock. Experimental CW-WP shows
    better performance than the other lock. In read-domain case (Figure 1) (c), CW-WP
    shows higher throughput than other NUMA locks, however, the difference of throughput
    is not noticeable than read-heavy case.


    # 3.2 Tunable parameters to improve the throughput


    There are parameters to improve throughput in Cohort Lock and NUMA-Reader Writer
    Lock. In Cohort Lock, handoff bound is a parameter to prevent a starvation by
    releasing a lock if one node specifies sequentially performed critical section
    until encounter occurs. We evaluated with four values of handoff bound in CTL-TKT
    lock during 10 seconds as a game to Figure 1(b). Table 1a) shows the throughput
