  md: '# Figure 1-7 Arduino Bluetooth


    ![](img/6426909fcee15359dcfa665c8698110f_28_0.png)


    # Figure 1-8 Arduino Lilypad


    # Other “Official” Boards


    The previously described Arduino boards constantly changes are the most useful
    and popular ones. However, the range of Arduino boards constantly changes, so
    for a complete and up-to-date picture of the Arduino family, see the official
    Arduino website list at http://www.arduino.cc/en/Main/Hardware.


    # Arduino Clones and Variants


    Unofficial boards fall into two categories. Some just take the standard open source
    hardware designs of Arduino and build a cheaper one. Some names you can search
    for boards of this nature include the following:


    +   * Roboduino

    * Freedino

    * Seeeduino (yes, with three e’s)'
