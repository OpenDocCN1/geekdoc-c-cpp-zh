  md: "As an answer to this problem, coding standards are often laid down to encourage\
    \ everyone to lay out his or her code in the same way and adopt “good practice”\
    \ when writing programs.\n\nThe C language has a de facto standard that has evolved\
    \ over the years, and this book is generally faithful to that standard.\n\n# Indentation\n\
    \nIn the example sketches you have seen, you can see that we often indent the\
    \ program code from the left margin. So, for example when defining a void function,\
    \ the keyword is at the left margin, as is the opening curly brace on the next\
    \ line, but then all the text within the curly braces is indented. The amount\
    \ of indentation does not really matter. Some people use two spaces, some four.\
    \ You can also press Tab to indent. In this book, we use two spaces for indentation.\n\
    \nIf you were to have an if statement inside a function definition, then again\
    \ you would add two more spaces for the lines within the curly braces of the if\
    \ command, as in the following example:\n\n```\nvoid loop()\n{\n  static int count\
    \ = 0;\n  count++;\n  if (count == 20)\n{\n    count = 0;\n    delay(3000);\n\
    \  }\n}\n```\n\nYou might include another if inside the first if, which would\
    \ add yet another level of indentation, making six spaces from the left margin.\n\
    \nAll of this might sound a bit trivial, but if you ever sort through someone\
    \ else’s badly formatted sketches, you will find it very difficult.\n\n# Opening\
    \ Braces\n\nThere are two schools of thought as to where to put the first curly\
    \ brace in a function definition, if statement, or for loop. One way is to place\
    \ the curly brace on the line after the rest of the command, as we have in all\
    \ the examples so far, or put it on the same line, like this:"
