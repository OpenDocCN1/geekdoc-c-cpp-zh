  md: "```\ni = 0;\nwhile (i < 20)\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  i++;\n}\n```\n\nThe expression\
    \ in parentheses after while must be true to stay in the loop. When it is no longer\
    \ true, then the sketch continues running the commands after the final curly brace.\n\
    \n# The #define Directive\n\nFor constant values pin assignments that do not change\
    \ during the running of a sketch, there is an alternative to using a variable.\
    \ You can use a command called #define that allows you to associate a value with\
    \ a name. Wherever this name appears in your sketch, the value will be substituted\
    \ before the sketch is compiled.\n\nAs an example, you could define a pin assignment\
    \ for a LED like this:\n#define ledPin 13\n\nNote that the #define directive does\
    \ not use “=” between the name and the value. it does not even need a \";\" on\
    \ the end. This is because it is not actually part of the C language itself; but\
    \ is called a pre-compiler directive that is run before compilation.\n\nThis approach,\
    \ in the author's opinion, is less easy to read than using a variable, but it\
    \ does have the advantage that you do not use any memory to store it. It is something\
    \ to consider if memory is at a premium.\n\n# Conclusion\n\nThis chapter has got\
    \ you started with C. You can make LEDs blink in various exciting ways and get\
    \ the Arduino to send results back to you over the USB by using the Serial.println\
    \ function. You also worked out how to use if and for commands to control the\
    \ order in which your commands are executed, and learned a little about making\
    \ some arithmetic.\n\nIn the next chapter, you will look more closely at functions.\
    \ The chapter will also introduce the variable types other than the int type that\
    \ you used in this chapter."
