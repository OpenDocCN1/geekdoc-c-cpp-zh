- img_proc: true
  md: "The variable tempFloat contains the floating point value. The (int) command\
    \ is called a type cast and is used to convert a variable from one type to another\
    \ compatible type. In this case, the type cast converts the float of (for example)\
    \ 20.25 to an int that will simply truncate the number to 20.\n\nIf you know the\
    \ highest temperature you care about is 60 degrees Celsius and that the lowest\
    \ is 0 degrees Celsius, you could multiply every temperature by 4 before converting\
    \ it to a byte and saving. When you read the data back from EEPROM, you can divide\
    \ by 4 to get a value that has a precision of 0.25 of a degree.\n\nThe following\
    \ code example (sketch 8-04) saves such a temperature into EEPROM, then reads\
    \ back and displays it in the Serial Monitor as:\n\n```\n//sketch 8-04\n\n#include\
    \ <EEPROM.h>\n\nvoid setup() {\n  float tempFloat = 20.7575;\n  byte tempByte\
    \ = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\nbyte tempByte2 = EEPROM.read(0);\n\
    \  float temp2 = (float)tempByte2 / 4;\n  Serial.begin(9600);\n  Serial.println(\"\
    \\n\\n\\n\");\n  Serial.println(temp2);\n}\n\nvoid loop() {\n```\n\nThere are\
    \ other means of compressing data. For instance, if you are taking readings that\
    \ change slowly—again, changes in temperature are a good example of this—then\
    \ you can record the first temperature at full resolution and then just record\
    \ the changes in temperature from the previous reading. This change will generally\
    \ be small and occupy fewer bytes.\n\n# Conclusion\n\nYou now know a little about\
    \ how to make your data hang around after the power has gone off. In the next\
    \ chapter, you will look at LCD displays."
