  md: "# Figure 3-6 The Serial Monitor\n\nAs you would expect, there is a built-in\
    \ function that you can use in your sketches to send a message to the Serial Monitor.\
    \ It is called Serial.println and it expects a single argument, which consists\
    \ of the information that you want to send. This information is usually a variable.\n\
    \nYou will use this mechanism to test out a few things that you can do with variables\
    \ and arithmetic in C; frankly, it's the only way you can see the results of your\
    \ experiments in C.\n\n# Numeric Variables and Arithmetic\n\nThe last thing you\
    \ did was add the following line to your blinking sketch to increase the blinkingPeriod\
    \ steadily.\ndelayPeriod = delayPeriod + 100;\n\nLooking closely at this, it consists\
    \ of a variable name, then an equals sign, then what is called an expression (delayPeriod\
    \ + 100). The equals sign does something called assignment. That is, it assigns\
    \ a new value to a variable, and the value it assigns is determined by what comes\
    \ after the equals sign and before the semicolon. In this case, the new value\
    \ to be given to the delayPeriod variable is the old value of delayPeriod plus\
    \ 100.\n\nLet's test out this mechanism to see what the Arduino is up to by entering\
    \ the following sketch, running it, and opening the Serial Monitor:\n\n```\n//\
    \ sketch 3-04\nvoid setup() {\n  Serial.begin(9600);\n  int a = 2;\n  int b =\
    \ 2;\n  int c = a + b;\n  Serial.println(c);\n}\nvoid loop() {\n}\n```"
  merge: -1
  pgno: 51
- img_proc: true
  md: "Figure 3-7 shows what you should see in the Serial Monitor after this code\
    \ runs.\n\nTo take a slightly more complex example, the formula for converting\
    \ a temperature in degrees Centigrade to degrees Fahrenheit is to multiply by\
    \ 5, divide by 9, and then add 32. So you could write that in a sketch like this:\n\
    \n![](img/6426909fcee15359dcfa665c8698110f_52_0.png)\n\n# Figure 3-7 Simple arithmetic\n\
    \n```\n// sketch 3-05\nvoid setup() \n{\n  Serial.begin(9600);\n  int degC = 20;\n\
    \  int degF;\n  degF = degC * 9 / 5 + 32;\n  Serial.println(degF);\n}\nvoid loop()\
    \ {\n}\n```\n\nThere are a few things to notice here. First, note the following\
    \ line:\nint degC = 20;\n\nWhen we write such a line, we are actually doing two\
    \ things: We are declaring an int variable called degC, and we are saying that\
    \ its initial value will be 20. Alternatively, you could separate these two things\
    \ and write the following:\n\n```\nint degC;\ndegC = 20;\n```\n\nYou must declare\
    \ any variable just once, essentially telling the compiler what type of variable\
    \ it is—in this case, int. However, you can assign the variable a value as many\
    \ times as you want:\n\n```\nint degC;\ndegC = 20;\ndegC = 30;\n```"
  merge: -1
  pgno: 52
- img_proc: true
  md: 'So, in the Celsius to Fahrenheit example, you are defining the variable degC
    and giving an initial value of 20, but when you define degF, it does not get an
    initial value. Its value gets assigned on the next line, according to the conversion
    formula, before being sent to the Serial Monitor for you to see.


    Looking at the expression, you can see that the asterisk (*) for multiplication
    and the slash (/) for division. the arithmetic operators +, *, and have an order
    of precedence—that is, multiplications are done first, then additions and subtractions.
    This is in accordance with the usual use of arithmetic. However, sometimes it
    makes it clearer to use parentheses in the expressions. So, for example, you could
    write the following:


    ```

    degF = ((degC * 9) / 5) + 32;

    ```


    The expressions that you write can be long and complex as you need them to be,
    and in addition to the usual arithmetic operators, there are other less commonly
    used operators and a big collection of various mathematical functions that are
    available to you. You will learn about these later.


    # Commands


    The C language has a number of built-in commands. In this section, we explore
    some of these and see how they can be of use in your sketches.


    # if


    In our sketches so far, we have assumed that your lines of programming will be
    executed in one order after the other, with no exceptions. But what if you don''t
    want to do that? What if you only want to execute part of a sketch if some condition
    is true?


    Let’s return to our gradually slowing-down Blinking LED example. At the moment,
    it will get slower and slower until each blink is lasting hours. Let’s look at
    how we can change it so that once it has slowed down to a certain point, it goes
    back to its fast starting speed.


    To do this, you must use an if command; the modified sketch is as follows. Try
    it out.'
  merge: -1
  pgno: 53
- img_proc: true
  md: "```\n// sketch 3-06\nint ledPin = 13;\nint delayPeriod = 100;\n\nvoid setup()\
    \ {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin, HIGH);\n\
    \  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  delayPeriod = delayPeriod + 100;\n  if (delayPeriod > 3000) {\n    delayPeriod\
    \ = 100;\n  }\n}\n```\n\nThe if command looks a little like a function definition,\
    \ but this resemblance is only superficial. The word in the parenthesis is not\
    \ an argument; it is what is called a condition. In this case, the is is the variable\
    \ delayPeriod has a value that is greater than 3,000. If this is true, the commands\
    \ inside the curly braces will be executed. In this case, the code sets the value\
    \ of delayPeriod back to 100.\n\nIf the condition is not true, then the Arduino\
    \ will continue on the next thing. In this case, there is nothing after the “if”,\
    \ so the Arduino will run the loop function again.\n\nRunning through the sequence\
    \ of events in your head will help you understand what is going on. So, here is\
    \ what happens:\n\n+   1. Arduino runs setup and initializes the LED pin to be\
    \ an output.\n2. Arduino starts running loop.\n3. The LED turns on.\n4. A delay\
    \ occurs.\n5. The LED turns off.\n6. A delay occurs.\n7. Add 100 to the delayPeriod.\n\
    8. If the delay period is greater than 3,000 set it back to 100.\n9. Go back to\
    \ step 2.\n\nWe used the symbol <, which means less than. It is one example of\
    \ what are called comparison operators. These operators are summarized in the\
    \ following table:"
  merge: -1
  pgno: 54
- img_proc: true
  md: "| Operator | Meaning | Examples | Result |\n| --- | --- | --- | --- |\n| <\
    \ | Less than | 9 < 10<br>10 < 10 | true<br>false |\n| > | Greater than | 10 >\
    \ 10<br>10 > 9 | true |\n| <= | Less or equal to | 9 <= 10<br>10 <= 10 | true<br>true\
    \ |\n| >= | Greater or equal to | 10 >= 10<br>10 >= 9 | true<br>true |\n| == |\
    \ Equal to | 9 == 9 | true |\n != | Not equal to | 9 != 9 | false |\n\nTo compare\
    \ two numbers, you use the == command. This double equals sign is easily confused\
    \ with the character =, which is used to assign values to variables.\n\nThere\
    \ is another form of if that allows you to do one thing if the condition is true\
    \ and another if it is false. We will use this in some practical examples later\
    \ in the book.\n\n# for\n\nIn addition to executing different commands under different\
    \ circumstances, you often will want to run a series of commands a number of times\
    \ in a program. You already know one way of doing this, using the loop function.\
    \ As soon as all the commands in the loop function have been run, it will start\
    \ again automatically. However, sometimes you need more control than that.\n\n\
    So, for example, let's say that you want to write a sketch that blinks 20 times,\
    \ then paused for 3 seconds, and then started again. You could do that by just\
    \ repeating the same code over and over again in your loop function, like this:"
