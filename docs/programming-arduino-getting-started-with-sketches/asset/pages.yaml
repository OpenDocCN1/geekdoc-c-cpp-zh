  md: '# Bit Manipulation


    | Function | Description | Example |

    | --- | --- | --- |

    | abs | Returns the unsigned value of its argument. | abs(12) returns 12 abs(-12)
    returns 12 |

    | constrain | Constrains a number to stop it from exceeding a range. The first
    argument is the number to constrain, the second is the start of the range, and
    the third is the end of the allowed numbers. | constrain(8, 1, 10) returns 8 constrain(11,
    1, 10) returns 10 constrain(0, 1, 10) returns 1 |

    | map | Maps a number in one range into another range. The first argument is the
    number to map, the second and third are the "from" range (or source range), and
    the last two are the "to" range (or destination range). The function is useful
    for remapping input values. | map(x, 0, 1023, 5000) |

    | max | Returns the larger of its two arguments. | max(10, 11) returns 11 |

    | min | Returns the smaller of its two arguments. | min(10, 11) returns 10 |

    | pow | Returns the first argument raised to the power of the second argument.
    | pow(2, 5) returns 32 |

    | sqrt | Returns the square root of a number. | sqrt(16) returns 4 |

    | sin, cos, tan | Perform trigonometric functions. They are not often used. |
    |

    | log | Calculates the temperature from a logarithmic thermometer (for example).
    | |


    A bit is a single digit of information, that is, either 0 or 1. The word bit is
    a contraction of binary digit. Most of the time, you use int variables that actually
    comprise 16 bits This is bit wasteful if you only need to store a single true/false
    value (1 or 0). Actually, unless you are running short of memory, being wasteful
    is less of a problem than creating difficult-to-understand code, but sometimes
    it is useful to pack data tightly.


    Each bit in the int can be thought of as having a decimal value, and you can find
    the decimal value of the int by adding the values of all the bits that are a 1.
    So in Figure 7-2, the decimal value of the int would be 38. Actually, it gets
    more complicated to deal with negative numbers, but that happens when the leftmost
    bit becomes a 1.


    When you are thinking about individual bits, decimal values do not really work
    well. In a decimal number such as 123. For that reason, programmers often use
    called hexadecimal, or more commonly, just hex. Hex is number base 16. So instead
    of having digits 0 to 9, you have six extra digits, A to F. This means that each
    hex digit represents four bits. The following table shows the relationship among
    decimal, hex, and binary with the numbers 0 to 15:'
  merge: -1
  pgno: 114
- img_proc: true
  md: '| Decimal | Hex | Binary (Four Digit) |

    |---|---|--|

    | 0 | 0 | 0000 |

    | 1 | 1 | 0001 |

    | 2 | 2 | 0010 |

    | 3 | 3 | 0011 |

    | 4 | 4 | 0100 |

    | 5 | 5 | 0101 |

    | 6 | 6 | 0110 |

    | 7 | 7 | 0111 |

    | 8 | 8 | 1000 |

    | 9 | 9 | 1001 |

    | 10 | A | 1010 |


    | Decimal | Hex | Binary (Four Digit) |

    |---|---|--|

    | 11 | B | 1011 |

    | 12 | C | 1100 |

    | 13 | D | 1101 |

    | 14 | E | 1110 |

    | 15 | F | 1111 |


    So, in hex, any int can be represented as a four-digit hex number. Thus, the binary
    number 10001100 would be 8C. The C language has a special syntax for using hex
    numbers. You can assign a hex value to an int as follows:


    ```

    int x = 0x8C;

    ```


    The Arduino standard library provides some functions that let you manipulate the
    16 bits within an int individually. The function bitRead returns the value of
    a particular bit in an int; so, for the following example would assign the value
    0 to the variable called bit:


    ```

    int x = 0x8C; // 10001100

    int bit = bitRead(x, 0);

    ```


    In the second argument, the bit position starts at 0 and goes up to 15. It starts
    with the least significant bit. The rightmost bit is bit 0, the next bit to the
    left is bit 1, and so on.


    As you would expect, counterpart to bitRead is bitWrite, which takes three arguments.
    The first is the number to manipulate, the second is the bit position, and the
    third is the bit value. The following example changes the value of the int from
    2 to 3 (in decimal or hex):


    ```

    int x = 2; // 0010

    bitWrite(x, 0, 1);

    ```'
