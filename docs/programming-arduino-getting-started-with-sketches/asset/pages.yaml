- img_proc: true
  md: '# # 4

    Functions


    This chapter focuses mostly on the type of functions that you can write yourself
    rather than the built-in functions as digitalWrite and delay that are already
    defined for you.


    The reason that you need to be able to write your own functions is that sketches
    start to get a little complicated, then your setup and loop functions will grow
    and grow until they are long and complicated and it becomes difficult to see how
    they work.


    The biggest problem in software development of any sort is managing complexity.
    The best programmers write software that is easy to look at and understand and
    requires very little in the way of explanation.


    Functions are a key tool in creating easy-to-understand sketches that can be changed
    without difficulty or risk of the whole thing falling into a crumpled mess.


    #  What Is a Function?


    A function is a little like a program within a program. You can use it to wrap
    up some little thing that you want to do. A function that you define can be called
    from anywhere in your sketch and contains its own variables and its own list of
    commands. When the commands have been run, execution returns to the point just
    after wherever it was in the code that called the function.


    By way of an example, code that flashes a light-emitting diode (LED) is a prime
    example of some code that should be put in a function. So let’s modify our basic
    “blink 20 times” sketch to use a function that we will create called flash:'
  merge: -1
  pgno: 61
- img_proc: true
  md: "```\n// sketch 4-01\nint ledPin = 13;\nint delayPeriod = 250;\n\nvoid setup()\
    \ {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  for (int i = 0; i < 20;\
    \ i++) {\n    flash();\n  }\n  delay(3000);\n}\n\nvoid flash() {\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    }\n```\n\nSo, all we have really done here is to move the four lines of code that\
    \ flash the LED from the middle of the for loop to be in a function of their own\
    \ called flash. Now you can make the LED flash any time you like by calling the\
    \ new function by writing flash(). Note the empty parentheses after the function\
    \ name. This indicates that the function does not take any parameters. The delay\
    \ value that it uses is set by the same delayPeriod that you used before.\n\n\
    # Parameters\n\nWhen dividing your sketch into functions, it is often worth thinking\
    \ about what service a function could provide. In the case of flash, this is fairly\
    \ obvious. But this time, let's give this function parameters that tell it both,\
    \ how many times to flash and how short or long the flashes should be. Read through\
    \ the following code and then I will explain just how parameters work in a little\
    \ more detail."
  merge: -1
  pgno: 62
- img_proc: true
  md: "```\n// sketch 4-02\nint ledPin = 13;\nint delayPeriod = 250;\n\nvoid setup()\
    \ {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  flash(20, delayPeriod);\n\
    \  delay(3000);\n}\n\nvoid flash(int numFashes, int d) {\n  for (int i = 0; i\
    \ < numFashes; i++) {\n    digitalWrite(ledPin, HIGH);\n    delay(d);\n    digitalWrite(ledPin,\
    \ LOW);\n    delay(d);\n  }\n}\n```\n\nNow, if we look at our loop function, it\
    \ has only two lines in it. We have moved the bulk of the work off to the flash\
    \ function. Notice how when we call flash we now supply it with two arguments\
    \ in parentheses.\n\nWhere we define the function at the bottom of the sketch,\
    \ we have to declare the type of variable in the parameters. In this case, they\
    \ are both ints. We are in fact defining new variables. However, these variables\
    \ (numFlashes and d) can only be used within the flash function.\n\nThis is a\
    \ good function because it wraps up everything you need in order to flash an LED.\
    \ The only information that it needs from outside of the function is to which\
    \ pin the LED is attached. If you wanted, you could make this a parameter too—something\
    \ that would be well worth doing if you had more than one LED attached to your\
    \ Arduino.\n\n# Global, Local, and Static Variables\n\nAs was mentioned before,\
    \ parameters to a function can be used only inside that function. So, if you wrote\
    \ the following code, you would get an error:"
  merge: -1
  pgno: 63
- img_proc: true
  md: "```\nvoid indicate(int x)\n{\n    flash(x, 10);\n}\nx = 15;\n```\n\nOn the\
    \ other hand, suppose you wrote this:\n\n```\nint x;\nvoid indicate(int x)\n{\n\
    \    flash(x, 10);\n}\nx = 15;\n```\n\nThis code would not result in a compilation\
    \ error. However, you need to be careful, because you now actually have two variables\
    \ called x and they can each have different values. The one that you declared\
    \ on the first line is called a global variable. because it can be used anywhere\
    \ you like in the program, including inside any functions.\n\nHowever, because\
    \ you use the same variable name x inside the function, as a parameter, you cannot\
    \ use the global variable whenever you refer to x inside the function, the \"\
    local\" version of x has priority. The parameter x is said to shadow the global\
    \ variable of the same name. This can lead to some confusion when trying to debug\
    \ a project.\n\nIn addition to defining parameters, you can also define variables\
    \ that are not parameters but are just for use within a function. These are called\
    \ local variables. For example:\n\n```\nvoid indicate(int x)\n{\n    int timesToFlash\
    \ = x * 2;\n    flash(timesToFlash, 10);\n}\n```\n\nThe local variable timesToFlash\
    \ will only exist while the function is running. As soon as the function has finished\
    \ its last command, it will disappear. This means that local variables are not\
    \ accessible from anywhere in your program other than in the function in which\
    \ they are defined.\n\nSo, for instance, the following example will cause an error:\n\
    \n```\nvoid indicate(int x)\n{\n    int timesToFlash = x * 2;\n    flash(timesToFlash,\
    \ 10);\n}\n```\n\ntimesToFlash = 15;"
  merge: -1
  pgno: 64
- img_proc: true
  md: "Seasoned programmers generally treat global variables with suspicion. The reason\
    \ is that they go against encapsulation. The idea of encapsulation is that you\
    \ should wrap up in a package everything that has to do with a particular feature.\
    \ Hence functions are great for encapsulation. The problem with \"globals\" (as\
    \ global variables are often called) is that they generally get defined at the\
    \ beginning of a sketch and may be used all over the sketch. Sometimes there is\
    \ a legitimate reason for this. Other times, people use them in a lazy way when\
    \ it would be far more appropriate to pass parameters. In our examples so far,\
    \ ledPin is a good use of a global variable. It's very convenient and easy to\
    \ find up at the top of the sketch, making it easy to change. ledPin is really\
    \ a constant, although you may change it and then recompile your sketch, which\
    \ is actually running. For this reason, you may prefer to use the #define command\
    \ we describe in Chapter 3.\n\nAnother feature of local variables is that their\
    \ value is initialized every time the function is run. There is nowhere more (and\
    \ often inconvenient) in the loop function of an Arduino sketch. Let's try and\
    \ use a local variable in place of global variable in one of the examples from\
    \ the previous chapter:\n\n```\n// sketch 4-03\nint ledPin = 13;\nint delayPeriod\
    \ = 250;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  int\
    \ count = 0;\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  count++;\n  if (count == 20) {\n    count =\
    \ 0;\n    delay(3000);\n  }\n}\n```\n\nSketch 4-03 is based on the sketch 3-09,\
    \ but attempts to use a local variable instead of the global variable to count\
    \ the number of flashes.\n\nThis sketch is broken. It will not work, because every\
    \ loop is run, the variable count will be given the value 0 again, so count will\
    \ never reach 20 and the LED will keep flashing forever. The whole reason that\
    \ we made count global in the first place was that its value would not be reset.\
    \ The only place that we use count is in the loop function, so this is where it\
    \ should be placed."
  merge: -1
  pgno: 65
- img_proc: true
  md: "Fortunately, there is a mechanism in C that gets around this conundrum. It\
    \ is the keyword static. When you use the keyword static in a variable declaration\
    \ in a function, it has the effect of initializing the variable only the first\
    \ time that the function is run. Perfect! That's what is required in this situation.\
    \ We can keep our variable in the function where it's used without it getting\
    \ set back to 0 every time the function runs. Sketch 4-04 shows this in operation:\n\
    \n```\n// sketch 4-04\nint ledPin = 13;\nint delayPeriod = 250;\nvoid setup()\
    \ {\n    pinMode(ledPin, OUTPUT);\n}\nvoid loop() {\n    static int count = 0;\n\
    \    digitalWrite(ledPin, HIGH);\n    delay(delayPeriod);\n    digitalWrite(ledPin,\
    \ LOW);\n    delay(delayPeriod);\n    count++;\n    if (count == 20) {\n     \
    \   count = 0;\n        delay(3000);\n    }\n}\n```\n\n# Return Values\n\nComputer\
    \ science, as an academic discipline, has as its parents mathematics and engineering.\
    \ This heritage lingers on in many of the names associated with programming. The\
    \ word function is itself a mathematical term. In mathematics, the input to the\
    \ function (the argument) completely determines the output. We have written functions\
    \ that take an input, but none that gives us back a value. All our functions have\
    \ been \"void\" functions. If a function returns a value, then you specify a return\
    \ type.\n\nLet's look at writing a function that takes a temperature in degrees\
    \ Centigrade and returns the equivalent in degrees Fahrenheit:\n\n```\nint centToFaren(int\
    \ c)\n{\n    int f = c * 9 / 5 + 32;\n    return f;\n}\n```"
  merge: -1
  pgno: 66
- img_proc: true
  md: "The function definition now starts with int rather than void to indicate that\
    \ the function will return an int to whatever it calls. This might be a bit of\
    \ code that looks like this:\nint pleasantTemp = centToFaren(20);\n\nAny non-void\
    \ function has to have a return statement in it. If you do not put one in, the\
    \ compiler will tell you it is missing. You can have more than one return in the\
    \ same function. This might arise if you have an if statement with alternative\
    \ actions based on some condition. Some programmers frown upon this, but if your\
    \ functions are small (as all functions should be), then this practice will not\
    \ be a problem.\n\nThe value after return can be an expression; it does not have\
    \ to be the name of a variable. So you could compress the preceding example into\
    \ the following:\n\n```\nint centToFaren(int c)\n{\n  return (f = c * 9 / 5 +\
    \ 32);\n}\n```\n\nIf the expression being returned is more than just a variable\
    \ name, then it should be enclosed in the preceding example.\n\n# Other Variable\
    \ Types\n\nAll our examples of variables so far have been int variables. This\
    \ is by far the most commonly used variable type, but there are some others that\
    \ you should be aware of.\n\n# floats\n\nOne such type, which is relevant to the\
    \ previous temperature conversion example, is float. This variable type represents\
    \ floating point numbers—that is, numbers that may have a decimal point in them,\
    \ such as 1.23. You need this variable type when numbers are not precise enough.\n\
    \nNote the following formula:\n\n```\nf = c * 9 / 5 + 32\n```\n\nIf you give c\
    \ the value then, 17 f will be 17 * 9 / 5 + 32 or 62.6. But if f is an int, then\
    \ the value will be truncated to 62.\n\nThe problem becomes even worse if we are\
    \ not careful of the order in which we evaluate things. For instance, suppose\
    \ that we did the division first, as follows:\n\n```\nf = (c / 5) * 9 + 32\n```"
  merge: -1
  pgno: 67
- img_proc: true
  md: "Then in normal math terms, the result would still be 62.6, but if all the numbers\
    \ are ints, then the calculation would proceed as follows:\n\n+   1. 17 is divided\
    \ by 5, which gives 3.4, which is then truncated to 3.\n\n+   2. 3 is then multiplied\
    \ by 9 and 32 is added to get a result of 59—which is quite a long from 62.6.\n\
    \nFor circumstances like this, we can use floats. In the following example, our\
    \ temperature conversion function is rewritten to use floats:\n\n```\nfloat centToFaren(float\
    \ c)\n{\n  float f = c * 9.0 / 5.0 + 32.0;\n  return f;\n}\n```\n\nNotice how\
    \ we have added .0 to the end of our constants. This ensures that the compiler\
    \ knows to treat them as floats rather than ints.\n\n# boolean\n\nBoolean values\
    \ are logical. They have a value that is either true or false.\n\nIn the C language,\
    \ Boolean is spelled with a lowercase b, but in general use, Boolean has an uppercase\
    \ initial letter, as it is named after the mathematician George Bool, who invented\
    \ the Boolean logic that is crucial to computer science.\n\nYou may not realize\
    \ it, but you have already met Boolean values when we were looking at the command.\
    \ The condition in an if statement, as (count == 20), is actually an expression\
    \ that yields a boolean result. The operator == is a comparison operator. Whereas\
    \ it is an arithmetic operator that adds two numbers together, == is a comparison\
    \ operator that compares two numbers and returns a value of true or false.\n\n\
    You can define variables and use them as follows:\n\n```\nboolean tooBig = (x\
    \ > 10);\n{\n  x = 5;\n}\n```\n\nBoolean values can be manipulated using Boolean\
    \ operators, similar to how you can perform arithmetic on numbers, Boolean values.\
    \ The most commonly used Boolean operators are and, which is written as &&, and\
    \ or, which is written as ||.\n\nFigure 4-1 shows true tables for the and and\
    \ or operators.\n\nFrom the truth tables in Figure 4-1, you can see that for and,\
    \ if both A and B are true,"
