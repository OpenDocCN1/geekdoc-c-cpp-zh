- img_proc: true
  md: '![](img/6426909fcee15359dcfa665c8698110f_103_0.png)


    # Figure 6-9 Using a wire as a switch


    By putting a delay here, nothing else can happen for 500 milliseconds, by which
    time any bouncing will have subsided. You should find that this makes the toggling
    much more reliable. An interesting side-effect is that if you hold the button
    down, the LED just keeps flashing.


    If that is all to the sketch, then this delay is not a problem. However, if you
    do more in the loop, then using a delay can be a problem; for example, the program
    would be unable to detect the press of any other button during that 500 milliseconds.


    So, this approach is sometimes not good enough and you will need to be a bit more
    sophisticated. You can write your own advanced debouncing code by hand, but doing
    so gets complicated and fortunately fine folks have done all the work for you.'
