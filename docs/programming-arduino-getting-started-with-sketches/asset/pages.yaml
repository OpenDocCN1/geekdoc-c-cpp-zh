  md: "# Figure 5-4 Serial communication with an Arduino\n\nThis communication happens\
    \ regardless of what your sketch is doing. So, even though you may be merrily\
    \ flashing LEDs, data will still arrive in the buffer and sit there until you\
    \ are ready to read it. You can think of the buffer as a bit like an e-mail inbox.\n\
    \nThe way that you check to see whether you \"have mail\" is to use the function\
    \ Serial.available(). This function returns the number of bytes in the buffer\
    \ that are waiting for you. If there are no messages waiting to read, the function\
