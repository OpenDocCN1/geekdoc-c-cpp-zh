  md: "```\n//sketch 7-01\n\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\\\
    {\n  int number = random(1, 7);\n  Serial.println(number);\n  delay(500);\n}\n\
    ```\n\nIf you upload this sketch to your Arduino and open the Serial Monitor,\
    \ you will see something like Figure 7-1.\n\nIf you run this a few times you will\
    \ probably be surprised to see that, every time you run the sketch, you get the\
    \ same series of ‘random’ numbers.\n\nThe output is not really random; the numbers\
    \ are called pseudo-random numbers because they have a random distribution. That\
    \ is, if you ran this sketch and collected a million numbers, you would get pretty\
    \ much the same number of ones, twos, threes, and so on. The numbers are not random\
    \ in the sense of being unpredictable. In fact, it is against the workings of\
    \ a microcontroller to be random that it just can’t do without some intervention\
    \ from the real world.\n\n![](img/6426909fcee15359dcfa665c8698110f_112_0.png)\n\
    \n# Figure 7-1 Random numbers\n\nYou can provide this intervention to make your\
    \ sequence of numbers less predictable by seeding the random number generator.\
    \ This basically gives it a starting point for the sequence. But, if you think\
    \ about it, you cannot use random to seed the random number generator. A commonly\
    \ used trick is to use the fact that (as discussed in the previous chapter) an\
    \ analog input will float. You can use the value read from an analog input to\
    \ seed the random number generator.\n\nThe function that does this is called randomSeed.\
    \ Sketch 7-02 shows how you can add"
