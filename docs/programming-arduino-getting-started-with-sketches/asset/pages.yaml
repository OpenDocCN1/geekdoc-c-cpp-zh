    You can combine these operators into Boolean expressions in your if statements,
    as the following example illustrates:

    ((x > 10) && (x < 50))


    # Other Data Types


    As you have seen, the int and occasionally the float data types are fine for most
    situations; however, some other numeric types can be useful under some circumstances.
    In an Arduino sketch, the int type uses 16 bits (binary digits). This allows it
    to represent numbers between -32767 and 32768.


    Other data types available to you are summarized in Table 4-1. This table is provided
    mainly for reference. You will use some of these other types as you progress through
    the book.'
