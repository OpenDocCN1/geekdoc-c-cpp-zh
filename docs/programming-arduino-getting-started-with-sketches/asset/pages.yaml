    \ The sole purpose of comments is to be a reminder to you or others as to why\
    \ the code is written as it is. A comment line may also be used to present a title.\n\
    \nThe compiler will completely ignore any text that is marked as being a comment.\
    \ We have included comments as titles at the top of many of the sketches in the\
