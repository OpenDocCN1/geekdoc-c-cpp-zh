    # # Conclusion


    There is more to C++ and to writing libraries, but this chapter should get you
    started. It should also be sufficient for most of what you are likely to do with
    an Arduino. Arduinos are small devices and the temptation is often to overengineer
    solutions that could otherwise be very simple and straightforward.


    That concludes the main body of this book. For further information on Arduino
    and where to go next, a good starting point is always the official Arduino website
    at'
