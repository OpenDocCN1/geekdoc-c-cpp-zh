  md: "# 8\nData Storage\n\n**When you give values to variables, the Arduino board\
    \ will remember those values only as long as the power is on. The moment you turn\
    \ the power off or reset the board, all that data is lost.**\n\nIn this chapter,\
    \ we look at some ways to hang on that data.\n\n# Constants\n\nIf the data that\
    \ you want to store does not change, then you can just set the data up each time\
    \ that the Arduino starts. An example of this approach is the case in the letters\
    \ array in your Morse code translator of [Chapter 5](# (sketch 5-05).\n\nYou used\
    \ the following code to define a variable of the correct size and fill it with\
    \ the data you need:\n\n```\nchar* letters[] = {\n    \"\", \"\", \"\", \"\",\
    \ \"\", \"\", \"\", // A-I\n    \"\", \"\", \"\", \"\", \"\", \"\", \"\", // J-R\n\
    \    \"\", \"\", \"\", \"\", \"\", \"\", \"\", // S-Z\n    \"\", \"\", \"\", \"\
    \"\n};\n```\n\nYou may remember that you did the calculation and decided that\
    \ you had plenty of memory 2K to save. However, if memory was a bit tight, it\
    \ would be far better to be able to store this data in the 32K of flash memory\
    \ used to store programs, rather than the 2K of RAM. It is a means of doing this.\
    \ It is a directive called PROGMEN; it lives in a library and is a bit awkward\
    \ to use.\n\n# The PROGMEM Directive\n\nTo store your data in flash memory, you\
    \ have to include the PROGMEM library as follows:\n\n```\n#include <avr/pgmspace.h>\n\
    ```"
  merge: -1
  pgno: 121
- img_proc: true
  md: 'The purpose of this command is to tell the compiler the pgmspace library for
    this sketch. a library is a set of functions that someone else has written and
    that you can use in your sketches without having to understand all the details
    of how those functions work.


    Because you are using this library, the PROGM keyword and the pgm_read_word function
    are available. You will use both in the sketches that follow.


    This library is included as part of the Arduino software and is an officially
    supported Arduino library. A good collection of such official libraries is available,
    and many unofficial libraries, developed by people like you and made for others
    to use, are also available on the Internet. Such unofficial libraries must be
    installed into your Arduino environment. You will learn more about these libraries,
    as well as how to write your own libraries, in Chapter 11.


    When using PROGM, you have to make sure that you use special PROGMfriendly data
    types. Unfortunately, that does not include an array of char arrays. You actually
    have to define a variable for each using a PROGM string type and then put them
    all in a PROGM array type, like this:


    ```

    PROGM prog_char sa[] = "-\-";

    PROGM prog_char sb[] = "-\-\-";

    // and so on for all letters

    PROGM const char* letters[] = {

    A, sB, sC, sD, sE, sF, sG, sH, sI, sJ, sK, sL, sM,

    N, sO, sP, sQ, sR, sS, sT, sU, sV, sW, sX, sY, sZ};

    ```


    I have not listed sketch 8-01 here, as it is a little lengthy, but you may wish
    to load it and verify that it works the same way as the RAM-based version.


    In addition to creating the data string in a special way, you also have to read
    the data back a special way. Your code to get the code string for a Morse letter
    from the array has to be modified to look like this:


    ```

    strcpy_P(buffer, (char*) pgm_read_word(&letters[ch - ''a'']));

    ```


    This uses a buffer variable into which the PROGM string is copied, so that it
    can be used as a regular char array. This needs to be defined as a global variable
    as follows:

    char buffer[6];


    This approach works only if the data is constant—that is, you are not going to
    change it while the sketch is running. In the next section, you will learn about
    using the EEPROM memory that is intended for storing persistent data that can
    be changed.


    # EEPROM'
  merge: -1
  pgno: 122
- img_proc: true
  md: "The ATMega328 at the heart of an Arduino Uno has a kilobyte of electrically\
    \ erasable read-only memory (EEPROM). EEPROM is designed to remember its contents\
    \ for many years. Despite its name, it is not really read-only. You can write\
    \ to it.\n\nThe Arduino commands for reading and writing to EEPROM are just as\
    \ awkward to use the ones for using PROGMEM. You have to read and write to and\
    \ from EEPROM one byte at a time.\n\nThe example of sketch 8-02 allows you to\
    \ enter a single-digit letter code from the Serial Monitor. The sketch remembers\
    \ the digit and repeatedly writes it out on the Serial Monitor.\n\n```\n// sketch\
    \ 8-02\n#include <EEPROM.h>\n\nint addr = 0;\\char ch;\nvoid setup() {\n  Serial.begin(9600);\n\
    \  ch = EEPROM.read(addr);\n}\n\nvoid loop() {\n  if (Serial.available() > 0)\
    \ {\n    ch = Serial.read();\n    EEPROM.write(0, ch);\n    Serial.println(ch);\n\
    \  }\n  Serial.println(ch);\n  delay(1000);\n}\n```\n\nTo try this sketch, open\
    \ the Serial Monitor and enter a new character. When you unplug the Arduino and\
    \ plug it back in. When you reopen the Serial Monitor, you will see that the letter\
    \ has remembered.\n\nThe function EEPROM.write takes two arguments. The first\
    \ is the address, which is the memory location in EEPROM and should be between\
    \ 0 and 1023. The second argument is the data to write at that location. This\
    \ must be a single byte. A character is represented as eight bits, so this is\
    \ fine, but you cannot directly store a 16-bit int.\n\n# Storing an int in EEPROM\n\
    \nTo store a two-byte int in locations 0 and 1 of the EEPROM, you would have to\
    \ do this:"
  merge: -1
  pgno: 123
- img_proc: true
  md: "```\nint x = 1234;\nEEPROM.write(0, highByte(x));\nEEPROM.write(1, lowByte(x));\n\
    ```\n\nThe functions highByte and lowByte are useful for separating an int into\
    \ two bytes.\nFigure 8-1 shows how this int is actually stored in the EEPROM.\n\
    \n| Address | High Byte | Low Byte |\n|---|---|---|\n| 0 | 1234 decimal = 0000\
    \ 0100 | 1101 0010 |\n| 1 | 1101 0010 | |\n| 2 | | |\n| 3 | | |\n\nFigure 8-1\
    \ Storing a 16-bit integer in EEPROM\n\nTo read the int back out of EEPROM, you\
    \ need to read the two bytes from the EEPROM and reconstruct the int, as follows:\n\
    \n```\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\nint x = (high\
    \ << 8) + low;\n```\n\nThe << operator is a bit shift operator that moves the\
    \ high bytes to the top of the int and then adds in the low byte.\n\n# Storing\
    \ a float in EEPROM (Unions)\n\nStoring a float in EEPROM is a little more tricky.\
    \ To do this, you can use a feature of C unions. These data structures are interesting\
    \ in that they can be thought of as a way to make the same area of memory accessible\
    \ to more than one variable. What is more, these variables are allowed to be of\
    \ different types as long as they are the same size in bytes.\n\nThe following\
    \ union definition allows both a float and an int to refer to the same two bytes\
    \ of memory:\n\n```\nunion data {\n  float f;\n  int i;\n} convert;\n```"
  merge: -1
  pgno: 124
- img_proc: true
  md: "You can then put a float into the union as follows:\nfloat f = 1.23;\nconvert.f\
    \ = f;\n\nThen you can separate an integer into two bytes for storage in EEPROM\
    \ as follows:\nEEPROM.write(0, highByte(convert.i));\nEEPROM.write(1, lowByte(convert.i));\n\
    \nReading the float out again requires you to do the reverse. First you assemble\n\
    two bytes into a single int, then you put the int into the union and pull it out\
    \ again as a\nfloat.\n\n```\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\n\
    convert.i = (high << 8) + low;\nfloat f = convert.f;\n```\n\n# Storing a String\
    \ in EEPROM\n\nWriting and reading character strings into the EEPROM are pretty\
    \ straightforward;\njust have to write each character at a time, as in the following\
    \ example:\n\n```\nchar *test = \"Hello\";\nint i = 0;\nwhile (test[i] != '\\\\\
    0')\n{\n  EEPROM.write(i, test[i]);\n  i++;\n}\n```\n\nTo read the string back\
    \ into a character array, you can do something like this:\n\n```\nchar test [10];\n\
    int i = 0;\nchar ch;\nch = EEPROM.read(i);\nwhile (ch != '\\\\0' && i < 10)\n\
    {\n  test[i] = ch;\n  ch = EEPROM.read(i);\n  i++;\n}\n```\n\n# Clearing the Contents\
    \ of EEPROM"
  merge: -1
  pgno: 125
- img_proc: true
  md: "When writing to EEPROM, remember that even uploading a new sketch will not\
    \ clear the\\EEPROM, so you may have leftover values in there from a previous\
    \ project. Sketch 8-03\nresets all the contents of EEPROM to zeros:\n\n```\n//\
    \ sketch 8-03\n#include <EEPROM.h>\n\nvoid setup() \n{\n  Serial.begin(9600);\n\
    \  Serial.println(\"Clearing EEPROM\");\n  for (int i = 0; i < 1023; i++) {\n\
    \    EEPROM.write(i, 0);\n  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\nvoid\
    \ loop()\n```\n\nAlso be aware that you can write to an EEPROM location only about\
    \ 100,000 times\nbefore it will become unreliable. So only write a value back\
    \ to EEPROM when you really\nneed to. EEPROM is also quite slow, taking about\
    \ 3 milliseconds to write a byte.\n\n# Compression\n\nWhen saving data to EEPROM\
    \ or using PROGMEM, you will sometimes find that\nyou have more to save than you\
    \ have room to save it. When this happens, it is worth\nfinding the most efficient\
    \ way of representing the data.\n\n# Range Compression\n\nYou may have a value\
    \ for which on the face of it you need an int or a float that are both\n16-bit.\
    \ For example, to represent a temperature in degrees Celsius, you might use a\
    \ float\nvalue such as 20.25. When you are storing that into EEPROM, life would\
    \ be so much\neasier if you could fit it into a single byte, and you could store\
    \ as much as if you\nused a float.\n\nOne way that you can do this is to change\
    \ the data before you store it. Remember that a\nbyte will allow you to store\
    \ a positive number between 0 and 255. So if you only carednat the temperature\
    \ to the nearest degree Celsius, then you could simply convert the\nfloat to an\
    \ int and discard the part after the decimal point. The following example shows\n\
    how to do this:\n\n```\nint tempInt = (int)tempFloat;\n```"
  merge: -1
