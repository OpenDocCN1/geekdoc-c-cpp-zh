  md: '![](img/6426909fcee15359dcfa665c8698110f_78_0.png)


    # ### Figure 5-1 The Serial Monitor Showing the Output of Sketch 5-01


    You have to be a little careful with arrays, because the compiler will not try
    and stop you from accessing elements of data that are beyond the end of the array.
    This is because the array is really a pointer to an address in memory, as shown
    in [Figure 5-2]().


    Programs keep their data, both ordinary variables and arrays, in *memory*. Computer
    memory is arranged much more rigidly than the human kind of memory. It is easy
    to think of the memory in an Arduino as a collection of pigeonholes. When you
    define an array of nine elements, for example, the next nine pigeonholes are reserved
    for its use and the variable is to point at the first pigeonhole or **element**
    of the array.


    Going back to our point about access being allowed beyond the bounds of your array,
    if you decided to access **durations[10]**, then you would still get Memory back
    an **int**, but the value of this **int** could be anything. This is in itself
    fairly harmless, except that if you accidentally get a value outside of the array,
    you are likely to get confusing results in your sketch.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '![](img/6426909fcee15359dcfa665c8698110f_79_0.png)


    However, what is far worse is if you try changing a value outside the size of
    the array. For instance, if you were to include something like the following in
    your program, the results could simply make your sketch break:

    durations[10] = 0;


    The pigeonhole **durations[10]** may be in use as some completely different variable.
    So always make sure that you do not go outside of the size of the array. If your
    sketch starts behaving strangely, then check for this kind of problem.


    # Morse Code SOS Using Arrays


    Sketch 5-02 shows how you can use an array to make your emergency signal of SOS:'
