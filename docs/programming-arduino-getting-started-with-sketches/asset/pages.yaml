    \ in which case it will take the plus the three seconds delay between each batch\
    \ of 20 flashes. In fact, for some applications, even this is too slow, and purists\
    \ would say that you should not use delay at all. The best solution depends on\
    \ the application.\n\n# while\n\nAnother way of looping in C is to use the while\
    \ command in place of the for command.\nYou can accomplish the same thing as the\
    \ preceding for example using a while command as follows:"
