  md: "• The single line comment that starts with // and finishes at the end of the\
    \ line\n\n• The multiline comment that starts with a /* and ends with a */\n\n\
    ```\nThe following is an example using both forms of comments:\n/* A not very\
    \ useful loop function.\nWritten by: Simon Monk\nTo illustrate the concept of\
    \ comments\n*/\nvoid loop() {\n    static int count = 0;\n    count++; // a single\
    \ line comment\n    if (count == 20) {\n        count = 0;\n        delay(3000);\n\
    \    }\n}\n```\n\nIn this book, I mostly stick to the single-line comment format.\n\
    \nGood comments explain what is happening in a sketch or how to use the sketch.\
    \ They are useful if others are going to use your sketch, but equally useful to\
    \ yourself when you are looking at a sketch that you have worked on for a few\
    \ weeks.\n\nSome people are told in programming courses that the more comments,\
    \ the better. Most seasoned programmers will tell you that the well-written code\
    \ requires very little in the way of comments because it is self-explanatory.\
    \ You should use comments for the following reasons:\n\n+   • To explain anything\
    \ you have done that is a little tricky or not immediately obvious\n\n+   • To\
    \ describe anything that the user needs to do is not part of the program; for\
    \ example, // this pin should be connected to the transistor controlling the relay\n\
    \n+   • To leave yourself notes; for example, // todo: tidy this - it's a mess\n\
    \nThis last point illustrates a useful technique of todos in comments. Programmers\
    \ often use todos in their code to remind themselves of something they need to\
    \ do later. They can always use the search facility in their integrated development\
    \ environment (IDE) to find all occurrences of // todo in their program.\n\nThe\
    \ following are not good examples of reasons you should use comments:\n\n+   •\
    \ To state the blatantly obvious; for example, a = a + 1; // add 1 to a.\n\n+\
    \   • To explain badly written code. Don't comment on it; just write it clearly\
    \ in the first place.\n\n# Conclusion\n\nThis has been a bit of a theoretical\
    \ chapter. You have had to absorb some new abstract"
