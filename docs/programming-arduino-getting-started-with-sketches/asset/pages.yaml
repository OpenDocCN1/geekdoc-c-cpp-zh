- img_proc: true
  md: 'More interestingly, some Arduino-compatible designs are intended to extend
    or improve the Arduino in some way. New variants are appearing all the time, and
    far too many exist to mention them all. However, the following are some of the
    more interesting and popular variants:


    +   * Chipkit, a high-speed variant based on a PIC processor, but which is fairly
    compatible with Arduino

    * Femtodino, a very small Arduino

    * Ruggedduino, with is an Arduino board with built-in I/O protection

    * Teensy, a low-cost nano-type device


    # Conclusion


    Now that you have explored the Arduino hardware a little, it’s time to set up
    your Arduino software.'
