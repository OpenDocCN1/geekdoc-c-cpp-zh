  md: '# 3

    C Language Basics


    The programming language used to program Arduinos is a language called C. In this
    chapter, you get to understand the basics of the C language. You will use what
    you learn in every sketch you develop as an Arduino programmer. To get the most
    out of Arduino, you need to understand these fundamentals.


    # Programming


    It is not uncommon for people to speak more than one language. In fact, the more
    you learn, the easier it seems to learn spoken languages as you start to find
    common patterns of grammar and vocabulary. The same is true of programming languages.
    So, if you have any other programming language, you will quickly pick up C.


    The news is that the vocabulary of a programming language is far smaller than
    that of a spoken language, and because you write rather than say it, the dictionary
    can always be at hand whenever you need to look things up. Also, the grammar and
    syntax of a programming language are extremely regular, and once you come to grips
    with a few simple concepts, learning more quickly becomes second nature.


    It is best to think of a program—or a sketch, as programs are called in Arduino—as
    a list of instructions to be carried out in the order that they are written down.
    For example, suppose you were to write the following:


    ```

    digitalWrite(13, HIGH);

    day(500);

    ditalWrite(13, LOW);

    ```


    These three lines would do something. The first line would set the output of 13
    to HIGH. This is the pin with an LED built to the Arduino board, so at this point
    the LED would light. The second line would simply wait for 500 milliseconds (half
    a second) and then the third line would turn the LED back again. These three lines
    would achieve the goal of making the LED blink once.


    You have already seen a bewildering array of punctuation and words that don''t
    have spaces between them. A frustration of many new programmers is, “I know what
    I want to do, I just don''t know what I need to write!” Fear not, all will be
    explained.


    First of all, let''s deal with the punctuation and the way words are formed. These
    are both part of what is termed the syntax of the language. Most languages require
    you to be extremely precise about syntax, and one of the main rules is that names
    for things have to be a single word. That is, they cannot include spaces. So,
    digitalWrite is the name for'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'something. It''s the name of a built-in function (you''ll learn more about
    functions later) that will do for you an output pin on the Arduino board. Not
    only do you avoid spaces in names, but also names are case sensitive. You must
    you write digitalWrite, not DigitalWrite or Digitalwrite.


    The function DigitalWrite needs to know which pin to set and whether to set that
    pin HIGH or LOW. These two pieces of information are called arguments, which are
    said to be passed to function when it is called. The parameters for a function
    must be enclosed in parentheses and separated by commas.


    The convention is to place the opening parenthesis immediately after the last
    letter of the function''s name and to put a space after the comma before the next
    parameter. However, you can sprinkle space characters within the parameters if
    you want.


    If the function has only one argument, then there is no need for a comma.


    Notice how each line ends with a semicolon. It would be more logical if they were
    periods, because the semicolon marks the end of one command, but it would be like
    the end of a sentence.


    In the next section, you will find out a bit more about what happens when you
    press the Upload button on the Arduino integrated development environment (IDE).
    Then you will be able to start trying out a few examples.


    # # What Is a Programming Language?


    It is perhaps a surprising that we get to Chapter 3 in a book about programming
    without defining exactly what a programming language is. We can recognize an Arduino
    sketch and probably have a rough idea of what it is trying to do, but we need
    to look a bit deeper into how some programming language code goes from being words
    on a page to something that does something real, like turn an LED on and off.


    Figure3-1 summarizes the process involved in typing code into the Arduino IDE
    to running the sketch on the board.


    ![](img/6426909fcee15359dcfa665c8698110f_42_0.png)'
  merge: -1
