    \ the LED, you would find that nothing would happen until you got about 2V; the\
    \ LED would very quickly get quite bright. By controlling the brightness using\
    \ PWM and varying the average amount of time that the LED is on, you achieve much\
    \ more linear control of the brightness.\n\n# Analog Input\n\nDigital inputs just\
