    \ {\n    count = 0;\n    delay(3000);\n  }\n}\n```\n\nThis style is most commonly\
    \ used in the Java programming language, which shares much of the same syntax\
    \ as C. I prefer the first form, which seems to be the form most commonly used\
    \ in the Arduino world.\n\n# Whitespace\n\nThe compiler ignores spaces tabs and\
    \ new lines, apart from using them as a way of separating the \"tokens\" or words\
    \ in your sketch. Thus the following example will compile without a problem:\n\
    \n```\nvoid loop(){static int count=0;count++;if(count==20){count=0;delay(3000);}}\n\
    ```\n\nThis will work, but good luck trying to read it.\n\nWhere assignments are\
    \ made, some people will write the following:\n\nint a = 10;\n\nBut others will\
    \ write the following:\n\nint a=10;\n\nWhich of these two styles you really does\
    \ not matter, but it is a good idea to be consistent. I use the first form.\n\n\
    # Comments\n\nComments are text that is kept in your sketch along with all the\
