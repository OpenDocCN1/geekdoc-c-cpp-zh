    \ gets assigned to the local variable ch.\n\nNext is another to decide what kind\
    \ of thing it is that you want to flash:\n\n```\nif (ch >= 'a' && ch <= 'z') {\n\
    \  flashSequence(ch - 'a');\n```\n\nAt first, this might seem a bit strange. You\
    \ are using <= and >= to compare characters. You can do that because each character\
    \ is actually represented by a number (its ASCII code). So, if the code for the\
    \ character is somewhere between a and z (97 and 122), you know that the character\
    \ that has come from the computer is a lowercase letter. You can then call a function\
