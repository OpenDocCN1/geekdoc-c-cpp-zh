  md: "```\n// sketch 3-09\nint ledPin = 13;\nint delayPeriod = 100;\nint count =\
    \ 0;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  count++;\n  if (count == 20) {\n    count = 0;\n    delay(3000);\n  }\n}\n\
    ```\n\nYou may have noticed the following line:\ncount++;\n\nThis is just C shorthand\
    \ for the following:\ncount = count + 1;\n\nSo now each time loop is run, it will\
