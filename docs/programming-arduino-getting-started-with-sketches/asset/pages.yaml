    The line void setup() means that you are defining a function called setup. In
    Arduino, some functions are already defined for you, such as digitalWrite and
    delay, whereas you must or define others for yourself. setup and loop are two
    functions that you must define for yourself in every sketch that you write.


    The important thing to understand is that here you are not calling setup or loop
    like you would call digitalWrite, but you are actually creating these functions
    so that the Arduino system can call them. It is a difficult concept to grasp,
    but one way to think of it as being similar to a definition in a legal document.


    Most legal documents have a “definitions” section that might say, for example,
    something like the following:


    Definitions.

    The Author: The person or persons responsible for creating the book


    By defining a term in this way—for example, simply using the word “author” as
    shorthand for “Person or persons responsible for creating the book”—lawyers can
    make their documents shorter and more readable. Functions work much like such
    definitions. You define a function that you or the system can then use elsewhere
    in your sketches.


    Going back to void, these two functions (setup and loop) do not return a value
    as functions do, so you have to say that they are void, using the void keyword.
    If you imagine a function called sin that performed the trigonometric function
    of that name, then'
