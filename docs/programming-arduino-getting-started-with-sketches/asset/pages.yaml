    \ and then parentheses to contain any arguments. In this case, there are no arguments,\
    \ but we still have to include the parentheses. There is no semicolon after the\
    \ closing parenthesis because we are defining a function rather than calling it,\
    \ so we need to say what will happen when something calls the function.\n\nThose\
    \ things that are to happen when the function is called must be placed between\
