  md: 'String literals are enclosed in double quotation marks. They are literal in
    the sense that the string is a constant, rather like the int 123.


    As you would expect, you can put strings in a variable. There is also an advanced
    string library, but for now you will use standard C strings, as the one in sketch
    5-03.


    In C, a string literal is actually an array of the type char. The type char is
    also like int in that it is a number, but number is between 0 and 127 and represents
    one character. The character may be a letter of an alphabet, a number, a punctuation
    mark, or a special character such as a tab or a line feed. These number codes
    for literals use a standard called ASCII; Some of the most commonly used ASCII
    codes are shown in Table 5-1.


    | Character | ASCII code (decimal) |

    | a-z | 97-122 |

    | A-Z | 65-90 |

    | 0-9 | 48-57 |

    | space | 32 |


    # Table 5-1 Common ASCII Codes


    The string literal “Hello” is actually array of characters, as shown in Figure
    5-3. Note that the string literal has a special null character at the end. This
    character is used to indicate the end of the string.


    # String Variables


    As you would expect, string variables are very similar to array variables, except
    that there is a useful shorthand method for defining their initial value.


    ```

    char name[] = "Hello";

    ```


    This defines an array of characters and initializes it to the word “Hello.” It
    will also add a final null value (ASCII 0) to mark the end of the string.


    | |

    | H (72) |

    | e (101) |

    | 1 (108) |

    | 1 (108) |

    | o (111) |

    | \0 (0) |


    # Figure 5-3 The String Literal “Hello”'
