  md: 'This file is the header file for the class called LiquidCrystal. This file
    tells the Arduino sketch it needs to know to be able to use the library. You can
    actually retrieve this file if you go to your Arduino installation folder and
    find the file libraries/LiquidCrystal. You will need to open the file in a text
    editor. If you are using a Mac, right-click on the Arduino itself and select the
    menu Show Package Contents. Then navigate to Contents/Resources/Java/libraries/LiquidCrystal.


    The file LiquidCrystal.h contains lots of code, as is a fairly large library class.
    The code for the actual class itself, where the nuts and bolts of displaying a
    message actually reside, in the file LiquidCrystal.cpp.


    In the next section, a simple example library will be created that should put
    the concepts behind a library into context.


    # Writing Libraries


    Creating an Arduino library might seem like the kind of thing that only a seasoned
    Arduino veteran should attempt, but actually it is pretty straight-forward to
    make a library. For example, you can convert into a library the **flash function**
    from Chapter 4 that causes an LED to flash for a specified number of times.


    To create the C++ files that are needed to do this, you will need a text editor
    for your computer—something like TextPad on Windows or Text-Mate Mac.


    # The Header File


    Start by creating a folder to contain all the library files. You should create
    this folder inside the library folder of your Arduino documents folder. In Windows,
    your libraries will be found in My Documents\Arduino/. On the Mac, you will find
    it in your home directory, Documents/Arduino/, and on Linux, it will be in the
    sketchbook directory of your home directory. If there is no libraries folder in
    your Arduino, then create one.


    This libraries folder is where any libraries you write yourself, or any “unofficial”
    contributed libraries, must be installed.


    Call the folder Flasher. Start the text editor and type the following into it:'
  merge: -1
  pgno: 149
- img_proc: true
  md: "```\n// LED Flashing library\n\n#include \"WProgram.h\"\n\nclass Flasher {\n\
    public:\n    Flasher(int pin, int duration);\n    void flash(int times);\nprivate:\n\
    \    int _pin;\n    int _d;\n};\n```\n\nSave this file in the Flasher folder with\
    \ the name Flasher.h. This is the header file for the library class. This file\
    \ specifies the different parts of the class. As you can see, it is divided into\
    \ public and private parts.\n\nThe public part contains what looks like the start\
    \ of two functions. These are called methods and differ from functions only insofar\
    \ as they are associated with a class. They can be used only as part of the class.\
    \ Unlike functions, they cannot be used on their.\n\nThe first method, Flasher,\
    \ begins with an uppercase letter, which is something you would not use with a\
    \ function name. It also has the same name as the class. This method is called\
    \ a constructor, which you can apply to create a new Flasher object to use in\
    \ a sketch.\n\nFor example, you could put the following in a sketch:\nFlasher\
    \ slowFlasher(13, 500);\n\nThis would create a new Flasher slowFlasher that would\
    \ flash on pin D13 with a duration of 500 milliseconds.\n\nThe second method in\
    \ the class is called flash. This method takes a single argument of the number\
    \ of times to flash. Because it is associated with a class, when you want to call\
    \ it, you have to refer to the object you created earlier, as follows:\nslowFlasher.flash(10);\n\
    \nThis would cause the LED to flash ten times at the period that you specified\
    \ in the constructor to the Flasher object.\n\nThe private section of the class\
    \ contains two variable definitions: one for the pin, and one for the duration,\
    \ which is simply called d. Every time you create an object of class Flasher,\
    \ it will have these two variables. This enables it to remember the pin and duration\
    \ when a new Flasher object is created.\n\nThese variables are called member variables\
    \ because they are members of the class. Their names generally are unusual in\
    \ that they start with an underscore character;"
  merge: -1
  pgno: 150
- img_proc: true
  md: "however, this is just a common convention, not a programming necessity. Another\
    \ commonly used naming convention is to use a lowercase m (for member) as the\
    \ first letter of the variable name.\n\n# The Implementation File\n\nThe header\
    \ file has just defined what the class looks like. You now need a separate file\
    \ that actually does the work. This is called the implementation file and has\
    \ the extension .cpp.\n\nSo, create a new file containing the following and save\
    \ it as Flasher.cpp in the Flasher folder:\n\n```\n#include \"WProgram.h\"\n#include\
    \ \"Flasher.h\"\n\nFlasher::Flasher(int pin, int duration)\n{\n    pinMode(pin,\
    \ OUTPUT);\n    _pin = pin;\n    _d = duration / 2;\n}\n\nvoid Flasher::flash(int\
    \ times)\n{\n    for (int i = 0; i < times; i++)\n        digitalWrite(_pin, HIGH);\n\
    \        delay(_d);\n        digitalWrite(_pin, LOW);\n        delay(_d);\n  \
    \  }\n```\n\nThere is some unfamiliar syntax in this file. The method names are\
    \ both prefixed by Flasher::. This indicates that the methods belong to the Flasher\
    \ class.\n\nThe constructor method (Flasher) assigns each of its parameters to\
    \ the appropriate private member variable. The **duration** parameter is divided\
    \ by two before being assigned to the member variable _d. This is because the\
    \ delay is divided twice, and it seems more logical for the duration to be the\
    \ total duration of the flasher and the gap between flashes.\n\nThe flash function\
    \ actually carries out the business of flashing; it loops for the appropriate\
    \ number of times, turning the LED on and off for the appropriate delay.\n\n#\
    \ Completing Your Library\n\nYou have now seen all of the essentials for completing\
    \ the library. You could now deploy this library and it would work just fine.\
    \ However, there are further steps that you should take to complete your library.\
    \ One is to define the keywords used in the library so"
  merge: -1
  pgno: 151
- img_proc: true
  md: 'that the Arduino IDE can show them in the appropriate color when users are
    editing code.

    The other is to include some examples of how to use the library.


    # Keywords


    To define the keywords, you have to create a file called keywords.txt, which goes
    into the

    lasher directory. This file contains just the two following lines:


    ```

    Flasher KEYWORD1

    flash KEYWORD2

    ```


    This is essentially a two-column table in a text file. The left column is the
    keyword and

    t right column an indication of the type of keyword it. Class names should be
    a

    KEYWORD1 and methods should be KEYWORD2. It does not matter how many spaces

    tabs you put between the columns, but each keyword should start on a new line.


    # Examples


    The other thing that you, as a good Arduino citizen, should include as part of
    the library is

    a folder of examples. In this case, the library is so simple that a single example
    will

    suffice.


    The examples must all be placed in a folder called examples inside the Flasher
    folder.

    The example is in fact just an Arduino sketch, so you can create the example using
    the

    Arduino IDE. But first, you have to quit and reopen the Arduino IDE to make it

    are of the new library.


    After restarting the Arduino IDE, from the Arduino IDE’s menu, select File and
    then

    New to create a new sketch window. Then from the Menu, Sketch and the Import

    Library option. The Options should look something like Figure 11-1.


    The libraries above the line in the submenu are the official libraries; below
    this line are

    t“unofficial” contributed libraries. If all has gone well, you should see Flasher
    in the

    list.


    If Flasher is not in the list, it is very likely that the Flasher folder is not
    in the libraries

    folder of your sketches folder, so go back and check.'
