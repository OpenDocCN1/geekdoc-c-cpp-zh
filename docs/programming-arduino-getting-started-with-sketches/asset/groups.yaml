    \ {\n  int reading = digitalRead(inputPin);\n  Serial.println(reading);\n  delay(1000);\n\
    }\n```\n\n## 消抖\n\n当你按下按钮时，你期望在按钮按下时只会得到从 1（带有上拉电阻）到 0 的单一变化。图 6-8 显示了按下按钮时可能发生的情况。按钮金属触点的抖动会变成一系列按下，并最终稳定。\n\
    \n这一切发生得很快；在示波器波形上，按钮按下的总跨度仅为 200 毫秒。这是一个非常糟糕的旧开关。新的触感点击式按钮可能完全不会抖动。\n\n有时，抖动完全没有影响。例如，程序\
    \ 6-04 会在按下按钮时点亮 LED。在现实中，你不会使用 Arduino 这样做；我们在这里处于理论而非实践的领域。\n\n![](img/6426909fcee15359dcfa665c8698110f_100_0.png)\n\
