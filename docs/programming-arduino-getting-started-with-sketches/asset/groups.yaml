    Your Arduino is doing arithmetic now. Every time that loop is called, it will
    do the normal flash of the LED, but then it will add 100 to the variable delayPeriod.
    We will come back to arithmetic shortly, but first you need a better way than
    a flashing LED to see what the Arduino is up to.


    # Experiments in C


    You need a way to test your experiments in C. One way is to put the C that you
    want to test out into the setup function, evaluate them on the Arduino, and then
    have the Arduino display any output back to something called the Serial Monitor,
    as shown in Figures 3-5 and 3-6.


    The Serial Monitor is part of the Arduino IDE. You access it by clicking on the
    rightmost icon to act as a communication channel between your computer and the
    Arduino. You can type a message in the text area at the top of the Serial Monitor
    and when you press Return or click Send, it will send that message to the Arduino.
    Also if the Arduino has anything to say, this message will appear in the Serial
    Monitor. In both cases, the information is sent through the USB link.


    ![](img/6426909fcee15359dcfa665c8698110f_50_0.png)


    Figure 3-5 Writing C in setup'
  - "[PAGE 51]\n\n# Figure 3-6 The Serial Monitor\n\nAs you would expect, there is\
    \ a built-in function that you can use in your sketches to send a message to the\
    \ Serial Monitor. It is called Serial.println and it expects a single argument,\
    \ which consists of the information that you want to send. This information is\
    \ usually a variable.\n\nYou will use this mechanism to test out a few things\
    \ that you can do with variables and arithmetic in C; frankly, it's the only way\
    \ you can see the results of your experiments in C.\n\n# Numeric Variables and\
    \ Arithmetic\n\nThe last thing you did was add the following line to your blinking\
    \ sketch to increase the blinkingPeriod steadily.\ndelayPeriod = delayPeriod +\
    \ 100;\n\nLooking closely at this, it consists of a variable name, then an equals\
    \ sign, then what is called an expression (delayPeriod + 100). The equals sign\
    \ does something called assignment. That is, it assigns a new value to a variable,\
    \ and the value it assigns is determined by what comes after the equals sign and\
    \ before the semicolon. In this case, the new value to be given to the delayPeriod\
    \ variable is the old value of delayPeriod plus 100.\n\nLet's test out this mechanism\
    \ to see what the Arduino is up to by entering the following sketch, running it,\
    \ and opening the Serial Monitor:\n\n```\n// sketch 3-04\nvoid setup() {\n  Serial.begin(9600);\n\
    \  int a = 2;\n  int b = 2;\n  int c = a + b;\n  Serial.println(c);\n}\nvoid loop()\
    \ {\n}\n```"
- md: "\nFigure 3-7 shows what you should see in the Serial Monitor after this code\
    \ runs.\n\nTo take a slightly more complex example, the formula for converting\
    \ a temperature in degrees Centigrade to degrees Fahrenheit is to multiply by\
    \ 5, divide by 9, and then add 32. So you could write that in a sketch like this:\n\
    \n![](img/6426909fcee15359dcfa665c8698110f_52_0.png)\n\n# Figure 3-7 Simple arithmetic\n\
    \n```\n// sketch 3-05\nvoid setup() \n{\n  Serial.begin(9600);\n  int degC = 20;\n\
    \  int degF;\n  degF = degC * 9 / 5 + 32;\n  Serial.println(degF);\n}\nvoid loop()\
    \ {\n}\n```\n\nThere are a few things to notice here. First, note the following\
    \ line:\nint degC = 20;\n\nWhen we write such a line, we are actually doing two\
    \ things: We are declaring an int variable called degC, and we are saying that\
    \ its initial value will be 20. Alternatively, you could separate these two things\
    \ and write the following:\n\n```\nint degC;\ndegC = 20;\n```\n\nYou must declare\
    \ any variable just once, essentially telling the compiler what type of variable\
    \ it is—in this case, int. However, you can assign the variable a value as many\
    \ times as you want:\n\n```\nint degC;\ndegC = 20;\ndegC = 30;\n```\n\nSo, in\
    \ the Celsius to Fahrenheit example, you are defining the variable degC and giving\
    \ an initial value of 20, but when you define degF, it does not get an initial\
    \ value. Its value gets assigned on the next line, according to the conversion\
    \ formula, before being sent to the Serial Monitor for you to see.\n\nLooking\
    \ at the expression, you can see that the asterisk (*) for multiplication and\
    \ the slash (/) for division. the arithmetic operators +, *, and - have an order\
    \ of precedence—that is, multiplications are done first, then additions and subtractions.\
    \ This is in accordance with the usual use of arithmetic. However, sometimes it\
    \ makes it clearer to use parentheses in the expressions. So, for example, you\
    \ could write the following:\n\n```\ndegF = ((degC * 9) / 5) + 32;\n```\n\nThe\
    \ expressions that you write can be long and complex as you need them to, and\
    \ in addition to the usual arithmetic operators, there are other less commonly\
    \ used operators and a big collection of various mathematical functions that are\
    \ available to you. You will learn about these later.\n\n# Commands\n\nThe C language\
    \ has a number of built-in commands. In this section, we explore some of these\
    \ and see how they can be of use in your sketches.\n\n# if\n\nIn our sketches\
    \ so far, we have assumed that your lines of programming will be executed in one\
    \ order after the other, with no exceptions. But what if you don't want to do\
    \ that? What if you only want to execute part of a sketch if some condition is\
    \ true?\n\nLet’s return to our gradually slowing-down Blinking LED example. At\
    \ the moment, it will get slower and slower until each blink is lasting hours.\
    \ Let’s look at how we can change it so that once it has slowed down to a certain\
    \ point, it goes back to its fast starting speed.\n\nTo do this, you must use\
    \ an if command; the modified sketch is as follows. Try it out.\n\n```\n// sketch\
    \ 3-06\nint ledPin = 13;\nint delayPeriod = 100;\n\nvoid setup() {\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  delayPeriod = delayPeriod\
    \ + 100;\n  if (delayPeriod > 3000) {\n    delayPeriod = 100;\n  }\n}\n```\n\n\
    The if command looks a little like a function definition, but this resemblance\
    \ is only superficial. The word in the parenthesis is not an argument; it is what\
    \ is called a condition. In this case, the if is the variable delayPeriod has\
    \ a value that is greater than 3,000. If this is true, the commands inside the\
    \ curly braces will be executed. In this case, the code sets the value of delayPeriod\
    \ back to 100.\n\nIf the condition is not true, then the Arduino will continue\
    \ on the next thing. In this case, there is nothing after the “if”, so the Arduino\
    \ will run the loop function again.\n\nRunning through the sequence of events\
    \ in your head will help you understand what is going on. So, here is what happens:\n\
    \n- 1. Arduino runs setup and initializes the LED pin to be an output.\n- 2. Arduino\
    \ starts running loop.\n- 3. The LED turns on.\n- 4. A delay occurs.\n- 5. The\
    \ LED turns off.\n- 6. A delay occurs.\n- 7. Add 100 to the delayPeriod.\n- 8.\
    \ If the delay period is greater than 3,000 set it back to 100.\n- 9. Go back\
    \ to step 2.\n\nWe used the symbol <, which means less than. It is one example\
    \ of what are called comparison operators. These operators are summarized in the\
    \ following table:\n\n| Operator | Meaning | Examples | Result |\n| --- | ---\
    \ | --- | --- |\n| < | Less than | 9 < 10<br>10 < 10 | true<br>false |\n| > |\
    \ Greater than | 10 > 10<br>10 > 9 | true |\n| <= | Less or equal to | 9 <= 10<br>10\
    \ <= 10 | true<br>true |\n| >= | Greater or equal to | 10 >= 10<br>10 >= 9 | true<br>true\
    \ |\n| == | Equal to | 9 == 9 | true |\n| != | Not equal to | 9 != 9 | false |\n\
    \nTo compare two numbers, you use the == command. This double equals sign is easily\
    \ confused with the character =, which is used to assign values to variables.\n\
    \nThere is another form of if that allows you to do one thing if the condition\
    \ is true and another if it is false. We will use this in some practical examples\
    \ later in the book.\n\n# for\n\nIn addition to executing different commands under\
    \ different circumstances, you often will want to run a series of commands a number\
    \ of times in a program. You already know one way of doing this, using the loop\
    \ function. As soon as all the commands in the loop function have been run, it\
    \ will start again automatically. However, sometimes you need more control than\
    \ that.\n\nSo, for example, let's say that you want to write a sketch that blinks\
    \ 20 times, then paused for 3 seconds, and then started again. You could do that\
    \ by just repeating the same code over and over again in your loop function, like\
    \ this:\n\n```\n// sketch 3-07\nint ledPin = 13;\nint delayPeriod = 100;\n\nvoid\
    \ setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  // repeat the above 4\
    \ lines 17 times\n\n  delay(3000);\n}\n```\n\nBut this requires a lot of typing\
    \ and there are several better ways of doing this. Let's start by looking at how\
    \ you can use a for loop. The sketch to accomplish this with for loop is\n\n```\n\
    // sketch 3-08\nint ledPin = 13;\nint delayPeriod = 100;\n\nvoid setup() {\n \
    \ pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  for (int i = 0; i < 20; i++)\
    \ {\n    digitalWrite(ledPin, HIGH);\n    delay(delayPeriod);\n    digitalWrite(ledPin,\
    \ LOW);\n    delay(delayPeriod);\n  }\n  delay(3000);\n}\n```\n\nThe for looks\
    \ like a function that takes three arguments, although these arguments are separated\
    \ by semicolons rather than the usual commas. This is just a quirk of the C language.\
    \ The compiler will soon tell you when you get it wrong.\n\nThe first thing in\
    \ the parentheses after for is a variable declaration. This specifies a variable\
    \ to be used as a counter and gives it an initial value—in this case, 0.\n\nThe\
    \ second part is a condition that must be true for you to stay in the loop. In\
    \ this case, you will stay in the loop as long as i is less than 20, but as soon\
    \ as i is 20 or more, the program will stop doing the things inside the loop.\n\
    \nThe final part is what to do every time you have done all the things in the\
    \ loop. In this case, that is to increment i by 1 so that it can, after 20 trips\
    \ around the loop, cease to be less than 20 and cause the program to exit the\
    \ loop.\n\nTry entering code and running it. The only way to get familiar with\
    \ the syntax and all pesky punctuation is to type it in and the compiler will\
    \ tell you when you have something wrong. Eventually it will all start to make\
    \ sense.\n"
  mdcn: "\n图 3-7 显示了运行此代码后串口监视器（Serial Monitor）中应该看到的内容。\n\n举一个稍微复杂点的例子，将摄氏度转换为华氏度的公式是乘以\
    \ 5，除以 9，然后加上 32。因此你可以像这样写一个程序（sketch）：\n\n![](img/6426909fcee15359dcfa665c8698110f_52_0.png)\n\
    \n# 图 3-7 简单算术\n\n```\n// sketch 3-05\nvoid setup() \n{\n  Serial.begin(9600);\n\
    \  int degC = 20;\n  int degF;\n  degF = degC * 9 / 5 + 32;\n  Serial.println(degF);\n\
    }\nvoid loop() {\n}\n```\n\n这里有几点需要注意。首先，注意以下这一行：\nint degC = 20;\n\n当我们写这样一行代码时，我们实际上在做两件事：我们声明了一个名为\
    \ degC 的 int 类型变量，并说它的初始值是 20。或者，你可以将这两件事分开写成如下内容：\n\n```\nint degC;\ndegC = 20;\n\
    ```\n\n你必须只声明一次变量，这本质上是告诉编译器它是什么类型的变量——在这种情况下，是 int。然而，你可以根据意愿无限次地给变量赋值：\n\n```\n\
    int degC;\ndegC = 20;\ndegC = 30;\n```\n\n所以，在摄氏度到华氏度的例子中，你定义了变量 degC 并给它赋予了 20\
    \ 的初始值，但当你定义 degF 时，它并没有获得初始值。它的值在下一行根据转换公式被赋值，然后发送到串口监视器供你查看。\n\n查看这个表达式，你可以看到用于乘法的星号\
    \ (\\*) 和用于除法的斜杠 (/)。算术运算符 +、* 和 - 具有优先级之分——也就是说，先执行乘法，然后是执行加法和减法。这符合算术的通常用法。然而，有时在表达式中使用括号会让逻辑更清晰。例如，你可以写成如下内容：\n\
    \n```\ndegF = ((degC * 9) / 5) + 32;\n```\n\n你编写的表达式可以根据需要变得很长很复杂，除了通常的算术运算符外，还有其他不常使用的运算符以及大量的各种数学函数供你使用。你将在以后学习到这些内容。\n\
    \n# 命令\n\nC 语言有一系列内置命令。在本节中，我们将探索其中一些命令，并看看它们是如何在你的程序中派上用场的。\n\n# if\n\n在到目前为止的程序中，我们假设你的代码行将按顺序一个一个执行，没有任何例外。但如果你不想这样做呢？如果你只想在满足某些条件为真时执行程序的某部分呢？\n\
    \n让我们回到那个逐渐变慢的 LED 闪烁例子中。目前，它会变得越来越慢，直到每次闪烁持续好几个小时。让我们看看如何修改它，让它在速度减慢到某个程度后，回到最初的快速起始速度。\n\
    \n要做到这一点，你必须使用 if 命令；修改后的程序如下。尝试一下吧。\n\n```\n// sketch 3-06\nint ledPin = 13;\n\
    int delayPeriod = 100;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid\
    \ loop() {\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  delayPeriod = delayPeriod + 100;\n  if (delayPeriod\
    \ > 3000) {\n    delayPeriod = 100;\n  }\n}\n```\n\nif 命令看起来有点像函数定义，但这种相似性只是表面的。括号中的单词不是参数，而是被称为“条件”（condition）。在这种情况下，if\
    \ 后面是变量 delayPeriod 的值是否大于 3,000。如果这个条件为真，大括号内部的命令将被执行。在这种情况下，代码将 delayPeriod\
    \ 的值重置为 100。\n\n如果条件为假，那么 Arduino 将继续执行后续操作。在这个例子中，“if” 之后没有内容了，所以 Arduino 将再次运行\
    \ loop 函数。\n\n在脑海中过一遍事件序列有助于你理解正在发生什么。以下是发生的情况：\n\n- 1. Arduino 运行 setup并将 LED\
    \ 引初始化为输出。\n- 2. Arduino 开始运行 loop。\n- 3. LED 亮。\n- 4. 发生延迟。\n- 5. LED 灭。\n- 6.\
    \ 发生延迟。\n- 7. 将 delayPeriod 增加 100。\n- 8. 如果延迟时间大于 3,000，则将其设回 100。\n- 9. 回到步骤\
    \ 2。\n\n我们使用了符号 <，它的意思是“小于”。这是所谓的“比较运算符”的一个例子。这些运算符总结在下表所示：\n\n| 运算符 | 含义 | 示例\
    \ | 结果 |\n| --- | --- | --- | --- |\n| < | 小于 | 9 < 10<br>10 < 10 | true<br>false\
    \ |\n| > | 大于 | 10 > 10<br>10 > 9 | true |\n| <= | 小于等于 | 9 <= 10<br>10 <= 10\
    \ | true<br>true |\n| >= | 大于等于 | 10 >= 10<br>10 >= 9 | true<br>true |\n| == |\
    \ 等于 | 9 == 9 | true |\n| != | 不等于 | 9 != 9 | false |\n\n要比较两个数字，你使用 == 命令。这个双等号很容易与字符\
    \ = 混淆，后者用于给变量赋值。\n\n还有另一种形式的 if，它允许你在条件为真时执行一件事，在条件为假时执行另一件事。我们将在书的后后的一些实际示例中使用它。\n\
    \n# for\n\n除了在不同情况下执行不同的命令外，你通常还希望在程序中多次运行一系列命令。你已经知道一种实现此方法，即使用 loop 函数。只要 loop\
    \ 函数中的所有命令执行完毕，它就会自动重新开始。然而，有时你需要比这更多的控制。\n\n例如，假设你想写一个程序让 LED 闪烁 20 次，暂停 3 秒，然后再次开始。你可以通过在\
    \ loop 函数中不断重复相同的代码来实现这一点，如下所示：\n\n```\n// sketch 3-07\nint ledPin = 13;\nint\
    \ delayPeriod = 100;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid\
    \ loop() {\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  // 重复上述4行代码17次\n\n  delay(3000);\n}\n```\n\n但这需要大量的输入工作，而且有更好的实现方法。让我们先看看如何使用\
    \ for 循环（for loop）。\n\n```\n// sketch 3-08\nint ledPin = 13;\nint delayPeriod\
    \ = 100;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n \
    \ for (int i = 0; i < 20; i++) {\n    digitalWrite(ledPin, HIGH);\n    delay(delayPeriod);\n\
    \    digitalWrite(ledPin, LOW);\n    delay(delayPeriod);\n  }\n  delay(3000);\n\
    }\n```\n\nfor 看起来像接受三个参数的函数，尽管这些参数是用分号分隔的，而不是常用的逗号。这只是 C 语言的一个特点。当你写错时，编译器很快就会。\n\
    \nfor 括号中的第一个部分是变量声明。它指定了一个用于计数的变量并给它一个初始值——在这种情况下，是 0。\n\n第二部分是让你留在循环中的必须为真的条件。在这种情况下，只要\
    \ i 小于 20，你就留在循环中，但一旦 i 达到 20 或更大，程序就会停止执行循环内部的操作。\n\n最后部分是在每次完成循环内所有操作后要执行的操作。在这种情况下，是让\
    \ i 增加 1，这样在经过 20 次循环后，它就不再小于 20，从而导致程序退出循环。\n"
