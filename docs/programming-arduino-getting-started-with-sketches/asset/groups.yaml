    \ a loop function that is called automatically and repeatedly calls a flashSequence\
    \ function that you wrote, which itself repeatedly calls a flashDotOrDash function\
    \ that you wrote, which calls digitalWrite and delay functions that are provided\
    \ by Arduino.\n\nThis is how your sketches should look. Breaking things up into\
    \ functions makes it much easier to get your code working and makes it easier\
    \ when you return to it after a period of not using it.\n\n# Conclusion\n\nIn\
    \ addition to looking at strings and arrays in this chapter, you have also built\
    \ this more complex Morse translator that I hope will also reinforce the importance\
    \ of building your code with functions.\n\nIn the next chapter, you learn about\
    \ input and output, by which we mean input and output of analog and digital signals\
    \ from the Arduino.\n\n# 6\nInput and Output\n\nThe Arduino is about physical\
    \ computing, and that means attaching electronics to the Arduino board. So you\
    \ need to understand how to use the various options for your connection pins.\n\
    \nOutputs can be digital, which just means switched between being at 0V or 5V,\
    \ or analog, allows you to set the voltage to any voltage between 0V and 5V—although\
    \ it’s not quite as simple as that, as we shall see.\n\nLikewise, inputs can be\
    \ digital (for example, determining whether a button pressed or not) or analog\
    \ (as from a light sensor).\n\nIn a book that is essentially software rather than\
    \ hardware, we are going to try and avoid dragged into too much discussion of\
    \ electronics. However, it will help you to understand what is happening in this\
    \ chapter if you can find yourself a multimeter and a short length of solid core\
    \ wire.\n\n# Digital Outputs\n\nIn earlier chapters, you have made use of the\
    \ LED attached to digital pin 13 of the Arduino board. For example, in Chapter\
    \ 5, you used it as a Morse code signaler. The Arduino board has a whole load\
    \ of digital pins available.\n\nLet’s experiment with one of the other pins on\
    \ the Arduino. You will use digital pin 4, and to see what is going on, you will\
    \ fix some wire to your multimeter and attach them to your Arduino. Figure 6-1\
    \ shows the arrangement. If your multimeter has crocodile clips, strip the insulation\
    \ off the ends of some short lengths of solid core wire and attach the clip to\
    \ one end, fitting the other end into the Arduino socket. If your multimeter does\
    \ not have crocodile clips then wrap one of the stripped wire ends around the\
    \ probe.\n\n![](img/6426909fcee15359dcfa665c8698110f_93_0.png)\n\n# Figure 6-1\
    \ Measuring outputs with a multimeter\n\nThe multimeter needs to be set to its\
    \ 0–20V direct current (DC) range. The negative lead (black) should be connected\
    \ to the ground (GND) pin and the positive to D4. The wire is just connected to\
    \ the probe lead and poked into the socket headers on the Arduino board.\n\nLoad\
    \ sketch 6-01:\n\n```\n//sketch 6-01\n\nint outPin = 4;\n\nvoid setup() {\n  \
    \  pinMode(outPin, OUTPUT);\n    Serial.begin(9600);\n    Serial.println(\"Enter\
    \ or 0\");\n}\n\nvoid loop() {\n    if (Serial.available() > 0) {\n        char\
    \ ch = Serial.read();\n        if (ch == '1') {\n            digitalWrite(outPin,\
    \ HIGH);\n        } else if (ch == '0') {\n            digitalWrite(outPin, LOW);\n\
    \        }\n    }\n}\n```\n\nAt the top of the sketch, you can see the command\
    \ **pinMode**. You should use this command for every pin that you are using in\
    \ a project so that Arduino can configure the electronics to connect to that pin\
    \ to be either an input or an output, as in the following example:\npinMode(outPin,\
    \ OUTPUT);\n\nAs you might have guessed, **pinMode** is a built-in function. Its\
    \ first argument is the pin number in question (**int**), and the second argument\
    \ is the mode, which must be either **INPUT** or **OUTPUT**. Note that the mode\
    \ name must be all uppercase.\n\nThis **loop** waits for a command of either **1**\
    \ or **0** to come from the Serial Monitor on your computer. It's a 1, then pin\
    \ 4 will be turned on; otherwise, it will be turned off.\n\nUpload the sketch\
    \ to your Arduino and then open the Serial Monitor (Figure 6-2).\n\nSo, with the\
    \ multimeter turned on and plugged into the Arduino, you should be able to see\
    \ its reading between 0V and 5V as you send commands to the board by pressing\
    \ **1** and then **Return** or pressing 0 and then **Return**. Figure 6-3 shows\
    \ the multimeter reading after a 1 has been sent to the Serial Monitor.\n\nIf\
    \ there are not enough pins labeled \"D\" for your project, you can actually use\
    \ the pins labeled \"A\" (for analog) digital outputs. To do this, you just have\
    \ to add 14 to the\n\nanalog pin number. You could try this out by modifying the\
    \ first line in sketch 6-01 to use pin 14 and moving your positive multimeter\
    \ lead to pin A0 on the Arduino.\n\nThat is really all there is to digital outputs,\
    \ so let's move on swiftly to inputs.\n\n![](img/6426909fcee15359dcfa665c8698110f_95_0.png)\n\
    \n# Figure 6-2 The Serial Monitor\n\n![](img/6426909fcee15359dcfa665c8698110f_96_0.png)\n\
    \n# Figure 6-3 The Serial Monitor\n\n![](img/6426909fcee15359dcfa665c8698110f_97_0.png)\n\
    \n# Figure 6-5 Pin 5 connected to +5V\n\n# Digital Inputs\n\nA typical use for\
    \ an input pin is to connect a switch to it. Figure 6-6 shows how you might be\
    \ expecting to connect your switch.\n\n```\nint inputPin = 5;\n\nvoid setup()\
    \ {\n  pinMode(inputPin, INPUT);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n\
    \  int reading = digitalRead(inputPin);\n  Serial.println(reading);\n  delay(1000);\n\
    }\n```\n\nThe most common use for a digital input is to detect when a switch has\
    \ been closed.\n\nThe problem with this is that if the switch is not closed, the\
    \ input pin is not connected to anything. It is said to be floating, and could\
    \ easily give you a false reading. You need your input to be more predictable,\
    \ and the way to do this is with what is called a pull-up resistor. Figure 6-7\
    \ shows the standard use of a pull-up resistor. It has the effect that if the\
    \ switch is open, the resistor pulls up the floating input to 5V. When you press\
    \ the switch and close the contact, the switch overrides the effect of the resistor,\
    \ forcing the input to 0V. One side-effect of this is, while the switch is closed,\
    \ 5V will be across the resistor, causing a current to flow. So, the value of\
    \ the resistor is selected to be low enough to make it immune from any electrical\
    \ interference, but at the same time high enough to prevent excessive current\
    \ drain when the switch is closed.\n\n# Pull-Resistors\n\n![](img/6426909fcee15359dcfa665c8698110f_98_0.png)\n\
    \nFigure 6-6 Connecting a switch to an Arduino board\n"
