    \ a couple of changes that you need to make. If you look at the top of the sketch,\
    \ you will see the following lines:\n\n```\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF,\
    \ 0xFE, 0xED };\nbyte ip[] = { 192, 168, 1, 30 };\n```\n\nThe first of these,\
    \ the `mac`, must be unique among all the devices connected to your network. The\
