    \nFigure 7-3 A square-wave signal\n\n```\n//sketch 7-03\n\nvoid setup() {\n  tone(4,\
    \ 500);\n}\n\nvoid loop() {\n}\n```\n\nTo stop a tone that is playing, you use\
    \ the function noTone. This function has just one argument, which is the pin on\
    \ which the tone is playing.\n\n# Shift Registers\n\nSometimes the Arduino Uno\
    \ just't have enough pins. When driving a large number of LEDs, for example, a\
    \ common technique is to use a shift register. This chip reads one bit at a time,\
    \ and when it has enough, it latches those bits onto a set of outputs (one per\
    \ bit). To help you use this technique, there is a handy function called shiftOut.\
    \ This function takes four arguments:\n\n- The number of the pin on which the\
    \ bit will be sent.\n- The pin to used as clock. This toggles every time a bit\
    \ is sent.\n- A flag to determine whether the bits will be sent starting with\
    \ the least significant or the most significant. This should be one of constants\
    \ MSB or LSB.\n- The byte of data to be sent.\n\n# Interrupts\n\nOne of the things\
    \ that tend to frustrate programmers is that the Arduino can do only one thing\
    \ at a time. If you like to have threads running at the same time in your programs,\
    \ you are out of luck. Although a few people have developed projects that can\
    \ execute multiple threads, generally this capability is unnecessary for the type\
    \ of uses that Arduino is normally put to. The closest Arduino gets to such execution\
    \ is the use of interrupts.\n\n```cpp\n//sketch 7-04\n\nint interruptPin = 2;\n\
    int ledPin = 13;\nint period = 500;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n\
    \  pinMode(interruptPin, INPUT);\n  digitalWrite(interruptPin, HIGH); // pull-up\n\
    \  attachInterrupt(0, FALLING);\n}\n\nvoid loop() {\n  digitalWrite(ledPin, HIGH);\n\
    \  delay(period);\n  digitalWrite(ledPin, LOW);\n  delay(period);\n}\n\nvoid goFast()\
    \ {\n  period = 100;\n}\n```\n\nThe following is the key line in the setup function\
    \ of this sketch:\n`attachInterrupt(0, FALLING);`\n\n![](img/6426909fcee15359dcfa665c8698110f_118_0.png)\n\
    \nThe first argument specifies which of the two interrupts you want to use. Ratherly,\
    \ 0 here means you are using pin 2, while 1 means you are using pin 3.\n\nThe\
    \ next argument is the name of the function that to be called when there is an\
    \ interrupt, and the final argument is a constant that will be one of CHANGE,\
    \ RISING, or FALLING. Figure 7-4 summarizes these options.\n\nIf the interrupt\
    \ mode is CHANGE, then either a RISING from 0 to 1 or a FALLING from 1 to 0 will\
    \ both trigger an interrupt.\n\nYou can disable interrupts using the function\
    \ noInterrupts. This stops all interrupts from both channels. You can resume using\
    \ interrupts again by calling the function interrupts.\n\n# Conclusion\n\nIn this\
    \ chapter, you have looked at some of the handy features that the Arduino standard\
    \ library provides. These features will save you some programming effort, and\
    \ if there is one thing a good programmer likes, it is to use high-quality work\
    \ done by others.\n\nIn the next chapter, we will extend what we learned about\
    \ data structures in Chapter 5 and look at how you go about remembering data on\
    \ the Arduino after the power goes off.\n\n# 8 Data Storage\n\n**When you give\
    \ values to variables, the Arduino board will remember those values only as long\
    \ as the power is on. The moment you turn the power off or reset the board, all\
    \ that data is lost.**\n\nIn this chapter, we look at some ways to hang on that\
    \ data.\n\n# Constants\n\nIf the data that you want to store does not change,\
    \ then you can just set the data up each time that the Arduino starts. An example\
    \ of this approach is the case in the letters array in your Morse code translator\
    \ of Chapter 5 (sketch 5-05).\n\nYou used the following code to define a variable\
    \ of the correct size and fill it with the data you need:\n\n```\nchar* letters[]\
    \ = {\n    \"\", \"\", \"\", \"\", \"\", \"\", \"\", // A-I\n    \"\", \"\", \"\
    \", \"\", \"\", \"\", \"\", // J-R\n    \"\", \"\", \"\", \"\", \"\", \"\", \"\
    \", // S-Z\n    \"\", \"\", \"\", \"\"\n};\n```\n\nYou may remember that you did\
    \ the calculation and decided that you had plenty of memory 2K to save. However,\
    \ if memory was a bit tight, it would be far better to be able to store this data\
    \ in the 32K of flash memory used to store programs, rather than the 2K of RAM.\
    \ It is a means of doing this. It is a directive called PROGMEM; it lives in a\
    \ library and is a bit awkward to use.\n\n# The PROGMEM Directive\n\nTo store\
    \ your data in flash memory, you have to include the pgmspace library as follows:\n\
    \n```cpp\n#include <avr/pgmspace.h>\n```\n\nThe purpose of this command is to\
    \ tell the compiler the pgmspace library for this sketch. This library is a set\
    \ of functions someone else has written and that you can use without having to\
    \ understand all the details of how functions work. Because you are using this\
    \ library, the PROGM keyword and the pgm_read_word function are available. You\
    \ will use both in the sketches that follow.\n\nThis is an officially supported\
    \ Arduino library. A good collection of such official libraries is available,\
    \ and many unofficial libraries are also available.\n\nWhen using PROGM, you have\
    \ to make sure you use special data types. Unfortunately, that does not include\
    \ an array of char arrays. You actually have to define a variable for each using\
    \ PROGM string type and then put them all in a PROGM array, like this:\n\n```cpp\n\
    PROGM prog_char sa[] = \"-\\-\";\nPROGM prog_char sb[] = \"-\\-\";\n// and so\
    \ on for all letters\nPROGM const char* letters[] = {\n    sa, sB, sC, sD, sE,\
    \ sF, sG, sH, sI, sJ, sK, sL, sM,\n    N, sO, sP, sQ, sR, sS, sT, sU, sV, sW,\
    \ sX, sY, sZ};\n```\n\nIn addition to creating the data string in a special way,\
    \ you also have to read the data back a special way. Your code to get the code\
    \ string for a Morse letter from the array has to be modified to look like this:\n\
    \n```cpp\nstrcpy_P(buffer, (char*) pgm_read_word(&letters[ch - 'a']));\n```\n\n\
    This uses a buffer variable into which the PROGM string is copied, so that it\
    \ can be used as a regular char array. This needs to be defined as a global variable\
    \ as follows:\nchar buffer[6];\n\nI not listed sketch 8-01 here, as it is a little\
    \ lengthy, but you may wish to load it and verify that it works the same way as\
    \ the RAM-based version.\n\nThis approach works only if the data is constant—that\
    \ is, you are not going to change it while the sketch is running. In the next\
    \ section, you will learn about using the EEPROM memory that is intended for storing\
    \ persistent data that can be changed.\n"
