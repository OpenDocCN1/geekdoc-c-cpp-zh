  mdcn: "\n让 Arduino IDE 在用户编辑代码时能够以适当颜色显示它们。\n另一个是包含一些如何使用该库的示例。\n\n## 关键字\n\n要定义关键字，你需要创建一个名为\
    \ `keywords.txt` 的文件，将其放入 `flasher` 目录。此文件仅包含以下两行：\n\n```\nFlasher KEYWORD1\n\
    flash KEYWORD2\n```\n\n这本质上是文本文件中的双列表格。左列是关键字，右列是该关键字类型的指示。类名应该是 `KEYWORD1`，而方法应该是\
    \ `KEYWORD2`。在两列之间放置多少个空格或制表符都没有关系，但每个关键字应该从新的一行开始。\n\n## 示例\n\n作为一名良好的 Arduino\
    \ 成员，你应该作为库的一部分包含的另一个内容是包含示例的文件夹。在这种情况下，该库非常简单，一个示例就足够了。\n\n所有示例必须放置在 `Flasher`\
    \ 文件夹内名为 `examples` 的文件夹中。实际上，示例只是一个 Arduino 图程序（sketch），因此你可以使用 Arduino IDE 创建该示例。但首先，你必须退出并重新打开\
    \ Arduino IDE，以便它识别新库。\n\n重启 Arduino IDE 后，从 Arduino IDE 的菜单中选择 `File` 然后选择 `New`\
    \ 来创建一个新的图程序窗口。然后从菜单 `Sketch` 中，选择 `Import Library` 选项。这些选项看起来类似于图 11-1 所示。\n\n\
    子菜单中行线以上的库是官方库；此线以下是“非官方”的贡献库。如果一切顺利，你应该会在列表中看到 `Flasher`。\n\n如果列表中没有 `Flasher`，很可能是\
    \ `Flasher` 文件夹不在你的 sketch 文件夹的库文件夹中，请回去检查一下。\n\n![](img/6426909fcee15359dcfa665c8698110f_153_0.png)\n\
    \n### ### 图 11-1 导入 Flasher 库\n\n在刚刚创建的图程序窗口输入以下内容：\n#include <Flasher.h>\n\n\
    ```cpp\nint ledPin = 13;\nint slowDuration = 300;\nint fastDuration = 100;\n```\n\
    \n```cpp\nFlasher slowFlasher(ledPin, slowDuration);\nFlasher fastFlasher(ledPin,\
    \ fastDuration);\n```\n\n```cpp\nvoid setup() {\n}\nvoid loop() {\n  slowFlasher.flash(5);\n\
    \  delay(1000);\n  fastFlasher.flash(10);\n  delay(2000);\n}\n```\n\nArduino IDE\
    \ 不允许你直接将示例图程序保存到库文件夹，因此请将其保存到其他地方并命名为 `Simple Flasher Example`，然后将你保存的整个 `Simple\
    \ Flasher Example` 文件夹移动到你库中的 `examples` 文件夹中。\n\n如果你重启 Arduino IDE，现在你应该应该能够从图\
    \ 11-2 所示的菜单中打开示例图程序。\n\n![](img/6426909fcee15359dcfa665c8698110f_154_0.png)\n\
    \n**图 11-2** 打开示例图程序\n\n## 结论\n\nC++ 和编写库还有更多内容，但本章应该能让你入门。对于你可能使用 Arduino 进行的大部分工作，这也足够了。Arduino\
    \ 是微型设备，人们往往倾向于过度设计那些本可以非常简单且直接的解决方案。\n\n本书的正文到此结束。关于 Arduino 的更多信息以及下一步的去处，良好的起点始终是官方\
    \ Arduino 网站：\n\nwww.arduino.cc。此外，请参考书籍的网站 www.arduinobook.com，你可以在那里找到错误勘正和其他有用的资源。\n\
    \n如果你在寻求帮助或建议，www.arduino.com/forum 上的 Arduino 社区非常有帮助。你还可以在那里找到用户名为 `Si` 的作者。\n\
    \n## 索引\n\n请注意，索引链接指向打印版中的页码开头。在电子阅读器中，位置是近似的，在点击链接后，你可能需要向下翻页一次或多次才能到达索引材料。\n\
