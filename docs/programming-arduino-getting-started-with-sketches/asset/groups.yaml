    # 3 C 语言基础


    用于为 Arduino 的编程语言称为 C。在本章中，你将学习 C 语言的基础。作为一名 Arduino 程序员，你将在每个程序（sketch）中使用你所学的知识。为了充分利用
    Arduino，你需要理解这些基础知识。


    # 编程


    人们学习多种语言并不罕见。事实上，你语言学得越多，学习其他语言似乎就越容易。编程语言也是如此。因此，如果你学过任何其他编程语言，很快就能学会 C。


    好消息是，编程语言的词汇比口语语言少得多，而且因为你是写出来的而不是说出来的，字典在你需要查找时总是触手可用。此外，编程语言的语法和词汇非常有规律，一旦你掌握了几个简单的概念，进一步的学习就会变成一种本能。


    最好的方法是将程序（在 Arduino 中称为 sketch）看作按照书写顺序执行的指令列表。例如，假设你写了以下内容：


    ```

    digitalWrite(13, HIGH);

    delay(500);

    digitalWrite(13, LOW);

    ```


    这三行代码会执行某些操作。第一行将 13 引脚设置为 HIGH，这在 Arduino 板上会让 LED 亮起。第二行简单地等待 500 毫秒（半秒），然后第三行会将
    LED 再次关闭。这三行代码实现了让 LED 闪烁的目标。


    你已经看到了一些没有空格的标点符号。许多新程序员感到困惑的地方是：“我知道我想做什么，但我不知道怎么写！”不要，这些都会得到解释。


    首先，让我们处理标点符号和单词的形成。这些都是语言语法的一部分。大多数语言要求你极其精确，其中一个主规则是名称必须是单词，也就是说它们不能包含空格。因此，`digitalWrite`
    是一个名称。这是一个内置函数（你稍后会学更多），它会在 Arduino 板上为你输出引脚。不仅名称中要避免空格，而且对大小写敏感。你必须写 `digitalWrite`，而不是
    `DigitalWrite` 或 `Digitalwrite`。


    `digitalWrite` 函数需要知道设置哪个引脚以及将其设置为 HIGH 还是 LOW。这两条信息被称为参数，在函数被调用时传递给它。


    通常的做法是在函数名的最后一个字母后立即放置左括号，并在下一个参数之前加上逗号。然而，如果你愿意，也可以在参数内部添加空格字符。


    如果函数只有一个参数，那么就不需要逗号。


    注意每一行都以分号结尾。如果使用句号会更符合逻辑，因为分号标记了一个命令的结束，就像句子的结尾。


    在下一节中，你将发现更多关于点击 Arduino 集成开发环境（IDE）上的上传按钮会发生什么。然后你就可以开始尝试几个例子了。


    # 什么是编程语言？


    可能令人惊讶的是，我们在关于编程的书中到了第 3 章，还没有定义什么是编程语言。我们可以识别出一个 Arduino sketch，并大致知道它在做什么，但我们需要更深入地研究编程语言代码是如何从页面上的文字变成执行实际操作的（比如开关
    LED）。


    图 3-1 总结了从在 Arduino IDE 中输入代码到在板上运行 sketch 的。


    ![](img/6426909fcee15359dcfa665c8698110f_42.png)


    # 图 3-1 板上的代码


    当你点击 Arduino IDE 上的上传按钮时，它会启动一系列事件，导致你的 sketch 安装到 Arduino 上并运行。这并不是简单地将你在编辑器中输入的文本移动到
    Arduino 板上那么直接。


    第一步是进行所谓的“编译”。它将你编写的代码翻译成机器码——Arduino 能理解的二进制语言。如果你点击 Arduino IDE 上的三角形“验证”按钮，它实际上是在尝试编译你写的
    C 代码，而不尝试将代码发送到 Arduino IDE。编译代码的副作用是检查以确保它符合 C 语言的规则。


    如果你在 Arduino IDE 中输入 `Ciao Bella` 并点击播放按钮，结果如图 3-2 所示。


