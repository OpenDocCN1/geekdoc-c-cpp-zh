    \ Arduino.\n\n# Global, Local, and Static Variables\n\nAs was mentioned before,\
    \ parameters to a function can be used only inside that function. So, if you wrote\
    \ the following code, you would get an error:"
  - "[PAGE 64]\n\n```\nvoid indicate(int x)\n{\n    flash(x, 10);\n}\nx = 15;\n```\n\
    \nOn the other hand, suppose you wrote this:\n\n```\nint x;\nvoid indicate(int\
    \ x)\n{\n    flash(x, 10);\n}\nx = 15;\n```\n\nThis code would not result in a\
    \ compilation error. However, you need to be careful, because you now actually\
    \ have two variables called x and they can each have different values. The one\
    \ that you declared on the first line is called a global variable. because it\
    \ can be used anywhere you like in the program, including inside any functions.\n\
    \nHowever, because you use the same variable name x inside the function, as a\
    \ parameter, you cannot use the global variable whenever you refer to x inside\
    \ the function, the \"local\" version of x has priority. The parameter x is said\
    \ to shadow the global variable of the same name. This can lead to some confusion\
    \ when trying to debug a project.\n\nIn addition to defining parameters, you can\
    \ also define variables that are not parameters but are just for use within a\
    \ function. These are called local variables. For example:\n\n```\nvoid indicate(int\
    \ x)\n{\n    int timesToFlash = x * 2;\n    flash(timesToFlash, 10);\n}\n```\n\
    \nThe local variable timesToFlash will only exist while the function is running.\
    \ As soon as the function has finished its last command, it will disappear. This\
    \ means that local variables are not accessible from anywhere in your program\
    \ other than in the function in which they are defined.\n\nSo, for instance, the\
    \ following example will cause an error:\n\n```\nvoid indicate(int x)\n{\n   \
    \ int timesToFlash = x * 2;\n    flash(timesToFlash, 10);\n}\n```\n\ntimesToFlash\
    \ = 15;"
- md: "\nSeasoned programmers generally treat global variables with suspicion. The\
    \ reason is that they go against encapsulation. The idea of encapsulation is that\
    \ you should wrap up in a package everything that has to do with a particular\
    \ feature. Hence functions are great for encapsulation. The problem with \"globals\"\
    \ (as global variables are often called) is that they generally get defined at\
    \ the beginning of a sketch and may be used all over the sketch. Sometimes there\
    \ is a legitimate reason for this. Other times, people use them in a lazy way\
    \ when it would be far more appropriate to pass parameters. In our examples so\
    \ far, ledPin is a good use of a global variable. It's very convenient and easy\
    \ to find up at the top of the sketch, making it easy to change. ledPin is really\
    \ a constant, although you may change it and then recompile your sketch, which\
    \ is actually running. For this reason, you may prefer to use the #define command\
    \ we describe in Chapter 3.\n\nAnother feature of local variables is that their\
    \ value is initialized every time the function is run. There is nowhere more (and\
    \ often inconvenient) in the loop function of an Arduino sketch. Let's try and\
    \ use a local variable in place of global variable in one of the examples from\
    \ the previous chapter:\n\n```\n// sketch 4-03\nint ledPin = 13;\nint delayPeriod\
    \ = 250;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  int\
    \ count = 0;\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  count++;\n  if (count == 20) {\n    count =\
    \ 0;\n    delay(3000);\n  }\n}\n```\n\nSketch 4-03 is based on the sketch 3-09,\
    \ but attempts to use a local variable instead of the global variable to count\
    \ the number of flashes.\n\nThis sketch is broken. It will not work, because every\
    \ loop is run, the variable count will be given the value 0 again, so count will\
    \ never reach 20 and the LED will keep flashing forever. The whole reason that\
    \ we made count global in the first place was that its value would not be reset.\
    \ The only place that we use count is in the loop function, so this is where it\
    \ should be placed.\n\nFortunately, there is a mechanism in C that gets around\
    \ this conundrum. It is the keyword static. When you use the keyword static in\
    \ a variable declaration in a function, it has the effect of initializing the\
    \ variable only the first time that the function is run. Perfect! That's what\
    \ is required in this situation. We can keep our variable in the function where\
    \ it's used without it getting set back to 0 every time the function runs. Sketch\
    \ 4-04 shows this in operation:\n\n```\n// sketch 4-04\nint ledPin = 13;\nint\
    \ delayPeriod = 250;\nvoid setup() {\n    pinMode(ledPin, OUTPUT);\n}\nvoid loop()\
    \ {\n    static int count = 0;\n    digitalWrite(ledPin, HIGH);\n    delay(delayPeriod);\n\
    \    digitalWrite(ledPin, LOW);\n    delay(delayPeriod);\n    count++;\n    if\
    \ (count == 20) {\n        count = 0;\n        delay(3000);\n    }\n}\n```\n\n\
    # Return Values\n\nComputer science, as an academic discipline, has as its parents\
    \ mathematics and engineering. This heritage lingers on in many of the names associated\
    \ with programming. The word function is itself a mathematical term. In mathematics,\
    \ the input to the function (the argument) completely determines the output. We\
    \ have written functions that take an input, but none that gives us back a value.\
    \ All our functions have been \"void\" functions. If a function returns a value,\
    \ then you specify a return type.\n\nLet's look at writing a function that takes\
    \ a temperature in degrees Centigrade and returns the equivalent in degrees Fahrenheit:\n\
    \n```\nint centToFaren(int c)\n{\n    int f = c * 9 / 5 + 32;\n    return f;\n\
    }\n```\n\nThe function definition now starts with int rather than void to indicate\
    \ that the function will return an int to whatever it calls. This might be a bit\
    \ of code that looks like this:\nint pleasantTemp = centToFaren(20);\n\nAny non-void\
    \ function has to have a return statement in it. If you do not put one in, the\
    \ compiler will tell you it is missing. You can have more than one return in the\
    \ same function. This might arise if you have an if statement with alternative\
    \ actions based on some condition. Some programmers frown upon this, but if your\
    \ functions are small (as all functions should), then this practice will not be\
    \ a problem.\n\nThe value after return can be an expression; it does not have\
    \ to be the name of a variable. So you could compress the preceding example into\
    \ the following:\n\n```\nint centToFaren(int c)\n{\n  return (f = c * 9 / 5 +\
    \ 32);\n}\n```\n\nIf the expression being returned is more than just a variable\
    \ name, then it should be enclosed in the preceding example.\n\n# Other Variable\
    \ Types\n\nAll our examples of variables so far have been int variables. This\
    \ is by far the most commonly used variable type, but there are some others that\
    \ you should be aware of.\n\n# floats\n\nOne such type, which is relevant to the\
    \ previous temperature conversion example, is float. This variable type represents\
    \ floating point numbers—that is, numbers that may have a decimal point in them,\
    \ such as 1.23. You need this variable type when numbers are not precise enough.\n\
    \nNote the following formula:\n\n```\nf = c * 9 / 5 + 32\n```\n\nIf you give c\
    \ the value then, 17 f will be 17 * 9 / 5 + 32 or 62.6. But if f is an int, then\
    \ the value will be truncated to 62.\n\nThe problem becomes even worse if we are\
    \ not careful of the order in which we evaluate things. For instance, suppose\
    \ that we did the division first, as follows:\n\n```\nf = (c / 5) * 9 + 32\n```\n\
    \nThen in normal math terms, the result would still be 62.6, but if all the numbers\
    \ are ints, then the calculation would proceed as follows:\n\n- 1. 17 is divided\
    \ by 5, which gives 3.4, which is then truncated to 3.\n- 2. 3 is then multiplied\
    \ by 9 and 32 is added to get a result of 59—which is quite a long from 62.6.\n\
    \nFor circumstances like this, we can use floats. In the following example, our\
    \ temperature conversion function is rewritten to use floats:\n\n```\nfloat centToFaren(float\
    \ c)\n{\n  float f = c * 9.0 / 5.0 + 32.0;\n  return f;\n}\n```\n\nNotice how\
    \ we have added .0 to the end of our constants. This ensures that the compiler\
    \ knows to treat them as floats rather than ints.\n\n# boolean\n\nBoolean values\
    \ are logical. They have a value that is either true or false.\n\nIn the C language,\
    \ Boolean is spelled with a lowercase b, but in general use, Boolean has an uppercase\
    \ initial letter, as it is named after the mathematician George Bool, who invented\
    \ the Boolean logic that is crucial to computer science.\n\nYou may not realize\
    \ it, but you have already met Boolean values when we were looking at the command.\
    \ The condition in an if statement, as (count == 20), is actually an expression\
    \ that yields a boolean result. The operator == is a comparison operator. Whereas\
    \ it is an arithmetic operator that adds two numbers together, == is a comparison\
    \ operator that compares two numbers and returns a value of true or false.\n\n\
    You can define variables and use them as follows:\n\n```\nboolean tooBig = (x\
    \ > 10);\n{\n  x = 5;\n}\n```\n\nBoolean values can be manipulated using Boolean\
    \ operators, similar to how you can perform arithmetic on numbers, Boolean values.\
    \ The most commonly used Boolean operators are and, which is written as &&, and\
    \ or, which is written as ||.\n\nFigure 4-1 shows true tables for the and and\
    \ or operators.\n\nFrom the truth tables in Figure 4-1, you can see that for and,\
    \ if both A and B are true, then the result will be true; otherwise, the result\
    \ will be false.\n\n| AND | OR |\n|---|---|---|\n| **A** | false | true |\n| **B**\
    \ | false | true |\n\nOn the other hand, with the or operator, if either A or\
    \ B or both A and B are true, then the result will be true. The result will be\
    \ false if neither A nor B is true.\n\nIn addition to and and or, there is the\
    \ not operator, written as ! You will not be surprised to learn that \"not true\"\
    \ is false and \"not false\" is true.\n\nFigure 4-1 Truth tables\n\nYou can combine\
    \ these operators into Boolean expressions in your if statements, as the following\
    \ example illustrates:\n((x > 10) && (x < 50))\n\n# Other Data Types\n\nAs you\
    \ have seen, the int and occasionally the float data types are fine for most situations;\
    \ however, some other numeric types can be useful under some circumstances. In\
    \ an Arduino sketch, the int type uses 16 bits (binary digits). This allows it\
    \ to represent numbers between -32767 and 32768.\n\nOther data types available\
    \ to you are summarized in Table 4-1. This table is provided mainly for reference.\
    \ You will use some of these other types as you progress through the book.\n"
  mdcn: "\n经验丰富的程序员通常对全局变量持怀疑态度。这是因为它们违反了**封装**。封装的思想是你应该将变量封装在函数内部，使其只在函数内部可见。这可以防止意外地修改变量的值。\n\
    \n局部变量的另一个特点是它们的值在函数执行时初始化，并在函数结束时被销毁。在这种情况下，局部变量是实用的。\n\n在以下示例中，我们尝试使用局部变量来代替全局变量：\n\
    \n```cpp\n// sketch 03\nint ledPin = 13;\nint delayPeriod = 250;\nvoid setup()\
    \ {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  int count = 0;\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  count++;\n  if (count == 20) {\n    count = 0;\n    delay(3000);\n  }\n}\n\
    ```\n\nSketch 03 是基于 sketch 09，但尝试使用局部变量而不是全局变量来计算 LED 的闪烁次数。\n\n这个 sketch 将无法工作，因为每次\
    \ loop 函数运行时，变量 count 都会被重置为 0，所以 count 永远不会达到 20。\n\n幸运的是，C 语言有一种 `static` 机制可以解决这个难题。当你在函数声明中使用\
    \ `static` 关键字时，变量只在函数第一次运行时初始化一次。Sketch 04 显示了这种操作：\n\n```cpp\n// sketch 04\n\
    int ledPin = 13;\nint delayPeriod = 250;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n\
    }\n\nvoid loop() {\n    static int count = 0;\n  digitalWrite(ledPin, HIGH);\n\
    \  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  count++;\n  if (count == 20) {\n    count = 0;\n    delay(3000);\n  }\n}\n\
    ```\n\n# 返回值\n\n计算机科学作为一门学科，其父母是数学和工程。在数学中，函数的输入（参数）完全决定了输出。在编程中，函数也可以接收输入并返回一个值。到目前为止，我们写的函数都是\
    \ `void` 类型的。如果一个函数返回一个值，那么你需要指定返回类型。\n\n让我们看一个接收摄氏度并返回等效华氏度的函数：\n\n```cpp\nint\
    \ centToFaren(int c)\n{\n    int f = c * 9 / 5 + 32;\n    return f;\n}\n```\n\n\
    函数定义现在以 `int` 而不是 `void` 开头，表示函数将返回一个整数。任何非 `void` 函数都必须有一个 `return` 语句。如下所示：\n\
    int pleasantTemp = centToFaren(20);`\n\n`return` 之后的值可以是一个表达式，而不一定是一个变量名。有些程序员不喜欢这样做，但如果你的函数很短小（所有的函数都应该是这样的），那么这种做法没有问题。\n\
    \n你可以将前面的示例压缩为以下内容：\n\n```cpp\nint centToFaren(int c)\n{\n  return (c * 9 / 5\
    \ + 32);\n}\n```\n\n如果返回的表达式不仅仅是一个变量名，那么它应该像前面的示例中那样被括起来。\n\n# 其他变量类型\n\n到目前为止，我们所有的变量示例都是\
    \ `int` 变量。这是最常用的变量类型，但你应该注意其他一些。\n\n# 浮点数\n\n一种与之前的温度转换示例相关的类型是 `float`。这种变量类型表示浮点数——即可能带有小数点的数字，例如\
    \ 1.23。当数字不够精确时，你需要这种变量类型。\n\n注意以下公式：\n\n```cpp\nf = c * 9 / 5 + 32\n```\n\n如果你给\
    \ c 赋值为 17，那么 f 将是 `17 * 9 / 5 + 32`，即 62.6。但如果 f 是一个 `int`，那么该值将被截断为 62。\n\n\
    如果我们不注意评估它们的顺序，问题会变得糟糕。例如，假设我们先进行除法：\n\n```cpp\nf = (c / 5) * 9 + 32\n```\n\n\
    在普通的数学术语中，结果仍然是 62.6，但如果所有数字都是 `int`，那么计算过程如下：\n\n- 1. 17 除以 5 得到 3.4，然后被截断为 3。\n\
    - 2. 3 乘以 9 并加上 32，得到结果 59——这与 62.6 差得远了。\n\n对于这种情况，我们可以使用 `float`。在下面的示例中，我们的温度转换函数被重写为使用\
    \ `float`：\n\n```cpp\nfloat centToFaren(float c)\n{\n  float f = c * 9.0 / 5.0\
    \ + 32.0;\n  return f;\n}\n```\n\n注意我们在常量末尾添加了 .0。这确保编译器知道将它们处理为 `float` 而不是 `int`。\n\
    \n# 布尔值\n\n布尔值是逻辑性的。它们的值为真（true）或假（false）。\n\n在 C 语言中，boolean 的拼写是小写的 b，但在通用情况下，Boolean\
    \ 的首字母大写，因为它以数学家乔治（George Bool）的名字命名，他发明了计算机科学至关重要的布尔逻辑。\n\n你可能没有意识到，当我们在研究 `if`\
    \ 命令时已经遇到过布尔值了。布尔值可以使用布尔运算符进行操作，就像你对数字进行算术运算一样。最常用的布尔运算符是与（写作 `&&`）和或（写作 `||`）。\n\
    \n图 4-1 显示了与运算符和或运算符的真值表。\n\n从图 4-1 的真值表中可以看出，对于与运算符，如果 A 和 B 都为真，则结果为真；否则，结果为假。\n\
    \n| AND | OR |\n|---|---|\n| **A** | false | true |\n| **B** | false | true |\n\
    \n相反，对于或运算符，如果 A 或 B 或 A 和 B 都为真，则结果为真。如果 A 和 B 都不为真，则结果为假。\n\n除了与和或之外，还有非运算符，写作\
    \ `!`。你不会惊讶于发现“非真”是假，“非假”是真。\n\n任何非 `void` 函数都必须有一个语句。你可以在 `if` 语句中将这些运算符组合成布尔表达式，如下例所示：\n\
    ((x > 10) && (x < 50))\n"
