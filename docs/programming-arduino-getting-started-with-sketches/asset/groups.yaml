    After downloading the file, unzip it and place the unzipped folder, called Bounce,
    into the libraries subfolder in the folder where all your sketches are saved.
    On Windows, this folder is My Documents/Arduino, and on Mac and Linux, it is Documents/Arduino.
    If there is no libraries subfolder, you will need to create one. Figure 6-10 shows
    the folder structure in Windows after a library has been added.


    After adding the library, you will need to restart the Arduino application for
    the changes to take effect. Once you do so, you can use the Bounce library in
    any sketches that you write.


    Sketch 6-07 shows how you can use the Bounce library. Upload it to your board
    and see how reliable the LED toggling has become.'
  - "[PAGE 105]\n\n```\n//sketch 6-07\n#include <Bounce.h>\nint inputPin = 5;\nint\
    \ ledPin = 13;\n\nint ledValue = LOW;\nBounce bouncer = Bounce(inputPin, 5);\n\
    \nvoid setup() {\n  pinMode(inputPin, INPUT);\n  digitalWrite(inputPin, HIGH);\n\
    \  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  if (bouncer.update() && bouncer.read()\
    \ == LOW) {\n    ledValue = !ledValue;\n    digitalWrite(ledPin, ledValue);\n\
    \  }\n}\n```\n\nUsing the library is pretty straightforward. The first thing that\
    \ you will notice is this line:\n#include <Bounce.h>\n\nIt is necessary to tell\
    \ the compiler to use the Bounce library.\nYou then have the following line:\n\
    bouncer bouncer = Bounce(inputPin, 5)\n\nDo not worry about the syntax of this\
    \ line at the moment; it is actually C++ rather than C syntax, and you will not\
    \ be meeting C++ until Chapter 11. For now, you will just have to be content to\
    \ know that this sets up a bouncer object for the pin specified, with a debounce\
    \ period of 5 milliseconds.\n\nFrom now on, you use that bouncer object to find\
    \ out what is going doing reading the digital input directly. It puts a kind of\
    \ debouncing wrapper around your input pin. So, deciding whether a button has\
    \ been pressed is wrapped up in this line:\nif (bouncer.update() && bouncer.read()\
    \ == LOW)\n\nThe function update returns true if something has changed with the\
    \ bouncer object and the second part of the condition checks whether the button\
    \ went LOW."
  - "[PAGE 106]\n\n# Analog Outputs\n\nA few of the digital pins—namely digital pins\
    \ 3, 5, 6, 9, 10, and 11—can provide variable output other than just 5V or nothing.\
    \ These are the pins on the board with a ~ or \"PWM\" next to them. PWM stands\
    \ for Pulse Width Modulation, which refers to the means of controlling the amount\
    \ of power at the output. It does so by rapidly turning the output on and off.\n\
    \nThe pulses are always delivered at the same rate (roughly 500 per second), but\
    \ the length of the pulses is varied. If you were to use PWM to control the brightness\
    \ of an LED, then if the pulse were long, the LED would be lit for all the time.\
    \ However, if the pulses are short, then the LED is lit only for a small portion\
    \ of the time. This happens too fast for the observer to tell that the LED is\
    \ flickering, and it just appears that the LED is lighter or dimmer.\n\nBefore\
    \ you try using an LED, you can test this out with your multimeter. Set the multimeter\
    \ to measure the voltage between GND and pin D3 (see Figure 6-11).\n\nNow upload\
    \ sketch 6-08 to your board and open the Serial Monitor (see Figure 6-12). Enter\
    \ the single digit 3 and press Return. You should see your volt meter register\
    \ about 3V. You can try any other number between 0 and 5.\n\n```\n//sketch 6-08\n\
    \nint outputPin = 3;\n\nvoid setup()\n{\n  pinMode(outputPin, OUTPUT);\n  Serial.begin(9600);\n\
    \  Serial.println(\"Enter Volts 0 to 5\");\n}\nvoid loop()\n{\n  if (Serial.available()\
    \ > 0)\n{\n    char ch = Serial.read();\n    int volts = (ch - '0') * 51;\n  \
    \  analogWrite(outputPin, volts);\n  }\n}\n```"
- md: "\n![](img/6426909fcee15359dcfa665c8698110f_107_0.png)\n\nFigure 6-11 Measuring\
    \ the analog output\n\n![](img/6426909fcee15359dcfa665c8698110f_107_1.png)\n\n\
    Figure 6-12 Setting the voltage at an analog output\n\nThe program determines\
    \ the value of PWM output between 0 and 255 by multiplying the desired voltage\
    \ (0 to 5) by 51. (Readers may wish to refer to Wikipedia for a fuller description\
    \ of PWM).\n\nYou can set the value of the output by the function analogWrite,\
    \ which requires an output value between 0 and 255, where 0 is off and 255 is\
    \ full power. This is actually a great way to control the brightness of an LED.\
    \ If you were to control the brightness varying across the LED, you would find\
    \ that nothing would happen until you got about 2V; the LED would very quickly\
    \ get quite bright. By controlling the brightness using PWM and varying the average\
    \ amount of time that the LED is on, you achieve much more linear control of the\
    \ brightness.\n\n## Analog Input\n\nDigital inputs just give you an on/off answer\
    \ as to what is happening at a particular pin on the Arduino board. Analog inputs,\
    \ however, give you a value between 0 and 1023 depending on the voltage at the\
    \ analog input pin.\n\nThe program reads the analog input using the analogRead\
    \ function. Sketch 6-09 displays the reading and actual voltage at the analog\
    \ pin A0 in the Serial Monitor every half second, so open the Serial Monitor and\
    \ watch the readings appear.\n\n```\n//sketch 6-09\nint analogPin = 0;\n\nvoid\
    \ setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int reading = analogRead(analogPin);\n\
    \  float voltage = reading / 204.6;\n  Serial.print(\"Reading=\");\n  Serial.print(reading);\n\
    \  Serial.print(\"\\tVolts=\");\n  Serial.println(voltage);\n  delay(500);\n}\n\
    ```\n\nWhen you run this sketch, you will notice that the readings change quite\
    \ a bit. As with the digital inputs, this is because the input is floating.\n\n\
