    \n第一个参数指定你想使用两个中断中的哪一个。在这里，0 意味着你正在使用引脚 2，而 1 意味着你正在使用引脚 3。\n\n下一个参数是发生中断时调用的函数名称，最后一个参数是一个常量，可以是\
    \ `CHANGE`、`RISING` 或 `FALLING` 之一。图 7-4 总结了这些选项。\n\n如果中断模式为 `CHANGE`，那么从 0 到\
    \ 1 的上升（RISING）或从 1 到 0 的下降（FALLING）都会触发中断。\n\n你可以使用 `noInterrupts` 函数禁用中断。这会停止两个通道的所有中断。你可以通过调用\
    \ `interrupts` 函数恢复使用中断。\n\n# 总结\n\n在本章中，你查看了 Arduino 标准库提供的一些实用功能。这些功能将节省你一些编程工作，如果说有一个优秀的程序员喜欢的一件事，那就是使用他人完成的高质量工作。\n\
    \n在下一章中，我们将扩展在第 5 章中学到的数据结构知识，并查看如何在掉电后在 Arduino 上记住数据。\n\n# 8 数据存储\n\n**当你给变量赋值时，Arduino\
    \ 板上只有在通电时才会记住这些值。一旦你关闭电源或重置板子，所有数据都会丢失。**\n\n在本章中，我们将研究一些保留这些数据的方法。\n\n# 常量\n\
    \n如果你想要存储的数据不会改变，你只需要在每次 Arduino 启动时设置数据即可。这种方法的一个例子是第 5 章摩斯密码翻译器中的字母数组（sketch\
    \ 5-05）。\n\n你使用了以下代码来定义一个正确大小的变量并填充你需要的数据：\n\n```\nchar* letters[] = {\n    \"\
    \", \"\", \"\", \"\", \"\", \"\", \"\", // A-I\n    \"\", \"\", \"\", \"\", \"\
    \", \"\", \"\", // J-R\n    \"\", \"\", \"\", \"\", \"\", \"\", \"\", // S-Z\n\
    \    \"\", \"\", \"\", \"\"\n};\n```\n\n你可能记得你进行过计算，并决定你有足够的 2K 内存可以保存。然而，如果内存有点紧张，那么将这些数据存储在用于存储程序的\
    \ 32K 闪存中，而不是 2K 的 RAM 中要好得多。这是实现此目的的方法。这是一个名为 `PROGMEM` 的指令。\n\n# PROGMEM 指令\n\
    \n为了将数据存储在闪存中，你需要包含 pgmspace 库，如下：\n\n```cpp\n#include <avr/pgmspace.h>\n```\n\
    \n此命令的目的是告诉编译器该 sketch 使用 pgmspace 库。该库是编写的一组函数，你不需要了解函数的工作原理就可以使用。由于你使用了这个库，`PROGM`\
    \ 关键字和 `pgm_read_word` 函数是可用的。你将在后面的 sketch 使用它们。\n\n这是官方支持的 Arduino 库。有很多这样的官方库可用，也有许多非官方库可用。\n\
    \n使用 `PROGM` 时，你必须确保使用特殊的数据类型。遗憾的是，它不包含字符数组。你实际上需要为每个变量定义一个 PROGM 类型，然后将它们放入一个\
    \ PROGM 数组中，如下：\n\n```cpp\nPROGM prog_char sa[] = \"-\\-\";\nPROGM prog_char sb[]\
    \ = \"-\\-\";\n// 对所有字母如此操作\nPROGM const char* letters[] = {\n    sa, sB, sC,\
    \ sD, sE, sF, sG, sH, sI, sJ, sK, sL, sM,\n    N, sO, sP, sQ, sR, sS, sT, sU,\
    \ sV, sW, sX, sY, sZ};\n```\n\n除了以特殊方式创建数据字符串，你还需要以特殊方式读取数据。你从数组获取摩斯字母字符串的代码需要修改为：\n\
    \n```cpp\nstrcpy_P(buffer, (char*) pgm_read_word(&letters[ch - 'a']));\n```\n\n\
    这使用一个 `buffer` 变量将 PROGM 字符串复制进去，以便可以像普通的字符数组一样使用。这需要被定义为全局变量，如下：\nchar buffer[6];\n\
    \n这里没有列出 sketch 8-01，因为它有点长，但你可能希望加载它并验证其工作方式与 RAM 版本相同。\n\n这种方法仅适用于数据是常量的情况——即你不会在\
    \ sketch 运行时更改它。在下一节中，你将学习使用用于存储持久化数据的 EEPROM 内存。\n\n"
