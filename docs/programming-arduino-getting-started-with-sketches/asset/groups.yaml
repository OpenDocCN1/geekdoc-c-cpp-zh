    \ they have been printed with initial caps.\n\nMcGraw-Hill eBooks are available\
    \ at special quantity discounts to use as premiums and sales promotions, or for\
    \ use in corporate training programs. To contact a representative email us at\
    \ buksales@mcraw-hill.com.\n\nAll trademarks and copyrights mentioned herein are\
    \ the possession of their respective owners and McGraw-Hill makes no claim of\
    \ ownership by the mention of products that contain these marks.\n\n“Arduino”\
    \ is a trademark of the Arduino team.\n\nInformation has been obtained by McGraw-Hill\
    \ from sources believed to be reliable. However, because of the possibility of\
    \ human or mechanical error by our sources, McGraw-Hill, or others, McGraw-Hill\
    \ does not guarantee the accuracy, adequacy, or completeness of any information\
    \ and is not responsible for any errors or omissions or the results obtained from\
    \ such use of information.\n\n# TERMS OF USE\n\nThis is a copyrighted work and\
    \ The McGraw-Hill Companies, Inc. (“McGraw-Hill”) and its licensors reserve all\
    \ rights in and to the work. Use of this work is subject to these terms. Except\
    \ as permitted under the Copyright Act of 1976 and the right to store and retrieve\
    \ one copy of the work, you may not decompile, disassemble, reverse engine, reproduce,\
    \ modify, create derivative works based upon, transmit, distribute, disseminate,\
    \ sell, publish or sublicense the work or any part of without McGraw-Hill’s prior\
    \ consent. You may use the work for your own noncommercial and personal use; any\
    \ other use of the work is strictly prohibited. Your right to use the work may\
    \ be terminated if you fail to comply with these terms.\n\nTHE WORK IS PROVIDED\
    \ “AS IS.” HILL AND ITS LICENSORS MAKE NO GUARANTEES OR WARRANTIES AS TO THE ACCURACY,\
    \ ADEQUACY OR COMPLETENESS OF RESULTS TO BE OBTAINED FROM USING THE WORK, INCLUDING\
    \ ANY INFORMATION THAT CAN BE ACCESSED THROUGH THE WORK VIA HYPERLINK OR OTHERWISE,\
    \ AND EXPRESSLY DISCLAIM ANY WARRANTY, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED\
    \ TO IMPLIED WARRANTIES OF MERCHANTABILITY OR FITNESS FOR A PARTICULAR PURPOSE.\
    \ McGraw-Hill and its licensors do not warrant or guarantee that the functions\
    \ contained in the work will meet your requirements or that its operation will\
    \ be uninterrupted or error free. Neither McGraw-Hill nor its licensors shall\
    \ be liable to you or anyone else for any inaccuracy, error or omission, regardless\
    \ of cause, in the work or for any damages resulting therefrom. McGraw-Hill has\
    \ no responsibility for the content of any information accessed through the work.\
    \ Under no circumstances shall McGraw-Hill and/or its licensors be liable for\
    \ any indirect, incidental, special, punitive, consequential or similar damages\
    \ that result from the use of or inability to use the work, even if any of them\
    \ has been advised of the possibility of such damages. This limitation of liability\
    \ shall apply to any claim or cause whatsoever whether such claim or cause arises\
    \ in contract, tort or otherwise.\n\nTo my boys, Stephen and Matthew, from a very\
    \ proud Dad.\n\n# About the Author\n\nSimon Monk has a bachelor’s degree in cybernetics\
    \ and computer science and a doctorate in software engineering. He has been an\
    \ active electronics hobbyist since his school days and is an occasional author\
    \ in hobby electronics magazines. He is also author of 30 Arduino Projects for\
    \ the Evil Genius and 15 Dangerously Mad Projects for the Evil Genius.\n\n# CONTENTS\n\
    \n- Acknowledgments\n- Introduction\n- 1 This Is Microcontrollers\n  - Development\
    \ Boards\n    - A Tour of an Arduino Board\n    - Power Supply\n    - Power Connections\n\
    \    - Analog Inputs\n    - Digital Connections\n    - Microcontroller\n    -\
    \ Other Components\n  - The Origins of Arduino\n  - The Arduino Family\n    -\
    \ Uno, Duemilanove, and Diecimila\n    - Mega\n    - Nano\n    - Bluetooth\n \
    \   - Lilypad\n    - Other “Official” Boards\n- Arduino Clones and Variants\n\
    - Conclusion\n- 2 Getting Started\n  - Powering Up\n  - Installing the Software\n\
    \  - Uploading Your First Sketch\n  - The Arduino Application\n  - Conclusion\n\
    - 3 C Language Basics Programming\n- What Is a Programming Language?\n- Blink—Again!\n\
    - Variables\n- Experiments in C\n- Numeric Variables and Arithmetic\n- Commands\n\
    - if\n- for\n- while\n- The #define Directive\n- Conclusion\n- 4 Functions\n-\
    \ What Is a Function?\n- Parameters\n- Global, Local, and Static Variables\n-\
    \ Return Values\n- Other Variable Types\n- floats\n- boolean\n- Other Data Types\n\
    - Coding Style\n- Indentation\n- Opening Braces\n- Whitespace\n- Comments\n- Conclusion\n\
    - 5 Arrays and Strings\n- Arrays\n- Morse Code SOS Using Arrays\n- String Arrays\n\
    - String Literals\n- String Variables\n- A Morse Code Translator\n- Data\n- Globals\
    \ and Setup\n- The loop function\n- The flashSequence Function\n- The flashDotOrDash\
    \ Function\n- Putting It All Together\n- Conclusion\n- 6 Input and Output\n- Digital\
    \ Outputs\n- Digital Inputs\n- Pull-up Resistors\n- Internal Pull-up Resistors\n\
    - Debouncing\n- Analog Outputs\n- Analog Input\n- Conclusion\n- 7 The Standard\
    \ Arduino Library\n- Random Numbers\n- Math Functions\n- Bit Manipulation\n- Advanced\
    \ I/O\n- Generating Tones\n- Feeding Shift Registers\n- Interrupts\n- Conclusion\n\
    - 8 Data Storage\n- Constants\n- The PROGMEM Directive\n- EEPROM\n- Storing an\
    \ int in EEPROM\n- Storing a float in EEPROM (Unions)\n- Storing a String in EEPROM\n\
    - Clearing the Contents of EEPROM\n- Compression\n- Range Compression\n- Conclusion\n\
    - 9 LCD Displays\n- A USB Message Board\n- Using the Display\n- Other LCD Library\
    \ Functions\n- Conclusion\n- 10 Arduino Ethernet Programming\n- Ethernet Shields\n\
    - Communicating with Web Servers\n- HTTP\n- HTML\n- Arduino as a Web Server\n\
    - Setting Arduino Pins over the Network\n- Conclusion\n- 11 C++ and Libraries\n\
    - Object Orientation\n- Classes and Methods\n- Built-in Library Example\n- Writing\
    \ Libraries\n- The Header File\n- The Implementation File\n- Completing Your Library\n\
    - Conclusion\n- Index\n\n# ACKNOWLEDGMENTS\n\nI thank Linda for giving me the\
    \ time, space, and support to write this book and for putting up with the various\
    \ messes my projects create around the house.\n\nI also thank Stephen and Matthew\
    \ Monk for taking an interest in what their Dad is up to and their general assistance\
    \ with project work.\n\nFinally, I would like to thank Roger Stewart, Sapna Rastogi,\
    \ and everyone involved in the production of this book. It’s a pleasure to work\
    \ with such a great team.\n\n# INTRODUCTION\n\nArduino interface boards provide\
    \ a low-cost, easy-to-use technology to create microcontroller-based projects.\
    \ With a little electronics, you can make your Arduino do all of sorts, from controlling\
    \ lights in an art installation to managing power on a solar energy system.\n\n\
    There are many project-based books that show you how to connect things to your\
    \ Arduino, including 30 Arduino Projects for the Evil Genius by this author. However,\
    \ the focus of this book is on programming the Arduino.\n\nThis book will explain\
    \ how to make programming the Arduino simple and enjoyable, avoiding the difficulties\
    \ of unoperative code that so afflict a project. You will be taken through the\
    \ process of programming the Arduino step by step, starting with the basics of\
    \ the C language that Arduinos use.\n\n# So, What Is Arduino?\n\nArduino is a\
    \ small microcontroller board with a universal serial bus (USB) plug to connect\
    \ to your computer and a number of connection sockets that can be wired to external\
    \ electronics such as motors, relays, light sensors, laser diodes, loudspeakers,\
    \ microphones, and more. They can either be powered through the USB connection\
    \ from the computer, or from a 9V battery, or from a power supply. They can be\
    \ controlled from the computer or programmed by the computer and then disconnected\
    \ and allowed to work independently.\n\nThe board design is open. This means that\
    \ anyone is allowed to make Arduino-compatible boards. This competition has lead\
    \ to low costs for the boards.\n\nThe basics are supplemented by accessory shield\
    \ boards that can be plugged on top of the Arduino board. In this book, we will\
    \ use two shields—an LCD shield and an Ethernet shield—that will allow us to turn\
    \ your Arduino into a tiny web server.\n\nThe software for programming your Arduino\
    \ is easy to use and also freely available for Windows, Mac, and LINUX computers.\n\
    \n# What Will I Need?\n\nThis book is intended for beginners, but it is also intended\
    \ to be useful to those who have used Arduino for a while and want to learn more\
    \ about programming the Arduino or gain a better understanding of the fundamentals.\n\
    \nYou do not need to have any programming experience or a technical background,\
    \ and the book's exercises do not require any soldering. All you need is the desire\
    \ to make something.\n"
