    ![](img/6426909fcee15359dcfa665c8698110f_27_0.png)


    Figure 1-6 Arduino Nano


    The downside of the Nano is that because it is so much smaller than an Uno, it
    cannot accept Uno-sized shields.


    # Bluetooth


    The Arduino Bluetooth (Figure 1-7) is an interesting device as it includes Bluetooth
    hardware in place of the USB connector. This allows the device to even be programmed
    wirelessly.


    The Arduino Bluetooth is not a cheap board, and it is often cheaper to attach
    a third-party Bluetooth module to a regular Arduino Uno.


    # Lilypad


    The Lilypad (Figure 1-8) is a tiny, thin Arduino board that can be stitched into
    clothing for applications that have become known wearable computing.


    The Lilypad does not have a USB connection, and you must use a separate adaptor
    to program it. It has an exceptionally beautiful design.


    ![](img/6426909fcee15359dcfa665c8698110f_27_1.png)'
