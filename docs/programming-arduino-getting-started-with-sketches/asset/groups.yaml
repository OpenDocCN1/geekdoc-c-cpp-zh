- md: "\n(eight bits) of memory to represent a dash or a dot, which could be represented\
    \ in a bit. However, you can easily justify this approach by saying that the total\
    \ number of bytes is still only about 90 and we have 2K to play with. Equally\
    \ importantly, it makes the code easy to understand.\n\nNumbers use the same approach:\n\
    \n```c\nchar* numbers[] = {\n  \"-\", \"-\", \"-\\\n```\n\n# Globals and Setup\n\
    \nYou need to define a couple of global variables: one for the delay period for\
    \ a dot, and one to define which the pin is attached to:\n\n```c\nint dotDelay\
    \ = 200;\nint ledPin = 13;\n```\n\nThe setup function is pretty simple; you just\
    \ need to set the ledPin as an output and set up the serial port:\n\n```c\nvoid\
    \ setup() {\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\n```\n\n# The\
    \ loop function\n\nYou are now going to start on the real processing work in the\
    \ loop function. The algorithm for this function is as follows:\n\n- If there\
    \ is a character to read from USB:\n- If it's a letter, flash it using the letters\
    \ array\n- If it's a number, flash it using the numbers array\n- If it's a space,\
    \ flash four times the dot delay\n\nThat's all. You should not think too far ahead.\
    \ This algorithm represents what you want to do, or what your intention is, and\
    \ this style of programming is called programming by intention.\n\nIf you write\
    \ this algorithm in C, it will look like this:\n\n```c\nvoid loop ()\n{\n  char\
    \ ch;\n  if (Serial.available() > 0) {\n    ch = Serial.read();\n    if (ch >=\
    \ 'a' && ch <= 'z') {\n      flashSequence(letters[ch - 'a']);\n    }\n    else\
    \ if (ch >= 'A' && ch <= 'Z') {\n      flashSequence(letters[ch - 'A']);\n   \
    \ }\n    else if (ch >= '0' && ch <= '9') {\n      flashSequence(numbers[ch -\
    \ '0']);\n    }\n    else if (ch == ' ') {\n      delay(dotDelay * 4); // gap\
    \ between words\n    }\n  }\n}\n```\n\nThere are a few things here that need explaining.\
    \ First, there is Serial.available(). To understand this, you first need to know\
    \ a little about how Arduino communicates with your computer over USB. Figure\
    \ 5-4 summarizes this process.\n\nIn the situation where the computer is sending\
    \ data from the Serial Monitor to the Arduino board, then the USB is converted\
    \ from the USB signal levels and protocol to something that the microcontroller\
    \ on the Arduino board can use. This conversion happens in a special-purpose chip\
    \ on the Arduino board. The data is received by a part of the microcontroller\
    \ called the Universal Asynchronous Receiver/Transmitter (UART). The UART places\
    \ the data it receives into a buffer. The buffer is a special area of memory (128\
    \ bytes) that can hold data that is removed as soon as it is read.\n\n![](img/6426909fcee15359dcfa665c8698110f_85_0.png)\n\
    \n# Figure 5-4 Serial communication with an Arduino\n\nThis communication happens\
    \ regardless of what your sketch is doing. So, even though you may be merrily\
    \ flashing LEDs, data will still arrive in the buffer and sit there until you\
    \ are ready to read it. You can think of the buffer as a bit like an e-mail inbox.\n\
    \nThe way that you check to see whether you \"have mail\" is to use the function\
    \ Serial.available(). This function returns the number of bytes in the buffer\
    \ that are waiting for you. If there are no messages waiting to read, the function\
    \ returns 0. This is why the if statement checks to see that there are more than\
    \ zero bytes available to read, and if they are, then the first statement that\
    \ reads the next available char, using the function Serial.read()). This function\
    \ gets assigned to the local variable ch.\n\nNext is another to decide what kind\
    \ of thing it is that you want to flash:\n\n```c\nif (ch >= 'a' && ch <= 'z')\
    \ {\n  flashSequence(ch - 'a');\n```\n\nAt first, this might seem a bit strange.\
    \ You are using <= and >= to compare characters. You can do that because each\
    \ character is actually represented by a number (its ASCII code). So, if the code\
    \ for the character is somewhere between a and z (97 and 122), you know that the\
    \ character that has come from the computer is a lowercase letter. You can then\
    \ call a function that you have not yet called flashSequence, which will pass\
    \ you a string of dots and dashes; for example, to flash a, you would pass it\
    \ - as its argument.\n\nYou are devolving responsibility to this function for\
    \ doing the flashing. You are not trying to do it inside the loop. This lets us\
    \ keep the code easy to read.\n\nHere is the C that determines the string of dashes\
    \ and dots that you need to send to the flashSequence function:\n\n```c\nletters[ch\
    \ - 'a']\n```\n\nOnce again, this looks a little strange. The function appears\
    \ to be subtracting one character from another. This is actually a perfectly reasonable\
    \ thing to do, because the function is actually subtracting the ASCII values.\n\
    \nRemember that you are storing the codes for the letters in an array. So the\
    \ first element of the array contains a string of dashes and dots for the letter\
    \ A, the second element includes the dots and dashes for B, and so on. So you\
    \ need to find the right position in the array for the letter that you have just\
    \ fetched from the buffer. The position for any lowercase letter will be the character\
    \ code for the letter minus the character code for a. So, for example, a - a is\
    \ actually 97 - 97 = 0. Similarly, c - a is actually 99 - 97 = 2. So, in the following\
    \ statement, if ch is the letter, then the bit inside the square brackets would\
    \ evaluate to 2, and you would get 2 from the array, which is -:-\n\nWhat this\
    \ section has described is concerned with lowercase letters. You also have to\
    \ deal with uppercase letters and numbers. These are both handled in a similar\
    \ manner.\n\n# The flashSequence Function\n\nWe have assumed a function called\
    \ flashSequence and made use of it, but now you need to write it. We have planned\
    \ it to take a string containing a series of dashes and dots and to make the necessary\
    \ flashes with the correct timings.\n\nThinking about the algorithm for this,\
    \ you can break it into the following steps:\n\n- For each element of the string\
    \ of dashes and dots (such as -:-)\n- flash dot or dash Using the concept of programming\
    \ by intention, let's keep the function as simple as that.\n\nThe Morse codes\
    \ are not the same length for all letters, so you need to loop around the string\
    \ until you encounter the end marker, \\. You also need a counter variable i that\
    \ starts at 0 and is incremented as the processing looks at each dot and dash:\n\
    \n```c\nvoid flashSequence(char* sequence)\n{\n  int i = 0;\n  while (sequence[i]\
    \ != '\\0')\n  {\n    flashDotOrDash(sequence[i]);\n    i++;\n  }\n  delay(dotDelay\
    \ * 3); // gap between letters\n```\n\nAgain, you delegate the actual job of flashing\
    \ an individual dot or dash to a new method called flashDotOrDash, which actually\
    \ turns the LED on and off. Finally, when the program has flashed the dots and\
    \ dashes, it needs to pause for three dots worth of delay. Note the helpful use\
    \ of a comment.\n\n# The flashDotOrDash Function\n\nThe last function in your\
    \ chain of functions is the one that actually does the work of turning the LED\
    \ on and off. As its argument, the function has a single character that is either\
    \ a (.) or a dash (-).\n\nAll the functions need to do is turn the LED on and\
    \ delay for the duration of a dot if it's a dot and three times the duration of\
    \ a dot if it's a dash, turn the LED off. Finally it needs to delay for the period\
    \ of a dot, to give the gap between flashes.\n\n```c\nvoid flashDotOrDash(char\
    \ dotOrDash)\n{\n  digitalWrite(ledPin, HIGH);\n  if (dotOrDash == '.')\n  {\n\
    \    delay(dotDelay);\n  }\n  else // must be a -\n  {\n    delay(dotDelay * 3);\n\
    \  }\n  digitalWrite(ledPin, LOW);\n  delay(dotDelay); // gap between flashes\n\
    }\n```\n"
  mdcn: "\n使用（8 字节）的内存来表示一个横线或一个点，这可以用一个位来表示。然而，你可以很容易地为这种方法找到理由，因为总字节数仍然只有大约 90 字节，而我们有\
    \ 2K 空间可以发挥。同样重要的是，这让代码变得易于理解。\n\n数字使用相同的方法：\n\n```c\nchar* numbers[] = {\n  \"\
    -\", \"-\", \"-\\\n```\n\n# 全局变量与设置\n\n你需要定义几个全局变量：一个用于点的延迟时间，另一个用于定义 LED 灯连接在哪个引脚上：\n\
    \n```c\nint dotDelay = 200;\nint ledPin = 13;\n```\n\n`setup` 函数非常简单；你只需要将 `ledPin`\
    \ 设置为输出，并设置串口：\n\n```c\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n\
    }\n```\n\n# loop 函数\n\n你现在将要在 `loop` 函数中开始实际的处理工作了。该函数的算法如下：\n\n- 如果从 USB 读取到一个字符：\n\
    - 如果是字母，使用 `letters` 数组进行闪烁\n- 如果是数字，使用 `numbers` 数组进行闪烁\n- 如果是空格，则闪烁四倍的 `dotDelay`\n\
    \n就这些了。你不应该考虑得太远。这个算法代表了你想做的事情，或者说你的意图，这种编程风格被称为“意图编程”。\n\n如果你用 C 语言编写这个算法，它应该是这样的：\n\
    \n```c\nvoid loop ()\n{\n  char ch;\n  if (Serial.available() > 0) {\n    ch =\
    \ Serial.read();\n    if (ch >= 'a' && ch <= 'z') {\n      flashSequence(letters[ch\
    \ - 'a']);\n    }\n    else if (ch >= 'A' && ch <= 'Z') {\n      flashSequence(letters[ch\
    \ - 'A']);\n    }\n    else if (ch >= '0' && ch <= '9') {\n      flashSequence(numbers[ch\
    \ - '0']);\n    }\n    else if (ch == ' ') {\n      delay(dotDelay * 4); // 单词间的间隔\n\
    \    }\n  }\n}\n```\n\n这里有几点需要解释。首先，是 `Serial.available()`。要理解这一点，你首先需要了解 Arduino\
    \ 如何通过 USB 与你的计算机通信。图 5-4 总结了这一过程。\n\n在计算机从串口监视器向 Arduino 板板发送数据的情况下，USB 会从 USB\
    \ 信号电平和协议转换为 Arduino 板板上的微控制器可以使用的某种格式。这种转换发生在 Arduino 板板上的一个专用芯片上。数据由微控制器中一个称为通用异步收发器（UART）的部分接收。UART\
    \ 将接收到的数据放入一个缓冲区中。缓冲区是一个特殊的内存区域（128 字节），可以存储数据，并在读取后立即移除。\n\n![](img/6426909fcee15359dcfa665c8698110f_85_0.png)\n\
    \n# 图 5-4 与 Arduino 的串口通信\n\n这种通信无论你的程序（sketch）在做什么都会发生。因此，即使你可能正在愉快地闪烁 LED，数据仍然会到达缓冲区并留在那里，直到你准备好读取它。你可以将缓冲区看作是类似于电子邮件邮箱箱。\n\
    \n你检查是否有“邮件”的方法是使用函数 `Serial.available()`。该函数返回缓冲区中等待你读取的字节数。如果没有等待读取的消息，该函数返回\
    \ 0。这就是为什么 `if` 语句检查是否有大于 0 的字节可读，如果是，则执行第一条语句。\n"
