    ![](img/6426909fcee15359dcfa665c8698110f_27_0.png)


    图 1-6 Arduino Nano


    Nano 的缺点是，因为它比 Uno 小得多，因此它无法接受 Uno 尺寸的扩展板（shields）。


    # 蓝牙


    Arduino Bluetooth（图 1-7）是一个有趣的设备，因为它用蓝牙硬件取代了 USB 接口器。这使得该设备甚至可以进行无线编程。


    Arduino Bluetooth 并不是一个廉价的板子，在普通的 Arduino Uno 上连接一个第三方蓝牙模块通常更便宜一些。


    # Lilypad


    Lilypad（图 1-8）是一种微小、纤薄的 Arduino 板板，它可以缝合在衣物中，用于众为人知的可穿戴计算应用。


    Lilypad 没有 USB 连接，你必须使用单独的适配器对其进行编程。它的设计非常精美。


    ![](img/6426909fcee15359dcfa665c8698110f_27_1.png)


    # 图 1-7 Arduino Bluetooth


    ![](img/6426909fcee15359dcfa665c8698110f_28_0.png)


    # 图 1-8 Arduino Lilypad


    # 其他“官方”板板


    之前描述的 Arduino 板板是最实用且流行的。然而，Arduino 板板的范围在不断变化，因此为了获取 Arduino 家族完整且最新的视图，请访问 Arduino
    官方网站列表：http://www.arduino.cc/en/Main/Hardware。


    # Arduino 克隆版与变体


    非官方板板分为两类。有些只是采用了 Arduino 的标准开源硬件设计并制作了更廉价的版本。你可以搜索以下名称来寻找此类的板板：


    - Roboduino

    - Freedino

    - Seeeduino（是的，有三个 e）


    更有趣的是，某些兼容 Arduino 设计旨在以某种方式扩展或改进 Arduino。新的变体不断出现，数量多到无法逐一列举。然而，以下是一些比较有趣且流行的变体：


    - Chipkit，一种基于 PIC 器的高速变体，但与 Arduino 具有良好的兼容性

    - Femtodino，一种非常小的 Arduino

    - Ruggedduino，带有内置 I/O 保护的 Arduino 板板

    - Teensy，一种低成本的纳米型设备


    # 结论


    现在你已经稍微探索了 Arduino 硬件，是时候设置你的 Arduino 软件了。


    # 2 入门


    在介绍了 Arduino 并稍微了解了我们正在编写的内容后，现在是学习如何在我们的计算机上安装所需的软件，并开始编写代码的时机了。


    # 通电


    当你购买一块 Arduino 板板时，它通常预装了一个示例 Blink（闪烁）程序，该程序会让微小的内置发光二极管（LED）闪烁。


    标记为 L 的 LED 连接到板板上的一个数字输出插座上。它连接到数字引脚 13。这限制了引脚 13 只能作为输出使用。然而，LED 使用的电流很小，所以你仍然可以将其他东西连接到连接器。


    要让你的 Arduino 运行起来，只需要提供电源。最简单的方法是将其插入电脑的 USB 端口。你需要一根 type-A 转 type-B 的 USB 线。这种线缆与通常用于连接电脑和打印机的线缆相同。


    如果一切运行正常，LED 应该会闪烁。新的 Arduino 板板已经安装了此 Blink 图文件（sketch），以便你验证板板工作正常。


    # 安装软件


    为了能够将新的图文件安装到你的 Arduino 板板，你需要的不仅仅是通过 USB 为其供电。你需要安装 Arduino 软件（图 2-1）。


    在 Windows、Linux 和 Mac 计算机上安装此软件的完整详细说明可以在 Arduino 网站 (www.arduino.cc) 上找到。


    一旦成功安装了 Arduino 软件以及取决于你的平台的 USB 驱动程序，你现在应该可以将程序上传到 Arduino 板板了。


    ![](img/6426909fcee15359dcfa665c8698110f_32_0.png)


    图 2-1 Arduino 应用


    # 上传你的第一个图文件


    闪烁的 LED 相当于 Arduino 中其他语言中使用的“Hello World”程序，后者通常是学习新语言时传统的第一个运行程序。让我们通过在你的 Arduino
    板板上安装此程序并对其进行修改来测试环境。


    当你从电脑上启动 Arduino 应用时，它会打开一个空白的图文件。幸运的是，该应用带有一系列实用的示例。因此，从 File（文件）菜单中打开如图 2-2
    所示的 Blink 示例。


    ![](img/6426909fcee15359dcfa665c8698110f_33_0.png)


    你现在需要将图文件传输或上传到你的 Arduino 板板。你应该使用 USB 线将 Arduino 板板连接到电脑。你应该能看到 Arduino 上的绿色“On”LED
    灯亮。Arduino 板板可能已经在闪，因为板板通常出厂时已经安装了 Blink 图文件。但让我们再次安装它，然后修改它。


    当你插入板板时，如果你使用的是 Mac，可能会收到消息：“检测到新的网络接口。”只需点击取消；你的 Mac 困惑了，而 Uno 只是一个 USB 调制解调器。


    在上传图文件之前，你必须告诉 Arduino 应用你正在使用的板板以及你连接到了哪个串口。图 2-3 和图 2-4 显示了如何从 Tools（工具）菜单进行操作。


    # 图 2-3 选择板板类型


    ![](img/6426909fcee15359dcfa665c8698110f_34_0.png)


    # 图 2-4 选择串口（在 Windows 中）


    在 Windows 机器上，串口一始终是 COM3。在 Mac 和 Linux 机器上，你会看到一个长长的串口设备列表（见图 2-5）。该设备通常


    ![](img/6426909fcee15359dcfa665c8698110f_34_1.png)


    是列表中的顶部选项，名称类似于 /dev/tty.usbmododem621。


    现在点击工具栏上的上传（Upload）图标。这在图 2-6 中高亮显示。


    点击按钮后，会有短暂的暂停，用于编译图文件，然后开始传输。如果运行正常，Arduino 窗口底部会有 LED 频繁闪烁，图文件将开始传输，之后你会在 Arduino
    窗口底部看到“Done Uploading”（上传完成）的消息，以及一条类似于图文件大小的消息：1018 bytes（最大 14336 bytes）。


    ![](img/6426909fcee15359dcfa665c8698110f_35_0.png)


    # 图 2-5 选择串口（在 Mac 上）


    一旦上传完成，板板会自动开始运行图文件，你将看到 LED 开始闪烁。


    如果这不起作用，请检查你的串口和板板类型设置。现在让我们修改图文件让 LED 闪烁得更快。要做到这一点，修改图文件中延迟 1000 毫秒的两个地方，将延迟改为
    500 毫秒。图 2-7 显示了高亮更改后的图文件。


    # 2-6 上传图文件


    再次点击上传按钮。等图文件上传完成后，你应该看到你的 LED 闪烁速度比之前快一倍。恭喜你，你现在准备好开始编程了。不过首先，让我们对 Arduino 应用进行一个小之旅。


    ![](img/6426909fcee15359dcfa665c8698110f_36_0.png)


    ![](img/6426909fcee15359dcfa665c8698110f_36_1.png)


    # Arduino 应用


    Arduino 中的图文件（Sketches）就像文字处理器中的文档。你可以打开它们并将部分从一个复制到另一个。因此，请查看 File 菜单中的 Open（打开）、Save（保存）和
    Save As（另存为）选项。你通常不会使用 Open，因为 Arduino 应用有一个“图库”（Sketchbook）的概念，你所有的图文件都存储在那里。你可以从
    File 菜单访问 Sketchbook。由于你刚刚第一次安装 Arduino 应用，在你创建一些图文件之前，你的 Sketchbook 将是空的。


    正如你所看到的，Arduino 应用带有一系列非常有用的示例图文件。在修改 Blink 示例图文件后，如果你尝试保存，你会收到消息：“某些文件被标记为只读，因此需要在其他位置保存此图文件。”


    现在试一下。接受默认位置，但将文件名更改为 MyBlink，如图 2-8 所示。


    现在如果你进入 File 菜单并点击 Sketches，你看到 MyBlink 是文件之一。如果你查看电脑的文件系统，在 PC 上，你会发现该图文件已写入
    My Documents\Arduino，而在 Mac 或 Linux 上，它们在 Documents/Arduino。


    本书中使用的所有图文件都可以以压缩包格式（Programming_Arduino.zip）从 [www.arduinoobook.com] 下载。我建议现在下载此文件并将其解压到包含图文件的
    Arduino 文件夹中。换句话说，当你解压文件夹后，你的 Arduino 文件夹中有两个文件夹：一个是新保存的 MyBlink，另一个是 Programming
    Arduino（见[图 2-9]）。Programming Arduino 文件夹将包含所有图文件，并按章节编号，例如图 03-01 是[第 3 章]的第一个图文件。


    '
