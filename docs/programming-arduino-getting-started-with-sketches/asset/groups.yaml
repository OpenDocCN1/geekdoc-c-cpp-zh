    # 9

    LCD Displays


    In this chapter, you look at how to write software to control LCD displays. Figure
    9-1 shows the kind of LCD display used.


    This is a book about software, not hardware, but in this chapter, we will have
    to explain a little about how the electronics of these displays work so that you
    understand how to drive them.


    The LCD module that we use is a prebuilt Arduino shield that can just be plugged
    on top of an Arduino board. In addition to its display, it also has some buttons.
    There are a number of different shields, but nearly all of them use the same LCD
    controller chip (the HD44780)


    The shield comes assembled, so no soldering is required; you just plug it on top
    of your Arduino board (see Figure 9-2).


    The LCD shield uses seven of the Arduino pins to control the LCD display and one
    analog pin for the buttons. So we cannot use these Arduino pins for any other
    purpose.


    ![](img/6426909fcee15359dcfa665c8698110f_129_0.png)


    **Figure 9-1** An Alphanumeric LCD shield'
- md: "\n![](img/6426909fcee15359dcfa665c8698110f_130_0.png)\n\n## A USB Message Board\n\
    \nFor a simple example of a simple use of the display, we are going to make a\
    \ USB message board. This will display messages sent from the Serial Monitor.\n\
    \nThe Arduino IDE comes with an LCD library. This greatly simplifies the process\
    \ of using an LCD display. The library gives you useful functions that you can\
    \ call:\n\n- **clear** clears the display of any text.\n- **setCursor** sets the\
    \ position in row and column where the next thing that you print will appear.\n\
    - **print** writes a string at that position.\n\nThis example is listed in sketch\
    \ 9-01:\n\n```\n// sketch 9-01 USB Message Board\n\n#include <LiquidCrystal.h>\n\
    \n// lcd (RS, E, D4, D5, D6, D7)\nLiquidCrystal lcd1(8, 9, 4, 5, 6, 7);\nint numRows\
    \ = 2;\nint numCols = 16;\n\nvoid setup() {\n  Serial.begin(9600);\n  lcd.begin(numRows,\
    \ numCols);\n  lcd.clear();\n  lcd.setCursor(0,0);\n  lcd.print(\"Arduino\");\n\
    \  lcd.setCursor(0,1);\n  lcd.print(\"Rules\");\n}\n\nvoid loop() {\n  if (Serial.available()\
    \ > 0) {\n    char ch = Serial.read();\n    if (ch == '#') {\n      lcd.clear();\n\
    \    } else if (ch == '/') {\n      // new line\n      lcd.setCursor(0, 1);\n\
    \    } else {\n      lcd.write(ch);\n    }\n  }\n}\n```\n\nAs with all Arduino\
    \ libraries, you have to start by including the library to make the compiler of\
    \ it.\nThe next line defines which Arduino pins are used by the shield and for\
    \ what purpose. If you are using a different shield, then you may well find that\
    \ the pin allocations are different, so check in the documentation for the shield.\n\
    In this case, the six pins used to control the display are D4, D5, D6, D7, D8,\
    \ and D9.\n\nThe purpose of each of these pins is described in Table 9-1.\n\n\
    | Parameter to LCD | Arduino Pin | Purpose |\n| :--- | :--- | :--- |\n| RS | 8\
    \ | Register Select; this is set to 1 or 0 depending on whether the Arduino is\
    \ sending data characters or an instruction. An instruction might make the cursor\
    \ flash, for example. |\n| E | 9 | Enable; this gets toggled to tell the LCD controller\
    \ chip that the data on the four pins is ready to read |\n| Data 4 | 4 | These\
    \ four pins are used to transfer data. The LCD controller chip used by the shield\
    \ can use eight-bit or four-bit data. This shield uses four bits, in which case\
    \ the bits 4–7 are used rather than 0–7. |\n| Data 5 | 5 | |\n| Data 6 | 6 | |\n\
    | Data 7 | 7 | |\n\n**Table 9-1 LCD shield pin assignments**\n\nThe setup function\
    \ is straightforward. You start serial communications so that the Serial Monitor\
    \ can send commands and initialize the LCD library with the dimensions of the\
    \ display being. You also display the message \"Arduino Rules\" on two lines by\
    \ setting the cursor to top-left, printing \"Arduino,\" then moving the cursor\
    \ to the start of the second row and printing \"Rules.\"\n\nMost of the actions\
    \ take place in the loop function, which checks for any incoming characters from\
    \ the Serial Monitor. The sketch deals with characters one at a time.\n\nApart\
    \ from ordinary characters that the sketch will simply display, there are also\
    \ a couple of special characters. If the character is a #, the sketch clears the\
    \ whole display, and if the character is a /, the sketch moves to the second line.\
    \ Otherwise, the sketch simply displays the character at the current cursor position\
    \ using write. The function write is like print, but it prints only a single character\
    \ rather than a string of characters.\n\n## Using the Display\n\nTry out sketch\
    \ 9-01 by uploading it to the board and then attaching the shield. Note that you\
    \ should always unplug the Arduino board so that it is off before you plug in\
    \ a shield.\n\nOpen up the Serial Monitor and try typing in the text shown in\
    \ Figure 9-3.\n\n![](img/6426909fcee15359dcfa665c8698110f_133_0.png)\n\n## Other\
    \ LCD Library Functions\n\nIn addition to the functions that you have used in\
    \ this example, there are a number of other functions that you can use:\n\n- **home**\
    \ is the same as **setCursor(0,0)**: it moves the cursor to top-left.\n- **cursor**\
    \ displays a cursor.\n- **noCursor** specifies not to display a cursor.\n- **blink**\
    \ makes the cursor blink..\n- **noBlink** turns off the display without removing\
    \ the content.\n- **display** turns the display back on after **noDisplay**.\n\
    - **scrollDisplayLeft** moves all the text on the display one character position\
    \ to the left.\n- **scrollDisplayRight** moves all the text on the display one\
    \ character position to the right.\n- **autoscroll** activates a mode, in which\
    \ new characters are added at the cursor, the existing text is pushed in the direction\
    \ determined by the functions **leftToRight** and **rightToLeft**.\n- **noAutoscroll**\
    \ turns **autoscroll** off.\n\n## Conclusion\n\nYou can see that programming is\
    \ not hard, particularly when there is a library that can do a lot of the work.\
    \ In the next chapter, you will use an Ethernet shield that will allow you to\
    \ connect to the Internet.\n\n## Ethernet Programming\n\nIn this chapter, you\
    \ will use an Ethernet shield to enable your Arduino to work over the network\
    \ (see Figure 10-1).\n\n![](img/6426909fcee15359dcfa665c8698110f_136_0.png)\n\
    **Figure 10-1 Arduino with Ethernet**\n\n## Ethernet Shields\n\nWhen buying an\
    \ Ethernet shield, you need to take a little care, as you need to use an “official”\
    \ shield based on the Wiz chipset and not one of the cheaper but more difficult\
    \ to use boards based on the ENC28J60 controller. The Ethernet shields are quite\
    \ hungry, so you will also need a power supply.\n\n## Communic with Web Servers\n\
    \nBefore looking at how the Arduino deals with communication between a browser\
    \ and the web server, you need some understanding of the HyperText Transfer Protocol\
    \ (HTTP) and HyperText Markup Language (HTML).\n\n## HTTP\n\nThe HyperText Transfer\
    \ Protocol is the method by which web browsers communicate with a web server.\
    \ When you go to a page using a browser, the browser sends a request to the server\
    \ saying what it wants. What the browser asks for may be simply the contents of\
    \ a page in the Arduino sketch. The web server is always listening for such requests,\
    \ and when it receives one, it processes it by sending back HTML that you have\
    \ specified.\n\n## HTML\n\nThe HyperText Markup Language is a way of adding formatting\
    \ to ordinary text so that it looks good when the browser displays it. For example,\
    \ the following code is HTML that displays on a browser page as shown in Figure\
    \ 10-2:\n\n```html\n<html>\n<body>\n<h1>Programming Arduino</h1>\n<p>A book about\
    \ programming</p>\n</body>\n</html>\n```\n\nThe HTML contains tags. Tags have\
    \ a start and an end and usually contain other tags. The start of a tag has `<`\
    \ and then the tag name, and then `>` for example, `<html>`. The end of a tag\
    \ is similar except it has `/`. In the preceding example, the outermost tag is\
    \ `<html>` that contains a tag called `<body>`. All web pages should start with\
    \ such tags, and you can see the corresponding ends for those tags at the end\
    \ of the file. Note that you have put the end tags in the right order, so the\
    \ `<body>` tag must be closed before `<html>`.\n\nNow we get to the interesting\
    \ bit in the middle, the `<h1>` and `<p>` tags. These are the parts of the example\
    \ that are actually displayed. The `<h1>` tag indicates a level 1 header. This\
    \ has the effect of displaying the text that it contains in a large bold font.\
    \ The `<p>` tag is a paragraph tag, and so all the text contained within it is\
    \ displayed as a paragraph.\n\nThis really scratches the surface of HTML. Many\
    \ books and Internet resources are available for learning about HTML.\n\n## Programming\
    \ Arduino\n\n![](img/6426909fcee15359dcfa665c8698110f_138_0.png)\n\n## Arduino\
    \ as a Web Server\n\nThe first example sketch simply uses the Arduino and Ethernet\
    \ shield to make a small web server. It's definitely not a Google server farm,\
