- md: "\nturning on and off. If you are feeling more adventurous, you could attach\
    \ LEDs or relays to the pins to control things.\n\n## Conclusion\n\nHaving used\
    \ shields and associated libraries in the last two chapters, it is now time to\
    \ investigate the features that enable libraries to be written and learn how to\
    \ write libraries of your own.\n\n# 11\nC++ and Libraries\n\nArduinos are simple\
