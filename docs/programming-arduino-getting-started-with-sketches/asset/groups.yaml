    \ = ! ledValue;\n    digitalWrite(ledPin, ledValue);\n  }\n}\n```\n\n你可能会发现，LED\
    \ 有时会切换，但其他时候它似乎没有切换。这就是抖动在起作用！\n\n解决此问题的简单方法是在检测到第一次按下按钮后添加一个延迟，如程序 6-06 所示：\n\
    \n```cpp\n// sketch 6-06\nint inputPin = 5;\nint ledPin = 13;\nint ledValue =\
    \ LOW;\n\nvoid setup() {\n  pinMode(inputPin, INPUT);\n  digitalWrite(inputPin,\
    \ HIGH);\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  if (digitalRead(inputPin)\
    \ == LOW) {\n    ledValue = ! ledValue;\n    digitalWrite(ledPin, ledValue);\n\
