- md: "\n# Programming Arduino™\nGetting Started with Sketches\n\n![](img/6426909fcee15359dcfa665c8698110f_0_0.png)\n\
    \nSimon Monk\n\n# Programming Arduino™\n\n## Getting Started with Sketches\n\n\
    **Simon Monk**\n\n![](img/6426909fcee15359dcfa665c8698110f_2_0.png)\n\nNew York\
    \ Chicago San Francisco Lisbon\nLondon Madrid Mexico City Milan New Delhi\nSan\
    \ Juan Seoul Singapore Sydney Toronto\n\n# The McGraw-Hill Companies\n\nCopyright\
