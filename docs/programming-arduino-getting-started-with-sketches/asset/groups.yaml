    The Arduino has tried to compile the words "Ciao Bella," and despite its Italian
    heritage, it has no idea what you are talking about. This text is not C. So the
    result is that at the bottom of the screen we have that cryptic message "error:
    Ciao does not name a type." What this actually means is that there is a lot wrong
