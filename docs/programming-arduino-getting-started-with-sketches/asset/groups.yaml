    \n给我的儿子 Stephen 和 Matthew，来自非常自豪的爸爸。\n\n# 关于作者\n\nSimon Monk 拥有控制论与计算机科学学士学位以及软件工程博士学位。从学生时代起他一直是活跃的电子爱好者，偶尔在爱好者电子杂志上撰稿。他还是《30\
    \ Arduino Projects for the Evil Genius》和《15 Dangerously Mad Projects for the Evil\
    \ Genius》的作者。\n\n# 目录\n\n-   致谢\n-   引言\n-   1 这是微控制器\n  -   开发板\n    -   Arduino\
    \ 板 导览\n    -   电源\n    -   电源连接\n    -   模拟输入\n    -   数字连接\n    -   微控制器\n \
    \   -   其他组件\n  -   Arduino 的起源\n  -   Arduino 家族\n    -   Uno, Duemilanove 和\
    \ Diecimila\n    -   Mega\n    -   Nano\n    -   蓝牙\n    -   Lilypad\n    -  \
    \ 其他“官方”板 \n-   Arduino 的克隆版与变体\n-   结论\n-   2 入门\n  -   通电\n  -   安装软件\n  - \
    \  上传你的第一个 Sketch（脚本）\n  -   Arduino 应用\n  -   结论\n-   3 C 语言基础编程\n-   什么是编程语言？\n\
    -   闪烁——再次！\n-   变量\n-   C 语言中的实验\n-   数值型变量与算术\n-   命令\n-   if\n-   for\n-  \
    \ while\n-   #define 指令\n-   4 函数\n-   什么是函数？\n-   参数\n-   全局、局部和静态变量\n-   返回值\n\
    -   其他数据类型\n-   5 数组与字符串\n-   使用数组\n-   字面量\n-   6 输入与输出\n-   数字输出\n-   上拉电阻\n\
    -   内部上拉电阻\n-   去抖处理\n-   7 数据存储\n-   常量\n-   PROGMEM 指令\n-   存储 int\n-   存储 float\n\
    -   9 LCD 显示\n-   USB 板\n-   使用显示\n-   10 Arduino 以太网编程\n-   以太网扩展\n-   与网络通信\n\
    -   11 C++ 与对象对象\n-   类与方法\n-   内置库\n-   示例\n-   头文件\n-   实现文件\n-   完成你的库（库文件库）\n\
    -   结论\n-   索引\n\n# 致谢\n\n我感谢 Linda 给了我写这本书的时间、空间，并忍受我的项目带来的各种麻烦。\n\n我感谢 Stephen\
    \ 和 Matthew 对他们爸爸所做的事情产生兴趣。\n\n最后，我想感谢 Roger Stewart、Sapna Rastogi 以及参与本书制作的每一个人。\n\
    \n# 引言\n\nArduino 接口板提供了一种低成本、易用的技术来创建项目。通过一点点电子知识，你可以让 Arduino 完成各种事情，从控制艺术装置到管理太阳能系统。\n\
    \n板的设计是开放的。这意味着任何人都可以制作兼容 Arduino 的板。这种竞争导致了板成本的降低。\n\n基础部分可以通过插在 Arduino 板上的扩展板进行补充。在书中，我们将使用两个扩展板——一个\
    \ LCD 扩展板和一个以太网扩展板——它们允许我们将 Arduino 变成一个微型 Web 服务器。\n\n编程 Arduino 的软件易于使用，并且在\
    \ Windows、Mac 和 LINUX 上均免费提供。\n\n"
