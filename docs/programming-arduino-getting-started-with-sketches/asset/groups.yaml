    \ `setup` 和 `loop` 这两个函数，但你并不真的需要在它们中编写任何代码。然而，不添加代码会让你的 sketch（草图）看起来有些单调。\n\n\
    ## 闪烁——再次！\n\nArduino 拥有 `setup` 和 `loop` 两个函数的原因是将 Arduino 开始运行草图时只需要执行一次的事情，与必须持续发生的事情隔离开。\n\
    \n`setup` 函数只会在程序启动时运行一次。让我们为它添加一些代码，让板 自带的 LED 闪烁。将这些行添加到你的 sketch 中，使其看起来所示，然后将它们上传到你的板上：\n\
    \n```\nvoid setup()\n{\n  pinMode(13, OUTPUT);\n  digitalWrite(13, HIGH);\n}\n\
    ```\n\n```\nvoid loop()\n{}\n```\n\n`setup` 函数本身调用了两个内置函数：`pinMode` 和 `digitalWrite`。你已经了解了\
    \ `digitalWrite`，但 `pinMode` 是新的。`pinMode` 函数将特定的引脚设置为输入或输出。因此，开启 LED 实际上是一个两个阶段的过程。首先，你必须将引脚\
    \ 13 设置为输出，其次，你需要将该输出设置为高电平（5V）。\n\n当你运行这个 sketch 时，你会在你的板子上看到 LED 亮起并保持亮着。这并不有趣，所以让我们至少通过在\
    \ `loop` 中开启和关闭，而不是在 `setup` 函数中来让它闪烁。\n\n你可以将 `pinMode` 调用留在 `setup` 函数中，因为你只需要调用它一次。如果你将其移动到\
    \ `loop` 中，项目仍然可以工作，但没有必要，而且如果只需要做一次，那么只做一次是一个良好的编程习惯。修改你的 sketch 使使其如下所示：\n\n\
    ```\nvoid setup() {\n  pinMode(13, OUTPUT);\n}\n```\n\n```\nvoid loop() {\n  digitalWrite(13,\
    \ HIGH);\n  delay(500);\n  digitalWrite(13, LOW);\n}\n```\n\n运行这个 sketch 看看发生了什么。这可能不是你预期的。LED\
    \ 基本上是一直亮的。嗯，为什么会这样呢？\n\n尝试在脑海中一行一行运行 sketch：\n\n- 1. 运行 `setup` 并引脚 13 设置为输出。\n\
    - 2. 运行 `loop` 并引脚 13 设置为高电平（LED 亮）。\n- 3. 延迟半秒。\n- 4. 将引脚 13 设置为低电平（LED 灭）。\n\
    - 5. 再次运行 `loop`，回到第 2 步，并将引脚 13 设置为高电平（LED 亮）。\n\n问题出现在第 4 步和第 5 步之间。发生的情况是 LED\
    \ 被关闭了，但紧接着发生的是它又被打开了。这发生得非常快，以至于 LED 看起来是一直亮的。\n\nArduino 上的微芯片每秒可以执行 1600 万条指令。这不是\
    \ 1600 万条 C 语言命令，但仍然非常快。所以，我们的 LED 只关闭了百万分之一秒。\n\n要修复这个问题，你需要在关闭 LED 后再添加另一个 `delay`。你的代码现在应该像这样：\n\
    \n```\n// sketch 3-01\nvoid setup() {\n  pinMode(13, OUTPUT);\n}\n\nvoid loop()\
    \ {\n  digitalWrite(13, HIGH);\n  delay(500);\n  digitalWrite(13, LOW);\n  delay(500);\n\
    }\n```\n\n再次尝试，你的 LED 应该每秒欢快地闪烁一次。\n\n你可能注意了列表顶部的注释“sketch 3-01”。为了节省你的打字时间，我们在书籍网站上上传了所有带有此类注释的\
    \ sketch。你可以从 http://www.arduinonobook.com 下载它们。\n\n## 变量\n\n在这个闪烁示例中，你使用了引脚 13\
    \ 并在三个地方引用它。如果你决定使用不同的引脚，你就必须在三个地方更改代码。同样，如果你想更改闪烁频率（由 `delay` 的参数控制），你必须在多个地方将\
    \ 500 改为其他数字。\n\n变量可以被看作给数字命名。实际上，它们可以比这强大得多，但目前你将它们用于此目的。\n\n在 C 中定义变量时，你必须指定变量的类型。我们希望变量是整数，在\
    \ C 语言中称为 `int`。因此，要定义一个名为 `ledPin` 值为 13 的变量，你需要写如下代码：\n\n```\nint ledPin = 13;\n\
    ```\n\n让我们将其整合到你的闪烁 sketch 中：\n\n```\n// sketch 3-02\nint ledPin = 13;\nint delayTime\
    \ = 500;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n \
    \ digitalWrite(ledPin, HIGH);\n  delay(delayTime);\n  digitalWrite(ledPin, LOW);\n\
    \  delay(delayTime);\n}\n```\n\n## C 语言实验\n\n你需要一种测试实验的方法。串口监视器（Serial Monitor）是电脑和\
    \ Arduino 之间的通信通道。你通过点击右侧的图标访问它。\n\n![](img/642690fcee15359dcfa65c8698110f_50.png)\n\
    \n###### 在 setup 中编写 C\n\n### 串口监视器\n\n正如你所料，有一个内置函数可以在你的 sketch 中向串口监视器发送消息。它被称为\
    \ `Serial.println`，它期望一个参数，该参数包含你想发送的信息。这些信息通常是变量。\n\n## 数字变量与算术\n\n（注：此处部分为原文中重复的乱码内容，已根据逻辑整合翻译）\n\
    你最后做的事情是在你的闪烁 sketch 中添加了以下行，以稳定地增加闪烁周期：\n`delayPeriod = delayPeriod + 100;`\n\
    \n仔细观察这一行，它包含一个变量名、一个等号，以及一个所谓的表达式（`delayPeriod + 100`）。等号执行一种被称为赋值的操作。也就是说，它为变量分配一个新值，而它分配的值由等号之后、分号之前的内容决定。在这种情况下，给\
    \ `delayPeriod` 变量的新值是 `delayPeriod` 的旧值加上 100。\n\n*注：原文提供的 OCR 文本包含大量重复和乱码部分，已根据逻辑进行了重构和清理翻译。*\n"
