  - "[PAGE 46]\n\nthis function would return a value. The value returned to use from\
    \ the call would be the sin of the angle passed as its argument.\n\nRather like\
    \ a legal definition uses words to define a term, we write functions in C that\
    \ can then be called from C.\n\nAfter the special keyword void comes the name\
    \ of the function and then parentheses to contain any arguments. In this case,\
    \ there are no arguments, but we still have to include the parentheses. There\
    \ is no semicolon after the closing parenthesis because we are defining a function\
    \ rather than calling it, so we need to say what will happen when something calls\
    \ the function.\n\nThose things that are to happen when the function is called\
    \ must be placed between curly braces. Curly braces and the code between them\
    \ are known as a block of code, and this is a concept that you will meet again\
    \ later.\n\nNote that although you have to define both the functions setup and\
    \ loop, you do not actually have to put any lines of code in them. However, failing\
    \ to add code will make your sketch a little dull.\n\n# Blink—Again!\n\nThe reason\
    \ Arduino has the two functions setup and loop to separate the things that only\
    \ need to be done once, when the Arduino starts running its sketch, from the things\
    \ that have to keep happening continuously.\n\nThe function setup will just be\
    \ once when the sketch starts. Let’s add some code to it that will blink the LED\
    \ built onto the board. Add the lines to your sketch so that it appears as follows\
    \ and then upload them to your board:\n\n```\nvoid setup()\n{\n  pinMode(13, OUTPUT);\n\
    \  digitalWrite(13, HIGH);\n}\n```\n\n```\nvoid loop()\n{}\n```\n\nThe setup function\
    \ itself calls two built-in functions, pinMode and digitalWrite. You already know\
    \ about digitalWrite, but pinMode is new. The function pinMode sets a particular\
    \ pin to be either an input or an output. So, turning the LED on is actually a\
    \ two-st-stage process. First, you have to set pin 13 to be an output, and second,\
    \ you need to set that output to be high (5V).\n\nWhen you run this sketch, on\
    \ your board you will see the LED comes on and stays on. This is not very exciting,\
    \ so let’s at least try to make it flash by turning it on and off in the loop\
