    \n# 数字输入\n\n输入引脚的典型用途是向它连接一个开关。图 6-6 显示了你可能如何连接你的开关。\n\n```cpp\nint inputPin =\
    \ 5;\n\nvoid setup() {\n  pinMode(inputPin, INPUT);\n  Serial.begin(9600);\n}\n\
    \nvoid loop() {\n  int reading = digitalRead(inputPin);\n  Serial.println(reading);\n\
    \  delay(1000);\n}\n```\n\n数字输入最常见的用途是检测开关是否已关闭。\n\n这种方法的问题在于，如果开关没有关闭，输入引脚就没有连接到任何东西。它处于所谓的“浮空”状态，很容易给你错误的读数。你需要你的输入更具可预测性，而实现这一点的方法是使用所谓的“上拉电阻”。图\
    \ 6-7 显示了上拉电阻的标准用法。它的作用是，如果开关是打开的，电阻会将浮空输入拉高到 5V。当你按下开关并关闭触点时，开关会覆盖电阻的作用，强制输入变为\
    \ 0V。这种方法的一个副作用是，当开关关闭时，5V 将跨越电阻，导致电流流动。因此，电阻的值选择要足够小以使其免受任何电干扰，但同时足够大，以防止在开关关闭时产生过大的电流消耗。\n\
