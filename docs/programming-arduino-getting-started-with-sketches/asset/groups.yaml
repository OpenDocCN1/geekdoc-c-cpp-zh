    The purpose of each of these pins is described in Table 9-1.


    | Parameter to LCD | Arduino Pin | Purpose |

    | RS | 8 | Register Select; this is set to 1 or 0 depending on whether the Arduino
    is sending data characters or an instruction. An instruction might make the cursor
    flash, for example. |

    | E | 9 | Enable; this gets toggled to tell the LCD controller chip that the data
    on the four pins is ready to read |

    | Data 4 | 4 | These four pins are used to transfer data. The LCD controller chip
    used by the shield can use eight-bit or four-bit data. This shield uses four bits,
    in which case the bits 4–7 are used rather than 0–7. |

    | Data 5 | 5 | |

    | Data 6 | 6 | |

    | Data 7 | 7 | |


    # Table 9-1 LCD shield pin assignments


    The setup function is straightforward. You start serial communications so that
    the Serial Monitor can send commands and initialize the LCD library with the dimensions
    of the display being. You also display the message "Arduino Rules" on two lines
    by setting the cursor to top-left, printing "Arduino," then moving the cursor
    to the start of the second row and printing "Rules."


    Most of the actions take place in the loop function, which checks for any incoming
    characters from the Serial Monitor. The sketch deals with characters one at a
    time.


    Apart from ordinary characters that the sketch will simply display, there are
    also a couple of special characters. If the character is a #, the sketch clears
    the whole display, and if the character is a /, the sketch moves to the second
    line. Otherwise, the sketch simply displays the character at the current cursor
    position using write. The function write is like print, but it prints only a single
    character rather than a string of characters.


    # Using the Display


    Try out sketch 9-01 by uploading it to the board and then attaching the shield.
    Note that you should always unplug the Arduino board so that it is off before
    you plug in a shield.


    Open up the Serial Monitor and try typing in the text shown in Figure 9-3.'
