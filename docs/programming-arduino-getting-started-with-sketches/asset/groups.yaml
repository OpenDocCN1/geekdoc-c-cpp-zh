    The next argument is the name of the function that is to be called when there
    is an interrupt, and the final argument is a constant that will be one of CHANGE,
    RISING, or FALLING. Figure 7-4 summarizes these options.


    If the interrupt mode is CHANGE, then either a RISING from 0 to 1 or a FALLING
    from 1 to 0 will both trigger an interrupt.


    You can disable interrupts using the function noInterrupts. This stops all interrupts
    from both interrupt channels. You can resume using interrupts again by calling
    the function interrupts.


    # Conclusion


