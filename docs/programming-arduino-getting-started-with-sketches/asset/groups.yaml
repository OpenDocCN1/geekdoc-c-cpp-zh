    The other is to include some examples of how to use the library.


    # Keywords


    To define the keywords, you have to create a file called keywords.txt, which goes
    into the

    lasher directory. This file contains just the two following lines:


    ```

    Flasher KEYWORD1

    flash KEYWORD2

    ```


    This is essentially a two-column table in a text file. The left column is the
    keyword and

    t right column an indication of the type of keyword it. Class names should be
    a

    KEYWORD1 and methods should be KEYWORD2. It does not matter how many spaces

    tabs you put between the columns, but each keyword should start on a new line.


    # Examples


    The other thing that you, as a good Arduino citizen, should include as part of
    the library is

    a folder of examples. In this case, the library is so simple that a single example
    will

    suffice.


    The examples must all be placed in a folder called examples inside the Flasher
    folder.

    The example is in fact just an Arduino sketch, so you can create the example using
    the

    Arduino IDE. But first, you have to quit and reopen the Arduino IDE to make it

    are of the new library.


    After restarting the Arduino IDE, from the Arduino IDE’s menu, select File and
    then

    New to create a new sketch window. Then from the Menu, Sketch and the Import

    Library option. The Options should look something like Figure 11-1.


    The libraries above the line in the submenu are the official libraries; below
    this line are

    t“unofficial” contributed libraries. If all has gone well, you should see Flasher
    in the

    list.


    If Flasher is not in the list, it is very likely that the Flasher folder is not
    in the libraries

    folder of your sketches folder, so go back and check.'
