  - "[PAGE 52]\n\nFigure 3-7 shows what you should see in the Serial Monitor after\
    \ this code runs.\n\nTo take a slightly more complex example, the formula for\
    \ converting a temperature in degrees Centigrade to degrees Fahrenheit is to multiply\
    \ by 5, divide by 9, and then add 32. So you could write that in a sketch like\
    \ this:\n\n![](img/6426909fcee15359dcfa665c8698110f_52_0.png)\n\n# Figure 3-7\
    \ Simple arithmetic\n\n```\n// sketch 3-05\nvoid setup() \n{\n  Serial.begin(9600);\n\
    \  int degC = 20;\n  int degF;\n  degF = degC * 9 / 5 + 32;\n  Serial.println(degF);\n\
    }\nvoid loop() {\n}\n```\n\nThere are a few things to notice here. First, note\
    \ the following line:\nint degC = 20;\n\nWhen we write such a line, we are actually\
    \ doing two things: We are declaring an int variable called degC, and we are saying\
    \ that its initial value will be 20. Alternatively, you could separate these two\
    \ things and write the following:\n\n```\nint degC;\ndegC = 20;\n```\n\nYou must\
    \ declare any variable just once, essentially telling the compiler what type of\
    \ variable it is—in this case, int. However, you can assign the variable a value\
    \ as many times as you want:\n\n```\nint degC;\ndegC = 20;\ndegC = 30;\n```"
  - '[PAGE 53]


    So, in the Celsius to Fahrenheit example, you are defining the variable degC and
    giving an initial value of 20, but when you define degF, it does not get an initial
    value. Its value gets assigned on the next line, according to the conversion formula,
    before being sent to the Serial Monitor for you to see.


    Looking at the expression, you can see that the asterisk (*) for multiplication
    and the slash (/) for division. the arithmetic operators +, *, and have an order
    of precedence—that is, multiplications are done first, then additions and subtractions.
    This is in accordance with the usual use of arithmetic. However, sometimes it
    makes it clearer to use parentheses in the expressions. So, for example, you could
    write the following:


    ```

    degF = ((degC * 9) / 5) + 32;

    ```


    The expressions that you write can be long and complex as you need them to be,
    and in addition to the usual arithmetic operators, there are other less commonly
    used operators and a big collection of various mathematical functions that are
    available to you. You will learn about these later.


    # Commands


    The C language has a number of built-in commands. In this section, we explore
    some of these and see how they can be of use in your sketches.


    # if


    In our sketches so far, we have assumed that your lines of programming will be
    executed in one order after the other, with no exceptions. But what if you don''t
    want to do that? What if you only want to execute part of a sketch if some condition
    is true?


    Let’s return to our gradually slowing-down Blinking LED example. At the moment,
    it will get slower and slower until each blink is lasting hours. Let’s look at
    how we can change it so that once it has slowed down to a certain point, it goes
    back to its fast starting speed.


    To do this, you must use an if command; the modified sketch is as follows. Try
    it out.'
  - "[PAGE 54]\n\n```\n// sketch 3-06\nint ledPin = 13;\nint delayPeriod = 100;\n\n\
    void setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  delayPeriod = delayPeriod + 100;\n  if (delayPeriod > 3000) {\n    delayPeriod\
    \ = 100;\n  }\n}\n```\n\nThe if command looks a little like a function definition,\
    \ but this resemblance is only superficial. The word in the parenthesis is not\
    \ an argument; it is what is called a condition. In this case, the is is the variable\
    \ delayPeriod has a value that is greater than 3,000. If this is true, the commands\
    \ inside the curly braces will be executed. In this case, the code sets the value\
    \ of delayPeriod back to 100.\n\nIf the condition is not true, then the Arduino\
    \ will continue on the next thing. In this case, there is nothing after the “if”,\
    \ so the Arduino will run the loop function again.\n\nRunning through the sequence\
    \ of events in your head will help you understand what is going on. So, here is\
    \ what happens:\n\n+   1. Arduino runs setup and initializes the LED pin to be\
    \ an output.\n2. Arduino starts running loop.\n3. The LED turns on.\n4. A delay\
    \ occurs.\n5. The LED turns off.\n6. A delay occurs.\n7. Add 100 to the delayPeriod.\n\
    8. If the delay period is greater than 3,000 set it back to 100.\n9. Go back to\
    \ step 2.\n\nWe used the symbol <, which means less than. It is one example of\
    \ what are called comparison operators. These operators are summarized in the\
    \ following table:"
  - "[PAGE 55]\n\n| Operator | Meaning | Examples | Result |\n| --- | --- | --- |\
    \ --- |\n| < | Less than | 9 < 10<br>10 < 10 | true<br>false |\n| > | Greater\
    \ than | 10 > 10<br>10 > 9 | true |\n| <= | Less or equal to | 9 <= 10<br>10 <=\
    \ 10 | true<br>true |\n| >= | Greater or equal to | 10 >= 10<br>10 >= 9 | true<br>true\
    \ |\n| == | Equal to | 9 == 9 | true |\n != | Not equal to | 9 != 9 | false |\n\
    \nTo compare two numbers, you use the == command. This double equals sign is easily\
    \ confused with the character =, which is used to assign values to variables.\n\
    \nThere is another form of if that allows you to do one thing if the condition\
    \ is true and another if it is false. We will use this in some practical examples\
    \ later in the book.\n\n# for\n\nIn addition to executing different commands under\
    \ different circumstances, you often will want to run a series of commands a number\
    \ of times in a program. You already know one way of doing this, using the loop\
    \ function. As soon as all the commands in the loop function have been run, it\
    \ will start again automatically. However, sometimes you need more control than\
    \ that.\n\nSo, for example, let's say that you want to write a sketch that blinks\
    \ 20 times, then paused for 3 seconds, and then started again. You could do that\
    \ by just repeating the same code over and over again in your loop function, like\
    \ this:"
  - "[PAGE 56]\n\n```\n// sketch 3-07\nint ledPin = 13;\nint delayPeriod = 100;\n\n\
    void setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  // repeat the above 4\
    \ lines another 17 times\n\n  delay(3000);\n}\n```\n\nBut this requires a lot\
    \ of typing and there are several much better ways to do this. Let's start by\
    \ looking at how you can use a for loop and then look at another way of doing\
    \ it using a counter and an if statement.\n\nThe sketch to accomplish this with\
    \ a for loop is, as you can see, a lot shorter and easier to maintain than the\
    \ previous example:"
  - "[PAGE 57]\n\n```\n// sketch 3-08\nint ledPin = 13;\nint delayPeriod = 100;\n\n\
    void setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  for (int i =\
    \ 0; i < 20; i++) {\n    digitalWrite(ledPin, HIGH);\n    delay(delayPeriod);\n\
    \    digitalWrite(ledPin, LOW);\n    delay(delayPeriod);\n  }\n  delay(3000);\n\
    }\n```\n\nThe for looks like a function that takes three arguments, although these\
    \ arguments are separated by semicolons rather than the usual commas. This is\
    \ just a quirk of the C language. The compiler will soon tell you when you get\
    \ it wrong.\n\nThe first thing in the parentheses after for is a variable declaration.\
    \ This specifies a variable to be used as a counter and gives it an initial value—in\
    \ this case, 0.\n\nThe second part is a condition that must be true for you to\
    \ stay in the loop. In this case, you will stay in the loop as long as i is less\
    \ than 20, but as soon as i is 20 or more, the program will stop doing the things\
    \ inside the loop.\n\nThe final part is what to do every time you have done all\
    \ the things in the loop. In this case, that is to increment i by 1 so that it\
    \ can, after 20 trips around the loop, cease to be less than 100 and cause the\
    \ program to exit the loop.\n\nTry entering code and running it. The only way\
    \ to get familiar with the syntax and all pesky punctuation is to type it in and\
    \ the compiler will tell you when you have something wrong. Eventually it will\
    \ all start to make sense.\n\nA potential downside of this approach is that the\
    \ loop function is going to take a long time. This is not a problem for this sketch,\
    \ because all it doing is flashing an LED. Often, the loop function in a sketch\
    \ will also be checking that keys have been pressed or that serial communications\
    \ have been received. If the processor is busy inside a for loop, it will not\
    \ be able to do this. Generally, it is a good idea to make the loop function run\
    \ as fast as possible so that it can run as frequently as possible.\n\nThe following\
    \ sketch shows how to achieve this:"
- md: "\n```cpp\n// sketch 3-09\nint ledPin = 13;\nint delayPeriod = 100;\nint count\
    \ = 0;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digital_write(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digital_write(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  count++;\n  if (count == 20) {\n    count = 0;\n    delay(3000);\n  }\n}\n\
    ```\n\nYou may may have noticed the following line:\ncount++;\n\nThis is just\
    \ C shorthand for the following:\ncount = count + 1;\n\nSo now each time loop\
    \ is run, it will take just a bit more than 200 milliseconds, unless it's the\
    \ 20th round the loop, in which case it will take the plus the three seconds delay\
    \ between each batch of 20 flashes. In fact, for some applications, even this\
    \ is too slow, and purists would say that you should not use delay at all. The\
    \ best solution depends on the application.\n\n## while\n\nAnother way of looping\
    \ in C is to use the while command in place of the for command.\nYou can accomplish\
    \ the same thing as the preceding for example using a while command as follows:\n\
    \n```cpp\ni = 0;\nwhile (i < 20)\n{\n  digital_write(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digital_write(ledPin, LOW);\n  delay(delayPeriod);\n  i++;\n}\n```\n\nThe expression\
    \ in parentheses after while must be true to stay in the loop. When it is no longer\
    \ true, then the sketch continues running the commands after the final curly brace.\n\
    \n## #define Directive\n\nFor constant values pin assignments that do not change\
    \ during the running of a sketch, there is an alternative to using a variable.\
    \ You can use a command called #define that allows you to associate a value with\
    \ a name. Wherever this name appears in your sketch, the value will be substituted\
    \ before the sketch is compiled.\n\nAs an example, you could define a pin assignment\
    \ for a LED like this:\n#define ledPin 13\n\nNote that the #define directive does\
    \ not use \"=\" between the name and the value. it does not even need a \";\"\
    \ on the end. This is because it is not actually part of the C language itself;\
    \ but is called a pre-compiler directive that is run before compilation.\n\nThis\
    \ approach, in the author's opinion, is less easy to read than using a variable,\
    \ but it does have the advantage that you do not use any memory to store it. It\
    \ is something to consider if memory is at a premium.\n\n## Conclusion\n\nThis\
    \ chapter has got you started with C. You can make LEDs blink in various exciting\
    \ ways and get the Arduino to send results back to you over the USB by using the\
    \ Serial.println function. You also worked out how to use if and for commands\
    \ to control the order in which your commands are executed, and learned a little\
    \ about making some arithmetic.\n\nIn the next chapter, you will look more closely\
    \ at functions. The chapter will also introduce the variable types other than\
    \ the int type that you used in this chapter.\n\n## 4 Functions\n\nThis chapter\
    \ focuses mostly on the type of functions that you can write yourself rather than\
    \ the built-in functions as digitalWrite and delay that are already defined for\
    \ you.\n\nThe reason that you need to be able to write your own functions is that\
    \ sketches start to get a little complicated, then your setup and loop functions\
    \ will grow and grow until they are long and complicated and it becomes difficult\
    \ to see how they work.\n\nThe biggest problem in software development of any\
    \ sort is managing complexity. The best programmers write software that is easy\
    \ to look at and understand and requires very little in the way of explanation.\n\
    \nFunctions are a key tool in creating easy-to-understand sketches that can be\
    \ changed without difficulty or risk of the whole thing falling into a crumpled\
    \ mess.\n\n## What Is a Function?\n\nA function is a little like a program within\
    \ a program. You can use it to wrap up some little thing that you want to do.\
    \ A function that you define can be called from anywhere in your sketch and contains\
    \ its own variables and its own list of commands. When the commands have been\
    \ run, execution returns to the point just after wherever it was in the code that\
    \ called the function.\n\nBy way of an example, code that flashes a light-emitting\
    \ diode (LED) is a prime example of some code that should be put in a function.\
    \ So let’s modify our basic “blink 20 times” sketch to use a function that we\
    \ will create called flash:\n\n```cpp\n// sketch 4-01\nint ledPin = 13;\nint delayPeriod\
    \ = 250;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n \
    \ for (int i = 0; i < 20; i++) {\n    flash();\n  }\n  delay(3000);\n}\n\nvoid\
    \ flash() {\n  digital_write(ledPin, HIGH);\n  delay(delayPeriod);\n  digital_write(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n}\n```\n\nSo, all we have really done here is\
    \ to move the four lines of code that flash the LED from the middle of the for\
    \ loop to be in a function of their own called flash. Now you can make the LED\
    \ flash any time you like by calling the new function by writing flash(). Note\
    \ the empty parentheses after the function name. This indicates that the function\
    \ does not take any parameters. The delay value that it uses is set by the same\
    \ delayPeriod that you used before.\n\n## Parameters\n\nWhen dividing your sketch\
    \ into functions, it is often worth thinking about what service a function could\
    \ provide. In the case of flash, this is fairly obvious. But this time, let's\
    \ give this function parameters that tell it both, how many times to flash and\
    \ how short or long the flashes should be. Read through the following code and\
    \ then I will explain just how parameters work in a little more detail.\n\n```cpp\n\
    // sketch 4-02\nint ledPin = 13;\nint delayPeriod = 250;\n\nvoid setup() {\n \
    \ pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  flash(20, delayPeriod);\n  delay(3000);\n\
    }\n\nvoid flash(int numFashes, int d) {\n  for (int i = 0; i < numFashes; i++)\
    \ {\n    digital_write(ledPin, HIGH);\n    delay(d);\n    digital_write(ledPin,\
    \ LOW);\n    delay(d);\n  }\n}\n```\n\nNow, if we look at our loop function, it\
    \ will take just a bit more than 200 milliseconds, unless it's the 20th round\
    \ the loop, in which case it will take the plus the three seconds delay between\
    \ each batch of 20 flashes. In fact, for some applications, even this is too slow,\
    \ and purists would say that you should not use delay at all. The best solution\
    \ depends on the application.\n\nNow, if we look at our loop function, it will\
    \ take just a bit more than 200 milliseconds, unless it's the 20th round the loop,\
