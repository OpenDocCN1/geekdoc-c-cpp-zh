    \ a bit. As with the digital inputs, this is because the input is floating.\n\n\
    Take one end of the wire and put it into a GND socket so that A0 is connected\
    \ to GND. Your readings should stay at 0. Move the end of the lead that you put\
    \ in GND and put it into 5V and you should get a reading of around 1023, which\
    \ is the maximum reading. So, if you were to connect A0 to the 3.3V socket on\
    \ the Arduino board, the Arduino voltmeter should tell you that you have about\
