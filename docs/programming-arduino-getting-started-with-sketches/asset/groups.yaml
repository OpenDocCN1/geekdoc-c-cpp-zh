  - "[PAGE 123]\n\nThe ATMega328 at the heart of an Arduino Uno has a kilobyte of\
    \ electrically erasable read-only memory (EEPROM). EEPROM is designed to remember\
    \ its contents for many years. Despite its name, it is not really read-only. You\
    \ can write to it.\n\nThe Arduino commands for reading and writing to EEPROM are\
    \ just as awkward to use the ones for using PROGMEM. You have to read and write\
    \ to and from EEPROM one byte at a time.\n\nThe example of sketch 8-02 allows\
    \ you to enter a single-digit letter code from the Serial Monitor. The sketch\
    \ remembers the digit and repeatedly writes it out on the Serial Monitor.\n\n\
    ```\n// sketch 8-02\n#include <EEPROM.h>\n\nint addr = 0;\\char ch;\nvoid setup()\
    \ {\n  Serial.begin(9600);\n  ch = EEPROM.read(addr);\n}\n\nvoid loop() {\n  if\
    \ (Serial.available() > 0) {\n    ch = Serial.read();\n    EEPROM.write(0, ch);\n\
    \    Serial.println(ch);\n  }\n  Serial.println(ch);\n  delay(1000);\n}\n```\n\
    \nTo try this sketch, open the Serial Monitor and enter a new character. When\
    \ you unplug the Arduino and plug it back in. When you reopen the Serial Monitor,\
    \ you will see that the letter has remembered.\n\nThe function EEPROM.write takes\
    \ two arguments. The first is the address, which is the memory location in EEPROM\
    \ and should be between 0 and 1023. The second argument is the data to write at\
    \ that location. This must be a single byte. A character is represented as eight\
    \ bits, so this is fine, but you cannot directly store a 16-bit int.\n\n# Storing\
    \ an int in EEPROM\n\nTo store a two-byte int in locations 0 and 1 of the EEPROM,\
    \ you would have to do this:"
  - "[PAGE 124]\n\n```\nint x = 1234;\nEEPROM.write(0, highByte(x));\nEEPROM.write(1,\
    \ lowByte(x));\n```\n\nThe functions highByte and lowByte are useful for separating\
    \ an int into two bytes.\nFigure 8-1 shows how this int is actually stored in\
    \ the EEPROM.\n\n| Address | High Byte | Low Byte |\n|---|---|---|\n| 0 | 1234\
    \ decimal = 0000 0100 | 1101 0010 |\n| 1 | 1101 0010 | |\n| 2 | | |\n| 3 | | |\n\
    \nFigure 8-1 Storing a 16-bit integer in EEPROM\n\nTo read the int back out of\
    \ EEPROM, you need to read the two bytes from the EEPROM and reconstruct the int,\
    \ as follows:\n\n```\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\n\
    int x = (high << 8) + low;\n```\n\nThe << operator is a bit shift operator that\
    \ moves the high bytes to the top of the int and then adds in the low byte.\n\n\
    # Storing a float in EEPROM (Unions)\n\nStoring a float in EEPROM is a little\
    \ more tricky. To do this, you can use a feature of C unions. These data structures\
    \ are interesting in that they can be thought of as a way to make the same area\
    \ of memory accessible to more than one variable. What is more, these variables\
    \ are allowed to be of different types as long as they are the same size in bytes.\n\
    \nThe following union definition allows both a float and an int to refer to the\
    \ same two bytes of memory:\n\n```\nunion data {\n  float f;\n  int i;\n} convert;\n\
    ```"
  - "[PAGE 125]\n\nYou can then put a float into the union as follows:\nfloat f =\
    \ 1.23;\nconvert.f = f;\n\nThen you can separate an integer into two bytes for\
    \ storage in EEPROM as follows:\nEEPROM.write(0, highByte(convert.i));\nEEPROM.write(1,\
    \ lowByte(convert.i));\n\nReading the float out again requires you to do the reverse.\
    \ First you assemble\ntwo bytes into a single int, then you put the int into the\
    \ union and pull it out again as a\nfloat.\n\n```\nbyte high = EEPROM.read(0);\n\
    byte low = EEPROM.read(1);\nconvert.i = (high << 8) + low;\nfloat f = convert.f;\n\
    ```\n\n# Storing a String in EEPROM\n\nWriting and reading character strings into\
    \ the EEPROM are pretty straightforward;\njust have to write each character at\
    \ a time, as in the following example:\n\n```\nchar *test = \"Hello\";\nint i\
    \ = 0;\nwhile (test[i] != '\\\\0')\n{\n  EEPROM.write(i, test[i]);\n  i++;\n}\n\
    ```\n\nTo read the string back into a character array, you can do something like\
    \ this:\n\n```\nchar test [10];\nint i = 0;\nchar ch;\nch = EEPROM.read(i);\n\
    while (ch != '\\\\0' && i < 10)\n{\n  test[i] = ch;\n  ch = EEPROM.read(i);\n\
    \  i++;\n}\n```\n\n# Clearing the Contents of EEPROM"
  - "[PAGE 126]\n\nWhen writing to EEPROM, remember that even uploading a new sketch\
    \ will not clear the\\EEPROM, so you may have leftover values in there from a\
    \ previous project. Sketch 8-03\nresets all the contents of EEPROM to zeros:\n\
    \n```\n// sketch 8-03\n#include <EEPROM.h>\n\nvoid setup() \n{\n  Serial.begin(9600);\n\
    \  Serial.println(\"Clearing EEPROM\");\n  for (int i = 0; i < 1023; i++) {\n\
    \    EEPROM.write(i, 0);\n  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\nvoid\
    \ loop()\n```\n\nAlso be aware that you can write to an EEPROM location only about\
    \ 100,000 times\nbefore it will become unreliable. So only write a value back\
    \ to EEPROM when you really\nneed to. EEPROM is also quite slow, taking about\
    \ 3 milliseconds to write a byte.\n\n# Compression\n\nWhen saving data to EEPROM\
    \ or using PROGMEM, you will sometimes find that\nyou have more to save than you\
    \ have room to save it. When this happens, it is worth\nfinding the most efficient\
    \ way of representing the data.\n\n# Range Compression\n\nYou may have a value\
    \ for which on the face of it you need an int or a float that are both\n16-bit.\
    \ For example, to represent a temperature in degrees Celsius, you might use a\
    \ float\nvalue such as 20.25. When you are storing that into EEPROM, life would\
    \ be so much\neasier if you could fit it into a single byte, and you could store\
    \ as much as if you\nused a float.\n\nOne way that you can do this is to change\
    \ the data before you store it. Remember that a\nbyte will allow you to store\
    \ a positive number between 0 and 255. So if you only carednat the temperature\
    \ to the nearest degree Celsius, then you could simply convert the\nfloat to an\
    \ int and discard the part after the decimal point. The following example shows\n\
    how to do this:\n\n```\nint tempInt = (int)tempFloat;\n```"
  - "[PAGE 127]\n\nThe variable tempFloat contains the floating point value. The (int)\
    \ command is called a type cast and is used to convert a variable from one type\
    \ to another compatible type. In this case, the type cast converts the float of\
    \ (for example) 20.25 to an int that will simply truncate the number to 20.\n\n\
    If you know the highest temperature you care about is 60 degrees Celsius and that\
    \ the lowest is 0 degrees Celsius, you could multiply every temperature by 4 before\
    \ converting it to a byte and saving. When you read the data back from EEPROM,\
    \ you can divide by 4 to get a value that has a precision of 0.25 of a degree.\n\
    \nThe following code example (sketch 8-04) saves such a temperature into EEPROM,\
    \ then reads back and displays it in the Serial Monitor as:\n\n```\n//sketch 8-04\n\
    \n#include <EEPROM.h>\n\nvoid setup() {\n  float tempFloat = 20.7575;\n  byte\
    \ tempByte = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\nbyte tempByte2\
    \ = EEPROM.read(0);\n  float temp2 = (float)tempByte2 / 4;\n  Serial.begin(9600);\n\
    \  Serial.println(\"\\n\\n\\n\");\n  Serial.println(temp2);\n}\n\nvoid loop()\
    \ {\n```\n\nThere are other means of compressing data. For instance, if you are\
    \ taking readings that change slowly—again, changes in temperature are a good\
    \ example of this—then you can record the first temperature at full resolution\
    \ and then just record the changes in temperature from the previous reading. This\
    \ change will generally be small and occupy fewer bytes.\n\n# Conclusion\n\nYou\
    \ now know a little about how to make your data hang around after the power has\
    \ gone off. In the next chapter, you will look at LCD displays."
