    The purpose of this command is to tell the compiler the pgmspace library for this
    sketch. a library is a set of functions that someone else has written and that
    you can use in your sketches without having to understand all the details of how
    those functions work.


    Because you are using this library, the PROGM keyword and the pgm_read_word function
    are available. You will use both in the sketches that follow.


    This library is included as part of the Arduino software and is an officially
    supported Arduino library. A good collection of such official libraries is available,
    and many unofficial libraries, developed by people like you and made for others
    to use, are also available on the Internet. Such unofficial libraries must be
    installed into your Arduino environment. You will learn more about these libraries,
    as well as how to write your own libraries, in Chapter 11.


    When using PROGM, you have to make sure that you use special PROGMfriendly data
