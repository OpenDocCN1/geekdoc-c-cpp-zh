    # 10

    Arduino Ethernet Programming


    In this chapter, you will use an Ethernet shield to enable your Arduino to work
    over your home network (see Figure 10-1).


    ![](img/6426909fcee15359dcfa665c8698110f_136_0.png)


    **Figure 10-1** Arduino with Ethernet


    # Ethernet Shields


    When buying an Ethernet shield, you need to take a little care, as you need to
    use an “official” shield based on the Wiznet chipset and *not* one of the cheaper
    but more difficult to use unofficial boards based on the ENC28J60 Ethernet controller
    chip.


    The Ethernet shields are quite hungry, so you will also need a 9V or 12V power
    supply rated at 1A or more. This supply will be attached to the Arduino power
    socket.


    # Communicating with Web Servers


    Before looking at how the Arduino deals with communication between a browser and
    the web server that it uses, you need some understanding of the HyperText Transfer
    Protocol'
  - '[PAGE 137]


    (HTTP) and the HyperText Markup Language (HTML).


    # HTTP


    The HyperText Transport Protocol is the method by which web browsers communicate
    with a web server.


    When you go to a page using a web browser, the browser sends a request to the
    server hosting that page, saying what it wants. What the browser asks for may
    be simply the contents of a page in HTML. The web server is always listening for
    such requests, and when it receives one, it processes it. In this simple case,
    processing the request just means sending back HTML that you have specified in
    the Arduino sketch.


    # HTML


    The HyperText Markup Language is a way of adding formatting to ordinary text so
    that it looks good when the browser displays it. For example, the following code
    is HTML that displays on a browser page as shown in Figure 10-2:


    ```

    <html>

    <body>

    <h1>Programming Arduino</h1>

    <p>A book about programming Arduino</p>

    </body>

    </html>

    ```


    The HTML contains tags. Tags have a start and an end and usually contain other
    tags. The start of a tag has a < and then the tag name, and then a >; for example,
    <html>. The end of a tag is similar except that it has a / after the <. In the
    preceding example, the outermost tag is <html> that contains a tab called <body>.
    All web pages should start with such tags, and you can see the corresponding ends
    for those tags at the end of the file. Note that you have put the end tags in
    the right order, so the body tag must be closed before html.


    Now we get to the interesting bit in the middle, the h1 and p tags. These are
    the parts of the example that are actually displayed.


    The h1 tag indicates a level 1 header. This has the effect of displaying the text
    that it contains in a large bold font. The p tag is a paragraph tag, and so all
    the text contained within it is displayed as a paragraph.


    This really just scratches the surface of HTML. Many books and Internet resources
    are available for learning about HTML.'
