    ![](img/6426909fcee15359dcfa665c8698110f_99_0.png)


    Figure 6-7 Switch with a pull-up resistor


    # Internal Pull-up Resistors


    Fortunately, the Arduino board has software-configurable pull-up resistors built
    into the digital pins. By default, they are turned off. So all you need to do
    to enable the pull-up resistor on pin 5 for sketch-6-02 is to add the following
    line:


    ```

    digitalWrite(inputPin, HIGH);

    ```


    This line goes in the setup function right after you define the pin as an input.
    It may seem a little strange to do a digitalWrite to an input, but this is just
    how it works.

    Sketch 6-03 is the modified version. Upload it to your Arduino board and test
    it by acting like an antenna again. You should find that this time the input stays
    at 1 in the Serial Monitor.'
  - "[PAGE 100]\n\n```\n//sketch 6-03\n\nint inputPin = 5;\n\nvoid setup() {\n  pinMode(inputPin,\
    \ INPUT);\n  digitalWrite(inputPin, HIGH);\n  Serial.begin(9600);\n}\nvoid loop()\
    \ {\n  int reading = digitalRead(inputPin);\n  Serial.println(reading);\n  delay(1000);\n\
    }\n```\n\n# # Debouncing\n\nWhen you press a button, you would expect that you\
    \ would just get a single change from 1 (with a pull-up resistor) to 0 as the\
    \ button is depressed. Figure 6-8 shows what can happen when you press a button.\
    \ The metal contacts in the button bounce becomes a series of presses that eventually\
    \ stabilize.\n\nAll this happens very quickly; the total span of the button press\
    \ on the oscilloscope trace is only 200 milliseconds. This is a very \"ropey\"\
    \ old switch. A new tactile, click-type button may not even bounce at all.\n\n\
    Sometimes bouncing does not matter at all. For instance, sketch 6-04 will light\
    \ the LED while the button is pressed. In reality, you would not use an Arduino\
    \ to do this; we are firmly in the realms of theory rather than practice here.\n\
    \n![](img/6426909fcee15359dcfa665c8698110f_100_0.png)\n\n**Figure 6-8** Oscilloscope\
    \ trace of a button press"
  - "[PAGE 101]\n\n```\n//sketch 6-04\n\nint inputPin = 5;\nint ledPin = 13;\n\nvoid\
    \ setup() {\n  pinMode(ledPin, OUTPUT);\n  pinMode(inputPin, INPUT);\n  digitalWrite(inputPin,\
    \ HIGH);\n}\n\nvoid loop() {\n  int switchOpen = digitalRead(inputPin);\n  digitalWrite(ledPin,\
    \ !switchOpen);\n}\n```\n\nLooking at the **loop** function of 6-04, the function\
    \ reads the digital input and assigns its value to a variable **switchOpen**.\
    \ This is a 0 if the button is pressed and a 1 if it isn’t (remember that the\
    \ pin is pulled up to 1 when the button is not pressed).\n\nWhen you program **digitalWrite**\
    \ to turn the LED on or off, you need to reverse this value. You do this using\
    \ the **!** or **not** operator.\n\nIf you upload this sketch and connect your\
    \ wire between D5 and GND (see Figure 6-9), you should see the LED light. Bouncing\
    \ may be going on here, but it is probably too fast for you to see and does not\
    \ matter.\n\nOne situation where key bouncing would matter is if you were making\
    \ your switch toggle the LED on and off. That is, if you press the button, the\
    \ LED comes on and stays on, and when you press the button again, it turns off.\
    \ If you had a bounced, whether the LED was on or off would just depend on whether\
    \ you had an odd or even number of bounces.\n\nSketch 6-05 just toggles the LED\
    \ without any attempt at “debouncing.” Try it out using your wire as a switch\
    \ between D5 and GND:"
  - "[PAGE 102]\n\n```\n// sketch 6-05\n\nint inputPin = 5;\nint ledPin = 13;\nint\
    \ ledValue = LOW;\n\nvoid setup() {\n  pinMode(inputPin, INPUT);\n  digitalWrite(inputPin,\
    \ HIGH);\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  if (digitalRead(inputPin)\
    \ == LOW) {\n    ledValue = ! ledValue;\n    digitalWrite(ledPin, ledValue);\n\
    \  }\n}\n```\n\nYou will probably find that sometimes the LED toggles, but other\
    \ times it appears not to toggle. This is bouncing in action!\n\nA simple way\
    \ to tackle this problem is simply to add a delay after you detect the first button\
    \ press, as shown in sketch 6-06:\n\n```\n// sketch 6-06\nint inputPin = 5;\n\
    int ledPin = 13;\nint ledValue = LOW;\n\nvoid setup() {\n  pinMode(inputPin, INPUT);\n\
    \  digitalWrite(inputPin, HIGH);\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\
    \ {\n  if (digitalRead(inputPin) == LOW) {\n    ledValue = ! ledValue;\n    digitalWrite(ledPin,\
    \ ledValue);\n    delay(500);\n  }\n}\n```"
  - '[PAGE 103]


    ![](img/6426909fcee15359dcfa665c8698110f_103_0.png)


    # Figure 6-9 Using a wire as a switch


    By putting a delay here, nothing else can happen for 500 milliseconds, by which
    time any bouncing will have subsided. You should find that this makes the toggling
    much more reliable. An interesting side-effect is that if you hold the button
    down, the LED just keeps flashing.


    If that is all to the sketch, then this delay is not a problem. However, if you
    do more in the loop, then using a delay can be a problem; for example, the program
    would be unable to detect the press of any other button during that 500 milliseconds.


    So, this approach is sometimes not good enough and you will need to be a bit more
    sophisticated. You can write your own advanced debouncing code by hand, but doing
    so gets complicated and fortunately fine folks have done all the work for you.'
