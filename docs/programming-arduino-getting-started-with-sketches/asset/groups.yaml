    如果你想充分利用这本书的内容并尝试一些实验，那么手头有以下物品会很有用：


    - *几段实芯线*

    - *一个廉价的数字万用表*


    这两者在像 Radio Shack 这样的电子爱好商店里只需几美元就能买到。当然，你还需要一个 Arduino Uno 板板。


    如果你想更进一步，尝试使用以太网和液晶显示（LCD）扩展板进行实验，那么你需要从网上商店购买扩展板。详情请参阅第 9 章和第 10 章。


    # 如何使用本书


    本书的结构旨在让你以非常简单的方式入门，并根据你学到的内容逐步深入。不过，在找到适合自己的入门深度时，你可能会发现自己跳过或略读了一些早期章节。


    本书由以下章节组成：


    - **第 1 章：什么是 Arduino** —— Arduino 硬件介绍，本章描述了它的功能以及各种各种类型的 Arduino 板板。

    - **第 2 章：入门** —— 你将在 Arduino 板板上进行第一次实验：安装软件、上电以及上传你的第一个 sketch（程序）。

    - **第 3 章：C 语言基础** —— 本章涵盖了 C 语言基础；对于编程初学者来说，这些章节也充当了编程入门介绍。

    - **第 4 章：函数** —— 本章解释了在 Arduino sketch中使用和编写函数的关键概念。这些 sketch 将贯穿可运行代码示例进行演示。

    - **第 5 章：数组和字符串** —— 在这里你将学习如何创建和使用比简单整数变量更高级的数据结构。通过一个摩斯密码示例项目来逐步演示所解释的概念。

    - **第 6 章：输入与输出** —— 你学习如何在程序中使用 Arduino 的数字和模拟输入输出。万用表将有助于你观察 Arduino 输入/输出连接上发生了什么。

    - **第 7 章：标准 Arduino 库** —— 本章解释了如何使用 Arduino 标准库提供的标准 Arduino 函数。

    - **第 8 章：数据存储** 在这里你将学习如何编写可以将数据保存到电可擦除只读存储（EEPROM）中的 sketch，并利用 Arduino 内置的闪存。

    - **第 9 章：LCD 显示器** 在本章中，你将使用 LCD Shield 库编程，创建一个简单的 USB 消息板示例。

    - **第 10 章：Arduino 以太网编程** —— 你将学习如何让 Arduino 像 Web 服务器一样工作，同时获取超文本标记语言（HTML）和文本传输协议（HTTP）的基础知识。

    - **第 11 章：C++ 与库** —— 你将超越 C 语言，学习面向对象并编写自己的 Arduino 库。


    # 资源


    本书由配套网站支持：


    www.arduinoobook.com


    你可以在那里找到书中使用的所有源代码以及其他资源，如勘误。


    # 1 什么是 Arduino


    **Arduino** 是一个激发了电子爱好者想象力的微控制器平台。它的易用性和开源特性使其成为任何想要构建电子项目的人的理想选择。


    最终，它允许你通过引脚连接电子设备，从而控制它们——例如开启或关闭灯光或电机，感知光线和温度等。为什么 Arduino 有时被描述为*物理计算*？是因为 Arduino
    可以串口总线（USB）线连接到电脑，这意味着你可以将 Arduino 作为接口板，从电脑控制这些相同的电子设备。


    本章是对 Arduino 的介绍，包括 Arduino 的历史和背景，以及硬件概述。


    ## 微控制器


    Arduino 的核心是一个微控制器。板板上的几乎所有其他部分都是为板板提供供电并允许它与你的桌面计算机通信。


    微控制器实际上是芯片上的微型计算机。它拥有第一代家用计算机的所有功能甚至更多。它有一个处理器、一或两个千字节的随机访问内存（RAM）用于存储数据、几千字节的可擦除编程只读内存（EPROM）或闪存用于存储你的程序，以及输入输出引脚。这些输入/输出（I/O）引脚将微控制器连接到电子设备的其余部分。


    输入可以读取数字（开关是开启还是关闭？）和模拟（引脚电压是多少？）。这为连接许多类型的光线、温度、声音等传感器提供了机会。


    输出也可以是模拟或数字的。你可以设置引脚开启或关闭（0 伏或 5 伏），这可以直接控制发光二极管（LED）的开关，或者你可以使用输出控制更高功率设备（如电机）。它们还可以提供模拟输出电压。这样，你可以将引脚的输出设置为特定电压，从而控制电机的速度或灯光的亮度，而不仅仅是简单的开启或关闭。


    Arduino 板板上的微控制器是安装在板板中心插座中的 28 脚芯片。这个单芯片包含了内存、处理器以及用于输入输出引脚的所有电子元件。它由 Atmel 公司制造，它是主要的微控制器制造商之一，生产几十种归类为不同系列的微控制器。这些微控制器并不完全是为了像我们这样的电子爱好者的利益而制造的。我们只是这个庞大市场中的一小部分。这些设备真正旨在嵌入到消费产品中，包括汽车、洗衣机、DVD
    播放器和儿童玩具。


    Arduino 的伟大之处在于它通过对一种方案进行标准化并坚持，减少了这种令人眼花缭乱的选择。（嗯，正如我们之后看到的，说法并不完全正确。）这意味着当你开始一个新项目时，不需要权衡所有的优缺点。


    ## 开发板


    我们已经确定微控制器实际上只是一个芯片。如果没有支持性电子设备提供稳压电源，芯片将无法工作。这就是开发板大显身场。Arduino 板板实际上是一个微控制器开发板，它恰好是开源硬件设计。这意味着打印电路板（PCB）的设计文件和原理图都是公开的，每个人都可以自由使用这些设计。


    所有微控制器制造商——包括制作 Arduino 中使用的 ATmega328 的 Atmel——也提供他们自己的开发板和软件。尽管它们通常很便宜，但这些往往针对的是专业工程师而不是爱好者。这意味着此类板板和软件可能更难使用，并且在从中获得任何有用的东西之前，需要更大的学习投入。


    ## Arduino 板板导览


    图 1-1 显示了一个 Arduino 板板。让我们快速浏览一下板板上的各种组件。


    ![](img/6426909fcee15359dc665c8698110f_21_0.png)


    图 1-1 Uno 板板


    ## 电源


    参考图 1-1，USB 接口器正下方是 5 伏（5V）电压调节器。它将从电源插提供的任何电压（7V 到 12V 之间）调节为恒定的 5V。


    5V 电压调节器芯片对于表面贴装元件来说其实相当大。这样它就可以在较高的电流下散发调节电压所需的热量。这在驱动外部电子设备时非常有用。


    电源连接


    接下来让我们看图 1-1 底部的连接器。你可以读取连接器上的连接名称。第一个是 Reset（重位）。这与 Arduino 上的重位按钮的作用相同。就像重启
    PC 一样，使用 Reset 连接器通过 Reset 引脚重置微控制器，你临时将此引脚置低（连接到 0V）。


    该部分的其余引脚仅提供不同的电压（3.5V、5V、GND 和 9V），正如标签所示。GND，即地线，仅表示 0 伏。它是板板上所有其他电压的参考电压。


