    ![](img/6426909fcee15359dcfa665c8698110f_27_0.png)


    Figure 1-6 Arduino Nano


    The downside of the Nano is that because it is so much smaller than an Uno, it
    cannot accept Uno-sized shields.


    # Bluetooth


    The Arduino Bluetooth (Figure 1-7) is an interesting device as it includes Bluetooth
    hardware in place of the USB connector. This allows the device to even be programmed
    wirelessly.


    The Arduino Bluetooth is not a cheap board, and it is often cheaper to attach
    a third-party Bluetooth module to a regular Arduino Uno.


    # Lilypad


    The Lilypad (Figure 1-8) is a tiny, thin Arduino board that can be stitched into
    clothing for applications that have become known wearable computing.


    The Lilypad does not have a USB connection, and you must use a separate adaptor
    to program it. It has an exceptionally beautiful design.


    ![](img/6426909fcee15359dcfa665c8698110f_27_1.png)


    # Figure 1-7 Arduino Bluetooth


    ![](img/6426909fcee15359dcfa665c8698110f_28_0.png)


    # Figure 1-8 Arduino Lilypad


    # Other “Official” Boards


    The previously described Arduino boards constantly changes are the most useful
    and popular ones. However, the range of Arduino boards constantly changes, so
    for a complete and up-to-date picture of the Arduino family, see the official
    Arduino website list at http://www.arduino.cc/en/Main/Hardware.


    # Arduino Clones and Variants


    Unofficial boards fall into two categories. Some just take the standard open source
    hardware designs of Arduino and build a cheaper one. Some names you can search
    for boards of this nature include the following:


    - Roboduino

    - Freedino

    - Seeeduino (yes, with three e’s)


    More interestingly, some Arduino-compatible designs are intended to extend or
    improve the Arduino in some way. New variants are appearing all the time, and
    far too many exist to mention them all. However, the following are some of the
    more interesting and popular variants:


    - Chipkit, a high-speed variant based on a PIC processor, but which is fairly
    compatible with Arduino

    - Femtodino, a very small Arduino

    - Ruggedduino, with is an Arduino board with built-in I/O protection

    - Teensy, a low-cost nano-type device


    # Conclusion


    Now that you have explored the Arduino hardware a little, it’s time to set up
    your Arduino software.


    # 2 Getting Started


    Having introduced the Arduino, and learnt a little about what it is that we are
    programming, it is time to learn how install the software that we will need on
    our computer and to start working on some code.


    # Powering Up


    When you buy an Arduino board, it is usually pre-installed with a sample Blink
    program that will make the little built-in light-emitting diode (LED) flash.


    The LED marked L is wired up to one of the digital output sockets on the board.
    It is connected to digital pin 13. This limits pin 13 to being used as an output.
    However, the LED uses only a small amount of current, so you can still connect
    other things to connector.


    All you need to get your Arduino and running is supply with some power. The easiest
    way to do this is to plug it into the USB port on your computer. You will need
    a type-A-to-type-B USB lead. This is the same type of lead that is normally used
    to connect a computer to a printer.


    If everything is working OK, the LED should blink. New Arduino boards come with
    this Blink sketch already installed so that you can verify that the board works.


    # Installing the Software


    To be able to install new sketches onto your Arduino board, you need to do more
    than supply power to it over the USB. You need to install the Arduino software
    (Figure 2-1).


    Full and comprehensive instructions for installing this software on Windows, Linux,
    and Mac computers can be found at the Arduino website (www.arduino.cc).


    Once you have successfully installed the Arduino software and, depending on your
    platform, USB drivers, you should now be able to upload a program to the Arduino
    board.


    ![](img/6426909fcee15359dcfa665c8698110f_32_0.png)


    Figure 2-1 The Arduino application


    # Uploading Your First Sketch


    The blinking LED is the Arduino equivalent to the “Hello World” program used in
    other languages as the traditional first program to run when learning a new language.
    Let’s test out the environment by installing this program on your Arduino board
    and then modifying it.


    When you start the Arduino application on your computer, it opens with an empty
    sketch. Fortunately, the application ships with a wide range of useful examples.
    So from the File menu, open the Blink example as shown in Figure 2-2.


    ![](img/6426909fcee15359dcfa665c8698110f_33_0.png)


    You now need to transfer or upload sketch to your Arduino board. You should plug
    your Arduino board into your computer using the USB lead. You should see the green
    "On" LED on the Arduino light light up. The Arduino board will probably already
    be flashing, as the boards are generally shipped with the Blink sketch already
    installed. But let''s install it again and then modify it.


    When you plug the board in, if you are using a Mac, you may get the message, "A
    new network interface has been detected." Just click Cancel; your Mac is confused
    and the Uno is a USB modem.


    Before you can upload a sketch, you must tell the Arduino application board you
    are using and which serial port you are connected to. Figures 2-3 and 2-4 show
    how you do this from the Tools menu.


    # Figure 2-3 Selecting the board type


    ![](img/6426909fcee15359dcfa665c8698110f_34_0.png)


    # Figure 2-4 Selecting the serial port (in Windows)


    On a Windows machine, the serial port is always COM3. On Macs and Linux machines,
    you will see a much longer list of serial devices (see Figure 2-5). The device
    will normally


    ![](img/6426909fcee15359dcfa665c8698110f_34_1.png)


    be the top selection in the list, with a name similar to /dev/tty.usbmododem621.


    Now click on the Upload icon in the toolbar. This is shown highlighted in Figure
    2-6.


    After you click the button, there is a short pause while the sketch is compiled
    and then the transfer begins. If it is working, there will be some frequent blinking
    of LEDs at the bottom of the Arduino application window and the sketch is transferred,
    after which you will see the message “Done Uploading” at the bottom of the Arduino
    window and a further message similar to the sketch size: 1018 bytes (a 14336 byte
    maximum).


    ![](img/6426909fcee15359dcfa665c8698110f_35_0.png)


    # Figure 2-5 Selecting the serial port (on a Mac)


    Once uploaded, the board automatically starts running the sketch and you will
    see the LED start to blink.


    If this did not work, then check your serial and board type settings. Now let''s
    modify the sketch to make the LED faster. To do this, alter the two places in
    the sketch where there is delay 1,000 milliseconds so that the delay is 500 milliseconds.
    Figure 2-7 shows the sketch with the changes highlighted.


    #2-6 Uploading the sketch


    Click on the Upload button again. Then, once the sketch has uploaded, you should
    see your LED blink twice as fast as it did before. Congratulations, you are now
    ready to start programming. First, though, let''s take a mini-tour of the Arduino
    application.


    ![](img/6426909fcee15359dcfa665c8698110f_36_0.png)


    ![](img/6426909fcee15359dcfa665c8698110f_36_1.png)


    # The Arduino Application


    Sketches in Arduino are like documents in a word processor. You can open them
    and copy parts from one to another. So see options to Open, Save, and Save As
    in the File menu. You will not normally use Open because the Arduino application
    has the concept of a Sketchbook where all your sketches are kept. You will gain
    access to Sketchbook from the File menu. As you have just installed the Arduino
    application for the first time, your Sketchbook will be empty until you create
    some sketches.


    As you have seen, the Arduino application comes with a selection of example sketches
    that can be very useful. Having modified the Blink example sketch, if you try
    and save it, you get a message that says,"Some files are marked read-only so you
    will need to save this sketch in a different location."


    Try now. Accept the default location, but change the filename to MyBlink, as shown
    in Figure 2-8.


    Now if you go to the File menu and click on Sketches, you will see MyBlink as
    one of the sketches. If you look at your computer''s file system, on a PC, you
    will find that the sketch has been written into My Documents\Arduino, and on Mac
    or Linux, they are in Documents/Arduino.


    All of the sketches used in this book can be downloaded as a zip file (Programming_Arduino.zip)
    from [www.arduinoobook.com](). I suggest that now is the time to download this
    file and unzip it into the Arduino folder that contains the sketches. In other
    words, when you have unzipped the folder, there should be two folders in your
    Arduino folder: one for the newly saved MyBlink and one called Programming Arduino
    (see [Figure 2-9]()). The Programming Arduino folder will contain all the sketches,
    numbered according to chapter, so that sketch 03-01, for example, is sketch 1
    of [Chapter 3]().

