    \nint interruptPin = 2;\nint ledPin = 13;\nint period = 500;\n\nvoid setup() {\n\
    \  pinMode(ledPin, OUTPUT);\n  pinMode(interruptPin, INPUT);\n  digitalWrite(interruptPin,\
    \ HIGH); // 上拉\n  attachInterrupt(0, FALLING);\n}\n\nvoid loop() {\n  digitalWrite(ledPin,\
