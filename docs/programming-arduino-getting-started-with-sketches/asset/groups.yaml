    # 模拟输入


    标记为 Analog In0 到 A5 的六个引脚可以测量连接到它们上的电压，以便该值可以在程序设计（sketch）中使用。请注意，它们测量的是电压而不是电流。由于具有非常大的内电阻，只有极微小的电流会流入并流地。也就是说，具有大内电阻的引脚只允许极微小的电流流入。


    尽管这些输入被标记为模拟输入，并且默认是模拟输入，但这些连接也可以作为数字输入或输出。


    # 数字连接


    我们现在切换到顶部连接器并从图 1-1 的右侧开始。在这里，我们找到了标记为 Digital 0 到 13 的引脚。这些引脚可以作为输入或输出。当用作输出时，它们的行为就像在本节之前讨论的电源电压，不同的是这些电压都是
    5V，并且可以从你的程序中开启或关闭。因此，如果你在程序中开启了它们，它们将处于 5V；如果你关闭了它们，它们将处于 0V。在使用电源连接器时，必须小心不要超过它们的最大电流能力。这些连接前两个（0
    和 1）也被标记为 RX 和 TX，用于接收和传输。这些连接预留用于通信，并间接作为你到电脑 USB 链路的接收和传输连接。


    这些数字连接在 5V 下可以提供 40 mA（毫安）。这足以点亮一个标准 LED，但不足以直接驱动电动机。


    # 微控制器


    继续我们对 Arduino 板的遍历，微控制器芯片本身是一个带有 28 个引脚的黑色矩形设备。它安装在一个双列直插（DIL）插座中，以便方便更换。Arduino
    Uno 板上使用的 28 脚脚微控制器芯片是 ATMega328。图 1-2 是一个显示该设备主要功能的框图。


    该设备的核心——或者更恰切说是大脑——是中央处理器（CPU）。它控制设备内部发生的一切。它获取存储在闪存中的程序指令并执行它们。这可能涉及从工作内存（RAM）获取数据、对其进行修改，然后放回。或者，它可能意味着将一个数字输出从
    0V 变为 5V。


    EEPROM 内存与闪存有点像，因为是非易失性存储。这意味着，你可以关闭设备，它不会忘记 EEPROM 中的内容。而闪存旨在存储程序指令（来自程序设计），EEPROM
    则用于存储你不希望在重置或断电时丢失的数据。


    ![](img/6426909fcee15359dcfa665c8698110f_23_0.png)


    图 1-2 ATmega328 框图


    # 其他组件


    微控制器上方是一个小的银色矩形组件。它每秒跳动 1600 万次，在每次跳动中，微控制器执行一次操作——加法、减法或其他数学运算。


    晶振的右侧是复位开关（Reset）。点击此开关会向微控制器的 Reset 引脚发送逻辑脉冲，导致微控制器重新启动程序并清除其内存。请注意，存储在设备上的任何程序都将被保留，因为它们存储在非易失性闪存中——即即使设备没有电源也能记忆内容的内存。


    复位按钮的右侧是串口编程连接器。它提供了在不用 USB 端口的情况下编程 Arduino 的另一种方法。由于我们确实有 USB 连接和方便使用的软件，我们不会利用这一功能。


    在板的左上角，USB 接口芯片旁边。该芯片将 USB 标准使用的信号电平转换为 Arduino 板可以直接直接使用的电平。


    # Arduino 的起源


    Arduino 最初被开发为辅助学生的教学工具。随后（在 2005 年）由 Massimo Banzi 和 David Cuartelles 进行了商业化开发。从那时起由于其易用性和耐用性，它在创客、学生和艺术家中取得了巨大的成功。


    成功的另一个关键因素是，所有 Arduino 的设计都根据知识产权许可协议免费提供。这使得许多成本更低的替代板出现出现。只有 Arduino 的名称受保护，因此克隆版通常带有“dunino”名称，例如
    Boardardino、Seedduino 和 Freeduin。然而，在意大利制造的官方板看起来仍然制作非常精良。许多大型零售商只销售官方板，这些板包装良好且质量高。


    Arduino 成功的另一个原因是它不仅限于微控制器板。有大量的 Arduino 兼容扩展板（shield boards）可以直接插在 Arduino 板的顶部。由于几乎每种可以想象到的应用都有扩展板，你通常可以避免使用电烙铁，而是通过插入可以堆叠在一起的扩展板来完成。以下只是最受欢迎的一些扩展板：


    - 以太网扩展：让 Arduino 具备 Web 服务器功能

    - 电机扩展：驱动电动机

    - USB 主机扩展：允许控制 USB 设备

    - 继电器扩展


    图 3 显示带有以太网扩展的 Arduino Uno


    ![](img/6426909fcee15359dcfa665c8698110f_24.png)


    图 1-3 带有以太网扩展的 Arduino Uno


