    # 6

    Input and Output


    **The Arduino is about physical computing, and that means attaching electronics
    to the Arduino board. So you need to understand how to use the various options
    for your connection pins.


    Outputs can be digital, which just means switched between being at 0V or 5V, or
    analog, allows you to set the voltage to any voltage between 0V and 5V—although
    it’s not quite as simple as that, as we shall see.


    Likewise, inputs can be digital (for example, determining whether a button pressed
    or not) or analog (as from a light sensor).


    In a book that is essentially software rather than hardware, we are going to try
    and avoid dragged into too much discussion of electronics. However, it will help
    you to understand what is happening in this chapter if you can find yourself a
    multimeter and a short length of solid core wire.


    # Digital Outputs


    In earlier chapters, you have made use of the LED attached to digital pin 13 of
    the Arduino board. For example, in Chapter 5, you used it as a Morse code signaler.
    The Arduino board has a whole load of digital pins available.


    Let’s experiment with one of the other pins on the Arduino. You will use digital
    pin 4, and to see what is going on, you will fix some wire to your multimeter
    and attach them to your Arduino. Figure 6-1 shows the arrangement. If your multimeter
    has crocodile clips, strip the insulation off the ends of some short lengths of
    solid core wire and attach the clip to one end, fitting the other end into the
    Arduino socket. If your multimeter does not have crocodile clips then wrap one
    of the stripped wire ends around the probe.'
