    # Generating Tones\n\nThe tone function allows you to generate a square-wave signal\
    \ (see Figure 7-3) on one of the digital output pins. The most common reason to\
    \ do this is to generate an audible tone using a loudspeaker or buzzer.\n\nThe\
    \ function takes either two or three arguments. The first argument is always the\
    \ pin number on which the tone is to be generated, the second argument is the\
    \ frequency of the tone in hertz (Hz), and the optional final argument is the\
