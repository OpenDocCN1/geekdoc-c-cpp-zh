    \n# Feeding Shift Registers\n\nSometimes the Arduino Uno just't have enough pins.\
    \ When driving a large number of LEDs, for example, a common technique is to use\
    \ a shift register chip. This chip reads data one bit at a time, and then when\
    \ it has enough, it latches all those bits onto a set of outputs (one per bit).\n\
    \nTo help you use this technique, there is a handy function called shift-Out.\
    \ This function takes four arguments:\n\n+   * The number of the pin on which\
    \ the bit will be sent appear.\n* The number of the pin to be used as a clock\
    \ pin. This toggles every time a bit is sent.\n* A flag to determine whether the\
    \ bits will be sent starting with the least significant or the most significant.\
    \ This should be one of the constants MSBFIRST or LSBFIRST.\n* The byte of data\
    \ to be sent.\n\n# Interrupts\n\nOne of the things that tend to frustrate programmers\
    \ used to \"programming in the large\" is that the Arduino can do only one thing\
    \ at a time. If you like to have lots of threads of execution all running at the\
    \ same time in your programs, then you are out of luck. Although a few people\
    \ have developed projects that can execute multiple threads in this, generally\
    \ this capability is unnecessary for the type of uses that an Arduino is normally\
    \ put to. The closest Arduino gets to such execution is the use of interrupts.\n\
    \nTwo of the pins on the Arduino (D2 and D3) can have interrupts attached to them.\
    \ That is, these pins act as inputs, if the pins receive a signal in a specified\
    \ way, the Arduino's processor will suspend whatever it was doing and run a function\
    \ attached to that interrupt.\n\nSketch 7-04 blinks an LED, but then changes the\
    \ blink period when an interrupt is received. You can simulate an interrupt by\
    \ connecting your wire between pin D2 and GND and using the internal pull-up resistor\
    \ to keep the interrupt high most of the time."
