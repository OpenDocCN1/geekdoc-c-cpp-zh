    \ delay。最佳的解决方案取决于具体的应用。\n\n## while\n\n在 C 中循环的另一种方法是使用 while 命令代替 for 命令。\n\
    你可以像下面这样使用 while 命令来实现与之前的 for 相同的功能：\n\n```cpp\ni = 0;\nwhile (i < 20)\n{\n \
    \ digital_write(ledPin, HIGH);\n  delay(delayPeriod);\n  digital_write(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  i++;\n}\n```\n\nwhile 之后括号中的表达式必须为真才能保持循环。当它不再为真时，程序将继续运行最后一个大括号之后的命令。\n\
    \n## #define 指令\n\n对于在程序运行期间不会改变的常量值引脚赋值，有一种使用变量的替代方案。你可以使用名为 #define 的命令，它允许你将一个值与一个名称关联。只要该名称出现在你的程序中任何地方，该值会在程序编译之前被替换。\n\
    \n例如，你可以这样为 LED 定义引脚赋值：\n#define ledPin 13\n\n注意，#define 指令在名称和值之间不使用 \"=\"。末尾甚至不需要\
    \ \";\"。这是因为它实际上不是 C 语言本身的一部分，而是被称为预编译指令，它在编译之前运行。\n\n在作者看来，这种方法比使用变量更易于阅读，但它的优势是你不需要使用任何内存来存储它。如果内存非常紧张，这是一个需要考虑的问题。\n\
    \n## 结论\n\n这一章已经让你入门了 C 语言。你可以通过各种有趣的方式让 LED 闪烁，并使用 Serial.println 函数让 Arduino\
    \ 通过 USB 向你返回结果。你还学会如何使用 if 和 for 命令来控制命令执行的顺序，并学习了一些算术运算。\n\n在下一章中，你将更深入地研究函数。该章还将介绍在本章中使用的\
    \ int 类型以外的其他变量类型。\n\n## 4 函数\n\n本章主要关注你可以自己编写的函数，而不是已经为你定义的 digitalWrite 和 delay\
    \ 等内置函数。\n\n你需要能够编写自己的函数的原因是，程序开始变得有点复杂，这时你的 setup 和 loop 函数将不断增长，直到变得冗长且复杂，难以看出它们是如何工作的。\n\
    \n任何类型的软件开发中最大的问题都是管理复杂性。最好的程序员编写的软件易于观察和理解，并且几乎不需要解释。\n\n函数是创建易于理解程序的关键工具，这些程序可以在不遇到困难或不会导致整个部分陷入一团糟的情况下进行修改。\n\
    \n## 什么是函数？\n\n函数有点就像程序中的程序程序。你可以用它来封装你想要做的某些小操作。你定义的函数可以从程序的任何地方被调用，并包含它自己的变量和命令列表。当命令执行完毕，执行将返回到调用函数的代码中该位置的后续一点。\n\
    \n举个例子，闪烁光二极管（LED）的代码是应该放入函数中的代码典型示例。所以，让我们修改基础的“闪烁 20 次”程序，使用我们创建一个名为 flash 的函数：\n\
    \n```cpp\n// sketch 4-01\nint ledPin = 13;\nint delayPeriod = 250;\n\nvoid setup()\
    \ {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  for (int i = 0; i < 20;\
    \ i++) {\n    flash();\n  }\n  delay(3000);\n}\n\nvoid flash() {\n  digital_write(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digital_write(ledPin, LOW);\n  delay(delayPeriod);\n\
    }\n```\n\n所以，我们在这里所做的实际上是将闪烁 LED 的四行代码从 for 循环中间移动到它们自己的名为 flash 的函数中。现在你可以通过编写\
    \ flash() 调用这个新函数，在任何你喜欢的时候让 LED 闪烁。注意函数后的后的括号。这表示该函数不接受任何参数。它使用的延迟值由你之前使用的 delayPeriod\
    \ 设置。\n\n## 参数\n\n在将你的程序划分为函数时，思考函数可以提供什么服务通常是值得的。在 flash 的情况下，这显而易见。但这一次，让我们给这个函数加上参数，告诉它闪烁几次以及闪烁持续多久。阅读下面的代码，我将更详细解释参数如何工作。\n\
    \n```cpp\n// sketch 4-02\nint ledPin = 13;\nint delayPeriod = 250;\n\nvoid setup()\
    \ {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  flash(20, delayPeriod);\n\
    \  delay(3000);\n}\n\nvoid flash(int numFashes, int d) {\n  for (int i = 0; i\
    \ < numFashes; i++) {\n    digital_write(ledPin, HIGH);\n    delay(d);\n    digital_write(ledPin,\
    \ LOW);\n    delay(d);\n  }\n}\n```\n\n## 全局、局部和静态变量\n\n如前所述，函数的参数只能在那个函数内部使用。在函数内部使用相同的变量名\
    \ x 作为参数时，当你在函数内部引用 x 时，你就无法使用全局变量，\"本地\"版本的 x 具有优先级。参数 x 被认为遮蔽（shadow）了同名的全局变量。这在调试项目时可能会导致一些困惑。\n\
    \n除了定义参数，你还可以定义不是参数但仅供函数内部使用的变量。这些被称为局部变量。例如：\n\n```cpp\nvoid indicate(int x)\n\
    {\n    int timesToFlash = x * 2;\n    flash(timesToFlash, 10);\n}\n```\n\n局部变量\
    \ timesToFlash 只在函数运行时存在。一旦函数执行完最后一条命令，它就会消失。这意味着局部变量在定义它的函数之外的程序任何地方都无法访问。\n\n\
    所以，例如下面的示例将引起错误：\n\n```cpp\nvoid indicate(int x)\n{\n    int timesToFlash = x\
    \ * 2;\n    flash(timesToFlash, 10);\n}\n\ntimesToFlash = 15;\n```\n\n另一方面，假设你这样写：\n\
    \n```cpp\nint x;\nvoid indicate(int x)\n{\n    flash(x, 10);\n}\nx = 15;\n```\n\
    \n这段代码不会导致编译错误。然而，你需要小心，因为你现在有两个名为 x 的变量，它们各可以有不同的值。你在第一行声明的那个被称为全局变量，因为你可以在程序的任何你需要的地方使用，包括任何函数内部。\n\
    \n"
