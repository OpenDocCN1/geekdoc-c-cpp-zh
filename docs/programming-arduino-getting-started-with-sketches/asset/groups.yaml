    # EEPROM'
- md: "\nThe ATMega328 at the heart of an Arduino Uno has a kilobyte of electrically\
    \ erasable read-only memory (EEPROM). EEPROM is designed to remember its contents\
    \ for many years. Despite its name, it is not really read-only. You can write\
    \ to it.\n\nThe Arduino commands for reading and writing to EEPROM are just as\
    \ awkward to use as ones for using PROGMEM. You have to read and write to and\
    \ from EEPROM one byte at a time.\n\nThe example of sketch 8-02 allows you to\
    \ enter a single-digit letter code from the Serial Monitor. The sketch remembers\
    \ the digit and repeatedly writes it out on the Serial Monitor.\n\n```cpp\n//\
    \ sketch 8-02\n#include <EEPROM.h>\n\nint addr = 0;\nchar ch;\nvoid setup() {\n\
    \  Serial.begin(9600);\n  ch = EEPROM.read(addr);\n}\n\nvoid loop() {\n  if (Serial.available()\
    \ > 0) {\n    ch = Serial.read();\n    EEPROM.write(0, ch);\n    Serial.println(ch);\n\
    \  }\n}  Serial.println(ch);\n  delay(1000);\n}\n```\n\nTo try this sketch, open\
    \ the Serial Monitor and enter a new character. When you unplug the Arduino and\
    \ plug it back in. When you reopen the Serial Monitor, you will see that the letter\
    \ has remembered.\n\nThe function EEPROM.write takes two arguments. The first\
    \ is the address, which is the memory location in EEPROM and should be between\
    \ 0 and 1023. The second argument is the data to write at that location. This\
    \ must be a single byte. A character is represented as eight bits, so this is\
    \ fine, but you cannot directly store a 16-bit int.\n\n# Storing an int in EEPROM\n\
    \nTo store a two-byte int in locations 0 and 1 of the EEPROM, you would have to\
    \ do this:\n\n```cpp\nint x = 1234;\nEEPROM.write(0, highByte(x));\nEEPROM.write(1,\
    \ lowByte(x));\n```\n\nThe functions highByte and lowByte are useful for separating\
    \ an int into two bytes.\nFigure 8-1 shows how this int is actually stored in\
    \ the EEPROM.\n\n| Address | High Byte | Low Byte |\n|---|---|---|\n| 0 | 1234\
    \ decimal = 0000 0100 | 1101 0010 |\n| 1 | 1101 0010 | |\n| 2 | | |\n| 3 | | |\n\
    \nFigure 8-1 Storing a 16-bit integer in EEPROM\n\nTo read the int back out of\
    \ EEPROM, you need to read the two bytes from the EEPROM and reconstruct the int,\
    \ as follows:\n\n```cpp\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\n\
    int x = (high << 8) + low;\n```\n\nThe << operator is a bit shift operator that\
    \ moves the high bytes to the top of the int and then adds in the low byte.\n\n\
    # Storing a float in EEPROM (Unions)\n\nStoring a float in EEPROM is a little\
    \ more tricky. To do this, you can use a feature of C unions. These data structures\
    \ are interesting in that they can be thought of as a way to make the same area\
    \ of memory accessible to more than one variable. What is more, these variables\
    \ are allowed to be of different types as long as they are the same size in bytes.\n\
    \nThe following union definition allows both a float and an int to refer to the\
    \ same two bytes of memory:\n\n```cpp\nunion data {\n  float f;\n  int i;\n} convert;\n\
    ```\n\nYou can then put a float into the union as follows:\n```cpp\nfloat f =\
    \ 1.23;\nconvert.f = f;\n```\n\nThen you can separate an integer into two bytes\
    \ for storage in EEPROM as follows:\n```cpp\nEEPROM.write(0, highByte(convert.i));\n\
    EEPROM.write(1, lowByte(convert.i));\n```\n\nReading the float out again requires\
    \ you to do the reverse. First you assemble two bytes into a single int, then\
    \ you put the int into the union and pull it out again as a float.\n\n```cpp\n\
    byte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\nconvert.i = (high <<\
    \ 8) + low;\nfloat f = convert.f;\n```\n\n# Storing a String in EEPROM\n\nWriting\
    \ and reading strings into the EEPROM are straightforward; just have to write\
    \ each character at a time, as in the following example:\n\n```cpp\nchar *test\
    \ = \"Hello\";\nint i = 0;\nwhile (test[i] != '\\0') {\n  EEPROM.write(i, test[i]);\n\
    \  i++;\n}\n```\n\nTo read the string back into a character array, you can do\
    \ something like:\n\n```cpp\nchar test[10];\nint i = 0;\nchar ch;\nch = EEPROM.read(i);\n\
    while (ch != '\\0' && i < 10) {\n  test[i] = ch;\n  i++;\n}\n```\n\n# Clearing\
    \ the Contents of EEPROM\n\nWhen writing to EEPROM, remember that even uploading\
    \ a new sketch will not clear EEPROM, so you may have leftover values there from\
    \ a previous project. Sketch 8-03 resets all the contents of EEPROM to zeros:\n\
    \n```cpp\n// sketch 8-03\n#include <EEPROM.h>\n\nvoid setup() {\n  Serial.begin(9600);\n\
    \  Serial.println(\"Clearing EEPROM\");\n  for (int i = 0; i < 1023; i++) {\n\
    \    EEPROM.write(i, 0);\n  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\nvoid\
    \ loop() {\n```\n\nAlso be aware that you can write to EEPROM only about 100,000\
    \ times before it becomes unreliable. So only write a value back to EEPROM when\
    \ you really need to. EEPROM is also slow, taking about 3 milliseconds to write\
    \ a byte.\n\n# Compression\n\nWhen saving data to EEPROM or using PROGMEM, you\
    \ will sometimes find that you have more to save than you have room for. When\
    \ this happens, it is worth finding the most efficient way of representing the\
    \ data.\n\n# Range Compression\n\nYou may have a value for which you need an int\
    \ or a float that are both 16-bit. For example, to represent a temperature in\
    \ degrees Celsius, you might use a float such as 20.25. When you are storing that\
    \ into EEPROM, it would be so much easier if you could fit it into a single byte,\
    \ and you could store as much as you used a float.\n\nOne way that you can do\
    \ this is to change the data before you store it. Remember that a byte allows\
    \ you to store a positive number between 0 and 255. So if you only care about\
    \ the temperature to the nearest degree, then you could simply convert the float\
    \ to an int and discard the part after the decimal point. The following example\
    \ shows how to do this:\n\n```cpp\nint tempInt = (int)tempFloat;\n```\n\nThe variable\
    \ tempFloat contains the floating point value. The (int) command is called a type\
    \ cast and is used to convert a variable from one type to another compatible type.\
    \ In this case, the type cast converts the float (for example) 20.25 to an int\
    \ that will simply truncate the number to 20.\n\nIf you know the highest temperature\
    \ you care about is 60 degrees Celsius and that the lowest is 0 degrees Celsius,\
    \ you could multiply every temperature by 4 before converting it to a byte and\
    \ saving. When you read the data back from EEPROM, you can divide by 4 to get\
    \ a value that has a precision of 0.25 of a degree.\n\nThe following code example\
    \ (sketch 8-04) saves such a temperature into EEPROM, then reads back and displays\
    \ it in the Serial Monitor as:\n\n```cpp\n// sketch 8-04\n\n#include <EEPROM.h>\n\
    \nvoid setup() {\n  float tempFloat = 20.7575;\n  byte tempByte = (int)(tempFloat\
    \ * 4);\n  EEPROM.write(0, tempByte);\n\n  byte tempByte2 = EEPROM.read(0);\n\
    \  float temp2 = (float)tempByte2 / 4;\n  Serial.begin(9600);\n  Serial.println(\"\
    \\n\\n\\n\");\n  Serial.println(temp2);\n}\n\nvoid loop() {\n```\n\nThere are\
    \ other means of compressing data. For instance, if you are taking readings that\
    \ change slowly—again, changes in temperature are a good example of this—then\
    \ you can record the first temperature at full resolution and then just record\
    \ the changes in temperature from the previous reading. This change will generally\
    \ be small and occupy fewer bytes.\n\n# Conclusion\n\nYou now know a little about\
    \ how to make your data hang around after the power has gone off. In the next\
    \ chapter, you will look at LCD displays.\n\n# 9\nLCD Displays\n\nIn this chapter,\
    \ you look at how to write software to control LCD displays. Figure 9-1 shows\
    \ the kind of LCD display used.\n\nThis is a book about software, not hardware,\
    \ but in this chapter, we will have to explain a little about how the electronics\
    \ of these displays work so that you understand how to drive them.\n\nThe LCD\
    \ module that we use is a prebuilt Arduino shield that can just be plugged on\
    \ top of an Arduino board. In addition to its display, it also has some buttons.\
    \ There are a number of different shields, but nearly all of them use the same\
    \ LCD controller chip (the HD44780)\n\nThe shield comes assembled, so no soldering\
    \ is required; you just plug it on top of your Arduino board (see Figure 9-2).\n\
    \nThe LCD shield uses seven of the Arduino pins to control the LCD display and\
    \ one analog pin for the buttons. So we cannot use these Arduino pins for any\
    \ other purpose.\n\n![](img/6426909fcee15359dcfa665c8698110f_129_0.png)\n\n**Figure\
    \ 9-1** An Alphanumeric LCD shield\n"
  mdcn: "\nArduino Uno 核心的 ATMega328 具有千字节的电擦除只读存储器（EEPROM）。EEPROM 设计用于多年保存其内容。尽管顾如其名，它并不是真正的只读的。你可以向它写入数据。\n\
    \n读写 EEPROM 的 Arduino 命令与使用 PROGMEM 的命令一样难用。你必须一次一个字节地对 EEPROM 进行读写。\n\n示例程序 8-02\
    \ 允许你从串口监视器（Serial Monitor）输入单数字字母代码。该程序会记住该数字并反复在串口监视器上打印。\n\n```cpp\n// sketch\
    \ 8-02\n#include <EEPROM.h>\n\nint addr = 0;\nchar ch;\nvoid setup() {\n  Serial.begin(9600);\n\
    \  ch = EEPROM.read(addr);\n}\n\nvoid loop() {\n  if (Serial.available() > 0)\
    \ {\n    ch = Serial.read();\n    EEPROM.write(0, ch);\n    Serial.println(ch);\n\
    \  }  Serial.println(ch);\n  delay(1000);\n}\n```\n\n要尝试此程序，打开串口监视器并输入一个新字符。当你拔掉\
    \ Arduino 并重新插入时，再次打开串口监视器，你会发现该字母被记住了。\n\n函数 EEPROM.write 接收两个参数。第一个是地址，即 EEPROM\
    \ 中的内存位置，范围应在 0 到 1023 之间。第二个参数是要写入该位置的数据。这必须是一个单字节。一个字符表示为八位，所以没问题，但你不能直接存储一个\
    \ 16 位的 `int`。\n\n# 在 EEPROM 中存储 int\n\n要在 EEPROM 的位置 0 和 1 存储一个双字节的 `int`，你需要这样操作：\n\
    \n```cpp\nint x = 1234;\nEEPROM.write(0, highByte(x));\nEEPROM.write(1, lowByte(x));\n\
    ```\n\n`highByte` 和 `lowByte` 函数对于将一个 `int` 分分为两个字节非常有用。\n图 8-1 显示了这个 `int` 实际上是如何存储在\
    \ EEPROM 中的。\n\n| 地址 | 高字节 | 低字节 |\n|---|---|---|\n| 0 | 1234 十进制 = 0000 0100\
    \ | 1101 0010 |\n| 1 | 1101 0010 | |\n| 2 | | |\n| 3 | | |\n\n图 8-1 在 EEPROM 中存储\
    \ 16 位整数\n\n要从 EEPROM 读回该 `int`，你需要从 EEPROM 读取两个字节并重构该 `int`，如下：\n\n```cpp\nbyte\
    \ high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\nint x = (high << 8) + low;\n\
    ```\n\n`<<` 运算符是一个位移运算符，它将高字节移动到 `int` 的顶部，然后加上低字节。\n\n# 在 EEPROM 中存储 float（联合体）\n\
    \n在 EEPROM 中存储 `float` 稍微复杂一点。为了做到，你可以使用 C 语言联合体（union）的特性。这些数据结构的有趣之处在于，它们可以被视为让同一内存区域被多个变量访问的方式。此外，只要这些变量的字节大小相同，就允许它们具有不同的类型。\n\
    \n下面的联合体定义允许 `float` 和 `int` 同时指向相同的两个字节内存：\n\n```cpp\nunion data {\n  float f;\n\
    \  int i;\n} convert;\n```\n\n然后你可以按照如下方式将 `float` 放入联合体：\n```cpp\nfloat f = 1.23;\n\
    convert.f = f;\n```\n\n然后你可以按照如下方式将整数分为两个字节存储在 EEPROM 中：\n```cpp\nEEPROM.write(0,\
    \ highByte(convert.i));\nEEPROM.write(1, lowByte(convert.i));\n```\n\n再次读取 `float`\
    \ 需要执行相反操作。首先将两个字节组合成一个 `int`，然后将其放入联合体并再次作为 `float` 提取。\n\n```cpp\nbyte high\
    \ = EEPROM.read(0);\nbyte low = EEPROM.read(1);\nconvert.i = (high << 8) + low;\n\
    float f = convert.f;\n```\n\n# 在 EEPROM 中存储 String\n\n向 EEPROM 读写字符串是简单的，只需每次写入一个字符，如下所示：\n\
    \n```cpp\nchar *test = \"Hello\";\nint i = 0;\nwhile (test[i] != '\\0') {\n  EEPROM.write(i,\
    \ test[i]);\n  i++;\n}\n```\n\n将字符串读回字符数组可以采取如下操作：\n\n```cpp\nchar test[10];\n\
    int i = 0;\nchar ch;\nch = EEPROM.read(i);\nwhile (ch != '\\0' && i < 10) {\n\
    \  test[i] = ch;\n  i++;\n}\n```\n\n# 清除 EEPROM 内容\n\n写入 EEPROM 时，请记住即使上传新程序也不会清除\
    \ EEPROM，所以可能会有之前项目留的值。程序 8-03 重置 EEPROM 的所有内容：\n\n```cpp\n// sketch 8-03\n#include\
    \ <EEPROM.h>\n\nvoid setup() {\n  Serial.begin(9600);\n  Serial.println(\"Clearing\
    \ EEPROM\");\n  for (int i = 0; i < 1023; i++) {\n    EEPROM.write(i, 0);\n  }\n\
    \  Serial.println(\"EEPROM Cleared\");\n}\n\nvoid loop() {\n```\n\n此外要注意，向 EEPROM\
    \ 只能写入 100,000 次左右就会变得不可靠。因此只有在真正需要时才写回值。EEPROM 写入一个字节大约需要 3 毫秒。\n\n# 压缩\n\n在保存数据到\
    \ EEPROM 或使用 PROGMEM 时，有时你会发现需要保存的数据比空间多。在这种情况下，值得寻找表示数据的有效方法。\n\n# 范围压缩\n\n你可能有一个需要\
    \ `int` 或 `float` 的值，它们都是 16 位的。例如，为了表示摄氏温度，你可能会使用像 20.25 这样的 `float`。当你将其存储 EEPROM\
    \ 时，如果能放入一个单字节，就可以存储像 `float` 一样多的内容。\n\n实现这一点的方法是在存储之前更改数据。记住 `byte` 允许你存储 0\
    \ 到 255 之间的正数。如果你只关心接近整数的温度，那么可以将 `float` 转换为 `int` 并丢弃小数部分。下面的示例显示了如何操作：\n\n\
    ```cpp\nint tempInt = (int)tempFloat;\n```\n\n变量 `tempFloat` 包含浮点值。`(int)` 命令被称为类型转换，用于将变量从一种类型转换为另一种兼容类型。在这种情况下，类型转换将\
    \ `float`（例如）20.25 转换为 20 的 `int`。\n\n如果你关心的最高温度是 60 摄氏度，最低是 0 摄氏度，你可以在转换为字节保存之前将温度乘以\
    \ 4。当你从 EEPROM 读回数据时，可以除以 4 以得到精度为 0.25 度的值。\n\n下面的代码示例（程序 8-04）将此类温度存入 EEPROM，然后读回并在串口监视器显示：\n\
    \n```cpp\n// sketch 8-04\n\n#include <EEPROM.h>\n\nvoid setup() {\n  float tempFloat\
    \ = 20.7575;\n  byte tempByte = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\
    \n  byte tempByte2 = EEPROM.read(0);\n  float temp2 = (float)tempByte2 / 4;\n\
    \  Serial.begin(9600);\n  Serial.println(\"\\n\\n\\n\");\n  Serial.println(temp2);\n\
    }\n\nvoid loop() {\n```\n\n还有其他压缩数据的方法。例如，如果你获取的是变化缓慢的读数（再次，温度变化是一个很好的例子），那么你可以以全分辨率记录第一个温度，然后只记录与上一次读取相比温度变化。这种变化通常很小，占用的字节更少。\n\
    \n# 总结\n\n你现在了解了一些如何在掉电后让你的数据留下的知识。在下一章中，你将查看 LCD 显示。\n\n# 9\nLCD 显示\n\n在本章中，你将学习如何编写软件控制\
    \ LCD 显示。图 9-1 显示了所使用的 LCD 显示。\n\n这是一本关于软件而不是硬件的书，但在本章中，我们必须解释一下这些显示器的电子工作原理，以便你理解如何驱动它们。\n\
    \n我们使用的 LCD 模块是一个预制的 Arduino 扩展板（shield），可以直接插在 Arduino 板顶部。除了显示器外，它还有一些按钮。有许多不同的扩展板，但几乎所有的都使用相同的\
    \ LCD 控制器芯片（HD44780）。\n\n扩展板是组装好的，因此不需要焊接；你只需将其插在 Arduino 板顶部即可（见图 9-2）。\n\n![](img/6426909fcee15359dcfa665c8698110f_129_0.png)\n\
    \n**Figure 9-1** 字符型 LCD 扩展板\n\nLCD 扩展板使用了 Arduino 的七个引脚控制 LCD 显示，并使用一个模拟引脚用于按钮。因此我们不能将这些\
    \ Arduino 引脚用于任何其他用途。\n"
