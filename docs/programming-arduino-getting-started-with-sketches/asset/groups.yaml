  - "[PAGE 96]\n\n![](img/6426909fcee15359dcfa665c8698110f_96_0.png)\n\n# Digital\
    \ Inputs\n\nThe most common use of digital inputs is to detect when a switch has\
    \ been closed. A digital input can either be on or off. If the voltage at the\
    \ input is less than 2.5V (halfway to 5V), it will be 0 (off), and if it is above\
    \ 2.5V, it will be 1 (on).\n\nDisconnect your multimeter and upload the sketch\
    \ 6-02 onto your Arduino board:\n\n```\nint inputPin = 5;\n\nvoid setup() {\n\
    \  pinMode(inputPin, INPUT);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int\
    \ reading = digitalRead(inputPin);\n  Serial.println(reading);\n  delay(1000);\n\
    }\n```\n\nAs with using an output, you need to tell the Arduino in the setup function\
    \ that you are going to use a pin as an input. You get the value of a digital\
    \ input using the digitalRead function. This returns 0 or 1.\n\n# Pull-Resistors\n\
    \nThe sketch reads the input pin and writes its value to the Serial Monitor once\
    \ per second. So upload the sketch and open the Serial Monitor. You should see\
    \ a value once per second. Push one end of your bit wire into the socket for D5\
    \ and pinch the end of the wire between your finger, as shown in Figure 6-4.\n\
    \nContinue pinching for a few seconds and watch the text appear on the Serial\
    \ Monitor. You should see a mixture of ones and zeros appear in the Serial Monitor.\
    \ The reason for this is that the inputs to the Arduino board are very sensitive.\
    \ You are acting as an antenna, picking up electrical interference.\n\nTake the\
    \ end of the wire that you were holding and push it into the socket for +5V as\
    \ shown in Figure 6-5. The stream of text in the Serial Monitor should change\
    \ to ones."
