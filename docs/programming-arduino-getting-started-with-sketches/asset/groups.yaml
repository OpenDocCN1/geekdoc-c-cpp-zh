  mdcn: "\n\n![](img/6426909fcee15359dcfa665c8698110f_107_0.png)\n\n图 6-11 测量模拟输出\n\
    \n![](img/6426909fcee15359dcfa665c8698110f_107_1.png)\n\n图 6-12 设置模拟输出的电压\n\n\
    程序通过将所需的电压（0 到 5）乘以 51，来确定 0 到 255 之间的 PWM 输出值。（读者可能希望参考维基百科以获得关于 PWM 的更详细描述）。\n\
    \n你可以通过 `analogWrite` 函数设置输出值，该函数需要一个 0 到 255 之间的输出值，其中 0 为关闭，255 为全功率。这实际上是控制\
    \ LED 亮度的极佳方法。如果你尝试控制 LED 亮度的变化，你会发现在电压达到约 2V 之前什么都不会发生；随后 LED 会迅速变亮。通过使用 PWM\
    \ 控制亮度并改变 LED 开启的平均时间，你可以实现更具线性的亮度控制。\n\n## 模拟输入\n\n数字输入仅能就 Arduino 板上特定引脚的情况提供“开/关”的答案。然而，模拟输入会根据模拟输入引脚上的电压给你一个\
    \ 0 到 1023 之间的值。\n\n程序使用 `analogRead` 函数读取模拟输入。Sketch 6-09 每隔半秒在串口监视器中显示引脚 A0\
    \ 的读取值和实际电压，因此打开串口监视器并观察数值的出现。\n\n```\n//sketch 6-09\nint analogPin = 0;\n\nvoid\
    \ setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int reading = analogRead(analogPin);\n\
    \  float voltage = reading / 204.6;\n  Serial.print(\"Reading=\");\n  Serial.print(reading);\n\
    \  Serial.print(\"\\tVolts=\");\n  Serial.println(voltage);\n  delay(500);\n}\n\
    ```\n\n当你运行此 sketch 时，你会发现读取值变化很大。和数字输入一样，这是因为输入是浮浮的。\n\n将电线的一端插入 GND 插座，使 A0\
    \ 连接到 GND。你的读取值应该保持为 0。将插入 GND 的导线末端移开并插入 5V，你本应该得到一个大约 1023 左右的读取值，这是最大读取值。因此，如果你将\
    \ A0 连接到 Arduino 板上的 3.3V 插座，Arduino 电压表应该告诉你有大约 3.3V 电压。\n\n## 结论\n\n到此，我们结束了关于\
    \ Arduino 信号输入输出基础知识的章节。在下一章中，我们将介绍标准 Arduino 库提供的一些功能。\n\n## 7：标准 Arduino 库\n\
    \n这个库是所有“好东西”所在的地方。仅靠核心 C 语言是远远有限的；你真正需要的是一组可以在 sketch 中使用的大量函数。\n\n你已经学会了其中相当函数，例如\
    \ `pinMode`、`digitalWrite` 和 `analogWrite`。但实际上，还有更多。你可以使用这些进行数学运算、生成随机数、位操作、检测输入引脚上的脉冲以及使用中断的函数。\n\
    \nArduino 语言基于一个早期的名为 Wiring 的库，并补充了另一个名为 Processing 的库。Processing 库与 Wiring 非常相似，但它是基于\
    \ Java 语言而非 C 语言，并用于在电脑上通过 USB 连接到 Android。事实上，你在电脑上运行的 Arduino 应用程序就是基于 Processing。如果你发现自己想在电脑上写一个图形界面来与\
    \ Arduino 通信，请查看 Processing (www.processing.org)。\n\n## 随机数\n\n尽管任何使用 PC 的人都有经验，但事实上，计算机是非常可预测的。有时，让你的\
    \ Arduino 变得不可预测是很有用的。例如，你可能想让机器人沿着房间的一条“随机”路径移动，在一个方向上运行随机的时间，旋转随机的数，然后再次出发。或者，你可能在考虑一个基于\
    \ Arduino 的骰子，它可以给出一之一到六之间的随机数。\n\nArduino 库为你提供了实现此功能的功能，即名为 `random` 的函数。`random`\
    \ 返回一个 `int`，它可以接受一个或两个参数。如果它只接受一个参数，它将返回 0 到该参数减 1 之间的随机数。\n\n双参数版本产生从第一个参数（包含）到第二个参数减\
    \ 1 之间的随机数。因此，`random(1, 10)` 产生 1 到 9 之间的随机数。\n\nSketch 7-01 向串口监视器输出之一六之间的数字。\n\
    \n```\n//sketch 7-01\n\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\
    \ {\n  int number = random(1, 7);\n  Serial.println(number);\n  delay(500);\n\
    }\n```\n\n如果你将此 sketch 上传到 Arduino 并打开串口监视器，你会看到类似图 7-1 的内容。\n\n如果你运行几次，你可能会惊讶于……\n\
    \n"
