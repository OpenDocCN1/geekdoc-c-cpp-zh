  - "[PAGE 47]\n\nYou can leave the pinMode call in the setup function because you\
    \ only need to call it once. The project would still work if you moved it into\
    \ the loop, but there is no need and it is a good programming habit to do things\
    \ only once if you only need to do them once. modify your sketch so that it looks\
    \ like this:\n\n```\nvoid setup() {\n  pinMode(13, OUTPUT);\n}\n```\n\n```\nvoid\
    \ loop() {\n  digitalWrite(13, HIGH);\n  delay(500);\n  digitalWrite(13, LOW);\n\
    }\n```\n\nRun this sketch and see what happens. It may not be quite what you were\
    \ expecting. The LED is basically on all the time. Hmm, why should this be?\n\n\
    Try stepping through the sketch line at a time in your head:\n\n+   1. Run setup\
    \ and set pin 13 to be an output.\n2. Run loop and set pin 13 to high (LED on).\n\
    3. Delay for half a second.\n4. Set pin 13 to low (LED off).\n5. Run loop again,\
    \ going back to step 2, and set pin 13 to high (LED on).\n\nThe problem lies between\
    \ steps 4 and 5. What is happening is that the LED is being turned off, but the\
    \ very next thing that happens is that it gets turned on again. This happens so\
    \ quickly that it appears the LED is on all the time.\n\nThe microcontroller chip\
    \ on the Arduino can perform 16 million instructions per second. That's not 16\
    \ million C language commands, but it is still very fast. So, our LED will only\
    \ be off for a few millions of a second.\n\nTo fix the problem, you need to add\
    \ another delay after you turn the LED off. Your code should now look like this:"
  - "[PAGE 48]\n\n```\n// sketch 3-01\nvoid setup() {\n  pinMode(13, OUTPUT);\n}\n\
    \nvoid loop() {\n  digitalWrite(13, HIGH);\n  delay(500);\n  digitalWrite(13,\
    \ LOW);\n  delay(500);\n}\n```\n\nTry again and your LED should blink away merrily\
    \ once per second.\n\nYou may have noticed the comment at the top of the listing\
    \ \"sketch 3-01\". To save you some typing, we have uploaded to the book's website\
    \ all the sketches with such a comment at the top. You can download them from\
    \ http://www.arduinonobook.com.\n\n# Variables\n\nIn this Blink example, you use\
    \ pin 13 and have to refer to it in three places. If you decided to use a different\
    \ pin, then you would have to change the code in three places. Similarly, if you\
    \ wanted to change the rate of blinking, controlled by the argument to delay,\
    \ you would have to change 500 to some other number in more than one place.\n\n\
    Variables can be thought of as giving a name to a number. Actually, they can be\
    \ a lot more powerful than this, but for now, you will use them for this purpose.\n\
    \nWhen defining a variable in C, you have to specify the type of the variable.\
    \ We want our variables to be whole numbers, which in C are called ints. So to\
    \ define a variable called ledPin with a value of 13, you need to write the following:\n\
    \n```\nint ledPin 13;\n```\n\nLet's fit this into your Blink sketch as follows:"
  - "[PAGE 49]\n\n```\n// sketch 3-02\nint ledPin = 13;\nint delayPeriod = 500;\n\n\
    void setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    }\n```\n\nWe have also sneaked in another variable called delayPeriod.\n\nEverywhere\
    \ in the sketch where you used to refer to 13, you now refer to ledPin, and everywhere\
    \ you used to refer to 500, you now refer to delayPeriod.\n\nIf you want to make\
    \ the sketch blink faster, you can just change the value of delayPeriod in one\
    \ place. Try changing it to 100 and running the sketch on your Arduino board.\n\
    \nThere are other cunning things that you can do with variables. Let's modify\
    \ your sketch so that the blinking starts really fast and gradually gets slower,\
    \ as if the Arduino is getting tired. To do this, all you need to do is add something\
    \ to the delayPeriod variable each time that you do a blink.\n\nModify the sketch\
    \ by adding the single line at the end of the loop function so that it appears,\
    \ as in the following listing, and run the sketch on the Arduino board. Press\
    \ the Reset button and see it start from a fast rate of flashing again.\n\nsketch\
    \ 3-03\nint ledPin = 13;\nint delayPeriod = 100;\n\n```\nvoid setup() {\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  delayPeriod = delayPeriod\
    \ + 100;\n}\n```"
