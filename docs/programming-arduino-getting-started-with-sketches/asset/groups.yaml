    \ 程序来开启或关闭 LED 时，你需要反转这个值。你使用 **!** 或 **not** 操作符来实现这一点。\n\n如果你上传此程序并在 D5 和 GND\
    \ 之间连接导线（见图 6-9），你应该看到 LED 亮起。这里可能正在发生抖动，但可能太快了你无法看到，而且无关紧要。\n\n抖动至关重要的一种情况是你让开关切换\
    \ LED 的开启和关闭。也就是说，如果你按下按钮，LED 开启并保持开启状态，当你再次按下按钮时，它会关闭。如果发生了抖动，LED 的开启或关闭将仅仅取决于你抖动的次数是奇数还是偶数。\n\
    \n程序 6-05 仅切换 LED，而没有尝试任何“消抖”。尝试使用你的导线在 D5 和 GND 之间作为开关进行测试：\n\n```cpp\n// sketch\
    \ 6-05\n\nint inputPin = 5;\nint ledPin = 13;\nint ledValue = LOW;\n\nvoid setup()\
    \ {\n  pinMode(inputPin, INPUT);\n  digitalWrite(inputPin, HIGH);\n  pinMode(ledPin,\
