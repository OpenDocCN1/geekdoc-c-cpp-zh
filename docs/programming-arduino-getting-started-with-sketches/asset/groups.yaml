    \ `MSB` 或 `LSB` 之一。\n- 要发送的数据字节。\n\n# 中断\n\n让程序员感到沮丧的问题之一是，Arduino 一次只能做一件事。如果你喜欢在程序中同时运行线程，那么你就没机会了。虽然有一些人开发了可以执行多个线程的项目，但通常对于\
