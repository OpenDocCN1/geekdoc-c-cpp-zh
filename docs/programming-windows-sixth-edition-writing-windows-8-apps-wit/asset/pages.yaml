  md: "` `` Margin``\\=\"7 0 0 0\" />`` `\n\n` ``</``StackPanel``\\>`` `\n\n` ``</``Border``\\\
    >`` `\n\n`</``UserControl``\\>`` `\n\nAll the two-way bindings strongly suggest\
    \ that the *DataContext* is set to an instance of *AppSettings*, \n\njust like\
    \ *BlankPage*. It’s actually the *same* instance of *AppSettings*, which means\
    \ that any changes in this \n\ndialog are automatically applied to the program.\
    \ \n\nThis means that you can’t make a bunch of changes in the dialog and hit\
    \ Cancel. There is no Cancel \n\nbutton. To compensate, it might make sense for\
    \ a dialog to have a Defaults button that restores \n\neverything to its factory-new\
    \ condition. \n\nA significant chunk of the XAML file is devoted to the four *EditOrientationRadioButton*\
    \ controls. The \n\ncontent of each of these is a *StackPanel* with two bordered\
    \ *TextBlock* elements, to create a little graphic \n\nthat resembles the four\
    \ layout options you saw in the earlier screen shot (that is, the third screen\
    \ shot \n\nin the “Controls for XamlCruncher” section). \n\nThe dialog contains\
    \ three instances of *ToggleSwitch*. By default, the *OnContent* and *OffContent*\
    \ \n\nproperties are set to the text string “On” and “Off,” but I thought “Show”\
    \ and “Hide” were better for the \n\nruler and grid displays. \n\n*ToggleSwitch*\
    \ also has a *Header* property that displays text above the switch. In the screen\
    \ shot I just \n\nreferred to, the labels “Automatic parsing,” “Ruler,” and “Grid\
    \ lines” are all displayed by the \n\n*ToggleSwitch*. I thought the labels looked\
    \ good, so I made an effort to duplicate the font and \n\nplacement with the *Style*\
    \ labeled as “DialogCaptionTextStyle.” \n\nA *Slider* is used to set the font\
    \ size, which might seem reasonable, but I also use a *Slider* to set the \n\n\
    number of tab spaces, which I’ll admit doesn’t seem reasonable at all. Even though\
    \ the *AppSettings* \n\nclass defines the *TabSpaces* property as an integer,\
    \ the binding with the *Value* property of the *Slider* \n\nworks regardless,\
    \ and the *Slider* proves to be a convenient way to change the property. \n\n\
    The only chore left for the code-behind file is to manage the *RadioButton* controls:\
    \ \n\n**Project: XamlCruncher | File: SettingsDialog.xaml.cs **\n\n`using`` Windows.UI.Xaml;\
    \ `\n\n`using`` Windows.UI.Xaml.Controls; `\n\n` `\n\n`namespace`` XamlCruncher\
    \ `\n\n`{ `\n\n` ``public`` ``sealed`` ``partial`` ``class`` ``SettingsDialog``\
    \ : ``UserControl`` `\n\n` { `\n\n` ``public`` SettingsDialog() `\n\n` { `\n\n\
    ` ``this``.InitializeComponent(); `\n\n` Loaded += OnLoaded; `\n\n` } `\n\n` `\n\
    \n` ``// Initialize RadioButton for edit orientation`` `\n\n` ``void`` OnLoaded(``object``\
    \ sender, ``RoutedEventArgs`` args) `\n\n289"
