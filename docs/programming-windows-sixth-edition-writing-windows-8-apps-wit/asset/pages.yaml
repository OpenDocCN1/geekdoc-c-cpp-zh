  md: "Chapter 4 \n\n**Presentation with Panels **\n\nA Windows Runtime program generally\
    \ consists of one of more classes that derive from *Page*. Each \n\npage contains\
    \ a visual tree of elements connected in a parent-child hierarchy. A *Page* object\
    \ can have \n\nonly one child set to its *Content* property, but in most cases\
    \ this child is an instance of a class that \n\nderives from *Panel*. *Panel*\
    \ defines a property named *Children* that is of type *UIElementCollection*—a\
    \ \n\ncollection of *UIElement* derivatives, including other panels. \n\nThese\
    \ *Panel* derivatives form the core of the Windows Runtime dynamic layout system.\
    \ As the size \n\nor orientation of a page changes, panels can reorganize their\
    \ children to optimally fill the available \n\nspace. Each type of panel arranges\
    \ its children differently. The *Grid*, for example, arranges its children in\
    \ \n\nrows and columns. The *StackPanel* stacks its children either horizontally\
    \ or vertically. The \n\n*VariableSizedWrapGrid* also stacks its children horizontally\
    \ or vertically but then uses additional rows or \n\ncolumns if necessary. much\
    \ like the Windows 8 start screen. The *Canvas* allows its children to be \n\n\
    positioned at specific pixel locations. \n\nWhat makes a layout system complex\
    \ is balancing the conflicting needs of parents and children. In \n\npart, a layout\
    \ system needs to be \"child-driven\" in that each child should be allowed to\
    \ determine how \n\nlarge it needs to be, and to obtain sufficient screen space\
    \ for itself. But the layout system also needs to \n\nbe \"parent-driven.\" At\
    \ any time, the page is fixed in size and cannot give its descendants in the visual\
    \ \n\ntree more space than it has available. \n\nFor example, a simple HTML page\
    \ has a width that is parent-driven because it's constrained by the \n\nwidth\
    \ of the video display or the browser window. However, the height of a page is\
    \ child-driven \n\nbecause it depends on the content of the page. If that height\
    \ exceeds the height of the browser \n\nwindow, scrollbars are required. \n\n\
    The Windows 8 start screen is the other way around: The number of application\
    \ tiles that can fit \n\nvertically is parent-driven because it’s based on the\
    \ height of the screen. The width of this tile display is \n\nchild-driven. If\
    \ tiles extend off the screen horizontally, they must be moved into view by scrolling.\
    \ \n\n**The *****Border***** Element **\n\nTwo of the most important properties\
    \ connected with layout are *HorizontalAlignment* and \n\n*VerticalAlignment*.\
    \ These properties are defined by *FrameworkElement* and set to members of \n\n\
    enumerations with identical names: *HorizontalAlignment* and *VerticalAlignment*.\
    \ \n\nAs you saw in Chapter 3, “Basic Event Handling,” the default values of *HorizontalAlignment*\
    \ and \n\n*VerticalAlignment* are not *Left* and *Top*. They are instead *HorizontalAlignment.Stretch*\
    \ and \n\n106"
  merge: -1
  pgno: 105
- img_proc: true
  md: "*VerticalAlignment.Stretch*. These default *Stretch* settings imply parent-driven\
    \ layout: elements \n\nautomatically stretch to become as large as their parents.\
    \ This is not always visually apparent, but in the \n\nlast chapter you saw how\
    \ a *TextBlock* stretched to the size of its parent gets all the *Tapped* events\
    \ \n\nanywhere within that parent. \n\nWhen the *HorizontalAlignment* or *VerticalAlignment*\
    \ properties are set to values other than *Stretch*, \n\nthe element sets its\
    \ own width or height based on its content and layout becomes more child-driven.\
    \ \n\nThe important role of *HorizontalAlignment* and *VerticalAlignment* also\
    \ becomes apparent when you \n\nstart adding more parents and children to the\
    \ page. For example, suppose you want to display a \n\n*TextBlock* with a border\
    \ around it. You might discover (perhaps with some dismay) that the *TextBlock*\
    \ \n\nhas no properties that relate to a border. However, the *Windows.UI.Xaml.Controls*\
    \ namespace contains \n\na *Border* element with a property named *Child*. So\
    \ you put the *TextBlock* in a *Border* and put the *Border* \n\nin the *Grid*,\
    \ like so: \n\n**Project: NaiveBorderedText | File: BlankPage.xaml (excerpt) **\n\
    \n`<``Page ``…`` ``\\>`` `\n\n` `\n\n` ``<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` `\n\n` ``<``Border`` BorderBrush``\\\
    =\"Red\"`` `\n\n` `` BorderThickness``\\=\"12\"`` `\n\n` `` CornerRadius``\\=\"\
    24\"`` `\n\n` `` Background``\\=\"Yellow\">`` `\n\n` `\n\n` ``<``TextBlock`` Text``\\\
    =\"Hello Windows 8!\"`` `\n\n` `` FontSize``\\=\"96\"`` `\n\n` `` Foreground``\\\
    =\"Blue\"`` `\n\n` `` HorizontalAlignment``\\=\"Center\"`` `\n\n` `` VerticalAlignment``\\\
    =\"Center\" />`` `\n\n` ``</``Border``\\>`` `\n\n` `\n\n` ``</``Grid``\\>`` `\n\
    \n`</``Page``\\> `\n\nThe *BorderThickness* property defined by *Border* can be\
    \ set to different values for the four sides. Just \n\nspecify four different\
    \ values in the order left, top, right, and bottom. If you specify only two values,\
    \ the \n\nfirst applies to the left and right and the second applies to the top\
    \ and bottom. The *CornerRadius* \n\nproperty defines the curvature of the corners.\
    \ You can set it a uniform value or four different values in \n\nthe order upper-left,\
    \ upper-right, lower-right, and lower-left. \n\nNotice the *HorizontalAlignment*\
    \ and *VerticalAlignment* properties set on the *TextBlock*. The markup \n\nlooks\
    \ reasonable, but the result is probably not what you want: \n\n107"
