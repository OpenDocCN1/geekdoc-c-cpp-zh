  md: "can become quite awkward and particularly messy to trace program flow or implement\
    \ a simple *return* \n\nstatement. \n\nAnother solution is desperately needed.\
    \ Fortunately, it exists. \n\n***Await***** and *****Async***\n\nThe C# 5.0 keyword\
    \ *await* allows us to work with asynchronous operations as if they were relatively\
    \ \n\nnormal method calls. The MetroPad2 program is the same as MetroPad1 except\
    \ for the processing of \n\nthe Open and Save As buttons on the application bar.\
    \ Here’s the *Click* handler for the Save As button: \n\n**Project: MetroPad2\
    \ — File: BlankPage.xaml.cs (excerpt) **\n\n`async`` ``void`` OnSaveAsAppBarButtonClick(``object``\
    \ sender, ``RoutedEventArgs`` args) `\n\n`{ `\n\n` ``FileSavePicker`` picker =\
    \ ``new`` ``FileSavePicker``(); `\n\n` picker.DefaultFileExtension = ``\".txt\"\
    ``; `\n\n` picker.FileTypeChoices.Add(``\"Text\"``, ``new`` ``List``<``string``\\\
    > { ``\".txt\"`` }); `\n\n` `\n\n` ``// Asynchronous call!`` `\n\n` ``StorageFile``\
    \ storageFile = ``await`` picker.PickSaveFileAsync(); `\n\n` `\n\n` ``if`` (storageFile\
    \ == ``null``) `\n\n` ``return``; `\n\n` `\n\n` ``// Asynchronous call!`` `\n\n\
    ` ``await`` ``FileIO``.WriteTextAsync(storageFile, txtbox.Text); `\n\n`} `\n\n\
    Notice the two occurrences of *await* preceded with comments. *PickSaveFileAsync*\
    \ actually returns an \n\n*IAsyncOperation* on which you must normally set a *Completed*\
    \ handler and then call *GetResults* in the \n\n*Completed* callback to get a\
    \ *StorageFile* object. The *await* operator seems to bypass all the messy stuff\
    \ \n\nand simply return the *StorageFile* directly. And that's exactly what it\
    \ does, except not quite right away. \n\nIt looks like magic, but much of the\
    \ messy implementation details are now hidden. The C# compiler \n\ngenerates the\
    \ callback and the *GetResults* call. But what the *await* operator also does\
    \ is turn the \n\nmethod in which it’s used into a state machine. The *OnSaveAsAppBarButtonClick*\
    \ method begins \n\nexecuting normally, until *PickSaveFileAsync* is called and\
    \ the first *await* appears. \n\nDespite its name, that *await* does *not* wait\
    \ until the operation completes. Instead, the *Click* handler \n\nis exited at\
    \ that point. Control returns back to Windows. Other code on the program's user\
    \ interface \n\nthread can then run, as can the file-picker itself. When the file-picker\
    \ is dismissed, and a result is ready, \n\nand the UI thread is ready to run some\
    \ code, execution of the *Click* handler continues with the \n\nassignment to\
    \ the *storageFile* variable and then continues until the next *await* operator.\
    \ And so forth \n\nwith as many *await* operators as you like until the method\
    \ completes. \n\nThe last line in this *Click* handler calls the static *FileIO.WriteTextAsync*\
    \ method. Strictly speaking, the \n\n*await* operator is not needed here because\
    \ conclusion of the *Click* handler doesn’t need to wait for this \n\n251"
  merge: -1
  pgno: 250
- img_proc: true
  md: "method to conclude. The *FileIO.WriteTextAsync* method doesn’t return anything,\
    \ and nothing else in \n\nthe *Click* handler is dependent on its conclusion.\
    \ That *await* operator can be removed in this case and \n\nthe program will work\
    \ the same: \n\n`FileIO``.WriteTextAsync(storageFile, txtbox.Text); `\n\nYou’ll\
    \ get a warning message from the compiler, but it’s OK. The *await* operator is\
    \ crucial only when \n\nyou need a return value from the asynchronous method or\
    \ when the method must complete before \n\nprogram logic continues. \n\nHere’s\
    \ the *Click* handler for the Open button now using the static *FileIO.ReadTextAsync*\
    \ shortcut \n\nmethod: \n\n**Project: MetroPad2 | File: BlankPage.xaml.cs (excerpt)\
    \ **\n\n`async`` ``void`` OnOpenAppBarButtonClick(``object`` sender, ``RoutedEventArgs``\
    \ args) `\n\n`{ `\n\n` ``FileOpenPicker`` picker = ``new`` ``FileOpenPicker``();\
    \ `\n\n` picker.FileTypeFilter.Add(``\".txt\"``); `\n\n` `\n\n` ``// Asynchronous\
    \ call!`` `\n\n` ``StorageFile`` storageFile = ``await`` picker.PickSingleFileAsync();\
    \ `\n\n` `\n\n` ``if`` (storageFile == ``null``) `\n\n` ``return``; `\n\n` `\n\
    \n` ``// Asynchronous call!`` `\n\n` txtbox.Text = ``await`` ``FileIO``.ReadTextAsync(storageFile);\
    \ `\n\n`} `\n\nPrior to *await*, calling asynchronous operations in C# always\
    \ seemed to me to violate the imperative \n\nstructure of the language. The *await*\
    \ operator brings back that imperative structure and turns \n\nasynchronous calls\
    \ into what appears to be a series of sequential normal method calls. Moreover,\
    \ \n\neverything in those *Click* handlers now runs in the UI thread, so you don’t\
    \ have to worry about \n\naccessing user interface objects. But despite the ease\
    \ of *await*, you’ll probably want to keep in mind \n\nthat a method in which\
    \ *await* appears is actually chopped up into pieces behind the scenes. \n\nThere\
    \ are some restrictions on the *await* operator. It cannot appear in the *catch*\
    \ or *finally* clause of \n\nan exception handler. However, it can appear in the\
    \ *try* clause, and this is how you'll trap errors that \n\noccur in the asynchronous\
    \ method. There are also ways to cancel operations, and some asynchronous \n\n\
    methods report progress as well. More details in the later chapter devoted to\
    \ asynchronous operations. \n\nThe method in which the *await* operator appears\
    \ must be flagged as *async*, but the *async* keyword \n\ndoesn't do much of anything.\
    \ In earlier versions of C#, *await* was not a keyword, so programmers could \n\
    \nuse the word for variable names or property names or whatever. Adding a new\
    \ *await* keyword to C# \n\n5.0 would break this code, but restricting *await*\
    \ to methods flagged with *async* avoids that problem. \n\nThe *async* modifier\
    \ does not change the signature of the method—the method above is still a valid\
    \ \n\n*Click* handler. But you can't use *async* (and hence *await*) with methods\
    \ that serve as entry points, such \n\nas *Main* or class constructors. \n\n252"
  merge: -1
  pgno: 251
