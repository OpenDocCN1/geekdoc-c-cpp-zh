- img_proc: true
  md: "indicate how the finger or mouse is moving. You can use these events to move\
    \ the *Thumb* (and \n\nanything else), most conveniently on a *Canvas*. \n\nIn\
    \ the AlphabetBlocks program, a series of buttons labeled with letters, numbers,\
    \ and some \n\npunctuation surround the perimeter. Click one, and an alphabet\
    \ block appears that you can drag with \n\nyour finger or the mouse. I know that\
    \ you’ll want to send this alphabet block scurrying across the \n\nscreen with\
    \ a flick of your finger, but it won’t respond in that way. The *Thumb* does not\
    \ incorporate \n\ntouch inertia. For inertia, you’ll have to tap into the actual\
    \ touch events. \n\nFor the alphabet blocks themselves, a *UserControl* derivative\
    \ named *Block* has a XAML file that \n\ndefines a 144-pixel square image with\
    \ a *Thumb*, some graphics and a *TextBlock*: \n\n**Project: AlphabetBlocks |\
