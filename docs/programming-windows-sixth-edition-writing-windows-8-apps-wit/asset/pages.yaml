  md: "` ``<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``ScrollViewer``\\>`` `\n\n` ``<``StackPanel`` Name``\\=\"stackPanel\"\
    \ />`` `\n\n` ``</``ScrollViewer``\\>`` `\n\n` ``</``Grid``\\>`` `\n\n`</``Page``\\\
    > `\n\nNow all that’s necessary in the code-behind file is to generate so many\
    \ items for the *StackPanel* that \n\nthey can’t all be visible at once. Where\
    \ do we get so many items? One convenient solution is to use \n\n.NET reflection\
    \ to obtain all 141 static *Color* properties defined in the *Colors* class: \n\
    \n**Project: StackPanelWithScrolling | File: BlankPage.xaml.cs (excerpt) **\n\n\
    `public`` ``sealed`` ``partial`` ``class`` ``BlankPage`` : ``Page`` `\n\n`{ `\n\
    \n` ``public`` BlankPage() `\n\n` { `\n\n` ``this``.InitializeComponent(); `\n\
    \n` `\n\n` ``IEnumerable``<``PropertyInfo``\\> properties = `\n\n` ``typeof``(``Colors``).GetTypeInfo().DeclaredProperties;\
    \ `\n\n` `\n\n` ``foreach`` (``PropertyInfo`` property ``in`` properties) `\n\n\
    ` { `\n\n` ``Color`` clr = (``Color``)property.GetValue(``null``); `\n\n` ``TextBlock``\
    \ txtblk = ``new`` ``TextBlock``(); `\n\n` txtblk.Text = ``String``.Format(``\"\
    {0} \\\\x2014 {1:X2}-{2:X2}-{3:X2}-{4:X2}\"``, `\n\n` property.Name, clr.A, clr.R,\
    \ clr.G, clr.B); `\n\n` stackPanel.Children.Add(txtblk); `\n\n` } `\n\n` } `\n\
    \n`} `\n\nWindows 8 reflection works a little differently from .NET reflection.\
    \ Generally, to get anything \n\ninteresting from the *Type* object, you need\
    \ to call a Windows 8 extension method *GetTypeInfo*. The \n\nreturned *TypeInfo*\
    \ object makes available additional information about the *Type*. In this program,\
    \ the \n\n*DeclaredProperties* property of *TypeInfo* obtains all the properties\
    \ of the *Colors* class in the form of \n\n*PropertyInfo* objects. Because all\
    \ the properties in the *Colors* class are static, the value of these static \n\
    \nproperties can be obtained by calling *GetValue* on each *PropertyInfo* object\
    \ with a *null* parameter. Each \n\n*TextBlock* gets the name of the color, an\
    \ em-dash (Unicode 0x2014), and the hexadecimal color bytes. \n\nThe display looks\
    \ like this: \n\n124"
