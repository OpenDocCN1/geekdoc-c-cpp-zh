    \ to the *InitializeComponent* call. \n\n`this``.Resources.Add(\"fontFamily\"\
    , ``new`` ``FontFamily``(``\"Times New Roman\"``)); `\n\nWhen the XAML file is\
    \ parsed by *InitializeComponent*, this object will be available within that XAML\
    \ file. \n\nAt the time of this writing, the *ResourceDictionary* class does not\
    \ define a public method that \n\nsearches up the visual tree for dictionaries\
    \ in ancestor classes. If you need something like that to search \n\nfor resources\
    \ in code, you can easily write it yourself by “climbing the visual tree” using\
    \ the *Parent* \n\nproperty defined by *FrameworkElement* or the *VisualTreeHelper*\
    \ class defined in the \n\n*Windows.UI.Xaml.Media* namespace. The *Application*\
    \ object for the application is available from the \n\nstatic *Application.Current*\
    \ property. \n\nThe predefined resources (such as the *ApplicationPageBackgroundBrush*\
    \ referenced by the *Grid*) \n\ndon’t seem to be programmatically enumerable.\
    \ Nor are they documented. However, in Visual Studio \n\nyou can see a list of\
    \ the predefined brushes by clicking the *Grid* in the BlankPage.xaml file and\
    \ viewing \n\nthe available *Background* brush identifiers in the Properties view\
    \ in the lower-right corner of Visual \n\nStudio. \n\nAfter *ApplicationPageBackgroundBrush*,\
    \ the next most important predefined resource identifier is \n\n*ApplicationTextBrush*,\
    \ which is black in the light theme, and white in the dark theme. If you need\
    \ a \n\ncolor to properly contrast with the background (as I will shortly), this\
    \ is it. The *ControlHighlightBrush* is \n\nalso convenient for a splash of color\
    \ that contrasts with both the background and foreground. \n\n**Resources Are\
    \ Shared **\n\nAre resource objects truly shared among the elements that reference\
