    \ `\n\n` ``typeof``(``GradientButton``), `\n\n` ``new`` ``PropertyMetadata``(``Colors``.White,\
    \ OnColorChanged)); `\n\n` `\n\n` Color2Property = `\n\n` ``DependencyProperty``.Register(``\"\
    Color2\"``, `\n\n` ``typeof``(``Color``), `\n\n` ``typeof``(``GradientButton``),\
    \ `\n\n` ``new`` ``PropertyMetadata``(``Colors``.Black, OnColorChanged)); `\n\n\
    `} `\n\nA slightly different static method named *DependencyProperty.RegisterAttached*\
    \ is used to create \n\nattached properties. \n\nThe first argument to *DependencyProperty.Register*\
    \ is the text name of the property. This is used \n\nsometimes by the XAML parsers.\
    \ The second argument is the type of the property. The third argument \n\nis the\
    \ type of the class that is registering this dependency property. \n\nThe fourth\
    \ argument is an object of type *PropertyMetadata*. The constructor comes in two\
    \ versions. \n\nIn one version, all you need to specify is a default value of\
    \ the property. In the other, you also specify a \n\nmethod that is called when\
    \ the property changes. This method will not be called if the property \n\nhappens\
    \ to be set to the same value it already has. \n\nThe default value you specify\
    \ as the first argument to the *PropertyMetadata* constructor must match \n\n\
    the type indicated in the second argument or a run-time exception will result.\
    \ This is not as easy as it \n\nsounds. For example, it is very common for programmers\
    \ to supply a default value of 0 for a property \n\nof type *double*. During compilation,\
    \ the 0 is assumed to be an integer, so at run time a type mismatch \n\nis discovered\
    \ and an exception is thrown. If you’re defining a dependency property of type\
    \ *double*, give \n\nit a default value of 0.0 so that the compiler knows the\
    \ correct data type of this argument. \n\nThe *GradientButton* class also needs\
    \ regular .NET property definitions of *Color1* and *Color2*, but \n\nthese are\
    \ always of a very specific form: \n\n`public`` ``Color`` Color1 `\n\n`{ `\n\n\
    ` ``set`` { SetValue(Color1Property, ``value``); } `\n\n` ``get`` { ``return``\
    \ (``Color``)GetValue(Color1Property); } `\n\n`} `\n\n` `\n\n`public`` ``Color``\
    \ Color2 `\n\n`{ `\n\n` ``set`` { SetValue(Color2Property, ``value``); } `\n\n\
    ` ``get`` { ``return`` (``Color``)GetValue(Color2Property); } `\n\n`} `\n\nThe\
    \ *set* accessor always calls *SetValue* (inherited from the *DependencyObject*\
    \ class), referencing the \n\ndependency property object, and the *get* accessor\
    \ always calls *GetValue* and casts the return value to \n\nthe proper type for\
    \ the property. You can make the *set* accessor *protected* or *private* if you\
    \ don’t want \n\nthe property being set from outside the class. \n\n180"
