  md: "` ``return`` color; `\n\n` } `\n\n` } `\n\n` `\n\n` ``void`` Calculate() `\n\
    \n` { `\n\n` ``this``.Color = ``Color``.FromArgb(255, (``byte``)``this``.Red,\
    \ (``byte``)``this``.Green, (``byte``)``this``.Blue); `\n\n` } `\n\n` `\n\n` ``protected``\
    \ ``void`` OnPropertyChanged(``string`` propertyName) `\n\n` { `\n\n` ``if`` (PropertyChanged\
    \ != ``null``) `\n\n` PropertyChanged(``this``, ``new`` ``PropertyChangedEventArgs``(propertyName));\
    \ `\n\n` } `\n\n` } `\n\n`} `\n\nThe *OnPropertyChanged* method at the bottom\
    \ of the class has the job of actually firing the \n\n*PropertyChanged* event\
    \ with the name of the property. \n\nI’ve defined the *Red*, *Green*, and *Blue*\
