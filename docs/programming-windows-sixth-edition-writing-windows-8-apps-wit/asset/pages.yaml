  md: "that this *Grid* is a child of a *StackPanel* with a vertical orientation.\
    \ The *StackPanel* offers to the *Grid* an \n\nunconstrained infinite height.\
    \ How can the *Grid* allocate that infinite height to its middle row? It \n\n\
    cannot. The asterisk specification degenerates to *Auto*. \n\nSimilarly, if a\
    \ *Grid* is a child of a *Canvas* and the *Grid* is not given an explicit *Height*\
    \ and *Width*, all \n\nthe star specifications degenerate to *Auto*. The same\
    \ thing happens to a *Grid* that does not have \n\ndefault *Stretch* values of\
    \ *HorizontalAlignment* and *VerticalAlignment*. In the *Grid* example shown above,\
    \ \n\nthe second column may actually become wider than the third if that’s what\
    \ the sizes of the children in \n\nthose columns dictate. \n\nHowever, if you\
    \ have no *RowDefinition* objects with a star specification, the height of the\
    \ *Grid* is \n\nchild-driven. The *Grid* can go in a vertical *StackPanel* or\
    \ *Canvas* or be given a nondefault \n\n*VerticalAlignment* without weirdness\
    \ happening. \n\nThe *Height* property of *RowDefinition* and the *Width* property\
    \ of *ColumnDefinition* are both of type \n\n*GridLength*, a structure defined\
    \ in *Windows.UI.Xaml* that lets you specify *Auto* or star sizes from code. \n\
    \n*RowDefinition* also defines *MinHeight* and *MaxHeight* properties, and *ColumnDefinition*\
    \ defines \n\n*MinWidth* and *MaxWidth*. These are all of type *double* and indicate\
    \ minimum and maximum sizes in \n\npixels. You can obtain the actual sizes with\
    \ the *ActualHeight* property of *RowDefinition* and the \n\n*ActualWidth* property\
    \ of *ColumnDefinition*. \n\n*Grid* also defines four attached properties that\
    \ you set on the children of a *Grid*: *Grid.Row* and \n\n*Grid.Column* have default\
    \ values of 0, and *Grid.RowSpan* and *Grid.ColumnSpan* have default values of\
    \ \n\n1\\. This is how you indicate the cell in which a particular child resides\
    \ and how many rows and columns \n\nit spans. A cell can contain more than one\
    \ element. \n\nYou can nest a *Grid* within a *Grid* or put other panels in *Grid*\
    \ cells, but the nesting of panels could \n\ndegrade layout performance, so watch\
    \ out if a deeply nested element is changing size based on an \n\nanimation or\
    \ if children are frequently being added to or removed from *Children* collections.\
    \ You don’t \n\nwant the layout of your page being recalculated at the video frame\
    \ rate! \n\nIn Chapter 3, “Basic Event Handling,” I presented a Windows 8 version\
    \ of WHATSIZE, the first \n\nprogram to appear in a magazine article about Windows\
    \ programming. The third article about \n\nWindows Programming was in the May\
    \ 1987 issue of *Microsoft Systems Journal* and featured a \n\nprogram called\
    \ COLORSCR (“color scroll”). Here it is as it appeared in that article running\
    \ under a beta \n\nversion of Windows 2: \n\n158"
