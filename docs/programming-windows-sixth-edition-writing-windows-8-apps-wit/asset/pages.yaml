    >`` `\n\n` ``</``Rectangle.Fill``\\>`` `\n\n`</``Rectangle``\\>`` `\n\nThe big\
    \ problem with this markup is that binding targets need to be backed by dependency\
    \ properties, \n\nand the properties of *Color* are not. They can’t be, because\
