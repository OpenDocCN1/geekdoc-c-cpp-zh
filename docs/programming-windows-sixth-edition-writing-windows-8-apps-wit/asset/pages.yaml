  md: "`</``Grid``\\>`` `\n\nWith a light theme, the *Grid* has an off-white background.\
    \ When the *Background* property is removed, \n\nthe background of the page changes\
    \ to black. But you’ll also experience a change in the behavior of \n\nthe program:\
    \ the *TextBlock* still changes color when you tap it, but when you tap outside\
    \ the *TextBlock*, \n\nthe *Grid* doesn’t change color at all. \n\nThe default\
    \ value of the *Background* property defined by *Panel* (and inherited by *Grid*)\
    \ is *null*, and \n\nwith a *null* background, the *Grid* doesn’t trap touch events.\
    \ They just fall right through. \n\nOne way to fix this without altering the visual\
    \ appearance is to give the *Grid* a *Background* property \n\nof *Transparent*:\
    \ \n\n`<``Grid`` Background``\\=\"Transparent\">`` `\n\n` ``<``TextBlock`` Text``\\\
    =\"Hello, Windows 8!\"`` `\n\n` `` HorizontalAlignment``\\=\"Left\"`` `\n\n` ``\
    \ VerticalAlignment``\\=\"Top\"`` `\n\n` `` Foreground``\\=\"Red\" />`` `\n\n\
    `</``Grid``\\>`` `\n\nIt looks the same as *null*, but now you’ll get *Tapped*\
    \ events with an *OriginalSource* of *Grid*. \n\nThe lessons here are important:\
    \ Looks can be deceiving. An element with default settings of \n\n*HorizontalAlignment*\
    \ and *VerticalAlignment* might look the same as one with settings of *Left* and\
    \ *Top*, \n\nbut it is actually occupying the entire area of its container and\
    \ might block events from reaching \n\nunderlying elements. A *Panel* derivative\
    \ with a default *Background* property of *null* might look the \n\nsame as one\
    \ with a setting of *Transparent*, but it does not respond to touch events. \n\
    \nI can almost guarantee that sometime in the future, one of these two issues\
    \ will cause a bug in one \n\nof your programs that will drive you crazy for the\
    \ good part of a day, and that this will happen even \n\nafter many years of working\
    \ with the XAML layout system. \n\nI speak from experience. \n\n**Size and Orientation\
    \ Changes **\n\nThe very first Windows program to be described in a magazine article\
    \ was called WHATSIZE (all capital \n\nletters, of course), and it appeared in\
    \ the December 1986 issue of *Microsoft Systems Journal*, the \n\npredecessor\
    \ to *MSDN Magazine*. The program did little more than display the current size\
    \ of the \n\nprogram’s window, but as the size of the window changed, the displayed\
    \ size also changed. \n\nObviously the original WHATSIZE program was written for\
    \ the Windows APIs of that era, so it \n\nredrew the display in response to a\
    \ WM\\_PAINT message. In the original Windows API, this message \n\noccurred whenever\
    \ the contents of part of a program’s window became “invalid” and needed \n\n\
    redrawing. A program could define its window so that the entire window was invalidated\
    \ whenever its \n\nsize changed. \n\n91"
