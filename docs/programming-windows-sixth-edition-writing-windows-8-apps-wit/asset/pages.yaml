  md: "the *Path* provides the name of the property. \n\nWhen I’m typing a *Binding*\
    \ markup extension, I always want to put quotation marks around the \n\nproperty\
    \ values, but that’s wrong. Quotation marks do not appear in a binding expression.\
    \ \n\nThe final *TextBlock* shows the *Binding* expressed in less common property-element\
    \ syntax: \n\n`<``TextBlock.Foreground``\\>`` `\n\n` ``<``Binding`` ``ElementName``\\\
    =\"topTextBlock\"`` ``Path``\\=\"Foreground\" />`` `\n\n`</``TextBlock.Foreground``\\\
    >`` `\n\nWith this syntax, the quotation marks around the element name and path\
    \ are required. \n\nYou can also create a *Binding* object in code and set it\
    \ on a target property by using the *SetBinding* \n\nmethod defined by *FrameworkElement*.\
    \ When doing this, you’ll discover that the binding target must \n\nbe a dependency\
    \ property. \n\nThe *Path* property of the *Binding* class is called *Path* because\
    \ it can actually be several property \n\nnames separated by periods. For example,\
    \ replace one of the *Text* settings in this project with the \n\nfollowing: \n\
    \n`Text``\\=\"{``Binding`` ElementName``\\=``topTextBlock``,`` Path``\\=``FontFamily.Source``}\"\
    \ `\n\nThe first part of the *Path* indicates that we want something from the\
    \ *FontFamily* property. That \n\nproperty is set to an object of type *FontFamily*,\
    \ which has a property named *Source* indicating the font \n\nfamily name. The\
    \ text displayed by this *TextBlock* is therefore “Times New Roman.” \n\nTry this\
    \ on any *TextBlock* in this project: \n\n`Text``\\=\"{``Binding`` RelativeSource``\\\
    ={``RelativeSource`` Self``},`` Path``\\=FontSize}\" `\n\nThat’s a *RelativeSource*\
    \ markup extension inside a *Binding* markup extension, and you use it to \n\n\
    reference a property of the same element on which the binding is set. \n\nWith\
    \ *StaticResource*, *Binding*, and *RelativeSource*, you’ve now seen 60 percent\
    \ of the XAML markup \n\nextensions supported by the Windows Runtime. The *TemplateBinding*\
    \ markup extension won’t turn up \n\nuntil a later chapter. \n\nThe remaining\
    \ markup extension is not used very often, but when you need it, it’s indispensable.\
    \ \n\nSuppose you’ve defined an implicit style for the *Grid* that includes a\
    \ *Background* property, and it does \n\nexactly what you want except for one\
    \ *Grid* where you want the *Background* property to be its default \n\nvalue\
    \ of *null*. How do you specify *null* in markup? Like so: \n\n`Background``\\\
    =\"{``x``:``Null``}\"`` `\n\nOr suppose you’ve defined an implicit style and there’s\
    \ one element where you don’t want any part \n\nof the style to apply. Inhibit\
    \ the implicit style like so: \n\n`Style``\\=\"{``x``:``Null``}\" `\n\nYou have\
    \ now seen nearly all the elements and attributes that appear with an “x” prefix\
    \ in Windows \n\n76"
