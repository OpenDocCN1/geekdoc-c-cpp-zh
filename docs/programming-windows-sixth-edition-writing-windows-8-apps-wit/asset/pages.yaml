  md: "Look at the interesting way that the constructor sets a *Tapped* handler for\
    \ the *Page*. Normally it would \n\nattach the event handler like so: \n\n`this``.Tapped\
    \ += OnPageTapped; `\n\nIn that case the *OnPageTapped* handler would not get\
    \ a *Tapped* event originating with the *TextBlock* \n\nbecause the *TextBlock*\
    \ handler sets *Handled* to true. Instead, it attaches the handler with a method\
    \ \n\nnamed *AddHandler*: \n\n`this``.AddHandler(``UIElement``.TappedEvent, `\n\
    \n` ``new`` ``TappedEventHandler``(OnPageTapped), `\n\n` ``true``); `\n\n*AddHandler*\
    \ is defined by *UIElement*, which also defines the static *UIElement.TappedEvent\
    \ property*. This \n\nproperty is of type *RoutedEvent*. \n\nJust as a property\
    \ like *FontSize* is backed by a static property named *FontSizeProperty* of type\
    \ \n\n*DependencyProperty*, a routed event such as *Tapped* is backed by a static\
    \ property named *TappedEvent* \n\nof type *RoutedEvent*. *RoutedEvent* defines\
    \ nothing public on its own; it mainly exists to allow an event \n\nto be referenced\
    \ in code without requiring an instance of an element. \n\nThe *AddHandler* method\
    \ attaches a handler to that event. The second argument of *AddHandler* is \n\n\
    defined as just an *object*, so creating a delegate object is required to reference\
    \ the event handler. And \n\nhere’s the magic: set the last argument to *true*\
    \ if you want this handler to also receive routed events \n\nthat have been flagged\
    \ as *Handled*. \n\nThe *AddHandler* method isn’t used often, but when you need\
    \ it, it can be very useful. \n\n**Input, Alignment, and Backgrounds **\n\nI have\
    \ just one more, very short program in the RoutedEvents series to make a couple\
    \ important points \n\nabout input events. \n\nThe XAML file for RoutedEvents7\
    \ has just one *TextBlock* and no event handlers defined: \n\n**Project: RoutedEvents7\
    \ | File: BlankPage.xaml (excerpt) **\n\n`<``Page ``… `\n\n` `` FontSize``\\=\"\
    48\">`` `\n\n` `\n\n` <``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``TextBlock`` Text``\\=\"Hello, Windows 8!\"`` `\n\n` `` Foreground``\\\
    =\"Red\" />`` `\n\n` </``Grid``\\>`` `\n\n`</``Page``\\>`` `\n\nThe absence of\
    \ *HorizontalAlignment* and *VerticalAlignment* settings on the *TextBlock* cause\
    \ it to appear \n\nin the upper-left corner of the *Grid*. \n\n88"
