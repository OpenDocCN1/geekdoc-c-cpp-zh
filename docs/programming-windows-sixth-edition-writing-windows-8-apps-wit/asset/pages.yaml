  md: "set to a *Panel* derivative to display a bunch of controls. I’ll show you how\
    \ to use *Popup* shortly. \n\nThere’s also a class named *PopupMenu* from the\
    \ *Windows.UI.Popups* namespace. As the name \n\nsuggests, *PopupMenu* is mostly\
    \ for context menus, such as the Cut/Copy/Paste menu that appears \n\nwhen you\
    \ press and hold some selected text in the *TextBox* control. You can create a\
    \ *PopupMenu* on \n\nyour own, but it is restricted to text commands and you have\
    \ no control over the formatting. \n\nAlso in the *Windows.UI.Popups* namespace\
    \ is *MessageDialog*, which is the Metro style version of the \n\nmessage box.\
    \ I’ll have some examples of *MessageDialog* later in this chapter. \n\nIf you\
    \ sweep your finger on the right side of the screen while an application is running,\
    \ you’ll bring \n\nup the standard list of charms: Search, Share, Devices, and\
    \ Settings. I’ll demonstrate in a later chapter \n\nhow your application can hook\
    \ into these charms. In particular, the Settings button often invokes a list \n\
    \nof options that can include About and Help as well as Settings. However, some\
    \ applications include an \n\nOptions item on the application bar, and the application\
    \ bar can also contain a Settings item. Indeed, \n\nStandardStyles.xaml includes\
    \ a *SettingsAppBarButtonStyle* that displays a gear icon and the word \n\n“Settings.”\
    \ How you divide program functionality among these items is up to you, but generally\
    \ you’ll \n\nuse an application bar Options button for items accessed more frequently\
    \ than the Settings and you’ll \n\nuse the Settings button on the application\
    \ bar for items accessed more frequently than those on the \n\nSettings charm.\
    \ \n\n**The Segoe UI Symbol Font **\n\nTo help you (and me) select symbols for\
    \ an application bar, I’ve written a program named \n\nSegoeSymbols that displays\
    \ all the characters from 0x0000 through 0x1FFFF in the Segoe UI Symbol \n\nfont,\
    \ which is the font specified by *AppBarButtonStyle*. \n\nAs you might know, Unicode\
    \ started out as a 16-bit character encoding with codes ranging from \n\n0x0000\
    \ through 0xFFFF. When it became evident that 65,536 code points were not sufficient,\
    \ Unicode \n\nbegan incorporating character codes in the range 0x10000 through\
    \ 0x10FFFF, increasing the number \n\nof characters to over 1.1 million. This\
    \ expansion of Unicode also included a system to represent these \n\nadditional\
    \ characters using a pair of 16-bit values. \n\nThe use of a 32-bit value to represent\
    \ a character code is known as UTF-32, or 32-bit Unicode \n\nTransformation Format.\
    \ But that’s a bit of misnomer because with UTF-32 there is no transformation:\
    \ a \n\none-to-one mapping exists from the 32-bit numeric codes to Unicode characters.\
    \ \n\nMost modern programming languages and operating systems instead support\
    \ UTF-16. For example, \n\nthe *Char* structure supported by the Windows Runtime\
    \ is basically a 16-bit integer, and that’s the basis \n\nfor the *char* data\
    \ type in C#. To represent the additional characters in the range 0x10000 through\
    \ \n\n0x10FFFF, UTF-16 uses two 16-bit characters in sequence. These are known\
    \ as *surrogates*, and a special \n\nrange of 16-bit codes in Unicode has been\
    \ set aside for their use. The leading surrogate is in the range \n\n0xD800 through\
    \ 0xDBFF, and the trailing surrogate is in the range 0xDC00 through 0xDFFF. That’s\
    \ \n\n233"
