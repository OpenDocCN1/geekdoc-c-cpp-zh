  md: "fired and the *IsModified* flag would be set by the *TextChanged* handler.\
    \ You might think that setting \n\nthe *IsModified* flag in that case might be\
    \ avoided by setting a flag when the *Text* property is set \n\nprogrammatically.\
    \ However, the *TextChanged* handler is not called until the method setting the\
    \ *Text* \n\nproperty has returned control back to the operating system, which\
    \ makes the logic rather messy. \n\nImplementing the *IsModified* flag in the\
    \ *TextBox* derivative helps. \n\n**Application Settings and Isolated Storage\
    \ **\n\nMany applications maintain user settings and preferences between invocations\
    \ of the program. The \n\nWindows Runtime provides an area of application data\
    \ storage (sometimes known as “isolated \n\nstorage”) specifically for the use\
    \ of the application in storing information of this sort. A program \n\nobtains\
    \ access to this storage through the *ApplicationData* class in the *Windows.Storage*\
    \ namespace. \n\nAn instance of *ApplicationData* applicable for the current application\
    \ is available from the static \n\n*ApplicationData.Current* method. From that\
    \ object, a *TemporaryFolder* property provides a disk area \n\nsuitable for temporary\
    \ data. Other properties—*LocalFolder*, *LocalSettings*, *RoamingFolder*, and\
    \ \n\n*RoamingSettings*—are also available for storing more permanent data. \n\
    \nThe *LocalSettings* property gives you access to a dictionary in which you can\
    \ store program settings \n\nwith names and values. But I don’t like to use this.\
    \ I prefer to store program settings in an XML file that \n\nis serialized from\
    \ a class in the program that I generally called *AppSettings*. This class implements\
    \ \n\n*INotifyPropertyChanged* so that it can be used for data binding. It’s basically\
    \ a View Model, or perhaps \n\n(in larger applications) part of a View Model.\
    \ An XML file serialized from *AppSettings* can be stored in \n\nthe *AppicationData.Current.LocalFolder*\
    \ directory, which, you’ll discover, maps to this location on the \n\nmachine’s\
    \ main drive: \n\n*/Users/\\[username\\]/AppData/Local/Packages/\\[package family\
    \ name\\]/LocalState *\n\nThe *\\[username\\]* is the user’s name on the computer,\
    \ and *\\[package family name\\]* is mostly a GUID that \n\nuniquely identifies\
    \ the application. For any Visual Studio application project you can find this\
    \ name by \n\nopening the Package.appmanifest file and clicking the Packaging\
    \ tab. \n\nOne program option that should be saved is the orientation of the edit\
    \ and display areas. As you’ll \n\nrecall, the *SplitContainer* has two properties\
    \ named *Orientation* and *SwapChildren*. For storing user \n\nsettings, I wanted\
    \ something more specific to this application. The *TextBox* (or rather, the \n\
    \n*TabbableTextBox*) can be on the left, top, right, or bottom, and this enumeration\
    \ encapsulates those \n\noptions: \n\n**Project: XamlCruncher | File: EditOrientation.cs\
    \ **\n\n`namespace`` XamlCruncher `\n\n`{ `\n\n` ``public`` ``enum`` ``EditOrientation``\
    \ `\n\n` { `\n\n` Left, Top, Right, Bottom `\n\n` } `\n\n271"
