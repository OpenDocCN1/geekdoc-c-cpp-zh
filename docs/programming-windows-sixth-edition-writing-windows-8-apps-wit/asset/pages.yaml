  md: "` VerticalAlignment = ``VerticalAlignment``.Center `\n\n`}; `\n\nEither way,\
    \ you can now compile and run the HelloCode project and the result should look\
    \ the same as \n\nthe XAML version. It looks the same because it basically *is*\
    \ the same. \n\nYou can alternatively create the *TextBlock* and add it to the\
    \ *Children* collection of the *Grid* in the \n\n*OnNavigatedTo* override. Or\
    \ you can create the *TextBlock* in the constructor, save it as a field, and add\
    \ \n\nit to the *Grid* in *OnNavigatedTo*. \n\nNotice that I put the code after\
    \ the *InitializeComponent* call in the *Page* constructor. You can create \n\n\
    the *TextBlock* prior to *InitializeComponent*, but you must add it to the *Grid*\
    \ after *InitializeComponent* \n\nbecause the *Grid* does not exist prior to that\
    \ call. The *InitializeComponent* method basically parses the \n\nXAML at run\
    \ time and instantiates all the XAML objects and puts them all together in a tree.\
    \ \n\n*InitializeComponent* is obviously an important method, which is why you\
    \ might be puzzled when you \n\ncan’t find it in the documentation. \n\nHere’s\
    \ the story: When Visual Studio compiles the application, it generates some intermediate\
    \ files. \n\nYou can find these files with Windows Explorer by navigating to the\
    \ HelloCode solution, the HelloCode \n\nproject, and then the obj and Debug directories.\
    \ Among the list of files are BlankPage.g.cs and \n\nBlankPage.g.i.cs. The “g”\
    \ stands for “generated.” Both these files define *BlankPage* classes derived\
    \ from \n\n*Page* with the *partial* keyword. The composite *BlankPage* class\
    \ thus consists of the BlankPage.xaml.cs \n\nfile under your control plus these\
    \ two generated files, which you don’t mess with. Although you don’t \n\nedit\
    \ these files, they are important to know about because they might pop up in Visual\
    \ Studio if a \n\nrun-time error occurs involving the XAML file. \n\nThe BlankPage.g.i.cs\
    \ file is the more interesting of the two. Here you’ll find the definition of\
    \ the \n\n*InitializeComponent* method, which calls a static method named *Application.LoadComponent*\
    \ to load \n\nthe BlankPage.xaml file. Notice also that this partial class definition\
    \ contains a private field named \n\n*contentGrid*, which is the name you’ve assigned\
    \ to the *Grid* in the XAML file. The *InitializeComponent* \n\nmethod concludes\
    \ by setting that field to the actual *Grid* object created by \n\n*Application.LoadComponent*.\
    \ \n\nThe *contentGrid* field is thus accessible throughout the *BlankPage* class,\
    \ but the value will be *null* \n\nuntil *InitializeComponent* is called. \n\n\
    In summary, parsing the XAML is a two-stage process. At compile time the XAML\
    \ is parsed to \n\nextract all the element names (among other tasks) and generate\
    \ the intermediate C# files in the obj \n\ndirectory. These generated C# files\
    \ are compiled along with the C# files under your control. At run time \n\nthe\
    \ XAML file is parsed again to instantiate all the elements, assemble them in\
    \ a visual tree, and obtain \n\nreferences to them. \n\nWhere is the standard\
    \ *Main* method that serves as an entry point to any C# program? That’s in \n\n\
    App.g.i.cs, one of two files generated by Visual Studio based on App.xaml. \n\n\
    Let me show you something else that will serve as just a little preview of dependency\
    \ properties: \n\n36"
