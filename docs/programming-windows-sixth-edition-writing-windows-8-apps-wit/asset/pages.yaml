  md: "` }; `\n\n` `\n\n` ``TextBlock`` txtblkName = ``new`` ``TextBlock`` `\n\n`\
    \ { `\n\n` Text = property.Name, `\n\n` FontSize = 24 `\n\n` }; `\n\n` vertStackPanel.Children.Add(txtblkName);\
    \ `\n\n` `\n\n` ``TextBlock`` txtblkRgb = ``new`` ``TextBlock`` `\n\n` { `\n\n\
    ` Text = ``String``.Format(``\"{0:X2}-{1:X2}-{2:X2}-{3:X2}\"``, `\n\n` clr.A,\
    \ clr.R, clr.G, clr.B), `\n\n` FontSize = 18 `\n\n` }; `\n\n` vertStackPanel.Children.Add(txtblkRgb);\
    \ `\n\n` `\n\n` ``StackPanel`` horzStackPanel = ``new`` ``StackPanel`` `\n\n`\
    \ { `\n\n` Orientation = ``Orientation``.Horizontal `\n\n` }; `\n\n` `\n\n` ``Rectangle``\
    \ rectangle = ``new`` ``Rectangle`` `\n\n` { `\n\n` Width = 72, `\n\n` Height\
    \ = 72, `\n\n` Fill = ``new`` ``SolidColorBrush``(clr), `\n\n` Margin = ``new``\
    \ ``Thickness``(6) `\n\n` }; `\n\n` horzStackPanel.Children.Add(rectangle); `\n\
    \n` horzStackPanel.Children.Add(vertStackPanel); `\n\n` stackPanel.Children.Add(horzStackPanel);\
    \ `\n\n` } `\n\n` } `\n\n`} `\n\nNow, there’s nothing really wrong with this code,\
    \ except that there are numerous ways to do it \n\nbetter, and by “better” I don’t\
    \ mean faster or more efficient but cleaner and more elegant and—most \n\nimportantly—easier\
    \ to maintain and modify. \n\nLet’s look at a better solution, but at the same\
    \ time be aware that I won’t be finished with this \n\nexample until a future\
    \ chapter, where you’ll see not only a better way of doing it, but the *best*\
    \ way of \n\ndoing it. \n\nThe key to making this program better is expressing\
    \ those color items—the nested *StackPanel* and \n\n*TextBlock* and *Rectangle*—in\
    \ XAML. Just offhand, this doesn’t seem possible. We can’t put this XAML in \n\
    \nthe BlankPage.xaml file because we can’t tell XAML to make 141 instances of\
    \ the item unless we \n\nactually paste in 141 copies, and I suspect we’re all\
    \ agreed that would be the *worst* way to do it. \n\nThe ColorList2 program shows\
