  md: "*RequestedTheme* to *Light* when you implement an application bar or the buttons\
    \ fade into the \n\nbackground. Because a dark theme is in effect here, this dialog\
    \ will have a black background with a \n\nwhite foreground. \n\nAll of the dialogs\
    \ that I’ve seen in Metro style applications have a white background and black\
    \ \n\nforeground. However, I’ve had frustrating experiences trying to flip the\
    \ colors in the dialog box. You \n\ncan set the *Grid* background to *ApplicationTextBrush*\
    \ or explicitly to white, but setting the *Foreground* \n\non the root element\
    \ does not property propagate to the *RadioButton* controls, and even explicitly\
    \ \n\nsetting *Foreground* on the individual controls (or using a style) does\
    \ not color them properly. \n\nThis means that the dialogs in this book will have\
    \ a black background and white foreground until \n\nthe controls are fixed or\
    \ more guidance comes from above. \n\nThe code-behind file for the dialog defines\
    \ a dependency property named *TextWrapping* of type \n\n*TextWrapping*. The property-changed\
    \ handler checks a *RadioButton* when this property is set, and the \n\nproperty\
    \ is set when a user checks a *RadioButton*: \n\n**Project: MetroPad1 | File:\
