    \ with the program’s default settings. Notice that the *EditOrientation* property\
    \ \n\nis based on the *EditOrientation* enumeration: \n\n**Project: XamlCruncher\
    \ | File: AppSettings.cs **\n\n`public`` ``class`` ``AppSettings`` : XamlCruncher.Common.``BindableBase``\
    \ `\n\n`{ `\n\n` ``… `\n\n` ``// Application settings initial values`` `\n\n`\
    \ ``EditOrientation`` editOrientation = ``EditOrientation``.Left; `\n\n` ``Orientation``\
    \ orientation = ``Orientation``.Horizontal; `\n\n` ``bool`` swapEditAndDisplay\
    \ = ``false``; `\n\n` ``bool`` autoParsing = ``false``; `\n\n` ``bool`` showRuler\
