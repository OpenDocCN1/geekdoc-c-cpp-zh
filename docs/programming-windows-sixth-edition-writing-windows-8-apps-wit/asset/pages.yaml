  md: "The *TappedEventHandler* is defined in the *Windows.UI.Xaml.Input* namespace.\
    \ It’s a delegate type that \n\ndefines the signature of the event handler: \n\
    \n`public`` ``delegate`` ``void`` ``TappedEventHandler``(``object`` sender, ``TappedRoutedEventArgs``\
    \ e); `\n\nIn the event handler, the first argument indicates the source of the\
    \ event (which is always an instance \n\nof a class that derives from *UIElement*)\
    \ and the second argument provides properties and methods \n\nspecific to the\
    \ *Tapped* event. \n\nThe XAML file for the TapTextBlock program defines a *TextBlock*\
    \ with a *Name* attribute as well as a \n\nhandler for the *Tapped* event: \n\n\
    **Project: TapTextBlock | File: BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\\
    =\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``TextBlock``\
    \ Name``\\=\"txtblk\"`` `\n\n` `` Text``\\=\"Tap Text!\"`` `\n\n` `` FontSize``\\\
    =\"96\"`` `\n\n` `` HorizontalAlignment``\\=\"Center\"`` `\n\n` `` VerticalAlignment``\\\
    =\"Center\"`` `\n\n` `` Tapped``\\=\"txtblk\\_Tapped\\_1\" />`` `\n\n`</``Grid``\\\
    >`` `\n\nAs you type *TextBlock* attributes in XAML, IntelliSense suggests events\
    \ as well as properties. These are \n\ndistinguished with little icons: a wrench\
    \ for properties and a lightning bolt for events. (You’ll also see a \n\nfew with\
    \ pairs of curly brackets. These are attached properties that I’ll describe in\
    \ Chapter 4, \n\n“Presentation with Panels.”) If you allow it, IntelliSense also\
    \ suggests a name for the event handler, and \n\nI let it choose this one. Based\
    \ solely on the XAML syntax, you really can’t tell which attributes are \n\nproperties\
    \ and which are events. \n\nThe actual event handler is implemented in the code-behind\
    \ file. If you allow Visual Studio to select \n\na handler name for you, you’ll\
    \ discover that Visual Studio also creates a skeleton event handler in the \n\n\
    BlankPage.xaml.cs file: \n\n`private`` ``void`` txtblk\\_Tapped\\_1(``object``\
    \ sender, ``TappedRoutedEventArgs`` e) `\n\n`{ `\n\n` `\n\n`} `\n\nThis is the\
    \ method that is called when the user taps the *TextBlock*. In future projects,\
    \ I’ll change the \n\nnames of event handlers to make them more to my liking.\
    \ I’ll remove the *private* keyword (because \n\nthat’s the default), I’ll change\
    \ the name to eliminate underscores and preface it with the word *On* (for \n\n\
    example *OnTextBlockTapped*), and I’ll change the argument named *e* to *args*.\
    \ In theory, you should be \n\nable to rename the method in the code file and\
    \ then click a little global-rename icon to rename the \n\nmethod in the XAML\
    \ file as well, but that doesn’t seem to work in the current version of Visual\
    \ Studio. \n\nFor this sample program, I decided I want to respond to the tap\
    \ by setting the *TextBlock* to a \n\nrandom color. In preparation for that job,\
    \ I defined fields for a *Random* object and a *byte* array for the \n\nred, green,\
    \ and blue bytes: \n\n79"
