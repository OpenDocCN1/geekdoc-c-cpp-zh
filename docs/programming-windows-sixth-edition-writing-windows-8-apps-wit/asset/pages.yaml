    \ = backgroundBrush; `\n\n`} `\n\nThe two brushes are created with two different\
    \ styles of property initialization, but otherwise they’re \n\nbasically the same.\
    \ The *LinearGradientBrush* class defines two properties named *StartPoint* and\
    \ \n\n*EndPoint* of type *Point*, which is a structure with *X* and *Y* properties\
    \ representing a two-dimensional \n\ncoordinate point. The *StartPoint* and *EndPoint*\
    \ properties are relative to the object to which the brush is \n\napplied based\
    \ on the standard windowing coordinate system: *X* values increase to the right\
    \ and *Y* \n\nvalues increase going down. The relative point (0, 0) is the upper-left\
    \ corner and (1, 0) is the \n\nupper-right corner, so the brush gradient extends\
    \ along an imaginary line between these two points, \n\nand all lines parallel\
    \ to that line. The *StartPoint* and *EndPoint* defaults are (0, 0) and (1, 1),\
    \ which defines \n\na gradient from the upper-left to the lower-right corners\
    \ of the target object. \n\n*LinearGradientBrush* also has a property named *GradientStops*\
    \ that is a collection of *GradientStop* \n\nobjects. Each *GradientStop* indicates\
    \ an *Offset* relative to the gradient line and a *Color* at that offset. \n\n\
    Generally the offsets range from 0 to 1, but for special purposes they can go\
    \ beyond the range \n\nencompassed by the brush. *LinearGradientBrush* defines\
    \ additional properties to indicate how the \n\ngradient is calculated and what\
    \ happens beyond the smallest *Offset* and the largest *Offset*. \n\nHere’s the\
    \ result: \n\n \n\nIf you now consider defining these same brushes in XAML, all\
