  md: " \n\n \n\n \n\n \n\n \n\n*Grid* \n\n \n\n \n\n \n\n \n\n*Control* \n\n \n\n\
    \ \n\n \n\n \n\n \n\n*UserControl* \n\n \n\n \n\n \n\n \n\n \n\n \n\n*Page *\n\
    \n*Page* derives from *Control* but *TextBlock* and *Image* do not. *TextBlock*\
    \ and *Image* instead derive from \n\n*UIElement* and *FrameworkElement*. For\
    \ that reason, *TextBlock* and *Image* are more correctly referred to \n\nas \"\
    elements,\" the same word often used to describe items that appear in XML files.\
    \ \n\nThe distinction between an element and a control is not always obvious.\
    \ Visually, controls are built \n\nfrom elements, and the visual appearance of\
    \ the control can be customizable through a template. But \n\nthe distinction\
    \ is useful nonetheless. A *Grid* is also an element, but it's more often referred\
    \ to as a \n\n“panel,” and that (as you'll see) is a very useful distinction.\
    \ \n\nTry this: In the original Hello program move the *Foreground* attribute\
    \ and all the font-related \n\nattributes from the *TextBlock* element to the\
    \ *Page*. The entire BlankPage.xaml file now looks like this: \n\n`<``Page`` `\n\
