    \ (if you tap \n\nbetween the text), so the new event handler must perform a check\
    \ before casting: \n\n**Project: RoutedEvents1 | File: BlankPage.xaml.cs (excerpt)\
    \ **\n\n`void`` OnGridTapped(``object`` sender, ``TappedRoutedEventArgs`` args)\
    \ `\n\n`{ `\n\n` ``if`` (args.OriginalSource ``is`` ``TextBlock``) `\n\n` { `\n\
    \n` ``TextBlock`` txtblk = args.OriginalSource ``as`` ``TextBlock``; `\n\n` rand.NextBytes(rgb);\
    \ `\n\n` ``Color`` clr = ``Color``.FromArgb(255, rgb\\[0\\], rgb\\[1\\], rgb\\\
    [2\\]); `\n\n` txtblk.Foreground = ``new`` ``SolidColorBrush``(clr); `\n\n` }\
    \ `\n\n`} `\n\n*TappedRoutedEventArgs* derives from *RoutedEventArgs*, which defines\
    \ *OriginalSource* and no other \n\nproperties. Obviously, the *OriginalSource*\
