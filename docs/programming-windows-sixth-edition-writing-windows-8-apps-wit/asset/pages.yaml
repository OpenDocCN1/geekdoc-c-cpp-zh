  md: "Chapter 7 \n\n**Building an Application **\n\nEven after becoming familiar\
    \ with various features of the Windows Runtime, putting it all together to \n\n\
    create an application can still be a challenge. For that reason, this chapter\
    \ is mostly devoted to building \n\na rather larger application than anything\
    \ else in this book. \n\nXamlCruncher features a multiline *TextBox* for editing\
    \ a XAML file and a display area that shows the \n\nvisual tree created by running\
    \ that XAML through the *XamlReader.Load* method. I demonstrated \n\n*XamlReader.Load*\
    \ briefly in Chapter 2, “XAML Syntax,” when I used it to convert some XAML path\
    \ \n\nmarkup syntax to a *PathGeometry* object. The method can handle more complex\
    \ visual trees, and a \n\ntool such as XamlCruncher is very useful for interactively\
    \ experimenting with XAML and learning about \n\nit. \n\nXamlCruncher also features\
    \ some custom controls, and it demonstrates common application needs: \n\n• \n\
    \nAn application bar \n\n• \n\nA pop-up dialog (or “popup”) for customizing program\
    \ settings \n\n• \n\nSaving and retrieving user settings in isolated application\
    \ storage \n\n• \n\nSaving and retrieving files in the Documents area \n\nI’ll\
    \ add additional features to XamlCruncher in future chapters. \n\nTwo aspects\
    \ of this job—file input/output and asynchronous operations—are the subjects of\
    \ future \n\nchapters as well, but it will be necessary to at least become acquainted\
    \ with these topics in this chapter. \n\nTo allow me to focus more sharply on\
    \ these two topics, I’ll discuss them in connection with a simpler \n\nprogram\
    \ with fewer features called MetroPad, which is similar to the traditional Windows\
    \ Notepad \n\nprogram. \n\n**Commands, Options, and Settings **\n\nThe Windows\
    \ Runtime supports several methods for applications to implement commands and\
    \ \n\nprogram options. The most important is the application bar, which is intended\
    \ to implement basic \n\nprogram commands in a manner similar to a traditional\
    \ menu or toolbar. The application bar is a class \n\nnamed *AppBar*, and it’s\
    \ invoked when the user sweeps a finger on the top or bottom of the screen. The\
    \ \n\napplication bar then often disappears when a command has been selected.\
    \ \n\nAn application bar can appear at the top of the page, or the bottom, or\
    \ both. The *Page* class defines \n\ntwo properties named *TopAppBar* and *BottomAppBar*\
    \ that you generally set to *AppBar* tags in XAML. \n\n231"
