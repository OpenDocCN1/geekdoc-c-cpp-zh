- img_proc: true
  md: "Although *RangeBaseValueChangedEventArgs* derives from *RoutedEvent*, this\
    \ is not a routed event. \n\nThe event does not travel up the visual tree. The\
    \ *sender* argument is always the *Slider*, and the \n\n*OriginalSource* property\
    \ of the event arguments is always *null*. \n\nWhen you run the program, you’ll\
    \ notice that the *TextBlock* elements initially display nothing. The \n\n*ValueChanged*\
    \ event is not fired until *Value* actually changes from its default value of\
    \ zero. \n\nAs you touch a *Slider* or click it with a mouse, the value jumps\
    \ to that position. You can then sweep \n\nyour finger or mouse pointer back and\
    \ forth to change the value. As you manipulate the *Slider* \n\ncontrols, you’ll\
    \ see that they let you select values from 0 to 100, inclusive: \n\n \n\nThis\
    \ default range is a result of the default values of the *Minimum* and *Maximum*\
    \ properties, which are \n\n0 and 100, respectively.. Although the *Value* property\
    \ is a *double*, it takes on integral values as a result \n\nof the default *StepFrequency*\
    \ property, which is 1. \n\nBy default the *Slider* is oriented horizontally,\
    \ but you can switch to vertical with the *Orientation* \n\nproperty. The height\
    \ of the slider area cannot be changed (except if you redefine the visuals with\
    \ a \n\ntemplate). The total height of the control in layout includes a bit more\
    \ space. In layout, the default \n\nheight of a horizontal *Slider* is 60 pixels;\
    \ the default width of a vertical *Slider* is 45 pixels. In use, these \n\ndimensions\
    \ are adequate for touch purposes. \n\nIf you repeatedly press the Tab key while\
    \ this program is running, you can change the keyboard \n\ninput focus from one\
    \ *Slider* to another and then use the keyboard arrow keys to make the value go\
    \ up \n\nor down. Pressing Home and End shoots to the minimum and maximum values.\
    \ \n\nSome other variations are illustrated in the SliderBindings project, where\
    \ all the updating logic is \n\nincorporated right in the XAML file. Three *Slider*\
    \ controls are instantiated in a *StackPanel* and \n\nalternated with *TextBlock*\
    \ elements with bindings to the *Value* properties of each *Slider*. An implicit\
    \ \n\nstyle for the *TextBlock* is defined to reduce markup: \n\n![](img/bc006cce5c2364a011861f29233d37ef_153_0.png)\n\
    \n154"
