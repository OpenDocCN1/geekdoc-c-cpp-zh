  md: "*View ** View Model ** Model *\n\nCalls in the other direction are not allowed\
    \ except for events. The Model can define an event that the \n\nView Model handles,\
    \ and the View Model can define an event that the View handles. Events allow the\
    \ \n\nView Model (for example) to signal to the View that updated data is available.\
    \ The View can then call \n\ninto the View Model to obtain that updated data.\
    \ \n\nMost often, the View and View Model interact through data bindings and commands.\
    \ \n\nConsequently, many of the method calls and event handling actually occurs\
    \ under the covers. These \n\ndata bindings and commands serve to allow three\
    \ types of interactions: \n\n• \n\nThe View can transfer user input to the View\
    \ Model. \n\n• \n\nThe View Model can notify the View when updated data is available.\
    \ \n\n• \n\nThe View can obtain and display updated data from the View Model.\
    \ \n\nOne of the goals inherent in MVVM is to minimize the code-behind file—at\
    \ least on the page or \n\nwindow level. MVVM mavens are happiest when all the\
    \ connections between the View and View Model \n\nare accomplished through bindings\
    \ in the XAML file. \n\n**Data Binding Notifications **\n\nIn Chapter 5, “Control\
    \ Interaction,” you saw data bindings that looked like this: \n\n`<``TextBlock``\
    \ Text``\\=\"{``Binding`` ElementName``\\=slider,`` Path``\\=Value}\" />`` `\n\
    \nThis is a binding between two *FrameworkElement* derivatives. The target of\
    \ this data binding is the *Text* \n\nproperty of the *TextBlock*. The binding\
    \ source is the *Value* property of a *Slider* identified by the name \n\n*slider*.\
    \ Both the target and source properties are backed by dependency properties. This\
    \ is a \n\nrequirement for the binding target but not (as you’ll see) for the\
    \ source. \n\nWhenever the *Value* property of the *Slider* changes, the text\
    \ displayed by the *TextBlock* changes \n\naccordingly. How does this work? When\
    \ the binding source is a dependency property, the actual \n\nmechanism is internal\
    \ to the Windows Runtime. Undoubtedly an event is involved. The *Binding* object\
    \ \n\ninstalls a handler for an event that provides a notification when the *Value*\
    \ property of the *Slider* \n\nchanges, and the *Binding* object sets that changed\
    \ value to the *Text* property of the *TextBlock*. This \n\nshouldn’t be very\
    \ mysterious, considering that *Slider* has a public *ValueChanged* event that\
    \ is also fired \n\nwhen the *Value* property changes. \n\nWhen implementing a\
    \ View Model, the data bindings are a little different: the binding targets are\
    \ \n\nstill elements in the XAML file, but the binding sources are properties\
    \ in the View Model class. This is \n\nthe basic way that the View Model and the\
    \ View (the XAML file) transfer data back and forth. \n\nA binding source is not\
    \ required to be backed by a dependency property. But in order for the \n\nbinding\
    \ to work properly, the binding source must implement some other kind of notification\
    \ \n\n206"
