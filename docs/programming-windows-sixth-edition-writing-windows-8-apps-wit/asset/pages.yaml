  md: "` `` Stretch``\\=\"Fill\" />`` `\n\n`</``Grid``\\>`` `\n\nNow the aspect ratio\
    \ is ignored and the bitmap fills the container: \n\n \n\nSet the *Stretch* property\
    \ to *None* to display the image in its pixel dimensions (320 by 400): \n\n \n\
    \nYou can control where it appears on the page by using the same *HorizontalAlignment*\
    \ and \n\n*VerticalAlignment* properties you use with *TextBlock*. \n\nThe fourth\
    \ option for the *Stretch* property is *UniformToFill*, which respects the aspect\
    \ ratio but fills \n\nthe container regardless. It achieves this feat by the only\
