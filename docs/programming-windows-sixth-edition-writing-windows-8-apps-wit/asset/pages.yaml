  md: " \n\nYou can view either of these two files by double-clicking the file name\
    \ or by right-clicking the file \n\nname and choosing Open. \n\nThe BlankPage.xaml\
    \ and BlankPage.xaml.cs files are linked in the Solution Explorer because they\
    \ \n\nboth contribute to the definition of a class named *BlankPage*. For a simple\
    \ program like Hello, this \n\n*BlankPage* class defines all the visuals and user\
    \ interface for the application. As the class name implies, \n\nthe visuals are\
    \ initially \"blank,\" but they won't be for long. \n\nDespite its funny file\
    \ name, BlankPage.xaml.cs definitely has a .cs extension, which stands for \"\
    C \n\nSharp.\" Stripped of all its comments, the skeleton BlankPage.xaml.cs file\
    \ contains C# code that looks \n\nlike this: \n\n`using`` System; `\n\n`using``\
