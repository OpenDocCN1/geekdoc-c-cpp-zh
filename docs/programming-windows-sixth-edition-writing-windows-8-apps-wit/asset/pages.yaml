    \ \n\n \n\nThe editor doesn’t include any amenities. It won’t even automatically\
    \ generate a closing tag when you \n\ntype a start tag; it doesn’t use different\
    \ colors for elements, attributes, and strings; and it doesn’t have \n\nanything\
    \ close to IntelliSense. However, the configuration of the page is changeable:\
    \ you can put the \n\nedit window on the top, right, or bottom. \n\nThe application\
    \ bar has Add, Open, Save, and Save As buttons as well as a Refresh button and\
    \ a \n\nbutton for application options: \n\n![](img/bc006cce5c2364a011861f29233d37ef_255_0.png)\n\
    \n256"
