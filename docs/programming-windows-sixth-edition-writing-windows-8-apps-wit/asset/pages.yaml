    \ and equals an *Exception* object that describes the problem. (For the most part\
    \ I \n\nwill be ignoring errors in this little exercise.) Otherwise, the *Completed*\
    \ handler calls *GetResults* on the \n\n*IAsyncOperation* object. This returns\
