  md: "Chapter 2 \n\n**XAML Syntax **\n\nA Metro style application is divided into\
    \ code and markup because each has its own strength. Despite \n\nthe limitations\
    \ of markup in performing complex logic or computational tasks, it’s good to get\
    \ as much \n\nof a program into markup as possible. Markup is easier to edit with\
    \ tools and shows a clearer sense of \n\nthe visual layout of a page. Of course,\
    \ everything in markup is a string, so markup sometimes becomes \n\ncumbersome\
    \ in representing complex objects. Because markup doesn’t have the loop processing\
    \ \n\ncommon in programming languages, it can also be prone to repetition. \n\n\
    These issues have been addressed in the syntax of XAML in several ways, the most\
    \ important of \n\nwhich are explored in this chapter. But let me begin this vital\
    \ subject with a topic that will at first \n\nappear to be completely unrelated:\
    \ defining a gradient brush. \n\n**The Gradient Brush in Code **\n\nThe *Background*\
    \ property in *Grid* and the *Foreground* property of the *TextBlock* are both\
    \ of type *Brush*. \n\nThe programs shown so far have set these properties to\
    \ a derivative of *Brush* called *SolidColorBrush*. As \n\ndemonstrated in Chapter\
    \ 1, “Markup and Code,” you can create a *SolidColorBrush* in code and give it\
    \ a \n\n*Color* value; in XAML this is done for you behind the scenes. \n\n*SolidColorBrush*\
    \ is only one of four available brushes, as shown in this class hierarchy: \n\n\
    *Object *\n\n*DependencyObject *\n\n*Brush *\n\n*SolidColorBrush *\n\n*GradientBrush\
    \ *\n\n*LinearGradientBrush *\n\n*TileBrush *\n\n*ImageBrush *\n\n*WebViewBrush*\
    \ \n\nOnly *SolidColorBrush*, *LinearGradientBrush*, *ImageBrush*, and *WebViewBrush*\
    \ are instantiable. Like many \n\nother graphics-related classes, most of these\
    \ brush classes are defined in the *Windows.UI.Xaml.Media* \n\nnamespace, although\
    \ *WebViewBrush* is defined in *Windows.UI.Xaml.Controls*. \n\nThe *LinearGradientBrush*\
    \ creates a gradient between two or more colors. For example, suppose you \n\n\
    want to display some text with blue at the left gradually turning to red at the\
    \ right. While we’re at it, \n\nlet’s set a similar gradient on the *Background*\
    \ property of the *Grid* but going the other way. \n\n42"
