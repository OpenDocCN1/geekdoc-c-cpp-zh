  md: "As I mentioned earlier, many properties that we’ve been dealing with—*FontFamily*,\
    \ *FontSize*, \n\n*FontStyle*, *Foreground*, *Text*, *HorizontalAlignment*, and\
    \ *VerticalAlignment*—have corresponding static \n\ndependency properties, named\
    \ *FontFamilyProperty*, *FontSizeProperty*, and so forth. You might amuse \n\n\
    yourself by changing a normal statement like this: \n\n`txtblk.FontStyle = ``FontStyle``.Italic;\
    \ `\n\nto an alternative that might look quite peculiar: \n\n`txtblk.SetValue(``TextBlock``.FontStyleProperty,\
    \ ``FontStyle``.Italic); `\n\nWhat you’re doing here is calling a method named\
    \ *SetValue* defined by *DependencyObject* and \n\ninherited by *TextBlock*. You’re\
    \ calling this method on the *TextBlock* object but passing to it the static \n\
    \n*FontStyleProperty* object of type *DependencyProperty* defined by *TextBlock*\
    \ and the value you want for \n\nthat property. There is no real difference between\
    \ these two ways of setting the *FontStyle* property. \n\nWithin *TextBlock*,\
    \ the *FontStyle* property is very likely defined like this: \n\n`public`` ``FontStyle``\
    \ FontStyle `\n\n`{ `\n\n` ``set`` `\n\n` { `\n\n` SetValue(``TextBlock``.FontStyleProperty,\
    \ ``value``); `\n\n` } `\n\n` ``get`` `\n\n` { `\n\n` ``return`` (``FontStyle``)GetValue(``TextBlock``.FontStyleProperty);\
    \ `\n\n` } `\n\n`} `\n\nI say “very likely” because I’m not privy to the Windows\
    \ Runtime source code, but if the *FontStyle* \n\nproperty is defined like all\
    \ other properties backed by dependency properties, the *set* and *get* accessors\
    \ \n\nsimply call *SetValue* and *GetValue* with the *TextBlock.FontStyleProperty*\
    \ dependency property. This is \n\nextremely standard code, and it’s a pattern\
    \ you’ll come to be so familiar with that you’ll generally \n\ndefine your own\
    \ dependency properties without so much white space like this: \n\n`public`` ``FontStyle``\
    \ FontStyle `\n\n`{ `\n\n` ``set`` { SetValue(``TextBlock``.FontStyleProperty,\
    \ ``value``); } `\n\n` ``get`` { ``return`` (``FontStyle``)GetValue(``TextBlock``.FontStyleProperty);\
    \ } `\n\n`} `\n\nEarlier you saw how you can set the *Foreground* and font-related\
    \ properties on the *Page* rather than \n\nthe *TextBlock* and how these properties\
    \ are inherited by the *TextBlock*. Of course you can do the same \n\nthing in\
    \ code: \n\n`public`` BlankPage() `\n\n`{ `\n\n` ``this``.InitializeComponent();\
    \ `\n\n` `\n\n` ``this``.FontFamily = ``new`` ``FontFamily``(``\"Times New Roman\"\
    ``); `\n\n` ``this``.FontSize = 96; `\n\n37"
