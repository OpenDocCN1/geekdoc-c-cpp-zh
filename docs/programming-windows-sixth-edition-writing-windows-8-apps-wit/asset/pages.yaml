  md: "**Introduction **\n\nThis book—the 6^(th) edition of *Programming Windows*—is\
    \ a guide to programming applications that run \n\nunder Microsoft Windows 8.\
    \ At the time of this writing (May 1, 2012), Windows 8 is not yet complete \n\n\
    and neither is this book. What you are reading right now is a preview ebook version\
    \ of the book. This \n\npreview version is based on the Consumer Preview of Windows\
    \ 8, which was released on February 29, \n\n2012\\. Microsoft has announced that\
    \ the next preview of Windows 8—called the Release Preview—will \n\nbe available\
    \ in June. The second preview ebook version of this book, which will update the\
    \ seven \n\nchapters included here and add more chapters, will probably be available\
    \ in July. If you are reading this \n\nin August 2012 or later, you are very likely\
    \ not reading the most recent version. \n\nTo use this book, you’ll need to download\
    \ and install the Windows 8 Consumer Preview, as well as \n\nMicrosoft Visual\
    \ Studio 11 Express Beta for Windows 8. Both downloads are accessible from the\
    \ \n\nWindows 8 developer portal: \n\nhttp://msdn.microsoft.com/windows/apps\n\
    \nTo install Visual Studio, follow the “Download the tools and SDK” link on that\
    \ page. \n\n**The Versions of Windows 8 **\n\nFor the most part, Windows 8 is\
    \ intended to run on the same class of personal computers as Windows \n\n7, which\
    \ are machines built around the 32-bit or 64-bit Intel x86 microprocessor family.\
    \ When \n\nWindows 8 is released later this year, it will be available in a regular\
    \ edition called simply Windows 8 \n\nand also a Windows 8 Pro edition with additional\
    \ features that appeal to tech enthusiasts and \n\nprofessionals. \n\nBoth Windows\
    \ 8 and Windows 8 Pro will run two types of programs: \n\n• \n\nDesktop applications\
    \ \n\n• \n\nWhat are currently referred to as “Metro style” applications \n\n\
    Desktop applications are traditional Windows programs that currently run under\
    \ Windows 7 and that \n\ninteract with the operating system through the Windows\
    \ application programming interface, known \n\nfamiliarly as the Win32 API. Windows\
    \ 8 includes a familiar Windows desktop screen for running these \n\napplications.\
    \ \n\nThe applications known as “Metro style” are new with Windows 8. These applications\
    \ incorporate \n\nthe “Metro” design paradigm developed at Microsoft, so named\
    \ because it’s been inspired by public \n\nsignage common in metropolitan areas.\
    \ Metro design is characterized by the use of unadorned fonts, \n\nclean open\
    \ styling, and a tile-based interface. \n\n6"
  merge: -1
  pgno: 5
- img_proc: true
  md: "Internally and externally, Metro style applications represent a radical break\
    \ with traditional \n\nWindows. The programs generally run in a full-screen mode—although\
    \ two programs can share the \n\nscreen in a “snap” mode—and many of these programs\
    \ will probably be optimized for touch and tablet \n\nuse. Metro style applications\
    \ will be purchasable and installable only from an application store run by \n\
    \nMicrosoft. \n\nIn addition to the versions of Windows 8 that run on x86 processors,\
    \ there will also be a version of \n\nWindows 8 that runs on ARM processors, most\
    \ likely in low-cost smartphones and tablets. This version \n\nof Windows 8 will\
    \ be called Windows RT, and it will come preinstalled on these machines. Aside\
    \ from \n\nsome preinstalled desktop applications, Windows RT will run Metro style\
    \ applications only. \n\nMany developers were first introduced to Metro design\
    \ principles with Windows Phone 7, so it’s \n\ninteresting to see how Microsoft’s\
    \ thinking concerning large and small computers has evolved. In years \n\ngone\
    \ by, Microsoft attempted to adapt the design of the traditional Windows desktop\
    \ to smaller \n\ndevices such as hand-held computers and phones. Now a user-interface\
    \ design for the phone is being \n\nmoved up to tablets and the desktop. \n\n\
    One important characteristic of this new environment is an emphasis on multitouch,\
    \ which has \n\ndramatically changed the relationship between human and computer.\
    \ In fact, the term \"multitouch\" is \n\nnow outmoded because virtually all new\
    \ touch devices respond to multiple fingers. The simple word \n\n\"touch\" is\
    \ now sufficient. Part of the new programming interface for Metro style applications\
    \ treats \n\ntouch, the mouse, and a stylus in a unified manner so that applications\
    \ are automatically usable with all \n\nthree input devices. \n\n**The Focus of\
    \ This Book **\n\nThis book focuses exclusively on writing Metro style applications.\
    \ Plenty of other books already exist \n\nfor writing desktop applications, including\
    \ the 5^(th) edition of *Programming Windows*. \n\nFor writing Metro style applications,\
    \ a new object-oriented API has been introduced called the \n\nWindows Runtime\
    \ or WinRT (not to be confused with the version of Windows 8 that runs on ARM\
    \ \n\nprocessors, called Windows RT). Internally, the Windows Runtime is based\
    \ on COM (Component Object \n\nModel) with interfaces exposed through metadata\
    \ files with the extension .winmd located in the \n\n*/Windows/System32/WinMetadata*\
    \ directory. \n\nFrom the application programmer’s perspective, the Windows Runtime\
    \ resembles Silverlight, \n\nalthough internally it is not a managed API. For\
    \ Silverlight programmers, perhaps the most immediate \n\ndifference involves\
    \ namespace names: the Silverlight namespaces beginning with *System.Windows*\
    \ \n\nhave been replaced with namespaces beginning with *Windows.UI.Xaml*. \n\n\
    Most Metro style applications will be built from both code and markup, either\
    \ the industry-standard \n\nHyperText Markup Language (HTML) or Microsoft’s eXtensible\
    \ Application Markup Language (XAML). \n\nOne advantage of splitting an application\
    \ between code and markup is potentially splitting the \n\n7"
  merge: -1
  pgno: 6
- img_proc: true
  md: "development of the application between programmers and designers. \n\nCurrently\
    \ there are three main options for writing Metro style applications, each of which\
    \ involves a \n\nprogramming language and a markup language: \n\n• \n\nC++ with\
    \ XAML \n\n• \n\nC# or Visual Basic with XAML \n\n• \n\nJavaScript with HTML5\
    \ \n\nIn each case, the Windows Runtime is supplemented by another programming\
    \ interface appropriate \n\nfor that language. Although you can’t mix languages\
    \ within a single application, you can create \n\nlanguage-independent libraries\
    \ with their own .winmd files. \n\nThe C++ programmer uses a dialect of C++ called\
    \ C++ with Component Extensions, or C++/CX, \n\nthat allows the language to make\
    \ better use of WinRT. The C++ programmer also has access to a \n\nsubset of the\
    \ Win32 and COM APIs, as well as DirectX. \n\nProgrammers who use the managed\
    \ languages C# or Visual Basic .NET will find WinRT to be very \n\nfamiliar territory.\
    \ Metro style applications written in these languages can’t access Win32, COM,\
    \ or \n\nDirectX APIs, but a stripped-down version of .NET is available for performing\
    \ low-level tasks. \n\nFor JavaScript, the Windows Runtime is supplemented by\
    \ a Windows Library for JavaScript, or \n\nWinJS, which provides a number of system-level\
    \ features for Metro style apps written in JavaScript. \n\nAfter much consideration\
    \ (and some anguish), I decided that this book would use the C# and XAML \n\n\
    option exclusively. For at least a decade I have been convinced of the advantages\
    \ of managed \n\nlanguages for development and debugging, and for me C# is the\
    \ language that has the closest fit to \n\nthe Windows Runtime. I hope C++ programmers\
    \ find C# code easy enough to read to derive some \n\nbenefit from this book.\
    \ \n\nI also believe that a book focusing on one language option is more valuable\
    \ than one that tries for \n\nequal coverage among several. There will undoubtedly\
    \ be plenty of other Windows 8 books that show \n\nhow to write Metro style applications\
    \ using the other options. \n\n**The Approach **\n\nIn writing this book, I’ve\
    \ made a couple assumptions about *you*, the reader. I assume that you are \n\n\
    comfortable with C#. If not, you might want to supplement this book with a C#\
    \ tutorial. If you are \n\ncoming to C# from a C or C++ background, my free online\
    \ book *.NET Book Zero: What the C or C++ *\n\n*Programmer Needs to Know About\
    \ C# and the .NET Framework* might be adequate. This book is \n\navailable in\
    \ PDF or XPS format at www.charlespetzold.com/dotnet. (I hope to update this book\
    \ later \n\nthis year to make it more specific to Windows 8.) I also assume that\
    \ you know the rudimentary syntax \n\nof XML (eXtensible Markup Language) because\
    \ XAML is based on XML. \n\n8"
  merge: -1
  pgno: 7
- img_proc: true
  md: "This is an API book rather than a tools book. The only programming tools I\
    \ use in this book are \n\nMicrosoft Visual Studio 11 Express Beta for Windows\
    \ 8 (which I’ll generally simply refer to as Visual \n\nStudio), and XAML Cruncher,\
    \ which is a program that I’ve written and which is featured in Chapter 7. \n\n\
    Markup languages are generally much more toolable than programming code. Indeed,\
    \ some \n\nprogrammers even believe that markup such as XAML should be entirely\
    \ machine-generated. Visual \n\nStudio has a built-in interactive XAML designer\
    \ that involves dragging controls to a page, and many \n\nprogrammers have come\
    \ to know and love Microsoft Expression Blend for generating complex XAML \n\n\
    for their applications. \n\nWhile such tools are great for experienced programmers,\
    \ I think that the programmer new to the \n\nenvironment is better served by learning\
    \ how to write XAML by hand. That’s how I’ll approach XAML in \n\nthis book. The\
    \ XAML Cruncher tool featured in Chapter 7 is very much in keeping with this philosophy:\
    \ \n\nit lets you type in XAML and interactively see the objects that are generated,\
    \ but it does not try to write \n\nXAML for you. \n\nOn the other hand, some programmers\
    \ become so skilled at working with XAML that they forget \n\nhow to create and\
    \ initialize certain objects in code! I think both skills are important, and consequently\
    \ I \n\noften show how to do similar tasks in both code and markup. \n\n**Source\
    \ Code** Learning a new API is similar to learning how to play basketball or the\
    \ oboe: You don’t \n\nget the full benefit by watching someone else do it. Your\
    \ own fingers must get involved. The source \n\ncode in these pages is downloadable\
    \ from the same web page where you purchased the book via the \n\n“Companion Content”\
    \ link on that page, but you’ll learn better by actually typing in the code yourself.\
    \ \n\nAs I began working on this book, I contemplated different approaches to\
    \ how a tutorial about the \n\nWindows Runtime can be structured. One approach\
    \ is to start with rather low-level graphics and user \n\ninput, demonstrate how\
    \ controls can be built, and then describe the controls that have already been\
    \ \n\nbuilt for you. \n\nI have instead chosen to focus initially on those skills\
    \ I think are most important for most \n\nmainstream programmers: assembling the\
    \ predefined controls in an application and linking them with \n\ncode and data.\
    \ This is what I intend to be the focus of the book’s Part I, “Fundamentals.”\
    \ The first 7 \n\nchapters out of the 10 (or so) that will eventually make up\
    \ Part I are included in this first preview \n\nversion. One of my goals in Part\
    \ I is to make comprehensible all the code and markup that Visual \n\nStudio generates\
    \ in the various project templates it supports, so the remaining chapters in Part\
    \ I \n\nobviously need to cover templates, collection controls (and data), and\
    \ navigation. \n\nIn the current plan for the book, the book will get more interesting\
    \ as it gets longer: Part II, \n\n“Infrastructure,” will cover more low-level\
    \ tasks, such as touch, files, networking, security, globalization, \n\nand integrating\
    \ with the Windows 8 charms. Part III, “Specialities,” will tackle more esoteric\
    \ topics, such \n\nas working with the sensors (GPS and orientation), vector graphics,\
    \ bitmap graphics, media, text, \n\nprinting, and obtaining input from the stylus\
    \ and handwriting recognizer. \n\n9"
  merge: -1
  pgno: 8
