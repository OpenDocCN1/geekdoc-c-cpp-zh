  md: " \n\n**Layout Weirdness or Normalcy? **\n\nSuppose you have a *StackPanel*\
    \ and you decide that one of the items in this *StackPanel* should be a \n\n*ScrollViewer*\
    \ with another *StackPanel*. To determine what might happen in such a situation,\
    \ you might \n\nexperiment with the StackPanelWithScrolling project and change\
    \ the XAML file like so: \n\n` ``<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``StackPanel``\\>`` `\n\n`\
    \ ``<``ScrollViewer``\\>`` `\n\n` ``<``StackPanel`` Name``\\=\"stackPanel\" />``\
    \ `\n\n` ``</``ScrollViewer``\\>`` `\n\n` ``</``StackPanel``\\>`` `\n\n` ``</``Grid``\\\
    >`` `\n\nWhen you try it out, you’ll discover it doesn’t work. You can’t scroll.\
    \ What happened? \n\nBecoming acquainted with the mechanics of layout is an important\
    \ part of being a crafty Windows \n\nRuntime developer, and the best way to make\
    \ this acquaintance is to write your own *Panel* derivatives. \n\nThat job awaits\
    \ us in a future chapter. \n\nThe conflict here results from the different ways\
    \ in which *StackPanel* and *ScrollViewer* calculate their \n\ndesired heights.\
    \ The *StackPanel* calculates a desired height based on the total height of all\
    \ its children. \n\nIn the vertical dimension (by default), *StackPanel* is entirely\
    \ child-driven. To calculate a total height, it \n\noffers to each of its children\
    \ an *infinite* height. (When you write your own *Panel* derivatives, you’ll see\
    \ \n\nthat I’m not speaking metaphorically or abstractly. A *Double.PositiveInfinity*\
    \ value actually comes into \n\nplay!) The children respond by calculating a desired\
    \ height based on their natural size. The *StackPanel* \n\nadds these heights\
    \ to calculate its own desired height. \n\n![](img/bc006cce5c2364a011861f29233d37ef_128_0.png)\n\
    \n129"
  merge: -1
  pgno: 128
- img_proc: true
  md: "The height of the *ScrollViewer*, however, is parent-driven. Its height is\
    \ only what its parent offers to \n\nit, and in our simple example this has been\
    \ the height of the *Grid*, which is the height of the *Page*, \n\nwhich is the\
    \ height of the window. The *ScrollViewer* is able to determine how to scroll\
    \ its content \n\nbecause it knows the difference between the height of its child\
    \ (often a *StackPanel*) and its own height. \n\nNow put a vertically-scrolling\
    \ *ScrollViewer* as a child of a vertical *StackPanel*. To determine the \n\n\
    desired size of this *ScrollViewer* child, the *StackPanel* offers it an infinite\
    \ height. How tall does the \n\n*ScrollViewer* really want to be? The height of\
    \ the *ScrollViewer* is now child-driven rather than \n\nparent-driven, and its\
    \ desired height is the height of its child, which is the total height of the\
    \ inner \n\n*StackPanel*, which is the total accumulated height of all the children\
    \ in that *StackPanel*. \n\nFrom the perspective of the *ScrollViewer*, its height\
    \ is the same as the height of its content, which \n\nmeans that there’s nothing\
    \ to scroll. \n\nIn other words, when a vertically-scrolling *ScrollViewer* is\
    \ put in a vertical *StackPanel*, losing the \n\nability to scroll is totally\
    \ expected behavior! \n\nHere’s another seeming layout oddity that is actually\
    \ quite normal: Try giving a *TextBlock* a very \n\nlong chunk of text to display,\
    \ and set the *TextWrapping* property to *Wrap*. In most cases, the text wraps\
    \ \n\nas we might expect. Now put that *TextBlock* in a *StackPanel* with an *Orientation*\
    \ property set to \n\n*Horizontal*. To determine how wide the *TextBlock* needs\
    \ to be, the *StackPanel* offers it an infinite width, \n\nand in response to\
    \ that infinite width, the *TextBlock* stops wrapping the text. \n\nIn the WhatSizeWithBindings\
    \ and WhatSizeWithBindingConverter you saw how a horizontal \n\n*StackPanel* can\
    \ effectively concatenate *TextBlock* elements, one of which has a binding on\
    \ its *Text* \n\nproperty. But you can’t use this same technique with a paragraph\
    \ of wrapped text, because the text will \n\nnever wrap in the horizontal *StackPanel*.\
    \ If you need to concatenate different text strings in a \n\nparagraph, you’ll\
    \ need to use a single *TextBlock* with an *Inlines* collection. If one piece\
    \ of text needs to \n\nbe set to a variable data item, you can’t use a binding\
    \ because the *Text* property of *Run* is not backed \n\nby a dependency property.\
    \ You’ll need to set that item from code. \n\nBecause a vertical *StackPanel*\
    \ has a finite width, it’s an ideal host for *TextBlock* elements that wrap \n\
    \ntext, as you’ll see next. \n\n**Making an E-Book **\n\nA *TextBlock* item that\
    \ goes into a vertical *StackPanel* can have its *TextWrapping* property set to\
    \ *Wrap*, \n\nwhich means that it can actually be a whole paragraph rather than\
    \ just a word or two. *Image* elements \n\ncan also go into this same *StackPanel*,\
    \ and the result can be a rudimentary illustrated e-book. \n\nOn the famous Project\
    \ Gutenberg website, I found an illustrated version of Beatrix Potter’s classic\
    \ \n\nchildren’s book *The Tale of Tom Kitten* (http://www.gutenberg.org/ebooks/14837),\
    \ so I created a Visual \n\nStudio project named TheTaleOfTomKitten and I made\
    \ a folder called Images. From Project \n\nGutenberg’s HTML version of the book,\
    \ it was easy to download all the illustrations in the form of JPEG \n\n130"
  merge: -1
  pgno: 129
- img_proc: true
  md: "files. These have names such as tomxx.jpg, where xx is the original page number\
    \ of the book where \n\nthat illustration appeared. From within the Visual Studio\
    \ project, I then added all 28 of these JPEG files \n\nto the Images folder. \n\
    \nMost of the rest of the work involved the BlankPage.xaml file. Each paragraph\
    \ of the book became a \n\n*TextBlock*, and these I interspersed with *Image*\
    \ elements referencing the JPEG files in the Images folder. \n\nHowever, I felt\
    \ it necessary to deviate somewhat from the ordering of the text and images in\
    \ Project \n\nGutenberg’s HTML file. A PDF of the original edition of *The Tale\
    \ of Tom Kitten* on the Internet Archive \n\nsite (http://archive.org/details/taleoftomkitten00pottuoft)\
    \ reveals how Miss Potter’s illustrations are \n\nassociated with the text of\
    \ the book. There are two patterns: \n\n1. \n\nText appears on the verso (left-hand,\
    \ even-numbered) page with an accompanying illustration \n\non the recto (right-hand,\
    \ odd-numbered) page. \n\n2. \n\nText appears on the recto page with an accompanying\
    \ illustration on the verso page. \n\nAdapting this paginated book to a continuous\
    \ format required altering the order of the text and \n\nimage in this second\
    \ case so that the text appears *before* the accompanying illustration. That’s\
    \ why \n\nyou’ll see some page swaps in the XAML file. \n\nGiven the very many\
    \ *TextBlock* and *Image* elements, styles seemed almost mandatory: \n\n**Project:\
    \ TheTaleOfTomKitten | File: BlankPage.xaml (excerpt) **\n\n`<``Page.Resources``\\\
    >`` `\n\n` ``<``Style`` x``:``Key``\\=\"commonTextStyle\"`` TargetType``\\=\"\
    TextBlock\">`` `\n\n` ``<``Setter`` Property``\\=\"FontFamily\"`` Value``\\=\"\
    Century Schoolbook\" />`` `\n\n` ``<``Setter`` Property``\\=\"FontSize\"`` Value``\\\
    =\"36\" />`` `\n\n` ``<``Setter`` Property``\\=\"Foreground\"`` Value``\\=\"Black\"\
    \ />`` `\n\n` ``<``Setter`` Property``\\=\"Margin\"`` Value``\\=\"0 12\" />``\
