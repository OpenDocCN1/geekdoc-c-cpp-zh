    \ Width``\\=\"\\*\" />`` `\n\n` ``<``ColumnDefinition`` x``:``Name``\\=\"secondColDef\"\
    `` Width``\\=\"\\*\" />`` `\n\n` ``</``Grid.ColumnDefinitions``\\>`` `\n\n` `\n\
    \n` ``<``Grid.RowDefinitions``\\>`` `\n\n` ``<``RowDefinition`` Height``\\=\"\\\
    *\" />`` `\n\n` ``<``RowDefinition`` x``:``Name``\\=\"secondRowDef\"`` Height``\\\
