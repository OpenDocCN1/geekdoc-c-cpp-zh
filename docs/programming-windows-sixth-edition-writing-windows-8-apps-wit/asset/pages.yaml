  md: "Chapter 3 \n\n**Basic Event Handling **\n\nThe previous chapters have demonstrated\
    \ how you can instantiate and initialize elements and other \n\nobjects in either\
    \ XAML or code. The most common procedure is to use XAML to define the initial\
    \ \n\nlayout and appearance of elements on a page but then to change properties\
    \ of these elements from \n\ncode as the program is running. \n\nAs you’ve seen,\
    \ assigning a *Name* or *x:Name* to an element in XAML causes a field to be defined\
    \ in \n\nthe page class that gives the code-behind file easy access to that element.\
    \ This is one of the two major \n\nways that code and XAML interact. The second\
    \ is through events. An event is a general-purpose \n\nmechanism that allows one\
    \ object to communicate something of interest to other objects. The event is \n\
    \nsaid to be “fired” by the first object and “handled” by the other. In the Windows\
    \ Runtime, one \n\nimportant application of events is to signal the presence of\
    \ user input from touch, the mouse, a stylus, \n\nor the keyboard. \n\nFollowing\
    \ initialization, a Windows Runtime program generally sits dormant in memory waiting\
    \ for \n\nsomething interesting to happen. Almost everything the program does\
    \ thereafter is in response to an \n\nevent, so the job of event handling is one\
    \ that will occupy much of the rest of this book. \n\n**The *****Tapped***** Event\
    \ **\n\nThe *UIElement* class defines all the basic user-input events. These include\
    \ eight events beginning with \n\nthe word *Pointer* that consolidate input from\
    \ touch, the mouse, and the stylus; five events beginning \n\nwith the word *Manipulation*\
    \ that combine input from multiple fingers; two *Key* events for keyboard \n\n\
    input; as well as higher level events named *Tapped*, *DoubleTapped*, *RightTapped*,\
    \ and *Holding*. (No, the \n\n*RightTapped* event is *not* generated by a finger\
    \ on your right hand; it’s mostly used to register \n\nright-button clicks on\
    \ the mouse, but you can simulate a right tap with touch by holding your finger\
    \ \n\ndown for a moment and then lifting, a gesture that also generates *Holding*\
    \ events. It’s the application’s \n\nresponsibility to determine how it wants\
    \ to handle these.) \n\nA complete exploration of these user-input events awaits\
    \ us in a future chapter. For now, let’s focus \n\non *Tapped* as a simple representative\
    \ event. An element that derives from *UIElement* fires a *Tapped* \n\nevent to\
    \ indicate that the user has briefly touched the element with a finger, or clicked\
    \ it with the \n\nmouse, or dinged it with the stylus. To qualify as a *Tapped*\
    \ event, the finger (or mouse or stylus) cannot \n\nmove very much and must be\
    \ released in a short period of time. \n\nAll the user-input events have a similar\
    \ pattern. *UIElement* defines the *Tapped* event like so: \n\n`public`` ``event``\
    \ ``TappedEventHandler`` Tapped; `\n\n78"
