  md: "` ``async`` ``void`` OnPopupClose(``object`` sender, ``object`` args) `\n\n\
    ` { `\n\n` ``try`` `\n\n` { `\n\n` ``await`` appSettings.SaveAsync(); `\n\n` }\
    \ `\n\n` ``catch`` (``Exception`` exc) `\n\n` { `\n\n` } `\n\n` ``this``.BottomAppBar.IsOpen\
    \ = ``false``; `\n\n` } `\n\n` … `\n\n`} `\n\nThe *Closed* event handler for the\
    \ *Popup* saves the updated settings. \n\nWhat happens if XamlCruncher terminates\
    \ (either normally or unexpectedly) when the \n\n*SettingsDialog* is still displayed?\
    \ Well, any changes that the user made to the settings won’t be saved. \n\nThe\
    \ same goes for a document that was modified, which is potentially a much greater\
    \ loss. \n\nOne of the big “to do” items is to handle the *Suspending* event of\
    \ the *App* object. This event \n\nindicates when Windows 8 is suspending an application\
    \ but also when the application is about to \n\nterminate. My thinking now is\
    \ that the program should save any edited document in the *LocalFolder* \n\narea\
    \ and then check for the existence of the document the next time the program starts\
    \ up. One \n\nphilosophy holds that applications should seem to be continuous\
    \ experiences even when they are \n\nterminated and restarted. \n\n**Beyond the\
    \ Windows Runtime **\n\nEarlier I mentioned some limitations to the XAML that\
    \ you can enter in XamlCruncher. Elements cannot \n\nhave their events set, because\
    \ events require event handlers and event handlers must be implemented \n\nin\
    \ code. Nor can the XAML contain references to external classes or assemblies.\
    \ \n\nHowever, the parsed XAML runs in the XamlCruncher process, which means that\
    \ it does have access \n\nto any classes that XamlCruncher has access to, including\
    \ the custom classes I created for the program. \n\nHere’s a piece of XAML that\
    \ includes a namespace declaration for *local*. This enables it to use the \n\n\
    *SplitContainer* and nests two instances of it: \n\n291"
