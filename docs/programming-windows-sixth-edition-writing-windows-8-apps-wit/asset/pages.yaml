    \n` editBox.GetPositionFromIndex(editBox.SelectionStart + editBox.SelectionLength\
    \ - 1, `\n\n` ``out`` line, ``out`` col); `\n\n` lineColText.Text += ``String``.Format(``\"\
    \ - Line {0} Col {1}\"``, line + 1, col + 1); `\n\n` } `\n\n` } `\n\n` … `\n\n\
    `} `\n\nThe constructor begins by fixing a little bug involving the *editBox*\
    \ and *resultContainer* fields. The XAML \n\nparser definitely creates these fields\
    \ during compilation, but they not set by the *InitializeComponent* \n\ncall at\
    \ run time. \n\nThe remainder of the constructor sets a fixed-pitch font in the\
    \ *TabbableTextBox* based on the \n\npredefined fonts available from the *LanguageFontGroup*\
    \ class. This is apparently the only way to get \n\nactual font family names from\
    \ the Windows Runtime. \n\nThe remaining initialization occurs in the *Loaded*\
    \ event handler because it needs to call the \n\n*AppSettings.LoadAsync* asynchronous\
    \ method and asynchronous methods can’t be called in \n\nconstructors. The *DataContext*\
    \ of the page is set to the *AppSettings* instance, as you probably \n\nanticipated\
    \ from the data bindings in the BlankPage.xaml file. \n\nThe *OnLoaded* method\
    \ begins by setting a default piece of XAML in the *TabbableTextBox* and \n\n\
    calling *ParseText* to parse it. (You’ll see how this works soon.) The *TabbableTextBox*\
    \ is assigned \n\nkeyboard input focus, and *OnLoaded* concludes by displaying\
    \ the initial line and column, which is then \n\nupdated whenever the *TextBox*\
    \ selection changes. \n\nYou might wonder why *SetDefaultXamlFile* is defined\
    \ as *async* and returns *Task* when it does not \n\nactually contain any asynchronous\
    \ code. You’ll see later that this method is used as an argument to \n\nanother\
    \ method in the file I/O logic, and that’s the sole reason I had to define it\
    \ oddly. The compiler \n\ngenerates a warning message because it doesn’t contain\
    \ any *await* logic. \n\n**Parsing the XAML **\n\nThe major job of XamlCruncher\
    \ is to pass a piece of XAML to *XamlReader.Load* and get out an object. \n\n\
    A property of the *AppSettings* class named *AutoParsing* allows this to happen\
    \ with every keystroke, or it \n\nwaits until you press the Refresh button on\
