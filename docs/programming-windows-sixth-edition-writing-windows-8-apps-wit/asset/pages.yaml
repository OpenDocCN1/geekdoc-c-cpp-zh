    \ be static: \n\n`static`` ``void`` OnColorChanged(``DependencyObject`` obj, ``DependencyPropertyChangedEventArgs``\
    \ args) `\n\n`{ `\n\n` `\n\n`} `\n\nNow this is kind of weird, because the whole\
    \ point of defining this *GradientButton* class is to use it \n\nmultiple times\
    \ in an application, and now we’re defining a static property that is called whenever\
    \ the \n\n*Color1* or *Color2* property in an instance of this class changes.\
    \ How do you know to what instance this \n\nmethod call applies? \n\nEasy: it’s\
    \ the first argument. That first argument to this *OnColorChanged* method is always\
    \ a \n\n*GradientButton* object, and you can safely cast it to a *GradientButton*\
