    \ size of a *TextBlock*. \n\nWhen you create a new *TextBlock*, the *ActualWidth*\
    \ and *ActualHeight* properties are both zero. \n\nThese properties are normally\
    \ not calculated until the *TextBlock* becomes part of a visual tree and is \n\
    \nsubjected to layout. However, you can force the *TextBlock* to calculate a size\
    \ for itself by calling its \n\n*Measure* method. This method is defined by *UIElement*\
    \ and is an important component of the layout \n\nsystem. \n\nThe argument to\
    \ the *Measure* method is a *Size* value indicating the size available for the\
    \ element, \n\nbut you can set the size to zero for this purpose: \n\n`txtblk.Measure(``new``\
    \ ``Size``()); `\n\nIf you need to find the size of a *TextBlock* that wraps text,\
    \ you must supply a nonzero first argument to \n\nthe *Size* constructor so that\
    \ *TextBlock* knows the width in which to wrap the text. \n\nFollowing the *Measure*\
    \ call, the *ActualWidth* and *ActualHeight* properties of *TextBlock* are valid\
    \ and \n\nusable for positioning the *TextBlock* in a *Canvas*. Calling the *Canvas.SetLeft*\
    \ and *Canvas.SetTop* \n\nproperties is necessary only when positioning the *TextBlock*\
    \ elements in the *Canvas*. In either a \n\nsingle-cell *Grid* or *Canvas*, the\
