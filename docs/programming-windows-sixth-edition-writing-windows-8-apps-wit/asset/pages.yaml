  md: "`public`` BlankPage() `\n\n`{ `\n\n` ``this``.InitializeComponent(); `\n\n\
    ` `\n\n` Loaded += (sender, args) => `\n\n` { `\n\n` txtbox.Focus(``FocusState``.Keyboard);\
    \ `\n\n` }; `\n\n`} `\n\nAs you can see in the XAML file, an application bar is\
    \ added to the page by splitting out the \n\n*BottomAppBar* property of *Page*\
    \ as a property element and setting it to an *AppBar* element. The \n\n*Padding*\
    \ value of “10 0” is standard and puts 10 pixels of padding at the left and right\
    \ to prevent the \n\ncontents from getting too close to the edge. \n\nGenerally\
    \ an application bar has some buttons on the left and some on the right. When\
    \ holding a \n\ntablet, these are more convenient than buttons in the middle.\
    \ You can use XAML in a couple ways to \n\ndivide the buttons between left and\
    \ right. Perhaps the easiest approach is to put two horizontal \n\n*StackPanel*\
    \ elements in a single-cell *Grid* and align them on the right and left. \n\n\
    It’s recommended that a New (or Add) button be on the far right, and although\
    \ this program does \n\nnot have a New button, the other file-related buttons\
    \ should also appear on the right side because \n\nthey are related to New. I\
    \ was able to use the predefined *SaveAppBarButtonStyle*, but I had to specify\
    \ \n\nmy own symbols and text for the other two items. \n\nWhen you run MetroPad1,\
    \ it might not be obvious that anything is happening because the program \n\n\
    consists entirely of a *TextBox* with an off-white background. But you can type\
    \ some poetry (or other \n\ntext) into the *TextBox* and when you sweep your finger\
    \ on the top or bottom of the screen, here’s what \n\nyou’ll see: \n\n \n\n![](img/bc006cce5c2364a011861f29233d37ef_239_0.png)\n\
    \n240"
