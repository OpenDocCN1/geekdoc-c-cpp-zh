  md: "Usings and Remove Unused Usings to clean up the list. (I’ve done that with\
    \ this BlankPage.xaml.cs file.) \n\nThe constructor of the *Page* class is a handy\
    \ place to create a *TextBlock*, assign properties, and then \n\nadd it to the\
    \ *Grid*: \n\n**Project: HelloCode | File: BlankPage.xaml.cs (excerpt) **\n\n\
    `public`` BlankPage() `\n\n`{ `\n\n` ``this``.InitializeComponent(); `\n\n` `\n\
    \n` ``TextBlock`` txtblk = ``new`` ``TextBlock``(); `\n\n` txtblk.Text = ``\"\
    Hello, Windows 8!\"``; `\n\n` txtblk.FontFamily = ``new`` ``FontFamily``(``\"\
    Times New Roman\"``); `\n\n` txtblk.FontSize = 96; `\n\n` txtblk.FontStyle = ``FontStyle``.Italic;\
    \ `\n\n` txtblk.Foreground = ``new`` ``SolidColorBrush``(``Colors``.Yellow); `\n\
    \n` txtblk.HorizontalAlignment = ``HorizontalAlignment``.Center; `\n\n` txtblk.VerticalAlignment\
    \ = ``VerticalAlignment``.Center; `\n\n` `\n\n` contentGrid.Children.Add(txtblk);\
    \ `\n\n`} `\n\nNotice that the last line of code here references the *Grid* named\
    \ *contentGrid* in the XAML file just as \n\nif it were a normal object, perhaps\
    \ stored as a field. (As you’ll see, it actually is a normal object and it is\
    \ \n\na field!) Although not evident in XAML, the *Grid* has a property named\
    \ *Children* that it inherits from \n\n*Panel*. This *Children* property is of\
    \ type *UIElementCollection*, which is a collection that implements the \n\n*IList<UIElement>*\
    \ and *IEnumerable<UIElement>* interfaces. This is why the *Grid* can support\
    \ multiple \n\nchild elements. \n\nCode often tends to be a little wordier than\
    \ XAML partially because the XAML parser works behind \n\nthe scenes to create\
    \ additional objects and perform conversions. The code reveals that the *FontFamily*\
    \ \n\nproperty requires that a *FontFamily* object be created and that *Foreground*\
    \ is of type Brush and \n\nrequires an instance of a Brush derivative, such as\
    \ *SolidColorBrush*. *Colors* is a class that contains 141 \n\nstatic properties\
    \ of type *Color*. You can create a *Color* object from ARGB bytes by using the\
    \ static \n\n*Color.FromArgb* method. \n\nThe *FontStyle*, *HorizontalAlignment*,\
    \ and *VerticalAlignment* properties are all enumeration types, \n\nwhere the\
    \ enumeration is the same name as the property. Indeed, the *Text* and *FontSize*\
    \ properties \n\nseem odd in that they are primitive types: a string and a double-precision\
    \ floating-point number. \n\nYou can reduce the code bulk a little by using a\
    \ style of property initialization introduced in C# 3.0: \n\n`TextBlock`` txtblk\
    \ = ``new`` ``TextBlock`` `\n\n`{ `\n\n` Text = ``\"Hello, Windows 8!\"``, `\n\
    \n` FontFamily = ``new`` ``FontFamily``(``\"Times New Roman\"``), `\n\n` FontSize\
    \ = 96, `\n\n` FontStyle = ``FontStyle``.Italic, `\n\n` Foreground = ``new`` ``SolidColorBrush``(``Colors``.Yellow),\
    \ `\n\n` HorizontalAlignment = ``HorizontalAlignment``.Center, `\n\n35"
