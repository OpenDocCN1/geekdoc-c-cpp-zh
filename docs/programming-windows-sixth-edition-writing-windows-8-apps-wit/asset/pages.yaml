  pgno: 112
- img_proc: true
  md: " \n\nNotice that I made this *StackPanel* a child of the *Grid*. Panels can\
    \ be nested, and they very often *are* \n\nnested. In this particular case I could\
    \ have replaced the *Grid* with *StackPanel* and set that same \n\n*Background*\
    \ property on it. \n\nEach element in the *StackPanel* gets only as much height\
    \ as it needs but can stretch to the panel’s \n\nfull width, as demonstrated by\
    \ the first and last *TextBlock* aligned to the right and left. In a vertical\
    \ \n\n*StackPanel*, any *VerticalAlignment* settings on the children are irrelevant\
    \ and are basically ignored. \n\nNotice that the *Stretch* property of the *Image*\
    \ element is set to *None* to display the bitmap in its \n\npixel dimensions.\
    \ If left at its default value of *Uniform*, the *Image* is stretched to the width\
    \ of the \n\n*StackPanel* (which is the same as the width of the *Page*) and its\
    \ vertical dimension increases \n\nproportionally. This might cause all the elements\
    \ below the *Image* to be pushed right off the bottom \n\nand into the bit bucket.\
    \ \n\nThe XAML also includes an *Ellipse*. What happened to it? Like all the other\
    \ children of the \n\n*StackPanel*, the *Ellipse* is given only as much vertical\
    \ space as it needs, and it really doesn’t need any, so \n\nit shrinks to nothing.\
    \ If you want the *Ellipse* to be visible, give it at least a nonzero *Height*,\
    \ for example, \n\n48: \n\n![](img/bc006cce5c2364a011861f29233d37ef_113_0.png)\n\
    \n114"
