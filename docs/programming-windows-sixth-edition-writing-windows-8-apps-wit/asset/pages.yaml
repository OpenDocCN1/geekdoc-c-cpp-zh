  md: " \n\nIf you’re running the program on a device that responds to orientation\
    \ changes, you can try flipping \n\nthe screen and observe how the numbers change.\
    \ You can also sweep your finger from the left of the \n\nscreen to invoke the\
    \ snapped views and then divide the screen between this program and another to\
    \ \n\nsee how the width value changes. \n\nYou don’t need to set the *SizeChanged*\
    \ event handler in XAML. You can set it in code, perhaps \n\nduring the *Page*\
    \ constructor: \n\n`this``.SizeChanged += OnPageSizeChanged; `\n\n*SizeChanged*\
    \ is defined by *FrameworkElement* and inherited by all descendent classes. Despite\
    \ the \n\nfact that *SizeChangedEventArgs* derives from *RoutedEventArgs*, this\
    \ is not a routed event. You can tell \n\nit’s not a routed event because the\
    \ *OriginalSource* property of the event arguments is always *null*; there \n\n\
