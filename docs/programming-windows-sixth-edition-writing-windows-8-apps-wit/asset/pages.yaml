  md: "preview of the page’s appearance. \n\nYou can also skip all the typing and\
    \ simply drag a *TextBlock* from the Visual Studio Toolbox and \n\nthen set the\
    \ properties in a table, but I won’t be doing that in this book. I'll instead\
    \ describe the \n\ncreation of these programs as if you and I actually type in\
    \ the code and markup just like real \n\nprogrammers. \n\nPress F5 to compile\
    \ and run this program, or select Start Debugging from the Debug menu. Even \n\
    \nfor simple programs like this, it’s best to run the program under the Visual\
    \ Studio debugger. If all goes \n\nwell, this is what you’ll see: \n\n \n\nThe\
    \ *HorizontalAlignment* and *VerticalAlignment* attributes on the *TextBlock*\
    \ have caused the text to \n\nbe centered, obviously without the need for you\
    \ the programmer to explicitly determine the size of the \n\nvideo display and\
    \ the size of the rendered text. You can alternatively set *HorizontalAlignment*\
    \ to *Left* or \n\n*Right*, and *VerticalAlignment* to *Top* or *Bottom* to position\
    \ the *TextBlock* in one of nine places in the \n\n*Grid*. As you’ll see in Chapter\
    \ 4, “Presentation with Panels,” the Windows Runtime supports precise pixel \n\
    \nplacement of visual objects, but usually you’ll want to rely on the built-in\
    \ layout features. \n\nThe *TextBlock* has *Width* and *Height* properties, but\
    \ generally you don’t need to bother setting \n\nthose. In fact, if you set the\
    \ *Width* and *Height* properties on this particular *TextBlock*, you might end\
    \ up \n\ncropping part of the text or interfering with the centering of the text\
    \ on the page. The *TextBlock* knows \n\nbetter than you how large it should be.\
    \ \n\nYou might be running this program on a device that responds to orientation\
    \ changes, such as a \n\ntablet. If so, you’ll notice that the page content dynamically\
    \ conforms to the change in orientation and \n\naspect ratio, apparently without\
    \ any interaction from the program. The *Grid*, the *TextBlock*, and the \n\n\
    Windows 8 layout system are doing most of the work. \n\nTo terminate the Hello\
    \ program, press Shift+F5 in Visual Studio, or select Stop Debugging from the\
    \ \n\n![](img/bc006cce5c2364a011861f29233d37ef_19_0.png)\n\n20"
