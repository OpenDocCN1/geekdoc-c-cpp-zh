    \ directly to the *Style* property of a *TextBlock*. This isn’t common, however,\
    \ because code offers \n\nother solutions for defining the same properties on\
    \ several different elements, namely the *for* or \n\n*foreach* loop. \n\nTake\
    \ careful note of the first argument to the *Setter* constructor. It’s defined\
    \ as a \n\n*DependencyProperty*, and what you specify is a static dependency property\
    \ defined by (or inherited by) \n\nthe target class of the style. This is an excellent\
    \ example of how dependency properties allow a \n\nproperty of a class to be specified\
    \ independently of a particular instance of that class. \n\nThe code also makes\
    \ clear that the properties targeted by a *Style* can only be dependency \n\n\
    properties. I mentioned earlier that dependency properties impose a hierarchy\
    \ on the way that \n\nproperties can be set. For example, suppose you have the\
    \ following markup in this program: \n\n`<``TextBlock`` Text``\\=``\"Top Text\"\
    `` `\n\n` `` Style``\\=\"{``StaticResource`` rainbowStyle``}\" `\n\n` `` FontSize``\\\
    =``\"24\"`` `\n\n` `` HorizontalAlignment``\\=``\"Center\"`` `\n\n` `` VerticalAlignment``\\\
    =``\"Top\"`` ``/>`` `\n\nThe *Style* defines a *FontSize* value, but the *FontSize*\
    \ property is also set locally on the *TextBlock*. As \n\nyou might hope and expect,\
    \ the local setting takes precedence over the *Style* setting, and both take \n\
    \nprecedence over a *FontSize* value propagated through the visual tree. \n\n\
    Once a *Style* object is set to the *Style* property of an element, the *Style*\
    \ can no longer be changed. \n\nYou can later set a different *Style* object to\
