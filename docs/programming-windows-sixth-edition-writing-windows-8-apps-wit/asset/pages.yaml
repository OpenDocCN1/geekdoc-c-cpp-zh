  md: "Chapter 5 \n\n**Control Interaction **\n\nEarly on in this book I made a distinction\
    \ between classes that derive from *FrameworkElement* and \n\nthose that derive\
    \ from *Control*. I've tended to refer to *FrameworkElement* derivatives (such\
    \ as *TextBlock* \n\nand *Image*) as \"elements\" to preserve this distinction,\
    \ but a deeper explication is now required. \n\nThe title of this chapter might\
    \ suggest that elements are for presentation and controls are for \n\ninteraction,\
    \ but that’s not necessarily so. *UIElement* defines all the user input events\
    \ for touch, mouse, \n\nstylus, and keyboard, which means that elements as well\
    \ as controls can interact with the user in very \n\nsophisticated ways. \n\n\
    Nor are elements deficient in layout, styling, or data binding capabilities. It's\
    \ the *FrameworkElement* \n\nclass that defines layout properties such as *Width*,\
    \ *Height*, *HorizontalAlignment*, *VerticalAlignment*, and \n\n*Margin*, as well\
    \ as the *Style* property and the *SetBinding* method. \n\n**The *****Control*****\
    \ Difference **\n\nVisually and functionally, *FrameworkElement* derivatives are\
    \ primitives—atoms, so to speak—while \n\n*Control* derivatives are assemblages\
    \ of these primitives, or molecules in this analogy. A *Button* is \n\nactually\
    \ constructed from a *Border* and a *TextBlock* (in many cases). A *Slider* consists\
    \ of a couple of \n\n*Rectangle* elements with a *Thumb*, which itself is a *Control*\
    \ probably built from a *Rectangle*. Anything \n\nthat has visual content beyond\
    \ text, a bitmap, or vector graphics is almost certainly a *Control* \n\nderivative.\
    \ \n\nConsequently, one of the most important properties defined by *Control*\
    \ is called *Template*. As I’ll \n\ndemonstrate in a future chapter, this property\
    \ allows you to completely redefine the appearance of a \n\ncontrol by defining\
    \ a visual tree of your own invention. It makes sense to visually redefine a *Button*\
    \ \n\nbecause (for example) you might want it to be round rather than rectangular\
    \ so that it looks right in an \n\napplication bar. It makes no sense to visually\
    \ redefine a *TextBlock* or *Image* because there's nothing \n\nyou can do with\
    \ it beyond the text or bitmap itself. If you want to *add* something to a *TextBlock*\
    \ or \n\n*Image*, you're defining a *Control* because you're constructing a visual\
    \ tree that includes the element \n\nprimitive. \n\nAlthough you can derive a\
    \ custom class from *FrameworkElement*, there is little you can do with the \n\
    \nresult. You can't give it any visuals. But when you derive from *Control*, you\
    \ give your class a default \n\nvisual appearance by defining a visual tree in\
    \ XAML. \n\nFor use by derived classes, *Control* defines a bunch of properties\
    \ that the *Control* class itself does \n\nnot need. These are properties mostly\
    \ associated with *TextBlock* (*CharacterSpacing*, *FontFamily*, \n\n150"
  merge: -1
  pgno: 149
- img_proc: true
  md: "*FontSize*, *FontStretch*, *FontStyle*, *FontWeight*, and *Foreground*) and\
    \ *Border* (*Background*, *BorderBrush*, \n\n*BorderThickness*, and *Padding*).\
    \ Not every *Control* derivative has text or a border, but if you need those \n\
    \nproperties when creating a new control or creating a new template for an existing\
    \ control, they are \n\nconveniently provided. *Control* also provides two new\
    \ properties named *HorizontalContentAlignment* \n\nand *VerticalContentAlignment*\
    \ for purposes of defining control visuals. \n\nA *Control* derivative often defines\
    \ a few of its own properties and its own events. Commonly, a \n\n*Control* derivative\
    \ will process user-input events from the pointer, mouse, stylus, and keyboard\
    \ and will \n\nconvert that input into a higher-level event. For example, the\
    \ *ButtonBase* class (from which all the \n\nbuttons derive) defines a *Click*\
    \ event. The *Slider* defines a *ValueChanged* event indicating when its \n\n\
    *Value* property changes. The *TextBox* defines a *TextChanged* event indicating\
    \ when its *Text* property \n\nchanges. \n\nIt turns out that in real life, *Control*\
    \ derivatives really *do* interact more with users, so the title of this \n\n\
    chapter is accurate. For the convenience of working with user input, *Control*\
    \ provides protected virtual \n\nmethods corresponding to all the user-input events\
    \ defined by *UIElement*. For example, *UIElement* \n\ndefines the *Tapped* event,\
    \ but *Control* defines the protected virtual method *OnTapped*. *Control* also\
    \ \n\ndefines an *IsEnabled* property so that controls can avoid user input if\
    \ input is not currently applicable, \n\nand it defines an *IsEnabledChanged*\
    \ event that is fired when the property changes. This is the only \n\npublic event\
    \ actually defined by *Control*. \n\nThe idea of a control having \"input focus\"\
    \ is still applicable in Windows 8. When a control has the \n\ninput focus, the\
    \ user expects that particular control to get most keyboard events. (Of course,\
    \ some \n\nkeyboard events, such as the Windows key, transcend input focus.) For\
    \ this purpose, *Control* defines a \n\n*Focus* method, as well as *OnGotFocus*\
    \ and *OnLostFocus* virtual methods. \n\nIn connection with keyboard focus is\
    \ the idea of being able to navigate among controls by using \n\nthe keyboard\
    \ Tab key. *Control* provides for this by defining *IsTabStop*, *TabIndex*, and\
    \ *TabNavigation* \n\nproperties. \n\nMany *Control* derivatives are in the *Windows.UI.Xaml.Controls*\
    \ namespace, but a few are in the \n\n*Windows.UI.Xaml.Controls.Primitives* namespace.\
    \ The latter namespace is generally reserved for those \n\ncontrols that usually\
    \ appear only as parts of other controls, but that's a suggestion rather than\
    \ a \n\nrestriction. \n\nMost *Control* derivatives derive directly from *Control*,\
    \ but four important classes derive from *Control* \n\nto define their own subcategories\
    \ of controls. Here they are: \n\n*Object* \n\n \n\n \n\n*DependencyObject* \n\
    \n \n\n \n\n \n\n*UIElement* \n\n \n\n \n\n \n\n \n\n*FrameworkElement* \n\n \n\
    \n \n\n \n\n \n\n \n\n*Control* \n\n \n\n \n\n \n\n \n\n \n\n \n\n*ContentControl*\
    \ \n\n \n\n \n\n \n\n \n\n \n\n \n\n*ItemsControl* \n\n151"
  merge: -1
  pgno: 150
