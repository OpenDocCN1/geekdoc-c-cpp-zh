  md: " \n\nAs you change the orientation or size of the page, the numbers are updated.\
    \ This is what makes \n\ndata bindings so great. Internally, a data binding is\
    \ notified when a source property changes so that it \n\ncan change the target\
    \ property, but the application source code appears to have no event handlers\
    \ \n\nand no moving parts. \n\nUnfortunately, by giving up on the bindings to\
    \ *Run* we’ve also lost the informative arrows. So why \n\ndo the data bindings\
    \ work on the *Text* property of *TextBlock* but not on the *Text* property of\
    \ *Run*? \n\nIt’s very simple. The target of a data binding must be a dependency\
    \ property. This fact is obvious \n\nwhen you define a data binding in code by\
    \ using the *SetBinding* method. That’s the difference: The \n\n*Text* property\
    \ of *TextBlock* is backed by the *TextProperty* dependency property, but the\
    \ *Text* property of \n\n*Run* is not. It’s a plain old property that cannot serve\
    \ as a target for a data binding. The XAML parser \n\nprobably shouldn’t allow\
    \ a binding to be set on the *Text* property of *Run*, but it does. \n\nIn Chapter\
    \ 4 I’ll show you how to use a *StackPanel* to get the arrows back in a version\
    \ of WhatSize \n\nthat uses data bindings. \n\n**Timers and Animation **\n\nSometimes\
    \ a Metro style application needs to receive periodic events at a fixed interval.\
    \ A clock \n\napplication, for example, probably needs to update its display every\
    \ second. The ideal class for this job \n\nis *DispatcherTimer*. Set a timer interval,\
    \ set a handler for the *Tick* event, and go. \n\nHere’s the XAML file for a digital\
    \ clock application. It’s just a big *TextBlock*: \n\n**Project: DigitalClock\
    \ | File: BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``TextBlock`` Name``\\=\"txtblk\"\
    `` `\n\n![](img/bc006cce5c2364a011861f29233d37ef_97_0.png)\n\n98"
