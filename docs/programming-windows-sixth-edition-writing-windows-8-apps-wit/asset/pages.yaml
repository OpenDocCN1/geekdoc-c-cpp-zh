  md: "properties in the particular *GradientButton* instance. \n\nWhat I like to\
    \ do in the static property-changed method is call an instance method of the same\
    \ \n\nname, passing to it the second argument: \n\n`static`` ``void`` OnColorChanged(``DependencyObject``\
    \ obj, ``DependencyPropertyChangedEventArgs`` args) `\n\n`{ `\n\n` (obj ``as``\
    \ ``GradientButton``).OnColorChanged(args); `\n\n`} `\n\n`void`` OnColorChanged(``DependencyPropertyChangedEventArgs``\
    \ args) `\n\n`{ `\n\n` `\n\n`} `\n\nThis second method then does all the work\
    \ accessing instance fields and properties of the class. \n\nThe *DependencyPropertyChangedEventArgs*\
    \ object contains some useful information. The *Property* \n\nproperty is of type\
    \ *DependencyProperty* and indicates the changed property. In this example, the\
    \ \n\n*Property* property will be either *Color1Property* or *Color2Property*.\
    \ \n\n*DependencyPropertyChangedEventArgs* also has properties named *OldValue*\
    \ and *NewValue* of type \n\n*object*. \n\nIn *GradientButton*, the property-changed\
    \ handler sets the *Color* property of the appropriate \n\n*GradientStop* object\
    \ from *NewValue*: \n\n`void`` OnColorChanged(``DependencyPropertyChangedEventArgs``\
    \ args) `\n\n`{ `\n\n` ``if`` (args.Property == Color1Property) `\n\n` gradientStop1.Color\
    \ = (``Color``)args.NewValue; `\n\n` `\n\n` ``if`` (args.Property == Color2Property)\
    \ `\n\n` gradientStop2.Color = (``Color``)args.NewValue; `\n\n`} `\n\nAnd that’s\
    \ it for *GradientButton*. The only job left to do is arrange all these pieces\
    \ in the class in a \n\nway that makes sense to you. I like to put all fields\
    \ at the top, static constructor next, static properties \n\nnext, and then the\
    \ instance constructor, instance properties, and all methods. Here’s the complete\
