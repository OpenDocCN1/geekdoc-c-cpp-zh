  md: "**Property Element Syntax **\n\nFortunately, there is a way. As you’ve seen,\
    \ you normally indicate that you want a *SolidColorBrush* in \n\nXAML simply by\
    \ specifying the color of the brush: \n\n`<``TextBlock`` Text``\\=``\"Hello, Windows\
    \ 8!\"`` `\n\n` `` Foreground``\\=``\"Blue\"`` `\n\n` `` FontSize``\\=``\"96\"\
    `` ``/>`` `\n\nThe *SolidColorBrush* is created for you behind the scenes. \n\n\
    However, it’s possible to use a variation of this syntax that gives you the option\
    \ of being more \n\nexplicit about the nature of this brush. Remove that *Foreground*\
    \ property, and separate the *TextBlock* \n\nelement into start and end tags:\
    \ \n\n`<``TextBlock`` Text``\\=``\"Hello, Windows 8!\"`` `\n\n` `` FontSize``\\\
    =``\"96\">`` `\n\n` `\n\n`</``TextBlock``\\>`` `\n\nWithin those tags, insert\
    \ additional start and end tags consisting of the element name, a period, and\
    \ \n\na property name: \n\n`<``TextBlock`` Text``\\=``\"Hello, Windows 8!\"``\
    \ `\n\n` `` FontSize``\\=``\"96\">`` `\n\n` ``<``TextBlock.Foreground``\\>`` `\n\
    \n` `\n\n` ``</``TextBlock.Foreground``\\>`` `\n\n`</``TextBlock``\\>`` `\n\n\
    And within those tags put the object you want to set to that property: \n\n`<``TextBlock``\
    \ Text``\\=``\"Hello, Windows 8!\"`` `\n\n` `` FontSize``\\=``\"96\">`` `\n\n\
    ` ``<``TextBlock.Foreground``\\>`` `\n\n` ``<``SolidColorBrush`` Color``\\=``\"\
    Blue\"`` ``/>`` `\n\n` ``</``TextBlock.Foreground``\\>`` `\n\n`</``TextBlock``\\\
    >`` `\n\nNow it’s explicit that *Foreground* is being set to an instance of a\
    \ *SolidColorBrush*. \n\nThis is called *property-element syntax*, and it’s an\
    \ important feature of XAML. At first it might seem \n\nto you (as it did to me)\
    \ that this syntax is an extension or aberration of standard XML, but it’s definitely\
    \ \n\nnot. Periods are perfectly valid characters in XML element names. \n\nWith\
    \ that last little snippet of XAML it is now possible to categorize three types\
    \ of XAML syntax: \n\n• \n\nThe *TextBlock* and *SolidColorBrush* are both examples\
    \ of “object elements” because they are \n\nXML elements that result in the creation\
    \ of objects. \n\n• \n\nThe *Text*, *FontSize*, and *Color* settings are examples\
    \ of “property attributes.” They are XML \n\n45"
