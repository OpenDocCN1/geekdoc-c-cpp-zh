    \ `\n\n` ``</``Style``\\>`` `\n\n` `\n\n` ``<``Style`` x``:``Key``\\=\"frontMatterTextStyle\"\
    `` TargetType``\\=\"TextBlock\"`` `\n\n` BasedOn``\\=\"{``StaticResource`` commonTextStyle``}\"\
    >`` `\n\n` ``<``Setter`` Property``\\=\"TextAlignment\"`` Value``\\=\"Center\"\
    \ />`` `\n\n` ``</``Style``\\>`` `\n\n` `\n\n` ``<``Style`` x``:``Key``\\=\"imageStyle\"\
    `` TargetType``\\=\"Image\">`` `\n\n` ``<``Setter`` Property``\\=\"Stretch\"``\
    \ Value``\\=\"None\" />`` `\n\n` ``<``Setter`` Property``\\=\"HorizontalAlignment\"\
    `` Value``\\=\"Center\" />`` `\n\n` ``</``Style``\\>`` `\n\n`</``Page.Resources``\\\
    >`` `\n\nNotice the *Margin* value that provides a little spacing between the\
    \ paragraphs. Each *TextBlock* \n\nelement references either *paragraphTextStyle*\
    \ (for the actual paragraphs of the book) or \n\n*frontMatterTextStyle* (for all\
    \ the titles and other information that appears in the front of the book). I \n\
    \n131"
