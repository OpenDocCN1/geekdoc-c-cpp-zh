- img_proc: true
  md: "It’s important to realize that all of this code runs in the user interface\
    \ thread. You don’t have to \n\nworry about accessing user interface objects.\
    \ The two methods in the *FileIO* class certainly spin off \n\nsecondary threads\
    \ to do work, but the *ReadFileAsync* method I’ve shown is considered to be \n\
    \nasynchronous only because it calls other asynchronous methods. The other code\
    \ in the method runs in \n\nthe user interface thread. \n\nIf you’re writing some\
    \ of your own code that requires a lot of processing time, you don’t want to do\
    \ \n\nthat job in the user interface thread. But instead of using traditional\
    \ techniques to create and execute \n\nthreads, consider using a task-based approach\
    \ like the Windows Runtime. You can execute program \n\ncode asynchronously by\
    \ passing it as a method to the static *Task.Run* method. Generally this is done\
    \ as \n\nan anonymous method: \n\n`Task``<``double``\\> BigJobAsync(``int`` arg1,\
    \ ``int`` arg2) `\n\n`{ `\n\n` ``return`` ``Task``.Run<``double``\\>(() => `\n\
