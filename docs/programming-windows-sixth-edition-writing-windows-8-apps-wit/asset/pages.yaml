    \ : ``TextBox`` `\n\n` { `\n\n` ``static`` TabbableTextBox() `\n\n` { `\n\n` TabSpacesProperty\
    \ = `\n\n` ``DependencyProperty``.Register(``\"TabSpaces\"``, `\n\n` ``typeof``(``int``),\
