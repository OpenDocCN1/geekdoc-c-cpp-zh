  md: "case the *TextBlock*. The second argument provides information about this particular\
    \ event, including \n\nthe coordinate point at which the tap occurred, and whether\
    \ the tap came from a finger, mouse, or \n\nstylus. This information will be explored\
    \ in more detail in future chapters. \n\n**Routed Event Handling **\n\nBecause\
