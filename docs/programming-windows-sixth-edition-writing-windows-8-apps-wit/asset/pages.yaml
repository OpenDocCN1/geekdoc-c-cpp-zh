    \ use that you’ll \n\ndiscover in a future chapter.) The third option is the *Source*\
    \ property, which is generally used with \n\n*StaticResource* for accessing an\
    \ object in the *Resources* collection. \n\nThere’s a fourth way to specify a\
    \ binding source: if *ElementName*, *RelativeSource*, and *Source* are all \n\n\
    *null*, the *Binding* object checks the *DataContext* property of the binding\
    \ target. \n\nThe *DataContext* property is defined by *FrameworkElement*, and\
    \ it has the wonderful (and essential) \n\ncharacteristic of propagating down\
    \ through the visual tree. Not many properties propagate through \n\nthe visual\
    \ tree in this way. *Foreground* and all the font-related properties do so, but\
    \ not many others. \n\n*DataContext* is one of the big exceptions to the rule.\
    \ \n\nThe constructor of a code-behind file can instantiate a View Model and set\
    \ that instance to the \n\n*DataContext* of the page. Here’s how it’s done in\
    \ the BlankPage.xaml.cs file of the \n\nColorScrollWithDataContext project: \n\
    \n**Project: ColorScrollWithDataContext | File: BlankPage.xaml.cs **\n\n`public``\
    \ BlankPage() `\n\n`{ `\n\n` ``this``.InitializeComponent(); `\n\n` ``this``.DataContext\
    \ = ``new`` ``RgbViewModel``(); `\n\n` `\n\n` ``// Initialize to highlight color``\
    \ `\n\n` (``this``.DataContext ``as`` ``RgbViewModel``).Color = `\n\n` (``this``.Resources\\\
    [``\"ControlHighlightBrush\"``\\] ``as`` ``SolidColorBrush``).Color; `\n\n`} `\n\
