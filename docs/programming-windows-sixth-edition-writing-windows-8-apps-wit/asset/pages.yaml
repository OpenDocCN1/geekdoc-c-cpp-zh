    ` } `\n\n` } `\n\n` } `\n\n` `\n\n` ``// Set EditOrientation based on checked\
    \ RadioButton`` `\n\n` ``void`` OnOrientationRadioButtonChecked(``object`` sender,\
    \ ``RoutedEventArgs`` args) `\n\n` { `\n\n` ``AppSettings`` appSettings = DataContext\
    \ ``as`` ``AppSettings``; `\n\n` ``EditOrientationRadioButton`` radioButton =\
    \ sender ``as`` ``EditOrientationRadioButton``; `\n\n` `\n\n` ``if`` (appSettings\
    \ != ``null``) `\n\n` appSettings.EditOrientation = radioButton.EditOrientationTag;\
    \ `\n\n` } `\n\n` } `\n\n`} `\n\nThe display of the dialog is very similar to\
    \ the MetroPad programs: \n\n**Project: XamlCruncher | File: BlankPage.xaml.cs\
    \ (excerpt) **\n\n`public`` ``sealed`` ``partial`` ``class`` ``BlankPage`` : ``Page``\
    \ `\n\n`{ `\n\n` … `\n\n` ``void`` OnOptionsAppBarButtonClick(``object`` sender,\
    \ ``RoutedEventArgs`` args) `\n\n` { `\n\n` ``SettingsDialog`` settingsDialog\
    \ = ``new`` ``SettingsDialog``(); `\n\n` settingsDialog.DataContext = appSettings;\
    \ `\n\n` `\n\n` ``Popup`` popup = ``new`` ``Popup`` `\n\n` { `\n\n` Child = settingsDialog,\
    \ `\n\n` IsLightDismissEnabled = ``true`` `\n\n` }; `\n\n` `\n\n` settingsDialog.SizeChanged\
    \ += (dialogSender, dialogArgs) => `\n\n` { `\n\n` popup.VerticalOffset = ``this``.ActualHeight\
