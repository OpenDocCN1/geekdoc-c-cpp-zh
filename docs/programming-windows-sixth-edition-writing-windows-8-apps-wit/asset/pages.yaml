  md: "`this``.Dispatcher.Invoke(``CoreDispatcherPriority``.Normal, (sender, args)\
    \ => `\n\n` { `\n\n` txtbox.Text = text; `\n\n` }, `\n\n` ``this``, ``null``);\
    \ `\n\nIndeed, all the *Completed* methods can be defined as anonymous methods,\
