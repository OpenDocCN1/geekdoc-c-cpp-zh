  md: "` `` Command``\\=\"{``Binding`` CalculateCommand``}\"`` `\n\n` `` CommandParameter``\\\
    =\"add\" />`` `\n\nWhat this means is that the View Model has a property named\
    \ *CalculateCommand* of type \n\n*ICommand*, perhaps defined like this: \n\n`public``\
    \ ``ICommand`` CalculateCommand { ``protected`` ``set``; ``get``; } `\n\nThe View\
    \ Model must initialize the *CalculateCommand* property by setting it to an instance\
    \ of a class \n\nthat implements the *ICommand* interface, which is defined like\
    \ so: \n\n`public`` ``interface`` ``ICommand`` `\n\n`{ `\n\n` ``void`` Execute(``object``\
    \ param); `\n\n` ``bool`` CanExecute(``object`` param) `\n\n` event`` ``EventHandler<``object``\\\
    >`` CanExecuteChanged; `\n\n`} `\n\nWhen this particular *Button* is clicked,\
    \ the *Execute* method is called in the class referenced by \n\n*CalculateCommand*\
    \ with an argument of *“add”*. This is how a *Button* basically makes a call right\
    \ into the \n\nView Model (or rather, the class containing that *Execute* method).\
    \ \n\nThe other two-thirds of the *ICommand* interface contain the phrase “can\
    \ execute” and involve the \n\nvalidity of the particular command at a particular\
    \ time. If this command is not currently valid—perhaps \n\nthe calculator can’t\
    \ add right now because no number has been entered—the *Button* should be \n\n\
    disabled. \n\nHere’s how it works: As the XAML is being parsed and loaded at run\
    \ time, the *Command* property of \n\nthe *Button* is assigned a binding to (in\
    \ this example) the *CalculateCommand* object. The *Button* installs \n\na handler\
    \ for the *CanExecuteChanged* event and calls the *CanExecute* method in this\
    \ object with an \n\nargument (in this example) of *“add”*. If *CanExecute* returns\
    \ *false*, the *Button* disables itself. Thereafter, \n\nthe *Button* calls *CanExecute*\
    \ again whenever the *CanExecuteChanged* event is fired. \n\nTo include a command\
    \ in your View Model, you must provide a class that implements the \n\n*ICommand*\
    \ interface. However, it’s very likely that this class needs to access properties\
    \ in the View \n\nModel class, and vice versa. \n\nSo you might wonder: can these\
    \ two classes be one and the same? \n\nIn theory, yes they can, but only if you\
    \ use the same *Execute* and *CanExecute* methods for all the \n\nbuttons on the\
    \ page, which means that each button must have a unique *CommandParameter* so\
    \ that \n\nthe methods can distinguish between them. \n\nI have not been able\
    \ to get it to work, however, so let me show you the standard way of \n\nimplementing\
    \ commands in a View Model. \n\n224"
