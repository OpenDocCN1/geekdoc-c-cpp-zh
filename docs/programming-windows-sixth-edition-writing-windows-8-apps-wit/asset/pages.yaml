  md: "root element. \n\nHowever, every *FrameworkElement* descendant can support\
    \ a *Resources* dictionary, so you might \n\ninclude them further down the visual\
    \ tree. The keys must be unique within any *Resources* dictionary, \n\nbut you\
    \ can use duplicate keys in other *Resources* dictionaries. When the XAML parser\
    \ encounters a \n\n*StaticResource* markup extension, it begins searching up the\
    \ visual tree for a *Resources* dictionary with \n\na matching key and it uses\
    \ the first one it encounters. You can effectively override the values of \n\n\
    *Resources* keys with those in more local dictionaries. \n\nIf the XAML parser\
    \ cannot find a matching key by searching up the visual tree, it checks the \n\
    \n*Resources* dictionary in the *Application* object. The App.xaml file is an\
    \ ideal place for defining resources \n\nthat are used throughout the application.\
    \ To use a bunch of resources across multiple applications, you \n\ncan define\
    \ them in a separate XAML file with a root element of *ResourceDictionary*. Include\
    \ that file in \n\na project, reference it in the App.xaml file, and you can then\
    \ use items in that dictionary. \n\nIndeed, an example is already provided for\
    \ you in the standard Visual Studio projects for Metro style \n\napplications.\
    \ The Common folder contains a file named StandardStyles.xaml that has a root\
    \ element of \n\n*ResourceDictionary*: \n\n`<``ResourceDictionary`` `\n\n` ``\
    \ xmlns``\\=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"`` `\n\
    \n` `` xmlns``:``x``\\=\"http://schemas.microsoft.com/winfx/2006/xaml\">`` `\n\
    \n` `\n\n` … `\n\n` `\n\n`</``ResourceDictionary``\\>`` `\n\nThis file is referenced\
    \ in the standard App.xaml file. In fact, referencing this resources collection\
    \ is just \n\nabout all that the standard App.xaml file does: \n\n`<``Application``\
    \ `\n\n` `` x``:``Class``\\=\"SharedBrush.App\"`` `\n\n` `` xmlns``\\=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    `` `\n\n` `` xmlns``:``x``\\=\"http://schemas.microsoft.com/winfx/2006/xaml\"\
    `` `\n\n` `` xmlns``:``local``\\=\"using:SharedBrush\">`` `\n\n` `\n\n` ``<``Application.Resources``\\\
    >`` `\n\n` ``<``ResourceDictionary``\\>`` `\n\n` ``<``ResourceDictionary.MergedDictionaries``\\\
    >`` `\n\n` ``<``ResourceDictionary`` Source``\\=\"Common/StandardStyles.xaml\"\
    />`` `\n\n` ``</``ResourceDictionary.MergedDictionaries``\\>`` `\n\n` ``</``ResourceDictionary``\\\
    >`` `\n\n` ``</``Application.Resources``\\>`` `\n\n`</``Application``\\>`` `\n\
    \nYou can include your own collections of resources by inserting additional *ResourceDictionary*\
    \ tags in \n\nthe *MergedDictionaries* collection. Or you can include your own\
    \ resources directly in the *App* object’s \n\n*Resources* dictionary. \n\nYou\
    \ can also reference the *Resources* dictionary from code. Following the *InitializeComponent*\
    \ call, \n\n57"
