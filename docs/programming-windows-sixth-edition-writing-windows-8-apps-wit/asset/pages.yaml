  md: "*AppBar* derives from *ContentControl*, and you’ll usually set the *Content*\
    \ property to a panel that \n\ncontains the controls that appear on the application\
    \ bar. \n\nPerhaps the best way to become familiar with the use of application\
    \ bars in real programs is to \n\nexplore some of the standard Metro style applications\
    \ that are part of Windows 8. \n\nThe application bars in the Metro style version\
    \ of Internet Explorer demonstrates that an application \n\nbar can contain a\
    \ variety of controls. However, very often the *BottomAppBar* contains only a\
    \ row of \n\ncircular *Button* controls. In the StandardStyles.xaml file that\
    \ Visual Studio creates in the Common folder \n\nof a standard application, you’ll\
    \ find a *Style* definition with the name *AppBarButtonStyle* that defines \n\n\
    this circular button. In addition, StandardStyles.xaml also defines 29 additional\
    \ styles based on \n\n*AppBarButtonStyle* for common commands such as Play, Edit,\
    \ Save, and Delete. These styles include a \n\ntemplate that references the *AutomationProperties.Name*\
    \ attached property for the text that appears \n\nunder the button. The button\
    \ content in these 29 styles is set to character codes ranging from 0xE100 \n\n\
    to 0xE11C. This is a private use area in the Unicode standard and makes sense\
    \ only for the Segoe UI \n\nSymbol font. This font has additional symbol characters\
    \ beyond 0xE11C that you can also use for \n\napplication bar buttons. \n\nIn\
    \ addition, the Segoe UI Symbol font supports character codes from 0x1F300 through\
    \ 0x1F5FF that \n\nmap to emoji characters. These are icon characters that originated\
    \ in Japan but that have also found \n\ntheir way into the Microsoft Windows Phone\
    \ and the Apple iPhone. Some of these characters might \n\nalso be suitable for\
    \ application bar buttons. (An application to display these symbols is coming\
    \ up.) \n\nUnfortunately, the *AppBarButtonStyle* has a *TargetType* of *Button*,\
    \ and even if you change that to \n\n*ButtonBase*, you cannot use the style for\
    \ *ToggleButton* or *RadioButton*. This is unfortunate, because \n\nsome standard\
    \ Metro style applications use application bar buttons in this way. For example,\
    \ in the \n\nCalendar application, the Day, Week, and Month buttons work like\
    \ a trio of *RadioButton* controls, and \n\nthe Show Traffic button in the Map\
    \ application works like a *ToggleButton*. I suspect in a future version \n\n\
    of StandardStyles.xaml we’ll see *AppBarToggleButtonStyle* and *AppBarRadioButtonStyle*,\
    \ or perhaps \n\ncontrols designed specifically for application bars. \n\nAnother\
    \ approach to implement functionality similar to a *ToggleButton* in an application\
    \ bar is \n\nillustrated in the Weather application. When tapped, the *Button*\
    \ labeled “Change to Celsius” changes to \n\n“Change to Fahrenheit.” \n\nA button\
    \ on an application bar can also invoke a pop-up dialog. For example, press the\
    \ button in \n\nthe Metro style Internet Explorer with the wrench icon and the\
    \ mouse-over tooltip “Page tools.” A little \n\npopup appears with two additional\
    \ commands: “Find on page” and “View on the desktop.” Or try the \n\nMap Style\
    \ button in Maps to see two mutually exclusive options “Road View” and “Aerial\
    \ View” with a \n\ncheckmark indicating the current selection. Or press the “Camera\
    \ options” command in the Camera \n\napplication. You get a popup with combo boxes,\
    \ a toggle switch, and a link for “More,” which displays \n\na larger pop-up dialog.\
    \ \n\nAll these dialogs are probably instances of *Popup*, defined in the \n\n\
    *Windows.UI.Xaml.Controls.Primitives* namespace. *Popup* has a property named\
    \ *Child* that you normally \n\n232"
