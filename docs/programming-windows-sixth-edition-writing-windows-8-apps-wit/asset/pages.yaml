- img_proc: true
  md: "accomplished with objects of type *RowDefinition* and *ColumnDefinition* added\
    \ to two collections \n\ndefined by *Grid* called *RowDefinitions* and *ColumnDefinitions*.\
    \ \n\nThe size of each row and column can be defined in one of three ways: \n\n\
    • \n\nAn explicit row height or column width in pixels \n\n• \n\n*Auto*, meaning\
    \ based on the size of the children \n\n• \n\nAsterisk (or star), which allocates\
    \ remaining space proportionally \n\nIn XAML, property element syntax is used\
    \ to fill the *RowDefinitions* and *ColumnDefinitions* \n\ncollections, so a typical\
    \ *Grid* looks like this: \n\n`<``Grid``\\>`` `\n\n` ``<``Grid.RowDefinitions``\\\
    >`` `\n\n` ``<``RowDefinition`` Height``\\=\"Auto\" />`` `\n\n` ``<``RowDefinition``\
    \ Height``\\=\"55\" />`` `\n\n` ``<``RowDefinition`` Height``\\=\"\\*\" />`` `\n\
    \n` ``</``Grid.RowDefinitions``\\>`` `\n\n` `\n\n` ``<``Grid.ColumnDefinitions``\\\
    >`` `\n\n` ``<``ColumnDefinition`` Width``\\=\"Auto\" />`` `\n\n` ``<``ColumnDefinition``\
    \ Width``\\=\"10\\*\" />`` `\n\n` ``<``ColumnDefinition`` Width``\\=\"20\\*\"\
    \ />`` `\n\n` ``<``ColumnDefinition`` Width``\\=\"Auto\" />`` `\n\n` ``</``Grid.ColumnDefinitions``\\\
    >`` `\n\n` `\n\n` ``<!-- Children go here -->`` `\n\n` `\n\n`</``Grid``\\>`` `\n\
    \nNotice that the *Grid* collection properties are named *RowDefinitions* and\
    \ *ColumnDefinitions* (plural) \n\nbut they contain objects of type *RowDefinition*\
    \ and *ColumnDefinition* (singular). You can omit the \n\n*RowDefinitions* or\
    \ *ColumnDefinitions* for a *Grid* with only one row or one column. \n\nThis particular\
    \ *Grid* has three rows and four columns, and it shows the various ways that the\
    \ size of \n\nthe rows and columns can be defined. A number by itself indicates\
    \ a width (or height) in pixels. Explicit \n\nrow heights and column widths are\
    \ not generally used as much as the other two options. \n\nThe word *Auto* means\
    \ to let the child decide. The calculated height of the row (or width of the \n\
    \ncolumn) is based on the maximum height (or width) of the children in that row\
    \ (or column). \n\nAs in HTML, the asterisk (pronounced “star”) directs the *Grid*\
    \ to allocate the available space. In this \n\n*Grid*, the height of the third\
    \ row is calculated by subtracting the height of the first and second rows \n\n\
    from the total height of the *Grid*. For the columns, the second and third columns\
    \ are allocated the \n\nremaining space calculated by subtracting the widths of\
    \ the first and fourth columns from the total \n\nwidth of the *Grid*. The numbers\
    \ before the asterisks indicates proportions, and here they mean that the \n\n\
    third column gets twice the width of the second column. \n\nThe star values are\
    \ applicable only when the size of the *Grid* is parent-driven! For example, suppose\
    \ \n\n157"
