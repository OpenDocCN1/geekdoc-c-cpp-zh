    =\"Bevel join\"`` `\n\n` `` LineJoinTag``\\=\"Bevel\"`` `\n\n` `` Checked``\\\
    =\"OnLineJoinRadioButtonChecked\" />`` `\n\n` `\n\n` ``<``local``:``LineJoinRadioButton``\
    \ Content``\\=\"Miter join\"`` `\n\n` `` LineJoinTag``\\=\"Miter\"`` `\n\n` ``\
    \ Checked``\\=\"OnLineJoinRadioButtonChecked\" />`` `\n\n` `\n\n` ``<``local``:``LineJoinRadioButton``\
