  md: " \n\nAnd, of course, you can scroll it with your finger or the mouse. \n\n\
    As you play around with the program, you’ll discover that the *ScrollViewer* incorporates\
    \ a nice fluid \n\nresponse to your finger movements, including inertia and bounce.\
    \ You’ll want to use *ScrollViewer* for \n\nvirtually all your scrolling needs.\
    \ You’ll discover that many controls that incorporate scrolling—such as \n\nthe\
    \ *ListBox* and *GridView* coming up in a future chapter—have this same *ScrollViewer*\
    \ built right in. I \n\nwouldn’t be surprised if this same *ScrollViewer* is used\
    \ in the Windows 8 start screen. \n\nWouldn’t it be nice to see the actual colors\
    \ as well as their names and values? That enhancement is \n\ncoming up soon! \n\
    \nSeveral times already in this book I’ve shown you partial class hierarchies.\
    \ You may have discovered \n\nthat the documentation for each class shows only\
    \ an ancestor class hierarchy but not derived classes, \n\nso you might have wondered\
    \ how I assembled the class hierarchies for these pages. They came from a \n\n\
    program I wrote called DependencyObjectClassHierarchy, which uses a *ScrollViewer*\
    \ and *StackPanel* to \n\nshow all the classes that derive from *DependencyObject*.\
    \ \n\nThe XAML file is similar to the previous one except I’ve specified a smaller\
    \ font: \n\n**Project: DependencyObjectClassHierarchy | File: BlankPage.xaml (excerpt)\
    \ **\n\n`<``Page`` `\n\n` `` x``:``Class``\\=\"DependencyObjectClassHierarchy.BlankPage\"\
    `` `\n\n` `` ``… `\n\n` `` FontSize``\\=\"{``StaticResource`` ContentFontSize``}\"\
