  md: "set *Width* and *Height* to explicit values (such as in the TextFormatting\
    \ project in Chapter 2, “XAML \n\nSyntax”), but usually these properties remain\
    \ at their default values and they are of no use in \n\ndetermining how large\
    \ an element actually is. *FrameworkElement* also defines *MinWidth*, *MaxWidth*,\
    \ \n\n*MinHeight*, and *MaxHeight* properties, but these aren’t used very often.\
    \ \n\nIf you access the *ActualWidth* and *ActualHeight* properties in the page’s\
    \ constructor, however, you’ll \n\nfind they have values of zero. Despite the\
    \ fact that *InitializeComponent* has constructed the visual tree, \n\nthat visual\
    \ tree has not yet gone through a layout process. After the constructor finishes,\
    \ the page gets \n\nseveral events in sequence: \n\n• \n\n*OnNavigatedTo* \n\n\
    • \n\n*SizeChanged* \n\n• \n\n*LayoutUpdated* \n\n• \n\n*Loaded* \n\nIf the page\
    \ later changes size, additional *SizeChanged* events and *LayoutUpdated* events\
    \ are fired. \n\n*LayoutUpdated* can also be fired if elements are added to or\
    \ removed from the visual tree or if an \n\nelement is changed so as to affect\
    \ layout. \n\nIf you need a place to perform initialization after initial layout\
    \ when all the elements in the visual \n\ntree have nonzero sizes, the event you\
    \ want is *Loaded*. It is very common for a *Page* class to attach a \n\nhandler\
    \ for the *Loaded* event. Generally, the *Loaded* event occurs only once during\
    \ the lifetime of a \n\n*Page* object. I say “generally” because if the *Page*\
    \ object is detached from its parent (a *Frame*) and \n\nreattached, the *Loaded*\
    \ event will occur again. But this won’t happen unless you deliberately make it\
    \ \n\nhappen. Also, the *Unloaded* event can let you know if the page has been\
    \ detached from the visual tree. \n\nEvery *FrameworkElement* derivative has a\
    \ *Loaded* event. As a visual tree is built, the *Loaded* events \n\noccur in\
    \ a sequence going up the visual tree, ending with *Page*. When *Page* gets a\
    \ *Loaded* event, it can \n\nassume that all its children have fired their own\
    \ *Loaded* events and everything has been correctly sized. \n\nHandling a *Loaded*\
    \ event in a *Page* class is so common that some programmers perform *Loaded*\
    \ \n\nprocessing right in the constructor using an anonymous handler: \n\n`public``\
    \ BlankPage() `\n\n`{ `\n\n` ``this``.InitializeComponent(); `\n\n` `\n\n` Loaded\
