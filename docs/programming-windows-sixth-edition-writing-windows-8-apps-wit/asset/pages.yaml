    \ the user wants to save the file. The options are Save, \n\nDon’t Save, and Cancel.\
    \ \n\nThe easy answer is Cancel. The program doesn’t need to do anything further.\
    \ If the user selects the \n\nDon’t Save option, the current document can be abandoned\
    \ and the New or Open command can \n\nproceed. \n\nIf the user answers Save, the\
    \ existing document needs to be saved under its filename. But that \n\nfilename\
    \ might not exist if the document wasn’t loaded from a disk file or previously\
    \ saved. At that \n\npoint, the Save As dialog box needs to be displayed. But\
    \ the user can select Cancel from that dialog \n\nbox as well, and the New or\
    \ Open operation ends. Otherwise, the existing file is first saved. \n\nLet’s\
    \ first look at the methods involved in saving documents. The application button\
    \ has Save and \n\nSave As buttons, but the Save button needs to invoke the Save\
    \ As dialog box if it doesn’t have a \n\nfilename for the document: \n\n**Project:\
