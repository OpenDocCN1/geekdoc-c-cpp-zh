  md: "`} `\n\nLook at that special URL for referencing the content bitmap file from\
    \ code. In XAML, that special prefix \n\nis optional. \n\nAre there general rules\
    \ to determine when to use XAML and when to use code? Not really. I tend to \n\
    \nuse XAML whenever possible except when the repetition becomes ridiculous. My\
    \ normal rule for code \n\nis “three or more: use a *for*,” but I’ll often allow\
    \ somewhat more repetition in XAML before moving it \n\ninto code. A lot depends\
    \ on how concise and elegant you’ve managed to make the XAML and how \n\nmuch\
    \ effort it would be to change something. \n\n**Not Even a Page **\n\nInsights\
    \ into how a Windows Runtime program starts up can be obtained by examining the\
    \ \n\n*OnLaunched* override in the standard App.xaml.cs file. You’ll discover\
    \ that it creates a *Frame* object, \n\nuses this *Frame* object to navigate to\
    \ an instance of *BlankPage* (which is how *BlankPage* gets \n\ninstantiated),\
    \ and then sets this *Frame* object to a precreated *Window* object accessible\
    \ through the \n\n*Window.Current* static property: \n\n`var`` rootFrame = ``new``\
    \ ``Frame``(); `\n\n`rootFrame.Navigate(``typeof``(``BlankPage``)); `\n\n`Window``.Current.Content\
    \ = rootFrame; `\n\n`Window``.Current.Activate(); `\n\nA Metro style application\
    \ doesn’t require a *Page*, a *Frame*, or even any XAML files at all. Let’s \n\
    \nconclude this chapter by creating a new project named StrippedDownHello and\
    \ begin by deleting the \n\nApp.xaml, App.xaml.cs, BlankPage.xaml, and BlankPage.xaml.cs\
    \ files, as well as the entire Common \n\nfolder. Yes, delete them all! Now the\
    \ project has no code files and no XAML files. It’s left with just an \n\napp\
    \ manifest, assembly information, and some PNG files. \n\nRight-click the project\
    \ name and select Add and New Item. Select either a new class or code file and\
    \ \n\nname it App.cs. Here’s what you’ll want it to look like: \n\n**Project:\
    \ StrippedDownHello | File: App.cs **\n\n`using`` Windows.ApplicationModel.Activation;\
    \ `\n\n`using`` Windows.UI; `\n\n`using`` Windows.UI.Xaml; `\n\n`using`` Windows.UI.Xaml.Controls;\
    \ `\n\n`using`` Windows.UI.Xaml.Media; `\n\n` `\n\n`namespace`` TryStrippedDown\
    \ `\n\n`{ `\n\n` ``public`` ``class`` ``App`` : ``Application`` `\n\n` { `\n\n\
    ` ``static`` ``void`` Main(``string``\\[\\] args) `\n\n` { `\n\n` ``Application``.Start((p)\
    \ => ``new`` ``App``()); `\n\n` } `\n\n40"
