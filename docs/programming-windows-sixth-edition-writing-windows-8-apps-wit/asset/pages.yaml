    \ ``AsyncStatus`` asyncStatus) `\n\n`{ `\n\n` … `\n\n`} `\n\nBoth *IRandomAccessStreamWithContentType*\
    \ and *DataReader* implement *IClosable* (which is the same \n\nas the .NET *IDisposable*),\
