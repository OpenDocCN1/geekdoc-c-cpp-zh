  md: " \n\nIf you don’t like the look of any of these, keep in mind that you can\
    \ entirely redesign them with a \n\n*ControlTemplate* that I’ll explore in a future\
    \ chapter. \n\nLike all *FrameworkElement* derivatives, the default values of\
    \ the *HorizontalAlignment* and \n\n*VerticalAlignment* properties are *Stretch*.\
    \ However, by the time the button is loaded, the \n\n*HorizontalAlignment* property\
    \ has been set to *Left*, the *VerticalAlignment* is *Center*, and a nonzero \n\
    \n*Padding* has also been set. Although the *Margin* property is zero, the visuals\
    \ contain a little built-in \n\nmargin that surrounds the *Border*. \n\n*ButtonBase*\
    \ defines the *Click* event, which is fired when a finger, mouse, or stylus presses\
    \ the control \n\nand then releases, but that behavior can be altered with the\
    \ *ClickMode* property. Alternatively, a \n\nprogram can be notified that the\
    \ button has been clicked through a command interface that I’ll discuss \n\nin\
    \ Chapter 6. \n\nThe classic button is *Button*. There’s nothing really special\
    \ about *HyperlinkButton* except that it looks \n\ndifferent as a result of a\
    \ different template. *RepeatButton* generates a series of *Click* events if held\
    \ \n\ndown for a moment; this is mostly intended for the repeat behavior of the\
    \ *ScrollBar*. \n\nEach click of the *ToggleButton* toggles it on and off. The\
    \ screen shot shows the on state. *CheckBox* \n\ndefines nothing public on its\
    \ own; it simply inherits all the functionality of *ToggleButton* and achieves\
    \ a \n\ndifferent look with a template. \n\n*ToggleButton* defines an *IsChecked*\
    \ property to indicate the current state, as well as *Checked* and \n\n*Unchecked*\
    \ events to signal when changing to the on or off state. In general, you’ll want\
    \ to install \n\nhandlers for both these events, but you can share one handler\
    \ for the job. \n\nThe *IsChecked* property of *ToggleButton* is not a *bool*.\
    \ It is a *Nullable<bool>*, which means that it can \n\nhave a value of *null*.\
    \ This oddity is to accommodate toggle buttons that have a third “indeterminate”\
    \ \n\nstate. The classic example is a *CheckBox* labeled “Bold” in a word-processing\
    \ program: If the selected \n\n![](img/bc006cce5c2364a011861f29233d37ef_171_0.png)\n\
    \n172"
  merge: -1
  pgno: 171
- img_proc: true
  md: "text is bold, the box should be checked. If the selected text is not bold,\
    \ it should be unchecked. If the \n\nselected text contains some bold and some\
    \ nonbold, however, the *CheckBox* should show an \n\nindeterminate state. You’ll\
    \ need to set the *IsThreeState* property to *true* to enable this feature, and\
    \ \n\nyou’ll want to install a handler for the *Indeterminate* event. *ToggleButton*\
    \ does not have a unique \n\nappearance for the indeterminate state; *CheckBox*\
    \ displays a little box rather than a checkmark. \n\nWith all that said, you might\
    \ want to gravitate towards the *ToggleSwitch* control for your toggling \n\n\
    needs because it’s specifically designed for touch in Metro style applications.\
    \ Although *ToggleSwitch* \n\ndoes not derive from *ButtonBase*, I’ve included\
    \ one anyway at the bottom of the list. As you can see, it \n\nprovides default\
    \ labels of “Off” and “On” but you can change those. A header is also available,\
    \ as you’ll \n\ndiscover in Chapter 7, “Building an Application.” \n\nThe *RadioButton*\
    \ is a special form of *ToggleButton* for selecting one item from a collection\
    \ of \n\nmutually exclusive options. The name of the control comes from old car\
    \ radios with buttons for \n\npreselected stations: press a button, and the previously\
    \ pressed button pops out. Similarly, when a \n\n*RadioButton* control is checked,\
    \ it unchecks all other sibling *RadioButton* controls. The only thing you \n\n\
    need to do is make them all children of the same panel. (Watch out: if you put\
