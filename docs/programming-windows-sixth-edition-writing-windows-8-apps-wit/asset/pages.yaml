  md: "You cannot derive a style from an implicit style. However, an implicit style\
    \ can be based on a \n\nnonimplicit style. Simply provide *TargetType* and *BasedOn*\
    \ attributes and leave out the *x:Key*. \n\nThe implicit style is very powerful,\
    \ but remember: With great power comes…and you know the rest. \n\nIn a large application,\
    \ styles can be defined all over the place and visual trees can extend over multiple\
    \ \n\nXAML files. It sometimes happens that a style is implicitly applied to an\
    \ element, but it’s very hard to \n\ndetermine where that style is actually defined!\
    \ \n\nAt this point, you can begin using (or at least start looking at) the *TextBlock*\
    \ styles defined in the \n\nStandardStyles.xaml file. These are called BasicTextStyle,\
    \ BaselineTextStyle, HeaderTextStyle, \n\nSubheaderTextStyle, TitleTextStyle,\
    \ ItemTextStyle, BodyTextStyle, and CaptionTextStyle, and obviously \n\nthey are\
    \ for more extensive text layout than I’ve been doing here. \n\n**A Taste of Data\
    \ Binding **\n\nAnother way to share objects in a XAML file is through data bindings.\
    \ Basically, a data binding \n\nestablishes a connection between two properties\
    \ of different objects. As you’ll see in Chapter 6, “WinRT \n\nand MVVM,” data\
    \ bindings find their greatest application in linking visual elements on a page\
    \ with \n\ndata sources, and they form a crucial part of implementing the popular\
    \ Model-View-View Model \n\n(MVVM) architectural pattern. In MVVM, the target\
    \ of the binding is a visual element in the View, and \n\nthe source of the binding\
    \ is a property in a corresponding View Model. \n\nYou can also use data bindings\
    \ to link properties of two elements. Like *StaticResource*, *Binding* is \n\n\
    generally expressed as a markup extension, which means that it appears between\
    \ a pair of curly braces. \n\nHowever, *Binding* is more elaborate than *StaticResource*\
    \ and can alternatively be expressed in \n\nproperty-element syntax. \n\nHere’s\
    \ the *Resources* section from the SharedBrushWithBinding project: \n\n**Project:\
    \ SharedBrushWithBinding | File: BlankPage.xaml (excerpt) **\n\n`<``Page.Resources``\\\
    >`` `\n\n` ``<``x``:``String`` x``:``Key``\\=\"appName\">``Shared Brush with Binding``</``x``:``String``\\\
    >`` `\n\n` `\n\n` ``<``Style`` TargetType``\\=\"TextBlock\">`` `\n\n` ``<``Setter``\
    \ Property``\\=\"FontFamily\"`` Value``\\=\"Times New Roman\" />`` `\n\n` ``<``Setter``\
    \ Property``\\=\"FontSize\"`` Value``\\=\"96\" />`` `\n\n` ``</``Style``\\>``\
    \ `\n\n`</``Page.Resources``\\> `\n\nThe implicit style for the *TextBlock* no\
    \ longer has a *Foreground* property. The *LinearGradientBrush* is \n\ndefined\
    \ on the first of the four *TextBlock* elements that use that brush, and the subsequent\
    \ *TextBlock* \n\nelements reference that same brush through a binding: \n\n**Project:\
    \ SharedBrushWithBinding | File: BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\\
    =\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"{``StaticResource`` appName``}\"`` `\n\n74"
