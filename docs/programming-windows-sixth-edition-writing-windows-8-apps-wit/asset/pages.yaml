  md: "The file is dominated by *using* directives for all the namespaces that you\
    \ are anticipated to need. \n\nYou'll discover that most BlankPage.xaml.cs files\
    \ don't require all these namespace names and many \n\nothers require some additional\
    \ namespaces. \n\nThese namespaces fall into two general categories based on the\
    \ first word in the name: \n\n• \n\n***System.\\**** .NET for Metro style applications\
    \ \n\n• \n\n***Windows.\\**** Windows Runtime (or WinRT) \n\nAs suggested by the\
    \ list of *using* directives, namespaces that begin with *Windows.UI.Xaml* play\
    \ a major \n\nrole in the Windows Runtime. \n\nFollowing the *using* directives,\
    \ this BlankPage.xaml.cs file defines a namespace named *Hello* (the \n\nsame\
    \ as the project name) and a class named *BlankPage* that derives from *Page*,\
    \ a class that is part of \n\nthe Windows Runtime. \n\nThe documentation of the\
    \ Windows 8 API is organized by namespace, so if you want to locate the \n\ndocumentation\
    \ of the *Page* class, knowing the namespace where it’s defined is useful. Let\
    \ the mouse \n\npointer hover over the name *Page* in the BlankPage.xaml.cs source\
    \ code, and you’ll discover that *Page* \n\nis in the *Windows.UI.Xaml.Controls*\
    \ namespace. \n\nThe constructor of the *BlankPage* class calls an *InitializeComponent*\
    \ method (which I'll discuss \n\nshortly), and the class also contains an override\
    \ of a method named *OnNavigatedTo*. Metro style \n\napplications often have a\
    \ page-navigation structure somewhat like a website, and hence they often \n\n\
    consist of multiple classes that derive from *Page*. For navigational purposes,\
    \ *Page* defines virtual \n\nmethods named *OnNavigatingFrom*, *OnNavigatedFrom*,\
    \ and *OnNavigatedTo*. The override of \n\n*OnNavigatedTo* is a convenient place\
    \ to perform initialization when the page becomes active. But \n\nthat's for later;\
    \ most of the programs in the early chapters of this book will have only one page.\
    \ I’ll tend \n\nto refer to an application’s “page” more than its “window.” There\
    \ is still a window underneath the \n\napplication, but it doesn’t play nearly\
    \ as large a role as the page. \n\nNotice the *partial* keyword on the *BlankPage*\
    \ class definition. This keyword usually means that the \n\nclass definition is\
    \ continued in another C# source code file. In reality (as you’ll see), that’s\
    \ exactly the \n\ncase. Conceptually, however, the missing part of the *BlankPage*\
    \ class is not another C# code file but the \n\nBlankPage.xaml file: \n\n`<``Page``\
    \ `\n\n` `` x``:``Class``\\=\"Hello.BlankPage\"`` `\n\n` `` xmlns``\\=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    `` `\n\n` `` xmlns``:``x``\\=\"http://schemas.microsoft.com/winfx/2006/xaml\"\
    `` `\n\n` `` xmlns``:``local``\\=\"using:Hello\"`` `\n\n` `` xmlns``:``d``\\=\"\
    http://schemas.microsoft.com/expression/blend/2008\"`` `\n\n` `` xmlns``:``mc``\\\
    =\"http://schemas.openxmlformats.org/markup-compatibility/2006\"`` `\n\n` `` mc``:``Ignorable``\\\
    =\"d\">`` `\n\n` `\n\n` ``<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` `\n\n` ``</``Grid``\\>`` `\n\n17"
