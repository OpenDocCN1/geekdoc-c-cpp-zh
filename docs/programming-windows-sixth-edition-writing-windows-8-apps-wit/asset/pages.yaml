    [col\\].Text = (baseCode / 16 + col).ToString(``\"X3\"``) + ``\"\\_\"``; `\n\n\
    ` `\n\n` ``for`` (``int`` row = 0; row < 16; row++) `\n\n` { `\n\n` ``int`` code\
    \ = baseCode + 16 \\* col + row; `\n\n` ``string`` strChar = ``null``; `\n\n`\
    \ `\n\n` ``if`` (code <= 0x0FFFF) `\n\n` { `\n\n` strChar = ((``char``)code).ToString();\
    \ `\n\n` } `\n\n` ``else`` `\n\n` { `\n\n` code -= 0x10000; `\n\n` ``int`` lead\
    \ = 0xD800 + code / 1024; `\n\n` ``int`` trail = 0xDC00 + code % 1024; `\n\n`\
    \ strChar = ((``char``)lead).ToString() + (``char``)trail; `\n\n` } `\n\n` txtblkCharacters\\\
    [col, row\\].Text = strChar; `\n\n237"
