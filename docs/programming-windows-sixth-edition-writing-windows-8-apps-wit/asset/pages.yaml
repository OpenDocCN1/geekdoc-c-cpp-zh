  md: " \n\nIt seems that the Round join is not implemented in the version of Windows\
    \ 8 I’m using. \n\nAlthough the markup is very explicit about setting the *Tag*\
    \ property to a member of the *PenLineCap* \n\nor *PenLineJoin* enumeration, the\
    \ XAML parser actually assigns the *Tag* an integer corresponding to the \n\n\
    underlying enumeration value. This integer can easily be cast into the correct\
    \ enumeration member, \n\nbut it’s definitely not the enumeration member itself.\
    \ \n\nMuch of the awkward markup in the LineCapsAndJoins can be eliminated by\
    \ defining a couple \n\nsimple custom controls. These custom controls don’t need\
    \ to have dependency properties; they can \n\nhave just a very simple regular\
    \ .NET property for a tag corresponding to a particular type. \n\nThe LineCapsAndJoinsWithCustomClass\
    \ shows how this works. Here’s a *RadioButton* derivative \n\nspecifically for\
    \ representing a *PenLineCap* value: \n\n**Project: LineCapsAndJoinsWithCustomClass\
    \ | File: LineCapRadioButton.cs **\n\n`using`` Windows.UI.Xaml.Controls; `\n\n\
    `using`` Windows.UI.Xaml.Media; `\n\n` `\n\n`namespace`` LineCapsAndJoinsWithCustomClass\
    \ `\n\n`{ `\n\n` ``public`` ``class`` ``LineCapRadioButton`` : ``RadioButton``\
    \ `\n\n` { `\n\n` ``public`` ``PenLineCap`` LineCapTag { ``set``; ``get``; } `\n\
    \n` } `\n\n`} `\n\nSimilarly, here’s one for PenLineJoin values: \n\n**Project:\
    \ LineCapsAndJoinsWithCustomClass | File: LineJoinRadioButton.cs **\n\n`using``\
    \ Windows.UI.Xaml.Controls; `\n\n`using`` Windows.UI.Xaml.Media; `\n\n` `\n\n\
