  md: "` ``RadioButton`` radioButton = child ``as`` ``RadioButton``; `\n\n` radioButton.IsChecked\
    \ = (``TextWrapping``)radioButton.Tag == (``TextWrapping``)args.NewValue; `\n\n\
    ` } `\n\n` } `\n\n` `\n\n` ``void`` OnRadioButtonChecked(``object`` sender, ``RoutedEventArgs``\
    \ args) `\n\n` { `\n\n` ``this``.TextWrapping = (``TextWrapping``)(sender ``as``\
    \ ``RadioButton``).Tag; `\n\n` } `\n\n`} `\n\nThe event handler for the “Wrap\
    \ options” application bar button is in the *BlankPage* code-behind \n\nfile.\
    \ The event handler instantiates a *WrapOptionsDialog* object and initializes\
    \ its *TextWrapping* \n\nproperty from the *TextWrapping* property of the *TextBox*.\
    \ It then defines a binding in code between the \n\ntwo *TextWrapping* properties.\
    \ This allows the user to see the result of changing this property directly in\
    \ \n\nthe *TextBox*. The *WrapOptionsDialog* object is then made a child of a\
    \ new *Popup* object: \n\n**Project: MetroPad1 | File: BlankPage.xaml.cs (excerpt)\
    \ **\n\n`void`` OnWrapOptionsAppBarButtonClick(``object`` sender, ``RoutedEventArgs``\
    \ args) `\n\n`{ `\n\n` ``// Create dialog`` `\n\n` ``WrapOptionsDialog`` wrapOptionsDialog\
    \ = ``new`` ``WrapOptionsDialog`` `\n\n` { `\n\n` TextWrapping = txtbox.TextWrapping\
    \ `\n\n` }; `\n\n` `\n\n` ``// Bind dialog to TextBox`` `\n\n` ``Binding`` binding\
    \ = ``new`` ``Binding`` `\n\n` { `\n\n` Source = wrapOptionsDialog, `\n\n` Path\
    \ = ``new`` ``PropertyPath``(``\"TextWrapping\"``), `\n\n` Mode = ``BindingMode``.TwoWay\
    \ `\n\n` }; `\n\n` txtbox.SetBinding(``TextBox``.TextWrappingProperty, binding);\
    \ `\n\n` `\n\n` ``// Create popup`` `\n\n` ``Popup`` popup = ``new`` ``Popup``\
    \ `\n\n` { `\n\n` Child = wrapOptionsDialog, `\n\n` IsLightDismissEnabled = ``true``\
    \ `\n\n` }; `\n\n` `\n\n` ``// Adjust location based on content size`` `\n\n`\
    \ wrapOptionsDialog.SizeChanged += (dialogSender, dialogArgs) => `\n\n` { `\n\n\
    ` popup.VerticalOffset = ``this``.ActualHeight - wrapOptionsDialog.ActualHeight\
    \ `\n\n` - ``this``.BottomAppBar.ActualHeight - 48; `\n\n` popup.HorizontalOffset\
