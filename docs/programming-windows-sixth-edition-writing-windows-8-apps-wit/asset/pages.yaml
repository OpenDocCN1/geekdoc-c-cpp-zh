  md: "` `` ConverterParameter``\\=F0}\" />`` `\n\nThe *Binding* markup is spread\
    \ out over four lines for purposes of clarity (and to stay within the margins\
    \ \n\nof the book page), but notice that the *Binding* markup extension contains\
    \ an embedded markup \n\nextension of *StaticResource* for referencing the binding\
    \ converter resource. No quotation marks appear \n\nwithin either markup extension.\
    \ \n\nThe Common folder in the standard Visual Studio project contains two binding\
    \ converters. \n\n*BooleanToVisibilityConverter* is useful for controlling the\
    \ *Visibility* property, which takes on values of \n\n*Visibility.Visible* and\
    \ *Visibility.Collapsed*. The *BooleanNegationConverter* changes *true* to *false*\
    \ and *false* \n\nto *true*. \n\n**The *****ScrollViewer***** Solution **\n\n\
    What happens if there are too many elements for *StackPanel* to display on the\
    \ screen? In real life, that \n\nsituation occurs quite often and it’s why a *StackPanel*\
    \ with more than just a few elements is almost \n\nalways put inside a *ScrollViewer*.\
    \ \n\nThe *ScrollViewer* has a property named *Content* that you can set to anything\
    \ that might be too large \n\nto display in the space allowed for it—a single\
    \ large *Image*, for example. *ScrollViewer* provides \n\nscrollbars for the mouse-users\
    \ among us. Otherwise, you can just scroll it with your fingers. By default, \n\
    \n*ScrollViewer* also adds a pinch interface so that you can use two fingers to\
    \ make the content larger or \n\nsmaller. This can be disabled if you want by\
    \ setting the *ZoomMode* property to *Disabled*. \n\n*ScrollViewer* defines a\
    \ couple other crucial properties. Most often you’ll be using *ScrollViewer* for\
    \ \n\nvertical scrolling, such as with a vertical *StackPanel*. Consequently,\
    \ the default value of the \n\n*VerticalScrollBarVisibility* property is the enumeration\
    \ member *ScrollBarVisibility.Visible*. This setting \n\ndoesn’t mean that the\
    \ scrollbar is actually visible all the time. For mouse users, the scrollbar appears\
    \ \n\nonly when the mouse is moved to the right side of the *ScrollViewer*, and\
    \ then it fades from view if the \n\nmouse is moved away. A much thinner slider\
    \ appears when you scroll using your finger. \n\nHorizontal scrolling is different:\
    \ the default value of *HorizontalScrollBarVisibility* property is *Disabled*,\
    \ \n\nso you’ll want to change that to enable horizontal scrolling. The other\
    \ two options are *Hidden*, which \n\nallows scrolling with your fingers but not\
    \ the mouse, and *Auto*, which is the same as *Visible* if the \n\ncontent requires\
    \ scrolling and *Disabled* otherwise. \n\nThe XAML file for the StackPanelWithScrolling\
    \ program contains a *StackPanel* in a *ScrollViewer*. \n\nNotice that the *FontSize*\
    \ property is set in the root tag based on a predefined identifier: \n\n**Project:\
    \ StackPanelWithScrolling | File: BlankPage.xaml (excerpt) **\n\n`<``Page`` `\n\
    \n` `` x``:``Class``\\=\"StackPanelWithScrolling.BlankPage\"`` `\n\n` `` ``… `\n\
    \n` `` FontSize``\\=\"{``StaticResource`` HeaderMediumFontSize``}\">`` `\n\n`\
    \ `\n\n123"
