  md: "`</``Page``\\>`` `\n\nThis file consists of markup conforming to the standard\
    \ known as the eXtensible Application Markup \n\nLanguage, or XAML, pronounced\
    \ “zammel.” As the name implies, XAML is based on eXtensible Markup \n\nLanguage,\
    \ or XML. \n\nGenerally, you'll use the XAML file for defining all the visual\
    \ elements of the page, while the C# file \n\nhandles jobs that can't be performed\
    \ in markup, such as number crunching and responding to user \n\ninput. The C#\
    \ file is often referred to as the \"code-behind\" file for the corresponding\
    \ XAML file. \n\nThe root element of this XAML file is *Page*, which you already\
    \ know is a class in the Windows \n\nRuntime. But notice the *x:Class* attribute:\
    \ \n\n`<``Page`` `\n\n` `` x``:``Class``\\=\"Hello.BlankPage\"`` `\n\nThe *x:Class*\
    \ attribute can appear only on the root element in a XAML file. This particular\
    \ *x:Class* \n\nattribute translates as “a class *BlankPage* in the *Hello* namespace\
    \ is defined as deriving from *Page*.” It \n\nmeans the same thing as the class\
    \ definition in the C# file! \n\nThe *x:Class* attribute is followed by a bunch\
    \ of XML namespace declarations. As usual, these URIs \n\ndon’t actually reference\
    \ interesting webpages but instead serve as unique identifiers maintained by \n\
    \nparticular companies or organizations. The first two are the most important:\
    \ \n\n`xmlns``\\=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    `` `\n\n`xmlns``:``x``\\=\"http://schemas.microsoft.com/winfx/2006/xaml\"`` `\n\
    \nThe 2006 date harkens back to Microsoft's introduction of the Windows Presentation\
    \ Foundation \n\nand the debut of XAML. WPF was part of the .NET Framework 3.0,\
    \ which prior to its release was known \n\nas WinFX, hence the “winfx” in the\
    \ URI. To a certain extent, XAML files are compatible between WPF, \n\nSilverlight,\
    \ Windows Phone, and the Windows Runtime, but only if they use classes, properties,\
    \ and \n\nfeatures common to all the environments. \n\nThe first namespace declaration\
    \ with no prefix refers to public classes, structures, and enumerations \n\ndefined\
    \ in the Windows Runtime, which includes all the controls and everything else\
    \ that can appear in \n\na XAML file, including the *Page* and *Grid* classes\
    \ in this particular file. The word \"presentation\" in this \n\nURI refers to\
    \ a visual user interface, and that distinguishes it from other types of applications\
    \ that can \n\nuse XAML. For example, if you were using XAML for the Windows Workflow\
    \ Foundation (WF), you'd \n\nuse a default namespace URI ending with the word\
    \ \"workflow\". \n\nThe second namespace declaration associates an “x” prefix\
    \ with elements and attributes that are \n\nintrinsic to XAML itself. Only nine\
    \ of these are applicable in Windows Runtime applications, and \n\nobviously one\
    \ of the most important is the *x:Class* attribute. \n\nThe third namespace declaration\
    \ is interesting: \n\n`xmlns``:``local``\\=\"using:Hello\"`` `\n\nThis associates\
    \ an XML prefix of *local* with the *Hello* namespace of this particular application.\
    \ You \n\n18"
