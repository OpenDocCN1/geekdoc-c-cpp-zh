  md: " \n\n \n\n \n\n \n\n \n\n \n\n*RangeBase* \n\n \n\n \n\n \n\n \n\n \n\n \n\n\
    *UserControl* \n\n*ContentControl*—from which important classes like *Button*,\
    \ *ScrollViewer*, and *AppBar* \n\nderive—seemingly does little more than define\
    \ a property named *Content* of type *object*. For a *Button*, \n\nfor example,\
    \ this *Content* property is what you use to set whatever you want to appear inside\
    \ the \n\n*Button*. Most often this is text or a bitmap, but you can also use\
    \ a panel that contains other content. \n\nIt is interesting that the *Content*\
    \ property of *ContentControl* is of type *object* rather than *UIElement*. \n\
    \nThere's a good reason for that. You can actually put pretty much any type of\
    \ object you want as the \n\ncontent of a *Button*, and you can supply a template\
    \ (in the form of a visual tree) that tells the *Button* \n\nhow to display this\
    \ content. This feature is not so much used for *Button*, but it's used a great\
    \ deal for \n\nitems in *ItemsControl* derivatives. I’ll show you how to define\
    \ a content template in a future chapter. \n\n*ItemsControl* is the parent class\
    \ to a bunch of controls that display collections of items. Here you'll \n\nfind\
    \ the familiar *ListBox* and *ComboBox* as well as the new Windows 8 controls\
    \ *GridView* and *ListView*. \n\nThis is such an important category of controls\
    \ that a whole future chapter will be devoted to it. \n\nThere are a couple ways\
    \ to create custom controls. The really simple way is by defining a *Style* for\
    \ \n\nthe control, but more extensive visual changes require a template. In some\
    \ cases you can derive from \n\nan existing control to add some features to it,\
    \ or you can derive from *ContentControl* or *ItemsControl* if \n\nthese controls\
    \ provide features you need. \n\nBut one of the most common ways to create a custom\
    \ control is by deriving from *UserControl*. This \n\nis not the approach you'll\
    \ use if you want to market a custom control library, but it's great for controls\
    \ \n\nthat you use yourself within the context of an application. \n\n**The *****Slider*****\
    \ for Ranges **\n\nThe final important parent class that derives from *Control*\
    \ is *RangeBase*, which has three derivatives: \n\n*ProgressBar*, *ScrollBar*,\
    \ and *Slider*. \n\nWhich of these is not like the others? Obviously *ProgressBar*,\
    \ which exists in this hierarchy mainly to \n\ninherit several properties from\
    \ *RangeBase*: *Minimum*, *Maximum*, *SmallChange*, *LargeChange*, and \n\n*Value*.\
    \ In every *RangeBase* control, the *Value* property takes on values of type *double*\
    \ ranging from \n\n*Minimum* through *Maximum*. With the *ScrollBar* and *Slider*,\
    \ the *Value* property changes when the user \n\nmanipulates the control; with\
    \ *ProgressBar*, the *Value* property is set programmatically to indicate the\
    \ \n\nprogress of a lengthy operation. \n\n*ProgressBar* has an indeterminate\
    \ mode to display a row of dots that skirt across the screen, but also \n\navailable\
    \ is *ProgressRing*, which displays a series of dots that parade around in a circle.\
    \ \n\nIn the quarter-century evolution of Windows, the *ScrollBar* has slipped\
    \ from its high perch in the \n\ncontrol hierarchy, and it's commonly seen today\
    \ only in a *ScrollViewer* control. Try to instantiate the \n\nWindows Runtime\
    \ version of *ScrollBar*, and you won't even see it. If you want to use *ScrollBar*,\
    \ you'll \n\n152"
  merge: -1
  pgno: 151
- img_proc: true
  md: "have to supply a template for it. Like *RangeBase*, *ScrollBar* is defined\
    \ in the \n\n*Windows.UI.Xaml.Controls.Primitives* namespace, indicating that\
    \ it’s not something application \n\nprogrammers normally use. \n\nFor virtually\
    \ all applications involving choosing from a range of values, *ScrollBar* has\
    \ been replaced \n\nwith *Slider*, and with touch interfaces, *Slider* has become\
    \ simpler than ever. In its default manifestation, \n\n*Slider* has no arrows.\
    \ It simply jumps to the value corresponding to the point where you touch the\
    \ \n\n*Slider* or drag your finger or mouse. \n\nThe *Value* property of the *Slider*\
    \ can change either programmatically or through user manipulation. \n\nTo obtain\
    \ a notification when the *Value* property changes, attach an event handler for\
    \ the \n\n*ValueChanged* event, such as shown in the SliderEvents project: \n\n\
    **Project: SliderEvents | File: BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\\
    =\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``StackPanel``\\\
    >`` `\n\n` ``<``Slider`` ValueChanged``\\=\"OnSliderValueChanged\" />`` `\n\n\
    ` `\n\n` ``<``TextBlock`` HorizontalAlignment``\\=\"Center\"`` `\n\n` `` FontSize``\\\
    =\"48\" />`` `\n\n` `\n\n` ``<``Slider`` ValueChanged``\\=\"OnSliderValueChanged\"\
    \ />`` `\n\n` `\n\n` ``<``TextBlock`` HorizontalAlignment``\\=\"Center\"`` `\n\
    \n` `` FontSize``\\=\"48\" />`` `\n\n` ``</``StackPanel``\\>`` `\n\n`</``Grid``\\\
    >`` `\n\nBoth *Slider* controls here share the same event handler. The idea behind\
    \ this simple program is that \n\nthe current *Value* of each *Slider* is displayed\
    \ by the *TextBlock* below it. This might be considered \n\nsomewhat challenging\
    \ when you notice that nothing in this XAML file is assigned a name. However,\
    \ \n\nthe event handler makes a few assumptions. It assumes that the parent to\
    \ the *Slider* is a *Panel*, and the \n\nnext child in this *Panel* is a *TextBlock*:\
    \ \n\n**Project: SliderEvents | File: BlankPage.xaml.cs (excerpt) **\n\n`void``\
    \ OnSliderValueChanged(``object`` sender, ``RangeBaseValueChangedEventArgs`` args)\
    \ `\n\n`{ `\n\n` ``Slider`` slider = sender ``as`` ``Slider``; `\n\n` ``Panel``\
    \ parentPanel = slider.Parent ``as`` ``Panel``; `\n\n` ``int`` childIndex = parentPanel.Children.IndexOf(slider);\
    \ `\n\n` ``TextBlock`` txtblk = parentPanel.Children\\[childIndex + 1\\] ``as``\
    \ ``TextBlock``; `\n\n` txtblk.Text = args.NewValue.ToString(); `\n\n`} `\n\n\
    This little bit of “trickery” is merely to demonstrate that there’s more than\
    \ one way to access \n\nelements in the visual tree. In the final step, the *Text*\
    \ property of the *TextBlock* is assigned the \n\n*NewValue* argument from the\
    \ event arguments, converted to a string. Equally valid would be using the \n\n\
    *Value* property of the *Slider*: \n\n`txtblk.Text = slider.Value.ToString();\
    \ `\n\n153"
