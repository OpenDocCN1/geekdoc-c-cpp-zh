    \ causes another *PropertyChanged* event to be fired for \n\nthe *Color* property.\
    \ The *Color* property itself has a protected *set* accessor, indicating that\
    \ this class isn’t \n\ndesigned to calculate *Red*, *Green*, and *Blue* values\
    \ from a new *Color* value. (I’ll discuss this issue shortly.) \n\nThe *RgbViewModel*\
    \ class is part of the ColorScrollWithViewModel project. The BlankPage.xaml file\
    \ \n\ninstantiates the *RgbViewModel* in its *Resources* section. \n\n**Project:\
    \ ColorScrollWithViewModel | File: BlankPage.xaml (excerpt) **\n\n`<``Page.Resources``\\\
    >`` `\n\n` ``<``local``:``RgbViewModel`` x``:``Key``\\=\"rgbViewModel\" />`` `\n\
