    \ index = 0; index < gradientBrush.GradientStops.Count; index++) `\n\n` gradientBrush.GradientStops\\\
    [index\\].Offset = index / 7.0 - t; `\n\n` } `\n\n`} `\n\nIn the *CompositionTarget.Rendering*\
