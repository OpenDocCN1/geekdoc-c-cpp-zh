  md: " \n\nConclusion: resources are shared. \n\nIt’s also easy to verify that even\
    \ if a resource is not referenced by any element, it is still instantiated. \n\
    \n**A Bit of Vector Graphics **\n\nAs you’ve seen, displaying text and bitmaps\
    \ in a Metro style application involves creating objects of \n\ntype *TextBlock*\
    \ and *Image* and attaching them to a visual tree. There’s no concept of “drawing”\
    \ or \n\n“painting,” at least not on the application level. Internal to the Windows\
    \ Runtime, the *TextBlock* and \n\n*Image* elements are rendering themselves.\
    \ \n\nSimilarly, if you wish to display some vector graphics—lines, curves, and\
    \ filled areas—you don’t do it \n\nby calling methods like *DrawLine* and *DrawBezier*.\
    \ These methods do not exist! Instead, you create \n\nelements of type *Line*,\
    \ *Polyline*, *Polygon*, and *Path*. These classes derive from the *Shape* class\
    \ (which \n\nitself derives from *FrameworkElement*) and can all be found in the\
    \ *Windows.UI.Xaml.Shapes* \n\nnamespace, which is sometimes referred to as the\
    \ *Shapes* library. \n\nA deep exploration of vector graphics awaits us in a future\
    \ chapter. For now, let’s just examine two \n\nof the most powerful members of\
    \ the *Shapes* library: *Polyline* and *Path*. \n\n*Polyline* renders a collection\
    \ of connected straight lines, but its real purpose is to draw complex \n\ncurves.\
    \ All you need to do is keep the individual lines short and supply plenty of them.\
    \ Don’t hesitate \n\nto give *Polyline* thousands of lines. That’s what it’s there\
    \ for. \n\nLet’s use *Polyline* to draw an Archimedean spiral. The XAML file for\
    \ the Spiral program instantiates \n\nthe *Polyline* object but doesn’t include\
    \ the points that define the figure: \n\n![](img/bc006cce5c2364a011861f29233d37ef_58_0.png)\n\
    \n59"
