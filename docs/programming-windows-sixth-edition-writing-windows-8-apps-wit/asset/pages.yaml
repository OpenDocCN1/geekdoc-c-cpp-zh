    \ bad behavior. \n\nWhen a class has more than a couple properties, it starts\
    \ making sense to define a protected \n\nmethod named *OnPropertyChanged* and\
    \ let that method do the actual event firing. It’s also possible to \n\nautomate\
    \ part of this class, as you’ll see shortly. \n\nAs you design a View and View\
    \ Model, it helps to start thinking of controls as visual manifestations \n\n\
    of data types. The controls in the View are bound to properties of these types\
    \ in the View Model. For \n\nexample, a *Slider* is a *double*, a *TextBox* is\
    \ a *string*, a *CheckBox* or *ToggleSwitch* is a *bool*, and a group of \n\n\
    *RadioButton* controls is an enumeration. \n\n**A View Model for ColorScroll **\n\
    \nThe ColorScroll programs in Chapter 5 showed how to use data bindings to update\
    \ a *TextBlock* from \n\nthe value property of a *Slider*. However, defining a\
