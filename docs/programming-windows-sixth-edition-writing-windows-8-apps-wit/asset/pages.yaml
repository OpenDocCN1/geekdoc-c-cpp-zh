  md: " \n\nAs you can see, the *LineBreak* element can arbitrarily break lines. In\
    \ theory, the *InlineUIContainer* \n\nclass allows you to embed any *UIElement*\
    \ in the text (for example, *Image* elements), but it is not \n\nimplemented.\
    \ Try to use it, and you’ll get the error “Value does not fall within the expected\
    \ range.” \n\n**Sharing Brushes (and Other Resources) **\n\nSuppose you have multiple\
    \ *TextBlock* elements on a page, and you want several of them to have the \n\n\
    same brush. If this is a *SolidColorBrush*, the repetitive markup is not too bad.\
    \ However, if it’s a \n\n*LinearGradientBrush*, it gets messier. A *LinearGradientBrush*\
    \ requires at least six tags, and all that \n\nrepetitive markup becomes very\
    \ painful, particularly if something needs to be changed. \n\nThe Windows Runtime\
    \ has a feature called the “XAML resource” that lets you share objects among \n\
    \nmultiple elements. Sharing brushes is one common application of the XAML resource,\
    \ but the most \n\ncommon is defining and sharing styles. \n\nXAML resources are\
    \ stored in a *ResourceDictionary*, a dictionary whose keys and values are both\
    \ of \n\ntype *object*. Very often, however, the keys are strings. Both *FrameworkElement*\
    \ and *Application* define a \n\nproperty named *Resources* of type *ResourceDictionary*.\
    \ \n\nThe SharedBrush project shows a typical way to share a *LinearGradientBrush*\
    \ (and a couple other \n\nobjects) among several elements on a page. Towards the\
    \ top of the XAML file I’ve defined a *Resources* \n\nproperty element for the\
    \ collection of resources for that page: \n\n**Project: SharedBrush | File: BlankPage.xaml\
    \ (excerpt) **\n\n`<``Page ``…`` ``\\>`` `\n\n` `\n\n` ``<``Page.Resources``\\\
    >`` `\n\n` ``<``x``:``String`` x``:``Key``\\=\"appName\">``Shared Brush App``</``x``:``String``\\\
    >`` `\n\n![](img/bc006cce5c2364a011861f29233d37ef_53_0.png)\n\n54"
