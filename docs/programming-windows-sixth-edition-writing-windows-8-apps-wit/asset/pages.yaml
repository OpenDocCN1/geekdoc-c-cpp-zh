  md: "**WhatSize with Bindings (and a Converter) **\n\nIn Chapter 3 I discussed how\
    \ the WhatSize program couldn’t accommodate a data binding because the \n\n*Text*\
    \ property in the *Run* class isn’t a dependency property. Only dependency properties\
    \ can be targets \n\nof data bindings. \n\nFortunately, for single lines of text,\
    \ you can mimic multiple *Run* objects with multiple *TextBlock* \n\nelements\
    \ in a horizontal *StackPanel*. Here’s WhatSizeWithBindings: \n\n**Project: WhatSizeWithBindings\
    \ | File: BlankPage.xaml (excerpt) **\n\n`<``Page`` `\n\n` `` x``:``Class``\\\
    =\"WhatSizeWithBindings.BlankPage\"`` `\n\n` `` ``… `\n\n` `` FontSize``\\=\"\
    36\"`` `\n\n` `` Name``\\=\"page\">`` `\n\n` `\n\n` ``<``Grid`` Background``\\\
    =\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``StackPanel``\
    \ Orientation``\\=\"Horizontal\"`` `\n\n` `` HorizontalAlignment``\\=\"Center\"\
    `` `\n\n` `` VerticalAlignment``\\=\"Top\">`` `\n\n` ``<``TextBlock`` Text``\\\
    =\"&#x21A4; \" />`` `\n\n` ``<``TextBlock`` Text``\\=\"{``Binding`` ElementName``\\\
    =page,`` Path``\\=ActualWidth}\" />`` `\n\n` ``<``TextBlock`` Text``\\=\" pixels\
    \ &#x21A6;\" />`` `\n\n` ``</``StackPanel``\\>`` `\n\n` `\n\n` ``<``StackPanel``\
    \ HorizontalAlignment``\\=\"Center\"`` `\n\n` `` VerticalAlignment``\\=\"Center\"\
    >`` `\n\n` ``<``TextBlock`` Text``\\=\"&#x21A5;\"`` TextAlignment``\\=\"Center\"\
    \ />`` `\n\n` `\n\n` ``<``StackPanel`` Orientation``\\=\"Horizontal\"`` `\n\n\
    ` `` HorizontalAlignment``\\=\"Center\">`` `\n\n` ``<``TextBlock`` Text``\\=\"\
    {``Binding`` ElementName``\\=page,`` Path``\\=ActualHeight}\" />`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\" pixels\" />`` `\n\n` ``</``StackPanel``\\>`` `\n\n` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"&#x21A7;\"`` TextAlignment``\\=\"Center\" />`` `\n\n` ``</``StackPanel``\\\
    >`` `\n\n` ``</``Grid``\\>`` `\n\n`</``Page``\\>`` `\n\nNotice that the root element\
