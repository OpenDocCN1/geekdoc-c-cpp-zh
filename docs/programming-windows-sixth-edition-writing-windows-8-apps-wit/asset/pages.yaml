- img_proc: true
  md: "The program builds a tree of classes and their descendant classes. Each node\
    \ is a particular class and \n\na collection of its immediate descendent classes,\
    \ so I added another code file to the project for a class \n\nthat represents\
    \ this node: \n\n**Project: DependencyObjectClassHierarchy | File: ClassAndSubclasses.cs\
    \ **\n\n`using`` System; `\n\n`using`` System.Collections.Generic; `\n\n` `\n\n\
    `namespace`` DependencyObjectClassHierarchy `\n\n`{ `\n\n` ``class`` ``ClassAndSubclasses``\
    \ `\n\n` { `\n\n` ``public`` ClassAndSubclasses(``Type`` parent) `\n\n` { `\n\n\
    ` ``this``.Type = parent; `\n\n` ``this``.Subclasses = ``new`` ``List``<``ClassAndSubclasses``\\\
    >(); `\n\n` } `\n\n` `\n\n` ``public`` ``Type`` Type { ``protected`` ``set``;\
    \ ``get``; } `\n\n` ``public`` ``List``<``ClassAndSubclasses``\\> Subclasses {\
    \ ``protected`` ``set``; ``get``; } `\n\n` } `\n\n`} `\n\nJust as it’s possible\
    \ to use reflection to get all the properties defined by a class, you can use\
    \ \n\nreflection to get all public classes defined in an assembly. These classes\
    \ are available from the \n\n*ExportedTypes* property of the *Assembly* object.\
