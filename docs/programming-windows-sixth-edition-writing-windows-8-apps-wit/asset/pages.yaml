  md: "group corresponds with a member of an enumeration and that the enumeration\
    \ value be identifiable \n\nfrom the *RadioButton* object. This allows all the\
    \ buttons in a group to share the same event handler. \n\nThe *Tag* property is\
    \ ideal for this purpose. For example, suppose you want to write a program that\
    \ \n\nlets you experiment with the *StrokeStartLineCap*, *StrokeEndLineCap*, and\
    \ *StrokeLineJoin* properties \n\ndefined by the *Shape* class. When rendering\
    \ thick lines, these properties govern the shape of the ends \n\nof the line and\
    \ the shape where two lines join. The first two properties are set to members\
    \ of the \n\n*PenLineCap* enumeration type and the third is set to members of\
    \ the *PenLineJoin* enumeration. \n\nFor example, one of the members of the *PenLineJoin*\
    \ enumeration is *Bevel*. You might define a \n\n*RadioButton* to represent this\
    \ option like so: \n\n`<``RadioButton`` Content``\\=\"Bevel join\" `\n\n` Tag``\\\
    =\"Bevel\" `\n\n` ``…`` ``/>`` `\n\nThe problem is that *“Bevel”* is interpreted\
    \ by the XAML parser as a string, so in the event handler in the \n\ncode-behind\
    \ file, you need to use *switch* and *case* to differentiate between the different\
    \ strings or \n\n*Enum.TryParse* to convert the string into an actual *PenLineJoin.Bevel*\
    \ value. \n\nA better way of defining the *Tag* property involves breaking it\
    \ out as a property element and \n\nexplicitly indicating that it’s being set\
    \ to a value of type *PenLineJoin*: \n\n`<``RadioButton`` Content``\\=\"Bevel\
    \ join\"`` `\n\n` … ``\\>`` `\n\n` ``<``RadioButton.Tag``\\>`` `\n\n` ``<``PenLineJoin``\\\
    >``Bevel``</``PenLineJoin``\\>`` `\n\n` ``</``RadioButton.Tag``\\>`` `\n\n`</``RadioButton``\\\
