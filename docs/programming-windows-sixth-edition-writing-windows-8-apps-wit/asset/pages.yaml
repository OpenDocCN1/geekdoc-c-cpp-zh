  md: "Simple: All classes referenced in XAML are allowed to have one (and only one)\
    \ property that is \n\ndesignated as a “content” property. For this content property,\
    \ and only this property, property-element \n\ntags are not required. \n\nThe\
    \ content property for a particular class is specified as a .NET attribute. Somewhere\
    \ in the actual \n\nclass definition of the *Panel* class (from which *Grid* derives)\
    \ is the following *ContentProperty* attribute: \n\n`\\[ContentProperty(Name=``\"\
    Children\"``)\\] `\n\n`public`` ``class`` ``Panel`` : ``FrameworkElement`` `\n\
    \n`{ `\n\n` … `\n\n`} `\n\nWhat this means is simple. Whenever the XAML parser\
    \ encounters some markup like this: \n\n`<``Grid`` ``…`` ``\\>`` `\n\n` ``<``TextBlock``\
    \ ``…`` ``/>`` `\n\n` ``<``TextBlock`` ``…`` ``/>`` `\n\n` ``<``TextBlock`` ``…``\
    \ ``/>`` `\n\n`</``Grid``\\>`` `\n\nthen it checks the *ContentProperty* attribute\
    \ of the *Grid* and discovers that these *TextBlock* elements \n\nshould be added\
    \ to the *Children* property. \n\nSimilarly, the definition of the *UserControl*\
    \ class (from which *Page* derives) defines the *Content* \n\nproperty as its\
    \ content property (which might sound appropriately redundant if you say it out\
    \ loud): \n\n`\\[ContentProperty(Name=``\"Content\"``)\\] `\n\n`public`` ``class``\
    \ ``UserControl`` : ``Control`` `\n\n`{ `\n\n` … `\n\n`} `\n\nYou can define a\
    \ *ContentProperty* attribute in your own classes. The *ContentPropertyAttribute*\
    \ class \n\nrequired for this is in the *Windows.UI.Xaml.Markup* namespace. \n\
    \nUnfortunately, the current documentation for the Windows Runtime indicates only\
    \ when a \n\n*ContentProperty* attribute has been set on a class—look in the Attributes\
    \ section of the home page for \n\nthe *Panel* class, for example—but not what\
    \ that property actually is! You’ll just have to learn by \n\nexample and retain\
    \ by habit. \n\nFortunately, many content properties are defined to be the most\
    \ convenient property of the class. \n\nFor *LinearGradientBrush*, the content\
    \ property is *GradientStops*. Although *GradientStops* is of type \n\n*GradientStopCollection*,\
    \ XAML does not require collection objects to be explicitly included. Here’s the\
    \ \n\nexcessively wordy form of the *LinearGradientBrush* syntax: \n\n`<``TextBlock``\
