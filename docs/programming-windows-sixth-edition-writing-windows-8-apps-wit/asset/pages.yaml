  md: "being clicked. *FrameworkElement* defines a *Tag* property of type *object*\
    \ specifically for this purpose. \n\nYou can set *Tag* to an identifying string\
    \ or object in the XAML file and check it in the event handler. \n\n**Dependency\
    \ Properties **\n\nPerhaps you’re writing an application where you want all the\
    \ *Button* controls to display text with a \n\ngradient brush. Of course, you\
    \ can simply define the *Foreground* property of each *Button* to be a \n\n*LinearGradientBrush*,\
    \ but the markup might start becoming a bit overwhelming. You could then try a\
    \ \n\n*Style* with the *Foreground* property set to a *LinearGradientBrush*, but\
    \ then each *Button* shares the same \n\n*LinearGradientBrush* with the same gradient\
    \ colors, and perhaps you want more flexibility than that. \n\nWhat you really\
    \ want is a *Button* with two properties named *Color1* and *Color2* that you\
    \ can set to \n\nthe gradient colors. That sounds like a custom control. It’s\
    \ a class that derives from *Button* that creates \n\na *LinearGradientBrush*\
    \ in its constructor and defines *Color1* and *Color2* properties to control this\
    \ \n\ngradient. \n\nCan these *Color1* and *Color2* properties be just plain old\
    \ .NET properties with *set* and *get* accessors? \n\nYes, they can. However,\
    \ defining the properties like that will limit them in some crucial ways. Such\
    \ \n\nproperties cannot be the targets of styles, bindings, or animations. Only\
    \ dependency properties can do \n\nall that. \n\nDependency properties have a\
    \ bit more overhead than regular properties, but learning how to \n\ndefine dependency\
    \ properties in your own classes is an important skill. In a new project, begin\
    \ by \n\nadding a new item to the project and select Class from the list. Give\
    \ it a name of *GradientButton*, and in \n\nthe file, make the class public and\
    \ derived from *Button*: \n\n`public`` ``class`` ``GradientButton`` : ``Button``\
    \ `\n\n`{ `\n\n` `\n\n`} `\n\nNow let’s fill up that class. You will need to add\
    \ some *using* directives along the way. \n\nThe two new properties are named\
    \ *Color1* and *Color2* of type *Color*. These two properties require \n\ntwo\
    \ dependency properties of type *DependencyProperty* named *Color1Property* and\
    \ *Color2Property*. \n\nThey must be public and static but settable only from\
    \ within the class: \n\n`public`` ``static`` ``DependencyProperty`` Color1Property\
    \ { ``private`` ``set``; ``get``; } `\n\n`public`` ``static`` ``DependencyProperty``\
    \ Color2Property { ``private`` ``set``; ``get``; } `\n\nThese *DependencyProperty*\
    \ objects must be created in the static constructor. The \n\n*DependencyProperty*\
    \ class defines a static method named *Register* for the job of creating \n\n\
    DependencyProperty objects: \n\n`static`` GradientButton() `\n\n`{ `\n\n` Color1Property\
    \ = `\n\n179"
