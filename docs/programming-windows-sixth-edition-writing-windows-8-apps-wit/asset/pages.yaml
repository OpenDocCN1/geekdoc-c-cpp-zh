    \ \\* ``Math``.Sin(radians); `\n\n` ``double`` y = 360 + radius \\* ``Math``.Cos(radians);\
    \ `\n\n` polyline.Points.Add(``new`` ``Point``(x, y)); `\n\n` } `\n\n`} `\n\n\
    The *radians* variable converts degrees to radians for the .NET trig functions,\
    \ and *radius* is calculated to \n\nrange from 0 through 360 depending on the\
    \ *angle*, which means that the maximum radius will be 360 \n\npixels. The values\
    \ returned by the *Math.Sin* and *Math.Cos* static methods are multiplied by *radius*,\
    \ \n\nwhich means these products will range between –360 and 360 pixels. \n\n\
    To shift this figure so that all pixels have positive values relative to an upper-left\
    \ origin, 360 is added \n\nto both products. The spiral is thus centered at the\
    \ point (360, 360) and extends not more than 360 \n\npixels in all directions.\
    \ \n\nThe loop concludes by instantiating a *Point* value and adding it to the\
    \ *Points* collection of the \n\n*Polyline*. Here it is: \n\n \n\nWithout the\
    \ *HorizontalAlignment* and *VerticalAlignment* settings, the figure would be\
