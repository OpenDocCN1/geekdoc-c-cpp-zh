  md: "As you’ll see, an instance of *RulerContainer* is set to the *Child2* property\
    \ of the *SplitContainer* that \n\ndominates the XamlCruncher page. The *Child1*\
    \ property appears to be a *TextBox*, but it’s actually an \n\ninstance of another\
    \ custom control named *TabbableTextBox*, which derives from *TextBox*. \n\nThe\
    \ standard *TextBox* does not respond to the Tab key, and when you’re typing XAML\
    \ into an \n\neditor, you really want tabs. That’s the primary feature of *TabbableTextBox*,\
    \ shown here in its entirety: \n\n**Project: XamlCruncher | File: TabbableTextBox.cs\
    \ **\n\n`using`` Windows.System; `\n\n`using`` Windows.UI.Xaml; `\n\n`using``\
