  md: "**Overriding the *****Handled***** Setting **\n\nYou’ve just seen that when\
    \ an element handles an event such as *Tapped* and concludes its event \n\nprocessing\
    \ by setting the *Handled* property of the event arguments to *true*, the routing\
    \ of the event \n\neffectively stops. The event isn’t visible to elements higher\
    \ in the visual tree. \n\nIn some cases, this behavior might be undesirable. Suppose\
    \ you’re working with an element that \n\nsets the *Handled* property to *true*\
    \ in its event handler but you still want to see that event higher in the \n\n\
    visual tree. One solution is to simply change the code, but that option might\
    \ not be available. The \n\nelement might be implemented in a dynamic-link library,\
    \ and you might not have access to the source \n\ncode. \n\nIn RoutedEvents6,\
    \ the XAML file is the same as in RoutedEvents5: each *TextBlock* has a handler\
    \ set \n\nfor its *Tapped* event. The *Tapped* handler sets the *Handled* property\
    \ to *true*. The class also defines a \n\nseparate *OnPageTapped* handler that\
    \ sets the background color of the *Grid*: \n\n**Project: RoutedEvents6 | File:\
    \ BlankPage.xaml.cs (excerpt) **\n\n`public`` ``sealed`` ``partial`` ``class``\
    \ ``BlankPage`` : ``Page`` `\n\n`{ `\n\n` ``Random`` rand = ``new`` ``Random``();\
    \ `\n\n` ``byte``\\[\\] rgb = ``new`` ``byte``\\[3\\]; `\n\n` `\n\n` ``public``\
    \ BlankPage() `\n\n` { `\n\n` ``this``.InitializeComponent(); `\n\n` `\n\n` ``this``.AddHandler(``UIElement``.TappedEvent,\
    \ `\n\n` ``new`` ``TappedEventHandler``(OnPageTapped), `\n\n` ``true``); `\n\n\
    ` } `\n\n` `\n\n` ``void`` OnTextBlockTapped(``object`` sender, ``TappedRoutedEventArgs``\
    \ args) `\n\n` { `\n\n` ``TextBlock`` txtblk = sender ``as`` ``TextBlock``; `\n\
    \n` txtblk.Foreground = GetRandomBrush(); `\n\n` args.Handled = ``true``; `\n\n\
    ` } `\n\n` `\n\n` ``void`` OnPageTapped(``object`` sender, ``TappedRoutedEventArgs``\
    \ args) `\n\n` { `\n\n` contentGrid.Background = GetRandomBrush(); `\n\n` } `\n\
    \n` `\n\n` ``Brush`` GetRandomBrush() `\n\n` { `\n\n` rand.NextBytes(rgb); `\n\
    \n` ``Color`` clr = ``Color``.FromArgb(255, rgb\\[0\\], rgb\\[1\\], rgb\\[2\\\
    ]); `\n\n` ``return`` ``new`` ``SolidColorBrush``(clr); `\n\n` } `\n\n`} `\n\n\
    87"
