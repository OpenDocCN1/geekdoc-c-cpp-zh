  md: "**Author Bio **\n\n**Charles Petzold** began programming for Windows 27 years\
    \ ago \n\nwith beta versions of Windows 1. He wrote the first articles about \n\
    \nWindows programming to appear in a magazine and wrote one of \n\nthe first books\
    \ on the subject, *Programming Windows*, first \n\npublished in 1988. Over the\
    \ past decade, he has written seven \n\nbooks on .NET programming, including the\
    \ recent *Programming *\n\n*Windows Phone 7* (Microsoft Press, 2010), and he currently\
    \ writes a \n\ncolumn on touch-oriented user interfaces for *MSDN Magazine*. \n\
    \nPetzold’s books also include *Code: The Hidden Language of *\n\n*Computer Hardware\
