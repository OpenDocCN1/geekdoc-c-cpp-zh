    \ that’s the element’s size \n\nyou get. But you can set *SizeChanged* handlers\
    \ on any element. Generally, the order the events are \n\nfired proceeds down\
    \ the visual tree: *Page* first (in this example), and then *Grid* and *TextBlock*.\
    \ \n\nIf you need the rendered size of an element other than in the context of\
