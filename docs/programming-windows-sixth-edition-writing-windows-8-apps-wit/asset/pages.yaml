    \ was tapped? \n\nEasy: the *TappedRoutedEventArgs* class—an instance of which\
    \ appears as the second argument to \n\nthe event handler—has a property named\
    \ *OriginalSource*, and that indicates the source of the event. In \n\nthis example,\
