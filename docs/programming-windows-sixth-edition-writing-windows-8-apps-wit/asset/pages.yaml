  md: "`</``Grid``\\>`` `\n\nFor these properties, Visual Studio’s IntelliSense provides\
    \ 140 standard color names, plus *Transparent*. \n\nThese are actually static\
    \ properties of the *Colors* class. Alternatively, you can specify red-green-blue\
    \ \n\n(RGB) values directly in hexadecimal with values ranging from 00 to FF prefaced\
    \ by a pound sign: \n\n`Foreground``\\=\"#F``F800``0\"`` `\n\nThat’s maximum red,\
    \ half green, and no blue. An optional fourth byte at the beginning is the alpha\
    \ \n\nchannel, with values ranging from 00 for transparent and FF for opaque.\
    \ Here’s a half-transparent red: \n\n`Foreground``\\=``\"#80FF0000\"`` `\n\nThe\
    \ *UIElement* class also defines an *Opacity* property that can be set to values\
    \ between 0 (transparent) \n\nand 1 (opaque). In HelloImage, try setting the *Background*\
    \ property of the *Grid* to a nonblack color \n\n(perhaps Blue) and set the *Opacity*\
    \ property of the *Image* element to 0.5. \n\nWhen you specify colors by using\
    \ bytes, the values are in accordance with the familiar sRGB \n\n(“standard RGB”)\
    \ color space. This color space dates back to the era of cathode-ray tube displays\
    \ where \n\nthese bytes directly controlled the voltages illuminating the pixels.\
    \ Very fortuitously, nonlinearities in \n\npixel brightness and nonlinearities\
    \ in the perception of brightness by the human eye roughly cancel \n\neach other\
    \ out, so these byte values often seem perceptually linear, or nearly so. \n\n\
    An alternative is the scRGB color space, which uses values between 0 and 1 that\
    \ are proportional to \n\nlight intensity. Here’s a value for medium gray: \n\n\
    `Foreground``\\=``\"sc# 0.5 0.5 0.5\"`` `\n\nDue to the logarithmic response of\
    \ the human eye to light intensity, this gray will appear to be rather \n\ntoo\
    \ light to be classified as medium. \n\nIf you need to display text characters\
    \ that are not on your keyboard, you can specify them in \n\nUnicode by using\
    \ standard XML character escaping. For example, if you want to display the text\
    \ “This \n\ncosts €55” and you’re confined to an American keyboard, you can specify\
    \ the Unicode Euro in decimal \n\nlike this: \n\n`<``TextBlock`` Text``\\=``\"\
    This costs &#8364;55\"`` … `\n\nOr perhaps you prefer hexadecimal: \n\n`<``TextBlock``\
    \ Text``\\=``\"This costs &#x20AC;55\"`` … `\n\nOr you can simply paste text into\
    \ Visual Studio as I obviously did with a program later in this chapter. \n\n\
    As with standard XML, strings can contain special characters beginning with the\
    \ ampersand: \n\n• \n\n&amp; is an ampersand \n\n• \n\n&apos; is a single-quotation\
    \ mark (“apostrophe”) \n\n• \n\n&quot; is a double-quotation mark \n\n28"
