  md: " \n\nThis program contains a total of 283 *StackPanel* elements. Each of the\
    \ 141 colors gets a pair: a vertical \n\n*StackPanel* is parent to the two *TextBlock*\
    \ elements, and a horizontal *StackPanel* is parent to a \n\n*Rectangle* and the\
    \ vertical *StackPanel*. All the horizontal *StackPanel* elements are then children\
    \ of the \n\nmain vertical *StackPanel* in a *ScrollViewer*. The XAML file is\
    \ responsible for centering that *StackPanel*: \n\n**Project: ColorList1 | File:\
    \ BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``ScrollViewer``\\>`` `\n\n\
    ` ``<``StackPanel`` Name``\\=\"stackPanel\"`` `\n\n` `` HorizontalAlignment``\\\
    =\"Center\" />`` `\n\n` ``</``ScrollViewer``\\>`` `\n\n`</``Grid``\\>`` `\n\n\
    While enumerating through the static properties of the *Colors* class, the constructor\
    \ in the \n\ncode-behind file builds the nested *StackPanel* elements for each\
    \ item: \n\n**Project: ColorList1 | File: BlankPage.xaml.cs (excerpt) **\n\n`public``\
    \ ``sealed`` ``partial`` ``class`` ``BlankPage`` : ``Page`` `\n\n`{ `\n\n` ``public``\
    \ BlankPage() `\n\n` { `\n\n` ``this``.InitializeComponent(); `\n\n` `\n\n` ``IEnumerable``<``PropertyInfo``\\\
    > properties = ``typeof``(``Colors``).GetTypeInfo().DeclaredProperties; `\n\n\
    ` `\n\n` ``foreach`` (``PropertyInfo`` property ``in`` properties) `\n\n` { `\n\
    \n` ``Color`` clr = (``Color``)property.GetValue(``null``); `\n\n` `\n\n` ``StackPanel``\
    \ vertStackPanel = ``new`` ``StackPanel`` `\n\n` { `\n\n` VerticalAlignment =\
    \ ``VerticalAlignment``.Center `\n\n![](img/bc006cce5c2364a011861f29233d37ef_133_0.png)\n\
    \n134"
