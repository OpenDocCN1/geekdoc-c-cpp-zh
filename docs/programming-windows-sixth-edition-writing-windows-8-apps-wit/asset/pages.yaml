    \ project. \n\nRoutedEvents0 is the first of several projects that demonstrate\
    \ the concept of *routed event handling*, \n\nwhich is an important feature of\
    \ the Windows Runtime. But this particular program doesn’t show any \n\nfeatures\
    \ particular to routed events. Hence the suffix of zero. For this project I created\
    \ the *Tapped* \n\nhandler first with the proper signature and my preferred name:\
    \ \n\n**Project: RoutedEvents0 | File: BlankPage.xaml.cs (excerpt) **\n\n`public``\
