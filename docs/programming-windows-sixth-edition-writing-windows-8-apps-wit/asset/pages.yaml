  md: "start the timer in the *OnNavigatedTo* override and stop it in *OnNavigatedFrom*\
    \ to avoid the program \n\nwasting time doing work when the page is not visible.\
    \ \n\nThis is a good illustration of the difference in how a desktop Windows application\
    \ and a Metro style \n\napplication updates the video display. Both types of applications\
    \ use a timer for implementing a clock, \n\nbut rather than drawing and redrawing\
    \ text every second by invalidating the contents of the window, \n\nthe Metro\
    \ style application changes the visual appearance of an existing element simply\
    \ by changing \n\none of its properties. \n\nYou can set the *DispatcherTimer*\
    \ for an interval as low as you want, but you’re not going to get calls \n\nto\
    \ the *Tick* handler faster than the frame rate of the video display, which is\
    \ probably 60 Hz or about a \n\n17-millisecond period. Of course, it doesn’t make\
    \ sense to update the video display faster than the \n\nframe rate. Updating the\
    \ display precisely at the frame rate gives you as smooth an animation as \n\n\
    possible. If you want to perform an animation in this way, don’t use *DispatcherTimer*.\
    \ A better choice is \n\nthe static *CompositionTarget.Rendering* event, which\
    \ is specifically designed to be called prior to a \n\nscreen refresh. \n\nEven\
    \ better than *CompositionTarget.Rendering* are all the animation classes provided\
    \ as part of the \n\nWindows Runtime. These classes let you define animations\
    \ in XAML or code, they have lots of options, \n\nand some of them are performed\
    \ in background threads. \n\nBut until I cover the animation classes—and perhaps\
    \ even after I do—the \n\n*CompositionTarget.Rendering* event is well suited for\
    \ performing animations. These are sometimes \n\ncalled “manual” animations because\
    \ the program itself has to carry out some calculations based on \n\nelapsed time.\
    \ \n\n Here’s a little project called ExpandingText that changes the *FontSize*\
    \ of a *TextBlock* in the \n\n*CompositionTarget.Rendering* event handler, making\
    \ the text larger and smaller. The XAML file simply \n\ninstantiates a *TextBlock*:\
    \ \n\n**Project: ExpandingText | File: BlankPage.xaml (excerpt) **\n\n`<``Grid``\
    \ Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">``\
    \ `\n\n` ``<``TextBlock`` Name``\\=\"txtblk\"`` `\n\n` `` Text``\\=\"Hello, Windows\
    \ 8!\"`` `\n\n` `` HorizontalAlignment``\\=\"Center\"`` `\n\n` `` VerticalAlignment``\\\
    =\"Center\" />`` `\n\n`</``Grid``\\>`` `\n\nIn the code-behind file, the constructor\
