    \ = ``VerticalAlignment``.Center; `\n\n` `\n\n` contentGrid.Children.Add(txtblk);\
    \ `\n\n`} `\n\nC# doesn’t require the *this* prefix to access properties and methods\
    \ of the class, but when you’re \n\nediting the files in Visual Studio, typing\
    \ the *this* prefix invokes Intellisense to give you a list of available \n\n\
    methods, properties, and events. \n\n**Images in Code **\n\nJudging solely from\
    \ the XAML files in the HelloImage and HelloLocalImage projects, you might have\
    \ \n\nassumed that the *Source* property of *Image* is defined as a string or\
    \ perhaps the *Uri* type. In XAML, that \n\n*Source* string is a shortcut for\
    \ an object of type *ImageSource*, which encapsulates the actual image that \n\
    \nthe *Image* element is responsible for displaying. *ImageSource* doesn’t define\
    \ anything on its own and \n\ncannot be instantiated, but several important classes\
    \ descend from *ImageSource*, as shown in this \n\npartial class hierarchy: \n\
    \n*Object *\n\n*DependencyObject *\n\n*ImageSource *\n\n*BitmapSource *\n\n*BitmapImage\
    \ *\n\n*WriteableBitmap *\n\n*ImageSource* is defined in the *Windows.UI.Xaml.Media*\
    \ namespace, but the descendent classes are in \n\n*Windows.UI.Xaml.Media.Imaging*.\
    \ A *BitmapSource* can’t be instantiated either, but it defines public \n\n*PixelWidth*\
    \ and *PixelHeight* properties as well as a *SetSource* method that lets you read\
    \ in bitmap data \n\nfrom a file or network stream. *BitmapImage* inherits these\
    \ members and also defines a *UriSource* \n\nproperty.` `\n\nYou can use *BitmapImage*\
    \ for displaying a bitmap from code. Besides defining this *UriSource* \n\nproperty,\
    \ *BitmapImage* also defines a constructor that accepts a *Uri* object. In the\
    \ HelloImageCode \n\nproject, the *Grid* has been given a name of “contentGrid”\
    \ and a using directive for \n\n*Windows.UI.Xaml.Media.Imaging* has been added\
    \ to the code-behind file. Here’s the *BlankPage* \n\nconstructor: \n\n**Project:\
    \ HelloImageCode | File: BlankPage.xaml.cs (excerpt) **\n\n`public`` BlankPage()\
