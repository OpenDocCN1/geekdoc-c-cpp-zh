  md: "**My Setup **\n\nFor writing this book, I used the special version of the Samsung\
    \ 700T tablet that was distributed to \n\nattendees of the Microsoft Build Conference\
    \ in September 2011. This machine has an Intel Core i5 \n\nprocessor running at\
    \ 1.6 GHz with 4 GB of RAM and a 64-GB hard drive. The screen (from which all\
    \ the \n\nscreenshots in the book were taken) has 8 touch points and a resolution\
    \ of 1366 × 768 pixels, which is \n\nthe lowest resolution for which snap views\
    \ are supported. \n\nAlthough the machines were distributed at Build with the\
    \ Windows 8 Developer Preview installed, I \n\nreplaced that with a complete install\
    \ of the Consumer Preview (build 8250) in March 2012. \n\n Except when testing\
    \ orientation or sensors, I generally used the tablet in the docking port with\
    \ an \n\nexternal 1920×1080 HDMI monitor, an external Microsoft Natural Ergonomic\
    \ Keyboard 4000, and a \n\nMicrosoft Comfort Mouse 300. \n\nRunning Visual Studio\
    \ on the large screen and the resultant applications on the tablet turned out\
    \ to \n\nbe a fine development environment, particularly compared with the setup\
    \ I used to write the first \n\nedition of *Programming Windows*. \n\nBut that\
    \ was 25 years ago. \n\n**The *****Programming Windows***** Heritage **\n\nI still\
    \ get a thrill when I look at my very first book contract: \n\n \n\nPerhaps the\
    \ most amusing part of this contract occurs further down the first page: \n\n\
    ![](img/bc006cce5c2364a011861f29233d37ef_9_0.png)\n\n10"
  merge: -1
  pgno: 9
- img_proc: true
  md: " \n\nThe reference to “typescript” means that the pages must as least resemble\
    \ something that came out of \n\na typewriter. A double-spaced manuscript page\
    \ with a fixed-pitch font has about 250 words, as the \n\ndescription indicates.\
    \ A book page is more in the region of 400 words, so Microsoft Press obviously\
    \ \n\nwasn’t expecting a very long book. \n\nFor writing the book I used an IBM\
    \ PC/AT with an 80286 microprocessor running at 8 MHz with 512 \n\nKB of memory\
    \ and two 30 MB hard drives. The display was an IBM Enhanced Graphics Adapter,\
    \ with a \n\nmaximum resolution of 640 × 350 with 16 simultaneous colors. I wrote\
    \ some of the early chapters \n\nusing Windows 1 (introduced over a year earlier\
    \ in November 1985), but beta versions of Windows 2 \n\nsoon became available.\
    \ \n\nIn those years, editing and compiling a Windows program occurred outside\
    \ of Windows in MS-DOS. \n\nFor editing source code, I used WordStar 3.3, the\
    \ same word processor I used for writing the chapters. \n\nFrom the MS-DOS command\
    \ line, you would run the Microsoft C compiler and then launch Windows \n\nwith\
    \ your program to test it out. It was necessary to exit Windows and return to\
    \ MS-DOS for the next \n\nedit-compile-run cycle. \n\nAs I got deeper into writing\
    \ the book, much of the rest of my life faded away. I stayed up later and \n\n\
    later into the night. I didn't have a television at the time, but the local public\
    \ radio station, WNYC-FM, \n\nwas on almost constantly with classical music and\
    \ other programming. For a while, I managed to shift \n\nmy day to such a degree\
    \ that I went to bed after *Morning Edition* but awoke in time for *All Things\
    \ *\n\n*Considered*. \n\nAs the contract stipulated, I sent chapters to Microsoft\
    \ Press on diskette and paper. (We all had \n\nemail, of course, but email didn’t\
    \ support attachments at the time.) The edited chapters came back to \n\nme by\
    \ mail decorated with proofreading marks and numerous sticky notes. I remember\
    \ a page on \n\nwhich someone had drawn a thermometer indicating the increasing\
    \ number of pages I was turning in \n\nwith the caption “Temperature’s Rising!”\
    \ \n\nAlong the way, the focus of the book changed. Writing a book for “Programmers\
    \ and Other \n\nAdvanced Users” proved to be a flawed concept. I don’t know who\
    \ came up with the title \n\n*Programming Windows*. \n\n![](img/bc006cce5c2364a011861f29233d37ef_10_0.png)\n\
    \n11"
  merge: -1
  pgno: 10
- img_proc: true
  md: "The contract had a completion date of April, but I didn’t finish until August\
    \ and the book wasn’t \n\npublished until early 1988. The final page total was\
    \ about 850. If these were normal book pages (that \n\nis, without program listings\
    \ or diagrams) the word count would be about 400,000 rather than the \n\n100,000\
    \ indicated in the contract. \n\nThe cover of the first edition of *Programming\
    \ Windows* described it as “The Microsoft Guide to \n\nProgramming for the MS-DOS\
    \ Presentation Manager: Windows 2.0 and Windows/386.” The reference \n\nto Presentation\
    \ Manager reminds us of the days when Windows and the OS/2 Presentation Manager\
    \ \n\nwere supposed to peacefully coexist as similar environments for two different\
    \ operating systems. \n\nThe first edition of *Programming Windows* went pretty\
    \ much unnoticed by the programming \n\ncommunity. When MS-DOS programmers gradually\
    \ realized they needed to learn about the brave new \n\nenvironment of Windows,\
    \ it was mostly the 2^(nd) edition (published in 1990 and focusing on Windows\
    \ 3) \n\nand the 3^(rd) edition (1992, Windows 3.1) that helped out. \n\nWhen\
    \ the Windows API graduated from 16-bit to 32-bit, *Programming Windows* responded\
    \ with \n\nthe 4^(th) edition (1996, Windows 95) and 5^(th) edition (1998, Windows\
    \ 98). Although the 5^(th) edition is still \n\nin print, the email I receive\
    \ from current readers indicates that the book is most popular in India and \n\
    \nChina. \n\nFrom the 1^(st) edition to the 5^(th), I used the C programming language.\
    \ Sometime between the 3^(rd) and \n\n4^(th) editions, my good friend Jeff Prosise\
    \ said that he wanted to write *Programming Windows with MFC*, \n\nand that was\
    \ fine by me. I didn’t much care for the Microsoft Foundation Classes, which seemed\
    \ to me \n\na fairly light wrapper on the Windows API, and I wasn’t that thrilled\
    \ with C++ either. \n\nAs the years went by, *Programming Windows* acquired the\
    \ reputation of being the book for \n\nprogrammers who needed to get close to\
    \ the metal without any extraneous obstacles between their \n\nprogram code and\
    \ the operating system. \n\nBut to me, the early editions of *Programming Windows*\
    \ were nothing of the sort. In those days, \n\ngetting close to the metal involved\
    \ coding in assembly language, writing character output directly into \n\nvideo\
    \ display memory, and resorting to MS-DOS only for file I/O. In contrast, programming\
    \ for \n\nWindows involved a high-level language, completely unaccelerated graphics,\
    \ and accessing hardware \n\nonly through a heavy layer of APIs and device drivers.\
    \ \n\nThis switch from MS-DOS to Windows represented a deliberate forfeit of speed\
    \ and efficiency in \n\nreturn for other advantages. But what advantages? Many\
    \ veteran programmers just couldn't see the \n\npoint. Graphics? Pictures? Color?\
    \ Fancy fonts? A mouse? That’s not what computers are all about! The \n\nskeptics\
    \ called it the WIMP (window-icon-menu-pointer) interface, which was not exactly\
    \ a subtle \n\nimplication about the people who chose to use such an environment\
    \ or code for it. \n\nWait long enough, and a high-level language becomes a low-level\
    \ language and multiple layers of \n\ninterface seemingly shrink down (at least\
    \ in lingo) to a native API. Some C and C++ programmers of \n\ntoday reject a\
    \ managed language like C# on grounds of efficiency, and Windows has even sparked\
    \ \n\nsome energetic controversy once again. Windows 8 is easily the most revolutionary\
    \ updating to \n\n12"
