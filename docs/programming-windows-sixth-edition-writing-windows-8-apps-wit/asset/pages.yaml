  md: "“Z” in *ZIndex* refers to a three-dimensional coordinate system, where the\
    \ Z axis extends out of the \n\nscreen towards the user. \n\nWhen sibling elements\
    \ overlap, they are normally displayed in the order they appear in the visual\
    \ \n\ntree, which means that elements early in a panel’s *Children* collection\
    \ can be covered by elements later \n\nin the *Children* collection. For example,\
    \ consider the following: \n\n`<``Grid``\\>`` `\n\n` ``<``TextBlock`` Text``\\\
    =\"Blue Text\"`` Foreground``\\=\"Blue\"`` FontSize``\\=\"96\" />`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"Red Text\"`` Foreground``\\=\"Red\"`` FontSize``\\=\"96\" />`` `\n\
    \n`</``Grid``\\>`` `\n\nThe red text obscures part of the blue text. \n\nYou can\
    \ override that behavior with the *Canvas.ZIndex* attached property, and the weird\
    \ thing is \n\nthis: it works with all panels, and not just *Canvas*. To make\
    \ the blue text appear on top of the red text, \n\ngive it a higher z-index: \n\
    \n`<``Grid``\\>`` `\n\n` ``<``TextBlock`` Text``\\=\"Blue Text\"`` Foreground``\\\
    =\"Blue\"`` FontSize``\\=\"96\"`` Canvas.ZIndex``\\=\"1\" />`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"Red Text\"`` Foreground``\\=\"Red\"`` FontSize``\\=\"96\"`` Canvas.ZIndex``\\\
    =\"0\" />`` `\n\n`</``Grid``\\>`` `\n\n**Canvas Weirdness **\n\nMuch of what I’ve\
    \ described about layout doesn’t apply to the *Canvas*. Layout within a *Canvas*\
    \ is \n\nalways child-driven. The *Canvas* always offers its children an infinite\
    \ size, which means that each child \n\nsets a natural size for itself and that’s\
    \ the only space the child occupies. *HorizontalAlignment* and \n\n*VerticalAlignment*\
    \ settings have no effect on a child of a *Canvas*. Likewise, the *Stretch* property\
    \ of \n\n*Image* has no effect when the *Image* is a child of a *Canvas*: *Image*\
    \ always displays the bitmap in its pixel \n\nsize. *Rectangle* and *Ellipse*\
    \ shrink to nothing in a *Canvas* unless given an explicit width and height. \n\
    \nAlthough *HorizontalAlignment* and *VerticalAlignment* have no effect on a child\
    \ of the *Canvas*, they \n\ndo have an effect when set on the *Canvas* itself.\
    \ With other panels, when you set the alignment \n\nproperties to something other\
    \ than *Stretch*, the panel becomes as small as possible while still \n\nencompassing\
    \ its children. The *Canvas*, however, is different. Set *HorizontalAlignment*\
    \ and \n\n*VerticalAlignment* to values other than *Stretch*, and the *Canvas*\
    \ shrinks to nothing regardless of its \n\nchildren. \n\nEven when the *Canvas*\
    \ shrinks down to a zero size, the display of its children is not affected. \n\
    \nConceptually, the *Canvas* is more like a reference point than a container.\
    \ \n\nYou can use this characteristic of the *Canvas* to your advantage. For example,\
    \ suppose you try to \n\ndisplay a *TextBlock* in a *Grid* that is obviously too\
    \ small for it: \n\n`<``Grid`` Width``\\=\"200\" ``Height``\\=\"100\">`` `\n\n\
    ` ``<``TextBlock`` Text``\\=\"Text in a Small Grid\"`` FontSize``\\=\"144\" />``\
    \ `\n\n148"
  merge: -1
  pgno: 147
- img_proc: true
  md: "`</``Grid``\\>`` `\n\nThe *TextBlock* is clipped to the dimensions of the *Grid*.\
    \ You could make the *Grid* larger of course, but \n\nyou might be stuck with\
    \ this *Grid* size, perhaps because of other child elements. Still, you want the\
    \ \n\n*TextBlock* to be aligned with these other elements without being clipped\
    \ to the *Grid*. \n\nThe extremely simple solution is to put a *Canvas* in the\
    \ *Grid* and put the *TextBlock* in that *Canvas*: \n\n`<``Grid`` Width``\\=\"\
    200\"`` Height``\\=\"100\">`` `\n\n` ``<``Canvas``\\>`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"Text in a Small Grid\"`` FontSize``\\=\"144\" />`` `\n\n` ``</``Canvas``\\\
    >`` `\n\n`</``Grid``\\>`` `\n\nEven though the *Canvas* is now clipped to the\
    \ size of the *Grid*, the *TextBlock* is not. The *TextBlock* is still \n\nwhere\
    \ you want it—aligned with the upper-left corner of the *Grid*—but it’s now displayed\
    \ without any \n\nclipping. \n\nIt’s a very simple technique that can be very\
    \ useful when you need it. \n\n \n\n \n\n149"
