  md: "**Project: Spiral | File: BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\\
    =\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``Polyline``\
    \ Name``\\=\"polyline\"`` `\n\n` `` Stroke``\\=\"{``StaticResource`` ApplicationTextBrush``}\"\
    `` `\n\n` `` StrokeThickness``\\=\"3\"`` `\n\n` `` HorizontalAlignment``\\=\"\
    Center\"`` `\n\n` `` VerticalAlignment``\\=\"Center\" />`` `\n\n`</``Grid``\\\
    >`` `\n\nThe *Stroke* property (inherited from *Shape*) is the brush used to draw\
    \ the actual lines. Generally, this is a \n\n*SolidColorBrush*, but you’ll see\
    \ shortly that it doesn’t have to be. I’ve used *StaticResource* with the \n\n\
    predefined identifier that provides a white brush with a dark theme and a black\
    \ brush with a light \n\ntheme. *StrokeThickness* (also inherited from *Shape*)\
    \ is the width of the lines in pixels, and you’ve seen \n\n*HorizontalAlignment*\
    \ and *VerticalAlignment* before. \n\nIt might seem a little strange to specify\
    \ *HorizontalAlignment* and *VerticalAlignment* for a chunk of \n\nvector graphics,\
    \ so a little explanation might be in order. \n\nTwo-dimensional vector graphics\
    \ involve the use of coordinate points in the form (*X*, *Y*) on a \n\nCartesian\
    \ coordinate system, where *X* is a position on the horizontal axis and *Y* is\
    \ a position on the \n\nvertical axis. Vector graphics in the Windows Runtime\
    \ use a coordinate convention commonly \n\nassociated with windowing environments:\
    \ values of *X* increase to the right (as is normal), but values of \n\n*Y* increase\
    \ going down (which is opposite the mathematical convention). \n\nWhen only positive\
    \ values of *X* and *Y* are used, the origin—the point (0, 0)—is the upper-left\
    \ corner \n\nof the graphical figure. \n\nNegative coordinates can be used to\
    \ indicate points to the left of the origin or above the origin. \n\nHowever,\
    \ when the Windows Runtime calculates the dimensions of a vector graphics object\
    \ for layout \n\npurposes, these negative coordinates are ignored. For example,\
    \ suppose you draw a polyline with \n\npoints that have *X* coordinates ranging\
    \ from –100 to 300 and *Y* coordinates ranging from –200 to 400. \n\nThis implies\
    \ that the polyline has a dimension of 400 pixels wide and 600 pixels high, and\
    \ that is \n\ncertainly true. But for purposes of layout and alignment, the polyline\
    \ is treated as if it were 300 pixels \n\nwide and 400 pixels tall. \n\nFor a\
    \ vector graphics figure to be treated in a predictable manner in the Windows\
    \ Runtime layout \n\nsystem, all that’s required is that you regard the point\
    \ (0, 0) as the upper-left corner. For purposes of \n\nlayout, the maximum positive\
    \ *X* coordinate becomes the element’s width and the maximum positive *Y* \n\n\
    coordinate become’s the element’s height. \n\nFor specifying a coordinate point,\
    \ the *Windows.Foundation* namespace includes a *Point* structure \n\nthat has\
    \ two properties of type *double* named *X* and *Y*. In addition, the *Windows.UI.Xaml.Media*\
    \ \n\nnamespace includes a *PointCollection*, which is a collection of *Point*\
    \ objects. \n\nThe only property that *Polyline* defines on its own is *Points*\
    \ of type *PointCollection*. A collection of \n\npoints can be assigned to the\
    \ *Points* property in XAML, but for very many points calculated \n\nalgorithmically,\
    \ code is ideal. In the constructor of the *Spiral* class, a *for* loop goes from\
    \ 0 to 3600 \n\n60"
