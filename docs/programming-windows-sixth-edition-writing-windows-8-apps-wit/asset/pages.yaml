    \ 25 50 0 1 0 300 49.9\" />`` `\n\n`</``Grid``\\>`` `\n\nThe *Data* property is\
    \ now one big string, but I’ve separated it into five lines corresponding to the\
    \ five \n\nletters. The M code is a “move” followed by *x* and *y* coordinate\
    \ points. The L is a line (or, more \n\nprecisely, a polyline) followed by one\
    \ or more points; C is a cubic Bézier curve, followed by control \n\npoints and\
    \ an end point, but more than one can be included; and A is an arc. The arc is\
    \ by far the most \n\ncomplex: The first two numbers indicate the horizontal and\
    \ vertical radii of an ellipse, which is rotated a \n\nnumber of degrees given\
    \ by the next argument. Following are two flags for the *IsLargeArc* property\
    \ \n\nand sweep direction, followed by the end point. \n\nDefining a complex geometry\
    \ in terms of Path Markup Syntax is one example of something that can \n\nbe done\
    \ only in XAML. Whatever class performs this conversion is not publicly exposed\
    \ in the Windows \n\nRuntime. It is available only to the XAML parser. To convert\
    \ a string of Path Markup Syntax to a \n\n*Geometry* in code would require some\
    \ way to convert XAML to an object in code. \n\nFortunately, something like that\
    \ is available. It’s a static method named *XamlReader.Load* in the \n\n*Windows.UI.Xaml.Markup*\
    \ namespace. Pass it a string of XAML and get out an instance of the root \n\n\
    element with all the other parts of the tree instantiated and assembled. *XamlReader.Load*\
    \ has some \n\nrestrictions—the XAML it parses can’t refer to event handlers in\
    \ external code, for example—but it is a \n\nvery powerful facility. In Chapter\
    \ 7, “Building an Application,” I’ll show you the source code for a tool \n\n\
    called XamlCruncher that lets you interactively experiment with XAML. \n\nMeanwhile,\
    \ here’s a *Path* with Path Markup Syntax created entirely in code: \n\n**Project:\
    \ PathMarkupSyntaxCode | File: BlankPage.xaml.cs **\n\n`using`` Windows.UI; ``//\
