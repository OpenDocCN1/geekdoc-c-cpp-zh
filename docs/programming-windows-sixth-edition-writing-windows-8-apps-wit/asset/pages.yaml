  md: "***Slider***** and the Formatted String Converter **\n\nIn both ColorScroll\
    \ programs so far, the *TextBlock* labels at the bottom show the current values\
    \ of the \n\n*Slider* in hexadecimal. It’s not necessary to provide these values\
    \ from the code-behind file. It could be \n\ndone with a data binding from the\
    \ *Slider* to the *TextBlock*. The only thing that’s required is a binding \n\n\
    converter that can convert a double into a two-digit hexadecimal string. \n\n\
    It’s disturbing to discover that the *FormattedStringConverter* class I described\
    \ in Chapter 4, \n\n“Presentation with Panels,” in connection with the WhatSizeWithBindingConverter\
    \ project will *not* work \n\nin this case. You’re welcome to try it out, but\
    \ you’ll discover (if you don’t already know) that a \n\nhexadecimal formatting\
    \ specification of “X2” can be used only with integral types and the *Value* \n\
    \nproperty of the *Slider* is a *double*. \n\nHowever, in this case it might make\
    \ more sense to write a very short ad hoc binding converter, \n\nparticularly\
    \ when you realize it can be used for two purposes, as I’ll discuss next. \n\n\
    **Tooltips and Conversions **\n\nAs you manipulate the *Slider* controls in either\
    \ ColorScroll program, you’ve probably noticed \n\nsomething peculiar: the *Slider*\
    \ has a built-in tooltip that shows the current value in a little box. That’s\
    \ a \n\nnice feature except that this tooltip shows the value in decimal but the\
    \ program insists on displaying \n\nthe current value in hexadecimal. \n\nIf you\
    \ think it’s great that the *Slider* value is displayed in both decimal and hexadecimal,\
    \ skip to the \n\nnext section. If you’d prefer that the two values be consistent—and\
    \ that they both display the value in \n\nhexadecimal—you’ll be pleased to know\
    \ that the *Slider* defines a *ThumbToolTipValueConverter* \n\nproperty that lets\
    \ you supply a class that performs the formatting you want. This class must implement\
    \ \n\nthe *IValueConverter* interface, which is the same interface you implement\
    \ to write binding converters. \n\nHowever, a converter class for the *ThumbToolTipValueConverter*\
    \ property can’t be as sophisticated \n\nas a converter class for a data binding\
    \ because you don’t have the option of supplying a parameter for \n\nthe conversion.\
    \ On the plus side, the converter class can be very simple and do only what is\
    \ required \n\nfor the particular case. \n\nThe ColorScrollWithValueConverter\
    \ project defines a converter dedicated to converting a *double* to \n\na two-character\
    \ string indicating the value in hexadecimal. The name of this class is almost\
    \ longer than \n\nthe actual code: \n\n**Project: ColorScrollWithValueConverter\
    \ | File: DoubleToStringHexByteConverter.cs **\n\n`using`` System; `\n\n`using``\
    \ Windows.UI.Xaml.Data; `\n\n` `\n\n`namespace`` ColorScrollWithValueConverter\
    \ `\n\n`{ `\n\n166"
