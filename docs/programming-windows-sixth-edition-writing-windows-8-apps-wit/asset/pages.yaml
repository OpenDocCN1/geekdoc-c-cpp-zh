  md: "` } `\n\n` } `\n\n`} `\n\nFour statements towards the end of the handler demonstrate\
    \ the mathematics that separate a Unicode \n\ncharacter code between 0x10000 and\
    \ 0x10FFFF into two 10-bit values to construct leading and trailing \n\nsurrogates,\
    \ which in sequence in a string define a single character. \n\nIf you’re the type\
    \ of person who prefers not witnessing how sausage is made, you can replace those\
    \ \n\nfour lines with: \n\n`strChar = ``Char``.ConvertFromUtf32(code); `\n\nFor\
    \ a 16-bit code, *Char.ConvertFromUtf32* returns a string consisting of one character;\
    \ for codes above \n\n0xFFFF, the string has two characters. Passing the method\
    \ a surrogate code (0xD800 through 0xDFFF) \n\nraises an exception. \n\nThe areas\
    \ that are of most interest in constructing application bar buttons begin at 0xE100\
    \ (the \n\nprivate use area used by the Seqoe UI Symbol font) and 0x1F300 (emoji).\
    \ Here’s the first screen of the \n\nemoji characters: \n\n \n\nYou can specify\
    \ a character beyond 0xFFFF in XAML like so: \n\n`<``TextBlock`` FontFamily``\\\
    =\"Segoe UI Symbol\"`` `\n\n` `` FontSize``\\=\"24\"`` `\n\n` `` Text``\\=\"&#x1F3B7;\"\
    \ />`` `\n\nThat’s the saxophone symbol. The Visual Studio designer will complain\
    \ upon encountering a five-digit \n\ncharacter code, but it will compile the application\
    \ regardless and Windows 8 will run it. \n\n![](img/bc006cce5c2364a011861f29233d37ef_237_0.png)\n\
    \n238"
