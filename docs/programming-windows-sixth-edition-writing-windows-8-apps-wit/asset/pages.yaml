  md: "**The Code Alternatives **\n\nIt’s not necessary to instantiate elements or\
    \ controls in XAML. You can alternatively create them \n\nentirely in code. Indeed,\
    \ very much of what can be done in XAML can be done in code instead. Code is \n\
    \nparticularly useful for creating many objects of the same type because there’s\
    \ no such thing as a *for* \n\nloop in XAML. \n\nLet’s create a new project named\
    \ HelloCode, but let’s visit the BlankPage.xaml file only long enough \n\nto give\
    \ the *Grid* a name: \n\n**Project: HelloCode | File: BlankPage.xaml (excerpt)\
    \ **\n\n`<``Grid`` Name``\\=\"contentGrid\"`` `\n\n` `` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` `\n\n`</``Grid``\\>`` `\n\nSetting\
    \ the *Name* attribute allows the *Grid* to be accessed from the code-behind file.\
    \ Alternatively you \n\ncan use *x:Name*: \n\n`<``Grid`` x``:``Name``\\=\"contentGrid\"\
    `` `\n\n` `` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` `\n\n`</``Grid``\\>`` `\n\nThere’s really no practical difference between\
    \ *Name* and *x:Name*. As the “x” prefix indicates, the \n\n*x:Name* attribute\
    \ is intrinsic to XAML itself, and you can use it to identify any object in the\
    \ XAML file. \n\nThe *Name* attribute is more restrictive: *Name* is defined by\
    \ *FrameworkElement*, so you can use it only \n\nwith classes that derive from\
    \ *FrameworkElement*. For a class not derived from *FrameworkElement*, you’ll\
    \ \n\nneed to use *x:Name* instead. Some programmers prefer to be consistent by\
    \ using *x:Name* throughout. I \n\ntend to use *Name* whenever I can and *x:Name*\
    \ otherwise. \n\nWhether you use *Name* or *x:Name*, the rules for the name you\
    \ choose are the same as the rules for \n\nvariable names. The name can’t contain\
    \ spaces or begin with a number, for example. All names within \n\na particular\
    \ XAML file must be unique. \n\nIn the BlankPage.xaml.cs file you’ll want two\
    \ additional *using* directives: \n\n**Project: HelloCode | File: BlankPage.xaml.cs\
    \ (excerpt) **\n\n`using`` Windows.UI; `\n\n`using`` Windows.UI.Text; `\n\nThe\
    \ first is for the *Colors* class; the second is for a *FontStyle* enumeration.\
    \ It’s not strictly necessary that \n\nyou insert these *using* directives manually.\
    \ If you use the *Colors* class or *FontStyle* enumeration, Visual \n\nStudio\
    \ will indicate with a red squiggly underline that it can’t resolve the identifier,\
    \ at which point you \n\ncan right-click it and select Resolve from the context\
    \ menu. The new *using* directive will be added to \n\nthe others in correct alphabetical\
    \ order (as long as the existing using directives are alphabetized). \n\nWhen\
    \ you’re all finished with the code file, you can right-click anywhere in the\
    \ file and select Organize \n\n34"
