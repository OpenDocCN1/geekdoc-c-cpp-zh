  md: "mechanism to signal to the *Binding* object when a property has changed. This\
    \ notification does not \n\nhappen automatically; it must be implemented through\
    \ an event. \n\nThe standard way for a View Model to serve as a binding source\
    \ is by implementing the \n\n*INotifyPropertyChanged* interface defined in the\
    \ *System.ComponentModel* namespace. This interface \n\nhas an exceptionally simple\
    \ definition: \n\n`public`` ``interface`` ``INotifyPropertyChanged`` `\n\n`{ `\n\
    \n` ``event`` ``PropertyChangedEventHandler`` PropertyChanged; `\n\n`} `\n\nThe\
    \ *PropertyChangedEventHandler* delegate is associated with the *PropertyChangedEventArgs*\
    \ class, \n\nwhich defines one property: *PropertyName* of type *string*. When\
    \ a class implements \n\n*INotifyPropertyChanged*, it fires a *PropertyChanged*\
    \ event whenever one of its properties changes. \n\nHere’s a simple example of\
    \ a class that implements *INotifyPropertyChanged*. The single property \n\nnamed\
    \ *TotalScore* fires the *PropertyChanged* event when the property changes: \n\
    \n`public`` ``class`` ``SimpleViewModel`` : ``INotifyPropertyChanged`` `\n\n`{\
    \ `\n\n` ``double`` totalScore; `\n\n` `\n\n` ``public`` ``event`` ``PropertyChangedEventHandler``\
    \ PropertyChanged; `\n\n` `\n\n` ``public`` ``double`` TotalScore `\n\n` { `\n\
    \n` ``set`` `\n\n` { `\n\n` ``if`` (totalScore != ``value``) `\n\n` { `\n\n` totalScore\
    \ = ``value``; `\n\n` `\n\n` ``if`` (PropertyChanged != ``null``) `\n\n` PropertyChanged(``this``,\
    \ ``new`` ``PropertyChangedEventArgs``(``\"TotalScore\"``)); `\n\n` } `\n\n` }\
    \ `\n\n` ``get`` `\n\n` { `\n\n` ``return`` totalScore; `\n\n` } `\n\n` } `\n\n\
    `} `\n\nThe *TotalScore* property is backed by the *totalScore* field. Notice\
    \ that the *TotalScore* property checks \n\nthe value coming into the *set* accessor\
    \ against the *totalScore* field and fires the *PropertyChanged* event \n\nonly\
    \ when the property actually changes. Do not skimp on this step just to make these\
    \ *set* accessors a \n\nlittle shorter! The event is called *PropertyChanged*\
    \ and not \n\n*PropertySetAndPerhapsChangedOrMaybeNot*. \n\nAlso notice that it’s\
    \ possible for a class to legally implement *INotifyPropertyChanged* and not \n\
    \n207"
