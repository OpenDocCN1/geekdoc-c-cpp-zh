- img_proc: true
  md: "margin area. If you tap in an element’s margin area, the element’s *parent*\
    \ gets the *Tapped* event. \n\nThe *Padding* property is also of type *Thickness*,\
    \ but only a few classes define a *Padding* property: \n\n*Control*, *Border*,\
    \ *TextBlock*, *RichTextBlock*, and *RichTextBlockOverflow*. The *Padding* property\
    \ defines an \n\narea *inside* the element. This area is considered to be part\
    \ of the element for all purposes, including \n\nuser input. \n\nIf you want a\
    \ *TextBlock* to respond to taps not only on the text itself but also within a\
    \ 100-pixel area \n\nsurrounding the text, set the *Padding* property of the *TextBlock*\
    \ to 100 rather than the *Margin* property. \n\n**Rectangle and Ellipse **\n\n\
    As you saw in Chapter 2, “XAML Syntax,” the *Windows.UI.Xaml.Shapes* namespace\
    \ contains classes used \n\nto render vector graphics: lines, and curves, and\
    \ filled areas. The *Shape* class itself derives from \n\n*FrameworkElement* and\
    \ defines various properties, including *Stroke* (for specifying the brush used\
    \ to \n\nrender straight lines and curves), *StrokeThickness*, and *Fill* (for\
    \ specifying the brush used to render \n\nenclosed areas). \n\nSix classes derive\
    \ from *Shape*. *Line*, *Polyline*, and *Polygon* render straight lines based\
    \ on coordinate \n\npoints, and *Path* uses a series of classes in *Windows.UI.Xaml.Media*\
    \ for rendering a series of straight \n\nlines, arcs, and Bezier curves. \n\n\
    The remaining two classes that derive from *Shape* are *Rectangle* and *Ellipse*.\
    \ Despite the innocent \n\nnames, these elements are real oddities in that they\
    \ define figures without the use of coordinate points. \n\nHere, for example,\
    \ is a tiny piece of XAML to render an ellipse: \n\n**Project: SimpleEllipse |\
    \ File: BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``Ellipse`` Stroke``\\=\"Red\"\
    `` `\n\n` `` StrokeThickness``\\=\"24\"`` `\n\n` `` Fill``\\=\"Blue\" />`` `\n\
    \n`</``Grid``\\>`` `\n\nNotice how the ellipse fills its container: \n\n110"
  merge: -1
  pgno: 109
- img_proc: true
  md: " \n\nLike all other *FrameworkElement* derivatives, *Ellipse* has default *HorizontalAlignment*\
    \ and \n\n*VerticalAlignment* settings of *Stretch*, but *Ellipse* most decisively\
    \ reveals the implications of these \n\nsettings. \n\nWhat happens if you set\
    \ a nondefault *HorizontalAlignment* or *VerticalAlignment* on this *Ellipse*\
    \ \n\nelement? Try it! The ellipse shrinks down to nothing. It disappears. In\
    \ fact, it’s hard to imagine how it \n\ncan legitimately have any other behavior.\
    \ If you do not want the *Ellipse* or *Rectangle* element to fill its \n\ncontainer,\
    \ your only real alternative is to set explicit *Height* and *Width* values on\
    \ it. \n\nThe *Shape* class also defines a *Stretch* property, which is similar\
    \ to the *Stretch* property defined by \n\n*Image*. For example, in the SimpleEllipse\
    \ program, if you set the *Stretch* property to *Uniform*, you’ll get \n\na special\
    \ case of an ellipse that has equal horizontal and vertical radii. This is a circle,\
    \ and its diameter is \n\nset to the minimum of the container’s width and height.\
    \ Setting the *Stretch* property to *UniformToFill* \n\nalso gets you a circle,\
    \ but now the diameter is the *maximum* of the container’s width and height, so\
    \ \n\npart of the circle is cropped: \n\n![](img/bc006cce5c2364a011861f29233d37ef_110_0.png)\n\
    \n111"
  merge: -1
  pgno: 110
- img_proc: true
  md: " \n\nYou can control what part is cropped with the *HorizontalAlignment* and\
    \ *VerticalAlignment* properties. \n\n*Rectangle* is very similar to *Ellipse*\
    \ and also shares several characteristics with *Border*, although the \n\nproperties\
    \ have different names: \n\n**Border **\n\n**Rectangle **\n\nBorderBrush \n\n\
    Stroke \n\nBorderThickness \n\nStrokeThickness \n\nBackground \n\nFill \n\nCornerRadius\
    \ \n\nRadiusX / RadiusY \n\nThe big difference between *Border* and *Rectangle*\
    \ is that *Border* has a *Child* property and *Rectangle* \n\ndoes not. \n\n**The\
    \ *****StackPanel***\n\n*Panel* and its derivative classes form the core of the\
    \ Windows Runtime layout system. *Panel* defines just \n\na few properties on\
    \ its own, but one of them is *Children*, and that’s crucial. A *Panel* derivative\
    \ is the \n\nonly type of element that supports multiple children. \n\nThis class\
    \ hierarchy shows *Panel* and some of its derivatives: \n\n*Object* \n\n \n\n\
    \ \n\n*DependencyObject* \n\n \n\n \n\n \n\n*UIElement* \n\n \n\n \n\n \n\n \n\
    \n*FrameworkElement* \n\n \n\n \n\n \n\n \n\n \n\n*Panel* \n\n \n\n \n\n \n\n\
    \ \n\n \n\n \n\n*Canvas* \n\n \n\n \n\n \n\n \n\n \n\n \n\n*Grid* \n\n![](img/bc006cce5c2364a011861f29233d37ef_111_0.png)\n\
    \n112"
  merge: -1
  pgno: 111
- img_proc: true
  md: " \n\n \n\n \n\n \n\n \n\n \n\n*StackPanel* \n\n \n\n \n\n \n\n \n\n \n\n \n\
    \n*VariableSizedWrapGrid* \n\nThere are others, but they have restrictions that\
    \ prevent them from being used except in controls of \n\ntype *ItemsControl* (which\
    \ I’ll discuss in a future chapter). I’ll save the *Grid* for Chapter 5, “Control\
    \ \n\nInteraction,” and I’ll cover the other three here. \n\nOf these standard\
    \ panels, the *StackPanel* is certainly the easiest to use. Like the name suggests,\
    \ it \n\nstacks its children, by default vertically. The children can be different\
    \ heights, but each child gets only \n\nas much height as it needs. The SimpleVerticalStack\
    \ program shows how it’s done: \n\n**Project: SimpleVerticalStack | File: BlankPage.xaml\
    \ (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``StackPanel``\\>`` `\n\n` ``<``TextBlock`` Text``\\=\"Right-Aligned\
    \ Text\"`` `\n\n` `` FontSize``\\=\"48\"`` `\n\n` `` HorizontalAlignment``\\=\"\
    Right\" />`` `\n\n` `\n\n` ``<``Image`` Source``\\=\"http://www.charlespetzold.com/pw6/PetzoldJersey.jpg\"\
    `` `\n\n` `` Stretch``\\=\"None\" />`` `\n\n` `\n\n` ``<``TextBlock`` Text``\\\
    =\"Figure 1. Petzold heading to the basketball court\"`` `\n\n` `` FontSize``\\\
    =\"24\"`` `\n\n` `` HorizontalAlignment``\\=\"Center\" /> `\n\n` `\n\n` ``<``Ellipse``\
    \ Stroke``\\=\"Red\"`` `\n\n` `` StrokeThickness``\\=\"12\"`` `\n\n` `` Fill``\\\
    =\"Blue\" />`` `\n\n` `\n\n` ``<``TextBlock`` Text``\\=\"Left-Aligned Text\"``\
    \ `\n\n` `` FontSize``\\=\"36\"`` `\n\n` `` HorizontalAlignment``\\=\"Left\" />``\
    \ `\n\n` ``</``StackPanel``\\>`` `\n\n`</``Grid``\\> `\n\nIn XAML the children\
    \ of the *StackPanel* are simply listed in order, and that’s how they appear on\
    \ the \n\nscreen: \n\n113"
