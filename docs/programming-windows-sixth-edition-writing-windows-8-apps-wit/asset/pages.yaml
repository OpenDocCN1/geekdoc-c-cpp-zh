  md: " \n\nThe *Margin* property is defined by *FrameworkElement*, so it is available\
    \ on every element. The \n\nproperty is of type *Thickness* (the same as the type\
    \ of the *BorderThickness* property)—a structure with \n\nfour properties named\
    \ *Left*, *Top*, *Right*, and *Bottom*. *Margin* is exceptionally useful for defining\
    \ a little \n\nbreathing room around elements so that they don’t butt up against\
    \ each other, and it appears a lot in \n\nreal-life XAML. Like *BorderThickness*,\
    \ *Margin* can potentially have four different values. In XAML, they \n\nappear\
    \ in the order left, top, right, and bottom. Specify just two values and the first\
    \ applies to the left \n\nand right, and the second to the top and bottom. \n\n\
    In addition, *Border* defines a *Padding* property, which is similar to *Margin*\
    \ except that it applies to \n\nthe inside of the element rather than the outside.\
    \ Try removing the *Margin* property from *TextBlock* \n\nand instead set *Padding*\
    \ on the *Border*: \n\n`<``Border`` BorderBrush``\\=\"Red\"`` `\n\n` `` BorderThickness``\\\
    =\"12\"`` `\n\n` `` CornerRadius``\\=\"24\"`` `\n\n` `` Background``\\=\"Yellow\"\
    `` `\n\n` `` HorizontalAlignment``\\=\"Center\"`` `\n\n` `` VerticalAlignment``\\\
    =\"Center\"`` `\n\n` `` Padding``\\=\"24\">`` `\n\n` `\n\n` ``<``TextBlock`` Text``\\\
    =\"Hello Windows 8!\"`` `\n\n` `` FontSize``\\=\"96\"`` `\n\n` `` Foreground``\\\
    =\"Blue\" />`` `\n\n`</``Border``\\>`` `\n\nThe result is the same. In either\
    \ case, any *HorizontalAlignment* or *VerticalAlignment* settings on the \n\n\
    *TextBlock* are now irrelevant. \n\nFor layout purposes, *Margin* is considered\
    \ to be part of the size of the element, but otherwise it is \n\nentirely out\
    \ of the element’s control. The element cannot control the background color of\
    \ its margin, \n\nfor example. That color depends on the element’s parent. Nor\
    \ does an element get user input from the \n\n![](img/bc006cce5c2364a011861f29233d37ef_108_0.png)\n\
    \n109"
  merge: -1
