  md: " \n\n**Orientation and Aspect Ratios **\n\nIf you run SimpleColorScroll on\
    \ a tablet and rotate it into portrait mode, the layout starts to look a little\
    \ \n\nfunny, and even if you run it in landscape mode, a snap view might cause\
    \ some of the text labels to \n\noverlap. It might make sense to add some logic\
    \ in the code-behind file that adjusts the layout based \n\non the orientation\
    \ or aspect ratio of the display. \n\nAdjusting the layout with this particular\
    \ program becomes much easier if the single *Grid* is split in \n\ntwo, one nested\
    \ in the other. The inner *Grid* has three rows and three columns for the *TextBlock*\
    \ \n\nelements and *Slider* controls. The outer *Grid* has just two children:\
    \ the inner *Grid* and the *Rectangle*. In \n\nlandscape mode, the outer *Grid*\
    \ has two columns; in portrait mode, it has two rows. \n\nThe XAML file for the\
    \ OrientableColorScroll project has the same *Style* definitions as \n\nSimpleColorScroll.\
    \ The outer *Grid* is shown here: \n\n**Project: OrientableColorScroll | File:\
