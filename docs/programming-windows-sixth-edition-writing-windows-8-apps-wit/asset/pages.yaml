  md: " \n\nNotice that the alignment of the image seems to be based on the geometric\
    \ line of the spiral rather \n\nthan the line rendered with a width of 25 pixels.\
    \ This causes areas at the top, left, and right sides to be \n\nshaved off. The\
    \ problem can be fixed with the *Transform* property of *ImageBrush*, but that’s\
    \ a little too \n\nadvanced for this chapter. \n\nYou may have noticed that *ImageBrush*\
    \ derives from *TileBrush*. That heritage might suggest that \n\nyou could repeat\
    \ bitmap images horizontally and vertically to tile a surface, but doing so is\
    \ not \n\nsupported by the Windows Runtime. \n\nAny curve that you can define\
    \ with parametric formulas, you can render with *Polyline*. But if the \n\ncomplex\
    \ curves you need are arcs (that is, curves on the circumference of an ellipse),\
    \ cubic Bézier \n\nsplines (the standard sort), or quadratic Bézier splines (which\
    \ have only one control point), you don’t \n\nneed to use *Polyline*. These curves\
    \ are all supported with the *Path* element. \n\n*Path* defines just one property\
    \ on its own called *Data*, of type *Geometry*, a class defined in \n\n*Windows.UI.Xaml.Media*.\
    \ In the Windows Runtime, *Geometry* and related classes represent pure \n\nanalytic\
    \ geometry. The *Geometry* object defines lines and curves using coordinate points,\
    \ and the *Path* \n\nrenders those lines with a particular stroke brush and thickness.\
    \ \n\nThe most powerful and flexible *Geometry* derivative is *PathGeometry*.\
    \ The content property of \n\n*PathGeometry* is named *Figures*, which is a collection\
    \ of *PathFigure* objects. Each *PathFigure* is a series \n\nof connected straight\
    \ lines and curves. The content property of *PathFigure* is *Segments*, a collection\
    \ of \n\n*PathSegment* objects. *PathSegment* is the parent class to *LineSegment*,\
    \ *PolylineSegment*, *BezierSegment*, \n\n*PolyBezierSegment*, *QuadraticBezierSegment*,\
    \ *PolyQuadraticBezierSegment*, and *ArcSegment*. \n\nLet’s display the word HELLO\
    \ by using *Path* and *PathGeometry*: \n\n**Project: HelloVectorGraphics | File:\
    \ BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n![](img/bc006cce5c2364a011861f29233d37ef_63_0.png)\n\
    \n64"
