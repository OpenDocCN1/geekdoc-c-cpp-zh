  md: "The hard part is the first row. This must accommodate a *TextBlock* to show\
    \ the typed result as well \n\nas a delete button. I didn’t want a very large\
    \ delete button, so I made the whole first row of the *Grid* a \n\nseparate *Grid*\
    \ just for these two items. The attributes of the delete button override many\
    \ of the \n\nproperties set in the implicit style. Notice that the delete button\
    \ is initially disabled. It should be \n\nenabled only when there are characters\
    \ to delete. \n\nThe *TextBlock* was a little tricky. I wanted it to be left-justified\
    \ during normal typing, but if the string \n\ngot too long to be displayed, I\
    \ wanted the *TextBlock* to be clipped at the left, not at the right. My \n\n\
    solution was to enclose the *TextBlock* in a *Border*: \n\n`<``Border`` Grid.Column``\\\
    =\"0\"`` `\n\n` `` HorizontalAlignment``\\=\"Left\">`` `\n\n` `\n\n` ``<``TextBlock``\
    \ Name``\\=\"resultText\"`` `\n\n` `` HorizontalAlignment``\\=\"Right\"`` `\n\n\
    ` `` VerticalAlignment``\\=\"Center\"`` `\n\n` `` FontSize``\\=\"24\" />`` `\n\
    \n`</``Border``\\>`` `\n\nThe *Border* has a fixed limit to its width: it cannot\
    \ get wider that the width of the overall *Grid* minus the \n\nwidth of the delete\
    \ button. But within that area the *Border* is aligned to the left, and the *TextBlock*\
    \ fits \n\nentirely within that *Border*, also aligned at the left. As more characters\
