  md: "*TextBlock*) form branches. You might imagine that the values of the font properties\
    \ and *Foreground* \n\nproperty defined on the *Page* are propagated down through\
    \ the visual tree from parent to child. This is \n\ntrue except for a little peculiarity:\
    \ These properties don't exist in *Grid*. These properties are defined by \n\n\
    *TextBlock* and separately defined by *Control*, which means that the properties\
    \ manage to propagate \n\nfrom the *Page* to the *TextBlock* despite an intervening\
    \ element that has very different DNA. \n\nIf you begin examining the documentation\
    \ of these properties in the *TextBlock* or *Page* class, you'll \n\ndiscover\
    \ that they seem to appear twice under somewhat different names. In the documentation\
    \ of \n\n*TextBlock* you’ll see a *FontSize* property of type *double*: \n\n`public``\
    \ ``double`` FontSize { ``set``; ``get``; } `\n\nYou’ll also see a property named\
    \ *FontSizeProperty* of type *DependencyProperty*: \n\n`public`` ``static`` ``DependencyProperty``\
    \ FontSizeProperty { ``get``; } `\n\nNotice that this *FontSizeProperty* property\
    \ is get-only and static as well. \n\n*FontSizeProperty* is of type *DependencyProperty*,\
    \ and a class with a similar \n\nname—*DependencyObject*—has a very prominent\
    \ place in the class hierarchy I just showed you. These \n\ntwo types are related:\
    \ A class that derives from *DependencyObject* often declares static get-only\
    \ \n\nproperties of type *DependencyProperty*. Both *DependencyObject* and *DependencyProperty*\
    \ are defined \n\nin the *Windows.UI.Xaml* namespace, suggesting how fundamental\
    \ they are to the whole system. \n\nIn a Metro style application, properties can\
    \ be set in a variety of ways. For example, you’ve already \n\nseen that properties\
    \ can be set directly on an object or inherited through the visual tree. As you’ll\
    \ see \n\nin Chapter 2, properties might also be set from a Style definition.\
    \ In a future chapter you’ll see \n\nproperties set from animations. The *DependencyObject*\
    \ and *DependencyProperty* classes are part of a \n\nsystem that help maintain\
    \ order in such an environment by establishing priorities for the different ways\
    \ \n\nin which the property might be set. I don't want to go too deeply into the\
    \ mechanism just yet; it’s \n\nsomething you’ll experience more intimately when\
    \ you begin defining your own controls. \n\nThe *FontSize* property is sometimes\
    \ said to be \"backed by\" the dependency property named \n\n*FontSizeProperty*.\
    \ But sometimes a semantic shortcut is used and *FontSize* itself is referred\
    \ to as a \n\ndependency property. Usually this is not confusing. \n\nMany of\
    \ the properties defined by *UIElement* and its descendent classes are dependency\
    \ properties, \n\nbut only a few of these properties are propagated through the\
    \ visual tree. *Foreground* and all the \n\nfont-related properties are, as well\
    \ as a few others that I'll be sure to call your attention to as we \n\nencounter\
    \ them. Dependency properties also have an intrinsic default value. If you remove\
    \ all the \n\n*TextBlock* and *Page* attributes except *Text*, you'll get white\
    \ text displayed with an 11-pixel system font \n\nin the upper-left corner of\
    \ the page. \n\nThe *FontSize* property is in units of pixels and refers to the\
    \ design height of a font. This design \n\nheight includes space for descenders\
    \ and diacritical marks. As you might know, font sizes are often \n\nspecified\
    \ in *points*, which in electronic typography are units of 1/72 inch. The equivalence\
    \ between \n\npixels and points requires knowing the resolution of the video display\
    \ in dots-per-inch (DPI). Without \n\n26"
