  md: "*AppSettings* also has methods to serialize an instance of itself to XML and\
    \ save it as a file and to \n\ndeserialize that file back into an *AppSettings*\
    \ instance. The *LoadAsync* and *SaveAsync* methods to load \n\nand save these\
    \ files are, as the names suggest, asynchronous. They use a combination of Windows\
    \ \n\nRuntime classes (*StorageFolder*, *StorageFile*, and *FileIO*) and .NET\
    \ classes (*XmlSerializer*, *StringReader*, \n\nand *StringWriter*). \n\nThe *LoadAsync*\
    \ method must be static because it is the only way to create an instance of \n\
    \n*AppSettings*. Some programmers like to use a static property called *Current*\
    \ for this purpose to ensure \n\nthat *AppSettings* is a singleton—in other words,\
    \ to ensure that only one instance of *AppSettings* exists \n\nanywhere in the\
