    \ the Save As button, I’ve used the shortcut methods for the file I/O and \n\n\
    anonymous methods for the *Completed* handler and *Invoke* method. Everything\
    \ goes in the *Click* \n\nhandler for the button: \n\n**Project: MetroPad1 — File:\
    \ BlankPage.xaml.cs (excerpt) **\n\n`void`` OnSaveAsAppBarButtonClick(``object``\
