  md: "Do not specify a *RequestedTheme* of *Light* when using an application bar.\
    \ The *AppBar* has a black \n\nbackground regardless, and the dark outline and\
    \ text of the buttons will be nearly invisible. \n\n*AppBar* defines an *IsOpen*\
    \ property that you can initialize to *true* if you want the application bar to\
    \ \n\nbe visible when the user first runs the program. This might make sense if\
    \ the program is not usable \n\nunless a user executes one of the commands. \n\
    \nClicking one of the buttons does not automatically dismiss the application bar.\
    \ That must be done \n\nin code by setting *IsOpen* to *false*. However, the user\
    \ can manually dismiss the application bar in one of \n\ntwo ways: by sweeping\
    \ a finger again on the top or bottom, or by touching anywhere outside the \n\n\
    application bar. The first type of dismissal always works. The second is called\
    \ *light dismiss* and you can \n\noverride the default behavior by setting the\
    \ *IsSticky* property to *true*. \n\n*AppBar* also defines *Opened* and *Closed*\
    \ events if you need to initialize an application bar when it’s \n\nopening or\
    \ save settings when it closes. \n\n**Popups and Dialogs **\n\nWhen the *Button*\
    \ in the MetroPad1 application bar labeled “Wrap options” is clicked, the program\
    \ \n\ndisplays a little dialog with “Wrap” and “No wrap” items. Such a dialog\
    \ is normally defined as a \n\n*UserControl*, and I’ve called mine *WrapOptionsDialog*.\
    \ The XAML file represents the two options with \n\n*RadioButton* controls: \n\
    \n**Project: MetroPad1 | File: WrapOptionsDialog.xaml (excerpt) **\n\n`<``UserControl\
    \ ``…`` ``\\>`` `\n\n` `\n\n` ``<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``StackPanel`` Name``\\=\"\
    stackPanel\"`` `\n\n` `` Margin``\\=\"24\">`` `\n\n` ``<``RadioButton`` Content``\\\
    =\"Wrap\"`` `\n\n` `` Checked``\\=\"OnRadioButtonChecked\">`` `\n\n` ``<``RadioButton.Tag``\\\
    >`` `\n\n` ``<``TextWrapping``\\>``Wrap``</``TextWrapping``\\>`` `\n\n` ``</``RadioButton.Tag``\\\
    >`` `\n\n` ``</``RadioButton``\\>`` `\n\n` `\n\n` ``<``RadioButton`` Content``\\\
    =\"No wrap\"`` `\n\n` `` Checked``\\=\"OnRadioButtonChecked\">`` `\n\n` ``<``RadioButton.Tag``\\\
    >`` `\n\n` ``<``TextWrapping``\\>``NoWrap``</``TextWrapping``\\>`` `\n\n` ``</``RadioButton.Tag``\\\
    >`` `\n\n` ``</``RadioButton``\\>`` `\n\n` ``</``StackPanel``\\>`` `\n\n` ``</``Grid``\\\
    >`` `\n\n`</``UserControl``\\>`` `\n\nA few words on color. You’ll notice that\
    \ this *Grid* has the standard background brush. It needs to \n\nhave some kind\
    \ of brush or the background will be transparent. I mentioned earlier that you\
    \ can’t set \n\n241"
