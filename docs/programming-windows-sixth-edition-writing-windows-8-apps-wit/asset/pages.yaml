  md: " \n\nNo? You don’t like that it’s accurate to a millionth of a pixel? \n\n\
    The problem, of course, is that *ActualWidth* and *ActualHeight* are *double*\
    \ values, and when these \n\nvalues are converted to strings for the *Text* property\
    \ of *TextBlock*, this is what sometimes happens. \n\nIn cases like this, it is\
    \ possible to supply a little piece of code to the *Binding* object so that it\
    \ \n\nperforms the data conversion in exactly the way you want. The *Binding*\
    \ class has a property named \n\n*Converter* of type *IValueConverter*, an interface\
    \ with two methods named *Convert* (to convert from a \n\nbinding source to a\
    \ binding target) and *ConvertBack* (for a conversion from the target back to\
    \ the \n\nsource in a two-way binding). \n\nTo create your own custom converter,\
    \ you’ll need to derive a class from *IValueConverter* and to fill \n\nin the\
    \ two methods. Here’s an example that shows these methods doing nothing: \n\n\
    `public`` ``class`` ``NothingConverter`` : ``IValueConverter`` `\n\n`{ `\n\n`\
    \ ``public`` ``object`` Convert(``object`` value, ``Type`` targetType, ``object``\
    \ parameter, ``string`` language) `\n\n` { `\n\n` ``return`` value; `\n\n` } `\n\
    \n` `\n\n` ``public`` ``object`` ConvertBack(``object`` value, ``Type`` targetType,\
    \ ``object`` parameter, ``string`` language) `\n\n` { `\n\n` ``return`` value;\
    \ `\n\n` } `\n\n`} `\n\nIf you’ll be using the binding only in a one-way mode,\
    \ you can ignore the *ConvertBack* method. In \n\nthe *Convert* method, the *value*\
    \ argument is the value coming from the source. In the WhatSize \n\nexample, this\
    \ is a *double*. The *TargetType* is the type of the target—in the WhatSize example,\
    \ a *string*. \n\n![](img/bc006cce5c2364a011861f29233d37ef_119_0.png)\n\n120"
  merge: -1
  pgno: 119
- img_proc: true
  md: "If you’re writing a binding converter specifically for WhatSize to convert\
    \ floating-point numbers to \n\nstrings with no decimal points, the *Convert*\
    \ method can be as simple as this: \n\n`public`` ``object`` Convert(``object``\
    \ value, ``Type`` targetType, ``object`` parameter, ``string`` language) `\n\n\
    `{ `\n\n` ``return`` ((``double``)value).ToString(``\"F0\"``); `\n\n`} `\n\nBut\
    \ it’s more common to generalize binding converters. For example, it might be\
    \ useful for the \n\nconverter to handle *value* arguments of any type that implements\
    \ the *IFormattable* interface, which \n\nincludes *double* as well as all the\
    \ other numeric types and *DateTime*. The *IFormattable* interface defines \n\n\
    a *ToString* method with two arguments: a formatting string and an object that\
    \ implements \n\n*IFormatProvider*, which is generally a *CultureInfo* object.\
    \ \n\nBesides *value* and *targetType*, the *Convert* method also has *parameter*\
    \ and *language* arguments. \n\nThese come from two properties of the *Binding*\
    \ class named *ConverterParameter* and \n\n*ConverterLanguage*, which are generally\
    \ set right in the XAML file. This means that the formatting \n\nspecification\
    \ for *ToString* can be provided by the *parameter* argument to *Convert*, and\
    \ a *CultureInfo* \n\nobject could be created from the *language* argument. Here’s\
    \ one possibility: \n\n**Project: WhatSizeWithBindingConverter | File: FormattedStringConverter.cs\
    \ **\n\n`using`` System; `\n\n`using`` System.Globalization; `\n\n`using`` Windows.UI.Xaml.Data;\
    \ `\n\n` `\n\n`namespace`` WhatSizeWithBindingConverter `\n\n`{ `\n\n` ``public``\
    \ ``class`` ``FormattedStringConverter`` : ``IValueConverter`` `\n\n` { `\n\n\
    ` ``public`` ``object`` Convert(``object`` value, ``Type`` targetType, ``object``\
    \ parameter, ``string`` language) `\n\n` { `\n\n` ``if`` (value ``is`` ``IFormattable``\
    \ && `\n\n` parameter ``is`` ``string`` && `\n\n` !``String``.IsNullOrEmpty(parameter\
    \ ``as`` ``string``) && `\n\n` targetType == ``typeof``(``string``)) `\n\n` {\
    \ `\n\n` ``if`` (``String``.IsNullOrEmpty(language)) `\n\n` ``return`` (value\
    \ ``as`` ``IFormattable``).ToString(parameter ``as`` ``string``, ``null``); `\n\
    \n` `\n\n` ``return`` (value ``as`` ``IFormattable``).ToString(parameter ``as``\
    \ ``string``, `\n\n` new`` ``CultureInfo``(language)); `\n\n` } `\n\n` `\n\n`\
    \ ``return`` value; `\n\n` } `\n\n` ``public`` ``object`` ConvertBack(``object``\
    \ value, ``Type`` targetType, ``object`` parameter, ``string`` language) `\n\n\
    ` { `\n\n` ``return`` value; `\n\n` } `\n\n` } `\n\n`} `\n\n121"
  merge: -1
  pgno: 120
