  md: " \n\nTry setting the *Stretch* property to *Fill* to see this circular spiral\
    \ be distorted into an elliptical spiral. \n\nYou’ll recall how *LinearGradientBrush*\
    \ adapts itself to the size of whatever element it’s applied to. \n\nThe same\
    \ is true when using that brush with vector graphics. Let’s instead try an *ImageBrush*,\
    \ which is a \n\nbrush created from a bitmap. \n\nThe code-behind file for ImageBrushedSpiral\
    \ is the same as StretchedSpiral. The XAML file widens \n\nthe stroke considerably\
    \ and instantiates an *ImageBrush*: \n\n**Project: ImageBrushedSpiral | File:\
    \ BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``Polyline`` Name``\\=\"polyline\"\
    `` `\n\n` `` StrokeThickness``\\=\"25\"`` `\n\n` `` Stretch``\\=\"Uniform\">``\
    \ `\n\n` ``<``Polyline.Stroke``\\>`` `\n\n` ``<``ImageBrush`` ImageSource``\\\
    =\"http://www.charlespetzold.com/pw6/PetzoldJersey.jpg\"`` `\n\n` `` Stretch``\\\
    =\"UniformToFill\"`` `\n\n` `` AlignmentY``\\=\"Top\" />`` `\n\n` ``</``Polyline.Stroke``\\\
    >`` `\n\n` ``</``Polyline``\\>`` `\n\n`</``Grid``\\>`` `\n\nThe *ImageSource*\
    \ property of *ImageBrush* is of type *ImageSource*, just like the *Source* property\
    \ of \n\n*Image*. In XAML you can just set it to a URL. *ImageBrush* has its own\
    \ *Stretch* property, which by default \n\nis *Fill*. This means that the bitmap\
    \ is stretched to fill the area without respecting the aspect ratio. For \n\n\
    the image I’m using, that would make me look fat, so I switched to *UniformToFill*,\
    \ which maintains the \n\nimage’s aspect ratio while filling the area. Doing so\
    \ requires part of the image to be cropped. Use the \n\n*AlignmentX* and *AlignmentY*\
    \ properties to indicate how the bitmap should be aligned with the \n\ngraphical\
    \ figure, and consequently, where the image should be cropped. For this bitmap,\
    \ I prefer that \n\nthe bottom be cropped rather than my head: \n\n![](img/bc006cce5c2364a011861f29233d37ef_62_0.png)\n\
    \n63"
