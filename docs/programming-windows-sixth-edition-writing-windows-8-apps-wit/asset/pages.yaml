  md: "As you can see, *Popup* also has a “light dismiss” mode that lets you dismiss\
    \ the *Popup* by tapping \n\nanywhere outside it. By default this property is\
    \ not enabled, but in most cases it should be. \n\nThe hard part is positioning\
    \ the *Popup*. It has *VerticalOffset* and *HorizontalOffset* properties for that\
    \ \n\npurpose, but generally popups such as this are positioned just above the\
    \ application bar, which means \n\nthat you need to know the height of the popup,\
    \ the height of the page, and the height of the \n\napplication bar to get it\
    \ right. I’ve found that setting a *SizeChanged* event on the dialog control is\
    \ a \n\ngood way to obtain this information and perform the calculation. \n\n\
    The *Click* handler concludes by setting the *IsOpen* property of the *Popup*\
    \ to *true*, and here it is: \n\n \n\nThe *Popup* is automatically dismissed when\
    \ the user taps anywhere outside the *Popup*, and then the \n\nuser needs to tap\
    \ once more to dismiss the application bar. Like *AppBar*, *Popup* has *Opened*\
    \ and *Closed* \n\nevents if you need to perform some initialization or cleanup.\
    \ For example, it’s possible to install a \n\nhandler for the *Closed* event of\
    \ *Popup* and use that to set the *IsOpen* property of the *AppBar* to *false*.\
    \ \n\n**Windows Runtime File I/O **\n\nMetroPad1 has Open and Save As buttons.\
    \ If it were a real application, it would also have New and \n\nSave buttons and\
    \ it would prompt you to save a file if you pressed New or Open without saving\
    \ your \n\nprevious work. That logic is coming up in XamlCruncher. The more modest\
    \ goal here is to introduce \n\nyou to the Windows Runtime *FileOpenPicker* and\
    \ *FileSavePicker* classes, as well as some rudimentary \n\nWindows Runtime file\
    \ I/O. \n\nIf you’re familiar with the .NET *System.IO* namespace, you can leverage\
    \ some of what you already \n\nknow, but the Windows 8 version of *System.IO*\
    \ might look a bit emaciated in comparison. Be prepared \n\nfor plenty of new\
    \ file I/O classes and concepts. The whole file and stream interface has been\
    \ revamped, \n\n![](img/bc006cce5c2364a011861f29233d37ef_243_0.png)\n\n244"
  merge: -1
  pgno: 243
- img_proc: true
  md: "and any method that accesses a disk is asynchronous. Fortunately, C# 5.0 has\
    \ introduced two new \n\nkeywords *await* and *async*, which make working with\
    \ asynchronous methods very easy. But first I want \n\nto show you how to use\
    \ these asynchronous methods without *await* and *async*. \n\nThe *FileOpenPicker*\
    \ and *FileSavePicker* classes are defined in the *Windows.Storage.Pickers* \n\
    \nnamespace. These pickers take over the screen from your application and don’t\
    \ return control to the \n\napplication until they have completed. If this is\
    \ unacceptable to you, you’ll probably want to explore \n\nthe *FolderInformation*\
    \ class in the *Windows.Storage.BulkAccess* namespace for obtaining files and\
    \ \n\nsubdirectories on your own. \n\nThe *FileOpenPicker* and *FileSavePicker*\
    \ classes deliver an object of type *StorageFile* back to your \n\napplication.\
    \ *StorageFile* is defined in the *Windows.Storage* namespace and represents an\
    \ unopened file. \n\nCalling one of the *Open* methods on this *StorageFile* object\
    \ gives you a stream object represented as \n\nan interface such as *IInputStream*\
    \ or *IRandomAccessStream*. You can then attach a *DataReader* or \n\n*DataWriter*\
    \ object to this stream for reading or writing. The stream classes and interfaces\
    \ are found in \n\n*Windows.Storage.Streams*. Through extension methods defined\
    \ in *System.IO*, it’s also possible to create \n\na .NET Stream object from the\
    \ Windows Runtime object, and then use some familiar .NET objects, such \n\nas\
    \ *StreamReader* or *StreamWriter*, for dealing with these files. You might be\
    \ able to salvage some \n\nexisting code that uses .NET streams, and you’ll also\
    \ need these .NET stream objects for reading and \n\nwriting XML files. \n\nThe\
    \ only prerequisite for invoking *FileOpenPicker* is adding at least one string\
    \ to the *FileTypeFilter* \n\ncollection (for example, “.txt”). You then call\
    \ the *PickSingleFileAsync* method. \n\nNotice the last five letters of that method\
    \ name: *Async*, short for “asynchronous.” That’s a very \n\nimportant sequence\
    \ of five letters in the Windows Runtime. \n\nAs you know, a Windows Metro program\
    \ is similar to a Windows Desktop program in being \n\nevent-driven and structured\
    \ much like a state machine. Following initialization, a program sits dormant\
    \ \n\nin memory waiting for events. Very often these events signal activity in\
    \ the user interface. Sometimes \n\nthey signal systemwide changes, such as a\
    \ switch in the orientation of the display. Sometimes they \n\nsignal that a file\
    \ download has progressed or completed or failed. \n\nIt’s important that applications\
    \ process events as quickly as possible and then return control back to \n\nthe\
    \ operating system to wait for more events. If an application doesn’t process\
    \ events quickly, it could \n\nbecome unresponsive. For this reason, applications\
    \ should relegate very lengthy jobs to secondary \n\nthreads of execution. The\
    \ thread devoted to the user interface should remain free and unencumbered \n\n\
    of heavy processing. \n\nBut what if a particular method call in the Windows Runtime\
    \ itself takes a long time? Is an \n\napplication programmer expected to anticipate\
    \ that problem and put that call in a secondary thread? \n\nNo, that seems unreasonable.\
    \ For that reason, when the Microsoft developers were designing the \n\nWindows\
    \ Runtime, they attempted to identify any method call that could require more\
    \ than 50 \n\nmilliseconds to return control to the application. Approximately\
    \ 10–15% of the Windows Runtime \n\n245"
  merge: -1
  pgno: 244
- img_proc: true
  md: "qualified. These methods were made asynchronous, meaning that the methods themselves\
    \ spin off \n\nsecondary threads to do the lengthy processing. They return control\
    \ back to the application very \n\nquickly and later notify the application when\
    \ they’ve completed. \n\nThese asynchronous methods are all identified with the\
    \ *Async* suffix, and they all have similar \n\ndefinition patterns. \n\nThe method\
    \ call in *FileOpenPicker* class that displays the picker and returns a file selected\
    \ by the \n\nuser definitely will not return control to the program in under 50\
    \ milliseconds. Consequently, instead of \n\na method call named *PickSingleFile*,\
    \ it has a method call named *PickSingleFileAsync*. \n\nHere’s the *Click* handler\
    \ for the application bar Open button in MetroPad1 showing the creation \n\nand\
    \ initialization of *FileOpenPicker*, and the *PickSingleFileAsync* call: \n\n\
    **Project: MetroPad1 | File: BlankPage.xaml.cs (excerpt) **\n\n`void`` OnOpenAppBarButtonClick(``object``\
    \ sender, ``RoutedEventArgs`` args) `\n\n`{ `\n\n` ``FileOpenPicker`` picker =\
    \ ``new`` ``FileOpenPicker``(); `\n\n` picker.FileTypeFilter.Add(``\".txt\"``);\
    \ `\n\n` ``IAsyncOperation``<``StorageFile``\\> asyncOp = picker.PickSingleFileAsync();\
    \ `\n\n` asyncOp.Completed = OnPickSingleFileCompleted; `\n\n`} `\n\n` `\n\n`void``\
    \ OnPickSingleFileCompleted(``IAsyncOperation``<``StorageFile``\\> asyncInfo,\
    \ ``AsyncStatus`` asyncStatus) `\n\n`{ `\n\n` … `\n\n`} `\n\n*PickSingleFileAsync*\
    \ returns quickly, but instead of returning with a *StorageFile* selected by the\
    \ user, \n\nit returns an object of the generic type *IAsyncOperation<StorageFile>*.\
    \ That *StorageFile* type is \n\nimportant, because that's what the *PickSingleFileAsync*\
    \ will *eventually* deliver to your program but just \n\nnot right away. For that\
    \ reason, sometimes an object like *IAsyncOperation* is called a “future” or a\
    \ \n\n“promise.” \n\n*IAsyncOperation<T>* derives from the *IAsyncInfo* interface,\
    \ which defines methods named *Cancel* \n\nand *Close* and properties named *Id*,\
    \ *Status*, and *ErrorCode*. The *IAsyncOperation<T>* interface \n\nadditionally\
    \ defines a property named *Completed*, which you’ll notice is set in this code.\
    \ \n\nThis *Completed* property is a delegate of type *AsyncOperationCompletedHandler<T>*.\
    \ Although it’s \n\ndefined as a property, it functions like an event. (The difference\
    \ is that an event can have multiple \n\nhandlers but a property can have only\
