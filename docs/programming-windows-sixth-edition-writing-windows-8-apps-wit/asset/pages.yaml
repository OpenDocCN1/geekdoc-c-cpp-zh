  md: "`</``Grid``\\>`` `\n\nNow it’s obvious that the *Children* property is defined\
    \ twice with two separate collections, and that’s \n\nnot legal. \n\n**The *****TextBlock*****\
    \ Content Property **\n\nAs you saw in the WrappedText program in Chapter 1, *TextBlock*\
    \ allows you to specify text as content. \n\nHowever, the content property of\
    \ *TextBlock* is not the *Text* property. It is instead a property named \n\n\
    *Inlines* of type *InlineCollection*, a collection of *Inline* objects, or more\
    \ precisely, instances of *Inline* \n\nderivatives. The *Inline* class and its\
    \ derivatives can all be found in the *Windows.UI.Xaml.Documents* \n\nnamespace.\
    \ Here’s the hierarchy: \n\n*Object* \n\n \n\n*DependencyObject* \n\n \n\n \n\n\
    *TextElement* \n\n \n\n \n\n \n\n*Block* \n\n \n\n \n\n \n\n \n\n*Paragraph* \n\
    \n \n\n \n\n \n\n*Inline* \n\n \n\n \n\n \n\n \n\n*InlineUIContainer* \n\n \n\n\
    \ \n\n \n\n \n\n*LineBreak* \n\n \n\n \n\n \n\n \n\n*Run* (defines *Text* property)\
    \ \n\n \n\n \n\n \n\n \n\n*Span* (defines *Inlines* property) \n\n \n\n \n\n \n\
    \n \n\n \n\n*Bold* \n\n \n\n \n\n \n\n \n\n \n\n*Italic* \n\n \n\n \n\n \n\n \n\
    \n \n\n*Underline* \n\nThese classes allow you to specify varieties of formatted\
    \ text in a single *TextBlock*. *TextElement* \n\ndefines *Foreground* and all\
    \ the font-related properties: *FontFamily*, *FontSize*, *FontStyle*, *FontWeight*\
    \ (for \n\nsetting bold), *FontStretch* (expanded and compressed for fonts that\
    \ support it), and *CharacterSpacing*, \n\nand these are inherited by all the\
    \ descendant classes. \n\nThe *Block* and *Paragraph* classes are mostly used\
    \ in connection with a souped-up version of \n\n*TextBlock* called *RichTextBlock*\
    \ that I’ll discuss in a later chapter. The remainder of this discussion will\
    \ \n\nfocus entirely on classes that derive from *Inline*. \n\nThe *Run* element\
    \ is the only class here that defines a *Text* property, and *Text* is also the\
    \ content \n\nproperty of *Run*. Any text content in an *InlineCollection* is\
    \ converted to a *Run*, except when that text is \n\nalready content of a *Run*.\
    \ You can also use *Run* objects explicitly to specify different font properties\
    \ of \n\nthe text strings. \n\n*Span* defines an *Inlines* property just like\
    \ *TextBlock*. This allows *Span* and its descendent classes to be \n\nnested.\
    \ The three descendent classes of *Span* are shortcuts. For example, the *Bold*\
    \ class is equivalent to \n\n*Span* with the *FontWeight* attribute set to *Bold*.\
    \ \n\n52"
