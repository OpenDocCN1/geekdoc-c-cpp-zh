  md: "Chapter 1 \n\n**Markup and Code **\n\nEver since the publication of Brian Kernighan\
    \ and Dennis Ritchie's classic book *The C Programming *\n\n*Language* (Prentice\
    \ Hall, 1978), it has been customary for programming tutorials to begin with a\
    \ simple \n\nprogram that displays a short text string such as “hello, world.”\
    \ Let’s create a few similar programs for \n\nWindows 8, and let's do it in what’s\
    \ referred to as “Metro style.” \n\nI’ll assume you have the Windows 8 Consumer\
    \ Preview installed with the development tools and \n\nsoftware development kit,\
    \ specifically Microsoft Visual Studio 11 Express Beta for Windows 8, which \n\
    \nhereafter I’ll simply refer to as Visual Studio. \n\nLaunch Visual Studio from\
    \ the Windows 8 start screen, and let's get coding. \n\n**The First Project **\n\
    \nOn the opening screen in Visual Studio, the Get Started tab should already be\
    \ selected. Over at the \n\nright you'll see a New Project option. Click that\
    \ item, or select New Project from the File menu. \n\nWhen the New Project dialog\
    \ box comes up, select Templates in the left panel, then Visual C#, and \n\nWindows\
    \ Metro Style. From the list of available templates in the central area, select\
    \ Blank Application. \n\nTowards the bottom of the dialog box, type a project\
    \ name in the Name field: **Hello**, for example. Let \n\nthe Solution Name be\
    \ the same. Use the Browse button to select a directory location for this program,\
    \ \n\nand click OK. (I’ll generally use mouse terminology such as “click” when\
    \ referring to Visual Studio, but \n\nI’ll switch to touch terminology such as\
    \ “tap” for the applications you’ll be creating. A version of Visual \n\nStudio\
    \ that is optimized for touch is probably at least a few years away.) \n\nVisual\
    \ Studio creates a solution named Hello and a project within that solution named\
    \ Hello, as well \n\nas a bunch of files in the Hello project. These files are\
    \ listed in the Solution Explorer on the far right of \n\nthe Visual Studio screen.\
    \ Every Visual Studio solution has at least one project, but a solution might\
    \ \n\ncontain additional application projects and library projects. \n\nThe list\
    \ of files for this project includes one called BlankPage.xaml, and if you click\
    \ the little \n\narrowhead next to that file, you’ll see a file named BlankPage.xaml.cs\
    \ indented underneath \n\nBlankPage.xaml: \n\n15"
