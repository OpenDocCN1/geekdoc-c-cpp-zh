  md: "The *Completed* handler in your code is then called, and it runs in that secondary\
    \ thread. You cannot \n\naccess user interface objects from that thread. \n\n\
    For any particular window, there can be only one application thread that handles\
    \ user input and \n\ndisplays graphics that interact with this input. This \"\
    UI thread\" (as it's called) is consequently very \n\nimportant and very special\
    \ to Windows applications because all interaction with the user must occur \n\n\
    through this thread. \n\nThis prohibition can be generalized: *DependencyObject*\
    \ is not thread safe. Any object based on a \n\nclass that derives from *DependencyObject*\
    \ can only be accessed by the thread that creates that object. \n\nIn the particular\
    \ problem we’ve encountered, the code that transfers text into a *TextBox* must\
    \ run in \n\nthe UI thread. Fortunately, there’s a way to do it. To compensate\
    \ for the fact that it’s not thread safe, \n\n*DependencyObject* has a property\
    \ named *Dispatcher* that returns an object of type *CoreDispatcher*. The \n\n\
    *HasThreadAccess* property of *CoreDispatcher* lets you know if you can access\
    \ this particular \n\n*DependencyObject* from the thread in which the code is\
    \ running. If you can’t (and even if you can), you \n\ncan put a chunk of code\
    \ on a queue for execution by the thread that created the object. You do this\
    \ by \n\ncalling the *Invoke* method referencing a method in your code that will\
    \ run in the proper thread. \n\nHere’s the *OnDataReaderLoadCompleted* method\
    \ calling *Invoke* on the *Dispatcher* property of the \n\npage. It doesn’t matter\
    \ whose *CoreDispatcher* object you use; because all the user interface objects\
    \ \n\nwere created in the same UI thread, they all work identically. The last\
    \ argument passed to *Invoke* is \n\npassed to the handler as the *Context* property\
    \ of the event arguments: \n\n**Project: MetroPad1 | File: BlankPage.xaml.cs (excerpt)\
    \ **\n\n`void`` OnDataReaderLoadCompleted(``IAsyncOperation``<``uint``\\> asyncInfo,\
    \ ``AsyncStatus`` asyncStatus) `\n\n`{ `\n\n` ``if`` (asyncInfo.ErrorCode != ``null``)\
    \ `\n\n` ``return``; `\n\n` `\n\n` ``uint`` length = asyncInfo.GetResults(); `\n\
    \n` ``string`` text = dataReader.ReadString(length); `\n\n` `\n\n` ``this``.Dispatcher.Invoke(``CoreDispatcherPriority``.Normal,\
    \ `\n\n` SetTextBoxText, ``this``, text); `\n\n`} `\n\n` `\n\n`void`` SetTextBoxText(``object``\
    \ sender, ``InvokedHandlerArgs`` args) `\n\n`{ `\n\n` ``string`` text = args.Context\
    \ ``as`` ``string``; `\n\n` txtbox.Text = text; `\n\n`} `\n\nThe *SetTextBoxText*\
    \ method runs in the UI thread so that it can safely set the text from the file\
    \ into the \n\n*TextBox*. \n\nVery often, the method to be executed in the UI\
    \ thread is passed as an anonymous method to \n\n*Invoke*, like this: \n\n249"
