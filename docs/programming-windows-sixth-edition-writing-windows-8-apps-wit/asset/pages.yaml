- img_proc: true
  md: "`ellipse.SetValue(``Canvas``.TopProperty, pt.Y); `\n\nThese statements are\
    \ exactly equivalent to the *Canvas.SetLeft* and *Canvas.SetTop* calls. In fact,\
    \ although \n\nI have never seen the internal source code of the *Canvas* class,\
    \ I can practically guarantee you that the \n\n*SetLeft* and *SetTop* static methods\
    \ in *Canvas* are defined like this: \n\n`public`` ``static`` ``void`` SetLeft(``DependencyObject``\
    \ element, ``double`` value) `\n\n`{ `\n\n` element.SetValue(LeftProperty, value);\
    \ `\n\n`} `\n\n`public`` ``static`` ``void`` SetTop(``DependencyObject`` element,\
    \ ``double`` value) `\n\n`{ `\n\n` element.SetValue(TopProperty, value); `\n\n\
    `} `\n\nThese methods show very clearly how the dependency property is actually\
    \ being set on the element \n\nrather than the *Canvas*. \n\n*Canvas* also defines\
    \ *GetLeft* and *GetTop* methods: \n\n`public`` ``static`` ``double`` GetLeft(``DependencyObject``\
    \ element) `\n\n`{ `\n\n` ``return`` (``double``)element.GetValue(LeftProperty);\
    \ `\n\n`} `\n\n`public`` ``static`` ``double`` GetTop(``DependencyObject`` element)\
    \ `\n\n`{ `\n\n` ``return`` (``double``)element.GetValue(TopProperty); `\n\n`}\
    \ `\n\nThe *Canvas* class uses these methods internally to obtain the left and\
    \ top settings on each of its \n\nchildren so that it can position them during\
    \ the layout process. \n\nYou will recall that the *SetValue* and *GetValue* methods\
    \ are defined by *DependencyObject*, which is a \n\nvery basic class in the Windows\
    \ Runtime. A property like *FontSize* is actually defined in terms of the \n\n\
    static dependency property: \n\n`public`` ``double`` FontSize `\n\n`{ `\n\n` ``set``\
    \ { SetValue(FontSizeProperty, ``value``); } `\n\n` ``get`` { ``return`` (``double``)GetValue(FontSizeProperty);\
    \ } `\n\n`} `\n\nThe static *SetLeft*, *SetTop*, *GetLeft*, and *GetTop* methods\
    \ suggest that the dependency property \n\nsystem involves a dictionary of sorts.\
    \ The *SetValue* method allows an attached property like \n\n*Canvas.LeftProperty*\
    \ to be stored in an element that has no knowledge of this property or its purpose.\
    \ \n\n*Canvas* can later retrieve this property to determine where the child should\
    \ appear relative to itself. \n\n**The Z-Index **\n\n*Canvas* has a third attached\
    \ property that you can set in XAML with the attribute *Canvas.ZIndex*. The \n\
    \n147"
