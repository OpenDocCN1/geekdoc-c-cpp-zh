  md: "actually runs. \n\nAll three *Slider* controls have the same handler for the\
    \ *ValueChanged* event. That’s in the \n\ncode-behind file: \n\n**Project: SimpleColorScroll\
    \ | File: BlankPage.xaml.cs (excerpt) **\n\n`public`` ``sealed`` ``partial`` ``class``\
    \ ``BlankPage`` : ``Page`` `\n\n`{ `\n\n` ``public`` BlankPage() `\n\n` { `\n\n\
    ` ``this``.InitializeComponent(); `\n\n` } `\n\n` `\n\n` void`` OnSliderValueChanged(``object``\
    \ sender, ``RangeBaseValueChangedEventArgs`` args) `\n\n` { `\n\n` ``byte`` r\
    \ = (``byte``)redSlider.Value; `\n\n` ``byte`` g = (``byte``)greenSlider.Value;\
    \ `\n\n` ``byte`` b = (``byte``)blueSlider.Value; `\n\n` `\n\n` redValue.Text\
    \ = r.ToString(``\"X2\"``); `\n\n` greenValue.Text = g.ToString(``\"X2\"``); `\n\
    \n` blueValue.Text = b.ToString(``\"X2\"``); `\n\n` `\n\n` brushResult.Color =\
    \ ``Color``.FromArgb(255, r, g, b); `\n\n` } `\n\n`} `\n\nThe event handler could\
    \ obtain the actual *Slider* firing the event with the *sender* argument and get\
