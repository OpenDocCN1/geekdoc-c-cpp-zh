    \ want to experiment with before choosing a multiline mode or an *InputScope*\
    \ \n\nvalue. \n\n**Touch and *****Thumb***\n\nIn a future chapter I’ll discuss\
    \ touch input and how you can use it to manipulate objects on the screen. \n\n\
    Meanwhile, a modest control called *Thumb* provides some rudimentary touch functionality.\
    \ *Thumb* is \n\ndefined in the *Windows.UI.Xaml.Controls.Primitives* namespace,\
    \ and it is primarily intended as a \n\nbuilding block for the *Slider* and *Scrollbar*.\
    \ In Chapter 7, I’ll use it in a custom control. \n\nThe *Thumb* control generates\
    \ three events based on mouse, stylus, or touch movement relative to \n\nitself:\
    \ *DragStarted*, *DragDelta*, and *DragCompleted*. The *DragStarted* event occurs\
    \ when you put your \n\nfinger on a *Thumb* control or move the mouse to its surface\
    \ and click. Thereafter, *DragDelta* events \n\n198"
