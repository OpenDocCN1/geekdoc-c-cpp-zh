  md: "` ``// Foreground`` `\n\n` gray = (``byte``)(255 - gray); `\n\n` txtblkBrush.Color\
    \ = ``Color``.FromArgb(255, gray, gray, gray); `\n\n`} `\n\nAt first this might\
    \ not seem a whole lot different because two *Color* objects are being created\
    \ and \n\ndiscarded at the video frame rate. But it’s wrong to speak of *objects*\
    \ here because *Color* is a structure \n\nrather than a class. It is more correct\
    \ to speak of *values* of *Color*s. These *Color* values are stored on the \n\n\
    stack rather than requiring a memory allocation from the heap. \n\nIt’s best to\
    \ avoid frequent allocations from the heap whenever possible, and particularly\
    \ when \n\nthey’re happening 60 times per second. But what I like most about this\
    \ example is the idea of \n\n*SolidColorBrush* objects remaining alive in the\
    \ Windows Runtime composition system. This program is \n\neffectively reaching\
    \ down into that composition layer and changing a property of the brush so that\
    \ it \n\nrenders differently. \n\nThis program also illustrates part of the wonders\
    \ of dependency properties. Dependency properties \n\nare built to respond to\
    \ changes in a very structured manner. As you’ll discover, the built-in animation\
    \ \n\nfacilities of the Windows Runtime can target *only* dependency properties,\
    \ and “manual” animations \n\nusing *CompositionTarget.Rendering* have pretty\
    \ much the same limitation. Fortunately, the *Foreground* \n\nproperty of *TextBlock*\
    \ and the *Background* property of *Grid* are both dependency properties of type\
    \ \n\n*Brush*, and the *Color* property of the *SolidColorBrush* is also a dependency\
    \ property. \n\nIndeed, whenever you encounter a dependency property, you might\
    \ ask yourself, “How can I \n\nanimate that?” For example, the *Offset* property\
    \ in the *GradientStop* class is a dependency property, \n\nand you can animate\
    \ it for some interesting effects. \n\nHere’s the XAML file for the RainbowEight\
