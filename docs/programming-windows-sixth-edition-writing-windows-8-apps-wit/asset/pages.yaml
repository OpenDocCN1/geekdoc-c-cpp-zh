  md: "might create custom classes in your application, and you'd use the *local*\
    \ prefix to reference them in \n\nXAML. If you need to reference classes in code\
    \ libraries, you’ll define additional XML namespace \n\ndeclarations that refer\
    \ to the assembly name and namespace name of these libraries. You’ll see how to\
    \ \n\ndo this in chapters ahead. \n\nThe remaining namespace declarations are\
    \ for Microsoft Expression Blend. Expression Blend might \n\ninsert special markup\
    \ of its own that should be ignored by the Visual Studio compiler, so that’s the\
    \ \n\nreason for the *Ignorable* attribute, which requires yet another namespace\
    \ declaration. For any program \n\nin this book, these last three lines of the\
    \ *Page* root element can be deleted. \n\nThe *Page* element has a child element\
    \ named *Grid*, which is another class defined in the \n\nW*indows.UI.Xaml.Controls*\
    \ namespace. The *Grid* will become extremely familiar. It is sometimes referred\
    \ \n\nto as a \"container\" because it can contain other visual objects, but it’s\
    \ more formally classified as a \n\n\"panel\" because it derives from the *Panel*\
    \ class. Classes that derive from *Panel* play a very important \n\nrole in layout\
    \ in Metro style applications. In the BlankPage.xaml file that Visual Studio creates\
    \ for you, \n\nthe *Grid* is assigned a background color (actually a *Brush* object)\
    \ based on a predefined identifier using \n\na syntax I'll discuss in Chapter\
    \ 2, “XAML Syntax.” \n\nGenerally, you’ll divide a *Grid* into rows and columns\
    \ to define individual cells (as I’ll demonstrate in \n\nChapter 5, “Control Interaction”),\
    \ somewhat like a much improved version of an HTML table. A *Grid* \n\nwithout\
    \ rows and columns is sometimes called a \"single-cell *Grid*\" and is still quite\
    \ useful. \n\nTo display up to a paragraph of text in the Windows Runtime, you’ll\
    \ generally use a *TextBlock* \n\n(another class defined in the *Windows.UI.Xaml.Controls*\
    \ namespace), so let’s put a *TextBlock* in the \n\nsingle-cell *Grid* and assign\
    \ a bunch of attributes. These attributes are actually properties defined by the\
    \ \n\n*TextBlock* class: \n\n**Project: Hello | File: BlankPage.xaml (excerpt)**\n\
    \n`<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``TextBlock`` Text``\\=\"Hello, Windows 8!\"`` `\n\n` `` FontFamily``\\\
    =\"Times New Roman\"`` `\n\n` `` FontSize``\\=\"96\"`` `\n\n` `` FontStyle``\\\
    =\"Italic\"`` `\n\n` `` Foreground``\\=\"Yellow\"`` `\n\n` `` HorizontalAlignment``\\\
    =\"Center\"`` `\n\n` `` VerticalAlignment``\\=\"Center\" />`` `\n\n`</``Grid``\\\
    >`` `\n\n**Note** In this book, whenever a block of code or markup is preceded\
    \ by a heading like this one, you'll \n\nfind the code among this book's downloadable\
    \ companion content. Generally I’ll just show an excerpt \n\nof the total file,\
    \ but with enough context so you know exactly where it is. \n\nThe order of these\
    \ attributes doesn't matter, and of course the indentation doesn’t matter, and\
    \ all \n\nof them except the *Text* attribute can be skipped if you're in a hurry.\
    \ As you type you'll notice that \n\nVisual Studio's Intellisense feature suggests\
    \ attribute names and possible values for you. Often you can \n\njust select the\
    \ one you want. As you finish typing the *TextBlock*, Visual Studio's design view\
    \ gives you a \n\n19"
