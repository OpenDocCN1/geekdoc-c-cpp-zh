  md: "**The Application Bar **\n\nThe two MetroPad programs coming up might represent\
    \ a first step in creating a Metro style Notepad \n\napplication. Rather than\
    \ a menu, these programs expose their commands using an application bar. To \n\
    \nkeep the programs reasonably short, I’ve eliminated some features that might\
    \ be expected in a real \n\nNotepad-like application. MetroPad1 and MetroPad2\
    \ are functionally equivalent but use different \n\nmethods for asynchronous file\
    \ I/O. Here’s the BlankPage.xaml file for MetroPad1: \n\n**Project: MetroPad1\
    \ | File: BlankPage.xaml (excerpt) **\n\n`<``Page ``…`` ``\\>`` `\n\n` `\n\n`\
    \ ``<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``TextBox`` Name``\\=\"txtbox\"`` `\n\n` `` FontSize``\\=\"24\"\
    `` `\n\n` `` AcceptsReturn``\\=\"True\" />`` `\n\n` ``</``Grid``\\>`` `\n\n` `\n\
    \n` ``<``Page.BottomAppBar``\\>`` `\n\n` ``<``AppBar`` Padding``\\=\"10 0\">``\
    \ `\n\n` ``<``Grid``\\>`` `\n\n` ``<``StackPanel`` Orientation``\\=\"Horizontal\"\
    `` `\n\n` `` HorizontalAlignment``\\=\"Left\">`` `\n\n` `\n\n` ``<``Button`` Style``\\\
    =\"{``StaticResource`` AppBarButtonStyle``}\"`` `\n\n` `` Content``\\=\"&#xE15E;\"\
    `` `\n\n` `` AutomationProperties.Name``\\=\"Wrap options\"`` `\n\n` `` Click``\\\
    =\"OnWrapOptionsAppBarButtonClick\" />`` `\n\n` ``</``StackPanel``\\>`` `\n\n\
    ` `\n\n` ``<``StackPanel`` Orientation``\\=\"Horizontal\"`` `\n\n` `` HorizontalAlignment``\\\
    =\"Right\">`` `\n\n` `\n\n` ``<``Button`` Style``\\=\"{``StaticResource`` AppBarButtonStyle``}\"\
    `` `\n\n` `` Content``\\=\"&#xE184;\"`` `\n\n` `` AutomationProperties.Name``\\\
    =\"Open\"`` `\n\n` `` Click``\\=\"OnOpenAppBarButtonClick\" />`` `\n\n` `\n\n\
    ` ``<``Button`` Style``\\=\"{``StaticResource`` SaveAppBarButtonStyle``}\"`` `\n\
    \n` `` AutomationProperties.Name``\\=\"Save As\"`` `\n\n` `` Click``\\=\"OnSaveAsAppBarButtonClick\"\
    \ />`` `\n\n` ``</``StackPanel``\\>`` `\n\n` ``</``Grid``\\>`` `\n\n` ``</``AppBar``\\\
    >`` `\n\n` ``</``Page.BottomAppBar``\\>`` `\n\n`</``Page``\\>`` `\n\nI’ve given\
    \ the *TextBox* a little larger font so that it’s easier to experiment with scrolling\
    \ and word \n\nwrapping. In the constructor of the code-behind file, the handler\
    \ for the *Loaded* event gives *TextBox* \n\ninput focus so the program is ready\
