    \ prefer giving a name of Assets to the folder that stores application \n\nbitmaps.\
    \ You’ll notice that the standard project already contains an Assets folder containing\
    \ program \n\nicons. You can use that same folder for your other images instead\
    \ of creating a separate folder. \n\n**Variations in Text **\n\nYou might be tempted\
    \ to refer to the *Grid*, *TextBlock*, and *Image* as \"controls,\" perhaps based\
    \ on the \n\nknowledge that these classes are in the *Windows.UI.Xaml.Controls*\
    \ namespace. Strictly speaking, \n\nhowever, they are *not* controls. The Windows\
    \ Runtime does define a class named *Control* but these \n\nthree classes do not\
    \ descend from *Control*. Here's a tiny piece of the Windows Runtime class hierarchy\
    \ \n\nshowing the classes encountered so far: \n\n*Object* \n\n \n\n*DependencyObject*\
    \ \n\n \n\n \n\n*UIElement* \n\n \n\n \n\n \n\n*FrameworkElement *\n\n \n\n \n\
    \n \n\n \n\n*TextBlock* \n\n \n\n \n\n \n\n \n\n*Image* \n\n \n\n \n\n \n\n \n\
    \n*Panel* \n\n![](img/bc006cce5c2364a011861f29233d37ef_23_0.png)\n\n24"
