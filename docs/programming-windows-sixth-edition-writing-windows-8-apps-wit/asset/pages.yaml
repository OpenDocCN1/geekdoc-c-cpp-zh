    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``Image`` Name``\\=\"image\"\
    `` `\n\n` `` Stretch``\\=\"None\" />`` `\n\n`</``Grid``\\>`` `\n\nThe code-behind\
    \ file sets the *Source* property of the *Image* element in a single line: \n\n\
    **Project: HelloLocalImageCode | File: BlankPage.xaml.cs (excerpt) **\n\n`public``\
