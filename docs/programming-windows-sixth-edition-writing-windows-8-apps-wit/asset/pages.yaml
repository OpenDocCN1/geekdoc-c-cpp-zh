  md: "Chapter 6 \n\n**WinRT and MVVM **\n\nIn structuring software, one of the main\
    \ guiding rules is the separation of concerns. A large application \n\nis best\
    \ developed, debugged, and maintained by being separated into specialized layers.\
    \ In highly \n\ninteractive graphical environments, one obvious separation is\
    \ between presentation and content. The \n\npresentation layer is the part of\
    \ the program that displays controls and other graphics and interacts \n\nwith\
    \ the user. Underlying this presentation layer is business logic and data providers.\
    \ \n\nTo help programmers conceptualize and implement separations of concerns,\
    \ architectural patterns \n\nare developed. In XAML-based programming environments,\
    \ one pattern that has become extremely \n\npopular is Model-View-ViewModel, or\
    \ MVVM. MVVM is particularly suited for implementing a \n\npresentation layer\
    \ in XAML and linking to the underlying business logic through data bindings and\
    \ \n\ncommands. \n\nUnfortunately, books such as this one tend to contain very\
    \ small programs to illustrate particular \n\nfeatures and concepts. Very small\
    \ programs often become much larger when they are made to fit an \n\narchitectural\
    \ pattern! MVVM is overkill for a small application and may very well obfuscate\
    \ rather than \n\nclarify. \n\nNevertheless, data binding and commanding are an\
    \ important part of the Windows Runtime, and \n\nyou should see how they help\
    \ implement an MVVM architecture. \n\n**MVVM (Brief and Simplified) **\n\nAs the\
    \ name suggests, an application using the Model-View-ViewModel pattern is split\
    \ into three \n\nlayers: \n\n• \n\nThe Model is the layer that deals with data\
    \ and raw content. It is often involved with obtaining \n\nand maintaining data\
    \ from files or web services. \n\n• \n\nThe View is the presentation layer of\
    \ controls and graphics, generally implemented in XAML. \n\n• \n\nThe View Model\
    \ sits between the Model and View. In the general case, it is responsible for\
    \ \n\nmaking the data or content from the Model more conducive to the View. \n\
    \nIt’s not uncommon for the Model layer to be unnecessary and therefore absent,\
    \ and that’s the case \n\nfor the programs shown in this chapter. \n\nIf all the\
    \ interaction between these three layers occurs through procedural method calls,\
    \ a calling \n\nhierarchy would be imposed: \n\n205"
  merge: -1
