  md: "` `` TextAlignment``\\=\"Center\">`` `\n\n` &#x21A5; `\n\n` ``<``LineBreak``\
    \ />`` `\n\n` ``<``Run`` x``:``Name``\\=\"heightText\" />`` pixels `\n\n` ``<``LineBreak``\
    \ />`` `\n\n` &#x21A7; `\n\n` ``</``TextBlock``\\>`` `\n\n` ``</``Grid``\\>``\
    \ `\n\n`</``Page``\\>`` `\n\nThe remainder of the XAML file defines two *TextBlock*\
    \ elements containing some *Run* objects \n\nsurrounded by arrow characters. (You’ll\
    \ see what they look like soon.) It might seem excessive to set \n\nthree properties\
    \ to *Center* in the second *TextBlock*, but they’re all necessary. The first\
    \ two center the \n\n*TextBlock* in the page; setting *TextAlignment* to *Center*\
    \ results in the two arrows being centered relative \n\nto the text. The two *Run*\
    \ elements are given *x:Name* attributes so that the *Text* properties can be\
    \ set in \n\ncode. This happens in the *SizeChanged* event handler: \n\n**Project:\
    \ WhatSize | File: BlankPage.xaml.cs (excerpt) **\n\n`public`` ``sealed`` ``partial``\
    \ ``class`` ``BlankPage`` : ``Page`` `\n\n`{ `\n\n` ``public`` BlankPage() `\n\
    \n` { `\n\n` ``this``.InitializeComponent(); `\n\n` } `\n\n` `\n\n` ``void`` OnPageSizeChanged(``object``\
    \ sender, ``SizeChangedEventArgs`` args) `\n\n` { `\n\n` widthText.Text = args.NewSize.Width.ToString();\
    \ `\n\n` heightText.Text = args.NewSize.Height.ToString(); `\n\n` } `\n\n`} `\n\
    \nVery conveniently, the event arguments supply the new size in the form of a\
    \ *Size* structure, and the \n\nhandler simply converts the *Width* and *Height*\
    \ properties to strings and sets them to the *Text* properties \n\nof the two\
