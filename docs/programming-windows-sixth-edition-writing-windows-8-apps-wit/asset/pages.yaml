    \ greeting: \n\n \n\nThe Windows Runtime supports the popular BMP, JPEG, PNG,\
    \ and GIF formats, as well as a couple less \n\ncommon formats. For images such\
    \ as the one above, PNG is common, so save it with a name like \n\nGreeting.png.\
    \ \n\nNow create a new project: HelloLocalImage, for example. It’s common to store\
