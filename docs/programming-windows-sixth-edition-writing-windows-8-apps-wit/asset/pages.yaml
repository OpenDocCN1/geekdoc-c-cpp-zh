  md: "` `` Margin``\\=\"12 18 0 0\"`` `\n\n` `` IsHitTestVisible``\\=\"False\" />``\
    \ `\n\n` ``</``Grid``\\>`` `\n\n`</``UserControl``\\>`` `\n\nThe *Polygon* is\
    \ similar to *Polyline* except that it automatically closes the figure and then\
    \ fills the \n\nfigure with the brush referenced by the *Fill* property. \n\n\
    The *Thumb* has *DragStarted* and *DragDelta* event handlers installed. The two\
    \ elements that sit on \n\ntop of the *Thumb*—the *Border* and *TextBlock*—visually\
    \ hide the *Thumb* but have their *IsHitTestVisible* \n\nproperties set to *false*\
    \ so that they don’t block touch input from reaching the *Thumb*. \n\nThe *BorderBrush*\
    \ property of the *Border* has a binding to the *Foreground* property of the root\
    \ \n\nelement. *Foreground*, you’ll recall, is defined by the *Control* class\
    \ and inherited by *UserControl* and \n\npropagated through the visual tree. The\
    \ *Foreground* property of the *TextBlock* automatically gets this \n\nsame brush.\
    \ The *Text* property of the *TextBlock* element is bound to the *Text* property\
    \ of the control. \n\n*UserControl* doesn’t have a *Text* property, which strongly\
    \ suggests that *Block* defines it. \n\nThe code-behind file confirms that supposition.\
    \ Much of this class is devoted to defining a *Text* \n\nproperty backed by a\
