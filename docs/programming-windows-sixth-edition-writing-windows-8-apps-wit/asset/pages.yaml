  md: "1,024 possible leading surrogates, and 1,024 possible trailing surrogates,\
    \ which is sufficient for the \n\n1,048,576 codes in the range 0x10000 through\
    \ 0x10FFFF. (You’ll see the actual algorithm shortly.) \n\nText in languages that\
    \ use the Latin alphabet is mostly restricted to ASCII character codes in the\
    \ \n\nrange 0x0020 and 0x007E, so most web pages and other files save lots of\
    \ space by using a system \n\ncalled UTF-8 for text. UTF-8 encodes these 7-bit\
    \ characters directly but uses one to three additional \n\nbytes for other Unicode\
    \ characters. \n\nBecause I wrote SegoeSymbols mostly to let me examine the symbols\
