  md: "The Windows Runtime has no equivalent of the WM\\_PAINT message, and indeed,\
    \ the entire \n\ngraphics paradigm is quite different. Previous versions of Windows\
    \ implemented a “direct mode” \n\ngraphics system in which applications drew to\
    \ the actual video memory. Of course, this occurred \n\nthrough a software lawyer\
    \ (the Graphics Device Interface) and a device driver, but at some point in the\
    \ \n\nactual drawing functions, code was writing into video display memory. \n\
    \nThe Windows Runtime is quite different. In its public programming interface,\
    \ it doesn’t even have a \n\nconcept of drawing or painting. Instead, a Metro\
    \ style application creates elements—that is, objects \n\ninstantiated from classes\
    \ that derive from *FrameworkElement*—and adds them to the application’s \n\n\
    visual tree. These elements are responsible for rendering themselves. When a Metro\
    \ style application \n\nwants to display text, it doesn’t draw text but instead\
    \ creates a *TextBlock*. When the application wants \n\nto display a bitmap, it\
    \ creates an *Image* element. Instead of drawing lines and Bézier splines and\
    \ \n\nellipses, the program creates *Polyline* and *Path* elements. \n\nThe Windows\
    \ Runtime implements a “retained mode” graphics system. Between your application\
    \ \n\nand the video display is a composition layer on which all the rendered output\
    \ is assembled before it is \n\npresented to the user. Perhaps the most important\
    \ benefit of retained mode graphics is flicker-free \n\nanimation, as you’ll witness\
    \ for yourself towards the end of this chapter and in much of the remainder \n\
    \nof this book. \n\nAlthough the graphics system in the Windows Runtime is very\
    \ different from earlier versions of \n\nWindows, in another sense a Metro style\
    \ application is similar to its earlier brethren. Once a program is \n\nloaded\
    \ into memory and starts running, it spends most of its time generally sitting\
    \ dormant in \n\nmemory, waiting for something interesting to happen. These notifications\
    \ take the form of events and \n\ncallbacks. Often these events signal user input,\
    \ but there may be other interesting activity as well. One \n\nsuch callback is\
    \ the *OnNavigatedTo* method. In a simple single-page program, this method is\
    \ called \n\nsoon after the constructor returns. \n\nAnother event that might\
    \ be of interest to a Metro style application—particularly one that does \n\n\
    what the old WHATSIZE program did—is named *SizeChanged*. Here’s the XAML file\
    \ for the Metro Style \n\nWhatSize program. Notice that the root element defines\
    \ a handler for the *SizeChanged* event: \n\n**Project: WhatSize | File: BlankPage.xaml\
    \ (excerpt) **\n\n`<``Page`` `\n\n` `` x``:``Class``\\=\"WhatSize.BlankPage\"\
    `` `\n\n` `` ``… `\n\n` `` FontSize``\\=\"36\"`` `\n\n` `` SizeChanged``\\=\"\
    OnPageSizeChanged\">`` `\n\n` `\n\n` ``<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``TextBlock`` HorizontalAlignment``\\\
    =\"Center\"`` `\n\n` `` VerticalAlignment``\\=\"Top\">`` `\n\n` &#x21A4; ``<``Run``\
    \ x``:``Name``\\=\"widthText\" />`` pixels &#x21A6; `\n\n` ``</``TextBlock``\\\
    >`` `\n\n` `\n\n` ``<``TextBlock`` HorizontalAlignment``\\=\"Center\"`` `\n\n\
    ` `` VerticalAlignment``\\=\"Center\"`` `\n\n92"
