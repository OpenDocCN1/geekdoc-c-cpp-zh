  md: "*TextBlock*, the *Grid* doesn’t change color like it did earlier. Instead,\
    \ the *TextBlock* changes color! It’s as \n\nif…yes, it’s as if the *TextBlock*\
    \ is now occupying the entire page and snagging all the *Tapped* events for \n\
    \nitself. \n\nAnd that’s precisely the case. This *TextBlock* has default values\
    \ of *HorizontalAlignment* and \n\n*VerticalAlignment*, but those default values\
    \ are not *Left* and *Top* like the visuals may suggest. The \n\ndefault values\
    \ are named *Stretch*, and that means that the *TextBlock* is stretched to the\
    \ size of its \n\nparent, the *Grid*. It’s hard to tell because the text still\
    \ has a 48-pixel font, but the *TextBlock* has a \n\ntransparent background that\
    \ now fills the entire page. \n\nIn fact, throughout the Windows Runtime, all\
    \ elements have default *HorizontalAlignment* and \n\n*VerticalAlignment* values\
    \ of *Stretch*, and it’s an important part of the Windows Runtime layout system.\
    \ \n\nMore details are coming in Chapter 4. \n\nLet’s put *HorizontalAlignment*\
    \ and *VerticalAlignment* values in this *TextBlock*: \n\n`<``Grid`` Background``\\\
    =\"{``StaticResource`` ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"Hello, Windows 8!\"`` `\n\n` `` HorizontalAlignment``\\=\"Left\"\
    `` `\n\n` `` VerticalAlignment``\\=\"Top\"`` `\n\n` `` Foreground``\\=\"Red\"\
    \ />`` `\n\n`</``Grid``\\>`` `\n\nNow the *TextBlock* is only occupying a small\
    \ area in the upper-left corner of the page, and when you \n\ntap outside the\
    \ *TextBlock*, the *Grid* changes color. \n\nNow change *HorizontalAlignment*\
    \ to *TextAlignment*: \n\n`<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``TextBlock`` Text``\\=\"Hello, Windows 8!\"`` `\n\n` `` TextAlignment``\\\
    =\"Left\"`` `\n\n` `` VerticalAlignment``\\=\"Top\"`` `\n\n` `` Foreground``\\\
    =\"Red\" />`` `\n\n`</``Grid``\\>`` `\n\nThe program looks the same. The text\
    \ is still positioned at the upper-left corner. But now when you tap \n\nto the\
    \ right of the *TextBlock*, the *TextBlock* changes color rather than the *Grid*.\
    \ The *TextBlock* has its \n\ndefault *HorizontalAlignment* property of *Stretch*,\
    \ so it is now occupying the entire width of the screen, \n\nbut within the total\
    \ width that the *TextBlock* occupies, the text is aligned to the left. \n\nThe\
    \ lesson: *HorizontalAlignment* and *TextAlignment* are not equivalent, although\
    \ they might seem \n\nto be if you judge solely from the visuals. \n\nNow try\
    \ another experiment by restoring the *HorizontalAlignment* setting and removing\
    \ the \n\n*Background* property of the *Grid*: \n\n`<``Grid``\\>`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"Hello, Windows 8!\"`` `\n\n` `` HorizontalAlignment``\\=\"Left\"\
    `` `\n\n` `` VerticalAlignment``\\=\"Top\"`` `\n\n` `` Foreground``\\=\"Red\"\
    \ />`` `\n\n90"
