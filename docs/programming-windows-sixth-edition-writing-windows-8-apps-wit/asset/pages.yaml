  md: "**The *****DelegateCommand***** Class **\n\nLet’s rewrite the SimpleKeypad\
    \ application from Chapter 5 so that it uses a View Model to accumulate \n\nthe\
    \ keystrokes and generate a formatted text string. Besides implementing the *INotifyPropertyChanged*\
    \ \n\ninterface (via the *BindableBase* class), the View Model will also process\
    \ commands from all the buttons \n\nin the keypad. There will be no more *Click*\
    \ handlers. \n\nHere’s the problem: For the View Model to process button commands,\
    \ it must have one or more \n\nproperties of type *ICommand*, which means that\
    \ we need one or more classes that implement the \n\n*ICommand* interface. To\
    \ implement *ICommand*, these classes must contain *Execute* and *CanExecute*\
    \ \n\nmethods and the *CanExecuteChanged* event. Yet, the bodies of these methods\
    \ undoubtedly need to \n\ninteract with the other parts of the View Model. \n\n\
    The solution is to define all the *Execute* and *CanExecute* methods in the View\
    \ Model class but with \n\ndifferent and unique names. Then, a special class can\
    \ be defined that implements *ICommand* but that \n\nactually calls the methods\
    \ in the View Model. \n\nThis special class is often named *DelegateCommand*,\
    \ and if you search around, you’ll find several \n\nsomewhat different implementations\
    \ of this class, including one in Microsoft’s Prism framework, which \n\nhelps\
    \ developers implement MVVM in Windows Presentation Foundation (WPF) and Silverlight.\
    \ The \n\nversion here is my variation. \n\n*DelegateCommand* implements the *ICommand*\
    \ interface, which means it has *Execute* and \n\n*CanExecute* methods and the\
    \ *CanExecuteChanged* event, but it turns out that *DelegateCommand* also \n\n\
    needs another method to fire the *CanExecuteChanged* event. Let’s call this additional\
    \ method \n\n*RaiseCanExecuteChanged*. The first job is to define an interface\
    \ that implements *ICommand* but that \n\nincludes this additional method: \n\n\
    **Project: KeypadWithViewModel | File: IDelegateCommand.cs **\n\n`using`` System.Windows.Input;\
    \ `\n\n` `\n\n`namespace`` KeypadWithViewModel `\n\n`{ `\n\n` ``public`` ``interface``\
    \ ``IDelegateCommand`` : ``ICommand`` `\n\n` { `\n\n` ``void`` RaiseCanExecuteChanged();\
    \ `\n\n` } `\n\n`} `\n\nSimple enough. The *DelegateCommand* class implements\
    \ the *IDelegateCommand* interface and \n\nmakes use of a couple simple (but useful)\
    \ delegates defined in the *System* namespace. The \n\n*Action<object>* delegate\
    \ represents a method with a single object argument and a void return value; \n\
    \nnot coincidentally, this is the signature of the *Execute* method. The *Func<object,\
    \ bool>* delegate \n\nrepresents a method with an *object* argument that returns\
    \ a *bool*; this is the signature of the \n\n*CanExecute* method. *DelegateCommand*\
    \ defines two fields of these types for storing methods with \n\nthese signatures:\
    \ \n\n225"
