  md: "the *PropertyChanged* handler sets the *Text* property of the *TextBox* to\
    \ the string “5”, replacing “05”. But \n\nthe cursor location is not changed,\
    \ so it’s between the 0 and the 5 instead of being after the 5. \n\nPerhaps the\
    \ best way to prevent this problem is to ignore *PropertyChanged* events from\
    \ the View \n\nModel while setting a property in the View Model from the *TextChanged*\
    \ handler. You can do this with \n\na simple flag: \n\n`bool`` blockViewModelUpdates;\
    \ `\n\n` `\n\n`… `\n\n` `\n\n`void`` OnRgbViewModelPropertyChanged(``object``\
    \ sender, ``PropertyChangedEventArgs`` args) `\n\n`{ `\n\n` ``if`` (blockViewModelUpdates)\
    \ `\n\n` ``return``; `\n\n` … `\n\n`} `\n\n` `\n\n`void`` OnTextBoxTextChanged(``object``\
    \ sender, ``TextChangedEventArgs`` args) `\n\n`{ `\n\n` blockViewModelUpdates\
    \ = ``true``; `\n\n` … `\n\n` blockViewModelUpdates = ``false``; `\n\n`} `\n\n\
    You’ll probably also want to clean up the displayed values when each TextBox loses\
    \ input focus. \n\n**Buttons and MVVM **\n\nAt first, the idea that you can use\
    \ MVVM to eliminate most of the code-behind file seems valid only for \n\ncontrols\
    \ that generate values. The concept starts to crumble when you consider buttons.\
    \ A *Button* fires \n\na *Click* event. That *Click* event must be handled in\
    \ the code-behind file. If a View Model is actually \n\nimplementing the logic\
    \ for that button (which is likely), the *Click* handler must call a method in\
    \ the \n\nView Model. That might be architecturally legal, but it’s still rather\
    \ cumbersome. \n\nFortunately, there’s an alternative to the *Click* event that\
    \ is ideal for MVVM. This is sometimes \n\ninformally referred to as the “command\
    \ interface.” *ButtonBase* defines properties named *Command* (of \n\ntype *ICommand*)\
    \ and *CommandParameter* (of type object) that allow a *Button* to effectively\
    \ make a call \n\ninto a View Model. *Command* and *CommandParameter* are both\
    \ backed by dependency properties, \n\nwhich means they can be binding targets.\
    \ *Command* is almost always the target of a data binding. \n\n*CommandParameter*\
    \ is optional. It’s useful for differentiating between buttons bound to the same\
    \ \n\n*Command* object, and it’s usually treated like a *Tag* property. \n\nPerhaps\
    \ you’ve written a calculator application where you’ve implemented the engine\
    \ as a View \n\nModel that’s set as the *DataContext*. The calculator button for\
    \ the + (plus) command might be \n\ninstantiated in XAML like so: \n\n`<``Button``\
    \ Content``\\=\"+\"`` `\n\n223"
