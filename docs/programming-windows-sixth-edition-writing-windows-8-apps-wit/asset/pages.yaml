  md: "• \n\n&lt; is a left angle bracket (“less than”) \n\n• \n\n&gt; is a right\
    \ angle bracket (“greater than”) \n\nAn alternative to setting the *Text* property\
    \ of *TextBlock* requires separating the element into a start \n\ntag and end\
    \ tag and specifying the text as content: \n\n`<``TextBlock`` … ``\\>`` `\n\n\
    ` Hello, Windows 8! `\n\n`</``TextBlock``\\>`` `\n\nAs I’ll discuss in Chapter\
    \ 2, setting text as content of the *TextBlock* is not exactly equivalent to \n\
    \nsetting the *Text* property. It’s actually much more powerful. But even without\
    \ taking advantage of \n\nadditional features, specifying text as content is useful\
    \ for displaying a larger quantity of text because \n\nyou don’t have to worry\
    \ about extraneous white space as much as when you’re dealing with quoted \n\n\
    text. The *WrappedText* project displays a whole paragraph of text by specifying\
    \ this text as content of \n\nthe *TextBlock*: \n\n**Project: WrappedText | File:\
    \ BlankPage.xaml (excerpt) **\n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``TextBlock`` FontSize``\\\
    =\"48\"`` `\n\n` `` TextWrapping``\\=\"Wrap\">`` `\n\n` For a long time I used\
    \ to go to bed early. Sometimes, when I had put out `\n\n` my candle, my eyes\
    \ would close so quickly that I had not even time to `\n\n` say \"I'm going to\
    \ sleep.\" And half an hour later the thought that it was `\n\n` time to go to\
    \ sleep would awaken me; I would try to put away the book `\n\n` which, I imagined,\
    \ was still in my hands, and to blow out the light; I `\n\n` had been thinking\
    \ all the time, while I was asleep, of what I had just `\n\n` been reading, but\
    \ my thoughts had run into a channel of their own, `\n\n` until I myself seemed\
    \ actually to have become the subject of my book: `\n\n` a church, a quartet,\
    \ the rivalry between François I and Charles V. This `\n\n` impression would persist\
    \ for some moments after I was awake; it did not `\n\n` disturb my mind, but it\
    \ lay like scales upon my eyes and prevented them `\n\n` from registering the\
    \ fact that the candle was no longer burning. Then `\n\n` it would begin to seem\
    \ unintelligible, as the thoughts of a former `\n\n` existence must be to a reincarnate\
    \ spirit; the subject of my book would `\n\n` separate itself from me, leaving\
    \ me free to choose whether I would form `\n\n` part of it or no; and at the same\
    \ time my sight would return and I `\n\n` would be astonished to find myself in\
    \ a state of darkness, pleasant and `\n\n` restful enough for the eyes, and even\
    \ more, perhaps, for my mind, to `\n\n` which it appeared incomprehensible, without\
    \ a cause, a matter dark `\n\n` indeed. `\n\n` ``</``TextBlock``\\>`` `\n\n`</``Grid``\\\
    >`` `\n\nNotice the *TextWrapping* property. The default is the *TextWrapping.NoWrap*\
    \ enumeration member; \n\n*Wrap* is the only alternative. You can also set the\
    \ *TextAlignment* property to members of the \n\n*TextAlignment* enumeration:\
    \ *Left*, *Right*, or *Center*. Although the *TextAlignment* enumeration also\
    \ \n\nincludes a *Justify* member, it is not supported under the current version\
    \ of the Windows Runtime. \n\nYou can run this program in either portrait mode\
    \ or landscape: \n\n29"
