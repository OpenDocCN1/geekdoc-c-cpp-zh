  md: "you can retrieve an item from the dictionary with an indexer: \n\n`FontFamily``\
    \ fntfam = ``this``.Resources\\[``\"fontFamily\"``\\] ``as`` ``FontFamily``; `\n\
    \nNow try this: Comment out the “fontFamily” entry in the BlankPage.xaml file,\
