  md: "` (child ``as`` ``LineJoinRadioButton``).IsChecked = `\n\n` (child ``as`` ``LineJoinRadioButton``).LineJoinTag\
    \ == polyline.StrokeLineJoin; `\n\n` } `\n\n` `\n\n` ``void`` OnStartLineCapRadioButtonChecked(``object``\
    \ sender, ``RoutedEventArgs`` args) `\n\n` { `\n\n` polyline.StrokeStartLineCap\
    \ = (sender ``as`` ``LineCapRadioButton``).LineCapTag; `\n\n` } `\n\n` `\n\n`\
    \ ``void`` OnEndLineCapRadioButtonChecked(``object`` sender, ``RoutedEventArgs``\
    \ args) `\n\n` { `\n\n` polyline.StrokeEndLineCap = (sender ``as`` ``LineCapRadioButton``).LineCapTag;\
    \ `\n\n` } `\n\n` `\n\n` ``void`` OnLineJoinRadioButtonChecked(``object`` sender,\
    \ ``RoutedEventArgs`` args) `\n\n` { `\n\n` polyline.StrokeLineJoin = (sender\
    \ ``as`` ``LineJoinRadioButton``).LineJoinTag; `\n\n` } `\n\n`} `\n\n**Keyboard\
    \ Input and *****TextBox***\n\nKeyboard input in Metro style applications is complicated\
    \ somewhat by the on-screen touch keyboard \n\nthat allows the user to enter text\
    \ by tapping on the screen. Although the touch keyboard is important \n\nfor tablets\
    \ and other devices that don’t have real keyboards attached, it can also be invoked\
    \ as a \n\nsupplement to a real keyboard. \n\nIt is vital that the touch keyboard\
    \ not pop up and disappear in an annoying fashion. For this reason, \n\nmany controls—including\
    \ custom controls—do not automatically receive keyboard input. If they did, \n\
    \nthe system would need to invoke the touch keyboard whenever these controls received\
    \ input focus. \n\nConsequently, if you create a custom control and install event\
    \ handlers for the *KeyUp* and *KeyDown* \n\nevents (or override the *OnKeyUp*\
    \ and *OnKeyDown* methods), you’ll discover that nothing comes \n\nthrough. \n\
    \nIf you are interested in getting keyboard input from the physical keyboard only\
    \ and you don’t care \n\nabout the touch keyboard—perhaps for a program intended\
    \ only for yourself or for testing \n\npurposes—there is a fairly easy way to\
    \ do it. In the constructor of your page, obtain your application’s \n\n*CoreWindow*\
    \ object: \n\n`CoreWindow`` coreWindow = ``Window``.Current.CoreWindow; `\n\n\
    This class is defined in the *Windows.UI.Core* namespace. You can then install\
    \ event handlers on this \n\nobject for *KeyDown* and *KeyUp* (which indicate\
    \ keys on the keyboard) as well as *CharacterReceived* \n\n(which translates keys\
    \ to text characters). \n\nIf you need to create a custom control that obtains\
    \ keyboard input from both the physical keyboard \n\nand the touch keyboard, the\
    \ process is rather more involved. You need to derive a class from \n\n*FrameworkElementAutomationPeer*\
    \ that implements the *ITextProvider* and *IValueProvider* interfaces \n\n194"
  merge: -1
  pgno: 193
- img_proc: true
  md: "and return this class in an override of the *OnCreateAutomationPeer* method\
    \ of your custom control. \n\nObviously this is a nontrivial task, and I’ll provide\
    \ full details in a forthcoming chapter. \n\nMeanwhile, if your program needs\
    \ text input, the best approach is to use one of the controls \n\nspecifically\
    \ provided for this purpose: \n\n• \n\n*TextBox* features single-line or multiline\
    \ input with a uniform font, much like the traditional \n\nWindows Notepad program.\
    \ \n\n• \n\n*RichEditBox* features formatted text, much like the traditional Windows\
    \ WordPad program. \n\n• \n\n*PasswordBox* allows a single line of masked input.\
    \ \n\nI’ll be focusing on *TextBox* in this brief discussion, and I’ll provide\
    \ more examples in the chapters ahead. \n\n*TextBox* defines a *Text* property\
    \ that sets the text in the *TextBox* or obtains the current text. The \n\n*SelectedText*\
    \ property is the text that’s selected (if any), and the *SelectionStart* and\
    \ *SelectionLength* \n\nproperties indicate the offset and length of the selection.\
    \ If *SelectionLength* is 0, *SelectionStart* is the \n\nposition of the cursor.\
    \ Setting the *IsReadOnly* property to *true* inhibits typed input but allows\
    \ text to be \n\nselected and copied to the Clipboard. All cut, copy, and paste\
    \ interaction occurs through context \n\nmenus. The *TextBox* defines both *TextChanged*\
    \ and *SelectionChanged* events. \n\nBy default, a *TextBox* allows only a single\
    \ line of input. Two properties can change that behavior. \n\nNormally the *TextBox*\
    \ ignores the Return key, but setting *AcceptsReturn* to *true* causes the *TextBox*\
    \ to \n\nbegin a new line when Return is pressed. The default setting of the *TextWrapping*\
    \ property is *NoWrap*. \n\nSetting that to *Wrap* causes the *TextBox* to generate\
    \ a new line when the user types beyond the end of \n\nthe current line. These\
    \ properties can be set independently. Either will cause a *TextBox* to grow \n\
    \nvertically as additional lines are added. *TextBox* has a built-in *ScrollViewer*.\
    \ If you don’t want the \n\n*TextBox* to grow indefinitely, set the *MaxLength*\
    \ property. \n\nThere is not one touch keyboard but several, and some are more\
    \ suitable for entering numbers or \n\nemail addresses or URIs. A *TextBox* specifies\
    \ what type of keyboard it wants with the *InputScope* \n\nproperty. With the\
    \ current version of Windows 8, setting this property in XAML is particularly\
    \ clumsy \n\n(involving two layers of property elements), which accounts for much\
    \ of the bulk in the following \n\nXAML file for the TextBoxInputScopes program.\
    \ This program lets you experiment with these different \n\nkeyboard layouts,\
    \ as well as different modes of multiline *TextBox* instances and (as a bonus)\
    \ \n\n*PasswordBox*: \n\n**Project: TextBoxInputScopes | File: BlankPage.xaml\
    \ (excerpt) **\n\n`<``Page`` `\n\n` `` x``:``Class``\\=\"TextBoxInputScopes.BlankPage\"\
    \ ``…`` >`` `\n\n` `\n\n` ``<``Page.Resources``\\>`` `\n\n` ``<``Style`` TargetType``\\\
    =\"TextBlock\">`` `\n\n` ``<``Setter`` Property``\\=\"FontSize\"`` Value``\\=\"\
    24\" />`` `\n\n` ``<``Setter`` Property``\\=\"VerticalAlignment\"`` Value``\\\
    =\"Center\" />`` `\n\n` ``<``Setter`` Property``\\=\"Margin\"`` Value``\\=\"6\"\
    \ />`` `\n\n195"
