    [i\\] == ``'\\\\n'``) `\n\n` { `\n\n` ``if`` (!justFoundEol) `\n\n` line++; `\n\
    \n` `\n\n` col = 0; `\n\n` justFoundEol = ``true``; `\n\n` } `\n\n` ``else`` `\n\
    \n` { `\n\n` col++; `\n\n` justFoundEol = ``false``; `\n\n` } `\n\n` } `\n\n`\
    \ ``return``; `\n\n` } `\n\n` } `\n\n`} `\n\nThe class intercepts the *OnKeyDown*\
    \ method to determine if the Tab key is being pressed. If that’s \n\nthe case,\
    \ it inserts blanks into the *Text* object so that the cursor moves to a text\
    \ column that is an \n\nintegral multiple of the *TabSpaces* property. This calculation\
    \ requires knowing the character position of \n\nthe cursor on the current line.\
    \ To obtain this information, it uses the *GetPositionFromIndex* method also \n\
    \ndefined in this class. This method is public and is also used by XamlCruncher\
    \ to display the current \n\nposition of the cursor and the current selection\
    \ (if any). \n\nAnother property—not backed by a dependency property—is also defined\
    \ by *TabbableTextBox*. This \n\nis *IsModified*, which is set to *true* whenever\
    \ a *KeyDown* event occurs. \n\nLike many programs that deals with documents,\
    \ XamlCruncher keeps track if the text file has \n\nchanged since the last save.\
    \ If the user initiates an operation to create a new file or open an existing\
    \ \n\nfile, and the current document is in a modified state, the program asks\
    \ if the user wants to save that \n\ndocument. \n\nOften this logic occurs entirely\
    \ external to the *TextBox* control. The program sets an *IsModified* flag \n\n\
    to *true* when a new file is loaded or the file is saved and to *false* on receipt\
    \ of a *TextChanged* event. \n\nHowever, the *TextChanged* event is fired when\
    \ the *Text* property of the *TextBox* is set \n\nprogrammatically, so even if\
    \ the *TextBox* is being set to a newly loaded file, the *TextChanged* event is\
    \ \n\n270"
