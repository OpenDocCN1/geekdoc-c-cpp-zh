  md: "because it doesn’t have a generalized applicability. We’ve managed to make\
    \ it this far without \n\nspecifying pixel locations for positioning elements,\
    \ and the only time one is needed is when the \n\nelement is a child of a *Canvas*.\
    \ \n\nFor that reason, *Canvas* itself defines the properties used to position\
    \ elements relative to itself. \n\nThese are a very special type of properties\
    \ known as *attached properties*, and they are a subset of \n\ndependency properties.\
    \ The attached properties defined by one class (*Canvas* in this example) are\
    \ \n\nactually set on instances of other classes (children of the *Canvas*, in\
    \ this case). The objects on which you \n\nset an attached property don’t need\
