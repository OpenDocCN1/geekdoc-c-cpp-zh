  md: "that information, it's generally assumed that video displays have a resolution\
    \ of 96 DPI, so a 96-pixel \n\nfont is thus a 72-point font (one-inch high) and\
    \ the default 11-pixel font is an 8¼-point font. \n\nThe user of Windows has the\
    \ option of setting a desired screen resolution. A Metro style application \n\n\
    can obtain the user setting from the *DisplayProperties* class, which pretty much\
    \ dominates the \n\n*Windows.Graphics.Display* namespace. For most purposes, however,\
    \ assuming a resolution of 96 DPI is \n\nfine, and you’ll use this same assumption\
    \ for the printer. In accordance with this assumption, I tend to \n\nuse pixel\
    \ dimensions that represent simple fractions of inches: 48 (1/2\"), 24 (1/4\"\
    ), 12 (1/8\"), and 6 \n\n(1/16\"). \n\nYou've seen that if you remove the *Foreground*\
    \ attribute, you get white text on a dark background. \n\nThe background is not\
    \ exactly black, but the predefined *ApplicationPageBackgroundBrush* identifier\
    \ \n\nthat the *Grid* references is close to it. \n\nThe Hello project also includes\
    \ two other files that come in a pair: App.xaml and App.xaml.cs \n\ntogether define\
    \ a class named *App* that derives from *Application*. Although an application\
    \ can have \n\nmultiple *Page* derivatives, it has only one *Application* derivative.\
    \ This *App* class is responsible for \n\nsettings or activities that affect the\
    \ application as a whole. \n\nTry this: In the root element of the App.xaml file,\
    \ set the attribute *RequestedTheme* to *Light*. \n\n`<``Application`` `\n\n`\
    \ `` x``:``Class``\\=\"Hello.App\"`` `\n\n` `` xmlns``\\=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    `` `\n\n` `` xmlns``:``x``\\=\"http://schemas.microsoft.com/winfx/2006/xaml\"\
    `` `\n\n` `` xmlns``:``local``\\=\"using:Hello\"`` `\n\n` `` RequestedTheme``\\\
    =\"Light\">`` `\n\n` … `\n\n`</``Application``\\>`` `\n\nThe only options are\
    \ *Light* and *Dark*. Now you get a light background, which means the color \n\
    \nreferenced by the *ApplicationPageBackgroundBrush* identifier is different.\
    \ If the *Foreground* property \n\non the *Page* or *TextBlock* is not explicitly\
    \ set, you’ll also get black text, which means that the \n\n*Foreground* property\
    \ has a different default value with this theme. \n\nIn many of the sample programs\
    \ in the remainder of this book, I'll be using the light theme without \n\nmentioning\
    \ it. I think the screen shots look better on the page, and they won't consume\
    \ as much ink if \n\nyou decide to print pages from the book. However, keep in\
    \ mind that many small devices and an \n\nincreasing number of larger devices\
    \ have displays built around organic light-emitting diode (OLED) \n\ntechnology\
    \ and these displays consume less power if the screen isn't lit up like a billboard.\
    \ Reduced \n\npower consumption is one reason why dark color schemes are becoming\
    \ more popular. \n\nOf course, you can completely specify your own colors by explicitly\
    \ setting both the *Background* of \n\nthe *Grid* and the *Foreground* of the\
    \ *TextBlock*: \n\n`<``Grid`` Background``\\=\"Blue\">`` `\n\n` ``<``TextBlock``\
    \ Text``\\=\"Hello, Windows 8!\"`` `\n\n` `` Foreground``\\=\"Yellow\" `\n\n`\
    \ ``… ``/>`` `\n\n27"
