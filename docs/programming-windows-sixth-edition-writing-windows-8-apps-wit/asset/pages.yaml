  md: "If you need to call asynchronous methods while initializing a *FrameworkElement*\
    \ derivative, do them \n\nin the handler for the *Loaded* event and flag it as\
    \ *async*: \n\n`public`` BlankPage() `\n\n`{ `\n\n` ``this``.InitializeComponent();\
    \ `\n\n` … `\n\n` Loaded += OnLoaded; `\n\n`} `\n\n`async`` ``void`` OnLoaded(``object``\
    \ sender, ``RoutedEventArgs`` arg) `\n\n`{ `\n\n` … `\n\n`} `\n\nOr, if you prefer\
    \ defining the Loaded handler as an anonymous method: \n\n`public`` BlankPage()\
    \ `\n\n`{ `\n\n` ``this``.InitializeComponent(); `\n\n` … `\n\n` Loaded += ``async``\
    \ (sender, args) => `\n\n` { `\n\n` … `\n\n` }; `\n\n`} `\n\nSee the *async* before\
    \ the argument list? \n\n**Calling Your Own *****Async***** Methods **\n\nSuppose\
    \ you want to isolate the file-save logic in a method like this: \n\n`async``\
    \ ``void`` SaveFile(``string`` text) `\n\n`{ `\n\n` ``FileSavePicker`` picker\
    \ = ``new`` ``FileSavePicker``(); `\n\n` picker.DefaultFileExtension = ``\".txt\"\
    ``; `\n\n` picker.FileTypeChoices.Add(``\"Text\"``, ``new`` ``List``<``string``\\\
    > { ``\".txt\"`` }); `\n\n` ``StorageFile`` storageFile = ``await`` picker.PickSaveFileAsync();\
    \ `\n\n` `\n\n` ``if`` (storageFile == ``null``) `\n\n` ``return``; `\n\n` `\n\
    \n` ``await`` ``FileIO``.WriteTextAsync(storageFile, txtbox.Text); `\n\n`} `\n\
    \nThe method must be flagged as *async* because it contains *await* keywords.\
    \ You can then call this \n\nmethod from *OnSaveAsAppBarButtonClick* like so:\
    \ \n\n`void`` OnSaveAsAppBarButtonClick(``object`` sender, ``RoutedEventArgs``\
    \ args) `\n\n`{ `\n\n` SaveFile(txtbox.Text); `\n\n`} `\n\n253"
  merge: -1
  pgno: 252
- img_proc: true
  md: "What happens here is that *OnSaveAsAppBarButtonClick* calls *SaveFile* and\
    \ *SaveFile* begins executing \n\nuntil the first *await* on the *PickSaveFileAsync*\
    \ call. At that point, *SaveFile* returns control back to \n\n*OnSaveAsAppBarButtonClick*\
    \ and that method terminates. When *PickSaveFileAsync* has a result ready, \n\n\
    the rest of the *SaveFile* method proceeds. \n\nIn this particular case, this\
    \ might be OK. However, if you want the *OnSaveAsAppBarButtonClick* \n\nmethod\
    \ to await the execution of *SaveFile*, it must include an *await* keyword and\
    \ be flagged as *async*: \n\n`async`` ``void`` OnSaveAsAppBarButtonClick(``object``\
    \ sender, ``RoutedEventArgs`` args) `\n\n`{ `\n\n` ``await`` SaveFile(txtbox.Text);\
    \ `\n\n`} `\n\nBut when you do that, *SaveFile* must be changed as well. It can\
    \ no longer return void. You can modify \n\n*SaveFile* in several ways, but perhaps\
    \ the easiest is simply changing the return type to *Task*: \n\n`async`` ``Task``\
    \ SaveFile(``string`` text) `\n\n`{ `\n\n` … `\n\n`} `\n\nAt this point, you probably\
    \ also want to change the name of the method to *SaveFileAsync* to indicate \n\
    \nthat it’s an asynchronous method that can be awaited. Although the code that\
    \ you write in this \n\n*SaveFileAsync* method does not run in a secondary thread,\
    \ the other asynchronous methods that \n\n*SaveFileAsync* calls do so. \n\nA similar\
    \ separation of *OnOpenAppBarButtonClick* and a *ReadFileAsync* method is a little\
    \ different. \n\nYou probably want the *ReadFileAsync* method to return the text\
    \ contents of the file, so the return type \n\nisn’t *Task* but *Task<string>*:\
    \ \n\n`async`` ``Task``<``string``\\> ReadFileAsync() `\n\n`{ `\n\n` ``FileOpenPicker``\
    \ picker = ``new`` ``FileOpenPicker``(); `\n\n` picker.FileTypeFilter.Add(``\"\
    .txt\"``); `\n\n` ``StorageFile`` storageFile = ``await`` picker.PickSingleFileAsync();\
    \ `\n\n` `\n\n` ``if`` (storageFile == ``null``) `\n\n` ``return`` ``null``; `\n\
    \n` `\n\n` ``return`` ``await`` ``FileIO``.ReadTextAsync(storageFile); `\n\n`}\
    \ `\n\nYou can then call *ReadFileAsync* like so: \n\n`async`` ``void`` OnOpenAppBarButtonClick(``object``\
    \ sender, ``RoutedEventArgs`` args) `\n\n`{ `\n\n` ``string`` text = ``await``\
    \ ReadFileAsync(); `\n\n` `\n\n` ``if`` (text != ``null``) `\n\n` txtbox.Text\
    \ = text; `\n\n`} `\n\n254"
  merge: -1
