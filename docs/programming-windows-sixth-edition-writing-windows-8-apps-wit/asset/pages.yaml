  md: "The markup for the second *Slider* sets the *StepFrequency* property to 0.01\
    \ and also sets \n\n*IsDirectionReversed* to *true* so that the minimum value\
    \ of 0 occurs when the thumb is positioned to the \n\nfar right. It’s rather rare\
    \ to set *IsDirectionReversed* to *true* for horizontal sliders but more common\
    \ for \n\nvertical sliders. The default vertical slider has a minimum value when\
    \ the slider is all the way down, and \n\nfor some purposes that should be a maximum\
    \ value. \n\nFor that second *Slider*, however, the keyboard arrow keys change\
    \ the value in increments of 1 rather \n\nthan the *StepFrequency* of 0.01. The\
    \ keyboard interface is governed by the *SmallChange* property, \n\nwhich by default\
    \ is 1. \n\nThe third *Slider* has a range from –1 to 1. When the *Slider* is\
    \ first displayed, the thumb is in the \n\ncenter at the default *Value* of 0.\
    \ I’ve set both *StepFrequency* and *SmallChange* to 0.01, and \n\n*LargeChange*\
    \ to 0.1, but I’ve found no way to trigger the *LargeChange* jump with either\
    \ the mouse or \n\nkeyboard. \n\nThe *Slider* class defines *TickFrequency* and\
    \ *TickPlacement* properties to display tick marks adjacent to \n\nthe *Slider*,\
    \ but it is my experience that with the current release of Windows 8, these tick\
    \ marks are \n\nbarely visible. Something is wrong with the way they’re handling\
    \ color. \n\nIf the *Background* and *Foreground* properties of the *Slider* are\
    \ set, the *Slider* uses *Foreground* for the \n\nslider area associated with\
    \ the minimum value and *Background* for the area associated with the \n\nmaximum\
    \ value, but it switches to default colors when the *Slider* is being manipulated\
    \ or when the \n\nmouse hovers overhead. \n\nAs we begin creating more *Slider*\
    \ controls, it becomes necessary to find a better way to lay them out \n\non the\
    \ page. It’s time to get familiar with the *Grid*. \n\n**The Grid **\n\nThe *Grid*\
    \ probably seems like a familiar friend at this point because it’s been in almost\
    \ every program in \n\nthis book, but obviously we haven't gotten to know it in\
    \ any depth. Many of the programs in the \n\nremainder of this book will use the\
    \ *Grid* not in its single-cell mode but with actual rows and columns. \n\nThe\
    \ *Grid* has a superficial resemblance to the HTML *table*, but it’s quite different.\
    \ The *Grid* doesn’t \n\nhave any facility to define borders or margins for individual\
    \ cells. It is strictly for layout purposes. Any \n\nsprucing up for presentation\
    \ must occur on the parent or children elements. For example, the *Grid* can \n\
    \nbe in a *Border*, and *Border* elements can adorn the contents of the individual\
    \ *Grid* cells. \n\nThe number of rows and columns in a *Grid* must be explicitly\
    \ indicated; the *Grid* cannot determine \n\nthis information by the number of\
    \ children. Children of the *Grid* generally go in a particular cell, which \n\
    \nis an intersection of a row and column, but children can also span multiple\
    \ rows and columns. \n\nAlthough the numbers of rows and columns can be changed\
    \ programmatically at run time, it’s not \n\noften done. Most common is to fix\
    \ the number of desired rows and columns in the XAML file. This is \n\n156"
