  md: "Debug menu. You’ll notice that the program hasn’t merely been executed, but\
    \ has actually been \n\ndeployed to Windows 8 and is now executable from the start\
    \ screen. The icon is not very pretty, but \n\nthe program’s icons are all stored\
    \ in the Assets directory of the project so you can spruce them up if \n\nyou\
    \ want. You can run the program again outside of the Visual Studio debugger right\
    \ from the \n\nWindows 8 start screen. \n\n**Graphical Greetings **\n\nTraditional\
    \ \"hello\" programs display a greeting in text, but that's not the only way to\
    \ do it. The \n\nHelloImage project accesses a bitmap from my website using a\
    \ tiny piece of XAML: \n\n**Project: HelloImage | File: BlankPage.xaml (excerpt)\
    \ **\n\n`<``Grid`` Background``\\=\"{``StaticResource`` ApplicationPageBackgroundBrush``}\"\
    >`` `\n\n` ``<``Image`` Source``\\=\"http://www.charlespetzold.com/pw6/PetzoldJersey.jpg\"\
    \ />`` `\n\n`</``Grid``\\>`` `\n\nThe *Image* element is defined in *Windows.UI.Xaml.Controls*\
    \ namespace, and it’s the standard way to \n\ndisplay bitmaps in a Windows Runtime\
    \ program. By default, the bitmap is stretched to fit the space \n\navailable\
    \ for it while respecting the original aspect ratio: \n\n \n\nIf you make the\
    \ page smaller—perhaps by changing the orientation or invoking a snap view—the\
    \ \n\nimage will change size to accommodate the new size of the page. \n\nYou\
    \ can override the default display of this bitmap by using the *Stretch* property\
    \ defined by *Image*. \n\nThe default value is the enumeration member *Stretch.Uniform*.\
    \ Try setting it to *Fill*: \n\n`<``Grid`` Background``\\=\"{``StaticResource``\
    \ ApplicationPageBackgroundBrush``}\">`` `\n\n` ``<``Image`` Source``\\=\"http://www.charlespetzold.com/pw6/PetzoldJersey.jpg\"\
    `` `\n\n![](img/bc006cce5c2364a011861f29233d37ef_20_0.png)\n\n21"
