  md: "static page of this book: \n\n \n\nYou might wonder: Isn’t it inefficient to\
    \ change the *FontSize* property of the *TextBlock* at the frame \n\nrate of the\
    \ video display? Wouldn’t it make more sense to set a *SizeChanged* handler for\
    \ the *Page* and \n\ndo it then? \n\nPerhaps a little. But it is another feature\
    \ of dependency properties that the object doesn’t register a \n\nchange unless\
    \ the property really changes. If the property is being set to the value it already\
    \ is, nothing \n\nhappens, as you can verify by attaching a *SizeChanged* handler\
    \ on the *TextBlock* itself. \n\n \n\n \n\n![](img/bc006cce5c2364a011861f29233d37ef_104_0.png)\n\
    \n105"
