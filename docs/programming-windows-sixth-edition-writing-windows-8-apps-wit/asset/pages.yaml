    \ LineJoinTag { ``set``; ``get``; } `\n\n` } `\n\n`} `\n\nLet me show you just\
    \ a little piece of the XAML (the last group of three *RadioButton* controls)\
    \ to \n\ndemonstrate how the property-element syntax has been eliminated: \n\n\
    **Project: LineCapsAndJoinsWithCustomClass | File: BlankPage.xaml (excerpt) **\n\
    \n`<``StackPanel`` Name``\\=\"lineJoinPanel\"`` `\n\n` `` Grid.Row``\\=\"1\"``\
