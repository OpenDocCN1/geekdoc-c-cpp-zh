  md: '# Section 12.8


    # Container Overview 169


    The containers are defined in namespace std and presented in headers <vector>,
    <list>, <map>, etc. (\$9.4). In addition, the standard library provides container
    adapters queue<T>, stack<T>, and priority_queue<T>. Look them up if you need them.
    The standard library also provides more specialized container-like types, such
    as array<T,N> (§15.3.1) and bitset<N> (§15.3.2).


    The standard containers and their basic operations are designed to be similar
    from a nominal point of view. Furthermore, the mechanisms of the operations are
    efficient for the various containers. Basic operations apply every kind of container
    for which they make sense and can be efficiently implemented:


    # Standard Container Operations (partial)


    | value_type | The type of an element |

    | --- | --- |

    | p=c.begin() | p points to first element of c; cbegin() for an iterator to const
    |

    | p=c.end() | p points to one-pass-the-last element of c; |

    | | also cend() for an iterator to const |

    | k=c.size() | k is the number of elements in c |

    | c.empty() | Is c empty? |

    | k=c.capacity() | k is the number of elements c can hold without new allocation
    |

    | c.reserve(k) | Increase the capacity to k; if k<c.capacity(), reserve(k) does
    nothing |

    | c.resize(k) | Make the number of elements k; |

    | | added elements have default value value_type |

    | c[k] | The kth element of c; zero-based; no guaranteed checking |

    | c.at(k) | The kth element of c; if out of range, throw out_of_range |

    | c.push_back(x) | Add x to the end of c; increase the size of c by one |

    | c.emplace_back(a) | Add value_type(a) at the end of c; increase the size of
    c by one |

    | q.insert(p,x) | Add x before p in c |

    | q.erase(p) | Remove element at p from c |

    | c2=c | Assignment: copy all elements from c to c2 if c==c2 |

    | b=(c==c2) | Equality of all elements of c and c2; true if equal |

    | x=(c<=c2) | Lexicographical order of c and c2: |

    | | x<0 if c is less than c2, x=0 if equal, and x>0 if greater than. |

    | | <=, <, >, >= are generated from <= |


    This notational uniformity provides new container types that the ranged-vector,
    Vector can be used in a very similar manner to the standard. (\$4.3, Chapter 5),
    is an example of that. The uniformity of container interfaces allows us to specify
    algorithms independently of individual container types. However, each has strengths
    and weaknesses. For example, subscript and traversing a vector is much faster
    than a list. On the other hand, vector elements are moved to different locations
    when we insert or remove elements; list has exactly the opposite properties. Please
    note that a vector is usually more efficient than a list for short sequences of
    small elements (using insert and erase). I recommend the standard-library vector
    as the default type for sequences of elements unless you need a reason to choose
    another.


    Consider the singly-linked list, forward_list, a container optimized for the empty
    sequence (\$12.3). An empty forward_list occupies one word, whereas any vector
    occupies three. Empty sequences, and sequences with only one element or two, are
    surprisingly common and useful.'
