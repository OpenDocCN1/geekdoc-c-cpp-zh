  md: "# Section 1.2.1 Hello, World! 3\n\nTypically, a program produces some output.\
    \ Here is a program that writes Hello, World!\n\n```\nimport std;\n\nint main()\n\
    {\n    std::cout << \"Hello, World!\";\n}\n```\n\nThe line import std; instructs\
    \ the compiler to make the declarations of the standard library available. Without\
    \ these declarations, the expression\n\n```\nstd::cout << \"Hello, World!\";\n\
    ```\n\nwould make sense. The operator << (\"put to\") writes its second argument\
    \ onto its first. In this case, the string literal \"Hello, World!\" is written\
    \ onto the output stream std::cout. A string literal is a sequence of characters\
    \ surrounded by double quotes. The backslash \\ followed by another character\
    \ denotes a single \"special character.\" In this case, \\n is the newline character,\
    \ followed by the characters are written Hello, World! followed by a newline.\n\
    \nThe std; specifies that the name cout is to be found in the standard-library\
    \ namespace (§3.3). I usually leave out the std:: when using standard features;\
    \ §3.3 shows how to make names from a namespace visible without explicit qualification.\n\
    \nThe import directive is used in C++20 and presenting all of the standard library\
    \ as a module std is not yet standard. This will be explained in §3.2.2. If you\
    \ have trouble with import std;, try the old-fashioned and conventional\n\n```\n\
    #include <iostream>\n// include the declarations for the I/O stream library\n\n\
    int main()\n{\n    std::cout << \"Hello, World!\";\n}\n```\n\nThis will be explained\
    \ in §3.2.1 and has worked on all C++ implementations since 1998 (§19.1.1). main().\
    \ For example:\n\n| import std; | // include the declarations for the standard\
    \ library |\n| using namespace std; | // make names from std visible without std::\
    \ (§3.3) |\n| double square(double x) { // square a double-precision floating-point\
    \ number |\n\n```\nvoid print_square(double x)\n{\n    std::cout << \"the square\
    \ of \" << x << \" is \" << square(x) << \"\\n\";\n}\n```"
