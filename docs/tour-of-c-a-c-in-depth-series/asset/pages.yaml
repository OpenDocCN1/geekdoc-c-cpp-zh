  md: "# 7.3.3.1 Lamdas as function arguments\n\nUsing lambdas can be convenient and\
    \ true, but also obscure. For nontrivial actions (say, more than a simple expression),\
    \ I prefer to name the operation so as to more clearly state its purpose and to\
    \ make it available for use in several places in a program.\n\nIn 5.5.3, the annoying\
    \ of having a function to perform operations on elements of vectors and unique\\\
    _ptrs, such as draw\\_all() and rotate\\_all(). Function objects (in particular,\
    \ lambdas) can help by allowing us to separate the traversal of the container\
    \ with the specification of what is to be done with each element.\n\nFirst, we\
    \ need a function that applies an operation to each object pointed by the elements\
    \ of a container of pointers:\n\n```\ntemplate<typename C, typename Op>\nvoid\
    \ for_each(C& c, Op op) // assume that C is a container of pointers (see also\
    \ $8.2.1)\n{\n    for (auto& x : c) // pass op to a reference to each element\
    \ pointed to\n        op(x);\n}\n```\n\nThis is a simplified version of the standard-library\
    \ for_each algorithm ($13.5). Now we can create a version of user() from 5.5 without\
    \ writing a set of all functions:\n\n```\nvoid user()\n{\n    vector<unique_ptr<Shape>>\
    \ v;\n    while (cin) {\n        v.push_back(shape(cin));\n        for_each(v,[unique_ptr<Shape>&\
    \ ps] { ps->draw(); }); // draw_all()\n        for_each(v,[unique_ptr<Shape>&\
    \ ps] { ps->rotate(45); }); // rotate_all(45)\n    }\n}\n```\n\nI pass the unique\\\
    _ptr<S> to the lambdas by reference. That way for\\_each() doesn't have to deal\
    \ with lifetime issues.\n\nLike a function, a lambda can be generic. For example:\n\
    \n```\ntemplate<class S>\nvoid rotate_and_draw(vector<S>& v, int r)\n{\n    for_each(v,[auto&\
    \ s] { s->rotate(r); s->draw(); });\n}\n```\n\nHere, in variable declarations,\
    \ auto means that a value of any type is accepted as an initializer (an argument)\
    \ is considered to initialize the formal parameter in call. This makes a lambda\
    \ with an auto parameter a template, a generic lambda. When needed, we can constrain\
    \ the parameter with a concept ($8.2). For example, we define Pointer\\_to\\_class\
    \ to require * and -> to write:\n\n```\nfor_each(v,[Pointer_to_class auto& s]\
    \ { s->rotate(r); s->draw(); });\n```\n\nWe can call this generic rotate\\_and\\\
    _draw() with any container of objects that you can draw() and rotate(). For example:"
