  md: "To launch tasks to potentially run asynchronously, we can use async():\n\n\
    ```\ndouble comp4(vector<double>& v)\n// spawn many tasks if v is large enough\n\
    ```\n\n```\n{\n    if (v.size()<10000)\n        return accum(v.begin(),v.end(),0.0);\n\
    \n    auto v0 = &v[0];\n    auto sz = v.size();\n\n    auto f0 = async(accum,v0,v0+sz/4,0.0);\n\
    \    auto f1 = async(accum,v0+sz/4,v0+sz/2,0.0);\n    auto f2 = async(accum,v0+sz/2,v0+3*sz/4,0.0);\n\
    \    auto f3 = async(accum,v0+3*sz/4,v,0.0);\n\n    return f0.get()+f1.get()+f2.get()+f3.get();\n\
    }\n```\n\nBasically, async() represents the \"call part\" of a function call from\
    \ the \"get result\" and separates from the actual execution of the task. Instead,\
    \ you don't have to think in terms of tasks that potentially compute their results\
    \ asynchronously. There is an obvious benefit: don't have to think async() for\
    \ tasks that need resources loading. With async() you don't know how many threads\
    \ will be used because that's up to async() to decide on what you think about\
    \ the system resources available at the time of a call. For example, async() may\
    \ check whether any idle cores (processors) are available before deciding how\
    \ many threads to use.\n\nUsing a guess about the cost of computation relative\
    \ to the cost of launching a thread, such as v.size()<10,000, is very primitive\
    \ and prone to get mistakes about performance. However, this is not the place\
