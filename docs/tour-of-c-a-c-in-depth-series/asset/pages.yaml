  md: "# Section 15.2.1 unique_ptr and shared_ptr 197\n\n# 15.2.1 unique_ptr\n\nOne\
    \ of the key tasks of any nontrivial program is to manage resources. A resource\
    \ is something that must be acquired and later (explicitly or implicitly) released.\
    \ Examples are memory, sockets, thread handles, and file handles. For a long-running\
    \ program, failing to release a resource in a timely manner (“a leak”) can cause\
    \ serious performance degradation (§12.7) and possibly a miserable crash. Even\
    \ for short programs, a leak can become an embarrassment, by causing a resource\
    \ shortage increasing the run time by orders of magnitude.\n\nThe standard-library\
    \ components are designed to lock resources. To do this, they rely on the basic\
    \ language support constructor/destructor to ensure that a resource does not outline\
    \ an owner responsible for it. The use of a constructor/destructor pair in Vector\
    \ to manage the lifetime of its elements is an example (§5.22) and all standard-library\
    \ components are implemented in similar ways. This approach interacts correctly\
    \ with error handling exceptions. For example, this technique is used for the\
    \ standard-library lock classes:\n\n+   * mutex; // used to protect access to\
    \ shared data\n\n```\nvoid f() {\n    scoped_lock lck(m); // acquire the mutex\n\
    \    // ... manipulate shared data ...\n}\n```\n\nA thread will not proceed until\
    \ lock’s constructor has acquired the mutex (§18.3). The corresponding destructor\
    \ releases the mutex. So, in this, scoped_lock’s destructor releases the mutex\
    \ when the thread of control leaves f(j) (through a return, by “falling off the\
    \ end of the function,” or through an exception throw).\n\nThis is an application\
    \ of RAIIthe “Resource Acquisition Is Initialization” technique; §5.2.2). Containers\
    \ (such as vector and map, string, and lostream) manage their resources (such\
    \ as file handles and buffers) similarly. The examples so far take care of objects\
    \ defined in a scope, but what about objects allocated on the free store? The\
    \ standard library provides two “smart pointers” to manage objects on the free:\n\
    \n+   * unique_ptr represents unique ownership (the destructor destroys its object)\n\
    * shared_ptr represents shared ownership (the last pointer’s destructor destroys\
    \ the object)\n\nThe most basic use of these “smart pointers” is to prevent memory\
    \ leaks caused by careless programming. For example:\n\n```\nvoid f(int i, int\
    \ j) // X vs. unique_ptr<X>\n    X* p = new X;\n    unique_ptr<X> sp(new X); //\
    \ allocate a new X and give its pointer to unique_ptr\n    //\n```"
