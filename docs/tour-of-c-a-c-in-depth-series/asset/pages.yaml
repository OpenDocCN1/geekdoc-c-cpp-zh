  md: "# 12.2 vector\n\nThe most useful standard-library container is vector. A vector\
    \ is a sequence of elements of a given type. The elements are stored contiguously\
    \ in memory. A typical implementation of vector (§5.2.2, §6.2) will consist of\
    \ a handle holding pointers to the first element, one-pass-the-last element, and\
    \ one-pass-the-last allocated space (§13.1) (or the equivalent information represented\
    \ as a pointer plus offsets):\n\n![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_170_0.png)\n\
    \nIn addition, it holds an allocator (here, alloc), from which the vector can\
    \ acquire memory for its elements. The default allocator uses new and delete to\
    \ acquire and release memory (§12.7). Using a slightly advanced technique, we\
    \ can avoid any data for simple allocators in a vector object.\n\nWe initialize\
    \ a vector with one of its element type:\n\n```\nvector<Entry> phone_book {\n\
    \  (\"David Hume\",123456),\n  (\"Karl Popper\",234567),\n  (\"Bertrand Arthur\
    \ William Russell\",345678)\n}\n```\n\nElements can be accessed through subscribing.\
    \ So, assuming that we have defined << for Entry, we can write:\n\n```\nvoid print_book(const\
    \ vector<Entry>& book)\n{\n  for (int i = 0; i!=book.size(); ++i) \n    cout <<\
    \ book[i] << '\\n';\n  }\n```\n\nAs usual, starting at 0 so that book[0] holds\
    \ the entry for David Hume. The vector function size(0) gives the number of elements.\n\
    The elements of a vector constitute a range, so we can use a range-for loop (§1.7):\n\
    \n```\nvoid print_book(const vector<Entry>& book)\n{\n  for (const auto &x : book)\
    \ \n    cout << x << ' \"auto\" see §1.4';\n  }\n```\n\nWhen we define a vector,\
    \ we give it an initial size (initial number of elements):"
