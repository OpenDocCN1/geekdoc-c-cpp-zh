    # 16.2 Time


    In <chrono>, the standard library provides facilities for dealing with time:


    +   - Clocks, time_point, and duration for measuring how long some action takes,
    and as the base for anything to do with time.

    - day, month, year, and weekdays for mapping time_points into your everyday lives.

    - time_zone and zoned time to deal with differences in time reporting across the
    globe.


    Essentially every major system deals with some of these entities.


    # 16.2.1 Clocks


    Here is the basic usage of some action:


    ```

