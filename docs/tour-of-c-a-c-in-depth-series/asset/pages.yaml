  md: "250 Concurrency Chapter 18\n\n# 18.6 Coroutines\n\nA coroutine is a function\
    \ that maintains its state between calls. In that, it's bit like a function object,\
    \ but the saving and restoring of its state between calls are implicit and complete.\
    \ Consider a classic example:\n\n```\ngenerator<long long> fib() { // generate\
    \ Fibonacci numbers\n    long long a = 0;\n    long b = 1;\n    while (a<b) {\n\
    \        auto next = a+b;\n        co_yield next; // save state, return value,\
    \ and wait\n        a = b;\n        b = next;\n    }\n    co_return 0;\n} // a\
    \ fib too far\n```\n\n```\nvoid user(int max) {\n    for (int i=0; i<max; i++)\
    \ {\n        cout << fib(i) << ' '\n    }\n}\n```\n\nThis generates\n\n+   1 2\
    \ 3 5 8 13 ...\n\nThe generator return value is where the coroutine stores its\
    \ state between calls. We could, have a function object Fib that worked the same\
    \ way, but then we would have had to maintain its state ourselves. For larger\
    \ states and more complex computations, saving and restoring state get tedious,\
    \ hard to optimize, and error-prone. In effect, a coroutine is a function that\
    \ saves its stackframe between calls. The co_yield returns a value and waits for\
    \ the next call. The co_return returns a value and completes the coroutine.\n\n\
    Coroutines can be synchronous (the caller waits for the result) or asynchronous\
    \ (the caller does some other work until it waits for the result from the coroutine).\
    \ The Fibonacci example was obviously synchronous. This allows some optimizations.\
    \ A good optimizer can inline the calls to fib() and unfold the loop, leaving\
    \ a sequence of calls of <<, which themselves can be optimized\n\n```\ncout <<\
    \ \"1 2 3 5 7 12\"; // fib(6)\n```\n\nThe coroutines are implemented as an extremely\
    \ flexible framework to serve an extreme range of potential uses. It is designed\
    \ by and for experts with a touch of design by committee. That's fine except that\
    \ the library facilities to make simple uses simple are still missing in C++20.\
    \ For example, generator is not (yet) part of the standard library. There are\
    \ proposals, though, and a Web search will find you good implementations; [Cppcoro]\
    \ is an example."
