  md: "# Section 5.2.1\n\n# An Arithmetic Type 57\n\nUser-defined operators (“overloaded\
    \ operators”) should be used cautiously and conventionally (§6.4). The syntax\
    \ is fixed by the language, so you can't define a unary l. Also, it is not possible\
    \ to change the meaning of an operator for built-in types, so you can't redefine\
    \ + to subtract ints.\n\n# 5.2.2 A Container\n\nA container is an object holding\
    \ a collection of elements. We call class a container because objects of type\
    \ Vector are containers. As defined in §2.3, Vector unreasonable of double: it\
    \ is simple to understand, establishes a useful interface (§4.3), provides range-checked\
    \ access (§4.2), provides size to iterate over its elements. However, it has a\
    \ fatal flaw: it allocates using new but never deallocates them. That's not a\
    \ good idea because C++ does not offer a collector to make unused memory for new\
    \ objects. In some environments you can use a collector, and you need more precise\
    \ control of deconstruction for logical or performance reasons. We need a mechanism\
    \ to ensure the memory allocated by the constructor is deallocated; that mechanism\
    \ is a destructor:\n\n```\nclass Vector {\npublic:\n  Vector(int s):elem(new double[s]),\
    \ sz(s) // constructor: acquire resources\n  {\n    for (int i=0; i<s; ++i) //\
    \ initialize elements\n      elem[i]=0;\n  }\n\n  ~Vector() { delete elem; } //\
    \ destructor: release resources\n\n  double& operator[](int i);\n  int size()\
    \ const;\nprivate:\n  double*elem; // elem points to an array of sz elements\n\
    \  int sz;\n};\n```\n\nThe name of the destructor is the complement operator,\
    \ ~, followed by the name of the class; it is the complement of a constructor.\n\
    Vector constructor allocates some memory on the free store (also the heap and\
    \ dynamic memory) using the new operator. The destructor cleans up by freeing\
    \ memory using the delete[] operator. Plain delete deletes an individual object;\
    \ delete[] deletes an array.\nThis is all done without intervention by users of\
    \ Vector. The users simply create and use Vectors as much as their variables of\
    \ built-in types. For example:\n\n```\nVector gv(10); // global variable\n```\n\
    \n```\nVector* gp = new Vector(100); // Vector on free store; never implicitly\
    \ destroyed\n```"
