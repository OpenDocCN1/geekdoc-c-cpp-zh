    The two objects are independent. We can change the value of y without affecting
    the value of x. For example, x=99 will not change the value of y. Unlike Java,
    C#, and other languages, but like C, that is true for all types, not just ints.

    If we want different objects to refer to the same (shared) value, we must say
    so. For example:


    ```

    int x = 2;

    int y = 3;

    int p = &x;

    int q = &y;

    Il p=q and *p==*q

    Il p becomes &y; now p==q, so (obviously)*p==*q

    ```


    We can represent graphically this:


    ![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_29_2.png)


    I arbitrarily chose 88 and 92 as the addresses of the ints. Again, we can see
    that the assigned-to object gets the value from the assigned object, yielding
    two independent objects (here, pointers).'
