    \ 2 != 0; }, 3})\n  cout << x << ' '';\n```\n\nSuch nesting of views can quickly\
    \ get a bit cryptic; there is an alternative: pipelines (§14.4).\nThe standard\
    \ library offers many views, also known as range adapters:\n\n| Standard-library\
    \ views (range adaptors) <ranges> |\n| v is a view; r is range; p is a predicate;\
    \ n is an integer |\n| v=all_view{r} | v is elements of r |\n| v=filter_view{r,p}\
