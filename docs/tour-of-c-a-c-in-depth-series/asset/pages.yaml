  md: "# Classes Chapter 5\n\n# 5.3 Abstract Types\n\nTypes using complex and Vector\
    \ are called concrete types because their representation is part of their definition.\
    \ In that, they resemble built-in types. In contrast, an abstract type is a type\
    \ that completely usures implementation details. To do that, we decouple the interface\
    \ from the representation and give genuine local variables. Since we don't know\
    \ anything about the representation of an abstract type (not even its size), we\
    \ must allocate objects on the free store (§5.2.2) and access them through references\
    \ or pointers (§1.7, §15.2.1).\n\nFirst, we define the interface of class Container\
    \ which we will design an abstract version of our Vector:\n\n```\nclass Container\
    \ {\npublic:\n    virtual double& operator[](int) = 0;\n    virtual int size()\
    \ const = 0;\n    virtual ~Container() {}\n};\n```\n\nThis class is a pure interface\
    \ to specifies defined later. The word virtual means \"may be redefined later\
    \ in a class derived from this.\\ Unluckily, the declared virtual is called a\
    \ virtual function. A class derived from Container provides an implementation\
    \ for the Container. The curious =0 says the function is pure virtual; so some\
    \ class from Container must define the function. Thus, it is not possible to define\
    \ an object that is just a Container. For example:\n\n```\nContainer c;\nContainer*\
    \ p = new Vector_container(10);\n```\n\nA Container can only serve as the interface\
    \ to a class that implements its operator[] and size() functions. A class with\
    \ a pure virtual function is called an abstract class.\n\nThis Container can be\
    \ used like this:\n\n```\nvoid use(Container& c)\n{\n    int sz = c.size();\n\
    \    for (int i=0; i<sz; ++i)\n        cout << c[i] << \" \";\n}\n```\n\nNote\
    \ use the Container interface in complete ignorance of implementation details.\
    \ It uses size() and [] without any idea of exactly which types provide their\
    \ implementation. A class that provides the interface to a variety of other classes\
    \ is often a polymorphic type.\nAs common for abstract classes, Container does\
    \ not have a constructor. After all, it does not have to initialize data. On the\
    \ other hand, Container does have a destructor and destructor is virtual, so classes\
    \ derived from Container can provide implementations. Again, that is common for\
    \ abstract classes because they tend be manipulated through references or pointers,\
    \ and someone destroying a Container through a pointer has no what resources are\
    \ owned by its implementation; see also §5.5."
