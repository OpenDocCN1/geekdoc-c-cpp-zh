    \ always), the opposite is true.\n\n# 19.3.2.2 void*\n\nIn C, a void* may be used\
    \ as the right-hand operand of an assignment or initialization of any pointer\
    \ type; in C++ it may not. For example:\n\n```\nvoid f(int n)\n{\n    int* p =\
    \ malloc(sizeof(int)); I* not C++; in C++, allocate \"new\" *\n    // ...\n}\n\
    ```\n\nThis is probably the single most difficult incompatibility to deal with.\
    \ Note that the version of a void* to a different pointer type is not in general\
    \ harmless"
