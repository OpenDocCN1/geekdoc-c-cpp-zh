    Chapter 15


    # Containers


    | T[N] | Built-in array: a fixed-size contiguously allocated sequence of N elements
    of T; implicitly converts to a T* |

    | array<T,N> | A fixed-size contiguously allocated sequence of N elements of type
    T; like the built-in array, but with more problems solved |

    | bitset<N> | A fixed-size sequence of N bits |

    | vector<bool> | A sequence of bits compactly stored in a specialization of vector
    |

    | pair<T,U> | Two elements of types T and U |

    | tuple<T...> | A sequence of arbitrary number of elements of arbitrary types
    |

    | basic_string<C> valarray<T> | An array of numeric types of T; provides numerical
    operations


    Why does the standard provide so many containers? They serve some purpose (often
    needed). If the standard didn''t provide them, people would have to design and
    implement them. For example:


    +   * pair and tuple are heterogeneous; all other containers are homogeneous (all
    elements are of the same type).

    * array, and tuple elements are contiguously allocated; list and map are linked
    structures.

    * bitset and vector<bool> hold bits and access them through proxy objects; all
    standard libraries hold a variety of types and access elements directly.

    * string requires its elements to be some form of character and provide string
    manipulation, such as concatenation and locale-sensitive operations.

    * valarray requires its elements to be numbers and provide numerical operations.


    All of these containers can be seen as providing specialized services by large
    communities of programmers. No single container could serve all of these because
    some needs are contrary, for example, “ability to grow” vs. “guaranteed to be
    allocated in a fixed location,” and “elements do not move when elements are added”
    vs. “contiguously allocated.”


