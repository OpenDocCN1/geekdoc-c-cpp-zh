  md: '# Section A.4


    # Make Your Own module std


    ```

    module:

    #include <iostream>

    #include<string>

    #include<vector>

    #include<list>

    #include<memory>

    #include<algorithms>

    // ...

    ```


    ```

    export module std;

    export istream;

    export iostream;

    // ...

    ```


    There is a shortcut:


    ```

    export module std;

    ```


    ```

    export import "iostream";

    export import "string";

    export import "vector";

    export import "list";

    export import "memory";

    export import "algorithms";

    // ...

    ```


    The construct


    ```

    import "iostream";

    ```


    Importing a header unit is a half-way house between modules and header files.
    It takes a header file and makes it look like a module, but it can also inject
    names into the global-space (like #include) and it leaks macros.

    This is not quite as slow to compile as #include but not as fast as a properly
    named module.


    # A.5 Advice


    +   [1] Prefer modules provided by an implementation; §A.2.

    [2] Use modules; §A.3.

    [3] Prefer named modules over header units; §A.4.

    [4] To use the macros and global names from the C standard, import std.compat;
    §A.1.

    [5] Avoid macros; §A.1. [CG: ES.30] [CG: ES.31].'
