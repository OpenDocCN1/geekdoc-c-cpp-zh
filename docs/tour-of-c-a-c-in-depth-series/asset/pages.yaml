  md: "# 14\n\n# # Ranges\n\n> The strongest arguments prove nothing so long as the\
    \ conclusions are not verified by experience. – Roger Bacon\n\n+   - Introduction\n\
    - Views\n- Generators\n- Pipelines\n- Concepts Overview\n  - Type Concepts; Iterator\
    \ Concepts; Range Concepts\n- Advice\n\n# ## 14.1 Introduction\n\nThe standard-library\
    \ offers both constrained using concepts (Chapter 8) and unstructured (for compatibility).\
    \ The constrained (concept) versions are in `<ranges>` ranges. Naturally, I prefer\
    \ using concepts. A range is a generalization of the C++98 sequences defined by\
    \ `[begin(), end())` pairs; it specifies what it takes to be a sequence of elements.\
    \ A range\n\nA can be defined by\n\n+   - (begin, end) pair of iterators\n- (begin,\
    \ n) pair, where begin is an iterator and n is the number of elements\n- (begin,\
    \ pred) pair, where begin is an iterator and pred is a predicate; if pred(p) is\
    \ true for the iterator p, we reached the end of the range. This allows us to\
    \ have infinite ranges and ranges that are generated “on the fly” (§14.3)\n\n\
    This range concept is what allows us to say `sort(v)` rather than `sort(v.begin(),\
    \ v.end())` as we had to using the STL since 1994. We can do similarly for our\
    \ own algorithms:"
