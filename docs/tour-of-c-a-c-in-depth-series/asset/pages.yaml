    \ bool operator()(const T& x) const { return x<val; } // call operator\n};\n```\n\
    \nThe function called operator() implements the application operator, (), also\
    \ called \"function call\" or just \"call.\",\n\nWe define many names of type\
    \ Less_than for some argument type:\n\n+   - Less_than Iti(42); // Iti will compare\
    \ i to 42 using <i<42\n- Less_than Its(\"Backus\"); // Its(s) will compare s to\
    \ \"Backus\" < (s<\"Backus)\n- Less_than-string(\"Naur\"); // \"Naur is a C-style\
