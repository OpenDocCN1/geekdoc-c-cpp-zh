    \ Container { // Vector_container implements Container\npublic:\n    Vector_container(int\
    \ s) : v(s) { // Vector of s elements\n    Vector_container() {}\n\n    double&\
    \ operator[](int i) override { return v[i]; }\n    int size() const override {\
    \ return v.size(); }\nprivate:\n    Vector v;\n};\n```\n\nThe public can be read\
    \ as \"is derived from\" or \"is a subtype of.\" Class Vector_container is said\
    \ to be derived from Container and Container is said to be a base of Vector_container.\
    \ An alternative terminology calls Vector_container subclass and superclass, respectively.\
    \ The derived class is said to inherit members from its base, so the use of base\
    \ and derived classes is considered as inheritance.\n\nThe members operator[]\
    \ and size() are said to override the corresponding members in the base class\
    \ Container. I used the explicit override to make clear what I intended. The use\
    \ of override is optional, but helps the compiler to catch mismatches, such as\
    \ misspellings of function names or differences between the type of virtual function\
    \ and its intended override. The explicit use of override is particularly useful\
    \ in large class hierarchies where it may be hard to know what is supposed to\
    \ override.\n\nThe destructor (~Vector_container()) overrides the base destructor\
    \ (~Container()). Note that the member destructor (~Vector()) is implicitly invoked\
    \ by its class's destructor (~Vector_container()). For a function like use(Container&)\
    \ to use Container in complete ignorance of implementation, some other function\
    \ will have an object on which it can operate.\n\n```\nvoid g() {\n    Vector_container\
    \ vc(10); // Vector of ten elements\n    // ... fill vc ...\n    use(vc);\n}\n\
