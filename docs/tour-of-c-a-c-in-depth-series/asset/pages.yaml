  md: '# 13.3 Iterator Types


    What are iterators really? Any particular iterator is an object of some type.
    There are, however, many different iterator types – an iterator needs to hold
    the information necessary for doing its job for a particular container. These
    iterators can be as different as the containers and specialized needs they serve.
    For example, a vector''s iterator could be an ordinary pointer, because a pointer
    is quite a reasonable way of referring to an element of a vector:


    ![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_190_0.png)


    ![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_190_1.png)


    Alternatively, a vector iterator could be implemented as a pointer to the vector
    plus an index:


    ![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_190_2.png)


    Using such an iterator allows range checking. A list iterator must be something
    more complicated than a simple pointer to element because an element of a list
    in general does not know where the next element of that list is. Thus, a list
    iterator might be a pointer to a link:


    ![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_190_3.png)'
