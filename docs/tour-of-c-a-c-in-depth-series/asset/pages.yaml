  md: '196 Pointers and Containers Chapter 15


    There is nothing “magic” about these types. We can design and implement our own
    “smart pointers” and specialized containers needed using the same techniques as
    are used for the standard-library ones.


    # 15.2 Pointers


    The general notion of a pointer is something that allows us to refer to an object
    and to access it according to its type. A built-in pointer, such as int, is an
    example but there are many more.


    | T* | A built-in pointer type: points to an object of type T or to a continuously-allocated
    sequence of elements of type T |

    | T& | A built-reference: refers to an object of type T; a pointer with implicit
    difference (§1.7) |

    | unique_ptr<T> | An owning pointer to a T to an object of type T; ownership is
    shared among shared_ptr''s to T |

    | weak_ptr<T> | A pointer to an object owned by a shared_ptr; must be converted
    to a shared_ptr to access the object |

    | span<T> | A pointer to a contiguous sequence of Ts (§15.2,2) |

    | string_view<T> | A sequence of elements from C |

    | X_iterator<C> | The X in the name indicates the kind of iterator (§13.3) |


    There can be more than one owning pointer pointing to an object. An owning pointer
    is one that is responsible for eventually deleting it refers to. A non-owning
    pointer (e.g., a T* or span) dangle; that is, point to a location where a dangling
    pointer is deleted or goes out of scope. The result of reading or writing it is
    undefined, often accessing an object that happens to occupy the location. Then,
    a read means getting an arbitrary value, and a write scrambles an unrelated data
    structure. The best we can hope for is a crash; that usually preferable to a wrong
    result.

    The C++ Core Guidelines [CG] offer rules for avoiding this advice and statically
    checking that it never happens. However, there are a few approaches for avoiding
    pointer problems:


    +   * Return a pointer to a local object that goes out of scope. In particular,
    return a pointer to a local object from a function or store pointer of uncertain
    provenance in a long-lived data structure. Systematic use of containers and algorithms
    (Chapter 12, Chapter 13) saves us from employing programming techniques that make
    it hard to avoid pointer problems.

    * Use owning pointers to allocated on the free store.

    * Pointers to static objects (e.g., global variables) cannot dangle.

    * Leave pointer arithmetic to the implementation of resource handles (such as
    vectors and unordered_maps).

    * Remember that string_views and spans are kinds of non-owning pointers.'
