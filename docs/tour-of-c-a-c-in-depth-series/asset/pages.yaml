  md: "# Containers\n\n```\ncatch (out_of_range) {\n    cerr << \"range error\\n\"\
    ;\n}\ncatch (...) {\n    cerr << \"unknown exception thrown\\n\";\n}\n```\n\n\
    This provides default handlers if we fail to catch any exception, an error message\
    \ is printed on the standard error-diagnostic output stream cerr (§11.2).\nWhy\
    \ doesn't the standard guarantee range checking? Many performance-critical applications\
    \ use vectors and checking all subscribing implies a cost on the order of 10%.\
    \ Obviously, that cost can vary dramatically depending on hardware, optimizations,\
    \ and an option of subscribing. However, experience that such overhead can lead\
    \ people to fear much more unsafe arrays. Even with the fear of such overhead\
    \ can lead to demise. At least vector is easily range checked at debug time and\
    \ we can build checked versions on top of the unchecked default.\nA range-for\
    \ avoids range errors at no cost by simply accessing all elements in the range.\
    \ As their arguments are valid, the standard-library does the same to ensure the\
    \ absence of range errors.\nIf you use vector::at() directly in your code, you\
    \ don't need a Vec workaround. Furthermore, some standard libraries have range-checked\
    \ vector implementations that offer more complete checking than Vec.\n\n# 12.3\
    \ list\n\nThe standard library offers a doubly-linked list list:\n\n![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_174_0.png)\n\
    \nWe use a list for sequences where we want to insert and delete elements without\
    \ moving other elements. Insertion and deletion of phone book entries could be\
