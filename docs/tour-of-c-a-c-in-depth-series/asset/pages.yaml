  md: '# # Preface


    When you wish to instruct,

    be brief.

    – Cicero


    C++ feels like a new language. That is, I can express my ideas more clearly, more
    simply, and

    more directly today than I could in C++98 or C++11. Furthermore, the resulting
    programs are bet-

    ter checked by the compiler and run faster.


    This book gives an overview of C++ as defined by C++20, the current ISO C++ standard,
    and

    implemented by the major C++ suppliers. In addition, it mentions a couple library
    components in

    Current use, but not scheduled for inclusion into the standard until C++23.


    Like other languages, C++ is large and there are a large number of libraries needed
    for

    effective use. This thin book aims to give an experienced programmer the major
    standard-library components.

    This book can be read in a day or two but, obviously, there is much more to writing
    good C++nthan can be learned in that amount of time. However, the herein is not
    mastery, but to give

    overview, to give key examples, and to help a programmer started.


    The assumption is that you have programmed before. If you have, please reading
    a text-

    book, as *Programming: Principles and Using C++ (Second Edition)* [Strous-

    trup,2014], before continuing here. If you have programmed before, the language
    you used or

    t applications you wrote may be very different from the style of C++ presented
    here.


    A sightseeing tour of a city, such as Copenhagen or New York. In just a few hours,
    younare a quick peek at the major attractions, told a few background stories,
    and give some sug-

    gestions about what to do. You do not know the city after a tour. You do not understand

    all you have seen and heard; some stories may sound strange or even implausible.
    You do not

    know how to navigate the formal and informal rules that govern life in the city.
    To really know a

    ty, you have to live in it, for years. However, with a bit of luck, you will have
    gained a bit

    of an overview, a notion of what is special about the city, and ideas of what
    might be of interest to

    y. After the tour, the real exploration can begin.'
