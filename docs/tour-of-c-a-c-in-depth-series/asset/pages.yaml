    \        mcond.notify_one(); // notify\n    } // release mutex (at end of scope)\n\
    \    }\n}\n```\n\n# 18.5 Communicating Tasks\n\nThe standard library provides\
    \ a few facilities to allow programmers to operate at the conceptual level of\
    \ tasks (rather to potentially be concurrently) rather than directly at the lower\
    \ level of threads and locks:\n\n+   * future and promise for returning a value\
    \ from a task spawned on a separate thread\n* packaged_task to help launch tasks\
    \ and connect up the mechanisms for returning a result\n* async(future) for launching\
