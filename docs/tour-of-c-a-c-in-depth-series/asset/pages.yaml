  md: "# Section 13.3 Iterator Types 179\n\nWhat is common for all iterators is their\
    \ semantics and the naming of them. For example, applying ++ to any iterator that\
    \ refers to the next element. Similarly, -- yields the element the iterator refers\
    \ to. In fact, any object that obeys a few rules like these is an iterator. Iterator\
    \ is a general idea, a concept (§8.2), and different kinds of iterators are available\
    \ as standard-library concepts such as forward iterator and random_access iterator.\
    \ Users rarely need to know the name of a specific iterator; each knows its iterator\
    \ types and makes them available under the conventional names iterator and const_iterator.\
    \ For example, list::iterator is the general iterator for list<Entry>. We rarely\
    \ have to worry about the details of how that type is defined.\n\nIn some cases,\
    \ an iterator is not a member type, so the standard library offers Iterator_t<X>\
    \ where X is defined.\n\n# 13.3.1 Stream Iterators\n\nIterators are general and\
    \ useful for dealing with sequences of elements in containers. However, containers\
    \ are not the only place where we find sequences of elements. For example, an\
    \ input produces a sequence of values, and we write a sequence of values to an\
    \ output stream. Consequently, the notion of iterators becomes useful for input\
    \ and output, and the type of objects we write to matters. For example\n\nTo assign\
    \ an ostream_iterator, we need to specify which stream will be used and the type\
    \ of objects to write.\n\n```\nostream_iterator<string> oo(cout); // Write strings\
    \ to cout\n```\n\nThe effect of assigning --oo is to write the assigned value\
    \ to cout. For example:\n\n```\nint main()\n{\n    ++oo = \"Hello, \" // Will\
    \ mean cout<<\"Hello,\"\n    ++oo;\n    ++oo = \"world!\\n\"; // Will mean cout<<\"\
    world!\\n\"\n}\n```\n\nThis is yet another way of writing the canonical message\
    \ to standard output. The ++oo is done to mimic writing into an array through\
    \ a pointer. That way, we can use iterators on streams. For example:\n\n```\n\
    vector<string> v{\"Hello, \", \"\", \"World!\\n\"};\ncopy(v, oo);\n```\n\nSimilarly,\
    \ an istream_iterator allows us to treat an input stream as a read-only container.\
    \ Again, we must specify the stream to be used and the type of values expected:\n\
    \n```\nistream_iterator<string> ii(cin);\n```\n\nInput iterators are used in pairs\
    \ representing a sequence, so we must provide an istream_iterator to indicate\
    \ the end of input. This is the default istream_iterator:\n\n```\nistream_iterator<string>\
    \ eos;\n```\n\nTypically, istream_iterators and ostream_iterators are not used\
    \ directly. Instead, they are provided as arguments to algorithms. For example,\
    \ we can write a simple program to read a file, sort the words"
