  md: '# Section 19.1.2 The Early Years 259


    Much of the design of C++ was done on the blackboards of my colleagues. The feedback
    from Steve Feldman, Alexander Fraser, Steve Johnson, Brian Kernighan, Doug McIlroy,
    and Dennis was invaluable.


    In the second half of the 1980s, I continued to add language features in response
    to user comments and guided by my general aims for C++. The most important of
    these were templates [Stroustrup,1988] and exception handling [K[enig,1990], which
    were considered experimental at the time the standards early started. In the design
    of templates, I was forced to decide between flexibility, efficiency, and early
    checking. At the time, nobody knew how to simultaneously get all three. With C-style
    code for demanding systems applications, I felt that I had to choose the first
    two priorities. In retrospect, I found the choice was correct, and the continued
    search for better templates [Dos,2006;Gregor,2006;Sutton,2011][Stroustrup,2012a][Stroustrup,2017]
    led to C++20 concepts (Chapter 8). The design of exceptions focused on multiple
    propagation of exceptions, the passing of information to an error handler, and
    the integration between exceptions and resource management by local objects with
    destructors to release resources. I finally named that technique Resource Acquisition
    Initialization and others soon reduced to the acronym RAII (§6.3).


    I generalized C++''s inheritance mechanisms to support multiple base classes [Stroustrup,1987].
    This was called multiple inheritance and was considered difficult and controversial.
    I considered it far less important than templates or exceptions. Multiple inheritance
    of abstract classes (often called interfaces) is now universal in languages supporting
    static typing and object-oriented programming.


    The C++ evolved hand-in-hand with some of the key library facilities. For example,
    I designed the complex [vector, stack, and (I/O) stream classes [Stroustrup,1985]
    together with the operator overloading mechanisms. The first string and list classes
    were developed by Jonathan Shof and the first to see extensive use as part of
    a library. The string class from C++ library has its roots in these early efforts.
    The task library designed in [Stroustrup,1987b] was part of the first "Classes"
    program written in 1980. It provided coroutines and a scheduler. I wrote it and
    its associated classes to support Simple-style simulations. It was crucial for
    C++''s success and wide adoption in the 1980s. Unfortunately, we had to wait until
    2011 (30 years!) to get concurrency support and universally available (§18.6).
    Coroutines are part of C++20 (§18.6). The development of the template facility
    was fueled by a variety of vector, map, list, and sort templates developed by
    Andrew Koenig, Alex Stepan, and others.


    The most important innovation in the 1998 standard was the STL, a framework of
    algorithms and containers (Chapter 12, Chapter 13). It was the work of Alex Stepanov
    (with Dave Main, Meng Lee, and others) born from more than a decade''s work on
    generic programming. The STL has been massively influential within the C++ community
    and beyond.


    C++ grew up in an environment with a multitude of established and experimental
    programming languages (e.g., [Adah,1979], Algol 68 [Woodward,1974], and ML [Paulson,1996]).
    At the time, I was comfortable with about 25 languages, and their influences on
    C++ are documented [Stroustrup,1994] and [Stroustrup,2007]. However, the influences
    always came from the applications I encountered. It was my deliberate policy to
    have the evolution of C++ "problem driven rather than intuitive.'
