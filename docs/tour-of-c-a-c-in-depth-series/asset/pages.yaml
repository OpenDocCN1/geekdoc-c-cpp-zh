  md: "# 238 Concurrency Chapter 18\n\nThe standard library directly supports concurrent\
    \ execution of multiple threads in a single address space. To allow that, C++\
    \ provides a suitable memory model and a set of atomic operations. The atomic\
    \ operations allow lock-free programming [Dechev,2010]. The memory model ensures\
    \ that as long as a programmer avoids data races (uncontrolled access to memory),\
    \ everything works as one would expect. However most users will see concurrency\
    \ only in terms of the standard library and libraries built on top of it. This\
    \ section briefly explains examples of the main-standard library facilities: threads,\
    \ mutex, packaged tasks, and futures. These features are built directly upon what\
    \ operating systems offer and do not introduce performance penalties compared\
    \ with others. Neither do they guarantee significant performance improvements\
    \ over what the operating system provides.\n\nDo not consider concurrency a panacea.\
    \ If a task be done sequentially, it is often simpler and faster to do so. Passing\
    \ information from one thread to another can be surprisingly expensive.\n\nAs\
    \ an alternative to using explicit features, we can use a parallel algorithm to\
    \ exploit execution engines for better performance (§13.6, §17.3.1).\n\nFinally,\
    \ C++ supports coroutines; that is, functions that keep their state between calls\
    \ (§18.6).\n\n# 18.2 Tasks and threads\n\nWe call a computation that can be potentially\
    \ executed with other computations a task. A thread is the system-level representation\
    \ of a task in program. A task to be executed concurrently with other tasks is\
    \ launched by constructing a thread (found in <thread>) with the task as its argument.\
    \ A task is a function or a function object:\n\n```\nvoid f();\n\nstruct F {\n\
    \    void operator()();\n};\n\nvoid user() {\n    thread t1 (f);\n    thread t2\
    \ (F());\n\n    t1.join();\n    t2.join();\n}\n```\n\nThe join ensures that we\
