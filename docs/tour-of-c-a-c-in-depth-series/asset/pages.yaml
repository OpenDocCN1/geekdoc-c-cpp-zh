  md: '# Containers


    # Chapter 12


    An emplace operation, using `emplace_back()` takes arguments for an element''s
    constructor and builds the object in the newly allocated space in the container,
    rather than copying an object into the container. For example, for a `vector<pair<int,string>>`
    you could write:


    ```

    v.push_back(pair(1,"copy or move\)); // Il make a pair and move it into v

    v.emplace_back(1,"build in place"); // Il build a pair in v

    ```


    For simple examples like this, optimization can result in enhanced performance
    for all calls.


    # 12.9 Advice


    +   [1] An STL container defines a sequence; $12.2.

    [2] STL containers are resource handles; $12.2, $12.3, $12.5, $12.6.

    [3] Use vector as your default container; $12.8; [CG: SL.con.2].

    [4] For simple travels of a container, use a range-for or a begin/end pair of
    iterators; $12.2,$12.3.

    [5] Use reserve to avoid invalidating pointers and elements; $12.2.

    [6] Don''t assume performance benefits from reserve without measurement; $12.2.

    [7] Use push_back() or resize on a vector rather than realloc() on an array; $12.2.

    [8] Don''t use iterators after a resize; $12.2 [CG: ES.65]

    [9] Do not use [ ] checks; $12.2.

    [10] Use at() when you need guaranteed range checks; $12.2; [CG: SL.con.3].

    [11] Use range-for and standard-library algorithms for cost-free avoidance of
    range errors; $12.2.

    [12] To preserve elements into a container; $12.2.1.

    [13] To preserve polymorphic behavior of elements, store pointers (built-in or
    user-defined); $12.2.1.

    [14] Insertion operations, as insert() and push_back(), are often surprisingly
    efficient on a vector; $12.3.

    [15] Use forward_list for lists that are sufficiently empty; $12.8.

    [16] When it comes to performance, don''t trust your intuition; $12.2.

    [17] A map is implemented as a red-black tree; $12.5.

    [18] An unordered_map is a hash table; $12.6.

    [19] Pass a container by reference and return by value; $12.2.

    [20] For a container, use the (j)-initializer syntax for sizes and the (j)-initializer
    syntax for sequences of elements; $5.2,$12.3.

    [21] Prefer compact and contiguous data structures; $12.3.

    [22] A list is relatively expensive to traverse; $12.3.

    [23] Use unordered containers if you need fast lookup for large amounts of data;
    $12.6.

    [24] Use ordered containers (e.g., map and set) if you need to iterate over elements
    in order; $12.5.

    [25] Use unordered containers (e.g., unordered_map) for element types with no
    natural order (i.e., no reasonable <); $12.5.

    [26] Use associative containers (e.g., map and list) when you need pointers to
    elements to be stable as the size of the container changes; $12.8.'
