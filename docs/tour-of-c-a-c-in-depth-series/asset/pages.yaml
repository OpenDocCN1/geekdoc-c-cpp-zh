  md: "# Section 3.2 Separate Compilation 31\n\nThe header-file technique for organizing\
    \ code goes back to the earliest days of C and is still far the most common. The\
    \ use of modules is new in C++20 and offers massive advantages in hygiene and\
    \ compile time.\n\n# 3.2.1 Header Files\n\nTraditionally, we place declarations\
    \ that specify the interface to a piece of code we consider a module in a file\
    \ with naming its intended use. For example:\n\n```\n// Vector.h\nclass Vector\
    \ {\npublic:\n    Vector(int s);\n    double& operator[](int i);\n    int size();\n\
    private:\n    double* elem; // elem points to an array of sz doubles\n    int\
    \ sz;\n};\n```\n\nThis declaration be placed in a file Vector.h. Users then #include\
    \ that file, called a header file, to access that interface. For example:\n\n\
    ```\n// user.cpp\n#include \"Vector.h\" // get Vector interface\n#include <cmath>\
    \ // get the standard-library math function interface including sqrt()\n\ndouble\
    \ sqrt_sum(const Vector& v) {\n    double sum = 0;\n    for (int i=0; i<v.size();\
