  md: '# Section 4.5.3 noexcept 51


    Thoughtlessly sprinkling noexcept on functions is hazardous. If a noexcept function
    calls a function that throws an exception expecting it to be caught and handled,
    noexcept turns into a fatal error. Also, noexcept forces the writer to handle
    errors through some form of error codes that can be complex, error-prone, and
    expensive (§4.4). Like other powerful language features, noexcept should be applied
    with understanding and caution.


    # 4.6 Advice


    +   [1] Throw an exception to indicate that you cannot perform an assigned task;
    §4.4; [CG: E.2].

    [2] Use exceptions for error handling only; §4.4; [CG: E.3].

    [3] Failing to open a file or to reach the end of an iteration is expected events
    not exceptional; §4.4.

    [4] Use error codes when an immediate caller is expected to handle the error;
    §4.4.

    [5] Throw an exception for errors to propagate through many function calls; §4.4.

    [6] If in doubt whether to use an exception or an error code, prefer exceptions;
    §4.4.

    [7] Develop an error-handling strategy early in a design; §4.4; [CG: E.12]

    [8] Use purpose-driven user-defined types as exceptions (not built-in types);
    §4.2.

    [9] Don''t try to catch every exception every function; §4.4; [CG: E.7].

    [10] You don''t have to use the standard-library exception class hierarchy; §4.3.

    [11] Prefer RAII to exploit try-blocks; §4.3; [CG: E.6].

    [12] Let a constructor establish an invariant, §4.2, and throw if it cannot; §4.3;
    [CG: E.5].

    [13] Design your error-handling strategy around invariants; §4.3; [CG: E.4].

    [14] What can be checked at compile time is usually best checked at compile time;
    §4.5.2 [CG: P4.4] [CG: P.5].

    [15] Use an assertion mechanism to provide a single point of control of the meaning
    of failure; §4.5.

    [16] Concepts (§8.2) are compile predicates and therefore useful in assertions;
    §4.5.2.

    [17] If your function may not throw, declare it noexcept; §4.4; [CG: E.12].

    [18] Don''t apply noexcept thoughtlessly; §4.5.3.'
