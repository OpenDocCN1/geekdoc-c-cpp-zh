    \ not this last simplification improves readability.\n\n# 13.4 Use of Predicates\n\
    \nIn the examples, algorithms have simply “built in” the action to be done for\
    \ each element of a sequence. However we often wanted to make a parameter to the\
    \ algorithm. For example, the find algorithm (§13.2, §13.5) provides a convenient\
    \ way of looking for a specific value. A more general variant looks like an element\
    \ that fulfills a specified requirement, a predicate. For example, we wanted to\
    \ search a map for the first value larger than 42. A map allows us to access its\
    \ elements as a sequence of (key,value) pairs, so we can search with map<string,int>’s\
    \ sequence for a pair<const string,int>& which is in 42:\n\n```\nvoid f(map<string,int>&\
    \ m)\n{\n    auto p = find_if(m.begin, Greater_than(42));\n    // ...\n}\n```\n\
    \nHere, Greater_than is a function object (§7.3.2) holding the value (42) to be\
    \ compared against a map entry of type pair<string,int>:\n\n```\nstruct Greater_than\
    \ {\n    int val;\n    Greater_than(int v) : val(v) {}\n    bool operator()(const\
    \ pair<string,int>& r) const { return r.second>val; }\n};\n```\n\nAlternatively,\
    \ we could use a lambda expression (§7.3.2):\n\n```\nauto p = find_if(m, [](const\
    \ auto & r) { return r.second>42; });\n```\n\nA predicate should not modify the\
    \ elements to which it is applied.\n\n# 13.5 Algorithm Overview\n\nA general definition\
    \ of an algorithm is “a finite set of rules which guides a sequence of operations\
    \ for solving a specific set of problems [and] has five important features: Finiteness\
    \ ... Definiteness ... Input ... Output ... Effectiveness” [Knuth,1968,§1.1].\
    \ In the context of the C++ standard library, an algorithm is a function template\
    \ operating on sequences of elements."
