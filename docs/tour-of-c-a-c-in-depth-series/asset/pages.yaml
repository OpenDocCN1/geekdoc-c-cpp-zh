  md: '# 256 History and Compatibility Chapter 19


    The evolution of C++ was always in the context of its use. I spent a lot of time
    listening to, seeking the opinions of experienced programmers, and of course writing
    code. In particular, my colleagues at AT&T Bell Laboratories were for the growth
    of C++ during its first decade.


    This section is a brief overview; it does not try to mention every language feature
    and library component. Furthermore, it does not go into details. For more information,
    and in particular for more names of people who contributed, see my three papers
    from the ACM History of Programming Lectures [Stroustrup,1993] [Stroustrup,2020]
    and my Design and Evolution of C++ book (known as “D&E”) [Stroustrup,1994]. They
    describe the design and evolution of C++ in detail and document opinions from
    them and from other programming languages. I try to maintain a connection between
    the standard facilities and the people who proposed and refined those facilities.
    C++ is not the work of a faceless, anonymous committee or a supposedly unnamed
    opponent “dictator for life”; it is the work of many dedicated, experienced, hard-working
    individuals.


    Most of the documents produced as part of the ISO C++ standards are available
    online [WG21].


    # 19.1.1 Timeline


    The work that led to C++ started in the fall of 1979 under the name “C with Classes.”
    Here is a simplified timeline:


    +   1979 Work on “C with Classes” started. The initial feature set included classes
    and derived classes, public/private access control, constructors and destructors,
    and function declarations with argument checking. The first library supported
    non-preemptive concurrent tasks and random number generators.

    1984 “C with Classes” was renamed to C++. By then, C++ had acquired virtual functions,
    function and operator overloading, and the I/O stream and complex number libraries.

    1985 First commercial release of C++ (October 14). The library included I/O streams,
    complex numbers, and tasks (non-preemptive scheduling).

    1986 The C++ Programming Language (“TC+PL”, October 14) [Stroustrup,1986].

    1989 The Annotated C++ Reference Manual (“the ARM”) [Ellison,1989].

    1991 The C++ Programming Language, Second Edition [Stroustrup,1991], presenting
    generic programming using templates and error handling based on exceptions, including
    “Resource Acquisition Initialization (RAII) general resource-management idiom.

    1997 The C++ Programming Language, Third Edition [Stroustrup,1997] introduced
    ISO C++, including namespaces, dynamic_cast, and many refinements of templates.
    The standard library added the STL framework of generic containers and algorithms.

    1998 ISO C++ standard [C++,1998].

    2002 Work on a revised standard, colloquially named C++0+, started.

    2003 A “bug fix” revision of the ISO C++ standard was issued. [C++,2011].

    2011 ISO C++11 standard [C++,2011] offering uniform initialization, move semantics,
    types deduced from initializers (auto), range-for, variadic templates, lambda
    expressions, aliases, a memory model suitable for concurrency, and much more.
    The standard library'
