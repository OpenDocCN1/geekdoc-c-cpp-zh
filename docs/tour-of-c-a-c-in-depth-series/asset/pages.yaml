  md: "# The Basics\n\n# Chapter 1\n\n```\nint main() {\n\tprint_square(1.234); //\
    \ print: the square of 1.234 is 1.52276\n}\n```\n\nA \"return type\" void indicates\
    \ that a function does not return a value.\n\n# 1.3 Functions\n\nThe main way\
    \ of getting something done in a C++ program is to call a function to do it. Defining\
    \ a function is the way you specify how an operation is to be done. A function\
    \ cannot be called unless it has declared.\n\nA function declaration gives the\
    \ name of the function, the type of value returned (if any), and the number and\
    \ types of arguments that must be supplied in a class. For example:\n\n```\nElem*\
    \ next_elem(); // no argument; return a pointer to Elem*\nvoid exit(int); // int\
    \ argument; return nothing\ndouble sqrt(double); // double argument; return a\
    \ double\n```\n\nIn a function declaration, the return type comes before the name\
    \ of the function and the arguments come after the name enclosed in parentheses.\n\
    \nThe semantics of argument passing are identical to the semantics of initialization\
    \ (§3.4.1). That is, argument types are checked and implicit argument conversion\
    \ takes place when necessary (§3.4).\n\n```\ndouble s2 = sqrt(2); // call sqrt(double)\
    \ with the argument double[2]\ndouble s3 = sqrt(\"three\"); // error: requires\
    \ an argument of type double\n```\n\nThe value of compile-time checking and type\
    \ conversion should not be underestimated.\n\nA function declaration may contain\
    \ arguments. This can be a help to the reader of a program, unless the declaration\
    \ is also a function definition, the compiler simply ignores such names. For example:\n\
    \n```\ndouble sqrt(double d); // return the square root of d\ndouble square(double);\
    \ // return the square of the argument\n```\n\nThe type of a function consists\
    \ of its return type followed by the sequence of argument types in parentheses.\n\
    \n```\ndouble get(const vector<double>&vec, int index); // type: returns const\
    \ vector<double>&,int\n```\n\nA function can be a member of a class (§3.5.2).\
    \ For such a member function, the name of the class is also part of its type.\
    \ For example:\n\n```\nchar& String::operator[](int index); // type: char& String&(int)\n\
    ```\n\nWe want our code to be comprehensible because this is the first step on\
    \ the way to maintainability. The first step is to break computational tasks into\
    \ meaningful chunks (represented as functions and classes) and name them. Such\
    \ functions provide the basic vocabulary of computation, just as the types (built-in\
    \ and user-defined) provide the basic vocabulary of data."
