    \ // \"ordinary constructor\": create an object\n    X(); // default constructor\n\
    \    X(const X&); // copy constructor\n    X(X&); // move constructor\n    X&\
    \ operator=(const X&); // copy assignment: clean up target and copy\n    X& operator=(X&);\
    \ // move assignment: clean up target and move\n    ~X(); // destructor: clean\
    \ up\n...};\n```\n\nThere are five situations in which an object can be copied\
    \ or moved:\n\n+   * As the source of an assignment\n* As an object initializer\n\
    * As a function argument\n* As a function return value\n* As an exception\n\n\
    An assignment uses a copy or move assignment operator. In principle, the other\
    \ cases use a copy or move constructor. However, a copy or move invocation is\
    \ often optimized by constructing the object to utilize right in the target object.\
    \ For example:\n\n```\nX make(Sometype);\nX x = make(value);\n```\n\nHere, a compiler\
    \ will typically construct the X from make() directly in x; thus eliminating (“eliding”)\
    \ a copy.\n\nIn addition to the initialization of named objects and objects on\
    \ the free store, constructors are used to initialize temporary objects and implement\
    \ explicit type conversion.\n\nExcept for the “ordinary constructor,” these special\
    \ members will be generated by the compiler as needed. If you want to be explicit\
    \ about generating default implementations, you can:\n\n```\nclass Y {\npublic:\n\
    \    Y(const Y&) = default; // I really do not want the default copy constructor\n\
    \    Y(Y&&) = default; // And the default move constructor\n    ...\n};\n```\n\
    \nIf you are explicit about some defaults, other definitions will not be generated.\n\
    \nWhen a class has a pointer member, it is usually a good idea to be explicit\
    \ about copy and move operations. The reason is that a pointer may point to something\
    \ that the class needs to delete, in which case the default member copy would\
    \ be wrong. Alternatively, it might point to something that the class must not\
    \ delete. In this case, a reader of the code would like to know. For an example,\
    \ see §6.2.1."
