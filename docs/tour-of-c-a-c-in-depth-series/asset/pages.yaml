    \ operator() override { act(); };\n};\n```\n\nAn Event simply stores an action\
    \ and allows it to be called; The Action will typically be a coroutine. I added\
    \ a name to illustrate that an event typically carries more information than just\
    \ the coroutine handle.\n\nHere is a trivial use:"
