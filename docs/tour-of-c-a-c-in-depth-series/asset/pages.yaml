  md: "# 224 Utilities\n\n# Chapter 16\n\nThe state of a moved-object is in general\
    \ unspecified, but all standard-library types leave a moved-object in a state\
    \ where it can be destroyed and assigned to. It would be unwise not to follow\
    \ that. For a counter (e.g., vector or string), the moved-from state will be \"\
    empty.\" For many types, the default value is a good state: meaningful and cheap\
    \ to establish.\n\nForwarding arguments is an important use case that requires\
    \ moves (§8.4.2). We sometimes want to transmit a set of arguments to another\
    \ without changing anything (to achieve \"perfect forwarding\");\n\n```\ntemplate\
    \ <typename T, Args...>\nunique_ptr<T> make_unique(Args&&... args) {\n    return\
    \ unique_ptr<T>(new T(std::forward<Args>(args)));\n}\n```\n\nThe standard-library\
    \ forward() differs from the simpler std::move() by correctly handling subtleties\
    \ to do value and reference twice (§6.2.2). std::forward() exclusively for forwarding\
    \ and don't forward() something twice; once you have forwarded an object, it's\
    \ not to use anymore.\n\n# 16.7 Bit Manipulation\n\n<bit>, we find functions for\
    \ low-level bit manipulation. Bit manipulation is a specialized, often essential\
    \ ability. When we get close to the hardware, we have to look at bits, bit patterns\
    \ in a byte or word, and turn raw memory into objects. bit_cast lets us convert\
    \ a value to any type of the same size:\n\n| double val = 7.2;\nauto x = bit_cast<uint64_t>(val);\
    \ | Il the bit representation of a 64-bit floating point number\nauto y = bit_cast<uint64_t&>(val);\
    \ | Il the bit representation of a 64-bit pointer\n\n```\nstruct Word {\n    std::bitset<1024>\
    \ buffer;\n};\n// ...\nauto* p = bit_cast<Word*>(&buffer[i]); // Il p points to\
    \ 8 bytes\nauto l = bit_cast<int64_t-*>(p); // Il convert those 8 bytes to an\
    \ integer\n```\n\nThe standard-library std::byte (the std::) represents bytes,\
    \ rather than characters or integers. In particular, std::byte provides only bit-wise\
    \ operations and not arithmetic ones. Usually, the best way to do bit operations\
    \ is an unsigned integer or std::byte. By best, it fastest and least likely to\
