  md: "# Section 5.2.3 Initializing Containers 59\n\nThe push_back() is useful for\
    \ initializing arbitrary numbers of elements. For example:\n\n```\nVector read(istream&\
    \ is)\n{\n  Vector v;\n  for (double d; is>>d) ; // read floating-point values\
    \ into d\n    v.push_back(d);\\ // add d to v\n  return v;\n}\n```\n\nThe input\
    \ loop is terminated by an end-of-file or a formatting error. Until that, each\
    \ number is added to the Vector that we chose. I used a for-statement instead\
    \ of the more conventional while-statement to limit the scope of d to the loop.\
    \ The number of elements read\n\nReturning a potentially huge amount of data from\
    \ read could be expensive. The way to avoid that a Vector is to provide it with\
    \ a move constructor (§6.2.2):\n\n```\nVector v = read(cin); // Il no code of\
    \ Vector elements\n```\n\nThe way that std::vector represents to push_back() and\
    \ other operations change the vector's size is presented in §12.\n\nThe std::initializer_list\
    \ used to define the initializer-list-constructor is a standard-library type known\
    \ to the compiler: when we use a j-list, such as {1,2,3,4}, the compiler will\
    \ create an object of type initializer_list to give to the program. So, we can:\n\
    \n+   Vector v1 = {1, 2, 3, 4, 5}; // Il v1 has 5 elements\nVector v2 = {1, 23,\
    \ 34, 56, 7, 8}; // Il v2 has 4 elements\n\n```\nVector::Vector(std::initializer_list<double>\
    \ lst) // Il initialize with a list\n{elem(new double[lst.size()]), sz(static_cast_int<int>(lst.size()));\n\
    Il copy from list into int (§13.5)\n```\n\nUnfortunately, the standard-library\
    \ uses unsigned integers for sizes and subscripts, so we need to use the ugly\
    \ static_cast to explicitly convert the size of the initializer list to an int.\
    \ This pedantic because the number of elements in a handwritten list is larger\
    \ than the integer (32 for 16-bit integers and 2,147,483,647 for 32-bit integers)\
    \ is rather low. However, the type system has no comment about the possible values\
    \ of variables, rather than actual values, it might complain when there is no\
    \ actual valuation. Such warnings can occasionally save the programmer from a\
    \ bad error.\n\nA static_cast does not check the value; the programmer is trusted\
    \ to use it correctly. This is not always a good assumption, so if in doubt, check\
    \ the value. Explicit type conversions (often called casts to remind you that\
    \ they are used to prop up something broken) are avoided. Try to use unchecked\
