    # 6.5.2 Container Operations


    Unless there is a really good reason not, design containers in the style of the
    standard-library containers, make the container resource safe by implementing
    it as a handle with appropriate essential operations (§6.1.1, §6.2).


    The standard-library containers know their number of elements and we can obtain
    it by calling size(). For:


    ```

    for (size_t i = 0; i!=c.size(); ++i) // size_t is the name of the type returned
    by a standard-library size()

    c[i] = 0;

    ```


    However, rather than traversing using indices from 0 to size(), the standard algorithms
    (Chapter 13) rely on the notion of sequences delimited by pairs of iterators:


    ```

    for (auto p = c.begin(); p!=c.end(); ++p)

    *p = 0;

    ```


    Here, c.begin() is an iterator pointing to the first element of c and c.end()
    points beyond-the-last element of c. Like pointers, iterators use ++ to move to
    the next element and * to access the value of the pointed-to element.


    These begin() and end() functions are also used by the implementation of the range-for,
    so we can simplify loops over a range:


    ```

    for (auto &x : c)

    x = 0;

    ```


    Iterators are used to pass sequences to standard-library algorithms. For example:


    ```

    sort(v.begin(),v.end());

    ```


    This iterator model (§13.3) allows for great generality and efficiency. For details
    and more container operations, see Chapter 12 and Chapter 13.


