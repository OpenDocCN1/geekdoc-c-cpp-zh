    \ of calling f on each element r |\n| v=take_view{r,n} | v is at most n elements\
    \ from r |\n| v=take_while{r,p} | v is elements from r until one doesn't meet\
    \ the p |\n| v=drop_view{r,n} | v is elements from starting with the n+th element\
    \ |\n| v=drop_while{r,p) | v is elements from the first element that doesn't meet\
    \ p |\n| v=join_view{r} | v is a flattened version of r; the elements of r must\
    \ be |\n| v=split_view{r,d} | v is a range of sub-ranges of r by the delimiter\
    \ d; d must be an element or range |\n| v=common_view{r} | v is described by a\
    \ (begin; end) pair |\n| v=reverse_view{r} | v is the elements in reverse order;\
    \ r must have bidirectional access |\n| v=views::elements<n>(r) | v is the range\
