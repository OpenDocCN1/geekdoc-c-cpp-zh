    \   // a range error in fs\n    // obviously suspect}\n```\n\nThat is, the common\
    \ case, creating a span directly from an array, is now safe (the compiler computes\
    \ the count) and notationally simple. In other cases, the probability of missed\
    \ range-detection is easier because the programmer has to explicitly compose a\
