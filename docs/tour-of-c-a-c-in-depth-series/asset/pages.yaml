    # Chapter 5


    +   - Chapter 8 gives an overview of the concepts, techniques, and language features
    that underlie generic programming. The focus is on the definition and use of concepts
    for precisely specifying interfaces to templates and guide design. Variadic templates
    are introduced for specifying the most and most flexible interfaces. These are
