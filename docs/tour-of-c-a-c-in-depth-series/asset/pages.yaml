  md: '# xii Preface


    This tour presents the major C++ language features as they support programming
    styles, such as object-oriented and generic programming. It does not attempt to
    provide a detailed, reference-manual, feature-by-feature view of the language.
    In the best textbook tradition, I try to explain a feature before I use it, but
    that is not always possible and nobody reads the text strictly sequentially I
    assume some technical maturity from my readers. So, the reader is encouraged to
    use the cross references and the index.


    Similarly, this tour presents the standard libraries in terms of examples, rather
    than exhaustively. The reader is encouraged to search out additional and supporting
    material as needed. There is more to the C++ ecosystem than just features offered
    by ISO (e.g., libraries, build systems, analysis tools, and development environments).
    There is an enormous amount of material (varying quality) available on the web.
    Most readers will find useful tutorial and overview videos from conferences such
    as CppCon and Meeting C+. For technical details of the language I recommend the
    ISO standard [Cpp]. For example, when I mention a standard-library function or
    class, its definition can easily be looked up, and by its documentation, many
    related facilities can be found.


    This tour C++ as an integrated whole, rather than a layer cake. Consequently,
    I rarely identify language features as present in C, C+98, or later ISO standards.
    Such information can be found in Chapter 19 (History and Capability). I focus
    on fundamentals and try to be brief, but I have not completely resisted the temptation
    to represent novel features, such as modules (§3.2), concepts (§8.2), and coroutines
    (§18.6). Slightly favoring recent developments also satisfies the curiosity of
    many readers who already know some older version of C++.


    A programming language reference manual or standard simply states what can be
    done, but programmers are often more interested in learning how to use the language.
    This aspect is partly addressed in the advice sections. More advice about what
    constitutes modern C++ can be found in the C++ Core Guidelines [Stroustrup,2015].
    The Core Guidelines can be a good source for further exploration of the ideas
    presented in this book. You may note a remarkable similarity of the advice formulation
    and even the numbering of advice between the Core Guidelines and this book. One
    reason is that the first edition of A Tour of C++ was a major source of the initial
    Core Guidelines.


    # Acknowledgments


    Thanks to all who helped complete and correct the earlier editions of A Tour of
    C++, especially to the students in my "Design Using C++" course at Columbia University.
    Thanks to Morgan Stanley for giving me time to write this third edition. Thanks
    to Chuck Allison, Gary Davidson, Stephen Dewhurst, Kate Gregory, Danny Kalev,
    Go Nishanov, and J.C. van Winkel for reviewing the book and suggesting many improvements.


    This book was set off by the author macros originating from Brian Kernighan.


    Manhattan, New York Bjarne Stroustrup'
