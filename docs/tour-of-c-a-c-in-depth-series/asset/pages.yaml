  md: "# 16.8 Exiting a Program\n\nOccasionally, a piece of code encounters a problem\
    \ that it cannot handle:\n\n+   - If the kind of problem is frequent and the immediate\
    \ caller can be expected to handle it, return some kind of return code (§4.4).\n\
    - If the kind of problem is infrequent or the immediate caller cannot be expected\
    \ to handle it, throw an exception (§4.4).\n- If the kind of problem is so serious\
    \ that no ordinary part of the program can be expected to handle it, exit the\
    \ program.\n- The standard library provides facilities to deal with that last\
    \ case (“exit the program”):\n  - exit(x): calls functions registered with atex(x)\
    \ then exits the program with the return value x. If you need to, look up atex(it),\
    \ it's basically a primitive destructor mechanism shared with the C language.\n\
    \  - abort(): exit the program immediately and unconditionally with a return value\
    \ indicating unsuccessful termination. Some operating systems offer facilities\
    \ that modify this explanation.\n  - quick_exit(x): calls functions registered\
    \ with at_quick_exit(); then exits the program with the return value x.\n- terminate():\
    \ calls the terminate_handler. The default terminate_handler is abort().\n\nThese\
    \ functions are for very serious errors. They do not invoke destructors; that\
    \ is, they do not do proper cleanup. The various handlers are used to take actions\
    \ before exiting. Some actions must be very simple because one reason for calling\
    \ these exits is that the program state is corrupted. One reasonable and reasonably\
    \ popular action is “restart the system in a well-defined state relying on nothing\
    \ from the current program.” Another slightly different, but not unreasonable\
    \ action is “log an error message and exit.” The reason that writing a logging\
    \ message can be a problem is that the I/O system might have been corrupted by\
    \ whatever caused the exit function to be called.\n\nError handling is one of\
    \ the trickiest kinds of programming; even getting cleanly out of a program is\
    \ hard.\nNo-purpose library will unconditionally terminate.\n\n# 16.9 Advice\n\
    \n+   [1] A library doesn't have to be large or complicated to be useful; §16.1.\n\
    [2] Time your programs before making claims about efficiency; §16.2.1.\n[3] Use\
    \ duration_cost to report time measures with proper units; use symbolic notation\
    \ (e.g., November/28/2021); §16.2.2.\n[4] To represent a date directly in source\
    \ code, use literals.\n[5] If a date is a result of a computation, check for validity\
    \ using okd(); §16.2.2.\n[6] When dealing with different locations, use zoned_time;\
    \ §16.2.3.\n[7] Use a lambda to express minor changes in calling conventions;\
    \ §16.3.1.\n[8] Use mem_fn() or a lambda to create function objects that can invoke\
    \ a member function called using the traditional function call notation; §16.3.1,+16.3.2."
