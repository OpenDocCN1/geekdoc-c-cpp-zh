    \ That is, starting from the left where the 0 is.\nFold is a very powerful abstraction,\
    \ clearly related to the standard-library accumulate(), with a variety of names\
    \ in different languages and communities. In C++, the fold expressions are restricted\
    \ to simplifying the implementation of variadic templates. A fold does not have\
    \ to perform numeric computations. Consider a famous example:\n\n```\ntemplate-Printable...\
    \ T\nvoid print(T&&... args)\n{\n    (std::cout << ... << args) << '\\n'; // print\
    \ all arguments\n}\n```\n\nWhy 2017? Because fold(v) was added to C++ in 2017\
    \ (19.2.3).\n\n# 8.4.2 Forwarding Arguments\n\nPassing arguments unchanged through\
    \ an interface is an important use of variadic templates. Consider a notion of\
    \ a network input channel for which the actual method of moving values is a parameter.\
    \ Different mechanisms have different sets of constructor parameters:\n\n```\n\
    template-concepts:InputTransport>\nclass InputChannel {\npublic:\n    // ...\n\
    \    InputChannel(Transport::Args&..., transportArgs)\n        : _transport(std::forward<TransportArgs>(transportArgs));\n\
