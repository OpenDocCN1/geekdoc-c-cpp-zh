  md: '# 120 Library Overview Chapter 9


    development environments provide “foundation libraries” for corporate or industrial
    “standard” development and/or execution environments. Beyond that, there are thousands
    of libraries supporting specialized application areas. Here, I do not describe
    libraries, systems, or environments beyond the standard-libraries. The intent
    is to provide a self-contained description of C++ as defined by its standard [C++,2020]
    and to keep the examples simple. Naturally, a programmer is encouraged to explore
    the more extensive facilities available on most systems.


    # 9.2 Standard-Library Components


    The facilities provided by the standard library can be classified like this:


    +   - Run-time language support (e.g., for allocation, exceptions, and run-time
    type information).

    - The C standard library (with very minor modifications to minimize type system
    violations).

    - Strings with support for international character sets, localization, and read-only
    views of substrings (§10.2).

    - Support for regular expression matching (§10.4).

    - I/O streams an extensible framework for input and output to which users can
    add their own types, buffering strategies, locales, and character sets (Chapter
    11). It also offers facilities for flexible output formatting (§11.6,2).

    - A library for manipulating files in a portable manner (§11.9).

    - A framework of containers (such as vector and map; Chapter 12) and algorithms
    (such as find(), sort(), and merge(); Chapter 13). conventionally, the STL [Sepanov,1994],
    is extensible so users can add their own containers and algorithms. Ranges (§14.1),
    including views (§14.2), generators (§14.3), and pipes (§14.4).

    - Concepts for fundamental computation, such as mathematical functions, complex
    numbers, vectors with arithmetic operations, mathematical constants, and random-number
    generators (§15.2 and Chapter 16).

    - Support for concurrent programming, including threads and locks (Chapter 18).
    The concurrency support is foundational so that users can add support for models
    of concurrency through synchronous and asynchronous constructs (§18.6).

    - Parallel versions of some algorithms and some numerical algorithms, such as
    sort(13.6) and reduce(17.3,1).

    - Utilities to support metaprogramming (e.g., type functions; §16.4), STL-style
    generic programming (e.g., pair; §15.3,3), and general programming (e.g., variant
    and optional; §15.4,1,15.4,2).

    - “Smart pointers” for resource management (e.g., unique_ptr and shared_ptr; §15.2,1).

    - Special-purpose containers, such as array (§15.3,1), bitset (§15.3,2), and tuple
    (§15.3,3).

    - Support for absolute time and durations, e.g., time_point and system_clock (§16.2,1).

    - Support for calendars, e.g., month and time_zone (§16.2,2,§16.2,3).

    - Suffixes for popular units, such as ms for milliseconds and i for index (§16.6).

    - Ways of manipulating sequences of elements, such as views (§14.2), string_views
    (§10.3), and spans (§15.2,2).'
