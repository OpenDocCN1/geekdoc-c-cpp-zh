  md: "# 38 Modularity Chapter 3\n\nGiven the importance of passing information to\
    \ and functions, it is not surprising that there are a variety of ways of doing\
    \ it. Key concerns are:\n\n+   - Is an object copied or shared?\n- If an object\
    \ is shared, is it mutable?\n- Is an object moved, leaving an “empty copy” behind\
    \ (§6.2.2)?\n\nThe default behavior for both argument passing and value return\
    \ is “make a copy” (§1.9), but many copies can potentially be optimized to moves.\n\
    \nIn the sum(), the resulting int is passed by sum() but it would be inefficient\
    \ and pointless to copy the potentially large vector sum(), so the argument is\
    \ passed by reference (indicated by the &; §1.7).\n\nThe sum() has no reason to\
    \ modify argument. This immutability is indicated by declaring the vector argument\
    \ const (§1.6), the vector is passed by const-reference.\n\n# 3.4.1 Argument Passing\n\
    \nFirst consider how to get values into a function. By default we “pass-by-value”\
    \ and if we want to refer to an object in the caller we use a reference (“pass-by-reference”).\
    \ For example:\n\n```\nvoid(vector<int> v, vector<int>& rv) // v is passed by\
    \ value; rv is passed by reference\n{\n    v[1] = 99; // v modifies (a local variable)\n\
    \    rv[2] = 66; // rv modifies ref to\n}\n\nint main() {\n    vector<int> fib\
    \ = {1, 2, 3, 5, 8, 13, 21};\n    test(fib, fib);\n    cout << fib[1] << ' ' <<\
    \ fib[2] << '\\n'; // prints 2 66\n}\n```\n\nWhen we consider performance, we\
    \ use small values by pass-by-reference. Here “small” means “something is really\
    \ cheap to copy”. Exactly what “small” means depends on architecture, the size\
    \ of two or three pointers is a good rule of thumb. If we might want to pass by\
    \ reference for performance reasons but don’t need to modify argument, we pass-by-const-reference\
    \ in the sum(). This is by far the most common case in ordinary code: it is fast\
    \ and error-prone.\n\nIt is not uncommon for a function argument to have a default\
    \ value; that is a value that is considered preferred or just the most common.\
    \ We can specify such a default by a function argument. For example:\n\n```\n\
    void print(int value, int base =10); // print value in base “base\"\n\nprint(x,16);\
    \ // hexadecimal\nprint(x,60); // sexagesimal (Sumerian)\nprint(x); // use the\
