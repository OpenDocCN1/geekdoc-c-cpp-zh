    # ### 15.2.2 span


    Traditionally, range errors have been a major source of serious errors in C and
    C++ programs, leading to wrong results, crashes, and security problems. The use
    of containers (Chapter 12), algorithms (Chapter 13), and range-for has significantly
    reduced this problem, but more can be done. A key source of range errors is that
    people pass pointers (raw or smart) and then rely on convention to know the number
    of elements pointed to. The best advice for outside resource handles is to assume
    that at most one element is pointed to (C: F22); the standard-library string_view
    (§10.3) can help, but is read-only and characters most programmers need. For example,
    when writing and reading out buffers in lower-level software, it is notoriously
    difficult to maintain high performance while still avoiding range errors (“buffer
    overflows”). A span from <span> is basically a (pointer,length) pair denoting
    a sequence of elements:


    ```

    span-int> begin( size_t ) {

    ```


    | 1 | 2 | 3 | 5 | 8 | 13 | 21 | 34 | 55 |


    A span gives access to a contiguous sequence of elements. The elements can be
    stored in many ways, including in vectors and built-in arrays. Like a pointer,
    a span does not own the characters to which it points. In that, it resembles a
    string_view (§10.3) and an STL pair of iterators (§13.3). Consider a common interface
    style:


    ```

    void fpn(int* p, int n) { for (int i = 0; i<n; ++i) p[i] = 0; }

    ```


    We assume that p points to n integers. Unfortunately, this assumption is simply
    a convention, so we can''t use it to write range-for loops and the compiler cannot
    implement efficient and range checking. Also, our assumption can be wrong:


    ```

    void use(int x) { int a[100]; fpn(a,100); fpn(a,1000); fpn(a+10,100); fpn(a,x);
    } // OK // oops, my finger slipped! (range error in fpn) // range error in fpn
    // suspect, but looks innocent

    ```


    We can do better using a span:'
