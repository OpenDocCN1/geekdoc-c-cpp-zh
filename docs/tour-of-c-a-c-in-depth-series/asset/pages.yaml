  md: '# Section 8.2.1 Use of Concepts 105


    That''s much clearer. Once we have defined what the concepts Sequence and Number
    mean, the compiler can call back by sum()''s interface, rather than looking at
    its implementation. This improves error reporting.


    However, the specification of sum() is not complete: "forget" to say that we should
    be able to add elements of a Sequence to a Number. We can do that:


    ```

    template<Sequence Seq, Number Num>

    requires Arithmetic<range_t<Seq>, Num>

    sum(Seq s, Num n);

    ```


    The range_value_t ($16.4) of a sequence is the type of elements in that sequence;
    it comes from the standard library which needs the elements of a range ($14.1).
    Arithmetic<X,Y> is a concept specifying that we can do arithmetic with numbers
    of types X and Y. This saves us from explicitly calculating the sum() of a vector<string>
    or a vector<int> while still accepting vector<int> and vector-complex<double>.
    Typically, when an algorithm requires arguments of different types, there is relation
    between those types that it is good to make explicit.


    In this example, we needed +=, but for simplicity and flexibility, we should not
    constrain of + = and rather than +, and we''d be happy that we used a general
    concept (here, Arithmetic) rather than a narrow requirement to "have +=".


    Partial specifications, as in the first sum() using concepts, can be very useful.
    Without the specification is complete, some errors will not be until instantiation
    time. Even partial specifications express intent and are essential for smooth
    incremental development we don''t initially recognize all the requirements we
    need. With mature libraries of concepts, initial specifications will be close
    to perfect.


    Surprisingly, the requires Arithmetic<range_t<Seq>, Num> is called a requirements-clause.
    If I liked verbally, I could equivalently have requires Sequence-Seq.


    ```

    template<typename Sequence, typename Number>

    requires Sequence<Seq> && Number<Num> && Arithmetic<range_t<Seq>, Num>

    sum(Seq s, Num n);

    ```


    On the other hand, we could also use the equivalence between the two notations
    to write:


    ```

    template<Sequence Seq, Number Num>

    requires Arithmetic<range_t<Seq>, Num>

    sum(Seq s, Num n);

    ```


    In code bases we cannot yet use concepts, we have to make with naming conventions
    and comments, as:


    ```

    template<typename Sequence, typename Number>

    Il requires Arithmetic<range_t<Sequence>, Number>

    sum(Sequence s, Number n);

    ```


    Whatever notation we choose, it is important to design a template with semantically
    meaningful constraints on its usage ($8.2.4).'
