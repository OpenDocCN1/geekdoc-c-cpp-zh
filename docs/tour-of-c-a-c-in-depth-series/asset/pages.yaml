    The iostream and format libraries provide operations for controlling the format
    of input and output. The iostream facilities are as old as C++ and focus on formatting
    streams of numbers. The format facilities ($11.6.2) are current (C++20) and focus
    on printf()-style ($11.8) specification of the combinations of values.


    Output formatting also supports unicode, but that''s beyond the scope of this
    book.


    # 11.6.1 Stream Formatting


    The simplest controls are controlled by manipulators and are found in <ios>, <iostream>,
    <iomanip>, and <iomanip> (for manipulators that take arguments). For example,
    we can output integers as decimal (default, oct, or hexadecimal numbers):


    ```

    cout << 1234 << '' '' << hex << 1234 << '' '' << oct << 1234 << '' '' << dec <<
    1234 << ''\n''; // 1234 4d2 2322 1234

    ```


    We can select the output format for floating-point numbers:


    ```

    cout << d << " : "

    << scientific << d << " "

    << hexfloat << d << " "

    << fixed << d << " "

    << defaultfloat << d << " "

    ```


    ```

    // use default format for d

    // use 1.123e scientific format for d

    // use hexadecimal notation for d

    // use 1.23456 style format for d

    // use the default format for d

    ```


    This produces:


    ```

    123.456;123456e+02;0x1.edd2f2p6;123.456000;123.456

    ```


    Precision is an integer that determines the number of digits to display for a
    floating-point number:


    +   * The general format (defaultfloat) presents a value in the style that preserves
    the value in the space available. The precision specifies the maximum number of
    digits.


    +   * The scientific format (scientific) presents a value with one digit before
    the decimal point and an exponent. The precision specifies the maximum number
    of digits after the decimal point.


    +   * The fixed format (fixed) presents a value as an integer followed by a decimal
    point and a fractional part. The precision specifies the maximum number of digits
    after the decimal point.'
