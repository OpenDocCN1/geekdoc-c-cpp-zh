  md: "# Section 16.6 move() and forward() 223\n\n# 16.6 move() and forward()\n\n\
    The choice between moving and copying is implicit (§3.4). A compiler will prefer\
    \ to move when an object is about to be destroyed (as in a return) that's assumed\
    \ to be the simpler and more efficient option. However, sometimes we must be explicit.\
    \ For example, a unique_ptr is the sole owner of an object. Consequently, it cannot\
    \ be copied, so if you want a unique_ptr else-where, you must use move. For example:\n\
    \n```\nvoid f0id() {\n    auto p = make_unique<int>(2);\n    // auto q = p; //\
    \ Error: we can't copy a unique_ptr\n    auto q = move(p); // p now holds nullptr\n\
    \    // ...\n}\n```\n\nConfusingly, std::move() does not move anything. Instead,\
    \ it casts its argument to an rvalue reference, thereby saying its argument will\
    \ not be used again and may be moved (§6.2.2). It should have been called something\
    \ like value_cast. It exists to save a few cases. Consider a simpler swap:\n\n\
    ```\ntemplate <typename T>\nvoid swap(T& a, T& b) {\n    T tmp(move(a));\n   \
    \ a = move(b);\n    b = move(tmp);\n}\n```\n\nWe don't want to copy potentially\
    \ large objects, so we request moves using std::move(). For other cases, where\
    \ it is dangerous, dangerous because of std::move(). Consider:\n\n```\nstring\
    \ s1 = \"Hello\";\nstring s2 = \"World\";\nvector<string> v;\nv.push_back(s1);\
    \ // Il use a const string& argument; push_back() will copy\nv.push_back(move(s2));\
    \ // Il use a move constructor\nv.emplace_back(s1); // Il an alternative; place\
    \ copy of s1 in a new end of v (§12.8)\n```\n\ns1 is copied by push_back(s1) whereas\
    \ s2 is moved. This sometimes (sometimes) makes the push_back() of s2 cheap. The\
    \ problem is that a moved-from object is left behind. If we use s2 again, we have\
    \ a problem:\n\n```\ncout << s1[2]; // write 'l'\ncout << s2[2]; // crash!\n```\n\
    \nI consider this use of std::move() to be too error for widespread. Don't use\
    \ it unless you can demonstrate significant and necessary performance improvement.\
    \ Later maintenance may accidentally lead to unanticipated use of the moved-from\
    \ object.\n\nThe compiler knows that an object is not used again in a function,\
    \ so using an explicit std::move(x), e.g., return std::move(x), is redundant and\
    \ can inhibit optimizations."
