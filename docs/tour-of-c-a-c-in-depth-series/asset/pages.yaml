    * Advice\n\n# ## 4.1 Introduction\n\nError handling is a large and complex topic\
    \ with concerns and ramifications that go far beyond faculties into programming\
    \ techniques and tools. However, C++ provides few features to help. The major\
    \ tool is the type system itself. Instead of painstakingly building up our applications\
    \ with the built-in types (e.g., char, int, and double) and statements (e.g.,\
    \ if, while, and for), we build types (e.g., string, map, and thread) and algorithms\
    \ (e.g., sort(), find_if()) that are appropriate for our applications. These higher-level\
    \ constructs simplify our programming, limit our opportunities for mistakes (e.g.,\
    \ you are unlikely to try to apply a tree traversal to a dialog box), and increase\
    \ the compiler's chances of catching errors. The majority of C++ language constructs\
    \ are dedicated to the design and implementation of elegant and efficient abstractions\
    \ (user-defined types and algorithms using them). One effect of using abstractions\
    \ is that the point where a run-time error can be detected is separated from the\
    \ point where it can be handled. As programs grow, and especially when libraries\
    \ are used extensively, standards for handling errors become important. It is\
    \ a good idea to articulate a strategy for error handling early on in the development\
