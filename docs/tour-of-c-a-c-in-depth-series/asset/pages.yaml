    C++ paper design; design, documentation, and implementation went simultaneously.
    There was no “C++ project” neither a “C++ design committee.” Throughout, C++ evolved
    to cope with problems encountered by users and as a result of discussions among
    my friends, my colleagues, and.


    The very design of C++ included function declarations with argument type checking
    and implicit conversions, classes with the public/private distinction between
    the interface and the implementation, derived classes, constructors and destructors.
    I used macros to provide primitive parameterization [Stroustrup,1982]. This was
    in non-experimental use by mid-1980. Late that year, I was able to present a set
    of language features supporting a coherent set of programming styles. In respect,
    I consider the introduction of constructors and destructors most significant.
    In the terminology of the time [Stroustrup,1979].


    A “new function” creates the execution environment for the member functions; the
    “delete function” reverses that.


    Soon after, “new function” and “delete function” were renamed “constructor” and
    “destructor.” Here is the root of C++’s strategies for resource management (causing
    a demand for exceptions) and the key to many techniques for making user code short
    and clear. If there were other languages at the time that supported multiple constructors
    capable of executing general code, I (1.3, and didn’t know of them). Destructors
    were never in C++.


    C++ was released commercially in October 1985. By then, I had added inline (§1.3,
    §5.2.1), consts (§1.6), function overloading (§1.3), references (§1.7), operator
    overloading (§5.2.1, §6.4), and virtual functions (§5.4). Of these features, far
    the most controversial. For run-time polymorphism in the form of virtual functions
    was C object-oriented programming had a hard time believing that virtual functions
    could be fast enough to use in systems programming. Conversely, programmers with
    object-oriented background (and many still have) had a hard getting used to the
    idea that you use virtual function calls only to resist an object-oriented background
    to make a choice that must be made at runtime. The reason functions may be related
    to a resistance to the idea that you can get systems through more regular structure
    of code supported by a programming language. Many C programmers seen that what
    really matters is flexibility and individual crafting of every detail of a program.
    My view was that (and we need every bit of help we can get from languages and
    tools: the inherent complexity of the systems we are trying to build is always
    at the edge of what we can express.


    Early documents (e.g., [Stroustrup,1985] and [Stroustrup,1994]) described C++
    like this:

    C++ is a general-purpose programming language that


    +   * supports data abstraction

    * supports object-oriented programming


    Note that I did not say “C++ is an object-oriented programming language.” Here,
    “data abstraction” refers to information hiding, classes that are not part of
    class hierarchies, and generic programming. Initially, generic programming was
    poorly supported through the use of macros [Stroustrup,1982]. Templates and concepts
    came much later.'
