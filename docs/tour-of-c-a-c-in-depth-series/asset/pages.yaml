  md: "# 17.7 Numeric Limits\n\nIn <limits>, the standard library provides classes\
    \ that describe the properties of built-in types – as the maximum exponent of\
    \ a float the number of bytes in an int. For example, we can assert that a char\
    \ is signed.\n\n```\nstatic_assert(numeric_limits<char>::is_signed,\"unsigned\
    \ characters\");\nstatic_assert(100000<numeric_limits<int>::max(),\"small ints!\"\
    );\n```\n\nThe second (assert) only works because numeric_limits<int>::max() is\
    \ a constexpr function (§1.6). We can define numeric_limits for our own user-defined\
    \ types.\n\n# 17.8 Type Aliases\n\nThe size of fundamental types, such as int\
    \ and long long are implementation defined; that is may differ on different implementations\
    \ of C++. If we need to be specific about the size of our integers, we can use\
    \ aliases in <stdint> and int32_t and uint_least64_t. The latter means an unsigned\
    \ integer with at least 64 bits.\n\nThe curious _t suffix is a relic of the days\
    \ of C when it deemed important to have a name that identified it as.\n\nOther\
    \ aliases, such as size_t (the type returned by the sizeof operator) and ptrdiff_t\
    \ (the type of subtracting one pointer from another) can be found in <cstddef>.\n\
    \n# 17.9 Mathematical Constants\n\nWhen doing mathematical computations, we need\
    \ common mathematical constants such as e, pi, and log2e. The standard library\
    \ offers them and more. They allow us to specify exact type (e.g., pi_v<T>) and\
    \ a short for the most common use (e.g., pi_v_double). For example:\n\n```\nvoid\
    \ area(float r) {\n    using namespace std::numbers; // It is where the mathematical\
    \ constants are kept\n    double d = pi*r*r;\n    float f = pi_v<float>*r*r;\n\
    \    // ...\n}\n```\n\nIn this case, the difference is small (we would have to\
    \ print with precision 16 or so to see it), but in real physics calculations differences\
    \ quickly become significant. Other areas where the precision of constants matters\
    \ are graphics and AI, where smaller representations of values are increasingly\
    \ important.\n\nIn <numbers>, we find e (Euler’s number), log2 (log2 of e), log10\
    \ (log10 of e), pi, inv_pi (1/pi), inv_sqrtpi (1/sqrt(pi)), ln2, in10, sqrt(2),\
    \ sqrt(3), inv_sqrt3 (1/sqrt(3)), egamma (the Euler-Mascheroni constant), phi\
    \ (the golden ratio)."
