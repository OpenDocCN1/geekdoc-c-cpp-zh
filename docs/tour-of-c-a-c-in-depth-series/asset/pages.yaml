    # 2.4 Enumerations


    In classes, C++ supports a form of user-defined type for which we can enumerate
    the values:


    ```

    enum class Color {red, blue, green };

    enum class Traffic_light {green, yellow, red };

    ```


    ```

    Color col = Color::red;

    Traffic_light light = Traffic_light::red;

    ```


    Note that enumerators (e.g., red) are in the scope of their enum class, so that
    they can be used repeatedly in enum classes without confusion. For, Color::red
    is Color’s red which is different from Traffic_light:red.


    The class after enum specifies that an enumerator is strongly typed and that its
    enumerators are scoped. By separating types, enum classes help prevent accidental
    misuses of constants. In particular, we cannot mix Traffic_light and Color values:


    ```

    Color x1 = ; // error: which red?

    Color y2 = Traffic_light::red; // error: that red is not a Color

    Color z3 = Color::red; // OK

    auto x4 = Color::red; // OK: Color::red is a Color

    ```


