  md: '# 8.5 Template Compilation Model


    At the point of use, the arguments for a template are checked against its concepts.
    Errors found here will be reported immediately. What cannot be checked at this
    point, such as arguments for unconstrained template parameters, is postponed until
    code is generated for the template with a set of template arguments: “at instantiation
    time."


    An unfortunate side of instantiation-time type checking is that a type error can
    be detected uncomfortably late (§8.2.4.1). Also, checking often results in spectacularly
    bad error messages because the compiler does not have type information hints to
    the programmer’s intent and often detects a problem only combining information
    from several places in the program.


    The instantiation-time type checking provided for templates checks the use of
    arguments in the template definition. This provides a compile-time variant of
    what is often called duck typing (“If it walks like a duck and it quacks, it’s
    a duck”). Or–using more technical terminology–we operate on values, and the presence
    and meaning of an operation solely on its input values. Differences from the alternative
    view that objects have types, which determine the presence and meaning of operations,
    “live” in objects. This is the way objects (e.g., variables) work in C++, and
    only values that meet an object’s requirements can be put into it. What is done
    at compile time involves objects, only values. The exception is local variables
    in a const function (§8.1.6) that are used as objects inside the compiler.


    To use an unconstrained template, its definition (not its declaration) must be
    in its point of use. When using header files and #include, this means that template
    definitions are found in header files, rather than cpp files. For example, the
    standard header <vector> holds the definition of vector.


    This changes when we start to use modules (§8.2.2). Using modules, the source
    code can be organized in the same way for ordinary functions and template functions.
    A module is semi-compiled into a representation that makes it fast to import and
    use. Think of that representation as an easily traversed graph containing all
    available scope and type information supported by a symbol table allowing quick
    access to individual entities.


    # Advice


    +   [1] Templates provide a general mechanism for compile-time programming;§8.1.

    [2] When designing a template, carefully consider the concepts (requirements)
    assumed by its template arguments;§8.3.2.

    [3] When designing a template, use a concrete version for initial implementation,
    debugging, and measurement;§8.3.2.

    [4] Use concepts as a design tool;§8.2.1.

    [5] Specify concepts for all template arguments;§8.2; [CG: T.10].

    [6] Whenever possible use named concepts (e.g., standard-library concepts);§8.2.4,
    §14.5; [CG: T.11].

    [7] Use a lambda if you need a simple function object in place only;§7.3.2.

    [8] Use templates to express containers and ranges;§8.3.2; [CG: T.3].'
