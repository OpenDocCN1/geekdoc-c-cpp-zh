    ```\n\n```\nvoid find(stop_token tok, const string* base, const Range<string>\
    \ r, const string target)\n{\n    for (string* p = r.first; p!=r.last && tok.requested();\
    \ ++p)\n        if (match(p, target)) { // Il applies matching criteria to the\
