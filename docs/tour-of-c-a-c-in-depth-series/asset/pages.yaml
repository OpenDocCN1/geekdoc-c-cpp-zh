  md: '# 17.3 Numerical Algorithms


    In <numeric>, we find a small set of generalized numerical algorithms, such as
    accumulate().


    | Numerical Algorithms |

    |---||

    | x=accumulate(b,e,i) | x is the sum of i and the elements of [b:e] |

    | x=accumulate(b,e,i,f) | accumulate f instead of + |

    | x=inner_product(b,e,b2,i) | x is the inner product of f2 and [b:e] and [b2:b2+(e-b)],
    that is, the sum of (p1)-(p2) for each p1 in [b:e] and the corresponding p2 in
    [b2:b2+(e-b)] |

    | x=inner_product(b,e,b2,i,f2) | inner_product f and f2 instead of + |

    | x=partial_sum(b,e,out) | Element of [out] is the sum of [b:b+1] |

    | x=partial_sum(b,e,out,f) | partial_sum using f instead of + |

    | x=adjacent_difference(b,e,out) | Element of [out] is (b+i)-(b+i-1) for i>0;
    if e-b=0, then <out is -b |

    | x=iota(b,e,v) | adjacent_difference using f instead of - For each element in
    [b] assign v and increment ++; then the sequence becomes v, v+1, v+2, ... |

    | x=gcd(n,m) | x is the greatest common denominator of integers n and m |

    | x=lcm(n,m) | x is the least common multiple of integers n and m |

    | x=midpoint(n,m) | x is the midpoint between n and m |


    These algorithms generalize common operations as computing a sum by letting them
    apply to all kinds of sequences. They also make the operation applied to elements
    of these sequences a parameter. For each algorithm, the general version is supplemented
    by a version applying the most common deoperator for that algorithm. For example:


    +   - list-double= lst {1, 2, 3, 4, 5, 9999, 99999};

    - auto s =accumulate(lst.begin(),lst.end(),0.0); // calculate the sum: 10014.9999


    These algorithms work for every standard-library sequence and can have operations
    supplied as arguments (§17.3).


    # 17.3.1 Parallel Numerical Algorithms


    In <numeric>'
