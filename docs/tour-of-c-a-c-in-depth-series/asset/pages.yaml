  md: "# Section 12.3\n\n```\nint get_number(const string &s)\n{\n    for (const auto\
    \ &x : phone_book)\n        if (x.name==s)\n            return x.number;\n   \
    \ return 0; // use 0 to represent \"number not found\"\n}\n```\n\nThe search for\
    \ s starts at the beginning of the list and proceeds until s is found or the end\
    \ of the phone_book is reached.\n\nSometimes, we need to identify an element in\
    \ a list. For example, we may want to delete an element or insert a new element\
    \ before it. To do that we use an iterator: a list identifies an element of a\
    \ list and can be used to iterate through a list (hence its name). Every standard-library\
    \ container provides begin() and end(), which return an iterator to the first\
    \ and one-past-the-last element respectively (§13.1). Using iterators explicitly\
    \ we can less elegantly write the get_number() function like this:\n\n```\nint\
    \ get_number(const string &s)\n{\n    for (auto p = phone_book.begin(); p!=phone_book.end();\
    \ ++p)\n        if (p->name==s)\n            return p->number;\n    return 0;\
    \ // use 0 to represent \"number not found\"\n}\n```\n\nIn fact, this is roughly\
    \ the way the ters and lesser range-for loop is implemented by the compiler. When\
    \ iterating p, *p is the element that it refers, ++p advances p to refer to the\
    \ next element, and when p refers to a class with a member m, then p->m is equivalent\
    \ to (-p).m. Adding elements to a list and removing elements from a list is easy:\n\
    \n```\nvoid f(const Entry &e, list<Entry>::iterator p, list<Entry>::iterator q)\n\
    {\n    phone_book.insert(p, e); // Add ee before the element referred to by p\n\
    \    phone_book.erase(q); // Remove the element referred to q\n}\n```\n\nFor a\
    \ list, insert(p,elem) inserts an element with the value elem before the element\
    \ pointed to p. p may be an iterator pointing beyond-the-end of the list. Conversely,\
    \ erase(p) removes the element pointed by p and destroys it.\nThese examples could\
    \ be written identically using vector and (surprisingly, unless you understand\
    \ machine architecture) often perform better with a vector than with a list. When\
    \ we all want a sequence of elements, we have choice between using a vector and\
    \ a list. Unless you have a reason not to use, a vector. A vector performs better\
    \ for traversal (e.g., find(i) and count(j)) and for sorting and searching (e.g.,\
    \ sort(i) and equal_range()) (§13.5, §15.3)."
