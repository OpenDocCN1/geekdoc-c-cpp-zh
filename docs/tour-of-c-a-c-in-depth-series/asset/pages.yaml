  md: "# Section 1.3 Functions 5\n\nThe C++ standard algorithms (e.g., find, sort,\
    \ iota) provide a good start (Chapter 13). Next, we can compose functions representing\
    \ common or specialized tasks in large computations. The number of errors in code\
    \ correlates strongly with the angle and complexity of the code. Both can be addressed\
    \ by using more and shorter functions. Using a function to do a specific task\
    \ saves us from writing a piece of code in the middle of other code; making a\
    \ function forces us to name the activity and its dependencies. If we cannot find\
    \ a suitable name, there is a high probability we have a design problem.\n\nIf\
    \ two functions are defined with the same name, but with different argument types,\
    \ the compiler will choose the most appropriate function to invoke for each. For\
    \ example:\n\n```\nvoid print(int);          // takes an integer argument\nvoid\
    \ print(double);     // takes a floating-point argument\nvoid print(string); \
    \    // takes a string argument\n\nvoid user() {\n    print(42);             \
    \ // calls print(int)\n    print(9.65);            // calls print(double)\n  \
    \  print(\"Barcelona\");    // calls print(string)\n}\n```\n\nIf two alternative\
    \ functions could be called, but neither is better than the other, the caller\
    \ is deemed ambiguous and the compiler gives an error. For example:\n\n```\nvoid\
    \ print(int,double);\nvoid print(double,int);\n```\n\n```\nvoid user2() {\n  \
    \  print(0,0);             // error: ambiguous\n}\n```\n\nDefining multiple functions\
    \ with the same name is known as function overloading and is one of the essential\
    \ parts of generic programming (§8.2). When a function is overloaded, each function\
