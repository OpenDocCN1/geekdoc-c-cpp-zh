  md: "164 Containers Chapter 12\n\n# 12.4 forward_list\n\nThe standard library also\
    \ offers a singly-linked list called forward_list:\n\nforward_list:\n\n![](img/c00e25f90ff6ca6a5619b7dcdafeb9db_176_0.png)\n\
    \nA forward_list differs from a (doubly-linked) list by only allowing forward\
    \ iteration. The point of that is to save space. There is no need to keep a predecessor\
    \ pointer in each link and the size of any forward_list is just one pointer. A\
    \ forward_list doesn't even keep its number of elements. If you need the number\
    \ of elements, count. If you can't afford to count, you probably shouldn't use\
    \ a forward_list.\n\n# 12.5 map\n\nWriting code to look up a name in a list of\
