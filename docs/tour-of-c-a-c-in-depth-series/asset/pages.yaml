    type (Chapter 2) that offers a (assignment) and == (equality comparison).


    # 1.92 Initialization


    Initialization differs from assignment. In general, for an assignment to work
    correctly, the assigned-to object must have a value. On the other hand, the task
    of initialization is to make an uninitialized piece of memory into a valid object.
    For almost all, the effect of reading from or writing to an uninitialized variable
    is undefined. Consider references:


    ```

    int x = 7;

    int& r = x; // bind r to x (r refers to x)

    r = 7; // assign to whatever r refers to

    ```


    ```

    int& r2; // error: uninitialized reference

    r2 = 99; // assign to whatever r2 refers to

    ```


    Fortunately, we cannot have an uninitialized reference; if we could, then r2=99
    would assign 99 to some unspecified memory location; the result would eventually
    lead to bad results or a crash.

    You can use = to initialize a reference but please don''t confuse that. For example:


    ```

    int& r = x; // bind r to x

    ```


    This is still initialization and binds r to x, rather than any form of copy.

    The distinction between initialization and assignment is also crucial to many
    user-defined types, such as string and vector, where an assigned-to object owns
    a resource that needs to be eventually released (§6.3).


    The basic semantics of argument passing and function value return are that of
    initialization (§3.4). For example, that''s how we get pass-by-reference.'
