  md: "# 14.5 Concepts Overview\n\nThe standard library offers many useful concepts:\n\
    \n+   - Concepts defining properties of types (§14.5.1)\n- Concepts defining iterators\
    \ (§14.5.2)\n- Concepts defining ranges (§14.5.3)\n\n# 14.5.1 Type Concepts\n\n\
    The concepts related to properties of types and the relations among types reflect\
    \ the variety of types. These concepts help simplify templates.\n\n| Core language\
    \ concepts <concepts> |\n|---||\n| same_as<T,U> | T is the same as U |\n| derived_from<T,U>\
    \ | T is derived from U |\n| convertible_to<T,U> | A T can be converted to a U\
    \ |\n| common_reference_with<T,U> | T and U share a common reference type |\n\
    | common_with<T,U> | T and U share a common |\n| integral<T> | T is an integral\
    \ type |\n| signed_integral<T> | T is a signed integral type |\n| unsigned_integral<T>\
    \ | T is an unsigned integral type |\n| floating_point<T> | T is a floating point\
    \ type |\n| assignable_from<T,U> | A U can be assigned to a T |\n| swappable_with<T,U>\
    \ | A T can be swapped with a U |\n| swappable<T> | swappable_with<T,T>\n\nMany\
    \ algorithms work with combinations of related types, expressions with a mixture\
    \ of ints and doubles. We use common_with to say whether a mix is mathematically\
    \ sound. If common_with<X,Y> is true, we use common_type<X,Y> to compare a X with\
    \ a Y by first converting both to common_type<T,X>. For example:\n\n```\ncommon_type<string,\
    \ const char> s1 = some_fct()\ncommon_type<string, const char> s2 = some_other_fct();\n\
    ```\n\n```\nif (s1==s2) {\n    // ...\n```\n\nTo specify a type for a pair of\
    \ types, we specialize common_type_t used in the definition of common. For example:\n\
    \n```\nusing common_type_t<BigInt,long> = BigInt; // for a suitable definition\
    \ of BigInt\n```\n\nFortunately, we don't need to define a common_type_t specialization\
    \ unless we want to use operations on mixes of types for which a library doesn't\
    \ (yet) have suitable definitions.\nThe concepts related to comparison are strongly\
    \ influenced by [Stepanov,2009]."
