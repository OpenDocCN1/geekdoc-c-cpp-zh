    For pairs of integers, `<<` means left-shift and `>>` means right-shift. However,
    for `iostream`, they are the output and input operators, respectively ($\$1.8,
    Chapter 11). For details and I/O operations, see Chapter 11.


    # 6.5.5 swap


    Many algorithms, most notably `sort()`, use a `swap()` function that exchanges
    the values of objects. Objects generally assume that `swap()` is very fast and
    thus no exception. The standard-library provides `std::swap(a,b)` implemented
    as three operations ($\$16.6). If you design a type that is expensive to copy
    and could be swapped (e.g., by a function object), give it move operations or
    `swap()` or both. Both the standard-library containers (Chapter 12) `string` ($\$10.2)
    have fast move operations.


