    \ is the whole pattern and matches[1] is the optional four-digit subpattern (--d(4))?.\n\
    \nThe newline character, \\n be part of a pattern, so we can scan for multiline\
    \ patterns. Obviously, we shouldn't read one line at a time if we want to do that.\n\
    \nThe regular expression syntax and semantics are designed so that regular expressions\
    \ can be compiled into state machines for efficient execution [Cox,2007]. The\
    \ regex type performs at runtime.\n\n# 10.4.2 Regular Expression Notation\n\n\
    The regex library can recognize several variants of the notation for regular expressions.\
    \ Here, I use the default notation, a variant of the ECMA standard for ECMAScript\
    \ (more commonly known as JavaScript). The syntax of expressions is based on special\
    \ characters:\n\n| Regular Expression Special Characters |\n|---| Any character\
    \ (or \"wildcard\") | Next character has a special meaning |\n| [ Begin character\
    \ class | + Zero or more (suffix operation) |\n| ] End character class | One or\
    \ more (suffix operation) |\n| { Begin count | ? Optional (zero or one) (suffix\
    \ operation) |\n| } End count | Alternative (or) |\n| ( Begin grouping | - Start\
    \ of line |\n| ) End grouping | $ End of line |\n\nFor example, we can specify\
