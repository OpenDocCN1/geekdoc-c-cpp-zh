    messages; §16.5.


    +   [14] Avoid explicit use of std::move(); §16.6; [CG: ES.56].


    +   [15] Use std::forward() exclusively for forwarding; §16.6.


    +   [16] Never read from an object after std::move(j) or std::forward(j) it; §16.6.


    +   [17] Use std::byte to represent data that doesn''t (yet) have a meaningful
    type; §16.7.


    +   [18] Use unsigned integers or bitsets for bit manipulation §16.7.


