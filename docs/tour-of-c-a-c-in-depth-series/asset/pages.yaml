  md: '# The Basics


    # Chapter 1


    # 1.2 Programs


    C++ is a compiled language. For a program to run, its source text has to be processed
    by a compiler, producing object files, which are combined by a linker yielding
    an executable program. A C++ program typically consists of many source code files
    (usually simply called source files).


    | source file 1 | compile | object file 1 | link | executable file |

    |---|---|---|---|---|

    | source file 2 | compile | object file 2 | | |


    An executable program is created for a specific hardware/system combination; it
    is not portable, say, from an Android device to a Windows PC. When we talk about
    portability of C++ programs, we mean portability of source code; that is, source
    code can be successfully compiled and run on a variety of systems.


    The ISO C++ standard defines two kinds of entities:


    +   - language features, such as built-in types (e.g., char and int) and loops
    (e.g., for-statements and while-statements)

    - Standard-library components, such as containers (e.g., vector and map) and I/O
    operations (e.g., << and getline())


    The standard-library components are perfectly ordinary C code provided by every
    C++ implementation. That is, the C++ library can be implemented in C++ itself
    and (with minor uses of machine code for things such as thread switching). This
    implies that C++ is sufficiently expressive and efficient for the most demanding
    programming tasks.


    C++ is a statically typed language. That is, the type of every entity (e.g., object,
    value, name, and expression) must be known to the compiler at its point of use.
    The type of an object determines the set of operations applicable to it and its
    layout in memory.


    # 1.2.1 Hello, World!


    The minimal C++ program is


    ```

    int main() {

    ```


    This defines a function called main, which takes no arguments and does nothing.

    Curly braces, {}, expressing group in C++. Here, they indicate the start and end
    of the function body. The double slash, // begins a comment that extends to the
    end of the line. A comment is for the human reader; the compiler ignores comments.

    Every C++ program must have exactly one global function named main(). The program
    starts by executing that function. The int value returned by main(), if any, is
    the program''s return value to “the system.” If no value is returned, the system
    will receive a value indicating successful completion. A nonzero value from main()
    indicates failure. Not every operating system and execution environment makes
    use of that return value: Linux/Unix-based environments do, but Windows-based
    environments rarely do.'
