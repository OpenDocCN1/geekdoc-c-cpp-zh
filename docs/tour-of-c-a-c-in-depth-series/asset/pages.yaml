  md: '# 262 History and Compatibility Chapter 19


    We must develop, popularize, and support coherent programming styles. We must
    support the evolution of older code to benefit from more modern, effective, and
    coherent styles.


    With the growth of the language and its standard library, the problem of polarizing
    programming styles became critical. It is extremely difficult to make large groups
    of programmers depart from something that works for something better. There are
    still people who see C++ as a few minor additions to C and people who view 1980s
    Object-Oriented programming styles based on class hierarchies the pinnacle of
    development. Many are still struggling to use modern C++ in environments with
    lots of older code. On the other hand, there are also many enthusiastically oeuvre
    novel facets. For example, some programmers are convinced that only using modern
    examples of template programming is true C++.


    What is Modern C++? In this I set out to answer this question by developing a
    set of coding guidelines supported by articulated rationales. I soon found that
    I was not alone in grappling with that problem, and benefit from many people from
    the world, not only from Microsoft, Red Hat, and Facebook, started the "C++ Core
    Guidelines" project [Stroustrup,2015]. This is an ambitious project aiming at
    complete type-safety and complete resource-safety as a base for simpler, faster,
    and more maintainable code [Stroustrup,2015b][Stroustrup,2021]. In addition to
    specific coding rules with rationales, we back up the guidelines with static analysis
    tools and a tiny support library. I see something like that as necessary for moving
    the C++ community at large to benefit from the improvements in language features,
    libraries, and supporting tools.


    # 19.1.5 C++ Use


    C++ is now a widely used programming language. Its user population grew quickly
    from 1979 to 400,000 in 1991, that is, the number of users doubled about every
    7.5 months for more than a decade. Naturally, the growth rate slowed since that
    initial growth spurt, but my best estimate is that there were about 4.5 million
    C++ programmers in 2018 [Kazakova,2015] and maybe a million more today (2022).
    Much of that growth happened after 2005 when the exponential explosion of processor
    speed slowed so that language performance grew in importance. This growth was
    achieved without formal marketing or an organized user community [Stroustrup,2020].
    C++ is primarily an industrial language; that is, it is more prominent in industry
    than in education or programming research. It grew in Bell Labs inspired by the
    variety and urgent needs of telecommunications and systems programming (including
    drivers, networking, electronics, and embedded systems). From there, C++ has spread
    into essentially every industry: micro web applications and infrastructure, operating
    systems, financial, automobile, aerospace, high-energy physics, energy production,
    machine learning, video games, graphics, animation, virtual reality, and more.
    It is primarily used where problems require C++s combination of the ability to
    use hardware effectively and to manage complexity. This seems to be a continuously
    expanding set of applications [Stroustrup,1993][Stroustrup,2014][Stroustrup,2020].


