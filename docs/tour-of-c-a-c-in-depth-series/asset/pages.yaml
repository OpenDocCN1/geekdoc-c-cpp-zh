  md: "# Section 12.2.2 Range Checking 161\n\n#  12.2.2 Range Checking\n\nThe standard-library\
    \ vector does not guarantee range checking. For example:\n\n```\nvoid silly(vector<Entry>&)\
    \ {\n    int i = book(book.size()).number; // book.size() is out of range\n  \
    \  // ...n}\n```\n\nThat initialization leaves some random value in i rather than,\
    \ and out-of-range errors are a common problem. Consequently, I often use a simple\
    \ range-checking adaptor of vector:\n\n```\ntemplate<typename T>\nstruct Vec :\
    \ std::vector<T> {\n    using vector<T>::vector; // Use the constructors from\
    \ vector (under the name Vec)\n    T& operator[](int i) { return vector<T>::at(i);\
    \ } // range check\n    const T& operator[](int i) const { return vector<T>::at(i);\
    \ } // range check objects;$5.2.1\n    auto begin() { return Checked_iter<vector<T>>(this);\
    \ } // see $13.1\n    auto end() { return Checked_iter<vector<T>>(this, vector<T>::end());\
    \ }\n}\n```\n\nVec inherits everything from vector except the subscript operations\
    \ that it redefines to range checking. The at() operation throws if its argument\
    \ is out of the vector's range ($4.2). For Vec, an out-of-range access will throw\
    \ an exception that the user can catch. For example:\n\n```\nvoid checked(Vec&\
    \ book) {\n    try {\n        book[book.size()] = {\"Joe\",999999}; // will throw\
    \ an exception\n        // ...\n    } catch (out_of_range& e) {\n        cerr\
    \ << \"range error\\n\";n    }\n}\n```\n\nThe exception will be thrown, and then\
    \ caught ($4.2). If the user doesn't catch an exception, the program will terminate\
    \ in a well-defined manner rather than proceeding or failing in an undefined manner.\
    \ To minimize surprises from uncaught exceptions is to use a main() with a try-block\
    \ as its body. For example:\n\n```\nint main() {\n    try {\n        // your code\n\
    \    }\n}\n```"
