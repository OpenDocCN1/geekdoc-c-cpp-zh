    # 19.1.2 The Early Years


    I originally designed and implemented the language I wanted to distribute the
    services of a UNIX kernel across multiprocessors and local-area networks (what
    are now known as multico clusters). For that, I needed precisely specify parts
    of a system and how they communicated. Simula [Dahl,1970] would have been ideal
    for, except performance considerations. I needed to deal directly with hardware
    and provide high-performance concurrent programming mechanisms for which C would
    have been ideal, for its weak support for modularity and type checking. The result
    of adding Simple-style classes to C (Classic C; §19.3.1), “C with Classes”, were
    used for major projects in which its facilities for writing programs that minimal
    time and space were severely tested. It lacked operator overloading, virtual functions,
    templates, exceptions [Stroustrup,1982]. The first use of C++ outside a research
    organization started in July 1983.


    The name C++ (pronounced “see plus plus”) was coined by Ricci Musacchi in the
    summer of 1983 and as the replacement for “C with Classes” by me. The name suggests
    the evolutionary nature of changes from C; ++ is the increment operator. The shorter
    name “C++ is a syntax error, it had also used as the name of an unrelated language.
    Connoisseurs of C semantics find C++ inferior to +C. The language was not called
    D, because it was an extension of C, it did not attempt to remedy problems by
    removing features, and because there already existed several-but C successors
    named D. For another interpretation of the name C++, the appendix of [Orwell,1949].


    C was designed primarily so that my friends and I would not program in assembler,
    C, or various-fashionable high-level languages. Its main purpose was to make writing
    good easier and more pleasant for the individual programmer. In the early years,
    there was no'
