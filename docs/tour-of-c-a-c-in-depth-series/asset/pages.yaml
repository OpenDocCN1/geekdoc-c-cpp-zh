    # 1.4.2 Initialization


    Before an object can be used, it must be given a value. C++ offers a variety of
    notations for expressing initialization, such as the = used above, and a universal
    form from curly-brace-delimited list lists:


    +   double d1 = 2.3;      // initialize d1 to 2.3

    double d2 = (2.3);     // initialize d2 to 2.3

    double d3 = {2.3};     // initialize d3 to 2.3 (the is optional with { ... ))


    ```

    complex-double z = 1;      // a complex number with double-precision floating-point
    scalars

    complex-double z2 = (d1,d2);

    complex-double z3 = {d1,d2};     // the is optional with { ... }

    ```


    ```

    vector-int v { 1, 2, 3, 4, 5, 6 }; // a vector of ints

    ```


    The form is formal and dates back to C, but if you use the general {}-list form.
    If nothing else, it saves you from conversions that lose information:


    ```

    int i1 = 7.8;      // i1 becomes 7 (surprise?)

    int i2 = (7.8);     // error: floating-to-integer conversion

    ```


    Unfortunately, conversions that lose information, narrowing conversions, can also
    be double to int in char, are allowed and implicitly applied when you use = (but
    not when you use {}). The problems caused by implicit conversions are price paid
    for C compatibility (§19.3).

    A constant (§1.6) cannot be initialized and a variable should only be initialized
    in extremely rare circumstances. Don''t introduce a name until you have a suitable
    value for it. User-defined types (such as string, vector, Matrix, Motor_controller,
    and Orc_warrior) can be defined by implicitly initialized (§5.2.1).


    When defining a variable, you do not need to state its type explicitly when it
    can be deduced from the initializer:


    ```

    auto b = true;    // a bool

    auto ch = ''x'';     // a char

    auto i = 123;      // an int

    ```'
