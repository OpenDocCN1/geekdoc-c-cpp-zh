  md: '# Module std


    > That is a big thing with an invention:

    You have to have a whole system that works.

    - J. Presper Eckert


    +   - Introduction

    - Use What Your Implementation Offers

    - Use Headers

    - Make Your Own module std

    - Advice


    # A.1 Introduction


    At the time of writing, module std [Stroustrup,2021b] is unfortunately not part
    of the standard. I have reasonable hope it will be part of C++23. This appendix
    offers some ideas of how to manage for now.


    The idea of module std is to make all components of the standard library simply
    and cheaply available by a single import std statement. I have relied on that
    throughout the chapters. The headers are mentioned mostly because they are traditional
    and universally available, and partially because they reflect the (imperfect)
    historical organization of the standard library.


    Few standard-library components dump names, as sqrt with <cmath>, but when we
    need to get such global names we import std.compat. Module std doesn''t do that,
    but the only good reason to import std.compat rather than std is to avoid messing
    with old code bases while still gaining some of the benefits from the increase
    in compile speeds from modules.


    Note modules, most deliberately, don''t export macros. If you need macros, use
    #include Modules and headers coexist, that is, if you both #include and import
    an identical set of declarations, you will get a consistent program. This is essential
    for the evolution of large code bases from relying on header files to use modules.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# A.2 Use Your Implementation Offers


    With a bit of luck, an implementation we want to use already has a module std.
    In that case, our first choice should be to use it. It may be labeled “experimental”
    and to use it may require a bit of setup or a few compiles. So, first of all,
    explore if the implementation has a module std or equivalent. For example, currently
    (Spring 2022) Visual Studio offers a number of “experimental” modules, so that
    implementation, we can define module std like this:


    ```

    export module std;

    export import std.regex; // <regex>

    export import std.filesystem; // <filesystem>

    export import std.memory; // <memory>

    export import std.threading; // <atomic>, <condition_variable>, <future>, <mutex>,
    <shared_mutex>, <thread>

    export import std.core; // all the rest

    ```


    For that work, we will obviously have to use a C++20 compiler, and also set options
    to gain access to the experimental modules. Beware that “experimental” will change
    over time.


    # A.3 Use Headers


    If an implementation doesn''t support modules or doesn''t offer a module std or
    equivalent, we can fall back to using traditional headers. They are standard and
    universally available. The snag is that to get an example to work, we need to
    figure out which headers are needed and #include them. Chapter 9 can help here,
    and we can look up the name of a feature we want to use in <cppreference> to see
    header it is part of. If that gets tedious, we can frequently used headers into
    a std.h header:


    ```

    // std.h

    ```


    ```

    #include <iostream>

    #include <string>

    #include <vector>

    #include <list>

    #include <memory>

    #include <algorithms>

    #...

    ```


    and then


    ```

    #include "std.h"

    ```


    The problem here is that #including so so can can give very slow compiles (Stroustrup,2021b).


    # A.4 Make Your Own module std


    This is the least attractive alternative because it''s likely to be the most work,
    but once someone does it, it can be shared:'
