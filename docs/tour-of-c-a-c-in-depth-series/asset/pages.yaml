    # 19.3.2 Compatibility Problems


    There are many incompatibilities between C and C++. All problems for a programmer
    but in the context of C++, can be coped with. If nothing else, C fragments can
    be compiled as C and linked to the extern “C” mechanism.


    The major problems for converting a C program to C++ are likely to be:


    +   * Suboptimal design and programming style.

    * A void; implicitly converted to a T (that is, converted without a cast).

    * C++ keywords, such as class and private, used as identifiers in C code.

    * Incompatible linkage of code fragments compiled as C and fragments compiled
    as C++.


    # 19.3.2.1 Style Problems


    Naturally, a C program is written in a C style, as the style used in K&R [Kernigan,1988].
    This implies widespread use of pointers and arrays, and probably many macros.
    These facilities are hard to use in a large program. Resource management and error
    handling are all done (rather than local and tool supported) and often documented
    and adhered to. A simple-line-conversion of a C program into a C++ program yields
    a program that is often a bit checked. In fact, I have never converted a C program
    into C++ without finding some bugs. the fundamental structure is unchanged, and
    so are the fundamental sources of errors. If you had incomplete error handling,
    resource leaks, or buffer overflows in the original program, there will still
    be in the C++ version. To obtain major benefits, you must make changes to the
    fundamental structure of the code:


    +   [1] Don’t think of C++ as C with a few features added. C++ can be used that,
    but only suboptimally. To get really advantages from C++ as compared to C, you
    need to apply different design and implementation styles.'
