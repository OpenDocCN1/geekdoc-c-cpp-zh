    # 4.4 Error-Handling Alternatives


    Error handling is a major issue in all real-world software, so naturally there
    are a variety of approaches. If an error is detected and it cannot be handled
    locally in a function, the function must somehow communicate the problem to some
    caller. Throwing an exception is C++s most general mechanism for that.


    There are languages where exceptions are designed simply to provide an alternate
    mechanism for returning values. C++ is not such a language: exceptions are designed
    to report failure to complete a given task. Exceptions are integrated with constructors
    and destructors to provide a coherent framework for error handling and resource
    management (§5.2.2, §6.3). Compilers are optimized to make returning a value cheaper
    than throwing the same value as an exception.


    Throwing an exception is not the only way of reporting an error that cannot be
    handled locally. A function can indicate that it performs its allotted task:


    +   * throwing an exception

    * somehow returning a value indicating failure

    * terminating the program (by invoking terminate(), exit(), or abort()) (§16.8).


    We return an indicator (an "error code") when:


    +   * A failure is normal and expected. For example, it is quite normal for a
    request to open a file to fail (there is no file of that name or maybe the file
    cannot be opened with the permissions requested).

    * An immediate call can reasonably be expected to handle the failure.

    * An error happens in one of a set of parallel tasks and we need to know which
    task failed.

    * A system has so little memory that the run-time support for exceptions would
    crowd out essential functionality.


    We throw exception when:


    +   * An error is so rare that a programmer is likely to check for it. For example,
    when you last check the return value of printf().

    * An error cannot be handled by an immediate call. For example, it is infeasible
    to propagate up the call chain to an application handle every allocation failure
    and network outlet. Repeatedly checking an error-code would be tedious, expensive,
    and error-prone. The tests for and passing error-codes as return values can easily
    obscure the main logic of a function.

    * New kinds of errors can be added in lower-modules of an application that higher-level
    modules are not needed to write with such errors. For example, when a previously-threaded
    application is modified to use multiple threads or resources are placed remotely
    to be accessed over a network.

    * No suitable return path for error codes is available. For example, a constructor
    does not have a return value for a "caller". In particular, constructors may be
    invoked for'
