  md: "Section 12.7 Allocators 167\n\n# 12.7 Allocators\n\nBy default, standard-library\
    \ containers allocate space using new. Operators new and delete provide a free\
    \ store (also called dynamic memory or heap) that can hold objects of arbitrary\
    \ size and user-controlled lifetime. This implies time and space overheads that\
    \ can be eliminated in special cases. Therefore, the standard-library containers\
    \ offer the opportunity to install allocators with specific semantics where needed.\
    \ This has been used to address a wide variety of concerns related to performance\
    \ (e.g., pool allocators), security (allocators that clean up as part of memory),\
    \ per-thread allocation, and non-uniform memory architectures (allocating in specific\
    \ memories with pointer types to match). This is not the place to discuss these,\
    \ but very specialized and often advanced techniques. However, I will give one\
    \ example motivated by a real world for which a pool allocator was the solution.\n\
    \nAn important, long-running system used an event queue (see §18.4) using vectors\
    \ as events that passed shared_ptr. The last of an event implicitly deleted it:\n\
    \n```\nstruct Event {\n    vector<int> data = vector<int>{512};\n};\n\nlist<shared_ptr<Event>>\
    \ q;\n\nvoid producer() {\n    for (int n = 0; n<lOTS; ++n) {\n        lock_guard\
    \ lock(m); // m is a mutex, see §18.3\n        q.push_back(make_shared<Event>());\n\
    \        cv.notify_one(); // cv is a condition_variable, see §18.4\n    }\n}\n\
    ```\n\nFrom a logical point of view this worked nicely. It is logically sound,\
    \ so the code is robust and maintainable. Unfortunately, this led to massive fragmentation.\
    \ After 100,000 events had been passed among 16 producers and 4 consumers, more\
    \ than 6GB of memory had been consumed.\nThe traditional solution to fragmentation\
    \ problems is to rewrite the code to use a pool allocator. A pool allocator is\
    \ an allocator that manages objects of a fixed size and allocates space for many\
    \ objects at a time, rather than using individual allocations. Fortunately, C++\
    \ offers direct support for that. The pool allocator is defined in the pmr (\"\
    polymorphic memory resource\") namespace of std.\n\n```\npmr::synchronized_pool_resource\
    \ pool; // let make a pool\n```\n\n```\nstruct Event {\n    vector<int> data =\
    \ vector<int>{512,pool};\n};; // let Events use the pool\n```\n\n```\nlist<shared_ptr<Event>>\
    \ q (&pool); // let q use the pool\n```"
  merge: -1
