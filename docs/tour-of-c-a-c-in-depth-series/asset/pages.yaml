    # 8.3 Generic Programming


    The form of generic programming directly supported by C++ centers around the idea
    of abstracting from concrete, efficient algorithms to obtain generic algorithms
    that can be combined with different data representations to produce a wide variety
    of software [Stepanov,2009]. The abstractions represent the fundamental operations
    and data structures are called concepts.


    # 8.3.1 Use of Concepts


    Good, concepts are fundamental and discovered more than they are designed. Examples
    are integer and floating-point number (as defined in Classic C [Kernighan,1977]),
    sequence, and more general mathematical concepts, such as ring and vector space.
    They represent the fundamental concepts of a field of application. That is why
    they are called “concepts”. Identifying and formalizing concepts to the degree
    necessary for effective generic programming can be a challenge.\ For basic use,
    consider the concept regular (§14.5). A type is regular when it behaves like an
    int or a vector. An object of a regular type


    +   * can be destroyed

    * can be copied (with the usual semantics of copy, yielding objects that are independent
    and compare equal) using an constructor or assignment

    * can be compared using == and !=

    * don''t suffer technical problems from overly clever programming tricks.


    A string is another example of regular type. Like int, string is also totally_ordered
    (§14.5). That is, two strings can be compared using <, <=, >= and == with the
    appropriate semantics.

    A concept is not just a syntactic notation, it is fundamentally about semantics.
    For example, do not define + to divide; that would match the requirements for
    any reasonable number. Unfortunately, we do not have language support for expressing
    semantics, we have to rely on expert knowledge and sense to generate semantically
    meaningful concepts. Do not define semantically meaningless concepts, such as
    Addable and Subtractable. Instead, rely on domain knowledge to define concepts
    that match fundamental concepts in an application domain.


