  md: "# 13.6 Parallel Algorithms\n\nWhen the same task is to done to many data items,\
    \ we can execute it in parallel on each data item provided the computations on\
    \ different data items are independent:\n\n+   * *parallel execution*: tasks are\
    \ done on multiple threads (often running on several processor cores)\n* *vectorized\
    \ execution*: tasks are done on a single thread using vectorization, also known\
    \ as SIMD (\"Single Instruction, Multiple Data\").\n\nThe standard library offers\
    \ support for both and we can be specific about wanting sequential execution;\
    \ in `<execution>` namespace execution, we find:\n\n+   * *seq*: sequential execution\n\
    * *par*: parallel execution (feasible)\n* *unseq*: unsequential (vectorized) execution\
    \ (feasible)\n* *par_unseq*: parallel and unsequential (vectorized) execution\
    \ (feasible).\n\nConsider `std::sort();`\n\n```\nsort(v.begin(),v.end()); // sequential\n\
    sort(seq,v.begin(),v.end()); // sequential (same as the default)\nsort(par,v.begin(),v.end());\
    \ // parallel\nsort(par_unseq,v.begin(),v.end()); // parallel and vectorized\n\
    ```\n\nWhether it is worthwhile to parallelize and/or vectorize depends on the\
    \ algorithm, the number of elements in the sequence, the hardware, and the utilization\
    \ of hardware by programs execution policies are just hints. A compiler and/or\
    \ runtime scheduler will decide how much concurrency to use. This is all nontrivial\
    \ and the rule making statements about efficiency without measurement is very\
    \ important here.\n\nUnfortunately, the range versions of the parallel algorithms\
    \ are not yet in the standard, but if we need them, they are able to define:\n\
    \n```\nvoid sort(auto pol, random_access_range auto& r)\n{\n  sort(pol,r.begin(),r.end());\n\
    }\n```\n\nMost standard-library algorithms, including all in the table §13.5 except\
    \ `equal_range`, can be requested to be parallelized and vectorized using `par`\
    \ and `par_unseq` for `sort()`. Why not `equal_range()`? Because so far nobody\
    \ has come with a worthwhile parallel algorithm for that.\nMany parallel algorithms\
    \ are used primarily for numeric data; see §17.3.1.\nWhen requesting parallel\
    \ execution, be sure to avoid races (§18.2) and deadlock (§18.3).\n\n# 13.7 Advice\n\
    \n+   [1] An STL algorithm operates on one or more sequences; §13.1.\n[2] An input\
    \ sequence is half-open and defined by a pair of iterators; §13.1.\n[3] You can\
    \ define your own iterators to serve special needs; §13.1.\n[4] Many algorithms\
    \ can be applied to I/O streams; §13.3."
