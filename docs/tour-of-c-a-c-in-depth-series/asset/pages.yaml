  md: "# 130 Strings and Regular Expressions Chapter 10\n\n# 10.4 Regular Expressions\n\
    \nRegular expressions are a powerful tool for text processing. They provide a\
    \ way to style and describe patterns in text (e.g., a U.S. postal code such as\
    \ TX 77845, or an ISO-style date, such as 2009-06-07) and easily find such patterns.\
    \ In <regex>, the standard library provides support for regular expressions in\
    \ the std::regex class and its functions. It gives a taste of the regex library,\
    \ let us define and print a pattern:\n\n```\nregex pat(R\"(\\w(2)-\\d(5)-\\d(4))\"\
    ); // U.S. postal code: Xxxddd-ddd-dddd and variants\n```\n\nPeople who have used\
    \ regex in any language without line lw(2)-\\d(5)-\\d(4). Patterns starting with\
    \ two letters lw(2) optionally followed by some space followed by five digits\
    \ \\d(5) and optionally followed by a dash and four digits \\d(4). If you are\
    \ not familiar with regular expressions, this might be a good time to learn them\
    \ ([IStroustrup,2000; Maddock,1997]).\n\nTo express the pattern, use a raw string\
    \ literal with R'(' and \"). This allows backslashes and quotes to be quoted directly\
    \ in the string. Regular expressions are particularly tricky when they contain\
    \ a lot of backslashes. If I used a conventional string, the pattern would be:\n\
    \n```\nregex pat {\"\\w(2)-\\d(5)-\\d(4)\"}; // U.S. postal code pattern\n```\n\
    \nIn <regex_match>, the standard library provides support for regular expressions:\n\
    \n+   - regex_match: Match a regular expression against a string (of known size)\
    \ (§10.4.2).\n- regex_search: Search for a match that matches a regular expression\
    \ in an (arbitrarily long) stream of data (§10.4.1).\n- regex_replace: Search\
    \ for matches that match a regular expression in an (arbitrarily long) stream\
    \ of data and replace them.\n- regex_iterator: Iterate over matches and submatches\
    \ (§10.4.3).\n- regex_token_iterator: Iterate over nonmatches.\n\n# 10.4.1 Searching\n\
    \nThe simplest way of using a pattern is to search for it in a stream:\n\n```\n\
    int lineno = 0;\nfor (string line: getline(cin,line)) { // Read into line buffer\n\
    \  ++lineno;\n  smatch matches;\n  if (regex_search(line,matches,pat)) { // matched\
    \ strings go here\n    cout << lineno << \" : \" << matches[0] << \"\\n\"; //\
    \ Search for pat line\n  }\n}\n```\n\nThe regex_search(line.matches,pat) searches\
    \ the line for anything that matches the regular expression stored in pat and\
    \ if it finds any matches, it stores them in matches. If no match was found, regex_search()\
    \ returns false. The matches variable is of type match. The \"s\" stands for \"\
    sub\" or \"string\", and an match is a vector of submatches type string. The first\
    \ element, matches[0], is the complete match. The result of a regex_search() is\
    \ a collection of matches, typically represented as match:"
