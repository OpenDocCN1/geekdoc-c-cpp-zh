  md: "# Section 18.5.2 packaged_task 247\n\n# 18.5.2 packaged_task\n\nHow do we get\
    \ a future into the task that need a result and the corresponding promise into\
    \ the thread that should produce that result? The packaged_task is provided to\
    \ simplify setting up tasks with futures and threads. A packaged_task provides\
    \ wrapper to copy the return value or exception from the task into a promise (like\
    \ the code in §18.5.1). If you ask it by get-future, a packaged_task will give\
    \ you the future corresponding to vector<double>. For example, we can set up two\
    \ tasks to add each of the elements of the vector using the standard-library accumulate()\
    \ (§17.3).\n\n```\ndouble accumulate(vector<double>::iterator beg, vector<double>::iterator\
    \ end, double init)\n// Compute the sum of [beg:end) with the initial value\n\
    {\n    return accumulate(&beg,&end,init);\n}\n\ndouble comp2(vector<double>& v)\n\
    {\n    packaged_task pt0(accum);                      // package the task (i.e.,\
    \ accum)\n    packaged_task pt1(accum);\n\n    future<double> f0 (pt0.future());\
    \               // get hold of pt0's future\n    future<double> f1 (pt1.future());\
    \               // get hold of pt1's future\n\n    double* first = &v[0];    \
    \                      // start a thread for pt0\n    thread thread1 (move(pt0),first,first+v.size()/2,2.0);\n\
    \    thread thread2 (move(pt1),first+v.size()/2,first+v.size(),0);\\ // start\
    \ a thread for pt1\n    // ...\n    return f0.get()+f1.get();                \
    \        // get the results\n```\n\nThe packaged_task template takes the type\
    \ of the task as its argument (here, double())) and the task as its constructor\
    \ argument (here, accum). The move() operations are needed because a packaged_task\
    \ cannot be copied. The reason is that packaged_task cannot be copied as it is\
    \ a resource handle: it owns its promise and (indirectly) responsible for whatever\
    \ results its task may have.\n\nPlease note the absence of explicit mention in\
    \ this code: when we are to concentrate on tasks to be done, rather than on the\
    \ mechanisms used to manage their communication. The two tasks will be run on\
    \ separate threads and thus potentially in parallel.\n\n# 18.5.3 async()\n\nThe\
    \ line of thinking I have pursued in this chapter is the one I believe to be the\
    \ simplest yet among the most powerful: treat a task as a function that may happen\
    \ run concurrently with other tasks. It is far from the only model supported by\
    \ the C++ standard library, but it serves well for a wide range of needs. More\
    \ subtle and tricky models (e.g., styles of programming relying on shared memory),\
    \ can be used as needed."
