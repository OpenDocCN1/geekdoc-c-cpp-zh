  md: '# Section 9.2 Standard-Library Components 121


    The main criteria for including a class in the library were that:


    +   - It could be helpful to almost every C++ programmer (both novices and experts).

    - It could be provided in a general form that did not add significant overhead
    compared to a simpler version of the same facility.

    - Simple uses should be easy to learn (relative to the inherent complexity of
    their task).


    Essentially, the C++ standard library provide the most common fundamental data
    structures together with the fundamental algorithms used on them.


    # 9.3 Standard-Library Organization


    The facilities of the standard library are placed in namespace std and made available
    to users through modules or headed files.


    # 9.3.1 Namespaces


    Every standard-library facility is provided through some standard header. For
    example:


    ```

    #include<string>

    #include<list>

    ```


    This makes the string and list available.


    The standard library is defined in a namespace std ($3.3) covered std. To use
    standard-library facilities, the std:: prefix can be used:


    ```

    std::string sheep ("Four Legs Good; two legs Baaaad!");

    std::list<string> align("War is Peace," Freedom is Slavery," "Ignorance is Strength");

    ```


    For brevity, I rarely use the std:: in examples. Neither do I include or import
    the necessary headers or modules. To compile and run the program fragments, you
    must make the relevant parts of the standard library available. For example:


    ```

    #include<string>          Il make the standard string facilities accessible

    using namespace std;       Il make names available without std::: prefix

    ```


    string s ("C++ is a general-purpose programming language"); Il OK: string is std::string


    It is generally poor to dump everything from a namespace into the global namespace.
    However, in this case, I use the standard library exclusively and it is good to
    know what it offers.


    The standard library offers several sub-namespaces to std that can be accessed
    only through an explicit:


    +   - std::chrono: all from chrono, including std::chrono::chrono_literals ($16.2).

    - std::literals::chrono_literals: suffixes y for years, d for days, h for hours,
    min for minutes, ms for milliseconds, s for seconds, and us for microseconds ($16.2).

    - std::literals::complex_literals: suffixes i for imaginary doubles, if for imaginary
    floats, and il for imaginary doubles ($6.6).

    - std::literals::string_literals: suffix s for strings ($6.6,$10.2).

    - std::literals::string_view_literals: suffix sv for string views ($10.3).'
