    \n# 15.1 Introduction\n\nC++ offers simple built-in low-level types to hold and\
    \ refer to data: objects and arrays hold data; pointers and arrays refer to such\
    \ data. However, we need to support both more specialized and more general ways\
    \ for holding and using data. For example, the standard-library containers (Chapter\
    \ 12) and iterators ($13.3) are designed to support general algorithms.\n\nThe\
    \ main commonality among the container and pointer abstractions is that their\
    \ correct and efficient use require encapsulation of data with a set of functions\
    \ to access and manipulate them. For example, pointers are very general and efficient\
    \ abstractions of machine addresses, using them correctly to represent ownership\
    \ of resources has proven excessively difficult. So, the standard-library offers\
    \ resource-management pointers; that is, classes that encapsulate pointers and\
    \ provide operations that simplify their correct use.\n\nThese standard-library\
    \ abstractions encapsulate built-in language types and are required to perform\
    \ as well in time and space as correct uses of those types."
