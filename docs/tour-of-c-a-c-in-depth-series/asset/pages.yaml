  md: "# 220 Utilities Chapter 16\n\nOften, we can define concepts that are more general\
    \ than the standard-library type predicates. Many standard-library type predicates\
    \ apply only to the built-in types. We can define a concept in terms of the operations\
    \ required, as suggested by the definition of Number (§8.2.4).\n\n```\ntemplate-typename\
    \ T, typename U = T;\nconcept Arithmetic = Number<T,U> && Number<U,T>;\n```\n\n\
    Most often, use of standard-library type predicates are free in the implementation\
    \ of fundamental services, unless to distinguish cases for optimization. For example,\
    \ the example of std::copy(iter1, iter2) could optimize the important case of\
    \ contiguous sequences of simple types, such as\n\n```\ntemplate<class T>\nvoid\
    \ copy1(T* first, T* last, T* target)\n{\n  if constexpr(first, target, (last\
    \ - first) * sizeof(T))\n    memcpy(first, target, (last - first) * sizeof(T));\n\
    \  else\n    while (first != last) *target++ = *first++;\n}\n```\n\nThat simple\
    \ optimization beats its non-optimized variant by about 50% on some implementations.\
    \ Do not indulge in such cleverness unless the standard doesn't always do better.\
    \ Hand-optimized code is typically less maintainable than simpler alternatives.\n\
    \n# 16.4.2 Conditional Properties\n\nConsider defining a \"smart pointer\":\n\n\
    ```\ntemplate-typename T>\nclass Smart_pointer {\n// ...\nT& operator() const;\n\
