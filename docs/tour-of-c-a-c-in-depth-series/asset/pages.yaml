    \ functions is an art and often requires knowledge of the data to which it will\
    \ be applied. Creating a new hash function by combining existing hash functions\
    \ exclusive-or (^) is simple and often very effective. However, be careful to\
    \ ensure that every value that takes part in the hash helps to distinguish the\
