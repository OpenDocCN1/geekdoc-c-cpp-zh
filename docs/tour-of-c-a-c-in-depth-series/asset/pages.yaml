    # 7.1 Introduction


    Someone who wants a vector is unlikely always to want a vector of doubles. A vector
    is a general concept, independent of the notion of a floating-point number. Consequently,
    the element type of a vector ought to be represented independently. A template
    is a class or a function that we parametri with a set of types or values. We use
    templates to represent ideas that are best understood as something general from
    which we can generate specific types and functions by specifying arguments, such
    as double vector''s element type.


    This chapter focuses on language mechanisms. Chapter 8 follows up with programming
    techniques, and the library chapters (Chapters 10–18) offer many examples.'
