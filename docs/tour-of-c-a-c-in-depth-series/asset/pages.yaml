    to handle the problem; §16.8.


    +   [20] Throw an exception from a function if the immediate caller cannot be
    expected to handle the problem; §16.8.


    +   [21] Call exit(), quick_exit(), or terminate() to exit a program if an attempt
    to recover from a problem is not reasonable; §16.8.


