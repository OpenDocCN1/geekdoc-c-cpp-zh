    form of mathematics.


    # 1.9.1 Assignment


    Assignment of a built-in type is a simple machine copy operation. Consider:


    ```

    int x = 2;

    int y = 3;

    x = y;

    // Il x becomes 3; so we get x=y

    ```


    This is obvious. We can represent graphically this:


