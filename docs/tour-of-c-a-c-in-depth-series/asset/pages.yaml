  md: "# Section 15.2.1 unique_ptr and shared_ptr 199\n\nNow, the file opened by fp's\
    \ constructor will be closed by the last function (explicit or implicitly) destroy\
    \ its copy of fp. Note that f() and g() may spawn a task holding a copy of fp\
    \ or in some other way a copy outlines user(). Thus, shared_ptr prevents a forage\
    \ garbage collection that respects the destructor-base resource management of\
    \ the memory-managed objects. Its cost is neither free nor expensive, but does\
    \ make the lifetime of the shared object hard to predict. Use shared_ptr only\
    \ when you need shared ownership.\n\nCreating an object on the free store and\
    \ then passing the pointer to it a smart pointer is more verbose. It also allows\
    \ for mistakes, such as for passing a pointer to a unique_ptr or giving a pointer\
    \ to something that is not on the free store to a shared_ptr. To avoid such problems,\
    \ the standard library (<memory>) provides functions for constructing an object\
    \ and returning an appropriate smart pointer, make_shared() and make_unique().\
    \ For example:\n\n```\nstruct S {\n int;\n string s;\ndouble d;\n // ...\n};\n\
    ```\n\n```\nauto p1 = make_shared<S>(1,\"Ankh Morpork\",4.65); // p1 is a shared_ptr<S>\n\
    auto p2 = make_unique<S>(2,\"Oz\",7.62); // p2 is a unique_ptr<S>\n```\n\nNow,\
    \ p2 is a unique_ptr<S> pointing to a free-store-allocated type of S with the\
    \ value (2,\"Oz\",7.62).\n\nUsing make_shared() is not just more convenient than\
    \ making an object using new and passing it to a shared_ptr - it is also much\
    \ more efficient because it does not need a separate allocation for the count\
    \ that is essential in the implementation of a shared_ptr. Given unique_ptr and\
    \ shared_ptr, we can implement a complete \"no naked new\" policy (§5.2.2) for\
    \ many programs. However, \"smart pointers\" are still conceptually pointers and\
    \ therefore after counters and other types that manage their resources at a higher\
    \ conceptual level. In particular, shared_ptr do not implement in themselves any\
    \ rules for which their owners can read and/write shared data. Data races (§18.5)\
    \ and other forms of confusion are not addressed simply by eliminating the resource\
    \ management issues.\n\nWhen we use \"smart pointers\" rather than unique_ptr\
    \ handles with operations designed specifically for the resource (such as vector\
    \ or thread)? Unnprisingly, the answer is \"when we need pointer semantics.\"\n\
    \n+   - When we have multiple pointers, we need pointers (or references) to refer\
    \ to the shared object, so that shared_ptr becomes the obvious choice (unless\
    \ there is an obvious single owner).\n- When we refer to a polymorphic object\
    \ in classical object-oriented code (§5.5), a pointer (or a reference) becomes\
    \ because we don't know the exact type of the object referred to (or its size),\
    \ so unique_ptr becomes the obvious choice.\n- A polymorphic object typically\
    \ requires shared_ptrs.\n\nWe do not need to use a pointer to return a collection\
    \ of objects from a function; a container that is a resource handle will do sufficiently\
    \ and efficiently by relying on copy elution (§3.4.2) and move semantics (§6.2.2)."
