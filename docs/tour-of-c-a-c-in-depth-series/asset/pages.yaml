    of C and C++; \$19.3.2.1; [CG: CPL.2].

    [12] When converting a C program to C++, cast the result of malloc() to the proper
    type or change all uses of malloc() to of new; \$19.3.2.2.

    [13] When converting from malloc() to free() to new and delete, consider using
    vector, push_back(), and reserve instead of realloc(); \$19.3.2.1.

    [14] In C++, there are no implicit conversions from to enumerations; use explicit
    type conversion where necessary.

