  md: "# Section 12.2 vector 159\n\n```\nvector<int> v1 = {1, 2, 3, 4};\nvector<string>\
    \ v2;\nvector<Shape> v3(23);\nvector<double> v4(32,9.9);\n```\n\nAn explicit size\
    \ is included in parentheses, (23), and by default, the elements are initialized\
