    \ is its default constructor. By defining a default constructor you eliminate\
    \ the possibility of uninitialized variables of type.\n\nThe const specifiers\
    \ on the returning type and arguments indicate that these functions do not modify\
    \ the object for which they are called. A const member function can be invoked\
    \ for both const and non-const objects, but a non-const member function can only\
