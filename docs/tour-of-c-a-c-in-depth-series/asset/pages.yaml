    \ overhead. In particular, we can achieve strong resource safety; that is, we\
    \ can eliminate leaks for a general notion of a resource. Examples are vectors\
    \ holding memory, threads holding system threads, and fstreams handling files.\n\
    \nIn many languages, resource management is primarily delegated to a garbage collector.\
    \ In C++, you can plug in a garbage collector. However, I consider garbage collection\
    \ the last choice after cleaner, more general, and better alternatives to resource\
    \ management have been exhausted. My ideal is not to create any garbage, eliminating\
    \ the need for a garbage collector: Do not litter!\n\nGarbage collection is fundamentally\
    \ a global memory management scheme. Clever implementations can compensate, but\
    \ systems are more distributed (thinned caches, multicores, and clusters), locality\
    \ is more important than ever.\n\nAlso, memory is not the only resource. A resource\
    \ is anything that has been acquired and released (explicitly or implicitly) after\
