  md: "# Section 7.3.2 Function Objects\n\n```\nvoid f(const Vector<int>& vec, const\
    \ list<string>& lst, int x, const string& s)\n{\n    cout << \"number of values\
    \ less than \" << x << \";\" << count(vec,Less_than(x)) << '\\\n';\n    cout <<\
    \ \"number of values less than \" << s << \";\" << count(lst,Less_than(s)) <<\
    \ '\\\n';\n}\n```\n\nHere, Less_than(x) constructs an object of type Less<int>,\
    \ for which the value operator compares to the value of the int called; Less_than(s)\
    \ constructs an object that compares to the value of the string s.\n\nThe beauty\
    \ of function objects is that they carry the value to be compared against them,\
    \ and we don't have to write a separate function for each value (and each type),\
    \ and we don't have to introduce nasty global variables to hold values. Also,\
    \ for a simple function like Less_than, inlining a call to Less_than is far more\
    \ efficient than an indirect function call. The ability to carry data plus its\
    \ efficiency makes function objects particularly useful as arguments to algorithms.\n\
    \nFunction objects used to specify the meaning of key operations of a general\
    \ algorithm (such as Less_than for count(x)) are sometimes referred to as policy\
    \ objects.\n\n# 7.3.3 Lambda Expressions\n\nIn 7.3.2, we defined Less_than separately\
    \ from its use. That can be inconvenient. Consequently, there is a notation for\
    \ implicitly generating function objects:\n\n```\nvoid f(const Vector<int>& vec,\
    \ const list<string>& lst, int x, const string& s)\n{\n    cout << \"number of\
    \ values less than \" << x\n    cout << \" : \" << count(vec,[&](int a){ return\
    \ a<x; })\n    cout << \"number of values less than \" << s\n    cout << \" :\
    \ \" << count(lst,[&](const string& a){ return a<s; })\n    cout << '\\\n';\n\
    }\n```\n\nThe [&](int a){ return a<x; } is a lambda expression. It generates a\
    \ function object similar to Less_than<int>. The [&] is a capture list specifying\
    \ that all names used in the lambda body (such as x) are accessed through reference.\
    \ Had we wanted to \"capture\" only x, we could have said: [&]. Had we wanted\
    \ to generate the generated object by copy of x, we could have said: [x]. Capture\
    \ nothing is [], capture all local names by reference is [&], and capture all\
    \ local names used by value is [-].\n\nFor a lambda defined within a member function,\
    \ [this] captures the current object by reference so that if we want a copy of\
    \ the current object, we say [this].\n\nIf we want to capture specific objects,\
    \ we can list them. The use of [i,this] in the use of expect()($4.5) is an example."
