    # 15.5 Advice


    +   [1] A library doesnt has to be large or complicated to be useful; §16.1.

    [2] A resource is anything that has to be acquired and (explicitly or implicitly)
    released; §15.2.1.

    [3] Use resource handles with specific semantics (RAII); §15.2.1; [CG: R.1].

    [4] The problem with a T* is that it can be used to represent anything, so we
    cannot easily determine a “raw” pointer''s purpose; §15.2.1.

    [5] Use unique_ptr to refer to objects of polymorphic type; §15.2.1; [CG: R.20].

    [6] Use shared_ptr to refer to shared objects (only); §15.2.1; [CG: R.20].

    [7] Prefer resource handles with semantics to smart pointers; §15.2.1.

    [8] Don''t use a smart pointer where a local variable will; §15.2.1.

    [9] Use unique_ptr or shared_ptr as arguments or return values to transfer ownership
    responsibility; §15.2.1; [CG: F.26]; [CG: F.27].

    [10] Use make_unique() to construct unique_ptr; §15.2.1; [CG: R.22].

    [11] Use make_shared() to construct shared_ptr; §15.2.1; [CG: R.23].

    [12] Prefer smart pointers to garbage collection; §15.2.1.

    [13] Prefer spans to pointer-plus-count interfaces; §15.2.2; [CG: F.24].

    [14] span supports range-for; §15.2.2.

    [15] Use array when you need a sequence with a constexpr size; §15.3.1; [CG: SL.2].

    [16] Use bitset if you need N bits is not the number of bits in a built-in integer
    type; §15.3.2.

    [17] Don''t use pair and tuple; structs often lead to more readable code; §15.3.3.

    [18] When using pair, use template argument or make_pair() to avoid redundant
    type specification; §15.3.3.

    [19] When using tuple, use template argument or make_tuple() to avoid redundant
    type specification; §15.3.3; [CG: T.44].

    [20] Prefer variant to explicit use of unions; §15.4.1; [CG: C.181].

    [21] When selecting an object using a variant, consider using visit() and overloaded();
    §15.4.1.

    [22] If more than one alternative is possible for a variant, optional, or any,
    check the tag before access; §15.4.'
