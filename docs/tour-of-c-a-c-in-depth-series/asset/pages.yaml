  md: '# 19.1.3 The ISO C++ Standards


    The explosive develoop growth of C++ use caused some changes. During 1987, it
    became clear that the formal standardization of C++ was inevitable and that we
    needed to lay the groundwork for a standardization effort [Stroustrup,1994]. The
    result was a conscious effort to maintain contact between implementers of C++
    compilers and their major users. This was done through paper and electronic mail
    and through face-to-face meetings at C++ conferences and elsewhere.


    AT&T Bell Labs made a major contribution to C++ and its wider community by allowing
    me to share drafts of revised versions of the C++ reference manual with implementers
    and users. Because of the many people who worked for changes could be seen as
    competing with AT&T, the significance of this contribution would not be underestimated.
