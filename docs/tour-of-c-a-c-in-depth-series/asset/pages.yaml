    \ patn }; // initializer alternatives\nvoid user(init_mode m, int n, vector<int>&\
    \ arg, Iterator p, Iterator q) {\n    vector<int> v;\n    // messy initialization\
    \ code:\n    switch (m) {\n        case zero:\n            v = vector<int>(n);\
    \ // n elements initialized to 0\n            break;\n        case cpy:\n    \
    \        v = arg;\n            break;\n    }\n    if (m == seq)\n        v.assign(p,q);\
    \ // copy from sequence [p:q]\n    // ...\n}\n```\n\nThis is a stylized example,\
    \ but unfortunately atypical. We need to select among a set of alternatives for\
    \ initializing a data structure (here v) and we need to do different computations\
    \ for different alternatives. Such code is often messy, deemed essential “for\
    \ efficiency,” and a source of bugs:\n\n+   - The variable could be used before\
    \ it gets its intended value."
