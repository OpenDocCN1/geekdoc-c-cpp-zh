  md: "# Section 10.4.2\n\n# Regular Expression Notation\n\n# 135\n\n| Regular Expression\
    \ Grouping Examples |\n|---|\n| `\\d=\\w+` | No groups (subpatterns) |\n| `(\\\
    d)=\\s(\\w+)` | Two groups |\n| `(\\d+)(\\s(\\w+))` | Two groups (groups do not\
    \ nest) One group; or more subpatterns; |\n| `(?=\\s\\w+)` | only the last subpattern\
    \ is saved as a sub_match |\n| `<(\\w+)>(.*?)</\\1>` | Three groups; the `\\1`\
    \ means \"same as group 1\" |\n\nThat last pattern is used for parsing XML. It\
    \ finds tag/end-of-tag markers. Note that I used a non-greedy match `.*?`, for\
    \ the subpattern between the start and the end tag. Had I used plain `.*`, this\
    \ input would have caused a problem:\n\n> Always on the <<b>side of</b> <b>life</b>.>\n\
    \nA greedy match for the first subpattern would match the first `<` with the last\
    \ `>`. That would be correct, unlike what the programmer wanted. For a more exhaustive\
    \ presentation of regular expressions, see [Friedl,1997].\n\n# 10.4.3 Iterators\n\
    \nWe can define a regex_iterator for iterating over a sequence of characters finding\
    \ matches for a pattern. For example, we can use a sregex_iterator (a regex_iterator<string>)\
    \ to output all whitespace-separated words in a string:\n\n```\nvoid test() {\n\
    \  string input = \"aa as, asdf++asdfg\";\n  regex pat(R\"(\\s+(\\w+))\");\n \
    \ for (sregex_iterator p(input.begin(),input.end(),pat); p!=sregex_iterator();\
    \ ++p)\n    cout << (*p)[1] << ''\\n';\n}\n```\n\nThis outputs:\n\n+   as\nasd\n\
    asdfg\n\nWe missed the first word, aa, because it has no preceding whitespace.\
