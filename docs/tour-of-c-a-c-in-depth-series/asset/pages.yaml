  md: '# Strings and Regular Expressions


    followed by an optional C like this:


    ```

    A+B+C$$

    ```


    Examples that match:


    ```

    AAAAAAAAAAAAABBBBBBC

    BC

    B

    ```


    Examples that do not match:


    ```

    AAAAA // no B

    AAABC // no initial space

    AABBCC // too many Cs

    ```


    A part of a pattern is considered a subpattern (which can be extracted separately
    from an smatch) if it is enclosed in parentheses. For example:


    ```

    \d+-\d+ // no subpattern

    \d+(-\d+) // one subpattern

    (\d+)(\d+) // two subpatterns

    ```


    A pattern can be optional or repeated (the default is exactly once) by a suffix:


    # Repetition


    | { n } | Exactly n times or more times |

    | { n,m } | At least n and at most m times |

    | - | Zero or more, that is, {0} |

    | + | One or more, that is, {1} |

    | ? | Optional (zero or one), that is {0,1} |


    For example:


    ```

    A(3)B(2,4)*

    ```


    Examples that match:


    ```

    AAABC

    AAABB

    ```


    Examples that do not match:


    ```

    AABC // too few As

    AAAC // too few Bs

    AAAAABBBCCCC // too many Bs

    ```


    A suffix ? after any of the repetition notations (*, +, {}) makes the pattern
    matcher "lazy" or "non-greedy." That is, looking for a pattern, it will look for
    the shortest match rather than the longest. By default, the pattern matcher always
    looks for the longest match; this is known as the Max Munch rule. Consider:


    ```

    ababab

    ```'
