    The pattern (ab)+ matches all of ababab. However, (ab)? matches only the first
    ab.

    The most common character classifications have names:


    | Character Classes |

    |---||

    | alnum | Any alphanumeric character |

    | alpha | Any alphabetic character |

    | blank | Any whitespace character that is not a line separator |

    | cntrl | Any control character |

    | d | Any decimal digit |

    | digit | Any decimal digit |

    | graph | Any graphical character |

    | lower | Any lowercase character |

    | print | Any printable character |

    | punct | Any punctuation character |

    | s | Any whitespace character |

    | space | Any whitespace character |

    | upper | Any uppercase character |

    | w | Any word character (alphanumeric plus the underscore) |

    | xdigit | Any hexadecimal digit character |


    In a regular expression, a class name must be bracketed by [ : ]. For example,
    [:digit:] matches a decimal digit. Furthermore, they must be used within [ ] pairing
    a character class. Several classes are supported by notation:


    | Character Class Abbreviations |

    |---||

    | \d | [[:digit:] |

    | \s | [[:space:]] |

    | \w | A letter (a-z) or digit (0-9) or underscore (_) [[:alnum:]] |

    | \D | Not \d [[:digit:]] |

    | \S | Not \s [[:space:]] |

    | \W | Not \w [[:alnum:]] |


    In addition, languages supporting regular expressions often provide:


    | Nonstandard (but Common) Character Class Abbreviations |

    |---||

    | \u | A lowercase character [[:lower:]] |

    | \U | An uppercase character [[:upper:]] |

    | \L | Not \u [[:lower:]] |

    | \W | Not \u [[:upper:]] |


    For full portability, use the class names rather than these abbreviations.

