    # 19.3.2.3 Linkage


    C and C++ can be (often) implemented to use different linkage conventions. The
    most basic reason for that is C++s greater emphasis on type checking. A practical
    reason is that C++ supports overloading, so there can be two global functions
    called open(). This has been reflected in the way the linker works.


    To give a C++ function C linkage (so that it can be called from a C program fragment)
    or to allow a function to be called from a C++ program fragment, declare it extern
    "C". For example:


    ```

    extern "C" double sqrt(double);

    ```


    Now sqrt(double) can be called from a C or a C++ code. The definition of sqrt(double)
    can also be compiled as a C function or as a C++ function.


    Only one function of a given name in a scope can have C linkage (because C doesn''t
    allow function overloading). A linkage specification does not affect type checking,
    the C++ rules for function calls still apply to a function declared extern "C".


