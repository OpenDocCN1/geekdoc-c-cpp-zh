    The {} initialization syntax (§12.2) is conventional for when we don't want to\
    \ use initializer_list.\nThe effects of deduction guides are often subtle, so\
    \ it is best to design class templates so that deduction guides are not needed.\n\
    People like acronyms refer to \"class template argument deduction\" as CTAD.\n\
    \n# 7.3 Parameterized Operations\n\nTemplates have more uses than simply parameterizing\
    \ a container with an element type. They are extensively used for parameterization\
    \ of both types and algorithms in the standard library (§12.8, §13.5).\nThere\
    \ are three ways of expressing an operation parameterized by types or values:\n\
    \n+   * A function template\n* A function object: an object that can carry data\
    \ and be called like a function\n* A lambda expression: a shorthand notation for\
    \ a function object\n\n# 7.3.1 Function Templates\n\nWe can write a function that\
    \ calculates the sum of the element values of any sequence that a range-for can\
    \ traverse (e.g., a container) like this:\n\n```\ntemplate<typename Sequence,\
    \ typename Value>\nValue sum(const Sequence& x, Value v)\n{\n    v+=x;\n    return\
    \ v;\n}\n```\n\nThe Value template allows the function and the argument v are\
    \ to allow the caller to specify the type and input value of the accumulator (the\
    \ function in which to calculate the sum):\n\n```\nvoid sum(vector<int>& vi, list<double>&\
    \ ld, vector<complex<double>>& vc)\n{\n    int x = sum(vi,0.0);\n    double d\
    \ = sum(ld,0.0);\n    double dd = sum(ld,0.0);\n    auto z = sum(vc,complex(0.0,0.0));\n\
    }\n```\n\nIl sum of a vector of ints (add ints)\nIl sum of a vector of ints (add\
    \ doubles)\nIl sum of a list of doubles\nIl sum of a vector of complex<double>s\n\
    \nThe point of adding ints in a double would be gracefully handle a large sum\
    \ than the largest int. Note how the types of template arguments for sum<Sequence,Value>\
    \ are deduced from the function arguments. Fortunately, we do not need to explicitly\
    \ specify those types."
