    \ of strings can depend critically on the run-time environment. In particular,\
    \ multi-threaded implementations, memory allocation can be relatively costly.\
    \ Also, when lots of strings of differing lengths are used, memory fragmentation\
    \ can result. These are the main reasons that the short-string optimization has\
    \ become ubiquitous.\n\nTo handle multiple character sets, string is really an\
