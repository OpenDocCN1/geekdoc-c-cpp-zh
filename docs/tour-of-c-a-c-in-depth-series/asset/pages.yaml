  md: "168 Containers Chapter 12\n\n```\nvoid producer() {\n  for (int n = 0; n!=LOTS;\
    \ ++n) {\n    scoped_lock lk(m);\n    // m is a mutex ($18.3)\n    q.push_back(allocate<Event,\
    \ pmr::polymorphic_allocator<Event>>(&pool));\n    cv.notify_one();\n  }\n}\n\
    ```\n\nNow, after 100,000 events have been passed among 16 producers and 4 consumers,\
    \ less than 3MB of memory has been consumed. That's about a 2000-fold improvement!\
    \ Naturally, the amount of memory actually in use (as opposed to memory wasted\
    \ to fragmentation) is unchanged. After eliminating fragmentation, memory was\
    \ stable until the system could run for months. Techniques like this have been\
    \ applied with good effects from the earliest days of C++, but generally their\
    \ required code to be rewritten to use specialized containers. Now, the standard\
    \ for containers is to use new and delete. Other polymorphic resources include\n\
    \n+   - unsynchronized_polymorphic_resource; like polymorphic_resource can only\
    \ be used by one thread.\n- monotonic_polymorphic_resource; as a fast allocator\
    \ that releases memory only upon its destruction and can only be used by one thread.\n\
    \nA polymorphic resource must be derived from memory_resource and define members\
    \ allocate(), deallocate(), and is_equal(). The idea is for users to build their\
    \ own resources to tune code.\n\n# 12.8 Container Overview\n\nThe standard library\
    \ provides some of the most general and useful container types to allow the programmer\
    \ to select a container that best serves the needs of an application:\n\n| Standard\
    \ Container Summary | |\n|--- | :--- |\n| vector<T> | A variable-size vector ($12.2)\
    \ |\n| list<T> | A doubly-linked list ($12.3) |\n| forward_list<T> | A singly-linked\
    \ list |\n| deque<T> | A double-ended queue |\n| map<K,V> | An associative array\
    \ ($12.5) |\n| multimap<K,V> | A map in which a key can occur many times |\n|\
    \ unordered_map<K,V> | A map using a hashed lookup ($12.6) |\n| unordered_multimap<K,V>\
    \ | A multimap using a hashed lookup |\n| set<T> | A set (map with a key and no\
    \ value) |\n| multiset<T> | A set in which a value can occur many times |\n| unordered_set<T>\
    \ | A set using a hashed lookup |\n| unordered_multiset<T> | A multiset using\
    \ a hashed lookup |\n\nThe unordered containers are optimized for lookup with\
    \ a key (often a string); in other words, they are hash tables."
