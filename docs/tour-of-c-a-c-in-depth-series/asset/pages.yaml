  md: "# 246 Concurrency Chapter 18\n\nIf we have a future<X> fx, we can get() a value\
    \ of X from it:\n\n```\nX v = fx.get(); // If necessary, wait for the value to\
    \ be computed\n```\n\nIf the value isn't there, our thread is blocked until it\
    \ arrives. If the value couldn't be computed, get() might throw an exception (from\
    \ the system or transmitted from the promise).\n\nThe main purpose of a promise\
    \ is to provide \"put\" operations (called set_value() and set_exception()) to\
    \ match future(). The names \"future\" and \"promise\" are historical; please\
    \ don't blame or credit them. They are another fertile sort of puns.\n\nIf you\
    \ have a promise and need to send a result of X to a future, you can do one of\
    \ two ways: pass a value or a caught exception. For example:\n\n```\nvoid f(promise<X>&\
    \ px) // A task: place the result in px\n{\n    // ...\n    try {\n        X res;\n\
    \        // ... compute a value for res ...\n        px.set_value(res);\n    }\
    \ catch (...) {\n        // oops: couldn't compute res\n        px.set_exception(current_exception());\
    \ // Il pass the exception to the future's thread\n    }\n}\n```\n\nThe current_exception()\
    \ function refers to the caught exception.\n\nTo deal with an exception transmitted\
    \ through a future, the caller of get() must be prepared to catch it somewhere.\
    \ For example:\n\n```\nvoid g(future<X>& fx) // A task: get the result from fx\n\
    {\n    // ...\n    try {\n        X v = fx.get(); // If necessary, wait for the\
    \ value to be computed\n        // ... use v ...\n    } catch (...) {\n      \
    \  // oops: someone couldn't compute v\n        // ... handle error ...\n    }\n\
    }\n```\n\nIf the error isn't handled by g() itself, the code reduces to the minimal:\n\
    \n```\nvoid g(future<X>& fx) // A task: get the result from fx\n{\n    // ...\n\
    \    X v = fx.get(); // If necessary, wait for the value to be computed\n    //\
    \ ... use v ...\n}\n```\n\nNow, an exception thrown from fx()'s function f() is\
    \ implicitly propagated to g()'s caller, exactly as it would have been had g()\
    \ called f() directly."
