  md: "# Concurrency\n\nusing namespace chrono; // see §16.2.1\n\n```\nauto t0 = high_resolution_clock::now();\n\
    this_thread::sleep(milliseconds(20));\nt1 = high_resolution_clock::now();\n```\n\
    \n```\ncout << duration_cast<nanoseconds>(t1-t0).count() << \" nanoseconds passed!\\\
    n\";\n```\n\nI didn't have to wait for a thread; by default, this_thread can wait\
    \ to refer to the one other. I used duration cost to adjust the clock's units\
    \ to the nanoseconds I wanted.\nThe basic support for communicating using external\
    \ events is provided by condition_variables found in <condition_variable>. A condition_variable\
    \ is a mechanism allowing to wait for another. In particular, it allows a thread\
    \ to wait for some condition (often an event) to occur as the result of work done\
    \ by other threads.\nUsing condition_variables supports many forms of elegant\
    \ and efficient but can be tricky. For simplicity, I used the queue and the mechanism\
    \ for avoiding race conditions on that queue. queue global to the producer and\
    \ consumer\n\n```\nclass Message {\n  // Object to be communicated\n  // ...\n\
    };\n```\n\n```\nqueue<Message> mqueue;\ncondition_variable mcond;\nmutex mutex;\n\
    // the queue of messages\n// the variable communicating events\n// for synchronizing\
    \ access to mcond\n```\n\nThe types queue, condition_variable, and mutex are provided\
    \ by the standard library.\nThe consumer() waits and processes Messages:\n\n```\n\
    void consumer() {\n  while(true) {\n    unique_lock lck(mutex);\n    mcond.wait(lck,\
    \ []{ return !mqueue.empty(); });\n    // acquire mutex\n    // release mutex\
    \ and wait;\n    // re-acquire mutex upon wakeup\n    // don't wake up unless\
    \ mqueue is non-empty\n    auto m = mqueue.front();\n    mqueue.pop();\n    lck.unlock();\n\
    \    // get the message\n    // ... process m\n  }\n}\n```\n\nHere, explicitly\
    \ protect the operations on the queue and on the condition_variable with unique_lock\
    \ on the mutex. Waiting on a condition_variable releases its lock argument until\
    \ the wait is over (so that the queue is non-empty) and then reacquires it. The\
    \ explicit check of the condition, here !mqueue.empty(), protects against waking\
    \ up just to find that some other task has “gotten there” so that the condition\
    \ no longer holds."
