    \nIn the first volume of The Art of Computer Programming, Donald Knuth praises\
    \ the usefulness of coroutines, but also bemoans that it is hard to give brief\
    \ examples because coroutines are most useful in simplifying complex systems.\
    \ I will just give a trivial example exercising the primitives needed for the\
    \ kind of event-driven simulations that a major reason for C++ early success.\
    \ The key idea is to represent a system as a network of simple tasks (coroutines)\
    \ that collaborate to complete complex tasks. Basically, each task is an actor\
    \ that performs a small part of a large of effort. Some designs that produce streams\
    \ of requests (possibly using random number generators, feeding real-world data),\
    \ some parts of network computing results, and some generate output. I personally\
    \ prefer the tasks (coroutines) to communicate through message queues. One way\
    \ to organize such a system is for each task to place itself on an event queue\
    \ waiting for more work after producing a scheduler then picks the next task to\
    \ run from the event queue when needed. This is a form of cooperative multitasking.\
    \ I borrowed – with acknowledgment – the key ideas from Simula [Dahl,1970] to\
    \ form the basis for the very first C++ library ($19.2).\n\nThe keys to designs\
    \ are\n\n+   * Many different coroutines that maintain their state between calls.\n\
    * A form of polymorphism allows us to keep lists of events containing different\
    \ kinds of coroutines and keep them independent of their threads.\n* A scheduler\
    \ that selects the next coroutine(s) to run from the list(s).\n\nHere, I use just\
    \ a couple of coroutines and execute them alternatively. It is essential for systems\
    \ not to use too much space. That's why we dont use processes or threads for applications.\
    \ A thread requires a megabyte or two (mostly for its stack), a coroutine often\
    \ only a couple of dozen bytes. If you need thousands of tasks, that can make\
    \ a big difference. Context switching between coroutines is also far faster than\
    \ threads or processes.\n\nFirst, we need some run-time polymorphism to allow\
    \ us to call dozens or hundreds of kinds of coroutines uniformly:\n\n```\nstruct\
    \ Event_base {\n    virtual void operator() = 0;\n    virtual ~Event_base() {}\n\
