    \ If you don't want the default value, you can specify one as a second argument\
    \ (e.g., 9.9 for the 32 elements v4).\n\nThe initial size can be changed. One\
    \ of the most useful operations on a vector is push_back(), which adds a new element\
    \ to the end of a vector, increasing its size by one. For example, assuming what\
    \ we have defined >> Entry, we can write:\n\n```\nvoid input() {\n    for (Entry\
    \ e : ele);\n        phone_book.push_back(e);\n}\n```\n\nThis reads Entries from\
    \ the standard input into phone_book until the end-of-input (e.g., of a file)\
    \ is reached or the input operation encounters an error.\n\nThe standard-library\
    \ vector is implemented so that growing a vector by repeated push_back() is efficient.\
    \ To show how, consider an elaboration of the simple Vector from Chapter 5 and\
    \ Chapter 7 using the representation indicated in the diagram below:\n\n```\n\
    template<typename T> alloc;\nclass Vector {\n    allocator alloc_; // standard-library\
    \ allocator of Ts\n    T* ele; // pointer to first element\n    T* space; // pointer\
    \ to first unused (unused) slot\n    T* last; // pointer to last slot\npublic:\n\
    \    // ...\n    int size() const { return last-ele; } // number of elements\n\
    \    int capacity() const { return last-ele; } // number of slots available for\
    \ elements\n    // ...\n    void reserve(int newsz); // increase capacity() to\
    \ newsz\n    // ...\n    void push_back(const T& t); // copy t into Vector\n \
    \   void push_back(T&& t); // move t into Vector\n```\n\nThe standard-library\
    \ vector has capacity(), reserve(), and push_back(). The reserve() method allocates\
    \ new memory to make room for more elements. It may have to allocate new memory\
    \ and when it does, it moves the elements to the new allocation. When reserve()\
    \ moves elements to a larger allocation, any pointers to those elements will point\
    \ to the wrong location; they become invalidated and should not be used.\n\nGiven\
    \ capacity() and reserve(), implementing push_back() is trivial:"
