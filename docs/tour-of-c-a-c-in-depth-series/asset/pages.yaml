    # 5.1.1 Classes


    The central language feature of C++ is the class. A class is a user-defined type
    provided to represent an entity in the code of a program. When our design for
    a program has a useful idea, entity, collection of data, etc., we try to represent
    it as a class in the program so that the idea is in the code, rather than just
    in ours, in a design document, or some comments. A program built out of a well-chosen
    set of classes is easier to understand and get right than one that builds everything
    directly in the built-in types. In particular, classes are often wider than others.
    Essentially languages beyond fundamental types, operators, and statements are
    easier to define better classes or to use them more conveniently. "better," I
    mean more, easier to maintain, more efficient, more elegant, easier to read, and
    easier to reason about. Most programming techniques rely on the design and implementation
    of specific kinds of classes. The needs and tastes of programmers vary immensely.
    Consequently, the support for classes is extensive. Here, we consider the basic
    support for three important kinds of classes:


    +   - Concrete classes ($5.2)

    - Abstract classes ($5.3)

    - Classes in class hierarchies ($5.5)


    An astounding number of useful classes turn out to be one of these three kinds.
    More classes can be as simple variants of these kinds or implemented using combinations
    of the techniques used for these.


    # 5.2 Concrete Types


    The basic idea of concrete classes is that they behave "like built-in types."
    For example, a complex number type and an infinite-precision integer are much
