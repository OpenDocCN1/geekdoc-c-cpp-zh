  md: "# 18\n\n# Concurrency\n\n> Keep it simple:\nas simple as possible,\nbut no\
    \ simpler.\n  – A. Einstein\n\n+   * Introduction\n* Tasks and threads\n  Passing\
    \ Arguments; Returning Results\n* Sharing Data\n  mutexes and Locks; atomics\n\
    * Waiting for Events\n* Communicating Tasks\n  future and promise; packaged_task;\
    \ async(); Stopping a thread\n* Coroutines\n  Cooperative Multitasking\n* Advice\n\
    \n# 18.1 Introduction\n\nConcurrency – the execution of several tasks simultaneously\
    \ – widely used to improve throughput (by using several processors for a single\
    \ computation) or to improve responsiveness (by allowing one part of a program\
    \ to progress while another is waiting for a response). All modern programming\
    \ languages provide support for this. The support provided the C++ standard library\
    \ is a portable and thread-safe variant of what has been used in C++ for more\
    \ than 20 years and is almost universally supported by modern hardware. The standard-library\
    \ is primarily aimed at supporting systems-level concurrency rather than directly\
    \ providing sophisticated higher-level concurrency models; those can be supplied\
    \ as libraries built using the standard-library facilities."
