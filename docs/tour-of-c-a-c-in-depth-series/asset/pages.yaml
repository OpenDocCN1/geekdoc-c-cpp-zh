  md: '# 182 Algorithms Chapter 13


    The standard library provides many dozens of algorithms. The algorithms are defined
    in namespace std and presented in the <algorithm> and <numeric> headers. These
    standard-library algorithms take sequences as input. A half-open sequence from
    b to e is referred to as [b:e). Here are few examples:


    # Selected Algorithms <algorithm>


    | f_each(b,e,f) | For each element x in [b:e) do f(x) |

    | find(b,e,x) | p is the first p in [b:e) so that p==x |

    | find_if(b,e,f) | p is the first p in [b:e) so that f(p) |

    | count(b,e,x) | n is the number of elements q in [b:e) so that q==x |

    | count_if(b,e,f) | n is the number of elements q in [b:e) so that f(q) |

    | replace(b,e,v,v2) | Replace elements v with v2 |

    | replace_if(b,e,f,v,2) | Replace elements q in [b:e) so that f(q) with v2 |

    | copy(b,e,out) | Copy [b:e) to [out:p) |

    | copy_if(b,e,out,f) | Copy elements q from [b:e) so that f(q) to [out:p) |

    | move(b,e,out) | Move [b:e) to [out:p) |

    | unique_copy(b,e,out) | Copy [b:e) to [out:p); don''t copy adjacent duplicates
    |

    | sort(b,e) | Sort elements of [b:e) |

    | sort(b,e,f) | Sort elements of [b:e) using f as the sorting criterion |

    | [p1,p2)=equal_range(b,e,v) | [p1:p2) is the subsequence of the sorted sequence
    [b:e) with the value v; basically a binary search for v |

    | merge(b,e,b2,e2,out) | Merge two sorted sequences [b:e) and [b2:e2) into [out:p)
    |

    | merge(b,e,b2,e2,out,f) | Merge two sorted sequences [b:e) and [b2:e2) into [out:p)
    using f as the comparison |


    For each algorithm taking a [b:e) range, <ranges> offers a version that takes
    a range. reason ($3.2) to use both traditional iterator of a standard-library
    and its counterpart, you need to either explicitly call the call or use using-declaration.


    These algorithms, and many more (e.g., $17.3), can be applied to elements of containers,
    strings, and built-in arrays.


    Some algorithms, like replace() and sort(), modify value, but no algorithm adds
    or removes elements. The reason is that a sequence does not identify the container
    to add or delete elements, you need that knows about the container (e.g., a back_inserter($13.1)
    or directly refers to container itself (e.g., push_back()) or erased($12.3).


    Lambdas are very common operations as arguments. For example:


    ```

    vector<int> v = {0,1,2,3,4,5};

    for_each(v.begin(),v.end(), [](int &x) { x*=2; }); // v==0,1,4,9,16,25

    for_each(v.begin(),v.begin()+3,[](int &x) { sort(x); }); // v==0,1,2,9,16,25

    ```


    The standard-library algorithms to more carefully designed, and implemented than
    the average hand-crafted loop. Know them and use them in preference to code written
    in the bare language.'
