  md: '# 14.6 Advice


    +   [1] When the pair-of-iterators style becomes tedious, use a range algorithm;
    §13.1; §14.1.


    +   [2] When using a range algorithm, remember to explicitly introduce its name;
    §13.3.1.


    +   [3] Pipelines of operations on a range can be expressed using views, generators,
    and filters; §14.2, §14.3, §14.4.


    +   [4] To end a range with a predicate, you need to define a sentinel; §14.5.


    +   [5] Using static_assert, we can check that a specific type meets the requirements
    of a concept; §8.2.4.


    +   [6] If you want a range algorithm and there isn''t one in the standard, just
    write your own; §13.6.


    +   [7] Prefer standard-library concepts where they apply; §14.5.


    +   [8] When requesting parallel execution, be sure to avoid data races (§18.2)
    and deadlock (§18.3); §13.6.'
