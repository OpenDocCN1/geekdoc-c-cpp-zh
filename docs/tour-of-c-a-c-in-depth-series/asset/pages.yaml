    # 17.6 Vector Arithmetic


    The vector in §12.2 was designed to be a general mechanism for holding values,
    to be flexible, and to fit into the architecture of containers, iterators, and
    algorithms. However, it does not support mathematical vector operations. Adding
    operations to vector would be easy, but its generality and flexibility preclude
    optimizations that are often considered essential for serious numerical work.
    Consequently, the standard library provides (in <valarray>) a vector-like template,
    called valarray that is less general and more amenable to optimization for numerical
    computation:


    ```

    template<typename T>

    class valarray {

    // ...

    ```


    The arithmetic operations and the most common mathematical functions are supported
    for valarrays. For example:


    ```

    void f(valarray<double>& a, valarray<double>& a2)

    {

    valarray<double>- a = a1*3.14+a2/a1;

    a2 += a1*3.14;

    a = abs(a);

    double d = a2[7];

    //}

    ```


    Il numeric array operators *, +, /, - = =


    The operations are vector operations; that is, they are applied to each element
    of the vectors involved.


    In addition to arithmetic operations, valarray offers stride access to help implement
    multid computations.'
