  \n\n\n\n第 9 章 引入了控制抽象的概念，即将函数的外部操作与其内部实现分离。在本章中，我们引入了与之对应的抽象概念——*数据抽象*，即将数据类型的逻辑属性与其实现方式分离。数据抽象和控制抽象共同构成了*抽象数据类型*的概念。我们首先回顾抽象数据类型，然后介绍我们可以用于实现这些类型的\
  \ C++ 语法：*类（class）*。类将数据和动作结合在一起，形成称为“对象（object）”的自包含实体——而对象是面向对象编程的基石。\n\n## 12.1\
  \ 抽象数据类型\n\n我们生活在一个复杂的世界里。为了应对复杂性，人类大脑会进行*抽象*——即将一个想法或对象的本质特征从其细节中抽离出来的行为。\n\n通过抽象，我们关注的是“是什么”（what），而不是“怎么做”（how）。例如，对于汽车，我们大多数人知道引擎能*做什么*，但少有人确切知道引擎是*如何*工作的。抽象让我们能够开车，而无需成为汽车工程师。\n\
  \n在软件世界中，抽象对于管理庞大且复杂的项目至关重要。在计算机科学课程中，程序通常是可以整体理解的。相比之下，基于数百万行代码的大型软件产品只能通过抽象来开发和维护。为了管理复杂性，软件工程师经常使用两项重要技术：控制抽象和数据抽象。\n\
  \n在第 9 章中，我们把*控制抽象*定义为动作的逻辑属性与其实现之间的分离。当我们把一个算法简化为由函数调用执行的动作时，我们就在使用控制抽象。通过调用库函数（如下表达式所示）：\n\
  \n![An expression. 4 point 6, plus, s q r t, left parenthesis, x, right parenthesis.](img/9781284166033_CH12_P680-1.jpg)\n\
  \n我们仅依赖于函数的*规范（specification）*，它告诉我们该函数的功能。我们可以使用该函数而无需知道它的*实现*（产生结果的算法）。`sqrt`\
  \ 函数简化了我们的程序，因为计算平方根涉及的细节被隐藏了。\n\n抽象技术也适用于数据。每个数据类型都由一组值（定义域）和对这些值允许的操作组成。数据抽象是数据类型的逻辑属性与其实现细节之间的分离。当我们创建一个编程语言中没有内置的数据类型时，我们就在进行数据抽象。这种新类型最初被设计为一种**抽象数据类型\
  \ (ADT)**，规定了它的逻辑属性并推迟了其实现细节。\n\n与控制抽象一样，抽象数据类型既有规范（*是什么*），也有实现（*怎么做*）。ADT 的规范描述了数据值的特征及其操作的行为。ADT\
  \ 的用户在使用它时，只需要看到规范，而不是实现。\n\n以下是一个包含整数的列表 ADT 的非常非正式的规范：\n\n类型 `IntList`\n\n定义域\
  \ (DOMAIN)\n每个 `IntList` 值都是最多 100 个独立整数的集合。\n\n操作 (OPERATIONS)\n- 创建一个列表。\n- 向列表中插入一项。\n\
  - 从列表中删除一项。\n- 在列表中搜索某项。\n- 返回列表的当前长度。\n- 将列表按升序排序。\n- 输出列表。\n\n注意，这里没有实现细节。我们没有指定数据如何存储（可以是数组、文件或结构体中），也没有指定操作的算法。隐藏实现可以防止用户编写依赖于实现的代码，并允许实现者稍后重构实现以进行改进。\n\
  \n下面是另一个 ADT 的规范，它可能用于程序中表示“一天中的时间（TimeOfDay）”。\n\n类型 `TimeOfDay`\n\n定义域 (DOMAIN)\n\
  每个 `TimeOfDay` 值都是以小时、分、秒形式表示的时间。\n\n操作 (OPERATIONS)\n- 创建一个时间对象。\n- 输出时间。\n- 返回一个包含增加了一秒后的时间的对象。\n\
  - 比较两个时间是否相等。\n- 判断一个时间是否“小于”（在……早于）另一个时间。\n\n虽然我们在操作列表中提到了“时间”，但我们谨慎地将此 ADT 称为“TimeOfDay”，以区别于流逝的时间（elapsed\
  \ time），后者也可能是一个有用的 ADT。\n\nADT 的规范以抽象的形式定义了数据值和操作，这种形式可以作为文档提供给用户和程序员。最终，ADT 必须在代码中实现。要实现一个\
  \ ADT，程序员必须做两件事：\n\n1. 使用现有的数据类型为抽象数据选择一种具体的**数据表示**。\n2. 用程序指令实现每个允许的操作。\n\n为了实现\
  \ `IntList` ADT，我们可以选择一种具体的数据表示，由一个包含两个项目的记录组成：一个用于存储项的 100 元素数组，以及一个跟踪列表项目数量的 `int`\
  \ 变量。为了实现 `IntList` 操作，我们必须根据所选的数据表示创建算法。\n\n为了实现 `TimeOfDay` ADT，我们可能会使用三个 `int`\
  \ 变量——分别用于小时、分和秒。或者，我们可能会使用三个字符串。又或者我们可能将 `TimeOfDay` 保留为秒，并在需要时将其转换为小时、分和秒。规范并没有限制我们使用任何特定的表示方法。只要我们满足规范，就可以在不同的表示方法及其相关的算法之间进行选择。选择可能基于时间效率（执行速度）、空间效率（内存占用）或算法的简单性和可读性。\n\
  \n## 12.2 C++ 类\n\n到目前为止，我们一直通过参数将值传递给函数，并在上面执行操作。我们在定义新数据类型（如学生结构体）时也采用了这种方法；即，我们将数据值视为被动量，而将它们的操作视为独立的动作（参见\
  \ **FIGURE 12.1**）。\n\n然而，ADT 包含了数据值*以及*操作。因此，我们这种被动数据和分离函数的方法并不适用于 ADT。最好将 ADT\
  \ 视为一种*活跃的*数据结构——即在单一单元内包含数据和操作（参见 **FIGURE 12.2**）。C++ 通过被称为“类（class）”的结构化类型支持这种观点。\n\
  \n![A diagram shows 3 operation blocks labeled operation 1, operation 2, and operation\
  \ 3 and a data block. Data are passed to 3 operational blocks. 3 Operations are\
  \ passed to data block.](img/9781284166033_CH12_FIGF12_1.jpg)\n\nFIGURE 12.1 数据与操作分离\n\
  \n![Blocks labeled data, operation 1, operation 2, and operation 3 are bounded in\
  \ a circle.](img/9781284166033_CH12_FIGF12_2.jpg)\n\nFIGURE 12.2 数据与操作分离\n\n在图 10.3\
  \ 中，在第 10 章里，我们列出了 C++ 可用的四种结构化类型：数组、结构体、联合体类。类拥有组件（**类成员**），包括数据以及操作这些数据的函数。^(1)\n\
  \n这是 C++ **class** 的语法模板：\n\n![A syntax template.](img/9781284166033_CH12_P684-1.jpg)\n\
  \n访问修饰符（AccessModifier）定义为两个关键字之一，**public**（公共）或**private**（私有）：\n\n\n\n\n\n![语法模板。](img/9781284166033_CH12_P684-2.jpg)\n\
  \n描述\n\n稍后，我们将添加另一个修符 `protected`。`MemberList` 是一个或多个字段或函数的声明：\n\n![语法模板。](img/9781284166033_CH12_P684-3.jpg)\n\
  \n描述\n\n这里是我们在上一节中定义的 `TimeOfDay` ADT 对应的 C++ 类声明：\n\n![代码片段。](img/9781284166033_CH12_P684-4.jpg)\n\
  \n描述\n\n![代码片段的延续。](img/9781284166033_CH12_P685-1.jpg)\n\n描述\n\n(目前，请忽略函数原型中的 `const`\
  \ 单词。我们将在本章后面解释这个 `const` 的用法。)\n\n`TimeOfDay` 类有九个成员——四个成员函数（`Increment`、`Write`、`Equal`、`LessThan`）、三个成员变量（`hours`、`minutes`、`seconds`）以及两个看起来像函数但没有返回构造。后者是一种被称为*类构造函数*的特殊函数。构造是在类对象声明（创建）时隐式调用的成员函数。构造函数的名称总是与类名相同。它的前面既没有返回类型，也没有\
  \ `void` 关键字。\n\n我们的类声明包含了两个构造函数，通过它们的参数列表进行区分。第一个构造函数是不带参数的，它在声明 `TimeOfDay` 对象时将其初始化为某些默认值（例如\
  \ 00:00:00）。这种构造函数在 C++ 中被称为*默认构造函数*。第二个构造函数有三个 `int` 参数，在这种情况下，它们在声明 `TimeOfDay`\
  \ 对象时用于初始化私有数据成员。\n\n![两个声明代码。](img/9781284166033_CH12_P685-2.jpg)\n\n描述\n\n正如你可能猜到的，三个数据成员变量（`hours`、`minutes`\
  \ 和 `seconds`）构成了 `TimeOfDay` ADT 的具体数据表示。成员函数对应于我们为 `TimeOfDay` ADT 列出的操作：返回增加了一秒的\
  \ `TimeOfDay` 对象、输出时间、比较两个时间的相等性以及判断一个 `TimeOfDay` 对象是否小于另一个。虽然 `Equal` 和 `LessThan`\
  \ 函数比较的是两个 `TimeOfDay` 变量，但它们的参数列表只有一个参数——一个 `TimeOfDay` 变量。我们将在查看类的实现时看到原因。\n\n\
  `TimeOfDay` 类的声明定义了一个数据类型，但并没有创建该类型的变量。如前所示，类变量（更常称为 `class objects` 或 `class instances`）是使用普通的变量声明单独创建的。任何声明并操作\
  \ `TimeOfDay` 对象的软件被称为该类的 `client`（客户端）。\n\n查看 `TimeOfDay` 类，你会看到保留字 `public` 和\
  \ `private`，每个词后面跟着一个冒号。在 `public` 之后、`private` 之前声明的类成员构成了*公共接口*；客户端可以直接访问这些成员。在\
  \ `private` 之后声明的类成员客户端无法直接访问。如果客户端代码尝试访问私有成员，编译器会给出错误信息。\n\n私有成员只能通过类的成员函数访问。在\
  \ `TimeOfDay` 类中，私有变量 `hours`、`minutes` 和 `seconds` 只能在 `Increment`、`Write`、`Equal`\
  \ 和 `LessThan` 中访问，不能被客户端代码访问。将类成员分为私有公共部分是 ADT 设计的标志。为了保持 ADT 的控制和数据抽象，ADT 的实例应该*仅*通过公共接口进行操作。我们将在本章后面重新讨论这个问题。\n\
  \nC++ 不要求公共和私有成员按特定顺序出现。默认情况下，类成员是私有的；`public` 开启后续声明的公共访问。要切换回声明私有成员，使用 `private`\
  \ 保留字，如前面的示例所示。类可以有多个公共和私有区域。\n\n我们现在可以解释 C++ `struct` 和类之间的区别：在 `struct` 中，成员默认是公共的；在类中，它们默认是私有的。在\
  \ C 语言中，`struct` 不允许函数作为组件。因此，在 C++ 中，大多数程序员像在 C 中那样使用 `struct` 来表示一个仅包含数据成员的记录结构，然后只用类来实现实现\
  \ ADTs。\n\n### 实现成员函数\n\n让我们看看我们如何实现 `TimeOfDay` 类。还有一些我们尚未正式涵盖的细节，我们将在过程中指出。稍后，我们将回到相关的\
  \ C++ 规则。现在，我们想看一些具体的代码，以便你可以看到类是如何实现的。\n\n#### 构造函数\n\n`TimeOfDay` 的构造函数是直接的。在默认构造函数中，0\
  \ 被存储在每个数据成员中\n\n![构造函数代码](img/9781284166033_CH12_P687-2.jpg)\n\n描述\n\n在参数化构造函数中，参数被存储在相应的成员中\n\
  \n![参数化构造函数代码](img/9781284166033_CH12_P687-3.jpg)\n\n描述\n\n注意类名是如何位于 `::` 作用符之前的，以指定函数所属的类。\n\
  \n#### Increment\n\n在这个函数中，我们返回一个与当前对象相同但增加了一秒的对象。在 C++ 中\n\n`Increment` 的第一步是创建所应用的\
  \ `TimeOfDay` 对象的副本。为了这样做，我们调用参数化构造函数，传递当前实例的数据成员。\n\n![代码片段](img/9781284166033_CH12_P688-1.jpg)\n\
  \n描述\n\n注意我们没有向 `Increment` 传递任何内容。因为它在当前实例的上下文中执行，因此它可以自动访问实例的数据成员。\n\n接下来（副本的）`seconds`\
  \ 数据成员被增加。如果此操作使得值大于 59，则 `seconds` 必须设置为 0，并且必须增加 `minutes` 数据成员。如果这使得 `minutes`\
  \ 大于 59，则它被设置为 0，并增加 `hours` 数据成员。如果 `hours` 数据成员大于 23，它就会被设置为 0。\n\n![部分程序代码](img/9781284166033_CH12_P688-2.jpg)\n\
  \n描述\n\n注意我们如何访问实例成员与访问 `result` 对象的成员相比。我们直接引用当前实例的成员（`hours`、`minutes`、`seconds`）。然而，访问任何其他对象的成员都需要点符号法（`result.hours`、`result.minutes`、`result.seconds`）。\n\
  \n\n\n\n\n等等——我们如何访问 `result` 对象的成员变量呢？它们不是私有的吗？是的，但在 C++ 中，`private` 仅限制客户端代码的访问。在类的实现内部，我们可以访问同类类型对象的私有成员。\n\
  \n## Write\n\n为了使时间格式统一，我们希望每个字段输出两个数字，因此我们必须检查一个值是否为单数字。如果是，我们输出输出一个前导 0。再次注意，`Write`\
  \ 函数中没有传入任何参数——它能够自动访问实例的成员。\n\n![使用逻辑运算符表示的算法。](img/9781284166033_CH12_P689-1.jpg)\n\
  \n描述\n\n## LessThan\n\n这个布尔操作比较了两个 `TimeOfDay` 类的对象：第一个是实例，第二个是通过参数传递进去的。正如我们在 `Increment`\
  \ 中看到的，对另一个对象的成员必须使用点表示法（dot notation）来访问。\n\n我们如何比较时间？首先我们检查小时。如果小时相同，我们再检查分钟。如果分钟也相同，我们检查秒。让我们以算法的形式来看这个过程。\n\
  \n`LessThan(In: otherTime)`\n\n**返回值：Boolean（布尔）**\n\n```\nIF (hours < otherTime.hours)\n\
  \    Return True\nELSE IF (hours > otherTime.hours)\n    Return False\nELSE IF (minutes\
  \ < otherTime.minutes)\n    Return True\nELSE IF (minutes > otherTime.minutes)\n\
  \    Return False\nELSE IF (seconds < otherTime.seconds)\n    Return True\nELSE\n\
  \    Return False\n```\n\n该算法也可以逻辑运算符表示，所示：\n\n```\nhours < otherTime.hours || hours\
  \ == otherTime.hours\n&& minutes < otherTime.minutes || hours == otherTime.hours\n\
  && minutes == otherTime.minutes &&\nseconds < otherTime.seconds)\n```\n\n哪种描述方式更好？这纯粹是风格问题。第一个版本更易读，因此也更容易调试。第二个版本更优雅。在这种情况下，我们选择了优雅。\n\
  \n![部分程序代码。](img/9781284166033_CH12_P690-1.jpg)\n\n描述\n\n## Equal\n\n`Equal` 比较的两个对象是当前实例和参数。只有当所有三对数据字段都匹配时，`Equal`\
