  \ `While` 语句的意思是：只要输入值不等于 25，就重复执行循环体。当 `inputVal` 等于 25 时，`While` 循环停止。该循环的作用消耗并忽略输入流中的所有值，直到输入\
  \ 25 为止。\n\n就像 `If` 语句中的条件一样，`While` 语句中的条件可以是任何简单数据类型的表达式。通常它是一个逻辑（布尔）表达式；如果不是，它的值会被隐式地强制转换为\
  \ `bool` 类型。\n\n![解释 while 语句中控制流的图表。](img/9781284166033_CH06_296a.jpg) (此处根据原文提供的文本继续翻译)\n\
  \n\n\n\n\n循环的概念是编程的基础。在本章中，我们将花一些时间研究循环的典型算法示例，以及如何使用 `While`\n\n语句实现它们。当你在分析问题和设计算法时，这些循环情况会反复出现。\n\
  \n## 6.3 使用 While 语句的循环\n\n在解决问题时，你会遇到循环的两种主要算法用途：`计数控制循环`（count-controlled loops），它们按照指定的次数重复；以及`事件控制循环`（event-controlled\
  \ loops），它们会一直重复，直到循环内部发生某事为止。\n\n如果你正在制作天使芬食品蛋糕，食谱上写着“搅拌混合物 300 次”，那么你正在执行一个计数控制循环。如果你正在制作派饼皮，食谱上写着“用面粉刀切，直到混合物看起来像粗面粉”，那么你正在执行一个事件控制循环；你预先不知道循环迭代的确切次数。\n\
  \n### 计数控制循环\n\n计数控制循环在循环测试中使用一个我们称为`循环控制变量`的变量。在进入计数控制循环之前，我们必须`初始化`（设置初始值）循环控制变量，然后对其进行测试。然后，作为循环每次迭代的一部分，我们必须`递增`（加\
  \ 1）循环控制变量。注意，循环控制变量除了我们使用它的方式外并没有特别的。我们只是简单地这样引用它，以便将其与我们可能在循环内部使用的变量区分开来。这是一个程序示例，该程序在屏幕上反复输出“Hello!”：\n\
  \n![一个在屏幕上反复输出“Hello!”的程序。](img/9781284166033_CH06_299.jpg)\n\nDescription\n\n在\
  \ Hello 程序中，`loopCount` 是我们的循环控制变量。它在进入循环之前被设置为 1。`While` 语句会测试该表达式：\n\n![带有测试表达式的\
  \ While 语句。](img/9781284166033_CH06_300.jpg)\n\nDescription\n\n只要该表达式为 `true`，它就会执行循环体。在循环体内部，我们想要重复的主要操作是输出语句。循环体中的最后一个语句通过给\
  \ `loopCount` 加 1 来将其递增。\n\n注意我们递增循环控制变量的语句形式：\n\n![递增循环控制变量的代码。](img/9781284166033_CH06_300a.jpg)\n\
  \nDescription\n\n该语句将变量的当前值加 1，并将结果替换旧值。以这种方式使用的变量被称为`计数器`（counters）。在 Hello 程序中，`loopCount`\
  \ 在循环每次迭代时都会递增——我们用它来计算迭代次数。计数控制循环的循环控制变量始终是一个计数器。\n\n当然，我们在 C++ 中遇到过另一种递增变量的方法。递增运算符\
  \ `++` 会将其操作数的变量递增。该语句：\n\n![使用递增运算符的代码。](img/9781284166033_CH06_300b.jpg)\n\nDescription\n\
  \n与赋值语句的效果相同：\n\n![递增循环计数器的另一种方法。](img/9781284166033_CH06_300c.jpg)\n\nDescription\n\
  \n从现在开始，我们通常使用 `++` 运算符，大多数 C++ 程序员也是这样做的。\n\n在设计循环时，程序员有责任确保在 `While` 语句开始之前，待测试的条件已正确设置（初始化）。程序员还必须确保条件在循环内部发生变化，以便它最终变为\
  \ `false`；否则，\n\n![展示循环计数器在 while 循环中工作的代码。](img/9781284166033_CH06_300d.jpg)\n\n\
  Description\n\n永不退出的循环被称为`死循环`（infinite loop），因为在理论上，它是永远执行的。在之前的代码中，省略对 `loopCount`\
  \ 的递增会导致死循环；`While` 表达式始终为 `true`，因为 `loopCount` 的值永远是 1。如果你的程序运行时间比你预期的长得多，很有可能是创建了一个死循环。你可能需要发出操作系统命令来停止程序。\n\
  \n我们 Hello 程序中的循环执行了多少次——9 次还是 10 次？为了回答这个问题，我们查看循环控制变量的初始化和退出测试。因为 `loopCount`\
  \ 从 1 开始直到 10，循环体执行了 10 次。如果我们希望循环执行 11 次，要么将 `loopCount` 初始化为 0，要么将测试改为：\n\n![让\
  \ while 循环执行 11 次的测试表达式。](img/9781284166033_CH06_301.jpg)\n\n### 事件控制循环\n\n在解决问题时，你会遇到循环的两种主要算法用途：`计数控制循环`（count-controlled\
  \ loops），它们按照指定的次数重复；以及`事件控制循环`（event-controlled loops），它们会一直重复，直到循环内部发生某事为止。\n\n\
  如果你正在制作天使芬食品蛋糕，食谱上写着“搅拌混合物 300 次”，那么你正在执行一个计数控制循环。如果你正在制作派饼皮，食谱上写着“用面粉刀切，直到混合物看起来像粗面粉”，那么你正在执行一个事件控制循环；你预先不知道循环迭代的确切次数。存在几种类型的事件控制循环：哨兵控制、文件结束控制和标志控制。在所有这些循环中，终止条件取决于循环内部发生的某个事件。\n\
  \n### 哨兵控制循环\n\n循环通常用于读取并处理数据列表。每次执行循环体时，都会读取新的数据。通常使用一个特殊的数据值，称为`哨兵`（sentinel）或`轨迹值`（trailer\
  \ value），来指示程序没有剩余数据。只要数据值不是哨兵，循环就会继续；当程序识别出哨兵时停止。\n\n哨兵值必须是正常输入中不会出现的。例如，如果一个程序读取日期，可以使用\
  \ 2 月 31 作为哨兵：\n\n![错误的代码块。](img/9781284166033_CH06_302.jpg)\n\nDescription\n\n\
  但这个循环有一个问题：`month` 和 `day` 的值在进入循环之前没有定义。我们必须某种方式初始化这些变量。我们可以给它们赋值以确保进入循环，但如果第一个输入值是哨兵值怎么办？它们会被当作数据处理，尽管它们是无效。此外，初始化从未使用的变量效率较低。\n\
  \n我们可以通过在进入循环之前读取第一组数据来解决这个问题。这种做法被称为`预读`（priming read）。（这种思想类似于启动前向机制倒入一桶水。）让我们为循环添加预读：\n\
  \n![错误的代码块。](img/9781284166033_CH06_302b.jpg)\n\nDescription\n\n有了预读，如果第一个输入值是哨兵值，那么循环正确地不处理它们。我们解决了一个问题，但现在当第一个输入值是有效数据时又出现了一个问题。程序在循环内部执行的第一件事是获取一个日期，这替换了通过预读获得的值。因此，输入的第一个日期从未被处理。给定预读，循环体*第一*件应该做的是处理已经读取的数据。但我们何时读取下一个数据集呢？我们在循环的*最后*这样做。这样一来，`While`\
  \ 条件在处理下一个数据集之前被应用于它。它看起来是这样的：\n\n\n\n\n\n![正确编码的 while 块。](img/9781284166033_CH06_303.jpg)\n\
  \n描述\n\n这段代码运行正常。首先读取第一个数据集；如果它不是哨兵值（sentinel），则对其进行处理。在循环末尾，会读取下一个数据集，然后回到循环开头。如果新数据集不是哨兵值，它将像第一个数据一样被处理。当读取到哨兵值时，While\
  \ 表达式变为 `false`，循环退出（*而不*处理哨兵值）。\n\n通常，问题本身决定了哨兵值的值。例如，如果问题不允许数据值为 `0`，那么哨兵值就应该是\
  \ `0`。有时，某些值的组合是无效的。例如，将“二月”和“31”组合作为日期就是这样的情况。有时，一个值范围（例如负数）就是哨兵值。\n\n当你逐行处理 `char`\
  \ 数据时，换行符（`'\\n'`）通常作为哨兵值。这里有一个程序，可以读取并显示输入文件中行所有的字符：\n\n![读取并显示输入文件中行所有字符的程序。](img/9781284166033_CH06_303a.jpg)![读取并显示输入文件中行所有字符的程序。](img/9781284166033_CH06_304.jpg)\n\
  \n描述\n\n注意，对于这项任务，我们使用 `get` 函数而不是 `>>` 运算符来输入字符。记得 `>>` 运算符会跳过空白字符（包括空格和换行符）以在输入流中找到下一个数据值。在这个程序中，我们想要输入*每一个*字符，甚至是空格，尤其是换行符。\n\
  \n如果没有可以用作哨兵的无效数据值怎么办？你可能必须在每次迭代中输入一个额外的值，该值的唯一目的是为了指示数据的结束。例如，在每次迭代中，你可以询问用户是否还有更多数据需要输入，并让他们输入\
  \ `Y` 表示是，输入 `N` 表示否。\n\n如果忘记输入哨兵值会发生什么？在交互式程序中，循环会再次执行并提示输入。此时，你可以输入哨兵值。如果程序的输入来自文件，那么一旦读取了所有数据，循环体就会再次执行。然而，由于计算机已经到达文件末尾，文件流将进入失败状态（fail\
  \ state）。在下一节中，我们将看到如何使用文件结束（end-of-file，简称 EOF）作为循环的终止条件。\n\n在继续之前，回想一下在 If 条件中使用赋值运算符\
  \ `=` 而不是等判断运算符 (`==`) 的错误。同样的错误也可能发生在 While 语句中。看看当我们在上一个示例中使用错误的运算符会发生什么：\n\n\
  ![使用了错误运算符的 While 块。](img/9781284166033_CH06_304a.jpg)\n\n描述\n\n这个错误会导致死循环。终止条件现在是一个赋值表达式，而不是关系表达式。该表达式的值为\
  \ `1`（在循环测试中被解释为 `true`，因为是非零的），它的副作用是将是将值 `1` 存储到 `sentinel` 中，替换掉刚刚读取的值。由于 While\
  \ 表达式始终为 `true`，循环永远不会停止。\n\n### 文件结束控制的循环\n\n你已经学习过，如果输入流（如 `cin` 或输入文件流）遇到以下情况，就会进入失败状态\
  \ (1) 遇到不可接受的输入数据，(2) 程序尝试打开不存在的输入文件，或 (3) 程序尝试读取超出输入文件末尾的内容。让我们看看这三种可能性的第三种。\n\n\
  在程序从输入文件中读取最后一段数据后，计算机就处于文件末尾（EOF）。此时，流的状态处于成功状态。但如果我们尝试再输入一个值，流就会进入失败状态。我们可以利用这一点并为我们所用：为了编写一个输入未知数量数据项的循环，我们可以输入流的失败作为一种哨兵形式。\n\
  \n回想一下在第 5 章中，我们是如何介绍测试流的状态的。在逻辑表达式中测试流的状态，我们像使用布尔变量一样使用流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\
  \n描述\n\n在这种测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态也是一样。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\n\
  描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态的方式是相同的。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\n\
  描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态的方式是相同的。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\n\
  描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态的方式是相同的。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\n\
  描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态的方式是相同的。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\n\
  描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态的方式是相同的。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![像布尔变量一样使用的流的名字。](img/9781284166033_CH06_305.jpg)\n\n\
  描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 While 语句中，测试流的状态的方式是相同的。假设我们有一个包含整数的数据文件。如果\
  \ `inData` 是我们文件流的名字：\n\n![一个读取并显示文件中所有数据的循环。![一个读取并显示文件中所有数据的循环。](img/9781284166033_CH06_305a.jpg)\n\
  \n描述\n\n让我们追踪这段代码，假设文件包含三个值：10、20 和 30。哨兵读取了 10。循环条件为 `true`，因为输入成功了。循环体输出 10，然后读取第二个值\
  \ 20。回到循环测试时，`inData` 为 `true`，因为输入成功了。循环体输出 20，并读取 30。回到循环测试时，`inData` 为 `true`，因为输入成功了。循环体第三次执行，输出\
  \ 30，并尝试输入。这时，由于我们尝试读取文件末尾，`inData` 进入失败状态。回到循环测试时，表达式值为 `false`，我们退出循环。\n\n当我们编写像上一个那样的\
  \ EOF 控制循环时，我们期望文件结束是流失败的原因。但记住，*任何*输入错误会导致流失败。这一事实再次强调了回显打印的重要性。它帮助我们在遇到 EOF 之前读取了所有数据。\n\
  \nEOF 控制循环与哨兵控制循环的相似之处在于退出是由事件引起的。在哨兵控制循环的情况下，程序遇到哨兵。在 EOF 控制循环中，它到达了 EOF。\n\n以下程序使用\
  \ EOF 控制循环读取并显示文件中的 `int` 值：\n\n![使用文件结束控制循环读取并显示文件中所有整数的程序。](img/9781284166033_CH06_306.jpg)\n\
