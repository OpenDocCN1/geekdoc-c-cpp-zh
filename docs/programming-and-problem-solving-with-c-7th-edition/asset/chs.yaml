  \ `x` 包含值 4.85，则语句\n\n![上一个代码语句的输出。](img/9781284166033_CH03_PRE71.jpg)\n\n描述\n\n\
  将产生以下输出：\n\n![大浮点值的输出。](img/9781284166033_CH03_PRE72.jpg)\n\n描述\n\n在第三行中，字段宽度 3\
  \ 是不够的，因此字段会自动扩展以容纳该数字。\n\n在处理浮点数输出时还会出现其他几个问题。首先，较大的浮点值会以科学（E）计数法输出。值 123456789.5\
  \ 在某些系统上可能会输出为\n\n![固定格式操作符。](img/9781284166033_CH03_PRE73.jpg)\n\n描述\n\n你可以使用名为\
  \ `fixed` 的操作符强制所有后续的浮点输出以十进制形式而非科学计数法显示：\n\n![整数是如何打印的。](img/9781284166033_CH03_PRE74.jpg)\n\
  \n描述\n\n其次，如果数字是整数，C++ 不会输出小数点。为了在输出中显示小数点，可以使用 `showpoint`：\n\n![显示点。](img/9781284166033_CH03_PRE75.jpg)\n\
  \n描述\n\n第三，你通常想控制小数点右侧的位数（这可以通过 `setprecision` 实现）：\n\n![输出中的小数。](img/9781284166033_CH03_PRE76.jpg)\n\
  \n描述\n\n在某些应用程序中，可能希望将值强制为科学计数法，这是通过使用 `scientific` 操作符实现的。要注意，如果之前没有设置固定或科学模式，`setprecision`\
  \ 决定的是小数点之前的位数。在第一种情况下，由于数字足够大，输出流会自动变为科学计数法（后续输出较小数字时，将切回普通格式）。因为之前没有插入固定或科学模式的操作符，`setprecision`\
  \ 决定的是 e 之前的数字。在第二种情况下，`scientific` 操作符将流切换到科学模式。在这种模式下，`setprecision` 决定的是小数点与\
  \ e 之间的位数。\n\n显然，你希望结果保留两位小数。只要已经设置了 `fixed`，`setprecision` 就决定了期望的小位数。与 `setw`\
