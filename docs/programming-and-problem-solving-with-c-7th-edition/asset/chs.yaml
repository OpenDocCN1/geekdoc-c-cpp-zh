  \ 15 号邮信箱里。\n\n明确这些术语非常重要。解引用是指指针本身以及我们如何使用其中包含的地址来找到它指向的对象。间接寻址是指被指向的值以及我们如何使用指针的地址来访问它。*直接寻址*这一术语只是我们为目前为止熟悉的访问值的方式起的一个新名称，以便将其与新的间接寻址技术区分开来。\n\
