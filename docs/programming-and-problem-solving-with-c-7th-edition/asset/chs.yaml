  \n描述\n\n结果输出所示：\n\n![数字之间包含字面量的输出。](img/9781284166033_CH03_PRE64.jpg)\n\n描述\n\n\
  控制输出水平间距的另一种方法是使用操纵符（manipulators）。长期以来，我们一直在使用 `endl` 操纵符结束输出。在 C++ 中，操纵符是一种奇特的东西，它的行为像函数但以数据对象的形式出现。像函数一样，操纵符会引起某些操作。但像数据对象一样，操纵符可以出现在系列插入操作中间：\n\
  \n![输出中的操纵符。](img/9781284166033_CH03_PRE65.jpg)\n\n描述\n\n操纵符仅用于输入和输出语句。\n\n这里是修改后的输出语句语法模板，显示不仅允许算术和字符串表达式，还允许操纵符：\n\
  \n![输出语句的语法模板。](img/9781284166033_CH03_UFIG118-1.jpg)\n\n描述\n\nC++ 标准库提供了许多操纵符，但现在我们只看其中五个：`endl`、`setw`、`fixed`、`showpoint`\
  \ 和 `setprecision`。`endl`、`fixed` 和 `showpoint` 操纵符在我们包含 `iostream` 头文件执行 I/O 时是“免费”提供的。另外两个操纵符\
  \ `setw` 和 `setprecision` 要求我们也包含 `iomanip` 头文件：\n\n![setw 操纵符的使用。](img/9781284166033_CH03_PRE67.jpg)\n\
  \n描述\n\n\n\n\n\n操作符 `setw`——意为“设置宽度”——让我们能够控制下一个数据项在输出时占据多少个字符位置。（`setw` 通常用于格式化数字和字符串，而不是\
  \ `char` 数据类型）。`setw` 的参数是一个整数表达式，称为“字段宽度指定”（fieldwidth specification）；这组字符位置被称为“字段”（field）。下一个要输出的数据项将右对齐打印（在左侧填充空格以填字段）。\n\
  \n让我们来看一个例子。假设有两个 `int` 变量被赋值为如下值：\n\n![两个已赋值的 int 变量。](img/9781284166033_CH03_PRE68.jpg)\n\
  \n描述\n\n随后，以下输出语句产生了右侧所示的输出：\n\n![详细列出的某些输出语句及其产生的输出。](img/9781284166033_CH03_UTAB118-1.jpg)![详细列出的某些输出语句及其产生的输出。](img/9781284166033_CH03_UTAB119-1.jpg)\n\
  \n描述\n\n在示例 1 中，每个值都指定了占据足够的位置，以确保它们之间至少有一个空格。在示例 2 中，所有值都挤在了一起，因为为每个值指定的字段宽度恰好足够容纳该值。这种输出显然不易读。更好的做法是将字段宽度设置得比所需的最小尺寸大，以便在值之间留出空间。示例\
  \ 3 包含了额外的空格以提高可读性；而示例 4 则没有。在示例 5 中，字段宽度不足以容纳 `ans` 中的值，因此它会自动扩展以为所有数字留出空间。\n\n\
  设置字段宽度是一个一次性操作。该偏好仅对紧随其后的项有效。在此输出之后，字段宽度将重置为 0，这意味着“将字段扩展到恰好所需的长度”。例如，在语句中\n\n![使用\
  \ setw 操作符。](img/9781284166033_CH03_PRE69.jpg)\n\n描述\n\n在输出 `ans` 之后，字段宽度重置为 0。结果，我们得到了如下输出：\n\
  \n![上一个语句的输出。](img/9781284166033_CH03_PRE70.jpg)\n\n描述\n\n这里是一个说明这些操作符的短程序，随后是其输出。\n\
