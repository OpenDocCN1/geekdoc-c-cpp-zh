  \n很奇怪的是，`set` 算法并没有设计为直接以 `set` 类值的形式输出其结果。相反，它们被写成可以更通用地适用于其他容器，因此它们的输出无法直接进入 `set`。（例如，你可以将结果直接写入\
  \ `vector`。）\n\n在 `<iterator>` 算法包中的另一个函数模板 `inserter` 必须使用，以强制 `set` 算法以一种允许 `set`\
