  \ 当数组作为参数声明时；(2) 当数组在初始化初始化时。在所有其他声明中，必须指定大小。\n4.  在表达式中，不带索引的数组名是一个指针表达式；它的值是数组的基地址。数组名被视为常量表达式，因此无法对其赋值。以下代码显示了正确错误的赋值：\n\
  \n```\n![代码片段。](img/9781284166033_CH11_P665-1.jpg)\n```\n描述\n\n5.  如果数组参数仅用于输入，将其声明为\
  \ `const` 以防止函数意外修改调用者的数据。\n6.  当函数期望整个数组的基地址时，不要将单个数组组件作为参数。\n7.  C++ 不允许对数组进行聚合操作，例如聚合赋值、比较、输入输出或算术运算。你必须编写代码逐元素执行这些操作。\n\
  8.  尝试使用范围之外的索引值将导致访问内存位置。\n9.  对于多维数组，在引用数组组件时必须使用正确数量的索引。你也应该确保索引顺序是正确的。\n10.\
  \ 在处理多维数组的循环中，双检每个索引变量的上限和下限，以确保它们对于数组的维度是正确的。\n11. 将多维数组声明为参数时，必须说明除第一维以外的所有维度的大小。此外，这些大小必须与调用者参数的大小完全一致。\n\
