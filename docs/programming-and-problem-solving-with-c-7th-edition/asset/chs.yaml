  \ `Format Names` 程序，允许用户输入文件名，就像我们在“软件维护案例研究”中对 `Mortgage` 程序所做的那样。但是，我们不再使用 `cin`\
  \ 和 `cout`，而是将使用更现代、更熟悉的 GUI 界面。\n\nQt GUI 库提供了我们此类此类交互所需的组件。这些组件被称为对话框（dialogs）。我们通过以下包含语句访问\
