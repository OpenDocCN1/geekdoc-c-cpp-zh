  \n章节开启页：© Joost Lagerweij/EyeEm/Getty Images.\n\n# 前言\n\n## 第七版简介\n\n`Programming\
  \ and Problem Solving with C++`（C++编程与问题解决）的前六版一直以来美国最畅销的计算机科学教材之一。这些版本被广泛接受为 ACM/IEEE\
  \ 推荐的入门级计算机科学课程的模范教材。\n\n在本书的连续各个版本中，有一点始终没有改变：我们对学生的承诺。一如既往，我们的努力致力于让计算机科学有时复杂的概念对所有学生来说都更容易理解。`Programming\
  \ and Problem Solving with C++` 这一版延续了我们的理念：教材应该像一本指南，开辟道路，并引导读者穿过最初看起来可能难以导航的领域。\n\
  \n## 第七版的变更\n\n`Programming and Problem Solving with C++` 第七版继续提供相关内容，使本书可以在两个学期中使用，从而为学生提供更大的价值。\n\
  \n我们意识到，自第六版出版以来八年来已经发生了巨大变化。智能手机和应用程序使用的增长导致了全球范围内主要的文化变革，并使许多技术过时或不再常见。因此，我们审阅了全文，更新了语言以反映现代计算的格局。许多示例和类比也经过了调整或替换，使其更具相关性。由于学生更多地使用小屏幕，阅读习惯也发生了变化，我们调整了每一章的写作风格，使其更加直接简洁。尽管文本发生了巨大变化，但教师们会欣慰地发现，我们没有改变演示顺序，除了一些新的特殊特性。\n\
  \n新特性中最显著的是在每章的末尾引入了图形用户界面（GUI）作为可选章节，从关于程序输入的章节开始。大多数现代学生在进入我们的课程时，从未见过控制台输入/输出，那是\
  \ 20 世纪互联网出现之前的系统遗留。\n\nGUI I/O 不仅对现在的学生来说更熟悉，其更高级的形式为引入事件处理提供了自然手段。当学生看到 GUI 小部件如何触发事件处理器时，它为处理多线程奠定了概念框架，而在多核处理器时代，多线程正成为计算问题解决的关键元素。通过这种方式，我们也预见到正在开发中的\
  \ ACM/IEEE 202X 课程标准将增加对并行和分布式计算早期介绍的重视。\n\n这些章节中的每一个都探讨了如何将一个`问题解决案例研究`程序从使用控制台\
  \ I/O 转换为使用 GUI 完成相同的任务。入门课程中教授的许多编程模式都是基于需要检查自由格式控制台输入的错误——而现代系统通过使用专门的 GUI 小部件来防止错误输入，从而避免了错误检查。在我们能够通过\
  \ GUI 简化案例研究代码或增强其健壮性时，我们会特别指出这些改进。\n\n我们的 GUI 涵盖使用了流行的 `Qt` 系统，它适用于所有主流操作系统，并已针对多种语言实现。我们在每一章的源代码文件中提供了一个\
  \ C++ 头文件，该文件使用必要的默认值和一些基础小部件来初始化环境，这样学生就可以轻松编写最初仅依赖于简单函数调用的 GUI 程序。他们的程序随后能够显示看似熟悉的输入对话框（用于是/否响应、数字、文本和文件选择器）以及显示文本输出的各种方式，所有这些都是简单、直观的调用。源代码可在\
  \ `go.jblearning.com/PPS7e` 获取。\n\n随后，在涵盖了类和对象之后，我们通过循序渐进的过程引入了创建自定义 GUI 的工具，包括触发事件的按钮。使用这些更高级的小部件和组件有助于说明面向对象编程的力量。学生还能领略现代软件工程的风貌，这种工程很大程度上依赖于创建类型转换链，以便一种类型的对象能够处理存储在其他类型对象中的信息。\n\
  \n我们希望教师能够发现这些可选章节有用，可以作为课程转向更充分拥抱现代 GUI 模式的一步。\n\n在这一版中，我们还更新了涵盖范围，包含了自上一版出版以来出现的\
  \ C++ 标准特性，适用于编程的第一门课程。\n\n## 教学方法\n\n我们的方法一如既往是提供概念的渐进式层次，而不是堆砌令人难以应从的细节和相关的替代方案。例如，许多教材从介绍数值类型开始。相反，我们在第\
  \ 2 章中从 `char` 和 `string` 类型开始，这样学生就可以专注于构建执行基本输出的 C++ 程序的机制，并快速获得一个可行的演示。一旦他们熟悉了基础知识，我们在第\
  \ 3 章中加入数值类型。通过将语句和程序语法的概念障碍与涉及数值精度、符号位、转换和优先级的类型复杂性分开，我们让更多学生能够在课程早期取得成功。\n\n根据\
  \ Elliot Solay 对初学者程序员的研究，我们继续最初仅使用 `If` 语句介绍选择，并仅使用 `While` 语句介绍循环。然而，由于许多教师喜欢将所有的选择结构放在一起讲，所有的循环结构放在一起讲，因此额外控制结构的章节紧跟在选择和循环章节之后。\n\
  \n同样，学生发现理解具有可以混合类型的命名字段的 `struct` 类型比理解通常涉及访问算术表达式索引的数组类型更容易。因此，第 10 章引入了 `struct`\
  \ 和 `union` 类型，而数组被推迟到第 11 章。我们还在第 10 章中介绍了指针和引用类型的简单用法，并推迟到第 11 章再使用与数组和动态内存分配相关的指针，以便学生在处理堆上的值之前熟悉间接访问。\n\
  \n我们意识到许多学生是通过模仿现有解决方案来学习编程，因此我们在每一章中都包含了许多短示例程序。这些程序在比代码片段更完整的上下文中展示了章节概念，并紧接在介绍新概念之后。我们还组织了章节，使得讨论在章节早期就能从概念更快速地转换到实际应用，然后再进入相关的概念。因此，章节提供了一系列具体的示例，作为通往主要案例研究的中途路点。\n\
  \n## C++ 与面向对象编程\n\n\n\n\n一些教育者拒绝 `C` 和 `C++`，认为它们过于宽松，且太容易编写晦涩、不可读的程序。我们的经验并不支持这一观点，只要对语言特征的使用恰当。`C`\
  \ 家族允许简练、紧凑的编程风格，这一事实不能简单地被归为“好”或“坏”。几乎任何编程语言都可以用来编写出过于简练和聪明而导致于理解的风格。虽然 `C` 家族以这种方式使用的可能比其他语言更频繁，但我们发现，通过在软件工程方面进行细致指导，并使用直观、严谨且不包含复杂语言特征的编程风格，学生可以学会使用\
  \ `C++` 来产生清晰、可读的代码。\n\n必须强调，尽管我们使用 `C++` 作为教授计算机科学概念的载体，但本书并不是一本语言手册：它并没有试图涵盖整个\
  \ `C++` 语言。相反，语言构造是与相应的理论并行引入的，以此展示其实际应用。\n\n关于何时引入面向对象编程（`OOP`）主题，存在不同的意见。一些教育者主张从一开始就沉浸在\
  \ `OOP` 中，而另一些人（本书的目标读者）则倾向于一种更异化的方法，即将函数式分解和面向对象设计都作为设计工具呈现。《C++ 编程与问题解决》（第七版）的章节组织反映了向\
  \ `OOP` 过的过渡方法。类和面向对象的术语在第 12 章中介绍，但继承、多态和面向对象设计被推迟到第 15 章。中间章节为学生提供了充足的时间和经验，让他们熟悉使用类的实践。\n\
  \n## 概要\n\n第 1 章旨在让学生与学科之间建立良好的互动关系。书中介绍了硬件和软件的基础知识，提出了计算机伦理中的问题，在“软件维护案例研究”中首次接触\
  \ `C++` 语法，并在“问题解决案例研究”中引入并强化了问题解决技术。\n\n并没有一开始用 `C++` 中可用的各种数值类型就淹没学生，第 2 章专注于两种类型：`char`\
  \ 和 `string`。由于需要跟踪的数据类型较少，学生可以专注于整体程序结构，并更早开始创建和运行简单的程序。第 3 章紧接着讨论了 `C++` 数值类型，然后开始涵盖算术表达式、函数调用和输出。与许多详细介绍所有\
  \ `C++` 数据类型和所有 `C++` 运算符的书籍不同，这两个章节仅关注 `int`、`float`、`char` 和 `string` 类型，以及基础算术运算符。对其他数据类型的讨论被推到了第\
  \ 10 章。\n\n输入和编程方法论是第 4 章的主要主题。书中解释了面向对象设计（`OOD`）与函数式分解的区别，然后深入地介绍了函数式分解方法。学生由此尽早获得了一个视角，即广泛使用的有两种设计方法——而不只有一种，且每种方法都有特定的用途。第\
  \ 4 章还涵盖了文件 I/O。对文件的早期引入允许分配需要使用示例数据文件的编程作业。这是图形化用户界面（`GUI`）首次引入的地方，带有用于文本输入输出的对话框，以及用于文件和目录的选择器。选择器都避免了某些导致流失败的情况，并允许使用完整路径访问文件，而不是像控制台方法那样依赖于文件与可执行文件处于同一目录中。\n\
  \n第 5 章从控制流和分支的概念开始，然后进入关系和布尔运算。使用 `If-Then` 和 `If-Then-Else` 结构的选择，展示了语句的物理顺序与逻辑顺序之间的区别。我们还开发了嵌套控制结构的概念。第\
  \ 5 章以一个详尽的“测试与调试”部分结束，该部分通过引入前置条件和后置条件扩展了模块化设计的讨论。算法走查和代码走查作为防止错误的手段，并使用执行跟踪来寻找可能进入代码的错误。我们还在这一部分中广泛地涵盖了数据验证和测试策略。在\
  \ GUI 部分，引入了用于输入数值的对话框，学生可以看到在小部件内设置范围限制如何避免使用自己的代码对输入进行范围检查的需求。我们还引入了一个返回 `Boolean`\
  \ 结果的是/否对话框。\n\n第 6 章致力于循环控制策略和使用 `While` 语句语法的循环操作。我们的方法不是引入多种语法结构，而是只使用 `While`\
  \ 语句来教授循环概念。在 GUI 部分，我们侧重于进一步获得第 5 章中引入的小部件的经验。第 7 章随后涵盖了 `C++` 中剩余的“甜点与蛋糕”控制结构（`Switch`、`Do-While`\
  \ 和 `For`），以及 `Break` 和 `Continue` 语句。就像它们的对应物一样，这些结构很好但并非必不可。额外的 `C++` 运算符讨论也在本章中，因为这些运算符有用但并非不可。在\
  \ GUI 部分，我们看到文件选择器如何避免检查文件是否存在。\n\n到第 8 章，学生已经习惯将问题拆分为模块并使用库函数，并且对编写自己的函数的想法持开放态度。第\
  \ 8 章专注于按值传递参数，并涵盖了函数调用的控制流、参数和形、局部变量以及接口设计。接口设计的涵盖包含了接口文档中的前置条件和后置条件、控制抽象、封装以及实现的物理隐藏与概念隐藏。GUI\
  \ 部分引入了新文件对话框，让用户创建输出文件。第 9 章扩展了第 8 章对函数的涵盖，包括返回值的函数、引用参数、作用域和生命周期、存根和驱动程序，以及关于接口设计的更多内容，包括副作用。由于第\
  \ 9 章到第 11 章有大量的编程概念，它们的 GUI 部分没有引入新的小部件；而是侧重于使用已涵盖的组件重构案例研究。\n\n第 10 章开始从书的前部分控制结构导向向后部分数据结构导向过渡。我们回顾了内置简单数据类型，基于每个类型所表示的值集以及对这些值允许的操作。涵盖了枚举类型、结构体和联合体。此外，第\
  \ 10 章包含了对简单数据类型与结构化数据类型的讨论，包括指针和引用类型。\n\n\n\n\n在第 11 章中，引入了`array`作为一种同构数据结构，其组件通过位置而非名称进行访问。书中深入探讨了一维数组，包括结构体数组。关于`C`字符串、二维数组、三维数组和多维数组的材料完善了对`array`类型的讨论。本章以在数组中使用指针以及数据的动态分配作为结束。\n\
  \n第 12 章通过引入抽象数据类型概念，为`class`构造的讨论奠定了基础。介绍了面向对象的术语，强调了`class`（类）和`object`（对象）之间的区别。强调了良好的类设计原则。介绍了使用规范文件和实现文件，作为一种信息隐藏的形式。尽管在简短的示例中讨论并阐述了可变性，但本章开发的所有`classes`都刻意设计为不可变的：学生在这个阶段已经有足够的新软件设计概念需要消化，无需再将这一要素加入。在\
  \ GUI 部分，我们看到了另一个使用文件对话框的示例，并引入了时间选择器以及开发自定义控件的基础知识。然而，在下一章中将反复演示可变`classes`的使用。\n\
  \n第 13 章通过将`list`定义为一种`ADT`整合了第 11 章和第 12 章的材料，然后由一个包含`array`的`class`实现。由于我们已经介绍了`classes`和`arrays`，从讨论的开始我们就可以清晰地区分`arrays`和`lists`。`array`是一种内置的固定大小数据结构。`list`是用户定义的可变大小结构，在本章中由一个`length`变量和一个在`class`对象中绑定在一起的项`array`表示。在第\
  \ 13 章中，我们为无序和排序的`list` `ADTs`设计了`C++` `classes`，并将`list`算法编码为`class`成员函数。GUI 部分说明了如何将常用组件组合在`custom\
  \ widget`中，该控件可在书中的代码文件中找到。我们的目标是让学生看到他们在第 14 到 16 章中将要的目标。第 14 章考察了数据的动态分配和释放。随后使用`Pointers`为来自第\
  \ 13 章的无序和排序的`list` `ADTs`提供动态链接实现。现在学生有了一些使用`objects`的经验，GUI 部分能够引入事件和事件处理程序。\n\
  \n第 15 章将数据抽象和`C++` `classes`的概念扩展到面向对象软件开发的探索中。引入了`inheritance`（继承）的概念，学生学习了区分`inheritance`和`composition`（组合）。本章还介绍了`C++`\
  \ `virtual functions`（虚函数），它们通过操作运行时绑定的形式支持`polymorphism`（多态）。在第 4 章中简要介绍并在第 12\
  \ 章中进一步开发的面向对象设计在这里也进行了更深入的探讨。我们给出了如何从问题陈述到软件解决方案的设计阶段的大纲。随后我们在案例研究中遵循这一大纲，实现设计并讨论测试策略。在\
  \ GUI 部分，学生看到`custom GUI`是一个`container object`（容器对象），其他`widget objects`按照特定的布局添加到其中并连接到`event\
  \ handlers`。通过这一部分，我们正在进入一个重要的新领域，展示了面向对象编程的威力。\n\n第 16 章引入了`C++` `templates`（模板）、`operator\
  \ overloading`（运算符重载）和`exception handling`（异常处理）。GUI 部分展示了`custom UI`如何超越控制台输入，以一种用户自然的方式增强程序的能力。第\
  \ 17 章讨论了经典数据结构并引入了它们的`STL`等效实现。几个`STL` `container classes`被用于重新实现之前章节中的程序。我们的最后一个\
  \ GUI 部分通过重构扑牌案例研究再次阐明了`custom UI`的优越性，通过在用户点击生成的`list`时显示卡片图像。\n\n第 18 章通过引入`recursion`（递归）的概念结束了本书。本章分为三部分：带有简单变量的`recursion`、带有`arrays`的`recursion`以及带有`pointers`的`recursion`。其组织结构允许教师根据喜好将`recursion`作为一个单独的主题或者在介绍返回值函数、`arrays`和`pointers`时逐一讲解。\n\
  \n## 附加功能\n\n### 特殊章节\n\n有五种特征从正文中区分开来：\n\n*   `Theoretical Foundations`章节介绍了与计算机科学基础理论相关的材料。\n\
  *   `Software Engineering Tips`讨论了使程序更可靠、健壮或高效的方法。\n*   `Matters of Style`解决了程序编码中的风格问题。\n\
  *   `Background Information`章节探索了增强学生通用知识的课题。\n*   `May We Introduce`章节包含了计算先驱的传记，如布莱斯·帕斯卡、查尔斯·巴贝、阿达·洛芙莱、凯瑟·约翰、托尼·霍尔、凯瑟·麦纳蒂和\
  \ Grace·霍珀。\n\n### 目标\n\n每章从目标列表开始，分为两类：知识目标和技能目标。这些目标都在章节练习中得到了强化和测试。\n\n### 演示程序\n\
  \n`demonstration programs`比案例研究示例短且更简单，为语法概念与问题解决背景的应用提供了桥梁。每章现在包含了完整的`演示程序`，穿插在新的主题之间。所有程序都可以在\
  \ blearning.com/PPS7e 获取，方便学生进行实验并在自己的项目中使用代码。\n\n### 软件维护案例研究\n\n现代软件工程工作大部分涉及维护旧代码。鉴于此，学习阅读、理解、扩展和修复现有`programs`的技能至关重要。这些技能在介绍课程中很少教授，因为重点往往是根据问题规范编写新程序。事实证明，这些维护技能实际上是成功编写新程序的一个重要方面：一旦编写了少量代码，让其正确运行的过程在本质上等同于维护。这些`case\
  \ studies`旨在培养阅读、分解、修改和测试现有`code`的技能。\n\n### 问题解决案例研究\n\n解决问题通过`case studies`演示最好。在每个问题解决案例研究中，我们提出问题并使用问题解决技术开发手动解决方案。接下来，我们使用函数分解、面向对象设计（或两者）将解决方案扩展为算法；然后用`C++`编写该算法。我们展示了示例测试数据和输出，随后对彻底测试程序的内容进行讨论。\n\
  \n### 测试与调试\n\n`Testing and Debugging`章节位于每章的`case studies`之后，深入考虑了章节材料对于彻底测试`programs`的影响。这些章节以测试和调试提示列表结束。\n\
  \n### 快速检查\n\n\n\n\n每个章节的末尾都有问题，用于测试学生对章节目标相关主要知识点的记忆情况。在阅读每个问题时，学生应该立即知道答案，然后可以通过查看章节末尾的答案来验证。\n\
  \n### 考试准备习题\n考试准备习题旨在帮助学生准备考试。这些问题通常有客观答案，设计为只需几分钟即可完成。\n\n## 编程热身练习\n编程热身练习为学生提供了编写\
  \ `C++` 代码段的经验。学生可以练习每个章节中的语法结构，而无需承担编写完整程序的负担。\n\n## 编程题\n编程题源自广泛的学科，要求学生设计解决方案并编写完整的程序。某些问题贯穿多个章节，后续章节的编程题会要求学生使用新的结构或技术重新实现解决方案，以此说明一个问题可以通过许多不同的方法来解决。\n\
  \n## 案例研究后续\n案例研究后续练习学生有机会通过阅读案例研究代码或对其进行修改来回答问题，从而加强软件维护技能。\n\n## 补充材料\n\n### 教师资源\n\
