  \ 4 个级别和 10 个小组。与上一个示例一样，执行此代码的结果是未定义的，但无疑是错误的。防止此类错误的有效方法是使用具名常量来代替字面量 10 和 4。在案例研究中，我们使用了\
  \ `NUM_LEVELS` 和 `NUM_GROUPS`。\n\n### 测试与调试提示\n\n1.  对一维数组进行子数组处理时，必须同时传递数组和实际使用的元素数量。\n\
