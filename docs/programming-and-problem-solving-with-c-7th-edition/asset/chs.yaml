  \n[/content]\n\n\n\n\n`QLabel` 将用于解释列表。然后，我们引入了一种名为 `QListWidget` 的新小部件类型，它可以包含一个可以添加、删除和显示的项目列表。我们还将添加一个原型方法，用于创建和初始化这些小部件：\n\
