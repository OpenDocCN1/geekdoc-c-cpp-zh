  \n描述\n\n5 输出行显示在每个输出语句结束的旁边。这些语句的实际输出中没有空行。\n\n## 2.4 程序的输入、修正和执行\n\n在本节中，我们将通俗地考察程序的输入过程。你应该查阅你特定计算机的说明书来了解细节。\n\
  \n### 输入程序\n\n输入程序的第一步是告诉计算机运行一个开发环境，其中包含代码编辑器。代码编辑器允许你创建和修改程序的代码，这些代码存储在文件中。\n\n\
  有许多不同类型的编辑器，每种都有不同的功能，我们无法在这里描述它们的所有特征。但我们可以描述它们的一些通用特征。\n\n代码编辑器非常像文字处理程序。它允许你在窗口中输入内容并在文件中移动以进行更改。在大多数开发环境中，代码编辑器还会对\
  \ C++ 语法的不同部分进行颜色标记，以便更容易区分关键字、变量、注释等。它还会自动对代码行进行缩进。某些代码编辑器会在你输入时检查语法，标记代码中可能无法编译的部分。\n\
  \n在许多开发环境中，编译器会自动使用代码编辑器显示它检测到代码中错误的地方。但请注意，编译器有时会在错误实际发生以外的地方检测到错误。例如，编译器会指出第一次使用未声明变量名的地方，而错误的源头可能是一个缺少了\
  \ `using` 语句。\n\n### 编译和运行程序\n\n一旦输入了程序，你就可以通过发布运行 C++ 编译器的命令来编译它。编译器会翻译程序，如果没有错误，它会将机器语言版本存储到文件中。开发环境可能会在单独的窗口中或编辑器中指示代码中的错误。\n\
  \n如果有错误，你必须确定它们的原因，在编辑器中修复它们，然后重新运行编译器。一旦你的程序无错误地通过编译，你就可以运行它。\n\n某些系统在程序编译成功后会自动运行程序。在其他系统上，你必须发布一个单独的命令来运行它。还有其他系统要求在编译和运行程序之间指定一个称为“链接”的额外步骤。无论你的系统使用什么种系列命令，结果都是相同的：你的程序被加载到内存中并由计算机执行。\n\
  \n即使程序在运行，它在设计上可能仍有错误。计算机完全按照你让它做的事情去做，即使那不是你想要的结果。如果你的程序没有按预期的方式工作（逻辑错误），你必须返回算法并修复它，然后回到编辑器修复程序。最后，你再次编译并运行程序。这个调试过程会反复进行，直到程序执行它应该做的事情（参见图\
  \ 2.3）。\n\n![描述调试过程的流程图。](img/9781284166033_CH02_FIGF03.jpg)\n\n描述\n\n图 2.3 调试过程\n\
  \n### 测试与调试\n\n1. 2.1 每个不是 C++ 保留字的标识符都必须声明。如果你使用未声明的名称（无论是通过自己的声明语句还是通过包含头文件），你就会收到错误信息。\n\
  \n2. 2.2 如果你尝试声明与 C++ 保留字相同的标识符，你将收到错误信息。保留字列表请参见附录 A。\n\n3. 2.3 C++ 是一种区分大小写的语言。两个大小写不同的标识符被视为两个不同的标识符。`main`\
  \ 和所有 C++ 保留字仅使用小写字母。\n\n4. 2.4 要使用标准库中的标识符（如 `cout` 和 `string`），你必须在程序顶部放置一个 `using`\
  \ 指令：\n\n    ![为了使用 cout 和 string 应该包含的 using 指令。](img/9781284166033_CH02_PRE94.jpg)\n\
  \n    描述\n\n5. 2.5 检查 `char` 和字符串字面量中的引号匹配。每个 `char` 字面量以单引号开头并结束。字符串字面量以双引号开头并结束。\n\
  \n6. 2.6 确保只使用单引号 `'` 来包裹 `char` 字面量。大多数键盘还有反引号 `` `，它很容易与单引号混淆。如果你使用了反引号，你将收到错误信息。\n\
  \n7. 2.7 为了在字面量中使用双引号，请连续使用符号 `\\\"`。如果你只使用双引号，它将结束字符串，然后编译器会将剩余部分视为错误。\n\n8. 2.8\
  \ 在赋值语句中，确保 `=` 左侧的标识符是变量而不是命名常量。\n\n9. 2.9 给字符串变量赋值时，=` 右侧的表达式必须是字符串表达式、字符串字面量或\
  \ `char`。\n\n10. 2.10 在连接表达式，`+` 的操作数至少有一个是字符串类型。例如，操作数不能都是字面量字符串或 `char` 值。（6）\n\
  \n11. 2.11 确保你的语句以分号结束（块结构不需要分号）。\n\n\n\n\n\nC++ 内置数据类型分为简单类型、结构化类型和地址类型（参见图 3.1）。不要被图\
  \ 3.1 中所示的数据类型数量所震慑。我们的目的仅仅是让你对 C++ 中可提供的类型类型有一个整体认识。本章重点关注整数类型和浮点类型。其他类型的详细信息将在文后部分介绍。首先我们查看整数类型（主要用于表示整数的类型），然后考虑浮点类型（用于表示包含小数的小数）。\n\
  \n![C++ 中的数据类型。](img/9781284166033_CH03_FIGF01.jpg)\n\n图 3.1 C++ 数据类型\n\n描述\n\n\
  ## 3.2 数值数据类型\n\n你已经熟悉数学中的整数和实数概念，它们是无限的数字集合。然而，在计算机中，由于内存被划分为固定大小的单元，相应的数据类型在它们的取值范围上是有限的。\n\
  \n### 整数类型\n\n`char`、`short`、`int` 和 `long` 数据类型被称为整数类型（或整数类型），因为它们指的是整数值——即没有小数部分的整数字。（我们将在第\
  \ 5 章中考虑剩余的整数类型 `bool`。）\n\n在 C++ 中，整数值的简单形式是一个或多个数字的序列：\n\n![一些整数值。](img/9781284166033_CH03_PRE1.jpg)\n\
  \n描述\n\n不允许使用逗号。\n\n整数值前面的负号会使该整数变为负：\n\n![一些负整数值。](img/9781284166033_CH03_PRE2.jpg)\n\
  \n描述\n\n在 C++ 中，存在一个例外，因为该语言也拥有不允许负值的整数类型版本。例如，有一种类型名为 `unsigned int`。无符号整数值只能是正数或零。无符号类型主要用于特殊情况。我们在本书中很少使用\
  \ `unsigned`。\n\n`char`、`short`、`int` 和 `long` 数据类型旨在表示不同大小的整数，从较小（位数较少）到较大（位数较多）。大小取决于机器；也就是说，它们可能随机器而有所不同。下表显示了示例范围：\n\
  \n![列出 C++ 中数据类型示例范围的表格。](img/9781284166033_CH03_UTAB97-1.jpg)\n\n描述\n\n在另一台机器上，`int`\
  \ 的大小可能与 `long` 的大小相同。通常情况下，内存单元中的字节越多，在该单元可以存储的整数值就越大。在嵌入式计算机上（例如微波炉的控制器），`int`\
  \ 值的范围可能从 −32,768 到 +32,767。\n\n尽管我们在第 2 章中使用 `char` 类型来存储如 'A' 等字符数据，但 C++ 将 `char`\
  \ 分类为整数类型，因为它也允许 `char` 用于存储范围非常有限的整数。\n\n在第 1 章的 `LeapYear` 程序中，标识符 `year` 的类型是\
  \ `int`。你几乎总是使用 `int` 处理整数值，但如果程序需要大于最大 `int` 值的值，有时必须使用 `long`。如果程序尝试计算大于机器最大值的值，结果就是整数溢出。某些机器在溢出发生时显示错误信息，而另一些则不会。我们在后面的章节中讨论溢出。\n\
  \n关于 C++ 中整数的一个警告：以零开头的字面量常量被视为八进制（基 8）数而不是十进制（基 10）数。因此，如果你写下\n\n![一个八进制数。](img/9781284166033_CH03_PRE3.jpg)\n\
  \n描述\n\nC++ 编译器将其理解为十进制 25。如果你熟悉八进制体系，不用担心为什么八进制的 31 等于十进制的 25。（1）要重要的是不要以零开头十进制整数常量（除非你只需要数字\
  \ 0，它在两种情况下都是一样的）。在第 10 章中我们将详细讨论浮点类型。\n\n### 浮点类型\n\n浮点类型（或浮动类型）用于表示实数。浮点数有整数部分和小数部分，但两者都可能缺失。是一些示例：\n\
  \n![浮点值。](img/9781284166033_CH03_PRE5.jpg)\n\n描述 正就像整数类型 `char`、`short`、`int` 和\
  \ `long` 一样，浮点类型 `float`、`double` 和 `long double` 也取决于机器。浮点值还可以带有指数，就像科学计数法。与其写\
  \ $3.5 \\times 10^{12}$，我们在 C++ 中写成 `3.5E12`。`E` 表示 10 的幂。数字不需要包含小数点。大多数程序不需要 `double`\
  \ 类型。通常，`float` 提供六到七位精度，最大值为 `3.4E38`。我们在本章末的案例中使用 `float` 表示金额和利率。下表显示了浮点类型的示例范围：\n\
  \n![列出 C++ 中浮点数据类型示例范围的表格。](img/9781284166033_CH03_UTAB99-1.jpg)\n\n描述\n\n关于浮点数你还需要知道的最后一点：计算机不能总是表示实数。由于精度限制，像三分之一这样的数字会被近似为\
  \ 0.333333。如果你将三分之一加三次，在数学上它等于 1.0。但在计算机上你会得到 0.999999。在大多数情况下，微小的误差是可以预见的，并不是程序员的错误。\n\
  \n## 3.3 数值类型的声明\n\n正如 `char` 和字符串类型一样，我们可以声明 `int` 和 `float` 的命名常量和变量。这种语法与之前相同，字面量和数据类型的名称不同。\n\
  \n### 命名常量声明\n\n在命名常量声明的情况下，声明中的字面值是数值而不是引号中的字符。这里是 `int` 和 `float` 类型值的示例常量声明。为了比较，还包含了\
