  \n描述\n\n### 测试与调试\n\n### 处理输入错误\n\n多次，我们让程序测试无效数据并为错误输入编写错误消息。编写错误消息只是处理错误的第一步。我们还必须决定程序下一步做什么。问题本身以及错误的严重程度决定了采取的行动。\n\
  \n对于只从输入文件读取数据的程序，无法与输入数据的人交互。因此，程序应该尝试考虑这些坏数据项（如果可能的话）。\n\n如果无效数据项不是重要的，程序可以跳过它并继续；例如，一个平均成绩的程序遇到负分时，可以简单跳过。如果存在坏输入的默认值，则可以在处理之前将其设置为该值。在任何情况下，都应该输出一条消息，说明遇到了无效数据以及是如何处理的。这些消息构成了异常报告。\n\
  \n\n\n\n\n这些关于处理不良数据的建议假设程序能够识别出不良数据值。错误检测有两种方法：被动检测和主动检测。\n\n**被动错误检测**将错误检测交给系统。这看起来似乎更容易，但当发生错误时，程序员就放弃了对处理的控制。被动错误检测的一个例子是系统的除以零错误。\n\
  \n**主动错误检测**意味着程序检查可能的错误，并在发生错误时确定适当的行动。主动错误检测的一个例子是读取一个值，并使用 `If` 语句在将其除以另一个数字之前检查该值是否为\
  \ 0。\n\n### 使用指针调试\n\n使用指针的程序比没有指针的程序更难编写和调试。当你想要获取变量的内容时，间接寻址似乎永远没有直接寻址那样“正常”。\n\
  \n与指针变量的使用相关的两种常见错误如下：\n\n1. 将指针变量与它所指向的变量混淆。\n2. 尝试对 `NULL` 指针或未初始化的指针进行解引用。\n\n\
  让我们逐一查看这些潜在问题。\n\n如果 `ptr` 是一个指针变量，则必须注意不要将表达式 `ptr` 和 `*ptr` 混淆。\n\n表达式\n\n![有一行代码列出了包含内存地址的指针变量。第\
  \ 1 行，p t r。](img/9781284166033_CH10_604.jpg)\n\n访问变量 `ptr`（它包含一个内存地址）。表达式 `*ptr`\n\
  \n![有一行代码列出了指针访问的变量。第 1 行，星号 p t r。](img/9781284166033_CH10_604a.jpg)\n\n访问 `ptr`\
  \ 所向的变量。\n\n| `ptr1 = ptr2` | 将 `ptr2` 的内容复制到 `ptr1` 中。 |\n| `*ptr1 = *ptr2` | 将\
  \ `ptr2` 指向变量的内容复制到 `ptr1` 指向的变量中。 |\n| `*ptr1 = ptr2` | 非法——一个是指针，另一个是被指向的变量。 |\n\
  | `ptr1 = *ptr2` | 非法——一个是指针，另一个是被指向的变量。 |\n\n第二种常见错误是对 `NULL` 或未初始化的指针进行解引用。在某些系统上，尝试解引用\
  \ `NULL` 指针会产生类似于 `NULL POINTER DEREFERENCE` 的运行时错误消息，随后立即终止程序。当此事件发生时，你至少对问题所在有个大致概念。\n\
  \n然而，如果你的程序对未初始化的指针进行解引用，情况就会更糟。在代码段中\n\n![两行列出了代码段。](img/9781284166033_CH10_604b.jpg)\n\
  \n描述\n\n![代码段的一行。](img/9781284166033_CH10_604c.jpg)\n\n描述\n\n在我们解引用 `intPtr` 之前，该变量尚未被赋予任何值。初始时，它包含某些无意义的值，例如\
  \ `315988`，但计算机并不知道它是无意义。机器只是访问内存位置 `315988` 并将其找到的任何内容复制到 `num` 中。没有办法可以测试指针变量是否包含未定义的值。我们提供的避免此类问题的建议是仔细检查代码，确保每个指针变量在被解引用之前都已赋值。\n\
  \n## 测试与调试的提示\n\n1. 避免在表达式中使用不必要的副作用。以下测试\n\n![一个问题列出了代码段。](img/9781284166033_CH10_605.jpg)\n\
