  \n![一个代码片段。](img/9781284166033_CH14_P858-3.jpg)\n\n描述\n\n让我们看看删除组件为 30 的节点时会发生什么。下图显示了该结构，节点在到达\
  \ `While` 语句时的状态已被标记。由于 `While` 和 `If` 表达式非常长，我们只显示了负责结果的表达式部分。\n\n![一个矩形框内包含 8\
