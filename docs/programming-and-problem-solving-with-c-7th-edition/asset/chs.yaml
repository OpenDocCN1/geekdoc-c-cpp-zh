  \n![A statement.](img/9781284166033_CH10_586c.jpg)\n\n\n\n\n![一段代码片段。如果，左括号，星号，int\
  \ p t r 1， 2 等号，星号，int p t r 2，右括号)。](img/9781284166033_CH10_588b.jpg)\n\nC++ 标准最近修订引入了一个新关键字，称为\
  \ `nullptr`，它最终将取代 `NULL`。由于 `nullptr` 是一个关键字，因此不需要包含头文件即可使用它。\n\n## 10.8 引用类型\n\
  \n根据图 10.7 所示，仅剩余一种内置类型：`引用类型`。和指针变量一样，引用变量包含其他变量的地址。该语句\n\n![一条语句。Int，和符号，int r\
  \ e f，分号。](img/9781284166033_CH10_588aa.jpg)\n\n声明 `intRef` 是一个可以包含 `int` 变量地址的变量。以下是声明引用变量的语法模板：\n\
  \n![声明引用变量的语法模板。(images/9781284166033_CH10_588c.jpg)描述虽然引用变量和指针变量包含数据对象的地址，但它们之间有两个根本区别。首先，解引用运算符和取地址运算符（`*`\
  \ 和 `&`）不用于引用引用变量。在声明引用变量后，编译器会透明地对该引用变量的每一次出现进行解引用。如果你对引用变量使用 `*` 或 `&`，它将改为应用于该变量所引用的对象上。![一个两列的表格。](img/9781284166033_CH10_589.jpg)\n\
  \n描述\n\n有些程序员喜欢将引用变量视为另一个变量的别名。在前面的代码中，我们可以将 `intRef` 视为 `gamma` 的别名。在声明中初始化 `intRef`\
  \ 之后，我们对 `intRef` 执行的所有操作实际上都是在 `gamma` 上进行的。\n\n引用和指针变量之间的第二个区别是，引用变量的值在初始化后不能重新赋值；也就是说，我们不能让\
  \ `intRef` 指向另一个变量。在这种情况下，它将始终指向 `gamma`。任何更改 `intRef` 的尝试只是给 `gamma` 分配一个新值。还需要注意的是，引用变量不能初始化为\
  \ 0 或 `NULL`；引用必须指向一个实际存在的对象。相比之下，指针可以设置为 `NULL` 以表示它不指向任何内容。\n\n到目前，你可能已经注意到取和符号（`&`）在\
  \ C++ 语言中有多种含义。为了避免错误，识别这些不同的含义至关重要。下表总结了 `&` 的不同用法。请注意，前缀运算符位于操作数之前，中缀运算符位于操作数之间，而后缀运算符则位于操作数之后。\n\
  \n| 位置 | 用法 | 含义 |\n| :--- | :--- | :--- |\n| 前缀 | `&`变量 | 取地址操作 |\n| 中缀 | 表达式 `&`\
  \ 表达式 | 按位与运算（参见附录 B） |\n| 中缀 | 表达式 `&&` 表达式 | 逻辑与运算 |\n| 后缀 | 数据类型`&` | 数据类型（专门指引用类型）*异常：*为了声明两个引用类型的变量，`&`\
  \ 必须附加到每个变量名上：`int & var1, &var2;` |\n\n### 图形用户界面 (GUI)\n\n为了引入 GUI，我们需要对样式分析程序进行的修改很小。原始程序要求用户输入一个文件。同样，它会将该输入文件的分析结果作为文本输出到屏幕上。因此，重构该程序以使用图形界面需要我们替换控制台输入输出。坦率地说，我们已经看到了两种允许我们进行这些更改的\
  \ GUI 组件。特别是，我们可以使用 `FileDialog` 来选择文件，并使用 `OutputDialog` 来显示分析结果。\n\n正如我们在之前章节的\
  \ GUI 程序中所做的那样，我们首先包含必要的头文件：\n\n![两个 include 语句。](img/9781284166033_CH10_598.jpg)\n\
