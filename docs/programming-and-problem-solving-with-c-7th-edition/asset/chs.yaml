  ## 12.3 信息隐藏\n\n从概念上说，对象周围有一道不可见的墙，称为“抽象屏障”（abstraction barrier），它保护私有数据和函数不被客户端代码访问。屏障还防止对象直接访问外部的数据和函数。这种屏障是类和抽象数据类型的关键特征。为了让对象与客户端代码共享信息，抽象屏障需要一个开口：公共接口——其成员声明为\
  \ `public`。如果唯一的公共成员是函数和常量，且所有成员变量都是私有的，那么客户端只能间接操作操作对象的内部值——通过调用公共接口中的函数。\n\n电气工程师使用一个类似的概念，称为“黑盒”（black\
  \ box），这是一个内部原理保持隐藏的模块。用户从书面说明书中知道盒子的*做什么*，但不知道它是*怎么*做的。如果用户根据说明书向盒子连接电线，它就能正常工作（参见**图\
  \ 12.4**）。\n\n在软件设计中，同样的概念被称为“信息隐藏”（information hiding）。信息隐藏允许客户端代码在不了解任何实现细节的情况下使用类。信息隐藏还确保客户端无法以损害实现正确性的方式访问私有代码或数据。\n\
  \n![图显示了一个带有接口的盒子，每个输入和输出都有 2 个插座。四根不同颜色的电线作为输入和输出插入。](img/9781284166033_CH12_FIGF12_4.jpg)\n\
  \n图 12.4 黑盒\n\n我们之前讨论过封装和信息隐藏。在第 8 章中，我们提到过将函数实现隐藏在单独文件中可能。现在我们来看通过将类成员函数的实现放在与客户端代码分离的文件中来隐藏这些实现。\n\
  \nC++ 类的创建者选择哪些成员是私有的，哪些公共的。由于信息隐藏对数据抽象至关重要，大多数类都表现出一种典型的模式：数据变量是私有的，操作它们的函数是公共的。将变量设为公共将允许客户端直接检查并修改它们的值，这将破坏抽象性。\n\
  \n`TimeOfDay` 类证明了这种组织方式。它的变量是私有的，因此客户端无法访问它们。结果，以下客户端语句会导致编译时错误：\n\n![2 条语句。第 1\
  \ 行：时间，检查签入时间，分号。第 2 行：签入时间，点，小时，等于，9，分号。两个正斜杠。在客户端代码中禁止。](img/9781284166033_CH12_P694-1.jpg)\n\
  \n描述\n\n因为只有类的成员函数可以访问私有数据，类的创建者可以完全控制客户端代码如何使用它。如果希望让客户端*检查*私有数据，那么类可以提供观察者函数。`TimeOfDay`\
  \ 类有四个观察者函数：`Write`、`Increment`、`Equal` 和 `LessThan`。由于这些函数不应该修改私有数据，因此它们在参数列表之后声明时带有\
  \ `const`：\n\n![声明语句。](img/9781284166033_CH12_P694-2.jpg)\n\n描述\n\nC++ 将这些称为 `const`\
  \ *成员函数*。在 `const` 成员函数的体内部，如果某个语句尝试修改任何私有变量，就会发生编译时错误。你应该使用不应修改私有数据的 `const` 成员函数。\n\
  \n### **用户编写的头文件**\n\n当你创建自己的 ADT 时，通常会发现它们在多个程序中都很有用。例如，考虑一个由一年中的月份组成的枚举。与其在每个使用它的程序开头都输入这些内容，你可以将此声明放在一个命名为例如\
  \ `months.h` 的文件中。然后你可以使用 `#include months.h` 让预处理器插入该文件的内容。\n\n你只需要记住一个微小的区别。当头文件文件名写在尖括号中，如下所示：\n\
  \n![一个头文件。哈 包含，左尖括号，i stream，右尖括号。](img/9781284166033_CH12_P695-2.jpg)\n\n预处理器会在标准\
  \ C++ 目录中查找该文件。对于你自己的头文件，你应该将名称包含在双引号中，\n\n![一个头文件。哈 包含，双引号，months dot h，双引号。](img/9781284166033_CH12_P695-3.jpg)\n\
  \n这会导致预处理器在当前目录（包含你的程序的目录）中查找文件，如**图 12.5**所示。\n\n当我们实现类时，头文件在保护信息隐藏方面也起着作用，正如接下来看到的。\n\
  \n![程序中包含头文件的过程。](img/9781284166033_CH12_FIGF12_5.jpg)\n\n描述\n\n图 12.5 头文件\n\n###\
  \ **规范与实现文件**\n\nADT 包含两个部分：规范和实现。规范充分描述了数据类型的行为，以便客户端使用它。实现包含了具体的数据表示和操作代码，它是隐藏的。`TimeOfDay`\
  \ 类的声明充当它的规范，以函数原型的形式向用户展示公共接口。为了实现 `TimeOfDay`，我们为成员函数提供了函数定义。\n\n在 C++ 中，习惯上（但不是）将类声明和类实现放在不同的文件中。一个文件——*规范文件*——是头（**.h**）文件，只包含类声明。第二个文件——*实现文件*——包含函数定义。\n\
  \n\n\n\n以下是 `TimeOfDay` 的规范文件。这与我们之前看到的相同，但包含了前置条件（preconditions）和后置条件（postconditions），以便尽可能明确地指定成员函数的语义。\n\
  \n![一段程序段。](img/9781284166033_CH12_P696-1.jpg)\n\n描述\n\n原则上来说，规范文件不应向类的用户暴露任何实现细节。该文件应该指定每个成员函数*做了什么*，而不是规定它是*如何做到的*。然而，正如你在前面的类声明中所看到的，某些实现细节是可见的：具体的数据表示列在私有（private）部分。尽管如此，由于数据表示仍被视为隐藏信息，因为编译器禁止客户端代码直接访问这些数据。\n\
  \n这里是一个操作两个 `TimeOfDay` 类对象的客户端程序。该程序的编写时并不知道该类是如何实现的。\n\n![一段程序段。](img/9781284166033_CH12_P697-1.jpg)\n\
