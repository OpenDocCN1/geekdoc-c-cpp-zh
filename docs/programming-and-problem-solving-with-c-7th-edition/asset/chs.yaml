  \n## 第 10 章：用户定义数据类型\n\n本章代表了你编程学习的一个转折。到为止，我们一直强调简单变量和控制结构。在本章中，重点转向了数据的结构化（组织）。为了开始这一转变，我们将更详细地研究数据类型的概念。\n\
  \n到目前为止，我们主要处理 `int`、`char`、`bool` 和 `float` 数据类型。这四种类型在技术上足以解决任何问题，但有时，仅使用内置类型在程序中表示数据会变得繁琐。C++\
  \ 有几种创建用户定义数据类型的机制；即由我们自己定义的新数据类型。本章引入了其中一种机制：枚举类型（enumeration type）。\n\n我们还扩展了数据类型的定义，包含了结构化类型，这种类型表示组件的集合。我们从通用的结构化类型开始，然后查看\
  \ C++ 提供的两个示例：`struct` 和 `union`。\n\n## 10.1 内置简单类型\n\n在第 2 章中，我们将数据类型定义为一组值（称为域）以及对这些值的一组操作。对于\
  \ `int` 类型，域是从 `INT_MIN` 到 `INT_MAX` 的整数集合，我们到为止见过的操作包括 `+`、`–`、`*`、`/`、`%`、`++`、`--`\
  \ 以及关系和逻辑操作。`float` 域是特定计算机能够表示的实数集合，其操作与 `int` 类型类似，但排除了模运算（`%`）。对于 `bool` 类型，域是\
  \ `true` 和 `false` 值，操作是逻辑（`!`、`&&`、`||`）和关系操作。`char` 类型虽然主要用于表示字符，但被归类为整数类型，因为它使用整数来代表字符。在章稍后的部分我们将看到它是如何工作的。\n\
  \n`int`、`char`、`bool` 和 `float` 类型有一个共同属性：每个类型的域都由不可分割的（或原子的）值组成。具有这种属性的数据类型被称为**简单（原子）数据类型**。原子值不具有可以单独访问的组件部分；例如，一个\
  \ `char` 类型的单个字符是原子的，但字符串“Good Morning”是由 12 个我们也可以访问的单个字符组成的。\n\n描述简单类型的另一种方式是说，该类型的变量只能关联一个值。相比之下，结构化类型允许整个值集合与一个变量关联。正如我们刚刚注意到的，字符串包含一个字符集合，它可以被赋值给代表它的变量。\n\
  \n![根节点被标记为简单类型。根节点有 3 个子节点，标记为 integral、enum 和 floating。标记为 integral 的节点的子节点如下：char,\
  \ short, int, long 和 bool。前 4 类型被标记为无符号。标记为 floating 的节点的子节点如下：float, double 和 long\
  \ double。](img/9781284166033_CH10.jpg)\n\n### 10.1.1 数字类型\n\n`char`、`short`、`int`\
  \ 和 `long` 类型表示不同大小的整数。同样，`float`、`double` 和 `long double` 指不同大小的浮点数。什么是大小？\n\n\
  在 C++ 中，大小是以 `char` 的大小为单位衡量的。根据定义，`char` 的大小为 1。在大多数而非所有计算机上，1 意味着一个字节。（回顾第 1 章`\
  \ 来表示类型 `SomeType` 的大小。那么，根据定义，`sizeof(char)` = 1。除了 `char` 之外，C++ 数据对象的大小取决于机器。在某些机器上，情况可能是：\n\
  \n1. `sizeof(char)` = 1\n2. `sizeof(short)` = 2\n3. `sizeof(int)` = 4\n4. `sizeof(long)`\
  \ = 8\n\n在另一机器上，大小可能如下：\n\n1. `sizeof(char)` = 1\n2. `sizeof(short)` = 2\n3. `sizeof(int)`\
  \ = 2\n4. `sizeof(long)` = 4\n\n尽管存在这些差异，C++ 语言保证以下语句为真：\n\n* 1 = `sizeof(char)`\
  \ <= `sizeof(short)` <= `sizeof(int)` <= `sizeof(long)`。\n* 1 <= `sizeof(bool)`\
  \ <= `sizeof(long)`。\n* `sizeof(float)` <= `sizeof(double)` <= `sizeof(long double)`。\n\
  * `char` 至少 8 位。\n* `short` 至少 16 位。\n* `long` 至少 32 位。\n\n对于数值数据，大小决定了值的范围。我们在第\
  \ 3 章中展示了数值类型的值范围表。请小心：数值数据类型的实际范围取决于机器。在程序中对实际范围做假设可能会在在另一台机器上运行时产生问题。\n\n\n\n\n\
  回记住，关键字 `unsigned` 可能会出现在某些整数类型之前——`unsigned char`、`unsigned short`、`unsigned int`\
  \ 和 `unsigned long`。这些类型的值是非负整数，范围从 0 到某些取决于机器的最大值。尽管我们在文中很少使用无符号类型，但为了严谨性，我们在这里提到了它们。\n\
  \nC++ 系统提供了 C 头文件 `climits`，你可以从中确定机器的最大值和最小值。该头文件定义了常量 `CHAR_MAX` 和 `CHAR_MIN`、`SHRT_MAX`\
  \ 和 `SHRT_MIN`、`INT_MAX` 和 `INT_MIN`以及 `LONG_MAX` 和 `LONG_MIN`。无符号类型的最小值为 0，最大值由\
  \ `UCHAR_MAX`、`USHRT_MAX`、`UINT_MAX` 和 `ULONG_MAX` 定义。要找到你计算机的具体值，你可以这样输出它们：\n\n\
  ![用于输出计算机特定值的代码。](img/9781284166033_CH10_554.jpg)\n\n描述\n\n为了可移植性设计的代码应该在程序需要的地方这些限制。\n\
  \n同样，标准 C 头文件 `cfloat` 定义了常量 `FLT_MAX` 和 `FLT_MIN`、`DBL_MAX` 和 `DBL_MIN`以及 `LDBL_MAX`\
  \ 和 `LDBL_MIN`。要确定机器的值范围，你可以编写一个短程序来输出这些常量。\n\n注意，C++ 标准增加了名为 `limits.h` 和 `float.h`\
  \ 的头文件，它们也包含了这些定义。\n\n### 字符\n\n每台计算机都使用特定的字符集。ASCII 集合由 128 个不同的字符组成，历史上被大多数计算机使用。ASCII\
  \ 的扩展版本提供了 256 个字符，对于英语足够但对于国际使用不足。这种局限性产生了 Unicode 字符集。\n\nUnicode 允许更多的字符。它的发明主要是为了适应许多人类语言字母和符号的多样性，以及最近的表情符号。在\
  \ C++ 中，Unicode 使用数据类型 `wchar_t` 而不是 `char`。在本文中为了简单起见，我们将代码限制在 `char` 类型和 ASCII；但是，如果你发现自己在为国际部署编写程序，学习\
  \ `wchar_t` 的细节是好的。\n\n无论使用哪种字符集，每个字符都有**外部表示**——它在屏幕等 I/O 设备上的外观——以及**内部表示**——它存储在计算机内存中的方式。如果你在\
  \ C++ 程序中使用 `char` 常量 `'A'`，它的外部表示是字母 A；也就是说，如果你显示它，你会看到一个 A，正如你预期的。然而，它的内部表示是一个存储在整数值内部的数据值。128\
  \ 个 ASCII 字符的内部表示从 0 到内存单元 127。例如，附录 E 中的 ASCII 表显示字符 `'A'` 的内部表示为 65，字符 `'b'` 的内部表示为\
  \ 98。\n\n让我们再次查看以下语句：\n\n![语句。语句中的单词合并。某些 char，等号，单引号，大写 A，单引号，分号。](img/9781284166033_CH10_555.jpg)\n\
  \n编译器将常量 `'A'` 翻译为整数 65。我们也可以这样写该语句：\n\n![语句。语句中的单词合并。某些 char，等号，65，分号。](img/9781284166033_CH10_555a.jpg)\n\
  \n这两个语句的效果相同——将 65 存储到 `someChar` 中。然而，第一个更容易理解。\n\n我们之前提到过，计算机无法区分内存中的字符和整数数据，因为它们都以整数的形式存储。然而，当我们执行\
  \ I/O 操作时，计算机会做正确的事——它使用与输出表达式的数据类型相对应的外部表示。例如这段代码段：\n\n![代码段。](img/9781284166033_CH10_555b.jpg)\n\
  \n描述\n\n当执行这些语句时，输出是\n\n![一个语句的输出。第 1 行：97。第 2 行：a。](img/9781284166033_CH10_555c.jpg)\n\
  \n当 `<<` 运算符输出 `someInt` 时，它生成字符 9 和 7 的序列。对于 `someChar`，它输出单个字符 `a`。尽管两个变量在内部都包含值\
  \ 97，但每个变量的数据类型决定了它是如何输出的。\n\n你认为以下语句序列输出什么？\n\n![一系列语句。语句中的单词合并。第 1 行：char c h\
