  \ | `toStr` 是 `char` 数组且 `fromStr` 是 C 字符串（空结尾 `char` 数组），且 `toStr` 必须足够大以容纳结果。\
  \ |\n| Effect: | `fromStr`（包括空字符 `'\\0'`）拷贝到 `toStr`，覆盖原有内容。 |\n| Function 返回值:\
  \ | `toStr` 的基地址 |\n| Note: | 程序员经常忽略函数的返回值，使用 void 函数调用的语法而不是返回值的函数调用的语法。 |\n\n\
  | `strlen(str)` |\n| Argument: | 一个 C 字符串（空结尾 `char` 数组）`str` |\n| Function 返回值:\
  \ | 大于等于 0 的 `int` 值，即 `str` 的长度（不包括 `'\\0'`） |\n\n### C.9 头文件 `string`\n\n此头文件提供了名为\
  \ `string` 的用户定义数据类型（具体来说是一个类）。与 `string` 类型相关的是数据类型 `string::size_type` 和命名常量 `string::npos`，定义如下：\n\
  \n| `string::size_type` | 与字符串中字符数量相关的无符号整数类型 |\n| `string::npos` | 类型 `string::size_type`\
  \ 的最大值 |\n\n有几十个与 `string` 类型相关的函数。下面是其中最重要的几个。在描述中，假设 `s` 正一个类型为 `string` 的变量（对象）。\n\
  \n| `s.c_str()` |\n| Arguments: | 无 |\n| Function 返回值: | 与 `s` 中存储的字符对应的 C 字符串（空结尾\
  \ `char` 数组）的基地址 |\n\n| `s.find(arg)` |\n| Argument: | `string` 或 `char` 类型的表达式，或者\
  \ C 字符串（如字面量字符串） |\n| Function 返回值: | `string::size_type` 类型的值，给出 `arg` 在 `s` 中找到的起始位置。如果未找到\
  \ `arg`，返回 `string::npos`。 |\n| Note: | 字符串内部字符的位置从 0 开始编号。 |\n\n| `getline(inStream,\
  \ s)` |\n| Arguments: | 输入流 `inStream`（`istream` 或 `ifstream` 类型）和一个 `string` 对象\
  \ `s` |\n| Effect: | 从 `inStream` 读取并存入 `s` 直到遇到换行符。（换行符被读取但未存入 `s`。） |\n| return\
  \ value: | 虽然函数返回一个值（我们不讨论），但通常像调用 void 函数一样调用它。 |\n\n| `s.length()` |\n| Arguments:\
  \ | 无 |\n| Function 返回值: | `string::size_type` 类型，给出字符串中字符的数量 |\n\n| `s.size()`\
  \ |\n| Arguments: | 无 |\n| Function 返回值: | 同 `s.length()` |\n\n| `s.substr(pos,\
  \ len)` |\n| Arguments: | 两个无符号整数 `pos` 和 `len`，表示位置和长度。`pos` 的值必须小于 `s.length()`。\
  \ |\n| Function 返回值: | 一个临时 `string` 对象，包含从 `s` 的位置 `pos` 开始最多 `len` 个字符。如果 `len`\
  \ 过大，则表示“到 `s` 字符串的末尾”。 |\n\n此头文件提供了各种派自 `iostream` 的类，使用户能够对字符串而非文件应用流操作。本文仅使用\
  \ `ostringstream` 类，它使我们能够将数值类型转换为格式化的字符串值。我们可以将插入运算符 `<<` 应用于 `ostringstream` 对象以向其追加值，然后使用\
  \ `str` 函数读取其字符串形式的内容。在下文中，`oss` 是一个 `ostringstream` 对象。\n\n| `ostringstream()`\
  \ |\n| Argument: | 无 |\n| Return value: | 空 `ostringstream` 对象 |\n\n| `ostringstream(arg)`\
  \ |\n| Argument: | 字符串 |\n| Return value: | 初始化为参数字符串的 `ostringstream` 对象 |\n\n\
  | Left argument: | `ostringstream` 对象 |\n| Right argument: | 可转换为字符串的表达式，包括输出操作符\
  \ |\n| Return value: | `ostringstream` 对象 |\n| Evaluated: | 从左到右 |\n\n| `oss.str()`\
  \ |\n| Argument: | 无 |\n| Function 返回值: | 所有追加到 `oss` 的内容的字符串 |\n\n| `oss.str(arg)`\
  \ |\n| Argument: | 字符串 |\n| Effect: | 将参数赋值赋予 `oss`。使用空字符串作为参数有效地将 `ostringstream`\
  \ 对象的内容为空。 |\n\n## 附录 D 设置 GUI 开发环境\n\n\n\n\nQt Creator 4.15.1 是本文使用的图形化开发环境，并与其随分发的源代码兼容。所有代码示例都已针对\
