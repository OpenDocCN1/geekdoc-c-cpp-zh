  \n图 12.3 两个对象的概念视图\n\n## 对象的内置操作\n\n程序员定义的类与内置类型有许多相似之处。例如，你可以根据所需要声明任意数量的类对象。你可以将对象传递给函数并将其作为函数值返回。像任何变量一样，对象可以是自动的（在进入块时创建）或静态的（在程序启动时创建）。\n\
