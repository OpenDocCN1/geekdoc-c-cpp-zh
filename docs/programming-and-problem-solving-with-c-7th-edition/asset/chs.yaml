  \n描述\n\n`array` 模板还记录 `array` 中的元素数量，可以通过 `size` 观察者方法访问。例如，如果我们通过部分初始化创建了 `intArr`：\n\
  \n![一条语句。](img/9781284166033_CH17_p1074-5.jpg)\n\n描述\n\n我们可以使用 `size` 方法来找出有多少个元素被初始化了：\n\
  \n![一条语句。](img/9781284166033_CH17_p1075-1.jpg)\n\n描述\n\n`array` 相当于 `vector` 的 `capacity`\
  \ 运算符的操作是 `max_size`：\n\n![一条语句。](img/9781284166033_CH17_p1075-2.jpg)\n\n描述\n\n\
  传统的 C++ 数组不支持聚合操作。回想一下我们在第 11 章中提到的，我们需要使用 For 循环将一个数组复制到另一个数组，并逐元素地对两个数组进行比较。在某种程度上，这是因为\
  \ C++ 数组不记录它们的大小，因此它们不知道要复制或比较多少。但由于 STL `array` 容器知道它们包含多少个元素，我们可以使用它们重载的赋值运算符和关系运算符来复制和比较数组：\n\
  \n![一段代码。](img/9781284166033_CH17_p1075-3.jpg)\n\n描述\n\n为了与 STL 中的其他容器兼容，`array`\
  \ 还支持迭代器，具有 `begin`、`rbegin` 和 `rend` 构造函数以及用于移动迭代器的常用运算符。这些只是 `array` 模板最常用的功能，你应该咨询\
  \ STL 参考文书以获取完整指南。\n\n### list 模板\n\n现在我们已经看到了 `vector` 和 `array` 是如何工作的，我们可以快速介绍剩余的容器。它们的许多操作具有相似的功能。例如，`list`\
  \ 也定义了 `back`、`begin`、`clear`、`empty`、`end`、`erase`、`front`、`insert`、`push_back`、`rbegin`、`rend`\
  \ 和 `size`，其含义与 `vector` 基本相同。由于它是链实现，`list` 没有定义 `capacity`、`max_size` 或 `reserve`。此外，由于它不支持随机访问，`[]`\
  \ 运算符没有重载，也不支持 `at` 操作。\n\nlist 定义了四种形式的构造函数。我们可以创建一个零元素的 `list`、创建一个具有特定数量并初始化为默认值的\
  \ `list`、从数组或另一个容器初始化的 `list`，或者通过使用拷贝构造函数创建一个 `list`。下表描述了 `list` 支持的一些额外运算符。\n\
  \n![列出 list 支持的额外运算符的表格。](img/9781284166033_CH17_p1075-4.jpg)\n\n描述\n\n![列出 list\
  \ 支持的额外运算符的表格。](img/9781284166033_CH17_p1076-1.jpg)\n\n描述\n\n为了看到 `list` 如何工作，我们展示了以下无意义的示例程序，它从用户输入创建一个\
  \ `list`，以不同的方式显示其内容，应用各种修改器操作，并与另一个 `list` 合并。这里是代码：\n\n![演示各种 list 方法程序。](img/9781284166033_CH17_p1075-5.jpg)\n\
  \n描述\n\n\n\n\n`priority_queue`（优先级队列）是队列的一种变体，它与 `stack`（栈）也有相似之处。主要的区别在于该结构中的元素是按顺序存储的。因此，`push`\
  \ 使用插入排序插入元素，以便它们直接进入排序中的正确位置。在结构的一端，`top` 观察值最大的元素，而 `pop` 操作则将其移除。优先级队列的一个例子是医院急诊室的情况：病例根据紧急程度进行安排，最紧急的排在等待队列的最前面，然后按照顺序接诊。随着后续病例的到达，它们会根据其紧急程度插入到等待队列中。\n\
  \n下表包含了 `priority_queue` 操作的摘要。\n\n![一个总结优先级队列操作的表格。](img/9781284166033_CH17_p1082-1.jpg)\n\
  \n描述\n\nSTL 组织的一个特点是，`priority_queue` 并没有包含在自己的头文件中。相反，它与 `queue` 共享同一个文件；因此我们包含\
  \ `<queue>` 而不是 `<priority_queue>`。这种类型支持空构造函数，并且更像 `list` 等类容器，它提供了第二个构造函数，允许我们从另一个容器初始化值。与\
  \ `stack` 和 `queue` 不同，它没有直接的拷贝构造函数。\n\n这里是我们示例 `stack` 程序的修订版本，已适配为 `priority_queue`，以便我们理解这种结构行为的差异。请注意，队列按字母的反序顺序输出其内容。\n\
  \n![一个演示各种优先级队列方法的程序。](img/9781284166033_CH17_p1082-2.jpg)\n\n描述\n\n![演示各种优先级队列方法的程序延续。](img/9781284166033_CH17_p1083-1.jpg)\n\
  \n描述\n\n这是修订后程序的输出：\n\n![程序的运行示例。](img/9781284166033_CH17_p1083-2.jpg)\n\n描述\n\n\
  ### deque 模板\n\n虽然 `stack` 和 `queue` 努力保持简单，但 `deque` 的设计采取了相反的方法。通过 `deque`，我们从已经见过的容器中获得了一系列功能。\n\
  \n例如，`deque` 复制了 `list` 的大部分操作：`back`、`begin`、`clear`、`empty`、`end`、`erase`、`front`、`insert`、`pop_back`、`pop_front`、`push_back`、`push_front`、`rbegin`、`rend`\
  \ 和 `size`，它们的含义基本相同。像 `vector` 一样，它重载了 `[]` 和 `at` 来提供随机访问。由于是链式结构，它不需要支持 `capacity`\
  \ 或 `reserve` 操作。它也不直接支持 `merge`、`remove`、`reverse`、`sort` 或 `unique`，因为同名的等函数模板在\
  \ STL 的算法部分已有定义，所有这些模板都可以应用于 `deque`。该模板提供了与 `list` 相同的四种形式的构造函数：我们可以创建一个零元素的 `deque`、创建一个具有特定数量元素并初始化为默认值的\
  \ `deque`、创建一个从数组或其他容器初始化的 `deque`，以及通过拷贝构造函数创建的 `deque`。\n\n如果 `deque` 包含了 `list`\
  \ 和 `vector` 的功能，为什么我们不总是使用它呢？和一样，这种能力的增加是以效率为代价的。`vector` 的底层数组实现通常比 `deque` 快得多。我们说“通常”是因为，如果一个大型\
  \ `vector` 必须频繁更改其 `capacity`，`deque` 的链式实现可能会优于它。`deque` 中的随机访问也没有 `vector` 那么高效。`deque`\
  \ 与 `list` 相比如何？由于 `list` 不需要支持随机访问，在端部以外点的删除和插入可以快得多。然而，当你真的需要在一个结构中结合 `vector`\
  \ 和 `list` 的功能时，在库中拥有 `deque` 是非常有用的。\n\nSTL 中 `list` 和 `deque` 的命名实际上确实有些误导性，因为在抽象意义上，两者都可以充当列表或队列。STL\
  \ 的 `list` 是一个通用的双向链表，支持 deque 操作。STL 的 `deque` 也是一个双向链表，支持 deque 操作和随机访问索引。\n\n\
  由于我们已经从其他容器中见过 `deque` 的功能，操作摘要表将是多余的。我们将在章节末尾的问题解决案例研究中演示 `deque` 的用法。\n\n## 17.5\
  \ 非线性结构\n\n在章节早期，我们注意到所见的所有结构化类型本质上都是线性的。事实依然如此：Vectors、lists、stacks、que、deques\
  \ 和优先级队列都以线性方式排列它们的元素。在本节中，我们开启了其他排列方式的大门。我们只关注少数，这赋予了该结构名称。\n\n### 二叉树\n\n我们可以将链表的概念扩展到包含多个前向链接的结构。这种树被称为二叉树。根节点有两个指针：指向左子节点和一个指向右子节点。每个孩子也有两个指针：指向其左子节点和一个指向其右子节点。（[](9781284166033_CH17_05.xhtml_c17-fig11))\n\
  \n对于树中的任何节点，其左孩子是左子树的根。同样，右孩子是右子树的根。左右孩子均为 `NULL` 的节点被称为*叶节点*。\n\n虽然图 17.11 显示了一个只有七节点的二叉树，但树的节点数量理论上没有限制。如果你把图片倒过来，就能看到为什么它被称为树。\n\
  \n![具有 7 个节点的二叉树。](img/9781284166033_CH17_p1098-1.jpg)\n\n描述\n\n二叉搜索树非常有用，因为如果我们正在寻找某个特定项目，只需一次比较就能判断它在树的哪一部分。然后我们可以再通过一次比较判断它在该部分的哪一部分。这个过程一直持续，直到找到该项目（在本例中是数字）或确定该项目不存在。该过程类似于对排序数组进行二分查找。\n\
  \n让我们在二叉搜索树中搜索数字 50。\n\n\n\n\n\n![在一个包含 12 个节点的二叉搜索树中查找数字 50。](img/9781284166033_CH17_p1098-2.jpg)\n\
  描述\n\n现在我们来查找 18，这是一个不在树中的数字。\n\n![在一个包含 12 个节点的二叉搜索树中查找数字 18。](img/9781284166033_CH17_p1098-3.jpg)\n\
  描述\n\n19 的左孩子是 `NULL`，所以我们知道 18 不在树中。我们不仅知道 18 不，而且如果我们想插入 18，我们也处于正确的插入位置。\n\n\
  总结一下，我们将要查找的值与树中的项进行比较，如果该值与项不相同，就选择相应的分支。当我们开始走向一个 `NULL` 分支时，我们就知道该值不在树中。正如二叉搜索的算法复杂度为\
  \ `O(log[2]*N*)`，在二叉搜索树中的查找也是如此。\n\n如果我们想顺序输出二叉搜索树中的所有值，我们可以按照以下方式进行遍历：\n\n### 树的遍历\n\
  \n- 如果左孩子不为空，遍历左子树。\n- 输出当前项。\n- 如果右孩子不为空，遍历右子树。\n\n我们从树的`root`节点开始。如果它有左孩子，我们就移动到该节点并重复该过程。我们以同样的方式沿着树的左侧向下移动，直到到达叶子节点并对其进行输出。然后我们回到该叶子节点的父节点，并在遍历其右侧子树之前对其输出。例如，假设我们给定了以下二叉搜索树：\n\
  \n![一个包含 7 个节点的二叉搜索树。](img/9781284166033_CH17_p1099-1.jpg)\n描述\n\n遍历从`root`(36)开始，进入它的左孩子\
  \ (24)，然后进入 24 的左孩子 12。因为 12 是叶子节点，所以它被输出，我们回到 24 并对其进行输出。然后我们遍历它的右子树，即叶子节点 30。在输出\
  \ 30 后，我们回到 24。由于我们已经完成了这个子树，我们回溯到 36 并将其输出。然后对右子树重复该过程，输出 42、48 和 60。\n\n正如我们在第\
  \ 18 章中所示，这种通过调用自己来处理问题较小部分的算法被称为*递归*的。在这一章中，我们还将看到栈（stack）是跟踪我们在树中所位置的自然结构选择。\n\
  \n这种特定形式的遍历（访问左子树，然后根节点，最后右子树）被称为**中序遍历**。树还有另外两种常用的遍历模式。\n\n#### 前序遍历\n1. 访问根节点。\n\
  2. 访问左子树。\n3. 访问右子树。\n\n#### 后序遍历\n1. 访问左子树。\n2. 访问右子树。\n3. 访问根节点。\n\n这些名称源于我们在遍历顺序中访问根节点的位置。如果我们在访问子树之前访问根节点，它就是`前序遍历`。如果我们在访问子树之后访问根节点，它就是`后序遍历`。根据二叉树中存储的数据，每种遍历顺序可能有特定的用途。\n\
  \n树并不局限于二叉分支因子。如果我们定义一个节点有三个链接字段，我们得到一个每个节点有三个分支的树。树也不限于每个节点具有相同数量的分支。例如，我们可以构建一棵表示家族族谱的树，其中一个节点的链接数量取决于给定一组父母所生的孩子数量。为了存储数量数量的孩子链接，我们可能会在树节点内部使用一个`list`作为字段。\n\
  \n列表、栈、队列和树都具有一个特性，即链接向一个方向流向（从头到尾、从根到叶子等）。我们可以形成更复杂的结构，称为**图**（graphs），其中链接可以向任何方向流向。我们可能会使用图来表示连接一组城市的道路，或连接一组计算机的网络。正如你所见的，链接结构可以变得非常复杂。\n\
  \n正如我们能够用数组或动态结构实现`list`一样，也可以用动态结构或数组来实现栈、队列、树和图。重要的是，数据结构既有逻辑组织，又有实现结构。两者是不同的，且每种选择取决于任何给定问题的需求。\n\
  \nSTL 并没有真正提供一个在抽象意义上实现树的容器。然而，我们在 17.6 节“关联容器”中检查的`set` 容器通常是用二叉树实现的。\n\n### 哈希表\n\
  \n接下来我们看另一种在特定条件下提供快速搜索的逻辑结构。我们再次会看到它有多种实现方式。由于你是在已知范围内进行搜索，你只需要根据这些值对数组进行索引。通常情况下，如果你要查找的项具有这种属性，你可以直接定位。对于一组\
  \ *N* 值，我们目前为止看到的搜索算法最多需要 *N* 步（线性搜索）或 `log[2]*N* 步（二分搜索）。这种新技术通常只需要几步。我们将这种方法称为**哈希**（hashing）。\n\
  \n我们的字母查找示例是使用哈希的完美场景，因为可能的值较少，我们可以将它们作为索引。遗憾的是，大多数数据并不同样良好。例如，如果我们的数据值是表示温度的实数，那么潜在值的数量是。C++\
  \ 不允许我们创建一个足够大的数组来使用`float` 值作为索引。\n\n尽管如此，温度可能有一个非常有限的范围，例如 90.0 到 110.0 华氏度。如果我们对精度的要求只需要十分之一，那么实际上只有\
  \ 201 个不同的值。我们可以开发一种方法，接收温度并返回 0 到 200 范围内的索引；然后我们可以使用哈希来存储温度。这种方法被称为**哈希函数**（hash\
  \ function）。假设哈希函数的计算需要很短的时间，使用哈希进行搜索仍然是非常快的操作。\n\n之前的示例忽略了数据集中存在重复项的问题。此外，某些数据集的值分布可能是不规则的。例如，如果你对一组名字进行排序，你会发现以“A”、“M”或“S”开头的名字比“Q”、“X”或“Z”多得多（尽管这些频率会随你所在的位置而变化）。因此，我们可能会尝试将多个值存储到数组的同一位置，这种情况被称为**冲突**（collision）。\n\
  \n\n\n\n可以通过多种方法来处理冲突。例如，当我们尝试将一个值存储到一个已经满员的位置时，我们可以简单地增加索引，直到找到一个空位置。遗憾的是，这种策略往往会产生填充位置的聚集。在最坏的情况下，找到一个空槽所需的访问次数可能与数组中的元素数量一样多。另一种方法被称为“重哈希”（rehashing），我们将哈希函数的输出重新输入函数（或另一个函数）中以选择一个新的索引。\n\
  \n到目前为止，我们一直假设使用简单的线性数组实现，但哈希并不局限于这种结构。例如，我们可以使用链表数组。此时，哈希函数可以索引到该数组，并将项添加到该位置的链表中。当给定的数组槽发生每次冲突时，相关的列表就会简单地增长一个节点。如果哈希函数设计得当，列表将保持较短的长度（冲突很少），因此搜索仍然只需要几次操作。图\
  \ 17.12 展示了这种结构，被称为“链地址哈希表”。\n\n![链式哈希表。](img/9781284166033_CH17_FIGF17-12.jpg)\n\
  \n**图 17.12 链地址哈希表**\n\n描述\n\n哈希的效率取决于数组或表是否足够大以容纳数据集，并有足够的额外空间将冲突降至最低。有时这是一个难以满足的实际条件；但对于许多其他问题，哈希是组织数据的一种非常有效的方法。例如，我们可以使用哈希表来实现一个具有快速插入、删除和访问能力的列表，类似于\
  \ STL 中的 `deque`。哈希表也是我们在下一节中查看的另一种容器——`map` 的候选实现结构。\n\n开发一个良好的哈希函数可能需要大量的的数据分析。我们在这里的目标不是向你展示如何开发此类函数，而仅仅是让你了解哈希的优点及其局限性。\n\
  \n## 17.6 关联容器\n\nSTL 将其容器分为三组。`vector`、`list` 和 `deque` 被称为`序列容器`。较简单的 `stack`、`queue`\
  \ 和 `priority queue` 类型被称为`容器适配器`，因为它们实际上构建在序列容器之上，以提供更简单、更方便的接口。第三组包含了所谓的`关联容器`。\n\
  \n我们在关联容器中定位值不是通过它们的位置，而是通过它们的值。例如，假设你有一个结构体数组，每个结构体包含一个名称和一个电话号码。你可以通过对数组进行搜索并将给定的名称与每个位置存储的名称进行比较，通过名称访问号码；通过这种方法你最终可能会找到匹配项。现在，假设你只需要写：\n\
  \n```\ncout phoneArray[\"Sylva Jones\"];\n```\n![images/9781284166033_CH17_p1102-1.jpg)来查找该号码；也就是说，假设你只需引用其关联值就能找到电话号码。计算机科学家将这种查找称为关联访问、**关联查找**或**内容可寻址访问**。用于搜索的值称为\
  \ `key`（键），这些值整体必须以某种方式进行排序，以便两个键可以进行比较。在许多情况下，键也是唯一的。关联查找是许多类型数据库处理的基础，并具有广泛的其他用途。STL\
  \ 提供了五种不同的关联容器。这里我们检查其中两个：`set` 和 `map`。### set 模板 STL `set` 模板的名称源于它像数学中的集合一样，只存储唯一的值。如果你尝试插入一个已经存在于\
  \ `set` 中的值，则 `set` 将保持不变。不意外，STL 对 `set` 的实现远超数学概念。在内部，`set` 中的值是从小到大排序的，因此 STL\
  \ 提供了使用带有 `begin` 和 `end` 的 `iterator`（迭代器），或带有 `rbegin` 和 `rend` 的 `reverse_iterator`（反向迭代器）来遍历\
  \ `set` 的能力，就像列表列表。（大多数实现使用二叉搜索树，如图 17.13**图 17.13 使用二叉搜索树实现的 set**描述`set` 擅长的是通过值查找元素。因此，`find`\
  \ 操作被构建在 `set` 接口中，而不是被视为一个独立的算法。在 `find` 提供一个指向 `set` 中值的 `iterator` 后，你可以使用它来\
  \ `erase`（删除）元素或检索相邻元素。这里是一些常用 `set` 操作的表格。![某些常用 set 操作表格。](img/9781284166033_CH17_p1103-1.jpg)\n\
  \n描述\n\n![常用 set 操作表格的延续。](img/9781284166033_CH17_p1104-1.jpg)\n\n描述\n\n`set` 类型提供了一个默认构造函数，创建一个空的\
  \ `set`。第二种形式的构造函数遵循序列容器的模式，可以使用另一个容器来初始化 `set`。提供了接受另一个 `set` 作为参数的拷贝构造函数，用于创建重复的\
  \ `set`。\n\n除了前表中的类方法外，17.4 中描述的算法中有三个也适用于 `set`：`set_difference`（差集）、`set_intersection`（交集）和\
  \ `set_union`（并集）。请记住，使用这些算法必须包含 `<algorithm>`，并且像传统函数一样调用它们，而不是对象方法。本节后面的示例程序演示了\
  \ `set_difference` 的用法。所有的 `set` 算法都使用相同的参数排列，所有都是迭代器：\n\n![一个语句。](img/9781284166033_CH17_p1104-2.jpg)\n\
