  \n描述\n\n当用户点击 OK 按钮时，他们输入的值将被返回并存储在字符串 `output` 中。输出文件名以字符串形式输入，因为它还不存在（程序将创建它）。但为了获取已存在的文件名，我们可以使用另一种类型的对话框，称为\
