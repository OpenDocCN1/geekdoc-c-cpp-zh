  \ `main` 开始。\n\n## 8.3 void 函数的语法和语义\n\n### 函数调用（触发）\n\n正如我们看到的，要调用（或触发）一个 void\
  \ 函数，我们使用它的名称作为语句，并在括号中带有它的参数。以下是 void 函数调用的语法模板：\n\n![函数调用（针对 void 函数）](img/9781284166033_CH08_428.jpg)\n\
  \n注意，参数列表是可选的，但即使列表为空，也需要括号。\n\n如果列表包含两个或更多参数，你必须用逗号将它们分隔。以下是 `ArgumentList` 的语法模板：\n\
  \n![ArgumentList 表达式，表达式 ...](img/9781284166033_CH08_428a.jpg)\n\n当执行函数调用时，参数被传递给匹配位置的形式参数，然后控制权转移到函数体中的第一条可执行语句。当函数的最后一条语句执行完毕后，控制返回到函数调用之后的位置。\n\
  \n### 函数声明和定义\n\n在 C++ 中，函数的声明物理上必须先于任何调用。声明为编译器提供了函数的名称、函数返回值的形式（`void` 或类似 `int`、`float`）以及参数的数据类型。`NewWelcome`\
  \ 程序包含了三个函数声明。第一个没有包含函数体。其余两个 `main` 和 `PrintLines` 包含了体。\n\n正如我们已经提到的，非正式地说，在 C++\
  \ 术语中，省略实体的函数声明被称为**函数原型 (function prototype)**，而包含体的声明被称为**定义 (definition)**。我们可以使用维恩图来说明所有定义都是声明，但并非所有声明都是定义：\n\
  \n![函数声明 定义（带有体的声明）](img/9781284166033_CH08_429.jpg)\n\n通常，C++ 通过是否分配内存空间来区分声明和定义。例如，函数原型是一个声明——它只是告诉编译器函数的属性。函数定义更进一步：它导致编译器分配空间。\n\
  \n整个 C++ 的规则是，你可以随意地多次声明一个项，但只能定义它一次。在 `NewWelcome` 程序中，我们可以包含 `PrintLines` 的多个函数原型（尽管没有理由这样做），但只允许一个函数定义。\n\
  \n#### 函数原型\n\n函数原型允许我们在定义之前声明函数，因此我们可以任何顺序安排它们的定义。正如我们所提到的，C++ 程序员通常先定义 `main`，然后是所有其他函数。\n\
  \n除了风格之外，C++ 中还有一种情况形式原型是至关重要的。假设有两个函数 A 和 B 互相调用。如果我们先写 A 的定义，后写 B 的定义，那么在 A 内部调用\
  \ B 就会产生 B 未声明的消息。当然，反转定义的顺序并不能解决问题。解决方案是在 A 的定义之前编写 B 的原型，以便 B 在被 A 使用之前已经声明。由于\
  \ B 的原型省略了函数体，因此它不包含对 A 的调用。结果，它避免了在声明 A 之前引用 A。注意，当我们采用在 `main` 之前编写所有函数原型的风格时，这种特殊情况会被自动涵盖。\n\
  \n\n\n\n\n![参数列表（函数原型中的）](img/9781284166033_CH08_429b.jpg)\n\n附加在数据类型名称后的符号 `&`\
  \ 是可选的，将在本书稍后部分解释。\n\n在函数原型中，参数列表必须指定参数的数据类型，但它们的名称是可选的。你可以写成以下形式：\n\n![一个函数原型。void\
  \ Do Something，左括号，int, 逗号，float，右括号，分号。](img/9781284166033_CH08_430.jpg)\n\n或者\n\
  \n![一个函数原型。void Do Something，左括号，int velocity, 逗号，float angle，右括号，分号。](img/9781284166033_CH08_430a.jpg)\n\
  \n为参数提供名称对阅读代码很有帮助，但请注意编译器会忽略它们。\n\n### 函数定义\n\n正如你已经意识到的，通过编写 `main` 函数可以知道，一个函数定义由两部分组成：函数头和函数体，在语法上函数体是一个块（复合语句）。以下是\
  \ `void` 函数定义的语法模板：\n\n![参数列表（函数定义中的）](img/9781284166033_CH08_430b.jpg)\n\n注意，函数头并*没有*像函数原型那样以分号结尾。包含分号将产生语法错误。\n\
  \n参数列表的语法与函数原型的不同之处在于，你必须指定参数的名称。此外，我们的风格习惯（但不是 C++ 语言的要求）是将每个参数声明单独占一行：\n\n![参数列表（函数定义中的）](img/9781284166033_CH08_430c.jpg)\n\
  \n### 局部变量\n\n由于函数体是一个块，因此任何函数（而不只是 `main`）都可以包含变量声明。这些变量被称为`局部变量`，因为它们仅在声明它们的块内是可见的。对于调用代码来说，它们是不存在的。如果你尝试从另一个函数输出局部变量的内容，将会发生类似\
  \ `UNDECLARED IDENTIFIER` 的编译时错误。你在 `NewWelcome` 程序中看到了局部变量的示例——在 `PrintLines` 函数内部声明的\
  \ `count` 变量。\n\n与局部变量相反，在程序所有函数之外定义的变量被称为全局变量。我们将在第 9 章中回到全局变量话题。\n\n局部变量仅在函数执行时占用内存。当函数被调用时，会为其局部变量分配内存空间。当函数返回时，局部变量的内存空间会被回收供以后使用。因此，每次调用函数时，其局部变量从未定义值开始。这意味着你必须在函数内部初始化局部变量。此外，由于内内会在函数返回时被回收，你无法使用局部变量在多次函数调用之间存储值。\n\
