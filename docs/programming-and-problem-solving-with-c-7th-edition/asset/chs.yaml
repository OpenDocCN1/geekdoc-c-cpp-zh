  \n描述\n\n![一个矩形框内包含 6 个矩形。](img/9781284166033_CH14_P858-1.jpg)\n\n描述\n\n### 从链表中删除元素\n\
  \n要从链表中删除现有的节点，我们需要遍历链表，直到找到要删除的节点。事实上，为无序列表编写的函数在这里也可以正常工作。然而，当我们传递的某个比要删除的值大的值时，就可以判断该元素不存在。因此，`While`\
