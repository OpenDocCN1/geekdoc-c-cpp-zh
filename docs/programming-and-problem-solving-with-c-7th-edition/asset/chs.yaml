  \ `TimeOfDay` 和 `Name` 包含了。结果是预处理器认为 `RelationType` 被定义了多次。这种情况经常发生，所以我们必须告诉预处理器只有在之前没有包含过该文件的情况下，才包含\
  \ `RelationType.h` 文件。解决这个问题的广泛使用的方案是这样编写 `RelationType.h`：\n\n![四条语句。](img/9781284166033_CH12_P727-4.jpg)\n\
  \n描述\n\n以 `#` 开头的行是预处理器的指令。`RELATION`（或任何你想使用的标识符）是一个预处理器标识符，而不是 C++ 程序标识符。实际上，这些指令的作用是：\n\
  \n如果预处理器标识符 `RELATION` 尚未被定义，那么：\n\n1. 将 `RELATION` 定义为预处理器已知的标识符，并且\n2. 让 `enum\
  \ RelationType` 的声明传递给编译器。\n\n如果后续遇到 `#include \"RelationType.h\"`，测试 `#ifndef RELATION`\
  \ 将失败。该声明将不会再次传递给编译器。\n\n重复定义错误现在已经解决了，但还有另一个错误：\n\n![错误语句。](img/9781284166033_CH12_P728-1.jpg)\n\
  \n描述\n\n这条语句可能出了什么问题？我们只是用字符串、一个整数值、一个冒号和另一个整数值创建了一个字符串。自从第 2 章以来，我们一直使用拼接来构建字符串。数字会被转换为字符串以便输出。这条语句有什么不同？C++\
  \ 会自动将整数转换为字符串输出，但在输出之外，没有任何地方存在整数到字符串的类型转换。\n\n要创建一个包含整数的字符串，我们可以将其写入文件，然后作为字符串读回来。这种方法虽然可行，但速度会非常慢。（文件访问的时间可能比内存访问长一百万倍以上。）幸运的是，有一个名为\
  \ `ostringstream` 的类，它允许我们像写入文件一样将值写入字符串中。由于数据保留在内存中，因此转换速度很快。\n\n我们声明一个 `ostringstream`\
  \ 类的对象，并使用插入运算符 `<<` 将整数发送到该对象。为了将它们作为字符串获取，我们使用 `ostringstream` 类的成员函数 `str`。以下是\
  \ `GetTimeStr` 的修正版本，它使用了 `ostringstream` 类对象，随后驱动程序的输出：\n\n![程序段。](img/9781284166033_CH12_P728-2.jpg)\n\
