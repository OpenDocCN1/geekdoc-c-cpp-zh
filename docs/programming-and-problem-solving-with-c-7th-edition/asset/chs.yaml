  \n注意我们的大写风格。因为枚举符类似于命名常量，我们将整个标识符大写。这纯粹是一种风格选择。许多程序员在枚举符中同时使用大写和小写字母。\n\n这里是枚举类型声明的语法模板。这是一个简化版本；在章节稍后部分我们会对其进行扩展。\n\
