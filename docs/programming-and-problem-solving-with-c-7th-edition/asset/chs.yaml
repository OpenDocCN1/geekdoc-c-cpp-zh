  \n## 11.3 特殊类型的数组处理\n\n有两种数组处理发生得特别频繁：仅使用声明数组的一部分（子数组）以及使用在问题中具有意义的索引值（具有语义内容的索引）。我们在这里简要描述这两种方法，并在稍后给出更多示例。\n\
  \n### 子数组处理\n\n数组的*大小*——即声明的数组组件数量——是在编译时确定的。我们声明一个数组的大小为未来可能需要的最大。然而，由于存入数组的值数量通常取决于数据本身，我们可能不会填充所有的组件。为了避免处理数组中的空位置，我们必须跟踪实际填充了多少个组件。\n\
  \n当值被放入数组时，我们对它们进行计数。然后我们使用该计数仅处理那些包含值的组件；任何剩余的位置均不被处理。例如，如果一个级有 250 名学生，分析测试成绩的程序将为成绩留出\
  \ 250 个位置。但是，某些学生可能缺席考试。因此，必须统计成绩的数量，并用该数字（而不是 250）来控制数组的处理。\n\n当数组中存储的值少于其声明的大小时，我们传递给数组的函数也必须接收值的数量作为参数。例如，在\
  \ `ZeroOut` 函数中，我们把数组和值的数量作为参数传递。然而，有一种更好的方法：可以将数组和它的值计数绑定在一个记录中。\n\n例如，考虑学生记录的集合。我们可以稍微修改问题，说实际学生记录的数量是未知的。读取循环将是一个\
  \ eof 循环而不是 For 循环。让我们扩展 `ReadValues` 和 `PrintValues`，使其接收包含数组和项目数量的记录。循环将位于函数内部，而不是\
  \ `main` 中。\n\n这里是带有这些更改的完整程序。数据结构的定义和函数原型已高亮。\n\n![程序段。](img/9781284166033_CH11_P622-1.jpg)![程序段的延续。](img/9781284166033_CH11_P623-1.jpg)\n\
  \n描述\n\n![程序段。](img/9781284166033_CH11_P624-1.jpg)\n\n描述\n\n### 具有语义内容的索引\n\n在某些问题中，索引具有位置之外的意义；即索引具有*语义内容*。例如我们之前展示的\
  \ `salesAmt`。\n\n## 11.4 二维数组\n\n一维数组可以用于表示列表。但在许多问题中，项目之间的关系更为复杂。二维数组可以用于表示表格。\n\
