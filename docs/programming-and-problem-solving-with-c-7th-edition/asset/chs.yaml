  ### 编译和链接多文件程序\n\n现在我们已经为 `TimeOfDay` 类创建了规范文件实现文件，我们（或任何其他程序员）如何使用这些文件呢？让我们通过查看源代码的*单独编译*概念开始探索这一问题。\n\
  \n在早前的章节中，我们提到了多文件程序的概念——即分成几个包含源代码文件的程序。在 C++ 中，这些文件的每一个一个都可以单独编译并在不同时间编译。在此过程中，编译器将每个源代码文件转换为目标代码文件。图\
  \ 12.7 显示了一个多文件程序，由 `myprog.cpp`、`file2.cpp` 和 `file3.cpp` 源文件组成。我们可以独立地编译每个文件，产生目标代码文件\
  \ `myprog.obj`、`file2.obj` 和 `file3.obj`。虽然每个 `.obj` 文件包含机器语言，但它们还没有可执行形式。系统的链接器将目标代码汇在一起形成可执行程序文件。\n\
  \n像 `file2.cpp` 和 `file3.cpp` 等文件通常包含 `myprog.cpp` 代码中调用的函数定义。通过单独编译，修改一个文件的代码只需要重新编译该文件。新的\
  \ `.obj` 文件随后将与现有的其他 `.obj` 文件重新链接。当然，如果修改更改了函数的公共接口，那么客户端文件也必须进行修改和重新编译。\n\n\n\n\
  \n回到我们的 `TimeOfDay` 类，假设我们已经创建了 `TimeOfDay.h` 和 `TimeOfDay.cpp` 文件。现在我们可以将 `TimeOfDay.cpp`\
  \ 编译成目标代码。你可能正在使用一个提供集成环境的 C++ 系统——这种程序将编辑器、编译器和链接器打包成一个整体。当发生编译时错误或链接时错误时，集成环境会将你带回编辑器，并精确指出错误的位置。某些集成环境还管理项目文件。项目文件包含了关于多文件程序中所有组成文件的信息。通过项目文件，系统会自动重新编译或链接任何因程序其他文件的更改而过期的文件。\n\
  \n如果你使用的是命令行系统，你将向操作系统编写单行命令，告诉它编译或链接某些文件。无论你使用哪种环境——集成环境还是命令行——其整体效果都是相同的：源代码文件被编译成目标代码文件，然后被链接成一个可执行程序，最后执行该程序。\n\
  \n![一张流程图解释了编译和链接。](img/9781284166033_CH12_FIGF12_7.jpg)\n\n描述\n\n图 12.7 独立编译与链接\n\
  \n在离开多文件程序主题之前，我们必须强调一个重要点。在图 12.6 的示例中，`TimeOfDay.h` 和 `TimeOfDay.obj` 文件对 `TimeOfDay`\
  \ 类的用户可用。用户需要检查 `TimeOfDay.h` 以查看 `TimeOfDay` 对象的功能以及如何使用它们。用户还必须能够将他们的程序与 `TimeOfDay.obj`\
  \ 链接以生成可执行程序。然而，用户不需要看到 `TimeOfDay.cpp`。用之前引入的术语来说，`TimeOfDay` 的实现应该被视为一个黑盒。\n\n\
  抽象的主要目的是通过隐藏复杂性来简化程序员的工作。抽象的用户不应该通过查看其实现来学习如何使用它，也不应该需要编写依赖于实现细节的程序。在后一种情况下，实现的任何更改都可能“破坏”用户的程序。在第\
  \ 8 章中，标题为“函数实现的概念与物理隐藏”的软件工程技巧框讨论了编写依赖实现细节代码的风险。\n\n## 12.4 什么是对象？\n\n我们本章从讨论抽象和抽象数据类型开始。然后我们检查了类（class）结构，这是\
  \ C++ 实现 ADT 的机制。我们已经讨论了如何通过公共接口的设计以及通过规范文件和实现文件来实现信息隐藏。现在让我们退后一步，从更广阔的视角来看对象及其用途。\n\
  \n在面向对象编程（OOP）中，“对象”一词有特定的含义：它是一个封装了数据和对数据操作的自包含实体。换句话说，对象代表一个 ADT 的实例。对象有一个内部状态（其数据的当前值，称为\
  \ `attributes`），并且它拥有一组方法（操作，在 C++ 中通过函数实现）。如果一个类设计得当，方法是另一个对象修改对象状态的唯一手段。为了检查对象的状态，也使用了方法；此外，某些对象提供了可以被检查的公共常量。例如，`string`\
  \ 类将 `npos` 常量设为公共，因此我们可以确定字符串的最大长度。\n\n一个面向对象的程序由一组对象组成，它们通过消息传递进行相互通信。如果对象 A 想让对象\
  \ B 执行某些任务，对象 A 会发送一个包含对象名称（在此例中为 B）和要执行的方法名称的消息。对象 B 通过以自己的方式执行该方法来响应，可能会改变自己的状态并向其他对象发送消息。\n\
  \n正如你所看到的，对象在概念上与传统的数据结构大不同。C 结构体（C-struct）是一种被动的数据结构，只包含数据，并由程序操作。相比之下，对象是一个活跃的数据结构；数据和操作数据的代码绑定在对象内部。在\
  \ OOP 术语中，对象知道如何操作它自己的状态。\n\nSmalltalk 编程语言的词汇开创了许多与面向对象编程相关的思想，它影响了 OOP 的词汇。OOP\
  \ 的文献充满了“方法（methods）”、“属性（attributes）”和“发送消息给”等短语。以下是一些 OOP 术语及其对应的 C++ 术语：\n\n\
  | OOP | C++ |\n| --- | --- |\n| 对象 (Object) | 对象或类实例 |\n| 属性 (Attribute) | 数据成员变量\
  \ (Data member) |\n| 方法 (Method) | 成员函数 (Member function) |\n| 消息传递 (Message passing)\
  \ | 函数调用（针对公共成员函数） |\n\n让我们复习 `TimeOfDay` 类，尽管它经过微调以反映面向对象的术语和原则。它有六个公共方法（在面向对象的术语中称为“职责”）：`Increment`、`Write`、`Equal`、`LessThan`\
  \ 以及两个构造函数。一个构造函数接受小时、分钟和秒作为参数，另一个将 `TimeOfDay` 设置为零。\n\n在面向对象的术语中，存在两种类型的职责（操作）：动作职责（action\
  \ responsibilities）和知识职责（knowledge responsibilities）。`TimeOfDay` 的所有公共方法要么是构造函数，要么是知识职责。它们没有采取动作（改变对象的状态）。正如你所看到的，对象能够报告自己的状态是非常重要的。\n\
  \n\n\n\n\n如果一个对象的状态只能通过设计良好的接口来更改，那么应用程序其他部分的错误就无法以意料之外的方式影响它。只要我们设计类时，使其对象能够处理任何与接口一致的数据，我们就知道它是一个可靠的软件单元。\n\
  \n这里有一个类比，说明了经过封装的类与未封装的类之间的区别。假设你是一个建筑师，在一个新的开发区内建造一栋房子。其他建筑师也在同一个开发区内工作。如果每个建筑师都将自己的设备和材料保留在他们所建造房屋的边界线内，并且仅通过自家的车道进出工地，那么施工过程就能顺利进行。边界线封装了各个独立的施工工地，而车道是人员、设备和材料进出工地的唯一接口。现在想象一下，如果建筑师们在不告知对方的情况下开始将材料和设备放在其他工地上，会发生怎样的混乱。如果他们开始开着重型设备穿过其他工地回到自己的工地又会发生什么？材料会被用在错误的房子，工具会丢失或被离的车辆压坏，整个过程将会崩溃。**图\
  \ 12.8** 展示了这种情况。\n\n![一个实时示例解释了封装的概念。](img/9781284166033_CH12_FIGF12_8.jpg)\n\n\
  描述\n\n图 12.8 封装为类划定了清晰的边界；未封装类可能导致混乱\n\n让我们在 C++ 中将这个类比具体化，观察同一个 `Date` 类的两种接口设计——一个是封装的，另一个未封装的。\n\
  \n![一个包含 2 列代码的表格。](img/9781284166033_CH12_P709-1.jpg)\n\n描述\n\n右侧的接口允许客户端代码直接更改\
  \ `Date` 对象的字段。因此，如果客户端代码给这些字段赋值为 14、206 和 83629，你最终得到一个无意义的日期：83629 年 14 月第 206\
  \ 天。左侧的封装实现将这些字段设为 `private`。它随后提供了一个 `public` 方法，接受日期值作为参数，并在更改对象内部字段之前检查日期是否有效。\n\
  \n这个示例说明，封装并没有特殊的 C++ 语法。相反，我们通过仔细设计接口来实现封装，以确保对象对进入和离开其内部信息具有完全的控制权。\n\n封装极大地简化了编程团队的工作，因为每个类可以由不同的团队成员开发，而无必担心其他类是如何实现的。在一个大型项目中，封装允许程序员独立地处理不同的部分。只要每个类都符合其设计规范，这些独立的类就可以安全地相互交互。\n\
  \n我们所说的“设计规范”是指什么？给定一个类的正式接口，设计规范是额外的书面文档，描述了类在通过接口进行每种可能的交互时的行为。我们在这里必须非常明确，我们指的是解决问题的阶段。设计规范是陈述问题的一部分。它区别于实现阶段的规范文件，后者定义了类的接口。根据上下文，我们可能将设计规范简称为规范。\n\
  \n正式接口是我们定义如何调用方法的地方，而设计规范是我们描述该方法将做什么的地方。你可以将正式接口类为类的语法，将规范类为它的语义。根据定义，规范包含了正式接口。我们已经看到这些信息如何被写为前置条件和后置条件。\n\
  \n### 抽象\n\n封装是编程抽象的基础。我们看到抽象有两种类型：数据抽象和控制抽象。作为数据抽象的例子，考虑对 `Date` 类的封装，我们可能使用月、日、年来表示日期，但我们也可以使用儒历日和字符串来表示日期。\n\
  \n使用儒历日的好处是它可以简化对日期的操作，例如计算日期之间的天数。由于封装，这种内部表示是自公元 1 月 1 日以来的儒历日。**图 12.9** 显示了它们具有相同的外部抽象。\n\
  \n在许多情况下，外部表示是相同的。但是，我们可能在以后更改实现，例如，我们可能最初使用儒历日来开发 类。控制抽象允许我们对用户隐藏这些细节。\n\n![一张插图描述了两种实现具有相同的外部抽象。](img/9781284166033_CH12_FIGF12_9.jpg)\n\
  \n描述\n\n图 12.9 数据抽象允许相同的抽象具有不同的内部表示\n\n### 为可修改性和重用性设计\n\n应用抽象原则允许我们在初始开发后修改类的实现。也许我们为了赶上截止日期，创建了一个简单但低效的实现。在维护阶段，我们随后将其替换为更高效的版本。这种修改是不可检测的，除了应用程序运行得更快，所需的内存更少。\n\
  \n封装的类是自包含的，这意味着我们可以将其导入并用于其他应用程序。重用还意味着一个类可以扩展为新的相关类。例如，一家公用公司有一套软件来管理其车队。如图 12.10\
  \ 所示，描述 `Vehicle` 的类可以在多个应用程序中使用。每个都可以对 `Vehicle` 类进行扩展以满足其特定需求。重用是一种节省编程努力的方法。它还确保对象在任何使用处都具有一致的行为，这有助于避免错误。\n\
  \n\n\n\n\n并不是所有的类都需要为了通用的复用而设计。在某些情况下，我们只需要一个对当前问题具有特定属性且不会在其他地方使用的类就了。然而，如果你正在设计一个可能在其他情况下用到的类，那么让它更具通用性是一个好主意。\n\
  \n请记住，尽管 C++ 的类结构提供了一种 `support` 封装的机制，但如何使用这种能力以实现真正的封装，取决于程序员。没有哪种关键字或结构可以将一个类明确标记为已封装的。相反，程序员必须以某种方式在类周围划定边界，将其他代码排除在之外。\n\
  \n![名为 Vehicle 的类例中的复用概念。](img/9781284166033_CH12_FIGF12_10.jpg)\n\n描述\n\n图 12.10\
  \ 复用\n\n我们可以划出两种类型的边界：物理边界和视觉边界。我们可以通过将成员声明为 `private` 来在物理上阻止用户访问类中的成员，也可以通过适当使用头文件和实现文件，使类的实现对用户不可见。\n\
  \n### 可变性\n\n`immutable`（不可变）对象在实例化后无法被更改；`mutable`（可变）对象至少有一个函数（方法）允许客户端更改对象中数据成员的值。`Mutability`（可变性）对象接口的一个关键区别特征。尽管不可变对象天然是封装的（因为它们对更改免疫），但我们必须特别注意确保可变对象保持封装。\n\
  \n我们的 `TimeOfDay` 类是不可变的，因为它的没有任何一个方法允许客户端更改它的任何值。如果 `Increment` 函数实际上更改了它所作用的实例，那么该类就会变成可变的了。\n\
  \n让我们来看一个可变对象的示例。假设我们正在为一家医院创建一个出生记录数据库。出生记录是一个包含以下信息的对象：\n\n**出生记录**\n\n- 出生日期\n\
  - 出生时间\n- 母亲姓名\n- 父亲姓名\n- 婴儿姓名\n- 婴儿体重\n- 婴儿长度\n- 婴儿性别\n\n护士在婴儿出生后不久会将这些信息输入数据库。在某些情况下，父母可能还没有为婴儿选择名字。为了不让护士等待，数据库允许输入所有其他信息，并创建一个姓名为空字符串的\
  \ `Birth Record` 对象。稍后当选择了名字后，护士会更改数据库中的姓名。\n\n更改此数据库记录有两种方法。一种是调用一个直接更改婴儿姓名字段值的方法。例如，我们可以这样写该函数：\n\
  \n![一个函数。](img/9781284166033_CH12_P712-1.jpg)\n\n给定一个名为 `newBaby` 的 `BirthRecord`\
  \ 类实例，我们可以通过以下语句调用此方法：\n\n![一条语句。new Baby，点，Set Baby Name，左括号，Some Name，右括号，分号。两个正斜杠。更改婴儿姓名字段。](img/9781284166033_CH12_P712-2.jpg)\n\
  \n描述\n\n这种方法被称为转换器（transformer）或变异器（mutator）。拥有一个转换器使 `Birth-Record` 成为一个可变类。请注意，没有特殊的\
  \ C++ 语法来表示 `SetBabyName` 是一个转换器。相反，一个方法仅仅根据其所做什么就是转换器：它更改了存储在现有对象中的信息。我们只有通过在头部使用\
  \ `const` 才能确保一个方法 `不是` 转换器。\n\n难道直接将 `babysName` 字段设为 `public` 而不调用方法就给它分配一个新值更简单吗？是的，但这会破坏\
  \ `BirthRecord` 类的封装。通过转换器进行更改保留了封装，因为它允许我们使用数据和控制抽象。例如，我们以后可以增强此转换器，以检查新名字是否仅包含字母。\n\
  \n或者，我们可以让 `BirthRecord` 成为一个不可变类。对于这种设计，我们创建一个新记录，使用旧记录中的信息（除姓名以外的所有信息），并在那里插入新姓名。例如，以下是一个构造函数，它接受一个\
  \ `BirthRecord` 对象作为参数并自动执行复制：\n\n![部分程序代码。](img/9781284166033_CH12_P713-1.jpg)\n\
  \n然后我们如下所示更新出生记录：\n\n![一个表达式。Birth Record，更新 Baby，左括号，new Baby，逗号，some Name，右括号，分号。](img/9781284166033_CH12_P713-2.jpg)\n\
  \n注意，这条语句并没有更改旧对象，而是创建了一个新对象。\n\n如你所见，使用转换器更简单。它也更快。对于计算机来说，给字段分配新值比创建一个新对象更快。\n\
  \n## 12.6 Name ADT\n\n我们已经展示了 `TimeOfDay` ADT 并将其实现为 C++ 类。它可以用于任何需要 `TimeOfDay`\
  \ 对象的程序。现在让我们来看另一个有用的 ADT：Name ADT。在 4 章 中，我们以不同的格式显示姓名。在 9 章 中，Health Profile 使用了姓名。让我们停止重复工作，一劳永逸地解决它——作为一个抽象数据类型。\n\
  \n我们需要跟踪姓名，该 ADT 的非正式规范如下：\n\n**类型**\nName\n\n**域**\n每个 `Name` 是由名、中间名和姓组成的姓名。\n\
  \n**操作**\n构造 Name 实例\n检查名\n检查中间名\n检查姓\n比较两个名字的“之前”、“相同”和“之后”\n\n注意，没有输出姓名的操作。由于我们允许用户检查这些部分，他们可以根据自己的目的将其组合。\n\
  \n我们分两个阶段创建 Name ADT：规范，然后是实现。第一阶段的结果是包含 `Name` 类定义的 C++ 规范文件（.h）。该文件还描述每个 ADT 操作的语义。\n\
  \n第二个阶段——实现——要求我们 (1) 为姓名选择具体的数据表示，(2) 将每个操作实现为 C++ 函数。结果是 C++ 实现文件。\n\n### ADT\
  \ 的规范\n\n我们 ADT 的域是由名、中间名和姓组成的所有姓名集合。为了将 Name ADT 表示为程序代码，我们使用名为 `Name` 的 C++ 类。ADT\
  \ 操作变为该类的公共成员函数。现在让我们仔细地规范这些操作。\n\n#### 构造 Name 实例\n\n我们使用 C++ 默认构造函数创建 Name ADT\
  \ 的实例。`TimeOfDay` 的默认构造函数将小时、秒和分钟设置为零。Bl 将是 `Name` 类的逻辑等效物。\n\n参数化构造函数必须为此操作提供三个参数：名、中间名和姓。虽然我们尚未确定姓名的具体数据表示，但我们必须决定客户端应对这些参数使用什么数据类型。逻辑选择是每个值都由字符串表示。但如果我们想在构造后更改姓名呢？让我们不允许用户这样做；也就是说，让\
  \ `Name` 成为一个不可变类。\n\n#### 检查姓名的名、中间名和姓\n\n这三个操作都是观察操作。它们允许客户端间接地访问私有数据。在 `Name`\
  \ 类中，我们通过具有以下原型返回值的成员函数来表示这些操作：\n\n\n\n\n\n![3 个原型声明。第 1 行：string, Get First Name，左括号，右括号，分号。第\
  \ 2 行：string, Get Middle Name，左括号，右括号，分号。第 3 行：string, Get Last Name，左括号，右括号，分号。](img/9781284166033_CH12_P720-1.jpg)\n\
  \n### 检查中间名首字母\n\n此操作返回中间名的首字母。我们应该将其作为 `string` 还是作为 `char` 变量返回？这并不重要，只要我们在代码和文档中保持一致即可。让我们将其定义为一个\
  \ `char` 函数。\n\n### 比较两个名字\n\n此操作比较两个名字，并判断第一个名字在第二个名字之前、两个名字相同，还是第一个名字在第二个名字之后。为了表示比较的结果，我们使用在\
  \ `TimeOfDay` 类中使用的枚举类型：\n\n![一个语句。enum, Relation Type，左大括号，BEFORE，逗号，SAME，逗号，AFTER，右大括号，分号。](img/9781284166033_CH12_P720-2.jpg)\n\
  \n然后我们可以将比较操作编写为成员函数，返回一个 `RelationType` 类型的值。以下是该函数原型：\n\n![一个函数原型。Relation Type,\
  \ Compared To，左括号，Name, other Name，右括号，const，分号。](img/9781284166033_CH12_P720-3.jpg)\n\
  \n描述\n\n注意，与 `otherName` 比较的名字是调用该成员函数的对象（实例）。例如，以下客户端代码测试了 `name1` 是否在 `name2`\
  \ 之前：\n\n![一个代码片段。](img/9781284166033_CH12_P720-4.jpg)\n\n描述\n\n![一个代码片段。](img/9781284166033_CH12_P721-1.jpg)\n\
  \n描述\n\n我们现在几乎准备好为我们的 `Name` 类编写 C++ 规范文件了。然而，类声明我们需要包含私有部分——即作为 ADT 具体数据表示的私有变量。恰当选择具体的数据表示属于\
  \ ADT 的实现阶段，而不是规范阶段。但是，为了满足 C++ 类声明的要求，我们现在选择一种数据表示。名字最简单的表示是三个字符串值——分别对应名、中间名和姓。这里这里是包含\
  \ `Name` 类声明的规范文件。\n\n![一个程序段。](img/9781284166033_CH12_P721-2.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH12_P722-1.jpg)\n\
  \n描述\n\n注意，我们在观察者函数的命名使用了“Get”一词。我们在 `TimeOfDay` 类中也是这样做的。将“Get”作为字段名的前缀是许多程序员使用的面向对象的约定。对于改变字段值的转换器（transformers），对应的名称是在字段名前面加上“Set”。事实上，许多程序员将这类操作泛泛统称为\
  \ *getters*（get 器）和 *setters*（set 器）。\n\n### 实现文件\n\n我们已经为名字选择了具体的数据表示，在规范文件中显示为字符串变量\
  \ `first`、`middle` 和 `last`。现在我们实现每个类成员函数，将定义放在命名为 `Name.cpp` 的 C++ 实现文件中。除 `ComparedTo`\
  \ 函数外，所有函数的实现都非常简单直观，无需进行额外讨论。\n\n要比较两个名字，我们首先看姓氏。如果姓氏不同，我们决定哪个名字在字母顺序在前。如果姓氏相同，我们接着看名字。如果名字相同，我们必须看中间名。正如经常发生的那样，我们可以直接在函数中使用这种算法。\n\
