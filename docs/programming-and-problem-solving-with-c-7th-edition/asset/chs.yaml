  \n## 3.4 简单算术表达式\n\n现在我们已经查看了声明和赋值，让我们考虑如何使用数值类型进行计算。计算是通过表达式进行的。在这里，我们查看最多只有一个运算符的简单表达式，以便详细检查每个运算符。之后，我们将转向组合多个操作的表达式。\n\
  \n### 算术运算符\n\n表达式可以包含常量、变量和运算符。以下是五个有效表达式的示例：\n\n![有效表达式的示例。](img/9781284166033_CH03_PRE13.jpg)\n\
  描述\n\n表达式中允许的运算符取决于表达式中常量和变量的数据类型。算术运算符有：\n\n| 运算符 | 含义 | 有效类型 |\n| --- | --- |\
  \ --- |\n| `+` | 一元加 | 整数、浮点 |\n| `–` | 一元负 | 整数、浮点 |\n| `+` | 加法 | 整数、浮点 |\n| `–`\
  \ | 减法 | 整数、浮点 |\n| `*` | 乘法 | 整数、浮点 |\n| `/` | 浮点数除法（浮点数结果），或整数除法（无小数部分） | 浮点型,\
  \ 整数 |\n| `%` | 取模（整数除法的余数） | 整数 |\n\n前两个运算符是一元运算符—它们只需要一个操作数。其余五个是二元运算符，需要两个操作数。一元加减用法如下：\n\
  \n![列出算术运算符的表格。](img/9781284166033_CH03_PRE14.jpg)\n描述\n\n程序员很少使用一元加。在没有任何符号的情况下，数值常量被假认为是正数。\n\
  \n你可能不熟悉整数除法和取模（`%`）。让我们更仔细地看看它们。注意 `%` 只用于整数。当你用一个整数除以另一个整数时，你会得到整数商和一个余数。整数除法只给出商，而\
  \ `%` 只给出余数。（如果任一操作数为负数，余数的符号在不同的 C++ 编译器之间有所不同。(2)）\n\n![一元加和一元负的用法。](img/9781284166033_CH03_PRE15.jpg)\n\
  描述\n\n相比之下，浮点数除法产生浮点结果。例如，表达式\n\n![用两个示例显示的除法和取模结果。](img/9781284166033_CH03_PRE16.jpg)\n\
  描述\n\n产生值 3.5。\n\n以下是一些使用算术运算符的表达式及其取值：\n\n| 表达式 | 值 |\n| --- | --- |\n| `3 + 6`\
  \ | 9 |\n| `3 . 4 - 6 . 1` | –2 . 7 |\n| `2 * 3` | 6 |\n| `8 / 2` | 4 |\n| `8 .\
  \ 0 / 2 . 0` | 4 . 0 |\n| `8 / 8` | 1 |\n| `8 / 9` | 0 |\n| `8 / 7` | 1 |\n| `8\
  \ % 8` | 0 |\n| `8 % 9` | 8 |\n| `8 % 7` | 1 |\n| `0 % 7` | 0 |\n| `5 % 2.3` | 错误（操作数必须是整数）\
  \ |\n\n小心除法和取模。计算机不能除零。表达式 `7 / 0` 和 `7 % 0` 产生错误。对于浮点数，`7.0 / 0.0` 产生一个特殊的无限值，输出时显示为“inf”。\n\
  \n由于表达式允许变量，以下是有效的赋值：\n\n![一些有效的赋值。](img/9781284166033_CH03_PRE17.jpg)\n描述\n\n正如我们在涉及字符串表达式的赋值语句看到的，同一个变量可以出现在赋值运算符的侧侧。在这种情况下\n\
  \n![表达式两边出现同一个变量。](img/9781284166033_CH03_PRE18.jpg)\n描述\n\n以下是适当的赋值语句：\n\n![一些赋值语句。](img/9781284166033_CH03_PRE10.jpg)\n\
  描述\n\n在这些赋值语句中，表达式的数据类型与其被赋值的变量的数据类型匹配。在章的后面部分，我们将看到如果数据类型不匹配会发生什么。\n\n### 增减运算符\n\
  \n除了算术运算符外，C++ 还提供了增和减运算符：\n\n`++`（加 1）\n\n`--`（减 1）\n\n这些一元运算符将单个变量作为操作数。对于整数和浮点操作数，效果是对操作数加\
  \ 1（或减 1）。如果 `num` 当前包含值 8，语句 `num++` 会使 `num` 包含 9。你可以通过此赋值语句实现相同的效果：`num = num\
  \ + 1`。\n\n\n\n在这种情况下，后置形式的结果与前缀形式不同。我们将在第 7 章中解释这种差异。目前，你应该只将 `++` 和 `--` 运算符作为单独的语句来变量进行递增或递减：\n\
  \n![递增语句和递减语句的语法模板。](img/9781284166033_CH03_UFIG105-1.jpg)\n\n描述\n\n2 编译器之间的这种不一致性可能会在程序移动到不同的计算机系统时导致细微的错误。我们建议避免对负整数使用取余运算。`abs`\
  \ 函数（在“函数调用和库函数”节中描述）可以在应用 `%` 之前用于获取 `int` 的绝对值。在第 5 章中，我们将看到如何检查负值并跳过可能会使用这些值的计算。\n\
  \n## 3.5 复合算术表达式\n\n到目前，我们使用的表达式最多包含一个算术运算符。我们还小心地避免在同一个表达式中混合整数和浮点值。现在我们来看更复杂的表达式——即由多个运算符组成的表达式，以及包含混合数据类型的表达式。\n\
  \n### 优先级规则\n\n算术表达式可以由许多常量、变量、运算符和括号组成。操作的顺序是怎样的？例如，在赋值语句中\n\n![一个赋值语句。](img/9781284166033_CH03_PRE28.jpg)\n\
  \n描述\n\n是先计算 `FREEZE_PT + BOIL_PT`还是先计算 `BOIL_PT / 2.0`？\n\n基本算术运算符（一元 `+`、一元 `-`、用于加法的\
  \ `+`、用于减法的 `-`、用于乘法的 `*`、用于除法的 `/` 以及用于取数的 `%`）按照优先级规则与数学运算符的排序方式相同：\n\n| 优先级级别\
  \ | 运算符 |\n| --- | --- |\n| 最高优先级级别： | 一元 `+` 一元 `-` |\n| 中间级别： | `* / %` |\n| 最低级别：\
  \ | `+ -` |\n\n由于除法的优先级高于加法，示例中的表达式隐式地加上了括号：\n\n![一个带括号的表达式。](img/9781284166033_CH03_PRE29.jpg)\n\
  \n描述\n\n也就是说，我们先将 `BOIL_PT` 除以 `2.0`，然后将 `FREEZE_PT` 加到结果上。\n\n你可以通过括号来改变求值顺序。在语句中\n\
  \n![使用括号改变了表达式中的求值顺序。](img/9781284166033_CH03_PRE30.jpg)\n\n描述\n\n`FREEZE_PT` 和\
  \ `BOIL_PT` 先相加，然后将它们的和除以 `2.0`。我们先求值括号内的子表达式，然后遵循运算符的优先级。\n\n当算术表达式有多个优先级相同的二元运算符时，它们的分组顺序（或结合性）是从左到右的。表达式\n\
  \n![具有相同优先级的二元运算符时，优先级顺序从左到右。](img/9781284166033_CH03_PRE31.jpg)\n\n描述\n\n意味着 `(int1\
  \ - int2) + int3`，而不是 `int1 - (int2 + int3)`。另一个例子，我们将使用表达式\n\n![(float1 + float2)\
  \ / float1 * 3.0](img/9781284166033_CH03_PRE32.jpg)\n\n先求值括号内的表达式，然后将和除以 `float1`，最后将结果乘以\
  \ `3.0`。下面是更多例子。\n\n| 表达式 | 数值 |\n| --- | --- |\n| `10 / 2 * 3` | 15 |\n| `10 %\
  \ 3 – 4 / 2` | –1 |\n| `5.0 * 2.0 / 4.0 * 2.0` | 5.0 |\n| `5.0 * 2.0 / ( 4.0 * 2.0\
  \ )` | 1.25 |\n| `5.0 + 2.0 / ( 4.0 * 2.0 )` | 5.25 |\n\n在 C++ 中，所有一元运算符（如一元 `+`\
  \ 和一元 `-`）都是从右到左的结合性。尽管这一事实最初看起来很奇怪，但事实它是自然的分组顺序。例如，`- + x` 意味着 `- (+ x)`，而不是没有意义的\
  \ `(- +) x`。\n\n### 类型强制转换与类型转换\n\n整数值和浮点值的存储方式不同。表示 `2` 的位模式与表示 `2.0` 的位模式看起来不同。\n\
  \n### 赋值语句\n\n如果在表达式中混合整数和浮点值会发生什么？我们先看赋值。\n\n![一些声明。](img/9781284166033_CH03_PRE33.jpg)\n\
  \n描述\n\n然后 `int` 可以存储整数值，`float` 可以存储浮点值。\n\n![赋值语句。](img/9781284166033_CH03_PRE34.jpg)\n\
  \n描述\n\n将 `int` 表达式的结果存储到 `float` 变量中通常不会丢失信息；整数 `24` 可以以浮点形式表示为 `24.0`。然而，将浮点表达式的结果存储到\
  \ `int` 变量中可能会丢失信息，小数部分会被截断。当浮点值赋值给 `int` 变量时，小数部分会被切掉。这种一种类型到另一种类型的自动转换被称为类型强制。\n\
  \n![一些声明。](img/9781284166033_CH03_PRE35.jpg)\n\n描述\n\n整个表达式都可能涉及类型强制。赋值\n\n![float1\
  \ = 3 * int1; int2 = 5.2 / float1;](img/9781284166033_CH03_PRE36.jpg)\n\n会导致类型强制。在将\
  \ `int` 表达式的结果存储到 `float` 变量时，编译器插入额外的指令将 `12` 转换为 `12`。这种浮点值到 `int` 的转换也会导致强制。在两种情况下，如果我们避免混合类型，程序读起来都会不那么困惑。\n\
  \n为了让我们的程序尽可能清晰（无错误），我们可以使用类型转换（或类型转换）。C++ 转换操作由一个类型名称和括在括号内的待转换表达式组成：\n\n![赋值语句。](img/9781284166033_CH03_PRE37.jpg)\n\
  \n描述\n\n这两个语句产生相同的结果，但通过类型转换操作，可以清楚地看到混合类型是有意为，而不是疏忽。\n\n![这两个语句产生相同的结果。](img/9781284166033_CH03_PRE38.jpg)\n\
  \n描述\n\n这里是在将浮点值存储到 `int` 变量之前，对其进行舍入而不是截断：\n\n![一个舍入的示例。](img/9781284166033_CH03_PRE39.jpg)\n\
  \n描述\n\n用纸笔亲手看看当 `float1` 包含 `4.7` 时存储到 `int1` 中的什么。现在试一次，假设 `float1` 包含 `4.2`。（这种技术假设\
  \ `float1` 是正数。）\n\n### 算术表达式\n\n到为止我们讨论的都是跨赋值运算符 (=) 混合数据类型。在表达式内部混合数据类型也是可能的：\n\
  \n\n\n\n![混合数据类型的算术表达式。](img/9781284166033_CH03_PRE41.jpg)\n\nDescription\n\n此类表达式被称为混合类型表达式（或混合模式表达式）#9781284166033_CH03_05.xhtml_c3-sid0005)。\n\
  \n每当整数值和浮点值被运算符连接时，就会发生隐式类型转换：\n\n1. 整数值被强制转换以创建一个临时的浮点值。\n2. 使用该临时值执行操作。\n3. 结果是一个浮点值。\n\
  \n让我们查看机器是如何评估表达式 `4.8 + someInt – 3` 的，其中 `someInt` 包含值 `2`。首先，`+` 运算符的操作数具有混合类型，因此\
  \ `someInt` 的值被强制转换为 `2.0`。（这种转换创建了一个独立的临时值；它不会影响存储在 `someInt` 中的值。）执行加法后得到值 `6.8`。接下来，减法（`-`）运算符连接了一个浮点值（`6.8`）和一个整数值（`3`）。值\
  \ `3` 被强制转换为 `3.0`，执行减法，结果是浮点值 `3.8`。\n\n与赋值语句一样，你可以在表达式中使用显式类型转换来降低错误风险。编写如下表达式：\n\
  \n![显式类型转换的示例。](img/9781284166033_CH03_PRE42.jpg)\n\nDescription\n\n可以让你的意图变得清晰明确。\n\
  \n显式类型转换不仅对于程序的清晰性很有价值，在某些情况下为了正确计算也是必不可少的。给定以下声明：\n\n![某些声明。](img/9781284166033_CH03_PRE43.jpg)\n\
  \nDescription\n\n假设 `sum` 和 `count` 目前分别包含 `60` 和 `80`。如果 `sum` 代表一组整数值的和，而 `count`\
  \ 代表值的个数，让我们找到平均值：\n\n![一个给出错误结果的示例。](img/9781284166033_CH03_PRE44.jpg)\n\nDescription\n\
  \n遗憾的是，这条语句将值 `0.0` 存储入 `average`。原因如下：表达式没有混合类型。`/` 运算符两个操作数都是 `int` 类型，因此执行了整数除法。当\
  \ `60` 除以 `80` 时，得到整数值 `0`。接下来，值 `0` 在存储入 `average` 之前被强制转换为 `0.0`。\n\n这是正确且清晰地找到平均值：\n\
  \n```\naverage = float(sum) / float(count);\n```\n![images/9781284166033_CH03_PRE45.jpg\
  \ 这条语句执行的是浮点除法而非整数除法。结果是值 `0.75` 被存储入 `average`。关于类型转换和类型转换的最后一点，你可能已经注意到我们集中在 `int`\
  \ 和 `float` 类型上。也可以将 `char`、`short` 和 `double` 值混合其中。结果可能会令人困惑且产生意外。在第 10 章中，我们将回到这个主题并进行更详细的讨论。在此之前，你应该避免在表达式中混合这些类型的值。3\
  \ 在 C++ 中编写转换操作还有另外两种方法，它们与这种语法相比有一些优势。我们将等到第 7 章来介绍并解释它们。在此之前，这种更简单的表示法将满足你的编程需求。##\
  \ 3.6 函数调用和库函数### 返回值的函数在第 2 章开头，我们展示了一个由三个函数组成的程序：`main`、`Square` 和 `Cube`。这里是程序的部分列表：![包含三个函数的程序。](img/9781284166033_CH03_PRE50.jpg)\n\
