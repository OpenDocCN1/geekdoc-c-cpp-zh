  \n![数字之间的单个字符常量。](img/9781284166033_CH03_PRE61.jpg)\n\n描述\n\n该语句产生了以下输出：\n\n![数字之间的单个字符常量输出。](img/9781284166033_CH03_PRE62.jpg)\n\
