  \ 程序。\n\n![程序片段](img/9781284166033_CH11_P603-2.jpg)\n描述\n\n![程序片段的延续](img/9781284166033_CH11_P604-1.jpg)\n\
  描述\n\n输出（为了节省空间采用四列）：\n\n![程序片段的示例输出](img/9781284166033_CH11_P604-2.jpg)\n描述\n\n\
  注意，在输出之前必须将索引转换回字符。这种转换是原始操作的反向：将索引加上字母 'A'并将结果强制转换回字符。\n\n### 传递数组\n\n在第 8 章中，我们说变量应该按值传递给函数而不是按引用，除非函数需要更改参数。我们特别将流变量（如文件）排除在这一规则之外，并注释稍后将讨论另一个例外。现在我们可以揭示数组就是例外。\n\
  \n默认情况下，C++ 简单变量总是按值传递的。要按引用传递简单变量，必须在函数的参数列表中数据类型名称后添加引用符号 (`&`)：\n\n![按引用传递变量声明](img/9781284166033_CH11_P605-1.jpg)\n\
  描述\n\n在 C++ 中，数组*总是*按引用传递的（2）。因此，在声明数组作为参数时，永远不要使用 `&`。当数组作为参数传递时，其**基地址**——数组第一个元素的内存地址——会被发送给函数。然后函数就知道了调用者实际数组的所在位置，并可以访问数组的任何元素。\n\
  \n这是一个 C++ 函数，可以将任何大小的一一维 `int` 数组清零：\n\n```cpp\nvoid zeroArray(int array[], int\
  \ size) {\n    for (int i = 0; i < size; i++) {\n        array[i] = 0;\n    }\n\
  }\n```\n\n在参数列表中，`intArray` 的声明没有包含大小。如果指定了大小，编译器会忽略它。回想一下 C++ 不进行边界检查，所以它不在乎大小。因此，我们需要包含第二个参数——数组元素的数量——作为\
  \ For 循环的终止条件。\n\n\n\n\n调用代码可以针对任何大小的 `int` 数组调用 `ZeroOut`。以下代码片段将两个不同大小的数组置零。请注意函数原型中是如何声明数组参数的。\n\
