  ### 注意事项\n\n如果你在集成开发环境（IDE）中开发程序，该环境将编辑器、编译器和链接器封装成一个应用程序，那么在用模板时必须非常小心。在 IDE 中，你通常被要求定义一个“项目”——一个构成构成程序的单独文件列表。由于第\
  \ 13 章 中的 `List` 类包含两个文件（`list.h` 和 `list.cpp`），并且你的客户端代码位于文件 `myprog.cpp` 中，你将在项目中指定\
  \ `myprog.cpp` 和 `list.cpp`。关键点是，这两个文件是分开编译的，然后它们的对象代码文件被（通过链接器）链接形成一个可执行文件。\n\n\
  使用模板，这种情况可能会发生变化。我们不希望单独编译 `myprog.cpp` 和 `glist.h`（如果我们正在使用第二种组织代码的方法，则为 `glist.cpp`）。在这种情况下，解决方案是在项目中仅指定\
  \ `myprog.cpp`。因为 `myprog.cpp` 包含了 `glist.h`，而 `glist.h` 要么包含实现代码，要么包含了包含 `glist.cpp`，编译器一次性接收所有源代码进行编译。\n\
  \n1 一旦定义了模板函数，就可以编写一个称为显式特化（explicit specialization）的额外定义，为特定类型重新定义该函数。这种重定义以 `template\
  \ <>` 开头，并且函数头部包含了函数名后角括号中出现的类型。C++ 社区对显式特化的使用存在争议，它们的定义在语言未来版本中可能会 way。因此，我们在此不再进一步讨论它们。尽管如此，你应该意识到看到\
  \ `template` 后面跟着空括号的可能含义，以防你在其他地方遇到此类代码。\n\n## 16.2 泛型函数\n\n有时当我们在设计或测试软件时，会发现我们需要单一算法，该算法可以在不同时间应用于不同数据类型的对象。我们希望能够描述这种算法，而无需指定所处理项的数据类型。这种算法通常被称为泛型算法。C++\
  \ 通过提供两种机制：函数重载和模板函数来支持泛型算法。\n\n### 函数重载\n\n函数重载对不同的函数使用相同的名称，只要它们的参数类型足够不同，以便编译器区分它们。为了看到它是如何工作的，让我们来看一个例子。\n\
  \n假设我们正在调试程序，并希望通过在程序执行时输出某些变量的值来跟踪其执行。我们要跟踪的变量具有以下六种数据类型：`int`、`char`、`float`、`double`、`short`\
  \ 和 `long`。我们可以创建六个函数。与其强制我们发明不同的名称（如 `PrintInt`、`PrintFloat` 等），不如 C++ 允许我们使用同一个名称。\n\
  \n代码片段\n\n描述\n\n这些函数的调用看起来像这样：\n\n![3 次调用](img/9781284166033_CH16_P986.jpg)\n\n\
  描述\n\n我们可以认为 `Print` 是一个泛型算法，因为该算法本身（输出字符串“Debug”以及变量的值）与变量的数据类型无关。在编写程序时，我们只需要使用一个名称（`Print`），尽管实际上有六个函数。\n\
  \n函数重载是如何工作的？当编译器遇到函数调用\n\n![Print(someVar);](img/9781284166033_CH16_P987.jpg)\n\
  \n它会比较实际参数与形式参数的类型。如果 `someVar` 是 `int` 类型，则编译器生成调用具有 `int` 参数的 `Print` 函数的代码。如果\
  \ `someVar` 是 `float` 类型，则编译器生成调用具有 `float` 参数的 `Print` 函数的代码，以此此类推。\n\n可见，函数重载通过消除为执行相同任务的不同类型构名称的需求的需求便利了程序员。尽管有好处，但在我们的函数示例中，我们仍然需要六个不同的函数定义。\n\
  \n### 在类外定义函数模板\n\n解决此问题的更好方法是使用模板函数。我们已经看到这种方法可以实现模板类的成员函数；然而，C++ 并不将模板函数限制在类中。它们可以在任何可以定义普通函数的地方定义。在这里我们将使用关键字\
  \ `typename`，仅为了强调 `Print` 不一定属于类。\n\n![一个函数模板](img/9781284166033_CH16_P987-1.jpg)\n\
  \n描述\n\n### 实例化函数模板\n\n给定这个 `Print` 函数模板，我们可以如下进行函数调用：\n\n![3 次调用](img/9781284166033_CH16_P987-2.jpg)\n\
  \n描述\n\n\n\n\n\n在这段代码中，尖角括号内的类型名称是模板参数。在编译时期间，编译器会生成（实例化）三个不同的函数，每个函数都针对特定的模板参数进行了特化处理。\n\
  \n当编译器实例化模板时，它会在字面面上将整个函数模板中用模板参数替换模板参数，这就像你在编辑器中执行“查找并替换”操作一样。例如，当编译器在调用代码中第一次遇到\
  \ `Print<float>` 时，它通过将函数模板中所有出现的 `SomeType` 替换为 `float` 来生成一个新函数：\n\n![一段代码片段。](img/9781284166033_CH16_P988.jpg)\n\
  \n描述\n\n以下是调用模板函数的语法模板：\n\n![一个模板函数调用。](img/9781284166033_CH16_P988-1.jpg)\n\n描述\n\
  \n如你所示，尖角括号中的模板参数列表是可选的。事实上，大多数程序员都会省略它。在这种情况下，认为编译器通过检查函数参数列表来推导出模板参数。\n\n例如，我们之前使用显式模板参数的调用代码示例更有可能写成如下所示：\n\
  \n![三次函数调用。](img/9781284166033_CH16_P988-2.jpg)\n\n描述\n\n在这段代码中，当编译器遇到 `Print(sum)`\
  \ 时，它查看函数参数 `sum` 的数据类型（为 `int`），并推断出模板参数必须是 `int`。因此，该函数调用对应模板的 `Print<int>` 特化。\n\
  \n然而，在某些情况下，编译器无法推导出函数的特殊特化。例如，如果参数是一个多态类的对象，编译器不知道在运行时将哪个子类传递给函数。请记住，编译器必须能够在编译时完成实例化泛型函数的所有工作。如果它无法从代码中推导出特化，你必须显式指定类型。\n\
  \n## 16.3 运算符重载\n\n在第 14 章中，我们创建了一个包含 `Entry` 类项的排序链表。为了完成这项任务，我们必须使用函数 `ComparedTo`\
  \ 而不是关系运算符重写列表算法。我们可以通过 C++ 的另一个高级功能：运算符重载来避免这一步。\n\n以下是上一章中的 `Date` 类，它通过重载关系运算符\
  \ `<`、`>` 和 `==` 被增强。函数原型被阴影标记。\n\n![Date 抽象数据类型的规范文件。](img/9781284166033_CH16_P989.jpg)\n\
  \n描述\n\n重载符号的语法是单词 `operator` 后面跟要重载的符号。当我们使用这些运算符时，它们各自分有两个操作数，但在参数列表中只显示了一个参数。另一个操作数在哪里？第一个操作数是应用运算符的\
  \ little，而第二个操作数是参数。此类函数在 C++ 中被称为运算符函数。以下是它们的实现：\n\n![用于重载 Date 运算符的代码。](img/9781284166033_CH16_P990.jpg)\n\
  \n描述\n\n这是一个测试驱动程序，用于展示我们如何使用这些函数。在练习中，你被要求为 `Date` 类构建测试计划并重载剩余的关系运算符。\n\n![Date\
  \ 类的测试驱动程序。](img/9781284166033_CH16_P990-1.jpg)\n\n描述\n\n![Date 类测试驱动程序的延续。](img/9781284166033_CH16_P991.jpg)\n\
  \n描述\n\n输出：\n\n![测试驱动程序的输出。](img/9781284166033_CH16_P991-1.jpg)\n\n描述\n\n如你所示，`Date`\
  \ 类的对象现在可以使用关系运算符 `<`、`>` 和 `==` 进行比较了。在这些示例中，运算符左侧的操作数被作为参数传递给函数的第一个操作数；也就是说，它是应用函数的对象。运算符右侧的操作数被作为参数传递传递。\n\
  \n以下是一些关于重载的指南：\n\n1. 所有 C++ 运算符均可以重载，`::`、`sizeof` 和 `?` 除外。\n2. 重载运算符的操作数之一必须是类实例。\n\
  3. 你不能更改标准的运算符优先级、定义新的运算符符号或更改结合性。\n4. 重载一元运算符：如果 `data` 类型为 `SomeClass` 且你想重载（例如）一元负号，你将函数头写为\
  \ `operator-`。应用运算符的操作数在负号右侧。\n5. 重载二元运算符：如果 `data` 类型为 `SomeClass` 且你重载了（例如）加法运算符\
  \ (`+`)，那么 `data + otherData` 等于 `data.operator+(otherData)`。\n\n在尝试重载 `()`、`[]`、`->`、`<<`\
  \ 和 `>>` 之前，你应该咨询 C++ 参考，因为这些运算符会有额外的考虑。\n\n### 使用 this\n\n在前面的示例中，`>` 函数与 `<` 函数基本相同，只是我们在所有语句中都使用了\
  \ `>` 关系运算符。一旦为 `Date` 定义了 `<`，如果我们能够检查 `Date` 的每个成员，直接将 `>` 函数体写如下：\n\n![一条语句。返回\
  \ Date, 左尖角括号, this, 分号。两个正斜杠。这样很好，但不行通。](img/9781284166033_CH16_P992.jpg)\n\n该语句的问题是\
  \ `thisDate` 在任何地方都没有定义。我们如何在对象内部引用整个对象呢？C++ 通过提供一个保留字 `this` 来解决这个问题，它代表指向当前对象的指针。为了访问对象，我们必须使用\
  \ `*` 运算符对 `this` 进行解引用。然后 `>` 函数可以重写如下：\n\n![用于重载右尖角括号, 运算符的代码。](img/9781284166033_CH16_P992-1.jpg)\n\
  \n描述\n\n\n\n\n\n对于递增和递减运算符，这种语法重载了它们的前缀形式（例如 `++x`）。早期的 C++ 编译器不允许重载 `++` 和 `--`\
  \ 的后置形式（即 `x++`）。然而，较新的编译器支持形式为 `data.operator++(int dummy)` 的成员函数。实际上并没有内容被传递给参数\
  \ `dummy`，它的值自动为 0。参数名称不必非是 `dummy`；任何标识符都可以工作。这个未使用的 `int` 参数的存在仅仅是一种语法上的技巧，用于告知编译器该函数应该应用于运算符左侧的对象。\n\
  \n## 16.4 异常\n\n假设我们正在编写一个程序，在其中我们需要频繁除两个整数并获取商。在每种情况下，我们都需要检查除以 0 的情况，因此我们写了一个名为\
  \ `Quotient` 的函数，除非分母为 0，否则该函数返回任意两个整数的商：\n\n![Quotient 函数的定义。](img/9781284166033_CH16_P993.jpg)\n\
  \n描述\n\n我们面临一个问题：如果分母为 0，这个函数应该做什么？这是一个并不容易回答的问题。这里有几种可能性，但没有一个是完全满意的：\n\n1. 不执行除法，并静默返回调用代码。\n\
  2. 打印错误消息并返回一个任意整数值。\n3. 向调用者返回一个特殊值（如 -9999），作为发生某些错误的信号。\n4. 使用第三个参数重写函数，该参数是一个布尔标志，用于指示成功或失败。\n\
  5. 打印错误消息并停止程序。\n\n选择 1 显然是不负责任的。选择 2 通过错误消息告知用户，但不会通知调用代码发生了任何错误。选择 3 在某些情况下是可以接受的，但通常来说不是一个好的解决方案。如果允许分子和分母为任何整数，那么\
  \ -9999 就是一个完全有效的商，无法与特殊信号值区分开来。选择 4 是一种合理的方法，并且被程序员经常使用。它在我们案例中的缺点是，我们应该将返回值的函数（只返回一个值）改为\
  \ void 函数，以便通过参数列表作为引用参数返回两个值：商和布尔标志。选择 5 几乎从不令人满意。在发生错误时，应该允许调用代码——而不是被调用的函数——来决定做什么。也许调用者希望采取步骤从错误中恢复并继续执行程序，而不是终止它。\n\
  \n解决我们困境的一种方法是消除困境！使用如下的函数前提条件：\n\n![Quotient 函数的定义。](img/9781284166033_CH16_P993-1.jpg)\n\
  \n描述\n\n在这里，调用者必须在调用函数之前确保前提条件为真；结果是函数不需要进行任何错误检测。相反，通过这种方法，调用者负责所有的错误检测和错误处理。在全文中，我们使用这种策略从被调用函数中消除错误检测。然而，在某些情况下，错误只有在尝试执行操作之后才能检测到，而不是之前。\n\
  \n例如，本应输入整数值的函数 `ReadInt` 可能会发现用户错误地输入了一些字母（在这种情况下，输入变量不会改变，且 `cin` 流将进入失败状态）。在这种情况下，我们无法为\
  \ `ReadInt` 设置“下一个输入值是有效整数”的前提条件，因为调用者没有办法预测输入是什么。为了处理这类错误（以及对于那些倾向于不使用前提条件方法的程序员），C++\
  \ 语言提供了异常处理机制。\n\n在软件世界中，`exception`（异常）是一种不常事件，通常是错误，需要特殊的处理。提供必要的特殊处理的程序代码段被称为\
  \ `exception handler`（异常处理器）。当一段代码宣布异常发生时，被称为 `throw`（抛出，或 `raise`）异常，希望另一段代码（异常处理器）能\
  \ `catch`（捕获）该异常并处理它。如果该特定异常不存在异常处理器，整个程序将带有错误消息终止。\n\n现在让我们 C++ 提供的抛出和捕获异常的机制。\n\
  \n### `throw` 语句\n\n在 C++ 中，“异常”一词不仅具有不常事件的一般含义，还具有更具体的含义：代表此类事件的变量或类对象。要抛出（引发）异常，程序员使用\
  \ `throw` 语句，其语法如下：\n\n![一条语句。throw 5, 分号。](img/9781284166033_CH16_P994.jpg)\n\n\
  在 `throw` 语句中，`Expression` 可以是任何数据类型的值或变量，无论是内置的还是用户定义的。让我们三个 `throw` 语句的示例。\n\n\
  这里是示例 1：\n\n```\nthrow 5;\n```\n\n在这个示例中，我们抛出一个 `int` 类型的异常，期望一个或多个处理器想要捕获一个 `int`\
  \ 类型的异常。在示例 2 中，我们抛出一个 `string` 类型的异常，这是标准库类：\n\n```\nthrow \"error\";\n```\n（注：此处原文为片段，已根据逻辑推全）。\n\
  \n在示例 3 中，我们抛出一个自己定义的类异常：\n\n```\nSalaryError sal;\n```\n在此处代码中，我们首先声明一个名为 `sal`\
  \ 的对象，然后抛出该对象。更常见的，C++ 程序员这样做：\n\n```\nthrow SalaryError();\n```\n省略括号将是语法错误。因为\
  \ `throw` 的语法需要一个表达式，而不是数据类型的名称。\n\n最后，注意语法模板中的 `Expression` 是可选的。我们稍后会讨论如果 `throw`\
  \ 表达式会发生什么。\n\n### `try-catch` 语句\n\n如果程序的某部分抛出了异常，程序的另一部分如何捕获并处理它呢？答案是使用 `try-catch`\
  \ 语句，它的形式如下：\n\n![Try Catch 语句的语法。](img/9781284166033_CH16_P995-3.jpg)\n\n描述\n\n\
  `FormalParameter` 的语法如下：\n\n![Formal Parameter 的语法。](img/9781284166033_CH16_P995-4.jpg)\n\
  \n描述\n\n（在后一个语法模板中，三个点字就是输入程序中的三个点。）\n\n如第一个语法模板所示，`try-catch` 语句由一个 try 子句和一个或多个\
  \ catch 子句组成。try 子句由关键字 `try` 和一个块（一对括号 **{ }** 包含任意数量的语句）组成。每个 catch 子句由关键字 `catch`、一个包含在括号内的单个参数声明和一个块组成。每个\
  \ catch 子句实际上都是异常处理器。\n\n\n\n\n\n当程序中的某个语句或一组语句可能会导致异常时，我们将它们封装在 `try-clause` 中。对于语句可能产生的每种类型的异常，我们都编写一个\
  \ `catch-clause`（异常处理器）。这里是一个涉及之前用 `throw` 语句讨论过的三种异常（`int`、`string` 和 `SalaryError`）的\
  \ `try-catch` 语句示例：\n\n![一段代码片段。](img/9781284166033_CH16_P996.jpg)\n\n描述\n\n`try-catch`\
  \ 语句的听起来就像就像教练对体操运动员说：“尽管试一下这个翻转；如果你摔倒了，我会接你。”在我们的情况下，我们告诉计算机尝试执行某些可能会失败的操作，然后提供代码来捕获潜在的异常。\n\
  \n### try-catch 的执行\n\n上述 `try-catch` 语句的执行方式如下：如果 `try-clause` 中没有任何语句抛出异常，则控制权将转移到整个\
  \ `try-catch` 语句之后的语句；也就是说，我们尝试执行一些语句，如果一切按计划进行，我们就继续执行后续语句。然而，如果 `try-clause` 中的某个语句抛出了异常，控制权会立即转移到相应的异常处理器（`catch-clause`）。注意，控制权会直接从引发异常的任何语句跳转到异常处理器。如果\
  \ `try-clause` 中在引发异常的语句之后还有语句，它们将被跳过。当控制权到达异常处理器时，将执行处理该异常的语句。如果这些语句没有引起任何新异常并且没有将控制权转移到其他地方（如使用\
  \ `return` 语句），则控制权将传递到整个 `try-catch` 结构的下一个语句。\n\n### 异常处理器中的形式参数\n\n当异常被抛出时，计算机如何知道多个异常处理器中的哪一个是合适的？它会查看每个处理器中声明的形式参数的数据类型，并选择第一个数据类型与抛出的异常类型匹配的处理器。仅由省略号（三个点或句号）组成的形式参数（如之前在\
  \ `FormalParameter` 语法模板所示）是一个“通配符”——它匹配任何异常类型。由于计算机按顺序搜索异常处理器以寻找匹配参数，因此带有省略号参数的最后一个异常处理器充当任何未列出类型异常的“全捕获”处理器：\n\
  \n![一段代码片段。](img/9781284166033_CH16_P997.jpg)\n\n描述\n\n注意，对匹配参数类型的顺序搜索要求我们将全捕获处理器放在最后。如果我们将其放在结构的最前面，它将捕获每一个异常，导致剩余的处理器被忽略。\n\
  \n与异常处理器中的形式参数相关的另一个问题是：参数声明是否应该包含一个参数的名称？（如果你查看 `FormalParameter` 的语法模板，你会发现参数的数据类型是强制的，但它的名称是可选的。）事实上，只有当异常处理器体体中的语句使用该变量时，才需要参数的名称。在我们之前捕获\
  \ `int`、`string` 和 `SalaryError` 异常的示例中，第一个和第三个异常处理器的参数列表仅包含数据类型名称。相比之下，第二个处理器的参数列表指定了\
  \ `string s`，因为该处理器的体使用了以下语句：\n\n![一个语句。c out，两个左尖括号，s，两个左尖括号，结束 l，分号。两个正斜杠。输出双引号，Invalid\
  \ customer age，双引号。](img/9781284166033_CH16_P997-1.jpg)\n\n来输出包含在 `s` 中的消息。\n\n\
  最后，我们必须解决异常编程中一个非常重要的问题：异常本身的数据类型。在 `int`、`string` 和 `SalaryError` 示例中，我们使用所有三种异常类型仅仅是为了演示可能性并展示如何编写异常处理器。在实践中，内置类型（`int`、`float`\
  \ 等）甚至类 `string` 的异常用处有限。如果一个 `try-clause` 抛出了多个具有不同整数值的 `int` 类型异常，那么接收 `int` 值的异常处理器就会变得复杂。它必须包含逻辑来测试整数以确定具体发生了哪种错误。此外，诸如下的语句\n\
  \n```\n![一个语句。throw 23，分号。](img/9781284166033_CH16_P998.jpg)\n```\n\n比如下语句的可读性和自文档性要差得多：\n\
  \n```\n![一个语句。throw Salary Error，左括号，右括号，分号。](img/9781284166033_CH16_P998-1.jpg)\n\
  ```\n\n因此，更好的想法是仅使用自定义类（或结构体）作为异常类型，为每种异常定义一种类型并使用描述性标识符：\n\n```\n![一段代码片段。](img/9781284166033_CH16_P998-2.jpg)\n\
  ```\n\n描述\n\n在我们所有的示例异常处理器中，参数都是按值传递的。这种方法对于任何标准类型都是足够的。然而，可能会开发相当复杂的异常类，传递大量的信息。在这种情况下，按引用传递将更有效，并且可以避免可能切片问题（slicing\
  \ problems）。\n\n### 非局部异常处理器\n\n在目前为止的讨论中，我们假设 `throw` 语句物理上位于旨在捕获异常的 `try-catch`\
  \ 语句内部。在这种情况下，如果抛出了异常，控制权将转移到相应数据类型的 `catch-clause`。\n\n![两个代码片段，说明抛出一个由调用代码捕获的异常。](img/9781284166033_CH16_FIG01.jpg)\n\
  \n图 16.1 抛出一个由调用代码捕获的异常\n\n描述\n\n在 C++ 程序中，`throw` 发生在发生在从 `try-clause` 内部调用的函数内部实际上更为常见，如图\
  \ 16.1 中的函数 `Func3` 和 `Func4` 所示。在运行时，计算机首先在 `Func4` 内部寻找 `catch`。当没有找到时，它会使 `Func4`\
  \ 立即返回并将异常传回给它的调用者 `Func3`。计算机接着在 `Func4` 被调用的地方寻找，找到合适的 `catch-clause` 并执行 `catch`。如你在图\
  \ 16.1 所示，异常是在 `Func4` 中抛出的，但异常处理器是非局部的（它在调用函数 `Func3` 中找到）。\n\n假设图 16.1 中的 `Func3`\
  \ 中没有匹配的 `catch-clause`。那么 `Func3` 将立即返回并将异常传回给它的调用者，可能是 `Func2`。每个不知道如何处理问题的函数都会将异常传回上一个函数。这种返回序列沿着函数调用链一直持续，直到找到匹配的异常处理器或控制权到达\
  \ `main`。如果 `main` 未能捕获异常（这种情况被称为未捕获异常），系统将终止程序并显示一条相对没有帮助的信息，例如“程序异常终止。”图 16.2\
  \ 描述了这一过程。\n\n\n\n\n\n即使 `throw` 语句在物理上存在于 `try-catch` 语句的 `try` 子中，如果该 `try-catch`\
  \ 语句中没有匹配的异常处理器，其结果与我们刚刚描述的相同——即闭包函数立即返回，并将异常向上传递给调用链。\n\n你可能会奇怪，为什么 C++ 程序通常使用非局部异常处理器。原因在于异常处理的核心，无论使用哪种编程语言都是如此。异常的根本目的是允许程序的一个部分在无法在本地处理错误时，向程序的另一个部分报告错误。\n\
  \n![两张说明跨多个函数调用层级的异常处理的图表。](img/9781284166033_CH16_FIGF02.jpg)\n\n图 16.2 跨多个函数调用层级的异常处理\n\
  \n描述\n\n### 重新抛出异常\n\n我们一直在使用以下形式的 `throw` 语句：\n\n![一个语句。throw Salary Error，左括号，右括号，分号。](img/9781284166033_CH16_P1001.jpg)\n\
  \n本章前面介绍的 `throw` 语句语法模板显示，我们使用 `throw` 单词，后面跟跟可选的表达式。因此，`throw` 表达式可以省略，如下：\n\n\
  ![一个语句。throw，分号。](img/9781284166033_CH16_P1001-1.jpg)\n\n该语句用于已捕获异常并执行某些操作的异常处理器，然后希望将异常传递给其调用者（重新抛出异常）以便进一步处理。这里是一个示例：\n\
  \n```\n![代码片段。](img/9781284166033_CH16_P1001-2.jpg)\n```\n\n描述\n\n重新抛出异常是 C++ 允许部分异常处理的方式。在前面的代码中，catch\
  \ 子句部分处理了 `BadData` 异常（通过向文件写入错误消息并关闭文件），然后返回，将异常重新抛出到函数调用链，直到它被捕获。\n\n如果我们在这段代码中删除\
  \ `throw` 语句会发生什么？如果我们将 `throw` 改为 `return` 会发生什么？本章末尾的习习题要求你考虑这些问题。\n\n### 标准异常\n\
  \n并不是所有的异常都由你作为 C++ 程序员定义。C++ 标准库中预定义了几个异常类，它们由 C++ 操作或由标准库例程中提供的代码抛出。\n\n#### 语言抛出的异常\n\
  \n某些 C++ 操作在执行过程中发生错误时会抛出异常。这些操作是 `new`、`dynamic_cast`、`typeid` 以及所谓的异常规范。后三个在本文中未涵盖；相反，我们这里只讨论\
  \ `new` 运算符。\n\n在[第 14 章]中，我们提到过 `new` 运算符从空存储区（堆）获取一块内存，并返回指向该块起始位置（地址）的指针。例如，代码：\n\
  \n```\n![两个语句。第 1 行：int asterisk int P t r，分号。第 2 行：int P t r equals new int，左方括号，1000，右方括号，分号。](img/9781284166033_CH16_P1002.jpg)\n\
  ```\n\n在空存储区上创建一个 1000 个元素的 `int` 数组，并将数组的基地址赋值给 `intPtr`。我们还提到，如果系统空存储区空间已耗尽，执行\
  \ `new` 将导致程序带有错误消息终止。现在我们了解了异常，就可以更完整地描述所发生的情况。如果 `new` 运算符发现空存储区耗尽，它会抛出一个类型为 `bad_alloc`\
  \ 的异常，该类是标准库中预定义的 C++ 类。如果该异常没有被任何异常处理器捕获，那么——与任何未捕获的异常一样，程序将带有通用消息（如“程序异常终止”）停止。或者，我们的程序可以捕获该异常并采取某些纠正措施（或至少显示更具体的错误消息）。例如，我们可能在\
  \ `main` 函数中编写以下代码：\n\n```\n![代码片段。](img/9781284166033_CH16_P1002-1.jpg)\n```\n\n\
  描述\n\n注意此异常处理器中的返回语句。该语句只有在位于 `main` 函数中时才会终止程序。如果我们希望前面的代码位于某些其他函数中，我们必须将返回语句更改为其他。例如，我们可以重新抛出\
  \ `bad_alloc` 异常给更高层次的函数，或者抛出一个新异常（例如命名为 `OutOfMem`）供高层函数捕获。\n\n#### 标准库例程抛出的异常\n\
  \nC++ 标准库实际上是两个库：从 C 语言继承的设施（称为 C 库）和专门为 C++ 设计的设施。通常，以字母“c”开头的头文件——例如 `cmath` 和\
  \ `cctype`——位于 C 库中，其他头文件是专门为 C++ 设计的。C 库并不抛出异常。相反，当发生错误时它使用一个全局整数 `errno`。如果你想检查错误，将\
  \ `errno` 设置为 0，调用例程，然后检查 `errno` 是否为零。在这一点上，一种选择是抛出自己的异常。\n\nC++ 部分定义了异常类并抛出异常。例如，异常类包括\
  \ `out_of_range` 和 `length_error`，它们在处理字符串时都可能被抛出。让我们看看如何处理这些。\n\n在第 3 章中，我们检查了子字符串函数\
  \ `str.substr(pos, len)`。我们当时说如果 `pos` 太大，程序将带有错误消息终止。实际上发生的是抛出一个 `out_of_range`\
  \ 异常；如果未被捕获，程序将终止。如果你尝试构造一个长度大于 `string::npos` 的字符串，则抛出 `length_error` 异常。现在我们足够捕获并处理这些异常了：\n\
  \n```\n![定义函数 Some Func](img/9781284166033_CH16_P1003.jpg)\n```\n\n描述\n\n这两个异常都定义在\
  \ `<stdexcept>` 头文件中，使用它们的程序必须包含该头文件。\n\n我们只查看了两个异常类来让你了解它们的工作原理。标准库的完整描述可以写满一本书，因此我们在这里没有涵盖其他的。当你扩展对其功能的使用时，将需要在库文档中检查异常信息。\n\
  \n异常类的层次结构也影响我们如何排列 catch 子句。catch 子句中的异常基类匹配其任何子类以及其自身。因此，当使用 `try-catch` 捕获异常类层次结构中的异常时，catch\
  \ 子句的顺序应该是让低层次的子类在前，最高层次的类在最后。\n\n\n\n\n在本节中，我们将介绍如何使用面向对象的技术来组织代码，使其更具可维护性。我们将创建继承自\
  \ Qt 框架类的自定义部件（widgets），这些部件将代表 GUI 中的主要组件。GUI 和实现它的类将取代“飞机重量与平衡”案例研究中的 `UserInterface`\
  \ 类。\n\n与之前的控制台应用程序一样，我们仍然计算飞机的总重量和重心。我们需要通过记录乘客和机组人员的信息来建立飞行清单（flight manifest），并以此此判断飞机载荷是否符合飞行条件。我们将记录乘客的姓名、体重、行李重量，以及他们在飞行期间所在的座位号。此外，我们还将记录每位机组人员的名字和重量、储物室的重量，以及燃料的总加仑数。所有这些信息都需要\
  \ GUI 部件，以便机组人员方便地办理乘客和人员的手机。我们还希望充分利用 GUI 的功能，在系统记录乘客时，显示乘客、机组人员以及飞机总重量和重心的运行总计。\n\
  \n在图 16.3 中，我们可以看到主要 GUI 组件的简单草图。我们在顶部使用一个输入表单用于乘客和机组人员信息。随后是两个用于显示乘客和机组清单的表格。下方是一个较小的表单，用于输入储物室重量和燃料加仑数。底部是显示总重量和重心的消息。图中的每个组件将由一个自定义部件实现，其中包含标签、文本框、表格和按钮等其他部件。这些自定义部件将通过布局（layout）组合进窗口并渲染到屏幕上。\n\
  \n![主要 GUI 组件草图。](img/9781284166033_CH16_FIGF03.jpg)\n\n图 16.3 主要 GUI 组件\n\n描述\n\
  \n## 乘客清单部件\n\n我们从乘客和机组清单表格开始，因为它们是最容易实现的部件。乘客清单由 `PassengerManifestWidget` 实现。以下是它的类规范：\n\
  \n![乘客清单部件类的定义。](img/9781284166033_CH16_P1026.jpg)\n\n描述\n\nQt 框架中有许多基类可以用于实现部件。我们使用\
  \ `QWidget` 是因为它是最通用的类，也是你在其他基于 Qt 的应用程序中经常会遇到的类。要使用 `QWidget`，我们需要包含 `QtWidgets`\
  \ 头文件。虽然我们可以只包含 `QWidget`，但 `QtWidgets` 头文件非常方便，因为它让我们能够访问所有的 Qt 部件，而无需为需要的每个部件都编写一个\
  \ `#include`。它还让我们能够使用 `Q_OBJECT` 宏。\n\n`PassengerManifestWidget` 类有一个公共构造函数和一个方法。当我们实例化此类时，构造函数会接收一个指向\
  \ `QWidget` 对象的指针，该对象代表父部件。由于 `QWidget` 基类的构造函数需要此参数，因此子类也必须提供它。拥有父部件指针的原因超出了本文的讨论范围。然而，值得提到，这对于正确渲染\
  \ GUI 以及处理事件传递给已注册的事件处理程序是必须的。该构造函数参数的默认值为 `nullptr`，表示它没有父部件。\n\n该类还定义了 `AddPassenger`\
  \ 方法，其参数包含了乘客所需的信息，包括名、姓、座位行、体重和行李重量。这些参数将用于填充表格中的新行并渲染到屏幕上。表格是使用 Qt 提供的名为 `QTableWidget`\
  \ 的部件实现的。我们还声明了一个名为 `rowCount` 的整数，用于跟踪下一个表格行索引。\n\n该类的实现开始于包含规范头文件。接下来是构造函数：\n\n\
  ![乘客清单部件的定义。](img/9781284166033_CH16_P1027.jpg)\n\n描述\n\n构造函数创建一个标签以便在主窗口中标识此部件。`rowCount`\
  \ 被设置为 0，因为新构建的清单是空的。然后我们创建一个名为 `table` 的新 `QTableWidget` 对象。我们将表格的列数设置为四，以便显示乘客的姓名、行、体重和行李重量。然后我们将表格的行数设置为当前的\
  \ `rowCount`。为了解释表格数据，我们在列上方包含了表头标签。`QStringList` 仅仅是 `QString` 对象的列表，某些 Qt 部件用它维护字符串列表。\n\
  \n完成后，我们将部件安排在垂直布局（vertical layout）中进行渲染。这就是在 Qt 中组装自定义部件所需的所有工作。我们不仅可以在此应用程序中使用该部件，还可以将其用于其他需要乘客清单组件的部件/窗口。例如，我们可以为飞机到达时的情景编写一个类似的应用程序，作为下机流程的一部分。此类应用程序可能在其用户界面中需要一个飞行清单。\n\
  \n内部部件就绪后，我们添加乘客数据：\n\n![乘客清单](img/9781284166033_CH16_P1027.jpg)\n\n描述\n\n`AddPassenger`\
  \ 方法通过静态方法将 C++ 字符串和浮点数转换为 `QString`。正如我们在第 15 章中所所示，`QString` 在 Qt 框架中无处不在。向表格添加行需要我们为每条数据创建一个\
  \ `QTableWidgetItem`。接下来，我们在 `rowCount` 指定的位置插入一个新空行，并在相应的列中添加表格项。最后，我们增加行计数。\n\n\
  ## 机组清单部件\n\n机组清单由 `CrewManifestWidget` 定义并实现，性质非常相似，因此我们展示代码而不进行解释。\n\n![机组清单](img/9781284166033_CH16_P1028.jpg)\n\
  \n描述\n\n![机组清单的继续](img/9781284166033_CH16_P1029.jpg)\n\n描述\n\n## 重量与重心部件\n\n另一个容易定义和实现的部件是用于显示重量和重心的组件。以下是它的定义：\n\
  \n![重量与重心部件类的定义。](img/9781284166033_CH16_P1030.jpg)\n\n描述\n\n构造函数类似于 `PassengerManifestWidget`，它接收一个指向\
  \ `QWidget` 的指针作为唯一参数。该类有两个私有变量，我们分别用它们显示总重量和重心。两个命名的公共方法用于设置这些变量。该类的实现并不令人意外：\n\
  \n![重量与重心部件方法的定义。](img/9781284166033_CH16_P1030-1.jpg)\n\n描述\n\n\n\n你会注意到，我们在这个小部件使用了网格布局，这样我们就可以将标识标签放置在用于显示总重量和重心的显示标签旁边。设置成员变量的方法会将每个\
  \ `float` 参数转换为 `QString` 并设置对应标签的文本。\n\n剩余的两个部件并不简单。你可能已经注意到我们还没有处理应用程序的状态（人员列表）或事件（点击按钮），因为这些都由表单部件处理。我们需要一个用于输入乘客和机组信息的表单，另一个用于输入重量和燃料的表单。我们将首先通过一张草图查看表单的样式。**图\
  \ 16.4** 展示了基础设计，包含了我们计划添加到乘客/机组输入表单的每个部件。\n\n除了底部的按钮外，表单的所有部件在左侧都有标签，用于标识右侧部件的作用。上方四个是文本框。接下来两个是下拉框，允许用户从图中列出的选项中选择。最后，我们有一个按钮，用于将表单信息添加到应用程序的状态和乘客或机组成表中。\n\
  \n我们还希望根据乘客类型禁用某些表单元素。乘客需要在表单中输入所有信息。然而，机组人员有预分配的座位，如果他们有行李，将会显示。因此，当乘客类型下拉框设置为“机组（Crew）”时，我们需要禁用那些表单输入部件。最后，除非所有必需字段都不为空，否则表单无法提交。\n\
  \n### 乘客表单通信\n\n乘客表单必须与程序的其他对象通信。为了添加乘客，它必须访问 `Aircraft` 对象。它还需要向表中信息，这需要与 `PassengerManifestWidget`\
  \ 和 `CrewManifestWidget` 进行通信。最后，在添加乘客或机组人员后，`Aircraft` 对象中的总重量和重心将更新，并传递给 `WeightAndCofGWidget`\
