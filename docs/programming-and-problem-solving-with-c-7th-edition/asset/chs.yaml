  描述\n\n这是最后一个示例。假设我们要统计某些文本中字符出现的次数。我们可以设置一个具有 26 个元素的数组，其中每个元素都是字母表中一个大写或小写字母的计数器。由于\
  \ `char` 的值是整数，因此它可以作为索引。但 ‘A’ 的值不是 0。我们如何使用它来索引数组的第一个元素呢？\n\n回想一下，在 ASCII（或 Unicode）中，大写字母是有序的，小写字母也是。如果我们从任何大写字母中减去\
  \ ‘A’，就能得到该字母在排序中的位置。同样，如果我们从任何小写字母中减去 ‘a’，就能得到它在排序中的位置。\n\n![带有 26 个组件的计数数组](img/9781284166033_CH11_FIGF11_7.jpg)\n\
