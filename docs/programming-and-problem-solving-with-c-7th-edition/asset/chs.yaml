  \ For 语句。假设我们在程序的其他部分向 `line` 数组读取数据。让我们使用如下 While 语句：\n\n![一个 while 语句。](img/9781284166033_CH11_P651-4.jpg)\n\
  \n描述\n\n这段代码看起来很合理，但如果一行超过了 100 个字符呢？在读取第百个字符并将其存数组后，循环继续执行。字符被存储在数组之外的位置，覆盖了其他数据值（甚至是程序的指令！）。\n\
  \n这个故事的教训是：在处理数组时，密切注意循环终止条件。始终问自己在处理完最后一个数组组件后循环是否还会继续。\n\n每当数组索引越界时，你的第一个怀疑应该是循环没有正常终止。第二个检查的是任何基于输入数据或计算的数组访问。当数组索引作为数据输入时，数据验证检查是绝对必要的。\n\
  \n### 复杂结构\n\n正如我们在本章和上一章的许多示例中所演示的那样，数据结构可以以各种方式组合：包含结构体的结构、包含数组的结构、包含结构体的数组、包含数组的数组（多维数组）等。当数组和结构结合时，元素选择运算符（`[]`）和结构成员选择运算符（`.`）的位置可能会引起困惑。\n\
  \n为了总结这些运算符的正确位置，让我们使用在本章早些时候引入的 `StudentRec` 类型：\n\n![一个结构声明。](img/9781284166033_CH11_P659-2.jpg)\n\
  \n描述\n\n\n\n那么，选择学生第一个考试成绩的语法是什么（即，选择 `student` 成员 `examScore` 的第 0 个元素）？点运算符 `.`\
  \ 是二元（两个操作数）运算符；其左操作数是一个结构体变量，右操作数是成员名：\n\n![表达式。](img/9781284166033_CH11_P662-3.jpg)\n\
  \n描述\n\n`[]` 运算符是一个一元（一个操作数）运算符；它紧跟在表示数组的表达式之后：\n\n![表达式。](img/9781284166033_CH11_P662-4.jpg)\n\
  \n描述\n\n因此，表达式\n\n`student`\n\n表示一个结构体变量；表达式\n\n![表达式。](img/9781284166033_CH11_P663-1.jpg)\n\
  \n描述\n\n表示一个数组；表达式\n\n![表达式。](img/9781284166033_CH11_P663-2.jpg)\n\n描述\n\n表示一个整数——位于\
  \ `student.examScore` 数组中第 0 个元素上的整数。\n\n对于结构体数组或类对象数组，你必须再次确保 `[]` 和 `.` 运算符处于正确的位置。给定声明\n\
  \n![表达式。](img/9781284166033_CH11_P663-3.jpg)\n\n描述\n\n我们可以通过以下表达式访问 `gradeBook`\
  \ 数组第一个元素的 `gpa` 成员：\n\n![表达式。](img/9781284166033_CH11_P663-4.jpg)\n\n描述\n\n索引 `[0]`\
  \ 附加在数组标识符 `gradeBook` 上。此外，表达式\n\n![表达式。](img/9781284166033_CH11_P663-5.jpg)\n\n\
  描述\n\n表示一个结构体，因此点运算符选择了该结构体的 `gpa` 成员。\n\n### 多维数组\n\n在处理多维数组时犯的错误通常分为大类：索引表达式顺序错误和索引范围错误。\n\
  \n假设我们要扩展摇滚乐队程序以容纳 10 个摇滚乐队和 4 个级别。让我们声明 `votes` 数组为\n\n![表达式。](img/9781284166033_CH11_P663-6.jpg)\n\
