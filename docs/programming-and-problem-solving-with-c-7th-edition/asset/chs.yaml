  \n### 返回函数值\n\n到为止，我们一直在使用枚举类型来计算值。现在让我们让它们作为返回类型吧。\n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\nC++ 中结构化类型的一个示例是 `string` 类，它用于表示字符串。当你声明一个类型为\
  \ `string` 的变量 `myString` 时，`myString` 并不仅仅代表一个原子数据值；而是代表一组字符的集合。尽管如此，字符串中的每个组件都可以通过如\
  \ `myString.at(3)` 这样的表达式单独访问，该表达式访问位置 3 处的 `char` 值。\n\n简单数据类型（包括内置和用户定义）是结构化类型的构建块。结构化类型汇集了一组组件值并通常对它们实施某种排序（参见**图\
  \ 10.2**）。访问结构化类型组件的方法取决于组件是如何排列的。\n\n**图 10.3** 显示了 C++ 中提供的结构化类型。此图是图 3.1 中完整图表的一部分。\n\
  \n![C++ 中可用的原子和结构化数据类型的表示](img/9781284166033_CH10_FIGF02.jpg)\n\n图 10.2 原子（简单）和结构化数据类型\n\
  \n描述\n\n![列出 C++ 中结构化数据类型的树图](img/9781284166033_CH10_FIGF03.jpg)\n\n图 10.3 C++ 结构化类型\n\
  \n描述\n\n本章将讨论 `struct` 和 `union` 数据类型。数组将在第 11 章](#9781284166033_CH11.xhtml)中介绍；类是第\
  \ 12 章的主题。\n\n## 10.4 记录 (Structs)\n\n在计算机科学中，`record`（记录）是一种异构结构化数据类型。我们所说的“异构”是指记录的各个组件可以是不同的数据类型。每个组件被称为记录的一个\
  \ `field`（字段），每个字段都被赋予一个 `field name`（字段名）。C++ 在记录方面使用它自己的术语。记录是一种称为 `struct` 的结构，记录的字段称为\
  \ `struct` 的 `members`（成员），每个成员都有一个 `member name`（成员名）。^(1)\n\n在 C++ 中，记录数据类型最常用以下语法声明：\n\
  \n![Struct 声明的语法。变量中的单词已合并。第 1 行：struct，TypeName。第 2 行：左大括号。第 3 行：缩进三次，成员列表。第 4\
  \ 行：右大括号，分号。](img/9781284166033_CH10_570.jpg)\n\n其中 `TypeName` 是一个为数据类型命名的标识符，而\
  \ `MemberList` 定义为：\n\n![成员列表的语法。变量中的单词已合并。第 1 行：数据类型，成员名，分号。第 2 行：数据类型，成员名，分号。第\
  \ 3 行：点。第 4 行：点。第 5 行：点。](img/9781284166033_CH10_570a.jpg)\n\n保留字 `struct` 是 `structure`\
  \ 的缩写。因为 `structure` 一词在计算机科学中有许多其他含义，我们将使用 `struct` 或 `record` 以避免对我们所指代的内容产生混淆。\n\
  \n你可能会注意到成员列表的语法类似于一系列变量声明。请注意：`struct` 声明是在定义一种新数据类型。类型声明不会分配内存。一旦定义了类型，我们就可以声明该类型的变量。每个这样的变量随后都会为其完整的成员集分配内存。让我们来看一个将邮寄地址部分组合在一起的示例：\n\
  \n![将邮寄地址部分组合的代码](img/9781284166033_CH10_571.jpg)\n\n描述\n\n`MailingAddress` struct\
  \ 有四个成员，分别代表街道地址、城市、州和邮政编码。注意，每个成员都被赋予了一个类型。此外，在 `struct` 内部成员名必须是唯一的，就像变量名在块内部必须唯一一样。\n\
  \n`MailingAddress` 类型的指定了该类型变量将具有的形式。当我们定义一个类型为 `MailingAddress` 的变量时，C++ 编译器为它的四个成员分配空间。如果我们定义另一个\
  \ `MailingAddress` 变量，它将单独为其成员分配空间。\n\n注意，在这个示例和语法模板中，`struct` 声明都以分号结束。这似乎与在复合语句（块）右大括号后不加分号的规则冲突。然而，成员列表并不是复合语句；`struct`\
  \ 声明是一种类型声明。让我们来看一个将邮寄地址部分组合在一起的示例：\n\n```cpp\nstruct MailingAddress {\n    string\
  \ street;\n    string city;\n    string state;\n    int zipCode;\n};\n```\n\n（注：由于提供的原始文本存在大量重复，译文已根据核心内容进行了去重整理。）\n\
  \n\n\n\n这是一个使用这些成员选择器的示例。以下函数接收一个 `StudentRec` 结构体作为参数；累加程序、测验成绩和期末考试成绩；并返回一个字母等级作为结果：\n\
  \n![带有成员选择器的代码。](img/9781284166033_CH10_573.jpg)\n\n描述\n\n### 结构体的聚合操作\n\n除了访问 `struct`\
  \ 变量的单个组件外，在某些情况下，我们还可以使用`聚合操作`。聚合操作是将整个 `struct` 视为一个整体进行处理的操作。\n\n下表总结了 C++ 对\
  \ `struct` 变量支持的聚合操作：\n\n| 聚合操作 | 结构体支持？ |\n| :--- | :--- |\n| I/O | 否 |\n| 赋值 |\
  \ 是 |\n| 算术 | 否 |\n| 比较 | 否 |\n| 参数传递 | 是，按值或按引用传递 |\n| 作为函数的返回值 | 是 |\n\n根据该表，一个\
  \ `struct` 变量可以赋值给另一个。然而，这两个变量都必须声明为相同的类型。例如，给定的声明如下\n\n![一个声明。变量中的单词已合并。第 1 行：Student\
  \ Rec, student, 分号。第 2 行：Student Rec, another Student, 分号。](img/9781284166033_CH10_574a.jpg)\n\
  \n该语句\n\n![一个语句。another Student 等 student, 分号。](img/9781284166033_CH10_574b.jpg)\n\
  \n将 `struct` 变量 `student` 的整个内容逐成员地拷贝到变量 `anotherStudent` 中。\n\n相比之下，不支持聚合算术操作和比较（主要是因为它们没有意义）：\n\
  \n![两行不支持的算术操作和比较代码。](img/9781284166033_CH10_574c.jpg)\n\n描述\n\n此外，不支持聚合 I/O：\n\n\
  ![一行不支持的代码。c 在两个左尖括号内 student, 分号, 两个正斜杠，不允许。](img/9781284166033_CH10_574d.jpg)\n\
  \n我们必须一次一个成员地输入或输出 `struct` 变量：\n\n![代码片段。](img/9781284166033_CH10_574e.jpg)\n\n\
  描述\n\n注意，整个 `struct` 可以作为参数传递，如函数示例所示。我们对参数 `aStudent` 使用了按值传递，因为我们不需要更改参数中的任何字段。如果我们需要这样做，就会将其作为引用参数传递。`struct`\
  \ 也可以由返回返回值的函数返回。\n\n让我们定义另一个接收 `StudentRec` 变量作为参数的函数。该函数将判断学生某门课程的成绩是否与其整体 GPA\
  \ 一致。我们定义 `consistent` 意味着课程成绩与舍入后的 GPA 相对应。GPA 基于一个量表，其中 A 是 4，B 是 3，C 是 2，D 是\
  \ 1，F 是 0。例如，如果舍入后的 GPA 是 4 且成绩是 A，则函数返回 `true`。如果舍入后的 GPA 是 4 且成绩不是 A，则函数返回 `false`。\n\
  \n`Consistent` 函数所示。类型为 `StudentRec` 的参数 `aStudent` 再次按值传递。\n\n![带有 Consistent 函数的程序代码。](img/9781284166033_CH10_575.jpg)\n\
  \n描述\n\n### 关于结构体声明的更多\n\n在对 C++ 结构体的初步了解的基础上，这里有一个更完整的 `struct` 声明语法模板：\n\n![结构体声明的语法。变量中的单词已合并。第\
  \ 1 行：struct, Type Name。第 2 行：左大括号。第 3 行：缩进三次，成员列表。第 4 行：右大括号，变量列表，分号。](img/9781284166033_CH10_575a.jpg)\n\
  \n正如模板所示，有两个项目是可选的：`TypeName`（正在声明的 `struct` 类型的名称）和 `VariableList`（右大括号和分号之间的变量名列表）。变量列表允许你在一个语句中声明\
  \ `struct` 类型并声明该类型的变量。例如，你可以以更紧凑的形式编写声明\n\n![带有变量列表的语句。](img/9781284166033_CH10_575b.jpg)\n\
  \n描述\n\n形式如下\n\n![带有变量列表的语句。](img/9781284166033_576.jpg)\n\n描述\n\n### 绑定相似项\n\n\
  当数据明显相关时，它们应该被收集到一个记录中。例如，一个名字由名、中间名和姓组成。与其将这些值分开存储，不如将它们绑定到一个记录中。\n\n## 10.5 层次级记录\n\
  \n我们已经见过记录组件是简单变量和字符串的示例。记录的组件也可以是另一个记录。\n\n让我们来看一个适用于层次级结构的示例。假设一家小型加工厂对其每台机器保留信息。这些信息包括基本信息，如机器编号、购买日期和成本。它们还包括统计信息，例如停机天数、故障率和最后维修日期。表示所有信息的合理方法是什么？首先，让我们看一个存储这些信息的平化（非层次级）记录结构。\n\
  \n![带有平化结构的程序。](img/9781284166033_CH10_579.jpg)\n\n描述\n\n`MachineRec` 类型有 11 个成员。这里有这么多详细信息，很难快速感觉到该记录代表什么。我们可以将其重新组织为更有意义的层次级结构。让我们将信息分为两组：变化的信息和不变的信息。这里还有两个日期记录：购买日期和最后维修日期。这些观察建议使用描述日期的记录、一个描述统计数据的记录，以及一个包含另外两个作为组件的整体记录。以下类型声明反映了这种结构。\n\
  \n![带有层次级结构的程序代码。](img/9781284166033_CH10_580.jpg)\n\n描述\n\n\n\n`machine` 记录的内容现在更加清晰了。类型为\
  \ `MachineRec` 的两个组件本身就是 `struct`：`purchaseDate` 是 `Date` 类型的 `struct`，而 `history`\
  \ 是 `Statistics` 类型的 `struct`。而 `Statistics` 类型的 `struct` 的其中一个组件又是一个 `Date` 类型的\
  \ `struct`。\n\n我们如何访问像这样的层级结构的组件呢？我们从 `struct` 变量名开始，从左到右为嵌入 `structs` 的成员构建访问表达式（成员选择器）。这里是一些表达式以及它们访问的组件：\n\
  \n| 表达式 | 访问的组件 |\n| :--- | :--- |\n| `machine.purchaseDate` | `Date struct` 变量\
  \ |\n| `machine.purchaseDate.month` | `Date struct` 变量的 `month` 成员 |\n| `machine.purchaseDate.year`\
  \ | `Date struct` 变量的 `year` 成员 |\n| `machine.history.lastServiced.year` | 包含在 `Statistics`\
  \ 类型 `struct` 中的 `Date struct` 变量的 `year` 成员 |\n\nFIGURE 10.6 是带有值的 `machine` 的直观表示。仔细观察每个组件是如何访问的。\n\
  \n![带有值的 machine 直观表示。](img/9781284166033_CH10_FIGF06.jpg)\n\nFIGURE 10.6 `machine`\
  \ 变量中的层级记录\n\n描述\n\n## 10.6 Unions\n\n在图 10.3 中，我们展示了一张显示 C++ 可用的四种结构化类型的图。我们已经讨论了\
  \ `struct` 类型，现在简要介绍一下 `union` 类型。\n\n在 C++ 中，`union` 被定义为在程序执行期间仅持有其一个成员的 `struct`。这里是一个\
  \ `union` 类型和一个 `union` 变量的声明：\n\n![union 类型和 union 变量的声明。](img/9781284166033_CH10_581.jpg)\n\
  \n描述\n\n声明 `union` 类型的语法与我们之前展示的 `struct` 类型语法相同，区别在于用 `union` 单词替换了 `struct`。\n\
  \n在运行时，分配给变量 `weight` 的内存并不包括包含三个组件的空间。相反，`weight` 只能包含以下内容之一：一个 `long` 值、或者一个 `int`\
  \ 值，或者一个 `float` 值。这种 `union` 对于一个存储可能以盎司、磅或吨计的重量值的程序非常有用，因为每种单位都需要不同的数据类型。`union`\
  \ 的目的是通过允许不同类型的值在不同时间使用同一内存空间来节省内存。以下代码显示了如何使用 `weight`：\n\n![关于如何使用 weight 的代码。](img/9781284166033_CH10_582.jpg)\n\
  \n描述\n\n在最后一条赋值语句之后，之前的 `float` 值 4.83 消失了，被 `int` 值 35 取代。\n\n有人可能会认为 `union` 不是数据结构。它不代表值的集合；它代表的是几个潜在值中的一个单一值。尽管如此，由于与\
  \ `struct` 的相似性，`union` 在 C++ 中被与结构化类型归为类。\n\n关于 `union` 还有很多可以说的，包括与其声明和用法相关的细微问题。然而，这些问题在数据结构和系统编程的高级研究中更为合适。我们在这里引入\
  \ `union` 仅仅是为了完成 C++ 结构化类型的完整蓝图，并让你熟悉其基本概念，以防你在其他 C++ 程序中遇到 `union`。\n\n在之前的章节中，我们查看了\
  \ C++ 中可用的简单类型和结构化类型。现在我们只剩下两个内置数据类型需要涵盖：`指针类型`和`引用类型`（参见 FIGURE 10.7）。这些是简单数据类型，但在图\
  \ 10.7 中，我们将它们与其它简单类型分开列出，因为它们的用途非常特殊。我们将指针类型和引用类型称为 `地址类型`。\n\n![列出 C++ 中数据类型的树图。](img/9781284166033_CH10_FIGF07.jpg)\n\
  \nFIGURE 10.7 C++ 数据类型\n\n描述\n\n这些类型之一的变量不包含数据值；它包含另一个变量或结构的内存地址。地址类型有两个主要目的：它们可以使程序更高效——无论是在速度方面还是内存使用方面——并且它们可以用于构建复杂的数据结构。我们在这里强调的是后者。\n\
  \n## 10.7 Pointers\n\n指针正如其名所示：即告诉去哪里寻找其他东西的变量。也就是说，指针包含其他变量的地址或位置。从技术上讲，`指针类型`\
  \ 是由一组无界值组成的简单数据类型，每个值都指向给定类型变量的位置。\n\n### 指针变量\n\n通过查看 C++ 中如何声明指针变量来开始讨论。令人惊讶的是，声明时并没有使用“pointer”一词，而是使用\
  \ `*` 号。\n\n![指针的声明。](img/9781284166033_CH10_583.jpg)\n\n描述\n\n这种语法模板显示了两种形式，一种用于单个变量，另一种用于多个变量。在第一种形式中，编译器不在乎星号放在类型的右侧还是变量名的左侧。根据语法模板，如果你在一条语句中声明多个变量，只有第一个会被视为指针；其他的不是。为了避免意外错误，最安全的方法是单独声明每个指针变量。\n\
  \n以下是两种等效声明：\n\n![等效声明。1: int *intPtr; 2: int*intPtr;](img/9781284166033_584.jpg)\n\
  \n我们可以通过一元运算符 `&`（称为地址运算符）让 `intPtr` 指向 `beta`。在运行时，赋值语句获取 `beta` 的内存地址并将其存入 `intPtr`。\n\
  \n![赋值语句。Int P t r = &beta;](img/9781284166033_CH10_584b.jpg)\n\n或者，我们可以在声明时初始化\
  \ `intPtr` 如下：\n\n![声明如下。行 1: int beta; 行 2: int *intPtr = &beta;](img/9781284166033_CH10_584c.jpg)\n\
  \n假设 `intPtr` 和 `beta` 分别位于内存地址 5000 和 5008。那么将 `beta` 的地址存入 `intPtr` 将导致如 [FIGURE\
  \ 10.8] 所示的关系。\n\n![将 beta 的地址存入 int P t r 的图示。](img/9781284166033_CH10_FIGF08.jpg)\n\
