  \ Images.\n\n## 第 14 章\n\n### 动态数据与链表\n\n在第 10 章中，我们查看了指针类型和引用类型。其中一种类型的变量不包含数据值；它包含一个值的内存地址。我们专注于理解如何创建和操作指向\
  \ C++ 程序中定义的静态数据的指针。然而，指针的真正威力在引入动态数据后变得显而易见了。动态数据允许程序对没有预定义大小和生命周期的数据结构进行操作。动态数据结构可以在程序执行过程中增长和缩小，为在时间和空间上的高效性提供了灵活性。我们在这里通过学习链表动态数据结构，重点强调了动态数据的创建和操作。\n\
  \n## 14.1 动态数据\n\n在第 9 章中，我们描述了 C++ 中的两类程序数据：静态数据和自动数据。任何全局变量都是静态的，显式声明为 `static`\
  \ 的局部变量也是如此。静态变量的生命周期是整个程序的生命周期。相比之下，自动变量（未声明为 `static` 的局部变量）在控制到达其声明处时分配（创建），在控制退出变量声明所在的块时被释放（销毁）。\n\
  \n在指针的帮助下，C++ 提供了第三类：`动态数据`。动态变量不是通过普通声明声明的；相反，它们在执行时通过两个特殊运算符 `new` 和 `delete`\
  \ 显式地分配和释放。当程序需要额外的变量时，它使用 `new` 分配变量。当程序不再需要该变量时，它使用 `delete` 将其释放。因此，动态变量的生命周期是执行\
  \ `new` 到执行 `delete` 之间的时间。在执行时创建新变量的优势显而易见：当数据结构的性质允许其增长和缩小时，我们可以完美地使内存分配匹配任何需求。\n\
  \n### 分配动态数据\n\n`new` 操作有两种形式，一种用于分配单个变量，另一种用于分配数组。以下是语法模板：\n\n![标记为分配表达式的语法。](img/9781284166033_CH14_P820-1.jpg)\n\
  \n描述\n\n第一种形式用于创建类型为 `DataType` 的单个变量。第二种形式创建一个元素类型为 `DataType` 的数组；所需的数组元素数量由 `IntExpression`\
  \ 指定。\n\n这里是一个展示了 `new` 操作两种形式的示例：\n\n![一组带有解释的代码。](img/9781284166033_CH14_P821-1.jpg)\n\
  \n描述\n\n通常情况下，`new` 运算符做两件事：它创建一个指定类型的未初始化变量（或数组），并返回该变量的地址（或数组的基地址）。正是这个地址被存储在指针变量中。然而，如果计算机系统没有足够的空间来存储动态数据，程序将带错误消息终止。在第\
  \ 16 章中，我们展示了如何测试这种条件并防止程序终止。\n\n由 `new` 创建的变量被称为位于`空闲存储`（或`堆`）上，这是为动态变量预留的内存区域。`new`\
  \ 运算符从空闲存储获取一块内存，正如我们将看到的，`delete` 运算符将其返回到空闲存储。\n\n动态变量是无名的，不能直接寻址。相反，必须通过 `new`\
  \ 运算符返回的指针间接寻址。以下是创建动态数据然后通过指针访问数据的示例：\n\n![一个代码片段。](img/9781284166033_CH14_P821-2.jpg)\n\
  \n描述\n\n**图 14.1** 显示了执行此代码段后的内存情况。注意 `patientPtr` 指向的结构体的内容。\n\n```\n// patientPtr\
  \ points to the struct\n```\n\n（patientPtr 指向结构体)\n\n![标记为指针、指向变量的图。](img/9781284166033_CH14_01.xhtml_c14-fig14-1)\
  \ (注：此处文本描述了图片)\n\n### 删除动态数据\n\n动态数据在不再需要时应该被销毁。内置的 `delete` 运算符用于销毁动态变量。`delete`\
  \ 操作有两种形式：一种用于单个变量，另一种用于数组。\n\n![标记为释放的语法。](img/9781284166033_CH14_P822-1.jpg)\n\
  \n描述\n\n使用之前的示例，我们可以通过以下语句释放 `intPtr`、`patientPtr` 和 `patientArray` 所指向的动态数据：\n\n\
  ![带有解释的三个代码。](img/9781284166033_CH14_P821-2.jpg)\n\n描述\n\n执行这些语句后，`intPtr`、`patientPtr`\
  \ 和 `patientArray` 指向的值是未定义的；即它们可能仍然包含已释放的数据。\n\n在使用 `delete` 运算符时，你应该记住以下两个规则：\n\
  \n1. 对 `NULL` 指针应用 `delete` 无害；该操作不会产生影响。\n2. 除规则 1 外，`delete` 运算符只能应用于之前从 `new`\
  \ 运算符获取的指针值。\n\n记住第二个规则非常重要。如果你将 `delete` 应用于不在空闲存储中的任意内存地址，结果将是未定义的，并且可能非常糟糕。\n\
  \n`new` 运算符让你只在需要时创建变量。当你完成对动态变量的使用时，应该 `delete` 它。在不再需要时保留动态变量是适得其反的，这种情况被称为内存泄漏。如果内存泄漏发生得频繁，你可能会耗尽内存。让我们来看另一个使用动态数据的示例。\n\
  \n![一个代码片段。](img/9781284166033_CH14_P823-2.jpg)\n\n以下是对每条语句影响的更详细描述：\n\n\n\n\n\n\
  ![带有解释的 6 个语句。](img/9781284166033_CH14_P823-3.jpg)\n描述\n![一个图表解释了代码段的结果。](img/9781284166033_CH14_FIGF14_2AB.jpg)\n\
  描述\n\n## 图 14.2A 和 B 示例代码段的结果\n\n在图 14.2D 中，注意在赋值语句之前，`ptrl` 指向的变量仍然在那里。然而，无法访问它，因为没有指针指向它。这个孤立的变量被称为`不可访问对象`（inaccessible\
  \ object）。在空闲存储（free store）上留下不可访问对象应该被视为逻辑错误，它是内存泄漏的原因。\n\n同时注意，在图 14.2E 中，`ptrl`\
  \ 现在指向一个原则上已不再存在的变量。我们称 `ptrl` 为`悬空指针`（dangling pointer）。如果程序以后对 `ptrl` 进行解引用，结果将是不可预测的。指向的值可能仍然原始值（44），也可能是如果空闲存储中的该空间已被重用，存储在那的不同值。\n\
  \n在图 14.2E 中显示的两种情况——不可访问对象和悬空指针——可以通过在将 `ptr2` 赋值给 `ptrl` 之前释放 `ptr1`，以及在释放 `ptr2`\
  \ 后将 `ptrl` 设置为 `NULL` 来避免。\n\n![一个代码片段。](img/9781284166033_CH14_P824-1.jpg)\n描述\n\
  ![一个图表解释了代码段的结果。](img/9781284166033_CH14_FIGF14_2CD.jpg)\n描述\n\n## 图 14.2C, D, 和\
  \ E 示例代码段的结果\n\n![带有注释行的代码片段。](img/9781284166033_CH14_P825-1.jpg)\n描述\n\n### 常量与动态数据\n\
  \n还有另一种避免不可访问对象的方法。正如 C++ 允许我们定义其他类型的常量一样，指针也可以被设为常量。在下面的声明中，`patientPtr` 是一个常量指针，初始化为动态内存位置的地址，该位置表示一个类型为\
  \ `PatientRec` 的结构体：\n\n![声明语句。Patient R c 星号, const, patient t r, 等号, new R e,\
  \ 分号。](img/9781284166033_CH14_P825-2.jpg)\n\n一旦执行此代码，`patientPtr` 将始终指向相同的位置。我们可以通过解引用\
  \ `patientPtr` 来更改存储在该位置的值，但我们不能为 `patientPtr` 赋新值；也就是说，我们不能让它指向另一个地方。结果是，它指向的位置永远不会变得不可访问。当我们对常量指针应用\
  \ `delete` 时，可以确信删除的是原始分配的内容，从而防止内存泄漏。\n\n![一个图表解释了代码段的结果。](img/9781284166033_CH14_FIGF14_3.jpg)\n\
  描述\n\n### 图 14.3 修改后的示例代码段结果\n\n在下一节中，我们将查看指针的另一种形式。\n\n## 14.2 顺序结构与链式结构\n\n正如我们在第\
  \ 13 章中指出的，计算中的许多问题涉及项目列表。在那一章中，我们使用数组实现了 `List` ADT。数组的大小是固定的，但列表中的项目数量是变化的。\n\n\
  如果我们实现的列表是排序列表，那么使用数组表示可以使某些操作变得更高效。例如，搜索特定值可以使用二分查找。然而，使用数组表示在排序列表中插入和删除项目是低效的。要插入新项目，我们必须移动数组元素以腾出空间（参见图\
  \ 14.4）。同样，从列表中删除项目需要移动元素。由于频繁发生插入和删除，链表是更好的表示方法：链表是节点的集合，每个节点都有指向其继者的显式连接。链表并不要求位于连续内存位置。它通常由两个成员组成：\n\
  \n*   `data` 成员，包含值\n*   `link` 成员，指向下一个节点\n\n![插入值 25 之前的数组和插入值 25 之后的数组](img/9781284166033_CH14_FIGF14_4.jpg)\n\
  描述\n\n### 图 14.4 排序列表顺序表示\n\n![矩形被包含在单块中。](img/9781284166033_CH14_FIGF14_5.jpg)\n\
  描述\n\n### 图 14.5 链表\n\n图 14.5 显示了链表的抽象图表。链表的 link 成员用于指示下一个节点。最后一个节点的 link 成员中的\
  \ `/` 表示列表的结束。我们通过一个指向第一个节点的指针变量访问列表；该指针被称为`外部指针`。该变量不在列表内部；其作用是提供第一个节点的位置。在图 14.5\
  \ 中，标识符 `head` 有时用于外部指针。![带有两列的表格。](img/9781284166033_CH14_P828-1.jpg)\n描述\n\n当你观察图\
  \ 14.5 时，你应该观察到两点。首先，我们刻意将节点安排在随机位置。这样做是为了强调链表中的项目并不在相邻的内存中（正如图 14.4 中的数组表示所示）。其次，当你看到图中的箭头时，你可能已经想到了指针——你是正确的。\n\
  \n## 14.3 创建动态链表：示例演练\n\n在本节中，我们将走一遍一个示例链表的创建过程，以便了解其工作原理。我们将列表表示为从空闲存储中动态分配节点的链式结构；每个节点的\
  \ link 成员包含下一个节点的内存地址。我们通过一个指向第一个节点的指针变量访问列表；该指针在图 14.5 中命名为 `head`，被称为`外部指针`或`头指针`。这种列表随着程序的执行可以扩展或缩小。要向列表中插入新项目，我们从空闲存储中分配更多空间。要删除一个项目，我们释放分配给它的内存。\n\
  \n\n\n\n让我们来看看如何使用 C++ 指针变量来创建一个包含 `float` 值的动态链表。我们从以下声明开始：\n\n![代码片段。](img/9781284166033_CH14_P829-1.jpg)\n\
