  \n描述\n\n### 库函数\n\n某些计算（例如平方根和绝对值）在程序中非常常见。如果每个程序员都必须从零开始创建此类函数，那将是极大的浪费。为了让我们的生活更轻松，每个\
  \ C++ 系统都包含一个标准库——这是一个由预写函数、数据类型和其他可以使用的项目组成的大型集合。库中的函数被分成单独的文件，称为“头文件”。这里是一些标准库函数的一个非常小的示例：\n\
  \n![列出某些函数的表格，详情包括它们所属的头文件、参数类型、结果类型和返回的值。](img/9781284166033_CH03_UTAB115-1.jpg)\n\
  \n描述\n\n从技术上讲，表格中标记为 `float` 的项都应该写为 `double`。这些库函数使用 `double` 精度浮点值执行工作。然而，由于类型强制转换，当你向它们传递\
  \ `float` 值时，这些函数也能正常工作。\n\n使用库函数非常简单。首先，你在程序顶部放置一个 `#include` 指令，并指定相应的头文件。该指令会导致\
  \ C++ 预处理器在你的程序中插入声明，为编译器提供关于该函数的信息。然后，每当你想要使用该函数时，只需进行函数调用。这里有一个调用函数的示例程序及其它的输出：\n\
  \n![演示函数调用的程序。](img/9781284166033_CH03_UFIG115-1.jpg)\n\n描述\n\n输出：\n\n![演示函数调用的程序的输出。](img/9781284166033_CH03_UFIG116-1.jpg)\n\
  \n描述\n\nC++ 标准库提供了几十个函数供你使用。附录 C 列出了比我们这里展示的多得选择。你现在应该简要浏览一下附录，但记住，某些术语和 C++ 语言符号在你阅读了本文的更多内容后才能理解。\n\
  \n### 空函数（Void Functions）\n\n到为止，我们只查看了返回值的函数。事实上，C++ 提供了另一种类型的函数。看下面函数 `CalcPay`\
  \ 的定义。注意它是如何以 `void` 单词开头而不是像 `int` 或 `float` 等数据类型的：\n\n![空函数的格式。](img/9781284166033_CH03_PRE57.jpg)\n\
  \n描述\n\n`CalcPay` 是一个不返回值的函数示例。相反，它只是执行某些操作然后退出。我们将这样的函数称为非返回值函数、空返回函数，或者简短地称为 `void\
  \ function`（空函数）。在某些编程语言中，空函数被称为过程（procedure）。\n\n空函数的调用方式与返回值函数不同。对于返回值函数，函数调用出现在表达式中。而对于空函数，函数调用是一个独立的、单独的语句。在\
  \ `LeapYear` 程序中，`main` 使用类似这样的表达式调用 `IsLeapYear` 函数：\n\n![在表达式中调用的返回值函数。](img/9781284166033_CH03_PRE58.jpg)\n\
  \n描述\n\n相比之下，对空函数的调用更像是一个命令或内置指令：\n\n![对空函数的调用。](img/9781284166033_CH03_PRE59.jpg)\n\
  \n描述\n\n在接下来的几个章节中，我们不会编写自己的函数（`main` 除外）。相反，我们将集中于如何使用现有函数，包括用于流输入输出的函数。其中一些函数是返回值函数；另一些是空函数。再次，我们强调了调用这两类函数方式的区别：对返回值函数的调用发生在表达式中，而对空函数的调用是作为一个独立的语句发生的。\n\
  \n## 3.7 输出格式化\n\n格式化程序的输出意味着控制它在屏幕上的视觉呈现。在第 2 章中，我们考虑了两种输出格式化：创建额外的行和在字符串中放入额外的空格。在本节中，我们将检查如何格式化输出。\n\
  \n### 整数和字符串\n\n默认情况下，整数和字符串值的输出不带空格。如果变量 `i`、`j` 和 `k` 分别包含值 `15`、`2` 和 `6`，则以下输出难以解释：\n\
