  \ Pos，等于，data P t r，分号。第 4 行：右大括号。](img/9781284166033_CH14_P842-2.jpg)\n\n```cpp\n\
  void List::Reset() {\n    currentPos = dataPtr;\n}\n```\n\n### **获取下一个项**\n\n该算法与基于数组的列表实现相同。我们返回\
  \ `currentPtr` 指向节点的内容，然后将 `currentPtr` 指向下一个节点。我们不需要担心引用 `NULL` 指针，因为函数的假设条件规定有一个要返回的项。\n\
  \n![一个代码片段。](img/9781284166033_CH14_P842-3.jpg)\n\n描述\n\n处理完操作责任后，只剩下知识责任需要检查。其中三个非常简单，以至于我们直接显示代码而没有任何解释：\n\
  \n![一个代码片段。](img/9781284166033_CH14_P843-1.jpg)\n\n描述\n\n### **全链表测试**\n\n从理论上讲，链表是不满的。然而，列表可能会非常长，以至于堆内存耗尽无法为\
  \ `new` 运算符提供内存。我们在第 16 章介绍异常时展示如何处理这种情况。在此之前，我们只让函数 `IsFull` 返回 `false`。\n\n![两个语句。](img/9781284166033_CH14_P843-2.jpg)\n\
  \n描述\n\n**搜索列表**\n\n当我们搜索列表以查找项时，实际上已经看到了这个算法。事实上，由于我们要删除一个节点，我们不需要该节点的指针。\n\n![一个代码片段。](img/9781284166033_CH14_P843-3.jpg)\n\
