  \ 个正斜杠，每个组件的类型](img/9781284166033_CH13_P787-2.jpg)![代码片段](img/9781284166033_CH13_P787-3.jpg)\n\
  \n描述\n\n## 13.5 类的有序列表\n\n在第 12 章中，我们为日程创建了一个 `Entry` 类。现在让我们创建一个 `Entry` 对象的有序列表。按什么排序？名称还是时间？因为我们正准备创建一个日程，让我们按时间排序排序。\n\
  \n我们可以直接使用 `SortedList` 类，还是必须进行一些更改？如果列表中的项目可以使用关系运算符进行比较，那么唯一的更改是 `ItemType` 的类型。如果列表中的项目是无法用关系运算符比较的类型，则类必须提供比较运算符。我们的\
  \ `Entry` 类没有比较函数，但我们的 `TimeOfDay` 类有一个：`ComparedTo`。我们可以增强 `Entry` 类，一个 `ComparedTo`\
  \ 函数，它仅仅调用 `TimeOfDay.ComparedTo` 函数。\n\n哪些 `SortedList` 函数因为比较对象而需要更改？`IsThere`、`Insert`\
  \ 和 `Delete` 比较两个对象。首先我们向 `Entry` 类添加 `ComparedTo` 函数。\n\n![程序片段](img/9781284166033_CH13_P790-1.jpg)\n\
