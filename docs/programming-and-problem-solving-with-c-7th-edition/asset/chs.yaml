  \nDescription\n\n## 3.8 额外的字符串操作\n\n现在，我们已经引入了数值类型和函数调用，可以利用字符串数据类型的额外功能了。在本节中，我们将介绍四个操作字符串的函数：`length`、`size`、`find`\
  \ 和 `substr`。\n\n### length 和 size 函数\n\n`length` 函数当应用于字符串变量时，会返回一个无符号整数值，该值等于字符串中当前的字符数。如果\
  \ `myName` 是一个字符串变量，那么调用 `length` 函数的形式如下：\n\n![length 函数。](img/9781284166033_CH03_PRE80.jpg)\n\
  \nDescription\n\n你写下字符串变量名（这里是 `myName`），然后是一个点（句号），紧接着是函数名和参数列表。`length` 函数不需要参数，但你仍然必须使用括号来表示空参数列表。此外，`length`\
  \ 是一个返回值的函数，因此函数调用必须出现在表达式中：\n\n![在表达式中调用 length 函数的代码。](img/9781284166033_CH03_PRE81.jpg)\n\
  \nDescription\n\n你可能在好奇像下面的函数调用中的语法：\n\n![length 函数。](img/9781284166033_CH03_PRE82.jpg)\n\
  \nDescription\n\n该表达式使用了 C++ 记法，称为点符号（dot notation）。在变量名 `firstName` 和函数名 `length`\
  \ 之间有一个点（句号）。正如我们在第 1 章](#9781284166033_CH01.xhtml) 中提到的，C++ 是一种面向对象的语言。`string`\
  \ 类型是 C++ 对象类型示例，在调用与对象相关的函数时需要使用点符号。假设你忘记使用点符号，将函数调用写成：\n\n![length 函数。程序代码。第 1\
  \ 行 length，左括号，右括号。](img/9781284166033_CH03_PRE83.jpg)\n\n你将得到一个编译错误信息，类似于 `UNDECLARED\
  \ IDENTIFIER`（未定义的标识符）。编译器认为你正尝试调用一个名为 `length` 的普通函数，而不是与字符串对象相关的 `length` 函数。在第\
  \ 4 章](#9781284166033_CH04.xhtml) 中，我们将讨论 C++ 对象。目前只需要知道它们的函数调用使用点符号就足够。\n\n有些人将字符串的长度称为\
  \ size。为了兼顾这两个术语，字符串类型提供了一个名为 `size` 的函数。`firstName.size()` 和 `firstName.length()`\
  \ 返回相同的值。\n\n`length` 和 `size` 函数返回类型为 `string::size_type` 的无符号整数值。然而，大多数 C++ 编译器允许你将结果赋值给类型为\
  \ `int` 的变量。\n\n![length 函数。](img/9781284166033_CH03_PRE84.jpg)\n\nDescription\n\
  \n在离开 `length` 和 `size` 函数之前，我们应该说明标识符的大小写规范。在第 2 章](#9781284166033_CH02.xhtml)\
  \ 给出的指南中，我们提到在书中程序员定义的函数和数据类型的名称以大写字母开头。在后面的章节中编写自己的函数和数据类型时，我们遵循这一约定。然而，我们无法控制\
  \ C++ 标准库提供的项目的大小写。标准库中的标识符通常使用全小写字母。\n\n### find 函数\n\n`find` 函数搜索字符串以找到特定子字符串的首次出现，并返回一个无符号整数值（类型为\
  \ `string::size_type`），给出搜索结果。作为参数传递给函数的字符串可以是字面量字符串或字符串表达式。如果 `str1` 和 `str2` 类型为\
  \ `string`，则以下所有均为有效的函数调用：\n\n![一些有效的 find 函数调用。](img/9781284166033_CH03_PRE85.jpg)\n\
  \nDescription\n\n在在这三种情况下，都会对 `str1` 进行搜索，查看其中是否可以找到指定的子字符串。如果是，函数将返回匹配在 `str1`\
  \ 中开始的位置。（位置从 0 开始计数，因此字符串中的第一个字符位于位置 0，第二个字符位于位置 1，依此类推）。\n\n\n\n\n| 函数调用 | 函数返回值中包含的字符串\
  \ |\n\n| --- | --- |\n| `myString.substr(0, 7)` | \"Program\" |\n| `myString.substr(7,\
  \ 8)` | \"ming and\" |\n| `myString.substr(10, 0)` | \"\" |\n| `myString.substr(24,\
  \ 40)` | \"Solving\" |\n| `myString.substr(40, 24)` | 无；程序带有执行错误消息终止 |\n\n在第三个示例中，指定长度为\
  \ `0` 会产生空字符串作为结果。第四个示例显示了如果第二个参数指定的字符数多于起始位置之后的字符数会发生：`substr` 返回从起始位置到字符串末尾的字符。最后一个示例说明，第一个参数（位置）不能超出字符串的末尾。\n\
  \n由于 `substr` 返回的是 `string` 类型的值，你可以使用连接运算符（`+`）来复制字符串片段并将它们组合在一起形成新字符串。`find` 和\
  \ `length` 函数对于确定字符串片段的位置和结束位置，并将其作为参数传递给 `substr` 非常有用。\n\n[这是一个使用 `find` 和 `substr`\
  \ 将字符串拆分为部分的程序。]\n\n![一个使用 find 和 substr 将字符串拆分为部分的程序。](img/9781284166033_CH03_UFIG129-1.jpg)\n\
  \n描述\n\n输出：\n\n![一个使用 find 和 substr 将字符串拆分为部分的程序的输出。](img/9781284166033_CH03_UFIG129-2.jpg)\n\
  \n描述\n\n该程序使用 `find` 定位第一个空格，并使用 `substr` 提取从第一个字符开始到紧邻第一个空格之前的子字符串。该子字符串存储在 `firstName`\
  \ 中。原始字符串被重新定义为包含从第一个空格之后到末尾的字符串。重复此过程以提取中间名。剩余字符串存储在 `lastName` 中。也许这个过程看起来很微不足道——毕竟，我们完全可以直接创建三个独立的字符串。然而，在第\
  \ 4 章中，当我们研究如何从键盘读取字符串时，这个通用算法将证明将输入字符串拆分为不同的部分是有用的。\n\n### 访问字符串中的字符：at 函数\n\n\
  有时直接通过位置访问访问字符是非常有用的。C++ 允许我们使用 `at` 函数来实现。这里是该函数的调用示例：\n\n![带有 at 函数调的代码。](img/9781284166033_CH03_PRE92.jpg)\n\
  \n描述\n\n记住，在字符串内部，第一个字符位于位置 `0`。因此，`somePosition` 的值必须大于或等于 `0` 且小于等于字符串长度减 `1`。例如，如果\
  \ `inputStr` 是一个字符串对象而 `letter` 是一个 `char` 变量，该语句\n\n```\n![带有 at 函数调的代码。](img/9781284166033_CH03_PRE93.jpg)\n\
  ```\n\n描述\n\n访问字符串位置 `2` 处的字符（第三个字符）并将其复制到 `letter` 中。调用 `at` 时如果值超出允许范围，将生成一条错误消息。\n\
  \n### 转换为小写和大大写\n\n在处理字符数据时，你有时可能会发现需要将小写字母转换为大写，或者反之亦然。幸运的是，这种转换很容易实现——只需调用库函数即可。通过头文件\
  \ `<cctype>`，标准库提供了两个返回值的函数，命名为 `toupper` 和 `tolower`。以下是它们的描述：\n\n![详细列出转换为小和小大写函数的表格。](img/9781284166033_CH03_UTAB130-1.jpg)\n\
  \n描述\n\n如果未满足条件，每个函数返回的值将只是原始字符。例如，`tolower('M')` 返回字符 `'m'`，而 `tolower('+')` 返回\
  \ `'+'`。\n\n接下来的程序使用 `toupper` 确保字符串的首字母是大写。首先提取第一个字母并将其转换为大写。然后将该字符串与删除了第一个字符的原始字符串连接。\n\
  \n![演示使用 substr 和 toupper 函数的程序。](img/9781284166033_CH03_UFIG130-1.jpg)\n\n描述\n\n\
  输出：\n\n![上程序的输出。](img/9781284166033_CH03_UFIG131-1.jpg)\n\n描述\n\n下表总结了我们在本章涵盖的字符串和字符操作。\n\
  \n| 操作 | 描述 |\n| --- | --- |\n| `substr(pos, len)` | 返回从 `pos` 开始的长度为 `len` 个字符的子字符串。\
  \ |\n| `find(str)` | 返回 `str` 首次出现的索引，如果未找到则返回 `npos`。 |\n| `length()` | 返回字符串字符的数量。\
  \ |\n| `at(pos)` | 返回位置 `pos` 处的字符。 |\n| `toupper(c)` | 返回字符 `c` 的大写版本。 |\n| `tolower(c)`\
  \ | 返回字符 `c` 的小写版本。 |\n\n\n\n\n![将数据与程序分离。](img/9781284166033_CH04_FIGF01.jpg)\n\
  \nDescription\n\n# 图 4.1 将数据与程序分离\n\n将外部数据集中的值获取到程序中的变量中被称为 `input`（输入）。我们说计算机将数据读入变量中。数据可以来自输入设备、辅助存储设备上的文件，或跨越网络。我们将在本章的稍后部分讨论文件输入；在这里，我们考虑标准输入设备——键盘。由于其复杂性，我们在本文中不考虑网络输入。\n\
  \n## 输入流与提取运算符 (>>)\n\n除了输出流之外，`C++` 还支持输入流。你可以将输入流想象成一个门，字符通过这个门进入你的程序。\n\n要使用流输入/输出（`I/O`），我们需要编写预处理器指令：\n\
  \n![用于处理流输入输出的预处理器指令。](img/9781284166033_CH04_PRE1.jpg)\n\nDescription\n\n头文件 `iostream`\
  \ 包含了两种数据类型的定义：`istream` 和 `ostream`。这些数据类型分别代表输入流和输出流。该头文件还包含如下所示声明：\n\n![i o stream\
  \ 头文件中的声明。](img/9781284166033_CH04_PRE2.jpg)\n\nDescription\n\n第一个声明说 `cin`（读作“see-in”）是一个\
  \ `istream` 类型的变量。第二个声明说我们的老朋友 `cout` 是 `ostream` 类型的变量。流 `cin` 与标准输入设备（键盘）相关。\n\
  \n你可以使用插入运算符（`<<`）将值输出到 `cout`，它有时被读作“put to”（放入）：\n\n![使用插入运算符的 c out 语句。](img/9781284166033_CH04_PRE3.jpg)\n\
  \nDescription\n\n类似地，你可以使用提取运算符（`>>`）从 `cin` 输入数据，它有时被读作“get from”（获取自）：\n\n![使用提取运算符的\
  \ c in 语句。](img/9781284166033_CH04_PRE4.jpg)\n\nDescription\n\n当计算机执行这条语句时，它会输入你在键盘上键入的数字（例如\
  \ 425），并将其存储在变量 `cost` 中。提取运算符 `>>` 接受两个操作数。它的左侧操作数是一个流表达式（在最简单的情况下，就是变量 `cin`）。它的右侧操作数是一个存储输入数据的变量。目前，假设该变量是简单类型（`char`、`int`、`float`\
  \ 等）。在章节的稍后部分，我们将讨论字符串数据的输入。\n\n你可以在语句中多次使用 `>>` 运算符。每次出现都会从流中输入下一个数据项。例如，以下语句没有区别：\n\
  \n![在语句中多次使用提取运算符。](img/9781284166033_CH04_PRE5.jpg)\n\nDescription\n\n和这对语句相同：\n\
  \n![上述语句的另一种写法。](img/9781284166033_CH04_PRE6.jpg)\n\nDescription\n\n在一个语句中编写一系列提取操作只是更方便。\n\
  \n起初，很容易混淆提取运算符（`>>`）和插入运算符（`<<`）。这里有一个记忆记忆的方法：以 `cin` 或 `cout` 开始语句，并使用指向数据流向方向的运算符。语句：\n\
  \n![一个输出语句。](img/9781284166033_CH04_PRE7.jpg)\n\nDescription\n\n将数据从变量 `someInt`\
  \ 发送到输出流。语句：\n\n![一个输入语句。](img/9781284166033_CH04_PRE8.jpg)\n\nDescription\n\n将数据从输入流发送到变量\
  \ `someInt`。下面的程序演示了 `cin` 和 `cout` 的用法。\n\n![演示 c in 和 c out 用法的程序。](img/9781284166033_CH04_UFIG148-1.jpg)\n\
  \n\n\n\n# 读取标记与换行符\n\n为了更详细地解释流式输入（stream input），我们引入了“读取标记”（reading marker）的概念，它用于跟踪输入流中计算机应该继续读取的位置——即下一个要读取的字符。提取运算符\
  \ `>>` 在输入完最后一个数据后，会将读取标记留在该数据之后的字符上。\n\n每一行输入都有一个不可见的行尾（或称换行符）字符，它告诉计算机一行在哪里结束，下一行从哪里开始。为了找到下一个输入值，`>>`\
  \ 运算符会在必要时跨越这些行边界。\n\n换行符从哪里来呢？当你通过键盘输入数据时，每按一次 Return 或 Enter 键就会生成一个换行符。当你的程序在输出流中插入\
  \ `endl` 操符时，也会生成一个换行符。你也可以使用 `\\n` 在输出中插入换行符。`endl` 和 `\\n` 都会告诉屏幕光标到下一行。\n\n让我们来看一些使用读取标记和换行符的输入示例。在下表中，`i`\
  \ 是一个 `int` 变量，`ch` 是一个 `char` 变量，而 `x` 是一个 `float` 变量。输入语句产生了所示的结果。输入流中用颜色打印的部分是输入语句提取的内容。由阴影块表示的读取标记指示了等待读取的下一个字符。`\\\
  n` 表示换行符。\n\n![一张列出使用读取标记和换行符输入示例的表格。](img/9781284166033_CH04_UTAB150-1.jpg)![一张列出使用读取标记和换行符输入示例的表格。](img/9781284166033_CH04_UTAB151-1.jpg)\n\
  \n描述\n\n# 使用 get 函数读取字符数据\n\n正如我们讨论过的，`>>` 运算符在寻找输入流中的下一个值时，会跳过任何前导空白字符。假设 `ch1`\
  \ 和 `ch2` 是 `char` 变量，且程序执行以下语句\n\n![一个输入语句。](img/9781284166033_CH04_PRE9.jpg)\n\
  \n描述\n\n如果输入流由以下内容组成\n\n![之前的代码提供的输入。](img/9781284166033_CH04_PRE10.jpg)\n\n描述\n\
  \n那么提取运算符会将 'R' 存入 `ch1`，跳过空格并将 '1' 存入 `ch2`。（注意，`char` 值 '1' 不等于 `int` 值 1。它们在计算机内存中的表示方式也不同。提取运算符会根据需要，对输入流中的相同字符序列进行不同的解释，以填充不同类型的变量。）\n\
  \n如果我们想从输入行中输入三个字符，其中一个是空格呢？使用提取运算符是无法行的，因为它会跳过空格。\n\n`istream` 数据类型提供了另一种读取字符数据的方法：`get`\
  \ 函数会输入输入流中的紧下一个字符，而不会跳过空白字符。函数调用形式如下：\n\n![对 get 的函数调用。](img/9781284166033_CH04_PRE11.jpg)\n\
  \n描述\n\n`get` 函数与 `cin` 对象相关，因此我们使用点号法进行函数调用。（回想一下我们在第 3 章中曾使用点号法来调用与字符串对象的某些函数。在本章的稍后部分，我们将仔细查看点号法。）注意，`get`\
  \ 使用的是调用 `void` 函数的语法，而不是返回值的函数。函数调用是一个语句，而不是表达式的一部分。\n\n此函数调用的效果是输入流中等待的下一个字符——即使它是空白字符——并将其存入变量\
  \ `somechar`。`get` 函数的参数必须是一个变量，因为它的目的是接收输入的字符作为新值。\n\n下面的程序演示了如何使用 `get` 函数读取三个字符并将它们存储在三个不同的地方。\n\
  \n![一个演示使用 get 函数的程序。](img/9781284166033_CH04_UFIG152-1.jpg)\n\n描述\n\n这里是输出，高亮了用户输入：\n\
  \n![之前程序的输出。](img/9781284166033_CH04_UFIG152-2.jpg)\n\n描述\n\n由于中间的字符是空格，我们可以使用以下三行来输入数据：\n\
  \n![一个输入数据的语句。](img/9781284166033_CH04_PRE12.jpg)\n\n描述\n\n这里是使用读取标记和换行符的更多示例。`ch1`\
  \ 和 `ch2` 是 `char` 变量。`\\n` 表示换行符。\n\n![列出使用读取标记和换行符输入示例的表格。](img/9781284166033_CH04_UTAB150-1.jpg)![列出使用读取标记和换行符输入示例的表格。](img/9781284166033_CH04_UTAB151-1.jpg)\n\
  \n# 使用 ignore 函数跳过字符\n\n大多数 `istream` 类型与 `ignore` 相关，它用于跳过（读取并丢弃）输入流中的字符。它具有两个参数，调用如下：\n\
  \n![ignore 函数。](img/9781284166033_CH04_PRE13.jpg)\n\n描述\n\n第一个参数是一个 `int` 表达式；第二个\
  \ `char` 值。示例 1 显示了 `ignore` 函数最常用的用法，即跳过当前行上的剩余数据。示例 2 展示了使用 `\\n` 作为第二个参数的情况。在示例\
  \ 1 和示例 2 中，我们关注第二个参数，并为第一个参数任意选择一个较大的数字。在示例 3 中，我们关注第一个参数。我们的意图是跳过接两个字符。\n\n这里有一些使用\
  \ `char` 变量和三个 `int` 变量 `i`、`j` 和 `k` 的示例：\n\n![列出使用 char 变量和三个 int 变量 i, j, k 输入的表格。](img/9781284166033_CH04_UTAB154-1.jpg)![列出使用\
  \ char 变量和三个 int 变量 i, j, k 输入的表格。](img/9781284166033_CH04_UTAB155-1.jpg)\n\n\n\n\
  \n然后我们的输入语句将四个字符 `Mary` 存储到 `firstName`，将五个字符 `Smith` 存储到 `lastName`，并留下输入流为：\n\n\
  ![在之前的输入中，输入流留下了列出的字符。](img/9781284166033_CH04_PRE16.jpg)\n描述\n\n虽然 `>>` 运算符对于字符串输入非常方便，但它无法读取包含空格的字符串。这种局限性使我们考虑了字符串输入的第二种方案：`getline`\
  \ 函数。对 `getline` 的调用如下：\n\n![调用 get line 函数。](img/9781284166033_CH04_PRE17.jpg)\n\
  描述\n\n这种调用没有使用点点表示法（dot notation），它需要两个参数：一个输入流变量（这里是 `cin`）和一个字符串变量。`getline` 函数从当前标记位置一直读取到下一个换行符；也就是说，`getline`\
  \ 读取当前输入行的剩余部分，包括其中所有的空格。请注意，使用 `getline` 时，换行符会被消耗（但不会存储在字符串变量中）。给定以下代码段：\n\n![一个示例代码段。](img/9781284166033_CH04_PRE18.jpg)\n\
  描述\n\n以及输入行：\n\n![get line 语句的输入。](img/9781284166033_CH04_PRE19.jpg)\n描述\n\n调用 `getline`\
  \ 的结果输入行上的所有 17 个字符都存储到了 `inputStr` 中，并且读取标记位于下一行输入的的开头。\n\n下表总结了将字符串数据读入字符串变量时，`>>`\
  \ 运算符与 `getline` 函数之间的区别。\n\n| 语句 | 跳过前导空格？ | 何时停止读取？ |\n| --- | --- | --- |\n|\
  \ `cin >> inputStr;` | 是 | 遇到尾随空格字符时（该字符不消耗） |\n| `getline (cin, inputStr);` | 否\
  \ | 遇到 `\\n` 时（该字符消耗） |\n\n以下程序演示了 `getline` 和 `cin` 的用法。\n\n![演示使用 get line 和 cin\
  \ 的程序。](img/9781284166033_CH04_UFIG156-1.jpg)![演示使用 get line 和 cin 的程序。](img/9781284166033_CH04_UFIG157-1.jpg)\n\
  描述\n\n这里是程序的示例运行。用户输入的数据被高亮显示，随后是输出内容。\n\n![演示使用 get line 和 cin 的程序的输出。](img/9781284166033_CH04_UFIG157-2.jpg)\n\
  描述\n\n## 4.2 交互式输入/输出\n\n交互式程序是指用户与计算机直接通信的程序。你所熟悉的大多数程序都是交互式的。\n\n为了将数据输入到式程序中，我们从输入提示开始——即解释用户应该输入内容的消息。没有这些消息，用户就不知道应该输入什么值。程序还可以显示已输入的值，以便用户验证其正确性。显示输入值被称为回显打印（echo\
  \ printing）。\n\n这里有一个演示正确使用提示的程序：\n\n![演示正确使用提示的程序。](img/9781284166033_CH04_UFIG158-1.jpg)\n\
  描述\n\n这是输出结果，用户输入已高亮显示：\n\n![演示正确使用提示的程序的输出。](img/9781284166033_CH04_UFIG159-1.jpg)\n\
  描述\n\n回到上一节的程序。它是同一个程序，只是没有提示。如果你是那个输入信息的人，你会更倾向于使用哪一个程序？\n\n提示中应该包含多少信息取决于谁将使用该程序。对于初学者使用的程序，提示应该更详细。例如，提示内容可能会是：“输入一个四数字部件号，然后按\
  \ Enter 键。”如果程序将被同一组人频繁使用，你可以缩短提示：“输入 PN”和“输入 Qty”。\n\n关于程序是否应该回显打印的决定也取决于用户对输入性质的熟悉程度。如果用户经验丰富且提示清晰，那么可能不需要回显打印。如果用户是新手或可以一次输入多个值，则应该使用回显打印。如果程序接收大量数据作为输入且用户经验丰富，与其回显数据，不如将其存储在文件中，稍后进行检查。我们将在本章稍后的部分讨论如何将数据存储到文件中。\n\
  \n除了提示之外，在程序开始时输出一些通用指令（如“完成后输入负数。”）也会很有。当输入数据错误时，应该输出一条指示问题的消息。错误消息具有信息量且“友好”是非常重要的。如下消息：\n\
  \n![一个不直观的错误消息。](img/9781284166033_CH04_UFIG159-2.jpg)\n描述\n\n可能会让用户不快，而且没有提供任何建设性的信息。一个好得多的消息应该是：\n\
  \n![更好的消息。](img/9781284166033_CH04_UFIG159-3.jpg)\n描述\n\n## 4.3 非交互式输入/输出\n\n虽然我们倾向于使用交互式\
  \ I/O，但许多程序是用非交互式 I/O 写的。例如，一个读取包含学生成绩的文件并创建成绩报告的程序。\n\n当程序必须读取大量数据时，通常的做法是将数据存储在文件中。当程序设计用于输出大量数据时，输出可以直接发送到文件。在程序运行后，用户可以查看数据。我们在下一节中介绍允许测试错误数据的语句。\n\
  \n非交互式程序不显示提示消息。因为非交互式程序倾向于输出大量数据，它们的输出可能以带有标题表格的形式呈现。\n\n## 4.4 文件输入/输出\n\n在我们所做的一切中，我们都假设输入来自键盘，输出到屏幕。我们现在来看文件的输入/输出。\n\
  \n### 文件\n\n文件是存储器中的一个命名区域，存储着一组信息（例如，我们在编辑器中输入的程序代码）。文件中的信息通常存储在辅助存储设备上，例如固态硬盘。我们的程序可以像读取键盘一样从文件中读取数据，也可以像向屏幕输出一样向文件写入输出。\n\
  \n\n\n\n假设我们想让第 3 章中的抵押贷款（Mortgage）程序从文件中读取数据并将其输出写入文件。我们必须执行的第一件事是添加以下预处理指令：\n\n\
  ![从文件读取数据并写入到文件的预处理指令。](img/9781284166033_CH04_PRE22.jpg)\n\n描述\n\n通过头文件 `fstream`，C++\
  \ 标准库定义了两个数据类型：`ifstream` 和 `ofstream`（分别代表输入文件流和输出文件流）。与 C++ 中流的通用概念一致，`ifstream`\
  \ 数据类型表示来自输入文件的字符流，而 `ofstream` 表示流向输出文件的字符流。\n\n你已经学过的所有 `istream` 操作——提取运算符（`>>`）、`get()`\
  \ 函数和 `ignore()` 函数——对于 `ifstream` 类型也是有效的。同样，所有的 `ostream` 操作，例如插入运算符（`<<`）以及 `endl`、`setw`\
  \ 和 `setprecision` 操纵符都适用于 `ofstream` 类型。这些这些操作的基础上，`ifstream` 和 `ofstream` 类型增加了专门用于文件\
  \ I/O 操作。\n\n### 声明文件流\n\n声明流对象变量的方法与声明任何变量相同——指定类型和名称：\n\n![一个输入输出文件流对象。](img/9781284166033_CH04_PRE23.jpg)\n\
  \n描述\n\n（我们不需要声明 `cin` 和 `cout` 流，因为头文件 `iostream` 自动完成了这一点。）\n\n对于我们与抵押贷款相关的程序，让我们把输入输出文件流对象命名为\
  \ `inData` 和 `outData`。我们这样声明它们：\n\n![一个输入输出文件流对象。](img/9781284166033_CH04_PRE24.jpg)\n\
  \n描述\n\n注意，`ifstream` 类型仅用于输入文件，`ofstream` 类型仅用于输出文件。使用这些数据类型，你无法对同一个文件同时进行读取和写入。\n\
  \n### 打开文件\n\n我们需要做的第三件事是通过打开文件来为每个文件做好读取或写入准备。打开文件会导致操作系统将文件准备好可用状态。\n\n在我们的示例中，我们想从\
  \ `inData` 读取并写入到 `outData`。我们可以这样打开文件：\n\n![打开文件的代码。](img/9781284166033_CH04_PRE25.jpg)\n\
  \n描述\n\n这两个语句都是函数调用。在每个函数调用中，参数都是一个字符串。第一条语句调用了名为 `open` 的函数，与 `inData` 关联。第二条语句调用了另一个函数（也名为\
  \ `open`），与 `outData` 关联。正如我们之前看到的，我们使用点符号法来调用与对象关联的函数。\n\n`open` 函数具体做了什么？首先，它将程序中的流变量与计算机上的一个文件关联起来。我们的第一个函数调用在流对象\
  \ `inData` 和名为 `loan.in` 的实际文件建立了连接。（流的名称必须是标识符；它们是程序中的变量。但操作系统对文件名使用不同的语法。例如，许多系统允许甚至要求文件名中包含点。）同样，第二个函数调用将流对象\
  \ `outData` 与文件 `loan.out` 关联起来。\n\n`open` 函数的后续操作取决于文件是用于输入还是输出的。对于输入文件，`open`\
  \ 将文件的读取标记设置为文件中的第一条数据。（每个输入文件都有它自己的读取标记。）\n\n对于输出文件，`open` 检查文件是否已经存在。如果文件不存在，`open`\
  \ 会创建一个新的空文件。如果文件已存在，`open` 会擦除文件的旧内容。然后，写入标记被设置在空文件的开头（参见图 4.2）。\n\n![打开文件的影响。](img/9781284166033_CH04_FIGF02.jpg)\n\
  \n图 4.2 打开文件的影响\n\n描述\n\n因为我们打开文件是为了为读取或写入做准备，所以我们必须在使用任何针对文件的输入或输出语句之前打开它们。在程序开始时立即打开文件是一个好主意，以确保在尝试执行文件\
  \ I/O 之前文件已经准备就绪。\n\n![打开文件的代码。](img/9781284166033_CH04_PRE26.jpg)\n\n描述\n\n除了 `open`\
  \ 函数外，还有一个 `close` 函数与 `ifstream` 和 `ofstream` 类型关联。该函数没有参数，可以如下使用：\n\n![close 函数的使用。](img/9781284166033_CH04_PRE27.jpg)\n\
  \n关闭文件会导致操作系统执行某些活动并断流与文件之间的连接。在某些编程语言中，手动关闭每个文件很重要。在 C++ 中，当控制权离开块时，每个对象关联的特殊函数（析构函数）会被调用（直到我们在第\
  \ 8 章）。\n\n### 运行时文件名\n\n到为止，我们打开文件的示例都包含了如下代码：\n\n![用于输入文件的代码。](img/9781284166033_CH04_PRE37.jpg)\n\
  \n描述\n\n`open` 函数需要一个指定文件名的参数。如果是字面量字符串，文件名在编译时就确定了，因此程序仅适用于该文件。\n\n我们通常希望程序能够在运行时选择文件名。例如，我们可以提示用户输入文件名，将响应读取到变量中，并将变量传递给\
  \ `open` 函数。从原理上讲，以下代码应该可行，但编译器不允许：\n\n![从用户处接受文件名会导致编译错误的代码。](img/9781284166033_CH04_PRE38.jpg)\n\
  \n描述\n\n### 在输入输出中指定流\n\n正如我们之前说的，所有的 `istream` 操作对于 `ifstream` 类型都是有效的，所有的 `ostream`\
  \ 操作对于 `ofstream` 类型都是有效的。因此，文件 I/O 最后的区别在于对于每次操作，我们用相应的流变量替换 `cin` 或 `cout`。在我们的抵押贷款程序中，我们将使用\
  \ `inData` 而不是 `cin` 从 `inData` 读取。\n\n![程序代码。](img/9781284166033_CH04_PRE28.jpg)\n\
  \n描述\n\n同样，输出语句将指定 `outData` 而不是 `cout` 作为目标：\n\n![程序代码。](img/9781284166033_CH04_PRE29.jpg)![程序代码。](img/9781284166033_CH04_PRE30.jpg)\n\
  \n描述\n\nC++ 流 I/O 的用处在于，无论我们是在处理键盘和屏幕、文件还是其他 I/O 设备，执行 I/O 操作时都有一套统一的语法。\n\n\n\n\
  \n问题在于 `open` 不接受 `string` 类型的参数。相反，它期望一个 C 字符串（C string），之所以命名是因为源自 C 语言（C++ 的前身）。C\
  \ 字符串是字符串的一种特殊形式。字面量字符串（literal string）恰好就是 C 字符串，因此可以作为 `open` 的参数。\n\n为了让这段代码正常工作，我们需要将字符串变量的值转换为\
  \ C 字符串。`string` 数据类型提供了一个名为 `c_str` 的返回值，可以通过点操作符应用于字符串对象上：\n\n![将字符串变量的值转换为 C\
  \ 字符串的代码。](img/9781284166033_CH04_PRE39.jpg)\n\n描述\n\n该函数返回与 `fileName` 变量内容等价的\
  \ C 字符串。（`fileName` 中包含的原始字符串不会因为函数调用而改变。）`c_str` 函数的主要目的是允许程序员调用那些期望 C 字符串而非字符串对象作为参数的库函数。\n\
  \n下面的程序读取文件名并将文件的第一行存储起来。文件和输出显示在程序之后。\n\n![读取文件名并输出文件第一行的程序。](img/9781284166033_CH04_UFIG168-1.jpg)\n\
  \n描述\n\n文件 `testData.in`：\n\n![文件 testData.in 的内容。](img/9781284166033_CH04_UFIG168-2.jpg)\n\
  \n描述\n\n输出：\n\n![演示输入文件的程序的输出。](img/9781284166033_CH04_UFIG168-3.jpg)\n\n描述\n\n\
  C++ 提供了第二种方法来声明文件变量并将其与文件名关联，这一切在一个语句中完成。你可以这样写：\n\n```\nifstream inData(\"loan.in\"\
  ); ofstream outData(\"loan.out\");\n```\n\n(images/9781284166033_CH04_PRE82.jpg)\n\
  \n这些语句是 C++ 所称为参数化构造函数的示例。这个术语与 C++ 的面向对象方面有关。\n\n## 4.5 输入失败\n\n当程序输入数据时，可能会出现问题。假设程序提示我们输入整数，但我们输入了一些字母。由于数据无效，输入操作失败了。在\
  \ C++ 术语中，`cin` 流进入了失败态（fail state）。一旦流进入失败态，使用该流的任何后续 I/O 操作将变成空操作——也就是说，它们不会产生影响。对我们不利的是，计算机并没有停止程序或显示任何错误信息。它只是继续执行程序，静静地忽略每次使用该流的额外尝试。\n\
  \n无效数据是输入失败最常见的原因。当你的程序接受 `int` 值作为输入时，它期望在输入流中只找到数字，前面可能带有加号或减号。如果数字某处有一个小数点，输入操作会失败吗？不一定。让我们来看一个例子。\n\
  \n假设程序有 `int` 变量 `i`、`j` 和 `k`，它们目前的内容分别为 10、20 和 30。程序执行以下两个语句：\n\n(images/9781284166033_CH04_PRE41.jpg)\n\
  \n描述\n\n如果我们为输入数据输入这些字符：\n\n(images/9781284166033_CH04_PRE42.jpg)\n\n描述\n\n那么程序产生此输出：\n\
  \n(images/9781284166033_CH04_PRE43.jpg)\n\n描述\n\n让我们看看为什么。\n\n记住，在读取 `int` 或 `float`\
  \ 数据时，提取运算符 `>>` 在遇到第一个不适当字符时停止读取。在我们的示例中，`i` 的输入操作成功了。计算机从输入流中提取前四个字符，并将整数值 1234\
  \ 存入 `i`。读取标记现在小数点上：\n\n(images/9781284166033_CH04_PRE44.jpg)\n\n描述\n\n`j` 的输入操作失败了因为它遇到了小数点。随后流进入了失败态。\n\
  \n处理错误的另一种方法是使用 `clear()` 成员函数来重置状态，并使用 `ignore()` 跳过问题的字符。\n\n```\ncin.clear();\n\
  cin.ignore(1000, '\\n');\n```\n\n处理错误的另一种方法是使用 `fail()` 成员函数检查流的状态。如果 `fail()` 返回真，程序可以输出错误信息。\n\
  \n(images/9781284166033_CH04_PRE45.jpg)\n\n描述\n\n## 4.6 软件设计方法\n\n在过去的两个章节以及本章的开头，我们引入了\
  \ C++ 语言的元素，让我们能够输入数据、执行计算并输出结果。我们目前为止写的程序都很短，因为问题很简单。现在我们准备好为复杂的问题编写程序了——但首先我们需要回顾整个过程。\n\
  \n编程过程由问题解决阶段和实现阶段组成。问题解决阶段包括分析（理解问题）和设计（解决问题）。对于一个复杂的问题——例如一个产生 10000 行行的程序——跳过设计过程直接编写\
  \ C++ 代码是有效的。我们需要的是一种系统的方法来设计解决方案，无论问题有多复杂。\n\n在本章的剩余部分中，我们将描述两种解决复杂问题的设计方法：函数分解和面向对象设计。\n\
  \n一种广泛使用的软件设计方法被称为面向对象设计（OOD）。C++ 从 C 语言演变为主要是为了方便 OOD 方法的使用。在本章中，我们介绍了 OOD 的核心概念；并在书中后面对该方法进行详细讨论。OOD\
  \ 通常与我们在本章讨论的另一种方法函数分解结合使用。\n\n面向对象设计关注包含数据和对数据的操作实体（对象）。在 OOD 中，我们通过识别组成解决方案的组件，并识别这些组件如何通过对其包含的数据的操作相互交互来解决问题。结果是一组对象的设计，这些对象可以组合成问题的解决方案。相比之下，函数分解将问题的解决方案视为一个要完成的任务。它关注于完成任务所需的操作序列。当问题所需的步骤序列过长或复杂时，将其划分为更容易解决的子问题。\n\
  \n\n\n选择哪种方法论取决于当前处理的问题。例如，一个大问题可能涉及几个顺序处理阶段，如收集数据并验证其正确性、分析数据，以及在分析结束时生成报告。这个过程具有自然的函数分解特性。然而，每个阶段都可能通过一组对象来解决最为合适，这些对象代表了数据以及可以应用于数据的操作。某些对象或操作可能足够复杂，以至于进一步分解为额外的对象或操作。\n\
  \n如果将问题看作是组件的集合是自然而然的，你就可以使用面向对象的设计（OOD）来解决它。例如，一个银行问题可能需要一个 `checkingAccount` 对象，以及关联的操作\
  \ `OpenAccount`、`WriteCheck`、`MakeDeposit` 和 `IsOverdrawn`。`checkingAccount` 对象将由数据（例如账号和当前余额）以及这些操作组成，并被绑定成一个单元。\n\
  \n相比之下，如果你发现将问题的解决方案看作一系列步骤是自然而然的，那么你应该使用函数分解。例如，在对大型数据集上计算某些统计指标时，自然的方法是将问题分解为几个步骤：读取值、执行计算，然后重复该过程。C++\
  \ 语言和标准库提供了我们需要的操作，我们只需要编写这些操作的序列来解决问题。\n\n总结来说，函数分解侧重于从输入转换为输出的过程，产生一组任务。面向对象的设计侧重于要被转换的数据对象，产生一组对象。在现实中，这些设计方法通常是结合使用的，用函数分解来描述面向对象设计中与对象相关的操作。\n\
  \n## 4.7 函数分解\n\n在函数分解（也称为结构化设计、自顶向下设计、步步细化和模块化编程）中，我们从解决方案中主要步骤的抽象列表开始，转向可以直接转换为\
  \ C++ 的具体算法指令。你也可以将这种方法看作是从高层算法开始（留出未指定的实现细节），一直深入到完全详细的算法。\n\n解决问题最简单的方法是把它交给别人并说：“解决这个。”问题解决方案最抽象的层次涵盖了整个问题，而不指定具体的实现细节。这正是我们这些程序员上场的时候。我们的工作是将抽象解决方案转化为具体的解决方案，即程序。\n\
  \n如果解决方案清楚地涉及一系列主要步骤，我们就将其分解（划分）为这些部分。在这个过程中，我们移动到了较低的抽象层次——也就是说，现在指定了一些实现细节。每个主要步骤都变成一个需要单独解决的独立子问题。在大项目中，首席架构师（或团队领袖）将子问题交给团队成员，说：“解决这个问题。”在小型项目中，我们将子问题留给自己，一次选择一个来解决。我们可能会将一个子问题分解为另一系列步骤，这些步骤反过来又变成更小的子问题。或者我们可能会识别出自然表示为对象的组件。这个过程持续持续，直到每个子问题无法进一步划分或有了明显的解决方案。\n\
  \n我们为什么要这样工作？为什么不直接开始写写细节？因为一次只关注一个问题更容易。例如，假设你正在编写一个程序，发现你需要一个复杂的公式来为输出语句计算合适的\
  \ `fieldwidth`。计算 `fieldwidth` 不是你现在的关注点。如果你将注意力转移到那里，可能会忘记你正在处理的某些细节。所以你做了一个标记——“计算\
  \ fieldwidth”——然后继续。在解决完当前的子问题后，你可以返回到计算工作上。\n\n通过细分问题，你创建了一个被称为树形结构的分层结构。树的每一层都是该问题的完整解决方案，并且比上面的一层更具体。图\
  \ 4.3 显示了一个问题的通用解决方案树。绿色阴影标记的步骤具有足够的细节，可以直接转换为 C++；这些是具体步骤。紫色阴影标记的是抽象步骤；它们在下一层中作为子问题重新出现。图中的每个框代表一个模块。模块是函数分解中的基本构建块。图\
  \ 4.3 中的图也被称为模块结构图。\n\n![分层解决方案树。](img/9781284166033_CH04_FIGF03.jpg)\n\n图 4.3 分层解决方案树\n\
  \n描述\n\n函数分解使用分治法来解决问题；换句话说，它将大问题分解成更容易处理的小单元。OOD 也是这样做，但在 OOD 中单元是对象，而在函数分解中单元是模块。\n\
  \n### 模块\n\n模块源于解决方案树中更高一层的抽象步骤。当它指定了一系列与抽象步骤执行相同操作时，它就完成了（不要把我们这里使用的函数与 C++ 函数混淆）。在编写良好的模块中，其具体步骤直接解决给定的子问题；重要的子问题被写为抽象步骤。这被称为函数聚集。\n\
  \n函数聚集的核心思想是每个模块应该只做一件事并将其做好。函数聚集不是一个精确定义的属性；没有定量的衡量标准。相反，它基于我们判断何时清晰的能力。知道哪些细节应该具体化，哪些留抽象取决于经验。例如，如果模块的其他部分非常简单，不会产生混淆，你可能会决定将\
  \ fieldwidth 计算包含在输出模块中。相反，如果该计算被执行多次，那么将其作为一个单独模块并在每次需要时引用它是合理的。\n\n### 编写聚集模块\n\
  \n编写聚集性模块的一种方法如下：\n\n1. 思考你如何手动解决该子问题。\n2. 写下主要步骤。\n3. 如果你能看到如何直接在 C++ 中实现一个步骤，它处于具体层次；不需要进一步细化。\n\
  4. 如果你认为实现一个步骤需要多条 C++ 语句，它仍然处于抽象层次。\n5. 如果你尝试编写一系列步骤并开始被细节所淹没，你可能跳过了一个或多个抽象层次。退后一步观察，寻找可以写成抽象步骤的片段。\n\
  \n\n\n当你沿着解决方案树向下工作时，你会做出一系列设计决策。如果某个决策证明是笨拙或错误的（很多时候确实如此！），你可以返回树上方的较高层级模块，并尝试其他方法。你不需要放弃整个设计——只需要放弃你正在处理的那一小部分。在达到最终设计之前，你可能会探索许多中间步骤和尝试方案。\n\
  \n### 伪代码\n\n如果你用伪代码写出步骤，你会发现实现一个设计会变得更容易。伪代码是英语陈述和类 C++ 控制结构的混合体，可以很容易地翻译成 C++。（在“解决问题案例研究”的算法中，我们一直使用伪代码。）当用伪代码写出一个具体步骤时，应该能够将其直接重写为程序中的一条\
  \ C++ 语句。\n\n### 实现设计\n\n功能分解的产物是一个具有多个抽象层级的问题的分层解决方案。图 4.4 显示了修订后的 `Mortgage` 程序的功能分解。这种解决方案构成了编程实现阶段的基础。\n\
  \n![贷款程序的解决方案树。](img/9781284166033_CH04_FIGF04.jpg)\n\n图 4.4 贷款程序的解决方案树\n\n[描述](https://9781284166033_Alt.xhtml_summary-fig4-4)\n\
  \n我们如何将功能分解翻译成 C++ 程序呢？如果你仔细观察图 4.4，你可以看到具体步骤（用绿色阴影标记）可以组合成一个解决问题的完整算法。它们组合的顺序由它们在树中的位置决定。我们从树的顶部即第\
  \ 0 层开始，执行第一步“打开文件”。因为它是抽象的，我们必须进入下一层级，即第 1 层。在那里，我们找到了一系列与该步骤对应的具体步骤；这一系列步骤就成了我们算法的第一部分。由于转换过程现在是具体的，我们可以返回第\
  \ 0 层并继续执行下一步“输入值”。因为它是抽象的，我们进入第 1 层并找到了一系列与该步骤对应的具体步骤；这一系列步骤就成了我们算法的下一个部分。回到第 0\
  \ 层，我们继续执行下一步“计算值”。最后我们再次回到第 0 层并完成最后步骤“输出结果”和“关闭文件”。\n\n![贷款程序中的步骤。](img/9781284166033_CH04_UFIG175-1.jpg)\n\
  \n[描述](https://9781284166033_Alt.xhtml_summary-ufig175-1)\n\n从这个算法中，我们可以构建一个所需的变量表，然后编写程序的声明和可执行语句。\n\
  \n在实践中，你编写设计并不是作为树状图，而是作为按抽象层级分组的一系列模块。\n\n![按两个抽象层级分组的贷款程序模块。](img/9781284166033_CH04_UFIG175-2.jpg)![按两个抽象层级分组的贷款程序模块。](img/9781284166033_CH04_UFIG176-1.jpg)\n\
  \n[描述](https://9781284166033_Alt.xhtml_summary-ufig175-2)\n\n如果你看 `Mortgage` 的 C++\
  \ 程序，你可以看到它与这种解决方案非常相似。模块的名称也被转述为代码中的注释。\n\n我们在这里引入的实现类型称为扁平化实现或内联实现。我们通过将所有步骤写成一个长长的序列，将解决方案的二维分层结构扁平化。当解决方案很短且只有几个抽象级时，这种实现是足够的。假设有适当的注释和良好的风格，它生成的程序是清晰易于理解的。\n\
  \n更长的、具有更多抽象级的程序很难以扁平实现的方式来处理。对于那些类型的程序，最好使用分层实现来实现分层解决方案，其中我们通过将许多模块编写为单独的 C++\
  \ 函数来实现这些模块，然后将设计中的抽象步骤替换为对这些函数的调用。\n\n将模块实现为函数的优势之一是它们可以从程序的不同地方调用。例如，如果一个问题要求在多个地方计算圆柱体积，我们可以写一个函数来执行计算，并在每个地方简单地调用它。这给了我们一个半分层的实现。这种实现并没有保持纯的分层结构，因为解决方案树上不同层级的抽象步骤共享一个模块的实现（参见\
  \ 图 4.5）。共享模块实际上落在了分层之外，因为它并不真正属于任何一个层级。\n\n![带有共享模块的半分层模块结构图。](img/9781284166033_CH04_FIGF05.jpg)\n\
  \n图 4.5 带有共享模块的半分层模块结构图\n\n[描述](https://9781284166033_Alt.xhtml_summary-fig4-5)\n\
  \n将模块实现为函数的另一个优势是你可以在其他程序中重用它们。随着时间的推移，你将建立自己的函数库，以补充 C++ 标准提供的函数。\n\n我们将对分层实现的讨论推迟到第\
  \ 8 章。目前，我们的程序仍然短到可以采用扁平实现。\n\n从现在起，我们在案例研究中使用以下大纲进行功能分解，并建议你在解决自己的问题时采用类似的大纲：\n\
  \n- 问题描述\n- 输入描述\n- 输出描述\n- 讨论假设（如果有）\n- 主模块\n- 按层划分的剩余模块\n- 模块结构图\n\n在我们的一些案例研究中，这个大纲会稍微重组，因此输入和输出描述在讨论之后。我们可能还会对其扩展。不要把这个大纲看作是僵化的处方——它更像是一个“待办列表”。我们要确保完成列表上的所有事项，但每个问题的具体情况将指导我们使用的步骤以及执行步骤的顺序。\n\
  \n### 设计视角\n\n我们已经查看了两种设计方法：面向对象设计和功能分解。在我们学习支持 OOD 的更多 C++ 特性之前，我们将使用功能分解来开发解决方案。\n\
  \n记住，功能分解和 OOD 并不是独立的、孤立的技术。OO 将问题分解为对象。对象包含数据和关联的操作。这些操作需要算法。有时必须使用功能分解对算法进行分解。丰富的程序员熟悉这两种方法，并知道何时使用其中一种，或者两者结合。\n\
  \n记住，编程过程中的问题解决阶段需要时间。如果你花费大部分时间分析和设计解决方案，那么实现程序所需就会相对较少。\n\n现在让我们来看一个展示功能分解的案例研究。\n\
  \n### 图形用户界面 (GUI)\n\n虽然基于流输入为我们的程序接收用户输入提供了一种简单的机制，但大多数现代程序通过图形用户界面 (GUI) 与人类交互。例如，之前我们让用户使用如下代码输入文件名：\n\
