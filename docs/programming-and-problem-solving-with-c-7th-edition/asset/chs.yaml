  \nDescription\n\n请记住，在函数内部，数组参数仅仅是一个持有参数数组第一个元素地址的变量。调用中的数组参数将它的地址传递给数组参数，使其引用该数组。调用并没有复制数组的元素。忘记这种区别是一个常见的错误。\n\
