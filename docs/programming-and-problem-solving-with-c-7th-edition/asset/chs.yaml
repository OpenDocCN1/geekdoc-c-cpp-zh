  \ `Y` 之前测试 `Z`。\n5. 当类 `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n6. 当类 `Y` 包含类 `Z`\
  \ 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n7. 当类 `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n8. 当类\
  \ `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n9. 当类 `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试\
  \ `Z`。\n10. 当类 `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n\n\n\n\n本章介绍了 C++ 语言的特性，这些特性对我们设计和实现软件具有深远影响：模板、运算符重载和异常。顾名思义，模板是一种从其能够创建某物的多个实例的模式。C++\
  \ 模板允许我们创建函数或整个类的特化实例，而无需显式地更改或扩展它们。\n\n运算符重载允许我们重新定义标准的 C++ 运算符。特别是，我们可以重新定义关系运算符，以便它们用于比较类对象。\n\
  \n异常是执行过程中发生的非常规事件。C++ 异常处理机制允许程序的某部分检测到异常发生，并让程序的另一部分做出响应。执行检测的部分被称为“抛出”异常，而响应的部分（称为异常处理程序）被称为“捕获”异常。\n\
  \n## 16.1 模板类\n\n在第 13 章中，我们定义了一个 `List` 抽象数据类型 (ADT)，它表示一个无序组件的列表，每个组件的类型为 `ItemType`。我们将此\
  \ ADT 编码为一个名为 `List` 的 C++ 类，其头文件 `List.h` 编写如下（此处省略了函数的先决条件和后置条件）：\n\n![包含标记为 List\
  \ 的类定义的头文件](img/9781284166033_CH16_P974.jpg)\n\n描述\n\n`typedef` 语句允许我们为 `ItemType`\
  \ 选择一个特定类型，只要它是简单类型或 `string` 类即可。\n\n`List` 类在某种意义上类似于`泛型数据类型`，因为如果我们通过更改 `typedef`\
  \ 语句来更改 `ItemType`，我们可以重新编译该类，而无需更改成员函数中的任何算法。\n\n然而，按目前编写的 `List` 类有两个严重的局限性。首先，一旦使用（例如使用\
  \ `int` 作为 `ItemType`）编译类，客户端程序的 `List` 对象只能是 `int` 列表。客户端无法在同一个程序中同时拥有一个 `int`\
  \ 列表和一个 `float` 列表。其次，客户端程序无法指定或更改 `ItemType`；程序员必须手动修改 `list.h`。\n\n为了让像 `List`\
  \ 这样的类成为真正的泛型，我们需要一种语言结构，允许 `ItemType` 成为类声明的参数。幸运的是，C++ 提供了这种结构：类模板 (`class template`)。\n\
  \n### 定义类模板\n\n在 C++ 中，类模板允许你编写带有“空白”的类定义，这些空白由调用代码填充。大多数情况下，这些“空白”是数据类型的名称。\n\n\
  以下是类模板的语法：\n\n![类模板的语法如下。第 1 行：template，左尖括号，模板参数列表 (Template Param List)，右角括号。第\
  \ 2 行：类定义。](img/9781284166033_CH16_P975.jpg)\n\n其中 `ClassDefinition` 是一个普通的类定义。C++\
  \ 中 `TemplateParamList` 的完整语法描述非常复杂，我们根据目的将其简化如下。`TemplateParamList` 是由逗号分隔的一个或多个参数声明的序列，每个参数的定义如下：\n\
  \n![模板参数声明由类或类型名称后跟一个标识符组成。](img/9781284166033_CH16_P975-1.jpg)\n\n这是为我们的 `List`\
  \ 类设计的类模板，类名已改为 `GList`：\n\n![template class ItemType class GList { public: List();](img/9781284166033_CH16_P975-2.jpg)![List\
  \ 类的类模板](img/9781284166033_CH16_P976.jpg)\n\n描述\n\n正如高亮所示，这个模板类似于 `List` 类型的声明，只是在其前面是\
  \ `template<class ItemType>`，且类名发生了更改。在这里，`ItemType` 是模板参数。和以前一样，我们在任何需要引用列表元素数据类型的地方都使用\
  \ `ItemType`。区别在于，该类型不是通过 `typedef` 语句硬编码的，而是在类实例化时指定的。你可以为模板参数使用任何标识符；我们在这个示例中使用\
  \ `ItemType` 是因为我们已经在 `List` 类中一直它。\n\n关于模板参数有两点注意。首先，在 `template<class ItemType>`\
  \ 中使用 `class` 词仅仅是语法要求，并不意味着列表项必须是 C++ 类的对象。从此模板创建的列表可以包含任何数据类型，包括内置类型或用户定义的类型。（由于这个原因，一些\
  \ C++ 程序员正倾向于使用新的保留字 `typename`，尽管 `class` 更具传统。）在下一节的示例中，我们使用 `int`、`char` 和 `float`\
  \ 从此模板实例化了三个特定的类。\n\n其次，模板参数取代了代码中的显式类型名称。那么我们向这个参数传递什么呢？一个数据类型名称。这起初看起来可能很奇怪，因为当我们向函数传递参数时，我们总是传递变量名，而不是数据类型名。此外，向模板传递参数的影响在编译时产生——与之相反，向函数传递参数的影响在运行时产生。\n\
  \n### 实例化类模板\n\n给定 `GList` 类模板，客户端程序可以使用如下代码创建若干个组件类型不同的列表：\n\n![不同类型列表的代码片段](img/9781284166033_CH16_P976-1.jpg)\n\
  \n描述\n\n![插入数据的代码片段](img/9781284166033_CH16_P977.jpg)\n\n描述\n\n在 `list1`、`list2`\
  \ 和 `list3` 的声明中，角括号内的数据是模板参数。当编译器遇到 `list1`、`list2` 和 `list3` 时，它会生成（实例化）三个不同的类型，并为每个类型赋予内部名称。你可以想象这些声明在内部转换如下如下：\n\
  \n![编译器对声明的可能转换](img/9781284166033_CH16_P977-1.jpg)\n\n描述\n\n在 C++ 术语中，这些新类型被称为模板类或生成类（与创建它们的类模板相对）。单独来说，从模板生成的每个具体类被称为模板的特化\
  \ (specialization)。\n\n当编译器实例化模板时，它会在类模板中字面上替换模板参数。例如，当编译器第一次在客户端代码中遇到 `GList<int>`\
  \ 时，它通过用 `int` 替换 `ItemType` 来生成一个新的类：\n\n![代码片段](img/9781284166033_CH16_P977-2.jpg)\n\
  \n描述\n\n关于类模板的一个有用视角是：普通的类声明是创建单个对象的模式，而类模板是创建单个数据类型的模式。\n\n现在我们已经学习了如何编写类模板的定义，那么类成员函数的定义该如何处理？我们需要将它们编写为函数模板\
  \ (`function templates`)，以便编译器可以将每个函数与正确的模板类关联。以下是函数模板的语法图：\n\n![函数模板的语法如下。第 1 行：template，左尖括号，模板参数列表\
  \ (Template Param List)，右角括号。第 2 行：函数定义。](img/9781284166033_CH16_P978.jpg)\n\n\n\
  \n\n\n正如你所看到的，`FunctionTemplate` 与 `ClassTemplate` 非常相似，但有两个例外：在某些特殊情况下可以省略 `TemplateParamList`，并且模板参数规范后面跟着的是\
  \ `FunctionDefinition` 而不是 `ClassDefinition`。\n\n例如，我们按照如下函数模板编写了 `Insert` 函数：\n\
  \n![Insert 函数的定义。](img/9781284166033_CH16_P978-1.jpg)\n\n描述\n\n注意，我们必须在 `GList`\
  \ 后面加上 `<ItemType>`，以便编译器知道我们指的是 `GList` 的哪种特化版本。在类内部存在多个特化版本也是可能的（尽管这里没有提供示例），并且每种情况下都需要告诉编译器哪一个是哪一个。\n\
  \n如果客户端声明了类型 `GList<float>`，编译器将生成一个类似于下方的函数定义：\n\n![编译器生成的函数定义。](img/9781284166033_CH16_P978-1.jpg)\n\
  \n描述\n\n### 实现输入参数的另一种方式：const 引用\n\n到为止，我们对函数参数使用了一个非常简单的规则：输入参数按值传递，而所有其他参数按引用传递。通过这种方式，我们避免了某些类型的副作用错误。引用参数允许函数直接访问参数，每当必须通过参数传回值时，这种方法都是必要的。\n\
  \n对于内置类型和简单、小对象的参数，值参数所发生的复制在效率上与引用参数所发生的地址传递相当相当。然而，当我们使用较大的对象时，复制它们会消耗更多时间。模板使得生成大型且复杂的数据结构变得简单——例如，我们可以从同一个实现中实例化一个大型对象列表或一个\
  \ `int` 列表。结果，我们可以创建一个对简单类型非常高效，但对复杂类型运行速度慢得惊人的模板。即使模板对复杂类型执行的操作非常快，复制到值参数的开销也会主导处理时间。\n\
  \n我们需要一种既像按引用传递一样高效，又像按值传递一样安全的参数传递机制。C++ 通过允许我们指定引用参数为常数来提供这种机制。因此，将常量引用参数机制应用到模板函数定义中是非常重要的。例如，下面的代码显示了我们应该如何实现\
  \ `GList` 插入操作，并突出了更改之处：\n\n![G List Insert 操作的函数定义。](img/9781284166033_CH16_P979.jpg)\n\
  \n描述\n\n要将值参数转换为常量引用，我们在类型名称之前加上 `const` 并在后面加上 `&`。值参数和常量引用等价吗？绝对不等同！在函数内部，常量引用参数确实是一个常数——你不能给它赋新值。这与值参数形成了对比，值参数是函数内部的一个变量。因为值参数包含了其参数的副本，我们可以给它赋新值或修改其内容，而不影响原始参数。\n\
  \n除了不能给常量引用赋新值的限制外，当参数类型为类时，我们也不被允许调用它的变变器（mutator）方法。\n\n对于作为常量引用传递的对象，我们只能调用它的观察者（observers）。回想第\
  \ 12 章，我们在不改变对象内值的函数头中添加了 `const`。当对象被传递给常量引用参数时，只有它的 `const` 函数可以被应用于它。如果我们尝试调用对象的任何非常量函数，编译器将发出错误信息。\n\
  \n### 程序代码的组织\n\n在处理模板类时，我们必须更改关于源代码存放文件的基本规则。之前，我们将类声明放在一个名为 `List.h` 的头文件中，并将成员函数定义放在一个名为\
  \ `List.cpp` 的实现文件中。结果，`List.cpp` 可以独立于客户端代码被编译成目标代码。这种策略对模板不起作用。除非编译器知道模板的参数，否则它无法实例化模板，而这个参数位于客户端代码中。\n\
  \n一种通用的解决方案是同时编译客户端代码和类定义。对于我们的 `GList` 模板，一种技术是省去实现文件 `glist.cpp`，而改为将模板类声明和成员函数定义放在同一个文件\
  \ `GList.h` 中。另一种技术是保留两个不同的文件 `GList.h` 和 `GList.cpp`，但在 `GList.h` 文件的末尾放置指令 `#include\
  \ \"GList.cpp\"`。无论哪种方式，编译器都可以同时获得客户端代码和类的所有源代码。\n\n在接下来的 GList 模板代码中，我们使用了第一种技术——即在单个文件中将实现附加到规范之后。\n\
