  \n## 8.4 参数\n\n当函数执行时，它会使用调用时提供的参数。这是如何实现的？答案取决于参数的性质。C++ 支持两种参数：`值参数`和`引用参数`。对于值参数，函数接收参数的副本。这是我们迄为止使用的参数类型。对于引用参数，函数接收的是调用者参数的位置（内存地址）。引用参数通过在数据类型名称旁添加取地址符\
  \ `&` 来声明。在详细检查这两种参数的区别之前，让我们看一个混合了引用和值参数声明的函数头示例：\n\n![函数头。](img/9781284166033_CH08_433b.jpg)\n\
  \n描述\n\n对于简单数据类型——`int`、`char`、`float` 等——值参数是默认（假设的）参数类型。换句话，如果你不做任何特殊处理（添加 `&`），参数就被假设值为参数。要指定引用参数，你必须做额外操作（添加\
  \ `&`）。\n\n### 值参数\n\n在 `NewWelcome` 程序中，`PrintLines` 函数的头是\n\n![一个函数头。void Print\
  \ Lines，左括号，int num Lines，右括号。](img/9781284166033_CH08_434.jpg)\n\n参数 `numLines`\
  \ 是值参数，因为它的数据类型名称没有以 `&` 结尾。如果使用参数 `lineCount` 调用函数：\n\n![语句。Print Lines，左括号，line\
  \ Count，右括号，分号。](img/9781284166033_CH08_434a.jpg)\n\n\n\n\n\n随后参数 `numLines` 被初始化为\
  \ `lineCount` 值的拷贝。此时，在不同的内存位置中存在两份数据——一个在参数 `lineCount` 中，另一个在参数 `numLines` 中。如果\
  \ `PrintLines` 函数内部的语句更改了 `numLines` 的值，该更改不会影响参数 `lineCount`。（记住，`lineCount` 和\
  \ `numLines` 存储在两个不同的内存位置。）如你所见，使用值参数可以帮助我们避免对参数的无意修改。\n\n由于值参数传递的是其参数的拷贝，因此任何具有值的内容都可以传递给值参数。这包括常量、变量，甚至是任意复杂的表达式。（该表达式会被求值，其结果的拷贝会被发送到对应的值参数。）对于\
  \ `PrintLines` 函数，以下函数调用都是合法的：\n\n![3 条语句。](img/9781284166033_CH08_434b.jpg)\n\n\
  描述\n\n函数调用中的参数数量必须与函数头中的参数数量相同^(3)此外，每个参数的数据类型应与相同位置的参数数据类型相同。注意以下示例中的每个参数是如何与相同位置的参数匹配的（每个参数的数据类型你可以根据其名称推断出来）：\n\
  \n![函数头：void ShowMatch(float num1, int num2, char letter) 函数调用：ShowMatch(floatVariable,\
  \ intVariable, CharVariable);](img/9781284166033_CH08_434c.jpg)\n\n如果匹配的项数据类型不同，则会发生隐式类型转换。例如，如果参数的类型是\
  \ `int`，那么作为 `float` 表达式的参数在传递给函数之前会被强制转换为 `int` 值。像 C++ 中通常的那样，你可以通过使用显式类型转换来避免无意的类型转换，或者更好的方法是干脆不要不要混合数据类型。\n\
  \n正如我们所强调的，值参数接收的是参数的拷贝，因此无法直接访问或更改调用者的参数。当函数返回时，其值参数的内容及其局部变量的内容都会被销毁。值参数与局部变量的区别在于，局部变量的值在函数开始执行时是未定义的，而值参数会自动初始化为对应参数的值。\n\
  \n由于值参数的内容在函数返回时会被销毁，因此它们不能用于向调用方代码返回信息。如果我们*真的*想通过修改调用者的参数来返回信息怎么办？我们必须使用引用参数。\n\
  \n### 引用参数\n\n引用参数是在数据类型名称后加上一个与 符号而声明的参数。它被称为引用参数，是因为被调用的函数可以直接引用对应的参数。具体来说，函数被允许检查*并修改*调用者的参数。\n\
  \n当使用引用参数调用函数时，传递给函数的是参数的*位置*（内存地址）而不是它的值。信息只存在一份拷贝，并由调用者和函数共同使用。参数和变量是内存中同一位置的同义词。如果函数给参数分配了一个新值，它也更改了参数。因此，当函数返回时，参数的内容可能已经发生了，而这在值参数中是不可能的（参见**图\
  \ 8.3**](#9781284166033_CH08_04.xhtml_c8-fig0003)).\n\n![两幅说明使用引用参数访问参数的图。](img/9781284166033_CH08_FIGF03.jpg)\n\
  \n图 8.3 使用引用参数访问参数\n\n描述\n\n在使用引用参数时必须小心，因为对它进行的任何更改都会影响调用代码中的参数。这里有一个函数头和调用的示例：\n\
  \n![函数头参数与函数调用之间参数之间关系的插图。](img/9781284166033_CH08_436.jpg)\n\n描述\n\n对于高亮的参数，`floatVar`\
  \ 和 `charVar` 的*地址*分别被传递给 `num1` 和 `letter`。由于 `num2` 是值参数，它接收存储在 `intVar` 中的值。\n\
  \n值参数和引用参数之间的另一个重要区别涉及参数与参数的匹配。对于值参数，我们提到会发生隐式类型转换。（如果可能，参数的值会被强制转换为参数的数据类型。）相比之下，引用参数要求匹配的项必须具有*完全相同*的数据类型。而且由于传递给引用参数的参数是可以更改的，它必须是一个变量。与值参数不同，我们不能向引用参数传递常量或表达式。\n\
  \n在本章前面的部分，我们讨论了模块中数据流方向的文档记录。对应 Out 和 In/out 模块参数的函数参数必须在其类型后加上 & 符号。我们不会在 In 上加上\
  \ & 符号。\n\n下表总结了用法。\n\n| 项目 | 用法 |\n| :--- | :--- |\n| 参数 | 出现在函数调用。对应的参数可以是引用参数或值参数。\
  \ |\n| 值参数 | 出现在函数头。接收对应参数的拷贝，必要时将进行转换。其参数可以是变量、常量或表达式。 |\n| 引用参数 | 出现在函数头。接收对应参数的*地址*。其对应类型必须附加\
  \ **&**。参数类型必须与参数类型完全匹配，且它必须是一个变量。 |\n\n### 关于参数和参数列表的最后告诫\n\n程序员有责任确保参数列表和参数列表在语义上和语法上都是匹配的。例如，假设我们是这样编写\
  \ `LoanCalculator` 程序的。你能发现错误吗？\n\n![部分程序列表。](img/9781284166033_CH08_443.jpg)\n\n\
  描述\n\n最后一个函数调用中的参数列表在数量和类型上与参数列表匹配，因此没有语法错误。然而，输出将是错误的，因为前两个参数交换了。如果一个函数有两个相同数据类型的参数，你必须小心参数的顺序。\n\
  \n在书中后面，你将学习如何编写多文件程序并在物理上隐藏实现。在此期间，我们自觉避免编写依赖函数内部机制的代码。\n\n### 将断言作为函数文档\n\n我们一直在非正式地讨论前提条件和后条件，但可以将正式的前提条件和后条件作为注释来记录函数接口。这是一个示例：\n\
  \n![一个程序片段。](img/9781284166033_CH08_445a.jpg)\n\n描述\n\n前提条件是一个描述函数在调用时必须为真的所有要求的断言。后条件描述了在函数执行结束时已经发生了什么。\n\
  \n\n\n\n你可以将前条件（precondition）和后条件（postcondition）看作一份合同。该合同规定，如果在函数入口时前条件为真，则在函数退出时后条件必须为真。`caller`（调用者）负责确保前条件，而\
  \ `function body`（函数体）必须确保后条件。如果调用者未能满足其部分的合同部分（前条件），函数将无法保证后条件为真。\n\n在前面的示例中，前条件警告调用者要确保\
  \ `sum` 已分配了一个有意义的值，并且 `count` 为正数。如果此前条件为真，函数保证将满足后条件。如果在调用 `OutputAverage` 时 `count`\
  \ 不是正数，则该模块的效果是未定义的。（例如，如果 `count` 等于 0，后条件显然无法无法满足——模块会崩溃！）\n\n有时，调用者在调用函数之前不需要满足任何前条件。在这种情况下，可以省略前条件。在下面的示例中，没有必要的前条件：\n\
  \n![程序段。](img/9781284166033_CH08_446.jpg)\n\nDescription\n\n3 这个说法并不是全部事实。C++ 有一种特殊的语言特性——称为\
  \ `default parameters`（默认参数），允许你用少于参数数量的参数调用函数。本文没有介绍默认参数。\n\n### 图形用户界面 (GUI)\n\
  \n本章介绍了函数作为软件工程和良好程序设计的一个方面的抽象价值。在案例研究中，我们将问题分解为独立的函数。在本节中，我们将更改之前定义的函数代码以使用 GUI\
  \ 控件。正如你所看到的，大多数函数保持不变；只有那些需要用户交互的函数被修改了。函数不仅是将程序分解为各个部分的强大机制，而且对于设计与实现的分离至关重要，这种分离能够实现未来的修改。\n\
  \n在本节中，我们只关注修改的函数和引入任何新函数。注意使用函数如何让我们将 GUI 的集中在应用程序的一个较部分。我们需要引入三个新函数来处理用户交互的方面。以下是这些函数的原型：\n\
  \n![3 个函数原型。](img/9781284166033_CH08_458.jpg)\n\nDescription\n\n`GetInputFileName`\
  \ 函数将询问用户包含账单信息的文件名，`GetOutputFileName` 将提示用户生成报告的文件，而 `GetHourlyRate` 函数将让用户输入小时率。`GetInput-FileName`\
  \ 和 `GetOutputFileName` 函数都得到了一个 `string` 引用参数，函数将在其中分配用户的响应。让我们先看看原始的 `main` 函数：\n\
  \n![程序段。](img/9781284166033_CH08_458a.jpg)\n\nDescription\n\n我们首先声明小时率、输入和输出文件名的重要变量。接下来，我们调用\
  \ `OpenFiles`，将 `inFile` 和 `outFile` 的引用作为参数。`OpenFiles` 的目标是询问用户输入和输出文件，并将新文件分配给\
  \ `inFile` 和 `outFile`。之前的程序要求用户输入名称。我们的新程序将使用 GUI 控件。这是我们新版本的 `OpenFiles` 函数：\n\
  \n![程序段。](img/9781284166033_CH08_459.jpg)\n\nDescription\n\n我们修改了此函数以包含第三个参数，用于指示打开文件是否成功，这在我们从此函数返回并需要确定是否正确打开了文件时非常有用。我们还包含了对\
  \ `GetInputFileName` 和 `GetOutputFileName` 的调用，它们将创建相应的 GUI 控件与用户交互。`GetInputFileName`\
  \ 函数非常直观：\n\n![程序段。](img/9781284166033_CH08_459a.jpg)\n\nDescription\n\n我们创建了一个\
  \ `FileDialog` 控件，允许用户选择包含草坪维护账单信息的输入文件。然后 `GetOutputFileName` 函数询问用户输出文件：\n\n![程序段。](img/9781284166033_CH08_459b.jpg)\n\
  \nDescription\n\n![一个列出“草坪维护账单案例研究”标记的文件夹内容的 GUI 控件。](img/9781284166033_CH08_460.jpg)\n\
  \nDescription\n\n在本节中，我们使用一个名为 `NewFileDialog` 的 GUI 控件。`NewFileDialog` 与 `FileDialog`\
  \ 类似，它允许你选择文件；然而，`NewFileDialog` 还有一个标记为“Save”（保存）的按钮。这里是两个 GUI 控件：\n\n![程序段。](img/9781284166033_CH08_460.jpg)\n\
  \nDescription\n\n\n\n\n![一个用于草坪维护服务公司计算并编写账单的程序的图形界面（GUI）版本的延续。](img/9781284166033_CH08_463.jpg)\n\
  描述\n![一个用于草坪维护服务公司计算并编写账单的程序的图形界面（GUI）版本的延续。](img/9781284166033_CH08_464.jpg)\n\
  描述\n![一个用于草坪维护服务公司计算并编写账单的程序的图形界面（GUI）版本的延续。](img/9781284166033_CH08_465.jpg)\n\
  描述\n![一个用于草坪维护服务公司计算并编写账单的程序的图形界面（GUI）版本的延续。](img/9781284166033_CH08_466.jpg)\n\n\
  ### 测试与调试\n\n函数声明的参数和调用者传递给函数的参数必须符合函数的接口。函数中发生的错误通常由于对接口的使用不当。\n\n错误的一个来源是形参和实参数列表不匹配。C++\
  \ 编译器会确保这些列表具有相同数量且类型兼容的项。然而，程序员有责任验证每个实参数列表是否包含正确的项。我们必须在每次调用函数时都将参数声明与参数列表进行对比。如果函数头为每个参数都提供了独特的名称，并在必要时通过注释进一步描述了其用途，那么这项工作就会简单得多。通过使用描述性的变量名来准确指示正在传递给函数的具体信息，你可以避免实参数列表中的错误。\n\
  \n另一个错误来源是未能确保在调用函数之前满足其前置条件。例如，如果一个函数假设在调用时输入文件未到达文件末尾（EOF），那么调用代码必须在调用之前确保该假设成立。如果函数的行为异常，请检查其前置条件，然后追溯程序执行到调用点以验证该前置条件。你可能会在一个正确的函数中寻找错误而浪费大量时间，而错误实际上在于程序设置调用的方式。\n\
  \n如果参数与形参匹配且前置条件已正确建立，那么错误源很可能在函数本身。追溯函数以验证它是否将前置条件转换为后置条件。确定所有局部变量是否都已正确初始化。本应向调用者返回数据的参数必须声明为引用参数（在数据类型名称后带有\
  \ `&` 符号）。\n\n调试函数的一个重要技术是使用系统的调试器（如果可用的话）来单步执行函数的运行。如果没有可用的调试器，你可以插入调试输出语句，在调用函数之前和之后立即显示参数的值。显示函数内部局部变量的值也可能有所帮助。这些信息提供了函数的快照（即函数在特定时刻状态的快），这对于验证手动追踪（hand\
  \ traces）非常有用。\n\n为了彻底测试一个函数，你必须安排输入值，使前置条件被推向极限；然后必须验证后置条件。例如，如果一个函数要求参数在某个范围内，请尝试使用该范围中间的数值和极值来调用该函数。\n\
  \n### `assert` 库函数\n\n我们已经讨论了函数的前置条件和后置条件对于调试和测试有多么有用。为了说明函数的前置条件和后置条件，我们一直将它们写成注释：\n\
  \n![注释。两个正斜杠。Pre、冒号、空格、学生数量 大于 0。](img/9781284166033_CH08_467.jpg)\n\n当然，编译器会忽略注释。它们不是可执行语句；它们是给人类检查的。\n\
  \nC++ 标准库还为我们提供了编写*可执行断言*的方法。通过 `cassert` 头文件，该库提供了一个名为 `assert` 的空函数。该函数接受一个逻辑（布尔）表达式作为参数，如果表达式为\
  \ `false`，则会停止程序。这是一个示例：\n\n![程序代码。](img/9781284166033_CH08_468.jpg)\n描述\n\n`assert`\
  \ 函数的参数必须是一个有效的 C++ 逻辑表达式。如果其值为 `true`，则什么都不会发生；执行将继续。如果其值为 `false`，程序的执行将立即终止，并显示一条消息，说明\
  \ (1) 参数列表中出现的断言，(2) 包含源代码的文件名，以及 (3) 程序中的行号。在上述述示例中，如果 `studentCount` 的值小于或等于 0，程序将在显示如下消息后停止：\n\
  \n![程序停止时显示的消息。断言失败、冒号、学生 数量 大于 0、逗号、文件 my p r o g dot c p p、逗号、行 48。](img/9781284166033_CH08_468.jpg)\n\
  \n（此消息并不意味着 `studentCount` 大于 0。事实上，它恰恰相反。）\n\n可执行断言相对于以注释表示的断言具有巨大的优势：断言的效果是可见的。如果断言为假，错误消息会给出精确的行号。还有一种方便的方法禁用断言而无需删除它们。在\
  \ `include` 之前插入预处理器指令 `#define NDEBUG`，如下：\n\n![预处理器指令。第 1 行：hash define NDEBUG。第\
  \ 2 行：hash include、左括号、assert、右括号。第 3 行：点、点、点。](img/9781284166033_CH08_468.jpg)\n\
  \n这样当你运行程序时，所有对 `assert` 函数的调用都会被忽略。（NDEBUG` 代表“无调试”，而 `#define` 指令是一种我们现在不会讨论的预处理器功能。）程序测试完成后，你可以通过在\
  \ `#define NDEBUG` 前加上 `//` 来开启检查。\n\n尽管 `assert` 函数很有用，但它有两个局限性。首先，函数的参数必须表示为 C++\
  \ 逻辑表达式。我们可以将如下注释转换为逻辑表达式：\n\n![两个注释。第 1 行：两个正斜杠。yearly Interest 大于 0.0 AND。第 2\
  \ 行：两个正斜杠。number Of Years 小于或等于 30。](img/9781284166033_CH08_468c.jpg)\n\n通过以下语句转换为可执行断言：\n\
  \n```cpp\nassert(0.0 <= yearlyInterest && numberOfYears <= 30);\n```\n\n![一个语句。assert、左括号、0.0\
  \ 小于或等于 yearly Interest、两个与符号、numberOf Years 小于或等于 30、右括号、分号。](img/9781284166033_CH08_468d.jpg)\n\
  \n相反，没有简单的方法可以将如下注释转换为 C++ 逻辑表达式：\n\n![两个注释。第 1 行：两个正斜杠。文件包含贷款金额、逗号。第 2 行：两个正斜杠。利率、逗号、以及年数、句号。](img/9781284166033_CH08_468e.jpg)\n\
  \n```\n\n\n\n第二个局限性是，`assert` 函数仅适用于开发中的程序测试。生产环境程序（已向公众发布的程序）必须向用户提供有用的错误消息。你可以想象，如果程序突然退出并显示这样的错误消息，用户会感到多么困惑：\n\
  \n\n\n\n\n![一条错误信息。断言失败，冒号，sys Res，小于或等于 res Count，逗号，file new p r o j dot c p p，逗号，第\
  \ 298 行。](img/9781284166033_CH08_469.jpg)\n\n尽管有这些限制，你仍应该考虑将 `assert` 作为测试和调试的常用工具。\n\
  \n### 测试与调试\n\n1. 编写函数时，请务必遵循文档指南（参见附录 F）。随着程序变得越来越复杂，遵守文档和格式标准变得越发重要。为函数的先置条件（如果有）和后置条件添加注释，并为所有作用不直观的参数和局部变量添加解释其用途的注释。\n\
  \n2. 在程序顶端为每个函数提供一个函数原型。确保该原型与其对应的函数头完全匹配（原型末尾的分号除外）。\n\n3. 确保每个函数原型都以以分号结尾，而每个函数头均不结尾。因为人们经常互相复制粘贴这两者，所以很容易在其中一个上犯错。\n\
  \n4. 确保参数列表给出了每个参数的数据类型。\n\n5. 除非结果通过参数返回，否则请使用值参数。引用参数可以更改调用者参数的内容；而值参数则不能。然而，文件名必须是引用参数。\n\
  \n6. 在参数列表中，确保每个引用参数的数据类型都以地址符（`&`）结尾。如果没有地址符，该参数就是值参数。\n\n7. 确保每个函数调用的参数列表在数量和顺序上与参数列表匹配，并非常小心地处理数据类型。编译器会捕获参数数量不匹配的情况。然而，如果数据类型不匹配，编译器可能不会给出错误信息。使用值参数传递时，类型不匹配会导致隐式类型转换，而不是编译时错误。\n\
  \n8. 请记住，匹配引用参数的参数必须是一个变量，而值参数的参数可以是任何提供相同数据类型值的表达式（提示 7 中另有说明外）。\n\n9. 在尝试定位错误源时，请熟悉所有可用的工具——算法走演、手动跟踪、系统调试器程序、`assert`\
  \ 函数以及调试输出语句。\n\n![一张森林中树的照片。](img/Chapter-opener.jpg)\n\n章节导读：© Joost Lagerweij/EyeEm/Getty\
  \ Images.\n\n## 第 9 章\n\n作用域、生存期以及函数\n\n![一张从家里到办公室的路径图。](img/9781284166033_CH09_484.jpg)\n\
  \n随着程序的变大，其中的标识符数量随之增加。我们使用了更多的函数、变量和常量标识符。某些标识符在块内部声明；另一些——例如函数名——则声明在任何块之外。本章将研究\
  \ C++ 的规则，这些规则允许函数访问在其块之外声明的标识符。通过这些规则，我们回到在第 8 章中开始的接口设计讨论。\n\n接下来，我们查看*返回值函数*。与通过参数列表返回结果（如果有）的\
  \ `void` 函数不同，返回值函数将单个结果——即函数值——返回给调用它的表达式。在本章中，我们将学习如何编写此类函数。\n\n## 9.1 标识符的作用域\n\
  \n记住，局部标识符是在块内部（例如函数体）声明的标识符，它们无法在包含它们的块之外被访问。\n\n任何块——而不只是函数体——都可以包含标识符声明。例如，这个\
  \ `if` 语句包含一个声明局部变量 `number` 的块：\n\n![一个 `if` 语句。](img/9781284166033_CH09_484a.jpg)\n\
  \n描述\n\n与任何其他局部标识符一样，`number` 不能被包含其定义的块之外的任何语句访问。它在块内其之后的所有语句中都是定义的，而在块之外定义是未定义的。\n\
  \n如果我们列出所有可以合法访问标识符的地方，我们就会描述该标识符的*可见性作用域*或*访问作用域*，通常简称为它的`scope`。\n\nC++ 为任何标识符定义了若干类作用域。我们首先从描述其中三类开始。\n\
  \n1. *类作用域*：该术语指的是称为*类*（class）的数据类型，我们在第 4 章中简单提到过它。我们将对类作用域的详细讨论推到第 12 章。\n\n2.\
  \ *局部作用域*：在块内部声明的标识符的作用域从声明点延伸到该块的结束。同样，函数参数的作用域从函数头延伸到函数体的结束。你可以将参数的作用域看作是与在函数体中其他任何内容之前声明的局部变量是一样的。\n\
  \n3. *全局作用域*：在所有函数和类之外声明的标识符的作用域从声明点延伸到包含它的整个文件的结束。\n\nC++ 函数名具有全局作用域。（我们在第 12 章\n\
  \n描述\n\n当函数声明一个与全局标识符同名的局部标识符时，局部标识符在函数内部优先。这一原理被称为`命名优先级`或`命名隐藏`。\n\n这里有一个使用全局和局部声明的示例：\n\
  \n![使用全局和局部变量的代码。](img/9781284166033_CH09_485a.jpg)\n\n描述\n\n在示例中，函数 `SomeFunc`\
  \ 访问全局常量 `A` 但声明了自己的局部变量 `b` 和参数 `c`。因此输出为\n\n![使用全局和局部变量的程序的输出。第 1 行：大写 A 等于 17，空格，小写\
  \ b 等于 2.3，空格，小写 c 等于 42.8。](img/9781284166033_CH09_486a.jpg)\n\n![使用全局和局部变量的代码延续。](img/9781284166033_CH09_486.jpg)\n\
  \n描述\n\n局部变量 `b` 优先于全局变量 `b`，从而在 `SomeFunc` 的语句中隐藏了全局 `b`。参数 `c` 也阻止了函数内部对全局变量 `c`\
  \ 的访问。在这方面，函数参数与局部变量一样；即参数具有局部作用域。\n\n### 作用域规则\n\nC++ 程序员很少声明全局变量。使用它们有负面影响，稍后我们会讨论。当你迫切需要全局变量时，了解\
  \ C++ 如何处理它们是有益的。标识符的可访问规则被称为`作用域规则`。\n\n除了局部和全局访问，C++ 作用域规则还定义了块嵌套时的情况。当一个块包含一个嵌套块时，外部块中声明的任何内容对于内部块都是**非局部**的。（全局标识符对于所有块都是非局部的。）\n\
  \n\n\n\n\n以下是详细的作用域规则，排除类作用域以及我们尚未讨论的某些语言特性：\n\n1. 函数名具有全局作用域。函数定义不能嵌套在函数定义内部。\n\
  \n2. 函数参数的作用域与函数体最外层块中声明局部变量的作用域相同。\n\n3. 全局变量或常量的作用域从其声明处延伸到文件结束，规则 5 规定的除外。\n\n\
  4. 局部变量或常量的作用域从其声明处延伸到其所在块结束。此作用域包括任何嵌套块，规则 5 规定的除外。\n\n5. 标识符的作用域不包含任何包含同名局部声明标识符的嵌套块。（局部标识符具有命名优先级。）\n\
  \n这里有一个演示 C++ 作用域规则的示例程序。为了简化示例，只列出了声明和标题。注意位于函数 **Block2** 内部的标记为 **Block3** 的\
  \ While 循环体包含了它自己的局部变量声明。\n\n![演示变量作用域的程序。](img/9781284166033_CH09_487.jpg)\n\n\
  描述\n\n让我们从 `ScopeRules` 程序定义的块的角度来看它，并看看这些规则的具体含义。**图 9.1** 显示了 `ScopeRules` 程序中的标题和声明，可见性作用域用框标出。\n\
  \n框内的任何内容都可以引用周围框内的任何内容。不允许从外部向内部引用。因此，`Block3` 中的语句可以访问在 `Block2` 中声明的任何标识符或任何全局变量。`Block3`\
  \ 中的语句无法访问在 `Block1` 中声明的标识符，因为它必须从外部进入 `Block1` 框。\n\n注意，函数的参数位于函数的框内，但函数名本身在框外。如果函数名在框内，则一个函数无法调用另一个函数。这一点仅说明了函数名具有全局作用域。\n\
  \n想象图 9.1 中的框是由于双向镜制成的墙构成的房间，反射面朝外，透明面朝内。如果你站在 `Block3` 房间里，你将能够透过周围所有的房间看到全局变量的声明（以及其间的任何内容）。然而，你无法看到任何其他房间（如\
  \ `Block1`），因为它们的镜像外表面会阻挡你的视线。由于这种类比，“可见的”（visible）一词常用于描述访问作用域；例如，变量 `a2` 在整个程序中都是可见的，这意味着可以在任何地方访问它。\n\
  \n![作用域图。](img/9781284166033_CH09_FIGF01.jpg)\n\n图 9.1 作用域程序的作用域图\n\n描述\n\n然而，图\
  \ 9.1 并没有说明全部；它只代表了作用域规则 1 到 4，而没有包含规则 5。变量 `a1` 在三个不同的地方声明。由于命名优先级规则，`Block2` 和\
  \ `Block3` 访问的是在 `Block2` 中声明的 `a1`，而不是全局 `a1`。同样，在 `Block2` 中声明的变量 `b2` 的作用域*并不*包含由\
  \ `Block3` 中声明变量 `b2` 产生的“洞”。\n\n命名优先级规则由编译器按如下实现：当表达式引用标识符时，编译器首先检查局部声明。如果标识符不是局部的，编译器将向外遍历每一层嵌套，直到找到具有同名的标识符。它在该处停止。如果在更靠外的层级声明了同名的标识符，则它永远不会被访问。\n\
  \n如果编译器到达了全局声明（包括由 `#include` 指令插入的标识符）但仍然找不到该标识符，则会发出如 `UNDECLARED IDENTIFIER`\
  \ 的错误消息。此类消息最可能表示拼写错误或大小写不正确，也意味着该标识符在引用它之前未声明，或者根本没有声明。它也可能表明块的嵌套导致标识符的作用域不包含该引用。^(1)\n\
  \n### 变量声明与定义\n\n在第 8 章中，你学习了 C++ 区分函数的声明和定义。定义会预留内存空间，而声明不会。\n\nC++ 对变量声明应用相同的术语。如果一个变量声明也为变量预留了内存，则该声明就变成了变量定义。我们目前为止看到的所有变量声明都是变量定义。如果一个变量声明*不是*定义，它会是什么样呢？\n\
  \n在第 8 章中，我们讨论了多文件程序。C++ 有一个关键字 `extern`，它允许你引用位于另一个文件中的全局变量。如下所示定义\n\n![一个语句。int\
  \ some Int，分号。](img/9781284166033_CH09_487.jpg)\n\n会导致编译器为 `someInt` 预留内存位置。相比之下，之前的\n\
  \n![extern some Int，分号。](img/9781284166033_CH09_489.jpg)\n\n被称为*外部声明*。它表示 `someInt`\
  \ 是位于另一个文件的全局变量，且在此不保留存储。在 C++ 术语中，这是一个声明而不是 `someInt` 的定义。在 C++ 中，你可以多次声明变量，但只能定义一次。\n\
  \n在不需要区分声明和定义的情况下，我们将继续使用更通用的术语*变量声明*而不是具体的*变量定义*。\n\n### 命名空间\n\n一段时间以来，我们一直在程序中包含以下\
  \ `using` 指令：\n\n![using name space t d，分号。](img/9781284166033_CH09_490.jpg)\n\n\
  在第 2 章中，我们注意到如果没有这个指令，我们必须使用限定名来引用 `cout`\n\n![std 冒号，冒号，out。](img/9781284166033_CH09_490a.jpg)\n\
  \n现在我们探索了作用域的概念，可以回答这个问题：什么是命名空间？它是程序员创建具名作用域的机制。^(2) 例如，标准头文件 `cstdlib` 包含了几个库函数的原型，其中之一是绝对值函数\
  \ `abs`。这些声明包含在*命名空间定义*中：\n\n![代码片段。](img/9781284166033_CH09_490b.jpg)\n\n描述\n\n\
  命名空间定义由 `namespace` 单词、一个程序员选择的标识符以及大括号之间的*命名空间体*组成。在命名空间体内声明的标识符被认为具有*命名空间作用域*。除了使用三种方法外，这些标识符无法在体外访问。\n\
  \n第一种是使用限定名：命名空间名称、后跟作用域解析运算符（`::`）、最后所需的标识符。例如：\n\n![代码片段。](img/9781284166033_CH09_490c.jpg)\n\
  \n描述\n\n我们告诉编译器我们指的是在 `std` 命名空间中声明的 `abs`，而不是其他 `abs`（例如我们可能自己编写的名为 `abs` 的函数）。\n\
  \n第二种方法是使用如下的 **using** *声明*语句：\n\n\n\n\n\n![带有 using 声明的程序。](img/9781284166033_CH09_491.jpg)\n\
  \n描述\n\n这些 `using` 声明允许在 `main` 函数的体体内使用标识符 `abs` 和 `cout`，它们分别作为较长的 `std::abs`\
  \ 和 `std::cout` 的别名。\n\n第三种方法——我们熟悉的用方法——是 `using` 指令（它与 `using` 声明不同）：\n\n![带有\
  \ using 指令的程序。](img/9781284166033_CH09_491a.jpg)\n\n描述\n\n通过 `using` 指令，来自指定命名空间的*所有*\
  \ 标识符都是可访问的，但仅限于该指令出现的作用域内。在前面的代码段中，`using` 指令位于局部作用域（块内），因此来自 `std` 命名空间的标识符仅在\
  \ `main` 内部可用。如果我们将 `using` 指令放在所有函数之外（正如我们一直这样做的那样），如下：\n\n![带有 using 指令的程序。](img/9781284166033_CH09_491b.jpg)\n\
  \n描述\n\n那么 `using` 指令就在全局作用域中；使得来自 `std` 命名空间的标识符在全局范围内可用。\n\n在全局作用域中放置 `using`\
  \ 指令是为了方便。例如，我们编写的所有函数都可以引用如 `abs`、`cin` 和 `cout` 等标识符，而我们不需要在每个函数中都插入 `using` 指令。\n\
  \n在创建大型多文件程序时，创建全局 `using` 指令被认为是一个坏主意，因为那时程序员通常会使用多个库。两个或多个库可能仅仅纯巧地为不同的用途使用了相同的标识符。此时全局\
  \ `using` 指令会导致*命名冲突*（同一标识符的多次定义），因为所有库标识符都在同一个全局作用域中。（C++ 程序员将此称为“污染全局命名空间”。）\n\
  \n我们继续对 `std` 命名空间使用全局 `using` 指令，是因为我们的程序相对较小，因此不太可能命名冲突。此外，`std` 命名空间中的标识符非常常用，大多数\
  \ C++ 程序员都会避免重复定义它们。\n\n考虑到命名空间作用域的概念，我们对 C++ 作用域分类的描述如下：\n\n1. **类作用域（Class scope）：**\
  \ 该术语指的是*类*数据类型，我们在第 12 章中讨论过它。\n2. **局部作用域（Local scope）：** 在块内部声明的标识符的作用域从声明处延伸到该块的结束。同样，函数参数（形式参数）的作用域从声明处延伸到作为函数主体的块的结束。\n\
  3. **命名空间作用域（Namespace scope）：** 在命名空间定义中声明的标识符的作用域从声明处延伸到命名空间体的结束，*并且*它的作用域包含了指定该命名空间的任何\
  \ `using` 指令的作用域。\n4. **全局（或全局命名空间*）作用域（Global scope）：** 在所有命名空间、函数和类之外声明的标识符的作用域从声明处延伸到包含程序代码的整个文件的结束。\n\
  \n请注意，这些是作用域分类的通用描述，而不是作用域规则。这些描述没有考虑到名称隐藏（name hiding）。\n\n1 C++ 提供了绕过名称优先级的语法，即使在局部声明了同名标识符时，也能访问全局标识符。我们可以使用\
  \ `::` 运算符而不必指定命名空间。例如，如果我们声明了一个名为 `A1` 的局部常量，我们可以写成 `::A1` 来引用名为 `A1` 的全局常量。\n\n\
  2 从通用概念上说，*命名空间*（namespace）是*作用域*（scope）的另一种说法。在这里我们将其视为一种特定的 C++ 特性。\n\n## 9.2\
  \ 变量的生命周期\n\n作用域规则决定了标识符在何处*可访问，但每个标识符还有一个属性称为**生命周期**（lifetime）——即在程序执行期间实际*何时*被分配内存的时间段。局部变量的存储在函数被调用时创建（分配）。在函数执行期间，变量保持“活跃”状态，而当函数退出时，存储被回收（释放）。相比之下，全局变量的生命周期是整个程序的执行过程。它的内存在程序开始执行时分配，并在程序终止时释放。请注意，作用域是一个*编译时*属性，而生命周期是一个*运行时*属性。\n\
  \n在 C++ 中，**自动变量**（automatic variable）的存储在进入块时分配，在离开块时释放。**静态变量**（static variable）的存储在整个程序运行期间分配。所有全局变量都是静态的。默认情况下，在块内声明的变量是自动的。但是，你可以在声明局部变量时使用关键字\
  \ `static`，这样它的值就会从一次函数调用持续到下一次调用。\n\n下一个程序包含一个记录其被调用次数的函数。输出所示。\n\n![带有 using 声明的程序。](img/9781284166033_CH09_491.jpg)\n\
  \n描述\n\n### 声明中的初始化\n\n我们在程序中最常见的操作之一是先声明变量，然后在另一个语句中赋值初始值。这是一个典型的例子：\n\n```cpp\n\
  int sum;\nsum = 0;\n```\n\n正如我们在第 8 章中所看到的，C++ 允许你将这两个语句合并。结果被称为*声明中的初始化*。在这里我们在声明的一部分初始化了\
  \ `sum`：\n\n```cpp\nint sum = 0;\n```\n\n在声明中，指定初始值的表达式被称为*初始化值*（initializer）。在前句中，初始化值是\
  \ `0`。如果初始化值和变量的数据类型不匹配，会发生隐式类型转换。\n\n自动变量在每次进入块时都会初始化为指定的值：\n\n![代码片段。](img/9781284166033_CH09_494b.jpg)\n\
  \n描述\n\n相比之下，静态变量（全局变量或声明为静态的局部变量）的初始化只发生一次——即第一次到达声明处时。这里有一个示例，局部静态变量在函数第一次被调用时初始化：\n\
  \n![代码片段。](img/9781284166033_CH09_494c.jpg)\n\n描述\n\n初始化只是给变量一个初始值；我们可以在执行期间对其重新赋值另一个值。\n\
  \n## 9.3 接口设计\n\n现在回到接口设计问题，我们在我们在第 8 章](#9781284166033_CH08.xhtml）中开始过的。回顾通过模块接口的数据流可以采取的形式：输入（In）、输出（Out）和输入输出（In/out）。任何纯输入项应该是值参数。剩余两类（输出和输入输出）中的项必须是引用参数；函数向调用者参数发送结果的唯一方法是使用它们的地址。\n\
  \n\n\n\n\n有时，人们会很想跳过接口设计步骤，让一个模块通过全局变量与其他模块进行通信。不要这样做！如果没有有意识的接口设计，你实际上是在创建一个结构糟糕且缺乏文档的接口。除非在理由充分的情况下，否则使用全局变量是一种糟糕的编程习惯，可能会导致程序错误。这些错误极难定位，并且通常表现为非预期的副作用。\n\
  \n### 副作用\n\n假设你在程序中调用了库函数 `sqrt`：\n\n![一条语句。y 等于 s q r t，左括号（，x，右括号），，分号。](img/9781284166033_CH09_499.jpg)\n\
  \n描述\n\n你期望 `sqrt` 的调用只执行一件事：计算变量 `x` 的平方根。如果 `sqrt` 也改变了你的变量 `x` 的值，你会感到很惊讶，因为根据定义，`sqrt`\
  \ 不会发生这种更改。这种结果将是意想不到且不必要的`副作用`的示例。\n\n副作用可能是引用参数和函数中粗心的编码共同导致的。如果函数代码尝试将引用参数当作普通变量使用，它可能会无意中改变调用代码中参数的值。正如我们所说的，值参数通过防止更改传递到参数来避免这种类型的副作用。我们在上一个软件维护案例研究中见过这方面的例子。\n\
  \n当函数访问全局变量时，也可能发生副作用。例如，如果你忘记声明一个局部变量，而恰好有一个同名的全局变量，编译器不会报告错误。但当函数在无意中改变全局变量时，你就会遇到副作用。错误直等到函数返回且调用者访问全局变量后才会出现。由于\
  \ C++ 中非局部作用域的工作机制，每个函数都具有产生这种副作用的潜力。\n\n副作用错误特别难找，因为问题出现在程序的一个部分，而其原因却在另一个可能完全不相关的的部分。每个程序员都经历过这样的体验：试图隔离一个逻辑上不通、甚至违反了编程语言规则的\
  \ bug。当你开始认为一个错误是编译器的 bug 时，你可能正在处理一个副作用 bug！\n\n鉴于这些错误具有挑战性，避免此类错误是最佳策略。模块应该具有的唯一外部影响是通过结构良好的参数列表接口传递信息（参见图\
  \ 9.2）。更明确地说：*模块中使用的变量应该应该是参数或是局部变量。* 此外，*输入参数应该是值参数*。这种方法将每个模块与程序的其他部分隔离开，从而防止副作用发生。当一个模块没有副作用时，我们可以将其视为独立代码并在其他程序中重用它。带有副作用的模块几乎是不可重用的。\n\
  \n![一张说明副作用错误的框图。](img/9781284166033_CH09_FIGF02.jpg)\n\n图 9.2 副作用\n\n描述\n\n下方的\
  \ `Trouble` 程序可以运行，但由于全局变量和副作用产生了错误的结果：\n\n![一个糟糕程序设计的插图。](img/9781284166033_CH09_500.jpg)\n\
  \n描述\n\n![糟糕设计的程序的延续。](img/9781284166033_CH09_501.jpg)\n\n描述\n\n`Trouble` 程序本应该输出每行输入中整数的个数。作为最终输出，它应该显示行数。但每当程序运行时，它报告的行数都与最后一行中的整数个数相同。你的第一个想法应该是仔细检查\
  \ `main`，看在计算行数时是否存在逻辑错误。但 `main` 中的算法是没问题的。bug 可能在哪里呢？问题在于 `CountInts` 函数使用全局变量\
  \ `count` 来存储整数计数。程序员可能本打算声明一个名为 `count` 的局部变量但忘记了。\n\n此外，没有理由让 `count` 成为全局变量。如果在\
  \ `main` 中声明了局部变量 `count`，那么编译器将报告 `CountInts` 使用了未声明的标识符。如果在 `main` 和 `CountInts`\
  \ 中都声明了名为 `count` 的局部变量，程序就能正常工作。这两个变量之间没有冲突，因为每个变量只在自己的块内可见。\n\n这种副作用错误很容易定位，因为我们只只有一个另一个函数需要检查。在一个包含成百上千个函数的程序里，确定哪一个导致了\
  \ `main` 行为异常要困难得多。\n\n`Trouble` 程序还展示了不访问全局变量规则的一个常见例外。从技术上讲， `cin` 和 `cout` 是在头文件\
  \ `iostream` 中声明的全局对象。`CountInts` 函数直接访问它们。为了完全隔离 `CountInts`，应该将 `cin` 和 `cout`\
  \ 作为参数传递。然而，`cin` 和 `cout` 是 C++ 中的基础 I/Oset，因此根据惯例，函数经常直接访问它们。\n\n### 全局常量\n\n\
  与你可能认为的不同，在全球范围内引用常量是可以接受的。由于常量的值不会改变，不会产生副作用。全局引用常量有两个优点：易于更改一致性。修改一个全局声明比在每个函数中修改局部声明要容易得多。\n\
  \n并不是说你应该将*所有*常量都全局化。如果常量只在一个函数中使用，则在局部声明。\n\n到这里，你可能想转向本章末尾的问题案例研究，它进一步阐述了接口设计和参数的使用。\n\
  \n## 9.4 返回值的函数\n\n到目前为止我们专注于编写 void 函数。现在我们转向返回值的函数。你已经在 C++ 标准库中熟悉了此类函数：`sqrt`、`abs`、`fabs`\
  \ 等。从调用者的角度来看，void 函数和返回值的函数的主要区别在于如何被调用。void 函数的调用是一个完整的语句；返回值的函数是在表达式内调用的。\n\n\
  从设计的角度来看，返回值的函数用于模块只有一个结果，且该结果被直接用于表达式。让我们来看一个例子。C++ 标准库没有提供 `int` 值的幂函数，所以我们自己写一个。该函数接收两个整数\
  \ `number` 和 `n`（其中 `n` 大于等于 0），并计算 `number^n`。一个简单的解决方案是反复乘以 `number`。由于迭代次数是知的，计数循环是合适的。循环从\
  \ `n` 的初始值递减到 0。在每次迭代中，将之前的乘积乘以 `number`。\n\n![名为 Power 的函数定义。](img/9781284166033_CH09_504.jpg)\n\
  \n描述\n\n第一个注意到的是标题是以数据类型 `int` 开头的，而不是 `void` 单词。第二个注意到的是结尾处的 Return 语句，它包含一个整数表达式。\n\
  \n\n\n\n返回值的函数返回一个值——不是通过参数，而是通过 `Return` 语句。标题开头的的数据类型声明了函数返回的值的类型。这种类型被称为`函数类型`（function\
  \ type），尽管更准确的术语是`函数值类型`（或`函数返回类型`或`函数结果类型`）。\n\n**图 9.3** 显示的程序调用了函数 `Power`。`Power`\
  \ 函数中的最后一条将结果作为函数值返回。\n\n你现在已经看到了 `Return` 语句的两种形式。这种形式\n\n![语句。return, 分号。](img/9781284166033_CH09_504a.jpg)\n\
  \n*仅*在 `void` 函数有效。它会导致控制立即返回到调用者。相比之下，另一种形式\n\n![语句。return, 表达式, 分号。](img/9781284166033_CH09_504b.jpg)![函数调用返回的插图。](img/9781284166033_CH09_FIGF03.jpg)\n\
  \n图 9.3 将函数值返回给调用函数的表达式\n\n描述\n\n*仅*在返回值的函数有效。它将控制返回给调用者，并将 `Expression` 的值作为函数值传。（如果\
  \ `Expression` 的类型与函数类型不同，其值将被强制转换为函数类型。）\n\n在第 8 章中，我们提供了一个 `void` 函数定义的语法模板。现在我们更新该语法模板，以涵盖\
  \ `void` 函数和返回值的函数：\n\n![函数定义的语法模板。](img/9781284166033_CH09_505.jpg)\n\n描述\n\n如果\
  \ `DataType` 是单词 `void`，则该函数是 `void` 函数；否则，它是返回值的函数。注意语法模板中的阴影，`DataType` 是可选的。如果你省略了函数的数据类型，则假设数据类型为\
  \ `int`。我们提到这一点是因为你有时会遇到缺少 `DataType` 的程序。许多程序员认为这是糟糕的编程风格。\n\n返回值函数的参数列表与 `void`\
  \ 函数的形式相同：一个由逗号分隔的参数声明列表。此外，返回值的函数原型看起来和 `void` 函数的原型完全一样，只是它的开头是一个数据类型而不是 `void`。\n\
  \n还记得你朋友那个 Bug 很多的程序吗？`LineCount` 函数使用引用参数来返回文件的行数。它应该是一个返回值的函数，其中返回值为行数。该更改需要以下步骤：\n\
  \n1. 在函数 `LineCount` 的原型中将单词 `void` 替换为单词 `int`。\n2. 从参数列表中移除 `count`。\n3. 在函数定义中进行相同的更改。\n\
  4. 声明一个局部变量来计数。\n5. 返回行计数变量的值。\n6. 从主程序中移除 `count` 的声明。\n7. 在输出语句中插入对 `LineCount`\
  \ 的调用。\n8. 修正文档。\n\n这是重写了 `LineCount` 的程序。更改的行已涂上阴影。\n\n![读取文件并输出行号以及每行字符数的程序。](img/9781284166033_CH09_506.jpg)\n\
  \n描述\n\n### 完整示例\n\n让我们来看另一个问题。假设我们正在编写一个程序，为学期中退学的学生按比例退还学费。退款金额为总学费乘以学期的剩余比例（剩余天数除以学期天数）。用户希望输入学期开始和结束的日期以及退学日期。\n\
  \n由于该学校的每个学期都在同一个历年内开始和结束，我们可以通过确定每个日期的天数并用结束天数减去起始天数来计算一段时间内的天数。天数是自年初开始计算的天数，1\
  \ 月 1 日为第 1 天。12 月 31 日是第 365 天，闰年除外为 366 天。例如，如果一个学期于 23/1/3 开始并于 23/5/17 结束，计算如下：\n\
  \n- 23/1/3 的天数是 3。\n- 23/5/17 的天数是 137。\n- 学期长度为 137 - 3 + 1 = 135。\n我们在差值上加 1，是因为我们将第一天计入该时期内。\n\
  \n计算日期天数的算法由于闰年和不同长度的月份而变得复杂。让我们看看调用代码是什么样子，假设我们有一个名为 `Day` 的返回值的函数，它返回某个日期的天数：\n\
  \n![Day 函数的调用代码。](img/9781284166033_CH09_507.jpg)\n\n\n\n返回值模块的接口非常直观。我们只需要列出该模块需要的内容和它必须返回的内容即可。因为返回值模块只返回一个值，因此列表中只有一个标记为“Out”（输出）的项：即返回值。列表中的其他所有内容都标记为“In”（输入），并且没有标记为“In/out”（输入/输出）的项。\n\
  \n从返回值模块返回多个值（通过修改调用者的参数）是一种副作用，因此应该尽量避免。如果你的接口设计要求返回多个值，那么你应该使用 `void` 函数而不是返回值的函数。\n\
  \n一个经验之法则是：避免在返回值模块的参数列表中使用引用参数，而仅使用值参数。让我们来看一个演示了该规则重要性的函数。假设我们定义了以下函数：\n\n![Side\
  \ Effect 函数的定义。](img/9781284166033_CH09_513a.jpg)\n\n描述\n\n该函数返回其输入值的平方，但在返回之前还递增了调用者的参数。现在，假设我们用以下语句调用该函数：\n\
  \n![一条语句。y 等于 x 加 Side Effect(x)，分号。](img/9781284166033_CH09_513b.jpg)\n\n如果 `x`\
  \ 原本为 2，那么存储在 `y` 中的值是多少？答案取决于编译器生成代码评估该表达式的顺序。如果编译后的代码先调用函数，那么答案是 7。如果它在准备将 `x`\
  \ 加到函数结果之前先访问 `x`，那么答案就是 6。这种不确定性正是为什么你不应该在返回值的函数中使用引用参数的原因。会导致不可预测结果的函数在编写良好的程序中没有立足之地。\n\
  \n该规则的一个例外是模块使用 I/O 流对象作为参数。回想一下 C++ 要求流对象必须作为引用参数传递。请记住，在函数内部读取文件或写入文件实际上是一种副作用，并且应该在后置条件（postcondition）中明确说明。\n\
  \n在返回值函数定义中仅使用值参数的另一个优势：你可以使用常量和表达式作为参数。例如，我们可以使用字面量和其他表达式来调用 `IsTriangle` 函数：\n\
  \n![一个 if-else 语句。](img/9781284166033_CH09_513c.jpg)\n\n描述\n\n### 何时使用返回值的函数\n\n\
  没有正式的规定规定何时使用 `void` 函数对比返回值的函数，但这里有一些指南：\n\n1. 如果模块必须返回多个值或修改调用者的任何参数，请不要使用返回值的函数。\n\
  2. 避免使用返回值的函数执行 I/O。如果必须这样做，请在后置条件中明确记录该副作用。\n3. 如果模块只返回一个值且该值是布尔值，那么返回值的函数是合适的。\n\
  4. 如果只返回一个值且该值立即用于表达式中，那么返回值的函数是合适的。\n5. 如果不确定，使用 `void` 函数。你可以通过添加一个额外的输出参数来携带计算结果，并将任何返回值的函数重写为\
  \ `void` 函数。\n6. 如果 `void` 函数和返回值的函数均可，请使用你觉得实现起来更舒服的形式。\n\nC++ 包含返回值的函数，是为了提供一种模拟数学函数概念的方法。C++\
  \ 标准库通过头文件 `cmath` 提供了一组常用的数学函数。这些函数的列表出现在附录 C 中。\n\n## 9.5 赋值、参数传递和函数值返回中的类型转换\n\
  \n通常情况下，值从一种类型到另一种类型的提升（promotion）不会导致信息丢失。将提升想象比搬进更大的房子。你所有的家具都能放得下，还有余地。相比之下，值的降级（demotion）或窄化（narrowing）可能会丢失信息。降级就像搬进较小的房子——某些东西必须被扔掉。\n\
  \n考虑赋值操作\n\n![v = e](img/9781284166033_CH09_514a.jpg)\n\n其中 `v` 是变量，`e` 是表达式。关于\
  \ `v` 和 `e` 的数据类型，有三种可能性：\n\n1. 如果 `v` 和 `e` 的类型相同，则不需要类型转换。\n2. 如果 `v` 的类型比 `e`\
  \ “高”，则 `e` 的值在存储到 `v` 之前会被提升为 `v` 的类型。\n3. 如果 `v` 的类型比 `e` “低”，则 `e` 的值在存储到 `v`\
  \ 之前会被降级为 `v` 的类型。\n\n以下是降级丢失信息的一些示例：\n\n* 从较长的整数类型降级到较短的整数类型（例如从 `long` 降到 `int`）会丢弃二进制数中最左侧（最高）位。结果可能是一个完全不同的数字。\n\
  * 从浮点类型降级到整数类型会导致小数部分的截断（如果整数部分无法放入目标变量，则产生未定义的结果）。\n* 从较长的浮点类型降级到较短的浮点类型（例如从 `double`\
  \ 降到 `float`）可能会导致精度丢失。\n\n我们对赋值操作中类型转换的描述也适用于参数传递和返回返回值。例如，假设你机器上的 `INT_MAX` 为\
  \ 32767，并且有以下函数：\n\n![一个函数定义。bool Check(float temp)。](img/9781284166033_CH09_515.jpg)\n\
  \n描述\n\n如果用以下语句调用函数\n\n![一个函数调用。Something(50000)；](img/9781284166033_CH09_515a.jpg)\n\
  \n那么值 50000（它是 `long` 类型因为大于 `INT_MAX`）会被降级为较小的 `int` 值。类似地，执行函数\n\n![一段代码片段。](img/9781284166033_CH09_515b.jpg)\n\
  \n描述\n\n会导致值 70000 降为 `int` 值，因为 `int` 是函数返回值的类型。\n\n隐式类型转换的一个有趣的后果是，将变量声明为无符号并希望编译器阻止你犯下错误：\n\
  \n![一条语句。unsigned Var = -5；](img/9781284166033_CH09_515c.jpg)\n\n编译器完全不会报错。它生成代码将\
  \ `int` 值转换为无符号 `int` 值。但如果你现在显示 `unsignedVar` 的值，你会看到一个看起来很的正整数。正如我们之前指出的，在普通的数值计算中最好避免使用\
  \ `unsigned`。\n\n为了安全起见，尽可能避免隐式转换！\n\n### 测试与调试\n\n模块化设计的优势之一是，你可以在编写所有模块代码之前就开始测试。如果我们单独测试每个模块，在将模块组合成完整程序时，就会更有信心它是正确的。在本节中，我们将介绍一种单独测试模块的方法。\n\
  \n### 存桩（Stub）与驱动程序（Driver）\n\n假设给了你一个模块的代码，你的工作是测试它。你如何单独测试一个模块？首先，它必须被某些东西调用（除非它是\
  \ `main` ）。其次，它可能会调用对你不可见的其他模块。为了测试该模块，你必须填充这些缺失的环节。\n\n\n\n\n当模块包含对其他模块的调用时，我们可以编写称为\
  \ `stubs`（存桩）的虚拟函数来满足这些调用。存桩通常包含一个输出语句，显示诸如“某个函数刚刚被调用”之类的的消息。尽管存桩是虚拟的，但它能允许我们判断该函数是否由\
  \ `main` 或另一个函数在正确的时间被调用。\n\n存桩还可以用于显示传递给它的值集；此类输出可以告诉我们被测试的模块是否提供了正确的信息。有时，存桩会给它的引用参数分配新值，以模拟返回结果，从而为调用模块提供可以可以继续工作的数据。由于我们可以选择存桩返回的值，因此我们对测试条件有更好的控制。\n\
  \n这里是一个存桩，它通过返回一个任意名称来模拟 `Profile` 程序中的 `Name` 函数：\n\n![一个标记为 Name 的函数存桩。](img/9781284166033_CH09_527.jpg)\n\
  \n描述\n\n这个存桩比它模拟的函数要简单得多，这是很典型的，因为我们使用存桩是为了为测试模块提供一个可预测的环境。\n\n除了为模块内的每个调用提供存桩外，你还必须提供一个虚拟程序——`driver`（驱动程序）来调用模块本身。驱动程序包含了执行调用所需的最少代码。\n\
  \n通过驱动程序和存桩包围模块，你获得了对其执行条件的完全控制权。这允许你测试不同的情况和组合，这些组合可能会暴露错误。你为模块编写一个测试计划，然后由驱动程序来实现该测试计划。\n\
  \n这里是 `Profile` 程序中 `EvaluateCholesterol` 函数的测试计划和驱动程序。该测试计划基于编写该函数时所使用的解释准则。每个类别都取一次。案例研究后续练习\
