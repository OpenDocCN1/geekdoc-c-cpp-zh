  \n\n\n\n在第 3 章中，我们介绍了 C++ 字符串类型以及相关函数，例如 `length()`。在本节中，我们将介绍一种基于数组的替代字符串表示方法，以及针对该实现的特定操作。\n\
  \n## 作为数组的字符串\n\n正如我们在第 1 章中所提到的，C++ 编程语言是早期 C 编程语言的超集。C 只有一种表示字符串的原始机制：即字符数组。C++\
  \ 继承了 C 对所有数组风格字符串表示形式的支持。\n\n从抽象意义上说，*字符串*可以被视为字符数组。例如，字符串“dogs”可以被看作字符‘d’、‘o’、‘g’、‘s’的序列。以下\
  \ C++ 代码是设置该序列数组的一种方式：\n\n![将字符串声明为字符数组。](img/9781284166033_CH11_P615-1.jpg)\n\n\
  描述\n\n我们声明了一个包含四个 `chars` 的数组，并为每个元素分配字符串“dogs”的字符。虽然这种方法可行，但非常繁琐。幸运的是，也可以使用字面量符号来声明\
  \ C 风格字符串：\n\n![使用字符串字面量符号声明字符串。char, my string, 左括号, 右括号, 等号, 双引号, dogs, 双引号, 分号。](img/9781284166033_CH11_P615-2.jpg)\n\
  \n然而，这个版本与之前的方法之间存在一个重要的区别。该数组的长度不是 4，而是 5。额外的元素包含一个*空字符*，用于指示字符串的结束。空字符用特殊序列 `'\\\
  0'` 表示。因此，要在不使用字符串字面量符号的情况下*真正*声明一个 C 风格字符串，我们需要写成：\n\n![不使用字符串字面量符号声明字符串。](img/9781284166033_CH11_P615-3.jpg)\n\
  \n描述\n\n此数组声明与使用字符串字面量符号创建数组完全对应。\n\nC 没有提供内置的字符串处理功能（初始化 `char` 数组除外）。相比之下，C++\
  \ 的 `string` 数据类型提供了丰富的操作，例如 `substr()`。\n\n## C 字符串操作\n\n虽然 C 风格字符串不如其 C++ 对应版本丰富，但在\
  \ `string.h` 头文件中有很多实用的操作。下表显示了提供的一些函数示例：\n\n| 函数 | 描述 |\n| --- | --- |\n| `size_t\
  \ strlen(const char *s);` | 计算字符串 `s` 的长度。 |\n| `int strcmp(const char *s1, const\
  \ char *s2);` | 字典顺序比较字符串 `s1` 和 `s2`，并返回一个大于、1 于或小于 0 的整数。 |\n| `char* strncat(char\
  \ *s1, const char *s2, size_t n);` | 将字符串 `s2` 的 `n` 个字符的副本追加到字符串 `s1` 的末尾。字符串 `s1`\
  \ 必须足够长以容结果。返回指向新字符串的指针。 |\n| `char* strncpy(char *s1, const char *s2, size_t n);`\
  \ | 将字符串 `s2` 的 `n` 个字符复制到字符串 `s1`。返回指向新字符串的指针。 |\n| `char* strchr(const char *s,\
  \ int c);` | 在字符串 `s` 中定位字符 `c` 第一次出现的位置。返回该字符在字符串中位置的指针。 |\n| `char* strstr(const\
  \ char *s1, const char *s2);` | 在字符串 `s1` 中定位字符串 `s2` 第一次出现的位置，并返回该字符串起始位置指针。 |\n\
  \n需要注意的是，C 风格字符串是*可变的*。例如，将字符赋值给字符串中的任何位置将用你指定的字符*覆盖*掉该位置的字符。同样，表中的许多字符串操作都会覆盖其参数。例如，`strncpy`\
  \ 会覆盖它的第一个参数。此外，由于 C 风格字符串只是指针，在使用 `strncat` 等函数时必须非常小心。`strncat` 函数要求其第一个参数*必须足够长*以容纳追加第二个参数的结果。记住\
  \ C++ 不会检查数组边界，因此如果数组太短，结果将覆盖字符串结束之外的内存，可能导致崩溃。\n\n## 将 C 字符串转换为 C++ 字符串\n\n在 C++\
  \ 中编程最终会涉及到使用需要 C 风格字符串的库。我们可能需要调用一个需要 C 风格字符串参数的函数，或者一个返回 C 风格字符串的函数。将 C 风格字符串转换为\
  \ C++ 字符串很容易。有一个构造函数可以从 C 字符串创建 C++ 字符串：\n\n![一个代码片段。第 1 行: char, 星号, c dog, 等号,\
  \ 双引号, dog, 双引号, 分号。第 2 行: string, 左括号, 右括号, 分号。](img/9781284166033_CH11_P616.jpg)\n\
  \n```\nchar *cdog = \"dog\";\nstring s(cdog);\n```\n\n## 字符串表示法\n\n既然有两种字符串表示方法，哪种更好？大多数情况下，你应该选择\
  \ C++ `string`，因为它更安全。当你必须使用 C 风格字符串时，很容易相互转换。\n\n## 1.2 记录数组\n\n许多应用程序涉及记录的集合；例如，企业需要记录列表，老师需要学生列表。数组对于这些应用程序是理想的。\n\
  \n### 记录数组\n\n在第 10 章中，我们使用 `struct` 定义了一个学生记录。假设现在我们需要这些记录的集合。我们如何实现“集合”？我们可以声明一个记录数组。为了让情况变得有趣，让我们添加一个自定义类型\
