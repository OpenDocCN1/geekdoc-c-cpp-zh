  ### 添加应用程序状态\n\n现在 GUI 已经就绪，我们将其与应用程序的状态（存储的信息）连接起来——即通过以下代码：\n\n```\n![代码片段。](img/9781284166033_CH15_P944-1.jpg)\n\
  ```\n\n描述\n\n```\n![代码片段。](img/9781284166033_CH15_P944-2.jpg)\n```\n\n描述\n\n```\n\
  ![代码片段。](img/9781284166033_CH15_P945.jpg)\n```\n\n描述\n\n```\n![代码片段。](img/9781284166033_CH15_P945-1.jpg)\n\
  ```\n\n描述\n\n\n\n\n\n在上一章节中，我们讨论了 `EventHandlers` 类，它用于处理 GUI 中按钮被点击时发生的事件。该类的目的是将事件处理与\
  \ GUI 界面本身的实现分离开。在本应用程序中，我们将事件处理代码直接包含在 `AppointmentCalendarWindow` 类的实现内部。有许多方法可以实现事件处理器以及将它们连接到由\
  \ GUI 组件生成的事件上。在这种情况下，我们选择遵循 Qt 开发者建议的方法，这对于本应用程序来说是最直观的。\n\n编写事件处理接口有三个方面：知道哪些事件可能会发生，知道当每个事件发生时应用程序需要做什么，以及知道在响应事件时必须更改程序状态的哪个部分（如果有的话）。本应用程序有三个我们关心的事件，每个事件都将触发一个操作。我们将使用以下列表来指导实现工作：\n\
  \n1. 当点击预约条目列表中的某一项被点击时（事件），应用程序将把表单条目设置为对应的预约数据（操作）。应用程序将记住点击了列表中的哪一项，以及用于将该数据加载到表单的预约日历条目（状态更改）。\n\
  2. 当点击保存（Save）按钮时（事件），应用程序将从表单获取可能被编辑的数据，并执行验证检查以确保所有表单字段都不为空。如果任何字段为空，它将显示错误消息并返回。如果数据有效，它将检查这些数据是否与当前存储的数据有所不同。如果没有差异，它将显示相应的消息并返回（操作）。如果数据已发生变化，它将从预约日历中删除现有条目，使用表单中的数据在预约日历中创建一个新条目，并更新\
  \ GUI 中的列表小部件（状态更改）。\n3. 当点击退出（Exit）按钮时（事件），应用程序将关闭（操作，无显式状态更改）。\n\n我们首先通过扩展 `AppointmentCalendarWindow`\
  \ 类的定义，为上述列表中的每个事件处理器添加方法原型。Qt 框架将事件处理器称为“槽”（slots），并扩展了 C++ 语言以指定特定方法为槽（事件处理器）方法，这些将用于处理事件。以下是我们需要添加到\
  \ `AppointmentCalendarWindow` 类中的代码：\n\n![一个代码片段。](img/9781284166033_CH15_P947.jpg)\n\
  Description\n\n这些方法对于该类是私有的，并使用“slots”语法标识。最后两个方法原型没有参数，因为我们稍后会在代码中将特定按钮连接到适当的处理器。然而，由于我们不知道预约条目列表中会被点击的是哪一项，`HandleEntryItemClickedEvent`\
  \ 方法将接收被点击的特定项作为参数。正如我们的清单所提醒的那样，我们还添加了两个成员变量，用于记住被点击的当前小部件项以及与之对应的预约条目。当我们讨论处理器方法方法的实现时，使用这些变量的作用将变得显而易见：\n\
  \n![两个语句。](img/9781284166033_CH15_P947-1.jpg)\nDescription\n\n最容易实现的事件处理器是 `HandleExitButtonClickedEvent`\
  \ 方法，因为它只需要做一件事：关闭应用程序。以下是它的实现：\n\n![一段程序代码。](img/9781284166033_CH15_P947-2.jpg)\n\
  Description\n\n该方法非常直接——它只是调用此 `AppointmentCalendarWindow` 对象的 `close` 方法，由 Qt 框架处理\
  \ GUI 应用程序的退出。一旦实现了每个处理器，我们就能看到如何将处理器连接到事件。\n\n我们考虑的下一个处理器是 `HandleEntryItemClickedEvent`\
  \ 方法及其要求。该处理器的目标是根据在列表中点击的名称加载关联预约数据到表单。如果你还记得，我们之前通过创建 `QListWidgetItem` 并将其显示文本设置为预约条目中人员的姓和名，在\
  \ GUI 中创建每个列表条目。然而，我们没有将其他预约数据与之一并保存。我们可以在 GUI 列表中显示每个条目的的所有预约数据，但这将非常混乱，并重复表单将显示的内容。\n\
  \n`QListWidgetItem` 类确实提供了与其他数据相关联的支持。遗憾的是，我们只能将 Qt 对象与列表项相关联。因此，我们的解决方案是将预约条目转换为\
  \ Qt 对象，并将其存储在 `QListWidgetItem` 中。当用户点击它时，我们将在 `HandleEntryItemClicked-Event` 处理器中访问预约数据。\n\
  \n在查看事件处理器的实现之前，我们需要重构代码以将其余预约数据添加到 GUI 列表中。以下是 `LoadList-Widget` 方法的新实现，其中更改部分已高亮显示：\n\
  \n![一个代码片段。](img/9781284166033_CH15_P948.jpg)\nDescription\n\n对于日历中的每个条目，我们都创建一个新的\
  \ `QListWidgetItem`。在之前的实现中，我们将显示的字符串传递给构造函数。在这里，我们通过 `setText` 方法设置文本。首先，我们从条目获取名称以构造列表小部件将渲染的字符串。\n\
  \n接下来，我们希望将预约数据与 `QListWidgetItem` 相关联，以便在 `HandleClicked` 方法中检索它们。我们无法使用 `EntryWithDate`\
  \ 对象，因为 `QListWidgetItem` 只允许我们提供一个 Qt 对象。然而，Qt 确实提供了一种名为 `QString` 的自己的字符串类型，我们可以轻松从内置\
  \ C++ 字符串实例化它。\n\n我们唯一需要做的就是能够将预约表示为字符串。我们通过扩展 `EntryWithDate` 类添加一个 `ToString`\
  \ 方法来实现这一点，该方法返回预约条目的字符串表示。返回的字符串只是 `EntryWithDate` 中包含的数据项（例如姓、名、日、小时等），并用空格分隔。我们还添加了一个名为\
  \ `FromString` 的静态类方法，它将预约条目的字符串表示转换为 `EntryWithDate` 对象。这些方法的实现非常直接，所以我们不会在这里展示它们，但它们在在本节末尾的代码列表中。一旦我们将预约条目转换为标准\
  \ C++ 字符串，再次使用 Qt 的静态类方法 `fromStdString` 将其转换为 `QString`。这就是前面代码中这两行所完成的工作：\n\n\
  ![两个语句。](img/9781284166033_CH15_P949.jpg)\nDescription\n\n现在我们解释接下来的两行，它们负责将此字符串放入列表项。列表小部件中的项可以许多不同的属性，例如显示字体、背景颜色等。Qt\
  \ 将这些属性中的每一个称为具有该项行为的角色（role）。它还提供了一个通用的角色，称为 `Qt::UserRole`，让我们能够使用 `setData` 方法在项中存储关联的数据值。然而，在调用\
  \ `setData` 之前，我们的 `QString` 值还需要进行最后一次类型转换。\n\n\n\n\nQt 需要能够灵活地将不同类型的值传递给方法，因此设计师开发了一种可以包含许多不同数据类型的联合体（union）类型。请记住，联合体有点像结构体（struct），它拥有一系列成员变量，但在任何给定时刻，它只能包含各种可能的值类型中的一种。因此，Qt\
  \ 设计师将他们的联合体类型称为 `QVariant`。而它可以包含的许多 Qt 类型之一就是 `QString`。正如你可能已经猜到的那样，`setData`\
  \ 方法期望接收一个 `QVariant` 类型的参数。\n\n因此，我们只需通过将条目的 `QString` 表示形式传递给其构造函数来构造一个新的 `QVariant`。然后，我们就可以使用\
  \ `setData` 将条目数据存储在列表中，并指定数据的角色为 `Qt::UserRole`，提供该 `QVariant` 对象。\n\n![两条语句。](img/9781284166033_CH15_P949-1.jpg)\n\
  \n描述\n\n最后，我们将该项添加到列表部件中。我\n\n![一条语句。名称列表部件，减号，右角括号，添加项，左括号，项，右括号，分号。](img/9781284166033_CH15_P949-2.jpg)\n\
  \n现在每个列表项内部都包含了预约数据，我们可以将注意力回到 `HandleEntryItemClicked` 事件处理程序的实现上。请记住，当用户点击某一项时，处理程序会通过在表单中显示条目数据，并记住哪一项被加载到表单以及该条目包含的内容做出响应。以下是它的代码：\n\
  \n![代码片段。](img/9781284166033_CH15_P949-3.jpg)\n\n描述\n\n![代码片段延续。](img/9781284166033_CH15_P950.jpg)\n\
  \n描述\n\n所有的脚架已经就绪，该方法的实现变得显而易见。首先，如果 GUI 上由于之前的操作显示了任何消息，我们希望将其清除。我们将在查看保存按钮的事件处理程序时看到这是如何发生的。接下来，我们获取与项部件关联的预约条目。我们通过调用它的\
  \ `data` 方法并传递 `Qt::UserRole` 值来实现此，以便它返回我们与项关联的数据。返回值的类型是 `QVariant`，我们需要将其转换为\
  \ `QString`，然后可以使用 `toStdString` 将其转换为 C++ 字符串。接着，将该字符串传递给 `EntryWithDate` 类的静态方法\
  \ `FromString`，该方法会将其转换回 `EntryWithDate` 对象。我们通过将条目传递给 `SetFormFromEntry` 方法来填充表单，接下来我们将展示该方法的定义。最后，我们将\
  \ `currentItemLoaded` 变量设置为我们刚刚点击的项，并将 `currentEntry` 设置为从列表项中提取的条目。我们需要记住这两个值，以防表单字段被修改并点击了保存按钮。\n\
  \n正如你从前文所预期的那样，从我们的条目获取数据到表单将涉及将每个条目成员转换为对应的 Qt 类型，然后设置表单字段以显示这些转换后的值。由于其中几个转换是到\
  \ `QString` 的，我们将仅定义一个该类型的变量 `qs`，用于在每个值进入表单的过程中临时临时存储。以下是 `SetFormFromEntry` 方法的实现：\n\
  \n![部分程序代码。](img/9781284166033_CH15_P950-1.jpg)\n\n描述\n\n该方法的第一部分非常直观。我们从条目中提取 `Name`、`Date`\
  \ 和 `TimeOfDay` 对象。然后将名称的部分转换为 `QString` 对象，并用于设置表单中每个相应字段的显示文本。\n\n日期时间部件需要一些额外的类型转换。它期望一个包含日期和时间的\
  \ `QDateTime` 对象。然而，Qt 并没有提供直接构建 `QDateTime` 的构造函数。相反，我们需要使用来自 `Date` 对象的年、月、日创建一个\
  \ `QDate` 对象，并使用从 `TimeOfDay` 对象得到的时、分、秒创建一个 `QTime` 对象。然后，我们终于从这些 `QDate` 和 `QTime`\
  \ 对象创建一个 `QDateTime` 对象。这种对象类型的分层设计是面向对象设计中的常用方法，其目标是让每个对象拥有一组非常特定的职责。\n\n我们需要的最后一个事件处理程序是\
  \ `HandleSaveButtonClickedEvent`。该处理程序的动作是验证没有空表单字段，如果有则显示错误消息；如果没有需要保存的更改则警告用户；将预约的任何更改保存到显示给用户的列表部件中；将更改保存到日历预约列表中；并将新的日历预约列表写回日历文件。幸运的是，此时我们已经涵盖了许多\
  \ Qt 细节，因此该方法的实现应该是显而易见的。\n\n![片段。](img/9781284166033_CH15_P951.jpg)\n\n描述\n\n![程序片段延续。](img/9781284166033_CH15_P952.jpg)\n\
  \n描述\n\n为了完成对 `HandleSaveButtonClickedEvent` 方法的理解，我们现在讨论此处所示的 `GetEntryFromForm`\
  \ 方法的实现：\n\n![代码片段。](img/9781284166033_CH15_P952-1.jpg)\n\n描述\n\n通过调用表单中每个相应 `QLineEdit`\
  \ 对象的 `text` 方法来获取名称部分的 C++ 字符串。`text` 方法返回 `QString`，我们使用 `toStdString` 方法将其转换为\
  \ C++ 字符串。然后这些字符串被用于构造 `Name` 对象。接着，我们调用 `QDateTimeEdit` 部件的 `date` 和 `time` 方法，分别返回\
  \ `QDate` 和 `QTime` 对象。从这些对象中，我们使用命名良好的观察者方法提取日期和时间的各个部分，然后使用这些部分来创建我们的 `Date` 和\
  \ `TimeOfDay` 对象。最后，我们构造一个 `EntryWithDate` 并将其返回。\n\n\n\n现在我们已经看到了事件处理程序方法的实现，我们需要将它们与调用它们的事件连接起来。Qt\
  \ 框架提供了特殊函数，允许我们将事件连接到事件处理程序。在 Qt 术语中，事件被称为“信号”（signal），正如我们之前提到的，事件处理器占据一个“槽”（slot），事件循环通过该槽来查找特定信号的事件处理器。这种设置是通过一个\
  \ `connect` 方法完成的，我们将在从 `AppointmentCalendarWindow` 构造函数中调用的 `InitializeEventHandlers`\
  \ 方法中调用它：\n\n![代码片段。](img/9781284166033_CH15_P953.jpg)\n\n描述\n\n`connect` 方法有四个参数。第一个是产生信号（事件）的小部件，第二个是信号类型，第三个是处理信号的对象，第四个是要被调用的事件处理器。部件项可以生成的信号类型在与该部件相关的\
  \ Qt 文档中指定。\n\n`QListWidget` GUI 组件可以产生 `itemClicked` 信号，该信号提供指向被点击的 `QListWidgetItem`\
  \ 的指针。我们通过将该信号与我们的 `HandleEntryItemClickedEvent` 信号处理器关联，让 Qt 监听该信号，该处理器接收被点击的 `QListWidgetItem`\
  \ 指针。`QPushButton` 小部件可以产生 `clicked` 信号，因此让 Qt 监听它，并在按钮被点击时调用我们的 `HandleSaveButtonClickedEvent`\
  \ 事件处理器。最后，如果退出按钮产生了 `clicked` 信号，我们的 `HandleExitButtonClickedEvent` 处理器会被调用。Qt\
  \ 在后台做了大量工作来将信号与槽关联，其目的是让我们能够方便地使用 `connect`、`SIGNAL` 和 `SLOT` 函数。\n\n我们在下文中列出了\
  \ `EntryWithDate`（高亮部分）的更改以及 `AppointmentCalendarWindow` 的规范和实现。\n\n![程序段。](img/9781284166033_CH15_P954.jpg)\n\
  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P955.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH15_P956.jpg)\n\
  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P957.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH15_P958.jpg)\n\
