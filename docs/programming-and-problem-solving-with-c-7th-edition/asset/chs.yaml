  此声明创建了一个名为 `value` 且包含 1000 个组件的数组，所有组件均为 `int` 类型。第一个组件的索引为 0，第二个组件的索引为 1，最后一个组件的索引为\
  \ 999。\n\n这里是使用数组表示法的 `ReverseNumbers` 程序。它显然比我们的第一个版本要短得多。\n\n![程序片段。](img/9781284166033_CH11_P591-3.jpg)\n\
  \n描述\n\n这里是一个数组大小为 10 的程序版本的输入和输出，为了节省空间：\n\n![一个具有 2 列的表格。](img/9781284166033_CH11_P592-1.jpg)\n\
  \n描述\n\n作为数据结构，数组与结构体（struct）在两个根本方面有所不同：\n\n1. 数组是同构数据结构（它的组件具有相同的数据类型），而结构体是异构的（它的组件可能具有不同的类型）。\n\
  2. 数组组件通过位置访问，而结构体组件通过成员名称访问。\n\n现在让我们正式定义数组，并查看访问单个组件的规则。\n\n### 声明数组\n\n**一维数组**是组件（通常称为数组元素）的结构化集合，通过指定组件带有索引值的位置来单独访问每个组件。\n\
  \n以下是描述一维数组声明简单形式的语法模板：\n\n![数组声明的语法。数据类型, 数组名, 左方括号, 常量整型表达式, 右方括号, 分号。](img/9781284166033_CH11_P592-2.jpg)\n\
  \n在语法模板中，`DataType` 描述了存储在数组每个组件的内容。数组组件可以是几乎任何类型，但目前我们将讨论限制在原子组件。\n\n![带有 4 个数组组件堆的\
  \ angle 数组和带有 10 个数组组件堆的 testScore 数组。](img/9781284166033_CH11_FIGF11_1.jpg)\n\n\
  描述\n\n图 11.1 angle 和 testScore 数组\n\n在语法模板中，`ConstIntExpression` 是由字面量或命名常量组成的整数表达式。该表达式指定了数组组件的数量，其值必须大于\
  \ 0。如果该值为 *n*，则索引值的范围是从 0 到 *n-1*。例如，\n\n![程序代码。第 1 行: float, angle, 左方括号, 4, 右方括号,\
  \ 分号。第 2 行: int, testScore, 左方括号, 10, 右方括号, 分号。](img/9781284166033_CH11_P593-1.jpg)\n\
  \n创建了图 11.1 所示所示。`angle` 数组有四个组件，每个都能存储一个 `float` 值。`testScore` 数组总共有 10 个组件，均为\
  \ `int` 类型。\n\n### 访问数组的单个组件\n\n正如我们所见，要访问数组组件，我们编写数组名后跟一个方括号中的表达式。该表达式指定了要访问的组件。\n\
  \n![标记为数组组件的表达式。数组名, 左方括号, 索引表达式, 右方括号。](img/9781284166033_CH11_P593-2.jpg)\n\n\
  索引表达式可以简单到常量，也可以复杂到变量、运算符和函数调用的组合，只要结果是整数即可。索引表达式类型可以是 `char`、`short`、`int` 或 `long`，因为这些都是整合类型。此外，枚举类型的值也可以用索引表达式，枚举值会被强制转换为整数。\n\
