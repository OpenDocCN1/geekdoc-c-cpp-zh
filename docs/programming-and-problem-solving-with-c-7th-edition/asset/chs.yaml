  \n描述\n\n## 12.7 组合\n\n两个类通常表现为三种关系之一：独立的、通过继承相关的、或者通过组合相关的。另一种说法是一个类包含了另一个类的对象。\n\
  \n### Entry 类设计\n\n你正在开发一个表示预约簿的程序。每个 `Entry` 对象将有两个字段：一个 `Name` ADT 和一个 `TimeOfDay`\
  \ ADT。因此，我们应该为 `Entry` 类有一个默认构造函数（调用 `Name` 和 `TimeOfDay` 的默认构造函数）以及一个参数构造函数（将其参数传递给\
  \ `Name` 和 `Time` 的构造函数）。\n\n我们现在有足够的信息来编写规范文件了。\n\n![一个程序段。](img/9781284166033_CH12_P725-1.jpg)\n\
  \n描述\n\n![一个程序段。](img/9781284166033_CH12_P726-1.jpg)\n\n实现默认类构造函数只需调用 `Name` 和 `TimeOfDay`\
  \ 对象的默认构造函数。在 C++ 中，这些是自动调用的（尽管为了良好的文档，我们在之前的示例中显式地展示了它们）。因此，我们可以让 `Entry` 的默认构造函数体为空，我们这样做是为了让你看到这种编码风格的示例。\n\
  \n参数构造函数必须将其参数传递给 `Name` 和 `Time` 构造函数。为了这一点，我们使用*构造函数初始化*（constructor initializer）。这种\
  \ C++ 结构允许你传递构建另一个类中声明的对象所需的信息。语法是包含类的构造函数头部，跟着一个冒号 (**:** ) 然后是成员对象的名称，最后是对应成员类参数构造函数的参数列表。如果存在多个构造函数初始化，则用逗号隔开。\n\
