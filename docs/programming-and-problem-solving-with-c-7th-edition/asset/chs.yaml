  \n![程序代码。](img/9781284166033_CH04_UFIG188-1.jpg)\n\n在 Qt Creator IDE 中编译并运行程序，将看到一系列对话框，让你指定\
  \ `Format Names` 程序使用的文件，然后它将从一个文件读取输入并将输出写入另一个文件。\n\n\n\n从这里开始，这些“测试与调试”章节将提供关于如何测试程序的技巧，以及当程序运行不符合预期时该怎么办的建议。但不要等到发现\
  \ bug 后再阅读“测试与调试”章节——预防 bug 比修复它们要容易得多。\n\n在测试从文件接收数据值作为输入的程序时，输入操作导致文件流进入失败状态（fail\
  \ state）。输入失败的两个常见原因为无效数据和文件结束错误（end-of-file error）。\n\n当程序读取了整个文件，但仍需要更多数据来填充输入语句中的变量时，就会发生文件结束错误。这可能是因为数据文件没有准备好。也许它包含的数据项少于程序所需的。或者可能是输入数据的格式错误。例如，在数值之间遗漏空格就会导致这种问题。\n\
  \n例如，假设我们希望数据文件包含三个整数值：25、16 和 42。看看这些数据会发生什么：\n\n![文件中的数据。](img/9781284166033_CH04_PRE54.jpg)\n\
  \n描述\n\n以及这段代码：\n\n![程序代码。](img/9781284166033_CH04_PRE55.jpg)\n\n描述\n\n前两个输入操作消耗了文件中的数据，导致第三个操作没有数据可读。流\
  \ `inFile` 进入了失败状态，因此 `k` 没有被赋予新值，计算机跳到下一条语句而不发出错误信息。\n\n如果数据文件准备正确但仍然发生文件结束错误，那么问题就出在程序逻辑上。由于某种原因，程序尝试了过多的输入操作。错误可能是非常简单的，例如在输入语句中指定了过多的变量。可能是对\
  \ `ignore` 函数的误用，导致值被无意中跳过。也可能是算法中的严重缺陷。你应该检查所有这些可能性。\n\n输入失败的另一个主要来源——无效数据有几种可能的原因。最常见的是数据准备过程中的错误。数值和字符数据不当的混合会导致输入流失败；例如，当读取标记位于非数字字符时，它尝试读取一个数值。另一个原因是使用了错误的变量名（恰好数据类型也错误）。将变量声明为错误的数据类型是该问题的一种变体。最后，在输入语句中遗漏一个变量（或包含一个额外的变量）可能会导致读取标记落在错误类型的数据上。\n\
  \n另一个疏忽是在 I/O 语句中使用了 `cin` 或 `cout`，而你本意是指定文件流。如果你误地使用 `cin` 而不是输入文件流，程序将等待从键盘输入。如果你误地使用\
  \ `cout` 而不是输出文件流，屏幕上将出现意外的输出。\n\n通过提供一个帮助你组织和跟踪设计及实现程序涉及细节的框架，功能分解（以及后面向对象的设计）应该帮助你从源上避免许多错误。\n\
  \n在后面的章节中，你将看到如何单独测试模块。如果你确保每个模块都能独立工作，那么当你将模块组合在一起时，程序应该就能工作。单独测试模块比尝试测试整个程序的工作量少。在较小的代码段中，多个错误不太可能组合产生难以分析的行为。\n\
  \n### 测试与调试提示\n\n1. 输入和输出语句始终以流对象的名称开始，`>>` 和 `<<` 运算符指向数据去的方向。语句\n\n![一个输出语句。](img/9781284166033_CH04_PRE56.jpg)\n\
  \n描述\n\n将数据发送到输出流 `cout`，而语句\n\n![一个输入语句。](img/9781284166033_CH04_PRE57.jpg)\n\n\
  描述\n\n将数据发送到变量 `n`。\n\n2. 当程序从文件输入或向文件输出时，每个指向文件的 I/O 语句都应该使用文件流的名称，而不是 `cin` 或\
  \ `cout`。\n\n3. 与 `ifstream` 或 `ofstream` 对象关联的 `open` 函数需要一个 C 字符串作为参数。参数不能是字符串对象。在本文的此时，参数只能是\
  \ (a) 字面量字符串或 (b) 由函数调用 `mystring.c_str()` 返回的 C 字符串，其中 `mystring` 的类型为 `string`。\n\
  \n4. 当打开数据文件进行输入时，确保 `open` 函数的参数提供了正确的文件名。\n\n5. 将字符串读取到 `string` 对象时，`>>` 运算符停止于第一个尾随空白字符处，但不消耗它。\n\
  \n6. 每个输入语句必须指定正确数量的变量。\n\n7. 如果输入数据是混合的（字符和数值），务必处理中间的空格。\n\n8. 回显输入数据以验证每个值是否正确以及格式是否正确。\n\
  \n\n\n第 1 章中的 `LeapYear` 程序展示了选择过程的工作。计算机必须决定某一年是否为闰年。它通过询问该年份是否不能被 4 整除来实现。如果答案为真，计算机返回一个表示该年份不是闰年的值。如果答案为假，计算机将继续检查通用规则的例外。在第\
  \ 1 章中，我们提到过这种结构就像路上的叉路口。\n\n![路上的叉路口。](img/9781284166033_CH05_227.jpg)\n\n在检查选择控制结构之前，让我们来看看如何让计算机做出决策。\n\
  \n## 5.2 条件与逻辑表达式\n\n要问一个真/假问题，我们并不将其表述为一个问句，而是将其陈述为一个断言。例如，在一个真/假判断题中，你不会看到“2 +\
  \ 2 等于多少？”这个问题。相反，你会看到断言“2 + 2 等于 4”，你可以勾选真或假作为答案。\n\n在 C++ 中提问变成了做出一个为真或为假的断言。计算机会*评估*该断言，通过将其与某些内部条件（例如存储在特定变量中的值）进行比较，以判断它是真是假。\n\
  \n### bool 数据类型\n\n在 C++ 中，`bool` 数据类型是一种内置类型，仅由两个值组成：常量 `true` 和 `false`。关键字 `bool`\
  \ 是 Boolean 的缩写（读作“BOOL-e-un”）。布尔数据用于测试程序中的条件，以便计算机能够做出决策（通过选择控制结构）。\n\n我们声明 `bool`\
  \ 类型的变量的方法与其他类型相同——通过编写数据类型的名称和标识符：\n\n![类型为 bool 的一些变量。](img/9781284166033_CH05_228.jpg)\n\
  \n描述\n\n每个 `bool` 类型的变量都可以包含 `true` 或 `false`。从一开始就理解这一点非常重要：`true` 和 `false` 并不是变量名，也不是字符串。它们是\
  \ C++ 中的特殊常量，事实上它们是保留字。\n\n### 逻辑表达式\n\n在编程语言中，断言的形式为*逻辑表达式*（也称为*布尔表达式*）。正如算术表达式由数值和操作组成一样，逻辑表达式也由逻辑值和操作组成。每个逻辑表达式的评估结果都为\
  \ `true` 或 `false`。\n\n以下是逻辑表达式的一些示例：\n\n*   布尔变量或常量\n*   一个表达式后跟一个关系运算符，再跟一个表达式\n\
  *   一个逻辑表达式后跟一个逻辑运算符，再跟一个逻辑表达式\n\n让我们详细查看每一个项。\n\n#### 布尔变量与常量\n\n正如所见，布尔变量是声明为\
  \ `bool` 类型的变量，它可以包含值 `true` 或值 `false`。例如，如果 `dataOK` 是布尔变量，那么\n\n![一个 bool 赋值语句。](img/9781284166033_CH05_229s.jpg)\n\
  \n描述\n\n是一个有效的赋值语句。\n\n### 关系运算符\n\n我们还可以通过*关系运算符*比较两个表达式，并将结果赋值给布尔变量。关系运算符测试两个值之间的关系，例如小于、等于或大于。\n\
  \n让我们来看一个例子。在下面的代码中，`lessThan` 是一个布尔变量，而 `i` 和 `j` 是 `int` 变量：\n\n![比较 int 变量并将产生的布尔值赋值给布尔变量。](img/9781284166033_CH05_229.jpg)\n\
  \n描述\n\n通过比较两个值，我们断言它们存在某种关系（例如“小于”）。如果关系确实存在，则断言为真；如果不存在，则为假。我们可以在 C++ 中测试以下关系：\n\
  \n| 运算符 | 测试的关系 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n\
  | `<` | 小于 |\n| `>=` | 大于或等于 |\n| `<=` | 小于或等于 |\n\n一个表达式后跟一个关系运算符，再跟一个表达式被称为*关系表达式*。关系表达式的结果类型为\
  \ `bool`。例如，如果 `x` 为 5 且 `y` 为 10，以下表达式的值都为 `true`：\n\n*(注：原文中存在大量重复的片段，已根据核心内容进行了清理和格式化。)*\n\
  \n\n\n\n以下程序显示了比较五组整数值后的输出：\n\n![一个显示比较五组整数值输出的程序。](img/9781284166033_CH05_231a.jpg)\n\
  \n描述\n\n测试运行的输出：\n\n![上述程序测试运行的输出。](img/9781284166033_CH05_231b.jpg)\n\n描述\n\n那些\
  \ 1 和 0 是什么？C++ 将 `true` 存储为值 1，将 `false` 存储为值 0。在章节的后面，我们将向你展示如何将数字 1 和 0 转换为单词“true”和“false”。\n\
  \n## 比较字符串\n\n在 C++ 中，`string` 类型是类示例——一种从该类型中声明称为对象的类型。请记住 C++ 是一门面向对象的语言。在每个 `string`\
  \ 对象中都是一个字符字符串，你可以使用关系运算符对其进行比较。在语法上，关系运算符的操作数可以是两个 `string` 对象，如下所示：\n\n![比较两个字符串变量的表达式。](img/9781284166033_CH05_232.jpg)\n\
  \n描述\n\n也可以是一个 `string` 对象和一个 C 字符串，如下所示：\n\n![一个字符串对象和一个 C 字符串。](img/9781284166033_CH05_232a.jpg)\n\
  \n描述\n\n然而，两个操作数不能同时为 C 字符串。\n\n字符串的比较遵循机器字符集的排序顺序（例如 ASCII）。当计算机测试两个字符串之间的关系时，它从每个字符串的第一个字符开始，根据排序顺序对这些字符进行比较，如果它们相同，则继续对每个字符串的下一个字符重复比较。这种逐字符的测试一直进行，直到发现不匹配或最终字符已比较完毕且相等。如果它们的所有字符都相等，则这两个字符串相等。如果发现不匹配，则字符排在另一个字符之前的字符串即为“较小”的字符串。\n\
  \n例如，给定语句：\n\n![一些字符串赋值。](img/9781284166033_CH05_232b.jpg)\n\n描述\n\n下表中的关系表达式具有指示的值。\n\
  \n| 表达式 | 值 | 理由 |\n| :--- | :--- | :--- |\n| `word1 == word2` | `false` | 它们在第一个字符上不等。\
  \ |\n| `word1 < word2` | `true` | 在排序顺序中，“T’在‘S’ 之后。 |\n| `word1 < “Tremble”` |\
  \ `false` | 第五个字符不匹配，且‘b’在‘e’ 之前。 |\n| `word2 == “Small”` | `true` | 它们是相等的。 |\n\
  | `“cat“ < “dog”` | 不可预测 | 操作数不能同为 C 字符串。 |\n\n在大多数情况下，字符串的顺序与字母顺序对应；然而，当字符串包含大小写混合字母时，我们可能会得到非字母顺序的结果。例如，在联系人列表中，我们期望看到\
  \ Macauley 在 MacPherson 之前，但在 ASCII 排序顺序中，所有大写字母都在小写字母之前，因此字符串 `\"MacPherson\"`\
  \ 的比较结果小于 `\"Macauley\"`，因为 `\"P\"` 小于 `\"c\"`。为了按照严格的字母顺序比较字符串，所有字符必须处于相同的大小写。一旦我们在第\
  \ 6 章引入了循环，`toupper` 和 `tolower` 函数将提供一种将字符串转换为相同大小写的方法。\n\n如果比较两个长度不同的字符串，且比较在短字符串结束之前是相等的，则短字符串的比较结果小于长字符串。例如，如果\
  \ `word2` 包含 `\"Small\"`，则表达式\n\n![一个比较语句。](img/9781284166033_CH05_233.jpg)\n\n\
  描述\n\n产生 `true`，因为字符串在它们的第五字符位置（左侧字符串的结尾）之前是相等，且右侧字符串更长。\n\n*Boolean* 一词是对乔治·布尔（George\
  \ Boole）的致敬，他是一位十九世纪的英国数学家，使用只有两个值（真和假）的变量描述了一种逻辑系统。\n\n## 5.3 If 语句\n\n现在让我们如何使用逻辑表达式来改变控制流。If\
  \ 语句是一种允许我们提问并选择操作的结构：*如果*存在条件，*那么*执行一个操作。\n\n### If-Then-Else 形式\n\n在 C++ 中，If\
  \ 语句有两种形式：If-Then-Else（如果-那么-否则）和 If 形式。让我们先看 If-Then-Else。其语法如下：\n\n![if-else 的语法。](img/9781284166033_CH05_234.jpg)\n\
  \n描述\n\n括号中的表达式可以是任何数据类型。几乎没有例外，它将是一个逻辑（布尔）表达式；如果不是，其值会被强制转换为 bool。在运行时，计算机计算表达式。如果值为\
  \ `true`，计算机执行 then 部分（通常是 if 部分）。\n\n注意 C++ If 使用了关键字 `if` 和 `else`，但不包含单词 *then*。我们使用\
  \ If-Then-Else 术语是因为它符合英语表达习惯：“如果某事发生，*那么*这样做，*否则*做那样。”\n\n以下是程序中的 If 语句。观察 then\
  \ 部分和 else 部分的缩进，这使得语句更易读。还要注意 If 语句的位置。\n\n![使用 if 结构的代码。](img/9781284166033_CH05_234a.jpg)\n\
  \n描述\n\n这段代码有效地表示：“如果 `hours` 小于等于 40，计算基本工资并执行输出语句。但如果 `hours` 大于 40，计算基本工资和加班工资，然后执行输出。”\n\
  \n图 5.4 显示了此 If 语句的控制流。\n\n![If-Then-Else 结构的控制流。](img/9781284166033_CH05_FIGF03.jpg)\n\
  \n图 5.3 If-Then-Else 控制流\n\n描述\n\n![计算工资的控制流。](img/9781284166033_CH05_FIGF04.jpg)\n\
  \n图 5.4 计算工资的控制流\n\n描述\n\n如果我们想检查输入的有效性，If-Then-Else 是自然的选择。例如，在我们要求计算机除数据值之前，应该确保该值不为零。如果除数为零，我们的程序应该显示错误信息。这里是代码：\n\
  \n![当除数为零时显示消息的代码。](img/9781284166033_CH05_235.jpg)\n\n描述\n\n\n\n\n\n作为 If-Then-Else（如果-那么-否则）的另一个示例，假设我们要确定字符串变量中字母\
  \ `A` 第一次出现（如果有的话）以及字母 `B` 第一次出现（如果有的话）的位置。`string` 类有一个名为 `find` 的成员函数，它返回找到项的位置（如果未找到该项，则返回命名常量\
  \ `string::npos`）。以下程序输出了此类搜索的结果，包括一个成功的和一个失败的。\n\n![一个输出项目位置的程序。](img/9781284166033_CH05_235a.jpg)\n\
  \nDescription\n\n![一个输出项目位置的程序。](img/9781284166033_CH05_236.jpg)\n\n这里是程序运行的结果：\n\
  \n![打印项目位置的程序输出。](img/9781284166033_CH05_236a.jpg)\n\nDescription\n\n注意，根据 If-Then-Else\
  \ 的语法模板，If 语句并不是以分号结尾的。然而，在我们目前为止看到的程序片段中，每个 If 语句的末尾似乎都有分号。实际上，这些分号属于 else 子句中的语句。如果\
  \ If 语句本身需要一个分号，那么我们通常会被强制连续写两个分号。\n\n### 块（复合语句）\n\n在我们的除以 0 示例中，假设当除数为 0 时，我们既想显示错误信息，*又*想将名为\
  \ `result` 的变量设为 `9999` 这样的特殊值。我们需要在同一个分支中使用两个语句，但语法模板似乎限制了我们只能使用一个。\n\n我们真正想做的是将\
  \ else 子句变成语句的*序列*。这很容易。编译器将块（复合语句）\n\n![一个代码块。](img/9781284166033_CH05_236b.jpg)\n\
  \nDescription\n\n视为一个单一语句。如果你在 If 语句的分支中为想要的语句序列加上一对 `{ }`，那么该语句序列就变成了一个单一的块。例如：\n\
  \n![一个包含语句块的程序。](img/9781284166033_CH05_236c.jpg)\n\nDescription\n\n如果 `divisor`\
  \ 的值为 0，计算机会在继续执行 If 语句之后的任何语句之前，同时显示错误信息并将 `result` 的值设为 9999。\n\n块可以同时用于 If-Then-Else\
  \ 的两个分支，如下例程序所示。\n\n![一个除以一个数字 并在除数为 0 时显示错误信息的程序。](img/9781284166033_CH05_237.jpg)\n\
  \nDescription\n\n这里是一个成功的示例：\n\n![成功除法数字程序的运行。](img/9781284166033_CH05_237a.jpg)\n\
  \nDescription\n\n这里是一个除法失败的示例：\n\n![除法失败程序的运行。](img/9781284166033_CH05_237b.jpg)\n\
  \nDescription\n\nIf 语句不以分号结尾，块也不以分号结尾，所以记住：*永远不要在块的右括号后面使用分号*。分号只终止如赋值、输入和输出语句等简单语句。\n\
  \n### If-Then 形式\n\n有时你会遇到这样的情况，即你想说：“*如果*存在某个条件，*那么*执行某些操作；否则，什么都不做。”换句话说，你希望计算机在不满足某个条件时跳过一段指令。你可以通过留空\
  \ `else` 分支并只使用空语句来实现这一点：\n\n![if-then 结构.L497+L497](img/9781284166033_CH05_238b.jpg)\n\
  \nDescription\n\n更好的办法是你可以直接省略 `else` 部分。生成的语句就是 If 语句的 If-Then 形式。这是它的语法模板：\n\n\
  ![if 语句的语法模板。if-then 形式。](img/9781284166033_CH05_239.jpg)\n\nDescription\n\n这里是\
  \ If-Then 的示例。注意代码的缩进以及跟随 If 语句的放置。\n\n![if-then 结构。](img/9781284166033_CH05_239a.jpg)\n\
  \nDescription\n\n如果 `age` 小于 18，则输出“eligible”；如果 `age` 大于或等于 18，则输出“not eligible”。\n\
  \n![if-then 结构。](img/9781284166033_CH05_239b.jpg)\n\nDescription\n\n当然，If-Then 可以是一个块。例如，假设你在编写计算税收的程序。如果\
  \ `result` 小于 0，计算机显示消息并将 `result` 设为 0。\n\n![If-Then 语句的控制流. 5。](img/9781284166033_CH05_240a.jpg)\n\
  \nDescription\n\n你可以使用 If-Then 来这样做：\n\n![不带大括号的 if-then 结构。](img/9781284166033_CH05_240b.jpg)\n\
  \nDescription\n\n如果我们省略大括号会发生什么？看这个：\n\n![不带大括号的 if-then 结构。](img/9781284166033_CH05_241a.jpg)\n\
  \nDescription\n\n尽管我们这样缩进了代码，编译器将 then- 分支视为单一语句。如果 `result` 小于 0，计算机执行输出语句，并将 `result`\
  \ 设为 0，然后将 `result` 存入 24。到目前为止还可以。但如果 `result` 大于或等于 0 呢？那么计算机跳过 then- 分支，执行 If\
  \ 语句之后的语句——将 `result` 设为 0 的赋值语句。无论如何，`result` 最终都是 0！\n\n这里的教训不要仅仅依赖缩进。如果你想让 then-\
  \ 或 else 子句成为块，你必须包含大括号。\n\n### 常见错误\n\n早些我们警告过不要混淆 `=` 运算符和 `==` 运算符。这里有一个 C++\
  \ 程序员保证至少犯一次的错误示例：\n\n![错误的赋值。](img/9781284166033_CH05_242.jpg)\n\nDescription\n\
  \n这段代码总是输出\n\n![之前的输出。](img/9781284166033_CH05_243.jpg)\n\nDescription\n\n无论对 `n`\
  \ 输入什么值。\n\n原因如下：表达式 `n = 3` 并不是一个逻辑表达式；它是一个*赋值表达式*。（将赋值表达式作为以分号结尾的独立语句编写，会将其转换为赋值*语句*。）赋值表达式有一个*值*（在这里是\
  \ 3）和一个*副作用*（将 3 存入 **n**）。在我们示例的 If 语句中，计算机发现被测试表达式的值为 3。因为 3 是一个非零值，所以它被强制转换为\
  \ **true**，因此 then- 分支被执行，无论 `n` 的值是多少。更糟糕的是，赋值表达式的副作用是将 3 存入 **n**，破坏了原有的值。\n\n\
  \n\n\n我们的意图并不是关注赋值表达式。现在的重要的是，让你能够看到在原本该使用 `==` 的地方使用了 `=` 时会产生的影响。程序可以正确编译，但运行结果是错误的。在调试故障程序时，请务必检查你的\
  \ `If` 语句，看看是否犯了这种特定的错误。\n\n## 5.4 嵌套 If 语句\n\n`If` 中的语句可以是任何内容没有任何限制。因此，在 `If`\
  \ 内部嵌套一个 `If` 是可以的。事实上，在 `If` 内部再再嵌套一个 `If` 也是合法的。这里唯一的限制是，过于复杂的结构难以追踪，而可读性是衡量优秀程序的一个标准。\n\
  \n![使用嵌套 if 语句的代码。](img/9781284166033_CH05_244a.jpg)\n\nDescription\n\n当我们把一个 `If`\
  \ 放在另一个 `If` 内部时，我们正在创建一个*嵌套控制结构*。控制结构的嵌套就像混合搅拌碗一样，较小的嵌套在较大的内部。这里有一个伪代码示例：\n\n当问题涉及*多路分支*（多于两种可选的行动方案）时，可以使用嵌套的\
  \ `If` 语句进行编码。例如，给定月份数字输出对应的月份名称，我们可以使用一系列 `If` 语句（非嵌套）：\n\n![使用一系列 if 语句根据月份数字输出月份名称的代码块](img/9781284166033_CH05_245.jpg)\n\
  \nDescription\n\n但等价的嵌套 `If` 结构，\n\n![使用嵌套 if 语句根据月份数字输出月份名称的代码块](img/9781284166033_CH05_245a.jpg)\n\
  \nDescription\n\n会更有效率，因为它执行的比较次数更少。第一个版本总是会测试所有的 12 个月份数字，即使月份是 1 月。相比之下，嵌套的 `If`\
  \ 在选择了一个选项后就会跳过剩余的测试。现代计算机运行很快，但许多应用程序需要大量的计算，低效的算法会浪费数小时的计算机时间。请始终寻找让程序更高效的方法，只要这样做不会让程序变得难以理解。通常情况下，为了可读性牺牲一点效率是更好的。\n\
  \n在最后一个示例中，请注意 `then` 和 `else` 子句的缩进导致语句不断向右移动。或者，我们可以对嵌套的 `If-Then-Else` 语句使用一种特殊的缩进样式，以指示该结构仅仅是从一组备选方案中选择一种。这种通用的多路分支被称为\
  \ *If-Then-Else-If* 控制结构：\n\n![使用 If-Then-Else-If 控制结构根据月份数字输出月份名称的代码块](img/9781284166033_CH05_245b.jpg)\n\
  \nDescription\n\n这种风格防止了缩进持续向右移动，并且它在视觉上传达了我们正在根据变量 `month` 使用一个 12 路分支。\n\n一系列\
  \ `If` 语句与嵌套的 `If` 之间有一个重要的区别：一系列 `If` 语句可以采取多个备选方案，但嵌套的 `If` 只能选择一个选项。为了理解这种区别，请考虑填写在线表单的类比。有些问题就像一系列\
  \ `If` 语句，要求你点击列表中所有适用于你的项目（例如，你的爱好）。其他问题则让你在列表中选择一个项目（例如，你的年龄段），因此它们就像嵌套的 `If`\
  \ 结构。这两种类的问题在编程问题中都会出现。能够识别这些不同的情况有助于你选择适当的控制结构。\n\n嵌套 `If` 的另一个用途是从系列连续的数值范围中进行选择。例如，假设我们根据以下信息，根据室外温度显示合适的活动：\n\
  \n| 活动 | 温度 |\n| :--- | :--- |\n| 游泳 | temperature > 85 |\n| 网球 | 70 < temperature\
  \ <= 85 |\n| 高尔夫 | 32 < temperature <= 70 |\n| 滑雪 | 0 < temperature <= 32 |\n| 舞蹈\
  \ | 室内温度 <= 0 |\n\n乍看之下，你可能想为每个温度范围编写一个单独的 `If` 语句。然而，仔细观察就会很清楚，如果执行了其中一个 `If` 语句，其余就可以跳过。我们实际上是在从可能的集合中选择一个备选方案——这正是可以使用嵌套\
  \ `If` 结构的情况。此问题与我们之前的示例的唯一区别在于，我们在分支的 `If` 表达式中检查数字范围。\n\n当范围是连续的时，我们可以利用这一事实让代码更高效。我们按照范围的连续顺序排列分支。那么，如果进入某个分支，我们就知道之前的范围已经被从考虑中除了。因此，`If`\
  \ 表达式只需要将温度与每个范围的最低值进行比较。要查看它是如何工作的，请看下面的 `Activity` 程序。\n\n![根据室外温度显示活动的程序](img/9781284166033_CH05_246a.jpg)\n\
  \nDescription\n\n![根据室外温度显示活动的程序](img/9781284166033_CH05_247.jpg)\n\n为了理解 `If-Then-Else`\
  \ 结构是如何工作的，考虑测试 `temperature` 大于 70 的分支。如果进入了该分支，我们知道 `temperature` 必须小于 85，因为这导致了该\
  \ `else` 分支的执行。因此我们只需要测试该范围的边界。如果测试失败，我们进入下一个 `else` 子句，知道 `temperature` 小于 70。每个连续分支检查其边界，直到我们最后的\
  \ `else`，它处理所有剩余的情况。\n\n然而，如果范围不是连续的，我们必须针对每个范围的最高值测试数据值。我们仍然使用 `If-Then-Else-If`，因为这是从可能性中选择分支的最佳结构，而且我们可以按顺序排列范围以便人类阅读。\n\
  \n### 悬空 else (Dangling else)\n\n当 `If` 语句嵌套时，你可能会对 `if-else` 配对感到困惑；即 `else` 属于哪个\
  \ `if`？例如，假设如果学生的平均分低于 60，我们想输出“不及格”；如果至少为 60 但小于 70，我们想输出“通过但边缘”；而如果为 70 或更高，我们不想输出任何内容。我们用嵌套在\
  \ `If` 之中的 `If-Then-Else` 来编写这些信息：\n\n![嵌套在 If-Then 内部的 If-Then-Else 代码](img/9781284166033_CH05_247a.jpg)\n\
  \nDescription\n\n![嵌套在 If-Then 内部的 If-Then-Else 代码](img/9781284166033_CH05_248.jpg)\n\
  \n我们如何知道 `else` 属于哪个 `if`？这是 C++ 编译器遵循的规则：在没有括号的情况下，`else` 总是与之前最近且尚未配对 `else` 的\
  \ `if` 配对。我们通过缩进代码来反映这种配对。\n\n假设我们像这样编写代码片段：\n\n![else 与最近的之前的 if 配对的代码](img/9781284166033_CH05_248a.jpg)\n\
  \nDescription\n\n\n\n\n在这里，我们希望 `else` 分支连接到外部的 If 语句，而不是内部的 If，因此我们如你看到的那样对代码进行了缩进。当然，缩进不会影响代码的执行。尽管\
  \ `else` 与第一个 `if` 对齐，编译器也会将其与第二个 `if` 配对。跟在嵌套的 If-Then 之后的 `else` 被称为*悬空*（dangling）`else`。它在逻辑上不属于嵌套的\
  \ If，但被编译器附加到了它上面。\n\n要将 `else` 链接到第一个 `if` 而不是第二个 `if`，你可以将外部的 then 子句转换为一个块：\n\
  \n![在嵌套的 If-Then-Else 代码中将 else 附加到第一个 if 的正确代码。](img/9781284166033_CH05_248b.jpg)\n\
  \n描述\n\n`{ }` 对表示内部的 If 语句已完成，因此 `else` 必须属于外部的 `if`。\n\n## 5.5 逻辑运算符\n\n在数学中，*逻辑*（或*布尔*）*运算符*\
  \ AND、OR 和 NOT 以逻辑表达式作为操作数。C++ 使用特殊符号来表示逻辑运算符：`&&`（用于 AND）、`||`（用于 OR）和 `!`（用于 NOT）。通过将关系运算符与逻辑运算符结合，我们可以创建更断言。例如，在上一节中，我们使用两个\
  \ If 语句来判断平均分是否大于 60.0 但小于 70.0。在 C++ 中，我们可以这样写这个表达式：\n\n![一个比较语句。](img/9781284166033_CH05_249.jpg)\n\
  \n描述\n\nAND 操作（`&&`）要求两个关系都为真，整体结果才为真。如果其中一个或两个关系都为假，则整个结果为假。\n\nOR 操作（`||`）接受两个逻辑表达式并将它们合并。如果其中*一个*或*两者*为真，结果即为真。只有*两个*值都为假时，结果才为假。例如，我们可以判断期中成绩是否为\
  \ A *或*期末成绩是否为 A。如果任一个成绩等于 A，该断言为真。在 C++ 中，我们这样写这个表达式：\n\n![一个比较语句。](img/9781284166033_CH05_249a.jpg)\n\
  \n描述\n\n`&&` 和 `||` 运算符始终出现在两个表达式之间；它们是二元（两个操作数）运算符。NOT 运算符（`!`）是一个一元（一个操作数）运算符。它位于单个逻辑表达式之前，并给出其相反的结果的结果。如果\
  \ `(grade == 'A')` 为假，那么 `!(grade == 'A')` 为真。NOT 为我们提供了一种反转断言含义的方便方法。例如，\n\n![一个比较语句。](img/9781284166033_CH05_249b.jpg)\n\
  \n描述\n\n等同于\n\n![一个比较语句。](img/9781284166033_CH05_249c.jpg)\n\n描述\n\n在某些语境下，第一种形式更清晰；在其他情况下，第二种形式更有意义。\n\
  \n以下表达式对是等价的：\n\n| 表达式 | 等价表达式 |\n| :--- | :--- |\n| `!(a == b)` | `a != b` |\n\
  | `!(a == b || a == c)` | `a != b && a != c` |\n| `!(a == b && c > d)` | `a != b\
  \ || c <= d` |\n\n仔细观察这些表达式，确保你理解为什么它们是等价的。尝试用 `a`、`b`、`c` 和 `d` 的某些值进行计算。注意这个模式：左侧的表达式仅仅在其右侧表达式的基础上添加了\
  \ `!`，并将关系运算符和逻辑运算符反转（例如，用 `==` 代替 `!=`，用 `||` 代替 `&&`）。记住这个模式。它允许你以最的形式重写表达式。\n\
  \n逻辑运算符可以应用于比较结果。它们也可以直接应用于 `bool` 类型的变量。例如，与其写\n\n![一个逻辑语句。](img/9781284166033_CH05_250.jpg)\n\
  \n描述\n\n来给布尔变量 `isElector` 赋值，我们可以使用两个中间布尔变量，`isVoter` 和 `isConstituent`：\n\n![一些布尔赋值。](img/9781284166033_CH05_250a.jpg)\n\
  \n描述\n\n下表总结了将 `&&` 和 `||` 应用布尔表达式（由 `x` 和 `y` 表示）的结果：\n\n| x | y | x && y | x ||\
  \ y |\n| :--- | :--- | :--- | :--- |\n| true | true | true | true |\n| true | false\
  \ | false | true |\n| false | true | false | true |\n| false | false | false | false\
  \ |\n\n在本文中，我们将逻辑运算符应用于表达式。*注意*：很容易混淆逻辑运算符 `&&` 和 `||` 与另外两个 C++ 运算符 `&` 和 `|`。如果你不小心用\
  \ `&` 代替 `&&` 或用 `|` 代替 `||`，你不会得到编译信息，但你的程序可能会计算错误。有些程序员将 `&&` 读作 \"and-and\"，将\
  \ `||` 读作 \"or-or\" 以避免错误。\n\n之前的赋值语句也可以通过 If 语句来实现，即\n\n![代码](img/9781284166033_CH05_251b.jpg)\n\
  \n描述\n\n可以实现为\n\n![代码](img/9781284166033_CH05_251c.jpg)\n\n描述\n\n如你所示，第一种形式编写更简单，而且通过练习后更容易阅读。\n\
  \n以下应用根据温度和是否下雨将布尔变量 `walk`、`movie` 和 `book` 设置为 `true` 或 `false`。然后使用 If 语句输出结果。\n\
  \n![根据温度输出相应活动的程序。](img/9781284166033_CH05_251d.jpg)\n\n描述\n\n![根据温度输出相应活动的程序。](img/9781284166033_CH05_252.jpg)\n\
  \n以下是在四组不同输入上运行该程序的结果：\n\n![该程序在四组不同输入上输出相应活动的程序的输出。](img/9781284166033_CH05_252a.jpg)\n\
  \n描述\n\n\n\n\n\n![程序输出，针对四组不同的输入，为给定温度输出相应的活动。](img/9781284166033_CH05_253.jpg)\n\
  \n### 短路求值\n\n考虑逻辑表达式\n\n![一个逻辑表达式。](img/9781284166033_CH05_253a.jpg)\n\nDescription\n\
  \n某些编程语言对逻辑表达式进行*完全求值*（full evaluation）。在完全求值中，计算机在应用 `&&` 运算符产生最终结果之前，会先计算两个子表达式（即\
  \ `i == 1` 和 `j > 2`）。\n\n相比之下，C++ 对逻辑表达式使用**短路**（short-circuit，或**条件**）求值。求值过程从左到右进行，计算机一旦知道整个表达式的布尔值，就会停止计算子表达式——也就是说，一旦确定了结果就立即停止。如果计算机不检查所有子表达式，它如何知道一个冗长的逻辑表达式产生的是\
  \ `true` 还是 `false` 呢？让我们先来看 AND 操作。\n\n只有当两个操作数均为 `true` 时，AND 操作才会产生 `true` 值。在前面的表达式中，假设\
  \ `i` 的值恰好是 95。第一个子表达式产生 `false`，因此没有必要查看第二个子表达式。计算机停止求值并产生最终结果 `false`。\n\n对于 OR\
  \ 操作，一旦发现一个产生 `true` 的子表达式，从左到右的求值就会停止。记住，如果两个操作数中的任一个或两个为 `true`，OR 就会产生结果 `true`。假设我们有如下表达式：\n\
  \n![一个逻辑表达式。](img/9781284166033_CH05_253b.jpg)\n\nDescription\n\n如果第一个子表达式为 `true`，求值停止，整个结果为\
  \ `true`。计算机不会浪费时间对第二个子表达式进行不必要的求值。\n\n### 运算符优先级\n\n在第 3 章中，我们讨论了优先级规则——即决定复杂算术表达式求值的规则。C++\
  \ 的优先级规则不仅适用于复杂的算术表达式，还适用于关系运算符和逻辑运算符。以下是算术运算符、关系运算符和逻辑运算符的优先级列表（同时也包含了赋值运算符）：\n\
  \n![运算符的优先级。](img/9781284166033_CH05_255.jpg)\n\nDescription\n\n同一行的运算符优先级相同。如果一个表达式包含多个优先级相同的运算符，大多数运算符将从左到右结合（或*结合性*，associate）。例如，表达式\n\
  \n![一个数学表达式。](img/9781284166033_CH05_255a.jpg)\n\nDescription\n\n意味着 `(a / b) *\
  \ c`，而不是 `a / (b * c)`。然而，一元运算符（`!`、一元 `+`、一元 `-`）从右到左结合。虽然你永远不想使用这个表达式，\n\n![一个数学表达式。](img/9781284166033_CH05_255b.jpg)\n\
  \nDescription\n\n它的含义是 `!(!badData)`，而不是没有意义的 `(!!)badData`。附录 B“运算符优先级”列出了 C++\
  \ 中所有运算符的优先级顺序。在附录中，你可以看到还有几个从右到左结合的运算符（原因类似）。\n\n括号在求值表达式时会覆盖优先级规则。如果你不确定是否需要括号，也请尽管使用它们。编译器会忽略不必要的括号。因此，如果括号能明确表达式的意思，就使用它们。有些程序员喜欢在将关系表达式赋值给布尔变量时使用括号：\n\
  \n![一个表达式。](img/9781284166033_CH05_256.jpg)\n\nDescription\n\n这里不需要括号；因为赋值的优先级低于\
  \ `==`。所以我们可以直接写\n\n![一个表达式。](img/9781284166033_CH05_256a.jpg)\n\nDescription\n\n\
  但由于 `if` 语句要求逻辑表达式包含在括号内，因此带括号的版本是一个信号，表示该表达式产生逻辑结果。\n\n关于括号的最后一点说明：C++ 要求括号成对使用。每当你编写复杂的表达式时，请花一点时间检查所有的左括号是否有对应的右括号。\n\
  \n### 浮点数类型的关系运算符\n\n到目前为止，我们讨论了 `int`、`char` 和 `string` 值的比较。在这里我们来看 `float` 值。\n\
  \n*不要对浮点数进行相等性比较。*由于在对浮点数进行计算时可能会产生小数误差，两个浮点数很少完全相等。例如，考虑以下使用了两个 `float` 变量 `oneThird`\
  \ 和 `x` 的代码：\n\n![程序代码。](img/9781284166033_CH05_257.jpg)\n\nDescription\n\n我们期望\
  \ `x` 的值为 1.0，但它可能存储的是 0.333333。第一个赋值语句将 0.999999 存 `oneThird`。与其对浮点数进行相等性测试，不如测试它们是否*接近*相等。为了这样做，我们计算数字之间的差。例如，我们经常使用如下：\n\
  \n![比较。](img/9781284166033_CH05_257d.jpg)\n\nDescription\n\n其中 `fabs` 是 C++ 库中的绝对值函数。表达式\
  \ `fabs(r - s)` 计算 `r` 和 `s` 之间的绝对值。如果结果小于 0.001，则认为这两个数是相等的。\n\n### 5.6 测试流的状态\n\
  \n到目前为止，我们讨论了比较 `int`、`char` 和 `string` 值。在这里我们来看 `float` 值。在第 4 章中，我们讨论了 C++ 中的输入输出流。回顾以下任何情况都会导致输入流进入失败状态：\n\
  \n*   无效输入\n*   尝试读取文件末尾之外\n*   尝试打开不存在的文件\n\nC++ 提供了一种检查流是否处于失败状态的方法。在逻辑表达式中，你可以直接使用流的名字（如\
  \ `cin`），就像使用布尔变量一样：\n\n![表达式。](img/9781284166033_CH05_258a.jpg)\n\nDescription\n\
  \n这就是**测试流的状态**。测试的结果为 `true`（意味着对该流的操作成功）或 `false`（意味着前面的操作导致流进入失败状态）。将逻辑表达式中的流对象看作具有\
  \ `true`（流状态正常）或 `false`（状态不正常）值的布尔变量。\n\n在 `if` 语句中，你表述逻辑表达式的方式取决于你想让 `then` 语句做什么。语句\n\
  \n![程序代码。](img/9781284166033_CH05_258b.jpg)\n\nDescription\n\n如果 `inFile` 最后的操作成功，则执行\
  \ `then` 语句。该语句\n\n![程序代码。](img/9781284166033_CH05_259.jpg)\n\nDescription\n\n如果\
  \ `inFile` 处于失败状态，则执行 `then` 语句。\n\n这是一个示例展示了如何检查输入文件是否成功打开：\n\n![一个检查输入文件是否成功打开的程序。](img/9781284166033_CH05_259a.jpg)\n\
  \n\n\n\n\n描述\n\n在这个程序中，我们首先尝试打开文件 `measures.dat` 进行输入。紧接着，我们检查该尝试是否成功。如果操作成功，则 `If`\
  \ 语句中表达式 `!inFile` 的值为 `false`，并跳过 `then` 分句（then-clause）。程序继续从文件中读取数据，然后进行计算。最后通过执行该语句结束：\n\
  \n![程序代码。](img/9781284166033_CH05_259b.jpg)\n\n描述\n\n通过这条语句，`main` 函数将控制权返回给操作系统。请记住，`main`\
  \ 返回的返回值被称为退出状态（exit status）。值 `0` 表示程序正常完成。任何其他值（通常为 1, 2, 3, . . .）意味着发生了某些错误。\n\
  \n让我们再次追踪程序，假设我们无法打开输入文件。从 `open` 函数返回后，流 `inFile` 处于失败状态（fail state）。在 `If` 语句中，表达式\
  \ `!inFile` 的值为 `true`。因此执行了 `then` 分句。程序向用户显示错误消息然后终止，返回一个为 `1` 的退出状态，以告知操作系统发生了异常终止。（我们选择值\
  \ `1` 作为退出状态纯是随机的。程序员有时会在程序中使用多个不同的值来表示程序终止的不同原因，但大多数人只使用值 `1`。）\n\n每当你打开一个数据文件进行输入操作时，请务必在继续操作之前测试流的状态。如果你忘记这样做，且计算机无法打开文件，你的程序将静默地继续执行并忽略对该文件的任何输入操作。\n\
  \n### 图形用户界面 (GUI)\n\n本章重点关注控制流结构以及如何使用它们来选择执行代码的哪些部分。例如，BMI 计算器接受用户输入的体重和身高输入，并使用\
  \ `If-Then-Else` 语句计算体质指数并输出结果的解释，或者报告输入无效。在这个示例中，我们将修改程序，以演示如何使用 GUI 组件来提供控制程序执行的输入，并查看\
  \ GUI 控件如何提供输入验证来简化我们的程序。\n\n大多数现代程序通过 GUI 与人交互。在我们的案例研究中，BMI 计算器程序使用如下代码让用户输入他们的体重和身高：\n\
  \n![BMI 计算器程序的代码，用于让用户输入身高和体重。](img/9781284166033_CH05_265c.jpg)\n\n描述\n\nQt GUI\
  \ 库提供了我们此类交互所需的组件。请记住，此类组件被称为对话框（dialogs）。要访问 Qt 对话框库，我们使用此 `include` 语句：\n\n![访问\
  \ GUI 组件的 include 语句。](img/9781284166033_CH05_266.jpg)\n\n描述\n\nQt 为不同类型的用户交互提供了不同的对话框。BMI\
  \ 程序要求输入为浮点数（float）而不是字符串。案例研究版本通过从 `cin` 读取到一个 `float` 变量来实现这一点。对于我们的 GUI 版本，我们可以使用\
  \ `FloatDialog` 控件，它允许用户输入浮点值。因此，我们可以将流变量声明替换为对话框对象声明如下：\n\n![一些对话框对象声明。](img/9781284166033_CH05_266a.jpg)\n\
  \n描述\n\n上述声明创建了两个用于接受体重身高输入的对话框。然后我们调用 `FloatDialog` 对象的 `display()` 方法将它们显示在屏幕上，以便用户输入其身高和体重的浮点值。\n\
  \n![显示 GUI 控件的代码。](img/9781284166033_CH05_266b.jpg)\n\n描述\n\n`display()` 方法使控件出现在屏幕上，允许用户分别输入体重和身高。它的外观如下所示：\n\
  \n![接受用户体重的对话框。](img/9781284166033_CH05_266c.jpg)\n\n描述\n\n![接受用户体重的对话框。](img/9781284166033_CH05_266d.jpg)\n\
  \n描述\n\n当用户按下每个控件的 OK 按钮时，输入的值将被返回并存储到对应的 `float` 变量中。我们可以执行与之前的 BMI 程序相同的操作，以判断用户输入是否有效：\n\
  \n![检查用户输入是否有效的代码。](img/9781284166033_CH05_267.jpg)\n\n描述\n\n如之前，如果输入有效，我们想要计算体质指数并给用户提供建议。然而，这是一个\
  \ GUI 应用，所以我们使用图形界面来显示结果。原始 BMI 程序使用了流。在这个版本中，我们将每个输出运算符替换为字符串拼接。注意我们还使用了 `message`\
  \ 变量来存储响应。最后，我们使用 `message` 变量创建一个 `OutputDialog` 控件并显示最终结果：\n\n![向用户显示最终结果的代码。](img/9781284166033_CH05_267c.jpg)\n\
  \n描述\n\n如果我们输入 182.4 磅和 69.4 英寸，输出如下：\n\n![BMI 计算器中显示结果的输出框。](img/9781284166033_CH05_268.jpg)\n\
  \n描述\n\n这是 BMI 程序的完整 GUI 版本。属于 Qt GUI 界面的部分已被阴影。除了 GUI 代码，案例研究代码的唯一是是了用于输出字符串的 `message`\
  \ 变量，并使用拼接代替流输出。\n\n![BMI 程序的 GUI 版本代码。](img/9781284166033_CH05_268a.jpg)![BMI 程序的\
  \ GUI 版本代码。](img/9781284166033_CH05_269.jpg)\n\n描述\n\n虽然这展示了一些新的 GUI 组件，但使用 GUI\
  \ 还可以实现更多功能。像 Qt 这样的框架中的许多控件提供了额外的功能，以确保用户输入的数据是有效的。例如，在原始 BMI 程序中，我们在输入后测试体重或身高是否小于零。如果我们的\
  \ GUI 控件能够限制输入值，这样我们就不需要在代码中进行这些检查了难道不是吗？Qt 框架可以作为控件实现的一部分为我们完成这一点。\n\n\n\n\n\n\
  当我们创建一个 `FloatDialog` 时，可以指定允许的输入值。对话框将接收一个用于提示用户的字符串，例如，“输入你的体重（磅为单位）”。此外，我们还可以按照顺序提供起始值（初始显示为默认值的值）、最小值和最大值。假设我们想将输入值的范围限制为最小\
  \ 30 磅，最大 600 磅，并将起始值也设置为 30：\n\n![创建用于显示给用户的 GUI 控件的代码。](img/9781284166033_CH05_269a.jpg)\n\
  描述\n\n`heightDialog` 也可以配置合理的起始高度、最小和最大允许高度值：\n\n![代码为高度对话框配置了合理的起始、最小和最大允许高度值。](img/9781284166033_CH05_269b.jpg)\n\
  描述\n\n这些额外参数允许我们显示能够限制用户输入的对话框：\n\n![一个接受用户体重的对话框。](img/9781284166033_CH05_269c.jpg)\n\
  描述\n\n![一个接受用户高度值的对话框。](img/9781284166033_CH05_270.jpg)\n描述\n\n如你所见，体重和高度对话框都以它们指定的起始单位显示。此外，如果用户输入的输入不在指定范围内，GUI\
  \ 控件将禁用 OK 按钮：\n\n![一个接受用户体重的对话框。](img/9781284166033_CH05_270a.jpg)\n描述\n\n因为测试是在控件中进行的，所以我们可以删除检查体重和高度是否合适的\
  \ If-Then-Else 语句。为了完成 BMI 程序的第二个 GUI 版本，并展示一种新类型的控件，我们现在引入一个允许我们在任何条件情况下都提问是/否类型问题的组件。\n\
  \n某些时候，用户可能不想看到减重建议。我们可以更改应用程序，让用户今天可以忽略它（至少在他们运行程序时！）。我们可以让 BMI 程序询问用户是否想计算 BMI。如果用户选择否，我们就结束程序；如果他们选择是，我们就继续询问他们关于身高和体重的问题。\n\
  \n![为用户提供继续计算 BMI 选择的代码。](img/9781284166033_CH05_270b.jpg)\n描述\n\n新的 `YesNoDialog`\
  \ 组件将显示一个 GUI 控件，询问用户是或否答案：\n\n![一个是/否对话框。](img/9781284166033_CH05_270c.jpg)\n描述\n\
  \n如代码所示，`display()` 方法返回的数据类型是一个 `bool` 值。我们可以在 If-Then-Else 中使用该值，它要么执行 BMI GUI\
  \ 代码，要么向用户显示消息。我们代码的最终版本如下：\n\n![BMI 程序 GUI 版本的代码。](img/9781284166033_CH05_271.jpg)\n\
  描述\n\n### 测试与调试\n\n测试是计算机编程中解决问题和实现阶段不可或缺的一部分。在这里，我们测试了用于开发 BMI 程序的两个阶段。问题解决阶段的测试是在解决方案开发之后、实现之前进行的。在实现阶段，我们在算法编码为程序之后以及程序成功编译之后再次进行测试。编译本身构成了另一个自动执行的测试阶段。\n\
  \n### 问题解决阶段的测试：算法走演\n\n#### 确定前置条件和后置条件\n\n要在问题解决阶段进行测试，我们对算法进行走演。对于功能分解中的每个模块，我们建立一个称为前置条件（precondition）的断言和另一个称为后置条件（postcondition）的断言。`precondition`\
  \ 是在模块执行之前必须为真的断言，以便模块能够正确执行。`postcondition` 是在模块执行后（如果它工作正常的话）应该为真的断言。为了测试一个模块，我们“走演”算法步骤，以确认在给定的前置条件条件下，它们是否产生了所需的后置条件。\n\
  \n#### 执行算法走演\n\n现在我们已经建立了前置条件和后置条件，我们开始对 **main** 模块进行走演。此时，我们只关注 **main** 模块中的步骤，因此我们假设每个低级模块都是正确的。在每一步中，我们确定当前条件。如果该步骤是对另一个模块的引用，我们检查该模块的前置条件是否满足当前条件。\n\
  \n**main** 模块中的第一个语句 Get Data 没有前置条件，我们假设 Get Data 正确地将两个实数值输入到 **weight** 和 **height**\
  \ 中。\n\n\n\n\n模块 `Test Data` 的先置条件是 `weight` 和 `height` 已被赋值，这与 `Get Data` 的后置条件一致。同样，由于我们只关注\
  \ Level 0 发生的情况，我们假设 `Test Data` 满足它的后置条件，即 `dataAreOK` 包含 `true` 或 `false`。\n\n\
  接下来，`If`语句检查 `dataAreOK` 是否为 `true`。如果是，算法执行 `then` 子句。假设 `Calculate BMI` 和 `Display\
  \ Message Indicating Status` 工作正常，那么 `If` 语句的 `then` 子句就是正确的。如果 `dataAreOK` 的值为\
  \ `false`，算法将执行 `else` 子句并显示错误信息。\n\n现在我们已经验证了在 Level 1 模块正确的假设下，`main`（Level 0）模块是正确的。下一步是检查\
  \ Level 1 的每个模块，查看它们是否符合其预期功能，假设 Level 2 模块（如果有）是正确的。我们只需对每个模块重复演练过程，从其特定的先置条件开始。在本例中，没有\
  \ Level 2 模块，因此 Level 1 模块必须是完整的。\n\n`Get Data` 正确读取了两个值——`weight` 和 `height`——从而满足了它的后置条件。（下一步细化是用\
  \ C++ 编写此指令。在这一阶段，代码编写得正确不是问题；我们会在实现阶段进行测试时处理代码。）\n\n`Test Data` 检查两个变量是否包含非负值。`If`\
  \ 条件正确地使用了 OR（或）运算符来组合关系表达式，使得如果其中任何一个为 `true`，就会执行 `then` 子句。因此如果其中一个数字为负数，它会将\
  \ `dataAreOK` 赋值为 `false`；否则赋值为 `true`。因此，该模块满足它的后置条件。\n\n`Calculate BMI` 计算了 BMI\
  \ 公式：`weight * 703 / (height * height)`。因此，所需的后置条件为真。但如果 `height` 的值为 0 呢？噢，天哪！我们检查了输入是非负的，但忘记了\
  \ `height` 被用除数，因此不能为 0。在发布此程序供通用使用之前，我们需要修复这个问题。\n\n`Display Message Indicating\
  \ Status` 带有适当的文档输出 `bodyMassIndex` 中的值。然后它将结果与标准进行比较并输出相应的解释。因此，该模块满足它的后置条件。\n\n\
  一旦完成了算法演练，我们就必须纠正任何差异并重复该过程。当我们确定模块执行了它们应该执行的功能，就开始将算法翻译成我们的编程语言。\n\n任何程序的标准后置条件都是用户已收到无效数据的通知。你应该对适用于任何限制的每个输入值进行验证。数据验证\
  \ `If` 语句会测试输入值，如果值不可接受，则输出错误信息。（我们在测试 BMI 程序的负分时已经验证了数据。）验证数据的最佳位置是紧随在输入之后。为了满足数据验证后置条件，算法还应该测试输入值，以确保它们不会太大或太小。\n\
  \n### 实现阶段的测试\n\n现在我们已经讨论了问题解决阶段的测试，现在转向实现阶段的测试。在这个阶段，你需要在几个点进行测试。\n\n### 代码演练\n\
  \n代码编写完成后，你应该逐行检查它，以确保你忠实地重了算法——这一过程被称为代码演练（code walk-through）。在团队编程的情况下，你会要求其他团队成员与你一起演练算法和代码，以双检设计和代码。\n\
  \n### 执行跟踪\n\n你还应该取一些实际值，通过执行跟踪（execution trace，或手动跟踪）来手工计算输出应该是多少。当程序执行时，可以使用这些相同的值作为输入并检查结果。\n\
  \n计算机是一个非常死板的设备——它完全按照我们告诉它的方式来操作，而这可能正是我们希望它执行的。我们尝试通过跟踪语句的执行来确保程序执行的是我们想要的。\n\n\
  我们在下面使用一个无意义程序来演示这种技术。我们在右侧跟踪程序变量的值。具有未定义值的变量用破折号表示。当变量被赋值一个值时，该值将列在相应的列中。\n\n![表格逐行列出了程序中的语句以及在语句执行时变量\
  \ a、b 和 c 的取值。](img/9781284166033_CH05_275.jpg)\n\n描述\n\n现在你已经看到了这种技术是如何运作的，让我们将其应用于\
  \ BMI 程序。我们在这里只列出可执行的语句部分。输入值为 124 和 63.5。\n\n对于这些输入数据，第一个 `If`语句的 `then` 子句未执行，因此我们不填充右侧的任何变量列。第二个\
  \ `If`语句的 `then` 子句被执行；因此 `else` 子句未执行。第三个 `If`语句的 `else` 子句被执行，它是另一个 `If` 语句。在这里执行\
  \ `then` 子句，导致其余代码未执行。\n\n我们总是为所有变量创建列，即使我们知道某些列将保持为空。为什么？因为以后我们可能会遇到对空变量的错误引用；为变量留一列可以提醒我们检查此类情况。\n\
  \n![表格逐行列出了程序中的语句以及在语句执行时变量 a、b 和 c 的取值。](img/9781284166033_CH05_275.jpg) -- *等等，原文具有类似重复的描述逻辑，此处保持上下文。*\n\
  \n![表格逐行列出了程序中的语句以及在语句执行时变量 a、b 和 c 的取值。](img/ (根据上下文重新说明)\n\n当程序包含分支时，使用不同的输入数据重新跟踪其执行是一个好主意，这样每个分支至少被跟踪一次。在下一节中，我们将描述如何开发测试所有分支的数据集。\n\
  \n### 测试控制结构\n\n为了测试带有分支的程序，我们需要至少执行每个分支一次并验证结果。例如，BMI 程序包含五个 `If-Then-Else` 语句（见图\
  \ 5.6）。我们需要一组数据集来测试这些分支。例如，以下 `weight` 和 `height` 的输入值集合会导致所有分支的执行：\n\n![表格列出了 `weight`\
  \ 和 `height` 的输入值集合，这些值会导致 BMI 程序中所有分支的执行。](img/9781284166033_CH05_277.jpg)\n\n\
  描述\n\n图 5.7 显示了对于这些数据集中的每一个，控制流通过 BMI 程序分支结构。通过这一系列测试运行，程序中的每个分支至少被执行一次；删除任何一组数据集都将导致至少有一个分支未被测试。这一系列数据集提供了所谓的程序分支结构的最小完全覆盖。每当你测试一个带有分支的程序时，都应该设计一组覆盖所有分支的测试。绘制像图\
  \ 5.7 那样的图可能会有所帮助，让你看到哪些分支正在被执行。\n\n由于程序一个分支中的操作通常会影响后续分支的处理，因此尽可能测试程序中尽可能多的分支组合（或路径）至关重要。通过这样做，我们可以确保没有可能导致问题的依赖关系。当然，某些分支组合是不可能遵循的。例如，如果了\
  \ BMI 程序第一个分支的 `else` 子句，那么第二个分支的 `else` 子句就无法执行。我们难道不应该尝试所有可能的路径吗？是的，理论上我们应该这样做。然而，即使在一个很小的程序中，路径的数量也可能非常大。\n\
  \n\n\n我们在这里使用的测试方法被称为`code coverage`（代码覆盖），因为测试数据是通过观察程序代码来设计的。代码覆盖也称为`white-box`（白盒或`clear-box`\
  \ 透盒）`testing`，因为我们在设计测试时允许查看程序代码。另一种测试方法被称为`data coverage`（数据覆盖），它尝试在不考虑程序代码的情况下测试尽可能多的允许数据值。由于在这种形式的测试中不需要查看代码，因此也被称为`black-box\
  \ testing`（黑盒测试）——即使代码被隐藏在黑盒中，我们也会设计相同的测试集。\n\n对于许多程序来说，完全的数据覆盖和完全的代码覆盖一样是不现实的。例如，如果一个程序有四个\
  \ `int` 输入值，那么大约有 `(2 × INT_MAX)⁴` 种可能的输入。（`INT_MAX` 和 `INT_MIN` 是在头文件 `<climits>`\
  \ 中声明的常量。它们分别代表你特定计算机和 C++ 编译器上最大和最小的 `int` 值。）\n\n通常，测试涉及这两种策略的结合。我们不是尝试每一种可能的数据值（数据覆盖），而是检查代码（代码覆盖）并寻找处理逻辑相同的值范围。然后，我们测试边界处的值，有时还会测试每个范围中间的一个值。例如，一个简单的条件如：\n\
  \n![BMI 程序的分支结构。](img/9781284166033_CH05_FIGF06.jpg)\n\n图 5.6 BMI 程序的分支结构\n\nDescription\n\
  \n![一组五张图，显示了五个数据集通过 BMI 程序的控制流。](img/9781284166033_CH05_FIGF07.jpg)\n\n图 5.7 五个数据集通过\
  \ BMI 程序的控制流\n\nDescription\n\n![程序代码。](img/9781284166033_CH05_279.jpg)\n\nDescription\n\
  \n将整数分为两个范围：\n\n1. `INT_MIN` 到 `–1`\n2. `0` 到 `INT_MAX`\n\n因此，我们应该测试 `INT_MIN`、`–1`、`0`\
  \ 和 `INT_MAX` 这四个值。一个复合条件如：\n\n![程序代码。](img/9781284166033_CH05_279a.jpg)\n\nDescription\n\
  \n将整数分为三个范围：\n\n1. `INT_MIN` 到 `—1`\n2. `0` 到 `100`\n3. `101` 到 `INT_MAX`\n\n因此我们有六个值需要测试。此外，为了验证关系运算符是否正确，我们应该测试值\
  \ `1`（`> 0`）和 `99`（`< 100`）。\n\n条件分支只是制定测试策略的因素之一。我们将在随后的章节中考虑更多此类因素。\n\n### 测试计划\n\
  \n每当我们编写程序时，都必须设计一个 `test plan`（测试计划）——该文档指定了应该尝试的测试用例、每个测试用例的原因以及预期输出。`Test plan\
  \ implementation`（测试计划实施）涉及使用测试用例指定运行程序并检查结果。\n\n测试计划应与功能分解一起制定。在你创建每个模块时，写出它的前提条件（precondition）和后置条件（postcondition），并记录验证这些条件所需的测试数据。考虑代码覆盖和数据覆盖，看看是否遗掉了程序任何方面的测试。（如果你忘记了某些内容，可能表明前置条件或后置条件不完整。）\n\
  \n下表了 BMI 程序的部分测试计划。它包含六个测试用例。前四个用例测试了有效数据在程序中的不同路径。另外两个测试用例通过分别输入无效分数来检查 `weight`\
  \ 和 `height` 是否得到了恰当验证。\n\n我们应该对边界情况进行程序测试——即 BMI 正好为 20、25 和 30 的情况。由于 BMI 是计算出来的而不是输入的，我们必须从所需的答案反推以获得相应的输入值。案例研究的后续练习要求你观察这个问题，完成此测试计划并实施它。\n\
  \n![详细列出 BMI 程序测试计划的表格。](img/9781284166033_CH05_280.jpg)\n\nDescription\n\n实施测试计划并不能保证程序完全正确。（记住，BMI\
  \ 程序仍然无法捕获高度为零的无效输入。）它仅意味着系统测试没有发现任何错误。\n\n### 在编译和执行期间自动执行的测试\n\n一旦编写好代码并准备好测试数据，就可以进行编译了。编译器有两个责任：报告任何错误，以及（如果没有错误）将程序翻译成目标代码。\n\
  \n错误可以是语法上的（syntactic）或语义上的（semantic）的。编译器发现语法错误；例如，保留字拼写错误、标识符未声明以及缺少分号。但它无法发现所有的输入错误。例如，如果你输入\
  \ `>` 而不是 `<`，它不会报错；相反，你在测试程序时得到错误的结果。语义错误（也称为逻辑错误）是导致结果错误的错误。它们比语法错误更难定位，通常在程序执行时显现。C++\
  \ 只能检测到明显的语义错误——例如除以零。虽然语义错误通常是算法设计的缺陷，但通过遍历算法和代码、制定详细的测试策略，你应该避免或快速定位它们。5.8 展示了我们讨论的测试过程。该图显示了语法和语义错误发生的位置以及可以在哪个阶段修正。\n\
