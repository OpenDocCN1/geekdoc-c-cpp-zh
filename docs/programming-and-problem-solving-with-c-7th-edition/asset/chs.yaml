  \n## F.2 注释\n\n注释是为了让程序更易理解而包含的额外信息。在代码难以理解的地方，你应该包含注释。但是，不要过度注释。程序中过多的注释会掩盖代码并成为分散注意的源。\n\
  \n在我们的风格中，有四种基本类型的注释：头部注释、声明注释、内联注释和侧边注释。头部注释出现在程序的顶部，应该包含你的名字、程序的编写日期及其目的。包含描述输入、输出和假设的章节也是很有用的。将头部注释看作读者对你程序的介绍。这里有一个示例：\n\
  \n![一个头部注释块示例。](img/9781284166033_APP_P1232.jpg)\n\n描述\n\n所有用户定义的函数也应该包含头部注释（参见第\
  \ 8 章和第 9 章）。\n\n声明注释与程序中的常量和变量声明相伴。在声明标识符的地方，包含一个解释其目的的注释是有帮助的。在文中的程序中，声明注释出现在被声明标识符的右侧。例如：\n\
  \n![一段代码片段。](img/9781284166033_APP_P1232-1.jpg)\n\n描述\n\n注意，对齐注释会让代码看起来更整洁，且不那么分散。\n\
  \n内联注释用于将长段代码拆分为更短、更易理解的片段。这些通常是你的算法设计中的模块名称，尽管你可能偶尔包含其他信息。通常情况下，在内联注释周围留空行可以使其更突出；例如：\n\
  \n![一个代码片段。](img/9781284166033_APP_P1233.jpg)\n\n描述\n\n即使不使用注释，在代码中你想强调的逻辑断点处也可以插入空行。\n\
  \n侧边注释出现在执行语句的右侧，用于阐明语句的目的。侧边注释通常是来自你设计底层的伪代码语句。如果一个复杂的 C++ 语句需要解释，伪代码语句应该写在 C++\
  \ 语句的右侧。例如：\n\n![一个 while 循环。](img/9781284166033_APP_P1233-1.jpg)\n\n描述\n\n除了我们讨论的四种主要注释外，还有一些我们应该提到的杂记注释。在\
  \ `main` 函数之后，我们建议在函数前后使用星号（或破折号、等号 `...`）注释来帮助其突出；例如：\n\n![一个代码片段。](img/9781284166033_APP_P1233-2.jpg)\n\
  \n描述\n\n在本文中，使用 C++ 的另一种注释形式来记录函数每个参数的信息流：\n\n![一个注释。](img/9781284166033_APP_P1233-3.jpg)\n\
  \n描述\n\n![一个函数标题。](img/9781284166033_APP_P1233-4.jpg)\n\n描述\n\n![一个代码片段。](img/9781284166033_APP_P1234.jpg)\n\
  \n描述\n\n(第 8 章 描述了将每个参数标记为 `/* in */`、`/* out */` 或 `/* inout */` 的目的。）\n\n程序员有时会在块（复合语句）的右括号后放置注释，以指示它所属的控制结构：\n\
  \n![一个代码片段。](img/9781284166033_APP_P1234-1.jpg)\n\n描述\n\n以此方式添加注释有助于澄清代码并辅助调试不匹配的括号。\n\
  \n## F.3 标识符\n\n为程序中的数据项或函数命名时，最重要的因素是名称尽可能地传递关于该数据项是什么或函数的功能的信息。名称在使用的上下文中也应该是可读的。例如，以下名称传递的信息相同，但其中一个更易读：\n\
  \n`datOfvc` `invoiceDate`\n\n类型、常量和变量的标识符应该是名词，而 void 函数（非返回值函数）的应该是祈使动或包含祈使动的短语。由于返回值函数的调用方式，它们的名称应该是名词或形容词。以下是一些示例：\n\
  \n| 变量 | `address`, `price`, `radius`, `monthNumber` |\n| :--- | :--- |\n| 常量 |\
  \ `PI`, `TAX_RATE`, `ARRAY_SIZE` |\n| 数据类型 | `NameType`, `CarMakes`, `RoomLists`,\
  \ `Hours` |\n| Void 函数 | `GetData`, `ClearTable`, `PrintBarChart` |\n| 返回函数 | `CubeRoot`,\
  \ `Greatest`, `Color`, `AreaOf`, `IsEmpty` |\n\n尽管标识符可能是一个单词，但非常长的标识符会非常麻烦并让程序难以阅读。\n\
  \n设计标识符的最佳方法是尝试不同的名称，直到达到一个可以接受的折中——然后在旁边写上非常有信息的注释。\n\n大小写是选择标识符时的另一个考虑因素。C++ 是一种大小写敏感的语言；也就是说，大写字母和小写字母是不同的。不同的程序员使用不同的大小写约定。在本文中，我们每个变量名以小写字母开头，并大写每个单词的首字母。我们每个函数名和数据类型大写开头。对于命名常量，我们将整个标识符大写，并用划线（`_`）分隔连续的单词。但请记住，C++\
  \ 关键字如 `main`、`if` 和 `while` 始终是小写字母，如果你将它们大写，编译器将无法识别它们。\n\n## F.4 格式化行和表达式\n\n\
  C++ 允许你在长语句中间断开并继续到下一行。（你不能在标识符、字面量常量或字符串中间断行。）当你必须断行时，选择一个符合逻辑且可读的断点是重要的。比较以下代码片段的可读性：\n\
  \n![一段代码片段。](img/9781284166033_APP_P1235.jpg)\n\n描述\n\n当你必须将一个表达式跨越多行时，尝试用操作符结束每一行。此外，尝试利用表达式中的任何重复模式；例如：\n\
  \n![一个跨越多行的表达式。](img/9781284166033_APP_P1235-1.jpg)\n\n描述\n\n在编写表达式时，还要记住空格可以提高可读性。通常，你应该在\
  \ `=` 运算符和大多数其他操作符的两侧各包含一个空格。有时省略空格是为了强调操作执行的顺序。这里是一些示例：\n\n![一段代码片段。](img/9781284166033_APP_P1235-2.jpg)\n\
  \n描述\n\n## F.5 缩进\n\n\n\n\n在程序中对语句进行缩进的目的是为读者提供视觉提示，并使程序更易调试。当程序缩进得当时，语句的分组方式一目了然。请对比以下两个程序片段：\n\
  \n![代码片段。](img/9781284166033_APP_P1236.jpg)\n描述\n\n作为本书的一项基本规则，每个嵌套或更低层级的项都缩进两个空格。在本附录中，我们使用四个空格来强调缩进的效果。该规则的特例是参数声明和跨越两行或多行的语句。缩进两个空格取决于个人的喜好，有些人可能倾向于缩进三个、四个、五个甚至更多空格。\n\
  \n在本文中我们会缩进整个函数体。此外，通常情况下，任何作为另一个语句一部分的语句都会缩进。例如，`If-Then-Else` 包含两个部分：`then-clause`\
  \ 和 `else-clause`。这两个部分中的语句比 `If-Then-Else` 语句的开头多缩进四个空格。`If-Then` 语句的缩进方式与 `If-Then-Else`\
  \ 相同，只是没有 `else-clause`。以下是 `If-Then-Else` 和 `If-Then` 的示例：\n\n![代码片段。](img/9781284166033_APP_P1236-1.jpg)\n\
  描述\n\n对于形成通用多路分支的嵌套 `If-Then-Else` 语句（即第 5 章 中描述的 `If-Then-Else-If`），文中使用了特殊的缩进样式。这是一个示例：\n\
  \n![代码片段。](img/9781284166033_APP_P1236-2.jpg)\n描述\n\n![代码片段。](img/9781284166033_APP_P1237.jpg)\n\
  描述\n\n其余的 C++ 语句均遵循之前提到的基本缩进指南。为了参考，这里是各语句的示例：\n\n![while、do while 和 for 循环以及 switch\
  \ 语句的示例。](img/9781284166033_APP_P1237-1.jpg)\n描述\n\n# 附录 G：关于浮点数的更多\n\n自从我们在第 2\
  \ 章 引入浮点数以来，我们就断断续地使用它们，但尚未对其进行深入探讨。浮点数在计算机上使用时具有特殊的属性。在本附录中，我们将详细考虑它们。\n\n## G.1\
  \ 浮点数的表示\n\n假设我们有一台计算机，每个内存位置的大小相同，并被分为一个符号加上五位十进制数字。当定义变量或常量时，分配给它的位置由五个数字和一个符号组成。当定义\
  \ `int` 变量或常量时，对该处存储数字的解释是非常直观的。当定义 `float` 变量或常量时，存储在那里的数字既有整数部分也有小数部分，因此必须被编码来表示这两个部分。\n\
  \n让我们看看这种编码数字可能是什么样子。我们用五位数可以表示的整数范围是从 -99,999 到 +99,999：\n\n![说明使用 5 位数字和符号值可以存储的数字范围的图。](img/9781284166033_APP_P1238.jpg)\n\
  描述\n\n我们的**精度**（我们能表示的数字位数）是五位，且该范围内的每个数字都可以被精确表示。\n\n如果我们允许其中一个数字（例如最左侧的一个）表示指数会发生什么？\n\
  \n![说明浮点数存储情况的图。](img/9781284166033_APP_P1238-1.jpg)\n描述\n\n那么 +82345 代表数字 +2345\
  \ × 10⁸。我们现在可以表示的数字范围大得多：\n\n![9999 × 10 9 到 9999 × 10 9，或 9,999,000,000,000 到 +9,999,000,000,000](img/9781284166033_APP_P1238-2.jpg)\n\
  \n然而，我们现在的精度只有四位；也就是说，只有四位数字可以被精确表示。如果我们允许这些数字中的一个（例如最左侧的）表示指数会发生什么？实际上，我们的精度现在只有四位；也就是说，只有四位数字可以被精确表示。\n\
  \n\n\n\n由于表示误差的存在，将浮点变量作为循环控制变量是不明智的。因为涉及浮点数的计算可能会丢失精度，因此很难预测类型为 `float`（或 `double`\
  \ 或 `long double`）的循环控制变量何时（甚至是否）会等于终止值。使用浮点型控制变量的计数控制循环可能会表现出不可预测的行为。\n\n同样由于表示误差的原因，你不应该永远对浮点数进行精确相等比较。两个浮点数几乎不可能完全相等，因此你应该对它们进行“近似相等”的比较。如果两个数字之间的差小于某个可以接受的小值，你就可以根据给定问题的需要将它们视为相等。\n\
  \n### G.3 计算机中浮点数的实现\n\n所有的计算机都限制了浮点数的精度，尽管现代机器使用的是二进制运算而非十进制运算。在我们的表示中，为了简化示例，我们只使用了\
  \ 5 位数字，而某些计算机的精度确实仅限制在 4 或 5 位。更典型的系统可能会为 `float` 值提供 6 位有效数字，为 `double` 值提供 15\
  \ 位，为 `long double` 类型提供 19 位。我们只展示了单数字指数，但大多数系统允许 `float` 类型使用 2 位指数，并允许 `long\
  \ double` 类型使用最多 4 位指数。\n\n当你声明一个浮点变量时，假设内存位置的一部分包含指数，而数字本身（称为尾数/阶码）假设位于该位置的其余部分。这种系统被称为“浮点表示”，是因为有效数字的数量是固定的，而小数点在概念上是允许浮动的（根据需要移动到不同的位置）。在我们的编码方案中，每个数字都存储为四位，最左侧的数字非零，并相应地调整指数。这种形式的数字被称为归一化。数字\
  \ 1,000,000 被存储为：\n\n![展示在内存中存储数字 1,000,000 的图表](img/9781284166033_APP_P1242.jpg)\n\
  \n描述\n\n而 0.1032 被存储为：\n\n![展示在内存中存储数字 0.1032 的图表](img/9781284166033_APP_P1242-1.jpg)\n\
  \n描述\n\n归一化提供了可能的最大精度。\n\n#### 模型数\n\n任何可以在计算机中以浮点数精确表示的实数都称为模型数（model number）。值无法精确表示的实数通过最接近它的模型数来近似。在我们四位精度的系统中，0.3021\
  \ 是一个模型数。数值 0.3021409、0.3021222 和 0.30209999999 是计算机用同一个模型数表示的实数示例。下表显示了一个更简单的浮点系统所有的模型数，该系统尾数为一位，指数可以为\
  \ -1、0 或 1。零是一个特殊情况，因为无论指数如何，它的值都相同。\n\n| 0.1 × 10^(-1) | 0.1 × 10⁰ | 0.1 × 10+¹\
  \ |\n| :--- | :--- | :--- |\n| 0.2 × 10^(-1) | 0.2 × 10⁰ | 0.2 × 10+¹ |\n| 0.3 ×\
  \ 10^(-1) | 0.3 × 10⁰ | 0.3 × 10+¹ |\n| 0.4 × 10^(-1) | 0.4 × 10⁰ | 0.4 × 10+¹ |\n\
  | 0.5 × 10^(-1) | 0.5 × 10⁰ | 0.5 × 10+¹ |\n| 0.6 × 10^(-1) | 0.6 × 10⁰ | 0.6 ×\
  \ 10+¹ |\n| 0.7 × 10^(-1) | 0.7 × 10⁰ | 0.7 × 10+¹ |\n| 0.8 × 10^(-1) | 0.8 × 10⁰\
  \ | 0.8 × 10+¹ |\n| 0.9 × 10^(-1) | 0.9 × 10⁰ | 0.9 × 10+¹ |\n\n实数与表示它的模型数之间的差是一种表示误差，称为“舍入误差”（rounding\
  \ error）。我们可以通过两种方式来衡量舍入误差。绝对误差是实数与模型数之间的差；例如，用模型数 0.3021 表示 0.3021409 的绝对误差为 0.0000409。相对误差是绝对误差除以实数，有时以百分比的形式给出；例如，0.0000409\
  \ 除以 0.3021409 等于 0.000135，或 0.0135%。\n\n（注：原文中此处有大量重复段落，已在译文中去重）\n\n\n\n\n请记住，接受误差的选择以及它应该是绝对误差还是相对误差，取决于所解决的问题。我们在示例表达式中展示的误差项完全是任意的，可能并不适用于大多数问题。在解决涉及浮点数比较的问题时，你通常希望误差项越小越好。有时这种选择会在问题描述中指定，或者是显而易见的。某些情况需要对问题的数学原理和特定计算机的表示限制进行仔细分析。此类分析属于被称为“数值分析”的数学分支，并且超出了本书的讨论范围。\n\
  \n### 下溢与溢出\n\n除了表示错误外，在浮点数运算中还有两个需要注意的问题：下溢和溢出。\n\n下溢是指计算值太小而无法被表示时出现的情况。回到我们的进制表示，让我们来看一个涉及小数的计算：\n\
  \n![两个数字的乘法。](img/9781284166033_APP_P1244-2.jpg)\n\n这个值无法在我们的方案中表示，因为指数 -13 太小了。我们的最小值是\
  \ -9。解决这个问题的一种方法是将计算结果设置为 0.0。显然，任何依赖于此计算的答案将是不精确的。\n\n溢出是一个更严重的问题，因为它发生时没有逻辑上的补救措施。例如，计算结果\n\
  \n![两个数字的乘法。](img/9781284166033_APP_P1244-3.jpg)\n\n无法被存储，那么我们该怎么办？为了与对下溢的处理保持一致，我们可以将结果设置为\
  \ 9999 × 10⁹（在这种情况下可表示的最大值）。然而，这在直觉上似乎是错误的。另一种方案是输出错误消息并停止。\n\nC++ 没有定义在发生溢出或下溢时应该发生什么。不同的\
  \ C++ 实现以不同的方式解决这个问题。你可以尝试让你的系统发生溢出并看看会发生什么。某些系统可能会打印运行时错误消息，如“FLOATING POINT OVERFLOW（浮点溢出）”。在其他系统上，你可能会得到表示的最大数字。\n\
  \n虽然我们在讨论的是浮点数的问题，但整数也会发生正向或负向的溢出。大多数 C++ 实现忽略整数溢出。要查看你的系统如何处理这种情况，你应该尝试向 `INT_MAX`\
  \ 加 1，向 `INT_MIN` 减 1。在大多数系统上，向 `INT_MAX` 加 1 会将结果设置为 `INT_MIN`，这是一个负数。\n\n有时你可以通过仔细安排计算来避免溢出。假设你想知道从一副扑牌中可以分出多少不同的五张扑克牌。我们寻找的是从\
  \ 52 张牌中取 5 张的组合数。从 `n` 个元素中取 `r` 个的组合的标准数学公式为：\n\n![一个公式。](img/9781284166033_APP_P1245.jpg)\n\
  \n我们可以使用我们在第 18 章中编写的 `Factorial` 函数，并在赋值语句中编写此公式：\n\n![手牌组合的公式。](img/9781284166033_APP_P1245-1.jpg)\n\
  \n唯一的问题是 `52!` 是一个巨大的数字（大约为 `8.065X × 10⁶⁷`）。而 `47!` 也很大（大约为 `2.5862 × 10⁵⁹`）。这两个数字都远远超过了大多数系统以整数形式精确表示的能力（`52!`\
  \ 需要 68 位数字）。尽管它们在许多机器上可以作为浮点数表示，但大部分精度都丢失了。然而，通过重新安排计算，我们可以在任何具有 9 位或更多数字的系统上获得精确结果。考虑一下，计算\
  \ `52!` 中的大部分部分乘法在乘积除以 `47!` 时被抵消了。\n\n![一个公式。](img/9781284166033_APP_P1245-2.jpg)\n\
  \n所以，我们只需要计算\n\n![一个公式。](img/9781284166033_APP_P1245-3.jpg)\n\n这意味着分子是 `311,875,200`，分母是\
  \ `120`。在具有 9 位或更多数字的系统上，我们得到了精确答案：`2,598,960` 种扑克牌。\n\n### 消去误差\n\n浮点数可能发生的另一种错误被称为消去误差（cancellation\
  \ error），它是当不同数量级的数字相加或相减时的一种表示错误。让我们来看一个例子：\n\n![表达式。左括号，1 加上 0.00001234 减 1，右括号，等于\
  \ 0.00001234。](img/9781284166033_APP_P1245-4.jpg)\n\n算术法则说这个方程应该是正确的。但如果由计算机进行算术运算，它是正确的吗？\n\
  \n![计算的插图。](img/9781284166033_APP_P1246.jpg)\n\n到四位数字来说，和为 `1000 × 10³`。现在计算机减去\
  \ 1：\n\n![计算的插图。](img/9781284166033_APP_P1246-1.jpg)\n\n结果是 0，而不是 `.00001234`。\n\
  \n有时你可以通过仔细安排计算来避免相加差异巨大的浮点数。假设问题需要将许多小的浮点数加到一个大的浮点数。如果程序先汇总较小的数得到一个较大的数，然后再加上大数，结果会更准确。\n\
  \n## 附录 H 使用 C 字符串\n\n从第 2 章开始，我们使用 `string` 类来存储和处理字符字符串。\n\n![代码片段。](img/9781284166033_APP_P1247.jpg)\n\
  \n当我们编写字符串常量时，我们就是在使用 C 字符串。在 C 和 C++ 中，字符串常量是用双引号括的字符序列：\n\n`\"Hi\"`\n\n字符串常量不是\
  \ `string` 类的成员；相反，它被存储为 `char` 数组，其包含每个指定的字符外再多一个——空字符。空字符是 ASCII 和 EBCDIC 字符集中的第一个字符，在内部表示为\
  \ `0`。在 C++ 中，转义序列 `\\0` 代表空字符。当编译器在程序中遇到字符串 `\"Hi\"` 时，它会将 `\"H\"`、`i` 和 `\\0`\
  \ 这三个字符存储到一个三元素的匿名（未命名的）`char` 数组中，如下所示：\n\n![字符数组结构的插图。](img/9781284166033_APP_P1247-1.jpg)\n\
  \n除了 C 字符串常量，我们还可以创建 C 字符串变量。为了这样做，我们显式地声明一个 `char` 数组，并从中存储我们想要的任何字符，最后以空字符结束。这里有一个示例：\n\
  \n\n\n\n![一个代码片段。](img/9781284166033_APP_P1248.jpg)\n\n描述\n\n在 C++ 中，所有的 C 字符串（常量或变量）都被假定是以空字符结尾的。这一约定是所有\
  \ C++ 程序员和标准库函数共同认可的。空字符作为一个哨兵值；它允许算法定位字符串的末尾。例如，这里有一个函数可以确定任何 C 字符串的长度，不计入结尾的空字符：\n\
  \n![StrLength 函数的定义。](img/9781284166033_APP_P1248-1.jpg)\n\n描述\n\n函数返回循环退出时 `i`\
  \ 的值。如果正在检查的数组是\n\n![一个列出数组内容的图。](img/9781284166033_APP_P1248-2.jpg)\n\n描述\n\n那么在循环退出时\
  \ `i` 等于 2。因此，字符串的长度为 2。\n\n`StrLength` 函数的参数可以是一个 C 字符串变量，如函数调用所示\n\n![一个语句。](img/9781284166033_APP_P1249.jpg)\n\
  \n描述\n\n或者它可以是一个字符串常量：`cout`\n\n![一个语句。](img/9781284166033_APP_P1249-1.jpg)\n\n\
  描述\n\n在第一的情况下，`myStr` 数组的基地址被发送到函数，正如我们在第 11 章中讨论的那样。在第二的情况下，基地址也被发送到函数——即编译器为字符串常量预留的未命名数组的基地址。\n\
  \n关于我们的 `StrLength` 函数，我们还有一点需要说明。C++ 程序员实际上并不会手写这个函数。标准库提供了几个字符串处理函数，其中一个名为 `strlen`，它的实现的功能与我们的\
  \ `StrLength` 函数完全相同。在附录的稍后部分，我们将查看 `strlen` 和其他库函数。\n\n### H.1 初始化 C 字符串\n\n在第\
  \ 11 章中，我们展示了如何在声明数组时通过在花括号内指定初始值列表来初始化它，如下：\n\n![一个语句。](img/9781284166033_APP_P1249-2.jpg)\n\
  \n描述\n\n要在声明中初始化 C 字符串变量，你可以使用相同的技术：\n\n![一个语句。](img/9781284166033_APP_P1249-3.jpg)\n\
  \n描述\n\n然而，C++ 允许一种更方便的方法来初始化 C 字符串。你可以直接使用字符串常量来初始化数组：\n\n![一个语句。](img/9781284166033_APP_P1249-4.jpg)\n\
  \n描述\n\n这种简写符号是 C 字符串所特有的，因为没有其他种类的数组存在聚合常量。\n\n我们在第 12 章中提到过，在声明中初始化数组时可以省略数组的大小（在这种情况下，编译器会确定其大小）。这一特性经常用于\
  \ C 字符串，因为它可以避免你去数字符的数量；例如，\n\n![两个语句。](img/9781284166033_APP_P1249-5.jpg)\n\n描述\n\
  \n务必非常注意一点：C++ 将初始化（声明中）和赋值（赋值语句中）视为两种不同的操作。它们适用不同的规则。记住，数组初始化是合法的，但聚合数组赋值是不合法的。\n\
  \n![一个代码片段。](img/9781284166033_APP_P1249-6.jpg)\n\n描述\n\n### H.2 C 字符串的输入与输出\n\n\
  在第 11 章中，我们强调了 C++ 不为数组提供聚合操作。数组上不存在聚合赋值、比较或算术运算。我们也说过，数组的聚合输入/输出是不可能的，例外是\n\n要输出\
  \ C 字符串，我们可以使用 `<<` 运算符。对于 C 字符串，`<<` 运算符输出数组中的每个字符，直到发现空字符。为了应对这些局限性，我们可以使用 `istream`\
  \ 的成员运算符 `>>`。`>>` 运算符会跳过空白字符，然后连续读取字符到数组。例如，假设输入流最初如下（其中 ◊ 表示空白）：\n\n![一个输入流。空白用菱形表示。](img/9781284166033_APP_P1250-4)\n\
  \n那么 `>>` 运算符将 `J`、`o`、`h`、`n` 和 `\\0` 存入 `firstName[0]` 到 `firstName[4]`；将 `S`、`m`、`i`、`t`、`h`\
  \ 和 `\\0` 存入 `lastName[0]` 到 `lastName[5]`；并留下输入流\n\n![一个输入流。空白用菱形表示。](img/P1250-5)\n\
  \n直到 `'\\n'` 字符。然而，`>>` 运算符有两个潜在问题：\n1. 如果数组不足以容纳字符序列（并且 `\\0`），`>>` 运算符将继续向内存写入字符，超出数组边界。\n\
  2. `>>` 运算符无法输入包含空白的字符串（它遇到第一个空白字符就会停止读取）。\n\n`get` 函数也可以用于输入 C 字符串，在这种情况下函数需要两个参数：第一个是数组名，第二个是\
  \ `int` 表达式。`get` 函数不会跳过空白字符，即使它是\n\n\n\n\n\n`get` 函数读取并存储整行输入（最多 80 个字符），包括其中嵌入的空格。如果该行长度少于\
  \ 80 个字符，则读取在 `'\\n'` 处停止，但不会消耗它。此时，换行符将成为输入流中等待的第一个字符。为了读取两个连续行长度的字符串，必须消耗掉换行符：\n\
  \n![一段代码片段。](img/9781284166033_APP_P1251-3.jpg)\n\nDescription\n\n第一次函数调用读取字符，直到（但不包含）`'\\\
  n'`。如果省略了对 `dummy` 的输入，那么 `string2` 的输入将读取不到任何字符，因为 `'\\n'` 会立即成为流中等待的第一个字符。\n\n\
  最后，`ignore` 函数可以与 `get` 函数配合使用。该语句\n\n![一个语句。](img/9781284166033_APP_P1251-4.jpg)\n\
  \nDescription\n\n表示最多跳过 200 个输入字符，但如果读取到换行符则停止。（换行符会被此函数消耗掉。）如果程序从用户处输入了一个长字符串，但只想保留响应的前四个字符，这里是实现该的方法：\n\
  \n![两个语句。](img/9781284166033_APP_P1251-5.jpg)\n\nDescription\n\n![一个语句。](img/9781284166033_APP_P1252.jpg)\n\
  \nDescription\n\n最后一条语句中的值 100 是任意的。任何“足够大”的数字都可以。\n\n下表总结了在读取 C 字符串时，`>>` 运算符与\
  \ `get` 函数之间的差异：\n\n![总结流提取运算符与 get 函数差异的表格。](img/9781284166033_APP_P1252-1.jpg)\n\
  \nDescription\n\n某些库函数和系统提供类的成员函数需要 C 字符串作为参数。一个例子是名为 `open` 的 `ifstream` 类成员函数。为了打开文件，我们将文件名作为\
  \ C 字符串传递，既可以是常量也可以是变量：\n\n![一段代码片段。](img/9781284166033_APP_P1252-2.jpg)\n\nDescription\n\
  \n如果我们的文件名包含在 `string` 类对象中，我们仍然可以使用 `open` 函数，前提是我们使用名为 `c_str` 的 `string` 类成员函数将字符串转换为\
  \ C 字符串：\n\n![一段代码片段。](img/9781284166033_APP_P1252-3.jpg)\n\nDescription\n\n对比这两个代码段，你可以观察到\
  \ `string` 类优于 C 字符串的一个主要优势：`string` 类对象中的字符串具有无界长度，而 C 字符串的长度受数组大小限制，且该大小在编译时是固定的。\n\
  \n### H.3 C 字符串库程序\n\n通过头文件 `cstring`，C++ 标准库提供了大量的 C 字符串操作。在本节中，我们将讨论其中的三个库函数：`strlen`，它返回字符串的长度；`strcmp`，使用小于、等于和大于关系比较两个字符串；`strcpy`，将一个字符串复制到另一个字符串。以下是\
  \ `strlen`、`strcmp` 和 `strcpy` 的总结：\n\n![总结 c string 库中几个函数作用的表格。](img/9781284166033_APP_P1253.jpg)\n\
  \nDescription\n\n`strlen` 函数与我们之前编写的 `StrLength` 函数类似。它返回 C 字符串中终止符 `\\0` 之前的字符数。这里是调用该函数的示例：\n\
  \n![一段代码片段。](img/9781284166033_APP_P1253-1.jpg)\n\nDescription\n\n`strcpy` 例程非常重要，因为\
  \ C 字符串不允许使用 `=` 运算符进行聚合赋值。在下面的代码段中，我们展示了执行字符串拷贝的错误方法和正确方法。\n\n![一段代码片段。](img/9781284166033_APP_P1253-2.jpg)\n\
  \nDescription 在 `strcpy` 的参数列表中，目标字符串位于左侧，就像赋值操作从右侧传输数据到左侧一样。`strcpy` 技术上是一个返回值的函数；它不仅将一个\
  \ C 字符串复制到另一个，还返回目标数组的基地址。调用者想要使用此值的目的并不显而易见，我们在这里不讨论。程序员几乎总是像调用 void 函数一样简单地调用它。`strcmp`\
  \ 函数用于比较两个字符串。它接收两个 C 字符串作为参数并按照字典顺序（即 **string** 对象使用的排序）进行比较。给定函数调用 `strcmp(str1,\
  \ str2)`，它返回以下值之一：如果 `str1 < str2`，返回负整数；如果 `str1 = str2`，返回 0；如果 `str1 > str2`，返回正整数。负整数和正整数的具体值未规定。这是一个示例：\n\
  \n![一个 if 语句。](img/9781284166033_APP_P1254.jpg)\n\nDescription\n\n### H.4 字符串类还是\
  \ C 字符串？\n\n在处理字符串数据时，你应该使用像 `string` 这样的类还是使用 C 字符串？从清晰性、多功能性和易用性来看，没有悬念。使用 `string`\
  \ 类。标准库 `string` 类提供了无界长度的字符串、聚合赋值、聚合比较、使用 `+` 运算符拼接等。然而，熟悉 C 字符串仍然很有用。在目前使用的 C\
  \ 和 C++ 编写的数千软件产品中，大多数（尽管比例正在减少）使用 C 字符串表示字符串数据。在未来的工作中，如果要求修改或升级此类软件，理解 C 字符串是关重要的。\n\
  \n## 附录 I C++ char 常量\n\n在 `C++` 中，`char` 常量有两种形式。第一种形式是用单引号括的单个打印字符：\n\n![几个字符常量。](img/9781284166033_APP_P1255.jpg)\n\
  \nDescription\n\n注意我们说的是打印字符。字符集包括可打印字符和控制字符（或不可打印字符）。控制字符不是用来打印的。在计算早期，包括 C 语言最初开发的时期，计算机的主要界面通常是非常简单的打印机或显示屏。控制字符被用于引导屏幕、打印机和其他硬件设备的操作。随着现代图形界面的出现，控制机制变得更加复杂（见本文的\
  \ GUI 章节）。然而，C++（以及 C）仍然保留这种简单界面的形式，即输入输出到控制窗口或终端程序，该程序模拟了旧式的硬件。\n\n\n\n\n\n如果你查看附录\
  \ E 中的 ASCII 字符集列表，你会发现打印字符是整数值为 32–126 的字符。其余的字符（值为 0–31 和 127）是非打印的控制字符。\n\n为了适应控制字符，C++\
  \ 提供了 `char` 常量的第二形式：转义序列。转义序列是以反斜杠（`\\`）开头的的一个或多个字符；例如，转义序列 `\\n` 代表换行符。以下是 C++\
  \ 中两种形式的 `char` 常量的完整描述：\n\n1. 被单引号括起来的单个打印字符——单引号（`' `）或反斜杠（`\\` `）除外。\n\n2. 被单引号括起来的以下转义序列之一：\n\
  \n| `\\n` | 换行 |\n| :--- | :--- |\n| `\\t` | 水平制表 |\n| `\\v` | 垂直制表 |\n| `\\b` |\
  \ 退格 |\n| `\\r` | 回车 |\n| `\\f` | 换页 |\n| `\\a` | 警告（铃声或蜂叫声） |\n| `\\\\` | 反斜杠 |\n\
  | `\\'` | 单引号（撇符） |\n| `\\\"` | 双引号（引号） |\n| `\\0` | 空字符（所有比特位均为 0） |\n| `\\ddd`\
  \ | 八进制等效（用一个、两个或三个八进制数字指定所需字符的整数值） |\n| `\\xddd` | 十六进制等效（用一个或多个十六进制数字指定所需字符的整数值）\
  \ |\n\n尽管转义序列被写为两个或多个字符，但每个转义序列都代表字符集中的单个字符。警告字符（`\\a`）与 ASCII 中所谓的 BEL 字符相同。在旧的机械打印机上，它实际上会敲响铃铛。如今，它会使终端程序发出蜂叫声。你可以这样输出警告字符：\n\
  \n![一个语句。c out, 2 个左角括号, 单引号, 反斜杠, a, 单引号, 分号。](img/9781284166033_APP_P1255-1.jpg)\n\
  \n在上面的转义序列列表中，标记为“八进制等效”和“十六进制等效”的项允许你通过指定八进制（8 进制）或十六进制（16 进制）整数值来引用你机器字符集中的任何字符。使用这些看似奇怪的进制的原因是因为它们是\
  \ 2 的幂，因此可以更直接地转换为二进制。\n\n注意，你可以像在字符串中使用任何打印字符一样，在字符串中使用转义序列。该语句\n\n![一个语句。](img/9781284166033_APP_P1256.jpg)\n\
  \n描述\n\n会发出蜂鸣声，显示 Whoops! 并终止输出行。该语句\n\n![一个语句。](img/9781284166033_APP_P1256-1.jpg)\n\
  \n描述\n\n输出\n\n![语句的输出。](img/9781284166033_APP_P1256-2.jpg)\n\n描述\n\n并且不终止输出行。\n\n\
