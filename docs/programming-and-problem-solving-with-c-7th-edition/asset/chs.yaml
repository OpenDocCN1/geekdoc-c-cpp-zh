  \n描述\n\n### 标志控制的循环\n\n*标志*（flag）用于改变程序控制流的布尔变量。我们可以在 While 循环之前将布尔变量设置为 `true`；当我们想要停止执行循环时，可以将其重置为\
  \ `false`。也就是说，可以使用布尔变量记录控制过程的事件是否发生。例如，以下代码段读取并累加值，直到输入值为负。（`nonNegative` 是布尔标志；所有其他变量都是\
  \ `int` 类型。）\n\n![使用标志控制循环的代码。](img/9781284166033_CH06_306b.jpg)\n\n描述\n\n注意，我们可以用标志来编写哨兵控制循环。事实上，这段代码使用负值作为哨兵值。\n\
  \n\n\n\n你不需要将标志初始化为 `true`；你可以将它们初始化为 `false`。如果你这样做了，则必须在 `While` 表达式中使用非逻辑运算符（`!`），并在当事件发生时将标志重置为\
  \ `true`。下面的程序计算输入值的平方根，它使用了这种方法。程序计算平方根的初始值（`guess`），将 `goodEnough` 设置为 `false`，循环继续重新计算\
  \ `guess`，直到 `guess*guess` 的绝对值与原始值的差在 `0.001` 以内。`<cmath>` 中的函数 `fabs` 用于计算绝对值。\n\
  \n![使用近似值计算平方根的程序。](img/9781284166033_CH06_307.jpg)\n\nDescription\n\n这里是示例运行的输出：\n\
  \n![使用近似值计算平方根的程序的输出。](img/9781284166033_CH06_307a.jpg)\n\nDescription\n\n### ###\
  \ 循环子任务\n\n我们一直在研究使用循环来影响程序控制流的方法。事实上，循环本身什么也做不了。循环体必须执行一项任务，循环才能完成目标。在本节中，我们将查看三种经常在循环中执行的任务——计数、求和以及跟踪上一个值的值。\n\
  \n#### **计数**\n\n循环中的一个常见任务是跟踪循环执行的次数。例如，下面的代码片段读取并计算输入字符，直到遇到句号为止（`inChar` 的类型为\
  \ `char`；`count` 的类型为 `int`）。示例中的循环有一个计数器变量，但该循环不是计数控制循环，因为该变量并没有被用作循环控制变量。\n\n\
  ![该片段读取并计算输入字符直到遇到句号。](img/9781284166033_CH06_308.jpg)\n\nDescription\n\n循环持续到读到句号为止。循环结束后，`count`\
  \ 包含比读取的字符少一一；也就是说，它计算的是直到但不包括哨兵值（句号）的字符数。请注意，如果句号是第一个字符，则不会进入循环体，`count` 将包含 0，这是符合预期的。我们在这里使用了预读（priming\
  \ read），因为该循环是受哨兵控制的。\n\n示例中的计数器变量被称为**迭代计数器**（iteration counter），因为它的值等于循环迭代的次数。\n\
  \n根据我们的定义，计数控制循环的循环控制变量就是迭代计数器。然而，正如你看到的，并不是所有的迭代计数器都是循环控制变量。\n\n### **求和**\n\n\
  另一个常见的循环任务是对一组数据值求和。注意在下面的示例，无论循环如何控制，求和操作的写法都是相同的。\n\n![使用循环对一组数据值求和的代码。](img/9781284166033_CH06_308a.jpg)\n\
  \nDescription\n\n我们在循环开始之前将 `sum` 初始化为 0，这样当循环体第一次执行时，语句\n\n![将 sum 的当前值加上 number\
  \ 以产生 sum 的新值。](img/9781284166033_CH06_308b.jpg)\n\nDescription\n\n就会将 `sum` 的当前值（0）加上\
  \ `number` 以产生 `sum` 的新值。在整个代码段执行后，`sum` 包含读取的 10 个值的总和，`count` 包含 11，`number` 包含最后读取的值。\n\
  \n在前面的示例中，`count` 在每次迭代中都会递增。对于 `count` 的每一个新值，都有一个新的 `number` 值。这意味着我们可以将 `count`\
  \ 减 1 并检查 `number` 的上一个值吗？不能。一旦新值被读入 `number`，旧值就会永远消失——除非我们将其保存在另一个变量中。我们将在下一节中介绍如何这样做。\n\
  \n让我们来看另一个例子。我们想要对数据集中前 10 个奇数进行计数和求和。我们需要测试每个数字以判断它是偶数还是奇数。（我们可以使用模运算来判断：如果 `number\
  \ % 2` 等于 1，则 `number` 是奇数；否则是偶数。）如果输入值是偶数，我们什么都不做。如果是奇数，我们就增加计数器并将该值加入总和。我们使用一个标志来控制循环，因为这不是一个普通的计数控制循环。这里是程序的列表及其输出。\n\
  \n![读取并求和 10 个奇数的程序。](img/9781284166033_CH06_309.jpg)\n\nDescription\n\n示例输出：\n\n\
  ![使用近似值计算平方根的程序的输出。](img/9781284166033_CH06_307a.jpg)\n\nDescription\n\n等等，让我们根据提供的文本流重新对齐逻辑。用户文本中有“求和”和“跟踪上一个值”作为子标题。我将遵循所提供文本的结构。\n\
  \n（自我修正：用户提供的文本顺序有点乱，我将在保持提供内容的同时对其进行清理。）*\n\n### **跟踪上一个值**\n\n有时我们需要记住上一个值。假设我们想写一个程序来统计文件中不等运算符（`!=`）的次数。我们可以通过简单计算叹号（`!`）后跟一个等号（`=`）出现的次数来实现。完成此任务的一种方法是每次读取输入文件的字符，跟踪最近的两个字符——即当前值和上一个值。在循环的每次迭代中，都会读取一个新的当前值并将旧的当前值变为上一个值。到达\
  \ EOF 时，循环结束。\n\n\n\n\n\n理解循环是如何运作的是一回事，而设计一个能解决特定问题的循环则是另一回事了。在本节中，我们将考虑循环的设计过程。我们可以将这一过程分为两个任务：设计控制流和设计循环内部的处理过程。相反，我们可以将每个任务进一步分为三个阶段：任务本身、初始化和更新。此外，指定程序退出循环时的状态也是重要的，因为一个让变量和文件处于一团糟状态的循环是不良设计。\n\
  \n设计循环时有七个点需要考虑：\n\n1. 结束循环的条件是什么？\n2. 该条件应该如何初始化？\n3. 该条件应该如何更新？\n4. 被重复的处理过程是什么？\n\
  5. 该处理过程应该如何初始化？\n6. 该处理过程应该如何更新？\n7. 退出循环时程序的状态是什么？\n\n我们使用这些问题作为检查清单。前三个问题帮助我们设计控制循环执行的部分。接下来的三个问题帮助我们设计循环内部的处理过程。最后一个问题提醒我们要确保循环以适当的方式退出。\n\
  \n### 设计控制流\n\n循环设计中最重要的一步是决定什么让循环停止。如果终止条件没有经过仔细考虑，我们的程序可能包含无限循环和其他错误。所以，这里是我们的第一个问题：\n\
  \n* 结束循环的条件是什么？\n\n这个问题通常可以通过对问题陈述进行仔细检查来回答。下表列了一些示例：\n\n| 问题陈述中的短语 | 终止条件 |\n|\
  \ :--- | :--- |\n| “累加 365 个温度” | 当计数器达到 365 时循环结束（计数控制循环）。 |\n| “处理文件中的所有数据” |\
  \ 当发生 EOF 时循环结束（EOF 控制循环）。 |\n| “处理到读入 10 个奇数为止” | 当输入了 10 个奇数时循环结束（事件计数器）。 |\n\
  | “用负数测试分数指示数据的结束” | 当遇到负数输入值时循环结束（哨兵控制循环）。 |\n\n现在，我们需要确保循环正确启动的语句，以及允许循环达到终止条件的语句。在此时阶段，我们问接下来的两个问题：\n\
  \n* 该条件应该如何初始化？\n* 该条件应该如何更新？\n\n对这些问题的答案取决于终止条件的类型。\n\n#### 计数控制循环\n\n如果循环是由计数控制的，我们通过给循环控制变量一个初始值来初始化条件。对于循环控制变量同时也是迭代计数器的计数控制循环，初始值通常是\
  \ 1。如果处理过程需要计数器遍历一个特定范围的值，则初始值应该是该范围内的最低值。\n\n条件的更新是通过每次迭代将计数器的值加 1 来完成的。（偶尔，你可能会遇到一个需要计数器从某个值数到某个较低值的问题。在这种情况下，初始值是较大的值，计数器每次迭代减\
  \ 1。）因此，对于对于使用迭代计数器的计数控制循环，这些是关键问题的答案：\n\n* 将迭代计数器初始化为 1。\n* 在每次迭代结束时迭代计数器加 1。\n\
  \n如果循环是由一个计算循环内事件的变量控制的，则控制变量通常初始化为 0，并在每次事件发生时加 1。对于使用事件计数器的计数控制循环，这些是关键问题的答案：\n\
  \n* 将事件计数器初始化为 0。\n* 每当事件发生时，事件计数器加 1。\n\n#### 哨兵控制循环\n\n在哨兵控制循环中，预读（priming read）可能是唯一必要的初始化。如果输入源是文件而不是键盘，可能还需要打开文件以准备读取。为了更新条件，在每次迭代结束时读取一个新值。因此，对于哨兵控制循环，我们这样回答关键问题：\n\
  \n* 如果必要，打开文件，并在进入循环之前输入一个值（预读）。\n* 在每次迭代结束时输入一个用于处理的新值。\n\n#### EOF 控制循环\n\nEOF\
  \ 控制循环需要与哨兵控制循环相同的初始化。如果有必要，必须打开文件并执行预读。循环条件的更新是隐式发生的；每当输入一个值时，流状态都会更新以反映成功或失败。然而，如果循环不读取任何数据，它永远无法到达\
  \ EOF；因此，更新循环意味着循环必须不断读取数据。\n\n#### 标志控制循环\n\n在标志控制循环中，布尔标志变量必须初始化为 `true` 或 `false`，然后在条件改变时进行更新。\n\
  \n* 根据情况将标志变量初始化为 `true` 或 `false`。\n* 一旦条件改变，立即更新标志变量。\n\n在标志控制循环中，在循环结束之前，标志变量基本上保持不变。然后代码检测到某些条件并改变标志的值。由于更新取决于处理过程做了什么，有时我们可能必须在决定如何更新条件之前先设计处理过程。\n\
  \n### 设计循环内部的处理过程\n\n一旦我们选择了循环结构的类型，我们就可以填充处理过程的细节。在设计处理过程时，我们首先决定我们希望单次迭代做什么。假设处理过程只执行一次。处理过程必须执行哪些任务？\n\
  \n* 被重复的处理过程是什么？\n\n为了回答这个问题，我们必须再次查看问题陈述。问题的定义可能要求处理过程累加数据值，或者对满足某些条件的数据值计数。例如：\n\
  \n统计文件中整数的个数 `howMany`。\n\n这句语句告诉我们，被重复的处理过程是一个计数操作。\n\n这是另一个例子：\n\n读取一周内每个工作日的股票价格并计算平均价格。\n\
  \n在这种情况下，处理过程的一部分涉及读取数据值。根据我们对如何计算平均值的知识，我们推断出该过程也必须累加数据值。\n\n除了计数和求加，另一种常见的循环过程是读取数据、执行计算并输出结果。许多其他操作也可以出现在循环过程中。我们在这里只提到了最简单的；稍后我们会查看其他处理过程。\n\
  \n在我们确定了如果过程只执行一次时要执行的操作后，我们就设计为了正确重复所需的处理过程部分。我们通常需要添加一些步骤，以考虑到循环执行了多次的情况。这部分设计通常涉及在循环之前初始化某些变量，然后在每次随后的迭代之前重新初始化或更新它们，这引出了我们接下来的两个问题：\n\
  \n* 处理过程应该如何初始化？\n* 处理过程应该如何更新？\n\n例如，如果循环内的处理过程需要执行多个不同的计数和求和，则每个过程都必须有自己的语句来初始化变量、增加计数变量或将值加到和中。\n\
  \n### 循环退出\n\n\n\n\n当终止条件发生且控制流传递到循环后的语句时，循环中使用的变量仍然包含值。如果已经使用了 `cin` 流，读取标记也会停留在流中的某个位置。或者，输出文件可能有了新内容。如果在程序的稍后部分中使用了这些变量或文件，则循环必须将它们留在适当的状态。因此，设计循环的最后一步是回答这个问题：\n\
  \n*   *退出循环时，程序的状态是怎样的？*\n\n为了回答这个问题，我们必须考虑我们设计的后果，并双重检查其有效性。例如，假设我们使用了一个事件计数器，并且随后的处理依赖于事件的数量。重要的是要确保（通过算法演练）留存在计数器中的值是精确的事件数量——即它没有差\
  \ 1。差 1 错误（Off-by-one bugs）有时被称为 OBOBs。\n\n看这段代码段：\n\n![代码段。](img/9781284166033_CH06_319.jpg)\n\
  \n描述\n\n此循环从输入行读取字符并统计该行中逗号的数量。然而，当循环结束时，`commaCount` 等于实际逗号数加 1，因为循环在任何事件发生之前将事件计数器初始化为\
  \ 1。通过确定循环退出时 `commaCount` 的状态，我们检测到了初始化中的一个缺陷。`commaCount` 应该初始化为 0。\n\n设计正确的循环既依赖于经验，也取决于对设计方法论的应用。在此处，你可能想阅读本章节末尾的“问题解决案例”，看看如何将循环设计过程应用到实际问题中。\n\
  \n## 6.5 嵌套逻辑\n\n就像我们可以嵌套 If 语句一样，我们也可以嵌套 While 语句。通过嵌套，我们可以创建更强大的控制结构。\n\n假设我们想扩展代码来统计单行的逗号，并对文件中的所有行重复此操作。我们只需要将其嵌套在一个由\
  \ EOF 控制的循环内部：\n\n![包含嵌套逻辑的代码。](img/9781284166033_CH06_320.jpg)\n\n描述\n\n因为这两个循环都从同一个文件读取并需要引导读取（priming\
  \ read），我们将引导读取从内层（计算逗号的）循环之前移动到了外层（EOF 控制的）循环之前。这样一来，只需一次读取就为两个循环都做好了引导。在内层循环之前再包含另一个引导读取将是错误的，因为外层引导读取读取的字符在我们测试它之前就会被破坏。\n\
  \n让我们检查一下简单嵌套循环的通用模式。点表示在外层循环中可能进行处理和更新的地方。\n\n![简单嵌套循环的通用模式。点表示在外层循环中可能进行处理和更新的地方。](img/9781284166033_CH06_320a.jpg)\n\
  \n描述\n\n注意每个循环都有自己的初始化、测试和更新操作。外层循环可能除了重复执行内层循环之外不做任何处理。相反，内层循环可能只是外层循环所处理工作的一小部分；内层循环之前或之后可能有许多语句。\n\
  \n让我们看另一个例子。对于嵌套的计数控制循环，模式如下（其中 `outCount` 是外层循环的计数器，`inCount` 是内层循环的计数器，`limit1`\
  \ 和 `limit2` 是每个循环应该执行的次数）：\n\n![嵌套计数控制循环的代码。](img/9781284166033_CH06_321.jpg)\n\
  \n描述\n\n在这里，两个循环都是计数控制循环，但该模式可以用于任何循环组合。\n\n下面的程序展示了一个嵌套在事件控制循环中的计数控制循环。外层循环输入一个整数值，告诉要在屏幕行显示显示多少星号。\n\
  \n![读取数字并显示相应数量星号的程序。](img/9781284166033_CH06_321a.jpg)![读取数字并显示相应数量星号的程序。](img/9781284166033_CH06_322.jpg)\n\
  \n描述\n\n输出：\n\n![读取数字并显示相应数量星号程序的输出。](img/9781284166033_CH06_322a.jpg)\n\n描述\n\n\
  为了看到这段代码如何工作，让我们根据示例会话中显示的数据值追踪其执行。注意，控制循环的事件是在 `cin` 期望数字时输入了一个字母。`cin` 和 `loopCount`\
  \ 是变量，`true` 和 `false` 缩写为 T 和 F。\n\n![读取数字并显示相应数量星号的表格](img/9781284166033_CH06_323.jpg)\n\
  \n描述\n\n### 设计嵌套循环\n\n要设计嵌套循环，我们从外层循环开始。重复的过程包含了内层循环。由于该步骤比单一语句复杂，我们的函数分解告诉我们要将其作为一个单独的模块。稍后我们可以回来像设计其他循环一样设计嵌套循环。\n\
  \n例如，这里是上述代码的设计过程：\n\n1.  结束循环的条件是什么？输入了 `'Q'`。\n2.  条件如何初始化？在循环之前应该执行引导读取。\n3.\
  \  条件如何更新？在每次迭代的结束处应该有一个输入语句。\n4.  重复的过程是什么？根据当前输入整数的值，代码应该跨行显示这么多星号。\n5.  过程如何初始化？不需要初始化。\n\
  6.  过程如何更新？输出星号序列，然后输出一个换行符。没有计数器变量或总和需要更新。\n7.  退出循环时，程序的状态是怎样的？`cin` 流处于失败状态，`starCount`\
  \ 包含最后读取的整数，并且星号行已经显示。\n\n根据这些问题的答案，我们可以写出算法的大部分：\n\n```\nRead starCount\nWHILE\
  \ Stream okay\n    Output starCount asterisks\n    Output newline\n    Prompt\n\
  \    Read starCount\nOutput “Goodbye”\n```\n\n在外层循环之后，显然其体内的过程我们需要设计一个内层循环，因此我们为相应的低层模块重复该方法论：\n\
  \n1.  结束循环的条件是什么？迭代计数器超过了 `starCount` 的值。\n2.  条件如何初始化？迭代计数器应该初始化为 1。\n3.  条件如何更新？每次迭代结束时迭代计数器增加。\n\
  4.  重复的过程是什么？在标准输出设备上输出单个星号。\n\n\n\n\n\n### 5. *过程应该如何初始化？* 无需初始化。\n\n### 6. *过程应该如何更新？*\
  \ 无需更新。\n\n### 7. *退出循环时，程序的状态是怎样的？* 显示了一行星号，写入标记位于当前行末尾，`loopCount` 比 `starCount`\
  \ 的当前值大 1。\n\n现在我们可以编写算法了：\n\n```\nRead starCount\nWHILE Stream okay\n  Set loopCount\
  \ = 1\n  WHILE loopCount <= starCount\n    Output '*'\n    Increment loopCount\n\
  \  Output newline\n  Read starCount\nOutput “Goodbye”\n```\n\n当然，嵌套循环本身可以包含嵌套循环（称为*双层嵌套循环*），而它们也可以再包含嵌套循环（*三层嵌套循环*），以此此类推。你可以将这种设计方法用于任何层级的嵌套。技巧在于通过使用功能分解方法来延迟处理细节——也就是说，首先关注最外层的循环，将每一个新层的嵌套循环视为包含它的循环中的一个模块。\n\
  \n循环内部的过程也可能包含多个循环。例如，在本章早些时候，我们已经使用循环重写了棋盘程序。现在让我们再次重写它，这次在外层循环内部嵌套两个循环。以下是该算法以及随后的代码。\n\
  \n#### 棋盘程序\n\n```\nSet up whiteRow\nSet up blackRow\nSet loopCount to 0\nWHILE\
  \ loopCount < 4\n  Output whiteRows\n  Output blackRows\n  Increment loopCount\n\
  ```\n\n#### 输出 whiteRows\n\n```\nSet loopCount2 to 0\nWHILE loopCount2 < 5\n  Output\
  \ whiteRow\n  Increment loopCount2\n```\n\n#### 输出 blackRows\n```\nSet loopCount2\
  \ to 0\nWHILE loopCount2 < 5\n  Output blackRow\n  Increment loopCount2\n```\n\n\
