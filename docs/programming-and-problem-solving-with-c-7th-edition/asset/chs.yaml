  \n描述\n\n在低级类周围，以避免重复定义。\n\n## 13.6 关于 UML 图的更多内容\n\n在第 12 章中，我们介绍了展示类之间相互关系的 UML\
  \ 图。显而易见，`Entry` 对象的排序列表是非常复杂的。让我们检查这些类之间是如何相互关系的。\n\n`Entry` 类（通过组合）包含 `Name` 和\
  \ `TimeOfDay` 类的对象。\n\n![包含 3 个矩形的 3 个栈的图表，每个矩形垂直堆叠，标记为 Entry、Name 和 Time of day。一个标记为\
  \ name 的箭头从 Entry 栈指向 Name 栈。另一个标记为 time 的箭头从 Entry 栈指向 Time of day 栈。](img/9781284166033_CH13_P794-2.jpg)\n\
  \n反，`SortedList` 类包含一个 `Entry` 对象的数组。\n\n![包含 3 个矩形的 2 个栈的图表，每个矩形垂直堆叠，标记为 sorted\
  \ List 和 Entry。一个标记为 data、左方括号、右方括号的箭头从 Sorted List 栈指向 Entry 栈。](img/9781284166033_CH13_P795-1.jpg)\n\
  \n现在将客户端程序加入进来。它与这些类是什么关系？在我们的示例中，`main` 声明了三个 `Entry` 类型的变量，然后将它们插入一个 `SortedList`\
  \ 类型的变量中。通过这些，我们的客户端程序也包含了 `Name` 和 `TimeOfDay` 类的对象。\n\n![包含 3 个矩形的 3 个栈的图表，每个矩形垂直堆叠，标记为\
