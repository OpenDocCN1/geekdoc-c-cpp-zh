  \n![代码片段。](img/9781284166033_CH11_P627-1.jpg)\n\n描述\n\n该数据结构使用一个维度表示颜色，另一个维度表示汽车品牌。换句话说，两个索引都具有语义内容——我们在上一节中讨论过的概念。\n\
  \n## 11.5 将二维数组作为参数传递\n\n之前我们提到，当一维数组被声明为函数参数时，数组的大小通常会被省略：\n\n![一个表达式。void some\
  \ Func, 左括号, float, alpha, 左方括号, 右方括号, int, size, 右括号。](img/9781284166033_CH11_P628-1.jpg)\n\
  \n如果你在方括号中包含大小，编译器会忽略它。\n\n与一维数组一样，当二维数组作为参数传递时，调用者数组的基地址会被发送到函数。然而，你不能省略两个维度的大小。你可以省略第一个维度（行数）的大小，但不能省略第二个维度（列数）。原因如下。\n\
  \n在计算机内存中，C++ 按行顺序存储二维数组。如果我们把内存看作一长长的内存单元线，那么数组的第一行之后是第二行，接着是第三行，依此类推（参见图 11.12）。\n\
  \n为了定位 `beta[i][j]`，在图 11.12 中，必须指定列数。例如：\n\n```cpp\nvoid someFunc(float alpha[][7],\
  \ int size)\n```\n\n编译器使用列数来计算 `alpha[i][j]` 的地址。计算公式为：\n\n```\nbase_address + (i\
  \ * columns + j) * sizeof(type)\n```\n\n如果缺少列数，编译器就无法确定跳过多少元素才能到达下一行。这就是为什么大小不能省略。\n\
  \n![二维数组的内存布局。](img/9781284166033_CH11_FIGF11_12.jpg)\n\n## 11.6 处理二维数组\n\n处理二维数组通常意味着以四种模式之一访问数组：按单个位置、按行、按列或遍历数组。这些方法都可能涉及子数组。\n\
  \n访问组件的最简单方法是直接查看某个位置。例如，用户可能会输入纬度和度坐标，我们将其作为数组的索引来查找对应的名称。这种过程有时被称为*随机访问*，因为输入数据可能是随机指定的。\n\
  \n在许多情况下，我们需要处理特定行或特定列的所有元素。考虑之前定义的 `hiTemp` 数组，其中行代表周，列代表天。如果我们想找到某一周的平均高温，将对该行求和并除以\
  \ 7。如果我们想找到每周中某日的平均高温，将对该列求和并除以 52。前者的情况是按行访问；后者的情况是按列访问。\n\n现在，假设我们想要确定一年的平均高温。我们必须访问数组中的每个元素，将它们的值求和并除以\
  \ 364。在这种情况下，访问顺序（按行或按列）并不重要。这就是遍历整个数组。\n\n然而，有时顺序是重要的。例如，如果我们想得到每一周的平均高温，我们需要逐行处理每一行。但如果我们想得到每周每一日的平均值，我们需要按列处理整个数组。\n\
  \n让我们通过考虑四个常见的数组处理示例来更详细地观察这些访问模式。\n\n1.  行求和。\n\n2.  列求和。\n\n3.  将数组初始化为全零（或某些特殊值）。\n\
  \n\n\n\n\n# 4. 输出数组。\n\n首先，我们使用通用标识符（如 `row` 和 `col`）定义一些常量和变量，而不是特定于问题的的标识符。然后，我们从通用二维数组处理的角度来看每个算法。\n\
  \n![常量和变量定义的程序代码。](img/9781284166033_CH11_P631-1.jpg)\n\n描述\n\n## 累加行\n\n假设我们对数组中的第\
