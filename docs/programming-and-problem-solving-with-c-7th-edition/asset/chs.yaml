  \ 注释有两种形式。第一种是出现在 `/*` 和 `*/` 之间的任何字符序列。编译器会忽略它们之间的任何内容，即使跨越多行。这是一个示例：![C++注释行](img/9781284166033_CH02_PRE52.jpg)\n\
  \n第二种（也是常见的）形式以双斜杠（`//`）开始。\n\n![C++注释行](img/9781284166033_CH02_PRE53.jpg)\n\n编写带有完整注释程序是良好的风格。注释应该出现在程序的开头，解释它的功能。安排注释使其易于观察是非常重要的。在\
  \ C++ 中，注释会挤占代码，使程序难以阅读。\n\n\n\n\n接下来是一个声明部分，我们在其中定义了常量 `FIRST`、`LAST` 和 `MIDDLE`。注释解释了每个标识符的用法。程序的其余部分是我们的\
  \ `main` 函数的定义。第一行是函数头：保留字 `int`、函数名，以及左括号和右括号。（括号表示 `main` 是函数的名称，而不是变量或常量。）函数体包含了两个变量\
  \ `firstLast` 和 `lastFirst` 的声明，随后是一系列可执行的语句列表。\n\n我们的 `main` 函数通过返回 `0` 作为函数值来结束：\n\
