  \n描述\n\n`While` 语句是一种循环控制结构。语法模板中的“Statement”被称为循环的*body*或*循环体*。在先前的示例中，循环体是输入语句。这个\
  \ `While` 语句的意思是：只要输入值不等于 25，就重复执行循环体。当 `inputVal` 等于 25 时，`While` 循环停止。该循环的作用消耗并忽略输入流中的所有值，直到输入\
  \ 25 为止。\n\n就像 `If` 语句中的条件一样，`While` 语句中的条件可以是任何简单数据类型的表达式。通常它是一个逻辑（布尔）表达式；如果不是，它的值会被隐式地强制转换为\
  \ `bool` 类型。\n\n![解释 while 语句中控制流的图表。](img/9781284166033_CH06_296a.jpg) *注：此处图片路径与上方重复，按原文逻辑保留*\
