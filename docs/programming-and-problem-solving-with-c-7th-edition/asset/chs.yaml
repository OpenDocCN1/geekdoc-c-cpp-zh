  \n描述\n\n我们把其他情况的推演留作一项练习题。我们可以使用相同的技术来提高 `IsThere` 的效率。我们将它的重新实现留作练习题。\n\n### 图形用户界面\
  \ (GUI)\n\n上一节中的驱动程序是一个测试 `SortedList` 类中一些操作的简单程序。我们如何如何创建一个图形界面来执行类似的操作呢？与现有版本一样，我们想要创建\
  \ `Entry` 对象，将它们添加到 `SortedList` 中，从 `SortedList` 中删除它们，并显示列表中存储的 `Entry` 对象。然而，我们需要一个允许用户交互式地输入信息的\
  \ GUI，例如输入名称和时间来构造 `Entry` 对象，以及在点击按钮时在 `SortedList` 中插入或删除这些条目。此外，我们希望 GUI 显示更新后的列表，以便我们看到这些操作的结果。\n\
  \n基于控制的应用程序从 `main` 中的第一条语句开始执行，并逐条继续，直到返回。GUI 应用程序的运行机制从根本上不同。它在 `main` 中开始执行，创建一个新的基于\
  \ GUI 的对象，将其渲染到屏幕上，然后等待事件（用户操作）发生。当用户与 GUI 交互时，会发生多种类型的事件；例如按下按钮、在键盘上打字、触摸屏幕、向左或右滑动、拖动窗口以及许多其他让与计算机程序交互变得有用且方便的事件。在某些情况下，某些事件可能是没用的，甚至是不可能的；例如，我们无法检测不支持触摸屏的电脑触摸。\n\
  \nGUI 程序用于等待事件发生的机制被称为事件循环（event loop）。程序首先建立每个感兴趣的事件与相应的事件处理器之间的连接。事件处理器通常写成函数或类方法。\n\
  \n例如，按钮对象可能有一个“按钮被按下”事件。程序员编写一个方法（事件处理器）来执行按下按钮时应该执行的任何操作。然后，通过调用其方法之一的方法，将事件处理器方法的内存地址传递给按钮对象。一旦获取了事件处理器方法的地址，每次按下按钮时，它只需调用该方法。\n\
  \n在设置好不同类型事件的处理器后，GUI 代码进入一个等待事件的循环。当事件发生时，连接到该事件的事件处理器被调用以执行操作；例如，当用户按下按钮时，按钮会调用传递给它的事件处理器方法。\n\
  \n\n\n\n`EventHandlers` 类的构造函数有一个参数，即指向 `SortedList` 的引用。`insertButtonPushed()`\
  \ 方法不需要返回任何内容，因此被指定为返回 `void` 类型。`deleteButtonPushed()` 方法返回一个 `Boolean` 值，用于指示是否找到了要删除的条目。这将由\
  \ GUI 用于向用户显示一条信息消息，以指示删除是否成功。`fillTextBox()` 方法返回条目列表的字符串表示。条目的排序列表是私有的，因为在类外部不需要使用它。以下是构造函数和方法的实现：\n\
  \n![一个程序段。](img/9781284166033_CH14_P866-2.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH14_P867-1.jpg)\n\
  \n描述\n\n我们包含了 `EventHandlers.h` 头文件，以便为我们需要实现的每个方法提供定义。`fillTextBox()` 方法使用 `ostringstream`\
  \ 来创建条目列表的字符串表示，因此我们包含了 `sstream`，因为它包含了 `ostringstream` 类的定义。\n\n`EventHandlers`\
  \ 构造函数引入了我们以前未见过的新语法，称为初始化列表：\n\n![两个语句。](img/9781284166033_CH14_P867-2.jpg)\n\n\
  描述\n\n初始化列表出现在参数列表和花括号之间，由冒号开头，后面跟着逗号分隔的表达式列表。在这种情况下，列表只有一个表达式，它使用类函数的表示法来通过 `entriesInit`\
  \ 传递的地址来初始化私有成员 `entries`：\n\n![一个语句。冒号、entries、左括号、entries Init、右括号。](img/97881284166033_CH14_P867-3.jpg)\n\
  \n初始化列表用于初始化在花括号内的代码执行之前必须初始化的构造。引用类型的类成员就是这种构造之一，因为 C++ 不允许在构造函数代码开始执行后对其重新初始化，而且它在声明时没有被初始化。因此，初始化列表提供了一个时间窗口，在接收到参数值之后、在构造函数执行之前进行初始化。在这里，它允许我们使用从\
  \ `main` 传递到 GUI 的 `SortedList` 指针来初始化成员。\n\n尽管到目前为止我们一直将花括号之间的代码称为构造函数的体，但需要注意的是，C++\
  \ 正式将“体”定义为包含初始化列表。其余的方法都非常直观。\n\n`insertButtonPushed()` 方法构造一个 `Entry` 对象并将其插入\
  \ `entries` 列表。`deleteButtonPushed()` 方法构造一个新的 `Entry` 对象，然后检查该条目是否存在。如果不存在，它返回\
  \ `false`，表示没有相同时、分、秒的条目可以删除；否则，它删除该条目并返回 `true`。最后，`fillTextBox()` 方法遍历条目列表，并写入\
  \ `ostring-stream` 对象。在调用 `ostringstream str()` 方法获取刚刚创建的字符串后，`fillTextBox` 返回该字符串。\n\
  \nGUI 本身由 `EntriesWindow` 类实现。我们将推迟解释自定义 GUI 的实现细节，直到第 15 章。在本章中，我们只是研究事件处理程序的概念以及它们是如何提供给自定义\
  \ GUI 的。\n\n当创建 `EntriesWindow` 对象时，我们向它传递一个 `EventHandlers` 对象。然后 GUI 使用该 `EventHandlers`\
  \ 对象将 GUI 生成的事件连接到 `EventHandlers` 类提供的事件处理方法。\n\n正如我们在前面的章节中看到的，为了使用 GUI 框架，我们必须创建一个\
  \ `QApplication` 对象，并将来自 `main()` 函数的参数传递给它。\n\n![一个语句。Q Applications、一个 p、左括号、argc、逗号、argv、右括号、分号。](img/9781284166033_CH14_P868-1.jpg)\n\
  \n接下来，我们创建一个新的 `SortedList`，将其传递到 `EventHandlers` 类的构造函数中。然后我们将生成的 `EventHandlers`\
  \ 对象传递到 `EntriesWindow` 类的构造函数中。\n\n![三个语句。](img/9781284166033_CH14_P868-2.jpg)\n\
  \n描述\n\n通过这个示例，你可以真正看到面向对象编程的力量。我们创建一个对象，然后用它来创建另一个对象，而该对象又用于创建第三个对象。`SortedList`\
  \ 现在封装在一个自定义接口中，使用户可以检查内容。最后，我们调用 GUI 的 `show()` 方法渲染界面，并调用 `exec()` 方法启动事件循环。因此，`exec()`\
  \ 返回一个 `int` 状态码，我们可以使用它。这里是 `main` 的完整代码：\n\n```\n![程序段。](img/9781284166033_CH14_P868-3.jpg)\n\
  \n描述\n\n![程序段的延续。](img/9781284166033_CH14_P869-1.jpg)\n\n描述\n```\n\n除了 GUI 提供的插入和删除支持外，正确的设计还可以确保我们不会构建缺失数据的条目。我们已经看到时间小部件的设计强制我们必须有一个有效的时间。但我们也不希望创建一个没有名字或姓的条目。与时间小部件不同，名字和姓的文本框没有默认值，因此我们必须将其作为自定义\
  \ GUI 设计的一部分。\n\n当点击任何按钮时，自定义 GUI 会检查文本框，以在调用 `EventHandlers` 类中的相应方法之前确保每个框都输入了内容。GUI\
  \ 的自定义检查将在下一章介绍。如果任何文本框为空，GUI 显示的示例消息如下：\n\n![标记为 Sorted Entries List 的 GUI 窗口。](img/9781284166033_CH14_P869-2.jpg)\n\
  \n描述\n\n### 测试与调试\n\n一种常见的错误——在堆上留下不可访问的对象——通常源于浅拷贝操作或 `new` 运算符的不正确使用。在图 14.6 中，我们展示了内置赋值运算符如何导致浅拷贝；由一个指针变量指向动态数据对象保持分配状态但无法访问。`new`\
  \ 运算符的误用也会导致动态数据不可访问。例如，执行以下代码段\n\n```\n![一个代码段。](img/9781284166033_CH14_P870-1.jpg)\n\
  ```\n\n描述\n\n会创建一个不可访问的对象：包含 38.5 的动态变量。问题在于我们在最后一条语句中为 `floatPtr` 分配了新值，而没有先释放它指向的变量。为了防止这类错误，请检查代码中所有使用\
  \ `new` 运算符的地方。如果关联变量当前指向数据，请在执行 `new` 操作之前删除所指向的数据。\n\n\n\n最后，悬空指针（dangling pointers）是错误的根源，并且难以检测。悬空指针的一个原因是释放了被多个指针指向的动态数据对象。图\
  \ 14.2D 和 14.2E 展示了这种情况。悬空指针的另一个原因是从函数返回指向自动变量的指针。以下返回 `int` 类型函数值的函数是错误的：\n\n![一段代码片段。](img/9781284166033_CH14_P870-2.jpg)\n\
  \n描述\n\n请记住，自动变量在进入块时隐式创建，离开块时隐式销毁。上述函数返回了局部变量 `n` 的指针，但一旦控制权离开函数，`n` 就会消失。因此，函数的调用者将接收到一个悬空指针。悬空指针的危险之处与未初始化指针危险的原因相同：当你的程序解引用错误的指针值时，它将访问内容未知的内存位置。\n\
  \n测试和调试链式结构之所以复杂，是因为结构中的每个项不仅包含数据部分，还包含指向下一个项的链接。算法必须正确处理数据和链接。\n\n### 测试与调试提示\n\
  \n1. 函数不能返回指向自动局部数据的指针；否则，会导致悬空指针。\n\n2. 如果 `ptrA` 和 `ptrB` 指向同一个动态数据对象，则语句\n\n\
  \    ![一个语句。Delete, int p t r A, 分号。](img/9781284166033_CH14_P870-2.jpg)\n\n   \
  \ 会使 `ptrB` 变成一个悬空指针。你现在应该将 `NULL` 值赋值给 `ptrB`，而不是让它悬空。\n\n3. 在不再需要时释放动态数据。内存泄漏会导致你耗尽内存空间。\n\
  \n4. 无法访问的对象（内存泄漏的另一个原因）是由以下引起的：\n\n    1. 对指向动态数据的指针进行浅拷贝。在设计数据成员指向动态数据的 C++ 类时，务必提供深拷贝操作和拷贝构造函数。\n\
  \n    2. 当关联变量已经指向动态数据时使用 `new` 操作。在执行 `new` 之前，使用 `delete` 释放当前指向的数据。\n\n5. 确保动态链表最后一个节点中的\
  \ `link` 成员已设置为 `NULL`。\n\n6. 在访问动态链表中的组件时，测试链表末尾的方法要确保你不会尝试解引用 `NULL` 指针。在许多系统中，解引用\
  \ `NULL` 指针会导致运行时错误。\n\n7. 确保对每个动态数据结构的外部指针初始化。\n\n8. 不要使用\n\n    ![一个语句。c u r r\
  \ P t r, Plus Plus, 分号。](img/9781284166033_CH14_P871-1.jpg)\n\n    来让 `currPtr`\
  \ 指向动态链表的下一个节点。链表节点并不一定位于堆上的连续内存位置。\n\n9. 密切跟踪指针。过早更改指针值可能会在你尝试访问所指向的变量时引发问题。\n\n\
  10. 如果指向动态数据的 C++ 类有类析构函数但没有拷贝构造函数，不要使用按值传递将类对象传给函数。这将发生浅拷贝，参数和参数将指向同一个动态数据。当函数返回时，参数的析构函数被执行，从而破坏参数的动态数据。\n\
  \n11. `delete` 运算符必须应用于之前由 `new` 返回的指针。此外，`delete` 操作后，指针变量的值变为未定义；在为其分配新值之前，不要再次使用该变量。\n\
  \n12. 函数不能返回指向自动局部数据的指针；否则，会导致悬空指针。\n\n## 总结\n\n指针的一个强大用途是创建动态变量。虽然指针变量可以在编译时声明，但指针所指向的数据仅在运行时创建。内置运算符\
  \ `new` 在自由存储区（堆）上创建一个变量，并返回该变量的地址以存储在指针变量中。动态变量没有名称，而是通过指针变量访问。\n\n使用动态数据可以节省内存空间，因为变量只在运行时需要时才创建。当动态变量不再需要时，可以将其释放（使用\
  \ `delete`）并重用内存空间。在排序大型结构时，使用动态数据还可以节省机器（计算）时间。通过这种方法，我们只需重新排列大型结构的指针，而不是大型结构本身。\n\
  \n当 C++ 类对象指向自由存储区上的数据时，区分浅拷贝和深拷贝操作非常重要。从一个类对象到另一个类对象的浅拷贝只复制指针，导致两个类对象指向同一个动态变量。深拷贝则会产生被指向数据的两个独立副本。操作动态数据的类通常需要一套完整的支持程序集：一个或多个构造函数、一个析构函数（用于清理自由存储区）、一个深拷贝操作和一个拷贝构造函数（用于在一个类对象初始化另一个类对象时进行深拷贝）。\n\
  \n动态数据结构在运行时增长和收缩。它们由节点组成，节点包含两种成员：(1) 组件和 (2) 一个或多个指向相同类型节点的指针。指向第一个节点的指针保存在称为外部指针的变量中。\n\
  \n\n\n\n正如你现在所意识到的，功能分解是一种将问题分解为多个模块的方法论，每个模块解决整个问题的一个部分。实现功能分解的过程被称为`结构化`（或`过程化`）`编程`。某些模块被直接翻译为\
  \ `C++` 语句，而另一些则被编码为函数。生成的程序是相互交互函数的集合（参见图 15.1）。在功能分解中，数据被视为待处理的被动实体。\n\n功能分解对于小型编程是令人满（这是我们在第\
  \ 4 章中讨论过的概念），但通常无法扩展到大型编程。当我们构建大型软件系统时，这种方法有两个重要的局限性。首先，它产生了一个缺乏灵活性的结构。如果顶层算法需要修改，更改可能会迫使许多低级算法也进行修改。其次，该技术无法导致在程序其他部分或其他程序中易于复用的代码。很难获取一个复杂的\
  \ `C++` 函数并并在不同的语文中轻松地复用它。\n\n创建大型软件系统的更好方法是面向对象设计（OOD），我们曾在第 4 章中简要介绍过它。OOD 将问题分解为对象——由数据和对数据的操作组成的自包含的实体。实现面向对象设计的过程被称为`面向对象编程\
  \ (OOP)`。最终结果是一个由相互交互的对象组成的程序（参见图 15.2）。在 OOD 和 OOP 中，数据起着主导作用；算法的主要贡献是实现对对象上的操作。在本章中，我们将看到为什么\
  \ OOD 倾向于产生更易复用的代码。\n\n![3 个标记 function 的块被包含在一个标记 program 的块中。](img/9781284166033_CH15_FIGF01.jpg)\n\
  \n图 15.1 功能分解生成的程序\n\n许多编程语言被创建以支持 OOD 和 OOP：`C++`、`Java`、`C#`、`Swift`、`Python`\
  \ 等。这些面向对象的编程语言具有支持以下内容的设施：\n\n* 数据抽象\n* 继承\n* 动态绑定\n\n你已经看到 `C++` 通过 `class` 机制支持数据抽象。某些非\
  \ OOP 语言也有数据抽象的设施，但只有 OOP 语言支持继承和动态绑定。\n\n![4 个标记 object 的圆被包含在一个标记 program 的块中。对象是操作和数据的集合。](img/9781284166033_CH15_FIGF02.jpg)\n\
  \n图 15.2 面向对象编程生成的程序\n\n## 15.2 继承\n\n在整个世界中，通常可以将概念排列成继承层次结构——即一种层次结构，其中每个概念都继承其在层次结构中正上方概念的属性。例如，我们可以根据图\
  \ 15.3 所示的继承层次结构对不同类型的车辆进行分类。沿着层次结构向下，每种车辆都比其父类（及其所有祖先）更专门，并且比其子类（及其所有后代）更通用。轮式车辆继承所有车辆共有的属性（它承载一个或多个个人并将他们从一个地方运到另一个地方），但还有一个使其更专门的属性（它有轮子）。汽车继承所有轮式车辆共有的属性，但也具有其他更专门的属性（四个轮子、引擎、车身等）。\n\
  \n继承关系可以被视为一种 `is-a`是一个）关系。每辆双门汽车都是汽车，每辆汽车都是轮式车辆，每种轮式车辆都是车辆。这种概念与组合原理不同，在组合中，一个对象包含在另一个对象内部。组合是一种\
  \ `has-a`有一个）关系：包含对象拥有一个是另一个对象的成员。\n\n为了更好地理解继承背后的原理，让我们看看建筑师与程序员工作之间的类比。建筑师处理大型建筑设计复杂性的方式为我们如何组织自己的编程工作提供了一些启发。这种类比让我们能够考虑相同的概念，而不会受到\
  \ `C++` 语法的干扰。\n\n![一个层次结构图使用车辆解释了继承的概念。](img/9781284166033_CH15_FIGF03.jpg)\n\n\
  图 15.3 继承层次结构\n\n描述\n\n### 类比\n\n建筑师首先考虑建筑的整体需求：建筑面积、占用人数、用途等。建筑师面临着任何设计的共同方面：建筑是由楼层组成的。在许多建筑中，楼层都具有共同的特征：相同的尺寸和形状；相同的电梯井、楼梯和用事业主干的相同位置；等等。建筑师从设计一个带有这些共同元素的基础空楼层开始。一旦她将此计划安装到她的计算机辅助设计（`CAD`）程序的库中，她就可以将其作为设计每个楼层的起点。\n\
  \n建筑师可能会进一步决定建筑有两个主要类型的楼层：办公楼层和设备楼层。办公楼层可能是两种类型：行政和标准办公空间。从空楼层开始，建筑师增加了如厕所和走廊等组件来制作办公楼层。她随后可以在空空间内添加办公室和会议室。这样，四种类型的楼层的每一种都派自基础空楼层并添加到库中（参见图\
  \ 15.4）。绘制整个建筑就变成了为每一层创建这些平面的一个实例。\n\n建筑师使用相同的过程设计组成楼层的组件。她可能会设计一种基础办公室类型，然后从该设计派生多种类型的办公室。从给定的办公室类型（如秘书），她可能会将设计细化为子类型，如普通秘书、秘书接待和行政秘书。\n\
  \n创建设计的层次结构简化了建筑师的工作。每个层次结构从建筑组件的最通用形式开始（例如基础空楼层），然后通过向更通用形式添加细节来派生新设计。新设计继承了通用形式的所有特征，使建筑师无需重新绘制共同部分。在某些情况下，她会替换设计的现有部分，例如在接待区域使用了一个比基础秘书办公室显示的更宽的门。替换部分覆盖了最初在更通用形式中指定的内容。\n\
  \n除了单个楼层的组件外，建筑师还可以指定所有楼层共有的特征，例如色彩方案。每个楼层都将继承这些通用属性。有时她会隐藏或删除通用属性的部分，例如为提前租赁的拥有自己公司色彩的公司的特定楼层定制色彩方案。\n\
  \n![6 幅插图解释了楼层类型的层次结构。](img/9781284166033_CH15_FIGF04.jpg)\n\n图 15.4 楼层类型的层次结构\n\
  \n\n\n\n\n# 现在，让我们考虑类层次结构在面向对象设计过程中是如何产生的。在解决问题的阶段，我们发现我们需要一个现有类的变体。例如，在第 14 章的案例研究中，我们发现第\
  \ 12 章中的 `Entry` 类是合适的，但注意到它缺少一个 `ComparedTo` 成员函数。我们还决定该类应该有一个第二个参数化构造函数，它接收一个\
  \ `Name` 对象和一个 `TimeOfDay` 对象作为参数。\n\n我们通过复制 `Entry` 的代码来解决这个问题，然后使用该副本来创建一个具有额外职责的新类。结果是生成了两个名为\
  \ `Entry` 的但互不相关的类。稍后，如果我们在原始的 `Entry` 类中发现 bug，我们必须记得检查扩展类是否存在相同的 bug。但如果对原始类的修复或改进能够自动传播到任何派生类，那不是很好吗？\n\
  \n我们可以通过将 `Entry` 设为 `base class`（基类）或 `superclass`（父类），并将另一个类定义为 `Entry` 的 `derived\
  \ class`（派生类）或 `subclass`（子类）来实现这一目标。例如，如果我们向 `Entry` 添加一个电子邮件字段和职责，`inheritance`（继承）属性会导致它被自动添加到所有派生类中。\n\
  \n通常情况下，你可以选取一个现有类 `A` 作为基类，并在此基础上创建一个新类 `B` 作为派生类。派生类 `B` 继承其基类 `A` 的属性。通过这样做，为\
  \ `A` 定义的数据和操作就变成了 `B` 的预定义。（注意这种 is-a 关系——每个 `B` 也是一个 `A`。）然后你对类 `B` 进行特化，在从 `A`\
  \ 继承属性的基础上添加属性。为了了解这个过程是如何工作的，让我们来看一个 C++ 示例。\n\n### 从一个类派生另一个类\n\n让我们用继承来解决 `Entry`\
  \ 问题；也就是说，创建一个类 `ExpandedEntry`，它具有 `ComparedTo` 函数和额外的参数化构造函数。以下是新类的规格文件：\n\n![A\
  \ code fragment.](img/9781284166033_CH15_P889.jpg)\n\nDescription\n\n该语句\n\n![A\
  \ statement. Class, Expanded Entry, colon, public, Entry.](img/9781284166033_CH15_P890.jpg)\n\
  \n表明 `ExpandedEntry` 派生自 `Entry`。关键字 `public` 声明 `Entry` 是 `ExpandedEntry` 的公共基类。结果是\
  \ `Entry` 的所有公共成员（构造函数除外）也是 `ExpandedEntry` 的公共成员。换句话说，`Entry` 的成员函数 `GetNameStr`\
  \ 和 `GetTimeStr` 也可以为 `ExpandedEntry` 对象被调用。^(1) 然而，`ExpandedEntry` 的公共部分通过添加 `ComparedTo`\
  \ 函数和额外的额外的构造函数对基类进行了特化。这种关系在图 15.5 所示。\n\n![A circular class interface diagram\
  \ labeled, Expanded Entry class.](img/9781284166033_CH15_FIGF05.jpg)\n\n图 15.5 `ExpandedEntry\
  \ 类` 类接口图\n\nDescription\n\n图 15.5 显示每个 `ExpandedEntry` 对象都是一个 `Entry` 对象，并且包含更多。C++\
  \ 使用“base class”和“derived class”而不是“superclass”和“subclass”。“superclass”和“subclass”这两个术语可能会引起混义，因为\
  \ sub 通常意味着更小的东西（例如，数学集合的子集）。相比之下，子类通常比其父类拥有数据和/或函数。\n\n图 15.5 在两个标记为 `GetNameStr`\
  \ 和 `GetTimeStr` 的椭圆之间有箭头。由于 `Entry` 是 `ExpandedEntry` 的基类，且由于 `GetNameStr` 和 `GetTimeStr`\
  \ 没有被 `ExpandedEntry` 重新定义，因此 `ExpandedEntry` 客户端使用的两个函数与 `Entry` 中的函数相同。我们使用相应椭圆之间的箭头来指示这一事实。（注意图\
  \ 15.5，`Entry` 的构造函数是对 `Entry` 的操作，而不是对 `ExpandedEntry` 的。`ExpandedEntry` 类必须有自己的构造函数。）\n\
  \n## ExpandedEntry 类的规格\n\n以下是添加了默认构造函数的 `ExpandedEntry` 类的完整文档规格。注意，预处理器指令\n\n\
  ![A preprocessor directive. Hash include, double quotes, Entry dot h, double quotes.](img/9781284166033_CH15_P891-1.jpg)\n\
  \n对于编译器验证派生类与其基类的一致性是必要的。\n\n![A program segment.](img/9781284166033_CH15_P891)\n\
  \nDescription\n\n### ExpandedEntry 类的实现\n\n由于 `Entry` 是 `ExpandedEntry` 的基类，且由于\
  \ `GetNameStr` 和 `GetTimeStr` 没有被 `ExpandedEntry` 重新定义，因此 `ExpandedEntry` 客户端使用的两个函数与\
  \ `Entry` 中的函数相同。我们使用相应椭圆之间的箭头来指示这一事实。\n\n\n\n\n这一经历说明了为什么面向对象设计的一个重要方面是提前为类的重用做规划。如果我们在最初设计\
  \ `Entry` 时能用更通用的术来考虑它，我们就会包含这些 getter 函数。继承使得通过扩展类来重用变得如此容易，以至于我们几乎总是想要对设计进行泛化，以最大化其未来重用的潜力。\n\
  \n现在我们可以为 `ExtendedEntry` 编写实现文件。当你查看此文件时，请注意为了此新功能扩展基类需要极少的额外代码。这正是面向对象编程中使用继承的意义所在。\n\
  \n![一个程序段。](img/9781284166033_CH15_P894-1.jpg)\n\n描述\n\n我们将文件 `ExpandedEntry.cpp`\
  \ 编译成对象代码文件——例如 `ExpandedEntry.obj`。接下来我们编写一个测试驱动程序并将其编译为 `test.obj`。然后开发环境通过将这两个文件与现有的\
  \ `Entry.obj` 文件链接，创建一个可执行文件。\n\n我们终于准备好测试生成的程序了。这里是用于测试第 13 章中修订后的 `Entry` 类的测试驱动程序代码，随后是它的输出。\n\
  \n![一个程序段。](img/9781284166033_CH15_P895.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH15_P896.jpg)\n\
  \n描述\n\n输出：\n\n![一个程序段的输出。](img/9781284166033_CH15_P896-1.jpg)\n\n描述\n\n通过继承扩展基类的奇妙之处在于，假设基类已经具有必要的\
  \ getter 操作，则无需修改基类。如果这些操作已经存在于 `Entry` 类中，我们就可以在不访问 `Entry` 代码的情况下实现 `ExtendedEntry`。C++\
  \ 编译器能够从基类的规范文件中获取它所需的所有信息，而无需重新编译其实现文件。然后，链接器将派生类的对象代码与现有的基类对象代码合并，生成可执行文件。\n\n\
  `Entry` ADT 的进一步变体可以用创建者从未考虑过的方式创建。诸如 `Entry` 这样的类可以在许多不同的语文中不经修改地使用，也可以通过继承适配到特定的语文中。继承允许我们创建可扩展的数据抽象——派生类通常通过包含额外的私有数据或公共操作（或两者都有）来扩展基类。\n\
  \n### 构造函数的执行顺序\n\n在讨论了继承和组合之后，我们可以对构造函数的执行顺序给出完整的描述：\n\n给定一个类 `X`，如果 `X` 派自基类 `Y`：\n\
  \n1. 首先执行基类（`Y`）构造函数。\n2. 接着执行 `X` 成员对象的构造函数（如果有的话）。\n3. 最后执行 `X` 构造函数的体。\n\n例如，当创建一个\
  \ `ExtendedEntry` 对象时，首先调用 `Entry` 类的构造函数。此操作触发了对它的 `Name` 成员和 `TimeOfDay` 成员的构造函数的调用。之后，执行\
  \ `Entry` 构造函数的体，该函数体是空的。然后执行 `ExtendedEntry` 构造函数的体，它恰好也是空的。\n\n1 如果类声明省略了 `public`\
  \ 单词并开头为\n\n```cpp\nclass DerivedClass : BaseClass\n```\n\n或者如果显式地使用了 `private`\
  \ 单词，\n\n```cpp\nclass DerivedClass : private BaseClass\n```\n\n那么 `BaseClass` 被称为\
  \ `DerivedClass` 的私有基类。`BaseClass` 的公共成员不是 `DerivedClass` 的公共成员；也就是说，`DerivedClass`\
  \ 的客户端不能在 `DerivedClass` 对象上调用 `BaseClass` 操作。本文不涉及私有基类。\n\n## 15.3 动态绑定和虚函数\n\n\
  在章节早期，我们提到面向对象编程语言提供了支持三个概念的语言特征：数据抽象、继承和动态绑定。数据抽象通过类结构实现；我们刚刚涵盖了继承。现在我们涵盖动态绑定。\n\
  \n“动态绑定”这一术语更具体地是指“操作对对象的动态绑定”。为了解释这个概念，让我们来看一个例子。在本章描述的 `TimeOfDay` 和 `ExtTime`\
  \ 类，以下代码创建了四个类对象并使用 `ComparedTo` 函数对它们进行比较：\n\n![代码片段。](img/9781284166033_CH15_P903.jpg)\n\
  \n描述\n\n这段代码片段调用了两个不同的 `ComparedTo` 函数，尽管它们的名称相同。第一个调用了 `TimeOfDay` 的 `ComparedTo`\
  \ 函数；第二个调用了 `ExtTime` 的 `ComparedTo` 函数。在这个代码片段中，编译器使用**静态**（编译时）**绑定**——确定调用哪个\
  \ `ComparedTo` 函数。\n\n在某些情况下，编译器无法确定对象的类型，因此操作的绑定必须在运行时发生。一种情况涉及作为参数传递对象。C++ 关于作为参数传递对象的的基本规则是类型必须相同。通过继承，C++\
  \ 在某种程度上放宽了这一规则。你可以将派生类对象传递给基类参数，但反之不行——更通用地说，你可以将子类的对象传递给基类的参数。这条规则非常有用：它允许我们编写适用于任何子类的单个函数，而不是为每个类编写不同的函数。例如，假设\
  \ `TimeOfDay` 和 `ExtTime` 都有 `Write` 函数。我们可以写一个 `Print` 函数，接收 `TimeOfDay` 类型的对象或任何派自\
  \ `TimeOfDay` 的类：\n\n![代码片段。](img/9781284166033_CH15_P903-1.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH15_P904.jpg)\n\
  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P904-1.jpg)\n\n描述\n\n编译器允许我们将 `TimeOfDay`\
  \ 对象或 `ExtTime` 对象传递给 `Print` 函数。然而，当输出 `endTime` 时，输出中缺少了 `CST` 时区。让我们看看为什么。\n\n\
  ### 切片问题\n\n`Print` 使用值传递参数 `time`。当你通过值传递将派生类对象传递给其基类对象时，只会拷贝它们共同的数据成员。记住，派生类通常比其基类“更大”也就是说，它包含额外的成员。`TimeOfDay`\
  \ 对象有三个数据成员（`hours`、`minutes` 和 `seconds`），但 `ExtTime` 对象有四个数据成员（`hours`、`minutes`、`seconds`\
  \ 和 `zone`）。当较大的类对象通过值传递拷贝到较小的参数时，额外的数据成员会被丢弃或“切掉”。这种情况被称为切片问题（参见**图 15.7）。\n\n\
  切片问题也发生在赋值操作中。在赋值语句中\n\n\n\n\n![A statement. Base Class Object, equals, derived\
  \ Class Object, semicolon.](img/9781284166033_CH15_P904-2.jpg)\n\n只有两个对象共有的数据成员会被复制。`derivedClassObject`\
  \ 中包含的额外数据成员不会被复制。\n\n通过引用传递时，不会发生切片问题（slicing problem），因为调用者参数的地址会被发送到函数中。为了观察这种方法是如何工作的，让我们更改\
  \ `Print` 函数的头部，使 `someEntry` 成为引用参数：\n\n![A function heading. Void, Print, left\
  \ parenthesis, Time of Day, ampersand, time, right parenthesis.](img/9781284166033_CH15_P904-3.jpg)\n\
  \n现在，当我们把 `endTime` 作为参数传递时，它的地址会被发送到函数。它的 `ExtTime` 区域成员（`zone` member）不会被切掉，因为没有发生复制。但\
  \ `Print` 函数仍然只输出 `endTime` 中的三个数据成员——`hours`、`minutes` 和 `seconds`。让我们来看看为什么。\n\
  \n在 `Print` 函数内部，语句中使用了静态绑定（static binding）\n\n![A statement. Time dot write, left\
  \ parenthesis, right parenthesis, semicolon.](img/9781284166033_CH15_P904-4.jpg)\n\
  \n编译器必须在编译时为 `Print` 生成对象代码，但实际参数的类型（`TimeOfDay` 或 `ExtTime`）直到运行时才知道。编译器如何知道应该使用哪一个\
  \ `Write` 函数——`TimeOfDay::Write` 还是 `ExtTime::Write`呢？编译器无法得知，所以它使用了 `TimeOfDay::Write`，因为参数\
  \ `time` 的类型是 `TimeOfDay`。因此，无论参数类型如何，`Print` 函数始终只输出三个值——`hours`、`minutes` 和 `seconds`。\n\
  \n幸运的是，C++ 为切片问题提供了一个解决方案：虚函数（virtual functions）。\n\n![2 circular diagrams explain\
  \ the slicing problem.](img/9781284166033_CH15_FIGF07.jpg)\n\n图 15.7 按值传递导致的切片问题结果\n\
  \nDescription\n\n### 虚函数\n\n为了使函数成为虚函数，我们对 `TimeOfDay` 类声明进行了一处微小的修改：我们在 `Write`\
  \ 函数的声明开头使用了关键字 `virtual`。\n\n![A code fragment.](img/9781284166033_CH15_P905.jpg)\n\
  \nDescription\n\n将成员函数声明为 `virtual` 会指示编译器生成代码，以保证函数到对象的实现 `dynamic`（运行时）`binding`（绑定）；也就是说，对调用哪个函数的决定被推迟到了运行时。（注意，要使\
  \ `Write` 成为一个虚函数，`virtual` 单词只出现在一处——`TimeOfDay` 类的声明中。它不会出现在位于 `TimeOfDay.cpp`\
  \ 文件中的 `Write` 函数定义中，也不会出现在任何重新定义了 `Write` 函数的派生类中——例如 `ExtTime`。）\n\n虚函数的工作方式如下：如果一个类对象通过引用传递给某个函数，并且该函数的体包含一条语句\n\
  \n![A statement. Param dot Member F u n c, left parenthesis, dot, dot, dot, right\
  \ parenthesis, semicolon.](img/9781284166033_CH15_P906.jpg)\n\n那么\n\n1. 如果 `MemberFunc`\
  \ 不是虚函数，则由参数的类型决定调用哪个函数。（使用静态绑定。）\n2. 如果 `MemberFunc` 是虚函数，则由参数的类型决定调用哪个函数。（使用动态绑定。）\n\
  \n仅仅增加一个单词——`virtual`，我们在 `Print` 函数中遇到的困难就完全消失了。如果我们在 `TimeOfDay` 类中将 `Write` 声明为虚函数，那么该函数\n\
  \n![A code fragment.](img/9781284166033_CH15_P906-1.jpg)\n\nDescription\n\n对于类型为\
  \ `TimeofDay` 或类型 `ExtTime` 的参数都能正常工作。正确的 `Write` 函数（`TimeOfDay::Write` 或 `ExtTime::Write`）会被调用，因为参数包含了运行时选择适当函数所需的信息。通过这种方法，从\
  \ `TimeOfDay` 派生一个新的且意料之外的类不会产生任何复杂性。如果新类重新定义了 `Write` 函数，我们的 `Print` 函数仍然正常工作。动态绑定确保每个对象都知道如何输出自己，并调用相应的版本。在\
  \ OOP 术语中，`Write` 是一个 `polymorphic operation`（多态操作）——一种根据运行时遇到的对象类型具有不同含义的操作。\n\n\
  在 C++ 中使用虚函数的一些要点：\n\n1. 为了实现动态绑定，在将类对象传递给函数时必须使用引用传递。如果你使用按值传递，编译器将不会使用 `virtual`\
  \ 机制；相反，会发生成员切片和静态绑定。\n2. 在虚函数的声明中，`virtual` 单词只出现在基类中，而不出现在任何派生类中。\n3. 如果基类声明了虚函数，它必须实现该函数，即使函数体为空。\n\
  4. 派生类不要求提供其对虚函数的重新实现。在这种情况下，默认使用基类的版本。\n5. 派生类不能重定义虚函数的返回类型。\n\n## 15.4 面向对象设计\n\
  \n现在我们已经看到了用于实现面向对象设计的语言特征，现在我们转向设计阶段本身。\n\n程序通常模拟现实生活中的活动或概念。例如，银行程序模拟与银行相关的现实活动。电子表格程序模拟真实的电子表格，这是过去会计师使用的大纸质表单。某些机器人程序模拟人类的感知和动作。\n\
  \nOOD 可以遵循不同的路径。我们将向你介绍一个包含四个阶段的过程，它捕捉了 OOD 的本质。这四个阶段是：脑风暴、过滤、场景探索和责任算法设计。\n\n脑风暴阶段是我们识别问题对象的第一步。我们自由地列出能想到的每一个对象，涵盖问题领域和解决方案领域。\n\
  \n过滤阶段是重新审查脑风暴阶段提出的对象的阶段。我们寻找冗余或可以合并的对象，可能注意到某些遗漏的对象。每个通过过滤阶段的对象都成为解决方案中的一个类，并记录在\
  \ CRC 卡上。CRC 代表类（classes）、责任（responsibilities）和协作（collaborations）。\n\n\n\n\n场景探索是确定每个类行为的阶段。因为一个类负责它自己的行为，我们把这些行为称为**责任**。（你已经见过这种术语的使用了。回想一下，我们将访问器函数称为“知识责任”。）在这个阶段，我们探索“如果……会怎样”的问题，以确保我们检查了所有情况。当每个类的所有责任都确定后，它们就会被记录在类的\
  \ CRC 卡片上。我们还会记录该类为了完成每项责任而必须协作（交互）的其他类的名称。\n\n在最后一个阶段——责任算法设计中，我们为 CRC 卡上列出的每项责任编写算法。这个阶段与功能分解中发生的情况非常相似。\n\
  \n![一个包含 10 行的表格。](img/9781284166033_CH15_FIGF08.jpg)\n\n图 15.8 空空白 CRC 卡片\n\n描述\n\
  \n然而，在许多情况下，责任算法非常简单，不需要进一步分解，我们可以直接编写具体的步骤。请参见`FIGURE 15.8`) 头脑风暴会让人联出一群聪明的广告人士，为最新革命性产品的口号集思广益。现代软件工程项目同样涉及基于多元化团队的创意协作来开发新的创新解决方案。\n\
  \n在面向对象解决问题的背景下，头脑风暴是一种小组活动，旨在产生一个候选类列表，用于解决特定问题。每个参与者都从理解需求文档以及任何与项目技术方面的额外信息开始。\n\
  \n这个过程与个人问题解决有什么关系？问题解决过程中的等效步骤是“理解问题”。提问；尝试用自己的话重写问题陈述。拿一张纸并开始写下可能的类。寻找问题陈述中可能指示问题领域中对象的名词。思考用户将如何与程序交互。检查库中提供的类，看看是否有任何类在解决方案领域中可能有用（包括通过扩展类中的继承）。\n\
  \n当你有了一份可能的类列表后，就可以进入下一个阶段：过滤。\n\n### 过滤\n\n过滤步骤产生一个较小的类列表，我们认为这些类足以解决问题。作为过滤阶段的一部分，我们可能会识别出替代方法，并选择一组对象而不是另一组。\n\
  \n例如，当我们开发一个公路交通管理系统时，我们可能会将经理、司机、信号灯和汽车列为潜在对象。在过滤列表时，我们可能会发现问题可以通过表示经理和司机来解决，也可以通过表示信号灯和汽车来解决——但我们两者都需要。我们可能还会发现\
  \ C++ 标准模板库（STL）包含了我们可以用来来实现列表中的项目的对象。\n\n某些类可能并不真正属于问题的解决方案。例如，如果我们正在写一个计算器应用，我们可能会将用户列为问题领域中的一个对象。然而，用户并不在问题内部；用户是一个为应用提供输入的实体。另一个问题领域对象是“开启”按钮。稍微思考一下就会发现，计算器的“开启”按钮实际上并不是解决方案的一部分；它由用户启动应用程序这一事实表示。\n\
  \n### 场景探索\n\n场景探索阶段的目标为每个类分配责任。责任是每个类必须执行的任务。正如我们看到的，责任最终被实现为函数。在这个阶段，我们只感兴趣任务是什么，而不关心可能如何执行。要讨论一个对象做什么，我们需要确定它的内部状态，称为它的属性。在这个阶段，我们不需要确定这些属性如何表示，只需要知道它们是什么。\n\
  \n例如，我们的 `TimeOfDay` 类有三个属性：`hours`、`seconds` 和 `minutes`。我们将它们表示为三个整数值。事实上，我们可以将时间保持为一个整数值\
  \ `seconds`。然后 `GetHours` 和 `GetMinutes` 就可以通过从 `seconds` 计算来返回这些值。因此，在逻辑（设计）层面，有三个值；但在实现层面，可能只有一个值。我们正在描述的过程是在设计（逻辑）层面的。\n\
  \n我们区分两种责任：类必须了解关于自己的什么信息（知识）以及类必须能够做什么（行为）。类封装了它的数据（属性）；一个类中的对象不能直接访问另一个类中的数据。封装是抽象的关键。然而，每个类都有责任提供与其协作的类所需的关于其自身的信息。\n\
  \n例如，`Student` 类应该“知道”它的名字和地址。这些知识的责任可能是 `Get Name` 和 `Get Address`。地址是保存在 `Student`\
  \ 类中，还是 `Student` 类必须要求其他某个类来访问地址，在这个阶段都是无关的。重要的事实是 `Student` 类能够访问并返回（获取）它自己的名字和地址。\n\
  \n行为的责任看起来更像我们在功能分解中描述的任务。例如，一个学生对象需要计算其 GPA（平均学分点）。在功能分解中，我们会说一项任务是在给定数据的情况下计算\
  \ GPA。在 OOD 中，我们说学生对象负责计算自己的 GPA，可能通过与一个包含学生成绩的对象协作来实现。\n\n这种区别既微妙又深远。计算的最终代码可能相似，但执行方式不同。在过程化设计中，`main`\
  \ 程序调用计算 GPA 的函数，并将学生记录作为参数传递。在面向对象的程序中，向学生对象发送一条消息来计算其 GPA。没有参数，因为向发送消息的对象知道它自己的数据。\n\
  \n我们如何确定责任？这个阶段的名称为我们如何向类分配责任提供了线索。对于我们的目的，场景探索是描述客户端（用户或对象）与为了满足目标而必须协作的任何对象之间交互的步骤序列（目标可能包括\
  \ `main` 应用程序）。\n\n\n\n\n以下是该流程的工作原理。团队通过角色扮演（play-acting）来测试不同的场景。在这次练习中，团队的每个成员都扮演一个类的角色。场景是“如果怎样”脚本，允许参与者演绎不同的情况。当一个类接收到消息时，执行者举起\
  \ CRC 卡并对消息做出响应，必要时可能会向其他成员发送消息。随着脚本的执行，缺失的责任会被挖掘出来，不必要的责任会被检测到。有时对新类的需求也会随之产生。尽管在“你”处于激活状态时在空中挥动卡片最初可能会感到有些尴尬，但当团队成员看到这种技术的有效性时，他们很快就会进入活动状态。请参见图\
  \ 15.9。\n\n此阶段的输出是一组 CRC 卡，代表问题解决方案中的核心类。每个类的责任都列在卡片上，并列出了每个责任必须协作的类。\n\n### 责任算法\n\
  \n最终，必须为这些责任编写算法。因为在面向对象的设计视图中，我们关注的是数据而非动作，所以执行责任的算法通常非常短。例如，知识责任通常返回对象中变量的内容，或向另一个对象发送消息以检索其属性之一。动作责任则稍微复杂一些，通常涉及计算。因此，设计算法的函数分解方法通常适用于行为责任算法。\n\
  \n![一个 5 人团队正在进行讨论的插图。2 名成员坐在对面进行讨论，每个人都拿着一张卡片。1 名成员正在纸上写字。另外 2 名成员在听取讨论。](img/9781284166033_CH15_FIGF09.jpg)\n\
  \n图 15.9 进展中的场景演练\n\n### 结语\n\n总结来说，函数分解关注将输入转换为输出的过程，从而形成任务的层次结构。相比之下，面向对象的设计关注要被转换的数据对象，形成对象的层次结构。问题描述中的名词变成对象；动词变成责任。在自顶向下的设计中，动词是关注重点；在面向对象的设计中，名词是关注重点。\n\
  \n我们描述的这种方法利用了 CRC 卡。这张卡仅仅是一个帮助你组织类的标记设备；它的使用本身并不是一种方法。\n\n2 《韦伯斯特新词典》。\n\n## 15.5\
  \ 实现设计\n\n在面向对象设计（OOD）中，当我们首次识别对象时，它是一个抽象概念。我们不会立即为其属性选择精确的数据表示法。同样，对象的责任从抽象操作开始，最初还没有尝试提供算法。当然，我们最终必须实现它。对于每个抽象对象，我们有两个任务：\n\
  \n* 为其属性选择合适的数据表示法。\n* 为其责任创建算法。\n\n要为对象选择数据表示法，你有三个选择：\n\n1. 使用内置数据类型。\n2. 使用或扩展现有类。\n\
  3. 创建一个新类。\n\n一个好的经验法是按照列出的顺序考虑这些选项。内置类型最容易使用。如果内置类型不足以表示对象，你可以查看类库（系统的或你自己的）中可用的\
  \ ADT（抽象数据类型），查看是否有类与抽象对象相似。因为我们可以使用继承，所以不需要找到完全匹配的，只要类的扩展能够涵盖差异即可。如果不存在合适的 ADT，你必须设计并实现一个新的。\n\
  \n接下来，我们实现责任算法。在 OOD 中，许多责任的算法由几个步骤组成，这些步骤可以直接翻译为 C++。当然，情况并非总是如此。如果一个操作很复杂，最好将其视为一个新问题，并在控制流上使用函数分解。在这种情况下，结合应用函数分解和面向对象方法是恰当的。丰富的程序员对这两者都熟悉，并且经常独立使用或结合使用它们。\n\
  \n### 图形用户界面 (GUI)\n\n### 创建空窗口\n\n之前的案例研究展示了面向对象设计的用处，特别是继承作为重用基类中定义的功能的机制。它还展示了一个复杂的基于控制台的用户界面，允许用户以各种方式与日历交互，并将日历条目的更改保存到文件中。图形界面如何提高此应用程序的用户体验和交互性呢？\n\
  \n通过控制台版本我们可以得出几点观察，这将有助于我们设计有效的 GUI。首先，要从日历中检索条目，我们必须输入姓、中间名和名以及日期，以查找是否存在匹配的条目。如果我们忘记了预约日期怎么办？如果你考虑一个包含十个或更多条目的预约日历，这对于普通人来说很快就会变得不实际！另一个出现的问题是，一切必须按照程序的要求精确输入。如果姓和中间名在不小心输入时没有空格，或者日期和月份弄反了顺序，预约数据很容易出错或损坏。设计良好的\
  \ GUI 将使用户更容易与程序进行交互，同时保护预约数据。\n\n为了改进程序的之前的版本，我们希望对 GUI 版本考虑一些更改，例如在视觉列表中显示日历条目、能够选择列表中的日历条目、用预约数据填充表单、验证表单中的预约数据、将预约数据的更改保存回视觉列表并将更改写入底层日历文件。幸运的是，在第\
  \ 14 章中，我们讨论了类似的 GUI，它可以显示条目并允许用户插入新条目和删除现有条目。我们日历应用程序的图形界面在视觉上大部分相同。我们将允许用户点击列表中的项，将其数据加载到表单中。表单将使用组件显示时间和日期，并有一个按钮保存预约数据，另一个退出应用程序。我们将创建的最终\
