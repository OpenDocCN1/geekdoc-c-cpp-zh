  \n![本书的第一章，标题为编程与问题解决概述。背景图显示了森林中的树。](img/Chapter-opener.jpg)\n\n章节开启：© Joost Lagerweij/EyeEm/Getty\
  \ Images。\n\n## 第 1 章\n编程与问题解决概述\n\n## 1.1 编程概述\n\ncom•put•er ![inline](img/i22-1.jpg)\
  \ n. 通常归于 (1646)：计算的；特指一种可以存储、检索和处理数据的可编程电子设备。1]\n\n对于一个在几十年内改变了生活方式的事物，定义真是简洁！计算机影响了生活的各个领域。这是一本教你如何编程的书。\n\
  \n### 什么是编程？\n人类的行为和思维大部分具有逻辑序列的特征。从婴儿时期起，你就在学习如何行动、如何做事。\n\n你每天所做的很多事情都是自动完成的。幸运的是，你不需要意识地思考像手手翻页这样简单的过程中的每一步：\n\
  \n1. 抬起手。\n2. 将手移动到书的右侧。\n3. 抓住页面的右上角。\n4. 手从右向左移动，直到页面处于合适位置，以便你可以阅读另一面的内容。\n5.\
  \ 松开页面。\n\n你很多在无意识的情况下做的事情，曾经必须一步一步地学习。在更广泛的尺度上，数学通常依赖逻辑步骤序列来解决问题。批量生产涉及按特定顺序进行的操作。我们的整个文明建立在事物和行动的顺序之上。\n\
  \n我们通过我们称为 `programming`#9781284166033_CH01_01.xhtml_c1-sid0001 的过程创建这种排序。本书关注的是为\
  \ `computer`#9781284166033_CH01_01.xhtml_c1-sid0002 编程。\n\n节目列出了演奏者表演曲目的顺序一样，“计算机程序”#9781284166033_CH01_01.xhtml_c1-sid0003\
  \ 列出了计算机执行的步骤序列。从现在起，当我们使用“programming”和“program”这两个词时，我们指的是 `computer programming`#9781284166033_CH01_01.xhtml_c1-sid0004\
  \ 和计算机程序。\n\n### 我们如何编写程序？\n\n\n\n\n\n计算机并不智能。它不能自己分析问题并提出解决方案。相反，必须由人类（程序员）来分析问题，制定解决该问题的指令，然后将其传达给计算机。一旦我们为计算机写好了解决方案，它就能非常快速且一致地重复该解决方案。计算机将人们从重复且无燥的任务中解放出来。\n\
  \n为了编写供计算机遵循的指令，我们必须经历两个阶段的过程：解决问题和实现（参见图 1.1）。\n\n![编程过程中的阶段。](img/9781284166033_CH01_FIGF01.jpg)\n\
  \n图 1.1 编程过程\n\n描述\n\n## 问题解决阶段\n\n1. **分析与规范**：理解（定义）问题以及解决方案必须完成的功能。\n2. **通用解决方案（算法）**：使用人类语言（如英语）和数学符号相结合的方法，制定解决问题的指令。\n\
  3. **验证**：严格按照指令执行，查看解决方案是否真的解决了问题。\n\n### 实现阶段\n\n1. **具体解决方案（程序）**：将算法翻译成编程语言。\n\
  2. **测试**：让计算机遵循指令运行，然后手动检查结果。如果发现错误，分析程序和算法以确定错误源，然后进行修正。\n\n一旦写好程序，它就会进入第三个阶段：维护。\n\
  \n## 维护阶段\n\n1. **使用**：使用程序。\n2. **维护**：修改程序以满足不断变化的需求或纠正在使用过程中出现的任何错误。\n\n这一系列阶段被称为软件开发的瀑布模型。还存在其他开发模型，适用于不同的情况。例如，螺旋模型的通用解决方案来开始编程过程。理解和分析问题花费的时间比图\
  \ 1.1 所示的要多得多。这些步骤是编程过程的核心。\n\n如果我们对计算机程序和算法的定义看起来相似，是因为所有程序都是算法。程序仅仅是为计算机编写的算法。\n\
  \n算法是对解决问题必须采取的动作的口头或书面描述。我们每天都在使用算法。食谱、说明书和指示都是非程序的算法示例。\n\n当你启动汽车时，你遵循一个分步的程序。该算法可能像这样：\n\
  \n1. 按下刹车板。\n2. 确保变速箱处于 P 档。\n3. 按下启动按钮。\n4. 如果引擎没有启动，等待五秒并重复步骤 1 到 3，但重复次数不超过五次。\n\
  5. 如果汽车没有启动，拨打修理。\n\n如果没有第 4 步中的“但重复不超过五次”这个短语，你可能会尝试启动汽车。为什么呢？因为如果汽车出了问题，重复步骤 1\
  \ 到 3 并不会让它启动。这种无尽的情况被称为无限循环。如果我们在第 4 步中省略“但重复不超过五次”，我们就不拥有一个算法了。算法必须在所有可能的情况下在有限时间内终止。\n\
  \n假设程序员需要一个算法来确定某公司员工的周工资，该公司的加班费率是普通薪资率的 1.5 倍。该算法反映了手工操作的内容：\n\n1. 查询员工的薪资率。\n\
  2. 确定每周的工作小时数。\n3. 如果工作小时小于或等于 40 小时，工资为 `hours × pay rate`。\n4. 如果工作小时大于 40 小时，工资为\
  \ `40 × pay rate + (hours – 40) × pay rate × 1.5`。\n\n计算机遵循的步骤通常与你手动进行计算时使用的步骤相同。\n\
  \n在开发出通用解决方案后，程序员测试算法，手动执行每一步。如果算法不起作用，程序员就会重复解决问题的过程，提出另一个算法。通常，第二个算法只是第一个算法的变体。当算法正确后，程序员将其翻译成编程语言。\n\
  \n## 什么是编程语言？\n\n编程语言是遵循严格规则的简化英语形式（带有数学符号）。英语具有歧义，意味着同一个语句可以有多种含义。计算机程序必须具有唯一的含义，因为计算机“不知道”我们的意思。编程语言由于限制了词汇和语法歧义。\n\
  \n将算法翻译成编程语言被称为编码算法。翻译的结果——程序——通过在计算机上运行（执行）来进行测试。如果程序没有产生预期结果，程序员必须对其调试——即确定问题所在并修改程序甚至是算法以修复它。编码和测试算法的结合被称为实现。\n\
  \n实现算法没有单一的方法。例如，一个算法可以翻译成多种编程语言。当两个人将同一个算法翻译成同一种编程语言时，他们可能会产生不同的实现，因为编程语言在算法编码方面具有灵活性（参见图\
  \ 1.2）。由于这种灵活性，人们形成了自己的编码风格。在本文提供了提供了良好编程风格的建议。\n\n![算法的不同实现](img/9781284166033_CH01_FIGF02.jpg)\n\
  \n图 1.2 实现的差异\n\n描述\n\n人们很容易直接从问题定义进入程序编码（参见图 1.3）。然而，这种捷径实际上需要更多的时间和精力。在开始编码之前开发算法有助于你管理问题、保持思路清晰并避免错误。如果你不先想清楚算法，你将花费大量额外时间来调试和修改程序。\n\
  \n![编程过程中的捷径](img/9781284166033_CH01_FIGF03.jpg)\n\n图 1.3 编程捷径？\n\n描述\n\n\n\n\n\
  一旦程序投入使用，就可能需要修复在使用过程中发现的错误，或者根据新的用户需求更改程序。每当对程序进行修改时，必须对程序的这些部分重复解决问题和实现阶段。编程过程的这一阶段被称为**维护**，它占据了大多数程序的大部分工作。一个程序可能在几个月内实现，但随后需要维护很多年。因此，仔细地开发初始问题的解决方案和程序实现是一项极具成本效益的时间投资。\n\
  \n由于维护通常涉及编写第一个版本的程序人员以外的程序员人员，因此文档是编程过程的重要组成部分。文档包括对所解决问题及其解决方案组织结构的书面说明、嵌入程序本身中的注释，以及描述如何使用该程序的用户手册。维护者必须能够阅读并理解代码。\n\
  \n在运行程序时，你必须给计算机提供必要的数据。信息是指任何可以交流的知识，包括抽象的想法和概念，例如“地球是圆的”。数据是以计算机可以使用的形式表示的信息——例如构成地球半径与其体积及表面积关系公式的数字和字母。编程过程的一部分包括决定如何将问题中的信息表述为数据。\n\
  \n快速检查（Quick Check）问题的答案位于章节末尾。\n\n1 摘自 Merriam-Webster. 1994. 《Merriam-Webster\
  \ 大学词典，第十版》。Merriam-Webster Inc.\n\n2 较的编程语言使用美国信息交换标准代码（ASCII）来表示英语字母和其他符号。每个 ASCII\
  \ 字符存储在单个字节中。较新的语言使用一种名为 Unicode 的标准，它包含了许多其他语言的字母。单个 Unicode 字符在计算机内存中占用两个字节。通过程序员付出的少量额外工作，`C++`\
  \ 也可以处理 Unicode。\n\n## 1.2 计算机是如何运行程序的？\n\n在计算机中，程序的所有指令和数据都以二进制代码存储和使用——也就是说，作为\
  \ 1 和 0 的字符串。这种方案使得计算机能够将自己的指令作为一种数据形式进行处理。\n\n当计算机最初开发时，唯一可编程语言是构建在每台机器中的原始指令集，即机器语言，或机器码。\n\
  \n尽管大多数计算机执行相同类型的操作，但它们的设计者为指令选择了不同的二进制代码。因此，一台计算机的机器码与另一台计算机的并不相同。\n\n当程序员使用机器语言进行编程时，他们必须输入各种指令的二进制代码，这是一个枯燥且容易出错的过程。此外，程序难以阅读和修改。随着时间的推移，出现了汇编语言来减轻程序员的工作负担。\n\
  \n汇编语言中的指令以一种易记的形式存在，称为助记符（mnemonic，读音为 nee-MAHN-ik）。典型的加法和减法指令可能如下所示：\n\n![汇编语言及其含义示例](img/9781284166033_CH01_EQ1.jpg)\n\
  \n描述\n\n虽然汇编语言更便于人类操作，但计算机无法直接执行它。计算机科学的根本发现之一是，由于计算机可以将自己的指令作为数据处理，因此可以编写一个程序将汇编语言指令翻译成机器码。\n\
  \n这样的程序被称为汇编器。这个名字源于汇编器做的大部分工作是在表中查找指令片段以找到对应的二进制代码（例如 `ADD = 1001`、`R1 = 001`、`R3\
  \ = 011`、`R5 = 101`），然后将这些指令的二进制片段组装成完整的机器语言指令（`1001 001 011 101`）。汇编器还按照指定的顺序组合指令以创建一个完整的程序。\n\
  \n汇编语言是朝着正确方向的一步，但它仍让我们以机器指令的角度思考。最终，计算机科学家开发了高级编程语言。这些语言比汇编语言更容易使用，因为它们更接近英语和其他自然语言（参见图\
  \ 1.4）。\n\n![抽象的分层](img/9781284166033_CH01_EQ1.jpg)\n\n描述 虽然汇编语言更便于人类操作，但计算机无法直接执行它。计算机科学的根本发现之一是，由于计算机可以将自己的指令作为数据处理，因此可以编写一个程序将汇编语言指令翻译成机器码。\n\
  \n这样的程序被称为汇编器。这个名字源于汇编器做的大部分工作是在表中查找指令片段以找到对应的二进制代码（例如 `ADD = 1001`、`R1 = 001`、`R3\
  \ = 011`、`R5 = 101`），然后将这些指令的二进制片段组装成完整的机器语言指令（`1001 001 011 101`）。汇编器还按照指定的顺序组合指令以创建一个完整的程序。\n\
  \n（注：由于用户提供的文本包含大量重复和重叠部分，译文已根据提供的文本结构对唯一内容进行了去重处理。）\n\n\n\n\n* 计算机可以非常快速地执行算术运算（例如加法和减法）。\n\
  \n编程语言要求我们使用某些控制结构将算法转换为程序。在大多数编程语言中，组织语句（指令）有五种基本方式：顺序、条件、重复、子程序和并发（参见图 1.7）。\n\
  \n![编程语言中的各种控制结构。](img/9781284166033_CH01_FIGF07a.jpg) ![编程语言中的各种控制结构。](img/9781284166033_CH01_FIGF07b.jpg)\n\
  \n描述\n\n图 1.7 语言的基本控制结构\n\n* `sequence`（顺序结构）是一系列接继执行的语句。\n* `selection`（选择结构）是条件控制结构，根据某些条件执行不同的语句。\n\
  * `repetitive`（重复结构）又称为 `loop`（循环），在满足某些条件时重复语句。\n* `subprogram`（子程序）允许我们通过将程序分解为更小的单元来组织程序。\n\
  * `concurrency`（并发）允许多个操作同时发生。\n\n这些组织语句的每种方式都控制计算机执行语句的顺序，这就是为什么它们被称为控制结构。\n\n\
  想象你正在开车。在平直的道路上行驶就像遵循一系列 `sequence` 指令。当你来到道路的分叉口时，必须决定走哪条路，然后选择分叉处的其中一条。这就是计算机在程序中遇到\
  \ `selection` 控制结构（也称为分支）时所做的事情。有时你必须绕好几个街区才能找到停车位。计算机在程序中遇到 `loop` 时，也会做类似的事情。\n\
  \n`subprogram`（子程序）是一个由多个步骤组成的过程。例如，你每天都按照某个程序从家里去上班。那么，有人给你提供会议的路线，说“去办公室，然后向西走四个街区”，而不需要指定去办公室的所有步骤，这是合理的。子程序简化了编写大型程序的任务。\n\
  \n`concurrency`（并发）就像派某人去商店买生日蛋糕，而你自己去用品店买装饰品。今天大多数计算机实际上由多个处理器（称为核心）组成，这意味着程序可以将问题的独立部分分开同时运行，从而更快地完成。\n\
  \n### 什么是软件维护？\n\n在程序的生命周期中，维护阶段占据了典型程序存在的大部分。程序员会开发满足一组规范的程序，但无法预见它将来如何被使用。如果初始实现不足以支持未来的某些用途，则需要新的程序员团队修改程序。经过许多这样的修改后，代码可能会变得非常复杂，难以识别某些原始指令的用途。\n\
  \n反复扩展程序往往会产生错误，因为程序员未能理解程序的早期更改将如何与新更改相互作用。在某些情况下，测试在修改后的程序发布之前未能发现这些错误，由用户发现了。这时，修复错误就变成了一项新的维护任务，通常因为用户急于软件能够工作而匆忙忙地完成。结果是代码更难以理解。随着时间的推移，情况可能变得糟糕到至于每次尝试修复错误都会产生新错误。虽然最好的解决方案可能是重新开始，但完全重写一个大型软件包的成本可能巨大到让公司无法负担，即使用户正在转向竞争对手。\n\
  \n3 在介绍性注释后的第五行中，单词 `cout` 被大写了，而不是完全小写。\n\n## 1.3 计算机内部有什么？\n\n你不需要了解很多计算机就可以学习编写和运行程序。但如果你对计算机部件有所了解，就能更好地理解程序中每条指令的作用。\n\
  \n大多数计算机有五个基本组件：存储单元、算术/逻辑单元、控制单元、输入设备和输出设备。图 1.8 是计算机基本组件的示意图。\n\n![计算机的基本组件。](img/9781284166033_CH01_FIGF08.jpg)\n\
  \n图 1.8 计算机的基本组件\n\n描述\n\nmemory unit（存储单元）由存储单元组成，每个单元都可以存储一条数据。每个单元都有独特的地址，机器语言程序在从中存储数据或从中检索数据时会引用该地址。这些存储单元被称为内存位置。^(4)\
  \ 存储单元持有数据和指令，如图 1.9](#9781284166033_CH01_03.xhtml_c1-fig009)所示。\n\n遵循指令的计算机部分被称为中央处理单元（CPU）](#9781284166033_CH01_03.xhtml_c1-sid019)。CPU\
  \ 通常有两个组件。算术/逻辑单元（ALU）执行算术运算（加法、减法、乘法和除法）和逻辑运算（比较两个值）。控制单元](#9781284166033_CH01_03.xhtml_c1-sid021)指导其他组件的操作，以确保指令按正确的顺序执行。\n\
  \n![内存的视觉表示。](img/9781284166033_CH01_FIGF09.jpg)\n\n图 1.9 内存\n\n描述\n\n为了让计算机有用，必须有将数据输入和输出的方法。输入输出（I/O）设备](#9781284166033_CH01_03.xhtml_c1-sid0022)处理此类操作。键盘和触摸板是常见的输入设备。显示屏是常见的输出设备，打印机也是。某些设备（如辅助存储或计算机网络连接）既用于输入也用于输出。\n\
  \n在大多数情况下，计算机只是在内存中移动和组合数据。许多类型的计算机主要区别在于内存的大小、检索数据的速度、移动或组合数据的效率以及 I/O 设备的限制。\n\
  \n当程序执行时，计算机对每条指令执行一系列步骤，称为取指-执行周期：\n\n1. 控制单元从内存中检索下一条机器语言指令（fetch`）。\n2. 指令被翻译成控制信号（decode`）。\n\
  3. 控制信号告诉相应的单元（算术/逻辑单元、内存、I/O 设备）执行指令（execute`）。\n4. 在需要时保存计算结果（write`）。\n5. 序列从第\
  \ 1 步开始重复。\n\n\n\n\n计算机可以连接各种外围设备。辅助存储设备（或次存储设备）在计算机的主内存之外存储数据和程序。典型的辅助存储设备是磁盘驱动器和闪存。磁盘驱动器使用由磁性材料制成的薄盘。包含电磁铁的读写头在旋转的磁盘上移动，在磁盘表面以磁化位点的形式检索或录制数据。闪存是一种包含电子开关的硅基芯片，这些开关可以被锁定在开启或关闭状态，分别代表二进制\
  \ 1 或 0。与普通计算机内存不同，磁盘和闪存在于电源关闭时仍能保留其内容。\n\n外围设备的其他示例还包括：\n\n*   扫描仪：将纸上的图像转换为数据\n\
  *   DVD（数字多功能光盘）：为了存储视频而开发\n*   WiFi 无线电：将计算机连接到无线网络\n*   音频扬声器和耳机（有线和无线）\n*   麦克风和电子乐器\n\
  *   游戏控制器\n*   数码相机\n\n所有这些物理组件被称为硬件。控制硬件的程序被称为软件。硬件的设计通常是固定的；而软件很容易改变。事实上，软件可以被轻易操作的特性正是计算机成为如此多功能且强大工具的原因。\n\
  \n除了我们编写或运行的程序外，某些软件对于使计算机可用至关重要。操作系统简化了用户/计算机界面，使人类更容易使用机器并管理计算机资源的高效利用（见附图 1.10）。它执行程序、管理屏幕上的窗口、优化次存储、保护计算机免受未经的使用，并控制与网络的连接。\n\
  \n![用户和计算机界面。](img/9781284166033_CH01_FIGF10.jpg)\n\n图 1.10 用户/计算机界面\n\n尽管有时会使用独立（单机）计算机，但大多数计算机都连接到网络。在局域网（LAN）中，计算机通过有线或无线路由器连接，并且必须距离较，例如在同一建筑内。在广域网（WAN）中，计算机在地理上可以相远。最著名的广域网是互联网，它最初用于大学、企业和政府机构交换研究信息。随着万维网（一个访问网页的链接系统）的建立，互联网的普及发生了爆炸式增长。\n\
  \n内存单元也被称为 `RAM`，即随机访问存储器的缩写（之所以这样命名是因为我们可以随机访问任何位置）。\n\n## 1.4 计算职业中的伦理与责任\n\n\
  每个职业都根据一套伦理准则运行，这有助于定义从业者的责任。例如，医疗专业人员有伦理义务对患者信息保密。工程师必须保护公众和环境免受其工作可能造成的伤害。作者在伦理上有义务不抄袭，以此类推。\n\
  \n计算机会以戏剧性的影响人类和环境。因此，它给社会带来了伦理问题的挑战。一些现有的伦理规范适用于计算机，而另一些情况则需要新的规则。在某些情况下，决定什么符合伦理将取决于你。\n\
  \n### 数据盗版\n\n数字数据很容易复制。但就像物理书籍一样，数据通常受版权保护——未经创作者许可复制数据是非法的。这种复制行为被称为数据盗版。\n\n\
  版权法的存在是为了保护书籍和艺术的创作者，以便他们获利。一部大型电影或电脑游戏的开发可能花费数百万美元，这反映在它的购买价格中。录制良好的音乐成本也很高。如果人们制作未经授权的副本，创作者就无法获得报酬。\n\
  \n数据盗版者有时会为自己的盗窃行为辩护，借口他们只是为了自己使用制作了一份副本。毕竟，他们并没有销售一大堆盗版。尽管如此，他们正在剥夺创作者获得作品报酬的机会。\n\
  \n计算专业人员有伦理义务不参与数据盗版，并努力阻止其发生。你不应在未经许可的情况下复制保护的内容，这通常只涉及一小笔费用。\n\n这条规则不仅限于复制受版权的内容；它还包括对他人全部或部分代码的抄袭。如果有人许可你复制他们的代码，那么像任何负责任的作者一样，你应该通过引用来承认该人员。\n\
  \n### 数据隐私\n\n计算机使得包含有关人员、公司等有用信息的数据库成为可能。这些数据库允许雇发放工资支票、允许银行在任何分支机构兑换客户支票、允许政府征税以及允许大众零售商发送垃圾邮件。尽管我们可能不在乎数据库的每一种用途，它们通常具有积极益处。然而，它们也可以用于负面途径。\n\
  \n例如，获取了州车辆数据库访问权限的汽车窃可能会打印出一份带有车主地址的昂贵车型“购物清单”。工业间谍可能会从一家公司窃取数据并卖给竞争对手。尽管这些显然是非法行为，但计算专业人员面临着其他不那么明确的情况。\n\
  \n假设你的工作包括管理公司的工资数据库。你可能忍不住在里面窥探，看看你的薪水与他人相比如何——但这是对同事隐私的不合伦理侵犯。任何不明确属于公开的个人信息都应被视为机密。公开信息的例子是公司网页上的电话号码。私人信息是指任何在提供时已理解其将仅用于特定目的的数据（例如贷款申请中的数据）。\n\
  \n计算专业人员有责任避免利用他们可能拥有的机密数据的特殊访问权限。专业人员还有责任保护这些数据免受未经的访问。保护数据可以涉及此类简单措施，如使用难以猜测的密码，或实施更复杂的措施，如文件加密。\n\
  \n### 计算机资源的使用\n\n计算机是一种特殊的资源，因为运行中的计算机和空闲的计算机之间没有显著的物理差异。相比之下，汽车在工作时是运动的。因此，未经许可使用汽车需要对其进行物理夺取——偷窃。然而，人们可以通过使用其时间和资源，在不进行物理夺取的情况下未经授权使用计算机，这通常被称为黑客行为。\n\
  \n\n\n黑客可能带有恶意意，例如窃取数据或使用受入侵的计算机在实施其他犯罪时隐藏身份。一种具有破坏性的程序是病毒——一种自我复制的程序，其目标是传播到其他计算机，通常通过电子邮件或共享文件。某些病毒具有很强的破坏性。已经发生过病毒导致数百万美元数据损失的事件。与通过用户之间的接触传播的病毒不同，蠕虫\
  \ 利用计算机安全中的漏洞，劫持计算机并在互联网上搜索具有相同漏洞的其它计算机。当一台计算机被接管并用于其他用途（例如发送虚假的社交媒体帖子）时，它被称为僵尸。\n\
  \n这类有害程序统称为恶意软件。现在垃圾邮件占了全球电子邮件流量的大部分，某些病毒已向受害者索要过钱，僵尸网络也被用于关闭部分互联网，恶意软件对计算行业产生的影响是巨大的。\n\
  \n计算专业人员绝不应该参与黑客行为。我们也有责任帮助保护我们使用的计算机，例如关注异常活动迹象、在编写应用程序时不引入安全漏洞、在在发布安全更新时进行安装、检查文件是否包含病毒等。\n\
  \n## 软件工程\n\n人类在生活的许多方面已经极度依赖计算机。这种依赖源于人们认为计算机运行可靠的认知；即它们在大多数时间里运行都是完全正确的。然而，计算机的可靠性取决于编写其软件时的细心程度。\n\
  \n程序中的错误可能会导致严重后果，如下几个涉及软件错误的真实案例所展示的那样：\n\n*   F-18 战斗机控制软件中的错误导致它在第一次飞越赤道时发生了翻转。\n\
  *   一次火箭发射失去控制，火箭不得不被炸毁，这是因为在控制软件中将句号写成了逗号。\n*   一台放射治疗机杀死几名患者，因为一个软件错误导致操作员输入某些命令过快时，机器以全功率运行。\n\
  \n即使软件被用于不那么关键的情况，错误也可能产生重大影响。此类错误的示例包括：\n\n*   你的文字处理程序中的错误导致你的期末论文在截止前几小时丢失了。\n\
  *   统计程序中的错误导致科学家得出错误的结论，并发表了一篇后来必须撤回的论文。\n*   报税程序中的错误产生了不正确的纳税申报表，导致纳税人被罚款。\n\n\
  程序员有责任开发无错误的软件。用于开发正确软件的过程被称为软件工程。\n\n软件工程有许多方面。本章开头描述的软件生命周期概述了软件开发的各个阶段。在每个阶段都会使用不同的技术，我们在本文中讨论了其中的许多技术。在第\
  \ 4 章中，我们介绍了开发正确算法的方法论。我们在每一章中都会讨论测试和验证程序的策略。我们使用一种能够让我们编写出易读、组织良好的程序的编程语言，等等。软件工程的某些方面（例如为程序开发形式的数学规范）超出了本文的涉及范围。\n\
  \n## 1.5 解决问题的技巧\n\n你每天都在解决问题，但往往没有意识到自己正在经历这一过程。在学习环境中，你通常会被给你大部分所需的信息：清晰的问题陈述、必要的输入和要求的输出。在现实生活中，这个过程并不总是如此简单。你通常需要自己定义问题，然后决定你需要哪些信息来处理，以及结果应该是什么。\n\
  \n在理解并分析问题之后，你必须想出一个解决方案——算法。早些我们定义算法为在有限时间内解决问题的程序。虽然你一直在与算法打交道，但你的大部分经验是在遵循它们。你遵循食谱、玩游戏、组装玩具、吃药。相比之下，在编程的问题解决阶段，你将设计算法。这要求你意识到自己用于解决问题时采用的策略。\n\
  \n### 提问\n\n如果你通过口头接到一项任务，你就会提问——什么时候？为什么？在哪里？——直到你完全明白需要做什么。如果你的指令是书面的，你可能会在空白处写下问题，或者以其他方式指示任务不明确。你的问题可能会在后面的段落中得到，或者你可能必须与给你任务的人讨论。\n\
  \n以下是你在编程背景下可能会问的一些问题：\n\n*   我需要处理什么——也就是说，我的数据是什么？\n*   数据项是什么样子的？\n*   有多少数据？\n\
  *   我将如何知道我已经处理了所有数据？\n*   我的输出应该是什么样子的？\n*   过程将重复多少次？\n*   可能会出现什么特殊情况？\n\n###\
  \ 寻找熟悉的事物\n\n永远不要重复轮子。如果你以前解决过类似的问题，只需重复你的方案。人类擅长识别相似的情况。在编程中，某些问题会以不同的形式反复出现。程序员能立即识别出他们解决过的子任务并套用解决方案。例如，寻找最高和最低温度与寻找考试的最高和最低分实际上是同一个问题（参见图\
  \ 1.11）。\n\n![寻找熟悉的事物](img/9781284166033_CH01_FIGF11.jpg)\n\n图 1.11 寻找熟悉的事物\n\n\
  Description\n\n### 类比法\n\n通常一个问题会让你想起以前见过的类似问题。如果你记得如何解决另一个问题，你可能会发现解决手头的问题变得更容易。换句话说，在两个问题之间建立类比。例如，艺术课上透视投影问题的解决方案可能会帮助你计算映射程序中点之间的距离。当你处理新问题时，可能会发现与旧问题的不同之处，但通常这些你可以逐一处理的问题。\n\
  \n类比实际上是寻找熟悉事物策略的更广泛的应用。当你尝试为解决问题寻找算法时，不要局限于面向计算机的解决方案。后退一步，尝试获得更大的视角。不要担心你的类比并不完全匹配——使用类比的唯一理由是它提供了一个起点（参见图\
  \ 1.12）。最好的程序员是那些在解决各种类型问题方面拥有广泛经验的人。\n\n![基于其他事物的类比](img/9781284166033_CH01_FIGF12.jpg)\n\
  \n图 1.12 类比\n\nDescription\n\n### 手段-分析法\n\n\n\n\n通常，初始状态和结束状态是给定的；问题在于识别出能从其中一个状态到达另一个状态的动作。假设你想从马萨诸塞州的波士顿去到德克萨斯州的奥斯汀。你知道初始状态（波士顿）和结束状态（奥斯汀）。哪些动作可以带你从一个地方到达另一个地方？你可以飞行、开车、坐公共汽车等等。你的选择取决于具体情况。如果你赶时间，你可能会选择飞机。\n\
  \n一旦你确定了整体策略，就必须制定细节。建立中间目标可能会有所帮助。假设从芝加哥飞往奥斯汀有非常便宜的直航班。你可能会将旅程分为几段：波士顿到芝加哥，然后从芝加哥到奥斯汀。你的中间目标是从波士顿到达芝加哥。现在你只需要检查实现该中间目标的手段（参见图\
  \ 1.13）。\n\n![手段分析分析的示例。](img/9781284166033_CH01_FIGF13.jpg)\n\n图 1.13 手段-分析\n\n\
  描述\n\n手段分析的整体策略是定义目标，然后分析你在目标之间移动的手段。这个过程很容易转化为编程。你首先写下输入是什么、输出应该是什么。然后你考虑计算机可以执行的动作，并识别将数据转换为结果的动作。\n\
  \n### 分治法\n\n我们经常将大问题分解成更更容易处理的小单元。清理整个房子可能看起来让人无从下手；一个一个地清理房间似乎要容易应对得多。如果我们有朋友帮助我们，分工合作会让整个任务进展快得多（并行处理）。同样的原理也适用于编程：我们可以将一个大问题分解成可以单独解决的小片段（参见图\
  \ 1.14）。第 4 章中描述的功能分解和面向对象编程方法论都是基于分治原则。\n\n![分治策略。](img/9781284166033_CH01_FIGF14.jpg)\n\
  \n图 1.14 分治法\n\n描述\n\n### 积木块法\n\n处理大问题的另一种方法是看是否存在针对问题较小部分的解决方案。可能通过组合这些解决方案来解决大问题的大部分。这种策略是“寻找熟悉事物”和“分治”方法的结合。你观察大问题，发现它可以被拆分成若干已有解决方案的小问题。解决大问题只需将现有的解决方案组合在一起，就像用砂浆将积木组合成墙一样（参见图\
  \ 1.15）。\n\n![解决问题的积木块法。](img/9781284166033_CH01_FIGF15.jpg)\n\n图 1.15 积木块法\n\n\
  描述\n\n### 合并解决方案\n\n合并现有解决方案的另一种方法是逐步合并。例如，为了计算数值列表的平均值，我们必须对这些值进行求和和计数。如果我们已经有了求和数值和计数数值的独立解决方案，就可以将它们合并。但如果我们先求和后计数，就必须读取两次列表。如果我们合并这两种解决方案，就可以节省步骤：读取一个值，将其加到运行总和中，并在处理下一个值之前给计数器加\
  \ 1。每当子问题的解决方案出现重复步骤时，考虑合并它们，而不是首尾相接地连接（参见图 1.16）。\n\n![解决问题的合并解决方案策略。](img/9781284166033_CH01_FIGF16.jpg)\n\
  \n图 1.16 合并解决方案\n\n描述\n\n### 心理障碍：对开始的恐惧\n\n作家们太熟悉盯着空白页面不知道从何下手的经历了。程序员在第一次处理问题时也有同样的困难。我们该如何开始？\n\
  \n记住，你总有解决任何问题的方法：用你自己的语言把它写在纸上，以便于你理解它。一旦你转述了问题，你就可以单独关注每个子部分，而不是试图一次性解决所有问题。这个过程有助于你看到问题中看起来熟悉或与你解决过的其他问题相似的部分。\n\
  \n### 算法解决问题\n\n想出一个解决特定问题的程序并非一蹴而就。事实上，它通常涉及尝试。每次失败都会让你变得明智。\n\n在接下来的问题解决案例中，我们将开发一个判断年份是否为闰年的程序。该案例体现了编写算法和编码涉及的思想过程，并向你展示完整程序的样子。\n\
  \n# 第 2 章语法、语义与程序开发过程\n\n## 2.1 C++ 程序的元素\n\n在本章中，我们开始研究构成 C++ 编程语言的规则和符号。我们还将回顾创建和运行程序所需的步骤。\n\
  \n### C++ 程序结构\n\n在第 1 章中，我们讨论了编程语言动作的五种基本结构：顺序、选择、循环、子程序和并发。我们说子程序允许单独编写程序的部分，然后将它们组合成一个工作的整体。在\
  \ C++ 中，子程序被称为函数，C++ 程序是一个一个或多个函数的集合。\n\n![C++ 程序的结构。](img/9781284166033_CH02_UFIG46-1.jpg)\n\
  \n描述\n\n每个 C++ 程序必须有一个名为 `main` 的函数。程序的执行始终从 `main` 函数开始。你可以把 `main` 想为协调其他函数的角色。例如，当\
  \ `main` 想让名为 `Square` 的函数执行任务时，`main` 调用（或唤起）`Square`。当 `Square` 函数执行完毕后，它会将控制权返回给\
  \ `main`，以便它可以继续执行。\n\n\n\n\n让我们来看一个包含三个函数的 C++ 程序示例：`main`、`Square` 和 `Cube`。不要过分程序中的细节——只需观察它的整体外观和结构即可。\n\
  \n![一个包含三个函数 main、Square 和 Cube 的 C++ 程序列表。](img/9781284166033_CH02_UFIG47-1.jpg)\n\
  \n描述\n\n在三个函数中的每一个中，左大括号（`{`）和右大括号（`}`）标记了要执行语句的开始和结束。出现在大括号之间的语句被称为函数体。\n\n程序的执行始终从\
  \ `main` 函数的第一条语句开始。在我们的程序中，第一条语句是\n\n![程序代码。第 1 行：cout out，双左尖角，双引号，“27 的平方是：”，双引号，双左尖角，Square\
  \ 左括号 27 右括号，双左尖角，结束 l，分号。](img/9781284166033_CH02_PRE1.jpg)\n\n这条输出语句会导致信息出现在计算机屏幕上。你将在本章稍后的部分学习如何构造输出语句。简之，这条语句显示了两个项。第一个是消息：\n\
  \n![程序输出。27 的平方是。](img/9781284166033_CH02_PRE2.jpg)\n\n第二个要显示的项是通过调用 `Square` 获取的值，其中以\
  \ `27` 为要平方的数字。`Square` 函数计算该数字的平方并将计算出的结果（`729`）返回给它的调用者 `main`。现在 `main` 就可以显示值\
  \ `729` 并继续执行下一条语句。\n\n类似地，`main` 中的第二条语句输出了消息\n\n![程序输出。以及 27 的立方是。](img/9781284166033_CH02_PRE3.jpg)\n\
  \n然后调用 `Cube` 并显示结果 `19683`。因此，该程序的完整输出是：\n\n![程序输出。第 1 行：27 的平方是 729。第 2 行：以及 27\
  \ 的立方是 19683。](img/9781284166033_CH02_PRE4.jpg)\n\n`Square` 和 `Cube` 都是返回值的函数示例。返回值的函数向其调用者返回单一值。`Square`\
  \ 函数第一行开头的单词 `int` \n\n![程序代码。第 1 行：i n t, Square，左括号，i n t, n，右括号。](img/9781284166033_CH02_PRE5.jpg)\n\
  \n表示该函数返回一个整数值。\n\n现在再次查看 `main` 函数。你会函数的第一行是\n\n![程序代码。第 1 行：i n t, main，左括号，右括号。](img/9781284166033_CH02_PRE6.jpg)\n\
  \n单词 `int` 表示 `main` 是一个返回整数值的返回值函数。如你所见，`main` 的最后一行是\n\n![程序代码。第 1 行：return, 0，分号。](img/9781284166033_CH02_PRE7.jpg)\n\
  \n它向其调用者返回值 `0`。但是谁在调用 `main` 函数呢？操作系统。\n\n在 C++ 程序中，操作系统被认为是 `main` 的调用者。操作系统期望\
  \ `main` 在执行完毕后返回一个值。按照惯例，返回值为 `0` 意味着一切正常。返回其他任何值（通常为 `1`、`2`、`. . .`）意味着出了某些问题。通常我们通过返回\
  \ `0` 来结束 `main` 的执行。\n\n我们现在已经看到了 C++ 程序的样貌——由一个或多个函数（包括 `main`）组成。我们已经看到 `main`\
  \ 是必需的函数，执行从中开始，并且它向操作系统返回一个值。接下来我们将介绍一些符号，这将帮助我们精确地定义 C++ 语言的组件。\n\n### 语法与语义\n\
  \n编程语言由一组规则定义，这些规则规定了如何编写有效语句以及这些语句在执行时会做什么。特别是，对于语法和语义都有相应的规则。\n\n语法是一套正式的规则，它精确定义了字母、数字和符号的组合如何在编程语言中使用。正如我们我们在第\
  \ 1 章中所看到的，编程语言中没有歧义的空间，因为计算机并“不知道我们的意思”。为了避免歧义，语法规则本身必须用一种非常简单、精确、正式的语言编写，这种语言称为元语言。\n\
  \n### 语法模板\n\n在这些模板中，大括号再次表示可以从中选择的项目列表。让我们来看一个示例。这个模板定义了一个标识符：\n\n![标识符的模板。](img/9781284166033_CH02_UFIG49-1.jpg)\n\
  \n描述\n\n阴影部分表示定义中的可选部分。三个点（. . . ）意味着前面的符号可以重复。因此，C++ 中的标识符必须以字母或下划线开头，并可选跟随一个或多个字母、下划线或数字。\n\
  \n现在让我们来看 C++ `main` 函数的语法模板。`main` 函数的语法如下：\n\n```cpp\nint main() {\n    . . .\n\
  }\n```\n\n`main` 函数以单词 `int` 开始，随后是单词 `main` 以及左右括号。该函数的第一行是头部。在头部之后，左大括号标志着函数体语句的开始。阴影和三个点表示函数体由零个或多个语句组成。右大括号表示函数体的结束。\n\
  \n从原理上讲，语法模板允许函数体为空。在实践中，它应该包含一个返回语句，因为函数头部中的 `int` 表明 `main` 返回一个整数值。因此，最短的 C++\
  \ 程序是：\n\n```cpp\nint main() {\n    return 0;\n}\n```\n\n\n\n\n正如你可能猜到的，这个程序什么都不做，然后返回到操作系统。为了让它变得有用，我们必须在\
  \ `return` 语句之前插入其他 C++ 语句。但在讨论编写语句之前，我们必须先看看 C++ 中名称是如何命名的，以及程序的一些元素。\n\n### 命名程序元素：标识符\n\
  \n在 C++ 中，标识符被用于命名事物——例如子程序和计算机内存中的位置。正如我们刚刚看到的，标识符由字母（A–Z，a–z）、数字（0–9）和下划线字符（`_`）组成，但必须以字母或下划线开头。\n\
  \n记住标识符必须字母字母或下划线开头\n\n![标识符的模板是 C++](img/9781284166033_CH02_UFIG51-1.jpg)\n\n描述\n\
  \n以下划线开头的标识符在某些 C++ 系统具有特殊含义，因此最好以字母开头。这里是一些有效标识符的示例：\n\n![C++ 中的标识符示例](img/9781284166033_CH02_PRE9.jpg)\n\
  \n描述\n\n这里是一些无效标识符的示例以及它们无效的原因：\n\n| 无效标识符 | 解释 |\n| --- | --- |\n| 40Hours | 标识符不能以数字开头。\
  \ |\n| Get Data | 标识符不允许包含空格。 |\n| box - 22 | 连字符（`-`）在 C++ 中是数学符号（减号）。 |\n| cost_in_$\
  \ | 不允许 `$` 等符号。 |\n| int | `int` 单词在 C++ 语言中是预定义的。 |\n\n表格中的最后一个标识符 `int` 是保留字的一个示例。保留字在\
  \ C++ 中有特定的用途；你不能将它们作为程序员定义的标识符。附录 A 列出了 C++ 中所有的保留字。\n\n`第 1 章` 中引入的 `LeapYear`\
  \ 程序使用了列表中的程序员定义标识符。（程序中其他大多数单词都是保留字。）注意，我们选择这些名称是为了传达它们的使用方式。\n\n| 标识符 | 如何使用它\
  \ |\n| --- | --- |\n| year | 待测试的年份 |\n| IsLeapYear | 年份是否为闰年 |\n\n现在我们已经了解了如何编写标识符，让我们来看看\
  \ C++ 允许我们命名的某些内容。\n\n### 数据和数据类型\n\n计算机程序对数据进行操作并产生输出。在 C++ 中，每条数据必须是特定的数据类型。数据类型决定了数据在计算机中的表示方式以及计算机可以对它执行的各种类型的处理。\n\
  \n某些数据类型的使用频率非常高，以至于 C++ 为我们定义了它们。这些标准（或内置）类型的示例包括 `int`（处理整数）、`float`（处理带有小数点的实数）和\
  \ `char`（处理字符数据）。\n\n此外，C++ 允许程序员定义自己的数据类型——被称为程序员定义（或用户定义）的类型。从`第 10 章` 开始，我们将向你展示如何定义自己的数据类型。\n\
  \n在本章中，我们关注两种数据类型——一个用于表示由单个字符组成，另一个用于表示字符字符串。在`第 3 章` 中，我们详细研究了数值类型。\n\n### `char`\
  \ 数据类型\n\n内置类型 `char` 描述由一个字符组成的数据——字母、数字或特殊符号：\n\n![char 数据类型的某些示例](img/9781284166033_CH02_PRE11.jpg)\n\
  \n描述\n\n每台机器都使用特定的字符集，即它能表示的字符集。注意每个字符都包含在单引号（撇号）中。C++ 编译器需要引号来区分，例如区分字符数据 `' 8'`\
  \ 和整数值 `8`，因为它们在机器内部的存储方式不同。同样注意，空格 `' '` 是一个有效字符。(1)\n\n你可能不想将字符 `' A'` 加到字符 `'\
  \ B'` 或从字符 `' 8 '` 中减去字符 `' 3'`，但你可能想要比较字符的值。字符集有一个排序，即所有字符的预定义顺序。例如在 ASCII 中，'A'`\
  \ 小于 `'B'`。\n\n### string 类型\n\n`char` 的值受限于单个字符，而 `string` 是字符的序列，例如单词、名称或句子，包含在双引号中。例如，`\"\
  amount\"`（双引号）是由字母 `a, m, o, u, n, t` 组成的字符串。相比之下，`amount`（不带引号）是一个标识符。例如，`\"12345\"\
  ` 是由字符 `1, 2, 3, 4, 5` 组成的字符串。如果我们写引号的 `12345`，它可以是一个整数。\n\n不包含字符的字符串被称为空字符串（空字符串）。我们使用双引号来编写空字符串，之间甚至没有空格：\n\
  \n![空字符串的示例](img/9781284166033_CH02_PRE14.jpg)\n\n描述\n\n空字符串不等同于空格字符串；它是特殊字符的特殊字符串。\n\
  \n为了处理字符串数据，我们使用名为 `string` 的数据类型。`string` 不是 C++ 语言的内置类型之一；相反，它是由 C++ 标准库提供的程序员定义类型，标准库是任何\
  \ C++ 程序员都可以使用的预写函数和数据类型的集合。字符串的操作包括比较字符串值、在字符串中搜索特定字符以及连接另一个字符串。我们在本章中查看其中一些操作，并在`第\
  \ 3 章`中涵盖更多。`LeapYear` 程序中的标识符没有一个是字符串，尽管字符串值在多处被直接使用。\n\n### 命名元素：声明\n\n标识符可以用于命名常量和变量。换句话说，标识符可以是不允许更改内容的内存位置的名称，也可以是可以更改内容的内容的名称。\n\
  \n我们如何告诉计算机标识符代表什么？通过使用声明，这是一种将名称（标识符）与 C++ 程序元素描述关联起来的语句（正如字典定义将名称与被命名事物的描述关联一样）。在声明中，我们命名标识符并指示它代表什么。例如，`LeapYear`\
  \ 程序使用了声明：\n\n```cpp\nint year;\n```\n\n\n\n\n为了宣布 `year` 是一个变量名，其类型为 `int`。当我们声明一个变量时，编译器会选择内存中的一个位置与该标识符相关联。\n\
  \n假设我们在寄信时，只需要在信封上写上一个人的名字，邮局就会查询地址。当然，世界上世界上每一个人都需要一个不同的名字；否则邮局将无法确定正确的地址。C++ 中的情况也是如此。每个标识符都只代表一个事物（特殊情况除外，我们将在第\
  \ 7 章和第 8 章中讨论）。程序中的每个标识符必须与所有其他标识符不同。\n\n常量和变量统称为数据对象。数据对象和程序中的实际指令都存储在不同的内存位置中。你已经看到一组指令——一个函数——可以被命名。名称也可以与程序员定义的数据类型相关联。\n\
  \n在 C++ 中，你必须在使用每个标识符之前对其进行声明。这种做法允许编译器验证标识符的使用与其声明保持一致。如果你将一个标识符声明为常量并在稍后尝试更改它的值，例如，编译器会检测到这种不一致性并发出错误信息。\n\
  \nC++ 中对于每种数据对象、函数或数据类型都有不同形式的声明语句。这里介绍了变量和常量的声明形式，额外的声明语句形式将是第 8 章到第 12 章的重点。\n\
  \n### 变量\n\n在程序执行期间，不同的数据值可能会在不同时间存储同一个内存位置。这种内存位置被称为 `variable`（变量），其内容就是变量值。我们与内存位置关联的符号是变量名或变量标识符（见\
  \ `图 2.1`）。在实践中，我们经常简短地将变量称为变量。\n\n![一张显示如何声明变量的图。](img/9781284166033_CH02_FIGF01.jpg)\n\
  \n图 2.1 变量\n\n描述\n\n声明变量意味着同时指定变量的名称及其数据类型。声明告诉编译器将名称与内容为特定类型（例如 `char` 或 `string`）的内存位置相关联。以下语句声明标识符\
  \ `myChar` 将用于引用 `char` 类型的变量：\n\n```\nchar myChar;\n```\n/images/9781284166033_CH02_PRE16.jpg\n\
  \n在 C++ 中，变量只能包含其声明中指定类型的数据值。由于先前的声明，变量 `myChar` 只能包含一个 `char` 值。如果 C++ 编译器遇到一条试图将\
  \ `float` 值存储到 `myChar` 中的指令，它会生成额外的指令将 `float` 值转换为适当类型。在[第 3 章]中，我们将研究这种类型转换是如何发生的。\n\
  \n这里是变量声明的语法模板：\n\n![变量声明的语法模板。](img/9781284166033_CH02_UFIG56-1.jpg)\n\n描述\n\n\
  其中 `DataType` 是数据类型的名称，如 `char` 或 `string`。请注意，变量声明始终以分号结束。\n\n从语法模板可以看出，你可以在一个语句中声明多个变量：\n\
  \n![在一个语句中声明的几个变量。](img/9781284166033_CH02_PRE17.jpg)\n\n描述\n\n在这里，所有三个变量都被声明为 `char`\
  \ 变量。然而，我们的倾向是使用单独语句声明每个变量：\n\n![在多个语句中声明的变量。](img/9781284166033_CH02_PRE18.jpg)\n\
  \n描述\n\n这种形式使得在修改程序时，更容易向列表添加新变量或删除你不再需要的变量。\n\n使用单独语句声明每个变量还允许你在每个声明的右侧添加注释，如下所示：\n\
  \n![在变量声明中添加的注释。](img/9781284166033_CH02_PRE19.jpg)\n\n描述\n\n这些声明告诉编译器创建三个 `float`\
  \ 变量——`payRate`、`hours` 和 `wages` 以及一个 `int` 变量 `empNum`。注释告诉阅读程序的人每个变量代表什么。\n\n\
  现在我们已经学会了如何声明变量，让我们来看看如何声明常量。\n\n### 常量\n\n所有的单字符（括在单引号中）和字符串（括在双引号中）都是常量。\n\n![字符和字符串的示例。](img/9781284166033_CH02_PRE19.jpg)\n\
  \n描述\n\n在 C++ 中，就像在数学中一样常量是不改变的东西。使用字面量似乎比声明命名的常量并引用它更容易。但事实上，命名的常量让程序更易读。命名的常量也使得以后修改程序更加容易。\n\
  \n这里是常量声明的语法模板：\n\n![常量声明的语法模板。](img/9781284166033_CH02_UFIG57-1.jpg)\n\n描述\n\n\
  注意关键字 `const` 位于开头，标识符和字面量之间出现一个等号 (`=`)。\n\n以下是常量声明的示例：\n\n![常量声明的示例。](img/9781284166033_CH02_PRE23.jpg)\n\
  \n描述\n\n正如上面所示，许多 C++ 程序员会将常量的标识符全部大写，并用下划线分隔单词。其目的是让读者在程序中间快速区分变量名和常量名。\n\n为常量声明添加注释也是好习惯。我们在注释中描述每个常量代表什么：\n\
  \n![添加了注释的常量。](img/9781284166033_CH02_PRE24.jpg)\n\n描述\n\n这是一个只包含声明的程序：\n\n![仅包含声明的\
  \ C 加号程序列表。](img/9781284166033_CH02_UFIG58-1.jpg)\n\n描述\n\n### 执行操作：可执行语句\n\n到为止，我们查看了在程序中声明数据对象的方法。现在我们将注意力转向对数据进行操作或执行的方法。\n\
  \n### 赋值\n\n\n\n\n变量的值可以通过赋值语句设置或更改。例如，\n\n![赋值语句。](img/9781284166033_CH02_PRE29.jpg)\n\
  \n`assigns` 将字符串值 `\"Lincoln\"` 赋值给变量 `lastName`；也就是说，它将字符序列 `\"Lincoln\"` 存储与变量\
  \ `lastName` 相关的内存中。\n\n以下是赋值语句的语法模板：\n\n![赋值语句的语法模板。](img/9781284166033_CH02_UFIG60-1.jpg)\n\
  \n赋值运算符 `=` 的语义（含义）是“存储”；`expression` 的值被存储在变量中变量之前的任何值都会被销毁并被 `expression` 的值取代。\n\
  \n赋值语句的左侧只能有一个变量。赋值语句不像数学方程（`x + y = z + 4`）；`expression`（赋值运算符右侧的内容）会被`求值`，结果的值被存储在赋值运算符左侧的单个变量中。在另一个语句将新值存入之前，变量会保持其被赋值的值。\n\
  \n给定以下声明\n\n![一些声明语句。](img/9781284166033_CH02_PRE30.jpg)\n\n以下赋值语句是有效的：\n\n![一些有效的赋值语句。](img/9781284166033_CH02_PRE31.jpg)\n\
  \n然而，这些赋值是无效的：\n\n| 无效赋值语句 | 原因 |\n| --- | --- |\n| `middleInitial =\"A.\";` | `middleInitial`\
  \ 是 `char` 类型；`\"A.\"` 是 `string` 类型。 |\n| `letter = firstName;` | `letter` 是 `char`\
  \ 类型；`firstName` 是 `string` 类型。 |\n| `firstName = Thomas;` | `Thomas` 是未声明的标识符。\
  \ |\n| `\"Edison\" = lastName;` | 只有变量可以出现在 `=` 左侧。 |\n| `lastName = ;` | `=` 右侧缺少表达式。\
  \ |\n\n### 字符串表达式\n\n虽然我们不能对字符串进行算术运算，但字符串数据类型提供了一种特殊的字符串操作，称为连接（concatenation），它使用\
  \ `+` 运算符。连接两个字符串的结果是一个包含两个字符串中字符的新字符串。例如，给定以下语句\n\n![声明了一些字符串变量。](img/9781284166033_CH02_PRE32.jpg)\n\
  \n我们可以写\n\n![字符串连接。](img/9781284166033_CH02_PRE33.jpg)\n\n该语句从内存中获取 `phrase 1` 的值，并连接\
  \ `phrase 2` 的值，形成一个新的临时字符串，其中包含以下字符：\n\n![字符串连接的结果。](img/9781284166033_CH02_PRE34.jpg)\n\
  \n该临时字符串（类型为 `string`）随后被赋值（存储到）`bookTitle`。\n\n表达式中字符串的顺序决定了它们在结果字符串中的出现方式。如果我们写\n\
  \n![字符串连接。](img/9781284166033_CH02_PRE35.jpg)\n\n那么 `bookTitle` 包含\n\n![字符串连接的结果。](img/9781284166033_CH02_PRE36.jpg)\n\
  \n连接适用于命名字符串常量、字面量字符串和 `char` 数据，以及字符串变量。唯一的限制是 `+` 运算符的操作数中至少有一个必须是字符串变量或命名常量（因此你不能使用诸如\
  \ `\"Hi\" +\"there\"` 或 `'A' + 'B'` 这样的表达式）。例如，如果我们已经声明了以下常量\n\n![一些常量声明。](img/9781284166033_CH02_PRE37.jpg)\n\
  \n那么我们可以写以下赋值语句来存储 `bookTitle` 的标题：\n\n![变量的标题。](img/9781284166033_CH02_PRE38.jpg)\n\
  \n结果，`bookTitle` 包含\n\n![变量的内容。](img/9781284166033_CH02_PRE39.jpg)\n\n偶尔我们可能会遇到想要向现有字符串中添加一些字符的情况。假设\
  \ `bookTitle` 已经包含 `\"Programming\"`，现在我们想向它添加 `\"C++\"`：\n\n![字符串连接。](img/9781284166033_CH02_PRE40.jpg)\n\
  \n记住连接仅适用于字符串。尽管操作中使用了算术加号，但我们不能连接数值类型的值（例如 `int` 和 `float`）。这里有一个程序，它展示了声明和赋值语句是如何相互安排的：\n\
  \n![显示声明和赋值语句的程序。](img/9781284166033_CH02_UFIG62.jpg)\n\n### 输出\n\n你现在已经了足够的 C++\
  \ 语法来告诉计算机为变量赋值并连接字符串，但在你告诉它写出来之前，计算机不会给你结果。\n\n在 C++ 中，我们可以使用一个名为 `cout`（读作“see-out”）的特殊变量以及插入运算符（`<<`）来输出信息：\n\
  \n![输出信息的代码。](img/9781284166033_CH02_PRE42.jpg)\n\n变量 `cout` 在 C++ 系统中预定义，表示一个输出流。你可以将输出流变量想象成一扇门，通过它向输出设备发送字符序列。\n\
  \n插入运算符 `<<`（通常读作“put to”）接受两个操作数。它的左侧操作数是一个流表达式（简单情况下就是流变量，如 `cout`）。它的右侧操作数是一个表达式，如下例：\n\
  \n![在控制台上打印信息的代码。](img/9781284166033_CH02_PRE43.jpg)\n\n插入运算符将其右侧的操作数转换为字符序列，并通过流变量将其发送到输出设备。注意\
  \ `<<` 运算符指向数据的去向——从右侧编写的表达式指向左侧的输出流。\n\n你可以在单个输出语句中使用多次 `<<` 运算符。每次出现都会将下一个数据项追加到输出流中。例如，我们可以将上述两个输出语句合并为\n\
  \n![合并的输出语句。](img/9781284166033_CH02_PRE44.jpg)\n\n如果 `bookTitle` 包含 `\"American\
  \ History\"`，这两个版本产生相同的输出：\n\n\n\n\n\n![标题为《美国史》，第 7 版](img/9781284166033_CH02_PRE45.jpg)\n\
  \n输出语句具有如下形式：\n\n![语句的输出。(images/9781284166033_CH02_UFIG63-1.jpg)描述以下输出语句会产生所示的输出。这些示例假设变量\
  \ `ch` 包含值 `'2'`，字符串变量 `firstName` 包含 `\"Marie\"`，字符串变量 `lastName` 包含 `\"Curie\"\
  `。| 语句 | 输出是什么（ 表示空格） || --- | --- || `cout << ch;` | 2 || `cout <<\"ch =\" <<\
  \ ch;` | ch=2 || `cout << firstName +\"\" + lastName;` | MarieCurie || `cout\
  \ << firstName << lastName;` | MarieCurie || `cout << firstName << ' ' << lastName;`\
