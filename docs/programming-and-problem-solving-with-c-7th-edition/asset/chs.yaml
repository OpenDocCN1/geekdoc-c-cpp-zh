  描述\n\n## 11.7 定义二维数组的另一种方法\n\n我们之前提到过，二维数组可以看是数组的数组。C++ 支持这种观点，意义在于一维数组的组件不必是原子的。组件本身可以是结构化的——结构体（structs）、类对象（我们在第\
  \ 12 章中引入），甚至是数组。例如，我们的 `hiTemp` 数组可以这样声明：\n\n![数组声明的两个语句。](img/9781284166033_CH11_P638-3.jpg)\n\
  描述\n\n通过这种声明，`hiTemp` 数组的 52 个组件是 `WeekType` 类型的一维数组。换句话说，`hiTemp` 有两个维度。我们可以将每一行视为一个实体：例如，`hiTemp[2]`\
  \ 指的是第 2 周的温度数组。我们也可以通过指定两个索引来访问 `hiTemp` 的每一个单独组件：例如，`hiTemp[2][0]` 访问第 2 周第一天的温度。\n\
  \n我们以何种方式声明二维数组重要吗？对 C++ 并不重要。选择应该基于可读性和可理解性。有时，如果在单个声明中指定两个索引，数据关系会得到更好的表示。在其他时候，如果先将一个维度定义为一维数组类型，则更有意义。\n\
  \n以下示例展示了一种情况，行首先被定义为一维数组类型，这允许将每一行传递给一个参数为相同类型的一维数组的函数。以下函数计算并返回 `WeekType` 类型数组中的最大值。\n\
  \n![程序代码。](img/9781284166033_CH11_P639-1.jpg)\n描述\n\n我们对 `hiTemp` 的两部分声明允许我们如下使用\
  \ `hiTemp` 的一个组件来调用 `Maximum`：\n\n![表达式。最高，等于，最大，左括号，hiTemp, 左方括号, 20, 右方括号， 右括号，分号。](img/9781284166033_CH11_P639-2.jpg)\n\
  \n`hiTemp` 的第 20 行被传递给 `Maximum`，它将其视为任何其他 `WeekType` 类型的一维数组（参见**图 11.15**）。将行作为参数传递是有意义的，因为它和函数参数都是同一种命名类型\
  \ `WeekType`。\n\n![3 个带有 7 行标记为 week type 的行向堆数组。1 个标记为 hiTemp 且具有无限列的列向堆数组。](img/9781284166033_CH11_FIGF11_15.jpg)\n\
  \n图 11.15 这是一个一维数组的一维数组\n\n描述\n将 `hiTemp` 声明为数组数组，我们可以通过以下代码输出每周的最大值：\n\n![代码。](img/9781284166033_CH11_P640)\n\
  \n## 11.8 多维数组\n\nC++ 对数组可以拥有的维度没有限制。既然你可以拥有任意数量的维度，那么应该是多少个呢？考虑 `sales`，有三个重要信息：月份、商店和项目。我们可以将数组定义泛化以涵盖这些情况：\n\
  \n![代码。](img/9781284166033_CH11_P640)\n描述\n\n`sales` 的组件数量为 12。如果只有一月份的数据，那么数组是空的。如果我们想处理商店的数据，我们使用\
  \ `store` 来控制外层循环：\n\n![代码。](img/9781284166033_CH11_P640)\n描述\n\n如果我们想按商店计算月销售额，`month`\
  \ 控制外层循环。如果我们想按项目计算月销售额，`month` 控制外层循环，`item` 控制中间层循环。\n\n![代码。](img/9781284166033_CH11_P640)\n\
  描述\n\n访问二维数组中的每个组件需要两个循环；访问三维数组中的每个组件需要三个循环。要完成的任务决定了哪个索引控制外层、中间层和内层循环。如果我们想跟踪销售项目的部门，我们可以为数组添加第四个维度：\n\
  \n![代码。](img/9781284166033_CH11_P640)\n描述\n\n如果我们想知道 C 部门在 6 月项目 4 的销售数量，我们只需访问以下数组元素：\n\
  \n```\nsales[1][5][4][C]\n```\n\n![表达式。Sales, 左方括号, 1, 右方括号, 左方括号, 5, 右方括号, 左方括号,\
  \ 4, 右方括号, 左方括号, C, 右方括号。](img/9781284166033_CH11_P641-6)\n\n当多维数组被声明为函数的参数时，我们指定除第一个维度外的所有维度的大小。对于我们的四维版本\
  \ `SalesType`，函数头将如下：\n\n![函数头。void, Do something, 左括号, int, table, 左方括号, 右方括号,\
  \ 左方括号, 12, 右方括号, 左方括号, NUM, 下划, ITEMS, 右方括号, 左方括号, NUM, 下划, DEPTS, 右方括号, 右括号。](img/9781284166033_CH11_P642-1)\n\
  \n或者，更好，像这样：\n\n![函数头。void, Do something, 左括号, Sales Type, a r r, 右括号。](img/9781284166033_CH11_P642-2)\n\
  \n\n\n第二种版本是最安全的（对读者来说也最清晰）。它确保了参数所有维度的大小都与实参数的大小完全匹配。对于第一种版本，你必须声明除第一个维度外所有维度尺寸的原因与二维数组相同：因为数组元素在内存中是线性存储的，编译器需要这些尺寸信息来定位数组中的某一个元素。\n\
  \n### 图形用户界面 (GUI)\n\n与之前的章节类似，为了将 GUI 整合到分析程序中，我们需要做的更改非常小。原始程序要求用户从控制台输入和输出文件。同样，它将该输入文件的分析结果以文本形式生成到输出文件中。因此，重构该程序以使用图形界面需要我们替换控制台输入和输出。幸运的是，我们已经看到了两种可以让我们实现这些更改的\
