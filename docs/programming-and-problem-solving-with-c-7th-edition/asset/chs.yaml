  \ 2，冒号，Mary Jones，10 冒号 30 冒号 0 0。](img/9781284166033_CH12_P729-1.jpg)\n\n描述\n\n\
  ## 12.8 UML 图\n\n仅通过查看书面文档来理解应用程序的操作是非常困难的。当许多类相互交互时，跟踪它们的关系涉及到构建一个脑海中的模型。很快，我们开始画图表来保持一切思路清晰。也许我们使用方框来表示类，使用它们之间的线表示协作（类调用其他类的方法）。在方框内部，我们对类进行注释。最终，我们有一张捕捉了重要信息的图。\n\
  \n### 类图绘制\n\n类在 UML 中由一个分为三个部分的方框表示。顶部区域存放，中间区域列出属性，底部区域列出职责。\n\n![TimeOfDay 类。](img/9781284166033_CH12_P730-1.jpg)\n\
