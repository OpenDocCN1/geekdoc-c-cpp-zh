  章节引言：© Joost Lagerweij/EyeEm/Getty Images.\n\n## 第 13 章\n\n### 基于数组的列表\n\n第 11 章\
  \ 介绍了数组，数组是一种给定单个名称的具有相同类型组件集合的数据结构。通常，使用一维数组来存放项目列表。在本章中，我们将研究将数据表示为列表的数组算法。我们都直观地知道什么是“列表”。我们一直使用列表——购物清单、待办事项列表、派对邀请列表。在计算机应用程序中，列表是组织数据的有用方式。\n\
  \n我们的算法将实现为通用函数，这些函数可以很容易地修改以处理许多类型的列表。我们以一个使用数组作为主要数据结构的案例研究作为结束。\n\n## 13.1 什么是列表？\n\
  \n从逻辑角度来看，列表是元素的同质、`linear`（线性）集合。这里的“线性”意味着在逻辑层面上，列表中的每个元素（第一个和最后一个元素除外）都有一个唯一的前驱和一个唯一的后继。^(1)\
  \ 列表中的项目数量（我们称之为`长度`）是列表的一个属性。\n\n列表可以是`无序的`——它们的元素可以按任何特定顺序放入列表中——也可以是`有序的`。例如，数字列表可以按值排序，字符串列表可以按字母顺序排序，地址列表可以按邮政编码排序。当有序列表中的元素是复合类型时，结构中的某一个成员（称为\
  \ `key`，键）决定了它们的逻辑顺序。例如，学生列表可以按姓名按字母顺序排序，也可以按学生学号按数字排序。在第一种情况下，姓名是键；在第二种情况下，学号是键。（参见**图\
  \ 13.1**。）\n\n如果列表不能包含具有重复键的项目，我们说它具有唯一键。（参见**图 13.2**。）本章同时处理无序列表和具有唯一键且按键值从小到大排序的元素列表。列表上的项目可以是任何类型，原子类型或复合类型。在随后的讨论中，“项目”、“元素”和“组件”是同义词；它们指的是存储在列表中的内容。\n\
  \n![两个标记的表格，按 ID 哈希值排序，并按名称排序。每个表有 2 列。两个单独标记的条目，roll 指向两个表中的第二列。](img/9781284166033_CH13_FIGF13_1.jpg)\n\
  \n描述\n\n图 13.1 按两个不同键排序的列表\n\n![两个标记的表格，具有重复键和唯一键。每个表有 2 列。两个单独标记的条目，roll 指向两个表中作为\
  \ Key 的第二列。](img/9781284166033_CH13_FIGF13_2.jpg)\n\n描述\n\n图 13.2 具有重复键的列表和具有唯一键的列表\n\
  \n1 在实现层面元素之间也存在关系，但物理关系可能与逻辑关系不同。\n\n## 13.2 作为抽象数据类型的列表\n\n在这一节中，我们设计了一个列表 ADT，以便在下一节中实现为通用类。让我们从待办事项列表的角度考虑这种结构。通常新\
  \ ADT 设计取决于客户端如何使用它。在本章中，我们正在探索列表实现的算法，因此我们就是自己的客户端。为了我们的设计选择提供动力，我们将 ADT 视为待办事项列表。\n\
  \n### **完善职责**\n\n让我们完善这些职责，使其对通用类更有用，然后将其转换为函数头。\n\n测试列表满空并返回项目数量的观察者是直观的。我们可以直接编写它们的函数头并带有相应的文档：\n\
  \n\n\n\n\n![函数标题。](img/9781284166033_CH13_P758-1.jpg)\n\n描述\n\n![带有注释行的行的函数标题。](img/9781284166033_CH13_P759-1.jpg)\n\
  \n描述\n\n检查项目是否在列表中的观察者必须将该项目作为参数。我们将此方法命名为 `isThere`。\n\n![函数标题。](img/9781284166033_CH13_P759-2.jpg)\n\
  \n描述\n\n在设计转换器（transformers）时，我们需要做出一些决策。例如，我们是否允许列表中存在重复项？这个选择对删除和添加项目都有影响。如果我们允许重复项，我们所谓的“删除项目”意味着什么？是删除其中一个副本还是删除所有副本？\n\
  \n目前，我们只做一个决策，并设计符合该决策的算法。我们将在练习中检查其他选择的影响。让我们列表中只保留一个项目的副本。在这种情况下，删除项目只是移除该副本。但我们是否假设要删除的项目一定在列表中呢？如果它不在，这算是一个错误吗？还是删除操作的意思是“如果存在，则删除”？在删除项目之前检查该项目是否在列表中对客户端来说是一项额外工作，所以让我们使用最后一种含义。\n\
  \n现在，我们将把这些决策整合到方法标题的文档中。\n\n![带有注释行的函数标题。](img/9781284166033_CH13_P759-3.jpg)\n\
  \n描述\n\n迭代器（iterator）允许用户逐个查看列表中的项目。实现“获取下一个项目”职责的方法将命名为 `GetNextItem`。列表必须在调用迭代器时跟踪要返回的下一个项目。它通过一个记录要返回的下一个项目位置的数据成员来实现。构造函数将此位置初始化为\
  \ 0，并在 `GetNextItem` 中进行递增。\n\n客户端可以使用列表的长度来控制遍历列表的循环。另一种方法是提供一个观察者 `HasNext`，用于询问列表是否包含另一个未见过的项目。让我们使用第二种方法，并在练习中探索第一种方法。因为当\
  \ `HasNext` 为假时调用 `GetNextItem` 会导致错误，我们必须在文档中说明这一假设：当调用 `GetNextItem` 时，有一个可以访问的项目。\n\
  \n如果用户在迭代过程中添加或删除一个项目会发生什么？取决于插入或删除发生在迭代点之前还是之后，我们的迭代循环最终可能会跳过或重复某些项目。\n\n对于处理这种潜在的危险情况，我们有几种选择。列表可以在添加或删除项目时将当前位置重置为开头，或者可以在迭代正在进行期间禁止进行转换器操作。在这里，我们通过文档中的一种假设选择了后者。以防用户想要重新启动迭代，我们提供一个\
  \ `ResetList` 方法来重新初始化当前位置。\n\n![带有注释行的函数标题。](img/9781284166033_CH13_P760-1.jpg)\n\
  \n描述\n\n我们只需要编写构造函数了。\n\n![带有注释行的函数。](img/9781284166033_CH13_P760-2.jpg)\n\n描述\n\
  \n### 数据表示\n\n如第 11 章 中定义，一维数组由固定数量的同构组件组成。数组的一个用途是存储值列表。那么，一个列表由一个值数组和一个整数变量 `length`\
  \ 组成，该变量说明数组中存储了多少个列表元素。让我们把数组命名为 `data`。使用类结构体来封装长度和值数组。根据我们之前对 `GetNextItem` 的讨论，我们知道列表必须包含一个变量，指示在迭代中下一个项目位于列表的何处。由于我们处理的是数组，我们假设该变量将是一个整数索引。让我们称其为\
  \ `currentPos`。\n\n在图 13.3](#9781284166033_CH13_02.xhtml_c13-fig13-3)** 中，你可以看到数组从\
  \ `data[0]` 到 `data[MAX_LENGTH-1]`，但存储在数组中的列表元素从 `data[0]` 到 `data[length-1]`。数组中的位置数量是固定的，但列表中存储的值数量可能会变化。\n\
  \n我们可以使用名为 `List` 的 C++ 类来表示列表列表。对于具体实现，我们使用三个项：一个存储列表的数组、一个存储列表长度的 `int` 变量以及一个用于迭代的\
  \ `int` 变量。当我们编译 `List` 类时，我们需要为 `MAX_LENGTH` 和 `ItemType` 提供定义。\n\n![为 MAX_LENGTH\
  \ 和 ItemType 提供定义](img/9781284166033_CH13_P760-3.jpg)\n\n描述\n\n![带有 List 类，包含 data\
  \ 堆栈，左括号, Max, underscore, length, minus, 1, 右括号, 数组组件后跟长度和当前 Pos 组件。](img/9781284166033_CH13_FIGF13_3.jpg)\n\
  \n描述\n\n图 13.3 List 类的结构\n\n这里是实现 ADT 的 `List` 类的完整规范。对于此实现，我们使用 `MAX_LENGTH` 为\
  \ 100，`ItemType` 为 `string`。\n\n![程序段。](img/9781284166033_CH13_P761-1.jpg)\n\n描述\n\
  \n![程序段的延续。](img/9781284166033_CH13_P762-1.jpg)\n\n描述\n\n在第 12 章 中，我们将 ADT 操作分类为构造函数、转换器、观察者和迭代器。`IsEmpty`、`IsFull`、`GetLength`\
  \ 和 `IsThere` 是观察者。`Insert` 和 `Delete` 是转换器。`GetNextItem` 是迭代器。`ResetList` 是在迭代器\
  \ `GetNextItem` 调用之前初始化列表的转换器。`HasNext` 是与迭代观察者。类构造函数是 ADT 构造操作。\n\n为了获取 `List`\
  \ 对象，我们需要声明一个：\n\n![声明语句。第 1 行：List myList;](img/9781284166033_CH13_P762-2.jpg)\n\
  \n`myList` 包含三个变量（两个 `int`，一个数组）。（参见**图 13.4](#9781284166033_CH13_02.xhtml_c13-fig13-4)**。）\n\
  \n### 示例程序\n\n让我们来看一个利用我们通用设计的客户端程序示例。假设一个数据文件包含一个气象站一个月内的每日最高温度读数，每天一个整数值。不幸的是，温度传感器有故障，偶尔会记录\
  \ 200 度的温度。\n\n![数组标记，data 堆栈的，左括号, Max, underscore, length, minus, 1, 右括号, 数组组件后跟长度和当前\
