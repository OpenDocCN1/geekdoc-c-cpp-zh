  \ 的外观如下：\n\n![一个 G U I 窗口。](img/9781284166033_CH16_P1043-1.jpg)\n\n描述\n\n### 测试与调试\n\
  \n在处理模板时，重要的是记住，生成的模板函数或模板类会变成普通的函数或类，并受所有常规语法和语义规则的限制。\n\n要测试模板函数或模板类，一种方法是从非模板版本开始，使用特定的数据类型（如\
  \ `int`）。应用我们在前面的章节中为算法和类概述的常用测试策略。在纠正所有错误后，将函数或类转换为模板化形式，并通过提供不同的数据类型作为模板参数来继续测试。\n\
  \n另一种方法是从模板化类开始，但最初将其特化化为一种你确信是正确的类型，例如 `int` 或 `string`。如果 Bug 实际上位于其类型参数中指定的类中，那么尝试在模板中寻找\
  \ Bug 可能会非常令人沮丧。一旦你确认模板对于可靠的类型可以正常工作，就可以对你预计将使用的系列类进行测试。\n\n处理异常的程序必须经过测试，以确保异常能够正确生成并被妥善处理。必须包含用例来抛出异常，并指定处理异常后的预期结果。\n\
  \n问题解决案例研究（Problem-Solving Case Study）程序有三个异常：\n\n1. 一行分配了两个以上的人。\n2. 装载的飞机太重，无法起飞。\n\
  3. 重心在接受范围之外。\n\n至少需要运行四次来测试这三种情况：(1) 一行分配了三个人；(2) 飞机太重；(3) 重心太低；以及 (4) 重心太高。你需要在“案例研究后续”（Case\
  \ Study Follow-Up）练习中为这四种情况创建测试数据。\n\n### 测试与调试提示\n\n1. 在声明模板参数时，例如：\n\n    ![模板参数声明。template，左尖括号，class\
  \ Item Type，右尖括号](img/9781284166033_CH16_P1044.jpg)\n\n    记得使用 `class` 关键字（或 `typename`）。然而，在实例化模板时使用的模板参数不需要是\
  \ C++ 类的名称。任何数据类型（无论是内置的还是用户定义的）都是允许的。\n\n2. 在本文讨论的限制形式中，模板参数是数据类型名称，而不是变量名或表达式。\n\
  \n3. 模板函数通常使用隐式模板参数调用，但模板类必须使用显式模板参数。\n\n4. 就像非模板函数一样，如果模板函数的定义物理上放置在调用函数的代码之后，则函数原型（前向声明）必须先于调用代码。\n\
  \n5. 对于模板类，成员函数的定义必须与客户端代码一起编译，而不能独立编译。一种策略是将类模板和成员函数定义分组到单个文件中（`.h` 文件）。另一种策略是将类模板放在\
  \ `.h` 文件中，将成员函数定义放在 `.cpp` 文件中，并让 `.h` 文件包含 `.cpp` 文件。在后一种方法中，如果你使用 IDE，不要将此 `.cpp`\
  \ 文件列在你的“项目”中。相反，仅在项目中包含客户端代码文件。\n\n6. 避免使用内置类型作为异常类型。抛自定义类或结构体的对象，其名称应暗示错误或异常事件的性质。\n\
  \n7. 如果 `BadData` 是异常类的名称，确保通过编写以下代码抛出该类的对象：\n\n    ![一个语句。throw Bad Data，左括号，右括号，分号。两个正斜杠。抛出一个构造的对象。](img/9781284166033_CH16_P1045.jpg)\n\
  \n    而不是\n\n    ![一个语句。throw Bad Data，分号。两个正斜杠。语法错误。](img/9781284166033_CH16_P1045-1.jpg)\n\
  \n8. 确保所有异常都被捕获。未捕获的异常会导致程序带有模糊的错误信息终止。最佳实践是在尽可能靠近源点捕获异常，以便对其进行妥善处理。\n\n![森林中树的照片](img/Chapter-opener.jpg)\n\
  \n章节开启：© Joost Lagerweij/EyeEm/Getty Images.\n\n## 第 17 章：使用标准模板库的数据结构简介\n\n在第 10\
  \ 章中，我们开始了用户定义数据类型的探索。在第 11 章中，我们引入了数组。第 13 和第 14 章重点关注列表数据结构，以说明如何在抽象意义上组织数据，并识别\
  \ ADT（抽象数据类型）如何具有在不同情况下提供优势的不同实现。现在我们准备好探索更广泛的数据组织方法。\n\n大多数计算机科学课程都包含一门或多门关于数据结构、相关算法和高效实现技术的完整课程。在本章中，我们仅仅可以通过提供对未来学习的预览来激发你对这些更高级研究的兴趣。\n\
  \n然而，这并不意味着我们不能深入研究这些更高级结构化技术的实际用途。C++ 库提供了丰富的泛型结构类型现有实现，我们可以直接使用。事实上，标准模板库（STL）非常丰富，以至于有整本书都专门用于解释其运行的细微之处！在本章中，我们将考虑最常用的\
  \ STL 类型。\n\n## 17.1 抽象数据结构与实现\n\n到这里，你已经对数组和列表数据结构非常熟悉。它们都属于线性数据结构族，因为它们的组件可以从一端到另一端顺序排列。数组通过其索引值排序，而列表通过每个节点与其紧邻的前后继节点之间的逻辑关系排序，如图\
  \ 17.1 所示。正如你所知，列表可以通过数组或指针（链表）实现。\n\n![一个数组和一个列表](img/9781284166033_CH17_FIGF17-1.jpg)\n\
  \n**图 17.1** 作为线性结构的数组和列表\n\n描述\n\n\n\n稍加思考，你也应该理解，我们可以使用链表来实现数组的抽象概念。在通常情况下，数组的链式实现效率会很低。然而，当一个索引范围很大且值填充稀疏的数组时，链式实现可以节省大量的空间。例如，想象一位野生动物学家正在利用大鹅追踪项圈收到的\
  \ GPS 坐标，绘制大鹅在湖面上的位置图。这些数据的自然表示方式是一个以坐标为索引的二维数组，每个元素代表该湖面区域区域的大鹅数量。当然，当只有几只大鹅时，数组实现会浪费内存空间，而通过切换到链式实现可以节省这些空间，如图图\
  \ 17.2 所示。\n\n![稀疏填充的二维数组和其相同的链式实现。](img/9781284166033_CH17_FIGF17-2.jpg)\n\n**图\
  \ 17.2 稀疏填充数组的链式实现节省空间**\n\n描述\n\n核心思想是每个数据结构都有两个方面：它的抽象（概念）形式和它的实现。通过面向对象编程支持的控制和数据抽象，可以将这些方面完全分离。这样做的好处是，客户端代码可以使用易于理解的表示，同时获得高效底层实现带来的收益。\n\
  \n在我们继续学习本章时，你可能会产生这样的想法：“但栈只是某种受限制的列表。我们为什么需要它作为一个单独的类型？”我们都会掉入这种将抽象表示与实现混淆的陷阱。正如我们在演示栈的使用时所看到的，一个更简单的抽象类型比以受限制的方式使用更通用的抽象让编写解决方案的代码变得更容易。栈的抽象还允许实现者选择基于列表或基于数组的实现。\n\
  \n需要记住的另外一点是，数据结构的任何实现都在表示一个相应的 ADT（抽象数据类型）。例如，一个 `list` 类有一个表示列表 ADT 的接口。正因如此，当我们查看像\
  \ STL 这样的实现库时，人们往往很想自动使用提供的 `list` 类型来实现问题中的抽象列表。但如果问题要求列表在程序运行开始时从文件数据构建，且随后的删除和添加很少呢？这就支持了基于数组的实现。\n\
  \n我们使用数据结构解决问题的策略如下：在问题解决阶段，我们设计最自然地解决问题的结构和接口。在实现阶段，我们考虑结构将如何被使用，以及哪种结构实际上提供了最高效的解决方案。接下来，我们定义一个类，用抽象类型的接口封装实现结构。最后，我们去库中查看它是否提供了可以在类内部使用的的数据结构实现。\n\
  \n在阐述完这一策略后，我们需要指出，本章的许多目标涉及演示 STL 的使用。若不将其封装在不同类型的接口中，要观察 STL 类型是如何工作的会容易得多。所以请预先注意，我们的示例并不一定是为了说明这种方法：这绝对是一个“听我怎么说，不要看我怎么做”的情况！\n\
  \n## 17.2 额外的线性结构\n\n在特定问题的背景之外，很难想象一种在概念上既不是数组不是列表的线性数据结构——所以让我们考虑一个例子。超市的购物车磨损是均匀的吗？你见过它们被整齐地排成列，人们从后面取走购物车，店员将它们推回原位。但列在前面的购物车真的被使用了吗？它们是否重新排列得足够频繁，以至于所有购物车获得相同的磨损？除了好奇心，理解购物车如何被使用可以帮助超市决定购买多少个，或者是否需要定期重新排列购物车。\n\
  \n解决此类问题涉及模拟。我们可以对列中的购物车以及它们在过道中徘荡的时间进行建模，并记录每辆购物车获得的总使用时间。计算机的速度使我们能够在几秒钟评估数年的使用情况。\n\
  \n我们应该使用哪种数据结构来表示这种情况？考虑到我们目前所看到的，数组可以模拟一列购物车。当一个模拟客户到达时，我们从列的末尾取出一辆购物车。然后我们对它做什么？我们可以随机为它分配一个返回时间，并将其放入一个排序列表中。随着每一分钟的过去，我们检查列表，看列表头的购物车是否准备好返回。然后我们从列表中移除它并将其放在列数组的末尾。图\
  \ 17.3 展示了这种安排。\n\n![使用数组和排序列表来模拟购物车。](img/9781284166033_CH17_FIGF17-3.jpg)\n\n\
  **图 17.3 使用数组和排序列表来模拟购物车**\n\n描述\n\n让我们更仔细地考虑这些结构。我们需要它们的所有功能来解决问题吗？并不真的。例如，我们不会对数组进行随机索引；相反，我们只是在数组的一端添加和删除元素。在计算机科学中，这种结构被称为栈。那么列表呢？我们是否遍历它或从中间删除元素？不，我们只是从一端插入并移除元素。这种结构被称为队列（读音类似字母\
  \ Q），它是更广泛的队列数据结构家族成员。\n\n到目前，你应该开始看到线性数据结构的差异基于它们的访问方式。数组和列表支持非常通用的访问。然而，如果访问被某种方式限制，我们可以定义一个简单接口的数据结构。此外，在某些情况下，限制允许我们创建更高效的实现。\n\
  \n让我们仔细观察栈和队列。\n\n### 栈\n\n`stack` 是一种只能从一端访问的数据结构。我们可以在顶端插入元素（作为第一个元素），并移除顶端（第一个）元素。这种结构模拟了现实生活中常见的属性。会计师称之为\
  \ LIFO，意为“后进先出”。食堂的盘子架具有这种属性。你只能拿顶部的盘子。当你这样做时，下面的盘子会升到顶端，供下一个人拿盘子。非圆形车道上的汽车表现出这种属性：最后进去的汽车必须最先出去。\n\
  \n术语 `push` 用于插入操作`pop` 用于删除操作。在栈的某些实现中，`pop` 也返回顶端元素。在其他实现中，一个独立的操作 `top` 获取顶端值，而\
  \ `pop` 仅删除它。图 17.4 展示了在给定栈上 `push` 一个元素然后 `pop` 栈时发生了什么。\n\n栈经常用于系统软件。例如，C++ 在运行时使用栈来跟踪嵌套的方法调用。编译器使用栈来转换算术表达式。栈可以用于按反向顺序回溯对象或动作的序列。使用字符串栈读取包含系列行的文件并反向输出这些行的算法所示：\n\
  \n![栈的 Push、Top 和 Pop 操作的插图。](img/9781284166033_CH17_FIGF17-4.jpg)\n\n\n\n\n# 图\
  \ 17.4 显示推栈、栈和出栈操作的栈\n\n描述\n\n## 反转文件\n\n```\nCreate stack\nCreate file in\nwhile\
  \ in\n    stack.push(in.getline)\nwhile not stack.empty\n    output stack.top\n\
  \    stack.pop\n```\n\n从这个算法中可以看出，除了 `push`、`pop` 和 `top` 之外，我们还需要一种方法来测试栈是否为空。我们可能还想要一种方法找到栈的大小。即使添加了这些功能，栈接口也只有五个职责，使其成为一个非常简单的抽象类型。\n\
  \n### 队列\n\n`queue`（队列）是一种线性数据结构，元素从一端进入并从另一端移除。会计师将这种属性称为 `FIFO`，代表“先进先出”（first\
  \ in, first out）。银行或超市的等候队以及单行道上的车流都是队列的类型¹。事实上，队列经常用于类似情况的计算机模拟。\n\n虽然栈的插入和移除职责的术语是标准的（`push`、`pop`），但队列并没有这种标准。在队列末部插入元素的操作在文献中有许多种名称：`Insert`、`add`、`push`\
  \ 和 `enqueue` 是四种常见的。相应地，从队列头部移除的操作被各种称为 `delete`、`remove`、`pop` 和 `dequeue`。\n\n\
  C++ 对队列使用了栈的术语，其中 `push` 应用于结构的末部，而 `pop` 应用于头部。操作 `front` 代替了 `top`，返回队列头部的元素。与栈一样，我们需要操作来检查队列是否为空并确定其大小。C++\
  \ 队列的实现是不寻常的，因为它多出了一个操作 `back`，它返回队列末尾的元素。图 17.5 显示了一个空队列 (a)、向队列中插入 (b) 以及从队列中删除\
  \ (c)。\n\n![队列上插入和删除操作的插图。](img/9781284166033_CH17_FIGF17-5.jpg)\n\n### 图 17.5 显示插入和删除操作的队列\n\
  \n描述\n\n¹ *queue* 一词源于法语，但在全球范围内广泛使用。例如，美国人会要求人们“line up”（排队），而英国人会要求他们“queue up”（排队）。\n\
  \n1. a. 一个空队列![LL .back](img/9781284166033_CH17_p1062-1.jpg)\n2. b. 向队列中插入![queue\
  \ .front .back](img/9781284166033_CH17_p1062-2.jpg)\n3. c. 从队列中删除\n\n与队列一样，优先级队列职责没有标准的术语。C++\
  \ 简单地使用了栈的术语：`push`、`pop`、`top`、`empty` 和 `size`。因此，在命名栈和优先级队列对象时要小心，以便容易区分每个对象是什么种对象。我们不能依靠操作名称来帮助我们识别数据类型。\n\
  \n这里我们应该重申第 17.1 节中的一个关键点：数据结构具有概念结构和实现结构，两者可能不同。我们刚刚从概念角度描述了优先级队列。STL 通常使用更复杂、更高效的结构来实现优先级队列。当我们在本章中描述其他数据结构时，请记住我们看的是它们的概念安排。除极少数情况外，我们不描述\
  \ STL 是如何实现它们的。\n\n## 优先级队列\n\n正如我们在购物车问题中所说的，`priority queue`（优先级队列）是队列族结构中的成员员。它的行为类似于队列，数据只从其头部移除。然而，元素不是在末部插入的，而是被插入，使得它们处于给定的顺序，如\
  \ 图 17.6 所示。例如，登飞机的乘客可能被要求按照座位分配顺序排队。准备拍照的学生可能被要求按字母顺序排队。在每种情况下，人们以任何能让他们处于正确顺序的位置进入队伍，但他们只从头部离开队伍。\n\
  \n![显示优先级队列插入和移除点的图表。](img/9781284166033_CH17_FIGF17-6.jpg)\n\n### 图 17.6 显示插入和移除点的优先级队列\
  \ ADT\n\n描述\n\n## 17.3 双向线性结构\n\n与 第 14 章 中讨论的链表一样，队列是单向的。元素从头部向末部移动。\n\n### 双向链表\n\
  \n当我们想要一个可以在两个方向上遍历的结构时，数组是一个自然选择。但当中间的插入和删除常见且随机访问不重要时，数组就不合适了。相反，我们需要一种名为 `bidirectional\
  \ list`（双向列表）的结构。\n\n在双向列表中，我们通过一个指向相反方向的链接来增强列表。我们保留头部和末部的外部引用，并向前或后遍历节点，如 图 17.7\
  \ 所示。\n\n![双向列表。](img/9781284166033_CH17_FIGF17-7.jpg)\n\n### 图 17.7 双向列表\n\n描述\n\
  \n在这种结构中，每次插入和删除都需要双倍的操作，且节点占用双倍的空间，因此效率会有损失。因此，尽管双向列表是一个具有许多吸引功能的通用结构，但应在需要其额外功能时才使用。就像你不会用电锯修剪盆栽一样，同样请注意\
  \ STL 仅提供了 ADT 的双向实现。\n\n### 双端队列\n\n`deque`（读作 \"deck\"）是队列的双向等价物。通过它，我们可以在任何端插入和删除元素，如\
  \ 图 17.8 所示。事实上，这个名字是计算机科学家发明的 double-ended queue（双端队列）的缩写。如果你想模拟一个人们会失去耐心并从后面离开的队列，deque\
  \ 会是一个很好的选择。它还可以代表调车场中的火车车厢，可以从火车的任何端添加或移除车厢。\n\n![Deque 或双端队列的插图。](img/9781284166033_CH17_FIGF17-8.jpg)\n\
  \n### 图 17.8 Deque（双端队列）\n\n描述\n\ndeque 操作的命名没有共识。C++ 使用 `push_front` 和 `push_back`\
  \ 进行插入，使用 `pop_front` 和 `pop_back` 进行删除，使用 `front` 和 `back` 访问头部和尾的值。当我们查看 STL 实现时，C++\
  \ deque 实际上是一个巨大的类，它结合了抽象双向列表、deque 和数组的接口。\n\n\n\n\n现在是时候看看 STL 了。我们关注这些线性 ADT（抽象数据类型）的接口——也就是说，它们的概念视图是如何工作的。数据抽象和控制抽象允许我们编写任何所需的客户端代码来使用这些结构，而无需担心它们的内部实现。我们将在本章的稍后部分回到对抽象数据结构的介绍，届时我们将重点转移到数据的非线性组织上。\n\
  \n## 17.4 STL 简介\n\n正如名称“标准模板库”（Standard Template Library）所示，STL 主要由模板组成。该库有两个主要部分：`containers`（容器）和\
  \ `algorithms`（算法）。容器部分包含 16 种通用结构化数据类型的模板。其中 7 种数据类型更为特殊，本文将不会介绍：`forward_list`、`multiset`、`multimap`、`unordered_set`、`unordered_multiset`、`unordered_map`\
  \ 和 `unordered_multimap`。另外 9 种总结在下表中。\n\n![标准模板库中可用的一些数据结构表格](img/9781284166033_CH17_p1065-1.jpg)\n\
  \n描述\n\n`array` 类与其他类不同，将单独讨论。要声明并特化其他八种模板类中的任何，只需使用其名称，后跟尖括号中的类型；例如：\n\n![list\
  \ 和 vector 的声明](img/9781284166033_CH17_p1065-2.jpg)\n\n描述\n\n当我们逐个查看这些类型时，将看到不同形式的构造函数。容器元素的类型可以是内置类型，也可以是类。STL\
  \ 对元素对象实施了一些要求。特别是，它们必须至少支持重载关系运算符的最小子集。对于大多数编译器来说，重载 `<` 和 `==` 就足够了，但有少数编译器需要重载更多运算符。\n\
  \nSTL 的算法部分有大量的函数模板，可以在许多不同的语境中使用。在本文中，我们只详细介绍了少数算法。下表总结了一些常用的函数。并不是所有这些函数都能应用于每种容器。\n\
  \n![常用函数模板总结表](img/9781284166033_CH17_p1065-1.jpg)\n\n描述\n\n我们将更详细地查看每个容器类，并引入其中一些算法作为示例。请记住，我们只是浅尝这些模板的功能，以便让你对它们的工作原理有一个了解。对于更深入的研究，你应该查阅专门的\
  \ STL 参考书籍。\n\n### 迭代器\n\n在开始之前，我们必须探索与容器类的一个关键概念：迭代器（iterator）。我们过去讨论过迭代器，作为类可以承担的一种职责。在\
  \ STL 中，迭代器是一个指向容器中某个位置的对象。将迭代器看作被封装在类中的指针，可以提供额外的功能。它被称为迭代器，是因为额外功能包含了使其以步进方式在\
  \ STL 容器中移动的操作。\n\nSTL 中的迭代器有两种类型：正向（forward）和反向（reverse）。² 通常，容器有名为 `begin` 和 `end`\
  \ 的方法，分别返回指向其开头和结尾的正向迭代器。你可以使用 `++` 运算符让正向迭代器在容器中前进。使用 `--` 则使迭代器向后移动。\n\n方法 `rbegin`\
  \ 和 `rend` 方法返回反向迭代器。`rbegin` 和 `rend` 返回的迭代器分别指向容器的结尾和开头。在反向迭代器上使用 `++` 会使其从后部向前移动，而应用\
  \ `--` 则导致向后移动；也就是说，反向迭代器的语义与正向迭代器相反。反向迭代器从容器的末尾开始并向前“前进”。**图 17.9** 说明了这种关系。\n\n\
  ![与 list 关联的正向和反向迭代器图](img/9781284166033_CH17_FIGF17-9.jpg)\n\n**图 17.9 与 list 关联的正向和反向迭代器**\n\
  \n描述\n\n这些迭代器的设计是为了特别方便地使用 For 循环遍历容器。`end` 返回的实际上是一个指向最后一个元素之后某个位置的迭代器。同样，`rend`\
  \ 返回的迭代器指向容器开始之前的一个位置。正如我们所看到的，这种听起来很奇怪的约定简化了 For 循环中的终止条件。但注意，你不能使用 `end` 和 `rend`\
  \ 返回的值直接访问容器的末端。\n\n对于随机访问容器（如 `deque` 和 `vector`），算术运算符 `+` 和 `-` 可以应用于迭代器，就像我们使用数组索引来计算位置一样。这些迭代器的设计是为了特别方便地使用\
  \ For 循环遍历容器。`end` 返回的实际上是一个指向最后一个元素之后位置的迭代器。同样，`rend` 返回的是指向容器开始之前的位置。注意，你不能使用\
  \ `end` 和 `rend` 返回的值直接访问容器的末端。\n\n迭代器的一个非常重要的方面是，只要内容不改变，它们就是有效的。当从容器插入或删除元素时，其迭代器会失效，因为\
  \ STL 实现者可以自由地重新组织数据以提高效率。容器无法跟踪指向它的每一个迭代器，因此当发生变化时没有方法更新这些迭代器。每个迭代器都必须为所属的特定类型容器声明；例如，如果我们需要字符串列表的迭代器，我们将如下声明它们：\n\
  \n![迭代器的声明](img/9781284166033_CH17_p1068-1.jpg)\n\n描述\n\n迭代器的一个非常重要的方面是，只要内容不改变，它们就是有效的。STL\
  \ 实际上定义了五种。为了简单，我们只关注两种。\n\n### vector 模板\n\n我们对 STL 容器之旅从一个抽象上非常容易的类型开始。`vector`\
  \ 类模板实现了数组。为什么我们需要另一种定义数组的方法？嗯，关于 `vector` 还有一点——它的大小不是固定的。因此，当我们声明它时，不需要担心子数组处理或决定数组的大小。否则，你可以直接用这种容器替代内置数组。\n\
  \n我们说“几乎”是因为 `vector` 是一个对象而不是内置结构。因此，它必须在运行时用构造函数实例化。出于这个原因，我们不能像数组那样使用初始化列表来声明它。这里有一些\
  \ `vector` 构造函数的简单调用：\n\n![vector 构造函数的调用](img/9781284166033_CH17_p1068-2.jpg)\n\
  \n描述\n\n第一个语句是有意义的——它类似于编写以下代码：\n\n```\n![语句。int int V e c, 左括号, 20, 右括号, 分号](img/9781284166033_CH17_p1068-3.jpg)\n\
  ```\n\n\n\n但我们为什么想要声明一个没有任何空间的 `vector` 呢？原因是 `vector` 会自动扩容，以容纳我们放入的所有数据。因此，如果我们完全不知道会向\
  \ `noSizeVec` 中放入多少字符串，只需声明它不包含任何元素，并让该结构在插入值时自动增长。\n\n如果 `vector` 总是调整其大小来容纳数据，我们为什么还要费心指定大小呢？答案是，这种灵活性是有代价的。每当\
  \ `vector` 增长时，都可能涉及大量工作。它的底层实现是一个数组，模板会分配一个新的更大的数组，并将旧内容移动到其中。因此，当我们预先知道最大尺寸时，在构造函数中指定该值是有意义的。\n\
  \n让我们来看一个 `vector` 运行的示例。在第 11 章中，我们编写了一个程序，允许用户查询特定公寓的住户人数。这里是该程序改用 `vector` 后的版本，并高亮了更改。回想我们将公寓数量固定为\
  \ 10。\n\n![一个允许楼主查询特定公寓住户数量的程序。](img/9781284166033_CH17_p1069-1.jpg)\n\n描述\n\n如你所示，`vector`\
  \ 几乎直接替换了数组。由于该类重载了 `[]` 运算符，我们可以使用索引表示法来访问元素，无论是在向 `vector` 存储值还是检索值时。然而，我们的示例并没有完全展示\
  \ `vector` 模板的强大威力。让我们重写该程序，让 `vector` 增长到能够容纳输入文件中所有的公寓数据。\n\n当然，我们必须将循环从 `For`\
  \ 更改为 `While`，测试 `inFile` 状态的状态并使用“导读读取”（priming read）。常量 `BUILDING_SIZE` 不再有用，因此我们将其删除。但我们如何确定要输出的大小值呢？我们使用\
  \ `vector size` 方法；例如：\n\n![cout “No. of apts. is ” occupants.size() endl](img/9781284166033_CH17_p1070-1.jpg)\n\
  \n这非常简单。但向 `vector` 中添加元素呢？为此我们必须调用 `push_back` 方法，它将作为参数传递的元素追加到 `vector` 的末尾，并在必要时增加其大小。\n\
  \n在原始程序中，我们没有检查用户输入的公寓编号是否在有效范围内。我们可以再次使用 `size` 方法，结合 `If` 语句来保护对 `occupants[apt-1]`\
  \ 的访问，但这种解决方案也忽略了 `vector` 的另一个有用功能。如果使用 `at` 方法而不是索引访问，系统会自动进行范围检查，我们可以轻松地捕获 `out_of_range`\
  \ 异常。（记住我们必须包含 `<stdexcept>` 才能访问此异常类。）\n\n![一条语句。](img/9781284166033_CH17_p1070-2.jpg)\n\
  \n描述\n\n![一个允许楼主查询特定公寓住户数量的程序。](img/9781284166033_CH17_p1071-1.jpg)\n\n描述\n\n这里是高亮显示更改后的修订代码，随后是一个包含\
  \ 18 个值的新数据文件以及示例运行的输出。数据文件：\n\n![数据内容的列表。](img/9781284166033_CH17_p1071-2.jpg)\n\
  \n描述\n\n测试运行：\n\n![程序测试运行产生的输出。](img/9781284166033_CH17_p1071-3.jpg)\n\n描述\n\n前面的示例仅演示了\
  \ `vector` 可用的运算符。下面的表格总结了这些运算符，并列出了常用的其他运算符。\n\n![带有 4 列标签的表格，分别为 Name, Parameters,\
  \ Returns 和 Description。](img/9781284166033_CH17_p1072-1.jpg)\n\n描述\n\n关于这些方法还有几点需要注意。`at`\
  \ 方法返回一个引用，可用于访问或赋值；也就是说，我们也可以这样写……\n\n\n\n鉴于 `vector` 如此轻易地替换数组，你可能会奇怪为什么还有一个 `array`\
  \ 模板。答案是，在 STL 流行之后，程序员希望有一种固定大小的数组类型，它能与其他 STL 容器兼容，并提供它们的一些额外功能。正如你预期的，它的构造函数要求我们同时指定元素类型和大小。与\
