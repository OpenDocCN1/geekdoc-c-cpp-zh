  \ **List** 类实例\n\n\n\n\n\n以下程序使用 `List` 类来存储温度读数，删除 200 度的异常读数，并按排序顺序输出剩余的读数。假设该数据文件该月最多包含\
  \ 31 个整数，因此其长度应在 `List` 类 100 的长度 `MAX_LENGTH` 范围内。然而，为了以防文件错误地包含了超过 `MAX_LENGTH`\
  \ 的值，后续程序中的读取循环不仅在遇到文件末尾（EOF）时终止，而且在列表满（`IsFull`）时也会终止。在这一循环中使用 `IsFull` 操作的另一个原因可以查看\
  \ `list.h` 文件中的函数规范——即，我们必须保证 `Insert` 的前提条件：列表未满。\n\n![一段程序片段。](img/9781284166033_CH13_P763-1.jpg)\n\
  \n描述\n\n![程序片段的延续。](img/9781284166033_CH13_P764-1.jpg)\n\n描述\n\n这里是输入文件：\n\n`temps.dat`\n\
  \n![一个标记为 temps dot d a t 的输入文件，列出了值。](img/9781284166033_CH13_P765-1.jpg)\n\n描述\n\
  \n给定 `List` 类的实现，这是预期的输出文件：\n\n`temps.ans`\n\n![一个标记为 temps dot a n s 的输出文件，显示了输出。](img/9781284166033_CH13_P765-2.jpg)\n\
  \n描述\n\n我们现在考虑在列表项存储在数组的情况下，如何实现每个 ADT 操作。\n\n## 13.3 List ADT 的实现\n\n### 基本操作\n\
  \n正如我们在第 12 章中讨论的那样，ADT 应该通过使用规范文件和实现文件在 C++ 中实现。以下是实现文件 `List.cpp` 的开头：\n\n![部分程序代码。](img/9781284166033_CH13_P766-1.jpg)\n\
  \n描述\n\n现在让我们基础列表操作的实现。\n\n### 创建空列表\n\n正如我们在图 13.4 中看到的，列表项存储在数组元素 `data[0]` 到\
  \ `data[length-1]` 中。要创建一个空列表，只需将 `length` 成员设置为 0 即可。我们不需要向 `data` 数组存储任何特殊值来使列表为空，因为列表算法只处理\
  \ `data[0]` 到 `data[length-1]` 的元素。我们还需要将 `currentPos` 设置为 0 以为迭代初始化列表。当我们查看 `GetNextItem`\
  \ 的实现时将再次回到这个初始化选择。\n\n![创建空列表的程序代码。](img/9781284166033_CH13_P767-1.jpg)\n\n描述\n\
  \n### IsEmpty 操作\n\n如果列表为空，该操作返回 `true`，否则返回 `false`。根据我们列表为空时 `length` 等于 0 的惯例，实现是非常直观的。\n\
  \n![Is Empty 操作的程序代码。](img/9781284166033_CH13_P767-2.jpg)\n\n描述\n\n#### IsFull 操作\n\
  \n如果数组中没有更多空间——即如果列表长度等于 `MAX_LENGTH`，则列表为满。\n\n![Is Full 操作的程序代码。](img/9781284166033_CH13_P767-3.jpg)\n\
  \n描述\n\n### GetLength 操作\n\n该操作简单返回列表的当前长度。\n\n![Get Length 操作的程序代码。](img/9781284166033_CH13_P767-4.jpg)\n\
  \n描述\n\n### 插入和删除\n\n要设计插入新项的算法，我们首先观察到这是一个无序列表。规范中没有表明值必须是任何顺序。因此，我们增加 `length`。这引出了两个问题：列表是否有空间？我们需要检查该项是否存在吗？这两个问题的答案都是否。要知道为什么，请回\
  \ `Insert` 原型：\n\n![函数头后跟着注释。](img/9781284166033_CH13_P768-1.jpg)\n\n描述\n\n要使用 `Insert`\
  \ 操作，我们首先检查 `length < MAX_LENGTH`。如果为，我们将项存储在 `data[length]` 中并增加 `length`。\n\n\
  ![函数头后跟着注释。](img/9781284166033_CH13_P768-2.jpg)\n\n描述\n\n从列表中删除组件包括两个步骤：找到组件并将其它。在\
  \ `Delete` 操作中，我们搜索要删除的项。如果我们找到了，就从它的原始位置移除，然后递减 `length`。\n\n![函数头后跟着注释。](img/9781284166033_CH13_P768-3.jpg)\n\
  \n描述\n\n为了移除该项，我们将 `data[index+1]` 到 `data[length-1]` 的元素左移一位。这在代码中显示：\n\n![代码片段。](img/9781284166033_CH13_P768-4.jpg)\n\
  \n描述\n\n### 顺序搜索\n\n在 `Delete` 函数中，我们用于搜索要项的算法被称为无序列表中的顺序搜索或线性搜索。我们使用相同的算法来实现 `List`\
  \ 类的 `IsThere` 函数。\n\n![部分程序代码。](img/9781284166033_CH13_P769-1.jpg)\n\n描述\n\n该算法被称为顺序搜索，是因为按顺序查看每个项。当我们找到项时（或者在到达列表末尾仍未找到时），我们停止搜索。\n\
  \n\n\n\n\n![部分程序代码。](img/9781284166033_CH13_P769-2.jpg)\n\n描述\n\n在我们离开线性搜索算法之前，让我们介绍一种可以让程序更高效的变体，尽管稍微复杂一点。`While`\
  \ 循环包含一个复合条件：它在找到 `item` 或到达列表末尾时停止。我们可以将 `item` 的副本插入到 `data[length]` 中——即插入列表末尾之外的数组部分——以此作为哨兵（sentinel）。通过这样做，我们能够保证在列表中找到\
  \ `item`。然后我们就可以消除检查列表末尾的条件（`index < length`）。\n\n![部分程序代码。](img/9781284166033_CH13_P770-1.jpg)\n\
  \n描述\n\n这种算法更好吗？消除一个条件可以节省计算机测试该条件的时间。在这种情况下，循环的每次迭代都节省了时间，因此节省的效果会累积。然而请注意，我们是以空间为代价获得了效率。我们必须将数组大小声明为比用户限制大，以便在列表满时存储哨兵值。也就是说，我们必须将数组声明更改为\n\
  \n![数组声明语句。元素类型，data，左方括号，MAX，下划线，LENGTH，加，1，右方括号，分号。](img/9781284166033_CH13_P770-2.jpg)\n\
  \n注释描述了该循环的处理过程。记住原型（规范）文档是面向用户的，不包含任何实现细节。如果代码使用了不寻常算法，这一事实应该在函数的定义文档中注明，该文档是给代码维护者看的。\n\
  \n### 迭代器\n\n迭代器与复合类型配合使用，允许用户逐组件处理整个结构。为了让用户按顺序访问每个项目，我们提供了三个操作：一个用于初始化迭代（类似于打开文件的\
  \ `Open` 过程），一个用于判断是否有更多项目，另一个在每次调用时返回“下一个组件”的副本。用户随后可以设置一个处理每个组件的循环。我们将这些操作称为 `ResetList`、`HasNext`\
  \ 和 `GetNextItem`。另一种类型的迭代器接受一个操作并将其应用于列表的每个元素。\n\n`ResetList` 函数仅将 `currentPos`\
  \ 设置为 0。因为构造函数为第一次迭代准备了列表，所以 `ResetList` 只在后续迭代中被调用。然而，如果它在第一次迭代时被调用，也没有害：`currentPos`\
  \ 只是被设置了两次。\n\n`GetNextItem` 操作访问下一个项目（位于 `currentPos` 处的项目），增加 `currentPos` 并返回它所访问的项目。如果最后一个项目已经被访问了会怎样？`HasNext`\
  \ 将返回 `false`。`HasNext` 如何识别何时访问了最后一个项目？通过测试 `currentPos` 是否等于 `length`。\n\n![代码片段。](img/9781284166033_CH13_P771-1.jpg)\n\
  \n描述\n\n`Reset` 和 `GetNextItem` 被设计用于在遍历列表中所有项目的客户端程序循环中。`GetNextItem` 规范中的前提条件防止了访问列表中的数组元素。回顾：`HasNext`\
  \ 和 `GetNextItem` 用于输出原始列表；`ResetList`、`HasNext` 和 `GetNextItem` 用于输出修正后的列表。\n\n\
  ## 13.4 排序列表\n\n在 `List` 类中，搜索算法假设列表无序的。搜索无序列表的缺点是必须扫描整个列表才能发现项目不存在。想想如果你的电话人列表是随机顺序而不是字母顺序会怎样。为了查找\
  \ Mary Anthony 的电话，你必须一页一页地扫描。在最坏的情况下，你可能需要检查数百个名字才发现 Mary 不在。当然，联系人列表是按字母排序的，这使得搜索变得更容易。如果\
  \ Mary Anthony 的名字不在列表中，你可以从 A 开始，一旦到达她名字应该的位置就能发现这一事实。\n\n让我们定义一个排序 ADT，无论应用什么操作，组件始终保持顺序。以下是包含\
  \ `SortedList` 类声明的 `SortedList.h` 文件。\n\n![程序片段。](img/9781284166033_CH13_P775-1.jpg)\n\
  \n描述\n\n![片段的延续。](img/9781284166033_CH13_P776-1.jpg)\n\n描述\n\n`SortedList` 的声明与原始\
  \ `List` 类有何不同？除了少数更改外，有两个区别：\n\n1. `SortedList` 类没有提供排序操作。不需要这种操作，因为列表始终保持排序。\n\
  2. `SortedList` 类在私有部分有一个成员：`BinarySearch` 函数。这是一个仅供类函数使用的辅助（帮助）函数，客户端无法访问。我们在检查类实现时讨论它的用途。\n\
  \n考虑到现在使用的是排序列表，看看 ADT 的算法需要哪些更改。\n\n### 基础操作\n\n类构造函数、`IsEmpty`、`IsFull`、`GetLength`、`ResetList`、`HasNext`\
  \ 和 `GetNextItem` 的算法与 `List` 类使用的相同。构造函数将 `length` 设置为 0，`IsFull` 报告 `length` 是否等于\
  \ `MAX_LENGTH`，`GetLength` 返回 `length` 的值，三个迭代相关函数设置后续迭代、判断是否有项目并获取项目。\n\n### 插入\n\
  \n要在已排序的列表中添加新值，可以将新值存储在 `data[length]`，增加 `length` 并排序数组。然而，这不是解决问题的有效方法。插入五个新项目会导致五次排序操作。\n\
  \n如果我们手动向排序列表插入一个值，我们将新值写在旁边并画一条线显示它所在的位置。为了找到这个位置，我们扫描列表直到找到一个比要插入的值大的值。新值就放在该点之前。\n\
  \n我们可以在 `Insert` 函数中使用类似的过程。我们使用手动算法找到列表中的合适位置。我们不是将值写在旁边，而是将所有比新值大的向下移动一位为它腾出空间。主算法如下，其中\
  \ `item` 是被插入的值：\n\n![值插入算法。](img/9781284166033_CH13_P777-1.jpg)\n\n描述\n\n假设 `index`\
  \ 是要插入 `item` 的位置，向下移动列表的算法为\n\n![向下移动列表算法。](img/9781284166033_CH13_P777-2.jpg)\n\
  \n描述\n\n![图表显示了一组 5 个元素的数组，5 个随机值按升升顺序逐个插入。](img/9781284166033_CH13_FIGF13_7.jpg)\n\
  \n描述\n\nFIGURE 13.7 在排序列表中插入项目\n\n\n\n\n\n该算法在图 13.7 中所示。它是基于我们如何手动完成这项任务的。通常，这种适应方法是解决问题的最佳途径；但在情况下，进一步的思考揭示了一种稍微更好的方法。注意，我们从列表的开头开始搜索（人们总是这样做），并从列表的尾部向上移动。我们可以通过从列表尾部开始，将搜索和移动结合起来。\n\
  \n如果 `item` 是要插入的新条目，我们可以将 `item` 与 `data[length-1]` 中的值进行比较。如果 `item` 小于该值，我们将\
  \ `data[length-1]` 放入 `data[length]`，并将 `item` 与 `data[length-2]` 中的值进行比较。这个过程一直持续，直到我们找到\
  \ `item` 大于或等于列表中某个项的位置。然后我们将 `item` 直接存储在它下方。以下是该算法：\n\n![一个排序算法。](img/9781284166033_CH13_P778-1.jpg)\n\
  \n描述\n\n![一个代码片段。](img/9781284166033_CH13_P779-1.jpg)\n\n描述\n\n注意，即使列表为空，该算法仍然有效。当列表为空时，`length`\
  \ 为 0，不会进入 `While` 循环体。因此，`item` 被存储在 `data[0]` 中，且 `length` 增加到 1。如果 `item` 是最小的，算法还能工作吗？最大的呢？让我们来看看：如果\
  \ `item` 是最小的，循环体会执行 `length` 次，`index` 为 –1。因此，`item` 被存储在位置 0，这正是它所属的地方。如果 `item`\
  \ 是最大的，则不进入循环体。`index` 的值仍为 `length-1`，因此 `item` 被存储在 `data[length]` 中，这正是它所属的地方。\n\
  \n你对一般情况也能处理特殊情况感到惊讶吗？这种情况并非总是发生，但它发生的频率足够高，因此，从一般情况开始是一个良好的编程习惯。如果我们从特殊情况开始，我们可能意识意识到不需要单独处理它们。所以，请先从一般情况开始，只将那些一般情况无法正确处理的情况视为特殊情况。\n\
  \n该算法是另一种通用排序算法的基础——插入排序，在插入排序中，值被一个接一个地插入到最初为空的列表中。当输入数据必须排序时，通常会使用插入排序；每个值在读取时都会被放在它的正确位置。我们在本章末尾的解决问题案例中使用了这种技术。\n\
  \n### 顺序查找\n\n当我们在未排序的列表中搜索项时，在到达列表末尾之前，我们无法发现该项是缺失的。如果列表已经过过序，当我们越过该项在列表中应该出现的位置时，我们就知道某个项缺失了。例如，假设列表包含以下值：\n\
  \n7\n\n11\n\n13\n\n76\n\n98\n\n102\n\n如果我们正在寻找 12，我们只需要将 12 与 7、11 和 13 进行比较，就能知道\
  \ 12 不在列表中。\n\n如果搜索项大于当前列表的组件，我们就移动到下一个组件。如果该项与当前组件相等，我们就找到了我们正在找的内容。如果该项小于当前组件，那么我们就知道它不在列表中。在最后后两种情况的任何一种情况下，我们都停止查找。我们可以通过以下代码以算法的方式重述这个过程，其中如果找到了搜索项，则将\
  \ `found` 设置为 `true`：\n\n![一个代码片段。](img/9781284166033_CH13_P780-1.jpg)\n\n描述\n\n\
  平均而言，通过这种方式在有序列表中查找一个项所需的迭代次数与在未排序列表中查找相同。这种新算法的优势在于，如果某个项缺失，我们可以更早地发现。因此，它的效率略高。然而，在有序列表中查找还有一种更好的方法。\n\
  \n### 二分查找\n\n在有序列表上进行的第二种搜索算法在查找项和发现项缺失方面都比顺序查找快得多。这种算法被称为二分查找。二分查找将列表一分为对半（除以\
  \ 2——这就是为什么它被称为二分查找），并决定下一个查看哪一半。重复对所选列表部分的划分，直到找到该项或确定该项不在列表中。\n\n这种方法类似于我们如何在字典中查单词。我们从字典中间打开字典，并将单词与我们在那里找到的词进行比较。如果我们要找的单词在这个词之前，我们就在字典的左部分继续查找。否则，我们在右部分继续查找。我们重复这个过程，直到找到该单词。如果它不在那里，要么是我们拼写错了单词，要么是我们的字典不完整。\n\
  \n二分查找的算法如下。在 във算法中，值列表位于数组 `data` 中，正在被查找的值是 `item`（参见图 13.8）。\n\n1. 将 `item`\
  \ 与 `data[middle]` 比较。如果 `item = data[middle]`，那么我们就找到了。如果 `item < data[middle]`，那么我们在\
  \ `data` 的前半部分查找。如果 `item > data[middle]`，则我们在 `data` 的后半部分查找。\n\n2. 重新定义 `data`\
  \ 为我们下一个搜索的那部分，并重复步骤 1。\n\n3. 当我们找到 `item` 或知道它缺失时停止。当没有其他地方可以查找且我们还没有找到它时，我们就知道它是缺失的。\n\
  \n这个算法应该是合逻辑的。在每次比较中，最好的情况下我们找到了正在搜索的项；最坏的情况下，我们从考虑中消除了剩余列表的一半。\n\n我们需要跟踪第一个可能的查找位置（first`）和最后一个可能的查找位置（last`）。在任何一个时刻，我们只查找\
  \ `data[first]` 到 `data[last]`。当函数开始时，`first` 设置为 0，`last` 设置为 `length-1` 以包含整个列表。\n\
  \n![一张图显示了一个标记为 data 的数组，带有左括号 first，右方括号，左括号 middle，右方括号，左括号 last，右方括号，数组组件。data\
  \ 数组下方画了一个标记为 item 的组件。3 个双向箭头从 item 指向 data 数组。两侧的两个双向箭头上有问号。](img/9781284166033_CH13_FIG13_8.jpg)\n\
  \n图 13.8 二分查找\n\n我们之前的三个搜索算法都是布尔型观察操作。它们只是回答一个简单的问题：这个项在列表中吗？让我们把二分查找编写为一个 `void`\
  \ 函数，它不仅询问项是否在列表中，还询问它是哪一个（如果项在列表的话）。为了这一点，我们需要在参数列表中添加两个参数：一个布尔标志 `found`（告诉我们项是否在列表中）和一个整型变量\
  \ `position`（告诉我们它是哪一个）。如果 `found` 为 `false`，`position` 是未定义的。\n\n![一个程序片段。](img/9781284166033_CH13_P781-1.jpg)\n\
  \n描述\n\n\n\n\n让我们来走一遍二分查找算法的代码。要查找的值是 24。图 13.9A 显示了第一次迭代期间 `first`、`last` 和 `middle`\
  \ 的值。在这次迭代中，将 24 与 `data[middle]` 中的值 103 进行比较。由于 24 小于 103，`last` 变为 `middle-1`，而\
  \ `first` 保持不变。图 13.9B 显示了第二次迭代期间的情况。这一次，24 与 `data[middle]` 中的值 72 进行比较。由于 24 小于\
  \ 72，`last` 再次变为 `middle-1`，而 `first` 再次保持不变。\n\n在第三次迭代中（图 13.9C），`middle` 和 `first`\
  \ 均为 0。将 24 与 `data[middle]` 中的值 12 进行比较。由于 24 大于 12，`first` 变为 `middle+1`。\n\n\
  ![标记为数组，第一次迭代 24，左尖括号，103，带有一叠 11 个带有值的数组组件](img/9781284166033_CH13_FIGF13_9AB.jpg)\n\
  \n描述\n\n![标记为数组，第三次迭代 24，右尖括号，12，带有一叠 11 个带有值的数组组件](img/9781284166033_CH13_FIGF13_9CD.jpg)\n\
  \n描述\n\n图 13.9A, B, C 和 D `BinarySearch` 函数的代码走读（`item` 为 13）\n\n在第四次迭代中（图 13.9D），`first`、`last`\
  \ 和 `middle` 全部相同。同样，24 与 `data[middle]` 中的值进行比较。由于 24 小于 64，`last` 变为 `middle-1`。现在由于\
  \ `last` 小于 `first`，过程停止；`found` 为 `false`。\n\n二分查找是我们为止为止过的过的复杂的算法。下表显示了使用上一个示例相同的数据查找值\
  \ 106、400 和 406 时的 `first`、`last`、`middle` 和 `data[middle]`。请仔细检查表中的结果。\n\n![一个带有\
  \ 6 列的表格，标记为 item, first, last, middle, data, 左方括号, middle, 右方括号，以及循环结束](img/9781284166033_CH13_P783-1.jpg)\n\
  \n描述\n\n注意此表，无论我们查找 106、400 还是 406，循环执行次数从未超过四次。事实上，在包含 11 个组件的列表中，它的执行次数从未超过四次，因为列表每次通过循环都会减半。下表比较了顺序查找和二分查找找到某个项目所需的平均迭代次数。\n\
  \n| | 平均迭代次数 |\n| --- | --- | --- |\n| 列表长度 | 顺序查找 | 二分查找 |\n| 10 | 5.5 | 2.9 |\n\
  | 100 | 50.5 | 5.8 |\n| 1000 | 500.5 | 9.0 |\n| 10,000 | 5000.5 | 12.4 |\n\n既然二分查找这么快，为什么不一直使用它呢？在循环次数方面它确实更快，但在二分查找循环中执行的计算量比其他查找算法更多。因此，如果列表中的组件数量很少（例如，少于\
  \ 20 个项目），顺序查找算法更快，因为它在每次迭代中执行的工作更少。随着列表中组件数量的增加，二分查找算法变得相对更高效。但请记住，二分查找要求列表是有序的，而排序需要时间。在决定使用哪种查找算法时，请记住三个因素：\n\
  \n1. 待查找列表的长度\n2. 列表是否已经排序\n3. 列表被查找的次数\n\n给定 `BinarySearch` 函数（`SortedList` 类的私有成员），可以很容易实现\
  \ `IsThere` 函数（一个公共成员）。\n\n![代码片段](img/9781284166033_CH13_P785.jpg)\n\n描述\n\n`IsThere`\
  \ 的体调用 `BinarySearch`，获取变量 `found` 和 `position` 的结果。`IsThere` 接收来自 `BinarySearch`\
  \ 的 `found` 值并将其传递给客户端（通过 `return` 语句）。`IsThere` 忽略了 `position` 参数。为什么我们在设计 `BinarySearch`\
  \ 时包含了第三个参数？原因是我们将查看的 `Delete` 操作使用了该参数。\n\n### 删除\n\n在 `SortedList` 类的 `Delete`\
  \ 函数中，我们通过移动列表中的最后一个组件来删除项目。虽然这个算法对于未排序的列表可行，但对于有序列表则不行。将最后一个组件移动到任意位置几乎会破坏组件的顺序。相反，我们需要适用于有序列表的新算法。让我们调用\
