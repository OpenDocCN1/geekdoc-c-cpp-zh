  \n### 块（复合语句）\n\n函数体是块（或复合语句）的一个示例。这是块的语法模板：\n\n![代码块的语法模板。](img/9781284166033_CH02_UFIG68-2.jpg)\n\
  \n描述\n\n块只是由一对 `{ }` 包围（分隔）的零或多个语句的序列。现在我们可以将函数定义重新定义为一个一个头后跟一个块：\n\n![函数的定义。](img/9781284166033_CH02_UFIG69-1.jpg)\n\
  \n描述\n\n在后面的章节中，当我们学习如何编写 `main` 以外的函数时，我们将详细定义函数头的语法。对于 `main` 函数，函数头简单地就是\n\n\
  ```cpp\nint main()\n```\n![images/9781284166033_CH02_PRE60.jpg)这是语句的语法模板，仅限于本章讨论的\
  \ C++ 语句：![语句的语法模板。](img/9781284166033_CH02_UFIG69-2.jpg)\n\n描述\n\n语句可以为空（空语句）。空语句只是一个分号，看起来如下：\n\
  \n```cpp\n;\n```\n![images/9781284166033_CH02_PRE61.jpg)它在执行时什么都不做；执行只是继续到下一条语句。空语句很少使用。正如语法模板所示，语句也可以是一个声明、一个可执行语句，甚至是一个块。最后一个术语意味着在任何允许使用单个语句的地方，你都可以使用整个块。当我们引入分支和循环结构的语法时，我们会发现这是非常重要的。我们经常使用块，特别是作为其他语句的一部分。遗漏一对\
  \ `{ }` 可能会剧烈地改变程序的含义以及执行情况。这就是为什么我们总是对块内部的语句进行缩进的缘——缩进使得块在长段代码中易于识别。注意在块和语句的语法模板中，没有提到分号——然而\
  \ `PrintName` 程序包含许多分号。如果你回头看常量声明、变量声明、赋值语句和输出语句的模板，你可以看到每种语句的末尾都需要分号。然而，块的语法模板在右大括号后没有显示分号。那么，在\
  \ C++ 中使用分号的规则非常简单：除复合语句（块）外，用分号终止每条语句。关于块和语句的还有一点：根据语句的语法模板，声明正式被视为一条语句。因此，声明可以出现在任何可以使用可执行语句的地方。在块中，如果我们的的话，我们可以混合声明和可执行语句：![带有声明和可执行语句的代码块。](img/9781284166033_CH02_PRE62.jpg)\n\
  \n描述\n\n然而，我们更倾向于在可执行语句之前将声明分组在一起：\n\n![在可执行语句开始前添加声明的代码块。](img/9781284166033_CH02_PRE63.jpg)\n\
  \n### C++ 预处理器\n\n假设你是编译器。你看到了如下程序。\n\n![程序的输出。](img/9781284166033_CH02_UFIG68-1.jpg)\n\
  \n描述\n\n请记住，`main` 在执行完毕时会向操作系统返回一个整数值。这个值被称为退出状态。正如我们看到的，`0` 是正常的退出状态值。注意我们在 `PrintName`\
  \ 程序中是如何整齐地安排代码的。我们使用空行将相关的语句分组，并对 `main` 函数的体进行缩进。编译器并不要求我们以这种格式化程序；这只是让代码更具读性。\n\
  \n\n\n\n为了解决这个问题，C++ 引入了命名空间（namespace）的概念。头文件的作者可以声明其标识符具有前缀，以与其他标识区分来。例如，`exWhyZee`\
  \ 头文件的作者可以指定它使用 `xyz` 命名空间，而 `emEnOh` 的作者可能会使用名为 `mno` 的命名空间。在同时导入这两个头文件的程序中，它们不同的计数变量可以区别为\
  \ `xyz::count` 和 `mno::count`。\n\n在我们的 `HappyBirthday` 程序中，即使添加了 `#include <iostream>`\
  \ 指令，程序也无法编译，因为 `iostream` 头文件（实际上是每一个标准头文件）都将其所有的标识符声明在一个名为 `std` 的命名空间块中：\n\n\
  ![名为 std 的命名空间块。](img/9781284166033_CH02_PRE66.jpg)\n\n描述\n\n现在先不要担心编写命名空间声明；重点在于，命名空间块内声明的标识符可以被该块内的语句直接访问。要访问“隐藏”在命名空间内部的标识符，我们可以在程序顶部\
  \ `main` 函数之前插入一条名为 `using` 指令的语句。这样做使得 `std` 命名空间中的所有标识符无需 `std::` 前缀即可被我们的程序访问。\n\
  \n我们在早的程序中使用过此指令，并将继续一直使用，直到第 8 章，在该章中我们将讨论为什么在大型程序中不建议这样做。通过之前的演示，我们本可以在 `main`\
  \ 中声明这些常量。在这里，我们将它们放在 `main` 之前，作为全局声明的示例（这将在第 9 章 中介绍）。在 C 语言和标准前的 C++ 中，标准头文件以\
  \ `.h` 后缀结尾（例如 `iostream.h`），其中 `h` 代表“头文件”。在 ISO/ANSI C++ 中，标准头文件不再使用 `.h` 后缀。\n\
  \n## 2.3 更多关于输出的知识\n\n我们可以控制输出的水平和垂直间距，使其更有吸引力（且易于理解）。让我们先看看垂直间距。\n\n### 创建空行\n\n\
  我们通过在输出语句中使用 `endl` 操作符来控制垂直间距。你已经看到，一系列输出语句会继续在当前行写入字符，直到 `endl` 终止该行。以下是一些示例：\n\
  \n| 语句 | 生成的输出 |\n| --- | --- |\n| `cout << \"Hi there;\"; cout << \"Lois Lane.\"\
  \ << endl;` | Hi there, Lois Lane. |\n| `cout << \"Have you seen\"; cout << \"Clark\
  \ Kent?\" << endl;` | Have seen Clark Kent? |\n| `cout << \"Hi there,\" << endl;\
  \ cout << \"Lois Lane.\" << endl;` | Hi there, Lois Lane. |\n| `cout << \"Have you\
  \ seen\" << endl; cout << \"Clark Kent?\" << endl;` | Have seen Clark Kent? |\n\
  | `cout << \"Hi there,\" << endl; cout << \"Lois Lane.\"; cout << \"Have you seen\"\
  \ << endl; cout << \"Clark Kent?\" << endl;` | Hi there, Lois Lane. Have seen Clark\
  \ Kent? |\n\n你认为接下来的语句会输出什么？\n\n![读者必须说出语句输出的内容。](img/9781284166033_CH02_PRE77.jpg)\n\
  \n描述\n\n第一条输出语句输出单词 \"Hi there\"；`endl` 使控制台窗口光标到下一行。下一条语句不输出任何内容但跳转到下一行。第三条语句输出单词\
  \ \"Lois Lane.\" 并终止该行。最终输出是三行：\n\n![之前语句的输出。](img/9781284166033_CH02_PRE78.jpg)\n\
  \n描述\n\n每当你紧接着另一个 `endl` 使用 `endl` 时，就会产生一个空行。正如你猜的那样，连续使用三次 `endl` 会产生两个空行，连续使用四次产生三个空行，以此此类推。\n\
  \n注意，我们在 C++ 中编写输出语句时具有极大的灵活性。我们可以将之前的三个语句合并为两条：\n\n![将之前的三个输出语句合并为两条语句。](img/9781284166033_CH02_PRE79.jpg)\n\
  \n描述\n\n事实上，我们可以在一条语句中完成所有操作。一种可能是是：\n\n![将两个输出语句合并为一条语句。](img/9781284166033_CH02_PRE80.jpg)\n\
  \n描述\n\n还有这种：\n\n![以另一种方式将两条输出语句合并为一条语句。](img/9781284166033_CH02_PRE81.jpg)\n\n\
  描述\n\n### 在行内插入空格\n\n为了控制输出的水平间距，一种技术是发送额外的空格。例如，为了产生以下输出：\n\n![未包含空格的语句。](img/9781284166033_CH02_PRE82.jpg)\n\
