  \n### 越界数组索引\n\n给定声明\n\n![数组声明。float, alpha, 左方括号, 100, 右方括号。](img/9781284166033_CH11_P595-3.jpg)\n\
  \n索引值的范围是从 0 到 99。如果我们执行以下语句会发生什么：\n\n```\n![程序语句。第 1 行: alpha, 左方括号, i, 右方括号, 等于,\
  \ 62.4。](img/9781284166033_CH11_P595-4.jpg)\n```\n\n\n\n当 `i` 小于 0 或大于 99 时？会访问数组外部的内存位置。C++\
  \ 不会检查无效的（越界）数组索引。如果在前一个语句中 `i` 恰好为 100，计算机会将 62.4 放入数组末尾之后的下一个内存位置，破坏该处原本存在的任何内容。确保索引表达式保持在数组范围内你的责任。越界访问可能会产生极难调试的错误，还可能为在线系统的安全漏洞提供机会。\n\
  \n数组处理算法通常使用 `For` 循环逐个遍历元素。这里是一个将我们包含 100 个元素的 `alpha` 数组置零的循环（`i` 是一个 `int` 变量）：\n\
  \n![一个 for 循环语句。](img/9781284166033_CH11_P596-1.jpg)\n\n描述\n\n我们也可以将第一行写成：\n\n![一个\
  \ for 循环语句。for, 左括号, i 等于 0, 分号, i, 左尖括号等于, 99, 分号, i 加++, 右括号。](img/9781284166033_CH11_P596-2.jpg)\n\
  \n然而，C++ 程序员通常更倾向于使用第一个版本，以便循环测试中的数字（100）与数组的大小一致。使用这种模式时，始终记住测试的是*小于*，而不是小于或等于。\n\
