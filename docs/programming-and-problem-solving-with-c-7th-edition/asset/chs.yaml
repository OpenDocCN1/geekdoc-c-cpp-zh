  \n描述\n\n这是实现文件：\n\n![一个代码片段。](img/9781284166033_CH14_P847-1.jpg)\n\n描述\n\n**14.5\
  \ 析构函数与拷贝构造函数**\n\n操作堆上数据的类应该提供三个特殊操作：构造函数、析构函数和拷贝构造函数。你已经熟悉构造函数；现在我们来看另外两个。\n\n\
  ### **析构函数**\n\n析构函数的目的是在 `List` 对象销毁时释放链表中的节点。如果没有析构函数，链表将被遗留，无法访问。析构函数的代码很容易编写。我们只需遍历列表。\n\
  \n```cpp\n~List() {\n    Node* current = dataPtr;\n    while (current != NULL) {\n\
  \        Node* next = current->link;\n        delete current;\n        current =\
  \ next;\n    }\n}\n```\n\n### **浅拷贝与深拷贝**\n\n当我们引入数组时，说过你可以将一个数组赋值给另一个，但得到的并不是想要的。因为你只是将一个地址复制到另一个，而不是内容。链表也是如此。使用内置赋值运算符（`=`），将一个类对象赋值给另一个只会复制类成员；不会复制类成员指向的任何数据。参见图\
  \ 14.6。\n\n这种结果被称为**浅拷贝**操作：复制了指针，但没有复制指向的数据。如果类成员都不是指针，浅拷贝是可以的。在之前的示例中，`length`、`currentPos`\
  \ 和 `lastPtr` 按照你预期的进行了复制。但如果一个或多个成员指向动态数据，那么浅拷贝就不会包含它们。只有指向列表的外部指针（`dataPtr`）被复制到\
  \ `listOne` 中，而不是它指向的列表。此外，原本 `listOne` 对象指向的动态数据已被遗留无法访问。\n\n我们需要的是**深拷贝**操作——一种既复制类成员又复制指向的数据的操作。\n\
  \n### **拷贝构造函数**\n\n\n\n\n深拷贝与浅拷贝的问题也出现在另一个上下文中：用一个类对象初始化另一个类对象。C++ 对初始化的定义包含如下：\n\
  \n1. 变量声明中的初始化：\n   ![2 条语句。](img/9781284166033_CH14_P850-1.jpg)\n   描述\n2. 将参数的拷贝传递给形参数（即按值传递）\n\
  3. 将对象作为函数的返回值：\n   ![一条语句。返回, 某些对象, 分号。](img/9781284166033_CH14_P850-2.jpg)\n\n\
  默认情况下，C++ 使用浅拷贝语义执行此类初始化；换句话说，新创建的类对象是通过对旧对象的逐成员拷贝来初始化的，而没有对类成员所指向的数据进行复制。`name1`\
  \ 和 `name2` 最终都指向相同的三个字符串；它们并没有各自指向字符串的独立副本。\n\n为了处理这种情况，C++ 支持一种特殊的构造函数，称为**拷贝构造函数**。在类声明中，它的原型形式如下：\n\
  \n![一个代码片段。](img/9781284166033_CH14_P850-3.jpg)\n   描述\n\n注意，函数原型并没有使用任何特殊单词来表示它是拷贝构造函数。你只需要识别这种符号模式：类名后紧跟一个参数列表，列表中包含一个其自身类型的\
  \ `const` 引用参数：\n![一条语句。const, 某些类 取地址符。](img/9781284166033_CH14_P850-4.jpg)\n\n\
  拷贝构造函数的编写比析构函数更有挑战。在查看这项任务之前，我们必须强调每当我们提供析构函数时，提供拷贝构造函数的重要性。假设 `List` 没有拷贝构造函数，并假设客户端使用按值传递将一个类对象传递给函数。（记住，按值传递是将参数值的值的拷贝发送到函数。）在函数内部，形参数获得了调用者类对象的拷贝，包括指向列表的私有外部指针。此时，参数和形参数都指向同一个列表。当客户端函数返回时，形参数的类析构函数被调用，销毁了链表的唯一拷贝。函数返回后，调用者的链表就消失了！\n\
  \n通过提供拷贝构造函数，我们确保在每次发生按值传递时，参数到形参数的拷贝都是深拷贝。接所示拷贝构造函数的实现使用了一种创建新链表作为另一个拷贝的常用算法：我们设置新列表的外部指针并拷贝第一个节点。然后我们使用\
  \ `While` 循环遍历原始链表，拷贝每个节点并将拷贝链接到新列表中。\n\n![部分程序代码。](img/9781284166033_CH14_P851-1.jpg)\n\
  \   描述\n\n如果存在拷贝构造函数，默认的初始化方法（逐成员拷贝）就会跳过。相反，每当一个对象被另一个对象初始化时，就会调用拷贝构造函数。\n\n总结来说，当对象指向自由存储（free\
  \ store）上的动态数据时，默认的赋值和初始化可能是危险的。逐成员赋值和初始化只会拷贝指针，而不拷贝所指向的数据。如果一个类分配并释放动态数据，它几乎肯定需要以下系列成员函数来确保动态数据的深拷贝：\n\
  \n![一个代码片段。](img/9781284166033_CH14_P852-1.jpg)\n   描述\n\n## 14.6 排序链表\n\n正如我们在基于数组的列表实现看到的，无序列表和有序列表之间唯一的区别在于插入和删除操作。在链表实现中也是如此。\n\
  \n为了将组件插入到有序列表的正确位置，我们遍历节点，直到找到组件所属的位置。由于 `SortedList` 类按升序存储组件，我们可以通过找到找到包含大于插入值之值的节点来识别组件所属的位置。我们的新节点应该直接插入在具有该值的节点之前；因此，我们必须跟踪当前节点之前的节点。我们在删除操作中所做的那样，使用指针\
  \ `prevPtr` 指向此之前的节点。\n\n特殊情况有哪些？当列表为空时、要插入的值小于第一个时，以及要插入的值大于最后一个时。在进入循环之前检查列表是否为空。当循环退出时，有两种情况：如果当前指针为\
  \ `NULL`，则节点插入在末尾；否则，节点插入在尾指针和当前指针之间。这种方法得出了以下算法：\n![排序链表的算法。](img/9781284166033_CH14_P853-1.jpg)\n\
  \   描述\n\n以下函数实现了我们的算法：\n![代码片段。](img/9781284166033_CH14_P853-2.jpg)\n   描述\n![代码片段延续。](img/9781284166033_CH14_P854-1.jpg)\n\
