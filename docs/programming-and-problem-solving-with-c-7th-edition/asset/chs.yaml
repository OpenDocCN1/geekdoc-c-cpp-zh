  \n描述\n\n那么，根据 C++ 运算符优先级，`x` 不会被赋予 `y` 的值。相反，它被赋予 1 或 0（关系表达式 `y < z` 布尔结果强制转换的值）。\n\
  \n2. 如果你的程序增加了正整数的值，结果突然变成了负数，你应该怀疑是整数溢出。在大多数计算机上，给 `INT_MAX` 加 1 会得到 `INT_MIN`，这是一个负数。\n\
  \n3. 考虑使用枚举类型使你的程序更具可读性、易理解且易修改。\n4. 避免匿名数据。\n5. 给每个用户定义类型一个名称。\n6. 在引用 `struct`\
  \ 时指定成员。\n7. `struct` 必须以分号结束。\n8. 不要混淆指针与它所指向的变量。\n9. 在解引用指针之前，确保它已赋予除 `NULL` 外的有意义值。\n\
  10. 指针变量必须是相同类型才能进行比较。\n\n![森林中树的照片。](img/Chapter-opener.jpg) 开启：© Joost Lagerwij\n\
  \n# 11 数组\n\n数据结构在设计中很重要，因为它们决定了处理数据的算法。在 10 章中，我们看到记录（struct）让我们通过名称引用一组组件。\n\n\
  然而，在许多问题中，数据结构的组件非常多，无法为每个组件命名。例如，假设我们需要表示所有 50 个州的人口数据。如果我们使用 `struct`，就需要 100\
  \ 个不同的名称。然后我们需要编写 100 条输入语句和 100 条输出语句来读取和显示——这是一项极其乏味的任务！数组（C++ 支持的第三种结构数据类型）允许我们轻松执行此类操作。\n\
  \n## 11.1 一维数组\n\n如果我们输入 1000 个值并反向输出它们，可以编写如下形式的程序：\n\n![程序段。](img/9781284166033_CH11_P590-1.jpg)\n\
  \n描述\n\n这个程序超过了 300 行，使用了 1000 个变量。注意，除了附加的数字外，所有变量的名字都相同。如果我们把数字放入计数器并使用 For 循环从\
  \ 0 运行到 999，然后从 999 回到 0，这难道不是更方便吗？例如，如果计数器是 `number`，我们可以用以下四行代码替换原来的 2000 条输入/输出语句（下文突出处，我们将\
