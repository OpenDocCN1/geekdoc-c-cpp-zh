  \ Main Window 类中方法的延续。](img/9781284166033_CH17_p1133-1.jpg)\n\n描述\n\n### 测试与调试\n\
  \n使用 STL 的优势之一是它提供的类和算法已经经过了详尽测试。然而，很容易让这一事实带给你虚假的安全感。在这一章中，我们只触及了 STL 的亮点；还有许多我们未见过的特性。例如，许多操作和构造函数被其他版本重载了，或者具有默认参数。编写调用时出现的错误可能不会触发编译器错误，而是会调用一个你不熟悉的操作版本。如果你将大量使用\
  \ STL，那么获取 STL 的完整参考资料并花时间理解模板化函数和参数中有时晦涩的符号是非常重要的。\n\n在测试使用容器的程序时，我们必须注意一些特殊情况。显然，尝试对空容器进行操作以及超出容器边界都属于这些情况。还要注意迭代器在每一步中移动方向错误或跨度错误。在循环开始时从栈或队列中弹出第一个元素会导致等同于差一错误（off-by-one\
  \ error），因为容器的第一个元素永远没有被处理。注意你正在使用的每种容器相关的特殊属性和边界条件，并花时间设计测试以确保你的代码没有无意中违反这些条件。\n\
  \n### 测试调试提示\n\n1. 访问容器时，记住 `end` 和 `rend` 返回的值指向结构外部。\n2. 必须对迭代器进行解引用以获取它指向的值。\n\
  3. 声明迭代器时，记住它必须由其将指向的类型限定——例如，`list<string>::iterator`。\n4. 前向迭代器通过递增前进，通过递减后退。反向迭代器在递增时向后移动。\n\
  5. 每当容器的底层结构发生变化时，其迭代器就会失效。在插入或删除操作后访问无效迭代器会导致错误。\n6. 每当你从容器中删除元素时，确保检查了它是否为空。\n\
  7. 请记住并非所有算法都适用于所有容器。请仔细检查文档。\n8. 记住在弹出栈或队列的顶端元素之前先复制该元素。\n9. 选择一个具有你所需功能的容器。额外的能力通常会以性能为代价。\n\
  10. 许多容器要求用户定义的元素类型支持某些关系运算符的子集。确保你的类提供了这种支持。\n\n![书的第 18 章，标题为递归。背景图显示了森林中的树。](img/Chapter-opener.jpg)\n\
  \n章节开篇：© Joost Lagerweij/EyeEm/Getty Images.\n\n## 第 18 章：递归\n\n在 C++ 中，任何函数都可以调用另一个函数。函数甚至可以调用自己！当一个函数调用自己时，它正在进行**递归调用**。*recursive*\
  \ 一词的意思是“具有具有再次出现或重复的特征”。在这种情况下，函数调用由函数自身重复。递归是一种强大的技术，可以代替迭代（循环）。\n\n递归解决方案通常比解决相同问题的迭代解决方案效率低。然而，某些问题适合简单、优雅的递归解决方案，而用迭代法解决则极其繁琐。某些编程语言（如\
  \ Fortran 的早期版本、Basic 和 COBOL）不允许递归。其他语言特别面向递归算法——LISP 就是其中之一。C++ 让我们可以自行选择：我们可以同时实现迭代和递归算法。\n\
  \n我们的示例分为两组：仅使用简单变量的问题和使用结构化变量的问题。如果你在阅读关于第 11-16 章关于结构化数据类型的内容之前学习递归，请只涵盖第一组示例，其余部分留到完成结构化数据类型章节后再。\n\
  \n## 18.1 什么是递归？\n\n你可能见过一组相互嵌套的、色彩鲜艳的俄罗斯套娃。第一个套娃里面是一个较小的套娃，里面是一个更小的套娃，里面又是一个更小的套娃，以此此类推。递归算法就像这样的俄罗斯套娃。它通过越来越小的自身示例来复制自己，直到找到解决方案——也就是说，直到没有更多的套娃了。递归算法通过使用一个对自己进行递归调用的函数来实现。\n\
  \n在第 9 章中，我们写了一个名为 `Power` 的函数，用于计算整数的正幂结果。如果 `X` 是整数且 `N` 是正整数，则 `X^N` 的公式为：\n\n\
  ![X 的 N 次幂的公式。](img/9781284166033_CH17_p1132-1.jpg)\n\n递归算法通过使用一个对自己进行递归调用的函数来实现。（注：原文在此处存在大量重复文本，译文已根据逻辑进行了去重以保持流畅。）\n\
  \n\n\n\n让我们追踪这个递归函数的执行过程，假设 `number` 等于 2，`exponent` 等于 3。我们使用一种新格式来追踪递归程序：我们对调用进行编号，然后以段落的形式讨论发生的情况。\n\
  \n*   调用 1：`Power` 被 `main` 调用，`number` 等于 2，`exponent` 等于 3。在 `Power` 内部，参数 `x`\
  \ 和 `n` 分别初始化为 2 和 3。由于 `n` 不等于 1，递归地调用 `Power`，并将 `x` 和 `n - 1` 作为参数。调用 1 的执行暂停，直到该递归调用返回答案为止。\n\
  *   调用 2：`x` 等于 2，`n` 等于 2。由于 `n` 不等于 1，再次调用函数 `Power`，这次使用 `x` 和 `n - 1` 作为参数。调用\
  \ 2 的执行暂停，直到该递归调用返回答案为止。\n*   调用 3：`x` 等于 2，`n` 等于 1。由于 `n` 等于 1，将返回 `x` 的值。此函数调用已执行完毕，函数返回值（为\
  \ 2）被传回调用该函数的语句的位置。\n*   调用 2：现在此函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 3 的返回值（为 2）乘以\
  \ `x`。此函数调用已执行完毕，函数返回值（为 4）被传回调用该函数的语句的位置。\n*   调用 1：现在此函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用\
  \ 2 的返回值（为 4）乘以 `x`。此函数调用已执行完毕，函数返回值（为 8）被传回调用该函数的语句的位置。由于第一个调用（`main` 中的非递归调用）现在已完成，这就是函数\
  \ `Power` 的最终结果值。\n\n该追踪过程被总结在图 18.1 中。每个框代表对 `Power` 函数的一次调用。该调用的参数值显示在每个框中。\n\n\
  ![一个描述 2 的 3 次幂函数如何执行的图。](img/9781284166033_CH18_FIGF18-1.jpg)\n\n**图 18.1 Power(2,3)\
  \ 的执行**\n\n描述\n\n如果没有基准情况会发生什么？我们将得到“无限递归”，它是无限循环的递归等价形式。例如，如果条件\n\n![一个条件语句。](img/9781284166033_CH18_p1148-1.jpg)\n\
  \n描述\n\n被省略，`Power` 将被一次又一次地调用。如果调用 `Power` 时 `n` 小于或等于 0，也会发生无限递归。\n\n实际上，递归调用不能无限持续下去。原因如下：当函数被调用（无论是递归的还是非递归的）时，计算机系统为参数和函数的（自动）局部变量创建临时存储。这种临时存储是一个被称为`运行时栈`的内存区域。当函数返回时，其参数和局部变量将从运行时栈中释放。在无限递归的情况下，递归函数调用永远不会返回。函数每次调用自己，都会使用稍微更多的运行时栈来存储变量的新副本。\n\
  \n最终，栈上的所有内存空间都将用尽尽。在那个时刻，程序将崩溃并显示诸如“运行时栈溢出”的错误信息（或者计算机可能会挂起）。\n\n## 18.2 使用简单变量的递归算法\n\
  \n让我们来看另一个例子：计算阶乘。数字 `N` 的阶乘（写作 `N!`）是 `N` 乘以 `N - 1`、`N - 2`、`N - 3` 等。阶乘的另一种表达方式是\n\
  \n![一个计算数字阶乘的递归算法。](img/9781284166033_CH18_p1149-1.jpg)\n\n描述\n\n这个表达式看起来像是一个递归定义。`(N\
  \ - 1)!` 是 `N!` 的一个较小实例——也就是说，计算 `(N - 1)!` 所需的乘法比计算 `N!` 少一次。如果我们能找到基准情况，就可以编写递归算法。幸运的是，我们不需要找得太远：`0!`\
  \ 在数学中被定义为 1。\n\n![一个计算数字阶乘的递归算法。](img/9781284166033_CH18_p1149-2.jpg)\n\n描述\n\n\
  该算法可以直接代码如下：\n\n[计算数字阶乘的递归算法。]\n\n```c\nint factorial(int n) {\n    if (n == 0)\
  \ {\n        return 1;\n    } else {\n        return n * factorial(n - 1);\n   \
  \ }\n}\n```\n\n![阶乘函数的递归实现。](img/9781284166033_CH18_p1150-1.jpg)\n\n描述\n\n让我们追踪这个递归函数的执行，假设\
  \ `n` 等于 4。\n\n*   调用 1：`factorial` 被 `main` 调用，`n` 等于 4。在 `factorial` 内部，参数 `n`\
  \ 初始化为 4。由于 `n` 不等于 0，递归地调用 `factorial`，并将 `n - 1` 作为参数。调用 1 的执行暂停，直到该递归调用返回答案为止。\n\
  *   调用 2：`n` 等于 3。由于 `n` 不等于 0，再次调用函数 `factorial`，这次使用 `n - 1` 作为参数。调用 2 的执行暂停，直到该递归调用返回答案为止。\n\
  *   调用 3：`n` 等于 2。由于 `n` 不等于 0，再次调用函数 `factorial`，这次使用 `n - 1` 作为参数。调用 3 的执行暂停，直到该递归调用返回答案为止。\n\
  *   调用 4：`n` 等于 1。由于 `n` 不等于 0，再次调用函数 `factorial`，这次使用 `n - 1` 作为参数。调用 4 的执行暂停，直到该递归调用返回答案为止。\n\
  *   调用 5：`n` 等于 0。由于 `n` 等于 0，返回 1。此函数调用已执行完毕，函数返回值（为 1）被传回调用该函数的语句的位置。\n*   调用\
  \ 4：现在此函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 5 的返回值（为 1）乘以 `n`。此函数调用已执行完毕，函数返回值（为 1）被传回调用该函数的语句的位置。\n\
  *   调用 3：现在此函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 4 的返回值（为 1）乘以 `n`。此函数调用已执行完毕，函数返回值（为\
  \ 2）被传回调用该函数的语句的位置。\n*   调用 2：现在此函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 3 的返回值（为 2）乘以\
  \ `n`。此函数调用已执行完毕，函数返回值（为 6）被传回调用该函数的语句的位置。\n*   调用 1：现在此函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用\
  \ 2 的返回值（为 6）乘以 `n`。此函数调用已执行完毕，函数返回值（为 24）被传回调用该函数的语句的位置。由于第一个调用（`main` 中的非递归调用）现在已完成，这就是函数\
  \ `factorial` 的最终结果值。\n\n该追踪过程被总结在图 18.2 中，它总结了参数为 4 的 `factorial` 函数的执行过程。\n\n\
  ![一个描述 4 的阶如何执行的图。](img/9781284166033_CH18_FIGF18-2.jpg)\n\n**图 18.2 Factorial(4)\
  \ 的执行**\n\n描述\n\n让我们把这两个解决方案中所做的内容整理成一个编写递归算法的大纲：\n\n1.  理解问题。（我们特意加入了这一条；它始终是第一步。）\n\
  2.  确定基准情况（或）。\n3.  确定递归情况（或）。\n\n我们使用阶乘和幂算法来演示递归，因为它们很容易可视化。在实践中，人们永远不会想用递归解决方案来计算这两个函数之一。在两种情况下，迭代解决方案都更简单且高效得多，因为启动循环的新迭代比调用函数操作要快。让我们比较阶乘问题的迭代版本和递归版本的代码。\n\
  \n![阶乘函数的迭代解决方案。](img/9781284166033_CH18_p1151-1.jpg)\n\n描述\n\n\n\n\n![阶乘函数的递归解。](img/9781284166033_CH18_p1151-2.jpg)\n\
  \n描述\n\n迭代版本有两个局部变量，而递归版本没有。通常情况下，递归例程中的局部变量比迭代例程要少。此外，迭代版本始终包含循环，而递归版本始终包含一个选择语句——是\
  \ `If` 或 `Switch`。分支结构是递归例程中主要的控制结构。循环结构是迭代例程中主要的控制结构。\n\n在下一节中，我们将研究一个更复杂的问题——一个递归解决方案并非显而易见的问题。\n\
  \n## 18.3 汉诺塔\n\n你最早拥有的玩具之一可能是三个带有不同直径彩色圆圈的柱子。如果是这样，你可能花费了无数小时将圆圈从一个柱子移动到另一个。如果我们对圆圈或圆盘的移动方式增加一些限制，就有了一种名为“汉诺塔”的成人游戏。游戏开始时，所有的圆圈都按大小顺序排列在第一个柱子上，最小的在最上方。游戏的目标是一个接次将圆圈移动到第三个柱子。之处在于，不能将一个圆圈放在直径比它小的圆圈之上。中间的柱子可以作为辅助柱，但它在游戏开始和结束时必须是空的。\n\
  \n为了感受一下如何实现这一点，让我们看看如果存在解决方案，在某些特定点配置必须是种种样的草图。我们使用四个圆圈或圆盘。这里是初始配置：\n\n![汉诺塔游戏的初始配置。](img/9781284166033_CH18_p1152-1.jpg)\n\
  \n描述\n\n要将最大的圆圈（圆圈 4）移动到柱子 3，我们必须将三个较小的圆圈移动到柱子 2。然后圆圈 4 就可以移动到它的最终位置：\n\n![汉诺塔游戏所需的第一步。](img/9781284166033_CH18_p1152-2.jpg)\n\
  \n描述\n\n假设我们可以这样做。现在，为了将下一个最大的圆圈（圆圈 3）移到位，我们必须将它上方的两个圆圈移动到辅助柱（在这种情况下是柱子 1）：\n\n\
  ![汉诺塔游戏的下一步。](img/9781284166033_CH18_p1152-3.jpg)\n\n描述\n\n为了让圆圈 2 到位，我们必须将圆圈 1\
  \ 移动到另一个柱子，释放圆圈 2 以便将其移动到柱子 3 上的位置：\n\n![汉诺塔游戏的下一步。](img/9781284166033_CH18_p1153-1.jpg)\n\
  \n描述\n\n最后一个圆圈（圆圈 1）现在可以移动到它的最终位置，我们已经完成了：\n\n![汉诺塔游戏的最后一步。](img/9781284166033_CH18_p1153-2.jpg)\n\
  \n描述\n\n注意，为了释放圆圈 4，我们必须将三个圆圈移动到另一个柱子。为了释放圆圈 3，我们需要将两个圆圈移动到另一个柱子。为了释放圆圈 2，我们需要将一个圆圈移动到另一个柱子。这听起来像是一个递归算法：为了释放第\
  \ `n` 个圆圈，我们必须移动 `n - 1` 个圆圈。每个阶段都可以看作是从三个柱子重新，但每次少一个圆圈。让我们看看是否可以使用 `n` 代替具体的数字来总结这个过程。\n\
  \n### 将 *n* 个圆圈从柱子 1 移动到柱子 3\n\n1. 将 `n–1` 个圆圈从柱子 1 移动到柱子 2\n2. 将第 `n` 个圆圈从柱子 1\
  \ 移动到柱子 3\n3. 将 `n–1` 个圆圈从柱子 2 移动到柱子 3\n\n这个算法听起来确实简单；肯定还有更多内容。但这确实就是全部了。\n\n让我们写一个实现该算法的递归函数。当然，我们实际上无法移动圆盘，但我们可以显示一条消息来这样做。注意，起始柱子、结束柱子和辅助柱在算法过程中不断变化。为了让算法更容易理解，我们将柱子称为\
  \ `beginPeg`、`endPeg` 和 `auxPeg`。这三个柱子加上起始柱子上的圆圈数量，就是该函数的参数。\n\n我们有递归情况（或一般情况），但基础情况（base\
  \ case）呢？我们如何知道何时停止递归过程？线索就在“移动 *n* 个圆圈”的语句中。如果我们没有圆圈需要移动，我们就完成了该阶段。因此，当圆圈数量为 0\
  \ 时，我们什么都不做（也就是说，直接返回）。\n\n![汉诺塔过程概述。](img/9781284166033_CH18_p1153-3.jpg)\n\n描述\n\
  \n很难相信如此简单的算法有效，但我们将向你证明。下面是一个调用 `DoTowers` 函数的驱动程序。添加了输出语句，以便你可以看到每次递归调用参数的值。由于函数内部有两个递归调用，我们已经指出了是哪个递归语句发出的调用。\n\
  \n![汉诺塔程序。](img/9781284166033_CH18_p1154-2.jpg)\n![汉诺塔程序。](img/9781284166033_CH18_p1154-2.jpg)\n\
  \n\n\n\n以下是函数调用的代码流程详解\n\n![程序中用于打印包含 n 个元素的一维数组内容的代码。](img/9781284166033_CH18_p1157-2.jpg)\n\
  \n描述\n\n使用图中的数组：\n\n![一个数组。](img/9781284166033_CH18_p1157-3.jpg)\n\n描述\n\n调用 1：`first`\
  \ 为 0，`last` 为 4。因为 `first` 小于 `last`，所以输出 `data[first]` 中的值（为 23）。在输出从 `first +\
  \ 1` 到 `last` 的数组时，该调用执行暂停。\n\n调用 2：`first` 为 1，`last` 为 4。因为 `first` 小于 `last`，所以输出\
  \ `data[first]` 中的值（为 44）。在输出从 `first + 1` 到 `last` 的数组时，该调用执行暂停。\n\n调用 3：`first`\
  \ 为 2，`last` 为 4。因为 `first` 小于 `last`，所以输出 `data[first]` 中的值（为 52）。在输出从 `first +\
  \ 1` 到 `last` 的数组时，该调用执行暂停。\n\n调用 4：`first` 为 3，`last` 为 4。因为 `first` 小于 `last`，所以输出\
  \ `data[first]` 中的值（为 61）。在输出从 `first + 1` 到 `last` 的数组时，该调用执行暂停。\n\n调用 5：`first`\
  \ 为 4，`last` 为 4。因为 `first` 等于 `last`，所以输出 `data[first]` 中的值（为 77）。在输出从 `first +\
  \ 1` 到 `last` 的数组时，该调用执行暂停。\n\n调用 6：`first` 为 5，`last` 为 4。因为 `first` 大于 `last`，该调用执行完成。控制返回到上一次调用。\n\
  \n调用 5：该调用执行完成。控制返回到上一次调用。\n\n调用 4、3、2 和 1：每次执行依次完成，控制返回到上一次调用。\n\n注意，一旦到达最深层的调用（编号最大的调用），在此之前的每个调用都会在不执行任何操作的情况下返回。当从递归调用函数返回后没有后续语句被执行时，这种递归被称为**尾递归**。尾递归通常表明该问题可以通过迭代更更容易地解决。我们使用数组示例是因为它让递归过程易于可视化；在实践中，应该通过迭代来输出数组。\n\
  \n**图 18.3**显示了 `Print` 函数的执行情况，以及每次调用的参数值。注意，数组随着每次递归调用都会缩小（从 `data[first]` 到 `data[last]`）。如果我们想以递归的方式反序输出数组元素，只需交换\
  \ If 语句中的两个语句即可。\n\n![描绘了带有参数 data, 0 和 4 的函数 Print 如何执行的图。](img/9781284166033_CH18_FIGF18-3.jpg)\n\
  \n描述\n\n**图 18.3 Print(data, 0, 4) 的执行**\n\n## 18.5 使用指针变量进行递归\n\n输出一维数组的递归算法可以通过迭代更简单地实现。现在我们来看两种无法通过迭代更简单处理的算法：反序打印链表和创建链表的重复副本。我们将指向链表的外部指针称为\
  \ `listPtr`。\n\n### 反序打印动态链表\n\n![显示链表中各个元素的图。](img/9781284166033_CH18_p1164-1.jpg)\n\
  \n描述\n\n按从第一个到最后一个顺序打印链表很容易。我们设置一个运行指针 `ptr` 等于 `listPtr`，并遍历链表直到 `ptr` 变为 `NULL`。\n\
  \n![按从第一个到最后一个顺序打印链表的算法步骤。](img/9781284166033_CH18_p1164-2.jpg)\n\n描述\n\n要要反序输出链表，我们必须先输出最后一个节点的值，然后是倒数第二个节点的值，以此此类推。另一种方法是\n\
  \n\n\n在处理链表时，我们有时需要创建链表的克隆副本（有时被称为 `clone`）。例如，在第 14 章中，我们为 `List` 类编写了一个拷贝构造函数。该拷贝构造函数创建一个新的类对象，它是另一个类对象的副本，包括它的动态链表。\n\
  \n假设我们想写一个返回值的函数，该函数接收链表的外部指针（`listPtr`），制作链表的克隆，并将新链表的外部指针作为函数的返回值返回。该函数的一个典型调用如下：\n\
  \n![一个复制链表的函数调用。](img/9781284166033_CH18_p1166-1.jpg)\n\n描述\n\n使用迭代来复制链表相当复杂。以下算法与\
  \ `List` 拷贝构造函数使用的算法本质相同。\n\n![程序代码。](img/9781284166033_CH18_p1167-1.jpg)\n\n描述\n\
  \n解决此问题的递归方法要简单得多，但它要求我们递归地思考。为了复制原表的第一个节点，我们可以分配一个新的动态节点，并将原始节点中的 `component` 值复制到新节点中。然而，我们还无法填充新节点的\
  \ `link` 成员：我们必须等待复制完第二个节点，这样就可以将它的地址存储到第一个节点的 `link` 成员中。同样，在完成复制第三个节点之前，第二个节点的复制也无法完成。最后，我们复制原表的最后一个节点，并将克隆节点的\
  \ `link` 成员设置为 `NULL`。此时，最后一个节点将它自己的地址返回给倒数第二个节点，倒数第二个节点将该地址存储到其 `link` 成员中。倒数第二个节点将自己的地址返回给它之前的节点节点，依此类推。当第一个节点将其地址返回给第一个（非递归）调用时，整个过程完成，产生一个指向新链表的外部指针。\n\
  \n![程序代码。](img/9781284166033_CH18_p1167-2.jpg)\n\n描述\n\n就像汉诺问题的解决方案一样，这种方案看起来太简单了——但它是完整的算法。由于传递给每个递归调用的参数是\
  \ `fromPtr->link`，原表中剩余的节点数会随着每次调用而减少。当指向原表的指针变为 `NULL` 时，发生基本情况。以下是实现该算法的 C++ 函数。\n\
  \n![程序代码。](img/9781284166033_CH18_p1168-1.jpg)\n\n描述\n\n让我们对函数调用进行代码走读：\n\n![包含函数调用的代码。](img/9781284166033_CH18_p1168-2.jpg)\n\
  \n描述\n\n使用以下列表：\n\n![描述一个将在程序中使用的链表的图。](img/9781284166033_CH18_p1168-3.jpg)\n\n\
  描述\n\n调用 1：`fromPtr` 指向包含 49 的节点且不是 `NULL`。分配了一个新节点，并将其 `component` 值设置为 49。\n\n\
  ![显示指向指针和元素的图。](img/9781284166033_CH18_p1168-4.jpg)\n\n描述\n\n此调用暂停，直到参数为 `fromPtr->link`\
  \ 的递归调用完成。\n\n调用 2：`fromPtr` 指向包含 50 的节点且不是 `NULL`。分配了一个新节点，并将其 `component` 值设置为\
  \ 50。\n\n![显示函数调用 2 发生情况的图。](img/9781284166033_CH18_p1169-1.jpg)\n\n描述\n\n此调用暂停，直到参数为\
  \ `fromPtr->link` 的递归调用完成。\n\n调用 3：`fromPtr` 指向包含 58 的节点且不是 `NULL`。分配了一个新节点，并将其\
  \ `component` 值设置为 50。\n\n\n\n\n考虑本章之前讨论的阶乘和幂算法。在这两种情况下，迭代的解决方案都是显而易见且易于设计的。我们对这些问题强加了递归解决方案，仅仅是为了演示递归是如何工作的。根据经验之则，如果迭代解决方案更直观或更易理解，就请使用它；它的效率会更高。在某些其他问题中，递归解决方案更直观或更易设计，例如汉诺塔问题。（事实证明，使用迭代来解决汉诺塔问题异常地困难。）计算机科学专业的学生应该意识到递归的力量。如果问题的定义本质上是递归的，那么理应考虑递归解决方案。\n\
  \n### 测试与调试\n\n当正确使用时，递归是一项强大的技术。然而，如果使用不当，递归会导致难以诊断的错误。调试递归算法的最佳方法是从一开始就正确地构建它。为了实际起见，我们在发生错误时提供了一些查找方向的提示。\n\
  \n### 测试与调试提示\n\n1. 确保存在基准情况（base case）。如果没有基准情况，算法将继续发出递归调用，直到耗尽所有内存。每次调用函数（无论是递归还是非递归），都会为参数和自动局部变量分配栈空间。如果没有基准情况来结束递归调用，运行时栈最终溢出。类似“Stack\
  \ overflow”（栈溢出）的错误消息表示缺少基准情况。\n\n2. 确保你没有使用 `While` 结构。递归算法的基本结构是 `If` 语句。必须有两种情况：递归情况和基准情况。如果基准情况什么都不做，则省略\
  \ `else` 分句。然而，选择结构必须存在。如果在递归算法中使用 `While` 语句，则 `While` 语句通常不应包含递归调用。\n\n3. 与非递归函数一样，除非你有理由这么做，否则不要在递归函数内部直接引用全局变量。\n\
  \n4. 与问题大小相关的参数必须是值参数（value parameters），而不是引用参数（reference parameters）。与问题大小相关的参数通常是表达式。任意表达式只能传递给值参数。\n\
  \n5. 使用系统的调试器程序（或使用调试输出语句）来跟踪一系列递归调用。检查参数和局部变量的值通常有助于定位递归算法中的错误位置。\n\n![一张森林中树的照片。](img/Chapter-opener.jpg)\n\
