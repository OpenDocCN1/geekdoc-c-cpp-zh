  \ GUI 程序。](img/9781284166033_CH06_352.jpg)\n\n描述\n\n### 测试与调试\n\n### 循环测试策略\n\n\
  即使循环已经经过妥当的设计和验证，对其进行严格测试仍然非常重要：错误在实现过程中可能会出现。由于循环允许我们在单次运行中输入许多数据集，而且每次迭代都可能受到之前迭代的影响，因此循环程序的测试数据通常更加详尽。为了彻底测试循环，我们必须检查单次迭代和多次迭代的执行是否正确。\n\
  \n记住，循环包含七部分（对应我们检查清单中的七个问题）。测试策略必须测试每个部分。虽然并不是每个循环都单独实现这七个部分，但检查清单提醒我们，某些循环操作具有多个用途，每个用途都应该被测试。例如，计数控制循环中的递增语句可能同时更新处理过程和终止条件，因此，验证它相对于循环的其他部分是否都正确地执行了这两个操作是至关重要的。\n\
  \n为了测试循环，我们尝试设计一些数据集，使其可能导致变量超出范围，或使文件处于不当状态，从而违反循环后置条件（即循环退出后必须为真的断言）或循环不变性。\n\n\
  ### 涉及循环的测试计划\n\n在第 5 章中，我们引入了正式的测试计划并讨论了分支测试。这些指南适用于带有循环的程序，但在这里我们提供了一些针对循环的额外指南。\n\
  \n遗憾的是，当循环嵌入较大的程序中时，仅通过测试数据和输出很难控制和观察循环执行的条件。在某些情况下，我们必须使用间接测试。例如，如果循环从文件中读取浮点值并输出它们的平均值，而不回显打印它们，你就无法直接判断循环是否处理了所有数据。你必须构造输入文件，使得平均值成为一个只有通过处理所有数据才能得到的唯一值。为了简化对这类循环的测试，我们希望在每次迭代开始时观察与循环相关的变量的值。在程序运行时，我们如何观察变量的值？两种常用技术是使用系统的*调试器*程序以及包含仅用于调试目的的额外输出语句。\n\
  \n\n\n\n[content]\n当循环受计数器控制时，你应该包含一个测试用例，指定所有迭代的输出结果。在测试计划中增加额外的一列来列出迭代次数可能会有所帮助。如果循环读取数据并输出结果，那么每个输入值都应该产生不同的输出，以便更容易发现错误。例如，在一个预期读取读取并显示\
  \ 100 个数据值的循环中，当数值为 `1, 2, 3, . . . , 100` 时，比当所有数值都相同时更容易判断循环是否执行了正确次数的迭代。\n\n\
  如果程序输入循环的迭代计数，你需要测试以下情况：输入无效计数（例如负数，此时应输出错误信息并跳过循环）、输入计数为 `0`（循环应被跳过）、输入计数为 `1`（循环应执行一次）以及输入一个典型的迭代次数（循环应执行指定的次数）。\n\
  \n### 事件控制循环\n\n在事件控制循环中，你应该测试事件在循环开始之前、第一次迭代中以及典型迭代次数内发生的情况。例如，如果事件是发生 `EOF`，则尝试测试由空文件、包含一个数据集的文件以及另一个包含多个数据集的文件组成的测试数据。如果你的测试涉及从测试文件中读取，你应该将文件的副本附在测试计划中，并以某种方式标识每个文件，以便计划能够引用它们。这对于在测试计划的“输入”和“预期输出”列中标识每次迭代的开始位置也有帮助。\n\
  \n当事件是输入哨兵值时，你需要以下测试用例：哨兵是唯一的数据集、哨兵跟随数据集、哨兵跟随典型数量的数据集。对于文件输入，你还应该尝试文件省略哨兵值的情况。鉴于哨兵控制的循环涉及预读（priming\
  \ read），验证第一个和最后一个数据集被正确处理变得尤为重要。\n\n### 测试与调试提示\n\n1. 仔细规划你的测试数据，以测试程序的所有部分。\n\
  2. 注意无限循环，即 `While` 语句中的表达式永远不会变为 `false`。症状是：程序没有停止。\n\n如果你创建了无限循环，请检查你的逻辑和循环的语法。确保\
  \ `While` 条件的右括号后面没有紧跟一个分号：\n\n![while 循环的错误用法。](img/9781284166033_CH06_354.jpg)\n\
  Description\n\n这个分号在大多数情况下会导致无限循环；对于编译器来说，循环体是一个空语句。在计数控制的循环中，确保循环控制变量在循环内部递增。在标志控制的循环中，确保标志最终会改变。\n\
  \n一如既常，注意 While 条件以及 If 条件中 `=` 与 `==` 的问题。下面这一行代码：\n\n![while 循环的错误用法。](img/9781284166033_CH06_354a.jpg)\n\
  \nDescription\n\n会产生无限循环。赋值表达式（而非关系表达式）的值始终为 `5`，它被解释为 `true`。\n\n3. 仔细检查循环终止条件，并确保循环中的某些内容会导致该条件的满足。密切关注导致迭代多执行一次或少执行一次的值（即“差一错误”综合征）。\n\
  4. 在由检测换行符控制的循环中，记住使用 `get` 函数而不是 `>>` 运算符。\n5. 执行算法走演，以验证所有适当的先条件和后条件是否出现在正确的位置。\n\
  6. 通过代码走演手动跟踪循环的执行。非常仔细地模拟前几次和后几次通过，观察循环的真实行为。\n7. 如果你的系统提供 `debugger`，请使用它。调试器是一个以“慢动作”运行你程序的程序，允许你每次执行一条指令并在变量变化时检查其内容。如果你还没有这样做，请检查系统中是否有可调试器。\n\
  8. 如果其他方法都失败了，使用`调试输出语句`——插入程序以帮助调试的输出语句。它们输出指示程序执行流的消息或报告程序中某些点变量的值。\n\n例如，如果你想知道程序中某一点变量\
  \ `beta` 的值，可以插入这条语句：\n\n![输出语句。](img/9781284166033_CH06_355.jpg)\nDescription\n\
  \n如果此输出语句出现在循环中，你得到的 `beta` 输出值将与循环体迭代的次数相同。\n\n调试完程序后，你可以移除调试输出语句，或者直接在它们前面加上 `//`\
  \ 以便它们被视为注释。（这种做法被称为注释掉一段代码。）如果你以后需要再次使用这些语句，可以删除双斜杠。\n\n## 附加控制结构\n\n在某些情况下，实现控制结构的方法不止一种。例如，选择可以通过\
  \ `If-Then` 完成。C++ 提供了 `If-Then-Else` 来实现选择，因为双分支很常见。本章引入了五个新语句，增加了便利性。其中 `Switch`\
  \ 语句简化了多路分支。两个新的循环语句 `For` 和 `Do-While` 使某些循环更容易。最后两个 `Break` 和 `Continue` 与循环和选择一起使用。\n\
  \n### 7.1 Switch 语句\n\n`Switch` 语句允许我们轻松编写多路分支，类似于嵌套的 `If` 语句。`switch 表达式`的值决定了执行哪个分支。例如，查看以下语句：\n\
  \n![示例语句。](img/9781284166033_CH07_368.jpg)\nDescription\n\n在此示例中，`letter` 是 switch\
  \ 表达式。语句意思是：“如果 `letter` 为 'X'，执行 Statement1，跳出 Switch 语句并继续 Statement5。如果 `letter`\
  \ 为 'L' 或 'M'，执行 Statement2 并跳到 Statement5。如果 `letter` 为 'S'，执行 Statement3 并进入 Statement5。如果\
  \ `letter` 不是上述任何字符，执行 Statement4 并退出 Statement5。” `Break` 语句会导致立即退出 Switch 语句。稍后我们将看到省略\
  \ `Break` 语句会发生什么。\n\n`Switch` 语句的模板为\n\n```\n![SwitchStatement](img/9781284166033_CH07_368a.jpg)\n\
  ```\n\n`IntegralOrEnumExpression` 是整型（`char`、`short`、`int`、`long`、`bool`）或枚举类型的表达式。（我们在第\
  \ 10 章讨论枚举。）可选的 `SwitchLabel` 是 `case` 标签或 `default` 标签：\n\n```\n![SwitchLabel](img/9781284166033_CH07_369h.jpg)\n\
  ```\n\n在 `case` 标签中，`ConstantExpression` 是整型或枚举表达式，其操作数必须是字面量或命名常量，以便编译器能在编译时计算分支标签的值。以下是常量整型表达式的示例（其中\
  \ `CLASS_SIZE` 是 `int` 类型的命名常量）：\n\n```\n![常量整型表达式的示例。](img/9781284166033_CH07_369.jpg)\n\
  ```\n\n\n\n`ConstantExpression` 的数据类型在必要时会被强制转换，以匹配 switch 表达式的类型。\n\n在我们测试 `letter`\
  \ 值的开头示例中，case 标签（case labels）具有如下的形式：\n\n![case 标签示例。](img/9781284166033_CH07_369a.jpg)\n\
  \n如该示例所示，一个语句可以跟在多个 case 标签之后。在给定的 `Switch` 语句中，每个 case 值只能出现一次。如果一个值出现多次，则为语法错误。此外，一个\
  \ `Switch` 语句中只能有一个 `default` 标签。\n\n通过 `Switch` 语句的控制流如下：首先，求值 switch 表达式。如果该值匹配\
  \ case 标签中的某一个值，控制将分支跳转到该 case 标签后的语句。从那里开始，控制将顺序执行，直到遇到 `Break` 语句或 `Switch` 语句的结束。如果\
  \ switch 表达式的值不匹配任何 case 值，则会发生两种情况之一：如果存在 `default` 标签，控制将跳转到其后的语句；如果没有 `default`\
  \ 标签，则 `Switch` 内部的所有语句都被跳过，控制跳转到整个 `Switch` 语句之后的语句。\n\n下面的 `Switch` 语句根据学生的成绩（`grade`\
  \ 类型为 `char`）输出相应的注释：\n\n![部分程序代码。](img/9781284166033_CH07_369b.jpg)\n\n![部分程序代码。](img/9781284166033_CH07_370.jpg)\n\
  \n注意，最后的 `Break` 语句是不必须的。程序员通常仍会包含它，因为如果末尾已经存在一个 `Break` 语句，在末尾插入另一个 case 标签会更方便。\n\
  \n如果 `grade` 不包含 'A'、'B'、'C'、'D' 或 'F'，则 `Switch` 中的任何语句都不会执行。除非 `Switch` 语句的前置条件说明\
  \ `grade` 总是包含这些字母之一，否则它应该包含一个 `default` 分支：\n\n![switch 语句示例。](img/9781284166033_CH07_370a.jpg)\n\
  \n每个 case 后面都有一个 `Break` 的 `Switch` 语句的行为与 `If-Then-Else-If` 结构完全相同。我们的 `Switch`\
  \ 语句等于以下代码：\n\n![部分程序代码。](img/9781284166033_CH07_370b.jpg)\n\n这两种方法是否有优劣？对于这个特定的示例，`Switch`\
  \ 更容易理解。但如果一个多路分支包含值的范围，将所有值都列为 case 标签可能会非常繁琐。在编写多路分支之前，考虑两种方案的形式分别如何，并选择最易于理解的一种。请记住，C++\
  \ 提供 `Switch` 是为了方便，它并不总是每个多路分支的最佳选择。\n\n最后，我们说过将看看如果省略 `Break` 语句会发生什么。这里是不带 `Break`\
  \ 的字母等级代码：\n\n![switch 语句示例。](img/9781284166033_CH07_371.jpg)\n\n如果 `grade` 恰好是\
  \ ‘H’，控制分支到 `default` 标签处的语句，输出为：\n\n![示例输出。第 1 行：uppercase h 不是有效的成绩。](img/9781284166033_CH07_371a.jpg)\n\
  \n遗憾的是，这是唯一有效的分支。如果 `grade` 是 'A'，输出为：\n\n![示例输出。第 1 行：Good Work Poor Work A 不是有效的成绩。](img/9781284166033_CH07_371b.jpg)\n\
  \n记住——在一个分支进入特定 case 后，控制将顺序执行，直到遇到 `Break` 或 `Switch` 的结束。在 case 中遗漏 `Break` 是\
  \ C++ 程序中常见的错误源之一。在第 5 章中，我们看到一个根据温度和是否下雨显示不同消息的程序。这里是使用 `Switch` 而非 `If` 语句的相同程序。\n\
  \n![显示不同温度对应消息程序代码的前部分。](img/9781284166033_CH07_371c.jpg)\n\n![显示不同温度对应消息程序代码的后部分。](img/9781284166033_CH07_372.jpg)\n\
  \n当此程序运行四次时，它产生如下输出。只要用户对下雨输入 1 或 0，它与另一个程序在功能上就是等价的。你能看出如果不这样做会有什么不同吗？\n\n![显示不同温度对应消息的程序输出。](img/9781284166033_CH07_372a.jpg)\n\
  \n![显示不同温度对应消息程序的输出输出。](img/9781284166033_CH07_373.jpg)\n\n## 7.2 Do-While 语句\n\n\
  `Do-While` 语句是一种循环控制结构，循环条件在末尾（底部）进行测试。这样做保证了循环体至少执行一次。这里是 `Do-While` 的语法：\n\n```\n\
  do Statement while ( Expression );\n```\n\n![DoWhile](img/9781284166033_CH07_375.jpg)\n\
  \n通常情况下，`Statement` 是单个语句或一个块。另外注意 `Do-While` 以分号结尾。\n\n![while 语句的语法。](img/9781284166033_CH07_375a.jpg)\n\
  \n意味着“执行 `do` 和 `while` 之间的语句，只要 `Expression` 在循环结束时为 `true`。”\n\n让我们比较 `While`\
  \ 循环和 `Do-While` 循环，它们执行相同的任务：查找文件中的第一个点。假设文件中至少有一个点。\n\n![两个程序代码。第一个程序代码列出了 while\
  \ 解决方案，第二个程序代码列出了 do while 解决方案。](img/9781284166033_CH07_375b.jpg)\n\n`While` 解决方案需要预读，以便\
  \ `inputChar` 在进入循环前有值。`Do-While` 则不需要，因为输入语句在评估条件之前执行。\n\n让我们看另一个例子。假设程序需要交互式地读取人的年龄。程序要求年龄为正数。以下循环在程序继续之前确保输入值为正数。\n\
  \n![程序代码列出了 while 解决方案的前部分。](img/9781284166033_CH07_375c.jpg)\n\n![程序代码的后部分。](img/9781284166033_CH07_376.jpg)\n\
  \n### Do-While 解决方案\n\n![while 解决方案的后续是 do while 解决方案。](img/9781284166033_CH07_376a.jpg)\n\
  \n注意在 `Do-While` 解决方案中，提示和输入步骤只出现一次——但它必须测试两次输入值。\n\n我们也可以用 `Do-While` 实现计数控制循环，如果我们知道循环体应该至少执行一次。以下是求从\
  \ 1 到 `n` 整数和的两个版本。\n\n![while 解决方案和 do while 解决方案的代码。](img/9781284166033_CH07_376b.jpg)\n\
  \n如果 `n` 是正数，两个版本都是等价的。但如果 `n` 是 0 或负数，循环产生的结果不同。在 `While` 版本中，`sum` 的最终值为 0，因为循环体被跳过了。在\
  \ `Do-While` 版本中，`sum` 的最终值为 1，因为循环体执行了一次后退出。\n\n\n\n由于 `While` 语句在执行循环体之前测试条件，因此它被称为预测试循环。`Do-While`\
  \ 语句则相反，因此被称为后测试循环。`FIGURE 7.1` 比较了 `While` 循环和 `Do-While` 循环的控制流。\n\n![while 和\
  \ do while 语句的流程图。(images/9781284166033_CH07_FIGF01.jpg)\n\n图 7.1 While 和 Do-While\
  \ 循环\n\n[Description]\n\n这里是一个程序，它将活动消息代码封装在一个 `Do-While` 语句中：\n\n![根据给定温度输出适当活动的程序代码。(images/9781284166033_CH07_377a.jpg)\n\
  \n[Description]\n\n![根据给定温度输出适当活动的程序代码延续。(images/9781284166033_CH07_378.jpg)\n\n\
  [Description]\n\n这是该程序的示例运行结果：\n\n![显示给定温度下适当活动的程序输出。(images/9781284166033_CH07_378a.jpg)\n\
  \n[Description]\n\n你可能会奇怪为什么我们想要重复这个特定的过程，因为天气并不经常变化。上面的内容是一个测试平台架（或驱动程序）的示例——这是一个非常简单的程序，它封装了一个模块，以便我们可以直接输入一系列测试数据值。在许多情况下，一个模块的实现可能被放置在复杂程序的深处，那里很难进行彻底测试。通过将其单独封装在测试驱动程序中，我们获得了对其运行环境的完全控制，并可以直接提供模块的输入并检查其输出以确保其正确性。一旦测试完成，代码就可以移植到真实程序中的最终位置，在那里我们可以有信它它运行正常。\n\
  \n## 7.3 For 语句\n\n`For` 语句的设计旨在简化计数循环的编写。以下语句输出从 1 到 `n` 的整数：\n\n![一个 for 循环示例。(images/9781284166033_CH07_379a.jpg)\n\
  \n[Description]\n\n这个 `For` 语句的意思是：“将循环控制变量 `count` 初始化为 1。当 `count` 小于或等于 `n` 时，执行输出语句并将\
  \ `count` 增 1。当 `count` 增加到 `n + 1` 后停止循环。”\n\n在 C++ 中，`For` 语句仅仅是 `While` 循环的紧凑表示。事实上，编译器本质上是将\
  \ `For` 语句翻译为相应的 `While` 循环，如下：\n\n![将 for 循环转换为相应的 while 循环。(images/9781284166033_CH07_379b.jpg)\n\
  \n[Description]\n\nFor 语句的语法模板所示：\n\n![ForStatement for (InitStatement Expression1\
  \ ; Expression2 ) Statement](img/9781284166033_CH07_380.jpg)\n\n为什么语法模板没有在 `InitStatement`\
  \ 和 `Expression1` 之间显示分号，正如上一个例子所示？因为 `InitStatement` 总是以它自己的分号结束。`InitStatement`\
  \ 可以是以下任何一种：空语句（仅一个分号）、声明语句（以分号结尾）或表达式语句（以分号结尾的表达式）。这就是为什么 `Expression1` 之前总是会出现分号。`Expression1`\
  \ 是退出条件。`Expression2` 在每次循环迭代结束时求值。\n\n`For` 语句通常写成由 `InitStatement` 初始化循环控制变量，而\
  \ `Expression2` 增加或减少该变量。这里是两个执行相同次数（50 次）的循环：\n\n![两个 for 循环。(images/9781284166033_CH07_380a.jpg)\n\
  \n[Description]\n\n就像 `While` 循环一样，`Do-While` 和 `For` 循环也可以嵌套。例如，这个嵌套的 `For` 结构\n\
  \n![嵌套的 for 循环。(images/9781284166033_CH07_380b.jpg)\n\n[Description]\n\n显示以下数字三角形：\n\
  \n![显示数字三角形的程序输出。(images/9781284166033_CH07_380c.jpg)\n\n[Description]\n\n虽然 `For`\
  \ 语句主要用于计数循环，但 C++ 允许你将任何 `While` 循环写成 `For` 语句。要智能地使用 `For` 循环，你需要了解以下事实：\n\n1.\
  \ 在语法模板中，`Expression1` 是可选。如果你省略了它，则假设表达式为真。\n2. 根据语法模板，`InitStatement` 可以是空语句。\n\
  3. `Expression2` 是可选的。\n\n[Description]\n\n由于所有工作都在 `For` 头部完成，循环体无事可做因此它是空语句。\n\
  \n对于 `For` 语句，我们的建议是保持简单。代码越复杂，越难理解和调试。在本文中，我们仅将 `For` 循环用于计数循环。\n\n以下程序包含一个 `For`\
  \ 和一个 `Switch`。它分析输入的前 100 个字符，并报告其中字母、句号、问号和感叹号的数量。对于第一类（字母），我们使用库函数 `isalpha`，如果其参数是字母，该函数返回\
  \ `true`，否则返回 `false`。\n\n![统计前 100 个输入字符中字母、句号、问号和感叹号数量的程序。(images/9781284166033_CH07_382.jpg)\n\
  \n[Description]\n\n\n\n这里的总数看起来很奇怪：它们加起来只有 85 个字符。另外 15 个字符在哪里呢？嗯，数字没有计入总数中，所以结果是\
  \ 94。但这仍然留有 6 个无法解释。仔细检查数据后发现，读取在第七行的中间就结束了。啊！输入中前 6 行的换行符占据了其他缺失的字符！\n\n现在我们看到代码实际上是正确的——只是我们对结果的预期有误。如你所见，有时测试计划中的预期输出并没有考虑到所有因素。测试并不总是单向的，即我们预先拥有所有答案并仅仅简单地验证代码。在某些情况下，我们发现测试计划中存在错误，反而需要修复它。\n\
  \n## 7.4 Break 和 Continue 语句\n\n我们在 `Switch` 中引入的 `Break` 语句也可以用于循环。`Break` 语句会导致程序立即退出它所在的最内层\
  \ `Switch`、`While`、`Do-While` 或 `For` 循环。注意*最内层*这个词。如果 `break` 在嵌套在另一个循环中的循环中，控制将退出内层循环而\
  \ own 退出外层循环。\n\n在循环中使用 `break` 的一种方法是设置一个无限循环并使用 `If` 测试来退出循环。假设我们要输入 10 对整数，进行数据验证并计算每对数字和的平方根。对于数据验证，假设每对的第一个数字必须小于\
  \ 100，第二个必须大于 50。此外，在每次输入后，我们还想测试流的状态是否为 `EOF`。这里有一个使用 `Break` 语句完成该任务的循环：\n\n![带有\
  \ break 语句的 while 循环](img/9781284166033_CH07_386.jpg)\n\n描述\n\n注意，我们可以使用 `For` 循环从\
  \ 1 计数到 10，并在时跳出。然而，这个循环既是计数控制的，也是事件控制的，因此我们更倾向于使用 `While`。当有人阅读代码并看到 `For` 循环时，他们预期它是纯粹由计数控制的。\n\
  \n前面的循环包含三个不同的退出点。许多程序员遵循编写循环的*单入口、单出口*方法。根据这种哲学，控制从循环体的顶部进入循环，并仅在循环体结束时退出，因为多个出口会让程序逻辑更难追踪和调试。其他程序员则认为，当逻辑清晰时，在循环中使用\
  \ `break` 是可以接受的。如果我们在这个循环中不使用 `break`，它将包含嵌套的 `If` 语句，这可能会更难识别实际的计算。\n\n我们的建议是谨慎使用\
  \ `break`；过度使用会导致代码晦涩。一个实用的规则是：仅在万万不得已的情况下在循环中使用 `break`。具体来说，仅使用它来避免复杂的复合布尔表达式和嵌套\
  \ `If` 带来的困惑组合。\n\n另一个改变 C++ 程序控制流的语句是 `Continue` 语句。该语句仅在循环中有效，用于终止当前的循环迭代（但不终止整个循环）。它会导致控制立即跳转到循环底部——跳过循环体中的其余语句——为下一次迭代做准备。这里有一个读取循环的示例，我们只想处理输入文件中的正数：\n\
  \n![for 循环示例](img/9781284166033_CH07_387.jpg)\n\n描述\n\n如果 `inputVal` 小于或等于 `0`，控制跳转到循环底部。然后，像任何\
  \ `For` 循环一样，计算机会增加 `dataCount` 并在进入下一次迭代之前执行循环测试。\n\n`Continue` 语句并不常用，但为了完整性我们介绍了它（并且因为你可能会在别人的程序中遇到它）。它的主要目的是避免由于在\
  \ `If` 语句中缩进处理过程而掩盖循环的主流程。例如，之前的代码如果不使用 `Continue` 语句，写法将如下：\n\n![for 循环示例](img/9781284166033_CH07_387a.jpg)\n\
  \n描述\n\n务必注意 `continue` 和 `break` 的区别。`Continue` 意味着“放弃当前的循环迭代，进入下一次迭代”。`Break`\
  \ 意味着“立即退出整个循环”。\n\n## 7.5 选择循环语句的指南\n\n以下是一些帮助你决定何时使用这三种循环语句（`While`、`Do-While`\
  \ 和 `For`）的指南：\n\n1. 如果循环是简单的计数控制循环，`For` 语句是自然选择。将三个循环控制动作——初始化、测试和增/减——整合到一个位置（`For`\
  \ 语句的头部），可以减少漏掉其中一个的概率。\n2. 如果循环体至少执行一次的事件控制循环，`Do-While` 语句是合适的。\n3. 如果循环是事件控制的，且对首次执行一无所知，使用\
  \ `While` 语句。\n4. 如果不确定，使用 `While` 语句。\n5. 在无限循环中使用 `Break` 语句有时可以简化 `While`、`Do-While`\
  \ 和 `For` 的设计。\n\n## 7.6 其他运算符\n\nC++ 还有许多特殊运算符。这些附加运算符的表格。检查时不要恐慌——扫一眼即可。\n\n|\
  \ **运算符** | **备注** |\n| :--- | :--- |\n| *复合赋值运算符* | |\n| `+=` | 加法赋值 |\n| `-=`\
  \ | 减法赋值 |\n| `*=` | 乘法赋值 |\n| `/=` | 除法赋值 |\n| *递增/递减运算符* | |\n| `++` | 前递增：`++someVar`\
  \ |\n| `++` | 后递增：`someVar++` |\n| `--` | 前递减：`--someVar` |\n| `--` | 后递减：`someVar--`\
  \ |\n| *位运算符* | *仅限整数操作数* |\n| `<<` | 左移 |\n| `>>` | 右移 |\n| `&` | 位与，操作数位之间的逻辑与\
  \ |\n| `|` | 位或，操作数位之间的逻辑或 |\n| `^` | 位异或，操作数位之间的逻辑异或 |\n| `~` | 取反（反转所有位）单操作数 |\n\
  | *更多复合赋值运算符* | *仅限整数操作数* |\n| `%=` | 取模赋值 |\n| `<<=` | 左移赋值 |\n| `>>=` | 右移赋值 |\n\
  | `&=` | 位与赋值 |\n| `|=` | 位或赋值 |\n| `^=` | 位异或赋值 |\n| *其他运算符* | |\n| `()` | 强制转换\
  \ |\n| `sizeof` | 操作数的大小（字节为单位），格式：`sizeof` 表达式或 `sizeof(类型)` |\n\n\n\n\n| `?:`\
  \ | 条件运算符形式：`Expr1 ? Expr2 : Expr3` | |\n\n此表中的运算符连同你已经熟悉的运算符，构成了 C++ 运算符的大部分——但不是全部。我们将在需要时在后面的章节中引入更多运算符。\n\
  \n### 赋值运算符与赋值表达式\n\nC++ 有若干个赋值运算符。等号 `=` 是基础的赋值运算符。当它与它的两个操作数结合时，它形成了一个 `赋值表达式`（而不是赋值语句）。每个赋值表达式都有一个值和一个副作用——即该值被存储在左侧操作数所指示的对象中。例如，表达式\n\
  \n![一个表达式。delta 等于 2 乘以 12。](img/9781284166033_CH07_390a.jpg)\n\n值为 24，并具有将此值存入\
  \ `delta` 的副作用。\n\n在 C++ 中，任何表达式只要以分号结束就会变成一个 `表达式语句`。以下三个三个都是有效的 C++ 语句，尽管前两个在运行时没有产生影响：\n\
  \n![3 条语句。第 1 行：23，分号。第 2 行：2 乘以，左括号，alpha 加上 beta，右括号，分号。第 3 行：delta 等于 2 乘以 12，分号。](img/9781284166033_CH07_390b.jpg)\n\
  \n第三条表达式语句是有用的，因为它具有将 24 存入 `delta` 的副作用。\n\n由于赋值是一个表达式而不是语句，你可以在任何允许表达式的地方使用它。这里有一条将值\
  \ 20 存入 `firstInt`、值 30 存入 `secondInt`、值 35 存入 `thirdInt` 的语句：\n\n![一条语句。third Int\
  \ 等于左括号，second Int 等于左括号，first Int 等于 20 右括号加 10 右括号加 5 分号。](img/9781284166033_CH07_390c.jpg)\n\
  \n有些人使用这种风格的编码，是因为他们认为这很聪明，但大多数人发现它难以阅读且容易出错。\n\n除了 `=` 运算符外，C++ 还有几个复合赋值运算符（`+=`、`*=`\
  \ 以及前一个表中列出的其他运算符）。复合赋值运算符是为了让代码编写更紧凑，但你完全可以不使用它们。\n\n### 递增递减运算符\n\n递增递减运算符 `++`\
  \ 和 `--` 只作用于变量，而不作用于常量或表达式。假设变量 `someInt` 的值为 3。表达式 `++someInt` 表示前自增。递增 `someInt`\
  \ 的副作用先发生，因此表达式的结果为 4。相比之下，表达式 `someInt++` 表示后自增。表达式的值为 3，然后发生递增 `someInt` 的副作用。以下代码说明了前自增和后自增之间的区别：\n\
  \n![4 条说明前自增和后自增区别的语句。](img/9781284166033_CH07_391.jpg)\n\n描述\n\n在较大的表达式中间副作用总是有一点危险。这很容易产生语义错误，而且代码读起来可能很困惑。看看这个例子：\n\
  \n![一个表达式。a 等于左括号（b 等于 c 加，加，右括号），乘以，减，减，d，正斜，左括号（e 等于 f 加，加，右括号），分号。](img/9781284166033_CH07_391a.jpg)\n\
  \n有些人把看用最少的按键完成多少操作当作游戏。但他们应该记住，严肃的软件工程需要编写其他程序员可以阅读和理解的代码。副作用的使用阻碍了这一目标。到目前为止，`++`\
  \ 和 `--` 最常用的用法是将独立的表达式语句来递增或递减变量：\n\n![一个表达式。count 加加。](img/9781284166033_CH07_391b.jpg)\n\
  \n在这里，表达式的值没有被使用，但我们得到了递增 `count` 的预期副作用。在这个例子中，使用前自增还是后自增并不紧要。选择由你决定。\n\n### 位运算符\n\
  \n运算符表中列出的位运算符（`<<`、`>>`、`&`、`|` 等）用于操作内存单元内的单个比特位。我们不会探讨它们的用法；位级操作主题通常在计算机体系结构和汇编语言编程课程中涵盖。然而，我们对位运算符指出两点。\n\
  \n首先，内置运算符 `<<` 和 `>>` 分别是左移运算符和右移运算符。它们的目的是获取内存单元内的位并将其向左或向右移动。当然，我们一直都在使用这些运算符，但在不同的语境下——流输入输出。头文件\
  \ `iostream` 使用了一种名为运算符重载的高级 C++ 技术，为这两个运算符赋予了额外的含义。重载运算符是指具有多种含义的运算符，具体取决于其操作数的数据类型。在查看\
  \ `<<` 运算符时，编译器根据上下文确定是否需要左移操作。具体来说，如果第一个操作数是流，则它是一个输出操作。如果第一个操作数是整数，它就是左移。\n\n\
  其次，不要将 `&&` 和 `||` 运算符与 `&` 和 `|` 运算符混淆。这条语句\n\n![错误的语句](img/9781284166033_CH07_392.jpg)\n\
  \n在语法上是正确的，因为 `&` 是一个有效的运算符。\n\n### 类型转换操作\n\n你已经看到 C++ 非常允许程序员在表达式、赋值操作、参数传递和函数返回值中混合数据类型。然而，当不同数据类型混合在一起时会发生隐式类型转换。与其依赖如下语句中的隐式类型转换\n\
  \n![一个表达式。int Var 等于 float Var。](img/9781284166033_CH07_392a.jpg)\n\n我们建议使用显类型转换来显示转换是有意的：\n\
  \n```cpp\nint var = (int)floatVar;\n```\n\n在 C++ 中，类型转换有三种形式：\n\n![3 条转换语句](img/9781284166033_CH07_392c.jpg)\n\
  \n描述\n\n第一种形式称为函数式，因为它看起来像函数调用。它并不是真正的函数调用（没有名为 `int` 的定义函数），但它具有函数的语法和外观。在第二种形式前缀式中，括号包围数据类型的名称，而不是被转换的表达式。第三种形式使用关键字和角括号来显式指定转换操作。前缀式是\
  \ C 语言使用的形式；C++ 最初版本增加了函数式，并随着 C++ 标准的定义，包含了关键字式。\n\n函数式的用法上受到限制，因为数据类型名称必须是单一标识符。如果类型名称由多个标识符组成，则必须使用前缀式或关键字式；例如\n\
  \n![3 条转换语句](img/9781284166033_CH07_392d.jpg)\n\n描述\n\n关键字转换现在是推荐的风格。一方面，更容易注意到这个关键字。但\
  \ C++ 还有更高级的方面，涉及对象编程，`static_cast` 会导致编译器执行额外的检查，有助于发现错误。\n\n\n\n\nC++ 定义了 `cast`\
  \ 关键字的另外三种形式，它们具有特殊用途。我们不再对它们进行进一步解释，但在这里列出它们以便你有所了解：`const_cast`、`dynamic_cast`\
  \ 和 `reinterpret_cast`。\n\n### `sizeof` 运算符\n\n`sizeof` 运算符是一个一元运算符，返回操作数的大小（以字节为单位）。操作数可以是变量名，例如：\n\
  \n![语句。关键字中的单词和变量名合并在一起。size of, some Int。](img/9781284166033_CH07_393.jpg)\n\n\
  或者，操作数也可以是类型的名称，并用括号括起来：\n\n![语句。关键字中的单词和变量名合并在一起。size of, 左括号, float, 右括号。](img/9781284166033_CH07_393a.jpg)\n\
  \n你可以使用如下代码查看你机器上各种数据类型的大小：\n\n![使用 size 运算符的 3 条语句。](img/9781284166033_CH07_393b.jpg)\n\
  \n描述\n\n### `?:` 运算符\n\n我们运算符表中的最后一个运算符是 `?:` 运算符，有时被称为条件运算符。它是一个三元（三个操作数）运算符，语法如下：\n\
  \n![条件表达式的语法。Expression 1, 问号, Expression 2, 冒号, Expression 3。](img/9781284166033_CH07_393c.jpg)\n\
  \n它的工作原理如下：首先，计算机计算 `Expression1`。如果值为 `true`，则整个表达式的值为 `Expression2`；否则，其值为 `Expression3`。（`Expression2`\
  \ 和 `Expression3` 中只有一个会被求值，但它们都必须求值为相同的数据类型。）`?:` 运算符的一个经典用例是将变量 `max` 设置为两个变量\
  \ `a` 和 `b` 中的较大值。使用 `If` 语句，我们会这样做：\n\n![一个 if else 语句。](img/9781284166033_CH07_393d.jpg)\n\
  \n描述\n\n通过 `?:` 运算符，我们可以使用下面的赋值语句：\n\n![使用条件表达式的赋值语句。max 等，左括号, a, 大于, b, 右括号, 问号,\
  \ a, 冒号, b, 分号。](img/9781284166033_CH07_393e.jpg)\n\n这是另一个例子。数字 `x` 的绝对值定义为：\n\n\
  ![x 的绝对值公式。x 的绝对值等于 x，如果 x 大于等于 0；如果 x 小于 0，则为负 x。](img/9781284166033_CH07_393f.jpg)\n\
  \n要计算变量 `x` 的绝对值并将其存入 `y`，你可以如下使用 `?:` 运算符：\n\n![使用条件表达式的赋值语句。y 等，左括号, x 大于等于 0,\
  \ 右括号, 问号, x, 冒号, 负 x, 分号。](img/9781284166033_CH07_394.jpg)\n\n在两个示例中，我们都在 `Expression1`\
  \ 周围加上了括号。这些括号是没有必要的，因为条件运算符的优先级非常低。尽管如此，为了清晰，习惯上会加上它们。\n\n### 运算符优先级\n\n下表总结了我们目前为止过的\
  \ C++ 运算符的优先级，不包括位运算符。（附录 B 包含完整列表）。在表中，运算符按优先级级别分组，水平线将每个优先级级别与更低的级别隔开。\n\n| 运算符\
  \ | 结合性 | 备注 |\n| :--- | :--- | :--- |\n| `()` | 从左到右 | 函数调用和函数风格转换 |\n| `++ --`\
  \ | 从右到左 | `++` 和 `--` 作为后置运算符 |\n| `++ -- !` 一元 `+` 一元 `-` | 从右到左 | `++` 和 `--`\
  \ 作为前置运算符 |\n| `(cast) sizeof` | 从右到左 | |\n| `* / %` | 从左到右 | |\n| `+ -` | 从左到右\
  \ | |\n| `< <= > >=` | 从左到右 | |\n| `== !=` | 从左到右 | |\n| `&&` | 从左到右 | |\n| `\\\
  | \\|` | 从左到右 | |\n| `?:` | 从右到左 | |\n| `= += -= *= /=` | 从右到左 | |\n\n标记为 *结合性*\
  \ 的列描述了分组顺序。在同一优先级级别，大多数运算符从左到右分组。例如：\n\n![一个表达式。a 减 b 加上 c。](img/9781284166033_CH07_394b.jpg)\n\
  \n意味着\n\n![一个表达式。左括号, a 减 b, 右括号, 加 c。](img/9781284166033_CH07_394c.jpg)\n\n\n\n\
  一个简单的例子是表达式 `someFloat+2`。该表达式不包含 `char`、`short`、`bool` 或枚举值，因此步骤 1 留下了混合类型表达式。在步骤\
  \ 2 中，`int` 是比 `float` “低”的类型，因此值 `2` 被临时强制转换为 `float` 值——例如，`2.0`。然后进行加法，结果的类型为\
  \ `float`。\n\n这种关于类型转换的描述也适用于关系表达式，例如：\n\n![一个关系表达式。变量名中的单词已合并。some Int 小于或等于 some\
  \ Float。](img/9781284166033_CH07_396a.jpg)\n\n`someInt` 的值在比较之前被临时转换为浮点数。算术表达式和关系表达式的区别在于，关系表达式的结果类型始终是\
  \ `bool`。\n\n下表描述了在 C++ 中将值从一种简单类型提升到另一种类型的结果：\n\n| **源** | **目标** | **提升结果** |\n\
  | :--- | :--- | :--- |\n| `double` | `long double` | 值相同，占用更多内存空间 |\n| `float` |\
  \ `double` | 值相同，占用更多内存空间 |\n| 整数类型 | 浮点类型 | 整数值的浮点等效值；小数部分为零 |\n| 整数类型 | 其对应的 `unsigned`\
  \ 类型 | 如果原始数是非负的则值相同；如果原始数为负数，则为一个完全不同的正数 |\n| 有符号整数类型 | 更长的有符号整数类型 | 值相同，占用更多内存空间\
  \ |\n| 无符号整数类型 | 更长的整数类型（有符号或无符号） | 相同的非负值，占用更多内存空间 |\n\n注意：将 `char` 提升为 `int` 的结果取决于编译器。某些编译器将\
  \ `char` 视为 `unsigned char`，因此提升总是产生非负整数。在其他编译器中，`char` 表示有符号 `char`，因此负值的提升会产生一个负整数。\n\
  \n表格底部的注释表明，如果你试图编写一个可移植的 C++ 程序，可能会存在潜在问题。如果你仅使用 `char` 类型存储字符数据，则没有问题。C++ 保证机器字符集中的每个字符都表示为一个非负值。使用字符数据时，从\
  \ `char` 到 `int` 的提升在任何带有编译器的机器上都会相同的结果。\n\n然而，如果你尝试通过使用 `char` 类型处理小型有符号整数来节省内存，那么这些值提升为\
  \ `int` 类型可能会在不同的机器上产生不同的结果！一台机器可能会将负 `char` 值提升为负 `int` 值，而另一台机器可能会将负 `char` 值提升为正\
  \ `int` 值。如果你只用 `char` 存储字符数据，你将不会有任何问题。\n\n我们给出的类型转换规则是 C++ 语言定义中对应规则的简化版本。完整规则对无符号类型有更多说明，我们在本文很少使用它们。\n\
  \n### 图形用户界面 (GUI)\n\n在这里我们使用 GUI 重新实现“富有叔叔”（Rich Uncle）程序。考虑到我们已经涵盖的 GUI 组件，更改将非常直接：添加一个\
  \ `FileDialog` GUI 控件来要求用户输入文件，并使用 `OutputDialog` 显示历史分析的结果。我们还将像上一章中那样利用 `ostringstream`，用向字符串写入输出来替换\
  \ `cout`。我们需要这些包含语句：\n\n![两个包含语句。](img/9781284166033_CH07_402a.jpg)\n\n与原始程序一样，我们首先在\
  \ `main` 函数内部声明几个变量，用于记录文件中各种类型字符的计数。为这些变量添加一个输出字符串流对象的变量声明：\n\n描述\n\n![一个输出字符串流对象的变量声明。](img/9781284166033_CH07_402b.jpg)\n\
  \n描述\n\n然后我们可以将所有的 `cout` 使用替换为 `output`。接下来，我们希望应用程序要求用户提供输入文件，因此我们使用 `FileDialog`\
  \ 来这样做：\n\n![两个语句。](img/9781284166033_CH07_402c.jpg)\n\n描述\n\n`display()` 方法将控件显示在屏幕上，允许用户选择文件：\n\
  \n![一个列出文件夹内容的 GUI 窗口，标签为，Rich Uncle Case Study G U I。](img/9781284166033_CH07_403.jpg)\n\
  \n描述\n\n在这里，选择 `history.in` 为程序提供了读取的输入。然后它执行与之前相同的 Do-While 循环。需要注意的是，使用 GUI 相比基于控制台程序的优势之一是内置检查。特别是在原始程序中，我们必须确保文件存在：\n\
  \n![一个代码片段。](img/9781284166033_CH07_396a.jpg)\n\n描述\n\n\n\n\n4. 如果 switch 表达式的值可能与任何一个\
  \ case 常量不匹配，则你应该提供一个默认的替代方案。事实上，始终包含一个默认替代方案是一个良好的习惯。\n\n5. 仔细检查长 `Switch` 语句，确保你没有遗漏任何分支。\n\
  \n6. `Do-While` 循环是一种后测试循环。如果循环体可能被完全跳过，请使用 `While` 语句或 ``For` 语句。\n\n7. `For` 语句的头部（第一行）在括号内始终包含三部分。大多数情况下，第一部分初始化循环控制变量，第二部分测试该变量，第三部分递增或递减变量。这三部分用分号隔开。这些部分中的任何一个都可以省略，但分号必须存在。\n\
  \n8. 在嵌套控制结构中，`Break` 语句只会退出一层嵌套——即 `break` 所在的最内层 `Switch` 或循环。\n\n![一张森林中树木的照片。](img/Chapter-opener.jpg)\n\
  \n章节开场页插图：© Joost Lagerweij/EyeEm/Getty Images.\n\n## 第 8 章\n\n### 函数\n\n![一张从家到办公室的路径图。](img/9781284166033_CH08_418.jpg)\n\
  \n自从我们在第 3 章中引入 `sqrt` 等标准库例程以来，你就一直在使用 C++ 函数了。现在，你应该已经习惯调用函数来执行任务了。但我们还没有考虑过除\
  \ `main` 之外如何创建自己的函数。这就是本章和下一章的主题。\n\n你可能会奇怪为什么我们等现在才看用户定义的子程序。原因——也是使用函数的主要目的——编写它们是为了帮助组织大型程序。到目前，我们的程序还相对小，但我们正准备开始编写更大、更复杂的程序，因此是时候学习这种组织代码的重要手段了。\n\
  \n## 8.1 使用 void 函数进行功能分解\n\n作为简单的复习，让我们回顾一下 C++ 中的两种子程序：返回值函数和 void 函数。返回值函数通过其参数列表接收数据，并向调用者代码返回一个值。调用者通过在表达式中使用该函数来触发（调用）返回值函数：\n\
  \n![一个表达式。y 等于 3.8 乘以 s q rt，左括号，x，右括号，分号。](img/9781284166033_CH08_418a.jpg)\n\n\
  相比之下，void 函数不返回值，它的调用是一个独立的语句。例如与 `istream` 和 `ifstream` 类相关的 `get` 函数：\n\n![一个语句。c\
  \ 点 get，左括号，input Char，右括号，分号。](img/9781284166033_CH08_418b.jpg)\n\n在本章中，我们将学习如何创建自己的\
  \ void 函数。在第 9 章中，我们将考虑返回值函数。\n\n一直以来，你将程序设计为模块集合。这些许多模块可以在 C++ 中实现为*用户定义的 void\
  \ 函数*。\n\n### 何时使用函数\n\n通常情况下，你可以将任何模块编码为函数，尽管某些模块非常简单，这样做并没有帮助。因此，在设计程序时，我们需要根据整个程序是否因此更容易理解来决定将哪些模块编码为函数。其他因素可能会影响这一决定，但目前这是最简单的策略。\n\
  \n如果一个模块只有单行，最好是直接写在程序中。将其转换为函数实际上会增加代码复杂度，这违背了使用函数的初衷。相反，如果一个模块有很多行，那么它通常是一个很好的函数。\n\
  \n我们可能将短模块实现为函数的一种情况是它在程序的多个地方被使用。在一个地方编码模块并在多处调用它会产生更好的设计，原因有两个：第一，如果我们直接在多个地方编码该模块，我们犯错的机会就更多。如果我们只编码一次模块并在需要的地方调用它，我们引入错误的概率就会更小。第二，如果我们以后必须更改模块算法，我们只需要在函数内部进行一次更改，而不需要在代码中搜索每个直接插入模块的地方。\n\
  \n请记住，将模块实现为函数应该只影响程序的可读性，并可能会让以后更改程序变得更加方便或更不方便。它不应该改变程序的功能。我们说*应该*是因为这是否真实取决于我们如何实现函数的*接口*。我们还没有检查过模块设计的这方面，现在我们来考虑这一点。\n\
  \n### 为什么模块需要接口设计？\n\n在查看如何将模块转换为函数之前，我们需要重新回顾如何设计模块。到目前为止，我们的模块仅仅是语句的组，它们可以访问程序中的所有值。对于小问题这没问题，但当我们有许多模块的大问题时，它就不行了。\n\
  \n为了理解为什么允许每个模块访问每个值是一个坏主意，请考虑一个类比。在家里，人们倾向于敞开门，分享他们的大部分物品。现在假设你入住了一家基于——（没有门）的酒店。这样将没有隐私或安全可言。每个人都可以自由访问他人的东西（而且打鼾声会很糟糕！）。为了让酒店安全，我们需要为每个房间装门。大型问题的模块不应该直接访问彼此的值，信息应该通过受控制的路径进入和离开。我们将模块设计的这一方面称为接口。接口有两种视角：外部和内部。在我们的酒店类比中，从外部看你可以看到门；从内部你可以看到房间的内容。我们从外部视角开始接口设计。\n\
  \n### 设计接口\n\n从现在起，我们将模块视为一个独立的块，其实现细节是“隐藏”的——与视图隔离开。\n\n我们如何使用这样的模块？从外部角度来看，只要你知道模块模块的功能以及如何调用它，你就可以使用它，而无需知道它是实现的。例如，你不知道\
  \ `sqrt` 的代码是如何写的（它的实现是隐藏的），但你仍然可以有效地使用它。\n\n模块的功能及其调用方式的规范定义了**接口**（参见**图 8.1**](#9781284166033_CH08_01.xhtml_c8-fig001)）。隐藏模块实现被称为**封装**。当模块被封装时，我们不必担心它意外访问其他模块的值，或者其他模块能够更改它的值。\n\
  \n封装的另一个优势是，只要接口保持不变，就可以对模块进行内部更改。例如，可以使用更高效的算法重写封装模块的主体。\n\n![模块可见和隐藏部分的插图。](img/9781284166033_CH08_FIGF01.jpg)\n\
  \n图 8.1 模块接口（可见）与实现（隐藏）\n\n描述\n\n指定模块接口的方法是写下它的目的、前条件（precondition）和后条件（postcondition），以及它接收和返回的信息。如果规范足够完整，我们可以把它交给其他人，他们就可以为我们实现该模块。接口和封装是*团队编程*的基础，一组程序员合作解决一个大问题。\n\
  \n\n\n\n因此，设计一个模块可以（也应该）分为两个任务：设计外部接口和设计内部实现。对于外部接口，我们关注的是*是什么*（what），而不是*怎么做*（how）。我们定义模块的行为（它做什么）以及与其通信的机制。\n\
  \n为了定义与模块通信的机制，我们列出以下条目：\n\n1. 模块从调用者处接收的*输入值*\n2. 模块产生并返回给调用者的*输出值*\n3. *输入/输出值*——调用者拥有但由模块更改的值（由模块接收并返回的值）\n\
  \n接下来，我们将接口的内部视图作为实现的起点。我们为模块内部的变量标识符选择名称，每个名称都对应我们列表中的一个值。这些标识符就构成了我们所说的模块**参数列表**。\n\
  \n从此以后，我们在模块的头部中写出参数。模块所需的任何其他变量都被称为*局部变量*，我们在其体内部声明它们。对于任何我们预计将作为函数实现的模块，我们都会这样做。作为模块接口的一部分，我们还记录每个参数的**数据流**方向。\n\
  \n现在我们已经看到了如何设计一个用于函数实现的模块，我们可以准备开始在 C++ 中编写模块了。\n\n### 将模块编写为 void 函数\n\n在 C++\
  \ 中将模块转换为 void 函数是一件简单的事。基本上，void 函数看起来和 `main` 函数相似，区别在于函数头部使用 `void` 而不是 `int`\
  \ 作为函数的数据类型。此外，void 函数体*不*包含像这样的语句：\n\n![return 0;](img/9781284166033_CH08_420.jpg)\n\
  \n这是因为 void 函数不向调用者返回值。\n\n让我们来看一个使用 void 函数的程序。从一个不带任何参数的简单示例开始。你的朋友正从长途旅行回来，你想写一个程序打印以下消息：\n\
