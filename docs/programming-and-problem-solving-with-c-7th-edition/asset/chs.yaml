  \n```\nchar c = 'd';\nc++;\ncout << c;\n```\n\n如果你回答的是 **E**，你是正确的。下一个语句声明了 `ch`\
  \ 并将其初始化为 65。扩展这种递增 `char` 的想法，我们可以输出以下：\n\n```cpp\nchar ch = 'd';\nch++;\ncout\
  \ << ch;\n```\n\n\n\n\n![A type defined in a string. typedef, s t d, colon, colon,\
  \ size underscore t, size underscore type, semicolon.](img/9781284166033_CH10_557a.jpg)\n\
  \n但 `size_t` 是什么？它是 C `std` 头文件中提供的一种类型，取决于具体实现。这种无符号整数类型定义了针对特定编译器字符串的最大长度。鉴于这一事实，在处理字符串操作时，使用\
  \ `string::size_type` 是更好的风格。\n\n`string::npos` 是 `string::size_type` 类型的最大值，在许多机器上，这个值是一个类似于\
  \ `4294967295` 的数字。这个值可以被理解为“无效位置”，因为 `string` 操作不允许任何字符串达到那么长的长度。\n\n## 枚举类型 (Enumeration\
  \ Types)\n\nC++ 允许用户通过列出（枚举）构成该类型范围的字面量来定义一种新的简单类型。这些字面量是标识符，它们用逗号分隔，并括在大括号中。以这种方式定义的数据类型称为`枚举类型`。这是一个示例：\n\
  \n![A defined data type. enum days, left brace, uppercase sun, uppercase mon, uppercase\
  \ tue, uppercase wed, uppercase thu, uppercase fri, uppercase sat, right brace,\
  \ semicolon.](img/9781284166033_CH10_557b.jpg)\n\n此声明创建了一个名为 `Days` 的新数据类型。`Typedef`\
  \ 是为现有类型创建别名，而像 `Days` 这样的枚举类型是一个真正的新类型，与任何现有类型都彼此不同。\n\n`Days` 类型中的值——`SUN`、`MON`、`TUE`\
  \ 等——被称为`枚举符` (enumerators)。枚举符是有序的，这意味着在枚举类型的范围内，值满足 `SUN` < `MON` < `TUE. .` 且\
  \ `<FRI` < `SAT`。对枚举符应用关系运算符就像对字符应用运算符一样：测试的关系是枚举符在数据类型的排序中是“在之前”还是“在之后”。\n\n我们之前看到过\
  \ `char` 的内部表示是一个非负整数。枚举类型中的值在内部也表示为整数。默认情况下，第一个枚举符的值为 0，第二个的值为 1，依此类推。我们对 `Days`\
  \ 枚举类型的声明与以下一组声明相似：\n\n![A set of declarations.](img/9781284166033_CH10_558.jpg)\n\
