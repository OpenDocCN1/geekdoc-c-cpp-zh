  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P961.jpg)\n\n描述\n\n### 测试与调试\n\n面向对象程序的测试和调试在很大程度上是对构建程序的\
  \ C++ 类进行测试和调试的过程。顶层驱动程序也需要测试，但这种测试通常是不复杂的——面向对象的设计（OOD）往往会导致简单的驱动程序。\n\n要回顾如何测试\
  \ C++ 类，请参阅 第 9 章 中的“测试与调试”部分。在其中，我们详细介绍了测试类每个成员函数的过程。我们当时观察到，可以为每个成员函数编写单独的测试驱动程序，也可以只写一个测试所有成员函数的测试驱动程序。后的方法仅适用于具有少数简单成员函数的类。\n\
  \n当面向对象程序使用继承和组合时，从某种意义上说，测试类的顺序是预定的。如果类 `X` 派生自类 `Y`，在设计并实现 `Y` 之前，你无法测试 `X`。因此，在测试类\
  \ `X` 之前测试并调试类 `Y`（基类）是有意义的。\n\n当类 `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n\n###\
  \ 测试与调试提示\n\n面向对象程序的测试和调试在很大程度上是对构建程序的 C++ 类进行测试和调试的过程。顶层驱动程序也需要测试，但这种测试通常是不复杂的——OOD\
  \ 往往会导致简单的驱动程序。\n\n要回顾如何测试 C++ 类，请参阅第 9 章中的“测试与调试”部分。在其中，我们详细介绍了类每个成员函数的过程。我们当时观察到，可以为每个成员函数编写单独的测试驱动程序，也可以只写一个测试所有成员函数的测试驱动程序。后的方法仅适用于具有少数简单成员函数的类。\n\
  \n当面向对象程序使用继承和组合时，从某种意义上说，测试类的顺序是预定的。如果类 `X` 派生自类 `Y`，在设计并实现 `Y` 之前，你无法测试 `X`。因此，在测试类\
  \ `X` 之前测试并调试类 `Y`（基类）是有意义的。\n\n当类 `Y` 包含类 `Z` 的对象时，通常应该在测试 `Y` 之前测试 `Z`。\n\n1.\
