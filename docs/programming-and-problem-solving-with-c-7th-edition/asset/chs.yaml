  \n描述\n\n\n\n\n虽然字符和字符串字面量被放在引号中，但字面量整数和浮点数则不是，因为它们不会与标识符混淆。为什么？因为标识符必须以字母或下划线开头，而数字必须以数字或符号开头。\n\
  \n### 变量声明\n\n我们声明数值变量的方法与声明 `char` 和字符串变量相同，只是我们使用了数值类型的名称。以下是有效的变量声明：\n\n![一些有效的变量声明。](img/9781284166033_CH03_PRE8.jpg)\n\
