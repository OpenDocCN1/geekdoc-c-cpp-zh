  \n### 添加按钮组件\n\n现在我们已经有了一个空窗口，我们用特定于日历应用程序的 GUI 组件来填充它。我们将从“保存”和“退出”按钮开始，因为它们最简单。首先，我们将扩展\
  \ `AppointmentCalendarWindow` 规范，包含两个按钮的私有变量声明，以及一个创建按钮并将它们添加到 GUI 中的方法。\n\n![一段代码片段。](img/9781284166033_CH15_P935.jpg)\n\
  \n描述\n\nQt 提供了一个我们可以直接使用的 `QPushButton` 组件。这些组件被声明为指针类型，因为 Qt 框架在将它们添加到 GUI 组件时使用了组件指针。我们必须包含\
  \ `QtWidgets` 头文件以访问 `QPushButton` 的定义。`BuildButtonsWidget` 方法将创建按钮。该方法返回一个 `QWidget`\
  \ 指针，我们稍后会解释。\n\n在讨论实现之前，重要的是知道 `QMainWindow` 只允许向其添加并渲染单个“中心”组件。如果它只能显示一个组件，那么我们该如何向窗口添加多个组件呢？在当前应用程序中，我们计划有两个按钮以及其他组件。答案是，使用布局（layout）将多个组件汇集到一个组件中，布局是一个以特定排列方式显示组件的对象。\n\
  \n这是一个面向对象设计的良好示例。`QMainWindow` 的工作仅仅是显示一个包含内容的窗口。我们可以设计具有不同排列方式的各种组件的窗口，如果让 `QMainWindow`\
  \ 也负责管理这些组件的放置，将使其变得过于复杂。因此，Qt 将该责任委托给另一个对象，该对象将我们的组件以及对排列方式的规范汇集到一个组件中，并传递给 `QMainWindow`。\n\
  \nQt 提供了三种不同的布局，我们将在此应用程序中使用。第一个是名为 `QHBoxLayout` 的类，它在水平方向上相邻排列组件。我们稍后会讨论其他布局。\n\
  \n布局对象有一个 `addWidget` 方法，我们用它来添加组件，例如我们的按钮。由于布局对象本身不是组件，我们必须创建一个额外的 `QWidget` 组件（我们称之为\
  \ `buttonsWidget`），并将其布局设置为包含按钮的布局（使用其 `setLayout` 方法）。最终，`buttonsWidget` 将渲染布局，从而窗口显示按钮。上述实现的实现代码所示。注意，由于我们正在的是组件指针，我们需要使用箭头运算符来选择它们的成员。\n\
