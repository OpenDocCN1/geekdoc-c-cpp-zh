    As you can see in Figure 11.1 on page 188, the ALPHA option produces a lot more
    than a single alpha estimate! The first table provides a raw and standardized
    estimate of Cronbach’s alpha. You should use the raw alpha if you are inputting
    your original data into the CORR procedure, and you should use the standardized
    alpha if you are inputting standardized versions of your variables (e.g., z-scores)
    into the CORR procedure. You would use standardized versions of your variables
    if some of the items in the scale contained different numbers of response options
    (e.g., three dichotomous items and five Likert-type 5-point items). In the current
    example, we input the unstandardized engineering items into the scale. Thus, we
    will interpret the raw alpha.


    The second table provides item-total correlations and revised estimates of alpha
    based on removal of items. The item-total correlations are the correlations between
    each individual item and the total composite score computed as the average or
    sum of the items. We expect items to be highly correlated with the total score
    as it represents the construct the item is intended to measure. Items with low
    item-total correlations can be scrutinized for potential removal. The revised
    alpha estimates represent the Cronbach’s alpha if a particular item was'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'removed from the scale. A revised alpha estimate that is larger than our alpha
    indicates that an item contributes unique variance that reduces our overall reliability.
    This unique variance can in fact be unwanted error associated with an item,. In
    that case you might consider removing the item, or it could be construct-relevant
    variance that is not captured by the other items, in which case you would want
    to keep the item. Knowledge of the construct must be used to guide decisions about
    item removal. Finally, similar to our interpretation of the first table, we would
    interpret the raw or standardized versions of these estimates based on the format
    of our data.


    The engineering problem-solving scale demonstrates good internal consistency.
    It has a strong alpha of .95. The item-total correlations range from .80 to .88,
    and none of the revised alphas exceeds the original estimate. Unless we had a
    content-based reason for removing an item (e.g., an item is related but does not
    directly reflect problem solving), we would recommend making no changes to this
    scale.


    # Would Error-Free Measurement Make a Real Difference?


    # A Demonstration with Effect Sizes


    To give a concrete example of how important good measurement is, we can use an
    example from the first author''s survey of the educational psychology literature
    (Osborne, 2008). This survey consisted of recording all effects from all quantitative
    studies published in the Journal of Educational Psychology (usually considered
    one of our top empirical journals) during the years 1998 to 1999.


    The mean effect size and the reliability coefficient (Cronbach''s α), if reported,
    were used to identify nine potential measurement scenarios. First, a small, average,
    and large observed effect size were determined as the effect size one standard
    deviation below the mean (Cohen''s d = .31), the mean effect size (Cohen''s d
    = .68), and the effect size one standard deviation above the mean (Cohen''s d
    = 1.05). We transformed the Cohen''s d effect sizes into simple correlation coefficients
    (formulas and conversions derived from information in Cohen, 1988) to aid in interpretation
    of the results. This left us with a “small” observed effect of r = .16, an “average”
    observed effect of r = .32, and a “large” observed effect of r = .46. Next, we
    identified indicators of poor, average, and good reliability based on the reliability
    estimates one standard deviation below the mean reliability (α = .70), the mean
    reliability (α=.80), and one standard deviation above the mean reliability (α
    = .90). Finally, we created a cross tabulation of the three effect size conditions
    (small, average, large) by the three reliability conditions (poor, average, good)
    and examined what the true effect could be in the nine different scenarios that
    result. Table 11.1 on page 190 summarizes the results.


    As we can see in the table below, the observed effects substantially underestimated
    the true effects. For example, looking at an average observed effect (r = 0.32),
    we can see that even if reliability was “good” (α = .90), the true effect (r=.0.36)
    is underestimated by 30%. With'
  merge: -1
  img_proc: true
- pgno: 202
