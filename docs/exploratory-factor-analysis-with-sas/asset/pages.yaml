- pgno: 7
  md: '# # About This Book


    # ## Purpose


    This book is designed to present a modern overview of best practices in exploratory
    factor analysis. We present these concepts from an applied, reader-friendly perspective,
    guiding you through many different aspects of factor analysis and presenting evidence-based
    recommendations about how to get the most from your analysis (and how to present
    it to others clearly).


    # ## Is This Book for You?


    Factor analysis is used in many disciplines, for many purposes. If you use SAS
    and also use factor analysis, this book will help you choose options that are
    defensible and help you meet your goals. If you have never used factor analysis
    and want to learn, this book is also written for you. We guide you through concepts
    and their application gently, using minimal technical jargon, and we suggest ways
    to think about the results that reflect modern practices.


    # ## Prerequisites


    We wrote this book expecting readers to have a basic working knowledge of SAS
    and basic knowledge of statistics fundamentals. We do not assume you can do matrix
    algebra in your sleep, that you already know what an eigenvalue is, or that you
    know the binary language of moisture vaporators. We do, however, assume that most
    readers understand basic data manipulation in SAS, the DATA step, and at least
    a few procedures (e.g., MEANS, SORT, FREQ).'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Scope of This Book


    This book is designed to cover everything you need to know about exploratory factor
    analysis, and some closely related constructs such as reliability and replicability.
    Our goal was to stay focused on this one topic, as it is complex and confusing,
    with many options and steps. We chose, therefore, not to cover related topics
    like confirmatory factor analysis, construction and validation of scales, latent
    variable modeling such as structural equation modeling, and other measurement
    methodologies (for example, item response theory or Rasch measurement).


    # About the Examples


    # Software Used to Develop the Book''s Content


    SAS 9.4 was used for this book.


    # Example Code and Data


    To access the book’s example code and data, visit the authors’ page at http://support.sas.com/publishing/authors.
    Select the name of one of the authors. Then, look for the book cover, and select
    Example Code and Data.


    If you are unable to access the code through the website, send email to saspress@sas.com.


    This book is compatible with SAS® University Edition.


    If you are using SAS® University Edition you can use the code and data sets provided
    with this book. This helpful link will get you started: http://support.sas.com/publishing/import_ue_data.html.


    # Output and Graphics Used in This Book


    All output in this book was generated using SAS.'
