- pgno: 109
  md: '# Replication Statistics


    +   - Importance of Replication ............ 97

    +   - Let''s Bring Replication to EFA ............ 98

    +   - Procedural Aspects of Replicability Analysis ............ 99

    +   - Quantifying Replicability in EFA ............ 100

    +   - Application: Replication of Marsh SDQ Data ............ 102

    +   - Summary ............ 109

    +   - Exercises ............ 110

    +   - References ............ 110


    # Importance of Replication


    > > "Factor analysis is really not concerned with exactness, only good approximation."

    > > -Nunnally & Bernstein, 1994, p. 509.


    We have repeatedly recommended that readers and researchers keep in mind the exploratory
    nature of EFA — a procedure that by nature is quirky, temperamental, valuable,
    and interesting. As we discussed in Chapter 5, exploratory factor analysis takes
    advantage of all the information in the interrelationships between variables,
    whether those interrelationships are representative of the population or not.
    In other words, EFA tends to overfit a model to the data such that when the same
    model is applied to a new sample, the model is rarely as good a fit. When we as
    readers see a single EFA, often an inadequate sample (as discussed in Chapter
    5), we have no way of knowing whether the results reported are likely to generalize
    to a new sample or to the population. But it seems as though this might be useful
    information.


    If you read enough articles reporting the results from factor analyses, too often
    you will find confirmatory language used regarding exploratory analyses. We need
    to re-emphasize in our'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'discipline that EFA is not a mode for testing of hypotheses or confirming ideas
    (e.g., Briggs & Cheek, 1986; Floyd & Widaman, 1995), but rather for exploring
    the nature of scales and item interrelationships. EFA merely presents a solution
    based on the available data.


    These solutions are notoriously difficult to replicate, even under abnormally
    ideal circumstances (exceptionally clear factor structure, very large sample to
    parameter ratios, strong factor loadings, and high communalities). As mentioned
    already, many point estimates and statistical analyses vary in how well they will
    generalize to other samples or populations (which is why we are more routinely
    asking for confidence intervals for point estimates). But EFA seems particularly
    problematic in this area.


    We find this troubling, and you should too. Of course, we have no specific information
    about how replicable we should expect particular factor structures to be because
    direct tests of replicability are almost never published. As Thompson (1999) and
    others note, replication is a key foundational principle in science, but we rarely
    find replication studies published. It could be because journals refuse to publish
    them, or because researchers don''t perform them. Either way, this is not an ideal
    situation.


    # Let''s Bring Replication to EFA


    Authors can (and, we argue, should) directly estimate the replicability of their
    exploratory factor analyses reported in scientific journals. Authors (e.g., Thompson,
    2004) have introduced replicability procedures for EFA, similar to those procedures
    considered best practices in validation of prediction equations in multiple regression
    (Osborne, 2000, 2008). Although few authors perform the procedure, we hope you
    will see the intuitive appeal.


    Specifically, since the goal of EFA is usually to infer or explore the likely
    factor structure of an instrument when used within a particular population, it
    is important to know whether a factor structure within a particular data set is
    likely to be observed within another, similar data set.1 The lowest threshold
    for replicability should be replicating the same basic factor structure (same
    number of factors extracted, same items assigned to each factor) within a similar
    sample. A more rigorous threshold for replicability would be seeing the same number
    of factors extracted, the same items assigned to the same factors, and similar
    magnitudes of factor loadings (within reason). Stronger replicability gives researchers
    more confidence that a particular scale will behave as expected in data subsets
    or in a new sample.


    The EFA replication procedures explored in this chapter will provide readers information
    about the extent to which their EFAs meet these reasonable and basic expectations
    for replicability.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '**Replication in the literature.** Although replication procedures are far
    from common in EFA, some researchers have explored these analyses and made recommendations
    for others. In some fields this is known as replication analysis, and in others
    it is referred to as cross validation analysis.


    In the clinical literature, the issue of replication was emphasized by the use
    of factor scores (weighted averages of items based on factor loadings). Factor
    scores (as we will discuss in Chapter 9) is a contentious practice because factor
    loadings and even factor structure can vary dramatically across groups. The result
    can lead identical patient or participant responses to vary considerably across
    samples where factor loadings differ. Thus, some clinical researchers (e.g., Floyd
    & Widaman, 1995) suggest cross validation procedures for factor scores, similar
    to those recommended for regression prediction equations. This recommendation
    highlights the importance of knowing how well a solution within one sample —even
    a very large, representative sample—generalizes.


    Similarly, Briggs & Cheek (1986) argued three decades ago that one of the critical
    concerns to personality psychology (and personality measurement) should be replicability
    of factor structure. They summarized EFAs that had been conducted with a commonly
    used measure, the Self-Monitoring Scale, and reviewed the effect different key
    decisions could have (e.g., response options, extraction method, extraction criteria,
    rotation method, etc.) on the solution. They emphasized the concept that “factors
    that do not replicate are of little value.”


    One high-profile application of EFA replication techniques was an ambitious attempt
    by McCrae & Costa (1997) to examine whether the commonly held Five Factor Model
    of personality generalized across six different translations of their revised
    NEO personality inventory. In this application, strong replication across cultures
    and languages including English, German, Portuguese, Hebrew, Chinese, Korean,
    and Japanese samples not only confirmed the goodness of the translations of the
    instrument, but the universality of the five-factor model. Although McCrae & Costa
    effectively used replication procedures for EFA, it is important to note that
    we believe they might have been better served by a multigroup confirmatory factor
    analysis (CFA). A multigroup CFA would have allowed them to use inferential statistics
    to determine whether various aspects of the factor model were significantly different
    across groups.


    # Procedural Aspects of Replicability Analysis


    For those familiar with shrinkage analyses and cross validation of prediction
    equations in multiple regression, these procedures and suggestions will perhaps
    feel familiar. Replicability analyses in EFA (e.g., Thompson, 2004) can be conducted
    in two different ways: via *internal* or *external* replication. In internal replication,
    the researcher splits a single data set into two samples via random assignment.
    In external replication, the researcher uses two separately gathered data sets.
    In brief, replicability analysis occurs as follows:


    +   1 EFA is conducted on each sample by extracting a fixed number of factors
    using a chosen extraction method (i.e., maximum likelihood or PAF) and rotation
    method (i.e., oblimin or varimax).'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   2 Standardized factor loadings are extracted from the appropriate results
    for each sample (e.g., pattern matrix if using an oblique rotation), creating
    a table listing each item''s loading on each factor within each sample.


    +   3 Factor loadings and structures are then compared.


    The first two steps in this process are fairly straightforward and clear. You
    conduct identical EFAs on your samples, and then you extract your standardized
    loadings for comparison. The final step, comparison of factor loadings and structures,
    is not as straightforward. As we will discuss in the next section, most references
    on this topic do not go into detail as to how researchers should perform this
    comparison, what the criteria are for strong vs weak replication, and how to summarize
    or quantify the results of the replication.


    # Quantifying Replicability in EFA


    In other fields, researchers have been proposing methods of quantifying and summarizing
    replication analyses since the early 1950s. Although invariance analysis in CFA
    should be considered the gold standard for attempting to understand whether an
    instrument has the same factor structure across different groups (randomly constituted
    or otherwise), measures for replication in EFA are still necessary for exploratory
    purposes. Over the years, two summary statistics have been proposed for this function,
    but unfortunately (as we will discuss below) both have flaws. More recently, a
    two-step comparison procedure was proposed by the first author and one of his
    graduate students (Osborne & Fitzpatrick, 2012). We hope you will see the intuitive
    appeal of these procedures.


    # Two summary statistics for comparing EFA solutions.


    The use of similarity coefficients for investigating EFA solution equivalency
    was initially proposed by Kaiser, Hunka, & Bianchini (1971). The similarity coefficients
    are estimated as the maximized cosines when one set of factor loadings is rigidly
    rotated against another set of factor loadings. The final set of parameters is
    interpreted as correlation coefficients that indicate the similarity between the
    two sets of factor loadings. These coefficients are, however, based on faulty
    assumptions (and therefore are invalid from a mathematical point of view; see
    ten Berge (1996) and Barrett (1986)). It is currently possible to produce similarity
    coefficients that indicate strong agreement when in fact there is little agreement.
    Thus, these statistics are inappropriate for comparing factor analysis results.


    Another EFA solution summary statistic, congruence coefficients, was presented
    by Tucker (1951) and Wrigley & Neuhaus (1955). These summary statistics seem less
    problematic (ten Berge, 1986) but are also controversial. (See also Barrett, 1986.)
    For example, Tucker''s (1951) congruence coefficient examines the correlations
    between factor loadings for all factor pairs extracted. Yet as Barrett (1986)
    correctly points out, these types of correlations are insensitive to the magnitude
    of the factor loadings, merely reflecting the patterns. For our purpose, which
    is to examine whether the factor structure and magnitude of the loadings are generally
    congruent, this insensitivity to magnitude of loadings is problematic. We prefer
    a more granular analysis that examines (a) whether items are assigned to the same
    factors in'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'both analyses and (b) whether the individual item factor loadings are roughly
    equivalent in magnitude—the former being the basic threshold for successful replication,
    and the latter being a more reasonable, stronger definition of replication.


    # **A two-step procedure for comparing EFA solutions.**


    As noted above, we have not yet found a single summary statistic that meets our
    standards to evaluate EFA solution equivalency. In 2012 the first author and one
    of our graduate students conducted a review of replication procedures in EFA and
    developed two-step comparison procedure for evaluating EFA solutions (Osborne
    & Fitzpatrick, 2012).


    First, Osborne & Fitzpatrick (2012) assess whether the basic factor structure
    is replicated. Regardless of whether the researcher is performing internal (a
    single sample, randomly split or external (two independently gathered samples)
    replication, the researcher needs to perform the same EFA procedure on both, specifying
    the same number of factors to be extracted, the same extraction and rotation procedures,
    etc. The researcher should then identify the strongest loading for each item (i.e.,
    which factor does that item “load” on), and confirm that these are congruent across
    the two analyses. For example, if item #1 has the strongest loading on factor
    1, and item #2 has the strongest loading on factor #2, that pattern should be
    evidenced in both analyses. If any items fail this test, we would consider these
    analyses to fail to meet the most basic threshold of replicability: structural
    replicability. There is therefore little reason to expect factor structure to
    replicate in any basic way in future samples.


    If there is a small percentage of items that seem volatile in this way, this replication
    analysis might provide important information—that these items might need revision
    or deletion. Thus, replication can also serve important exploratory and developmental
    purposes. If a large number of problematic items are observed, this represents
    an opportunity for the researcher to revise the scale substantially before releasing
    it into the literature, where this volatility might be problematic.


    Next, Osborne & Fitzpatrick (2012) evaluate whether the relative magnitude of
    the factor loadings is replicated. They advocate for simply subtracting the two
    standardized (rotated) factor loadings for congruent items, and squaring the difference.
    Squaring the difference has two benefits: eliminating non-important negative and
    positive values (if one loading is .75 and one is .70, subtracting the first from
    the second produces a -0.05, and subtracting the second from the first produces
    a 0.05, yet the direction of the difference is unimportant—only the magnitude
    is important) and highlighting larger differences. Researchers can then quickly
    scan the squared differences, and they can then either confirm that all are small
    and unimportant, or identify which items seem to have large differences across
    replication analyses.


    As you might imagine, we find Osborne & Fitzpatrick’s procedure to be rather sensible.
    The procedure addresses both questions that we seek to address in a replication
    analysis: 1) Does the factor structure replicate? and 2) Are the factor loadings
    of similar magnitude?'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Application: Replication of Marsh SDQ Data


    This example demonstrates a replication analysis for EFA using Osborne & Fitzpatrick''s
    (2012) procedure. We use internal replicability analysis with the SDQ data, randomly
    subsampling two independent samples from the original sample that are then analyzed
    separately using specific extraction and rotation guidelines based on our previous
    analyses of the scale. We are using the SDQ data because it is sufficiently large
    enough (N=15,661) to permit us to draw two moderately sized subsamples from the
    data. Unfortunately, the engineering and GDS data sets are not large enough to
    allow us to subsample from the data. If we were to do so, this would result in
    sample sizes of less than 240 and subject to item ratios of less than 13:1. If
    we remember the previous chapter, these are not ideal conditions for an EFA!


    Before we get started, let''s review the syntax to subsample from a data set.
    We use the SURVEYSELECT procedure, as we did for an example in the previous chapter.
    The code to produce our two subsamples is presented and described below.


    ```

    *Sample 1;

    proc surveysselect data = sdqdata method = SRS n = 500

    out = sdqdata_s1 seed = 37;

    run;


    *Sample 2;

    proc surveysselect data = sdqdata method = SRS n = 500

    out = sdqdata_s2 seed = 62;

    run;

    ```


    In the code above, the DATA argument specifies the input data set to sample records
    from; the METHOD argument specifies the method of sampling (note that we use simple
    random sampling without replacement above); the N argument specifies the number
    of records to include in our subsample; the OUT argument specifies the name of
    the data set to contain the subsample; and the SEED option sets the seed to our
    random number so that we can rerun this code and get the same subsample.


    After we draw out two subsamples from the original data, we conduct an EFA on
    each data set. We take care to apply the same methods (e.g., extraction, rotation)
    to each data set so that differences in the results are attributable to the data
    and not the methods. Consistent with our findings in previous chapters, we use
    maximum likelihood extraction and direct oblimin rotation. We also report a three-factor
    solution (the factor structure suggested by previous research on the scale) as
    well as two- and four-factor solutions to demonstrate how misspecification of
    a factor model can quickly become evident through replication analysis. An example
    of the basic syntax for the three-factor solution run on the first sample is presented
    below.


    ```

    proc factor data = sdqdata_s1 nfactors = 3 method = ml

    rotate = OBLIMIN fuzz=.3;

    ```'
