    The factor loading results show similar trends. The variables are all strong on
    the factors that they should load on, and the corresponding CI are relatively
    narrow. These results suggest that our estimates are likely to replicate. Overall,
    these results strongly support our solution as one that is likely to generalize.


    Interpretation of CI. In general, two things are taken into account when interpreting
    the CI around these statistics: the relative magnitude of the statistics captured
    in the CI and the relative range covered by the CI. This is a different use than
    the more commonplace use of CI for null hypothesis testing. When evaluating null
    hypotheses, we often look to see whether our CIs contain zero, which would indicate
    there is not a significant effect or difference.'
