- pgno: 78
  md: 'relationships to each factor. In PROC FACTOR, these appear toward the bottom
    of the output in a table entitled “Rotated Factor Pattern.”


    **Reference structure matrix coefficients** are a series of semipartial correlations
    between the individual variables and the overall factors. These are output by
    SAS when conducting an oblique rotation and are not commonly output in other statistical
    software. This matrix provides the same information as the pattern matrix, only
    in a different metric: total variance vs units of standard deviation. Although
    the different scale can be useful to those who think in terms of correlations,
    this matrix is not traditionally analyzed.


    **Structure matrix coefficients** are simple correlations between an individual
    variable and the composite or latent variable (factor). These are output only
    when conducting an oblique rotation. In multiple regression, these would be similar
    to correlations between an individual variable and the predicted score derived
    from the regression equation. The difference between structure and pattern coefficients
    is the difference (again, returning to regression) between simple correlations
    and semipartial (unique relationship only) correlations. In PROC FACTOR, these
    appear after the pattern matrix in a table entitled “Factor Structure.”


    Individuals are often confused by the various matrices that are output as well
    as the different matrices output by orthogonal and oblique rotation. As we mentioned
    above, an orthogonal rotation will output 1) an unrotated factor matrix and 2)
    a pattern matrix, but an oblique rotation will output 1) an unrotated factor matrix,
    2) a pattern matrix, 3) a reference structure matrix, and 4) a structure matrix.


    The pattern matrix is generally interpreted when conducting an orthogonal rotation,
    and both the pattern and structure matrix are interpreted when conducting an oblique
    rotation. The structure matrix is provided only during an oblique rotation because
    it provides information about the items under the assumption of correlated factors.
    If all factors were perfectly uncorrelated with each other, the pattern and structure
    coefficients would be identical. In this case, there is no effect of holding other
    factors constant when computing the pattern matrix, and the structure and pattern
    coefficients would be the same, just like simple and semipartial correlations
    in multiple regression with perfectly uncorrelated predictors. Thus, the structure
    matrix is useful only when interpreting an oblique rotation.


    Thompson (2004) and others (Gorsuch, 1983; Nunnally & Bernstein, 1994) have argued
    that it is essential to interpret both pattern and structure coefficients in an
    oblique rotation in order to correctly and fully interpret the results of an EFA.
    In practice, few do. Further, when rotations are oblique and factors are correlated,
    they argue it is important to report the intercorrelations of factors also. We
    will highlight this process when appropriate.


    # Example Syntax and Output


    Let’s review the syntax to produce an EFA on the engineering data using oblimin
    rotation. We will use iterated PAF extraction, although any method would provide
    similar results. (See Chapter 2.) We selected oblimin rotation for this data because
    the factors are known to be correlated. The syntax to run this analysis is presented
    below.¹'
  merge: -1
  img_proc: true
- pgno: 79
  md: '```

    proc factor data = engdata nfactors = 2 method = PRINT priors = SMC rotate = OBLIMIN;

    var EngProb: INTERESTeng : ;

    run;

    ```


    This syntax produces a series of results—within which we can see the four factor
    loading matrices (discussed above) of particular interest to us. These matrices
    are presented in Figure 4.2 on page 68. Notice how the coefficients in the unrotated
    factor matrix (in the upper left of the figure) are generally larger in absolute
    magnitude and more difficult to interpret than the other matrices. Although we
    expected (and see evidence of) two very clear factors, the unrotated factor loadings
    do not immediately identify these two separate factors. All 14 items seem to have
    similar loadings on factor 1 and it is only in combination with the loadings on
    factor 2 where the two factors separate. If we plot each item in two-dimensional
    space (as done in Figure 4.1 on page 62), we clearly see the separation; however,
    rotation can help us interpret these results without plotting.


    The rotated pattern matrix and the rotated structure matrix (in the upper right
    and lower right of the figure) support the same two-factor solution proposed in
    the plot of the unrotated results: the eight engineering problem-solving items
    load on factor 1, and the six interest items load on factor 2. However, notice
    that the matrices have slight differences in their factor loadings. The off-factor
    loadings (e.g., loading of EngProbSolv1 on factor 2) in the rotated structure
    matrix are higher than those in the rotated pattern matrix. As we stated previously,
    this is because the structure matrix represents the simple correlation between
    the item and the factor, but the pattern matrix reflects the unique relationship
    between the two, holding the other factor constant. The factors in this example
    analysis are correlated, r = 0.37. Thus, holding one constant removes the shared
    variance from the analysis and clarifies the unique factor structure. It is important
    to interpret both in order to diagnose how the correlation between factors might
    be affecting the results.


    The reference structure matrix (in the lower left of the figure) presents a nearly
    identical picture as the rotated pattern matrix. There are slight differences
    in the loadings that can be traced to the difference in metric, but it does not
    tell us anything new. This matrix is not traditionally interpreted, and it is
    not output by other programs. We present the results below only in order to provide
    an explanation of the results that you might see. Since it does not provide any
    information beyond what is provided in the pattern matrix, we will not include
    it in subsequent examples.'
  merge: -1
  img_proc: true
