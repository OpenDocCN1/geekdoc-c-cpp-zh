  md: "Finally, we will use the SORT and UNIVARIATE procedures to estimate our 95%\
    \ CI from the bootstrap distribution. We must first sort our data because we are\
    \ estimating CIs for multiple estimates—the eigenvalues—and thus we will need\
    \ to use BY processing to produce separate estimates for each eigenvalue. BY processing\
    \ requires that the analysis variable, in this case our eigenvalue number (i.e.,\
    \ “Number”), is sorted in ascending order. We did not need to sort the data when\
    \ we used BY processing in the FACTOR procedure above because the BY variable,\
    \ “replicate”, was already in ascending order (it was output this way by the SURVEYSELECT\
    \ procedure). We also used the NODUPKEY option in PROC SORT to remove the second\
    \ set of eigenvalues, those for the reduced correlation matrix, from our data\
    \ set. Since the preliminary eigenvalues are ordered first in our data set, this\
    \ option will keep them and delete the other eigenvalues that appear as the second\
    \ occurrence of a variable Number by Replicate ID combination. Please note, the\
    \ NODUPKEY option is required only when bootstrapping CI for the eigenvalues.¹\n\
    \nThe UNIVARIATE procedure can then be used to estimate the 95% CI. Two statements\
    \ are required by this procedure for the CI to be estimated: the VAR and OUTPUT\
    \ statements. The VAR statement lists the variables that we would like to estimate\
    \ CI for and the OUTPUT statement saves a data set with our requested estimates\
    \ in it. Within the OUTPUT statement, the OUT and PCTLPTS options are necessary\
    \ to name the output data set and to specify the percentile estimates we would\
    \ like to output. For a 95% CI, you would request the 2.5 and 97.5 percentiles.\
    \ Finally, the PCTLPRE option in the OUTPUT statement can be used to add a prefix\
    \ to the CI variables that will be output to our data set. An example of this\
    \ syntax is provided below, and an example of the final data set output by the\
    \ procedure is presented in Figure 7.3 on page 123.\n\n```\nproc sort data = boot_eigen\
    \ nodupkey;\n   by Number Replicate;\nrun;\nproc univariate data = boot_eigen;\n\
    \   by Number;\n   var Eigenvalue;\n   output out = final pctlpts = 2.5, 97.5\
    \ pctlpre = ci;\nrun;\n```"
