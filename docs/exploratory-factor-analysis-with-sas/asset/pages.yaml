    # Mechanics of Performing Second-Order Factor Analysis


    In general, second-order factor analysis consists of analysis of correlation matrices.
    If you are performing principal components analysis, you can save component scores
    and examine them as variables in a second-order analysis, as only in PCA will
    the component correlations and component scores match exactly (Thompson, 2004,
    p. 73).² When using common factor analysis, we must analyze the correlation matrix.


    To illustrate this methodology, we will use the engineering data that we started
    exploring in Chapter 2, adding a third subscale that asked eight questions about
    feelings of belongingness in engineering. Using iterated PAF extraction and direct
    oblimin rotation (as before), there were 372 cases with valid data on all variables.


    **First-order analysis of engineering data.** Since our data has changed, we start
    by examining the factor structure. The various plots to examine factor structure
    are presented in Figure 10.1 on page 174. The Kaiser Criterion (eigenvalue >1)
    and MAP analysis support a three-factor solution; parallel analysis recommends
    a four-factor solution; and the scree plot supports one-, three-, or four-factor
    solutions. Theory, however, suggests there are three factors with a single, second-order
    factor. CFA would help us test the question of factor structure; but for the sake
