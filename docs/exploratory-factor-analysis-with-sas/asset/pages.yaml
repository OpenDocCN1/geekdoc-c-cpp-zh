- pgno: 196
  md: 'This means that if one has an alpha of 0.80 for a scale, it should be interpreted
    as the expected correlation between that scale and another scale sampled from
    the same domain of items, and with the same covariance and number of items. The
    square root of 0.80 is 0.89, which represents an estimate of the correlation between
    that score and the “true scores” for that construct. As you probably know, the
    square of a correlation is an estimate of shared variance, so squaring this number
    leads us back to the proportion of “true score” in the measurement. 80. Finally,
    we can subtract our “true score” variance from our total variance to get an estimate
    of our proportion of error variance in the measurement, in this case 20%. Thus,
    a scale with an alpha of .80 includes approximately 20% error.


    **What alpha is not.** Alpha is not a measure of unidimensionality (an indicator
    that a scale is measuring a single construct rather than multiple related constructs)
    as is often thought (Cortina, 1993; Schmitt, 1996). Unidimensionality is an important
    assumption of alpha, in that scales that are multidimensional will cause alpha
    to be under-estimated if not assessed separately for each dimension, but high
    values for alpha are not necessarily indicators of unidimensionality (e.g., Cortina,
    1993; Schmitt, 1996).


    Also, as we mentioned before, alpha is not a characteristic of the instrument,
    but rather it is a characteristic of the sample in which the instrument was used.
    A biased, unrepresentative, or small sample could produce a very different estimate
    than a large, representative sample. Furthermore, the estimates from one large,
    supposedly representative sample can differ from another, and the results in one
    population can most certainly differ from another. This is why we place such an
    emphasis on replication. Replication is necessary to support the reliability of
    an instrument. In addition, the reliability of an established instrument must
    be re-established when using the instrument with a new population.


    # What Is “Good Enough” for Alpha?


    Many authors have asserted that an alpha of 0.70 or 0.80 represents “adequate”
    and “good” reliability, respectively (e.g., Nunnally & Bernstein, 1994). Remember,
    an alpha of 0.70 is associated with 30% error variance in a scale, and an alpha
    of 0.80 is associated with 20%. We do not believe that these standards represent
    “good” measurement, particularly when more than one variable in an analysis is
    measured with this quality.


    Let us look at an example from multiple regression to demonstrate our point. When
    each independent variable is added to a regression equation, the effects of less
    than perfect reliability rely on the strength of the relationship becomes more
    complex, and the results of the analysis more questionable. One independent variable
    with less than perfect reliability can lead to each subsequent variable claiming
    part of the error variance left over by the unreliable variable or variables.
    The apportionment of the explained variance among the independent variables will
    thus be incorrect and reflect a misestimation of the true population effect. In
    essence, low reliability in one variable can lead to substantial over-estimation
    of the effect of another related variable. As more independent variables with
    low levels of reliability are added to the equation, the greater the likelihood
    that the variance accounted for is not apportioned correctly. Ultimately, some
    effects can end up masked (creating a Type II error),'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'with other effects inflated inappropriately in the same analysis, potentially
    leading to Type I errors of inference (Osborne, 2013). Thus, one thesis of this
    chapter is that better measurement is preferable to less good measurement. 1


    So what is “good” enough? Unfortunately, we do not think there is an easy answer
    to this question. Specific cutoff values indicating adequate or good reliability,
    such as 0.70 or 0.80, are easy to use but what do they really mean? What is the
    practical difference between an alpha of 0.79 and 0.80? Thus, while we believe
    we should aim for higher alphas, we do not have specific advice for what alphas
    should be obtained. We can only say that higher is better, and there are probably
    diminishing returns after one exceeds 0.90 (which still represents about 10% error
    variance in the measurement). In addition, what constitutes “good enough” also
    depends on the purpose of the data, and the method of analysis. Using the data
    to choose children for an educational program or select employees for promotion
    is different from evaluating correlations between constructs for a dissertation.
    Furthermore, modern measurement (e.g., Rasch or IRT measurement) and modern analysis
    techniques (e.g., structural equation modeling) can help researchers build stronger
    and better scales. Thus, we strongly recommend that researchers aim for the best
    possible measurement that is reasonably attainable. We further recommend that
    researchers be transparent in reporting and interpreting reliability estimates
    in the context of their research, and not rely on specific cutoff values to tell
    them whether their measurement is “good”.


    In practice, some researchers do strive for better estimates of reliability. A
    review of educational psychology literature in 1969 and 1999 indicated average
    reliability (reported) alphas of 0.86 and 0.83, respectively (Osborne, 2008).
    These estimates are pretty good, but they reflect only the 26% of articles (in
    this study of modern, high-quality journals) that reported this basic data quality
    information. So while a quarter of the researchers did report alphas that tended
    to be high, three-quarters did not even acknowledge the importance of such indicators.
    Unfortunately, lack of reporting about reliability and use of low alphas to support
    reliability are occurrences that are not difficult to find among peer-reviewed
    journal articles across disciplines. Poor measurement can have profound (and often
    unpredictable) effects on outcomes, and thus more researchers need to pay attention
    to this issue.


    # Factors That Influence Alpha and Its Use


    Although alpha is generally the preferred method of estimating reliability (particularly
    in the social sciences), it is a fairly basic method that can be easily influenced.
    It is not robust with respect to many potential characteristics of a sample or
    instrument. It is important to be aware of these characteristics so that appropriate
    steps can be taken to reduce their effect and improve our estimates of reliability.
    Each characteristic is described below.


    **High average inter-item correlation.** All other things being equal, alpha is
    higher when the average correlation between items is higher. But even Cronbach
    specifically pointed out that'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'when inter-item correlations are low, alpha can be high with enough items with
    low intercorrelations. This is one of the chief drawbacks to interpretability
    of alpha—that with enough mostly uncorrelated items, alpha will move into the
    “reasonable” range that most researchers use as a rule of thumb.


    **Length of the scale.** As mentioned above, all other things being equal, longer
    scales will have higher alphas.


    **Reverse coded items (negative item-total correlations).** Many scales are constructed
    with reverse-coded items. However, alpha cannot provide accurate estimates when
    the analysis includes items with negative item-total correlations. Thus, any item
    that is expected to have a negative item-total correlation (e.g., if the factor
    loading is negative when most others are positive) should be reversed prior to
    analysis.


    **Random responding or response sets.** Random responding (discussed in Chapter
    8) tends to attenuate all of these estimates because it primarily adds random
    error. Thus, failure to identify this issue in your data will lead to under-estimation
    of the internal consistency of the data. Response sets can have a variety of effects,
    depending on the response set. Some types of response sets will inflate alpha
    estimates and some can attenuate alpha (for an overview of response sets, and
    how one can identify them, you might see Osbourne & Blanchard, 2011).


    **Multidimensionality.** The assumption of alpha is that all items within a particular
    analysis represent a single dimension, or factor. To the extent that assumption
    is violated, the estimate of alpha will be misestimated. Thus, the factor structure
    of the scale should be considered before submitting items to this type of analysis.


    **Outliers.** Outliers (inappropriate values, also discussed in Chapter 8 usually
    have the effect of increasing error variance. This generally has the effect of
    attenuating the estimate of alpha. Thus, data should be carefully screened prior
    to computing alpha.


    In addition to the above factors that can influence the estimate of alpha, a theoretical
    issue can hinder its interpretation. Alpha was built for a time when researchers
    often summed or averaged items on scales. Many researchers do this today. Of course,
    when summing or averaging items in a scale, you are making an assumption that
    all items contribute equally to the scale—that the weighting of each item is identical.
    Alpha also assumes that all items contribute equally. Yet from what we have seen
    in earlier chapters, that might not be a valid assumption, and it is not the assumption
    made by EFA (or confirmatory factor analysis, latent variable modeling, IRT, Rasch
    measurement, etc.). For example, in Chapter 4 we saw that the pattern loadings
