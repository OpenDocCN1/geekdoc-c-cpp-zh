    Three-factor replication analysis. An overview of the replication is presented
    in Table 6.1 on page 103. As you can see in this table, the two samples have identical
    factor structures. Even though the items that load on factor 2 in sample 1 are
    found to load on factor 3 in sample 2, these are still identical structural solutions
    because the same sets of items are loading on each factor. Thus, these two samples
    pass the first test of replicability—consistent factor structure. In addition,
    notice that the squared differences in factor loadings are all relatively small.
    The largest difference is .005,suggesting that the factor loadings do not differ
    by more than |.07|—which is not bad. We would suggest that after the squared differences
    achieve a magnitude of .04, indicating a difference of |.20|, a researcher can
    begin to consider factor loadings to be volatile. However, based on our current
    results, we can conclude that the two samples pass the second test as well—consistent
    magnitude of factor loadings.


