    # ## What Is Extraction?


    Extraction is the process of reducing the number of dimensions being analyzed
    by a set of variables into a smaller number of factors. In general, extraction
    of factors proceeds by first extracting the strongest factor that accounts for
    the most variance, and then progressively extracting successive factors that account
    for the most remaining variance. We begin this chapter by reviewing a number of
    key concepts that are essential to understanding EFA, and factor extraction in
    particular. We then review the different extraction techniques used and the criteria
    to determine the number of factors to extract.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# Key Concepts\n\n**Matrix of associations.** The basic unit of analysis in\
    \ an EFA is a matrix of associations— either a correlation or a covariance matrix.\
    \ If you input a data set into your EFA, the program will estimate this as step\
    \ 1. Alternatively, you can input the correlation or covariance matrix directly,\
    \ reading it in as the raw data. This can be useful when trying to replicate someone’s\
    \ analyses based on published results or when wanting to analyze ordinal or dichotomous\
    \ variables through a corrected correlation matrix (i.e., polychoric or tetrachoric).\
    \ In either case, the extraction methods above will yield slightly different results\
    \ based on the matrix of association being analyzed. The default method in PROC\
    \ FACTOR is the simple correlation matrix (the most commonly used type of association\
    \ for EFA). Correlations are most commonly used in EFA as they are only influenced\
    \ by the magnitude of the association of the two variables. By contrast, covariances\
    \ are influenced by association, as well as the variance of each of the two variables\
    \ in question (Thompson, 2004). The default method in PROC FACTOR can be changed\
    \ using the COVARIANCE option.\n\n**Communalities.** In EFA, the communalities\
    \ are the estimates of the shared variance in each variable, or the variance that\
    \ will be accounted for by all the factors. They are computed from the matrix\
    \ of associations, and their decomposition and partitioning is the goal of all\
    \ subsequent analysis. The estimation of communalities is a defining characteristic\
    \ of EFA that distinguishes it from PCA. In EFA, the communalities are always\
    \ less than 1.00 for each variable because EFA seeks to decompose the shared variance;\
    \ while in PCA, they are initially 1.00 because there is no distinction between\
    \ shared and unique variance.\n\nAlthough the different extraction methods generally\
    \ yield different estimates of communalities, each method typically starts with\
    \ the same initial estimates. The initial estimate aims to get a quick and simple\
    \ idea of the shared variance in each variable. In PROC FACTOR, the default process\
    \ for the EFA techniques1 is to estimate the initial communalities as the squared\
    \ multiple correlation of a variable with all other variables. They are called\
    \ the “Prior Communality Estimates” in the output, and they should appear as one\
    \ of the first tables in the output. Starting with the initial estimates, the\
    \ communalities are then iteratively re-estimated via the selected extraction\
    \ method to produce the final estimates.\n\nThe communalities can be thought of\
    \ as a row statistic. When looking at a table of factor loadings, with variables\
    \ as the rows and factor loadings in columns, the communalities for a variable\
    \ are a function of the factor loadings. Squaring and summing each factor loading\
    \ for a variable should equal the extracted communality (within reasonable rounding\
    \ error).2\n\n+   1. Two techniques, principal axes factor extraction and iterated\
    \ principal axes factor extraction, are PCA methods and not EFA by default. Initial\
    \ extraction of communalities using the squared multiple correlation must be specified\
    \ using the PRIORS = SMC option in order for EFA extraction to occur.\n+   \n\
    +   2. Note the following detail where an orthogonal rotation is used. Oblique\
    \ rotations are slightly more complicated if doing the calculation by hand, as\
    \ the factors are correlated. Communalities in this case are the sum of each variable's\
    \ pattern loading multiplied by the structure loading. Statistical software handles\
    \ these complexities for us."
  merge: -1
  img_proc: true
- pgno: 25
  md: '**Eigenvalues.** Eigenvalues are a representation of the aggregated item-level
    variance associated with a factor. They can be viewed as a column statistic—again
    imagining a table of factor loadings. If you square each factor loading and sum
    them all within a column, you should get an approximation of the eigenvalue for
    that factor (again within rounding error). Thus, eigenvalues are higher when there
    are at least some variables with high factor loadings, and lower when there are
    mostly low loadings. You will notice that eigenvalues (and communalities) change
    from initial statistics (which are estimates and should be identified regardless
    of extraction method*) to extraction, which will vary depending on the mathematics
    of the extraction. The cumulative percent variance accounted for by the extracted
    factors will not change (to be discussed later), but the distribution of the variance
    will change along with changing factor loadings during rotation. Thus, if the
    extracted eigenvalues account for a cumulative 45% of the variance overall, the
    cumulative variance accounted for will still be 45% after the factors are rotated,
    but that 45% might have a slightly different distribution across factors after
    rotation. This will become clearer in a little bit, as we look at some example
    data.


    **Iterations and convergence.** The majority of the methods described below rely
    on an iterative procedure to “converge” on a final solution. Convergence occurs
    when the change between one model’s communalities and the next model’s communalities
    is less than .001. This can essentially be interpreted to mean that the two models
    are yielding the same results. Although we have not yet come across a good reason
    to reset the convergence criteria, it is possible to do so through the `CONVERGE`
    option. If an EFA analysis fails to “converge,” that means that these coefficients
    failed to stabilize and continued changing dramatically. This is most commonly
    due to inappropriately small sample sizes. One potential solution to this problem
    is to increase the default number of iterations. The default number of iterations
    is 30 in `PROC FACTOR` and it can be reset with the `MAXITER` option.


    # Extraction Techniques


    Seven EFA extraction techniques are available in SAS. These methods span the range
    of options commonly used by researchers and include all methods generally available
    in other common statistical software applications (e.g., SPSS, STATA). Each is
    further described below.


    **Principal axes factor (PAF) extraction** is a variation of PCA. This method
    replaces the diagonal elements of the matrix of associations (e.g., correlation
    or covariance matrix) with the initial communality estimates, or initial estimates
    of the shared variance. In PCA this substitution does not occur, effectively permitting
    PCA to estimate components using all of the variance and not just the shared variance.
    When this substitution occurs, it acknowledges the realistic expectation of imperfect
    measurement and instead uses only the shared variance in the estimation. The final
    set of factors and communality coefficients are estimated from the revised matrix
    of associations.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# **Iterated principal axes factor extraction**


    is identical to PAF, except that an iterative estimation process is used. Each
    successive estimate of the communality coefficients is used to replace the diagonal
    of the matrix of associations. The process is repeated iteratively until the communality
    coefficients stabilizes—or changes less than a predetermined threshold. This extraction
    technique tends to be favored when multivariate normality of the variables is
    not a tenable assumption (Fabrigar, Wegener, MacCallum, & Strahan, 1999).


    # **Alpha extraction**


    seeks to maximize the Cronbach''s coefficient alpha estimate of the reliability
    of a factor. The difference between alpha extraction and other extraction techniques
    is the goal of the generalization. Maximum likelihood and other similar extraction
    techniques seek to generalize from a sample to a population of individuals, whereas
    alpha extraction seeks to generalize to a population of measures. One downside
    to alpha extraction is that these properties are lost when rotation is used (Nunnally
    & Bernstein, 1994), applying only to the initial rotation. As we will see in the
    section on rotation, unrotated results are often not easily interpreted, and this
    extraction technique is potentially confusing to researchers, who might think
    they are getting something they are not—if they rotate the results of the alpha
    extraction.


    # **Maximum likelihood (ML) extraction 1**


    is another iterative process (used in logistic regression, confirmatory factor
    analysis, structural equation modeling, etc.) that seeks to extract factors and
    parameters that optimally reproduce the population correlation (or covariance)
    matrix. It starts with an assumption that individual variables are normally distributed
    (leading to multivariate normal distributions with residuals normally distributed
    around 0). If a certain number of factors are extracted to account for interrelationships
    between the observed variables, then that information can be used to reconstruct
    a reproduced correlation matrix. The parameters chosen are tweaked iteratively
    in order to maximize the likelihood of reproducing the population correlation
    matrix—or to minimize the difference between the reproduced and population matrices.
    This technique is particularly sensitive to quirks in the data, particularly in
    “small” samples, so if the assumptions of normality are not tenable, this is probably
    not a good extraction technique (Fabrigar et al., 1999; Nunnally & Bernstein,
    1994).


    # **Unweighted least squares (ULS) extraction**


    uses a variation on the process of maximum likelihood extraction. It does not
    make any assumptions about normality and seeks to minimize the error, operationalized
    as the sum of squared residuals. Between the observed and reproduced correlation
    (or covariance) matrices, ULS is said to be more robust to non-normal data (as
    we will see in the third example to come; Nunnally & Bernstein, 1994).


    # **Image extraction and Harris extraction**


    are two methods based on the image factor model, as opposed to the common factor
    model or the component model (Cattell, 1978, p 403). These methods use a non-iterative
    process to estimate shared variance (known as the image) and unique variance (known
    as the anti-image) based on lower-bound estimates of variance produced through
    multiple regression (Cattell, 1978; Harman, 1967). The image extraction method
    in SAS corresponds with Guttman’s (1953) version (as opposed to Jöreskog’s 1969
    version) and the Harris extraction corresponds with Harris’s (1962) Rao-'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Guttman method. These methods are not very common and will not be discussed
    any further in the current chapter.


    Each of the techniques described above are specified on the METHOD option in the
    FACTOR procedure. The different extraction methods summarized above can be requested
    using the following keywords.1


    ```

    method =

    PRINCIPAL /*PAF extraction*/

    PRINIT /*Iterated PAF extraction*/

    ALPHA /*Alpha extraction*/

    ML /*ML extraction*/

    ULS /*ULS extraction*/

    IMAGE /*Image extraction*/

    HARRIS /*Harris extraction*/

    ```


    Please note, the PAF and iterated PAF techniques also require the PRIOR = SMC
    option (specifying use of the squared multiple correlation matrix for estimation
    of the initial communalities, as demonstrated in the sample syntax above). If
    this option is not specified, a PCA will be conducted.


    # Three Pedagogical Examples


    To illustrate the points in this section of the chapter, we have three example
    data sets that are available from the book website and will be used throughout
    the book. A quick summary of the data sets is presented in Table 2.1 on page 15.
    A complete summary of the items by instrument as well as source data source details
    are presented at the end of this chapter.


    Table 2.1 Example data sets


    | Example | Sample | Items/Scales | Example Items |

    | :--- | :--- | :--- | :--- |

    | 1. Engineering items | 372 undergraduate students from a study on engineering
    majors at an eastern university. | 14 items and 2 scales: engineering problem-solving
    (8 items), interest in engineering (6 items) | How well did you feel prepared
    for defining what the problem really is? Engineering fascinates me. |'
  merge: -1
  img_proc: true
- pgno: 28
  md: "| Example | Sample | Items/Scales | Example Items |\n| :--- | :--- | :--- |\
    \ :--- |\n| 2. Marsh Self-Description Questionnaire (SDQ) | 15,661 10th graders\
    \ from the National Education Longitudinal Study of 1988. | 13 items and 3 scales:\
    \ parents (5 items), English (4 items), mathematics (4 items) | My parents treat\
    \ me fairly.\nI get good marks in English.\nI do badly in tests of mathematics.\
    \ |\n| 3. Geriatric Depression Scale | 479 older adults from the Long Beach Longitudinal\
    \ Survey. | 30 items in a scale without a clear factor structure | Do you often\
    \ get bored?\nAre you hopeful about the future? |\n\nIt is common wisdom that\
    \ extraction techniques tend to yield similar results. Let us examine this assertion\
    \ to see whether it holds across our samples.\n\n# Example Syntax and Output\n\
    \nTo get started, let's review the syntax and output to produce a factor analysis\
    \ of the engineering data (example data set 1 in Table 2.1 on page 15). We will\
    \ iterated PAF extraction and ask SAS to extract two factors since the items in\
    \ the data generally represent two scales (please note, in Chapter 3 we will discuss\
    \ the criteria to determine the number of factors to extract. The syntax to do\
    \ this is presented below.\n\n```\nproc factor data = engdata nfactors = 2 method\
    \ = PRINIT priors = SMC;\n   var EngProbSolv1 EngProbSolv2 EngProbSolv3 EngProbSolv4\n\
    \   EngProbSolv5 EngProbSolv6 EngProbSolv7 EngProbSolv8\n   INTERESTeng1 INTERESTeng2\
    \ INTERESTeng3 INTERESTeng4\n   INTERESTeng5 INTERESTeng6;\nrun;\n```\n\nSince\
    \ we are at heart lazy programmers who enjoy shortcuts (where appropriate), we\
    \ are going to take a minute to explain two handy shortcuts for referring to a\
    \ set of variables that contain the same prefixes: ranges and lists. Variable\
    \ ranges require the same prefix and a numeric suffix (e.g.: var1 var2 var3).\
    \ You can then refer to a set of variables by the first variable and last variable\
    \ in the range separated by a dash (e.g., var1-var3). Variable lists require only\
    \ an identical prefix. The suffix can be numeric or character (e.g., var011 varXYZ\
    \ varABC). You can then refer to the set by the common prefix followed by a colon\
    \ (e.g., var: ). There is another type of range that uses a double dash (e.g.,\
    \ --) that refers to variables based on position in the data set, but we do not\
    \ recommend using that because variable order can change and you can get yourself\
    \ in trouble. If we used a range or a list with the above syntax, this would change\
    \ your VAR statement to the following:\n\n```\nvar EngProbSolv1-EngProbSolv8 INTERESTeng1-INTERESTeng6;\n\
    ```"
