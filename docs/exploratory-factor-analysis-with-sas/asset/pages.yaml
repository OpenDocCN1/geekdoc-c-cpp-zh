    # Why Is Sample Size Important?


    Larger samples are better than smaller samples (all other things being equal)
    because larger samples tend to minimize the probability of errors, maximize the
    accuracy of population estimates, and increase the generalizability of the results.
    Unfortunately, there are few sample size guidelines for researchers using EFA
    or PCA, and many of these have minimal empirical evidence (e.g., Guadagnoli &
    Velicer, 1988).


    This is problematic because statistical procedures that create optimized linear
    combinations of variables (e.g., multiple regression, canonical correlation, and
    EFA) tend to “overfit” the data. This means that these procedures optimize the
    fit of the model to the given data; yet no sample is perfectly reflective of the
    population. Thus, this overfitting can result in erroneous conclusions if models
    fit to one data set are applied to others. In multiple regression this manifests
    itself as inflated R² (shrinkage) and misestimated variable regression coefficients
    (Cohen, Cohen, West, & Aiken, 2003, pp. 83-84). In EFA this “overfitting” can
    result in'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'erroneous conclusions in several ways, including the extraction of erroneous
    factors or misassignment of items to factors (e.g., Tabachnick & Fidell, 2001,
    p. 588).


    # Published Guidelines


    In multiple regression texts, some authors (e.g., Pedhazur, 1997, p. 207) suggest
    subject to variable ratios of 15:1 or 30:1 when generalization is critical. But
    there are few explicit guidelines such as this for EFA (Baggaley, 1983). Two different
    approaches have been taken: suggesting a minimum total sample size, or examining
    the ratio of parameters such as subjects to variables, as in multiple regression.


    Comfrey and Lee (1992) suggest that “the adequacy of sample size might be evaluated
    very roughly on the following scale: 50 = very poor; 100 = poor; 200 = fair; 300
    = good; 500 = very good; 1000 or more – excellent” (p. 217). Guadagnoli & Velicer
    (1988) review several studies that conclude that absolute minimum sample sizes,
    rather than subject to item ratios, are more relevant. These studies range in
    their recommendations from an N of 50 (Barrett & Kline, 1981) to 400 (Aleamoni,
    1976). In our opinion, some of these recommendations are ridiculous, as they could
    result in analyses estimating far more parameters than available subjects.


    **The case for ratios.** There are few scholars writing from the multiple regression
    camp who would argue that total N is a superior guideline to the ratio of subjects
    to variables. Yet, authors focusing on EFA occasionally vehemently defend this
    position. It is interesting precisely because the general goal for both analyses
    is similar: to take individual variables and create optimally weighted linear
    composites that will generalize to other samples or to the population. Although
    the mathematics and procedures differ in the details, the essence and the pitfalls
    are the same. Both EFA and multiple regression risk overfitting of the estimates
    to the data (Bobbio & Schemmer, 1984), and both suffer from lack of generalizability
    when sample size is too small.


    Absolute sample sizes seem simplistic given the range of complexity factor analyses
    can exhibit—each scale differs in the number of factors or components, the number
    of items on each factor, the magnitude of the item to factor correlations, and
    the correlation between factors, for example. This has led some authors to focus
    on the ratio of subjects to items or, more recently, the ratio of subjects to
    parameters (as each item will have a loading for each factor or component extracted).
    This is similar to what authors do with regression, rather than absolute sample
    size, when discussing guidelines concerning EFA.


    Gorsuch (1983, p. 332) and Hatcher (1994, p. 73) recommend a minimum subject to
    item ratio of at least 5:1 in EFA, but they also describe stringent guidelines
    for when this ratio is acceptable, and they both note that higher ratios are generally
    better. There is a widely cited rule of thumb from Nunnally (1978, p. 421) that
    the subject to item ratio for exploratory factor analysis should be at least 10:1,
    but that recommendation was not supported by empirical research. Authors such
    as Stevens (2002) have provided recommendations ranging from 5 to 20 participants
    per scale item, with Jöreskog & Sörbom (1996) encouraging at least 10 participants
    per parameter estimated.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'There is no ratio that will work in all cases; the number of items per factor
    and communalities and item loading magnitudes can make any particular ratio overkill
    or hopelessly insufficient (MacCallum, Widaman, Preacher, & Hong, 2001).


    # Sample Size in Practice


    Unfortunately, much of the literature that has attempted to address sample size
    guidelines for EFA, particularly the studies attempting to dismiss subject to
    item ratios, use flawed data. We will purposely not cite studies here to protect
    the guilty, but consider it sufficient to say that many of these studies either
    tend to use highly restricted ranges of subject to item ratios or fail to adequately
    control for or vary other confounding variables (e.g., factor loadings, number
    of items per scale or per factor/component) or restricted range of N. Some of
    these studies purporting to address subject to item ratio fail to actually test
    subject to item ratios in their analyses.


    Researchers seeking guidance concerning sufficient sample size in EFA are left
    between two entrenched camps—those arguing for looking at total sample size and
    those looking at ratios.1 This is unfortunate: because both probably matter in
    some sense, and ignoring either one can have the same result: errors of inference.
    Failure to have a representative sample of sufficient size results in unstable
    loadings (Cliff, 1970), random, nonreplicable factors (Aleamoni, 1976; Humphreys,
    Ilgen, McGrath, & Montanelli, 1969), and lack of generalizability to the population
    (MacCallum, Widaman, Zhang, & Hong, 1999).


    If one were to take either set of guidelines (e.g., 10:1 ratio or a minimum N
    of 400 to 500) as reasonable guidelines, a casual perusal of the published literature
    shows that a large portion of published studies come up short. One can easily
    find articles reporting results from EFA or PCA based on samples with fewer subjects
    than items or parameters estimated that nevertheless draw substantive conclusions
    based on these questionable analyses. Many more have hopelessly insufficient samples
    by either guideline.


    One survey by Ford, MacCallum, and Tait (1986) examined common practice in factor
    analysis in industrial and organizational psychology during the ten-year period
    of 1974 to 1984. They found that out of 152 studies using EFA or PCA, 27.3% had
    a subject to item ratio of less than 5:1 and 56% had a ratio of less than 10:1.
    This matches the perception that readers of social science journals get, which
    is that often samples are too small for the analyses to be stable or generalizable.


    Osborne and colleagues published the results of a survey of current practices
    in the social sciences literature (Osborne, Costello, & Kellow, 2008). In this
    survey, they sampled from two years (2002, 2003) worth of articles archived in
    PsycINFO that reported some form of EFA and listed both the number of subjects
    and the number of items analyzed (303 total articles surveyed). They standardized
    their sample size data via a subject to item ratio. The results of this survey
    are summarized in Table 5.1 on page 86. A large percentage of researchers report
    factor analyses using relatively small samples. In a majority of the studies (62.9%)'
