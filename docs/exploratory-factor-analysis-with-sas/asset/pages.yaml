    the second represents the standard error, the third and fourth represent the upper
    and lower bound of the CI, and the last provides a CI coverage indicator that
    can be used to help interpret the results. The coverage indicator displays the
    relative location of the CI (represented as "[T]"), zero (represented as "0"),
    and the loading magnitude requested for evaluation (represented as "*"). The coverage
    indicator can be used to quickly determine which CIs contain values above a certain
