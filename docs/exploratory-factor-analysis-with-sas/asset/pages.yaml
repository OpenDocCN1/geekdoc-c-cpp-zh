  md: '```

    by replicate;

    var Math: Par: Eng;

    run;

    ods output close; run;

    ```


    However, after we ran PROC FACTOR to replicate our analyses, the following error
    message appeared in our log in three different places.


    # Figure 7.5 Error in Log


    ```

    NOTE: 3 factors will be retained by the NFACTOR criterion.

    ERROR: Communality greater than 1.0.

    NOTE: Communality problems due to Heywood cases prevent further processing. You
    may consider using the HEYWOOD or ULTRAHEYWOOD option.

    NOTE: The above message was for the following BY group: Sample Replicate Number=502

    ```


    The above message indicates that some of the communality estimates in three resamples
    exceed 1. Logically, this should not happen. Remember that communalities represent
    the amount of shared variance that can be extracted from an item. Communalities
    greater than 1 are equivalent to more than 100% of the variance! Although it is
    not logical, this is occasionally possible because some mathematical peculiarities
    of the common factor model. An eigenvalue that exceeds 1 is called a ultra-Heywood
    case, and an eigenvalue that is equivalent to 1 is called a Heywood case (Heywood,
    1931). The occurrence of either case can be problematic and can indicate that
    our model might be misspecified (e.g., wrong number of factors, etc.) or we might
    have insufficient cases to produce stable estimates.


    For the purpose of bootstrapping CI, this message is not extremely concerning.
    It simply indicates that some of our resamples have potentially biased data—particular
    cases were oversampled, leading to a biased or more uniform data set. So, do not
    worry. This message is not a death sentence for our bootstrap analysis. However,
    if we got this error message for our original sample or for the majority of our
    resamples, this could indicate there are substantial problems with our original
    data (e.g., bias, size).


    There are two ways we can proceed with the current analysis: 1) change our estimation
    method; or 2) allow SAS to solve solutions with Heywood or ultra-Heywood cases.
    The first option is the preferred course of action. The maximum likelihood method
    of extraction is known to be particularly susceptible to Heywood cases (Brown,
    Hedrix, Hedges, & Smith, 2012). By switching to a method that is more robust for
    non-normal data (i.e., ULS or iterated PAF), we might be able to get better estimates
    from the data and avoid the problematic Heywood cases. The second option entails
    using the HEYWOOD OOD or ULTRAHEYWOOD option on the FACTOR statement to permit
    communality estimates that are equal to or greater than 1. This option should
    be used with care because it does not fix any problems—it just allows us to estimate
    results for potentially problematic data.


    **Eigenvalues and variance.** We have proceeded with the current example by estimating
    eigenvalues using both options. The syntax is provided below.


    ```

    *Solution to Heywood Cases #1: Change the method;

    *Look at original sample and subsample solution with revised method;

    proc factor data=sqdata nfactors=3 method=uls rotate=OBLIMIN;

    ```'
  merge: -1
  img_proc: true
