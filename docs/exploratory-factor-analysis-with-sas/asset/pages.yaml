    # How Does Bootstrap Resampling Fit into EFA?


    As we learned in Chapter 5, sample size can greatly affect the results of an EFA.
    Small samples can lead to the identification of incorrect factor structures and
    item loadings (both direction and magnitude). They also limit our ability to check
    the replicability of our results through internal replication. (See Chapter 6.)
    Thus, small samples can affect your results and limit your ability to discern
    how they might affect them!'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Now the best solution to the small sample dilemma is to get more data. More
    subjects or observations can be added to a sample to improve the potential replicability
    of the results. However, if this is not a possibility (we all have limited resources
    and funds!), an alternative solution is to explore the replicability of the results
    through bootstrap resampling techniques. Bootstrap resampling is a subsampling
    and averaging procedure that can be used to produce confidence intervals for any
    and all of the statistics that we choose. We can get confidence intervals (CIs)
    around eigenvalues, communalities, factor loadings, and more. These CIs can then
    inform us about the precision of each estimate and the range in the estimates
    that we might see among other samples. This information provides another means
    through which to examine the replicability of our results.


    The benefits of bootstrap resampling are not limited to small samples. If we consider
    what bootstrap resampling can tell us —the potential error in our estimates and
    generalizability to other samples —we can quickly see the benefit of this practice
    to any analysis. Although it is true that large samples are more likely to yield
    replicable results, this hypothesis can be tested through bootstrap analysis.
    These methods help inform us about the replicability and generalizability of our
    results.


    # The Rise of Resampling


    The use and application of bootstrap resampling gained the spotlight through a
    larger debate about null statistical hypothesis testing (NHST). At the end of
    the 20th century, the role of NHST in evaluating research was under dispute. Some
    thought the traditional criteria for determining “statistical significance,” a
    p-value < .05, was sufficient, but others criticized the practice and recommended
    additional or alternative measures (for an excellent overview of the issues, see
    Fidler & Cumming, 2008; Killeen, 2008; Schmidt, 1996). Debates on the topic ensued
    at annual meetings of professional organizations (e.g., the American Educational
    Research Association; Thompson, 2002) and in journals. (See also Cohen, 1994;
    Hunter, 1997.) Finally, in 1996 the American Psychological Association (APA) convened
    the Task Force on Statistical Inference to discuss the issue. The Task Force deliberated
    on the topic for two years and finally concluded with a report documenting best
    practices for research. Although they did not recommend a ban of NHST, they discouraged
    the historical over-reliance on NHST and recommend the reporting of effect sizes
    and CI as a context for statistical significance (Wilkinson, 1999).


    The Task Force’s recommendation, along with timely advances in computing, launched
    bootstrap resampling out of relative obscurity. Previously, the formulas to estimate
    CI were sparse. They were limited by underlying assumptions and required advanced
    statistical knowledge to implement. Bootstrap resampling did not suffer from such
    limitations and instead offered a single procedure to estimate any CI. A decade
    before the Task Force’s recommendation, bootstrap resampling was not feasible
    for everyday practice because of the computationally intensive nature of the process.
    It would have required days of calculations and many runs to a mainframe computer
    (if you were lucky enough to have access to one!). However, as computers became
    faster, smaller, cheaper, and smarter, these methods became increasingly accessible
    and easier to implement.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Unfortunately, it is still not routine for researchers to report confidence
    intervals for EFA results and, indeed, it is not routine for replication to be
    considered much at all. However, we hope the appeal of these techniques is apparent.
    If we perform an EFA and then calculate 95% confidence intervals for the relevant
    statistics, it helps a reader understand how precise our estimates might be. Very
    broad CIs might signal to the reader that the EFA is not very precise and, therefore,
    not terribly informative. Narrow CIs, on the other hand, might signal to the reader
    that the analysis is worth considering seriously. It does not necessarily mean
    that the EFA reflects the population parameters exactly, but it is more likely
    to be of use than one with low precision (broad CIs). This type of analysis, while
    not routine, is simple through bootstrap resampling methodologies (DiCiccio &
    Efron, 1996; Efron & Tibshirani, 1994).


    # Bootstrap Resampling Methods


    Bootstrap resampling consists of three basic steps: 1) resampling, 2) replication
    of analyses, and 3) summarizing the results of the analyses (e.g., via a CI).
    There are many good references on bootstrap and other resampling techniques. The
    brief overview here is not meant to be exhaustive, but rather to give enough information
    for you to understand the rest of the chapter. For more information about these
    methods, please see Davison & Hinkley (1997).


    The bootstrapping process begins by resampling from your original sample. You
    take your existing sample (say, of 50 participants) and randomly select (with
    replacement) a certain number of related samples of N=50 based on those original
    50 subjects. The procedure is called “resampling” because it treats the original
    sample as fodder for an unlimited number of new samples. By resampling with replacement,
    we can get three copies of the 14th person in the sample, none of the 15th, and
    one copy of the 16th person. Perhaps in the next sample there will be one copy
    of both the 14th and 15th persons, but none of the 16th. Thus, the samples are
    related, in that they all derive from the same master sample, but they are not
    exactly the same as each individual can be present in varying degrees or not in
    each resampling.


    Next, the analysis of interest is repeated in each sample. Similar to the procedure
    for the replication analyses discussed in the previous chapter, it is important
    that all procedures are replicated exactly. This will produce separate results
    for each resample. The distribution of a statistic across the resamples is known
    as the bootstrap distribution. The idea behind this method is that the resamples
    can be viewed as thousands of potential samples from the population (Thompson,
    2004). Together, the estimates from the resamples represent the possible range
    of the estimates in the population. The average estimate in the bootstrap distribution
    is a rough approximation of the estimate in the population.


    Finally, the analyses must be summarized. A 95% CI can be calculated from the
    bootstrap distribution. The easiest way to do this is to identify the values at
    the 2.5th and 97.5th percentile of the distribution. This is known as the percentile
    interval method of estimating CI. Other methods exist to estimate bootstrapped
    CI, some of which might be more robust to bias. Please see Davison & Hinkley (1997)
    for more about these methods.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Most scholars familiar with bootstrap resampling will agree with what we have
    said thus far—bootstrap resampling is beneficial for estimating CI—but they will
    likely stop agreeing at this point. There are a wide number of opinions on what
    bootstrap resampling is good for and what it is not good for. You will get our
    opinion on that in this chapter, but be aware that there are strong passions around
    this issue (much like principal components analysis).


    # What Can Bootstrap Resampling Do, and What Should It Not Be Used For?


    Many early adopters of the procedure saw bootstrap analysis as a panacea for small
    or biased samples. They reasoned that, with enough resampled data sets, the bias
    and small sample would be compensated for, and would provide a better estimate
    of the population parameters than the original sample by itself. These scholars
    wanted to replace an estimate produced by the sample with the average bootstrapped
    statistic.


    Unfortunately, bootstrapped statistics are not immune to all bias. Osborne’s (2015)
    experiments with logistic regression suggest that results from small or biased
    samples tend not to be self-correcting and instead lead to promoting bias. In
    other words, the averaged bootstrapped statistic from a biased sample can be just
    as biased as the original sample estimate. Large biased samples are probably in
    the same category. You can endlessly resample the same small or biased sample,
    but there is limited information in the sample. One cannot build something out
    of nothing.


    Some research suggests that some level of bias can be moderately accounted for
    through specific methods of CI estimation (e.g., studentized interval or bias-corrected
    and accelerated interval methods; Davison & Hinkley, 1997, p. 231; Efron & Tibshirani,
    1994, p. 184). However, these methods were designed for a corrected estimate of
    the CIs, not a corrected estimate of the average bootstrapped statistic. Although
    some of the methods could be extended to produce such an estimate, we do not believe
    this is a worthwhile endeavor. These methods might be useful in estimating more
    accurate CI for biased or small samples, but we do not believe they are robust
    enough to provide a reliable estimate of the population parameter.


    Bootstrap analyses can provide estimates of replicability or generalizability
    and help identify inappropriately influential data points in a sample. Although
    resampling might not be able to improve upon a biased estimate, it can provide
    CIs through which we can evaluate just how imprecise the parameter estimates are.
    These CI can help researchers interpret their results and determine how they might
    generalize. In addition, bootstrap methods provide a distribution of parameter
    estimates from the resamples. This distribution can be used to help identify inappropriately
    influential data points. If one does thousands of resampling analyses, and they
    are distributed with a skew, the long tail is likely due to the influence of a
    few cases. However, it is important to note that there can be easier ways to detect
    inappropriately influential data points. Osborne (2015) found that cleaning data
    prior to bootstrap analysis often yielded much better results. Thus, if you have
    a sample, and if you are intending to bootstrap, it is best to do some preliminary
    data cleaning first.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Overall, bootstrap resampling can be a valuable tool in the statistician''s
    toolbox, but it is not a panacea. It cannot fix a fatally flawed sample, and it
    cannot compensate for an inappropriately small sample. But given a reasonable
    sample, bootstrap resampling can do some interesting things. It can provide confidence
    intervals for things like effect sizes that we really cannot get any other way.
    It can provide information about the precision of the results, and it can give
    some information in a single sample that is helpful in determining whether a solution
    will replicate or not. In other words, if one performs an appropriate bootstrap
    analysis of a reasonable sample, and one sees relatively narrow confidence intervals,
    one can say that the solution arrived at is more precise than it would have been
    if one had very broad confidence intervals. Further, if those confidence intervals
    are narrow and precise, it is likely that a similar sample will produce similar
    results. If the confidence intervals are wide and sloppy, it is not likely that
    a similar sample would produce similar results.


    # Example Syntax and Output


    # Traditional CI with ML


    Before we review the lengthier bootstrapping syntax, we will quickly review a
    predefined SAS option for estimating the CI of factor loadings when conducting
    maximum likelihood (ML) extraction. ML extraction is the only extraction method
    that readily provides estimates of standard error that can then be used to compute
    traditional CI.¹ These CIs are different from bootstrapped estimates because they
    are based on standard errors as opposed resampling procedures. As we mentioned
    in the beginning of this chapter, we often do not have the ingredients to compute
    traditional CIs and thus bootstrapped CIs have become a useful alternative. Thus,
    we will discuss this method of computing CIs only briefly as it is rather limited
    in scope and application. Again, if you are interested in performing a non-ML
    extraction (see Chapter 2) or you are interested in reviewing CIs for the eigenvalues,
    communalities, etc., then this is not the method for you.


    The traditional CI can be requested by adding the CI option to the FACTOR statement.
    If you would like SAS to evaluate whether the CIs are above a certain absolute
    magnitude, you can set the CI option equal to that respective magnitude (e.g.,
    CI = .4). You can also change the default confidence level of 95% for the interval
    that is calculated using the ALPHA option (e.g., ALPHA = .9). An example of the
    syntax to estimate 95% CI using the engineering data and to request SAS to evaluate
    whether the loadings are above an absolute magnitude of 0.4 is provided below.
    Note that the ML extraction method is specified and must be specified in order
    for these options to work.


    ```

    proc factor data = engdata nfactors = 2 method = ML rotate = OBLIMIN

    CI = .4;

    var EngProb: INTERESTeng.;

    ```'
