    retain a copy of our original data, we will create a new variable with the recoded
    values in it, Par2_recode and Par4_recode. The syntax for our initial run (summarized
    above), the recoding, and the revised run are presented below along with comments.
    Please note we provide two options for recoding—a long way with individual value
    recoding for each variable and a shorter way using arrays.


    ```

    /*Try to compute alpha for parenting items;

    proc corr data=sqdata alpha;

    Par;


    run;


    /*Recode and re-run;

