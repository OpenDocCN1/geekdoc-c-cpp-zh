- pgno: 194
  md: 'those constructs are measured is important. Along the way, we can also ask
    whether the factor that is being examined needs all the items in order to be measured
    effectively.


    To fully evaluate an instrument, we should evaluate whether the factors or scales
    that we derive from the EFA are reliable, confirmed in a new sample, and stable
    (invarant) across multiple groups. In this chapter, we will briefly look at the
    most common method of assessing scale reliability, Cronbach’s coefficient alpha.


    Let us start with a discussion of the modern view of reliability and validity.
    When developing a scale to be used in research, there is a delicate dance between
    focusing on creating a scale that is a “good” scale, and the acknowledgment in
    modern research methods that things like factor structure, reliability, and validity
    are joint properties of a scale and of the particular sample being used (Fan &
    Thompson, 2001; Wilkinson, 1999). It should be self-evident to modern researchers
    that a scale needs to be well-developed in order to be useful, and that we do
    that in the context of a particular sample (or series of samples, as we recommended
    when discussing replication). Thus, those of us interested in measurement must
    hold two somewhat bifurcated ideas in mind simultaneously—that a scale can be
    stronger or weaker, and that scales are strong or weak only in the context of
    the particular sample being used. This can lead to a nihilistic mindset if carried
    too far, and so we recommend that we take a moderate position in this discussion:
    that scales can be more or less strong, but that all scales need to be evaluated
    in the particular populations or data that they reside in.


    # What Is Cronbach’s Alpha (And What Is It Not)?


    Cronbach’s alpha (Cronbach, 1951) is one of the most widely reported indicators
    of scale reliability in the social sciences. It has some conveniences over other
    measures of reliability, and it has some drawbacks as well. There are also many
    misconceptions about the appropriate use of alpha. In this section we will review
    the strengths, weaknesses, uses, and misuses of alpha. However, let us start by
    reviewing the original goal for alpha.


    Prior to Cronbach’s seminal work in this area, the reliability of a scale in a
    particular sample¹ was evaluated through methods such as test-retest correlations.
    This type of reliability is still discussed today in psychometrics textbooks,
    but it has serious drawbacks. These can include the difficulty of convening the
    same group of individuals to retake instruments, memory effects, and attenuation
    that are due to real change between administrations. Another serious drawback
    is particular to constructs (e.g., mood, content knowledge) that are expected
    to change over time. Thus, as Cronbach himself put it, test-retest reliability
    is generally best considered as an index of stability rather than reliability
    per se.


    The split-half reliability estimate was also developed early in the 20th century.
    To perform this evaluation, items are divided into two groups (most commonly,
    even- and odd-numbered


    1 Back in the middle 20th century, reliability and validity were discussed as
    a property of the scale (i.e., the Osborne Obsequiousness Scale is reliable and
    valid). Modern APA and other guidelines recommend that we talk about reliability
    and validity as the property of samples, not instruments. However, some instruments
    do tend to appear more reliable across samples, and some less so. Hence the need
    for replication.'
