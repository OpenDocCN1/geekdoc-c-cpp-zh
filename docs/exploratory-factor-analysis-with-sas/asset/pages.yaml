- pgno: 139
  md: "perform replication analyses as in Chapter 6. Bootstrap analysis can provide\
    \ another means through which to address this question. Other questions that we\
    \ might ask could concern whether the communalities and factor loadings estimated\
    \ are within a reasonable range for each of the variables. Let's take things one\
    \ step at a time. To perform this bootstrap analysis, we used syntax similar to\
    \ that reviewed above.\n\n# Eigenvalues and variance.\n\nFirst, we examined the\
    \ initial eigenvalues that were extracted to evaluate the replicability of the\
    \ factor structure via the Kaiser Criterion (eigenvalue > 1 criteria, which is\
    \ simplest in this analysis). According to our previous analyses, we expect two\
    \ factors to be extracted. Thus, if we examine the first three factors extracted,\
    \ we can explore the likelihood that this basic structure would replicate in a\
    \ similar sample. The syntax used to perform these first few steps is presented\
    \ below. Notice we also request additional ODS tables be output (ObliqueRotFactPat\
    \ and FinalCommon) for use in our subsequent analyses.\n\n```\n**Conduct bootstrap\
    \ resampling from the data set;\nproc surveyselect data = engdata method = URS\
    \ samprate = 1 outhits\n    out = outboot_eng (compress=binary) seed = 1 rep =\
    \ 2000;\nrun;\n```\n\n```\n**Run model on bootstrap estimates;\nods output Eigenvalues=boot_eigen\
    \ (compress=binary)\n    ObliqueRotFactPat=boot_loadings (compress=binary)\n \
    \   FinalCommon=boot_common (compress=binary);\nproc factor data = outboot_eng\
    \ nfactors = 2 method = prinlit\n    priors = SMC rotate = OBLIMIN;\n    by replicate;\n\
    \    var EngProb: INTERESTeng ;\nrun;\nods output close;\n```\n\n```\n**Estimate\
    \ CI for Eigenvalues and corresponding variance;\nproc sort data=boot_eigen nodupkey;\
    \ by Number replicate; run;\nproc univariate data=boot_eigen;\n    by Number;\n\
    \    var Eigenvalue Proportion;\n    Histogram;\n    output ci-eigen pctlpts=2.5,\
    \ 97.5 mean=Eigenvalue_mean\n    proportion_mean std=Eigenvalue_std Proportion_std\n\
    \    pctlpre=Eigenvalue_ci Proportion_ci;\nrun;\n```\n\nFigure 7.4 on page 128\
    \ displays a histogram of the bootstrap distribution for the first eigenvalue\
    \ extracted. Our average initial eigenvalue among the samples is 7.4, but across\
    \ the resamples it ranges from 6.1 to 8.8. We compute the 95% CI directly from\
    \ this distribution by identifying the eigenvalues that fall at the 2.5 and 97.5\
    \ percentile, leading us to the estimates of 6.7 and 8.2. Each of the remaining\
    \ CIs are calculated in a similar manner. Table 7.2 on page 128 displays a summary\
    \ of our results (extracted from the data set ci_eigen, output by the UNIVARIATE\
    \ procedure)."
