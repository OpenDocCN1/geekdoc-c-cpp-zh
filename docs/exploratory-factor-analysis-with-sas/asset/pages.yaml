    | Reliability | Small (r = .16, r² = .025) | Average (r = .32, r² = .10) | Large
    (r = .46, r² = .21) |

    |---|---|---|---|

    | Poor (α = .70) | r = .23 r² = .05 | r = .46 r² = .21 | r = .66 r² = .43 |

    | Average (α = .80) | r = .20 r² = .04 | r = .40 r² = .16 | r = .58 r² = .33 |

    | Good (α = .90) | r = .18 r² = .03 | r = .36 r² = .13 | r = .51 r² = .26 |


    Note: This data is adapted from that originally published in Osborne (2008).


    # An Example with the Coefficient of Determination


    We now review an example from the first author''s personal research on identification
    with academics (self-concept vis-a-vis school). In one study a long while ago,
    he administered two closely related scales (the School Perceptions Questionnaire
    and the Identification with School questionnaire, Osborne, 1997; Voelkl, 1997)
    to high school students. Alphas were calculated to be α = 0.88 and 0.81, respectively.
    These levels are widely considered "good." After averaging the items to create
    composite scores and testing assumptions, the simple correlation was calculated
    to be r = 0.75, which translates to a coefficient of determination (% variance
    accounted for) of 0.56. This is generally a pretty strong correlation for the
    social sciences, and is reasonable considering these are two measures of similar
    constructs. The corrected correlation (formulas available in many places including
    Cohen, Cohen, West, & Aiken, 2003) is calculated to be r = 0.89, which would represent
    a coefficient of determination of 0.79. If we assume that this corrected effect
    size of 0.79 is the correct population estimate, the original correlation between
    two measures with "good" reliability lost almost 30% of the effect size.


    Although we cannot directly know the population correlation for this example,
    we can simulate what perfect measurement might yield as a correlation between
    these two variables using AMOS structural equation modeling software to construct
    latent variables representing each of these scales. Although structural equation
    modeling (SEM) is a relatively advanced'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'procedure, and getting into the intricacies of the analysis is beyond the scope
    of this chapter, for our purposes all you need to understand is that SEM can be
    used to estimate relationships between variables as though they were measured
    perfectly. The estimate, therefore, of the correlation under perfect correlation
    was r = 0.90 (coefficient of determination of 0.81), very close to the calculated
    corrected correlation effect size. Unfortunately, although alphas in the 0.80
    range are common, published research based on data with much lower reliabilities
    is also not difficult to find. In fact, it is not difficult to find alphas under
    0.70, despite the fact that means that a substantial portion of the effect size
    is lost! This should be considered an undesirable state of affairs in the 21st
    century, particularly when it is relatively simple to improve measurement in scales
    by increasing item numbers or through analysis by using modern methods like structural
    equation modeling.


    # Application


    # Sample Size and the Precision of Alpha


    As we mentioned before, alpha is sample dependent. Thus it might be expected that
    sample size can affect the precision of our alpha estimate. When a smaller sample
    is used to estimate alpha, each observation contributes a lot of information to
    the estimate. An outlier or deviation from expectation in a small sample can have
    a profound effect on the results and can cause them to vary from the population
    mean. However, in a larger sample, the outlier or deviation will likely be averaged
    out by the other observations.


    Let''s explore this issue of sample size and precision with the Marsh SDQ data
    that we''ve been using throughout the book. Let us start by examining the reliability
    of the parent subscale in the complete data set. The parent subscale is composed
    of five items:


    +   - (Par1) My parents treat me fairly.

    +   - (Par2) I do not like my parents very much.

    +   - (Par3) I get along well with my parents.

    +   - (Par4) My parents are usually unhappy or disappointed with what I do.

    +   - (Par5) My parents understand me.


    Obviously Par2 and Par4 are reversed in direction. If you calculate alpha using
    these five items as is (see Figure 11.2 on page 192), you will get a negative
    alpha (which is impossible) as well as some negative item-total correlations (another
    sign of trouble).'
  merge: -1
  img_proc: true
