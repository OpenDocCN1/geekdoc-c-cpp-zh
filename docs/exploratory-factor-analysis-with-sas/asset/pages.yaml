  md: 'Historically, this led researchers to create “factor scores,” which weighted
    each item by the factor loading to more closely approximate what a latent variable
    score might be. As we discussed in Chapter 9, we do not believe this is a good
    idea. However, there is not currently a good way to deal with this theoretical
    issue when using alpha (in our opinion). Those interested in estimating internal
    consistency via alpha must simply be aware of its violation of the assumption
    of unique item contribution and live with it.


    # Estimation of Alpha in SAS


    Estimation of Cronbach’s alpha is extremely easy in SAS. It is done using the
    CORR procedure. The ALPHA option must be included on the CORR statement to request
    SAS to output estimates of alpha, and all the variables to be included in the
    alpha estimate should be listed on the VAR statement (or they can be referenced
    by a prefix, e.g., EngProb: ). An example of the syntax to produce estimates for
    the engineering problem-solving items in the engineering data is presented below.
    It is followed by a screenshot of the output produced by the ALPHA option.


    ```

    proc corr data=engdata alpha;

    var EngProb:;

    run;

    ```'
