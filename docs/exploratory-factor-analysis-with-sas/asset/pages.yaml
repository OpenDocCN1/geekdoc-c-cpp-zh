    Although examination of communalities and eigenvalues is not part of our replication
    procedure, they can give us additional information about our samples and solutions.
    In the above table, the final extracted communalities for the items in each sample
    are very similar. If we were to take the difference between the two communalities,
    they would range between .01 and .10. This indicates approximately the same amount
    of unique variance is being extracted from each item in the two samples—a good
    sign for our replication analysis!


    The final eigenvalues differ a little more because they are the sum of the partitioned
    item level variance. Remember, the unique variance that is associated with each
    item is then further divided among the factors. All of the tiny differences in
    the extracted variance are compounded in the eigenvalues, resulting in larger
    differences. Furthermore, the order in which the factors are extracted is determined
    by their eigenvalues. Thus, in sample 1 the factor that the parenting items load
    on is extracted third because it has the smallest (just barely) eigenvalue. However,
    in sample 2, the factor that these items load on is extracted second because it
    has a slightly larger eigenvalue. As we mentioned above, these differences in
    extraction order are not important when examining structural replication, but
    they do tell us that the relative weight of the factors has shifted slightly.
    In this example, the parenting items explain more variance in sample 2.


    Finally, for fun, we made SAS do all the work in the analysis for us. We output
    our pattern matrix to a SAS data set and then merged and compared the two results.
    The syntax to do this, along with line comments for explanation, is presented
    below. Note, the syntax to create the two subsamples is provided above and is
    not included here.


    ```

