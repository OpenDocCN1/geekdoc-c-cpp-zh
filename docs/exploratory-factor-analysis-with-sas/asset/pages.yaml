    **Proper vs improper factor scores.** Researchers must also decide whether they
    will use all of the variables to compute a factor score (a proper factor score)
    or just the variables that compose a particular factor (i.e., those measured variables
    with the highest factor loadings on a particular factor). Proper factor scores
    take into account _all variables_ in the analysis, not just the ones that are
    considered to be part of a factor. The scores automatically produced by SAS (using
    the `OUT` option) are proper factor scores. So, referring to Table 9.1 on page
    163, a proper factor score for the first factor (using either set of correlations)
    would include both the engineering problem-solving variables and the identification
    with engineering variables. Of course, those second loadings are relatively small
    and, as such, would contribute very little to the analysis. An improper factor
    score would include only those variables considered to be part of the factor (e.g.,
    only EngProbSolv1 – EngProbSolv8 would be used to compute the factor 1 score).
    In practice, these two types of factor scores are generally well correlated; yet
    in our opinion, both types are equally flawed.


    **Stability of factor scores.** It is arguable whether weighted factor scores
    are actually an improvement over equally weighted composites (averaging, summing).
    On one hand, weighted factor scores do account for the fact that some items contribute
    much more strongly to constructs than others. On the other hand, if we are concerned
    about replicability,'
