  md: 'The other way of estimating factor scores—the program-it-yourself way—is often
    more complex. You will need to write your own code, which might contain a number
    of procedures or DATA steps. Some options that might be useful for this are the
    SCORE and OUTSTAT=output-data-set-name options. Both options are added to the
    FACTOR step. The SCORE option will print the standardized scoring coefficients,
    and the OUTSTAT option will output a data set that contains the various results
    (e.g., pattern loadings, communalities, etc.) from the analysis. The standardized
    scoring coefficients are also included in this data set when the SCORE option
    is used in conjunction with the OUTSTAT option. This information can be useful
    in the various calculations of factor scores. A simple example of the syntax to
    estimate equally weighted improper factor scores (discussed in the next section)
    is presented below.


    ```

    data factor_scores2;

    set engdata;

    Factor1=mean(of EngProbSolv:); *compute mean of all items in the

    engineering problem solving scale;

    Factor2=mean(of INTERESTng:); *compute mean of items in the

    interest in engineering scale;

    run;

    ```


    # Application: Factor Score Estimation


    Now, let''s walk through an example to demonstrate some of the challenges and
    issues associated with the estimation of factor scores. We use the following syntax
    to run our factor analysis for the engineering data, to output a data set called
    factor_scores1 containing the predefined SAS factor scores (based on the standardized
    scoring coefficients) for each individual, to output a data set called Results
    that contains the pattern loading and standardized scoring coefficients along
    with other summary results, and to output a table containing the standardized
    scoring coefficients. The two output data sets and the summary table were requested
    by adding the OUT=, OUTSTAT=, and SCORE options to the FACTOR step, as described
    above.


    ```

    proc factor data = engdata nfactors = 2 method = print priors = SMC

    rotate = oblimin out=factor_scores1 outstat=results score;

    var EngProb: INTERESTng: ;

    run;

    ```


    The pattern loading matrix and the standardized scoring coefficients output by
    SAS are presented in Table 9.1 on page 163. These two sets of coefficients represent
    different potential weights that could be used to estimate factor scores and that
    we will use for the current example. We include the pattern matrix because you
    are likely to be more familiar with it, and we present the standardized scoring
    coefficients as a representation of the built-in SAS weights for computing factor
    scores.'
