    # What Comes Next?


    After you are done with the exploratory factor analysis, your journey is just
    beginning, rather than ending. The exploration phase might be drawing to a close,
    but the psychometric evaluation of an instrument is merely starting. The process
    of performing exploratory factor analysis is usually seeking to answer the question
    of whether a given set of items forms a coherent factor (or several factors).
    After we decide whether this is likely, evaluating how well'
