- pgno: 195
  md: 'items) and scored. Those two scores are then compared as a proxy for an immediate
    test-retest correlation. This, too, has drawbacks—the number of items is halved,
    there is some doubt as to whether the two groups of items are parallel, and different
    splits of items can yield different coefficients. The Spearman-Brown correction
    was developed to help correct for the reduction in item number and to give a coefficient
    that is intended to be similar to the test-retest coefficient. As Cronbach (1951)
    pointed out, this coefficient is best characterized as an indicator of equivalence
    between two forms, much as today we also talk about parallel forms.


    The Kuder Richardson Formula 20 (KR-20) and Cronbach''s alpha were developed to
    address some of the concerns over other forms of reliability, particularly split-half
    reliability. KR-20 was developed first as a method to compute reliability for
    items scored dichotomously, as either “0” or “1”, as they often are for academic
    tests or personality inventories (such as the Geriatric Depression Scale that
    we use as an example earlier in the book). Afterward, the mechanics behind KR-20
    were further refined to create alpha, a measure of reliability that is more general
    than KR-20 and applicable to items with dichotomous or continuous scales. Both
    measures will yield the same estimate from dichotomous data, but only alpha can
    estimate reliability for a non-dichotomous scale. Thus, alpha has emerged as the
    most general and preferred indicator of reliability in modern statistical methodology.
    Others have further extended the use of alpha through development of a test to
    determine whether alpha is the same across two samples (Feldt, 1980), and methods
    to estimate of confidence intervals for alpha (see Barnett, 2005). 1


    # The correct interpretation of alpha. Cronbach (1951) himself wrote and provided
    proofs for several assertions about alpha:


    +   - Alpha is n/n-1 times the ratio of inter-item covariance to total variance—in
    other words, a direct assessment of the ratio of error (unexplained) variance
    in the measure.

    +   - The average of all possible split-half coefficients for a given test.2

    +   - The coefficient of equivalence from two tests composed of items randomly
    sampled (without replacement) from a universe of items with the mean covariance
    as the test or score in questions.

    +   - A lower-bound estimate of the coefficient of precision (accuracy of the
    test with these particular items) and coefficient of equivalency (simultaneous
    administration of two tests with matching items).

    +   - The proportion (lower-bound) of the test variance that is due to all common
    factors among the items.


    As Nunnally & Bernstein (1994, p. 235) distill from all this, alpha is an expected
    correlation between one test and an alternative form of the test containing the
    same number of items. The square root of alpha is also, as they point out, the
    correlation between the score on a scale and errorless “true scores.” Let’s unpack
    this for a moment.'
