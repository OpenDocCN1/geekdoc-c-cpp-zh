  img_proc: true
- pgno: 99
  md: 'the two possible exceptions: first, people often have fewer than 36 items in
    a scale, and second, the factor loading patterns are rarely as clear and homogenous
    as in this data).


    Guadagnoli & Velicer (1988) used several high-quality fit or agreement indices
    to evaluate the results and concluded that larger sample sizes improved results
    across all conditions and that having more items (i.e., 108 and 144 vs 36 and
    72 items) improved results among small sample sizes. They also found strong factor
    loadings led to better indicators (e.g., less discrepancy between population and
    sample results, and the odds of getting the correct component pattern increased
    dramatically). Unfortunately, the magnitude of item loadings is not realistically
    within the control of the researcher. Although they had the information to do
    so, they did not examine subject to item ratio, nor test whether total N is a
    better predictor of important outcomes than subject to item ratio.


    Osborne & Costello (2004) re-analyzed Guadagnoli & Velicer’s published data to
    examine the relative importance of total sample size compared to the ratio of
    subjects to items. Contrary to prior studies, neither the ratio of subjects to
    items nor total sample size (N) had a significant *unique* effect when all other
    aspects of the analysis were considered. Total N was significant in all analyses
    until ratios were taken into account, at which point they became nonsignificant.
    The ratio of subjects to items also had a significant and substantial influence
    until total N was taken into account.


    # **An Applied Example from Costello & Osborne**


    Although the data from Guadagnoli & Velicer (1988) is illuminating, one frustration
    is the unrealistically clean nature of the data. Real data is messier. Costello
    & Osborne (2005) aimed to extend Guadagnoli & Velicer’s (1988) findings by replacing
    the artificial data with real data. They used data similar to that used for the
    second example in the previous chapter—students who completed Marsh’s Self-Description
    Questionnaire (SDQ II; Marsh, 1990) in the NELS 88 data set (Curtin, Ingels, Wu,
    & Heuer, 2002).¹


    Costello & Osborne (2005) drew samples (with replacement between samplings), extracting
    20 samples of sizes ranging from 2:1, 5:1, 10:1, and 20:1 subject to item ratios
    (creating sample sizes of N = 26, 65, 130, and 260, respectively). The samples
    drawn from the population data were analyzed using maximum likelihood extraction
    with direct oblimin rotation. For each sample, the magnitude of the eigenvalues,
    the number of eigenvalues greater than 1.0, the factor loadings of the individual
    items, and the number of items incorrectly loading on a factor were recorded.
    In order to assess accuracy as a function of sample size, they computed average
    error in eigenvalues and average error in factor loadings. They also recorded
    aberrations such as occasions when a loading exceeds 1.0, and instances of failure
    for ML to converge on a solution after 250 iterations. Finally, a global assessment
    of the correctness or incorrectness of the factor structure was made. If a correct
    analysis for a particular sample produced three factors, and the items loaded
    on the correct


