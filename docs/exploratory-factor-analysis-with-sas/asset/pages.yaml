- pgno: 143
  md: "However, in the world of EFA there are very few tests of statistical significance\
    \ and just above zero is often not good enough. An eigenvalue of 0.5 is frequently\
    \ not interesting but a factor loading of 0.5 might at least pique our interest.\
    \ Similarly, a factor loading of 0.1 and 0.2 is often just as uninteresting as\
    \ factor loadings of zero. Thus, we are instead interested in the relative magnitude\
    \ of the effects captured within the CI. In addition, if the range of magnitudes\
    \ covered is broad, this could suggest there is a large amount of sampling error\
    \ and that our results might not reflect those in the population.\n\n# Generalizability\
    \ and Heywood Cases\n\nAs we have reviewed above, bootstrap resampling helps us\
    \ answer the question of reliability and generalizability. In this example, we\
    \ will examine the results from a relatively small sample of the Marsh SDQ data\
    \ and compare it to our larger data set. We will assert that analysis of approximately\
    \ 16,000 students represents the “gold standard” or population factor structure,\
    \ and we will see whether bootstrapping CI for our small sample can lead us to\
    \ infer the “population” parameters with reasonable accuracy. A random sample\
    \ of 300 cases was selected and then subjected to bootstrap resampling and analysis\
    \ (with maximum likelihood extraction and direct oblimin rotation).\n\nImagining\
    \ that this small sample was our only information about this scale, we started\
    \ by performing an EFA on this sample only. The syntax to select the subsample\
    \ and run the basic EFA is presented below.\n\n```\n**Select subsample from SDQ\
    \ data;\nproc surveyslect data=sdqdata method=srs n=300 out=sdqdata_ssl\n    seed=39302;\n\
    run;\n**Look at factor structure in subsample;\nproc factor data=sdqdata_ssl nfactors=3\
    \ method=ml rotate=OBLIMIN;\n    var Math: Par: Eng: ;\nrun;\n```\n\nThree factors\
    \ exceeded an eigenvalue of 1.0, which was corroborated by MAP analysis and produced\
    \ a recommendation to extract three factors. Thus, if this were my only sample,\
    \ theory, Kaiser Criterion, and MAP analysis would lead me to extract three factors.\n\
    \n**Heywood cases.** We then performed bootstrap resampling on the eigenvalues\
    \ and pattern matrix factor loadings to examine the relative stability of our\
    \ solution. Again, we selected 2000 resamples and replicated our analysis in each\
    \ sample. The syntax used to select the subsamples and run the EFA on each sample\
    \ is presented below.\n\n```\n**Conduct bootstrapping from the data set;\nproc\
    \ surveylselect data=sdqdata_ssl method=urs samprate=1 outhits\n    out=outboot_edq\
    \ (compress=binary) seed=1 rep=2000;\nrun;\n**Notice occurrence of Heywood cases;\n\
    ods output Eigenvalues=boot_eigen\n    ObliqueRotFactPat=boot_loadings;\nproc\
    \ factor data=outboot_edq nfactors=3 method=ml rotate=OBLIMIN ;\n```"
  merge: -1
  img_proc: true
