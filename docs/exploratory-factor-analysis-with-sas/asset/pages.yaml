- pgno: 59
  md: 'The parallel analysis results are presented in Figure 3.11 on page 48 and Figure
    3.12 on page 49 and the MAP analysis results are presented in Figure 3.13 on page
    50 and Figure 3.14 on page 51. Because the sample size was so large, parallel
    analysis might not be as useful. The largest randomly generated eigenvalue (95th
    percentile) was 0.057. Using the criteria for parallel analysis, one would recommend
    examining either three or four factors (depending on how “significantly” different
    the raw data eigenvalue should be). The data from the MAP analysis seems to further
    reinforce theory and other criteria, indicating that three factors is the right
    number to extract. As you can see in Figure 3.14 on page 51, the minimum inflection
    point is at 3.


    In summary, theory and the Kaiser Criterion recommend three factors, the scree
    plot recommends between two and five factors, parallel analysis recommends four,
    and MAP recommends three factors. As Velicer and others have argued, the MAP appears
    to be, at least in this case, more congruent with theory and eigenvalues. That
    is reassuring. The three-factor model seems to be the best recommendation as it
    makes for a strong, interpretable model.


