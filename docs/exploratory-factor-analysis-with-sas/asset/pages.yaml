    In general, subsampled alphas that are closer to our “population” alpha of 0.83
    can be considered more precise. However, those farther away are less precise.
    As you can see in Figure 11.4 on page 196, alpha became somewhat volatile in the
    smaller samples. The observed alphas ranged from a low of α = 0.56 to a high of
    α = 0.94 in the smallest samples with N=50. The range narrowed a little further
    in the samples of N=100, with a low of α = 0.70 and a high of α = 0.92. Finally,
    the samples of N=250 had the narrowest alpha range, with a low of α = 0.74 and
    a high of α = 0.89. Thus, the precision of the alpha improved as sample size increased.
    This serves to demonstrate that even in a scale with reasonable strong psychometric
    properties (such as this), small samples tend to have a good deal of volatility.'
