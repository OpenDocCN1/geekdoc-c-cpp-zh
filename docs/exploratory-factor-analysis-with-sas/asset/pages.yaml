  md: '# Figure 3.3 Scree plot from ODS


    ![](img/29951003f0d11c9d825feb73bff9c8e6_52_0.png)


    **MAP and parallel analysis.** The last two extraction criteria are a little trickier
    to use. As we mentioned above, one barrier to researchers using MAP and parallel
    analysis is that these procedures are not widely implemented in most common statistical
    software, including SAS. Fortunately, O’connor (2000) developed SAS syntax to
    perform these analyses. These can currently be downloaded from https://people.ok.ubc.ca/brioconn/boconnr.html.
    In addition, a macro version of this syntax is included in the example code for
    this book and is available from the book website.


    To run these analyses from the macros that are available from the book website,
    you need to include the macro syntax in your current SAS file using a %INCLUDE
    statement. This loads the macro into your current session memory so that you can
    call macros from inside the external file. You then can run the analyses by calling
    the respective macro and entering the necessary arguments. The MAP macro has only
    one argument: datafile, the data set name. Thus, you can run the MAP macro from
    % map (datafile: ). The parallel macro has more arguments: datafile, the data
    set name; ndatasets, the number of random data sets'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'to use; percent, the percentile to use in determining whether the eigenvalues
    are significantly above the mean; kind, the type of parallel analysis (1=PCA and
    2=factor analysis); randtype, the type of random data to be used (1=from normally
    distributed random data and 2=random permutations of the raw data); and seed,
    the seed value to use in computations. You can then run the parallel macro from
    % parallel ( datafile,ndatasets,percent,kind,randtype,seed ). The syntax to do
    this for the engineering data is presented below.


    ```

    *Include MAP and PARALLEL ANALYSIS macro syntax for use below;

    filename parallel ''C:\Location of File\parallel_macro.sas'';

    filename map ''C:\Location of File\map_macro.sas'';

    *include map;

    *Run MAP and Parallel Analysis;

    %map(engdata);

    $parallel(engdata,100,95,2,2,99);

    ```


    The results produced by the O''Connor (2000) MAP analysis are presented in Figure
    3.4 on page 42 below. The results show the eigenvalues extracted from the data,
    the average squared partial correlations, and the average partial correlations
    to the fourth power. Recall that, using MAP analysis, we want to choose a number
    of factors where the average partial correlations hits a minimum (the squared
    partial correlation based on the 1976 criteria and the average partial correlation
    to the fourth power based on the revised criteria). According to the results,
    two factors should be retained.'
  merge: -1
  img_proc: true
