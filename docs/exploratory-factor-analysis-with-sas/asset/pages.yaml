    # Factor Scores 101


    Factor scores seemed to be cutting-edge back in the 1980s when the first author
    was beginning to take graduate statistics courses. The concept and practice extend
    back to the 1920s, although early on it was considered much less important than
    the determination of the actual factors themselves.1 This practice developed as
    a rational response to the early practice of summing or averaging items on a scale
    to produce an overall score. Of course, summing or averaging items assumes that
    all items contribute equally to the latent score. EFA demonstrated convincingly
    very early on that not all items are equally good measures of a construct and,
    therefore, better items should carry more weight in estimating an individual''s
    score.


    The practice of weighting items according to the results of EFA analyses held
    the potential of improving measurement. Researchers working prior to wide scale
    access to computers were then able to sum the weighted item scores to approximate
    what might be the true score of


    1 At this time, there were also extended arguments about whether it was even proper
    to compute factor scores, due to something called “indeterminacy”—essentially
    meaning that there are more unknowns than equations being estimated in EFA (for
    an excellent overview of the issue, see Grice, 2001). The same individuals could
    be ranked multiple ways, leaving their relative ranking indeterminate. This is
    a concern that remains today.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'each individual on the construct being examined.¹ Thus, the computation of
    weighted factor scores makes sense and was a natural progression over a period
    of many decades of research. However, it is important to recognize the intricate
    nature of the factor score computation. There are many methods of computing factor
    scores and no single universal technique. In addition, factor scores can be sensitive
    to the extraction and rotation methods used (DiStefano, Zhu, & Mîndrilă, 2009).


    The practice of factor score estimation introduced a new assumption into our analyses:
    that the factor loadings (correlations between an item and the factor) are stable
    and reasonable estimates of the dynamics within a population. A corollary, of
    course, is that the factor loadings are valid (invariant) for all subgroups being
    examined. A similar set of assumptions and corresponding issues is present in
    linear modeling /regression analyses, particularly when researchers are using
    multiple regression to predict outcomes for individuals. (For papers on prediction
    in regression, see Osborne, 2000, 2008.) Specifically, the issue is that these
    procedures can overfit the data. Most samples contain idiosyncratic aspects that
    most quantitative analyses will take advantage of in order to fit the model, despite
    those sample characteristics being nonreproducible (Thompson, 2004, p. 70). Because
    of this issue, we recommended in earlier chapters that we focus on replication
    and evaluate the anticipated precision or variability across samples to evaluate
    the goodness of EFA results. However, factor score estimation can be considered
    a relatively common practice and thus a book about EFA might not be complete without
    mentioning this practice. Therefore, here are our goals for this chapter:


    +   1 Review some basic aspects of computing factor scores.

    +   2 Review how the solutions that result from EFA can be unstable across samples,
    which can contribute to instability of factor scores.


    # Example Syntax and Output


    Two basic procedures exist for producing factor scores in SAS: 1) a predefined
    SAS option and 2) a program-it-yourself option. As you might imagine, the predefined
    SAS option is by far the easier. When you include the OUT=output-data-set-name
    option on the FACTOR statement (SAS, 2015), SAS will automatically output a data
    set that contains all of your original data along with an estimate of weighted
    factor scores (e.g., Factor1, Factor2, etc.). SAS computes the factor scores as
    a linear combination of a standardized version of our variables (i.e., with a
    mean of 0 and a standard deviation of 1) and something called the standardized
    scoring coefficients.² The scoring coefficients are essentially the regression'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'coefficients used in the computation of the factor scores. Note that these
    are different from the pattern matrix loadings, which are viewed as the regression
    coefficients for computing the communalities. It is important that you specify
    the desired number of factors to extract and the extraction and rotation methods
    when using this method; if you do not, SAS will use the default options of extracting
    the minimum number of factors recommended by the proportion of variance and the
    minimum eigenvalue criteria (see Chapter 3, “Factor Extraction Criteria,” on page
    33) and performing principal components analysis with no rotation. An example
    of the syntax to estimate factor scores, using this method for the engineering
    data, is presented below.


    ```

    proc factor data = engdata nfactors = 2 method = print priors = SMC rotate = OBLIMIN
    out=factor_scores1;

    var EngProb: INTERESTeng: ;

    run;

    ```


    An example of the data set output by the above syntax is presented in Figure 9.1
    on page 161. Note the factor scores are always appended to the end of the data
    set.


    # Figure 9.1 Factor scores output by the OUT statement


    | INTERESTeng4 | INTERESTeng5 | INTERESTeng6 | Factor1 | Factor2 |

