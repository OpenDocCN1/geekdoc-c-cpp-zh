    Geriatric depression scale data. This scale provided a very different counterpart
    to the clear conceptually consistent results of the engineering and SDQ data.
    This scale was designed to have five subscales originally,¹ so theory would suggest
    that there are five factors. But as with many of our endeavors in the social sciences,
    this might not hold true when put to the test. For example, it is just as likely
    that all items will load as a single factor, or that a different number of factors
    will be ideal. We used a ULS extraction for this data based on results from Chapter
    2. The syntax to examine the extraction criteria for this data set is presented
    below. Please note that PROC FACTOR automatically deletes records with missing
    data from analysis, thereby reducing our sample of 656 down to 479. The MAP and
    parallel analysis macros cannot handle missing data, so we must delete these records
    beforehand. We will discuss the issue of missing data further in Chapter 8.


    ```

    ods graphics on;

    proc factor data = marshdata method = ULS plots = SCREE;

    var GDS: ;

    run;

    ods graphics off;

    ```


    1 Scale 1 was to be composed of item # 1, 6, 11, 16, 21, and 26; scale 2: #2,
