    A more recent survey of EFA practices in four psychological journals, Educational
    and Psychological Measurement, Journal of Educational Psychology, Personality
    and Individual Differences, and Psychological Assessment, identifies similar trends.
    Among the 60 studies reviewed, Henson and Roberts’ (2006) found a median sample
    size of 267 for reported EFAs, a mean subject to item ratio of 11, and a median
    of 60 parameters (20 items x 3 factors) estimated. As you will see below, these
    are not comforting statistics. Given the stakes and the empirical evidence on
    the consequences of insufficient sample size, this is not exactly a desirable
    state of affairs.


    # An Empirical Investigation in Sample Size


    A particularly interesting and relatively well-executed study conducted by Guadagnoli
    & Velicer (1988) investigated the effects of sample size under a series of different
    conditions. The authors used Monte Carlo methods to examine the effects of four
    criteria—1) the number of factors (3, 6, 9, 18), 2) the number of items (36, 72,
    108, and 144), 3) the average item loadings (.40, .60, or .80), and 4) the number
    of subjects (Ns of 50, 100, 150, 200, 300, 500, and 1000)—on the stability of
    factor patterns in EFA. In this data, each item loaded on only one factor, all
    nonzero item loadings were of equal size, and each factor contained an equal number
    of variables. Their study represents one of the few studies to manipulate all
    of these important aspects across a reasonable range of variation seen in the
    literature (with'
