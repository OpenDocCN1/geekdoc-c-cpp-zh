- pgno: 141
  md: '**Communalities and factor loadings.** Next, we examined the relative stability
    of the shared item-level variance and the partitioning of the variance between
    factors. The syntax to estimate the CI of the communalities and the factor loadings
    from the boot_commun and the boot_loadings data sets output by the ODS system
    is presented below.


    ```

    **Estimate CI for Communalities and Pattern Loading Matrix;

    *transpose communality so can use BY processing in proc univariate;

    proc transpose data=boot_commun out=boot_commun_t prefix=communality

    name=Variable;

    by replicate;

    run;

    proc sort data=boot_commun_t; by Variable Replicate; run;

    proc univariate data=boot_commun_t;

    by Variable;

    var communality1;

    output out=ci_commun pctlpts=2.5, 97.5 mean=mean std=std pctlpre=ci;

    run;

    ```


    ```

    **Re-Order results on factors using the alignFactors macro we built;

    *Include alignFactors macro syntax for use below;

    filename align ''C:\alignFactors_macro.sas'';

    *include align;

    ```


    ```

    *Run Macro and estimate CI;

    *alignFactors(orig_loadings,boot_loadings,aligned_loadings,summary);

    proc sort data=aligned_loadings; by VariableN; run;

    proc univariate data=aligned_loadings;

    by VariableN;

    var Factor1;

    output out=ci1_loadings pctlpts=2.5, 97.5 mean=mean std=std pctlpre=ci;

    run;

    proc univariate data=aligned_loadings;

    by VariableN;

    var Factor2;

    output out=ci2_loadings pctlpts=2.5, 97.5 mean=mean std=std pctlpre=ci;

    run;

    ```


    In Table 7.3 on page 130, we present the communalities and pattern matrix factor
    loadings, along with their corresponding bootstrap CI. In general, the communalities
    are relatively strong. They consistently range from 0.68 to 0.82 and they have
    95% confidence intervals that are reasonably narrow. These results lead us to
    expect that another replication in a comparable sample would extract similar communalities
    that are relatively strong.'
  merge: -1
  img_proc: true
