    Thus the bootstrapped CI can serve as a very effective indicator of the precision
    of an estimate. When CIs are broad, they indicate we are not very confident in
    our estimates and the true population estimate could vary greatly. They also suggest
    that we could see substantial variation in our estimate if we were to replicate
    the analysis in similar samples. When CIs are narrow, they suggest the opposite—our
    estimates are close to the population parameter and they are likely to replicate.
    CIs can be very informative and useful tool to aid in the interpretation of alpha
    and many other statistics.


    # Summary


    Cronbach’s alpha is one of the most widely reported statistics relating to reliability
    in the social sciences. It can be interpreted as an estimate of all possible split-half
    statistics. It can also be interpreted as the percent of variance that is “true
    score” variance. Thus, if you have a measure with α = 0.80 in a particular sample,
    there is about 80% that is “true score” and about 20% error in the measurement
    for that sample.


    Unfortunately, alpha is still not reported in a majority of articles in modern,
    high-quality research journals. This might stem from the anachronistic assertion
    that scales, particularly those that are frequently used, are more or less reliable.
    However, as we demonstrated'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'throughout this chapter, alpha can be influenced by a number of different factors
    that are specific to the sample (e.g., sample size, sample bias, etc.). This variability
    across samples is not something often discussed in the psychometrics literature,
    but it is important. It highlights the sample-dependent nature of reliability
    and emphasizes the need to attend to reliability and report it in each study.
    Estimation of 95% confidence intervals can further aid in the interpretation reliability
    and offer guidance about the replicability and precision of the estimate.


    Although alpha has been the main focus of this chapter, there are modern alternatives
    to alpha. Rasch modeling, for example, produces interesting information about
    reliability from that perspective, as does Item Response Theory analysis. Structural
    equation modeling (SEM) allows us to explicitly model the latent construct and
    directly analyze it, eliminating the need for alpha altogether. Where possible,
    it seems desirable to use modern measurement methodologies.


    # Exercises


    +   1 Describe the conceptual meaning of Cronbach''s alpha. If your scale has
    α = 0.85, how do you interpret that number?


    +   2 Replicate the estimation of alpha and the item-total correlations for the
    GDS data presented in text and Figure 11.5 on page 198. Then replicate the estimation
    of bootstrapped CI for the subsample of N=50 presented in Table 11.2 on page 200
    and Table 11.3 on page 201. Use a seed of 3 and simple random sampling to replicate
    the selection of the N=50 sample. Then use a seed of 5 and 2000 resamples to estimate
    bootstrapped CI. By setting the seed values, you should find that your results
    match those presented in the tables exactly. Refer to Chapter 7 for more information
    about the bootstrapping process and the general syntax that is required. You can
    also check your code against that provided on the book website.


    +   3 Use the engineering data set from the book to do the following:


    +   a Make sure that all items are coded in the same direction (recode items where
    necessary) and calculate alpha for the problem-solving and interest in engineering
    scales. Also examine the item-total correlations to see whether any items could
    be removed from the scale to improve reliability.


    +   b Bootstrap confidence intervals around the alphas and interpret the replicability
    of the estimates.


    +   c Interpret alpha in terms of quality of measurement, referencing the bootstrapped
    confidence intervals.'
