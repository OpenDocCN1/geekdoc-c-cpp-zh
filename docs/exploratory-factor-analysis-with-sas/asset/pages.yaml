    # ## What Is a Higher-Order Factor?


    Whenever factors are correlated, there is, naturally, a question as to whether
    there truly are several independent factors or whether there is a single “higher-order”
    factor.¹ This has been a point of discussion for many decades, and is often conceptually
    and theoretically important. For example, is self-concept a single thing, or several
    separate things? Is depression a single construct composed of several subconstructs,
    or is it really not a coherent construct?


    Scholars writing in this area since the early 20th century have argued that when
    initial factor analyses (we can refer to these as “first-order” factors as they
    come from the first level of analysis) produce correlated factors, researchers
    should explore whether there are second- or higher-order factors in order to more
    fully explicate the model (e.g., Gorsuch, 1983; Thompson, 2004).


    There are at least two issues with higher-order factors that we need to address.
    The first is how to perform the analysis and interpret the results. The second
    issue is more conceptual: if initial EFA produces imperfect abstractions (unobservable
    variables called factors) that might'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'or might not be precise representations of population dynamics, then higher-order
    factor analysis would entail analyzing these imperfect abstractions to create
    possibly more imperfect higher-order abstractions. This makes us a bit uneasy,
    particularly in an exploratory framework. Given how volatile and unpredictable
    the results of EFA can be, it seems that taking those results and analyzing them
    again doubles (or raises to a power) the risk of going awry and far afield of
    the true character of the population dynamics.


    Another issue is whether there is a meaningful conceptual distinction between
    a single unitary factor or a multifactor construct with a unitary higher-order
    factor. We should seek to operate under principles of parsimony—in other words,
    if you as a scholar cannot meaningfully communicate why this distinction is important,
    you might want to ask whether it is worthwhile to pursue.


    Since almost all factors are correlated in the population, the assertion that
    this analysis needs to take place under these conditions should be regarded carefully.
    Researchers must decide (a) whether higher-order exploratory analyses are desirable
    and (b) how strong a correlation warrants this extra exploration. If factors are
    correlated around r = 0.25 (about 6.25% overlap), is that enough of a correlation
    to justify higher-order analysis? What about r = 0.40, which equates to only 16%
    overlap? In our opinion, it’s difficult to define what a second-order factor is.


    # # Did the Initial Solution Get It Right?


    In our mind, the primary issue to be decided prior to a higher-order factor analysis
    is whether the initial factor structure is appropriate or not. If we extract five
    factors, and then decide there is a single second-order factor (or even two second-order
    factors), the first question we would ask is whether the original solution was
    correct, or whether the correct first-order structure should have been one (or
    two) factors rather than five.1


    In the seven or eight decades since this discussion began in earnest, many things
    have changed in quantitative methods. One is the easy access to confirmatory factor
    analysis techniques. Although we have not discussed confirmatory techniques, they
    are methods for directly testing hypotheses such as whether a particular data
    set is best characterized as one, two, or five factors. Thus, before launching
    into higher-order factor analysis, we would evaluate (and replicate) whether the
    initial solution was correct. We suspect that, in many cases, the initial solution
    was indefensible or suboptimal, and that the “higher-order factors” are really
    just the more parsimonious version of what should have been extracted initially.
    We would recommend exploring higher-order factors only after the initial factor
    structure has been thoroughly vetted through CFA as the most parsimonious and
    desirable. Of course,


    1 This sort of question can spawn endless debate among scholars, and the literature
    is replete with examples of this type of debate. In our opinion, these (often
    vitriolic) debates foster because of the exploratory, volatile, and nonreplicable
    nature of these analyses. If authors would quickly replicate (or ideally) move
    to confirmatory analyses, these debates would be less apt to erupt as there are
    clear ways to test competing hypotheses.'
