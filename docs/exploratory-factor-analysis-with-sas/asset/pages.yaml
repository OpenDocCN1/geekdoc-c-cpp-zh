    despite these challenges, in a more marginal data set this might make a difference
    between a clear factor structure and an analysis that does not produce the appropriate
    factor structure. Replication might also be an issue, particularly if the proportion
    of respondents engaging in random or constant responding changes markedly.


    Unless there is an odd pattern to outliers (e.g., a bias toward a particular type
    of response), failure to check for data quality issues would lead to similar effects
    as the random responding data, depending on how egregious the outliers are. In
    general, outliers introduce error variance into the analysis, as random responding
    does. Thus, we should see similar results across different types of outliers.
    Where one might see a difference is in the common case of government data sets,
    where missing data values are often coded as a numeric value, such as 98 or 99.
    If this occurred in the SDQ data above where all valid variables range from 1-6,
    values of 98 or 99 could cause a large amount of error variance to be introduced
    into the analysis.


    # Missing Data


    # What Is Missing or Incomplete Data?


    Missing data is an issue in exploratory factor analysis because EFA will analyze
    only complete cases, and thus any case with missing data will be deleted. This
    can reduce'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'sample size, causing estimates to be more volatile. If missingness is random,
    then your estimates should be unbiased. However, it is unusual for missing data
    to be completely at random. Thus, it is likely that missing data is causing bias
    in the results in addition to reducing sample size—unless you deal with the missing
    data in some appropriate manner. In SAS, we can see how many cases are missing
    a response by adding the missing option on the TABLE statement of PROC FREQ (e.g.,
    table variable_names /missing).


    If any data on any variable from any participant is not present, the researcher
    is dealing with missing or incomplete data. In many types of research, there can
    be legitimate missing data. This can come in many forms, for many reasons. Most
    commonly, legitimate missing data is an absence of data when it is appropriate
    for there to be an absence. Imagine you are filling out a survey that asks you
    whether you are married, and if so, how happy you are with your marriage. If you
    say you are not married, it is legitimate for you to skip the follow-up question
    on how happy you are with your marriage. If a survey asks you whether you voted
    in the last election, and if so, how much research you did about the candidates
    before voting, it is legitimate to skip the second part if you did not vote in
    the last election.


    Legitimately missing data can be dealt with in different ways. One common way
    of dealing with this sort of data could be using analyses that do not require
    (or can deal effectively with) incomplete data. These include things like hierarchical
    linear modeling (HLM; Raudenbush & Bryk, 2002) or item response theory. Another
    common way of dealing with this sort of legitimate missing data is adjusting the
    denominator. Again taking the example of the marriage survey, we could eliminate
    non-married individuals from the particular analysis looking at happiness with
    marriage, but would leave non-married respondents in the analysis when looking
    at issues relating to being married versus not being married. Thus, instead of
    asking a slightly silly question of the data—“How happy are individuals with their
    marriage, even unmarried people?”—we can ask two more refined questions: “What
    are the predictors of whether someone is currently married?” and “Of those who
    are currently married, how happy are they on average with their marriage?” In
    this case, it makes no sense to include non-married individuals in the data on
    how happy someone is with marriage.


    Illegitimately missing data are also common in all types of research. Sensors
    fail or become miscalibrated, leaving researchers without data until that sensor
    is replaced or recalibrated. Research participants choose to skip questions on
    surveys that the researchers expect everyone to answer. Participants drop out
    of studies before they are complete. Missing data also, somewhat ironically, can
    be caused by data cleaning (if you delete outlying values).


    Few authors seem to explicitly deal with the issue of missing data, despite its
    obvious potential to substantially skew the results (Cole, 2008). For example,
    in a recent survey of highly regarded journals from the American Psychological
    Association, the first author and his students found that just over one-third
    (38.89%) of authors discussed the issue of missing data in their articles. Do
    those 61% who fail to report anything relating to missing data have complete data
    (rare in the social sciences, but possible for some authors), do they have complete
    data because they removed all subjects with any missing data (undesirable, and
    potentially biasing the results, as we discuss below), did they deal effectively
    with the missing data and fail to report it (less likely, but possible), or did
    they allow the statistical software to treat the missing data via whatever the
    default method is, which most often leads to deletion of subjects with missing
    data? If this survey is representative of researchers across the'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'sciences, we have cause for concern. Of those researchers who report something
    to do with missing data, most reported having used the classic methods of listwise
    deletion (complete case analysis) or mean substitution, neither of which are best
    practices (Schafer & Graham, 2002). In only a few cases did researchers report
    doing anything constructive with the missing data, such as estimation or imputation.


    # Dealing with Missing Data


    Regression and multiple imputation have emerged as two more progressive methods
    of dealing with missing data, particularly in cases like factor analysis where
    there are other closely correlated variables with valid data. Regression imputation
    (also referred to as simple imputation) creates a regression equation to predict
    missing values based on variables with valid data. After each missing value is
    replaced, analysis can continue as planned. A popular type of regression imputation
    used in factor analysis is the expectation–maximization (EM) algorithm. This algorithm
    uses an iterative maximum likelihood process to identify the best estimates for
    each missing value. The EM algorithm is available through the MI procedure in
    SAS (SAS Institute Inc., 2015). We will review an example of this process in the
    next section. The EM algorithm, along with other forms of regression imputation,
    has been shown to be superior to mean substitution or complete case analysis,
    particularly when data is not missing completely at random (Graham, 2009).


    Multiple imputation takes the concept of imputation a step further by providing
    multiple estimates for each missing value. A variety of advanced techniques—e.g.,
    EM/maximum likelihood estimation, propensity score estimation, or Markov chain
    Monte Carlo (MCMC) simulation—are used to provide the estimates and create multiple
    versions of the same data set (sort of a statistician’s view of the classic science
    fiction scenario of alternate realities or parallel universes). These parallel
    data sets can then be analyzed via standard methods and results combined to produce
    estimates and confidence intervals that are often more robust than simple imputation
    or previously mentioned methods of dealing with missing values (Schafer, 1997,
    1999). However, little attention has been given to methods to combine the results
    from imputed data sets. Because most factor analysis models do not include readily
    available estimates of standard error, more commonplace methods of aggregating
    results through PROC MIANALYZE are not available. Researchers have recommended
    many alternatives, including averaging component loadings after correcting for
    the alignment problem (reviewed in Chapter 7), conducting analysis on the average
    correlation or covariance matrix produced by imputed data sets, or using a generalized
    Procrustes analysis to pool loadings (Ginkel & Kroonenberg, 2014).


    Since the goal of EFA is primarily exploration, it is important to simply recognize
    the role of missing data. We do not believe that the more complex multiple imputation
    methods are necessary in the context of EFA—especially because they can be programmatically
    challenging! Instead, explore your data and try to understand the impact of any
    missingness. If you have concerns about missing data, try using a regression imputation
    method.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Application: Nonrandom Missingness and Imputation\n\nLet's examine the effect\
    \ of nonrandom missingness on our results and the potential improvement offered\
    \ by the EM algorithm. Using the same SDQ sample of 300 students that we used\
    \ earlier, we simulated some nonrandom, arbitrary missingness by recoding values\
    \ of “6” to system missing values for the first English item (Eng1: I learn things\
    \ quickly in English classes). This created a biased sample eliminating those\
    \ students who answered the most optimistically about their learning in English\
    \ (76 out of 300 students).\n\nWe then used the MI procedure to estimate the EM\
    \ covariance matrix. This covariance matrix is requested on the EM statement.\
    \ We use all of the variables to produce the final estimates by specifying _ALL_\
    \ on the VAR statement. Although we have only the variables that we plan to analyze\
    \ in this data set, it is often useful to include all variables, even those not\
    \ in the analysis, during this step. This helps provide the most information possible\
    \ when estimating missing values. PROC MI then outputs a single covariance matrix\
    \ that can be read into the FACTOR procedure and used for subsequent analysis.\
    \ This syntax is presented below.\n\n```\n*Impute missing via EM algorithm;\n\
    proc mi data=nonrandom_miss nimpute=0;\n   em outem=em_covar_matrix;\n   var ALL_;\n\
    run;\n*Run EFA on imputed covariance matrix;\nproc factor data = em_covar_matrix\
    \ nobs=300 nfactors = 3 method = uls\n   rotate=oblimin;\n   var Math: Par: Eng:;\n\
    run;\n```\n\nThe MI procedure provides some useful tools to help understand patterns\
    \ of missingness. Figure 8.1 on page 153 displays the missing data summary output\
    \ by the procedure. It shows the patterns of missingness that were identified\
    \ and summarizes the mean value for each variable among the different groupings.\
    \ We can see that our data includes only two missingness patterns: 1) cases with\
    \ complete data and 2) cases missing data for Eng1. We can also compare the mean\
    \ values of the variables along these groupings. In general the values seem close,\
    \ but there are a few items where the groups have greater differences in average\
    \ response (e.g., Eng2, Eng3)."
