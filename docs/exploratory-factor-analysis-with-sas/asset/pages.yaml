- pgno: 122
  md: 'However, there are often barriers to replication analysis. Foremost among these
    barriers is the lack of adequate sample size in most EFAs that are reported in
    the literature. The first priority for researchers should be adequate samples.
    The second should be estimation of the replicability (or stability) of the model
    presented. In the next chapter we review bootstrap analysis as a potential solution
    to this issue, as it allows use of a single, appropriately large sample to estimate
    the potential volatility of a scale.


