    as correlation coefficients (for a simple example), these represent a substantial
    range of variance accounted for (43.56% vs 79.21%). Of course, these are interpreted
    in a more complex manner than a simple correlation coefficient, but our point
    is that these are not precise (nor reliable) estimates of the population parameter,
    and, as such, should give you pause. Remember that this is a scale that had very
    strong psychometric properties.


    If you find yourself unconvinced, review the previous chapter on bootstrap resampling
    and examine the replicability of the pattern matrices. The engineering scale was
    rather solid and stable, with relatively narrow confidence intervals around the
    pattern loadings. Although, even these narrow confidence intervals contain more
    variability than desirable when estimating factor scores. A similarly sized sample
    from the SDQ data set exhibited even larger confidence intervals around its coefficients.
    Thus, pattern loadings and subsequent factor scores can vary more among scales
    with a less clear structure. You can also refer to Grice''s (2001) excellent work
    on the topic for more information.


    # What Are Modern Alternatives?


    **Structural equation modeling.** Structural equation modeling (SEM) explicitly
    models latent variables. However, factor scores tend to estimate what individuals
    *might* score on a factor. If the goal is to attempt to understand how latent
    variables (constructs) relate to each other, we have been able to directly model
    this for a while now, and this might be a good alternative for some. However,
    SEM has many of the same drawbacks in terms of replication that we just discussed
    in relation to multiple regression and EFA. Most notably, it will tend to overfit
    the model to the sample, so if the sample is quirky, small, or contains biases
    or error, the solution will not be as generalizable as we would hope. So SEM is
    not a panacea. You must have an unbiased, large sample in order to hope for replicability—and
    then you should test whether the results replicate or not.


    **Rasch measurement and item response theory (IRT).** Two examples of modern measurement
    theory, Rasch measurement and IRT, seek to understand how patterns of responses
    across items of different ''difficulty'' can help estimate a person''s score on
    a'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'construct. Rasch and IRT models have many similarities, but scholars in both
    groups will tell you they are different in important ways. However, one important
    characteristic underlying both sets of models is that they can provide estimates
    of item characteristics that are independent from the sample in which they were
    estimated. In other words, a sample low on the construct of interest and a sample
    high on the construct of interest can yield nearly identical item level results.
    These item parameters can then be used to compute a consistent score for a construct
    of interest. We leave it to you to pursue this topic further, as there are great
    books on both. For example, we find Bond & Fox (2006) an accessible and helpful
    book on Rasch measurement, and Baker (1985) and Embretson & Reise (2000) to be
    accessible and informative books about IRT.


    # Summary


    Factor scores have a long tradition within many disciplines, and indeed at one
    time were very progressive. In some disciplines, they might still be important
    tools. Thus, we provided this brief chapter. However, we also urge caution in
    their use. Given what we know about the volatility of EFA analyses (even when
    the scale is traditionally strong with an unusually clear factor structure), and
    the conceptual and mathematical issues with factor scores (e.g., controversial
    mathematical issues like indeterminacy dating back to the early 20th century),
    individuals wanting to use this technique must be aware of these limitations.
    It might be useful to attempt to estimate the extent to which factor loadings
    are volatile or stable (particularly across samples or subgroups), and it might
    also be useful to consider latent variable modeling (SEM) or modern measurement
    alternatives (e.g., Rasch, IRT) instead. Rasch analysis, IRT, and SEM have not
    solved all our problems in measurement, but they might have advantages for some
    applications. (See also DiStefano, Zhu, & Mîndrilă (2009.) They are better suited
    to large samples, but as we hope we have persuaded you by now, EFA should also
    be a large sample procedure.


