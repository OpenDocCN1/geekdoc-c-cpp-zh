- pgno: 82
  md: 'This is because these factors are modestly correlated, but the orthogonal mandate
    to maintain a 90° angle between axes means that the centroids of the clusters
    cannot move closer to the axis lines.


    In this case, the difference between the oblique and orthogonal methods is not
    great, but it is noticeable. This is a small but clear example of the higher efficacy
    of oblique rotations to create clear patterns of results in EFA where the factors
    are indeed correlated. As far as we are aware, there is no rationale for using
    orthogonal rotation instead of oblique rotation (except tradition). Furthermore,
    if factors are uncorrelated, orthogonal and oblique solutions will yield very
    similar results. Thus, if there is uncertainty about the relationship between
    the factors, we would recommend using an oblique rotation.'
  merge: -1
