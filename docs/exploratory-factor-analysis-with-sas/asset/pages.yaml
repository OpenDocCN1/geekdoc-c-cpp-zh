- pgno: 211
  md: 'Because the steps are somewhat complicated but repetitive for each random sample,
    we wrote a macro called subNBoot to do these steps for each sample. The syntax
    is presented below. There are two arguments that are fed into subNBoot: 1) ss,
    which stands for the numeric sample size value that we would like our subsample
    to have, and 2) seed, which stands for the numeric seed value that surveyselect
    will use to identify a sample. Setting the seed allows our analyses to be replicated.
    subNBoot then uses a series of procedures that you were introduced to in the current
    chapter (PROC CORR) and Chapter 7 (PROC SURVEYSELECT and PROC UNIVARIATE) to estimate
    the CI. This macro results in a set of data sets that contain the actual estimates
    (orig_alpha&ss 1 and orig_item&ss) and the bootstrapped CI (ci_alpha&ss and ci_item&ss).


    ```

    *MACRO subnBoot(ss,seed);

    *Subsample;

    proc surveyselect data=marshdata method=SRS n=&ss.

    out=marsh_sub&ss. seed=&seed;

    run;

    *Estimate Item Stats;

    ods output CronbachAlpha=orig_alpha&ss CronbachAlphaDel=orig_item&ss;

    proc corr data=marsh_sub&ss. alpha;

    var GDS:;

    run;

    ods output close;

    *Take Bootstrap Sample;

    proc surveyselect data = marsh_sub&ss. method = URS samprate = 1

    outhits out = output_marsh&ss. (compress=binary) seed = 5 rep =

    2000;

    RUN;

    *Estimate Item Stats for each bootstrap sample;

    ods output CronbachAlpha=boot-alpha&ss. (compress=binary)

    CronbachAlphaDel=boot_item&ss. (compress=binary);

    proc corr data=output_marsh&ss. alpha nosimple noccorr nopro;

    by replicate;

    var GDS:;

    run;

    ods output close;

    *Estimate CI from bootstrapped results;

    proc univariate data=boot_alpha&ss.;

    where variable=''Raw'';

    var Alpha;

    output out=ci_alpha&ss. pctlpts=2.5, 97.5 mean=Alpha_mean

    std=Alpha_std pctlpre=Alpha_ci ;

    ```'
  merge: -1
  img_proc: true
