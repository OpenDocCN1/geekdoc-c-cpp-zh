- pgno: 81
  md: "Note: (a) unrotated factor matrix; (b) pattern matrix; (c) reference structure\
    \ matrix; and (d) structure matrix.\n\n# Which Method?\n\n# Orthogonal vs Oblique\n\
    \nOrthogonal and oblique rotations will produce virtually identical solutions\
    \ in the case where factors are perfectly uncorrelated. As the correlation between\
    \ latent variables diverges from r = 0.00, the oblique solution will produce increasingly\
    \ cleaner rotated factor patterns.\n\nUsing the following syntax, we can try each\
    \ type of rotation on the engineering data and output a plot of the rotated factor\
    \ loadings from the pattern matrix. We use ODS to plot the results, and request\
    \ the plots of the factor loadings by including the PLOTS = LOADINGS option on\
    \ the FACTOR statement.\n\n```\n```\nods graphics on; width = 4in height = 6in;\n\
    proc factor data = engdata nfactors = 2 method = printr priors = SMC\n   rotate\
    \ = VARIMAX plots = loadings ;\n   VAR EngProb: INTERESTeng ;\nrun;\nproc factor\
    \ data = engdata nfactors = 2 method = printr priors = SMC\n   rotate = QUARTIMAX\
    \ plots = loadings ;\n   VAR EngProb: INTERESTeng ;\nrun;\nproc factor data =\
    \ engdata nfactors = 2 method = printr priors = SMC\n   rotate = EQUAMAX plots\
    \ = loadings ;\n   VAR EngProb: INTERESTeng ;\nrun;\nproc factor data = engdata\
    \ nfactors = 2 method = printr priors = SMC\n   rotate = PROMAX plots = loadings\
    \ ;\n   VAR EngProb: INTERESTeng ;\nrun;\nproc factor data = engdata nfactors\
    \ = 2 method = printr priors = SMC\n   rotate = OBLIMIN plots = loadings ;\n \
    \  VAR EngProb: INTERESTeng ;\nrun;\nods graphics off;\n```\n```\n\nFigure 4.3\
    \ on page 71 presents the rotated factor loading plots for the engineering data\
    \ using each of the methods summarized earlier in the chapter. The two uppermost\
    \ plots represent the oblique methods, but the remaining represent the orthogonal\
    \ methods. Notice that the factor loadings in the oblique plots cluster around\
    \ the axes. In contrast, the factor loadings in the orthogonal plots tend to cluster\
    \ around a point slightly away from the axes."
  merge: -1
