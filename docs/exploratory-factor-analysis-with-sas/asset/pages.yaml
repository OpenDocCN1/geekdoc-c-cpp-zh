    method must be specified. |

    | VarExplain | Variance explained | |


    The PROC FACTOR syntax is similar to what we have used before, with one exception:
    the BY statement. The BY statement conducts the analysis requested for each of
    the groups identified by the variable in the BY statement. In this case, our different
    resamples in our input data set (outboot_eng) are identified by the unique ID
    value in the replicate variable. Thus, the current syntax will conduct the analysis
    separately for each resample. If we do not include the BY statement, the FACTOR
    procedure will use all of the records in the data set and conduct one analysis.'
