    the CORR option in the FACTOR statement. |

    | Eigenvalues | Preliminary eigenvalues and the eigenvalues of the reduced correlation
    matrix | |

    | FactorPattern | Unrotated factor pattern matrix | |

    | FactorStructure | Rotated factor structure matrix | An oblique rotation method
    must be specified. |

    | FinalCommun | Final communality estimates | |

    | InterFactorCorr | Factor correlation matrix | An oblique rotation method must
