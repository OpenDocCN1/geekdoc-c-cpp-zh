    Both methods, ML and ULS extraction, identify three factors to be extracted from
    the original sample and the reduced sample using the Kaiser Criterion (eigenvalue
    > 1). The 95% CI around the ULS estimates of the third and fourth eigenvalues
    indicates there is a clear delineation and the factor structure of the reduced
    sample is likely to replicate. Notice the original sample eigenvalues are also
    well within the 95% CI produced from our reduced sample—this is a nice check that
    our results do indeed generalize!


    The 95% CI around the ML estimates tells us a slightly different story. These
    estimates appear to have a tail to the right and the CI for the fourth eigenvalue
    contains 1. The tail suggests that our reduced sample is likely suffering from
    some degree of non-normality and ML is having a difficult time producing stable
    estimates. The inclusion of 1 in the CI for the fourth eigenvalue means this factor
    structure might not replicate very well. In some instances, four factors might
    be extracted instead of three. Finally, when we compare the results from our reduced
    sample to those from our original sample, we can see that one of the eigenvalues
    from our original sample is not within the 95% CI produced from the reduced sample.
    Altogether, we can clearly see there are problems with ML extraction in this reduced
    sample. The 95% CIs are useful in helping us to detect the problems.


    Factor loadings. We continue by examining the pattern matrix factor loadings that
    were output using ULS extraction. The factor loadings were run through our macro
    presented above, %checkFactorOrder, to clean them (i.e., take absolute values
