    # Why Use OOP?


    Throughout this chapter, we have discussed what OOP is and we have even discussed
    how to create classes and objects. However, I think it is important to discuss
    why you want to use OOP principles in your development.


    If you take a look at the popular programming languages of the day, all of them
    use the OOP principles to a certain extent. Objective-C, C++, Visual Basic, C#,
    and Java will require the programmer to understand classes and objects to successfully
    develop in those languages. In order to become a developer in today''s world,
    you will need to understand OOP. But why use it?


    # It is everywhere


    Just about any development you choose to do today will require you to understand
    object-oriented principles. On Mac OS X and in iOS, everything you interact with
    will be an object. For example, simple windows, buttons, and text boxes are all
    objects and have properties and methods. If you want to be successful as a programmer,
    you will need to understand OOP.


    # Eliminate Redundant Code


    By using objects, you can reduce the amount of code you have to retype. If you
    write code to print a receipt when a customer checks out, you will want that same
    code available when you need to reprint a receipt. If you placed your code to
    print the receipt in the Sales class, you will not have to rewrite this code again.
    This not only saves time, but often will help you eliminate mistakes. If you do
    not use OOP and there is a change to the invoice (even something as simple as
    a graphic change), you will have to make sure the change in your desktop application
    and the mobile application. If you miss one of them, you run the risk of having
    the two interfaces behave differently.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Ease of Debugging


    By having all of the code relating to a book in one class, you know where to look
    when there is a problem with the book. This may not sound like such a big deal
    for a little application, but when your application gets to hundreds of thousands
    or even millions of lines of code, it will save you a lot of time.


    # Ease of Replacement


    If you place all of your code in a class, then as things change in your application,
    you can change out classes and give your new class completely different functionality.
    However, it can interact with the rest of the application in the same way as your
    current class. This is similar to car parts. If you want to replace a muffler
    on a car, you do not need to get a new car. If you have code related to your invoice
    scattered all over the place, it makes it much more difficult to change items
    about a class.


    # Advanced Topics


    We have discussed the basics of OOP throughout this chapter, but there are other
    topics that are very important to your understanding.


    # Interface


    As we have discussed in this chapter, the way the other objects interact each
    each is with methods. We discussed the header files created when you create a
    class. This is often called the interface because it tells other objects how they
    can interact with your objects. Implementing a standard interface throughout your
    application will allow your code to interact with different objects in similar
    ways. This will significantly reduce the amount of object specific code you need
    to write.


    # Polymorphism


    Polymorphism is the ability of an object of one class to appear and be as an object
    of another class. This is usually done by creating methods and properties that
    are similar to those of another class. A great example of polymorphism that we
    have been using in the bookstore. In the bookstore, we have three classes: Book,
    Magazine, and Newspaper. If we wanted a big sale for our entire inventory, we
    could go through all of the books and mark them down. Then we could go through
    all of the magazines and mark them down, and then. That would be more work than
    we would need to do. It would be better to make sure all of the classes have a
    markdown method. We could call that on all of the objects needing to know which
    class they were as long as they are subclasses of a class that contained the methods
    needed. This would save a bunch of time and coding.'
  merge: -1
  img_proc: true
