- pgno: 140
  md: '# CHAPTER 7: Objective-C Classes, Objects, and Methods


    based on the name, for all practical purposes, a message and a method name are
    synonymous.


    If a class does not understand a message, message is passed to the parent object;
    in this case, NSObject. If that parent object doesn''t understand the message,
    the message is passed to its parent, and so on, until the message is found or
    not. This behavior is called dynamic binding, which means the method is found
    at runtime instead of compile time. Dynamic binding allows an Objective-C program
    to react to changes while the program is running—this is one of the huge advantages
    Objective-C has over other languages.


    Messages can also have parameters passed along with them. Why pass parameters?
    Parameters are passed for several reasons. First (and most common), the range
    of possibilities is too large to separate methods. The data you need to store
    in your object is variable—like a radio station. In this example, you will see
    that it won''t be practical to write a method for each and every possible radio
    frequency; instead, the frequency is passed as a parameter. The same applies to
    the station name.


    ```

    [myStation frequency:104.7];

    ```


    The message is frequency:: The colon indicates that the message needs a parameter.
    Messages can have several parameters, as the following example illustrates:


    ```

    myStation = [[RationStation alloc] initWithName:"KZZP" atFrequency:104.7];

    ```


    The message we''re interested in is


    ```

    initWithName:atFrequency;

    ```


    It''s important to understand the message and how it''s structured, especially
    when you actually implement the code. In your code, you''ll need to make sure
    you implement the initWithName:atFrequency: method; otherwise, the program won''t
    work.


    In the preceding example, the message contains two station name and its frequency.
    What''s interesting about Objective-C relative to other languages is that the
    methods are essentially named parameters. If it were a C++ or Java program, the
    call would be


    ```

    myObject = NewRadioStation("KZZP", 104.7);

    ```


    While a RadioStation object''s parameters might seem obvious, having named parameters
    can be a bonus, because they more state what the parameters are used for or what
    they do. Here are some examples:


    ```

    [NSDictionary dictionaryWithContentsFile:filename];

    [my stringAtIndex:1];

    [Controller rotateToInterfaceOrientation:duration:60];

    ```


    # Using Class Methods


    A class doesn''t have to be instantiated to be used. In some cases, classes methods
    that can actually perform some operations and return values.'
