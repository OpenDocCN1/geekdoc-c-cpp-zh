    elements. This sounds like a lot to accomplish, but Objective-C, the Foundation
    framework, and the Xcode tool provide a wealth of objects and methods and a way
    to build applications with ease.


    # ## Collections


    Understanding collections is a fundamental part of learning Objective-C. In fact,
    collection objects are fundamental constructs of nearly every modern object-oriented
    language library—sometimes they are referred to as **containers**. Simply put,
    a collection is a type of class that can hold and manage other objects. The whole
    purpose of a collection is that it provides a common way to store and retrieve
    objects efficiently.'
