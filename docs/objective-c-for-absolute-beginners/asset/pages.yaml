- pgno: 10
  md: '# Chapter 1


    # # Becoming a Great iOS or Mac Programmer


    Now that you''re ready to become a software developer and have read the Introduction
    of this book, you need to become familiar with several key concepts. Your computer
    program will do exactly what you tell it to do—no more no less. It will follow
    the programming rules that were defined by the operating system and programming
    language. Your program doesn''t care if you are having a bad day or how many times
    you ask it to perform something. Often, what you think you''ve tamed your program
    to do and what it actually does two different things.


    > KEY TO SUCCESS: If you haven''t already, take a few minutes to read the Introduction
    of this book. The Introduction shows you how to access the free webinars, forums,
    and YouTube videos that go with each chapter. Also, you''ll better understand
    why we are using the Alice programming environment and how to be successful in
    developing your iOS and Mac apps.


    Depending on your background, working with something absolutely black and white
    can be frustrating. Many times, programming students have lamented, "That''s not
    I wanted to do!" As you begin to gain experience and confidence programming, you''ll
    begin to think like a programmer. You will understand software design and logic,
    and you will experience having your programs exactly as you want and the satisfaction
    associated with this.


    # ## Thinking like a Developer


    Software development involves writing a computer program and then having a computer
    execute that program. A **computer program** is the set of instructions that we
    want the computer to perform. Before beginning to write a computer program, it
    is helpful to list the steps that we want our program to perform, in the order
    we want them accomplished. This step-by-step process is called an **algorithm.**'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'If we want to write a computer program to toast a piece of bread, we would
    first write an

    algorithm. This algorithm might look something like this:


    +   1. Take the bread out of the bag.


    +   2. Place the bread in the toaster.


    +   3. Press the toast button.


    +   4. Wait for the toast to pop up.


    +   5. Remove the toast from the toaster.


    At first glance, this algorithm seems to solve our problem. However, our algorithm
    leaves

    many details and makes many assumptions. For example,


    +   1. What kind of toast does the user want? Does the user want white bread,

    wheat, or some other kind of bread?


    +   2. How does the user want the bread toasted? Light or dark?


    +   3. What does the user want on the bread after it is toasted: butter,

    margarine, honey, or strawberry jam?


    +   4. Does this algorithm work for all users in their cultures and languages?

    Some cultures may have another word for toast or not know what toast is.


    Now, you might be thinking we are getting too detailed for just making a simple
    toast

    program. Over the years, software development has gained a reputation of taking
    too

    long, costing too much, and not being the user wants. This reputation comes to
    be

    because computer programmers start writing their programs before they have

    really thought through their algorithms.


    The key ingredients to making successful applications are design requirements.
    Design

    requirements can be very formal and detailed or as simple as a list on a piece
    of paper.

    Design requirements are important because they help the developer flush out what
    the

    application should do and not when complete. Design requirements should not be

    completed in a programmer''s vacuum, but should be produced as the result of

    colaboration between developers, users, and customers.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# CHAPTER 1: Becoming a Great iOS or Mac Programmer


    > NOTE: If you take anything away from this chapter, take away the importance
    of considering design requirements and user interface design before starting software
    development. This is the most effective (and least expensive) use of time in the
    software development cycle. Using a pencil and eraser is a lot easier and faster
    than making changes to code when you didn''t look at the designs before starting
    to program.


    Another key ingredient to your successful app is the user interface (UI) design.
    Apple recommends that you spend over 50% of the entire development process focusing
    on the UI design. The design can be pencil-and-paper layouts created using the
    iPhone Sketch Book or the iPad Sketch Book by Dean Kaplan (Appress, 2009) or on-screen
    layout created with the Omni Group''s OmniGraffle (www.omnigroup.com) software
    application with the Ultimate iPhone Stencil plug-in (www.graffletopia.com). Many
    software developers start with the UI design, and after laying out all the design
    elements and having many users look at paper mock-ups, they write out the design
    requirements from their screen layouts.


    After you have done to bust all the design requirements, laid out all the user
    interfaces, and had the client(s) or potential customers look at your design and
    give you feedback, coding can begin. Once coding begins, design requirements and
    user interface screens can change, but the changes are typically minor and easily
    accommodated by the development process. See Figures 1–1 and 1–2.


    Figure 1–1 shows a mock-up of a mobile banking app prior to development using
    OmniGraffle mock-up screens along with design requirements forces developers to
    think through many of the applications usability issues before coding begins.
    This enables the application development time to be shortened and makes for a
    better user experience and better reviews on the iTunes App Store. Figure 1–2
    shows how the view for the mobile banking app actually appears when completed.'
  merge: -1
  img_proc: true
