    10 + (double)maxAMFrequency;\n11 + (double)minMFrequency;\n12 + (double)maxMFrequency;\n\
    13  \n14 - (id)initWithName:(NSString *)newName\n15     frequency:(double)newFrequency;\n\
    16 - (NSString *)name;\n17 - (void)setName:(NSString *)newName;\n18 - (double)frequency;\n\
    19 - (void)setFrequency:(double)newFrequency;\n22 @end\n```\n\n# Declaring Interfaces\
    \ and Instance Variables\n\nAn Objective-C class is defined by its **interface**.\
    \ Since objects, for the most part, are communicated with messages, the interface\
    \ of an object defines what messages the object will respond to. Line #1 imports\
    \ Foundation class definitions (more on that bit). Lines 2–7 start the definition\
    \ of the class's interface by defining its name (sometimes called the **type**)\
    \ and the inherited class. Next, there is a block, defined within the braces ({\
    \ }). This block is used to define variables that are used by the **instance**\
    \ of this class. These are called **instance variables**.\n\nWhenever the RadioStation\
    \ class is instantiated, the resulting RadioStation object has access to these\
    \ variables, which are only for specific instances. If there are ten RadioStation\
    \ objects, each object has its own variables independent of the other objects.\
    \ This is also referred to as *scope*, in that the object's variables are within\
    \ the scope of each object.\n\n# Sending Messages (Methods)\n\nEvery object has\
    \ methods. In Objective-C, the common concept to interact with an object is sending\
    \ an object message:\n\n```\n[myStation frequency];\n```\n\nThe preceding line\
    \ will send a message to an instance of the RadioStation class named myStation.\
    \ In our example, myStation is referred to as the receiver, since it receives\
    \ the message. The message (frequency in our preceding example) is used to select\
    \ which method will be called within the object. These method names appear in\
    \ a message, like the preceding one, are called **selectors**. Since a message\
    \ selects the method"
