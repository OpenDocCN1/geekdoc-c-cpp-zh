- pgno: 170
  md: '# Chapter 8


    # # Programming Basics in Objective-C


    Objective-C is a very elegant language. It mixes the efficiency of the C language
    with the object-oriented goodness of Smalltalk. This combination was introduced
    in the mid-1980s and is still powering the fantastic applications behind the iPhone,
    iPad, and Mac OS X. Well, how does a language that is over 20 years old stay relevant
    and useful after all of time? Well, some of its success has to do with the fact
    that the two languages make up Objective-C are very well tested and very well
    designed. Another reason is obvious: the various frameworks available for the
    iPhone and Mac OS X make developing full-featured applications much easier. These
    frameworks benefit from the fact that they have been around awhile, which equates
    to stability and high functionality. Lastly, Objective-C is highly dynamic. While
    we are not focusing on that particular feature in this chapter, the dynamic nature
    of Objective-C provides a flexibility not found in many compiled languages. With
    all of these great features, Objective-C and the corresponding frameworks provide
    an excellent palette to create a masterpiece!


    This chapter will introduce some of the more common concepts of Objective-C, such
    as properties and collection classes. This chapter will also show how properties
