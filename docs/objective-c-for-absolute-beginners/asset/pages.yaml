  md: '# # Protocols and Delegates


    Congratulations! You are acquiring the skills to become an iOS developer! However,
    there are two additional topics that iOS developers need to understand to be successful:
    protocols and delegates. It is not uncommon for new developers to get overwhelmed
    by these topics, so we thought it best to introduce the foundation topics of the
    Objective-C language first.


    # ## Multiple Inheritance


    We discussed object inheritance in Chapter 1. In a nutshell, object inheritance
    means a child can inherit all the characteristics of its parent. See Figure 12–1.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_267_0.png)


    Figure 12–1. Typical Objective-C inheritance'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'C++, Perl, and Python each have a feature called multiple inheritance. **Multiple
    inheritance enables a class to inherit behaviors and features from more than one
    parent.** See Figure 12–2.


    However, problems can arise with multiple inheritance because it allows for ambiguities
    to occur. Due to this, Objective-C does not implement multiple inheritances. Instead,
    it implements something called a **protocol**.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_268_0.png)


    Figure 12–2. Multiple inheritance


    # # Understanding Protocols


    Apple defines a protocol simply as a list of methods declarations, unattached
    to a class definition. with the exception that it is not defining a particular
    class. A protocol is very similar to a class interface but You must implement
    the methods listed for Protocols. For example, the methods that report user actions
    for the mouse could be placed into a protocol. See the following example:


    ```

    - (void)mouseDown:(NSEvent *)event;

    - (void)mouseDragged:(NSEvent *)event;

    - (void)mouseUp:(NSEvent *)event;

    ```


    Any class that wants to respond to mouse events could adopt the protocol and implement
    its methods. Protocols are very easy to use since they are not related to class
    hierarchy and any class can implement them.


    Throughout the book, we have used the example of a bookstore. Previously, we discussed
    the fact that our bookstore may sell different types of media and have discussed
    how inheritance would help out in that situation. For the purpose of explaining
    protocols, let’s say that our bookstore also sells gum and candy. We would want
    to create a class for those items. Call it EdibleItem. It would not make sense
    to have gum'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'inherit the same methods as a book or magazine, but all of the items would
    need to be sold and the inventory would need to be tracked. In this case, it would
    make sense to add the methods to a protocol that could be shared by each of the
    items.


    > NOTE: A protocol is much different than inheritance. When a class inherits from
    another class, it not only receives the method declarations, but it also receives
    the methods themselves. When using a protocol, the declarations are brought over,
    but the methods themselves need to be written.


    # Protocol Syntax


    The interface example for a protocol is


    ```

    @protocol InventoryItem;

    - (void)removeFromInventory;

    - (void)addToInventory;

    @end

    ```


    The implementation file for this protocol example would be


    ```

    @interface MyClass : SomeSuperClass < InventoryItem>

    @end

    ```


    Any object that wants to implement the InventoryItem protocol would include <
    InventoryItem> after the object definition.


    For example, we could create the interface for the edible objects we sell.


    ```

    @interface Edible : NSObject <InventoryItem>

    {

    }

    ```


    It is not uncommon for iOS developers to have multiple protocols for their objects.
    Additional protocols are placed after the first followed by a comma,


    ```

    @interface EditTextItem : UITableView <InventoryItem,SaleItem>

    {

    }

    ```


    This example illustrates the power of delegates. EditableItem now has all of the
    method declarations from InventoryItem and SaleItem.


    Methods that are defined for the object''s delegate are called delegates methods.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "# Understanding Delegates\n\nDelegates are helper objects. They enable us to\
    \ control the behavior of our objects. The methods listed in the protocol become\
    \ **helpers** to MyClass.\n\n> NOTE: The key to understanding delegates is to\
    \ know that a delegate is a separate object consulted in order to augment the\
    \ behavior of a host object. Then, can create an application delegate that can\
    \ affect the behavior of the iOS UIApplication object without subclassing or changing\
    \ the UIApplication class. The object you create is the delegate object, and the\
    \ messages that UIApplication will send your object are called delegate methods.\
    \ These are typically defined in a protocol (<UIApplicationDelegate>) which your\
    \ class must adopt. To work, a delegate object must be set as the delegate property\
    \ of the host.\n\nWe now use these methods in our object. For example, including\
    \ the <CLLocationManagerDelegate> protocol in MyClass interface defines our object\
    \ to be notified by the iPhone's GPS of our new location. The following example\
    \ shows the method that we will use and include inside our object's implementation\
    \ file:\n\n+   - (void)locationManager:(CLLocationManager *)manager didUpdateLocation:(CLLocation\
    \ *)newLocationLocation:(CLLocation *)oldLocation\n\nThe location manager delegate\
    \ method automatically gets called as our GPS location changes, allowing your\
    \ code to process the new and old coordinates. Listing 12-1 is an example of how\
    \ to implement didUpdateLocation and didFailWithError delegate methods from CLLocationDelegate\
    \ in our class MyCoreLocationController.\n\n**Listing 12-1.** *Core delegate example*\n\
    \n```\n```objective-c\n@implementation MyCoreLocationController //our owner controller\n\
    @synthesize locationManager;\n\n- (id)init {\n    self = [super init];\n    if\
    \ (self != nil) {\n        self.locationManager = [[CLLocationManager alloc] init];\n\
    \        self.locationManager.delegate = self; // send location updates to us\n\
    \    }\n    return self;\n}\n\n-(void)locationManager:(CLLocationManager *)manager\n\
    \    didUpdateLocation:(CLLocation *)newLocation\n    fromLocation:(CLLocation\
    \ *)oldLocation\n{\n    NSLog(\"Location: %@\", [newLocation description]);\n\
    }\nn```\n```"
