    dcountPercent=10;

    ```


    Let''s walk through the code. First, we declare our variables (totalSpent, discountThreshold,
    and discountPercent). As discussed in Chapter 3, if the number can contain decimals,
    we declare it as a float rather than an int. We know that declare these as ints.
    In this example, we assume that we have a function called calculateTotalSpent,
    which will calculate the total spent in this current order. We will simply check
    to see if the total spent is larger than the discount threshold; if it is, we
    set the discount percent. Also notice that it was not necessary to tell the code
    to convert the data when comparing the different numeric data types. As we mentioned
    earlier, this is all handled by Objective-C.


    Another action that requires the comparison of numbers is looping. As discussed
