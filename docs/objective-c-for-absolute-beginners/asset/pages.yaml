- pgno: 14
  md: '# CHAPTER 1: Becoming a Great iOS or Mac Programmer


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_14_0.png)


    **Figure 1-2.** This screenshot shows completed iPhone mobile banking application
    as it appeared on the iTunes App Store. This app is called Woodforest Mobile Banking.


    # # Completing the Development Cycle


    Now that we have our design requirements and user interface designs and have written
    our program, what''s next? After programming, we need to make sure our program
    matches the design requirements and user interface design and ensure that there
    are no errors. In programming vernacular, errors are called bugs. Bugs are undesired
    results of our programming and must be fixed before the app is released to the
    App Store. The process of finding bugs in programs and making sure it meets the
    design requirements is called testing. Anyone who is experienced in software testing
    methodology and who didn''t write the app performs this testing. Software testing
    is commonly referred to as **Quality Assurance (QA)**


    > NOTE: When an application is ready to be submitted to the iTunes App Store,
    Xcode gives the file .app extension, for example, appName.app. That is why iPhone,
    iPad, and Mac applications are called apps. We will use "program," "application,"
    and "app" to mean the same thing throughout this book.


    During the testing phase, the developer will need to work with QA staff to determine
    why the application is not working as designed. The process is called **debugging**.
    It requires'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'the developer to step through the program to find out why the application is
    not working as designed. Figure 1–3 shows the complete software development cycle.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_15_0.png)


    **Figure 1-3.** The typical software development cycle


    Frequently during testing and debugging, changes to the requirements (design)
    must occur to make the application more usable for the customer. After the design
    requirements and user interface changes are made, the process begins over again.


    At some point, the application that everyone has been working so hard on must
    be shipped to the iTunes App Store. Many considerations are taken into account
    when this happens:


    +   - Cost of development


    +   - Budget


    +   - Stability of the application


    +   - Return on investment


    There is always the give-and-take between developers and management. Developers
    want the app perfect and management want to start realizing revenue from the investment
    as soon as possible. If the release date were left up to the developers, the app
    would never likely continue to tweak the app, making it faster, more efficient,
    and more usable. At some point, however, the code needs to be freed from the developers’
    hands and uploaded to the App Store so it can do what it was meant to.


    # Introducing Object Oriented Programming


    As discussed in detail in the Introduction, Alice enables us to focus on object
    oriented programming (OOP) without having to cover all the Objective-C programming
    syntax and complex Xcode development environment in one big step. Instead, we
    can focus on learning the basic principles of OOP and using those principles quickly
    to write our first programs.


    For decades, developers have been figuring out a better way to develop code that
    is reusable, manageable, and easily maintained over the life of a project. OOP
    was designed to help achieve code reuse and maintainability while reducing the
    cost of software development.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'OOP can be viewed as a collection of objects in a program. Actions are performed
    on these objects to accomplish the design requirements.


    An object is anything that can be acted on. For example, an airplane, person,
    or screen/view on the iPad can be objects. We may want to act on the plane by
    making the plane bank. We may want the person to walk or change the color of the
    screen of an app on the iPad. Actions are all being applied to these objects;
    see Figure 1–4.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_16_0.png)


    Figure 1–4. These are two objects in an Alice application, a Dropship and Fighter.
    Both objects can have actions applied—takeoff and landing, turn right and turn
    left..


    Alice will run a program, such as the one shown in Figure 1–4, for you if you
    click the play button. When we run our Alice applications, the user can apply
    actions to the objects in our application. Similarly, Xcode is an Integrated Development
    Environment (IDE) that enables us to run our application from within our programming
    environment. We can test our applications on our computers first before running
    them on our iOS devices by running the apps in Xcode’s simulator, as shown in
    Figure 1–5.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/322e107ddf8f5cd963a6efafdcd86f38_17_0.png)


    **Figure 1-5.** This sample iPhone app contains a table object to organize a list
    of courses. Actions such as “rotate left” or “user did select row 3” can be applied
    to this object.


    Actions that are performed on objects are called **methods**. Methods manipulate
    objects to accomplish what we want our app to do. For example, for our jet object
    in Figure 1–4, we might have the following methods:


    ```

    goUp

    goDown

    bankLeft

    turnOnAfterBurns

    lowerLandingGear

    ```


    Our table object in Figure 1–5 is actually called UITableView when we use it in
    a program, and it can have the following methods:


    ```

    loadView

    shouldAutorateToInterfaceOrientation

    numberOfSectionsInTableView

    cellForForRowAtIndexPath

    diselectRowAtIndexPath

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'All objects have data that describes those objects. This data is defined as
    properties. Each property describes the associated object in a specific way. For
    example, the jet object''s properties might be as:


    +   - altitude = 10,000 feet

    - heading = North

    - speed = 500 knots

    - pitch = 10 degrees

    - yaw = 20 degrees

    - latitude = 33.575766

    - longitude = -111.857566


    For our UITableView object in Figure 1–5, the following might be our:


    +   - backgroundColor = Red

    - selectedRow = 3

    - animateView = No


    An object''s properties can be changed at any time when our program is running,
    when the user interacts with the app, or when the programmer designs the app to
    accomplish the design requirements. The values stored in the properties of an
    object at a specific time are called the state of object.


    State is an important concept in computer programming. When teaching students
    about state, we ask them to go over a window and find an airplane in the sky.
    We ask them to snap their fingers and make up some of the values that the plane''s
    properties might have at that specific time. Those values might be


    +   - altitude = 10,000 feet

    - latitude = 33.575766

    - longitude = -111.857566


    Those values represent the state of the object at the specific time that they
    snapped their fingers.


    After waiting a couple minutes, we ask the students to find that same plane, snap
    their fingers again, and record the plane''s possible state at that specific point
    in time.


    The values of the properties might be something like


