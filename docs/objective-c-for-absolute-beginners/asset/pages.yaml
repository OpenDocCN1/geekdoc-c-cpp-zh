    Figure 5-15. The finished customer class header file


    # Inheritance


    Another major quality of OOP is inheritance. Inheritance in programming is similar
    to genetic inheritance. You might have inherited your eye color from your mother
    or hair color from your father, or vice versa. Classes can, in a similar way,
    inherit properties and methods from their parent class. In OOP, a parent class
    is called a superclass and a child class is called a subclass.


    In Objective-C, all classes created by a programmer have a superclass that is
    similar to a parent class. The class will inherit characteristics from that parent
    class. So, just as in all other OOP languages, the class is a subclass of the
    parent class. In Objective-C, most of the time, your classes are subclasses of
    NSObject. In our previous example, the Customer class was a subclass of NSObject.


    We could, for example, create a class of printed materials and use subclasses
    for books, magazines, and newspapers. Printed materials have many things in common,
    so we could assign variables to the superclass of printed materials and not have
    to redundantly add them to each individual class. By doing this, we further reduce
    the amount of redundant code that is necessary for you to write and debug.


    In Figure 5-16, you will see a layout for the properties of a Printed Material
    superclass and how that will affect the subclasses of Book, Magazine, and Newspaper.
    The properties of the Printed Material class will be inherited by the subclasses
