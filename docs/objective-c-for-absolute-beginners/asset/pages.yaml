    # Managing Memory in Objective-C Without ARC


    While it is recommended to use ARC when starting new projects, sometimes there
    is a need to manage an old project that is either earlier than iOS 4 or was built
    with the retain/release model in place. For these projects, Xcode 4 will not automatically
    convert them to ARC. This section describes how to handle a program without ARC.


    As mentioned earlier, Objective-C allocated memory in a slightly different way
    than most applications written in standard C. Recall that the Objective-C system
    uses something called the retain/release model. With this model, memory that has
    been allocated by an object gets a retain message every time the application is
    interested in the memory sends a retain message to the object. At various stages
    of the application, the program indicates that it''s finished using the memory
    and sends a release message. When the number of releases equal the number of retains,
    the memory associated with the object is finally deallocated. Let''s see how this
    model looks like in practice. Listing 13–7 is a very basic example.'
