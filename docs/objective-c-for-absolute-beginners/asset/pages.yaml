    # Looking at the Thread Window and Call Stack


    As mentioned, the thread window displays the current thread (there is only one
    in our program). However, it also displays the call stack. If we look at far as
    the difference between Figures 14–9 and 14–10 as the thread window goes, we can
    see that Figure 14–10 now has the [Bookstore init] method listed because [MasterViewController
    initWithNibName:bundle:] calls the [Bookstore init] method.


    Now, the call stack is not simply a list of functions that have been called; rather,
    it''s a list of functions that are currently being called. That''s a very important
    distinction. Once the init method is finished and returns it no longer appear
    in the call stack. You can think of a call stack almost like a breadcrumb trail.
    The trail shows us how to get back to where we started.


