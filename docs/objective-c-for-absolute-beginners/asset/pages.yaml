    # Controller


    +   - Account balance view controller

    - Account transfer view controller

    - Logon view controller


    The easiest way to remember and classify your objects in the MVC paradigm is the
    following:


    **Model:** Unique business or application rules or code that represent the real
    world


    **View:** Unique user interface code


    **Controller:** Anything that controls or communicates with the Model or View
    objects


    Figure 10–2 represents the MVC paradigm.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_225_0.png)


    **Figure 10–2. MVC paradigm**


    Neither Xcode nor Interface Builder force developers to use the MVC design pattern.
    It is up to the developer to organize their objects in such a way to use this
    design pattern.


    It is worth noting that Apple strongly embraces the MVC design pattern and all
    of the frameworks are designed to work in an MVC world. This means that if you
    also embrace the MVC design pattern, working with Apple’s classes will be much
    easier. If you don''t, you’ll be swimming upstream.'
