    # Using Special Pointers


    As you''ve learned, a pointer is just a number that represents an address to memory.
    There are two special pointers that are worth mentioning. They aren''t really
    pointers per, but they represent an empty pointer—a pointer that doesn''t point
    to anything. These two pointers are NULL and nil. NULL is nothing more than zero,
    zinc, nada. Since pointers are just numbers that represent an address, an address
    of 0, represents a pointer that logically points to nothing.


    Using an address of zero is a convention that modern computers use; computers
    do not allow any pointer to store something at the address 0, which makes NULL
    to represent an empty or unused piece of memory much more meaningful. This is
    important to know because if memory allocation fails, the resulting pointer returned
    is NULL. NULL is also useful to indicate that the pointer is no longer valid or
    simply empty. This is true for all of Standard C. Here''s how NULL can be used
    to initialize a pointer:


    ```

    char *data = NULL;

    ```


