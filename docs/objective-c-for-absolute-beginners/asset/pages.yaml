- pgno: 282
  md: 'char* data2 and NSString *myString are really just variables that hold a number,
    which represents an address to memory.


    > TIP: Think of pointers this way: a pointer is like a ticket to a concert and
    the allocated memory is like the seat. The ticket has the information on how to
    get to the seat. If the ticket is discarded (or lost), the ability to find the
    seat is also lost. However, the seat (allocated memory) still remains.


    Example 2 and 3 are auto-variables that hold the "ticket" to the memory, not the
    memory itself (see Figure 13–9). This means that, when the function exits and
    the variables go out of scope, the pointers to the memory will be lost; the "ticket"
    is lost. The problem with this is that the program needs to also release, deallocate,
    the memory that the pointer points to it is lost. The manually allocated memory
    does not go out of scope with the pointer; allocated memory is global to the program
    and doesn''t get released until the program exits.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_282_0.png)


    **Figure 13–9.** A pointer is not the memory itself.


    What''s very important to remember that memory that is manually allocated must
    be deallocated at some point, depending on how the memory is used. Some memory
    might be allocated at the start of the program and doesn''t have to be released
    until the program exits. However, the most common memory allocations happen many,
    many times throughout the life program, thus it is critical that the associated
    memory be deallocated as soon as the object is no longer being used. Memory that
    is automatically allocated (i.e., char array[100]) is automatically deallocated.


    # # Deallocating Memory


    When a program allocates memory, it needs to ensure that it''s released, or deallocated,
    once the program is finished using the memory. Using the examples again, example
    2 allocates memory with the malloc call. When the program is finished with memory,
    it needs to be deallocated. Failing to deallocate memory is a common programming
    mistake and goes by the descriptive name of memory leak.


    To prevent memory leaks (which eventually lead to program crashes), allocated
    memory must be managed with care. Listing 13–2 shows how the code should look
    when properly deallocating memory for examples 2 and 3.'
