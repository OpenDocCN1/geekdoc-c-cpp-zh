  md: '# Creating an Alice App—To the Moon Alice


    We have covered some new terms and concepts, and now, it is time to do what programmers
    do—write code. It is customary for new developers to write a Hello World app as
    their first program. We will do something similar, but Alice makes it more interesting.
    We will then follow up our Alice app with our first Objective-C app.


    This Alice app will have three objects on the screen, the lunar object and two
    astronauts. One astronaut will say, "The Eagle has landed." The other astronaut
    will say, "That''s one small step for man, one giant leap for mankind."


