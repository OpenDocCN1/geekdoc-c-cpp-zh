    In this example, line 3 allocates a new object alloc. This line is actually very
    important in this situation; the reason will be explained in a bit. So line 3
    created the new string. As it''s created, the Objective-C system automatically
    sends a retain message to the object. At this point, the myString variable points
    to an object that has one retain so far.


    Line 5 issues a release to the myString object. The release subtracts one from
    the current retain count (which is 1). As mentioned before, the retain count reaches
    zero, the object is deallocated. so once line 5 has finished, the myString variable
    points to deallocated memory.


    Line 6 sets our original variable to nil to indicate that the pointer is empty.


    # Using the Retain/Release Model


    The process of retaining and releasing memory is something that Objective-C uses
    extensively to manage memory. The alternate name of this process, reference counting,
    is a little more descriptive because the process of retaining and releasing memory
    is a way of counting how many times the memory has been retained than released.
    Note the term "memory" is used here generically. Memory management in Objective-C
    allocates memory for objects instead of blocks of memory. The Objective-C base
    class NSObject, which most Objective-C objects are derived from, keeps track of
    the retain count.


    > NOTE: If you are looking for exactness, the NSObject protocol actually defines
    the reference counting messages. NSObject implements that protocol.


    So far, things sound fairly simple: for every retain, there needs to eventually
    be a release. This doesn’t sound too tricky, right? Well, its not always straightforward
    to know when an object is retained. Consider the example in Listing 13–8.'
