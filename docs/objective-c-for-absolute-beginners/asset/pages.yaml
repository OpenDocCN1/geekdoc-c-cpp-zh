  md: '# CHAPTER 10: Creating User Interfaces


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_223_0.png)


    Figure 10–1. Interface Builder


    # Understanding Interface Builder


    The operating system is responsible for the memory management of the objects it
    creates for iPhone and iPad apps. This relieves the developer of having to allocate
    memory if the developer used Interface Builder to create the object.


    Interface Builder saves the user interface file as a bundle that contains the
    interface objects and relationships used in the application. Theseพวก have the
    file extension “.NIB”. With version 3.0 of Interface Builder, a new XML file format
    was used and the file extension changed to “.XIB”. However, developers still call
    these files “NIB” files when saying or referring to the file name.


    Unlike most other graphical user interface applications, NIBs are often referred
    to as freeze-dried because they contain the archived objects themselves and are
    ready to run.'
