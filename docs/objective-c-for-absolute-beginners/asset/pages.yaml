    # Accessing Instance Variables


    Now that we have some instance variables, how can we use them? How are they accessed?
    As you learned in previous chapters, Objective-C objects respond to messages.
    Unfortunately, simply declaring an instance variable doesn''t give you access
    to it. There are two ways to access these variables.


    +   - One way is, of course, within our Book object.

    - The second way is outside of the object—that is, another part of the program
    that uses the Book object.


    If we are writing the code for a method within our Book object, accessing an instance
    variable is quite simple. For example, you could simply write the following:

    title = @"Test Title";


    The preceding line is written within the Book class. Outside of it, the title
    instance variable is not visible at all. Of course, objects need to be able to
    access these instance variables as well. To accomplish this, you need to create
    two types of methods: a getter and a setter.


    +   - getter is a method that returns the value of something in the object, typically
    an instance variable like the author from the Book object.

    - A setter is a method that updates or sets that instance variable.


    Let''s take a look at the traditional getter and setter methods that were common
    before the introduction of Objective-C 2.0 back in 2007.


    > TIP: Sometimes instance variables are referred to as ivars. Ivar is just the
    short form of instance variable.'
