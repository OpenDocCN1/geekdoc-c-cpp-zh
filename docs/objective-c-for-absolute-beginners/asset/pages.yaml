- pgno: 52
  md: '# Unicode


    Representing characters by a byte worked well for computers until about the 1990s,
    when the personal computer became widely adopted in non-Western countries where
    languages have more than 256 characters. Instead of a 1-byte character set, Unicode
    can have up to a 4-byte character set.


    In order to facilitate faster adoption, the first 256 code points are indicial
    to the ASCII character table. Unicode can have different character encodings.
    The most common encoding used for Western text is called UTF-8. As an iPhone developer,
    you will probably use this character encoding the most.


    # Data Types


    Now that we''ve discussed how computers manipulate data, we need to cover a very
    important concept called data types. Humans generally just look at data and the
    context in which it is used to determine what type of data it is and how it will
    be used. Computers need to be told how to do this. The programmer needs to tell
    the computer the type of data it is given. For example,


    2 + 2 = 4.


    The computer needs to know you to add two numbers together. In this example, they
    are integers. You might first believe that adding these numbers is obvious to
    even the most casual observer, let alone a sophisticated computer. However, it
    is common for users of iPhone apps to store data as a series of characters, not
    a calculation. For example, a text message might read


    > "Everyone knows that 2 + 2 = 4"


    In this case, we are using our previous example in a series of characters called
    a string. A data type is simply the declaration to our program that defines the
    data we want to store. A variable is stored to store data and is declared with
    an associated data type. All data is stored in a variable and the variable has
    to have a variable type. For example, in Objective-C, the following are variable
    declarations with their data types.


    ```

    int x = 10;

    int y = 2;

    int z = 0;

    char prefix = ''c'';

    NSString *submarineName = "@USS Nevada SSBN-733";

    ```


    Data types cannot be mixed with one another. You cannot do the following,


    z = x + submarineName;


    Mixing data types will cause either compiler warnings or compiler errors and your
    app will not run.


    Most data you will use in your programs can be classified into three different
    types—Boolean, numbers, and objects. We will discuss how to work with numbers
    and object'
  merge: -1
  img_proc: true
