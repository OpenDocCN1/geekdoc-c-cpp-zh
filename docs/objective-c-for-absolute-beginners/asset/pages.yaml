- pgno: 47
  md: '# Chapter 3


    # It’s All About the Data


    As you probably know, data is stored as zeros and ones in your computer''s memory.
    However, zeros and ones are not very useful to developers or app users, so we
    need to know how our program uses data and how data is stored on our computer.


    In this chapter, we will look at how data is stored on computers and how we can
    manipulate that data. Then we''ll write a fun Alice illustrating data storage
    and write the same Alice app in Objective-C. Let''s get started!


    # Numbering Systems Used in Programming


    Computers work with information differently than do humans. This section covers
    the various ways information is stored, tallied, and manipulated by devices such
    as your Mac, iPhone, and iPad.


    # Bits


    A bit is defined as the basic unit of information used by computers to store and
    manipulate data. A bit has a value of either 0 or 1. When computers were first
    introduced, transistors and microprocessors didn''t exist. Data was manipulated
    and stored by vacuum tubes being turned on or off. If the vacuum tube was on,
    the bit was 1 and if the vacuum tube was off, the value was 0. The amount of data
    a computer was able to store and manipulate was directly related to how many vacuum
    tubes it had.


    The first recognized computer was called the Electronic Numerical Integrator And
    Computer (ENIAC). It took up over 136 square meters and had 18,000 vacuum tubes.
    It was as powerful as your handheld calculator.


    Today, computers use transistors to store and manipulate data. The power of a
    computer processor depends on how many transistors are placed on its chip or CPU.
    Like the vacuum tube, transistors have an off or on state. When the transistor
    is off, its value is 0. If the transistor is on, its value is 1. At the time of
    this writing, the A5 processor that comes in the iPhone 5 and iPad 2 has a dual
    core ARM processor with'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'over 200 million transistors, up from 149 million transistors on the A4 processor
    that was in iPhone 4 and the first iPad. See Figure 3–1.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_48_0.png)


    # Moore''s Law


    The number of transistors on your iPhone or iPad’s processor is directly related
    to your device''s processing speed, memory capacity, and the sensors (accelerometer,
    gyroscope) available in the device. The more transistors, the more powerful your
    device is.


    In 1965, the cofounder of Intel, Gordon E. Moore, described the trend of transistors
    in a processor. He observed that the number of transistors in a processor doubled
    every 18 months from 1958 to 1965 and would likely continue “for at least 18 months.”
    The observation became famously known as “Moore’s Law” and have proven accurate
    for more than 55 years. See Figure 3–2.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# CPU Transistor Counts 1971-2008 & Moore''s Law


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_49_0.png)


    Figure 3–2. Moore''s Law


    NOTE: There is a downside to Moore''s Law and you have probably felt it in your
    pocket book. The problem with rapidly increasing processing capability is that
    it renders technology obsolete quickly. When you your iPhone''s two-year cell
    phone contract is up, the new iPhones on the market will be twice as powerful
    as the iPhone you had when you signed up. How convenient for everyone!


    # # Bytes


    A byte is another unit used to describe information storage on computers. A byte
    is composed of 8 bits and a convenient power of 2. Whereas a bit can represent
    to two different values, a byte can represent up to 2^8 or 256 different values.
    A byte can contain values from 0–255.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'NOTE: In Chapter 13, we discuss Base-2, Base-10, and Base-16 number systems
    in more detail. However, it is necessary to have an introduction to these systems
    in this chapter to understand data types.


    The binary number system represents numerical symbols 0 and 1. To illustrate how
    the number 71 would be represented in binary, we will use a simple table of 8
    bits (1 byte), with each bit represented as a power of 2. To convert the byte
    value 01000111 to decimal, simply add the bits. See Table 3–1.


    # Table 3-1. The number 71 represented as a byte


    | Power to 2 | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    |---|---|---|---|---|---|---|---|-|

    | Value "on" bit | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Actual bit | 0 | 0 | 0 | 1 | 0 | 1 | 1 | 1 |


    To represent the number 22 in binary, turn on the bits that add up to 22 or 00100110.
    See Table 3–2.


    # Table 3-2. The number 22 represented as a byte


    | Power to 2 | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    |---|---|---|---|---|---|---|---|-|

    | Value "on" bit | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Actual bit | 0 | 0 | 1 | 0 | 0 | 1 | 1 | 0 |


    To represent the number 255 in binary, turn on the bits that add up to 255 or
    11111111. See Table 3–3.


    # Table 3-3. The number 255 represented as a byte


    | Power to 2 | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    |---|---|---|---|---|---|---|---|-|

    | Value "on" bit | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Actual bit | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 |


    To represent the number 0 in binary, turn on the bits that add up to 0 or 00000000.
    See Table 3–4.


    # Table 3-4. The number 0 represented as a byte


    | Power to 2 | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    |---|---|---|---|---|---|---|---|-|

    | Value "on" bit | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Actual bit | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |'
  merge: -1
