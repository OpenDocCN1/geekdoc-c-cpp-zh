    +   * Pretty much everything is an object.

    * Objects receive messages. In this context, the object is sometimes known as
    the receiver since it is receiving the message.

    * Objects contain instance variables.

    * Objects and instance variables have a defined scope.

    * Classes hide an object''s implementation.


    > NOTE: As we saw in Chapter 5, the term class is used to represent, generically,
    the definition or type of an object. An object is what is created from the class.
    For example, an SUV is a class of vehicle. A class is a blueprint of sorts. A
    factory builds SUVs. The results are SUV objects that people drive. You can''t
    drive a class, but you can drive an object built from a class.


    So how do these concepts translate to Objective-C? Well, for starters, in Objective-C
    is defined using two different sections, @interface and @implementation. The @interface
    section defines what messages the object can respond to and any instance variables
    the object will using. The @implementation section contains the actual code of
    the various messages from the @interface section.


    Why is there a split between the interface and implementation? Well, Objective-C
    object is defined only once within a program. However, it might be used in many
    different areas of that program. Where the object is used, the program simply
    reads in, or imports, the interface; it would be inefficient if the code for that
    object needed to be replicated every time it was used.


    > NOTE: It is a common convention to have an object''s interface stored in an
    .h file and the implementation stored in an .m file. Both files are named after
    the object. So, if a Library object is to be defined, its interface would be Library.h
    and its implementation would be Library.m (remember that names are case-sensitive).


