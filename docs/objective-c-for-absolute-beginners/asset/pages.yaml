- pgno: 296
  md: '# Chapter 14


    # # Introducing problems the Xcode Debugger


    Xcode is fantastic! Not only is this tool provided free of charge on Apple''s
    developer site, but it is actually really, really good! Aside from being able
    to create the next great Mac OS X, iPhone, or iPad app, Xcode has a fantastic
    debugger right into the tool.


    So, what exactly is a debugger? First of all, let''s get something straight—programs
    do *exactly* what they are written to do. Sometimes, what is written isn''t exactly
    what the program is really meant to do. Sometimes, this means the program crashes
    or doesn''t do something that is expected. Whatever the case, when a programmer
    doesn''t work as planned, the program is said to have *bugs*. The process of going
    through the code and fixing these problems is **debugging**.


    There is still some debate as to the real origin of the term "bug," but one-documented
    case from 1947 involved the late Admiral Grace Hopper, a Naval reservist and programmer
    at the time. Hopper and her team were trying to solve a problem with the Harvard
    Mark II computer. One member found a moth in the circuitry that was causing the
    problem with one of the relays. Hooper was later quoted as saying, "From then
    on, when anything went wrong with a computer, we said it had bugs in it."¹


    Regardless of the origin, the term and programmers all over the world use debuggers,
    as Xcode, to find bugs in programs. People are the real debuggers; debugging tools
    merely help programmers locate problems. No debugger, whatever the name might
    imply, fixes problems all on its own.


    This chapter will highlight some of the most important features of the Xcode debugger
    and will explain how to use them. Once you are finished this chapter, you should
    have a good enough understanding of the Xcode debugger and of the debugging process
    in general to allow you to search for and fix the majority of programming issues.


    > ¹Michael Moritz, Alexander L. Taylor III, and Peter Stoler, "The Wizard Inside
    the Machine," Time, Vol. 123, no. 16: pp. 56–63'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Getting Started with Debugging


    If you''ve ever watched a movie in slow motion just so you can catch a detail
    you can''t see when the movie is played at full speed, you''ve used a tool to
    do something a little like debugging. The idea that playing the movie frame by
    frame will reveal the detail you are looking for is the same sort of idea we apply
    when debugging a program. With a program, sometimes it becomes necessary to slow
    things down a bit to see what''s happening. The debugger allows us to do this
    using two main features: setting a breakpoint and stopping the program line by
    line—more on these two features in a bit. Let''s first look at how to get to the
    debugger and what it looks like.


    First, we need to load an existing program. Our examples in this chapter use the
    Mystore project from Chapter 8, so open Xcode and load the Bookstore project.


    Second, make sure the Debug configuration is chosen on the Run Scheme, as shown
    in Figure 14-1. To edit the current scheme, choose Product>Edit Scheme from the
    main menu. Debug is the default selection, so you probably won''t want to change
    this. This step is important because if the configuration is Release, debugging
    will not work at all!


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_297_0.png)


    Figure 14-1. Selecting the Debug Configuration.


    While we won''t discuss Xcode Schemes in this book, just know that by default,
    Xcode provides both a Release and a Debug configuration option for any Mac OS
    or iOS project you create. The main difference as it pertains to this chapter
    is that a release configuration doesn''t add in any program information that is
    necessary for debugging an application, whereas the debug configuration does.'
  merge: -1
  img_proc: true
