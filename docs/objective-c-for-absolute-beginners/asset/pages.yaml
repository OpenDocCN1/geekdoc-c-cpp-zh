- pgno: 187
  md: '# Introducing Properties


    When we created instance variables for the Book object, we manually created the
    methods that could be used to access these variables. Now that you know how to
    do this manually, let''s look at how to take advantage of something called properties.
    A property is a short way of having the compiler functions to get and/or the value
    of an instance variable. As you learned earlier, instance variables are generally
    accessible from outside of the object itself, so having methods to get and set
    these variables becomes essential.


    The following is the interface (header) file to the Book object that we created
    earlier. Let''s see what it takes to have the Objective-C compiler create its
    getters and setters for us.


    +   Listing 8-13. Adding properties to the Book object.

    // Book.h

    // Mybookstore

    // Created by M.R. Fisher on 8/28/11. All rights reserved.

    // Copyright (c) 2011 www.committed-code.com.

    //

    #import <Foundation/Foundation.h>

    @interface Book : NSObject {

    }

    // @property(nonatomic,strong) NSString *title;

    // @property(nonatomic,strong) NSString *author;

    // @property(nonatomic,strong) NSString *description;

    //

    @end


    Lines 14–16 show the property declarations for the instance variables. Properties
    are not required for all instance variables, the ones we want to expose to the
    world. In the example, however, we are creating properties for all of our instance
    variables. Notice that the actual instance variable declarations used to be between
    the { } brackets are now gone. When using properties with Xcode 4 it is no longer
    necessary to declare the instance variables and the properties. The compiler is
    now smart enough to do this for you.


    A property starts with a @property directive. This tells the Objective-C compiler
    to build us the automatic getter and/or setter. Whether it is a getter and/or
    setter is included in the declaration. Let''s discuss this code:


    ```

    @property¹ (nonatomic,strong) NSString* title;

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: "# 1. This is the property directive.\n\n2. The parentheses and, comma-separated\
    \ keywords contained therein are sometimes optional. In our particular case, we\
    \ are specifying nonatomic and strong. The nonatomic keyword tells the compiler\
    \ not to generate special code for in threading—we're not using threads, so using\
    \ nonatomic is fine. The second, strong, is used to indicate that this is a strongly\
    \ typed variable—this will be discussed further in Chapter 13 when we discuss\
    \ memory management. Many other options can be included here; one is readonly,\
    \ which tells the compiler to only create a getter, not a setter, and thereby\
    \ prevents the ability for the instance variable from being external to the object.\n\
    \n3. Last, NSString* title, is the instance variable declaration. It must include\
    \ the type and, of, the instance variable name.\n\nThis defines half of the property.\
    \ That's what you say, \"Only half? What else is missing? Well, the second half\
    \ of the @property is declared in the implementation (.m) file.\n\n# 8-14. Defining\
    \ a getter and setter for the Book object.\n\n```\n//\n// Book.m\n// MyBookstore\n\
    //\n Created by M.R. Fisher on 8/28/11.\n// Copyright (c) 2011 www.committed-code.com.\
    \ All rights reserved.\n//\n// @import \"Book.h\"\n\n@implementation Book\n@synthesize\
    \ title, author, description;\n@end\n```\n\nThis is the implementation file to\
    \ the Book object. Line 12 is significant, because it is the second half of what\
    \ is required to complete our property. This part is much simpler than the interface\
    \ file. All that is necessary is to use the @synthesize keyword and provide a\
    \ list of one or more properties name. There can be many properties specified\
    \ on a @synthesis statement, and there can be many @synthesize lines, too. It's\
    \ all a matter of personal preference.\n\nNow that we've created three different\
    \ properties, how are the properties used?"
  merge: -1
