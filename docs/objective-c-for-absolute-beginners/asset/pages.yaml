    \ This variable enables the developer to specify the number of times the loop\
    \ will be executed. See Listing 4–3.\n\n**Listing 4–3.** A Count-Controlled Loop\n\
    \n```\nint i;\nfor ( i = 0; i < 10; i++)\n{\n    //repeat all code in braces 10\
    \ times\n}\ncontinue\n```\n\nThe loop in Listing 4-3 will loop 10 times. The variable\
