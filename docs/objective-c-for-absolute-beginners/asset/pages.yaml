- pgno: 222
  md: '# Creating User Interfaces


    Interface Builder is an application that enables iPhone/iPad and Mac developers
    to easily create their user interfaces using a powerful graphical user interface.
    It provides the ability to build user interfaces by simply dragging objects from
    Interface Builder''s library to your app''s interface.


    Interface Builder stores your user interface design in one or more resource files,
    called XIBs. These resource files are set to interface objects and their relationships.
    Changes that you make with your user interface are automatically synchronized
    with Xcode.


    To build a user interface, simply drag objects from Interface Builder''s Library
    Pane onto your view. Actions and Outlets are two key components of Interface Builder
    that help us streamline the development processes.


    **Actions** that our objects triggered in our views are connected to our app''s
    code. **Outlets** (pointers) declared in our object''s interface file are connected
    to specific instance variables. See Figure 10–1.


    > NOTE: Interface Builder was once a stand-alone application that developers used
    to design their user interfaces. Starting with Xcode 4.0, Apple integrated Interface
    Builder within Xcode.'
  merge: -1
  img_proc: true
