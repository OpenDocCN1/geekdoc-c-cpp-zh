- pgno: 189
  md: "# Using Properties\n\nOnce a property has been specified in both the interface\
    \ and implementation files, using the properties is very straightforward and simple.\
    \ First, the syntax changes a bit. Let's look at a traditional setter:\n\n```\n\
    [myBookObject setTitle:new]; // Traditional setter\n```\n\nHere is an example\
    \ of sending a message to set the title to our book object—like before, pretty\
    \ straightforward. However, when using properties, things change:\n\n```\nmyBookObject.title\
    \ = newTitle; // Setter example\n```\n\nSome things are very important to note.\
    \ For starters, the object access is not within brackets ([ ]). Second, use the\
    \ property called, not the setTitle method. Internally, there is still a setTitle\
    \ method; it's hidden. Why is this important? Well, if we create our own explicit\
    \ setter, our method will be called rather than the compiler-generated one. This\
    \ may or may not be the behavior we specifically want.\n\nFor the getter, things\
    \ look remarkably familiar:\nNSString* title = myBookObject.title; // Getter example\n\
    \nThe property that gets the information is also called title. The significance\
    \ here is that how the object's property is accessed whether the getter or setter\
    \ is called. If we are trying to set the variable, the setter is called. If we\
    \ are trying to get the value of the variable, the getter is called\n\nOne big\
    \ difference is that the syntax to access a property now uses a period (.) between\
    \ the object and the method. This is necessary because the brackets are gone,\
    \ so the period distinguishes between using a property and sending a message to\
    \ an object.\n\n# Understanding the Importance of Conventions\n\nAs mentioned\
    \ earlier, there is a convention to naming a getter and a setter. While naming\
    \ guidelines are not strictly enforced, the value of understanding the convention\
    \ comes when using properties. Here is our previous example:\n\n```\n(void)setTitle:(NSString\
    \ *)newTitle\nif ([newTitle length] > 0) {\n    title = newTitle;\n}\n```\n\n\
    If we create a property @property title and pair that with the @synthesize keyword,\
    \ the compiler will generate two methods—one named as the getter and one called\
    \ setTitle. However, if we provide our own setter and name it according to the\
    \ convention (like the preceding code), the compiler won't generate its own.\n\
    \n```\nmyBookObject.title = newTitle; // Call the custom setter\n```"
  merge: -1
  img_proc: true
