  md: '# Planning Classes


    Planning your classes is one of the most important steps in your development process.
    While it is possible to go back and add properties and methods after the fact
    (and you will need to do this), it is important that you know which classes are
    going to be used in your application and which basic properties and methods they
    will have. Spending time planning your different classes is very important at
    the beginning of the process.


    # Planning Properties


    Let''s look at the bookstore example and some of the classes we need to create.
    First, it is important to create a Bookstore class. A Bookstore class contains
    the blueprint of the information each Bookstore object stores, such as the bookstore
    name, address, phone number, and logo (see Figure 5-2). Placing this information
    in a class rather than coding it in your application will allow you to easily
    make changes to this information in the future. We will discuss the reasons for
    using OOP methodologies later in this chapter. Also, if your bookstore becomes
    a huge success and you decide to open up another one, you will be prepared because
    you can create another object of class Bookstore.


    | Bookstore |

    | |

    | Name |

    | Address1 |

    | Address2 |

    | City |

    | State |

    | Zip |

    | Phone Number |

    | Logo |


    Figure 5–2. The bookstore class


    Let''s also plan out a Customer class (see Figure 5–3). Notice how the name has
    been broken into First Name and Last Name. This is very important to do. There
    will be times in your project you may want to use only the first name of a customer,
    and it would be hard to separate the first name from the last if you didn''t plan
    ahead. Let''s say you want to send a letter to a customer letting them know about
    an upcoming sale. You do not want your greeting to say, "Dear John Doe." It would
    look much more personal to say, "Dear John."'
