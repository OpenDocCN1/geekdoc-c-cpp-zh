- pgno: 331
  md: '# About the Authors


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_331_0.png)


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_331_1.png)


    Mitch Fisher is a software developer in the Phoenix, Arizona, area. He was introduced
    to PCs back in the 1980s when 640 KB was considered more memory than anyone could
    ever use. Over the last 25 years, Mitch has worked for several large and medium-sized
    enterprises as a software engineer, software architect, and software managers
    and has led teams of developers on multimillion-dollar projects. Mitch now divides
    his time between writing iOS applications, creating server-side UNIX technologies,
    and teaching iOS development at xcelMe.com.


    Brad Lees has more than 14 years of experience in application development and
    server management. He has specialized in creating and initiating software programs
    in real estate development systems and financial institutions. Highlights of his
    professional career include his positions as systems manager at The Lyle Anderson
    Company, product development manager for Smash, vice president of application
    development for iNation, and information technology manager at The Orcutt/Winslow
    Partnership, the largest architectural firm in Arizona. A graduate of Arizona
    State University, Brad resides in Phoenix with his wife Natalie and their five
    children.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_331_2.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# About the Technical Reviewer


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_332_0.png)


    **James Bucanek** has spent the past 30 years programming and developing microcomputer
    systems. He has experience with a broad range of technologies, from embedded consumer
    products to industrial robotics. James currently focuses on Macintosh and iPhone
    software development. When not programming, James indulges in his love of the
    arts. He earned an associate degree in classical ballet from the Royal Academy
    of Dance, and occasionally teaches at Adams Ballet Academy.'
  merge: -1
  img_proc: true
