  md: '# CHAPTER 10: Creating User Interfaces


    The XML file format is used to facilitate storage with source control systems
    like Subversion and Git.


    In the next section, we''ll discuss an app design pattern called Model-View-Controller.
    This design pattern enables developers to more easily maintain code and reuse
    objects over the life of an app.


    # The Model-View-Controller


    Model-View-Controller (MVC) is the most prevalent design pattern used in iPhone/iPad
    development, and learning about it will make your life as a developer much easier.
    MVC is used in software development and is considered an architectural pattern.


    Architectural patterns describe solutions to software design problems that developers
    can use in their code. The MVC pattern is not unique to Apple developers; it is
    being adopted by many makers of IDEs, including those running on Windows and Linux
    platforms.


    Software development is considered an expensive and risky venture for businesses.
    Frequently, apps take longer than expected to write, come over budget, and don''t
    work as promised. OOP produced a lot of hype and gave the impression that companies
    would realize savings if they adopted their methodology, primarily because of
    reusability of objects and easier maintainability of the code. Initially, this
    didn''t happen.


    As engineers learned why OOP wasn''t living up to these expectations, they discovered
    a key shortcoming in how developers were designing their objects: developers frequently
    mixing objects together in such a way that the code became difficult to maintain
    as the application matured, moved to different platforms, or hardware displays
    changed.


    Objects were often designed so that, if any of the following changed, it was difficult
    to isolate the objects that were impacted:


    +   - Business rules

    - User interface

    - Client-server or Internet-based


    Objects can be broken down into three task-related categories. It is the responsibility
    of the developer to ensure that each of these categories keeps their objects from
    drifting across other categories. They are:


    +   1. Models: Business objects


    +   2. Views: User interface objects


    +   3. Controllers: Objects that communicate with the Models and the Views


    As objects are categorized in these groups, apps can be developed and maintained
    more easily over time. The following are examples of objects and their associated
    MVC category for an iPhone banking application:'
