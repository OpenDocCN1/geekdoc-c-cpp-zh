  md: '# Setting Breakpoints


    To see what''s going on in a program, we need to make the program pause at certain
    points that we programmers are interested in. A breakpoint allows us to do this.
    In Figure 14-2, we''ve set a breakpoint on line 25 of the program. To do this,
    simply place the cursor over the line number (not the program text, but the number
    25 to the left of the program text) and click once.


    If line numbers are not being displayed, simply Xcode > Preference from the main
    menu and then click on the "Text Editing" Tab and check the "Line Numbers" checkbox.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_298_0.png)


    Figure 14-2. Our first breakpoint


    We also remove the breakpoint by simply dragging the breakpoint to the left or
    right of the line number column and then dropping it. In Figure 14-3, the breakpoint
    has been dragged to the left of the column. Using the drag-and-drop process, the
    breakpoint will turn into a puff of smoke.'
