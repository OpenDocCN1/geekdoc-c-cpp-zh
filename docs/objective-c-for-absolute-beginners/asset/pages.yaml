- pgno: 171
  md: '# CHAPTER 8: Programming Basics in Objective-C


    There are different types of collections. While they all fulfill the same purpose
    of being able to hold other objects, they differ mostly in how the objects are
    retrieved. Here is a list of the most common collections used in Objective-C:


    +   - NSSet

    - NSArray

    - NSDictionary

    - NSMutableSet

    - NSMutableArrayArray

    - NSMutableDictionary


    Notice that, among the three collection classes listed, there is one that contains
    the word Mutable. A mutable (vs. non-mutable) class is one that can have items
    added and removed from it after the collection has been created. Mutable means
    that it can be modified. Non-mutable collections must be initialized with all
    of their values when they are first created and, thereafter, cannot be modified.


    # Using NSSet


    The NSSet is used to store an unordered list of objects. *Unordered* means exactly
    that—the objects are stored in without regard to order. The advantage of the NSSet
    is performance—it''s the fastest collection class available. Use NSSet when it
    is necessary to store a collection of objects and the order in when they are stored
    or retrieved is not crucial.


    Here is a typical NSSet initialization method:


    ```

    NSSet *mySet = [NSSet setWithObjects:@"String 1", @"String 2", @"Whatever", nil];

    ```


    As you can see, the set is initialized with a list of objects, in this case a
    list of strings. The last object must be nil to indicate the end of the list of
    objects. Also, the example uses strings, but an NSSet can be comprised of any
    object or even different types of objects, including objects from other collections!


    > TIP: All collection classes have the ability to store and manage any type of
    object at once. However, in typical cases, most programmers tend to store a single
    type of object in any one particular collection class to make the code less complicated.


    In order to go after data in the NSSet, a few methods of accessing the elements
    within an NSSet are used.One method, as shown in Listing 8–1, is what is referred
    to as a *fast enumerator* and retrieve each object one by one. Note that the fast
    enumeration below (lines #3–5) works on all collection classes.'
