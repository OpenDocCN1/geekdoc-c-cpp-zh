    # Warnings


    Warnings indicate potential problems with the program. As mentioned above, warnings
    won’t stop a program from building, but may cause issues during program execution.
    It’s outside the scope of this program to cover those that may or may not cause
    problems during program execution; however, it’s good practice to eliminate all
    warnings from a program.


    Comment out line with @synthesize ViewController (line 14 in the figure below;
    your line may be different of the MasterViewController.m file by putting two slashes
    in front of the @synthesize myBookStore, as shown in Figure 14–16. Build the project
    by pressing Cmd+B to build the program.'
