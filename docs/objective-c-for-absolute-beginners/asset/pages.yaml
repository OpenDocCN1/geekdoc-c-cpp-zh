    # Condition-Coupled Loops


    Objective-C and Alice have the ability to repeat a loop until some condition changes.
    You may want to repeat a section of your code until a false condition is reached
    with one of your variables. This type of loop is called a while loop. A while
    loop is a control flow statement that repeats based on a given Boolean condition.
    A while-loop can be thought of as a repeating statement. See Listing 4–6.


    Listing 4-6. An Objective-C While Loop Repeating


    ```

    BOOL isTrue = TRUE;

    while (isTrue)

    {

    do something;

    nisTrue = FALSE; // a condition that sometimes sets isTrue to FALSE

    }

    ....continue

    ```


    The loop in Listing 4-6 first checks if the variable isTrue is TRUE—which it is—so
    the (loop body) is entered when the code is executed. Eventually, some condition
    is reached that causes isTrue to become FALSE. After completing all the code in
    the loop body, the condition (isTrue) is checked once more, and the loop is repeated
    again. process is repeated until the variable is set to FALSE.


    # Infinite Loops


    An infinite loop repeats endlessly, either due to the loop not having a condition
    that causes termination or having a terminating condition that can never be met.


    Generally, infinite loops can cause apps to become unresponsive. They are the
    result of a side effect of a bug in the code or the logic.


    Listing 4-7. An Example of an Infinite Loop


    ```

    x = 0;

    while (x != 5)

    {

    do something;

    x = x + 2;

    }

    ....continue

    ```


    Listing 4-7 is an example of an infinite loop caused by a terminating condition
    that can never be met. The variable x will be checked with each iteration through
    the loop, but will never be equal to 5. The variable x will always be an even
    number because it was initialized to zero and incremented by 2 in the loop. This
    will cause the loop to repeat endlessly. See Listing 4–8.'
