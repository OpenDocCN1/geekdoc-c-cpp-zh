  md: "NOTE: Look at the #import statements: one uses angle brackets (< >) and the\
    \ other uses plain double quotation marks (\"). The difference is that a file\
    \ in the angle brackets indicates a system-level file, which is located using\
    \ a predefined path that Xcode automatically sets up for your project. Any file\
    \ that double quotation marks is searched for the current project. In our example,\
    \ the RadioStation.h interface file is part of our project, so we use double quotation\
    \ marks, whereas Cocoa.h file is a system file and uses the angle brackets.\n\n\
    # Coding Your Methods\n\nListing 7–2 is a simple example, but it demonstrates\
    \ what many methods look like in a class. First of all, if you look at the implementation\
    \ and interface files for one of the class methods, you can see the similarities.\
    \ The following line is from the interface file:\n\n```\n+ (double)minFrequency;\n\
    ```\n\nAs you can see, it's a class method that starts with a (+). The next item\
    \ (double) is the type of value the method will return; in this case, double.\
    \ The next part in the interface file is the name of the method, minAMFrequency.\n\
    \nThe following line is from the implementation file:\n\n```\n+ (double)minAMFrequency\
    \ {\n  return 20.0;\n}\n```\n\nThis line represents an implementation of the method\
    \ defined in the interface. The word \"implementation\" indicates that the function\
    \ is coded here. It looks almost identical to the interface file, but now contains\
    \ a block with some code, rather than simply ending with a semicolon.\n\nIn the\
    \ preceding example, the implementation of the minAMFrequency class method simply\
    \ performs a return of a numeric value (double) of 520.0.\n\nGenerally, a class\
    \ has a definition of a method in an interface file and the actual code of the\
    \ method in an implementation file.\n\nNow, we will look at the implementation\
    \ of an instance method (see Listing 7–3). There are some significant differences\
    \ between an instance and a class method; for, instance methods have the option\
    \ to use the instance variables defined in the interface file. Also, instance\
    \ methods are only available once the class has been instantiated."
