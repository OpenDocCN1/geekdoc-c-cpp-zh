  md: '# Human Interface Guidelines (HIGs)


    Before you get excited and begin designing dynamic user interfaces for your app,
    you need to learn some of the ground rules. Apple has developed one of the most
    advanced operating systems in the world with iOS 5. Additionally, Apple''s products
    are known for being intuitive and user-friendly. Apple wants users to have the
    same experience from one app to the next.


    In order to insure a consistent user experience, Apple provides developers guidelines
    on how their apps should look and feel. These guidelines, called the human interface
    guidelines (HIGs), are available for the Mac, iPhone, and iPad. You can download
    these docs at http://developer.apple.com. See Figure 10-3.


    ![](img/322e107ddf8f5cd963a6efafdcd86f38_226_0.png)


    Figure 10-3. Apple''s human interface guidelines (HIGs) for iOS devices and Macs


    > NOTE: Apple''s HIGs are more than recommendations or suggestions. Apple takes
    them very seriously. While the HIGs don''t describe how to implement your user
    interface designs in code, they are great for understanding the proper way to
    implement your views and controls.


    The following are the top reasons apps are rejected in Apple''s iTunes App store:


    +   1. The app crashes

    2. Violation of the HIGs

    3. Uses Apple Private APIs

    4. Doesn''t function as advertised on iTunes App Store


    You can read, learn, and follow the HIGs before you develop your app, or you can
    read, learn, and follow the HIG after your app gets rejected by Apple and you
    to rewrite'
