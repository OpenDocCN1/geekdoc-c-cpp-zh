    \ a condition is met.\n\n# ## Using Loops to Repeat Program Statements\n\nA **loop**\
    \ is a sequence of program statements that is specified once, but can be repeated\
    \ several times in succession. A loop can repeat a specified number of times (count-controlled)\
    \ until some condition (condition-controlled) occurs.\n\nIn this section, you'll\
    \ learn about count-controlled loops and condition-controlled loops. You will\
