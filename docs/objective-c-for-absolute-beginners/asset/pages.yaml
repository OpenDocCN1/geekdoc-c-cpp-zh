  md: '# Chapter 6


    # # Learning Objective-C and Xcode


    For the most part, all computer languages perform the typical tasks any computer
    needs to do—store information, compare information, make decisions about that
    information, and perform some action based on those decisions. Objective-C is
    a language that makes these tasks easier to understand and accomplish. The real
    trick with Objective-C (actually, the trick with any C language) is to understand
    the symbols and keywords used to accomplish those tasks. This chapter continues
    our examination of Objective-C and Xcode so you can become even familiar with
    them.


    # ## A Brief History of Objective-C


    Objective-C is a real combination of two languages, C language and a lesser-known
    language called Smalltalk. Back in the 1970s, very bright engineers from Bell
    Labs created a language named C that made it easy to port their pet project, the
    Unix operating system, from one machine to another. Prior to C, people had to
    write programs in assembly. The problem with assembly languages is that each is
    specific to its machine, moving software from one machine to another was nearly
    impossible. The C language, created by Brian Kernighan and Dennis Ritchie, solved
    this problem by providing a language that wrote out the assembly language for
    whatever it supported, a kind of Rosetta Stone for early computer languages. Because
    of its portability, C quickly became the *de facto* language for many types of
    computers, especially early PCs.


    Fast forward to the early 1980s and the C language is on its way to becoming one
    of the most popular languages of the decade. Around this time, an engineer from
    a company called Stephenson was mixing the C language with another called Smalltalk.
    The C Language is typically referred to as a *procedural language*, a language
    that uses procedures to divide up processing steps. Smalltalk, on the other hand,
    was something entirely different. An *object-oriented programming language*. Instead
    of processing things procedurally, it used programming objects to get'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'its work done. This new superset of the C language became known as "C with
    Objects"

    or more commonly, Objective-C.


    In 1985, Brad Cox sold the Objective-C language and trademark to NeXT Computer,
    Inc.

    Next was the brainchild of Steve Jobs, who had been fired from his own company,

    Apple Computer, that very year. NeXT used the Objective-C language to build the

    NEXTSTEP operating system and its suite of development tools. In fact, the Objective-C

    lave NeXT a competitive advantage with all of its software. Programmers

    using NEXTSTEP and Objective-C could write programs faster than writing in the

    ttraditional C language. While the hardware part of Next computers never took
    off,

    the operating system and tools did. Interestingly, NeXT was purchased by Apple

    Computer in late 1996 with the intention of replacing its aging operating system,

    had in existence since the first Macintosh was developed in 1984. Four years after

    acquisition, what had had been NEXTSTEP reemerged as Mac OS X—with Objective-C

    st at the heart of the system.


    # Understanding the Language Symbols


    Even though Objective-C integrates a great deal of object-oriented language, at
    the

    heart of Objective-C is C. Here are some of the symbols and language constructs
    used

    in Objective-C, some of which are part of the C language and most of which we''ve\already
    encountered in one way or another. It''s not important to know which are pure
    C

    or which are not; just know that the old and the newer symbols/constructs together

    make the Objective-C language.


    +   { This is the begin brace. It''s used to begin what is commonly referred

    to a block of code. Blocks are used to define and surround a

    section of code and define its scope.


    +   } This is the end brace. It''s used to end a block of code. Wherever

    there is a begin { }, there must always be an accompanying end { }.


    +   - (void)methodName This is how Objective-C method is defined.

    The word methodName of course can represent any name. The word

    (void) can also change. It represents what type of information the

    method represents. In this example, (void) indicates there is no data

    type associated with this method (data types were introduced in

    Chapter 3 and will be covered in more depth in later chapters). (void)

    could be replaced with something like (NSString*). This will be

    discussed further later on.


    +   * The asterisk (referred to as ''star'' or ''splat'') is used to represent
    what

    is called a pointer (see Chapter 13). All''s really important to know

    for now is that when you see something like NSString*, consider part

    of the name. NSString and NSString* are completely different.'
