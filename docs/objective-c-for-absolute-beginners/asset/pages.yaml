- pgno: 145
  md: '# Listing 7-3. The Implementation of an Instance Method


    ```

    1 - (id)initWithName:(NSString*)newName atFrequency:(double)newFrequency {

    2 self = [super init];

    3 if (self != nil) {

    4 name = newName;

    5 frequency = newFrequency;

    6 }

    7 return self;}

    ```


    Listing 7–3 illustrates the implementation of one of the instance methods of your
    radio station class. An initialization method accepts a new name and frequency.
    Many OS X and iOS classes have similar initialization instance methods. Instead
    of initializing the class and then individually setting various values, many class
    initialization methods allow special initialization methods, or, in this case,
    multiple values to be passed on initialization.


    In the preceding example, line 1 is the interface of your method, and it contains
    two parameters: newName and newFrequency. To use this method, the caller would
    simply do the following:


    ```

    RadioStation my = [[RadioStation alloc] initWith:@"WOW FM" atFrequency:102.5];

    ```


    This method is also defined to return an id. An id is a generic object, and all
    Objective-C objects are of the type ‘id’, just like the RadioStation is an object.
    Now, let''s look at the rest of the implementation.


    Line 2 references special variables that you don''t have to define anywhere. The
    keyword self is used to mean “this instance of class,” so line 2 is assigning
    “this instance of class”—the value returned from the use of the special variable:
    super init. The keyword self is short for “superclass,” which can be thought of
    “parent of the class.” Any initialization of method will typically be thought
    of something that looks similar to line 2.


    Why is line 2 even necessary? Well, if you have an object that is derived from
    another object (remember, the class is RadioStation : NSObject), you must tell
    the parent object to initialize itself. The parent does the same by telling its
    parent to initialize itself, and so on, until the topmost object is reached. If
    another class uses yours as a parent, your code would also have to get an init
    call so RadioStation could be initialized. This is standard issue in the real
    world of Objective-C. A class needs to tell its parent to initialize when the
    class is created, and it needs to tell its parent to de-allocate itself whenever
    the class is going away.


    Line 3 checks to whether the [super init] call worked. If it worked, the value
    of self would be something other than nil, a value that effectively means “not
    initialized.”'
  merge: -1
