    \ example of this might be an object that represents today's date. There is no\
    \ need to set it, retrieve it, so there would be a getter method.\n\nThe needs\
    \ of object and variables will dictate how the getter and setter methods are built.\
    \ If a getter gets the value and the setter sets the value, it's going to take\
    \ a lot of coding to write all the getters and setters in an object, especially\
    \ if there are many instance variables. Fortunately, Objective-C 2.0 introduced\
    \ a way to reduce this burden with minimal effort on the programmer's part. These\
    \ features in Objective-C 2.0 are called properties.\n\n> NOTE: Objective-C 2.0\
    \ was introduced in 2006 with Xcode 3.4 and is included in Xcode 4 and later."
