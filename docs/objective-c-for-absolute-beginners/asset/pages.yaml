    \ i +1, is then incremented by 1 to 10 and then checked to if it is less than\
    \ 10. For this loop will end when i = 9 and the } is reached.\n\n> NOTE: It is\
    \ common for developers to confuse the number of times they think their loops\
    \ repeat. If the loop started at 1 in Listing 4–3, the loop would repeat nine\
    \ times instead of 10.\n\nIn Objective-C, for loops have their counter variable\
    \ declared in the loop declaration itself.\n\n**Listing 4–4.** Counter Variable\
    \ is Initialized For Loop Declaration\n\n```\nfor (int i = 0; i < 10; i++)\n{\n\
    \    //repeat all code in braces 10 times\n}\ncontinue\n```\n\nOccasionally, you\
