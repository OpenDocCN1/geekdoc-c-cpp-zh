  md: "```\nint main(void)\n{\n    char *data2 = malloc(100);\n    if (data2 == NULL)\
    \ // Malloc returns NULL (0x00000000) if allocation fails.\n        // Application\
    \ has detected a major failure;\n}\n```\n\nIn this standard C example, if the\
    \ malloc function fails, a NULL pointer is returned. Recall that NULL pointer\
    \ is nothing more than a pointer that points to location 0x00000000. Memory never\
    \ starts at this location, NULL can be used to indicate a *bad* memory allocation.\n\
    \nIn Objective-C, there are two main areas that we need to perform validity checks.\
    \ Here's the first:\n\n```\nint main(void)\n{\n    MyObject* obj = [[MyObject\
    \ alloc init];\n    if (obj == nil) // If the object is valid...\n        // Application\
    \ has detected a major failure;\n}\n```\n\nIn this example, we try to create an\
    \ object, but we check to see if the pointer returned is nil or not. Recall that\
    \ a nil object is basically a default empty object used as a placeholder to mean\
    \ \"empty\" or \"nothing\". Don't confuse this with an empty MyObject, because\
    \ that is not.\n\nThe second validity check only applies to objects we've created.\
    \ This check is done in the init method of the class:\n\n```\n- init\n{\n    self\
    \ = [super init];\n    if (self != nil)\n        // Do object initialization here\
    \ on a valid object.\n    return self;\n}\n```\n\nIn this example, the object's\
    \ init method, the program explicitly tests to see if self returns a value that\
    \ is not nil. If self is not nil, things are OK, and the method can continue initializing\
    \ the object. The method then returns self, which can be either nil or not. The\
    \ important thing to note here is that we are testing to ensure that the call\
    \ to [super init] works before proceeding to work on self."
