- pgno: 75
  md: '# Table 4–5. A NAND Truth Table


    | A | B | A NAND B |

    |---|---|--|

    | TRUE | TRUE | FALSE |

    | TRUE | FALSE | TRUE |

    | FALSE | TRUE | TRUE |

    | FALSE | FALSE | TRUE |


    Table 4–6 illustrates a NOR truth table and all possible operands.


    # Table 4–6. A NOR Truth Table


    | A | B | A NOR |

    |---|---|--|

    | TRUE | TRUE | FALSE |

    | TRUE | FALSE | FALSE |

    | FALSE | TRUE | FALSE |

    | FALSE | FALSE | TRUE |


    The easiest way to look at the NAND and NOR operators is to simply negate the
    results from the AND and OR truth tables, respectively.


    # Comparison Operators


    In software development, the comparison of different data items is accomplished
    with comparison operators. These operators produce a logical TRUE or FALSE result.
    Table 4–7 shows the list of comparison operators.


    # Table 4–7. Comparison Operators


    +   > greater than

    < less than

    >= greater than or equal to

    < less than or equal to

    == exactly equal to

    != not equal to'
