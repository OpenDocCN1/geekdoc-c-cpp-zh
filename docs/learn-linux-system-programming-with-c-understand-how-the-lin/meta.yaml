    - **Perf:** A Linux kernel tool for performance counter-based profiling.


    # Identifying Performance Bottlenecks


    +   - **Profiling:** Use profiling tools to identify functions or code sections
    consuming the most CPU time.

    - **Benchmarking:** Measure performance before and after optimizations to assess
