    \        exit(1);\n    }\n    std::cout << \"Received: \" << buffer << std::endl;\n\
    \n    // 发送响应\n    const char response = \"Hello from server!\"\n    sendto(sockfd,\
    \ response, strlen(response), 0, (struct sockaddr *)&client_addr, client_len);\n\
    \n    close(sockfd);\n\n    return 0;\n}\n```\n\n### C++ 代码示例（UDP 客户端）：\n\n```cpp\n\
    #include <iostream>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include\
    \ <arpa/inet.h>\n#include <string.h>\n#include <unistd.h>\n\nint main()\n    int\
    \ sockfd = socket(AF_INET, SOCK_DGRAM, 0);\n    if (sockfd < 0)\n        perror(\"\
    socket\");\n        exit(1);\n    }\n    struct sockaddr_in server_addr;\n   \
    \ memset(&server_addr, 0, sizeof(server_addr));\n    server_addr.sin_family =\
    \ AF_INET;\n    server_addr.sin_addr.s_addr = inet_addr(\"127.0.0.1\"); // 替换为服务器\
    \ IP\n    server_addr.sin_port = htons(8080); // 替换为服务器端口\n\n    const char message\
    \ = \"Hello from client!\";\n    sendto(sockfd, message, strlen(message), 0, (struct\
    \ sockaddr *)&server_addr, sizeof(server_addr));\n\n    char buffer[1024];\n \
    \   socklen_t client_len = sizeof(server_addr);\n    int bytes_received = recvfrom(sockfd,\
    \ buffer, sizeof(buffer), 0, (struct sockaddr *)&server_addr, &client_len);\n\
    \    if (bytes_received < 0)\n        perror(\"recvfrom\");\n        exit(1);\n\
    \    }\n    std::cout << \"Received: \" << buffer << std::endl;\n\n    close(sockfd);\n\
    \n    return 0;\n}\n```\n\n### 选择合适的协议\n\n在 TCP 和 UDP 之间做选择取决于您应用程序的具体要求：\n\n\
    **在以下情况下使用 TCP：**\n\n- 可靠性至关重要（例如，文件传输、电子邮件）\n- 数据完整性必不可少（例如，金融交易）\n- 需要有序交付（例如，音频或视频流）\n\
    \n**在以下情况下使用 UDP：**\n\n- 速度是优先考虑因素（例如，实时游戏、视频会议）\n- 偶尔的数据包丢失可以接受（例如，直播）\n- 需要低开销（例如，DNS、DHCP）\n\
    \n通过理解 TCP 和 UDP 的特性并使用相应的代码示例，您可以在 Linux 系统上的 C++ 应用程序中有效地实现网络通信。\n\n[OceanofPDF.com](http://OceanofPDF.com)"
