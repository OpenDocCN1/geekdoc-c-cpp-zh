- md: "## Basic C++ Program and Compilation\n\nLet's create a simple C++ program to\
    \ test our environment:\n\n```cpp\n#include <iostream>\n\nint main() {\n    std::cout\
    \ << \"Hello, world!\" << std::endl;\n    return 0;\n}\n```\n\nSave this code\
    \ as `hello.cpp`. To compile and run it:\n\n```bash\ng++ hello.cpp -o hello\n\
    ./hello\n```\n\nThis creates an executable named `hello` and runs it.\n\n## Building\
    \ a Project Structure\n\nFor larger projects, it's essential to organise your\
    \ code effectively. Consider the following structure:\n\n```\nproject_name\n├──\
    \ include\n│   └── my_header.h\n├── src\n│   └── main.cpp\n└── CMakeLists.txt\n\
    ```\n\n- **include/**: Contains header files with declarations.\n- **src/**: Contains\
    \ source files with implementations.\n- **CMakeLists.txt**: Optional, used for\
