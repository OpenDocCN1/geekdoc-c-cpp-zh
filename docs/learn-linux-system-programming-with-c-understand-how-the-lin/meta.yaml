- md: "## Delving Deeper: Condition Variables\n\n## Understanding Condition Variables\n\
    \nCondition variables are synchronisation primitives that allow threads to wait\
    \ for a specific condition to be met. They are often used in conjunction with\
    \ mutexes to protect the shared condition.\n\n```cpp\n#include <thread>\n#include\
    \ <mutex>\n#include <condition_variable>\n\nstd::mutex mtx;\nstd::condition_variable\
    \ cv;\nbool data_ready = false;\n\nvoid producer() {\n    // ... produce data\n\
    \    {\n        std::lock_guard<std::mutex> lock(mtx);\n        data_ready = true;\n\
    \        cv.notify_one(); // Notify one waiting thread\n    }\n}\n\nvoid consumer()\
    \ {\n    std::unique_lock<std::mutex> lock(mtx);\n    while (!data_ready) {\n\
    \        cv.wait(lock); // Wait for the condition to be true\n    }\n    // Consume\
    \ data\n    // ...\n}\n```\n\n- **std::condition_variable::wait**: Blocks the\
    \ current thread until the condition is signalled.\n- **std::condition_variable::notify_one**:\
    \ Wakes up one thread waiting on the condition variable.\n- **std::condition_variable::notify_all**:\
    \ Wakes up all threads waiting on the condition variable.\n\n## Advanced Usage\n\
    \n- **Spurious Wakeups**: It's possible for a thread to be woken up even if the\
    \ condition is still false. This is called a spurious wakeup. To handle this,\
    \ it's common to use a loop with the condition check inside the `while` loop.\n\
    - **False Sharing**: If condition variables are in close proximity to other shared\
    \ data, false sharing can occur, reducing performance. To avoid this, consider\
    \ padding or aligning condition variables carefully.\n- **Condition Variable Combinations**:\
    \ Condition variables can be combined with other synchronisation primitives to\
    \ create complex synchronisation patterns.\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n#include <queue>\n#include <mutex>\n#include <condition_variable>\n\
    \nstd::queue<int> buffer;\nint buffer_size = 10;\nstd::mutex mtx;\nstd::condition_variable\
    \ not_full, not_empty;\n\nvoid producer() {\n    // ...\n}\n\nvoid consumer()\
    \ {\n    // ...\n}\n```\n\nIn this example, `not_full` is signalled when the buffer\
    \ has free space, and `not_empty` is signalled when there is data to consume.\n\
    \n## Condition Variables vs. Semaphores\n\nBoth condition variables and semaphores\
    \ can be used for synchronisation, but they have different purposes:\n\n- **Semaphores:**\
