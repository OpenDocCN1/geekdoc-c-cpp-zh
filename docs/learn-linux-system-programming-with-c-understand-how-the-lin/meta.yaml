    # Process Creation and Termination


    We''ve touched on `fork()` and `execve()` briefly. Let''s explore them further:


    +   - **fork():** Creates a child process that''s an exact copy of the parent.
    Both processes share the same memory space initially. This is often used for creating
    new processes to handle tasks concurrently.

    - **execve():** Replaces the current process image with a new one, loading a new
    executable into memory. This is how programs are executed from the command line.'
