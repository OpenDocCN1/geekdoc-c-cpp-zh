  md: "C++, on the other hand, supports object-oriented programming (OOP), offering\
    \ classes, inheritance, polymorphism, and encapsulation. This enables better code\
    \ organisation, reusability, and maintainability.\n\n```\nC++\n// C++ class for\
    \ representing a file\nclass File {\npublic:\n    File(const char* filename);\n\
    \    ~File();\n    void open();\n    void close();\n    void read(char* buffer,\
    \ int size);\n    void write(const char* buffer, int size);\nprivate:\n    int\
    \ fd; // File descriptor\n};\n```\n\nThe File class encapsulates file operations,\
    \ making code more readable and less error-prone.\n\n# Standard Library\n\nC's\
    \ standard library is relatively small, focusing on basic input/output, string\
    \ manipulation, and memory management.C++ inherits C's library and expands it\
    \ significantly with the Standard Template Library (STL), offering containers,algorithms,\
    \ and iterators.\n\n```\nC++\n#include <vector>\n#include <algorithm>\n\nstd::vector<int>\
    \ numbers = {3, 1, 4, 1, 5, 9};\nstd::sort(numbers.begin(), numbers.end());\n\
    ```\n\nSTL provides powerful abstractions for common data structures and operations,\
    \ improving development efficiency.\n\n# Memory Management"
