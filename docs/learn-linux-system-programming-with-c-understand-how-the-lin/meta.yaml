    socklen_t client_len = sizeof(client_addr);\nchar buffer[1024];\nint bytes_received\
    \ = recvfrom(sockfd, buffer, sizeof(buffer), 0, (struct sockaddr *)&client_addr,\
    \ &client_len);\nif (bytes_received < 0)\n    perror(\"recvfrom\");\n    exit(1);\n\
    }\nstd::cout << \"Received: \" << buffer << std::endl;\n\n// Send response\nconst\
