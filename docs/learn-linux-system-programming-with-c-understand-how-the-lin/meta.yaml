    To ensure it''s installed, open a terminal and run:


    ```

    Bash

    sudo apt install gcc g++

    ```


    Replace `apt` with your package manager if you''re using a different distribution
    (e.g., `yum` for Fedora, `dnf` for CentOS).


    2. Debugger:


