    \ main.cpp, line 5.\n```\n\n### Boost：一个强大的 C++ 库\n\nBoost 是一个经过同行评审的免费 C++ 库集合，为各种任务提供支持，包括：\n\
    \n- **字符串和文本处理**：正则表达式、区域设置、格式化等。\n- **容器和算法**：高级数据结构和算法。\n- **异步 I/O**：高效的网络和文件操作。\n\
    - **文件系统**：跨平台的文件系统操作。\n- **数学**：线性代数、特殊函数等。\n\n**使用 Boost：**\n\n- **包含头文件**：在你的代码中包含必要的\
    \ Boost 头文件。\n- **链接库**：在构建项目时链接所需的 Boost 库。\n\n**示例：**\n\n```cpp\n#include <boost/filesystem.hpp>\n\
    \nint main() {\n    boost::filesystem::path p(\"/path/to/file\");\n    if (boost::filesystem::exists(p))\
    \ {\n        std::cout << \"File exists\" << std::endl;\n    }\n    return 0;\n\
    }\n```\n\n**使用 Boost 构建：**\n\n确保你的系统上安装了 Boost。然后，在你的 `CMakeLists.txt` 中：\n\n\
    ```cmake\nfind_package(Boost COMPONENTS filesystem REQUIRED)\ntarget_link_libraries(my_executable\
    \ Boost::filesystem)\n```\n\n# 第 2 章\n\n## 用于 Linux 系统编程的 C++ 核心语言特性\n\nC++ 是一种在高级抽象和低级系统交互之间架起桥梁的语言，使其成为\
    \ Linux 系统编程的合适选择。本节将重点介绍对该领域至关重要的核心语言特性。\n\n### 指针和内存管理\n\n指针是 C++ 系统编程的基石。它们允许直接操作内存位置，这对于与硬件交互、高效的数据结构和低级内存管理等任务至关重要。\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int x = 10;\n    int *ptr =\
    \ &x; // Pointer to x\n    std::cout << *ptr << std::endl; // Dereference to access\
    \ value\n    *ptr = 20; // Modify value through pointer\n    std::cout << x <<\
    \ std::endl; // Value of x is changed\n    return 0;\n}\n```\n\n### 引用\n\n引用为现有对象提供别名，提供了一种高效地按引用传递参数的方式。\n\
    \n```cpp\n#include <iostream>\n\nvoid swap(int &a, int &b) {\n    int temp = a;\n\
    \    a = b;\n    b = temp;\n}\n\nint main() {\n    int x = 10, y = 20;\n    swap(x,\
    \ y);\n    std::cout << x << \" \" << y << std::endl;\n    return 0;\n}\n```\n\
    \n### Const 正确性\n\nConst 正确性确保数据不会被意外修改，从而提高代码的可靠性。\n\n```cpp\n#include <iostream>\n\
    \nvoid print_value(const int &value) {\n    std::cout << value << std::endl;\n\
    }\n\nint main() {\n    int x = 10;\n    print_value(x); // Correct\n    // print_value(x++);\
    \ // Error: cannot modify const reference\n    return 0;\n}\n```\n\n### 运算符重载\n\
    \n运算符重载允许为内置运算符定义自定义行为，从而编写出富有表现力且直观的代码。\n\n```cpp\n#include <iostream>\n\nclass\
    \ Complex {\npublic:\n    double real, imag;\n\n    Complex(double r, double i)\
    \ : real(r), imag(i) {}\n\n    Complex operator+(const Complex &other) const {\n\
    \        return Complex(real + other.real, imag + other.imag);\n    }\n\n    friend\
    \ std::ostream &operator<<(std::ostream &os, const Complex &c) {\n        os <<\
    \ c.real << \" + \" << c.imag << \"i\";\n        return os;\n    }\n};\n\nint\
    \ main() {\n    Complex c1(2, 3), c2(4, 5);\n    Complex c3 = c1 + c2;\n    std::cout\
    \ << c3 << std::endl;\n    return 0;\n}\n```"
