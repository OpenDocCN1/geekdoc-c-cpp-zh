    \ C++ 中的内存管理至关重要。\n\n[OceanofPDF.com](http://OceanofPDF.com)\n\n# 第 5 章\n\n##\
    \ Linux 系统编程中的线程与进程（C++）\n\n在操作系统领域，进程和线程是管理并发执行的基本概念。虽然两者都代表工作单元，但在资源共享和开销方面存在显著差异。本文深入探讨了进程和线程之间的区别，并探索了在\
    \ Linux 中使用 C++ 实现它们的方式。\n\n### 进程\n\n进程是正在执行的程序实例。它封装了自己的地址空间、内存、打开的文件和其他资源。创建新进程涉及大量开销，因为操作系统需要分配和管理这些资源。\n\
    \n**进程创建** 在 C++ 中，进程创建通常通过 `fork()` 系统调用实现。此函数创建一个子进程，该进程是父进程的精确副本，包括其内存空间。但是，`fork()`\
    \ 的返回值对于父进程和子进程是不同的：\n\n```\ncpp\n#include <unistd.h>\n#include <iostream>\n\n\
    int main() {\n    pid_t pid = fork();\n    if (pid < 0) {\n        // Fork 失败\n\
    \        std::cerr << \"Fork failed\" << std::endl;\n        return 1;\n    }\
    \ else if (pid == 0) {\n        // 子进程\n        std::cout << \"I am the child\
    \ process\" << std::endl;\n    } else {\n        // 父进程\n        std::cout <<\
    \ \"I am the parent process\" << std::endl;\n    }\n    return 0;\n}\n```\n\n\
