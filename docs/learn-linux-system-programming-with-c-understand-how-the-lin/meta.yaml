    \ main() {\n    std::unique_ptr<int> ptr(new int(42)); // Ownership transfer\n\
    \    // ... use ptr\n    // No need to explicitly delete ptr\n}\n```\n\n2. **std::shared_ptr**\n\
    \    - Represents shared ownership of a resource.\n    - Multiple `shared_ptr`\
