    \    if (fstat(fd, &statbuf) == -1) {\n        perror(\"fstat\");\n        close(fd);\n\
    \        return 1;\n    }\n\n    char* data = (char*)mmap(nullptr, statbuf.st_size,\
    \ PROT_READ,\n                             MAP_SHARED, fd, 0);\n    if (data ==\
