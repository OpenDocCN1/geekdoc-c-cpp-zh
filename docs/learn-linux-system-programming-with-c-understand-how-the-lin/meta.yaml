    # # Client-server architecture


    Client-server architecture is a distributed application structure that partitions
    tasks or workloads between service providers (servers) and service requesters
    (clients). This model is widely used in networking and internet applications due
    to its scalability and efficiency. In this architecture, the client and server
    communicate over a network, with the server providing resources or services and
    the client requesting them.


    # ## Overview of Client-Server Architecture


    The client-server model consists of:


    +   1. **Client:** A client is a software application or a computer that requests
    services or resources from a server. Clients initiate communication sessions with
    servers, which await incoming requests.

    2. **Server:** A server is a software program or a computer that provides services
    or resources to clients. It listens for requests from clients and responds to
    them.

    3. **Network:** The network connects clients and servers, allowing them to communicate
    and exchange data.


    # ## Benefits of Client-Server Architecture


    +   - **Centralised Resources:** Servers manage resources centrally, making them
    easier to update and maintain.

    - **Scalability:** New clients can be added easily without affecting existing
    ones.

    - **Security:** Servers can enforce security policies to control access to resources.


    # ## Challenges of Client-Server Architecture'
