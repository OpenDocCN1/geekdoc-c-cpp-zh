    make\n```\n\n### 使用 GDB 调试\n\nGDB 是一个功能多样的 C++ 程序调试器。它提供以下功能：\n\n- **断点**：在特定点暂停执行。\n\
    - **单步执行**：逐行执行代码。\n- **检查变量**：检查变量值。\n- **回溯**：分析调用栈。\n\n**基本用法：**\n\n```bash\n\
    gdb ./my_executable\n```\n\n进入 GDB 后，你可以使用以下命令：\n\n- **run**：启动程序。\n- **break\
