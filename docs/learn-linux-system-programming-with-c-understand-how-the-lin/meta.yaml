    ```cpp\n#include <iostream>\n\nint main() {\n    int *ptr = nullptr;\n    *ptr\
    \ = 10; // Segmentation fault\n    return 0;\n}\n```\n\n## Memory Leaks\n\n**Cause:**\
    \ Memory allocated but not freed.\n\n**Debugging:**\n\n- Use Valgrind to identify\
    \ memory leaks.\n- Carefully manage memory allocation and deallocation using smart\
    \ pointers or explicit `delete`.\n- Profile memory usage to pinpoint areas with\
    \ high memory consumption.\n\n```cpp\n#include <iostream>\n\nint main() {\n  \
    \  int *ptr = new int;\n    // ... use ptr ...\n    // Forget to delete ptr\n\
    \    return 0;\n}\n```\n\n## Race Conditions\n\n**Cause:** Multiple threads accessing\
    \ shared data without proper synchronisation.\n\n**Debugging:**\n\n- Use mutexes\
    \ or other synchronisation primitives to protect shared data.\n- Carefully analyse\
    \ thread interactions and potential race conditions.\n- Use debugging tools to\
    \ inspect thread states and data races.\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n\nint counter = 0;\n\nvoid increment() {\n    for (int i = 0; i <\
    \ 10000; ++i) {\n        counter++;\n    }\n}\n\nint main() {\n    std::thread\
    \ t1(increment);\n    std::thread t2(increment);\n    t1.join();\n    t2.join();\n\
    \    std::cout << counter << std::endl; // Race condition\n    return 0;\n}\n\
