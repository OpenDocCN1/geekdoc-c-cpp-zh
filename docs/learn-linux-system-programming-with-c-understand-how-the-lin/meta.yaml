    \ of condition variable operations.\n- **Error Handling:** Handle errors gracefully,\
    \ such as when a condition variable is signalled unexpectedly.\n\nBy understanding\
    \ condition variables, you can effectively implement complex synchronisation patterns\
    \ and improve the responsiveness of your multi-threaded applications.\n\n## Chapter\
    \ 6\n\n### Sockets and Network APIs in Linux System Programming with C++\n\nSockets\
    \ are the fundamental building blocks of network communication. They provide an\
    \ interface for applications to send and receive data over a network. In Linux,\
    \ sockets are implemented using a set of system calls and data structures. This\
    \ article will delve into the basics of socket programming in C++ on Linux, covering\
    \ key concepts, code examples, and common network APIs.\n\n### Understanding Sockets\n\
    \nA socket is essentially an endpoint for communication between two processes.\
    \ It's characterised by three components:\n\n- **Domain:** Specifies the address\
    \ family (e.g., AF_INET for IPv4, AF_INET6 for IPv6).\n- **Type:** Defines the\
    \ communication style (e.g., SOCK_STREAM for TCP, SOCK_DGRAM for UDP).\n- **Protocol:**\
    \ Specifies the protocol to be used (usually 0 for TCP or UDP).\n\n### Creating\
    \ a Socket\n\nThe `socket()` system call is used to create a socket. Here's an\
    \ example:\n\n```cpp\n#include <sys/socket.h>\n#include <netinet/in.h>\n\nint\
    \ main() {\n    int sockfd = socket(AF_INET, SOCK_STREAM, 0);\n    if (sockfd\
    \ < 0) {\n        perror(\"socket\");\n        exit(1);\n    }\n\n    // ...\n\
    }\n```\n\n### Binding a Socket\n\nBefore a server can start listening for connections,\
    \ it must bind its socket to a specific address and port. The `bind()` system\
    \ call is used for this:\n\n```cpp\n#include <arpa/inet.h>\n\nstruct sockaddr_in\
    \ server_addr;\nmemset(&server_addr, 0, sizeof(server_addr));\nserver_addr.sin_family\
    \ = AF_INET;\nserver_addr.sin_addr.s_addr = INADDR_ANY; // Bind to any address\n\
    server_addr.sin_port = htons(8080); // Port number\n\nif (bind(sockfd, (struct\
    \ sockaddr *)&server_addr, sizeof(server_addr)) < 0) {\n    perror(\"bind\");\n\
    \    exit(1);\n}\n```\n\n### Listening for Connections (Server)\n\nA server puts\
    \ its socket in a listening state using the `listen()` system call:\n\n```cpp\n\
    listen(sockfd, 5); // Backlog of 5 pending connections\n```\n\n### Accepting Connections\
    \ (Server)\n\nWhen a client connects to the server, the server accepts the connection\
    \ using the `accept()` system call:\n\n```cpp\nstruct sockaddr_in client_addr;\n\
    socklen_t client_len = sizeof(client_addr);\nint newsockfd = accept(sockfd, (struct\
    \ sockaddr *)&client_addr, &client_len);\nif (newsockfd < 0) {\n    perror(\"\
    accept\");\n    exit(1);\n}\n```\n\n### Connecting to a Server (Client)\n\nA client\
    \ connects to a server using the `connect()` system call:\n\n```cpp\nstruct sockaddr_in\
    \ server_addr;\n// ... populate server_addr with server's address and port\n\n\
    if (connect(sockfd, (struct sockaddr *)&server_addr, sizeof(server_addr)) < 0)\
    \ {\n    perror(\"connect\");\n    exit(1);\n}\n```\n\n### Sending and Receiving\
    \ Data\n\nOnce a connection is established, data can be sent and received using\
    \ the `send()` and `recv()` system calls, or their higher-level counterparts like\
    \ `write()` and `read()`.\n\n```cpp\nchar buffer[1024];\nint n = recv(newsockfd,\
    \ buffer, 1024, 0);\nif (n < 0) {\n    perror(\"recv\");\n    exit(1);\n}\n```\n\
    \n### Closing Sockets\n\nWhen communication is complete, sockets should be closed\
    \ using the `close()` system call:\n\n```cpp\nclose(sockfd);\n```\n\n### Network\
    \ APIs\n\nLinux provides a rich set of network APIs beyond the basic socket functions.\
    \ Some common ones include:\n\n- **gethostname()**: Gets the hostname of the local\
    \ machine.\n- **gethostbyname()**: Resolves a hostname to an IP address.\n- **inet_addr()**:\
    \ Converts a dotted-decimal IP address to a binary address.\n- **inet_ntoa()**:\
    \ Converts a binary IP address to a dotted-decimal string.\n- **getsockopt()**:\
    \ Retrieves socket options.\n- **setsockopt()**: Sets socket options.\n\n### Additional\
    \ Considerations\n\n- **Error Handling**: Proper error handling is crucial for\
    \ robust network applications.\n- **Non-blocking Sockets**: For asynchronous operations,\
    \ consider using non-blocking sockets with `select()` or `poll()`.\n- **Socket\
    \ Options**: Explore socket options like `SO_REUSEADDR`, `SO_KEEPALIVE`, and others\
    \ to fine-tune socket behaviour.\n- **Security:** Implement appropriate security\
    \ measures to protect against network attacks.\n- **High-Level Libraries:** Consider\
    \ using higher-level libraries like Boost.Asio for more complex network applications.\n\
    \nSocket programming provides a powerful foundation for building network applications.\
    \ By understanding the core concepts and using the provided code examples, you\
    \ can effectively create clients and servers in C++ on Linux.\n\n**Note:** This\
    \ article provides a basic overview. Network programming can be complex, and it's\
    \ essential to delve deeper into specific topics and consider advanced techniques\
    \ for production-grade applications.\n\n## UDP Sockets: A Deeper Dive\n\n**UDP\
    \ (User Datagram Protocol)** is a connectionless protocol, meaning it doesn't\
    \ establish a reliable connection between endpoints before sending data. It's\
    \ often used for applications where speed and efficiency are prioritised over\
    \ guaranteed delivery, such as real-time audio/video streaming, online gaming,\
