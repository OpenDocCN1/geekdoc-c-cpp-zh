    \ and innovate.**\n\n[OceanofPDF.com](http://OceanofPDF.com)\n\n## Appendices\n\
    \n### Linux system calls reference\n\nA Glimpse into the Linux System Call Landscape\n\
    \nLinux system calls are the bedrock upon which user-space applications interact\
    \ with the kernel. They provide a controlled interface to kernel functionalities,\
    \ ensuring system integrity and efficiency. While the complete list of system\
    \ calls is extensive, we'll explore some fundamental ones and their applications.\n\
    \nProcess Management\n\n- **fork():** Creates a child process, almost identical\
    \ to the parent.\n\n```cpp\n#include <unistd.h>\n#include <iostream>\n\nint main()\
    \ {\n    pid_t pid = fork();\n    if (pid < 0) {\n        // Fork failed\n   \
    \ } else if (pid == 0) {\n        // Child process\n        std::cout << \"Child\
    \ process\\n\";\n    } else {\n        // Parent process\n        std::cout <<\
    \ \"Parent process\\n\";\n    }\n    return 0;\n}\n```\n\n- **execve()**: Replaces\
    \ the current process image with a new one.\n- **exit()**: Terminates the current\
    \ process.\n- **waitpid()**: Waits for the termination of a child process.\n\n\
    File Manipulation\n\n- **open()**: Opens a file and returns a file descriptor.\n\
    - **close()**: Closes a file descriptor.\n- **read()**: Reads data from a file.\n\
    - **write()**: Writes data to a file.\n- **lseek()**: Sets the file offset.\n\n\
    ```cpp\n#include <fcntl.h>\n#include <unistd.h>\n\nint main() {\n    int fd =\
    \ open(\"my_file.txt\", O_RDONLY);\n    if (fd == -1) {\n        // Error opening\
    \ file\n    }\n    char buffer[100];\n    ssize_t bytes_read = read(fd, buffer,\
    \ sizeof(buffer));\n    if (bytes_read == -1) {\n        // Error reading file\n\
    \    }\n    close(fd);\n    return 0;\n}\n```\n\n### Process and System Information\n\
    \n- **getpid()**: Returns the process ID of the calling process.\n- **getppid()**:\
    \ Returns the parent process ID.\n- **getuid()**: Returns the real user ID of\
    \ the calling process.\n- **geteuid()**: Returns the effective user ID of the\
    \ calling process.\n- **time()**: Returns the current time.\n\n### Interprocess\
    \ Communication (IPC)\n\n- **pipe()**: Creates a pipe for communication between\
    \ related processes.\n- **msgget()**: Creates a message queue.\n- **shmget()**:\
    \ Creates a shared memory segment.\n- **semget()**: Creates a semaphore set.\n\
    \n### System Calls and the C Library\n\nWhile it's possible to directly use system\
    \ calls, the C library provides wrapper functions for many of them, offering convenience\
    \ and portability. Functions like `printf`, `fopen`, and `malloc` are built on\
    \ top of system calls.\n\n### Beyond the Basics\n\nThe world of Linux system calls\
    \ is vast. Beyond the fundamental ones discussed, there are calls for:\n\n- **Network\
    \ programming**: socket, bind, listen, accept, connect, send, recv\n- **Process\
    \ management**: kill, wait, exec\n- **File system operations**: mkdir, rmdir,\
    \ chmod, chown\n- **Memory management**: mmap, munmap, brk\n- **Signal handling**:\
    \ signal, kill\n- **Time management**: time, gettimeofday, nanosleep\n- **System\
    \ information**: uname, sysinfo\n\n### Common Pitfalls and Best Practices\n\n\
    - **Error handling**: Always check return values for errors.\n- **Efficiency:**\
    \ Use system calls judiciously, as they involve kernel transitions.\n- **Security:**\
    \ Be aware of potential security vulnerabilities when using system calls.\n- **Portability:**\
    \ Consider portability when using system calls, as some might have variations\
    \ across Linux distributions.\n\nLinux system calls are the building blocks of\
    \ powerful applications. By understanding their purpose and usage, you can create\
    \ efficient, robust, and secure software. While this overview provides a foundation,\
    \ delving deeper into specific system calls and their applications will unlock\
    \ the full potential of Linux system programming.\n\n### Diving Deeper: Process\
    \ Management with System Calls\n\nLet's delve into the intricacies of process\
    \ management using Linux system calls. This is a fundamental aspect of system\
    \ programming, and a solid understanding of it is crucial for building complex\
    \ applications.\n\n### Process Creation and Termination\n\nWe've touched on `fork()`\
    \ and `execve()` briefly. Let's explore them further:\n\n- **fork():** Creates\
    \ a child process that's an exact copy of the parent. Both processes share the\
    \ same memory space initially. This is often used for creating new processes to\
    \ handle tasks concurrently.\n- **execve():** Replaces the current process image\
    \ with a new one, loading a new executable into memory. This is how programs are\
    \ executed from the command line.\n\n```cpp\n#include <unistd.h>\n#include <sys/wait.h>\n\
    #include <iostream>\n\nint main() {\n    pid_t pid = fork();\n    if (pid < 0)\
    \ {\n        // Fork failed\n        perror(\"fork\");\n        exit(1);\n   \
    \ } else if (pid == 0) {\n        // Child process\n        execl(\"/bin/ls\"\
    , \"ls\", \"-l\", (char *)NULL);\n        // If execl returns, it failed\n   \
    \     perror(\"execl\");\n        exit(1);\n    } else {\n        // Parent process\n\
    \        int status;\n        waitpid(pid, &status, 0);\n    }\n    return 0;\n\
    }\n```\n\n### Process Communication\n\nWhile pipes are a simple form of IPC, there\
    \ are more advanced mechanisms:\n\n- **Shared memory:** Provides a region of memory\
    \ that can be accessed by multiple processes.\n- **Message queues:** Allow processes\
    \ to exchange messages.\n- **Semaphores:** Used for synchronisation between processes.\n\
