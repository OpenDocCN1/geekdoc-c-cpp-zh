    # Condition Variables vs. Semaphores


    Both condition variables and semaphores can be used for synchronisation, but they
    have different purposes:


    +   - **Semaphores:** Primarily used for counting resources or acting as general-purpose
    synchronisation primitives.

    - **Condition Variables:** Specifically designed for waiting on conditions and
    often used in conjunction with mutexes.


    # When to Use Condition Variables:


    +   - Waiting for a specific condition to occur

    - Producer-consumer patterns

    - Implementing more complex synchronisation scenarios


    # Additional Considerations


    +   - **Correctness:** Ensure correct usage of condition variables to avoid deadlocks
    and other issues.

    - **Performance:** Consider the overhead of condition variable operations.

    - **Error Handling:** Handle errors gracefully, such as when a condition variable
    is signalled unexpectedly.


