    \    server_addr.sin_family = AF_INET;\n    server_addr.sin_addr.s_addr = inet_addr(\"\
    127.0.0.1\"); // 替换为服务器 IP\n    server_addr.sin_port = htons(8080); // 替换为服务器端口\n\
    \n    if (connect(sockfd, (struct sockaddr )&server_addr, sizeof(server_addr))\
    \ < 0)\n        perror(\"connect\");\n        exit(1);\n    }\n    const char\
    \ message = \"Hello from client!\";\n    send(sockfd, message, strlen(message),\
    \ 0);\n\n    char buffer[1024];\n    int bytes_received = recv(sockfd, buffer,\
    \ sizeof(buffer), 0);\n    if (bytes_received < 0)\n        perror(\"recv\");\n\
    \        exit(1);\n    }\n    std::cout << \"Received: \" << buffer << std::endl;\n\
    \n    close(sockfd);\n\n    return 0\n```\n\n### UDP（用户数据报协议）\n\nUDP 是一种无连接协议，这意味着它在发送数据之前不建立连接。它比\
    \ TCP 更快，但可靠性较低。\n\n主要特性：\n\n- **无连接：** 不需要握手，数据报独立发送。\n- **不可靠：** 不保证交付，数据包可能丢失或乱序。\n\
    - **无序：** 数据包可能以非顺序到达。\n- **无错误检查：** 不检测或纠正错误。\n- **无流量控制：** 如果发送方发送过快，可能导致数据包丢失。\n\
    - **无拥塞控制：** 不管理网络流量。\n\n### C++ 代码示例（UDP 服务器）：\n\n```cpp\n#include <iostream>\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n#include\
    \ <string.h>\n#include <unistd.h>\n\nint main()\n{\n    int sockfd = socket(AF_INET,\
    \ SOCK_DGRAM, 0);\n    if (sockfd < 0)\n        perror(\"socket\");\n        exit(1);\n\
