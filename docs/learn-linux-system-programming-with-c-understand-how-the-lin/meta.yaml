    \nint main() {\n    int *ptr = (int*) calloc(5, sizeof(int));\n    for (int i\
    \ = 0; i < 5; ++i) {\n        std::cout << ptr[i] << \" \";\n    }\n    std::cout\
    \ << std::endl;\n\n    free(ptr);\n    return 0;\n}\n```\n\n## Memory Deallocation\n\
    \nMemory deallocation is the process of releasing memory that is no longer needed.\
    \ Failure to deallocate memory can lead to memory leaks, which can degrade application\
    \ performance and stability.\n\n### Using delete\n\nFor objects allocated with\
    \ new, use delete to deallocate memory.\n\n```cpp\nint *ptr = new int;\n// ...\n\
    delete ptr;\n```\n\n### Using free\n\nFor memory allocated with malloc, calloc,\
    \ or realloc, use free to deallocate memory.\n\n```cpp\nint *ptr = (int*) malloc(sizeof(int));\n\
    // ...\nfree(ptr);\n```\n\n### Memory Management Challenges\n\n- **Memory Leaks:**\
    \ Occurs when memory is allocated but not deallocated, leading to memory exhaustion.\n\
    - **Dangling Pointers:** Pointers that point to invalid memory locations after\
    \ the memory has been deallocated.\n- **Double Free:** Attempting to deallocate\
    \ memory that has already been deallocated, leading to undefined behaviour.\n\n\
    ### Best Practices\n\n- Use smart pointers (e.g., std::unique_ptr, std::shared_ptr)\
    \ to manage memory automatically.\n- Avoid raw pointers whenever possible.\n-\
    \ Check for null pointers before dereferencing.\n- Use valgrind or other memory\
    \ leak detection tools to find memory issues.\n- Consider using memory pools for\
    \ performance optimization in specific scenarios.\n\n### Additional Considerations\n\
    \n- **Memory alignment:** Some data types require specific memory alignment for\
