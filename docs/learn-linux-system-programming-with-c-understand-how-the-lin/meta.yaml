    \ message, strlen(message) + 1);\n\n        close(pipefd[1]);\n    }\n\n    return\
    \ 0;\n}\n```\n\n## Sockets\n\nSockets provide a more flexible and general-purpose\
    \ IPC mechanism. They can be used for communication between processes on the same\
    \ machine or across a network.\n\n### Creating a Socket\n\nThe `socket()` system\
    \ call creates a socket. The arguments specify the address family (e.g., `AF_INET`\
    \ for IPv4), socket type (e.g., `SOCK_STREAM` for TCP), and protocol (usually\
    \ 0).\n\n```cpp\n#include <iostream>\n#include <sys/socket.h>\n\nint main() {\n\
    \    int sockfd = socket(AF_INET, SOCK_STREAM, 0);\n    if (sockfd == -1) {\n\
    \        std::cerr << \"Socket creation failed\" << std::endl;\n        return\
    \ 1;\n    }\n\n    // ... use the socket ...\n\n    return 0;\n}\n```\n\n### Binding\
    \ and Listening\n\nFor server-side sockets, you need to bind the socket to an\
    \ address and listen for incoming connections.\n\n```cpp\n#include <iostream>\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n\nint main() {\n    int sockfd\
    \ = socket(AF_INET, SOCK_STREAM, 0);\n    if (sockfd == -1) {\n        std::cerr\
    \ << \"Socket creation failed\" << std::endl;\n        return 1;\n    }\n\n  \
    \  struct sockaddr_in server_addr;\n    memset(&server_addr, 0, sizeof(server_addr));\n\
    \    server_addr.sin_family = AF_INET;\n    server_addr.sin_addr.s_addr = INADDR_ANY;\n\
    \    server_addr.sin_port = htons(12345); // Replace with desired port\n\n   \
    \ if (bind(sockfd, (struct sockaddr*)&server_addr, sizeof(server_addr)) == -1)\
    \ {\n        std::cerr << \"Bind failed\" << std::endl;\n        return 1;\n \
    \   }\n\n    listen(sockfd, 5); // Backlog of 5 pending connections\n\n    //\
    \ ... accept connections and handle communication ...\n\n    return 0;\n}\n```\n\
    \n### Connecting and Communicating\n\nFor client-side sockets, you need to connect\
    \ to a server and then send and receive data.\n\n```cpp\n#include <iostream>\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n\nint main() {\n    int sockfd\
    \ = socket(AF_INET, SOCK_STREAM, 0);\n    if (sockfd == -1) {\n        std::cerr\
    \ << \"Socket creation failed\" << std::endl;\n        return 1;\n    }\n\n  \
    \  struct sockaddr_in server_addr;\n    // ... fill in server address information\
    \ ...\n\n    if (connect(sockfd, (struct sockaddr*)&server_addr, sizeof(server_addr))\
    \ == -1) {\n        std::cerr << \"Connect failed\" << std::endl;\n        return\
    \ 1;\n    }\n\n    // ... send and receive data using send() and recv() ...\n\n\
    \    return 0;\n}\n```\n\n### Additional Considerations\n\n- **Error Handling:**\
