    \ Proper synchronisation and error handling are crucial for reliable multi-threaded\
    \ applications.\n\n## Delving Deeper: Thread Safety and Deadlocks\n\n### Thread\
    \ Safety\n\nThread safety is a critical concept in multi-threaded programming.\
    \ It ensures that a piece of code can be safely executed by multiple threads simultaneously\
    \ without causing data corruption or unexpected behaviour.\n\n### Key considerations\
    \ for thread safety:\n\n- **Shared mutable state:** If multiple threads access\
    \ and modify the same data, synchronisation is essential.\n- **Reentrancy:** Functions\
    \ should be reentrant, meaning they can be safely called from multiple threads\
    \ without interfering with each other.\n- **Atomic operations:** Use atomic operations\
    \ for simple read-write operations to avoid synchronisation overhead.\n\n### Example\
    \ of thread-unsafe code:\n\n```cpp\n#include <pthread.h>\n#include <iostream>\n\
    \nint counter = 0;\n\nvoid* increment_counter(void* arg) {\n    for (int i = 0;\
    \ i < 10000; ++i) {\n        counter++;\n    }\n    return nullptr;\n}\n\nint\
    \ main() {\n    pthread_t threads[2];\n    for (int i = 0; i < 2; ++i) {\n   \
    \     pthread_create(&threads[i], nullptr, increment_counter, nullptr);\n    }\n\
    \    for (int i = 0; i < 2; ++i) {\n        pthread_join(threads[i], nullptr);\n\
