    # Kernel Data Structures


    The kernel uses various data structures to manage system resources. Some common
    ones include:


    +   - **Linked Lists:** Used for representing lists of items, such as processes,
    file systems, and network devices.

    - **Red-Black Trees:** Used for efficient searching and insertion of elements,
    such as process scheduling and virtual memory management.

    - **Hash Tables:** Used for fast lookups, such as finding processes by PID.


    # Kernel Memory Management


    The kernel has its own memory management system, different from user-space. Key
    concepts include:


    +   - **Physical Memory:** The actual hardware memory.

    - **Virtual Memory:** An abstraction provided by the kernel to manage physical
    memory efficiently.

    - **Page Frames:** Fixed-size blocks of physical memory.

    - **Page Tables:** Maps virtual addresses to physical addresses.


    # Interrupts and System Calls


    Interrupts are hardware-generated signals that cause the CPU to suspend its current
    task and execute an interrupt handler. System calls are software-generated interrupts
    that allow user-space programs to request kernel services.


