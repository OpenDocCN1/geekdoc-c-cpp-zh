    ```\n\n3. **std::weak_ptr**\n    - 不拥有资源，但可用于观察 `shared_ptr`。\n    - 防止循环引用。\n\
    \    - 可用于检查共享对象是否仍然存在。\n\n```\ncpp\n#include <memory>\n\nint main() {\n    std::shared_ptr<int>\
    \ ptr(new int(42));\n    std::weak_ptr<int> weak_ptr = ptr;\n\n    if (auto locked\
    \ = weak_ptr.lock()) {\n        // 如果共享对象仍然存在，则访问它\n    }\n}\n```\n\n## 自定义删除器\n\
    \n您可以定义自定义删除器，以特定方式处理资源清理。\n\n```\nC++\n#include <memory>\n\nstruct CustomDeleter\
    \ {\n    void operator()(int* ptr) const {\n        // 自定义释放逻辑\n        delete\
    \ ptr;\n    }\n};\n\nint main() {\n    std::unique_ptr<int, CustomDeleter> ptr(new\
    \ int(42));\n}\n```\n\n## 智能指针的最佳实践\n\n- 当需要独占所有权时，优先使用 `std::unique_ptr`。\n-\
    \ 谨慎使用 `std::shared_ptr` 进行共享所有权，因为其性能影响。\n- 考虑使用 `std::weak_ptr` 来打破潜在的循环引用。\n\
