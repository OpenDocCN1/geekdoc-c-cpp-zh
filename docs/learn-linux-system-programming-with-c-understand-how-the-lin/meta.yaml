    \n### 从文件读取\n\n**read**系统调用用于从打开的文件中读取数据。\n\n```cpp\n#include <unistd.h>\n\nssize_t\
    \ read(int fd, void *buf, size_t count);\n```\n\n- **fd**：打开文件的文件描述符。\n- **buf**：指向数据将被存储的缓冲区的指针。\n\
    - **count**：要读取的最大字节数。\n\n**read**函数返回实际读取的字节数，如果发生错误则返回-1。\n\n### 写入文件\n\n**write**系统调用用于向打开的文件写入数据。\n\
    \n```cpp\n#include <unistd.h>\nssize_t write(int fd, const void *buf, size_t count);\n\
    ```\n\n- **fd**：打开文件的文件描述符。\n- **buf**：指向包含要写入数据的缓冲区的指针。\n- **count**：要写入的字节数。\n\
    \nwrite函数返回实际写入的字节数，如果发生错误则返回-1。\n\n### 关闭文件\n\nclose系统调用用于关闭一个打开的文件。\n\n```cpp\n\
    #include <unistd.h>\nint close(int fd);\n```\n\n- **fd**：要关闭的文件的文件描述符。\n\nclose函数成功时返回0，如果发生错误则返回-1。\n\
    \n### 示例\n\n```cpp\n#include <iostream>\n#include <fstream>\n#include <fcntl.h>\n\
    #include <unistd.h>\n\nint main() {\n    // Create a file\n    int fd = open(\"\
    test.txt\", O_CREAT | O_WRONLY, 0644);\n    if (fd == -1) {\n        std::cerr\
    \ << \"Error creating file\" << std::endl;\n        return 1;\n    }\n    // Write\
    \ some data\n    const char *data = \"Hello, world!\\n\";\n    ssize_t bytes_written\
    \ = write(fd, data, strlen(data));\n    if (bytes_written == -1) {\n        std::cerr\
    \ << \"Error writing to file\" << std::endl;\n        close(fd);\n        return\
    \ 1;\n    }\n    // Close the file\n    close(fd);\n\n    // Open the file for\
    \ reading\n    fd = open(\"test.txt\", O_RDONLY);\n    if (fd == -1) {\n     \
    \   std::cerr << \"Error opening file for reading\" << std::endl;\n        return\
    \ 1;\n    }\n    // Read and print the contents\n    char buffer[100];\n    ssize_t\
