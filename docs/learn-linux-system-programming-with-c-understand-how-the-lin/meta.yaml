    \ a thread waiting on the condition variable.\n- **pthread_cond_broadcast:** Signals\
    \ all threads waiting on the condition variable.\n- **pthread_cond_destroy:**\
    \ Destroys a condition variable.\n\n### Choosing the Right Primitive"
