    \ guaranteed delivery, ordered delivery, error checking.\n- **UDP (User Datagram\
    \ Protocol)**: Unreliable, connectionless, no guaranteed delivery, no order, no\
    \ error checking, faster than TCP.\n- Other socket types include raw sockets,\
    \ UNIX domain sockets, etc.\n\n## Socket APIs:\n\n- `bind()`: Associates a socket\
    \ with a local address.\n- `listen()`: Indicates that the socket is ready to accept\
    \ connections.\n- `accept()`: Accepts an incoming connection.\n- `connect()`:\
    \ Establishes a connection to a remote socket.\n- `send()` and `recv()`: Send\
    \ and receive data over a socket.\n- `close()`: Closes a socket.\n\n## Socket\
    \ Options:\n\n- `SO_REUSEADDR`: Allows multiple processes to bind to the same\
    \ address and port.\n- `SO_KEEPALIVE`: Enables keep-alive probes to check for\
    \ connection liveness.\n- `SO_LINGER`: Controls the behaviour of closing a socket.\n\
    - Many other options are available for fine-tuning socket behaviour.\n\n## Socket\
    \ Security:\n\n- **Encryption**: Use encryption protocols like TLS/SSL to protect\
    \ data in transit.\n- **Authentication**: Verify the identity of the other party\
    \ using authentication mechanisms.\n- **Authorization**: Control access to resources\
    \ based on user permissions.\n\n## Signal Handling in Linux System Programming\
    \ with C++\n\n### Introduction to Signals\n\nSignals are asynchronous notifications\
    \ sent to a process to indicate an event. They can be generated by the kernel,\
    \ other processes, or even the process itself. Some common signals include:\n\n\
    - `SIGINT`: Interrupt (typically generated by Ctrl+C)\n- `SIGTERM`: Termination\
    \ request\n- `SIGKILL`: Kill process immediately\n- `SIGSEGV`: Segmentation fault\n\
    - `SIGALRM`: Alarm clock\n\n### Handling Signals with `signal()`\n\nThe `signal()`\
    \ function is the simplest way to handle signals. It takes two arguments: the\
    \ signal number and a pointer to the signal handler function.\n\n```cpp\n#include\
    \ <iostream>\n#include <signal.h>\n\nvoid my_handler(int sig) {\n    std::cout\
    \ << \"Caught signal \" << sig << std::endl;\n}\n\nint main() {\n    signal(SIGINT,\
    \ my_handler);\n\n    // ... your code here ...\n\n    return 0;\n}\n```\n\nHowever,\
    \ `signal()` has limitations:\n\n- It's not thread-safe.\n- It can only install\
    \ one handler per signal.\n- The behaviour of the signal after the handler returns\
    \ is not always deterministic.\n\n### Handling Signals with `sigaction()`\n\n\
    The `sigaction()` function provides more control over signal handling:\n\n```cpp\n\
    #include <iostream>\n#include <signal.h>\n\nvoid my_handler(int sig) {\n    std::cout\
    \ << \"Caught signal \" << sig << std::endl;\n}\n\nint main() {\n    struct sigaction\
    \ sa;\n    sa.sa_handler = my_handler;\n    sigemptyset(&sa.sa_mask); // Block\
    \ no signals during handler\n    sa.sa_flags = 0;\n\n    if (sigaction(SIGINT,\
    \ &sa, nullptr) == -1) {\n        perror(\"sigaction\");\n        exit(1);\n \
    \   }\n\n    // ... your code here ...\n\n    return 0;\n}\n```\n\nThe `sigaction`\
    \ structure provides more options:\n\n- `sa_handler`: Pointer to the signal handler\
    \ function.\n- `sa_mask`: A signal set specifying which signals should be blocked\
    \ during the handler execution.\n- `sa_flags`: Additional flags, such as `SA_RESTART`\
    \ to restart interrupted system calls.\n\n### Signal Masks\n\nThe `sigprocmask()`\
    \ function can be used to block or unblock signals:\n\n```cpp\n#include <iostream>\n\
    #include <signal.h>\n\nint main() {\n    sigset_t mask;\n    sigemptyset(&mask);\n\
    \    sigaddset(&mask, SIGINT);\n\n    if (sigprocmask(SIG_BLOCK, &mask, nullptr)\
    \ == -1) {\n        perror(\"sigprocmask\");\n        exit(1);\n    }\n\n    //\
    \ ... critical section where SIGINT is blocked ...\n\n    if (sigprocmask(SIG_UNBLOCK,\
    \ &mask, nullptr) == -1) {\n        perror(\"sigprocmask\");\n        exit(1);\n\
    \    }\n\n    return 0;\n}\n```\n\n### Pending Signals\n\nThe `sigpending()` function\
    \ can be used to check for pending signals:\n\n```cpp\n#include <iostream>\n#include\
    \ <signal.h>\n\nint main() {\n    sigset_t pending;\n    sigemptyset(&pending);\n\
    \n    if (sigpending(&pending) == -1) {\n        perror(\"sigpending\");\n   \
    \     exit(1);\n    }\n\n    if (sigismember(&pending, SIGINT)) {\n        std::cout\
    \ << \"SIGINT is pending\" << std::endl;\n    }\n\n    return 0;\n}\n```\n\n###\
    \ Common Signal Handling Scenarios\n\n- **Graceful Termination:** Handle `SIGINT`\
    \ and `SIGTERM` to perform cleanup actions before exiting.\n- **Error Handling:**\
    \ Handle signals like `SIGSEGV` and `SIGABRT` to log errors and provide informative\
    \ messages.\n- **Timeouts:** Use `SIGALRM` to implement timeouts for operations.\n\
    - **Inter-Process Communication:** Signals can be used for simple communication\
    \ between processes.\n\n### Important Considerations\n\n- Signal handlers should\
    \ be as short and simple as possible. Avoid complex operations within the handler.\n\
    - Be aware of reentrancy issues. Signal handlers can be called at any time, even\
    \ while your program is in critical sections.\n- Use `sigaction()` instead of\
    \ `signal()` for more control and flexibility.\n- Consider using asynchronous\
    \ signal safe functions within signal handlers.\n- Test your signal handling code\
    \ thoroughly.\n\n### Example: Graceful Termination\n\n```cpp\n#include <iostream>\n\
    #include <signal.h>\n\nvolatile bool running = true;\n\nvoid signal_handler(int\
    \ sig) {\n    std::cout << \"Caught signal \" << sig << std::endl;\n    running\
    \ = false;\n}\n\nint main() {\n    signal(SIGINT, signal_handler);\n    signal(SIGTERM,\
    \ signal_handler);\n\n    while (running) {\n        // ... your code here ...\n\
    \    }\n\n    std::cout << \"Exiting gracefully...\" << std::endl;\n    return\
    \ 0;\n}\n```\n\nBy understanding and effectively using signals, you can write\
    \ more robust and resilient applications in Linux system programming.\n\n## Time\
    \ and Scheduling in Linux System Programming with C++\n\nTime and scheduling are\
    \ fundamental aspects of system programming. Linux provides a rich set of functions\
    \ and system calls to manipulate time and control process execution. This article\
    \ explores key concepts and practical examples using C++.\n\n### Time Measurement\n\
    \n#### Time-related Data Structures\n\n- `time_t`: Represents calendar time as\
    \ the number of seconds elapsed since the Unix epoch (January 1, 1970, 00:00:00\
    \ UTC).\n- `struct tm`: Holds broken-down time information (year, month, day,\
    \ hour, minute, second, etc.).\n\n#### Getting Current Time\n\n```cpp\n#include\
    \ <iostream>\n#include <ctime>\n\nint main() {\n    time_t now = time(nullptr);\n\
    \    std::cout << \"Current time: \" << ctime(&now);\n\n    struct tm *local_time\
    \ = localtime(&now);\n    std::cout << \"Local time: \" << local_time->tm_year\
    \ + 1900 << \"-\"\n              << local_time->tm_mon + 1 << \"-\"\n        \
    \      << local_time->tm_mday << \" \"\n              << local_time->tm_hour <<\
    \ \":\"\n              << local_time->tm_min << \":\"\n              << local_time->tm_sec\
    \ << std::endl;\n\n    return 0;\n}\n```\n\n### High-Resolution Timers\n\nFor\
    \ more precise time measurements, use `clock_gettime`:\n\n```cpp\n#include <iostream>\n\
    #include <time.h>\n\nint main() {\n    struct timespec start, end;\n    clock_gettime(CLOCK_MONOTONIC,\
    \ &start);\n\n    // Code to be timed\n\n    clock_gettime(CLOCK_MONOTONIC, &end);\n\
    \n    double elapsed = (end.tv_sec - start.tv_sec) +\n                     (end.tv_nsec\
    \ - start.tv_nsec) / 1e9;\n    std::cout << \"Elapsed time: \" << elapsed << \"\
    \ seconds\" << std::endl;\n\n    return 0;\n}\n```\n\n### Scheduling\n\nLinux\
    \ provides various mechanisms to control process scheduling:\n\n#### Scheduling\
    \ Policies\n\n- SCHED_OTHER: Standard time-sharing policy.\n- SCHED_FIFO: First-in-first-out\
    \ real-time policy.\n- SCHED_RR: Round-robin real-time policy.\n\n#### Setting\
    \ Scheduling Policy and Priority\n\n```cpp\n#include <iostream>\n#include <sched.h>\n\
    \nint main() {\n    struct sched_param param;\n    param.sched_priority = 90;\
    \ // Adjust priority as needed\n\n    if (sched_setscheduler(0, SCHED_FIFO, &param)\
    \ == -1) {\n        perror(\"sched_setscheduler\");\n        return 1;\n    }\n\
    \n    std::cout << \"Scheduling policy set to SCHED_FIFO\" << std::endl;\n\n \
    \   return 0;\n}\n```\n\n**Note:** Setting a real-time priority requires appropriate\
    \ permissions.\n\n### Sleeping and Alarms\n\n- `sleep`: Suspends the current process\
    \ for a specified number of seconds.\n- `usleep`: Suspends the current process\
    \ for a specified number of microseconds.\n- `alarm`: Schedules a signal to be\
    \ sent to the process after a specified number of seconds."
  mdcn: "## 套接字类型：\n\n- **TCP（传输控制协议）**：可靠、面向连接、保证交付、有序交付、错误检查。\n- **UDP（用户数据报协议）**：不可靠、无连接、不保证交付、无序、无错误检查，比TCP更快。\n\
    - 其他套接字类型包括原始套接字、UNIX域套接字等。\n\n## 套接字API：\n\n- `bind()`：将套接字与本地地址关联。\n- `listen()`：表示套接字已准备好接受连接。\n\
    - `accept()`：接受传入的连接。\n- `connect()`：建立与远程套接字的连接。\n- `send()` 和 `recv()`：通过套接字发送和接收数据。\n\
    - `close()`：关闭套接字。\n\n## 套接字选项：\n\n- `SO_REUSEADDR`：允许多个进程绑定到相同的地址和端口。\n- `SO_KEEPALIVE`：启用保活探测以检查连接活性。\n\
    - `SO_LINGER`：控制关闭套接字时的行为。\n- 还有许多其他选项可用于微调套接字行为。\n\n## 套接字安全：\n\n- **加密**：使用TLS/SSL等加密协议保护传输中的数据。\n\
    - **认证**：使用身份验证机制验证对方身份。\n- **授权**：基于用户权限控制对资源的访问。\n\n## C++ Linux系统编程中的信号处理\n\
    \n### 信号简介\n\n信号是发送给进程的异步通知，用于指示某个事件。它们可以由内核、其他进程甚至进程本身生成。一些常见的信号包括：\n\n- `SIGINT`：中断（通常由Ctrl+C生成）\n\
    - `SIGTERM`：终止请求\n- `SIGKILL`：立即终止进程\n- `SIGSEGV`：段错误\n- `SIGALRM`：闹钟\n\n### 使用\
    \ `signal()` 处理信号\n\n`signal()` 函数是处理信号最简单的方式。它接受两个参数：信号编号和指向信号处理函数的指针。\n\n```cpp\n\
    #include <iostream>\n#include <signal.h>\n\nvoid my_handler(int sig) {\n    std::cout\
    \ << \"Caught signal \" << sig << std::endl;\n}\n\nint main() {\n    signal(SIGINT,\
    \ my_handler);\n\n    // ... your code here ...\n\n    return 0;\n}\n```\n\n然而，`signal()`\
    \ 有其局限性：\n\n- 它不是线程安全的。\n- 每个信号只能安装一个处理程序。\n- 处理程序返回后信号的行为并不总是确定的。\n\n### 使用 `sigaction()`\
    \ 处理信号\n\n`sigaction()` 函数提供了对信号处理的更多控制：\n\n```cpp\n#include <iostream>\n#include\
    \ <signal.h>\n\nvoid my_handler(int sig) {\n    std::cout << \"Caught signal \"\
    \ << sig << std::endl;\n}\n\nint main() {\n    struct sigaction sa;\n    sa.sa_handler\
    \ = my_handler;\n    sigemptyset(&sa.sa_mask); // 在处理程序执行期间不阻塞任何信号\n    sa.sa_flags\
    \ = 0;\n\n    if (sigaction(SIGINT, &sa, nullptr) == -1) {\n        perror(\"\
    sigaction\");\n        exit(1);\n    }\n\n    // ... your code here ...\n\n  \
    \  return 0;\n}\n```\n\n`sigaction` 结构体提供了更多选项：\n\n- `sa_handler`：指向信号处理函数的指针。\n\
    - `sa_mask`：一个信号集，指定在处理程序执行期间应阻塞哪些信号。\n- `sa_flags`：附加标志，例如 `SA_RESTART` 用于重启被中断的系统调用。\n\
    \n### 信号掩码\n\n`sigprocmask()` 函数可用于阻塞或解除阻塞信号：\n\n```cpp\n#include <iostream>\n\
    #include <signal.h>\n\nint main() {\n    sigset_t mask;\n    sigemptyset(&mask);\n\
    \    sigaddset(&mask, SIGINT);\n\n    if (sigprocmask(SIG_BLOCK, &mask, nullptr)\
    \ == -1) {\n        perror(\"sigprocmask\");\n        exit(1);\n    }\n\n    //\
    \ ... SIGINT 被阻塞的临界区 ...\n\n    if (sigprocmask(SIG_UNBLOCK, &mask, nullptr) ==\
    \ -1) {\n        perror(\"sigprocmask\");\n        exit(1);\n    }\n\n    return\
    \ 0;\n}\n```\n\n### 待处理信号\n\n`sigpending()` 函数可用于检查待处理的信号：\n\n```cpp\n#include\
    \ <iostream>\n#include <signal.h>\n\nint main() {\n    sigset_t pending;\n   \
    \ sigemptyset(&pending);\n\n    if (sigpending(&pending) == -1) {\n        perror(\"\
    sigpending\");\n        exit(1);\n    }\n\n    if (sigismember(&pending, SIGINT))\
    \ {\n        std::cout << \"SIGINT is pending\" << std::endl;\n    }\n\n    return\
    \ 0;\n}\n```\n\n### 常见信号处理场景\n\n- **优雅终止：** 处理 `SIGINT` 和 `SIGTERM` 以在退出前执行清理操作。\n\
    - **错误处理：** 处理 `SIGSEGV` 和 `SIGABRT` 等信号以记录错误并提供信息性消息。\n- **超时：** 使用 `SIGALRM`\
    \ 为操作实现超时。\n- **进程间通信：** 信号可用于进程间的简单通信。\n\n### 重要注意事项\n\n- 信号处理程序应尽可能简短和简单。避免在处理程序中执行复杂操作。\n\
    - 注意重入问题。信号处理程序可能在任何时候被调用，甚至在你的程序处于临界区时。\n- 使用 `sigaction()` 而不是 `signal()` 以获得更多的控制和灵活性。\n\
    - 考虑在信号处理程序中使用异步信号安全函数。\n- 彻底测试你的信号处理代码。\n\n### 示例：优雅终止\n\n```cpp\n#include <iostream>\n\
    #include <signal.h>\n\nvolatile bool running = true;\n\nvoid signal_handler(int\
    \ sig) {\n    std::cout << \"Caught signal \" << sig << std::endl;\n    running\
    \ = false;\n}\n\nint main() {\n    signal(SIGINT, signal_handler);\n    signal(SIGTERM,\
    \ signal_handler);\n\n    while (running) {\n        // ... your code here ...\n\
    \    }\n\n    std::cout << \"Exiting gracefully...\" << std::endl;\n    return\
    \ 0;\n}\n```\n\n通过理解和有效使用信号，你可以在Linux系统编程中编写更健壮和更有弹性的应用程序。\n\n## C++ Linux系统编程中的时间与调度\n\
    \n时间和调度是系统编程的基本方面。Linux提供了一套丰富的函数和系统调用来操作时间和控制进程执行。本文探讨使用C++的关键概念和实际示例。\n\n###\
    \ 时间测量\n\n#### 时间相关数据结构\n\n- `time_t`：表示日历时间，即自Unix纪元（1970年1月1日，00:00:00 UTC）以来经过的秒数。\n\
    - `struct tm`：保存分解后的时间信息（年、月、日、时、分、秒等）。\n\n#### 获取当前时间\n\n```cpp\n#include <iostream>\n\
    #include <ctime>\n\nint main() {\n    time_t now = time(nullptr);\n    std::cout\
    \ << \"Current time: \" << ctime(&now);\n\n    struct tm *local_time = localtime(&now);\n\
    \    std::cout << \"Local time: \" << local_time->tm_year + 1900 << \"-\"\n  \
    \            << local_time->tm_mon + 1 << \"-\"\n              << local_time->tm_mday\
    \ << \" \"\n              << local_time->tm_hour << \":\"\n              << local_time->tm_min\
    \ << \":\"\n              << local_time->tm_sec << std::endl;\n\n    return 0;\n\
    }\n```\n\n### 高分辨率计时器\n\n对于更精确的时间测量，使用 `clock_gettime`：\n\n```cpp\n#include <iostream>\n\
    #include <time.h>\n\nint main() {\n    struct timespec start, end;\n    clock_gettime(CLOCK_MONOTONIC,\
    \ &start);\n\n    // 要计时的代码\n\n    clock_gettime(CLOCK_MONOTONIC, &end);\n\n \
    \   double elapsed = (end.tv_sec - start.tv_sec) +\n                     (end.tv_nsec\
    \ - start.tv_nsec) / 1e9;\n    std::cout << \"Elapsed time: \" << elapsed << \"\
    \ seconds\" << std::endl;\n\n    return 0;\n}\n```\n\n### 调度\n\nLinux提供了多种机制来控制进程调度：\n\
    \n#### 调度策略\n\n- SCHED_OTHER：标准分时策略。\n- SCHED_FIFO：先进先出实时策略。\n- SCHED_RR：轮转实时策略。\n\
    \n#### 设置调度策略和优先级\n\n```cpp\n#include <iostream>\n#include <sched.h>\n\nint main()\
    \ {\n    struct sched_param param;\n    param.sched_priority = 90; // 根据需要调整优先级\n\
    \n    if (sched_setscheduler(0, SCHED_FIFO, &param) == -1) {\n        perror(\"\
    sched_setscheduler\");\n        return 1;\n    }\n\n    std::cout << \"Scheduling\
    \ policy set to SCHED_FIFO\" << std::endl;\n\n    return 0;\n}\n```\n\n**注意：**\
    \ 设置实时优先级需要适当的权限。\n\n### 休眠和闹钟\n\n- `sleep`：将当前进程挂起指定的秒数。\n- `usleep`：将当前进程挂起指定的微秒数。\n\
    - `alarm`：安排在指定的秒数后向进程发送信号。"
