    }\n```\n\nThis code is not thread-safe because multiple threads can access and\
    \ modify counter concurrently, leading to unpredictable results.\n\n### Making\
    \ the code thread-safe using a mutex:\n\n```cpp\n#include <pthread.h>\n#include\
    \ <iostream>\n\nint counter = 0;\npthread_mutex_t mutex;\n\nvoid* increment_counter(void*\
    \ arg) {\n    for (int i = 0; i < 10000; ++i) {\n        pthread_mutex_lock(&mutex);\n\
    \        counter++;\n        pthread_mutex_unlock(&mutex);\n    }\n    return\
