    # ### Processes


    A process is an instance of a program in execution. It encapsulates its own address
    space, memory, open files, and other resources. Creating a new process involves
    substantial overhead as the operating system allocates and manages these resources.


    **Process Creation** In C++, process creation is typically achieved using the
    `fork()` system call. This function creates a child process that is an exact copy
    of the parent process, including its memory space. However, the return value of
    `fork()` differs for the parent and child processes:'
