  md: '# # File permissions and ownership


    Understanding File Permissions


    In Linux, file permissions determine who can access a file and what they can do
    with it. There are three categories of users:


    +   - **Owner:** The user who created the file.

    - **Group:** A group of users that the file belongs to.

    - **Others:** All other users on the system.


    For each category, there are three types of permissions:


    +   - **Read (r):** Allows reading the file''s contents.

    - **Write (w):** Allows modifying the file''s contents.

    - **Execute (x):** Allows executing the file (if it''s an executable) or entering
    a directory.


    Permissions are typically represented as a nine-character string, with three characters
    for each category. For example, `-rwxr-xr-x` means:


    +   - Owner: Read, write, and execute permissions.

    - Group: Read and execute permissions.

    - Others: Read and execute permissions.


    Checking File Permissions


    The `stat` system call provides information about a file, including its permissions.'
  merge: -1
  pgno: 151
