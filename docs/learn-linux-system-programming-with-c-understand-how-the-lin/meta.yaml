    \nValgrind 是一个强大的工具，可用于内存泄漏检测、缓存分析和性能分析。其 callgrind 工具提供详细的调用图信息。\n\n```bash\n\
    valgrind --tool=callgrind ./main\n```\n\n输出将保存在名为 callgrind.out 的文件中。你可以使用 kcachegrind\
    \ 进行可视化。\n\n## perf\n\nperf 是 Linux 内核性能计数器，提供低开销的性能分析。它可以测量 CPU 周期、缓存未命中、分支未命中等性能指标。\n\
    \n```bash\nperf record -g ./main\nperf report\n```\n\n## 性能指标\n\n有多种指标用于衡量性能：\n\
