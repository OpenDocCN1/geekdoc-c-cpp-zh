    \    return 0;\n}\n```\n\nBy using a mutex, we ensure that only one thread can\
    \ access `counter` at a time, preventing race conditions.\n\n### Deadlocks\n\n\
    A deadlock occurs when two or more threads are blocked, each waiting for a resource\
    \ held by another thread. This results in a standstill.\n\n**Conditions for deadlock:**\n\
    \n- Mutual exclusion: Resources are held exclusively by one thread at a time.\n\
    - Hold and wait: A thread holds at least one resource and is waiting for additional\
    \ resources.\n- No preemption: Resources cannot be forcibly taken from a thread.\n\
    - Circular wait: A chain of dependencies exists among threads, where each thread\
    \ is waiting for a resource held by the next thread in the chain.\n\n### Preventing\
    \ deadlocks:\n\n- Avoid nested locks: Acquire locks in a specific order.\n- Use\
    \ timeouts: Set timeouts for resource acquisition to avoid indefinite waiting.\n\
    - Deadlock detection and recovery: Implement mechanisms to detect deadlocks and\
    \ take corrective actions.\n\n### Example of a deadlock:\n\n```cpp\n// code with\
    \ two threads and two mutexes\n```\n\nIf both threads acquire one mutex and then\
    \ try to acquire the other, a deadlock can occur.\n\n### Additional Topics\n\n\
    - **Thread pools:** Efficiently manage thread creation and reuse.\n- **Process\
    \ groups:** Manage groups of related processes.\n- **Signals:** Handle asynchronous\
    \ events.\n- **Inter-process communication (IPC) mechanisms:** In-depth exploration\
    \ of pipes, named pipes, message queues, shared memory, and sockets.\n\n## Synchronisation\
    \ Primitives: Mutexes, Semaphores, and Condition Variables\n\nIn concurrent programming,\
    \ synchronisation primitives are essential tools for managing shared resources\
    \ and coordinating the execution of multiple threads. They help prevent race conditions,\
    \ deadlocks, and other concurrency-related issues. This section will delve into\
    \ three fundamental synchronisation primitives: mutexes, semaphores, and condition\
    \ variables.\n\n### Mutexes\n\nA mutex (mutual exclusion) is a binary semaphore\
    \ used to protect shared data from concurrent access. It ensures that only one\
    \ thread can hold the mutex at a time, preventing data corruption.\n\n```cpp\n\
    #include <pthread.h>\n\npthread_mutex_t mutex;\n\nvoid *thread_function(void *arg)\
    \ {\n    pthread_mutex_lock(&mutex);\n    // Critical section\n    pthread_mutex_unlock(&mutex);\n\
    \    return NULL;\n}\n```\n\n- **pthread_mutex_init**: Initialises a mutex.\n\
    - **pthread_mutex_lock**: Acquires the mutex. If the mutex is already held, the\
    \ thread blocks until it becomes available.\n- **pthread_mutex_unlock**: Releases\
    \ the mutex.\n- **pthread_mutex_destroy**: Destroys a mutex.\n\n### Semaphores\n\
    \nA semaphore is a generalised synchronisation primitive that counts the number\
    \ of available resources. It can be used for both mutual exclusion (like a mutex)\
    \ and controlling access to a limited number of resources.\n\n```cpp\n#include\
    \ <semaphore.h>\n\nsem_t semaphore;\n\nvoid *thread_function(void *arg) {\n  \
    \  sem_wait(&semaphore);\n    // Access shared resource\n    sem_post(&semaphore);\n\
    \    return NULL;\n}\n```\n\n- **sem_init**: Initialises a semaphore with a specified\
    \ initial value.\n- **sem_wait**: Decrements the semaphore value. If the value\
    \ becomes negative, the thread blocks.\n- **sem_post**: Increments the semaphore\
    \ value. If there are blocked threads, one is unblocked.\n- **sem_destroy**: Destroys\
    \ a semaphore.\n\n### Condition Variables\n\nA condition variable is used to signal\
    \ a change in a shared condition. Threads can wait on a condition variable until\
    \ it is signalled by another thread. It's often used in conjunction with a mutex\
    \ to protect the shared condition.\n\n![](img/762959ed846afa7454a9bbceff173a4e_108_0.png)\n\
    \n- **pthread_cond_init:** Initialises a condition variable.\n- **pthread_cond_wait:**\
