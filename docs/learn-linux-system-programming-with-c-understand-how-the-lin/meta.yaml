  md: "# UDP (User Datagram Protocol)\n\nUDP is a connectionless protocol, meaning\
    \ it doesn't establish a connection before sending data. It's faster but less\
    \ reliable than TCP.\n\n# Key Features:\n\n+   - **Connectionless:** No handshake\
    \ required, datagrams sent independently.\n- **Unreliable:** No guarantee of delivery,\
