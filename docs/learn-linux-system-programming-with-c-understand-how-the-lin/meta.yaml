    \ (UDP Server):\n\n```\nC++\n#include <iostream>\n#include <sys/socket.h>\n#include\
    \ <netinet/in.h>\n#include <arpa/inet.h>\n#include <string.h>\n#include <unistd.h>\n\
    \nint main()\n{\n    int sockfd = socket(AF_INET, SOCK_DGRAM, 0);\n    if (sockfd\
    \ < 0)\n        perror(\"socket\");\n        exit(1);\n    }\n    struct sockaddr_in\
    \ server_addr;\n    memset(&server_addr, 0, sizeof(server_addr));\n    server_addr.sin_family\
    \ = AF_INET;\n    server_addr.sin_addr.s_addr = INADDR_ANY;\n    server_addr.sin_port\
    \ = htons(8080); // Replace with desired port\n```"
