    Essential Debugging Tools


    +   - **GDB (GNU Debugger):** A powerful command-line debugger that allows you
    to inspect variables, set breakpoints, and step through code execution.

    - **Valgrind:** A memory management and profiling tool that helps identify memory
    leaks and other memory-related issues.

    - **AddressSanitizer (ASan):** A compiler-based tool for detecting memory errors
    such as use-after-free and heap buffer overflows.

    - **UndefinedBehaviorSanitizer (UBSanitizer):** Detects undefined behaviour in
    C++ code.

    - **Core dumps:** Generated when a program crashes unexpectedly, providing a snapshot
    of the program''s state.


