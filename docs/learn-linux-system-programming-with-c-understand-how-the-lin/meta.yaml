    \ 计数信号量的一种特殊情况，最大值为1。本质上，它的行为类似于互斥锁。\n\n### 信号量操作\n\n- **sem_init：** 使用指定的初始值初始化信号量。\n\
    - **sem_wait：** 递减信号量值。如果值变为负数，线程将阻塞。\n- **sem_post：** 递增信号量值。如果有被阻塞的线程，其中一个将被解除阻塞。\n\
    - **sem_destroy：** 销毁信号量。\n\n### 示例：资源池\n\n考虑一个场景，你有有限数量的数据库连接。你可以使用信号量来控制对这些连接的访问：\n\
