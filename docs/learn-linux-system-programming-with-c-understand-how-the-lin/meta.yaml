    \n## 高级内存管理：智能指针\n\n## 理解智能指针\n\n智能指针是 C++ 内存管理的一项重大进步。它们封装了原始指针并提供自动内存管理，有助于防止内存泄漏和悬空指针。\n\
    \n## 智能指针的类型\n\nC++ 标准库提供了三种主要的智能指针类型：\n\n1. **std::unique_ptr**\n    - 表示对资源的独占所有权。\n\
