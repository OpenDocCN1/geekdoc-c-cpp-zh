- md: "## Memory Allocation with malloc\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n\
    \nint main() {\n    int *ptr = (int*) malloc(sizeof(int));\n    *ptr = 42;\n \
    \   std::cout << *ptr << std::endl;\n\n    free(ptr);\n    return 0;\n}\n```\n\
    \n## Memory Allocation with calloc\n\ncalloc is similar to malloc but initialises\
