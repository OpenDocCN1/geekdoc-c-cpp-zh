    - VirtualBox, from https://www.virtualbox.org/\n- Git, from http://git-scm.com/downloads\n\
    \n# Version Basics\n\nIn software development, the term **versioning** or, more\
    \ accurately, **version control** refers specifically to this:\n\n- track the\
    \ changes of files over time and label those changes with helpful change messages\n\
    - revert those files to any of their previous versions (an infinite number of\
    \ \"undo\" operations)\n- share changes with others in a way that's visible and\
    \ immediately clear to every team member\n- have a central location for all source\
    \ code from which all other team members (and sometimes random enthusiasts) grab\
    \ your code and work on it\n\nConceptually, version control in software development\
    \ is similar to applying version control in other programs, as tracking people's\
