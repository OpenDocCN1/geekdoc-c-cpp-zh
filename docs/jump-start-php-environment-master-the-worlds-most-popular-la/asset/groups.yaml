- md: "\n# Jump Start PHP Environment\n\n**Pros:** very fast, feature-rich, stable\
    \ (never crashes), cross-platform support\n\n**Cons:** costs money, can be resource-intensive,\
    \ and is unfriendly to older computers. See requirements at\nhttps://www.jetbrains.com/phpstorm/help/system-requirements-and-installation.html.\n\
    \n# NetBeans\n\nNetBeans$^6$, an open-source IDE, sports almost all the features\
    \ of PhpStorm and is its nemesis. I used NetBeans for two years transitioning\
    \ to PhpStorm, and I recommend it to everyone who needs a good IDE but isn't prepared\
    \ to pay for a commercial one.\n\nNetBeans is slightly slower than PhpStorm and\
    \ more resource-intensive. It is cross-platform, relatively stable, and very reliable.\
    \ The group behind it was acquired by Oracle, and some see this as a bad omen,\
    \ I feel it only cements the reliability of the current version.\n\n**Pros:**\
    \ free, feature-rich, reliable, cross-platform, open source\n\n**Cons:** Oracle-owned,\
    \ lacks commercial support, slower to adopt new features\n\n# Zend Studio\n\n\
    Zend Studio$^7$ is made by the company \"in charge\" of PHP (though, it's been\
    \ acquired by Rogue Wave software, whose name may appear in places where Zend\
    \ used to be). Zend is the company who first brought PHP into existence, and who\
    \ provide official certification for the language.\n\nZend Studio is a commercial\
    \ IDE that's a bit pricier than PhpStorm, but it offers a free trial so you can\
    \ give it a spin before committing to it. It has many of the same features of\
    \ PhpStorm and NetBeans, with some exceptions, as well as some of its tools. Tools\
    \ for easier mobile app development (available in Netbeans and PhpStorm via plugins)\
    \ are built into Zend Studio, and its own Apility platform (a service for creating\
    \ APIs based on their Zend Framework) has a native Zend Studio driver, Don't worry\
    \ if you're unfamiliar with any of these terms, they'll be covered later in the\
    \ book.\n\n> $^6$ https://netbeans.org/\n\n> $^7$ http://www.zend.com/en/products/studio\n\
    \nAnother perk is the built-in support for Zend Server—a special kind of server\
    \ program used to run your PHP application and provide various analyses on running\
    \ code and advanced debugging capabilities. Zend Server is a paid product, though,\
    \ if you want to use it in Zend Studio you'll need to purchase a license. There's\
    \ some basic information about Zend Server here:\n\nhttp://sitepoint.com/getting-know-zend-server/\n\
    \nIf your goal is to become the most “official” PHP developer you can be, with\
    \ certificates and a total knowledge of officially endorsed tools and services,\
    \ Zend Studio is right for you. Otherwise, I'd recommend either of PhpStorm or\
    \ NetBeans.\n\n- **Pros:** great commercial support due to being owned by Zend;\
    \ feature-rich, cross-platform, and integrates with other Zend products\n\n- **Cons:**\
    \ expensive, resource-intensive, and unstable; can be slow\n\nHere are some other\
    \ options you can research at your own leisure, a mix of commercial and free:\n\
    \n- Komodo IDE: http://komodoide.com/\n- Eclipse with PDT: https://eclipse.org/pdt/\n\
    - Aptana Studio: http://www.aptana.com/\n- phpDesigner: http://www.mprosoftware.com/dk/phpdesigner.php\n\
    \nThere’s also a list, ordered by popularity, at\nhttp://www.sitepoint.com/best-php-ide-2014-survey-results.\n\
    \nWhichever IDE you choose, stick with it for a couple of months. The learning\
    \ curve is often high, and you might feel overwhelmed by all the options when\
    \ you start using it. In time you'll become used to everything it offers, even\
    \ if you'll only be using 10% of its functionality in your first 100 days of code.\
    \ There's nothing wrong with switching IDEs at a later date, but give each one\
    \ you try a reasonable chance.\n\nAt this point in time, it is unnecessary to\
    \ download and install an IDE. This book is very light on code, and you'll only\
    \ need one when we reach the later chapters.\n\n# Jump Start PHP Environment\n\
    \n# Beware IDEs with WYSIWYG\n\nOne IDEs do not and should provide not WYSIWYG\
    \ (What You See Is What You Get) editing. Dreamweaver, an IDE by Adobe, is one\
    \ such tool. It's famous for letting you started easily because it allows you\
    \ to pull in elements from a toolbar and drop them visually onto the screen, helping\
    \ you “build code” as if playing with Lego blocks. The code that it generates\
    \ is often suboptimal and bloated, containing more code than necessary and slowing\
    \ a website down. What's more, by skipping the real code part, you're effectively\
    \ holding yourself back. You'll be unable to read anyone else's code, and you'll\
    \ have a far tougher time learning to solve your own problems.\n\nDreamweaver\
    \ is not the only WYSIWYG editor, but it's far the most popular one. If you run\
    \ into an IDE that supports WYSIWYG, I wholeheartedly recommend you in the opposite\
    \ direction.\n\n# The Importance of Coding Standards\n\nCoding standards are rules\
    \ applied to code so that it's consistent across the entire project. For example,\
    \ if Jim writes code this way:\n\n```\nif ($purchaseWasCompleted)\n    $this->succeed();\n\
    else\n    $this->error();\n```\n\nBut Mike writes code like this:\n\n```\n($purchaseWasCompleted)\
    \ ? $this->succeed() : $this->error();\n```\n\nand Joanna writes it as follows:\n\
    \n```\n$pwc = $purchaseWasCompleted;\nif ($pwc)\n{\n    $this->succeed();\n```\n\
    } else {\n    $this->error();\n}\n```\n\n```\nthey have all written the same code\
    \ differently. Now, if Jim reads through Mike's code, it might take him longer\
    \ to go through it purely because he's used to his own way of writing. If they\
    \ both examine Joanna's code, they'll be confused by the amount of code it took\
    \ her to produce the same outcome as them in a different form.\n\nIf, however,\
    \ they agree on a coding standard, they'll produce the exact same code. Once they\
    \ grew to use the standard, they'll be able to read each other's code more fluently,\
    \ noticing bugs and reusing features with ease without any apparent language barriers.\n\
    \nMany IDEs have the ability to automatically apply certain coding standards;\
    \ for example, the current favorite in the PHP world is the PSR-2 coding standard,⁸,\
    \ and all the IDEs have mentioned built-in mechanisms to at least check for, if\
    \ not apply it automatically and autocorrect your code. With PSR-2 (PSR stands\
    \ for PHP Standard Recommendation), code such as this:⁹\n\n```\nclass Test {\n\
    \    protected $name;\n    public function __construct($name) {\n        $pointlessSum\
    \ = 3+4;\n        if ($name)\n            $this->name = $name;\n        else\n\
    \            $this->name = \"Default\";\n    }\n    public function echoName()\
    \ {\n        echo $this->name;\n    }\n}\n```\n\nwould be reformatted to look\
    \ like this:\n\n> ⁸ http://www.php-fig.org/psr/psr-2/\n⁹ Don't worry if you don't\
    \ understand this code, it's just for demonstration purposes.\n\n```\nclass Test\n\
    {\n    public function __construct($name)\n{\n        $pintlessSum = 3 + 4;\n\
    \        if ($this->name = $name) {\n        } else {\n            $this->name\
    \ = \"Default\";\n        }\n    }\n\n    public function echoName()\n{\n    \
    \    echo $this->name;\n    }\n}\n```\n\nMuch more readable, isn't it? And all\
    \ it took some blank lines and spacing changes—that’s more or less everything\
    \ a coding standard does. Trivially simple, but vitally important. Standards also\
    \ detect other aspects, such as uppercase/lowercase letter when naming classes\
    \ and variables (notice the uppercase Test in the previously mentioned code);\
    \ the position of curly braces in logic constructs such as if, for, and others;\
    \ and more.\n\nWe strongly recommend using PSR-2. It's the vast majority of high-quality\
    \ projects out use, making your coding style instantly compatible with that of\
    \ many developers. It will also prepare you for writing code fluently. With an\
    \ IDE, this becomes incredibly easy. For example, in PhpStorm, you would go to\
    \ File > Settings > Editor > Code Style, and select PSR1/PSR2 (PSR-2 improves\
    \ upon PSR-1, so this option applies both). Note: depending on your version of\
    \ PhpStorm, you might also have to select Set From in the Code Style windows.\
    \ In other IDEs, it's as simple as googling for the phrase “PSR-2 in EDITOR” where\
    \ EDITOR is your IDE of choice.\n\n# The Command Line / Terminal\n\nFinally, let's\
    \ briefly look at the command line or terminal. First, a clarification on the\
    \ terminology.\n"
