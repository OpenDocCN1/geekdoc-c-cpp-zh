    # Learn by Example: A Web App from Scratch


    Then, we need to add a remote — we need to let the local repo know where online
    home is. In my case, the command is:


    ```

    git remote add origin git@github.com:spbooks/phppenv1-example.git

    ```


    Alter the URL accordingly.


    # Adding Vagrant-powered Projects to Version Control


    There are two schools of thought regarding committing Vagrant-powered projects
    to version control. The first one, which matches the general consensus and the
    official Vagrant docs, is that the Vagrant and all its accompanying scripts should
    be committed to version control alongside your project''s source code. If you
    choose this path, first remove all traces of version control from the Homestead
    Improved by running rm -rf .git inside, and then run git init and everything we
    describe here from that folder. Proceed as usual — your team now has your Vagrant
    setup. This is very handy for teams dealing commercial, closed-source apps, because
    the setup can be dictated by the team.


    The second approach, the one I personally favor and that, for the sake of simplicity,
    we will take in this chapter, committing only the source code of the project —
    not its surroundings, such as the Vagrantfile, Homestead.yaml, etc. This makes
    sure it''s usable in anyone''s development machine, even those who don''t use
    Vagrant or those who use a different box for running test projects. Here, this
    approach is best for open source projects where you want to give contributors
    the freedom to choose their own development environment. This approach is also
    a bit more lightweight, in terms of filesize. Regardless of the approach you choose,
    you''re not wrong. Pick whatever feels better, or whatever the team you''re working
    with prefers.


    On fresh VMs, Git — when used inside the VM — won''t know who''s using it. To
    make yourself known, optionally execute:


    ```

    git config --global user.name "Your Name"

    git config --global user.email you@example.com

    ```


    If you''re using Git outside the VM to commit the project files approach you take,
    both are just fine), you can skip this step.'
