    \ `index.php` 文件，我们将其中放入一些 PHP 代码。\n\n- 5. 打开该文件夹中的 `Homestead.yaml` 文件，并添加一个新的站点配对，使最终版本看起来如下：\n\
    \n```\nsites:\n  map: homestead.app\n  to: /home/vagrant/Code/Project/public\n\
    \  map: guestbook.app\n  to: /home/vagrant/Code/guestbook/public\n```\n\n- 6.\
