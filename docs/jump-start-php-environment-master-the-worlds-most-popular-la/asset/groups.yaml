    \ Oracle 收购了，有些人认为这是一个不祥预兆，但我认为这只是巩固了当前版本的可靠性。\n\n**优点：** 免费、功能丰富、可靠、跨平台、开源\n\n\
    **缺点：** Oracle 拥有、缺乏商业支持、采用新功能的速度较慢。\n\n# Zend Studio\n\nZend Studio$^7$ 由“负责”\
    \ PHP 的公司制作（尽管它已被 Rogue Wave software 收购，该名称可能会出现在以前 Zend 所在的地方）。Zend 是第一个创建 PHP\
    \ 的公司，并为该语言提供官方认证。\n\nZend Studio 是一个商业 IDE，价格比 PhpStorm 贵一点，但它提供免费试用，让你在决定之前可以先用一下。它拥有\
    \ PhpStorm 和 NetBeans 的许多相同功能，同时也一些另一些工具。Zend Studio 内置了更便于移动应用开发的工具（在 NetBeans\
    \ 和 PhpStorm 中通过插件可用），它自己的 Apility 平台（一种基于其 Zend Framework 创建 API 的服务）拥有原生的 Zend\
    \ Studio 驱动。如果你不熟悉这些术语，不必担心，书中后面会介绍。\n\n> $^6$ https://netbeans.org/\n\n> $^7$\
    \ http://www.zend.com/en/products/studio\n\n另一个好处是内置支持 Zend Server——这是一种特殊的服务器程序，用于运行你的\
    \ PHP 应用，并对运行的代码提供各种分析和高级调试功能。不过，Zend Server 是付费产品，如果你想在 Zend Studio 中使用它，就需要购买许可证。这里有一些关于\
    \ Zend Server 的基本信息：\n\nhttp://sitepoint.com/getting-know-zend-server/\n\n如果你的目标是成为最“官方”的\
    \ PHP 开发者，拥有证书并对官方支持的工具和服务有全面了解，那么 Zend Studio 非常适合你。否则，我建议选择 PhpStorm 或 NetBeans。\n\
    \n- **优点：** 由于归 Zend 所有，拥有极佳的商业支持；功能丰富、跨平台，并与其他 Zend 产品集成。\n\n- **缺点：** 昂贵、消耗资源且不稳定；可能运行缓慢。\n\
    \n这里是一些你可以在空闲时研究的其他选项，涵盖了商业和免费：\n\n- Komodo IDE: http://komodoide.com/\n- Eclipse\
    \ with PDT: https://eclipse.org/pdt/\n- Aptana Studio: http://www.aptana.com/\n\
    - phpDesigner: http://www.mprosoftware.com/dk/phpdesigner.php\n\n还有一个按流行程度排序的列表：\n\
    http://www.sitepoint.com/best-php-ide-2014-survey-results。\n\n无论你选择哪种 IDE，请坚持使用几个月。学习曲线通常很高，当你开始使用时，可能会对所有选项感到无所措。随着时间的推移，你会习惯它提供的一切，即使你在代码的前\
    \ 100 天里只使用了它 10% 的功能。以后再切换 IDE 也没有问题，但请给你尝试的每一个工具一个合理的机会。\n\n在目前，没有必要下载和安装 IDE。这本书对代码要求很少，只有当我们到达后面的章节时你才需要一个。\n\
    \n# 快速上手 PHP 环境\n\n# 注意带有 WYSIWYG 功能的 IDE\n\n某些 IDE 不提供、也不应该提供 WYSIWYG（所见即所得）编辑。Adobe\
    \ 开发的 IDE Dreamweaver 就是其中一种工具。它因能让你轻松上手而闻名，因为它允许你从工具栏拉入元素并视觉化地将其掉到屏幕上，帮助你像玩乐高积木一样“构建代码”。它生成的代码通常不是最优的且臃肿的，包含比必要的更多的代码并减慢网站速度。此外，通过跳过真正的代码部分，你实际上是在限制自己。你将无法阅读任何人的代码，在学习解决自己的问题时也会困难得多。\n\
    \nDreamweaver 不是唯一的 WYSIWYG 编辑器，但它是最受欢迎的。如果你遇到了支持 WYSIWYG 的 IDE，我由衷建议你向反方向选择。\n\
    \n# 编码标准的重要性\n\n编码标准是应用于代码的规则，以确保整个项目代码的一致性。例如，如果 Jim 这样写代码：\n\n```\nif ($purchaseWasCompleted)\n\
    \    $this->succeed();\nelse\n    $this->error();\n```\n\n但 Mike 这样写代码：\n\n```\n\
    ($purchaseWasCompleted) ? $this->succeed() : $this->error();\n```\n\n而 Joanna\
    \ 的写法如下：\n\n```\n$pwc = $purchaseWasCompleted;\nif ($pwc)\n{\n    $this->succeed();\n\
    } else {\n    $this->error();\n}\n```\n\n```\n他们用不同的方式写了相同的代码。现在，如果 Jim 完 Mike\
    \ 的代码，他可能需要花更长时间阅读，仅仅是因为他习惯了了自己的写作方式。如果他们都检查 Joanna 的代码，他们会因为她用不同的形式产出与他们相同结果的代码而感到困惑。\n\
    \n然而，如果他们同意一种编码标准，他们将产生完全相同的代码。一旦他们习惯了这种标准，他们就能更流畅地阅读彼此的代码，轻松地发现 Bug 并复用功能，而没有任何明显的语言障碍。\n\
    \n许多 IDE 都有自动应用某些编码标准的能力；例如，PHP 世界目前最流行的是 PSR-2 编码标准，⁸，所有提到的 IDE 都有内置机制，至少可以检查，如果不是自动应用并纠正你的代码。有了\
    \ PSR-2（PSR 代表 PHP 标准建议），像这样的代码：⁹\n\n```\nclass Test {\n    protected $name;\n\
    \    public function __construct($name) {\n        $pointlessSum = 3+4;\n    \
    \    if ($name)\n            $this->name = $name;\n        else\n            $this->name\
    \ = \"Default\";\n    }\n    public function echoName() {\n        echo $this->name;\n\
    \    }\n}\n```\n\n将被重新格式化为像这样：\n\n> ⁸ http://www.php-fig.org/psr/psr-2/\n⁹ 如果你不理解这段代码，不必担心，它只是为了演示。\n\
    \n```\nclass Test\n{\n    public function __construct($name)\n{\n        $pintlessSum\
    \ = 3 + 4;\n        if ($this->name = $name) {\n        } else {\n           \
    \ $this->name = \"Default\";\n        }\n    }\n\n    public function echoName()\n\
    {\n        echo $this->name;\n    }\n}\n```\n\n可读性多了，不是吗？这只需要一些空行和间距变化——这大致就是编码标准所做的一切。虽然简单易行，但至关重要。标准还能检测其他方面，例如命名类和变量时使用大写/小写字母（注意上述代码中大写的\
    \ Test）；在 if、for 等其他逻辑结构中大括号的位置；以及等等。\n\n我们强烈建议使用 PSR-2。它是我们使用的绝大多数高质量项目中的标准，让你的编码风格立即与许多开发者的风格兼容。它还将为你流畅地编写代码做好准备。有了\
    \ IDE，这变得异常简单。例如，在 PhpStorm 中，你需要进入 File > Settings > Editor > Code Style，并选择\
    \ PSR1/PSR2（PSR-2 在 PSR-1 的基础上改进，因此此选项适用于两者）。注意：取决于你的 PhpStorm 版本，你可能还需要在 Code\
    \ Style 窗口中选择 Set From。在其他 IDE 中，只需搜索“PSR-2 in EDITOR”即可，其中 EDITOR 是你选择的 IDE。\n\
    \n# 命令行 / 终端\n\n最后，让我们简要查看命令行或终端。首先，是对术语的澄清说明。\n\n"
