- md: '

    ## Learn by Example: A Web App from Scratch


    The next step is downloading an FTP client; this example will use FileZilla6,
    but you can use whichever client you prefer. In the Site manager, we add a new
    site and enter the credentials to use by Hostgamer, as shown in Figure 8.26.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_171_0.png)


    Figure 8.26. Configured in Filezilla


    You might be asked to "trust a certificate" when connecting. If so, confirm.

    Once the connection goes through, the right side indicating Remote will show an
    empty folder — in reality, the location is a subfolder of your home folder on
    the shared host''s server. To begin, we will first upload our app by finding it
    in the left frame, and drawing it over the right one.


    16 https://filezilla-project.org/


    ## Jump Start PHP Environment


    Due to copying the entire vendor folder and everything we used in development,
    this might take a while — there''s no proper way to cherry pick what gets copied,
    really. When this is done, we''ll need to delete some of the development files
    and folders (git, .gitignore, database.local.db, etc.) manually.


    We then modify the document root of the domain to lead to caime.com/guest-book/public
    rather than the default caime.com, as shown in Figure 8.27, because otherwise
    our app won''t run at http://caime.com, but better at http://caime.com/guestbook/public.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_172_0.png)


    After the changes apply (it might take a while), we should be able to visit our
    app at the main domain, and we''ll be able to enter new comments, too!


    ## Learn by Example: A Web app from Scratch 151


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_173_0.png)


    Victory!


    The app is now deployed on a shared host and works like a charm. It''s a bit tedious
    to have to reupload all changed files manually, and the app isn''t all that secure,
    but it''s good enough for demos and proof-of-concept apps.


    ## Deploying on DigitalOcean


    Time for the good stuff.


    On DigitalOcean, a VPS provider, you''re given the ability to create droplets.
    A droplet is a virtual private server that is very easy to tear down and rebuild,
    much like a Vagrant box, only performing better. DigitalOcean bills you according
    to the resources a droplet spends, so unless you intend to host a long-running
    application, it makes sense to tear it down after you''re done with to conserve
    credits.


    An added benefit of this type of setup is that you don''t have to get a domain
    just to launch a site — DigitalOcean supports (as do most VPS hosts, as a matter
    of fact) IP-based access, so you can access your app by punching in an IP bound
    to your droplet.


    Figure 8.28. Caime.com with comments


    ## Jump Start PHP Environment


    Additionally, if you don''t want to use DigitalOcean, the procedure is nearly
    identical on every VPS; in all cases, you''re dealing with a typical blank server!


    Droplets can be as cheap as $5 per month and by using someone''s referral link,
    you can get $10 instantly. Here''s my link if you''d like to give the deployment
    procedure below a try: http://bit.ly/dore¹¹⁷


    ## New Droplet


    Assuming you''ve set up a new account and have some credits, let''s create a new
    droplet by going to https://cloud.digitalocean.com/droplets/new, giving it a name,
    and selecting:


    - $5 per month

    - the region nearest to you

    - Ubuntu 14.04 image (it''s the same OS that Homestead Improved uses, helping
    development-production parity and providing us with a familiar environment)

    - No SSH key. We''ll receive a root password via email which we''ll use for remotely
    logging into the server (very similar to vagrant ssh). We''ll use the latter approach,
    considering most readers will likely be without SSH keys. For additional information
    on setting up SSH keys and proper security measures, DigitalOcean''s tutorial
    will be invaluable.


    Once the droplet has been created, you should have access to its main dashboard,
    shown in Figure 8.29.


    ¹⁷ Full disclosure, the owner of the referral link (that''s me!) will receive
    $10 as soon as a person referred their own, not counting the initial.

    ⁸ https://www.digitalocean.com/community/tutorials/how-to-configure-ssh-key-based-authentication-on-


    | Resource | Specification |

    | :--- | :--- |

    | RAM | 512MB |

    | Disk | 20GB |

    | OS | Ubuntu 14.04 x64 |


    - Access

    - Power

    - Resize

    - Snapshots

    - Settings

    - Backups

    - Graphs

    - History

    - Destroy


    Console Access

    This will open a VNC connection to your Droplet and is the equivalent of plugging
    in a monitor and keyboard directly to your virtual server.


    Reset Root Password This will shut down your Droplet and a new root password will
    be set and emailed to you. Do you wish to proceed?


    Figure 8.29. Droplet dashboard


    Notice the IP address underneath its name. Right now, it won''t lead anywhere
    if it''s put in your browser''s URL. We can, however, use it to log into your
    server (whenever you see IP-ADDRESS below, substitute for the IP of your own droplet):


    ```

    ssh root@IP-ADDRESS

    ```


    Use the password from the email when prompted. As soon as you''re logged in, you
    will be asked to change the root password. Change it to something not easily guessable.
    My recommendation would be using a password manager to generate a random one,
    and then paste it in.


    Once in the server, a welcome message might display a warning about locales. This
    can be fixed by running:


    ```

    sudo locale-gen en_US.UTF-8

    export LANG=en_US.UTF-8

    export LC_ALL=en_US.UTF-8

    ```


    What does this tell the OS on the droplet (Ubuntu Linux)? Which language we''re
    using (US English), and the type of encoding used to display its characters is
    a type of encoding which makes possible the use of different alphabets and similar
    miscellaneous characters. UTF-8 is outside the scope of this book chapter, but
    if you''re curious, there''s an absolutely essential (newbie-friendly) bit of
    writing about it at the following link: http://www.leonsoftware.com/articles/Unicode.html


    If your local computer is running OS X or Linux, there might be another setting
    you need to modify. Exit the droplet connection, then edit the file ssh_config
    in /etc/ssh/, and comment out the line by putting a hash in front:


    ```

    # SendEnv LANG LC_*

    ```


    This is due to a common remote access bug. Now we''re ready to install prerequisite
    software.


    ## Prerequisites


    First, we need to have Ubuntu pull a list of the newly available packages. While
    you''re logged into the droplet, run:


    ```

    sudo apt-get update

    ```


    With the list updated, let''s start by installing Git, SQLite3, and nginx:


    ```

    sudo apt-get install git sqlite3 nginx

    ```


    Suddenly, our IP address is live! (Figure 8.30).


    ¹⁹ http://askubuntu.com/a/530829


    ## Learn by Example: A Web app from Scratch


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_177_0.png)


    Figure 8.30. Nginx welcome page


    Next, we need to install PHP.


    ## PHP and Composer


    To install PHP, we run:


    ```

    sudo add-apt-repository ppa:ondrej/php5-5.6

    sudo apt-get update

    sudo apt-get install php5 php5-fpm php5-cli php5-sqlite

    ```


    php5 is the core PHP program. php5-fpm is the web interface through which a server
    like Nginx passes PHP files and gets back a response. php5-cli is the command
    line interface, so we can use PHP in the terminal, without the browser. This is
    what Composer uses to work. php5-sqlite is, of course, a PHP extension for communication
    with SQLite3, which we know we''ll be needing.


    To install Composer globally, like on Homestead Improved, we execute:


    ```

    curl -sS https://getcomposer.org/installer | php

    sudo mv composer.phar /usr/local/bin/composer

    ```


    ## Server Configuration


    To configure Nginx, we can just grab the configuration from our VM! Open a new
    terminal tab or window on the host machine, enter the Vagrant VM we developed
    the app with vagrant ssh as usual, and execute:


    ```

    cp /etc/nginx/sites-available/guestbook.app ~/Code/guestbook-nginx.txt

    ```


    This will make the server configuration immediately available in the VM''s main
    folder. Open it, select its contents (but be careful to ignore or delete the bottom
    lines — those mentioning SSL), copy the selection to the clipboard, and then while
    connected to the droplet (switch back to the window terminal connected to it)
    run:


    ```

    vim /etc/nginx/sites-available/guestbook.app

    ```


    Press the i key to enter insert mode, and paste the contents in there. Then, edit
    the following lines:


    - change the value of server_name from a name (guestbook.app) to the IP of the
    droplet

    - change the value of root to /var/www/guestbook/public


    The var/www/ folder is the location that''s typically used to host applications
    on Linux. Exit insert mode with Esc, then exit the file by typing :x and pressing
    Enter.


    Then, reboot Nginx with:


    ```

    sudo service nginx restart

    ```


    ## Encountering Issues


    If you run into problems a fully white screen, or a cryptic error, check the error
    logs by running tail -f /var/log/nginx/guestbook.app-error.log.

