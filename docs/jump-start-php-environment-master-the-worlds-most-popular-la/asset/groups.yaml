- md: "\n# Learn by Example: A Web App from Scratch 125\n\nPOST requests are usually\
    \ used for saving some data to the server, such as creating new data in a database.\
    \ For a refresher on requests and responses, see Chapter 1.\n\nThe input element\
    \ is the button we'll click to save the comment — the value attribute is what\
    \ is written on the button, while the type is there to make sure this button is\
    \ submitting the form.\n\nIf you refresh http://guestbook.app now, you should\
    \ see a Save button at the bottom of the screen. Clicking it will do nothing but\
    \ refresh the screen (the button submits the form, but since there's no PHP logic\
    \ to process the form, we get redirected to the same page we were on).\n\nAbove\
    \ the input, but still the form element, we add the following:\n\n```html\n<label>Name:<input\
    \ type=\"text\" name=\"name\" placeholder=\"Your name\"></label>\n<label>Email:<input\
    \ type=\"text\" name=\"email\" placeholder=\"your@email.com\"></label>\n<label>Comment:<textarea\
    \ name=\"comment\" cols=\"30\" rows=\"10\"></textarea></label>\n```\n\nHTML forms\
    \ use labels for various form fields describing what is supposed to be entered\
    \ into the field. A label often wraps an element—a tag goes on either side of\
    \ it, in the code above. The type attribute tells the browser is a regular text\
    \ field, the name is there so we can identify the value in the PHP code, and the\
    \ placeholder is there to serve as an example of possible inputs. A textarea is\
    \ a different kind of element with no type, just dimensions expressed in the form\
    \ of columns (cols) and rows.\n\nIf we also remove the dummy outputs from the\
    \ PHP part, we get a final result that looks like this:\n\n```php\n<?php\nrequire_once\
    \ '../vendor/autoload.php';\n\n$database = new medoo(\n  'database_type' => 'sqlite',\n\
    \  'database_file' => '../storage/database.db'\n]);\n?>\n<form method=\"post\"\
    >\n<label>Name:<input type=\"text\" name=\"name\" placeholder=\"Your name\"></label>\n\
    <label>Email:<input type=\"text\" name=\"email\" placeholder=\"your email.com\"\
    ></label>\n<label>Comment:<textarea name=\"comment\" cols=\"30\" rows=\"10\"></textarea></label>\n\
    <input type=\"submit\" value=\"Save\">\n</form>\n```\n\nIt looks like Figure 8.14\
    \ when seen in the browser.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_148_0.png)\n\
    \nFigure 8.14. Form created\n\nIt's quite ugly, but we can deal with that later.\n\
    \n# Second Push\n\nWith some additional files in the mix and our form built, it's\
    \ time to do another Git push:\n\n```bash\ngit add -A\ngit commit -m \"Added HTML5\
    \ Boilerplate and built submission form\"\ngit push origin master\n```\n\n# Creating\
    \ the Comment Class and the Database Table\n\nDeveloping the Comment class from\
    \ scratch with object oriented syntax, however simple it may be, is outside the\
    \ scope of this book. There are plenty of other books you can look for guidance\
    \ on basic OOP — the links at the end of the chapter will be helpful. Right now,\
    \ to get some PHP memory, I would recommend you type the code into a new file\
    \ called Comment.php which you should create in the src subfolder of the root\
    \ folder of our project (the src folder will need to be created, too). Alternatively,\
    \ if you really don't feel like it, the full code is copypasteable at: http://bit.ly/sp-book-comment.\n\
    \n```php\n<?php\nnamespace SitePoint;\n\nclass Comment\n{\n    protected $database;\n\
    \n    protected $name;\n    protected $email;\n    protected $comment;\n    protected\
    \ $submissionDate;\n\n    public function __construct($medoo) {\n        $this->database\
    \ = $medoo;\n    }\n\n    public function findAll() {\n        $collection = [];\n\
    \        $comments = $this->database->select('comments', '*', ['ORDER' => 'comments.submissionDate\
    \ DESC']]);\n        if ($comments) {\n            foreach ($comments as $array)\
    \ {\n                $comment = new self($this->database);\n                $collection[]\
    \ = $comment;\n            }\n        }\n    }\n->setComment($array['comment'])\n\
    ->setEmail($array['email'])\n->setName($array['name'])\n->setSubmissionDate($array['submissionDate']);\n\
    \n}\n\nreturn $collection;\n\npublic function setName($name)\n{\n    $this->name\
    \ = (string)$name;\n\n    return $this;\n}\n\npublic function setEmail($email)\n\
    {\n    if (filter_var($email, FILTER_VALIDATE_EMAIL)) {\n        $this->email\
    \ = $email;\n    } else {\n        throw new \\InvalidArgumentException('Not a\
    \ valid email!');\n    }\n    return $this;\n}\n\npublic function setComment($comment)\n\
    {\n    if (strlen($comment) < 10) {\n        throw new \\InvalidArgumentException('Comment\
    \ too short!');\n    } else {\n        $this->comment = $comment;\n    }\n   \
    \ return $this;\n}\n\nprotected function setSubmissionDate($date)\n{\n    $this->submissionDate\
    \ = $date;\n}\n```\n\n```php\nreturn $this;\n\npublic function getName()\n{\n\
    \    return $this->name;\n}\n\npublic function getEmail()\n{\n    return $this->email;\n\
    }\n\npublic function getComment()\n{\n    return $this->comment;\n}\n\npublic\
    \ function getSubmissionDate()\n{\n    return $this->submissionDate;\n}\n\npublic\
    \ function save()\n{\n    $result = $this->database->insert('comments', [\n  \
    \      'name' => $this->name,\n        'email' => $this->email,\n        'comment'\
    \ => $this->comment,\n        'submissionDate' => date('Y-m-d H:i:s')\n    ]);\n\
    \n    if (!$result) {\n        throw new \\Exception(\"Failed to save!\");\n \
    \   }\n}\n```\n\n# Explanation of the Code Above\n\nAn in-depth explanation of\
    \ this class allows for the functionality that go beyond what we're covering.\
    \ Before the Comment class can be used by the application, the app needs to know\
    \ where the class is. We must edit the composer.json file in our project root\
    \ and add the section:\n\nFor reference, Figure 8.15 what the file now looks like:\n\
    \n![](img/7d1d10ff700e0e770ae037aef1a8424a_153_0.png)\n\nFigure 8.15. The current\
    \ contents of composer.json\n\nOne last step: before we save data into the database,\
    \ we need to create a table into which the data will go. In the terminal, inside\
    \ the root folder, execute:\n\n```bash\nsqlite3 storage/database.db\n```\n\nThis\
    \ enters the database in CLI, allowing for live execution of SQL commands. To\
    \ create the table we want, we need to execute the following statement while inside\
    \ the database engine:\n\n```sql\nCREATE TABLE comments (\nid INTEGER NOT NULL\
    \ PRIMARY KEY AUTOINCREMENT,\nname TEXT NOT NULL,\nemail TEXT NOT NULL,\ncomment\
    \ TEXT NOT NULL,\nsubmissionDate TEXT NOT NULL);\n```\n\nThis will create a table\
    \ called comments. Typing .tables after the command above is executed should show\
    \ that the table was created. Exit the prompt by typing .quit.\n\nHow about we\
    \ test everything we made so far? In index.php, under the $database = new medoo…\
    \ block out the following:\n\n```php\n$comment = new SitePoint\\Comment($database);\n\
    $comment->setEmail('bruno@skvorc.me')\n->setName('Bruno Skvorc')\n->setComment('It\
    \ works!')\n->setComment('Hooray! Saving comments works!')\n->save();\n```\n\n\
    Refresh http://guestbook.app, and there shouldn't be any changes.\n\nHowever,\
    \ if we look inside our database, we should be able to see the saved comment,\
    \ as shown in Figure 8.16.\n"
  mdcn: "\n\n# 通过示例学习：从零开始构建 Web 应用程序 125\n\nPOST 请求通常用于将某些数据保存到服务器，例如在数据库中创建新数据。关于请求和响应的复习，请参阅第\
    \ 1 章。\n\n`input` 元素是我们点击保存注释的按钮——`value` 属性显示在按钮上的文字，而 `type` 属性用于确保此按钮是在提交表单。\n\
    \n如果你现在刷新 http://guestbook.app，你应该会在屏幕底部看到一个 Save（保存）按钮。点击它什么也不会发生，只会刷新屏幕（按钮提交了表单，但由于没有\
    \ PHP 逻辑来处理表单，我们会重定向回到原来的页面）。\n\n在 `input` 上方但仍在 `form` 元素内，我们添加了以下内容：\n\n```html\n\
    <label>Name:<input type=\"text\" name=\"name\" placeholder=\"Your name\"></label>\n\
    <label>Email:<input type=\"text\" name=\"email\" placeholder=\"your@email.com\"\
    ></label>\n<label>Comment:<textarea name=\"comment\" cols=\"30\" rows=\"10\"></textarea></label>\n\
    ```\n\nHTML 表单使用 `label` 来描述各种表单字段，说明应该在字段中输入的内容。`label` 通常包裹一个元素——在上面的代码中，标签位于元素的两边。`type`\
    \ 属性告诉浏览器这是一个普通的文本字段，`name` 属性用于让我们在 PHP 代码中识别该值，而 `placeholder` 属性则作为可能输入的示例。`textarea`\
    \ 是另一种类型的元素，没有 `type` 属性，通过列（`cols`）和行（`rows`）的形式表示维度。\n\n如果我们同时也删除 PHP 部分的虚拟输出，得到的最终结果如下：\n\
    \n```php\n<?php\nrequire_once '../vendor/autoload.php';\n\n$database = new medoo(\n\
    \  'database_type' => 'sqlite',\n  'database_file' => '../storage/database.db'\n\
    ]);\n?>\n<form method=\"post\">\n<label>Name:<input type=\"text\" name=\"name\"\
    \ placeholder=\"Your name\"></label>\n<label>Email:<input type=\"text\" name=\"\
    email\" placeholder=\"your email.com\"></label>\n<label>Comment:<textarea name=\"\
    comment\" cols=\"30\" rows=\"10\"></textarea></label>\n<input type=\"submit\"\
    \ value=\"Save\">\n</form>\n```\n\n在浏览器中看到时看起来像图 8.14。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_148_0.png)\n\
    \n图 8.14. 创建的表单\n\n它看起来相当丑，但我们可以以后再处理。\n\n# 第二次 Push\n\n加入了一些额外文件并构建好了表单后，是时候进行另一次\
    \ Git push 了：\n\n```bash\ngit add -A\ngit commit -m \"Added HTML5 Boilerplate\
    \ and built submission form\"\ngit push origin master\n```\n\n# 创建 Comment 类和数据库表\n\
    \n然而，使用面向对象的语法从零开发 `Comment` 类（无论它有多简单）超出了本书的范围。有很多其他书籍可以让你获得基础 OOP 的指导——章节末尾的链接会有帮助。现在，为了积累一些\
    \ PHP 记忆，我建议你将代码输入到一个名为 `Comment.php` 的新文件中，你应该在项目根目录的 `src` 子文件夹中创建它（`src` 文件夹也需要创建）。或者，如果你真的不想写，完整的代码可以复制到：http://bit.ly/sp-book-comment。\n\
    \n```php\n<?php\nnamespace SitePoint;\n\nclass Comment\n{\n    protected $database;\n\
    \n    protected $name;\n    protected $email;\n    protected $comment;\n    protected\
    \ $submissionDate;\n\n    public function __construct($medoo) {\n        $this->database\
    \ = $medoo;\n    }\n\n    public function findAll() {\n        $collection = [];\n\
    \        $comments = $this->database->select('comments', '*', ['ORDER' => 'comments.submissionDate\
    \ DESC']]);\n        if ($comments) {\n            foreach ($comments as $array)\
    \ {\n                $comment = new self($this->database);\n                $collection[]\
    \ = $comment;\n            }\n        }\n    }\n->setComment($array['comment'])\n\
    ->setEmail($array['email'])\n->setName($array['name'])\n->setSubmissionDate($array['submissionDate']);\n\
    \n}\n\nreturn $collection;\n\npublic function setName($name)\n{\n    $this->name\
    \ = (string)$name;\n\n    return $this;\n}\n\npublic function setEmail($email)\n\
    {\n    if (filter_var($email, FILTER_VALIDATE_EMAIL)) {\n        $this->email\
    \ = $email;\n    } else {\n        throw new \\InvalidArgumentException('Not a\
    \ valid email!');\n    }\n    return $this;\n}\n\npublic function setComment($comment)\n\
    {\n    if (strlen($comment) < 10) {\n        throw new \\InvalidArgumentException('Comment\
    \ too short!');\n    } else {\n        $this->comment = $comment;\n    }\n   \
    \ return $this;\n}\n\nprotected function setSubmissionDate($date)\n{\n    $this->submissionDate\
    \ = $date;\n}\n```\n\n```php\nreturn $this;\n\npublic function getName()\n{\n\
    \    return $this->name;\n}\n\npublic function getEmail()\n{\n    return $this->email;\n\
    }\n\npublic function getComment()\n{\n    return $this->comment;\n}\n\npublic\
    \ function getSubmissionDate()\n{\n    return $this->submissionDate;\n}\n\npublic\
    \ function save()\n{\n    $result = $this->database->insert('comments', [\n  \
    \      'name' => $this->name,\n        'email' => $this->email,\n        'comment'\
    \ => $this->comment,\n        'submissionDate' => date('Y-m-d H:i:s')\n    ]);\n\
    \n    if (!$result) {\n        throw new \\Exception(\"Failed to save!\");\n \
    \   }\n}\n```\n\n# 上述代码说明\n\n该类的深入解释允许实现超出我们涵盖的功能。在 `Comment` 类被应用程序使用之前，应用程序需要知道它在哪里。我们必须编辑项目根目录下的\
    \ `composer.json` 文件并添加以下部分：\n\n作为参考，图 8.15 是文件现在的样子：\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_153_0.png)\n\
    \n图 8.15. composer.json 的当前内容\n\n最后一步：在我们把数据保存到数据库之前，我们需要创建一个存放数据的表。在终端中，进入根目录执行：\n\
    \n```bash\nsqlite3 storage/database.db\n```\n\n这将进入 CLI 模式的数据库，允许实时执行 SQL 命令。为了创建我们想要的表，我们需要在数据库内部执行以下语句：\n\
    \n```sql\nCREATE TABLE comments (\nid INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,\n\
    name TEXT NOT NULL,\nemail TEXT NOT NULL,\ncomment TEXT NOT NULL,\nsubmissionDate\
    \ TEXT NOT NULL);\n```\n\n这将创建一个名为 `comments` 的表。执行上述命令后输入 `.tables` 应该显示表已创建。输入\
    \ `.quit` 退出提示符。\n\n测试一下我们目前为止做的一切如何？在 `index.php` 中，在 `$database…` 块下方取消以下注释：\n\
    \n```php\n$comment = new SitePoint\\Comment($database);\n$comment->setEmail('bruno@skvorc.me')\n\
    ->setName('Bruno Skvorc')\n->setComment('It works!')\n->setComment('Hooray! Saving\
    \ comments works!')\n->save();\n```\n\n刷新 http://guestbook.app，不应该有任何变化。\n\n然而，如果我们查看数据库，应该能看到保存的注释，如图\
    \ 8.16 所示。\n\n"
