    # Jump Start PHP Environment


    software, while **back-end development** (also called server-side development)
    deals with the server software.


    When a server returns text to your browser (in Figure 1.2, this is the text that''s
    repeated to the king in the second-to-last frame) and your browser presents it
    to you, how that *looks* and in what ways you can *interact with* it front-end
    (or client-side) programming. When you open a website and a link is bold and a
    color to the rest of the text, that change in appearance was achieved with client-side
    programming (HTML plus CSS). When you can drag an element around the screen or
    initiate animations or sounds, it''s also achieved with client-side programming
    (specifically HTML and CSS accompanied by JavaScript).


    Server-side programming, or back-end development, is the action of configuring
    the server computer and program (see the section called "What is a server?" for
    an explanation on this duality) to give back the appropriate data to the browser
    when asked. This typically means programming in a server-side language such as
    PHP. PHP will make some calculations or grab some data from a database, then return
    it to the browser, and the browser will take it and display it to the user.


    To recap: front end is when you write code that is executed in the browser (HTML,
    CSS, JavaScript), while back end is when you write code that is executed on the
    server before passing the final result onto the browser. PHP, server-side JavaScript,
    server-side Dart, Ruby, Python, and other programming languages fit the bill.


    Time to go even deeper into the rabbit hole.


    # Server-side Languages


    The book focuses on preparing a development environment for server-side programming.
    We won''t be dealing with HTML, CSS, or JavaScript; there are plenty of books
    on those out there, and setting up a client-side development flow is complex enough
    on its own. Instead, we''ll be dealing exclusively with server-side preparations,
    as it''s very easy to start off the wrong way. Just as a speck on a balloon will
    grow into a large stain as it fills with air, so too a missstep in the beginning
    of a programming career grows into a long-term harmful habit.


    As you may already know, examples of server-side languages include PHP, Ruby,
    and Python. They sit as programs on the server computer, as well as the server
    program. These languages take commands from the server program, and output the
    result of these commands back to it. It is this output that is given to the browser
    when a user asks for an answer to a certain question. In a nutshell, by telling
    the server "When a request comes in for the example.com website, run this file
    through PHP:


    ```php

    <?php

    echo "Hello World";

    ```


    ...given it a way to produce an answer for the client. The PHP file is then run,
    and the content "Hello World" is generated and sent back to the server program,
    which is then given to the browser. The browser takes it back to the server and
    simply repeats "Hello World." The browser stops short of relating the rest of
    the contents of the file; the php tag <php and the keyword echo are skipped in
    the output. This is because the tag <php tells the server to "Run this file through
    PHP" and then, when running the file through PHP, echo tells it "Output the following
    phrase onscreen.".


    If you''re having trouble grasping this, see Figure 1.3, which expands on Figure
    1.1.


    # Jump Start PHP Environment


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_30_0.png)


    Figure 1.3. Server asks PHP for the answer if it''s unknown to find


    In Figure 1.3:


    - the diagram represents the insides of the physical computer in Figure 1.1

    - Nginx is a web server program installed on this machine

    - Nginx receives input from the client in the form of a question (blog for February
    14th)

    - Nginx checks if there''s a page for blog/feb/14

    - as there is no, Nginx checks the routes through PHP files

    - Nginx finds that it needs to run the blog.php script through PHP

    - the blog.php script connects to the database and sends back the text for the
    given date

    - the PHP engine sends this result to the server

    - Nginx sends it back to the client


    To recap: PHP is an answer generator for the server so it knows what answers to
    give to the browser''s questions. This way, the server doesn''t need to know the
    answers, it knows that PHP does and asks it, then forwards the response to the
    browser. Imagine a "Hello YourName" page; it''s impossible to generate pages for
    every existing name, but we can have PHP ask for a name on one page, and then
    generate the answer to give to the server on another page.


    What''s important to grasp here is the communication flow between client and server,
    and server and server-side language. This entire communication fits into the fifth
    and sixth frames in the comic in Figure 1.2. In the part where the server program
    talks to the PHP program would happen entirely in the sixth frame.


    # Generating Answers with Server-side Languages


    The last and deepest level of our rabbit hole is the actual conversation between
    the server program and a server-side language—in our case (and all future cases),
    PHP. We covered this to an extent in the previous section, but let''s look at
    another example now with a situation of an answer cannot be found.


    Let''s say that the server is asked the following by the client: “Can you get
    whatever you have filed example.com/user/id/54?” This is what happens next:


    1. The server checks whether there''s something already prepared under the route:
    /user/id/54. If there are no files to be found, it''s configured to ask PHP.

    2. The server asks PHP: “Can you find anything under /user/id/54?”

    3. PHP activates and looks through its routes. Lo and behold, the route /user/id/54
    says “activate file.php with the parameter id of value 54”.

    4. PHP executes the file (the actual logic of the file is beside and outside the
    scope of this chapter) and receives a result. Maybe the result is the email address
    of the 54th user in the database. This address is then given back to the server:
    “Sure, I found something under that route. The answer is: johndoe@example.com”.

    5. The server responds with “Thanks!” and passes this message to the client, who
    presents it to the end user—you.


    However, what if there’s nothing filed under that route? For example, there is
    a typo when the client requests example.com/user/id/54 (rather than “user”). Here’s
    what happens:


    1. The server checks whether there’s anything already prepared under the route:
    /user/id/54. If no files are found, it''s configured to ask PHP.

    2. The server asks PHP: “Can you find anything under...

    3. PHP activates and looks through its routes, but fails to unearth anything.
    It returns a “404 Page not found” error to the server (as in Figure 1.1, bottom-left
    result).


    As you’re most probably aware, 404 is a code that’s common in web technologies
    and means what you’re looking for is unable to be found where you think it might
    be. Many such codes exist, but there''s no need to know them all in this phase
    of your career.


    4. The server receives the 404 message and thinks “Hmm, PHP locked out. Well,
    it has nothing, I nothing, better return a page to the client.” The browser is
    as “Whoops, you tried a wrong link!” but can also be as intricate as you wanted
    to.


    I trust that chapter was cleared with the concepts presented and helped you get
    your bearings in terms of where you are (or will be) in the grand scheme of PHP
    programming. In the section that follows, you will find some more technical information
    on web requests and DNS servers.


    # For Those Who Want More # DNS Servers


    As mentioned before, every domain (such as example.com) on the Internet is bound
    to a specific IP address (such as 93.184.216.34). An IP address is a set of numbers
    identifying a given server. In other words, IP addresses tell the browser how
    to navigate the Internet to find the computer (server) it''s looking for. A DNS
    server (also known as name server) knows which IP addresses match which domain
    name, and tells the browser where to go.


    When trying to find out which IP address matches a domain name, the browser first
    checks its cache—a saved list of visited domains. Every browser maintains this
    list and periodically refreshes it. If it finds the domain-IP combination in its
    own cache, the loads faster because there''s no need to ask the DNS server for
    it. If the domain isn''t cached, the browser asks a program called the resolver
    (which is built into your operating system) to check the hosts file on the computer
    it''s installed. The hosts file is where the user can actually define which website
    maps to which IP address. (We''ll be learning to use this file in later chapters.)
    If the necessary information isn''t there, the DNS cache on the router (routers
    usually have one) is checked, and if it''s not found there, the ISP''s DNS server
    is asked.


