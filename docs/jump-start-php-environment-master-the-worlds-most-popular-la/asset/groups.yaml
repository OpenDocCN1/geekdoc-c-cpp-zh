    \n此时，我们大可以将项目纳入版本控制并将其上传到 GitHub。这不仅允许我们与他人共享代码，还能为关键的硬件故障提供一层保护。\n\n首先，像第 5 章那样，在\
    \ GitHub 上创建一个仓库。在我的情况下，该地址将是 https://github.com/spbooks/phpenvv1-example。\n\n\
    然后，在项目的根目录（**guestbook** 文件夹内部）运行：\n\n```\ngit init\n```\n\n接下来，通过下载 http://bit.ly/spignore\
    \ 的内容或运行以下命令来设置基础的 **.gitignore** 文件：\n\n```\ncurl http://bit.ly/spignore -L >\
    \ .gitignore\n```\n\n如果你对上述内容好奇，curl 是我们用于获取远程 URL 内容的程序，类似于在终端中访问网页。接下来是我们想要获取的内容，然后\
    \ -L 标志告诉 curl “跟随重定向”，以防 URL 指向另一个 URL 而不是最终内容，最后是 >.gitignore 告诉它“将获取的输出写入 .gitignore”。\n\
    \n# 在实例中学习：从零开始构建 Web 应用程序\n\n然后，我们需要添加一个远程仓库——我们需要让本地仓库知道在线家园在哪里。在我的情况下，命令是：\n\
    \n```\ngit remote add origin git@github.com:spbooks/phpenenv1-example.git\n```\n\
    \n根据相应修改 URL。\n\n# 将基于 Vagrant 驱动的项目添加到版本控制\n\n关于将基于 Vagrant 驱动的项目提交到版本控制，有两种观点。第一种观点符合通用共识和\
    \ Vagrant 官方文档，即 Vagrant 及其所有相关脚本应该与你的项目源代码一起提交到版本控制。如果你选择此路径，请先在 Homestead Improved\
    \ 内部运行 `rm -rf .git` 来移除所有版本控制的痕迹，然后在该文件夹中运行 git init 以及我们在此处描述的所有操作。照常进行即可——你的团队现在拥有了你的\
    \ Vagrant 设置。这对于处理商业闭源应用程序的团队非常方便，因为设置可以由团队决定。\n\n第二种方法是我个人更喜欢的，而且为了简单起见，我们在本中采用：只提交项目的源代码——而不是它的环境，例如\
    \ Vagrantfile、Homestead.yaml 等。这确保了它在任何开发机器上都是可用的，即使是那些不使用 Vagrant 或使用不同的盒子运行测试项目的人。在此场景下，这种方法最适合开源项目，你可以让贡献者自由选择自己的开发环境。这种方法在文件大小方面也更轻量一些。无论你选择哪种方法，都是正确的。选择任何你觉得更好的，或者你合作的团队偏好的方法。\n\
    \n在新的虚拟机上，Git——当在虚拟机内部使用时——并不知道是谁在使用它。为了表明你的身份，可以选择执行：\n\n```\ngit config --global\
