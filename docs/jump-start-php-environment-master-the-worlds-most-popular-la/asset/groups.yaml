- md: '

    # Preface


    ## The WWW


    In this section, I will answer the three Ws. No, not that www—the three Ws of
    this book:


    - Why was this book written?

    - What''s it about? even- Who is it for?


    ## The What and Why


    Before I explain who the book is for, I''d like to start explaining what this
    book is about and what prompted its writing.


    ## The Why


    As the editor for SitePoint''s PHP channel¹, I communicate daily with many PHP
    developers. Almost every developer comes from a different background—educational,
    racial, geographical—so the channel is truly a melting pot of cultures and approaches.
    Some are formally trained computer scientists, others are self-taught freelancers.
    Some are well-versed in enterprise etiquette, rigor, and culture; others just
    can''t wait to churn out code and see it. In all of my time working for SitePoint,
    I''ve never met two developers who have the same approach to writing and coding.


    Trying to create a channel that works cohesively with such an array of writers
    was actually quite challenging. The writing part was easy to standardize—I enforced
    the Markdown format (no need to concern yourself with this if you don''t know
    what it is) rather than HTML or Word files, passed on some links to valuable tools
    such as spellcheckers and text small detectors (tools that capitalize your title,
    for repeated phrases, isolated misused phrases, and so on). But when you''re responsible
    for editing and checking hundreds of posts, it''s not the writing that''s the
    biggest problem—it''s the code. Writers would send their code in zip archives
    alongside articles, as if thrown into a cardboard box, duct-taped, and shipped.


    ¹ http://www.sitepoint.com/php/


    The code was everything from simply messy to incompatible with my version of PHP,
    and thus it was insanely difficult to verify—after all, letting a malfunctioning
    demo go well alongside a tutorial was unforgivable! Imagine receiving code samples
    from 100 different people, each configured for a separate combination of PHP +
    server + PHP extensions and other factors. There''s simply no way to manually
    configure your computer fast enough to go them all reliably in a given time. Code
    needs standardization, and in big teams, as ours in a SitePoint PHP channel, is
    that of utmost importance.


    To remove this barrier, I used all the approaches I talk about in this book. To
    make them work for you and to have code that is automatically compatible with
    all other developers and their computers instantly would be minutes of work; however,
    this book was written to help you understand what is going on in these configurations,
    and how exactly this compatibility was achieved. Why would you want to know this?


    Two reasons:


    1. You''ll gain a solid foundation extremely early in your career, absorbing good
    practices before you''ve had a chance to be exposed to bad ones. I cannot stress
    enough important this is: the amount of energy it takes to unlearn something colossal,
    especially if you''re told you''re wrong, because we have a natural predisposition
    to take a defensive stance—even if, deep down, we might know the other party is
    right.


    2. If you''re serious building a PHP career, chances you''ll end up leading or
    joining a team of developers one day. Maybe it will be a freelance team building
    small websites for individual clients; perhaps you''ll lead fifty people in an
    enterprise effort to modernize a corporation''s intranet application—who knows,
    you''ll have to work with other developers. Trust me when I tell you you''ll be
    a one-man army forever (or at all!). When working with others, it''s vitally important
    all you have the exact same software setup in order to prevent excuses as "What
    do you mean broken? It works on my machine! With the instructions laid out in
    this book, you''ll understand completely what''s necessary to set this up team-wise.
    Your team will thank you in the long run, even if you''ll initially slow down
    progress by making everyone adapt to these practices.


    With that out the way, what will we be learning in this time?


    ## The What


    This book will, in great detail, explain what you need to do to prepare to start
    learning PHP (preparing for a start?), let me explain.


    Most people, when they become interested in web development, randomly google for
    keywords and click the first results they find; "how to make a website," "build
    php sql tutorial," and "learn to code," the search queries will say. Inevitably,
    almost all newbies end up downloading XAMPP or WAMP (installer tools that get
    PHP and associated packages set up on your machine), setting up a basic PHP installation
    on their computers, and writing the legendary Hello World "app." Without fail,
    this is where over 70% of the newbies lose. XAMPP, WAMP, EasyPHP, and similar
    bundles that get you up and running fast are—while at first—deterrents in the
    long run. We''ll talk about this in more depth chapters, which suffice to say
    that while these bundles are easy to start, but hard to continue with, this book
    takes the exact opposite approach: more complex to start, but easy to keep going.


    I''ll show you how to configure your development environment in such a way that
    you''ll be able to develop without worrying about anything on your computer or
    its operating system, and can share your code with others without concern about
    whether it will be compatible with their setup. What''s more, you''ll be able
    to build and test applications for various versions of PHP without needing to
    reinstall anything: your different versions of PHP will never conflict, and you
    can even test your applications on different web servers as well.


    Your code will be cross-platform compatible, meaning you''ll be able to run it
    and keep developing anywhere you go, no matter which computer you land on or which
    operating system powers it. I''ll teach you the powers of a good IDE (integrated
    development environment), explain the powerful concepts of application environments,
    show you the mysteries of virtual machines, and prepare you for the professional
    PHP world.


    If any of these terms sound intimidating or complex to you right now, don''t despair.
    We''ll cover all of them later on. You will understand everything, that''s a promise.


    ## The Who


    So, who is this book for?


    Developers of beginner to intermediate level will benefit from this book. Even
    for those familiar with some of the concepts, this book will hold some value.
    Remember, everyone you ever meet will know something you don''t. You can always
    learn more, even if most of it sounds familiar.


    If you are interested in improving your current development workflow and often
    find yourself confused by using PHP extensions or features while developing applications,
    and frequently running into errors about software you need but yet to install—this
    book is for you. If your computer is so full of software used to make people''s
    code run well on your machine, this book is definitely for you. By reading it,
    you''ll be able to restore your computer to an almost factory level of performance
    while keeping all apps you can compatible with it.


    If you''re starting out with PHP, this book should be the very first resource
    you read. It will explain not only isolated environments and conflict prevention,
    but also the inner workings of web requests and what happens when you actually
    type an address into a browser''s address bar. You''ll learn why a server is important,
    what PHP''s role is, and how it fits into the grand scheme of development environments
    and setups that can help you achieve a smooth development experience.


    Note that this is not a programming book, per se. There will be very little PHP
    coding in this book, at least until the very end of it. This book is a guide to
    setting up your computer so that it obeys, rather than the other way around. You
    want programming to be a pleasant, relaxing, and predictable experience you can
    train yourself in, day by day, rather than a source of endless frustration. This
    is what this book is forlaying the foundation for a pleasant programming career.


    ## Conventions Used


    You''ll notice that we''ve used certain typographic and layout styles throughout
    this book to signify different types of information. Look out for the following
    items.

    '
  mdcn: '


    # 前言


    ## WWW


    在本节中，我将回答三个 W。不，不是那个 www——而是这本书的三个 W：


    - 为什么要写这本书？

    - 它是关于什么的？

    - 它是写给谁的？


    ## 什么（What）与为什么（Why）


    在解释这本书是写给谁之前，我想先开始解释这本书是关于什么的，以及是什么促成了它的编写。


    ## 为什么（Why）


    作为 SitePoint PHP 频道的编辑¹，我每天与许多 PHP 开发者交流。几乎每位开发者都来自不同的背景——教育、种族、地理——因此这个频道确实是文化和方法的大熔炉。有些人是受过正式训练的计算机科学家，另一些是自学型的自由职业者。有些人精通企业礼仪、严谨性和文化；另一些则迫不及待地想要写代码并看到它们。在为
    SitePoint 工作期间，我从未遇到过两个编写和编码方式上完全相同的开发者。


    试图创建一个能与如此多位作者紧密协作的频道实际上非常有挑战性。写作部分很容易标准化——我强制执行 Markdown 格式（如果你不知道它是什么，就不需要担心这个）而不是
    HTML 或 Word 文件，并提供了一些指向价值工具的链接，例如拼写检查器和文本大小检测器（这些工具可以处理你的标题大写、重复短语、孤立的误用短语等）。但当你负责编辑和检查数百篇帖子时，最大的问题不是写作，而是代码。作者们会将代码以压缩包的形式随文章一起发送，就像是扔进纸箱里，封上胶带并寄出去一样。


    ¹ http://www.sitepoint.com/php/


    代码从简单的混乱到与我的 PHP 版本不兼容应有有，因此验证它们变得异常困难——毕竟，让一个运行故障的演示程序与教程并肩发布不可原谅的！想象一下从 100
    个不同的人那里收到代码示例，每个人的配置都是针对不同的 PHP + 服务器 + PHP 扩展和其他因素的组合。你根本无法在给定时间内足够快地手动配置你的计算机，以可靠地运行所有代码。代码需要标准化，而在大型团队中（如我们
    SitePoint PHP 频道的团队），这一点至关重要。


    为了消除这一障碍，我使用了书中提到的所有方法。让这些方法对你生效，并让代码能够自动与其他所有开发者及其计算机即时兼容只需要几分钟的工作；然而，这本书的编写目的是为了帮助你理解这些配置中发生了什么，以及这种兼容性究竟是如何实现的。你为什么会想知道这些呢？


    原因有两个：


    1. 你将在职业生涯的极早期阶段获得坚实的基础，在有机会接触到坏习惯之前吸收良好的实践。我怎么强调这重要性都不为过：遗忘一个庞大的东西需要巨大的能量，尤其是当你被告知你是错的时候，因为我们天生倾向于采取防御姿态——即使在内心深处，我们可能知道对方是正确的。


    2. 如果你认真想要建立 PHP 职业，那么将来一天你可能会领导或加入一个开发者团队。也许它是一个为个人客户构建小型网站的自由职业团队；也许你将带领五十人的团队在企业级努力中使公司的内网应用实现现代化——谁知道呢，你将不得不与其他开发者合作。听我的，我告诉你，你永远将是一支单兵军（或者根本不是！）。在与他人合作时，确保所有人拥有完全相同的软件设置至关重要，以防止出现“你说的坏了是什么意思？在我的机器上运行好好的！”这样的借口。有了书中的说明，你将完全理解团队层面进行这些设置需要什么。从长期来看，你的团队会感谢你的，即使最初你让每个人适应这些做法会减慢进度。


    解决这些问题后，我们这段时间将学习什么？


    ## 什么（What）


    我们将学习


    ## 使用规范（Conventions Used）


    你会注意到，在书中我们使用了特定的排版和布局样式来表示不同类型的信息。请关注以下项目。


