    Apache 与 Nginx 的问题？我们在电脑上同时安装这两个服务器并对每一个都进行测试吗？我们该如何切换它们？我们如何确保在运行另一个时，记得去测试自己的一个？


    这还只是针对两个应用。现在想象一下，如果你必须处理来自十个不同客户的几十个应用程序，每个都有不同的需求。这一切将变得不再非常、非常快速。


    这种不同软件版本的隔离可以通过虚拟机来轻松解决，我们将在第 4 章中讨论它。


    ## 混乱的糟局面


    最后，如果我们尝试安装新版本的 PHP，但由于出了什么问题怎么办？这种场景在 OS X 和 Linux 中特别常见——我们在机器上安装的所有 PHP 版本都无法工作，事实证明让单个网站运行是不可能的。什么？我们不是在回到之前的运行状态，而是被迫花费一整天的时间来调试自己的系统并尝试让它运行——不一定是正确的版本，只要能运行起来即可。


    如果我们只需要输入一个命令就能让一切回到 10 分钟前的样子，不是很好吗？是的，我们可以！这也将在第 4 章演示。


    ## 生产/开发一致性 (Production/Development Parity)


    这个听起来很复杂的短语其实非常简单——我们实际上之前间接提到过它。生产/开发一致性无非是指让生产环境和开发环境尽可能相似，最好完全相同，这样你开发的任何内容都能自动在生产环境中运行，而无需任何过度配置或额外的调试或调优。


    ## 应用程序环境


    实现一致性对于人的工作流来说非常重要，因为它节省了大量的时间。避免为了让你的应用程序在生产环境中运行而进行任何额外工作，意味着你有自由和时间关注真正有利于你的应用程序上下文的业务业务相关问题，而不是被困在不断追赶的泥潭中。在开发中做出的更改，然后为了让该更改生效而在生产环境中做两次更改，这往好了说是乏味的，最坏的情况下是对项目健康有害的。你永远不知道团队中的谁会失误并导致应用程序用错误界面迎接人们。


    实现一致性的最佳方法是让你在开发环境中运行与你生产环境中完全相同的软件。例如，如果你的目标是将应用程序部署到运行 Ubuntu Linux 版本 14.04
    操作系统的服务器上，那么最好也在这个操作系统上进行开发。但是，如果我们运行的是 Windows 呢？因为我们喜欢消费高级多媒体内容（如游戏），或者我们需要在
    Linux 操作系统上无法运行的强大图像和视频处理软件。我们难道要放弃所有的兴趣，在 Windows 之上安装 Linux，并比其他任何事情都追求一致性吗？或者我们应该直接放弃一致性，在保持电脑强大、漂亮且稳定的同时坚持我们选择的操作系统，并承担风险？


    幸运的是，有第三种方法可以让你兼得其长：虚拟机（在第 4 章介绍）。


    ## 性能与调试


    我们需要提到的应用程序环境的最后方面是确保应用程序是快速的（性能）且没有错误的（调试）。这一部分完全是理论性的；它只是让你在以后遇到这些术语时知道预期的会发生什么。


    性能通过各种优化方法实现。与该词的含义相反，在应用程序开发中，优化通常有多个层次，而且很少是那种能立即带来完美解决方案的更改。性能包括但不限于几个领域：


    ### 优化数据库


    数据库通常是任何网站最慢的部分，在运行一段时间后，由于瓶颈（因为无法足够快处理传入的请求数量而变慢的部分）变得明显，它可以从额外的优化中获益。数据库优化的方法包括设置索引、读写分离、更改数据库引擎、缓存获取的数据以及其他听起来很神其妙的术语。


    ### 优化前端资源


    我们早期提到了编译和构建——这是我们优化网站前端的方式。当网站显示给用户时，他们看到的是由图像、HTML、CSS 和 JavaScript 组成的输出，正如第
    1 章所解释的，所有内容都需要在浏览器中下载并执行。这些文件越小，网站加载越快。通常，一个网站会有多个 CSS 文件和多个 JavaScript 文件。将每个类型合并成一个较大的
    CSS 或 JavaScript 文件会显著增加速度。通过内容交付网络（CDN）提供服务是另一种前端资源优化技巧，CDN 是一种第三方服务，托管你的资源并确保从距离用户最近的服务器下载从而增加速度。


    ### 优化后端


    我们提到了编译和构建，这是为了将文件合并成一个大文件。有些应用程序甚至可以被像 C++ 这样的语言编译。


    ### 缓存


    缓存是指预存所需的响应，以便在以后请求时从数据库中获取。当你访问 `mys.com/user/5/` 时，它会告诉你。如果你让它记住（缓存它），下次请求时它就可以获取。缓存在
    Web 开发中如此重要——当流量激增时，它可以决定生死。


    调试与性能紧密耦合。除了给你的用户带来糟糕的界面外，代码中的 Bug 可能会导致不必要的查询。那么，如何衡量性能或发现错误？有很多工具用于性能分析（这就是
    profiling）。较好的工具是 Z-Ray 和 Blackfire。


    > **注意微优化**

    > 需要注意的是，一种常见的新手错误是微优化。例如，曾认为使用单引号处理字符串 ($var = ''Some String''）比双引号 ($var = "Some
    String"）更快。这种优化带来的性能提升微乎其微；相反，改进 SQL 查询或 HTTP 调用将会有巨大的提升。如有疑问，参考基准测试和真实数据。


    ## 总结


    在本章中，我们探索了应用程序环境，涵盖了应用程序在给定生命周期中存在的各种生态系统。我们讨论了虚拟主机以及如何配置电脑将网站 URL 重定向到自己的 PHP
    安装而不是在线查找结果，并讨论了至关重要的开发/生产一致性。如果这看起来太复杂，不要绝望。这只是因为我们到为止几乎完全是理论——这些理论是勇敢进入实践领域的必要。在接后的章节中，我们将亲手操作一些虚拟机。


    ## 想要了解更多的人


    在应用程序世界中，测试单个组件被称为单元测试——对每个单独的代码集进行测试。


    例如，你应用程序的一个部分可能具有移除每个名称中的本地符号并将其转换为美国友好的字母的能力。假设名称“Škvorc”将被转换为“Skkvor”。将 Škvorc
    转换为 Skvorc 是一小段代码，或一个单元。单元是可测试的；对于任何给定的输入“Škvorc”，我期望输出为“Skvorc”。我可以写一个单元测试，即一个定义了输入和预期输出的文件，当我运行它时，它会测试此功能是否仍然有效。如果两个月后，我更改了应用程序中的某些，我可以轻松地运行这个测试（它仍然在那里）并检查转换是否正常。


