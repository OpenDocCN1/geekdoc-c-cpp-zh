- md: "\n# Jump Start PHP Environment\n\nexample, entering data which triggers commands\
    \ in the database, also known as SQL injection¹².\n\nThere are many ways to validate\
    \ input data, and in this case we'll be using a minimalist package called particle/validator.\
    \ Let's install it.\n\n```bash\ncomposer require particle/validator\n```\n\nAbove\
    \ the require_once_line, put:\n\n```php\nuse Particle\\Validator\\Validator;\n\
    ```\n\nThis imports the class so we can use its shorter name. Then, replace dump(\\\
    $_POST) with:\n\n```php\n$v = new Validator();\n$v->required('name')->lengthBetween(1,\
    \ 100)->alnum(true);\n$v->required('email')->email()->lengthBetween(5, 255);\n\
    $v->required('comment')->lengthBetween(10, null);\n\n$result = $v->validate(\\\
    $_POST);\n\nif ($result->isValid()) {\n    echo \"Submission is good!\";\n} else\
    \ {\n    dump($result->getMessages());\n}\n```\n\nThe Validator package uses rules\
    \ to define some constraints on certain values in an array. In this case, we made\
    \ all fields required with required(), we set a limit on their length with lengthBetween,\
    \ we forced the name to be alphanumeric (so no miscellaneous characters, punctuation\
    \ — but spaces are allowed, indicated by the true we passed in) and forced the\
    \ email to be verified as an email format. Just for testing, we dump the errors\
    \ if something goes wrong, or output \"Submission is good\" if all fields are\
    \ OK. Figure 8.20 shows what I get when I enter an invalid email address:\n\n\
    > ¹² https://www.owasp.org/index.php/SQL_Injection\n\n# Learn by Example: A Web\
    \ App from Scratch 141\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_163_0.png)\n\
    \n```json\narray:1 [\n  \"email\" => array:1 [\n    \"Email::INVALID_VALUE\" =>\
    \ \"email must be a valid\nemail address\"\n  ]\n]\n```\n\nFigure 8.20. Invalid\
    \ email address\n\nWith our input data validated, we're ready to save the comment\
    \ into the database. Replace echo \"Submission is good!\"; with:\n\n```php\ntry\
    \ {\n  $comment\n    ->setName($_POST['name'])\n    ->setEmail($_POST['email'])\n\
    \    ->setComment($_POST['comment'])\n    ->save();\n\n  header('Location: /');\n\
    \  return;\n\n} catch (\\Exception $e) {\n  die($e->getMessage());\n}\n```\n\n\
    The try/catch block is another advanced construct. Suffice to say that anything\
    \ can be caught. In the Class comment, we tend to throw new exceptions of different\
    \ types. When an exception is thrown throwing an exception in PHP basically means\
    \ \"making PHP crash with a specific error message\", it bubbles up, which means\
    \ that the whole PHP application can detect it, all the way up to the index.php\
    \ file. This is why, in index.php, we must try the safeguard around all the $comment\
    \ method calls; if one of them throws an exception, the catch block will trigger.\
    \ The logic in the catch block will simply kill PHP with the function die() and\
    \ output the message that was passed via the \\Exception that was caught (e.g.\
    \ \"Failed to save!\" in the save() method in the Comment class).\n\nIf the saving\
    \ executes flawlessly we call the header() function and pass in the location where\
    \ we want the browser to redirect to us. the \"path\" / \"root of this website,\"\
    \ which is http://guestbook.app in our case. the return makes sure PHP's code\
    \ execution stops. Why did we do this? Because of the mentioned formed \"resubmission\
    \ on refresh\" method.¹³.\n\nIf we now enter information into the guestbook and\
    \ press submit, we will be sent back to http://guestbook.app, the comment will\
    \ appear in the database, and the page will be refreshable with the warning.\n\
    \nTry it out. Enter a couple of comments and take a look inside the database with:\n\
    \n```bash\nsqlite3 database.local.db\nselect * from comments;\n```\n\n# Reading\n\
    \nAll we need to do is add the listing logic to our app; we want to list the currently\
    \ saved comments.\n\nAbove the entire form block in index.php, put the following:\n\
    \n```php\n<?php foreach ($comment->findAll() as $comment) : ?>\n    <div class=\"\
    comment\">\n        <h3><?= $comment->getSubmissionDate() ?>, <?= $comment->getName()\
    \ ?> write:</h3>\n\n        <p><?= $comment->getComment(); ?></p>\n    </div>\n\
    <?php endforeach; ?>\n```\n\nWhen mixing PHP and HTML, we can use colon (:) and\
    \ the appropriate block closer instead of using curly braces { }. This helps maintain\
    \ sanity when dealing with big files — one doesn't have to train one's eyes looking\
