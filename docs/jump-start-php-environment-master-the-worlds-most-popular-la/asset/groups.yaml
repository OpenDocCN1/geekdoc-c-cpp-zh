    ## Jump Start PHP Environment


    by Nginx (another server program) that''s competition to Apache, pronounced "engine
    x”). Uh-oh, what now?


    We could update PHP to a newer version and check whether app1 still works, how
    do we then keep developing app2 without accidentally using code that''s unavailable
    in PHP 5.3 if our entire computer is now running 5.6? Likewise, we could upgrade
    MySQL to 5.1 and check that it still works, but how do we handle MySQL didn''t
    throw out some features in version 5+ that would break app2 if we fixed app1 to
    work on 5.1? After all, app2 still needs to work on 4.0 because it''s probably
    still deployed on such a production server. Heck, how do we handle the Apache
    versus Nginx problem? We install both servers on our computer and test for each?
    How do we switch them out? How do we ensure that we remember to test our one while
    the other is running?


    And that''s just for two apps. Now imagine if you had to deal with a dozen applications
    from ten different clients, each with different requirements. It all stops being
    very, very fast.


    This separation of different software versions is easy to solve by means of virtual
    machines, which we will talk about in Chapter 4.


    ## The Unclean Mess


    Finally, if we try to install a new version of PHP, but something goes wrong?
    This scenario is especially common in OS X and Linux—none of the PHP versions
    we have installed on the machine work and it''s proving impossible to get a single
    site to run. What? Instead of reverting to a previous running state, we''re forced
    to spend the entire day debugging our own system and trying to make it run—not
    necessarily the right version, but just run.


    Wouldn''t it be great if we could just enter a command and have things go back
    to the way they were 10 minutes ago? Well, we can! This, too, will be demonstrated
    in Chapter 4.


    ## Production/Development Parity


    This complicado-sounding phrase is actually very simple—we''ve actually indirectly
    touched on it before. Production/development parity means nothing more than having
    the production and development environment as similar as possible to each other,
    preferably identical, so that anything you develop will automatically run in production
    without any excessive configuration or additional debugging or tweaking.


    ## The Application Environment


    Achieving parity is very important for one''s workflow to the enormous amount
    of time it saves. Avoiding having to do any additional work for your application
    to run in production means having the freedom and time to focus on important business-related
    problems that actually benefit your application''s context, rather than being
    stuck in a rut of constantly catch-up. Making a change in development and then
    having to make two changes in production for that change to appear tedious at
    best and detrimental to a project''s health at worst. You never know who on the
    team will slip up and cause the app to greet people with an error screen.


    The best way to achieve parity is by having the exact software running in your
    development environment as you do in your production environment. For example,
    if you''re aiming to deploy your application to production onto a server running
    the Ubuntu Linux version 14.04 operating system, it''s best that you develop on
    this operating system as well. However, what if we were running Windows, because
    we like to consume advanced multimedia content such as games, or we need powerful
    image and video manipulation software that just cannot exist on a Linux OS? Would
    we forsake all of our interests, install Linux over Windows, and strive for parity
    over anything else? Or should we just forfeit parity and risk it while keeping
    our computer powerful, beautiful, and stable, sticking to our operating system
    of choice?


    Fortunately, there''s a third way that allows you to achieve the best of both
    worlds: virtual machines (covered in Chapter 4).


    ## Performance and Debugging


    The last aspects of the application environment we need to touch on is ensuring
    that the app is fast (performance) and bug-free (debugging). This section is entirely
    theoretical; it''s just you know what to expect later on when we come across some
    of these terms.


    Performance is achieved through various methods of optimization. Contrary to the
    word''s meaning, in application development optimization often has several layers
    and is rarely the change that immediately brings about the perfect solution. Performance
    includes, but is not limited to, several areas:


    ### Optimizing the database


    Often the slowest part of any website, the database can benefit from additional
    optimizations after it''s been running for a while and the bottlenecks (the parts
    that are the slowest because they''re unable to process the number of incoming
    requests fast enough) become apparent. Methods for database optimization include
    setting indexes, splitting reads and writes, changing database engines, caching
    fetched data, and other mystical-sounding phrases.


    ### Optimizing the front-end assets


    We mentioned compilation and building early—it''s how we optimize the website''s
    front end. When a website is shown to users, they see output comprised of images,
    HTML, CSS, and JavaScript, all of which need to be downloaded and executed in
    the browser as explained in Chapter 1. The smaller these files are—and the fewer
    the faster a website loads. Often, a website will have multiple CSS files and
    multiple JavaScript files. Combining each type into one bigger CSS or JavaScript
    yields dramatic increases in a website''s download speed. Another front-end asset
    optimization trick often done is serving via a content delivery network, or CDN,
    a third-party service that hosts your images for you and ensures that the visitor
    to your website downloads them from a server closest to them, thereby further
    increasing speed. One can also reduce image size, create an image sprite by placing
    all images into one file, and more.


    ### Optimizing the back end


    This is also a compiling/building step. Test files are ignored, and files are
    merged into bigger ones instead of a million smaller ones. Some PHP applications
    are even compiled into another programming language such as C++, which is much,
    much faster.


    ### Caching


    Caching is saving previously needed files and responses for later, with the expectation
    of them being requested again. If you ask the database for the total number of
    users in your database, it will count them and give you the number. If you make
    it save this number for later (that is, cache it), next time it is asked it can
    just grab the already pre-informed information. When you ask the server “What
    do I get if I visit mys.com/user/5?”, it will tell you. If you tell it to remember
    the next time the question is asked, there’s no need for the server to look as
    it already knows. Caching is so important in web development—there’s a common
    saying that “cache is king.” It can mean the difference between life and death
    for your application when a huge surge of traffic suddenly happens.


    Debugging is tightly coupled with performance. Besides a nasty screen for your
    users, a bug in the code can cause execution unnecessary queries into your database,
    and more. So, how does one measure performance or find bugs? There are many for
    profiling PHP applications (that’s what profiling is). Two of the better ones
    are Z-Ray and Blackfire.


    > **Beware Micro-optimization**

    > It''s important to note that a common newbie error is microoptimizing. For example,
    it was once believed that using single quotes with strings ($var = ''Some String'')
    was faster than double quotes ($var = "Some String"). The performance gains such
    an optimization can make are insignificant; instead, improving a SQL query or
    HTTP call will always be of an order of magnitude greater. When in doubt, benchmarks
    and real data.


    ## Summary


    In this chapter, we explored the application environment, covering the various
    ecosystems present around your application in a given phase of life cycle. We
    talked about virtual hosts and configuring your computer to redirect website URLs
    to your own PHP installation rather than looking for results online, and we discussed
    the all-important development/production parity. If it seems overly complex, don''t
    despair. This is only because we''ve dealt almost exclusively with theory so far—theory
    that is necessary to bravely proceed into the practical realm. In the following
    chapter, we''ll get our hands dirty with some virtual machines.


    ## For Those Who Want More


    In the application universe, testing the individual components is referred to
    as unit testing—the testing of each individual set of code that you know it.


    For example, a part of your application might have the ability to remove local
    symbols from every name and turn them into US-friendly letters. Let say name “Škvorc”
    would be turned into “Skkvorc”. Turning Škvorc into Skkvorc is a small set of
    code, or a unit. Unit is testable; for any given input of “Škvorc” I expect an
    output of “Skkvorc”. I can write a unit test, which is a file that defines the
    input and desired output, and when I run it, it tests whether or not this functionality
    still works. If, two months later, I change something in my application, I can
    easily run this test (which is still there) and check this conversion works.

