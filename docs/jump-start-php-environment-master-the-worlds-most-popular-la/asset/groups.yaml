    \nFigure 82.5. New FTP account created\n\nNote that the core domain behind the\
    \ FTP account is different purely because my Hostg account was originally opened\
    \ on it. There are ways to change a primary domain, but the process is too time\
    \ consuming and intense to be worth the effort.\n"
  mdcn: "\n\n# 快速启动 PHP 环境\n\n例如，输入触发数据库中命令的数据，也称为 SQL 注入¹²。\n\n验证输入数据有许多方法，在这种情况下，我们将使用一个名为\
    \ `particle/validator` 的极简包。让我们来安装它。\n\n```bash\ncomposer require particle/validator\n\
    ```\n\n在 `require_once` 行上方，放入：\n\n```php\nuse Particle\\Validator\\Validator;\n\
    ```\n\n这导入了该类，以便我们使用它的简短名称。然后，将 `dump(\\$_POST)` 替换为：\n\n```php\n$v = new Validator();\n\
    $v->required('name')->lengthBetween(1, 100)->alnum(true);\n$v->required('email')->email()->lengthBetween(5,\
    \ 255);\n$v->required('comment')->lengthBetween(10, null);\n\n$result = $v->validate(\\\
    $_POST);\n\nif ($result->isValid()) {\n    echo \"Submission is good!\";\n} else\
    \ {\n    dump($result->getMessages());\n}\n```\n\n`Validator` 包使用规则对数组中的某些值定义一些约束条件在这种情况下，我们通过\
    \ `required()` 将所有字段设为必填，通过 `lengthBetween` 设置了它们的长度限制，强制要求名称为字母数字（因此没有杂乱字符、标点符号——但允许空格，由我们传递的\
    \ `true` 指明），并强制验证电子邮件格式为邮件格式。只是为了测试，如果发生任何错误，我们会 `dump` 错误信息；如果所有字段都正常，则输出“Submission\
    \ is good”。图 8.20 显示了我输入一个无效邮箱地址时得到的结果：\n\n> ¹² https://www.owasp.org/index.php/SQL_Injection\n\
    \n# 实例学习：从零开始构建 Web 应用 141\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_163_0.png)\n\
    \n```json\narray:1 [\n  \"email\" => array:1 [\n    \"Email::INVALID_VALUE\" =>\
    \ \"email must be a valid\nemail address\"\n  ]\n]\n```\n\n图 8.20. 无效的邮箱地址\n\n\
    我们的输入数据经过验证后，准备好将评论保存到数据库中。将 `echo \"Submission is good!\";` 替换为：\n\n```php\n\
    try {\n  $comment\n    ->setName($_POST['name'])\n    ->setEmail($_POST['email'])\n\
    \    ->setComment($_POST['comment'])\n    ->save();\n\n  header('Location: /');\n\
    \  return;\n\n} catch (\\Exception $e) {\n  die($e->getMessage());\n}\n```\n\n\
    `try/catch` 块是另一种高级结构。简单来说，任何内容都可以被捕获的。在 `comment` 类中，我们倾向于抛出不同类型的新异常。在 PHP 中，抛出异常基本上意味着“让\
    \ PHP 带着特定的错误消息崩溃”，它会向上冒泡，这意味着整个 PHP 应用程序都可以检测到它，一直顶到 `index.php` 文件。这就是为什么在 `index.php`\
    \ 中，我们必须对所有的 `$comment` 方法调用进行安全保护尝试；如果其中任何一个抛出了异常，`catch` 块就会触发。`catch` 块中的逻辑将直接使用\
    \ `die()` 函数杀死 PHP，并输出通过捕获的 `\\Exception` 传递的消息（例如 `Comment` 类中 `save()` 方法中的“Failed\
    \ to save!”）。\n\n如果保存执行完美无缺，我们调用 `header()` 函数并传入我们希望浏览器重定向到的位置。即“路径”/“此网站的根目录”，在我们的情况下是\
    \ http://guestbook.app。`return` 确保了 PHP 代码执行的停止。我们为什么要这样做？因为前面提到的“刷新时重复提交”方法¹³。\n\
    \n如果我们现在向留言板中输入信息并点击提交，我们会被带回 http://guestbook.app，评论将出现在数据库中，并且页面可以在带有警告的情况下刷新。\n\
    \n试一试。输入几条评论，并使用以下命令查看数据库内部：\n\n```bash\nsqlite3 database.local.db\nselect * from\
    \ comments;\n```\n\n# 读取\n\n我们所做的就是给我们的应用添加列表逻辑；我们想要列出当前保存的评论。\n\n在 `index.php`\
    \ 整个表单块上方，放入以下内容：\n\n```php\n<?php foreach ($comment->findAll() as $comment) :\
    \ ?>\n    <div class=\"comment\">\n        <h3><?= $comment->getSubmissionDate()\
    \ ?>, <?= $comment->getName() ?> write:</h3>\n\n        <p><?= $comment->getComment();\
    \ ?></p>\n    </div>\n<?php endforeach; ?>\n```\n\n在混合使用 PHP 和 HTML 时，我们可以使用冒号（:`）和适当的块结束符，而不是使用大括号\
    \ `{ }`。这有助于在处理大文件时保持理智——人们不需要训练眼睛去寻找闭合括号。每个 `for` 都有对应的 `endfor`。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_165_0.png)\n\
    \n图 8.21. 成功了！\n\n> ¹13 `header` 函数只有在在任何 HTML 输出之前才能起作用。因此，我们将所有的 PHP 代码都放在了文件的顶部。\n\
    \n# 实例学习：从零开始构建 Web 应用\n\n¹⁴ http://php.net/manual/en/ini.core.php#ini.short_tag\n\
    \n# 快速启动 PHP 环境\n\n# CSS\n\n在整个过程中，我们还没有关注设计。让我们加入一些基础的 CSS，让它好看一点。在 `<link rel=\"\
    stylesheet\" href=\"main.css\">` 下方加入：\n\n```html\n<link=\"stylesheet\" href=\"\
    custom.css\">\n```\n\n```css\nbody {\n  padding: 10px;\n}\n\nform {\n  width:\
    \ 500px;\n  border: 1px solid silver;\n  border-radius: 3px;\n  margin: 10px;\n\
    }\n\nform > input {\n  width: 100%;\n}\n\nform > input:hover {\n  background:\
    \ grey;\n}\n\n.comment {\n  margin: 10px;\n  border-bottom: 1px solid silver;\n\
    \  background: light;\n}\n\n.comment h3 {\n  margin: 10px;\n}\n\n.comment p {\n\
    \  margin: 10px;\n}\n```css\nlabel {\n  display: block;\n  margin: 5px;\n}\n```\n\
    \n这让我们的丑陋应用变得稍微好看了，如图 8.22 所示。\n\n# 快速启动 PHP 环境\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_168_0.png)\n\
    \n图 8.22. 一个美化的应用\n\n# 最后提交\n\n到现在，你应该是提交流程的大师了。进行最后的提交，我们的应用程序就完成了形态。\n\n# 部署\n\
    \n在本节中，我们将部署大多数应用。关于部署的更多理论，请参见第 6 章。\n\n# 在虚拟主机上部署 (Hostgator)\n\n正如我们在第6 章讨论过的，虚拟主机并不是一个好选择。它不安全，资源有限（尽管声称无限）。尽管如此，它可能是你唯一拥有的，所以我们有必要介绍\
    \ FTP 部署。\n\n# 实例学习：从零开始构建 Web 应用\n\n虚拟主机通常使用 cPanel 作为管理服务器的手段，不像图 8.23 所示。\n\
    \n![](img/7d1d10ff700e0e770ae037aef1a8424a_169_0.png)\n\n要部署应用，你需要域名。域名可以在 http://namecheap.com\
    \ 或 http://name.com 等网站购买（或者租用），价格范围从每年 2 美元到 2000 美元不等。我会挑选一个没使用的域名：caimeo.com。通过附加域名对话框向你的虚拟主机添加域名：\n\
    \n> ¹⁵ http://hostgator.com\n\n# 快速启动 PHP 环境\n\n# 创建附加域名\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_170_0.png)\n\
    \n图 82.4. 添加新域名\n\n每个虚拟主机还会指示你如何配置 DNS 设置以便域名响应虚拟主机服务器。注意，DNS 更改可能需要 24 小时才能在网络范围内传播。\n\
    \n添加新域名会自动为其创建一个 FTP 账户，如图 82.25 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_170_1.png)\n\
    \n图 82.5. 创建了 FTP 账户\n\n注意，FTP 账户背后的核心域名是不同的，完全是因为我的 Hostg 账户最初是在它开设的。更改主域名的方法有很多，但这个过程太耗时且激烈，不值得付出精力。\n\
    \n"
