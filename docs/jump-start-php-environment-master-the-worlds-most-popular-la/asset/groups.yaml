    \nFigure 8.21. It works!\n\n> ¹13 The header function can only work if it comes\
    \ before any HTML output. Thus, we've put all our PHP code at the top of the file.\n\
    \n# Learn by Example: A Web App from Scratch\n\n¹⁴ http://php.net/manual/en/ini.core.php#ini.short_tag\n\
    \n# Jump Start PHP Environment\n\n# CSS\n\nThroughout this we haven't paid any\
    \ attention was the design. Let's drop in some rudimentary CSS, to make everything\
    \ prettier. Under the line <link rel=\"stylesheet\" href=\"main.css\">, add this:\n\
    \n```html\n<link rel=\"stylesheet\" href=\"custom.css\">\n```\n\n```css\nbody\
    \ {\n  padding: 10px;\n}\n\nform {\n  width: 500px;\n  border: 1px solid silver;\n\
    \  border-radius: 3px;\n  margin: 10px;\n}\n\nform > input {\n  width: 100%;\n\
    }\n\nform > input:hover {\n  background: grey;\n}\n\n.comment {\n  margin: 10px;\n\
    \  border-bottom: 1px solid silver;\n  background: light;\n}\n\n.comment h3 {\n\
    \  margin: 10px;\n}\n\n.comment p {\n  margin: 10px;\n}\n```\n\n```css\nlabel\
    \ {\n  display: block;\n  margin: 5px;\n}\n```\n\nThis turns our ugly app into\
    \ something marginally easier, as shown in Figure 8.22.\n\n# Jump Start PHP Environment\n\
    \n![](img/7d1d10ff700e0e770ae037aef1a8424a_168_0.png)\n\nFigure 8.22. A prettier\
    \ app\n\n# Final Push\n\nBy now, you should be a master of the push flow. Do one\
    \ final push, and our application is in its final form.\n\n# Deployment\n\nIn\
    \ this section, we'll deploy our most app. For more theory behind deployment,\
    \ see Chapter 6.\n\n# Deploying on a Shared Host (Hostgator)\n\nLike we discussed\
    \ in Chapter 6, shared hosting isn't really a good option. It's insecure, often\
    \ limited in resources (despite the unlimited claims). Still, it might be the\
    \ only thing you have access to, so it only makes sense we cover an school FTP\
    \ deployment.\n\n# Learn by Example: A Web App from Scratch\n\nShared hosts will\
    \ often have cPanel as a mean of managing one's server, unlike the one shown in\
    \ Figure 8.23.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_169_0.png)\n\nTo deploy\
    \ an app, you'll need a domain. Domains can be purchased (or rather, rented) on\
    \ websites like http://namecheap.com or http://name.com, and can range from $2\
    \ per year to $2000 per year. I'll pick one of my domains that I'm not using for\
    \ this: caimeo.com. Add your domain to your shared host via the Addon domains\
    \ dialog:\n\n> ¹⁵ http://hostgator.com\n\n# Jump Start PHP Environment\n\n# Create\
    \ an Addon Domain\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_170_0.png)\n\nFigure\
    \ 82.4. Adding a new domain\n\nEach shared host will also instruct you how to\
    \ configure DNS settings for the domain to respond to the shared host's servers.\
    \ Note that it might take up to 24 hours for a DNS change to propagate across\
    \ the web.\n\nAdding a new domain will automatically create an FTP account for\
