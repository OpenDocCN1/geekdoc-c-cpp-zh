    # # Chapter 3


    # # The Application Environment


    This chapter will focus on the application environment. We''ll also discuss *AMP
    bundles as XAMPP and why they''re a poor choice: production /development parity;
    and performance and debugging.


    If you''re familiar with all these terms, feel free to skip this chapter.


    # # Application Environments


    The **application environment** is the term used to describe the environment your
    application can find itself during various stages of its life cycle: the production
    environment, the development environment, and the staging environment.


    The word **environment** refers to the hardware and software around your application;
    that is, everything used to power it.


    # # Production


    We''ll start with the most straightforward of environments: the **production environment**.'
  - '[PAGE 52]


    # Jump Start PHP Environment


    When you **deploy**—in other words, upload it to a server and make it publicly
    accessible for the target audience—you''re putting it in **production**, or in
    **use**. The production environment is your application''s final destination,
    your code''s purpose.


    In an application''s life cycle, the production environment is the **live server**—a
    server computer that''s set up so that other people can connect to and see your
    website. This live server will be configured to serve your application as efficiently
    as possible. All the extra files you use during development will be removed from
    the application via a process known as compiling or building, which is explained
    further on.


    In production, your site is considered to be live (or deployed) and accessible
    via its own domain; for example, `http://mysite.com`. When you launch your site
    (put it into production mode), you have cause for celebration, because it is the
    final step in your application''s development process.


    It is the equivalent of a chef cooking a meal in a restaurant and having it delivered
    to the patrons who ordered it.


    # Development


    In the development environment, your application is actively developed. The **development
    environment** is the computer that the developer are using to develop the app,
    including the computers of all your team members, regardless of whether they are
    near or remote. It is important to note that despite covering aspects, the development
    environment refers more to the *state your app is*, rather than its physical location—the
    app is in the **state of being developed**.


    In the development environment, you have various tools at your disposal—from IDEs
    (see Chapter 2) to unit testing libraries and standards fixes, compilers and builders,
    file watchers, and more—anything you need to achieve the job at hand.


    If we compare our application to a smartphone, the assembly plant it''s being
    made in is the development environment. This environment contains all the necessary
    parts—the screen, the case, the various LEDs—and each part is individually tested
    before being used in the construction of a smartphone unit. This is called **unit
    testing**—ensuring each unit works.'
- md: '

    For an example of unit testing in application development, see the section called
    “For Those Who Want More” at the end of this chapter.


    To take the smartphone assembly analogy further, the battery being tested might
    require a separate charger attachment, or the screen may need to be tested using
    robotic arm with synthetic fingers to ensure that the screen''s touch sensitivity
    works.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_53_0.png)


    All these add-ons are there during development only. When converting from the
    development environment to the production environment (also known as *deploying*),
    these add-ons are removed. For our application, this means the aforementioned
    compilation/building step: various CSS and JavaScript files are merged together
    and shrunk so as to decrease the size of the website, making it appear faster
    when people visit it; unit tests are ignored and left behind in the development
    environment; and various other optimizations occur (covered later in the chapter)—all
    with the intention of making the final product maximize its appeal and potential
    when ready.


    ## Hosts and Virtual Hosts


    When you develop on your own computer, it''s impossible to visit the URL http://mysite.com
    and expect to see your site; after all, your site is yet to go live—it''s not
    on the Internet. To get around this and see our site as if it were live, we fake
    the Internet by defining virtual hosts.


    Put simply, a virtual host gives an instruction to the server program installed
    on your computer, such as: IF a user requests http://mysite.com in the browser,
    run the file myfile.php through PHP and show its output in the browser.


    As you can see, this is nearly identical to the regular request of flow of sites.
    But what makes the browser ask our own computer''s server program for the mysite.com
    domain, rather look it up on the Internet''s name servers? The hosts file.


    The hosts file is a special file present on every operating system. We mentioned
    briefly in the section called "For Those Who Want More" in Chapter 1. It contains
    a list of domains and their appropriate IP addresses, so that any browser on your
    computer can read it and go directly to the IP address without having to talk
    to the DNS to check where to go. On Windows, that file is in C:\Windows\System32\drivers\etc\hosts,
    and on Linux and Mac machines it''s in /etc/hosts. If you put an IP-name pair
    into this file, the computer will obey it. We can even try it out right now. No
    fear—there''s nothing that can go wrong. Ready?


    **On Windows, enter the search field, type “notepad” and once it appears, right-click
    and select Run as Administrator.** The system will then ask you for confirmation.
    In the window that opens, select **File > Open and go to: My Computer > C > Windows
    System32 > drivers > etc**. In the lower right corner of the Notepad window, you
    might need to select **All Files** so that the hosts file shows. Double-click
    to open.


    On Linux/Mac machines, open Terminal by searching for it. **On Linux, open the
    default text editor as the administrator by typing sudo edit into Terminal.**
    You’ll be asked for your administrator password. **On OS X, enter sudo /Application/TextEdit.app/Contents/MacOS/TextEdit**,
    which will do the same task. In either of these editors, go to **File -> Open**
    and enter the directory /etc to find the hosts file. Double-click to open it.


    Once the file is opened, note the first few lines: they''ll all start with the
    hash symbol (#). This indicates that they''re comments, and have no effect on
    the file. These serve to explain a file''s purpose to the user, and they exist
    in PHP as well.


    Now, under all these comment lines, add the following line:


    ```

    208.117.229.217 bing.com

    ```


    Save the file and open http://bing.com in your browser. You''ve just successfully
    redirected all requests to Microsoft''s search engine Bing to Google! Of course,
    we don''t want to keep these changes; feel free to delete this or put a hash symbol
    in front of it to turn it into a comment, and save the file. You should be able
    to visit http://bing.com as normal again.


    Using this method, we''ll later redirect browser requests for http://mysite.com
    (which will be our application''s example domain) to our own computer''s server.
    This will enable us to easily test the development version of our site without
    deploying it.


    ## Staging and Maintenance


    The staging environment is a separate server (or several servers) containing a
    copy—also known as a mirror—of production environment. The staging environment
    is often skipped in smaller companies or projects. It is designed to resemble
    the production environment as closely as possible, with matching versions of installed
    software, identical configuration values, and so on. Staging is for performing
    the final tests; for example, Facebook might redesign its front page, and before
    deploying it into production for all users to see, it would deploy to its staging
    servers so that employees (dedicated non-programmers also known as the quality
    assurance team) can test everything as if using it regularly. If everything goes
    well, the final deployment from staging to production happens.


    Staging is beyond the scope of this book, but it''s good to know about it. In
    the age of virtual machines and small throw-away projects, staging can be unnecessary,
    only coming into play with bigger long-term web apps.


    There is also maintenance mode, a term we must cover in this context. It is a
    mode rather than an environment because the environment around the application
    doesn''t change—only the status of the application does. It''s usually just a
    switch on the production server telling those trying to access the website words
    to the effect of “Be right back, tuning up!”


    ## The Evil of *AMP Bundles


    When starting out in PHP development, it''s tempting to download and install packages
    as XAMPP¹. WAMP², MAMP³ or EasyPHP⁴. The AMP in those names stands for “Apache,
    MySQL, and PHP.” XAMPP adds another P at the end for the Perl language. The first
    letter refers to the operating system: Windows, Linux, Mac OS X, or in the case
    of XAMPP, cross-platform (meaning it works on any OS).


    These bundles contain all the software you need to run your PHP applications quickly
    and easily on your computer. In one click, you can install everything you ever
    need to write your very first PHP script. So, where''s the evil in this?


    - your computer will be polluted with unnecessary software

    - you’ll learn less than you would by installing manually

    - testing is difficult

    - if you make a mistake, it’s either very difficult or impossible to return to
    a pre’ state


    Let’s address these one by one.


    ## Machine Pollution


    Whenever you install software such as an *AMP stack on your computer, a chunk
    of your computer dies. If you delete the software later on, uncomfortable traces
    usually remain—often in the form of registry entries in Windows or file dust on
    Linux. In fact, this is especially apparent on Linux. While Windows and OS X applications
    are installed in an application folder with all related files inside it, or Linux
    the installation of software is like taking a shotgun to a castle built of Legos.
    One click and they’re everywhere.


    As time goes on, you’ll install another library, another package, another tool.
    You’ll keeping additional software as you develop your app further, perhaps add
    different items entirely because you''ve started working on a new project in parallel.
    Maybe app1 requires a PHP extension to edit images, and app2 needs a PHP extension
    that allows it to package code into closed source, so that your code is hidden
    from your competition. In time, you''ll have hundreds of megabytes of development
    software sitting on your machine, with no clue as to whether not still need it.


    > ¹ https://www.apachefriends.org/index.html

    ² http://www.wamserver.com/en/

    ³ http://www.mamp.info/en/

    ⁴ http://www.easyphp.org/


    Your machine will slow down, applications will become less usable, and your development
    machine—the computer you''re working on—will become different from the production
    server you eventually intend to deploy your application on will be unable to handle
    the difference gracefully. You''ll end up regularly combating bugs on a live website
    and annoying your visitors to no end.


    ## Learning is Progress, or How the Comfort of Your Comfort Zone is Overrated


    By depending on these prebuilt packages, you also rob yourself of the experience
    of learning system administration work (ops, in person). Ops is, in larger companies,
    a team or person in charge of server—whether it is fixing bugs, installation of
    new software, upgrading existing software, and so on. In smaller teams or when
    working for clients, basic system administration is an essential skill to have.


    While being able to install everything you need onto your computer with a single
    click is near, there''s no user interface on a server and nothing to click; you
    need to master the commands required to set up a server''s software so that it
    can run your PHP application. Otherwise, you''re either destined to hire a server
    administrator to help you out, or even worse, use shared hosting (a horror story
    that''s explained in Chapter 6).


    By refusing to use these AMP bundles, you''ll be forced to climb the learning
    curve of installing a server and other software by hand—knowledge that will be
    useful in more ways than one if you''re serious about this career path. Besides,
    nailing the basics is really not that hard, as you''ll see later in the book.


    ## Testing


    Say app1 and app2 are built on PHP 5.3, run MySQL 4.0, and are intended to live
    on a server powered by Apache (the server software). Then, there''s a new requirement:
    make sure app1 works on PHP 5.6 and MySQL 5.1, and can be powered

