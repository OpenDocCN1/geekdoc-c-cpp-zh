    类以便使用它检查数据库是否包含匹配的用户名和密码组合），但它的额外优势是上下文是透明的。毕竟，通过查看其文件内部，甚至仅仅看它的名称，就能很容易发现某个类的意图。


    为了解决这个问题，我们使用一个名为 Composer 的工具。


    # 什么是 Composer？


    Composer¹ 是 PHP 的包管理器。我们已经将包定义为类的集合。那么，包管理器是什么？


    包管理器是一种工具，它消除了在查找和将包或程序安装到环境的过程中的人为因素。例如，如果你正在使用 OS X，那里有一个名为 Homebrew 的操作系统包管理器。与其在网络上搜索像
    MPlayer（一种媒体播放器）这样的应用程序，可以使用终端运行命令：


    ```bash

    brew install mplayer

    ```


    像魔法一样，应用程序将完成安装并立即可用。在 Linux 操作系统上，有几个包管理器。一个流行的是 Aptitude，其用法类似：


    ```bash

    sudo apt-get install chrome

    ```


    这个命令安装了最新的 Chrome 浏览器，就这么简单了。


    包管理器确保包（应用程序就是一个包——它是一组共同工作实现单一目的的文件，无论是媒体播放、网页浏览还是完全其他的内容）被以清洁、快速和安全的方式安装。


    同样，在编程语言（如 PHP）的上下文中，包管理器用于检索、安装、更新和卸载包。虽然不使用 Composer 时为类设置自动加载的繁琐工作足够简单，但 Composer
    完全消除了这一过程。它自动化了手动在网上查找包、下载、解压、将其放入项目文件夹、包含它、配置它等手动过程。


    Composer 连接到 Packagist²，这是用户提供的事实上的在线包目录。让我们解释一下当你用 Composer 安装包时会发生什么。


    PHP 有一个内置的类叫 DateTime（文档见 http://php.net/manual/en/class.datetime.php），它可以用于进行时间相关的计算和操作。然而，这个类相当不直观。


    # Composer 95


    nesbot/carbon 包有一个类，具有操纵时间的能力。

    嗯，并不是操纵时间本身——PHP 还没有那么强大（尽管如此！）——而是操纵 DateTime 值。


    Carbon 是作为 DateTime 的升级而开发的，它允许你使用非常人性化的表达式来获取你需要的值。让我们尝试使用这个好手的包！根据 Carbon 的说明³，我们只需要下载、解压并用
    `include ''Carbon.php'';` 将其手动包含在项目中；然而，强烈建议你在任何可能的情况下使用 Composer。


