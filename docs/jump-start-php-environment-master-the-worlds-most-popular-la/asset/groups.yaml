    It can be tedious to find out the exact commit ID, as shorthand identifiers such
    as HEAD~1 are supported, too. HEAD is “current commit” and ~1 tells Git to go
    back one parent into the past. Doing git reset --hard HEAD~1 would have worked,
    too.


