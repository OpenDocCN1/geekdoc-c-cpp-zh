    \ more verbose way. What gives?\n\n4 http://www.json.org/\n\n# Jump Start PHP\
    \ Environment\n\nThe composer.lock file is used to list all the installed dependencies\
    \ at a given time. The composer.lock file is committed (see Chapter 5) into your\
    \ application's repository along with all source code, and on the live server\
    \ (when deploying). composer install looks for this file. If the command fails,\
    \ it will use the versions listed in this file—no matter how outdated! If there\
    \ is no lock file, it will look for the newest versions of the required packages,\
    \ generate a completely new composer.lock file, and proceed as usual.\n\nWhy is\
    \ this important?\n\nImagine using PackageX v1.2 in your local development environment,\
    \ testing your application, and after ensuring it works, deploying it to a live\
    \ server. The time between your checks and the app being deployed, PackageX was\
    \ updated to v1.3, which differs from v1.2 to no longer share some functionality.\
    \ Maybe a method was renamed? Letting Composer determine the newest version on\
    \ its own would install the latest version and make your app use a non-existent\
    \ method, thus crashing the application. Disaster! That's why composer.lock is\
    \ there—to ensure the version that was used in development is what's installed.\n\
    \nSo, how do we update the package to 1.3 if we actually want to? We use the composer\
    \ update command.\n\ncomposer update looks at all the installed packages, regardless\
    \ of the presence of a composer.lock file, updates both composer.json and composer.lock\
    \ with the newest versions, and installs them. Typically, composer update is run\
    \ only in development (not production); when you're content everything with the\
    \ latest version, the newly generated composer.lock is deployed with the app as\
    \ usual, and composer install is run in production, again ensuring the versions\
    \ locked by composer.lock are installed.\n\n# require-dev and global\n\nDuring\
    \ development, it's common to write unit tests for your code. A final version\
    \ of your application/package, however, can omit those tests. Tests are for development,\
    \ to make sure the code works. Including them in final versions of your work bloats\
    \ the file size without any benefit to end users (though it is good for developers\
    \ who want to contribute to your code).\n\nFor this purpose, a -dev option exists\
    \ when calling composer require. For example, if I'm using a package called PHPUnit\
    \ to write my unit tests, I would install it so:\n\n```\ncomposer require phpunit/phpunit\
    \ --dev\n```\n\nThis places it in a special require-dev block in composer.json,\
    \ rather than require, and ensures it stays out of the end user's way when a package\
    \ is installed with the --update-no-dev flag. For example, we developed SitePoint/Authorization\\\
    User with PHPUnit for tests, but Jim just wants to use the package only—no need\
    \ for tests. He installs it with:\n\n```\ncomposer require sitepoint/auth-user\
    \ --update-no-dev\n```\n\nPHPUnit, however, is a tool which is useful across many\
    \ projects, but installing it for each one is wasteful, it's quite large. That's\
    \ global comes in. The global option of the composer command will make sure it's\
    \ installed as a global package, instantly becoming available across the entire\
    \ operating system we're working on:\n\n```\ncomposer global require phpunit/phpunit\
    \ --dev\n```\n\n# Is that all there is?\n\nOf course! Composer has a multitude\
    \ of commands. All the above and much is what makes Composer an essential tool\
    \ in a PHP developer's daily routine. From removing the mental overhead of tracking\
    \ packages and classes, to smooth updates and flawless cooperation with other\
    \ Composer users, this package manager continues to take the PHP ecosystem by\
    \ storm.\n\nThere's also the very scripts block, which lets a package author execute\
