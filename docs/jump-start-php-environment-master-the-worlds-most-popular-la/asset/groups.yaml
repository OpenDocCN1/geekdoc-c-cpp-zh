    # Jump Start PHP Environment


    ```php

    <?php

    $word1 = "Hello";

    ?>

    ```


    file-b.php has the code:


    ```php

    <?php

    $word2 = "World";

    ?>

    ```


    You could use them in file-c.php like so:


    ```php

    <?php

    include ''file-a.php'';

    include ''file-b.php'';


    echo "I am now using file-a and file-b, yay! {$word1} {$word2}";

    ?>

    ```


    Wait, this would output:


    > I am now using file-a and file-b, yay! Hello World!


    With more files, the lists grow larger and larger. It follows that PHP applications
    are mile-long invocations of these helper scripts, one after the other. We call
    this code spaghetti code because it''s a mess—one line intertwined with the next,
    no structure or order, a bit of logic calling another bit of logic that''s defined
    in an arbitrary external location. Spaghetti code is very hostile to other developers
    (or even the original developer a couple of months later!).


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_113_0.png)


    Figure 7.1. Spaghetti mess


    With the advent of object-oriented PHP in version 5, we gained the ability to
    write blocks of code called **classes**. A class grouped together logic that belonged
    in a specific context. Specifically, in the realm of the Web, a User class could
    have the methods (aka internal functions, abilities) login and logout.


    In an application, using this class would allow a developer to implement login
    and log-out functionality. Classes could talk to other classes by **including**
    them just like the files above (for example, a User class could include a Database
    class in order to use it to check if the database contains matching username and
    password combination), but has the added advantage of being transparent about
    their context. After all, it was very easy to find out what a certain class was
    intended to do by just looking inside its file, or even at its name alone.


    To solve this problem, we use a tool called Composer.


    # What is Composer?


    Composer¹ is a package manager for PHP. We already defined a package as a collection
    of classes. So what''s a package manager, then?


    A package manager is a tool that removes the human element from the process of
    finding and installing packages or programs into an environment. If you''re using
    OS X, for example, there is a package manager for the OS called Homebrew. Rather
    than scour the Web in search of an application such as MPlayer, a media player,
    one can use the terminal to run the command:


    ```bash

    brew install mplayer

    ```


    Like magic, the application will be installed and instantly available. On Linux
    operating systems, there are several package managers. A popular one is Aptitude
    and is used in a similar fashion:


    ```bash

    sudo apt-get install chrome

    ```


    This command installs the latest Chrome browser, just like that.


    Package managers make sure packages (an application is a package—it''s a set of
    files working together towards a singular purpose, be it media playback, web browsing,
    or something else entirely) are installed cleanly, quickly, and safely.


    Similarly, in the context of programming languages (such as PHP), a package manager
    is used to retrieve, install, update and uninstall packages. While the grunt work
    of setting up autoloading for classes without Composer is easy enough. Composer
    removes the process completely. It automates the manual process of finding a package
    online, downloading it, unzipping, putting it into your project''s folder, including
    it, configuring it, and so on.


    Composer ties into Packagist² the de facto online directory of packages from users.
    Let''s explain what happens when you install a package with Composer.


    PHP has a built-in class called DateTime (documented at http://php.net/manual/en/class.datetime.php),
    which can be used to do time-related calculations and operations. The class is
    somewhat unintuitive, however.


    # Composer 95


    The nesbot/carbon package has a single class with the ability to manipulate time.

    Well, manipulate time per se—PHP isn''t that powerful (yet!)—but to manipulate
    DateTime values.


    Carbon was developed as an upgrade of DateTime, and lets you use very human expressions
    to obtain the values you need. Let''s try and use this handy package! As per the
    Carbon instructions³ we could just download, unzip, and manually include it in
    our project with include ''Carbon.php''; however, it is really recommended that
    you use Composer every chance you can.


    # Bootstrapping


    We start off by booting up a virtual machine, as Chapter 4. The following five
    commands executed from the host computer''s terminal do everything for us:


    ```bash

    git clone https://github.com/swader/homestead_improved hi_carbonstest

    cd hi_carbonstest

    bin/folderfix.sh

    vagrant up

    vagrant ssh

    ```


    The last command enters the VM, so you''re inside it, as if connected to a server.

    Then, execute:


    ```bash

    cd Code

    touch index.php

    ```


    The touch command creates an empty file with the given name.


    Open this index.php file with your text editor or IDE of choice, either in the
    terminal with vim index.php or on your host machine by going into the folder and
    double clicking on it. Then give it the content:


    ```php

    <?php

    echo "Hello World";

    ?>

    ```


    Save and exit the file, then in the terminal inside the VM run:


    ```bash

    php index.php

    ```


    The output is "Hello World".


    # Command Line Interface


    In this instance, we are executing PHP on the terminal. This is also mode, which
    is short for Command Line Interface.


    # Installing Carbon


    Composer has to be manually installed, so all we need to do is execute:


    ```bash

    composer require nesbot/carbon

    ```


    As soon as the procedure is done, reopen the index.php file, and add the following
