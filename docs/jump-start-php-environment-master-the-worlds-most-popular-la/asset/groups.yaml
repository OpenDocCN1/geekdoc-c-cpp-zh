    # The Anatomy of Web Requests


    Up until that last step, everything was happening on your one computer, or as
    we say, locally. Now that it''s time to visit the ISP, it''s no longer a local
    matter—it''s remote. If the ISP''s DNS server is without a record for the domain,
    it finds out and tells the browser, caches the results for future queries. How
    does it find out? It dissects the domain name from right to left


    www.example.com is split into fragments. The .com part, called the TLD or top-level
    domain, is first. There are many DNS servers around the world, often configured
    in such a way that multiple computers act as one. This is so that if one does,
    others ensure the service is uninterrupted. The highest level of these servers
    are root servers, which know where to look further for details about a domain
    on any given TLD. The root server with the appropriate records for .com knows
    it will send you a query in XYZ—XYZ being another server that will know the example
    part. Further, the www part (also known as the subdomain) will come into play,
    and be registered on a specific name server, too, in this confusing chain of names
    and servers. Once all the fragments (also known as labels: .com, example, and
    www) are resolved into an IP address, the result is sent back.


    If you''d like to know more about name servers and want to find out how the entire
    Internet''s smooth functioning depends on thirteen main computers (clusters of
    computers), take a look at the root server page on Wikipedia,⁴ or check out some
    amazingly comprehensive answers over Super User.


    # What Happens When You Type ...


    A common job interview question is “What happens when you type google.com into
    your browser''s address box and press enter?” While, in part, we explained this
    earlier (albeit in a simplified manner), check out Alex Gaynor''s excellent description
    if you''d like to know the exact details,⁶ from hardware to software. It''s an
    extremely comprehensive but very well-written post. Note that, realistically,
    this level of detailed knowledge is unnecessary to be a good developer.


    ⁴ https://en.wikipedia.org/wiki/Root_name_server


    ⁵ https://superuser.com/questions/527116/how-does-my-browser-locate-the-nearest-dns-root-servers


    ⁶ https://github.com/alex/what-happens-when'
