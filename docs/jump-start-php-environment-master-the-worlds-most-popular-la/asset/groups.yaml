- md: "\n# Learn by Example: A Web App from Scratch\n\n```\nMacBook-MacPro:guestbook\
    \ vagrant@homestead$ ~//guestbook — sqlite3...\n[Bruno] SQLite version 3.8.10.2\
    \ 2015-05-20 18:17:19\n  Enter \"help\" for usage hints.\nsqlite> .tables\ncomments\n\
    sqlite> select * from comments:\n| Bruno Skvorci|bruno@skvorc.me|Hooray! Saving\
    \ comments works!!|2015-12-05 23:41:3|\nsqlite> \n```\n\nFigure 8.16. The comment\
    \ is saved!\n\nBy some chance the save didn't go through, this is where a call\
    \ to the var-duumper might be helpful. After the call to ->save(); in a new line,\
    \ put:\n\n```\ndump($database->error());\n```\n\nIf there were errors, this command\
    \ will output them on the screen and you'll know exactly what went wrong.\n\n\
    # Third Push\n\nIt's time to add, commit and push again. Try to recall the commands\
    \ without looking them up. If you get stuck, they're a couple of pages back.\n\
    \n# Development vs Production Database\n\nIt would be rather silly if we did all\
    \ our testing on a real database, and then that ended up live for our users to\
    \ see. We need a “development” database which will be in use while developing,\
    \ and a \"production\" database which we'll deploy alongside our app. See the\
    \ Application Environment chapter for clarifications on these terms.\n\nThere\
    \ are many ways to do this, but one of the easiest is:\n\n- app checks if a file\
    \ called database.local.db exists\n- if the file exists, it is used as the database\n\
    - if the file does not exist, the file database.db is used\n\nThe file database.local.db\
    \ can be put into the .gitignore file so it never ends up being shared with other\
    \ team members, and that it cannot end up in the repo (thus never deployed via\
    \ Git). By default, this will make the production version of our app use the production\
    \ database, and the local version of our app use the development database.\n\n\
    First, let's empty the database of dummy data.\n\n```\nsqlite3 storage/database.db\n\
    delete from comments;\ndelete from sqlite_sequence where name='comments';\n```\n\
    \nThe first delete deletes all test rows we have inserted. The second one resets\
    \ the auto-incrementing ID field back to 0. Now, let's turn this database file\
    \ into a template for future ones, then create the databases we need:\n\n```bash\n\
    cp storage\ncp database.db database.tpl.db\ncp database.tpl.db database.local.db\n\
    cp ..\n```\n\ncp is a terminal command for \"Copy\".\n\nThere should now be three\
    \ files: database.tpl.db, database.db and database.local.db.\n\nWe can now add\
    \ database.local.db to our .gitignore file, which will make sure it never ends\
    \ up in the repository:\n\n# Learn by Example: A Web App from Scratch 135\n\n\
    ```bash\necho -e \"\\ndatabase.local.db >> .gitignore\n```\n\nFinally, let's edit\
    \ index.php. We'll replace the Medoo initialization:\n\n```php\n$database = new\
    \ medoo([\n  'database_type' => 'sqlite',\n  'database_file' => '../storage/database.db'\n\
    ]);\n```\n\nwith:\n\n```php\n$file = './storage/database.db';\nif (is_writable('../storage/database.local.db'))\
    \ {\n  $file = '../storage/database.local.db';\n}\n$database = new medoo(\n  'database_type'\
    \ => 'sqlite',\n  'database_file' => $file\n);\n```\n\nThe above translates into\
    \ \"If there is a writable file called database.local.db in the folder one above\
    \ the current one, use that. Otherwise, use database.db\".\n\nIf we now refresh\
    \ http://guestbook.app (and the dummy comment creation code is still there), we\
    \ should see the comment appear in database.local.db, but not in database.db,\
    \ as shown in Figure 8.17.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_158_0.png)\n\
    \n# Fourth Push\n\nAgain, add, commit, and push. Don't look up the commands. If\
    \ you can remember them, rather look them up on the previous pages, try Googling\
    \ for them. Finding solutions by simply searching for them will become a daily\
    \ ordeal for the very near future. True skill is not in knowing something, but\
    \ in knowing where to find that knowledge (though, in all honesty, you'll probably\
    \ end up on StackOverflow).\n\n# Posting and Displaying Comments\n\nFirst, let's\
    \ modify index.php by removing the dummy Comment creation logic. The PHP section\
    \ and, thus, our new starting point, looks like this now:\n\n```php\n<?php\nrequire_once\
    \ '../vendor/autoload.php';\n```\n\n```php\n$file = './../storage/database.db';\n\
    if (is_writable('../storage/database.local.db')) {\n  $file = '../storage/database.local.db';\n\
    }\n$database = new medoo(\n    'database_type' => 'sqlite',\n    'database_file'\
    \ => $file\n);\n$comment = new SitePoint\\Comment($database);\n?>\n```\n\nAt this\
    \ point, we have autoloading set up, we have a database instance configured, and\
    \ we have an instance of the Comment class with the database connection injected\
    \ into it.\n\nFirst up, let's make it possible to post new comments.\n\n# Posting\n\
    \nAs we said earlier, when we visit a URL in a browser, we issue a GET request.\
    \ requests are for reading, they’re not supposed to alter data. This is why our\
    \ submission form is using method=\"post\", so the request we send to our app\
    \ after submitting the form is a POST one. In PHP, there are constructed superglobals\
    \ variables (usually arrays) accessible at any level of the application. Such\
    \ superglobals are $_GET and $_POST.\n\nWhen we visit a URL like http://some.url.com/?var=something&name=something-else,\
    \ the $_GET superglobal array will look like:\n\n```php\n$_GET = [\n  'var' =>\
    \ 'something',\n  'name' => 'something-else'\n];\n```\n\nIn other words, we will\
    \ be able to access var and name from the URL in any part of the application with\
    \ an approach like $_username = $_GET['name'].\n\n$_POST does the same thing,\
    \ but for values submitted via a form. Thus, the $_POST superglobal will also\
    \ have name key which will contain the value of said field.\n\n# Jump Start PHP\
    \ Environment\n\nFirst, we need to detect we're dealing with a form submission.\
    \ Remember how we used method='post' in our <form> element? Under the $comment\
    \ line, but before the closing ?> tag, we put the following:\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
    \ == 'POST') {\n  echo \"Form was submitted!\";\n}\n```\n\nThe first line detects\
    \ we're dealing with a form submission. $_SERVER is another superglobal in PHP\
    \ containing information about the current request (it gets filled automatically).\
    \ In this case, we're dealing with the request submitted via form.\n\nIf we refresh\
    \ http://guestbook.app now, we should see nothing. But if we press the Save button\
    \ on our form, we should see \"Form was submitted!\". There's a small problem,\
    \ though. If we try to refresh the page after a form submission, we'll get a strange\
    \ warning, shown in Figure 8.18.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_160_0.png)\n\
    \nIn Chrome's universe, a refresh means a complete redo—the repeat of the last\
    \ step, rather than re-rendering the URL we're on. It wants to re-send the form\
    \ information in its entirety. This doesn't happen when we punch in the http://guestbook.app\
    \ URL manually and re-visit that, but refreshing it after a form submission will\
    \ always produce this warning. You'll encounter this on other websites, we don't\
    \ want to scare our visitors with this message, we'll work around it. For now,\
    \ let's process the submission.\n\nReplace echo \"Form was submitted!\"; with:\n\
    \n```php\ndump($POST);\n```\n\nThen, enter some data into the comment form and\
    \ submit it. You should see something similar to Figure 8.19.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_161_0.png)\n\
    \nFigure 8.19. Dump of post data\n\nNotice how all three /var-dumper package we\
    \ installed at the beginning of this chapter), the functionality of the symfony/var\
    \ and have the same names as the fields from which they originate.\n\nAn important\
    \ aspect of receiving data from untrusted users in systems like the ones we're\
    \ building is input validation.\n\n# Validation: Never Trust User Input!\n\nThe\
    \ golden rule of validation is never trust user input, because you never know\
    \ when someone well versed in coding would stumble upon your app and attempt to\
    \ enter malicious information into the fields in an attempt to break your app.\n"
  mdcn: "\n\n# 实例学习：从零开始构建 Web 应用\n\n```\nMacBook-MacPro:guestbook vagrant@homestead$\
    \ ~//guestbook — sqlite3...\n[Bruno] SQLite version 3.8.10.2 2015-05-20 18:17:19\n\
    \  Enter \"help\" for usage hints.\nsqlite> .tables\ncomments\nsqlite> select\
    \ * from comments:\n| Bruno Skvorci|bruno@skvorc.me|Hooray! Saving comments works!!|2015-12-05\
    \ 23:41:3|\nsqlite> \n```\n\n图 8.16。注释已保存！\n\n如果由于某种原因保存失败，这里调用 var-duumper 可能会很有帮助。在新行中调用\
    \ ->save(); 之后，放入：\n\n```\ndump($database->error());\n```\n\n如果存在错误，此命令将在屏幕上输出它们，你将确切知道出了什么问题。\n\
    \n# 第三次推送\n\n是时候再次添加、提交并推送了。尝试在不查阅文档的情况下回忆这些命令。如果你卡住了，它们就在几页前的内容。\n\n# 开发数据库与生产数据库\n\
    \n如果我们在真实的数据库上进行所有测试，然后让它直接上线供用户查看，那就太愚蠢了。我们需要一个在开发期间使用的“开发”数据库，以及一个与应用一同部署的“生产”数据库。请参阅“应用程序环境”章节以获取这些术语的解释。\n\
    \n有许多方法可以实现这一点，但最简单的方法之一是：\n\n- 应用检查名为 database.local.db 的文件是否存在\n- 如果文件存在，则将其作为数据库\n\
    - 如果文件不存在，则使用文件 database.db\n\n可以将 database.local.db 文件放入 `.gitignore` 文件中，这样它就永远不会与其他团队成员共享，也不会进入存储库（因此不会通过\
    \ Git 部署）。默认情况下，这将使我们应用程序的生产版本使用生产数据库，而我们应用程序的本地版本使用开发数据库。\n\n首先，让我们清空数据库中的虚假数据。\n\
    \n```\nsqlite3 storage/database.db\ndelete from comments;\ndelete from sqlite_sequence\
    \ where name='comments';\n```\n\n第一个 `delete` 删除了我们插入的所有测试行。第二个 `delete` 将自增 ID\
    \ 字段重置回 0。现在，让我们这个数据库文件成为未来文件的模板，然后创建我们需要的数据库：\n\n```bash\ncp storage\ncp database.db\
    \ database.tpl.db\ncp database.tpl.db database.local.db\ncp ..\n```\n\n`cp` 是用于“复制”的终端命令。\n\
    \n现在应该有三个文件：database.tpl.db、database.db 和 database.local.db。\n\n我们现在可以将 database.local.db\
    \ 添加到我们的 `.gitignore` 文件中，这将确保它永远不会进入存储库：\n\n# 实例学习：从零开始构建 Web 应用 135\n\n```bash\n\
    echo -e \"\\ndatabase.local.db >> .gitignore\n```\n\n最后，让我们编辑 index.php。我们将替换\
    \ Medoo 的初始化：\n\n```php\n$database = new medoo([\n  'database_type' => 'sqlite',\n\
    \  'database_file' => '../storage/database.db'\n]);\n```\n\n替换为：\n\n```php\n$file\
    \ = './storage/database.db';\nif (is_writable('../storage/database.local.db'))\
    \ {\n  $file = '../storage/database.local.db';\n}\n$database = new medoo(\n  'database_type'\
    \ => 'sqlite',\n  'database_file' => $file\n);\n```\n\n上面的代码翻译为：“如果当前目录上一级文件夹有一个名为\
    \ database.local.db 的可写文件，则使用它。否则，使用 database.db”。\n\n如果我们现在刷新 http://guestbook.app（且虚假的注释创建代码仍在），我们应该能看到注释出现在\
    \ database.local.db 中，但在 database.db 中没有，如图 8.17 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_158_0.png)\n\
    \n# 第四次推送\n\n再次添加、提交并推送。不要查阅命令。如果你能记住它们，不如去翻看之前的页面，或者尝试在 Google 上搜索它们。仅仅通过搜索来寻找解决方案在在不久的将来将成为你每天的苦差。真正的技能不在于知道某些事，而在于知道去哪里寻找这些知识（尽管诚实地说，你最终可能会去\
    \ StackOverflow）。\n\n# 发布和显示注释\n\n首先，让我们通过修改 index.php 来移除虚假的注释创建逻辑。PHP 部分（即我们新的起点）现在看起来像这样：\n\
    \n```php\n<?php\nrequire_once '../vendor/autoload.php';\n```\n\n```php\n$file\
    \ = './../storage/database.db';\nif (is_writable('../storage/database.local.db'))\
    \ {\n  $file = '../storage/database.local.db';\n}\n$database = new medoo(\n  \
    \  'database_type' => 'sqlite',\n    'database_file' => $file\n);\n$comment =\
    \ new SitePoint\\Comment($database);\n?>\n```\n\n此时，我们已经设置了自动加载，配置了数据库实例，并且有了一个注入了数据库连接的\
    \ Comment 类实例。\n\n首先，让我们让发布新注释成为可能。\n\n# 发布\n\n正如我们之前所说，当我们在浏览器中访问 URL 时，我们发出的是一个\
    \ GET 请求。请求是用于读取的，它们不应该改变数据。这就是为什么我们的提交表单使用 `method=\"post\"`，以便我们在提交表单后发送给应用程序的请求是一个\
    \ POST 请求。在 PHP 中，有可以在应用程序任何层级访问的构造超全局变量（通常是数组）。这些超全局是 `$_GET` 和 `$_POST`。\n\n\
    当我们访问类似 http://some.url.com/?var=something&name=something-else 的 URL 时，`$_GET`\
    \ 超全局数组看起来如下：\n\n```php\n$_GET = [\n  'var' => 'something',\n  'name' => 'something-else'\n\
    ];\n```\n\n换句话说，我们将能够通过 `$_username = $_GET['name']` 这种方法从应用程序的任何部分访问 URL 中的 var\
    \ 和 name。\n\n`$_POST` 执行同样的事情，但是针对通过表单提交的值。因此，`$_POST` 超全局也将拥有 name 键，它将包含该字段的值。\n\
    \n# 启动 PHP 环境\n\n首先，我们需要检测我们是否正在处理表单提交。记得我们在 `<form>` 元素中使用了 `method='post'` 吗？在\
    \ `$comment` 行之后、`?>` 标签之前，放入以下内容：\n\n```php\nif ($_SERVER['REQUEST_METHOD'] ==\
    \ 'POST') {\n  echo \"Form was submitted!\";\n}\n```\n\n第一行检测我们是否正在处理表单提交。`$_SERVER`\
    \ 是另一个包含当前请求信息的超全局（它是自动填充的）。在这种情况下，我们在处理通过表单提交的请求。\n\n如果我们现在刷新 http://guestbook.app，我们什么都看不到。但如果我们点击表单上的\
    \ Save 按钮，我们应该看到“Form was submitted!”但有一个小问题。如果我们在提交提交后尝试刷新页面，我们会得到一个奇怪的警告，如图\
    \ 8.18 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_160_0.png)\n\n在 Chrome\
    \ 的世界里，刷新意味着完全重做——重复上一步，而不是重新渲染我们所在的 URL。它想要重新发送表单信息。当我们手动输入 http://guestbook.app\
    \ URL 并访问时，不会发生这种情况，但在提交提交后刷新会产生这种警告。你会在其他网站上遇到这种情况，我们不想让游客被这个消息吓到，我们会绕过它。现在，让我们处理提交的内容。\n\
    \n将 `echo \"Form was submitted!\";` 替换为：\n\n```php\ndump($POST);\n```\n\n然后，在注释表单中输入一些数据并提交。你应该看到类似于图\
    \ 8.19 的结果。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_161_0.png)\n\n图 8.19。Post\
    \ 数据的输出\n\n注意所有三个在本章开始时安装的 /var-dumper 包（具有 symfony/var 的功能），它们的名称与源字段名称相同。\n\n\
    在我们构建的这类系统中，接收来自不可信用户的数据时，一个重要的方面是输入验证。\n\n# 验证：永远不要信任用户输入！\n\n验证的黄金法永远不要信任用户输入，因为你不知道什么时候会有精通编程的人偶然发现你的应用，并尝试在字段中输入恶意信息来破坏你的应用。\n\
    \n"
