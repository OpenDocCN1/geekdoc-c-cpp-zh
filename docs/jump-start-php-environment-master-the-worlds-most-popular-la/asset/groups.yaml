    as soon as possible, they want to keep their tools on the host.


    This is where Vagrant comes in. Vagrant is a helper tool that uses VirtualBox
    to create "headless VMs." In other words, it boots them up without the multimedia
    angle (that is, without graphics and sound) so that they look almost like actual
    servers; all you are given a terminal application, as seen in Figure 4.3.'
