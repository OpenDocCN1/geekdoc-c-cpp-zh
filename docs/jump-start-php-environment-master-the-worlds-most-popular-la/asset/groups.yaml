    ```


    刷新浏览器中的 http://homestead.app/ URL，屏幕应该显示 "Hello Machine!"


    让我们现在检查一下发生的一切。


    # Homestead Improved: 解释


    当我们访问 URL https://github.com/Swader/homestead_improved 时，我们了 GitHub，一个开源项目的代码社交网络。Homestead
    是一个预配置的虚拟机，运行 Ubuntu 操作系统，并安装了关键的安全补丁和用于 PHP 开发常用的软件：即新版本的 PHP 和一些数据库等。Homestead
    Improved 是 Homestead 的稍微增强版本，通过一些文件使得入门变得更容易。GitHub 上的每个项目都是一个仓库（repository），即一组文件。Homestead
    Improved 仓库包含了运行 Vagrant 环境所需的所有文件，特别是 Vagrantfile。该 Vagrantfile 加载了仓库中所有其他文件的内容，并使用这些文件的组合来设置（配置）你的环境。这就是
    vagrant up 命令的作用所在：读取 Vagrantfile 并遵循指令。


