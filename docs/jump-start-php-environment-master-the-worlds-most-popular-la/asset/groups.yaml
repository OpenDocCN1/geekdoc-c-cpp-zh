    # 实例学习：从零开始构建 Web 应用


    随更改更新输出，这意味着当新错误出现时，它们会立即显示在屏幕上。你可以随时打开另一个终端窗口，像上面一样连接到 droplet，并在那里运行 `tail`；这样，你仍然可以完全控制主终端窗口以运行命令，而第二个窗口将为你监控错误。


    # 使用 Git 拉取代码


    最后！我们准备好部署应用了！


    ```bash

    cd /var/www

    git clone https://github.com/spbooks/phpenv1-example guestbook

    cd guestbook

    composer install --no-dev -o

    ```


    注意我们是如何使用 `--no-dev` 来防止安装这些规模的包，从而加快安装速度。对于这种规模的应用，这似乎并不重要，但在更大的项目中，差异是显而易见的。我们还使用了
    `-o`，它是 `--optimize-autoloader` 的缩写，用于构建类映射文件——这是一个特殊文件，它将命名空间到类的组合（来自 `composer.json`
    中的 `autoload` 部分）转换为固定的预计算数组，在大多数情况下，这会显著提高自动加载速度。在文档²中阅读更多关于这些命令行选项。


    由于我们都是使用 root 账户操作（我们是用 `root@IP-ADDRESS` 登录的，记得吧？），我们的应用“属于”root 用户，因为是由我们创建的。这在大多数情况下是可以的，但当
    PHP 需要对硬盘数据进行某些读写操作时不如此；PHP 作为独立用户运行，而用户无法修改超级用户（root）的文件。最后一步，我们需要修改权限：


    ```bash

    cd /var/www/guestbook

    sudo chmod -R :www-data .

    sudo chmod -R 775 storage

    ```


    `chmod` 命令将文件夹的所有权交给了 `www-data` 用户组：这是一个负责提供网页服务的特殊用户账户集合（PHP 和 Nginx 属于该组）。`chmod`
    选项赋予了


    > ⁰ https://getcomposer.org/doc/03-cli.md


    整个 `storage` 文件夹的所有者（root）和所属组（www-data）**写入权限**。在这两种情况下，`-R` 都意味着“递归”，即“也应用于所有子文件夹”。²1


    如果我们现在测试应用，无疑会看到一切运行正常，如图 8.31 所示。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_180_0.png)


    图 8.31. 运行正常的 droplet


    # 总结


    本章实践了我们之前涵盖的所有理论。我们讨论的每个术语和尝试的每个代码段都通过创建我们的小应用以某种方式被使用了。


    > 21 775 是一个文件/文件夹访问代码——可以在此 LinuxQuestions 论坛帖子中阅读更多相关信息：http://www.linuxquestions.org/questions/linux-software-2/chmod-codes-list-142654/


    这个最终的应用（可以在此处下载/克隆²），空无之外是对现代开发工作流的极佳介绍。当然，这仅仅是基础的底部，如果你接受这项任务，你的任务将在开始感到准备就绪之前消耗无数课程和教程。然而，多亏了这本书，你应该拥有一个可以构建的坚实基础。


    我鼓励你再仔细读这一章。从零开始，遵循步骤，跳过现在的阅读并回忆它是怎么做的。尝试理解代码的作用，真正深入阅读它。一旦你掌握了它，并且访客功能几乎成了肌肉记忆，请尝试引入一些更改。研究使用
    CSS 为表单设置样式，查看下面的链接以了解 OOP、单元测试、登录系统。在这个示例应用上，并把它当作弗兰肯斯坦的怪物一样，不断开发新功能，在它的额头上钉上一两只手臂。最重要的是：要开心！你玩得开心，就越想学习、实验和探索，而这正是成为一名程序员的真谛。此外，关于额外内容、代码解释以及如何实现其他高级高级的教程，请参阅上述仓库的
    README 文件。


