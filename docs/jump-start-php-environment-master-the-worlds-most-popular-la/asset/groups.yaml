    部署（Deployment）是将准备就的应用程序发送到实时服务器的行为，以便目标受众可以访问它。它也包括在添加新功能或修复漏洞时向在线应用程序推送更新。


    部署主要有两种类型：手动部署和自动部署。


    ## 手动部署


    手动部署涉及主动识别应用程序已处于目标受众可以使用的阶段，或者符合项目规范阶段——项目规范是一份概述整个项目开发过程的文档。


    一旦认为已就绪，开发者将采取几种方法之一来部署应用程序：


    - FTP：在 Web 1.0 的古代时代，文件传输协议（FTP）是从一个服务器传输文件到另一个服务器的方法（废话说！）。这种方法通常出现在严重过时的系统和服务器中，如大学、学校和共享主机。通过
    FTP 上传文件需要你在计算机上安装如 FileZilla 或 Cyberduck 这样的 FTP 客户端。你还需要服务器的凭据——通常是服务器名称、用户名和密码。如果一个应用程序已经部署，并且在其上部署一个更新版本，旧版本通常会被覆盖，这为各种可能出现的漏洞打开了大门。在部署方面，有更好的方法，应该避免
    FTP。


