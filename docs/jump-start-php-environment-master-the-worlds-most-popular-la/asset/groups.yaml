    ## Jump Start PHP Environment


    Another way of making sure you never have to add this to a project''s .gitignore
    file is by adding it to your global .gitignore. To see how, check out this handy
    guide from GitHub: https://github.com/articles/ignoring-files/


    With both our code and .gitignore file, we''ll need a readme file. A readme is
    the first file a GitHub repo displays to visitors, so it''s good to include some
    useful information about the author, the purpose of the code, ways to use it,
    ways to contribute to it, and so on. Make a README.md file in the phpenv folder
    via your IDE or the Terminal with touch README.md and give it some content such
    as:


    ```

    # Hello World


    This is a README file from the Jump Start PHP Environment book.

    Learning about Git and GitHub!

    ```


    The .md extension indicates that this is a Markdown (MD) file—one type of GitHub
    uses to display the readme content in a pretty, formatted manner. Knowing MD is
    not necessary in order to understand the rest of the content in this book; however,
    it is important in coding life, so I recommend you take a look at https://guides.github.com/features/mastering-markdown
    when you find the time.


    ## Adding and Committing


    To add all the files in our project to your repository, execute git add -A. The
    add command tells Git to add any changes that were made to the repo''s history
    track. The -A flag means “add new files, add changes to existing files, and add
    file deletions (that is, make note of all the files that were removed)”.


    What this actually did, though, was merely tell that Git we be tracking the changes
    to all the files it just added some time in the future. To actually make a commit,
    and by that create a restorable point in your project''s life cycle, we need to
    use the commit command: git commit -m ''Added my first files!''. The m means “commit
    message” and it''s where you label your changes. Anyone coming into your project
    will be able to look at that exact point in time and see your message, instantly
    knowing why you did what you did. Execute this now.


    > 8 https://help.github.com/articles/github-flavored-markdown/


    Now that our files are added and committed, let''s introduce a change. Open index.php
    again and change “Hello World” to “Hello Bob” so that the file looks like this:


    ```php

    <?php echo "Hello Bob";

    ```


    Then make another add and commit: first git add -A, then git commit -m ''Changed
    World to Bob''.


    Visit the page in the browser via http://phphenv.app/ and notice how it says “Hello
    Bob.".


    ## Reset


    We really like Bob, but our boss doesn’t, and asks us to change it back to “World.”
    We could make a change and commit, and be done with it. But in complex projects
    with many files, reverting by manually changing files back to the state they were
    in before will just fail to work. That’s why we have the reset command. To reset
    back to the previous commit, we need to find out the ID of that commit.


    We can do with this:


    ```

    git log

    ```


    In my case, as you can see in Figure 5.1, the ID of the commit before the most
    recent one is b6ad1756bb9b94fcf9b46c612180dc12b96176.


    ## Jump Start PHP Environment


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_90_0.png)


    Figure 5.1. Finding the ID of our commit


    To reset it, we execute:


    ```

    git reset --hard b6adf1756bb9b4f

    ```


    Notice how we used a shorter hash to find what git log gave us. That''s a feature
    of Git—just the first ten or so characters of a hash are enough to identify the
    correct commit we were looking for.


    Our entire modification is removed and it''s as if nothing ever happened. A refresh
    of http://phpvenv.app will confirm this.


    It can be tedious to find out the exact commit ID, as shorthand identifiers such
    as HEAD~1 are supported, too. HEAD is “current commit” and ~1 tells Git to go
    back one parent into the past. Doing git reset --hard HEAD~1 would have worked,
    too.


    The --hard option tells Git "no matter what changes we have pending, this reset
    is more important than anything, so just do it—no questions asked." Without --hard,
    Git would have complained if we had made any other uncommitted changes.


