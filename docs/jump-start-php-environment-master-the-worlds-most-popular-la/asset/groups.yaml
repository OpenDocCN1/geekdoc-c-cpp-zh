    ## # Deployment and Hosting


    Now that version control is out of the way, it''s time to look into deployment
    and hosting.


    **Deployment**, as you may have learned from previous chapters, refers to the
    act of putting your locally developed application online for people to use. A
    deployed application doesn''t necessarily mean a publicly available one—it can
    be an intranet application that is internal to a company, for example; it means
    it can be used by its target audience.


    An application, however, cannot be deployed without being **hosted**; there needs
    to be a server computer that is its home. In this chapter, we''ll talk about both
    terms in more detail and list some approaches to each. We''ll also cover the pros
    and cons of common approaches and define some terms you''ll be hearing a lot throughout
    your web development career.


    Even if you''re familiar with aspects of deployment and hosting, it''s recommended
    you read this chapter as it contains up-to-date information on what to avoid and
    what to select.


    # Hosting


    We''ll explain hosting first, as it''s important to know how to pick a home before
    you move into one.


    The three main types of hosting you''ll repeatedly encounter are: shared hosting,
    cloud hosting, and (virtual) private hosting. I''ll explain the parenthesized
    "virtual" further on.


    ## Shared Hosting


    When hosting companies have a single server (which can consist of either a single
    machine or acting as one), they make a separate folder and user account for each
    customer on this server; this is known as shared hosting. Each customer is allotted
    a power of the server''s processing power, a fraction of its total RAM, and a
    chunk of the hard drive space. This shard of resources can then be used as a home
    for your deployed application. A company might have several servers set up for
    when one runs out of space to accommodate new users. This sounds great in theory,
    but in practice it has many problems.


    ## Shared Hosting is Bad


    For lack of better (that is, cheaper and/or simpler) options, shared hosting was
    the only viable approach for many people for a long, long time. This kind of widespread
    use lead to its dominance of the hosting market, and it remains popular purely
    because of this initial inertia.


    Shared hosting is bad for several reasons:


    - **Security risk:** many popular content management systems such as WordPress,
    Drupal, Joomla, and others ask the user to enable write-all access mode on certain
    folders so that they may place their files in. In doing this, many users-willingly
    allow access to their website''s files by mistake while sharing a hard drive with
    other customers. This so-called "777 problem" (where 777 is Linux code for "allow
    everyone to do everything on this file or in this folder") is a tremendous security
    risk. What''s more, when using content management systems on shared hosts, you''re
    at risk of outdated versions. One site''s laziness and un-willingness to update
    another instance of the installed CMS on the same server can lead to your site
    being hacked, as it can become a gateway through which attackers gain access to
    the entire server!


    - **Traffic overload:** You rely on other people''s competence and traffic. If
    a site on a given server has badly written code that uses too CPU cycles or eats
    up a lot of RAM, other applications on the same server may suffer because of;
    since all applications are sharing the same hardware—which is quite limited in
    shared hosting environments—a user''s excessive needs may be detrimental to your
    own application. The same goes for well-written code with lots of traffic: if
    another site receives too much traffic, the server might get overloaded and shut
    down, taking your site down with it.


    - **Limits:** a lot of shared hosting companies promise unlimited bandwidth and
    resources, but this is almost never true¹. There is no such as “unlimited” anything:
    as soon as your site manage to breach an initially agreed-upon limit (be it regular
    CPU use, hard drive space, or bandwidth), you''ll be to discover what unlimited
    really means. Check out the following piece from WhoHostingThis.com points out
    the pitfalls of shared hosting, and provides a cautionary tale about getting disconnected
    due to using too many resources on an unlimited plan.


    - **Reputation:** when you''re on the same server as other customers, you share
    an IP address. Any illicit activity done by others on the same server can reflect
    badly on you. Imagine a customer sending millions of spam emails from a shared
    hosting server that you use. These emails are then picked up by popular spam-hunting
    engines and the IP address is flagged as that often spans people. Suddenly, all
    emails that your own application sends out are also flagged as spam in people
    inboxes, purely because the IP address is the same as that of the online spammer.


    These are some of the main issues around shared hosting. But there''s one that
    arguably more important than all the others mentioned: shared hosting holds you
    back.


    > ¹ http://myboringchannel.com/the-truth-about-web-hosting/

    > ² http://www.whohostingthis.com/blog/2010/08/09/the-cautionary-tale-of-the-frogsants-network-and-unlimited-hosting/


    # Jump Start PHP Environment


    ## Shared Hosting Holds You Back


    When using shared hosting, you''re typically given a simplified user interface
    such as cPanel, the one shown in Figure 6.1, through which to configure fine-tune
    aspects of your site. There is, however, no server access to install custom extensions,
    upgrade your app way you upgrade your local development server, and so on. You''re
    essentially, locked into what the hosting company has installed and there is no
    way to change it because it would affect hundreds—maybe thousands—of other users.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_100_0.png)


    > Figure 6.1. cPanel is a common shared-hosting control panel


    This might seem ideal for entry-level users, but it provides too much abstraction.
    In other words, it places a user too far from the nitty-gritty of custom configuration
    and server setups—something that is absolutely essential to be familiar with in
    your web development career.


    By sticking with such approaches, you do yourself a short-term favor for long-term
    harm. The time will come when you''ll have to deploy to a real, non-shared server,
    or when you''ll need to manually update software.


    But there must be some cases where all simplicity is good, right?


    ## Shared Hosting is Good for Limited Cases


    There are projects where shared hosting is a godsend. In a career of serious web
    development, these use cases are rare but still possible:


    - Custom email: with shared hosts, it''s incredibly easy to set up a email email
    address. Ever dreamed about an email address as firstname@lastname.com? Would
    like on a business card. With shared hosting, it''s a breeze. You buy a domain
    (lastname.com), go into your shared hosting control panel, and set it all up according
    to the instructions. Most have a step-by-step process, so you should have a personalized
    email account within 24 hours.


    - Small code samples: those requiring few resources are easily hosted on shared
    hosting servers. Small portfolio scripts and projects are ideal for this purpose;
    for example, code demos within tutorials you write, sample code from client websites,
    and so on. Anything needing to support large amounts of bandwidth should work
    indefinitely, and live demos inside words on a resume always lasts best!


    - Fire-and-forget projects: Finally, the simple sites for really low-maintenance
    clients as a neighbor''s pet, your grandma, a butcher, or a local store. Maybe
    you''re actively involved in volunteer work and are helping to organize a conference
    by creating a website for them. That''s generally short-lived or updated rarely
    (also known as a fire-and-forget project) has a comfy home on a shared hosting
    server. The low resource demands of such projects ensure their compatibility for
    a long time to come. For a cost as low as $5 per month (the average price of shared
    hosting servers these days), you can accommodate multiple clients.


    # Cloud Hosting


    Cloud hosting is where many computers are linked in a symbiosis making them act
    and appear as one.


    In Figure 6.2, the horizontal units in the glass cases are minimized computers:
    hardware units with all the unnecessary parts stripped out so that they are power,
    space, and heat efficient as possible. Networked together, they form one great
    whole,

