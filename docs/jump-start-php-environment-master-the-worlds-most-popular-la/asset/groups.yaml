    # # Deployment


    In this section, we''ll deploy our most excellent app. For more theory behind
    deployment, see Chapter 6.


    # ## Deploying on a Shared Host (Hostgator)


    Like we discussed in Chapter 6, shared hosting isn''t really a good option. It''s
    insecure, often very limited in resources (despite the unlimited claims) and these
    days not all that cheaper than VPS. Still, it might be the only thing you have
    access to, so it only makes sense we cover an old school FTP deployment procedure.'
