    # Git


    Git is a command-line application that''s generally without a GUI. It''s used
    strictly from the terminal or from within Git Bash, a tool that becomes automatically
    available on Windows when you install Git.


    Helper tools with graphical user interfaces do exist—partially removing the need
    for manually punching in commands—but in the vast majority of cases we require
    a version of the terminal. From now on in this book, whenever there''s an instruction
    like "execute the command git push", it''s assumed we are using the terminal or
    Git Bash to enter the command.


    Through Git, we can easily download repositories from Homestead Improved from
    the last chapter without having to use the Download button. Instead, we use a
    command called clone, like so:


    ```

    git clone https://github.com/swader/homestead_improved

    ```


    Notice that we used GitHub in the URL. We''ll explain that in the GitHub section
    shortly.


    # How does it work?


    In a nutshell, Git uses a hidden .git folder inside your project''s folder to
    track all the changes and previous versions of the files. Whenever you make a
    new commit (that''s a specially flagged point in time when something changed in
    a given file or set of files), Git will store a copy of the old version and new
    version in the .git folder so that we can later refer to them if needed. That,
    if we need to undo a change, we just tell Git to reset to a previous point in
    time with, for example, git reset 4729820dbf, where the code at the end is the
    name or flag of the commit. We''ll link to a more comprehensive Git guide at the
    end of this chapter. Reading it will make you a Git master within a day or two,
    tops.


    # Jump Start PHP Environment


    # Alternatives


    Git is far from being the only VCS. There are others such as Mercurial,¹ SVN,²
    CVS,³ and many, many, more, but Git is the most used one. It is the VCS if you
    want to contribute to open-source projects today, as the vast majority of them
    use it. It is also what powers GitHub, so you''ll be part of the pack from the
    get-go.


    # GitHub


    When using Git, you have the ability to clone repositories from any remote endpoint,
    provided the code is there. For example, if I have some source code and I put
    it on a live server (one accessible to the Internet), then configure this server
    to accept Git calls, anyone who has Git installed can clone this source by running:


    ```

    git clone https://myserver/myrepo.git

    ```


    However, not everyone has the time, money, know-how, or patience to set up a server
    to host code for others. This is where GitHub comes in.⁴


    GitHub is a website where people can host their repositories for free, but there''s
    a catch—all repositories are immediately accessible to everyone. They''re public.
    Private repositories are supported, but cost money. This is ideal when developing
    projects for clients that should be kept private—especially from the client''s
    competition. For free repos, there are alternative websites such as GitLab⁵ and
    Bitbucket⁶ but those aren''t nearly as popular as GitHub, hence why we''ll use
    GitHub in this book. In your adventures, feel free to use whatever service you
    like.


    But why might one want to use a service as GitHub for their code? Apart from the
    obvious answer of being able to share your code with others easily and for free,
    services such as GitHub can be lifesavers when yours dies and you lose all its
    content. If you regularly pushed (a Git term for “upload”) to the repository''s
    remote origin—meaning its GitHub URL—you''re safe from disaster: your entire file
    history is preserved and you can continue where you left off on another computer.
    Furthermore, many other companion services exist that integrate automatically
    with GitHub. One example would be Travis CI, a service that checks the code to
    make sure it all works whenever changes to a GitHub repository are detected. If
    something is wrong, Travis notifies you via email and updates a little badge on
    the repo''s main page warning users about the latest version.


    - ¹ https://www.mercurial-sc.org/

    - ² https://subversion.apache.org/

    - ³ https://www.nongnu.org/cvs/

    - ⁴ https://github.com

    - ⁵ https://gitlab.com

    - ⁶ https://bitbucket.com


    # Git in Action


    Let''s learn using a practical example. I recommend (and will assume) you put
    your projects into your home folder, the path for which the shortcut is ~. If
    you opt to use a different one, please adapt the code that.


    # Preparing the Environment


    As we''ve done in previous chapters, we first need to configure a VM in which
    we''ll do our experiments. We could do all this on our host machine, but remember
    that the end goal is to keep the host machine as clean as possible, all while
    using a fully discardable and experiment-friendly environment for all the playing
    around we can think of. Here''s what to do:


    - 1. Open Git on Windows or Terminal on OS X/Linux.

    - 2. Go into your home folder by executing the command cd ~.

    - 3. Clone the homestead_improved repository into a folder named hi_phenvv with
    the command: git clone https://github.com/swader/homestead_improved hi_phenvv.
    You''ve just learned about git clone!

    - 4. Enter the newly made folder with cd hi_phenvv.

    - 5. Execute bin/folderfix.sh

    - 6. Open Homestead.yaml and change the sites block so that:

    - 7. https://sitepoint.com

    - 8. Finally, run vagrant up


    # Jump Start PHP Environment


    With our environment ready, the path to learning is clear.


    # Creating a "Hello World" page


    With our environment ready, the path to learning is clear.


    - 1. In the hi_phenvv folder, create a new folder named phpenv. Change into the
    directory with cd phpenv.

    - 2. Make a new file index.php and give it the contents:

    ```php

    <?php echo "Hello World";

    ```

    - 3. Try visiting in the browser to make sure it works.


    We now have our "Hello World" page. We''re proud of our code and want to share
    it with the world. Let''s use Git and GitHub to do that.


    # Git


    Before we put anything on GitHub, we''ll tell Git to turn our source code into
    a repository.


    # Repo Initialization


    - While in the phpenv folder (that''s hi_phenvv), run git init. This is an initialization
    command that will create an empty .git folder. It is hidden by default, but you
    can see it if you run ls -a.

