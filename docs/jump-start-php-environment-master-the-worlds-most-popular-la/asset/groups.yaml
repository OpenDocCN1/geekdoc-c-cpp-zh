    # Git


    Git 是一个命令行应用程序，通常没有图形界面（GUI）。它严格地从终端或 Git Bash 中运行，Git Bash 是在 Windows 安装 Git
    时自动提供的工具。


    虽然确实存在带有图形界面的辅助工具——在某种程度上减少了手动输入命令的需要——但在大多数情况下，我们仍然需要版本的终端。从从书现在起，每当出现类似“执行命令
    git push”的指令时，我们假设我们正在使用终端或 Git Bash 输入该命令。


    通过 Git，我们可以轻松从上一个章节的 Homestead Improved 下载仓库，而无需使用“下载”按钮。相反，我们使用一个名为 `clone` 的命令，如下所示：


    ```

    git clone https://github.com/swader/homestead_improved

    ```


    注意，我们在 URL 中使用了 GitHub。我们稍后会在 GitHub 部分中解释这一点。


    # 它是如何工作的？


    简而言之，Git 使用项目文件夹内部的一个隐藏的 `.git` 文件夹来跟踪文件的所有更改和以前的版本。每当你进行新的提交（commit，即某个特定文件或一组文件发生变化的特殊标记时间点），Git
    都会在 `.git` 文件夹中存储旧版本和新版本的副本，以便我们以后在需要时引用它们。这意味着，如果我们需要撤销某些更改，只需告诉 Git 重置到之前的某个时间点，例如使用
    `git reset 4729820dbf`，其中结尾的代码是提交的名称或标记。我们将在本章末尾提供一个更全面的 Git 指南链接。阅读它将让你在最多一两天内成为一名
    Git 大师。


    # 快速上手 PHP 环境


    # 替代方案


    Git 远非唯一的版本控制系统（VCS）。还有其他工具，如 Mercurial、¹ SVN、² CVS、³ 以及许多、许多许多工具，但 Git 是最常用的。如果你现在想为开源项目做贡献，它就是你需要的
    VCS，因为绝大多数项目都在使用它。它也是 GitHub 的动力，所以你从一开始就会成为其中的一员。


    # GitHub


    当使用 Git 时，你有能力从任何远程端点克隆仓库，只要代码在那里即可。例如，如果我有一些源代码并将其放在一个在线服务器（一个可以通过互联网访问的服务器）上，然后配置此服务器接受
    Git 调用，那么任何安装了 Git 的人都可以运行以下命令来克隆此源码：


    ```

    git clone https://myserver/myrepo.git

    ```


    然而，并不是所有人都有时间、金钱、知识或耐心来搭建一个服务器为他人托管代码。这就是 GitHub 的用武之地。⁴


    GitHub 是一个人们可以在那里免费托管仓库的网站，但有一个限制——所有仓库都可以被所有人访问。它们是公开的。支持私有仓库，但需要付费。当为客户开发应该保持私密项目时——特别是防止客户的竞争对手看到——这是理想的。对于免费仓库，还有其他替代网站如
    GitLab⁵ 和 Bitbucket⁶，但它们远没有 GitHub 流行，这就是为什么我们将在本书中使用 GitHub。在你的冒险中，请随时使用你喜欢的任何服务。


    但为什么人们可能想要使用 GitHub 这样的服务来管理代码呢？除了能够轻松免费与他人共享代码这些明显的答案外，当代码崩溃并丢失所有内容时，像 GitHub
    这样的服务可以成为救命稻草。如果你定期向仓库的远程源（Git 术语中的“上传”）——即其 GitHub URL——你就免受了灾：你的整个文件历史都被保留了，你可以在另一台电脑上继续之前中断的工作。此外，还有许多其他与
    GitHub 集成的配套服务。一个例子是 Travis CI，该服务在检测到 GitHub 仓库发生更改时会检查代码以确保所有内容运行正常。如果出现问题，Travis
