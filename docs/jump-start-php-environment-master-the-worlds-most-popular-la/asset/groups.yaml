    章节开头的类比，单个可测试的单元可以是触摸屏，也可以电池。


    # 第 4 章


    ## 虚拟机


    在本章中，我们将学习虚拟化技术，以及为什么它对于高质量的开发体验至关重要。我们将使用诸如 Vagrant 等行业标准工具，并讨论让虚拟机变得更符合用户习惯的方法，以便让更广泛的受众能够上手。


    即使你对虚拟化非常熟悉，我仍然建议阅读这一章，因为其中无疑包含对你来说很新的信息。它还将解释并演示我们在本书剩余部分中将要使用的 VirtualBox（虚拟机盒）。


    要使用本章中介绍的工具，你需要在计算机上安装一些软件。这些软件是跨平台的，因此无论你使用什么操作系统，为你的电脑都有对应的版本。


    在继续之前，请确保你已经安装了以下内容：


    -   Vag，来自 https://www.vagrant.com/

    -   VirtualBox，来自 https://www.virtualbox.org/

    -   Git，来自 http://git-scm.com/downloads


    # 快速上手 PHP 环境


    所有链接都包含了每个主要操作系统的安装指南。


    # 虚拟机详解


    在我们使用虚拟机（VMs）之前，我将先解释它们是什么，以及它们在 Web 开发语境下的含义（这并不是一样的！）。


    # 什么是虚拟机？


    你的计算机是一台机器。它包含了 CPU、GPU、一些内存、硬盘等硬件。你需要所有这些来运行你的操作系统以及安装在其中的应用程序。**虚拟机**是一种特殊的应用程序，它预留你计算机的一部分，并假装自己是一台真实的机器。例如，虚拟机可能会从你的主主机预留部分
    CPU 和 2GB 内存，以及 20GB 的硬盘空间。这些资源随后汇聚成一个整体（如图 4.1 所示），它可以作为一台电脑独立运行。它拥有自己的独立于宿主机操作系统（即*host*）的操作系统，并安装了自身的应用程序。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_66_0.png)


    图 4.1 虚拟机的可视化


    # 虚拟机 45


    操作系统——事实上，不同机器的整个环境（宿主机和运行在宿主机上的虚拟机）是完全独立的，而且实际上彼此无法感知。宿主机知道自己可用的资源减少了，但并不担心。虚拟机知道自己有一些可用资源，但不知道这些资源不是真实的；它*认为*它们是真实的硬件部分。


    虚拟机，从字面上说，是计算机中的计算机。有些人用它们是为了在没有原生支持的操作系统上运行视频游戏；例如，在 Linux 系统上运行 Windows 游戏。安全公司将其用作**沙箱**，在这些环境中，他们可以释放病毒或潜在的恶意代码，而无必担心后果：如果虚拟机损坏了，通过两个简单的命令即可重建（毕竟它是虚拟的！）。企业公司将其用作避免软件过时的方法。与其因为内部应用程序依赖
    Windows XP 而在最新版本为 Windows 10 时花费数十进行重写，他们更愿花少少的钱购买 Windows 许可并在 Windows 10 宿主机内部运行
    Windows XP 机器，从而让他们在享受新操作系统更高安全性的同时，延长软件的生命周期。


    在开发中，虚拟机被用作应用程序的隔离环境。你可以在其中安装不同版本的 PHP 和 MySQL，并且你可以弄坏任何东西，因为虚拟机可以轻松地重置为原始状态。这使得虚拟机非常有吸引力，不仅用于在不同操作系统的不同版本上测试代码，还用于开发/生产环境的一性（在第
    3 章中讨论过）：它允许你配置虚拟机使其尽可能接近真实的服务器，从而能够像在线上一样测试代码，最大限度地减少错误。


    # 认识 VirtualBox 和 Vagrant


    VirtualBox 是我们在本章介绍中安装的软件之一，用于*构建*这些虚拟机。它从宿主机获取资源并将其提供给虚拟机。它是启动虚拟机的程序（虚拟机也像普通机器一样需要启动），帮助它维持其对现实的幻觉。VirtualBox
    具有许多功能，包括（但不限于）显卡共享（在你的显示器内启用虚拟显示）、输入（键盘、鼠标等）以及音频（在宿主机扬声器上播放虚拟机的声音）。图 4.2 展示了
    VirtualBox 的工作状态。


    # 46 快速上手 PHP 环境


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_68_0.png)


    然而，这可能会消耗大量资源并且可能极其缓慢。启动带有完整图形界面的虚拟机所花费的时间，与在旧硬件上启动匹配宿主机功率的预留资源的时间相当；因此，在开发 Web
    时，这会变得异常缓慢。此外，大多数 Web 开发者都有自己喜爱的 IDE 和浏览器以及其他工具，并且都已配置好良好的工作流。如果开发者必须在启动的每个新虚拟机中重新安装和重新配置这些工具，他们的职业将迅速失去吸引力。开发者希望能够使用他们熟悉并喜爱的工具而无需进行过多配置；他们希望尽快进入新项目，他们希望将工具保留在宿主机上。


    这就是 Vagrant 大显用场的地方。Vag 是一个辅助工具，它使用 VirtualBox 创建“无头虚拟机（headless VMs）”。换句话说，它在没有多媒体界面的情况下启动它们（即没有图形和声音），因此它们看起来几乎就像真实的服务器；你得到的只是一个终端应用程序，如图
    4.3 所示。


    # 虚拟机 47


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_69_0.png)


    图 4.3 Vagrant 的工作状态


    我们将在下文中详细讨论 Vagrant。


    # 虚拟机的优势


    回顾一下，在开发中使用虚拟机的优势是：


    -   它们很容易被销毁并重新构建，恢复到初始状态，且不会产生任何后果

    -   你可以在宿主机上使用你喜爱的应用程序

    -   通过将虚拟机配置为类似于真实的服务器，你可以实现开发/生产环境一致，从而享受无 bug 的部署

    -   你可以学习一些系统管理知识

    -   使用虚拟机时不可能对宿主机造成任何伤害，因为它们是完全隔离的


    # 快速上手 PHP 环境


    -   很容易向他人共享整个配置（通过发送 Vagrantfile——稍后会介绍），以便他们拥有完全相同的设置

    -   无需在你的宿主机上安装 PHP、服务器和数据库，从而保持主操作系统的干净和快速


    # Vagrant 概述


    Vagrant 是一个应用程序，它利用另一个应用程序（在本例中是 VirtualBox）通过简单的命令（如 `vagrant up`）创建虚拟机。在只有 VirtualBox
    的世界里，输入此类命令是枯燥、易出错且极其耗时的（尽管可行），而 Vagrant 帮助我们极快速地启动并运行。


    Vagrant 在特定的 Vagrantfile 的帮助下知道它需要做什么，该文件包含了设置环境的所有指令，使得创建新虚拟机变得简单得多。


    # Vagrant Box（镜像）


    以你自己的计算机为例。它有大量已安装的应用程序和服务，主文件夹中可能有很多媒体文件，如照片、音乐等。如果你能够将整台机器的软件集合打包成单个文件，在另一台计算机上解包后变成你机器的克隆，那么你就在构建一个镜像。这就是
    Vagrant Box：预配置的虚拟机，并安装了某些预装软件（配置软件——在下一节介绍），让你能够轻松进入项目。


    所有的各种 Vagrant Box 可以在 https://atlas.hashorp.com/boxes/search 找到。这些镜像是由其他人预配置并免费提供给大家。你可以使用这些预配置的镜像、调整现有的镜像或构建自己的。关于这方面的资源，请参本章末尾的链接。

    '
