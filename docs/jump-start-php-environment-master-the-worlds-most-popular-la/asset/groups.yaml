- md: "\n# Jump Start PHP Environment\n\nwas successfully executed past the require_once\
    \ point, indicating that our autoload file was loaded without problems.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_134_0.png)\n\
    \nrequire_once (see http://php.net/manual/en/function.require-once.php) is a statement\
    \ telling PHP to “Take the contents of this file and put them into the current\
    \ one. Crash if you cannot find it!” The require part makes sure of this. There\
    \ are other versions of this statement, all explained on the manual's page.\n\n\
    # Developing the App\n\nAt last, the fun part! Or is it?\n\n## Var Dumper\n\n\
    We'll begin by pulling in the var-dumper package, a tool from the Symfony framework\
    \ (see the section called “Frameworks versus Packages”).\n\nLike many other frameworks,\
    \ Symfony is a collection of packages for solving common web application problems.\
    \ When used as a set, they form a solid (albeit complex) starting point for highly\
    \ customizable web applications. These various Symfony components are also designed\
    \ to be standalone, so if users adopt a custom approach or different framework,\
    \ they can benefit from Symfony packages.\n\nvar_dump is one such component. PHP\
    \ has a built-in function called var_dump that outputs the contents of a variable\
    \ onscreen. The var-bumper provides a dump function that does the same, but in\
    \ a more readable manner and with collapse/expander buttons. We will demonstrate\
    \ this shortly; for now, let's install it:\n\n```bash\ncomposer require symfony/var-dump\
    \ --dev\n```\n\nThe --dev option tells Composer to place it in the require-dev\
    \ block of composer.json. These debugging helpers of this kind are typically used\
    \ in development, rather than production. For packages that are required in production,\
    \ we simply omit the --dev flag and they'll end up in the require block, require-dev.\
    \ The rule of thumb is: if a package is meant to be used only during the development\
    \ phase of an app or other package, put it in require-dev. Otherwise, when we\
    \ deploy our app to production, we will be able to tell Composer to install without\
    \ dev, making the installation process faster.\n\nAs we've mentioned, PHP has\
    \ a built-in \"variable dumper\"—let's try it out on a PHP array. If you're unsure\
    \ what an array is, imagine a box that contains a variety of items. In index.php,\
    \ add the following:\n\n```php\n$array = [1, \"apple\", 2, \"bar\"];\nvar_dump($array);\n\
    ```\n\nThe square brackets in the code are the edges of our box—everything between\
    \ them is placed into the array. Then, refresh the page, and you should see something\
    \ similar to Figure 8.5.\n\n# Jump Start PHP Environment\n\n```php\n<?php\nrequire_once\
    \ './vendor/autoload.php';\necho \"Hello World\";\n$array = [1, \"apple\", 2,\
    \ \"bar\"];\nvar_dump($array);\n```\n\n```\nHello World\narray(size: 4)\n  [0]\
    \ => int(1)\n  [1] => string(5) \"apple\"\n  [2] => int(2)\n  [3] => string(3)\
    \ \"bar\"\n```\nFigure 8.5. Our var_dump example\n\nThe output is on the right,\
    \ under \"Hello World.\" It's not exactly readable—with Xdebug installed, a PHP\
    \ addon makes these types of output prettier by default—but it could be better.\
    \ Let's add a call to dump. The result can be seen in Figure 8.6.\n\n```php\n\
    <?php\nrequire_once './vendor/autoload.php';\necho \"Hello World\";\n$array =\
    \ [1, \"apple\", 2, \"bar\"];\n\nvar_dump($array);\ndump($array);\n```\n\n```\n\
    Hello World\narray(size: 4)\n  [0] => int(1)\n  [1] => string(5) \"apple\"\n \
    \ [2] => int(2)\n  [3] => string(3) \"bar\"\n\n[\n  0 => 1\n  1 => \"apple\"\n\
    \  2 => 2\n  3 => \"bar\"\n]\n```\nFigure 8.6. An example of dump\n\nBetter, no?\
    \ The collapse/expander button is also worth—you can imagine this being tremendously\
    \ useful when dealing with huge trees of nested arrays (an array can contain an\
    \ array, which can contain another array, and so on...). With dump available,\
    \ we've prepared our development environment for debugging. Should any errors\
    \ arise, we'll be able to output the information in an easily navigable manner.\
    \ If you're curious, read more about var-dump in this SitePoint post: http://www.sitepoint.com/var-dump-introducing/\n\
    \n# Database Connection\n\nThere are many databases available: MySQL, Oracle,\
    \ PostgreSQL, SQLite, and so on. The most popular one to use in tandem with PHP\
    \ is MySQL. Introducing SQL is outside the scope of this book, but it's necessary\
    \ for our purposes—we'll be using a library that abstracts database communication\
    \ for us.\n\nTo understand abstraction, imagine a power socket in the EU. It looks\
    \ like a plug, and we call it the Schuko socket, seen in Figure 8.7.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_137_0.png)\n\
    \nThen imagine a power socket in the US, seen in Figure 8.8. It has two vertical\
    \ slits and a shape that is completely incompatible with the EU one.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_138_0.png)\n\
    Figure 8.8. US socket\n\nEvery part of the world has its own standard, and if\
    \ you're a world traveler, carrying a separate power brick for each country you\
    \ visit would quickly take you past the airline’s baggage weight limit (and your\
    \ budget). Luckily there are items such as socket adapters: http://www.worldstandards.eu/electricity/plugs-and-sockets/\n\
    \n# Learn by Example: A Web App from Scratch\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_139_0.png)\n\
    Figure 8.9. A universal socket adapter\n\nOne beast such as the one in Figure\
    \ 8.9 handles most of the world’s power sockets. Is it heavier than just carrying\
    \ one laptop power brick and hoping your destination supports the socket? Yes,\
    \ but for a few extra grams, you have all the convenience of ten power bricks\
    \ with a fraction of the weight. The adapter is an abstract for a power-providing\
    \ service.\n\nThe same happens with abstraction in software. We could learn how\
    \ to communicate with PostgreSQL, SQLite, MySQL, MSSQL, and others. It would take\
    \ a while, but it's possible—just like lug around ten power bricks. Or we could\
    \ rely on abstraction—letting the authors of the package we put between the database\
    \ and us do the heavy lifting while we focus on usage.\n\n# Jump Start PHP Environment\n\
    \nOne such database abstraction layer is the very lightweight Medoo package. At\
    \ only 20KB in file size added to our project, we have the power to communicate\
    \ with several database engines in exactly the same way.\n\nWe'll demonstrate\
    \ this in an example soon. For now, let's install Medoo:\n\n```bash\ncomposer\
    \ require catfan/medoo\n```\n\nChange the index.php file so that instead of the\
    \ $array, var_dump and dump lines added before we now have:\n\n```php\n$database\
    \ = new Medoo([\n  'database_type' => 'sqlite',\n  'database_file' => '../storage/database.db'\n\
    ]);\n```\n\nThe variable $database is there to hold a new instance of the Medoo\
    \ class. The class needs a type and a filepath as the constructor arguments—the\
    \ values required for a class to build its instance properly—so we pass them all\
    \ in an array. (Notice the square brackets—just like in the array example earlier).\
    \ The arrows between the left and right column indicate assignment between keys\
    \ and values—just as in algebra x = 3, so too database_type = sqlite. For links\
    \ on crash courses in object-oriented programming, please see the end of chapter.\n\
    \nI understand this may feel a bit frustrating if you struggle to fully comprehend\
    \ the code here and what follows. However, rest assured that understanding the\
    \ code itself is not that important; the main aim of this book is to see an app\
    \ being started and deployed the right way.\n\nRefresh the browser and if there\
    \ are no errors, we're good, as seen in Figure 8.10.\n\n# Learn by Example: A\
    \ Web App from Scratch\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_141_0.png)\n\
    Figure 8.10. Our database now exists\n\nAdditionally, notice how in the storage\
    \ subfolder of the project a new file appeared: **database.db**. This is because\
    \ we're using SQLite in this example (there's a good introduction to SQLite on\
    \ SitePoint¹), which creates a database file if it doesn't exist.\n\n> ¹⁰ http://www.sitepoint.com/getting-started-sqlite3-basic-commands/\n"
  mdcn: "\n\n# 启动 PHP 环境\n\n已成功执行到 `require_once` 节点，这表明我们的自动加载文件没有问题地加载了。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_134_0.png)\n\
    \n`require_once`（参阅 http://php.net/manual/en/function.require-once.php）是一条语句，告诉\
    \ PHP “获取此文件的内容并将其放入当前文件中。如果找不到它，就崩溃！”。 `require` 部分确保了这一点。该语句还有其他版本，均在手册页面上有详细解释。\n\
    \n# 开发应用\n\n最后，到了有趣的部分！或者其实不然？\n\n## 变量调试 (Var Dumper)\n\n我们将首先引入 `var-dumper`\
    \ 包，这是一个来自 Symfony 框架的工具（参阅“框架与包”章节）。\n\n与许多其他框架一样，Symfony 是一个用于解决常见 Web 问题的包集合。当作为一个整体使用时，它们为高度自定义的\
    \ Web 应用提供了一个坚实（尽管很复杂）的起点。这些不同的 Symfony 组件也被设计为独立的，因此如果用户采用自定义方法或不同的框架，他们仍然可以从\
    \ Symfony 包中受益。\n\n`var_dump` 就是其中一个组件。PHP 有一个名为 `var_dump` 的内置函数，它可以在屏幕上输出变量的内容。`var-dumper`\
    \ 提供了一个 `dump` 函数，实现相同的功能，但方式更具可读性，并带有折叠/展开按钮。我们很快就会演示这一点；现在，让我们来安装它：\n\n```bash\n\
    composer require symfony/var-dump --dev\n```\n\n`--dev` 告诉 Composer 将其放置在 `composer.json`\
    \ 的 `require-dev` 块中。这类调试辅助工具通常用于开发环境，而不是生产环境。对于生产环境中需要的包，我们只需省略 `--dev` 标志，它们最终会进入\
    \ `require` 块（而非 `require-dev`）。经验法是：如果一个包仅旨在用于应用或其他包的开发阶段，就将其放入 `require-dev`。否则，当我们把应用部署到生产环境时，可以告诉\
    \ Composer 在不安装开发依赖的情况下安装，使安装过程更快。\n\n正如我们提到的，PHP 有一个内置的“变量调试器”——让我们在一个 PHP 数组上试一下。如果你不确定什么是数组，可以想象一个装有各种物品的盒子。在\
    \ `index.php` 中添加以下内容：\n\n```php\n$array = [1, \"apple\", 2, \"bar\"];\nvar_dump($array);\n\
    ```\n\n代码中的方括号是我们的盒子的边缘——它们之间的所有内容都被放入数组中。然后，刷新页面，你应该看到类似于图 8.5 的内容。\n\n# 启动 PHP\
    \ 环境\n\n```php\n<?php\nrequire_once './vendor/autoload.php';\necho \"Hello World\"\
    ;\n$array = [1, \"apple\", 2, \"bar\"];\nvar_dump($array);\n```\n\n```\nHello\
    \ World\narray(size: 4)\n  [0] => int(1)\n  [1] => string(5) \"apple\"\n  [2]\
    \ => int(2)\n  [3] => string(3) \"bar\"\n```\n图 8.5。我们的 var_dump 示例\n\n输出在右侧，“Hello\
    \ World”下方。它并不完全易读——在安装了 Xdebug 的情况下，PHP 插件默认会让这些类型的输出更美观——但还可以做得更好。让我们添加一个 `dump`\
    \ 调用。结果可以在图 8.6 中看到。\n\n```php\n<?php\nrequire_once './vendor/autoload.php';\n\
    echo \"Hello World\";\n$array = [1, \"apple\", 2, \"bar\"];\n\nvar_dump($array);\n\
    dump($array);\n```\n\n```\nHello World\narray(size: 4)\n  [0] => int(1)\n  [1]\
    \ => string(5) \"apple\"\n  [2] => int(2)\n  [3] => string(3) \"bar\"\n\n[\n \
    \ 0 => 1\n  1 => \"apple\"\n  2 => 2\n  3 => \"bar\"\n]\n```\n图 8.6。dump 的示例\n\
    \n更好了，对吧？折叠/展开按钮也非常值——你可以想象这在处理巨大的嵌套数组树时极其有用（数组可以包含另一个数组，该数组可以包含另一个数组，依此类推……）。有了有了\
    \ `dump`，我们已经为调试准备好了开发环境。如果出现任何错误，我们能够以易于导航的方式输出信息。如果你感兴趣，可以在这篇 SitePoint 文章中阅读更多关于\
    \ var-dump 的内容：http://www.sitepoint.com/var-dump-introducing/\n\n# 数据库连接\n\n有很多可用数据库：MySQL、Oracle、PostgreSQL、SQLite\
    \ 等。与 PHP 配合使用最流行的是 MySQL。引入 SQL 超出了本书的范范围，但对于我们的目的来说是必要的——我们将使用一个为我们抽象数据库通信的库。\n\
    \n为了理解抽象，想象一下欧盟的电源座。它看起来像一个插头，我们称之为 Schuko 插座，如图 8.7 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_137_0.png)\n\
    \n然后想象一下美国的电源座，如图 8.8 所示。它有两个垂直狭缝，形状与欧盟的完全不兼容。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_138_0.png)\n\
    图 8.8。电源座\n\n每个国家都有自己的标准，正如我们看到的那样。\n\n# 示例：从零开始 Web 应用\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_139_0.png)\n\
    图 8.9。通用插座\n\n这种数据库抽象层是非常轻级的 Medoo 包。在文件大小仅 20KB 的情况下，我们就能以相同的方式与多个数据库引擎通信。\n\n\
    正如我们提到的，\n\n我们很快就会在示例中演示这一点。现在，让我们安装 Medoo：\n\n```bash\ncomposer require catfan/medoo\n\
    ```\n\n"
