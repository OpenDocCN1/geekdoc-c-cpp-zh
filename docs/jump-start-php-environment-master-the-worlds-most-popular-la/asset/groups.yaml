    \ 章）学习，那么你已经准备就绪了。\n\n设置环境：\n\n- 1. 在我们的 /etc/hosts 文件中添加行 `192.168.10.10 guestbook.app`。关于如何以及以及为什么要这样做，请参见第\
    \ 3 章。\n\n- 2. 如果你的操作系统是 Windows，打开 Git Bash 程序（该程序在安装本节开头链接中的 Git 工具后可用）。否则，打开\
