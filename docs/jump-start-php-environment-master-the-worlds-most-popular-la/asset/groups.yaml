    # 46 Jump Start PHP Environment


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_68_0.png)


    However, this can be very resource-consuming and can be incredibly sluggish. Booting
    up virtual machines with full graphic interfaces takes just long as booting up
    on old hardware matching the host''s power of the reserved resources; consequently,
    this would be unnecessarily slow when developing for the Web. Furthermore, most
    web developers have their favorite IDE and browser, along with other tools, all
    configured for a pleasant workflow. If developers had to reinstall and reconfigure
