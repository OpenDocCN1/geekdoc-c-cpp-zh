    ![](img/7d1d10ff700e0e770ae037aef1a8424a_141_0.png)


    Figure 8.10. Our database now exists


    Additionally, notice how in the storage subfolder of the project a new file appeared:
    **database.db**. This is because we''re using SQLite in this example (there''s
    a good introduction to SQLite on SitePoint¹), which creates a database file if
    it doesn''t exist.


    We could just as easily have put mysql or postgresql under database_type and used
    that, as they''re both pre-installed on Homestead Improved, but would require
    additional configuration and wouldn''t be as clear outside of Homestead: those
    database engines need to be installed, after all.


    SQLite, on the other hand, is present on almost all operating systems by default,
    and can be used out of the box. It''s not as fast as MySQL and lacks some advanced
    features, but we neither this speed nor the complexity in our current project.


    The **database_file** value tells Medoo where to create the SQLite file to hold
    all our saved data. We told it to go "up one folder, and into *storage/database.db*";
    hence, the **database.db** file was created. The $database variable is now our
    adapter, plugged into a wall socket—our access to the data storage.


    Try dumping it, to see what it''s made of (Figure 8.11).


