    # Developing the App


    At last, the fun part! Or is it?


    # Var Dumper


    We''ll begin by pulling in the var-dumper package, a tool from the Symfony framework
    (see the section called “Frameworks versus Packages”).


    Like many other frameworks, Symfony is a collection of packages for solving common
    web application problems. When used as a set, they form a solid (albeit complex)
    starting point for highly customizable web applications. These various'
  - '[PAGE 135]


    Symfony components are also designed to be standalone, so if users adopt a custom
    approach or different framework, they can benefit from Symfony packages.


    var_dump is one such component. PHP has a built-in function called var_dump that
    outputs the contents of a variable onscreen. The var_bumper provides a dump function
    that does the same, but in a more readable manner and with collaser/expander buttons.
    We will demonstrate this shortly; for now, let''s install it:


    ```

    composer require symfony/var-dump --dev

    ```


    The --dev option tells Composer to place it in the require-dev block of composer.json.
    This is debugging helpers of this kind are typically used in development, rather
    than production. For packages that are required in production, we simply omit
    the --dev flag and they''ll end up in the require block, requiredev. The rule
    of thumb is: if a package is meant to be used only during the development phase
    of an app or other package, put it in require-dev. Otherwise, when we deploy our
    app to production, we will be able to tell Composer to install with composer install
    nonode, making the installation process much faster.


    As we''ve mentioned, PHP has a built-in "variable dumper"—the function var_dump⁶
    Let''s try it out on a PHP array. If you''re unsure what an array is, imagine
    a box that contains a variety of items. In index.php, add the following:


    ```

    $array = [1, "apple", 2, "foo", "bar\];


    var_dump($array);

    ```


    The square brackets in the code are the edges of our hypothetical box—everything
    between them is placed into the array.


    Then, refresh the http://guestbook.app page, and you should see a similar sight
    to Figure 8.5.'
