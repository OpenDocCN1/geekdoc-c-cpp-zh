    track all the changes and previous versions of the files. Whenever you make a
    new commit (that''s a specially flagged point in time when something changed in
    a given file or set of files), Git will store a copy of the old version and new
    version in the .git folder so that we can later refer to them if needed. That,
    if we need to undo a change, we just tell Git to reset to a previous point in
    time with, for example, git reset 4729820dbf, where the code at the end is the
    name or flag of the commit. We''ll link to a more comprehensive Git guide at the
    end of this chapter. Reading it will make you a Git master within a day or two,
