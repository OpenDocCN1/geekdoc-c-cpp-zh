    ## 快速上手 PHP 环境


    另一种确保你永远不需要将此文件添加到项目的 `.gitignore` 文件中的方法，是将其添加到你的全局 `.gitignore` 中。如需了解如何操作，请查看
    GitHub 提供的这份简用指南：https://github.com/articles/ignoring-files/


    有了我们的代码和 `.gitignore` 文件，我们需要一个 readme 文件。readme 是 GitHub 仓库向访问者展示的第一个文件，因此包含一些关于作者、代码用途、使用方法、贡献方式等有用信息是好的。通过你的
    IDE 或终端使用 `touch README.md` 在 phpenv 文件夹中创建一个 README.md 文件，并为其添加一些如下内容：


    ```

    # Hello World


    这是来自《快速上手 PHP 环境》书的 README 文件。

    学习 Git 和 GitHub！

    ```


    `.md` 扩展名表示这是一个 Markdown (MD) 文件——GitHub 用来以美观、格式化的方式显示 readme 内容的一种类型。为了理解书中其他内容，并不是非要了解
    MD；但它在编程生活中非常重要，因此建议你在有空时查看 https://guides.github.com/features/mastering-markdown。


    ## 添加与提交


    要将项目中的所有文件添加到仓库中，请执行 `git add -A`。`add` 命令告诉 Git 添加仓库历史跟踪中所做的任何更改。`-A` 标志意味着“添加新文件、添加现有文件的更改以及添加文件删除（即记录所有被删除的文件）”。


    然而，这实际上只是告诉 Git 我们将在未来的某时刻跟踪它刚刚添加的所有文件的更改。要实际执行提交，从而在项目的生命周期中创建一个可恢复的点，我们需要使用
    `commit` 命令：`git commit -m ''Added my first files!''`。`-m` 表示“提交信息（commit message）”，这是你标记更改的地方。任何进入你项目的人都可以查看那个时间点并看到你的信息，立即知道你为什么要那样做。现在执行它。


    > 8 https://help.github.com/articles/github-flavored-markdown/


    现在文件已经添加并提交，让我们引入一个更改。再次打开 `index.php` 将“Hello World”更改为“Hello Bob”，使文件看起来像这样：


    ```php

    <?php echo "Hello Bob";

    ```


    然后再次进行一次添加和提交：首先执行 `git add -A`，然后执行 `git commit -m ''Changed World to Bob''`。


    通过浏览器访问 http://phphenv.app/ 页面，并注意它如何显示“Hello Bob.”。


    ## 重置


    我们非常喜欢 Bob，但我们的老板不喜欢，并让我们改回“World”。我们可以进行更改并提交，然后完结。但在包含许多文件的复杂项目中，通过手动将文件改回之前的状态来撤销是行不起作用的。这就是为什么我们有
    `reset` 命令。要重置回上一次提交，我们需要找到该提交的 ID。


    我们可以借此操作：


    ```

    git log

    ```


    在我的案例中，如图 5.1 所示，最近一次提交之前的提交 ID 是 `b6ad1756bb9b94fcf9b46c612180dc12b96176`。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_90_0.png)


    图 5.1 查找我们提交的 ID


    要重置它，我们执行：


    ```

    git reset --hard b6adf1756bb9b4f

    ```


    注意我们如何使用较短的哈希值来找到 `git log` 给我们的结果。这是 Git 的特性——哈希的前十个左右字符就足以识别我们正在寻找的正确提交。


    我们的整个修改都被删除了，就好像什么都没发生过一样。刷新 http://phpvenv.app 将确认这一点。


    查找确切的提交 ID 可能很麻烦，因为也支持像 `HEAD~1` 这样的快捷标识符。`HEAD` 是“当前提交”，`~1` 告诉 Git 回到过去的父。执行
    `git reset --hard HEAD~1` 也可以。


    `--hard` 选项告诉 Git“无论我们有多少待处理的更改，这次重置比任何事情都重要，所以直接这样做——无需疑问”。如果没有 `--hard`，如果我们有任何其他未提交的更改，Git
    将会报错。


    ## GitHub


    现在我们对源代码再次表示满意了，让我们把它放到网上供他人克隆和检查。如果你还没有 GitHub 账户，请访问 https://github.com 注册。


    - 1. 在右上角，点击 `Create New > New repository` 按钮，如图 5.2 所示。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_91_0.png)


    - 2. 给它一个你喜欢的名称，例如“phenv”，并让所有其他选项保持默认值。


    - 3. 在下一个屏幕上，你将收到有关如何将现有代码放到网上的说明，如图 5.3 所示。

    '
