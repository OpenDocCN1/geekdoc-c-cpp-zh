    [content]\n# Learn by Example: A Web App from Scratch\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_127_0.png)\n\
    \nThe guestbook app will be accessible in our development environment (see Chapter\
    \ 2) via http://guestbook.app.\n\nNote that .app is a valid TLD for Chapter 1\
    \ for an explanation of top-level domains, so be careful with adding new etc/hosts\
    \ entries under it; you might block access to real .app websites if they start\
    \ appearing. To be completely safe, use any of the following suffixes instead:\
    \ .test, .example, .localhost and .invalid.\n\n# Setting Up the Environment\n\n\
    Let’s set up our environment (this process is described in detail in Chapter 4).\
    \ Before proceeding, make sure you have installed the following:\n\n- Vagrant,\
    \ from https://www.vagrant.com/\n- VirtualBox, from https://www.virtualbox.org/\n\
    - Git, from http://git-scm.com/downloads\n\n# Jump Start PHP Environment\n\nIf\
    \ you followed along through all the previous chapters, particularly Chapter 4,\
    \ you're all set.\n\nTo set up the environment:\n\n- 1. Add the line 192.168.10.10\
    \ guestbook.app to our /etc/hosts file. See the Chapter 3 for details on how and\
    \ why to do this.\n\n- 2. If your operating system is Windows, open the Git Bash\
    \ program, which is available after installing Git tools from the link at the\
    \ start of the section. Otherwise, open the Terminal on Linux or OS X.\n\n- 3.\
    \ Change directory (by typing cd) into the folder where you'd like to develop\
    \ your project. A good place is your user's home folder: cd ~..\n\n- 4. Enter\
    \ the following commands:\n\n```\ngit clone https://github.com/swader/homestead_improved\
    \ hi_guestapp\ncd hi_guestapp\nbin/folderfix.sh\nmkdir -p guestbook/public\nmkdir\
    \ guestbook/storage\ntouch guestbook/public/index.php\n```\n\nThe last three commands\
    \ create the folders your application will need, and an empty index.php file into\
    \ which we'll put some PHP code.\n\n- 5. Open the file Homestead.yaml in that\
    \ folder and add a new sites pairing so that the final version looks like:\n\n\
    ```\nsites:\n  map: homestead.app\n  to: /home/vagrant/Code/Project/public\n \
    \ map: guestbook.app\n  to: /home/vagrant/Code/guestbook/public\n```\n\n- 6. After\
    \ saving the file, in the terminal run:\n\n```\nvagrant up; vagrant ssh\n```\n\
    \n# Learn by Example: A Web App from Scratch\n\nNotice how we're using ; between\
    \ commands? This chains them so that they are executed one after the other without\
    \ us having to wait for one's output to proceed with the other.\n\nFinally, we\
    \ need to open the folder guestbook in our code editor of choice. Figure 8.2 shows\
    \ it in PhpStorm.¹\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_129_0.png)\n\n\
    Figure 8.2. Our project open in PhpStorm\n\nIt's completely empty right now, but\
    \ that's about to change.\n\n# Bootstrapping the App\n\nBootstrapping means establishing\
    \ a setup for future work. In the context of web app development, it means laying\
    \ the foundation for development and getting the common preparatory steps out\
    \ of the way.\n\nBefore we do this, there are some terms we need to cover.\n\n\
    > ¹ https://www.jetbrains.com/phpstorm/\n\n# Testing\n\nIn programming, there\
    \ is a concept known as **testing**. While testing is outside the scope of this\
    \ book (see the end of the chapter for links to further reading), I'll explain\
    \ it briefly.\n\nWhenever you make a change in one of your apps, you usually refresh\
    \ the app in the browser to ensure the changes have been applied. This called\
    \ **manual testing**.\n\nThere are tools that automate this process. By writing\
    \ a specific set of instructions (tests), your application can *test itself* after\
    \ every change. Writing these instructions can be complicated and time-consuming,\
    \ but as an application grows, the time invested in writing tests pays off several\
    \ times over. No longer does one need to, for example, click every link of a web\
    \ page to make sure it works; the tests do this automatically, and outside of\
    \ the traditional browser (with programs that simulate a browser behind the scenes).\
    \ This makes them much faster than humans and less error-prone (due to removing\
    \ the human element).\n\nWe'll skip automatic testing in this chapter, as it would\
    \ be too complex to explain (again, see the links at the end of the chapter for\
    \ resources on testing). In general, no application—regardless of complexity—should\
    \ be without tests if its purpose is to live longer than a few days or a few visitors\
    \ (our demo app does not have these constraints).\n\nOur first manual test will\
    \ be making sure we receive a blank page if we go to the http://guestbook.app\
    \ URL in the browser, as shown in Figure 8.3.\n\n# Learn by Example: A Web App\
    \ from Scratch 109\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_131_0.png)\n\n\
    Figure 8.3. No news is good news\n\n# Frameworks versus Packages\n\nPackage type\
    \ tells Composer that this is a project rather than a reusable package. This has\
    \ little to effect on our app per se. License is rather well-explained on the\
    \ GitHub blog...\n\nMinimum stability allows the developer to lower the safety\
    \ barrier for the stability of packages. For example, a package we want to use\
    \ might be without a stable version; it might be in beta mode. To be able to install\
    \ it, we'd have to set beta under that option. In this case, we're just hitting\
    \ Enter to leave it at the default.\n\n...and you can find the rest of the available\
    \ options in composer.json (which the command init generated) in Composer's documentation.\n\
    \nThe final two questions ask us to define which packages we'll need. We don't\
    \ know yet, so we'll skip them.\n"
