    # Pulling With Git


    At last! We''re ready to deploy our app!


    ```

    cd /var/www

    git clone https://github.com/spbooks/phpenv1-example guestbook

    cd guestbook

    composer install --no-dev -o

    ```


    Notice how we used --dev to prevent installing the packages of this size, and
    make the installation faster. On an application of this size, it hardly matters,
    but on bigger projects, the difference is obvious. We also used the -o which is
    short for --optimize-autoloader and builds a classmap - a special file which turns
    namespace-to-classes combinations (from the autoload section of composer.json)
    into a fixed pre-calculated array, which in most cases significantly speeds up
    autoloading. Read more about these command line options in the docs².


    Seeing as we did all with the root account (we logged in with root@IP-ADDRESS,
    remember?), our application is "owned" by the root user because we created it.
    This is okay in most cases, but not when PHP needs to do some reading and writing
    on the hard data; PHP is running as a separate user, and a user cannot modify
    a super-user''s (root''s) files. As a final step, we need to modify permissions:


    ```

    d /var/www/guestbook

    sudo chmod -R :www-data .\nsudo chmod -R 775 storage

    ```


    The chmod command gives ownership of the folder to the www-data group of users:
    a special subset of user accounts on the charge of serving web pages (PHP and
    Nginx belong to this group). The chmod option gives writing permissions on


    > ⁰ https://getcomposer.org/doc/03-cli.md'
