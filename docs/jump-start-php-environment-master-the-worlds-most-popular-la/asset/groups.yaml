    # 配置准备 (Provisioning)


    **配置器**（provisioner）是一种用于在机器上（无论是否已有机器）自动安装先决软件的工具。配置器也经常用于实时服务器，以满足待部署应用程序的要求。一些流行的配置器包括
    Ansible、Puppet² 和 Chef³。配置器接受一个*配方*（recipe），这是一份为应用程序准备环境的步骤列表。


    例如，假设我们要构建一个 PHP 应用程序，可能会让配置器在一个基础的 Vagrant 节点上为我们执行以下操作：


    - 安装 Git

    - 安装 PHP

    - 安装 PHP 扩展

    - 安装 MySQL

    - 设置默认的 MySQL 用户名和密码

    - 下载示例数据库数据并将其导入 MySQL


    手动完成所有操作既枯燥又容易出错。配置器具有强大的能力，可以为我们处理不同操作系统之间的差异；它们可以在我们的虚拟机、实时服务器、预发布服务器等上运行。它们总是执行相同的操作并产生相同的结果：运行应用程序的任务将由我们来妥善处理。


    Vagrant 与各种配置器紧密集成，并利用它们来设置我们指示其设置的环境。因此，在启动 Vagrant 节点时，首先启动虚拟机，然后是指定的配置器。此时不需要了解配置器，但在本章末尾将会有一些关于它们的更多资源链接。在本章的实验中，我们将使用一个预先配置好的
    Vagrantfile 以及一个已经预先配置好的配置脚本，以保持简单简单并对新手友好。


    # 快速启动 PHP 环境


    另一种简易配置的方法是使用各种可用的图形用户界面（GUI）来构建你自己的 Vagrantfile（以及配置脚本），例如如图 4.4 所示，使用 PuPHPet⁴。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_72_0.png)


    图 4.4. 使用 PuPHPet 进行配置准备


    PuPHPet（使用 Puppet 作为配置器）和 Phansible⁵（使用更简单的 Ansible 作为配置器）是设置虚拟机的 GUI 良好示例。这些
    GUI 将允许你通过分步过程，选择你为环境所需的所有软件和配置值，并最终生成一个 Vagrantfile，通过它你可以轻松启动所需的环境。如果你想看这示例，SitePoint⁶
    上有一篇关于 PHPet 的精彩文章。


