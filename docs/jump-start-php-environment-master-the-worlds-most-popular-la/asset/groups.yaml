    # 第6 章


    ## 部署与托管


    既然版本控制已经解决了，现在是时候考虑部署和托管了。


    **部署（Deployment）**，正如你可能从之前的章节中学到的那样，是指将你在本地开发的应用程序发布到网上供人们使用的行为。部署后的应用程序并不意味着它是公开的——例如，它可以是公司内部的内网应用；这意味着它可以被其目标受众使用。


    然而，一个应用程序如果没有被**托管（hosted）**是无法部署的；需要一台服务器计算机作为它的家。在本章中，我们将更详细讨论这两个术语，并列出每种方法的方法。我们还将涵盖常见方法的优缺点，并定义一些你在整个
    Web 开发生涯中会经常听到的术。


    即使你对部署和托管的某些方面了熟悉，也建议阅读这一章，因为它包含了关于应该避免什么和选择什么的最新信息。


    # 托管


    我们将先解释托管，因为在搬进去之前，知道如何选择一个家是很重要的。


    你将反复遇到的三种主要类型的托管是：共享托管、云托管和（虚拟）私有托管。我稍后会进一步解释括号中的“虚拟”。


    ## 共享托管


    当托管公司拥有一台服务器（可以由单台机器组成，也可以作为一个整体运行）时，他们会为该服务器上的每个客户创建一个单独的文件夹和账户；这被称为共享托管。每个客户被分配到服务器处理能力的一部分、总内存（RAM）的一部分以及一部分硬盘空间。这部分资源就可以作为你部署的应用程序的家。公司可能会设置几台服务器，以防某一台没有空间容纳新用户。这在理论上听起来很棒，但在实践中有很多问题。


    ## 共享托管糟糕


    由于缺乏更好的（即更便宜和/或更简单）的选择，在很长一段时间内，共享托管是许多人来说唯一可行的方法。这种广泛的使用导致了它在托管市场的主导地位，它纯粹是因为这种最初的惯性而保持流行。


    共享托管很糟糕，有几个原因：


    - **安全风险：** 许多流行的内容管理系统如 WordPress、Drupal、Joomla 等都要求用户在某些文件夹上开启写入所有访问模式，以便他们可以将文件放置其中。通过这样做，许多用户在与其他客户共享硬盘时，错误地自愿地允许了对其网站文件的访问。这种所谓的“777
    问题”（777 是 Linux 代码中表示“允许所有人对此文件或此文件夹执行任何操作”的代码）是一个巨大的安全风险。此外，在共享托管主机上使用内容管理系统时，你面临着版本过的风险。一个网站的懒惰和不愿更新同一台服务器上安装的另一个
    CMS 实例可能会导致你的网站被黑客攻击，因为它可能成为攻击者获取整个服务器访问权的网关！


    - **流量过载：** 你依赖他人的能力和流量。如果给定服务器上的某个网站代码写得糟糕，使用了过多的 CPU 周期或消耗了大量内存，同一台服务器上的其他应用程序可能会因此受到影响；因为所有应用程序都共享相同的硬件——在共享托管环境中这种硬件是非常有限的——用户的过量需求可能对你自己的应用程序产生不利。对于大量流量的良好代码也是如此：如果另一个网站接收了太多流量，服务器可能会过载并关闭，从而导致你的网站也掉线。


    - **限制：** 许多共享托管公司承诺无限制带宽和资源，但这几乎从不是事实¹。没有任何所谓的“无限”任何东西：只要你的网站成功突破了最初约定的限制（无论是常规
    CPU 使用、硬盘空间还是带宽），你就会发现“无限”真正意味着什么。查看来自 WhoHostingThis.com 的这篇文章，指出了共享托管的陷阱，并提供了一个关于由于在无限计划上使用过多资源而被断开连接的警告故事。


    - **声誉：** 当你与其他客户在同一台服务器上时，你们共享一个 IP 地址。其他人在同一台服务器上进行的任何非法活动都可能对你产生不良影响。想象一个客户从你使用的共享托管服务器发送了数百万封垃圾邮件。这些邮件随后会被流行的垃圾邮件搜索引擎捕获，该
    IP 地址被标记为经常骚扰人们。突然，你自己的应用程序发送的所有邮件在人们的收件箱中也被标记为垃圾邮件，仅仅是因为该 IP 地址与在线垃圾邮件发送者相同。


    这些是围绕共享托管的一些主要问题。但有一个问题比上述所有其他问题都更重要：共享托管限制了你的发展。


    > ¹ http://myboringchannel.com/the-truth-about-web-hosting/

    > ² http://www.whohostingthis.com/blog/2010/08/09/the-cautionary-tale-of-the-frogsants-network-and-unlimited-hosting/


    # 入启动 PHP 环境


    ## 共享托管限制了你的发展


    使用共享托管时，你通常会获得一个简化的用户界面，如 cPanel（如图 6.1 所示），通过它来配置你网站的细微方面。然而，没有服务器访问权限来安装自定义扩展、像你升级本地开发服务器那样升级你的应用程序等。你本质上被锁定在托管公司已安装的内容中，没有办法更改，因为它会影响数百个——可能是数千个——其他用户。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_100_0.png)


    > 图 6.1。cPanel 是一种常见的共享托管控制面板


    这对于初级用户来说可能是理想的，但它提供了太多的抽象。换句话说，它让用户远离自定义配置和服务器设置的细节——这在你的 Web 开发生涯中是绝对关重要的。


    通过坚持这种方法，你是在为自己做出短期利益的长期损害。总会有那么一天，你必须部署到真实的非共享服务器上，或者你需要手动更新软件。


    但应该在某些情况下简单是好的，对吧？


    ## 共享托管适用于有限情况


    对于某些项目，共享托管是天赐。在严肃的 Web 开发职业中，这些用例很少见，但并非不可能：


    - 自定义电子邮件：在共享主机上，设置电子邮件地址极其简单。曾梦想过拥有像 firstname@lastname.com 的邮箱地址吗？想要在名片上使用？使用共享托管这很容易。你购买域名（lastname.com），进入你的共享托管控制面板，并根据指令设置。大多数在24
    小时内就有个人电子邮件账户。


    - 小代码示例：需要的资源少的示例很容易托管在共享托管服务器上。小型作品集脚本和项目是此目的；例如教程中的代码演示、客户网站的示例代码等。任何需要支持大量带宽的内容都可以运行，而且简历中的在线演示总是效果最好的！


    - 遗完即忘的项目：最后，是为真正低维护需求客户创建的简单网站，如邻居、你奶奶、肉铺店或当地商店。也许你积极参与志愿者工作，并为他们组织会议而创建一个网站。那种网站通常是短暂的或很少更新（也称为遗完即忘项目），在共享托管服务器上有一个舒适的家。此类项目的低资源需求确保了它们在很长一段时间内的兼容性。每月
    5 美元的成本（目前共享托管服务器的平均价格），你可以安置多个客户。


    # 云托管


    云托管是许多计算机共生地连接，使它们运行并看起来像一个。


    在图 6.2 中，玻璃箱中的水平单元是最小化计算机：去掉了所有不必要部件的硬件单元，以便尽可能在电源、空间和散热方面保持高效。连接在一起，它们形成了一个巨大的整体，


