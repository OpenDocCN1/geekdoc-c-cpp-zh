- md: '

    ## 84 Jump Start PHP Environment


    duction parity, which is not as easy to achieve with cloud hosting, and impossible
    to achieve with shared hosting.


    I always recommend VPS hosting to new developers because it''s the perfect middle
    ground between cloud hosting''s power and shared hosting''s ease of use, once
    a person is comfortable enough with the terminal.


    ## Others


    There are, of course, countless types of hosting as well—each matching specific
    use cases.


    For example, Nitrous.IO⁵ Codenvy⁶ Cloud9⁷ and Koding⁸ are all cloud-based development
    environments (Cloud IDEs) with built-in hosting. Opening an account with them
    will give you a web interface in which to edit your code—much like in an IDE as
    PhpStorm—and at the same time place to automatically host and run the code you
    write. These services can be costly for apps that go any measure beyond basic,
    but are extremely practical for people on the go—particularly netbook users who
    lack the computing power to run VMs, but are always online and prefer to travel
    light.


    Feel free to create an account with your name and test out their test sample applications.
    Nothing can go wrong, and there is no need to be code-literate to understand what''s
    going on.


    I''ve summarized my views on the pros and cons of various hosting options below.


    | Shared Hosting | Cloud Hosting | (V)PS | Cloud IDEs |

    | --- | --- | --- | --- |

    | Affordability | ★★★★★ | ★★★ | ★★★★ ★ | ★★★ |

    | Reliability | ★★★★★ | ★★★★★ | ★★★★★★ | ★★★★★ |

    | Ease of use | ★★★★★ | ★★ | ★★★★☆ | ★★★★★ |


    ⁵ https://www.nitrous.io/

    ⁶ https://codenvy.com/

    ⁷ https://c9.io/

    ⁸ https://koding.com/


    | | Shared Hosting | Cloud Hosting (V)PS | Cloud IDEs |

    | --- | --- | --- | --- | --- |

    | Customizability | ★ | ★ | ★★★★★ | ★ |

    | Security | ★★ | ★★★★★ | ★★★ | ★★★★★ |

    | Performance | ★ | ★★★★★ | ★★★★ | ★★★ |

    | Hardware limits | ★ | ★★★★★ | ★★★ | ★ |


    ## Deployment


    Deployment is the act of sending a ready application to a live server so that
    it can be accessed by its target audience. It also includes pushing updates to
    an application online when a new feature is added or a bug is fixed.


    There are two main types of deployment: manual and automatic.


    ## Manual


    Manual deployment involves actively recognizing the application is at a stage
    when it''s usable by the target audience, or at a stage matching the project specification—a
    document outlining the entire project''s development process.


    Once deemed ready, the developer takes one of several approaches to deploy the
    application:


    - FTP: in the ancient days of Web 1.0, File Transfer Protocol (FTP) was a way
    to transfer files (duh!) from one server to another. This approach is usually
    only seen in severely outdated systems and servers such as universities and schools,
    shared hosting. Uploading files via FTP requires you to have an FTP client installed
    on your computer as FileZilla or Cyberduck. You also need the credentials of the
    server—usually the server name, a username, and a password. If an application
    is already deployed and an updated one being deployed on top, the older one is
    usually overwritten, which opens the doors to a whole of possible bugs. In regards
    to deployment, there are better approaches and FTP should be avoided.


    ⁹ https://filezilla-project.org/

    ¹⁰ https://cyberduck.io/?l=en


    - Rsync involves using a tool called rsync to synchronize the contents of two
    folders. Rsync works via SSH (Secure Shell), which essentially means you can use
    it through the terminal without having to install any additional programs. Rsync
    is better than FTP because SSH is more secure than FTP—unless you''re using SCP
    (Secure Copy Protocol) in FTP (however, SCP in FTP is still suboptimal as many
    things can go wrong, as files going or getting accidentally deleted, and there''s
    little to no way to quickly undo these mistakes).


    - Pulling from a repository: This method uses the Git version control system (Chapter
    5) to push the changes live. Two approaches can be taken: a push can be made so
