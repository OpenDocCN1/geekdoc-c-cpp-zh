    # Server Configuration


    To configure Nginx, we can just grab the configuration from our VM! Open a new
    terminal tab or window on the host machine, enter the Vagrant VM we developed
    the app with vagrant ssh as usual, and execute:


    ```

    cp /etc/nginx/sites-available/guestbook.app -/Code/guestbook-nginx.txt

    ```


    This will make the server configuration immediately available in the VM''s main
    folder. Open it, select its contents (but be careful to ignore or delete the bottom
    lines — those mentioning SSL), copy the selection to the clipboard, and then while
    connected to the droplet) (switch back to the window / terminal connected to it)
    run:


    ```

    vim /etc/nginx/sites-available/guestbook.app

    ```


    Press the i key to enter insert mode, and paste the contents in there with Ctrl
    + V (CMD + V on a Mac). Then, edit the following lines:


    +   - change the value of server_name from a name (guestbook.app) to the IP of
    the droplet

    - change the value of root to /var/www/guestbook/public


    The var/www/ folder is the location that''s typically used to host applications
    on Linux. Exit insert mode with Esc, then exit the file by typing :x and pressing
    Enter.


    Then, reboot Nginx with:


    ```

    sudo service nginx restart

    ```


    # Encountering Issues


    If you run into problems a fully white screen, or a cryptic error, check the error
    logs by running tail -f /var/log/nginx/guestbook.app-error.log. Tail outputs the
    "tail" of a file (its last 10 lines) and -f it tells it to "watch this file'
