    # Jump Start PHP Environment


    complex or too restrictive. Still, when contracts are at stake, being able to
    focus on the programming business logic in a matter of hours rather than days
    can make or break a job.


    In our case, while a framework would get *some* hurdles out of the way, it would
    introduce *more*. Frameworks are complex beasts consisting of hundreds of classes,
    and we''re yet to even touch on object-oriented programming or design patterns—broad
    disciplines essential to taming a framework (see the links in the section called
    “For Those Who Want More”). Therefore, we’ll be doing old-school and pulling in
    the packages we need, as we need them, with Composer, which we saw in Chapter
    7.


    To begin bootstrapping our app, we''ll first execute:


    ```

    cd ~/Code/guestbook

    composer init

    ```


    This command is generally used for bootstrapping new packages (as in when we intend
    to develop a reusable package and host it on Packagist—discussed in Chapter 7).
    It is, however, useful for bootstrapping a new app as well, as it helps the developer
    define metadata about the project. Once executed, Composer will be answered like
    so:


    ```

    vagrant@homestead:~/Code/guestbook$ composer init


    Welcome to the Composer config generator

    ```


