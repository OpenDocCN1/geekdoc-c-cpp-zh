    # Homestead Improved: Explanation


    When we visited the URL https://github.com/Swader/homestead_improved, we went
    to GitHub, a coding social network for open-source projects. Homestead is a preconfigured
    virtual machine running the Ubuntu operating system with critical security patches
    installed and some commonly used software for PHP development: that is, a new
    version of PHP and some databases, among others. Homestead Improved is a slightly
    enhanced version of Homestead that makes it even easier to get started with some
    files. Every project on GitHub is a repository, a set of files.


    The Homestead Improved repository contains all files necessary to run a Vagrant
    environment, specifically the Vagrantfile. This Vagrantfile loads the contents
    of all the other important files in the repository and uses the combination of
    these files to set up (provision) your environment. This is what the vagrant up
    command was for: reading the Vagrantfile and following instructions.


    When we ran the folder command, we executed a shell script, which is a tiny program
    whose sole purpose is to establish the folder from which it''s being run and set
    that folder as shared with the VM. Remember that VMs are isolated environments
    unaware of the host machine they''re running on? If they''re completely unconnected,
    how can we use our host machine''s applications to write code that runs in the
    VMs? The answer is sharing. By mapping a specific location on our host machine
    (the current folder) to a specific location within the VM (the Code folder), we
    tell Vagrant to copy every file we create or change in this folder into the designated
    location inside the VM. This creates a weak link between the host and the virtual
    machine, enabling files to be shared; this, in turn, allows us to use the'
