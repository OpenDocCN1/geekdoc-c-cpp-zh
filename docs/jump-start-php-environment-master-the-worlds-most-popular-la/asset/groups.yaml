    # Virtual Machines Explained


    Before we use virtual machines, or VMs, I''ll explain what they are in general,
    and in the context of web development (which is not the same!).


    # What are VMs?


    Your computer is a machine. It contains hardware such as the CPU, the GPU, some
    RAM, a hard drive, and so on. You need all this to run your operating system and
    the apps installed into it. A **virtual machine** is a special type of application
    that reserves a part of your computer and pretends it''s a real machine on its
    own. For example, a virtual machine might reserve a part of your CPU and 2GB of
    RAM from your main machine, along with 20GB of hard-drive space. These resources
    are then brought together into a whole, seen in Figure 4.1, which can act as a
    computer on its own. It can have its own operating system independent from the
    main machine''s OS (the *host*) with its own applications installed.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_66_0.png)


    Figure 4.1. Visualizing a virtual machine'
  - '[PAGE 67]


    # Virtual Machines 45


    The operating systems—in fact, the entire environments of the different machines
    (the host and the virtual machine running on the host)—are entirely independent
    and, indeed, unaware of each other. The host knows it has fewer resources at its
    disposal, but is unconcerned. The virtual machine knows it has some resources
    at its disposal, but has no idea they''re not real; it *thinks* they''re actual
    hardware parts.


    A virtual machine is, quite literally, a computer in a computer. Some people use
    them for running video games on operating systems without native support for them;
    for example, running Windows games on a Linux system. Security companies use them
    as **sandboxes**, environments in which they can let a loose virus or potentially
    malicious piece of code without worrying about the consequences: if the virtual
    machine gets damaged, it''s rebuilt with two simple commands (it''s virtual, after
    all!). Enterprise companies use them as a way to avoiding their software. Rather
    than spend billions on a rewrite because their internal application depends on
    Windows XP and the newest version is Windows 10, they''ll spend much less on buying
    Windows licenses and running Windows XP machines inside their Windows 10 hosts,
    enabling them to live longer while enjoying the increased security of a newer
    operating system.


    In development, a virtual machine is used as an isolated environment for your
    application. You can install different versions of PHP and MySQL in it, and you
    can break anything as a virtual machine that can be reset into its original state
    easily. This is what makes virtual machines very appealing, not only for testing
    code on different versions of different operating systems, but also for development/production
    parity (discussed in the Chapter 3): it allows you to configure a virtual machine
    to resemble a live server as closely as possible, thus being able to test the
    code as if it was online, minimizing errors.


    # Getting to Know VirtualBox and Vagrant


    VirtualBox, one of the pieces of software we installed in the introduction to
    this chapter, is used to *build* these virtual machines. It takes the resources
    from the host, and gives them to the virtual machine. It is what boots up the
    virtual machine (they need booting up just like regular machines), helping it
    live out its illusion of reality. VirtualBox has many features including, but
    not limited to, the sharing of graphics cards (enabling a virtual display within
    your display), inputs (keyboards, mice, and so on), and sound (playing sound from
    the virtual machine on the host''s speakers). Figure 4.2 depicts VirtualBox in
    action.'
