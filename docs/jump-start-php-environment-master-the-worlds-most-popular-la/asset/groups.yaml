    毫无例外，所有的文本编辑器在良好的 IDE 面前都显得黯失色。IDE 是一个强大的程序——它就像是打了加强剂的文本编辑器，包含了对你指定代码语言的深度引用，通常通过提供建议和着色文本使其更具可读性来帮助你，此外还有：\n\
    \n- 帮助你的代码自动应用编码标准（我们将在本章后面讨论编码标准）\n- 允许你上下或左右移动代码，并轻松地复制它，而无需剪切粘贴\n- 提供编码模板，以便你避免重复编写相同的命令\n\
