    - Nginx 将其返回给客户端


    总结一下：PHP 是服务器的答案生成器，这样它知道对浏览器的问题提供什么答案。这样一来，服务器不需要知道答案，它知道 PHP 知道并询问它，然后将响应转发给浏览器。想象一个“Hello
    你的名字”页面；不可能为每个现有名称生成页面，但我们可以让 PHP 在一个页面上请求一个名称，然后在另一个页面上生成提供给服务器的答案。


    这里需要理解的重点是客户端与服务器、以及服务器与服务器端语言之间的通信流。整个通信过程对应了图 1.2 漫画中的第五和第六帧。在服务器程序与 PHP 程序对话的部分，将完全发生在第六帧中。


    # 使用服务器端语言生成答案


    我们“兔子洞”最后也是最深的一层是服务器程序与服务器端语言之间的实际对话——在我们的案例（以及未来的所有案例中）是 PHP。我们在上一个章节在某种程度上涵盖了这一点，现在让我们来看另一个找不到答案的情况示例。


    假设客户端向服务器提出了以下问题：“你能获取你在 `example.com/user/id/54` 存储的任何内容吗？”接下来发生的情况如下：


    1. 服务器检查 `example.com/user/id/54` 是否有已的文件。如果没有，它被配置为询问 PHP。

    2. 服务器询问 PHP：“你能找到 `user/id/54` 吗？”

    3. PHP 激活并搜索其路由，但没有发现任何内容。它向服务器返回一个“404 错误”（如图 1.1 所示）。


    正如你可能知道的，404 是 Web 技术中常见的代码，意味着你寻找的内容无法找到。在你的职业阶段，不需要知道所有的代码。


    4. 服务器接收到 404 消息并想：“嗯，PHP 锁定了。好吧，它什么都没有，最好给客户端返回一个页面。”浏览器是“哎呀，你尝试了错误的链接！”


    但是，如果路由中没有任何内容呢？例如，当客户端请求时：


    1. 服务器检查 `user/id/54` 是否有已的文件。如果没有，它被配置为询问 PHP。

    2. 服务器询问 PHP：“你能找到... `user/id/54` 吗？”

    3. PHP 激活并搜索其路由，但没有发现任何内容。它向服务器返回一个“404 页面未找到”错误（如图 1.1 所示）。


    正如你知道的，404 是 Web 技术中常见的代码，意味着你寻找的内容无法找到。在你的职业阶段，不需要知道所有的代码。


    4. 服务器接收到 404 消息并想：“嗯，PHP 锁定了。好吧，它什么都没有，最好给客户端返回一个页面。”浏览器是“哎呀，你尝试了错误的链接！”


    我希望这一章节理清了这些概念，并帮助你了解自己在 PHP 编程中所处的位置。在接下来的章节中，你将找到关于 Web 请求和 DNS 服务器的更多信息。


    # 深入了解 DNS 服务器（更多）


    如前所述，互联网上的每个域名（例如 example.com）都绑定到一个特定的 IP 地址（例如 93.184.216.34）。IP 地址是识别给定服务器的数字组。换句话说，IP
    地址告诉浏览器如何在互联网上找到它寻找的计算机（服务器）。DNS 服务器（也称为名称服务器）知道哪些 IP 地址匹配哪些域名，并告诉浏览器去哪里。


    当查找匹配域名的 IP 地址时，浏览器首先检查其缓存——已访问域名列表。每个浏览器都会维护此列表并定期刷新。如果它在自己的缓存中找到了域名-IP 组合，加载速度会更快，因为不需要询问
    DNS 服务器。如果缓存中没有，浏览器会请求一个解析程序（内置在操作系统中）来检查 hosts 文件。hosts 文件是用户可以实际定义网站映射到哪个 IP
    地址的地方。（我们将在后面的章节中学习如何使用此文件。）如果没有找到需要的信息，将检查路由器的 DNS 缓存（路由器通常有一个），如果在那里也没有找到，则询问
    ISP 的 DNS 服务器。


    > ³ http://www.creativebloq.com/web-design/best-404-pages-812505


