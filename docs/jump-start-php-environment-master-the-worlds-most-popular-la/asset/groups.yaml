    # What is Composer?


    Composer¹ is a package manager for PHP. We already defined a package as a collection
    of classes. So what''s a package manager, then?


    A package manager is a tool that removes the human element from the process of
    finding and installing packages or programs into an environment. If you''re using
    OS X, for example, there is a package manager for the OS called Homebrew. Rather
    than scour the Web in search of an application such as MPlayer, a media player,
    one can use the terminal to run the command:


    ```

    brew install mplayer

    ```


    Like magic, the application will be installed and instantly available. On Linux
    operating systems, there are several package managers. A popular one is Aptitude
    and is used in a similar fashion:


    ```

    sudo apt-get install chrome

    ```


    This command installs the latest Chrome browser, just like that.


    Package managers make sure packages (an application is a package—it''s a set of
    files working together towards a singular purpose, be it media playback, web browsing,
    or something else entirely) are installed cleanly, quickly, and safely.


    Similarly, in the context of programming languages (such as PHP), a package manager
    is used to retrieve, install, update and uninstall packages. While the grunt work
    of setting up autoloading for classes without Composer is easy enough. Composer
    removes the process completely. It automates the manual process of finding a package
    online, downloading it, unzipping, putting it into your project''s folder, including
    it, configuring it, and so on.


    Composer ties into Packagist² the de facto online directory of packages from users.
    Let''s explain what happens when you install a package with Composer.'
