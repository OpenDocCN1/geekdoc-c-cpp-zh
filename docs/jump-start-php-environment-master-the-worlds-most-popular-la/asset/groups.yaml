    - Rsync：涉及使用名为 rsync 的工具来同步两个文件夹的内容。Rsync 通过 SSH（安全外壳）工作，这意味着你可以通过终端使用它，而无需安装任何额外程序。Rsync
    比 FTP 好，因为 SSH 比 FTP 更安全——除非你在 FTP 中使用 SCP（安全复制协议）（然而，FTP 中的 SCP 仍然不是优解，因为可能会发生很多错误，例如文件被意外删除或获取，而且几乎没有办法快速撤销这些错误）。


    - 从仓库拉取（Pull）：这种方法使用 Git 版本控制系统（第 5 章）将更改推上线。可以采取两种方法：进行推送（push）使代码进入远程服务器。这是来自开发环境——本地服务器。更常见的是进行拉取（pull）。拉取是通过实时服务器——代码最终应该所在的机器。从开发机器拉取代码通常是不可行的，且通常不被鼓励，因为为你的开发机器开放外部访问存在安全风险。相反，首先推送到像
    GitHub 这样的中央仓库，然后由实时服务器进行拉取。这种方法最常见，因为它提供了由于版本控制带来的无限撤销步骤的安全性和神圣性，并消除了多人共同编写同一代码库并尝试同时上传而可能发生的任何覆盖。


    这些远不是手动部署的唯一手段，但它们是最流行的。不过，它们有些繁琐，往往会占用本可以花在其他地方的时间和资源。在软件开发中，通用规则是尽可能自动化任何内容。这让我们引入了……


