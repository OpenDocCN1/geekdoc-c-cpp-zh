    将手机组装的类比进一步延伸：被测试的电池可能需要单独的充电器附件，或者屏幕可能需要使用带有合成手指的机械臂进行测试，以确保屏幕的触摸灵敏度正常。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_53_0.png)


    所有这些插件仅在开发期间存在。当从开发环境转换为生产环境（也称为*部署*）时，这些插件会被移除。对于我们的应用来说，这意味着前述的编译/构建步骤：各种 CSS
    和 JavaScript 文件被合并并压缩，以减小网站的大小，使其在人们访问时看起来速度更快；单元测试被忽略并留在了开发环境中；并且会发生各种其他优化（在章的后半部分将介绍）——这一切的目的是为了让最终产品在就绪时最大地发挥其吸引力和潜力。


    ## 主机与虚拟主机


    当你在自己的电脑上进行开发时，无法访问 http://mysite.com  URL 并期望看到你的网站；毕竟，你的网站尚未上线——它不在互联网上。为了规避这个问题并像看到已上线一样看到我们的网站，我们通过定义虚拟主机来“伪造”互联网。


    简单来说，虚拟主机向安装在你电脑上的服务器程序提供了一条指令，例如：如果用户在浏览器中请求 http://mysite.com，则通过 PHP 运行 myfile.php
    文件并在浏览器中显示其输出。


    如你所见，这与普通的网站请求流程几乎完全相同。但是什么让浏览器向我们自己电脑的服务器程序请求 mysite.com 域名，而不是在互联网的名称服务器上查找呢？这就是
    hosts 文件（主机文件）。


    hosts 文件是每个操作系统中都存在的一个特殊文件。我们在第一章的“进阶”章节中简要提到过它。它包含一个域名及其相应 IP 地址的列表，这样你电脑上的任何浏览器都可以读取它并直接访问
    IP 地址，而无需与 DNS 通信以检查去哪里。在 Windows 上，该文件位于 C:\Windows\System32\drivers\etc\hosts，在
    Linux 和 Mac 机器上，它位于 /etc/hosts。如果你在这个文件中放入一个 IP-名称对，电脑就会遵循它。我们现在就可以尝试一下。别担心——不会出任何错。准备好了吗？


    **在 Windows 上，进入搜索字段，输入“notepad”，一旦它出现，右键点击并选择“以管理员身份运行”。** 系统随后会要求你确认。在打开的窗口中，选择**文件
    > 打开，并转到：我的电脑 > C > Windows System32 > drivers > etc**。在记事本窗口的右下角，你可能需要选择**所有文件**，这样
    hosts 文件就会显示出来。双击打开。


    在 Linux/Mac 机器上，通过搜索打开终端（Terminal）。**在 Linux 上，在终端中输入 sudo edit 来以管理员身份打开默认文本编辑器。**系统会要求你输入管理员密码。**在
    OS X 上，输入 sudo /Application/TextEdit.app/Contents/MacOS/TextEdit**，这将执行相同的任务。在其中任一编辑器编辑器中，转到**文件
    -> 打开**并进入目录 /etc 找到 hosts 文件。双击打开。


    一旦打开文件，请注意前几行：它们都以井号符号 (#) 开头。这表示它们是注释，对文件没有影响。它们的作用是向用户解释文件的目的，这些注释在 PHP 中也存在。


    现在，在所有注释行下方，添加以下行：


    ```

    208.117.229.217 bing.com

    ```


    保存文件并在浏览器中打开 http://bing.com。你刚刚成功地将所有指向微软搜索引擎 Bing 的请求重定向到了 Google！当然，我们不想保留这些更改；可以随时删除此内容，或在它前面加一个井号将其转换为注释，然后保存文件。你应该能够再次正常访问
    http://bing.com 了。


    通过这种方法，我们稍后会将浏览器对 http://mysite.com（这将是我们应用的示例域名）的请求重定向到我们自己电脑的服务器。这将使我们能够轻松测试网站的开发版本，而无需部署它。


    ## 测试环境与维护


    预发布环境（Staging environment）是一个独立的服务器（或多个服务器），包含生产环境的副本——也称为镜像。在较小的公司或项目中，通常会跳过预发布环境。它的设计旨在尽可能与生产环境相似，具有匹配的安装软件版本、相同的配置值等。预发布环境用于执行最终测试；例如，Facebook
    可能会重新设计首页，在部署到生产环境供所有用户查看之前，它会将其部署到预发布服务器，以便员工（专职非程序员，又称为质量保证团队）可以像经常使用那样测试一切。如果一切顺利，就会发生从预发布环境到生产环境的最终部署。


    预发布环境超出了本书的范围，但了解它是很有好的。在虚拟机和小型一次性项目的时代，预发布环境可能是不必要的，只有在较大的长期 Web 应用中才会发挥作用。


    还有维护模式（maintenance mode），这是一个我们在此语境下必须涵盖的术语。它是一个模式而不是环境，因为应用周围的环境没有改变——只有应用的状态改变了。它通常只是生产服务器上的一个开关，告诉尝试访问网站的人类似于“稍后回来，正在维护！”之的话。


    ## *AMP 整合包*的危害


    在开始 PHP 开发时，很容易下载并安装如 XAMPP¹、WAMP²、MAMP³ 或 EasyPHP⁴ 等包。这些名称中的 AMP 代表“Apache、MySQL
    和 PHP”。XAMPP 在末尾添加了另一个 P 代表 Perl 语言。第一个字母指的是操作系统：Windows、Linux、Mac OS X，或者在 XAMPP
    的情况下是跨平台的（意味着它适用于任何操作系统）。


    这些整合包包含了你在电脑上快速、方便地运行 PHP 应用所需的所有软件。只需点击一下，你就可以安装编写第一个 PHP 脚本所需的所有内容。那么，它的危害在哪里呢？


    - 你的电脑会被不必要的软件污染

    - 你学到的东西会比手动安装的少

    - 测试很困难

    - 如果你犯了错误，要么非常困难，要么无法回到之前的状态


    让我们一个一个地解决这些问题。


    ## 机器污染


    每当你安装如 AMP 堆栈之类的软件时，你的电脑就会被不必要的软件污染，即使你以后删除软件，通常也会留下痕迹——以 Windows 注册表项的形式存在。事实上，这在
