    # Learn by Example: A Web App from Scratch


    Shared hosts will often have cPanel as a mean of managing one''s server, not unlike
    the one shown in Figure 8.23.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_169_0.png)


    In this case, we''re using Hostgator but the procedure is almost identical on
    every shared host.


    To deploy an app, you''ll need a domain. Domains can be purchased (or rather,
    rented) on websites like http://namecheap.com or http://name.com, and can range
    from $2 per year to $2000 per year and more. I''ll pick one of my own domains
    that I''m not using for this: caimeo.com. Add your domain to your shared host
    via the Addon domains dialog:


    > ¹⁵ http://hostgator.com'
