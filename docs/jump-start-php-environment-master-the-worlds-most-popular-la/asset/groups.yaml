    # 快速上手 PHP 环境


    而且有数如牛云般的仓库。与其名称相反，云计算机系统其实非常接地气。它们只是由许多小计算机组合而成的巨型计算机。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_102_0.png)


    在这台表面上是单机的计算机上，运行着一种特殊的软件，它决定了环境的外观和感受；例如，让它看起来像我们正在处理单台 Linux 服务器。在某些方面，它类似于共享主机——但规模要大得多、得多（多得多的计算机）。


    云托管通常允许对服务器进行终端访问（使你能够手动配置某些项目），但通常带有 GUI 元素，用于生成访问代码、向你的云端应用程序中安装插件等。


    一些流行的云托管服务提供商有：


    - Google App Engine (https://cloud.google.com/appengine/docs)

    - Heroku (https://www.heroku.com/)

    - Amazon Web Services (https://aws.amazon.com/)

    - OpenShift (https://www.openshift.com/)

    - Azure (https://azure.microsoft.com/en-us/)


    # 部署与托管


    Fortrabbit (http://www.fortrabbit.com/)


    ... 还有很多。


    云托管有几种方法，但它们共同拥有的一个特征是：与共享主机不同，你并不依赖其他客户的善意和代码。*云*（即运行你应用程序的计算机网络）的资源专注于用于处理你的（以及他人的）代码，而硬盘存储部分（例如存储你用户上传的内容）通常保存在其他地方。这有两个优势：


    1. 云专门用于处理代码。它针对这一个目的进行了优化，因此你的应用程序总是很快的（当然，这取决于你代码的质量）。


    2. 没有资源限制。在云计算中，有如此多的机器像一台一样工作，因此如果需要，你的应用程序总有足够的资源。


    云托管遵循付费模式，根据你的应用程序使用服务器的时间进行收费。例如，价格可能是每个 CPU 单位 2 分钱，而单位可以以 15 分钟为增量。如果你的应用程序使用一个核心运行了
    24 小时，然后突然流量激增，又使用了四个核心运行了 24 小时，你最终一天要支付 1.9 美元，两天大约支付 7.7 美元，两天总计约 10 美元。如果你有大量流量，云托管更贵，但比共享主机更可靠，因为它很少、甚至从不崩溃。这意味着如果你的网站突然获得巨大的流量增长（可能它登上了新闻），云托管提供商可以为你的应用程序分配更多
    CPU 核心，并让它在额外时间内保持运行。这意味着业务不会中断，这可能抵消了那些托管成本！此外，如果你担心流量波动大到足以让你在财务上崩溃，大多数服务都允许你设置，例如，“只要每月费用低于
    2000 美元，就为我的应用程序提供更多动力”。


    云托管服务还提供免费层级，这意味着你可以免费使用它们，没有任何条件，想用多久多久——但资源有限且缺少功能（例如，没有自定义域名）。如果你想扩展，可以轻松升级你的网站已经托管的账户，它会立即变得更强大（也更贵）。


    云托管是如今的托管之选，特别是对于需要极高可靠性的知名应用程序，因为停机非常罕见。云托管也是 # 快速上手 PHP 环境 演示项目和作品集项目的绝佳选择，如果你多次利用免费层级——无需费用，你就可以在线拥有永久可用、公开访问的可运行代码。


    不过，这并非全是好玩。共享主机的某些缺点也出现在云托管中：


    - 供应商锁定：某些缺点在云托管中也存在：由于供应商锁定：这在云托管中可能发生，通常情况下，你安装的软件版本未打补丁。

    - 学习曲线：虽然云托管会限制你，但对于新手来说，学习曲线是一个问题：在云托管中，你只需要掌握服务器管理。


    - 熟悉度：如果你是从 Vagrant 虚拟机开始的，VPS 看起来会很熟悉。对于云托管，单台机器，虚拟机（正如我们之前章节中讨论的 Vagrant 虚拟机）是相似的。


    #（虚拟机）托管


    也称为专用托管，专用托管承诺提供一台机器，正如云托管一样，虚拟机。在专用托管中，拥有的物理机器非常贵，每月花费数千美元。


    '
