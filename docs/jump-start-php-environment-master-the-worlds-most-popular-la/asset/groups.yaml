- md: "\n# Jump Start PHP Environment\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_142_0.png)\n\
    \nFigure 8.11. Meidoo instance\n\nObviously, there's more beneath the surface,\
    \ but we don't concern ourselves with this. The database access works, and that's\
    \ all that matters right now.\n\n# Repo and First Push\n\nAt this point, we might\
    \ as well put our project into version control and upload it to GitHub. Not only\
    \ will this allow us to share our code with others, but also provide a layer of\
    \ protection from critical hardware failures.\n\nFirst, create a repo on GitHub\
    \ as in Chapter 5. In my case, that'll be https://github.com/spbooks/phpenvv1-example.\n\
    \nThen, in the root folder of our project (inside **guestbook**), run:\n\n```\n\
    git init\n```\n\nNext, set up a basic **.gitignore** file by downloading the contents\
    \ of http://bit.ly/spignore or running:\n\n```\ncurl http://bit.ly/spignore -L\
    \ > .gitignore\n```\n\nIf you're curious about the above, curl is a program we\
    \ use to retrieve the contents of a remote URL, like visiting web pages in the\
    \ terminal. Next comes the contents of which we want to retrieve, then the -L\
    \ flag tells curl to \"follow redirects\" in case the URL leads to another URL\
    \ rather than the end content, and then >.gitignore tells it \"write the output\
    \ you get into .gitignore\".\n\n# Learn by Example: A Web App from Scratch\n\n\
    Then, we need to add a remote — we need to let the local repo know where online\
    \ home is. In my case, the command is:\n\n```\ngit remote add origin git@github.com:spbooks/phpenenv1-example.git\n\
    ```\n\nAlter the URL accordingly.\n\n# Adding Vagrant-powered Projects to Version\
    \ Control\n\nThere are two schools of thought regarding committing Vagrant-powered\
    \ projects to version control. The first one, which matches the general consensus\
    \ and the official Vagrant docs, is that the Vagrant and all its accompanying\
    \ scripts should be committed to version control alongside your project's source\
    \ code. If you choose this path, first remove all traces of version control from\
    \ the Homestead Improved by running rm -rf .git inside, and then run git init\
    \ and everything we describe here from that folder. Proceed as usual — your team\
    \ now has your Vagrant setup. This is very handy for teams dealing commercial,\
    \ closed-source apps, because the setup can be dictated by the team.\n\nThe second\
    \ approach, the one I personally favor and that, for the sake of simplicity, we\
    \ will take in this chapter, committing only the source code of the project —\
    \ not its surroundings, such as the Vagrantfile, Homestead.yaml, etc. This makes\
    \ sure it's usable in anyone's development machine, even those who don't use Vagrant\
    \ or those who use a different box for running test projects. Here, this approach\
    \ is best for open source projects where you want to give contributors the freedom\
    \ to choose their own development environment. This approach is also a bit more\
    \ lightweight, in terms of filesize. Regardless of the approach you choose, you're\
    \ not wrong. Pick whatever feels better, or whatever the team you're working with\
    \ prefers.\n\nOn fresh VMs, Git — when used inside the VM — won't know who's using\
