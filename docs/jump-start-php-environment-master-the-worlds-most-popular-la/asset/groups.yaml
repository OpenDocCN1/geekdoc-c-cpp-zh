    ## Jump Start PHP Environment


    Another way of making sure you never have to add this to a project''s .gitignore
    file is by adding it to your global .gitignore. To see how, check out this handy
    guide from GitHub: https://github.com/articles/ignoring-files/


    With both our code and .gitignore file, we''ll need a readme file. A readme is
    the first file a GitHub repo displays to visitors, so it''s good to include some
    useful information about the author, the purpose of the code, ways to use it,
    ways to contribute to it, and so on. Make a README.md file in the phpenv folder
    via your IDE or the Terminal with touch README.md and give it some content such
    as:


    ```

