    We really like Bob, but our boss doesn’t, and asks us to change it back to “World.”
    We could make a change and commit, and be done with it. But in complex projects
    with many files, reverting by manually changing files back to the state they were
    in before will just fail to work. That’s why we have the reset command. To reset
    back to the previous commit, we need to find out the ID of that commit.


    We can do with this:


    ```

    git log

    ```


