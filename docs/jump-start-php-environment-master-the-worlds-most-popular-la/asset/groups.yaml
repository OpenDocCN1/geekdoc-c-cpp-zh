    # Chapter 2


    # # The Programming Environment


    There are two types of environment in the context of programming: the application
    environment, and the programming environment. We''ll be covering the application
    environment in a later chapter. This part of the book will talk about the **programming
    environment**, explaining IDEs (integrated development environments) and suggesting
    which ones to try, explaining coding standards and exploring some command line
    basics. In this chapter, it all becomes slightly technical.


    The programming environment includes—but is not limited to—the people you interact
    with, your operating system, your code editor or IDE (more on this later), your
    coding standards, and generally everything that helps or hinders your work during
    development. In other words, the programming environment is the *programmer''s
    environment.*.


    Skip this chapter if:


    +   - have a good IDE picked out and don''t intend to switch


    +   - know where to find help for any programming problems


    +   - are following coding standards already, whether you''re in a team or flying
    solo'
