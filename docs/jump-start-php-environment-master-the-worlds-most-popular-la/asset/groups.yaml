    # The Programming Environment 23


    On Windows, the program you can see in Figure 2.3 is called the command prompt
    or command line:


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_45_0.png)


    You run it by typing "cmd" or "command prompt" into the search box. In this, its
    most basic shape, it allows you to execute commands that run Windows programs,
    and either produce some written output (such as the echo command seen in Figure
    2.3 that produces the output "Hello!"), or open applications you''re already familiar
    with Notepad (if you type "notepad" into the command prompt and hit enter, the
    command line has alternative implementations such as Cmder¹⁰ (seen in Figure 2.4)
    or Console.¹¹ . They are prettier versions that essentially perform the same task,
    but make certain actions such as copy pasting, tabbing interfaces, and selecting
    text simpler.


    ¹⁰ http://bliker.github.io/cmder/

    ¹¹ http://sourceforge.net/projects/console/


    # Jump Start PHP Environment


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_46_0.png)


    On Mac and Linux machines, the program is called Terminal. To run it on either
    of these systems, open search and input “Terminal” and it should pop right up.
    It performs the same functions as the Windows Command Prompt, which has different
    commands. For example, the command to show the content of a directory (folder)
    in Windows is `dir` while on Apple and Linux is `ls`.


    Any developers worth their seat need to become friendly with the command line
    / terminal to maximize their potential. There are common workarounds to most command
    line commands and various shortcuts you can take at first, but it never takes
    too long before they become cumbersome and limiting instead of useful.


    The differences between the Windows and the non-Windows versions are unimportant
    because you''ll be using the Apple/Linux-specific commands, even on Windows. We''ll
    show you how in Chapter 4.


    # The Community


    As a final element of the programming environment, Let''s discuss asking for and
    providing help. The community around your programming language of choice is among
    the most important factors when learning to code. Being able to quickly and reliably
    obtain answers to problems you encounter can mean the difference between making
    or missing a deadline in a commercial project.


    # The Programming Environment 25


    No developer knows the entire list of their preferred programming language''s
    commands by heart. I''ve been programming in PHP for almost a decade, and I regularly
    look up even the basic commands. Real knowledge lies not in knowing the commands
    by heart, but in knowing where to find them.


    That said, here are some resources you should bookmark in your browser right now
    under a folder titled "PHP Help."


    # PHP Mentoring


    PHP Mentoring¹² aims to assist people in finding mentors and disciples. If you''re
    an expert, you can mentor newbies, and if you''re a beginner, you can find a mentor.
    A mentor will tell you about best practices, analyze your code and provide feedback,
    point out your mistakes, and set you on the right path whenever you stray. There
    are no fees associated with this; it''s a purely voluntary effort by some good
    souls. If you''re a total newbie, I suggest you apply for mentorship as soon as
    you flip this book''s page.


    # PHP.net Documentation


    The official site of the programming language¹³ is chock-full of code samples,
    with user comments further examining and explaining them. You will likely get
    little out of it by wandering through the pages aimlessly, but whenever you become
    stuck and need to check out a function or command, your first Google result will
    likely be PHP.net. If you''re on a connection, or offline, there''s also an offline
    version of these docs¹⁴ that you can download stand-alone or as a Google Chrome
    application.¹⁵


    # Various Forums


    The SitePoint forums¹⁶ are an excellent resource with legions of people willing
    to help. You''re almost guaranteed to receive an answer in minutes if you go into
    enough details with the question. The forums are gamified, meaning they have badges
    and points awarded to those who post there, encouraging the community to participate.


    + ¹² http://phpmentoring.org/

    ¹³ http://php.net

    ¹⁴ http://php.net/download-docs.php

    ¹⁵ http://bit.ly/phpdocs

    ¹⁶ http://community.sitepoint.com


    The StackExchange network is a consortium of context-specific (ranging from programming
    to cooking) question-and-answer websites, made by the same people who built the
    software that powers the SitePoint forums. Being also gamified, this form of reward
    system entitles users to participate more than usual, so one can gain an answer
    to a well-formed question in a matter of hours, not minutes. There are three major
    sites you should bookmark for the full experience:


    - StackOverflow (http://stackoverflow.com/) is the most popular generic programming
    Q&A. You can ask about anything you language, as long as it''s about development.
    You can also ask questions not dealing with programming directly, such as inquiries
    about IDEs, servers, and so on.


    - Programming (http://programmers.stackexchange.com/) focuses solely on programming
    problems. If you get stuck coding, this is where you ask your questions, but make
    sure you google extensively first. Most of the newbie problems already have solutions,
    and you won''t be hard to find them.


    - Code Review (http://codereview.stackexchange.com/) is used for having your code
    reviewed by other people and receiving feedback. It''s important to accept feedback
    for what it is: apply the positive, brush off the negative, and learn from the
    constructive.


    There are many other sites in the network. Just look at the footer of any of these
    three—the full list is there. You might even find some that interest you outside
    of programming.


    These resources listed will be of endless help to you at the beginning of your
    PHP journey. As soon as you feel even least bit comfortable in basic PHP programming,
    I encourage you to seek out some intermediate and advanced tutorials by visiting
    SitePoint''s PHP channel.¹¹⁷


    ¹⁷ http://sitepoint.com/php


    # Summary


    In this chapter, we dealt with coding standards, code editors, communities, and
    other approaches that make making code more comfortable for ourselves, along with
    the people inheriting our code. Having a good bon ton from the get-go will produce
    exponential improvements down the road as these helpful habits become muscle memory.
    Remember: good habits are just as difficult to break as bad ones!


    # Chapter 3


    ## The Application Environment


    This chapter will focus on the application environment. We''ll also discuss AMPP
    and debugging. If you''re familiar with all these terms, feel free to skip this
    chapter.


    ## Application Environments


    The **application environment** is the term used to describe the environment your
    application can find during various stages: the production environment, the development
    environment, and the staging environment.


    The word **environment** refers to the hardware and software around your application;
    that is, everything used to power it.


    ## Production


    We''ll start with the most straightforward of environments: the **production environment**.


    # Jump Start PHP Environment


    When you **deploy**—in other words, upload it to a server and make it publicly
    accessible—you''re putting it in **production**, or in **use**. The production
    environment is your application''s final destination, your code''s purpose.


    In an application''s life cycle, the production environment is the **live server**—a
    server computer that''s set up so that other people can connect to and see it.
    This live server will be configured to serve your application as efficiently as
    possible. All the extra files you use during development will be removed from
    the application via a process known as compiling or building, which is explained
    further on.


    In production, your site is considered to be live (or deployed) and accessible
    via its own domain; for example, `http://mysite.com`. When you launch your site
    (put it into production mode), you have cause for celebration, because it is the
    final step in your application''s development process.


    It is the equivalent of a chef cooking a meal in a restaurant and having it delivered
    to the patrons who ordered it.


    ## Development


    In the development environment, your application is actively developed. The **development
    environment** is the computer that the developer are using to develop the app,
    including the computers of all your team members, regardless of whether they are
    near or remote. It is important to note that despite covering aspects, the development
