    \n图 8.2. 在 PhpStorm 中打开我们的项目\n\n现在它是完全空的，但即将发生变化。\n\n# 应用启动 (Bootstrapping)\n\n\
    启动意味着为未来的工作建立一套设置。在 Web 应用开发中，它意味着为开发奠定基础并完成常见的准备步骤。\n\n在我们在此之前，还有一些需要介绍的术语。\n\
    \n> ¹ https://www.jetbrains.com/phpstorm/\n\n# 测试\n\n在编程中，有一个概念被称为**测试**。虽然测试超出了本书的范范围（请参见章节末尾的进一步阅读链接），但我将简要解释它。\n\
    \n每当你对其中一个应用进行更改时，通常会在浏览器中刷新应用以确保更改已生效。这被称为**手动测试**。\n\n有工具可以自动完成这个过程。通过编写一组特定的指令（测试），你的应用程序可以在每次更改后进行*自测*。编写这些指令可能是复杂且耗时的，但随着应用程序的增长，投入到编写测试上的时间将获得数倍的回报。例如，人们不再需要点击网页的每个链接来确保它正常工作；测试会自动完成这一点，并且是在传统浏览器之外（通过在后台模拟浏览器的程序）。这使得它们比人类快得多，而且更不容易出错（因为消除了人为因素）。\n\
    \n我们将在本章中跳过自动测试，因为解释起来太复杂了（再次，请参见章节末尾的测试资源链接）。通常情况下，任何应用程序——无论复杂程度——如果它的目的是生存时间超过几天或有几个访问者，就不应该没有测试（我们的演示应用没有这些限制）。\n\
    \n我们的第一次手动测试将确保当我们在浏览器中访问 http://guestbook.app URL 时，我们会收到一个空白页面，如图 8.3 所示。\n\n\
    # 实例学习：从零开始 Web 应用 109\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_131_0.png)\n\
    \n图 8.3. 没有消息就是好消息\n\n# 实例学习：从零开始 Web 应用\n\n图 8.3. 没有消息就是好消息\n\n我们的第一次手动测试将确保当我们在浏览器中访问\
