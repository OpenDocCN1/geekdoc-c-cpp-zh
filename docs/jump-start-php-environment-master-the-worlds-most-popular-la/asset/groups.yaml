    \ on.\n\nWhile version control is important in any kind of development, it is\
    \ especially precious in teamwork. Teams working on the same codebase would share\
    \ code snippets over email (so-called \"patchbombs\"), which required a lot of\
    \ manual synchronization and administrative overhead in accepting changes and\
    \ updates.\n\nWith tools as Git and GitHub, this has changed.\n\n# Git and GitHub\n\
