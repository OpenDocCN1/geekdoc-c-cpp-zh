    # About Bruno Škorvec


    Bruno, a web developer from Croatia, is SitePoint''s senior PHP editor by day,
    and a developer evangelist for Diffhot.com by night. A big fan of working on treadmill
    desks, he spends the most of his days walking through various projects and problems,
    and then exposing them on SitePoint.com. In his free time (i.e. when his beagle
    is asleep) he swims, stronglifts, plays (board) games and paints miniatures.


    # About SitePoint


    SitePoint specializes in publishing fun, practical, and easy-to-understand content
    for web professionals. Visit http://www.sitepoint.com/ to access our blogs, books,
    newsletters, articles, and community forums. You''ll find a stack of information
    on JavaScript, PHP, Ruby, mobile development, design, and more.


