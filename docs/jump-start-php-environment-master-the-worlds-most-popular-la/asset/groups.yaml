    # Jump Start PHP Environment


    and there are warehouses upon warehouses of them. Contrary to their name, cloud
    computer systems are very much grounded. They''re merely very large computers
    formed of many little ones.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_102_0.png)


    On this apparent single computer, a special kind of software is run that dictates
    the look and feel of the environment; for example, making it seem like we''re
    dealing with a single Linux server. In some ways it''s like shared hosting—but
    on a much, much greater scale (many more computers).


    Cloud hosting usually allows terminal access to the server (enabling you to manually
    configure some items) but often features GUI elements that are used to generate
    access codes, install plugins into your cloud-powered applications, and more.


    Some popular cloud hosting providers are:


    - Google App Engine (https://cloud.google.com/appengine/docs)

    - Heroku (https://www.heroku.com/)

    - Amazon Web Services (https://aws.amazon.com/)

    - OpenShift (https://www.openshift.com/)

    - Azure (https://azure.microsoft.com/en-us/)


    # Deployment and Hosting


    Fortrabbit (http://www.fortrabbit.com/)


    ... and there are many more.


    There are several approaches to cloud hosting, but the one common vector they
    all share is that you do not depend on other customers'' good will and code, unlike
    shared hosting. The resources of the *cloud* (aka the network of computers on
    which your app is operating) are focused on processing your (and other people''s)
    code, while the hard drive storage parts (such as storing your users upload, for
    example) are usually saved elsewhere. This has two advantages:


    1. The cloud is used exclusively to process code. It is optimized for one purpose,
    so your app is always fast (depending on your code''s quality, of course).


    2. There are no resource limits. Cloud computing, there are so many machines working
    as one there are always plenty of resources for your app if needed.


    Cloud hosting follows a payment model that charges the number of units of time
    your app has been using a server. For example, it might be priced at two cents
    per unit of CPU, and units may be increments of 15 minutes. If your application
    used one core for 24 hours, then had a sudden traffic spike and used four cores
    for 24 more hours, you''d end up paying $1.9 for one day, and around $7.7 for
    two day, totaling around $10 for two days. Cloud hosting is more expensive if
    you have lots of traffic, but more reliable than shared hosting as it rarely,
    if ever, crashes. It means if your site suddenly receives a huge traffic boost
    (maybe it ended up on the news), the cloud-hosting provider can allocate more
    CPU cores to your app and keep it alive for those extras. This means no business,
    which probably offsets those hosting costs anyway! Besides, if you fear a wave
    of traffic so powerful it could financially destroy you, most services offer you
    to set, for example, "throw more power at my app as long as it stays under $2,000
    per month."


    Cloud hosting services also offer free tiers, meaning you can use them for charge,
    no strings attached, for as long as you want—but with limited resources and missing
    features (no custom domains, for example). If you want to expand, you can easily
    upgrade the account your site is already hosted on, and it immediately becomes
    more powerful (and more expensive).


    Cloud hosting is the hosting choice these days, particularly for high-profile
    applications requiring extreme reliability, as downtimes are rare. Cloud hosting
    is also # Jump Start PHP Environment excellent for one-off projects as demos and
    portfolio pieces if you utilize the free tiers many—at no cost, you can have permanently
    available, publicly accessible runnable code online.


    It''s not all fun and games, though. Some of the disadvantages of shared hosting
    are present in cloud hosting:


    - Vendor lock-in: this can happen in cloud hosting, too. Often, the platform you''re
    on have platform-specific settings you need to learn and tweaks to master. Likewise,
    versions of installed software also tend to remain unpatched. Since the servers
    are tweaked to run a specific version of, for example, PHP at incredible speeds,
    that version also tweaked to run well in such an environment, making it difficult
    to update as a new version would require those (often non-trivial) tweaks as well.


    - Learning limitations: while shared hosting holds you back by failing to teach
    you about server management, cloud hosting is limiting by teaching you only a
    specific type of server management— theirs. Moving from Google App Engine to Heroku
    is no trivial operation, but in code terms and in the learning curve involved
    in mastering a new tool with its own specific commands and utilities.


    Remember—cloud hosting is similar to shared hosting, but on a much grand scale.
    To use cloud hosting, however, one is typically an advanced user already proficient
    in some server management. For the case of a newbie starting out, I''d always
    recommend virtual private servers.


    # (Virtual) Private Hosting


    Also known as dedicated hosting, private hosting promises a dedicated machine—be
    it virtual or for your needs (why virtual is parenthesized). You can then use
    this machine for whatever purpose you see fit. If you choose to make it your own
