    code），因为它是一团糟——每一行与下一行交织在一起，没有结构或顺序，一段逻辑调用另一个定义在任意外部位置的逻辑。意大利条式代码对其他开发者非常不友好（甚至对几个月后的原始开发者也是如此！）。


