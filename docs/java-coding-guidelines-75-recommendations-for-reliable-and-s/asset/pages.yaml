  md: "# 54. Use braces for the body of an if, for, or while statement\n\nThis program\
    \ behaves as expected. However, a maintainer might subsequently add a debug statement\
    \ or other logic but forget to add opening and closing braces:\n\n```\nint login;\n\
    \nif (invalid_login())\n    login = 0;\nelse\n    // Debug line added below\n\
    \    System.out.println(\"Login is valid\\n\");\n    // The next line is always\
    \ executed\n    login = 1;\n```\n\nThe code's indentation disguises the functionality\
    \ of the program, leading to a security vulnerability.\n\n# Compliant Solution\n\
    \nThis compliant solution uses opening and closing braces even though the if else\
    \ bodies of the if statement are single statements:\n\n```\nint login;\n\nif (invalid_login())\
    \ {\n    login = 0;\n} else {\n    login = 1;\n}\n```\n\n# Noncompliant Code Example\n\
    \nThis noncompliant code example nests an if statement within another statement,\
    \ without braces around the if and else bodies:\n\n```\nint privileges;\n\nif\
    \ (invalid_login())\n    if (allow_guests())\n        privileges = GUEST;\nelse\n\
    \    privileges = ADMINISTRATOR;\n```"
