    Subset of Java"


    # 74. Use the serialization methods writeUnShared() and readUnShared() with care


    When objects are serialized using the writeObject() method, each object is written
    to the output stream only. Invoking the writeObject() method on the same second
    time places a back-reference to the previously serialized instance in the stream.
    Correspondingly, the readObject() method produces at most one instance for each
    object present in the input stream that was previously written by writeObject().


    According to the Java API [API 2013], the writeUnShared() method


    writes an "unshared" object to the ObjectOutputStream. This method is identical
    to readObject(), except that it always writes the given object as a new, unique
    object in the stream (as opposed to a back-reference to a previously serialized
    instance).


    Similarly, the readUnShared() method


    reads an "unshared" object from the ObjectInputStream. This method is identical
    to readObject(), except that it prevents subsequent calls to readObject and readUnshared
    from returning additional references to the deserialized instance obtained via
    this call.


    Consequently, the writeUnShared() and readUnShared() methods are unsuitable for
    round-trip serialization of data structures that contain reference cycles.'
