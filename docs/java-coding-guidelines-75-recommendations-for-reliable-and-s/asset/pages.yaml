    behavior. That is, the second operand is evaluated only when the result of the
    conditional operand cannot be deduced solely by evaluating the first operand.
    Consequently, when the result of the conditional operand can be deduced solely
    from the first operand, the second operand will remain unvaluated; its side effects,
    if any, will never occur.


    The bitwise AND and OR operators (& and |) lack short-circuit behavior. Unlike
    Java operators, they evaluate both operands. They return the same Boolean results
    as && and || respectively, but can have different overall effects depending on
    the presence or absence of side effects in the second operand.'
