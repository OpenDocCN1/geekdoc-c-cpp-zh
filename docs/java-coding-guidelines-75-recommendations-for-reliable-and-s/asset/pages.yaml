    Although the client programmer might eventually deduce such behavior, other cases,\
    \ such as with the List interface, go unnoticed, as Joshua Bloch [Bloch 2008]\
    \ describes:\n\nThe List<E> interface has two overloads of the remove method:\
    \ remove(E) and remove(int). Prior to release 1.5 when it was \"generated\", the\
    \ List interface had a remove(Object) method in place of remove(E), and the corresponding\
    \ parameter types, Object and int, were radically different. In the presence of\
    \ generics and autoboxing, the two parameter types are no longer radically different.\n\
    \nConsequently, a programmer may fail to realize that the wrong element has been\
    \ removed from the list.\n\nA further problem is that in the presence of autoboxing,\
    \ adding a new overloaded method can break previously working client code. This\
    \ happens when a new overloaded method with a more specific type is added to an\
    \ API whose methods used less specific types in earlier versions. For example,\
    \ an earlier version of the OverLoader class provided only the getData(Integer),"
