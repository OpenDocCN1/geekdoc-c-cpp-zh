    # Noncompliant Code Example (Initialization)


    This noncompliant code example might lead a programmer or reviewer to mistakenly
    believe that both i and j are initialized to 1. In fact, only j is initialized,
    while i remains uninitialized:


    ```

    int i, j = 1;

    ```


    # Compliant Solution (Initialization)


    In this compliant solution, it is readily apparent that both i and j are initialized
    to 1:


    ```

    int i = 1; // Purpose of i...

    int j = 1; // Purpose of j...

    ```


    # Compliant Solution (Initialization)


    In this compliant solution, it is readily apparent that both i and j are initialized
    to 1:


    ```

    int i = 1, j = 1;

    ```


    Declaring each variable on a separate line is the preferred method. However, multiple
    variables on one line are acceptable when they are trivial temporary variables
    as array indices.


