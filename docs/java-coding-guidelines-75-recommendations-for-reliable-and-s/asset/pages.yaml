  md: "# 57. Avoid inadvertent wrapping of loop counters\n\nThis solution can be fragile\
    \ when one or more of the conditions affecting the iteration must be changed.\
    \ A better solution is to use a numerical comparison operator (that is, <, <=,\
    \ or >=) to terminate the loop.\n\n```\nfor (i = 1; i <= 10; i += 2) {\n  //...\n\
    }\n```\n\nThis latter solution can be more robust in the event of changes to the\
    \ iteration conditions. However, this approach should never replace careful consideration\
    \ regarding the intended and actual number of iterations.\n\n# Noncompliant Code\
    \ Example\n\nA loop expression that tests a counter is less than or equal to Integer.MAX_VALUE\
    \ or greater or equal to Integer.MIN_VALUE will never terminate because the expression\
    \ will always evaluate to true. For example, the following loop will never terminate\
    \ because i can never be greater than Integer.MAX_VALUE:\n\n```\nfor (i = 1; i\
    \ <= Integer.MAX_VALUE; i++) {\n  //...\n}\n```\n\n# Compliant Solution\n\nThe\
    \ loop in this compliant solution terminates when i is equal to Integer.MAX_VALUE:\n\
    \n```\nfor (i = 1; i < Integer.MAX_VALUE; i++) {\n  //...\n}\n```\n\nIf the loop\
    \ is meant to iterate for every value of i greater than 0, including Integer.MAX_VALUE,\
    \ it can be implemented as follows:\n\n```\ni = 0;\ndo {\n  i++\n  //...\n} while\
    \ (i != Integer.MAX_VALUE);\n```\n\n# Noncompliant Code Example\n\nThis noncompliant\
    \ code initializes the loop counter i to 0 and then increments it by two on each\
    \ iteration, basically enumerating all the even, positive values."
