    # Noncompliant Code Example


    This noncompliant code example attempts to compute the whole number greater than
    the ratio of two integers. The result of the computation is 1.0 rather than the
    intended 2.0.


    ```

    int a = 60070;

    int b = 57750;

    ```


    ```

    double value = Math.ceil(a/b);

    ```


    As a consequence of Java''s numeric promotion rules, the division operation performed
    is an integer division whose result is truncated to 1. This result is then promoted
    to double before being passed to the Math.ceil() method.


    # Compliant Solution


    This compliant solution casts one of the operands to double before the division
    is performed.


    ```

    int a = 60070;

    int b = 57750;

    ```


    ```

    double value = Math.ceil(a((double) b));

    ```


    As a result of the case, the other operand is automatically promoted to double.
    The division operation becomes a double divide, and value is assigned the correct
    result of 2.0. As in previous compliant solutions, this practice ensures that
    at least one of the operands of each operation is a floating-point number.


    # Applicability


    Improper conversions between integers and floating-point values can yield unexpected
    results, especially from precision loss. In some cases, these unexpected results
    can involve overflow or other exceptional conditions.


    It is acceptable to perform operations using a mix of integer and floating-point
    values when deliberately exploiting the properties of integer arithmetic before
    conversion to floating-point. For example, use of integer arithmetic eliminates
    the need to use the floor() method. Any such code must be clearly documented to
    help future maintainers understand that this behavior is intentional.'
