  md: '# Do Not Explicit Invoke the Garbage Collector


    The GC can be explicitly invoked by calling the System.gc() method. Even though
    the documentation says that it "runs the garbage collector," there is no guarantee
    to when or whether the GC will actually run. In fact, the call merely suggests
    that the GC should subsequently execute; the JVM is free to ignore this suggestion.


    Irresponsible use of this feature can severely degrade system performance by inpportune
    moments, rather than waiting until ripe periods when it is safe to garbage-collect
    without significant interruption of the program''s execution.


    In a Java HotSpot VM (default since JDK 1.2), system.gc() forces an explicit garbage
    collection. Such calls can be buried deep within libraries, which may be difficult
    to trace. To ignore all in such cases, use the flag -XX:+DisableExlicitGC. To
    avoid long pauses while performing a full garbage collection, a less demanding
    concurrency may be invoked by specifying the flag -XX:ExplicitInvokedGCConcurrent.


    # Applicability


    Misusing garbage-collection utilities can cause severe performance degradation,
    which can be exploited to cause a DoS attack. The Apache and Tomcat vulnerability
    GERONIMO-4574, reported in March 2009, resulted from PolicyContext handler data
    objects set in a thread and never released, causing these data objects to remain
    in memory longer than necessary.


    When an application goes through several phases, such as an initialization and
    a ready phase, it could require heap compaction between phases. The System.gc()
    method may be invoked in such cases, provided a suitable uneventful period occurs


