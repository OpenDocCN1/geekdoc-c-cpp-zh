  md: '# 24. Minimize the accessibility of classes and their members


    # Table 2–1. Access control rules


    | Access Specifier | Class | Package | Subclass | World |

    | --- | --- | --- | --- | --- |

    | private | x | | | |

    | None | x | x | x* | |

    | protected | x | x | x** | |

    | public | x | x | x | x |


    *Subclasses within the same package can also access members that lack access specifies
    (default or package-private visibility). An additional requirement for access
    is that the subclasses must be loaded by the class loader that loaded the class
    containing the package-private members. Subclasses in a different package cannot
    access such package-private members.


    **To reference a protected member, the accessing code must be contained in either
    the class that defines the protected member or in a subclass of that defining
    class. Subclass access is permitted without regard to the package location of
    the subclass.


    Table 2–1 presents a simplified view of the access control rules. An x indicates
    that the particular access is permitted from within that domain. For example,
    an x in the class column means that the member is accessible to code present within
    the same class in it is declared. Similarly, the package column indicates that
    the member is accessible from any class (or subclass) defined in the same package,
    provided that the class (or subclass) is loaded by the class loader that loaded
    the class containing the member. The same class loader condition applies only
    to package-private member access.


    Classes and members must be given the minimum possible access so malicious classes
    have the least opportunity to compromise security. As far as possible, classes
    should avoid exposing methods that contain (or invoke) sensitive code through
    interfaces; interfaces allow only accessible methods, and such methods are part
    of the public application programming interface (API) of the class. (Note that
    this is the opposite of Joshua Bloch''s recommendation to prefer interfaces for
    APIs [Bloch 2008, Item 16].) One exception to this is implementing an unmodifiable
    interface that exposes a public immutable object. (See The CERT® Oracle® Secure
    Coding Standard for Java™ [Long 2012, "OBJ04-J". Provide mutable classes with
    functionality to allow passing instances to untrusted code.) Note that if a nonfinal
    class''s visibility is default, it can be susceptible to misuse if it contains
    public methods. Methods that perform all necessary security checks and sanitize
    all inputs must be exposed through interfaces.


    Protected accessibility is invalid for non-nested classes, but nested classes
    must be declared protected. Fields of nonfinal public classes should rarely be
    declared'
