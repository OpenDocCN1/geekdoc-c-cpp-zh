  md: "# 210 Chapter 5 Programmer Misconceptions\n\nThis safe publication guarantee\
    \ applies only to primitive fields and object references. Programmers commonly\
    \ use imprecise terminology and speak about \"member objects.\" For the purposes\
    \ of this visibility guarantee, the actual member is the object reference; the\
    \ objects referred to (aka, references) by volatile object references are beyond\
    \ the scope of this safe publication guarantee. Consequently, declaring an object\
    \ to be volatile is insufficient to guarantee that changes to the members of the\
    \ referent are published to other threads. A thread may fail to observe a recent\
    \ write from another thread to a member field of such an object referent.\n\n\
    Furthermore, when the referent is mutable and lacks thread-safety, other threads\
    \ might see a partially constructed object or an object in a (temporarily) inconsistent\
    \ state [Goetz 2007]. However, when the referent is immutable, declaring the reference\
    \ volatile suffices to guarantee safe publication of the members of the referent.\
    \ Programmers cannot use the volatile keyword to guarantee safe publication of\
    \ mutable objects. Use of the volatile keyword can only guarantee safe publication\
    \ of primitive fields, object references, or fields of immutable objects.\n\n\
    Confusing a volatile object with the volatility of its member objects is a similar\
    \ error to the one described in Guideline 73, \"Never confuse the immutability\
    \ of a reference with that of the referenced object.\"\n\n# Noncompliant Code\
    \ Example (Arrays)\n\nThis noncompliant code example declares a volatile reference\
    \ to an array object:\n\n```\nfinal class Foo {\n    private volatile int[] arr\
    \ = new int[20];\n\n    public int getFirst() {\n        return arr[0];\n    }\n\
    \n    public void setFirst(int n) {\n        arr[0] = n;\n    }\n\n    // ...\n\
    }\n```\n\nValues assigned to an array element by one thread—for example, calling\
    \ setFirst()—might not be visible to another thread calling getFirst(), because\
    \ the volatile keyword guarantees safe publication for the array reference; it\
    \ makes no guarantee regarding the actual data contained within the array."
