    # Applicability


    Allowing a system error to abruptly terminate a Java program may result in a denial-of-service
    vulnerability.


    In event of running out of memory, it is likely that some program data will be
    in an inconsistent state. Consequently, it might be best to restart the process.
    If an attempt is made to carry on, reducing the number of threads may be an effective
    workaround. This measure can help in such scenarios because threads often leak
    memory, and their continued existence can increase the memory footprint of the
    program.


