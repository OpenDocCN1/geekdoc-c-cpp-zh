  md: "# Compliant Solution (Clone the Array)\n\nThis compliant solution defines a\
    \ private array and a public method that returns a copy of the array:\n\n```\n\
    private static final String[] items = {/* . . . */};\n\npublic static final String[]\
    \ getItems() {\n  return items.clone();\n}\n```\n\nBecause a copy of the array\
    \ is returned, the original array values cannot be modified by a client. Note\
    \ that a manual deep copy could be required when dealing with arrays of objects.\
    \ This generally happens when the objects do not export a clone() method. Refer\
    \ to “OBJ-006. Defensively copy mutable inputs and mutable internal components”\
    \ [2012], for more information.\n\nAs before, this method provides direct access\
    \ to the array objects themselves, but this is safe because String is immutable.\
    \ If the array contained mutable objects, the getItems() method could return an\
