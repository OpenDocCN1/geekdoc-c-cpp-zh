  md: "# Compliant Solution\n\nProper remediation of the dead code depends on the\
    \ intent of the programmer. Assuming the intent is to do something special with\
    \ the last character in str, the conditional statement is adjusted to check whether\
    \ i refers to the index of the last character in str.\n\n```\npublic int string_loop(String\
    \ str) {\n  for (int i=0; i < str.length(); i++) {\n    /* ... */\n    if (i ==\
    \ str.length()-1) {\n        /* This code is now executed */\n    }\n  }\n  return\
    \ 0;\n}\n```\n\n# Noncompliant Code Example (Code with No Effect)\n\nIn this noncompliant\
    \ code example, the comparison of s to t has no effect:\n\n```\nString s;\nString\
    \ t;\n\n// ...\n\ns.equals(t);\n```\n\nThis error is probably the result of the\
    \ String programmer intending to do something with the comparison, but failing\
    \ to complete the code.\n\n# Compliant Solution\n\nIn this compliant solution,\
    \ the result of the comparison is printed out:\n\n```\nString s;\nString t;\n\n\
    // ...\n\nif (s.equals(t)) {\n  System.out.println(\"Strings equal\");\n} else\
    \ {\n  System.out.println(\"Strings unequal\");\n}\n```"
