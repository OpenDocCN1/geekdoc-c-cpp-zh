  md: "# 16. Avoid granting excess privileges\n\ncontaining the public key(s) corresponding\
    \ to the private key(s) used to digitally sign the code. Reference to the certificate(s)\
    \ is pertinent only if the code was digitally signed. A protection domain encompasses\
    \ a codeSource and the permissions granted to code from that codeSource, as determined\
    \ by the security policy currently in effect. Consequently, classes signed by\
    \ the same key and originating from the same URL are placed in the same protection\
    \ domain. A class belongs to one and only one protection domain. Classes that\
    \ have the same permissions but from different code sources belong to different\
    \ domains.\n\nEach Java class runs in its appropriate domain, as determined by\
    \ its code source. For any code running under a security manager to perform a\
    \ secured action such as reading or writing a file, the code must be granted permission\
    \ to perform that particular action. Privileged code can access privileged resources\
    \ on behalf of an un caller using the AccessController.doPrivileged() method.\
    \ This is necessary, for example, when a system utility needs to open a font file\
    \ on behalf of the user to display a document, the application lacks permission\
    \ to do so. To perform this action, the system utility uses its all privileges\
    \ for obtaining the fonts, ignoring the privileges of the caller. Privileged code\
    \ runs with all the privileges of the protection domain associated with the code\
    \ source. These privileges often exceed those required to perform the privileged\
    \ operation. Ideally, code should be granted only the minimum set of privileges\
    \ to complete its operation.\n\nGuideline 19, \"Define custom security permissions\
    \ for fine-grained security,\" describes another approach to eliminating excess\
