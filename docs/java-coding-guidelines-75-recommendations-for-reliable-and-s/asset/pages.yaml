    # ■ 45. Use the same type for the second and third operands in conditional expressions


    The conditional operator ?: uses the boolean value of its first operand to decide
    which of the other two expressions will be evaluated. (See §15.25, “Conditional
    Operator ?:", of the JLS (JLS 2013).)


    The general form of a Java conditional expression is operand1 ? operand2 : operand3.


    +   - If the value of the first operand (operand1) is true, then the second operand
    expression (operand2) is chosen.


    +   - If the value of the first operand is false, then the third operand expression
    (operand3) is chosen.


    The conditional operator is syntactically right-associative. For example, a?b:c?d:e?f:g
    is equivalent to a?b:(c?d:(e?f:g)).


    The JLS rules for determining the result type of a conditional expression (Table
    3-1) are complicated; programmers could be surprised by the type conversions required
    for expressions they have written.


    Result type determination begins from the top of the table; the compiler applies
    the first matching rule. The Operand 2 and Operand 3 columns refer to operand2
    and operand3 (from the previous definition). In the table


    The complexity of the rules in unintended type conversions can determine the result
    type of a conditional expression. Consequently, the second and third operands
    of each conditional expression should have identical types. This recommendation
    also applies to boxed primitives.'
