    # 14. Ensure that SecureRandom is properly seeded


    Random number generation depends on a source of entropy such as signals, devices,
    or hardware inputs. Secure random number generation is also addressed by The CERT®
    Oracle Secure Coding Standard for Java" [Long 2012], [MSC02-j]. Generate strong
    random numbers.


    The java.security.SecureRandom class is widely used for generating cryptographically
    strong random numbers. According to the java.security file present in the Java
    Runtime Environment''s lib/security folder [API 2013]:


    Select the source of seed data for SecureRandom. By default an attempt is made
    to use the entropy gathering device specified by the securerandom.source property.
    If an exception occurs when accessing the URL then the traditional system/thread
    activity algorithm is used.


    On Solaris and Linux systems, if file:/dev/urandom is specified and it exists,
    a special SecureRandom implementation is activated by default. This "NativePRNG"
    reads random bytes directly from /dev/urandom. On Windows systems, the URLs file:/dev/random
    and file:/dev/urandom enables of the Microsoft CryptoAPI seed functionality.


    An adversary should not be able to determine the original seed given several samples
    of random numbers. If this restriction is violated, all future random numbers
    may be successfully predicted by the adversary.'
