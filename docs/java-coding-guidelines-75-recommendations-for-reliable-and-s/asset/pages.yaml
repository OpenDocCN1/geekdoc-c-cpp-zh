    \ to authenticate using his or her credentials. If the authentication is successful,\
    \ the server issues a new cookie with remember-me characteristics.\n\nThis solution\
    \ avoids session-fixation attacks by invalidating the current session and creating\
    \ a new session. It also reduces the window during which an attacker could perform\
    \ a session-hijacking attack by setting the session timeout to 15 minutes between\
    \ client accesses.\n\n# Applicability\n\nStoring unencrypted sensitive information\
    \ on the client makes this information available to anyone who can attack the\
    \ client.\n\n# Bibliography\n\n+   - [Oracle 2011c] Package javax.servlet.http\n\
    - [OWASP 2009] Session Fixation in Java\n- [OWASP 2011] Cross-Site Scripting (XSS)\n\
    - [W3C 2003] The World Wide Web Security FAQ\n\n# 3. Provide sensitive mutable\
    \ classes with unmodifiable wrappers\n\nImmutability of fields prevents inadvertent\
    \ modification as well as malicious tampering so that defensive copying while\
    \ accepting input or returning values is unnecessary. However, some sensitive\
    \ classes cannot be immutable. Fortunately, read-only access to mutable classes\
    \ can be granted to untrusted code using unmodifiablewrappers. For example, the\
    \ Collection classes include a set of wrappers that allow clients to observe an\
    \ unmodifiable view of a Collection object.\n\n# Noncompliant Code Example\n\n\
