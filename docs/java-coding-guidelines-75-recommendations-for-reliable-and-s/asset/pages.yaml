  md: "# 39. Use meaningful symbolic constants to represent literal values in program\
    \ logic\n\nJava supports the use of various types of literals, such as integers\
    \ (5, 2), floatingpoint numbers (2. 5, 6.022e+23), characters ('a', '\\n'), Booleans\
    \ (true, false), and strings (\"Hello\"). Extensive use of literals in a program\
    \ can lead to two problems. First, the meaning of the literal is often obscured\
    \ or unclear from the context. Second, changing a frequently used literal requires\
    \ searching the entire program source for that literal and distinguishing the\
    \ uses that must be modified from those that remain unmodified.\n\nAvoid these\
    \ problems by declaring class variables with meaningfully named constants, setting\
    \ their values to the desired literals, and referencing the constants instead\
    \ of the literals throughout the program. This approach clearly indicates the\
    \ meaning or intended use of each literal. Furthermore, should the constant require\
    \ modification, the change is limited to the declaration; searching the code is\
    \ unnecessary.\n\nConstants should be declared as static and final. However, constants\
    \ should not be declared public and final if their values might change (see Guideline\
    \ 31,\"Do not apply public to constants whose value might change in later releases,\"\
    \ for more details). For example:\n\n```\nprivate static final int SIZE = 25;\n\
    ```\n\nAlthough final can be used to specify immutable constants, there is a caveat\
    \ when dealing with composite objects. See Guideline 73, \"Never confuse the immutability\
    \ of a reference with that of the referenced object,\" for more details.\n\n#\
    \ Noncompliant Code Example\n\n```\ndouble area(double radius) {\n  return 3.14\
    \ * radius * radius;\n}\ndouble volume(double radius) {\n  return 4.19 * radius\
    \ * radius * radius;\n}\ndouble greatCircleCircumference(double radius) {\n  return\
    \ 6.28 * radius;\n}\n```"
