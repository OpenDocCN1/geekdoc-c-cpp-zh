  md: "Consequently, either the e & && operator can be used when performing Boolean\
    \ logic. However, there are times when the short-circuiting behavior is preferred-\
    \ and there are times when the short-circuiting behavior causes subtle bugs.\n\
    \n# Noncompliant Code Example (Improper)\n\nThis noncompliant code example, derived\
    \ from Flanagan [Flanagan 2005], has two variables with unknown values. The code\
    \ must validate its data, and check whether array[i] is a valid index.\n\n```\n\
    int array[]; // May be null\nint i; // May be an invalid index for array\nif (array\
    \ != null && i >= 0 &&\n  i < array.length && array[i] >= 0) {\n  // Use array\n\
    } else {\n  // Handle error\n}\n```\n\nThis code can fail as a result of the same\
    \ errors it is trying to prevent. When array is NULL or i is not a valid index,\
    \ the reference to array and array[i] will cause either a NullPointerException\
    \ or an ArrayIndexOutOfBoundsException to be thrown. The exception occurs because\
    \ the & & operator fails to prevent evaluation of its left operand, even when\
    \ evaluation of its left operand proves that the right operand- is inconsequential.\n\
    \n# Compliant Solution (Use &&)\n\nThis compliant solution mitigates the problem\
    \ by using &&, which causes the evaluation of the conditional expression to terminate\
    \ immediately if any of the conditions fail, thereby preventing a runtime exception:\n\
    \n```\nint array[]; // May be null\nint i; // May be an invalid index for array\n\
    if (array != null && i >= 0 &&&\n  i < array.length && array[i] >= 0) {\n  //\
    \ Handle error\n} else {\n  // Handle error\n}\n```"
