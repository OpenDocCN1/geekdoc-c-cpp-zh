    # Applicability


    Detecting local variables that are declared in a larger scope than is required
    by the code is straightforward and can eliminate the possibility of false positives.


    Detecting multiple for statements that use the same index variable is straightforward;
    it produces false positives only in the unusual case where the value of the index
