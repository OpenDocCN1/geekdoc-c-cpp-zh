  md: '# 18. Do not expose methods that used reduced-security checks to untrusted
    code


    Most methods lack security manager checks because they do not provide access to
    sensitive parts of the system, such as the file system. Most methods that provide
    security manager checks verify that every class and method in the call stack is
    authorized before they proceed. This security model allows restricted programs,
    such as Java applets, to have full access to the core Java library. It also prevents
    a sensitive method from acting on behalf of a malicious method that hides behind
    trusted methods in the call stack.


    However, certain methods use a reduced-security check that checks only the calling
    method is authorized rather than checking every method in the call stack. Any
    code that invokes these methods must guarantee that they cannot be invoked on
    behalf of untrusted code. These methods are listed in Table 1–2.


    Because the java.lang.reflect.Field.setAccessible() and getAccessible() are used
    to inspect the Java Virtual Machine (JVM) to override the language access checks,
    they perform standard (and more restrictive) security manager checks, and consequently
    lack the vulnerability described by this guideline. Nevertheless, these methods
    should also be used with extreme caution. The remaining set* and get* field reflections
    perform only the language access checks and are consequently vulnerable.


    # Class Loaders


    Class loaders allow a Java application to be dynamically extended at runtime by
    loading additional classes. For each class that is loaded, the JVM tracks the
    class loader that was used to load the class. When a loaded class first refers
    to another class, the virtual machine requests that the referred class be loaded
    by the same class loader that was used to load the referencing class. Java''s
    class loader


