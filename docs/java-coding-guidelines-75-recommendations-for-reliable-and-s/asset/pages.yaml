  md: '# 244 Chapter 5 Programmer Misconceptions


    ```

    { // Local scope

    int[] buffer = new int[100];

    doSomething(buffer);

    buffer = null;

    }

    ```


    # Compliant Solution


    Program logic occasionally requires tight control over the lifetime of an object
    referenced from a local variable. In the unusual cases where such control is necessary,
    use a lexical block to limit the scope of the variable, because the garbage collector
    can collect the object immediately when it goes out of scope [Bloch 2008].


    This compliant solution uses a lexical block to control the lifetime of the buffer
    object:


    ```

    { // Limit the scope of buffer

    int[] buffer = new int[100];

    doSomething(buffer);

    }

    ```


    # Applicability


    It is unnecessary to set local reference variables to null when they are no longer
    needed in a mistaken attempt to help the garbage collector reclaim the associated
    memory.


    # Bibliography


    +   [Bloch 2008] Item 6, "Eliminate Obsolete Object References"

    [Long 2012] MET12-J. Do not use finalizers'
