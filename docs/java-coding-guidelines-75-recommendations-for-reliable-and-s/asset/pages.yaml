  md: "# 184\nChapter 4 ■ Program Understandability\n\nthan one and then testing for\
    \ equality to a specified value to terminate the loop. In this case, it is possible\
    \ that the loop counter will leapfrog the specified value and execute either forever,\
    \ or until the counter wraps around and reaches its final value. This problem\
    \ may also be caused by naive testing against limits; for example, looping-while\
    \ a counter is less than or equal to Integer.MAX_VALUE or greater than or equal\
    \ to Integer.MIN_VALUE.\n\n# Noncompliant Code Example\n\nThis noncompliant code\
    \ example appears to iterate five times.\n\n```\nfor (i = 1; i != 10; i += 2)\
    \ {\n  // ...\n}\n```\n\nThe loop never terminates. Successive values of i are\
    \ 1, 3, 5, 7, 9, 11, and so on; the comparison with 10 never evaluates to true.\
    \ The value reaches the maximum representable positive number (Integer.MAX_VALUE),\
    \ then wraps to the second lowest negative number (Integer.MIN_VALUE + 1). It\
    \ then works its way to -1, then i, and proceeds as described earlier.\n\n# Noncompliant\
    \ Code Example\n\nThis noncompliant code example terminates but performs many\
    \ more iterations than expected:\n\n```\nfor (i = 1; i != 5; i += 5) {\n  // ...\n\
    }\n```\n\nSuccessive values of i are 1, 6, and 11, skipping 10. The value of i\
    \ wraps from near the maximum positive value to near the lowest negative value\
    \ and works its way toward 0. It then assumes 2, 7, and 12, skipping 10 again.\
    \ After the value wraps from the high positive to the low negative side three\
    \ more times, it finally reaches 0, 5, and 10, terminating the loop.\n\n# Compliant\
    \ Solution\n\nOne solution is to simply ensure the loop termination condition\
    \ is reached before the counter inadvertently wraps.\n\n```\nfor (i = 1; i ==\
    \ 11; i += 2) {\n  // ...\n}\n```"
