    # 27. Identify files using multiple file attributes


    Many file-related vulnerabilities result from a program accessing an unintended
    file object. This often happens because file names are loosely bound to underlying
    file objects. File names provide no information regarding the nature of the file
    object itself. Furthermore, the binding of a file name to a file object is reevaluated
    each time the file is used in an operation. This reevaluation can introduce a
    time-of-check, time-of-use (TOCTOU) race condition into an application. Objects
    of type java.io.File and of type java.nio.file.Path are bound to underlying file
    objects by the operating system only when the file is accessed.


    The java.io.File constructors and the java.io.File methods renameTo() and delete()
    rely solely on file names for file identification. The same holds for the java.nio.file.Path.get()
    methods for creating Path objects and the move() and delete() methods of java.nio.file.Files.
    Use all of these methods with caution.


    Fortunately, files can be identified by other attributes in addition to the file
    name—for example, comparing file creation times or modification times. Information
    about a file that has been created and closed is stored and used to validate the
    identity of the file if it must be reopened. Comparing multiple attributes of
    the file increases the likelihood that the reopened file is the same file that
    was previously opened.


    File identification is less crucial for applications that maintain their files
    in secure directories where they can be accessed only by the owner of the file
    and (possibly) by a system administrator (see The CERT® Oracle® Coding Standard
    for Java™ [Long 2012], FIO00-J. Do not operate on files in shared directories)'
