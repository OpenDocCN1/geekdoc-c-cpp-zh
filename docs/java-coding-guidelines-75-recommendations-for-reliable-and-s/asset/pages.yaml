    \nThis compliant solution declares a private array from which a public unmodifiable\
    \ list is constructed:\n\n```\nprivate static final String[] items = {/* . . .\
    \ */};\n\npublic static List<String> itemsList = \nCollections.unmodifiableList(Arrays.asList(items));\n\
    ```\n\nNeither the original array values nor the public list can be modified by\
    \ a client. For more details about unmodifiable wrappers, refer to Guideline 3,\
    \ “Provide sensitive mutable classes with unmodifiable wrappers.” This solution\
    \ can also be used when the array contains mutable objects.\n\n# Applicability\n\
    \nIncorrectly assuming that final references cause the contents of the referenced\
    \ object to remain mutable can result in an attacker modifying an object believed\
    \ to be immutable."
