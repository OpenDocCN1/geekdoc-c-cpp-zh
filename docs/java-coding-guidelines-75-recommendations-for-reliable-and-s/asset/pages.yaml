  md: "49. Remove short-lived objects from long-lived container objects\n\n# Bibliography\n\
    \n[API 2013] Class ByteBuffer\n\n# 49. Remove short-lived objects from long-lived\
    \ container objects\n\nAlways remove short-lived objects from long-lived container\
    \ objects when the task is over. For example, objects attached to a java.nio.channels.SelectionKey\
    \ object must be removed when they are no longer needed. Doing so reduces the\
    \ likelihood of memory leaks. Similarly, using array-based data structures such\
    \ as ArrayList can introduce a requirement to indicate the absence of an entry\
    \ by explicitly setting ArrayList's individual array to null.\n\nThis guideline\
    \ specifically addresses objects referred from containers. For an example where\
    \ nulling objects does not aid garbage collection, see Guideline 75, \"Do not\
    \ attempt to help the garbage collector by setting local variable references to\
    \ null.\"\n\n# Noncompliant Code Example (Removing Short-lived Objects)\n\nIn\
    \ this noncompliant code example, a long-lived ArrayList contains references to\
    \ both long- and short-lived elements. The programmer marks elements that have\
    \ become irrelevant by setting a \"dead\" flag in the object.\n\n```\nclass DataElement\
    \ {\n    private boolean dead = false;\n    // Other fields\n\npublic boolean\
    \ isDead() { return dead; }\n    public void killMe() { dead = true; }\n}\n\n\
    // ... Elsewhere\nList<DataElement> longLivedList = new ArrayList<DataElement>();\n\
    \n// Processing that renders an element irrelevant\n\n// Kill the element that\
    \ is now irrelevant\nlongLivedList.get(someIndex).killMe();\n```\n\nThe garbage\
    \ collector cannot collect the dead DataElement object until it becomes unreferenced.\
    \ Note that all methods that operate on objects of class DataElement must also\
    \ check whether the instance in hand is dead."
