    # Issues Not Addressed


    A number of issues are not addressed by this secure coding standard.


    # Content


    These coding guidelines apply broadly to all platforms; concerns specific to only
    one Java-based platform that are beyond the scope of these guidelines. For example,
    guidelines that are applicable to Android, Java Micro Edition (ME), or Java Enterprise
    Edition (EE) and alone not to Java Standard Edition (SE) are typically excluded.
    In Java SE, APIs that deal with the user interface (user interface toolkits) or
    the web interface for providing features such as sound, graphical rendering,'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Preface


    user account access control, session management, authentication, and authorization
    are beyond the scope of these guidelines. Nevertheless, the guidelines discuss
    networked Java systems in light of the risks associated with improper input validation
    and injection flaws and suggest appropriate mitigation strategies. These guidelines
    assume that the functional specification of the product correctly identifies and
    prevents higher-level design and architectural vulnerabilities.


    # Coding Style


    Coding style issues are subjective; it has proven impossible to develop a consensus
    on appropriate style guidelines. Consequently, Java™ Coding Guidelines generally
    avoids requiring enforcement of any particular coding style. Instead, we suggest
    that the user define style guidelines and apply those guidelines consistently.
    The easiest way to consistently applying a coding style is with the use of a code
    formatting tool. Many integrated development environments (IDEs) provide such
    capabilities.


    # Tools


    Many of these guidelines are not amenable to automatic detection or correction.
    In some cases, tool vendors may choose to implement checkers to identify violations
    of these guidelines. As a federally funded research and development center (FFRDC),
    the Software Engineering Institute (SEI) is not in a position to recommend particular
    vendors or tools for this purpose.


    # Controversial Guidelines


    In general, Java™ Coding Guidelines tries to avoid the inclusion of controversial
    guidelines that lack a broad consensus.


    # Audience


    Java™ Coding Guidelines is primarily intended for developers of the Java language
    programs. Although these guidelines focus on the Java SE 7 Platform environment,
    they should also be informative (although incomplete) for Java developers working
    with Java ME or Java EE and other versions of the Java language.


    While designed for building reliable and secure systems, these guidelines are
    also useful for achieving other quality attributes such as safety, dependability,
    robustness, and maintainability.


    These guidelines may also be used by


    +   - Developers of analyzer tools who wish to diagnose insecure or nonconforming
    Java language programs

    - Software-development managers, software acquirers, or other software-development
    and acquisition specialists to establish a prospective set of secure coding standards

    - Educators as a primary or secondary text for Java programming courses'
  merge: -1
