- img_proc: true
  md: '# Table 4-1. Misleading characters


    | Intended Character | Could Be Mistaken For This Character, and Vice Versa |

    |--- |--- |

    | 0 (zero) | O (capital O)<br>D (capital d) |

    | 1 (one) | I (capital I)<br>l (lowercase L) |

    | 2 (two) | Z (capital Z) |

    | 5 (five) | S (capital s) |

    | 8 (eight) | B (capital b) |

    | n (lowercase N) | h (lowercase H) |

    | m (lowercase R, lowercase m) | m (lowercase M) |


    Avoid defining identifiers that include Unicode characters with overloaded glyphs.
    One straight-forward approach is to use only ASCII or Latin-1 characters in identifiers.
    Note that the ASCII character set is a subset of Unicode.


    Do not use multiple identifiers that vary only by one or more visually similar
    characters. Also, make the initial portions of long identifiers distinct to aid
    recognition. According to the JLS, §3.10.1, "Integer Literals" [JLS 2013],


    An integer literal is of type long if it is suffixed with an ASCII letter l or
    1 (ell); otherwise, the suffix l is preferred because the letter 1 (ell) is often
    hard to distinguish from the digit 1 (one).


    Consequently, use l, 1, to clarify programmer intent when indicating that an integer
    literal is of type long.


    Integer literals with leading zeros, in actuality, denote octal values not decimal
    values. According to §3.10.1, "Integer Literals," of the JLS [JLS 2013],


    An octal number consists of an ASCII digit 0 followed by one or more of the ASCII
    digits 0 through 7 interspersed with underscores, and can represent a positive,
    zero, or negative integer.


    This misinterpretation may result in programming errors and is more likely to
    occur when declaring multiple constants and trying to enhance the formatting with
    zero padding.'
