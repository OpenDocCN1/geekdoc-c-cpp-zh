  md: '# Scope


    Java Coding Guidelines focuses on the Java SE 7 Platform environment, and includes
    guidelines that address the issue of securing coding using the Java SE 7 API.
    The Java Language Specification: Java SE 7 Edition (the JLS) [JLS 2013] prescribes
    the behavior of the Java programming language and serves as the primary reference
    for the development of these guidelines.


    Traditional language standards, such as those for C and C++, include undefined,
    unspecified, and implementation-defined behaviors that can lead to vulnerabilities
    when a programmer makes incorrect assumptions about portability of these behaviors.
    By contrast, the JLS more completely specifies language behaviors, because Java
    is designed to be a cross-platform language. Even then, certain behaviors are
    left to the discretion of the Java Virtual Machine (JVM) or the Java compiler.
    These guidelines suggest solutions to help implementers address the issues, and
    let programmers appreciate and understand the limitations of the language and
    navigate around them.


    Focusing only on language issues does not translate to writing reliable and secure
    software. At other times, the APIs or the relevant documentation may be interpreted
    incorrectly by the programming community. These guidelines identify problematic
    APIs, and highlight their correct use. Examples of commonly used faulty design
    patterns and idioms are also included.


    The Java language, its core and extension APIs, and the JVM provide several security
    features, such as the security manager and access controller, cryptography, automatic
    memory management, strong type checking, and bytecode verification. These features
    provide sufficient security for most applications, but their proper use is of
    paramount importance. These guidelines highlight the pitfalls and caveats associated
    with the security architecture, and stress its correct implementation. Adherence
    to these guidelines safeguards trusted programs from a plethora of exploitable
    security bugs that can cause denial of service, information leaks, erroneous computations,
    and privilege escalation.


    # Included Libraries


    Figure P-1 is a conceptual diagram of Oracle''s Java SE products.


    These coding guidelines address security issues primarily applicable to the used
    base libraries as well as for “other libraries.” They avoid the inclusion of open
    bugs that have already been marked to be fixed or those that lack negative ramifications.
    A functional bug is included only if it is likely to occur with high frequency,
    causes considerable security or reliability concerns, or affects Java technologies
    that rely on the core platform. These guidelines are not limited to secu-'
  merge: -1
