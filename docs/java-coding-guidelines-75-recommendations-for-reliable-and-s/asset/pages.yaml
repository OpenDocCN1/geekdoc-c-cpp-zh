  md: '# 132


    # Chapter 3 = Reliability


    This chapter includes guidelines that


    +   1. Help reduce errors, and are consequently important for developing reliable
    Java code

    2. Contain specific Java coding recommendations to improve software reliability


    # 37. Do not shadow or obscure identifiers in subscopes


    Reuse of identifier names in subscopes leads to shadowing. Reused identifiers
    in the current scope can render those defined elsewhere inaccessible. Although
    the Java Language Specification (JLS) [JLS 2013] clearly resolves any syntactic
    ambiguity arising from obscuring or shadowing, such burdens source code maintainers
    and auditors, especially when code requires access to both the original named
    entity and the inaccessible one. The problem is exacerbated by the reused name
    is defined in a different package.

    According to §6.4.2, of the JLS [JLS 2013],


    > A simple name may occur in context where it may potentially be interpreted as
    the name of a variable, type, or a package. In these situations, the rules of
    §6.5 specify that a variable will be chosen in preference to a type, and that
    a type will be chosen in preference to a package.


    This implies that a variable can obscure a type or a package, and a type can obscure
    a package name. Shadowing, on the other hand, refers to one variable rendering
    another variable inaccessible in a containing scope. One type can also shadow
    another type.


    No identifier should obscure or shadow another identifier in a containing scope.
    For example, a local variable should not reuse the name of a class field or method
    or a class name or package name. Similarly, an inner class name should not reuse
    the name of an outer class or package.


    Both overriding and shadowing differ from hiding, in which an accessible member
    (typically non-private) that should have been inherited by a subclass is replaced
    by a locally declared subclass member that assumes the same name but has a different,
    incompatible method signature.


    # Noncompliant Code Example (Field Shadowing)


    This noncompliant code example reuses the name of the val instance field in the
    scope of an instance method.'
