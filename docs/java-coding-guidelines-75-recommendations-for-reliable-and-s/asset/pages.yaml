    \ Furthermore, if the trusted code accepts tainted inputs, the trusted code's\
    \ class loader could be persuaded to load privileged, malicious classes on behalf\
    \ of the untrusted code.\n\nClasses that have the same defining class loader will\
    \ exist in the same name space, but they can have different privileges depending\
    \ on the security policy. Security vulnerabilities can arise when privileged code\
    \ coexists with unprivileged code (or less privileged code) that was loaded by\
