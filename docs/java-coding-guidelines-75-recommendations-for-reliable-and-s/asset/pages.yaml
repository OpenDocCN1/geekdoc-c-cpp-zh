    # 23. Minimize the scope of the @SuppressWarnings annotation


    When the compiler detects potential type-safety issues arising from mixing raw
    types with generic code, it issues unchecked warnings, including unchecked cast
    warnings, unchecked method invocation warnings, unchecked generic array creation
    warnings, and unchecked conversion warnings [Bloch 2008]. It is permissible to
    use the @SuppressWarnings("unchecked") annotation to suppress unchecked warnings
    when and only when the warning-emitting code is guaranteed to be safe. A common
    case is using legacy code with new client code. The perils of ignoring unchecked
    warnings are discussed extensively in the CERT® Oracle Secure Coding Standard
    for Java" [Long 2012], "OBJ03-j. Do not mix generic with non-generic types in
    new code.


    According to the Java API Annotation TyperessWarnings documentation [API 2013],


    As a matter of style, programmers should always use this annotation on the most
    deeply nested element where it is effective. If you want to suppress a warning
    in a particular method, you should annotate that method rather than its class.


    The @SuppressWarnings annotation can be used in the declaration of variables and
    methods as well as an entire class. It is, however, important to narrow its scope
    so that only those warnings that occur in the narrower scope are suppressed.'
