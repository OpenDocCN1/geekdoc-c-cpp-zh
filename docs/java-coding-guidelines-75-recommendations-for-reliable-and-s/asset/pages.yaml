    # 32. Avoid cyclic dependencies between packages


    Both The Elements of Java™ Style [Allen 2000] and the JPL Java Coding Standard
    [Havelund 2009] require that the dependency structure of a package must never
    contain cycles; that is, it must be representable as a directed acyclic graph
    (DAG). Eliminating cycles between packages has several advantages.


    +   - Testing and maintainability. Cyclic dependencies magnify the repercussions
    of changes or patches to source code. Reducing the repercussions of changes simplifies
    testing and improves maintainability. Inability to perform adequate testing because
    of cyclic dependencies is a frequent source of security vulnerabilities.


    +   - Reusability. Cyclic dependencies between packages require that the packages
    be released and upgraded in lockstep. This requirement reduces reusability.


    +   - Releases and builds. Avoiding cycles also help to steer the development
    toward an environment that fosters modularization.


    +   - Deployment. Avoiding cyclic dependencies between packages reduces coupling
    between packages. Reduced coupling reduces the frequency of runtime errors such
    as ClassNotFoundError. In turn, simplifies deployment.


