  md: '# Testing conformance to the CERT® secure coding standards


    Software developers are often faced with the challenge of reconciling code quality
    with time and budget constraints. Ensuring that code conforms to the CERT® secure
    coding standards represents a significant investment that may be difficult to
    justify.


    Let us help to ease the burden. Using our Source Code Analysis Laboratory (SCALe),
    we can test your source code for conformance to CERT secure coding standards.
    This process offers you a variety of benefits:


    +   - You don''t have to dedicate time and resources to analyzing the code yourself.


    +   - If your software system passes conformance testing, you will be authorized
    to promote that version with the CERT Conformance Tested seal.


    +   - Your conforming system will be listed in our online registry of certificates.


    +   - You and your customers can feel confident in the quality of your code.


    For more information about our work, visit the secure coding area of the CERT
    website:


    www.cert.org/secure-coding


    ![](img/3143b260199f0f09c503d13f99745e59_303_0.png)'
