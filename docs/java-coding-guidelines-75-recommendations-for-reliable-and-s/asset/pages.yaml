  md: "# Noncompliant Code Example (Unused Values)\n\nIn this example, p2 is assigned\
    \ the value returned by bar(), but that value is never used:\n\n```\nint p1 =\
    \ foo();\nint p2 = bar();\n\nif (baz()) {\n    return p1;\n} else {\n    p2 =\
    \ p1;\n}\nreturn p2;\n```\n\n# Compliant Solution\n\nThis example can be corrected\
    \ in many different ways depending on the intent of the programmer. In this compliant\
    \ solution, p2 is found to be extraneous. The calls to bar() and baz() could also\
    \ be removed if they do not produce any side effects.\n\n```\nint p1 = foo();\n\
    \nbar(); /* Removable if bar() lacks side effects */\nbaz(); /* Removable if baz()\
    \ lacks side effects */\n\nreturn p1;\n```\n\n# Applicability\n\nThe presence\
    \ of dead code may indicate logic errors that can lead to program behavior. The\
    \ ways in which dead code can be introduced into a program and the effort to remove\
    \ it can be complex. As a result, resolving dead code can be an in-depth process\
    \ requiring significant analysis.\n\nIn exceptional situations, dead code may\
    \ make software resilient to future changes. An example is the presence of a default\
    \ case in a switch statement even though all possible switch labels are specified\
    \ (see Guideline 64, \"Strive for logical completeness,\" for an illustration\
    \ of this example).\n\nIt is also permissible to temporarily retain dead code\
    \ that may be needed later. Such cases should be clearly indicated with an appropriate\
    \ comment.\n\nThe presence of code that has no effect can indicate logic errors\
    \ that may result in unexpected behavior and vulnerabilities. Unused values in\
    \ code may indicate significant logic errors.\n\nCode and values that have no\
    \ effect can be detected by suitable static analysis."
