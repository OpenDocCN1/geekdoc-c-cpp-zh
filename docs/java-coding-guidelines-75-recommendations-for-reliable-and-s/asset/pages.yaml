  md: '# About the Authors


    Fred Long is a senior lecturer in the Department of Computer Science at Aberystwth
    University in the United Kingdom. He lectures on formal methods; Java, C++, and
    C programming; and programming-related security issues. He is chairman of the
    British Computer Society''s Soft-Wales branch. Fred has been a visiting scientist
    at the Software Engineering Institute since 1992. Recently, his research has involved
    the investigation of vulnerabilities in Java. Fred is a coauthor of The CERT®
    Oracle® Secure Coding-Standard for Java™ (Addison-Wesley, 2012).


    Dhruv Mohindra is a technical lead in the security practices that is part of the
    CTO''s office at Persistent Systems Limited, India, where he provides information
    security consulting solutions across various technology verticals such as cloud,
    collaboration, banking and finance, telecommunications, enterprise, mobility,
    life sciences, and health care. He regularly consults for senior management and
    development teams of Fortune 500 companies, small and medium-sized enterprises,
    and start-ups on information security best practices and embedding security in
    the software-development life cycle.


    ![](img/3143b260199f0f09c503d13f99745e59_22_0.png)'
