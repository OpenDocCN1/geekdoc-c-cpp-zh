  md: '# Addison Wesley Software Engineering Institute Carnegie Mellon


    ![](img/3143b260199f0f09c503d13f99745e59_304_0.png)


    ISBN-13: 978-0-321-80395-5


    In the Java world, security is not viewed as an add-on feature. It is a pervasive
    way of thinking. Those who forget to think in a secure mind-set end up in trouble.
    But just because the facilities are there doesn''t mean security is assured automatically.
    A set of standard practices has evolved over the years. The CERT® Oracle® Secure
    Coding Standard for Java™ is a compendium of these practices. These are not theoretical
    research papers or product marketing blurbs. This is all serious, mission-critical,
    battle-tested, enterprise-scale stuff.


    > James A. Gosling, Father of the Java Programming Language


