    \ it may be any object type. Again, legitimate uses of such declarations are rare.\n\
    \n```\n<T> double sum(T... args) {\n  // ...\n}\n```\n\n# Compliant Solution (Generic\
    \ Type)\n\nThis compliant solution defines the same generic method using the Number\
    \ type.\n\n```\n<T extends Number> double sum(T... args) {\n  // ...\n}\n```\n\
    \nBe as specific as possible when declaring parameter types; avoid Object and\
    \ imprecise generic types in variable arity methods. Retrofitting arity methods\
    \ containing final array parameters with generically typed variable arity parameters\
    \ is not always a good idea. For example, given a method that does not accept\
    \ an argument of a particular type, it could be possible to override the compile-time\
    \ checking—through the use of generic arity parameters—so that the method would\
    \ compile cleanly rather than correctly, causing a runtime error [Bloch 2008].\n\
    \nAlso, note that autoboxing prevents compile-time checking of primitive types\
    \ and their corresponding wrapper classes. For example, this compliant solution\
    \ produces the following warning, but works as expected:\n\n```\nJava.java:10:\
    \ warning: [unchecked] Possible heap pollution from parameterized vararg type\
    \ T\n<T extends Number> double sum(T... args)\n```\n\nThis particular compiler\
    \ warning can be safely ignored.\n\n# Applicability\n\nInjudicious use of variable\
    \ arity parameter types prevents compile-time type checking, creates ambiguity,\
    \ and diminishes code readability."
