  md: "# Chapter 2 Defensive Programming\n\nMachine JVM for examination. Several annotations\
    \ are available for documenting thread-safety or the lack thereof.\n\n# Obtaining\
    \ Concurrency Annotations\n\nTwo sets of concurrency annotations are freely available\
    \ and licensed for use in any code. The first set consists of four annotations\
    \ described in Java Concurrency in Practice (JCIP) [Goetz 2006], which can be\
    \ downloaded from http://jicip.net. The JCIP annotations are released under the\
    \ Creative Commons Attribution License.\n\nThe second, larger set of concurrency\
    \ annotations is available and supported by SureLogic. These annotations are released\
    \ under the Apache Software License, Version 2.0, and can be downloaded at www.surelogic.com.\
    \ The annotations can be verified by the SureLogic tool, and they remain useful\
    \ for documenting code even when the tool is unavailable. These include the JCIP\
    \ annotations because they are supported by the annotations, download and also\
    \ supports use of the JCIP JAR file.\n\nTo use one or both of the aforementioned\
    \ JAR files to the code's build path. The use of these annotations to document\
    \ thread-safety is described in the following sections.:\n\n# Documenting Intended\
    \ Thread-Safety\n\nJCIP provides three class-level annotations to describe the\
    \ programmer's design intent with respect to thread-safety.\nThe @ThreadSafe annotation\
    \ is applied to a class to indicate that it is thread-safe. This means that no\
    \ sequences of accesses (reads and writes to fields, calls to public methods)\
    \ can leave the object in an inconsistent state, regardless of the interleaving\
    \ of the accesses by the runtime or external synchronization or coordination on\
    \ the part of the caller.\n\nFor example, the following Aircraft class specifies\
    \ that it is thread-safe as part of its locking policy documentation. This class\
    \ protects the x and y fields using a reentrant lock.\n\n```\n@ThreadSafe\n@Region(\"\
    private AircraftState\")\n@RegionLock(\"StateLock isLock protects AircraftState\"\
    )\npublic final class Aircraft {\n    private final Lock stateLock = new ReentrantLock();\n\
    \    // ...\n    @InRegion(\"AircraftState\")\n    private long x, y;\n    //\
    \ ...\n```"
