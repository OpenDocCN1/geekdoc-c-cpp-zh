    \ in JDK 1.4 with the New I/O package java.nio since more comprehensive facilities\
    \ were included in JDK 1.7 with the New I/O package java.nio.file. Both packages\
    \ introduced a number of methods to support finer-grained control over file creation.\n\
    \nThe CERT® Oracle Secure Coding Standard for Java [Long 2012], FIO01-j: Create\
    \ files with appropriate permissions,\" explains how to specify the permissions\
    \ of a newly created file.\n\n# Noncompliant Code Example\n\nThis noncompliant\
