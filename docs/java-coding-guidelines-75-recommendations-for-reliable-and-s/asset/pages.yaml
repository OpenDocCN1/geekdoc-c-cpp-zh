    \ two-argument form of doPrivileged() can be used to lower privileges with higher\
    \ privileges, the scripting engine must not. The RestrictedAccessControlType reduces\
    \ the permissions granted in the default policy file to the newly created protection\
    \ domain. The effective permissions are the intersection of the permissions of\
    \ the newly created protection domain and the system security policy. Refer to\
    \ Guideline 16, \"Avoiding granting excess privileges,\" for more details on the\
    \ two-argument form of doPrivileged().\nThis compliant solution illustrates the\
    \ use of an AccessControlContext in the two-argument form of doPrivileged().\n\
