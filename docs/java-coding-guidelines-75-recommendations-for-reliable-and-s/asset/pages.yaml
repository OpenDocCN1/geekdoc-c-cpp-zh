  md: "# 204 Chapter 4 # Program Understandability\n\nThe original ConvertDays() C\
    \ function in the real-time clock (RTC) routines for the MC13783 PMIC RTC takes\
    \ the number of days since January 1, 1980, and computes the correct year and\
    \ number of days since January 1 of the correct year.\n\nThe flaw in the code\
    \ occurs when days have the value 366 because the loop never terminates. This\
    \ bug manifested itself on the 366th day of 2008, which was the first leap year\
    \ in which this code was active.\n\n# Compliant Solution (Zune 30)\n\nThis proposed\
    \ rewrite is provided by “A Lesson on Infinite Loops” by Bryant Zadegan [Zadegan\
    \ 2009]. The loop is guaranteed to exit, as days decreases for each iteration\
    \ of the loop, unless the condition fails, in which case the loop terminates.\n\
    \n```\nstatic int ORIGIN_YEAR = 1980;\n/* Number of days since January 1, 1980\
    \ */\npublic void convertDays(long days) {\n    int year = ORIGIN_YEAR;\n    /*\
    \ ... */\n    int daysThisYear = (IsLeapYear(year) ? 366 : 365);\n    while (days\
    \ > daysThisYear) {\n        days -= daysThisYear;\n        year += 1;\n     \
    \   daysThisYear = (IsLeapYear(year) ? 366 : 365);\n    }\n}\n```\n\nThis compliant\
    \ solution is for illustrative purposes and may differ from the solution implemented\
    \ by Microsoft.\n\n# Applicability\n\nFailure to take into account all possibilities\
    \ within a logic statement can lead to a corrupted running state, potentially\
    \ resulting in unintended information disclosure or abnormal program termination.\n\
