  md: "# 198 Chapter 4 Program Understandability\n\nNested block comments and inconsistent\
    \ use of comments can be detected by suitable static analysis tools.\n\n# Bibliography\n\
    \n[JLS 2013] §83.7, “Comments\"\n\n# 63. Detect and remove superfluous code and\
    \ values\n\nSuperfluous code and values may occur in the form of dead code, code\
    \ that has no effect, and unused values in program logic.\n\nCode that is never\
    \ executed is known as dead code. Typically, the presence of dead code indicates\
    \ that a logic error has occurred as a result of changes to a program or to the\
    \ program's environment. Dead code is often optimized out of a program during\
    \ compilation. However, to improve readability and ensure that logic errors are\
    \ resolved, dead code should be identified, understood, and removed.\n\nCode that\
    \ is executed but fails to perform any action, or that has an unintended effect,\
    \ most likely results from a coding error and can cause unexpected behavior. Statements\
    \ or expressions that have no effect should be identified and removed from code.\
    \ Most modern compilers can warn about code that has no effect.\n\nThe presence\
    \ of unused values in code may indicate significant logic errors. To prevent such\
    \ errors, unused values should be identified and removed from code.\n\n# Noncompliant\
    \ Code Example (Dead Code)\n\nThis noncompliant code example demonstrates how\
    \ dead code can be introduced into a program [Fortify 2013]:\n\n```\npublic int\
    \ func(boolean condition) {\n    int x = 0;\n    if (condition) {\n        x =\
    \ foo();\n        /* Process x */\n        return x;\n    }\n    /* ... */\n \
    \   if (x != 0) {\n        /* This code is never executed */\n    }\n    return\
    \ x;\n}\n```"
