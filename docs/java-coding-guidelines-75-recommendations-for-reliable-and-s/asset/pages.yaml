  md: 'Enterprise Java applications are susceptible to attacks because they accept
    untrusted input and interact with complex subsystems. Injection attacks (such
    as cross-site scripting [XSS], XPath, and LDAP injection) are possible when the
    components susceptible to these attacks are used in the application. An effective
    mitigation strategy is to whitelist input, and encode or escape output before
    it is processed for rendering.


    This chapter contains guidelines that are concerned specifically with ensuring
    the security of Java-based applications. Guidelines dealing with the following
    security nuances are articulated.


    +   1. Dealing with sensitive data

    2. Avoiding common injection attacks

    3. Language features that can be misused to compromise security

    4. Details of Java''s fine-grained security mechanism


    # 1. Limit the lifetime of sensitive data


    Sensitive data in memory can be vulnerable to compromise. An adversary who can
    execute code on the same system as an application may be able to access such data
    if the application


    +   - Uses objects to store sensitive data whose contents are not cleared or garbage-collected
    after use

    - Has memory pages that can be swapped out to disk as required by the operating
    system (for example, to perform memory management tasks or to support hibernation)

    - Holds sensitive data in a buffer (such as BufferedReader) that retains copies
    of the data in the OS cache or in memory

    - Bases its control flow on reflection that allows countermeasures to circumvent
    the limiting of the lifetime of sensitive variables

    - Reveals sensitive data in debugging messages, log files, environment variables,
    or through thread and core dumps


    Sensitive data leaks become more likely if the memory containing the data is not
    cleared using the data. To limit the risk of exposure, programs must minimize
    the lifetime of sensitive data.


    Complete mitigation (that is, foolproof protection of data in memory) requires
    support from the underlying operating system and Java Virtual Machine. For example,
    if swapping sensitive data out to disk is an issue, a secure operating system
    that disables swapping and hibernation is required.'
