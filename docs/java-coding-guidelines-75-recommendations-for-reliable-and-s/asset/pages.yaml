  md: '# 252


    # Glossary


    require all invalid characters to be escaped or eliminated before their storage.
    Input sanitization is the elimination of unwanted characters from the input by
    means of removing, replacing, encoding, or escaping the characters.


    security flaw A software defect that poses a potential security risk [Seacord
    2013].


    sensitive code Any code that performs operations that would be forbidden by untrusted
    code. Also, any code that accesses sensitive data. For example, code whose correct
    operation requires enhanced privileges is typically considered to be sensitive.


    sensitive data Any data that must be kept secure. Consequences of this security
    requirement include the following:


    +   - Untrusted code is forbidden to access sensitive data

    - Trusted code is forbidden to leak sensitive data to untrusted code


    Examples of sensitive data include passwords and personally identifiable information.

    shadow One scoped identifier shadows another identifier in a containing scope
    if the two identifiers are the same, and both reference variables or methods.
    The shadowed identifier is not accessible in the scope of the shadowing identifier.
    See the JLS, §6.4.1, “Shadowing” [JLS 2013], for more information. Contrast with
    obscure.


    synchronization “The Java programming language provides multiple mechanisms for
    communicating between threads. The most basic of these methods is synchronization,
    which is implemented using monitors. Each object in Java is associated with a
    monitor, which thread can lock or unlock. Only one thread at a time may hold a
    lock on a monitor. Any other threads attempting to lock that monitor are blocked
    until they can obtain a lock on that monitor” [JLS 2013], §17.1, “Synchronization”.


    thread-safe An object is is shared by multiple threads without the possibility
    of data races. “A thread-safe object performs synchronization internally, so multiple
    threads can freely access it through its public interface without further synchronization”
    [Goetz 2006]. Immutable classes are thread-safe by definition. Mutable classes
    may also be thread-safe if they are properly synchronized.


    trusted code Code that is loaded by the primordial class loader regardless of
    whether or not it constitutes the Java API. In this text, this meaning is extended
    to include code that is obtained from a known entity and given permissions to
    untrusted code lacks. By this definition, untrusted and trusted code can coexist'
