  md: '# Programming/Java


    > "Every developer has a responsibility to author code that is free of significant
    security vulnerabilities. This book provides realistic guidance to help Java developers
    implement desired functionality with security, reliability, and maintainability
    goals in mind.

    —Mary Ann, Chief Security Officer, Oracle Corporation


    Organizations worldwide rely on Java code to perform mission-critical tasks, and
    therefore that code must be reliable, robust, fast, maintainable, and secure.
    Java Coding Guidelines brings together expert guidelines, recommendations, and
    code examples to help you meet these demands.


    Written by the same team that brought you The CERT Oracle Secure Coding Standard
    for Java, this guide extends previous work''s security expertise to address many
    additional quality attributes.


    You''ll find 75 guidelines, each presented consistently and intuitively. For each
    guideline, conformance requirements are specified; for non,compliant code examples
    and compliant solutions are also offered. The authors explain when to apply each
    guideline and provide references to even more detailed information.


    Reflecting pioneering research on Java security, Java Coding Guidelines offers
    updated techniques for protecting against both deliberate attacks and other unexpected
    events. You''ll find best practices for improving code reliability and clarity,
    and a full chapter exposing common misunderstandings that lead to suboptimal.


    FRED LONG, Senior Lecturer at Abersystwith University''s Department of Computer
    Science, has been a Visiting Scholar at the Software Engineering Institute (SEI)
    since 1992 DHUR MOHINDRA, Technical Lead in the Security Practices Group at Persistent
    Systems Ltd., consults with enterprises in finance, telecom, and healthcare ROBERT
    C. SEACORD, author of several books on computer security and software engineering,
    is Technical Manager of CERT Secure Coding initiative and also teaches computer
    science at Carnegie Mellon University (CMU). DEAN F. SUTHERLAND, CERT Senior Software
    Security Engineer, was a Senior Member of the Technical Staff at Intel, where
    he developed optimizing compilers. DAVID SOBOVA, CERT Software Security Engineer,
    has been primary developer on multiple CMU projects.


