    can be computed so as to avoid introducing compilation errors. A limitation is
    that the result of this computation may lack any resemblance to what the programmer
    intended when the code was written. For example, unused members obviously declared
    private. However, such members could be unused only because the particular body
    of code examined coincidentally lacks references to the members. Nevertheless,
    this computation can provide a useful starting point for a programmer who wishes
    to minimize the accessibility of classes and their members.


