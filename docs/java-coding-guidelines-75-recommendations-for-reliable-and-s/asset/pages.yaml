    \ createSentinel() {\n        // Allocate a sentinel object, setting all its fields\n\
    \        // to carefully chosen \"do nothing\" values\n}\n\n// Elsewhere\nList<DataElement>\
    \ longLivedList = new ArrayList<DataElement>();\n```"
