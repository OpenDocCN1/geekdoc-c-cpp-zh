  md: "# 73. Never confuse the immutability of a reference with that of the referenced\
    \ object 237\n\n```\npoint.print_xy();\n}\n```\n\nThe clone() method returns a\
    \ copy of the original object that reflects the state of the original object at\
    \ the moment of cloning. This new object can be used without exposing the original\
    \ object. Because the caller holds the only reference to the newly cloned instance,\
    \ the instance variables cannot be changed without the caller's cooperation. This\
    \ use of the clone() method allows the class to remain securely mutable. (See\
    \ The CERT® Oracle Secure Coding Standard for Java” [Long 2012], “OBJ04-J: Provide\
    \ mutable classes with copy functionality to safely allow passing instances to\
    \ untrusted code.)\n\nThe Point class is declared final to prevent subclasses\
    \ from overriding the clone() method. This enables the class to be suitably used\
    \ without any inadvertent modifications of the original object.\n\n# Noncompliant\
    \ Code Example (Arrays)\n\nThis noncompliant code example uses a public static\
    \ final array, items:\n\n```\npublic static final String[] items = {*/* . . *\
    \ /};\n```\n\nClients can trivially modify the contents of the array, even though\
    \ declaring the array reference to be final prevents modification of the reference\
    \ itself.\n\n# Compliant Solution (Index Getter)\n\nThis compliant solution makes\
    \ the array private and provides public methods to get individual items and array\
    \ size:\n\n```\nprivate static final String[] items = {*/* . . * /};\npublic static\
    \ final String getItem(int index) {\n    return items[index];\n}\npublic static\
    \ final int getItemCount() {\n    return items.length;\n}\n```\n\nProviding direct\
    \ access to the array objects themselves is safe because String is immutable."
