  md: '# 250 Glossary


    happens-before order "Two actions can be ordered by a happens-before relationship.
    If one action happens-before another, then the first is visible to and ordered
    before the second It should be noted that the presence of a happens-before relationship
    between two actions does not necessarily imply that they have to take place in
    order in an implementation. The reordering produces results consistent with a
    legal execution, it is not illegal... More specifically, if two actions share
    a happens-before relationship, they do not necessarily appear to have happened
    in that order with any code with which they do not share a happens-before relationship.
    Writes in one thread that is in a data race with another thread may, for example,
    appear to occur out of order to those reads" [JLS 2013, 17.4.5, "Happens-before
    Order"]


    heap memory "Memory that be shared between threads is called memory or heap memory...
    All instances, static fields and array elements are stored in memory... Local
    variables, formal method parameters or exception handler parameters are never
    shared between threads and are unaffected by the memory model" [JLS 2013, 17.4.1,
    "Shared Variables"]


    hide One class fields hides a field in a superclass if they have the same identifier.
    The hidden field is not accessible from the class. Likewise, a class method hides
    a method in a superclass if they have the same identifier, and incompatible signatures.
    The hidden method is not accessible from the class. See the JLS, § 8.4.8.2, "Hiding
    (by Class Methods)" for the formal definition. Contrast with override.


    immutable When applied to an object, immutable means that its state cannot be
    changed after being initialized. An object is immutable if


    +   * Its state cannot be modified after construction;

    * All its fields are final;

    * It is properly constructed (the this reference does not escape during construction)
    [Goetz 2006].


    It is technically possible to have an immutable object without all fields being
    final. String is such a class but this relies on delicate reasoning about benign
    data races that requires a deep understanding of the Java Memory Model.


    liveness Every operation or method invocation executes to completion without interruptions,
    even if it goes against safety.


    memory model "The rules that determine how memory accesses are ordered and when
