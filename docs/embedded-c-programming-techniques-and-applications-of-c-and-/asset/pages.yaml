    # Book Synopsis


    This book provides a hands-on introductory course on concepts of C programming
    using a PIC® microcontroller and CCS C compiler. Through a project-based approach,
    this book provides an easy to understand method of learning the correct and efficient
    practices to program a PIC in C language. Principles of C programming are introduced
    gradually, building data and knowledge. Early chapters cover the understanding
    of C language through exercises, while the latter half of the book covers the
    PIC® microcontroller, its peripherals, and how to use those peripherals from within
    C great detail. This book demonstrates the programming methodology and tools used
    by most professionals in embedded design, and will provide a step-by guide to
    the subject matter, this book will encourage you to learn, expand, and customize
    code for use in your own projects. A complete introduction to C programming using
    PIC microcontrollers, with a focus on real-world applications, programming methodology
    and toolsEach chapter includes C project examples, tables, graphs, charts, references,
    photographs, schematic diagrams, flow charts and compiler compatibility notes
    to channel your knowledge into real-world examplesOnline include presentation
    slides, extended tests, exercises, quizzes and answers, real-world case studies,
    videos and weblinks'
