    \ 10;\n    printf(\"Inside call_by_value x = %d after adding 10.\\n\", x);\n}\n\
    \nvoid main()\n{\n    int a=20;\n    printf(\"a = %d before function call_by_value.\\\
    n\", a);\n    call_by_value(a);\n    printf(\"a = %d after function call_by_value.\\\
    n\", a);\n    getch();\n}\n```\n\n## 程序输出：\n\n```\na = 20 before function call_by_value.\n\
    \nInside call_by_value x = 20 before adding 10.\n\nInside call_by_value x = 30\
    \ after adding 10.\n\na = 20 after function call_by_value.\n```\n\n在 main() 中，我们创建了一个整型变量，其值为\
    \ 20。我们先打印 a 的初始值，然后调用函数 call_by_value，并将变量 a 作为实参传入。这个变量 a 随后被复制给函数变量 x。在函数中，我们对\
    \ x 加上 10（并调用了一些打印语句）。当 main() 函数中的下一条语句执行时，会打印变量 a 的值。我们可以看到，调用 call_by_value()\
    \ 函数并没有改变变量 a 的值。\n\n2. **按引用调用：**在这个函数中，函数声明和定义中的参数都是按引用传递的。在函数定义中，形参成为调用函数中实参的别名。\n\
    \n按引用传递参数的方式会将参数的地址复制到形参中。在函数内部，使用该地址来访问调用中的实际实参。这意味着对形参所做的更改会影响传入的实参。\n\n要按引用传递值，参数指针与其他任何值一样被传递给函数。因此，你需要像下面的函数\
    \ swap() 一样，将函数参数声明为指针类型；该函数通过其参数交换所指向的两个整型变量的值。指针变量需要在函数声明和函数定义中指定。\n\n```c\n\
    /* function definition to swap the values */\nvoid swap(int *a, int *b)\n{\n \
    \   int temp;\n    temp = *a;    /* save the value at address a */\n    *a = *b;\
    \      /* put b into a */\n    *b = temp;    /* put temp into b */\n    return;\n\
    }\n```\n\n现在让我们通过以下示例，按引用传递值来调用函数 swap()：\n\n```c\n#include <stdio.h>\n    /*\
    \ function declaration */\n    void swap(int *a, int *b);\n    void main ()\n\
    \    {\n        /* local variable definition */\n        int x = 10;\n       \
    \ int y = 20;\n        printf(\"Before swap, value of x : %d\\n\", x );\n    \
    \    printf(\"Before swap, value of y : %d\\n\", y );\n        /* calling a function\
    \ to swap the values.\n         * &x indicates pointer to x ie. address of variable\
    \ x and\n         * &y indicates pointer to y ie. address of variable y.\n   \
    \      */\n        swap(&x, &y);\n        printf(\"After swap, value of x : %d\\\
    n\", x );\n        printf(\"After swap, value of y : %d\\n\", y );\n        getch();\n\
    \    }\n```\n\n**输出：**\n\n```text\nBefore swap, value of x :10\nBefore swap, value\
    \ of y :20\nAfter swap, value of x :20\nAfter swap, value of y :10\n```\n\n##\
    \ 递归函数\n\n**递归**是一个函数反复调用自身直到满足某个指定条件的过程。函数调用自身即递归。\n\n该过程用于重复计算，其中每个操作都基于前一个结果来表述。\n\
    \n在 C 语言中，递归是一种编程技术，它允许程序员用自身来表达操作。\n\n递归是操作反复调用自身直到满足某个指定条件的过程。该过程用于重复计算，其中每个操作都基于前一个结果来表述。它类似于循环。另一方面，递归使得表达那些需要递归调用的结果才能完成任务的想法变得更加容易。\n\
    \n**一个简单的递归示例如下：**\n\n```c\nvoid recurse()\n{\n    recurse(); /* Function calls\
    \ itself */\n}\nint main()\n{\n    recurse(); /* Sets off the recursion */\n \
    \   return 0;\n}\n```\n\n然而，这个程序不会永远运行下去。计算机会将函数调用保存在堆栈上，一旦调用了太多未结束的函数，程序就会崩溃。\n\
    \n## 识别递归算法的三个部分：\n\n所有递归算法都必须包含以下三个阶段：\n\n- 基线条件：if ( nargin() == 2 ) result\
    \ = a + b;\n- “向基线条件推进”：a+b 成为第一个参数\n  这会将函数的参数个数从 3 个减少到 2 个，而 2 个就是基线条件！\n-\
    \ 递归调用：add_numbers(a+b, c);\n\n在这个算法中，计算机会“记住”问题的每一个先前状态。这些信息由计算机保存在“活动栈”（即每个函数的工作区内）。每次调用函数时，每个函数都有自己的工作区。\n\
    \n## 一个快速示例：\n\n```c\nvoid count_to_ten ( int count )\n{ /* we only keep counting\
    \ if we have a value less than ten*/\n    if ( count < 10 )\n    {\n        count_to_ten(\
    \ count + 1 );\n    }\n}\nint main()\n{\n    count_to_ten( 0 );\n}\n```\n\n这个程序在我们数到十（更准确地说，当\
    \ count 不再小于十）时结束。这是一个很好的基线条件，因为这意味着如果输入的数值大于十，我们会立即停止。如果我们选择在 count 等于十时停止，那么如果函数被输入\
    \ 11 调用，它会在停止之前耗尽内存。\n\n让我们计算一个正整数的阶乘。这个问题可以表示为 n! = 1 x 2 x 3 x ... x n，其中 n\
    \ 是给定的正整数。\n\n我们也可以用另一种方式表达这个问题，即 n! = n x (n - 1)! 这是该问题的递归表述，其中所需的操作（计算 n!）由前一个结果（(n\
    \ - 1)! 的值，假设已知）来表达。\n\n此外，根据定义我们知道 1! = 1。最后这个表达式为递归提供了停止条件。\n\n## 示例\n\n```c\n\
    /* calculate the factorial of an integer quantity using recursion */\n#include<stdio.h>\n\
    long int factorial(int n); /* function prototype */\nvoid main( )\n{\n    int\
    \ n;\n    long int factorial(int n);\n    /* read in the integer value */\n  \
    \  scanf(\"%d\", &n);\n    /* calculate and display the factorial */\n    printf(\"\
    n! = %ld\\n\", factorial(n));\n    getch();\n}\n\n/* function definition */\n\
    long int factorial(int n) /* calculate the factorial */\n{\n    if (n <= 1)\n\
    \        return( 1 );\n    else\n        return(n * factorial(n - 1));\n}\n```\n\
    \n程序的主要部分只是读取整数 n，然后调用长整型递归函数 factorial。函数 factorial 以实参 (n - 1) 递归地调用自身，该实参在每次连续调用中数值逐渐减小。当实参的值变为\
    \ 1 时，递归调用终止。\n\n## 递归方法\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_160_0.png)\n\
    \n程序执行时，函数 factorial 会被反复访问，一次在 main 中，另外 (n - 1) 次在其自身内部，尽管使用该程序的人不会察觉到这一点。只会显示最终答案；例如，\n\
    \nn! = 3628800\n\n当递归程序执行时，递归函数调用不会立即执行。相反，它们会被放入一个*堆栈*，直到遇到终止递归的条件。然后，函数调用按相反的顺序执行，如同从堆栈中“弹出”一样。因此，在递归计算阶乘时，函数调用将按以下顺序进行。\n\
    \nn! = n x (n - 1)!\n(n - 1)! = (n - 1) x (n - 2)!\n(n - 2)! = (n - 2) x (n -\
    \ 3)!\n2! = 2 x 1!\n\n然后，实际值将按以下相反顺序返回。\n\n1! = 1\n2! = 2 x 1! = 2 x 1 = 2\n3!\
    \ = 3 x 2! = 3 x 2 = 6\n4! = 4 x 3! = 4 x 6 = 24\nn! = n x (n - 1)! = ...\n\n\
    这种执行顺序的反转是所有递归执行的函数的一个特征。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_161_0.png)\n\
    \n"
