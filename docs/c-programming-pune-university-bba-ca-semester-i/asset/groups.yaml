    自增和自减运算符不能应用于常量。\n\n```c\nx = 4++; // gives error, because 4 is constant\n```\n\
    \nC 语言包含两个通常在其他计算机语言中找不到的实用运算符，即自增运算符（++）和自减运算符（--）。运算符 ++ 将操作数加 1，而运算符 -- 将操作数减\
    \ 1。\n\n准确地说，\n\n```c\nx = x + 1;      can be written as     x++; and\n\nx = x\
