  md: "\n## Address in C\n\nIf you have a variable **var** in your program, **&var**\
    \ will give you its address in the memory, where **&** is commonly called the\
    \ reference operator or address of operator.\n\nYou must have seen this notation\
    \ while using scanf() function. It was used in the function to store the user\
    \ inputted value in the address of **var**.\n\n```c\nscanf(\"%d\", &var);\n\n\
    /* Example to demonstrate use of reference operator in C programming. */\n#include\
    \ <stdio.h>\nint main()\n{\n        int var = 5;\n        printf(\"Value: %d\\\
    n\", var);\n        printf(\"Address: %u\", &var);  //Notice, the ampersand(&)\
    \ before var.\n        return 0;\n}\n```\n\n**Output:**\n\n```\nValue: 5\n\nAddress:\
    \ 2686778\n```\n\n> **Note:** You may obtain different value of address while\
    \ using this program.\n\nIn above source code, value 5 is stored in the memory\
    \ location 2686778. var is just the name given to that location.\n\n## Address\
    \ of OR Reference Operator (&) and Indirection OR Dereference Operator (*)\n\n\
    **&** is called address of OR reference operator. It gives you the address of\
    \ a variable.\n\nLikewise, there is another operator that gets you the value from\
    \ the address, it is called an indirection OR dereference operator (*).\n\n> **Note:**\
    \ The * sign when declaring a pointer is not a dereference operator. It is just\
    \ a similar notation that creates a pointer.\n\n### Example To Demonstrate Working\
    \ of Pointers\n\n```c\n/* Source code to demonstrate, handling of pointers in\
    \ C program */\n#include <stdio.h>\nint main()\n{\n        int *pc;\n        int\
    \ c;\n        c = 22;\n        printf(\"Address of c:%u\\n\", &c);\n        printf(\"\
    Value of c:%d\\n\", c);\n        pc = &c;\n        printf(\"Address of pointer\
    \ pc:%u\\n\", pc);\n        printf(\"Content of pointer pc:%d\\n\\n\", *pc);\n\
    \        c = 11;\n        printf(\"Address of pointer pc:%u\\n\", pc);\n     \
    \   printf(\"Content of pointer pc:%d\\n\\n\", *pc);\n        *pc = 2;\n     \
    \   printf(\"Address of c:%u\\n\", &c);\n        printf(\"Value of c:%d\\n\\n\"\
    , c);\n        return 0;\n}\n```\n\n**Output:**\n\n```\nAddress of c: 2686784\n\
    Value of c: 22\nAddress of pointer pc: 2686784\nContent of pointer pc: 22\nAddress\
    \ of pointer pc: 2686784\nContent of pointer pc: 11\nAddress of c: 2686784\nValue\
    \ of c: 2\n```\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_171_0.png)\n\n### Explanation\
    \ of Program and Figure\n\n- 1. **`int *pc;`** creates a pointer **pc** and **`int\
    \ c;`** creates a normal variable **c**. Since **pc** and **c** are both not initialized,\
    \ pointer **pc** points to either no address or a random address. Likewise, variable\
    \ **c** is assigned an address but contains a random/garbage value.\n- 2. **`c\
    \ = 22;`** assigns 22 to the variable **c**, i.e., 22 is stored in the memory\
    \ location of variable **c**. Note that, when printing **&c** (address of c),\
    \ we use **%u** rather than **%d** since address is usually expressed as an unsigned\
    \ integer (always positive).\n- 3. **`pc = &c;`** assigns the address of variable\
    \ **c** to the pointer **pc**. When printing, you see value of **pc** is the same\
    \ as the address of **c** and the content of **pc** (`*pc`) is 22 as well.\n-\
    \ 4. **`c = 11;`** assigns 11 to variable **c**. We assign a new value to **c**\
    \ to see its effect on pointer **pc**.\n- 5. Since pointer **pc** points to the\
    \ same address as **c**, value pointed by pointer **pc** is 11 as well. Printing\
    \ the address and content of **pc** shows the updated content as 11.\n- 6. **`*pc\
    \ = 2;`** changes the contents of the memory location pointed by pointer **pc**\
    \ to 2. Since the address of pointer **pc** is same as address of **c**, value\
    \ of **c** also changes to 2.\n\n### Common Mistakes when Working with Pointers\n\
    \nSuppose, you want pointer pc to point to the address of c. Then,\n\n```c\nint\
