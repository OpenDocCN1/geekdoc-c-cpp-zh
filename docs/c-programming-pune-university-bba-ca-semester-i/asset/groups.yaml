    \n### Example\n\n```c\nvoid main()\n{\n    int x = 45;\n    int *ptr_x;\n    ptr_x\
    \ = &x;\n    printf(\"\\nOriginal values: x = %d   ptr_x = %d\", x, ptr_x);\n\
    \    ptr_x--;\n    printf(\"\\nValues after decrementing : x = %d  ptr_x = %d\"\
    , x, ptr_x);\n}\n```\n\nWhen the above code is compiled and executed, it produces\
