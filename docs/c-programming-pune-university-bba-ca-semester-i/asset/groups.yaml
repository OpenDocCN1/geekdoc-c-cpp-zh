    \ the opening and closing braces. The program execution begins at the opening\
    \ brace and ends at the closing brace. The closing brace of the main() function\
    \ is the logical end of the program. All statements in the declaration and executable\
    \ part end with a semicolon, leaving keyword statements.\n\n## 1.3 Language Fundamentals\n\
    \n### 1.3.1 Character Set, Tokens\n\n### Character Set\n\nC uses the uppercase\
    \ letters A to Z, the lowercase letters a to z, the digits 0 to 9, and certain\
    \ special characters as building blocks to form basic program elements (e.g.,\
    \ constants, variables, operators, expressions, etc.).\n\nThe special characters\
    \ are listed below.\n\n**Table 1.1: Character Set**\n\n|   |   |   |   |   |\n\
