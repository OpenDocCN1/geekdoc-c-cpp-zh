  mdcn: "\n\n## C 语言中的地址\n\n如果你的程序中有一个变量 **var**，那么 **&var** 将给出它在内存中的地址，其中 **&**\
    \ 通常被称为引用运算符或取地址运算符。\n\n你在使用 scanf() 函数时一定见过这种写法。它在函数中用于将用户输入的值存储到 **var** 的地址中。\n\
    \n```c\nscanf(\"%d\", &var);\n\n/* Example to demonstrate use of reference operator\
    \ in C programming. */\n#include <stdio.h>\nint main()\n{\n        int var = 5;\n\
    \        printf(\"Value: %d\\n\", var);\n        printf(\"Address: %u\", &var);\
    \  //Notice, the ampersand(&) before var.\n        return 0;\n}\n```\n\n**输出：**\n\
    \n```\nValue: 5\n\nAddress: 2686778\n```\n\n> **注意：** 运行此程序时，你可能会得到不同的地址值。\n\n\
    在上述源代码中，值 5 存储在内存位置 2686778 中。var 只是该位置的名称。\n\n## 取地址或引用运算符 (&) 与间接或解引用运算符 (*)\n\
    \n**&** 被称为取地址（或引用）运算符。它给出变量的地址。\n\n类似地，还有一个从地址获取值的运算符，称为间接（或解引用）运算符 (*)。\n\n\
    > **注意：** 在声明指针时，* 号并不是解引用运算符。它只是一种类似的记号，用于创建指针。\n\n### 演示指针工作的示例\n\n```c\n/*\
    \ Source code to demonstrate, handling of pointers in C program */\n#include <stdio.h>\n\
    int main()\n{\n        int *pc;\n        int c;\n        c = 22;\n        printf(\"\
    Address of c:%u\\n\", &c);\n        printf(\"Value of c:%d\\n\", c);\n       \
    \ pc = &c;\n        printf(\"Address of pointer pc:%u\\n\", pc);\n        printf(\"\
    Content of pointer pc:%d\\n\\n\", *pc);\n        c = 11;\n        printf(\"Address\
    \ of pointer pc:%u\\n\", pc);\n        printf(\"Content of pointer pc:%d\\n\\\
    n\", *pc);\n        *pc = 2;\n        printf(\"Address of c:%u\\n\", &c);\n  \
    \      printf(\"Value of c:%d\\n\\n\", c);\n        return 0;\n}\n```\n\n**输出：**\n\
    \n```\nAddress of c: 2686784\nValue of c: 22\nAddress of pointer pc: 2686784\n\
    Content of pointer pc: 22\nAddress of pointer pc: 2686784\nContent of pointer\
    \ pc: 11\nAddress of c: 2686784\nValue of c: 2\n```\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_171_0.png)\n\
    \n### 程序与图示说明\n\n- 1. **`int *pc;`** 创建了一个指针 **pc**，**`int c;`** 创建了一个普通变量 **c**。由于\
    \ **pc** 和 **c** 都未初始化，指针 **pc** 要么不指向任何地址，要么指向一个随机地址。同样，变量 **c** 被分配了一个地址，但包含一个随机的/垃圾值。\n\
    - 2. **`c = 22;`** 将 22 赋值给变量 **c**，即 22 存储在变量 **c** 的内存位置中。注意，打印 **&c**（c 的地址）时，我们使用\
    \ **%u** 而不是 **%d**，因为地址通常表示为无符号整数（始终为正）。\n- 3. **`pc = &c;`** 将变量 **c** 的地址赋给指针\
    \ **pc**。打印时，你会看到 **pc** 的值与 **c** 的地址相同，同时 **pc** 的内容（`*pc`）也是 22。\n- 4. **`c\
    \ = 11;`** 将 11 赋值给变量 **c**。我们给 **c** 赋一个新值，以观察它对指针 **pc** 的影响。\n- 5. 由于指针 **pc**\
    \ 指向与 **c** 相同的地址，指针 **pc** 所指向的值也是 11。打印 **pc** 的地址和内容会显示更新后的内容为 11。\n- 6. **`*pc\
    \ = 2;`** 将指针 **pc** 所指向的内存位置的内容改为 2。由于指针 **pc** 的地址与 **c** 的地址相同，**c** 的值也变为\
    \ 2。\n\n### 使用指针时的常见错误\n\n假设你想让指针 pc 指向 c 的地址。那么，\n\n```c\nint c, *pc;\n\n// Wrong!\
    \ pc is an address whereas c is not an address.\npc = c;\n\n// Wrong! *pc is the\
    \ value pointed by address whereas &c is an address.\n*pc = &c;\n\n// Correct!\
    \ pc is an address and &c is also an address.\npc = &c;\n\n// Correct! *pc is\
    \ the value pointed by address and c is also a value.\n*pc = c;\n```\n\n在这两种情况下，指针\
    \ pc 都没有指向 c 的地址。\n\n### 7.5 指针算术\n\n指针是保存内存位置的变量，内存位置是一个数字。这意味着可以对指针执行算术运算。可以对指针执行的算术运算有\
    \ ++（自增）、--（自减）、+（加法）和 -（减法）。因此，可以将整数值加到指针变量上或从指针变量中减去，但必须非常小心地解释结果表达式。例如，假设 ptr_x\
    \ 是一个代表某个变量 x 地址的指针变量。我们可以写诸如 ++ptr_x、--ptr_x、(ptr_x + 3)、(ptr_x + i) 和 (ptr_x\
    \ - i) 这样的表达式，其中 i 是一个整型变量。每个表达式都表示一个与 ptr_x 所代表的原始地址相距一定距离的地址。\n\n### 自增/自减\n\
    \n考虑一个指向地址 1450 的整型指针变量 ptr_x。让我们对该变量进行自增（整型数据大小为 16 位，即 2 字节）。\n\n```c\nptr_x++;\n\
    ```\n\n现在指针变量 ptr_x 将指向位置 1452，因为每次 ptr_x 自增时，它都会指向下一个整数位置，该位置在当前位置的 2 字节之后。如果\
    \ ptr_x 指向一个地址为 1000 的字符，那么上述操作将指向位置 1001，因为下一个字符将在 1001 处可用。\n\n### 示例\n\n```c\n\
    void main()\n{\n    int x = 45;\n    int *ptr_x;\n    ptr_x = &x;\n    printf(\"\
    \\nOriginal values: x = %d  ptr_x = %d\", x, ptr_x);\n    ptr_x++;\n    printf(\"\
    \\nValues after incrementing ; x = %d  ptr_x = %d\", x, ptr_x);\n}\n```\n\n编译并执行上述代码后，会产生以下结果\n\
    \n```\nOriginal values: x = 45      ptr_x = 8945\nValues after incrementing :\
    \ x = 45  ptr_x = 8947\n```\n\n类似地，对于自减操作，它会将指针变量的值按其数据类型所占的字节数减少。\n\n### 示例\n\
    \n```c\nvoid main()\n{\n    int x = 45;\n    int *ptr_x;\n    ptr_x = &x;\n  \
    \  printf(\"\\nOriginal values: x = %d   ptr_x = %d\", x, ptr_x);\n    ptr_x--;\n\
    \    printf(\"\\nValues after decrementing : x = %d  ptr_x = %d\", x, ptr_x);\n\
    }\n```\n\n编译并执行上述代码后，会产生以下结果\n\n```\nOriginal values: x = 45      ptr_x = 8945\n\
    Values after decrementing : x = 45  ptr_x = 8943\n```\n\n### 加法/减法\n\n考虑以下示例来演示指针的加法运算，减法运算可以类似地考虑。\n\
    \n```c\nvoid main( )\n{\n    int *ptr_i; /* pointer to an integer */\n    int\
    \ i = 1;\n    ptr_i = &i;\n    printf (\"Value: i=%d \\n\\n\", i);\n    printf\
    \ (\"Address: &i=%X \\n\\n\", &i);\n    printf (\" Pointer value: ptr_i=%X ptr_i\
    \ + 1=%X ptr_i + 2=%X ptr_i + 3=%X\", ptr_i,\n        ptr_i + 1, ptr_i + 2, ptr_i\
