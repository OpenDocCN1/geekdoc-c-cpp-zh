    +   - 8.5 Structure Operations

    +   - 8.6 Nested Structure (Structures within Structures)


    # ## 8.1 Introduction to Structure


    C Structure is a collection of different data types which are grouped together
    and each element in a C structure is called member.


    In a real world scenario, data items under consideration are a collection of things.
    These collections of things can have it''s own attributes. A single structure
    might contain integer elements, floating-point elements and character elements.


    Consider a real world data "book", which is a collection of things like title
    of book, author, publisher, no of pages, etc., all these information''s are dissimilar,
    i.e., author is a string whereas no. of pages is an integer. For dealing with
    such collections, C provides a data type called ''structure''. A structure gathers
    together, different atoms of information that comprise a given entity.


    # ### Uses of Structures in C


    +   1. C Structures can be used to store huge data. Structures act as a database.

    +   2. C Structures can be used to send data to the printer.

    +   3. C Structures can interact with keyboard and mouse to store the data.

    +   4. C Structures can be used in drawing and floppy formatting.

    +   5. C Structures can be used to clear output screen contents.

    +   6. C Structures can be used to check computer''s memory size, etc.


    # ## 8.2 Definition


    Arrays allow to define type of variables that can hold several data items of the
    same kind. Similarly **structure** is another user defined data type available
    in C that allows to combine data items of different kinds.'
