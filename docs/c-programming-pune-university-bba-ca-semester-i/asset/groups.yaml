    \  - 3.4.4 exit\n\n### 3.1 引言\n\n**决策：** 它是指从多个可用选项中选出其中一个。在编写程序时，这一概念始终会发挥重要作用。我们必须为程序提供相应能力，使其能够根据用户可能提供的各种输入自行做出决策。\n\
    \n决策是指根据特定条件决定语句的执行顺序，或重复执行一组语句，直到满足某些指定条件。我们可以根据条件执行不同的任务。C 语言通过多种方式处理决策，如下所示。\n\
    \n**if...else 语句的流程图**\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_52_0.png)\n\
    \n**图 3.2：if... else 语句的流程图**\n\n**示例：C if...else 语句**\n\n```c\n// Program to\
    \ check whether an integer entered by the user is odd or even\n#include <stdio.h>\n\
    void main()\n{\n    int number;\n    printf(\"Enter an integer: \");\n    scanf(\"\
    %d\", &number);\n    // True if remainder is 0\n    if( number%2 == 0 )\n    \
    \    printf(\"%d is an even integer.\", number);\n    else\n        printf(\"\
    %d is an odd integer.\", number);\n    return 0;\n}\n```\n\n**输出：**\n\nEnter an\
    \ integer: 7  \n7 is an odd integer.\n\n当用户输入 7 时，测试表达式（**number%2 == 0**）的求值结果为假。因此，会执行\
    \ **else 语句** 主体内的语句 **printf(\"%d is an odd integer.\",number);**，而 if 主体内的语句会被跳过。\n\
    \n**3.2.3 嵌套 if-else 语句**\n\n*if...else* 语句根据测试表达式为真还是为假来执行两种不同的代码。有时，需要从两个以上的可能性中做出选择。\n\
    \n嵌套 *if...else* 语句允许你检查多个测试表达式，并为两个以上的条件执行不同的代码。\n\n**嵌套 if...else 语句的语法。**\n\
    \n```c\nif (testExpression1)\n{\n    // statements to be executed if testExpression1\
    \ is true\n}\nelse if(testExpression2)\n{\n    // statements to be executed if\
    \ testExpression1 is false and testExpression2 is true\n}\nelse if (testExpression3)\n\
    {\n    // statements to be executed if testExpression1 and testExpression2 is\
    \ false and testExpression3 is true\n}\n.\n.\nelse\n{\n    // statements to be\
    \ executed if all test expressions are false\n}\n```\n\n**使用“if/else if”语句进行多路决策的形式如下：**\n\
    \n```c\nif (logical expression)\nstmt1;\nelse if (logical expression)\nstmt2;\n\
    else if (logical expression)\nstmt3;\nelse if ( logical expression )\nstmtN;\n\
    else\nstmtF;\n```\n\n如果第一个逻辑表达式的求值结果为真，则执行 stmtT1。如果第二个逻辑表达式为真，则执行 stmtT2，依此类推。如果所有逻辑表达式都不为真，则执行“else”之后的语句，即\
    \ stmtF。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_54_0.png)\n\n使用“嵌套 if”进行多路决策的形式如下：\n\
    \n```c\nif (conditionA)\n{\n    if (conditionB)\n    stmtBT;\n    else\n     \
