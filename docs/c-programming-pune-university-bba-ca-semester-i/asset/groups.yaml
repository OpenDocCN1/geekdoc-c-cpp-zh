    \ the memory of the size specified. This requires the reader to think about the\
    \ size argument to copy. When doing a straight assignment, there is no hesitation\
    \ about whether or not the size is correct.\n\nThe dangerous part of structure\
    \ assignment is when the structure element is a pointer. Copying structures that\
    \ contain pointers can be a bit dangerous, since by doing so those pointers are\
    \ aliased, typically making it ambiguous who owns the pointer after the copying\
    \ operation. If the structure has char * pointing to a specific string, both structures\
    \ will point to the same string. Changing the contents of one of those string\
    \ fields will change the other as well.\n\nTo overcome this, copy the entire contents\
    \ of the structure and then deep copy the string by effectively giving a separate\
    \ string to each structure.\n\nThing to remember while using structure assignment\n\
    \n- Recommend using straight assignment `=` instead of `memcpy`.\n- If structure\
    \ has pointer or array member, please consider the pointer alias problem, it will\
    \ lead to dangling pointer once incorrect use. Better way is to implement structure\
    \ assignment function in C\n\n### Array of Structures\n\nStructure is used to\
    \ store the information of one particular object but if we need to store such\
    \ 100 objects then Array of Structure is used.\n\nWhat is meant by array of structures?\
    \ It is an array in which each element is a structure itself. Let's understand\
    \ this using an example\n\n```c\nstruct author\n{\n    char first_name[15];\n\
    \    char last_name[15];\n};\nstruct book\n{\n    char title[20];\n    struct\
    \ author book_author;\n    int no_of_pages;\n    float cost;\n} books[50];\n```\n\
    \nIn this declaration books is a 50 elements array of structure. Each element\
    \ of books is a separate structure to type book. Each structure of type book in\
    \ turn includes an array (title) and another structure (author) as members. This\
    \ shows how an array and a structure is embedded in another structure, which itself\
    \ is an element of an array.\n\nAn alternate way to define an array of structure\
    \ book is shown below\n\n```c\nstruct author\n{\n    char first_name[15];\n  \
    \  char last_name[15];\n};\nstruct book\n{\n    char title[20];\n    struct author\
    \ book_author;\n    int no_of_pages;\n    float cost;\n};\nstruct book books[50];\n\
    ```\n\nAn array of structure can be initialized just the way as any other array.\
    \ Consider the following declarations\n\n```c\nstruct author\n{\n        char\
    \ first_name[15];\n        char last_name[15];\n};\nstruct author author_list[]={\
    \ \"Kiran\", \"Gurbani\"};\n```\n\nAs seen in this example, the size of the array\
    \ of structure is not specified. The initial values will define the size of the\
    \ array and amount of memory required to store the array.\n\nThe use of the period\
    \ operator can be extended to arrays of structures, by writing `array[expression].member`\
    \ where array refers to the array name, and `array[expression]` is an individual\
    \ array element (a structure variable). Therefore `array[expression].member` will\
    \ refer to a specific member within a particular structure.\n\nFor the above example,\
    \ author_list is an array of structures of type author. To access its second element\
    \ use the expression author_list[1].\n\nLet's consider the following example\n\
    \n```c\nstruct author\n{\n        char first_name[15];\n        char last_name[15];\n\
    };\nstruct book\n{\n        char title[20];\n        struct author book_author;\n\
    \        int no_of_pages;\n        float cost;\n} books[5];\n```\n\nThe following\
    \ table gives expression showing how the various members and submembers of the\
    \ structure variable can be accessed.\n\n| Expression | Explanation |\n|---|---|\n\
    | `books[1].title` | Access the title member for the second book |\n| `&books[1].title`\
    \ | Access the address of title member within the second book structure |\n| `books[1].title[3]`\
    \ | Access the 3rd character within book’s title |\n| `books[1].book_author.first_name`\
    \ | Access the first name member of structure of type author within the structure\
    \ book |\n| `++books[1].no_of_pages` | Causes the value of no_of_pages to increment\
    \ |\n"
  mdcn: "\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_186_0.png)\n\n## 结构体\n\n###\
    \ 结构体：\n\n- 8.1 结构体简介\n- 8.2 定义\n- 8.3 声明\n- 8.4 访问成员\n- 8.5 结构体操作\n- 8.6 嵌套结构体（结构体中的结构体）\n\
    \n### 8.1 结构体简介\n\nC 结构体是不同类型数据的集合，这些数据被组合在一起，C 结构体中的每个元素称为成员。\n\n在现实世界场景中，所考虑的数据项是事物的集合。这些事物集合可以有自己的属性。单个结构体可能包含整数元素、浮点元素和字符元素。\n\
    \n考虑一个现实世界的数据“书”，它是书名、作者、出版商、页数等事物的集合，所有这些信息都不相同，即作者是字符串，而页数是整数。为处理此类集合，C 提供了一种称为“结构体”的数据类型。结构体将构成给定实体的不同信息单元聚集在一起。\n\
    \n### C 中结构体的用途\n\n- 1. C 结构体可用于存储大量数据。结构体充当数据库。\n- 2. C 结构体可用于向打印机发送数据。\n- 3.\
    \ C 结构体可与键盘和鼠标交互以存储数据。\n- 4. C 结构体可用于绘图和软盘格式化。\n- 5. C 结构体可用于清除输出屏幕内容。\n- 6. C\
    \ 结构体可用于检查计算机内存大小，等等。\n\n### 8.2 定义\n\n数组允许定义可保存多个同类数据项的变量类型。类似地，**结构体**是 C 中可用的另一种用户定义数据类型，允许组合不同类型的数据项。\n\
    \n让我们看一个例子\n\n```c\nstruct book {\n    char title[20];\n    char author[40];\n\
    \    int no_of_pages;\n    float cost;\n} cprog, basicprog;\n```\n\n因此 cprog 和\
    \ basicprog 是 book 类型的结构体变量。由于结构体和结构体变量的声明合并在一起，可以省略标记。\n\n在声明结构体类型时请注意以下几点：\n\
    \n- 结构体类型声明中的右花括号后必须跟一个分号。\n- 重要的是要理解，结构体类型声明并不会告诉编译器在内存中保留任何空间。它只定义结构体的“形式”。\n\
    - 通常，结构体类型声明出现在源代码文件顶部，位于定义任何变量或函数之前。在非常大的程序中，它们通常放在单独的头文件中，并在需要该结构体类型的任何程序中使用（通过预处理指令\
    \ #include）包含该文件。\n\n### 8.4 访问成员\n\n结构体的成员可以被单独访问和处理。可以通过编写以下语句来访问\n\n```\ninstance\
    \ variable.member\n```\n\n其中 instance variable 指结构体类型变量，member 指成员名称。注意，句点（.）将变量名与成员名分隔开。\n\
    \n考虑以下结构体\n\n```c\nstruct book\n{\n    char title[20];\n    char author[40];\n\
    \    int no_of_pages;\n    float cost;\n} cprog;\n```\n\n这里结构体实例变量是 cprog，要访问\
    \ cprog 的 title 和 author 名称，请使用以下代码\n\n```\ncprog.title\ncprog.author\n```\n\n\
    句点运算符具有最高优先级。因此，该运算符将优先于一元运算符以及其他二元运算符。这意味着，形如 `++variable.member` 的表达式等价于 `++(variable.member)`；即，`++`\
    \ 运算符将作用于结构体成员，而不是整个结构体变量。类似地，表达式 `&instance variable.member` 等价于 `&(variable.member)`；因此，该表达式访问的是结构体成员的地址，而不是结构体变量的起始地址。\n\
    \n### 8.5 结构体操作\n\n在 C 中，可应用于 struct 变量的唯一操作是赋值。不允许对 struct 变量进行任何其他操作。\n\n###\
    \ 结构体赋值\n\n通常，结构体变量*可以像*任何普通变量一样被处理吗？特别是当一个结构体变量的值需要赋给另一个结构体变量时。嗯，这是一项复杂的任务。让我们试着理解。考虑以下结构体定义。\n\
    \n```c\nstruct car\n{\n        char manufacturer[50];\n        char model[10];\n\
    \        int cost;\n};\n```\n\n如果两个变量 c1 和 c2 是 car 类型的结构体变量，并且要相互赋值，那么有三种不同方式可以完成\n\
    \n- 1. **逐个赋值成员**\n  \n  `c1.manufacturer = c2.manufacturer`\n  \n  `c1.model\
    \ = c2.model`\n  \n  `c1.cost = c2.cost`\n- 2. **将 c2 的整个内存内容复制到 c1**\n  \n  `memcpy(&c1,\
    \ &c2, sizeof(c1));`\n- 3. **使用‘=’直接赋值**\n  \n  `c1 = c2;`\n\n如上所示，如果程序员使用第一种方法，那将是愚蠢的编程。因此显然他们会更喜欢使用第\
    \ 2 种或第 3 种结构体赋值方式。但区别是什么？有什么缺点吗？\n\n使用直接赋值‘=’技术复制结构体变量可能是最好的，因为它更短、更易读，并且具有更高的抽象层次。而另一种技术对编译器更友好，它只是复制指定大小的内存。这要求读者考虑要复制的尺寸参数。进行直接赋值时，无需担心大小是否正确。\n\
    \n结构体赋值的危险部分在于结构体元素是指针时。复制包含指针的结构体可能有点危险，因为这样做会使那些指针成为别名，通常会导致在复制操作后不清楚谁拥有该指针。如果结构体有一个\
    \ char * 指向特定字符串，那么两个结构体都将指向同一个字符串。更改其中一个字符串字段的内容也会更改另一个。\n\n为克服这一点，请复制结构体的全部内容，然后通过对每个结构体有效提供单独字符串的方式来深拷贝字符串。\n\
    \n使用结构体赋值时要记住的事项\n\n- 建议使用直接赋值 `=` 而不是 `memcpy`。\n- 如果结构体有指针或数组成员，请考虑指针别名问题，一旦使用不当将导致悬空指针。更好的方式是在\
    \ C 中实现结构体赋值函数\n\n### 结构体数组\n\n结构体用于存储某一个特定对象的信息，但如果我们需要存储 100 个这样的对象，则使用结构体数组。\n\
    \n结构体数组是什么意思？它是一个数组，其中每个元素本身就是一个结构体。让我们通过一个例子来理解\n\n```c\nstruct author\n{\n \
    \   char first_name[15];\n    char last_name[15];\n};\nstruct book\n{\n    char\
    \ title[20];\n    struct author book_author;\n    int no_of_pages;\n    float\
    \ cost;\n} books[50];\n```\n\n在此声明中，books 是一个包含 50 个元素的结构体数组。books 的每个元素都是 book\
    \ 类型的单独结构体。每个 book 类型的结构体又包含一个数组（title）和另一个结构体（author）作为成员。这展示了数组和结构体如何嵌入另一个结构体中，而该结构体本身又是数组的一个元素。\n\
    \n定义 book 结构体数组的另一种方式如下所示\n\n```c\nstruct author\n{\n    char first_name[15];\n\
    \    char last_name[15];\n};\nstruct book\n{\n    char title[20];\n    struct\
    \ author book_author;\n    int no_of_pages;\n    float cost;\n};\nstruct book\
    \ books[50];\n```\n\n结构体数组可以像任何其他数组一样初始化。考虑以下声明\n\n```c\nstruct author\n{\n  \
    \      char first_name[15];\n        char last_name[15];\n};\nstruct author author_list[]={\
    \ \"Kiran\", \"Gurbani\"};\n```\n\n如本例所示，未指定结构体数组的大小。初始值将定义数组的大小以及存储该数组所需的内存量。\n\
    \n句点运算符的用法可以扩展到结构体数组，通过编写 `array[expression].member`，其中 array 指数组名，`array[expression]`\
    \ 是单个数组元素（一个结构体变量）。因此 `array[expression].member` 将引用特定结构体中的特定成员。\n\n对于上面的示例，author_list\
    \ 是 author 类型的结构体数组。要访问其第二个元素，请使用表达式 author_list[1]。\n\n让我们考虑以下示例\n\n```c\nstruct\
    \ author\n{\n        char first_name[15];\n        char last_name[15];\n};\nstruct\
    \ book\n{\n        char title[20];\n        struct author book_author;\n     \
    \   int no_of_pages;\n        float cost;\n} books[5];\n```\n\n下表给出了表达式，展示如何访问结构体变量的各个成员和子成员。\n\
    \n| 表达式 | 说明 |\n|---|---|\n| `books[1].title` | 访问第二本书的 title 成员 |\n| `&books[1].title`\
    \ | 访问第二本书结构体中 title 成员的地址 |\n| `books[1].title[3]` | 访问该书标题中的第 3 个字符 |\n| `books[1].book_author.first_name`\
    \ | 访问 book 结构体中 author 类型结构体的 first_name 成员 |\n| `++books[1].no_of_pages` | 使\
    \ no_of_pages 的值递增 |\n\n"
