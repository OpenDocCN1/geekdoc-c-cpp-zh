    \ have the following initial values.\n\n| item[0][0] = 34 | item[0][1] = 12 |\
    \ item[1][0] = 34 | item[1][1] = 12 |\n|---|---|---|---|\n| item[2][0] = 0 | item[2][1]\
    \ = 0 | item[3][0] = 0 | item[3][1] = 0 |\n\n**Fig. 5.5: Contents of the Array\
    \ Items**\n\nThe initial value is applied to the last subscript. Without the inner\
    \ pair of braces, the initial values cannot be grouped for assignment of specific\
    \ rows. Similarly also remember that the number of values in each inner pair of\
    \ braces should not exceed the defined array size.\n\n## 5.7 Matrices: Addition,\
