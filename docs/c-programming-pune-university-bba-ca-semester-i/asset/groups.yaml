    \n    int a, c = 5, d;\n\n### 1.4.2 Precedence and Associativity\n\n### C Operator\
    \ Precedence Table\n\nThis page lists C operators in order of *precedence* (highest\
    \ to lowest). Their *associativity* indicates in what order operators of equal\
    \ precedence in an expression are applied.\n\n| Operator | Description | Associativity\
    \ |\n| --- | --- | --- |\n| ( ) | Parentheses (function call) (see Note 1) | left-to-right\
    \ |\n| [ ] | Brackets (array subscript) | left-to-right |\n| . | Member selection\
    \ via object name | left-to-right |\n| -> | Member selection via pointer | left-to-right\
    \ |\n| ++ -- | Postfix increment/decrement (see Note 2) | left-to-right |\n| ++\
    \ -- | Prefix increment/decrement | right-to-left |\n| + - | Unary plus/minus\
    \ | right-to-left |\n| ! ~ | Logical negation/bitwise complement | right-to-left\
    \ |\n| (type) | Cast (convert value to temporary value of type) | right-to-left\
    \ |\n| * | Dereference | right-to-left |\n| & | Address (of operand) | right-to-left\
    \ |\n| sizeof | Determine size in bytes on this implementation | right-to-left\
    \ |\n| * / % | Multiplication/Division/Modulus | left-to-right |\n| + - | Addition/Subtraction\
    \ | left-to-right |\n| << >> | Bitwise shift left, Bitwise shift right | left-to-right\
    \ |\n| < <= | Relational less than/less than or equal to | left-to-right |\n|\
    \ > >= | Relational greater than/greater than or equal to | left-to-right |\n\
    | == != | Relational is equal to/is not equal to | left-to-right |\n| & | Bitwise\
    \ AND | left-to-right |\n| ^ | Bitwise exclusive OR | left-to-right |\n| \\| |\
    \ Bitwise inclusive OR | left-to-right |\n| && | Logical AND | left-to-right |\n\
    | \\|\\| | Logical OR | left-to-right |\n| ?: | Ternary conditional | right-to-left\
    \ |\n| = += -= *= /= %= &= ^= \\|= <<= >>= | Assignment; Addition/Subtraction\
    \ assignment; Multiplication/Division assignment; Modulus/Bitwise AND assignment;\
    \ Bitwise exclusive/inclusive OR assignment; Bitwise shift left/right assignment\
    \ | right-to-left |\n| , | Comma (separate expressions) | left-to-right |\n\n\
    **Note 1:** Parentheses are also used to group sub-expressions to force a different\
    \ precedence; such parenthetical expressions can be nested and are evaluated from\
    \ inner to outer.\n\n**Note 2:** Postfix increment/decrement have high precedence,\
    \ but the actual increment or decrement of the operand is delayed (to be accomplished\
    \ sometime before the statement completes execution). So in the statement `y =\
    \ x * z++;` the current value of `z` is used to evaluate the expression (i.e.,\
    \ `z++` evaluates to `z`) and `z` is only incremented after all else is done.\
    \ See postinc.c for another example.\n\n### Notes\n\nPrecedence and associativity\
    \ are independent from order of evaluation.\n\nThe C language standard doesn't\
    \ specify operator precedence. It specifies the language grammar, and the precedence\
    \ table is derived from it to simplify understanding. There is a part of the grammar\
    \ that cannot be represented by a precedence table: assignment is never allowed\
    \ to appear on the right hand side of a conditional operator, so `e = a < d ?\
    \ a++ : a = d` is an expression that cannot be parsed, and therefore relative\
    \ precedence of conditional and assignment operators cannot be described easily.\n\
    \nHowever, many C compilers use non-standard expression grammar where `?:` is\
    \ designated higher precedence than `=`, which parses that expression as `e =\
    \ ( (( a < d ) ? (a++) : a ) = d )`, which then fails to compile due to semantic\
    \ constraints: `?:` is never lvalue and `=` requires a modifiable lvalue on the\
    \ left. This is the table presented on this page.\n\nNote that this is different\
    \ in C++, where the conditional operator has the same precedence as assignment.\n"
