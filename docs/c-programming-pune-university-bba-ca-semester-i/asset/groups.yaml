    \ 1.4.2 优先级和结合性\n\n### C 运算符优先级表\n\n本页按*优先级*（从高到低）列出 C 运算符。它们的*结合性*指示表达式中相同优先级的运算符按什么顺序应用。\n\
    \n| 运算符 | 描述 | 结合性 |\n| --- | --- | --- |\n| ( ) | 圆括号（函数调用）（见注 1） | 从左到右 |\n\
