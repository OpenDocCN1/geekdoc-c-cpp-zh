    +   1. **Documentation section:** The documentation section consists of single
    and multiple line comments and this section is a user section and not complied
    by compiler or complied by compiler.

    +   2. **Link section:** The link section provides instructions to the compiler
    to link functions from the system library. In this we specify header files to
    be included, which consist of function prototypes in respective header files.

    +   3. **Definition section:** The definition section defines all symbolic constants.
    In this, we have to specify constants which can not be changed throughout the
    program.

    +   4. **Global declaration section:** There are some variables that are used
    in more than one function. Such variables are called global variables and are
    declared in the global declaration section that is outside of all the functions.
    This section also declares all the user-defined functions.

    +   5. **main() function section:** Every C program must have one main function
    section. This section contains two parts; declaration part and executable part.

    +      (a) **Local declaration part:** The declaration part declares all the variables
    used in the executable part.

    +      (b) **Executable part:** There is at least one statement in the executable
    part. These two parts must appear between the opening and closing braces. The
    program execution begins at the opening brace and ends at the closing brace. The
    closing brace of the main function is the logical end of the program. All statements
    in the declaration and executable part, end with a semicolon.

    +   6. **Subprogram section:** The subprogram section contains all the user-defined
    functions that are called in the main() function. User-defined functions are generally
    placed immediately after the main() function, although they may appear in any
    order.


    # When function is called the following steps will be executed.


    +   1. When function is called, control is transferred to the first statement
