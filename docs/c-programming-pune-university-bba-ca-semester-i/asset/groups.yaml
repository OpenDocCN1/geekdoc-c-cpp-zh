    , number1, number2);\n    }\n    getch( );\n}\n```\n\n**switch 语句的修订形式如下：**\n\n\
    ```c\nswitch (int expression)\n{\ncase label - 1:\n    stmt-list-1;\n    break;\n\
    case label - 2:\n    stmt-list-2;\n    break;\ncase label - 3:\n    stmt-list-3;\n\
    \    break;\n.\n.\n.\ncase label - n:\n    stmt-list-n;\n    break;\ndefault:\n\
    \    stmt-list;\n}\n```\n\n在执行过程中，会对表达式求值。如果表达式的值与 label - 1 匹配，则执行 stmt-list-1。如果不匹配，执行会继续检查\
    \ label - 2，依此类推。如果没有标签与表达式匹配，则执行 default。在每个 case 内部以及每个语句列表的末尾（default 除外）都必须有一个\
    \ break 语句，用于终止最内层封闭的 switch 或循环语句。\n\n以下是关于 switch 语句的一些最终说明：被测试的表达式必须产生整数值（int\
