    \n### 说明\n\n优先级和结合性与求值顺序无关。\n\nC 语言标准并未规定运算符优先级。它规定了语言文法，而优先级表是从中推导出来以简化理解的。有一部分文法无法用优先级表表示：赋值永远不允许出现在条件运算符的右侧，因此\
