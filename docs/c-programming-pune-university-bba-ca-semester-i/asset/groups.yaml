    \ great\");\n}\nprintf(\"Dynamically allocated memory content : \" \\\n\"%s\\\
    n\", mem_allocation);\nfree(mem_allocation);\n}\n```\n\n**输出：**\n\n**Dynamically\
    \ allocated memory content : God is great**\n\n### 2. calloc()\n\ncalloc() 函数类似于\
    \ malloc() 函数，但 calloc() 会将分配的内存初始化为零，而 malloc() 不会。\n\n- 通过使用 calloc()，我们可以在初始阶段动态创建内存。\n\
    - calloc() 需要两个参数：count 和 size type。\n- Count 提供元素数量；size type 是数据类型的大小。\n- calloc()\
    \ 将以块格式创建内存。\n- 内存的初始值为零。\n\n### Calloc()\n\n“calloc” 这个名字代表“连续分配”。\n\nmalloc()\
    \ 和 calloc() 之间的唯一区别是，malloc() 分配单个内存块，而 calloc() 分配多个大小相同的内存块，并将所有字节设置为零。\n\n\
    ### calloc() 的语法\n\n```c\nptr = (cast-type*)calloc(n, element-size);\n```\n\n\
    该语句将为包含 n 个元素的数组分配连续的内存空间。例如：\n\n```c\nptr = (float*) calloc(25, sizeof(float));\n\
    ```\n\n该语句为 25 个元素的数组分配连续的内存空间，每个元素为 float 类型，即 4 字节。\n\n### calloc() 示例：\n\n\
    ```c\n#include <stdio.h>\n#include <string.h>\n#include <stdlib.h>\n\nint main()\n\
    {\n    char *mem_allocation;\n\n    /* memory is allocated dynamically */\n  \
    \  mem_allocation = calloc( 20, sizeof(char) );\n```\n\n```c\nprintf(\"Enter size\
    \ of array: \");\nscanf(\"%d\", &n1);\nptr = (int*) malloc(n1 * sizeof(int));\n\
    printf(\"Address of previously allocated memory: \");\nfor(i = 0; i < n1; ++i)\n\
    \    printf(\"%u\\t\", ptr + i);\nprintf(\"\\nEnter new size of array: \");\n\
    scanf(\"%d\", &n2);\nptr = realloc(ptr, n2);\nfor(i = 0; i < n2; ++i)\n    printf(\"\
    %u\\t\", ptr + i);\nreturn 0;\n}\n```\n\n输出：\n\n214\n\n### 4. free()\n\nfree()\
    \ 函数释放由 malloc()、calloc()、realloc() 函数分配的内存，并将内存返回给系统。\n\n#### free()\n\n使用 calloc()\
    \ 或 malloc() 创建的动态分配内存不会自行释放。你必须显式使用 free() 来释放空间。\n\n#### free() 的语法\n\n```c\n\
    free(ptr);\n```\n\n该语句释放由 **ptr** 指向的内存中分配的空间。\n\n```c\n#include <stdio.h>\n#include\
    \ <string.h>\n#include <stdlib.h>\n\nvoid main()\n{\n    char *mem_allocation;\n\
    \n    /* memory is allocated dynamically */\n    mem_allocation = malloc( 20 *\
    \ sizeof(char) );\n    if( mem_allocation == NULL )\n    {\n        printf(\"\
    Couldn't allocate requested memory\\n\");\n    }\n    else\n    {\n        strcpy(\
    \ mem_allocation, \" God is great \");\n    }\n    printf(\"Dynamically allocated\
    \ memory content : \\\" %s\\\"\\n\", mem_allocation );\n    mem_allocation = realloc(mem_allocation,\
    \ 100 * sizeof(char));\n```\n\n还有更多可用于动态内存分配的函数。请参见下表。\n\n| 序号 | 函数 | 语法 | 用途\
    \ |\n|---|---|---|---|\n| 1 | calloc() | `calloc(number, sizeof(int));` | calloc()\
    \ 函数类似于 malloc() 函数。但 calloc() 会将分配的内存初始化为零，而 malloc() 不会。 |\n| 2 | realloc()\
    \ | `realloc(pointer_name, number * sizeof(int));` | realloc() 函数将 malloc() 和\
    \ calloc() 函数分配的内存大小修改为新的大小。 |\n| 3 | free() | `free(pointer_name);` | free()\
    \ 函数释放由 malloc()、calloc()、realloc() 函数分配的内存，并将内存返回给系统。 |\n\n### 7.6.6 C 语言中静态内存分配与动态内存分配的区别\n\
    \n| 静态内存分配 | 动态内存分配 |\n|---|---|\n| 在静态内存分配中，内存是在编写 C 程序时分配的。实际上，用户请求的内存将在编译时分配。\
    \ | 在动态内存分配中，内存是在程序执行期间分配的。也就是说在运行时。 |\n| 执行期间无法修改内存大小。<br>示例：数组 | 执行期间可以修改内存大小。<br>示例：链表\
    \ |\n\n### 7.6.7 C 语言中 malloc() 和 calloc() 函数的区别\n\n| malloc() | calloc() |\n\
    |---|---|\n| 它只分配一个请求的内存块。 | 它分配多个请求的内存块。 |\n| 语法：<br>`(cast_type *)malloc(size_in_bytes);`\
    \ | 语法：<br>`(cast_type *)calloc(blocks, size_of_block);` |\n| `int *ptr;`<br>`ptr\
    \ = malloc(20 * sizeof(int));`<br>对于上述情况，20*4 字节的内存仅在一个块中分配。<br>总计 = 80 字节 | `int\
    \ *ptr;`<br>`ptr = calloc(20, 20 * sizeof(int));`<br>对于上述情况，将创建 20 个内存块，每个包含 20*4\
    \ 字节的内存。<br>总计 = 1600 字节 |\n| malloc() 不会初始化分配的内存。它包含垃圾值。 | calloc() 会将分配的内存初始化为零。\
    \ |\n| 由于该函数返回 void 指针，因此必须进行类型转换。<br>`int *ptr;`<br>`ptr = (int*)malloc(sizeof(int)*20);`\
    \ | 与 malloc() 函数相同。<br>`int *ptr;`<br>`ptr = (int*)calloc(20, 20 * sizeof(int));`\
    \ |\n| malloc() 使用垃圾值初始化分配的内存。 | calloc() 使用 0 值初始化分配的内存。 |\n| 参数数量为 1。 | 参数数量为\
    \ 2。 |\n\n## 7.7 函数与指针\n\n### 7.7.1 指针作为函数参数\n\n函数也可以将指针作为参数。这允许访问调用函数内部程序的数据项，对其进行修改，然后将新的变化反映到所传递的数据项中并返回给调用函数。这种指针的使用被称为按引用（地址/位置）传递参数。[回顾：在前面关于函数的章节中讨论过按值传递参数]。\n\
    \n当参数按值传递时，数据项在函数中被复制，对其所做的任何更改都不会反映在调用函数中。然而，当参数按引用传递时，数据项的地址被传入函数，所做的任何更改/修改都将反映在函数和调用函数中。因此，使用指针作为函数参数允许在函数内部全局修改相应的数据项。\n\
    \n当指针用作函数的参数时，每个形式指针参数前都必须加一个星号。函数原型也以相同方式编写。如果函数声明不包含变量名，则每个指针参数的数据类型后必须跟一个星号。\n\
    \n*示例*\n\n```c\nvoid show_int(int x, int y);        //function prototype\nvoid\
    \ show_int1(int *pt_x, int *pt_y);\n\nvoid main()\n{\n        int x = 56;\n  \
    \      int y = 75;\n        printf(\"\\n Original values: x=%d, y=%d\", x, y);\n\
    \        show_int(x,y);\n        printf(\"\\n Values of x and y after calling\
    \ show_int(): x=%d, y=%d\", x, y);\n        show_int1(&x, &y);\n        printf(\"\
    \\n Values of x and y after calling show_int1(): x=%d, y=%d\", x, y);\n}\n\nvoid\
    \ show_int(int x, int y)\n{\n        x=y=1;\n        printf(\"\\n\\n Values of\
    \ x and y inside show_int(): x=%d, y=%d\", x, y);\n}\n\nvoid show_int1(int *pt_x,\
    \ int *pt_y)\n{\n        *pt_x=*pt_y=1;\n        printf(\"\\n\\n Values of x and\
    \ y inside show_int1(): *pt_x=%d, *pt_y=%d\", *pt_x, *pt_y);\n}\n```\n\n如上程序所示，有两个函数\
    \ show_int() 和 show_int1() 接受两个参数。第一个函数 show_int() 接受两个整数参数并将其值修改为 1。但这些更改不会反映在\
    \ main() 中，因为这些参数是按值传递的。对参数所做的更改仅限于发生更改的函数内部。\n\n"
