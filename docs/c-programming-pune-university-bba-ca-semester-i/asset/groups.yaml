    # # Introduction to Pointer


    # Structure:


    +   7.1 Definition

    +   7.2 Declaration

    +   7.3 Initialization

    +   7.4 Indirection Operator and Address of Operator

    +   7.5 Pointer Arithmetic

    +   7.6 Dynamic Memory Allocation

    +   7.7 Functions and Pointers


    # ## 7.1 Definition


    A pointer is a variable that store memory address or that contains address of
    another variable where addresses are the location number always contains whole
    number. So, pointer contain always the whole number. It is called pointer because
    it points to a particular location in memory by storing address of that location.


    # Syntax


    ```

    Data type *pointer name;

    ```


    Here * before pointer indicate the compiler that variable declared as a pointer.


    e.g.,


    ```

    int *p1; //pointer to integer type

    float *p2; //pointer to float type

    char *p3; //pointer to character type

    ```


    When pointer declared, it contains garbage value i.e. it may point any value in
    the memory.


    # ## 7.2 Declaration


    Pointer variables, like all other variables, must be declared before they may
    be used in a C program. The interpretation of a pointer declaration differs; however,
    from the interpretation of other variable declarations. When a pointer variable
    is declared, the variable name must be preceded by an asterisk (*). This identifies
    the fact that the variable is a pointer. The data type that appears in the declaration
    refers to the object of the pointer, i.e., the data item that is stored in the
    address represented by the pointer, rather than the pointer itself'
