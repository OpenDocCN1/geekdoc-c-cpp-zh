    \ 2 3 4 5\n\n**步骤 1：** 首先，计数器变量 count 被初始化为值 1，然后对它进行条件测试。\n\n**步骤 2：** 如果条件为真，则执行\
    \ while 循环的循环体；否则，控制流跳出循环。\n\n**步骤 3：** 使用 ++ 运算符递增 count 的值，然后再次测试循环条件。这一过程会持续进行，直到条件返回假。\n\
    \n### 3.3.2 do-while 循环\n\ndo while 循环是另一种重复语句。它与 while 循环完全相同，不同之处在于它会先执行某些操作，然后评估循环的逻辑表达式，以确定接下来发生什么。通常在使用\
    \ while 循环时，循环中逻辑表达式的一部分必须在执行 while 循环之前初始化。\n\ndo...while 循环语句会先被执行，然后检查循环的测试表达式。\n\
    \n```c\ndo\n{\n        // codes or statements\n} while (testExpression);\n```\n\
    \n花括号内的代码块（循环体）会执行一次。\n\n然后，评估测试表达式。如果测试表达式为真，则再次执行循环体。此过程会一直持续，直到测试表达式被评估为 0（假）。\n\
    \n当测试表达式为假（零）时，**do...while** 循环终止。\n\n循环中的语句可以是单条语句，也可以是复杂语句。复杂语句必须用花括号 { } 括起来。让我们看几个\
    \ do while 循环的示例。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_61_0.png)\n\n**图\
    \ 3.4：do...while 循环流程图**\n\n**示例：打印 5 的前十个倍数的程序。**\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\nvoid main()\n{\n    int a,i;\n    a=5;\n    i=1;\n    do\n\
    \    {\n        printf(\"%d\\t\",a*i);\n        i++;\n    }\n    while (i <= 10);\n\
    \    getch();\n}\n```\n\n**输出：**\n\n5 10 15 20 25 30 35 40 45 50\n\n### 3.3.3\
    \ for 循环\n\nfor 循环是在 C++ 中执行需要重复操作（重复）的另一种方式。大多数程序员喜欢使用 for 循环，因为与使用 while 或 do\
    \ while 循环编写的相同循环相比，for 循环的代码可以写得更紧凑。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_62_0.png)\n\
    \n当你确切知道一段代码需要重复多少次时，通常会使用 for 循环。\n\nfor 循环的一般形式如下：\n\n```c\nfor    (expression1;\
    \ expression2; expression3)\n    stmt(s);\n```\n\n其中 stmt(s) 是单条语句或复合语句。\n\n这是\
    \ C 编程中最常用的循环之一。\n\n**for 循环的语法如下所示——**\n\n```c\nfor (initialization; condition\
    \ test; control flow)\n{\n    //Code – C statements needs to be repeated\n}\n\
    ```\n\n控制流可以是变量的递增或递减值，具体取决于需求。\n\n表达式 1 用于初始化循环；表达式 2 用于确定循环是否继续；表达式 3 在每次迭代或循环周期结束时评估。\n\
    \n**注 1：** 表达式 2 在 stmt 和表达式 3 执行之前进行测试；循环体可能永远不会被执行或测试。\n\n**注 2：** for 循环中的\
    \ 3 个表达式中任意一个或全部都可以省略，但 2 个分号必须保留。例如 **for( ; ; )**\n\n如果省略表达式 1，则循环中不进行初始化，但你的程序可能不需要任何初始化。\n\
    \n例如：\n\n```c\ni=1;\nfor ( ; i<=10;i++)\n```\n\n如果省略表达式 2，则没有测试部分，因此本质上会得到一个无限循环。\n\
    \n```c\nfor(i=1; ; i++)\n```\n\n如果省略表达式 3，则 for 语句中没有更新部分，但更新可以在循环体中的语句里完成。\n\n\
    ```c\nfor(i=1;i<=10; )\n{\n    printf(\"%d\",i);\n    i++;\n}\n```\n\n**for**\
    \ 循环通常在迭代次数已知时使用。\n\n一般来说，for 循环可以写成与 while 循环等价的形式，*反之亦然*。\n\n```c\nfor (expression1;\
    \ expression2; expression3)\n    statement;\n```\n\n**等价于……**\n\n```c\nexpression1;\n\
    while (expression2)\n{\n    Statements;\n    expression3;\n}\n```\n\n### for 循环流程图\n\
    \n![](img/35ea447eca4d04af54f37bf3d3ca337d_64_0.png)\n\n*示例：*\n\n```c\n...\nint\
    \ i;\nfor(i=1; i<=4; i++)\n{\n    printf(\"hello, World\");\n}\n...\n```\n\n**输出：**\n\
    \nhello, World\nhello, World\nhello, World\nhello, World\n\n**步骤 1：** 首先初始化计数器变量；这里的变量是\
    \ i，已被赋值为 1。\n\n**步骤 2：** 然后对变量进行给定条件的测试，如果条件结果为真，则编译器执行循环体中包含的 C 语句；否则，控制流跳过该循环，继续执行循环后面的下一条语句。\n\
    \n**步骤 3：** 循环体成功执行后，计数器变量会根据操作（++ 或 --）递增或递减。\n\n### for 循环的各种形式\n\n在下面所有示例中，我们都使用变量\
    \ num：\n\n- 1. 这里我们可以使用 num=num+1 代替 num++，它与 num++ 相同。\n\n```c\nfor(num=10;num<20;num=num+1)\n\
    ```\n\n- 2. 如下所示，可以跳过初始化部分，计数器变量在循环本身之前声明。\n\n```c\nint num=10;\nfor(;num<20;num++)\n\
    ```\n\n必须注意：虽然我们可以跳过初始化部分，但条件前的分号（;）是必需的，否则会出现编译错误。\n\n- 3. 与初始化类似，也可以像下面这样跳过递增部分。在这种情况下，条件逻辑之后的分号（;）是必需的。递增部分在\
    \ for 循环体本身中完成。\n\n```c\nfor(num=10;num<20;)\n{\n    //Code\n    num++;\n}\n```\n\
    \n- 4. 下面的情况也是可能的，在循环体中递增，以及在声明计数器变量时递增。\n\n```c\nint num=10;\nfor(;num<20;)\n\
    {\n//Statements\nnum++;\n}\n```\n\n- 5. 计数器也可以递减。在下面的示例中，变量在循环每次运行时递减，直到条件 num>10\
    \ 变为假。\n\n```c\nfor(num=20;num>10;num--)\n```\n\n### 3.3.4 嵌套 for 循环\n\n嵌套循环或循环嵌套是将一个循环放入另一个循环中，以基于多个条件和检查来执行程序。\n\
    \n这里我们有一个 for 循环嵌套的示例，同样，你也可以使用各种循环的嵌套，例如 while、do...while 或 for。\n\n### 3.4.1\
    \ break\n\nbreak 语句在遇到时会立即终止循环（for、while 和 do...while 循环）。break 语句与决策语句（如 if...else）一起使用。\n\
    \n当你希望程序流程从 switch 主体中出来时，break 语句很有用。每当在 switch 主体中遇到 break 语句时，执行流会直接跳出 switch。\n\
    \n### break 语句的语法\n\n```c\nbreak;\n```\n\n### break 语句的流程图\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_67_0.png)\n\
    \n**break 语句的工作方式：**\n\n```c\nwhile (test Expression)\n{\n        // codes\n \
    \       if (condition for break)\n        {\n                break;\n        }\n\
    \        // codes\n}\n```\n\ncontinue 语句的工作方式如下：\n\n```c\n    while (test Expression)\n\
    \    {\n        // codes\n        if (condition for continue)\n        {\n   \
    \         continue;\n        }\n        // codes\n    }\n\n    for (init, condition,\
    \ update)\n    {\n        // codes\n        if (condition for continue)\n    \
    \    {\n            continue;\n        }\n        // codes\n    }\n```\n\n###\
    \ continue 语句可用于 for 循环\n\n**continue** 允许你从开头继续执行 **for** 或 **while** 循环，从而可以跳过\
    \ **continue** 语句之后循环中的其余语句。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_70_0.png)\n"
