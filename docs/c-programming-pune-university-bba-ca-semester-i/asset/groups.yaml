    \n```c\nstatic int Count;\nint Road;\nmain()\n{\n    printf(\"%d\\n\", Count);\n\
    \    printf(\"%d\\n\", Road);\n}\n```\n\n**Example:**\n\n```c\nmain( )\n{\n  \
    \  increment( );\n    increment( );\n    increment ( );\n}\nincrement( )\n{\n\
    \    auto int x=1;\n    printf(\"%d\\n\",x);\n    x++;\n}\n```\n\n**Output:**\n\
    \n```text\n1\n1\n1\n```\n\nIn above example, when variable x is auto, each time\
    \ increment( ) is called, it is re-initialized to 1. When the function terminates,\
    \ x vanishes and its new value of 2 is lost. No matter how many times we call\
    \ increment( ), x is initialized to 1 every time.\n\n```c\nmain( )\n{\n    increment(\
    \ );\n    increment( );\n    increment ( );\n}\nincrement( )\n{\n    static int\
    \ x=1;\n    printf(\"%d\",x);\n    x++;\n}\n```\n\n**Output:**\n\n```text\n1\n\
    2\n3\n```\n\nIn above example, when variable x is static, it is initialized to\
    \ 1 only once. It is never initialized again.\n\n### 4. External storage classes\n\
    \nThe keyword used for this class is `extern`.\n\n**Features:**\n\n- **Storage**\
    \ — Memory area\n- **Default initial value** — Zero\n- **Scope** — Global\n- **Life\
    \ time** — As long as program execution remains it retains.\n\nDeclaration does\
    \ not create variables, only it refer that already been created at somewhere else.\
    \ So, memory is not allocated at a time of declaration and the external variables\
    \ are declared at outside of all the function.\n\n**Example:**\n\n```c\nint i,j;\n\
    void main( )\n{\n    printf(\"i=%d\",i);\n    increment( );\n    increment ( );\n\
    \    decrement( );\n    decrement( );\n}\n\nincrement( )\n{\n    i=i+1;\n    printf(\"\
    on incrementing i=%d\",i);\n}\ndecrement( )\n{\n    i=i-1;\n    printf(\"on decrementing\
    \ i=%d\",i);\n}\n```\n\n**Output:**\n\n```text\ni=0\non incrementing i=1\non incrementing\
    \ i=2\non decrementing i=1\non decrementing i=0\n```\n\nWhen there is large program\
    \ i.e divided into several files, then external variable should be preferred.\
    \ External variable extend the scope of variable.\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_167_0.png)\n\
    \n## Introduction to Pointer\n\n**Structure:**\n\n- 7.1 Definition\n- 7.2 Declaration\n\
    - 7.3 Initialization\n- 7.4 Indirection Operator and Address of Operator\n- 7.5\
    \ Pointer Arithmetic\n- 7.6 Dynamic Memory Allocation\n- 7.7 Functions and Pointers\n\
    \n### 7.1 Definition\n\nA pointer is a variable that stores a memory address or\
    \ that contains the address of another variable. Addresses are location numbers\
    \ and always contain whole numbers. So, a pointer always contains a whole number.\
    \ It is called a pointer because it points to a particular location in memory\
    \ by storing the address of that location.\n\n**Syntax**\n\n```c\nData type *pointer\
    \ name;\n```\n\nHere `*` before the pointer name indicates to the compiler that\
    \ the variable is declared as a pointer.\n\ne.g.,\n\n```c\nint *p1; //pointer\
    \ to integer type\nfloat *p2; //pointer to float type\nchar *p3; //pointer to\
    \ character type\n```\n\nWhen a pointer is declared, it contains garbage value,\
    \ i.e., it may point to any value in the memory.\n\n### 7.2 Declaration\n\nPointer\
    \ variables, like all other variables, must be declared before they may be used\
    \ in a C program. The interpretation of a pointer declaration differs; however,\
    \ from the interpretation of other variable declarations. When a pointer variable\
    \ is declared, the variable name must be preceded by an asterisk (*). This identifies\
    \ the fact that the variable is a pointer. The data type that appears in the declaration\
    \ refers to the object of the pointer, i.e., the data item that is stored in the\
    \ address represented by the pointer, rather than the pointer itself.\n\n```c\n\
    if(ptr_x)                 //succeeds, if ptr_x is not null\nif(!ptr_x)       \
    \         //succeeds, if ptr_x is null\n```\n\n### 7.3.2 What Happens at Memory\
    \ Level\n\nAssume the following snippet for this example\n\n```c\nint x=50, y=45;\n\
    int *ptr_x;\nptr_x = &x;\ny = *ptr_x;\nx = ptr_x;\n*ptr_x = 30;\n```\n\nLet’s\
    \ see what happens in memory for each and every corresponding statement of the\
    \ above snippet in Fig. 7.1. Assume for the sake of this discussion that variable\
    \ x resides at memory location 1450, y at 1560 and ptr_x at 2581. (Note: A pointer\
    \ is a variable and thus its values need to be stored somewhere.)\n\n| Program\
    \ snippet | Memory | Garbage value |\n|---|---|---|\n| `int x=50, y=45;` |  |\
    \ 4789 |\n| `int *ptr_x;` | x = 50<br>1450<br>y = 45<br>1560<br>ptr_x = 4789<br>2581\
    \ |  |\n| `ptr_x = &x;` | x = 50<br>1450<br>y = 45<br>1560<br>ptr_x = 1450<br>2581\
    \ |  |\n| `y = *ptr_x;` | x = 50<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581\
    \ |  |\n| `x = ptr_x` | x = 1450<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581\
    \ |  |\n| `*ptr_x = 30` | x = 30<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581\
    \ |  |\n\n**Fig. 7.1: How Pointers Work at Machine Level (Memory)**\n\nThe program\
    \ starts by declaring the integer variables x and y; it also initializes them\
    \ with 50 and 45 respectively. It later defines a pointer variable ptr_x that\
    \ is assigned the address of x. So ptr_x gets loaded with the value 1450. Now\
    \ y is assigned the contents of ptr_x. ptr_x points to memory location 1450, i.e.,\
    \ location of x. So y gets assigned to the value of x, i.e., 50. Now x is assigned\
    \ with ptr_x, which itself holds the address of x. So x gets loaded with its own\
    \ address, i.e., 1450. Finally, *ptr_x is assigned with 30. *ptr_x means value\
    \ at the location pointed to by ptr_x, which is x itself. So x gets loaded with\
    \ 30.\n\n### 7.4 Indirection Operator and Address of Operator\n\nPointers are\
    \ variables which point to the address of another variable used in C program.\
    \ To access the memory and manipulate the address, the address is to be referred\
    \ with `&` operator, and `*` sign can be used as a notation to dereference the\
    \ pointer.\n"
  mdcn: "\n如果递归函数包含局部变量，则每次调用时都会创建一组局部变量。当然，这些局部变量的名称始终相同，因为它们在函数内部声明。然而，每次执行函数时，这些变量所表示的值集合会不同。\n\
    \n每组值都将存储在栈上，因此在递归过程“回退”（unwinds，即各个函数调用从栈中“弹出”并执行）时，这些值仍然可用。\n\n## 6.4 存储类\n\n\
    C 语言中的存储类是一种说明符，它告诉编译器在何处以及如何存储变量、变量的初始值以及变量在程序中的作用域。或者，变量的属性称为存储类；或者从编译器的角度来看，变量标识计算机内某个可存储其位串值的物理位置，这种类别称为存储类。计算机中可存储值的位置类型要么是内存，要么是寄存器。有多种存储类，它们决定值将存储在两种位置中的哪一种。\n\
    \n声明存储类的语法为：\n\n```c\nstorageclass datatype variable name;\n```\n\n存储类有四种类型，且都是关键字：\n\
    \n- 1) 自动（`auto`）\n- 2) 寄存器（`register`）\n- 3) 静态（`static`）\n- 4) 外部（`extern`）\n\
    \n**示例：**\n\n```c\nauto float x; or float x;\nextern int x;\nregister char c;\n\
    static int y;\n```\n\n编译器根据以下方面采用不同的存储类：\n\n- **存储类：** 告诉我们存储位置（变量将存储在何处）。\n-\
    \ **初始值：** 变量的初始值是什么。如果未分配初始值，那么未初始化变量会取什么值。\n- **变量的作用域：** 变量在程序中的有效范围是什么。\n\
    - **生命周期：** 变量从创建到销毁之间的时间，或者说变量存在多久。\n\n### 1. 自动存储类\n\n`auto` 是局部变量的默认存储类。用于声明自动存储类的关键字是\
    \ `auto`。\n\n**特性：**\n\n| 特性 | 描述 |\n|---|---|\n| 存储 | 内存位置 |\n| 默认初始值 | 不可预测的值或垃圾值。\
    \ |\n| 作用域 | 局部于定义该变量的块或函数。 |\n| 生命周期 | 直到控制权仍位于定义该变量的函数或块内。 |\n\n当函数释放时，它终止。没有任何存储类说明符的变量称为自动变量。\n\
    \n**示例：**\n\n```c\nmain()\n{\n        auto int i;\n        printf(\"%d\",i);\n\
    }\n```\n\n### 2. 寄存器存储类\n\n`register` 用于定义应存储在寄存器而不是 RAM 中的局部变量。用于声明此存储类的关键字是\
    \ `register`。\n\n**特性：**\n\n- **存储** —— CPU 寄存器。\n- **默认初始值** —— 垃圾值\n- **作用域**\
    \ —— 局部于定义它的函数或块。\n- **生命周期** —— 直到控制权仍位于定义它的函数或块内。\n\n寄存器变量没有内存地址，因此不能对其使用取地址运算符。CPU\
    \ 寄存器通常是 16 位或 2 字节。因此，我们只能对整型、字符型、指针类型应用存储类。存储在寄存器存储类中的变量访问速度总是比始终存储在内存中的变量更快。但由于寄存器对的限制，不可能将所有变量都存储在\
    \ CPU 寄存器中。当变量在许多地方使用（如循环计数器）时，最好将其声明为寄存器类。\n\n**示例：**\n\n```c\nmain()\n{\n  \
    \      register int i;\n        for(i=1;i<=10;i++)\n        printf(\"%d\",i);\n\
    }\n```\n\n### 3. 静态存储类\n\n用于声明静态存储类的关键字是 `static`。\n\n**特性：**\n\n- **存储** —— 内存位置\n\
    - **默认初始值** —— 零\n- **作用域** —— 局部于定义它的块或函数。\n- **生命周期** —— 变量的值在不同函数调用之间持续存在或保留。\n\
    \n静态是全局变量的默认存储类。下面两个变量（count 和 road）都具有静态存储类。\n\n```c\nstatic int Count;\nint\
    \ Road;\nmain()\n{\n    printf(\"%d\\n\", Count);\n    printf(\"%d\\n\", Road);\n\
    }\n```\n\n**示例：**\n\n```c\nmain( )\n{\n    increment( );\n    increment( );\n\
    \    increment ( );\n}\nincrement( )\n{\n    auto int x=1;\n    printf(\"%d\\\
    n\",x);\n    x++;\n}\n```\n\n**输出：**\n\n```text\n1\n1\n1\n```\n\n在上面的示例中，当变量 x\
    \ 是自动变量时，每次调用 increment( ) 时，它都会重新初始化为 1。当函数终止时，x 消失，其新值 2 丢失。无论我们调用 increment(\
    \ ) 多少次，x 每次都会初始化为 1。\n\n```c\nmain( )\n{\n    increment( );\n    increment( );\n\
    \    increment ( );\n}\nincrement( )\n{\n    static int x=1;\n    printf(\"%d\"\
    ,x);\n    x++;\n}\n```\n\n**输出：**\n\n```text\n1\n2\n3\n```\n\n在上面的示例中，当变量 x 是静态变量时，它只初始化一次为\
    \ 1。之后不会再初始化。\n\n### 4. 外部存储类\n\n用于此类的关键字是 `extern`。\n\n**特性：**\n\n- **存储** ——\
    \ 内存区域\n- **默认初始值** —— 零\n- **作用域** —— 全局\n- **生命周期** —— 只要程序执行仍然存在，它就保留。\n\n\
    声明并不创建变量，它只是引用已在其他地方创建的变量。因此，声明时不会分配内存，外部变量在所有函数之外声明。\n\n**示例：**\n\n```c\nint\
    \ i,j;\nvoid main( )\n{\n    printf(\"i=%d\",i);\n    increment( );\n    increment\
    \ ( );\n    decrement( );\n    decrement( );\n}\n\nincrement( )\n{\n    i=i+1;\n\
    \    printf(\"on incrementing i=%d\",i);\n}\ndecrement( )\n{\n    i=i-1;\n   \
    \ printf(\"on decrementing i=%d\",i);\n}\n```\n\n**输出：**\n\n```text\ni=0\non incrementing\
    \ i=1\non incrementing i=2\non decrementing i=1\non decrementing i=0\n```\n\n\
    当程序很大，即分成多个文件时，应优先使用外部变量。外部变量扩展了变量的作用域。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_167_0.png)\n\
    \n## 指针简介\n\n**结构：**\n\n- 7.1 定义\n- 7.2 声明\n- 7.3 初始化\n- 7.4 间接运算符和取地址运算符\n- 7.5\
    \ 指针运算\n- 7.6 动态内存分配\n- 7.7 函数与指针\n\n### 7.1 定义\n\n指针是一个存储内存地址的变量，或者说包含另一个变量地址的变量。地址是位置编号，并且始终是整数。因此，指针始终包含一个整数。它之所以称为指针，是因为它通过存储某个特定内存位置的地址来指向该位置。\n\
    \n**语法**\n\n```c\nData type *pointer name;\n```\n\n这里，指针名称前的 `*` 向编译器表明该变量被声明为指针。\n\
    \n例如，\n\n```c\nint *p1; //pointer to integer type\nfloat *p2; //pointer to float\
    \ type\nchar *p3; //pointer to character type\n```\n\n声明指针时，它包含垃圾值，即它可能指向内存中的任意值。\n\
    \n### 7.2 声明\n\n指针变量与所有其他变量一样，必须先声明，然后才能在 C 程序中使用。然而，指针声明的解释与其他变量声明的解释不同。声明指针变量时，变量名前面必须有一个星号（*）。这标识了该变量是指针这一事实。声明中出现的数据类型指的是指针所指向的对象，即存储在指针所表示的地址中的数据项，而不是指针本身。\n\
    \n```c\nif(ptr_x)                 //succeeds, if ptr_x is not null\nif(!ptr_x)\
    \                //succeeds, if ptr_x is null\n```\n\n### 7.3.2 内存层面发生了什么\n\n\
    假设此示例使用以下代码片段\n\n```c\nint x=50, y=45;\nint *ptr_x;\nptr_x = &x;\ny = *ptr_x;\n\
    x = ptr_x;\n*ptr_x = 30;\n```\n\n让我们在图 7.1 中查看上述代码片段的每个对应语句在内存中会发生什么。为便于讨论，假设变量\
    \ x 位于内存位置 1450，y 位于 1560，ptr_x 位于 2581。（注意：指针是一个变量，因此它的值需要存储在某个地方。）\n\n| 程序片段\
    \ | 内存 | 垃圾值 |\n|---|---|---|\n| `int x=50, y=45;` |  | 4789 |\n| `int *ptr_x;`\
    \ | x = 50<br>1450<br>y = 45<br>1560<br>ptr_x = 4789<br>2581 |  |\n| `ptr_x =\
    \ &x;` | x = 50<br>1450<br>y = 45<br>1560<br>ptr_x = 1450<br>2581 |  |\n| `y =\
    \ *ptr_x;` | x = 50<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581 |  |\n|\
    \ `x = ptr_x` | x = 1450<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581 | \
    \ |\n| `*ptr_x = 30` | x = 30<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581\
    \ |  |\n\n**图 7.1：指针在机器层面（内存）如何工作**\n\n程序首先声明整型变量 x 和 y；并分别用 50 和 45 初始化它们。随后定义指针变量\
    \ ptr_x，并将 x 的地址赋给它。因此 ptr_x 被装入值 1450。现在将 ptr_x 的内容赋给 y。ptr_x 指向内存位置 1450，即 x\
    \ 的位置。因此 y 被赋值为 x 的值，即 50。现在将 ptr_x 赋给 x，而 ptr_x 本身保存着 x 的地址。因此 x 被装入自己的地址，即 1450。最后，将\
    \ 30 赋给 *ptr_x。*ptr_x 表示 ptr_x 所指向位置处的值，也就是 x 本身。因此 x 被装入 30。\n\n### 7.4 间接运算符和取地址运算符\n\
    \n指针是指向 C 程序中使用的另一个变量地址的变量。要访问内存并操作地址，需要用 `&` 运算符来引用地址，而 `*` 符号可用作解引用指针的表示法。\n"
