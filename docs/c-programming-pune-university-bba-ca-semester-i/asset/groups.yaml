    \ because of modularization. Updation does not affect whole program only respective\
    \ module will be affected.\n\n### 6.1.2 Function Definition\n\n- 1. Function Definition\
    \ is a body of the function written outside the main function.\n- 2. The function\
    \ Definition has a function header statement with a body of statements enclosed\
    \ within { and }\n- 3. Function definition has two main components (1) First Line\
    \ Function Header (2) Body of function enclosed with { }\n- 4. The first header\
    \ statement consists of type specification of the value returned by the function\
    \ followed by function name and followed by ( )\n- 5. Within ( ) round brackets,\
    \ it can either be empty or it can have parameters or arguments with data type\
    \ of each argument\n\n**The Syntax of function definition is:**\n\n```\nreturn_type\
    \ function name (no. of parameters/arguments with data types)\n{\n    c statement;\
    \   // Block code of statements //\n    c statement;\n    return statement;\n\
    }\n```\n\n**Return_type:** Every function returns a value after execution of block\
    \ of statements, Return type can be of any data type such as int, double, char,\
    \ void, short, etc. Normally, function return type is any datatype but if function\
    \ does not return any value then we have to specify with void keyword to indicate\
    \ function returns null value.\n\n**Function_name:** Function name should be a\
    \ valid identifier and function name should be a meaningful name so that it can\
    \ be easy to understand the purpose of function just by seeing its name.\n\n**Argument\
    \ list/parameter list (type arg1, type arg2):** Arguments are also called parameters,\
    \ parameter list contains variables names along with their data types. These arguments\
