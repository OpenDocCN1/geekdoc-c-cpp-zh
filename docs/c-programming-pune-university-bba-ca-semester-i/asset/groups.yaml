    \ 5.8.3 初始化\n- 5.9 标准库函数\n- 5.10 不使用标准库函数的实现\n\n### 5.1 一维数组简介\n\n数组是另一种变量或用户定义变量，在\
    \ C 语言中被广泛使用。数组是一个标识符，指向一组具有相同名称的数据项。因此，数组是相同类型数据项的集合，例如所有整数的集合、所有浮点数的集合、所有字符的集合。\n\
    \n各个数据项由其对应的数组元素（索引）表示。\n\n假设 x 是一个包含 10 个元素的数组。第一个元素称为 x[0]，第二个称为 x[1]，依此类推。最后一个元素将是\
    \ x[9]。\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_107_0.png)\n\n数组中的每个成员（即每个单独的数据项）通过指定数组名后跟一个或多个下标（数组索引）来表示，每个下标括在方括号中。每个下标都必须表示为非负整数。在一个包含\
    \ n 个元素的数组中，数组元素为：\n\nx[0]、x[1]、x[2]、...、x[n - 1]\n\n如下图所示。数组的第一个元素使用记号 x[0] 表示，第二个元素使用记号\
    \ x[1] 表示，依此类推。\n\n**声明**是提供变量的数据类型和标识符的语句。**标识符**是程序组件的名称。\n\n#### 5.1.1 定义\n\
    \n只有一个下标的数组称为**一维数组**。\n\n***示例：***\n\n```c\nint arr[10];\n```\n\n当你声明一个数组时，你声明的是一个包含多个相同类型数据项的数组；每个数据项是数组的一个**元素**。每个元素具有相同的数据类型，并且每个元素在内存中占据与其他元素相邻或连续的区域。数组中的所有元素都将存储在连续分配的内存中。\n\
    \n#### 5.1.2 声明\n\n数组的声明方式与变量类似，唯一区别是每个数组名都必须指定大小。对于一维数组，通过在方括号中指定正整数表达式来完成，如下所示：\n\
    \n```c\ndata-type  array_name[expression]\n```\n\n其中 **data-type** 是数组元素的数据类型（int、float、char），**array_name**\
    \ 是数组名，**expression** 是确定数组大小的正整数值常量。\n\n#### 5.1.3 初始化\n\n如果初始值数量多于声明的大小，编译器将产生错误。也就是说，语句\n\
    \n```c\nint number[3] = {10, 20, 30, 40, 50};\n```\n\n将无法工作。这在 C 语言中是非法的。\n\n\
    #### 通过赋值初始化\n\n```c\nchar arr_map[3];\narr_map[0] = 'S';\narr_map[1] = 'R';\n\
    arr_map[2] = 'D';\n```\n\n### 访问一维数组元素\n\n数组从 0 开始索引，因此第一个数组元素位于索引 = 0，最高索引为 size_of_array\
    \ - 1。要访问给定索引处的数组元素，应使用以下语法：\n\n**示例代码**\n\n```c\narray_name[index_of_element];\n\
    ```\n\n要将数组的某个元素设置为某个值，应编写：\n\n**示例代码**\n\n```c\narray_name[index_of_element]\
    \ = value;\n```\n\n要访问 arr_map 的元素之一：\n\n**示例代码**\n\n```c\narr_map[0]; // value\
    \ of 'S'\narr_map[1]; // value of 'R'\narr_map[2]; // value of 'D'\n```\n\n尝试访问索引\
    \ 0 到 size_of_array - 1 范围之外的值会导致运行时错误。编译器不会报错，但程序在执行时会崩溃。\n\n以下代码片段将数据放入容量为 40\
    \ 个元素的整数类型数组项中\n\n```c\nfor(i = 0; i < 40; i++)\n{\n    printf(\"Enter the item\"\
    );\n    scanf(\"%d\", &items[i]);\n}\n```\n\n上面的 for 循环要求用户输入 40 次数据项。开始时，i =\
    \ 0，这使 scanf 语句初始化数组元素 items[0]（数组的第一个元素）。此过程持续到 i = 39，这将初始化数组的最后一个元素：items[39]。\n\
    \n注意，scanf 函数在 items[i] 前面包含一个与号（&），因为输入的是单个数组元素，而不是整个数组。\n\n"
