    \ these are raised because of writing wrong logic in the program.\n\n### Example\n\
    \nCalling function without existence, divide by zero.\n\n```c\nint a=10,b;\nb=a/0;\
    \ // infinite\n```\n\nHere out of range of int data type.\n\nIn general, it is\
