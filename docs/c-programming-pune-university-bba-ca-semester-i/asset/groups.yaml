  - "[PAGE 201]\n\n# # Error Handling in C Language\n\n**We distinguish between the\
    \ following types of errors:**\n\n+   1. **Syntax errors**: errors due to the\
    \ fact that the syntax of the language is not respected.\n+   2. **Semantic errors**:\
    \ errors due to an improper use of program statements.\n+   3. **Logical errors**:\
    \ errors due to the fact that the specification is not respected.\n+      [From\
