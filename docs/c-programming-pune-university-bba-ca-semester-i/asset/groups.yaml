    \ ? | ^ | . | \" |\n| \\| | < | > | ( | ) |\n| { | } | [ | ] | : |\n| ; | . |\
    \ , | _ | Blank space |\n\nMost versions of the language also allow certain other\
    \ characters, such as @ and $, to be included within strings and comments.\n\n\
    C uses certain combinations of these characters, such as `\\b`, `\\n` and `\\\
    t`, to represent special conditions such as backspace, newline and horizontal\
    \ tab, respectively.\n\nThese character combinations are known as escape sequences.\
    \ For now we simply mention that each escape sequence represents a single character,\
    \ even though it is written as two or more characters.\n\n### Escape Sequences\n\
    \nTable 1.2: Backslash Character\n\n| Backslash character | Meaning |\n|---|---|\n\
    | `\\b` | Backspace |\n| `\\f` | Form feed |\n| `\\n` | New line |\n| `\\r` |\
    \ Carriage return |\n| `\\t` | Horizontal tab |\n| `\\\"` | Double quote |\n|\
    \ `\\'` | Single quote |\n| `\\\\` | Backslash |\n| `\\v` | Vertical tab |\n|\
    \ `\\a` | Alert or bell |\n| `\\?` | Question mark |\n| `\\N` | Octal constant\
    \ (N is an octal constant) |\n| `\\xN` | Hexadecimal constant (N is a hexadecimal\
    \ digit) |\n\n### Tokens\n\nTokens are individual words and punctuation marks\
