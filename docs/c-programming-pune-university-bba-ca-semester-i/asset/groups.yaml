    \ 12, 33, 34, 80, 12, 78} ;\n```\n\n程序员需要注意为多维数组元素分配初始值的顺序。规则是最后一个（最右边）下标增长最快，第一个（最左边）下标增长最慢。因此，二维数组的元素将按行赋值；即先给第一行的元素赋值，再给第二行的元素赋值，依此类推。因此，上述声明将具有如下初始赋值：\n\
