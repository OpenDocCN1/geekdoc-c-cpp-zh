    \ holder which occupies memory space to store variable value, or a constant value,\
    \ integer, float, character, string value.\n\nIn C, all variables must be declared\
    \ before they are used in executable statements.\n\nIn C language all variables\
    \ are to be declared first in local declaration section, i.e., at the beginning\
    \ of scope.\n\n```c\nint score = 95;\n```\n\nHere, `score` is a variable of integer\
    \ type. The variable is holding 95 in the above code.\n\nThe value of a variable\
    \ can be changed, hence, the name 'variable'.\n\n### Data Types\n\nC supports\
    \ several different types of data, each of which may be represented differently\
    \ within the computer’s memory.\n\n- C data types are defined as the data storage\
    \ format that a variable can store a data to perform a specific operation.\n-\
    \ Data types are used to define a variable before to use in a program.\n- Size\
    \ of variable, constant and array are determined by data types.\n\n### Built-in-type\n\
    \n- 1. **Integer type:** The data types in this type are int and char. The modifiers\
    \ signed, unsigned, long and short may be applied to character and integer basic\
    \ data type.\n  - The size of int is 2 bytes and the size of char is 1 byte.\n\
    \  - **Example: `int a=10;`**\n- 2. **Floating Type:** The data type in this can\
    \ be float or double. The size of the float is 4 bytes and size of double is 8\
    \ bytes. It is used to store the numbers with decimal. The modifier long can be\
    \ applied to double and the size of long double is 10 bytes.\n  - **Example: `float\
    \ per=95.3;`**\n  - float data type supports single precision numbers.\n  - double\
    \ data type supports double precision numbers and having size greater than float.\n\
    \  - long double can store double precision numbers and having size greater than\
    \ double.\n- 3. **char:** characters stored like type char. It stores single character;\
    \ size is 1 byte.\n- 4. **void:** void is used for:\n  - To specify the return\
    \ type of a function when it is not returning any value.\n  - To indicate an empty\
    \ argument list to a function.\n\n- **(a) Integer Arithmetic:** When both the\
    \ operands are integers, the operation is called integer arithmetic.\n\n  *For\
    \ e.g.,*\n\n  ```text\n  55 - 5 = 50\n  55 + 5 = 60\n  14 * 2 = 28\n  14/2 = 7\
    \ (Decimal part truncated integer division)\n  14 % 2 = 0 (Remainder of division)\n\
    \  -14 % 3 = -2\n  14 % 3 = 2\n  6/7 = 0\n  ```\n\n- **(b) Real Arithmetic:**\
    \ An arithmetic operation involving only real operands is called real arithmetic.\
    \ A real operand may assume values either in fractional or exponential form.\n\
    \n  *For e.g.,*\n\n  ```text\n  1.5 - 0.7 = 0.8\n  1.5 + 0.7 = 2.2\n  1.5 * 2.0\
    \ = 3.0\n  6.0/7.0 = 0.857143\n  1.0/3.0 = 0.3333\n  -2.0/3.0 = -0.666667\n  %\
    \ (modulo operator) cannot be used with Real numbers\n  x_int/y_int = result_int\n\
    \  x_int/y_float = result_float\n  x_float/y_int = result_float\n  x_float/y_float\
    \ = result_float\n  ```\n\n- **(c) Mixed Mode Arithmetic:** C++ permits us to\
    \ mix integer operand with real operand. When one operand is real and the other\
    \ is integer, the expression is called mixed mode arithmetic expression i.e. if\
    \ either of the operand is of the real type, then only real operation is performed\
    \ and result is always a real number.\n\n  *For e.g.,*\n\n  ```text\n  15/10.0\
    \ = 1.5\n  4 + 3.5 = 7.5\n  ```\n\n### Example of Arithmetic Operators\n\n```c\n\
    // C Program to demonstrate the working of arithmetic operators\n#include <stdio.h>\n\
    void main()\n{\n    int a = 9,b = 4, c;\n```\n\n### Logical Negation Operator\
    \ (!)\n\nA logical expression can be changed from false to true or from true to\
    \ false with negation operator (!).\n\n| Situation | Result |\n|---|---|\n| !\
    \ (true) | false |\n| ! (false) | true |\n\n*Example:*\n\n```text\n! (a < b) ||\
    \ (c > b)\n! (4 < 5) || (6 > 5)\n! (true) || (true)\nfalse || true\ntrue\n```\n\
    \nSuppose a program has to perform certain steps on the basis of the condition\
    \ that a<10 and b == 7. This condition is coded using the relational operator\
    \ in conjunction with the logical operator **AND**. This AND operator is represented\
    \ by `&&`, and the condition will look something like:\n\n```c\n(a < 10) && (b\
    \ == 7)\n```\n\nSimilarly, **OR** is used to check whether one of the condition\
    \ is true. It is represented by two consecutive vertical bar signs `||`. If the\
    \ same example is considered in such a way that the steps in the program have\
    \ to be performed if either of the statements are true, then the condition will\
    \ be checked as:\n\n```c\n(a < 10) || (b == 7)\n```\n\nThe third logical operator\
    \ NOT is represented by a single exclamation character (!). This operator reverses\
    \ the truth value of the expression to its immediate right. For example, a program\
    \ has to do some steps if a variable is less than 10, the condition can be written\
    \ as:\n\n```text\n(s < 10)\nor\n(!(s >= 10))\n/*s is not equal to or more than\
    \ 10 */\n```\n\nBoth relational and logical operators are lower in precedence\
    \ than the arithmetic operators.\n\n*Example:*\n\n```text\n5 > 4 + 3\n```\n\n\
    is evaluated as, 5 > 7. The arithmetic operation (4 + 3) precedes the logical\
    \ expression (5 > 7).\n(The result for this will be false, that is zero will be\
    \ returned.)\n\nThe following `printf()`\n\n```c\nprintf(\"%d\", 5 > 4 + 3);\n\
    ```\n\nwill give\n\n```text\n0\n```\n\nas 5 is less than 7 (4+3).\n\n### Example:\
    \ Logical Operators\n\n```c\n// C Program to demonstrate the working of logical\
    \ operators\n#include <stdio.h>\nvoid main()\n{\n    int a = 5, b = 5, c = 10,\
    \ result;\n    result = (a == b) && (c > b);\n    printf(\"(a == b) && (c > b)\
    \ equals to %d \\n\", result);\n    result = (a == b) && (c < b);\n    printf(\"\
    (a == b) && (c < b) equals to %d \\n\", result);\n    result = (a == b) || (c\
    \ < b);\n    printf(\"(a == b) || (c < b) equals to %d \\n\", result);\n    result\
    \ = (a != b) || (c < b);\n    printf(\"(a != b) || (c < b) equals to %d \\n\"\
    , result);\n    result = !(a != b);\n    printf(\"!(a != b) equals to %d \\n\"\
    , result);\n    result = !(a == b);\n    printf(\"!(a == b) equals to %d \\n\"\
    , result);\n    getch();\n}\n```\n\n### Output\n\n```text\n(a == b) && (c > b)\
    \ equals to 1\n(a == b) && (c < b) equals to 0\n(a == b) || (c < b) equals to\
    \ 1\n(a != b) || (c < b) equals to 0\n!(a != b) equals to 1\n!(a == b) equals\
    \ to 0\n```\n\n### Explanation of Logical Operator Program\n\n- `(a == b) && (c\
    \ > b)` evaluates to 1 because both operands `(a == b)` and `(c > b)` are 1 (true).\n\
    - `(a == b) && (c < b)` evaluates to 0 because operand `(c < b)` is 0 (false).\n\
    - `(a == b) || (c < b)` evaluates to 1 because `(a == b)` is 1 (true).\n- `(a\
    \ != b) || (c < b)` evaluates to 0 because both operands `(a != b)` and `(c <\
    \ b)` are 0 (false).\n- `!(a != b)` evaluates to 1 because operand `(a != b)`\
    \ is 0 (false). Hence, `!(a != b)` is 1 (true).\n- `!(a == b)` evaluates to 0\
    \ because `(a == b)` is 1 (true). Hence, `!(a == b)` is 0 (false).\n\n## 4. Assignment\
    \ and Compound Assignment Operators\n\n### Assignment Operator\n\nAssignment operators\
    \ are used to assign the result of an expression or constant to variable.\n\n\
    The assignment operators can be used within any valid expression, the usual assignment\
    \ operator is `=`.\n\n```c\nvariable_Name = constant or expression;\n```\n\nThe\
    \ arithmetic expression is a combination of variables, constants and operators.\n\
    \n**E.g.,**\n\n```c\nx = a + b;\nz = 0;\nfinal = 100;\n```\n\nDuring the assignment\
    \ operator the value of expression of right hand side is assigned to left side\
    \ variable.\n\nDuring the assignment operator the value of the expression on right\
    \ hand side is computed and is assigned to the variable on the left hand side.\n\
    \n### Compound Assignment OR Short Hand Assignment Operators\n\nThe **compound\
    \ assignment operators** enable you to abbreviate assignment statements. For example,\
    \ the statement\n\n```c\nvalue = value + 3\n```\n\nwhich mentions the variable\
    \ value on **both** sides of the assignment, can be abbreviated with the **addition\
    \ assignment operator**, `+=` as\n\n```c\nvalue += 3\n```\n\nThe `+=` operator\
    \ adds the value of the right operand to the value of the left operand and stores\
    \ the result in the left operand's variable.\n\nIn addition to the usual assignment\
    \ operator `=`, C++ has short hand assignment operators of the form\n\n```c\n\
    variable op = expression;\n```\n\nwhere op is a C language binary arithmetic operator.\n\
    \n| Compound assignment operator | Sample expression | Explanation | Assigns |\n\
    |---|---|---|---|\n| **Assume: c = 4, d = \"He\"** | | | |\n| `+=` | `c += 7`\
    \ | `c = c + 7` | 11 to c |\n| `-=` | `c -= 3` | `c = c - 3` | 1 to c |\n| `*=`\
    \ | `c *= 4` | `c = c * 4` | 16 to c |\n| `/=` | `c /= 2` | `c = c / 2` | 2 to\
    \ c |\n| `%=` | `c %= 3` | `c = c % 3` | 1 to c |\n| `^=` | `c ^= 2` | `c = c\
    \ ^ 2` | 16 to c |\n| `&=` | `d &= \"llo\"` | `d = \"kiran\" & \"llo\"` | \"Hello\"\
    \ to kiran |\n\n**Fig 1.1: Compound Assignment Operators**\n"
  mdcn: "\n## 1.3.3 变量与数据类型\n\n### 变量\n\n变量是一个占位符，它占用内存空间来存储变量值，或常量值、整数、浮点数、字符、字符串值。\n\
    \n在C语言中，所有变量在执行语句中使用之前必须先声明。\n\n在C语言中，所有变量应首先在局部声明部分声明，即作用域的开头。\n\n```c\nint score\
    \ = 95;\n```\n\n这里，`score` 是一个整数类型的变量。上述代码中该变量保存着95。\n\n变量的值可以改变，因此得名“变量”。\n\n\
    ### 数据类型\n\nC语言支持多种不同类型的数据，每种数据在计算机内存中可能以不同的方式表示。\n\n- C数据类型定义为变量为执行特定操作而存储数据的数据存储格式。\n\
    - 数据类型用于在程序中使用变量之前定义变量。\n- 变量、常量和数组的大小由数据类型决定。\n\n### 内置类型\n\n- 1. **整数类型：** 此类型中的数据类型是\
    \ int 和 char。修饰符 signed、unsigned、long 和 short 可应用于字符和整数基本数据类型。\n  - int 的大小是2字节，char\
    \ 的大小是1字节。\n  - **示例：`int a=10;`**\n- 2. **浮点类型：** 此类型中的数据类型可以是 float 或 double。float\
    \ 的大小为4字节，double 的大小为8字节。它用于存储带小数的数字。修饰符 long 可应用于 double，long double 的大小为10字节。\n\
    \  - **示例：`float per=95.3;`**\n  - float 数据类型支持单精度数。\n  - double 数据类型支持双精度数，且大小大于\
    \ float。\n  - long double 可以存储双精度数，且大小大于 double。\n- 3. **char：** 字符以 char 类型存储。它存储单个字符；大小为1字节。\n\
    - 4. **void：** void 用于：\n  - 当函数不返回任何值时，指定函数的返回类型。\n  - 指示函数的空参数列表。\n\n- **(a)\
    \ 整数算术：** 当两个操作数都是整数时，该运算称为整数算术。\n\n  *例如，*\n\n  ```text\n  55 - 5 = 50\n  55\
    \ + 5 = 60\n  14 * 2 = 28\n  14/2 = 7 (Decimal part truncated integer division)\n\
    \  14 % 2 = 0 (Remainder of division)\n  -14 % 3 = -2\n  14 % 3 = 2\n  6/7 = 0\n\
    \  ```\n\n- **(b) 实数算术：** 仅涉及实数操作数的算术运算称为实数算术。实数操作数可以采用分数或指数形式的值。\n\n  *例如，*\n\
    \n  ```text\n  1.5 - 0.7 = 0.8\n  1.5 + 0.7 = 2.2\n  1.5 * 2.0 = 3.0\n  6.0/7.0\
    \ = 0.857143\n  1.0/3.0 = 0.3333\n  -2.0/3.0 = -0.666667\n  % (modulo operator)\
    \ cannot be used with Real numbers\n  x_int/y_int = result_int\n  x_int/y_float\
    \ = result_float\n  x_float/y_int = result_float\n  x_float/y_float = result_float\n\
    \  ```\n\n- **(c) 混合模式算术：** C++ 允许我们将整数操作数与实数操作数混合使用。当一个操作数是实数而另一个是整数时，该表达式称为混合模式算术表达式，即如果任一操作数是实数类型，则只执行实数运算，结果始终是实数。\n\
    \n  *例如，*\n\n  ```text\n  15/10.0 = 1.5\n  4 + 3.5 = 7.5\n  ```\n\n### 算术运算符示例\n\
    \n```c\n// C Program to demonstrate the working of arithmetic operators\n#include\
    \ <stdio.h>\nvoid main()\n{\n    int a = 9,b = 4, c;\n```\n\n### 逻辑非运算符 (!)\n\n\
    使用逻辑非运算符 (!) 可以将逻辑表达式从假变为真或从真变为假。\n\n| 情况 | 结果 |\n|---|---|\n| ! (true) | false\
    \ |\n| ! (false) | true |\n\n*示例：*\n\n```text\n! (a < b) || (c > b)\n! (4 < 5)\
    \ || (6 > 5)\n! (true) || (true)\nfalse || true\ntrue\n```\n\n假设一个程序需要根据条件 a<10\
    \ 且 b == 7 来执行某些步骤。该条件使用关系运算符与逻辑运算符 **AND** 结合编码。此 AND 运算符用 `&&` 表示，条件将如下所示：\n\
    \n```c\n(a < 10) && (b == 7)\n```\n\n类似地，**OR** 用于检查条件之一是否为真。它由两个连续的竖线符号 `||`\
    \ 表示。如果考虑相同的示例，即如果任一语句为真则程序中的步骤必须执行，那么条件将检查为：\n\n```c\n(a < 10) || (b == 7)\n\
    ```\n\n第三个逻辑运算符 NOT 由单个感叹号 (!) 表示。该运算符将其右侧紧邻的表达式的真值取反。例如，如果变量小于10，一个程序必须执行某些步骤，条件可以写成：\n\
    \n```text\n(s < 10)\nor\n(!(s >= 10))\n/*s is not equal to or more than 10 */\n\
    ```\n\n关系运算符和逻辑运算符的优先级都低于算术运算符。\n\n*示例：*\n\n```text\n5 > 4 + 3\n```\n\n被计算为 5\
    \ > 7。算术运算 (4 + 3) 先于逻辑表达式 (5 > 7)。\n\n（其结果将为 false，即返回零。）\n\n下面的 `printf()`\n\
    \n```c\nprintf(\"%d\", 5 > 4 + 3);\n```\n\n将输出\n\n```text\n0\n```\n\n因为5小于7 (4+3)。\n\
    \n### 逻辑运算符示例\n\n```c\n// C Program to demonstrate the working of logical operators\n\
    #include <stdio.h>\nvoid main()\n{\n    int a = 5, b = 5, c = 10, result;\n  \
    \  result = (a == b) && (c > b);\n    printf(\"(a == b) && (c > b) equals to %d\
    \ \\n\", result);\n    result = (a == b) && (c < b);\n    printf(\"(a == b) &&\
    \ (c < b) equals to %d \\n\", result);\n    result = (a == b) || (c < b);\n  \
    \  printf(\"(a == b) || (c < b) equals to %d \\n\", result);\n    result = (a\
    \ != b) || (c < b);\n    printf(\"(a != b) || (c < b) equals to %d \\n\", result);\n\
    \    result = !(a != b);\n    printf(\"!(a != b) equals to %d \\n\", result);\n\
    \    result = !(a == b);\n    printf(\"!(a == b) equals to %d \\n\", result);\n\
    \    getch();\n}\n```\n\n### 输出\n\n```text\n(a == b) && (c > b) equals to 1\n\
    (a == b) && (c < b) equals to 0\n(a == b) || (c < b) equals to 1\n(a != b) ||\
    \ (c < b) equals to 0\n!(a != b) equals to 1\n!(a == b) equals to 0\n```\n\n###\
    \ 逻辑运算符程序说明\n\n- `(a == b) && (c > b)` 计算结果为 1，因为两个操作数 `(a == b)` 和 `(c > b)`\
    \ 都是 1（真）。\n- `(a == b) && (c < b)` 计算结果为 0，因为操作数 `(c < b)` 是 0（假）。\n- `(a ==\
    \ b) || (c < b)` 计算结果为 1，因为 `(a == b)` 是 1（真）。\n- `(a != b) || (c < b)` 计算结果为\
    \ 0，因为两个操作数 `(a != b)` 和 `(c < b)` 都是 0（假）。\n- `!(a != b)` 计算结果为 1，因为操作数 `(a !=\
    \ b)` 是 0（假）。因此，`!(a != b)` 为 1（真）。\n- `!(a == b)` 计算结果为 0，因为 `(a == b)` 是 1（真）。因此，`!(a\
    \ == b)` 为 0（假）。\n\n## 4. 赋值与复合赋值运算符\n\n### 赋值运算符\n\n赋值运算符用于将表达式或常量的结果赋给变量。\n\n\
    赋值运算符可用于任何有效表达式中，常用的赋值运算符是 `=`。\n\n```c\nvariable_Name = constant or expression;\n\
    ```\n\n算术表达式是变量、常量和运算符的组合。\n\n**例如：**\n\n```c\nx = a + b;\nz = 0;\nfinal = 100;\n\
    ```\n\n在赋值运算符中，右侧表达式的值被赋给左侧变量。\n\n在赋值运算符中，计算右侧表达式的值并将其赋给左侧变量。\n\n### 复合赋值或简写赋值运算符\n\
    \n**复合赋值运算符**允许您缩写赋值语句。例如，语句\n\n```c\nvalue = value + 3\n```\n\n该语句在赋值符号**两侧**都提到了变量\
    \ value，可以使用**加法赋值运算符** `+=` 缩写为\n\n```c\nvalue += 3\n```\n\n`+=` 运算符将右操作数的值加到左操作数的值上，并将结果存储在左操作数的变量中。\n\
    \n除了常用的赋值运算符 `=` 之外，C++ 还有如下形式的简写赋值运算符：\n\n```c\nvariable op = expression;\n```\n\
    \n其中 op 是 C 语言的二元算术运算符。\n\n| 复合赋值运算符 | 示例表达式 | 解释 | 赋值结果 |\n|---|---|---|---|\n\
    | **假设：c = 4, d = \"He\"** | | | |\n| `+=` | `c += 7` | `c = c + 7` | 11 赋给 c\
    \ |\n| `-=` | `c -= 3` | `c = c - 3` | 1 赋给 c |\n| `*=` | `c *= 4` | `c = c *\
    \ 4` | 16 赋给 c |\n| `/=` | `c /= 2` | `c = c / 2` | 2 赋给 c |\n| `%=` | `c %= 3`\
    \ | `c = c % 3` | 1 赋给 c |\n| `^=` | `c ^= 2` | `c = c ^ 2` | 16 赋给 c |\n| `&=`\
    \ | `d &= \"llo\"` | `d = \"kiran\" & \"llo\"` | \"Hello\" 赋给 kiran |\n\n**图 1.1：复合赋值运算符**\n\
    \n"
