  - "[PAGE 21]\n\n**Logical Negation Operator (!):** A logical expression can be changed\
    \ from false to true or from true to false with negation operator (!)\n\n| Situation\
    \ | Result |\n|---|---|\n| ! (true) | false |\n| ! (false) | true |\n\n*Example:*\n\
    \n```\n    ! (a < b) || (c > b)\n    ! (4 < 5) || (6 > 5)\n    ! (true) || (true)\n\
    \    false || true\n    true\n```\n\nSuppose a program has to perform certain\
    \ steps on the basis of the condition that a<10 and b = = 7. This condition is\
    \ coded using the relational operator in conjunction with the logical operator\
    \ **AND**. **This AND operator is represented by &&, and the condition will look\
    \ something like**\n\n```\n    (a < 10) &&(b = = 7)\n```\n\nsimilarly, **OR**\
    \ is used to check whether one of the condition is true. It is represented by\
    \ two consecutive vertical bar signs ||. If the same example is considered in\
    \ such a way that the steps in the program have to be performed if either of the\
    \ statements are true, then the condition will be checked as:\n\n```\n    (a <\
    \ 10) || (b = = 7)\n```\n\nThe third logical operator NOT is represented by a\
    \ single exclamation character (!). This operator reverses the truth value of\
    \ the expression to its immediate right. For example, a program has to do some\
    \ steps if a variable is less than 10, the condition can be written as:\n\n```\n\
    \    (s < 10)\n    or\n    (!(s >= 10))\n    /*s is not equal to or more than\
    \ 10 */\n```\n\nBoth relational and logical operators are lower in precedence\
    \ than the arithmetic operators.\n\n*Example:*\n\n```\n    5 > 4 + 3\n```\n\n\
    is evaluated as, 5 > 7. The arithmetic operation (4 + 3) precedes the logical\
    \ expression (5>)\n(The result for this will be false, that is zero will be returned.)\n\
    \nThe following printf( )\n\n```\n    printf(“%d”, 5> 4+3)\n```\n\nWill give\n\
    \n```\n    0\n```\n\nas 5 is less than 7 (4+3)."
