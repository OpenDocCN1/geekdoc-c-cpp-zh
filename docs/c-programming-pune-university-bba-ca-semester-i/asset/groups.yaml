    \n```c\nvoid main() function section\n{\n    Local declaration part\n    Executable\
    \ part\n}\n```\n\n**main() function section:** Every C program must have one main()\
    \ function section. The main() function is a startup function from where the execution\
    \ of the program starts. This section contains two parts: declaration part and\
    \ executable part.\n\n- 1. **Local declaration part:** The declaration part declares\
    \ all the variables used in the executable part as well as user-defined functions\
    \ can be declared locally in this section.\n- 2. **Executable part:** There is\
