    \ 3.14\n```\n\n这条语句称为“宏定义”，或者更常见地，直接称为“宏”。预处理器会将程序中每次出现的 PI 替换为 3.14。\n\n## 3.\
    \ 链接部分 / 包含部分\n\n### 文件包含：#include\n\n第二条预处理指令使一个文件被包含到另一个文件中。用于文件包含的预处理命令如下所示：\n\
    \n```c\n#include <file_name>\n```\n\n文件“file_name”的源代码会被包含到 C 程序 main() 函数中提及“#include\
    \ <file_name>”的位置。当然，这假定被包含的文件存在。\n\n该指令通常用于非常大的程序，这些程序可以划分为若干不同的文件，每个文件包含相关函数。这些文件通过在\
    \ main() 函数程序文件开头使用 **#include** 来包含。其次，常用的函数和宏定义可以存储在一个文件中，之后该文件可以被包含到每个程序中。\n\
    \n所有库函数的原型被分组到不同类别中，然后存储在不同的头文件中。例如，所有数学相关函数的原型都存储在头文件“math.h”中，可以如下所示包含该头文件：\n\
    \n```c\n#include<math.h>\n```\n\n#include 指令可以按以下讨论的两种方式使用：\n\n- `#include \"\
