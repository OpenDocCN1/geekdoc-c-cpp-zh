    shrutikrti\";\n```\n\n上述声明之间的区别在于：当我们将 char 声明为 \"string[20]\" 时，会分配 20 字节的内存空间来保存字符串值。当我们将\
    \ char 声明为 \"string[]\" 时，内存空间将在程序执行期间根据需求分配。\n\nC 语言中的字符串简单来说就是字符数组。字符串必须在最后一个字符之后有一个\
    \ NULL 或 \\0 字符，以表明字符串结束的位置。字符串可以声明为字符数组，也可以使用字符串指针声明。首先我们来看一个字符数组示例：\n\n```c\n\
    char mystr[15];\n```\n\n如你所见，字符数组的声明方式与普通数组相同。这个数组只能容纳 14 个字符，因为我们必须为 NULL 字符留出空间。\n\
    \n```c\n#include <stdio.h>\nint main()\n{\n    char name[15];\n    printf(\"Enter\
    \ name: \");\n    scanf(\"%s\", name);\n    printf(\"Your name is %s.\", name);\n\
    \    return 0;\n}\n```\n\n**输出：**\n\n```\nEnter name\nShrutkirti\nYour name is\
    \ Shrutkirti\n```\n\n### 5.8.2 声明\n\n声明字符串就像声明一维数组一样简单。下面是声明字符串的基本语法。\n\n```c\n\
    char str_name[size];\n```\n\n在上述语法中，str_name 是为字符串变量指定的任意名称，size 用于定义字符串的长度，即字符串将存储的字符数。请记住，还有一个额外的终止字符，即空字符（'\\\
    0'），用于表示字符串的终止，这正是字符串与普通字符数组的不同之处。\n\n### 5.8.3 初始化\n\n考虑下面的声明和初始化，它创建一个由单词 \"\
    Program\" 组成的字符串。为了在数组末尾保存空字符，包含该字符串的字符数组的大小比单词 \"Program\" 中的字符数多一。\n\n```c\n\
    char word[8] = {'P', 'r', 'o', 'g', 'r', 'a', 'm', '\\0'};\n```\n\n上述数组也可以按如下方式初始化\n\
    \n```c\nchar word[] = \"Program\";\n```\n\n### 内存中会发生什么？\n\n| 索引 | 0 | 1 | 2 |\
    \ 3 | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|---|\n| 数组 | P | r | o\
    \ | g | r | a | m | \\0 |\n| 内存地址 | 7890 | 7891 | 7892 | 7893 | 7894 | 7895 |\
    \ 7896 | 7897 |\n\n图 5.6：字符数组的内容\n\n当在数组中初始化字符串时，空字符会自动将 \\0 字符放在字符串末尾。\n\n示例：\n\
    \n```c\nvoid main()\n{\n    char word[8] = {'P', 'r', 'o', 'g', 'r', 'a', 'm',\
    \ '\\0'};\n    printf(\"Message = %s\", word );\n}\n```\n\n**输出：**\n\nMessage\
    \ = Program\n\n## 5.9 标准库函数\n\nC 语言本身不提供对字符串的显式支持。字符串处理函数在库中实现。字符串 I/O 操作在 `<stdio.h>`（puts、gets\
    \ 等）中实现。一组简单的字符串操作函数在 `<string.h>` 中实现，或在某些系统上在 `<strings.h>` 中实现。\n\n在 C 编程中，有一个单独的头文件用于处理字符串，名为\
    \ \"string.h\"。它提供了大量操作以空字符结尾的字符串的函数。\n\n### strcpy() 函数\n\n这个库函数用于复制字符串，可以这样使用：strcpy(destination,\
    \ source)。（在 C 中不能这样做：string1 = string2）。请看下面的示例：\n\n```c\nstr_one = \"shruit\"\
    ;\nstr_two = \"kirti\";\nstrcpy(str_one, str_two); // str_one becomes \"kirti\"\
    \n```\n\n**注意：** strcpy() 不会执行任何边界检查，因此存在越界访问字符串的风险。\n\n### strcmp() 函数\n\n这个库函数用于比较两个字符串，可以这样使用：strcmp(str1,\
    \ str2)。\n\n- 如果第一个字符串大于第二个字符串，则返回一个大于 null 的数。\n- 如果第一个字符串小于第二个字符串，则返回一个小于 null\
    \ 的数。\n- 如果第一个字符串和第二个字符串相等，则返回 null。\n\n"
