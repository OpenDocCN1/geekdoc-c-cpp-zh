    \ a two-dimensional integer array of size [x][y], you would write something as\
    \ follows\n\n```\n    data-type array_name[expression][expression];\n```\n\nwhere\
    \ data-type can be any valid C data type and array_name will be a valid C identifier.\
    \ A two-dimensional array can be considered as a table which will have x number\
