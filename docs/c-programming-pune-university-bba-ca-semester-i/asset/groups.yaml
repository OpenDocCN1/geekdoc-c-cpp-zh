    \ |\n| * / % | 乘法/除法/取模 | 从左到右 |\n| + - | 加法/减法 | 从左到右 |\n| << >> | 按位左移，按位右移\
    \ | 从左到右 |\n| < <= | 关系小于/小于或等于 | 从左到右 |\n| > >= | 关系大于/大于或等于 | 从左到右 |\n| == !=\
    \ | 关系等于/不等于 | 从左到右 |\n| & | 按位与 | 从左到右 |\n| ^ | 按位异或 | 从左到右 |\n| \\| | 按位或 |\
    \ 从左到右 |\n| && | 逻辑与 | 从左到右 |\n| \\|\\| | 逻辑或 | 从左到右 |\n| ?: | 三元条件 | 从右到左 |\n\
    | = += -= *= /= %= &= ^= \\|= <<= >>= | 赋值；加法/减法赋值；乘法/除法赋值；取模/按位与赋值；按位异或/按位或赋值；按位左移/右移赋值\
    \ | 从右到左 |\n| , | 逗号（分隔表达式） | 从左到右 |\n\n**注 1：** 圆括号也用于分组子表达式以强制采用不同的优先级；这种括号表达式可以嵌套，并从内到外求值。\n\
