    \n```c\nx = x + 1;      can be represented as\n\n1) ++x;         or         x++;\n\
    ```\n\n第一种情况称为前缀运算符，后一种情况称为后缀运算符。\n\n对于 -- 运算符也是如此，即 1) --x 或 x--。\n\n运算符前缀和后缀之间的区别在表达式中使用时非常有用。当运算符位于操作数之前时，C\
    \ 会在使用操作数的值之前执行自增或自减操作。如果运算符位于操作数之后，则先使用操作数的值，然后再进行自增或自减。\n\n### 示例：\n\n```c\n\
    x = 1;\ni = i + (++x);\n```\n\n在上面的表达式中，加到 i 上的 x 的值是 2。\n\n另一方面，\n\n```c\nx =\
    \ 1;\ni = i + (x++);\n```\n\nx 的值被添加到 i；在两种情况下，表达式求值后 x 的值均为 2。\n\n### 自增运算符的类型\n\
    \n- 前置自增\n- 后置自增\n\n### 前置自增（++variable）\n\n在前置自增中，先增加变量的值，然后在表达式中使用它（将其初始化到另一个变量中）。\n\
    \n**语法**\n\n```c\n++variable;\n```\n\n**前置自增示例**\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\nvoid main()\n{\n    int x,i;\n    i=10;\n    x=++i;\n    printf(\"\
    x: %d\",x);\n    printf(\"i: %d\",i);\n    getch();\n}\n```\n\n**输出：**\n\n```text\n\
    x: 11\ni: 11\n```\n\n在上述程序中，先增加 i 的值，然后在表达式中使用 i 的值。\n\n### 后置自增（variable++）\n\
    \n在后置自增中，先在表达式中使用变量的值（将其初始化到另一个变量中），然后再增加变量的值。\n\n**语法**\n\n```c\nvariable++;\n\
    ```\n\n**后置自增示例**\n\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main()\n\
    {\n    int x,i;\n    i=10;\n    x=i++;\n    printf(\"x: %d\",x);\n    printf(\"\
    i: %d\",i);\n    getch();\n}\n```\n\n**输出：**\n\n```text\nx: 10\ni: 11\n```\n\n\
    在上述程序中，先在表达式中使用 i 的值，然后将 i 的值增加 1。\n\n### 自减运算符的类型\n\n- 前置自减\n- 后置自减\n\n### 前置自减（--variable）\n\
    \n在前置自减中，先减少变量的值，然后在表达式中使用它（将其初始化到另一个变量中）。\n\n**语法**\n\n```c\n--variable;\n```\n\
    \n**前置自减示例**\n\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main()\n{\n \
    \   int x,i;\n    i=10;\n    x=--i;\n    printf(\"x: %d\",x);\n    printf(\"i:\
    \ %d\",i);\n    getch();\n}\n```\n\n**输出：**\n\n```text\nx: 9\ni: 9\n```\n\n在上述程序中，先减少\
    \ i 的值，然后在表达式中使用 i 的值。\n\n### 后置自减（variable--）\n\n在后置自减中，先在表达式中使用变量的值（将其初始化到另一个变量中），然后再减少变量的值。\n\
    \n**语法**\n\n```c\nvariable--;\n```\n\n**后置自减示例**\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\nvoid main()\n{\n    int x,i;\n    i=10;\n    x=i--;\n    printf(\"\
    x: %d\",x);\n    printf(\"i: %d\",i);\n    getch();\n}\n```\n\n**输出：**\n\n```text\n\
    x: 10\ni: 9\n```\n\n在上述程序中，先在表达式中使用 x 的值，然后将 i 的值减少 1。\n\n### 自增和自减运算符示例\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_30_0.png)\n\
    \n**示例**\n\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main()\n{\n    int\
    \ x,a,b,c;\n    a = 2;\n    b = 4;\n    c = 5;\n    x = a-- + b++ - ++c;\n   \
    \ printf(\"x: %d\",x);\n    getch();\n}\n```\n\n**输出：**\n\n```text\nx: 0\n```\n\
    \n## C 语言中前置/后置自增和自减运算符的区别\n\n下表将解释 C 编程语言中前置/后置自增和自减运算符的区别。\n\n| 运算符 | 运算符/说明\
    \ |\n| --- | --- |\n| 前置自增运算符（++） | 在将 i 的值赋值给变量 i 之前，i 的值先自增 |\n| 后置自增运算符（i++）\
    \ | 在将 i 的值赋值给变量 i 之后，i 的值自增 |\n| 前置自减运算符（--i） | 在将 i 的值赋值给变量 i 之前，i 的值先自减 |\n\
    | 后置自减运算符（i--） | 在将 i 的值赋值给变量 i 之后，i 的值自减 |\n\n## 6. 条件运算符或三元运算符\n\n**条件运算符（?:）：**\
    \ C 语言包含一个非常特殊的运算符，称为三元或条件运算符。它被称为三元运算符，因为它使用三个表达式。它是 **if_else 结构**的简写形式。条件运算符是一种三元运算符，也就是说，它作用于\
    \ 3 个操作数。\n\n三元运算符的格式为\n\n```c\nconditionalexpression1 ? expression2 : expression3\n\
    ```\n\n如果表达式1 求值为真，则计算表达式2，否则计算表达式3。\n\n条件运算符的工作原理如下：\n\n- 首先对第一个表达式 **条件表达式**\
    \ 进行求值。如果为真，该表达式求值为 1；如果为假，求值为 0。\n- 如果 **条件表达式** 为真，则计算 **表达式1**。\n- 如果 **条件表达式**\
    \ 为假，则计算 **表达式2**。\n\n**示例：**\n\n```c\n(1) if (i % 2 == 0)\n      even = true\n\
    \    else\n      even = false\n    even = (i % 2 == 0) ? true : false;\n(2) if\
    \ (i > j)\n      max = i\n    else\n      max = j\n    max = (i > j) ? i : j;\n\
    ```\n\n"
