    \ subfunction. Data Type of the return value will depend upon the return type\
    \ of function declaration. For instance, if the return type is int then return\
    \ value will be int.\n\nThis type of user-defined functions are called as a fully\
    \ dynamic function means, it provides maximum control to the end user.\n\n**Example:**\n\
    \nThis program allows the user to enter 2 integer values and then, We are going\
    \ to pass those values to the user-defined function to multiply those values and\
    \ return the value using return keyword.\n\n```\n```c\n#include<stdio.h>\nint\
