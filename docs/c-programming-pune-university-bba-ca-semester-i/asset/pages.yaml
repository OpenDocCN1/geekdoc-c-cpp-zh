    \ swap, value of x :20\nAfter swap, value of y :10\n```\n```\n\n# ## Recursive\
    \ Function\n\n**Recursion** is a process by which a function calls itself repeatedly,\
    \ until some specified condition has been satisfied. Function calling itself is\
    \ Recursion.\n\nThe process is used for repetitive computations in which each\
    \ action is stated in terms of a previous result.\n\nIn C, Recursion is a programming\
    \ technique that allows the programmer to express operations in terms of themselves.\n\
    \nRecursion is a process by which action calls itself repeatedly, until some specified\
    \ condition has been satisfied. The process is used for repetitive computations\
    \ in which each action is stated in terms of a previous result. It is similar\
    \ to looping. On the other hand, recursion makes it easier to express ideas in\
    \ which the result of the recursive call is necessary to complete the task.\n\n\
    **A simple example of recursion would be:**\n\n```\n```c\nvoid recurse()\n{\n\
    \    recurse(); /* Function calls itself */\n}\nint main()\n{\n    recurse();\
    \ /* Sets off the recursion */\n    return 0;\n}\n```\n```\n\nThis program will\
    \ not continue forever, however. The computer keeps function calls on a stack\
    \ and once too many are called without ending, the program will crash."
