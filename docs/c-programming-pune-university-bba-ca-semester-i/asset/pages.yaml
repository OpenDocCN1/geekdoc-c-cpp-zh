    +     - 1.4.3 Expression


    # ## 1.1 History of C Programming


    +   1. C is a programming language which was born at **“AT & T’s Bell Laboratory”**
    of USA in **1972**.

    +   2. C was written by **Dennis Ritchie**, that’s why he is also called as father
    of C programming language.

    +   3. C language was created for a specific purpose, i.e., designing the UNIX
    operating system (which is currently base of many UNIX based OS).

    +   4. From the beginning, C was intended to be useful to allow busy programmers
    to get things done because C is such a powerful, dominant and supple language

    +   5. Its use quickly spread beyond Bell Labs in the late 70s because of its
    long list of strong features


    # ## Why Name “C” was given to Language?


    +   1. Many of C’s principles and ideas were derived from the earlier language
    B. (Ken Thompson was the developer of B Language.)

    +   2. BCPL and CPL are the earlier ancestors of B Language

    +   3. CPL is common Programming Language. In 1967, **BCPL Language** (Basic CPL)
    was created as a scaled down version of CPL'
  merge: -1
  img_proc: true
- pgno: 6
  md: "+   4. As many of the **features were derived from “B” Language that’s why\
    \ it was named as “C”.**\n+   5. After 7-8 years C++ came into existence which\
    \ was first example of object-oriented programming.\n\n# ### C Programming Language\
    \ Timeline\n\n| Year |  | Developed by |\n| --- | --- | --- |\n| 1960 | ALGOL\
    \ | International Group |\n| 1967 | BCPL | Martin Richard |\n| 1970 | B | Ken\
    \ Thompson |\n| 1973 | Traditional C | Dennis Ritchie |\n| 1989 | ANSI C | ANSI\
    \ committee |\n| 1990 | ANSI/ISO C | ISO committee |\n\nC language has evolved\
    \ from three different structured languages ALGOL, BCPL and B Language. It uses\
    \ many concepts from these languages and introduced many new concepts such as\
    \ data types, structure pointer.\n\nIn 1988, the language was formalized by American\
    \ National Standard Institute (ANSI).\n\nIn 1990, a version of C language was\
    \ approved by the International Standard Organization (ISO) and that version of\
    \ C is also referred to as C89.\n\n# ## 1.2 Basic Structure of a Program\n\n#\
    \ ### Structure of the Program\n\nEvery C program follows the structure of Program\n\
    \n```\n~~~\nDocumentation Section / Comment section\nDefinition section\nLink\
    \ Section / Include Section\nGlobal Declaration\nvoid main( ) function section\n\
    {\n    Local declaration part\n    Executable part\n}\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 7
  md: "+   1. **The documentation section** consists of only comments.\n\nThis section\
    \ is also called the comment section. It is not compiled by the compiler. It is\
    \ a user section.\n\nUse of comments\n\nThe Single line comment can be written\
    \ by // (**double slash**) and\n\nMulti line comment\n\ncomment can be written\
    \ by\n\n```\n~~~\n/* --------\n   ---------- */\n~~~\n```\n\nComments (remarks)\
    \ may appear anywhere within a program, as long as they are placed within the\
    \ delimiters /* and */ (e.g., /* this is a comment */). Such comments are helpful\
    \ in identifying the program's principal features or in explaining the underlying\
    \ logic of various program features.\n\n+   2. **Definition Section:** All the\
    \ symbolic constants are written in definition section. Macros are known as symbolic\
    \ constants.\n\n+   3. The **Link section** provides instruction to the compiler\
    \ to take function from system library. E.g., To use the input & output functions\
    \ we use `#include<stdio.h>`, this is a link file. Please note that the character\
    \ (#) should be in the first column and there is no semicolon at the end of this\
    \ line.\n\n+   4. In the **Global Declaration section** the variable used in more\
    \ than one function can be declared in Global section. Functions can be declared\
    \ in this section.\n\n+   5. Every C program consist of one or more function,\
    \ one of which must be called the main( ) function. The program will always begin\
    \ by executing the main( ) function, which may access other functions. Any other\
    \ function definitions must be defined separately, either ahead of or after main(\
    \ ) function.\n\n**Each function must contain:**\n\n+   1. A function heading,\
    \ which consists of the function name, followed by an optional list of arguments,\
    \ enclosed in parentheses.\n\n+   2. A list of argument declarations, if arguments\
    \ are included in the heading.\n\n+   3. A compound statement, which comprises\
    \ the remainder of the function.\n\nThe arguments are symbols that represent information\
    \ being passed between the function and other parts of the program. (Arguments\
    \ are also referred to as parameters.)\n\nEach compound statement is enclosed\
    \ within a pair of braces, i.e., { }. The braces may contain one or more elementary\
    \ statements (called expression statements) and other compound statements. Thus\
    \ compound statements may be nested, one within another.\n\nEach expression statement\
    \ must end with a semicolon (;).\n\nThe C program may contain one or more sections\n\
    \nBoth the parts must be placed between opening and closing braces. The program\
    \ execution begins with the opening braces of main( ) function. Thus the closing\
    \ brace of main( ) function is the logical end of the program."
  merge: -1
  img_proc: true
