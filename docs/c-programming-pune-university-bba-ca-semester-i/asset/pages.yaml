  md: "When we declare char as “string[]”, memory space will be allocated as per the\
    \ requirement during execution of the program.\n\nA string in the C language is\
    \ simply an array of characters. Strings must have a NULL or \\0 character after\
    \ the last character to show where the string ends. A string can be declared as\
    \ a character array or with a string pointer. First we take a look at a character\
    \ array example:\n\n```\n```c\nchar mystr[15];\n```\n```\n\nAs you can see the\
    \ character array is declared in the same way as a normal array. This array can\
    \ hold only 14 characters, because we must leave room for the NULL character\n\
    \n```\n```c\n#include <stdio.h>\nint main()\n{\n    char name[15];\n    printf(\"\
    Enter name: \");\n    scanf(\"%s\", name);\n    printf(\"Your name is %s.\", name);\n\
    \    return 0;\n}\n```\n```\n\n# ### Output:\n\n```\n```\nEnter name\nShrutkirti\n\
    Your name is Shrutkirti\n```\n```\n\n# ## 5.8.2 Declaration\n\nDeclaring a string\
    \ is as simple as declaring a one-dimensional array. Below is the basic syntax\
    \ for declaring a string.\n\n```\n```c\nchar str_name[size];\n```\n```\n\nIn the\
    \ above syntax str_name is any name given to the string variable and size is used\
    \ define the length of the string, i.e the number of characters strings will store.\
    \ Please keep in mind that there is an extra terminating character which is the\
    \ Null character (‘\\0’) used to indicate termination of string which differs\
    \ strings from normal character arrays.\n\n# ## 5.8.3 Initialization\n\nConsider\
    \ the following declaration and initialization that creates a string consisting\
    \ of the word \"Program\". To hold the null character at the end of the array,\
    \ the size of the character array containing the string is one more than the number\
