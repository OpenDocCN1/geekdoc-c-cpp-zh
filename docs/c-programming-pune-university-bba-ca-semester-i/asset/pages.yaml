  md: "# # Error Handling in C Language\n\n**We distinguish between the following\
    \ types of errors:**\n\n+   1. **Syntax errors**: errors due to the fact that\
    \ the syntax of the language is not respected.\n+   2. **Semantic errors**: errors\
    \ due to an improper use of program statements.\n+   3. **Logical errors**: errors\
    \ due to the fact that the specification is not respected.\n+      [From programming\
    \ point of view of when]\n\n+   1. **Compile time errors**: syntax errors and\
    \ static semantic errors indicated by the compiler.\n+   2. **Runtime errors**:\
    \ dynamic semantic errors, and logical errors, that cannot be detected by the\
    \ compiler (debugging).\n\n# ## Syntax errors\n\nLet us see some examples of syntax\
    \ errors.\n\n**Example 1: Missing semicolon:**\n\n```\n    int a = 5 // semicolon\
    \ is missing\n    Compiler message:\n    Example. ‘;’ expected\n    int a = 5\n\
    ```\n\n**Example 2: Errors in expressions:**\n\n```\n    x = ( 3 + 5; // missing\
    \ closing parenthesis ‘)’\n    y = 3 + * 5; // missing argument between ‘+’ and\
    \ ‘*’\n```\n\n# ## Semantic errors\n\nLet us see some examples of semantic errors.\n\
    \n**Example 1: Use of a non-initialized variable:**\n\n```\n    int i;\n    i++;\
    \ // the variable i is not initialized\n```\n\n**Example 2: Type incompatibility:**\n\
    \n```\n    int a = \"hello\"; // the types String and int are not compatible\n\
    ```"
