  md: "# 7.6.2 Allocating Memory Dynamically\n\nWhile programming, if you are aware\
    \ of the size of an array, then it is easy and you can define it as an array.\
    \ For example, to store a name of any person, it can go up to a maximum of 100\
    \ characters, so you can define something as follows —\n\n```\n```c\nchar name[100];\n\
    ```\n```\n\nNow let us consider a situation where you have no idea about the length\
    \ of the text you need to store, for example, you want to store a detailed description\
    \ about a topic. Here we need to define a pointer to character without defining\
    \ how much memory is required and later, based on requirement, we can allocate\
    \ memory as shown in the below example —\n\n```\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <string.h>\nint main()\n{\n        char name[100];\n  \
    \      char *description;\n        strcpy(name, \"Zara Ali\");\n        /* allocate\
    \ memory dynamically */\n        description = malloc(200 * size of(char) );\n\
    \        if(description == NULL) {\n        fprintf(stderr, \"Error - unable to\
    \ allocate required memory\\n\");\n        }\n        else\n        {\n      \
    \  strcpy (description, \"Zara ali a DPS student in class 10th\");\n        }\n\
    \        printf(\"Name = %s\\n\", name );\n        printf(\"Description: %s\\\
    n\", description );\n}\n```\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result.\n\nName = Zara Ali\nDescription: Zara ali\
    \ a DPS student in class 10th\n\nSame program can be written using **calloc();**\
    \ only thing you need to replace malloc with calloc as follows —\n\n```\n```c\n\
    calloc(200, sizeof(char));\n```\n```\n\nSo you have complete control and you can\
    \ pass any size value while allocating memory, unlike arrays where once the size\
    \ defined, you cannot change it."
