    \    <tr><td><code>|</code></td><td>Bitwise inclusive OR</td><td>left-to-right</td></tr>\n\
    \    <tr><td><code>&amp;&amp;</code></td><td>Logical AND</td><td>left-to-right</td></tr>\n\
    \    <tr><td><code>||</code></td><td>Logical OR</td><td>left-to-right</td></tr>\n\
    \    <tr><td><code>?:</code></td><td>Ternary conditional</td><td>right-to-left</td></tr>\n\
    \    <tr><td><code>=</code><br><code>+=</code> <code>-=</code><br><code>*=</code>\
    \ <code>/=</code><br><code>%=</code> <code>&amp;=</code></td><td>Assignment<br>Addition/Subtraction\
    \ assignment<br>Multiplication/Division assignment<br>Modulus/Bitwise AND assignment</td><td>right-to-left</td></tr>\n\
    \    <tr><td><code>^=</code> <code>|=</code><br><code>&lt;&lt;=</code> <code>&gt;&gt;=</code></td><td>Bitwise\
    \ exclusive/inclusive OR assignment<br>Bitwise shift left/right assignment</td><td></td></tr>\n\
    \    <tr><td><code>,</code></td><td>Comma (separate expressions)</td><td>left-to-right</td></tr>\n\
    \    <tr><td colspan='3'><strong>Note 1:</strong> Parentheses are also used to\
    \ group sub-expressions to force a different precedence; such parenthetical expressions\
    \ can be nested and are evaluated from inner to outer.</td></tr>\n    <tr><td\
    \ colspan='3'><strong>Note 2:</strong> Postfix increment/decrement have high precedence,\
    \ but the actual increment or decrement of the operand is delayed (to be accomplished\
    \ sometime before the statement completes execution). So in the statement y =\
    \ x * z++; the current value of z is used to evaluate the expression (i.e., z++\
    \ evaluates to z) and z only incremented after all else is done. See postinc.c\
    \ for another example.</td></tr>\n  </tbody>\n</table>\n\n# **Notes:**\n\nPrecedence\
    \ and associativity are independent from order of evaluation.\n\nThe C language\
    \ standard doesn't specify operator precedence. It specifies the language grammar,\
    \ and the precedence table is derived from it to simplify understanding. There\
    \ is a part of the grammar that cannot be represented by a precedence table: assignment\
    \ is never allowed to appear on the right hand side of a conditional operator,\
    \ so e = a < d ? a++ : a = d is an expression that cannot be parsed, and therefore\
    \ relative precedence of conditional and assignment operators cannot be described\
    \ easily.\n\nHowever, many C compilers use non-standard expression grammar where\
    \ ?: is designated higher precedence than =, which parses that expression as e\
    \ = ( (( a < d ) ? (a++) : a ) = d ), which then fails to compile due to semantic\
    \ constraints: ?: is never lvalue and = requires a modifiable l value on the left.\
    \ This is the table presented on this page.\n\nNote that this is different in\
    \ C++, where the conditional operator has the same precedence as assignment."
