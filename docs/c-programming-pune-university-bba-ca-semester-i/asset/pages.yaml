  md: "# 5.2 Accessing an Array Element\n\nThe following snippet allows accessing\
    \ an array element from array items of integer type with a capacity of 40 elements\n\
    \n```\n```c\nint value;\nprintf(\"\\\\n Values of array item:\\\\n \");\nfor(i=0;i<40;i++)\n\
    {\n        value=items[i];\n        printf(\"\\\\n %d\", value);\n}\n```\n```\n\
    \nThe above for loop extracts the 40 elements stored in array items one at a time\
    \ in variable value and displays it in a printf() statement. Of course, the value\
    \ variable can be eliminated and the array element could have been displayed directly\
    \ in printf() statement as shown below.\n\n```\n```c\nprintf(\"\\\\n %d\", items[i]);\n\
    ```\n```\n\nIn some applications it may be desirable to assign initial values\
    \ to the elements of an array. This requires that the array either be defined\
