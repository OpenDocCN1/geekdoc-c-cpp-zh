  md: '# **Increment and Decrement Operators**


    **Increment Operators** are used to increased the value of the variable by one
    and **Decrement Operators** are used to decrease the value of the variable by
    one in C programs.


    Both increment and decrement operator are used on a single operand or variable,
    so it is called as a unary operator. Unary operators are having higher priority
    than the other operators it means unary operators are executed before other operators.


    # **Syntax**


    ```

    ++ // increment operator

    -- // decrement operator

    ```


    Increment and decrement operators are can not apply on constant.


    ```

    x= 4++; // gives error, because 4 is constant

    ```


    C includes two useful operators, which are generally not found in other computer
    languages. These are the increment operator (+ +) and the decrement operator (--).
    The operator ++ adds 1 to its operand, whereas the operator -- subtracts 1 from
    its operand.


    ```

    To be precise,


    x = x + 1;      can be written as     x++; and


    x = x -1;       can be written as     x--;

    ```


    Both these operators may either precede or follow the operand, i.e.,


    ```

    x = x + 1;      can be represented as


    1] ++x;         or         x++;

    ```


    The first case is known as prefix while the later one is known as postfix operator.


    Similar operations hold true for -- operator. i.e. 1] --x  or x --


    The difference between pre and post-fixing the operator is useful when it is used
    in an expression. When the operator precedes the operand, C performs the increment
    or decrement operation before using the value of the operand. If the operator
    follows the operand, the value of the operand is used before incrementing or decrementing
    it.


    # **Example:**


    ```

    x = 1;

    i = i+(+ + x);

    ```


    In the above expression, the value of x, which is added to i is 2


    On the other hand,


    ```

    x = 1;

    i = i + (x + +);

    x = 1 is added to i; in both the cases the value of x after evaluating the expression
    is 2.

    ```


    # **Type of Increment Operator**


    +   * pre-increment

    +   * post-increment'
