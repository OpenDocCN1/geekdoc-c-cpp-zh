    \  //Calling the function with dynamic values\n    Multi = Multiplication(a, b);\n\
    \    printf(\"\\n Multiplication of %d and %d is = %d \\n\", a, b, Multi);\n \
    \   return 0;\n}\n```\n```\n\n```\n```c\nint Multiplication(int a, int b)\n{\n\
