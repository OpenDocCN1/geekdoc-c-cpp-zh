- pgno: 53
  md: "# 3.2.3 Nested if-else Statement\n\nThe *if...else* statement executes two\
    \ different codes depending upon whether the test expression is true or false.\
    \ Sometimes, a choice has to be made from more than 2 possibilities.\n\nThe nested\
    \ *if...else* statement allows you to check for multiple test expressions and\
    \ execute different codes for more than two conditions.\n\n# Syntax of nested\
    \ if...else statement.\n\n```\n```\nif (testExpression1)\n{\n    // statements\
    \ to be executed if testExpression1 is true\n}\nelse if(testExpression2)\n{\n\
    \    // statements to be executed if testExpression1 is false and testExpression2\
    \ is true\n}\nelse if (testExpression 3)\n{\n    // statements to be executed\
    \ if testExpression1 and testExpression2 is false and testExpression3 is true\n\
    }\n.\n.\nelse\n{\n    // statements to be executed if all test expressions are\
    \ false\n}\n```\n```\n\n**The form of a multi-way decision using “if/else if”\
    \ statements is as follows:**\n\n```\n```\nif (logical expression)\nstmt1;\nelse\
    \ if (logical expression)\nstmt2;\nelse if (logical expression)\nstmt3;\nelse\
    \ if ( logical expression )\nstmtN;\nelse\nstmtF;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: "If the first logical expression is evaluated to true, then stmtT1 is executed.\
    \ If the second logical expression is true, then stmtT2 is executed and so on\
    \ down the line. If none of the logical expressions are true, then the statement\
    \ after “else” is executed which is stmtF.\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_54_0.png)\n\
    \nThe form of a multi-way decision using “nested ifs” is as follows:\n\n```\n\
    \    if (conditionA)\n    {\n        if (conditionB)\n        stmtBT;\n      \
    \  else\n            stmtBF;\n    }\n    else\n        stmtAF;\n```\n\nIf conditionA\
    \ is evaluated to true, then execution moves into the nested if and evaluates\
    \ conditionB. If conditionA is evaluated to false, then stmtAF is executed.\n\n\
    # **Example:**\n\n```\n    #include<stdio.h>\n    void main ()\n    { intvar;\n\
    \        printf(\"Enter a Number:\");\n        scanf(\"%d\",&var);\n        if(var%2==0)\n\
    \        {\n```"
