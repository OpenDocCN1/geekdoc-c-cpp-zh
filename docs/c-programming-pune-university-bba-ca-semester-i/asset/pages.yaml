    # 6.1.1 Purpose of Function


    +   1. C functions are used to avoid rewriting the same block of statements, which
    are to be executed again and again.

    +   2. Functions can be called as many times as required. No limitation on calling
    of a function.

    +   3. Defining function specifies modularization which divides large C programs
    into functions, i.e., dividing big task into small parts to achieve functionality.

    +   4. The core concept of modularization that means dividing program into functions
    is reusability.

    +   5. Modification is easily can be done because of modularization. Updation
    does not affect whole program only respective module will be affected.'
