  md: "# ### 5.6.3 Initialization of 2D Array\n\nConsider the following snippet to\
    \ understand two-dimensional array initialization.\n\n```\n```\nint items[4][2]\
    \ = { {34, 56},\n                    {12, 33},\n                    {34, 80},\n\
    \                    {12, 78}\n                  };\n```\n```\n\nThe above snippet\
    \ initializes a 4 by 2 two-dimensional array. the same array may be even initialized\
    \ in the following manner\n\n```\n```\nint items[4][2] = {1234, 56, 1212, 33,\
    \ 1434, 80, 1312, 78} ;\n```\n```\n\nOf course, it is little difficult to understand\
    \ so most of the programmers use the previous way to initialize the 2D array items.\n\
    \nIt is important to remember that while initializing a 2-D array it is necessary\
    \ to mention the second (column) dimension, whereas the first dimension (row)\
    \ is optional. That means the following declarations are valid\n\n```\n```\nint\
    \ items[4][2] = {34, 56, 12, 33, 34, 80, 12, 78} ;\nint items[][2] = {34, 56,\
    \ 12, 33, 34, 80, 12, 78} ;\n```\n```\n\nwhereas the following declarations are\
    \ not valid\n\n```\n```\nint items[4][] = {34, 56, 12, 33, 34, 80, 12, 78} ;\n\
    ```\n```\n\nProgrammers need to take care of the order in which initial values\
    \ are assigned to multidimensional array elements. The rule is that the last (rightmost)\
    \ subscript increases most rapidly, and the first (leftmost) subscript increases\
    \ least rapidly. Thus, the elements of a two-dimensional array will be assigned\
    \ by rows; i.e., the elements of the first row will be assigned, then the elements\
    \ of the second row, and so on. Hence the above declaration will have the initial\
    \ assignment as follows:\n\n| item[0][0] = 34 | item[0][1] = 56 | item[1][0] =\
    \ 12 | item[1][1] = 33 |\n|---|---|---|---|\n| item[2][0] = 34 | item[2][1] =\
    \ 80 | item[3][0] = 12 | item[3][1] = 78 |\n\n**Fig. 5.3: Contents of the Array\
    \ Items**\n\nObserve that the first subscript ranges from 0 to 2, while the second\
    \ one ranges from 0 to 3.\n\nThe natural order in which the initial values are\
    \ assigned can be altered by forming groups of initial values enclosed within\
    \ braces (i.e., { ... }). Consider the following example:\n\n```\n```\nint items[4][2]\
    \ = { {34},\n                    {12},\n                    {34},\n          \
    \          {12}\n                  } ;\n```\n```\n\nThis definition assigns values\
    \ only to the first elements in each row.\n\nTherefore, the array elements will\
    \ have the following initial values\n\n| item[0][0] = 34 | item[0][1] = 0 | item[1][0]\
    \ = 12 | item[1][1] = 0 |\n|---|---|---|---|\n| item[2][0] = 34 | item[2][1] =\
    \ 0 | item[3][0] = 12 | item[3][1] = 0 |\n\n**Fig. 5.4: Contents of the Array\
    \ Items after Initialization using Second Technique**"
