  md: "If a recursive function contains local variables, a set of local variables\
    \ will be created during each call. The names of the local variables will, of\
    \ course, always be the same, as declared within the function. However, the variables\
    \ will represent a different set of values each time the function is executed.\n\
    \nEach set of values will be stored on the stack, so that they will be available\
    \ as the recursive process “unwinds,” i.e., as the various function calls are\
    \ “popped” off the stack and executed.\n\n# 6.4 Storage Classes\n\nStorage class\
    \ in c language is a specifier which tells the compiler where and how to store\
    \ variables, its initial value and scope of the variable in a program. Or attributes\
    \ of variable is known as storage class or in compiler point of view a variable\
    \ identify some physical location within a computer where its string of bits value\
    \ can be stored is known as storage class. The kind of location in the computer,\
    \ where value can be stored is either in the memory or in the register. There\
    \ are various storage class which determined, in which of the two location value\
    \ would be stored.\n\nSyntax of declaring storage classes is:-\n\n    storageclass\
    \ datatype variable name;\n\nThere are four types of storage classes and all are\
    \ keywords:-\n\n+   1) Automatic (auto)\n+   2) Register (register)\n+   3) Static\
    \ (static)\n+   4) External (extern)\n\n# Examples:-\n\n```\nauto float x; or\
    \ float x;\nextern int x;\nregister char c;\nstatic int y;\n```\n\nCompiler assume\
    \ different storage class based on:-\n\n+   1) **Storage class:-** tells us about\
    \ storage place (where variable would be stored).\n+   2) **Initial value:-**\
    \ what would be the initial value of the variable. If initial value not assigned,\
    \ then what value taken by uninitialized variable.\n+   3) **Scope of the variable:-**\
    \ what would be the value of the variable of the program.\n+   4) **Life time:-**\
    \ It is the time between the creation and distribution of a variable or how long\
    \ would variable exists.\n\n# 1. Automatic storage class\n\nauto is the default\
    \ storage class for local variables. The keyword used to declare automatic storage\
    \ class is auto.\n\n# Features:-\n\n| Feature | Description |\n|---|---|\n| Storage\
    \ | Memory location |\n| Default initial value | Unpredictable value or garbage\
    \ value. |\n| Scope | Local to the block or function in which variable is defined.\
    \ |\n| Life time | Till the control remains within function or block in which\
    \ it is defined. |"
