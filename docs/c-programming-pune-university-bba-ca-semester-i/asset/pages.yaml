    #include <stdlib.h>\nint main ()\n{\n    printf(\"Start of the program....\\n\"\
    );\n    printf(\"Exiting the program....\\n\");\n    exit(0);\n    printf(\"End\
    \ of the program....\\n\");\n    return(0);\n}\n```\n```\n\n**Output:**\n\nStart\
    \ of the program....\nExiting the program...."
