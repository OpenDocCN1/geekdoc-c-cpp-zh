    | `\\` | Backslash |

    | `\v` | Vertical tab |

    | `\a` | Alert or bell |

    | `\?` | Question mark |

    | `\N` | Octal constant (N is an octal constant) |

    | `\XN` | Hexadecimal constant (N – hex.declnst) |


    # Tokens


    Tokens are individual words and punctuation marks in passage of text. In C, program
    the smallest individual units are known as C Tokens. C has **Six types of Tokens**.


    +   1. Keywords (eg: int, while),

    +   2. Identifiers (eg: main, total),

    +   3. Constants (eg: 10, 20),

    +   4. Strings (eg: "total", "hello"),

    +   5. Special symbols (eg: (), {}),

    +   6. Operators (eg: +, /, -, *)


    # 1.3.2 Keywords and Identifiers


    # Identifiers in C Language


    Each program elements in a C program are given a name called identifiers.


    Names given to identify variables, functions and arrays are examples for identifiers,
    e.g., x is a name given to integer variable in above program.'
