- pgno: 9
  md: "# ## 2. Definition section\n\nIt is Constant defining section, this section\
    \ is prefixed by # sign\n\n```\n```c\n# define pi 3.1415\n```\n```\n\n# is preprocessor\
    \ directive which gives direction to the compiler that define pi as a constant\
    \ value for the program.\n\nIt is also called as Macro defined.\n\n# ### Macro:\
    \ #define\n\nThis macro defines constant value and can be any of the basic data\
    \ types. These constants are usually defined at the beginning of a program. They\
    \ may then appear later in the program in place of the numeric constants, character\
    \ constants, etc., that the macro may represent. The syntax to use define macro\
    \ is as follows:\n\n```\n```c\n#define name value\n```\n```\n\nWhere name represents\
    \ a symbolic name, typically written in uppercase letters, and text represents\
    \ the sequence of characters that is associated with the symbolic name. Note that\
    \ text does not end with a semicolon, since a symbolic constant definition is\
    \ not a true C statement.\n\nLet’s see an example:\n\n```\n```c\n#define PI 3.14\n\
    void main()\n{\n    float radius=1.2;\n    float area_of_circle = PI * radius\
    \ * radius;\n    float circumference_of_circle = 2 * PI * radius;\n    printf(\"\
    \\n Details of circle\");\n    printf(\"\\n Area = %f\", area_of_circle);\n  \
    \  printf(\"\\n Circumference = %f\", circumference_of_circle);\n}\n```\n```\n\
    \nIn the above program, instead of writing the value of 3.14 for calculating area\
    \ and circumference of circle, a constant PI which is defined before the main()\
    \ method is used.\n\n```\n```c\n#define PI 3.14\n```\n```\n\nThis statement is\
    \ called ‘macro definition’ or more commonly, just a ‘macro’. The preprocessor\
    \ replaces every occurrence of PI in the program with 3.14.\n\n# ## 3. Link Section\
    \ / Include Section\n\n# ### File Inclusion: #include\n\nThe second preprocessor\
    \ directive causes one file to be included in another. The preprocessor command\
    \ for file inclusion looks like this:\n\n```\n```c\n#include <file_name>\n```\n\
    ```\n\nThe source code of the file “file_name” is included in the main( ) function\
    \ C program where “#include <file_name>” is mentioned. Of course this assuming\
    \ that the file being included is existing."
  merge: -1
  img_proc: true
- pgno: 10
  md: 'This directive is normally used for very large programs which can be divided
    into several different files each containing related functions. These files are
    **#include** at the beginning of main( ) function program file. Secondly, the
    commonly needed functions and macro definitions can be stored in a file, and that
    file can be included in every program later.


    The prototypes of all the library functions are grouped into different categories
    and then stored in different header files. For example prototypes of all mathematics
    related functions are stored in the header file “math.h” which can be included
    as shown below:


    ```

    #include<math.h>

    ```


    The #include directive can be used in two ways as discussed below:


    +   - `#include "filename"`

    +   - `#include <filename>`

    +   - `#include “sum.c”`

    +   - `#include “c:\employee.c”`


    It is Link section also called as include section, this section is prefixed by
    # sign


    +   - `# include<stdio.h>`

    +   - `# include<conio.h>`

    +   - `# include<math.h>`

    +   - `# include<stdlib.h>`


    # is preprocessor directive which gives direction to the compiler that include
    specified header file from Library to main( ) function program.


    | Header File | Description |

    |---|---|

    | `#include<stdio.h>` | It is standard input output header files, consist of standard
    input function scanf( ) and standard output function printf( ) |

    | `#include<conio.h>` | It is console input output header file, consist of clrscr(
    ) function to clear screen and getch( ) function to get character to see the output
    on screen. |

    | `#include<math.h>` | It is Math Medical Header File consist of all mathematical
    functions, sin( ), cos( ), tan( ), sqrt( ). |

    | `#include<stdlib.h>` | It is Standard Library File consist of Exit( ) function
    |

    | `#include<string.h>` | It is String Header File consist of string functions,
    strcmp( ), strlen( ), strcpy( ), strev( ), strcat( ). |

    | `#include<Ctype.h>` | All character handling functions are defined in this header
    file.functions<br>It consist of islower( ), isupper( ), isdigit( ) |


    # 4. Global Declaration Section


    The variable used in more than one function can be declared in Global section,
    hence, publically all these variables can be used in all the functions of the
    program as well as can be included in other programs also.


    User defined functions can be declared in this section with Signature of the function
    in a single line terminated by ; sign.'
  merge: -1
  img_proc: true
- pgno: 11
  md: "# ## Body Section\n\n```\n```c\nvoid main( ) function section\n{\n    Local\
    \ declaration part\n    Executable part\n}\n```\n```\n\n**main( ) function section:**\
    \ Every C program must have one main( ) function section. main ( ) function is\
    \ a startup function from where the execution of function starts. This section\
    \ contains two parts; declaration part and executable part\n\n+   1. **Local declaration\
    \ part:** The declaration part declares all the variables used in the executable\
    \ part as well as user defined functions can be declared locally in this section.\n\
    +   2. **Executable part:** There is at least one statement in the executable\
    \ part. These two parts must appear between the opening and closing braces. The\
    \ program execution begins at the opening brace and ends at the closing brace.\
    \ The closing brace of the main( ) function is the logical end of the program.\
    \ All statements in the declaration and executable part, end with a semicolon\
    \ leaving keyword statements.\n\n# ### 1.3 Language Fundamentals\n\n# #### 1.3.1\
    \ Character Set, Tokens\n\n# ##### Character Set\n\nC uses the uppercase letters\
    \ A to Z, the lowercase letters a to z, the digits 0 to 9, and certain special\
    \ characters as building blocks to form basic program elements (e.g., constants,\
    \ variables, operators, expressions, etc.).\n\nThe special characters are listed\
    \ below.\n\n**Table 1.1: Character Set**\n\n<table>\n<tr><td>+</td><td>-</td><td>*</td><td>\\\
    </td><td>/</td></tr>\n<tr><td>=</td><td>%</td><td>&amp;</td><td>~</td><td>#</td></tr>\n\
    <tr><td>!</td><td>?</td><td>^</td><td>.</td><td>\"</td></tr>\n<tr><td>|</td><td>&lt;</td><td>&gt;</td><td>(</td><td>)</td></tr>\n\
    <tr><td>{</td><td>}</td><td>[</td><td>]</td><td>:</td></tr>\n<tr><td>;</td><td>.</td><td>,</td><td>_</td><td>Blank\
    \ space</td></tr>\n</table>\n\nMost versions of the language also allow certain\
    \ other characters, such as @ and $, to be included within strings and comments.\n\
    \nC uses certain combinations of these characters, such as \\b, \\n and \\t,to\
    \ represent special conditions such as backspace, newline and horizontal tab,\
    \ respectively.\n\nThese character combinations are known as escape sequences.\
    \ For now we simply mention that each escape sequence represents a single character,\
    \ even though it is written as two or more characters."
  merge: -1
  img_proc: true
