  md: "# ## 4. External storage classes\n\nThe keyword used for this class is extern.\n\
    \n**Features :-**\n\n+   - **Storage** - Memory area\n+   - **Default initial\
    \ value** - Zero\n+   - **Scope** - Global\n+   - **Life time** - As long as program\
    \ execution remains it retains.\n\nDeclaration does not create variables, only\
    \ it refer that already been created at somewhere else. So, memory is not allocated\
    \ at a time of declaration and the external variables are declared at outside\
    \ of all the function.\n\n**Example:-**\n\n```\n~~~c\nint i,j;\nvoid main( )\n\
    {\n    printf(\"i=%d\",i);\n    increment( );\n    increment ( );\n    decrement(\
    \ );\n    decrement( );\n}\n\nincrement( )\n{\n    i=i+1;\n    printf(\"on incrementing\
    \ i=%d\",i);\n}\ndecrement( )\n{\n    i=i-1;\n    printf(\"on decrementing i=%d\"\
    ,i);\n}\n~~~\n```\n\n**Output:-**\n\n```\n~~~\ni=0\non incrementing i=1\non incrementing\
    \ i=2\non decrementing i=1\non decrementing i=0\n~~~\n```\n\nWhen there is large\
    \ program i.e divided into several files, then external variable should be preferred.\
    \ External variable extend the scope of variable."
