    \ example explains the same:\n\n```\n```c\nint items[]={1,6,3,9,2,4,8,0};\nvoid\
    \ main()\n{\n        int i, value=0;\n        printf(\"\\\\n Values of array item:\\\
    \\n \");\n        for(i=0;i<8;i++)\n        {\n                value=items[i];\n\
    \                printf(\"\\\\n %d\", value);\n        }\n}\n```\n```\n\nNote\
    \ that this version of the program does not require any input data. Execution\
    \ of this program will generate the following output.\n\n```\n```text\nValues\
    \ of array item:\n1\n6\n3\n9\n2\n4\n8\n0\n```\n```"
