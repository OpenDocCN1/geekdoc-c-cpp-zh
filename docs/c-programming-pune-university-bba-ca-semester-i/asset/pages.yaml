    # ### 7.3.2 What Happens at Memory Level


    Assume the following snippet for this example


    ```

    ```c

    int x=50, y=45;

    int *ptr_x;

    ptr_x = &x;

    y = *ptr_x;

    x = ptr_x;

    *ptr_x = 30;

    ```

    ```


    Lets see what happens in memory for each and every corresponding statement of
    the above snippet in Fig. 7.1. Assume for the sake of this discussion that variable
    x resides at memory location 1450, y at 1560 and ptr_x at 2581. (Note A pointer
    is a variable and thus its values need to be stored somewhere.)


    | Program snippet | Memory | Garbage value |

    |---|---|---|

    | `int x=50, y=45;` |  | 4789 |

    | `int *ptr_x;` | x = 50<br>1450<br>y = 45<br>1560<br>ptr_x = 4789<br>2581 |  |

    | `ptr_x = &x;` | x = 50<br>1450<br>y = 45<br>1560<br>ptr_x = 1450<br>2581 |  |

    | `y = *ptr_x;` | x = 50<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581 |  |

    | `x = ptr_x` | x = 1450<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581 |  |

    | `*ptr_x = 30` | x = 30<br>1450<br>y = 50<br>1560<br>ptr_x = 1450<br>2581 |  |


    **Fig. 7.1: How Pointers Work at Machine Level (Memory)**


    The program starts by declaring the integer variables x and y; it also initializes
    them with 50 and 45 respectively. It later defines a pointer variable ptr_x that
    is assigned the address of x. so ptr_x gets loaded with the value 1450. now y
    is assigned the contents of ptr_x. ptr_x succumbs to memory location 1450, i.e.,
    location of x. so y gets assigned to the value of x, i.e., 50. now xi assigned
    with ptr_x, that itself, holds the address of x. so x gets loaded with its own
    address, i.e., 1450. Finally, *ptr_x is assigned with 30. *ptr_x means value at
    the location pointed by ptr_x that is x itself. So x gets loaded with 30.


    # ### 7.4 Indirection Operator and Address of Operator


    Pointers are variables which points address of another variable used in C program,
    to access the memory and manipulate the address, address is to be referred with
    & operator and * sign can be used as a notation to dereference the pointer.'
