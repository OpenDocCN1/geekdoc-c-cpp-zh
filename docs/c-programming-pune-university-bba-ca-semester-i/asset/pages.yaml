  md: "# Address in C\n\nIf you have a variable **var** in your program, **&var**\
    \ will give you its address in the memory, where **&** is commonly called the\
    \ reference operator or address of operator.\n\nYou must have seen this notation\
    \ while using scanf() function. It was used in the function to store the user\
    \ inputted value in the address of **var**.\n\n```\nscanf(\"%d\", &var);\n/* Example\
    \ to demonstrate use of reference operator in C programming. */\n#include <stdio.h>\n\
    int main()\n{\n        int var = 5;\n        printf(\"Value: %d\\\\n\", var);\n\
    \        printf(\"Address: %u\", &var);  //Notice, the ampersand(&) before var.\n\
    \        return 0;\n}\n```\n\n**Output:**\n\nValue: 5\n\nAddress: 2686778\n\n\
    > **Note:** You may obtain different value of address while using this program.\n\
    \nIn above source code, value 5 is stored in the memory location 2686778. var\
    \ is just the name given to that location.\n\n# Address of OR Reference Operator\
    \ (&) and Indirection OR Dereference Operator (*)\n\n**&** is called address of\
    \ OR reference operator. It gives you the address of a variable.\n\nLikewise,\
    \ there is another operator that gets you the value from the address, it is called\
    \ a indirection OR dereference operator (*).\n\n> **Note:** The * sign when declaring\
    \ a pointer is not a dereference operator. It is just a similar notation that\
    \ creates a pointer.\n\n# *Example To Demonstrate Working of Pointers*\n\n```\n\
    /* Source code to demonstrate, handling of pointers in C program */\n#include\
    \ <stdio.h>\nint main()\n{\n        int* pc;\n        int c;\n        c=22;\n\
    \        printf(\"Address of c:%u\\\\n\", &c);\n        printf(\"Value of c:%d\\\
    \\n\",c);\n        pc=&c;\n        printf(\"Address of pointer pc:%u\\\\n\",pc);\n\
    ```"
