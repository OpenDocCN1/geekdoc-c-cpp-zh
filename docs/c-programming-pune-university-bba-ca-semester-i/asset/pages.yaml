  md: "book_author is the member of the structure, which in turn is a structure of\
    \ type author. To access the first_name member of book_author use\n\n```\n   \
    \ cprog.book_author.first_name\n```\n\nSimilarly,\n\n```\n    cprog.book_author.no_of_pages\n\
    ```\n\nThis value can be incremented by writing\n\n```\n    ++cprog.book_author.first_name\n\
    ```\n\nThe first member title is a character array. The fourth element of this\
    \ array, can be access by using\n\n```\n    cprog.title[3]\n```\n\nStructure members\
    \ can be processed in the same manner as ordinary variables of the same data type.\
    \ Single-valued structure members can appear in expressions, they can be passed\
    \ to functions, and they can be returned from functions, as though they were ordinary\
    \ single-valued variables. Complex structure members are processed in the same\
    \ way as ordinary data items of that same type.\n\nWhat does this imply? Structure\
    \ members which are arrays can be processed in the same manner as an ordinary\
    \ array. Structure member that is a structure can be processed on member at a\
    \ time in the same manner as any other structure. These operations are shown below\n\
    \nConsider the structure\n\n```\n    struct author {\n        char first_name[15];\n\
    \        char last_name[15];\n    };\n    struct book {\n        char title[20];\n\
    \        struct author book_author;\n        int no_of_pages;\n        float cost;\n\
    \    } cprog;\n```\n\nSeveral operations to access structure members\n\n```\n\
    \    cprog.no_of_pages=455;\n```\n\nThis statement assigns the value of 455 to\
    \ cprog.no_of_pages\n\n```\n    printf(\"Book title is %s\", cprog.title);\n```\n\
    \nThis statement passes the array cprog.title to the printf function, so that\
    \ it could be printed on console.\n\n```\n    printf(\"Author's name %s %s\",\
    \ cprog.book_author.first_name, cprog.book_author.last_name);\n```\n\nThis statement\
    \ passes two arrays cprog.book_author.first_name and cprog.book_author.last_name\
    \ to the printf function, both of which are submembers of structure cprog, so\
    \ that it could be printed on console."
