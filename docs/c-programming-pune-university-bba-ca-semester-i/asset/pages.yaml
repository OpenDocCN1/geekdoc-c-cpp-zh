    ![](img/35ea447eca4d04af54f37bf3d3ca337d_147_0.png)


    # Function definition


    # 6.1.3 Function Declaration


    General syntax of function declaration(also known as function prototype) is,


    **return-type function-name ( parameter-list ) ;**


    Like variable and an array, a function must also be declared before it is called.
    A function declaration tells the compiler about a function name and how to call
    the function. The actual body of the function can be defined separately. A function
    declaration consist of 4 parts.


    +   - return-type

    +   - function name

    +   - parameter list

    +   - terminating semicolon


    **return-type**


    return type specifies the type of value (int, float, char, double) that function
    is expected to return to the program calling the function. The return type must
    be void if no value is returned.


    **function-name**


    function name specifies the name of the function. The function name is any valid
    C identifier and therefore must follow the same rule of formation as other variables
    in C.


    **parameter-list**


    The parameter list declares the variables that will receive the data sent by calling
    program. They are often referred to as formal parameters. These parameters are
    also used to send values to a calling program.'
