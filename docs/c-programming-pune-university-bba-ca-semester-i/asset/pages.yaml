    \n# 5.9 Standard Library Functions\n\nThe C language provides no explicit support\
    \ for strings in the language itself. The string-handling functions are implemented\
    \ in libraries. String I/O operations are implemented in `<stdio.h>` (puts , gets,\
    \ etc). A set of simple string manipulation functions are implemented in `<string.h>`,\
    \ or on some systems in `<strings.h>`.\n\nThere is a separate header file that\
    \ handles String in C Programming named “string.h”. It provides a wide range of\
    \ functions that manipulate a null-terminated string.\n\n# strcpy() function\n\
    \nThis library function is used to copy a string and can be used like this: strcpy(destination,\
    \ source). (It is not possible in C to do this: string1 = string2). Take a look\
    \ at the following example:\n\n```\n```c\nstr_one = \"shruit\";\nstr_two = \"\
    kirti\";\nstrcpy(str_one , str_two); // str_one becomes \"kirti\"\n```\n```\n\n\
    **Note:** strcpy() will not perform any boundary checking, and thus, there is\
    \ a risk of overrunning the strings.\n\n# strcmp() function\n\nThis library function\
    \ is used to compare two strings and can be used like this: strcmp(str1, str2).\n\
    \n+   - If the first string is greater than the second string a number greater\
    \ than null is returned.\n+   - If the first string is less than the second string\
    \ a number less than null is returned.\n+   - If the first and the second string\
    \ are equal a null is returned."
