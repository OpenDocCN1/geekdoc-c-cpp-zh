- pgno: 16
  md: "+   (a) **Integer Arithmetic:** When both the operands are integers, the operation\
    \ is called integer arithmetic.\n+   \n+   *For e.g.,*\n+   \n+   55 − 5 = 50\n\
    +   55 + 5 = 60\n+   14 * 2 = 28\n+   14/2 = 7 (Decimal part truncated integer\
    \ division)\n+   14% 2 = 0 (Remainder of division)\n+   − 14 % 3 = − 2\n+   14\
    \ % 3 = 2\n+   6/7 = 0\n\n+   (b) **Real Arithmetic:** An arithmetic operation\
    \ involving only real operands is called real arithmetic. A real operand may assume\
    \ values either in fractional or exponential form.\n+   \n+   *For e.g.,*\n+ \
    \  \n+   1.5 − 0.7 = 0.8\n+   1.5 + 0.7 = 2.2\n+   1.5 * 2.0 = 3.0\n+   6.0/7.0\
    \ = 0.857143\n+   1.0/3.0 = 0.3333\n+   − 2.0/3.0 = − 0.666667\n+   % (modulo\
    \ operator) can not be used with Real numbers\n+   x_int/y_int = result_int\n\
    +   x_int/y_float = result_float\n+   x_float/y_int = result_float\n+   x_float/y_float\
    \ = result_float\n\n+   (c) **Mixed Mode Arithmetic:** C++ permits us to mix integer\
    \ operand with real operand. When one operand is real and the other is integer,\
    \ the expression is called mixed mode arithmetic expression i.e. if either of\
    \ the operand is of the real type, then only real operation is performed and result\
    \ is always a real number.\n+   \n+   *For e.g.,*\n+   \n+   15/10.0 = 1.5\n+\
    \   4 + 3.5 = 7.5\n\n# **Example of Arithmetic Operators**\n\n```\n~~~c\n// C\
    \ Program to demonstrate the working of arithmetic operators\n    #include <stdio.h>\n\
    \    void main()\n    {\n        int a = 9,b = 4, c;\n~~~\n```"
