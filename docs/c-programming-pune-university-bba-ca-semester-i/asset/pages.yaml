  md: "# # Practicals of C Programming\n\n|  |  |\n|---|---|\n| **PROGRAMS TO UNDERSTAND\
    \ THE BASIC DATA TYPE AND I/O** | |\n| 1. | Write a program to display the message\
    \ Welcome. |\n| 2. | Write a program to declare some variables of type int, float\
    \ and double. Assign some values to these variables and display these values.\
