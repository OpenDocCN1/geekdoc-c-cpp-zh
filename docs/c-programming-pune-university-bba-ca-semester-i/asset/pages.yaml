    \ how many times we call increment( ), x is initialized to1 every time.\n\n```\n\
    ```c\nmain( )\n{\n    increment( );\n    increment( );\n    increment ( );\n}\n\
    increment( )\n{\n    static int x=10;\n    printf(\"%d\",x);\n    x++;\n}\n```\n\
    ```\n\n# Output:-\n\n```\n```text\n1\n2\n3\n```\n```\n\nIn above example, when\
