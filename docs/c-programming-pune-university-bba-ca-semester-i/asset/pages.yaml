    n\",answer);\n        return 0;\n}\n```\n\nIn example, global variables are declared,\
    \ x and y. These variables can be used in main() and add(). The local variables\
    \ answer can only be used in main().\n\n# 6.3 Call by Value and Call by Reference\n\
    \nIn C programming language call by value and call by reference (also known as\
    \ pass-by-value and pass-by-reference). These methods are different ways of passing\
    \ (or calling) data to functions.\n\nIn call by value while.\n\nIn call by reference\
    \ while\n\nCall by value and call by reference function parameters can be passed\
    \ by two ways:\n\n+   1. Call by value (function call we pass values of variables)\n\
    +   2. Call by Reference (function call we pass reference or address of variables)\n\
    \n# Call by Value\n\nIf data is passed by value, the data is copied from the variable\
    \ used in for example main() to a variable used by the function. So if the data\
    \ passed (that is stored in the function variable) is modified inside the function,\
    \ the value is only changed in the variable used inside the function. Let’s take\
    \ a look at a call by value example:"
