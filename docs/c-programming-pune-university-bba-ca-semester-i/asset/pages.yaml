- pgno: 47
  md: '**Output:**

    ATSS has 35123 students

    To left justify, use a negative number in the field width:


    ```

    ```

    printf("ATSS has %-10d students", numStudents);

    ```

    ```


    **Output:**

    ATSS has 35123 students

    If the field width is too small or left unspecified, it defaults to the minimum
    number of characters required to print the item:


    ```

    ```

    printf("ATSS has %2d students", numStudents);

    ```

    ```


    **Output:**

    ATSS has 35123 students

    Specifying the field width is most useful when printing multiple lines of output
    that are meant to line up in a table format


    # Printing Floating-point Numbers


    Use the %f modifier to print floating point values in fixed notation:


    ```

    ```

    double cost = 123.45;

    printf("Your total is $%f today\n", cost);

    ```

    ```


    **Output:**

    Your total is $123.450000 today

    Use %e for exponential notation:


    ```

    ```

    printf("Your total is $%e today\n", cost);

    ```

    ```


    **Output:**

    Your total is $1.234500e+02 today

    Note that the e+02 means "times 10 to the 2nd power"

    You can also control the decimal precision, which is the number of places after
    the decimal. Output will round to the appropriate number of decimal places, if
    necessary:


    ```

    ```

    printf("Your total is $%.2f today\n", cost);

    ```

    ```


    **Output:**

    Your total is $123.45 today

    Field width can also be controlled, as with integers:


    ```

    ```

    printf("Your total is $%9.2f today\n", cost);

    ```

    ```


    **Output:**

    Your total is $ 123.45 today

    In the conversion specifier, the number before the decimal is field width, and
    the number after is the precision. (In this example, 9 and 2).

    0%-9.2 would left-justify in a field width of 9, as with integers'
