  md: "# 7.6.3 Resizing and Releasing Memory\n\nWhen your program comes out, operating\
    \ system automatically release all the memory allocated by your program but as\
    \ a good practice when you are not in need of memory anymore then you should release\
    \ that memory by calling the function free().\n\nAlternatively, you can increase\
    \ or decrease the size of an allocated memory block by calling the function realloc().\
    \ Let us check the above program once again and make use of realloc() and free()\
    \ functions –\n\n```\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\nint main() {\n    char name[100];\n    char *description;\n    strcpy(name,\
    \ \"Shrutkirti Shelar\");\n    /* allocate memory dynamically */\n    description\
    \ = malloc(30 * sizeof(char));\n    if(description == NULL) {\n        fprintf(stderr,\
    \ \"Error - unable to allocate required memory\\\\n\");\n    }\n    else {\n \
    \       strcpy(description, \"Shrutkirti Shelar a CS student\");\n\n        /*\
    \ suppose you want to store bigger description */\n        description = realloc(description,\
    \ 100 * sizeof(char));\n        if(description == NULL) {\n            fprintf(stderr,\
    \ \"Error - unable to allocate required memory\\\\n\");\n        }\n        else\
    \ {\n            strcat(description, \"She is in Computer Science class\");\n\
    \        }\n    }\n    printf(\"Name = %s\\\\n\", name);\n    printf(\"Description:\
    \ %s\\\\n\", description);\n    /* release memory using free() function */\n \
    \   free(description);\n}\n```\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result.\n\nName = Shrutkirti Shelar\n\nDescription:\
    \ Shrutkirti Shelar a CS student. She is in Computer Science class"
