  md: "It terminates when function is released.\nThe variable without any storage\
    \ class specifier is called automatic variable.\n\n**Example:-**\n\n```\nmain()\n\
    {\n        auto int i;\n        printf(\"%d\",i);\n}\n```\n\n# 2. Register storage\
    \ class\n\nregister is used to define local variables that should be stored in\
    \ a register instead of RAM. The keyword used to declare this storage class is\
    \ register.\n\n+   **Features:-**\n+   \n+   - **Storage** — CPU register.\n+\
    \   - **Default initial value** — Garbage value\n+   - **Scope** — Local to the\
    \ function or block in which it is defined.\n+   - **Life time** — Till controls\
    \ remains within function or blocks in which it is defined.\n\nRegister variable\
    \ don’t have memory address so we can’t apply address operator on it. CPU register\
    \ generally of 16 bits or 2 bytes. So we can apply storage classes only for integer,\
    \ characters, pointer type. Variable stored in register storage class always access\
    \ faster than,which is always stored in the memory. But to store all variable\
    \ in the CPU register is not possible because of limitation of the register pair.\
    \ And when variable is used at many places like loop counter, then it is better\
    \ to declare it as register class.\n\n**Example:-**\n\n```\nmain()\n{\n      \
    \  register int i;\n        for(i=1;i<=10;i++)\n        printf(\"%d\",i);\n}\n\
    ```\n\n# 3. Static storage class\n\nThe keyword used to declare static storage\
    \ class is static.\n\n+   **Feature :-**\n+   \n+   - **Storage** — Memory location\n\
    +   - **Default initial value** — Zero\n+   - **Scope** — Local to the block or\
    \ function in which it is defined.\n+   - **Life time** — Value of the variable\
    \ persist or remain between different function call.\n\nStatic is the default\
    \ storage class for global variables. The two variables below (count and road)\
    \ both have a static storage class."
