    \ of the function call_by_value().\n\n**2. Call by reference:** In this function,\
    \ declaration and definition parameters are passed by reference. In this formal\
    \ parameters of function definition become aliases to the actual arguments in\
    \ the calling function.\n\nThe call by reference method of passing arguments to\
    \ a function copies the address of an argument into the formal parameter. Inside\
    \ the function, the address is used to access the actual argument used in the\
    \ call. It means the changes made to the parameter affect the passed argument.\n\
    \nTo pass a value by reference, argument pointers are passed to the functions\
    \ just like any other value. So accordingly you need to declare the function parameters\
    \ as pointer types as in the following function swap(), which exchanges the values\
    \ of the two integer variables pointed to, by their arguments. The pointer variables\
    \ are to be specified in function declaration and function definition.\n\n```\n\
    ```c\n/* function definition to swap the values */\nvoid swap(int *a, int *b)\n\
    {\n    int temp;\n    temp = *a;    /* save the value at address a */\n    *a\
    \ = *b;      /* put b into a */\n    *b = temp;    /* put temp into b */\n   \
    \ Return\n}\n```\n```\n\nLet us now call the function swap() by passing values\
    \ by reference as in the following example\n\n```\n```c\n#include <stdio.h>\n\
    \    /* function declaration */\n    void swap(int *a, int *b);\n    void main\
    \ ()\n    {\n        /* local variable definition */\n        int x = 10;\n  \
    \      int y = 20;\n        printf(\"Before swap, value of x : %d\\n\", x );\n\
    \        printf(\"Before swap, value of y : %d\\n\", y );\n        /* calling\
    \ a function to swap the values.\n         * &x indicates pointer to x ie. address\
    \ of variable x and\n         * &y indicates pointer to y ie. address of variable\
    \ y.\n         */\n```\n```"
