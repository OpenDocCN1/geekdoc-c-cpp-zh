    # ## 3.1 Introduction


    **Decision making:** It is about selecting one option from the available options,
    which are more than one. While writing programs this concept is always going to
    play an important role. We have to provide the capabilities to program so that
    it can take decisions on its own, depending upon the various possible inputs from
    the user.


    Decision making is about deciding the order of execution of statements based on
    certain conditions or repeating a group of statements until certain specified
    conditions are met. We can perform different- different tasks based on the conditions.
    C language handles decision making in various ways as follows.'
