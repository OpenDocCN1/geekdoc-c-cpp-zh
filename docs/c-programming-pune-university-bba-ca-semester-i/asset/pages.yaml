- pgno: 70
  md: "Continue statement works Following way:\n\n```\n    while (test Expression)\n\
    \    {\n        // codes\n        If (condition for continue)\n        {\n   \
    \         continue;\n        }\n        // codes\n    }\n\n    for (init, condition,\
    \ update)\n    {\n        // codes\n        if (condition for continue)\n    \
    \    {\n            continue;\n        }\n        // codes\n    }\n```\n\n# **The\
    \ continue statement can be used in for loop**\n\nThe **continue** allows you\
    \ to continue the execution of a **for** or **while** loop from the beginning,\
    \ making it possible to skip the rest of the statement in the loop after the **continue**\
    \ statement.\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_70_0.png)"
  merge: -1
  img_proc: true
- pgno: 71
  md: "**Example:**\n\n```\n```c\n#include <stdio.h>\nvoid main( )\n{\nstatic int\
    \ marks[5] = {90,80,76,89, -90};\nint i, total = 0;\nfor(i=0; i<5; i++)\n{\n \
    \   if(marks[i] <0)\n    {\n        printf(\"negative marks not added \\n\");\n\
    \        continue;\n    }\n    total += marks[i]\n}\nprintf(\"total marks = %d\
    \ \\n\", total);\ngetch( );\n}\n```\n```\n\n# ### 3.4.3 goto\n\nA goto statement\
    \ in C programming provides an unconditional jump from the 'goto' to a labeled\
    \ statement in the same function.\n\n# ### Syntax\n\nThe syntax for a **goto**\
    \ statement in C is as follows −\n\n```\n```c\ngoto label;\n... ... ...\n... ...\
    \ ...\n... ... ...\nlabel:\nstatement;\n```\n```\n\nHere **label** can be any\
    \ plain text except C keyword and it can be set anywhere in the C program above\
    \ or below to **goto** statement. The label is an identifier. When **goto** statement\
    \ is encountered, control of the program jumps to **label:** and starts executing\
    \ the code."
