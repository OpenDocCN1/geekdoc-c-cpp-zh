- pgno: 160
  md: "```\n```c\nlong int factorial(int n);\n/* read in the integer value */\n  \
    \  scanf(\"%d\", &n);\n/* calculate and display the factorial */\n    printf(\"\
    n! = %ld\\n\", factorial(n));\n    getch();\n}\n\n/* function definition */\n\
    long int factorial(int n) /* calculate the factorial */\n{\n    if (n <= 1)\n\
    \        return( 1 );\n    else\n        return(n * factorial(n - 1));\n}\n```\n\
    ```\n\nThe main portion of the program simply reads the integer quantity n and\
    \ then calls the long-integer recursive function factorial. The function factorial\
    \ calls itself recursively, with an actual argument (n - 1) that decreases in\
    \ magnitude for each successive call. The recursive calls terminate when the value\
    \ of the actual argument becomes equal to 1.\n\n# Recursive Method\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_160_0.png)"
