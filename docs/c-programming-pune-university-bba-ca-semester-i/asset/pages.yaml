  md: "# # Bitwise Logical Operators\n\nC has powerful features and is the set of\
    \ bit manipulation operators. These permits the programmer to access and to manipulate\
    \ individual bits within a piece of data.\n\n| Operator | Meaning |\n|---|---|\n\
    | & | Bitwise AND |\n| \\| | Bitwise OR |\n| ^ | Bitwise XOR (EXOR) |\n| >> |\
    \ Bitwise right shift |\n| << | Bitwise left shift |\n| ~ | Bitwise complement\
    \ |\n\n**(a) Bitwise AND:** The bitwise AND operation will be carried out between\
    \ the two bit patterns of the two operands.\n\n| Variable | Value | Binary pattern\
    \ |\n|---|---|---|\n| x | 5 | 0101 |\n| y | 2 | 0010 |\n| x & y | 0 | 0000 |\n\
    | a | 6 | 0110 |\n| b | 3 | 0011 |\n| a & b | 2 | 0010 |\n\nTo generate a 1 bit\
    \ in the result, bitwise AND need a one in both numbers.\n\n**Bitwise AND operator\
    \ & :-**\n\nThe output of bitwise AND is 1 if the corresponding bits of two operands\
    \ is 1. If either bit of an operand is 0, the result of corresponding bit is evaluated\
    \ to 0.\n\nLet us suppose the bitwise AND operation of two integers 12 and 25.\n\
    \n```\n```\n12 = 00001100 (In Binary)\n25 = 00011001 (In Binary)\nBit Operation\
    \ of 12 and 25\n    00001100\n  & 00011001\n  ----------\n    00001000 = 8 (In\
    \ decimal)\n```\n```\n\n***Example #1: Bitwise AND***\n\n```\n```c\n#include <stdio.h>\n\
    void main()\n{\n    int a = 12, b = 25;\n```\n```"
