  md: "# Example: Logical Operators\n\n```\n```c\n// C Program to demonstrate the\
    \ working of logical operators\n#include <stdio.h>\nvoid main()\n{\n    int a\
    \ = 5, b = 5, c = 10, result;\n    result = (a = b) && (c > b);\n    printf(\"\
    (a = b) && (c > b) equals to %d \\n\", result);\n    result = (a = b) && (c <\
    \ b);\n    printf(\"(a = b) && (c < b) equals to %d \\n\", result);\n    result\
    \ = (a = b) || (c < b);\n    printf(\"(a = b) || (c < b) equals to %d \\n\", result);\n\
    \    result = (a != b) || (c < b);\n    printf(\"(a != b) || (c < b) equals to\
    \ %d \\n\", result);\n    result = !(a != b);\n    printf(\"!(a != b) equals to\
    \ %d \\n\", result);\n    result = !(a == b);\n    printf(\"!(a == b) equals to\
    \ %d \\n\", result);\n    getch();\n}\n```\n```\n\n# Output:\n\n```\n```text\n\
    (a = b) && (c > b) equals to 1\n(a = b) && (c < b) equals to 0\n(a = b) || (c\
    \ < b) equals to 1\n(a != b) || (c < b) equals to 0\n!(a != b) equals to 1\n!(a\
    \ == b) equals to 0\n```\n```\n\n# Explanation of Logical Operator Program\n\n\
    +   - (a = b) && (c > 5) evaluates to 1 because both operands (a = b) and (c >\
    \ b) is 1 (true).\n+   - (a = b) && (c < b) evaluates to 0 because operand (c\
    \ < b) is 0 (false).\n+   - (a = b) || (c < b) evaluates to 1 because (a = b)\
    \ is 1 (true).\n+   - (a != b) || (c < b) evaluates to 0 because both operand\
    \ (a != b) and (c < b) are 0 (false).\n+   - !(a != b) evaluates to 1 because\
    \ operand (a != b) is 0 (false). Hence, !(a != b) is 1 (true).\n+   - !(a == b)\
    \ evaluates to 0 because (a == b) is 1 (true). Hence, !(a == b) is 0 (false)."
