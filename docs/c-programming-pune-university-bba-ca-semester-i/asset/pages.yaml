    \n```\n```c\nchar arr_map[3];\narr_map[0] = 'S';\narr_map[1] = 'R';\narr_map[2]\
    \ = 'D';\n```\n```\n\n# Accessing Single Dimension Array Elements\n\nArrays are\
    \ 0-indexed, so the first array element is at index = 0, and the highest is size_of_array\
    \ -\nTo access an array element at a given index you would use the following syntax:\n\
    \n**Sample Code**\n\n```\n```c\narray_name[index_of_element];\n```\n```\n\nTo\
    \ set an element of an array equal to a value you would write:\n\n**Sample Code**\n\
    \n```\n```c\narray_name[index_of_element] = value;\n```\n```\n\nTo access one\
    \ of the arr_map element:\n\n**Sample Code**\n\n```\n```c\narr_map[0]; //value\
    \ of 'S'\narr_map[1]; //value of 'R'\narr_map[2]; //value of 'D'\n```\n```\n\n\
    140\n\nTrying to access a value outside the bounds of index 1 through size_of_array\
    \ - 1, results in runtime errors. Your compiler will not complain, but your program\
    \ will crash when it executes.\n\nThe following snippet places the data into array\
    \ items of integer type with a capacity of 40 elements\n\n```\n```c\nfor(i=0;i<40;i++)\n\
    {\n    printf(\"Enter the item\");\n    scanf(\"%d\", &items[i]);\n}\n```\n```\n\
    \nThe above for loop asks the user to enter the item 40 times. In the beginning,\
    \ i=0 which causes the scanf statement to initialize the array element items [\
    \ 0 ] (first element of the array). This process continues till i=39 and that\
    \ would initialize the last element of array: items [ 39 ].\n\nNote that the scanf\
    \ function includes an ampersand (&) in front of items[i], since single array\
    \ element is being entered rather than an entire array."
