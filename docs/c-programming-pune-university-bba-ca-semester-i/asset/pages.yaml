  md: "# **Bitwise complement operator ~ :-**\n\nBitwise complement operator is a\
    \ unary operator (works on only one operand). It changes 1 to 0 and 0 to 1. **It\
    \ is denoted by ~.**\n\n```\n    35 = 00100011 (In Binary)\n    Bitwise complement\
    \ Operation of 35\n    ~ 00100011\n    ________\n    11011100 = 220 (In decimal)\n\
    ```\n\nTwist in bitwise complement operator in C Programming\n\nThe bitwise complement\
    \ of 35 (~35) is -36 instead of 220, but why?\n\nFor any integer n, bitwise complement\
    \ of n will be -(n+1). To understand this, you should have the knowledge of 2's\
    \ complement.\n\n# **2's Complement**\n\nTwo's complement is an operation on binary\
    \ numbers. The 2's complement of a number is equal to the complement of that number\
    \ plus 1. For example:\n\n| Decimal | Binary | 2's complement |\n|---|---|---|\n\
    | 0 | 00000000 | -(11111111+1) = -00000000 = -0 (decimal) |\n| 1 | 00000001 |\
    \ -(11111110+1) = -11111111 = -256 (decimal) |\n| 12 | 00001100 | -(11110011+1)\
    \ = -11110100 = -244 (decimal) |\n| 220 | 11011100 | -(00100011+1) = -00100100\
    \ = -36 (decimal) |\n\n*Note:* Overflow is ignored while computing 2's complement.\n\
    \nThe bitwise complement of 35 is 220 (in decimal). The 2's complement of 200\
    \ is -36. Hence, the output is -36 instead of 220.\n\n# **Bitwise complement of\
    \ any number N is -(N+1). Here's how:**\n\n```\n    bitwise complement of N =\
    \ ~N (represented in 2's complement form)\n    2'complement of ~N= -(~(~N)+1)\
    \ = -(N+1)\n```\n\n# **Example #4: Bitwise complement**\n\n```\n    #include <stdio.h>\n\
    \    void main()\n    {\n        printf(\"complement = %d\\n\",~35);\n       \
    \ printf(\"complement = %d\\n\",~12);\n        getch( );\n    }\n```\n\n**Output:**\n\
    \n```\n    complement = -36\n    Output = 11\n```"
