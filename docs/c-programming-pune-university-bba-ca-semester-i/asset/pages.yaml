- pgno: 189
  md: "Let’s take an example\n\n```\n~~~c\nstruct book {\n    char title[20];\n  \
    \  char author[40];\n    int no_of_pages;\n    float cost;\n} cprog, basicprog;\n\
    ~~~\n```\n\nThus cprog and basicprog are structure variables of type book. Because\
    \ the declaration of structure and structure variable is combined, tag can be\
    \ eliminated.\n\nNote the following points while declaring a structure type:\n\
    \n+   - The closing brace in the structure type declaration must be followed by\
    \ a semicolon.\n+   - It is important to understand that a structure type declaration\
    \ does not tell the compiler to reserve any space in memory. It only defines the\
    \ ‘form’ of the structure.\n+   - Usually structure type declaration appears at\
    \ the top of the source code file, before any variables or functions are defined.\
    \ In very large programs they are usually put in a separate header file, and the\
    \ file is included (using the preprocessor directive #include) in whichever program\
    \ the structure type is required\n\n# ## 8.4 Accessing Members\n\nThe members\
    \ of a structure can be accessed and processed separately. It can be accessed\
    \ by writing the following statement\n\n```\n~~~\ninstance variable. member\n\
    ~~~\n```\n\nwhere instance variable refers to the structure type variable and\
    \ member refers to the name of the member. Note that the period (.) that separates\
    \ the variable name from the member name.\n\nConsider the following structure\n\
    \n```\n~~~c\nstruct book\n{\n    char title[20];\n    char author[40];\n    int\
    \ no_of_pages;\n    float cost;\n} cprog;\n~~~\n```\n\nHere the structure instance\
    \ variable is cprog and to access the cprog’s title and author name use the following\
    \ code\n\n```\n~~~\ncprog.title\ncprog.author\n~~~\n```\n\nThe period operator\
    \ has the highest precedence. Hence the operator will take precedence over the\
    \ unary operator as well as the other binary operators. Which means, the expression\
    \ of the form ++variable. member is equivalent to ++(variable. member); i.e.,\
    \ the ++ operator will apply to the structure member, not the entire structure\
    \ variable."
  merge: -1
  img_proc: true
- pgno: 190
  md: "Similarly, the expression and **instance variable.member** is equivalent to\
    \ `& (variable.member);` thus, the expression accesses the address of the structure\
    \ member, not the starting address of the structure variable.\n\n# ## 8.5 Structure\
    \ Operations\n\nIn C, the only operation that can be applied to struct variables\
    \ is assignment. Any other operation is not allowed on struct variables.\n\n#\
    \ ### Structure Assignment\n\nNormally, can structure variables *be treated* similar\
    \ to any regular variables? Especially, when the value of one structure variable\
    \ needs to be assigned to other. Well it is a complicated task. Lets try to understand.\
    \ Consider the following structure definition.\n\n```\n```c\nstruct car\n{\n \
    \       char manufacturer[50];\n        char model[10];\n        int cost;\n};\n\
    ```\n```\n\nIf two variables c1and c2, structure variables of type car, are to\
    \ be assigned to each other then there are three different ways in which it can\
    \ be done\n\n+   1. **Assign the members one by one**\n+   \n+      `c1.manufacturer\
    \ = c2.manufacturer`\n+   \n+      `c1.model = c2.model`\n+   \n+      `c1.cost\
    \ = c2.cost`\n+   \n+   2. **Copy the whole memory contents of c2 to c1**\n+ \
    \  \n+      `memcpy(&c1,&c2,sizeof(c1));`\n+   \n+   3. **Straight assignment\
    \ using ‘=’**\n+   \n+      `c1=c2;`\n\nAs shown above, it would be stupid programming\
    \ if the programmer uses the first approach. So obviously they would prefer using\
    \ the 2nd or the 3rd way of structure assignment. But what is the difference?\
    \ Is there any drawback?\n\nCopying the structure variables using the straight\
    \ assignment ‘=’ technique is probably the best as it’s shorter, easier to read\
    \ and has higher level of abstraction. While the other technique is more compiler\
    \ friendly, it just copies the memory of the size specified. This requires the\
    \ reader to think about the size argument to copy. When doing a straight assignment,\
    \ there is no hesitation about whether or not the size is correct.\n\nThe dangerous\
    \ part of structure assignment is when the structure element is a pointer. Copying\
    \ structures that contain pointers can be a bit dangerous, since by doing so those\
    \ pointers are aliased, typically making it ambiguous who owns the pointer after\
    \ the copying operation. If the structure has char * pointing to a specific string,\
    \ both structures will point to the same string. Changing the contents of one\
    \ of those string fields will change the other as well."
  merge: -1
  img_proc: true
- pgno: 191
  md: "To overcome this, copy the entire contents of the structure and then deep copy\
    \ the string by effectively giving a separate string to each structure.\n\nThing\
    \ to remember while using structure assignment\n\n+   - Recommend using straight\
    \ assignment `=` instead of `memcpy`.\n+   - If structure has pointer or array\
    \ member, please consider the pointer alias problem, it will lead to dangling\
    \ pointer once incorrect use. Better way is to implement structure assignment\
    \ function in C\n\n# ## Array of Structures\n\nStructure is used to store the\
    \ information of one particular object but if we need to store such 100 objects\
    \ then Array of Structure is used.\n\nWhat is meant by array of structures? It\
    \ is an array in which each element is a structure itself. Let’s understand this\
    \ using an example\n\n```\n~~~c\nstruct author\n{\n    char first_name[15];\n\
    \    char last_name[15];\n};\nstruct book\n{\n    char title[20];\n    struct\
    \ author book_author;\n    int no_of_pages;\n    float cost;\n} books[50];\n~~~\n\
    ```\n\nIn this declaration books is a 50 elements array of structure. Each element\
    \ of books is a separate structure to type book. Each structure of type book in\
    \ turn includes an array (title) and another structure (author) as members. This\
    \ shows how an array and a structure is embedded in another structure, which itself\
    \ is an element of an array.\n\nAn alternate way to define an array of structure\
    \ book is shown below\n\n```\n~~~c\nstruct author\n{\n    char first_name[15];\n\
    \    char last_name[15];\n};\nstruct book\n{\n    char title[20];\n    struct\
    \ author book_author;\n    int no_of_pages;\n    float cost;\n};\nstruct book\
    \ books[50];\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: "an array of structure can be initialized just the way as any other array. Consider\
    \ the following declarations\n\n```\n```c\nstruct author\n{\n        char first_name[15];\n\
    \        char last_name[15];\n};\nstruct author author_list[]={ \"Kiran\", \"\
    Gurbani\"};\n```\n```\n\nAs seen in this example, the size of the array of structure\
    \ is not specified. The initial values will define the size of the array and amount\
    \ of memory required to store the array.\n\nThe use of the period operator can\
    \ be extended to arrays of structures, by writing array [expression] .member where\
    \ array refers to the array name, and array [expression] is an individual array\
    \ element (a structure variable). Therefore array [expression]. member will refer\
    \ to a specific member within a particular structure.\n\nFor the above example,\
    \ author_list is an array of structures of type author. To access its second element\
    \ use the expression author_list[1].\n\nLet’s consider the following example\n\
    \n```\n```c\nstruct author\n{\n        char first_name[15];\n        char last_name[15];\n\
    };\nstruct book\n{\n        char title[20];\n        struct author book_author;\n\
    \        int no_of_pages;\n        float cost;\n} books[5];\n```\n```\n\nThe following\
    \ table gives expression showing how the various members and submembers of the\
    \ structure variable can be accessed.\n\n| Expression | Explanation |\n|---|---|\n\
    | `book[1].title` | Access the title member for the second book |\n| `&book[1].title`\
    \ | Access the address of title member within the second book structure |\n| `book[1].title[3]`\
    \ | Access the 3rd character within book’s title |\n| `book[1].book_author.first_name`\
    \ | Access the first name member of structure of type author within the structure\
    \ book |\n| `++book[1].no_of_pages` | Causes the value of no_of_pages to increment\
    \ |"
