  md: "# ## Flowchart of if...else Statement\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_52_0.png)\n\
    \n**Fig. 3.2: Flowchart of if... Else Statement**\n\n# ### Example : C if...else\
    \ statement\n\n```\n~~~c\n// Program to check whether an integer entered by the\
    \ user is odd or even\n#include <stdio.h>\nvoid main()\n{\n    int number;\n \
