  md: "# Identify the 3 parts of the recursive algorithm:\n\nAll recursive algorithm\
    \ must have the following three stages:\n\n+   - Base Case: if ( nargin() == 2\
    \ ) result = a + b;\n+   - \"Work toward base case\": a+b becomes the first parameter\n\
    +     This reduces the number of parameters to the function from 3 to 2, and 2\
    \ is the base case!\n+   - Recursive Call: add_numbers(a+b, c);\n\nIn this algorithm,\
    \ the computer “remembers” every previous state of the problem. This information\
    \ is “held” by the computer on the “activation stack” (i.e., inside of each functions\
    \ workspace). Every function has its own workspace PER CALL of the function.\n\
    \n# A quick example:\n\n```\nvoid count_to_ten ( int count )\n{ /* we only keep\
    \ counting if we have a value less than ten*/\n    if ( count < 10 )\n    {\n\
    \        count_to_ten( count + 1 );\n    }\n}\nint main()\n{\n    count_to_ten(\
    \ 0 );\n}\n```\n\nThis program ends when we’ve counted to ten, or more precisely,\
    \ when count is no longer less than ten. This is a good base case because it means\
    \ that if we have an input greater than ten, we’ll stop immediately. If we’d chosen\
    \ to stop when count equaled ten, then if the function were called with the input\
    \ 11, it would run out of memory before stopping.\n\nLets calculate the factorial\
    \ of a positive integer quantity. This problem can be represented as n! = 1 x\
    \ 2 x 3 x . . . x n, where n is the specified positive integer.\n\nWe can also\
    \ express this problem in another way, by writing n! = n x (n - 1)! This is a\
    \ recursive statement of the problem, in which the desired action (the calculation\
    \ of n!) is expressed in terms of a previous result (the value of (n - 1)!, which\
    \ is assumed to be known.)\n\nAlso, we know that 1! = 1 by definition. This last\
    \ expression provides a stopping condition for the recursion.\n\n# Example\n\n\
    ```\n/* calculate the factorial of an integer quantity using recursion */\n#include<stdio.h>\n\
    long int factorial(int n); /* function prototype */\nvoid main( )\n{\n    int\
    \ n;\n```"
