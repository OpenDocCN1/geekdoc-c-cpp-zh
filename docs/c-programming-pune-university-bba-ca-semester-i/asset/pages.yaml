  md: "Associativity specification is redundant for unary operators and is only shown\
    \ for completeness: unary prefix operators always associate right-to-left (sizeof\
    \ ++*p is sizeof (++(*p))) and unary postfix operators always associate left-to-right\
    \ (a[1][2]++ is ((a[1])[2])++). Note that the associativity is meaningful for\
    \ member access operators, even though they are grouped with unary postfix operators:\
    \ a.b++ is parsed (a.b)++ and not a.(b++).\n\n# ### 1.4.3 Expression\n\nA **statement**\
    \ causes the computer to carry out some action. There are three different classes\
    \ of statements in C. They are expression statements, compound statements and\
    \ control statements.\n\nAn **expression statement** consists of an expression\
    \ followed by a semicolon. The execution of an expression statement causes the\
    \ expression to be evaluated.\n\n```\n```c\na = 23; //Assignment statement\nSum\
    \ = a+b; //calculative assignment statement\n++i; // Incremental statement\n```\n\
    ```\n\nThe first two expression statements are assignment-type statements. Each\
    \ causes the value of the expression on the right of the equal sign to be assigned\
    \ to the variable on the left.\n\nThe third expression statement is an incrementing-type\
    \ statement, which causes the value of i to increase by 1.\n\nA **compound statement**\
    \ consists of several individual statements enclosed within a pair of braces {\
    \ }. Decision statement is also called as compound statement. The individual statements\
    \ may themselves be expression statements, compound statements or control statements.\
    \ Thus, it is the compound statement provides a capability for embedding statements\
    \ within other statements.\n\nA typical compound statement is shown below.\n\n\
    ```\n```c\nIf(c==0)\n{\n        total = 600;\n        Percentage=(marks/total)*100;\n\
    }\n```\n```\n\n**Control statements** are used to create special program features,\
    \ such as logical tests, loops and branches. Many control statements require that\
    \ other statements be embedded within them.\n\n```\n```c\nfor(i=1; i<=10; i++)\n\
    {\n        printf(“%d”,i);\n}\n```\n```\n\n# ## Questions\n\n# ### Winter 2014\n\
    \n+   1. State different types of relational operators in C.\n+   2. What is formal\
