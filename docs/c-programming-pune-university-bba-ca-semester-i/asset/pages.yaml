  md: '# ## 5.1 Introduction to One-dimensional Array


    The array is another kind of variable or user defined variable that is used extensively
    in C. An array is an identifier that refers to a collection of data items that
    all have the same name hence, Array is a collection of similar types of data items
    like collection of all integers, collection of all floats, collection of all characters.


    The individual data items are represented by their corresponding array-elements
    (index).


    Suppose that x is a 10-element array. The first element is referred to as x[0],
    the second as x[1], and so on. The last element will be x[9]


    ![](img/35ea447eca4d04af54f37bf3d3ca337d_107_0.png)


    Each member in the array (i.e., each individual data item) is referred to by specifying
    the array name followed by one or more subscripts (array index), with each subscript
    enclosed in square brackets. Each subscript must be expressed as a non-negative
    integer. In an n-element array, the array elements are:


    x[0], x[1], x[2], ..., x[n - 1]


    as illustrated in the following diagram. The first element of the array is referred
    to using the notation x[0], the second element is referred to using the notation
    x[1] and so on.


    A **declaration** is a statement that provides a data type and an identifier for
    a variable. An **identifier** is a program component’s name.


    # ### 5.1.1 Definition


    An array which has only one subscript is known as **one-dimensional array**.


    ***Example:***


    ```

    int arr[10];

    ```


    When you declare an array, you declare an array that contains multiple similar
    type of data items; each data item is one **element** of the array. Each element
    has the same data type, and each element occupies an area in memory next to, or
    contiguous to, the others. All elements in a array will be stored in a contiguous
    allocation of a memory.


    # ### 5.1.2 Declaration


    An array is declared in a similar manner as a variable, only difference being
    that each array name has to be specified by size. For one-dimensional array, this
    is done by specifying a positive integer expression in square brackets as shown
    below:


    ```

    data-type  array_name[expression]

    ```


    where **data-type** is the data type (int, float, char) of array elements, **array_name**
    is the array name and **expression** is a positive values integer constant that
    identifies the size of array.'
