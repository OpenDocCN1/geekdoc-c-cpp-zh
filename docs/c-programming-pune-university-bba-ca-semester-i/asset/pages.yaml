  md: "# ## Common Mistakes when Working with Pointers\n\nSuppose, you want pointer\
    \ pc to point to the address of c. Then,\n\n```\n```c\nint c, *pc;\n\n// Wrong!\
    \ pc is address whereas, c is not an address.\npc = c;\n\n// Wrong! *pc is the\
    \ value pointed by address whereas, &c is an address.\n*pc = &c;\n\n// Correct!\
    \ pc is an address and, &pc is also an address.\npc = &c;\n\n// Correct! *pc is\
    \ the value pointed by address and, c is also a value.\n*pc = c;\n```\n```\n\n\
    In both cases, pointer pc is not pointing to the address of c.\n\n# ### 7.5 Pointer\
    \ Arithmetic\n\nPointer is a variable that holds the memory location, which is\
    \ a number. This means that arithmetic operations can be performed on pointer.\
    \ The arithmetic operations that can be performed on pointer is ++ (increment),\
    \ – (decrement),+ (addition) and - (subtraction). Thus, an integer value can be\
    \ added to or subtracted from a pointer variable, though the resulting expression\
    \ must be interpreted very carefully. Suppose, for example, that ptr_x is a pointer\
    \ variable that represents the address of some variable x. We can write expressions\
    \ such as ++ptr_x, - - ptr_x, (ptr_x + 3 ) , (ptr_x + i),and (ptr_x - i),where\
    \ i is an integer variable. Each expression will represent an address that is\
    \ located some distance from the original address represented by ptr_x.\n\n# ###\
    \ Increment/Decrement\n\nConsider an integer pointer variable ptr_x which points\
    \ to the address 1450. Lets increment the variable (integer data size is 16 bit\
    \ i.e. 2 bytes)\n\n```\n```c\nptr_x++;\n```\n```\n\nNow the pointer variable ptr_x\
    \ will point to the location 1452 because each time ptr_x will be incremented,\
    \ it will point to the next integer location which is 2 bytes next to the current\
    \ location. If ptr_x points to a character whose address is 1000, then the above\
    \ operation will point to the location 1001 because the next character will be\
    \ available at 1001.\n\n# ### Example\n\n```\n```c\nvoid main()\n{\n    int x\
    \ = 45;\n    int *ptr_x;\n    ptr_x = &x;\n    printf(\"\\nOriginal values: x\
    \ = %d  ptr_x = %d\", x, ptr_x);\n    ptr_x++;\n    printf(\"\\nValues after incrementing\
    \ ; x = %d  ptr_x = %d\", x, ptr_x);\n}\n```\n```"
