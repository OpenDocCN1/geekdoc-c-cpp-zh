    \ task, a fixed number of times.\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_59_0.png)\n\
    \n**Syntax of while loop:**\n\n```\n```c\nwhile( test expression)\n{\n// C- statements,\
    \ which requires repetition.\n// Increment (++) or Decrement (--) Operation.\n\
    }\n```\n```\n\nThe while loop evaluates the test expression.\n\nIf the test expression\
    \ is true (nonzero), codes inside the body of while loop is evaluated. The test\
    \ expression is evaluated again. The process goes on until the test expression\
    \ is false.\n\nWhen the test expression is false, the while loop is terminated"
