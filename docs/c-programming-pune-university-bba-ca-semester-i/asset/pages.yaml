- pgno: 46
  md: "# ## 2.2.2 Formatted Output\n\nIn C programming, printf() is one of the main\
    \ output function. The function sends formatted output to the screen.\n\n*Example:*\n\
    \n```\n```c\n#include <stdio.h>\nint main()\n{\n    int x = 5;\n    printf(\"\
    Number = %d\", x);\n    return 0;\n}\n```\n```\n\n# ## Output\n\nNumber = 5\n\n\
    We use %d conversion specifier to print int types. Here, the %d inside the quotations\
    \ will be replaced by the value of x.\n\n# ## Conversion Specifiers\n\nA conversion\
    \ specifier is a symbol that is used as a placeholder in a formatting string.\
    \ For integer output (for example), %d is the specifier that holds the place for\
    \ integers.\n\nHere are some commonly used conversion specifiers (not a comprehensive\
    \ list):\n\n+   - %d int (signed decimal integer)\n+   - %u unsigned decimal integer\n\
    +   - %f floating point values (fixed notation) - float, double\n+   - %e floating\
    \ point values (exponential notation)\n+   - %s string\n+   - %c character\n\n\
    # ## Printing Integers\n\nTo output an integer, use %d in the format string, and\
    \ an integer expression in the list_of_expressions.\n\n```\n```c\nint numStudents\
    \ = 35123;\nprintf(\"ATSS has %d students\", numStudents);\n```\n```\n\n# ## Output:\n\
    \nATSS has 35123 students\n\nWe can specify the field width (i.e. how many ‘spaces’\
    \ the item prints in). Defaults to right-justification. Place a number between\
    \ the % and the d. In this example, field width is 10:\n\n```\n```c\nprintf(\"\
    ATSS has %10d students\", numStudents);\n```\n```"
