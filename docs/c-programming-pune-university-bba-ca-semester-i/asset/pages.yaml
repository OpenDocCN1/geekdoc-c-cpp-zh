    \ 55 56 74 81 45\nTotal: 311\nPercentage: 62.20000\n```\n```\n\n# ## 8.6 Nested\
    \ Structure (Structures within Structures)\n\nNested structure in C is nothing\
    \ but structure within structure. One structure can be declared inside other structure\
    \ as we declare structure members inside a structure.\n\nAs the complexity of\
    \ real world data items increases, it may happen that a structure variable would\
    \ be defined as a member of another structure. In such situations, the declaration\
    \ of the embedded structure must appear before the declaration of the outer structure.\
    \ This is also called nested structure.\n\nLet’s consider an example\n\n```\n\
    ```c\nstruct author{\n    char first_name[15];\n    char last_name[15];\n};\n\
    struct book {\n    char title[20];\n    struct author book_author;\n    int no_of_pages;\n\
    \    float cost;\n} cprog, basicprog;\n```\n```"
