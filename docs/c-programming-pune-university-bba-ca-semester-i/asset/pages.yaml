    \ loop condition. It keeps happening until the condition returns to false.\n\n\
    # ### 3.3.2 Do-while Loop\n\nA do while loop is another type of repetition statement.\
    \ It is exactly the same as the while loop, except it does something and then\
    \ evaluates the logical expression of the loop to determine what happens next.\
    \ Normally with a while loop, a part of the logical expression in the loop must\
    \ be initialized before execution of the while loop.\n\nA do while loop statements\
    \ will be performed and then checks the test expression of the loop.\n\n```\n\
    do\n{\n        // codes or statements\n} while (testExpression);\n```\n\nThe code\
    \ block (loop body) inside the braces is executed once.\n\nThen, the test expression\
    \ is evaluated. If the test expression is true, the loop body is executed again.\
    \ This process goes on until the test expression is evaluated to 0 (false).\n\n\
    When the test expression is false (nonzero), the **do...while** loop is terminated.\n\
    \nThe statement in the loop may be single or complex. Complex statements must\
    \ be enclosed with curly braces { }. Let’s look at a couple of examples of do\
    \ while loops.\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_61_0.png)\n\n**Fig.\
    \ 3.4: Flowchart of do... While Loop**\n\n# **Example: Program to print first\
    \ ten multiple of 5.**\n\n```\n#include<stdio.h>\n#include<conio.h>\nvoid main()\n\
    {\n    inta,i;\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "```\n```c\na=5;\ni=1;\ndo\n{\n    printf(\"%d\\t\",a*i);\n    i++;\n}\nwhile\
    \ (i <= 10);\ngetch();\n}\n```\n```\n\n**Output:**\n\n5 10 15 20 25 30 35 40 45\
    \ 50\n\n# 3.3.3 For Loop\n\nA for loop is another way to perform something that\
    \ needs to be repeated in C++ (repetition). Most programmers like to use for loops\
    \ because the code can be written in a more compact manner compared to the same\
    \ loop written with a while or do while loop.\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_62_0.png)\n\
    \nA for loop is generally used when you know exactly how many times a section\
    \ of code needs to be repeated.\n\nThe general form of a for loop is as follows:\n\
    \n```\n```c\nfor    (expression1; expression2; expression3)\n    stmt(s);\n```\n\
    ```\n\nwhere  stmt(s) is a single or compound statement.\n\nThis is one of the\
    \ most frequently used loops in C programming.\n\n**The syntax of for loop looks\
    \ like this –**\n\n```\n```c\nfor (initialization; condition test; control flow)\n\
    {\n    //Code – C statements needs to be repeated\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: "The control flow can be increment or decrement value of variable depending\
    \ on requirements.\n\nExpression1 is used to initialize the loop; expression2\
    \ is used to determine whether or not the loop will continue; expression3 is evaluated\
    \ at the end of each iteration or cycle.\n\n**NOTE 1:** Expression2 is tested\
    \ before the stmt and expression3 is executed; it is possible that the body of\
    \ the loop is never executed or tested.\n\n**NOTE 2:** Any or all of the 3 expressions\
    \ in a for loop can be omitted, but the 2 semi-colons must remain. Like **for(\
    \ ; ; )**\n\nIf expression1 is omitted, there is no initialization done in the\
    \ loop, but you might not need any initialization for your program.\n\nLike :\n\
    \n```\n```c\ni=1;\nfor ( ; i<=10;i++)\n```\n```\n\nIf expression2 is omitted,\
    \ there is no test section so you will essentially have an infinite loop.\n\n\
    ```\n```c\nfor(i=1; ; i++)\n```\n```\n\nIf expression3 is omitted, there is no\
    \ update as part of the for statement, but the update could be done as part of\
    \ the statement in the body of the loop.\n\n```\n```c\nfor(i=1;i<=10; )\n{\n \
    \   printf(\"%d\",i);\n    i++;\n}\n```\n```\n\nThe **for** loop is commonly used\
    \ when the number of iterations is known.\n\nIn general, a for loop can be written\
    \ as an equivalent to a while loop and *vice versa*.\n\n```\n```c\nfor (expression1;\
    \ expression2; expression3)\n    statement;\n```\n```\n\n**is equivalent to...**\n\
    \n```\n```c\nexpression1;\nwhile (expression2)\n{\n    Statements;\n    expression3;\n\
    }\n```\n```"
  merge: -1
  img_proc: true
