  md: "# 3.4.1 break\n\nThe break statement terminates the loop (for, while and do...while\
    \ loop) immediately when it is encountered. The break statement is used with decision\
    \ making statement such as if...else.\n\nBreak statements are useful when you\
    \ want your program-flow to come out of the switch body. Whenever a break statement\
    \ is encountered in the switch body, the execution flow would directly come out\
    \ of the switch.\n\n# Syntax of Break Statement\n\n```\nbreak;\n```\n\n# Flowchart\
    \ of Break Statement\n\n![](img/35ea447eca4d04af54f37bf3d3ca337d_67_0.png)\n\n\
    Working of break statement:\n\n```\nwhile (test Expression)\n{\n        // codes\n\
    \        If (condition for break)\n        {\n                break;\n       \
    \ }\n        // codes\n}\n```"
  merge: -1
