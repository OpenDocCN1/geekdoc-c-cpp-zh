  md: '# 4. Assignment and Compound Assignment Operators


    # Assignment Operator


    Assignment operators are used to assign the result of an expression or constant
    to variable.


    The assignment operators can be used within any valid expression, the usual assignment
    operator is “=” .


    ```

    variable_Name = constant or expression;

    ```


    The arithmetic expression is a combination of variables, constants and operators


    ```

    **E.g.,**


    x = a + b;


    z = 0;


    final = 100;

    ```


    During the assignment operator the value of expression of right hand side is assigned
    to left side variable.


    During the assignment operator the value of the expression on right hand side
    is computed and is assigned to the variable on the left hand side.


    # Compound Assignment OR Short Hand Assignment Operators:


    The **compound assignment operators** enable you to abbreviate assignment statements.
    For example, the statement


    ```

    value = value + 3

    ```


    which mentions the variable value on **both** sides of the assignment, can be
    abbreviated with the **addition assignment operator**, += as


    ```

    value += 3

    ```


    The += operator adds the value of the right operand to the value of the left operand
    and stores the result in the left operand''s variable.


    In addition to the usual assignment operator ‘=’, C++ has short hand assignment
    operators of the form.


    ```

    variable op = expression;

    ```


    where op is C language is binary arithmetic operator


    | Compound assignment operator | Sample expression | Explanation | Assigns |

    |---|---|---|---|

    | **Assume: c = 4, d = "He"** |  |  |  |

    | += | c += 7 | c = c + 7 | 11 to c |

    | -= | c -= 3 | c = c - 3 | 1 to c |

    | *= | c *= 4 | c = c * 4 | 16 to c |

    | /= | c /= 2 | c = c / 2 | 2 to c |

    | \\= | c \\= 3 | c = c \\ 3 | 1 to c |

    | ^= | c ^= 2 | c = c ^ 2 | 16 to c |

    | &= | d &= "llo" | d = “kiran” & "llo" | "Hello" to kiran |


    **Fig 1.1: Compound Assignment Operators**'
