- pgno: 65
  md: "Step 2: Then variable has been tested for a given condition, if the condition\
    \ results in true then C statements enclosed in loop body get executed by compiler,\
    \ otherwise control skips the loop and continues with the next statements following\
    \ loop.\n\nStep 3: After successful execution of loop's body, the counter variable\
    \ is incremented or decremented, depending on the operation (++ or --).\n\n# Various\
    \ Forms of for LOOP\n\nHere we use variable num in all the below examples:\n\n\
    +   1. Here instead of num++, We can use num=num+1, which is the same as num++.\n\
    +   \n+   ```c\n+   for(num=10;num<20;num=num+1)\n+   ```\n\n+   2. Initialization\
    \ part can be skipped from loop as shown below, the counter variable is declared\
    \ before the loop itself.\n+   \n+   ```c\n+   int num=10;\n+   for(;num<20;num++)\n\
    +   ```\n+   \n+   Must Note: Although we can skip init part but semicolon (;)\
    \ before condition is must, without which you will get compilation error.\n\n\
    +   3. Like initialization, you can also skip the increment part as we did below.\
    \ In this case semicolon (;) is must, after condition logic. The increment part\
    \ is being done in for loop body itself.\n+   \n+   ```c\n+   for(num=10;num<20;)\n\
    +   {\n+       //Code\n+       num++;\n+   }\n+   ```\n\n+   4. Below case is\
    \ also possible, increment in body and in it during declaration of counter variable.\n\
    +   \n+   ```c\n+   int num=10;\n+   for(;num<20;)\n+   {\n+   //Statements\n\
    +   num++;\n+   }\n+   ```\n\n+   5. Counter can be decremented also. In the below\
    \ example the variable gets decremented each time the loop runs until the condition\
    \ num>10 becomes false.\n+   \n+   ```c\n+   for(num=20;num>10;num--)\n+   ```\n\
    \n# 3.3.4 Nested for Loop\n\nNested loops or nesting of loop is placing one loop\
    \ into another loop to execute a program based on multiple conditions and checks.\n\
    \nHere we have an example of nesting of for loop, likewise you can use nesting\
    \ of various loops such as while, while do or for."
  merge: -1
