    \ the structure\n\n```\n```c\nstruct tag\n{\n    data-type var1;\n    data-type\
    \ arr[size];\n    ...\n    data-type varN;\n};\n```\n```\n\nHere, struct is a\
    \ keyword, tag is the name that identifies the structure of this type, and var1,\
    \ arr[size], ... varN are the individual member declaration. arr[size] is an array\
    \ of element whose size is identified by size\n\n```\n```c\n//structure variable\
    \ declaration\nstruct tag object;\n```\n```\n\nThis would define a structure variable\
    \ object of type tag.\n\n# ### Example\n\n```\n```c\n//structure declaration\n\
    struct month\n{\n    int num_of_days;\n    char name[4];\n};\nvoid main()\n{\n\
    \    struct month this_month = { 31, \"Jan\" };\n    printf(\"The month is %s\\\
    n\", this_month.name );\n}\n```\n```"
