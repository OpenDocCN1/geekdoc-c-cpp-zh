    ```\n\n# ## 5.6 Two-dimensional Arrays\n\n# ### 5.6.1 Definition\n\nThe two-dimensional\
    \ array can be defined as an array of arrays. The 2D array is organized as matrices\
    \ which can be represented as the collection of rows and columns. However, 2D\
    \ arrays are created to implement a relational database look like a data structure.\
    \ It provides ease of holding the bulk of data at once which can be passed to\
    \ any number of functions wherever required.\n\n# ### 5.6.2 Declaring Array Variables\n\
    \nThe simplest form of multidimensional array is the two-dimensional array. A\
    \ two-dimensional array is, in essence, a list of one-dimensional arrays. To declare\
    \ a two-dimensional integer array of size [x][y], you would write something as\
    \ follows\n\n```\n    data-type array_name[expression][expression];\n```\n\nwhere\
    \ data-type can be any valid C data type and array_name will be a valid C identifier.\
    \ A two-dimensional array can be considered as a table which will have x number\
    \ of rows and y number of columns. A two-dimensional array a, which contains three\
    \ rows and four columns can be shown as follows:\n\n| | Column 0 | Column 1 |\
    \ Column2 |\n|---|---|---|---|\n| Row 1 | a[0][0] | a[0][1] | a[0][2] |\n| Row\
    \ 2 | a[1][0] | a[1][1] | a[1][2] |\n| Row 3 | a[2][0] | a[2][1] | a[2][2] |\n\
    \n**Fig. 5.2: Two-dimensional Array**\n\nThus, every element in the array a is\
    \ identified by an element name of the form a[ i ][ j ], where 'a' is the name\
    \ of the array, and 'i' and 'j' are the subscripts that uniquely identify each\
    \ element in 'a'."
