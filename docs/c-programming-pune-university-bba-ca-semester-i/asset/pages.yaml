- pgno: 14
  md: "# 1.3.3 Variables and Data Types\n\n# Variables\n\nVariable is a place holder\
    \ which occupies memory space to store variable value, or a constant value, integer,\
    \ float, character, string value.\n\nIn C, all variables must be declared before\
    \ they are used in executable statements.\n\nIn C language all variables are to\
    \ be declared first in local declaration section, i.e., at the beginning of scope.\n\
    \n```\n```c\nint score = 95;\n```\n```\n\nHere, Score is a variable of integer\
    \ type. The variable is holding 95 in the above code.\n\nThe value of a variable\
    \ can be changed, hence, the name 'variable'.\n\n# Data Types\n\nC supports several\
    \ different types of data, each of which may be represented differently within\
    \ the computer’s memory.\n\n+   - C data types are defined as the data storage\
    \ format that a variable can store a data to perform a specific operation.\n+\
    \   - Data types are used to define a variable before to use in a program.\n+\
    \   - Size of variable, constant and array are determined by data types.\n\n#\
    \ Built-in-type\n\n+   1. **Integer type:** The data types in this type are int\
    \ and char. The modifiers signed, unsigned, long and short may be applied to character\
    \ and integer basic data type.\n+   \n+      The size of int is 2 bytes and the\
    \ size of char is 1 byte.\n+   \n+      **Example: int a=10;**\n+   \n+   2. **Floating\
    \ Type:** The data type in this can be float or double. The size of the float\
    \ is 4 bytes and size of double is 8 bytes. It is used to store the numbers with\
    \ decimal. The modifier long can be applied to double and the size of long double\
    \ is 10 bytes.\n+   \n+      **Example: float per=95.3;**\n+   \n+      - float\
    \ data type supports single precision numbers.\n+      - double data type supports\
    \ double precision numbers and having size greater than float.\n+      - long\
    \ double can store double precision numbers and having size greater than double.\n\
    +   \n+   3. **char** – characters stored like type char, It stores single character,\
    \ Sixe is 1 byte.\n+   \n+   4. **void:** void is used for:\n+      - To specify\
    \ the return type of a function when it is not returning any value.\n+      -\
    \ To indicate an empty argument list to a function"
  merge: -1
  img_proc: true
