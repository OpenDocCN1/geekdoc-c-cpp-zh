    ## Correlation Analysis


    Another simple but powerful way to examine the relationship between revenue and
    the continuous demographic variables (AGE and HOUSEHOLD_INCOME) is correlation
    analysis. This technique enables you to look at CUSTOMER_REVENUE as a continuous
    variable.


    With the cursor on the data set, click **Tasks ▶ Multivariate ▶ Correlations**.
    In the window that will open, drag AGE, HOUSEHOLD_INCOME, and YEARS_AS_CUSTOMER
