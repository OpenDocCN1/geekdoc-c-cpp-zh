    \n描述性分析由表格、图表和图形组成，它们揭示数据模式、趋势和关系，可为你的策略、决策和行动提供信息。回归、决策树和神经网络等预测性分析工具，使你能够对广泛的营销、风险和流程决策进行优先级排序和优化。\n\
    \n你将看到每种分析类型的示例，以及用于确定何时使用描述性分析、何时使用预测性分析的指南。本章的目标是帮助你通过解读描述性分析和预测性分析并采取适当的业务行动，发现提升竞争优势的机会。\n\
