    因为聚类对异常值敏感，如果您运行变量通过过滤过程，您将获得更好的结果。在图表上方，点击样本选项卡并转到第四个图标，**过滤**。将其拖到图表上并用箭头连接（图
    7.12）。


    图 7.12：过滤数据


    ![](img/976d9b992e82c4ac7d195d03a30b4915_115_0.png)


    右键单击过滤节点并选择 **运行**。


    为了寻找潜在的异常值，突出显示过滤图标，转到左下菜单，并点击 **区间变量** 右侧的三个点（图 7.13）。


    图 7.13：定位过滤菜单


    | 属性 | 值 |

    |---|---|

    | **通用** | |

    | 节点 ID | Filter |

    | 导入数据 | |

    | 导出数据 | |

    | 注释 | |

    | **训练** | |

    | 导出表 | Filtered |

    | 过滤表 | Training Data |

    | 分布数据集 | Yes |

    | **类别变量** | |

    | 类别变量 | |

    | 默认过滤方法 | Rare Values (Percentage) |

    | 保留缺失值 | Yes |

    | 归一化值 | Yes |

    | 最小频率截止 | 1 |

    | 百分比最小截止 | 0.01 |

    | 最大级别数 | 25 |

    | **区间变量** | |

    | 区间变量 | |

    | 默认过滤方法 | Standard Deviations from ... |

    | 保留缺失值 | Yes |


    此下拉选项打开一个窗口，允许您查看每个分布（图 7.14）。对于 HH_INCOME_LOG，将 **过滤下限** 设置为 8 并点击 **应用过滤**。


    **图 7.14：指定过滤变量**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_116_0.png)


    点击 **确定**。然后右键单击 **过滤** 图标并选择 **运行**。完成后，点击 **确定**。


    ## 构建聚类


    在图表窗口上方，转到 **探索** 选项卡并选择第二个图标，**聚类**。将 **聚类** 图标拖到图表上并与 **过滤** 节点连接（图 7.15）。


    **图 7.15：添加聚类过程**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_116_1.png)


    当您突出显示 **聚类** 图标时，属性菜单出现在左下方（图 7.16）。


    图 7.16：查看添加聚类过程的属性菜单


    ![](img/976d9b992e82c4ac7d195d03a30b4915_117_0.png)


    连续变量具有不同的尺度，例如计数、分钟和美元。您希望对这些变量进行标准化以进行聚类。否则，具有较高尺度的变量将具有优势。在训练下，将内部标准化更改为范围。此选项将每个变量的值标准化为
    0 到 1 之间的值。对于聚类方法，选择质心。此方法通常比 Ward 方法更适合处理对比数据。将种子初始化方法更改为完全替换以选择分离良好的种子。右键单击，然后点击运行。运行完成后，点击结果。


    输出 7.2 显示结果窗口四个象限中的左上和左下象限。每个象限根据定义提供对过程结果的见解：


    - *分段图*——左上象限显示具有最高重要性的聚类变量的分段图。结果显示年龄、对数和性别的值如何在簇之间分布。要查看分段的值和其他统计信息，请将光标放在每个分段内的颜色上。

