  mdcn: "\n在损失高达数百万美元的情况下，能够避免潜在不良贷款，对贷款机构的利润大有裨益。\n\n风险模型的一种常见策略是根据概率范围分配规则。例如，你可以自动批准平均违约概率低于指定值的任何申请。如果你查看决策树模型的**后验概率均值**，你可能会说，任何违约概率低于\
    \ 3% 的贷款申请人都自动批准。任何违约概率高于 4% 的贷款申请人都自动拒绝，而违约概率在 3% 到 4% 之间的申请人则需要进一步调查。\n\n事实证明，预测模型的好处可以为公司节省或赚取数百万美元。有关应用模型的更多信息，请参见*数据挖掘实战手册*（Parr-Rudd\
    \ 2001）。有关常见建模问题与错误的信息，请参见*识别并克服常见的数据挖掘错误*（Wielenga 2007）。\n\n> **注意：** 如果你负责构建风险模型，SAS\
    \ Enterprise Miner 提供了一项高级功能，可用于构建评分卡。有关更多信息，请咨询你的 SAS 代表。\n\n## 来自实践的经验\n\n通过掌握本章中的技术，你已拥有强大的技能组合，可用于为客户和消费者提供战略性和战术性业务分析。能力越大，责任越大。请记住，你的客户可能不理解你如何得到结果，甚至不知道结果是否准确。因此，你必须进行尽职调查。如果你在团队中，也许可以与另一位分析师复核结果。或者，与在分析主题领域拥有深厚业务知识的人一起复核结果。\n\
    \n在展示分析结果时，始终要将你的发现与业务目标联系起来。用清晰的业务语言向利益相关者解释他们如何采取行动或从结果中获得洞察。避免使用*卡方*和对数似然等统计术语。他们会理解提升度，尤其是如果你能将其与增加节省或减少损失联系起来。\n\
    \n现在，你可以认为你的法拉利已经配置齐全；它的引擎盖下有充足动力，并且具备许多功能，使你能够穿越复杂地形并到达目的地。你可能不了解发动机或变速箱如何工作。你可能对悬架或电气系统一无所知。但是，你有仪表可以提醒你的进展，并在需要调整时发出警告。最重要的是，你有理由享受这段旅程。\n\
