    be a person''s name.

    - **Physical address** is typically broken into components such as number, street,
    suite or apartment number, city, state, postal code, and country. Business addresses
    are more stable than addresses for individuals, especially companies with many
    employees.

    - **Phone number** is the main number for the organization and typically includes
    area code and country code. If the data is at a contact level, the phone number
    may include area code, country code, and, if applicable, extension.

    - **Company URL or web address** can also serve as a unique identifier.

    - **Firmographic data** resembles demographic data but is at the company level.
    It includes industry, number of employees, age of company, annual sales, growth
    rate, standard industrial classification codes, and the like.

    - **Product or service IDs** typically consist of a list of identification numbers
    that vary by company. Product or service IDs may reside in a separate database
    that is linked by the company ID.

    - **Model scores** such as response, risk, retention, profitability scores, or
    any other scores may be purchased or developed in-house. These scores may reside
    in a separate database that is linked by the company ID.


    ## Contact Database


    The contact database contains data about the employees of companies found in the
    company database, as follows:


    - **Contact ID** is a unique numeric or alphanumeric code that identifies the
    contact throughout his or her entire life cycle.

    - **Contact name** is the name of a customer or prospect. It is usually broken
    down into multiple fields: last name, first name, middle name or initial, and
    salutation.


    The following typify what might be found in one or more score databases:


    - *Customer ID* or *contact ID* is a unique numeric or alphanumeric code that
    identifies the customer throughout his or her entire life cycle. Some companies
    may use an account number for this function.

    - *Probability to buy* is a score that represents the likelihood of a customer
    to purchase a particular product or service. This score can be for a new purchase
    or an additional purchase from the same company. It may cover a range of products
    and services.

    - *Expected value* is the amount, in dollars or numbers, that the customer or
    company is expected to purchase or borrow, if response occurs.

    - *Probability to default* is the likelihood that a customer will not pay the
    amount owed.

    - *Expected loss given default* is the amount that a customer or company is expected
    to have as a balance when default on the loan occurs.


    ## Marketing Database


    The marketing database contains details about offers made to both prospects and
    customers. The most useful format is a unique record for each campaign to each
    customer or prospect.


    A marketing database would contain all cross-sell, up-sell, and retention offers.
    A prospect marketing database would contain all acquisition offers, as well as
    any predictive information from outside sources.


    Variables created from this type of database are often the most predictive for
    targeting models. It seems logical that if you know that someone has received
    your offer every month for six months, then he or she is less likely to respond
    than someone who is seeing your offer for the first time. As competition intensifies,
    this kind of information is becoming increasingly important.


    With an average amount of solicitation, this kind of database can become huge.
    Consequently, you should perform analyses to establish business rules that control
    the maintenance of this database. Fields like *date of first offer* are usually
    correlated with response behavior. Following are key elements in a marketing database:


    - *Prospect ID* or *customer ID* is a unique numeric or alphanumeric code that
    identifies the prospect for a specific length of time.

    - *Offer detail* includes the date, type of offer, marketing copy, source code,
    pricing, distribution channel (mail, telemarketing, sales representative, email),
    and any other details of the offer.

    - *Date* can be date of first offer (for each offer type) or other offer dates
    (unique to product or service).


    ## Storage of Data


    ### Data Warehouse


    *A data warehouse* is a structure that links information from two or more databases.
    As shown in Figure 2.1, the data warehouse brings the data into a central repository,
    performs some data integration, cleanup, and summarization, and distributes the
    information into data marts. Data marts are used to house subsets of the data
    from the central repository. The data in data marts is selected and prepared for
    specific end users.


    **Figure 2.1: Data Warehouse**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_38_0.png)


    ### Hadoop


    Apache™ Hadoop is revolutionizing the leveraging of big data. Hadoop is a data
    platform that operates by dispersing data storage and processing over a large
    group of servers. Hadoop can quickly scale data processing from a single machine
    to several thousand machines.


    Traditional models of data storage are expensive, especially for large data sets.
    Hadoop is built at a much lower cost and uses commodity hardware. By operating
    at the petabyte scale, Hadoop can reduce costs tremendously. This savings will
    continue to increase as the cost of hardware continues to decrease.


    Companies use web data to understand customer behavior and improve marketing.
    But the immense volume of web data can be prohibitive to capture and store. Hadoop
    allows companies to capture and store web data at a much lower costs. It also
    allows companies to hold onto historical data for a longer period of time.


    Hadoop also offers the ability to analyze large volumes of data. Because of the
    distributed servers, Hadoop can process large volumes of data in parallel.


    The ability to perform advanced analytics is a key feature of Hadoop. Hadoop also
    has the capacity to support several higher-level business intelligence tools.


    ## External Sources


    The pressure is on many companies to increase profits either by acquiring new
    customers, or by increasing sales to existing customers. You can enhance both
    of these initiatives with the use of external sources.


    External sources consist mainly of list sellers and compilers. Few companies that
    sell lists, however, have these sales as their sole business. Many companies have
    a main business, like magazine sales or catalog sales, with list sales as a secondary
    business. Depending on the type of business, they usually collect and sell names,
    addresses, email messages, and phone numbers, together with demographic, behavioral,
    and psychographic information. Sometimes they perform list “hygiene,” or cleanup,
    to improve the value of the list. Many of them sell their lists through list compilers
    or list brokers.


    List compilers are companies that sell a variety of single and compiled lists.
    Some companies begin with a base like the phone book or driver’s license registration
    data. Then they purchase lists, merge them, and impute missing values. Many list
    compilers use survey research to enhance and validate their lists.


    Many companies sell lists of names with contact information and personal characteristics.
    Some specialize in specific kinds of data. The credit bureaus are well known for
    selling credit behavior data. They serve financial institutions by gathering and
    sharing credit behavior data among their members. Hundreds of companies sell these
    lists, ranging from very specific to nationwide coverage.


    > **TIP:** Commonly, prospect data is purchased repeatedly from the same source.
    The goal is to purchase new names or to get fresh information about existing names.
    In either case, you should arrange with the data seller to assign a unique identifier
    to each prospect that is housed on the seller’s database. Then, when additional
    names are purchased or current names are refreshed, the match rate will be much
    higher than it otherwise would be.

    >

    > **NOTE:** For privacy reasons, social media data is mainly collected and used
    with each social media site. Some social media activities can be purchased.

