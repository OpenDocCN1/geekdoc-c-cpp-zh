    \ your early findings from the descriptive analysis with stakeholders who may\
    \ have additional business insights or suggestions.\n\n## Chapter 4: Data Construction\
    \ for Analysis\n\n- Introduction ...........................................................\
    \ 53\n- Data for Descriptive Analysis ...............................................\
    \ 53\n- Data for Predictive Analysis ...............................................\
    \ 54\n  - Prospect Models .......................................................\
    \ 55\n  - Customer Models .......................................................\
    \ 57\n  - Risk Models ..........................................................\
    \ 59\n- External Sources of Data ..................................................\
    \ 61\n- Notes from the Field .....................................................\
    \ 61\n\n### Introduction\n\nSelecting the best data for analysis requires a thorough\
    \ understanding of your business objective and your market. The data serves as\
    \ the foundation for all of your analysis. In this case, the old adage is true:\
    \ \"Garbage in, garbage out!\"\n\nFinding the right data for analysis typically\
    \ begins with your own data. Depending on your goal, you may have all the data\
    \ you need in your own databases. However, in certain situations, you may need\
    \ to purchase data from outside data sources to enhance your analysis. Either\
    \ of these scenarios requires a culture of big data—a culture that supports collaboration\
    \ and data sharing between silos and across systems. This culture of big data\
    \ requires a strategic approach to data acquisition, storage, management, and\
    \ access.\n\nIn this chapter, we will look at some typical sources for descriptive\
    \ and predictive analysis. These examples give you a basic framework from which\
    \ to develop your own analysis data sets.\n\n### Data for Descriptive Analysis\n\
    \nAs we saw in Chapter 3, descriptive analysis helps you understand the underlying\
    \ characteristics and patterns in your data. Your data can come from any source.\
    \ Descriptive analysis can analyze a\n\nIt’s important to note that data from\
    \ a prior campaign for the same product and to the same group is the best option\
    \ for data in any targeting model. It allows for the most accurate prediction\
    \ of future behavior. The only factors that can’t be captured in this scenario\
    \ are seasonality, changes in the marketplace, and the effects of multiple offers.\n\
    \nIf data from a prior campaign is not available, the next best option is to build\
    \ a *propensity model*. To do so, use a data source from which you can develop\
    \ a model that targets a product or service similar to your primary targeting\
    \ goal.\n\nIncreasingly, companies are forming affinity relationships with other\
    \ companies to pool resources and increase profits. For example, credit card banks\
    \ are forming partnerships with airlines, universities, clubs, retailers, and\
    \ energy companies. Telecommunications companies are forming alliances with airlines,\
    \ insurance companies, and others. One of the primary benefits of such arrangements\
    \ is shared access to personal information that can be used to develop targeting\
    \ models.\n\nThe following scenarios highlight some common ways that modeling\
    \ data sets are created.\n\n### Case 1: Same Product to the Same List, Using a\
    \ Prior Campaign\n\nIn January, ABC Credit Card Bank purchased 100,000 randomly\
    \ selected names from Experian Credit Bureau for an acquisition campaign with\
    \ the goal of developing a model. Together with the names, ABC purchased more\
    \ than 300 demographic and credit attributes. ABC then mailed a credit card offer\
    \ with an annualized annual percentage rate (APR) of 11.9% and no annual fee.\
    \ ABC received approximately 1,000 responses from the campaign over the next 12\
    \ weeks. The responses were matched back to the original mail file to create a\
    \ modeling data set.\n\nIn May, ABC Credit Card Bank built a response model, using\
    \ the 300 variables that were purchased at the time of the original offer. After\
    \ the model was constructed and validated, ABC used the model algorithm to score\
    \ (assign a probability estimating their likelihood to respond) the May customer\
    \ file at Experian Credit Bureau. In early June, it sent the same offer to the\
    \ 30% of customers with the highest predicted response rate based on the model.\
    \ To validate that the model performed as expected, it also mailed a random sample\
    \ of the lower-scoring names.\n\n### Case 2: Same Product to a New List, Using\
    \ a Prior Campaign\n\nNext, ABC Credit Card Bank wants to develop a response model\
    \ for its standard 11.9% APR “No Annual Fee” offer, a model that will be optimal\
    \ for scoring names at the Equifax Credit Bureau. All of the other terms and conditions\
    \ are the same as the prior campaign that used Experian data. Rather than start\
    \ with a random sample, ABC’s most cost-effective option for getting data for\
    \ model development is to use the model that was developed for the Experian Credit\
    \ Bureau. ABC plans to use the Experian model to score the Equifax data. It will\
    \ mail to the highest-scoring 40% of names selected by the model. To ensure a\
    \ data set for developing a robust response model that is more accurate for the\
    \ Equifax Credit Bureau, ABC will take a random sample of the names not selected\
    \ by the model.\n"
  mdcn: "\n## 模型日志\n\n模型日志是一种记录，针对每个模型包含开发详情、关键特征和实施日志等信息。它通过以下详情对模型进行长期跟踪：\n\n- *模型名称：*\
    \ 选择一个能反映目标或产品的名称。将其与数字结合，可以跟踪重新开发的模型。如适用，请注明版本号。\n- *模型开发时间：* 记录模型开发的时间范围，使你能够将整个模型开发过程与一般业务活动联系起来进行跟踪。当你在组织内跟踪数百个模型时，这会很有帮助。\n\
    - *模型开发者：* 由于模型开发既是一门科学，也是一门艺术，模型可能会因开发者的不同而具有某些特征。\n- *总体目标：* 模型的理由或目的对于持续相关性和跟踪至关重要。\n\
    - *模型类型：* 用于构建模型的技术可以包括线性回归、逻辑回归、决策树、神经网络或集成模型。\n- *特定目标：* 在模型部署和比较中关注的具体群体或评估资产。\n\
    - *模型开发活动数据：* 用于模型开发的活动数据根据活动特征识别模型详情。\n- *模型实施活动数据：* 用于首次模型实施的活动数据根据活动特征识别模型详情。\n\
    - *模型实施启动日期：* 存储模型实施活动的首个日期。\n- *得分分布（验证）：* 得分的均值、标准差、最小值和最大值刻画验证样本的结构。\n- *得分分布（实施）：*\
    \ 得分的均值、标准差、最小值和最大值刻画实施样本的结构。\n- *筛选标准：* 得分截止值或文件深度代表筛选标准。\n- *筛选业务逻辑：* 筛选标准的业务依据有助于定义模型。\n\
    - *预筛选：* 评分前的筛选对于准确的模型实施至关重要。\n- *预期表现：* 注明目标变量的预期比率，例如响应、审批或其他目标行动，该变量与模型的特定目标相匹配。\n\
    - *实际表现：* 将目标变量的实际比率——例如响应、审批或其他目标行动——与预期表现进行比较。\n- *模型详情：* 模型详情是关于模型开发的特征，可能独特或不寻常。\n\
    - *关键驱动因素：* 模型中的关键预测变量是模型中影响力最大的变量。\n\n模型日志可节省大量时间和精力，因为它可作为管理者、营销人员和分析师的快速参考，让他们了解有哪些可用内容、模型是如何开发的、目标受众是谁等。\n\
    \n为获得最佳效果，请使用电子表格，并为每个模型单独设置一个工作表。一个工作表可能类似表3.5。每次使用模型时都应新增一个工作表。每个工作表应包含日志中的所有要素。如果一个模型是另一个模型的修改版，可以在版本号中注明。\n\
    \n### 表3.5：用于组织重要跟踪详情的示例模型日志\n\n| 日志项 | 详情 |\n|---|---|\n| 模型名称 | R2000 V1 |\n\
    | 模型开发时间 | MM/YY–MM/YY |\n| 模型开发者 | 姓名 |\n| 总体目标 | 提高响应 |\n| 模型类型 | 逻辑回归 |\n|\
    \ 特定目标 | 购买金额 > $10 的响应者 |\n| 模型开发活动（日期） | 春季活动（MM/YY） |\n| 首次活动实施（日期） | 秋季活动\
    \ MM/YY |\n| 模型实施启动日期 | MM/DD/YY |\n| 得分分布（验证） | 均值 = .037，标准差 = .00059，最小值 =\
    \ .0001，最大值 = .683 |\n| 得分分布（实施） | 均值 = .034，标准差 = .00085，最小值 = .0001，最大值 = .462\
    \ |\n| 筛选标准 | 第1至第5十分位 |\n| 筛选业务逻辑 | 预期响应 > .06 |\n| 预筛选 | 年龄25-65；最低风险筛查 |\n\
    | 预期表现 | $25,500 |\n| 实际表现 | $26,243 |\n| 执行详情 | 抽取较低十分位样本用于模型验证和重新开发 |\n| 关键驱动因素\
    \ | 上次购买日期、人口密度 |\n\n本文档将为你节省时间，并防止错误和重复工作。当与其他模型日志结合使用时，它可以作为你所在部门或公司内所有建模项目的参考库。\n\
    \n## 实践札记\n\n大数据是当今商业的驱动力。它只会变得更大，因此利用大数据获得或保持竞争优势的压力只会增加。这一趋势及其带来的复杂性使得正确的分析至关重要。\n\
    \n当你初次接触一个数据集，或接到新的业务挑战或机会时，很容易急于构建那个花哨的预测模型。但你始终应先真正理解底层数据模式，以及不同数据特征之间如何相互关联。如果你的目标是开发预测模型，那么从描述性分析中获得的初步洞见将为构建变量和数据交互提供线索。描述性分析还可能让你在流程早期就注意到潜在的数据问题，例如缺失值和数据偏差。如果你正在与客户或团队合作，与可能拥有额外业务洞见或建议的利益相关者分享描述性分析的早期发现，可能会有所裨益。\n\
    \n## 第4章：用于分析的数据构建\n\n- 引言 ...........................................................\
    \ 53\n- 描述性分析数据 ............................................... 53\n- 预测性分析数据\
    \ ............................................... 54\n  - 潜在客户模型 .......................................................\
    \ 55\n  - 客户模型 ....................................................... 57\n  -\
    \ 风险模型 .......................................................... 59\n- 外部数据来源\
    \ .................................................. 61\n- 实践札记 .....................................................\
    \ 61\n\n### 引言\n\n选择最佳数据进行分析需要透彻理解你的业务目标和市场。数据是所有分析的基础。在这种情况下，那句老话确实没错：“垃圾进，垃圾出！”\n\
    \n寻找合适的分析数据通常从你自己的数据开始。根据你的目标，你可能在自己的数据库中拥有所需的全部数据。然而，在某些情况下，你可能需要从外部数据源购买数据来增强分析。这两种情形都需要一种大数据文化——一种支持各部门孤岛之间以及跨系统协作与数据共享的文化。这种大数据文化需要对数据获取、存储、管理和访问采取战略性方法。\n\
    \n在本章中，我们将介绍描述性分析和预测性分析的一些典型数据来源。这些示例为你开发自己的分析数据集提供了基本框架。\n\n### 描述性分析数据\n\n正如我们在第3章中所看到的，描述性分析有助于你理解数据中的底层特征和模式。你的数据可以来自任何来源。描述性分析可以分析一个\n\
    \n需要注意的是，来自同一产品、同一群体的既往活动数据，是任何定向模型中最佳的数据选择。它可以最准确地预测未来行为。在此情形下无法捕捉的唯一因素包括季节性、市场变化以及多重优惠的影响。\n\
    \n如果无法获得既往活动数据，次优选择是构建*倾向模型*。为此，请使用能够开发出针对与你的主要定向目标相似的产品或服务的模型的数据源。\n\n越来越多的公司正在与其他公司建立亲和关系，以汇集资源并增加利润。例如，信用卡银行正在与航空公司、大学、俱乐部、零售商和能源公司建立合作关系。电信公司正在与航空公司、保险公司及其他公司结成联盟。此类安排的主要好处之一是共享对个人信息的访问权，这些信息可用于开发定向模型。\n\
    \n以下场景突出了创建建模数据集的一些常见方式。\n\n### 案例1：利用既往活动，向同一名单推广同一产品\n\n1月，ABC 信用卡银行从 Experian\
    \ 信用局购买了10万个随机抽取的姓名，用于一项以开发模型为目标的获客活动。除姓名外，ABC 还购买了300多个人口统计和信用属性。随后，ABC 邮寄了一份信用卡优惠，年化百分比利率（APR）为11.9%，且无年费。在接下来的12周内，ABC\
    \ 从该活动中收到约1,000个响应。这些响应被匹配回原始邮寄文件，以创建建模数据集。\n\n5月，ABC 信用卡银行使用最初优惠时购买的300个变量构建了一个响应模型。模型构建并验证后，ABC\
    \ 使用模型算法对 Experian 信用局的5月客户文件进行评分（分配一个估计其响应可能性的概率）。6月初，它向基于模型预测响应率最高的30%客户发送了同样的优惠。为验证模型是否按预期表现，它还邮寄了评分较低姓名中的一个随机样本。\n\
    \n### 案例2：利用既往活动，向新名单推广同一产品\n\n接下来，ABC 信用卡银行希望为其标准的11.9% APR“无年费”优惠开发一个响应模型，该模型将最适合对\
    \ Equifax 信用局的姓名进行评分。所有其他条款和条件都与先前使用 Experian 数据的活动相同。ABC 获取模型开发数据的最具成本效益的选择，不是从随机样本开始，而是使用为\
    \ Experian 信用局开发的模型。ABC 计划使用 Experian 模型对 Equifax 数据进行评分。它将向模型选出的评分最高的40%姓名邮寄。为确保获得一个数据集，用于开发对\
    \ Equifax 信用局更准确的稳健响应模型，ABC 将抽取未被模型选中的姓名中的一个随机样本。\n"
