  mdcn: "\n**图 8.3：SAS Enterprise Miner 工作区**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_126_0.png)\n\
    \n## 输入数据源\n\n接下来，单击 **创建数据源** 节点（位于左上角菜单中“操作”一词的正下方）。数据源向导将打开，并要求你定位一个 SAS 表。单击\
    \ **下一步 ▶**，并在 SASUSER 库中浏览 **DRL_CUSTOMER_DATA** 数据集。找到数据后，选择该数据并单击 **确定**（图\
    \ 8.4）。\n\n**图 8.4：定位并输入数据源**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_126_1.png)\n\
    \n单击 **下一步**。下一个窗口会显示摘要。再次单击 **下一步**，然后选择 **高级**，以打开一个允许你更改数据各个方面的表格。\n\n将 **CUSTOMER_REVENUE**、**CUSTOMER_SUBSCRIPTION_COUNT**\
    \ 和 **YEARS_AS_CUSTOMER** 的 **角色** 更改为 **拒绝**（图 8.5）。这三个变量的角色被设置为 **拒绝**。\n\n\
    **图 8.9：使用元数据分配目标变量角色**\n\n| 名称 | 隐藏 | 隐藏 | 角色 | 新角色 |\n|---|---|---|---|---|\n\
    | AGE | N | 默认 | 输入 | 默认 |\n| CUSTOMER_ID | N | 默认 | ID | 默认 |\n| CUSTOMER_REVENUE\
    \ |  | 默认 | 拒绝 | 默认 |\n| CUSTOMER_SUBSCRIPTION_COUNT |  | 默认 | 拒绝 | 默认 |\n| GENDER\
    \ | N | 默认 | 输入 | 默认 |\n| HOUSEHOLD_INCOME | N | 默认 | 输入 | 默认 |\n| MULTI_SUBS\
    \ | N | 默认 | 目标 | 默认 |\n| YEARS_AS_CUSTOMER |  | 默认 | 拒绝 | 默认 |\n\n下一步是划分数据。\n\
    \n## 划分数据\n\n划分数据的目的是让你在一个数据子集上开发模型，并在另一个数据子集上验证模型。这些数据子集彼此互斥，因为它们不共享任何共同观测。\n\
    \n在决策树建模中，这些子集的使用方式如下：\n\n- *训练：* 用于初始模型拟合的训练子集。\n- *验证：* 验证数据集用于在树构建过程中评估模型并创建最佳子树。\n\
    \n在 **样本** 选项卡中，选择左起第二个图标 **数据划分**，并将其拖到图上。将其连接到 **元数据** 图标（图 8.10）。\n\n**图 8.10：将数据划分附加到元数据图标**\n\
    \n![](img/976d9b992e82c4ac7d195d03a30b4915_129_0.png)\n\n在左下角的 **属性** 窗口中，查找 **训练**\
    \ 下的 **数据集分配**。默认显示将文件的 40% 分配给 **训练**，并将 30% 分别分配给 **验证** 和 **测试**。对于树模型，你只需要\
    \ **训练** 和 **验证**。因此，将 **训练** 和 **验证** 各设置为 50%，并将 **测试** 设置为 0%（图 8.11）。\n\n\
    **图 8.11：重新分配数据分配百分比**\n\n| 属性 | 值 |\n|---|---|\n| **常规** | |\n| 节点 ID | Part\
