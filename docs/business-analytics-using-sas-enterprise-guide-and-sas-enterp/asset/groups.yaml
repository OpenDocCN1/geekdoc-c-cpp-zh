    本书是为刚接触 SAS Enterprise Guide 和 SAS Enterprise Miner 的数据分析师编写的教程。它通过使用强大的统计软件完成大多数行业常见的各类业务分析，提供宝贵的实践经验。书中以清晰、图文并茂的分步说明，引导你完成基于业务案例研究的示例。你将制定业务目标、管理数据，并执行可用于优化营销、风险与客户关系管理以及业务流程和人力资源的分析。\n\
    \n### 前提条件\n\n如果你是一位精明的商务人士，渴望了解是什么驱动你的业务，那么本书可以帮助你入门。你需要能够使用 SAS Enterprise Guide\
