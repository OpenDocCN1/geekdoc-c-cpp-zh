    \ SUM_of_CUSTOMERS/SUM_of_SUBSCRIBERS，然后点击“下一步”（图 6.12）。在“列名”旁边输入 PCT_of_SUBSCRIBERS。在窗口底部的“格式”旁边，点击“更改”，然后选择“数值”和“Percent\
