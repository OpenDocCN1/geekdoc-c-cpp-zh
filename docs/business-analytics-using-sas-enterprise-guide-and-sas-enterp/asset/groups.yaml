    ![](img/976d9b992e82c4ac7d195d03a30b4915_60_0.png)


    ## Maintain the Model


    At this point, you have invested much time and many resources in creating a powerful
    model. Now you can ensure its longevity and usefulness by documenting and tracking
    it. Since the mid-1990s, I have worked with numerous modelers, marketers, and
    managers to develop and implement predictive models. Shockingly, often little
    is known about what models exist within the corporation, how they were built,
    and how they have been used to date. After all the time and effort spent developing
    and validating a model, the extra effort to document and track the model’s origin
    and utilization is certainly worthwhile. You begin by determining the expected
    life of the model.


    ### Model Life


    The life of a model depends on several factors. One of the main factors is the
    target. If you are modeling response, you can redevelop the model within a few
    months. If the target is risk, then you may not know how the model performs for
    a couple of years. If the model has an expected life of several years, then you
    may be able to track the performance along the way.


    Some predictive models are developed on data with performance appended. If the
    performance window is three years, it should contain all the activity for the
    three-year period. In other words, if you want to predict bankruptcy over a three-year
    period, you will take all names that are current for time, *T*. The performance
    will then be measured in the time period from *T* + 6 to *T* + 36 months. So when
    the model is implemented on a new file, the performance can be measured or benchmarked
    at each six-month period.


    If the model is not performing as expected, then the choice has to be made whether
    to continue use, rebuild, or refresh.


    When a model begins to degrade, the decision must be made to rebuild or refresh
    the model. To *rebuild* means to start from scratch. You would use new data, build
    new variables, and rework the entire process. To *refresh* means to keep the current
    variables and rerun the model on new data.


    Refreshing the model usually makes sense, unless an opportunity emerges to introduce
    new predictive information. For example, if a new data source becomes available,
    then incorporating that information into a new model might make sense. If a model
    is very old, testing the building of a new one might be advisable. Finally, if
    strong shifts occur in the marketplace, then a full-scale model redevelopment
    may be warranted, as happened in the credit card industry when low introductory
    rates were launched. In that event, the key drivers for response and balance transfers
    were changing with the drop-in rates.

