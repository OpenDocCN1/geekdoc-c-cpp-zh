    \ 关于作者\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_11_0.png)\n\n**Olivia Parr-Rud**\
    \ 是预测分析、商业智能和创新领导力领域的国际公认专家，创立了 SAS 数据挖掘用户组，自 1991 年起便是 SAS 用户，并多年担任 SAS 讲师和会议演讲者。她主持广受欢迎的\
    \ VoiceAmerica 商业电台节目 *Quantum Business Insights* (http://www.voiceamerica.com/show/2240/quantum-business-insights)，并且是整合分析工具和领导力实践以优化绩效和组织敏捷性的思想领袖。她的预测分析研究促成了她的第一本书《数据挖掘食谱：营销、风险和客户关系管理建模》（Wiley\
    \ 2000），该书揭示了全球经济与组织动态之间的联系，这一主题也在她的第二本书《商业智能成功因素：在全球化经济中调整业务的工具》（Wiley and SAS\
    \ Institute Inc. 2009）中得到了深入探讨。她目前的研究将开发一个模型，用于追踪商业智能与人类智能的一致性。Parr-Rud 拥有数学学士学位和统计学硕士学位。除了公开演讲外，她还提供预测分析和商业领导力方面的培训和咨询，客户包括众多财富\
    \ 500 强企业。更多信息，请访问 http://oliviarug.com。\n\n通过访问作者页面 http://support.sas.com/publishing/authors/parr-rud.html\
    \ 了解更多关于这位作者的信息。您可以在那里下载免费书籍节选、访问示例代码和数据、阅读最新评论、获取更新等。\n\n## 第 1 章：定义业务目标\n\n\
    - 引言 ................................................................ 1\n- 设定目标\
    \ ................................................................ 1\n- 描述性分析\
    \ .................................................... 3\n    - 客户画像 .................................................\
    \ 3\n    - 客户忠诚度 ................................................ 4\n    - 市场渗透率或钱包份额\
    \ ............................ 4\n- 预测性分析 ....................................................\
    \ 4\n    - 营销模型 ................................................ 5\n    - 风险与审批模型\
    \ ........................................ 6\n    - 按行业划分的预测建模机会 .................\
    \ 9\n- 实战笔记 ................................................... 13\n\n### 引言\n\
    \n在当今竞争激烈的全球经济中，组织越来越依赖于其利用准确、可访问、可操作数据的能力。这种对数据依赖性的增强，需要一种新的愿景型领导力，聚焦于对企业数据管理系统的明智投资、利用该系统的合适的分析人才，以及支持“大数据”的文化。\n\
    \n大数据文化包括强大的分析工具。高级分析和报表软件平台，如 SAS Enterprise Guide 和 SAS Enterprise Miner，使用户能够从大数据及其底层模式中提取深刻洞察。本书旨在通过提供案例研究和日常示例，指导业务分析师或经理寻找这些洞察。\n\
    \n在本章中，您将学习明确定义任何数据分析项目目标的重要性。\n\n### 设定目标\n\n数据分析的使用如今在各行业的业务中已十分普遍。许多应用，如客户画像、响应模型或风险模型，都相当直接。然而，随着公司尝试开发处理更复杂指标（如客户留存率和生命周期价值）的模型，清晰目标的重要性被放大。未能正确定义目标可能导致资金浪费和机会错失。\n\
    \n任何数据分析项目的第一步也是最重要的一步，是建立一个清晰的目标——不是仅由数据或方法定义的目标，而是对整个业务有意义的目标。换句话说，分析的目标必须根据它将如何帮助业务实现其战略目标来定义。当您与利益相关者互动时，问题和分析方法可能包括以下内容：\n\
    \n- *您是否需要了解当前客户的特征？* 此目标可能涉及寻找平均值或对客户群进行细分并创建画像。\n- *您是否需要吸引新客户？* 对客户获取活动的响应建模可以帮助您降低吸引更多客户的营销成本。\n\
    - *您是否需要规避高风险客户？* 风险或审批模型可以识别出有可能给公司造成损失的客户或潜在客户。例如，在金融服务领域，典型损失来自贷款违约。而保险损失则发生在被保险人提出的索赔超过计算出的损失准备金时。\n\
    - *您是否需要让不盈利的客户变得更有利可图？* 交叉销售和向上销售目标模型可用于增加现有客户的利润。\n- *您是否需要留住盈利客户？* 留存模型或“流失”模型可以识别出有可能降低或停止当前活动水平的客户。在这些客户改变行为之前识别出他们，有助于制定保留他们的策略和行动。留住客户的成本通常低于赢回客户的成本。\n\
    - *您是否需要新客户实现盈利？* 生命周期价值模型可以识别出有可能成为长期盈利客户的潜在客户。结合多种指标，如响应、激活和流失，可以帮助您定位在产品或服务生命周期内价值最高的潜在客户。\n\
    - *您是否需要赢回流失的客户？* 赢回模型旨在针对老客户。\n- *您是否需要提高客户满意度？* 在当今竞争激烈的市场中，客户满意度对成功至关重要。将市场研究与客户画像相结合是衡量客户满意度的有效方法。\n\
    - *您是否需要增加销售额？* 您可以通过多种方式增加销售额。新客户获取模型可以扩大客户群，从而带来销售额增长。交叉销售和向上销售模型也可用于增加销售额。\n\
    - *您是否需要确定捆绑销售或按顺序提供的产品或服务？* 关联分析可以识别出有很大概率被一起购买或在较短时间内购买的产品。\n- *您是否需要降低成本？*\
    \ 通过使用客户获取和客户关系管理模型进行更精准的定位，可以通过降低支出来提高营销活动的效率。\n\n"
