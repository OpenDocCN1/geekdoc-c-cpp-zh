    \ for each customer in the transaction database, including the amount, date, and\
    \ spending category. To develop a fraud model, it collects several weeks of purchase\
    \ data for each customer and calculates the average daily spending within each\
    \ category. From this information, it can establish rules that trigger an inquiry\
    \ if a customer's spending pattern changes.\n\n### Case 4: Insurance Risk for\
    \ Customers\n\nCCC Insurance Company wants to develop a model to predict comprehensive\
    \ automobile claims for a one to four-year period. Until now, it has been using\
    \ simple segmentation based on demographic variables from the customer database.\
    \ It wants to improve its prediction by building a model with overlay data from\
    \ Sure Target List Company. Sure Target sells demographic, psychographic, and\
    \ proprietary segments called Sure Hits that it developed by using cluster analysis.\n\
    \nTo build the file for overlay, CCC randomly selects 5,000 names from the customers\
    \ with at least a five-year tenure who filed at least one claim in the previous\
    \ four years. It randomly selects another 5,000 customers with at least a five-year\
    \ tenure who have never filed a claim. CCC sends the files to Sure Target List\
    \ Company, with a request that the customers be matched to an archive file from\
    \ five years ago. The demographic, psychographic, and proprietary segments represent\
    \ the five-year-old customer profiles. The data can be used to develop a predictive\
    \ model that will target customers who are likely to file a claim in the next\
    \ four years.\n\n> **TIP:** For best results in model development, strive to have\
    \ the population from which the data is extracted resemble the population to be\
    \ scored.\n\n### External Sources of Data\n\nScores built on your own data from\
    \ within your own company will almost always be the most powerful ones available.\
    \ But, as shown in some of the examples above, data purchased from an outside\
    \ source is often useful for testing and modeling. Some main sources of data for\
    \ both consumers and businesses are the major credit bureaus Experian, Equifax,\
    \ and TransUnion. Other companies that sell scores are Fair Isaac (FICO), Dun\
    \ & Bradstreet (business data), InfoUSA, and U.S. Data Corp. A little Internet\
    \ research will uncover a multitude of data sources.\n\n### Notes from the Field\n\
    \nAs you can see, there are numerous sources and types of data available for modeling\
    \ and analysis. With experience, you may find additional sources. Just be sure\
    \ it is accurate and makes sense to your business. You learned in Chapter 2 that\
    \ your analysis is only as good as your data, and this truism certainly applies\
    \ to descriptive and predictive analyses. You can create a fancy analysis on bad\
    \ data, but the analysis will be worthless. Similarly, you can build what appears\
    \ to be a strong model on bad data, and the model will be worthless.\n\nOnce you\
    \ understand the data and how it was sourced, the next step is to perform exploratory\
    \ data analysis (EDA). You may be tempted to skip this step, but EDA is an important\
    \ step in understanding the health of your data. It involves looking at frequencies\
    \ of categorical variables and at distributions of continuous variables, also\
    \ known as descriptive analysis (described in Chapter 3).\n\nIf you recall the\
    \ Ferrari metaphor, SAS technology makes it possible for you to build a model\
    \ without knowing whether the data is good or bad. So, take care to use common\
    \ sense and business acumen to validate your results.\n\n## Chapter 5: Descriptive\
    \ Analysis Using SAS Enterprise Guide\n\n- Introduction ............................................................\
    \ 63\n- Project Overview ........................................................\
    \ 63\n- Project Initiation .......................................................\
    \ 64\n- Exploratory Analysis .....................................................\
    \ 65\n  - Importing the Data ....................................................\
    \ 65\n  - Viewing the Data .......................................................\
    \ 66\n  - Exploring the Data .....................................................\
    \ 66\n- Segmentation and Profile Analysis .......................................\
    \ 69\n- Correlation Analysis .....................................................\
    \ 76\n- Notes from the Field .....................................................\
    \ 77\n\n### Introduction\n\nIn Chapter 1, you learned the importance of setting\
    \ a clear objective. In Chapter 2, you looked at types and sources of data, using\
    \ examples across a variety of industries. In Chapter 3, you were introduced to\
    \ the concept of descriptive and predictive analysis. In Chapter 4, you learned\
    \ how to prepare data for analysis. Now, you’re ready to start making the data\
    \ actionable. Beyond profiling and correlations, you can begin to craft analyses\
    \ that improve your marketing actions or generate new product ideas. Exploring\
    \ the data with a business goal in mind is one of the best ways to leverage the\
    \ power of descriptive analysis.\n\nThroughout this chapter, you will focus on\
    \ a specific case study from the publishing industry. With slight modifications,\
    \ this process can work in a variety of industries. So, while you work through\
    \ this analysis, think about how you can adapt it for your own industry.\n\n###\
    \ Project Overview\n\nThe leadership team at DMR Publishing Company is interested\
    \ in understanding the drivers of revenue within its business. For the past year,\
    \ it has gathered U.S. customer data that consists of revenues, numbers of magazines\
    \ or journals, and three demographic variables. For this analysis, you will use\
    \ SAS Enterprise Guide 6.1.\n\nThe project has five steps:\n\n- 1. Initiate the\
    \ project in SAS Enterprise Guide 6.1.\n- 2. Import and view the data.\n- 3. Explore\
    \ the data.\n- 4. Segment and profile the data.\n- 5. Perform correlation analysis.\n\
    \n### Project Initiation\n\nOpen the project (Figure 5.1) by double-clicking the\
    \ SAS Enterprise Guide icon. Click **New Project**. You will see an area on the\
    \ left called the **Project Tree**. The Project Tree is where you can track each\
    \ process and output in the project. The **Process Flow** area on the right is\
    \ where you will build your process, in the form of a flowchart.\n\n**Figure 5.1:\
    \ SAS Enterprise Guide 6.1 Work Area**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_76_0.png)\n"
  mdcn: "\n由于信用局提供信用数据，你可以针对潜在客户构建风险模型。信用风险数据的可获取性，为有兴趣开发自有专有风险评分的银行带来了相当大的优势。\n\n\
    ### 案例 1：潜在客户的违约风险\n\nHigh Street Bank 过去一直较为保守。其产品仅限于支票账户、储蓄账户和担保贷款。为了吸引新客户，它有意提供无担保贷款。但首先，它希望开发一个预测模型，以识别可能违约的潜在客户。\n\
    \n为了创建建模和开发数据集，High Street Bank 决定从一家信用局购买数据。它希望预测潜在客户在三年期间内的破产风险。风险部门要求提供四年前的\
    \ 12,000 份存档信用档案，其中 6,000 份显示过去三年内发生过破产，6,000 份没有破产。合并后的姓名文件将使其能够了解客户当时的信用及其他财务特征。\n\
    \n### 案例 2：潜在客户的违约损失风险\n\nTrustus Mortgage 希望在批准新抵押贷款之前估算其损失敞口。每位客户已经有一个估计违约概率的评分。下一步是在发生违约的情况下估算损失金额。合并评分可提供对整体风险水平的良好估计。\n\
    \n建模数据集通过合并两个样本构建。第一个是当前客户样本，这些客户的贷款已持有至少五年。第二个是客户样本，这些客户的贷款至少在五年前发起，并且已完成违约流程。预测信息根据其原始申请中的信息构建。损失信息包括与房产、位置（以符合州和地方法律）以及贷款性质相关的信息。例如，一些州有不同的止赎流程，一些贷款有抵押贷款保险，而当地房地产市场对最终损失金额有重要影响。\n\
    \n### 案例 3：客户欺诈风险\n\nAnchor Credit Card Bank 希望开发一个预测欺诈的模型。它在交易数据库中捕获每位客户的购买活动，包括金额、日期和消费类别。为了开发欺诈模型，它收集每位客户数周的购买数据，并计算每个类别中的日均消费。根据这些信息，它可以建立规则：如果客户的消费模式发生变化，就触发调查。\n\
    \n### 案例 4：客户保险风险\n\nCCC Insurance Company 希望开发一个模型，预测一年至四年期的综合汽车索赔。到目前为止，它一直使用基于客户数据库中人口统计变量的简单细分。它希望通过使用来自\
    \ Sure Target List Company 的叠加数据构建模型来改进预测。Sure Target 销售人口统计、心理特征以及名为 Sure Hits\
    \ 的专有细分，这些细分是其通过聚类分析开发的。\n\n为了构建用于叠加的文件，CCC 从客户中随机选择 5,000 个姓名，这些客户至少有五年客户关系，且在过去四年中至少提出过一次索赔。它又随机选择另外\
    \ 5,000 名至少有五年客户关系且从未提出过索赔的客户。CCC 将这些文件发送给 Sure Target List Company，并要求将这些客户与五年前的存档文件进行匹配。人口统计、心理特征和专有细分代表五年前的客户画像。这些数据可用于开发预测模型，以锁定未来四年可能提出索赔的客户。\n\
    \n> **提示：** 为了在模型开发中获得最佳结果，应力求使抽取数据所来源的总体与将要评分的总体相似。\n\n### 外部数据来源\n\n基于自己公司内部数据构建的评分，几乎总是可用的最强大评分。但是，如上述一些示例所示，从外部来源购买的数据通常对测试和建模很有用。面向消费者和企业的一些主要数据来源是主要信用局\
    \ Experian、Equifax 和 TransUnion。其他销售评分的公司包括 Fair Isaac（FICO）、Dun & Bradstreet（企业数据）、InfoUSA\
    \ 和 U.S. Data Corp.。稍作互联网检索，就会发现大量数据来源。\n\n### 来自实践现场的笔记\n\n如你所见，可用于建模和分析的数据来源和数据类型繁多。随着经验积累，你可能会发现更多来源。只需确保数据准确且对你的业务有意义。你在第2章学到，分析的好坏取决于数据，这一不言而喻的道理当然也适用于描述性分析和预测性分析。你可以基于糟糕的数据做出花哨的分析，但这种分析将毫无价值。同样，你可以基于糟糕的数据构建看似强大的模型，但该模型将毫无价值。\n\
    \n一旦你理解了数据及其来源，下一步就是执行探索性数据分析（EDA）。你可能想跳过这一步，但 EDA 是了解数据健康状况的重要步骤。它包括查看分类变量的频数和连续变量的分布，也称为描述性分析（第3章所述）。\n\
    \n如果你还记得那个法拉利比喻，SAS 技术使你能够在不知道数据好坏的情况下构建模型。因此，请务必运用常识和商业敏锐度来验证你的结果。\n\n## 第5章：使用\
    \ SAS Enterprise Guide 进行描述性分析\n\n- 引言 ............................................................\
    \ 63\n- 项目概述 ........................................................ 63\n- 项目启动\
    \ ....................................................... 64\n- 探索性分析 .....................................................\
    \ 65\n  - 导入数据 .................................................... 65\n  - 查看数据\
    \ ....................................................... 66\n  - 探索数据 .....................................................\
    \ 66\n- 细分与画像分析 ....................................... 69\n- 相关性分析 .....................................................\
    \ 76\n- 来自实践现场的笔记 ..................................................... 77\n\n\
    ### 引言\n\n在第1章，你学习了设定明确目标的重要性。在第2章，你通过不同行业的示例，了解了数据的类型和来源。在第3章，向你介绍了描述性分析和预测性分析的概念。在第4章，你学习了如何为分析准备数据。现在，你已准备好开始让数据可付诸行动。除了画像和相关性分析之外，你还可以开始设计分析，以改进营销行动或产生新产品创意。带着业务目标探索数据，是发挥描述性分析能力的最佳方式之一。\n\
    \n在本章中，你将聚焦于出版行业的一个具体案例研究。稍作修改，这一流程便可适用于多种行业。因此，在完成本分析时，请思考如何将其调整用于你自己的行业。\n\n\
    ### 项目概述\n\nDMR Publishing Company 的领导团队有兴趣了解其业务收入的驱动因素。过去一年，它收集了美国客户数据，包括收入、杂志或期刊数量以及三个人口统计变量。本分析将使用\
    \ SAS Enterprise Guide 6.1。\n\n该项目包含五个步骤：\n\n- 1. 在 SAS Enterprise Guide 6.1 中启动项目。\n\
    - 2. 导入并查看数据。\n- 3. 探索数据。\n- 4. 对数据进行细分和画像。\n- 5. 执行相关性分析。\n\n### 项目启动\n\n双击 SAS\
    \ Enterprise Guide 图标打开项目（图5.1）。单击 **新建项目**。你会看到左侧有一个名为 **项目树** 的区域。**项目树**可用于跟踪项目中的每个过程和输出。右侧的\
    \ **过程流** 区域是你以流程图形式构建过程的地方。\n\n**图 5.1：SAS Enterprise Guide 6.1 工作区**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_76_0.png)\n\
    \n"
