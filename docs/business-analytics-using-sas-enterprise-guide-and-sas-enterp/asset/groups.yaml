    banks and other financial institutions to offer a full suite of financial services.
    Telecommunications companies are expanding their product and service lines or
    merging with cable and Internet companies. Many companies in a variety of industries
    are viewing their customers as their key asset.


    These expanding markets create many opportunities for target modeling. A customer
    who is already doing business with you is typically more likely to prefer you
    over a competitor when purchasing additional products and services. This likelihood
    creates many opportunities for cross-sell and up-sell target modeling. Retention
    and renewal models are also critical for targeting customers who may be looking
    to terminate their relationship. Simple steps to retain a customer can be quite
    cost-effective.


    Data from prior campaigns is also the best data for developing models for customer
    targeting. Although most customer models are developed with internal data, overlay
    data from an external source is sometimes appended to customer data to enhance
    the predictive power of the targeting models.


    > **TIP:** Many list companies will allow you to test their overlay data at no
    charge. If a list company is interested in building a relationship, it usually
    is willing to provide its full list of attributes for testing. The best method
    is to take a past campaign and overlay the entire list of attributes. Next, develop
    a model to learn which attributes are predictive for your product or service.
    If you find a few very powerful predictors, you can negotiate a price to purchase
    these attributes for future campaigns.


    # Case 1: Cross-Sell


    Sure Wire Communications has built a solid base of long distance customers over
    the past 10 years. It is now expanding into cable television and wants to cross-sell
    this service to its existing customer base. Through a phone survey to 200 customers,
    Sure Wire learned that approximately 25% are interested in signing up for cable
    service. To develop a model for targeting cable customers, it wants a campaign
    with a minimum of 5,000 responders. It is planning to mail an offer to a random
    sample of 25,000 customers. This plan will ensure that, with as low as a 20% response
    rate, it will have enough responders to develop a model.


    # Case 2: Up-Sell Using Life-Stage Segments


    XYZ Life Insurance Company wants to develop a model to target customers who are
    most likely to increase their life insurance coverage. From past experience and
    common sense, it knows that customers who are just starting a family are good
    candidates for increased coverage. But it also knows that other life events can
    trigger the need for more life insurance.


    To enhance its customer file, XYZ plans to test overlay data from Lifetime List
    Company. Lifetime specializes in *life-stage* segmentation. XYZ feels that this
    additional segmentation will increase the power of its model. To improve the results
    of the campaign, XYZ Life is planning to make the offer to all of its customers
    in Life Stage 3. These customers are the ones who have a high'
  - '[PAGE 71]


    probability of being in the process of beginning a family. XYZ Life will pull
    a random sample from the remainder of the names to complete the mailing. Once
    the results are final, it will have a full data set with life-stage enhancements
    for model development.


    # Case 3: Loyalty, Attrition, and Churn


    Float Credit Card Bank wants to predict which customers are going to pay off their
    balances in the next three months. Once they are identified, Float will perform
    a risk assessment to determine whether it can lower its APR, in an effort to keep
    its balances. Through analysis, Float has determined that there is some seasonality
    in balance behavior. For example, balances usually increase in September and October
    because of school shopping. They also rise in November and December because of
    holiday shopping. Balances almost always drop in January as customers pay off
    their December balances. Another decrease is typical in April, when customers
    receive their tax refunds.


    To capture the effects of seasonality, Float decided to look at two years of data.
    It restricted the analysis to customers who were out of their introductory period
    by at least four months. The analysts at Float structured the data so that it
    could use the month as a predictor, together with all the behavioral and demographic
    characteristics on the account. The modeling data set was made up of all the lost
    customers and a random sample of the current customers.


    # Risk Models


    Managing risk is a critical component to maintaining profitability in many industries.
    Most of us are familiar with the common risk inherent in the banking and insurance
    industries. The primary risk in banking is the borrower’s failure to repay a loan.
    In insurance, the primary risk is the customer’s filing a claim. Another major
    risk assumed by banks and insurance companies is that of fraud. Stolen credit
    cards cost banks millions of dollars a year. Losses from fraudulent insurance
    claims are equally staggering.


    Strong relationships have been identified between financial risk and some types
    of insurance risk. As a result, insurance companies use financial risk models
    to support their claim risk modeling. One interesting demonstration of the correlation
    between financial risk and insurance risk is the fact that credit payment behavior
    predicts the likelihood of auto insurance claims. Even though they seem unrelated,
    the two behaviors are clearly linked and are used effectively in risk assessment.


    Risk models are challenging to develop for several reasons. The performance window
    has to cover a period of several years to be effective, which can make the models
    difficult to validate. Credit risk is sensitive to the health of the economy,
    and the risk of claims for insurance is vulnerable to population trends.


    Credit data is easy to obtain from any of the three major credit bureaus: Experian,
    Equifax, and Trans Union. It’s just expensive to request and can be used only
    for an offer of credit. Some insurance risk data, such as data from life and health
    insurance claims, is relatively easy to obtain, but obtaining claims data for
    the automotive insurance industry can be more difficult to obtain.'
