    Your next step is to partition the data.


    # ## Partition the Data


    The purpose of partitioning the data is to allow you to develop the model on one
    subset of the data and validate the model on another subset of the data. The subsets
    of the data are mutually exclusive in that they do not share any common observations.


    In decision tree modeling, the subsets are used as follows:


    +   - *Train:* The train subset for the initial model fitting.

    +   - *Validation:* The validation data set is used to evaluate the model during
    the tree building process and create the best subtree.


    From the **Sample** tab, select the second icon from the left, **Data Partition**,
    and drag it onto the diagram. Connect it to the **Metadata** icon (Figure 8.10).


    **Figure 8.10: Attach Data Partition to Metadata Icon**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_129_0.png)


    Within the **Property** window in the bottom left, look for **Data Set Allocations**
    under **Train**. The default shows 40% of the file allocated to **Training** and
    30% each to **Validation** and **Testing**. For tree models, you only need **Training**
    and **Validation**. So, set **Training** and **Validation** to 50% each, and **Test**
    to 0% (Figure 8.11).'
