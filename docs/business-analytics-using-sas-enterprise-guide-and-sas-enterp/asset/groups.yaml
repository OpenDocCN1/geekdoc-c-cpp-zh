    排名前 40% 的名单响应率为 2.1%。这一响应率低于 Experian 数据中的响应率。然而，ABC 能够确定该模型仍然表现良好；由于文件其余部分经过抽样，可以通过对样本加权来重建整个文件的表现，这允许样本中的每个成员被多次计数。总体响应率低于
    1%，并且随着评分升高，总体中每增加 10% 的区段响应率都更高。重建后的总体文件仅使用 Equifax 数据来开发新模型。


    ## 案例 3：向同一名单推广同一产品，使用带筛选标准的过往活动


    Summit Sports 是一家通过在线和目录销售体育用品的公司。六个月前，Summit Sports 从 Power List Company 购买了一份潜在客户名单。该名单包含姓名、电子邮件地址以及
    35 个人口统计和心理统计属性。Summit Sports 使用的标准仅筛选 30 至 55 岁的男性。它向该细分群体发送了一封以棒球产品为特色的目录电子邮件。经过三个月的表现活动后，响应和销售金额被追加到原始电子邮件文件中，从而创建建模数据集。


    Summit Sports 计划使用这 35 个人口统计和心理统计属性开发一个预测模型，以定位销售额超过 20 美元的响应。模型构建并验证后，Summit
    Sports 将拥有一个稳健的工具，可对新的名单进行评分，以定位从棒球产品目录中购买金额超过 20 美元的客户。为获得最佳结果，名单将从 Power List
    Company 购买，并使用与第一个模型相同的筛选标准。


    ## 案例 4：向同一名单推广类似产品，使用过往活动


    几个月前，RST Cruise Line 决定从 TravelPro Publishing Company 购买一份旅游杂志订阅者名单。它随机选取了 10,000
    个姓名，并向他们发送了加勒比海邮轮优惠。在表现窗口结束时，当收到大部分预期响应后，RST 开发了一个模型，用于定位未来的加勒比海邮轮优惠。


    与此同时，阿拉斯加邮轮产品经理希望尝试同一份旅游杂志订阅者名单。RST 决定不使用随机样本从头开始，而是使用加勒比海模型对该文件进行评分，以定位阿拉斯加邮轮优惠。尽管阿拉斯加邮轮不如加勒比海邮轮受欢迎，但它认为至少这样能够定位喜欢乘坐邮轮的人。通过向名单中最好的
    30% 邮寄，并对名单其余部分进行随机抽样，RST 验证了使用加勒比海模型比仅随机邮寄优惠更具成本效益。


    ## 客户模型


    随着许多行业的市场逐渐成熟，吸引新客户变得越来越困难。例如，信用卡银行被迫提供低利率，以从竞争对手那里吸引客户。获取新客户的成本已变得如此高昂，以至于许多公司正在扩展产品线，以最大化现有客户关系的价值。信用卡银行正在提供保险或投资产品，或者与全能银行及其他金融机构合并，以提供全套金融服务。电信公司正在扩展其产品和服务线，或与有线电视和互联网公司合并。各行各业的许多公司都将客户视为其关键资产。


    这些不断扩大的市场为目标建模创造了许多机会。已经与您有业务往来的客户，在购买额外产品和服务时，通常更可能选择您而不是竞争对手。这种可能性为交叉销售和向上销售的目标建模创造了许多机会。留存和续约模型对于定位可能希望终止关系的客户也至关重要。留住客户的简单措施可能相当具有成本效益。


    来自过往活动的数据也是开发客户定位模型的最佳数据。尽管大多数客户模型是使用内部数据开发的，但有时会将来自外部来源的叠加数据追加到客户数据中，以增强定位模型的预测能力。


    > **提示：** 许多名单公司会允许您免费测试其叠加数据。如果一家名单公司有兴趣建立关系，它通常愿意提供其完整的属性列表用于测试。最佳方法是选取一次过往活动，并叠加完整的属性列表。接下来，开发一个模型，以了解哪些属性对您的产品或服务具有预测作用。如果您发现少数几个非常强大的预测变量，可以协商价格，以便为未来的活动购买这些属性。


    ## 案例 1：交叉销售


    Sure Wire Communications 在过去 10 年中建立了稳固的长途电话客户基础。它现在正扩展到有线电视领域，并希望向现有客户群交叉销售这项服务。通过对
    200 名客户的电话调查，Sure Wire 了解到约 25% 的客户有兴趣开通有线电视服务。为了开发定位有线电视客户的模型，它希望开展一次至少有 5,000
    名响应者的活动。它计划向 25,000 名客户的随机样本邮寄优惠。该计划将确保即使响应率低至 20%，也能拥有足够的响应者来开发模型。


    ## 案例 2：利用人生阶段细分进行向上销售


    XYZ Life Insurance Company 希望开发一个模型，以定位最有可能增加人寿保险保额的客户。根据过往经验和常识，它知道刚刚开始组建家庭的客户是增加保额的良好候选者。但它也知道，其他人生事件可能触发对更多人寿保险的需求。


    为了增强客户档案，XYZ 计划测试来自 Lifetime List Company 的叠加数据。Lifetime 专注于*人生阶段*细分。XYZ 认为这种额外的细分将增强其模型的能力。为了提高活动效果，XYZ
    Life 计划向所有处于人生阶段 3 的客户提供该优惠。这些客户很可能正处于开始组建家庭的过程中。XYZ Life 将从其余名单中抽取随机样本，以完成邮寄。一旦结果最终确定，它将拥有一个带有生命阶段增强信息的完整数据集，用于模型开发。


    ## 案例 3：忠诚度、客户流失（Attrition）与客户流失（Churn）


    Float Credit Card Bank 希望预测哪些客户将在未来三个月内还清余额。一旦识别出这些客户，Float 将进行风险评估，以确定是否可以降低其年利率（APR），从而努力保留其余额。通过分析，Float
    已确定余额行为存在一定的季节性。例如，余额通常在 9 月和 10 月因开学购物而增加。它们也会在 11 月和 12 月因节日购物而上升。随着客户偿还 12
    月余额，余额几乎总会在 1 月下降。另一个典型的下降发生在 4 月，此时客户收到退税。


    为了捕捉季节性的影响，Float 决定查看两年的数据。它将分析限制在已结束初始优惠期至少四个月的客户。Float 的分析师对数据进行了结构化处理，以便将月份作为一个预测变量，并结合账户上的所有行为和人口统计特征。建模数据集由所有流失客户和现有客户的随机样本组成。


    ## 风险模型


    在许多行业中，风险管理是维持盈利能力的关键组成部分。我们大多数人都熟悉银行和保险行业固有的常见风险。银行业的主要风险是借款人未能偿还贷款。在保险业，主要风险是客户提出索赔。银行和保险公司承担的另一个主要风险是欺诈风险。信用卡被盗每年使银行损失数百万美元。欺诈性保险索赔造成的损失同样惊人。


    人们已经发现财务风险与某些类型的保险风险之间存在很强的关联。因此，保险公司使用财务风险模型来支持其索赔风险建模。财务风险与保险风险之间相关性的一个有趣例证是，信用还款行为可以预测汽车保险索赔的可能性。尽管它们看似无关，但这两种行为明显相互关联，并被有效地用于风险评估。


    由于多种原因，风险模型的开发具有挑战性。表现窗口必须覆盖数年时间才能有效，这会使模型难以验证。信用风险对经济健康状况敏感，而保险索赔风险易受人口趋势影响。


    信用数据很容易从三大征信局中的任何一家获取：Experian、Equifax 和 Trans Union。只是申请获取的费用高昂，并且只能用于提供信贷的要约。某些保险风险数据，例如人寿和健康保险索赔数据，相对容易获取，但获取汽车保险行业的索赔数据可能更加困难。


