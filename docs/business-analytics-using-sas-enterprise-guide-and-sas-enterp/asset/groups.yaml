  - '[PAGE 167]


    losses in the millions, the ability to avoid potentially bad loans can have a
    huge benefit to the lender’s profits.


    A common strategy for risk models is to assign rules based on the ranges of probability.
    For example, you can automatically approve any application with a mean probability
    of default that is less than a specified value. If you look at the **Mean Posterior
    Probability** for the decision tree model, you might say that any loan applicant
    with a probability of default less than 3% is automatically approved. Any loan
    applicant with a probability of default greater than 4% is automatically declined,
    and those applicants with a probability of default between 3% and 4% require further
    research.


    The benefits of predictive models have proven to save or make companies millions
    of dollars. For more information about applying models, see *Data Mining Cookbook*
    (Parr-Rud 2001). For information about common modeling issues and mistakes, see
    *Identifying and Overcoming Common Data Mining Mistakes* (Wielenga 2007).


    > **NOTE:** If you are tasked with building risk models, SAS Enterprise Miner
    offers an advanced feature that allows you to build scorecards. For more information,
    see your SAS representative.


    # Notes from the Field


    By mastering the techniques in this chapter, you have a powerful set of skills
    you can use to deliver strategic and tactical business analysis to your clients
    and customers. With this power comes great responsibility. Keep in mind that your
    clients may not understand how you get your results, or even know if they are
    accurate. So, you must practice due diligence. If you are on a team, perhaps you
    can review your results with another analyst. Or, review your results with someone
    who has deep business knowledge in the subject matter of your analysis.


    When presenting the results of your analysis, always tie your findings back to
    your business objectives. Explain to your stakeholders in clear business language
    how they can take action or derive insights from the results. Avoid statistical
    jargon such as *chi-squared* and *log likelihood*. They will understand lift,
    especially if you can tie it to increased savings or decreased loss.


    Now, you can consider your Ferrari to be fully loaded; it has plenty of power
    under its hood, and it has many features that will enable you to drive through
    difficult terrain and reach your destination. You may not understand how the engine
    or transmission works. You may not have a clue about the suspension or electrical
    systems. But, you have gauges that can alert you to your progress, and warnings
    when things require adjustment. Most of all, you have reason to enjoy the ride.'
