    由于已有整本介绍 SAS Enterprise Guide 基础的书籍，本书聚焦于典型营销分析所需的内容。若需一份出色的通用参考书，请参阅 Lora D.
    Delwiche 和 Susan J. Slaughter（2010）所著的*《SAS Enterprise Guide 小书》*。


    ## 探索性分析


    首先，导入包含客户数据的电子表格。


    ### 导入数据


    视你的系统和存储情况而定，你可能需要向 IT 部门寻求帮助以获取数据访问权限。在我们的示例中，DMR Publishing 的客户数据以 Microsoft
    Excel 电子表格的形式存储在 SASUSER 库中。如图 5.2 所示，点击 **文件 > 导入数据**。当输入数据窗口打开时，点击向上箭头浏览到存储电子表格
    DMR Customer Base 的文件夹。突出显示该电子表格并点击 **打开**。


    **图 5.2：将数据导入 SAS Enterprise Guide**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_77_0.png)


    将打开一个菜单，让你管理数据的导入。关于步骤 1 到 4，在此过程中你不需要指定任何内容，因此点击 **完成**。电子表格导入后，将打开一个显示该数据集的窗口。


    ### 查看数据


    数据看起来状态良好且含义清楚。请注意，大多数数据都需要进行一些清理。有关这一重要过程的信息，请参阅 Ron Cody（2008）所著的*《Cody 的 SAS
    数据清理技术》*。


    你将看到七个变量，其中少数几个需要定义：


    - CUSTOMER_ID 是唯一 ID 编号，可帮助公司跟踪客户。你在本分析中不会使用它。

    - CUSTOMER_SUBSCRIPTION_COUNT 是该客户当前持有的杂志和期刊订阅总数。

    - CUSTOMER_REVENUE 是去年的总收入。


    > **提示：** 数据导入后，你应保存项目。在顶部菜单栏上找到该图标。第一次保存时，将打开一个菜单，要求你选择位置并为项目命名。项目命名后，你可以随时点击该图标，项目将以同一名称保存。


    ### 探索数据


    在你满意地查看数据后，点击屏幕右上角的 X 关闭数据集。你可以随时通过右键单击或双击项目树和主工作区中显示的数据集图标来重新打开它。


    在创建报表之前，让我们看一个有用的 SAS Enterprise Guide 选项，它允许你将所有输出发送到富文本格式（RTF）文件。点击 **工具 ▶ 选项
    ▶ 结果**。当“结果”部分打开时，你有多个输出数据格式选项，如图 5.3 所示。默认格式是 **SAS 报表**。该默认设置可能已经足够，但如果你的计算机上安装了
    Microsoft Word，你可以点击靠近顶部的 RTF 旁边的复选框。此选项允许你以 Microsoft Word 格式共享文档，并采用适合大多数报表的所有默认设置。你还可以选择
    **PDF**、**HTML** 或 **文本输出**。你可以探索这些选择，看看哪种最适合你的项目。


    **图 5.3：结果的格式选项**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_79_0.png)


    要查看数据特征，你有多个选项。最快、最简单的方法是将光标放在工作区中的数据集上，然后选择 **任务 ▶ 描述 ▶ 表征数据**（图 5.4）。此任务旨在以有用的格式为你提供数据集中每个变量的完整概览。


    **图 5.4：SAS Enterprise Guide 中用于表征数据的任务菜单**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_79_1.png)


    当第一个菜单出现时，点击 **完成**。


    > **注意：** 如果你有一个水平数超过 30 的分类变量，例如*邮政编码*，Enterprise Guide 会将输出限制为出现最频繁的 30 个水平。此选项可以更改。


    过程完成后，你可以点击工作区顶部的选项卡查看输出。如果你的计算机上安装了 Microsoft Word，那么你可以点击 Microsoft Word 图标访问
    RTF 输出。它将在项目外部用 Microsoft Word 打开结果。


    输出 5.1 是频数表中分类变量输出的一个示例。输出 5.2 中显示的结果相当清楚：男性计数为 9,372，占样本的 59%；女性计数为 6,140，占样本的
    38%。文件中约 3% 的性别值为未知值（U）。


    **输出 5.1：性别的分类数据分析**


    | 变量 | 标签 | 值 | 频数 | 占总频数百分比 |

    |---|---|---|---:|---:|

    | GENDER |  | M | 9372 | 58.5055 |

    |  |  | F | 6140 | 38.3295 |

    |  |  | U | 507 | 3.1650 |


    输出 5.2 提供了连续或区间变量 AGE 的结果。


    **输出 5.2：年龄的区间或连续数据分析**


    | 变量 | 标签 | N | NMiss | 总计 | 最小值 | 均值 | 中位数 | 最大值 | StdMean |

    |---|---|---:|---:|---:|---:|---:|---:|---:|---:|

    | AGE |  | 16019 | 0 | 579193 | 18 | 36.16 | 34 | 92 | 0.10 |


    对于 AGE，可使用以下度量：


    - *N* 是客户数量。

    - *NMiss* 是年龄的缺失值数量。此处的值为零，因为我们的数据集中缺失值用值 ‘U’ 表示。

    - *总计* 等于年龄求和后的值。它在我们的分析中没有意义。

    - *最小值* 和 *最大值* 分别是最低值和最高值。

    - *均值* 等于数学平均值或算术平均值（已剔除缺失值）。

    - *中位数* 是按年龄排序后位于文件 50% 处的客户年龄；它是将观测值按顺序排列时的中间数值。

    - *StdMean* 等于均值的标准误。


    输出 5.3 中的图显示了客户群按年龄的一般分布。你可以看到，大多数客户较年轻，主要集中在 21 至 40 岁之间。此外，似乎还有一些离群值或极端值，由少数年龄超过
    90 岁的客户代表。离群值可能会给某些类型的分析带来问题，尤其是回归模型。


    **输出 5.3：公司客户群按年龄的一般分布**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_81_0.png)


    ## 细分与画像分析


    下一步是按 CUSTOMER_REVENUE 划分客户群，以比较收入最高的客户与其余客户的特征。


    突出显示 DMR Customer Base 数据集，并选择 **任务 ▶ 描述 ▶ 分布分析**。将打开一个窗口，你可以在其中选择变量。点击 CUSTOMER_REVENUE
    并将其移到“分析变量”下方的区域（图 5.5）。在左侧列中，选择 **表**。勾选 **分位数** 旁边的复选框。点击 **运行**。


    **图 5.5：为客户收入分布分析选择变量**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_82_0.png)


    输出 5.4 截取自 RTF 输出，显示了 CUSTOMER_REVENUE 分布的分位数。公司用来理解收入驱动因素的一种标准方法是，根据收入将收入最高的
    25% 客户的特征与其余 75% 客户进行比较。根据第 75 百分位数处的 Q3 值，任何收入超过 $100 的人都属于收入最高的 25%。


    **输出 5.4：基于客户的收入分布的分位数**


    分位数（定义 5）


    | 水平 | 分位数 |

    |---|---|

    | 100% 最大值 | 1040 |

    | 99% | 260 |

    | 95% | 180 |

    | 90% | 140 |

    | 75% Q3 | 100 |

    | 50% 中位数 | 60 |

    | 25% Q1 | 30 |

    | 10% | 15 |

    | 5% | 15 |

    | 1% | 15 |

    | 0% 最小值 | 15 |


    接下来，你将创建一个二值变量，以便在分析时将文件划分为收入最高的 25% 和其余 75%。


    要创建新变量，请使用查询生成器中的高级表达式功能。右键单击 DMR Customer Base 数据集，然后选择查询生成器（图 5.6）。将光标放在数据集名称
    t1（左侧列中的 DMR_CUSTOMER_BASE）上，并将其连同所有变量一起拖到右侧“选择数据”下方。

