    ![](img/976d9b992e82c4ac7d195d03a30b4915_54_0.png)


    营销中常用的一种特定类型的神经网络使用 Sigmoid 函数来拟合每个节点。请记住，Sigmoid 函数与逻辑回归中使用的函数相同。您可以将这种类型的神经网络视为一系列“嵌套”的逻辑回归。这种技术在拟合二元或两级结果时非常有效，例如对优惠的响应或贷款违约。


    神经网络的一个优点是其能够捕捉数据中的非线性关系。这种捕捉非线性关系的能力使用户能够拟合一些使用回归难以拟合的数据类型。然而，一个缺点是其倾向于过拟合数据。过拟合会导致模型在应用于新数据时更快地恶化。如果这是您选择的方法，请务必仔细验证您的数据。另一个需要考虑的缺点是，神经网络的结果通常难以解释。


    ## 建模过程


    建模过程有四个主要阶段：


    - 1. 定义目标。

    - 2. 开发模型。

    - 3. 实施模型。

    - 4. 跟踪和监控模型。


    ### 定义目标


    定义目标是第 1 章的主要主题，因为它是模型构建过程中最重要的一步。您可以使用完美的数据开发出完美的模型。但如果它不能满足您的业务目标，那就是浪费时间和金钱。确保模型的<|message|>
    目标与您的整体业务目标保持一致。


    ### 开发模型


    模型开发过程包括五个步骤。


    - 1. 选择数据。

    - 2. 探索数据。

    - 3. 修改数据和变量。

    - 4. 构建模型。

    - 5. 评估模型。


    如果您遵循此顺序，您在模型构建工作方面很可能会取得成功。


    ### 步骤 1：选择数据


    一旦您定义了目标，您就需要获取用于开发模型的数据。确保它与构建模型的业务目的相关。数据可以来自各种来源。在某些情况下，需要合并数据。数据选择的特定细节高度特定于项目。要了解有关数据构建的许多来源，请参阅第
    4 章。


    ### 步骤 2：探索数据


    一旦您的数据可用于分析，您就可以使用可视化工具查看数据的分布和完整性。多个表格和图表可以显示数据值并向您展示数据不完整或缺失的位置。


    ### 步骤 3：修改数据和变量


    在此步骤中，您可以将数据划分为训练、测试和验证数据集。基于您在数据探索步骤中的发现，您可以插补缺失值并过滤异常值。


    为了确保回归和神经网络模型的最佳拟合，您可能希望转换或分段连续变量。要在回归或神经网络模型中使用类别变量，您需要将其设为数值。最好的方法是对任何具有字符或非数值值的变量创建指示变量。有关此技术的示例，请参阅第
    9 章。


    对于连续变量，您可以选择某些转换以提供模型的更好拟合。SAS Enterprise Miner 允许您让软件选择最佳转换，如第 9 章所示。有关变量转换的更多详细信息，请参阅
    *数据挖掘食谱*（Parr-Rud 2001，85–97）。


    ### 步骤 4：构建模型


    在 SAS Enterprise Miner 中，构建模型的过程大大简化。但仍然很好地了解底层过程，以便您做好准备以发现异常和错误。


    ### 选择方法


    本章前面，您了解了三种建模技术：决策树、回归和神经网络。这些技术在确定选择方法时各有独特的考虑因素。


    对于决策树模型，变量被划分为离散组；因此，您无需进行变量转换或定义选择过程。如果您希望选择要进入模型的变量，可以交互式地构建树。有关交互式构建树的详细信息，请参阅
    *使用 SAS Enterprise Miner 进行分析的决策树*（DeVille 和 Neville 2013）。


    变量选择的顺序可能会影响模型的最终结果。存在许多选择方法。每种方法都有其优点和缺点。根据您特定的业务问题或资源情况，一种方法可能比另一种更受欢迎。


    有关回归选择选项的更多详细信息，请参阅 *数据挖掘食谱*（Parr-Rud 2001，104–105）。


    ### 最优变量数


    与模型构建过程相关的常见问题是，最优的变量数是多少？


    答案取决于情况。大多数预测良好的模型有 7 到 15 个变量。在某些情况下，使用每个变量可能是最优的。虽然模型可能很大且难以解释，但额外的变量不会削弱模型的功效或拟合度。在某些分析资源稀缺而
    CPU 能力充足的企业中，使用每个变量通常是最好的选择。

