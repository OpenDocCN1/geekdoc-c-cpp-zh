  md: "\nWhen descriptive analysis is the first step in a bigger project, you might\
    \ want to discuss your preliminary findings with your client or stakeholders.\
    \ They may have knowledge about or insights into market trends, potential data\
    \ issues, and correlations that can be useful for you to incorporate in your analysis.\n\
    \n## Chapter 6: Market Analysis Using SAS Enterprise Guide\n\n- Introduction ......\
    \ 79\n- Project Overview ...... 79\n- Market Analysis ...... 80\n  - Project Initiation\
    \ ...... 80\n  - Data Preparation ...... 80\n  - Penetration and Share of Wallet\
    \ ...... 89\n  - Results ...... 90\n- Notes from the Field ...... 91\n\n### Introduction\n\
    \nChapters 1 through 5 focused on general knowledge and techniques that laid the\
    \ foundation for many types of data analysis. In this chapter, you will explore\
    \ a more specific topic: competitive analysis.\n\nWhen your company sets its strategy,\
    \ the first questions to answer are as follows:\n\n- What are the strengths and\
    \ weaknesses of our primary competitors as compared to us?\n- What is our market\
    \ share and how can we increase it?\n\nFor most industries, data sources are available\
    \ that allow companies to determine their market share, or “share of wallet,”\
    \ within certain segments of the population. This analysis is valuable for setting\
    \ marketing strategies, guiding research and development, and informing finance\
    \ and budget allocations.\n\n### Project Overview\n\nThe leadership team at DMR\
    \ Publishing Company is interested in understanding the drivers of revenue within\
    \ its business. It has gathered U.S. customer data for the past year that consists\
    \ of revenues, numbers of publications, and three demographic variables. For this\
    \ analysis, you will use SAS Enterprise Guide.\n\nThe project has eight steps:\n\
    \n- 1. Initiate the project in SAS Enterprise Guide 6.1.\n- 2. Import and view\
    \ market data.\n- 3. Add the DMR Publishing customer SAS data set to the project.\n\
    - 4. Use the query tool to build a new age group variable.\n- 5. Summarize the\
    \ DMR Publishing customer data to a gender and age group level.\n- 6. Merge customer\
    \ and market data.\n- 7. Summarize the merged data to age group level.\n- 8. Perform\
    \ penetration and a \"share of wallet\" analysis.\n\n### Market Analysis\n\nSo\
    \ far in this analysis, our main interest has been to describe the characteristics\
    \ of the customer base. If possible, it can be useful to compare characteristics\
    \ of the customer database with the same characteristics in the overall market.\
    \ This comparison enables a penetration analysis and share of wallet analysis\
    \ as defined in Chapter 1.\n\nWe have purchased a data set from General List Company\
    \ that shows the annual revenues and number of subscriptions for the entire publishing\
    \ market within the United States, segmented by gender and age group. Our goal\
    \ is to compare performance within gender and age group between the DMR Publishing’s\
    \ customer data and the total market data purchased from General List Company.\n\
    \n### Project Initiation\n\nSimilar to the process in Chapter 5, the first step\
    \ is to open the project. Double-click the SAS Enterprise Guide icon. Select New\
    \ Project.\n\n### Data Preparation\n\nYour first step is to prepare the data.\n\
    \n### Import Data\n\nTo access the data, go to File ▶ Import and choose the Publishing\
    \ Market data set. When the first window opens, click Finish. Notice that the\
    \ data is already summarized as shown in Output 6.1.\n\nClick the plus sign to\
    \ the left of **Servers**. Continue to expand until you reach the **SASUSER library**\
    \ as shown in Figure 6.2.\n\n**Figure 6.2: Expand Library to Locate DMR Publishing\
    \ Customer Data**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_94_0.png)\n\nRight-click\
    \ the DMR_CUSTOMER_BASE data and select **Open**. The data has now been added\
    \ to the project and is visible in the Project Tree. You are ready to create the\
    \ Age Group variable in the DMR Publishing customer data.\n\n### Build Age Group\
    \ Variable\n\nRight-click the DMR Customer data set and select **Query Builder**\
    \ as shown in Figure 6.3. Drag four variables from the left over to the right\
    \ column: GENDER, CUSTOMER_ID, CUSTOMER_SUBSCRIPTION_COUNT, and CUSTOMER_REVENUE.\n\
    \n**Figure 6.3: Query to Build Age Group on DMR Publishing Customer Data**\n\n\
    ![](img/976d9b992e82c4ac7d195d03a30b4915_94_1.png)\n\nNext, click **Computed Columns**\
    \ ▶ **New** ▶ **Advanced Expression** ▶ **Next** (Figure 6.4).\n\n**Figure 6.4:\
    \ Expression Builder to Create Age Group Variable**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_95_0.png)\n\
    \nThe window has a space to enter an expression. Program 6.1 displays the syntax\
    \ for building the variable in the Query Builder; copy it into the box under **Enter\
    \ an expression.**\n\n**Program 6.1: Expression Builder to Create Age Group Variable**\n\
    \n```\nCase when AGE le 21 then \"18-21 Years Old\"\n     when 22 le AGE le 25\
    \ then \"22-25 Years Old\"\n     when 26 le AGE le 30 then \"26-30 Years Old\"\
    \n     when 31 le AGE le 40 then \"31-40 Years Old\"\n     when 41 le AGE le 50\
    \ then \"41-50 Years Old\"\n     when 51 le AGE then \"51+ Years Old\"\nend\n\
    ```\n\nClick **Next**. In the next window’s field, type AGE_GROUP in the top box\
    \ next to **Column Name**. Click **Finish** ▶ **Close**.\n\n### Sum Performance\
    \ Variables\n\nThe next step is to sum the performance variables CUSTOMER_ID,\
    \ CUSTOMER_REVENUE, and CUSTOMER_SUBSCRIPTION_COUNT (Figure 6.5). Within the same\
    \ query, on the right-hand side, pull your cursor next to CUSTOMER_ID under the\
    \ Summary column. An arrow will appear. Scroll down and select COUNT DISTINCT.\
    \ For easier viewing, you can adjust the column widths with your cursor. Next,\
    \ right-click the space next to CUSTOMER_REVENUE and CUSTOMER_SUBSCRIPTION_COUNT\
    \ and select SUM. You'll notice that a Summary groups pane appears at the bottom\
    \ right section of the window. The software guesses GENDER and CALCULATED AGE_GROUP,\
    \ which is correct. Click Run.\n\n**Figure 6.5: Sum Performance Variables across\
    \ Gender and Age Group**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_96_0.png)\n\
    \nIn Output 6.2, the data set appears to be summarized correctly. The new summary\
    \ variables have the prefix SUM_. We will use these variables in the penetration\
    \ and wallet analyses.\n\n**Output 6.2: Summarized DMR Publishing Customer Data**\n\
    \n![](img/976d9b992e82c4ac7d195d03a30b4915_96_1.png)\n\nYou are also going to\
    \ match on AGE_GROUP. Right-click on AGE_GROUP in the first data set (t1). Follow\
    \ the prompt to match to AGE_GROUP in the second data set (t2).\n\nNext, a window\
    \ will appear, and a prompt will ask you what kind of join you want to select\
    \ (Figure 6.8). As directed in the first join using GENDER, you want to match\
    \ the records in the DMR Publishing customer data that finds a match in the Publishing\
    \ Market data; therefore, select **All rows from the right table given the condition\
    \ (Right Join)**. Also, notice just below the circles that asks if you want t2.AGE_GROUP\
    \ to equal (=) t1.AGE_GROUP. The default is correct. Click **Close**.\n\n**Figure\
    \ 6.8: Merge of DMR Customer and Market Data Sets**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_98_0.png)\n\
    \nYou will be back in the main screen of the query builder. From the left column,\
    \ drag the following variables from the (t2) PUBLISHING_MARKET to the right side\
    \ under Column Name: SUBSCRIBERS, REVENUE, SUBSCRIPTIONS (Figure 6.9).\n\n**Figure\
    \ 6.9: Add Variables from Publishing Market Data**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_98_1.png)\n\
    \nBefore you run a query, you can change the column names (Figure 6.10).\n\n**Figure\
    \ 6.10: Rename Three Columns to Business-Related Names**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_99_0.png)\n\
    \nDouble-click under **Column Name** on the right, where COUNT DISTINCT appears.\
    \ When the window opens, type in a new name, such as **CUSTOMERS**. Click **OK**.\
    \ Repeat the process for the two other summary columns. Suggested names are **CUSTOMER_SUBS**\
    \ and **CUSTOMER_REVENUE**. Now, click **Run**.\n\nThe merged data shows a perfect\
    \ match between the customer data and the market data. Notice that it is at the\
    \ **GENDER-by-AGE_GROUP** level.\n\n**Output 6.3: Merged Data at Gender and Age\
    \ Group Level**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_99_1.png)\n\nFor your\
    \ current analysis, you want to look at penetration and share of wallet by age\
    \ group. So, you will summarize the data one more time. Return to the **Process\
    \ Flow** and right-click the merged data and select **Query Builder**.\n"
  mdcn: "\n当描述性分析是更大项目中的第一步时，你可能希望与客户或利益相关者讨论初步发现。他们可能了解市场趋势、潜在数据问题及相关性，或对此有见解，这些信息可能有助于你将其纳入分析。\n\
    \n## 第6章：使用 SAS Enterprise Guide 进行市场分析\n\n- 引言 ...... 79\n- 项目概述 ...... 79\n\
    - 市场分析 ...... 80\n  - 项目启动 ...... 80\n  - 数据准备 ...... 80\n  - 渗透率与钱包份额 ......\
    \ 89\n  - 结果 ...... 90\n- 现场笔记 ...... 91\n\n### 引言\n\n第1章至第5章侧重于通用知识与技术，为多种类型的数据分析奠定了基础。在本章中，你将探讨一个更具体的主题：竞争分析。\n\
    \n当你的公司制定战略时，首先需要回答以下问题：\n\n- 与我们相比，主要竞争对手的优势和劣势是什么？\n- 我们的市场份额是多少，如何提高？\n\n对大多数行业而言，现有数据源使公司能够确定其在特定人群细分中的市场份额，即“钱包份额”。这种分析对于制定营销策略、指导研发以及为财务和预算分配提供依据很有价值。\n\
    \n### 项目概述\n\nDMR Publishing Company 的领导团队希望了解其业务收入的驱动因素。公司收集了过去一年的美国客户数据，包括收入、出版物数量以及三个人口统计变量。在本分析中，你将使用\
    \ SAS Enterprise Guide。\n\n该项目包括八个步骤：\n\n- 1. 在 SAS Enterprise Guide 6.1 中启动项目。\n\
    - 2. 导入并查看市场数据。\n- 3. 将 DMR Publishing 客户 SAS 数据集添加到项目中。\n- 4. 使用查询工具构建新的年龄组变量。\n\
    - 5. 将 DMR Publishing 客户数据汇总到性别和年龄组级别。\n- 6. 合并客户数据和市场数据。\n- 7. 将合并后的数据汇总到年龄组级别。\n\
    - 8. 执行渗透率和“钱包份额”分析。\n\n### 市场分析\n\n到目前为止，在本分析中，我们的主要关注点是描述客户群的特征。如果可能，将客户数据库的特征与整体市场中的相同特征进行比较会很有用。这种比较可以支持第1章所定义的渗透率分析和钱包份额分析。\n\
    \n我们从 General List Company 购买了一个数据集，其中显示了美国整个出版市场的年度收入和订阅数量，并按性别和年龄组细分。我们的目标是比较\
    \ DMR Publishing 客户数据与从 General List Company 购买的整体市场数据在性别和年龄组层面的表现。\n\n### 项目启动\n\
    \n与第5章中的过程类似，第一步是打开项目。双击 SAS Enterprise Guide 图标。选择“新建项目”。\n\n### 数据准备\n\n你的第一步是准备数据。\n\
    \n### 导入数据\n\n要访问数据，请转到“文件 ▶ 导入”，并选择 Publishing Market 数据集。第一个窗口打开后，单击“完成”。请注意，数据已经汇总，如输出\
    \ 6.1 所示。\n\n单击 **服务器** 左侧的加号。继续展开，直到到达 **SASUSER 库**，如图 6.2 所示。\n\n**图 6.2：展开库以定位\
    \ DMR Publishing 客户数据**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_94_0.png)\n\
    \n右键单击 DMR_CUSTOMER_BASE 数据，并选择 **打开**。该数据现已添加到项目中，并可在项目树中看到。你现在可以在 DMR Publishing\
    \ 客户数据中创建 Age Group 变量。\n\n### 构建年龄组变量\n\n右键单击 DMR Customer 数据集，并选择 **查询构建器**，如图\
    \ 6.3 所示。将左侧的四个变量拖到右侧列中：GENDER、CUSTOMER_ID、CUSTOMER_SUBSCRIPTION_COUNT 和 CUSTOMER_REVENUE。\n\
    \n**图 6.3：在 DMR Publishing 客户数据上构建年龄组的查询**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_94_1.png)\n\
    \n接下来，单击 **计算列** ▶ **新建** ▶ **高级表达式** ▶ **下一步**（图 6.4）。\n\n**图 6.4：用于创建年龄组变量的表达式构建器**\n\
    \n![](img/976d9b992e82c4ac7d195d03a30b4915_95_0.png)\n\n该窗口有一个用于输入表达式的区域。程序 6.1\
    \ 显示了在查询构建器中构建该变量的语法；将其复制到 **输入表达式** 下的框中。\n\n**程序 6.1：用于创建年龄组变量的表达式构建器**\n\n\
    ```\nCase when AGE le 21 then \"18-21 Years Old\"\n     when 22 le AGE le 25 then\
    \ \"22-25 Years Old\"\n     when 26 le AGE le 30 then \"26-30 Years Old\"\n  \
    \   when 31 le AGE le 40 then \"31-40 Years Old\"\n     when 41 le AGE le 50 then\
    \ \"41-50 Years Old\"\n     when 51 le AGE then \"51+ Years Old\"\nend\n```\n\n\
    单击 **下一步**。在下一个窗口的字段中，在 **列名** 旁边的顶部框中输入 AGE_GROUP。单击 **完成** ▶ **关闭**。\n\n###\
    \ 汇总绩效变量\n\n下一步是汇总绩效变量 CUSTOMER_ID、CUSTOMER_REVENUE 和 CUSTOMER_SUBSCRIPTION_COUNT（图\
    \ 6.5）。在同一查询中，在右侧，将光标移到 Summary 列下的 CUSTOMER_ID 旁边。会出现一个箭头。向下滚动并选择 COUNT DISTINCT。为便于查看，你可以用光标调整列宽。接下来，右键单击\
    \ CUSTOMER_REVENUE 和 CUSTOMER_SUBSCRIPTION_COUNT 旁边的空白处，并选择 SUM。你会注意到窗口右下方出现一个\
    \ Summary groups 窗格。软件推测为 GENDER 和 CALCULATED AGE_GROUP，这是正确的。单击“运行”。\n\n**图 6.5：按性别和年龄组汇总绩效变量**\n\
    \n![](img/976d9b992e82c4ac7d195d03a30b4915_96_0.png)\n\n在输出 6.2 中，数据集似乎已正确汇总。新的汇总变量带有前缀\
    \ SUM_。我们将在渗透率和钱包分析中使用这些变量。\n\n**输出 6.2：汇总后的 DMR Publishing 客户数据**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_96_1.png)\n\
    \n你还将按 AGE_GROUP 进行匹配。右键单击第一个数据集（t1）中的 AGE_GROUP。按照提示将其与第二个数据集（t2）中的 AGE_GROUP\
    \ 匹配。\n\n接下来，将出现一个窗口，提示会询问你要选择哪种连接（图 6.8）。按照使用 GENDER 的第一次连接中的指示，你希望匹配 DMR Publishing\
    \ 客户数据中能在 Publishing Market 数据中找到匹配的记录；因此，选择 **在给定条件下右表中的所有行（右连接）**。另外，请注意圆圈下方询问是否希望\
    \ t2.AGE_GROUP 等于（=）t1.AGE_GROUP。默认设置是正确的。单击 **关闭**。\n\n**图 6.8：DMR 客户数据集与市场数据集的合并**\n\
    \n![](img/976d9b992e82c4ac7d195d03a30b4915_98_0.png)\n\n你将回到查询构建器的主界面。从左侧列中，将以下变量从\
    \ (t2) PUBLISHING_MARKET 拖到右侧的列名下：SUBSCRIBERS、REVENUE、SUBSCRIPTIONS（图 6.9）。\n\n\
    **图 6.9：从 Publishing Market 数据中添加变量**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_98_1.png)\n\
    \n在运行查询之前，你可以更改列名（图 6.10）。\n\n**图 6.10：将三个列重命名为与业务相关的名称**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_99_0.png)\n\
    \n双击右侧 **列名** 下出现 COUNT DISTINCT 的位置。窗口打开后，输入新名称，例如 **CUSTOMERS**。单击 **确定**。对另外两个汇总列重复此过程。建议名称为\
    \ **CUSTOMER_SUBS** 和 **CUSTOMER_REVENUE**。现在，单击 **运行**。\n\n合并后的数据显示客户数据与市场数据完全匹配。请注意，它处于\
    \ **GENDER-by-AGE_GROUP** 级别。\n\n**输出 6.3：按性别和年龄组级别合并的数据**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_99_1.png)\n\
    \n对于当前分析，你希望按年龄组查看渗透率和钱包份额。因此，你将再次汇总数据。返回 **流程**，右键单击合并后的数据，并选择 **查询构建器**。\n\n"
