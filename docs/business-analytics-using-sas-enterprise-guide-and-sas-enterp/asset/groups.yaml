  mdcn: "\n- **细分规模**——左下象限以饼图直观显示每个聚类的大小。要查看每个聚类中的客户数量，请将光标悬停在饼图的每个扇区上。\n\n由于下一步是构建细分画像，因此这四个象限中最值得关注的是左下象限中显示的聚类数量。饼图显示总共有五个聚类。在构建细分画像时，四到八个聚类是比较合适的数量。\n\
    \n### 输出 7.2：查看聚类结果\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_118_0.png)\n\n\
    ![](img/976d9b992e82c4ac7d195d03a30b4915_118_1.png)\n\n查看完聚类结果后，关闭“结果”窗口并返回图。\n\
    \n### 构建细分画像\n\n在图上方的菜单中，依次单击 **评估** 和 **细分画像**。将“细分画像”图标拖入图中，并用箭头连接（图 7.17）。\n\
    \n### 图 7.17：添加细分画像流程\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_119_0.png)\n\
    \n右键单击并选择 **运行**。出现结果窗口后，单击 **结果**。\n\n初始的“结果”窗口显示四个象限。请重点关注右上象限，它显示每个细分的画像。将右上象限最大化以便更仔细地查看，如输出\
    \ 7.3 中部分所示。\n\n### 输出 7.3：查看细分画像结果\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_119_1.png)\n\
    \n将右上象限最大化以便更仔细地查看，如输出 7.4 所示。\n\n此输出显示每个细分中客户的特征。各细分按规模大小排列。客户数量最多的细分列在最前。客户数量最少的细分列在最后：\n\
    \n细分 4 有 4,885 名客户。AGE_LOG 是最强的预测变量。实心条表示该细分内的分布。深红色轮廓表示总体人群。因此，这个聚类\n\n### 分析聚类并推荐营销或产品开发行动\n\
    \n这组结果告诉 DMR Publishing，它可以针对不同年龄群体聚焦营销和产品开发，同时考虑忠诚度（作为客户的年数）、性别和家庭收入。\n\n由于细分\
    \ 4 规模最大，因此它是分析的重点。不过，有一点需要注意：细分 4 与第三大细分（细分 1）很相似。两者都拥有忠诚客户（基于作为客户的年数），这些客户年龄高于平均水平，收入略高于平均水平。主要区别在于性别。细分\
    \ 4 和细分 1 合计占 DMR Publishing 客户群的 50%。因此，您可能需要考虑一种两层方法：\n\n- 考虑针对特定性别出版物（如男性健康或女性时尚杂志）采取单独的营销行动或产品开发。或者，您的做法也可以很简单，例如针对每种性别使用不同的杂志封面或广告。\n\
    - 考虑将这两个细分合并，用于非特定性别的出版物，例如烹饪和旅行杂志或商业期刊。\n\n细分 5 是第二大聚类，提供了另一个机会。这个群体全部为男性、年龄低于平均水平，是吸引该人群的出版物的主要受众。如果\
    \ DMR Publishing 尚未提供一些体育或科技杂志，您可以建议他们将这些杂志加入出版物列表。\n\n### 来自一线的笔记\n\n细分画像用于描述聚类并使其可操作。正如您所见，所揭示的模式和由此产生的洞察可以指导创意营销决策以及产品或服务开发。一旦基于现有数据了解了客户，就可以考虑购买额外数据来丰富聚类、增强分析并扩大客户群。如第\
    \ 2 章所述，有许多优质的外部数据来源。您可以购买兴趣爱好、购买模式以及社交或在线行为等特征，并将其附加到现有客户群中。客户数据丰富后，您可以重新运行聚类细分，并完善营销和产品开发策略。\n\
    \n在与利益相关者和最终用户分享结果或提出战略举措时，请从他们的业务目标出发进行表述，并将您的建议与公司的战略目标联系起来。\n\n## 第 8 章：使用\
    \ SAS Enterprise Miner 进行树分析\n\n- 引言 ........................................................\
    \ 111\n- 项目概述 .................................................... 111\n- 决策树分析\
    \ .............................................. 112\n  - 启动项目 .............................................\
    \ 112\n  - 输入数据源 ........................................... 114\n  - 创建目标变量 ..........................................\
    \ 115\n  - 划分数据 .............................................. 117\n  - 构建决策树\
    \ ......................................... 118\n  - 查看决策树输出 ...................................\
    \ 120\n  - 解释发现 .......................................... 126\n  - 树分析的其他用途 ................................\
    \ 128\n- 来自一线的笔记 ................................................ 128\n\n### 引言\n\
    \n在前面的几章中，我们重点了解了 DMR Publishing 的客户。理解客户始终是任何全面分析的良好第一步。在本章中，您将学习如何从过去行为和特征的组合中发现并度量模式，以预测未来行为。您在此过程中使用的主要技术是树分析。树分析的好处之一是，它除了是一种强大的预测技术外，还具有很强的描述性成分。树分析的描述性结果易于解释，这使该技术深受业务分析师和营销人员的青睐。\n\
    \n### 项目概述\n\nDMR Publishing Company 的领导团队希望了解订阅不止一种杂志或期刊的客户与仅订阅一种的客户相比具有哪些特征。在本分析中，您将使用\
    \ SAS Enterprise Miner。\n\n本项目有十个步骤：\n\n- 1. 在 SAS Enterprise Miner 13.1 中启动项目。\n\
    - 2. 输入数据源。\n- 3. 定义变量角色。\n- 4. 定义目标变量。\n- 5. 划分数据。\n- 6. 设置树属性。\n- 7. 构建决策树。\n\
    - 8. 调整图形属性。\n- 9. 解释您的发现。\n- 10. 显示节点规则。\n\n### 决策树分析\n\n决策树技术旨在根据一系列简单规则对数据进行细分。有关该过程的完整文档，请访问\
    \ SAS Enterprise Miner 的 **帮助** 部分。打开项目后，转到 **帮助 ▸ 目录**。窗口打开后，查找 **节点参考 ▸ 模型 ▸\
    \ 决策树节点**。\n\n### 启动项目\n\n要打开 SAS Enterprise Miner (EM)，请单击桌面或“开始”菜单中的节点。您的第一个选择是打开现有项目或创建新项目。突出显示并单击\
    \ **新建项目**（图 8.1）。\n\n### 图 8.1：初始化 SAS Enterprise Miner\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_125_0.png)\n\
    \n将打开一个窗口，要求您为项目命名并选择 SAS 服务器目录（图 8.2）。根据您的设置，它可能需要额外连接。如果是这样，请联系您的 IT 部门。否则，请单击“浏览”，然后选择您希望保存项目文件的文件夹。\n\
    \n### 图 8.2：创建并命名新项目\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_125_1.png)\n\n\
    完成后，单击 **下一步 ▶**，您将看到一个显示您所做选择的窗口。单击 **完成**。现在您已进入 EM 工作区，如图 8.3 所示。\n"
