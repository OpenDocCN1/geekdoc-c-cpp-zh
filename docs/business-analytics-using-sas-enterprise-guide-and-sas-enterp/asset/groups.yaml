    # ## Introduction


    Data is being created at an increasingly exponential rate. It’s no wonder that,
    in today’s high-tech, interconnected global economy, data is a foundational asset
    for all Fortune 500 organizations, as well as an increasing number of smaller
    companies.


    In this chapter, you will learn about the different types and sources of data
    available for modeling and analysis. This data is the basis of your analysis.
    In the end, your final deliverable, anything from a simple report to an advanced
    model algorithm, is only as good as your data.


    The chapter begins with a brief historical perspective on the evolution of big
    data collection and usage in business. This foundational knowledge not only gives
    you what you need to begin building a base for modeling and analysis, but will
    also teach patterns of data creation and usage that will enable you to be on the
    lookout for new types and sources of data.'
