    the amount of expected sales is $866.59 plus 7.81 times the amount spent on advertising.
    A key measure of the strength of the relationship is the R². It measures the amount
    of the overall variation in the data that is explained by the model. This particular
    regression analysis results in an R² of 70%, meaning that 70% of the variation
    in *Sales Revenue* is explained by the variation in *Advertising Expenditure*
    in the regression model.


    *Multiple linear regression* uses two or more independent, or predictive, variables
    to predict a continuous outcome variable. In Figure 3.7, *credit card balances*
    are a function of *payment amount* and *customer age*.


    **Figure 3.7: Example of Multiple Linear Regression of Credit Card Balance on
    Payment Amount and Customer Age**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_51_0.png)


    The equation *credit card balances* = 2.1774 + 9.4966 × *payment amount* + 1.2494
    × *customer age* illustrates the predicted amount of credit card balances based
    on the customer’s age and regular payment amount.


    ### Logistic Regression


    *Logistic regression* resembles linear regression. The key difference is that
    the dependent variable is not continuous; it is discrete, or categorical. The
    discrete nature of the dependent variable makes it particularly useful in marketing
    because marketers often try to predict a discrete action, such as a response to
    an offer or a default on a loan.


    Technically, logistic regression can be used to predict outcomes for two or more
    levels. When you build targeting models for marketing, however, the outcome is
    often bi-level. In these models, you predict the probability of one of these levels,
    and that probability must be from 0 to 1. A linear function of the predictor variables,
    however, is anywhere from negative infinity to positive infinity. Because logistic
    regression is a linear function of the predictor variables, a logit transformation
    is used to account for the difference between the two scales.


    The goal in this section is to avoid heavy statistical jargon, but because logistic
    regression is a popular and powerful method for predictive analysis, an overview
    of the method is included. Remember that logistic regression resembles linear
    regression in the actual model processing.

    '
