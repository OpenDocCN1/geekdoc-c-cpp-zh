    # Figure 9.8: MultiPlot Properties Window


    ![](img/976d9b992e82c4ac7d195d03a30b4915_149_0.png)


    Right-click the icon and click Run ▶ Yes. When the run completes, click Results.
    The window opens with two sections. Expand the top panel to see the bar charts.


    This process creates a frequency bar chart for each independent variable by LOAN_DEFAULT.
    The bar chart for tot_bal_open_accts by LOAN_DEFAULT is shown in Output 9.4. The
    menu at the bottom of the chart enables you to look at the relationship between
    all the independent variables and LOAN_DEFAULT. Click the center arrow to start
    a slide show of the different frequencies. Or, use the right and left arrows to
    view at your own pace.


    # Output 9.4: MultiPlot Total Balance on Open Accounts by Loan Default—Bar Chart


    ![](img/976d9b992e82c4ac7d195d03a30b4915_149_1.png)'
  - '[PAGE 150]


    These graphs offer a quick view of the distribution of each independent variable
    in relation to LOAN_DEFAULT. The variable is also highly skewed to the right.
    In subsequent steps, you will scrub the tot_bal_open_Accounts variable for outliers
    and transform it to make it more normally distributed.


    # Modify


    This section illustrates how to prepare the data for modeling. You will impute
    values to replace missing values, partition the data, filter outliers, and transform
    the independent variables.


    # Replace Missing Values via Imputation


    The next step is to impute values for missing or incorrect observations. Recall
    that the StatExplore window revealed that the Marital Status and Income variables
    have missing values.


    Begin by clicking **Modify** and dragging the **Impute** icon onto the diagram,
    as shown in Figure 9.9.


    **Figure 9.9: Impute Missing Values**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_150_0.png)


    The Property window is populated with default methods for imputing missing values.
    The class variables are replaced with the value that has the highest count. The
    highest count value is used as a replacement for Marital Status. Recall that Gender
    has a value U for *unknown*. You can leave this value as is: Sometimes the fact
    that the Gender is unknown is predictive. If it were missing, it would be set
    to M because of a higher count of customers with Gender = M.


    For interval variables, the default method is to replace missing values with the
    mean value. Because your number of missing values is small, this default is adequate.
    If it were a larger percentage, then using a more advanced method, such as tree,
    might be better. To learn more about the Tree Imputation Method, see Contents
    in the Help section of Enterprise Miner.


    Right-click on the **Impute** icon and click **Run ▶ Yes**. When complete, click
    **Results**. Output 9.5 shows a partial view of the number of imputed values as
    well as the value used to replace the missing values.'
  - '[PAGE 151]


    # Output 9.5: Impute Missing Value Results


    | Variable Name | Impute Method | Imputed Variable | Impute Value |

    |---|---|---|---|

    | income | MEAN | IMP_income | 21034.032368 |

    | marital_status | COUNT | IMP_marital_status | M |


    # Partition Data into Subsamples


    The next step is to partition the data into three subsamples: Train, Validate,
    and Test. In your diagram, click the **Sample** tab, drag the **Partition** icon
    onto the diagram, and connect it to the **Impute** icon as shown in Figure 9.10.


    # Figure 9.10: Partition Data


    ![](img/976d9b992e82c4ac7d195d03a30b4915_151_0.png)


    For every modeling technique, the **Train** data is the base data set used to
    build several interim models and a final model during the model building process.
    The **Validation** data is used to fine tune each model and avoid overfitting
    during the decision tree, neural network, and stepwise regression model building
    processes. The **Test** data is used to evaluate the final model on unbiased data
    not used in the model building process. The final model is the one with the best
    fit based on your preselected criteria.


    You will build three models, one each of decision tree, neural network, and stepwise
    regression. These will be evaluated individually and also compared using the **Model
    Comparison** node.


    Notice in the Property window at the left that the partitioning method, under
    **Train**, is set to **Default**. The choices are **Simple, Random, Cluster,**
    and **Stratified**. You want to use the **Stratified** method, and because you
    have a binary target variable, the default is **Stratified**. So, you don’t need
    to make any change here. If you do change it to **Stratified**, the result will
    be the same.'
  - '[PAGE 152]


    Notice the default percentages in the **Property** window. Under **Data Set Allocations**,
    the default settings assign 40% to training, 30% to validation, and 30% to test.
    These defaults can be changed as long as the total equals 100%. Right-click on
    the Data Partition process and click **Run** ▶ **Yes**. You can view the results
    to see that the percentage of the dependent variable is close in each of the three
    sample data sets.


    # Manage Outliers


    As described in Chapter 5, outliers are data points that are unusually large or
    small when compared to the rest of the values for a certain variable. While there
    is no precise rule to identify an outlier, you can look for values that are more
    than 3, 4, or 5 standard deviations from the mean.


    Outliers may also represent data errors. Or, for some modeling applications, outliers
    may be very useful to your analysis. For example, when modeling a rare event such
    as fraud, you might find the outliers to be very predictive. The best approach
    to modeling rare events is using neural networks, which are less sensitive to
    outliers.


    When building a regression model for a not-so-rare event, you will want to take
