    \n子树评估图显示，随着叶节点数量的增加，平均平方误差持续下降（输出 8.4）。\n\n**输出 8.4：查看子树评估图**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_136_0.png)\n\
    \n如果误差开始增加，你应限制叶节点数量或对树进行剪枝。有关决策树剪枝的更多信息，请参阅 Barry de Ville 和 Padraic Neville（2013）所著的\
    \ *《使用 SAS® Enterprise Miner 进行分析的决策树》*。\n\n## 节点特征\n\n树输出的三个维度可帮助你可视化解释结果：\n\n\
