    \ that you do. So, sometimes you must play CEO for your part of the business.\n\
    \nEngaging powerful tools like SAS Enterprise Guide and SAS Enterprise Miner is\
    \ like sitting behind the wheel of a Ferrari. These tools can take you far and\
    \ fast, but will you end up where you need to go?\n\nTo reach your destination\
    \ in sound condition, you must know what the goal is, and you must have a map\
