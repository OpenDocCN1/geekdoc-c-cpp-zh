    # ## Introduction


    In today’s highly competitive global economy, organizations are increasingly dependent
    on their ability to leverage accurate, accessible, actionable data. This increased
    dependence on data requires a new kind of visionary leadership focused on a smart
    investment in an enterprise data management system, the right analytic talent
    to leverage it, and a culture designed to support “big data.”


    A culture of big data includes powerful analytic tools. Advanced analytics and
    reporting software platforms, such as SAS Enterprise Guide and SAS Enterprise
    Miner, enable the user to extract deep insights from big data and its underlying
    patterns. This book is designed to guide the business analyst or manager as he
    or she seeks these insights by providing case studies and everyday examples.


    In this chapter, you will learn the importance of clearly defining the objective
    of any data analysis project.


    # ## Setting Goals


    The use of data analysis is now commonplace in business across industries. Many
    applications, such as customer profiles or response or risk models, are quite
    straightforward. However, as companies attempt to develop models that address
    more complicated measures such as customer'
  - '[PAGE 14]


    retention and lifetime value, the importance of clear goals is magnified. Failure
    to define the goal correctly can result in wasted dollars and a lost opportunity.


    The first and most important step in any data analysis project is to establish
    a clear goal, not a goal defined only by the data or the method, but a goal that
    makes sense to the business as a whole. In other words, the goal of the analysis
    must be defined in terms of how it will help the business reach its strategic
    goals. When you engage the stakeholders, questions and analytic methods will likely
    include the following:


    +   - *Do you need to understand the characteristics of your current customers?*
    This goal may involve looking for averages or segmenting your customer base and
    creating profiles.

    +   - *Do you need to attract new customers?* Response modeling on customer acquisition
    campaigns enables you to lower the marketing costs of attracting additional customers.

    +   - *Do you need to avoid high-risk customers?* Risk or approval models identify
    customers or prospects that have a high likelihood of incurring a loss for the
    company. In financial services, for example, a typical loss comes from nonpayment
    on a loan. Insurance losses result when claims filed by the insured outweigh the
    calculated loss reserves.

    +   - *Do you need to make your unprofitable customers more profitable?* Cross-sell
    and up-sell target models can be used to increase profits from current customers.

    +   - *Do you need to retain your profitable customers?* Retention, or “churn,”
    models identify customers with a high likelihood of lowering or ceasing their
    current levels of activity. The identification of these customers before they
    change their behavior enables the construction of strategies and actions to retain
    them. The cost of retaining a customer is often less than the cost of winning
    back a customer.

    +   - *Do you need new customers to be profitable?* A lifetime value model identifies
    prospects with a high likelihood of being long-term profitable customers. Combining
    several measures, such as response, activation, and attrition, can help you target
    prospects that have the highest value over the life of the product or service.

    +   - *Do you need to win back your lost customers?* Win-back models are built
    to target former customers.

    +   - *Do you need to improve customer satisfaction?* In today’s competitive market,
    customer satisfaction is crucial to success. Combining market research with customer
    profiling is an effective method of measuring customer satisfaction.

    +   - *Do you need to increase sales?* You can increase sales in several ways.
    A new-customer-acquisition model can grow the customer base, leading to increased
    sales. Cross-sell and up-sell models can also be used to increase sales.

    +   - *Do you need to determine what products or services to bundle or offer sequentially?*
    Affinity analysis can identify products that have a high probability of being
    purchased together or within a narrow time frame.

    +   - *Do you need to reduce expenses?* Better targeting through the use of models
    for customer acquisition and customer relationship management can improve the
    efficiency of your marketing efforts by reducing expenses.'
