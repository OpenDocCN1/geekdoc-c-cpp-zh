    \n### 频数分布\n\n*频数分布*表示数据集中某个变量的基本形状或分布。频数分布可以用表格或图形展示。表格的组成部分会有所不同，具体取决于你查看的是分类变量还是连续变量。\n\
    \n本节中的示例基于汽车研究数据计算得出。\n\n**分类变量**\n\n分类变量的频数分布表通常显示计数和百分比。表3.1以表格形式展示了一个简单的频数分析，其中显示了变量\
    \ *汽车类型* 的频数和百分比。你可以很容易地看出，该数据所代表的汽车中有262辆，即61.2%，是 *轿车*。\n\n**表3.1：分类变量“汽车类型”的频数分布表**\n\
