    # Figure 3.4: Example of a Decision Tree for Target Marketing


    ![](img/976d9b992e82c4ac7d195d03a30b4915_47_0.png)


    The second-level split from the male node is on income. This implies that income
    level varies the most between responders and nonresponders among the male customers.
    For female customers, the greatest difference is among age groups. So you can
    describe males with high incomes as among the best responders. You can describe
    females over age 40 as among the best responders. For predictive use, say that
    you decide to mail only to groups for which the response rate has been more than
    3.5%; then, the offers would be directed to males who make more than $30,000 a
    year and to females older than age 40.


    A definite advantage of decision trees over other techniques is their ability
    to explain the results. So if you develop a complex logistic model for scoring
    but it seems very hard to explain, a tree model might be helpful. Use the same
    variables from the complex model to build a tree model. Although the outcome is
    never identical, the tree does uncover key drivers in the market. Because of their
    broad applicability, decision trees will continue to be a valuable tool for all
    kinds of target modeling.


