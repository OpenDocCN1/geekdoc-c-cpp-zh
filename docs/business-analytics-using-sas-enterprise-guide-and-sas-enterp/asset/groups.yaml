    \n### 数据集\n\n你可以通过链接到本书作者页面 http://support.sas.com/publishing/authors 访问作者示例中使用的数据。选择作者姓名。然后找到本书封面缩略图，选择\
    \ *示例数据* 以显示与本书关联的 SAS 数据集。\n\n如需查看所有提供示例代码和数据集的书按字母顺序排列的列表，请参见 http://support.sas.com/bookcode。要显示某本书的示例代码，请选择其书名。\n\
    \n如果你无法通过网站访问数据集，请发送电子邮件至 saspress@sas.com。\n\n### 其他帮助\n\n尽管本书说明了各行业企业经常执行的许多分析，但你仍可能遇到与自身目标和问题相关的具体疑问。为了全面支持你，SAS\
    \ Institute 和 SAS Press 提供以下帮助资源：\n\n- 有关本书涵盖主题的问题，请通过 SAS Press 联系作者：\n  - 通过电子邮件将问题发送至\
    \ saspress@sas.com；并在来信中注明书名。\n  - 在作者页面 http://support.sas.com/author_feedback\
    \ 提交反馈。\n- 有关本书范围内或范围外主题的问题，请将查询发布到相关的 SAS 支持社区：https://communities.sas.com/welcome。\n\
