    +     - Create Target Variable .......................................... 115

    +     - Partition the Data .............................................. 117

    +     - Build the Decision Tree ......................................... 118

    +     - View the Decision Tree Output ................................... 120

    +     - Interpret the Findings .......................................... 126

    +     - Alternate Uses for Tree Analysis ................................ 128

    +   - Notes from the Field ................................................ 128


    # ## Introduction


    In several earlier chapters, we focused on understanding the customers at DMR
    Publishing. Understanding your customers is always a good first step in any comprehensive
    analysis. In this chapter, you will learn how to discover and measure patterns
    to predict future behavior from a combination of past behaviors and characteristics.
    The main technique you will use in this process is tree analysis. One of the benefits
    of tree analysis is that in addition to being a powerful predictive technique,
    it also has a strong descriptive component. The descriptive results of a tree
    analysis are easily interpreted, making this technique a favorite among business
    analysts and marketers.


    # ## Project Overview


    The leadership team at DMR Publishing Company is interested in understanding the
    characteristics of customers that subscribe to more than one magazine or journal
    when compared to customers that have only one subscription. For this analysis,
    you will use SAS Enterprise Miner.'
  - '[PAGE 124]


    This project has ten steps:


    +   1. Initiate the project in SAS Enterprise Miner 13.1.

    +   2. Input the data source.

    +   3. Define the variable roles.

    +   4. Define the target variable.

    +   5. Partition the data.

    +   6. Set the tree properties.

    +   7. Build the decision tree.

    +   8. Adjust your graph properties.

    +   9. Interpret your findings.

    +   10. Display Node Rules.


    # Decision Tree Analysis


    The decision tree technique is designed to segment data according to series of
    simple rules. For a full documentation of the process, access the **Help** section
    of SAS Enterprise Miner. Once you have a project open, go to **Help ▸ Contents**.
    When the window opens, look for **Node Reference ▸ Model ▸ Decision Tree Node**.


    # Initiate the Project


    To open SAS Enterprise Miner (EM), click on the node on your desktop or Start
    menu. Your first choice is to open an existing project or create a new project.
    Highlight and click **New Project** (Figure 8.1).'
