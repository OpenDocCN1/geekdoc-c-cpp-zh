    ## 神经网络


    神经网络处理与回归有很大不同，因为该过程不遵循任何统计分布。相反，神经网络是根据人类大脑的功能建模的。该过程是模式识别和误差最小化。您可以将其视为摄取信息并从每次体验中学习。


    神经网络由排列在层中的节点组成。这种构造因神经网络的类型和复杂性而异。图 3.9 说明了一个具有一个隐藏层的简单神经网络。在过程开始之前，数据被分为 *训练*
    和 *测试* 数据集。（有时会保留第三组用于最终验证。）然后为第一层中的每个节点分配权重或“输入”。在每次迭代中，输入通过系统处理并与实际值进行比较。误差被测量并通过系统反馈以调整权重。在大多数情况下，权重在预测实际值方面的能力会得到改善。该过程在达到预定的最小误差水平时结束。


