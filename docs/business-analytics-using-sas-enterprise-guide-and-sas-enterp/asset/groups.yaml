    represent the names selected by each model. If your “champion” model is still
    performing well, you might decide to mail the entire set of names selected by
    the “champion” and to mail a sample of names from the portion of the “challenger”
    oval that was not selected by the “champion.” This technique allows you to weight
    the names from the sample so that you can track and compare both models’ performance.
    If you want to estimate the performance of the population without the benefit
    of any model (for comparison purposes), you should mail a sample of names not
    selected by either model.


    **Figure 3.11: Comparison of Champion with Challenger in Prospect Selection**


