    # Cluster


    Cluster analysis, or clustering, is a data-driven process that groups observations
    into clusters that favor similarity within each cluster while favoring dissimilarity
    between clusters. The precise method used to calculate the similarities and differences
    will vary, depending on the goal of your analysis.


    Figure 3.3 shows clusters that are not mutually exclusive. For example, one observation
    can populate more than one cluster. This cluster analysis shows segmentation by
    age and income. Notice that three groups form:


    +   - low income and low age

    +   - high income and medium age

    +   - medium income and high age


    # Figure 3.3: Example of Cluster Analysis with Clusters That Are Not Mutually
    Exclusive


    ![](img/976d9b992e82c4ac7d195d03a30b4915_45_0.png)


    For use in marketing, the usual goal of cluster analysis is to separate people
    or companies into mutually exclusive groups. With SAS Enterprise Miner, clusters
    can be built into mutually exclusive segments, which are useful when segmenting
    a group of customers of companies. Chapter 7 includes an example of clustering
    into mutually exclusive segments.


    # Decision Tree


    Generating a decision tree is another method of understanding data relationships
    that can be used for both descriptive analytics and predictive analytics. Tree
    analysis sequentially partitions the data to'
  - '[PAGE 46]


    maximize the differences in the dependent variable on the basis of the independent
    variables. It is also known as a *classification tree*. The true purpose of the
    tree is to *classify* the data into distinct groups, or branches, that create
    the strongest differentiation in the values of the dependent variable.


    Decision trees are good at identifying segments with a desired behavior such as
    response or activation. This identification can be quite useful when a company
    is trying to understand what is driving market behavior. It also has an advantage
    over regression in its ability to detect nonlinear relationships that can be useful
    for identifying interactions for inputs into other modeling techniques.


    A decision tree is "grown" through a series of steps and rules that offer great
    flexibility. In Figure 3.4, the tree differentiates between responders and nonresponders.
    The top node provides details of the size and the performance of an overall marketing
    campaign in which offers were mailed to 10,000 potential customers and yielded
    a response rate of 2.6%. When examining the results, you can see that the first
    split is on *gender*. This split implies that the greatest difference between
    responders and nonresponders is their gender. Males are much more responsive (3.2%)
    than females (2.1%). So you can describe the male responders as more heavily male.
    From a predictive standpoint, after one split you would consider males the better
    target group. For additional descriptive and predictive insights, you can split
    the tree within each gender to find additional subgroups that further discriminate
    between responders and nonresponders. In the next split, the two gender groups
    or nodes are considered separately.'
