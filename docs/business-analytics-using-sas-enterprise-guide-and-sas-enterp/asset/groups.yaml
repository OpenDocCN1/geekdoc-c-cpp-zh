    # Alternate Uses for Tree Analysis


    Tree analysis can be used for a variety of goals. In this chapter, the tree was
    used as a descriptive analysis. In Chapter 9, you will use the tree node to develop
    a predictive model with a binary outcome. A third use of tree analysis is to create
    variables as an input for a regression or neural network model. Trees are also
    useful for diagnosing and interpreting the meaning of neural networks and other
    advanced modeling techniques. Simply point the tree at the neural network predicted
    target and grow a tree. For more information about this third use, see Decision
    Trees for Analytics Using SAS Enterprise Miner, by Barry de Ville and Padraic
    Neville (2013).


    # Notes from the Field


    With the influx of big data, the demand for predictive analytics continues to
    grow across a variety of industries and applications. From marketing and risk
    to process improvement and human resources, the possibilities for applying tree
    models are endless. Your ability to build powerful tree models will enable you
    to provide meaningful insights and direction to stakeholders across your enterprise.


    As the person with the keys to the Ferrari, you play an important role in shaping
    the analysis. In other words, you have access to advanced techniques within SAS
    software that enable you to analyze big data and provide insights and direction
    to your clients and stakeholders. But, because most of your clients and stakeholders
    don’t understand what you do or how you do it, you must be very diligent about
    your process from beginning to end. At each step, ask yourself if what you are
    seeing makes sense in terms of your business. And, remember to drive carefully.'
