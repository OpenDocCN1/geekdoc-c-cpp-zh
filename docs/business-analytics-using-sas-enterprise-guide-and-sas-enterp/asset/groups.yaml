    \ predict whether a player’s statistics are a good fit for the team\n- *target\
    \ model*—to predict who will attend an event\n\n### Notes from the Field\n\nThe\
    \ fact that you are reading this book suggests that you are among those of us\
    \ who are seduced by the power and beauty of big data and its emergent insights.\
    \ However, big data has a dark side. One can easily become lost in the minutia\
    \ and forget about the main purpose of the project—that carefully crafted business\
