    # ## Introduction


    In Chapters 5 through 8, you learned to view and analyze the DMR Publishing data
    in an effort to understand past and current customer characteristics and behavior.
    In this chapter, you will learn how to discover and measure patterns from past
    behavior and characteristics to predict future behavior using predictive modeling.
    This is one of most widely used techniques used in business today.'
  - '[PAGE 142]


    As detailed in Chapter 1, there are numerous uses for predictive modeling in marketing,
    risk, process improvement, customer retention, and more. In this chapter, you
    will build a model to predict the likelihood of loan default using credit risk
    data.


    To achieve your goal, you will initiate a project in SAS Enterprise Miner and
    proceed through the model building process. You will explore and manipulate the
    data to prepare for modeling. You will build three common types of models: a decision
    tree, a neural network, and a regression model. You will compare the three models
    in an assessment node.


    The steps for model development are as follows:


    +   - *Select:* Initiate the project and bring the modeling data set into the
    project. Be sure that it correlates with the business purpose for building the
    model.

    +   - *Explore:* Use visual tools to view the distribution and completeness of
    the data.

    +   - *Modify:* Partition the data into training, test, and validation data sets.
    Impute missing values and filter outliers. Transform or segment interval variables
    if necessary. Create indicator variables for variables with character or non-sequential
    values.

    +   - *Model:* Develop three different models: a decision tree, a neural network,
    and a regression model.

    +   - *Assess:* Compare the three models by using the gains table and lift charts.


    > **NOTE:** For supporting documentation on every aspect of SAS Enterprise Miner,
    see the Contents section under Help in the main menu.


    # Select


    In this section, you initiate a project in SAS Enterprise Miner and select data
    for the model-building process.


    # Initiate the Project


    ABC Bank provided a “snapshot” of customer data that includes customers who defaulted
    on their loans and customers who did not default on their loans. The customer
    payment, balance, and several demographic variables were appended from a credit
    bureau for a period six months earlier. The dependent variable is a field called
    LOAN_DEFAULT. The goal of the model is to learn whether you can predict who is
    most likely to default on a loan six months from now.


    Open SAS Enterprise Miner and select **New Project**. Name your project and select
    a place to store the files as seen in Figure 9.1. Click **Next ▶ Finish**.'
