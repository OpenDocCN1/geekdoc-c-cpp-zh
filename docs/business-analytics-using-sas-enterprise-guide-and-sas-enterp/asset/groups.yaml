    ### Output 9.10: Decision Tree View


    ![](img/976d9b992e82c4ac7d195d03a30b4915_158_1.png)


    Because the decision tree is built for prediction, the actual tree node values
    are not as important as the model’s ability to predict. Consequently, in the next
    few steps you will build the neural network and regression models. In the final
    assessment step, you will employ the Model Comparison node to compare all three
    models, using both gains tables and a cumulative-lift graph.


    ### Neural Network


    As described in Chapter 3, neural networks are models that capture many of the
    nonlinear relationships in data. So, although neural network models sometimes
    do a better job of fitting the model than the decision tree or regression models,
    they might not perform as well on the validation data or maintain their ability
    to predict as accurately over time. Another disadvantage of neural network models
    is that they are more difficult for marketers to interpret than the decision tree
    models.


