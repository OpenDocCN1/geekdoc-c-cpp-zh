    \ PCT_of_REVENUE。点击**下一步** ▶ **完成**。点击**关闭** ▶ **运行**。\n\n> > **注意：** 为避免错误，变量名必须与所述完全一致。\n\
    \n输出 6.4 显示了最终的百分比值。\n\n## 输出 6.4：最终的百分比变量，显示 DMR 订阅者指标占总市场的百分比\n\n|  | PCT_OF_SUBSCRIBERS\
