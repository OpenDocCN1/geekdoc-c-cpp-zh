    右键单击决策树节点，然后单击“运行”和“是”。当“运行完成”框打开时，单击“结果”。\n\n**输出 8.2：查看初始树（右分支）**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_133_0.png)\n\
    \n## 图形属性\n\n在开始分析结果之前，你可以根据自己的个人偏好选择更改视图。要探索树输出中的许多选项，请在输出 8.1 所示的屏幕上任意位置右键单击，然后选择\
    \ **图形属性**。窗口打开后，单击 **树**。将 **方向** 更改为 **水平**，然后单击 **确定**（图 8.14）。\n\n**图 8.14：更改决策树输出的图形属性**\n\
