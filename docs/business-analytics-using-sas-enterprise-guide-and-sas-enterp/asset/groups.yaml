    ## 输出 9.11：神经网络累积提升


    ![](img/976d9b992e82c4ac7d195d03a30b4915_160_0.png)


    **训练**数据似乎捕获了文件前 10% 中超过 45% 的违约案例。**验证**数据仅捕获了文件前 10% 中略多于 20% 的违约案例。与决策树模型一样，训练数据和验证数据之间的提升差异意味着该模型并不稳健。换句话说，它过度拟合了训练数据，并且在模型实施时可能无法达到预期的预测效果。在接下来的部分中，你将把决策树模型的结果与神经网络和回归模型的结果进行比较。


    ## 回归


    如第 3 章所述，回归模型使用一系列自变量或预测变量来预测结果。在预测建模中，你可以使用逻辑回归，它构建一个具有二元结果的模型。所得的方程为事件发生的概率赋值。在当前案例中，二元结果或事件是**贷款违约**。


    在**模型**选项卡下，将**回归**图标（右起第三个）拖到图中，并将其连接到**变换变量**节点。图 9.15 显示了该图和**回归属性**窗口。由于目标变量
    LOAN_DEFAULT 是二元的，**回归类型**默认为**逻辑**。


    如第 3 章所述，每个选择选项都有利弊。对于此模型，将**选择模型**更改为**逐步**。将**使用选择默认值**更改为**否**（图 9.15）。


    文件。**验证**数据仅捕获了文件前 10% 中约 25% 的违约案例，这是迄今为止**验证**数据的最佳表现。


    ## 输出 9.12：逻辑回归累积提升


    ![](img/976d9b992e82c4ac7d195d03a30b4915_162_0.png)


    接下来，你将在模型比较节点中比较这三个模型。


    ## 评估


    **模型比较**节点允许你直观地比较模型，并使用增益表执行十分位分析。从图顶部的菜单中，单击**评估**选项卡。选择**模型比较**图标并将其拖到图中，然后将其连接到所有三个模型，如图
    9.17 所示。在**属性**窗口中，将**箱数**改为 10 以查看十分位结果，并将**选择统计量**改为**累积提升**。右键单击**模型比较**节点，单击**运行
    ▶ 是**。当窗口出现时，单击**结果**。


    ### 图 9.17：模型比较属性窗口


    ![](img/976d9b992e82c4ac7d195d03a30b4915_163_0.png)


    结果窗口的左下角显示累积提升图，如输出 9.13 所示。所有三个模型分别针对三个数据集进行比较：训练、验证和测试。所有三个数据集的模型表现均显示前 10%
    的提升最大。正如预期，神经网络模型和决策树在训练数据上表现最佳。但神经网络模型在验证数据集中的表现有所下降，但在测试数据集中似乎略有恢复。


    前 10% 的表现中，测试数据最为接近，决策树显示出最大的提升。逻辑回归在文件的 40% 及以后开始表现更好。


    选择最佳模型是一个有趣的挑战。由于它们非常接近，你可以选择决策树模型，因为它最容易解释，并且在前 10% 中提供最大的提升。由于我们的贷款违约率约为 4%，因此选择在前
    10% 中优化的模型是有意义的。另一方面，如果贷款违约率为 40%，你可能会选择逐步逻辑回归模型，因为它在文件的 40% 处表现更好。


