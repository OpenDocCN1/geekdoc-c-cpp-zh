    ### 组织结构\n\n本书首先帮助你根据组织或部门的目标和目的，确定并构建分析目标。\n\n第2章介绍用于分析的数据类型和数据来源。第3章概述常见的业务分析，涵盖描述性分析和预测性分析。第4章展示如何构建用于分析的数据集。第5章详细说明简单描述性分析的分步操作。第6章以同样的详细程度介绍典型的市场分析。第7章和第8章分别提供聚类分析和树分析的分步指南。每章都以标题为“现场笔记”的一节结尾，提供相关业务建议和领导力提示。\n\
    \n最后，第9章通过一个完整的、分步的案例研究将若干概念结合起来，用于构建和比较预测模型，并以最后的“现场笔记”收尾。\n\n### 示例\n\nSAS Institute\
    \ 和 SAS Press 提供软件更新和作者的示例数据集，以便你练习本书中的示例。\n\n### 使用的软件\n\n本书编写过程中使用的软件包是 SAS\
