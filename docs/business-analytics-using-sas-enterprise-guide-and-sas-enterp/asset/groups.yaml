    # ## Node Interpretation


    In Output 8.5, the topmost node on the left represents the whole sample of 8,010
    DMR customers. Both the Train and Validation data subsets show that approximately
    73% of DMR customers have more than a single subscription (MULTI_SUBS > 1) as
    shown in Output 8.5.


    The first-level split is on HOUSEHOLD INCOME at $28,500. The upper box (Node 2)
    is lighter and represents 2,185 DMR customers with income less than $28,500. Within
    Node 2, 47.7% of DMR customers have more than one subscription. The lower box
    (Node 3) is darker and represents customers with annual income greater than $28,500.
    The percentage of DMR customers with more than a single subscription (MULTI_SUBS
    > 1) is 82.5%.


    The second-level splits on a different variable for each node in the first level.
    Node 2 splits on AGE into Node 4 and Node 5. Node 4 shows that 81.4% of DMR customers
    younger than 22.5 years have more than one subscription. Node 5 shows that only
    41.8% of DMR customers who are older than 22.5 years have more than one subscription.


    The second split on the second level (Node 3) is on Household Income. Node 6 shows
    that 75.1% of DMR Customers with less than $51,500 in annual income have more
    than one subscription. Node 7 shows that 87.2% of DMR Customers with more than
    $51,500 in income have more than one subscription.


    In Output 8.4, the final nodes show a wide range of percentages for DMR Customers
    having more than one subscription. Node 10 is the lightest background and has
    the lowest percentage of DMR Customers with more than one subscription (30.0%).
    Nodes 12 and 14 are the darkest, with the highest percentages of DMR Customers
    with more than one subscription (90.8% and 97.9%, respectively).


    > > **NOTE:** “Or Missing” shows up in the bottom brackets whether or not you
    have missing values. In the current data, you have no missing values, so you can
    ignore “Or Missing” in this interpretation.'
