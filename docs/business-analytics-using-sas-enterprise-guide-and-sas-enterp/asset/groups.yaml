    # Default


    Default models have been used to determine risk for several decades. On the basis
    of an individual’s or business’s credit history, financial profile, demographics,
    or similar data, a lending institution or other business can determine its applicant’s
    likelihood of meeting his or her loan obligation. Predicting the likelihood of
    default or bankruptcy has been a main profit-driver of the loan industry for many
    years. Whether it’s for a mortgage, credit card, car loan, or even utility service,
    many companies rely on a credit score to determine approval and terms of a contract.
    Banks also use aggregations of the expected loss to meet regulatory requirements
    for loan reserves.


    # Loss-Given-Default


    At the point of default, *loss-given-default models* are used to estimate the
    size of the loss. Some loans, such as mortgages and automobile loans, are secured,
    meaning that the bank holds the title to the home or automobile for collateral.
    The risk is then limited to the loan amount minus resale value of the home or
    car. Unsecured loans are loans for which the lender holds no secured assets, such
    as credit cards.


    Many other industries incur risk by offering a product or service with the promise
    of future payment. This category includes telecommunications companies, energy
    providers, retailers, and many others. The type of risk is similar to that of
    the banking industry in that it estimates the probability of a customer’s defaulting
    on the payment for goods or services.


    # Claim


    For the insurance industry, the risk is that of a customer’s filing a claim. The
    basic concept of insurance is pool risk. Insurance companies have decades of experience
    in managing risk. Insurance companies use predictive model scores to determine
    approval, optimize pricing, and determine reserve levels for life, health, auto,
    and homeowners insurance on the basis of demographics, risk factors including
    claim history, and credit risk factors. Because of heavy government regulation
    of pricing in the insurance industry, managing risk is critical to insurance companies’
    profitability. Warranty companies often use product information and safety records
    to model the likelihood of a claim.


    # Fraud


    With the increase in electronic and online transactions, fraud is increasing at
    an alarming rate. According to fraud research by the 2012 Global Fraud Study,
    survey participants estimated that the organizations lose an average of 5% of
    their revenues to fraud each year (Association of Certified Fraud Examiners 2012).
    Applied to the 2011 gross world product, this figure translates to a potential
    projected annual fraud loss of more than $3.5 trillion. Because of fraudulent
    purchases made with stolen credit cards, fake insurance claims (including life,
    health, and auto), stolen'
