    \ | 0.28 |\n\n图3.2以柱状图展示了频数分布。这些值被分桶，以显示数据的潜在性质。当你查看连续变量的频数分布柱状图时，你会了解到额外信息，例如分布的偏度。\n\
    \n**图3.2：连续变量每加仑英里数（高速公路）的频数分布柱状图**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_44_0.png)\n\
