    Data comes in three basic types: nominal, ordinal, and continuous.


    ### Nominal Data


    *Nominal data* is qualitative or descriptive data that has discrete values.


    Variable or data columns that contain nominal data are often referred to as *class
    variables*, *categorical variables*, or *discrete variables*. Nominal data can
    be used for segmentation or classification.


    When a class variable is used as an input to a particular kind of predictive model,
    such as a regression or neural network model, it must be converted into a numeric
    form. For example, you could say that the values for gender are 1 and 0, where
    1 = *male* and 0 = *female*. When the values are set to 0 and 1, they are also
    referred to as *indicator variables*. This transformation can be accomplished
    automatically in modeling software such as SAS Enterprise Miner.


    ### Ordinal Data


    *Ordinal data* is data with categories that have relative importance. The categories
    can be used to rank strength or severity. For example, you may be familiar with
    the rankings “Low, Medium, and High.” These have a relative ranking but can’t
    be compared mathematically.


    Numeric values can also be used to denote relative ranking without a mathematical
    relationship. For example, a list company assigns the values 1 through 5 to denote
    financial risk. The value 1, characterized by no late payments, is considered
    low risk. The value 5, characterized by a bankruptcy, is considered high risk.
    The values 2 through 4 are characterized by various previous delinquencies. A
    prospect with a risk ranking of 5 is definitely riskier than a prospect with a
    ranking of 1, but he or she is not five times as risky. And the difference in
    their ranks, 5 − 1 = 4, has no meaning.


    ### Continuous Data


    *Continuous data, or ratio data, is the most common data used to develop predictive
    models.* It can accommodate all basic arithmetic operations: addition, subtraction,
    multiplication, and division. Most business data, such as sales, balances, and
    minutes, is ratio or continuous data.


    ## Categories of Data


    Three main characteristics of data should be considered when you are deciding
    the types of data you want to use: the power, stability, and cost. First, however,
    you will want to look at the data categories.


    Although data is available from numerous sources and is of varying types, regardless
    of its origin, data fits into one of three basic categories: demographic, behavioral,
    or psychographic or attitudinal. Each category has its strengths and weaknesses.


    ### Demographic or Firmographic Data


    *Demographic data generally describes personal or household characteristics.*
    It typically includes the following characteristics:


    - gender

    - age

    - marital status

    - income

    - home ownership

    - dwelling type

    - education level

    - ethnicity

    - presence of children


    Demographic data has many strengths. It is stable, which makes it appealing for
    use in predictive modeling. Characteristics like marital status, home ownership,
    education level, and dwelling type aren’t subject to change as frequently as behavioral
    data, such as bank balances, or attitudinal characteristics, like favorite political
    candidate. And demographic data is usually less expensive than attitudinal and
    behavioral data, especially when purchased on a group level.


    One of the weaknesses of demographic data is that it is difficult to collect on
    an individual basis with a high degree of accuracy. Unless it is required by law
    or is required in return for a product or service, many people resist sharing
    this type of information, or they supply false information.


    *Firmographic data can be thought of as demographic data for businesses.* It includes
    characteristics, such as industry, annual revenue, number of employees, number
    of sites, and


    ### Psychographic Data


    Psychographic data is also known as attitudinal data or lifestyle data. It is
    characterized by opinions, fashion, style, political choices, personal values,
    or some combination. Traditionally associated with market research, this category
    of data is collected mainly through surveys, opinion polls, and focus groups.
    It can also be inferred through subscription, purchase, and social media behavior.
    Because of increased competition, this category of data is being integrated into
    customer and prospect databases for improved target modeling and analysis.


    Psychographic data brings an added dimension to predictive modeling. For companies
    that have squeezed all the predictive power possible out of their demographic
    and behavioral data, psychographic data can offer some improvement. It is also
    useful for determining the life stage of a customer or prospect. This data creates
    many opportunities for developing products and services around life events such
    as marriage, childbirth, college expenses, and retirement.


    The biggest drawback to psychographic data is that it denotes intended behavior
    that may be highly, partly, or marginally correlated with actual behavior. Data
    may be collected through surveys or focus groups and then applied to a larger
    group of names, such as a customer base, using segmentation or predictive modeling.
    If data is applied with the use of these methods, it is recommended that a test
    be constructed to validate the correlation.


    ### Data Category Comparison


    Table 2.1 provides a quick reference and comparison of the three main categories
    of data. The rating is based on individual-level data. If data is collected on
    a group and inferred on an individual level, it is generally less predictive and
    less expensive. The stability remains the same.


    Preserving the entire customer history. It is essential in any database to effectively
    link and track the behavior of actions taken on an individual customer.


    - *Household ID* is a unique numeric or alphanumeric code that identifies the
    household of the customer through his or her entire customer life cycle. This
    identifier is useful in some industries in which more than one member of a household
    shares products or services.

    - *Account number* is a unique numeric or alphanumeric code that relates to a
    particular product or service. One customer can have several account numbers.

    - *Customer name* is the name of a person or a business. It is usually broken
    down into multiple fields: last name, first name, middle name or initial, salutation.

    - *Physical address* is typically broken into components such as number, street,
    suite or apartment number, city, state, postal code, and country. Some customer
    databases have a line for a P.O. Box. With population mobility about 10% per year,
    additional fields that contain former addresses are useful for tracking and matching
    customers to other files.

    - *Phone number* includes area code, country code, and, if applicable, extension.

    - *Email address* can also serve as unique identifier.

    - *Demographic information* such as gender, age, and income may be stored for
    profiling and modeling.

    - *Products or services* are typically tracked with the use of a list of products
    and product identification numbers that may vary by company. An insurance company
    may list all its insurance policies, together with policy numbers. A bank may
    list all the products across different divisions of the bank, including checking,
    savings, credit cards, investments, loans, and more. If the number of products
    and the product detail are extensive, this information may be stored in a separate
    database with a customer and household identifier.

    - *Model scores* such as response, risk, retention, profitability scores, or any
    other scores may be purchased or developed in-house. These scores may reside in
    a separate database that is linked by the account number.


    ## Customer Database—Business to Business


    A customer database designed to target businesses (B2B) resembles a customer database
    designed to target consumers (B2C). The main difference is that the customer is
    a business instead of an individual.


    The overall structure is also similar. The main database typically has one record
    for each company unit. Each record or site may also be a headquarters (HQ) or
    a map to another site that is the HQ. Each record contains the identifying information
    that can be linked to other databases, such as a transaction database, a marketing
    database, or other databases that track past performance and other information
    of value to the company.


    In addition to a company-level database, many large B2B companies have a contact
    database in which the individuals are associated with companies in the customer
    database. It may also contain additional contacts that work for companies that
    are not yet customers.

