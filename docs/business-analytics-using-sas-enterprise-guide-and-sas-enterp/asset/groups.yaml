    ## Partition Data into Subsamples


    The next step is to partition the data into three subsamples: Train, Validate,
    and Test. In your diagram, click the **Sample** tab, drag the **Partition** icon
    onto the diagram, and connect it to the **Impute** icon as shown in Figure 9.10.


    ### Figure 9.10: Partition Data


    ![](img/976d9b992e82c4ac7d195d03a30b4915_151_0.png)


    For every modeling technique, the **Train** data is the base data set used to
    build several interim models and a final model during the model building process.
    The **Validation** data is used to fine tune each model and avoid overfitting
    during the decision tree, neural network, and stepwise regression model building
    processes. The **Test** data is used to evaluate the final model on unbiased data
    not used in the model building process. The final model is the one with the best
    fit based on your preselected criteria.


    You will build three models, one each of decision tree, neural network, and stepwise
    regression. These will be evaluated individually and also compared using the **Model
    Comparison** node.


    Notice in the Property window at the left that the partitioning method, under
    **Train**, is set to **Default**. The choices are **Simple, Random, Cluster,**
    and **Stratified**. You want to use the **Stratified** method, and because you
    have a binary target variable, the default is **Stratified**. So, you don’t need
    to make any change here. If you do change it to **Stratified**, the result will
    be the same.


    Notice the default percentages in the **Property** window. Under **Data Set Allocations**,
    the default settings assign 40% to training, 30% to validation, and 30% to test.
    These defaults can be changed as long as the total equals 100%. Right-click on
    the Data Partition process and click **Run ▶ Yes**. You can view the results to
    see that the percentage of the dependent variable is close in each of the three
    sample data sets.


    ## Manage Outliers


    As described in Chapter 5, outliers are data points that are unusually large or
    small when compared to the rest of the values for a certain variable. While there
    is no precise rule to identify an outlier, you can look for values that are more
    than 3, 4, or 5 standard deviations from the mean.


    Outliers may also represent data errors. Or, for some modeling applications, outliers
    may be very useful to your analysis. For example, when modeling a rare event such
    as fraud, you might find the outliers to be very predictive. The best approach
    to modeling rare events is using neural networks, which are less sensitive to
    outliers.


    When building a regression model for a not-so-rare event, you will want to take
    steps to manage the outliers. Depending on the number of observations in your
    data set compared to the number of outliers, you can choose to handle them differently.
    The four most common methods for dealing with outliers are:


    - 1. Cap the variable.

    - 2. Drop the observations.

    - 3. Treat them as errors or missing values.

    - 4. Bucket the continuous variable into quartiles, deciles, or centiles.


    Regression models are especially sensitive to outliers. If your data contains
    outliers, investigating the source of the data is good practice. Because your
    current data comes directly from a credit bureau and has not been altered to correct
    for outliers, it typically has some outliers. In this case study, you will filter
    the outliers. In practice, this is a simple first step using the Filter node.
    If you have the luxury of testing different methods for handling outliers, you
    can compare the model results and develop your own preference for managing outliers.


    To filter outliers, click on the **Sample** tab and drag the **Filter** icon to
    your diagram, as shown in Figure 9.11. In the **Property** window, set the **Tables
    to Filter** to **All Data Sets**. The default setting for **Class Variables**
    is **Rare Values (Percentage)**. Leave this setting as is. For **Interval Variables**,
    set the method to **Extreme Percentiles**. The **Extreme Percentiles** method
    filters out the top 5% of values. This setting can be changed by clicking the
    three dots to the right of **Tuning Parameters**.


