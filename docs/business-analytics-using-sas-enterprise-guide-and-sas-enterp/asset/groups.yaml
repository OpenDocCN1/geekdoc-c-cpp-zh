    ## 模型


    现在真正有趣的部分开始了。第一个模型是决策树。由于决策树过程通过发现离散分组来构建模型，因此该建模过程不会使用转换后的变量。


    ### 决策树


    在第 8 章中，你构建了一棵决策树来描述数据。在本章中，你将构建一棵决策树来预测事件发生的可能性。该方法用途广泛，可用于多种方式。


    > **注意：** 回想一下，你使用插补功能替换了数据中的缺失值。如果你没有替换这些值，决策树过程会将它们视为单独类别。有关更多信息，请参阅 Enterprise
    Guide 帮助内容。


    在**模型**选项卡下，将**决策树**图标拖到图上，并将其连接到**过滤**节点，如图 9.13 所示。建议在**属性**窗口中做两处更改。在**拆分规则**下，将**最大分支数**改为
    4。此选项你可以进一步探索，调高或调低。在**子树**下，将**方法**改为**评估**，将**评估度量**改为**提升**。右键单击**决策树**图标，然后单击**运行**
    ➤ **是**。


    ### 图 9.13：决策树属性窗口


    ![](img/976d9b992e82c4ac7d195d03a30b4915_157_0.png)


    运行完成后，单击**结果**。输出窗口左上角的图显示了累积提升图，如输出 9.9 所示。该图显示，训练数据中的提升远好于验证数据中的提升。


    ### 输出 9.9：决策树结果


    ![](img/976d9b992e82c4ac7d195d03a30b4915_158_0.png)


    **训练**数据似乎捕获了文件中前 10% 内 35% 的违约。**验证**数据捕获了文件中前 10% 内约 25% 的违约。模型在**训练**和**验证**数据上的表现均有所改善。你将在后续章节中比较决策树模型与神经网络和回归模型的结果。


    输出 9.10 中显示的部分决策树视图表明，RISK_SCORE 是最强的预测变量。该结果与输出 9.1 中 StatExplore 结果中区间变量的结果一致。


    ### 输出 9.10：决策树视图


    ![](img/976d9b992e82c4ac7d195d03a30b4915_158_1.png)


    由于决策树是为预测而构建的，实际的树节点值不如模型的预测能力重要。因此，在接下来的几个步骤中，你将构建神经网络和回归模型。在最终评估步骤中，你将使用模型比较节点，通过增益表和累积提升图来比较所有三个模型。


    ### 神经网络


    如第 3 章所述，神经网络是能够捕捉数据中许多非线性关系的模型。因此，尽管神经网络模型有时比决策树或回归模型拟合得更好，但它们在验证数据上的表现可能不如后者，或者可能无法随着时间的推移保持其准确预测的能力。神经网络模型的另一个缺点是，与决策树模型相比，营销人员更难解释它们。


    在模型选项卡下，将神经网络图标（从右数第五个）拖到图上，并将其连接到转换变量节点。图 9.14 显示了该图和神经网络属性窗口。在训练部分中，在模型选择准则旁边，将值改为误分类。右键单击模型节点，然后单击运行
    ▶ 是。窗口出现后，单击结果。


    ### 图 9.14：神经网络属性窗口


    ![](img/976d9b992e82c4ac7d195d03a30b4915_159_0.png)


    如输出 9.11 所示，神经网络训练数据的累积提升远高于验证数据。


