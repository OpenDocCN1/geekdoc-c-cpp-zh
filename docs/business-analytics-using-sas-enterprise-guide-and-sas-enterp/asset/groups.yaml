    # # Chapter 8: Tree Analysis Using SAS Enterprise Miner


    +   - Introduction ........................................................ 111

    +   - Project Overview .................................................... 111

    +   - Decision Tree Analysis .............................................. 112

    +     - Initiate the Project ............................................. 112

