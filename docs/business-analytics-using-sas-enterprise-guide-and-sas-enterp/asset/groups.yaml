    ▶ 是**。您可以查看结果，以了解三个样本数据集中因变量的百分比是否接近。


    ## 管理异常值


    如第 5 章所述，异常值是相对于某个变量的其他值而言异常大或异常小的数据点。虽然没有精确的规则来识别异常值，但您可以查找距离均值超过 3、4 或 5 个标准差的值。


    异常值也可能代表数据错误。或者，对于某些建模应用，异常值可能对您的分析非常有用。例如，在对欺诈等稀有事件进行建模时，您可能会发现异常值具有很强的预测性。对稀有事件建模的最佳方法是使用神经网络，因为神经网络对异常值不那么敏感。


    当为不那么稀有的事件构建回归模型时，您需要采取措施管理异常值。根据数据集中观测数与异常值数量的比较，您可以选择不同的处理方式。处理异常值的四种最常见方法是：


    - 1. 对变量进行封顶。

    - 2. 剔除这些观测值。

    - 3. 将它们视为错误或缺失值。

    - 4. 将连续变量按四分位数、十分位数或百分位数分桶。


    回归模型对异常值尤其敏感。如果您的数据包含异常值，调查数据来源是一种很好的做法。由于您当前的数据直接来自信用局，并且未针对异常值进行修正，因此通常会有一些异常值。在本案例研究中，您将过滤异常值。在实践中，使用
    Filter（过滤）节点是简单的第一步。如果您有幸测试处理异常值的不同方法，您可以比较模型结果，并形成自己管理异常值的偏好。


    要过滤异常值，请单击**样本**选项卡，并将**过滤**图标拖动到关系图中，如图 9.11 所示。在**属性**窗口中，将**要过滤的表**设置为**所有数据集**。**分类变量**的默认设置为**稀有值（百分比）**。保持此设置不变。对于**区间变量**，将方法设置为**极端百分位数**。**极端百分位数**方法会过滤掉前
    5% 的值。可以通过单击**调节参数**右侧的三个点来更改此设置。


