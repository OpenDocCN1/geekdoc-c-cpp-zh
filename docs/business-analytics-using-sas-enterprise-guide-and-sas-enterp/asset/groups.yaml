    \ MPG 的总和。对于变量 *高速公路 MPG*，总计可能没有意义。另一方面，如果它是一个表示银行账户余额的变量，那么总和将代表总体的总余额。这一数值可能对金融机构有价值。表中还呈现了其他值，例如\
    \ MPG 的均值为26.84。最小值为12，最大值为66。\n\n**表3.2：连续变量 MPG（高速公路）的频数分布**\n\n| 类别 | 度量 |\n\
    |---|---|\n| 数量（非缺失） | 428.00 |\n| 缺失数量 | 0.00 |\n| 总数 | 428.00 |\n| 总和 | 11,489.00\
