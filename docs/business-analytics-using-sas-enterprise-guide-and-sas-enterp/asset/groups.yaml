    # ### Output 8.5: View Horizontal Tree End Points


    ![](img/976d9b992e82c4ac7d195d03a30b4915_138_0.png)


    # ## Interpret the Findings


    The results of this analysis offer meaningful insights into the demographic characteristics
    of DMR customers with more than one subscription. If you consider DMR Customers
    with multiple subscriptions to be your best customers, there are several approaches
    you can take:


    +   - *Buy more prospect names:* You may decide to buy names from a list company
    with the same demographics as in the highest performing nodes. So for example,
    Node 12 and Node 14 identify the best performing customers. Nodes 13 and 15 identify
    reasonably high performing customers. So, you would look to purchase names that
    have the characteristics of Nodes 13 and 15.

    +   - *Target your worst customers:* Based on the known demographics of the worst
    performing customers, you might want to create additional products that would
    meet their needs. Node 10 represents a group of customers that show untapped potential.
    Developing and testing new products might prove to be a good business decision.

    +   - *Leverage your best customers:* These customers are already doing a lot
    of business with you. A simple survey of their other interests or preferred delivery
    channels may open new opportunities to increase profits within this customer group.'
