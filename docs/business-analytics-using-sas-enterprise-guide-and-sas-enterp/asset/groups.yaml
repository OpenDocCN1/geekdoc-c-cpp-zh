    \ | 39% | 10% |\n| 5 | 41-50 岁 | 11% | 42% | 9% |\n| 6 | 51 岁及以上 | 9% | 30% |\
    \ 6% |\n\n订阅百分比则显示出不同的结果。18 至 21 岁的年轻人人均订阅数更高。因此，他们带来了最大比例的收入。他们的钱包份额为 14%，而 51\
    \ 岁及以上人群仅为 6%。\n\n从这一分析中可以得出几个结论。如果您正在寻找能够带来高平均收入的额外订阅者，那么 18 至 21 岁市场是重点所在。这些订阅者似乎对当前产品最满意，尽管仍有很大的增长空间。\n\
    \n另一方面，如果强调新产品，企业可能会在其他年龄组中涌现增长机会。22 岁及以上客户的钱包份额为 10% 或更低。这一结果表明，可以开发针对 21 岁以上人群的产品。\n\
    \n## 现场笔记\n\n本案例研究为 DMR Publishing 提供了丰富的见解和潜在机会。公司如何利用这些信息，更多地取决于组织的能力。\n\n请注意，这里识别出了两个新的机会。第一个机会是寻找与当前订阅者群体相似的额外订阅者。寻找额外订阅者的工作可能由市场营销部门负责。第二个机会是为市场中服务不足的领域创造新产品。这种对新产品的需求很可能会成为业务中产品开发部门的一个项目。最优解决方案可能是两个部门的结合。\n\
    \n由于当前业务的市场增长和产品开发都很重要，管理层必须决定如何分配资源。当公司培养了大数据文化，使各部门能够在分析结果的实施中协作和合作，从而优化整个公司的利润时，才能看到最佳结果。\n\
