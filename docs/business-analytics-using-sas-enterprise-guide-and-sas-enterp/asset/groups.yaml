    - 2. 对于每个 *潜在客户年龄* 值，使用公式 *p*/(1 − *p*) 计算赔率。

    - 3. 最后的转换计算赔率的对数：log (*p*/(1 − *p*))。

    - 4. 参数估计是通过最大似然估计得出的，该方法会产生在给定数据下最可能出现的参数估计。参数估计与赔率的对数关系如下：log (*p*/(1 − *p*))
    = β0 + β1X1 + β2X2 + ... + βnXn，其中 β0 ... βn 为参数估计，X1 ... Xn 为预测变量。

    - 5. 在得出参数估计（也称为系数或权重（βs））后，使用以下公式计算最终概率：P = exp(β0 + β1X1 + β2X2 + ... + βnXn)/(1
    + exp(β0 + β1X1 + β2X2 + ... + βnXn))。该公式也可以写成更简单的形式如下：*p* = 1/(1 + exp(−(β0 +
    β1X1 + β2X2 + ... + βnXn)))。

