    \ 的 DMR 客户中有 75.1% 拥有不止一个订阅。节点 7 显示，收入高于 $51,500 的 DMR 客户中有 87.2% 拥有不止一个订阅。\n\n\
    在输出 8.4 中，最终节点显示拥有不止一个订阅的 DMR 客户比例范围很广。节点 10 的背景颜色最浅，拥有不止一个订阅的 DMR 客户比例最低（30.0%）。节点\
    \ 12 和节点 14 颜色最深，拥有不止一个订阅的 DMR 客户比例最高（分别为 90.8% 和 97.9%）。\n\n> **注意：** 无论是否存在缺失值，底部括号中都会显示“Or\
    \ Missing”。在当前数据中，没有缺失值，因此在本解读中可以忽略“Or Missing”。\n\n### 输出 8.5：查看水平树端点\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_138_0.png)\n\
    \n## 解读发现\n\n本分析的结果为拥有不止一个订阅的 DMR 客户的人口统计特征提供了有意义的洞察。如果你将拥有多个订阅的 DMR 客户视为最佳客户，可以采取以下几种方法：\n\
    \n- *购买更多潜在客户名单：* 你可以决定从名单公司购买与表现最佳节点具有相同人口统计特征的名单。例如，节点 12 和节点 14 识别出表现最佳的客户。节点\
    \ 13 和节点 15 识别出表现相当高的客户。因此，你会寻找购买具有节点 13 和节点 15 特征的名单。\n- *瞄准你表现最差的客户：* 基于表现最差客户的已知人口统计特征，你可能想创建满足其需求的其他产品。节点\
    \ 10 代表一组展现出尚未开发潜力的客户。开发和测试新产品可能被证明是一个良好的商业决策。\n- *充分利用你的最佳客户：* 这些客户已经与你开展了大量业务。对他们的其他兴趣或偏好交付渠道进行简单调查，可能会开辟新的机会，以提高该客户群体内的利润。\n\
    \n## 输出 8.7：查看节点规则——表现最差的节点\n\n```\n```\n*---------------------------------------------------------------*\n\
    Node = 10\n*---------------------------------------------------------------*\n\
    if HOUSEHOLD_INCOME < 17000\nAND AGE >= 22.5 or MISSING\nthen\nTree Node Identifier\
    \ = 10\nNumber of Observations = 820\nPredicted: MULTI_SUBS = 0.3146341463\n```\n\
    ```\n\n节点 10 是表现最差的组，多订阅率为 31.5%。这些订阅者的特征是低收入（每年低于 $17,000）且年龄大于 22.5 岁。针对该群体量身定制的一些新营销活动或产品可能会证明是有利可图的。\n\
    \n## 树分析的其他用途\n\n树分析可用于多种目标。在本章中，树被用作描述性分析。在第 9 章中，你将使用树节点开发一个具有二值结果的预测模型。树分析的第三种用途是创建变量，作为回归或神经网络模型的输入。树还可用于诊断和解释神经网络及其他高级建模技术的含义。只需将树指向神经网络预测目标并生长一棵树。有关第三种用途的更多信息，请参见\
    \ Barry de Ville 和 Padraic Neville（2013）所著的《Decision Trees for Analytics Using\
    \ SAS Enterprise Miner》。\n\n## 现场笔记\n\n随着大数据的涌入，对预测分析的需求在各行各业和各种应用中持续增长。从市场营销和风险到流程改进和人力资源，应用树模型的可能性无穷无尽。你构建强大树模型的能力，将使你能够为企业内各利益相关者提供有意义的洞察和方向。\n\
    \n作为掌握法拉利钥匙的人，你在塑造分析方面扮演着重要角色。换句话说，你可以使用 SAS 软件中的高级技术来分析大数据，并为客户和利益相关者提供洞察和方向。但是，由于大多数客户和利益相关者并不了解你做什么或如何做，你必须自始至终非常勤勉地对待你的流程。在每一步，问问自己，你所看到的内容从业务角度看是否合理。并且，记住要谨慎驾驶。\n\
    \n## 第 9 章：使用 SAS Enterprise Miner 进行预测分析\n\n- **引言** ........................................................................\
    \ 129\n- **选择** ................................................................................\
    \ 130\n  - 启动项目 .......................................................... 130\n\
    \  - 选择数据 .............................................................. 131\n\
    - **探索** ...............................................................................\
    \ 133\n  - StatExplore ....................................................................\
    \ 133\n  - MultiPlot .......................................................................\
    \ 136\n- **修改** ................................................................................\
    \ 138\n  - 通过插补替换缺失值 ................................... 138\n  - 将数据划分为子样本 ...........................................\
    \ 139\n  - 管理离群值 ...............................................................\
    \ 140\n  - 变换变量 .................................................... 142\n- **建模**\
    \ .................................................................................\
    \ 145\n  - 决策树 ..................................................................\
    \ 145\n  - 神经网络 ...............................................................\
    \ 147\n  - 回归 .....................................................................\
    \ 148\n- **评估** ................................................................................\
    \ 151\n- **现场笔记** ............................................................\
    \ 155\n\n## 引言\n\n在第 5 章至第 8 章中，你学习了查看和分析 DMR Publishing 数据，以了解过去和当前客户的特征与行为。在本章中，你将学习如何利用预测建模，从过去的行为和特征中发现并衡量模式，以预测未来行为。这是当今商业中最广泛使用的技术之一。\n\
    \n如第 1 章所述，预测建模在市场营销、风险、流程改进、客户留存等方面有众多用途。在本章中，你将使用信用风险数据构建一个模型，以预测贷款违约的可能性。\n\
    \n为实现目标，你将在 SAS Enterprise Miner 中启动一个项目，并逐步完成模型构建过程。你将探索和处理数据，为建模做准备。你将构建三种常见类型的模型：决策树、神经网络和回归模型。你将在评估节点中比较这三个模型。\n\
    \n模型开发的步骤如下：\n\n- *选择：* 启动项目，并将建模数据集引入项目。确保它与构建模型的业务目的相关。\n- *探索：* 使用可视化工具查看数据的分布和完整性。\n\
    - *修改：* 将数据划分为训练、测试和验证数据集。插补缺失值并过滤离群值。如有必要，变换或分段区间变量。为具有字符值或非顺序值的变量创建指示变量。\n-\
    \ *建模：* 开发三种不同的模型：决策树、神经网络和回归模型。\n- *评估：* 使用增益表和提升图比较这三个模型。\n\n> **注意：** 有关 SAS\
    \ Enterprise Miner 各个方面的支持文档，请参见主菜单中“帮助”下的“目录”部分。\n\n## 选择\n\n在本节中，你将在 SAS Enterprise\
    \ Miner 中启动项目，并为模型构建过程选择数据。\n\n## 启动项目\n\nABC 银行提供了一份客户数据“快照”，其中包含贷款违约客户和未违约客户。客户还款、余额和若干人口统计变量是从征信机构追加的，时间范围为六个月前。因变量是一个名为\
    \ LOAN_DEFAULT 的字段。该模型的目标是探究你是否能预测谁最有可能在六个月后贷款违约。\n\n打开 SAS Enterprise Miner，选择**新建项目**。为项目命名，并选择文件存储位置，如图\
    \ 9.1 所示。点击**下一步 ▶ 完成**。\n\n"
