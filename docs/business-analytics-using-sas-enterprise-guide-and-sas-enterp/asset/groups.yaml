    \ Remember that analysis is usually done in isolation, but the planning should\
    \ be done in concert with the major stakeholders and end-users to ensure the optimal\
    \ use of talent, time, and money.\n\nRemember that, in the end, your analysis\
    \ is only as good as your data. This fact is true for both the quality of the\
    \ data and how well it aligns with the objective of your analysis.\n\n## Chapter\
    \ 3: Overview of Descriptive and Predictive Analyses\n\n- Introduction ... 29\n\
    - Descriptive Analyses ... 30\n  - Frequency Distributions ... 30\n  - Cluster\
    \ ... 33\n  - Decision Tree ... 33\n- Predictive Analyses ... 35\n  - Linear Regression\
    \ ... 36\n  - Logistic Regression ... 39\n  - Neural Networks ... 41\n- Modeling\
    \ Process ... 43\n  - Define the Objective ... 43\n  - Develop the Model ... 43\n\
    \  - Implement the Model ... 48\n  - Maintain the Model ... 49\n- Notes from the\
    \ Field ... 52\n\n### Introduction\n\nIn this chapter, you will learn about different\
    \ types of descriptive and predictive analyses that are commonly used in business\
    \ today. Once your source data sets are loaded and you have all the supporting\
    \ documents necessary to access and understand the data, you are ready to start\
    \ your analysis.\n\nDescriptive analysis consists of tables, charts, and graphs\
    \ that unveil data patterns, trends, and relationships that can inform your strategies,\
    \ decisions, and actions. Predictive analysis tools like regression, decision\
    \ trees, and neural networks give you the power to prioritize and optimize a broad\
    \ range of marketing, risk, and process decisions.\n\nYou will see examples of\
    \ each type of analysis with guidelines to determine when to use descriptive analysis\
    \ and when to use predictive analysis. The goal of this chapter is to help you\
    \ see opportunities to increase your competitive advantage by interpreting both\
    \ descriptive and predictive analyses and taking appropriate business actions.\n\
    \n### Descriptive Analyses\n\nThe purpose of descriptive analysis is to reveal\
    \ the characteristics of your data. It can describe a single point in time or\
    \ cover a trend over multiple time intervals. When first receiving data, you should\
    \ start with a simple descriptive analysis such as a frequency for categorical\
    \ variables, and a distribution analysis for continuous variables. Both sets of\
    \ results can be displayed with tables and graphs.\n\n### Frequency Distributions\n\
    \nA *frequency distribution* is a representation of the basic shape or distribution\
    \ of a variable in a data set. The frequency distribution can be displayed in\
    \ a table or a graph. The components of the table are different depending on whether\
    \ you are viewing a class variable or a continuous variable.\n\nThe examples in\
    \ this section are calculated on data taken from automobile research.\n\n**Class\
    \ Variables**\n\nA frequency distribution table for a class variable typically\
    \ displays counts and percentages. Table 3.1 shows a simple frequency analysis\
    \ in a table that displays the frequency counts and percentages of the variable\
    \ *Type (of car)*. You can easily see that 262 cars, or 61.2%, of the cars represented\
    \ by this data are *sedans*.\n\n**Table 3.1: Frequency Distribution Table for\
    \ the Class Variable Type (of Car)**\n\n| Value | Frequency Count | Total Frequency\
    \ (%) |\n| --- | --- | --- |\n| Sedan | 262 | 61.2150 |\n| SUV | 60 | 14.0187\
    \ |\n| Sports | 49 | 11.4486 |\n| Wagon | 30 | 7.0093 |\n| Truck | 24 | 5.6075\
    \ |\n| Hybrid | 3 | 0.7009 |\n\nFigure 3.1 shows the same information in a bar\
    \ chart. Although you can’t see exact percentages in the bar chart, this view\
    \ can be easier for a quick comparison. You may want to use both because some\
    \ people prefer tables, while others prefer visual displays of data such as charts.\n\
    \n**Figure 3.1: Frequency Distribution Bar Chart for the Class Variable Type (of\
    \ Car)**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_43_0.png)\n\n**Continuous\
    \ Variables**\n\nA frequency distribution table for a continuous variable typically\
    \ displays population measures, such as the values for mean, median, minimum,\
    \ and maximum. Table 3.2 displays the values for the variable *miles per gallon\
    \ (MPG)* on the highway. You can read the number of total observations in the\
    \ data (428). No values are missing. The total of 11,489 is the sum of MPG for\
    \ the whole set of cars represented here. For the variable *MPG Highway*, the\
    \ total may not be meaningful. On the other hand, if it were a variable representing\
    \ bank account balances, the sum would represent the total balances for the population.\
    \ This value could be of interest to a financial institution. Additional values\
    \ represented in the table are the mean MPG with a value of 26.84. The minimum\
    \ is 12, and the maximum is 66.\n\n**Table 3.2: Frequency Distribution for the\
    \ Continuous Variable MPG (Highway)**\n\n| Category | Measure |\n|---|---|\n|\
    \ Number (Nonmissing) | 428.00 |\n| Number Missing | 0.00 |\n| Total Number |\
    \ 428.00 |\n| Sum | 11,489.00 |\n| Minimum | 12.00 |\n| Mean | 26.84 |\n| Median\
    \ | 26.00 |\n| Maximum | 66.00 |\n| Standard Mean | 0.28 |\n\nFigure 3.2 displays\
    \ the frequency distribution in a bar chart. The values are bucketed to show the\
    \ underlying nature of the data. When you view the frequency distribution bar\
    \ chart of a continuous variable, you learn additional information, such as the\
    \ skewness of the distribution.\n\n**Figure 3.2: Frequency Distribution Bar Chart\
    \ for the Continuous Variable Miles per Gallon (Highway)**\n\n![](img/976d9b992e82c4ac7d195d03a30b4915_44_0.png)\n"
  mdcn: "\n## 来自一线的笔记\n\n在本章中，你已经了解到用于分析的数据会以多种形式、来自多个来源。为分析准备数据的第一步，是理解所有数据集是如何、以及从哪里提取出来的。当数据是购买来的，或从陌生来源提取时，你应索取包含每个字段定义的数据字典。务必知道每个字段的含义及其推导方式（如适用）。此外，还要索取每个字段的计数、范围和简单统计量，例如均值、中位数、最小值、最大值和标准差。\n\
    \n与信息技术部门的人交朋友。他们可以成为宝贵的合作者。如果可能，他们能帮你获取负责创建数据的人员姓名。在你确定自己理解数据之前，不要犹豫，尽管提问。\n\n\
    数据可能具有诱惑力。如果你正在启动一个新项目，你可能会急于从尽可能多的来源收集尽可能多的数据。然而，面对可用于分析的数据量，好东西太多也可能让人无所适从。\n\
    \n最好的方法是分阶段推进。从第1章的问题开始：*你的目标是什么？* 如果你有很多目标，选择最重要的两三个。然后，与你的数据管理团队合作优化流程。如果运营或定价方面的考虑证明有必要收集大量数据，那么就聚焦于少数几个会产生最大影响的数据。记住，分析通常是独立完成的，但规划应与主要利益相关者和最终用户协同进行，以确保人才、时间和资金得到最优利用。\n\
