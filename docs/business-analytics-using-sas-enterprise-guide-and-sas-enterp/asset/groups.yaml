    属性窗口已填充默认的缺失值插补方法。分类变量将替换为计数最高的值。最高计数值用作婚姻状况的替换值。回想一下，性别有一个值为 U，表示*未知*。您可以保持该值不变：有时性别未知这一事实本身具有预测性。如果该值缺失，则会设置为
    M，因为性别 = M 的客户计数更高。


    对于区间变量，默认方法是用均值替换缺失值。由于您的缺失值数量较少，此默认方法已足够。如果缺失值百分比更大，那么使用更高级的方法（如树）可能会更好。要了解有关树插补方法的更多信息，请参阅
