    # **C Statistic**


    The *C* statistic is useful in providing a quick assessment of the model fit.
    It is a function of the percent concordant, percent discordant, percent tied,
    and total pairs. They are defined as follows:


    +   - *Percent Concordant:* For all pairs of observations with different values
    of the dependent variable (response = 1/0), a pair is *concordant* if the observation
    with target value (response = 1) has a higher predicted event probability than
    the observation with the nontarget value (response = 0).

    +   - *Percent Discordant:* For all pairs of observations with different values
    of the dependent variable (response = 1/0), a pair is *discordant* if the observation
    with target value (response = 1) has a lower predicted event probability than
    the observation with the nontarget value (response = 0).

    +   - *Percent Tied:* For all pairs of observations with different values of the
    dependent variable (response = 1/0), a pair is *tied* if the observation with
    target value (response = 1) has an *equal* predicted event'
