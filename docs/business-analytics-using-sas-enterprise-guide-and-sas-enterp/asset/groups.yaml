    Default models have been used to determine risk for several decades. On the basis
    of an individual’s or business’s credit history, financial profile, demographics,
    or similar data, a lending institution or other business can determine its applicant’s
    likelihood of meeting his or her loan obligation. Predicting the likelihood of
    default or bankruptcy has been a main profit-driver of the loan industry for many
    years. Whether it’s for a mortgage, credit card, car loan, or even utility service,
    many companies rely on a credit score to determine approval and terms of a contract.
    Banks also use aggregations of the expected loss to meet regulatory requirements
    for loan reserves.


    ## Loss-Given-Default

    At the point of default, *loss-given-default models* are used to estimate the
    size of the loss. Some loans, such as mortgages and automobile loans, are secured,
    meaning that the bank holds the title to the home or automobile for collateral.
    The risk is then limited to the loan amount minus resale value of the home or
    car. Unsecured loans are loans for which the lender holds no secured assets, such
    as credit cards.


    Many other industries incur risk by offering a product or service with the promise
    of future payment. This category includes telecommunications companies, energy
    providers, retailers, and many others. The type of risk is similar to that of
    the banking industry in that it estimates the probability of a customer’s defaulting
    on the payment for goods or services.


    ## Claim

    For the insurance industry, the risk is that of a customer’s filing a claim. The
    basic concept of insurance is pool risk. Insurance companies have decades of experience
    in managing risk. Insurance companies use predictive model scores to determine
    approval, optimize pricing, and determine reserve levels for life, health, auto,
    and homeowners insurance on the basis of demographics, risk factors including
    claim history, and credit risk factors. Because of heavy government regulation
    of pricing in the insurance industry, managing risk is critical to insurance companies’
    profitability. Warranty companies often use product information and safety records
    to model the likelihood of a claim.


    ## Fraud

    With the increase in electronic and online transactions, fraud is increasing at
    an alarming rate. According to fraud research by the 2012 Global Fraud Study,
    survey participants estimated that the organizations lose an average of 5% of
    their revenues to fraud each year (Association of Certified Fraud Examiners 2012).
    Applied to the 2011 gross world product, this figure translates to a potential
    projected annual fraud loss of more than $3.5 trillion. Because of fraudulent
    purchases made with stolen credit cards, fake insurance claims (including life,
    health, and auto), stolen cellular usage, false tax returns, account fraud through
    Automated Clearing House, and money laundering, fraud increases costs for businesses
    and consumers alike.


    Powerful models are in use and in development to thwart these costly actions.


    Credit card banks use predictive models to identify the types of purchases that
    are typically made with a stolen card. For example, if the card is used to purchase
    expensive jewelry, furs, or firearms, the bank will freeze the card until the
    cardholder can verify the charges.


    Insurance claim fraud is also costly to insurers and policyholders. Historically,
    every claim was personally inspected for fraud. Today, predictive models can estimate
    the likelihood that a claim is fraudulent based on common characteristics of past
    fraudulent claims. This model allows insurers to reduce expenses by automating
    the approval of low-risk claims and placing a priority on claims with a high likelihood
    of fraud.


    Government institutions, including the Internal Revenue Service and social service
    agencies such as Medicare and the Social Security Administration, use predictive
    models to identify false tax returns or requests for benefits.


    ## Lifetime Value

    Lifetime value (LTV) is the expected value of a prospect or customer over a specified
    period of time, measured in today’s dollars. When calculated with the use of a
    series of models or other estimates, it allows a company to make decisions that
    optimize overall profits.


    LTV is measured in various ways, depending on the industry, but basically it represents
    the value of future revenues minus overhead and expenses. It can be estimated
    from a series of estimates from models or other sources that may consider one
    or more of the following: response, activation, retention, risk, cross-sell, up-sell,
    and revenue. This evaluation enables companies to allocate resources based on
    customer value or potential customer value.


    Historically, marketing strategies were driven by the financial benefits of a
    single campaign. Customer profitability was optimized by the net profits of the
    initial sale. With the increased cost of acquiring customers and the expansion
    of products and services to existing customers, companies are expanding their
    marketing strategies to consider the LTV of a potential customer.


    LTV measurements on a customer portfolio can quantify the long-term financial
    health of a company or business. However, focusing on long-term goals can be challenging
    for companies if they suboptimize short-term profits.


    The customer life cycle comprises three main phases (Figure 1.1):

    - prospect

    - new or established customer

    - former or lapsed customer


    Many opportunities for developing predictive models exist within the life cycle.


    ### Figure 1.1: Customer Life Cycle

    ![](img/976d9b992e82c4ac7d195d03a30b4915_21_0.png)


    A prospect can be modeled for the propensity to respond or to activate. The risk
    level can also be estimated with predictive modeling or segmentation. By combining
    response, activation, or risk models with some customer value estimates such as
    retention (churn) or subsequent revenues, companies can calculate a prospect’s
    LTV.


    After a prospect becomes a customer, numerous additional modeling opportunities
    exist. Finally, after the customer relationship ends, models can be developed
    to improve profitability. By integrating models into a customer relationship management
    program, companies can reduce expenses while improving the efficiency of their
    marketing efforts.


    ## Predictive Modeling Opportunities by Industry

    In the past few decades, predictive models have gained popularity across a variety
    of industries. Statisticians and data miners have found that the methods pioneered
    by the financial services industry have broad applicability to most other industries.


    For all of the industries listed in this section, a combination of factors drives
    profitability. The financial impact of these factors can be predicted with the
    following types of models:


    ### Banks: Credit Card, Retail, Mortgage, and Savings and Loan

    - *response model*—to target offers for loans

    - *default model*—to predict non-payment or bankruptcy

    - *revenue model*—to estimate the amount of purchases and earned interest

    - *retention/loyalty/attrition model*—to estimate the optimal combination of pricing
    and services

    - *cross-sell/up-sell model*—to increase usage on credit cards or purchase additional
    products and services such as investment products, retail banking services (savings
    and checking accounts), refinance of mortgage, etc.

    - *fraud model*—to detect lost or stolen cards or identity theft

    - *collection model*—to prioritize resources in the collection of debt


    ### Insurance Companies: Life, Health, Auto, Property, and Casualty

    - *response model*—to target offers for insurance

    - *default model*—to predict likelihood of claims

    - *retention/loyalty model*—to estimate the optimal combination of pricing and
    services

    - *cross-sell/up-sell model*—to increase insurance coverage (life) or purchase
    other types of insurance

    - *fraud model*—to predict the likelihood of a false insurance application or
    claim


    ### Retailers: Catalog Companies and Retail

    - *response model*—to target offers for goods and services

    - *catalog companies and offline retailers*—to reduce snail mail costs

    - *online retailers*—to improve targeting

    - *revenue model*—to estimate the amount of the purchases

    - *retention/loyalty model*—to estimate the optimal combination of marketing actions
    and incentives

    - *cross-sell/up-sell model*—to increase repeat sales


    ### Telecommunications Companies: Cable, Internet, Wired-phone, and Cellular

    - *response model*—to target offers for phone or internet service

    - *revenue model*—to estimate the amount of usage

    - *retention/loyalty model*—to estimate the likelihood of cancellation or churn

    - *default model*—to predict the likelihood of defaulting on payment

    - *cross-sell/up-sell model*—to increase usage and optimize product and service
    bundling

    - *fraud model*—to predict illegal access to services

    - *process failure model*—to predict grid or supply-chain failure


    ### Entertainment and Social Media Industry: Radio, Television, Social Media,
    and Online Sharing Sites

    - *response model*—to increase click-through, views, and purchases based on variations
    in ad content, timing, and placement

