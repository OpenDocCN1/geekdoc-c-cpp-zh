    +   - *Do you need to determine the most effective channel or sequence of channels?*
    Analysis of purchase behavior can identify and measure which channel or sequence
    of channels is most efficient.

    +   - *Do you need to optimize the frequency of your offers?* Analysis based on
    frequency testing can indicate how often to send an offer. This frequency strategy
    may vary greatly by channel in terms of both cost and results.

    +   - *Do you need to deliver the right message to the right person at the right
    time through the right channel?* This objective is every marketer’s overall goal
    and encompasses all of the more specific goals.


    So far, the list of goals concerns selling a product or service. Other business
    uses of data analysis that can result in cost reductions and higher profits may
    involve answering the following related questions:


    +   - *Do you need to avoid process failure?* Companies in a variety of industries
    are modeling data collected from production lines, customer feedback, hospital
    error, and similar sources to predict breakdowns and take corrective actions.

    +   - *Do you need to analyze health treatments?* Predictive models in the life
    sciences have saved money and lives. Models that predict disease outbreaks are
    used to calculate inventory in high-risk geographic regions.

    +   - *Do you need to optimize your inventory?* Knowing how many of what products
    to have on hand in a specific location can save time and money.

    +   - *Do you need to optimize your staffing?* Demand can be predicted, which
    enables stores, resorts, and other businesses to know exactly whom to have on-site
    or available for work.

    +   - *Do you need to predict the best location for a future store, restaurant,
    or other business?* Planning growth can be facilitated by the prediction of sales
    for a specific geographic area.


    For numerous other examples of goals, see *Predictive Analytics* (Siegel and Davenport
    2013).


    To achieve your goals, you will choose appropriately from a variety of analyses.
    The two major categories of analysis are *Descriptive Analysis* and *Predictive
    Analysis*.


    # ## Descriptive Analyses


    *Descriptive analysis* is a technique that allows you to view and measure your
    company and customer characteristics. The results of the analysis can be used
    to guide decisions in every area of your company. Therefore, descriptive analysis
    is an essential first step to managing your business.


    # ## Customer Profile


    Because your best customers typically drive your company’s profitability, analyzing
    your customer base is a good first step. This provides a snapshot of exactly who
    is buying your products or services.'
  - '[PAGE 16]


    A customer profile analysis identifies and measures the characteristics of your
    most profitable customers. Insights gained from this analysis can be used to enhance
    and customize your marketing activities. Customer profile analysis involves measuring
    common characteristics within a population of interest. Demographics, such as
    average age, gender (percent male), marital status (percent married, percent single,
    and so on), and average length of residence, are typically included in a profile
    analysis. Other measures might be more business-specific, such as the age of a
    customer relationship or the average risk level.


    Also, if you find distinct characteristics that define a particularly profitable
    segment, you can match those characteristics to names on other databases or external
    lists and purchase new names for marketing. Similarly, if you identify the most
    and least profitable customers, you can focus your retention efforts and offer
    varying levels of customer service.


    # Customer Loyalty


    Loyalty is an aspect of the customer profile that is measured by the length of
    the relationship, the amount of spending, or a combination thereof. Unlike customer
    profile analysis, which is more of a snapshot of your base, customer loyalty analysis
    looks at your customer base over time. History tells us that, on average, loyal
    customers bring in more revenue at a lower cost.


    # Market Penetration or Wallet Share


    Market penetration analysis and wallet share analysis are techniques for measuring
    the performance of your customer base in comparison with the performance of the
    overall market for your industry. These analyses typically look at these measures
    across selected demographics or other characteristics, or a combination thereof.


    Your company’s market penetration compares the number of customers in your base
    to the possible customers in the overall market. Wallet share compares your revenues
    to those available in the market. It is powerful for determining how much potential
    lies with a specific segment as defined by a demographic or behavioral characteristic.


    Wallet share analysis can be used to prioritize marketing dollars in industries
    where the customer has a fixed amount to spend with multiple businesses (their
    “wallet”). You calculate it by taking the amount that the customer is spending
    with your company and dividing it by the total that they have to spend with you
    and your competitors.


    # Predictive Analyses


    Predictive analysis uses statistics, machine learning, or data mining to develop
    models that predict future events on the basis of current or past data. In business,
    there are numerous models that are commonly used.'
  - '[PAGE 17]


    # Marketing Models


    *Marketing models* are models that are built and used specifically for growing
    your business.


    # Response


    A *response model* is typically the first type of target model that a company
    seeks to develop. If no targeting was done in the past, a response model can provide
    a significant boost to the efficiency of a marketing campaign by increasing responses
    or reducing expenses. The objective is to predict who will respond to an offer
    for a product or service. It can be based on past behavior of a similar population
    or some logical substitute. For more detail on data for modeling, see Chapter
    2.


    # Win-Back


    A *win-back model* is used to invite former customers to reconsider their relationship
    to the business. These models can be powerful, because you already have good behavioral
    data on these former customers. You should consider risk and retention measures
    when appropriate.


    # Activation


    An *activation model* predicts whether a prospect will become a customer. It is
    applicable only in certain industries, most commonly credit card and insurance.
    For example, for a credit card prospect to become an active customer, the prospect
    must respond, have their credit approved, and use the account. If the customer
    never uses the account, he or she actually costs the bank more than a noncustomer.
    Most credit card banks offer incentives, such as low-rate purchases or balance
    transfers, to motivate new customers to activate. An insurance prospect can be
    viewed in much the same way. A prospect can respond and be approved, but if he
    or she does not pay the initial premium, the policy is never activated.


    # Revenue


    A *revenue model* predicts the dollar amount of an expected sale. This model is
    useful for distinguishing low-value from high-value responders or customers. For
    example, if a prospect becomes a customer after buying a product online, he or
    she has a specific value based on the amount of that purchase.


    # Usage


    A *usage model* predicts the amount of use given to a product or service. This
    model is most applicable to the telecommunications companies that determine their
    profits by estimating minutes of usage. Life sciences companies predict disease
    outbreaks in specific geographic locations, on the basis of doctor visits, sales
    of prescriptions, and over-the-counter drugs.


    # Cross-Sell and Up-Sell


    A *cross-sell model* is used to predict the probability or value of a current
    customer’s buying a different product or service from the same company. An *up-sell
    model* predicts the probability or value of a customer’s buying more of the same
    product or service.'
  - '[PAGE 18]


    Selling additional products or services to current customers is quickly replacing
    new customer acquisition as one of the easiest ways to increase profits. Testing
    offer sequences can help to determine what the next offer should be and when to
    make it. This testing enables companies to carefully manage offers to avoid over-soliciting
    and possibly alienating their customers.


    # Loyalty, Attrition, and Churn


    A familiar mantra in marketing is, “It costs less to retain a customer than it
    does to replace one.” Every company benefits from loyal customers. *Loyalty*,
    also known as *retention*, can be thought of as the opposite of *attrition*—the
    loss of a customer relationship. For highly competitive industries where markets
    are close to saturation, these terms are particularly relevant. Industries that
    count on renewals, such as insurance, telecommunications, and publishing, pay
    close attention to retention and attrition.


    *Attrition* is defined as a decrease in the use of a product or service. For credit
    card banks, attrition is the decrease in balances on which interest is earned.
    It occurs when customers switch companies, usually to take advantage of a better
    deal. For years, credit card banks lured customers from their competitors by offering
    low interest rates. Telecommunications companies continue to use strategic marketing
    tactics to lure customers away from their competitors. Many other industries spend
    much effort to retain customers and steal new ones from their competitors.


    For several decades, credit cards have been offered to almost every segment of
    the population, resulting in a saturated market. This reality means that credit
    card banks are now forced to increase their customer base primarily by luring
    customers from other providers. Their tactic is to offer low introductory interest
    rates for anywhere from three months to one year or more on either new purchases
    or balances transferred from another provider, or both. Their hope is that customers
    will keep their balances with the bank after the interest converts to the normal
    rate. Many customers, though, are savvy about keeping their interest rates low
    by moving balances from one card to another before the rate returns to normal.
    These activities introduce several modeling opportunities. One kind of model predicts
    the customer’s reduction or ending of the use of a product or service after an
    account is activated.


    In some industries, attrition becomes cyclical and is known as *churn*, which
    is defined as customers’ closing of one account in conjunction with the opening
    of another account for the same product or service, usually at a reduced cost.
    Companies have learned that it is cheaper to keep a customer happy than to replace
    him or her. To this end, retention and attrition modeling have become popular
    in some industries.


    Businesses use social network analysis to predict churn by examining the group
    behavior. By measuring the density of connection in a mobile phone network, for
    example, cellular companies are able to predict patterns of churn and take proactive
    steps to retain their customers.


    # Risk and Approval Models


    *Risk models*, or *approval models*, are unique to industries that assume the
    potential for loss when offering a product or service. The most familiar kinds
    of risk occur in the banking and insurance'
