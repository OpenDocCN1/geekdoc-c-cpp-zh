    # ## Introduction


    In this chapter, you will learn about different types of descriptive and predictive
    analyses that are commonly used in business today. Once your source data sets
    are loaded and you have all the supporting documents necessary to access and understand
    the data, you are ready to start your analysis.


    Descriptive analysis consists of tables, charts, and graphs that unveil data patterns,
    trends, and relationships that can inform your strategies, decisions, and actions.
    Predictive analysis tools like regression, decision trees, and neural networks
    give you the power to prioritize and optimize a broad range of marketing, risk,
    and process decisions.


    You will see examples of each type of analysis with guidelines to determine when
    to use descriptive analysis and when to use predictive analysis. The goal of this
    chapter is to help you see opportunities to increase your competitive advantage
    by interpreting both descriptive and predictive analyses and taking appropriate
    business actions.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # Descriptive Analyses


    The purpose of descriptive analysis is to reveal the characteristics of your data.
    It can describe a single point in time or cover a trend over multiple time intervals.
    When first receiving data, you should start with a simple descriptive analysis
    such as a frequency for categorical variables, and a distribution analysis for
    continuous variables. Both sets of results can be displayed with tables and graphs.


    # ## Frequency Distributions


    A *frequency distribution* is a representation of the basic shape or distribution
    of a variable in a data set. The frequency distribution can be displayed in a
    table or a graph. The components of the table are different depending on whether
    you are viewing a class variable or a continuous variable.


    The examples in this section are calculated on data taken from automobile research.


    # ### Class Variables


    A frequency distribution table for a class variable typically displays counts
    and percentages. Table 3.1 shows a simple frequency analysis in a table that displays
    the frequency counts and percentages of the variable *Type (of car)*. You can
    easily see that 262 cars, or 61.2%, of the cars represented by this data are *sedans*.


    **Table 3.1: Frequency Distribution Table for the Class Variable Type (of Car)**


    | Value | Frequency Count | Total Frequency (%) |

    | --- | --- | --- |

    | Sedan | 262 | 61.2150 |

    | SUV | 60 | 14.0187 |

    | Sports | 49 | 11.4486 |

    | Wagon | 30 | 7.0093 |

    | Truck | 24 | 5.6075 |

    | Hybrid | 3 | 0.7009 |'
  merge: -1
  img_proc: true
