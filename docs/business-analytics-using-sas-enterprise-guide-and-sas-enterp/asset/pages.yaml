- pgno: 7
  md: '# About This Book


    # Purpose


    This book serves as a tutorial for data analysts who are new to SAS Enterprise
    Guide and SAS Enterprise Miner. It provides valuable hands-on experience using
    powerful statistical software to complete the kinds of business analytics common
    to most industries. With clear, illustrated, step-by-step instructions, it will
    lead you through examples based on business case studies. You will formulate the
    business objective, manage the data, and perform analyses that you can use to
    optimize marketing, risk, and customer relationship management, as well as business
    processes and human resources.


    # Prerequisites


    If you are a savvy business person with a desire to understand what drives your
    business, then this book can help you get started. You need access to SAS Enterprise
    Guide or SAS Enterprise Miner software; we provide you with example data to get
    started, but you will need data to analyze. An understanding of basic statistics
    is helpful, but not required.


    # Organization


    The book begins by helping you determine and structure the objective of your analysis
    in accordance with the goals and objectives of your organization or department.


    Chapter 2 describes types and sources of data for analysis. Chapter 3 offers an
    overview of common business analyses, covering both descriptive and predictive
    analysis. Chapter 4 shows you how to construct a data set for analysis. Chapter
    5 details step-by-step instructions for a simple descriptive analysis. Chapter
    6 offers the same level of detail for a typical market analysis. Chapters 7 and
    8 offer a step-by-step guide to cluster and tree analyses, respectively. Each
    chapter concludes with a section headed “Notes from the Field,” which offers related
    business advice and leadership tips.


    To conclude, Chapter 9 brings several concepts together in a full step-by-step
    case study for building and comparing predictive models, culminating in final
    “Notes from the Field.”'
  merge: -1
  img_proc: true
