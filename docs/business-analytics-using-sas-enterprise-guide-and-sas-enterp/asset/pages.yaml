    better understanding of its customer base. The team wants to know whether all
    their customers look alike, or whether they naturally segment into different groups.
    The segmentation is performed with SAS Enterprise Miner.


    The project has eight steps:


    +   1. Initiate the project in SAS Enterprise Miner 13.1.

    +   2. Input data and assign variable roles.'
