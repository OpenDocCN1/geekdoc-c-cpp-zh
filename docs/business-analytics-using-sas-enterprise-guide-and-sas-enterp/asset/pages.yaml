    # Results


    Reporting your results is one of the most important steps in your analysis. If
    you do everything right and can communicate the results, your efforts and insights
    will be wasted.


    In Output 6.5, the final report displays the market penetration analysis and share
    of wallet by age group. When you are evaluating the percentage of subscribers,
    the lowest market penetration is in the 18 to 21-year-old age group. It is higher
    with 26 to 50-year-olds, at 10% to 11%. It drops slightly at age 51 or older (9%).


    # Output 6.5: Final Penetration Analysis by Age Group


    | Row number | AGE_GROUP | PCT_OF_SUBSCRIBERS | PCT_OF_SUBSCRIPTIONS | PCT_OF_REVENUE
    |

