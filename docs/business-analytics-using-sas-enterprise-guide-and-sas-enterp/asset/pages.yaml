- pgno: 35
  md: 'NOTE: Some companies sell to both consumers and businesses. Their databases
    are either separate or are a hybrid of both business and consumer data.


    Even though there may be wide variation among companies and industries, the following
    are key elements in a typical customer database:


    +   - **Company ID** is a unique numeric or alphanumeric code that identifies
    the company throughout its life cycle.

    +   - **Headquarter ID** is a unique numeric or alphanumeric code that identifies
    the headquarter (HQ) of the company throughout its entire life cycle.

    +   - **DUNS number (site)** is a unique ID that is available through Dun and
    Bradstreet (D&B). This ID allows for mapping to firmographic data provided by
    D&B.

    +   - **DUNS number (other)** is one of a series of numbers that can match each
    site to its HQ, domestic ultimate (DU), or global ultimate (GU). It may be the
    same as the site ID if the site is also the HQ, DU, or GU.

    +   - **Company name** is the name of the business. For a sole proprietor, it
    may be a person''s name.

    +   - **Physical address** is typically broken into components such as number,
    street, suite or apartment number, city, state, postal code, and country. Business
    addresses are more stable than addresses for individuals, especially companies
    with many employees.

    +   - **Phone number** is the main number for the organization and typically includes
    area code and country code. If the data is at a contact level, the phone number
    may include area code, country code, and, if applicable, extension.

    +   - **Company URL or web address** can also serve as a unique identifier.

    +   - **Firmographic data** resembles demographic data but is at the company level.
    It includes industry, number of employees, age of company, annual sales, growth
    rate, standard industrial classification codes, and the like.

    +   - **Product or service IDs** typically consist of a list of identification
    numbers that vary by company. Product or service IDs may reside in a separate
    database that is linked by the company ID.

    +   - **Model scores** such as response, risk, retention, profitability scores,
    or any other scores may be purchased or developed in-house. These scores may reside
    in a separate database that is linked by the company ID.


    # Contact Database


    The contact database contains data about the employees of companies found in the
    company database, as follows:


    +   - **Contact ID** is a unique numeric or alphanumeric code that identifies
    the contact throughout his or her entire life cycle.

    +   - **Contact name** is the name of a customer or prospect. It is usually broken
    down into multiple fields: last name, first name, middle name or initial, and
    salutation.'
  merge: -1
  img_proc: true
