    The following steps detail the construction of the logit function in simple language.
    This logistic regression example does not duplicate the data represented in the
    above graph, but it conveys the general idea:


    +   1. For each value of *prospect''s age*, calculate a probability (*p*) by averaging
    the values of response.

    +   2. For each value of *prospect''s age*, calculate the odds by using the formula
    *p*/(1 − *p*).

    +   3. The final transformation calculates the log of the odds: log (*p*/(1−*p*)).

    +   4. The parameter estimates are derived using maximum likelihood estimation,
    which produces the parameter estimates that are most likely to occur given the
    data. The parameter estimates are related to the log of the odds as follows: log
    (*p*/(1 − *p*)) = β0 + β1X1 + β2X2 + ... + βnXn, where β0 ...βn are the parameter
    estimates and X1 ... Xn are the predictive variables.

    +   5. After the parameter estimates, also called coefficients or weights (βs),
    are derived, the final probability is calculated using the following formula:
    P = exp(β0 + β1X1 + β2X2 + ... + βnXn)/(1 +'
  merge: -1
