- pgno: 58
  md: 'You create the deciles by sorting the file by its score or probability (high
    to low) and by then dividing it into 10% groupings. Each decile can display a
    number of calculations including quantities, mean performance, and lift.


    You see that Table 3.4 offers a lot of information. The following list describes
    each column in order, from left to right:


    +   1. **Decile:** Ordered from 1 to 10, decile 1 is the best performing decile
    and decile 10 is the worst performing decile based on response rate.

    +   2. **Number of Records:** The value for records is the number of people or
    other data points in the population. Each decile is approximately 10% of the population.

    +   3. **Mean Predicted Response (%):** Column 3 displays the average response
    rate predicted by the model.

    +   4. **Mean Actual Response (%):** Column 4 displays the average actual response
    rate reflected in the data.

    +   5. **Cumulative Mean Actual Response (%):** The average actual response rate
    is reflected in the data cumulative down through each decile.

    +   6. **Number of Responders (% of Total):** Column 6 displays the count of responders
    in each decile.

    +   7. **Cumulative Total Responders (%):** Column 7 displays the cumulative count
    of responders down through each decile.

    +   8. **Lift:** Column 8 displays the model efficiency at each decile (further
    explanation below).

    +   9. **Cumulative Lift:** Column 9 displays the cumulative model efficiency
    down through each decile (further explanation below).


    Lift is a measure of the model''s ability to beat the random approach or average
    performance. Lift is another way of describing the model''s efficiency. The higher
    the lift, the more powerful the model. The lift in Decile 1 is 241. This means
    that the model performance is 2.41 times better than random or average in the
    top decile.


    Cumulative lift shows the efficiency of a group of deciles starting with the best.
    For example, if we look at the top three deciles: if you mailed a random 30% of
    the file, you would expect to get 30% of the potential responders. Looking at
    column 6 in the top three deciles, the model captures (638 + 427 + 376) / 2649
    = 54.40% of the potential responses. So the cumulative lift is 54.40/30*100 =
    181. This result is equivalent to saying that you get an 81% higher-than-average
    response rate at a 30% depth of file, or that the model does 1.81 times better
    than average at 30% depth of file.


    # Gains Chart


    A gains chart is a graphical representation of the cumulative percentage of a
    target group as compared to a random or average result at each decile, or 10%
    of the file. It is an excellent visual tool for showing the'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'power of a model (Figure 3.10). For example, at 50% of the file, you can capture
    71% of the responders, which represents a 45% increase in responses over a random
    selection.


    # **Figure 3.10: Gains Chart Comparing Percentage of Responders for the Model
    with Percentage of Random Selection of the General Population**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_59_0.png)


    # **C Statistic**


    The *C* statistic is useful in providing a quick assessment of the model fit.
    It is a function of the percent concordant, percent discordant, percent tied,
    and total pairs. They are defined as follows:


    +   - *Percent Concordant:* For all pairs of observations with different values
    of the dependent variable (response = 1/0), a pair is *concordant* if the observation
    with target value (response = 1) has a higher predicted event probability than
    the observation with the nontarget value (response = 0).

    +   - *Percent Discordant:* For all pairs of observations with different values
    of the dependent variable (response = 1/0), a pair is *discordant* if the observation
    with target value (response = 1) has a lower predicted event probability than
    the observation with the nontarget value (response = 0).

    +   - *Percent Tied:* For all pairs of observations with different values of the
    dependent variable (response = 1/0), a pair is *tied* if the observation with
    target value (response = 1) has an *equal* predicted event'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'probability to the observation with the nontarget value (response = 0). In
    other words, it is neither concordant nor discordant.


    +   - Pairs: This number is the total number of possible paired combinations with
    different values of the dependent variable. The C statistic is defined as (nc
    + 0.5(t − nc − nd))/t, where t = the total number of pairs with different response
    values, nc = the number of concordant pairs, and nd = the number of discordant
    pairs.


    # Implement the Model


    Model implementation is not a step in the model-building process per se, but discussing
    how to implement the model correctly is important for one reason: a perfectly
    good model will look like a bad model if not implemented correctly.


    In many situations, a model is developed to replace an existing model. The old
    model might not be performing, or perhaps some new predictive information is available
    that can be incorporated into a new model. Whatever the reason, you will want
    to compare the new model, or the “challenger,” to the existing model, or “champion.”
    Again, depending on your goals, various ways exist to select your group of names
    for testing.


    In Figure 3.11, the entire population is represented by the rectangle. The ovals
    represent the names selected by each model. If your “champion” model is still
    performing well, you might decide to mail the entire set of names selected by
    the “champion” and to mail a sample of names from the portion of the “challenger”
    oval that was not selected by the “champion.” This technique allows you to weight
    the names from the sample so that you can track and compare both models’ performance.
    If you want to estimate the performance of the population without the benefit
    of any model (for comparison purposes), you should mail a sample of names not
    selected by either model.


    **Figure 3.11: Comparison of Champion with Challenger in Prospect Selection**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# ## Maintain the Model


    At this point, you have invested much time and many resources in creating a powerful
    model. Now you can ensure its longevity and usefulness by documenting and tracking
    it. Since the mid-1990s, I have worked with numerous modelers, marketers, and
    managers to develop and implement predictive models. Shockingly, often little
    is known about what models exist within the corporation, how they were built,
    and how they have been used to date. After all the time and effort spent developing
    and validating a model, the extra effort to document and track the model’s origin
    and utilization is certainly worthwhile. You begin by determining the expected
    life of the model.


    # ## Model Life


    The life of a model depends on several factors. One of the main factors is the
    target. If you are modeling response, you can redevelop the model within a few
    months. If the target is risk, then you may not know how the model performs for
    a couple of years. If the model has an expected life of several years, then you
    may be able to track the performance along the way.


    Some predictive models are developed on data with performance appended. If the
    performance window is three years, it should contain all the activity for the
    three-year period. In other words, if you want to predict bankruptcy over a three-year
    period, you will take all names that are current for time, *T*. The performance
    will then be measured in the time period from *T* + 6 to *T* + 36 months. So when
    the model is implemented on a new file, the performance can be measured or benchmarked
    at each six-month period.


    If the model is not performing as expected, then the choice has to be made whether
    to continue use, rebuild, or refresh.


    When a model begins to degrade, the decision must be made to rebuild or refresh
    the model. To *rebuild* means to start from scratch. You would use new data, build
    new variables, and rework the entire process. To *refresh* means to keep the current
    variables and rerun the model on new data.


    Refreshing the model usually makes sense, unless an opportunity emerges to introduce
    new predictive information. For example, if a new data source becomes available,
    then incorporating that information into a new model might make sense. If a model
    is very old, testing the building of a new one might be advisable. Finally, if
    strong shifts occur in the marketplace, then a full-scale model redevelopment
    may be warranted, as happened in the credit card industry when low introductory
    rates were launched. In that event, the key drivers for response and balance transfers
    were changing with the drop-in rates.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Model Log


    A model log is a record that, for each model, contains information such as development
    details, key features, and an implementation log. It tracks models over the long
    term with details such as the following:


    +   - *Model Name:* Select a name that reflects the objective or product. Combining
    it with a number allows for tracking redevelopment models. Note the version number
    if applicable.

    +   - *Time of Model Development:* Documenting the time range in which the model
    is developed allows you to track the entire model development process in relation
    to general business activities. This can be helpful when you are tracking hundreds
    of models within your organization.

    +   - *Model Developer:* Because model development is as much an art as a science,
    models can have certain characteristics based on the person who developed the
    model.

    +   - *Overall Objective:* The reason or purpose of the model is critical for
    ongoing relevance and tracking.

    +   - *Model Type:* The technique used to build the model can include linear regression,
    logistic regression, decision tree, neural network, or ensemble models.

    +   - *Specific Target:* The specific group of interest or evaluated assists in
    model deployment and comparison.

    +   - *Model Development Campaign Data:* The campaign data used for model development
    identifies model details based on campaign characteristics.

    +   - *Model Implementation Campaign Data:* The campaign data used for the first
    model implementation identifies model details based on campaign characteristics.

    +   - *Model Implementation Launch Date:* Store the first date of the model implementation
    campaign.

    +   - *Score Distribution (Validation):* The mean, standard deviation, minimum
    and maximum values of score characterize the structure of the validation sample.

    +   - *Score Distribution (Implementation):* The mean, standard deviation, minimum
    and maximum values of score characterize the structure of the implementation sample.

    +   - *Selection Criteria:* The score cut-off or depth of file represents the
    selection criteria.

    +   - *Selection Business Logic:* The business justification for the selection
    criteria helps define the model.

    +   - *Pre-Selects:* The cuts prior to scoring are essential for accurate model
    implementation.

    +   - *Expected Performance:* Note the expected rate of the target variable, such
    as response, approval, or other targeted action, which matches the specific target
    of the model.

    +   - *Actual Performance:* Compare the actual rate of the target variable—such
    as response, approval, or other targeted action—to the expected performance.

    +   - *Model Details:* The model details are characteristics about the model development
    that might be unique or unusual.

    +   - *Key Drivers:* Key predictors in the model are the variables with the most
    power in the model.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'A model log saves hours of time and effort because it serves as a quick reference
    for managers, marketers, and analysts to see what’s available, how models were
    developed, who the target audience is, and more.


    For best results, use a spreadsheet with a separate sheet for each model. One
    sheet might look something like Table 3.5. A new sheet should be added each time
    a model is used. Each sheet should include the all of the elements in the log.
    If one model is a modification of another model, that can be noted in the version
    number.


    # Table 3.5: Sample Model Log as Tool for Organizing Important Tracking Details


    | Log Item | Detail |

    |---|---|

    | Name of Model | R2000 V1 |

    | Time of Model Development | MM/YY–MM/YY |

    | Model Developer | Name |

    | Overall Objective | Increase response |

    | Type of Model | Logistic regression |

    | Specific Target | Responders with > $10 purchase |

    | Model Development Campaign (Date) | Spring Campaign (MM/YY) |

    | First Campaign Implementation (Date) | Fall Campaign MM/YY |

