  img_proc: true
- pgno: 103
  md: 'The percentage of subscriptions shows a different outcome. The youth, aged
    18 to 21 years, have a higher number of subscriptions per person. So, they bring
    in the largest percentage of the revenue. Their share of wallet is 14%, compared
    with only 6% for those aged 51 or older.


    Several conclusions can be drawn from this analysis. If you are looking for additional
    subscribers that bring in high average revenue, the 18- to 21-year-old market
    is the place to focus. These subscribers seem to be happiest with the current
    offerings, although there is still much room to grow.


    On the other hand, growth opportunities for the business may emerge in the other
    age groups if new products are emphasized. The share of wallet is 10% or less
    for customers aged 22 years or older. This result suggests that products could
    be developed to appeal to groups older than 21.


    # ## Notes from the Field


    This case study provides some rich insights and potential opportunities for DMR
    Publishing. What the company does with the information depends much more on the
    abilities of the organization.


    Consider that there are two new opportunities identified. The first opportunity
    is to find additional subscribers that look like their current subscriber base.
    The job of finding additional subscribers might be handled by the marketing department.
    The second opportunity is to create new products for the underserved areas of
    the market. This need for new products would likely be a project for the product
    development side of the business. The optimal solution may be a mixture of both
    departments.


    Because both market growth for the current business and product development are
    important, management must make the decision about how to allocate resources.
    The best outcomes are seen when companies have fostered a culture of big data
    so that departments are able to collaborate and partner in the implementation
    of the analysis results, optimizing profits for the overall company.'
  merge: -1
  img_proc: true
