- pgno: 157
  md: '# ## Model


    Now the fun really begins. The first model is a decision tree. Because the decision
    tree process finds discrete groupings to build the model, this modeling process
    will not use the transformed variables.


    # ### Decision Tree


    In Chapter 8, you built a decision tree to describe the data. In this chapter,
    you are building a decision tree to predict the likelihood of an event occurring.
    This method is versatile and can be used in multiple ways.


    > > **NOTE:** Recall that you replaced the missing values in your data using the
    Impute function. If you had not replaced these values, the Decision Tree process
    would treat them as a separate category. See Enterprise Guide Help Contents for
    more information.


    Under the **Model** tab, drag the **Decision Tree** icon onto the diagram and
    connect it to the **Filter** node as shown in Figure 9.13. Two changes are recommended
    in the **Property** window. Under **Splitting Rule**, change the **Maximum Branch**
    to 4. This option is something you can explore, going higher and lower. Under
    **Subtree**, change the **Method** to **Assessment** and the **Assessment Measure**
    to **Lift**. Right-click the **Decision Tree** icon and click **Run** ➤ **Yes**.


    **Figure 9.13: Decision Tree Property Window**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_157_0.png)


    Once the run completes, click **Results**. The graph in the upper left corner
    of the output window shows the cumulative lift graph as seen in Output 9.9. The
    graph shows that the lift in the train data is much better than the lift in the
    validation data.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Output 9.9: Decision Tree Results


    ![](img/976d9b992e82c4ac7d195d03a30b4915_158_0.png)


    The **Train** data appears to capture 35% of the defaults in the top 10% of the
    file. The **Validation** data captures around 25% of the defaults in the top 10%
    of the file. The performance of the model on both the **Train** and **Validation**
    data shows an improvement. You will compare the results of the decision tree model
    with the results of the neural network and regression models in subsequent sections.


    The partial decision tree view seen in Output 9.10 shows that RISK_SCORE is the
    strongest predictor. This result matches the results from the interval variables
    in the StatExplore results, shown in Output 9.1.


    # Output 9.10: Decision Tree View


    ![](img/976d9b992e82c4ac7d195d03a30b4915_158_1.png)


    Because the decision tree is built for prediction, the actual tree node values
    are not as important as the model’s ability to predict. Consequently, in the next
    few steps you will build the neural network and regression models.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'In the final assessment step, you will employ the Model Comparison node to
    compare all three models, using both gains tables and a cumulative-lift graph.


    # Neural Network


    As described in Chapter 3, neural networks are models that capture many of the
    nonlinear relationships in data. So, although neural network models sometimes
    do a better job of fitting the model than the decision tree or regression models,
    they might not perform as well on the validation data or maintain their ability
    to predict as accurately over time. Another disadvantage of neural network models
    is that they are more difficult for marketers to interpret than the decision tree
    models.


    Under the Model tab, drag the Neural Network icon (fifth from the right) onto
    the diagram and connect it to the Transform Variables node. Figure 9.14 shows
    the diagram and the Neural Network Property window. In the Train section, next
    to Model Selection Criterion, change Value to Misclassification. Right-click the
    model node, and click Run ▶ Yes. When the window appears, click Results.


    Figure 9.14: Neural Network Property Window


    ![](img/976d9b992e82c4ac7d195d03a30b4915_159_0.png)


    As shown in Output 9.11, the cumulative lift is much higher for the neural network
    train data than for the validation data.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# **Output 9.11: Neural Network Cumulative Lift**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_160_0.png)


    The **Train** data appears to capture more than 45% of the defaults in the top
    10% of the file. The **Validation** data captures only a little more than 20%
    of the defaults in the top 10% of the file. As with the Decision Tree mode, this
    difference in lift between the train and validation data implies that the model
    is not robust. In other words, it is overfitting the train data and probably won''t
    predict as well as expected when the model is implemented. You will compare the
    results of the decision tree model with the results of the neural network and
    regression models in an upcoming section.


    # ## Regression


    As described in Chapter 3, regression models use a series of independent, or predictive,
    variables to predict an outcome. In predictive modeling, you can use logistic
    regression, which builds a model with a binary outcome. The resulting equation
    assigns a probability of the event''s occurring. In the current case, the binary
    outcome or event is **Loan Default**.


    Under the **Model** tab, drag the **Regression** icon (third from the right) onto
    the diagram, and connect it to the **Transform Variables** node. Figure 9.15 shows
    the diagram and the **Regression Property** window. Because the target variable,
    LOAN_DEFAULT, is binary, the **Regression Type** defaults to **Logistic**.


    As mentioned in Chapter 3, each selection option has pros and cons. For this model,
    change **Selection Model** to **Stepwise**. Change **Use Selection Defaults**
    to **No** (Figure 9.15).'
  merge: -1
  img_proc: true
