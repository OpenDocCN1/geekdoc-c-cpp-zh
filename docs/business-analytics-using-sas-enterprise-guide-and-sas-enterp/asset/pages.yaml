    # ## Continuous Variables


    A frequency distribution table for a continuous variable typically displays population
    measures, such as the values for mean, median, minimum, and maximum. Table 3.2
    displays the values for the variable *miles per gallon (MPG)* on the highway.
    You can read the number of total observations in the data (428). No values are
