    # ## Notes from the Field


    Viewing data frequencies and distributions gives you a view of the data that is
    useful for understanding the underlying trends. Correlation analysis is powerful
    for detecting early relationships that can lead to ideas for predictive analysis.


    Correlation analysis can also be helpful in detecting data problems. For example,
    if two variables show a high correlation coefficient (> 60%), they might be related
    in some way not otherwise known.'
