- pgno: 135
  md: '# Diagnostics


    With all predictive models, there is a risk of over-fitting. In other words, your
    model could fit your data so well that it does not work well on new data when
    you implement the model. You can check for over-fitting by viewing the Subtree
    Sequence Plot. To view the Subtree Sequence Plot, go to the upper left menu and
    select View ▸ Model ▸ Subtree Assessment Plot (Figure 8.15).


    **Figure 8.15: Access Subtree Assessment Plot**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_135_0.png)


    The Subtree Assessment Plot shows that the Average Squared Error continues to
    decrease as the number of leaves increases (Output 8.4).'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Output 8.4: View Subtree Assessment Plot


    ![](img/976d9b992e82c4ac7d195d03a30b4915_136_0.png)


    If the error begins to increase, you should limit the number of leaves or prune
    the tree. For more information on pruning decision trees, see *Decision Trees
    for Analytics Using SAS® Enterprise Miner*, by Barry de Ville and Padraic Neville
    (2013).


    # Node Characteristics


    Three dimensions of the tree output help you visually interpret the results:


    +   - *Shading*: When the shading is darker, the percentage of the target group
    MULTI_SUBS > 1 is higher.

    +   - *Line Width*: The width or thickness of the connecting lines represents
    the volume of records going to the node.

    +   - *Node Values*: Each node displays values for the records for both the model
    and validation data subsets within that node.

    +     - *Node Id*: This simple identifier makes it easy to identify the exact
    node.

    +     - *Percentage*: The percentage of the target variable represents DMR customers
    who have more than one subscription.

    +     - *Count*: The count is the number of DMR customers in that node.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# ## Node Interpretation


    In Output 8.5, the topmost node on the left represents the whole sample of 8,010
    DMR customers. Both the Train and Validation data subsets show that approximately
    73% of DMR customers have more than a single subscription (MULTI_SUBS > 1) as
    shown in Output 8.5.


    The first-level split is on HOUSEHOLD INCOME at $28,500. The upper box (Node 2)
    is lighter and represents 2,185 DMR customers with income less than $28,500. Within
    Node 2, 47.7% of DMR customers have more than one subscription. The lower box
    (Node 3) is darker and represents customers with annual income greater than $28,500.
    The percentage of DMR customers with more than a single subscription (MULTI_SUBS
    > 1) is 82.5%.


    The second-level splits on a different variable for each node in the first level.
    Node 2 splits on AGE into Node 4 and Node 5. Node 4 shows that 81.4% of DMR customers
    younger than 22.5 years have more than one subscription. Node 5 shows that only
    41.8% of DMR customers who are older than 22.5 years have more than one subscription.


    The second split on the second level (Node 3) is on Household Income. Node 6 shows
    that 75.1% of DMR Customers with less than $51,500 in annual income have more
    than one subscription. Node 7 shows that 87.2% of DMR Customers with more than
    $51,500 in income have more than one subscription.


    In Output 8.4, the final nodes show a wide range of percentages for DMR Customers
    having more than one subscription. Node 10 is the lightest background and has
    the lowest percentage of DMR Customers with more than one subscription (30.0%).
    Nodes 12 and 14 are the darkest, with the highest percentages of DMR Customers
    with more than one subscription (90.8% and 97.9%, respectively).


    > > **NOTE:** “Or Missing” shows up in the bottom brackets whether or not you
    have missing values. In the current data, you have no missing values, so you can
    ignore “Or Missing” in this interpretation.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# ### Output 8.5: View Horizontal Tree End Points


    ![](img/976d9b992e82c4ac7d195d03a30b4915_138_0.png)


    # ## Interpret the Findings


    The results of this analysis offer meaningful insights into the demographic characteristics
    of DMR customers with more than one subscription. If you consider DMR Customers
    with multiple subscriptions to be your best customers, there are several approaches
    you can take:


    +   - *Buy more prospect names:* You may decide to buy names from a list company
    with the same demographics as in the highest performing nodes. So for example,
    Node 12 and Node 14 identify the best performing customers. Nodes 13 and 15 identify
    reasonably high performing customers. So, you would look to purchase names that
    have the characteristics of Nodes 13 and 15.

    +   - *Target your worst customers:* Based on the known demographics of the worst
    performing customers, you might want to create additional products that would
    meet their needs. Node 10 represents a group of customers that show untapped potential.
    Developing and testing new products might prove to be a good business decision.

    +   - *Leverage your best customers:* These customers are already doing a lot
    of business with you. A simple survey of their other interests or preferred delivery
    channels may open new opportunities to increase profits within this customer group.'
  merge: -1
  img_proc: true
