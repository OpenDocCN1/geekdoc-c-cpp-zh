  md: 'If you scroll through, you can select two sections to compare. First, click
    the column heading called **Data Role** to sort the data by data role and put
    all the test data in contiguous rows. For the **Test** data set, select the results
    from the decision tree and the logistic regression. Within the Table Score Rankings
    window, you can rearrange the columns together that you want to capture. Slide
    the **Baseline Cumulative % Captured Response**, **Number of Events (LOAN_DEFAULT)**,
    **Mean Posterior Probability**, **Cumulative % Captured Response**, and **Cumulative
    Lift** to the left, next to the column **Data Role**. Click the **Data Role**
    column heading to order the rows alphabetically by data role. Doing so puts the
    two tables of interest, the decision tree test data and the logistic regression
    test data, into the top 20 rows. The result is captured in Output 9.15.


