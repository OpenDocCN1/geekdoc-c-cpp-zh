    # ## Introduction


    Chapters 1 through 5 focused on general knowledge and techniques that laid the
    foundation for many types of data analysis. In this chapter, you will explore
    a more specific topic: competitive analysis.


    When your company sets its strategy, the first questions to answer are as follows:


    +   - What are the strengths and weaknesses of our primary competitors as compared
    to us?

    +   - What is our market share and how can we increase it?


    For most industries, data sources are available that allow companies to determine
    their market share, or “share of wallet,” within certain segments of the population.
    This analysis is valuable for setting marketing strategies, guiding research and
    development, and informing finance and budget allocations.


    # ## Project Overview


    The leadership team at DMR Publishing Company is interested in understanding the
    drivers of revenue within its business. It has gathered U.S. customer data for
    the past year that consists of revenues, numbers of publications, and three demographic
    variables. For this analysis, you will use SAS Enterprise Guide.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The project has eight steps:


    +   1. Initiate the project in SAS Enterprise Guide 6.1.

    +   2. Import and view market data.

    +   3. Add the DMR Publishing customer SAS data set to the project.

    +   4. Use the query tool to build a new age group variable.

    +   5. Summarize the DMR Publishing customer data to a gender and age group level.

    +   6. Merge customer and market data.

    +   7. Summarize the merged data to age group level.

    +   8. Perform penetration and a "share of wallet" analysis.


    # Market Analysis


    So far in this analysis, our main interest has been to describe the characteristics
    of the customer base. If possible, it can be useful to compare characteristics
    of the customer database with the same characteristics in the overall market.
    This comparison enables a penetration analysis and share of wallet analysis as
    defined in Chapter 1.


    We have purchased a data set from General List Company that shows the annual revenues
    and number of subscriptions for the entire publishing market within the United
    States, segmented by gender and age group. Our goal is to compare performance
    within gender and age group between the DMR Publishing’s customer data and the
    total market data purchased from General List Company.


    # Project Initiation


    Similar to the process in Chapter 5, the first step is to open the project. Double
    click the SAS Enterprise Guide icon. Select New Project.


    # Data Preparation


    Your first step is to prepare the data.


    # Import Data


    To access the data, go to File ▶ Import and choose the Publishing Market data
    set. When the first window opens, click Finish. Notice that the data is already
    summarized as shown in Output 6.1.'
  merge: -1
  img_proc: true
