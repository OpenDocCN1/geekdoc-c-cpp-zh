    # Introduction


    Selecting the best data for analysis requires a thorough understanding of your
    business objective and your market. The data serves as the foundation for all
    of your analysis. In this case, the old adage is true: "Garbage in, garbage out!"


    Finding the right data for analysis typically begins with your own data. Depending
    on your goal, you may have all the data you need in your own databases. However,
    in certain situations, you may need to purchase data from outside data sources
    to enhance your analysis. Either of these scenarios requires a culture of big
    data—a culture that supports collaboration and data sharing between silos and
    across systems. This culture of big data requires a strategic approach to data
    acquisition, storage, management, and access.


    In this chapter, we will look at some typical sources for descriptive and predictive
    analysis. These examples give you a basic framework from which to develop your
    own analysis data sets.


    # Data for Descriptive Analysis


    As we saw in Chapter 3, descriptive analysis helps you understand the underlying
    characteristics and patterns in your data. Your data can come from any source.
    Descriptive analysis can analyze a'
