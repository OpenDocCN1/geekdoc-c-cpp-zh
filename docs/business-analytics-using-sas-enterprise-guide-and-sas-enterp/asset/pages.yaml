- pgno: 121
  md: '# Analyze Clusters and Recommend Marketing or Product Development Actions


    This set of results informs DMR Publishing that it can focus its marketing and
    product development for different age groups with consideration for loyalty (years
    as customer), gender, and household income.


    Because Segment 4 is the largest, it is a good place to focus your analysis. However,
    one thing to notice is the similarity between Segment 4 and the third largest
    segment, Segment 1. They both have loyal customers (based on years as customer)
    who are older than average and have slightly higher than average income. The main
    difference is their gender. Together, Segment 4 and Segment 1 represent 50% of
    the DMR Publishing customer base. Therefore, you may want to consider a two-level
    approach:


    Consider separate marketing actions or product development for gender-specific
    publications, such as men''s health or women''s fashion magazines. Or, your approach
    might be as simple as different magazine covers or advertisements aimed at each
    gender.


    Consider combining these two segments for publications that are not gender-specific,
    such as cooking and travel magazines or business journals.


    Segment 5, the second largest cluster, offers another opportunity. This group
    of all male, younger-than-average customers is a prime audience for publications
    that appeal to that demographic group. If DMR Publishing doesn''t already offer
    some sports or technology magazines, you might suggest that they add some to their
    list of publications.


    # Notes from the Field


    Segment profiles are used to describe the clusters and make them actionable. As
    you have seen, the patterns revealed and the insights that emerge can guide creative
    marketing decisions and well as product or service development. Once you understand
    your customers based on your existing data, consider purchasing additional data
    to enrich your clusters, enhance your analysis, and grow your customer base. As
    discussed in Chapter 2, there are many good sources of external data. You can
    purchase characteristics such as hobbies and interests, buying patterns, and social
    or online behavior and append them to your existing customer base. Once your customer
    data is enriched, you can rerun your cluster segments and refine your marketing
    and product development strategies.


    When sharing your results or proposing strategic initiatives with your stakeholders
    and end-users, speak in terms of their business objectives and relate your recommendations
    to the strategic goals of the company.'
  merge: -1
  img_proc: true
