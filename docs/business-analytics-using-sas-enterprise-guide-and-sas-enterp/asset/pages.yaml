- pgno: 163
  md: '# # Assess


    The **Model Comparison** node allows you to visually compare the models and perform
    decile analysis using gains tables. From the menu at the top of the diagram, click
    the **Assess** tab. Select and drag the **Model Comparison** icon onto the diagram
    and connect it to all three models, as shown in Figure 9.17. In the **Property**
    window, change the **Number of Bins** to 10 to view the results in deciles and
    change **Selection Statistic** to **Cumulative Lift**. Right-click on the **Model
    Comparison** node and click **Run ▶ Yes**. When the window appears, click **Results**.


    **Figure 9.17: Model Comparison Property Window**


    ![](img/976d9b992e82c4ac7d195d03a30b4915_163_0.png)


    The lower left corner of the results window displays the cumulative lift graphs
    as seen in Output 9.13. All three models are compared for each of the three data
    sets: Train, Validate, and Test. The model performance for all three data sets
    shows the most lift in the top 10%. As expected, the neural network model and
    the decision tree have the best performance on the Train data. But the neural
    network performance degrades in the Validate data set but seems to recover slightly
    in the Test data set.


    The top 10% performance is closest in the Test data, with the decision tree showing
    the best lift. The logistic regression starts to perform better at 40% of the
    file and higher.


    Choosing the best model presents an interesting challenge. Since they are very
    close, you could select the decision tree model because it is the easiest to interpret
    and offers the greatest lift in the top 10%. Since our loan default rate is approximately
    4%, it makes sense to select a model that optimizes in the top 10%. On the other
    hand, if the loan default rate was 40%, you might select the Stepwise Logistic
    Regression model, since it performs better at 40% of the file.'
  merge: -1
  img_proc: true
