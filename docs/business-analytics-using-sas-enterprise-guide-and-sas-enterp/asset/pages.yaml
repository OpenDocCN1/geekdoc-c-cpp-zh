- pgno: 25
  md: '# Notes from the Field


    The fact that you are reading this book suggests that you are among those of us
    who are seduced by the power and beauty of big data and its emergent insights.
    However, big data has a dark side. One can easily become lost in the minutia and
    forget about the main purpose of the project—that carefully crafted business goal.


    In any data analysis or modeling project, you will benefit from stepping back
    and looking at your work from a leader’s perspective. Typically, the CEO doesn’t
    have the skills or the time to explore a project’s details to the extent that
    you do. So, sometimes you must play CEO for your part of the business.


    Engaging powerful tools like SAS Enterprise Guide and SAS Enterprise Miner is
    like sitting behind the wheel of a Ferrari. These tools can take you far and fast,
    but will you end up where you need to go?


    To reach your destination in sound condition, you must know what the goal is,
    and you must have a map to direct your progress. You must also know where you
    are now and what your assets are: your data, tools, reference materials, and support
    resources.


    If you are a manager, discipline and focus will be your best tools during this
    exciting process. When you are performing data analysis, allow your business acumen
    to guide you. The insights that emerge can serve to validate and enhance your
    knowledge, as well as inform your strategy.


    If you are an analyst, you have a real opportunity here. The skills that brought
    you to this position are highly valued in the marketplace. But to become a true
    asset to your organization, you must learn the business—from strategy to operations.
    Your understanding of the business will help you make decisions based not only
    on the data, but also on what your findings mean to the business. If you’re developing
    analysis and models to guide your strategy, then you will want to think through
    all the ramifications of your strategic decisions as they relate to the goals
    of the business.'
  merge: -1
  img_proc: true
