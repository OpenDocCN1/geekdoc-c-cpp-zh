- pgno: 40
  md: '# Notes from the Field


    In this chapter, you’ve seen how data for analysis comes in many forms and from
    multiple sources. Your first step in preparing the data for analysis is to understand
    how and from where all the data sets were extracted. When data is purchased or
    extracted from unfamiliar sources, you should request data dictionaries that contain
    a definition for every field. Be sure you know what each field means and how it
    is derived (if applicable). In addition, request counts, ranges, and simple statistics
    for each field, such as mean, median, minimum, maximum, and standard deviation.


    Make friends with the people in your information technology department. They can
    become valuable collaborators. They can help you get the names of the people in
    charge of creating the data, if possible. Don’t hesitate to ask questions until
    you are sure you understand the data.


    Data can be seductive. If you are starting a new project, you may be eager to
    collect as much data from as many sources as possible. However, with the amount
    of data available for analysis, too much of a good thing can be paralyzing.


    The best approach is to work in stages. Begin with the question from Chapter 1:
    *What is your objective?* If you have many objectives, choose the most important
    two or three. Then, work with your data management team to optimize the process.
    If operational or pricing considerations justify the collection a large amount
    of data, then focus on a few that will have the most impact. Remember that analysis
    is usually done in isolation, but the planning should be done in concert with
    the major stake-holders and end-users to ensure the optimal use of talent, time,
    and money.


    Remember that, in the end, your analysis is only as good as your data. This fact
    is true for both the quality of the data and how well it aligns with the objective
    of your analysis.'
  merge: -1
  img_proc: true
