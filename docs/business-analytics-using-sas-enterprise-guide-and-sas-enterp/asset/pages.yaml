- pgno: 32
  md: '# Psychographic Data


    Psychographic data is also known as attitudinal data or lifestyle data. It is
    characterized by opinions, fashion, style, political choices, personal values,
    or some combination. Traditionally associated with market research, this category
    of data is collected mainly through surveys, opinion polls, and focus groups.
    It can also be inferred through subscription, purchase, and social media behavior.
    Because of increased competition, this category of data is being integrated into
    customer and prospect databases for improved target modeling and analysis.


    Psychographic data brings an added dimension to predictive modeling. For companies
    that have squeezed all the predictive power possible out of their demographic
    and behavioral data, psychographic data can offer some improvement. It is also
    useful for determining the life stage of a customer or prospect. This data creates
    many opportunities for developing products and services around life events such
    as marriage, childbirth, college expenses, and retirement.


    The biggest drawback to psychographic data is that it denotes intended behavior
    that may be highly, partly, or marginally correlated with actual behavior. Data
    may be collected through surveys or focus groups and then applied to a larger
    group of names, such as a customer base, using segmentation or predictive modeling.
    If data is applied with the use of these methods, it is recommended that a test
    be constructed to validate the correlation.


    # Data Category Comparison


    Table 2.1 provides a quick reference and comparison of the three main categories
    of data. The rating is based on individual-level data. If data is collected on
    a group and inferred on an individual level, it is generally less predictive and
    less expensive. The stability remains the same.'
  merge: -1
  img_proc: true
