    | Score Distribution (Validation) | Mean = .037, SD = .00059, Min = .0001, Max
    = .683 |

    | Score Distribution (Implementation) | Mean = .034, SD = .00085, Min = .0001,
    Max = .462 |

    | Selection Criteria | Deciles 1 through 5 |

    | Selection Business Logic | Expected response > .06 |

    | Preselects | Age 25-65; Minimum risk screening |

    | Expected Performance | $25,500 |

    | Actual Performance | $26,243 |

    | Execution Details | Sampled lower deciles for model validation and redevelopment
    |

    | Key Drivers | Date of last purchase, population density |


    This document will save you time and prevent errors and duplicate efforts. When
    combined with other model logs, it can be used as a reference library for all
    modeling projects within your department or company.'
  merge: -1
