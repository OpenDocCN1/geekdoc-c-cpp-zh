- pgno: 13
  md: 'because the source of each app updates them on a regular basis. However, it
    is important to note that the offline data storage is limited, and mobile Web
    apps sometimes lack the refined design of native apps. In addition, it can be
    tricky to get these apps to work properly with the numerous browsers available
    to smartphone users.


    Hybrid apps bring together Web technology and native app execution. Hybrid apps
    such as Facebook, LinkedIn, and TuneIn Radio combine the convenience of HTML5,
    CSS, or Javascript Web apps with a native mobile framework. This allows the user
    to have a mobile Web browser functioning within the app. Hybrid apps can be downloaded
    from an app store and are used across multiple mobile platforms. Users download
    the app framework specifically for their platform, and the content will be provided
    through platform independent online channels. Hybrid apps are even accessible
    when the device is offline. Many retailers prefer hybrid apps. Customers activate
    their native app on their mobile device when shopping but go through Web-generated
    information when checking out.


    Today, the app craze shows no signs of stopping. An International Data Corporation
    (IDC) report from December 2010 notes that “global downloads will reach 76.9 billion
    in 2014 and will be worth US$35 billion.” A Canalys report from June 2011 agrees,
    predicting that “direct revenue from the sale of apps, in-app purchases, and subscriptions
    across smartphones and tablets” will reach $36.7 billion in 2015. Mobile app development
    is'
