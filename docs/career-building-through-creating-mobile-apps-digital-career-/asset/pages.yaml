    channels to see what works, but whatever you do, don’t stop promoting your app.
    If you have a high-quality app, users will be passionate and recommend it to others.
    Soon the app will sell itself.


    Monitoring your app’s online buzz is key to your success. Analytics will help
    you determine the success of your app by noting the number of downloads, unique
    users, page views, and session length. You can invest in internal analytics to
    discover user values, customer attribution models, and monetization payouts. External
    analytic tools such as *App Annie* or *Distimo* will help you decide which market
    and platforms you want to target. In addition, app stores offer ratings and reviews
    while Facebook’s Insight displays user activity reports, post-activity, and demographics
    within your Facebook community. A keyword search will determine which sites promote
    your mobile app. If something isn’t working, change it.


    Once your app has been launched, there will be some “bug fixing” and maintenance
    to handle. Your reviewers will tell you what is working and what isn’t. Answer
    their concerns quickly and professionally, as good service will always impact
    your future sales. Also, consider updating your app in the future. Perhaps it
    needs a new eye-catching design, improved user involvement, additional features,
    or more competitive pricing. This could take up to a minute for a quick modification
    or several months for a complete overhaul.'
