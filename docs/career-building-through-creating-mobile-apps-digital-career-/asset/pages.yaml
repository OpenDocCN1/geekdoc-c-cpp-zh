  md: '# # GLOSSARY


    **algorithm** A piece of automated code used to solve a problem.


    **app store** An online store that offers apps to buy and download for a mobile
    device.


    **branding** The common theme of an organization often shown in marketing and
    advertising campaigns.


    **cross-platform formatting** When an application can run on two or more mobile
    device platforms.


    **database management** An assortment of programs that control the storage, modification,
    and extraction of data from a database.


    **entrepreneur** One who starts and manages a business in order to make a profit.


    **hardware interaction** A structure used to connect two devices together.


    **memory allocation** The process by which a specific amount of memory space is
    reserved for programs or services on a mobile device or computer.


    **monetization partner** A person who generates revenue using affiliate advertising,
    content, or programs within a blog, Web site, or mobile app.


    **nag screen** A pop-up reminder that alerts users to paid versions of an app.


    **network** A system that spreads data between users. It includes the operating
    system, connecting cables, antennas, towers, and supporting hardware.


    **operating system** A system that provides a user interface between a mobile
    app and computer hardware.'
  merge: -1
  img_proc: true
