  md: '# ## SUBMITTING YOUR APP


    Submitting your app to an app store can take anywhere from one to two weeks. Each
    store has its own requirements regarding mobile platforms and operating systems,
    and some are stricter than others. App store representatives review thousands
    of apps each week. They consider the overall customer experience, knowing this
    is the key to their success. Reviewers take into account the quality, overall
    functionality, release date, and firmware requirement. They want to avoid users
    downloading the app only to discover their devices were not technically capable
    of using the app. Most app stores have no tolerance for obscenity or applications
    that will damage mobile devices.


    Developers benefit when their apps are listed with an app store. Not only do they
    have exposure to an international market, app stores also offer free analytic
    tools for further insight. Developers can look at downloading times to determine
    strategic time frames for future marketing efforts. Also, app stores provide geographic
    information, disclosing users'' locations when downloading an app. This will benefit
    your future marketing and product efforts.


    App developers are not limited to app stores, however. They can use independent
    app stores like GetJar. Founded in Lithuania, GetJar is an independent mobile
    phone app store and the largest free app store in the world. It provides over
    150,000 apps for all sorts of platforms. GetJar gives free rewards to users for
    trying new apps. This could entice more users to access your new app. The most
    important key is to submit your high-quality app. The more locations you submit
    to, the better your chance of reaching users who will want to download your app
    or creation.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'separate app for each task to offer the specific functionality

    in the best possible way. Less is more.


    With a workable version of your app, be sure to

    have it tested by a group of objective representatives

    from your target market. Most seasoned app developers

    recommend a minimum of three user test rounds per

    release. Observe their interaction with your prototype. Is

    the app quick enough when given a command? Do the

    functions work? Or does an error message pop up?

    Interview the testers by asking them what they are

    thinking as they use the app. What are they expecting it

    to do for them? Welcome feedback, especially those

    notes that call for improvements. Then prioritize error

    corrections and enhancements. Some improvements can

    wait for the second version of the app.


    # Setting a Price Point


    Now that your shiny new app has been tested, it’s time

    to consider the price point. A majority of apps are free,

    while many are between 99 cents and $5. Specialized

    apps can sell for hundreds or thousands of dollars.

    These include a $300 piano tuner app, a $900 video

    surveillance app, or a $1,000 study guide for lawyers

    wanting to pass the California bar exam. Specialized apps

    are the exception, as they all have clearly defined market

    values and limited audiences.


    Begin your app development journey with free or

    “lite” version apps. By discovering users’ reactions to func-

    tionality and design, you will gain valuable knowledge

    for future projects. Plus, free apps tend to generate the'
