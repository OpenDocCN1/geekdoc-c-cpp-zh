    # Mapping Your Goals


    If you think you’re ready to take on the challenges of mobile app development,
    then it’s time to roll up your sleeves and map out your goals. What do you want
    to build? Who are you building it for? Apps directly target a particular audience,
    so you need to know your target market. For example, children like games, while
    their parents would prefer their children have games with an educational element.
    Teens, the highest app downloaders, tend to select trendy apps that involve music,
    videos, dating advice, fashion, and Hollywood updates. The adult market can vary
    depending on age and interest. As the planning continues, ask yourself, “Why will
    they want to use my app?” and “What makes it unique?” Perform in-depth market
    research before you begin developing. You may notice that social media and game
    apps tend to top app store lists in every platform. Puzzles, educational learning,
    and e-commerce apps are also well received. Many successful app developers download
    popular apps'
