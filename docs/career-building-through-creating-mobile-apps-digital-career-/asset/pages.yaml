  md: '# A History of Apps


    When the first mobile phone, the Motorola DynaTAC 8000X, was introduced to consumers
    in 1983, it was nothing like the high-tech smartphones of today. It weighed 1
    kilogram (2.2 pounds), stored up to thirty phone numbers, offered only one hour
    of battery life, and cost almost $4,000. In 1997, Nokia embedded *Snake* into
    its 6610 mobile phone. A remake of the 1970s computer game, the pixilated reptile
    grew as it slid through a tiny maze detailed against a green background.


    Although pretty basic by today’s standards, *Snake* was a hit with users. Its
    success inspired other companies to add arcade-like games to their mobile devices,
    including *Pong*, *Tic-Tac-Toe*, and *Tetris*. They also began adding productivity
    apps, including calculators, calendars, e-mail capabilities, and ringtones. Just
    about every mobile phone blasted the chorus of a top 40 hit in the late 1990s
    and early 2000s.


    Competition was fierce among mobile service providers, and trade secrets were
    closely guarded. Mobile apps could only be created by in-house designers. The
    development of Wireless Application Protocol (WAP)—a similar version of HTTP—was
    what third-party developers needed to get their foot in the door. WAP allowed
    minimized Web pages to be easily displayed on very small screens or feed apps
    with live content to mobile devices using a wireless network. It was supported
    by all operating systems and worked within the memory and bandwidth limitations
    of many mobile devices. With a WAP access point on the device, the third-party'
  merge: -1
  img_proc: true
