    # ## Types of Apps


    Along with numerous programming languages, there are three types of mobile apps:
    native, mobile Web, and hybrid. The native app is a standalone app created specifically
    for the operating system of a mobile device. Most mobile games are native apps,
    such as *Cut the Rope*, *Plants vs. Zombies*, and the mega hit *Angry Birds*.
    A native app must be downloaded from an app store. App developers who wish to
    create native apps have the benefit of standardized software development kits
    (SDKs). Provided by the platform manufacturer, SDKs include user interface elements
    and development tools. While native apps are fast and are often kept up to date,
    they are expensive to build and maintain. Examples include *Camera+* for devices
    using the iOS operating system or *KeePassDroid* for Android devices.


    Mobile Web apps are Web-based and are compatible with other mobile platforms.
    These apps do not need to be downloaded from a traditional app store. They are
    simply accessed from within the device''s Web browser. Examples include *Instagram*,
    *Dropbox*, *Google Maps*, and *YouTube*. Developers who want to create mobile
    Web apps can use some of the server-side languages, Web application frameworks,
    or computer programming code—HTML5, CSS3, or JavaScript—they may already'
  merge: -1
  img_proc: true
