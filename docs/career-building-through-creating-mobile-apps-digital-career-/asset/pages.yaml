  md: '# ON YOUR MARK, GET SET...


    # OUTSOURCING


    Simple apps can be designed with minimal assistance, but more sophisticated apps
    may need a little extra help. If you find your skill set lacking, you could hire
    a freelancer or become one to bring your vision into reality. Or, finding the
    right person or team to help you create an app is no small task. It''s important
    to ask for referrals and work samples before engaging. If any contacts don''t
    agree, make it clear when you describe your project to the freelancer and list
    your expectations. Define the platform you prefer, as well as the programs you
    have before you get involved. Be sure to determine their strengths, weaknesses,
    and quickness to respond to communications. Friends and family can often give
    feedback during the development process. Safeguard your project by requesting
    a signed confidentiality agreement before any work is completed. This can include
    project details, expectations, and terms of payment; also, request the source
    code, the programming language it''s intended for, and a computer program. You
    may need this information if you need to part ways with your current development
    company and employ another team.


    Third-party developers charge a fee depending on the type of app and its level
    of sophistication. One-function apps such as notes and calculators can cost anywhere
    from $500 to $10,000. More complicated apps with multiple graphics and features
    can cost up to $200,000. These estimates may vary by vendor, and e-commerce apps,
    the costs and challenges of creating multiple or cross-platform development can
    be quite complex. Many independent developers are not familiar with numerous mobile
    operating systems and programming languages. Third-party developers can help port
    your creation to other systems.'
  merge: -1
  img_proc: true
