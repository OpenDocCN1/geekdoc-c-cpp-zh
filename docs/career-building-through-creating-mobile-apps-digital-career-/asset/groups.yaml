    # The Job Market


    Because the demand for app developers is high, salaries and benefits are competitive.
    Sam Laird of Mashable.com notes that “the average annual salary for employed app
    developers in 2011 was nearly $90,000, according to one survey. And by 2016, the
    total revenue from consumer mobile apps is expected to top $50 billion, according
    to some estimates.” This means that mobile app developers not only have a promising
    career ahead of them, but if they stay on the cutting edge of technology and creativity,
    they will also bring in a sizable income. Other benefits can include flexible
    schedules, freedom to make decisions that affect them, and entrepreneurial know-how
    to start their own businesses.


    Whether you are a new or experienced developer, join a network within the industry.
    A shared interest among like-minded professionals will promote excitement and
    creativity while establishing resources for future projects. You can do this using
    online chat rooms or social media forums, or by attending annual regional and
    national conferences, such as the Apple Worldwide Developers Conference (WWDC).
    International iOS app makers are invited to attend the conference to learn about
    upcoming trends and cutting-edge technology. For years, participants had to be
