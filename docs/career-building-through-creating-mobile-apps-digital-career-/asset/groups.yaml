    # JUMPING INTO THE DIGITAL APP WORLD


    # MAKING APP STORE HISTORY


    Where does one go for the latest in mobile apps? Why, the app store, of course.
    Users can simply access their mobile devices'' app store and shop among the thousands
    of entertainment, social media, business, and news apps. With the tap of a button,
    they can view app photos and reviews as well as various price points. The first
    app store to make history was the legendary Apple App Store. It opened in July
    2008, and within one week, ten million mobile apps were downloaded. Only 25 percent
    of these were free, meaning that customers were happy to pay for apps that customized
    their devices.


    The Apple App Store paved the way for others to hit the market. The Android Market
    opened its virtual doors in 2008, followed by the Ovi Store in 2009, BB App World
    in 2009, and Windows Phone Marketplace in 2010. Today, the Apple App Store sells
    thousands of mobile apps for the iPhone, iPad, and iPod Touch. In fact, it reached
    twenty-five billion downloads in the spring of 2012.


    The mobile app market is an independent developer''s digital dream. Developers
    can create and code innovative mobile apps while relying on the app store to handle
    the business side of selling apps. For a cut of the profits—usually 30 percent—an
    app store will cover marketing and sales distribution. This frees the developer
    to become a digital superstar with his or her creative ideas, attractive content,
    and proper implementation.


