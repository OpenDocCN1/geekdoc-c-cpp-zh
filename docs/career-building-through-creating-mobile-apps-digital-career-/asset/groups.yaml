  mdcn: "\n## 走向全球\n\n当你向应用商店提交应用时，系统会要求你填写特定信息，包括分发范围。要敢于设想更大的市场。应用市场远比你的母国市场大得多。中国是一个快速增长的市场，预计在技术支出上将超过美国。新的运营商开始分销智能手机，这意味着更多用户可能接触到你的应用。即使你认为你的应用只适用于某个特定地理细分市场中的某类人群，结果也可能令你惊讶。将你的应用发布范围设置为全球分发，看看它如何吸引众多国际用户。他们可能会发现你的新作品多么有趣、多么方便，并想立刻下载它。\n\
    \n为了实现这种曝光度，可以考虑将你的应用翻译成其他语言。汉语普通话和西班牙语是世界上使用最普遍的语言之列。法语、德语、意大利语、葡萄牙语、俄语、孟加拉语、印度斯坦语和阿拉伯语也可能是扩大市场的其他选择。专业译员可以帮助你将应用文本转换为语法正确的国际语言。一些开发者会在比本国更小的国家发布应用。这些市场让他们能够在本国发布之前测试应用。还要记住，其他国家可能存在法律限制，例如内容版权。务必彻底进行市场调研，以避免任何法律问题。\n\
    \n## 应用世界在等待\n\n面向成千上万的移动应用。Parse 团队知道构建一款应用并不容易，因此定制了其服务，以提供数据存储、社交媒体集成和推送通知，提醒用户即将举行的活动。\n\
    \n### 就业市场\n\n由于对应用开发者的需求很高，薪资和福利具有竞争力。Mashable.com 的 Sam Laird 指出：“根据一项调查，2011\
    \ 年受雇应用开发者的平均年薪接近 90,000 美元。而根据一些估算，到 2016 年，消费者移动应用的总收入预计将超过 500 亿美元。”这意味着移动应用开发者不仅拥有前景光明的职业，而且如果他们始终站在技术与创意的前沿，还将带来可观的收入。其他福利可能包括灵活的工作时间、自主决定影响自身事务的自由，以及创办自己企业所需的创业知识。\n\
    \n无论你是新手还是经验丰富的开发者，都要加入行业内的网络。志同道合的专业人士之间的共同兴趣将激发热情与创造力，同时为未来项目建立资源。你可以通过在线聊天室或社交媒体论坛来做到这一点，也可以参加年度地区性和全国性会议，例如苹果全球开发者大会（WWDC）。国际\
    \ iOS 应用开发者受邀参加会议，以了解即将到来的趋势和前沿技术。多年来，参会者必须年满十八岁。\n\n![](img/86130a5c6eb4407447b6379efec2f80d_51_0.png)\n\
    \n*苹果开发者大会 WWDC 2012 深入展示了业内新鲜而令人兴奋的动态。凭借排得满满的会议和动手实验室，开发者得以站在技术趋势的前沿。*\n\n然而，在收到许多在\
    \ App Store 中拥有多款应用的年轻开发者的请求后，苹果重新考虑了这一限制。2012 年 6 月，全球开发者大会欢迎了 12 至 17 岁的应用开发者。结果，数百名青少年和大学生前往旧金山，进一步了解他们所在的行业。\n\
    \n如果你想走出国门，可以考虑世界移动通信大会（MWC）。这一年度盛会或许是全球同类活动中规模最大的，在西班牙巴塞罗那举行。大会以英语提供主题演讲、专家讨论和展览，面向各类技术人士。\n\
    \n## 术语表\n\n- **算法** 用于解决问题的一段自动化代码。\n- **应用商店** 提供应用供移动设备购买和下载的在线商店。\n- **品牌塑造**\
    \ 一个组织在营销和广告活动中经常展现的共同主题。\n- **跨平台格式** 应用程序可以在两个或多个移动设备平台上运行的情况。\n- **数据库管理**\
    \ 一组程序，用于控制数据库中数据的存储、修改和提取。\n- **创业者** 为营利而创办并管理企业的人。\n- **硬件交互** 用于将两台设备连接在一起的结构。\n\
    - **内存分配** 在移动设备或计算机上为程序或服务预留特定数量内存空间的过程。\n- **变现合作伙伴** 通过在博客、网站或移动应用内使用联盟广告、内容或程序来创造收入的人。\n\
    - **提醒弹窗** 一种弹出式提醒，用于告知用户应用的付费版本。\n- **网络** 在用户之间传输数据的系统。它包括操作系统、连接线缆、天线、基站和支持硬件。\n\
    - **操作系统** 在移动应用与计算机硬件之间提供用户界面的系统。\n\n## 更多信息\n\n苹果全球开发者大会  \n1 Infinite Loop\
    \  \nCupertino, CA 95014  \n美国：(800) 676-2775  \n加拿大：(800) 692-7753  \n网站：https://developer.apple.com/wwdc\
