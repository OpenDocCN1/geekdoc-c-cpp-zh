    ![](img/86130a5c6eb4407447b6379efec2f80d_31_0.png)


    Android 应用 Spotify 是一项瑞典音乐流媒体服务，允许用户分享自己喜爱的曲目。你可以浏览数百万首曲目，并通过即时推荐发现新的心头好，这些推荐已在市场上产生影响。他们研究用户界面，寻找挖掘潜在用户心愿单的方法。


    开发移动应用需要多项技术技能。你可能需要理解设备操作系统的功能，并以适当的计算技能应对，如数据库管理、内存分配、安全性和硬件交互。Java 和 C++ 等经典面向对象编程语言是必备技能。移动平台
    API——Apple iOS、Android、BlackBerry 和 Windows Mobile——是知识的核心，同时还要理解平台的 SDK。HTML、CSS、JavaScript，甚至
    PHP、Perl 和 ASP 等 Web 开发语言也非常宝贵。然后是 Antenna 和 AMP 的跨平台移动套件。如果你决定进行跨平台格式化，然后根据该移动设备的功能构建应当构建的内容，你可能会面临巨大挑战。跨平台格式化是让应用程序兼容不同的移动操作系统。


    尽管这看起来可能令人不堪重负，但许多开发者选择将技术责任委托给他人。你可以担任项目经理，监督项目的各个阶段。寻找在业内取得成功的人，并向他们学习。学习他们的流程并效仿他们的模式。资深开发者说，如果你能把想法画在一张纸上，你就能构建一个应用。一旦你有了规划策略，就该起草技术设计原型了。


    ## 通过创建移动应用打造职业生涯


    ![](img/86130a5c6eb4407447b6379efec2f80d_33_0.png)


    Julien Beasley（右），来自 Advanced Micro Devices 的图形处理器设计主管，正在参加“黑客马拉松”这一开发活动；Peter
    Dwersteg（左），一名 Microsoft Windows 8 操作系统开发者，提供协作。


    你的应用将如何运作？故事板原型让你在编写代码之前进行测试，从长远来看可以节省时间和金钱。如前所述，有许多技术技能可以帮助你成为全面发展的开发者。如果你计划从零开始开发一个应用，重要的是要注意这并不是一条容易走的路。除了技术技能，应用开发还需要倾听他人、时间管理、灵活性和规划能力。快速推进流程的最佳方式是设定短期和长期目标。你所需要的只是一个绝妙的想法。如果执行得当，它可以改变应用世界。如果你的想法吸引人、方便，并且能在平台和市场内良好运作，那么就该将其付诸行动。你愿意跳进移动应用开发的精彩世界吗？


    ![](img/86130a5c6eb4407447b6379efec2f80d_34_0.png)


    知识产权是指用于商业的文学和艺术品牌及内容。现有法律保护一个人的知识产权。通过在创建应用之前研究你的类型，你可以避免法律纠纷——以及高昂的法律费用。


    ![](img/86130a5c6eb4407447b6379efec2f80d_35_0.png)


    ## 第四章：……开发！


    重要的是要知道，应用开发没有魔法咒语，也没有万无一失的公式。取决于热情、技能水平和资源，开发应用初稿可能需要几小时到几个月不等。从那时起，在取得显著成就之前，你很可能会经历多轮试错。大多数应用开发者在成功之前都会失败。以打造有史以来最受欢迎的移动应用游戏《愤怒的小鸟》的开发公司为例。那是
    Rovio 的第五十二款游戏应用，证明开发成功的应用关键在于永不放弃。


    ![](img/86130a5c6eb4407447b6379efec2f80d_36_0.png)


    由 Rovio Entertainment Oy 设计的《愤怒的小鸟》在发布后的几个月内便风靡全球。它是史上最畅销的付费应用。


    ### 技术工具


    要正确传达你的想法，只需把它画在一张纸上。一些开发者使用 Photoshop 的 Draft 或 Finger Print Security Pro。


    在应用开发中，质量是第一位的。你会希望设计一个能在十到十五秒内抓住用户注意力的应用。它需要用户友好、有吸引力且速度快。人们总是在寻找好的应用，但你要确保你的应用能正常工作并且质量很高。避免用过多“花哨功能”绊住用户，这些功能可能会使应用的设计、速度和一致性变得复杂。考虑为每项任务单独提供一个应用，以尽可能最佳的方式提供特定功能。少即是多。


    当你有了一个可用的应用版本后，务必让一组来自目标市场的客观代表对其进行测试。大多数经验丰富的应用开发者建议每次发布至少进行三轮用户测试。观察他们与你的原型的互动。应用在执行命令时足够快吗？功能正常吗？还是会弹出错误消息？采访测试者，询问他们在使用应用时的想法。他们期望应用为他们做什么？欢迎反馈，尤其是那些要求改进的意见。然后优先处理错误修正和增强功能。有些改进可以等到应用的第二个版本。


    ### 设定价格点


    既然你闪亮的新应用已经过测试，现在该考虑价格点了。大多数应用是免费的，而许多应用的价格在 99 美分到 5 美元之间。专业应用可以卖到数百或数千美元。这些包括一款
    300 美元的钢琴调音应用、一款 900 美元的视频监控应用，或一款为想通过加州律师资格考试的法律人士准备的 1000 美元学习指南。专业应用是例外，因为它们都有明确的市场价值和有限的受众。


    以免费或“轻量”版应用开始你的应用开发之旅。通过了解用户对功能和设计的反应，你将获得对未来项目有价值的知识。此外，免费应用往往能带来


    ### 提交你的应用


    将你的应用提交到应用商店可能需要一到两周时间。每家商店对移动平台和操作系统都有自己的要求，有些商店比其他商店更严格。应用商店代表每周会审核数千款应用。他们会考虑整体客户体验，因为他们知道这是成功的关键。审核人员会考虑质量、整体功能、发布日期和固件要求。他们希望避免用户下载应用后才发现自己的设备在技术上无法使用该应用。大多数应用商店对淫秽内容或会损坏移动设备的应用零容忍。


    当开发者的应用在应用商店上架时，他们会从中受益。他们不仅能接触国际市场，应用商店还提供免费的分析工具，以便进一步洞察。开发者可以查看下载时间，以确定未来营销工作的战略性时间段。此外，应用商店提供地理信息，披露用户下载应用时的位置。这将有利于你未来的营销和产品工作。


    然而，应用开发者并不局限于应用商店。他们可以使用像 GetJar 这样的独立应用商店。GetJar 成立于立陶宛，是一家独立手机应用商店，也是世界上最大的免费应用商店。它为各种平台提供超过
    150,000 款应用。GetJar 通过赠送免费奖励来鼓励用户尝试新应用。这可能会吸引更多用户访问你的新应用。最重要的关键是提交你的高质量应用。你提交的位置越多，触达那些愿意下载你的应用或作品的用户的机会就越大。


