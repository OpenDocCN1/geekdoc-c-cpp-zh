    > 自学成才的青少年开发者人数不断上升，他们正在对应用开发行业产生令人瞩目的影响。他们的创作新颖且有利可图，激励着这一新兴移动应用经济中的其他青少年。


    这些能力可以用游戏和视频娱乐，或分享新闻、天气和财务报告等信息。无论你是想拍摄越野公路旅行的照片、保存最重要的密码、学习一门新语言，还是想知道哪支球队赢得了赛季总决赛，这些功能强大的软件单元都将让世界尽在指尖。


    **看一看** 根据克里斯汀·马里诺（Kristin Marino）的文章《如何成为移动应用开发者》，最受欢迎的应用包括游戏（占下载用户的64%）、天气（60%）、社交网络（56%）、地图/导航/搜索（51%）和音乐（44%）。


    ### 应用的历史


    1983年，第一部移动电话摩托罗拉DynaTAC 8000X面向消费者推出时，它与今天的高科技智能手机毫无相似之处。它重1千克（2.2磅），最多可存储30个电话号码，电池续航仅一小时，售价近4000美元。1997年，诺基亚将*贪吃蛇*嵌入其6110移动电话。这款游戏是对20世纪70年代电脑游戏的重制；像素化的爬行动物在绿色背景上细节精细的微型迷宫中滑行时，身体会不断变长。


    尽管以今天的标准来看*贪吃蛇*相当基础，但它深受用户欢迎。它的成功促使其他公司在移动设备中加入街机类游戏，包括*乒乓*、*井字棋*和*俄罗斯方块*。它们也开始加入生产力应用，包括计算器、日历、电子邮件功能和铃声。20世纪90年代末和21世纪初，几乎每部移动电话都会大声播放一首排行榜前40名热门歌曲的副歌。


    移动服务提供商之间竞争激烈，商业秘密受到严密保护。移动应用只能由内部设计师创建。无线应用协议（WAP）——HTTP的一个类似版本——的开发，正是第三方开发者获得入行机会所需要的。WAP使精简后的网页能够轻松显示在非常小的屏幕上，或通过无线网络向移动设备上的应用提供实时内容。它受到所有操作系统的支持，并能在许多移动设备的存储器和带宽限制内运行。设备上设有WAP接入点后，第三方


    ## 踏入数字应用世界


    ![](img/86130a5c6eb4407447b6379efec2f80d_8_0.png)


    1973年的DynaTAC原型机（左）是第一部便携式蜂窝电话。1984年的摩托罗拉DynaTAC 8000X（右）是世界上第一部商用便携式蜂窝电话。


    ## 踏入数字应用世界


    ### 创造应用商店历史


    人们去哪里获取最新的移动应用？当然是应用商店。用户只需访问其移动设备的应用商店，就能在成千上万的娱乐、社交媒体、商务和新闻应用中选购。只需轻点按钮，他们就能查看应用图片和评论以及各种价位。第一家创造历史的应有商店是传奇的苹果应用商店。它于2008年7月开业，一周之内就有一千万个移动应用被下载。其中只有25%是免费的，这意味着顾客乐于为定制自己设备的应用付费。


    苹果应用商店为其他应用商店进入市场铺平了道路。Android Market于2008年开设虚拟商店，随后是2009年的Ovi Store、2009年的BB
    App World，以及2010年的Windows Phone Marketplace。如今，苹果应用商店为iPhone、iPad和iPod Touch销售数千款移动应用。事实上，它在2012年春季达到了250亿次下载量。


    移动应用市场是独立开发者的数字梦想。开发者可以创建并编写创新移动应用，同时依靠应用商店处理销售应用这一商业环节。作为利润分成——通常为30%——应用商店将负责营销和销售分发。这使开发者得以凭借其创意想法、有吸引力的内容和恰当的实施，成为数字巨星。


    各种各样的免费或价格实惠的应用，兼容其他操作系统，如Android、BlackBerry OS、Windows Phone OS和iOS。每种操作系统都要求应用完全用兼容操作系统的语言从头编写。这意味着开发者需要具备特定编程语言的实用知识，例如用于Android和BlackBerry的Java、用于Windows
    Mobile的C++，以及用于iOS的Objective-C。


    ### 应用类型


    除了众多编程语言外，移动应用还有三种类型：原生应用、移动Web应用和混合应用。原生应用是专为移动设备的操作系统创建的独立应用。大多数移动游戏都是原生应用，例如*割绳子*、*植物大战僵尸*，以及大热作品*愤怒的小鸟*。原生应用必须从应用商店下载。希望创建原生应用的应用开发者可以受益于标准化软件开发工具包（SDK）。SDK由平台制造商提供，包括用户界面元素和开发工具。原生应用虽然速度快且通常保持更新，但构建和维护成本高昂。示例包括用于iOS操作系统设备的*Camera+*，或用于Android设备的*KeePassDroid*。


    移动Web应用基于Web，并与其他移动平台兼容。这些应用无需从传统应用商店下载。它们只需从设备的Web浏览器中访问。示例包括*Instagram*、*Dropbox*、*Google
    Maps*和*YouTube*。想要创建移动Web应用的开发者可以使用一些服务器端语言、Web应用框架或计算机编程代码——HTML5、CSS3或JavaScript——他们可能已经


