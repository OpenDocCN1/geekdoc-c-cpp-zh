    ## 第二章


    ## 应用创业者靠移动应用致富


    与其他职业相比，移动应用开发相对较新。这意味着顶尖开发者未必有正式的开发者背景。有些人拥有相关领域一长串资历和成就。史蒂夫·德米特（Steve Demeter）是一名
    ATM 软件设计师，业余时间开始设计应用。2007年夏天参加一场 iPhone 大会时，他受到启发。他相信，苹果发布 SDK 时为开发者打开了一个充满机遇的世界。这使得第三方应用可以下载到移动设备上，德米特知道这段经历可能为他打开进入这个新兴行业的大门。


    ![](img/86130a5c6eb4407447b6379efec2f80d_16_0.png)


    史蒂夫·德米特抵达内华达州拉斯维加斯，出席互动艺术与科学学院第12届年度互动成就奖。该学院旨在表彰在电子游戏行业取得杰出成就的人士。


    ### 创建移动应用


    他花了几个月时间构思一款巧妙而又原创的游戏应用。2008年2月，他有了想法。在连续四个月利用晚上和周末不知疲倦地编码后，*Trism* 准备好在2008年于苹果
    App Store 首次亮相。头两个月里，德米特就靠这款色彩鲜艳的三角形游戏赚了25万美元。他最终辞去银行工作，创办了游戏开发公司 Demiforce。


    一些顶尖开发者利用在线工具自学了构建应用的艺术与科学。互联网不仅提供市场，还包含主要的信息来源和训练营。几乎应用开发的每个步骤都有文字甚至动画教程。成千上万的论坛和网络社区致力于应用开发。自学成才的应用开发者查德·穆雷塔（Chad
    Mureta）接触移动应用行业的方式则颇为不同。2009年，穆雷塔翻车，惯用手严重受伤。他在医院卧床数周。在漫长的康复期间，一位朋友给了他一篇关于应用制作创业者的文章，这些人被称为“应用创业者”。其中大多数是一两人团队开发应用。他们的启动成本很低，穆雷塔了解到，成功的创业者靠自己的设计赚取数千美元，甚至数百万美元。受到鼓舞，穆雷塔开始从病床上开发应用。他相信这个商业机会能帮他支付巨额医疗账单。经过18个月的康复和无数小时的应用开发，穆雷塔得以离开他的房地产公司。作为应用创业者，他把每周70小时的工作制换成了每周5小时工作制，用
    iPhone 在世界任何地方工作。蒂姆·费里斯在 FourHourWorkWeek.com 上引用了穆雷塔的话：


    > 仅仅两年多，我就创建并出售了三家应用公司，创造了数百万美元收入。我的第一家公司上线两个月后，其中一款应用平均每月利润达3万美元。2010年12月，公司的月收入已达到12万美元。我一共开发了40多款应用，全球应用下载量超过3500万次。我的应用中超过90%都成功了并实现了盈利。


    ### 企业与移动应用开发


    企业总是在寻找改善运营、提高生产力和带来更多利润的方法。移动应用是实现这些目标的一种有前景的方式。从国际时装公司到高科技企业，各行各业都已将移动应用加入其营销战略，作为品牌建设的一部分。


    过去，只有成熟企业才能最大化移动应用带来的好处。如今情况已非如此。各种规模的企业现在都会开发应用用于销售或分发。例如，本地婚礼策划师可以使用一款应用帮助客户筹划他们的重要日子。快递服务公司会创建应用，帮助客户追踪寄往世界各地亲友的包裹。此外，创业者和员工可以通过使用公司应用来完成内部任务。他们可以在几分钟内管理库存、访问客户数据库并填写工时卡，效率以秒计。企业可以利用应用创造收入。许多创业者为希望从免费应用升级的用户提供高级版移动应用。另一些创业者则提供在应用内展示的广告或列表信息。例如，一家出版公司可能会在书店应用中发布其网站或目录的链接。对于认识到移动应用行业益处和优势的精明企业主来说，大量选择正等待着他们。


    有兴趣为企业开发移动应用的应用开发者必须了解该公司面临的挑战和期望。该组织想要实现什么？它如何接触新客户和现有客户？一旦应用开发者理解了企业的目标，他或她就可以创建应用。借助移动设备上精致完善的应用，用户可以支付账单、配药，或计划去阳光明媚的墨西哥度假。


    ### 尼克·达洛伊西奥


    神童们也纷纷投身应用开发行业。尼克·达洛伊西奥一直对技术着迷。他八岁时，父母给他买了一台 iPod。第二年，他缠着父母给他买一台 Mac。尼克用他的新台式电脑制作影片，后来在苹果开设
    App Store 时转向编程——Final Cut、Final Cut Pro 和 3D 渲染软件。尼克当时只有12岁。


    他开发了多款应用，包括 *Fingermill*、*Facemood* 和 *SongStumblr*。15岁的尼克在为历史实验课学习时，发现了流行搜索引擎的低效之处。他开始着手开发更好的东西。在他临时搭建的卧室应用开发控制中心里，他为自己的新
    iOS 应用开发了一种算法。这款应用名为 *Trimit*，它能概括杂志和报纸文章，让读者在单个智能手机屏幕上了解要点。该应用于2012年11月推出，受到超过20万用户的欢迎。同年，*Summly*
    荣获苹果最佳应用之一称号。尼克这款巧妙的应用引起了李嘉诚及其风投公司维港投资（Horizon Ventures）的注意。这位香港亿万富翁投资了30万美元，其他投资者也加入其中，包括阿什顿·库彻、小野洋子、斯蒂芬·弗莱、伦敦科技城负责人乔安娜·希尔兹，以及
    Zynga 创始人马克·平卡斯。


    *Summly* 受到国际新闻机构的欢迎。它们对网站获得的额外流量表示赞赏。其中一些机构达成协议，在应用内突出展示其出版物。根据读者身处世界何处，他或她将收到


    ![](img/86130a5c6eb4407447b6379efec2f80d_20_0.png)


    十七岁时，尼克·达洛伊西奥将他的大热应用 *Summly* 卖给雅虎，登上了世界各地的头条。他的勤奋和创造力激励了同龄青少年尝试成为成功的应用创业者。

