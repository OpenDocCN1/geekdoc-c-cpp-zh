  md: "\n## GOING GLOBAL\n\nWhen you submit your app to an app store, you will be\
    \ asked for particular information, including distribution. Think big. The app\
    \ market is so much greater than that of your home country. China is a quickly\
    \ growing market and is expected to surpass the United States in money spent on\
    \ technology. New carriers are starting to distribute smartphones, meaning more\
    \ subscribers could have access to your app. Even if you think your app applies\
    \ to only a certain group of people in one particular geographical niche, you\
    \ may be surprised. Set your app release to global distribution and watch how\
    \ it attracts a number of international users. They may discover how fun and handy\
    \ your new creation is and want to download it immediately.\n\nIn order to achieve\
    \ this kind of exposure, consider translating your app into other languages. Mandarin\
    \ and Spanish are among the most common languages spoken in the world. French,\
    \ German, Italian, Portuguese, Russian, Bengali, Hindustani, and Arabic could\
    \ be other options to expand your market. Professional translators can help you\
    \ transfer your scripts to grammatically correct international languages. Some\
    \ developers release their apps in countries smaller than their own. These markets\
    \ allow them to test apps before releasing them in their homeland. Keep in mind,\
    \ too, that there may be legal limitations such as content rights in other countries.\
    \ Be sure to be thorough in your market research to avoid any legal issues.\n\n\
