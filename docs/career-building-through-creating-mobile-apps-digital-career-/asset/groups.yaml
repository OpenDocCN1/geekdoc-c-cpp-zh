    ### 托马斯·苏亚雷斯


    和尼克·达洛伊西奥一样，托马斯·苏亚雷斯对计算机和技术着迷。12岁时，他被称为最年轻的 iPhone 应用开发者，为 iPhone、iPod touch 和
    iPad 创建应用。他掌握了 Python、C 和 Java 等编程语言，同时 SDK 让他能够设计应用，其中一款是 *Earth Fortune*。他说服父母拉尔夫和玛格丽特支付99美元，让他的应用登上
    Apple 的 App Store。托马斯创作了 *Bustin Jieber*，一款使用贾斯汀·比伯头像的打地鼠游戏。他产生这个想法，是因为他的许多同学都不喜欢这位著名的加拿大歌手。该游戏于2010年假期前发布，售价99美分。迄今为止，这是托马斯最成功——也是最喜爱——的移动应用。他创办了
    CarrotCorp，一家销售四款基于 iOS 平台的移动应用的公司。


    2011年10月，托马斯在加利福尼亚州的 TEDxManhattanBeach 活动上发言。他的演讲题目是“托马斯·苏亚雷斯：一个12岁孩子的应用”。


    斯宾塞尝试将价格翻倍。在24小时内，该应用每天毛收入40美元；此后每天，斯宾塞的应用每天带来100到150美元收入。尽管这些应用因侵犯版权而被下架，斯宾塞却上了瘾。2011年为期两周的假期里，他在酒店商务中心工作，开发并发布了另外两款应用。这些应用的销售收入让他的时间和付出非常值得。斯宾塞对
    YoungEntrepreneur.com 的卡拉·昂格伦说：


    > 没有多少人知道如何创建能盈利的 iPhone 应用，所以我必须测试、修改、再测试、再修改，并再测试五十次。我今天仍在测试新策略。当你通过外包创建应用时，这个过程包括想出出色的应用创意、找到高技能员工、绘制应用功能流程图、营销以及协调整个过程。


    Malibu Apps 被评为《青年企业家》2012年10月月度初创企业。自成立以来，Malibu Apps 已发布超过50款应用，包括 *掌握健康生活的10步营养计划*、*Minecraft
    完全指南*、*我最喜欢的犬种* 和 *《愤怒的小鸟季节版》全金蛋*。斯宾塞原本打算空出一年时间，并于2013年进入大学。然而，在第一个财年结束前，他的净收入迅速超过了10万美元。他和父母开始认为大学可能不是最好的选择。他们支持继续发展
    Malibu Apps 和 Malibu Microcap LLC 的决定；后者是一家投资并为初创应用公司提供咨询的公司。如今，斯宾塞的理念“打造你自己的梦想，否则别人会雇你去打造他们的梦想”是他创业努力的核心。当被问及给有志年轻创业者的建议时，斯宾塞对
    YoungEntrepreneur.com 说：


