    大多数流量。它们下载速度快，大多数用户难以抗拒免费的益智游戏、食谱页面或会说话的卡通。尽管应用免费，开发者仍能通过应用赚钱。怎么做？他们使用应用内广告。有些甚至收集个人数据卖给其他公司。开发者希望用户如此喜爱免费应用，以至于当“烦人弹窗”出现时，他们会购买升级版。一部分用户会购买付费版或“专业版”，只是为了避开广告打扰。一些应用开发者选择建立订阅模式，向付费用户分发有价值的信息。无论你选择哪种方式，请记住：在努力赢得客户忠诚度和推荐时，质量最重要。


    变现合作伙伴可以通过应用内广告帮助你的移动应用实现收入最大化。Google AdMob 就是这样的变现合作伙伴之一。


    开发者可以从数千名广告主中选择那些能提升其应用价值的广告主。当用户点击广告时，开发者即可获得付款。在你发布应用后，你可能会在两个月内看到钱进入你的银行账户。


    花些时间思考你的应用品牌。它将让你的作品在市场中具有专业而独特的形象。品牌建设从名称开始，并延伸到设计、颜色、字体、音乐和文案。成功的开发者建议研究你所在类别的竞争对手。他们在市场中如何展示自己的应用？然后审视你自己的品牌。你如何将所学运用到整体设计中？接下来是营销，包括应用商店推广、社交媒体活动和发布派对。请记住，不同的目标受众需要不同类型的营销。面向青少年的广告不同于面向退休人员的广告。可能需要整整一周或几个月来打磨一场营销活动。但现实地说，并非每一位出色的程序员都擅长营销。你可能需要一个可靠且同样充满热情的合作伙伴来分担这些责任。


    如果你缺乏广告资金并选择以开发者身份推广你的应用，就要有创新精神。此时应解释应用的目的。在发布新应用之前，与受众建立关系。在第一天就通过应用商店获得几十条好评，会吸引其他人点击“购买”按钮。此外，还要提供简洁有力的产品描述。利用免费资源，例如
    Facebook 粉丝页、Twitter、YouTube 和博客。每天发送提醒、突发新闻以及评论和评分请求。如果你的应用有趣且独特，你的网友会使用它并分享给他人，帮助建立一个粉丝社区。尝试多种渠道，看看哪些有效，但无论你做什么，都不要停止推广你的应用。如果你有一款高质量的应用，用户会热情地推荐给他人。很快，这款应用就会自己卖自己。


    监测应用的网络热度是成功的关键。分析工具将通过记录下载量、独立用户数、页面浏览量和会话时长，帮助你判断应用的成功程度。你可以投资内部分析，以发现用户价值、客户归因模型和变现收益。诸如
    *App Annie* 或 *Distimo* 之类的外部分析工具将帮助你决定要瞄准哪些市场和平台。此外，应用商店会提供评分和评论，而 Facebook 的
    Insight 会显示你的 Facebook 社区内的用户活动报告、帖子活动和人口统计信息。关键词搜索将确定哪些网站推广你的移动应用。如果某些做法不起作用，就改变它。


    应用发布后，还会有一些“漏洞修复”和维护工作需要处理。你的评论者会告诉你哪些功能有效、哪些无效。要快速且专业地回应他们的关切，因为良好的服务始终会影响你未来的销售。此外，还要考虑将来更新你的应用。也许它需要新的醒目设计、更高的用户参与度、更多功能或更具竞争力的定价。快速修改可能只需一分钟，而彻底改造可能需要几个月。


