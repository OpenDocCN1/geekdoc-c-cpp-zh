    ## 第五章

    ## 应用世界等你来


    二十年前，最成熟的通信方式是家庭电话。它是一部固定电话，唯一的功能包括呼叫等待或语音信箱。如今，数百万人依赖手机不仅与他人沟通，还获取在线咨询信息——从工作所需到订购一份加双倍奶酪的大号意大利辣香肠披萨。娱乐、商业、流行文化和零售只是不断变化的移动应用市场所提供的部分选择。正因如此，如今比以往任何时候都更需要高素质且充满热情的开发者。


    ![](img/86130a5c6eb4407447b6379efec2f80d_46_0.png)


    ![](img/86130a5c6eb4407447b6379efec2f80d_46_1.png)


    固定电话可能很快就会过时，因为智能手机和平板电脑已成为人际联系的热门选择。用户可以随时随地自由联系个人和职业网络。


    ![](img/86130a5c6eb4407447b6379efec2f80d_46_2.png)


    Schools.com 为那些有兴趣将应用开发兴趣转化为长期职业的人提供在线教育。


    ### 开启职业生涯


    青少年应用开发者高中毕业后面临许多选择。有些人决定把自己的开发经验作为大学申请的垫脚石。他们可能希望通过大学计算机科学或软件工程的学习来培养技能。由于公立和私立大学都在寻找全面发展的学生，招生人员会青睐开发者具备均衡发展、积极主动和参与课外活动的能力。你想脱颖而出，而学习如何开发移动应用是一个很好的方式。如果你对开发有兴趣和天赋，那就投入进去，开始开发。发布几款不同类别的应用，以展示你的广度。你的应用可以简单，但也必须处于最佳状态，没有错误或粗糙之处。维护一个作品集，向大学招生官展示你的能力。他们会对你通过应用开发获得的其他重要技能印象深刻：专业精神、解决问题能力、责任心、适应力、专注力、沟通技巧和自我激励。许多学校已经开始提供移动应用开发方面的专业课程、认证或学位。一些雇主要求具备这类经验，才能受雇成为他们的全职移动应用开发者。


    一些移动应用开发者选择完全不上大学。他们可能选择一条更具冒险精神的数字职业道路，把自己的爱好变成有回报的职业。开发者的职业道路无穷无尽，包括客户经理、全职开发者、顾问、软件工程师、产品和项目经理以及质量保证测试员。作为拥有该领域经验——用户界面设计、计算、编程和商业专长——的开发者，你可以步入这些令人兴奋的职业之一。当然，你可以创办自己的移动


