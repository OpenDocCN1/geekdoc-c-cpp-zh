    $k$ in both the maximization and classification.


    The kernel trick can be applied to all linear classification methods to separate
    data which is not linearly separable. All methods reduce to evaluations of the
    kernel function $k$.


    The kernel function was derived from a higher dimensional inner product. In the
    previous chapter, we viewed the inner product as a measure of the relationship
    between different samples. A new sample is classified according to whether it
    is more related to the support vectors of one class than the other. The kernel
    function gives a numeric value describing the relationship between two samples.


    Such functions describing relationships between samples can be constructed. A
    necessary and sufficient condition that such a function be suitable for our purposes
    is that the $N \times N$ matrix $\mathbf{K}$ with $(m, n)$ entry equal to $k(\mathbf{x}_m,
    \mathbf{x}_n)$ is positive semi-definite for any $N$ and for any set $\{\mathbf{x}_1,
    \dots, \mathbf{x}_N\}$. It is known as *Gram* or *Gramian matrix*. The constant
    function $k(\mathbf{x}, \mathbf{y}) = c$ for positive $c$ is a valid kernel, since
    then for any vector $\mathbf{v} = (v_1, \dots, v_n)^T$


    $\mathbf{v}^T \mathbf{K} \mathbf{v} = c \left( \sum_{n=1}^N v_n \right)^2 \ge
