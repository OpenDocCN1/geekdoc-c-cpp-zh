  md: '![](img/d3c00252180686426c9e63ab889b535b_118_0.png)


    Figure 4.6: Classification using different features.


    is maximal if w1, ..., wK-1 are the generalized eigenvectors corresponding to
    the K-1 largest generalized eigenvalues of the generalized eigenvalue problem


    $\Sigma_B w = \lambda \Sigma_W w$.


    This is implemented in MATLAB as


    ```

    ClassificationDiscriminant.fit

    ```


    There are also other strategies to classify multiple classes. These are based
    on binary classifiers.


    The first one is known as One vs Rest (OvR) or One vs All (OvA). K binary classifiers
    are constructed, each giving a confidence score for a sample belonging to the
    kth class, k = 1, ..., K. A sample is labeled with the class with the highest
    confidence score. There are two disadvantages. Firstly, the confidence scores
    have to be calibrated between each other. Secondly, the binary classifiers seek
    unbalanced distributions, since the number of samples in the kth class is much
    smaller than the number of samples NOT in the kth class.


    The other one is known as One vs One (OvO). For each pair of classes, K(K-1)/2
    classifiers are trained. A sample is labeled with the class for which the most
    classifiers vote. The case where two or more classes receive the same number of
    votes needs to be handled.


    As can be seen in Figure 4.6 some features are more useful for classification
    than others. We examine this further when discussing feature selection.'
