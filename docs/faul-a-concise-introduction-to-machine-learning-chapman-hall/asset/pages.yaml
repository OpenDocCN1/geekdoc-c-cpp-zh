- pgno: 21
  md: '# # Introduction


    When thinking about machine learning, it seems prudent to start thinking about
    how we learn. King Frederick II (26 December 1194 - 13 December 1250) was Holy
    Roman Emperor and King of Sicily in the 13th century. King Frederick was a passionate
    patron of the sciences and arts. He spoke six languages which were Latin, Sicilian,
    German, French, Greek and Arabic. He desired to determine the “god given” language.
    The Italian Franciscan friar Salimbene de Adam writes in his Cronica [25] that
    Frederick bade “foster-mothers and nurses to suckle and bathe and wash the children,
    but in no ways to prattle or speak with them; for he would have learned whether
    they would speak the Hebrew language (which had been the first), or Greek, or
    Latin, or Arabic, or perchance the tongue of their parents of whom they had been
    born. But he laboured in vain, for the children could not live without clappings
    of the hands, and gestures, and gladness of countenance, and blandishments.” In
    other words the physical needs of the children were satisfied, but they were raised
    without any human interaction. It is doubtful whether this is a true account,
    since this is the only account and Salimbene was a political opponent of Frederick
    II. Nevertheless, nobody doubts that sensory stimulation and experiences are essential
    for learning in any respect.


    Blakemore and Cooper [4] experimented with kittens. The kittens were brought up
    in a dark room and only brought out at certain times and then placed in an environment
    with either only horizontal or only vertical lines. Kittens brought up in the
    horizontal environment showed no reaction to vertical lines. There was no brain
    activity. Indeed, when the inclination of a horizontal line was changed gradually
    towards a vertical line the brain activity became less and less.


    The experiment showed that only what the brain is presented with by the environment
    is learned. This is an efficient preparation for the future. This is also true
    for human vision. Australian Aborigines have the sharpest vision ever measured,
    about four times better than the vision of those white ethnicity. This means that
    they can see objects sharply at six meters distance which the average white person
    can see clearly at only 1.5 meters, a quarter'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/d3c00252180686426c9e63ab889b535b_22_0.png)


    Figure 1.1: Vertical environment. Reprinted by permission from Macmillan Publishers
    Ltd: Nature [4], copyright (1970).


    of the distance. Often the eyesight deteriorates with old age. Ophthalmologist
    Professor Fred Hollows [22] corrected the vision of an elderly Aboriginal man
    back to the average white person''s vision with glasses. The reaction was "Thank
    you for trying, but this is hopeless. I used to be able to see much better." The
    Australian outback is a wide open landscape and good vision in the distance is
    vital for survival.


