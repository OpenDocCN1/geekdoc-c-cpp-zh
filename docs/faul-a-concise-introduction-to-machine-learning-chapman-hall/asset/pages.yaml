- pgno: 250
  md: '# 8.7 Cross-validation


    The analysis of the previous section relied on the fact that experiments are repeatable,
    and thus data can easily be generated. However, often the acquisition of data
    is associated with substantial costs, and it is essential to use data well. In
    cross-validation, the available data are partitioned into complementary subsets,
    one for training and one validation set. Multiple rounds of cross-validation are
    performed, and the results are averaged over the rounds. This way the goodness
    of the model can be assessed. There are two types of cross-validation: exhaustive
    and non-exhaustive. The former examines all possible ways to divide the original
    data set into a training and a validation set.


    Leave-p-out cross-validation sets aside p samples for validation as the names
    suggests. All possibilities to choose p validation samples from n samples are
    considered. This means the regression algorithm has to be run \(\frac{n!}{p!(n-p)!}\)
    times which even for moderate n and p can become computationally prohibitive.
    Leave-one-out cross-validation is a special case of leave-p-out cross-validation
    with p = 1. In this case the algorithm is run n times.


    In k-fold cross-validation the data set is randomly subdivided into k equal sized
    subsets. One of these is used as the validation set while the other k - 1 form
    the training data set. The model generation is repeated k times (the folds) with
    each of the subsets being the validation set exactly once. The k results are then
    averaged for assessment. All data samples are used for both training and validation,
    and each sample is used exactly once for validation. When k = n, k-fold cross-validation
    is the same as leave-one-out cross-validation.


    # 8.8 Multicollinearity and Principal Component Regression


    Multicollinearity is another problem which arises when one or more predictor variables
    are highly correlated. In this case, one of the basis functions can be modeled
    by the others. One dimension of the model space is redundant. A high degree of
    correlation increases the variance in the coefficients, since different models
    are equivalent. They all model the measurements, but differ in the coefficients.
    As a consequence, small changes in the input data can lead to large changes in
    the model. Perfect multicollinearity means the regressors are linearly dependent,
    that is one can be exactly expressed by the others. In this case (D^T D)^{-1}
    does not exist.


    In a good regression model, the regressors correlate minimally with each other,
    but are each highly correlated with the regressand. The aim is to find a linear
    combination of few regressors which summarize and explain the data without too
    much loss of information. This section and the following show how to obtain new
    regressors from the dictionary.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '*Principal component regression* uses the principal components of **D** as
    regressors instead of the columns of **D**. In particular, let **d**<sub>1</sub>,
    ..., **d**<sub>M</sub> denote the columns of **D**. That is **d**<sub>i</sub>
    is the i<sup>th</sup> basis function evaluated at **x**<sub>1</sub>, ..., **x**<sub>N</sub>.
    In the following, we assume that the columns are standardized; that is they have
    mean 0 and length 1. The first assumption is valid, since the measurements are
    mean centred, and the second assumption is valid, since regressors are invariant
    to scaling. Any scaling will be absorbed in the multiplicative coefficient.


    The correlation between the i<sup>th</sup> and j<sup>th</sup> regressors evaluated
    at the N measuring points is then

    $$

    \mathbf{d}_i^T \mathbf{d}_j.

    $$


    The correlation matrix of all regressors is **D**<sup>T</sup>**D**. A new set
    of regressors is generated as linear combinations of basis functions from the
    dictionary, say

    $$

    v_1 d_1(\mathbf{x}) + ... + v_M d_M(\mathbf{x}).

    $$


    Evaluating this at the N sampling points, we arrive at a linear combination of
    the columns of **D**,

    $$

    v_1 \mathbf{d}_1 + ... + v_M \mathbf{d}_M = \mathbf{Dv},

    $$


    where **v** = (v<sub>1</sub>, ..., v<sub>M</sub>)<sup>T</sup> is chosen such that
    **Dv** $\neq$ 0. The zero vector would make a very poor regressor. The correlation
    between two such linear combinations is

    $$

    \frac{\mathbf{v}_1^T \mathbf{D}^T \mathbf{D} \mathbf{v}_2}{||\mathbf{Dv}_1|| ||\mathbf{Dv}_2||},

    $$


    where **v**<sub>1</sub> and **v**<sub>2</sub> are such that **Dv**<sub>1</sub>
    $\neq$ 0 and **Dv**<sub>2</sub> $\neq$ 0. Here we need to divide by the lengths,
    since **Dv**<sub>1</sub> and **Dv**<sub>2</sub> no longer will have length 1.


    Now, the matrix **D**<sup>T</sup>**D** is symmetric and positive semi-definite.
    Hence it has M non-negative eigenvalues and corresponding orthonormal eigenvectors.
    Thus choosing **v**<sub>1</sub> and **v**<sub>2</sub> to be eigenvectors of **D**<sup>T</sup>**D**,
    the new regressors are uncorrelated, since

    $$

    \mathbf{v}_1^T \mathbf{D}^T \mathbf{D} \mathbf{v}_2 = \lambda_2 \mathbf{v}_1^T
    \mathbf{v}_2 = 0.

    $$


    The eigenvectors corresponding to K nonzero eigenvalues are chosen. The new design
    matrix $\hat{\mathbf{D}}$ has columns **Dv**<sub>1</sub>, ..., **Dv**<sub>K</sub>.
    The corresponding functions span a K-dimensional subspace of the original model
    space, and are uncorrelated.


    Let **V** be the matrix with columns **v**<sub>1</sub>, ..., **v**<sub>K</sub>.
    Then $\hat{\mathbf{D}} = \mathbf{DV}$. The predictions are

    $$

    \mathbf{f} = \hat{\mathbf{D}}(\hat{\mathbf{D}}^T \hat{\mathbf{D}})^{-1} \hat{\mathbf{D}}^T
    \mathbf{t} = \mathbf{DV}(\mathbf{V}^T \mathbf{D}^T \mathbf{DV})^{-1} \mathbf{V}^T
    \mathbf{D}^T \mathbf{t}.

    $$'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Now $\mathbf{D}^T \mathbf{D} \mathbf{V}$ is the matrix with columns $\lambda_1
    \mathbf{v}_1, \dots, \lambda_K \mathbf{v}_K$, since $\mathbf{v}_1, \dots, \mathbf{v}_K$
    are eigenvectors of $\mathbf{D}^T \mathbf{D}$. It then follows from the orthonormality
    of $\mathbf{v}_1, \dots, \mathbf{v}_K$ that


    ```

    $(\mathbf{V}^T \mathbf{D}^T \mathbf{D} \mathbf{V})^{-1} = \begin{pmatrix} \frac{1}{\lambda_1}
    & 0 & \cdots & 0 \\ 0 & \ddots & & \vdots \\ \vdots & & \ddots & \\ 0 & \cdots
    & 0 & \frac{1}{\lambda_K} \end{pmatrix}.$

    ```


    With this result, we obtain


    ```

    $\mathbf{f} = \begin{pmatrix} \mathbf{D}\mathbf{v}_1 & \cdots & \mathbf{D}\mathbf{v}_k
    \end{pmatrix} \begin{pmatrix} \frac{1}{\lambda_1} & 0 & \cdots & 0 \\ 0 & \ddots
    & & \vdots \\ \vdots & & \ddots & \\ 0 & \cdots & 0 & \frac{1}{\lambda_K} \end{pmatrix}
    \begin{pmatrix} (\mathbf{D}\mathbf{v}_1)^T \\ \vdots \\ (\mathbf{D}\mathbf{v}_K)^T
    \end{pmatrix} \mathbf{t} = \sum_{k=1}^K \frac{(\mathbf{D}\mathbf{v}_k)^T \mathbf{t}}{\lambda_k}
    \mathbf{D}\mathbf{v}_k.$

    ```


    Geometrically, this is the projection of the regressand $\mathbf{t}$ onto the
    space spanned by the columns of the new design matrix $\tilde{\mathbf{D}}$. The
    coefficient for the new regressor $\mathbf{D}_i$ is $c_i = (\mathbf{D}\mathbf{v}_i)^T
    \mathbf{t} / \lambda_i$ in this model.


    To analyze $\mathbf{f}_i$, we decompose the regressand $\mathbf{t}$ into one portion
    lying in the subspace spanned by $\mathbf{D}\mathbf{v}_1, \dots, \mathbf{D}\mathbf{v}_K$
    and a remainder,


    ```

    $\mathbf{t} = \sum_{k=1}^K a_k \mathbf{D}\mathbf{v}_k + \mathbf{a},$

    ```


    where $\mathbf{a}$ is orthogonal to $\mathbf{D}\mathbf{v}_1, \dots, \mathbf{D}\mathbf{v}_K$.
    We then have


    ```

    $c_i = \frac{1}{\lambda_i} (\mathbf{D}\mathbf{v}_i)^T \left( \sum_{k=1}^K a_k
    \mathbf{D}\mathbf{v}_k + \mathbf{a} \right) = \frac{1}{\lambda_i} \sum_{k=1}^K
    a_k \mathbf{v}_i^T \mathbf{D}^T \mathbf{D} \mathbf{v}_k = a_i,$

    ```


    as expected.


    We can calculate the distance between $\mathbf{t}$ and $\mathbf{f}$,


    ```

    $\|\mathbf{t} - \mathbf{f}\|^2 = \mathbf{t}^T \mathbf{t} - 2 \left( \sum_{i=1}^K
    \frac{(\mathbf{D}\mathbf{v}_i)^T \mathbf{t}}{\lambda_i} \mathbf{D}\mathbf{v}_i
    \right)^T \mathbf{t} + \sum_{i,j=1}^K \frac{(\mathbf{D}\mathbf{v}_i)^T \mathbf{t}}{\lambda_i}
    \frac{(\mathbf{D}\mathbf{v}_j)^T \mathbf{t}}{\lambda_j} (\mathbf{D}\mathbf{v}_i)^T
    \mathbf{D}\mathbf{v}_j = \mathbf{t}^T \mathbf{t} - \sum_{i=1}^K \frac{((\mathbf{D}\mathbf{v}_i)^T
    \mathbf{t})^2}{\lambda_i} = \|\mathbf{a}\|^2,$

    ```'
  merge: -1
