  md: 'and let \( t^T = (t_1, \dots, t_N) \), \( \mathbf{c}^T = (c_1, \dots, c_M)
    \) and \( \boldsymbol{\epsilon}^T = (\epsilon_1, \dots, \epsilon_N) \), then


    ```

    \(\mathbf{t} = \mathbf{Dc} + \boldsymbol{\epsilon}.\)

    ```


    The regression problem has become a system of linear equations. Solutions of these
    have been studied extensively; see for example [12]. However, it differs from
    a standard system of linear equations in that it incorporates a noise model.


    The \( N \times M \) matrix \(\mathbf{D}\) is called the *design matrix*. The
    challenge is to find the dictionary of basis functions and the coefficients. Once
    these are found, predictions for new unseen data \(\mathbf{x}\) can be made by


    ```

    \( t = \sum_{m=1}^M c_m d_m(\mathbf{x}). \)

    ```


    Or, by defining \(\mathbf{d}(\mathbf{x})^T = (d_1(\mathbf{x}), \dots, d_M(\mathbf{x})),\)


    ```

    \( t = \mathbf{d}(\mathbf{x})^T \mathbf{c}. \)

    ```


    In the following we assume that the dictionary of basis functions and thus the
    design matrix are fixed.


    # 8.3 Polynomial Regression


    Polynomial regression dates back to Lagrange (1805) and Gauss (1809). Fitting
    a line to the data is a special case of polynomial regression, where the polynomial
    is linear one. Here \( t \) is modeled as a polynomial of degree \( M-1 \). The
    dictionary is \( d_1(x) = 1, d_2(x) = x, \dots, d_{M-1}(x) = x^{M-2}, d_M(x) =
    x^{M-1} \) which form a basis of polynomials of degree \( M-1 \). The design matrix
    is


    ```

    \(\mathbf{D} = \begin{pmatrix} 1 & x_1 & \cdots & x_1^{M-2} & x_1^{M-1} \\ \vdots
    & \vdots & \ddots & \vdots & \vdots \\ 1 & x_N & \cdots & x_N^{M-2} & x_N^{M-1}
    \end{pmatrix}\)

    ```


    Assuming no noise, the solution is unique if \( N = M \).


    Figure 8.4 shows polynomial regression for \( y = \sin(x) \) for various degrees
    of polynomials and number of measurements which are equally spaced in \( [0, 2\pi]
    \). In Figure 8.4a the regression solution is a horizontal line through zero.
    This is because the locations of measurements are ill chosen. For \( N = 1 \)
    the measurement point is at \( \pi \), the middle of the interval where \( \sin(\pi)
    = 0 \) while for \( N = 2 \) the measurement points are at the ends of the interval
    and again \( \sin(0) = \sin(2\pi) = 0 \). For \( N = 3 \), the end points and
    the middle of the interval are used. With more measurement points and thus higher
    degrees of polynomials the reconstruction improves. It seems that a fifth degree
    polynomial describes the sine adequately, even though this is an infinite sum
    of odd'
