    Figure 2.9: The Poisson probability mass function and its cumulative distribution
    function for \(\lambda = 1\) (top row), \(\lambda = 5\) (middle row), and \(\lambda
    = 10\) (bottom row).


    The Poisson distribution \(m \sim \text{Po}(\lambda)\) gives the probability of
    \(m\) events occurring in the given time interval. The probability mass function
    is


    \(\text{Po}(m|\lambda) = \frac{\lambda^m \exp(-\lambda)}{m!}.\) (2.8)


    Both its expectation and variance are equal to \(\lambda\),


    \(\text{E}[m] = \text{var}[m] = \lambda.\)


    Of course, we are not just interested in experiments where the outcome is binary,
    but where the outcome can be any of \(K\) possible, mutually distinct outcomes.
    For example, the roll of a die would be one such experiment. The outcomes could
    be denoted \(\langle 1, 2, 3, 4, 5, 6 \rangle\) or \(\langle \blacksquare, \blacksquare,
    \blacksquare, \blacksquare, \blacksquare, \blacksquare \rangle\). However, it
    is convention to standardize the representation by using a 1-of-\(K\) representation.
    That is the random variable \(\mathbf{x}\) describing the outcome as a \(K\)-dimensional
    vector, where exactly one element \(x_k\) equals one and all the others are zero.
    For example, if in the die experiment \(x_4 = 1\), then \(\mathbf{x} = (0, 0,
    0, 1, 0, 0)^T\) and it means that a four was rolled. The transpose \(^T\) is used,
    since all vector variables are column vectors throughout, but it is easier to
    write row vectors. Any experiments of a categorical nature can be described in
    this way.


    The probability to get the \(k^{\text{th}}\) possible result, which means \(x_k
    = 1\), is denoted by \(\mu_k\). All probabilities are summarized in the vector
    \(\boldsymbol{\mu} = (\mu_1, \dots, \mu_K)^T\).'
