- pgno: 160
  md: '+   • Gaussian


    \( h(x) = \exp\left( -\frac{(x-c)^2}{2a^2} \right) \)


    ![](img/d3c00252180686426c9e63ab889b535b_160_0.png)


    +   • Multiquadrics


    \( h(x) = \sqrt{(x-c)^2 + a^2} \)


    ![](img/d3c00252180686426c9e63ab889b535b_160_1.png)


    +   • Inverse multiquadrics


    \( h(x) = \frac{1}{\sqrt{(x-c)^2 + a^2}} \)


    ![](img/d3c00252180686426c9e63ab889b535b_160_2.png)


    The parameters \(a\) and \(c\) have to be tuned for the task at hand.


    If the sgn activation function in the perceptron is replaced by the logistic sigmoid
    function, then the output is interpreted as the probability of the sample belonging
    to the positive class \(C_1\). The probability of belonging to the negative class
    \(C_0\) is one minus the output. This is then known as _logistic regression_.
    While it is solving a classification task, regression is part of the name, since
    it is trying to model the probability function of belonging to the positive class
    over the feature space.


    An activation function particularly important for classifying multiple classes
    is the _softmax_ function, also known as _normalized exponential_ function. It
    is different from the other activation functions in that it takes into account
    the result of the propagation functions of other neurons. Let \(a_j\) be the result
    of the propagation function in the \(j^{th}\) neuron: \(a_j = \tilde{\mathbf{w}}_j^T
    \mathbf{v}\). If the number of neurons is \(K\), then the softmax function maps
    the \(K\)-dimensional vector \(\mathbf{a} = (a_1, \dots, a_K)^T\) to a \(K\)-dimensional
    vector \(\sigma(\mathbf{a})\) with the \(j^{th}\) entry of \(\sigma(\mathbf{a})\)
    being


    \( \sigma(\mathbf{a})_j = \frac{\exp(a_j)}{\sum_{k=1}^K \exp(a_k)}. \) (5.6)'
