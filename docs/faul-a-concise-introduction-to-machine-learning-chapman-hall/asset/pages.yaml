    We already encountered the univariate normal distribution in Equation (2.4) and
    its probability density function and cumulative distribution function are depicted
    in Figures 2.2 and 2.4 respectively. Its multivariate counterpart has the probability
    density function


    ```

    f(\mathbf{x}) = \frac{1}{\sqrt{(2\pi)^\Sigma}} \exp \left( -\frac{1}{2} (\mathbf{x}
    - \mu)^T \Sigma^{-1} (\mathbf{x} - \mu) \right),

    ```


    where \(|\cdot|\) denotes the determinant and \(^{-1}\) is the inverse of the
    matrix \(\Sigma\). The mean of the multivariate normal distribution is \(\mu\),
    while its variance is \(\Sigma\).


    A random variable \(x\), whose logarithm is normally distributed, that is \(y
    = \log x\) has a normal distribution, has a log-normal distribution, also known
    as the Galton distribution. Likewise, since \(x = \exp y\), the exponential of
    a normally distributed variable is log-normally distributed. Since the exponential
    is always positive, \(x\) will only take positive values.


    Many growth processes are described by percentual changes. For example the annual
    growth rate of the global human population varies around 1.1%. Let \(z_1\) be
    the actual growth rate in year 1, \(z_2\) in year 2, and so on. If \(a\) is the
    population size at the beginning, then after \(N\) years, the population will
    have size


    ```

    x = a \prod_{n=1}^N z_n.

    ```'
