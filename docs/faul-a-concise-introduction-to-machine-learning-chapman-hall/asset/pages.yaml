  md: '# Appendix A: Matrix Formulae


    # A.1 Determinants and Inverses


    # A.1.1 Block Matrix Inversion


    For an \( m \times m \) invertible, square matrix \( \mathbf{A} \), an \( n \times
    n \) invertible square matrix \( \mathbf{D} \), an \( m \times n \) matrix \(
    \mathbf{B} \) and an \( n \times m \) matrix \( \mathbf{C} \), we have


    \(\begin{pmatrix} \mathbf{A} & \mathbf{B} \\ \mathbf{C} & \mathbf{D} \end{pmatrix}^{-1}
    = \begin{pmatrix} \mathbf{A}^{-1} + \mathbf{A}^{-1}\mathbf{B}\mathbf{E}^{-1}\mathbf{C}\mathbf{A}^{-1}
    & -\mathbf{A}^{-1}\mathbf{B}\mathbf{E}^{-1} \\ -\mathbf{E}^{-1}\mathbf{C}\mathbf{A}^{-1}
    & \mathbf{E}^{-1} \end{pmatrix} = \begin{pmatrix} \mathbf{F}^{-1} & -\mathbf{F}^{-1}\mathbf{B}\mathbf{D}^{-1}
    \\ -\mathbf{D}^{-1}\mathbf{C}\mathbf{F}^{-1} & \mathbf{D}^{-1} + \mathbf{D}^{-1}\mathbf{C}\mathbf{F}^{-1}\mathbf{B}\mathbf{D}^{-1}
    \end{pmatrix},\)


    where \( \mathbf{E} = \mathbf{D} - \mathbf{C}\mathbf{A}^{-1}\mathbf{B} \) and
    \( \mathbf{F} = \mathbf{A} - \mathbf{B}\mathbf{D}^{-1}\mathbf{C} \) need to be
    non-singular.


    # A.1.2 Block Matrix Determinant


    For matrices as above,


    \(\left| \begin{array}{cc} \mathbf{A} & \mathbf{B} \\ \mathbf{C} & \mathbf{D}
    \end{array} \right| = |\mathbf{A}||\mathbf{D} - \mathbf{C}\mathbf{A}^{-1}\mathbf{B}|
    = |\mathbf{A} - \mathbf{B}\mathbf{D}^{-1}\mathbf{C}||\mathbf{D}|.\)


    # A.1.3 Woodbury Identity


    For an \( m \times m \) invertible, square matrix \( \mathbf{A} \), an \( n \times
    n \) invertible square matrix \( \mathbf{C} \), an \( m \times n \) matrix \(
    \mathbf{B} \) and an \( n \times m \) matrix \( \mathbf{D} \), we have


    \((\mathbf{A} + \mathbf{B}\mathbf{C}\mathbf{D})^{-1} = \mathbf{A}^{-1} - \mathbf{A}^{-1}\mathbf{B}(\mathbf{C}^{-1}
    - \mathbf{D}\mathbf{A}^{-1}\mathbf{B})^{-1}\mathbf{D}\mathbf{A}^{-1}.\)


    # A.1.4 Sherman-Morrison Formula


    In particular, if \( n = 1 \) in the above Woodbury identity, then \( C = c \)
    is a scalar and \( \mathbf{B} = \mathbf{b} \) and \( \mathbf{D} = \mathbf{d}^T
    \) are vectors. The identity becomes


    \((\mathbf{A} + c\mathbf{b}\mathbf{d}^T)^{-1} = \mathbf{A}^{-1} - \frac{1}{1/c
    - \mathbf{d}^T\mathbf{A}^{-1}\mathbf{b}}\mathbf{A}^{-1}\mathbf{b}\mathbf{d}^T\mathbf{A}^{-1},\)'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'known as the Sherman-Morrison formula. For this to be valid, we need $1/c -
    \mathbf{d}^T \mathbf{A}^{-1} \mathbf{b} \neq 0$.


    # A.1.5 Matrix Determinant Lemma


    For matrices as in the above Woodbury identity, the determinant can be calculated
    as


    $|\mathbf{A} + \mathbf{BCD}| = |\mathbf{C}^{-1} - \mathbf{D}\mathbf{A}^{-1}\mathbf{B}||\mathbf{C}||\mathbf{A}|$.


    # A.2 Derivatives


    # A.2.1 Derivative of Squared Norm


    Let $\mathbf{x}$ be a general vector; then the derivative of the squared Euclidean
    norm is


    $\frac{\partial}{\partial \mathbf{x}} \|\mathbf{x}\|_2^2 = \frac{\partial}{\partial
    \mathbf{x}} \mathbf{x}^T \mathbf{x} = 2\mathbf{x}$.


    # A.2.2 Derivative of Inner Product


    Let $\mathbf{x}$ be a general vector and $\mathbf{a}$ a constant vector of the
    same length; then the derivative of the inner product between them is


    $\frac{\partial}{\partial \mathbf{x}} \mathbf{x}^T \mathbf{a} = \frac{\partial}{\partial
    \mathbf{a}} \mathbf{x}^T \mathbf{a} = \mathbf{a}$.


    # A.2.3 Derivative of Second Order Vector Product


    Let $\mathbf{x}$ be a general vector of length $m$ and $\mathbf{b}$ and $\mathbf{e}$
    constant vectors of length $n$. Further let $\mathbf{A}$ and $\mathbf{D}$ be constant
    of $m \times m$ matrices and $\mathbf{C}$ a constant $n \times n$ matrix; then


    $\frac{\partial}{\partial \mathbf{x}} (\mathbf{Ax} + \mathbf{b})^T \mathbf{C}
    (\mathbf{Dx} + \mathbf{e}) = \mathbf{A}^T \mathbf{C} (\mathbf{Dx} + \mathbf{e})
    + \mathbf{D}^T \mathbf{C}^T (\mathbf{Ax} + \mathbf{b})$.


    # A.2.4 Derivative of Determinant


    Let $\mathbf{X}$ be a square matrix and let $|\cdot|$ denote the determinant.
    Then


    $\frac{\partial}{\partial \mathbf{X}} |\mathbf{X}| = |\mathbf{X}| (\mathbf{X}^{-1})^T$.


    Let $\mathbf{X}$ depend on a variable $x$, then


    $\frac{\partial}{\partial x} |\mathbf{X}| = |\mathbf{X}| \text{tr} \left( \mathbf{X}^{-1}
    \frac{\partial \mathbf{X}}{\partial x} \right)$.


    where $\text{tr}(\cdot)$ denotes the trace.'
