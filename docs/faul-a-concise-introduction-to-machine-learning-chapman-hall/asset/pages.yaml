    \ (5.4)\n+   \n+   ![Graph of linear function]\n\n+   • Logistic sigmoid\n+  \
    \ \n+   $$h(x) = \\frac{1}{1 + \\exp(-a(x - c))}$$ (5.5)\n+   \n+   ![Graph of\
    \ logistic sigmoid]\n\n+   • Hyperbolic tangent\n+   \n+   $$h(x) = \\tanh(x)$$\n\
    +   \n+   ![Graph of hyperbolic tangent]"
