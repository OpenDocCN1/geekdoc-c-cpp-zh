  md: 'Letting $y = x - \mu$ with $dy = dx$, the range of integration with this change
    of variable remains the same,


    $$

    \mathbb{E}[x] = \int_{-\infty}^{\infty} \frac{y + \mu}{\sqrt{2\pi}\sigma} \exp\left(-\frac{y^2}{2\sigma^2}\right)
    dy

    $$$$

    = \int_{-\infty}^{\infty} \frac{y}{\sqrt{2\pi}\sigma} \exp\left(-\frac{y^2}{2\sigma^2}\right)
    dy + \mu \int_{-\infty}^{\infty} \frac{1}{\sqrt{2\pi}\sigma} \exp\left(-\frac{y^2}{2\sigma^2}\right)
    dy.

    $$


    The integrand of the first integral is an odd function, that is $f(-y) = -f(y)$.
    Integrals of odd functions over an interval symmetric about the origin evaluate
    to zero. As we have seen above, the second integral evaluates to one. Hence for
    the normal distribution $\mathbb{E}[x] = \mu$.


    For the variance we calculate


    $$

    \text{var}[x] = \int_{-\infty}^{\infty} \frac{(x - \mu)^2}{\sqrt{2\pi}\sigma}
    \exp\left(-\frac{(x - \mu)^2}{2\sigma^2}\right) dx.

    $$


    Again letting $y = x - \mu$ as before, we have


    $$

    \text{var}[x] = \int_{-\infty}^{\infty} \frac{y^2}{\sqrt{2\pi}\sigma} \exp\left(-\frac{y^2}{2\sigma^2}\right)
    dy.

    $$


    This integral can be calculated by *integration by parts* which can be thought
    of as the inverse of the product rule of differentiation which is


    $$

    \frac{d(uv)}{dy} = \frac{du}{dy}v + u\frac{dv}{dy}.

    $$


    *Integration by parts* is then


    $$

    \int_a^b u dv = [uv]_a^b - \int_a^b v du.

    $$


    Let $u = y$ and $dv = y \exp\left(-\frac{y^2}{2\sigma^2}\right) dy$, then $du
    = dy$ and $v = -\sigma^2 \exp\left(-\frac{y^2}{2\sigma^2}\right)$. With this we
    get


    $$

    \text{var}[x] = \left[ \frac{-\sigma^2 y}{\sqrt{2\pi}\sigma} \exp\left(-\frac{y^2}{2\sigma^2}\right)
    \right]_{-\infty}^{\infty} - \int_{-\infty}^{\infty} \frac{-\sigma^2}{\sqrt{2\pi}\sigma}
    \exp\left(-\frac{y^2}{2\sigma^2}\right) dy.

    $$


    The first expression is dominated by the exponential as the argument tends to
    $\pm\infty$ and thus is zero. The integrand is $-\sigma^2$ times the probability
    density function of a normal distribution with mean 0 and variance $\sigma^2$.
    The integral of a probability density function from $-\infty$ to $\infty$ is one.
    Thus for the normal distribution $\text{var}[x] = \sigma^2$.


    As for the third central moment, this is zero for the normal distribution, since
    the integrand again becomes an odd function. This means the skewness is also zero.'
