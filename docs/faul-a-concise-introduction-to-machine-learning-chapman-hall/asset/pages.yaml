    If the positive part of exponential probability density function is mirrored across
    the vertical axis at zero and shifted and scaled such that it integrates to one,
    it becomes the Laplace probability density function as seen in Figure 2.18. The
    probability density function of the Laplace distribution \(x \sim \text{Laplace}(\mu,
    b)\) is given by


    ```

    Laplace(x|\mu, b) = \frac{1}{2b} \exp \left( - \frac{|x - \mu|}{b} \right),

    ```


    where \(\mu\) is known as the location parameter and \(b\) is a scale parameter
    called the *diversity*.


    Its expectation is \(\mathbb{E}[x] = \mu\) and the variance is \(\text{var}[x]
    = 2b^2\). Examples of the cumulative distribution function are shown in Figure
    2.19. They can be compared to Figures 2.2 and 2.4 illustrating the normal distribution,
    since the mean is the same and \(b\) is chosen such that the variance is the same
    as well.


    Next, we consider a probability density known as the *beta distribution*, \(x
    \sim \text{Beta}(\alpha, \beta)\). It is defined on the interval (0, 1) and its
    probability density function is


    ```

    Beta(x|\alpha, \beta) = \frac{\Gamma(\alpha + \beta)}{\Gamma(\alpha)\Gamma(\beta)}
    x^{\alpha-1} (1-x)^{\beta-1},

    ```


    where \(\alpha\) and \(\beta\) are real numbers and positive. The function \(\Gamma(z)\)
    is known as the *gamma function* and defined as


    ```

    \Gamma(z) = \int_0^\infty x^{z-1} \exp(-x) dx.

    ```'
