    If the variance var[x] and expectation E[x] of the log-normal distribution are
    known, the mean and variance of the associated normal distribution can be calculated
    as


    ```

    \(\mu = \log \left( \frac{\mathbb{E}[x]^2}{\sqrt{\text{var}[x] + \mathbb{E}[x]^2}}
    \right)\)

    \(\sigma^2 = \log \left( 1 + \frac{\text{var}[x]}{\mathbb{E}[x]^2} \right).\)
    (2.13)

    ```


    We already gave one word of caution, when using the log-normal distribution. In
    general, assuming an underlying distribution, is a very strong assumption, which
    needs to be well justified and communicated, in case new data makes this assumption
    invalid. Figure 2.15 shows the log-normal density function for expectation E[x]
    = 100 and variance var[x] = 1 on the left and the normal density function with
    the same expectation and variance on the right. They are essentially indistinguishable.


    The log-normal probability density has its only maximum at exp(\(\mu - \sigma^2\)).
    This is also known as its mode. Both the log-normal and normal distribution are
    *unimodal*, since they only have one maximum. If a probability density function
    has several local maxima, which can take different values, it is called *multimodal*.
    For the normal distribution the mode coincides with the mean. The log-normal probability
    density function is looking more and more like the normal one, the closer the
    mode gets to the expectation, that is the mean. Using Equations (2.13), the mode
    can be calculated as


    ```

    \(\exp(\mu - \sigma^2) = \exp \left[ \log \left( \frac{\mathbb{E}[x]}{\sqrt{1
    + \frac{\text{var}[x]}{\mathbb{E}[x]^2}}} \right) - \log \left( 1 + \frac{\text{var}[x]}{\mathbb{E}[x]^2}
    \right) \right]\)

    \(= \left( 1 + \frac{\text{var}[x]}{\mathbb{E}[x]^2} \right)^{-3/2} \mathbb{E}[x].\)

    ```'
