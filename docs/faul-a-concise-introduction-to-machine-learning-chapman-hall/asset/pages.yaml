- pgno: 106
  md: 'We can now check whether $f$ satisfies detailed balance. To this end,


    \(\begin{aligned} f(\mathbf{x})T(\mathbf{x}, \hat{\mathbf{x}}) &= \frac{\hat{f}(\mathbf{x})}{c_f}
    g(\mathbf{x}, \hat{\mathbf{x}}) \min \left( 1, \frac{\hat{f}(\hat{\mathbf{x}})g(\hat{\mathbf{x}},
    \mathbf{x})}{\hat{f}(\mathbf{x})g(\mathbf{x}, \hat{\mathbf{x}})} \right) \\ &=
    \frac{1}{c_f} \min \left( \hat{f}(\mathbf{x})g(\mathbf{x}, \hat{\mathbf{x}}),
    \hat{f}(\hat{\mathbf{x}})g(\hat{\mathbf{x}}, \mathbf{x}) \right) \\ &= \frac{1}{c_f}
    \min \left( \hat{f}(\hat{\mathbf{x}})g(\hat{\mathbf{x}}, \mathbf{x}), \hat{f}(\mathbf{x})g(\mathbf{x},
    \hat{\mathbf{x}}) \right) \\ &= \frac{\hat{f}(\hat{\mathbf{x}})}{c_f} g(\mathbf{x},
    \hat{\mathbf{x}}) \min \left( 1, \frac{\hat{f}(\mathbf{x})g(\mathbf{x}, \hat{\mathbf{x}})}{\hat{f}(\hat{\mathbf{x}})g(\hat{\mathbf{x}},
    \mathbf{x})} \right) = f(\hat{\mathbf{x}})T(\hat{\mathbf{x}}, \mathbf{x}). \end{aligned}\)


    Thus detailed balance is satisfied as is required to generate approximate samples
    of the distribution described by $f$.


    The Metropolis-Hastings algorithm is an example of a class of algorithms known
    as Markov Chain Monte Carlo (MCMC). In general, Monte-Carlo methods refer to algorithms,
    which rely on repeated random sampling to perform calculations, where a closed
    solution is not possible or prohibitively expensive. They were first developed
    at the Los Alamos National Laboratory. Since the work was secret, Monte Carlo,
    referring to the Casino de Monte Carlo in Monaco, was used as code name.


    Gibbs sampling is used, when it is easier to sample from the conditional distribution
    of x than from the distribution of x itself. Let $\mathbf{x}_n = (x_{n,1}, ...,
    x_{n,D})^T$, where d is the dimension of the state space. The next element $\mathbf{x}_{n+1}$
    is then constructed in D steps by drawing $x_{n+1,1}$ sequentially from the conditional
    probability $p(x|x_{n+1,1}, ..., x_{n+1,d-1}, x_{n,d+1}, ..., x_{n,D})$ for $d
    = 1, ..., D$. This means a component is used in the next draw as soon as it has
    been drawn. Another version chooses which component to update next randomly.


    The distribution described by the probability density function f of x is invariant
    of each of the sampling steps for the following reasons. Firstly, the marginal
    distribution of $\mathbf{x}_{-d} = (x_1, ..., x_{d-1}, x_{d+1}, ..., x_D)$ is
    invariant, since none of these components changes in the dth step. Secondly, the
    dth component is sampled from the correct conditional distribution, and is therefore
    invariant. Because the joint distribution (which is the distribution of x) is
    determined by these marginal and conditional distributions, it is also invariant.
    The ergodic theorem can be applied, if in addition none of the conditional probabilities
    is zero anywhere in the state space. Thus the generated Markov chain will produce
    samples from the desired distribution.


    Gibbs sampling can be phrased in terms of the Metropolis-Hastings algorithm. Let
    the current sample be x. Note, this could be an element of the Markov chain or
    one of the intermediate steps. The candidate x* differs from the previous sample
    x in only one component. Let this be the dth component. Hence $\mathbf{x}_{-d}
    = \mathbf{x}_{-d}$. The dth component of x* is drawn from $p(x|\mathbf{x}_{-d})$.
    This defines the proposal distribution


    \(g(\mathbf{x}, \mathbf{x}^*) = p(x_d^*|\mathbf{x}_{-d}).\)'
