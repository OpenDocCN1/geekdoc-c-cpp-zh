    # ## 5.3 k Nearest Neighbours


    In the previous chapter, we considered classifying samples according to their
    relationship to samples in the training set. This relation was quantified using
    kernels. A simple idea is to classify a new sample according to the majority of
    classes to which its neighbours in the training set belong. Here neighbour is
    defined as the samples closest with regards to the Euclidean norm, also known
    as the L2 norm. The number of neighbours considered is denoted by k. The classifier
    depends on the choice of k. If a small number of neighbours is chosen, then the
    boundaries between the classes are more irregular, while they are smoother, if
    k is chosen larger. The technique is known as k Nearest Neighbours (k-NN). Listing
    5.3 creates a k Nearest Neighbour classifier and uses it to classify the entire
    region. Adjusting the parameter specifying the number of neighbours shows the
    different outcomes. Three new sample points are also generated, their k nearest
    neighbours marked and ellipses drawn around the nearest neighbours. Figure 5.8
    shows the results.


    # ## 5.4 Decision Trees


    Another intuitive way to classify are decision trees. These are binary trees consisting
    of nodes and leaves, also known as terminal nodes. Each non-terminal node has
    two branches. A sample enters the tree at the root node at the top. At each node,
    a decision is made based on the value of a single feature. If'
