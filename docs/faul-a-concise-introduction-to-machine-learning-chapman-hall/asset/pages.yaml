  md: '+   - For binary classification, \(K=1\) and \(t_n\) takes either the value
    0 or 1 depending on whether the sample with features \(\mathbf{x}_n\) belongs
    to the negative or positive class respectively. There is only one output neuron
    and the activation function of the final layer is the *logistic sigmoid* function
    \(h_L(x) = (1 + \exp(-x))^{-1}\). The output is interpreted as the probability
    of the input with features \(x_1, \dots, x_D\) belonging to the positive class.


    +   - If there are \(K\) separate, binary classification tasks for the same data,
    then \(\mathbf{t}_n\) is a vector of zeros and ones. The \(k\)th component indicates
    the class membership of the \(k\)th classification task. There are \(K\) output
    neurons. Each output neuron can be likened to a binary classifier using the logistic
    sigmoid function.


    +   - For multiple classes, \(\mathbf{t}_n\) is a 1-of-\(K\) representation. This
    means only one of the \(K\) components of \(\mathbf{t}_n\) is one and all others
    are zero. A one in the \(k\)th position indicates the sample with features \(\mathbf{x}_n\)
    belongs to the \(k\)th class. The output activation function is the *softmax*
    function. It maps the \(K\)-dimensional vector of activations \(\mathbf{a} = (a_1,
    \dots, a_K)^T\) to a \(K\)-dimensional vector \(\sigma(\mathbf{a})\) with the
    \(j\)th entry of \(\sigma(\mathbf{a})\) being


    \(\sigma(\mathbf{a})_j = \frac{\exp(a_j)}{\sum_{k=1}^K \exp(a_k)}.\)


    The \(k\)th output is interpreted as the probability of the sample with features
    \(\mathbf{x} = (x_1, \dots, x_D)^T\) belonging to the \(k\)th class.


    If the activation function in all neurons is the logistic sigmoid, then the neural
    network is commonly known as a *multilayer perceptron*. However, this is a misnomer,
    since the perceptron uses the discontinuous step function sgn illustrated in Figure
    4.7 as the activation function. In the section on backpropagation, we will see
    the advantages continuity brings. Therefore the logistic sigmoid function is a
    better choice. To add to the confusion, the term multilayer perceptron is now
    being used, when arbitrary activation functions are employed, and for both classification
    or regression tasks. Because of this dilution of the definition, the form of the
    neural network cannot be deduced, if the term multilayer perceptron is used.


    The neural network is a function mapping the input \(\mathbf{x} = (x_1, \dots,
    x_D)^T\) to the output \(\mathbf{y} = (y_1, \dots, y_K)^T\). The input passing
    through the network is known as forward propagation. Cycles, where information
    could be passed backwards, are not allowed. The architecture is strictly *feed-forward*.


    As the latent variables can be relabelled, which means that neurons are interchanged
    with each other, there are \(\prod_{l=1}^L M_l!\) equivalent neural networks,
    which give the same mapping from input to output. Another equivalence arises from
    the activation functions of the hidden neurons being even functions, i.e. \(h(-x)
    = h(x)\), or odd functions, i.e. \(h(-x) = -h(x)\). If the signs of the weights
    of all synapses going into a particular hidden neuron are flipped, then, if the'
