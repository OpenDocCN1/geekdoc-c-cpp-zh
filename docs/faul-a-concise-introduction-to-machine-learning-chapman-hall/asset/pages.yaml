    \ data generation is likened to a hypothetical Chinese restaurant with an infinite\
    \ availability of tables and each table can seat as many diners as necessary.\
    \ The first customer comes, sits at the first table and orders a variety of food.\
    \ This determines the distribution. They eat what they fancy which corresponds\
    \ to a specific data sample. The second customer might choose to sit at the same\
    \ table. They will eat from the same selection of food, but not exactly the same\
    \ as the first customer. They sample a second distinct set of food. On the other\
    \ hand, they might choose to sit at a new table and order a different set of dishes\
    \ which constitutes the distribution of the second process. As new customers arrive,\
    \ they either sit at an already open table or open a new one.\n\nSince the final\
    \ number of customers N is finite, so is the number of tables K. Once the final\
    \ configuration is reached it is unique up to the relabeling of tables. This means\
    \ there are K! equivalent ways this configuration could have been reached. This\
    \ in turn means that the order in which the customers arrive is of no importance.\
    \ If in a different ordering the first customer sits at a different table which\
