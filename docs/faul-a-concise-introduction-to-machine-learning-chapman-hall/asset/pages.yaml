    is O(K^2) = O(KD), since K <= D. These need to be calculated for n = 1, ..., N,
    and the complexity for the E-step is O(KDN). However, it can be done in parallel
    for each data point, since E[u_n] and E[u_n u_n^T] can be calculated independently
    of each other.


    While the Expectation-Maximization algorithm is an iterative procedure, the number
    of operations per iteration is significantly less if K << D. This can offset the
    extra time due to the iterations against the direct maximization of the log likelihood
    which has complexity O(ND^2).


    So far in this section, K was chosen and not determined by the data. For a Bayesian
    treatment of Principal Component Analysis which determines K see [30].


    # 7.4 Factor Analysis


    So far the noise was modeled by \sigma^2 I implying that all directions are treated
    equally. A more suitable model would be to let the noise variance be a diagonal
    matrix D such that each direction can be treated separately. The diagonal elements
    of D are known as uniquenesses, while the columns of W are known as factor loadings.


    Following a similar calculation as in the previous section, the joint distribution
    p(v, u) is given by


    ```

    (2\pi)^{-(K+D)/2} |\mathbf{D}|^{-1/2} \exp \left( -\frac{1}{2} \begin{pmatrix}
    \mathbf{v} - \boldsymbol{\mu} \\ \mathbf{u} \end{pmatrix}^T \begin{pmatrix} \mathbf{D}^{-1}
    & -\mathbf{D}^{-1}\mathbf{W} \\ -\mathbf{W}^T\mathbf{D}^{-1} & \mathbf{W}^T\mathbf{D}^{-1}\mathbf{W}
    + \mathbf{I} \end{pmatrix} \begin{pmatrix} \mathbf{v} - \boldsymbol{\mu} \\ \mathbf{u}
    \end{pmatrix} \right).

    ```


    As before, the mean of the joint normal distribution is ( \boldsymbol{\mu} 0 )^T,
    where \boldsymbol{\mu} is the sample mean. The inversion formula for block matrices
    gives the joint covariance matrix as


    ```

    \begin{pmatrix} \mathbf{D} + \mathbf{W}^T\mathbf{W} & \mathbf{W} \\ \mathbf{W}^T
    & \mathbf{I} \end{pmatrix}.

    ```


    The formula in Appendix A.1.2 for calculating the determinant of block matrices
    shows that the determinant of the joint covariance matrix is |D|.'
