  md: '![](img/d3c00252180686426c9e63ab889b535b_46_0.png)


    Figure 2.10: The categorical probability mass function and its cumulative distribution
    function for \(\boldsymbol{\mu} = (1/3, 1/2, 1/6)^T\).


    The probabilities of all outcomes must sum to one,


    \(\sum_{k=1}^K \mu_k = 1.\)


    This defines the *categorical distribution* denoted \(\mathbf{x} \sim \text{Cat}(\boldsymbol{\mu})\)
    with probability density function


    \(\text{Cat}(\mathbf{x}|\boldsymbol{\mu}) = p(x_k = 1|\boldsymbol{\mu}) = \prod_{k=1}^K
    \mu_k^{x_k}.\) (2.9)


    Note that in the product all factors are 1 apart from one, since in \(\mathbf{x}\)
    all entries are 0 apart from one, which is 1. The categorical distribution can
    be viewed as a generalization of the Bernoulli distribution. The uniform distribution
    is a special case of it, as \(\mu_1 = \cdots = \mu_K = 1/K\).


    Figure 2.10 illustrates the probability mass function of a categorical distribution
    where \(\boldsymbol{\mu} = (1/3, 1/2, 1/6)^T\). The cumulative distribution function
    is an irregular stair function. Both are drawn with regards to the indices in
    \(\mathbf{x}\). If the possible outcomes are ordered differently in \(\mathbf{x}\),
    the graphs will be different.


    The expectation of the categorical distribution is calculated as


    \(\mathbb{E}[\mathbf{x}] = \sum_{\mathbf{x}} \text{Cat}(\mathbf{x}|\boldsymbol{\mu})\mathbf{x}
    = \boldsymbol{\mu},\)


    where the sum is over all possible values \(\mathbf{x}\) can take. Note that here
    we have made the step into a *multivariate distribution*, since \(\mathbf{x}\)
    is a vector, though one where all elements are zero apart from one, which is one.


    Recall that the variance of a *univariate distribution* of the random variable
    \(x\) is given by \(\text{var}[x] = \mathbb{E}[(x - \mathbb{E}[x])^2] = \mathbb{E}[x^2]
    - \mathbb{E}[x]^2\). The multivariate equivalent is


    \(\text{var}[\mathbf{x}] = \mathbb{E}[(\mathbf{x} - \mathbb{E}[\mathbf{x}])(\mathbf{x}
    - \mathbb{E}[\mathbf{x}])^T] = \mathbb{E}[\mathbf{x}\mathbf{x}^T] - \mathbb{E}[\mathbf{x}]\mathbb{E}[\mathbf{x}]^T.\)
    (2.10)'
