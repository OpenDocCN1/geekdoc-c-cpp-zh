- pgno: 29
  md: 'We see that


    ```

    $$m_i = \sum_{j=1}^L n_{ij} \text{ and } l_j = \sum_{i=1}^M n_{ij},$$ (2.2)

    ```


    since marginalizing over one random variable means summing over all possible outcomes
    of the other.


    We can now estimate the probabilities as fractions of the total number of experiments
    $N$:


    ```

    $$p(x_i) = \frac{m_i}{N}, p(y_j) = \frac{l_j}{N} \text{ and } p(x_i, y_j) = \frac{n_{ij}}{N}.$$

    ```


    Combining this with (2.2), we see that


    ```

    $$p(x_i) = \sum_{j=1}^L p(x_i, y_j)$$ (2.3)

    ```


    Equation (2.3) is known as the sum rule of probability. The random variable $Y$
    is marginalized.


    If we only consider experiments, where the outcome for $X$ is $x_i$, then the
    fraction of those, where the outcome for $Y$ is $y_j$, is written as $p(y_j|x_i)$
    and is called the *conditional probability* of $y_j$ given $x_i$. Looking at the
    $i^\text{th}$ row of the grid, it can be calculated as


    ```

    $$p(y_j|x_i) = \frac{n_{ij}}{m_i}.$$

    ```


    On the other hand, we have


    ```

    $$p(x_i, y_j) = \frac{n_{ij}}{N} = \frac{n_{ij}}{m_i} \frac{m_i}{N} = p(y_j|x_i)p(x_i).$$

    ```


    This is known as the product rule of probability. Written in terms of the random
    variables, the sum and product rule of probability are


    ```

    $$p(X) = \sum_Y p(X, Y) \text{ and } p(X, Y) = p(Y|X)p(X),$$

    ```


    where the sum is over all possible instances of $Y$.


    From the definition of independence in (2.1), we see that $Y$ is independent of
    $X$, if the conditional probability equals the marginal probability for all outcomes.
    That is, the outcome of $X$ does not influence the outcome of $Y$ at all.


    The joint probability of two random variables is symmetric. That is


    ```

    $$p(X, Y) = p(Y, X).$$

    ```'
