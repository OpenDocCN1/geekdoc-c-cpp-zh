- pgno: 234
  md: 'consisting of three coloured paper discs overlapping by different amounts.
    A smaller central disc contained a wedge of a colour sample. The brightness could
    be adjusted by the width of the wedge. When the top spun, the outer colours would
    mix and one could adjust how much each colour contributed until it matched the
    colour in the centre.


    ![](img/d3c00252180686426c9e63ab889b535b_234_0.png)


    Figure 8.2: Maxwell''s colour-mixing top.

    Photo courtesy of Professor John Mollon, Cambridge University.


    There is a biological explanation for this. The human eye has only three types
    of measuring devices to perceive colours – the cones. Figure 8.3 shows to which
    wavelengths different type of cones are sensitive. The blue peak is well separated
    from the red and green peaks. It is believed that the separation between red and
    green is evolutionarily fairly new and that the curves will move further apart
    with time. Colour blindness is in most cases due to one type of cone missing or
    malfunctioning. With three measurements, the human eye can distinguish ten million
    colours. This is an example of regression, and shows how powerful our brain is.
    From only three measurements our brain is able to infer millions of colours.


    These are not just spectral colours, but also non-spectral ones. Magenta is an
    extraordinary colour. It is a mixture of the primary colours red and blue which
    lie far apart in the colour spectrum. It occurs in nature when the green component
    of white light is absorbed, since it is the complementary colour to green. In
    fact, magenta did not exist as a dye until 1859/60, when it was invented by François-Emmanuel
    Verguin (Lyon), Chambers Nicolson and George Maule (London). It is an anilin dye,
    and was named after the battle of Magenta. It caused a fashion craze with those
    who could afford it, showing off in magenta clothes some of which can be seen
    in the Victoria and Albert Museum in London, England.


    Different animals and insects have different numbers of cone types. Refer to Table
    8.1 gives an overview.'
