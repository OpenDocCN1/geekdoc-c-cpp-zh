    # 4.3 Fisher''s and Linear Discriminant Analysis


    Recall, the sample mean of $C_i$ is


    $$

    \mu_i = \frac{1}{N_i} \sum_{v \in C_i} v.

    $$


    To take into account the variation of the samples, we define the *sample covariance*
    of $C_i$ as


    $$

    \Sigma_i = \frac{1}{N_i} \sum_{v \in C_i} (v - \mu_i)(v - \mu_i)^T.

    $$ (4.2)


    The last expression in the above is an *outer product*. In two dimensions it is
    defined between two vectors $\mathbf{v}_1$ and $\mathbf{v}_2$ as


    $$

    \mathbf{v}_1 \mathbf{v}_2^T = \begin{pmatrix} v_{11} \\ v_{12} \end{pmatrix} (v_{21}
    \ v_{22}) = \begin{pmatrix} v_{11}v_{21} & v_{11}v_{22} \\ v_{12}v_{21} & v_{12}v_{22}
    \end{pmatrix}

    $$


    It can be viewed as a matrix product. A $2 \times 1$ matrix times a $1 \times
    2$ matrix is a $2 \times 2$ matrix.


    If $M$ is the number of features (in our example $M = 2$), then $\mu_i$ is a vector
    with $M$ elements and the $j^{th}$ entry is the mean of the $j^{th}$ feature of
    samples in class $C_i$. On the other hand, $\Sigma_i$ is an $M \times M$ matrix.
    The $(j, j)$ diagonal entry is the variance of the $j^{th}$ feature of samples
    in class $C_i$. The variance describes how spread the values of a feature are.
    The $(j, k)$ off-diagonal entry'
