  md: 'The value of \(\mu\) can be estimated by maximizing the likelihood with respect
    to \(\mu\), since we want to choose the \(\mu\) which explains the data best.


    The maximization is equivalent to maximizing the logarithm, which is valid, since
    the logarithm is a monotonically increasing function. This is the log likelihood:


    \(\log p(\mathcal{D}|\mu) = m \log \mu + (N - m) \log(1 - \mu).\)


    The location of the maximum is where the derivative with respect to \(\mu\) vanishes.
    The derivative is


    \(\frac{d}{d\mu}p(\mathcal{D}|\mu) = \frac{m}{\mu} - \frac{N - m}{1 - \mu}.\)


    Setting to zero, multiplying through by \(\mu(1 - \mu)\) and solving for \(\mu\)
    gives the maximum likelihood estimator


    \(\mu_{\text{ML}} = \frac{m}{N}.\)


    Returning to flipping the coin, if we happen to get tails (\(x_n = 0\)) three
    times in a row in three flips, then the maximum likelihood estimator is \(\mu_{\text{ML}}
    = 0\). The interpretation is that in all future flips we would continue to see
    tails. Equally, if we happen to flip heads (\(x_n = 1\)) three times in a row,
    the maximum likelihood estimator is \(\mu_{\text{ML}} = 1\). Both cases are realistic,
    but the conclusion is not and caused by the small number of trials. In general,
    to get a good maximum likelihood estimator for any parameter, many observations
    are necessary.


    However, in real world applications such abundance of data might be a luxury.
    If we describe what we “believe” about \(\mu\), mathematically and then use Bayes’
    rule to modify our “belief”, less data is necessary to estimate the parameter
    \(\mu\). It is the probability of success, and therefore \(\mu \in [0, 1]\). Thus,
    the beta distribution \(\text{Beta}(\mu|\alpha, \beta)\) lends itself to describe
    \(\mu\), where \(\alpha\) and \(\beta\) are known as *hyperparameters* and set
    to some reasonable initial values. This is the *prior distribution*. In the following,
    we will see how these parameters get updated with data becoming available.


    The joint probability density function of \(\mu\) and \(m\) is the product of
    the likelihood and the prior


    f(\mu, m|N, \alpha, \beta) = p(\mathcal{D}|\mu)\text{Beta}(\mu|\alpha, \beta)

    = \mu^m(1-\mu)^{N-m} \frac{\Gamma(\alpha+\beta)}{\Gamma(\alpha)\Gamma(\beta)}
    \mu^{\alpha-1}(1-\mu)^{\beta-1}. (2.21)


    The posterior density function of \(\mu\), \(f(\mu|m, N, \alpha, \beta)\), is
    proportional to the joint distribution following Bayes. The constant factors can
    be dropped when using the proportionality \(\propto\), and hence


    \(f(\mu|m, N, \alpha, \beta) \propto \mu^{m+\alpha-1}(1-\mu)^{N-m+\beta-1}.\)'
