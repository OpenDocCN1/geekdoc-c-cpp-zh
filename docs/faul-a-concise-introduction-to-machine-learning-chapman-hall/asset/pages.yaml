- pgno: 170
  md: 'For example, a popular exercise for children to apply their observation and
    sorting skills is to let them sort sweets. It is immediately obvious that there
    are numerous distinguishing features. Firstly, there is the size, then the colour,
    or the sweet might be multicoloured. They come in all sorts of shapes. Next, we
    might consider the main ingredient which may be chocolate, jelly, liquorice or
    something completely different, or it might be a combination of different ingredients,
    or have a filling. The parents might be more interested in keeping the overall
    sugar intake low, while a dentist might be interested in whether the sweets stick
    to the teeth or not. Depending on their tastes and preferences, different people
    will put different emphasis on each feature.


    Clustering often is the first step when analysing a new data set. If not much
    is known yet about the data, it is useful to see whether the data separates naturally
    into different groups. The aim is to find clusters where data samples within one
    cluster are more similar to each other than to data samples in other clusters.
    We will see in the following what similar means for different algorithms.


    There are many application areas. For example, clustering is used to find news
    articles with similar contents or relating to the same topic. Similarly, search
    engines use clustering algorithms. The suggestions we receive on streaming sites
    depending on our past preferences are based on clusters as well. Image segmentation
    is another application area is lossy data compression, where it is sufficient
    to represent the data by the cluster it belongs to. It is also used in bioinformatics
    to analyze biological data of all sorts.


    # 6.1 K Means Clustering


    K means clustering decides at the outset on the numbers of clusters denoted by
    $K$ and each data sample is assigned to exactly one cluster. This is known as
    hard clustering. The aim is to find cluster centres $\mu_1, \dots, \mu_K$ such
    that the sum of the squared distances of each data sample to its nearest cluster
    centre (the one it is assigned to) is minimal. Nearest here is with respect to
    the Euclidean norm ($L_2$ norm). Thus the objective function is


    \( J = \sum_{n=1}^N \min_k \| \mathbf{v}_n - \mu_k \|^2. \)


    This optimization problem is NP hard. That is, there is no known algorithm to
    solve this in polynomial time. This is because as cluster centres move around,
    for each sample it changes which is the nearest cluster. The algorithm finds an
    approximate solution by separating this interdependency with the introduction
    of hidden (latent) variables $\mathbf{z}_n$, one for each data sample $\mathbf{v}_n$.
    The latent variables are binary variables, i.e. $\mathbf{z}_n \in \{0, 1\}^K$,
    where only one entry can be 1 and the others have to be 0. This is known as a
    1-of-K representation. A 1 in the \(k^{th}\) entry indicates that $\mu_k$ is the
    nearest cluster centre to $\mathbf{v}_n$. Let \(z_{n,k}\)'
