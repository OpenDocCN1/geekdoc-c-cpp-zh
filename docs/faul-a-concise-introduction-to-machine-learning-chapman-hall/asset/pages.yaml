  md: '+   3. E-step: Evaluate the responsibilities \(p(z_{n,k} = 1 | \mathbf{v}_n)\)
    for \(n = 1, \dots, N\) and \(k = 1, \dots, K\).


    +   4. M-step: Maximize


    ```

    \(\sum_{k=1}^K \sum_{n=1}^N p(z_{n,k} = 1 | \mathbf{v}_n) \log \left( p(z_{n,k}
    = 1) p(\mathbf{v}_n | z_{n,k} = 1) \right)\)

    ```


    with respect to the parameters of \(p_k(\mathbf{v}) = p(\mathbf{v} | z_{n,k} =
    1)\) and mixing coefficients \(\pi_k = p(z_k = 1)\).


    +   5. Terminate, if all changes are below the convergence threshold. Otherwise
    return to step 3


    This method is known as the Expectation-Maximization algorithm or EM algorithm
    for short. Each step increases the logarithm of the data likelihood. Listing 6.3
    uses the internal implementation of the EM algorithm in MATLAB within the call
    to fit a Gaussian Mixture. We revisit the Expectation-Maximization technique in
    the context of regression where we consider continuous latent variables. The EM
    algorithm is widely used and has many extensions. For an overview of those see
    [29].


    # 6.5 Bayesian Mixture Models


    The previous sections have treated the mixing coefficients \(\pi_k\) and the parameters
    of the probability distribution \(p_k\) of the \(k^{th}\) process for \(k = 1,
    \dots, K\) as constant unknown parameters, whose values need to be determined
    by maximizing the likelihood. We now take a Bayesian approach.


    The prior assumption is that the vector \(\pi = (\pi_1, \dots, \pi_K)\) follows
    a Dirichlet distribution with parameter \(\alpha = (\alpha/K, \dots, \alpha/K)^T\).
    For example, if \(\alpha = K\), then \(\alpha = (1, \dots, 1)^T\) and the probability
    distribution is the uniform distribution over the simplex in which \(\pi\) lies.
    So all possibilities for \(\pi\) are equally likely. As \(\alpha\) increases,
    the resulting Dirichlet probability density functions get more and more peaked
    at \(\pi = (1/K, \dots, 1/K)^T\) with any other vectors becoming less likely.
    The effect is illustrated in Figure 6.5. When \(\alpha = K\) in Figures 6.5a and
    6.5b, the cluster sizes can be very different. As \(\alpha\) increases (Figures
    6.5c and 6.5d), the clusters become similar in size. Their sizes approach \(N/K\).


    Similarly, the probability distributions \(p_k\) are drawn themselves from a probability
    distribution. It is a distribution over distributions, known as base distribution
    \(G_0\). For example, if each process is a normal distribution with its own mean
    \(\mu_k\) and covariance matrix \(\Sigma_k\), these can be drawn from the normal
    inverse Wishart distribution, which has four parameters:


    +   • the location vector \(\mathbf{m}\) lying in the feature space,


    +   • the mean fraction \(\lambda\),'
