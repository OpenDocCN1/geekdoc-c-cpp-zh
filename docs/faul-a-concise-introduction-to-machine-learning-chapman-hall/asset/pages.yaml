    distribution has to be


    \mathbf{\Sigma} = (\mathbf{A} + \sigma^{-2}\mathbf{D}^T\mathbf{D})^{-1}, \quad
    (8.6)


    which is symmetric and positive definite. We complete the square by introducing
    the mean \(\mu\):


    -\frac{1}{2} \left[ (\mathbf{c} - \mu)^T \mathbf{\Sigma}^{-1} (\mathbf{c} - \mu)
    + 2\mathbf{c}^T \mathbf{\Sigma}^{-1} \mu - \mu^T \mathbf{\Sigma}^{-1} \mu - 2\sigma^{-2}\mathbf{c}^T\mathbf{D}^T\mathbf{t}
    + \sigma^{-2}\mathbf{t}^T\mathbf{t} \right]


