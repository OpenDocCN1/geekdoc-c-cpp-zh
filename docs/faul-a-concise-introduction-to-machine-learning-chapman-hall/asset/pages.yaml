  md: 'The logarithm of the joint data likelihood is


    $$\mathcal{L} = \log \prod_{n=1}^N p(\mathbf{v}_n, \mathbf{u}_n) = -\frac{1}{2}
    \sum_{n=1}^N \left[ (K+D) \log(2\pi) + \log(|\mathbf{D}|) + \mathbf{u}_n^T \mathbf{u}_n
    + (\mathbf{v}_n - \boldsymbol{\mu})^T \mathbf{D}^{-1} (\mathbf{v}_n - \boldsymbol{\mu})
    - 2\mathbf{u}_n^T \mathbf{W}^T \mathbf{D}^{-1} (\mathbf{v}_n - \boldsymbol{\mu})
    + \mathbf{u}_n^T \mathbf{W}^T \mathbf{D}^{-1} \mathbf{W} \mathbf{u}_n \right].$$


    As before, we take the expectation with respect to the latent variables $\mathbf{u}_n$
    which results in


    $$\mathbb{E}[\mathcal{L}] = -\frac{1}{2} \sum_{n=1}^N \left[ (K+D) \log(2\pi)
    + \log(|\mathbf{D}|) + \text{tr}(\mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T]) + (\mathbf{v}_n
    - \boldsymbol{\mu})^T \mathbf{D}^{-1} (\mathbf{v}_n - \boldsymbol{\mu}) - 2\mathbb{E}[\mathbf{u}_n]^T
    \mathbf{W}^T \mathbf{D}^{-1} (\mathbf{v}_n - \boldsymbol{\mu}) + \text{tr}(\mathbf{W}
    \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T] \mathbf{W}^T \mathbf{D}^{-1}) \right],$$


    where the cyclic permutation property of the trace was used.


    Differentiating this with respect to $\mathbf{W}$ using Appendices A.2.6 and A.2.9,
    gives


    $$\frac{\partial}{\partial \mathbf{W}} \mathbb{E}[\mathcal{L}] = -\frac{1}{2}
    \sum_{n=1}^N \left[ -2 \mathbf{D}^{-1} (\mathbf{v}_n - \boldsymbol{\mu}) \mathbb{E}[\mathbf{u}_n]^T
    + 2 \mathbf{D}^{-1} \mathbf{W} \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T] \right].$$


    Setting this to zero, multiplying through with $\mathbf{D}$ from the left and
    solving for $\mathbf{W}$ results in the update formula


    $$\mathbf{W}_{\text{new}} = \left[ \sum_{n=1}^N (\mathbf{v}_n - \boldsymbol{\mu})
    \mathbb{E}[\mathbf{u}_n]^T \right] \left[ \sum_{n=1}^N \mathbb{E}[\mathbf{u}_n
    \mathbf{u}_n^T] \right]^{-1}, \quad (7.13)$$


    which is exactly the same as before.


    To differentiate with respect to $\mathbf{D}$, we first rewrite the expression
    for the expectation of the joint log likelihood using the cyclic permutation property
    of the trace,


    $$\mathbb{E}[\mathcal{L}] = -\frac{1}{2} \sum_{n=1}^N \left[ (K+D) \log(2\pi)
    + \log(|\mathbf{D}|) + \text{tr}(\mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T]) + \text{tr}
    \left( [(\mathbf{v}_n - \boldsymbol{\mu})(\mathbf{v}_n - \boldsymbol{\mu})^T -
    2(\mathbf{v}_n - \boldsymbol{\mu}) \mathbb{E}[\mathbf{u}_n]^T \mathbf{W}^T + \mathbf{W}
    \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T] \mathbf{W}^T] \mathbf{D}^{-1} \right)
    \right].$$'
