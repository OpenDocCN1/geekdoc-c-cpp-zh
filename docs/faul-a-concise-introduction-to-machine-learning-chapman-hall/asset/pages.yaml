    # 3.4 Markov Chains


    Markov chains are an important building block for a class of sampling algorithms
    which can be applied to many different distributions and also scale well with
    dimensionality.


    A Markov chain is a series of random variables \( \mathbf{x}_1, \dots, \mathbf{x}_N
    \). The indices are associated with a sequence in time. A Markov chain of order
    \( m \) satisfies the following property


    \( p(\mathbf{x}_n|\mathbf{x}_{n-1}, \mathbf{x}_{n-2}, \dots, \mathbf{x}_1) = p(\mathbf{x}_n|\mathbf{x}_{n-1},
    \mathbf{x}_{n-2}, \dots, \mathbf{x}_{n-m}) \)


    for \( n = m + 1, \dots, M \). This means the \( n^{th} \) random variable only
    depends on the \( m \) previous variables. In particular, a first-order Markov
    chain satisfies


    \( p(\mathbf{x}_n|\mathbf{x}_{n-1}, \mathbf{x}_{n-2}, \dots, \mathbf{x}_1) = p(\mathbf{x}_n|\mathbf{x}_{n-1})
    \)


    Each random variable only depends on its predecessor. We will only consider first-order
    Markov chains, since any Markov chain of order \( m \) can be transcribed into
    a first-order Markov chain by letting \( \mathbf{y}_{n-m+1} \) be the tuple \(
    (\mathbf{x}_n, \dots, \mathbf{x}_{n-m+1}) \), then since \( p(\mathbf{y}_k|\mathbf{y}_{k-1},
    \dots, \mathbf{y}_1) = p(\mathbf{y}_k|\mathbf{y}_{k-1}) \).


    The probabilities \( T_n(\mathbf{x}_{n-1}, \mathbf{x}_n) = p(\mathbf{x}_n|\mathbf{x}_{n-1})
    \) are called transition probabilities. If they are the same for all \( n \),
    i.e. \( T_n(\mathbf{x}_{n-1}, \mathbf{x}_n) = T(\mathbf{x}_{n-1}, \mathbf{x}_n)
    \) for all \( n \), then the Markov chain is called homogeneous.


    Graphically, a first-order Markov chain can be represented as


    ![](img/d3c00252180686426c9e63ab889b535b_95_0.png)


    The possible values of \( \mathbf{x}_n \) form a state space. We distinguish between
    a discrete and countable, possibly finite state space, and a continuous state'
