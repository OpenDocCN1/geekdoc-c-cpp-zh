- pgno: 161
  md: 'Obviously, the elements of \(\sigma(\mathbf{a})\) sum to 1. The softmax function
    is most often used in the final layer, where the number of synapses is the same
    as the number of classes, \(K\). It gives a probabilistic interpretation to which
    class the sample, which passed through the neural network, belongs.


    However, the construction of specific activation functions as in (5.3) is not
    in the spirit of machine learning, where as many tasks as possible shall be completed
    by the machine. Looking at Figure 5.16, we see that the region can actually be
    described as points on the right of the thin line and on the left of the bold
    line shall output 1. XOR is the combination of simpler building blocks. It can
    be implemented by introducing a set of *hidden* neurons. We denote the *hidden*
    variables, also known as *latent variables*, by \(z_1\) and \(z_2\). This is a
    two layer neural network, since a layer are the synapses from one set of neurons
    to another.


    ![](img/d3c00252180686426c9e63ab889b535b_161_0.png)


    For example:


    ![](img/d3c00252180686426c9e63ab889b535b_161_1.png)


    \(z_1\) represents an OR which is equivalent to the right of the thin line in
    Figure 5.16, while \(z_2\) represents NAND, or equivalently to the left of the
    bold line. The output neuron combines these two results with an AND, since both
    have to hold at the same time.


    Using several sets of hidden neurons, and therefore several layers if necessary,
    any region can be described as a combination of on the right or left'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'of several lines (or hyperplanes in higher dimensions). This makes neural networks
    particularly powerful for classification. In Chapter 9 we see how their performance
    is enhanced when continuous, non-linear activation functions are used.


    The results of neural networks are sensitive to the choice of


    +   - the number of layers,

    +   - the connection pattern,

    +   - the initialization of weights and

    +   - the activation functions and their parameters.


    All these are generally chosen by the user. Different choices are validated on
    validation sets to arrive at a set with which the neural network generalizes best
    to unseen data.


