  md: 'Taking the logarithm on both sides, results in


    ```

    \log p(\mathbf{t}|\mathbf{c}, \boldsymbol{\alpha}, \sigma^2) = \log p(\mathbf{c}|\mathbf{t},
    \boldsymbol{\alpha}, \sigma^2) + \log p(\mathbf{t}|\boldsymbol{\alpha}, \sigma^2).

    ```


    Both sides can be viewed as functions of the random variable c and thus we can
    take the expectation with regards to any distribution q(c).


    ```

    \int q(\mathbf{c}) \log p(\mathbf{t}, \mathbf{c} | \boldsymbol{\alpha}, \sigma^2)
    d\mathbf{c} = \int q(\mathbf{c}) \log p(\mathbf{c} | \mathbf{t}, \boldsymbol{\alpha},
    \sigma^2) d\mathbf{c}

    + \int q(\mathbf{c}) \log p(\mathbf{t} | \boldsymbol{\alpha}, \sigma^2) d\mathbf{c}

    = \int q(\mathbf{c}) \log p(\mathbf{c}|\mathbf{t}, \boldsymbol{\alpha}, \sigma^2)
    + \log p(\mathbf{t}|\boldsymbol{\alpha}, \sigma^2),

    ```


    since \(\int q(\mathbf{c}) d\mathbf{c} = 1\). Rearranging gives


    ```

    \log p(\mathbf{t}|\boldsymbol{\alpha}, \sigma^2) = \log \mathcal{L}(\mathbf{t}|\boldsymbol{\alpha},
    \sigma^2) = \int q(\mathbf{c}) \log p(\mathbf{t}, \mathbf{c} | \boldsymbol{\alpha},
    \sigma^2) d\mathbf{c}

    - \int q(\mathbf{c}) \log p(\mathbf{c} | \mathbf{t}, \boldsymbol{\alpha}, \sigma^2)
    d\mathbf{c}.

    ```


    We can subtract and add the term \(\int q(\mathbf{c}) \log q(\mathbf{c}) d\mathbf{c}\)
    on the right hand side and arrive at


    ```

    \log \mathcal{L}(\mathbf{t}|\boldsymbol{\alpha}, \sigma^2) = \int q(\mathbf{c})
    \log \frac{p(\mathbf{t}, \mathbf{c} | \boldsymbol{\alpha}, \sigma^2)}{q(\mathbf{c})}
    d\mathbf{c} - \int q(\mathbf{c}) \log \frac{p(\mathbf{c} | \mathbf{t}, \boldsymbol{\alpha},
    \sigma^2)}{q(\mathbf{c})} d\mathbf{c} \quad (8.4)

    ```


    using the properties of the logarithm. \(\log \mathcal{L}(\mathbf{t}|\boldsymbol{\alpha},
    \sigma^2)\) is also known as the log evidence.


    The second term (including the minus sign) is the Kullback-Leibler divergence
    (KL divergence) between the distribution q(c) and the posterior distribution p(c|t,
    alpha, sigma^2). It is also known as the discrimination information, information
    divergence, and information gain, since information is obtained from observing
    t. For two probability density functions p and q, the Kullback-Leibler divergence
    is defined as


    ```

    D_{KL}(p||q) = - \int p(x) \log \frac{q(x)}{p(x)} dx = \mathbb{E}_p \left[ - \log
    \frac{q(x)}{p(x)} \right],

    ```


    where \(\mathbb{E}_p\) denotes the expectation with respect to the distribution
    p. Using Jensen''s inequality,


    ```

    D_{KL}(p||q) \ge - \log \mathbb{E}_p \left[ \frac{q(x)}{p(x)} \right] = - \log
    \int p(x) \frac{q(x)}{p(x)} dx = - \log \int q(x) dx = 0,

    ```


    since \(\log 1 = 0\) (for more details of the proof see for example [3]). Hence
    the Kullback-Leibler divergence is always positive, and zero if and only if \(p(\mathbf{c}|\mathbf{t},
    \boldsymbol{\alpha}, \sigma^2) = q(\mathbf{c})\) almost everywhere.'
