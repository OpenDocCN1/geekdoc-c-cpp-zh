- pgno: 51
  md: 'Taking the logarithm results in


    $$y = \log a + \sum_{n=1}^N \log z_n.$$


    Hence the change in the logarithm of the population size is a sum of independent
    and identically distributed variables, the log \(z_n\). By the central limit theorem,
    such a sum tends to be normally distributed, irrespective of the distribution
    of \(\log z_n\). The addition of \(\log a\) only shifts the mean of this distribution.
    Hence the logarithm of the population size \(y\) is normally distributed. Thus
    the population size \(x\) is log-normally distributed. Instead of letting the
    numbers of years grow, the limit can also be achieved by considering smaller and
    smaller time intervals. It needs to be noted, though, that then the variance in
    the percentual growth increases, since longer time intervals have an averaging
    effect.


    Growth plays a major role in areas such as biology, medicine and economics. There
    are many other examples, where a log-normal distribution is used. For example
    the dwell time on online content and the length of comments online follow a log-normal
    distribution, as does the length of chess games. The *Black-Scholes model* for
    option pricing assumed that the returns of a stock are log-normally distributed.
    However, this assumption is flawed, because extreme price changes such as in the
    event of a stock market crash need a distribution with a larger kurtosis. In practice,
    such extreme events are more likely than the log-normal distribution indicates.


    If \(\mu\) and \(\sigma^2\) are the mean and variance of the associated normal
    distribution, the log-normal density function for \(x \sim \log \mathcal{N}(\mu,
    \sigma^2)\) is given by


    $$

    \log \mathcal{N}(x|\mu, \sigma^2) = \frac{1}{x\sqrt{2\pi\sigma}} \exp\left(-\frac{(\log
    x - \mu)^2}{2\sigma^2}\right).

    $$


    It is shown in Figure 2.13, while Figure 2.14 depicts the cumulative distribution
    function for various values of \(\mu\) and \(\sigma\). For \(\mu=0\) and \(\sigma=2\),
    the density function is peaked very close to zero. It is not visible that it is
    zero at the origin.


    The expectation is calculated as


    $$

    \mathbb{E}[x] = \int_0^\infty \frac{x}{x\sqrt{2\pi\sigma}} \exp\left(-\frac{(\log
    x - \mu)^2}{2\sigma^2}\right) dx.

    $$


    The factor of \(x\) cancels with the denominator in the density function. We let
    \(y = \log x\) or equivalently \(x = \exp y\). With this choice, \(dx = \exp y
    dy\) and the range of integration changes to \((-\infty, \infty)\).


    \(\begin{aligned}

    \mathbb{E}[x] &= \int_{-\infty}^\infty \frac{1}{\sqrt{2\pi\sigma}} \exp\left(-\frac{(y-\mu)^2}{2\sigma^2}\right)
    \exp y \, dy \\

    &= \int_{-\infty}^\infty \frac{1}{\sqrt{2\pi\sigma}} \exp\left(\frac{-(y-\mu)^2
    + 2\sigma^2 y}{2\sigma^2}\right) dy.

    \end\aligned}\)'
