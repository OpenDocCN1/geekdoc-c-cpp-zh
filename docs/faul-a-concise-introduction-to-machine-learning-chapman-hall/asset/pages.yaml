  md: 'We also have positive semi-definiteness of K, if the kernel function is defined
    via an inner product in a higher dimensional space, because then


    ```

    \mathbf{v}^T \mathbf{Kv} = \sum_{m,n=1}^N v_m \phi(\mathbf{x}_m)^T \phi(\mathbf{x}_n)
    v_n

    = \left( \sum_{m=1}^N v_m \phi(\mathbf{x}_m) \right)^T \left( \sum_{n=1}^N v_n
    \phi(\mathbf{x}_n) \right) = \| \sum_{n=1}^N v_n \phi(\mathbf{x}_n) \|^2 \ge 0.

    ```


    Therefore the inner product itself is a valid kernel.


    If A is a symmetric, positive semi-definite, \(M \times M\) matrix, then the function
    defined by


    ```

    k(\mathbf{x}, \mathbf{y}) = \mathbf{x}^T \mathbf{Ay}

    ```


    is a valid kernel function, since in this case


    ```

    \mathbf{v}^T \mathbf{Kv} = \sum_{m,n=1}^N v_m \mathbf{x}_m^T \mathbf{A} \mathbf{x}_n
    v_n = \left( \sum_{m=1}^N v_m \mathbf{x}_m \right)^T \mathbf{A} \left( \sum_{n=1}^N
    v_n \mathbf{x}_n \right) \ge 0.

    ```


    Similarly, if \(f : \mathbb{R}^M \to \mathbb{R}\) is any function and \(k : \mathbb{R}^M
    \times \mathbb{R}^M \to \mathbb{R}\) is a valid kernel, then


    ```

    \sum_{m,n=1}^N v_m f(\mathbf{x}_m) k(\mathbf{x}_m, \mathbf{x}_n) f(\mathbf{x}_n)
    v_n = \mathbf{w}^T K \mathbf{w} \ge 0, \quad (5.1)

    ```


    where \(\mathbf{w} = ((f(\mathbf{x}_1)v_1, \dots, f(\mathbf{x}_N)v_N)^T\). Therefore,
    the function defined by \(f(\mathbf{x})k(\mathbf{x}, \mathbf{y})f(\mathbf{y})\)
    is a kernel function.


    Multiplying a valid kernel by a positive constant is obviously a kernel, as is
    the sum of two valid kernels. Also, the product of two valid kernels is a kernel.
    Let \(\{\mathbf{x}_1, \dots, \mathbf{x}_N\}\) be an arbitrary set. Let \(\mathbf{K}\)
    denote the Gram matrix of the product of kernels. Since the Gram matrices of the
    two kernels, which are the factors, are symmetric and positive semi-definite,
    they can be written as products \(\mathbf{A}^T \mathbf{A}\) and \(\mathbf{B}^T
    \mathbf{B}\) respectively. Thus, their \((m, n)\) entries are given by


    ```

    \sum_{i=1}^N A_{mi} A_{ni} \quad \text{and} \quad \sum_{j=1}^N B_{mj} B_{nj}

    ```


    respectively. Now, for an arbitrary vector \(\mathbf{v} = (v_1, \dots, v_n)^T\),


    ```

    \mathbf{v}^T \mathbf{Kv} = \sum_{m,n=1}^N v_m K_{mn} v_n = \sum_{m,n=1}^N v_m
    \left( \sum_{i=1}^N A_{mi} A_{ni} \right) \left( \sum_{j=1}^N B_{mj} B_{nj} \right)
    v_n

    = \sum_{i,j=1}^N \left( \sum_{m=1}^N v_m A_{mi} B_{mj} \right) \left( \sum_{n=1}^N
    v_n A_{ni} B_{nj} \right)

    = \sum_{i,j=1}^N \left( \sum_{m=1}^N v_m A_{mi} B_{mj} \right)^2 \ge 0.

    ```'
