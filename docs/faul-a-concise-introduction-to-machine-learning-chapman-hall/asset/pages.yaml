  md: "# Sampling\n\nSampling is necessary, since in machine learning often a closed\
    \ form describing the probability distribution is not accessible, but the distribution\
    \ can be sampled. The chapter explains standard sampling techniques such as inverse\
    \ transform sampling, rejection sampling and importance sampling as well as Markov\
    \ chains and Markov Chain Monte Carlo in an intuitive way.\n\nIn the previous\
    \ chapter, we have seen how data is used to estimate the parameters of the assumed\
    \ underlying distribution generating the data $\\mathcal{D}$ using Bayes rule.\
    \ For example, let $\\theta_1$ be the vector of all parameters governing the distribution\
    \ and $\\theta_2$ the vector of all hyperparameters governing the prior distributions\
    \ for the parameters $\\theta_1$. Then the posterior is given by\n\n```\n$$f(\\\
    theta_1|\\mathcal{D}, \\theta_2) = \\frac{p(\\mathcal{D}|\\theta_1)f(\\theta_1|\\\
    theta_2)}{\\int p(\\mathcal{D}|\\theta_1)f(\\theta_1|\\theta_2)d\\theta_1}.$$\
    \ (3.1)\n```\n\nUnless we are dealing with conjugate probability distributions,\
    \ no closed solution might exist. It might not be possible to evaluate the integral\
    \ in the denominator.\n\nNote that, by the product rule, the integrand is the\
    \ joint probability density function of $\\mathcal{D}$ and $\\theta_1$ conditioned\
    \ on $\\theta_2$, i.e. $f(\\mathcal{D}, \\theta_1|\\theta_2)$. This means the\
    \ denominator is the marginal distribution function $f(D|\\theta_2)$. \n\nAnother\
    \ way of interpreting the integral is that it is the expectation of the function\
    \ $p(D|\\theta_1)$ with respect to the distribution described by the probability\
    \ density function $f(\\theta_1|\\theta_2)$. We already encountered a similar\
    \ situation in Equation (2.19), when attempting to derive the probability density\
    \ function of a random variable which is a function of two other random variables.\
    \ The outer integral can be interpreted as the expectation of the function given\
    \ by the inner integral with respect to the probability density function in the\
    \ outer integral.\n\nMore generally, the situation, where the expectation\n\n\
    ```\n$$\\mathbb{E}[h] = \\int h(x)f(x)dx$$\n```"
