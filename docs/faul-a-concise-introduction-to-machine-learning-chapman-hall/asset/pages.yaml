- pgno: 97
  md: '$T(\mathbf{x}, \hat{\mathbf{x}}) = \sum_{m=1}^M b_m B_m(\mathbf{x}, \hat{\mathbf{x}})$


    where \(b_1, \dots, b_M\) are known as *mixing coefficients* and satisfy \(b_m
    \ge 0\) and \(\sum_{m=1}^M b_m = 1\). If each of the base transitions satisfies
    detailed balance, then so does the linear combination. Often, the base transitions
    are chosen such that each only changes a subset of components in \(\mathbf{x}\).


    If the state space is finite, then it can be represented by a 1-of-\(K\) vector.
    That is the random variable \(\mathbf{x}_n\) taking on the \(k^{\text{th}}\) state
    is a \(K\)-dimensional vector, where exactly one element, \(x_{n,k}\), equals
    one and all the others are zero. The transition probabilities \(p_{kl} = p(x_{n+1,l}
    = 1 | x_{n,k} = 1)\), that is that \(\mathbf{x}_n\) in state \(k\) generates \(\mathbf{x}_{n+1}\)
    in state \(l\), can be represented in matrix form


    \[P = \begin{pmatrix} p_{11} & \cdots & p_{1K} \\ \vdots & \ddots & \vdots \\
    p_{K1} & \cdots & p_{KK} \end{pmatrix} \]\)


    which is called the *transition matrix*. Each row of \(P\) sums to one. It is
    therefore a *right stochastic matrix* as opposed to a *left stochastic matrix*
    where each column sums to one. A *doubly stochastic matrix* is one where both
    columns and rows sums to one. This would for example be the case, if \(P\) is
    symmetric, that is the probability of transitioning from state \(k\) to \(l\)
    is the same as from state \(l\) to \(k\).


    The probability of transitioning from stage \(k\) to \(l\) in \(m\) steps is the
    \((k, l)\) entry in \(P^m\). A state \(k\) has *period* \(m\), if any return to
    state \(k\) occurs in multiples of \(m\) time steps. More formally the period
    \(m\) is the greatest common denominator of all numbers \(n\) such that the probability
    \(p(x_{n+1,k} = 1 | x_{1,k} = 1)\) is non-zero. If \(m = 1\), the state is called
    *aperiodic*. This happens, for example, if the probability of transitioning to
    itself is non-zero. A Markov chain is *aperiodic*, if every state is aperiodic.
    An irreducible Markov chain, i.e. where every state can be reached from any other
    state, only needs one aperiodic state to be aperiodic. This is because using this
    one aperiodic state, one can return any state in a number of steps which is any
    prime number and the greatest common denominator of several prime numbers is 1.


    If the initial distribution \(\mathbf{p}(1)\) is given by \(\mathbf{p} = (p_1,
    \dots, p_K)\), then the distribution of \(\mathbf{x}_{n+1}\) is given by \(\mathbf{p}P^n\).


    The transition matrix can be depicted in a *state diagram*. For example, if'
