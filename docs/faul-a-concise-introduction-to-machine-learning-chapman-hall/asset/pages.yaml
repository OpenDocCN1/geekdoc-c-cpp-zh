  md: "One possible solution is an activation function with two steps, for example\n\
    \n```\n$$h(x) = \\begin{cases} 0 & \\text{if } x \\le 0.25 \\\\ 1 & \\text{if\
    \ } 0.25 < x < 0.75 \\\\ 0 & \\text{if } x \\ge 0.75 \\end{cases}$$ (5.3)\n```\n\
    \n![](img/d3c00252180686426c9e63ab889b535b_159_0.png)\n\nAgain, the learning process\
    \ might have chosen different weights.\nIndeed, there are many different activation\
