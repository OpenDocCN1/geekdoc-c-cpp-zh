  md: 'distribution. If this distribution is a normal distribution, then it is a Gaussian
    process. If D = 2, it is also known as a Gaussian random field.


    Recall that so far the model was specified as


    $$f(\mathbf{x}) = \sum_{m=1}^M c_m d_m(\mathbf{x}).$$


    Let \(\mathbf{x}_1, \dots, \mathbf{x}_N\) be any set of points, and denote \((f(\mathbf{x}_1),
    \dots, f(\mathbf{x}_N))^T\) by \(\mathbf{f}\). Then


    $$ \mathbf{f} = \mathbf{Dc}, $$


    where \(\mathbf{D}\) is the design matrix and \(\mathbf{c}\) is the vector of
    coefficients as before. The assumption that \(\mathbf{c}\) is normally distributed.
    Since \(\mathbf{f}\) is a linear transformation of \(\mathbf{c}\), it also has
    a normal distribution. Therefore, our models so far are Gaussian processes.


    The prior assumption is that \(\mathbf{c}\) has zero mean, and hence \(\mathbf{f}\)
    has also zero mean. We considered the two cases, where the prior covariance matrix
    of \(\mathbf{c}\) is either \(\alpha^{-1}\mathbf{I}\), that is all coefficients
    have the same precision \(\alpha\), or the diagonal matrix \(\mathbf{A}^{-1}\),
    where each coefficient has its own precision. The covariance matrix of \(\mathbf{f}\)
    is then


    $$ \text{var}[\mathbf{f}] = \mathbb{E}[\mathbf{f}\mathbf{f}^T] = \mathbb{E}[\mathbf{Dc}\mathbf{c}^T\mathbf{D}^T]
    = \mathbf{D}\mathbb{E}[\mathbf{c}\mathbf{c}^T]\mathbf{D}^T = \begin{cases} \alpha^{-1}\mathbf{D}\mathbf{D}^T
    \\ \mathbf{D}\mathbf{A}^{-1}\mathbf{D}^T . \end{cases} $$


    Note that the covariance matrix of \(\mathbf{f}\) depends on the set \(\mathbf{x}_1,
    \dots, \mathbf{x}_N\) via the design matrix. Therefore different sets of points
    will give rise to different multivariate distributions of \(\mathbf{f}\). Defining
    \(\mathbf{d}(\mathbf{x}_i)^T = (d_1(\mathbf{x}_i), \dots, d_M(\mathbf{x}_i))\)
    as the vector of all basis functions evaluated at a specific point \(\mathbf{x}_i\),
    the \((i, j)\) entry of the covariance matrix is


    $$ \alpha^{-1}\mathbf{d}(\mathbf{x}_i)^T\mathbf{d}(\mathbf{x}_j) \quad \text{or}
    \quad \mathbf{d}(\mathbf{x}_i)^T\mathbf{A}^{-1}\mathbf{d}(\mathbf{x}_j). $$


    The covariance matrices arising in a Gaussian process are completely specified,
    if the \((i, j)\) entry is given by evaluating a kernel function at \(\mathbf{x}_i\)
    and \(\mathbf{x}_j\), i.e. \(k(\mathbf{x}_i, \mathbf{x}_j)\). The covariance matrix
    is then the Gram matrix and positive definite. The above are two specific choices
    of kernel. The choice of kernel function depends on the application. For possible
    choices of kernels see Section 5.2 in Chapter 5.


