    First, I have to give special thanks Dr Nikos Nikiforakis and Professor James
    Elliot, whose decision to exclude me from most activities freed up time to develop
    additional teaching material. This book is based on the lecture course taught
    within the MPhil in Scientific Computing at the University of Cambridge, UK, and
    additional material. Lectured at the Centre for Mathematical Sciences in Cambridge,
    since lecturing this was not approved by the director of the MPhil in Scientific
    Computing. Thanks go to Dr James Ferguson who made the additional lectures possible.


    Next, thanks are also due to my PhD supervisor Professor Mike Powell who sadly
    passed away in April 2014. From him I learned that one should strive for understanding
    and simplicity. I more often saw him working through an algorithm with pen and
    paper than sitting at a computer. He wanted to know why a particular algorithm
    was successful. Especially, when machine learning systems reach greater and greater
    complexity, it is important to continue to strive for understanding.


    Of course, I also need to thank all the graduate students who attended the lectures
    and whose questions and quest to further their understanding improved this book.


    I would also like to express my gratitude to Cambridge University and the staff
    and fellows at Selwyn College for creating such a wonderful atmosphere in which
    to learn and teach.


    This book would not have been written without the support of many people in my
    private life, foremost my parents Helmut and Marieleuse Faul, who instilled a
    love for knowledge in me, and taught me to appreciate the value of integrity,
    especially the integrity of science.


    A.C. Faul'
