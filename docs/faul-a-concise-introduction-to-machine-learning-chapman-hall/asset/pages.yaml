  md: 'This shows that the kind and location of measurements are an important consideration
    in regression.


    Could we have been more clever in the design phase by using knowledge about the
    problem? Firstly, sin(0) = 0. This means that the constant 1 is not necessary
    as regressor. Secondly, sin(x) is an odd function, that is sin(-x) = -sin(x).
    Therefore the regressors should also be odd polynomials. Hence the polynomials
    with even exponent are not required. A better choice might have been


    $$

    \mathbf{D} = \begin{pmatrix} x_1 & x_1^3 & \cdots & x_1^{2M-3} & x_1^{2M-1} \
    \vdots & \vdots & & \vdots & \vdots \ x_N & x_N^3 & \cdots & x_N^{2M-3} & x_N^{2M-1}
    \end{pmatrix}

    $$


    Still M regressors, but possibly higher accuracy. Therefore the choice of regressors
    depends on the problem.


    # 8.4 Ordinary Least Squares


    Recall that we assume the dictionary of basis functions is fixed. How best to
    solve t = Dc + \(\epsilon\) generally? One approach is to consider the probabilistic
    nature of the noise. Remember, the \(\epsilon_i\) are independent and identical
    normally distributed random variables with zero mean and variance \(\sigma^2\).
    The likelihood of observing t given the model specified by D, c and \(\sigma^2\)
    is


    $$

    \mathcal{L}(\mathbf{t}|\mathbf{D}, \mathbf{c}, \sigma^2) = (2\pi\sigma^2)^{-N/2}
    \exp \left( -\frac{1}{2\sigma^2} (\mathbf{t} - \mathbf{Dc})^T (\mathbf{t} - \mathbf{Dc})
    \right).

    $$


    The likelihood quantifies whether the difference between the predictions Dc and
    the targets t can be explained by the noise.


    Since the formula involves the exponential function, it makes sense to consider
    the logarithm of the likelihood known as the log likelihood:


    $$

    \log \mathcal{L}(\mathbf{t}|\mathbf{D}, \mathbf{c}, \sigma^2) = -\frac{N}{2} \log
    2\pi\sigma^2 - \frac{1}{2\sigma^2} (\mathbf{t} - \mathbf{Dc})^T (\mathbf{t} -
    \mathbf{Dc}) \quad (8.1)

    $$


    A suitable choice for c is the one which maximizes the log likelihood. Since the
    first term is independent of c, this is equivalent to minimizing


    $$

    (\mathbf{t} - \mathbf{Dc})^T (\mathbf{t} - \mathbf{Dc}) = \|\mathbf{t} - \mathbf{Dc}\|^2
    = \sum_{n=1}^N r_n^2 = \sum_{n=1}^N (t_n - \mathbf{d}(\mathbf{x}_n)^T \mathbf{c})^2,

    $$


    where \(\| \cdot \|\) denotes the Euclidean norm or \(L_2\) norm and where \(\mathbf{d}(\mathbf{x}_n)^T
    = (d_1(\mathbf{x}_n), \dots, d_M(\mathbf{x}_n))^T\). The expression \(r_n = t_n
    - \mathbf{d}(\mathbf{x}_n)^T \mathbf{c}\) is called the \(n^{th}\) residual. It
    is the difference between the \(n^{th}\) target and the prediction for it. Note
    that \(\mathbf{d}(\mathbf{x}_n)^T\) is the \(n^{th}\) row of D. The sum is known
    as sum of squared residual (SSR), error sum of squares (ESS), or residual sum
    of squares (RSS). The technique is known as Ordinary Least Squares (OLS), since
    a sum of squares is minimized.'
