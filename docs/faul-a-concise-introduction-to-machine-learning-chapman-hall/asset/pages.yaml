  md: "```\nfunction [x,y] = data(f,x1,x2,N,s,sigma0,sigma1)\n% This function creates\
    \ N noisy data pairs (x,y) from a function f\n% in the interval [x1,x2] with added\
    \ noise where the noise is a\n% mixture of zero mean normal distributions with\
    \ variances sigma0\n% and sigma1 with probability s and 1-s.\n% Input arguments\n\
    % f function handle\n% x1,x2 end points of interval\n% N number of data pairs\
    \ to be generated\n% s mixing probability of error distributions\n% sigma0 standard\
    \ deviation of first error distribution\n% sigma1 standard deviation of second\
    \ error distribution\n% Output arguments\nx = linspace(x1,x2,N) ;\ny = zeros(1,N)\
    \ ;\nfor i = 1:N\n    r = rand;\n    if (r<s)\n        y(i) = f(x(i)) + randn*sigma1;\n\
    \    else\n        y(i) = f(x(i)) + randn*sigma0;\n    end\nend\nend\n```\n\n\
    Listing 8.1: Generating noisy data.\n\nThe question is, how complex should the\
    \ dictionary we choose be? Or in other words, what should be the dimension of\
    \ the model space? With too much complexity, other effects come into play. One\
    \ known as _over-fitting_ is modeling noise as well as the process. In Figure\
    \ 8.5, the higher order polynomials try to follow the training data more closely,\
    \ and to achieve this they sometimes have to bend more, taking the curve away\
    \ from the true solution. This is especially noticeable with the polynomial of\
    \ degree 5 in Figure 8.5b.\n\nA further problem occurs if the regressors are not\
    \ suitably chosen. For example, high degree polynomials are unsuitable, since\
    \ the solutions diverge from the true solution, especially at the end of intervals,\
    \ as Figure 8.5a shows at the right hand side. Every training data point can be\
    \ viewed as a carrier of information. If the approximations in the middle of the\
    \ interval is evaluated, it benefits from the fact that information flowed from\
    \ training data points from both sides. At the end of the interval information\
    \ can only arrive from one side. Higher degree polynomials fan away from the true\
    \ solution at the end of the interval. The effect is more dominant, the further\
    \ away from training data one is. The approximations of degree 4 or below in Figure\
    \ 8.5b benefit from the fact that a training data point is close to each end of\
    \ the interval.\n\nIn this context, the _law of parsimony_ states that if two\
    \ models explain the data equally well, the one with less complexity should be\
    \ chosen. This is also known as _Occam's razor_. William Ockham (also Occam) writes\
    \ in [34]"
