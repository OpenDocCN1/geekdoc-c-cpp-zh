  md: 'Since we are only interested in the direction of \(\mathbf{w}\), the length
    can be chosen freely. Thus the separation is maximal, if \(\mathbf{w}\) is a multiple
    of the vector \((\Sigma_0 + \Sigma_1)^{-1}(\mu_0 - \mu_1)\). With this choice
    for \(\mathbf{w}\) the scaling factor in the formula for \(\mathbf{w}\) is 1.


    The MATLAB code in Listing 4.1 calculates Fisher''s discriminant as specified
