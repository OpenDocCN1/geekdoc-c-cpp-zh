    A well-known example of a probability density function is the *bell curve* of
    a normal distribution also known as the Gaussian distribution \(x \sim \mathcal{N}(\mu,
    \sigma^2)\), where \(\sim\) means ''is distributed as''. Its probability density
    function is given by


    ```

    \(\mathcal{N}(x|\mu, \sigma^2) = \frac{1}{\sqrt{2\pi}\sigma} \exp \left( - \frac{1}{2\sigma^2}(x-\mu)^2
    \right). \quad (2.4)\)

    ```


    Its position and shape are determined by the parameters \(\mu\), called the *mean*,
    and \(\sigma^2\), known as the *variance*. The square root of the variance, \(\sigma\),
    is called the *standard deviation*. Figure 2.2 illustrates the shapes of the bell
    curve for various values of the mean and variance. When \(\mu = 0\) and \(\sigma
    = \sigma^2 = 1\), it is known as the *standard normal distribution*.


    There is a common misconception that "normal" means common. Gauss introduced the
