    # ## 3.3 Importance Sampling


    One reason for sampling is to approximate a multidimensional expectation of some
    function $h$ of the random variable vector $\mathbf{x}$ by


    ```

    \(\mathbb{E}[h] = \int h(\mathbf{x})f(\mathbf{x})d\mathbf{x} \approx \frac{1}{N}
    \sum_{n=1}^N h(\mathbf{x}_n),\)

    ```


    where \(\mathbf{x} \in \mathbf{R}^d\) and \(\mathbf{x}_n \in \mathbf{R}^d, n=1,
    \dots, N\) are samples drawn from the probability density \(f\). However, this
    is not suitable when sampling is not possible or computationally too expensive.
    A possible solution is not to sample, but to weigh each evaluation \(h(\mathbf{x}_n)\)
    by \(f(\mathbf{x}_n)\),


    ```

    \(\mathbb{E}[h] \approx \sum_{n=1}^N f(\mathbf{x}_n)h(\mathbf{x}_n),\)

    ```


    where now \(\mathbf{x}_n, n=1, \dots, N,\) are selected in some way. A naive approach
    would be to select them uniformly. Firstly, in this case \(N\) grows exponentially
    with the number of dimensions \(d\) to achieve a good approximation. Secondly,
    this neglects the fact that in many cases the regions of interest, that is where
    the probability density function concentrates its mass, are relatively small.


    Importance sampling uses a proposal distribution \(g\) which focuses attention
    onto regions of interest and which can be easily sampled. It does not need to'
