    # (a) Gaussian kernel, \(\theta_1 = \theta_2 = 1\)


    ![](img/d3c00252180686426c9e63ab889b535b_279_1.png)


    # (b) Exponential kernel, \(\theta_1 = \theta_2 = 1\)


    ![](img/d3c00252180686426c9e63ab889b535b_279_2.png)


