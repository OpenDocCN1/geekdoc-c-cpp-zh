- pgno: 126
  md: 'Again, this only depends on the inner products between the training samples
    and the new sample weighted by \(\alpha_n\). The inner product can be viewed as
    measuring the relationship between the two samples. Through the multiplication
    by \(c_n\), the weighted inner products from one class are added, while the others
    are subtracted. Depending on where the scales are tipped (Figure 4.11), the new
    sample is deemed more related to the samples of one class than the other, and
    classified accordingly.


    Since \(\alpha_n\) is only non-zero for the support vectors, it is only important
    how the new sample relates to the support vectors. This is a major advantage of
    the Support Vector Machine, since it results in a sparse model of the classes.
    Only the support vectors are necessary for future classifications.


    We will see the advantages of recasting the problem by examining the relationships
    between samples when considering non-linear classification and the kernel trick.
    Here the inner product between samples assigns a numeric value to the relationship.
    The inner product is a counter-intuitive measure. For a given sample vector, all
    samples lying on the line orthogonal to it are given the value zero in this relation.
    Samples lying on the same side of this line as the given sample are given a positive
    value, while samples on the other side are given a negative value. The absolute
    values increase with the distance from this line.


    As we will see later, different measures for the relationship can be chosen.


    The MATLAB code in Listing 4.3 uses the Support Vector Machine implementation
    to calculate the support vectors and plot the separation line. The result can
    be seen in Figure 4.12.'
