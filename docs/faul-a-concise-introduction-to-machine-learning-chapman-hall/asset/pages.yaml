- pgno: 111
  md: '# 4.2 Projections onto Subspaces


    Each sample has two features and we can write these as vectors.


    $$\mathbf{v}_1 = \begin{pmatrix} v_{11} \\ v_{12} \end{pmatrix} \quad \text{and}
    \quad \mathbf{v}_2 = \begin{pmatrix} v_{21} \\ v_{22} \end{pmatrix}$$


    The length of a vector is the square root of the sum of the squares of the coordinates.


    $$\|\mathbf{v}_2\| = \sqrt{v_{21}^2 + v_{22}^2}.$$


    This is also known as the Euclidean norm or $L_2$ norm. Between two vectors a
    inner product, also known as a scalar product or dot product can be defined:


    $$\mathbf{v}_1 \bullet \mathbf{v}_2 = \langle \mathbf{v}_1, \mathbf{v}_2 \rangle
    = v_{11}v_{21} + v_{12}v_{22}.$$


    More generally, this can be viewed as a matrix product between the transpose of
    the first vector and the second vector.


    $$\mathbf{v}_1 \bullet \mathbf{v}_2 = \mathbf{v}_1^T \mathbf{v}_2 = \begin{pmatrix}
    v_{11} & v_{12} \end{pmatrix} \begin{pmatrix} v_{21} \\ v_{22} \end{pmatrix} =
    v_{11}v_{21} + v_{12}v_{22}.$$


    A $1 \times 2$ matrix times a $2 \times 1$ matrix is a $1 \times 1$ matrix.


    A common technique to reduce to a higher dimensional problem to a lower dimensional
    one where it can be solved more easily. In particular, we reduce the two dimensional
    problem to a one-dimensional one by projecting onto a line going through 0 and
    in the direction of a vector $\mathbf{w}$. The formula of the projection of a
    vector $\mathbf{v}$ onto $\mathbf{w}$ is given by


    $$\text{proj}_{\mathbf{w}}(\mathbf{v}) = \frac{\mathbf{w}^T \mathbf{v}}{\|\mathbf{w}\|^2}
    \mathbf{w}$$


    Figure 4.2 illustrates this.


    We then seek a separation threshold $b$, also known as bias such that for $\mathbf{v}$


    +   * $\mathbf{w}^T \mathbf{v} < b \Rightarrow \mathbf{v} \in C_0$,

    +   * $\mathbf{w}^T \mathbf{v} > b \Rightarrow \mathbf{v} \in C_1$.


    In Figure 4.2 the bias happens to be 0 for $\mathbf{v}_1$ being in class $C_0$
    and $\mathbf{v}_2$ being in class $C_1$.


    The task is to find the direction $\mathbf{w}$ and separation threshold $b$. $\mathbf{w}$
    is also known as the vector of weights. The line vertical to $\mathbf{w}$ through
    $b$ should separate the classes. In three dimensions, a plane separates the data,
    while in higher dimensions it is a hyperplane. Naively choosing the coordinate
    axes is unsuitable as Figure 4.3 shows. One idea could be to use the line through
    the sample means of each class and the midpoint between sample means as separation
    threshold. The sample mean of class $C_i$ is


    $$\mu_i = \frac{1}{N_i} \sum_{\mathbf{v} \in C_i} \mathbf{v}, \quad i = 0, 1.
    \tag{4.1}$$'
  merge: -1
