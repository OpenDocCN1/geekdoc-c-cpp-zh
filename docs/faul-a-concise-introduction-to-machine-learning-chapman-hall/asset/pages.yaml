  md: 'While it is desirable in neural networks to choose the number of hidden neurons
    smaller than the dimension of the input data, the assumption is that it needs
    to be chosen large enough so that the distinguishing features in the data are
    captured. However, what does large enough mean? To understand the inner workings
    of an algorithm it is helpful to look at smaller problems. In our first experiment,
    we therefore only consider the digits zero and one. Since only two classes need
    to be distinguished, we set the number of hidden neurons M to two. Figure 9.4
    shows the results.


    Firstly, in Figure 9.4a it can be seen that the activations of the training data
    are separated. It is a two dimensional space, since there are two hidden neurons.
    This space becomes close to the space spanned by the first two principal components
    of the training data, because there the data is most easily separated and this
    is the goal of the encoder. The transfer function emphasizes this separation,
    which can be seen in Figure 9.4b.


    Secondly, the latent space is spanned by the two bases seen in Figures 9.4c and
    9.4d. The numeric values at each pixel location is indicated by the colour bar.
    The first basis resembles a slanted one written over a zero, while the second
    is similar to a straight one over a zero. The bias resembles a zero. Different
    runs can arrive at different configurations of the bases and bias, since the neural
    network is initialized randomly.


    Since the autoencoder strives to reconstruct the input, the basis functions it
    chooses resemble digits or over-laid digits to the human eye, while principal
    component analysis focuses on the largest eigenvalues and the principal components
    do not resemble digits and neither do the resulting reconstructions.


    In Figure 9.5 another digit was included, but the set-up was kept the same. The
    reconstructions in Figure 9.5g are discernible, which cannot be said about Figure
    7.3b where the reconstruction is done using principal component analysis. One
    might imagine a two in Figure 9.5c, a one in Figure 9.5d and a zero as the bias
    in Figure 9.5e. The separations in Figure 9.5b are not clear for digits zero and
    two, while they are still well separated in Figure 9.5a. This is mostly due to
    the position of the zero on the horizontal axis, since for zero the logistic sigmoid
    function evaluates to 0.5 making both classes equally likely. However, samples
    of one and two are mostly present there and they are separated along the vertical
    axis. The separation can be improved by shifting the activations right such that
    the zero point of the horizontal axis lies where the digits zero and two separate.


    Alternatively, the number of hidden neurons can be increased to three. The results
    are shown in Figure 9.5. The reconstructions are good and the basis functions
    resemble elements of digits. In Figure 9.5b, the latent variables of the digit
    zero are packed at the (0, 0, 0) corner of the unit cube, while those of the digit
    one lie along the edges connecting the (0, 1, 0), (0, 1, 1), (0, 0, 1) and (1,
