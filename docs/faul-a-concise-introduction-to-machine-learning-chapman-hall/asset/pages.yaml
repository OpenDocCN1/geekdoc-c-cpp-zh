- pgno: 299
  md: 'In other words, it averages over all the values the latent variable takes,
    when the samples \(\mathbf{x}_1, \dots, \mathbf{x}_N\) pass through the network.
    The aim is to keep this value low so that \(z_m^{(l)}\) is zero or close to zero
    for most inputs and has non-negligible values for only a subset of inputs. This
    means the neuron only reacts, or "fires", to a small number of inputs, and this
    way identifying a subset with common features. The error function includes a penalty
    term for all hidden neurons, which is large, if \(p_m^{(l)}\) differs from the
    predefined sparsity proportion \(p\), small, if \(p_m^{(l)}\) is close to \(p\),
    and zero, if they are equal. The Kullback-Leibler divergence between \(p\) and
    \(p_m^{(l)}\) has the necessary properties.


    More specifically, the sparsity regularization penalty term


    ```

    \(\Omega_s = \sum_{l=1}^{L-1} \sum_{m=1}^{M_l} D_{KL}(p||p_m^{(l)}) = \sum_{l=1}^{L-1}
    \sum_{m=1}^{M_l} \left( p \log \frac{p}{p_m^{(l)}} + (1-p) \log \frac{1-p}{1-p_m^{(l)}}
    \right)\)

    ```


    is added to the error function with a suitable weight \(\beta\). Suitable values
    for both \(\beta\) or \(p\) can be chosen by monitoring the convergence and reconstruction
    behaviour or via a validation set.


    However, when adding this penalty, the latent variables might become small, while
    the weights in the subsequent layer become large counteracting the effect. In
    order to avoid this, another penalty term, the \(L_2\) regularization term acting
    on the weights is added as well,


    ```

    \(\Omega_w = \frac{1}{2} \sum_{l=1}^{L} \sum_{j=1}^{M_{l-1}} \sum_{i=1}^{M_l}
    w_{ji}^{(l)2},\)

    ```


    where \(M_0 = M_L = D\). As before, this is weighted by a suitable parameter \(\lambda\).
    This term penalizes growth in the weights.


    Another variation is the *contractive autoencoder*. Let the encoder function be
    \(\phi(\mathbf{x}) = (\phi_1(\mathbf{x}), \dots, \phi_{M_{L/2}}(\mathbf{x}))^T\).
    Its Jacobian matrix is


    ```

    \(J_\phi(\mathbf{x}) = \begin{pmatrix} \frac{\partial \phi_1}{\partial x_1}(\mathbf{x})
    & \dots & \frac{\partial \phi_1}{\partial x_D}(\mathbf{x}) \\ \vdots & \ddots
    & \vdots \\ \frac{\partial \phi_{M_{L/2}}}{\partial x_1}(\mathbf{x}) & \dots &
    \frac{\partial \phi_{M_{L/2}}}{\partial x_D}(\mathbf{x}) \end{pmatrix}.\)

    ```


    If we would have \(M_{L/2} = D\), that is that the Jacobian matrix is square,
    then the modulus of its determinant is the factor by which volumes in \(\mathbb{R}^D\)
    under the transformation by \(\phi\) shrink or expand. The aim is to control this
    volume change favouring reductions in volume, therefore the name contractive autoencoder.
    However, generally \(M_{L/2} \neq D\). In fact, a much smaller number than \(D\)
    is desired. The *Frobenius norm* is a measure of change under these circumstances.


    For a general, real \(a \times b\) matrix \(\mathbf{A}\) with entries \(A_{ij}\),
    the Frobenius norm is defined as


    ```

    \(\|\mathbf{A}\|_F = \sqrt{\text{tr}(\mathbf{A}^T \mathbf{A})} = \sqrt{\sum_{i=1}^a
    \sum_{j=1}^b A_{ij}^2}.\)

    ```'
