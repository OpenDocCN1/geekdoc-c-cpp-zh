  md: 'The result is a matrix, where the $k^{th}$ diagonal entry gives how much $x_k$
    varies around the mean $\mu_k$. The off-diagonal entries measure how much different
    components of $\mathbf{x}$ influence each other.


    Now, $\mathbf{x}$ is a 1-of-K representation. If $x_k = 1$ in $\mathbf{x}$, then
    $\mathbf{x}\mathbf{x}^T$ is a matrix with zero entries everywhere apart from the
    $k^{th}$ diagonal element which has the entry 1. From this


    \(\text{var}[\mathbf{x}] = \sum_{\mathbf{x}} \text{Cat}(\mathbf{x}|\boldsymbol{\mu})\mathbf{x}\mathbf{x}^T
    - \boldsymbol{\mu}\boldsymbol{\mu}^T = \text{diag}(\boldsymbol{\mu}) - \boldsymbol{\mu}\boldsymbol{\mu}^T\)


    follows, where $\text{diag}(\boldsymbol{\mu})$ denotes the matrix, where the off-diagonal
    elements are zero and the diagonal is given by the entries of $\boldsymbol{\mu}$.


    Note that the $k^{th}$ diagonal entry of $\text{var}[\mathbf{x}]$ is $\mu_k -
    \mu_k^2 = \mu_k(1 - \mu_k)$. This is the variance of a Bernoulli distribution,
    where success is defined as the outcome being $x_k = 1$ and failure as $x_k =
    0$. The $(k, l)$ off-diagonal entry is known as the $\text{covariance } \text{cov}[x_k,
    x_l]$ between $k^{th}$ and $l^{th}$ element and is $-\mu_k\mu_l$. This shows that
    the $k^{th}$ and $l^{th}$ component influence each other in a negative way, since
    if one is 1, the other has to be 0.


    As with binary variables, we can also ask for the distribution of different combinations
    of outcomes, when the experiment is repeated $N$ times. Each experiment gives
    a result vector $\mathbf{x}_n, n = 1, \dots, N$. Let $m_k$ be the number of times
    the outcome of the experiment is $x_{nk} = 1$. Since $x_{nk}$ is zero otherwise,
    we have


    \(m_k = \sum_{n=1}^N x_{nk}\)


    We are interested in the distribution of the tuple $\mathbf{m} = (m_1, \dots,
    m_K)^T$ of length $K$. It is actually of length $K - 1$, since the numbers $m_k$
    are constrained by


    \(\sum_{k=1}^N m_k = N,\) (2.11)


    and hence $m_K$ is given by $m_K = N - m_1 - \dots - m_{K-1}$. The number of possibilities
    to generate a particular tuple is given by the *multinomial coefficient*,


    \(\binom{N}{m_1 \dots m_K} = \frac{N!}{m_1! \dots m_K!}\)


    Combinatorially, it is the number of ways one can put $N$ balls into $K$ bins
    where bin 1 contains $m_1$ balls, bin 2 contains $m_2$ objects and so on. Here
    $0!$ is defined to be one. The binomial coefficient is the multinomial coefficient
    with $m_1 = m$ and $m_2 = N - m$.


    The probability density function of the *multinomial distribution* $\mathbf{m}
    \sim \text{Mult}(N, \boldsymbol{\mu})$ is then


    \(\text{Mult}(\mathbf{m}|N, \boldsymbol{\mu}) = \binom{N}{m_1 \dots m_K} \prod_{k=1}^K
    \mu_k^{m_k}.\) (2.12)'
