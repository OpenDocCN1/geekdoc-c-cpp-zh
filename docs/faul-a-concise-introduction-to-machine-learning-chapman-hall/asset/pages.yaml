  md: 'Combining this with the product rule gives \(p(Y|X)p(X) = p(X|Y)p(Y)\). Dividing
    by \(p(X)\) leads to Bayes'' rule, also known as Bayes'' law or theorem which
    relates the conditional probabilities of random variables to each other:


    \(p(Y|X) = \frac{p(X|Y)p(Y)}{p(X)}\).


    Bayes'' rule plays an important role within machine learning, sparking many Bayes''
    subbranches. A very good account of its historic influence is given by McGrayne
    in [28].


    Within machine learning, the random variable \(X\) is often the available data,
    which either has been gathered or is generated by experiments. \(X\) can be multidimensional,
    since different kinds of information can be given for one data point. The random
    variable \(Y\) on the other hand encompasses the variables which we believe influence
    the data. Again this can be multidimensional. The probability \(p(Y)\) gives our
    prior belief. This can be experience or the opinion of experts, or derived from
    other experiments. The prior has a controversial role, since it quantifies a subjective
    opinion. The conditional probability \(p(X|Y)\) is in some way a measure of how
    well different choices for \(Y\) explain \(X\). It is sometimes referred to as
    the likelihood and is a function of \(Y\). The overall probability of the data
    \(X\) is given by \(p(X)\). It can be calculated using a combination of the sum
    and product rule


    \(p(X) = \sum_Y p(X|Y)p(Y)\).


    We see that it is the sum of the numerator in Bayes'' rule over all instances
    of \(Y\). Therefore it is also sometimes referred to as the normalizing factor,
    since it ensures that


    \(\sum_Y p(Y|X) = 1\).


    The sum of probabilities over all instances always has to add to one. Lastly,
    the probability \(p(Y|X)\) quantifies our posterior belief once we have observed
    and taken into account the data. The human equivalent is revising one''s opinion
    once some experiences have been made. While many other factors influence whether
    a human revises their opinion or not (e.g., their stubbornness), Bayes'' rule
    is a mathematical process to do so. If there are different hypotheses with associated
    variables \(Y\) of explaining the data, \(p(Y|X)\) can be used to select a hypothesis.
    It is then also called the evidence. More on the Bayesian methodology can be found
    in [35], while [28] gives many examples of how the repeated application of Bayes''
    rule solved real world problems.


