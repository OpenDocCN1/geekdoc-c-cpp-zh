  md: '![](img/d3c00252180686426c9e63ab889b535b_141_0.png)


    # Figure 5.7: Support Vector Machine classification with Gaussian kernel.


    Increasing the number of parameters to be chosen is, however, better avoided.
    Instead, the training data is *standardized*. For each feature dimension, the
    training data, $\mathbf{v}_1, \dots, \mathbf{v}_N$, is shifted by the mean and
    scaled by the standard deviation. Writing $\mathbf{v}_m = (v_{1m}, \dots, v_{Nm})^T$,
    for $m = 1, \dots, M$ we calculate


    ```

    $$\mu_m = \frac{1}{N} \sum_{n=1}^N v_{nm} \text{ and } \sigma_m^2 = \frac{1}{N}
    \sum_{n=1}^N (v_{nm} - \mu_m)^2.$$

    ```


    The standardized training data is then $\tilde{\mathbf{v}}_1, \dots, \tilde{\mathbf{v}}_N$
    with


    ```

    $$\tilde{v}_{nm} = \frac{v_{nm} - \mu_m}{\sigma_m}.$$

    ```


    The research on kernels is an active field with new kernels being developed for
    specific applications. Their usefulness lies in the fact that they do not need
    to be defined over $\mathbb{R}^M \times \mathbb{R}^M$, but can be defined over
    different categories of objects. An example are string kernels [37] and graph
    kernels [32]. It all comes down to defining a suitable similarity measure between
    objects.


    The MATLAB code in Listing 5.2 applies a kernel Support Vector Machine to Fisher''s
    iris data using the Gaussian kernel. The results can be seen in Figure 5.7.'
