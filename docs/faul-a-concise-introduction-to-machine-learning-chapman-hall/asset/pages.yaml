    Note that for \(\mathbf{x} = \hat{\mathbf{x}}\), the above equation is naturally
    true. If detailed balance is satisfied, the Markov chain is called *reversible*.
    Invariance is shown by


    \(\sum_{\mathbf{x}} T(\mathbf{x}, \hat{\mathbf{x}}) f(\mathbf{x}) = \sum_{\hat{\mathbf{x}}}
    T(\hat{\mathbf{x}}, \mathbf{x}) f(\hat{\mathbf{x}}) = f(\hat{\mathbf{x}}) \sum_{\mathbf{x}}
    p(\mathbf{x} | \hat{\mathbf{x}}) = f(\hat{\mathbf{x}})\),


    since the sum over the state space of the conditional probabilities is one. The
    calculation for a continuous probability density function \(f\) uses integrals
    and is analogous.


    The transition probabilities can be constructed as linear combinations of base
    transition probabilities \(B_1, \dots, B_M\),'
