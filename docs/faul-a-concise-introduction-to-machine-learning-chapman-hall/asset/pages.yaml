- pgno: 109
  md: '# Linear Classification


    The chapter introduces linear classification as simple projections onto a linear
    subspace. It develops the idea of maximizing the separation deriving Fisher''s
    discriminant analysis and Linear Discriminant Analysis. This idea is extended
    to multiple classes. The perceptron and online learning are explained as pulling
    the separation line in different directions according to the seen data sample.
    It is shown that the perceptron is a simple neural network. Lastly, the Support
    Vector Machine is derived as maximizing the margin between classes.


    # 4.1 Features


    Distinguishing between objects is called *classification*. Already before we are
    born we learn to distinguish between different sounds in the womb, and we continue
    to learn and distinguish easily between different objects, different situations
    and different concepts. In fact, the way we differ or are similar to others is
    fundamental to our sense of self. Humans have an uncanny ability in the area of
    classification. For example, despite the variety of dog breeds and their stark
    visual differences, we still easily identify a dog as a dog. Domestic cats are
    visually much more similar to each other. A child is not told what is different
    between a cat or a dog. It is told this is a cat and that is a dog. At most it
    is told, this goes meow and that goes woof. Based on these examples it has to
    work out by itself how to distinguish between them. What are cat features and
    what are dog features? More formally, there are three different categories of
    features. *Boolean* or *binary* features can only have two values. The relate
    to questions answerable by yes or no. For example: Is it red? Is the person tall?
    Do we have a storm? *Discrete* features take *categorical* also known as *ordinal*
    values. For example: What colour is it? Is the person short, medium built or tall?
    What number is the wind force on the Beaufort scale? Lastly there are *continuous*–that
    is *real-valued* features. Here the questions answered are for example: What is'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/d3c00252180686426c9e63ab889b535b_110_0.png)


    Figure 4.1: Scatter plot of sepal length against sepal width.


    the wavelength of the colour? What is the person''s height? What is the wind speed?


    There are many examples of classification in everyday life. Spam filtering is
    an application of text categorization. Face detection in images and optical character
    recognition are examples from the field of machine vision. For businesses, market
    segmentation is of great importance, while every one of us hopes that the fraud
    detection algorithms of our credit card company are effective.


    Classification is not that new. One of the most used examples dates back to 1936
    when Ronald Fisher measured the petal length and width and the sepal length and
    width of three different species of irises, Iris setosa, iris versicolor, and
    iris virginica with 50 samples of each species. Thus there were four continuous
    features.


    In the following, we will first only consider two species, that is classes which
    we label \(C_0\) and \(C_1\). This is also known as *binary classification*. Let
    \(N_0\) be the number of samples in class \(C_0\) and \(N_1\) the number of samples
    in class \(C_1\). Hence the overall number of samples is \(N\). It is helpful
    to look at a visual representation of the data as in Figure 4.1 where we have
    chosen two features to display, sepal length and sepal width. This is known as
    a scatter plot.'
