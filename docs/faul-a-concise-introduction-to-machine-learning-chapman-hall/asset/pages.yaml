    which is parametrized by the scale parameter \(\beta\). Its inverse, \(\lambda
    = 1/\beta\), is the rate parameter. It is related to the Poisson distribution
    defined in Equation (2.8) with rate parameter \(\lambda = 1/\beta\) in that it
    describes the time between occurrences of events described by the Poisson distribution.


    The cumulative distribution function is zero for \(x < 0\) and for \(x \ge 0\)
    is given by


    ```

    F(x) = p(t \le x) = \int_{-\infty}^x \text{Exp}(t|\beta) dt = \int_0^x \frac{1}{\beta}
    \exp \left( - \frac{t}{\beta} \right) dt = 1 - \exp \left( - \frac{x}{\beta} \right).

    ```


    It gives the probability that the event has happened in this time frame. On the
    other hand, \(1 - F(x) = \exp \left( - \frac{x}{\beta} \right) = p(t > x)\) is
    the probability that the event has not occurred yet.


    Examples of the probability density function and the cumulative distribution function
    for various values of \(\beta\) are given in Figures 2.16 and 2.17 respectively.


    The probability that the waiting time is \(x+y\) given that already \(x\) amount
    of time has passed is by the product rule


    ```

    p(t > x + y | t > x) p(t > x) = p(t > x + y \text{ and } t > x) = p(t > x + y).

    ```


    Solving for \(p(t > x + y | t > x)\), we arrive at


    ```

    p(t > x + y | t > x) = \frac{p(t > x + y)}{p(t > x)} = \frac{\exp(-\frac{x+y}{\beta})}{\exp(-\frac{x}{\beta})}
    = \exp \left( - \frac{y}{\beta} \right) = p(t > y).

    ```'
