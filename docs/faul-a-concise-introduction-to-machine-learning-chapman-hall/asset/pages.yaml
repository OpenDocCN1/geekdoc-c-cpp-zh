- pgno: 316
  md: 'seen in Figure 2.2 or the Laplace distribution shown in Figure 2.18. Lastly,
    prior distributions for each of the columns of D need to be defined.


    The learning process updates the parameters of these distributions according to
    the data, and specific instances are sampled. More specifically, D is kept fixed
    while the distributions of Z and W are updated. After instances of Z and W are
    sampled, they are kept fixed and the distributions of D are updated. Several passes
    through the data are necessary.


    The process is similar to the Dirichlet process described in Section 6.7. The
    exact workings are, however, beyond the scope of this book. An introduction and
    review can be found in [19]. An example in image processing is provided by [11],
    where the building blocks making up the image are inferred from the image itself
    in contrast to engineered blocks as shown in Figure 7.1.'
