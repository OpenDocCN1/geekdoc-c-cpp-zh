- pgno: 314
  md: 'To this end, the matrix C is written in terms of a binary indicator matrix
    Z and a weight matrix W. That is


    $C = Z \odot W,$


    where $\odot$ denotes the element-wise, Hadamard product.


    The data generation is liked to customers choosing dishes from an Indian Buffet,
    hence the name Indian Buffet Process (IBP). The customers are indexed by $1, \dots,
    n, \dots, N$. There are infinitely many dishes, but not all have been chosen yet.
    These are the latent features indexed by $m$. $M$ is the number of different dishes
    chosen so far.


    The number of dishes $i_1$ the first customer chooses is drawn from a Poisson
    distribution with rate $\lambda$, which is the expected number of dishes each
    customer chooses. In matrix Z, the first $i_1$ entries of the first row are set
    to one and $M = i_1$. $M$ is the number of distinct dishes chosen so far. The
    amount he takes from each dish is recorded in the first row of matrix W.


    The $n^{th}$ customer chooses from the $M$ dishes any of the previous customers
    have already chosen with probability $j_m/n$, if dish $m$ was chosen $j_m$ times.
    In other words, $j_m$ is the number of non-zero entries in column $m$ above row
    $n^{th}$ in matrix Z. If he chooses a particular dish $m$, then a one is placed
    in the $n^{th}$ column of the $n^{th}$ row of Z. He also tries $i_n$ new dishes,
    where $i_n$ is drawn from a Poisson distribution with rate $\lambda/n$. These
    are indicated by ones in columns with numbers $M+1, \dots, M+i_n$ in the $n^{th}$
    row. $M$ is updated to $M+i_n$. Again, the amount of each dish is recorded in
    the $n^{th}$ row of W.


    Since $\lambda/n$ decreases with every new customer, the probability that he will
    choose even just one new dish decreases, but does not become zero. This means
    that if our model space does not have enough features to explain the data, there
    is a non-zero probability to create a feature which will help explain the data.


    In each row, the expected number of non-zero entries is $\lambda$. This is true
    for the first row, since the expectation of a Poisson distribution is given by
    the rate $\lambda$. Assume that the expected number of non-zero entries for rows
    $1, \dots, n-1$ is $\lambda$. The expected number nonzero entries in the $n^{th}$
    row is


    $$

    \begin{aligned}

    \mathbb{E}[\sum_{m=1}^M \frac{j_m}{n}] + \frac{\lambda}{n} &= \frac{1}{n} \mathbb{E}[\sum_{m=1}^M
    \sum_{k=1}^{n-1} Z_{km}] + \frac{\lambda}{n} \\

    &= \frac{1}{n} \sum_{k=1}^{n-1} \mathbb{E}[\sum_{m=1}^M Z_{km}] + \frac{\lambda}{n}
    \\

    &= \frac{(n-1)\lambda}{n} + \frac{\lambda}{n} = \lambda,

    \end{aligned}

    $$


    where $Z_{km}$ denotes the $(k, m)$ entry in matrix Z. By induction, this proves
    that the expected number of non-zero entries in each row is $\lambda$.


    Since the probability of choosing a particular dish depends on the number of times
    it has been the choice of any of the previous customers, we again'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'encounter the rich-get-richer phenomenon. Since the number of customers \(N\)
    is finite, so is the final number of sampled dishes \(M\). Those chosen by many
    customers relate to features which are common in most of the data samples. These
    are sometimes referred to as *global features*, while those dishes chosen only
    by a few customers indicate *local features*, which can be used to distinguish
    between data samples.


    This process of generating the data is independent of the order the customers
    arrive. A different order of customers means multiplying \(\mathbf{Z}\) by a permutation
    matrix from the left which changes the row order. We follow this up with a permutation
    matrix from the right which swaps columns so that the number of leading zeros
    in each column is increasing from left to right, because each subsequent customer
    can choose new dishes. Such a permutation is equivalent to relabeling the dishes.
    The matrix of weights \(\mathbf{W}\) is multiplied by the same permutation matrices
    from left and right as \(\mathbf{Z}\). These permutations are not performed explicitly,
    but serve to explain that the choice of order in which samples are generated does
    not influence the final outcome.


    The previous paragraph indicates a preferred order of dishes. More specifically,
    given an order of customers (rows of \(\mathbf{Z}\)), the columns of \(\mathbf{Z}\)
    are ordered using their binary nature. Each customer is interpreted as a binary
    number with the most significant bit in the first row and the least significant
    one in the last. The columns are ordered in decreasing magnitude of these binary
    numbers. Two columns might represent exactly the same binary number. This means
    two dishes were chosen by exactly the same set of customers. In this case, we
    have freedom of choice in the order of the columns representing the same binary
    number. This is known as *left-ordering of binary matrices*.


    There are \(M!\) possible labelings of the dishes. We need to divide this by the
    number of possible equivalences. Let \(K\) be the number of distinct columns and
    let \(m_k\) be the number of occurrences of the distinct column \(k\) for \(k
    = 1, 2, ..., K\). That is


    \(M = \sum_{k=1}^K m_k.\)


    The number of possible equivalences in relabeling is


    \(\prod_{k=1}^K m_k!.\)


    Hence the number of different ways the same data can have been generated is


    \(\frac{M!}{\prod_{k=1}^K m_k!}.\)


    The above describes a prior distribution \(p(\mathbf{Z})\). Also a prior distribution
    for \(\mathbf{W}\) needs to be specified. This is done by specifying distributions
    for the elements of \(\mathbf{W}\). Possible choices are, for example, the normal
    distribution as'
  merge: -1
