- pgno: 114
  md: '![](img/d3c00252180686426c9e63ab889b535b_114_0.png)


    Figure 4.4: Separation by line and 95 vertical to the connection between the sample
    means and 95% confidence ellipses.


    is the covariance between the \(j^{th}\) and \(k^{th}\) feature of samples in
    class \(C_1\). The covariance describes how much different features influence
    each other. The covariance matrix is in general *positive definite*, since


    ```

    \(\vec{v}^T \Sigma \vec{v} = \frac{1}{N_i} \sum_{v \in C_i} \vec{v}^T (v - \mu_i)
    (v - \mu_i)^T \vec{v} = \frac{1}{N_i} \sum_{v \in C_i} [(v - \mu_i)^T \vec{v}]^2
    \ge 0.\)

    ```


    It is unlikely that the sum of squares equals zero, since this means that all
    samples shifted by the mean lie in a space orthogonal to \(\vec{v}\). In this
    case, one of the dimensions of the feature space is redundant, and dimensionality
    reduction should be performed first. Positive definiteness implies that the matrix
    is non-singular and can be inverted, a property which we will use later.


    Let \(\mathbf{w}\) be the direction of the line of projection. The location of
    the line of projection can be neglected, since it cancels in the calculations.
    The mean of the projected samples in class \(C_i\) is given by \(\mathbf{w}^T
    \mu_i\), while the variance of the projected samples in class \(C_i\) is given
    by \(\mathbf{w}^T \Sigma_i \mathbf{w}\). We seek \(\mathbf{w}\) such that


    ```

    \(\|\mathbf{w}^T \mu_0 - \mathbf{w}^T \mu_1\|^2 = \mathbf{w}^T (\mu_0 - \mu_1)
    (\mu_0 - \mu_1)^T \mathbf{w}\)

    ```


    is as large as possible. That is the projected means are as far apart as possible.
    This is known as the *between-class scatter* of the projected samples. At the
    same time, we want


    ```

    \(\mathbf{w}^T \Sigma_0 \mathbf{w} + \mathbf{w}^T \Sigma_1 \mathbf{w} = \mathbf{w}^T
    (\Sigma_0 + \Sigma_1) \mathbf{w}\)

    ```'
