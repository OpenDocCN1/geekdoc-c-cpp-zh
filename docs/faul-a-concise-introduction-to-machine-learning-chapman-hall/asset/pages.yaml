  md: 'The square of the correlation between t and the new regressor Dz is


    ```

    \left( \frac{t^T Dz}{||t|| ||Dz||} \right)^2 = \frac{1}{||t||^2} z^T D^T t t^T
    D z = \frac{1}{||t||^2} (\lambda_1 \tilde{z}_1^2 + ... + \lambda_M \tilde{z}_M^2).

    ```


    This is maximal for \tilde{z}_2 = ... = \tilde{z}_M = 0, since the length of z
    is fixed by the condition ||Dz|| = 1. Thus the first new regressor is t_1 = Dv_1
    / ||Dv_1||. We know that Dv_1 != 0, since otherwise D^T t t^T D would only have
    zero eigenvalues, since \lambda_1 is the largest of the non-negative eigenvalues.
    Having generated t_1, we calculate,


    ```

    D_1 = (I - t_1 t_1^T) D.

    ```


    # Note


    ```

    D_1 v_1 = (I - t_1 t_1^T) D v_1 = (I - t_1 t_1^T) ||D v_1|| t_1 = ||D v_1|| (1
    - ||t_1||^2) t_1 = 0.

    ```


    This implies that the rank of D_1 is less than the rank of D, because a vector
    (v_1) which previously was not mapped to zero, now is mapped to zero.


    Now, let v_2 with ||v_2|| = 1 be the eigenvector corresponding to the largest
    eigenvalue of D_1^T t t^T D_1. The second new regressor is t_2 = D_1 v_2 normalized
    such that ||t_2|| = 1. Again the correlation is maximal.


    ```

    D_2 = (I - t_2 t_2^T) D_1,

    ```


    and the process continues until D_r is a null matrix, i.e. its rank is zero. This
    will be achieved, since D_j maps v_j to zero, but D_{j-1} v_j is non-zero, and
    hence rank(D_j) <= rank(D_{j-1}) - 1.


    PLS can be used for multivariate regression; that is the regressand has multiple
    components and measuring at x_1, ..., x_N gives rise to a matrix t with N rows.
    However, this is beyond this text. More information can be found in [20].


    # 8.10 Regularization


    Recall, we are trying to find suitable coefficients c minimizing ||t - Dc||^2
    while avoiding unnecessary complexity which leads to over-fitting. This is achieved
    by introducing a penalty term \Omega(c) and minimizing


    ```

    \frac{1}{2} ||t - Dc||^2 + \lambda \Omega(c),

    ```


    where \Omega(c) >= 0 for all c and \Omega(0) = 0.


    The penalty \Omega(c) is also known as the entropy measure. The parameter \lambda
    controls the trade-off between fitting the data and reducing complexity and has
    to be chosen well. Often, a model is obtained for different choices of \lambda,
    and the goodness of the model is assessed on a validation set. Note that if'
  merge: -1
  img_proc: true
- pgno: 255
  md: '$\lambda = 0$, we obtain the ordinary least squares solution, while if $\lambda
    = \infty, \mathbf{c} = 0$. The zero vector of coefficients is the least complex
    one. For $\lambda$ in between these two extremes, we are balancing between fitting
    a linear model and keeping the model complexity small. Note that we still explore
    the same model space as before, but the inclusion of $\Omega(\mathbf{c})$ gives
    preference to certain areas of the model space. The parameter $\lambda$ controls
    how strong this preference is.


    In the following, norms which are different to the Euclidean norm ($L_2$ norm)
    are distinguished by subscripts. The choices for $\Omega(\mathbf{c})$ are numerous:


    | $\Omega(\mathbf{c})$ | Regression method |

    | :--- | :--- |

    | $\|\mathbf{c}\|_0 = \text{number of nonzero elements in } \mathbf{c}$ | $L_0$
    regularization |

    | $\|\mathbf{c}\|_1 = \sum_{m=1}^M |c_m|$ | $L_1$ regularization Least Absolute
    Shrinkage and Selection Operator (LASSO) |

    | $\frac{1}{2}\|\mathbf{c}\|^2 = \frac{1}{2} \sum_{m=1}^M c_m^2$ | $L_2$ regularization
    Ridge regression |

    | $\lambda\|\mathbf{c}\|_1 + \frac{1-\lambda}{2}\|\mathbf{c}\|^2$ | Elastic net
    regularization |


    $L_0$ regularization is an $NP$ hard problem. This means there is no known algorithm
    to solve this in polynomial time. The aim of $L_0$ regularization is to arrive
    at a sparse vector of coefficients, i.e. a vector where many entries are zero.
    That is only a few components of $\mathbf{c}$ are non-zero. If it is known that
    $\mathbf{c}$ is 1-sparse, i.e. only one component is non-zero, we have $\binom{M}{1}$
    possibilities and each needs to be checked whether it is the minimum. Similarly,
    if we know $\mathbf{c}$ is $k$-sparse, $\binom{M}{k}$ possibilities need to be
    checked. However, we do not know beforehand how many components are non-zero.
    Hence, all $M$ possible values for $k$ need to be checked. The resulting complexity
    is


    \(\sum_{k=1}^M \binom{M}{k} = 2^M - 1.\)


    Since the size of the problem, $M$, appears in the exponent, the complexity is
    exponential. The time to find the solution increases exponentially with the size
    of the input. We encounter a different method to get a sparse solution when looking
    at Bayesian Learning in Section 8.13.


    The $L_0$ regularization is related to the Bayesian Information Criterion (BIC)
    and the Akaike Information Criterion (AIC). These criteria are used to select
    the model structure, $k$ being the model parameter to be selected. For more information
    see [9].'
