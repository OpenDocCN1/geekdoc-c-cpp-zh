- pgno: 193
  md: 'This can be viewed without involving the latent variables z_n. Imagine a distribution
    G over the set of all possible pairs of (μ, Σ) which can be generated from G_0.
    Since there is only a finite number of clusters, G is zero everywhere apart from
    the specific pairs (μ_k, Σ_k) where it has a point probability mass of π_k.


    Using this distribution G, the generation of data can be described as:


    ```

    \mathbf{v}_n \sim \mathcal{N}(\mu_k, \Sigma_k)

    \pi \sim \text{Dir}(\alpha),

    \mu_k, \Sigma_k \sim G.

    ```


    The base distribution G_0 is indirectly part of the distribution G, since the
    points where G is nonzero are drawn from G_0, while the probability masses at
    these points are drawn from Dir(α).


    Having explored the way the data is generated, we now look at inferring the cluster
    membership from the data. First, let D = {v_1, ..., v_N} be a set of data samples
    drawn from a multivariate normal distribution with mean μ and covariance matrix
    Σ, where μ and Σ are themselves drawn from a normal inverse Wishart distribution.
    We assume a prior normal inverse Wishart distribution with parameters m, λ, Ψ
    and ν. The posterior is also a normal inverse Wishart distribution. Let


    ```

    \bar{\mathbf{v}} = \frac{1}{N} \sum_{n=1}^N \mathbf{v}_n

    ```


    be the sample mean and


    ```

    \mathbf{S} = \sum_{n=1}^N (\mathbf{v}_n - \bar{\mathbf{v}})(\mathbf{v}_n - \bar{\mathbf{v}})^T

    ```


    the scaled sample covariance matrix. The posterior then has parameters


    ```

    \mathbf{m}^{\text{post}} = \frac{\lambda \mathbf{m} + N \bar{\mathbf{v}}}{\lambda
    + N},

    \lambda^{\text{post}} = \lambda + N,

    \nu^{\text{post}} = \nu + N,

    \Psi^{\text{post}} = \Psi + \mathbf{S} + \frac{\lambda N}{\lambda + N}(\bar{\mathbf{v}}
    - \mathbf{m})(\bar{\mathbf{v}} - \mathbf{m})^T.

    ```


    In particular, if N = 1, we have one single data point v and \bar{v} = v and S
    = 0. With this,


    ```

    \mathbf{m}^{\text{post}} = \frac{\lambda \mathbf{m} + \mathbf{v}}{\lambda + 1},

    \lambda^{\text{post}} = \lambda + 1,

    \nu^{\text{post}} = \nu + 1,

    \Psi^{\text{post}} = \Psi + \frac{\lambda}{\lambda + 1}(\mathbf{v} - \mathbf{m})(\mathbf{v}
    - \mathbf{m})^T. \tag{6.11}

    ```'
