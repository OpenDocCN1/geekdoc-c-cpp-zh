  md: '# # Dimensionality Reduction


    While samples can be described by many features, the ones which essentially define
    the sample are often few, the many features being expressions of the few in different
    ways. The chapter explores techniques to find these starting with Principal Component
    Analysis introducing it as geometric concept. It then takes a probabilistic viewpoint
    maximizing the likelihood of the data arriving at the same conclusion. The Expectation-Maximization
    algorithm is shown to be an alternative method to maximize the data likelihood.
    The method is generalized to factor analysis. Lastly, kernel principal component
    analysis tackles data samples lying on a non-linear manifold.


    In the previous chapters, the features were taken as given. The kernel trick was
    introduced through a mapping of the feature space to a higher dimensional space,
    where the data samples are more easily separable. This higher dimensional space
    can be viewed as creating new features from the given, by combining them in some
    way. Often as, however, the data samples lie in a lower dimensional set of the
    feature space.


    For example in an 8-bit gray scale image, each pixel has a value between 0 (black)
    and 255 (white). A standard sized image of 1280 by 720 pixels therefore is encoded
    in 921,600 bytes or approaching one megabyte. The human visual system is, however,
    not too fussed over exact details. Or in other words, humans are quite well adapted
    to interpret missing information in an image. The Joint Photographic Experts group
    (JPEG) used this fact in 1992 to create a standard for lossy image compression.


    The image is first divided into 8 x 8 blocks. For the example size above, this
    results into 14,400 blocks. Instead of storing 64 pixel values for each block,
    each block is built by overlaying blocks from Figure 7.1 with appropriate weights.
    The weights are only allowed to have integer values. Many weights will be zero,
    because few blocks in the image will have high variations; most'
