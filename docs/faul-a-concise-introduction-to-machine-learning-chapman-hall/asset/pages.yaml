- pgno: 145
  md: 'the feature is continuous, the decision is based on the question of whether
    the value is larger or smaller than a threshold. The sample traverses the tree
    down to a leaf. Each leaf is associated with a class. Hence, the sample is assigned
    the class of the leaf it ends up in.


    Decision trees are grown recursively from a training set. There are many possible
    ways the tree can grow. At each node, the set of training samples which reached
    that node is split in two. Each of the two subsets is passed down one of the branches
    to the child nodes. At each node, we need to choose the feature on which to base
    the split, and the threshold. To do so all possible splits for every feature are
    considered, and the optimal split is selected. The optimality is based on different
    possible criteria.


    Before we discuss the criteria, we need to introduce some notation. Let $t = P,
    L$, or $R$ refer to quantities relating to the parent, left or right child node
    respectively. For example, $N_P$ is the number of samples reaching the parent
    node, while $N_L$ and $N_R$ are the number of samples reaching the left and right
    child nodes. Let $N_{tk}$, be the number of samples in class $k$, where $k = 1,
    \dots, K$, reaching node $t$. We define $p_{tk}$ as the portion of samples belonging
    to class $k$ at node $t$. That is


    $p_{tk} = \frac{N_{tk}}{N_t},$


    and we have


    $\sum_{k=1}^K p_{tk} = 1.$


    The proportions of the parent node are related to the proportions of the child
    nodes in the following way:


    $p_{Pk} = \frac{N_{Pk}}{N_P} = \frac{N_{Lk} + N_{Rk}}{N_P} = \frac{N_L p_{Lk}
    + N_R p_{Rk}}{N_P}.$ (5.2)


    A node is called *pure*, if it only contains samples of one class. This naturally
    becomes a leaf. However, not all leaves are pure nodes, since a tree where the
    number of samples per leaf is low is likely to over-fit the data and not generalize
    well to unseen data. Therefore, in a leaf with samples from a mixture of classes,
    some training samples will be misclassified.


    We define the node *impurity* $i(t)$ as a function of class proportions


    $i(t) = \phi(p_1, \dots, p_k).$


    We will discuss later the specific choices for $\phi$. A good decision split should
    optimize the purity, or in other words minimize the impurity. Since the two child
    nodes can differ in size, we define the change in impurity $\Delta i$ as the impurity
    of the parent node minus the weighted average of the impurities of the child nodes:


    $\Delta i = i(P) - \left( \frac{N_L}{N_P} i(L) + \frac{N_R}{N_P} i(R) \right).$'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/d3c00252180686426c9e63ab889b535b_146_0.png)


    # Figure 5.9: Different node impurities for two classes.


    The best possible split maximizes the change in impurity over all possible splits
    for all features. If no splits, where the change is positive, are possible, the
    node is not split and it becomes a leaf.


    Before considering specific choices for $\phi$, it needs to have certain properties.
    The impurity should be zero, if only one class is present. That is $i(t) = 0$,
    if and only if $p_{tk} = 1$ for some $k$, and zero for all others. On the other
    hand, the impurity should be maximal, when all classes are mixed in equal proportions,
    i.e. $p_{t1} = \dots = p_{tK} = 1/K$. It should also be symmetric, if the classes
    are re-labeled.


    One popular choice for the impurity $i(t) = \phi(p_{t1}, \dots, p_{tK})$ is the
    *Gini Diversity Index (gdi)*


    ```

    $$i(t) = \sum_{k=1}^K p_{tk}(1 - p_{tk}) = 1 - \sum_{k=1}^K p_{tk}^2,$$

    ```


    since $\sum_{k=1}^K p_{tk} = 1$. It vanishes, if $p_{tk} = 1$ for some $k$, and
    zero for all others. Figure 5.9 shows, for two classes, $i(t)$ as function of
    $p_{t1}$ (or equivalently $p_{t2} = 1 - p_{t1}$).'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'With this choice, the change in impurity is


    ```

    \Delta i = \left( 1 - \sum_{k=1}^K p_{Pk}^2 \right) - \frac{N_L}{N_P} \left( 1
    - \sum_{k=1}^K p_{Lk}^2 \right) - \frac{N_R}{N_P} \left( 1 - \sum_{k=1}^K p_{Rk}^2
    \right)

    = \sum_{k=1}^K \frac{N_R}{N_P} p_{Rk}^2 + \frac{N_L}{N_P} p_{Lk}^2 - p_{Pk}^2
    ,

    ```


    where we used \(N_L + N_R = N_P\). Inserting (5.2), gives


    ```

    \Delta i = \sum_{k=1}^K \frac{N_R}{N_P} p_{Rk}^2 + \frac{N_L}{N_P} p_{Lk}^2 -
    \frac{(N_L p_{Lk} + N_R p_{Rk})^2}{N_P^2}

    = \frac{1}{N_P^2} \sum_{k=1}^K N_R N_L (N_L + N_R) p_{Rk}^2 + N_L (N_L + N_R)
    p_{Lk}^2 - N_L^2 p_{Lk}^2 - 2 N_L N_R p_{Lk} p_{Rk} - N_R^2 p_{Rk}^2

    = \frac{N_R}{N_P} \frac{N_L}{N_P} \sum_{k=1}^K (p_{Lk} - p_{Rk})^2 .

    ```


    We see that, if the proportions in the child nodes are similar to each other,
    then the change in impurity will be small. If, however, the proportions are quite
    different, then \(\Delta i\) will be large.


    Similar to this, another possibility known as *twoing* chooses the split which
    maximizes


    ```

    \Delta i = \frac{N_L N_R}{N_P N_P} \left( \sum_{k=1}^K |p_{Lk} - p_{Rk}| \right)^2
    .

    ```


    It is commonly used if there are many classes, i.e. \(K\) is large.


    Another choice for \(i(t)\) is the *deviance*, also known as *cross-entropy*


    ```

    i(t) = - \sum_{k=1}^K p_{tk} \log p_{tk} .

    ```


    It is also plotted in Figure 5.9. In this case, we have


    ```

    \Delta i = - \sum_{k=1}^K p_{Lk} \log p_{Lk} + \frac{N_L}{N_P} \sum_{k=1}^K p_{Lk}
    \log p_{Lk} + \frac{N_R}{N_P} \sum_{k=1}^K p_{Rk} \log p_{Rk} .

    ```


    Using \(p_{tk} = N_{tk} / N_t\) and \(N_{Pk} = N_{Lk} + N_{Rk}\), this can be
    rewritten as


    ```

    \Delta i = \frac{1}{N_P} \sum_{k=1}^K N_{Lk} \log \frac{p_{Lk}}{p_{Pk}} + N_{Rk}
    \log \frac{p_{Rk}}{p_{Pk}} .

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'If the proportions in the child nodes remain similar to the proportions in
    the parent node, then the change in impurity will be small, since the fractions
    are close to one and the logarithms evaluate to zero there. If, however, the proportions
    are dissimilar to the ones in the parent node, and especially if they are close
    to zero or one, then \(\Delta i\) is larger.


    One might consider the node error as a possibility for \(i(t)\). If a node is
    assigned the class with the largest proportion of training samples at that node,
    the node error is the fraction of misclassified samples:

    \(i(t) = 1 - \max_k pp_k.\)


    Figure 5.9 illustrates this graphically. Comparing the graphs of the \(gdi\),
    \(deviance\) and \(node\) \(error\), nodes where the classes have similar parity
    are considered as more impure under \(gdi\) and \(deviance\) than under the \(node\)
    \(error\). This has the effect that the \(node\) \(error\) does not result in
    a preference to create purer child nodes. To see this, consider

    \(\Delta i = (1 - \max_k pp_k) - \frac{N_L}{N_p}(1 - \max_k pl_k) - \frac{N_R}{N_p}(1
    - \max_k pr_k)\)

    \(= 1 - \max_k \frac{N_{Pk}}{N_p} - \frac{N_L}{N_p} + \frac{N_L}{N_p} \max_k \frac{N_{Lk}}{N_L}
    - \frac{N_R}{N_p} + \frac{N_R}{N_p} \max_k \frac{N_{Rk}}{N_R}\)

    \(= \frac{1}{N_p} \left( \max_k N_{Lk} + \max_k N_{Rk} - \max_k N_{Pk} \right),\)


    where we used \(N_L + N_R = N_p\). Thus, the change in impurity is solely dependent
    on the sum of the numbers of largest classes in the child nodes. This number can
    be kept constant for different splits, while the purity of the child nodes is
    very different. [5] gives a number example: Suppose there are only two classes
    and at the parent node they have equal parity, \(N_{P1} = N_{P2} = 400\). One
    possible split is \(N_{L1} = 100, N_{L2} = 300, N_{R1} = 300, N_{R2} = 100\),
    while another one is \(N_{L1} = 200, N_{L2} = 400, N_{R1} = 200, N_{R2} = 0\).
    Both result in \(\Delta i = (600 - 400)/800 = 1/4\). However, the second split
    is preferable, since there the right node is pure, and thus a leaf. For the first
    split, both child nodes are impure and need to grow branches.


    Figure 5.10a shows our previous example where the region is this time classified
    by a decision tree. Figure 5.10b displays the corresponding decision tree. Each
    node corresponds to a split of a certain region. The first node splits the entire
    region along a vertical line at 2.45. The region to the right of this line is
    then split along a horizontal line at 1.75. The last node splits the region below
    this line and to the right of the first line vertically at 4.95. It can be seen
    that this decision tree could be improved by letting the horizontal split be slightly
    lower, at 1.65 say. This would result in the one misclassified virginica sample
    being classified correctly.


    The depth of decision trees is controlled by three parameters: the maximum number
    of allowed branch node splits, the minimum number of samples needed in a node
    which is split, and the minimum number of samples per leaf node. In the example
    in Figure 5.10 the minimum number of samples in a leaf node'
