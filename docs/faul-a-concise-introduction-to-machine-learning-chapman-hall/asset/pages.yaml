    $$ \sigma^2_{\text{new}} = \frac{1}{ND} \sum_{n=1}^N \left[ \|\mathbf{v}_n - \boldsymbol{\mu}\|^2
    - \mathbb{E}[\mathbf{u}_n]^T \mathbf{W}_{\text{new}}^T (\mathbf{v}_n - \boldsymbol{\mu})
    \right] = \frac{1}{ND} \sum_{n=1}^N (\mathbf{v}_n - \boldsymbol{\mu} - \mathbf{W}_{\text{new}}
