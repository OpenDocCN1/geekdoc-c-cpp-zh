  md: 'Thus the data samples can be considered one at a time and the posterior is
    calculated sequentially.


    However, the above does not consider the probabilities of a sample belonging to
    a particular cluster which are governed by a Dirichlet prior distribution with
    parameter \(\alpha = (\alpha/K, \dots, \alpha/K)^T\). We start with a random assignment
    of the indicator variables \(\mathbf{z}_1, \dots, \mathbf{z}_N\). For each individual
    cluster \(k\), we let \(N_k\) be the number of samples in it with this particular
    assignment. We then calculate the parameters \(\mathbf{m}_k, \lambda_k, \Psi_k\)
    and \(\nu_k\) of the posterior, normal, inverse Wishart distribution for each
    cluster and draw \(\mu_k\) and \(\Sigma_k\) from this distribution.


    Gibbs sampling is used to reassign samples to clusters in a random order. To this
    end, a random sample \(\mathbf{v}_n\) is selected. Let \(l\) be its current cluster
    assignment. Consider the data set without this sample, \(\mathcal{D} \setminus
    \{\mathbf{v}_n\}\). It needs to be removed from cluster \(l\) by returning to
    the prior parameters of the normal, inverse Wishart distribution for the \(l^{th}\)
    cluster. Using (6.11) backwards, we see that


    ```

    \begin{aligned}

    \mathbf{m}_l^{\text{prior}} &= \frac{\lambda_l \mathbf{m}_l - \mathbf{v}_n}{\lambda_l
    - 1}, \\

    \lambda_l^{\text{prior}} &= \lambda_l - 1, \\

    \nu_l^{\text{prior}} &= \nu_l - 1, \\

    \Psi_l^{\text{prior}} &= \Psi_l - \frac{\lambda_l}{\lambda_l - 1}(\mathbf{v}_n
    - \mathbf{m}_l)(\mathbf{v}_n - \mathbf{m}_l)^T.

    \end{aligned}

    ```


    Note that this is independent of the order, in which samples were assigned clusters.
    A new mean \(\mu_l\) and covariance matrix \(\Sigma_l\) are drawn from this distribution,
    and \(N_l\) is replaced by \(N_l - 1\).


    We calculate for \(k = 1, \dots, K\) the probabilities that \(\mathbf{v}_n\) belongs
    to cluster \(k\) given all the other data samples and their assignments,


    ```

    \begin{aligned}

    p(z_{n,k} = 1 | \mathbf{v}_n, \mathcal{D} \setminus \{\mathbf{v}_n\}, \alpha,
    \mathbf{m}, \lambda, \Psi, \nu) = \\

    p(z_{n,k} = 1 | \mathcal{D} \setminus \{\mathbf{v}_n\}, \alpha) p(\mathbf{v}_n
    | \mathcal{D} \setminus \{\mathbf{v}_n\}, z_{n,k} = 1, \mathbf{m}, \lambda, \Psi,
    \nu)

    \end{aligned}

    ```


    following the product rule. Here \(\mathcal{D} \setminus \{\mathbf{v}_n\}\) means
    the set of samples as well as their assignments.


    The first factor is the probability of \(\mathbf{v}_n\) belonging to cluster \(k\)
    which is governed by the posterior Dirichlet distribution, given the prior Dirichlet
    distribution and all other cluster assignments. From the discussion about conjugate
    distributions leading to equation (6.23), this is


    ```

    \(\frac{N_k + \alpha/K}{N - 1 + \alpha}.\)

    ```


    The second factor in (6.12) is the likelihood of seeing sample \(\mathbf{v}_n\)
    given \(\mathcal{D} \setminus \{\mathbf{v}_n\}, z_{n,k} = 1\), and the parameters
    of the posterior, normal, inverse Wishart distribution for this cluster. This
    is approximated by the normal distribution with mean \(\mu_k\) and covariance
    matrix \(\Sigma_k\). Hence, \(p(\mathbf{v}_n | \mathcal{D} \setminus \{\mathbf{v}_n\},
    z_{n,k} = 1, \mathbf{m}, \lambda, \Psi, \nu)\) is approximately


    ```

    \(\frac{1}{\sqrt{|2\pi \Sigma_k|}} \exp \left( \frac{1}{2} (\mathbf{v}_n - \mu_k)^T
    \Sigma_k^{-1} (\mathbf{v}_n - \mu_k) \right)\)

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: '```

    function [idx,MU, SIGMA] = InferBayesianMixture(V, K,alpha,m,...

    lambda,Psi,nu,iter)

    % Input:

    % V: data

    % K: number of clusters

    % alpha: prior concentration parameter,

    % m: prior location vector,

    % lambda: prior mean fraction,

    % Psi: prior inverse scale matrix,

    % nu: prior degrees of freedom,

    % iter: number of iterations

    % Output:

    % idx: index vector of cluster assignments,

    % MU: array of the means sampled from the posterior normal

    % Wishart distributions for each cluster,

    % SIGMA: array of the inverse Wishart distributions sampled from the posterior

    % normal inverse Wishart distributions for each cluster.

    %

    N = size(V,1);

    % Start with random cluster assignments.

    idx = randi([1,K],n);

    % For each cluster store its size, posterior location vector,

    % posterior mean fraction, posterior inverse scale matrix,

    % degrees of freedom.

    nk = zeros(1,K);

    M = zeros(2,K);

    LAMBDA = zeros(1,K);

    PSI = zeros(2,2,K);

    NU = zeros(1,K);

    % For each cluster store a draw from the posterior normal,

    % inverse Wishart distribution.

    SIGMA = zeros(2,2,K);

    MU = zeros(2,K);

    % For each cluster initialize these for the initial random cluster

    % assignments and draw MU and SIGMA from that posterior normal,

    % inverse Wishart distribution.

    for k=1:K

    v = V(idx == k,:);

    nk(k) = size(v,1);

    sampleM = mean(v);

    sampleS = (nk(k)-1) * cov(v);

    M(:,k) = (lambda*m(:,1) + nk(k)*sampleM(:))/(lambda + nk(k));

    LAMBDA(k) = lambda + nk(k);

    PSI(:,:,k) = sampleS + ...

    lambda*nk(k)*(sampleM - m(:,1))''*(sampleM - m(:,1)) ...

    % Store Cholesky factorization to maintain positive definiteness.

    PSI(:,:,k) = chol(PSI);

    NU(k) = nu + nk(k);

    SIGMA(:,:,k) = iwishrnd(PSI(:,:,k) * PSI(:,:,k), NU(k));

    MU(:,k) = mvnrnd(M(:,k),SIGMA(:,:,k)/LAMBDA(k));

    end

