  md: 'Again an estimator for \(\mu\) can be found by maximizing the likelihood, or
    equivalently its logarithm. However, this task is not as straight-forward as before,
    since \(\mu\) has to satisfy the constraints


    \(\sum_{k=1}^K \mu_k = 1 \quad \text{and} \quad 0 \le \mu_k \le 1, k=1, \dots,
    K.\)


    hence the task is a constraint optimization.


    Let \(i\) be any index in \(\{1, \dots, K\}\). We incorporate the first constraint
    by noting


    \(\mu_i = 1 - \sum_{k=1, k \neq i}^K \mu_k.\)


    With this modification, the log likelihood is


    \(\log p(\mathcal{D}|\mu) = \sum_{k=1}^K m_k \log \mu_k + m_i \log \left( 1 -
    \sum_{k=1, k \neq i}^K \mu_k \right).\)


    Let \(j \neq i\) be any other index. The parameter \(\mu_j\) appears in both sums,
    and the derivative with respect to \(\mu_j\) is


    \(\frac{d}{d\mu_j} \log p(\mathcal{D}|\mu) = \frac{m_j}{\mu_j} - \frac{m_i}{1
    - \sum_{k=1, k \neq i}^K \mu_k} = \frac{m_j}{\mu_j} - \frac{m_i}{\mu_i}.\)


    Setting to zero, we see that the ratio of \(\mu_i\) to \(\mu_j\) has to be the
    same as the ratio of \(m_i\) to \(m_j\). Since \(i\) and \(j\) were freely chosen,
    the ratio of any pair of components of \(\mu\) must be the same as the ratio of
    the corresponding pair in \(\mathbf{m} = (m_1, \dots, m_k)^T\). The only possible
    choice for \(\mu_k\), which also satisfies the second constraint, is the maximum
    likelihood estimator


    \(\mu_k = \frac{m_k}{m_1 + \dots + m_K} = \frac{m_k}{N}, \quad k=1, \dots, K.\)


    As before, this can be a poor estimate, if \(N\) is not large enough.


    Constraint optimization problems occur often in machine learning. A general technique
    uses *Lagrange multipliers*, which we will encounter in Section 4.6. For more
    background knowledge on optimization see [2].


    The vector \(\mu\) of the probabilities of different outcomes needs to be estimated.
    The Dirichlet distribution \(\text{Dir}(\mu|\alpha)\) is chosen as conjugate prior
    for \(\mu\), where \(\alpha\) is suitably chosen. The posterior density function
    is proportional to the product of the likelihood and the prior (which is the joint
    distribution):


    \(f(\mu|\mathbf{m}, \alpha) \propto \prod_{k=1}^K \mu_k^{m_k + \alpha_k - 1},\)'
