  md: '# 6.4 Expectation-Maximization


    In this section we introduce a more general technique to maximize


    ```

    $$\mathcal{L} = \sum_{n=1}^N \log p(\mathbf{v}_n) = \sum_{n=1}^N \log \left( \sum_{k=1}^K
    \pi_k p_k(\mathbf{v}_n) \right).$$

    ```


    We start by considering the update formulae (6.7), (6.8) and (6.5) for \(\boldsymbol{\mu}_k,
    \boldsymbol{\Sigma}_k\) and \(\pi_k\) in the case of Gaussian mixtures. Maximizing
    the function


    ```

    $$\begin{aligned}\widehat{\mathcal{L}} &= \sum_{n=1}^N \sum_{k=1}^K p(z_{n,k}=1|\mathbf{v}_n)
    [\log \pi_k + \log p_k(\mathbf{v}_n)] \\&= \sum_{n=1}^N \sum_{k=1}^K p(z_{n,k}=1|\mathbf{v}_n)
    \left[ \log \pi_k - \frac{1}{2} \log |2\pi \boldsymbol{\Sigma}_k| \right. \\\quad
    \left. - \frac{1}{2} (\mathbf{v}_n - \boldsymbol{\mu}_k)^T \boldsymbol{\Sigma}_k^{-1}
    (\mathbf{v}_n - \boldsymbol{\mu}_k) \right]\end{aligned}$$

    ```


    with respect to \(\boldsymbol{\mu}_k, \boldsymbol{\Sigma}_k\) and \(\pi_k\) subject
    to the constraint that the mixing coefficients sum to one, arrives at the same
    update formulae.


    To see this, we consider first the derivatives.


    ```

    $$\begin{aligned}\frac{\partial}{\partial \boldsymbol{\mu}_k} \widehat{\mathcal{L}}
    &= \sum_{n=1}^N p(z_{n,k}=1|\mathbf{v}_n) \boldsymbol{\Sigma}_k^{-1} (\mathbf{v}_n
    - \boldsymbol{\mu}_k), \\\frac{\partial}{\partial \boldsymbol{\Sigma}_k} \widehat{\mathcal{L}}
    &= -\frac{1}{2} \sum_{n=1}^N p(z_{n,k}=1|\mathbf{v}_n) \left[ \boldsymbol{\Sigma}_k^{-1}
    - \boldsymbol{\Sigma}_k^{-1} (\mathbf{v}_n - \boldsymbol{\mu}_k) (\mathbf{v}_n
    - \boldsymbol{\mu}_k)^T \boldsymbol{\Sigma}_k^{-1} \right],\end{aligned}$$

    ```


    employing Appendices A.2.3, A.2.4 and A.2.8. Setting these to zero and solving
    for \(\boldsymbol{\mu}_k\) and \(\boldsymbol{\Sigma}_k\) respectively gives the
    update formulae for those parameters.


    To find an optimal value for \(\pi_k\), we need to introduce a Lagrange multiplier.


    ```

    $$\frac{\partial}{\partial \pi_k} \left[ \widehat{\mathcal{L}} + \lambda \left(
    \sum_{k=1}^K \pi_k - 1 \right) \right] = \sum_{n=1}^N p(z_{n,k}=1|\mathbf{v}_n)
    \frac{1}{\pi_k} + \lambda.$$

    ```


    To find \(\lambda = -N\), we set the derivative to zero, multiply through by \(\pi_k\)
    and sum over \(k\), using the fact that both the responsibilities for a particular
    sample and the mixing coefficients sum to 1. The update formula for \(\pi_k\)
    follows directly then.


    How are the objective functions \(\mathcal{L}\) and \(\widehat{\mathcal{L}}\)
    related and why do the parameters where their derivatives vanish coincide?


    Rewriting


    ```

    $$\widehat{\mathcal{L}} = \sum_{n=1}^N \sum_{k=1}^K p(z_{n,k}=1|\mathbf{v}_n)
    \log \left( p(z_{n,k}=1) p(\mathbf{v}_n | z_{n,k}=1) \right),$$

    ```'
