    | 0.1006 | 0.3984 | 0.5011 |

    |---|---|---|

    | 0.0996 | 0.4012 | 0.4992 |

    | 0.1002 | 0.3994 | 0.5004 |


    Let''s assume that P^n converges to


    | f1 | f2 | f3 |

    |---|---|---|

    | f1 | f2 | f3 |

    | f1 | f2 | f3 |


    as n converges to infinity. Then the distribution of x_{n+1} converges to


    pF = (f_1(p_1 + p_2 + p_3), f_2(p_1 + p_2 + p_3), f_3(p_1 + p_2 + p_3)) = f,


    since p_1 + p_2 + p_3 = 1. Thus we can generate approximate samples for a given
    distribution f, by generating samples using a Markov chain for which f is invariant
    irrespective of the starting distribution.


    Convergence is due to the ergodic theorem, which is beyond the scope of this text,
    but [33] gives a thorough treatment of Markov chains. If a finite state Markov
    chain is irreducible and aperiodic, then the distribution of x_n will tend to
    the invariant distribution f irrespective of the initial distribution. The invariant
    distribution is then called the equilibrium.


    More generally, any matrix of the form


    | 1 - (\alpha + \beta) | \alpha | \beta |

    |---|---|---|

    | \frac{\alpha}{4} | 1 - \frac{\alpha + \gamma}{4} | \gamma |

    | \frac{\beta}{5} | \frac{4\gamma}{5} | 1 - \frac{\beta + 4\gamma}{5} |'
