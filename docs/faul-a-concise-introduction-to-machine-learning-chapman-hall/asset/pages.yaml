    that a ball rolling down a ramp which is smoothly connected to an upward ramp
    will reach essentially the same level it started from. It will roll backwards
    and forwards until it comes to a rest because of friction and air resistance.
    If both ramps have the same inclination, this is not that surprising, but the
    ball will reach the same level even if the second ramp is much steeper. This is
    illustrated in Figure 1.3. Making this second ramp steeper and steeper, we approach
    a vertical ramp. This means that the experiment of a falling ball and a rolling
    ball are equivalent. In the latter the motion is however slower and thus measurements
    can be obtained.


    This is an instance of unsupervised learning. Galileo realized by himself that
    all the experiments belong to the same class, independent of the angles of the
    two ramps.


    Returning to the experiment with one ramp. Galileo showed that balls of different
    weights would travel the same distance in the same amount of time. Hence he proved
    that weight was not a parameter influencing the experiment. However the times
    of descent for the same distance depending on the inclinations of the plane. The
    steeper the plane, the sooner the experiment is over. Thus the inclination angle
    is a parameter influencing the outcome. This is an example of feature detection
    where we try to find which parameters, or in other words features, are relevant.


    Human learning is a combination of all these:


    +   - Feature detection: Our senses experience the world around us. The cat in
    the Blakeford Cooper experiments never experienced the feature of a vertical line.

    +   - Unsupervised learning: Here we try to make sense of our experiences.'
