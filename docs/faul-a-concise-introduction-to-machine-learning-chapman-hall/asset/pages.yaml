  md: 'Using the fact that the error function of $K$ simultaneous binary classification
    tasks is the sum over the error functions of the individual binary classification
    problems, also for this error function, the derivative of the $n^{\text{th}}$
    contribution with respect to $w_{ji}^{(l)}$ takes the form of (9.1).


    Lastly, we look at classifying $K$ multiple classes, when $\mathbf{t}_n$ has a
    1-of-$K$ representation. Let $k_n$ be the index of the component of $\mathbf{t}_n$
    which equals one. Since all other components are zero, the $n^{\text{th}}$ contribution
