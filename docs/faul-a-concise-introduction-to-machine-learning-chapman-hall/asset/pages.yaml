- pgno: 28
  md: 'Note that the rows sum to 1/2, which are the marginal probabilities of the
    coin, while the columns sum to 1/6, the marginal probabilities of the die. The
    term marginal comes from marginalizing, that is rendering the other random variable
    unimportant.


    When learning, we can repeat an experiment with random variables N times and record
    the number of experiments where the random variables take a certain value. For
    example let X and Y be two random variables where X can take the values x1 ...
    xM and Y can take the values y1, ... yL. The probabilities are denoted


    $p(X = x)$ and $p(Y = y)$,


    while the joint probability is denoted by


    $p(X = x, Y = y)$.


    However, this notation is cumbersome, and we write instead p(x), p(y) and p(x,
    y). In the above example X is the coin and Y is the die with p(heads) = 1/2, p(3)
    = 1/6 and p(heads, 3) = 1/12 for example.


    The coin and the die cannot influence each other, but other random variables can,
    for example the height and weight of a person. We expect a very tall person to
    not be feather light. Of course, there are also examples proving this expectation
    wrong. When two random variables do not influence each other, they are called
    independent, otherwise dependent. Two random variables X and Y are independent,
    if and only if


    $p(X, Y) = p(X)p(Y)$ (2.1)


    for all possible outcomes xi, i = 1, ... M and yj, j = 1, ... L.


    When learning from experiments, instead of recording probabilities in the grid
    we record how often a particular outcome occurs. Let nij be the number of the
    outcome is X = xi and Y = yj. We denote mi the number of occurrences of X = xi,
    disregarding Y, and lj the number of occurrences where Y = yj whatever X is. The
    grid then looks like


    | | Y | y1 | ... | yj | ... | yL |

    |---|---|---|---|---|---|---|

    | X | x1 | n11 | ... | ... | n1L | m1 |

    | | ... | ... | ... | ... | ... | ... |

    | | xi | ... | ... | nij | ... | ... | mi |

    | | ... | ... | ... | ... | ... | ... |

    | | xM | nM1 | ... | ... | ... | nML | mM |

    | | l1 | ... | lj | ... | lL |'
