    of the Gaussian process (as for example in Figure 8.12d for the Gaussian kernel)
    with added noise, since the entries of \(\mathbf{K}\) are getting close to zero,
    because the Gaussian kernel decreases as the distance between points increases.


    Comparing (8.11) to (8.10), we see that the results agree when the kernel is chosen
