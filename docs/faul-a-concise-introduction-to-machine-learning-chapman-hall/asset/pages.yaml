- pgno: 76
  md: 'It has the functional form of another, different beta distribution. Inserting
    the appropriate factor to ensure the integral over the distribution is one gives


    ```

    \( f(\mu|m, N, \alpha, \beta) = \frac{\Gamma(N + \alpha + \beta)}{\Gamma(m + \alpha)\Gamma(N
    - m + \beta)} \mu^{m+\alpha-1} (1 - \mu)^{N-m+\beta-1} . \)

    ```


    Observing \( m \) successes and \( N - m \) failures changes the shape of the
    prior distribution to arrive at the posterior distribution. The order of successes
    and failures is irrelevant.


    What is the probability of success after taking the data \( \mathcal{D} \) into
    account, \( p(x=1|\mathcal{D}) \)? The data is sufficiently specified by \( N
    \) and \( m \). There is no longer a single value for \( \mu \), but a posterior
    distribution over \( \mu \). All possible values are considered by taking the
    integral


    ```

    \(\begin{aligned} p(x=1|\mathcal{D}) &= \int_0^1 p(x=1|\mu) f(\mu|m, N, \alpha,
    \beta) d\mu \\ &= \int_0^1 \mu f(\mu|m, N, \alpha, \beta) d\mu = \mathbb{E}(\mu|m,
    N, \alpha, \beta) \\ &= \frac{m + \alpha}{N + \alpha + \beta}. \end{aligned} \tag{2.22}\)

    ```


    Because of the inclusion of \( \alpha \) and \( \beta \), the probability can
    never become 0, even if \( m=0 \), or 1, even if \( m=N \), contrary to the maximum
    likelihood estimator. It incorporates the uncertainty caused by seeing only a
    finite set of data.


    The above result no longer depends on \( \mu \). It is an example of a latent
    or hidden variable.


    Figure 2.31 shows how the beta distribution changes from a prior distribution
    with \( \alpha = \beta = 2 \) as more data is observed. If 0 stands for tails
    when flipping a coin, the second to seventh plot illustrated a sequence of three
    times tails followed by three times heads. As more tails are observed, the mean
    of the distribution moves to the left, but with more observations of heads, it
    moves back right towards the centre. The last plot is after 100 coin flips, where
    an equal number of heads and tails are observed. The posterior distribution becomes
    more peaked around 1/2. As \( N \) increases, \( \alpha \) and \( \beta \) become
    relatively small compared to it, and \( p(x=1|\mathcal{D}) \) approaches the maximum
    likelihood estimator \( p_{ML} \) for this \( \mathcal{D} \).


    As can be seen in Figure 2.31, this approach can be used in real-time learning,
    where data arrives sequentially, and predictions are updated when more knowledge
    is gained. It can also be used for large data sets, where it is not possible to
    load all data into memory at the same time.


    The beta distribution is known as the *conjugate* distribution to the Bernoulli
    and binomial distribution. It was motivated by choosing a suitable prior distribution
    describing an unknown parameter (\( \mu \)). There is also a mathematical motivation,
    since the posterior distribution arising from Bayes'' rule in this case has the
    same functional form as the prior and therefore can be determined in closed form.
    This is not always the case. When choosing appropriate distributions to describe
    the data, mathematical convenience should play a subordinate role to the data
    and expert knowledge.'
