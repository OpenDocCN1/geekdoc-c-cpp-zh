  md: 'E[t] = E[t(x) + \epsilon] = t(x), since the noise has zero mean. Similarly,

    var[t] = E[(t - E[t])^2] = E[(t - t(x))^2] = E[((t(x) + \epsilon - t(x))^2]

    = E[\epsilon^2] = var[\epsilon] + E[\epsilon]^2 = \sigma^2.


    Contrary to t(x), f(x) is not deterministic, because it depends on the data set
    which was used to calculate the model. However, it is independent of the noise
    \epsilon, which leads to


    E[(t - f(x))^2] = E[t^2 + f(x)^2 - 2tf(x)]

    = E[t^2] + E[f(x)^2] - 2E[tf(x)]

    = var[t] + E[t]^2 + var[f(x)] + E[f(x)]^2 - 2E[f(x)]^2 - 2E[tf(x)]

    = \sigma^2 + t(x)^2 + var[f(x)] + E[f(x)]^2 - 2t(x)E[f(x)]

    = \sigma^2 + var[f(x)] + (E[f(x)] - t(x))^2.


    The first term is the irreducible error due to the noise in the data. It is also
    the minimum achievable error. The second term is the variance. It gives the extent
    to which different solutions arising from different snapshots of data vary around
    their mean. Or in other words, how sensitive the model is to a particular data
    set. The last term is the square of the bias. The bias represents the extent to
    which the average prediction over all snapshots differs from the true process.
    In other words a small bias indicates that the generated models fit the process
    well, while small variance indicates that the models are robust to perturbations
    in the data. In general, making one of them smaller increases the other. This
    is called the bias-variance trade-off


    Note that the analysis so far was only concerned with one particular unseen data
    point x. To make a general statement about the goodness of the model, we need
    to take the expectation with regards to x.


    \int E[(t - f(x))^2] p(x) dx = \int (\sigma^2 + var[f(x)] + (E[f(x)] - t(x))^2)
    p(x) dx.


    This simplifies greatly, if p(x) is a uniform distribution. That is measurements
    are equally likely taken everywhere.


    In general, it is not possible to calculate E[f(x)] and var[f(x)]. But it can
    be estimated, if for example multiple runs of the experiment are possible. For
    the 100 runs above, the approximate integrated squared bias, integrated variance
    and their sums are given in the following table:


    | degree | integrated squared bias | integrated variance | sum |

    |---|---|---|---|

    | 0 | 83.5 * 10^3 | 0.047 * 10^-9 | 83.5 * 10^3 |

    | 1 | 2.7 * 10^-6 | 7.4 * 10^-9 | 2.75 * 10^-6 |

    | 2 | 35.8 * 10^-16 | 0.78 * 10^-16 | 36.6 * 10^-16 |

    | 3 | 0.23 * 10^-3 | 0.14 * 10^-3 | 0.37 * 10^-3 |

    | 4 | 3.4 * 10^-3 | 0.11 | 0.11 |

    | 5 | 0.23 | 309 | 309 |'
