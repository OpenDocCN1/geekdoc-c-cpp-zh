    + \text{tr}(\mathbf{W}^T \mathbf{W} \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T]))
    \right]. $$


    The update formula for $\sigma^2$ follows as


    $$ \sigma^2_{\text{new}} = \frac{1}{ND} \sum_{n=1}^N \left[ \|\mathbf{v}_n - \boldsymbol{\mu}\|^2
    - 2 \mathbb{E}[\mathbf{u}_n]^T \mathbf{W}^T (\mathbf{v}_n - \boldsymbol{\mu})
    + \text{tr}(\mathbf{W}^T \mathbf{W} \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T]) \right].
    \quad (7.11) $$


    It is common to use the already updated value $\mathbf{W}_{\text{new}}$, when
    updating $\sigma^2$. Using (7.9), the update can be written as


    $$ \sigma^2_{\text{new}} = \frac{1}{ND} \sum_{n=1}^N \|\mathbf{v}_n - \boldsymbol{\mu}
    - \mathbf{W}_{\text{new}} \mathbb{E}[\mathbf{u}_n]\|^2 + \frac{1}{D} \text{tr}(\mathbf{W}_{\text{new}}^T
    \mathbf{W}_{\text{new}} \boldsymbol{\Sigma}_{\text{u}|\text{v}}). $$


    This can be interpreted as measuring how close on average $\mathbb{E}[\mathbf{u}_n]$
    is to the sample $\mathbf{v}_n - \boldsymbol{\mu}$ under the mapping given by
    $\mathbf{W}_{\text{new}}$ and how close $\mathbf{W}_{\text{new}}^T \mathbf{W}_{\text{new}}$
