    \ \\mathbf{B} \\mathbf{X}^T \\mathbf{C}) = \\mathbf{A}^T \\mathbf{C}^T \\mathbf{X}\
    \ \\mathbf{B}^T + \\mathbf{C} \\mathbf{A} \\mathbf{X} \\mathbf{B}. $$\n\n# A.2.10\
    \ Derivative of Trace of Product with Diagonal Matrix\n\nLet A be a constant square\
    \ matrix and X a diagonal matrix of the same dimension. tr(...) denotes the trace.\
    \ Then the derivative of the trace of the product is\n\n$$ \\frac{\\partial}{\\\
    partial X} \\text{tr}(\\mathbf{AX}) = \\text{diag}(\\mathbf{A}), $$ \n\n where\
    \ diag(A) is a diagonal matrix with the same diagonal as A."
