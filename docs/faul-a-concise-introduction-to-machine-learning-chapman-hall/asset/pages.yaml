- pgno: 256
  md: 'The \( L_1 \) regularization has the disadvantage that in the case of perfect
    multicollinearity there is not a unique minimum, but a continuum of minima. For
    example, if two columns \( \mathbf{d}_i \) and \( \mathbf{d}_j \) are the same
    and \( c_i \) and \( c_j \) are nonzero coefficients in the minimal solution,
    then for any \( a \in [0, 1] \) replacing \( c_i \) by \( a(c_i + c_j) \) and
    replacing \( c_j \) by \( (1-a)(c_i + c_j) \) are also minimal.


    If the columns of \( \mathbf{D} \) are orthogonal, then they are orthonormal,
    since we assume they are standardized. This means \( \mathbf{D}^T\mathbf{D} \)
    is the identity matrix. In this case, the solution to \( L_1 \) regularization
    can be found by *soft thresholding*. We minimize


    \(\frac{1}{2}\|\mathbf{t} - \mathbf{Dc}\|^2 + \lambda\|\mathbf{c}\|_1 = \frac{1}{2}\mathbf{t}^T\mathbf{t}
    - \mathbf{c}^T\mathbf{D}^T\mathbf{t} + \frac{1}{2}\mathbf{c}^T\mathbf{c} + \lambda\|\mathbf{c}\|_1.\)


    Since \( \mathbf{t}^T\mathbf{t} \) is independent of the variables of interest,
    the first term can be dropped. Furthermore, let \( \mathbf{c}^{\text{OLS}} \)
    be the ordinary least squares solution


    \(\mathbf{c}^{\text{OLS}} = (\mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T\mathbf{t}
    = \mathbf{D}^T\mathbf{t}.\)


    Hence the minimization is equivalent to minimizing


    \(-\mathbf{c}^T\mathbf{c}^{\text{OLS}} + \frac{1}{2}\mathbf{c}^T\mathbf{c} + \lambda\|\mathbf{c}\|_1
    = \sum_{m=1}^M -c_m c_m^{\text{OLS}} + \frac{1}{2}c_m^2 + \lambda|c_m|,\)


    where each summand can be minimized individually. That is, for each \( m \), we
    minimize


    \(-c_m c_m^{\text{OLS}} + \frac{1}{2}c_m^2 + \lambda|c_m| = -c_m c_m^{\text{OLS}}
    + \frac{1}{2}c_m^2 + \lambda \text{sgn}(c_m)c_m,\)


    where


    \(\text{sgn}(c_m) = \begin{cases} +1 & \text{if } c_m > 0, \\ 0 & \text{if } c_m
    = 0, \\ -1 & \text{if } c_m < 0. \end{cases}\)


    If \( c_m^{\text{OLS}} = 0 \), then \( c_m = 0 \) is minimal. Otherwise, the minimal
    \( c_m \) has to have the same sign as \( c_m^{\text{OLS}} \), since otherwise
    the sign could be flipped and a smaller value could be achieved. Thus, it is equivalent
    to minimize


    \(-c_m c_m^{\text{OLS}} + \frac{1}{2}c_m^2 + \lambda \text{sgn}(c_m^{\text{OLS}})c_m.\)


    Differentiating with respect to \( c_m \) and setting to zero gives


    \(c_m = c_m^{\text{OLS}} - \lambda \text{sgn}(c_m^{\text{OLS}}) = \text{sgn}(c_m^{\text{OLS}})(|c_m^{\text{OLS}}|
    - \lambda).\)


    To ensure that \( c_m \) has the same sign as \( c_m^{\text{OLS}} \), we set \(
    c_m = 0 \), if \( |c_m^{\text{OLS}}| < \lambda \). This effectively prunes the
    corresponding basis function. For \( \lambda = 0 \), we recover the ordinary least
    squares solution. If \( \lambda \) is chosen too large, all coefficients are set
    to zero.'
  merge: -1
