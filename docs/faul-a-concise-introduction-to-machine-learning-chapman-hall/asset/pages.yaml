    # Figure 8.8: Average polynomial approximations.


    These results also show that linear polynomials are the right model space to choose,
    since the sum of integrated squared bias and variance is smallest there.


    To summarize, high bias and low variance indicate that the model space cannot
    capture the underlying process and is too restrictive. Low bias and low variance
    show the model space is adequately describing the underlying process, and does
    so for differing data sets. Low bias and high variance mean that with a good distribution
    of training data, the predictions are good, but other training data might result
    in poorer predictions. High bias and high variance are altogether undesirable.


    As mentioned before, the training data set was chosen deliberately small for illustration
    purposes. Doubling the training data set size to 20 in our experiments causes
    the average polynomial approximation of degree 1 or more to be closer to x - 0.5
    when plotted (Figure 8.8), especially in the middle of the interval. Polynomial
    approximation deteriorates towards the ends of the interval, since locally less
    and less information flows from one side and most of the information flows from
