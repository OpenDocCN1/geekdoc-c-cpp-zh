- pgno: 270
  md: 'Hence the change is the logarithm of the likelihood of the new data value $t_*$
    at $\mathbf{x}_*$ given the predictive probability distribution $\mathcal{N}(m_*,
    \sigma_*^2)$. Since $\sigma_* \ge \sigma$, the change lies between $-\infty$ and
    $\log(2\pi\sigma^2)^{-1/2}$. It can be positive. In this case, the new sample
    affirms the model. If the likelihood of the data is small, the marginal likelihood
    is reduced, indicating that the model should be improved. To do so, all quantities
    need to be updated first with the new data included.


    # New data sample: In this case,


    ```

    \(\Delta \mathcal{L} = \log \frac{1}{\sqrt{2\pi\sigma_*}} \exp \left( - \frac{(m_*
    - t_*)^2}{2\sigma_*^2} \right),\)

    \(\bar{\Sigma} = \Sigma - \frac{1}{\sigma_*^2} \Sigma \mathbf{d}(\mathbf{x}_*)
    \mathbf{d}(\mathbf{x}_*)^T \Sigma,\)

    \(\bar{\mu} = \mu - \frac{m_* - t_*}{\sigma_*^2} \Sigma \mathbf{d}(\mathbf{x}_*).\)

    ```


    Then the algorithm can continue improving the model by considering the basis functions
    in turn.


    Sparse Bayesian learning infers a predictive distribution for $t_*$ which is $\mathcal{N}(m_*,
    \sigma_*^2)$ with mean and variance as given in (8.10). This predictive distribution
    is heavily dependent on the model, since it depends on $\mathbf{d}(\mathbf{x}_*)$
    which are the basis functions included in the model evaluated at $\mathbf{x}_*$.
    It is customary to choose basis functions for the dictionary which decay quickly
    when moving away from their centre, or basis functions with finite, compact support.
    Therefore, the degenerate case is possible where $\mathbf{d}(\mathbf{x}_*)$ is
    close to, or even equal to zero, and in this case the predictive probability distribution
    becomes $\mathcal{N}(0, \sigma^2)$ which is meaningless. The confidence we place
    in the predictions should only be informed by the data, and be independent of
    the dictionary of basis functions.


    Let $\mathcal{S}$ be a subset of the samples. This could be all samples or a suitable
    set of neighbours of $\mathbf{x}_*$. We estimate the probability distribution
    of $t_*$ to be normal with mean and variance


    ```

    \(\bar{m} = \max_{\mathbf{x}_i \in \mathcal{S}} \{t_i\},\)

    \(\bar{\sigma} = \max_{\mathbf{x}_i \in \mathcal{S}} \{t_i\}.\)

    ```


    With this estimate, the expected change, when considering $\mathbf{x}_*$, in the
    log evidence is


    ```

    \(\mathbb{E}[\Delta \mathcal{L}] = \int_{-\infty}^{\infty} \left[ \log \frac{1}{\sqrt{2\pi\sigma_*^2}}
    - \frac{(t_* - m_*)^2}{2\sigma_*^2} \right] *\)

    \(\frac{1}{\sqrt{2\pi\sigma^2}} \exp \left( - \frac{(t_* - \bar{m})^2}{2\sigma^2}
    \right) dt_*\)

    \(= \log \frac{1}{\sqrt{2\pi\sigma_*^2}} - \frac{\sigma^2 + (\bar{m} - m_*)^2}{2\sigma_*^2}.\)

    ```'
