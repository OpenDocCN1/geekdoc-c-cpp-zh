  md: 'On the other hand, if the kernel is the square of the inner product, then


    ```

    k(\mathbf{x}_i, \mathbf{x}_j) = (\mathbf{x}_i^T \mathbf{x}_j)^2 = \left( \sum_{d=1}^D
    x_{i,d} x_{j,d} \right) \left( \sum_{e=1}^D x_{i,e} x_{j,e} \right)

    = \sum_{d,e=1}^D (x_{i,d} x_{i,e}) (x_{j,d} x_{j,e})

    = \sum_{d=1}^D d_{d,e}(\mathbf{x}_i) d_{d,e}(\mathbf{x}_j) = \mathbf{d}(\mathbf{x}_i)^T
    \mathbf{d}(\mathbf{x}_j),

    ```


    if we define \( M = D^2 \) basis functions as the product of any two components,
    \( d_{d,e}(\mathbf{x}) = x_d x_e \). Or in other words, the basis functions are
    all \( D \)-dimensional monomials of degree 2.


    More generally, including a term of the inner product to the power of \( a \)
    means that monomials of degree \( a \) are part of the model space. As the number
    of monomials increases quickly with their degree, the kernel is a compact way
    to write these. A correspondence between kernels and basis functions is not that
    straightforward in general.


    If the kernel contains a positive, additive constant, then the mean of the Gaussian
    process can be assumed to be zero, because a positive, additive constant corresponds
    to the constant basis function, also known as the *bias* being included in the
    model space.


    This concludes the description of drawing a function from a Gaussian process.
    We now turn our attention to drawing a function from the posterior of a Gaussian
    process, once some data pairs \( (\mathbf{x}_1, t_1), \dots, (\mathbf{x}_N, t_N)
    \) have been seen. Let \( \mathbf{x}_* \) be arbitrary and distinct from \( \mathbf{x}_n,
    n=1, \dots, N \). Recall that the measurements we see have additive normally distributed
    noise with mean zero and variance \( \sigma^2 \), that is


    ```

    t_n = f(\mathbf{x}_n) + \epsilon_n \quad \text{as well as} \quad t_* = f(\mathbf{x}_*)
    + \epsilon_*.

    ```


    We assume that \( f \) is drawn from a Gaussian process with kernel \( k \) and
    mean zero. Therefore, the vector \( (t_1, \dots, t_N, t_*) \) follows a normal
    distribution with mean zero and covariance matrix


    ```

    \left( \begin{array}{ c c }

    \mathbf{C} & \mathbf{k}(\mathbf{x}_*) \\

    \mathbf{k}(\mathbf{x}_*)^T & c(\mathbf{x}_*)

    \end{array} \right),

    ```


    where the vector \( \mathbf{k}(\mathbf{x}_*) \) has elements \( k(\mathbf{x}_n,
    \mathbf{x}_*) \) for \( n=1, \dots, N \), \( c(\mathbf{x}_*) = k(\mathbf{x}_*,
    \mathbf{x}_*) + \sigma^2 \), and the \( (i,j) \) entry of \( \mathbf{C} \) is


    ```

    C_{ij} = k(\mathbf{x}_i, \mathbf{x}_j) + \sigma^2 \delta_{ij},

    ```


    where \( \delta_{ij} \) is zero for \( i \neq j \) and one for \( i=j \) and is
    known as the *Kronecker delta*.'
