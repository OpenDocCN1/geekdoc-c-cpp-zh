    This leads to the _binomial distribution_ \( m \sim \text{Bin}(N, \mu) \) with
    probability mass function


    ```

    \(\text{Bin}(m|N, \mu) = \binom{N}{m} \mu^m (1-\mu)^{N-m},\) (2.7)

    ```


    which depends on the number of experiments \( N \) and the probability of success
    \( \mu \). Figure 2.7 shows the binomial probability mass function and its cumulative
    distribution function for \( \mu = 0.3, 0.5 \) and \( 0.8 \). If the probability
    of \( x = 1 \) is small, the probability of achieving a large number of successes
    is small. It increases as \( \mu \) increases.


    The expectation of the binomial distribution is


    ```

    \(\mathbb{E}[m] = \mu N,\)

    ```


    since we expect the portion of \( N \) given by \( \mu \) to be successful. The
    variance on the other hand is


    ```

    \(\text{var}[m] = \mu(1 - \mu)N.\)

    ```


    It is \( N \) times the variance of a single experiment.'
