    placed this board in a sloping position, by raising one end some one or two cubits
    above the other, we rolled the ball, as I was just saying, along the channel,
    noting, in a manner presently to be described, the time required to make the descent.
    We repeated this experiment more than once in order to measure the time with an
    accuracy such that the deviation between two observations never exceeded one-tenth
    of a pulse-beat. Having performed this operation and having assured ourselves
    of its reliability, we now rolled the ball only one-quarter the length of the
    channel; and having measured the time of its descent, we found it precisely one-half
    of the former. Next we tried other distances, comparing the time for the whole
    length with that for the half, or with that for two-thirds, or three-fourths,
    or indeed for any fraction; in such experiments, repeated a full hundred times,
    we always found that the spaces traversed were to each other as the squares of
    the times, and this was true for all inclinations of the plane, i.e., of the channel,
    along which we rolled the ball. We also observed the times of descent, for various
    inclinations of the plane, bore to one another precisely that ratio which, as
    we shall see later, the Author had predicted and demonstrated for them.”


    For the measurement of time, we employed a large vessel of water placed in an
    elevated position; to the bottom of this vessel was soldered a pipe of small diameter
    giving a thin jet of water which we collected in a small glass during the time
    of each descent, whether for the whole length of the channel or for part of its
    length; the water thus collected was weighed, after each descent, on a very accurate
    balance; the differences and ratios of these weights gave us the differences and
    ratios of the times, and this with such accuracy that although the operation was
    repeated many, many times, there was no appreciable discrepancy in the results.”


