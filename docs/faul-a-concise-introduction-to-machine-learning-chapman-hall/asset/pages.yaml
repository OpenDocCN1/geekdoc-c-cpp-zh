    # 7.3 Expectation-Maximization


    The previous section was based on the assumption that the data samples v1...vn
    are related to vectors in a lower dimensional space via a linear mapping given
    by (7.2) with additive Gaussian noise with zero mean and covariance matrix \(\sigma^2\mathbf{I}\).
    Therefore, each vn follows a conditional normal distribution with mean Wun + m
    and covariance matrix \(\sigma^2\mathbf{I}\), where un, n = 1, ..., N, are hidden
    latent variables following the standard multivariate distribution. The solution
    in the previous section effectively calculated the marginal distribution from
    which the vn are drawn by marginalizing the latent variables. The likelihood of
    the data set was then maximized to find m, W and \(\sigma^2\). The likelihood
    takes a maximum with respect to m, when m = \(\mu\), the sample mean which is
    easily obtained. The maximization with respect to W and \(\sigma^2\), however,
    involves finding the K largest eigenvalues and eigenvectors of the sample covariance
    matrix which is in itself a computationally expensive problem. Firstly, calculating
    the covariance matrix is of complexity O(ND^2). The computational complexity of
    then finding the K largest eigenvalues is O(KD^2) (see for example [12]).


    In the following, we will use the result m = \(\mu\) and we employ the Expectation-Maximization
    technique introduced in Section 6.4 to find W and \(\sigma^2\), making use of
    the joint distribution of v and u and the distribution of u'
