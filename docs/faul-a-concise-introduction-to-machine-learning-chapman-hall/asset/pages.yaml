    \(\left( \begin{array}{cc} C^{-1} + C^{-1}k(\mathbf{x}_*)k(\mathbf{x}_*)^T C^{-1}
    & -C^{-1}k(\mathbf{x}_*) \\ c(\mathbf{x}_*) - k(\mathbf{x}_*)^T C^{-1} k(\mathbf{x}_*)
    & \frac{-C^{-1}k(\mathbf{x}_*)}{c(\mathbf{x}_*) - k(\mathbf{x}_*)^T C^{-1} k(\mathbf{x}_*)}
    \\ \frac{c(\mathbf{x}_*) - k(\mathbf{x}_*)^T C^{-1} k(\mathbf{x}_*)}{1} & \frac{c(\mathbf{x}_*)
    - k(\mathbf{x}_*)^T C^{-1} k(\mathbf{x}_*)}{c(\mathbf{x}_*) - k(\mathbf{x}_*)^T
    C^{-1} k(\mathbf{x}_*)} \end{array} \right).\)


    We can deduce that the conditional probability of \(t_*\) given \(\mathbf{t}\)
    is normal and has variance and mean


    \(\sigma^2(\mathbf{x}_*) = c(\mathbf{x}_*) - k(\mathbf{x}_*)^T C^{-1} k(\mathbf{x}_*)
    = \sigma^2 + k(\mathbf{x}_*, \mathbf{x}_*) - k(\mathbf{x}_*)^T C^{-1} k(\mathbf{x}_*),\)

    \(m(\mathbf{x}_*) = k(\mathbf{x}_*)^T C^{-1} \mathbf{t}.\)

    (8.11)


    Since \(\mathbf{x}_*\) is chosen arbitrarily (excluding \(\mathbf{x}_1, \dots,
    \mathbf{x}_N\)), this specifies a distribution over functions.


    Let \(\mathbf{x}_1^*, \dots, \mathbf{x}_{N^*}^*\) be \(N^*\) points where predictions
    \(\mathbf{t}^* = (t_1^*, \dots, t_{N^*}^*)^T\) are to be made. The joint distribution
    of \((\mathbf{t}, \mathbf{t}^*)\) has covariance matrix


    \(\left( \begin{array}{cc} \mathbf{C} & \mathbf{K} \\ \mathbf{K}^T & \mathbf{C}^*
    \end{array} \right),\)


    where \(\mathbf{C}\) is as before, \(\mathbf{K}\) is a \(N \times N^*\) matrix
    given by \(k(\mathbf{x}_n, \mathbf{x}_m^*)\) and the \((i, j)\) entry of \(\mathbf{C}^*\)
    is \(k(\mathbf{x}_i^*, \mathbf{x}_j^*) + \sigma^2 \delta_{ij}\). The conditional
    probability distribution of \(\mathbf{t}^*\) given \(\mathbf{t}\) has mean and
    variance


    \(\mathbf{m}^* = \mathbf{K}^T \mathbf{C}^{-1} \mathbf{t},\)

    \(\mathbf{\Sigma}^* = \mathbf{C}^* - \mathbf{K}^T \mathbf{C}^{-1} \mathbf{K}.\)


    As before, we can draw point values from this distribution and plot as functions
    to illustrate draws from the posterior Gaussian process. Figure 8.13 illustrates
    four draws using various kernels along with four training data points from the
    function \(1 + x + \sin x\), which is drawn in red. The mean of the conditional
    distribution is drawn in blue along with a band of two standard deviations in
    gray. The parameters were kept at \(\theta_1 = \theta_2 = 1\). The noise variance
    was set to 0.00001. The distribution is tightened near the training data, while
    the uncertainty increases away from the training data points. In the range between
    two training points the uncertainty is largest in the middle. As can be seen to
