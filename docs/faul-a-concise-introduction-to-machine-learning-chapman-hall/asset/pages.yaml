- pgno: 17
  md: '# Preface


    Machine Learning is known under many names such as Machine Learning, Artificial
    Intelligence, Pattern Recognition, Data Mining, Data Assimilation, and Big Data,
    to list but a few. It developed in many areas of science, such as in physics,
    engineering, computer science, and mathematics in parallel and independently.
    For example, it is used for Spam Filtering, Optical Character Recognition (OCR),
    Search Engines, Computer Vision, Natural Language Processing (NLP), Advertising,
    Fraud Detection, Robotics, Data Prediction, Material Discovery; Astronomy. This
    makes it sometimes difficult to find a solution for a particular problem in the
    literature, simply because different words and phrases are used for the same concept.


    This book aims to alleviate this. A common concept, but known in several disciplines
    under different names, is described using mathematics as the common language.
    Readers will find the index useful to find a particular topic as it is known to
    them. The index is comprehensive, making it easy to find the required information.
    Hopefully, the book will prove useful as a reference and make it an essential
    on the bookshelves of anybody employing machine learning techniques.


    Often, in teaching Machine Learning, the emphasis is on the questions “What?”
    and “How?”, and the question “Why?” is neglected. In my opinion, however, this
    is the most important question. Only if why an algorithm is successful is understood
    can it be properly applied. On the other hand, if why it arrived at its results
    is not understood, these results cannot be trusted.


    Algorithms are often taught side by side without showing the similarities and
    differences between them. This book addresses this by introducing the commonalities.
    Most techniques try to find an approximate model generating the data in a finite,
    low-dimensional space. They differ in how a solution to this approximate model
    is found and how the model space is chosen. This approach helps to keep the book
    concise while still giving a thorough and in depth treatment. In some places,
    where further detail was felt to be beyond the scope of this book, the reader
    is referred to further reading.


    Techniques are illustrated by MATLAB® implementations. The main purpose is to
    show the inner workings of the method in order to develop an intuition. In most
    cases, the listings are printed in the book, but all are available online at https://www.crcpress.com/A-Concise-Introduction-to-Machine-Learning/Paul/9780815384106
    as part of the package K339637_Downloads.zip.'
  merge: -1
  img_proc: true
