  img_proc: true
- pgno: 123
  md: '![](img/d3c00252180686426c9e63ab889b535b_123_0.png)


    # Figure 4.10: Objective function, constraints and gradients.


    constraint is satisfied, while in the medium gray region, two constraints are
    satisfied. In the dark gray region, all constraints are satisfied. This is known
    as the *feasible set*. The minimum subject to the constraints lies at the point
    within the feasible set closest to the centre of the circles. In the illustration
    of Figure 4.10, two constraints are active and one is inactive. At this point,
    the gradient of \(\|\tilde{\mathbf{w}}\|^2/2\) is a linear combination of the
    gradients of the active constraints. In Figure 4.10 the arrows perpendicular to
    the constraints are the gradients of the constraints multiplied by \(\alpha_n\).
    The dotted lines illustrate that these add to form the gradient vector of the
    objective function at the constrained minimum.


    The Lagrangian function combines the objective function and the constraints into
    one function and is given by


    ```

    L(\tilde{\mathbf{w}}, \boldsymbol{\alpha}) = \frac{1}{2}\|\tilde{\mathbf{w}}\|^2
    - \sum_{n=1}^N \alpha_n \left(c_n \tilde{\mathbf{w}}^T \tilde{\mathbf{v}}_n -
    1\right)

    ```


    where \(\boldsymbol{\alpha} = (\alpha_1, ..., \alpha_N)^T\) are known as *Lagrange
    multipliers* which are required to be non-negative. If for a particular \(\tilde{\mathbf{w}}\),
    the constraint \(c_n \tilde{\mathbf{w}}^T \tilde{\mathbf{v}}_n - 1 \ge 0\) is
    satisfied as equality, it does not contribute to the sum. If it is satisfied as
    a strict inequality, we subtract from the original objective function, but if
    it is not satisfied, we add to it. Thus, if \(\tilde{\mathbf{w}}\) lies outside
    the feasible set, it is penalized.


    The function


    ```

    L(\boldsymbol{\alpha}) = \min_{\tilde{\mathbf{w}}} L(\tilde{\mathbf{w}}, \boldsymbol{\alpha})

    ```'
