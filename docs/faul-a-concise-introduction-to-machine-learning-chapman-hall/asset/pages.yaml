    z_{n,k}=1) \\ = \sum_{k=1}^K \sum_{n=1}^N q(z_{n,k}=1) \log p(\mathbf{v}_n) +
    \sum_{k=1}^K \sum_{n=1}^N q(z_{n,k}=1) \log p(z_{n,k}=1|\mathbf{v}_n) \\ = \underbrace{\sum_{n=1}^N
    \log p(\mathbf{v}_n)}_{\mathcal{L}} + \sum_{k=1}^K \sum_{n=1}^N q(z_{n,k}=1) \log
    p(z_{n,k}=1|\mathbf{v}_n), \end{aligned}\)

    ```


    because of \(\sum_{k=1}^K q(z_{n,k}=1) = 1\). Rearranging, we see that the logarithm
