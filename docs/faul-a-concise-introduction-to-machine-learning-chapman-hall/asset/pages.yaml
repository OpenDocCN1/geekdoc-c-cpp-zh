- pgno: 233
  md: '# # Regression


    Regression developed from interpolation and is introduced as building a model
    of the process generating the data where the building blocks are chosen. The first
    choice of building blocks are polynomials. Ordinary Least Squares are introduced
    as the simplest method arising from assumed normally distributed noise. The concepts
    of over- and under-fitting are explained using the degree of polynomials as a
    descriptor for the complexity of the model space. Bias and variance are two contributors
    to the expected error of the model. Cross-validation is a method to decide the
    goodness of the model. If the building blocks are too similar to each other, multicollinearity
    becomes a problem. Principal component regression ensures small correlation between
    building blocks, while Partial Least Squares emphasizes strong correlation with
    the data at the same time. Regularization controls model complexity. The chapter
    concludes with taking a probabilistic viewpoint in form of Bayesian regression
    leading to Gaussian processes.


    In regression, we try to find the relationship between variables. Regression is
    related to curve fitting, interpolation, and data prediction. As an example, we
    consider colour vision. Spectral colours, as seen in Figure 8.1, are evoked by
    a single wavelength. Colours change continuously as the wavelength changes. A
    physical colour is a combination of pure spectral colours. Hence there are infinitely
    many possibilities.


    ![](img/d3c00252180686426c9e63ab889b535b_233_0.png)


    Figure 8.1: Spectral colours.


    Around 1854, James Clerk Maxwell [8] showed that all colours can be mixed by different
    combinations of the three primary colours, red, green and blue. He did so by using
    a colour-mixing top which can be seen in Figure 8.2'
  merge: -1
