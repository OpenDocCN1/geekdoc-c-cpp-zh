    and \(\Psi\), if it weren''t for the distinction by processes.


    The inverse Wishart distribution \(W^{-1}(\Sigma|\Psi, \nu)\) is the conjugate
    prior for the covariance matrix \(\Sigma\) of a multivariate normal distribution
    with a known mean. We can assume that the mean of this distribution is zero, since
    we can re-centre the data at zero by subtracting the mean from all samples.'
