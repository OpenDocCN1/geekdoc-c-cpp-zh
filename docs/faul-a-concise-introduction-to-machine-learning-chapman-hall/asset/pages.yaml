    $$ \mathbf{W}_{\text{new}} = \left[ \sum_{n=1}^N (\mathbf{v}_n - \boldsymbol{\mu})
    \mathbb{E}[\mathbf{u}_n]^T \right] \left[ \sum_{n=1}^N \mathbb{E}[\mathbf{u}_n
