- pgno: 134
  md: 'Let $\phi : \mathbb{R}^M \to \mathbb{R}^{\hat{M}}$ be the mapping from the
    original $M$ dimensional feature space to the higher $\hat{M}$ dimensional feature
    space. We now apply the support vector machine to the data in this higher dimensional
    space; i.e. we need to maximize


    $L(\boldsymbol{\alpha}) = \sum_{n=1}^N \alpha_n - \frac{1}{2} \sum_{i=1}^N \sum_{n=1}^N
    \alpha_i \alpha_n c_i c_n \left( 1 + \phi(\mathbf{v}_i)^T \phi(\mathbf{v}_n) \right).$


    Let $k : \mathbb{R}^M \times \mathbb{R}^M \to \mathbb{R}$ be defined as


    $k(\mathbf{x}, \mathbf{y}) = \phi(\mathbf{x})^T \phi(\mathbf{y}).$


    This is known as the *kernel function* or *kernel* for short. Using this notation,
    the objective function to be maximized becomes


    $L(\boldsymbol{\alpha}) = \sum_{n=1}^N \alpha_n - \frac{1}{2} \sum_{i=1}^N \sum_{n=1}^N
    \alpha_i \alpha_n c_i c_n \left( 1 + k(\mathbf{v}_i, \mathbf{v}_n) \right),$


    subject to $\alpha_i \ge 0, i = 1, \dots, N$. The classification is according
    to the sign of


    $-b + \sum_{n=1}^N \alpha_n c_n \phi(\mathbf{v}_n)^T \phi(\mathbf{v}) = -b + \sum_{n=1}^N
