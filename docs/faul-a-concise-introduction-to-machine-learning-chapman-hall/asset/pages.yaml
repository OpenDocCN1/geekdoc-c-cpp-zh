- pgno: 236
  md: '+   • Engineering: e.g. machine degradation,

    +   • Medicine: e.g. epidemiology, mammography,

    +   • Finance: e.g. volatility prediction, pricing models,

    +   • Econometrics: e.g. cost and benefit optimization,

    +   • Hydrology: e.g. flow prediction, ground water level forecasting,

    +   • Seismology: e.g. soil liquefaction, seismic surveys.


    # 8.1 Problem Description


    Given scalar measurements \(t_1, \dots, t_N\), each measurement depends on parameters
    we know, \(\mathbf{x}_1, \dots, \mathbf{x}_N\), the intensities of red, green,
    blue in the previous example. These are quantities which can be measured with
    more or less effort, for example by photocells, geophones, hydrophones, PET and
    MRI neuro-imaging, EEG technology, etc. They are also known as *targets* the machine
    learning technique has to achieve in its task to create a model. In the following
    it is assumed that the measurements are *mean centred*, i.e. \(1/N(t_1 + \cdots
    + t_N) = 0\). This eliminates the need for a bias in the model. The *bias* is
    a constant which added to all measurements makes them mean centred.


    The measurements also depend on parameters we do not know. Any real world application
    depends on factors which cannot be measured. Or these measurements would be disproportionally
    difficult, costly or invasive.


    We assume that the measurements are the result of underlying processes following
    some laws. In some applications, especially physical ones, these laws are known,
    and for example described by partial differential equations, but the specific
    parameters are not known. Sometimes nothing is known and we have to try to find
    this out. For applications which incorporate human interactions such as the financial
    markets, it is inherently difficult to infer underlying processes.


    For example, the physics of waves are well understood. However, they depend on
    the mixture of media the wave travels in, the materials and their properties,
    as well as their interfaces. These are the unknown parameters of the process.


    If we had a solution to the underlying process, we could predict the measurement
    from a function \(t(\mathbf{x})\) as


    ```

    \(t_n = t(\mathbf{x}_n),\)

    ```


    where parameters of the function depend on the process. On the other hand, if
    we had a set of candidate functions \(d_1(\mathbf{x}), \dots, d_M(\mathbf{x})\),
    we could try which fits the measurements, and thus infer the underlying process.
    We say the functions \(d_1(\mathbf{x}), \dots, d_M(\mathbf{x})\) form a *dictionary*
    and let


    ```

    \(f(\mathbf{x}) = \sum_{m=1}^M c_m d_m(\mathbf{x}),\)

    ```'
