  md: "# 3.5 Markov Chain Monte Carlo\n\nLet\n\n```\nf(\\mathbf{x}) = \\frac{1}{c_f}\
    \ \\tilde{f}(\\mathbf{x})\n```\n\ndescribe the distribution we want to sample\
    \ from, where the value of the normalizing constant $c_f$ is not necessarily known.\
    \ We construct a Markov chain by using a proposal distribution $g(\\mathbf{x},\
    \ \\hat{\\mathbf{x}})$, which describes the probability of drawing $\\hat{\\mathbf{x}}$\
    \ when $\\mathbf{x}$ is given. That is, the next element in the Markov chain $\\\
    mathbf{x}_{n+1}$ is drawn from the distribution $g(\\mathbf{x}_n, \\mathbf{x})$\
    \ where $\\mathbf{x}_n$ is the current element in the Markov chain. The Markov\
    \ chain is only homogeneous, if $g(\\mathbf{x}, \\hat{\\mathbf{x}})$ is independent\
    \ of $\\mathbf{x}$. \n\nIf, in addition, the proposal distribution is symmetric,\
    \ i.e. $g(\\mathbf{x}, \\hat{\\mathbf{x}}) = g(\\hat{\\mathbf{x}}, \\mathbf{x})$\
    \ for all $\\mathbf{x}$, a candidate $\\mathbf{x}^*$ is drawn from the proposal\
    \ distribution and accepted with probability\n\n```\nmin \\left( 1, \\frac{f(\\\
    mathbf{x}^*)}{f(\\mathbf{x}_n)} \\right) = min \\left( 1, \\frac{\\tilde{f}(\\\
    mathbf{x}^*)}{\\tilde{f}(\\mathbf{x}_n)} \\right).\n```\n\nNote that, if $\\tilde{f}(\\\
    mathbf{x}^*) \\ge \\tilde{f}(\\mathbf{x}_n)$, the candidate is certain to be kept.\
    \ If the candidate sample is accepted, then $\\mathbf{x}_{n+1} = \\mathbf{x}^*$,\
    \ otherwise $\\mathbf{x}_{n+1} = \\mathbf{x}_n$. This is known as the Metropolis\
    \ algorithm.\n\nDuplicating the sample is in contrast to rejection sampling. In\
    \ practical implementations, no extra copies of the sample are stored. Instead\
    \ a counter of how often the sample was drawn is updated. This counter acts as\
    \ weighting when, for example, the expectation is calculated. As long as $\\tilde{f}$\
    \ is non-zero over the entire state space, there is always a non-zero probability\
    \ of $\\mathbf{x}_{n+1} = \\mathbf{x}_n$ and thus the Markov chain is aperiodic.\
    \ If, in addition, $g(\\mathbf{x}, \\hat{\\mathbf{x}})$ is non-zero over the entire\
    \ state space, the Markov chain is obviously irreducible.\n\nThe elements of the\
    \ Markov chain, $\\mathbf{x}_1, \\mathbf{x}_2, \\dots$, are not independent samples\
    \ in most cases, because successive samples are highly correlated, if $g(\\mathbf{x},\
    \ \\hat{\\mathbf{x}})$ depends on $\\mathbf{x}$. In fact, the chain represents\
    \ a random walk through the state space. For practical purposes, only taking every\
    \ $m^{th}$ element from the chain approximates independence for $m$ sufficiently\
    \ large. This practice is known as thinning.\n\nSymmetry of $g(\\mathbf{x}, \\\
    hat{\\mathbf{x}})$ can for example be achieved by letting $g(\\mathbf{x}, \\hat{\\\
    mathbf{x}})$ describe the normal distribution with mean $\\mathbf{x}$ and a variance\
    \ which is $\\sigma^2$ times the identity matrix, since in this case\n\n```\n\
    g(\\mathbf{x}, \\hat{\\mathbf{x}}) = \\frac{1}{\\sqrt{|2\\pi\\sigma^2\\mathbf{I}|}}\
    \ \\exp \\left( \\frac{1}{2\\sigma^2} (\\hat{\\mathbf{x}} - \\mathbf{x})^T (\\\
    hat{\\mathbf{x}} - \\mathbf{x}) \\right) = g(\\hat{\\mathbf{x}}, \\mathbf{x}).\n\
    ```\n\nThis choice for the proposal distribution is common, since techniques to\
    \ generate samples from the standard normal distribution such as the the Box--Muller\
    \ transform are readily available, and these samples only have to be scaled by\
    \ $\\sigma^2$ and translated by $\\mathbf{x}.$"
