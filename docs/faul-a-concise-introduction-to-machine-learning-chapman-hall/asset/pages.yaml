    # 2.5 Functions of Continuous Random Variables


    If \(x\) is a continuous random variable with probability density function \(f_x(x)\),
    then, for a continuous function \(g\), \(y = g(x)\) is also a continuous random
    variable, but what is its probability density function \(f_y(y)\)? We include
    subscripts to be clear which random variable the probability density function
    and the cumulative distribution function refer to.


    We first restrict our attention to the case, when \(g\) is a one-to-one transformation.
    That is each value of \(x\) generates exactly one value of \(y\), and each value
    of \(y\) is generated by exactly one value of \(x\). Because of this, an inverse
    function \(g^{-1}\) exists such that \(x = g^{-1}(y)\). Since \(g\) is continuous,
    it has to be either strictly decreasing or increasing.


    Taking the strictly increasing case first, we can derive the probability density
    function by using the cumulative distribution functions, \(F_x\) and \(F_y\).
    Given a value \(y\), then


    \(F_y(y) = p(g(x) \le y)\).'
