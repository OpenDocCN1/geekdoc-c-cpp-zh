    probability that it is generated by a new process is \(\alpha/(1 + \alpha)\).
    If \(\alpha = 1\), these two probabilities are the same and are both one half.
    If \(\alpha\) is greater than 1, then a new process is favoured, while for \(\alpha
    < 1\) the already existing process is more likely to be used to generate the second
    sample.


    When generating the \(n^{\text{th}}\) sample, it is generated by


    ```

    \begin{cases}

    \text{process } k \text{ with probability } \frac{n_k}{n - 1 + \alpha} \\

    \text{a new process with probability } \frac{\alpha}{n - 1 + \alpha}

    \end{cases}

    ```


    where \(n_k\) denotes the number of samples generated by process \(k\) so far.
    When summing the samples generated by each process over all processes, the result
    is \(n - 1\). Therefore these probabilities sum to 1.


    Note that as more and more samples are generated by a particular process \(k\),
    it gets more likely that this process will generate further samples, since \(n_k/(n
    - 1 + \alpha)\) increases relatively to the other probabilities. This is again
    the *rich-get-richer* phenomenon.


    Listing 6.6 generates data in this fashion. The results for various values of
