    = \sigma^{-2}\mathbf{D}^T\mathbf{t}\). Hence the mean of the posterior distribution
    is


    \mu = \sigma^{-2}\mathbf{\Sigma}\mathbf{D}^T\mathbf{t}. \quad (8.7)


