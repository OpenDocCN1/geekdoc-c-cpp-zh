  md: '# 9.4 Autoencoder Example


    We apply a sparse autoencoder to the MNIST data set of handwritten digits by [26]
    and compare and link this method to the techniques we have already encountered.
    For this data, D = 784, and the components of x are the individual pixel values.


    The simplest autoencoder has two layers. Schematically, it represented as


    ![](img/d3c00252180686426c9e63ab889b535b_304_0.png)


    In this simple case, the encoder and decoder functions are


    \(\phi(\mathbf{x}) = h^{(1)}(\mathbf{W}^{(1)}\mathbf{x} + \mathbf{b}^{(1)}) \quad
    \text{and} \quad \psi(\mathbf{z}) = h^{(2)}(\mathbf{W}^{(2)}\mathbf{z} + \mathbf{b}^{(2)}).\)


    If \(\mathbf{W}^{(2)} = \mathbf{W}^{(1)^T}\), then the weights are tied. However,
    in this example we do not enforce this, but let them be independent from each
    other.


    Both \(h^{(1)}\) and \(h^{(2)}\) are chosen to be the logistic sigmoid applied
    element-wise. Since the output range of the logistic sigmoid is [0, 1] autoencoders
    reconstruct the input, the pixel values of the input images need to be rescaled
    to lie between zero and one as a pre-processing step.


    Valuable insight can be gained from visualizing how the activations and latent
    variables are separated spatially. This is easily possible for M = 1, 2 or 3.
    In the following, we show one technique of how this can be done for larger M.


    The activations in the output layer are given by


    \(\mathbf{W}^{(2)}\mathbf{z} + \mathbf{b} = z_1\mathbf{w}_1^{(2)} + \dots + z_M\mathbf{w}_M^{(2)}
    + \mathbf{b},\)


    where \(\mathbf{w}_1^{(2)}, \dots, \mathbf{w}_M^{(2)}\) are the columns of \(\mathbf{W}^{(2)}\).
    The elements of the \(m^{th}\) column are the weights of the synapses connecting
    the \(m^{th}\) hidden neuron to the output neurons. Since the activations are
    clearly a linear combination of the'
