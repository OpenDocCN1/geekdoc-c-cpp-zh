  md: '# Clustering


    Clustering is introduced as a sorting process where the criteria governing the
    sort are not known. It builds from the heuristic K means clustering, explaining
    mixture models in general and specifically Gaussian mixture models. The Expectation-Maximization
    technique is shown to be a general iterative technique to maximize the data likelihood.
    Next Bayesian mixture models are explored and illustrated with the Chinese Restaurant
    Process. The chapter concludes with the Dirichlet process which is explained in
    detail and illustrated by examples.


    So far we have looked at data which had class labels. The task was to learn the
    class membership from the features of each data sample, in order to classify unseen
    data in the future. In this chapter, we look at unlabeled data. As before, we
    denote the vector of features by v. Let v1, ..., vN be the feature vectors of
    N data samples. The choice of features or combination of features is important.


    ![](img/d3c00252180686426c9e63ab889b535b_169_0.png)


    Figure 6.1: Sorting sweets.'
