    # Figure 8.13: Draws from the posterior Gaussian process for different kernels.


    \(\theta_1\) and \(\theta_2\) can be chosen by maximizing the log likelihood of
    the training data, which is given by


    \(\mathcal{L} = -\frac{1}{2} \left[ \log |\mathbf{C}| + \mathbf{t}^T \mathbf{C}^{-1}
    \mathbf{t} + N \log(2\pi) \right].\)


    Using the formulae in Appendices A.2.4 and A.2.7 for the derivatives of the determinant
    and inverse of a matrix, when the entries of the matrix depend on a variable,
    we arrive at


    \(\frac{\partial}{\partial \theta_i} \mathcal{L} = -\frac{1}{2} \left[ \text{tr}
    \left( \mathbf{C}^{-1} \frac{\partial \mathbf{C}}{\partial \theta_i} \right) -
    \mathbf{t}^T \mathbf{C}^{-1} \frac{\partial \mathbf{C}}{\partial \theta_i} \mathbf{C}^{-1}
    \mathbf{t} \right].\)


    The \((m,n)\) entry of the derivative of \(\mathbf{C}\) with respect to \(\theta_i\)
    is


    \(\frac{\partial}{\partial \theta_i} (k(\mathbf{x}_m, \mathbf{x}_n) + \sigma^2
    \delta_{mn}) = \frac{\partial}{\partial \theta_i} k(\mathbf{x}_m, \mathbf{x}_n).\)'
