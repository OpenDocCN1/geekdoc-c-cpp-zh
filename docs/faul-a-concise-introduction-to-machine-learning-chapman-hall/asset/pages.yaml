    dz \right)

    = \frac{1}{2\pi} \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} \exp\left(-\frac{y^2+z^2}{2}\right)
    dydz.

    (2.5)

    ```


    Changing to polar coordinates, $y = r \cos \theta, z = r \sin \theta$ and $dydz
    = r dr d\theta$, gives


    ```

    \frac{1}{2\pi} \int_0^{2\pi} \int_0^{\infty} \exp\left(\frac{-r^2(\cos^2 \theta
    + \sin^2 \theta)}{2}\right) r dr d\theta = \frac{1}{2\pi} \int_0^{2\pi} \int_0^{\infty}
    r \exp\left(\frac{-r^2}{2}\right) dr d\theta,

    (2.6)

    ```


    where we used $\cos^2 \theta + \sin^2 \theta = 1$. The integrand is independent
    of $\theta$. Thus the integral with respect to $\theta$ evaluates to $2\pi$, the
    length of the interval, which cancels with the denominator. The integrand is the
    derivative of $\exp\left(-\frac{r^2}{2}\right)$ with respect to $r$ which evaluates
    to 0 at the upper limit $\infty$ and -1 at the lower limit 0 which we subtract.
    Hence the integral of the normal distribution is one as required.


