    # 2.4 Examples of Continuous Probability Density Functions


    As with the discrete distributions, the simplest continuous probability density
    function is the uniform distribution. The random variable $x$ can take any value
    in the interval $(a, b)$ with the same probability, $x \sim \text{Unif}(a, b)$.
    Since the probability has to integrate to one over the interval, it has to be
    $1/(b - a)$. The uniform density function is given by


    ```

    \(\text{Unif}(x|a, b) = \left\{ \begin{array}{ll} \frac{1}{b-a} & \text{for }
    a < x < b \\ 0 & \text{otherwise} \end{array} \right.\)

    ```


    while the cumulative distribution function is


    ```

    \(\left\{ \begin{array}{ll} 0 & \text{for } x < a \\ \frac{x-a}{b-a} & \text{for
    } a \le x \le b \\ 1 & \text{for } x > b \end{array} \right.\)

    ```


    Figure 2.12 gives a graphical illustration. The continuous uniform density function
    can be viewed as the limit of its discrete equivalent, when the set of all possible
    results includes every point in the interval $(a, b)$. Its expectation is given
    by


    ```

    \(\mathbb{E}[x] = \int_a^b \frac{1}{b-a} x dx = \left[ \frac{x^2}{2(b-a)} \right]_a^b
    = \frac{b^2 - a^2}{2(b-a)} = \frac{a+b}{2}.\)

    ```


    The variance on the other hand is


    ```

    \(\text{var}[x] = \int_a^b \frac{1}{b-a} \left( x - \frac{a+b}{2} \right)^2 dx
    = \left[ \frac{1}{3(b-a)} \left( x - \frac{a+b}{2} \right)^3 \right]_a^b = \frac{1}{12}(b-a)^2.\)

    ```'
