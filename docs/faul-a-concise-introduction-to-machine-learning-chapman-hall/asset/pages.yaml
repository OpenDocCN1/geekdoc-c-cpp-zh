- pgno: 291
  md: '![](img/d3c00252180686426c9e63ab889b535b_291_0.png)


    (a) True function, prediction, bias and constructed basis functions.


    ![](img/d3c00252180686426c9e63ab889b535b_291_1.png)


    (b) Error at training points.


    Figure 9.1: Two layer neural network regression with a set of three hidden neurons.


    # 9.2 Error Backpropagation


    For all neural networks, an error function E(w) needs to be minimized. A necessary
    condition for a minimum is that the gradient \(\nabla E(\mathbf{w})\) vanishes,
    where the gradient is the vector formed from the derivatives of E(w) with respect
    to each component of w, that is each \(w_i^{(l)}\). Hence, one possible technique
    is to calculate the gradient, set it to zero and solve for the weights. In most
    cases this is not feasible. Iterative techniques on the other hand use the fact
    that the gradient evaluated for a particular w points in the direction of the
    steepest ascent. Thus, its negative gives the direction in which the function
    decreases most rapidly. The simplest iterative technique is gradient descent and
    updates the current weight vector w by a step along the negative gradient,


    ```

    \mathbf{w}^{new} = \mathbf{w} - \eta \nabla E(\mathbf{w}),

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'where the step size $\eta > 0$ is called the learning rate. It is also called
    *steepest descent*. There are more sophisticated methods such as *conjugate gradients*
    and *quasi-Newton methods*. Optimization is, however, not the purpose of this
    text. More information on this topic can be found in [14].


    The error functions all involve a sum over the training data, which can be written
    as


    $E(\mathbf{w}) = \sum_{n=1}^N E_n(\mathbf{w})$.


    Since the derivative of a sum is the sum of derivatives, it follows


    $\nabla E(\mathbf{w}) = \sum_{n=1}^N \nabla E_n(\mathbf{w})$.


    There are now several possibilities to update the weight vector $\mathbf{w}$.


    +   Calculating $\nabla E_n(\mathbf{w})$ for all $n$ and thus using $\nabla E(\mathbf{w})$
    in the chosen optimization method are known as batch methods.


    +   When $\mathbf{w}$ is updated using only a subset $\mathcal{S}$ of training
    data, that is $\sum_{\mathcal{S}} \nabla E(\mathbf{w})$ is used in the optimization
    method, then these are *mini-batch methods*. The batch size and how the mini-batches
    are chosen are design choices. Often the training data is partitioned randomly
    several times. If the optimization method is gradient descent, this is known as
    *mini-batch gradient descent*.


    +   If only one $\nabla E_n(\mathbf{w})$ is used, when updating $\mathbf{w}$,
    the method is *online*, *sequential* or *stochastic*. The algorithm either cycles
    through the training data or selects training samples randomly with replacement.
    It is called *online gradient descent*, *sequential gradient descent* or *stochastic
    gradient descent*, if the optimization method is gradient descent.


    Mini-batch and stochastic methods have the advantage that a local minimum of an
    individual $E_n(\mathbf{w})$ or a set $\sum_S E(\mathbf{w})$ will generally not
    be a local minimum for a different choice of $n$ or $\mathcal{S}$. Thus, it escapes
    from local minima. They also are more efficient with duplicates in the training
    set, since only a selection of training data is seen in each update anyway, while
    when all training data are used, the duplicates add computational overhead.


    To calculate $\nabla E_n(\mathbf{w})$, the chain rule is used multiple times,
    since the output is the result of applying a chain of linear propagation functions
    alternating with activation functions.


    We first consider the task of regression. In this case,


    $E_n(\mathbf{w}) = \frac{1}{2} \|\mathbf{y}(\mathbf{x}_n, \mathbf{w}) - \mathbf{t}_n\|^2
    = \frac{1}{2} \sum_{k=1}^K (y_k(\mathbf{x}_n, \mathbf{w}) - t_{nk})^2$

    $= \frac{1}{2} \sum_{k=1}^K \left(a_k^{(L)}(\mathbf{x}_n, \mathbf{w}) - t_{nk}\right)^2$,'
  merge: -1
  img_proc: true
