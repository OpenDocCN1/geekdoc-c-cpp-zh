- pgno: 115
  md: '![](img/d3c00252180686426c9e63ab889b535b_115_0.png)


    Figure 4.5: Fisher''s Discriminant Analysis.


    as small as possible, since then the projected samples are close to the projected
    mean. This is known as the *within-class scatter* of the projected samples. Depending
    on **w**, Fisher defined the separation **w** achieves by


    ```

    $$s(\mathbf{w}) = \frac{\mathbf{w}^T(\boldsymbol{\mu}_0 - \boldsymbol{\mu}_1)(\boldsymbol{\mu}_0
    - \boldsymbol{\mu}_1)^T\mathbf{w}}{\mathbf{w}^T(\boldsymbol{\Sigma}_0 + \boldsymbol{\Sigma}_1)\mathbf{w}}.$$

    ```


    This function needs to be maximized. Or in other words, we maximize the ratio
    of the variance between projected classes to the variance within projected classes.


    The function s(w) takes its maximum, where the *gradient* vector vanishes. The
    gradient \(\nabla s(\mathbf{w})\) is the vector formed by the derivatives of s(w)
    with respect to each of the components of **w**. Using the quotient rule of differentiation,
    the formula given in Appendix A.2.3 and the symmetry of covariance matrices and
    outer products, the gradient is given by


    ```

    $$2 \frac{(\mathbf{w}^T(\boldsymbol{\Sigma}_0 + \boldsymbol{\Sigma}_1)\mathbf{w})(\boldsymbol{\mu}_0
    - \boldsymbol{\mu}_1)(\boldsymbol{\mu}_0 - \boldsymbol{\mu}_1)^T\mathbf{w} - ((\boldsymbol{\mu}_0
    - \boldsymbol{\mu}_1)^T\mathbf{w})^2(\boldsymbol{\Sigma}_0 + \boldsymbol{\Sigma}_1)\mathbf{w}}{(\mathbf{w}^T(\boldsymbol{\Sigma}_0
    + \boldsymbol{\Sigma}_1)\mathbf{w})^2} = 2 \frac{(\boldsymbol{\mu}_0 - \boldsymbol{\mu}_1)^T\mathbf{w}}{\mathbf{w}^T(\boldsymbol{\Sigma}_0
    + \boldsymbol{\Sigma}_1)\mathbf{w}}\boldsymbol{\mu}_0 - \boldsymbol{\mu}_1) -
    2 \left( \frac{(\boldsymbol{\mu}_0 - \boldsymbol{\mu}_1)^T\mathbf{w}}{\mathbf{w}^T(\boldsymbol{\Sigma}_0
    + \boldsymbol{\Sigma}_1)\mathbf{w}} \right)^2 (\boldsymbol{\Sigma}_0 + \boldsymbol{\Sigma}_1)\mathbf{w}.$$

    ```


    Setting this to zero and rearranging, we arrive at:


    ```

    $$\mathbf{w} = \frac{\mathbf{w}^T(\Sigma_0 + \Sigma_1)\mathbf{w}}{(\boldsymbol{\mu}_0
    - \boldsymbol{\mu}_1)^T\mathbf{w}}(\Sigma_0 + \Sigma_1)^{-1}(\boldsymbol{\mu}_0
    - \boldsymbol{\mu}_1)$$

    ```'
