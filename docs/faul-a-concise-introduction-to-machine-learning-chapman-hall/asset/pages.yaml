  md: 'assumption is that each coefficient is a *a priori* normally distributed with
    mean zero and variance \(\alpha^{-1}\). The multivariate distribution of \(\mathbf{c}\)
    is given by


    \(p(\mathbf{c}|\alpha) = \left(\frac{\alpha}{2\pi}\right)^{M/2} \exp\left(-\frac{\alpha}{2}\mathbf{c}^T\mathbf{c}\right).\)


    In the absence of any other knowledge, this is one possible assumption. \(\alpha\)
    is a hyperparameter and known as the precision of the distribution. If \(\alpha\)
    becomes very large, the distribution becomes peaked at its mean and we have more
    confidence in the value than if \(\alpha\) is small and the width of the distribution
    large.


    After observing \(N\) samples of the dependent variable \(\mathbf{t}\), the *posterior
    distribution* of the coefficients \(\mathbf{c}\) is given by


    \(p(\mathbf{c}|\mathbf{t}, \mathbf{D}, \alpha, \sigma^2) \propto p(\mathbf{t}|\mathbf{D},
    \mathbf{c}, \sigma^2)p(\mathbf{c}|\alpha).\)


    An estimate of \(\mathbf{c}\) could be obtained by choosing the \(\mathbf{c}\)
    where the posterior distribution or equivalently its logarithm is maximal,


    \(\log p(\mathbf{c}|\mathbf{t}, \mathbf{D}, \alpha, \sigma^2) \propto \log p(\mathbf{t}|\mathbf{D},
    \mathbf{c}, \sigma^2) + \log p(\mathbf{c}|\alpha).\)


    The first term is exactly the log likelihood (8.1), which is maximized when \(\|\mathbf{t}
    - \mathbf{D}\mathbf{c}\|^2\) is minimal. The second term \(-\frac{\alpha}{2}\|\mathbf{c}\|^2
    + \text{a constant}\), and can be regarded as the negative of a penalty term.
    In fact, taking the negative logarithm of the posterior distribution and then
    minimizing instead of maximizing has re-created the ridge regression.


    More generally, let \(\boldsymbol{\alpha}\) contain all parameters governing the
    joint distribution \(p(\mathbf{t}, \mathbf{c}|\mathbf{D}, \boldsymbol{\alpha},
    \sigma^2)\). We remove the dependency on the latent variables by integrating over
    the coefficients \(\mathbf{c}\), thus averaging over all possible solutions. This
    is called *marginalizing* over \(\mathbf{c}\) and the result is the *marginal
    likelihood*


    \(\mathcal{L}(\mathbf{t}|\mathbf{D}, \boldsymbol{\alpha}, \sigma^2) = \int p(\mathbf{t},
    \mathbf{c}|\boldsymbol{\alpha}, \sigma^2) d\mathbf{c},\)


    which we aim to maximize. The Maximum-Likelihood Estimate (*MLE*) for \(\boldsymbol{\alpha}\)
    are the values that maximize \(\mathcal{L}(\mathbf{t}|\mathbf{D}, \boldsymbol{\alpha},
    \sigma^2)\). In the following section we introduce a technique to find a maximum.


    # 8.12 Expectation-Maximization


    In the following, we suppress the dependency of the model on the design matrix
    \(\mathbf{D}\). The Expectation-*Maximization* (*EM*) algorithm arrives at a maximum
    iteratively by alternating between two steps. The derivation requires some expansion.


    By the chain rule, also known as the *product rule*, we have


    \(p(\mathbf{t}, \mathbf{c}|\boldsymbol{\alpha}, \sigma^2) = p(\mathbf{c}|\mathbf{t},
    \boldsymbol{\alpha}, \sigma^2)p(\mathbf{t}|\boldsymbol{\alpha}, \sigma^2).\)'
