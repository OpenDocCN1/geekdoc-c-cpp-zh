    through with $\Sigma_k$, but this time from both sides:


    $$\sum_{n=1}^N p(z_{n,k} = 1 | \mathbf{v}_n) [\Sigma_k - (\mathbf{v}_n - \mu_k)(\mathbf{v}_n
    - \mu_k)^T] = 0.$$


    Solving for $\Sigma_k$, we arrive at


    $$\Sigma_k = \frac{1}{N_k} \sum_{n=1}^N p(z_{n,k} = 1 | \mathbf{v}_n) (\mathbf{v}_n
    - \mu_k)(\mathbf{v}_n - \mu_k)^T. \quad (6.8)$$


    The formula is very similar to (4.2) for the sample covariance. The main difference
    is that the sum is over all samples and that each summand is weighted by the responsibility
    that process $k$ generated this sample.


    To summarize, the Gaussian mixture algorithm proceeds as follows


    +   1. Choose $K$ and convergence threshold.

    +   2. Initialize means $\mu_k$, covariances $\Sigma_k$, and mixing coefficients
    $\pi_k$ for $k = 1, \dots, K$, and calculate the initial value of the logarithm
    of the likelihood according to (6.3).

    +   3. For $n = 1, \dots, N$ and $k = 1, \dots, K$, calculate all the responsibilities
    $p(z_{n,k} = 1 | \mathbf{v}_n)$.

    +   4. Use these responsibilities to update means $\mu_k$, covariances $\Sigma_k$,
    and mixing coefficients $\pi_k$ for $k = 1, \dots, K$ according to equations (6.7),
    (6.8) and (6.5).

    +   5. Evaluate the change in the logarithm of the likelihood and terminate if
    this is below the convergence threshold. Otherwise return to step 3.


    Alternatively, the algorithm converges if the change in all parameters is below
    the convergence threshold. It is common to use the $K$ means algorithm to obtain
    good initializations. The means are initialized to the cluster centres obtained
    from the $K$ means procedure, while the covariances are set to the sample covariances
    of the clusters, and the mixing coefficients are initially the fractions of data
    samples assigned to a particular cluster.'
