- pgno: 253
  md: 'where we used the fact that \((\mathbf{Dv}_i)^T \mathbf{Dv}_j = \lambda_i\),
    if \(i = j\) and zero otherwise. Thus the predictions are closest, if all eigenvectors
    with non-zero eigenvalues are used. Using the decomposition of \(\mathbf{t}\),
    we have


    ```

    \((\mathbf{Dv}_i)^T \mathbf{t} = \sum_{k=1}^K a_k \mathbf{v}_i^T \mathbf{D}^T
    \mathbf{D} \mathbf{v}_k + \mathbf{v}_i^T \mathbf{D}^T \mathbf{a} = a_i \lambda_i,\)

    ```


    where we again made use of the orthogonality. Inserting this into the distance
    between \(\mathbf{t}\) and \(\mathbf{f}\), we obtain


    ```

    \(\|\mathbf{t} - \mathbf{f}\|^2 = \mathbf{t}^T \mathbf{t} - \sum_{i=1}^K a_i^2
    \lambda_i.\)

    ```


    If sparsity is required and not all eigenvectors can be used, those for which
    \(a_i^2 \lambda_i\) is largest should be chosen. However, this implicitly depends
    on the data \(\mathbf{t}\) via the coefficient \(a_i\), and can cause the model
    to not generalize well to unseen data. To avoid this, it is customary to choose
    the eigenvectors with the largest eigenvalues. It should be noted here that determining
    the eigenvectors and eigenvalues of a matrix is not a trivial matter in itself,
    especially if \(M\) is large.


    Note that generating new regressors is equivalent to generating new features.
    These new features are linear combinations of the original features.


    Principal component regression does not address the correlation with the regressand.
    The method presented in the next section does so.


    # ## 8.9 Partial Least Squares


    _Partial Least Squares (PLS)_ aims to maximize the correlation between regressors
    and regressand. This time a new set of regressors is generated iteratively as
    linear combinations of the original regressors; in the first iteration say


    ```

    \(z_1 \mathbf{D}_1 + \dots + z_M \mathbf{D}_M = \mathbf{Dz}.\)

    ```


    Without loss of generality, we can assume \(\|\mathbf{Dz}\| = 1\), since regressors
    are invariant to scaling.


    The matrix \(\mathbf{D}^T \mathbf{t} \mathbf{t}^T \mathbf{D}\) is a symmetric,
    positive semi-definite \(M \times M\) matrix, since


    ```

    \((\mathbf{D}^T \mathbf{t} \mathbf{t}^T \mathbf{D})^T = \mathbf{D}^T \mathbf{t}
    \mathbf{t}^T \mathbf{D} \text{ and } \mathbf{v}^T \mathbf{D}^T \mathbf{t} \mathbf{t}^T
    \mathbf{D} \mathbf{v} = (\mathbf{v}^T \mathbf{D}^T \mathbf{t})^2 \ge 0.\)

    ```


    It has \(M\) non-negative eigenvalues and corresponding orthonormal eigenvectors
    \(\mathbf{v}_1, \dots, \mathbf{v}_M\), where the eigenvectors are ordered with
    regards to the corresponding eigenvalues from largest to smallest.


    Now \(\mathbf{z} \in \mathbb{R}^M\), and thus can be expressed as a linear combination
    of these eigenvectors:


    ```

    \(\mathbf{z} = \hat{z}_1 \mathbf{v}_1 + \dots + \hat{z}_M \mathbf{v}_M.\)

    ```'
