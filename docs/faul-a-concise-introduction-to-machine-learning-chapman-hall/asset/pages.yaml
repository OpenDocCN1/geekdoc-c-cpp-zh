- pgno: 104
  md: 'We illustrate with an example generating samples of a target distribution which
    is normal with mean and variance


    ```

    \(\mu = \begin{pmatrix} 2 \\ 3 \end{pmatrix}, \quad \Sigma = \begin{pmatrix} 1
    & 3/2 \\ 3/2 & 3 \end{pmatrix}\)

    ```


    Listing 3.3 implements the Metropolis algorithm for this example. The question
    is, how should \(\sigma^2\) be chosen? Here the univariate variances of the distribution
    differ a lot depending on which direction is considered. The smallest and largest
    variances are given by the eigenvalues of \(\Sigma\), which are \(\sigma^2_{\min}
    \approx 0.2\) and \(\sigma^2_{\max} \approx 3.8\). The variance of the proposal
    distribution, \(\sigma^2\), should be of the magnitude of the smallest variance.
    Or in other words the standard deviation of the proposal distribution should be
    approximately the same as the smallest standard deviation of the target distribution,
    \(\sigma = \sigma_{\min}\). This choice ensures that not too many candidates are
    rejected by being too far away in the direction of the smallest standard deviation.
    The direction of the largest standard deviation is explored by means of a random
    walk. Listing 3.3 makes this choice for \(\sigma\).


    Also the start of the Markov chain needs to be chosen carefully to ensure the
    state space is explored in relatively few steps. The technique known as burn-in
    discards the first elements of a Markov chain and restarts the chain from the
    state it reached. Strictly speaking, this is not necessary. The elements of a
    Markov chain will be a good set of samples as long as the chain is long enough.
    Listing 3.3 sets the first element to the mean \(\mu\) of the target distribution.
    Of course, these choices for \(\sigma\) and \(\mathbf{x}_1\) are only possible
    if this is known about the target distribution. In any case, good estimates for
    these are necessary.


    These considerations are illustrated in Figure 3.7 which depicts (+) the generated
    random walks along with the candidates which were rejected (-) and the 95% confidence
    ellipse of the target distribution for different choices. The confidence ellipse
    gives the area where 95% of samples of the target distribution are expected to
    lie.


    Figure 3.7a used \(\mathbf{x}_1 = \mu\) and \(\sigma = \sigma_{\min}\). The state
    space is well explored. About two thirds of candidates are accepted. This means
    that one third of samples coincide with another sample. In Figure 3.7b the starting
    position was moved to \((0,0)''\). The acceptance ratio is about the same as before,
    but the state space is less well explored. The algorithm needs to run for longer.
    Figure 3.7c used \(\sigma = 2 \times \sigma_{\min}\). About 87% of candidates
    are accepted, but the algorithm moves more slowly through the state space. Again
    it needs to run longer to explore the state space. In Figure 3.7d the standard
    deviation of the proposal distribution was doubled as compared to Figure 3.7a.
    The acceptance rate dropped to 43%. This means that more than half of samples
    share their location. This does not matter, if the expectation is to be calculated
    and the appropriate weighting is applied. If the aim is however to explore the
    state space, a higher acceptance rate is more desirable.'
