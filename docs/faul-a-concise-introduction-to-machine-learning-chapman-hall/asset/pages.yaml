    The calculations simplify under the assumption \(\Sigma_0 = \Sigma_1 = \Sigma\).
    This is known as _Linear Discriminant Analysis (LDA)_. The vector \(\mathbf{w}\)
    is set to \(\Sigma^{-1}(\mu_0 - \mu_1)\), since scaling can be neglected and the
    separation threshold is the projection of the midpoint between the means:


    \(b = \mathbf{w}^T \frac{1}{2} (\mu_0 + \mu_1) = \frac{1}{2} (\mu_0^T \Sigma^{-1}
    \mu_0 - \mu_1^T \Sigma^{-1} \mu_1).\)


    In the iris example, which we considered so far, the classes do not have the same
    covariance.


    # ## 4.4 Multiple Classes


    We now consider more than two classes, while we continue to assume that they have
    the same sample covariance matrix. Let \(K\) be the number of classes. For each
    class \(C_i\) we calculate the mean \(\mu_i\). Let \(\mu\) be the mean of the
    class means


    \(\mu = \frac{1}{K} \sum_{i=1}^K \mu_i.\)


    The between-class scatter is defined as


    \(\Sigma_b = \frac{1}{K} \sum_{i=1}^K (\mu_i - \mu) (\mu_i - \mu)^T.\)


    The separation between classes in the direction of \(\mathbf{w}\) is given by


    \(s(\mathbf{w}) = \frac{\mathbf{w}^T \Sigma_b \mathbf{w}}{\mathbf{w}^T \Sigma
    \mathbf{w}}.\)


    To separate \(K\) classes we need to find \(K-1\) directions \(\mathbf{w}_1, \dots,
    \mathbf{w}_{K-1}\) for which \(s(\mathbf{w})\) is maximal. This is equivalent
    to maximizing


    \(S(\mathbf{W}) = \frac{|\mathbf{W}^T \Sigma_b \mathbf{W}|}{|\mathbf{W}^T \Sigma
    \mathbf{W}|},\)


    where \(\mathbf{W}\) denotes the matrix whose columns are the vectors \(\mathbf{w}_1,
    \dots, \mathbf{w}_{K-1}\) and \(|\cdot|\) denotes the determinant of the matrix.
