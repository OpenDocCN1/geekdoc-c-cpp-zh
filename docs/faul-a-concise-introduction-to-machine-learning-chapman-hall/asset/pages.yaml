  md: '# # Probability Theory


    The concepts in probability theory needed for machine learning are introduced.
    These include independence, rules of probability, Simpson''s paradox, probability
    mass and density functions, cumulative distribution functions, and the definitions
    of expectation, variance and moments. The probability mass and density functions
    used throughout the book are introduced and their connections explained. Further
    functions of random variables are explored as well as conjugacy of probability
    distributions and their application to prior and posterior probability distributions.
    The chapter concludes with graphical representations of random variables and their
    dependencies and parameters.


    # ## 2.1 Independence, Probability Rules and Simpson''s Paradox


    In the introduction we have seen that learning is not possible without experiences
    which can be obtained from repeating experiments. To formalize this we need to
    quantify the different outcomes of the experiments, and probability theory lends
    itself to that. Ross gives a very good introduction in [36]. An example is given
    of a fair die; each number is equally probable with the probability being 1/6.
    The probabilities for getting heads or tails when flipping a coin are equal, 1/2.
    Here the coin and die are random variables. They are discrete variables, since
    there are only finitely many different outcomes. That is when repeating the experiment,
    different outcomes are possible. To describe more complex situations, probabilities
    are combined. For example, the probability of getting heads and also rolling the
    number 3, is 1/2 x 1/6 = 1/12. This is called the joint probability of the coin
    and die and can be expressed in a grid.


    | | ⚀ | ⚁ | ⚂ | ⚃ | ⚄ | ⚅ |

    |---|---|---|---|---|---|---|

    | heads | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 |

    | tails | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 |'
