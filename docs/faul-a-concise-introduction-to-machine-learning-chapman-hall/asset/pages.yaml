- pgno: 269
  md: 'We then have


    $$ \mathbf{C}_* = \sigma^2 \mathbf{I} + \begin{pmatrix} \mathbf{D} \\ \mathbf{d}(\mathbf{x}_*)^T
    \end{pmatrix} \mathbf{A}^{-1} \left( \mathbf{D}^T \quad \mathbf{d}(\mathbf{x}_*)
    \right) = \begin{pmatrix} \mathbf{C} & \mathbf{v} \\ \mathbf{v}^T & v \end{pmatrix}
    $$


    where \(\mathbf{v} = \mathbf{D}\mathbf{A}^{-1}\mathbf{d}(\mathbf{x}_*)\) and \(v
    = \mathbf{d}(\mathbf{x}_*)^T \mathbf{A}^{-1} \mathbf{d}(\mathbf{x}_*) + \sigma^2\).
    Note that \(\mathbf{C}_*\) is symmetric.


    Using the formulae for block matrices we have


    $$ |\mathbf{C}_*| = |\mathbf{C}| |v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}|
    $$


    and


    $$ \mathbf{C}_*^{-1} = \begin{pmatrix} \mathbf{C}^{-1} + \frac{\mathbf{C}^{-1}
    \mathbf{v} \mathbf{v}^T \mathbf{C}^{-1}}{v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}}
    & -\mathbf{C}^{-1} \mathbf{v} \frac{1}{v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}}
    \\ -\mathbf{v}^T \mathbf{C}^{-1} \frac{1}{v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}}
    & \frac{1}{v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}} \end{pmatrix} $$


    Letting \(\mathbf{t}_*^T = (t_1, ..., t_N, t_*)\), we can calculate


    $$ \mathbf{t}_*^T \mathbf{C}_*^{-1} \mathbf{t}_* = \mathbf{t}^T \mathbf{C}^{-1}
    \mathbf{t} + \frac{1}{v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}} (\mathbf{v}^T
    \mathbf{C}^{-1} \mathbf{t} - t_*)^2 $$


    Thus the logarithm of the marginal likelihood \(\log \mathcal{L}(\mathbf{t}|\mathbf{x},
    \sigma^2)\) is \(\mathcal{L}(\mathbf{t}|\mathbf{x}, \sigma^2) + \Delta \mathcal{L}\),
    where


    $$ \Delta \mathcal{L} = -\frac{1}{2} \left[ \log 2\pi + \log |v - \mathbf{v}^T
    \mathbf{C}^{-1} \mathbf{v}| + \frac{1}{v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v}}
    (\mathbf{v}^T \mathbf{C}^{-1} \mathbf{t} - t_*)^2 \right] . $$


    This change can be interpreted probabilistically. Using the Woodbury matrix identity
    from Appendix A.1.3 again, \(\mathbf{\Sigma}\) is related to \(\mathbf{C}^{-1}\)
    by


    $$ \mathbf{\Sigma} = \mathbf{A}^{-1} - \mathbf{A}^{-1} \mathbf{D}^T \mathbf{C}^{-1}
    \mathbf{D} \mathbf{A}^{-1} , $$


    The predictive distribution for \(t_*\) has variance and mean


    $$ \sigma_*^2 = \sigma^2 + \mathbf{d}(\mathbf{x}_*)^T \Sigma \mathbf{d}(\mathbf{x}_*)
    $$\n$$ = \sigma^2 + \mathbf{d}(\mathbf{x}_*)^T (\mathbf{A}^{-1} - \mathbf{A}^{-1}
    \mathbf{D}^T \mathbf{C}^{-1} \mathbf{D} \mathbf{A}^{-1}) \mathbf{d}(\mathbf{x}_*)
    $$\n$$ = \sigma^2 + \mathbf{d}(\mathbf{x}_*)^T \mathbf{A}^{-1} \mathbf{d}(\mathbf{x}_*)
    - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v} = v - \mathbf{v}^T \mathbf{C}^{-1} \mathbf{v},
    \quad (8.10) $$


    $$ m_* = \mathbf{d}(\mathbf{x}_*)^T \mu = \sigma^{-2} \mathbf{d}(\mathbf{x}_*)^T
    \Sigma \mathbf{D}^T \mathbf{t} = \mathbf{v}^T \mathbf{C}^{-1} \mathbf{t} , $$


    where we used the fact that \(\mathbf{D} \mathbf{A}^{-1} \mathbf{D}^T = \mathbf{C}
    - \sigma^2 \mathbf{I}\). Thus \((\mathbf{v}^T \mathbf{C}^{-1} \mathbf{t} - t_*)^2\)
    is the square of the difference of the sample measurement and its mean predicted
    by the current model.


    Thus, the change in the log evidence is


    $$ \Delta \mathcal{L} = -\frac{1}{2} \left[ \log 2\pi + \log \sigma_*^2 + \frac{(m_*
    - t_*)^2}{\sigma_*} \right] $$\n$$ = \log \frac{1}{\sqrt{2\pi \sigma_*^2}} \exp
    \left( - \frac{(m_* - t_*)^2}{2 \sigma_*^2} \right) . $$'
