    it travels away from the coverage area of this antenna and into the coverage area
    of another antenna. It might also get a new frequency from another antenna further
    away, if the antenna which it is connected to currently needs to serve more mobiles.
    To assess the coverage of the mobile network of a large area, mobile phone usage
    would be simulated in this area, including handovers between antennae. When the
    simulations were first coded, programmers did not include code paths for cases,
    which were possible, but improbable. With increased mobile phone usage, the probabilities
    changed. Inserting these now necessary code paths into large often undocumented
    pieces of code caused some problems. The moral of the story is that all cases,
    even the improbable ones, need to be coded and documented. It is even wise to
    include the impossible ones, because somewhere someone will change the code and
    they become possible.


