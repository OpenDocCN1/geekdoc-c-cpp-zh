- pgno: 283
  md: '# # Feature Learning


    This chapter concentrates on inferring the building blocks which are essential
    for an adequate model of the data. Neural networks are revisited and their many
    variations explained, especially how design choices such as activation (propagation
    functions) and error functions depend on the task at hand. Error backpropagation
    is derived in generality as the application of the chain rule when differentiating
    the different error functions. Autoencoders are introduced as very simple network
    architecture and illustrated with an extensive example showing how neural networks
    create a model space for the data. The relationships to other techniques are explored
    to gain an intuitive understanding of the mechanisms at work. The chapter concludes
    with a Bayesian treatment of inferring the model space, illustrated by the Indian
    Buffet Process.


    In the previous chapter, the choice of model space was still largely governed
    by the user, making a choice on basis functions or kernels to be used. The data
    can inform these choices or optimize parameters of the basis functions or kernels.
    If the basis functions are kernels centred at the data, the data has influence
    also this way. However, the shape is still very much up to user choice.


    In this chapter, we explore the possibility of the data deciding the model space.
    To do so, many examples of data generated from the same process are necessary.
    For example, the MNIST data set of [26], where the generating process was people
    writing digits, contains 60,000 images of size 28 x 28 pixels of handwritten digits.
    The objective is a technique which generates a model space where all samples are
    equally well represented, if reconstruction is the objective, or separated for
    classification.


    One drawback is that this is only possible where enough reliable data is seen.
    While it is possible to have some samples, where some features are not given or
    given with non-negligible error, there need to be sufficiently many samples where
    these features have reliable values. This is known as _veracity_ and is one of
    the four _V''s of Big Data_. The other three are _volume_, _velocity_ and _variety_.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'On the one hand, large volumes of data are necessary to cope with missing or
    corrupted parts of the data. On the other hand, processing such large volumes
    of data is a challenge in itself. The Sentinel satellites of the European Space
    Agency are expected to eventually gather four Terabytes of data per day. These
    are only twelve satellites of the 4000 plus satellites orbiting earth.


    The Large Hadron Collider at CERN creates 20,000,000 collisions per second. Thus
    new data arrives at extraordinary velocity. Only 400 per second are recorded as
    interesting. This results in 3,000 Terabytes of data per year.


    The Electronic Control Units (ECUs) in a car record several thousands of signals
    approximately every quarter of a second. These relate to many different quantities
    and states, each of which has its own meaning and interpretation. The essential
    information needs to be extracted from the variety of data.


    Sometimes this takes an unexpected form as in Figures 7.3 and 7.4 of the principal
    component representation of hand-written digits from the MNIST data set. However,
    there the goal was to make the digits machine identifiable, not recognizable for
    a human. We will again use this data set in this chapter.


    # 9.1 Neural Networks


    As before we are given data pairs (x1, t1), ..., (xN, tN), where xn ∈ RD and each
    component of xn is a feature. Also tn can be multidimensional, that is tn ∈ RK.


    Recall that a neural network consists of a set of input neurons, a set of output
    neurons and possibly several sets of hidden neurons. Each component of xn is passed
    to one input neuron. Therefore, the number of input neurons is D. During training,
    the results of the output neurons are compared to tn. Hence, the number of output
    neurons is K. The synapses connecting one set of neurons to another are a layer.


    More specifically, let L be the number of layers. This means that there are L-1
    sets of hidden neurons. The size of the lth set of hidden neurons is Ml. The latent
    variables of the hidden neurons are denoted by zml, l = 1, ..., L-1, m = 1, ...,
    Ml. In the lth layer, the weight of the synapse connecting the i th neuron on
    the left to the j th neuron on the right is denoted by wji(l). This neural'
