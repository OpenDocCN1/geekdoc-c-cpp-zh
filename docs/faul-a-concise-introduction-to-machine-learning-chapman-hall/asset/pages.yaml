- pgno: 227
  md: 'This way we can use the derivative formulae in Appendices A.2.4, A.2.7 and
    A.2.10. The derivative with respect to D is therefore


    ```

    \frac{\partial}{\partial \mathbf{D}} \mathbb{E}[\mathcal{L}] = -\frac{1}{2} \sum_{n=1}^N
    \left[ \frac{1}{|\mathbf{D}|} \mathbf{D}|\mathbf{D}|^{-1} \mathbf{D}^{-1} \text{diag}\left(
    (\mathbf{v}_n - \boldsymbol{\mu})(\mathbf{v}_n - \boldsymbol{\mu})^T \right. \right.
    \\

    \left. \left. -2(\mathbf{v}_n - \boldsymbol{\mu}) \mathbb{E}[\mathbf{u}_n]^T \mathbf{W}^T
    + \mathbf{W} \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T] \mathbf{W}^T \right] \mathbf{D}^{-1}
    \right].

    ```


    Setting this to zero, multiplying through by D from both left and right and solving
    for D, gives the following update formula


    ```

    \mathbf{D}_{\text{new}} = \text{diag}\left( \frac{1}{N} \sum_{n=1}^N (\mathbf{v}_n
    - \boldsymbol{\mu})(\mathbf{v}_n - \boldsymbol{\mu})^T \right. \\

    \left. -2 \frac{1}{N} \sum_{n=1}^N (\mathbf{v}_n - \boldsymbol{\mu}) \mathbb{E}[\mathbf{u}_n]^T
    \mathbf{W}^T \right. \\

    \left. + \frac{1}{N} \mathbf{W} \sum_{n=1}^N \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T]
    \mathbf{W}^T \right).

    ```


    It is common to use the already updated W_new, when updating D_new. When inserting
    formula (7.13) into the left of the last line, the sum over E[u_n u_n^T], n=1,...,N,
    cancels with its inverse and the last line combines with the one above. Hence,
    the update formula is


    ```

    \mathbf{D}_{\text{new}} = \frac{1}{N} \sum_{n=1}^N \text{diag} \left( (\mathbf{v}_n
    - \boldsymbol{\mu})(\mathbf{v}_n - \boldsymbol{\mu} - \mathbf{W}_{\text{new}}
    \mathbb{E}[\mathbf{u}_n])^T \right).

    ```


    This can be viewed as the D-dimensional version of (7.12).


    These updates depend on D and the previous W via the expectations, which are calculated
    in the E-step. To this end, the conditional probability distribution p(u|v) of
    the latent variable u given v has variance


    ```

    \mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}} = (\mathbf{W}^T \mathbf{D}^{-1} \mathbf{W}
    + \mathbf{I})^{-1},

    ```


    which is independent of v, and mean


    ```

    \boldsymbol{\mu}_{\mathbf{u}|\mathbf{v}} = \mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}}
    \mathbf{W}^T \mathbf{D}^{-1} (\mathbf{v} - \boldsymbol{\mu}).

    ```


    which depends on v. Therefore, the two calculations forming the E-step are


    ```

    \mathbb{E}[\mathbf{u}_n] = \mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}} \mathbf{W}^T
    \mathbf{D}^{-1} (\mathbf{v}_n - \boldsymbol{\mu})

    ```


    and using (2.10)


    ```

    \mathbb{E}[\mathbf{u}_n \mathbf{u}_n^T] = \mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}}
    + \mathbb{E}[\mathbf{u}_n] \mathbb{E}[\mathbf{u}_n]^T.

    ```'
  merge: -1
