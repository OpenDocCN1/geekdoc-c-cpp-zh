  md: 'We illustrate the capability of neural networks by training a two layer neural
    network with three hidden neurons to represent the function 1+x-sin x. The biases
    are modeled explicitly with dummy neurons which always have the value one. The
    network diagram is


    ![](img/d3c00252180686426c9e63ab889b535b_289_0.png)


    The activation function in the first layer is the hyperbolic tangent in the form


    $$h_1(x) = \frac{2}{1 + \exp(-2x)} - 1,$$


    also known as the _tan-sigmoid_ activation function, since this implementation
    is faster. In the second layer, it is the linear activation function. Twenty-one
    equally spaced training points are used. Once the neural network is trained, it
    can be evaluated for any input x. Figure 9.1a shows the results, the true function
    in red, the prediction in blue and the bias b in black. It also displays \(z_1
    w_1^{(2)}\), \(z_2 w_2^{(2)}\) and \(z_3 w_3^{(2)}\), which are all functions
    of the input x. The latent variables \(z_1, z_2\) and \(z_3\) can be interpreted
    as basis functions the neural network constructed from the data. The prediction
    is the weighted sum of these and the bias. The error at the training points is
    shown in 9.1b. Since the weights are initialized randomly and the optimization
    procedure might converge in a local and not a global optimum, the training outcome
    can be very different for different runs. Several runs of the script in Listing
    9.1 illustrate this. Modifying the script by for example increasing the number
    of hidden neurons or the number and selection of training points gives further
    insight. Such a two layer neural network can approximate any continuous function
    on a finite interval to arbitrary accuracy as long as there are sufficiently many
    hidden neurons and training data to calculate the weights.'
