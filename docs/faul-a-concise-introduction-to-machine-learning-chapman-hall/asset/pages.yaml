  md: 'Therefore, the first term in (8.4),


    \(\int q(c) \log \frac{p(t, c | \alpha, \sigma^2)}{q(c)} dc,\)


    is a lower bound for \(\log \mathcal{L}(t | \alpha, \sigma^2)\). The maximization
    is done by maximizing the lower bound by alternating between maximizing with respect
    to \(q(c)\) and with respect to \(\alpha\).


    Let \(\alpha^{(k)}\) be the current estimate of the maximal \(\alpha\). The lower
    bound is maximal with respect to \(q(c)\), if the Kullback-Leibler divergence
    is zero, that is, if \(q(c) = p(c | t, \alpha^{(k)}, \sigma^2)\). The next step
    is to find \(\alpha^{(k+1)}\) by maximizing


    \(\int p(c | t, \alpha^{(k)}, \sigma^2) \log \frac{p(t, c | \alpha, \sigma^2)}{p(c
    | t, \alpha^{(k)}, \sigma^2)} dc = \int p(c | t, \alpha^{(k)}, \sigma^2) \log
    p(t, c | \alpha, \sigma^2) dc - \int p(c | t, \alpha^{(k)}, \sigma^2) \log p(c
    | t, \alpha^{(k)}, \sigma^2) dc.\)


    The second term is independent of \(\alpha\). Hence only the first term is relevant
    for the maximization.


    Note: The first term is the *expectation* of the logarithm of the joint probability
    with respect to the current estimate of the posterior distribution. Hence the
    name *Expectation-Maximization* algorithm.


    # ## 8.13 Bayesian Learning


    As a specific example, let the prior distribution of \(c_i\) be normal with mean
    zero and variance \(\alpha_i^{-1}\). In other words, each weight has its own hyperparameter.
    Our starting point is that there is no covariance between different weights. That
    is the weights do not influence each other. The multivariate prior is given by


    \(p(c | \alpha) = (2\pi)^{-M/2} \prod_{m=1}^M \alpha_m^{1/2} \exp \left( - \frac{\alpha_m
    c_m^2}{2} \right) = (2\pi)^{-M/2} |\mathbf{A}|^{1/2} \exp \left( - \frac{1}{2}
    c^T \mathbf{A} c \right),\)


    where **A** is a diagonal matrix with entries \(A_{mn} = \alpha_m\), and \(|\mathbf{A}|\)
    denotes the determinant.


    The multivariate posterior distribution \(p(t | c, \mathbf{D}, \alpha, \sigma^2)\)
    is given by Bayes'' rule and is proportional to the product of the prior and the
    likelihood function:


    \(p(t | c, \mathbf{D}, \alpha, \sigma^2) = \frac{p(c | \alpha) \mathcal{L}(t |
    \mathbf{D}, c, \sigma^2)}{\int p(c | \alpha) \mathcal{L}(t | \mathbf{D}, c, \sigma^2)
    dc}.\) (8.5)'
