  md: '![](img/d3c00252180686426c9e63ab889b535b_229_0.png)


    (a) Data samples lying approximately on the unit sphere in two groups.


    ![](img/d3c00252180686426c9e63ab889b535b_229_1.png)


    (b) Projection onto two principal components after a transformation to a four-dimensional
    space.


    # Figure 7.7: Principal Component Analysis on a manifold.


    shifted images, which is the average of the outer products of the \(n^{th}\) column
    of \(\Phi(\mathbf{I} - \frac{1}{N}\mathbf{E})\) with its transpose. This can be
    written as


    \(\Sigma = \frac{1}{N} \sum_{n=1}^N \Phi(\mathbf{I} - \frac{1}{N}\mathbf{E})\mathbf{e}_n
    \mathbf{e}_n^T (\mathbf{I} - \frac{1}{N}\mathbf{E}) \Phi^T,\)


    where \(\mathbf{e}_n\) is the \(n^{th}\) standard unit basis vector, with all
    elements being equal to zero, apart from the \(n^{th}\) being one.


    Now, \(\Phi(\mathbf{I} - \frac{1}{N}\mathbf{E})\) and its transpose are independent
    of \(n\) in the summation and can be taken outside the sum. Summing \(\mathbf{e}_n
    \mathbf{e}_n^T\) over all \(n = 1, \dots, N\) results in the identity matrix.
    Further, the matrix \(\mathbf{I} - \frac{1}{N}\mathbf{E}\) is *idempotent*, which
    means any power of it is the matrix itself, since \(\mathbf{E}^2 = N\mathbf{E}\)
    and


    \((\mathbf{I} - \frac{1}{N}\mathbf{E})(\mathbf{I} - \frac{1}{N}\mathbf{E}) = \mathbf{I}
    - \frac{2}{N}\mathbf{E} + \frac{2}{N^2}\mathbf{E}^2 = \mathbf{I} - \frac{1}{N}\mathbf{E}.\)


    Therefore, the covariance matrix can be expressed as


    \(\Sigma = \frac{1}{N} \Phi(\mathbf{I} - \frac{1}{N}\mathbf{E}) \Phi^T.\)


    We seek the largest eigenvalues \(\lambda_k\) of \(\Sigma\) with corresponding
    eigenvectors \(\mathbf{w}_k, k = 1, \dots, K\). Using the above expression for
    \(\Sigma\), these vectors satisfy


    \(\Phi(\mathbf{I} - \frac{1}{N}\mathbf{E}) \Phi^T \mathbf{w}_k = N \lambda_k \mathbf{w}_k.\)


    Multiplying through with \((\mathbf{I} - \frac{1}{N}\mathbf{E}) \Phi^T\) from
    the left and using the idempotence of \(\mathbf{I} - \frac{1}{N}\mathbf{E}\),
    this becomes


    \((\mathbf{I} - \frac{1}{N}\mathbf{E}) \Phi^T \Phi (\mathbf{I} - \frac{1}{N}\mathbf{E})
    (\mathbf{I} - \frac{1}{N}\mathbf{E}) \Phi^T \mathbf{w}_k = N \lambda_k (\mathbf{I}
    - \frac{1}{N}\mathbf{E}) \Phi^T \mathbf{w}_k.\)'
