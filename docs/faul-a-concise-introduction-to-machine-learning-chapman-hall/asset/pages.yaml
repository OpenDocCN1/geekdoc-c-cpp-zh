- pgno: 313
  md: 'Again, it can be viewed as a neural network with two sets of hidden neurons.
    As before, the weights from the input neurons to the first set of hidden neurons
    are given by the entries of \(\mathbf{D}^T\), and from the second set of hidden
    neurons to the output neurons by the entries of \(\mathbf{D}\). The weights between
    the two sets of hidden neurons are given by the entries of \(\sigma^{-2}\boldsymbol{\Sigma}\).
    Since \(\boldsymbol{\Sigma} = (\mathbf{A} + \sigma^{-2}\mathbf{D}^T\mathbf{D})^{-1}\)
    and since the entries of \(\mathbf{A}\) are determined by maximizing the log evidence
    of \(\mathbf{t}\), the weights between the hidden neurons may depend on both the
    design matrix \(\mathbf{D}\) and \(t_1, \dots, t_D\). The number of hidden neurons
    in each set, \(M\), can change dynamically which is equivalent to the addition
    and deletion of basis functions. Equally, the number of input and output neurons
    can increase, if samples are taken at previously unseen locations.


    As before with ordinary least squares, a set of training data \(\mathbf{t}_1,
    \dots, \mathbf{t}_N\) can be used to infer the entries of \(\mathbf{D}\). Whenever
    \(\mathbf{D}\) is updated, \(\mathbf{A}\) needs to be updated by maximizing the
    log evidence of \(\mathbf{t}\) again.


    # 9.6 Indian Buffet Process


    The last section suggests a technique of inferring a model space with variable
    dimension. In this section, we consider the data generation process similar to
    the Chinese Restaurant Process in Section 6.6 where the number of clusters is
    unknown. Now the dimension of the latent feature space is unknown.


    As in the previous section, let \(\mathbf{t}_1, \dots, \mathbf{t}_N\) be a set
    of data samples in a \(D\) dimensional space. We assume that for \(n = 1, \dots,
    N\)

    \(\mathbf{t}_n = \mathbf{D}\mathbf{c}_n + \boldsymbol{\epsilon}_n,\)


    where \(\boldsymbol{\epsilon}_n\) is additive Gaussian noise with zero mean and
    variance \(\sigma^2\mathbf{I}\) specific to this data sample, the columns of the
    \(D \times M\) matrix \(\mathbf{D}\) represent latent features, and \(\mathbf{c}_n\)
    is the sample specific vector of coefficients.


    Commonly, this is represented as

    \(\mathbf{T} = \mathbf{C}\mathbf{D}^T + \mathbf{E},\)


    where \(\mathbf{T}\) is the \(N \times D\) matrix of data samples with each row
    being one sample, \(\mathbf{C}\) is the \(N \times M\) matrix of coefficients,
    and \(\mathbf{E}\) is a \(N \times D\) matrix with each entry being drawn from
    a normal distribution with zero mean and variance \(\sigma^2\). In this context,
    \(\mathbf{D}\) is the factor loading matrix and its columns are the factor loadings,
    while \(\mathbf{C}\) is the coordinate matrix.


    From the data generation viewpoint, we allow the number of columns in \(\mathbf{C}\)
    and number of rows in \(\mathbf{D}^T\), which is \(M\), to be infinite. While
    infinity is conceptually a difficult concept, it can be dealt with by imposing
    that only a finite, small number of entries in each row of \(\mathbf{C}\) are
    non-zero. In practical terms, this means that we only see a finite amount of data
    and each data sample is generated as a finite linear combination of features.
    Other features from the infinite set are those which we have not yet encountered
    in our data.'
