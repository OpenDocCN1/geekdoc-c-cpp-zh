  md: '![](img/d3c00252180686426c9e63ab889b535b_105_0.png)


    The Metropolis-Hastings algorithm extends the Metropolis method to use proposal
    distributions which are not symmetric. In this case, the acceptance probability
    of a candidate x* is calculated as


    ```

    \min \left( 1, \frac{f(\mathbf{x}^*) g(\mathbf{x}^*, \mathbf{x}_n)}{f(\mathbf{x}_n)
    g(\mathbf{x}_n, \mathbf{x}^*)} \right) = \min \left( 1, \frac{\hat{f}(\mathbf{x}^*)
    g(\mathbf{x}^*, \mathbf{x}_n)}{\hat{f}(\mathbf{x}_n) g(\mathbf{x}_n, \mathbf{x}^*)}
    \right).

    ```


    The transition probability from x to x̃ is given by


    ```

    T(\mathbf{x}, \tilde{\mathbf{x}}) = g(\mathbf{x}, \tilde{\mathbf{x}}) \min \left(
    1, \frac{\hat{f}(\tilde{\mathbf{x}}) g(\tilde{\mathbf{x}}, \mathbf{x})}{\hat{f}(\mathbf{x})
    g(\mathbf{x}, \tilde{\mathbf{x}})} \right).

    ```'
