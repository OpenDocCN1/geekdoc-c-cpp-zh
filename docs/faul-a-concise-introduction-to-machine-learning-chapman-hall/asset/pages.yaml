- pgno: 271
  md: 'The second term is the important one. If the predictive probability distribution
    does not match well the probability distribution estimated from the data in the
    neighbourhood, the expected change in the logarithm of the marginal likelihood
    is negative. This expected change creates an uncertainty map with the largest
    negative values being the most uncertain regions. The uncertainty map can guide
    the data gathering, informing us about where additional samples are necessary.


    Next we consider the problem of collinearity. When basis functions are added to
    the model, collinearity can be introduced. In this case the columns of D become
    linearly dependent or nearly linearly dependent. In practical terms, this means
    that then there are infinitely many models which explain the data equally well,
    since linear combinations of basis functions can be exchanged for each other.
    For example, assume that the basis functions are derived from a kernel k : R^d
    x R^d -> R. That is


    $d_i(\mathbf{x}) = k(\mathbf{x}, \mathbf{x}_i).$


    Thus the model space is dependent on the data. If two sampling points lie close
    together, then the corresponding basis functions are very similar and the corresponding
    columns of D are nearly linearly dependent, since the basis functions are evaluated
    at the same sampling points. In the following we derive a technique which checks
    for collinearity while the algorithm is executed.


    Since at initialization only one basis function is employed, the columns of D
    are at initialization linearly independent. Assume that the columns of D have
    remained linearly independent and that d_i(x) is a candidate basis function to
    be added to the model. Since the columns of D are linearly independent, d_i can
    be decomposed uniquely into two vectors, one lying in the space spanned by the
    columns of D and one lying in the orthogonal complement of this space:


    $\mathbf{d}_i = \mathbf{Da} + \mathbf{b},$


    where $\mathbf{D}^T\mathbf{b} = 0.$


    If $\|\mathbf{b}\| > 0$, then $\mathbf{d}_i$ is linearly independent of the columns
    of D and can be added to the model. We also want to avoid near linear dependency,
    or in other words small values of $\|\mathbf{b}\|.$


    Since the decomposition was orthogonal, we have


    $\|\mathbf{d}_i\|^2 = \|\mathbf{Da}\|^2 + \|\mathbf{b}\|^2.$


    While the length of $\mathbf{d}_i$ is known, the length of $\mathbf{Da}$ and $\mathbf{b}$,
    however, are unknown.


    Consider


    $$

    \begin{aligned}

    \sigma^2 S_i &= \sigma^2 \mathbf{d}_i^T \mathbf{C}^{-1} \mathbf{d}_i = \mathbf{d}_i^T
    (\mathbf{I} - \sigma^{-2} \mathbf{D} \mathbf{\Sigma} \mathbf{D}^T) \mathbf{d}_i
    \\

    &= (\mathbf{a}^T \mathbf{D}^T + \mathbf{b}^T) (\mathbf{I} - \sigma^{-2} \mathbf{D}
    \mathbf{\Sigma} \mathbf{D}^T) (\mathbf{D} \mathbf{a} + \mathbf{b}) \\

    &= \mathbf{a}^T \mathbf{D}^T \mathbf{D} (\mathbf{I} - \sigma^{-2} \mathbf{\Sigma}
    \mathbf{D}^T \mathbf{D}) \mathbf{a} + \mathbf{b}^T \mathbf{b},

    \end{aligned}

    $$'
