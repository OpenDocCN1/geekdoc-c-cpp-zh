  md: 'The above relies on the fact that the classes are balanced. Imbalanced classes
    have their own challenges. For example, if there are 9 times more samples of one
    class than of the other class, a classifier which always assigns the first class
    will be correct 90% of the time. However, it classifies the second class incorrectly
    all the time. For more information on tackling imbalanced classes see for example
    [21].


    So far we have not considered the cost of acquiring features. The sources of cost
    can be quite varied. For example, when considering the computational cost, it
    can be the low cost associated with a simple algorithm. At the other end of the
    scale are computationally intensive algorithms which require also large storage.
    There is also the difference between cheap and expensive diagnostic tools. It
    is easy and inexpensive to check the oil level in ones car, beyond that however,
    often a car mechanic is required, whose hourly rate is a considerable cost. Then
    there is also the human cost. Invasive procedures put much more strain on a patient
    than a simple medical test.


    A cascade is a procedural method which takes into account the cost. Each stage
    of a cascade of classifiers uses features with increasing predictive power and
    increasing cost. For example, in medical diagnosis a general practitioner first
    does a simple inexpensive test which can exclude a diagnosis. Should the test,
    however, reveal the possibility of an underlying health problem, the patient can
    be referred for further tests.


    Let class $C_0$ be the *negatives* and class $C_1$ be the *positives*. The number
    of samples in $C_0$ is commonly denoted N, while the number of samples in $C_1$
    is denoted P.


    A *confusion matrix* visualizes the goodness of a classifier by listing the number
    of samples of $C_0$ correctly classified, known as *true negatives*, TN, the number
    of samples of $C_0$ misclassified, which are the false *positives*, FP on one
    hand, and on the other hand the number of samples of $C_1$ correctly classified,
    the *true positives*, TP, and the number of samples of $C_1$ misclassified, the
    *false negatives*, FN:


    | TN | FN |

    |---|---|

    | FP | TP |


    This concept can be easily extended to multiple classes. The $(i, j)$ entry in
    the matrix then contains the number of samples in class $C_i$ classified as belonging
    to class $C_j$. For example, Figure 5.19 shows the confusion matrices of the neural
    networks the data depicted in Figure 5.18. The neural network using validation
    and testing sets misclassifies altogether only four samples.


    From these numbers we can calculate the *sensitivity*, also known as *recall*,
    *true positive rate* (TPR) and *probability of detection*, as the fraction of
    positive samples correctly classified:


    ```

    $$\text{TPR} = \frac{\text{TP}}{\text{P}}.$$

    ```


    The *specificity* or *true negative rate* (TNR) is the fraction of negative samples
    correctly identified:


    ```

    $$\text{TNR} = \frac{\text{TN}}{\text{N}}.$$

    ```'
