- pgno: 191
  md: '![](img/d3c00252180686426c9e63ab889b535b_191_0.png)


    Figure 6.8: Data generated for various values of \(\lambda\).


    To simplify this expression, we use properties of determinants and traces of matrices.
    The product of determinants of two matrices is the determinant of the product
    of matrices. Therefore, \(|\Sigma|^{-N/2}|\Sigma|^{-(\nu+d+1)/2} = |\Sigma|^{-(N+\nu+d+1)/2}\).
    The expression \(\mathbf{v}_n^T \Sigma^{-1} \mathbf{v}_n\) is a scalar and the
    trace of a scalar is the scalar itself. Further, the trace is invariant to a cyclic
    permutation of the order of multiplication. Hence, \(\mathbf{v}_n^T \Sigma^{-1}
    \mathbf{v}_n = \text{tr}(\mathbf{v}_n^T \Sigma^{-1} \mathbf{v}_n) = \text{tr}(\mathbf{v}_n
    \mathbf{v}_n^T \Sigma^{-1})\). Using these identities, the posterior is proportional
    to


    ```

    \(\begin{aligned} |\Sigma|^{-(N+\nu+d+1)/2} \exp \left( -\frac{1}{2} \left[ \sum_{n=1}^N
    \text{tr}(\mathbf{v}_n \mathbf{v}_n^T \Sigma^{-1}) + \text{tr}(\Psi \Sigma^{-1})
    \right] \right) = \\ |\Sigma|^{-(N+\nu+d+1)/2} \exp \left( -\frac{1}{2} \text{tr}
    \left( \left( \Psi + \sum_{n=1}^N \mathbf{v}_n \mathbf{v}_n^T \right) \Sigma^{-1}
    \right) \right), \end{aligned}\)

    ```


    since the sum of traces of matrices is the trace of the sum of matrices. Apart
    from the normalizing constant, this is exactly the probability density function
    of \(\mathcal{W}^{-1}(\Sigma | \Psi + \sum_{n=1}^N \mathbf{v}_n \mathbf{v}_n^T,
    \nu + N)\). To summarize, after seeing the data, the inverse scale matrix is updated
    to \(\Psi + \sum_{n=1}^N \mathbf{v}_n \mathbf{v}_n^T\) and the degrees of freedom
    become \(\nu + N\). Since this increases, the estimator for the distribution describing
    \(\Sigma\) becomes tighter, the more data samples are seen. The least informative
    choice for \(\nu\) in the prior is \(\nu = d\).


    Having drawn \(\Sigma_k\), \(\mu_k\) is drawn from a normal distribution with
    mean \(\mathbf{m}\) and covariance matrix \(\frac{1}{\kappa} \Sigma_k\). The parameter
    \(\lambda\) controls the spacing of the generated means \(\mu_k\). Figure 6.8
    illustrates the effect of \(\lambda = 1, 1/3, 1/5\) for \(\alpha = 10K, \mathbf{m}
    = (0, 0)^T\). The previous \(\Psi\) and \(\nu = 6\). As \(\lambda\) decreases,
    the clusters separate. As \(\lambda\) increases, they overlap more and more. Figures
    6.5 to 6.8 were generated by using the function in Listing 6.4.


    To summarize, the data is generated following the distributions:


    ```

    \(\begin{aligned} \mathbf{v}_n | \mathbf{z}_n \sim \mathcal{N}(\mu_k, \Sigma_k)
    \\ p(z_n = k) = \pi_k, \\ \pi \sim \text{Dir}(\alpha), \\ \mu_k, \Sigma_k \sim
    G_0 = \text{NIW}(\mathbf{m}, \lambda, \Psi, \nu). \end{aligned}\)

    ```'
