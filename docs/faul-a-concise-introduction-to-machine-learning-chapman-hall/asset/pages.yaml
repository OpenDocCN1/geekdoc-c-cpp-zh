  md: 'since $f(x)$ integrates to one and \(\int_{-\infty}^{\infty} x f(x) dx = \mathbb{E}[x]\).
    This formula also holds for discrete probability distributions with point masses.


    We see that this formula involves the expectation of \(x^2\). This is known as
    the *second raw* or *crude* moment. The \(i^{th}\) raw (crude) moment is defined
    as


    \(\int_{-\infty}^{\infty} f(x)x^r dx,\)


    while the \(i^{th}\) central moment is given by


    \(\int_{-\infty}^{\infty} f(x)(x - \mathbb{E}[x])^r dx.\)


    The normalized \(i^{th}\) central moment is the \(i^{th}\) central moment divided
    by \(\text{var}[x]^i\). The normalized central moments are invariant to any linear
    change of random variable \(x\). This means if \(y = ax + b\), the normalized
    central moments of \(x\) and \(y\) are the same. The normalized central moments
    are used to quantify the shape of a probability density.


    The third normalized central moment is known as *skewness* and measures the asymmetry
    around the mean of a probability distribution. If the distribution is symmetric,
    the skewness is zero. If more probability mass lies to the left of the mean, the
    skewness is negative, and positive, if more probability mass is to the right of
    the mean.


    The forth normalized central moment is the *kurtosis* and measures how heavy tailed
    the probability distribution is. It is derived from the Greek word for “arching”.
    A large value of the kurtosis means that extreme values of the random variable
    are more likely, while a small value of kurtosis means outliers are rare.


    The moments can be used to inform the choice of which probability density function
    should be chosen for the distribution of a random variable.


    More generally, often the random variable itself is not of interest, although
    a derivation \(g(x)\) of it, which in itself is a random variable, is. In this
    case, the expectation and variance are written as \(\mathbb{E}[g]\) and \(\text{var}[g]\).


    If there are more than one random variable, a subscript is used to indicate with
    respect to which variable the expectation is taken. For example, in


    \(\mathbb{E}_y[g(x, y)]\)


    the expectation is taken with respect to \(y\), and the result is a function of
    \(x\). The expectation with respect to \(x\) can then be taken. Since the order
    does not matter when integrating, the result is the same if the expectation with
    respect to \(x\) is taken first and then with respect to \(y\), if \(x\) and \(y\)
    are independent, that is \(f(x, y) = f(x)f(y)\).


    Returning to the normal distribution, we calculate its expectation (first moment)
    as


    \(\mathbb{E}[x] = \int_{-\infty}^{\infty} \frac{x}{\sqrt{2\pi}\sigma} \exp \left(
    -\frac{(x-\mu)^2}{2\sigma^2} \right) dx\)'
