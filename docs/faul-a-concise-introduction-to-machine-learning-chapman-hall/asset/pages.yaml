    The addition of \(\sigma^2 \mathbf{A}\) guards against \(\mathbf{D}^T \mathbf{D}\)
    being possibly singular. The main distinguishing feature of Bayesian learning
    is that firstly, instead of returning a specific vector of coefficients, a multivariate
    posterior probability distribution is given for \(\mathbf{c}\). Secondly, the
    entries of \(\mathbf{A}\), i.e. the hyperparameters \(\alpha_1, \dots, \alpha_M\)
    are optimized by maximizing the marginal likelihood as we will see below.


    Once the posterior distribution of the coefficients is found, the measurement
    \(t_n\) for data \(\mathbf{x}_n\) can be interpreted probabilistically. Recall
    that we assume \(t_n\) is generated by a process,


    $$ t_n = \mathbf{d}(\mathbf{x}_n)^T \mathbf{c} + \epsilon_n $$


    where \(\mathbf{d}(\mathbf{x}_n)^T\) is the \(n^{th}\) row of \(\mathbf{D}\).
    Now, \(\mathbf{d}(\mathbf{x}_n)^T \mathbf{c}\) is a linear transformation of the
    normally distributed variable \(\mathbf{c}\) and thus also normally distributed.
    On the other hand, \(\epsilon_n\) is normally distributed noise. Hence, \(t_n\)
    is the sum of two normally distributed variables. The probabilistic interpretation
    of \(t_n\) is that it is drawn from a univariate normal distribution with


    | | |

    |---|---|

    | mean | \(m_n = \mathbf{d}(\mathbf{x}_n)^T \boldsymbol{\mu}\) |

    | variance | \(\sigma_n^2 = \sigma^2 + \mathbf{d}(\mathbf{x}_n)^T \mathbf{\Sigma}
    \mathbf{d}(\mathbf{x}_n)\) |


