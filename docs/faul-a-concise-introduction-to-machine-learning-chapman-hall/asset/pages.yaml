  md: 'Using (6.2), we deduce


    ```

    \sum_{k=1}^K p(z_k=1|\mathbf{v}) = \frac{\sum_{k=1}^K \pi_k p_k(\mathbf{v})}{p(\mathbf{v})}
    = 1.

    ```


    Thus the responsibilities, i.e. the probabilities of the processes generating
    a particular sample, sum to one.


    In particular, for the data samples \(\mathbf{v}_n, n=1, \dots, N\), we can now
    make cluster assignments according to the values \(p(z_{n,k}=1|\mathbf{v}_n)\)
    for \(k=1, \dots, K\). This is called *soft clustering*, since our belief is quantified
    by probabilities. It is possible for a particular sample the probabilities are
    the same for two (or even more) values of \(k\). These are samples which lie between
    clusters.


    Before we can however calculate any probabilities for cluster membership, we need
    to determine \(\pi_k\) and \(p_k(\mathbf{v})\) for \(k=1, \dots, K\). To this
    end we consider the joint likelihood under this model of the data samples \(\mathbf{v}_1,
    \dots, \mathbf{v}_n\) which is given by


    ```

    \prod_{n=1}^N p(\mathbf{v}_n) = \prod_{n=1}^N \sum_{k=1}^K \pi_k p_k(\mathbf{v}_n).

    ```


    We obtain values for \(\pi_k\) and the parameters describing \(p_k(\mathbf{v})\),
    by maximizing this likelihood, or alternatively its logarithm, known as the *log
    likelihood*


    ```

    \mathcal{L} = \sum_{n=1}^N \log p(\mathbf{v}_n) = \sum_{n=1}^N \log \left( \sum_{k=1}^K
    \pi_k p_k(\mathbf{v}_n) \right). \quad (6.3)

    ```


    When maximizing with respect to the mixing coefficients \(\pi_k\), it is important
    to remember the constraint that they sum to one. This can be incorporated into
    the maximization problem using a *Lagrange multiplier* \(\lambda\). That is we
    maximize


    ```

    \sum_{n=1}^N \log \left( \sum_{k=1}^K \pi_k p_k(\mathbf{v}_n) \right) + \lambda
    \left( \sum_{k=1}^K \pi_k - 1 \right).

    ```


    Differentiating with respect to \(\pi_k\) and setting to zero gives


    ```

    \sum_{n=1}^N \frac{1}{\sum_{k=1}^K \pi_k p_k(\mathbf{v}_n)} p_k(\mathbf{v}_n)
    + \lambda = 0. \quad (6.4)

    ```


    We first solve for \(\lambda\) by multiplying through by \(\pi_k\) and summing
    over all \(k\). The right hand side remains zero, while the left hand side becomes


    ```

    \sum_{n=1}^N \frac{\sum_{k=1}^K \pi_k p_k(\mathbf{v}_n)}{\sum_{k=1}^K \pi_k p_k(\mathbf{v}_n)}
    + \sum_{k=1}^K \pi_k \lambda = N + \lambda.

    ```'
