    Because of the exponential, they are multiplicative constants and cancel in the
    fraction. It remains to evaluate the denominator, which after cancellations is


    \int \exp \left( -\frac{1}{2}(\mathbf{c} - \mu)^T \mathbf{\Sigma}^{-1}(\mathbf{c}
    - \mu) \right) d\mathbf{c}.


