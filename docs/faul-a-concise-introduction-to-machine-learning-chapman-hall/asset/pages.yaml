    Figure 4.12: Support Vector Machine Classification.


    subject to the constraints $\alpha_n \ge 0$ and $\alpha_n (c_n \hat{\mathbf{w}}^T
    \mathbf{v}_n - 1) = 0, n = 1, \dots, N$. This is the *dual representation* of
    the maximum margin problem.


    The samples for which $\alpha_i \neq 0$ in the linear combination to form the
    weight vector $\hat{\mathbf{w}}$ are called the *support vectors*. This shaped
    the name under which the technique is known now. It was invented in 1964 by Vapnik
    and Lerner as the *Generalized Portrait Method*. The term generalized portrait
    refers to the centre of a sphere which contains patterns belonging to a certain
    class, but no other class. That is, it is a representative of this class.


    Recall that $\hat{\mathbf{w}} = (-\mathbf{b}, \mathbf{w})$ and $\mathbf{v}$ to
    $\bar{\mathbf{v}} = (1, \mathbf{v})$. Inserting this into (4.3) and (4.4), the
    bias $b$ is given by $-\sum_{n=1}^N \alpha_n c_n$, while the vector of weights
    is


    ```

    $$\mathbf{w} = \sum_{n=1}^N \alpha_n c_n \mathbf{v}_n.$$

    ```


    The dual maximization problem becomes


    ```

    $$L(\boldsymbol{\alpha}) = \sum_{n=1}^N \alpha_n - \frac{1}{2} \sum_{i=1}^N \sum_{n=1}^N
    \alpha_i c_i \alpha_n c_n \left(1 + \mathbf{v}_i^T \mathbf{v}_n\right).$$

    ```


    Its solution depends solely on the inner product between samples. The classification
    is according to the sign of


    ```

    $$\hat{\mathbf{w}}^T \hat{\mathbf{v}} = \sum_{n=1}^N \alpha_n c_n \hat{\mathbf{v}}_n^T
    \hat{\mathbf{v}} = \sum_{n=1}^N \alpha_n c_n \left(1 + \mathbf{v}_n^T \mathbf{v}\right)
    = -b + \sum_{n=1}^N \alpha_n c_n \mathbf{v}_n^T \mathbf{v} = -b + \mathbf{w}^T
    \mathbf{v}.$$

    ```'
