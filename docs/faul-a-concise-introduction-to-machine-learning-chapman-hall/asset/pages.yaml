    # 8.11 Bayesian Regression


    We have seen that finding suitable coefficients $\mathbf{c}$ to satisfy $\mathbf{t}
    = \mathbf{Dc} + \boldsymbol{\epsilon}$ by minimizing $\|\mathbf{t} - \mathbf{Dc}\|^2
    = \|\epsilon\|^2$ leads to the noise being modeled and over-fitting. This can
    be mitigated by minimizing $\|\mathbf{t} - \mathbf{Dc}\|^2 + \Omega(\mathbf{c})$
    for some penalty function $\Omega(\mathbf{c})$. This “tweaks” the model to favour
    less complex models. The question we are asking now is whether the “tweaking”
    can be formalized.


    To this end, we utilize *Bayes’ Rule* which we recall as


    $P(A|B) = \frac{P(B|A)P(A)}{P(B)}$.


    Often the relationship is expressed as $P(A|B) \propto P(B|A)P(A)$ where $\propto$
    means that the two sides are proportional to each other. Thus the division by
    $P(B)$ is suppressed.


    Applying this to the setting at hand,


    $p(\mathbf{c}|\mathbf{t}) = \frac{p(\mathbf{t}|\mathbf{c})p(\mathbf{c})}{p(\mathbf{t})}$.


    In other words, we answer the question: What is the probability of the coefficients
    given the observed data?


    Since the noise is i.i.d. normal with mean 0 and variance $\sigma^2$, we can write
    for the probability of $\mathbf{t}$ given the design matrix $\mathbf{D}$, coefficients
    $\mathbf{c}$ and noise variance $\sigma^2$


    $p(\mathbf{t}|\mathbf{D}, \mathbf{c}, \sigma^2) = (2\pi)^{-N/2}\sigma^{-N} \exp
    \left( - \frac{\|\mathbf{t} - \mathbf{Dc}\|}{2\sigma^2} \right)$.


    We define a *prior distribution* for $\mathbf{c}$ using all information apart
    from the data itself, quantifying our belief about the coefficients. For example,
