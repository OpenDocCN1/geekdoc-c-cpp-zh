    # Figure 3.1: The probability density function of the Weibull distribution for
    various choices of $k$ and $\lambda$. For $k=1$, it is the exponential probability
    distribution.


    As an example, consider the *Weibull distribution*, $x \sim \text{Weibull}(\lambda,
    k)$. Its probability density function is


    ```

    \text{Weibull}(x|\lambda, k) = \begin{cases} \frac{k}{\lambda} \left(\frac{x}{\lambda}\right)^{k-1}
    \exp \left( - \left( \frac{x}{\lambda} \right)^k \right) & \text{for } x \ge 0,
    \\ 0 & \text{for } x < 0, \end{cases}

    ```


    where $k > 0$ is the *shape parameter* and $\lambda > 0$ is the scale parameter.
    Its mean is $\lambda \Gamma(1+1/k)$, while the variance is $\lambda^2 [\Gamma(1+2/k)
    - (\Gamma(1+1/k))^2]$. Figures 3.1 and 3.2 give examples of the probability density
    and cumulative distribution function respectively. For some choices of parameters
    the shape becomes close to a normal distribution.


    For $k=1$, the Weibull distribution becomes the exponential distribution. The
    Weibull distribution is used in reliability engineering and failure analysis.
    There, the parameter $k$ is interpreted in the following way. If $k > 1$, then
    the failure rate increases with time as parts are more likely to fail as time
    goes on. If $k=1$, the failure rate is constant, the system is stable and there
    is no aging process. If $k < 1$, the failure rate decreases with time. Colloquially,
    this means that if it has not failed by now, it is less likely to fail in the
    future. For more information on statistical quality control see [31].'
