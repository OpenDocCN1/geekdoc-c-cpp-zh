  md: 'be an approximation to t(x), where c1,...,cM are coefficients, which need to
    be determined. The dictionary defines a model space in which ideally the true
    solution t(x) lies. That is the underlying process can be described entirely by
    the dictionary. In a less ideal world, the approximation f(x) obtained in the
    model space shall be close enough to the true solution. We will refer to f(x)
    as our model describing the data.


    # ## 8.2 Linear Regression


    Often the term linear regression refers to fitting a straight line to the data.
    More generally, however, the term linear means that the model is a sum of building
    blocks with suitable coefficients, a linear combination. This gives us flexibility
    in the choice of building blocks. They can be non-linear functions. It also gives
    us flexibility in the choice of noise model and in the method to determine the
    coefficients.


    Linear regression developed in several fields. Therefore the terminology is varied.
    First there is the scalar function value t, also known as dependent, endogenous,
    response, measured, criterion variable, or regressand or target. In the previous
    example this is the colour.


    The d1(x), ..., dM(x) are known as independent, exogenous, input, explanatory,
    predictor variables or regressors. Remember dm is not a coordinate of a vector.
    It is a basis function.


    The coefficients c1, ..., cM are also referred to as parameter vector or vector
    of weights, also known as effects, regression coefficients. They can also be viewed
    as latent variables. Regression determines these by various techniques.


    The relationship to the measurements is


    ```

    t_n = f(x_n) + \epsilon_n,

    ```


    where \epsilon_n is noise intrinsic to the measurement process and assumed to
    be independent and identically distributed (i.i.d.) following the normal distribution
    N(0, \sigma^2). This is known as homoscedasticity. Note that the assumption of
    the same constant noise variance for each measurement might be wrong for two reasons.
    Firstly, there might be different sources of the noise with different effects.
    In this case the noise should be modeled by a mixture of probability distributions.
    Secondly, restrictions on the data might make different noise distributions necessary.
    For example if it is known that the data is always positive, the noise variance
    for smaller values has to be smaller to ensure positive predicted values.


    Now


    ```

    t_n = f(x_n) + \epsilon_n = \sum_{m=1}^M c_m d_m(x_n) + \epsilon_n,

    ```


    Let D be the matrix with entries


    ```

    D_{n,m} = d_m(x_n)

    ```'
