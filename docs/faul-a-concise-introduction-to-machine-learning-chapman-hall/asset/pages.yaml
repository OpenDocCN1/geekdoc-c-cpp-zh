  md: '# Addition: In this case,


    ```

    2\Delta \mathcal{L} = \frac{Q_i^2 - S_i}{S_i} + \log \frac{S_i}{Q_i^2},\\

    \tilde{\mathbf{\Sigma}} = \left( \begin{array}{cc} \mathbf{\Sigma} + \sigma^{-1}
    \mathbf{\Sigma} \mathbf{d}_i^T \mathbf{d}_i \mathbf{\Sigma} & -\sigma^{-2} \mathbf{\Sigma}_i
    \mathbf{\Sigma} \mathbf{D}^T \mathbf{d}_i \\ -\sigma^{-2} \mathbf{\Sigma} \mathbf{D}^T
    \mathbf{d}_i^T \mathbf{\Sigma} & \Sigma_{ii} \end{array} \right),\\

    \tilde{\mathbf{\mu}} = \left( \begin{array}{c} \mathbf{\mu} - \sigma^{-2} \mu_i
    \mathbf{\Sigma} \mathbf{D}^T \mathbf{d}_i \\ \mu_i \end{array} \right),

    ```


    where $\Sigma_{ii} = (\alpha_i + S_i)^{-1}$ and $\mu_i = \Sigma_{ii} Q_i$.


    Deletion: The index $j$ denotes the column of $\mathbf{D}$ which needs to be removed,
    when $d_i$ is removed from the current model. $\mathbf{\Sigma}_j$ is the $j^{th}$
    column of $\mathbf{\Sigma}$ and $\Sigma_{jj}$ is the $j^{th}$ diagonal element.
    The $j^{th}$ element of $\mathbf{\mu}$ is $\mu_j$.


    ```

    2\Delta \mathcal{L} = \frac{Q_j^2}{S_i - \alpha_i} - \log \left( 1 - \frac{S_i}{\alpha_i}
    \right),\\

    \tilde{\mathbf{\Sigma}} = \mathbf{\Sigma} - \frac{1}{\Sigma_{jj}} \mathbf{\Sigma}_j
    \mathbf{\Sigma}_j^T,\\

    \tilde{\mathbf{\mu}} = \mathbf{\mu} - \frac{\mu_j}{\Sigma_{jj}} \mathbf{\Sigma}_j.

    ```


    After these updates the $j^{th}$ row and column needs to be removed from $\tilde{\mathbf{\Sigma}}$
    and the $j^{th}$ element from $\tilde{\mathbf{\mu}}$.


    # Re-estimation: Defining


    ```

    \kappa_j = (\Sigma_{jj} + (\tilde{\alpha}_i - \alpha_i)^{-1})^{-1}

    ```


    with $\Sigma_{jj}$ and $\mathbf{\Sigma}_j$ as in the case of deletion, we have


    ```

    2\Delta \mathcal{L} = \frac{Q_j^2}{S_i + (\tilde{\alpha}_i^{-1} - \alpha_i^{-1})^{-1}}
    - \log(1 + S_i(\tilde{\alpha}_i^{-1} - \alpha_i^{-1})),\\

    \tilde{\mathbf{\Sigma}} = \mathbf{\Sigma} - \kappa_j \mathbf{\Sigma}_j \mathbf{\Sigma}_j^T,\\

    \tilde{\mathbf{\mu}} = \mathbf{\mu} - \kappa_j \mu_j \mathbf{\Sigma}_j.

    ```


    We already noted that a new candidate basis function can be created and evaluated
    for inclusion in the model at any point in time. The model can also adapt, when
    a new data sample arrives. Thus, this technique is also suitable for online learning.
    We can calculate the change in the logarithm of the marginal likelihood for the
    current model, when a data sample $(t_*, \mathbf{x}_*)$ is added. This means adding
    a row to the design matrix $\mathbf{D}$ yielding


    ```

    \mathbf{D}_* = \begin{pmatrix} \mathbf{D} \\ \mathbf{d}(\mathbf{x}_*)^T \end{pmatrix}.

    ```'
