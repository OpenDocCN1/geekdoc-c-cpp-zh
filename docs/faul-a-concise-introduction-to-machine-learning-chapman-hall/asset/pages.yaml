    The forth central moment of the normal distribution can be calculated by integration
    by parts similar to the calculation of the variance. It is given by 3σ^4. Hence
    the kurtosis of the normal distribution is 3. Often the kurtosis of other distributions
    is compared to this value. If it is larger the distribution is known as leptokurtic.
    If it is smaller, it is platykurtic. Both present their own difficulties, if an
    underlying normal distribution is assumed, but the data does not support this.
    In the case of leptokurtic distributions, the risk of extreme events is underestimated
    and is not sufficiently prepared for. Examples for this can be found in the history
    of financial theory. Extreme events are rare in platykurtic distributions. However,
    if these events are catastrophic, dismissing their possibility can be literally
    fatal.


    # 2.3 Examples of Discrete Probability Mass Functions


    In the following we give a short overview of commonly used probability distributions
    starting with discrete variables. We have already encountered the uniform distribution
    in the experiments of flipping a coin or rolling a die. All outcomes are equally
    likely as long as the die and coin are fair. If there are K possible outcomes,
    the probability for each is 1/K. Figure 2.5 illustrates the discrete uniform probability
    density as point masses. The cumulative probability density function is a stair
    function where the left point of each step is included, but the end point is not.


    Next we consider binary variables used when experiments can only have one of two
    outcomes, e.g yes or no, true or false, head or tail, 0 or 1. These are also known
    as Boolean variables. For simplicity we use the outcomes 0 and 1. The probability
    of x = 1 is denoted by 0 ≤ μ ≤ 1. The probability of x = 0 is then 1 − μ. This
    distribution is known as the Bernoulli distribution x ~ Bern(μ). Its probability
    mass function is given by


    ```

    Bern(x|μ) = μ^x(1 − μ)^(1−x).

    ```'
