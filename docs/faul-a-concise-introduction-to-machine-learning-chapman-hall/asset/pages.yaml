  md: 'which simplifies to


    ```

    E_n = \int p_a(\mathbf{z}^{(L/2)}|\mathbf{x}_n) \left[ -\log \frac{p(\mathbf{z}^{(L/2)})}{p_a(\mathbf{z}^{(L/2)}|\mathbf{x}_n)}
    - \log p(\mathbf{x}_n|\mathbf{z}^{(L/2)}) \right] d\mathbf{z}^{(L/2)}

    = D_{KL}(p_a(\mathbf{z}^{(L/2)}|\mathbf{x}_n) \| p(\mathbf{z}^{(L/2)}))

    - \int p_a(\mathbf{z}^{(L/2)}|\mathbf{x}_n) \log p(\mathbf{x}_n|\mathbf{z}^{(L/2)})
    d\mathbf{z}^{(L/2)}.

    ```


    The first term is the Kullback-Leibler divergence between the normal distribution
    with mean \(\boldsymbol{\mu}(\mathbf{x}_n)\) and variance \(\boldsymbol{\Sigma}(\mathbf{x}_n)\)
    and the standard normal distribution which is the prior of \(\mathbf{z}^{(L/2)}\).
    This is given by


    ```

    D_{KL}(p_a(\mathbf{z}^{(L/2)}|\mathbf{x}_n) \| p(\mathbf{z}^{(L/2)})) =

    \frac{1}{2} [\text{tr}[\boldsymbol{\Sigma}(\mathbf{x}_n) + \boldsymbol{\mu}(\mathbf{x}_n)^T
    \boldsymbol{\mu}(\mathbf{x}_n)] - M_{L/2} - \log |\boldsymbol{\Sigma}(\mathbf{x}_n)|]
    =

    \frac{1}{2} \sum_{m=1}^{M_{L/2}} [\sigma_m^2(\mathbf{x}_n) + \mu_m^2(\mathbf{x}_n)
    - \log \sigma_m^2(\mathbf{x}_n)] - \frac{M_{L/2}}{2},

    ```


    where the last equation is due to choosing the variance to have diagonal form.


    The second term is the negative expectation of \(\log p(\mathbf{x}_n|\mathbf{z}^{(L/2)})\)
    with respect to \(\mathbf{z}^{(L/2)}\). Now \(\mathbf{z}^{(L/2)} = \boldsymbol{\mu}(\mathbf{x}_n)
    + \boldsymbol{\Sigma}^{1/2}(\mathbf{x}_n)\boldsymbol{\eta}\), where \(\boldsymbol{\eta}\)
    follows the standard normal distribution and is sampled in additional input neurons.
    It is therefore customary to enrich the training samples with samples drawn from
    the standard normal distribution to arrive at new training samples \(\mathbf{x}_{nk}
    = (\mathbf{x}_n, \boldsymbol{\eta}_k)^T\) for \(n=1, \dots, N\) and \(k=1, \dots,
    K\) for some suitably chosen \(K\). The second term is then estimated as


    ```

    -\log p(\mathbf{x}_n|\boldsymbol{\mu}(\mathbf{x}_n) + \boldsymbol{\Sigma}^{1/2}(\mathbf{x}_n)\boldsymbol{\eta}_k)
    =

    \frac{D}{2} \log(2\pi\sigma^2) + \frac{1}{2\sigma^2} \|\mathbf{x}_n - \boldsymbol{\psi}(\boldsymbol{\mu}(\mathbf{x}_n)
    + \boldsymbol{\Sigma}^{1/2}(\mathbf{x}_n)\boldsymbol{\eta}_k)\|^2.

    ```


    Each term in the sum over \(k\) is treated separately in the error function. Removing
    constant terms the \(nk^{\text{th}}\) term of the error function, which needs
    to be minimized, is given by


    ```

    E_{nk} = \frac{1}{2} \sum_{m=1}^{M_{L/2}} [\sigma_m^2(\mathbf{x}_n) + \mu_m^2(\mathbf{x}_n)
    - \log \sigma_m^2(\mathbf{x}_n)]

    + \frac{1}{2} \|\mathbf{x}_n - \boldsymbol{\psi}(\boldsymbol{\mu}(\mathbf{x}_n)
    + \boldsymbol{\Sigma}^{1/2}(\mathbf{x}_n)\boldsymbol{\eta}_k)\|^2.

    ```


    This is continuous and therefore error backpropagation can be used to calculate
    gradients to be used in the minimization as explained in Section 9.2.'
