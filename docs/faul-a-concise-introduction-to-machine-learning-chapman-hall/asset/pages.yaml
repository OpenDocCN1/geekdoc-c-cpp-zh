- pgno: 298
  md: 'of the input data, i.e. y ≈ x. The number of layers $L$ is even, meaning the
    number of sets of hidden neurons is odd. The first $L/2$ layers encode the data.
    The latent variables of the set of hidden neurons numbered $L/2$ represent the
    encoded data. The last $L/2$ layers decode these latent variables to arrive at
    the input. The encoder function $\phi$ maps the input $\mathbf{x} = (x_1, ...,
    x_D)^T$ to the latent variables $\mathbf{z}^{(L/2)} = (z_1^{(L/2)}, ..., z_{M_{L/2}}^{(L/2)})^T$,
    while the decoder function $\psi$ maps the latent variables $\mathbf{z}^{(L/2)}$
    back to $\mathbf{x}$.


    While it is possible to implement the bias in each layer with a dummy neuron,
    which always has the value 1, it is common to denote it explicitly as $\mathbf{b}^{(l)}
    = (b_1, ..., b_{M_l})^T$. It signifies a shift after the linear transformation
    given by the weights $w_{ji}^{(l)}$, where $i = 1, ..., M_{l-1}$ and $j = 1, ...,
    M_l$. Here $M_0 = M_L = D$. The weights of each layer are stored in the weight
    matrix $\mathbf{W}^{(l)}$, the $(j, i)$ entry being $w_{ji}^{(l)}$. The vector
    of activations $\mathbf{a}^{(l)} = (a_1, ..., a_{M_l})^T$ is then

    \(\mathbf{a}^{(l)} = \mathbf{W}^{(l)}(\mathbf{a}^{(l-1)} + \mathbf{b}^{(l)}),\)


    where $\mathbf{z}^{(0)} = \mathbf{x}$. The notation $h^{(l)}(\mathbf{a}^{(0)})$
    is used to denote the element-wise application of the activation function $h^{(l)}$
    to the entries of $\mathbf{a}^{(0)}$.


    The error function for the autoencoder is typically the mean squared error,


    \(E(\mathbf{w}) = \frac{1}{N} \sum_{n=1}^N \|\mathbf{x}_n - \psi(\phi(\mathbf{x}_n))\|^2.\)


    There are several variants of autoencoders, which adjust the error function with
    a particular goal in mind.


    Firstly, there is the denoising autoencoder (DAE), where the goal is that a good
    representation of the sample is still obtained, even if it is corrupted by noise.
    To this end, the training samples $\mathbf{x}_1, ..., \mathbf{x}_N$ first undergo
    a probabilistic corruption process giving corrupted training samples $\tilde{\mathbf{x}}_1,
    ..., \tilde{\mathbf{x}}_N$. The autoencoder is then trained using the error function


    \(E(\mathbf{w}) = \frac{1}{N} \sum_{n=1}^N \|\mathbf{x}_n - \psi(\phi(\tilde{\mathbf{x}}_n))\|^2.\)


    The corrupted data is encoded and decoded and the results compared to the uncorrupted
    data.


    Secondly, we have sparse autoencoders (SAE). Here, the aim is that only a certain
    number of latent variables is non-zero. One possibility is to only keep the $k$
    largest latent variables in a particular set of hidden neurons and set the others
    to zero during forward propagation. Backpropagation only passes through the hidden
    neurons, whose latent variables are non-zero. This is known as a $k$-sparse autoencoder.


    The average activation of the $m^{th}$ neuron in the $l^{th}$ set of hidden neurons
    is defined as

    \(p_m^{(l)} = \frac{1}{N} \sum_{n=1}^N z_m^{(l)}(\mathbf{x}_n).\)'
