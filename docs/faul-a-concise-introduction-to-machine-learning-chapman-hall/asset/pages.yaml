  md: 'Now the mortality reflects the health advice given. In all age groups but two,
    the mortality of smokers is higher. Smokers die younger on average which might
    in part explain their under-representation in the two oldest age groups.


    Simpson''s paradox is due to another variable influencing the data, but hiding.
    This is called the *confounding variable*. In this case, it is the ages of the
    women in the original study and the distribution of smokers and non-smokers within
    the different age groups. Whenever the distributions within a population (the
    women in the original study) varies for different parts of the population (the
    different age groups), data analysis has to be done carefully, taking these variations
    into account.


    Another example of Simpson''s paradox is the correlation between price and demand.
    Here the confounding variable is time. If time is not taken into account, price
    and demand can appear positively correlated, while in fact they are negatively
    correlated which becomes apparent when plotting both demand and price against
    time.


    # 2.2 Probability Densities, Expectation, Variance and Moments


    In the previous sections, the random variables were discrete. However, one of
    them, the age, is fundamentally a continuous variable, if it is considered as
    time passed since birth. It was *discretized* by considering age groups. The choice
    of how to discretize can influence the interpretation as well. We have already
    seen that no discretization at all leads to the wrong interpretation of mortality
    with smokers being less likely to die than non-smokers. On the other hand, the
    discretization shall not be too fine grained, because then the number of samples
    in each category becomes too small for interpretation. This is also known as *over-fitting*,
    where the model fits the data too exactly and does not generalize to unseen data.
    For example, assume that we discretized the ages so finely that in each age group
    there is only one woman, or possibly none. We can then either make no prediction
    at all for a new participant of the study, if that age group is empty, or we will
    make the prediction according to the mortality of that one woman in that age group,
    which could be completely wrong.


    Discretization is one way of dealing with probabilities of a continuous real-valued
    variable $x$. Another way is the *probability density function* (*pdf*) $f(x)$
    over $x$ which describes the distribution. Formally, it is defined by $f(x)\Delta
    x$ being the probability of a sample falling inside the interval $(x, x + \Delta
    x)$ as the interval size $\Delta x$ approaches zero. The probability density function
    is always non-negative. It can be viewed as taking discretization to the limit.
    There is a valid probability value for $x$ falling into any interval $(a, b)$
    and it is given by


    \(p(x \in (a, b)) = \int_a^b f(x) dx.\)'
