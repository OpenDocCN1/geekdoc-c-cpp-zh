- pgno: 288
  md: 'It is convention to state this as minimizing the error function


    $$E(\mathbf{w}) = \frac{1}{2} \sum_{n=1}^N \|\mathbf{y}(\mathbf{x}_n, \mathbf{w})
    - \mathbf{t}_n\|^2$$


    known as error sum of squares (ESS).


    +   • For binary classification, $t_n$ is zero if the sample with features $\mathbf{x}_n$
    belongs to the negative class, and one otherwise. Since the single output of the
    neural network is interpreted as the probability of belonging to the positive
    class, the likelihood function in this case is given by


    $$\mathcal{L} = \prod_{n=1}^N y(\mathbf{x}_n, \mathbf{w})^{t_n} (1 - y(\mathbf{x}_n,
    \mathbf{w}))^{1-t_n}.$$


    Taking the negative logarithm gives the cross-entropy error function


    $$E(\mathbf{w}) = - \sum_{n=1}^N t_n \log y(\mathbf{x}_n, \mathbf{w}) + (1 - t_n)
    \log (1 - y(\mathbf{x}_n, \mathbf{w})).$$


    +   • If the network tackles $K$ separate, binary classification tasks on the
    same data, then the error function is


    $$E(\mathbf{w}) = - \sum_{k=1}^K \sum_{n=1}^N t_{n,k} \log y_k(\mathbf{x}_n, \mathbf{w})
    + (1 - t_{n,k}) \log (1 - y_k(\mathbf{x}_n, \mathbf{w})) ,$$


    where $t_{n,k}$ is the $k^\text{th}$ component of $\mathbf{t}_n$ and $y_k(\mathbf{x}_n,
    \mathbf{w})$ is the output of the $k^\text{th}$ neuron, when $\mathbf{x}_n$ is
    the input. It is the sum of the errors of the $K$ individual binary classification
    tasks.


    +   • For $K$ multiple classes, $y_k(\mathbf{x}_n, \mathbf{w})$ is taken as the
    probability of the sample with features $\mathbf{x}_k$ belonging to the $k^\text{th}$
    class and $\mathbf{t}_n$ is a 1-of-$K$ representation. The likelihood of the data
    is


    $$\mathcal{L} = \prod_{n=1}^N \prod_{k=1}^K y_k(\mathbf{x}_n, \mathbf{w})^{t_{n,k}}.$$


    As before, taking the negative logarithm leads to the error function


    $$E(\mathbf{w}) = - \sum_{k=1}^K \sum_{n=1}^N t_{n,k} \log y_k(\mathbf{x}_n, \mathbf{w}).$$


    This looks very similar to the one above, but now only one of $t_{n,k}, k = 1,
    \dots, K$ is non zero.'
