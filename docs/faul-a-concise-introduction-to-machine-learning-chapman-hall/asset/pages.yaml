  md: 'that, if $x_1, ..., x_n$ is a sequence of *independent and identically distributed*
    (i.i.d.) random variables with mean 0 and variance $\sigma^2$, then the distribution
    of the normalized sum


    $$S_n = \frac{x_1 + ... + x_n}{\sqrt{n}}$$


    is close to a normal distribution for large enough $n$. As $n$ tends to infinity
    and $S_n \to S$, it approaches the normal distribution $\mathcal{N}(S|0, \sigma^2)$.
    This holds however the distribution of $x_1, ..., x_n$ appeared in the first place,
    as long as they are independent and identically distributed. This, however, is
    the crux of while explanation.


    While some phenomena we want to describe using probability density functions might
    be the result of independent and identically distributed summands, many are influenced
    by different factors, all of which have their own distinct distributions. Take
    for example a person''s height. There is their potential for growth determined
    by their genetic make-up, where also different genes play a role. This is the
    nature part. Next is the nurture part. Nutrition, pollution, diseases, etc. all
    are factors. All these are not independent and identically distributed, but height
    is still normally distributed.


    Another explanation involves the *entropy* of the probability density $f(x)$ defined
    as


    $$-\int_{-\infty}^{\infty} f(x) \log f(x) \, dx,$$


    where $f(x) \log f(x)$ is zero, wherever $f(x) = 0$. A change of base for the
    logarithm results in scaling of the entropy. As long as the same base is used
    throughout, entropies of different distributions can be compared. Information
    theorists prefer to use base 2 in line with bits. Since $0 \le f(x) \le 1$, the
    entropy is non-negative. Entropy is often interpreted as a measure of disorder
    or randomness or lack of information. The larger the entropy, the more disorder,
    the less information. For example, if there is only one possible value for $x$
    with probability 1, then $\log f(x) = 0$ there and the integrand is zero everywhere.
    Hence the entropy is zero. The information value is perfect, since the outcome
    is determined. Many physical systems strive to maximize the entropy over time.
    For a given mean $\mu$ and variance $\sigma^2$, $f(x) = \mathcal{N}(x|\mu, \sigma^2)$
    maximizes the entropy. So this choice mirrors a natural process. Also, it is wise
    to choose a distribution with the least information, if nothing else is known.


    To show that the normal distribution integrates to one, we consider


    $$\int_{-\infty}^{\infty} \frac{1}{\sqrt{2\pi}\sigma} \exp \left( -\frac{1}{2\sigma^2}
    (x-\mu)^2 \right) \, dx.$$


    Letting $x - \mu = \sigma y$, we have $dx = \sigma dy$. The range of integration
    does not change with this change of variables. Thus we arrive at


    $$\frac{1}{\sqrt{2\pi}} \int_{-\infty}^{\infty} \exp \left( -\frac{y^2}{2} \right)
    \, dy.$$'
