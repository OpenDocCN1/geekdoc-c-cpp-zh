- pgno: 101
  md: 'satisfies fP = f = (1/10, 2/5, 1/2). All entries have to be valid probabilities
    and thus \(\alpha, \beta, \gamma \in [0, 1]\) and \(\alpha + \beta \le 1, \alpha
    + 4\gamma \le 4\) and \(\beta + 4\gamma \le 5\).


    If any two of \(\alpha, \beta\) and \(\gamma\) are both zero, we have a 1 on the
    diagonal, meaning that it is impossible to leave that state. This state is called
    *absorbing*. If there is a non-zero probability of every state to reach that state,
    then the Markov chain is an *absorbing Markov chain*. This is not the case here,
    since the other two states change between each other, but not to the absorbing
    state. This also means that the chain is not irreducible, since the absorbing
    state cannot be reached from the other two states. Thus in this case, the distribution
    of \(\mathbf{x}_n\) will not converge to the invariant distribution, and the Markov
    chain cannot be used to generate approximate samples.


    If on the other hand at most one of \(\alpha, \beta\) and \(\gamma\) is zero,
    the Markov chain is irreducible and aperiodic and can be used to generate approximate
    samples for the invariant distribution \(f\).


    An example of a Markov chain on the state space of integers is the *drunkard''s
    walk*, where the drunkard stood at the pub denoted by 0 and whenever taking a
    step, either steps forward (\(x_{n+1} = x_n + 1\)) with probability 1/2, or steps
    backward (\(x_{n+1} = x_n - 1\)) also with probability 1/2, independent of how
    he got here in the previous step. The probabilities of all other integers are
    zero. This is an example of a *random walk*. The transition matrix would be infinite
    with zero on the diagonal and 1/2 on the subdiagonal and superdiagonal. The state
    diagram is


    ![](img/d3c00252180686426c9e63ab889b535b_101_0.png)


    The expectation \(\mathbb{E}[x_n]\) is 0, since the expectation of each individual
    step is that the drunkard stays put. On the other hand, \(\mathbb{E}[x_n^2] =
    n\), which implies that the distance traveled from the pub is of the order of
    \(\sqrt{n}\). The drunkard''s partner will find them near the pub. It also shows
    that this random walk is relatively ineffective in exploring the state space of
    the integers.


    However, if the random walk carries on indefinitely, it will reach each integer
    an infinite number of times. This property is known as the *level-crossing phenomenon,
    recurrence* or *gambler''s ruin*. The last is due to the fact that a gambler with
    a finite amount of money playing a fair game against a bank with an infinite amount
    of money will eventually lose, because the amount he has follows a random walk,
    and will at some point cross zero and the game is over.


    The aim is to construct a Markov chain, for which a given distribution with probability
    mass function or probability density function \(f\) is invariant, such that the
    elements of the Markov chain for \(n\) large enough are samples of the given distribution.'
