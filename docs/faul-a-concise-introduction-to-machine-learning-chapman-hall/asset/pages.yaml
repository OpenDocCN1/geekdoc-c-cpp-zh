    # 6.6 The Chinese Restaurant Process


    In all the above, the number of clusters was fixed at the start of the algorithm.
    This is, however, undesirable, since in general it is not known beforehand, how
    many clusters there are. Ideally, the number of clusters should be determined
    by the data.


    It is helpful to revisit the assumptions we made about how the data is generated.
    Previously, a new data sample was generated by choosing one of the \(K\) processes
    and then generating the sample according to the probability distribution for that
    process. We now take the view that there is a chance that the sample is generated
    by a completely new process, which is different from the processes which generated
    the previous samples.


    It is more convenient to take a sequential view of the generation of samples.
    For the first sample, a process and its distribution are generated. The second
    sample can either be generated from the same distribution as the first sample
    or from a new distribution. We need to define a probability for these two cases.
    Let \(\alpha\) be an additional parameter governing this probability. It is known
    as dispersion, concentration, scaling parameter or strength. The probability that
    the second sample is generated by the first process is \(1/(1 + \alpha)\), while
    the'
