- pgno: 257
  md: '![](img/d3c00252180686426c9e63ab889b535b_257_0.png)


    ![](img/d3c00252180686426c9e63ab889b535b_257_1.png)


    ![](img/d3c00252180686426c9e63ab889b535b_257_2.png)


    ![](img/d3c00252180686426c9e63ab889b535b_257_3.png)


    Figure 8.9: Contour lines of various \( L_p \) norms.


    For \( L_2 \) regularization we minimize


    ```

    \(\frac{1}{2}\|\mathbf{t} - \mathbf{Dc}\|^2 + \frac{1}{2}\lambda\|\mathbf{c}\|^2
    = \frac{1}{2}\mathbf{t}^T\mathbf{t} - \mathbf{c}^T\mathbf{D}^T\mathbf{t} + \frac{1}{2}\mathbf{c}^T(\mathbf{D}^T\mathbf{D}
    + \lambda\mathbf{I})\mathbf{c}.\)

    ```


    The gradient of this function is


    ```

    \(-\mathbf{D}^T\mathbf{t} + (\mathbf{D}^T\mathbf{D} + \lambda\mathbf{I})\mathbf{c}.\)

    ```


    Setting the gradient to zero, we have a minimum for


    ```

