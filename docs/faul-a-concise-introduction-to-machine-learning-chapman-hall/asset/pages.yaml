  md: 'are conducted and data gathered, it is not unusual to see a few statistical
    anomalies.


    Associated with any probability density function is its _cumulative distribution
    function (cdf)_ given by


    $$F(x) = \int_{-\infty}^{x} f(t)dt.$$


    It gives the probability of $t$ falling into the interval $(-\infty, x)$. Hence
    the probability of $t$ falling into the interval $(a, b)$ can be calculated as
    $F(b) - F(a)$. The derivative of the cumulative distribution function satisfies
    $\frac{d}{dx}F(x) = F''(x) = f(x)$ by the _Fundamental Theorem of Calculus_. The
    cumulative distribution functions of the normal distribution for the same values
    of $\mu$ and $\sigma$ as in Figure 2.2 are shown in Figure 2.4. All approach one
    as the argument increases, since the probability for $t$ falling into the interval
    $(-\infty, \infty)$ is one.


    The rules for probability also hold for continuous variables and probability density
    functions:


    +   sum rule       \( f(x) = \int_{-\infty}^{\infty} f(x, y)dy, \)

    +   product rule   \( f(x, y) = f(x|y)f(y), \)

    +   Bayes'' rule    \( f(y|x) = \frac{f(x|y)f(y)}{f(x)} \).


    For a formal derivation of these rules see [13].


    When dealing with a random variable, it is useful to know the average value it
    takes. This is known as the _expectation_, _mean_ or _first moment_ of the probability
    distribution, and is defined as


    $$\mathbb{E}[x] = \int_{-\infty}^{\infty} f(x)x dx.$$


    When $x$ is discrete, integrating over the point masses at the possible values
    $x$ can take reduces the expression to a sum,


    $$\mathbb{E}[x] = \sum_{x} f(x)x.$$


    Equally, it is useful to know how much we can _expect_ the values to differ from
    the average. This is the _variance_ or _second central moment_,


    $$\text{var}[x] = \mathbb{E}[(x - \mathbb{E}[x])^2].$$


    Using the definition for the expectation this becomes


    $$\text{var}[x] = \int_{-\infty}^{\infty} (x^2 - 2x\mathbb{E}[x] + \mathbb{E}[x]^2)f(x)dx$$

    $$= \int_{-\infty}^{\infty} x^2 f(x) dx - 2\mathbb{E}[\int_{-\infty}^{\infty}
    x f(x) dx + \mathbb{E}[x]^2 \int_{-\infty}^{\infty} f(x) dx$$

    $$= \mathbb{E}[x^2] - \mathbb{E}[x]^2,$$'
