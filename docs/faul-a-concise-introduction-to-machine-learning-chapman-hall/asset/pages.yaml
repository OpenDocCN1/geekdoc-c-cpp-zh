  md: '![](img/d3c00252180686426c9e63ab889b535b_42_0.png)


    Figure 2.6: The Bernoulli probability mass function and its cumulative distribution
    function.


    This formula might look daunting, but remember that it is only evaluated for x
    = 0 or 1, since no other outcomes are possible, and thus


    Bern(0|\mu) = \mu^0(1-\mu)^1 = 1 - \mu \text{ and } Bern(1|\mu) = \mu^1(1-\mu)^0
    = \mu.


    In Figure 2.6 the probability mass function is two point masses, while the cumulative
    distribution function is a simple step function.


    The expectation and the second crude moment of the Bernoulli distribution are
    given by


    \mathbb{E}[x] = \mu \times 1 + (1 - \mu) \times 0 = \mu,


    \mathbb{E}[x^2] = \mu \times 1^2 + (1 - \mu) \times 0^2 = \mu.


    From this we can calculate the variance


    \text{var}[x] = \mathbb{E}[x^2] - \mathbb{E}[x]^2 = \mu^2 - \mu^2 = \mu(1 - \mu).


    The Bernoulli distribution describes an experiment where the outcome is binary.
    We can now consider the question of how many successes (x = 1) are in a set of
    N experiments. When considering m successes, there are N possibilities for the
    first success, N - 1 for the second, and so on until there are N - m + 1 possibilities
    for the last success. The resulting number N(N - 1)...(N - m + 1) is the number
    of m-permutations. It gives the number of possibilities of choosing an ordered
    set of size m from a set of size N. However, the ordering in our case is unimportant,
    and we therefore divide by the number of possible permutations of size m which
    is given by the factorial m! = m(m - 1)...1. The resulting number of possibilities
    to achieve m times x = 1 in N experiments is given by the binomial coefficient,


    \binom{N}{m} = \frac{N(N - 1) \cdots (N - m + 1)}{m(m - 1) \cdots 1}.


    It is read as "N choose m" and is the coefficient of the a^m term in the expansion
    of (1 + a)^N.'
