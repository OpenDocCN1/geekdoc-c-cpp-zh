    The false negative rate, also known as miss rate is given by


    FNR = \frac{FN}{P} = 1 - TPR.


    It quantifies the percentage of time a positive sample is overlooked. Not identifying
    a patient who has an underlying health problem can have disastrous consequences
    for that patient. Another commonly used term is the fall-out or false positive
    rate (FPR):


    FPR = \frac{FP}{N} = 1 - TNR.


    It is the percentage of time a negative sample is registered as positive. In this
    case the patient worries needlessly. However, this is acceptable in some cases
    as long as subsequent tests avoid needless procedures.


    A perfect classifier would be 100% sensitive (all positives are correctly identified)
    and 100% specific (no negatives are incorrectly classified). In a cascade we want
    all stages to have high sensitivity so that as few as possible patients with a
    health problem are overlooked. High specificity is desirable so that patients
    are not subjected to costly (both financial and human cost) procedures. However,
    in early stages a lower specificity is acceptable. Samples classified as negative
    at a stage are not considered in the following stages, thus decreasing the overall
    cost.'
