    This is reminiscent of a three layer neural network with two sets of hidden neurons
    and the linear activation function, which is the identity, in each neuron. The
    weights of the synapses from the input neurons to the first set of hidden neurons
    are given by the entries of the matrix \(\mathbf{D}^T\), while the weights of
    the synapses from the first set to the second set of hidden neurons are given
    by the entries of the matrix \((\mathbf{D}^T \mathbf{D})^{-1}\). Lastly, the weights
    from the second set of hidden neurons to the output neurons are given by the matrix
    \(\mathbf{D}\). The variables of the second set of hidden neurons are the coefficients
    \(c_1, \dots, c_M\).


    In a neural network, however, the weights of the synapses are updated iteratively
    in a learning process, until the output is similar enough to the input. In ordinary
    least squares, all is entirely determined by the design matrix \(\mathbf{D}\),
    which only depends on the chosen basis functions, but not \(t_1, \dots, t_D\).
    However, if a set of training data \(\mathbf{t}_1, \dots, \mathbf{t}_N\) is available,
    they can be fed through this neural network. The error sum of squares between
    the predictions and the input is


    ```

    E(\mathbf{D}) = \sum_{n=1}^N (\mathbf{t}_n^T \mathbf{t}_n - \mathbf{t}_n^T \mathbf{D}
    (\mathbf{D}^T \mathbf{D})^{-1} \mathbf{D}^T \mathbf{t}_n) ,

    ```


    since it is the ordinary least squares solution. The derivative with regards to
    the entry \(D_{ij}\) of \(\mathbf{D}\) is


    ```

    \frac{\partial}{\partial D_{ij}} E(\mathbf{D}) = \sum_{n=1}^N ((\mathbf{D}^T \mathbf{D})^{-1}
    \mathbf{D}^T \mathbf{t}_n)_j (\mathbf{D} (\mathbf{D}^T \mathbf{D})^{-1} \mathbf{D}^T
    \mathbf{t}_n - \mathbf{t}_n)_i ,

    ```


    where the subscript of the brackets denotes the component of the vector in the
    brackets. It is the sum over the training data of the products of the latent variable
    of the \(j^{th}\) neuron in the second set of hidden neurons with the error'
