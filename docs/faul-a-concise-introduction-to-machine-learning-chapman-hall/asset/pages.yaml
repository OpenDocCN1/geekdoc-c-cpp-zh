  md: 'generates a sample. Thus we have


    ```

    0 \le \pi_k \le 1 \text{ and } \sum_{k=1}^K \pi_k = 1.

    ```


    This can be interpreted as that the latent variables \(\mathbf{z}_1, \dots, \mathbf{z}_N\)
    are drawn from a probability distribution \(p(\mathbf{z})\). Since \(\mathbf{z}\)
    has a 1-of-K representation, \(\mathbf{z}\) is uniquely identified by specifying
    which component is 1. Therefore it is often written as


    ```

    p(z_k=1) = \pi_k.

    ```


    Now, the probability of a feature vector \(\mathbf{v}\) given an indicator variable
    \(\mathbf{z}\) is the conditional probability distribution


    ```

    p(\mathbf{v}|\mathbf{z}) = p(\mathbf{v}|z_k=1) = p_k(\mathbf{v}).

    ```


    The joint probability of \(\mathbf{v}\) and \(\mathbf{z}\) is given by the product
    rule as \(p(\mathbf{v}, \mathbf{z}) = p(\mathbf{v}|\mathbf{z})p(\mathbf{z})\).
    We obtain the probability distribution for \(\mathbf{v}\) by *marginalizing* over
    \(\mathbf{z}\). This means summing the joint distribution over all possible values
    of \(\mathbf{z}\):


    ```

    \begin{aligned}

    p(\mathbf{v}) &= \sum_{\mathbf{z}} p(\mathbf{v}, \mathbf{z}) = \sum_{\mathbf{z}}
    p(\mathbf{v}|\mathbf{z})p(\mathbf{z}) \\

    &= \sum_{k=1}^K p(z_k=1)p(\mathbf{v}|z_k=1) = \sum_{k=1}^K \pi_k p_k(\mathbf{v}).

    \end{aligned}

    ```


    This is called a *mixture distribution*. The probabilities \(\pi_k\) are known
    as *mixing coefficients*.


    For a given feature vector \(\mathbf{v}\), we can calculate the probability that
    it was generated by process \(k\). This is the conditional probability \(p(z_k=1|\mathbf{v})\),
    whose value can be calculated using *Bayes'' Rule*. This is given by


    ```

    P(A|B) = \frac{P(B|A)P(A)}{P(B)},

    ```


    where \(A\) and \(B\) are events. \(P(A)\) and \(P(B)\) are the probabilities
    of \(A\) and \(B\) without regard to each other, \(P(A|B)\) is the *conditional
    probability* of A given that B is true, and \(P(B|A)\) is the conditional probability
    of B given that A is true. Applying Bayes'' rule here leads to


    ```

    p(z_k=1|\mathbf{v}) = \frac{p(z_k=1)p(\mathbf{v}|z_k=1)}{p(\mathbf{v})} = \frac{\pi_k
    p_k(\mathbf{v})}{p(\mathbf{v})}.

    ```


    We see that for a particular \(\mathbf{v}\) the probability that it was generated
    by process \(k\) is the mixing coefficient \(\pi_k\) adjusted by the ratio of
    the probability \(p_k(\mathbf{v})\) to the overall probability \(p(\mathbf{v})\).
    \(p(z_k=1|\mathbf{v})\) is known as the *responsibility* process \(k\) takes for
    explaining the sample \(\mathbf{v}\).'
