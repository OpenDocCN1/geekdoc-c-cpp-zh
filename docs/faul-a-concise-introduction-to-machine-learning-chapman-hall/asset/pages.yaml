  md: '# 7.5 Kernel Principal Component Analysis


    The previous three sections relied on the assumption that the data samples are
    related to latent variables in a lower dimensional space via a linear mapping
    as defined in (7.2). Geometrically, this means that the data lies close to a line,
    plane or hyperplane as illustrated in Figures 7.5 and 7.6. This assumption is,
    however, unrealistic in many practical applications.


    The data samples may lie close to a K-dimensional manifold. A manifold is a set
    of points which locally resembles Euclidean space. An example for a two-dimensional
    manifold is the sphere. Flat-earthers succumb to the impression that locally the
    Earth does look flat. The sphere resembles a plane locally. Globally, however,
    it does not, because travelling continuously in one direction will return to the
    starting point. This is not possible on a plane. Figure 7.7a gives an example
    of data being close to the unit sphere. Lighter shaded data points lie behind
    the surface of the sphere.


    It is possible to choose a mapping \(\phi : \mathbb{R}^D \rightarrow \mathbb{R}^D\)
    into a higher dimensional space such that the data then is linearly related to
    latent variables in a K-dimensional subspace. In Figure 7.7b, the data was first
    mapped to a four-dimensional space, by letting the fourth component be the sum
    of squares of the other three. Since the data lies approximately on the unit sphere,
    the fourth component will be close to one for all data samples. Thus the data
    lies on a hyperplane. After finding the first two principal components, the data
    is projected onto the plane given by these two principal components. This is shown
    in Figure 7.7b. That the two data sets are grouped towards the top or bottom,
    means that they can be separated along one principal component.


    However, like in the kernel trick in Section 5.2, performing the mapping explicitly
    is avoided. Instead, all steps in the calculation use the kernel or kernel for
    short \(k : \mathbb{R}^D \times \mathbb{R}^D \rightarrow \mathbb{R}\) defined
    as


    \(k(\mathbf{x}, \mathbf{y}) = \phi(\mathbf{x})^T \phi(\mathbf{y})\).


    Let \(\mathbf{E}\) be the \(N \times N\) matrix with each entry being equal to
    one. This matrix can be used to mean centre a vector \(\mathbf{a}^T = (a_1, \dots,
    a_N)\) by


    \(\mathbf{a}^T (\mathbf{I} - \frac{1}{N} \mathbf{E}) = \left( a_1 - \frac{1}{N}
    \sum_{n=1}^N a_n, \dots, a_N - \frac{1}{N} \sum_{n=1}^N a_n \right)\).


    It can also be used to shift data samples so that their mean is zero. Let \(\phi(\mathbf{v}_1),
    \dots, \phi(\mathbf{v}_N) \in \mathbb{R}^D\) be the images under the mapping \(\phi\)
    of the data samples \(\mathbf{v}_1, \dots, \mathbf{v}_N \in \mathbb{R}^D\), which
    are known as the pre-images. Further, let \(\mathbf{\Phi}\) be the \(D \times
    N\) matrix whose columns are the vectors \(\phi(\mathbf{v}_1), \dots, \phi(\mathbf{v}_N)\),
    then


    \(\mathbf{\Phi} (\mathbf{I} - \frac{1}{N} \mathbf{E}) = \left( \phi(\mathbf{v}_1)
    - \frac{1}{N} \sum_{n=1}^N \phi(\mathbf{v}_n), \dots, \phi(\mathbf{v}_N) - \frac{1}{N}
    \sum_{n=1}^N \phi(\mathbf{v}_n) \right)\),


    since, for every element in each row of \(\mathbf{\Phi}\), we subtract the mean
    of that row of \(\mathbf{\Phi}\).


    Recall that Principal Component Analysis calculates the covariance matrix \(\mathbf{\Sigma}\)
    of the data samples. In this context, it means the covariance matrix of the'
