    by an orthogonal matrix Q such that DD^T = QPQ^T, where P is a diagonal matrix
    with non-negative entries. Thus the predictions are


    ```

    D(D^T D)^{-1} D^T t = D(QP^{1/2} P^{1/2} Q^T)^{-1} D^T t

    = (DQP^{-1/2})(P^{-1/2} Q^T D^T) t

    = (DQ P^{-1/2})(DQ P^{-1/2})^T t.

    ```


    This is a tied two-layer autoencoder with the linear layer as activation function.
    The weights of the first layer are given by the entries of (DQ P^{-1/2})^T and
    those of the second layer by DQ P^{-1/2}. This illustrates again the link of the
    weights of an autoencoder to the model space which was originally defined as the
    columns of D being functions evaluated at the points, where data samples are taken.
