    will have a moderate variation between pixels, some will be mostly one smooth
    shade of gray. By changing the focus away from the individual pixel to groups
    of pixels, i.e. the blocks, fewer bytes are needed to encode the image.


    In mathematical terms, this represents a change of basis. When storing the values
    for each pixel in a block, this is equivalent to using a basis where all values
    are zero but one, and the position of this non-zero pixel traverses all the block.
    The weights for this basis are the individual pixel values, and most will be nonzero.
    The other basis is shown in Figure 7.1. When representing the block in this basis,
    only a few non-zero weights are necessary.


    In this chapter, we introduce techniques to find representations of the data samples
    with different, but fewer features.


    # 7.1 Principal Component Analysis


    Principal Component Analysis seeks a subspace of a given dimension K of the feature
    space such that projections of the data samples onto that subspace are as spread
    out as possible. If there is space between groups of data samples, this has advantages
    when clustering or classifying. This subspace is known as the principal subspace.


    Let \(\mathcal{D} = \{v_1, ..., v_N\}\) be a set of data samples. We first consider
    the projection onto a one-dimensional subspace defined by the vector w. Just as
    in the case of linear classification, only the direction of the vector is important,
    not its length. The length is chosen to be \(\|w\| = 1\), so that the projection
    of the sample \(v_n\) is calculated as \(w^T v_n\).


    The sample mean is given by


    ```

    \(\mu = \frac{1}{N} \sum_{n=1}^N v_n,\)

    ```'
