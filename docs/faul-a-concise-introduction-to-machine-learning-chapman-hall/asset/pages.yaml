  md: 'A Dirichlet process extends the concept to an unknown variable number of clusters
    \(K\). The notation is


    ```

    \(\mathbf{v}_n \sim \mathcal{N}(\mu_k, \Sigma_k)\)

    \(\mu_k, \Sigma_k \sim G,\)

    \(G \sim \text{DP}(\alpha, G_0).\)

    ```


    The last line means that \(G\) is drawn from a Dirichlet process with parameters
    \(\alpha\) and \(G_0\). A Dirichlet process is a distribution of distributions.
    There are infinite many possibilities for pairs \((\mu, \Sigma)\) and the vector
    \(\pi\) is often described as infinite giving each pair a probability mass. Conceptually,
    infinity is difficult. In practice, the number of clusters \(K\) is at most the
    number of samples \(N\), when every cluster contains at least one sample. Therefore
    \(G\) gives a probability mass of \(N_k/(N-1+\alpha)\) to at most \(N\) pairs
    \((\mu, \Sigma)\) drawn from the base distribution \(G_0\), and assigns the probability
    of \(\alpha/((N-1+\alpha)\) to the set of all other possible pairs. \(G\) is a
    discrete distribution defined on a finite partition of the space of all pairs
    \((\mu, \Sigma)\) which is denoted by \(S\).


    More formally, a distribution \(G\) is drawn from a Dirichlet process with parameters
    \(\alpha\) and \(G_0\), if for any finite, disjoint partition \(S_1, \dots, S_L\)
    of \(S\), where \(L\) can be any finite number, the vector \((G(S_1), \dots, G(S_L))^T\)
    follows a Dirichlet distribution with parameters \(\alpha G_0(S_1), \dots, \alpha
    G_0(S_1)\). In our example,


    ```

    \(G_0(S_l) = \int_{S_l} \text{NIW}(\mu, \Sigma | \mathbf{m}, \lambda, \Psi, v)
    d\mu d\Sigma\)

    \(= \int_{S_l} \mathcal{N}(\mu | \mathbf{m}, \frac{1}{\lambda}) \Sigma^{-1} W^{-1}(\Sigma
    | \Psi, v) d\mu d\Sigma.\)

    ```


    Similarly, \(G(S_l)\) can be calculated from the values \(G\) takes on the partition,
    and we indeed have


    ```

    \((G(S_1), \dots, G(S_L))^T \sim \text{Dir}(\alpha G_0(S_1), \dots, \alpha G_0(S_L)).\)

    ```


    The Dirichlet process method infers \(G\) from the data by varying the number
    \(K\) of pairs \((\mu_k, \Sigma_k)\) and their positions. It belongs to a family
    of methods known as *Bayesian nonparametrics* which is Bayesian models operating
    on an infinite-dimensional parameter space. In our case, this is the space of
    all possible pairs \((\mu, \Sigma)\). To delve further into Bayesian nonparametrics
    consult [17].'
