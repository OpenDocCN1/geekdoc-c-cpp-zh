  md: 'conditioned on v. Note that while in Section 6.4 the latent variables are discrete,
    here they are continuous. The principles remain the same though.


    By the product rule, the joint probability is given by


    p(\mathbf{v}, \mathbf{u}) = p(\mathbf{u})p(\mathbf{v}|\mathbf{u})

    = (2\pi)^{-K/2}\exp \left(-\frac{1}{2}\mathbf{u}^T\mathbf{u}\right) \times

    (2\pi\sigma^2)^{-D/2}\exp \left(-\frac{1}{2}\sigma^{-2}(\mathbf{v} - \mathbf{Wu}
    - \boldsymbol{\mu})^T(\mathbf{v} - \mathbf{Wu} - \boldsymbol{\mu})\right).


    Gathering the terms in the exponential gives


    -\frac{1}{2}\sigma^{-2}\left[(\mathbf{v} - \boldsymbol{\mu})^T(\mathbf{v} - \boldsymbol{\mu})
    - (\mathbf{v} - \boldsymbol{\mu})^T\mathbf{Wu} - \mathbf{u}^T\mathbf{W}^T(\mathbf{v}
    - \boldsymbol{\mu}) + \mathbf{u}^T(\mathbf{W}^T\mathbf{W} + \sigma^2\mathbf{I})\mathbf{u}\right].
    (7.5)


    This can be written as


    -\frac{1}{2} \begin{pmatrix} \mathbf{v} - \boldsymbol{\mu} \\ \mathbf{u} \end{pmatrix}^T
    \sigma^{-2} \begin{pmatrix} \mathbf{I} & -\mathbf{W} \\ -\mathbf{W}^T & \mathbf{W}^T\mathbf{W}
    + \sigma^2\mathbf{I} \end{pmatrix} \begin{pmatrix} \mathbf{v} - \boldsymbol{\mu}
    \\ \mathbf{u} \end{pmatrix}.


    Hence the mean of the joint normal distribution is \((\boldsymbol{\mu} \quad \mathbf{0})^T\),
    while the matrix with the scalar factor \(\sigma^{-2}\) is the *precision matrix*,
    i.e. the inverse of the covariance matrix. Therefore, using the inversion formula
    for a block matrix in Appendix A.1.1, the covariance matrix of the joint distribution
    is


    \begin{pmatrix} \sigma^2 \mathbf{I} + \mathbf{W} \mathbf{W}^T & \mathbf{W} \\
    \mathbf{W}^T & \mathbf{I} \end{pmatrix}.


    Using the formula for the calculation of the determinant of a block matrix in
    Appendix A.1.2, the determinant of the joint covariance matrix is \((\sigma^2)^D\)
    which agrees with the factor of the joint probability distribution.


    Also the conditional distribution \(p(\mathbf{u}|\mathbf{v})\) can be deduced
    from (7.5) by treating \(\mathbf{v}\) as a constant. The quadratic term in \(\mathbf{u}\)
    is


    -\frac{1}{2} \sigma^{-2} \mathbf{u}^T(\mathbf{W}^T\mathbf{W} + \sigma^2\mathbf{I})\mathbf{u},


    and thus the covariance matrix of \(p(\mathbf{u}|\mathbf{v})\) is


    \(\mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}} = \sigma^2(\mathbf{W}^T\mathbf{W} +
    \sigma^2\mathbf{I})^{-1},\) (7.6)


    which is independent of \(\mathbf{v}\).


    The linear term in \(\mathbf{u}\) is


    -\frac{1}{2}\sigma^{-2}(-2\mathbf{u}^T\mathbf{W}^T(\mathbf{v} - \boldsymbol{\mu}))
    = \mathbf{u}^T\sigma^{-2}\mathbf{W}^T(\mathbf{v} - \boldsymbol{\mu}).


    This needs to be equal \(\mathbf{u}^T\mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}}^{-1}\mathbf{\mu}_{\mathbf{u}|\mathbf{v}}\).
    Therefore, the mean of the conditional distribution is


    \(\mathbf{\mu}_{\mathbf{u}|\mathbf{v}} = \mathbf{\Sigma}_{\mathbf{u}|\mathbf{v}}\sigma^{-2}\mathbf{W}^T(\mathbf{v}
    - \boldsymbol{\mu}) = (\mathbf{W}^T\mathbf{W} + \sigma^2\mathbf{I})^{-1}\mathbf{W}^T(\mathbf{v}
    - \boldsymbol{\mu}),\) (7.7)'
