    Both sides can be viewed as functions of the random variables \(\mathbf{z}_n\),
    and the expectation with respect to any distribution \(q(\mathbf{z}_n)\) can be
    taken. Since \(\mathbf{z}_n\) is a 1-of-K representation, the expectation is calculated
    by summing over all possible values for \(\mathbf{z}_n\):


