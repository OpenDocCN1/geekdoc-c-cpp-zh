  md: '![](img/d3c00252180686426c9e63ab889b535b_44_0.png)


    Figure 2.8: The geometric probability mass function and its cumulative distribution
    function for \(\mu = 0.3\) (top row), \(\mu = 0.5\) (middle row), and \(\mu =
    0.8\) (bottom row).


    The other question is, how many attempts \(m \ge 1\) are necessary to succeed.
    This is described by the _geometric distribution_ \(m \sim \text{Geo}(\mu)\).
    Its probability mass function is


    \(\text{Geo}(m|\mu) = \mu(1-\mu)^{m-1}.\)


    Its expectation is


    \(\mathbb{E}[m] = \frac{1}{\mu}.\)


    This means that the smaller \(\mu\), the more attempts are necessary to succeed.
    The variance on the other hand is given by


    \(\text{var}[m] = \frac{1-\mu}{\mu^2}.\)


    Sometimes, e.g. in MATLAB, the geometric distribution is defined as the number
    of failures \(\tilde{m} = m-1\) before the first success. In this case, the probability
    mass function is \(\mu(1-\mu)^{\tilde{m}}\) and the expectation is \(\mathbb{E}[\tilde{m}]
    = (1-\mu)/\mu\), while the variance remains the same.


    Instead of using the probability of success, the rate \(\lambda\) of events occurring
    over a certain time interval can be used. It is often given as a positive number,
    but does not need to be an integer. It needs to be in the context of a time interval.
    Examples for \(\lambda\) are the number phone calls to a call center per hour
    or the number of cars passing a traffic checkpoint per day.'
