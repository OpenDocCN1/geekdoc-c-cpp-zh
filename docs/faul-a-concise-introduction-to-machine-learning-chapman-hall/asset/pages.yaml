- pgno: 133
  md: '![](img/d3c00252180686426c9e63ab889b535b_133_0.png)


    ![](img/d3c00252180686426c9e63ab889b535b_133_1.png)


    Figure 5.2: Linearly inseparable data and their transformation to a higher dimensional
    space.


    Letting $\mathbf{w}^T = ( A_{11} \quad 2A_{12} \quad A_{22} \quad b_1 \quad b_2
    )$ and $\tilde{\mathbf{v}} = \begin{pmatrix} v_1^2 \\ v_1 v_2 \\ v_2^2 \\ v_1
    \\ v_2 \end{pmatrix}$, this describes a linear boundary in a five-dimensional
    feature space


    $\mathbf{w}^T \tilde{\mathbf{v}} + c = 0$.


    In other words, we have augmented the feature space by three artificial features


    +   - $v_1^2$

    +   - $v_1 v_2$

    +   - $v_2^2$


    This is known as the *kernel trick*. The features are transformed to a higher
    dimensional feature space where the classes are linearly separable. We will see
    below that in practice this transformation is never performed.


    Figure 5.2 shows artificial data, which cannot be separated by a line, and their
    transformation to a higher dimensional space, where they can be separated by a
    plane. We set $v_3 = \sqrt{v_1^2 + v_2^2}$, and the plane lies at $v_3 = 1$. Going
    back to two dimensions, $v_3^2 = v_1^2 + v_2^2 = 1$ is the unit circle in the
    $v_1, v_2$-plane.


    To formalize this approach, recall that the Support Vector Machine classifies
    according to the sign of


    $-b + \sum_{n=1}^N \alpha_n c_n \mathbf{v}_n^T \mathbf{v}_i$


    where the bias $b$ is given by $- \sum_{n=1}^N \alpha_n c_n$ and where $c_i =
    \pm 1$ is the class label of sample $\mathbf{v}_i$. The $\alpha_i \ge 0$ for $i
    = 1, \dots, N$ maximize the function


    $L(\boldsymbol{\alpha}) = \sum_{n=1}^N \alpha_n - \frac{1}{2} \sum_{i=1}^N \sum_{n=1}^N
    \alpha_i \alpha_n c_i c_n (1 + \mathbf{v}_i^T \mathbf{v}_n)$.'
