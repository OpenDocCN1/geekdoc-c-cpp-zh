  md: 'neurons, if the synapse connects neuron \(i\) to neuron \(j\). Note that, if
    \(l = 1\), then those variables are the input variables, while, when \(l > 1\),
    they are the latent variables. Schematically, this is illustrated as


    ![](img/d3c00252180686426c9e63ab889b535b_296_0.png)


    In the process of training a neural network, the weights are first initialized,
    most often randomly. In forward propagation, the training samples are passed through
    the neural network, calculating all intermediate activations and latent variables,
    as well as the output for each. Then the errors of each training point are calculated
    in a backward pass through the network. After this, the derivative with respect
    to every weight in the network of the contribution to the error function of each
    training sample is calculated. These form the gradient, either batch, mini-batch
    or stochastic. The weights are updated by the chosen optimization method.


    To get some intuition of what is happening, consider binary classification. We
    denote the weights in the last layer by \(w^{(L)}\), since there is only one output
    neuron. Because of \(a^{(L)} = \sum_{k=1}^{M_{L-1}} w_{k1}^{(L)} z_k^{(L-1)}\),
    the derivatives with respect to the weights in the last layer of the \(n\)th contribution
    to the error sum are


    \(\frac{\partial}{\partial w_{ki}^{(L)}} E_n(\mathbf{w}) = (y(\mathbf{x}_n, \mathbf{w})
    - t_n) z_i^{(L-1)}\)


    Since \(y(\mathbf{x}_n, w)\) is interpreted as the probability of \(\mathbf{x}_n\)
    belonging to the positive class, the difference lies in the interval \((-0.5,
