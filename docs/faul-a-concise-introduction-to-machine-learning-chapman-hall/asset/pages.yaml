    # 4.6 The Support Vector Machine


    Letting the learning rate $\alpha$ be a choice is crude. All should be determined
    by the data. When all samples are correctly classified, that is $c_n = \text{sgn}(\hat{\mathbf{w}}^T
    \hat{\mathbf{v}}_n)$, the margin is defined as


    ```

    $$\min_{n=1,\dots,N} c_n \frac{\hat{\mathbf{w}}^T \hat{\mathbf{v}}_n}{\|\hat{\mathbf{w}}\|}
    > 0.$$

    ```


    The Support Vector Machine (SVM) tries to maximize the margin between the two
    classes.


    Note that the margin is independent of any rescaling of $\hat{\mathbf{w}}$, since
    we divide by the length of $\hat{\mathbf{w}}$. We use the freedom to rescale $\hat{\mathbf{w}}$
    such that $c_n \hat{\mathbf{w}}^T \hat{\mathbf{v}}_n - 1 \ge 0$ for all $n = 1
    \dots N$ with equality for at least one sample. Hence we impose some constraints
    on $\hat{\mathbf{w}}$. In the case of samples, where we have equality, the constraints
    are said to be *active*. For the other samples, they are *inactive*. Subject to
    these constraints, maximizing the margin is equivalent to maximizing $\|\hat{\mathbf{w}}\|^{-1}$.
    Hence, the equivalent problem is: Minimize the *objective function* $\|\hat{\mathbf{w}}\|^2/2$
    subject to the constraint $c_n \hat{\mathbf{w}}^T \hat{\mathbf{v}}_n - 1 \ge 0$
    for all $n = 1 \dots N$. This is known as a *quadratic programming problem*. The
    reasons for which will become clear below, this is called the *primal optimization
    problem*.


    Figure 4.10 illustrates the quadratic programming problem. The circles are the
    *isolines* of $\|\hat{\mathbf{w}}\|^2/2$, that is lines where it takes a constant
    value. In the white region, no constraints are satisfied, in the light gray region,
    one'
