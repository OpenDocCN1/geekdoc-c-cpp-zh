- pgno: 112
  md: '![](img/d3c00252180686426c9e63ab889b535b_112_0.png)


    Figure 4.2: Projection of v1 and v2 onto w.


    The line through the sample means is then parametrized by


    l(a) = μ0 + a(μ1 − μ0).


    For a ∈ [0, 1] we are on the line segment between the sample means and thus the
    midpoint is given when a = 1/2, hence b = 1/2(μ0 + μ1).


    This approach is illustrated in Figure 4.4 where both the projection line and
    the separation line perpendicular to the projection line through the mid-point
    between sample means is shown. However, it fails to take into account the variance
    within each class, that is how much and in which way the samples differ from the
    mean. In Figure 4.4 we have also drawn the 95% confidence ellipses and their axes.
    This means that 95% of the samples lie within the ellipses.


    Naively, one could move the separation threshold to the intersection of the confidence
    ellipses. However, this is subjective and a different value of the confidence,
    e.g. 99%, would move this point. Also, since the two ellipses have their axes
    at different angles, it means that the projections of samples of one class are
    more spread out than the projections of the samples of the other class.


    The goal is to find a line of projection such that:


    +   - The projected means of each class are as far apart as possible,

    +   - The projected samples of each class are as close together as possible.


    In the next section we see how Fisher tackled this problem.'
