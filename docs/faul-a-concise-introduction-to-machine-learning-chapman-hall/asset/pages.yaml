    # Figure 3.8: Random walk generated by Gibbs sampling.


    To determine the acceptance probability, we need to calculate


    ```

    \frac{f(\mathbf{x}^*)g(\mathbf{x}^*, \mathbf{x})}{f(\mathbf{x})g(\mathbf{x}, \mathbf{x}^*)}
    = \frac{f(\mathbf{x}^*)p(x_d|\mathbf{x}^*_{-d})}{f(\mathbf{x})p(x_d^*|\mathbf{x}_{-d})}

    =

    \frac{f(x_1, \dots, x_{d-1}, x_d^*, x_{d+1}, \dots, x_D)p(x_d|\mathbf{x}_{-d})}{f(\mathbf{x})p(x_d^*|\mathbf{x}_{-d})}.

    ```


    Now using the product rules


    ```

    f(\mathbf{x}) = p(x_d|\mathbf{x}_{-d})p(\mathbf{x}_{-d})

    f(x_1, \dots, x_{d-1}, x_d^*, x_{d+1}, \dots, x_D) = p(x_d^*|\mathbf{x}_{-d})p(\mathbf{x}_{-d})

    ```


    we see that the fraction evaluates to 1. Thus every sample in the intermediate
    steps is accepted.


    Figure 3.8 shows the random walk generated by the steps of the Gibbs algorithm
    for the same normal distribution as in the examples in Figure 3.7. The samples
    generated by the Gibbs algorithm are highly correlated. To approximate independence
    between samples thinning can be used. Another technique is blocking, where not
    the conditional probabilities of individual components are used, but of sets of
    several components, which can be overlapping.'
