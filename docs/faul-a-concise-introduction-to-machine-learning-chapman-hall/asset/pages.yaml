  md: 'In order to use back propagation, the sampling is moved to the input neurons,
    where a vector \(\eta = (\eta_1, \dots, \eta_{M_{L/2}})^T\) is sampled from the
    standard normal distribution in \(M_{L/2}\) dimensions. With this,


    ```

    \(\mathbf{z}^{(L/2)} = \boldsymbol{\mu}(\mathbf{x}) + \mathbf{\Sigma}^{1/2}(\mathbf{x})\boldsymbol{\eta}
    = \begin{pmatrix} \mu_1(\mathbf{x}) + \sigma_1(\mathbf{x})\eta_1 \\ \vdots \\
    \mu_{M_{L/2}}(\mathbf{x}) + \sigma_{M_{L/2}}(\mathbf{x})\eta_{M_{L/2}} \end{pmatrix}.\)

    ```


    The schematics are


    ![](img/d3c00252180686426c9e63ab889b535b_302_0.png)


    For clarity the input neurons are shaded grey. As before, the dotted lines indicate
    that any combination of hidden neurons, layers and transfer functions is possible,
    making use of the capability of neural networks to model any function.


    The error function is the sum over all training data \(\mathbf{x}_n\) of \(-\log
    p(\mathbf{x}_n)\) and the Kullback-Leibler divergence between \(p_\phi(\mathbf{z}^{(L/2)}|\mathbf{x}_n)\)
    and \(p(\mathbf{z}^{(L/2)}|\mathbf{x}_n)\). One term of this sum is given by


    ```

    \(E_n = -\log p(\mathbf{x}_n) + D_{KL}(p_\phi(\mathbf{z}^{(L/2)}|\mathbf{x}_n)||p(\mathbf{z}^{(L/2)}|\mathbf{x}_n))\)

    \(= \int p_\phi(\mathbf{z}^{(L/2)}|\mathbf{x}_n) \left[ -\log p(\mathbf{x}_n)
    - \log \frac{p(\mathbf{z}^{(L/2)}|\mathbf{x}_n)}{p_\phi(\mathbf{z}^{(L/2)}|\mathbf{x}_n)}
    \right] d\mathbf{z}^{(L/2)}.\)

    ```


    Using Bayes'' rule


    ```

    \(p(\mathbf{z}^{(L/2)}|\mathbf{x}_n) = \frac{p(\mathbf{x}_n|\mathbf{z}^{(L/2)})p(\mathbf{z}^{(L/2)})}{p(\mathbf{x}_n)},\)

    ```'
