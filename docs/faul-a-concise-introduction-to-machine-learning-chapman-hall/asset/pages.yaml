    Figure 2.14: The log-normal cumulative distribution function for various values
    of \(\mu\) and \(\sigma\).


    We now use a technique called *completion of squares*:


    ```

    \(-(y-\mu)^2 + 2\sigma^2 y = -y^2 + 2y\mu - \mu^2 + 2\sigma^2 \mu = -y^2 + 2(\mu
    + \sigma^2)y - \mu^2\)

    \(= -(y - (\mu + \sigma^2))^2 + (\mu + \sigma^2)^2 - \mu^2\)

    \(= -(y - (\mu + \sigma^2))^2 + 2\mu\sigma^2 + \sigma^4.\)

    ```


    With this, the expectation becomes


    ```

    \(\mathbb{E}[x] = \int_{-\infty}^{\infty} \frac{1}{\sqrt{2\pi}\sigma} \exp \left(
    \frac{-(y - (\mu + \sigma^2))^2 + 2\mu\sigma^2 + \sigma^4}{2\sigma^2} \right)
    dy\)

    \(= \exp \left( \mu + \frac{\sigma^2}{2} \right) \int_{-\infty}^{\infty} \frac{1}{\sqrt{2\pi}\sigma}
    \exp \left( \frac{-(y - (\mu + \sigma^2))^2}{2\sigma^2} \right) dy.\)

    ```


    The integral evaluates to 1, since the integrand is the normal probability density
    function with mean \(\mu + \sigma^2\) and variance \(\sigma^2\). Thus the expectation
    is


    ```

    \(\mathbb{E}[x] = \exp \left( \mu + \frac{\sigma^2}{2} \right).\)

    ```


    The variance can be similarly calculated and is


    ```

    \(\text{var}[x] = (\exp(\sigma^2) - 1) \exp(2\mu + \sigma^2).\)

    ```'
