    # **Inverse multiquadric kernel** \(\theta_1^2 \left( 1 + \frac{\|\mathbf{x} -
    \mathbf{y}\|^2}{2\theta_2^2} \right)^{-1/2}\).


    # **Rational quadratic kernel** \(\theta_1^2 \left( 1 + \frac{\|\mathbf{x} - \mathbf{y}\|^2}{2\alpha\theta_2^2}
    \right)^{-\alpha}, \alpha > 0\).


    # **Thin plate spline kernel** \(\theta_1^2 \|\mathbf{x} - \mathbf{y}\|^2 \log(\|\mathbf{x}
    - \mathbf{y}\|) + \theta_2^2\).


    As an example, we show that the Gaussian kernel is a valid kernel. Firstly, \(\|\mathbf{x}
    - \mathbf{y}\|^2 = \mathbf{x}^T \mathbf{x} - 2\mathbf{x}^T \mathbf{y} + \mathbf{y}^T
    \mathbf{y}\)


    and the kernel can be written as


    ```

    \(k(\mathbf{x}, \mathbf{y}) = \theta_1 \exp \left( -\frac{1}{2\theta_2^2} \mathbf{x}^T
    \mathbf{x} \right) \exp \left( \frac{1}{\theta_2^2} \mathbf{x}^T \mathbf{y} \right)
    \theta_1 \exp \left( -\frac{1}{2\theta_2^2} \mathbf{y}^T \mathbf{y} \right)\)

    \(= f(\mathbf{x}) \exp \left( \frac{1}{\theta_2^2} \mathbf{x}^T \mathbf{y} \right)
    f(\mathbf{y}).\)

    ```


    This is a valid kernel, since it is the exponential of the inner product multiplied
    by a positive constant, and because of Equation (5.1).


    The Gaussian kernel is also known as a squared exponential kernel or exponentiated
    quadratic kernel. It is an intuitive similarity measure. If the sample \(\mathbf{y}\)
    happens to be the same as sample \(\mathbf{x}\), the Gaussian kernel evaluates
    to \(\theta_1^2\), its maximum value. \(\theta_1\) is known as the signal standard
    deviation. With the Euclidean distance between samples increasing, the similarity
    measure given by the Gaussian kernel decreases, the rate of decrease being determined
    by \(\theta_2\), which is the characteristic length scale.


    Figure 5.4 gives two examples of Gausian kernels, for different choices of \(\theta_2\).
    The choice of \(\theta_2\) is crucial in the performance of the kernel, since
    it determines the width of the kernel. The larger the \(\theta_2\), the wider
    the base of the kernel. The kernels are centred at the support vectors. If the
    width is chosen too narrow, the kernels evaluate to nearly zero for all samples
    except the ones close to support vectors. If it is chosen too wide, the kernels
    evaluate to values similar to each other, since the slope is at a low angle. It
    is then hard to make a distinction between samples.'
