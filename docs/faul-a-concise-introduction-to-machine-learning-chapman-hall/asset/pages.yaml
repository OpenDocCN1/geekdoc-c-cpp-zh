  md: 'on the right hand side leaves the equation unchanged, and we obtain


    ```

    \mathcal{L} = \sum_{k=1}^K \sum_{n=1}^N q(z_{n,k}=1) \log \frac{p(\mathbf{v}_n,
    z_{n,k}=1)}{q(z_{n,k}=1)} + \sum_{n=1}^N \sum_{k=1}^K q(z_{n,k}=1) \log \frac{q(z_{n,k}=1)}{p(z_{n,k}=1|\mathbf{v}_n)},
