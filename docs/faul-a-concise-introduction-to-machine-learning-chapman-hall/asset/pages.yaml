- pgno: 231
  md: 'where $\hat{w}_{k,n}, n=1, \dots, N$, are the components of $\hat{\mathbf{w}}_k$.
    In practice, however, this calculation is never done, since we are only interested
    in expressing any data point $\mathbf{v}$ in the basis formed by the principal
    components, i.e. the value of the projections


    $$\mathbf{w}_k^T \phi(\mathbf{v})^T = \frac{1}{N\lambda_k} \hat{\mathbf{w}}_k^T
    \mathbf{\Phi}^T \phi(\mathbf{v}) = \frac{1}{N\lambda_k} \hat{\mathbf{w}}_k^T \begin{pmatrix}
    \phi(\mathbf{v})^T \phi(\mathbf{v}_1) \\ \vdots \\ \phi(\mathbf{v})^T \phi(\mathbf{v}_N)
    \end{pmatrix}$$

    $$= \frac{1}{N\lambda_k} \hat{\mathbf{w}}_k^T \begin{pmatrix} k(\mathbf{v}, \mathbf{v}_1)
    \\ \vdots \\ k(\mathbf{v}, \mathbf{v}_N) \end{pmatrix}.$$


    It remains to specify the length of $\hat{\mathbf{w}}_k$. The principal components
    have length one. This translates into a condition on the length of $\hat{\mathbf{w}}_k$,


    $$1 = \mathbf{w}_k^T \mathbf{w}_k = \frac{1}{(N\lambda_k)^2} \hat{\mathbf{w}}_k^T
    \mathbf{\Phi}^T \mathbf{\Phi} \hat{\mathbf{w}}_k$$

    $$= \frac{1}{(N\lambda_k)^2} \hat{\mathbf{w}}_k^T (\mathbf{I} - \frac{1}{N}\mathbf{E})
    \mathbf{K} (\mathbf{I} - \frac{1}{N}\mathbf{E}) \hat{\mathbf{w}}_k = \frac{1}{N\lambda_k}
    \hat{\mathbf{w}}_k^T \hat{\mathbf{w}}_k,$$


    since $\hat{\mathbf{w}}_k = (\mathbf{I} - \frac{1}{N}\mathbf{E})\mathbf{w}_k$
    is an eigenvector with eigenvalue $N\lambda_k$. Thus, $\hat{\mathbf{w}}_k$ has
    to have length $\sqrt{N\lambda_k}$.


    The kernel function does not need to be defined via a mapping $\phi$ and an inner
    product in a higher dimensional space. Section 5.2 gives several examples of kernel
    functions. Figure 7.8 shows the results of kernel Principal Component Analysis
    applied to the data in Figure 7.7a for various choices of kernels. Visually the
    results are quite different, but what they have in common is that the two data
    sets are grouped towards the left or right. This means that they can be separated
    along one principal component.'
