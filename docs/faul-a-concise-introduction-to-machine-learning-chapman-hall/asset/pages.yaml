  md: '![](img/d3c00252180686426c9e63ab889b535b_281_0.png)


    Figure 8.15: Sum of linear and Gaussian kernel with optimized parameters.


    Figure 8.14 shows the mean and two standard deviations of the posterior Gaussian
    process for various kernels, where the parameters have been optimized, as well
    as four draws. The fit near the data points is excellent, when the Gaussian kernel
    is used. The inverse multiquadric kernel also performs well, while the exponential
    kernel seems unsuitable.


    The mean of the posterior Gaussian process returns to zero away from the data
    points due to the choice of kernel, though it does so slower than with the original
    choice of parameters. Therefore, we combine the Gaussian kernel with a linear
    kernel. That is, the kernel is given by


    ```

    k(\mathbf{x}, \mathbf{y}) = \theta_1^2 + \theta_2^2 \mathbf{x}^T \mathbf{y} +
    \theta_3^2 \exp \left( - \frac{\|\mathbf{x} - \mathbf{y}\|^2}{2\theta_4^2} \right).

    ```


    After optimization the parameters are approximately \(\theta_1 \approx 10^{-5},
    \theta_2 \approx 0.90, \theta_3 \approx 1.13\) and \(\theta_4 \approx 1.65\).
    The goodness of approximation is illustrated in Figure 8.15 over a wider range.
    While the mean drifts away from the true function, the general trend is kept.
    A better approximation can be achieved with more data. Which combination of kernels
    should be used depends on the application and is a field of active research with
    new kernels being developed for specific usages.'
