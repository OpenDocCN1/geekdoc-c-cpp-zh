    # ## 9.3 Autoencoders


    In this section, we examine a group of neural networks known as *autoencoders
    (AE)*. The main feature is that the number of output neurons \(K\) equals the
    number of input neurons \(D\), i.e. \(K = D\), and the purpose is the reconstruction'
