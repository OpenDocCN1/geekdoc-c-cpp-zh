    % Permute data.

    m = m*P;

    s = s*P;

    t = t*P;

    % Fit linear separation line using the Perceptron

    PerceptronModel = perceptron;

    PerceptronModel = configure(PerceptronModel,m(:,1),s(1));

    % Use all samples for training.

