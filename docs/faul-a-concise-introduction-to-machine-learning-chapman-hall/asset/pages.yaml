  md: 'For the contractive autoencoder, the penalty term


    ```

    $\Omega_F = \frac{1}{2} \sum_{n=1}^N \| J_\phi(\mathbf{x}_n) \|_F^2 = \sum_{n=1}^N
    \text{tr}(J_\phi(\mathbf{x}_n)^T J_\phi(\mathbf{x}_n)) = \sum_{n=1}^N \sum_{m=1}^{M_{L/2}}
    \sum_{d=1}^D |\frac{\partial \phi_m}{\partial x_d}(\mathbf{x}_n)|^2$

    ```


    is added to the error function, again multiplied by a weight $\lambda$.


    The autoencoders so far produce, once trained, latent variables $\mathbf{z}^{(L/2)}$
    deterministically from which the output is calculated in a deterministic way.
    The variational autoencoder takes a different approach. The assumption is that
    the data are sampled from some distribution $p(\mathbf{x})$, where


    ```

    $p(\mathbf{x}) = \int p\left(\mathbf{x}|\mathbf{z}^{(L/2)}\right) p\left(\mathbf{z}^{(L/2)}\right)
    d\mathbf{z}^{(L/2)}.$

    ```


    Further, it is assumed that $p(\mathbf{x}|\mathbf{z}^{(L/2)})$ follows a normal
    distribution with mean $\psi(\mathbf{z}^{(L/2)})$ and variance $\sigma^2 \mathbf{I}$,
    where $\mathbf{I}$ is the $D \times D$ identity matrix. The prior probability
    distribution of $\mathbf{z}$ is the standard multivariate normal distribution.
    The overall probability of $p(\mathbf{x})$ can be estimated by by sampling many
    values $\mathbf{z}_1^{(L/2)}, \dots, \mathbf{z}_K^{(L/2)}$ and then calculating


    ```

    $p(\mathbf{x}) = \frac{1}{K} \sum_{k=1}^K p(\mathbf{x}|\mathbf{z}_k^{(L/2)}) =
    \frac{1}{K} \sum_{k=1}^K (2\pi\sigma^2)^{-D/2} \exp\left(-\frac{1}{2\sigma^2}
    \|\mathbf{x} - \psi(\mathbf{z}^{(L/2)})\|^2\right).$

    ```


    The complete data likelihood is estimated as


    ```

    $\prod_{n=1}^N p(\mathbf{x}_n) = \prod_{n=1}^N \frac{1}{K} \sum_{k=1}^K (2\pi\sigma^2)^{-D/2}
    \exp\left(-\frac{1}{2\sigma^2} \|\mathbf{x}_n - \psi(\mathbf{z}^{(L/2)})\|^2\right).$

    ```


    Maximizing this is equivalent to minimizing the negative logarithm. However, this
    does not result in a convenient sum of squares as before because of the sum resulting
    from the estimation of $p(\mathbf{x}_n)$. Another computational difficulty is
    that $K$ might need to be large (especially in high dimensions) to obtain a good
    estimate. In addition, sampling is not a continuous operation and thus not differentiable.
    So error backpropagation cannot be applied.


    Variational autoencoders address these problems. The first step is to reduce $K$,
    by choosing $p(\mathbf{z}^{(L/2)})$ such that only values of $\mathbf{z}^{(L/2)}$
    are sampled which are likely to produce samples of $\mathbf{x}$. In other words,
    the aim is to find $p(\mathbf{z}^{(L/2)}|\mathbf{x})$. For this, the encoder is
    used. To make this clear in notation the encoder gives an estimate $p_\phi(\mathbf{z}^{(L/2)}|\mathbf{x})$
    as a normal multivariate distribution. The function $\phi$ does not return $\mathbf{z}^{(L/2)}$,
    but


    ```

    $(\boldsymbol{\mu}(\mathbf{x}), \boldsymbol{\Sigma}(\mathbf{x})) = \phi(\mathbf{x}).$

    ```


    To keep the number of variables manageable, $\boldsymbol{\Sigma}(\mathbf{x})$
    is restricted to be diagonal, that is $\boldsymbol{\Sigma}(\mathbf{x}) = \text{diag}(\sigma_1^2,
    \dots \sigma_{M_{L/2}}^2)$. Hence, $\phi(\mathbf{x})$ calculates $2M_{L/2}$ latent
    variables.'
