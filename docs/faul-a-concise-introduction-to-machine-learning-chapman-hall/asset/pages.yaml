  md: 'be the \( k^{\text{th}} \) component of \( \mathbf{z}_n \). The objective function
    can then be rewritten as


    \( J = \sum_{n=1}^N \sum_{k=1}^K z_{n,k} \| \mathbf{v}_n - \boldsymbol{\mu}_k
    \|^2 \).


    This is quadratic in \( \boldsymbol{\mu}_k \). The minimum is found by differentiating
    with respect to \( \boldsymbol{\mu}_k \) for each \( k \) using Appendices A.2.1
    and A.2.2 and setting this to zero,


    \( 2 \sum_{n=1}^N z_{n,k} (\mathbf{v}_n - \boldsymbol{\mu}_k) = 0 \).


    This gives new centre locations for all \( k \)


    \( \boldsymbol{\mu}_k = \frac{\sum_{n=1}^N z_{n,k} \mathbf{v}_n}{\sum_{n=1}^N
    z_{n,k}} \). (6.1)


    However, now that the centres have moved, the indicator vectors \( \mathbf{z}_n
    \) have to be adjusted. This can be viewed as minimizing \( J \) with respect
    to all \( \mathbf{z}_n \). This in turn will cause the centres to move again.
    The algorithm alternates between moving the centres \( \boldsymbol{\mu}_k \) and
    recalculating \( \mathbf{z}_n \). It terminates, when after moving the centres,
    none of the indicator vectors changes.


    Looking at (6.1), note that \( \sum_{n=1}^N z_{n,k} \) gives the number of data
    samples for which \( \mu_k \) is the closest centre, while \( \sum_{n=1}^N z_{n,k}
    \mathbf{v}_n \) is the sum of those samples. Thus \( \mu_k \) is the mean of the
    samples assigned to this particular cluster.


    The algorithm arrives at a local minimum of \( J \). However, this is by no means
    necessarily a global minimum. In fact, the solution is highly dependent on the
    initialization of the cluster centres. These can be chosen randomly at the start,
    or the samples can be randomly assigned clusters and the initial cluster centres
    be calculated as the mean of these random assignments. To counter this dependency
    on initial values, the algorithm is run (possibly in parallel) with many different
    initializations. After convergence, the result with the lowest value of \( J \)
    is chosen.


    The squared Euclidean norm of the difference between sample and cluster centre
    was used. The algorithm can be generalized using any dissimilarity measure between
    two feature vectors, just as kernels were used as similarity measures for the
    kernel trick described in Section 5.2. In this case, the method is known as \(
    K \)-medoids algorithm. However, the minimization with regards to \( \mu_k \)
    might be much more involved. It depends on the differentiability of the dissimilarity
    measure, and whether it is possible to find where the derivative vanishes. If
    this is not possible, it is common practice to require each cluster centre to
    be one of the data samples. The minimization with respect to \( \mu_k \) is then
    a search among the data samples assigned to the \( k^{\text{th}} \) cluster.


    Lossy data compression is achieved by choosing a suitable number of clusters and
    storing the feature vectors of the centres, \( \mu_k \). For each data sample
    only the cluster it belongs to is stored. This can be applied to images. Typically
    images are represented by storing three values for each pixel, with each'
