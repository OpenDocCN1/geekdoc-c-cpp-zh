    (\mathbf{v}_n - \mu_k) \\ &= \sum_{n=1}^N p(z_{n,k}=1|\mathbf{v}_n) \Sigma_k^{-1}
    (\mathbf{v}_n - \mu_k). \end{aligned} $$


