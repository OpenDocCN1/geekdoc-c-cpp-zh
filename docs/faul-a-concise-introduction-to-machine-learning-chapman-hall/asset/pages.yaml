- pgno: 176
  md: 'Hence, we find \(\lambda = -N\). Inserting this result into (6.4) and again
    multiplying by \(\pi_k\), we have


    ```

    0 = \sum_{n=1}^N \frac{\pi_k p_k(\mathbf{v}_n)}{\sum_{k=1}^K \pi_k p_k(\mathbf{v}_n)}
    - N \pi_k = \sum_{n=1}^N \frac{\pi_k p_k(\mathbf{v}_n)}{p(\mathbf{v}_n)} - N \pi_k

    = \sum_{n=1}^N p(z_{n,k} = 1 | \mathbf{v}_n) - N \pi_k.

    ```


    Therefore,


    ```

    \pi_k = \frac{1}{N} \sum_{n=1}^N p(z_{n,k} = 1 | \mathbf{v}_n). \quad (6.5)

    ```


    Thus the mixing coefficient \(\pi_k\) is the average responsibility that all data
    samples are generated by process \(k\).


    We need to emphasize here that this is not a closed form solution, since the responsibilities
    \(p(z_{n,k} = 1 | \mathbf{v}_n)\) depend on \(\pi_k\) itself. However, an iterative
    scheme can be derived from this, where the mixing coefficients \(\pi_k\) and the
    parameters of the probabilities \(p_k(\mathbf{v})\) are initially estimated, then
    the mixing coefficients are updated according to (6.5). The next step is to maximize
    with respect to the parameters. The method alternates between these two steps.


    In the following sections, we will see different techniques of maximizing with
    respect to the parameters. A note of caution is however appropriate at this point,
    and this is in relation to outliers in the data. Assume that \(K = 2\) and that
    all data samples are roughly grouped together apart from one outlier. In a maximization
    procedure \(\pi_1\) will tend to \((N-1)/N\) while \(\pi_2\) will tend to \(1/N\).
    \(p_1(\mathbf{v})\) will roughly describe the distribution of \(N-1\) samples.
    The problem comes with \(p_2(\mathbf{v})\). The likelihood can be increased again
    and again by concentrating the probability mass of \(p_2(\mathbf{v})\) more and
    more tightly around the outlier. Hence, the evaluation of \(p_2(\mathbf{v})\)
    at the outlier will tend to infinity, while the area where \(p_2(\mathbf{v})\)
    is non-zero tends to zero. This in turn leads to the likelihood tending to infinity.
    Heuristics are used to identify such degenerate cases. For example, such outliers
    could be identified and removed from the data set during the maximization procedure.
    Or \(K\) is reduced such that it is not possible for outliers to be assigned their
    own cluster.


    Something else to be aware of is that any solution actually has \(K!\) equivalent
    solutions. These arise by just relabeling the clusters by permutations of \(1
    \dots K\). This equivalence is known as *identifiability*, and is important when
    comparing and interpreting models. In this context, however, this is of no importance,
    since just any one of the equivalent solutions needs to be found.


