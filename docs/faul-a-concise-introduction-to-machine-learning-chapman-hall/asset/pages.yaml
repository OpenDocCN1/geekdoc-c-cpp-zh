    Figure 4.11: Weighing the relationships of training samples to a new sample.


    is called the dual function of the primal optimization problem. Note that in the
    feasible set, \(L(\boldsymbol{\alpha})\) is always a lower bound of \(\|\hat{\mathbf{w}}\|^2/2\).
    We find the largest lower bound by maximizing with respect to \(\boldsymbol{\alpha}\).


    We recover the original maximization problem when the multiplier \(\alpha_n\)
    is zero, if the constraint is inactive, and positive otherwise. Formally, this
    is written as

    \(\alpha_n (c_n \hat{\mathbf{w}}^T \hat{\mathbf{v}}_n - 1) = 0\).


    This property is known as *complementarity*. If this is the case, the maximum
    lower bound and the constrained minimum are the same. The solution is a stationary
    point of \(L(\hat{\mathbf{w}}, \boldsymbol{\alpha})\), that is its derivatives
    vanish. Using Appendices A.2.1 and A.2.2, the derivative of \(L(\hat{\mathbf{w}},
    \boldsymbol{\alpha})\) with respect to \(\hat{\mathbf{w}}\) is

    \(\frac{d}{d\hat{\mathbf{w}}} L(\hat{\mathbf{w}}, \boldsymbol{\alpha}) = \hat{\mathbf{w}}
    - \sum_{n=1}^N \alpha_n c_n \hat{\mathbf{v}}_n\).


    Setting this to zero is equivalent to the gradient of the objective function being
    a linear combination of the gradients of the constraints.


    Inserting

    \(\hat{\mathbf{w}} = \sum_{n=1}^N \alpha_n c_n \hat{\mathbf{v}}_n, \quad (4.3)\)


    into the Lagrangian function, we seek \(\boldsymbol{\alpha}\) that maximizes the
    dual function given by

    \(L(\boldsymbol{\alpha}) = \sum_{n=1}^N \alpha_n - \frac{1}{2} \sum_{i=1}^N \sum_{n=1}^N
    \alpha_i \alpha_n c_i c_n \hat{\mathbf{v}}_i^T \hat{\mathbf{v}}_n. \quad (4.4)\)'
