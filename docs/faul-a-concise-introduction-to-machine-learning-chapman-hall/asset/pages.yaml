  md: 'since the linear activation function is used. The dependence of the activation
    \(a_k^{(L)}\) on \(\mathbf{x}_n\) and \(\mathbf{w}\) is made explicit by writing
    \(a_k^{(L)}(\mathbf{x}_n, \mathbf{w})\).


    Taking the derivative with respect to \(w_{ji}^{(l)}\), we arrive at


    ```

    \(\frac{\partial}{\partial w_{ji}^{(l)}} E_n(\mathbf{w}) = \sum_{k=1}^K (a_k^{(L)}(\mathbf{x}_n,
    \mathbf{w}) - t_{nk}) \frac{\partial}{\partial w_{ji}^{(l)}} a_k^{(L)}(\mathbf{x}_n,
    \mathbf{w})\)

    \(= \sum_{k=1}^K (y_k(\mathbf{x}_n, \mathbf{w}) - t_{nk}) \frac{\partial}{\partial
    w_{ji}^{(l)}} a_k^{(L)}(\mathbf{x}_n, \mathbf{w}).\)

    (9.1)

    ```


    It is the weighted sum of the errors in the output neurons, where the weights
    are the derivative of the corresponding activation with respect to \(w_{ji}^{(l)}\).
    Note that also in this derivative the chain rule needs to be employed, unless
    \(l=L\), in which case \(a^{(L)}\) depends directly on \(w_{ji}^{(l)}\). We look
    at this in more detail later. First, we take a look at the other possible machine
    learning tasks.


    If the neural network performs binary classification, there is only one output
    neuron. We resolve the last step of the forward propagation, that is the application
    of the final activation function, explicitly in the \(n^{\text{th}}\) error function,


    ```

    \(E_n(\mathbf{w}) = -t_n \log \frac{1}{1 + \exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w}))}\)

    \(-(1 - t_n) \log \left( 1 - \frac{1}{1 + \exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w}))}
    \right)\)

    \(= t_n \log \left( 1 + \exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w})) \right)\)

    \(-(1 - t_n) \log \frac{\exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w}))}{1 + \exp(-a^{(L)}(\mathbf{x}_n,
    \mathbf{w}))}\)

    \(= \log \left( 1 + \exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w})) \right) + (1 - t_n)
    a^{(L)}(\mathbf{x}_n, \mathbf{w}).\)

    ```


    Differentiating with respect to \(w_{ji}^{(l)}\) gives


    ```

    \(\frac{\partial}{\partial w_{ji}^{(l)}} E_n(\mathbf{w}) = \frac{\exp(-a^{(L)}(\mathbf{x}_n,
    \mathbf{w}))}{1 + \exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w}))} \frac{\partial}{\partial
    w_{ji}^{(l)}} (-a^{(L)}(\mathbf{x}_n, \mathbf{w}))\)

    \(+ (1 - t_n) \frac{\partial}{\partial w_{ji}^{(l)}} a^{(L)}(\mathbf{x}_n, \mathbf{w})\)

    \(= \left( \frac{1}{1 + \exp(-a^{(L)}(\mathbf{x}_n, \mathbf{w}))} - 1 \right)
    \frac{\partial}{\partial w_{ji}^{(l)}} a^{(L)}(\mathbf{x}_n, \mathbf{w})\)

    \(+ (1 - t_n) \frac{\partial}{\partial w_{ji}^{(l)}} a^{(L)}(\mathbf{x}_n, \mathbf{w})\)

    \(= (y(\mathbf{x}_n, \mathbf{w}) - t_n) \frac{\partial}{\partial w_{ji}^{(l)}}
    a^{(L)}(\mathbf{x}_n, \mathbf{w})\)

    ```


    It has the same functional form as (9.1) with \(K=1\).'
