  md: 'columns of D a similar increase can be achieved by updating the coefficients
    of these.


    Note that not including \(d_i(\mathbf{x})\) at this stage does not mean that it
    is excluded from the model altogether. Since the algorithm also deletes basis
    functions from the model the linear dependency might not be present at a later
    stage.


    A similar collinearity check can be derived when \(d_i(\mathbf{x})\) is already
    in the model and \(\alpha_i\) is finite. In this case, if \(\sigma / \sqrt{\|\mathbf{d}_i\|}\)
    is too small, the columns of \(\mathbf{D}\) are deemed nearly linearly dependent.
    This collinearity check is used to postpone the re-estimation of a basis function
    in favour of other updates, since the near linear dependency might be resolved
    in the following steps of the algorithm. This increases stability. Otherwise,
    the algorithm can enter a cycle of re-estimations of linearly dependent basis
    functions. The hyperparameters of these basis functions are typically small indicating
    a wide probability distribution of the coefficients of these basis functions and
    thus uncertainty. Other strategies could be updating a group of basis functions
    within one step or creating a new basis function from a group of functions.


    To summarize, Bayesian learning provides a framework where instead of the model
    being a vector of coefficients, a posterior probability distribution for \(\mathbf{c}\)
    is obtained. This in turn leads to a predictive probability distribution for the
    targets and unseen data samples. In the case of unseen data samples, the change
    in the log-evidence this new data sample causes can be calculated. If this change
    is positive, it affirms the model; otherwise it indicates that the model should
    be improved. By using the empirical distribution of the data samples the expectation
    of the change in likelihood at new points can be calculated, creating an uncertainty
    map of the predictions which is independent of the current model. This framework
    copes with new data samples arriving through the pipeline. It also gives the possibility
    to add new basis functions to the model on the fly, while incorporating a mechanism
    to avoid collinearity.


    # 8.14 Gaussian Process


    In the preceding sections, we have chosen the function space in which our model
    lies by specifying a finite dictionary of basis functions, and the model \(f(\mathbf{x})\)
    being a linear combination of these basis functions. This is restrictive. The
    aim of this section is to look for the model in the uncountably infinite space
    of functions. More specifically the model is a distribution over this space.


    In the Dirichlet process, where we were confronted by infinitely many possibilities
    for the cluster parameters, the infinity is dealt with, because only a finite
    set of data is seen. The data size gives a maximum number of the necessary parameters.
    All other infinitely many possibilities are given one joint probability. Similarly
    here, the infinitely many possibilities are manageable, since only a finite set
    of data is seen.


    A stochastic process is a probability distribution over functions \(f(\mathbf{x})\),
    where \(\mathbf{x} \in \mathbb{R}^D\), such that, when evaluated at any arbitrary
    set of points \(\mathbf{x}_1, \dots, \mathbf{x}_N\), the values \(f(\mathbf{x}_1),
    \dots, f(\mathbf{x}_N)\) follow a specific joint, multivariate probability'
