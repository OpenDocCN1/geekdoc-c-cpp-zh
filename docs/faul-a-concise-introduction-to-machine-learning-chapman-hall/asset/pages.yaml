    - \mathbf{D}\mathbf{c}) \right).


    The multiplicative constants cancel in the fraction and we concentrate on the
    terms in the exponential:


    -\frac{1}{2} \left[ \mathbf{c}^T (\mathbf{A} + \sigma^{-2}\mathbf{D}^T\mathbf{D})
    \mathbf{c} - 2\sigma^{-2}\mathbf{c}^T\mathbf{D}^T\mathbf{t} + \sigma^{-2}\mathbf{t}^T\mathbf{t}
    \right]


