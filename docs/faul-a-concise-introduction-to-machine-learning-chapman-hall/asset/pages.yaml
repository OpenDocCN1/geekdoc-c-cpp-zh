- pgno: 287
  md: 'activation function is even, the mapping from input to output remains the same,
    while, if the activation function is odd, flipping also the sign for all synapses
    going out from this hidden neuron also keeps the mapping the same. If such sign
    flips are possible for all hidden neurons, then this means there are equivalent
    neural networks. These are known as weight space symmetries.


    Altogether there are \(\prod_{l=1}^{L-1} 2^{M_l} M_l!\) symmetries.


    Not all possible synapses need to be present. If the number of synapses is small,
    the network is known as sparse. Excluding certain synapses is a design decision.
    An example is a convolutional neural network. If the weight of a synapse becomes
    zero during the learning process, that is effectively it does not contribute to
    the final output, this means that the information carried by this synapse is deemed
    unimportant. While the resulting mapping is the same as excluding the synapse,
    one is by design, the other is determined from the data by learning. It is also
    possible for a synapse to stretch over two layers. This is known as a skip-layer
    connection.


    The larger the number of synapses, the more training data is necessary to train
    the network, since we need enough information to decide the values of the weights.


    The training of the neural network consists of adjusting the weights until the
    output for the training data is deemed good enough. Again, the measure of goodness
    depends on the task at hand.


    +   Recall that for regression, we assume that the data are the result of an underlying
    process with additional normally distributed noise with mean zero and variance
    \(\sigma^2\). In this context, the process is modeled by the neural network. That
    is, **t** is normally distributed with the mean being the output **y** for input
    **x** and variance \(\sigma^2 \mathbf{I}\), where **I** is the \(K \times K\)
    identity matrix. The mean **y** depends also on the weights of all the synapses
    in the network, which we denote by the vector **w**, in short **y**(**x**, **w**).
    The likelihood of the data given the network can be calculated as


    \(\mathcal{L} = \prod_{n=1}^N (2\pi\sigma^2)^{-K/2} \exp \left( - \frac{1}{2\sigma^2}
    \| \mathbf{t}_n - \mathbf{y}(\mathbf{x}_n, \mathbf{w}) \|^2 \right).\)


    The weights are determined by maximizing the likelihood. This is equivalent to
    minimizing the negative logarithm of the likelihood


    \(- \log \mathcal{L} = \frac{NK}{2} \log \sigma^2 + \frac{NK}{2} \log(2\pi) +
    \frac{1}{2\sigma^2} \sum_{n=1}^N \| \mathbf{t}_n - \mathbf{y}(\mathbf{x}_n, \mathbf{w})
    \|^2.\)'
