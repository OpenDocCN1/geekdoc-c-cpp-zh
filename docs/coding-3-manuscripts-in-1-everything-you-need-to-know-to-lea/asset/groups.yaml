    Java 拥有一丰富的运算符环境列表。如果你好奇什么是运算符，可以将其视为一个符号，它向编译器传递特定信息以执行逻辑或数学操作。在 Java 中，你将与四类运算符进行交互。


    这四类运算符包括：


    - 逻辑运算符

    - 位运算符

    - 关系运算符

    - 算术运算符


    和其他计算机语言一样，Java 拥有一组定义的额外运算符列表，用于处理某些特定场景。在学习 Java 编程语言或任何任何编程语言时，在开始之前你必须理解五个基本概念。这五个基本概念包括：


    - 变量

    - 数据结构

    - 控制结构

    - 语法

    - 工具


    这些概念中的每一个将以初学者水平进行彻底解释，以确保它们被理解。


    ## 分隔符


    它们不适用于高级抽象：注意，许多此类程序使用了低级构建，这些构建主要用于低级抽象。这些编程语言的常用方法是它们关注机器——即如何让计算机执行某些操作，而不是这些功能如何帮助解决用户的问题。


    这些语言处理细微的细节，这已经超出了高级抽象的范围，而我们今天看到的已讨论过的更常见的方法。


    在低级抽象中，数据结构和算法是分开考虑的，而在高级抽象中，它们被视为一个整体。


    ## 字面量


    当提到 Java 中的字面量时，指的是以人类可读的形式出现的固定值。我们可以说数字 200 是字面量。大多数时候，字面量可以是常量。字面量在程序中很重要。事实上，大多数
    Java 程序都使用字面量。我们的一些程序中有字面量。


    Java 中的字面量可以是各种原始数据类型。每个字面量的显示方式取决于其类型。正如之前提到的，我们将字符常量括在单引号中，如 ''c'' 和 ''%''。


    我们在定义整数字面量时不涉及小数数部分。例如，12 和 -30 是整数字面量。浮点字面量应该包含小数点和小数部分。12.389 是一个浮点字面量。


    Java 进一步允许浮点字面量使用科学计数法。整数字面量包含 `int` 值，任何人可以使用 `short`、`byte` 和 `char` 变量来初始化它们。


    ## 注释


    当这种情况发生时，我们称之为灰色注释。在程序的运行阶段，灰色部分（注释）是无意义的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠后跟注释来实现这一点。这里有一个示例。


    ```

    //在此处放置你的单行注释 你可以通过采取以下任一方式拥有多行注释：

    ```


    ```

    //我们将准备把

    // 注释分成两行

    或者

    /*

    此注释跨越了两行

    */

    ```

    如果你查看上面的注释，你会发现它以 /* 开头，但以 */ 结束。


    此外，如果你查看之前的图像（图 8），你会注意到有些注释以单个正斜杠和两个星号 (/**) 开头，但以一个星号和一个正斜杠 (*/) 结束；这被称为 Javadoc
    注释。


    ## 第 2 章：


    ## 变量


    ### 什么是变量？


    另一方面，变量是一个包含特定数据类型并被赋值或接收值的“对象”。之所以被称为变量，是因为其中包含的值可以根据它在代码中的用方式、编码人员如何声明其值，甚至取决于程序用户选择如何与其交互而改变。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记和调用手头的存储值。


    ### Java 中变量的类型


    Java 要求程序员使用声明语句，即用于声明变量并通过指定特定数据类型和名称来定义它们代码行。Java 处理变量有特定方式，将变量定义为包含特定类型和值信息的容器，这不像
    Python 等某些语言，Python 只需要声明变量，且变量可以动态更改其类型；Java 变量是静态的，一旦声明，就会保留其类型。


    ```java

    int number = 20;

    boolean completed = true;

    String hello = "Hello World!"

    ```


    声明中的语法在之前的示例中可见，变量类型在前，然后是变量名，最后是值。请注意，声明语句可以在一行中由多个声明组成，如下例所示：


    ```java

    int number = 20, boolean completed = true, string hello = "Hello World!"

    ```


    Java 变量可以在开始时不赋任何值就进行声明；在这种情况下，Java 选择用特定的默认值声明这些变量，例如：


    ```java

    byte a;

    short num;

    boolean answer;

    ```


    将分别产生值 0、0 和 false。默认值的更完整列表如下：`byte`、`short`、`int` 和 `long` 数据类型将产生默认值 0，而 `float`
    和 `double` 数据类型将产生 ''\u0000'' 值，字符串或任何对象将具有 null 默认值，所有的 Boolean 将以 false 默认值开始。


    在 Java 中，变量在声明时是静态的，这意味着程序员必须定义变量将具有的数据类型。上述过程通常被称为“赋值语句”，其中一个值被赋值给变量，如我们的示例 `num
    = 10` 所示，实际的值位于等号右侧，值为 10，而 `num` 只是调用该值的“标记”。然而，请注意，一旦给变量赋值，就需要执行操作以更改变量内部的数据。


    ### 变量命名


    创建变量是一项简单的任务，特别是考虑到 Java 程序员倾向于根据数据类型或变量将存储的内容来创建和命名。然而，在命名这些变量时有一些规则，否则 Java
    将无法识别它，并产生错误消息。变量名的主要限制是它不应以特殊字符（如下划线或数字）开头。然而，变量名可以由字母、数字甚至下划线等字符组成，只要下划线不放在开头即可。不能使用其他字符，如
    # 甚至 $，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中无法被识别。


    虽然这些主要规则，但在命名变量方面有一些技巧。变量名应该是描述性的，因为在较长的代码中，可能很难记住 "x" 代表什么。使用像 "count" 或 "output"
    这样的变量名比通用的 "x" 或 "y" 要容易得多，并且有助于避免混淆。除了描述性之外，如果变量名保持相当简短，变量也将更易使用。虽然使用像 `banking
    information account records` 这样的变量名非常有描述性，但在程序中需要时反复输入将会


