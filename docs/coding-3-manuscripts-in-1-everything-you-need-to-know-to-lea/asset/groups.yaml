    - Put program files that are usually used together into one package.

    - Because your programs will be small, most of your programs will have only one
    package.

    - Package name rules:


    +   - Make your package name different from anyone else''s package names. Java
    programmers traditionally use their name or business name as the first part of
    their package name.


    +   - Use all lowercase letters with no spaces.


    +   - Use periods between different categories in the package name. For example,
    if the package name identifies who created the package and what it will be used
    for, put a period between the creator and its purpose.


    +   - Make sure when you create the Java Projects in this book that you select
    the option to Use an execution environment JRE of JavaSE-1.7 or higher. Once you
    select this option for creating a project, Eclipse default to that option for
