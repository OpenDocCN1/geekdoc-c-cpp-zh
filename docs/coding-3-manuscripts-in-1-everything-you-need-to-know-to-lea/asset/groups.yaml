    # CHAPTER 10:


    # Memory and Resources


    # Memory Management


    C++ programming language provides a lot of options to users when it comes to managing
    the memory used by an executing program. In this chapter, we shall be exploring
    some of these frequently used options. We would also introduce some modern techniques
    aimed at reducing the memory management problems that have plagued C++ projects
    in the past.


    # Memory Available to C++ Programs


    Modern operating systems usually reserve a section of its memory for executing
    a program that allows the operating system to manage multiple program executions
    simultaneously. There are different operating systems which layout the memory
    of executing the program in different ways. However, the layout would include
    the following four sections.


    - Code: The program''s compiled executable instructions are held in the code section
    memory. While the program executes, the contents of the code section should never
    change. Also, during the program''s executions, the code segment does not change
    as well.

    - Data: Persistent variables and global variables are held in the data section
    of the memory as static locals. Throughout the life span of the executing program
    the variables of the data would exist. However, unless the data is a constant,
    the executing program may freely change their values. Although the values stored
    in the variables found in the data segment may change during the program''s execution,
    the size of the data segment wouldn''t change while the program is executing.
    It is because the program''s source code precisely defines the numbers of global
    and static variables. It is also possible for the compiler to compute the exact
    size of the data segment.

    - Heap: The section where executing program obtains dynamic memory is called the
    heap. Using the new operator gets the memory from the heap, and the delete operator
    returns the previously allocated memory back to the heap. The size of the heap
    shrinks and grows during the program''s execution as the program deallocates and
    allocates dynamic memory using the delete and new.

    - Stack: Function parameters and local variables are always stored in the stack.
    Function parameters and local variables disappear when the function returns and
    appears when a function is called. The size of the stack also shrinks and grows
    during the program''s execution as various functions execute.


    Generally, operating systems limit the size of the stack. Deep recursion can consume
    a considerable amount of stack space. For example, let''s consider an improperly
    recursive function of one that omits the base case and exhibits an "infinite"
    recursion that would consume all the space that is available on the stack. A situation
    such as this is known as a stack overflow. Modern operating systems terminate
    any process that consumes a lot of the stack space. However, on some embedded
    systems, this stack overflow may go undetected. Typically, heap space is plentiful,
    and operating systems can use virtual memory to provide more space than it''s
    available for an executing program. The extra space for the virtual memory comes
    from a disk drive, and the operating system shuttles data from the disk to real
    memory as needed by the executing program. Programs that make use of a virtual
    memory run a lot more slowly than programs that make use of little virtual memory.


    # Manual Memory Management


    Frequent memory management issues with delete and new are the major difficult
    to find and fix the source of the logic error. Programmers have to adhere strictly
    to the following tenets:


    - Everything you call new, it should always have an associated call to delete
    provided the allocated memory isn''t longer needed. It may sound simple, but it
    isn''t always clear when delete should be used, but the function below shows a
    memory leak:


    ```

    void calc(int n) {

    // ...

    // Do some stuff

    // ...

    int *x = new int[n];

    // ...

    // Do some stuff with x

    // ...

    // Exit function without deleting x''s memory

    }

    ```


    Provided a program calls on the calc function enough times, the program will eventually
    run out of memory. In the calc function, x is a local variable. In that light,
    x lives on the stack. So when a user uses a particular call to calc completes,
    the function''s clean up x automatically releases the space helped by the variable
    x. Because all functions automatically manage the memory for their local and parameter
    variables. The problem with x is assigned via new to point to memory allocated
    from the heap and not the stack. Function executions manage to which x pointed
    is not deallocated automatically.


    - Then operator delete should never be used. The code fragment below illustrates
    this situation:


    ```cpp

    int *list = new int[10];

    // ... use list

    delete list;

    ```


    If you delete the pointer twice, the program will likely crash. This is because
    the memory has already been returned to the heap.


    - Another common error is using a pointer after it has been deleted.


    ```cpp

    int *ptr = new int[10];

    delete ptr;

    cout << *ptr; // Error: dangling pointer

    ```


    To avoid this, you should set the pointer to nullptr after deleting it:


    ```cpp

    int *ptr = new int[10];

    delete ptr;

    ptr = nullptr;

    ```


    # Resource Management


    It is essential that programmers call clear when finish with a list object. Take
    a look at the following definition:

    void x() {


    ```

    IntList1 my_list; // Constructor called

    // Add some numbers to the list

    my_list.insert(12);

    my_list.insert(7);

    my_list.insert(-14);

    // Print the list

    my_list.print();

    ```


    // Oops! Forgot to call my list! In the code above, the variable my list is local
    to x. When the function finishes executing the variable, it will go out of scope.
    At this stage, the space on the stack-allocated for the local IntList1 variable
    named my list is reclaimed. Although the list''s head-allocated elements remains,
    the only access the program can have to the memory is through my.head, but my
    list no longer exists. This is a classic example of a memory leak. Observe that
    none of the classes we designed so got apart from the IntList1 have this problem.
    However, C++ offers a way out for class designers to specify actions that have
    to occur at the end of an object''s existence is a constructor that executes a
    code at the beginning of an object''s existence is known as a destructor. A destructor
    is a special method that executes immediately before the object stops existing.
    A destructor can also have the same name as its class with tilde ~ prefix. Additionally,
    a destructor does not accept arguments. Code 9.2 shows how to add a destructor
    to a code and also the previously suggested optimization of the length and clear
    methods.


