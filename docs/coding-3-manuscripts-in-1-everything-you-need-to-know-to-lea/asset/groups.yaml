    \nOutput:\nContents of Linked List: [1, 2, 10, 11]\nContents of Linked List: [2,\
    \ 10]\n\n## Stack\n\n![](img/e2f3f34087ff6d96a5bbdf0800714545_147_0.png)\n\nStack\
