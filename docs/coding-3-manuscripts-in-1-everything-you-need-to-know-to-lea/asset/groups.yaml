    - Instantiate—To create a new object; you will use the 'new' keyword.\n- Initialization—A\
    \ call to a constructor follows the 'new' keyword and initializes a new object.\n\
    \nThe following examples show the different steps taken to create a new object\
    \ from class:\n\n```java\npublic class Kitten {\n    public Kitten(String name)\
    \ {\n        // This constructor contains a param, the name.\n        System.out.println(\"\
    Passed Name is: \" + name);\n    }\n}\n\n    public static void main(String[]\
    \ args) {\n        // Follow in statement we would create an object myKitten\n\
    \        Kitten myKitten = new Kitten(\"spotty\");\n    }\n```\n\nHere's the output:\n\
    Passed Name is: spotty\n\n# How to Access Methods and Instance Variables\n\nThe\
    \ created objects are used to access methods and instance variables. To access\
    \ instance variables, you will use these steps:\nFirst, you must create an object:\n\
    `ObjectName = New Constructor();`\nNext, call a variable like:\n`ObjectName.variableName;`\n\
    To call a class method:\n`ObjectName.MethodName();`\n\n# Java Package\n\nA package\
    \ is a simple way of grouping interfaces and classes. A Java package serves as\
    \ container for classes. The usual basis for grouping is functionality. The use\
    \ of packages facilitates code reusability. When interfaces and classes are categorized\
    \ into packages, you can easily access them for use in other programs. The use\
    \ of packages also helps prevent name conflicts among classes and interfaces.\n\
    \nTo create a package, use the package statement before the package name as the\
    \ first statement.\nHere’s an example:\n\n```java\npackage mypack;\npublic class\
    \ students\n{\n  ...statement\n}\n```\n\n# Import Statement\n\nYou may use the\
    \ import keyword to import packages to your source file. An import statement makes\
    \ it easy for the compiler to find the location of a class or source code.\n\n\
    You may want to import just one class from a package. You can use the dot operator\
    \ to indicate the package and the class. For example:\n\n```java\nimport java.util.Date;\n\
    class MyDate extends Date\n{\n  //statement\n}\n```\n\nTo import all classes from\
    \ one package, you can use the wild character * after the dot operator.\nFor example:\n\
    \n`import java.io.*;`\n\n# Modifiers\n\nModifiers are keywords that alter the\
    \ meaning of the definitions in your code. Java provides several modifiers.\n\n\
    # Access Modifiers\n\nThe access modifiers are used to define access levels for\
    \ methods, variables, classes, and constructors.\n\n# Private—only accessible\
    \ within the class\n\nWhen a method, variable, class, or constructor is declared\
    \ private, it means that it is only available within the class. If the class,\
    \ however, has public getter methods, you may be able to access it.\n\n# Public—accessible\
    \ to the world\n\nA method, variable, class, or constructor declared as public\
    \ means that it is accessible from any other class in the program.\n\n# Protected—accessible\
    \ to subclasses and package\n\nA method, variable, class, or constructor declared\
    \ as protected is accessible within the same package and by its subclasses.\n\n\
    # Default: Applicable when no modifier is provided\n\nA method or variable without\
    \ a modifier is accessible to classes within the package. The following table\
    \ summarizes the different access modifiers:\n\n| Modifier | Inside Package |\
    \ Outside Package | Subclass |\n| :--- | :---: | :---: | :---: |\n| Private |\
    \ Y | N | N |\n| Public | Y | Y | Y |\n| Protected | Y | Y | Y |\n| Default |\
    \ Y | N | N |\n\n# Non-access Modifiers\n\nThe non-access modifiers can be used\
    \ to access various functionalities in Java.\n\n# Final—used to finalize variables,\
    \ methods, and classes\n\nFinal variables\n\nYou can only initialize a final variable\
    \ once. When you declare a variable as final, you will never be able to reassign\
    \ it. Take note, however, that you can still change the data inside the object.\n\
    \n# Final methods\n\nThe final keyword is used to prevent a method from being\
    \ changed by subclasses.\n\n# Final classes\n\nThe final modifier is used to prevent\
    \ other classes from inheriting any feature from the class.\n\n# Static—used to\
    \ create class methods or variables.\n\nYou can use this keyword to create a unique\
    \ variable (called a static variable or class variable) that will exist independently\
    \ from other instances of the class. You cannot declare a local variable as static.\n\
    \nYou may access class methods and class variables by writing the variable or\
    \ method after the class name and a dot (.).\n\n# Abstract—used to create abstract\
    \ methods or classes\n\n# Abstract class\n\nWhen a class is declared as abstract,\
    \ it means that you will never be able to instantiate the class. The only reason\
    \ for declaring a class as abstract is to extend the class. You cannot declare\
    \ a class to be both final and abstract, as you can't possibly extend a final\
    \ class. A class that uses abstract methods will have to be declared as abstract.\n"
  mdcn: "\n摇着尾巴。软件对象在这些特征上与真实世界的对象相似。它的状态存储在字段中，行为通过方法表现出来。在开发过程中，方法在对象的内部状态上执行，并且方法促进了对象之间的通信。\n\
    \n# 类 (Classes)\n\n类用于设置对象的定义。这些规范充当了创建对象的蓝图。虽然在创建类时不会立即应用这些定义，但当实例化该类的对象时，这些定义是可用的。一个对象或类在程序中可以有多个副本或实例。\n\
    \n以下是一个名为 Cat 的类的定义示例：\n\n```java\npublic class Cat {\n  String breed;\n  int\
    \ age;\n  String color;\n\n  void running() {\n  }\n\n  void sleeping() {\n  }\n\
    \n  void jump() {\n  }\n}\n```\n\n类可以拥有以下类型的变量：\n\n# 类变量\n\n类变量是在类内部使用 `static`\
    \ 修饰符并在任何方法之外声明的变量。\n\n# 局部变量\n\n局部变量是定义在方法、块或构造函数内部的变量。这些变量在方法内部声明并实例化，并在方法执行完成后后被销毁。\n\
    \n# 实例变量\n\n实例变量是类内部但在方法之外的变量。它们在类加载的同时进行初始化。可以通过该特定类的方法、块或构造函数访问它们。\n\n一个类可以包含尽可能的方法来获取所需的值。例如，Cat\
    \ 类有三个方法：`running()`、`sleeping()` 和 `jumping()`。\n\n# 构造函数 (Constructors)\n\n\
    构造函数是一种用于初始化对象的方法。类必须至少包含一个构造函数。\n以下是构造函数的重要规则：\n- 构造函数的名称应与类名匹配。\n- 它不有显式的返回类型。\n\
    \n# 构造函数的类型\n\n- 默认构造函数或无参构造函数\n- 参数构造函数\n- 默认构造函数\n\n没有参数的构造函数称为默认构造函数。\n语法如下：\n\
    \n```java\n<class_name>()\n```\n\n# 参数构造函数\n\n参数构造函数是带有参数的构造函数。它用于为特定对象提供值。\n\n\
    下面的示例展示了两种构造函数。第一个是默认构造函数，它没有任何参数。第二个构造函数有一个参数，name。\n\n```java\npublic class\
    \ Kitten {\n    public Kitten() {\n    }\n\n    public Kitten(String name) {\n\
    \        // 这个构造函数有一个参数，name。\n    }\n}\n```\n\n# 创建对象\n\n类为对象提供了模板。对象基本上是从类创建的。要创建新对象，你将使用\
    \ `new` 关键字。\n\n从类创建新对象会采取以下步骤：\n- 声明——这指的是变量声明，你在其中编写变量名及其对象类型。\n- 实例化——为了创建一个新对象；你将使用\
    \ `new` 关键字。\n- 初始化——在 `new` 关键字之后调用构造函数并初始化一个新对象。\n\n下面的示例展示了从类创建新对象的不同步骤：\n\n\
    ```java\npublic class Kitten {\n    public Kitten(String name) {\n        // 这个构造函数包含一个参数，name。\n\
    \        System.out.println(\"Passed Name is: \" + name);\n    }\n}\n\n    public\
    \ static void main(String[] args) {\n        // 按照语句，我们将创建一个对象 myKitten\n    \
    \    Kitten myKitten = new Kitten(\"spotty\");\n    }\n```\n\n输出如下：\nPassed Name\
    \ is: spotty\n\n# 如何访问方法和实例变量\n\n创建的对象被用于访问方法和实例变量。要访问实例变量，你将遵循以下步骤：\n首先，你必须创建一个对象：\n\
    `ObjectName = New Constructor();`\n接下来，访问变量：\n`ObjectName.variable;`\n调用方法：\n\
    `ObjectName.Method();`\n\n# Java 包 (Package)\n\n包是用于组织类的简单方式。包用于组织类和接口。包的使用有助于防止类之间的冲突。\n\
    \n要创建一个包，请在包名之前使用 `package` 语句。\n例如：\n\n```java\npackage mypack;\npublic class\
    \ students\n{\n  ...statement\n}\n```\n\n# 导入语句 (Import Statement)\n\n你可以使用 `import`\
    \ 关键字来导入包。导入语句使编译器能够轻松地找到类的位置。你可能只想导入包中的一个类。例如：\n\n```java\nimport java.util.Date;\n\
    class MyDate extends Date\n{\n  //statement\n}\n```\n\n要导入包中的所有类，可以使用点运算符配合通配符。。例如：\n\
    \n`import java.io.*;`\n\n# 修饰符 (Modifiers)\n\n修饰符是改变代码含义的关键字。Java 提供了多种修饰符。\n\n\
    # 访问修饰符 (Access Modifiers)\n\n访问修饰符用于定义方法、变量、类和构造函数的访问级别。\n\n# 私有 (Private)—仅类内可见\n\
    \n当方法、变量、类或构造函数被声明为 `private` 时，意味着它仅在类内部可用。然而，如果类有公共方法，你可能可以访问它。\n\n# 公有 (Public)—所有人可见\n\
    \n方法、变量、类或构造函数被声明为 `public` 意味着它可以被程序中的任何类访问。\n\n# 保护 (Protected)—对子类和包可见\n\n\
    方法、变量、类或构造函数被声明为 `protected` 时，可以在包内以及通过其子类访问。\n\n# 默认 (Default)：未提供修饰符时适用\n\n\
    没有修饰符的方法或变量可以在包内的类访问。下表总结了不同的访问修饰符：\n\n| 修饰符 | 包内 | 包外 | 子类 |\n| :--- | :---:\
    \ | :---: | :---: |\n| Private | Y | N | N |\n| Public | Y | Y | Y |\n| Protected\
    \ | Y | Y | Y |\n| Default | Y | N | N |\n\n# 非访问修饰符 (Non-access Modifiers)\n\n\
    非访问修饰符可用于访问各种各种功能。\n\n# 最终 (Final)—用于最终变量、方法和类\n\n# 最终变量\n\n你只能初始化一次最终变量。当你将变量声明为\
    \ `final` 时，你将永远无法重新赋值。但请注意，你仍然可以更改对象内部的数据。\n\n# 最终方法\n\n`final` 关键字用于防止方法被修改。\n\
    \n# 最终类\n\n`final` 修饰符用于防止其他类继承该类的任何特性。\n\n# 静态 (Static)—用于创建类方法或变量\n\n你可以使用此关键字创建一个唯一的变量（称为静态变量或类变量），它独立于该类的其他实例。你不能将局部变量声明为\
    \ `static`。\n\n你可以通过在类名后编写点（.）来访问类方法和类变量。\n\n# 抽象 (Abstract)—用于创建抽象方法或类\n\n# 抽象类\n\
    \n当一个类被声明为 `abstract` 时，意味着你永远无法实例化该类。将类声明为抽象的唯一目的是为了扩展该类。你不能将一个类同时声明为 `final`\
    \ 和 `abstract`，因为你无法扩展一个 `final` 类。使用抽象方法的类必须声明为 `abstract`。\n"
