    \ According to Venners (1996), there are seven parameters of primitive data, including\
    \ byte, char, double, float, int, long, and short. The boolean parameter is also\
    \ a widely used primitive type, taking the tally to eight. Each of the parameters\
    \ is meant to help developers deploy variables that can be acted upon by the bytecodes.\
    \ Bytecode streams actually express these parameters of the primitive types in\
