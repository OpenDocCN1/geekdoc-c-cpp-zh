    # 为什么你应该使用 Python


    世界上有许多类型的计算机编程程序，每种程序都有其优缺点。然而，由于许多原因，Python 已证明是最佳选择，例如可读性，并且可以在不更改任何内容的情况下在许多平台上运行。


    使用 Python 具有以下优势：


    - 可读性


    由于它是用英语设计的，初学者会发现它易于阅读和使用。还有许多规则可以帮助程序员理解如何格式化所有内容，这使得程序员能够创建出简单的代码，其他人在使用他们的项目时能够遵循。


    - 社区


    如今，全球范围内有很多 Python 研讨会。初学者可以通过在线、线下或两者兼顾的方式学习更多知识或寻求 Python 方面的解答。此外，在线和线下研讨会可以提高你对
    Python 的理解，以及你的社交技巧。它对于个人电脑来说是，因为它在许多不同的平台上都能成功运行。事实上，所有初学者都发现编写代码或从专家那里学习非常容易。


    - 库


    25 多年来，程序员们一直在使用 Python 教初学者如何使用用 Python 编写的不同代码。该系统对程序员非常开放，他们可以无限地使用可用代码。事实上，学生可以下载并安装该系统并将其用于个人用途，例如编写你的代码并完成产品。


    # Python 中的通用术语


    理解 Python 中使用的标准术语对你至关重要。这让你在开始时一切都变得容易理解。以下是 Python 编程语言中最常见的术语；


    - 函数（Function）：指程序员在使用调用程序时调用的代码块。其目标还包括提供免费服务和准确的计算。


    - 类（Class）：用于开发用户定义对象的模板。它对包括初学者在内的所有人都友好且易于使用。


    - 不变（Immutable）：指具有固定值并包含在代码中的对象。这些可以是数字、字符串或元组。此类对象不能更改。


    - 文档字符串（Docstring）：指显示在函数、类定义和模块中的字符串。此对象在文档工具中始终可用。


    - 列表（List）：指 Python 内置的数据类型，包含排序后的值。这些值包括字符串和数字。


    - IDLE：代表集成开发环境，它允许用户在输入代码的同时在同一个窗口中对其进行解释和编辑。最适合初学者，因为它是代码的一个极佳示例。


    - 交互（Interactive）：Python 由于其交互性质已成为最适合初学者的编程语言。作为初学者，你可以在 IDLE 中尝试许多事物（通过解释器查看它们的响应和效果）。


    - 三引号字符串（Triple Quoted String）：该字符串帮助个人在字符串中使用单引号和双引号，使其能够处理不同的代码行。


    - 对象（Object）：它指处于某种状态的所有数据，如属性、方法、定义的行为或值。


    - 类型（Type）：指编程语言中的一组数据类别，以及在属性、函数和方法方面的差异。


    - 元组（Tuple）：指 Python 内置的数据类型，是一个不可更改的值集合，尽管它包含一些可更改的值。


    # Python 语言的优势


    使用 Python 程序相比 C++ 和 Java 等其他编程语言有许多优势。看到 Python 程序的可用性以及学习和使用它的简易程度，你会感到高兴。理想情况下，这些是你现在可以使用的最佳编程语言，特别是如果你是初学者的话。以下是使用
    Python 语言的一些优势；


    - 它易于使用、编写和阅读


    许多程序员在用 Java 和 C++ 等编程语言时面临着一些挑战。由于设计的原因，这些语言很难查看。人们必须花费大量时间学习括号的使用，而且识别这些编程语言中使用的某些单词并不容易。这些单词可能会吓到你，尤其是当你刚开始接触编程语言时。与
    Java 和 C++ 语言不同，Python 不使用疯狂的括号。它只使用缩进，使得页面易于阅读。它使用英语，使得字符易于理解。


    除了使用缩进，Python 还使用了大量的空白，使得学习和阅读所需内容变得容易。它包含许多带有注释的地方，以便你在程序困惑你时理解或获得解答。所以，去尝试一下，你会发现使用
    Python 编程语言是多么简单。


    - 它使用英语作为主要语言


    使用 Python 很容易，因为主语言是英语。作为初学者，你花费更少的时间来阅读和理解 Python 编程时使用的基础单词。所以，无论你的母语是英语还是非英语，Python
    对你都是最好的，因为大多数单词都简单易于理解。


    - Python 已经在某些计算机上可用


    某些计算机（如 macOS 系统和 Ubuntu）预装了 Python。在这种情况下，你只需要下载文本解释器即可开始 Python 编程。然而，如果你使用的是
    Windows 电脑，则必须在你的电脑上下载该程序。事实上，即使你从一开始没有安装它，Python 也能正常运行。


    - Python 与其他编程语言完美配合


    起初，你将单独使用 Python。然而，随着你继续编程，你会发现 Python 可以与其他语言一起工作。你可以与 Python 协作的一些编程语言包括 C++
    和 JavaScript。尝试学习更多关于 Python 以及它实际上能做什么。随着时间的推移，你将发现许多事情。


    - Python 可用于测试许多事物


    一旦下载了 Python，你就下载测试解释器。测试解释器在让 Python 读取信息方面起着重要作用。使用 Windows 中提供的记事本或其他解释器等简单产品是很好的。


    # 使用 Python 的缺点


    虽然使用 Python 有许多优势，但识别使用它的一些负面影响至关重要。由于以下的负面影响，某些个人倾向于使用 C++ 和 JavaScript 等其他编程语言。


    # 第一章：Python 基础


    一旦你在系统上安装了软件，就可以开始你的 Python 编程之旅了。我将从变量、字符串和关键字等基础知识开始。现在，你将学习并编写你的第一个 Python
    程序、你可以处理的不同数据类型以及如何使用变量。


    '
