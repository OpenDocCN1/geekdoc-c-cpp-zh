  mdcn: "\n这是因为你可以按照你想要的方式构造内存。\n\n## 实现二叉树\n\n要实现一个二叉树，首先要声明节点结构：\n```cpp\nstruct\
    \ node\n{\n  int key_value;\n  node *p_left; node *p_right;\n}\n```\n\n该节点可以存储一个简单的整数\
    \ `key_value` 作为值，并有两个子节点——`p_left` 和 `p_right`。\n\n你的二叉树中可能需要一些常用函数：插入、搜索、删除和销毁：\n\
    \n```cpp\nnode* insert(node* p_tree, int key);\nnode *search(node* p_tree, int\
    \ key);\nvoid destroyTree(node* p_tree);\nnode *remove(node* p_tree, int key);\n\
    ```\n\n## 插入\n\n我们将使用递归算法将元素插入到树中。递归对于树来说是非常完美的，因为每棵树都包含两个更小的树；这使得整棵树在本质上是递归的。该函数接收一个键（key）和一个已经存在的树（即使是空的），并返回一个包含已插入值的新树。\n\
    \n```cpp\nnode* insert(node* p_tree, int key)\n{\n  // 基基础情况——我们到达了一个空树，我们的新节点\n\
    \  // 需要插入到这里\n  if ( p_tree == NULL )\n  {\n    node* p_new_tree = new node;\n\
    \    p_new_tree->p_left = NULL;\n    p_new_tree->p_right = NULL;\n    p_new_tree->key_value\
    \ = key;\n    return p_new_tree;\n  }\n\n  // 决定——插入左子树还是右子树\n  // 取决于节点的值\n \
    \ if( key < p_tree->key_value )\n  {\n    // 从 p_tree->left 构建一个新树，并添加键\n    //\
    \ 将现有的 p_tree->left 指针替换为指向新节点的指针\n    // 设置 p_tree->p_left 指针\n    // 以防 p_tree->left\
    \ 为空。（如果它不为空，// p_tree->p_left 不会\n    // 改变，但这只是为了确保）。\n    p_tree->p_left =\
    \ insert( p_tree->p_left, key);\n  }\n  else\n  {\n    // 插入到右侧与插入到左侧是对称的\n  \
    \  p_tree->p_right = insert( p_tree->p_right, key);\n    return p_tree;\n  }\n\
    }\n```\n\n这里的基本逻辑是：如果你有一棵空树，就创建一个新节点。如果没有，如果要插入的值比当前节点小，则进入左子树，然后用新节点替换左子树。否则，将其插入到右子树并进行替换。\n\
    \n当涉及到实际运行效果时，先将一个空树构建为包含几个节点的树。如果向空树（NULL）中插入值 10，我们会立即触发基础情况，结果将是一个节点为 1 的树。\n\
    \n此时，两个子树都将指向 NULL。然后向树中插入 5，并进行如下如下调用：`insert(一个带有父节点的节点的树, 5)`。因为 5 小于 10，对左子树的调用是递归的：`insert(\
    \ NULL, 5 )`，`insert(一个带有父节点的节点的树, 5)`。\n\n`insert( NULL, 5 )` 的调用创建并返回了一个节点为\
    \ 5 的新树。\n\n当接收到返回的树时，`insert(5)` 将树连接起来。在这个示例中，10 的左子节点之前是 NULL。因此，10 的左子节点建立了一棵新树：\n\
    \n1\n5\n\n如果我们现在添加 7，就会得到：`insert( NULL, 7 )`，`insert(一个带有父节点的节点的树, 7)`。所以，首先\
    \ `insert(NULL, 7 )` 将返回一个节点为 7 的新树。\n\n然后 `insert(一个带有父节点的节点的树, 7 )` 将以这种方式连接到\
    \ 7 的子树：\n5\n7\n\n最后，树返回到：`insert(一个带有父节点的节点的树, 7)`，这将将其重新连接回：\n10\n5 7\n\n由于已经存在从\
    \ 10 指向节点 5 的指针，因此实际上没有必要将 10 的左子节点重新连接到作为父节点的树，但它会进行一次条件检查以查看子树是否为空。\n\n## 销毁\n\
    \n这也应该是一个递归函数。在删除当前节点之前，算法会销毁当前节点处的两个子树。\n\n```cpp\nvoid destroy_tree (node *p_tree)\n\
    {\n  if ( p_tree != NULL )\n  {\n    destroy_tree(p_tree->p_left);\n    destroy_tree(p_tree->p_right);\n\
    \    delete p_tree;\n  }\n}\n```\n\n为了更好地理解，假设在删除节点之前打印了节点的值：\n\n```cpp\nvoid\
    \ destroy_tree (node *p_tree)\n{\n  if ( p_tree != NULL )\n  {\n    destroy_tree(p_tree->p_left);\n\
    \    destroy_tree(p_tree->p_right);\n    cout << \"Deleting node: \" << p_tree->key_value;\n\
    \    delete p_tree;\n  }\n}\n```\n\n如你所见，树是从底向上删除的。\n"
