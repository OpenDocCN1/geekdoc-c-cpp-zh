  - '[PAGE 130]


    You can only explicitly initialize a final variable once. When you declare a variable
    as final, you will never be able to reassign it to another object. Take note,
    however, that you can still change the data stored inside the object. This means
    that while you may change the object''s state, you will not be able to change
    the reference. The final modifier is commonly paired with static to create a class
    variable out of the constant value.


    # Final methods


    The final keyword is used to prevent a method from being changed by subclasses.


    # Final classes


    The final modifier is used to prevent other classes from inheriting any feature
    from the class declared as a final class.


    # Static—used to create class methods or variables.


    You can use this keyword to create a unique variable (called a static variable
    or class variable) that will exist independently from other instances of the class.
    You cannot declare a local variable as static.


    You can also use the static keyword to create a method (called a static method
    or class method) that will exist independently from other instances of the class.
    Static methods recognize and work only on data from the arguments given without
    considering variables.


    You may access class methods and class variables by writing the variable or method
    after the class name and a dot (.).


    # Abstract—used to create abstract methods or classes


    # Abstract class


    When a class is declared as abstract, it means that you will never be able to
    instantiate the class. The only reason for declaring a class as abstract is to
    extend the class. You cannot declare a class to be both final and abstract, as
    you can''t possibly extend a final class. A class that uses abstract methods will
    have to be declared as abstract. Failure to do so will result in compile errors.'
- md: "\n## Abstract method\n\nAs it is declared with no implementation, an abstract\
    \ method derives its methods body from the subclass. Abstract methods cannot be\
    \ declared as strict or final. Unless it is also an abstract class, a class extending\
    \ an abstract class must adopt the abstract methods of the superclass. A class\
    \ that contains at least one abstract method should be declared as an abstract\
    \ class. On the other hand, an abstract class need not have abstract methods.\n\
    \nExample:\n\n## Synchronized\n\nThe synchronized modifier is used to indicate\
    \ that only one thread can access a method at any given time. You can use this\
    \ keyword with any access level modifier.\n\nExample:\n\n```\npublic synchronized\
    \ void info() {\n\n}\n```\n\n## Volatile\n\nThis keyword is used to indicate that\
    \ a thread accessing a volatile variable should merge its private copy with the\
    \ master copy stored in memory. In effect, it synchronizes all cached copies of\
    \ the variable with the main memory. You may only use this modifier to define\
    \ instance variables of the private or object type.\n\nExample:\n\n## Transient\n\
    \nThe keyword transient is used to tell the compiler to skip an instance variable\
    \ when it is serializing the object that contains the marked variable.\n\nExample:\n\
    \n```\npublic transient int lim = 50; // will not persist CHAPTER 8:\n```\n\n\
    ## Decision Making and Loop Control\n\nThe decision making structures are used\
    \ in situations where a set of instructions have to be executed if the condition\
    \ is true and another set of instructions have to be executed when the condition\
    \ is determined to be false. There are several constructs available in Java for\
    \ programming such scenarios. These structures include—\n\n### If statement\n\n\
    This statement is used in situations where a condition needs to be tested, and\
    \ if the condition is found true, the block of code that follows this statement\
    \ needs to be executed. The syntax for this construct is—\n\n```\nif(condition){\n\
    /*Body*/\n}\n```\nSample implementation for this construct is given below—\npublic\
    \ class ifDemo {\npublic static void main(String[] args[]) {\nint i = 10;\nint\
    \ j = 1;\nif(i>j){\nSystem.out.print(i);\n}\n}\n}\n\n### If else statement\n\n\
    This statement is used in situations where a condition needs to be tested, and\
    \ if the condition is found true, the block of code that follows this statement\
    \ needs to be executed else the block of code that follows the else statement\
    \ is executed. The syntax for this construct is—\n\n```\nif(condition){\n/*Body*/\n\
    }\nelse(\n/*Body*/\n)\n```\nSample implementation for this construct is given\
    \ below—\npublic class ifElseDemo {\n  public static void main(String[] args)\
    \ {\n    int i = 1;\n    int j = 0;\n    if(i>j){\n        System.out.print(i);\n\
    \    }else{\n        System.out.print(j);\n    }\n  }\n}\n}\n\n### Nested if statement\n\
    \nThis statement is used in situations where a condition needs to be tested, and\
    \ if the condition is found true, the block of code that follows this statement\
    \ needs to be executed the next condition is tested. If this condition is found\
    \ true, the block of code corresponding to the statement for this condition is\
    \ executed. If none of the conditions are found true, the block of code that follows\
    \ the else statement is executed. Multiple conditions can be tested using the\
    \ nested if statements. The syntax for this construct is—\n\n```\nif(condition1)\
    \ {\n/*Body*/\n}else if (condition2) (\n/*Body*/\n}else {\n/*Body*/\n}\n```\n\
    Sample implementation for this construct is given below—\npublic class nestedIfDemo\
    \ {\npublic static void main(String args[]) {\nint i = 0;\nint j = 0;\nif(i>j){\n\
    \  System.out.print(i);\n} else if(j>i) {\n  System.out.print(j);\n} else {\n\
    \  System.out.print(\"Equal\");\n}\n}\n}\n\n### Switch\n\nIf you have a variable\
    \ and different blocks of code need to be executed for different values of that\
    \ variable, the ideal construct that can be used is the switch statement. The\
    \ syntax for this construct is—\n\n```\nswitch(variable){\ncase <value1>:\n/*body*/\n\
    break;\ncase <value2>:\n/*body*/\nbreak;\ncase <value3>:\n/*body*/\nbreak;\ndefault:\n\
    /*body*/\nbreak; }\n```\nSample implementation for this construct is given below—\n\
    public class switchDemo {\npublic static void main(String args[]) {\nint i = 5;\n\
    switch (i) {\ncase 0:\nSystem.out.print(0);\nbreak;\ncase 2:\nSystem.out.print(2);\n\
    break;\ncase 5:\nSystem.out.print(5);\nbreak;\ndefault:\nSystem.out.print(99);\n\
    break;\n}\n}\n}\n\n## Conditional Operator\n\nJava also supports the conditional\
    \ operator, which is also known as ?: This operator is used to replace if else.\
    \ Its syntax is as follows—\n\ncondition ? expression1 : expression2\n\n## Loop\
    \ Control\n\nThere are several types of loops in Java to execute a block of code\
    \ multiple times. These include for, while, and do-while loops. They allow you\
    \ to iterate over a set of data. For instance, if you need to sort a set of numbers,\
    \ you can use a loop.\n\n## Break\n\nThe break statement is used to terminate\
    \ a loop or a switch statement immediately. When encountered, the program exits\
    \ the loop.\n\n## Continue\n\nThe continue statement is used to skip the current\
    \ iteration of a loop and move to the next iteration.\n\n## For Loop\n\nThe for\
    \ loop is used to execute a block of code as long as a specified condition is\
    \ true. It is useful when the number of iterations is known. The syntax is—\n\n\
    ```\nfor(initialization; condition; increment) {\n    /*body*/\n}\n```\nSample\
    \ implementation of for loop:\n```java\npublic class forDemo {\npublic static\
    \ void main(String[] args[]) {\nint i = 0;\nfor(i=0; i<5; i++) {\n    System.out.print(i);\n\
    }\n}\n}\n```\n\n## While Loop\n\nThe while loop is used to execute a block of\
    \ code as long as a specified condition is true. The condition is checked before\
    \ each iteration. The syntax is—\n\n```\nwhile(condition) {\n    /*body*/\n}\n\
    ```\nSample implementation of while loop:\n```java\npublic class whileDemo {\n\
    public static void main(String[] args[]) {\nint i = 0;\nwhile(i<5) {\nSystem.out.print(i);\n\
    i++;\n}\n}\n}\n```\n\n## Do While Loop\n\nThe do-while loop is used to execute\
    \ a block of code at least once before checking the condition. The condition is\
    \ checked after each iteration. The syntax is—\n\n```java\ndo {\n    /*body*/\n\
    } while(condition);\n```\nSample implementation of do-while loop:\n```java\npublic\
    \ class doWhileDemo {\npublic static void main(String[] args[]) {\nint i = 0;\n\
    do {\nSystem.out.print(i);\ni++;\n} while(i<5);\n}\n}\n```\n\n## Enhanced For\
    \ Loop\n\nThe enhanced for loop is used to iterate over elements of an array or\
    \ a collection. It is simpler than the standard for loop in such cases. The syntax\
    \ is—\n\n```\nfor(declaration : expression) {\n    /*body*/\n}\n```\nSample implementation\
    \ of enhanced for loop:\n```java\npublic class forArrayDemo {\npublic static void\
    \ main(String[] args[]) {\nint [] numberArray = {100, 300, 500, 700, 900};\nfor(int\
    \ i: numberArray ) {\nSystem.out.print(i);\nSystem.out.print(\",\");\n}\n}\n}\n\
    ```\n\n## Exception Hierarchy\n\nJava has an inbuilt class named java.lang.Exception\
    \ and all the exceptions fall under this class. All the exception classes are\
    \ subclasses of this class. Moreover, the Throwable class is the superclass of\
    \ the exception class. Another subclass of the Throwable class is the Error class.\
    \ All the errors like stack overflow described above fall under this Error class.\n\
    \nThe Exception class has two subclasses, namely RuntimeException and IOException\
    \ class. A list of the methods, for which definitions are available in Java, as\
    \ part of the Throwable class, is given.\n\n```java\npublic String getMessage())\n\
    When called, this message returns a detailed description of the exception that\
