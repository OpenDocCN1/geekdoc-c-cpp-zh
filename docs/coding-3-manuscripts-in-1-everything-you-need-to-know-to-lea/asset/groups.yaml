    # Key Points and More


    +   * Java programs are made up of classes. Every program requires a main() method
    in one of its classes.


    +   * The main(method) method must be written as public static void main(String[]
    args). Later lessons will explain what all those words mean.


    +   * Multiple classes are often used together to create one program. However,
    most of the programs in this book will be made of only one class.


    +   * Every class must have a superclass. Any class can be used as a superclass.
    You''ll create your own superclass in a later lesson.


    +   * Classes with the same superclass are considered to be of the same type.
    For example, the main class you create for every program in this book will use
    the DIYWindow class as its superclass. So every program in this book will be a
    type of DIYWindow.


    +   * To create classes, right-click in the Package Explorer pane.'
