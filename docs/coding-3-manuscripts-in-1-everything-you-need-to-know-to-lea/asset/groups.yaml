    \ color;\n\n  void running() {\n  }\n\n  void sleeping() {\n  }\n\n  void jump()\
    \ {\n  }\n}\n```\n\nClasses can have the following types of variable:\n\n# Class\
    \ variables\n\nClass variables are those that are declared inside a class using\
    \ the static modifier and outside any method.\n\n# Local variables\n\nLocal variables\
    \ are those that are defined within the methods, blocks, or constructors. These\
    \ variables are declared and instantiated inside the method and are destroyed\
    \ once the method had been carried out.\n\n# Instance variables\n\nInstance variables\
    \ are those that are inside a class but outside of the methods. They are initialized\
    \ at the same time as the class. They can be accessed from a method, block, or\
    \ constructor of that specific class.\n\nA class can contain as many methods as\
    \ necessary to obtain the values it needs. For example, the Cat class has three\
    \ methods: running(), sleeping(), and jumping().\n\n# Constructors\n\nA constructor\
    \ is a method which is used to initialize an object. A class must contain at least\
    \ one constructor.\nThe following are the important rules for constructors:\n\
    - The name of the constructor should match the name of the class.\n- It should\
    \ have no explicit return type.\n\n# Types of Constructors\n\n- Default or no-arg\
    \ constructor\n- Parameterized constructor\n- Default Constructor\n\nA constructor\
    \ without a parameter is called default constructor.\nHere's the syntax:\n\n```java\n\
    <class_name>()\n```\n\n# Parameterized Constructor\n\nA parameterized constructor\
    \ is a constructor with parameters. It is used to supply values to specific objects.\n\
    \nThe following example shows both types of constructors. The first one is a default\
