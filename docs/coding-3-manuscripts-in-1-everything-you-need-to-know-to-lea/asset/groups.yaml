    # CHAPTER 3:

    Binary trees

    B


    inary trees are one of the most useful of all the basic data structures and are
    by far the most interesting. They are the perfect example of how recursion and
    pointers can be used


    to do some very useful things.


    One of the best techniques for creating lists of things is the linked list, but
    finding an element in the list can take a while. And, if you have a large amount
    of unstructured data, an array won''t help much either. You can try sorting the
    array but, even so, inserting items into it will still be difficult. If you have
    an array that you want to keep sorted, inserting new elements will take a lot
    of shuffling! And trying to find things in a list as quickly as possible is quite
    important, especially in scenarios like these:'
  - '[PAGE 192]


    • You''re building an MMORPG game and players need to be able to sign in quickly—that
    involves quickly looking players up

    • You''re building software to process credit cards and millions of transactions
    need to be handled hourly—credit balances need to be found very quickly

    • You''re using a low-power device, such as a tablet or smartphone, and showing
    your users an address book. You don''t want your users to keep hanging because
    your data structure is slow.


    This section will discuss the tools needed to overcome problems and more.


    The idea of the solution is to be able to store elements in a structure like a
    linked list, using pointers to help structure the memory, but in an easier way
    than the linked list. Doing this requires that the memory have more structure
    than a simple list.


    So what does structuring mean? When we started this journey, we only had arrays,
    but these never really gave us the ability to use data structures other than sequential
    lists. Linked lists use pointers to grow sequential lists incrementally but don''t
    use the flexibility of the pointer to build more sophisticated structures.


    What are these more sophisticated structures in memory? Structures that hold more
    than a single next node at any given time are a good example. But why would you
    want this? Simple. If you have two “next nodes,” one can be used to represent
    elements that are more than the current element. This is called a binary tree.


    These are named because there are always one or two branches from every node.
    Each of the next nodes is a child, and the node that links to the child is the
    parent node.

    This is what a binary tree might look like:


    ```

    10

    6 14

    5 8 11 18

    ```'
  - '[PAGE 193]


    In the tree, the left child on each of the elements is smaller than the element,
    and the right child is larger. 10 is the parent node for the whole tree, and the
    child nodes of 6 and 14 are both parent nodes to their own small subtrees.


    Binary trees have one very important property: each child is an entire tree. Combine
    this with the rule of the left child being smaller and the right child being larger,
    and you have an easy way of defining algorithms that locate specific nodes in
    the tree.


    First, look at the current node value. If it equals the search target, it''s done.
    If it''s more than the search target, go left; otherwise, go right. This works
    because each node to the left of the tree is less than the current node value,
    and each on the right is more.


    In an ideal world, your binary tree will be balanced with the exact number of
    nodes on both sides. In such cases, every child tree is roughly 50 percent of
    the entire tree and, when you search the tree for a value, the search can eliminate
    50 percent of the results each time it gets to a child node. So that tree again
    (if you had a tree of 1000 elements, 500 would be immediately eliminated. it has
    50 elements now), and you can cut it by about 50 percent again. That way it doesn''t
    take long to find the value you want.


    So, how many times must a tree be subdivided before you get to one element? The
    answer to that is log2n (n is the number of elements the tree has). This is a
    small value, even if your tree is large—if your tree had, say, 32 billion elements,
    the value would be 32; almost 100 million times faster than a search of a linked
    list of four billion elements, every single one has to be assessed.


    If the tree isn''t balanced, you won''t be able to eliminate roughly half of the
    elements; worst case, each node only has one child and that makes the tree nothing
    more than a linked list with a few extra pointers, thus requiring you to search
    all elements.


    So, when a tree is balanced approximately, it''s much faster and easier to search
    for nodes than the same search on a linked list.'
- md: "\nis because you can structure the memory of how you want it.\n\n## Implementing\
    \ a Binary Tree\n\nTo implement a binary tree, begin by declaring the node structure:\n\
    ```cpp\nstruct node\n{\n  int key_value;\n  node *p_left; node *p_right;\n}\n\
    ```\n\nThe node can store values as a simple integer, key_value, and has two children\
    \ —p_left, and p_right.\n\nThere are some common functions that you want on your\
    \ binary tree: inserting, searching, removing, and destroying:\n\n```cpp\nnode*\
    \ insert(node* p_tree, int key);\nnode *search(node* p_tree, int key);\nvoid destroyTree(node*\
    \ p_tree);\nnode *remove(node* p_tree, int key);\n```\n\n## Inserting\n\nWe'll\
    \ use a recursive algorithm for inserting it into the tree. Recursion is fantastic\
    \ for trees because there are two small trees for each tree; that makes the entire\
    \ tree recursive by nature. The function takes a key and a tree that already exists\
    \ (even an empty one) and returns a new tree that has the inserted value.\n\n\
    ```cpp\nnode* insert(node* p_tree, int key)\n{\n  // base case—we have got to\
    \ an empty tree and our new node\n  // needs to be inserted here\n  if ( p_tree\
    \ == NULL )\n  {\n    node* p_new_tree = new node;\n    p_new_tree->p_left = NULL;\n\
    \    p_new_tree->p_right = NULL;\n    p_new_tree->key_value = key;\n    return\
    \ p_new_tree;\n  }\n\n  // decide – left subtree or right subtree for the insertion\n\
    \  // depending on the what node value is\n  if( key < p_tree->key_value )\n \
    \ {\n    // build a new tree from p_tree->left, and add in the key\n    // replacing\
    \ existing p_tree->left pointer with a pointer\n    // to new. Set the p_tree->p_left\
    \ pointer\n    // in case p_tree->left is NULL. (If it isn't NULL, // p_tree->p_left\
    \ won't\n    // change but it is just\n    // to make sure).\n    p_tree->p_left\
    \ = insert( p_tree->p_left, key);\n  }\n  else\n  {\n    // Insertion into the\
    \ right side is symmetric to the\n    // insertion in the left\n    p_tree->p_right\
    \ = insert( p_tree->p_right, key);\n    return p_tree;\n  }\n}\n```\n\nThe basic\
    \ logic here is this: if you have an empty tree, you create a new one. If not,\
    \ the value for insertion goes to the left subtree if it's more than the current\
    \ node, and the left subtree is then replaced with the new one. Otherwise, insert\
    \ it into the right subtree and replace it.\n\nWhen it comes to seeing it in action,\
    \ build an empty tree into a tree with couple of nodes. If the value 10 is inserted\
    \ in the empty tree (NULL), immediately we hit base case, and the result will\
    \ be a tree of: 1\n\nAnd both of the child trees will point to NULL. Then insert\
    \ 5 into the tree and make the following call: insert(a tree with a parent, 5).\
    \ Because 5 is lower than 10, the call onto the left-subtree is recursive: insert(\
    \ NULL, 5 ) insert(a tree with a parent, 5)\n\nThe call of insert( NULL, 5 ) creates\
    \ and returns a new tree 5\n\nWhen the returned tree is received, insert( , 5)\
    \ links the trees. In this example, 10's left child was NULL before. Therefore,\
    \ the left child of 10 is established a new tree:\n\n1\n5\n\nIf we now add 7,\
    \ we get: insert( NULL, 7 ) insert(a tree with a parent, 7). So, first off, insert(NULL,\
    \ 7 ) will return a new tree: 7\n\nAnd then insert(a tree with a parent, 7 ) will\
    \ link to the subtree of 7 in this way:\n5\n7\n\nLastly, the tree gets returned\
    \ to: insert(a tree with a parent, 7) And this will link it back:\n10\n5 7\n\n\
    Because there was already a pointer from 10 to the node with 5, it isn't really\
    \ necessary to relink 10's left child to the tree as the parent, but it does a\
    \ conditional check to see if the subtree is empty.\n\n## Destroying\n\nThis should\
    \ also be a recursive function. Before deleting the current node, the algorithm\
    \ destroys both of the subtrees at the current node.\n\n```cpp\nvoid destroy_tree\
    \ (node *p_tree)\n{\n  if ( p_tree != NULL )\n  {\n    destroy_tree(p_tree->p_left);\n\
    \    destroy_tree(p_tree->p_right);\n    delete p_tree;\n  }\n}\n```\n\nAs a way\
    \ of better understanding, let's say that the value of the node was printed before\
    \ the node was deleted:\n\n```cpp\nvoid destroy_tree (node *p_tree)\n{\n  if (\
    \ p_tree != NULL )\n  {\n    destroy_tree(p_tree->p_left);\n    destroy_tree(p_tree->p_right);\n\
    \    cout << \"Deleting node: \" << p_tree->key_value;\n    delete p_tree;\n \
    \ }\n}\n```\n\nAs you can see, the tree is deleted from the bottom up. Nodes 5\
    \ and 6 go first, moving to the other side and deleting 7 and 8, followed by 9.\
    \ Lastly, 10 will be deleted. The tree values aren't important; what matters is\
    \ where the node is. In the following binary tree, rather than the node values,\
    \ we use the order of deletion:\n\n3 6 2 4 5\n\nIt can be helpful to walk through\
    \ the code manually. Deleting from trees is a great example of a recursive algorithm\
    \ that's not easy to do as iterative implementation. First, you need a loop that\
    \ can deal with both sides of the tree simultaneously, needs to be done for every\
    \ level. With the stack, you can keep your place much easily. The best way of\
    \ visualizing this is to say that each stack frame will store the branch that\
    \ has been deleted already; which bits of the tree have to be destroyed because\
    \ it knows what point in the function execution should continue. When the first\
    \ call to the tree is made, notified by the stack frame to continue when the second\
    \ call is made. Because every function has a stack frame of its own, it can track\
    \ the entire state of the tree’s destruction at the current time, one level at\
    \ a time. To implement this in a non-recursive way would require having a data\
    \ structure that retains the same amount and type of information. You could, for\
    \ example, write a function that holds a linked list as a way of simulating the\
    \ list. That linked list would have subtrees that were being destroyed and left\
    \ for destruction. Then a loop-based algorithm could be written to add the subtrees\
    \ to the list and remove them after they were destroyed fully. Basically, recursion\
    \ lets you use the stack data structure built-in rather than needing to write\
    \ your own.\n\n## CHAPTER 4: Inheritance\n\n### Inheritance\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n// defining a simple student class with 2\
    \ members\nclass Student\n{\npublic:\n  int studentID;\n  string studentName;\n\
    // Function to display the members of the class\nvoid Display()\n{\n  cout <<\
    \ \"Student ID \" << studentID << endl; \n  cout << \"Student Name \" << studentName;\n\
    }\nint main () {\n  Student stud1;\n  // Assigning values to the properties of\
    \ the class\n  stud1.studentID = 1;\n  stud1.studentName = \"John\";\n  stud1.Display();\n\
    \  return 0;\n}\n```\n\nWith the above program:\n\n- We have a class called ‘Student’\
    \ which has 2 members, one is ‘studentID’ and the other is called ‘studentName’.\n\
    - We then define a member function called ‘Display()’ which outputs the ‘studentID’\
    \ and ‘studentName’ to the console.\n- We can then call the member function from\
    \ the object in the main program.\n\nWith this program, the output is as follows:\n\
    Student ID 1\nStudent Name John\n\n## So What is Inheritance?\n\nInheritance is\
    \ a concept wherein we can define a class to inherit the properties and methods\
    \ of another class. This helps in not having the need to define the class again\
    \ or having the properties and methods defined again.\n\nLet's say that we had\
    \ a class called ‘Person,’ which had a property of ‘Name’ and a method of ‘Display.’\
    \ Then through inheritance, we can define a class called Student, which could\
    \ inherit the Person class. The Student class would automatically get the ID member\
