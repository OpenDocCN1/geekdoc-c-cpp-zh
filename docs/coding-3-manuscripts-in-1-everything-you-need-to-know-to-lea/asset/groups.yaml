    +   o Class names can contain numbers, letters, dollar signs, and underscores.
    Dollar signs and underscores are usually used.


    +   o Blanks or periods aren''t allowed in class names.


    +   o Class names cannot start with a number.


    +   o Class names typically start with an uppercase letter.


    +   o If the class name includes more than one word, the first letter of each
    word is usually uppercase, and the rest of the letters are lowercase.


    +   o Classes can have one or more constructors.


    +   o The class constructor is named the same as the class and must be declared
    as public. Constructors will be explained more in later lessons.


    +   o A constructor is called by using new, followed by the name of the constructor
    and parentheses. For example, new HelloWorld() in the main() method calls the
    Helloconstructor.


    +   o Blocks of code are enclosed in curly brackets, { }, and each line of code
    ends with a semicolon;


    +   o Every Java program runs the main() method first. The main() method calls
    the class constructor in all the programs in this book. Therefore, the main()
    method will run first, followed by the class constructor.


    +   o Each statement within the curly brackets is run, one at a time, in the order
    it appears in the code.


    +   o Blank lines between lines of code have no effect on how the code runs. Blank
    lines are added to make the code easier for you to read.


    +   o Print ( ) statements print the text in the parentheses to a window.


    +   o Each print() statement prints on a new line.


    +   o To print a blank line, use print() with empty parentheses.'
