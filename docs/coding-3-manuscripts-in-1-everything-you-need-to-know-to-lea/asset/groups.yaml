    However, there exists a new Java 8 abstraction that is compatible. It is designed
    to iterate over data in parallel.


    The idea is embodied by the Spliterator interface.


    The premise of this interface is to partition the data and handoff chunks to different
    threads. Spliterators can be obtained from the Collection interface, including
    subinterfaces List and Set.


    Central to the Spliterator interface are these three methods:


    ```

