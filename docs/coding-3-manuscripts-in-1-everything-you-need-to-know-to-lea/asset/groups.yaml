    \ of these characteristics. Its state is saved in fields, and its behavior is\
    \ exhibited through methods. In development, the methods are performed on an object's\
    \ internal state, and the methods facilitate communication between objects.\n\n\
    # Classes\n\nClasses are used to set the definitions for objects. These specifications\
    \ serve as blueprints for creating objects. While they are not immediately applied\
    \ when classes are created, the definitions are available in case an object of\
