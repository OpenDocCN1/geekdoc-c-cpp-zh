    # Introduction


    The introduction of technologies, especially computers, has influenced our behavior.
    Some people spend their time on computers to create websites, while others use
    them to make a living. The strength of the python is that you can either keep
    it simple or extend it to more platforms to support many platforms at once. The
    design allowed the system to easily communicate with the libraries and various
    file formats.


    Since its introduction, many programmers now use Python in the world, and in fact,
    many tools are included to improve operation and efficiency. Many programmers
    have taken various initiatives to educate everyone about using python programming
    language and how it can help ease the fear of complex computer codes.


    # Features of Python


    Python has the following characteristics:


    - Large library: it works with other projects such as searching for texts, connecting
    to web servers, and exchanging files.

    - Interactive: Using Python is very simple because you can easily test codes.

    - It is free software; so, you can always download it from the internet with your
    computer.

    - Programming language can be extended to other modules such as C++ and C.

    - Has an elegant syntax that makes it easy for beginners to read.

    - Has several basic data types to choose from.


    # History of the Python


    Python programming was discovered by Guido Rossum in 1989 while he was carrying
    out a project at the Dutch research institute CWI. Guido has successfully used
    a number of basic languages, the so-called ABC language, to work on the Python.
    According to Van Rossum, the strength of the python language is that you can either
    keep it simple or extend it to more platforms.


    However, the Python was open source by Van Rossum few years ago to allow all programmers
    access and even make changes to it. This has changed a lot in the field of programming.
    For example, there was a release of the Python 2.0. Python 2.0 was community-oriented,
    making it transparent in the development process. While many people do not use
    Python, there are still some programmers and organizations that use part of the
    version.


    The Python 3, a unique version, was released in 2008. Although the version has
    many different functions, it is completely different from the first two versions,
    and it is not easy to update the program. While this version is not backwards
    compatible, it has a small creator to show what needs to be changed when uploading
    the files.

