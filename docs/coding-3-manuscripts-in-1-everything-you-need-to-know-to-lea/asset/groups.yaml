    \ non-stooges\ntheThreeStooges, removeIf(isStooge.negate());\n```\n\nTo replace\
    \ all contents of a List, we can use replaceAll():\nReplace() uses a UnaryOperator\
    \ as its functional interface, which is a Function sub interface."
