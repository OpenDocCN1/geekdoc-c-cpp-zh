    ## JAVA PROGRAMMING


    ### Introduction


    Java is a widely-used language on the Web and in computing applications. It is
    a free download that allows users to access the latest versions and implement
    updates. This particular programming language is present in the majority of today''s
    web applications and computing technologies. Java''s scalable characteristics
    make it suitable for deployment in a wide range of applications, including apps
    for phones and software solutions for large scale operations such data centers.
    The growing preference for deploying Java is attributable to its robust functional
    features and sound security.


    Java is a programming language that is built by Sun Microsystems, which was later
    taken over by the Oracle Corporation. It is designed to run on any operating system.
    This is what made the language so popular, because the developer just had to write
    the program once, and the program could then run on any operating system without
    the need for the programmer to change the code.


    Most of the modern applications built the world are made from the Java programming
    language. Most of the server-side and business logic components of major applications
    are built on the Java programming language. During the entire course of this book,
    you will learn how to write programs such as the one above, and also learn advanced
    concepts that will enable you to start writing application programs.


    Some of the design goals for Java are mentioned below:


    - The language is intended to be written once and have the ability to be run on
    any operating system.

    - The language should provide support for numerous software engineering principles.


    Portability is an important factor. This is why Java has the ability to run on
    Windows, Linux, and the MacOS operating system. Support for internationalization
    is very important. Java is intended to be suitable for writing applications for
    both hosted and embedded systems.


    ## Strong Type Checking


    Java is a strong type language. Every variable that is defined needs to be attached
