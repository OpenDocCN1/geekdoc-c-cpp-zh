    # Protected—accessible to all subclasses and package


    Declaring a method, variable, or constructor as protected in a superclass makes
    it accessible only to classes within its package or to its subclasses in another
    package.


    This access type is used if you want to allow the subclass to use variable or
    helper methods and prevent non-related classes from using them. Interfaces, as
    well as the fields and methods under them, should not be declared protected, but
    fields and methods outside of the interface can be declared protected.


    Classes should not be declared as protected. Default: Applicable when no modifier
    is provided—accessible to the package


    A method or variable that has been declared without a modifier is accessible to
    other classes within the package. The following table summarizes the different
    access modifiers and their effect:


    Modifier Inside Inside Outside


    ```

    class package package by subclass Outside package


    Private Y N N

    Public Y Y Y

    Protected Y Y Y N

    Default Y Y N N

    ```


    # Non-access Modifiers


    The non-access modifiers can be used to access various functionalities in Java.


    # Final—used to finalize implementations of variables, methods, and classes


