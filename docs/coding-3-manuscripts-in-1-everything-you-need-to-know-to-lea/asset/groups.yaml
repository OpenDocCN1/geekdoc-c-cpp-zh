- md: "\n# Spliterator\n\nThe Collections library is still subject to the same constraints\
    \ regarding concurrent access.\nAs always, you must choose the Collections library\
    \ class that corresponds to your thread safety requirements.\nThis is because\
    \ the new methods shown above are just functional abstractions riding above the\
    \ same data structures.\n\nThese methods are not particularly amenable to functional\
    \ programming's take on parallel processing because they are still based on the\
    \ notion of multiple threads mutating the collection and synchronizing access\
    \ to the underlying data. However, there exists a new Java 8 abstraction that\
    \ is compatible. It is designed to iterate over data in parallel.\n\nThe idea\
    \ is embodied by the Spliterator interface.\n\nThe premise of this interface is\
    \ to partition the data and handoff chunks to different threads. Spliterators\
    \ can be obtained from the Collection interface, including subinterfaces List\
    \ and Set.\n\nCentral to the Spliterator interface are these three methods:\n\n\
    ```\nSpliterator<T> trySplit();\ndefault void forRemaining(Consumer<? super T>\
    \ action) {...}\n\nboolean tryAdvance(Consumer<? super T> action);\n```\n\nThe\
    \ method trySplit() partitions the underlying data in two. It creates a new Spliterator\
    \ with half the data and keeps the other half in the original instance. Each can\
    \ be given to a thread which, in turn, iterates over the partitioned data using\
    \ forRemaining().\n\nThe method tryAdvance() is a one-at-a-time variant that returns\
    \ the next element or null if the list has been exhausted.\nSpliterators do not\
    \ handle parallel processing themselves but provide the abstraction to do so.\n\
    \nHere’s the concept in action:\n\n```\npublic static boolean isMovieInList(String\
    \ title, List<String> movieList)\nthrows InterruptedException {\n  // Obtain a\
    \ spliterator from the movie list\n  Spliterator<String> s1 = movieList.spliterator();\n\
    \  \n  // Split the original list in half.\n  // Now s1 and s2 each contains half\
    \ the list.\n  Spliterator<String> s2 = s1.trySplit();\n\n  BooleanHolder booleanHolder\
    \ = new BooleanHolder();\n  if (s2 != null) {\n    Consumer<String> finder =\n\
    \      movie -> {if (movie.equals(title)) booleanHolder.isFound = true;};\n  }\n\
    \n  // Each thread searches the movie list in parallel\n  Thread t1 = new Thread(()\
    \ -> s1.forEachRemaining(finder));\n  Thread t2 = new Thread(() -> s2.forEachRemaining(finder));\n\
    \n  t1.start();\n  t2.start();\n  t1.join();\n  t2.join();\n\n  return booleanHolder.isFound;\n\
    }\n\nprivate static class BooleanHolder {\n  public boolean isFound = false;\n\
    }\n```\n\nGiven a title and a list of movies, the method isMovieInList() parallelizes\
    \ the search to determine if it is contained in the List. It sets the flag in\
    \ booleanHolder to true if found. It obtains a Spliterator instance from the list,\
    \ splits it in half, and handoff one to each thread. The splitting process can\
    \ be repeated if further threads are available.\n\nSpliterators can be obtained\
    \ from other Collection types as well as other libraries in the JDK. There are\
    \ many implementations designed that deal with different characteristics, including\
    \ finite/infinite, ordered/nonordered, sorted/non-sorted, and mutable/immutable.\
    \ They inherit the qualities of their underlying data structure.\n\nSpliterators\
    \ are a lower-level abstraction designed to give you more fine-grained control\
    \ over parallelized iteration. However, the API lacks some of the refinements\
    \ needed to implement functionally-friendly algorithms. In the above example,\
    \ we needed to store the state in the BooleanHolder for the search.\n\n# Wrap\
    \ up\n\nThis completes our overview of the new and improved Java Collections library\
    \ as well as the standard functional interfaces. Just as there have been many\
    \ changes in the standard JDK libraries to support functional concepts, expect\
    \ major changes from 3rd party APIs. But the biggest change is yet to come.\n\n\
    # Key points\n\nThe new package java.util.function contains a set of functional\
