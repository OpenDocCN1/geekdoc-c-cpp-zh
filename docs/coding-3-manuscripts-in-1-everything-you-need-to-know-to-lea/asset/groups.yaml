    \ 8 引入了一种兼容的新类型抽象。它是专门为并行迭代数据而设计的。\n\n这种核心理念体现在 `Spliterator` 接口中。\n\n该接口的前提是对数据进行分区，并将数据块交给不同的线程。可以从\
    \ `Collection` 接口（包括 `List` 和 `Set` 子接口）中获取 `Spliterator`。\n\n`Spliterator` 接口的核心是这三个方法：\n\
    \n```\nSpliterator<T> trySplit();\ndefault void forRemaining(Consumer<? super\
    \ T> action) {...}\n\nboolean tryAdvance(Consumer<? super T> action);\n```\n\n\
    `trySplit()` 方法将底层数据一分为二。它创建一个包含一半数据的新 `Spliterator`，并将另一部分保留在原始实例中。每个部分都可以交给一个线程，由该线程使用\
    \ `forRemaining()` 迭代分区数据。\n\n`tryAdvance()` 方法是一种一次处理一个变体，返回下一个元素，如果列表已耗尽则返回\
    \ `null`。\n`Spliterator` 本身并不处理并行处理，而是提供了执行该操作的抽象。\n\n以下是该概念的应用示例：\n\n```\npublic\
    \ static boolean isMovieInList(String title, List<String> movieList)\nthrows InterruptedException\
    \ {\n  // 从电影列表中获取一个拆分器\n  Spliterator<String> s1 = movieList.spliterator();\n\
    \  \n  // 将原始列表一分为二。\n  // 现在 s1 和 s2 各自包含一半列表。\n  Spliterator<String> s2 = s1.trySplit();\n\
    \n  BooleanHolder booleanHolder = new BooleanHolder();\n  if (s2 != null) {\n\
    \    Consumer<String> finder =\n      movie -> {if (movie.equals(title)) booleanHolder.isFound\
    \ = true;};\n  }\n\n  // 每个线程并行搜索电影列表\n  Thread t1 = new Thread(() -> s1.forEachRemaining(finder));\n\
    \  Thread t2 = new Thread(() -> s2.forEachRemaining(finder));\n\n  t1.start();\n\
    \  t2.start();\n  t1.join();\n  t2.join();\n\n  return booleanHolder.isFound;\n\
    }\n\nprivate static class BooleanHolder {\n  public boolean isFound = false;\n\
    }\n```\n\n给定一个标题和一个电影列表，`isMovieInList()` 方法并行搜索以确定其是否在列表中如果找到，会将 `booleanHolder`\
    \ 中的标志设为 true。它从列表中获取一个 `Spliterator` 实例，将其一分为二，并将其中一个交给每个线程。如果有更多的可用线程，可以重复拆分过程。\n\
    \n可以从其他 `Collection` 类型以及 JDK 中的其他库获取 `Spliterator`。有许多不同的实现，用于处理不同的特性，包括有限/无限、有序/无序、已排序/未排序以及可变/不可变。它们继承了其底层数据结构的特性。\n\
    \n`Spliterator` 是一种低层次的抽象，旨在让你对并行迭代进行更细粒度的控制。然而，API 缺乏一些实现函数友好型算法所需的精细化。在上面的示例中，我们需要在\
    \ `BooleanHolder` 中存储搜索状态。\n\n# 总结\n\n这标志着我们对新且改进的 Java Collections 库以及标准函数式接口概述结束。正如标准\
    \ JDK 库为了支持函数式概念发生了许多变化一样，可以期待第三方 API 发生重大变化。但最大的变化尚在后面。\n\n# 关键点\n\n新包 `java.util.function`\
    \ 包含一组函数式接口。这些接口被分为四类，每类由其原型类型表示：`Consumer`（消费者）、`Function`（函数）、`Predicate`（谓词）和\
    \ `Supplier`（供应者）。\n\n每个函数式接口族都定义了专门针对类型和参数个数的变体。函数式接口还定义了允许函数组合的方法。多个不同的 lambda\
