    无需指定存储位置的性质（声明变量），这将由 Python 语言本身来处理。


    在处理变量类型和变量编写规则之前，让我们运行一个简单的程序来帮助理解这是如何实现这一点的。


    - a. 启动 IDLE

    - b. 导航到 File（文件）菜单并点击 New Window（新建窗口）

    - c. 输入以下内容：


    ```

    num1=4

    num2=5

    sum=num1+num2

    print(sum)

    ```


    - d. 在 File（文件）菜单上点击 Save（保存）。输入文件名 `my2.py`。

    - e. 导航到 Run（运行）并点击 Run Module（运行模块）来运行程序。


    该程序的预期输出应该是“9”，且不带双引号。


    此时，你可能急于了解刚刚发生了什么，以及为什么 `print(sum)` 没有像我们编写的第一个程序那样带有双引号。以下是解释：


    第一行 `num1=4` 意味着变量 `num1`（我们对 number1，即第一个数字的简写）在程序运行前被赋值为 4。


    第二行 `num2=5` 意味着变量 `num2`（我们对 number2，即第二个数字的简写）在程序运行前被赋值为 5。


    计算机解释这些指令并存储给定的数字。


    第三行 `sum=num1+num2` 告诉计算机获取 `num1` 的任何值并将其加到 `num2` 的任何值上。换句话说，对 num1 和 num2 的值进行求和。


    第四行 `print(sum)` 意味着显示 `sum` 的所有内容。如果我们给 `sum` 加上双引号，计算机将仅仅显示“sum”这个单词，而不是两个数字之和！记住那句老话：计算机是垃圾进垃圾出。它们只会遵循你给出的指令！


    现在，在解释变量类型之前，让我们先尝试三个涉及数字的练习。记住变量的值是变化的，例如 `num1` 可以取 3、8、1562、1。


    按照打开 Python IDE 的步骤并执行以下操作：


    - f. 输出应该是 54：

    ```

    num1=43

    num2=11

    sum=num1+num2

    print(sum)

    ```

    - g. 输出应该是 167：

    ```

    num1=101

    num2=66

    sum=num1+num2

    print(sum)

    ```

    - iii. 输出应该是 28：

    ```

    num1=9

    num2=19

    sum=num1+num2

    print(sum)

    ```


