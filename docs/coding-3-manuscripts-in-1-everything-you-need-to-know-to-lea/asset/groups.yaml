    \ etc.\n\n## Linked list ADT Operations\n\nBelow is the API of Linked list.\n\n\
    Insert(k): adds k to the start of the list.\n\nInsert an element at the start\
    \ of the list. Just create a new element and move pointers. So that this new element\
    \ becomes the first element of the list. This operation will take O(1) constant\
    \ time.\n\nDelete(): Delete the element at the start of the list.\n\nDelete an\
    \ element at the start of the list. We just need to move one pointer. This operation\
    \ will also take O(1) constant time.\n\nPrintList(): Display all the elements\
    \ of the list.\n\nStart with the first element and then follow the pointers. This\
    \ operation will take O(N) time.\n\nFind(k): Find the position of the element\
    \ with value k. Start with the first element and follow the pointer until we get\
    \ the value we are looking for or reach the end of the list. This operation will\
    \ take O(N) time.\n\nNote: Binary search does not work on linked lists.\n\nFindKth(k):\
    \ Find element at position k.\n\nStart from the first element and follow the links\
    \ until you reach the element. This operation will take O(N) time.\n\nIsEmpty():\
    \ Check if the number of elements in the list are zero. Just check the head pointer\
    \ of the list, if it is Null then the list is not empty. This operation will take\
    \ O(1) time.\n\n## LinkedList implementation in JAVA Collections\n\nLinkedList<E>\
    \ in JAVA Collections is a data structure that implements List<E> interface.\n\
    \nExample:\n\n```java\nimport java.util.LinkedList;\npublic class LinkedListListDemo\
    \ {\n    public static void main(String[] args) {\n        LinkedList<Integer>\
    \ Il = new LinkedList<Integer>();\n        Il.addFirst(2); // 8 is added to the\
