- md: "\nfunctional programming pushes this idea further by turning micro-patterns\
    \ of everyday programming into functions. For example, iterating over data, be\
    \ it with iterators, for-loops, or while-loops, is one of those micropterns. Functional\
    \ programming changes the way we think about them.\n\nJava's functionalization\
    \ effort would not be complete without a revamp of its Collections library, namely\
    \ the Collection, Map, List, and Set interfaces. This is because iteration is\
    \ often done over collections, and they are the very fabric of Java programs.\
    \ It is a natural place for the functionalization effort to occur. By making any\
    \ kind of significant changes, adding new methods to the Collection interface,\
    \ would break backward compatibility to all programs written pre-Java 8. This\
    \ includes not only the JDK's own hierarchy extending the Collection interface\
    \ but any open or closed source 3rd party library and in-house classes. Java's\
    \ designers never have and will never adopt such a strategy. Yet changes were\
    \ necessary; the library was introduced in 1998, eons in software industry years,\
    \ and was showing its age.\n\nThe motivation for the introduction of default methods\
    \ was ushered by the need to modernize and functionalize the Collections library.\
    \ Default methods are just the right tonic because they permit behavior to be\
    \ added at the root of the hierarchy without disturbing dependent classes. Subclasses\
    \ can either inherit or override the behavior. Unlike adding new interface methods,\
    \ subclasses can automatically accept new default methods without recompilation.\
    \ Instant compatibility is achieved. Default methods have proven useful in their\
    \ own right but owe their existence to the need to functionalize the Collections\
    \ library.\n\nA second re-occurring theme in functional programming is parallelization.\
    \ Quite simply, functional programming offers a better mousetrap for parallel\
    \ processing. As a consequence, the Collections library has been enriched to benefit\
    \ from multi-core CPUs when processing collections. Together with Streams, the\
    \ Collections library is at center stage in bringing functional-style parallel\
    \ processing to Java.\n\nNow that we've studied Java's standard functional interfaces,\
    \ we can begin to apply that knowledge to Collections. Let's look at what has\
    \ become of the Collections library in Java 8.\n\n## Collection interface\n\n\
    We start by looking at a brand new default method in the Collection interface\
    \ available to lists and sets. This is the forEach() method:\n\n```java\n// Defined\
    \ in the Iterable interface and extended in Collection\ndefault void forEach(Consumer<?\
    \ super T> action)\n```\n\nThis method iterates through the entire collection\
    \ letting the Consumer decide what to do for each element. This is the concept\
    \ of internal iteration and a manifestation of declarative programming. The details\
    \ of how to iterate are not specified. This is in opposition to external iteration,\
    \ where the details of how to iterate as well as what to do with each element\
    \ are specified in code.\n\nWe will show examples of these functionalized collection\
    \ methods with slapstick comedy trio from the golden age of Hollywood films: Larry,\
    \ Moe, and Curly of The Three Stooges fame. To start, let's print the contents\
    \ of a collection:\n\n```java\nCollection<String> stooges = Arrays.asList(\"Larry\"\
    , \"Moe\", \"Curly\")\n// Print the contents of the stooge collection\nstooges.forEach(System.out::println);\n\
    ```\n\nThe forEach() method has a very wide range of applicability. It is a much\
    \ more convenient way to iterate through collections and should be your de-facto\
    \ standard. However, there are some things you will not be able to do. Most notably,\
    \ you cannot change the state of local variables like you could in a while loop.\
    \ Algorithms must be re-thought functionally. For now, just know that forEach()\
    \ is ideal for iterations that do not mutate state.\n\nWe now look at another\
    \ new method available in Collection:\n\n```java\ndefault boolean removeIf(Predicate<?\
    \ super E> filter)\n```\n\nThe method removeIf() internalizes the entire process\
    \ of iterating, testing, and removing. It requires only to be told what the condition\
    \ for removal is.\n\nUsing the now-familiar predicate functional interface, we\
    \ can easily figure out what kind of lambda is to use.\n\n```java\n// Remove all\
    \ people not part of The Three Stooges comedy trio\nList<String> theThreeStooges\
    \ = new ArrayList<>\n(Arrays.asList(\"Moe\", \"Curly\", \"Tom\", \"Dick\", \"\
    Harry\"));\n\n// Create the predicate that determines who is a stooge\nPredicate<String>\
    \ isStooge = \ns -> \"Larry\".equals(s) || \"Moe\".equals(s) || \"Curly\".equals(s);\n\
    \n// Negate the condition to remove non-stooges\ntheThreeStooges.removeIf(isStooge.negate());\n\
    ```\n\nTo replace all contents of a List, we can use replaceAll():\nreplaceAll()\
    \ uses a UnaryOperator as its functional interface, which is a Function sub interface.\n\
    \nBoth replaceAll() and replaceAll() are available to all subclasses with one\
    \ caveat: the underlying class must support removal, or an exception will be thrown.\n\
    \nThese examples show the compactness of functional programming. Most of the work\
    \ was done by the function with the lambda providing the details.\n\n## Map interface\n\
    \nOne of the biggest irritants of using lists as values in maps is the constant\
    \ need to check for the presence of the map before adding, updating, or removing\
    \ an element. First, you must try to extract the list and create it if it is not\
    \ found. For example, we say have a method that updates a movie database implemented\
    \ as a Map. The map’s key is the key of the movie, and its value is a list of\
    \ movies for that year. Pre-Java 8, the code would look like this: Java 8 offers\
    \ a better alternative with these default methods:\n\n```java\ndefault V compute\n\
    \  (K key,\n  BiFunction<? super K, ? super V, ? extends V> remappingFunction)\n\
    \ndefault V computeIfPresent\n  (K key,\n  BiFunction<? super K, ? super V, ?\
    \ extends V> remappingFunction)\n\ndefault V computeIfAbsent\n  (K key,\n  Function<?\
    \ super K, ? extends V> mappingFunction)\n\ndefault V getOrDefault(Object key,\
    \ V defaultValue);\n\ndefault void putIfAbsent(K key, V value);\n\ndefault V merge\n\
    \  (K key, V value,\n  BiFunction<? super K, ? super V, ? extends V> remappingFunction)\n\
    ```\n\nLet's start with the compute methods. Each variant allows the map's value\
    \ to be generated by refactor the previous code example:\n\n```java\nprivate Map<Integer,\
    \ List<String>> movieDatabase = new HashMap<>();\n\nprivate void addMovie(Integer\
    \ year, String title) {\n    movieDatabase.computeIfAbsent(year, k -> new LinkedList<>());\n\
    \    movieDatabase.compute(year, (k, v) -> {\n      // K is the key of the map\
    \ (the year)\n      // V is the value containing the list (titles)\n      v.add(title);\n\
    \      return v;\n    });\n}\n```\n\nNotice that the creation of the list is handled\
    \ by computeIfAbsent() lambda. When it is time to add the movie to the list, via\
    \ the compute() method, the add() will never throw a NullPointerException because\
    \ the list is guaranteed to be created. In this case, using computeIfAbsent()\
    \ method is overkill, and we would be better off with putIfAbsent():\n\n```java\n\
    movieDatabase.putIfAbsent(year, new LinkedList<>());\n```\n\nThis method is lambda-less\
    \ and expects a value to be given not calculated. This is still a functional style\
    \ though no lambda was used. It proves the point that you can express code functionally\
    \ without necessarily using lambdas.\n\nIf you still need to extract the data,\
    \ you can use a more functional approach with the getOrDefault() method:\n\n```java\n\
    movieDatabase.getOrDefault(year, new LinkedList<>());\n```\n\nYou can also use\
    \ the merge() method as an alternative. It facilitates the checking of the existence\
    \ of a list. In the example below, if the key (year) doesn't exist in the map,\
    \ it puts the value (titles) on the map. If it does exist it allows a BiFunction\
    \ to decide what to do with the two lists: And it can be used by this way:\n\n\
    ```java\nList<String> titles = new ArrayList<>(Arrays.asList(\"Meet the Baron\"\
    , \"Nertsery Rhymes\")); own```\n\n```java\nmovieDatabase.merge(1933, titles,\n\
    // BiFunction to append t2 to t1\n(t1, t2) -> {t1.addAll(t2); return t1;});\n\
    ```\n\nThe BiFunction can also return null, which tells the merge to delete the\
    \ key.\n\nThe takeaway is that we have removed the overhead code of checking for\
    \ the existence of an element and can now focus on what really matters: defining\
    \ how to create the list and how to add an element to the list.\n\nThe map interface\
    \ has been enriched with other functional methods such as forEach(), replace(),\
    \ and replaceAll() and uses the same principle of code internalization. Consult\
    \ the appendix for the complete listing.\n"
  mdcn: "\n函数编程通过将日常编程中的微模式转换为函数，进一步推进了这一理念。例如，对数据的迭代（无论是使用迭代器、for 循环还是 while 循环）都是这些微模式之一。函数编程改变了我们思考这些问题的方式。\n\
    \nJava 的函数化工作如果没有对它的集合库（Collections library）进行重构，即 Collection、Map、List 和 Set 接口，将是不完全的。这是因为迭代通常是在集合上进行的，而集合是\
    \ Java 程序的结构基石。这是函数化工作发生的自然场所。通过进行任何形式的重大更改（如向 Collection 接口添加新方法），将破坏所有 Java\
    \ 8 之前编写程序的向后兼容性。这不仅包括 JDK 自身的扩展 Collection 接口的层次结构，还包括任何开源或闭源的第三方库以及内部类。Java\
    \ 的设计者从未、永远不会采用这种策略。然而，变化是必要的；该库于 1998 年引入，在软件行业年份中这是几个世纪以前了，而且它已经显得过时了。\n\n引入默认方法（default\
    \ methods）的动机源于使集合库现代化和函数化的需求。默认方法恰恰是这种良药，因为它们允许在层次结构的根部添加行为，而不会扰动依赖类。子类可以继承或重写该行为。与添加新接口方法不同，子类无需重新编译即可自动接受新的默认方法。这实现了即时兼容。默认方法本身被证明是有用的，但它们之所以存在归功于集合库函数化的需求。\n\
    \n函数编程的第二个反复出现的主题是并行。简单来说，函数编程为并行处理提供了一个更好的“捕鼠陷阱”。因此，集合库得到了增强，在处理集合时可以从多核 CPU\
    \ 中获益。与流（Streams）一起，集合库处于为 Java 引入函数式并行处理的核心舞台。\n\n既然我们已经学习了 Java 的标准函数式接口，就可以开始将这些知识应用于集合上了。让我们看看\
    \ Java 8 中的集合库发生了什么变化。\n\n## Collection 接口\n\n我们首先来看 Collection 接口中一个供列表和集合可用的全新默认方法。这就是\
    \ `forEach()` 这种方法：\n\n```java\n// 在 Iterable 接口中定义，并在 Collection 中扩展\ndefault\
    \ void forEach(Consumer<? super T> action)\n```\n\n该方法遍历整个集合，让 `Consumer` 决定对每个元素执行什么。这就是内部迭代（internal\
    \ iteration）的概念，也是声明式编程的体现。它没有指定如何迭代的细节。这与外部迭代相反，在外部迭代中，如何迭代的细节以及对每个元素执行什么都是在代码中指定的。\n\
    \n我们将使用好莱坞电影黄金时代的喜剧三人组来展示这些函数化集合方法的示例：著名的“三小士”（The Three Stooges）成员——Larry、Moe\
    \ 和 Curly。首先，让我们打印集合的内容：\n\n```java\nCollection<String> stooges = Arrays.asList(\"\
    Larry\", \"Moe\", \"Curly\")\n// 打印 stooge 集合的内容\nstooges.forEach(System.out::println);\n\
    ```\n\n`forEach()` 方法具有非常广泛的适用性。它是遍历集合的一种方便多的方式，应该成为你的事实上的标准。然而，有些事情是你无法完成的。最值得注意的是，你不能像在\
    \ `while` 循环中那样更改局部变量的状态。必须以函数式重新思考算法。目前，只需知道 `forEach()` 是不改变状态的迭代的理想选择。\n\n\
    我们现在看 Collection 中可用的另一个新方法：\n\n```java\ndefault boolean removeIf(Predicate<?\
    \ super E> filter)\n```\n\n`removeIf()` 方法将迭代、测试和移除的整个过程内部化。它只需要被告知移除条件是什么。\n\n\
    使用现在熟悉的 `Predicate` 函数式接口，我们可以很容易地确定要使用哪种 lambda。\n\n```java\n// 移除所有不是“三小士”喜剧三人组的人\n\
    List<String> theThreeStooges = new ArrayList<>\n(Arrays.asList(\"Moe\", \"Curly\"\
    , \"Tom\", \"Dick\", \"Harry\"));\n\n// 创建判断谁是三小士的谓词\nPredicate<String> isStooge\
    \ = \ns -> \"Larry\".equals(s) || \"Moe\".equals(s) || \"Curly\".equals(s);\n\n\
    // 取反条件以移除非三小士\ntheThreeStooges.removeIf(isStooge.negate());\n```\n\n要替换 List\
    \ 的所有内容，我们可以使用 `replaceAll()`：\n`replaceAll()` 使用 `UnaryOperator` 作为其函数式接口，它是\
    \ `Function` 的子接口。\n\n`replaceAll()` 方法对所有子类都可用，但有一个限制：底层类必须支持移除，否则将抛出异常。这些这些示例展示了函数式编程的紧凑性。大部分工作由函数完成，lambda\
    \ 提供了细节。\n\n## Map 接口\n\n使用列表作为 map 的值时，最令人恼恼的问题之一是在添加、更新或删除元素之前，总是需要检查 map 是否存在。首先，你必须尝试提取列表，如果未找到则创建它。例如，假设我们有一个用\
    \ Map 实现的电影数据库的方法。map 的键（key）是电影的键，值（value）是该年份的电影列表。在 Java 8 之前，代码看起来像：Java 8\
    \ 通过这些默认方法提供了更好的替代方案：\n\n```java\ndefault V compute\n  (K key,\n  BiFunction<?\
    \ super K, ? super V, ? extends V> remappingFunction)\n\ndefault V computeIfPresent\n\
    \  (K key,\n  BiFunction<? super K, ? super V, ? extends V> remappingFunction)\n\
    \ndefault V computeIfAbsent\n  (K key,\n  Function<? super K, ? extends V> mappingFunction)\n\
    \ndefault V getOrDefault(Object key, V defaultValue);\n\ndefault void putIfAbsent(K\
    \ key, V value);\n\ndefault V merge\n  (K key, V value,\n  BiFunction<? super\
    \ K, ? super V, ? extends V> remappingFunction)\n```\n\n引入默认方法的动机是使集合库现代化和函数化的需求。让我们从\
    \ `compute` 方法开始重构之前的代码示例：\n\n```java\nprivate Map<Integer, List<String>> movieDatabase\
    \ = new HashMap<>();\n\nprivate void addMovie(Integer year, String title) {\n\
    \    movieDatabase.computeIfAbsent(year, k -> new LinkedList<>());\n    movieDatabase.compute(year,\
    \ (k, v) -> {\n      // k 是 map 的键（年份）\n      // v 是包含列表的值\n      v.add(title);\n\
    \      return v;\n    });\n}\n```\n\n注意列表的创建是由 `computeIfAbsent()` lambda 处理的。当通过\
    \ `compute()` 方法添加电影时，`add()` 永远不会抛出 `NullPointerException`，因为了列表已创建。在这种情况下，使用\
    \ `computeIfAbsent()` 方法就多此了，我们最好使用 `putIfAbsent()`：\n\n```java\nmovieDatabase.putIfAbsent(year,\
    \ new LinkedList<>());\n```\n\n这个方法不需要 lambda，它期望给出一个值而不是计算出一个值。尽管没有使用 lambda，但这仍然是函数式。它证明了你可以在不一定使用\
    \ lambda 的情况下以函数式表示代码。\n\n如果你仍然需要提取数据，可以使用更函数式的 `getOrDefault()` 方法：\n\n```java\n\
    movieDatabase.getOrDefault(year, new LinkedList<>());\n```\n\n你还可以使用 `merge()`\
    \ 方法作为替代。它便于检查列表。在下面的示例中，如果键（年份）在 map 中不存在，它会将值（标题）放入 map 中。如果存在，它允许使用 `BiFunction`\
    \ 来决定对两个列表进行的操作：你可以这样使用：\n\n```java\nList<String> titles = new ArrayList<>(Arrays.asList(\"\
    Meet the Baron\", \"Nertsery Rhymes\"));\n\nmovieDatabase.merge(1933, titles,\n\
    // 将 t2 追加到 t1 的 BiFunction\n(t1, t2) -> {t1.addAll(t2); return t1;});\n```\n\n\
    `BiFunction` 也可以返回 `null`，这告诉 `merge` 删除键。\n\n结论是，我们删除了检查元素的开销代码，现在可以关注真正的事情：定义如何创建列表以及向列表添加元素。\n\
    \nmap 接口已通过其他函数式方法（如 `forEach()`、`replace()` 和 `replaceAll()`）得到了增强，并使用了相同的代码内部化原则。请参阅附录获取完整列表。\n"
