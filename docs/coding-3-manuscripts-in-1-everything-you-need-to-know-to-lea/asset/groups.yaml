    # Function pointers


    Much like you do with variables, you can also do the same with functions; below
    is a snippet of code that shows a function pointer being defined. Key sections
    will be highlighted:


    ```

    void printAddition(int value1, int value2)

    {

    int result = value1 + value2;

    printf("The result is: %d", result);

    }

    int main()

    {

    //Function pointer definition

    //<retrunType>(*<Name>)(<Parameters>)

    void(*functionPtr)(int,int);

    functionPtr = &printAddition;

    //Invoking call to pointer function (*functionPtr)(100, 200);

    return 0;

    }

    ```


    The basic structure for defining a function pointer is like so

    <Return_Type> (*<Name>) (<Parameters>)

    Where in this case:

    <Return_Type> = void

    <Name> = functionPtr

    <Parameters> = int,


    This function pointer can now be passed as a parameter and used in situations
    where you would want to change the behaviour of code but with almost the same
