    在全球，Java EE 与 Java SE 密切相关，因为前者是构建在后者之上的。这种特定的软件集成了专为企业解决方案设计的变革性创新。新发布版本中引入的功能和进展通常反映了
    Java 社区成员的投入、需求和请求。Java EE 实际上提供了超过二十种符合 Java 编程规范的实现方案。


    Java EE SDK 用于构建适用于大规模运行的应用程序。正如其名称所示，这种特定的 Java SDK 是为了为企业软件解决方案提供支持。JDK 提供了
    Java 程序员构建所需的强大 API 和运行时属性，以构建具有可扩展和网络功能的应用程序。需要开发多线程程序的开发者也可以发现这个 JDK 很有用。


    Java EE 8 是编写本书时的最新版本。Java EE 的修订设计为企业解决方案提供了增强的技术，还为安全和管理目的提供了现代化的应用程序。该版本的特性包含多项进展，包括通过
    Client、JSON Binding、Servlet 和 Security API 提供的增强 REST API 能力。根据 Oracle 官方网站截至
    2019 年 12 月发布的信息，该版本还包含日期和时间 API 以及 Streams API。


    ## Java ME


    Java ME 平台利用简单性、可移植性和动态性，为构建小型微设备和设备的应用程序提供了一个多功能环境。Java ME 以其卓越的应用开发环境而闻名，这归功于其交互且用户友好的导航界面以及实现网络概念的内置能力。它与物联网（IoT）相关，在构建为内置技术或连接设备设计的应用程序时非常有用，这些设备可以用于发明或实现未来的概念。Java
    ME 的可移植性和运行时属性使其适用于可穿戴设备、手机手机、相机、传感器和打印机等其他物品和设备的软件应用。


    Java ME SDK 配备了必要的工具，用于在独立环境中进行软件应用开发、测试功能以及实现设备模拟。根据 Oracle 官方网站 2019 年发布的信息，此
    JDK 非常适合容纳“连接受限设备配置 (CLDC)”技术以及“连接设备配置 (CDC)”功能。这为开发应用程序提供了一个单一且多功能的环境。


    还有其他几种 Java ME 解决方案支持在应用程序中部署 Java 编程语言。Java ME Embedded 提供了一个在设备中集成物联网能力的运行时环境，而
    Java ME embedded 客户端则有助于构建运行和优化内置程序功能的软件解决方案。Java for Mobile 利用 CLDC 和 Java ME
    开发者工具栈为移动设备创建创新功能。


    ## Java Runtime Environment


    记住，Java 应用程序要高效运行必须满足某些条件。JRE 包含了负责创建这些必要条件的配方。这包括 JVM 及其对应的文件和类属性。尽管 JRE 作为 JDK
    的一个组件运行，但它能够独立运行，特别是当任务限于运行而非构建应用程序指令时。


    JRE 为 Java 编程生态系统中的不同程序提供了重要的运行属性。例如，如果一个程序在其内部运行独立的 JRE，则该程序被认为是自包含的。这意味着程序不依赖于其他程序来访问
    JRE。这种独立性使得程序能够与不同的操作系统平台实现兼容。


    ## Java Virtual Machine


    JVM 是在计算机程序中实现 Java 的规范。它是 Java 语言平台无关特性的后动力。JVM 作为一个由其他程序执行的程序，这一地位更加突出。编写用于交互和执行
    JVM 的程序将其视为一台机器。正因为如此，使用了相同的集合、库和接口来编写 Java 程序，以便让每一个 JVM 实现都能匹配特定的操作系统。这有助于将
    Java 程序翻译或解释为本地操作系统的运行时指令，从而消除了 Java 编程中对平台的依赖性。


    作为开发者，你必须警惕你的开发环境和应用程序遭受网络攻击和其他威胁的脆弱性。JVM 提供了增强的安全功能，保护你免受此类威胁。坚固的安全基础归功于类文件操作码中的语法和结构限制。但这并不意味着
    JVM 能够容纳的类文件范围受到限制。JVM 实际上接受各种类文件，只要它们可以被验证是安全的。因此，JVM 是使用其他编程语言开发软件的可行替代方案。


    JVM 通常作为移植特性被包含在各种软件应用程序和硬件安装中。它通过 Oracle 或其他提供者指定的算法实现。因此，JVM 提供了一个开放平台。JVM 实际上包含运行时实例作为锚定其命令操作的核心属性。例如，创建一个
    JVM 实例涉及在命令提示符中编写指令，该指令反过来运行 Java 的类属性。


    Java 程序员需要熟悉 JVM 的关键领域，例如类加载器、运行时操作的数据段，以及负责执行程序的引擎。还有与性能相关的组件，例如垃圾回收器和堆维度，它们对
    JVM 的部署同样重要。JVM 与字节码之间存在着紧密的联系。


    ## Bytecodes


    字节码本质上是 JVM 命令，它们包含在类文件中，连同包括符号表在内的其他信息。它们作为后台语言程序运行，负责促进 JVM 操作的解释和执行。字节码实际上是原生代码的替代品，因为
    Java 不提供后者。JVM 寄存器的结构使得它包含方法，这些方法反过来容纳字节码流——即用于 JVM 的指令集。换句话说，每个 Java 类内部都有方法，而类加载过程会对任何给方法执行单个字节码流。当程序开始运行时，方法的激活会自动触发字节码。


    字节码的另一个重要特性是即时编译（JIT）编译器，它在运行时操作期间运行编译可执行的代码。该功能实际上存在于 JVM 内部的 HotSpot JIT 编译器。它与
    Java 运行时操作并发执行，因为它具有在优化水平执行的能力以及扩展以适应不断增长的指令流量的灵活性。以前，JIT 编译器需要频繁调优，以消除冗余程序并刷新内存。然而，Java
    新版本的频繁更新逐渐引入了自动内存刷新机制，消除了对定期调优的需求。


