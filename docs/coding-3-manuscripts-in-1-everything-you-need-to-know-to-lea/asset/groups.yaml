  mdcn: "\n我们都知道 C++ 是一门面向对象的语言。基础版本只支持单继承，而较新的版本可以为你的项目提供多重继承。在较新的版本中，我们还将能够使用多重运算符重载和复杂的多态特性。\n\
    \n## 第一章：\n如何编写你的第一个程序\n\n一旦你下载了想要使用的 C++ 环境，我们将直接开始编写你的第一个代码。要运行此代码，你需要包含以下内容：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main ()\n{\n  cout <<\
    \ \"Use This One\";\n  return 0;\n}\n```\n\n在编写这段代码时，你有几种选择。你可以选择直接在编译器中编写（它会存在于你的环境环境中），或者你可以选择将其编写并保存到计算机中。第二种方案有时很好，因为这样你就可以保存代码，并在以后代码中使用它时随时进行复制和粘贴。\n\
    \n无论哪种方式，你都应该仔细考虑你想要使用的编辑器类型。大多数编辑器都是针对特定设备的，因此你需要寻找适合你特定电脑的编辑器。你可以选择包括 Windows\
    \ 记事本、vim、vi、Brief 和 EMACS。如果你想拥有一个兼容多个平台的编辑器，那么 vim 和 vi 选项是最佳选择。\n\n当你编写自己的代码时，应该先在文本编辑器中编写，以获得程序的草稿，稍后你可以将它们移动到编译器中。这让你更容易检查自己的工作，并避免在正在编写的代码中出现错误。\n\
    \n## C++ 编译器\n\n就像文本编辑器一样，有很多你可以使用的编译器。问题是，虽然你有很多选择，但其中许多编译器都非常昂贵。这是因为你会遇到的大多数编译器都是为精英黑客设计的，他们已经掌握了其他低级编译器中的内容，现在他们想确保自己能将其提升到下一个水平。\n\
    \n好消息是，有一些编译器是可以免费获取的。你只需要留心注意，确保获取的是良好且包含了你所需的所有功能的编译器。一个与 C++ 配合良好且适合初使用的编译器是\
    \ GNU，它在 Linux 系统上效果最好，你可能在系统中已经有了它。要检查你的系统中是否可用 GNU 编译器，请使用以下代码：\n\n```bash\n\
    $ g++ -v\n```\n\n## 基础语法\n\nC++ 语言可以定义为一种使用对象来帮助保持一切井然有序，并允许代码通过各种方法进行通信并完成其他功能。C++\
    \ 语言带有四个重要部分，这些包括：\n\n- 类（Classes）\n\n这些是你的语言的组织工具。它们可以被看作是存储对象的箱子，并对相似的对象进行排序。你可以给你的类命名为你喜欢的任何名称，但良好的编程习惯是将在某种或程度上具有相似特征的对象放在同一个类中。\n\
    \n- 对象（Object）\n\n对象是你代码中具有状态和行为的事物。这些可以是诸如颜色、纹理、形状等等的事物。你通常会将这些对象归类到具有相似对象的类中。例如，如果你有一个关于狗的类，你可以将不同种类的狗放在同一个类中。\n\
    \n- 方法（Method）\n\n这是编码中用于描述行为的术语。你可以根据需要使用尽可能多或尽可能少的方法。这是你操作数据的方式，并且操作将根据你正在处理或使用的方法来执行。如果不使用正确的方法，你的程序将无法确切知道自己应该执行什么。\n\
    \n- 实例变量（Instance variable）\n\n这些指的是你正在处理的单个对象。每个对象都使用一组唯一的变量进行分类，这些变量就像指纹一样可以识别你的对象。在创建对象时，你可以使用某些值为对象分配正确的变量。\n\
    \n这就是在 C++ 中编写代码的基础。你应该花些时间在你的编译器中编写上面的代码，进行一些练习，以理解你在这里应该做什么。我们稍后会查看你使用这些代码可以做的一些事情，但这是一个极佳的起点。\n\
    \n## C++ 数据类型\n\n与你在此过程中可能想要使用的其他编程语言一样，在 C++ 代码中也会出现许多数据点。你经常会处理变量，例如，变量只是你在计算机内存中预留的空位，以便代码的不同部分能够保持安全。在处理\
    \ C++ 语言时，我们有许多可以关注的数据点，这些包括：\n\n1. 布尔型（Boolean）\n2. 双精度浮点（Double floating point）\n\
    3. 浮点型（Floating point）\n4. 整数（Integer）\n5. 字符（Character）\n6. 无值（Valueless）\n7.\
    \ 宽字符（Wide character）\n\n## C++ 函数\n\n我们还需要查看在使用 C++ 语言时会遇到的一些函数。函数非常简单，它是一组按顺序执行任务的语句。你想要在\
    \ C++ 中编写的每个程序都至少有一个函数，可以被称为 `main()` 函数，但你可能需要添加更多函数来让代码按照我们的方式工作。你可以根据需要使用尽可能多或尽可能少的方法。这是你操作数据的方式，并且操作将根据你正在处理或使用的方法来执行。如果不使用正确的方法，你的程序将无法确切知道自己应该执行什么。我们可以根据需要来拆分代码。\n\
    \n函数声明会告诉编译器函数名、参数以及返回类型。请记住，函数的定义位于函数体中。\n\nC++ 标准库可以为我们提供许多内置函数，我们可以根据需要随时调用。例如，当我们使用\
    \ `strcat()` 函数时，它可以帮助我们连接字符串。然后我们还可以使用 `memcpy()` 来帮助我们将内存的某处复制到另一个地方。这些只是你可以使用的不同类型的函数，你会发现它们每一个都以类似的方式工作。\n\
    \n考虑到这一点，我们需要更进一步，并实际查看如何在 C++ 中应用函数。你为了定义函数可以使用的代码包括：\n返回类型 函数名 (参数列表) { 函数体\
    \ }\n\n这些函数定义由函数头和函数体组成。函数的组成部分包括：\n\n- 返回类型（Return type）：你正在处理的函数可能会返回一个值，你将使用返回类型的值来获取返回结果。某些函数可以执行你想要的操作而不返回值。使用我们上面使用的语法，你得到的答案是\
    \ `void`。\n\n- 函数名（Function name）：这是你给函数的名称。当你将函数名与参数结合时，你就得到了所谓的函数签名。\n\n- 参数（Parameters）：参数是一个占位符。当你调用函数时，你将一个值传递给参数。这个值被称为实际参数或参数。参数列表将引用函数参数的数量、顺序和类型。你可以编写一个完全没有参数的函数。\n\
    \n- 函数体（Function body）：最后，函数体包含一组能够定义函数所执行内容的语句。\n\n有很多时候，我们可以使用函数"
