    # Pointers


    Pointers have been mentioned previously, and they are the memory address of a
    variable, this is much like a house address for a person. These can be passed
    around a parameter and


    allow the effects of passing by reference mentioned previously.

    The program below will show the address of a variable:


    ```

    #include <stdio.h>

    {

    int var;

    printf("The address is: %x\n", &var);

    return 0;

    }

    ```


    Output:

    > The address is: 10ffa2c

    Note: This will be different almost every time you run


    Note the highlighted statement, the ''&'' (Reference Operator) is used to return
    the memory location of the variable and allows certain'
  - '[PAGE 212]


    statements to access the data in that location. The ‘%x’ is used because a memory
    location is in hexadecimal.


    To create a pointer, we use the dereferencing operator (*), this will create a
    pointer variable that is designed to hold a memory locations address. Below is
    a program that creates a pointer and uses reference operator (&) to store another
    regular variable''s address in the newly created pointer. The dereferencing operator
    (*) is also used to access or change the actual data in that memory location.


    +   * Dereferencing operator (*) is used to create a pointer, it is also used
    when changing the actual value

    * Referencing operator (&) is used when obtaining the memory location of a pointer


    ```

    //Regular variable

    int var = 10;

    //Pointer

    int* pointer;

    //Storing of var memory location pointer = &var;

    //Pointer is now effectively ''var'' so

    things like this can happen

    *pointer = 20;

    printf("Var''s value is now: %d", var);

    Output:

    >Var''s value is now: 20

    NULL pointers

    ```


    When you create a pointer, is it initially not given anything to point at, this
    is dangerous because the pointer when created it references random memory, and
    changing this data in the memory location can crash the program. To prevent this,
    when we create a pointer we assign it to NULL like so:


    ```

    int* pointer = NULL;

    ```


    This means the pointer has an address of ‘0’, this is a reserved memory location
    to identify a null pointer. A null pointer can be'
  - '[PAGE 213]


    checked by an if statement:


    ```

    if (pointer){

    This will succeed if the pointer isn’t null.

    ```


    # Using pointers


    Now some real-world uses uses of pointers are passing them as

    parameters and effectively passing them by reference. The example

    below will show the effect:


    ```

    void Change_Value(int* reference)

    {

    //Changes the value in the memory location

    *reference = 20;

    }

    int main()

    {

    //Creates pointer to variable

    int var = 10;

    int* pointer = &var;

    printf("The value before call: %d\n", var);

    //Method call

    Change_Value(pointer); //Prints new value

    printf("The value after call: %d\n", var);

    return 0;

    }

    ```


    Output:

    >The value before call: 10

    >The value after call: 20

    This passes the memory location, not the value of the variable,

    meaning you have the location where you can make changes.

    Note the parameter is int* this is the pointer type, so for an example

    of a pointer to a char would be char*.


    # Pointer Arithmetic


    There are times when moving a pointer along to another memory

    location might be useful; this is where pointer arithmetic comes into

    use. If we were to execute ptr++ and the ptr was an integer'
  - '[PAGE 214]


    pointer it would now move 4bytes (Size of an int) along, and we were to run it
    again, another 4bytes etc. This can mean pointer (if pointing valid array structures)
    can act much like an array can. An example is below:


    ```

    int arrayInt[] = { 10, 20, 30 }; size_t arrayInt_Size = 3;

    //Will point to the first array index

    int* ptr = &arrayInt;

    for (int i = 0; i < arrayInt_Size; i++)

    {

    //Remember, *ptr gets the value in the memory location

    printf("Value of arrayInt[%d] = %d\n", i, *ptr);

    ptr++;

    }

    Output:

    >Value of arrayInt[0] = 10

    >Value of arrayInt[1] = 20

    >Value of arrayInt[2] = 30

    ```


    This shows that a pointer to the first address of the array can be incremented
    along the addresses of the array (Remember each value of an array is stored in
