    ## Variables


    ### What are variables?


    A variable, on the other hand, is an "object" that contains a specific data type
    and it''s assigned or received value. It is called a variable because the value
    contained can change according to how it is used in the code, how the coder can
    declare its value, or even how the user of the program chooses to interact with
    it. A variable, in short, is a storage unit for a data type. Having access to
    variables allow programmers to conveniently label and call stored values at hand.


    ### Types of variables in Java


    Java requires the programmer to use declaration statements, lines of code used
    to declare variables and define them by specifying the particular data type and
    name. Java has a specific way of treating variables, by defining variables as
    containers that contain a certain type and value of information, unlike some languages
    such as python, which only requires a declaration of a variable, and the variable
    can dynamically change its type; Java variables are static, which retain their
    type once declared.


    ```java

    int number = 20;

    boolean completed = true;

    String hello = "Hello World!"

    ```


    The syntax in declaring is seen in the previous examples, with the type of the
    variable coming first, then the name of the variable, then the value. Note well
    as the declaration statement can be composed of multiple declarations in one line,
    as in the following example:


    ```java

    int number = 20, boolean completed = true, string hello = "Hello World!"

    ```


    Java variables can be declared without any value at the start; in cases as these,
    Java chooses to declare these variables with a particular default value, for example:


    ```java

    byte a;

    short num;

    boolean answer;

    ```


    Will result in the values 0, 0, and false, respectively. A more complete list
    of default values is as follows: the byte, short, int, and long data types will
    all result in a default value of 0, while the float and double data types will
    result in ''\u0000'' value, a string or any other object will have a null default
    value, and all Booleans will begin with a false default value.


    In Java, variables are static when declared, meaning that the programmer must
    define the data type that the variable will. The process above is usually known
    as and referred to anassignment statement," where a value is assigned to the variable
    as in our example of num = 10, the actual value stored is on the right side of
    the equals sign, the value of 10, and num is just the "marker" to call that value.
    Note, however, that once values have been assigned to variables, needs to be carried
    out in order for the data inside that variable to change.


    ### Naming a variable


    Creating variables is an easy task, especially given how Java programmers tend
    to create and name them after the data type or the purpose of what the variable
    will store. However, there are few rules when it comes to naming these variables,
    else Java will not recognize it, and an error message will result. The main restrictions
    on variable names are that it should not begin with a special character, such
    as an underscore or a number. However, variable names can consist of characters
    such as letters and numbers, and even an underscore, provided that the underscore
    is not placed at the start. No other characters may be used, such as the # or
    even $, as these special characters have different uses in Java, and thus will
    not be recognized in a variable name.


    While those are the major rules, there are some tips when it comes to naming variables.
    The variable name should be descriptive, as in longer codes it may be difficult
    to recall just "x" is for. Having a variable name such as "count" or "output"
    is much easier to recall as compared to a generic "x" or "y" and will help in
    avoiding confusion. In addition to being descriptive, variables will also be easier
    to use if their names are kept fairly short. While having a variable name such
    as banking information account records is very descriptive, typing it repeatedly
