    ## Python 如何处理文件？


    如果你在一个执行大量数据的大型软件应用程序中工作，那么我们无法期望这些数据存储在变量中，因为变量是瞬时易失的。


    因此，当你想要处理这些情况时，文件的作用就会派上用场。由于文件本质上是非易失的，数据将永久地存储在硬盘等次级设备中，并在你的应用程序中使用 Python 处理这些文件。


    ## 你考虑过 Python 将如何处理这些文件吗？


    让我们假设普通人是如何处理这些文件的。如果你想从文件中读取数据或将数据写入文件，你需要先打开文件，或者在文件不存在时创建一个新文件，然后进行正常的读/写操作、保存文件并关闭它。


    同样，在 Python 中，通过内置应用程序的帮助也可以完成相同的操作。


    ## Python 中的文件类型


    文件有两种类型：


    - 1. 文本文件

    - 2. 二进制文件


    可以使用文本编辑器检查内容的文件称为文本文件。文本文件指的是 ASCII 字符序列。Python 程序就是文本文件的示例。


    二进制文件以与内存存储相同的方式存储数据。mp3 文件、Word 文档是一些二进制文件的示例。你无法使用文本编辑器读取二进制文件。


    在 Python 语言中，文件处理遵循以下步骤：


    - 打开文件并返回文件句柄（filehandle）。

    - 使用句柄进行读取或写入操作。

    - 关闭文件句柄。


    在 Python 中对文件执行读或写操作之前，你必须先打开它。当读/写事务完成后，你应该关闭它以释放与文件相关的资源。


    现在让我们详细查看每个步骤。


    Access_mode（访问模式）：用整数表示，例如读、写和追加。默认设置是只读 `<r>`。Buffering（缓冲）：缓冲的默认值为 0。值 0 表示不会发生缓冲。如果值为
    1，则在访问文件时将进行行缓冲。如果值大于 1，则缓冲操作将根据大小进行。


    File_name（文件名）：这是一个字符串，代表你想要访问的文件的名称。


    ## Python 语言中的文件打开模式


    ```

    <r>

    <rb+>

    <rb>

    <w+

    <wb+>

    <r+>

    <w>

    <wb>

    ```


    ## Python 文件对象属性


    一旦你调用 Python `open()` 函数，它会返回一个对象，即文件句柄。此外，你需要理解 Python 文件具有不同的特征。你可以利用文件句柄列出它所属文件的特征。


    ## 在 Python 中关闭文件


    完成工作后始终关闭文件是一个好习惯。然而，Python 有垃圾回收器来清理未使用的对象。但是，你需要手动执行，而不是将其留给垃圾回收器（GC）。


    ## Close 方法


    Python 提供 `<close()` 方法来关闭文件。当你关闭文件时，系统会创建分配给它的资源。这很容易实现。


    关闭文件会释放基本的系统资源。如果你忘记关闭文件，Python 会在程序结束或文件对象在程序内部不再被引用时自动关闭它。然而，如果你的程序很大，并且你正在读取或写入多个文件，可能会消耗系统大量的资源。如果你继续粗心地地打开新文件，可能会耗尽资源。


    ## 第 7 章：


    ## 开发工具


    ## 如何运行 Python


    现在，在我们开始运行第一个 Python 程序之前，理解我们如何运行 Python 程序是重要的。运行、执行、部署或启动一个程序简单来说就是让计算机处理指令/代码行。


    例如，如果代码行（程序）要求计算机显示某些消息，它就应该显示。以下是运行 Python 程序的运行或模式。解释器是安装 Python 包时安装的一个特殊程序，帮助将文本代码转换为计算机理解的语言。


    ## 交互模式 (Immediate Mode)


    这是一种运行未写在文件中的 Python 程序的方法。通过在命令行输入 python 进入交互模式，这将触发解释器切换到交互模式。交互模式允许直接输入表达式，并按回车生成输出。下面是
    Python 提示符：


    ```

    >>>

    ```


    Python 提示符接受用户输入。例如，输入 `2+2` 并按回车将显示 `4` 作为输出。如果你需要退出交互模式，输入 `quit()` 或 `exit()`。


    现在输入 `5 +3` 并按回车，输出应该是 `8`。


    ## 脚本模式 (Script Mode)


    脚本用于运行在文件中编写 Python 程序。脚本可以保存到硬盘等外部存储中供以后使用。所有 Python 脚本都有扩展名 `.py`，这意味着文件名以 `.py`
    结尾。例如 `FirstProg.py`。我们将稍后解释如何编写 脚本。


    ## 什么是 IDE？


    IDE 提供了一种编写和运行 Python 程序的方便方法。你也可以使用文本编辑器创建和运行 Python 程序。

