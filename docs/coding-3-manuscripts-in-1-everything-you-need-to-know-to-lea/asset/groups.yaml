    或 `read()` 读取的字符，但不包括提取运算符。


    + 3. Putback() 函数将一个字符放回输入缓冲区。


    # 第 10 章：


    # 内存与资源


    # 内存管理


    C++ 编程语言在管理执行程序所使用的内存方面，为用户提供了许多选项。在本章中，我们将探索其中一些常用的选项。我们还将介绍一些现代技术，旨在减少过去困扰 C++
    项目的内存管理问题。


    # C++ 程序的可用内存


    现代操作系统通常会从内存中预留一段区域用于执行程序，这允许操作系统同时管理多个程序的运行。不同的操作系统以不同的方式布局执行程序的内存。然而，内存布局通常会包含以下四个部分。


    - 代码（Code）：程序的编译后可执行指令存储在代码段内存中。在程序执行期间，代码段的内容永远不会改变。此外，在程序的执行过程中，代码段也不会发生变化。

    - 数据（Data）：持久变量和全局变量作为静态局部变量存储在内存的数据段中。在执行程序的整个寿命内，数据段变量一直存在。然而，除非数据是常量，执行程序可以自由更改它们的值。虽然存储在数据段变量中的值在程序执行期间可能会改变，但程序执行时数据段的大小不会改变。这是因为程序的源代码精确定义了全局变量和静态变量的数量。编译器也可能计算出数据段的精确大小。

    - 堆（Heap）：执行程序获取动态内存的区域称为堆。使用 `new` 操作符从堆中获取内存，而 `delete` 操作符将之前分配的内存返回堆。随着程序在执行过程中通过
    `delete` 和 `new` 对动态内存进行释放和分配，堆的大小会随之发生收缩和增长。

    - 栈（Stack）：函数参数和局部变量始终存储在栈中。函数参数和局部变量在函数返回时消失，在函数调用时出现。随着各种函数的执行，栈的大小在程序执行过程中也会收缩和增长。


    通常，操作系统会限制栈的大小。深度递归会消耗大量的栈空间。例如，考虑一个不当的递归函数，它省略了基准情况并表现出“无限”递归，这将消耗栈上所有的可用空间。这种情况被称为栈溢出。现代操作系统会终止任何消耗大量栈空间的进程。然而在某些嵌入式系统中，这种栈溢出可能无法被检测。通常，堆空间是充足的，操作系统可以使用虚拟内存提供更多空间。


    # 手动内存管理


    频繁使用 `new` 和 `delete` 导致的内存问题很难发现和修复。为了避免这种情况，程序员必须严格遵守以下原则：


    - 在完成列表对象时必须调用 `clear`。看以下定义：

    void x() {


    ```

    IntList1 my_list; // 调用构造函数

    // 向列表添加一些数字

    my_list.insert(12);

    my_list.insert(7);

    my_list.insert(-14);

    // 打印列表

    my_list.print();

    ```


    // 噢！忘记调用 my list 了！在上面的代码中，变量 `my list` 是 `x` 的局部变量。当函数执行该变量时，它将超出作用域。在这个阶段，栈上为局部
    `IntList1` 变量的空间被回收。虽然列表头元素仍然存在，但程序对内存的唯一访问是通过 `my.head`，但 `my list` 已不再存在。这是一个内存泄漏的经典示例。观察发现，我们设计的类中除了
    `IntList1` 之外都没有这个问题。然而，C++ 为类设计者提供了一种方法，可以指定在对象生命周期结束时执行的操作。构造函数是在对象开始存在时执行代码，而在对象结束时被称为析构函数。析构函数是一个在对象停止存在之前立即执行的特殊方法。析构函数也可以与类名相同，但带有波浪号
    `~` 前缀。此外，析构函数不接受参数。代码9.2 显示了如何为代码添加析构函数，以及之前建议的 `length` 和 `clear` 方法的优化。


