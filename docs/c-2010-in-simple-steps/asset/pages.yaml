    Now, let''s discuss the second type of data binding, that is, complex data binding.


    # Complex Data Binding


    Complex data binding refers to binding of a control to more than one data element,
    such as more than one record in a database. Some controls that support complex
    data binding are **DataGridView**, **ComboBox**, **ListBox**, and **CheckedListBox**.
    Complex data binding can be performed by using the following properties of the
    controls:


    +   - **DataSource**: Represents the data source, typically a dataset, such as
    dataSet11.

    +   - **DataMember**: Represents the data member you want to work with in the
    data source, typically a table in a dataset, such as the Customers table in the
    NORTHWND database. The **DataGridView** control uses this property to determine
    which table to display.

    +   - **DisplayMember**: Represents the field you want a control to display, such
    as the customer''s ID, CustomerID. The **ListBox** control uses the **DisplayMember**
    and **ValueMember** properties instead of a **DataMember** property for data binding.

    +   - **ValueMember**: Represents the field you want a control to return in as
    a property, such as returning the ID of a customer by using the **SelectedValue**
    property. The **ListBox** control uses the **DisplayMember** and **ValueMember**
    properties, instead of a **DataMember** property.


    Let''s now illustrate how to use complex data binding by performing the following
    steps:


    +   1. Open the **WindowsFormsDataBinding** application.

    +   2. Right-click the **WindowsFormsDataBinding** application in **Solution Explorer**
    and select **Add → Windows Forms** from the context menu to add a new form to
    the application, as shown in Fig.C#-8.29:'
