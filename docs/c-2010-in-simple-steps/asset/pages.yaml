  md: "# Using the Path Property\n\nYou can also use the **Path** property to specify\
    \ the source value that you want to bind in a WPF application. The **Path** property\
    \ is the name of the property of the source object used for binding. For example,\
    \ you can bind the **Text** property of the **TextBox** control. You can also\
    \ bind an attached property of a control by using the **Path** property. For example,\
    \ the following syntax is used with the **Path** property to bind the attached\
    \ property, **DockPanel.Dock**:\n\n```\n`Path = {DockPanel.Dock}`\n```\n\nYou\
    \ can also bind the property of a control to a particular field of a database\
    \ by using the **Path** property, as shown in the following syntax:\n\n```\n`Path=Employees.FirstName`\n\
    ```\n\nIn the preceding syntax, the control is bound to the **FirstName** column\
    \ of the **Employees** table.\n\nLet's now perform data binding in a WPF application\
    \ by using the **Path** property:\n\n+   1. Open the WPF application named **WPFDataBinding**.\n\
    +   2. Add a new window to the **WPFDataBinding** application by right-clicking\
    \ the application name in **Solution Explorer** and selecting **Add ➤ Window**\
    \ from the context menu. A window named **Window2.xaml** is added to the application.\n\
    +   3. Set the title of the **Window2** window to **Binding using the Path Property**\
    \ by using the **Title** property.\n+   4. Add the highlighted code given in Listing\
    \ 8.9 to the **Window2.xaml** file.\n\nListing 8.9: Creating Data Binding by using\
    \ the Path Property\n\n```\n```xml\n<Window x:Class=\"WPFDataBinding.Window2\"\
    \n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n  \
    \  xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    Title=\"Binding\
    \ using the Path Property \" Height=\"222\" Width=\"300\" Loaded=\"window_Loaded\"\
    >\n    <Grid Name=\"grid\" DataContext=\"{Binding ElementName=mcListBox, Path=SelectedItem}\"\
    >\n        <TextBox Margin=\"10,10,10,121\" FontWeight=\"Bold\">Pick a color from\
    \ below list\n        </TextBox>\n        <ListBox Name=\"mcListBox\" Height=\"\
    100\" Width=\"100\"\n                 Margin=\"28,46,0,0\" HorizontalAlignment=\"\
    Left\" VerticalAlignment=\"Top\">\n            <ListBoxItem>Orange</ListBoxItem>\n\
    \            <ListBoxItem>Green</ListBoxItem>\n            <ListBoxItem>Blue</ListBoxItem>\n\
    \            <ListBoxItem>Gray</ListBoxItem>\n            <ListBoxItem>LightGray</ListBoxItem>\n\
    \            <ListBoxItem>Red</ListBoxItem>\n        </ListBox>\n        <Ellipse\
    \ Height=\"100\" Name=\"ellipse1\" DataContext=\"{Binding\n            ElementName=mcListBox}\"\
    \ Stroke=\"Black\" Margin=\"0,46,31,0\"\n            VerticalAlignment=\"Top\"\
    \ HorizontalAlignment=\"Right\" Width=\"116\">\n            <Ellipse.Fill>\n \
    \               <Binding Path=\"SelectedItem.Content\"/>\n            </Ellipse.Fill>\n\
    \        </Ellipse>\n    </Grid>\n</Window>\n```\n```\n\nIn Listing 8.9, the highlighted\
    \ code indicates that the **Binding** property is used to bind an **Ellipse**\
    \ control's **Fill** property to a **ListBox** control's selected value. In the\
    \ code, notice that the **DataContext** attribute for the **Ellipse** control\
    \ is set to the binding definition. The **Binding** property of the **Ellipse**\
    \ control sets the binding for the control to the **ListBox** control by specifying\
    \ the ID of the control in the **ElementName** property. The value of the selected\
    \ item in the **ListBox** is assigned to the **Ellipse** control by using the\
    \ **Path** property.\n\n+   5. Set **Window2** window as the startup object.\n\
    +   6. Press the **F5** key to execute the **WPFDataBinding** application. The\
    \ output appears.\n+   7. Click the **Blue** color option in the list box. The\
    \ output appears, as shown in Fig.C8.8.33:"
