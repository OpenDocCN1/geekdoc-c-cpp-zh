    \ delegate object:\n\n```\n```\nMyDelegate deLObject = MyDelegateMethod;\n```\n\
    ```\n\nAfter creating the delegate object, you can call a method through the delegate\
    \ and pass parameters, if any. The following code snippet demonstrates how to\
    \ invoke a delegate:\n\n```\n```\ndeLObject(5);\n```\n```\n\nNow, let's create\
    \ a console application named DelegateExample to create a single-cast delegate\
    \ by performing the following steps:\n\n+   1. Click Start→All Programs→Microsoft\
    \ Visual Studio 2010→Microsoft Visual Studio 2010 to open the Visual Studio 2010\
    \ IDE.\n+   2. Select File→New→Project from menu bar to open the New Project dialog\
    \ box.\n+   3. Select Visual C# in the Installed Templates pane and then select\
    \ Console Application option in the Templates pane on the right-hand side.\n+\
    \   4. Enter DelegateExample in the Name text box to specify the name of the application\
