    TextAlignment="Center" Background="LavenderBlush" VerticalScrollBarVisibility="Auto"/>

    <Button Height="25" Margin="100,130,100,0" Name="button1" Click="button1_Click"
    Background="LavenderBlush" Content="Clear textBox"/>

    </Grid>

    </Window>

    ```

    ```


    In Listing 7.5, a TextBox control is added to a Grid control. The TextBox control
