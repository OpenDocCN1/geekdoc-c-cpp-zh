- pgno: 35
  md: 'Visual Studio 2010 is now successfully installed on your computer.

    After installing Visual Studio 2010, let’s explore the Visual Studio 2010 IDE.


    # Introducing the Visual Studio 2010 IDE


    The Visual Studio 2010 IDE is a comprehensive environment to develop and execute
    .NET applications. It contains a menu bar, toolbars, and several windows that
    help you to design the UI of .NET applications as well as execute the applications.


    Let’s now learn to open the Visual Studio 2010 IDE.


    # Opening the Visual Studio 2010 IDE


    After you have installed Visual Studio 2010 on your computer, you can open the
    application.


    Perform the following steps to open the Visual Studio 2010 IDE:


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010, as shown in Fig.C#1.32:

    +   2. Select an appropriate option from the Choose your default environment settings
    list box. In our case, we have selected the General Development Settings option
    (Fig.C#1.33).

    +   3. Click the Start Visual Studio button, as shown in Fig.C#1.33:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_35_0.png)


    Fig.C#1.32


    The Choose Default Environment Settings dialog box appears (Fig.C#1.33), prompting
    you to configure the IDE.


    Note that the Choose Default Environment Settings dialog box is displayed only
    when you open Visual Studio 2010 for the first time. This dialog box allows you
    to set the default settings for Visual Studio 2010 by selecting the appropriate
    options. You can specify the default environment settings of Visual Studio 2010
    to be either generic or specific to a .NET language, such as Visual C# or Visual
    Basic. For instance, if you select the General Development Settings option under
    the Choose your default environment settings list box, the Visual Studio 2010
    IDE is configured as a generic IDE and suitable for all .NET languages. However,
    if you select the Visual C# Development Settings option, then the Visual Studio
    2010 IDE is configured as an IDE specific to Visual C#.'
