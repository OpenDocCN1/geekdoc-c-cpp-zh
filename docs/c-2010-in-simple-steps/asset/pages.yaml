- pgno: 263
  md: 'The world of business is growing rapidly and so is the need to store data.
    Data, as you know, is a collection of facts, which is generally stored in a database
    in the form of tables. A database is a collection of tables, which are used to
    store large amounts of data (information) systematically in a computer. This stored
    information can be accessed from the database quickly and efficiently as and when
    required. Databases that are used to relate data in multiple tables are called
    relational databases. Some popular relational databases are SQL Server (where
    SQL stands for Structured Query Language Server), Oracle, and Microsoft Access.


    Retrieving and manipulating data directly from a database requires the knowledge
    of basic SQL commands. Anyone who is not familiar with SQL commands will not be
    able to use the data stored in a database. Therefore, most business applications
    provide a user-friendly interface that helps to retrieve data from a database
    without having to write SQL commands. Microsoft ActiveX Data Objects.NET (ADO.NET)
    is a model used by .NET applications, which you use to communicate with the database
    directly to retrieve and manipulate data.


    This chapter introduces you to ADO.NET. You also learn about the concept of data
    binding and the different types of data binding in Windows Forms and Windows Presentation
    Foundation (WPF).


    Let''s first explore ADO.NET in brief.


    # Exploring ADO.NET


    ADO.NET is the main data access technology that a .NET application uses. ADO.NET
    uses a disconnected data architecture, which means that the data you work with
    is just a copy of the data in the database. Microsoft chose disconnected data
    architecture for a number of reasons. In traditional client/server applications,
    you are connected to a database and you need to maintain this connection, while
    the application is running. However, maintaining such connections requires a lot
    of server resources. Therefore, when you migrate to the Internet, you should follow
    the disconnected data architecture, instead of maintaining direct and continuous
    connections with the server to reduce the load on servers.


    Let''s now discuss the improvements in the ADO.NET 4.0 Entity Framework and the
    components that constitute ADO.NET.


    # Improvements in the ADO.NET 4.0 Entity Framework


    With ADO.NET Entity Framework, programmers are able to develop data access applications
    by programming the applications against a conceptual application model rather
    than directly programming against a relational storage schema. The main objective
    behind this is to decrease the amount of code and maintenance that is generally
    required for data-oriented applications.


    The new features and enhancements incorporated in ADO.NET 4.0 Entity Framework
    include the following:


    +   - **Support for creating foreign keys in the conceptual data model:** Enables
    developers to create conceptual models wherein foreign key columns in the database
    correspond to scalar properties on entity types. The properties of any entity
    type that map to a single field in the data storage model are referred to as scalar
    properties.

    +   - **Introduction of self-tracking entities for n-tier application development:**
    Refers to the use of self-tracking entities while working with n-tier applications.
    These self-tracking entities can generally record changes to scalar, complex,
    and navigation properties.


    > **Note**

    > An n-tier application is one, which is distributed among three or more independent
    computers in a distributed network. In the term n-tier, n refers to some number,
    such as a 3-tier. In a 3-tier application, the user interface is in the user''s
    computer, the business logic is stored in a more centralized computer, and the
    needed data is stored in a database server or a computer that manages a database.


    +   - **New methods for n-tier application development:** Refers to the new methods
    that have been added in the System.Data.Objects namespace to facilitate easier
    development of n-tier applications.'
  merge: -1
  img_proc: true
