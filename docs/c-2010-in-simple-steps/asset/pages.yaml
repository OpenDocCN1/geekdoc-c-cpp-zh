  md: 'Now, let’s discuss about the support for targeting multiple versions of .NET
    Framework provided in Visual Studio 2010.


    # ## Enhanced Support for Multi-Targeting


    The multi-targeting feature was introduced in Visual Studio 2008 and has been
    enhanced in Visual Studio 2010.With this feature, you can build .NET applications
    that target .NET Framework versions 2.0, 3.0, 3.5, or 4.0. In other words, applications
    developed in older versions of the .NET Framework can be upgraded to .NET Framework
    4.0 by using the multi-targeting feature. To facilitate multi-targeting, Microsoft
    has made available reference assemblies for each version of .NET. When you target
    a particular version of the .NET Framework, the IntelliSense feature includes
    only those features and properties that are supported in the selected version
    of the .NET Framework.


    > > **Note**

    > >

    > > Starting with .NET Framework 3.0, Microsoft introduced a reference assemblies
    folder that can be found inside the Program Files folder. The reference assemblies
    folder contains those assemblies that are shipped with the .NET Framework 3.0.
    These assemblies can be referenced while designing and building new .NET components.


    You can target any particular .NET Framework version in the New Project dialog
    box of Visual Studio 2010 by selecting the .NET Framework version that you want
    from the drop-down list in the middle pane, as shown in Fig.C#-1.9.


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_23_0.png)


    # ## The Editor Zoom Feature


    With Visual Studio 2010, you can zoom in and zoom out the font size of text in
    the Code Editor window, similar to the way you do in Internet Explorer or any
    other Web browser. For this, you just need to hold down the CTRL key on the keyboard
    and scroll the mouse wheel to increase or decrease the font size of the text in
    the Code Editor window. An example where the zooming feature can be usefully employed
    is while giving presentations. In versions earlier to Visual Studio 2010, you
    could change the font size of the text in the Code Editor window by selecting
    the Options submenu under the Tools menu. Fig.C#-1.10 shows the increased size
    of font of the text in Code Editor by using the zooming feature:'
  merge: -1
  img_proc: true
