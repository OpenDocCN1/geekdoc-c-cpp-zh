  md: "The mechanism of assigning a special meaning to an operator, according to user\
    \ defined data types such as classes, is known as operator overloading. It is\
    \ not possible to overload all the operators. Table 4.3 shows the overloading\
    \ status of different operators:\n\nTable 4.3: Operators and Their Overloading\
    \ Status\n\n| Operators | Type | Overloading Status |\n|---|---|---|\n| +, -,\
    \ !, ~, ++, --, true, false | Unary | Can be overloaded |\n| +, -, *, /, %, &,\
    \ |, ^, <<, >> | Binary | Can be overloaded |\n| ==, !=, <, >, <=, >= | Comparison\
    \ | Can be overloaded |\n| &&, || | Conditional logic | Cannot be overloaded,\
    \ but can be evaluated using the & and | operators |\n| [] | Array Indexing |\
    \ Cannot be overloaded, but can help in defining indexers |\n| () | Cast | Cannot\
    \ be overloaded, but can help in defining new conversion operators |\n| +=, -=,\
    \ *=, /=, %=, &=, |=, ^=, <<=, >>= | Assignment | Cannot be overloaded, but +=\
    \ operator, for example, is evaluated using + operator, which can be overloaded\
    \ |\n| =, ., ?, :, new, is, sizeof, typeof | Other | Cannot be overloaded |\n\n\
