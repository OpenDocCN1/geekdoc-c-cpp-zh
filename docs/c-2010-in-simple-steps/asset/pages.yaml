    Next, let''s learn how to create, save, and run a Windows Forms application.


    # Creating, Saving, and Running a Windows Forms Application


    Windows Forms applications refer to those applications that have a form at the
    center of the application. A form in a Windows Forms application is a rectangular
    area with a title bar at the top. In addition, the form has Minimize, Maximize,
    and Close buttons at its upper-right corner. A Windows form provides the GUI of
    the application, allowing interaction with the user.


    Visual Studio 2010 provides a project template to develop a Windows Forms application.


    Let''s perform the following steps to create, save, and run a Windows Forms application
    by using Visual Studio 2010:


    +   1. Click **Start**→**All Programs**→**Microsoft Visual Studio 2010**→**Microsoft
    Visual Studio 2010** to open the Visual Studio 2010 IDE.

    +   2. Select **File**→**New**→**Project** from the menu bar, to display the **New
    Project** dialog box.

    +   3. Select **Visual C#**→**Windows** in the **Installed Templates** pane on
    the left-hand side of the **New Project** dialog box, which displays the installed
    project templates available for Windows Forms applications in C#.

    +   4. Select **Windows Forms Application** from the middle pane of the **New
    Project** dialog box to create a Windows Forms application.

    +   5. Enter an appropriate name for the Windows Forms application in the **Name**
    text box. In our case, we have entered the name as **FirstWindowsFormsApplication**.

    +   6. Enter the location to save the application in the **Location** combo box.
    In our case, we have selected the default location, which is **C:\\users\\temp\\documents\\visual
    studio 2010\\Projects**.

    +   7. Click the **OK** button.'
  merge: -1
  img_proc: true
