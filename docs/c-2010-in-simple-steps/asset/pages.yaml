    The various parameters in the preceding syntax can be briefly described as follows:


    +   - **elementName**: Refers to the name of the element using the resource

    +   - **propertyName**: Refers to the name of the property that takes its value
    from the resource

    +   - **markupExtension**: Refers to the type of resource, which can be either
    a static resource or a dynamic resource

    +   - **keyName**: Refers to the key name of the resource


    Depending on the markup extension used to reference a resource, there are two
    types of resources, static and dynamic. Let''s learn about these two resource
    types in detail in the following sections.


    # Using a Static Resource


    Resources that are referenced by using the StaticResource markup extension are
    known as static resources. You can reference a resource as a static resource when
    the resource is static throughout run time, that is, the value of the resource
    does not change after it is referenced.


    The value of a static resource is determined at the time of loading. The key name
    of the resource is looked up in all the resources (resource dictionaries) in an
    application. The key name is looked up first in the resources of the element for
    which you want to set the property. If the key name is not found, then the key
    name is looked up in the parent element and its resources up to the root element.
    If the key name is not found in any of the elements, the key name is looked up
    in the application resources. In case the static resource is not found at all,
    an exception occurs.


    Let''s create a standalone WPF application named StaticResourcesDemo to show the
    use of a static resource. For this, perform the following steps:


    +   1. Repeat steps 1 to 3 as followed earlier while creating the GridDemo application
    in the *Using the Grid Control* section of this chapter.

    +   2. Enter the name **StaticResourcesDemo** in the **Name** text box and specify
    an appropriate location for the application in the **Location** combo box.

    +   3. Click the **OK** button. The StaticResourcesDemo application is created.

    +   4. Add the highlighted code given in Listing 7.20, in the MainWindow.xaml
    file.


    Listing 7.20: Using a Static Resource in XAML


    ```

