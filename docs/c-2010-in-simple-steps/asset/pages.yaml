    # Working with Strings


    A string can be thought of as a sequence of Unicode characters encoded in UTF-16.
    In C#, string is an alias for the .NET String type that is managed by the .NET
    Framework. Therefore, string and String are equivalent and you can use them interchangeably.
    A String is a reference type and represented by double quotes, as shown in the
    following code snippet:


    ```

    string str = "abc";

    ```


    The String class provides various methods to safely perform certain operations
    on strings, such as string concatenation and string manipulation. Let''s discuss
    how to perform string manipulation in the next section.


    # String Manipulation


    The System.String class provides a set of different methods to manipulate strings,
    such as changing the case of strings and truncating some portions of a string.
    Let''s consider a case, where you have two or more strings and you want the reverse
    of a particular string literal, or you want to find the length of a string. You
    can perform all such manipulations on strings by simply creating a string data
    type and using the dot operator (.) to get the string functionalities. The following
    code snippet shows an example to manipulate a string:


    ```

    string name = "Visual C# 2010";

    string uppercase = name.ToUpper();

    string lowercase = name.ToLower();

    string myname = name.Replace(name, newname);

    ```


    In the preceding code snippet, variable name is a string variable, which holds
    the string, Visual C# 2010. The ToUpper() method turns the case of the value in
    the name variable to uppercase and the ToLower() method turns the case of the
    value in the name variable to lowercase. Similarly, the Replace (name, newname)
    method replaces the value of the name variable with the value of the newname variable.


    # String Concatenation


    At times, you may need to combine two strings to display a message. This process
    of adding two strings is called string concatenation. The plus (+) operator is
    used for concatenation, as shown in the following code snippet:


    ```

    ConcatenatedString = "Visual " + "C# 2010"

    ```


    In the preceding code snippet, the ConcatenatedString variable contains the value,
    Visual C# 2010. Now, let''s learn about type safety.


    # Implementing Type Safety


    C# is a type-safe language and the type-safety property of any programming language
    ensures that a variable can only be accessed by the type associated with that
    variable. While using the type-safety attribute it is not possible to leave a
    variable uninitialized, index arrays beyond their bounds, access arbitrary memory
    locations, or perform illegal type casts. The pre-requisite of a type safe programming
    language is that you can perform only those operations on a type, which are valid
    for it. For example, if you pass a floating-point number as a parameter to a method
    that is defined to accept an integer number as parameter; then, you get a compile-time'
