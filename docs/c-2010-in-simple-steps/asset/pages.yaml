    Now, let''s learn about type conversions.


    # Type Conversions


    C# is a statically typed language; therefore, if you declare a variable as an
    int type, then you cannot assign a string type value to it. You can use type conversion
    to convert the data of one data type into another data type. For instance, there
    can be times when you need to assign an int type value to a variable declared
    as float type. There can also be a situation where you need to pass an integer
    number to a method that is defined to accept a double type value. Such types of
    operations are known as type conversions. Type conversion can be of two types,
    implicit conversion and explicit conversion, as shown in Fig.C#2.4:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_74_0.png)


    In the following section, you learn to implicitly convert a data type into another
    data type.


    # Implicit Conversion


    If a compiler converts a data type into another data type automatically, it is
    known as implicit conversion. In implicit type conversion, there is no loss of
    data. Fig.C#2.5 illustrates the implicit data conversion:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_74_1.png)


    In Fig.C#2.5, the arrows show the direction of the possible conversions with basic
    data types of C#. Following is an example of implicit conversion:


    ```

    short a = 20;

    int b = a; // Implicit conversion

    ```


    Let''s learn about explicit conversion.


    # Explicit Conversion


    When one data type is converted explicitly to another data type, with the help
    of some pre-defined functions, it is called explicit conversion; and there are
    the chances of data loss in this process because the conversion is forceful. Some
