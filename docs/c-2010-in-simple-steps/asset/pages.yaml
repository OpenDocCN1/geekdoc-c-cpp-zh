    and aligned at the center of the control. Note that another property, named VerticalScrollBarVisibility,
    of the textBox1 control is set to Auto. This property is inherited from the TextBoxBase
    class and retrieves or sets a value that indicates whether a vertical scroll bar
    appears in the control.'
