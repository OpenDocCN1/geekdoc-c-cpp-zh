- pgno: 94
  md: "Next, let's discuss about the for loop.\n\n# The for Loop\n\nThe function of\
    \ the for loop is also similar to that of the while loop. The only difference\
    \ between the two is in the syntax. The syntax of the for loop includes an initializer,\
    \ condition, and a loop expression. The initializer initializes a variable, the\
    \ loop expression increments or decrements the value of the variable, and condition\
    \ refers to a condition specified in the for loop. A for loop repeatedly executes\
    \ the statement(s) enclosed within it until the specified condition evaluates\
    \ to false. You can use the for loop when you know how many time you want to execute\
    \ a statement or a block of statements. The syntax of the for loop is as follows:\n\
    \n```\n```\nfor ( initializer; condition; loop expression)\n{\n...\n...    //statements\n\
    }\n```\n```\n\nIn the preceding syntax, initializer is the starting value of a\
    \ variable, condition is the expression that is checked before the execution of\
    \ a loop, and loop expression either increments or decrements the loop counter.\n\
    \nNow, let's create a console application named ForLoop to demonstrate the use\
    \ of the for loop. Perform the following steps to create the ForLoop application:\n\
    \n+   1. Repeat steps 1 to 3 as discussed earlier while creating the If Example\
    \ application in the The if Statement section of this chapter.\n+   2. Enter ForLoop\
    \ in the Name text box to specify the name of the application, and specify an\
    \ appropriate location for the application in the Location combo box. In this\
    \ case, we have selected the default location, which is C:\\users\\temp\\documents\\\
