- pgno: 99
  md: "Now, let's first learn about the types of exceptions in C#.\n\n# Describing\
    \ Types of Exceptions\n\nAs mentioned earlier, an exception can be thought of\
    \ as a runtime anomaly, error condition, or some unexpected behavior of a program\
    \ that is encountered during its execution. Exceptions usually arise due to some\
    \ fault in the source code or because of an attempt to access an unavailable resource,\
    \ such as a file that has been removed from the memory. You can handle exceptions\
    \ by using the exception handling mechanism. This mechanism helps you to detect\
    \ and handle errors that occur at run time. Though the exception handling mechanism\
    \ does not guarantee that the code you develop will be completely bug-free, yet\
    \ upto certain extent, it helps to build applications that do not behave unexpectedly\
    \ during execution.\n\nAll exceptions in the .NET Framework are derived from the\
    \ Exception class. In C#, exceptions are usually of the following two types:\n\
    \n+   - System-Defined Exceptions\n+   - User-Defined Exceptions\n\nLet's now\
    \ discuss these two types of exceptions one by one.\n\n# System-Defined Exceptions\n\
    \nThe exceptions defined by the .NET Framework Base Class Library (BCL) are often\
    \ referred to as system-defined exceptions. The system-defined exceptions are\
    \ also known as predefined exceptions and are represented by their respective\
    \ exception classes. Some of the most common exception classes defined in the\
    \ .NET Framework BCL are as follows:\n\n+   - System.ArithmeticException\n+  \
    \ - System.ArrayTypeMismatchException\n+   - System.DivideByZeroException\n+ \
    \  - System.IndexOutOfRangeException\n+   - System.NullReferenceException\n+ \
    \  - System.OutOfMemoryException\n+   - System.OverflowException\n+   - System.StackOverflowException\n\
    +   - System.TypeInitializationException\n+   - System.InvalidCastException\n\n\
    All the predefined exception classes ultimately inherit from the System.Exception\
    \ base class.\n\n# User-Defined Exceptions\n\nIn C#, you can also create your\
    \ own exceptions, which are known as user-defined exceptions. These exceptions\
    \ are also sometimes referred to as custom exceptions. As mentioned before, all\
    \ the pre-defined exceptions are handled by the classes that derive from the System.Exception\
    \ class. However to define user-defined exceptions you must create classes that\
    \ derive from the System.ApplicationException class. The syntax to create a user-defined\
    \ exception is as follows:\n\n```\nclass MyUserDefinedException : ApplicationException\n\
    {\n    //some code to handle the exception\n}\n```\n\nYou can define a user-defined\
    \ exception in the Program.cs file as follows:\n\n```\npublic class StudentDataNotFoundException\
    \ : ApplicationException\n{\n    public StudentDataNotFoundException (string exMessage)\
    \ : base (exMessage)\n    {\n```"
