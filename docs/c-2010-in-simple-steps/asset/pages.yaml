- pgno: 64
  md: '# Note


    Extending the functionalities and behavior of a class in another class is called
    Inheritance.


    +   - **Delegate:** Refers to the objects that store references of the methods
    whose signatures match with the signature of the delegate. Delegates are the reference
    types that encapsulate a method with a specific signature.

    +   - **Array:** Refers to an ordered arrangement of data elements. It is a data
    structure that contains a number of variables of the same data type at contiguous
    locations of the memory.


    Now, let''s learn about pointer types in C# 2010.


    # Pointer Types


    To maintain type safety and security in the context of references, C# uses delegates
    and does not support pointers. However, you can use the unsafe keyword to define
    an unsafe context where you can use pointers. In other words, pointer types are
    used only in the unsafe context. Pointer types are not inherited from the Object
    base class, which is the base class of all .NET types. You cannot convert pointer
    types to Object types and vice-versa. A pointer variable is used to store the
    address of another variable. The following syntax displays the declaration of
    pointer type:


    ```

    datatype* identifier;

    ```


    You have learned about data types in C#, further you learn about variables and
    constants.


    # Working with Variables and Constants


    A variable is an identifier that denotes a storage location in memory. Using the
    name of a variable in a program you can refer to the information stored at a particular
    location. Unlike, the constants that remain unchanged during the execution of
    a program, a value of a variable can be changed any time. Every variable has a
    type that determines the values to be stored in it.


    You can give any name to a variable but it should be meaningful because it makes
    the code more readable.


    Some examples of meaningful variable names are salary, height, name, age, and
    total_marks.


    Following are certain rules for naming C# variables:


    +   - The name of the variable may consist of letters, and the underscore character
    (_).

    +   - The name of the variable must not begin with a digit.

    +   - The variable names using the uppercase and lowercase characters are distinct;
    for example, salary and SALARY are two different variables.

    +   - The variable name should not be a keyword.

    +   - The variable name should not contain spaces.


    Table 2.3 shows the examples of valid and invalid variable names:


    Table 2.3: Some Examples of Valid and Invalid C# Variable Names


    | Variable Name | Status |

    |---|---|

    | salary | Legal |

    | Total_amount | Legal |

    | yearly_cost | Legal |

    | _2010_tax | Legal, but not advised |

    | Total#amount | illegal; contains the illegal character # |

    | double | illegal; double is a keyword |

    | 9number | illegal; first character is a digit |'
