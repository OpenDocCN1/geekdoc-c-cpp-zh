  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_49_0.png)


    Next, let''s learn how to create, save, and run a simple Web application by using
    Visual Studio 2010.


    # Creating, Saving, and Running a Web Application


    ASP.NET is an essential part of the .NET Framework and includes all the services
    required to develop Web applications that involve minimal coding. The different
    types of ASP.NET applications that can be built in Visual Studio 2010 include
    Web sites, Web applications, Web services, and AJAX-enabled applications.


    Let''s learn to create a simple Web application by using Visual Studio 2010. Let''s
    suppose that the Web application we create accepts some text as an input in a
    text box and displays it on a label after a user clicks a button.


    Perform the following steps to create a Web application:


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010. Start Page of the Microsoft Visual Studio 2010 IDE opens.

    +   2. Click the New Project link to create a new Web application. The New Project
    dialog box appears (Fig.C#-1.59).

    +   3. Select Visual C#→Web in the Installed Templates pane of the New Project
    dialog box (Fig.C#-1.59).

    +   4. Select ASP.NET Empty Web Application from the middle pane of the New Project
    dialog box (Fig.C#-1.59).

    +   5. Enter a name for the Web application in the Name text box. In our case,
    we have named our Web application MyFirstWebApplication (Fig.C#-1.59).

    +   6. Enter a location to save the Web application in the Location combo box.
    In our case, we have selected the default location, which is c:\users\anamika\documents\visual
    studio 2010\Projects (Fig.C#-1.59).

    +   7. Click the OK button, as shown in Fig.C#-1.59:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_49_1.png)'
