    Let''s learn to declare constants.


    # Declaring Constants


    As discussed earlier, constants are fixed values that cannot be changed during
    the execution of a program.


    Following is the syntax to declare a constant:


    ```

    const datatype constantname = value;

    ```


    You must declare and then initialize a constant, as shown in the following code
    snippet to avoid an error:


    ```

    const float PI = 3.14;

    const int count = 4;

    ```


    The values assigned to constants cannot be changed during the execution of a program.
    A constant can also be initialized using an expression, as shown in the following
    code snippet:


    ```

    const int length = 10;

    const int breadth = length * 2;

    ```


    Moreover, you cannot use a non-constant value in an expression, which is used
    by a constant, as shown in the following code snippet:


    ```

    int length = 10;

    const int breadth = length * 2;

    // This is illegal statement because it is using a non-constant value

    ```


    Let''s learn to declare Nullable type variables.


    # Declaring Nullable Type Variables


    Nullable types are the instances of System.Nullable<T> struct. Nullable structs
    use predefined value types with a Boolean null indicator. The predefined value
    type is also called the underlying type. A Boolean variable of a nullable type
    can be assigned true, false, or null value. You can create nullable types using
    the ? type modifier.


    The syntax to declare a nullable type is as follows:


    ```

    System.Nullable<T> variable or T? variable

    ```


    In the preceding syntax, T is the underlying value type of the nullable type.
    T can be of any value type, such as int, float, or struct. However, it cannot
    be a reference type. For instance, int? is the nullable type for the type, int.
    In this example, int is the underlying type and ? is the Boolean null indicator.
    Similarly, float? is the nullable type for the value type, float. You cannot create
    nullable type on reference types as they already support null values.


    You have learned to declare and assign values to variables and constants, let''s
    learn operators and operator precedence in the following section.


    # Working with Operators and Operator Precedence


    In C#, we can use the value stored inside the variables and constants in the form
    of an expression. An expression is nothing but a set of language elements, arranged
    together to perform a specific task or computation. To write expressions, C# 2010
    provides a complete set of language elements, such as variables, constants, operators,
    properties, and literals. A typical example of an expression is shown in the following
    code snippet:


    ```

    int total= 2 + 3;

    ```


    In the preceding code snippet, expression comprises of an integer variable, total,
    an assignment operator =, integer values 2 and 3, and the addition operator, +.
    The evaluation of the expression yields the result, 5, which is then assigned
    to the integer variable total.


    Operators are nothing but special symbols that are used to specify some computation
    or other operations, such as arithmetic and logical operations on the operands.
    Therefore, operators specify the operations to be performed in the expression.
    The operators in C# 2010 fall under several categories, such as primary, unary,
    multiplicative, additive, shift, relational and type testing, equality, logical
    AND, logical XOR, logical OR, conditional AND, conditional OR, null-coalescing,
    conditional, assignment operators, and lambda expression. Table 2.4 lists different
    categories and the operators that fall within those categories:'
