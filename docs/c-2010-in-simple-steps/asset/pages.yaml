- pgno: 305
  md: 'using an anonymous method is that it reduces the amount of code that you need
    to write. When you are using an anonymous method, you do not need to define any
    static event handler. The anonymous method is defined at the time the caller is
    handling an event.


    Following are the few points that should always be kept in mind while using an
    anonymous method:


    +   - Do not use the jump statements, such as, break, goto, or continue inside
    an anonymous method having a target outside that anonymous method, as it generates
    an error.

    +   - You should also not use an unsafe code inside an anonymous method.

    +   - If you need to write the same functionality more than once, you should not
    use an anonymous method.


    Anonymous methods were introduced in C# 2.0, which offers a new syntax for anonymous
    methods called lambda expression. Instead of passing anonymous methods, you can
    use lambda expression in Language-Integrated Query (LINQ).


    # Note


    You learn about LINQ in Chapter 10, Introduction to Language-Integrated Query.


