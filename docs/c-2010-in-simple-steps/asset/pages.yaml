    # Implementing Conditions in Workflows


    Similar to a Visual C# program, you can also implement conditions in workflow
    that you create with WF. Activities, such as **If** and **While**, can be used
    to implement a condition in a workflow application. You can implement a simple
    condition by using one of the following ways:


    +   - **By creating a rule condition:** Creates conditions either directly in
    code or using a tool, called the **Rule Condition Editor**. Rule conditions are
    stored in a separate Extensible Markup Language (XML) file. When a rule condition
    is encountered in a workflow, the expression in a condition is evaluated and a
    **Boolean** value is returned.

    +   - **By creating a code condition:** Refers to directly defining a condition
    in code. A code condition can be created by writing a method in the code. The
    method contains code for the condition and returns a **Boolean** value. Now, when
    the workflow is executed and the condition is encountered, the method that contains
    code for the condition is called. In this process, the value returned by the method
    is used as the result for the code condition.


    Let''s learn to implement conditions in a workflow application by performing the
    following steps:


    +   1. Create a new **Workflow Console Application** with the name **ImplementingConditions**.

