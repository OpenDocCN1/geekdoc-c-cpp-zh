    You are now familiar with the data binding process in Windows Forms applications.
    Next, let''s learn how to bind data in WPF applications.


    # Data Binding in WPF


    As you know, WPF makes it easy to design robust and visually appealing user interfaces.
    You can also perform data binding in WPF applications to present and interact
    with data in a simple and consistent way. In WPF, you can perform data binding
    by using the Extensible Application Markup Language (XAML) file or the code-behind
    file. You can bind WPF controls and their properties to make data binding flexible
    and easy. For more information on WPF, refer to Chapter 7, Introducing Windows
    Presentation Foundation and XAML.


    As in other applications, such as the Windows Forms and ASP.NET Web applications,
    WPF also needs to have a target and a source to perform data binding. You can
    select a public property of a control in WPF to bind your data. This may include
    properties of other controls, or data from a data source, such as the NORTHWND
    database. The target of the binding can be accessible to a public property of
    the control, for example, the Text property of the TextBox control. In short,
    you can say that data binding is one of the most powerful features included in
    WPF.


    Before you learn how to perform data binding in WPF applications, let''s learn
    about the direction of data flow in WPF applications.


    # Data Flow Directions


    WPF data binding supports different types of binding modes between a target and
    a source. The data in a binding can move from the target to the source or vice
    versa. For example, when a user edits the contents of a TextBox control and its
    Text property changes, the data flows from a target to a source. Similarly, the
    data flows from a source to a target when the Text property of a TextBox control
    bound to a data source changes due to the changes made to that data source. You
    should specify the mode of data binding while binding data in a WPF application.
    The Mode property defines the binding mode that determines how data flows between
    a source and a target. There are four types of binding modes available in WPF:
    OneTime data binding, OneWay data binding, TwoWay data binding, and OneWayToSource
    data binding. Let''s learn about these modes in detail in the following sections.


    # OneTime Data Binding


    In OneTime data binding in WPF, the data flows from the source to the target.
    The binding occurs only once when the application is started or the data context
    changes. The best time to use OneTime data binding is when your data source does
    not implement the INotifyPropertyChanged interface. In other words, when you do
    not have to change the data or add any other data to your database, you can use
    OneTime data binding in your application. OneTime data binding can only retrieve
    data but cannot update data in the database.


    # OneWay Data Binding


    In OneWay data binding in WPF, the data flows from the source to the target. This
    type of binding is useful for read-only data as it is not possible to change the
    data from the user interface. The OneWay binding mode in WPF is the default binding
    mode.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# TwoWay Data Binding


    The data in TwoWay data binding in WPF moves in both directions, that is, from
    the source to the target and from the target to the source. In TwoWay data binding,
    you can make changes to the data in the user interface. In this binding, the data
    is sent to the target, and if there is any change in the target property value,
    the data is sent back to the source. You can use TwoWay binding when you want
    to change the data in the user interface, which is reflected in the data source.


    # OneWayToSource Data Binding


    In OneWayToSource data binding, if the target property changes, the source property
    is updated automatically. You can use OneWayToSource binding when you want to
    change data and get it updated in the source.


    # Declaration of Data Binding in WPF


    You can declare binding in WPF in different ways and formats. You can create binding
    in the XAML format, which is the markup file of a WPF application. You can also
    create binding through code in the code-behind file of a WPF application. The
    third way to create binding in WPF is to specify the Path property. You can specify
    the source value that you want to bind by using the Path property. Let’s now learn
    to perform data binding in a WPF application in these three ways.


    # Using XAML


    You can bind a WPF application in the XAML format by specifying the Binding property
    as a markup extension. When you use the Binding property as an extension to declare
    binding, the declaration consists of a series of clauses. The clauses are in the
    Name = Value pair, where Name is the name of the Binding property and Value is
    the value you set for the property. You should note that when you create binding
    in the XAML format, the Binding property must be attached to the specific dependency
    property of the target object. The syntax to use the Binding property in the XAML
    format is as follows:


    <TextBox Text="{Binding Source={StaticResource myDataSource}, Path=ContactName}">


    In the preceding syntax, the Text property of the TextBox control is using the
    Binding property. Data binding in WPF provides you a simple and consistent way
    for the applications to present and interact with data. In WPF, you establish
    a binding by using the Binding property. Each binding in WPF has four components:
    binding target, binding source, target property, and a path to the source value
    to use.


    Now, let’s create a WPF browser application to perform data binding by using XAML:


    +   1. Create a WPF browser application named WPFDataBinding.

    +   2. Set the title of the MainWindow window to Binding using XAML by using the
    Title property.

    +   3. Add the highlighted code given in Listing 8.6 to the MainWindow.xaml file:


    # Listing 8.6: Creating Data Binding by using XAML:


    ```

    <Window x:Class="WPFDataBinding.MainWindow"

    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"

    Title="Binding using XAML" Height="231" Width="325">

    <Grid>

    <TextBlock Margin="10,10,10,121" FontWeight="Bold">

    Pick a color from below list

    </TextBlock>

    <ListBox Name="mListBox" Height="100" Width="100"

    Margin="28,46,0,0" HorizontalAlignment="Left" VerticalAlignment="Top">

    <ListBoxItem>Orange</ListBoxItem>

    <ListBoxItem>Green</ListBoxItem>

    <ListBoxItem>Blue</ListBoxItem>

    <ListBoxItem>Grays</ListBoxItem>

    <ListBoxItem>LightGray</ListBoxItem>

    <ListBoxItem>Red</ListBoxItem>

    </ListBox>

    </Grid>

    </Window>

    ```'
