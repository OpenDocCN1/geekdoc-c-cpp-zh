- pgno: 366
  md: "4 Enter a name as WCFService for the WCF Service application and select the\
    \ desired location in the Location combo box to save the application.\n\n5 Click\
    \ the OK button to create the WCFService WCF Service.\n\nThe default files of\
    \ the WCF Service appear in Solution Explorer, as shown in Fig.Cr-13.14:\n\n![](img/2db4b8b2cb67e7ccc52477a61fe289ab_366_0.png)\n\
    \n# Fig.Cr-13.14\n\nYou can build a WCF Service by performing two steps; first,\
    \ you need to create a service contract. Secondly, you need to create a data contract.\
    \ A service contract specifies the rules for interfaces along with their corresponding\
    \ messages and a data contract specifies the rules for the data that is exchanged\
    \ through input and output operation.\n\n6 Add the highlighted code shown in Listing\
    \ 13.3 in the IService1.cs file of the WCFService service:\n\n# Listing 13.3:\
    \ Showing the Code for the IService1.cs File\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Runtime.Serialization;\nusing System.ServiceModel;\n\
    using System.ServiceModel.Web;\nusing System.Text;\n\nnamespace WCFService\n{\n\
    \    // NOTE: You can use the \"Rename\" command on the \"Refactor\" menu to change\
    \ the interface\n    //name \"IService1\" in both code and config file together.\n\
    \    [ServiceContract]\n    public interface IService1\n    {\n        [OperationContract]\n\
    \        string GetData(string value);\n\n        [OperationContract]\n      \
    \  string GetDataUsingDataContract(UserInfo users);\n\n        // TODO: Add your\
    \ service operations here\n    }\n\n    // Use a data contract as illustrated\
    \ in the sample below to add composite types to service\n    //operations.\n \
    \   [DataContract]\n    public class UserInfo\n```"
  merge: -1
  img_proc: true
- pgno: 367
  md: "```\n```csharp\n{\n    string fName;\n    string lName;\n\n    [DataMember]\n\
    \    public string FirstName\n    {\n        get { return fName; }\n        set\
    \ { fName = value; }\n    }\n\n    [DataMember]\n    public string LastName\n\
    \    {\n        get { return lName; }\n        set { lName = value; }\n    }\n\
    }\n```\n```\n\nIn Listing 13.3, the IService1 interface is labeled with the [ServiceContract]\
    \ attribute and explicitly marks the IService1 interface to carry contract metadata\
    \ for WCF. The methods within the IService1 interface labeled with the [OperationContract]\
    \ attribute are marked as public methods in WCF. A data contract is defined for\
    \ the UserInfo class and its members by using the [DataContract] attribute and\
    \ the [DataMember] attribute respectively. Service contracts define the behavior\
    \ of a service whereas data contracts define the information that flows across\
    \ service boundaries and are handled with additional logic on the provider and\
    \ consumer side.\n\n7 Add the highlighted code given in Listing 13.4 in the Service1.svc.cs\
    \ file of the WCFService service:\n\n# Listing 13.4: Showing the Code for the\
    \ Service1.svc.cs File\n\n```\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Runtime.Serialization;\nusing System.ServiceModel;\n\
    using System.ServiceModel.Web;\nusing System.Text;\n\nnamespace WCFService\n{\n\
    \    // NOTE: You can use the \"Rename\" command on the \"Refactor\" menu to change\
    \ the\n    // class name in code, svc and config file together.\n    public class\
    \ Service1 : IService1\n    {\n        public string GetData(string MyValue)\n\
    \        {\n            return \"Hello: \" + MyValue;\n        }\n\n        public\
    \ string GetDatausingDataContract(UserInfo dcValue)\n        {\n            return\
    \ \"Hello: \" + dcValue.FirstName + \" \" + dcValue.LastName;\n        }\n   \
    \ }\n}\n```\n```\n\n8 Press the F5 key to execute the WCFService service. A WCF\
    \ Test Client window appears, as shown in Fig.C#13.15:"
  merge: -1
  img_proc: true
