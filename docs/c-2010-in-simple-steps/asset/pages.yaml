  md: 'Now, before we show you how to install Visual Studio 2010 on your computer,
    let''s first briefly describe the different editions of Visual Studio 2010.


    # Editions of Visual Studio 2010


    There are different editions of Visual Studio 2010 available in the market. Each
    edition has its own set of features to cater to different users. The following
    is a brief description of the different editions of Visual Studio 2010:


    +   - **Visual Studio 2010 Ultimate edition:** Provides an integrated environment
    of tools and infrastructure for the server, which helps to simplify the entire
    application development process. This edition of Visual Studio 2010 helps produce
    meaningful business results by using productive, predictable, and customizable
    processes. It lets you targeting more platforms and technologies, such as cloud
    and parallel computing.

    +   - **Visual Studio 2010 Premium edition:** Offers an environment that simplifies
    application development. This edition contains advanced tools to solve the most
    difficult problems. The advanced code analysis, testing, and debugging tools help
    individuals and teams to develop high-end applications in which there is a minimal
    chance of creating bugs.

    +   - **Visual Studio 2010 Professional edition:** Simplifies the basic tasks
    of creating, debugging, and deploying applications. It enhances creativity with
    powerful design surfaces. This edition targets several platforms, such as Silverlight,
    SharePoint, and Cloud applications. The integrated support in Visual Studio for
    Test Driven Development (TDD) and new debugging tools ensures high quality solutions.


    Now let''s learn to install Visual Studio 2010 on your computer.


