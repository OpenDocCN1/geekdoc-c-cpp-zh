    # Using the MenuStrip Control


    While working with the Visual Studio 2010 IDE, you must have several times used
    the menu bar and its various menus. You can also design a menu bar for your own
    Windows Forms application to logically group certain actions and options that
    users can perform and select, respectively. You can add a menu bar to your Windows
    Forms application by using the MenuStrip control.


    The MenuStrip control acts as a container for a single menu bar on a Windows form.
    The menu bar contains several menus that have logically grouped menu items. The
    menu items grouped under a menu bar represent options that a user can select.
    The menu items can further have submenus, which is another menu with a different
    set of options.


    The MenuStrip control is an instance of the MenuStrip class, which exists in the
    System.Windows.Forms namespace.


    Table 6.8 lists noteworthy properties of the MenuStrip class:


    Table 6.8: Noteworthy Properties of the MenuStrip Class


    | Property | Description |

    |---|---|

    | CanOverflow | Retrieves or sets a value that indicates whether the MenuStrip
    control supports overflow functionality. |

    | GripStyle | Retrieves or sets the visibility of the grip of the MenuStrip control.
    The GripStyle property is used to reposition the MenuStrip control. For instance,
    if the GripStyle property of a MenuStrip control is set to Hidden, then a user
    cannot reposition the MenuStrip control. |

    | ShowItemToolTips | Retrieves or sets a value that indicates whether ToolTips
    appear for the MenuStrip control |

    | Stretch | Retrieves or sets a value that indicates whether the MenuStrip control
    stretches from end to end in its container |


    Table 6.9 lists noteworthy events of the MenuStrip class:


    Table 6.9: Noteworthy Events of the MenuStrip Class


    | Events | Description |

    |---|---|

    | MenuActivate | Occurs when a user accesses or opens a menu from the menu bar
    using either a mouse or keyboard |

    | MenuDeactivate | Occurs when the MenuStrip control is deactivated |


    Note that the MenuStrip control is only a container for the menus. The menus and
    menu items are mostly represented by the ToolStripMenuItem objects, which are
    instances of the ToolStripMenuItem class. This class'
  merge: -1
  img_proc: true
- pgno: 194
  md: "allows you to perform various operations with the menu items and submenus,\
    \ such as adding menu items to menus and submenus, adding menu separators (a horizontal\
    \ line that separates two or more menus), specifying shortcut keys for menus and\
    \ menu items, and displaying check marks.\n\nTable 6.10 lists noteworthy properties\
    \ of the ToolStripMenuItem class:\n\n**Table 6.10: Noteworthy Properties of the\
    \ ToolStripMenuItem Class**\n\n| Property | Description |\n|---|---|\n| Checked\
    \ | Retrieves or sets a value that indicates whether the ToolStripMenuItem object\
    \ is checked |\n| CheckOnClick | Retrieves or sets a value specifying whether\
    \ the ToolStripMenuItem object automatically appears checked or unchecked when\
    \ clicked |\n| CheckState | Retrieves or sets a value that indicates whether the\
    \ ToolStripMenuItem object is in the checked, unchecked, or indeterminate state\
    \ |\n| Enabled | Retrieves or sets a value that indicates whether a child menu\
    \ item in a menu is enabled |\n| ShortcutKeys | Retrieves or sets the shortcut\
    \ keys associated with the ToolStripMenuItem object |\n| ShowShortcutKeys | Retrieves\
    \ or sets a value that indicates whether the shortcut keys associated with the\
    \ ToolStripMenuItem object are displayed next to it |\n\nTable 6.11 lists noteworthy\
    \ events of the ToolStripMenuItem class:\n\n**Table 6.11: Noteworthy Events of\
    \ the ToolStripMenuItem Class**\n\n| Event | Description |\n|---|---|\n| CheckedChanged\
    \ | Occurs when the Checked property changes |\n| CheckStateChanged | Occurs when\
    \ the CheckState property changes |\n\nTo create submenus, you can add multiple\
    \ ToolStripMenuItem objects to an existing ToolStripMenuItem object.\n\n> **Tip**\n\
    > \n> *There are various menu conventions in Windows that you should adhere to\
    \ if you are going to release your programs for public use. These menu conventions\
    \ are as follows:*\n> \n> - If a menu item opens a dialog box, you should add\
    \ an ellipsis (...) after its name (such as Print...).\n> - There are many standard\
    \ shortcuts already in use, such as CTRL+S for Save, CTRL+X for Cut, CTRL+V for\
    \ Paste, and CTRL+C for Copy. Therefore, do not assign any different shortcuts\
    \ for these functions.\n> - There are certain menus in the menu bar that do not\
    \ open a menu but instead perform some action immediately. Therefore, similar\
    \ immediate actions should have an exclamation mark (!) after their names (such\
    \ as Connect!).\n> - The File menu should always be the first menu and an Exit\
    \ item, the last item of the menu.\n\nNow, let's create a Windows Forms application\
    \ named MenuStripDemo, where we use some of the properties and events of the ToolStripMenuItem\
    \ class. Perform the following steps to create the MenuStripDemo application:\n\
    \n+   1. Repeat steps 1-4 under the Using the ToolStrip Control heading of this\
    \ chapter.\n+   2. Enter MenuStripDemo as the name of the application in the Name\
    \ text box of the New Project dialog box and enter the path of the folder where\
    \ you want to save the application in the Location combo box. In our case, we\
    \ have selected the default location, which is C:\\Users\\temp\\Documents\\Visual\
    \ Studio 2010\\Projects.\n+   3. Click the OK button in the New Project dialog\
    \ box. The MenuStripDemo application is created."
  merge: -1
  img_proc: true
