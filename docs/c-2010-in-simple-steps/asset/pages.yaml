  md: "# Single-Line Comments\n\nSingle-line comments are those comments that are\
    \ preceded by double forward slash and can be inserted anywhere in the program\
    \ as per your desire. The following code snippet shows an example of a single-line\
    \ comment:\n\n```\n```csharp\nstring str;    //a string variable is declared\n\
    ```\n```\n\nWhen you run the code, the compiler ignores the text written after\
    \ the // symbol.\n\n# Multi-Line Comments\n\nThere may be some situations where\
    \ your comments might span across multiple lines. Though you can put a double\
    \ forward slash and start writing the comments on each line; however, this way\
    \ your code will end up looking untidy. Therefore, you can use multi-line comments\
    \ when you want the compiler to ignore multiple lines in a single instance. Similar\
    \ to the single-line comments, multi-line comments can also be inserted anywhere\
    \ in a C# program.\n\n```\n```csharp\n/*    This is an example of using comments\n\
    \      in C# code. You can use comments\n      for better understandability.\n\
    */\n```\n```\n\nIn a multi-line comment, the compiler ignores the text written\
    \ between the symbols /* and */.\n\n# Note\n\nYou can comment an entire block\
    \ of code by using the Ctrl+K, Ctrl+C keys in combination. To uncomment a selected\
    \ piece of text, you can press the Ctrl+K or Ctrl+U keys in combination.\n\nWith\
    \ this, we come to the end of the chapter. Let's now summarize the main topics\
    \ of the chapter.\n\n# Summary\n\nIn this chapter, you have learned about:\n\n\
    +   - Different types of statements used in C#\n+   - Selection statements that\
    \ change the flow of the program based on certain conditions\n+   - Iteration\
    \ statements or loops that help to execute a C# code for a given number of times\n\
    +   - Jump statements that allow to move the program control from one point to\
    \ another at any particular instance during the execution of the program\n+  \
    \ - Exceptions, their types, and how to handle them\n+   - Different types of\
    \ comments"
