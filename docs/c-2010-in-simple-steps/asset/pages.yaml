    # Using the Button Control


    The Button control is one of the most basic Windows Forms controls. Every Windows
    Forms application has at least one Button control associated with it. The Button
    control allows you to generate the Click event. A user can perform some action
    at the runtime by handling the Click event of the Button control.


    Let''s perform the following steps to use the Button control in a Windows Forms
    application:


    +   1. Repeat steps 1 to 3 of the Changing the Title of a Form section of this
    chapter.

    +   2. Enter WindowsControls in the Name text box and specify an appropriate location
    in the Location combo box.

    +   3. Click the OK button. The WindowsControls application is created with the
    specified name and location.

    +   4. Drag a Button control from Toolbox and drop it on the Form1 form.

    +   5. Set the Text property of the Button control to Click in the Properties
    window, as shown in Fig.C#5.28:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_166_0.png)


    Fig.C#5.28


    In Fig.C#5.28, the text of the Button control changes to Click.


    # Using the Label Control


    The Label control is a control that is used to display text. You can use it for
    displaying static text that you do not want to be edited by a user. It can also
    be used to display dynamic text (text that changes after the occurrence of'
  merge: -1
  img_proc: true
