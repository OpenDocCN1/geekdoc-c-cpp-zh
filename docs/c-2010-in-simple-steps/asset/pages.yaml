    \ is created.\n+   4. Add the highlighted code given in Listing 3.5 in the Program.cs\
    \ file:\n\nListing 3.5: Using the while Loop\n\n```\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nnamespace\
    \ WhileLoop\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            Console.WriteLine(\"Loop 1:\");\n            int i = 0;\n\
    \            while (i < 5)\n            {\n                Console.WriteLine(\"\
    I = {0}\", i);\n                i++;\n            }\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n```\n\nIn Listing 3.5, the while loop is used to execute\
    \ the code inside it repeatedly till the specified condition, that is, i<5 evaluates\
    \ to true. The condition in the while loop is checked before the while loop is\
    \ executed. If the condition evaluates to true, the statements inside the while\
