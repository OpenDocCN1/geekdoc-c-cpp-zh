  md: '# Using the TextBlock Control


    The TextBlock control in WPF allows you to work with text in a flexible manner
    as compared to the Label control. The appearance of the text that a TextBlock
    control contains can be easily manipulated by using several properties.


    The TextBlock control is an instance of the TextBlock class, which offers various
    properties. Some noteworthy properties of the TextBlock class are listed in Table
    7.6:


    **Table 7.6: Noteworthy Properties of the TextBlock Class**


    | Property | Description |

    |---|---|

    | FontFamily | Retrieves or sets the font family for the text in a TextBlock control
    |

    | FontSize | Retrieves or sets the font size for the text in a TextBlock control
    |

    | FontStyle | Retrieves or sets the font style for the text in a TextBlock control
    |

    | FontWeight | Retrieves or sets the font weight for the text in a TextBlock control
    |

    | Text | Retrieves or sets the text of a TextBlock control |

    | TextAlignment | Retrieves or sets a value that indicates the horizontal alignment
    of the text in a TextBlock control |

    | TextTrimming | Retrieves or sets a value that indicates how text is trimmed
    when it overflows the content area of a TextBlock control |

    | TextWrapping | Retrieves or sets a value that indicates how a TextBlock control
    should wrap the text within the control |


    Now, let''s create a standalone WPF application named TextBlockDemo to show the
    use of the TextBlock control. For this, perform the following steps:


    +   1. Repeat steps 1 to 3 as followed earlier while creating the GridDemo application
    in the Using the Grid Control section in this chapter.

    +   2. Enter the name TextBlockDemo in the Name text box and specify an appropriate
    location for the application in the Location combo box.

    +   3. Click the OK button. The TextBlockDemo application is created.


    4. Add the highlighted code given in Listing 7.8, in the MainWindow.xaml file:


    # Listing 7.8: Displaying Text by Using the TextBlock Control


    ```

    ```xml

    <Window x:Class="TextBlockDemo.MainWindow"

    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"

    Title="Demo-TextBlock" Height="300" Width="300">

    <Grid>

    <TextBlock Name="textBlock1" Height="150" Width="221" Text="WPF offers several
    features and functionalities to develop high-end desktop applications." Foreground="White"
    Background="Black" FontSize="17" FontWeight="Bold" TextWrapping="Wrap" TextAlignment="Center"
    />

    </Grid>

    </Window>

    ```

    ```


    In Listing 7.8, you can see that a TextBlock control is added to a Grid control.
    The Text property of the TextBlock control contains the text to be displayed on
    the control. The Foreground and Background properties of the control are set to
    White and Black respectively, which implies that the text in the TextBlock control
    appears in white, while the background appears black. The FontSize and FontWeight
    properties of the control are set to 17 and Bold, respectively so that the text
    appears large. In addition, the TextWrapping and TextAlignment properties are
    set to Wrap and Center, respectively. This implies that the text (if it spans
    multiple lines) is wrapped around the control and is displayed in the center of
    the control.


    5. Press the F5 key to run the TextBlockDemo application. The output appears,
    as shown in Fig.C7.25:'
