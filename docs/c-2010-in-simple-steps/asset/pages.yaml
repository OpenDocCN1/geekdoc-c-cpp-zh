- pgno: 318
  md: "# The Element Operators\n\nThe element operators return just one element from\
    \ a data source. The element operators in LINQ include the ElementAt(), ElementAtOrDefault(),\
    \ First(), FirstOrDefault(), Last(), LastOrDefault(), Single(), and SingleOrDefault()\
    \ methods.\n\nThe ElementAt() method returns an element at a specified index in\
    \ a collection. The ElementAtOrDefault() method returns an element at a specified\
    \ index in a collection or the default value if the index is out of range. The\
    \ First() method returns the first element of a collection or the first element\
    \ that satisfies a given condition. It returns a default value if there is no\
    \ such element in a collection. In addition, the First() method raises the InvalidOperationException\
    \ exception when there is no element in a sequence that satisfies some specified\
    \ condition. The FirstOrDefault() method returns the first element of a collection\
    \ or the first element that satisfies a given condition. It returns a default\
    \ value and unlike the First() method does not throw an exception if there is\
    \ no such element in a collection.\n\nThe Last() method returns the last element\
    \ of the collection or the last element that satisfies a given condition. The\
    \ LastOrDefault() method returns the last element of a collection or the last\
    \ element that satisfies a given condition. It returns a default value if there\
    \ is no matching element. The Single() method returns the only element of a collection\
    \ that satisfies a given condition. The SingleOrDefault() method returns the only\
    \ element of a collection that satisfies a condition or the default value if there\
    \ is no element in the data source.\n\nAn ArgumentNullException exception is thrown\
    \ if any argument is null. An InvalidOperationException exception is thrown if\
    \ no element matches a given condition or if the source sequence is empty.\n\n\
    # The Concatenation Operator\n\nSometimes, you may need to merge two or more sequences\
    \ into a single sequence. In such cases, you can use the Concat operator. The\
    \ Concat() method is the concatenation operator in LINQ. This method concatenates\
    \ two sequences and uses deferred execution.\n\n> Deferred execution of a query\
    \ in LINQ means the query is not executed when it is defined; instead, it is evaluated\
    \ during the time it is being used.\n\nNow, let’s create a console application\
    \ named ConcatenationOperatorExample, where you use the Concat() method. For this,\
    \ perform the following steps:\n\n+   1. Repeat steps 1 to 3 shown earlier while\
    \ creating the EqualityOperator application in the The Equality Operator section\
    \ of this chapter.\n+   2. Enter ConcatenationOperatorExample in the Name text\
    \ box to specify the name of the application, and specify an appropriate location\
    \ for the application in the Location combo box.\n+   3. Click the OK button.\
    \ The ConcatenationOperatorExample application is created.\n+   4. Add the code\
    \ given in Listing 10.9 in the Program.cs file:\n\nListing 10.9: Adding Code in\
    \ the Program.cs File of the ConcatenationOperatorExample Application\n\n```\n\
    ```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\n\nnamespace ConcatenationOperatorExample\n{\n    class Program\n\
    \    {\n        public static void Main(string[] args)\n        {\n          \
    \  string[] city = { \"Jaipur\",\"Panaji\",\"Mumbai\",\"Chandigarh\",\"Shimla\"\
    };\n            string[] state = { \"Rajasthan\",\"Goa\",\"Maharashtra\",\"Haryana\"\
    ,\"Himachal Pradesh\"};\n            var concatPlaces = city.Concat(state);\n\
    \            Console.WriteLine(\"Displaying the result of Concatenation\");\n\
    ```\n```"
