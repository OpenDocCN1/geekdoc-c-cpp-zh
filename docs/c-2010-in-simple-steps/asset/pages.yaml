    +   - **Boolean types (bool)**: Allows you to test a particular condition during
    the execution of a program. Boolean type takes only two values, **True** or **False**.

    +   - **Nullable types**: Allows a user to assign a null value to a variable of
    any data type. The nullable types are often used with databases.


    # Enumeration Types


    An enumeration provides a way for attaching the integer type numbers to the names
    in a program, which in turn increases the readability of a code. Enumerations
    are the user-defined integer data types that are declared using the enum keyword.
    An enumeration makes code easier to maintain by assigning legitimate values to
    it. Moreover, enumeration is the most basic user-defined type, which makes a list
    of possible values for a given type. For instance, you might have a program that
    models a traffic light. Traffic lights have three possible states, the green (or
    go) light, the yellow (or warning) light, and the red (or stop) light; therefore,
    at any given point of time, a traffic light can be red, yellow, or green.


    Now, let''s learn about reference types in C#.


    # Reference Types


    Reference types have varied lengths and are stored on the heap of memory. When
    a value is assigned to a reference type variable, only the reference is copied
    and the actual value remains the same in the memory location. We can further categorize
    the reference types into two parts, pre-defined and user-defined types.


    # Note


    > Heap is a data structure that is used to store reference types, such as objects
    in C#. Objects are stored arbitrarily in the heap and their existence or size
    cannot be determined until the application starts running.


    Let''s discuss pre-defined and user-defined types next.


    # Pre-defined Types


    Pre-defined reference types can be divided into two types:


    +   - **Object type**: Refers to the ultimate base type of all the other pre-defined
    and user-defined data types in C#. You can use the Object type to convert a value
    type on a stack into an Object type to be placed on the heap.

    +   - **String type**: Refers to the creation and manipulation of strings in C#.
    You can perform various operations, such as copy, compare, and concatenation on
    strings.


    # User-defined Types


    User-defined reference types refer to those types, which are defined using the
    pre-defined types. Following are the user-defined reference types:


    +   - **Class**: Specifies that C# is purely an object-oriented language, so the
    base of all the C# programs is class. Using classes, you can group logically related
    data items and functions, which are required to work on data items.

    +   - **Interface**: Refers to the collection of members, such as methods, delegates,
    events, and properties, which are implemented by classes. Interfaces cannot be
    instantiated but you can use them to offer a set of functionalities that is common
    to several classes. The concept of interface was introduced to support multiple
    inheritance because in C#, a class does not support multiple inheritance.'
