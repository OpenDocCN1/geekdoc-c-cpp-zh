    \ the PasswordBox Control\n\nSometimes, you want the users of your application\
    \ to enter confidential information, such as passwords. You can use a TextBox\
    \ control for this purpose. However, while entering the password, another user\
    \ may accidentally see the password, which is an undesirable situation. A better\
    \ alternative would be to use the PasswordBox control to enter passwords. The\
    \ PasswordBox control allows you to obscure or mask the password while you enter\
    \ it in the control. The PasswordBox control is a special type of text box in\
    \ which the individual characters of the input text are masked with a given character\
    \ so that the text appears as a string of that character. By default, any text\
    \ entered in the PasswordBox control appears as a string of solid circles (●).\n\
    \n> Note\n> The PasswordBox control uses a System.Security.SecureString object,\
    \ which ensures that the text entered as a password in the control remains confidential.\n\
    \nThe PasswordBox control is represented by the PasswordBox class, which has various\
    \ properties that allow you to work with the PasswordBox control. Table 7.5 lists\
    \ the noteworthy properties of the PasswordBox class:"
