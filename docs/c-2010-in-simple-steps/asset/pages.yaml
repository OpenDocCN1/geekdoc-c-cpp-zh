    # Using the GridSplitter Control


    The GridSplitter control in WPF offers a unique facility of redistributing the
    space between the cells (rows and columns) of a Grid control. With the GridSplitter
    control, the height and width of the Grid control do not change: only the space
    between the cells of the grid changes.


    The GridSplitter control is an instance of the GridSplitter class, which has various
    properties to allow you to manipulate the spaces between the rows and columns
    of a Grid control. Table 7.8 lists the noteworthy properties of the GridSplitter
    class:


    Table 7.8: Noteworthy Properties of the GridSplitter Class


    | Property | Description |

    |---|---|

    | PreviewStyle | Retrieves or sets the style to customize the appearance, effects,
    or other style characteristics for a GridSplitter control preview indicator that
    is displayed when the ShowsPreview property of the control is set to True |

    | ResizeBehavior | Retrieves or sets which columns or rows are resized relative
    to the column or row for which a GridSplitter control is defined |

    | ResizeDirection | Retrieves or sets a value that indicates whether or not a
    GridSplitter control resizes rows or columns |

    | ShowsPreview | Retrieves or sets a value that indicates whether or not a GridSplitter
    control updates a column or row size as a user drags the control |


    Let''s create a standalone WPF application named GridSplitterDemo to show the
    use of the GridSplitter control. For this, perform the following steps:


    +   1. Repeat steps 1 to 3 as followed earlier while creating the GridDemo application
    in the Using the Grid Control section of this chapter.

    +   2. Enter the name GridSplitterDemo in the Name text box and specify an appropriate
    location for the application in the Location combo box.

    +   3. Click the OK button. The GridSplitterDemo application is created.

    +   4. Add the highlighted code given in Listing 7.10, in the MainWindow.xaml
    file:


    Listing 7.10: Showing the Code to Split a Grid Control by Using a GridSplitter
    Control


    ```

    ```xml

    <Window x:Class="GridSplitterDemo.MainWindow"

    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"

    Title="Demo GridSplitter" Height="300" Width="300">

    <Grid>

    <Grid.RowDefinitions>

    <RowDefinition Height="100"/>

    <RowDefinition Height="15"/>

    <RowDefinition Height="*"/>

    ```

    ```'
