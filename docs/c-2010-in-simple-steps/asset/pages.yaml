  md: 'After the installation is complete, the Installation Complete page appears.


    +   40. Click the Close button to successfully complete the FillColorSetup wizard.

    +   41. Run the newly installed FillColor application from the location where
    you have installed it or by selecting Start→All Programs→FillColor. The output
    appears, as shown in Fig.C#-14.17:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_380_0.png)


    Fig.C#-14.17


    This completes creating and deploying an application by using Windows Installer.
    Let''s learn to deploy an application by using ClickOnce.


    # Deploying Applications Using ClickOnce


    ClickOnce deployment is used to deploy Windows application on the Web server or
    network file share. It provides a simplified installation experience to the end
    user. Using the ClickOnce deployment, you can enable the self-update feature of
    Windows applications that can be installed, updated, and run from a website with
    minimal user interaction. The self-updating feature enables you to download only
    the updated portions of the application. The ClickOnce deployment method deploys
    an application by using the Publish Wizard. The Publish Wizard enables you to
    publish an application to a Web page, a network file share, or a CD. In other
    words, ClickOnce is an easy technique to install Web applications as compared
    to the Windows installer deployment technique. Using ClickOnce you can install
    Windows applications through a simple click. Let''s perform the following steps
    to deploy an application using ClickOnce (in this case, we deploy the FillColor
    application, which we have created in the previous section):


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010.

    +   2. Right-click Microsoft Visual Studio 2010 and select Run as administrator
    option from the context menu that appears.

    +   3. Create a Windows Forms Application named FillColour.

    +   4. Repeat steps 6 to 14 of Deploying Applications by Using Windows Installer
    section of this chapter.

    +   5. Right-click the FillColour project node in Solution Explorer and then select
    the Publish option from the context menu, as shown in Fig.C#-14.18:'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_381_0.png)


    Fig.C+14.18


    The Publish Wizard appears and displays the Where do you want to publish the application
    page (Fig.C+14.19).


    6 Enter the location where you want to publish your application, such as a website,
    a network file share or a CD. In our case, we are publishing the FillColour application
    on a website, so we have entered http://localhost/ in the Where do you want to
    publish the application page and then click the Next button, as shown in Fig.C+14.19:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_381_1.png)


    Fig.C+14.19


    The Will the application be available offline page of Publish Wizard appears (Fig.C+14.20).


    7 Select the appropriate option to specify the mode in which you want your application
    to be available. In this case, we select the Yes, this application is available
    online or offline radio button (Fig.C+14.20).


    8 Click the Next button, as shown in Fig.C+14.20:'
  merge: -1
  img_proc: true
- pgno: 382
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_382_0.png)


    Fig.C#14.20


    The Ready to Publish! page displaying the message that the application is ready
    to publish appears (Fig.C#14.21).


    9 Click the Finish button to complete the publishing of the application, as shown
    in Fig.C#14.21:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_382_1.png)


    Fig.C#14.21


    The project is built and the application is published to the specified location.
    The publish.htm file opens in the Web browser (Fig.C#14.22).


    10 Click the Install button, as shown in Fig.C#14.22:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_382_2.png)


    Fig.C#14.22


    The installation of the FillColour application starts. A security warning message
    appears asking whether you want to install the application or not (Fig.C#14.23).'
  merge: -1
  img_proc: true
- pgno: 383
  md: '11 Click the Install button to install the FillColour application, as shown
    in Fig.C#-14.23:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_383_0.png)


    Fig.C#-14.23


    After completing the installation, the output appears, as shown in Fig.C#-14.24:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_383_1.png)


    Fig.C#-14.24


    After the ClickOnce application is installed and executed, an icon of the ClickOnce
    application is displayed on the Start menu and an entry is added to the Programs
    and Features option in Control Panel. Now, you can open the ClickOnce application
    directly from the Start menu and can also uninstall the application by using Control
    Panel.


    Internet Information Services (IIS) should be installed on your system to run
    the FillColour application. Perform the following steps to install IIS 7.5 from
    Control Panel:


    +   1. Click Start→Control Panel.

    +      The Control Panel window appears.

    +   2. Click the Programs option in the Control Panel window.

    +      The Programs window appears.

    +   3. Click the Turn Windows Features on or off option on the right pane of the
    Programs window.

    +      The Windows Features window appears (Fig.C#-14.25).'
