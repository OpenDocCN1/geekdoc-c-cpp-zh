- pgno: 339
  md: 'Windows Workflow Foundation (WF) enables .NET developers to build, monitor,
    and execute workflows in a .NET application. A workflow generally refers to a
    graphical representation of a sequence of tasks that are performed to complete
    a given procedure or produce some result. Adding workflows in a .NET application
    enables the developers to build applications that start, stop, and wait for something
    to occur. For example, consider a scenario where a person''s identity is to be
    validated before a loan can be granted to him or her. Determining whether the
    documents furnished by an individual are authentic or not, requires various sequential
    and simultaneous tasks to be performed. WF enables such type of situations to
    be modeled into software in the form of WF applications.


    .NET Framework 3.0 introduced WF along with three other foundations, Windows Presentation
    Foundation (WPF), Windows Communication Foundation (WCF), and Windows CardSpace
    (WCS). Visual Studio 2010 has in-built templates to develop workflow-enabled applications.


    This chapter begins with discussion on the principles of workflows and later explains
    the components of WF.


    The chapter also discusses the enhancements that have been made to WF 4.0. Further,
    you learn to develop a simple workflow application, implement conditions in workflows,
    and use workflows with other applications.


    Let''s begin discussing the principles of workflows in the next section.


    # Workflow Principles


    The workflow platform that you use to develop workflow-based applications must
    incorporate certain principles, which are as follows:


    +   - Workflows help in coordinating the work performed by people and software

    +   - Workflows are long running and stateful

    +   - Workflows are based on extensible models

    +   - Workflows are transparent and dynamic throughout their lifecycle


    > Note

    > Those applications that can be easily created on Windows using WF are known
    as workflow-enabled applications. Workflow- based applications are same as the
    workflow-enabled applications.


    Let''s discuss each of these principles in detail next.


    # Coordinating the Work Performed by People and Software


    As workflows allow the work done by people to be connected with work done in software,
    therefore; it is essential that workflows interact with people. Workflows that
    implement the principle of coordinating the work performed by people and software
    enable human interaction with any user interface (UI), such as e-mails, Web pages,
    mobile devices, or other front ends. WF provides the necessary infrastructure
    to effectively handle human interaction and all the related issues.


    # Long Running and Stateful


    Human beings interact with software systems on an ad hoc basis. For example, they
    may interact with software systems after few minutes, hours, or months; therefore,
    workflows should be able to run for long periods. However, running a workflow
    for long periods, and storing a running workflow in memory is not practical due
    to many reasons. If every running workflow is stored in memory while waiting for
    something to occur, the server would run out of memory immediately. In addition,
    if the server crashes, the volatile memory is cleared and all data is lost.


    # Based on Extensible Models


    As stated earlier, workflows serve the purpose of automating business processes.
    Now, since each type of business has a wide range of problems; therefore, a workflow
    platform needs to be extensible. WF provides a set of base activities, such as
    IfElse, Code, and Delay, to build a workflow. You can extend these activities
    or'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'build new activities to meet your requirements. Besides activities, you can
    also extend services, such as, tracking, management, and persistence, provided
    by the runtime engine.


    # Transparent and Dynamic Throughout Their Lifecycle


    As WF is based on a declarative and visual design-time model, existing workflows
    can be modified without changing their source code.


    In this section, the principles of workflows were discussed. Next, we discuss
    the various components of WF.


    # Components of Windows Workflow Foundation


    WF consists of several components, such as workflow, activity, activity library,
    runtime engine, runtime services, and host process that work with an application
    to perform the desired workflow. Fig.C+12.1 shows the architecture of WF along
    with its components:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_340_0.png)


    Following are the six major components of WF architecture:


    +   - Workflow

    +   - Activity

    +   - Base activity library

    +   - Host process

    +   - Runtime engine

    +   - Runtime services


    Let''s discuss each of these components next.


    # Workflow and its Types


    A workflow can be understood as a declarative program wherein each program statement
    is represented in terms of a component, called an activity. In other words, a
    workflow defines the business logic on which a program is based. A business process
    can involve applications as well as people. Workflows that are developed to automate
    interactions among applications are known as system workflows. Such workflows
    are usually static and predictable. In contrast to system workflows, workflows
    that are intended to coordinate interactions among people are known as human workflows.
    Applications that involve human interactions generally need more flexibility than
    others, because people may change their minds, introduce new ideas and exceptions,
    and cancel'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'a process unexpectedly. Though there are differences between system and human
    workflows, however; WF supports both system and human workflows in a unified manner.


    In WF 4.0, two types of workflows are used. These types of workflows are given
    as follows:


    +   - **Flowchart workflows**: Helps you to create workflows using the common
    flowchart elements.

    +   - **Procedural workflows**: Helps you to create workflows using basic and
    sequential execution standards.


    # Flowchart Workflows


    Flowchart is a common standard to design programs. In WF, the Flowchart activity
    is generally used to implement a non-sequential workflow, and occasionally it
    implements sequential workflows incase FlowDecision nodes are not used. The Flowchart
    activity contains a collection of flow nodes, which inherit from the FlowNode
    class. The following types of nodes or elements can be a part of a flowchart:


    +   - **FlowStep**: Shows one step of execution in the flowchart

    +   - **FlowDecision**: Shows the execution on the basis of a Boolean condition.
    It is as similar to the If construct.

    +   - **FlowSwitch**: Shows the execution on the basis of an exclusive switch.
    It is as similar to the Switch construct.


    Next, let''s discuss about the procedural workflows.


    # Procedural Workflows


    In WF, procedural workflows use flow control constructs, such as While, Switch,
    ForEach, and If. These flow control constructs are as similar to those found in
    procedural languages. Procedural workflows can consist of other flow control activities
    also, such as Flowchart and Sequence.


    Next, let''s learn about the activity component in WF.


    # Activity


    In Windows Workflow Foundation 4.0, an activity is the basic unit of composition
    and execution of a workflow. This in other words means that an activity represents
    a unit of work in Windows Workflow Foundation 4.0. Each activity in a workflow
    consists of its own variables and arguments and is a subclass of the Activity
    class. The variables in an activity are used to store the data in an activity
    while the arguments in an activity are used to move data in and out of an activity.


    Workflows in Windows Workflow Foundation 4.0 can be created by implementing the
    CodeActivity abstract class for basic custom activity functionality, such as implementing
    control flow, conditions, event handling, and state management. In addition, the
    NativeActivity abstract class can be implemented to develop custom activities
    that implement specific behavior from scratch.


    Next, let''s learn about the Activity Library in WF.


    # Expanded In-Built Base Activity Library


    The base activity library is a collection of activities that are used to create
    workflows. Activities are the basic building blocks for workflows. The action
    that an activity implements can be a simple action, such as a delay or a composite
    activity, which is composed of multiple child activities. The activities contained
    in the base activity library provide functionalities for control flow, state management,
    event handling, and communicating with applications and services.


    Table 12.1 lists some important activities available in the base activity library:


    Table 12.1: Some Important Activities Available in the Base Activity Library


    | Activity | Description |

    |---|---|

    | `CodeActivity` | Enables you to add Visual C# code to your workflow |

    | `ConditionedActivityGroup` | Contains a collection of child activities whose
    execution order is based on certain conditions. |'
