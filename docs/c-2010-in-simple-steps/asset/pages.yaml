    Now, let''s learn how to work with dialog boxes in C# 2010.


    # Working with Dialog Boxes


    C# 2010 provides you various controls, such as FolderBrowserDialog and OpenFileDialog,
    to work with built-in dialog boxes, such as Browse for Folder and Open dialog
    boxes. The dialog boxes provide you with a UI that facilitates interaction between
    the users and the applications. They contain different controls that represent
    various options the user can select and use to perform a particular task. Basically,
    there are the following two types of dialog boxes:


    +   - **Modal dialog box:** Retrieves additional information from a user. The
    user cannot proceed further or open the main window in an application till the
    modal dialog box is open. Generally, the OK button in the modal dialog box is
    used to indicate that the user has finished entering the data while the Cancel
    button is used to terminate the function. Open, Print, and Save As dialog boxes
    are some of the most common examples of modal dialog boxes.

    +   - **Modeless dialog box:** Does not prevent a user from activating other windows
    in an application as immediate input is not required from the user to proceed
    further. The Find and Replace dialog box in Microsoft Word is an example of a
    modeless dialog box.


    All the dialog boxes available for Windows Forms applications inherit the System.Windows.Forms.CommonDialog
    class. This class provides the ShowDialog() method that displays a'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'dialog box and returns the result of the dialog box. The result of a dialog
    box refers to a value from the System.Windows.Forms.DialogResult enumeration.
    The value of the DialogResult enumeration corresponds to the button that the user
    clicks in the dialog box. Table 6.14 lists the values of the DialogResult enumeration:


    Table 6.14: Values of the DialogResult Enumeration


    | Enumeration Value | Description |

    |---|---|

    | OK | Corresponds to the OK button in a dialog box |

    | Cancel | Corresponds to the Cancel button in a dialog box |

    | Yes | Corresponds to the Yes button in a dialog box |

    | No | Corresponds to the No button in a dialog box |

    | Abort | Corresponds to the Abort button in a dialog box |

    | Retry | Corresponds to the Retry button in a dialog box |

    | Ignore | Corresponds to the Ignore button in a dialog box |

    | None | Returns nothing and implies that the dialog box remains visible unless
    closed explicitly |


    Although every built-in dialog box available in C# 2010 for Windows Forms applications
    performs a different task, all dialog boxes support the ShowDialog() method and
    the DialogResult enumeration. This implies that you can use the ShowDialog() method
    to display any of the built-in dialog boxes and the DialogResult enumeration to
    hold the result of the dialog boxes.


    In Windows Forms applications, the built-in dialog boxes are provided as controls.
    The common built-in dialog box controls are available in the Dialogs tab of Toolbox.
    The dialog box controls that pertain to printing are available in the Printing
    tab of Toolbox. Some of the commonly used dialog box controls are as follows:


    +   - FolderBrowserDialog control

    +   - OpenFileDialog control

    +   - SaveFileDialog control

    +   - PrintDocument control

    +   - PrintDialog control


    Let''s discuss these in detail.


    # Using the FolderBrowserDialog Control


    The FolderBrowserDialog control allows you to work with the Browse For Folder
    dialog box that provides you the facility to browse through folders (not files),
    create new folders, and select folders to view the files. It displays the available
    physical drives and the folders in those drives in a hierarchical tree structure.


    The FolderBrowserDialog control is an instance of the FolderBrowserDialog class.
    Table 6.15 lists noteworthy properties of the FolderBrowserDialog class:


    Table 6.15: Noteworthy Properties of the FolderBrowserDialog Class


    | Property | Description |

    |---|---|

    | Description | Retrieves or sets the descriptive text displayed above the hierarchical
    tree in the Browse For Folder dialog box. |

    | RootFolder | Retrieves or sets the root folder from where the browsing starts.
    By default, the desktop is selected as the root location for browsing. |

    | SelectedPath | Retrieves or sets the path selected by a user. |

    | ShowNewFolderButton | Retrieves or sets a value indicating whether the Browse
    For Folder dialog box allows the users to create new folders. |'
  merge: -1
  img_proc: true
