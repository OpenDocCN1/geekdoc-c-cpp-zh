    as well as from third parties. These extensions include project templates and
    new controls for ASP.NET, WPF, and Silverlight. You can open the Extension Manager
    window by selecting the Extension Manager option in the Tools menu. Fig.C#-1.4
    shows the UI of Extension Manager:'
