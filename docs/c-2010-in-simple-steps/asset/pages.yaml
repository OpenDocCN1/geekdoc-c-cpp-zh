    \ the **Window1.xaml** file.\n\n+   6. Add the highlighted code given in Listing\
    \ 8.8 to the **Window1.xaml.cs** file, as shown in Listing 8.8:\n\n**Listing 8.8:\
    \ Creating Data Binding by using the Code-Behind File**\n\n```\n~~~csharp\nprivate\
    \ void Window_Loaded(object sender, RoutedEventArgs e)\n{\n    Binding bnd = new\
    \ Binding();\n    bnd.Source = mclListBox;\n    bnd.Path = new PropertyPath(\"\
    SelectedItem.Content\");\n    ellipse1.SetBinding(Ellipse.FillProperty, bnd);\n\
    }\n~~~\n```\n\nIn Listing 8.8, a new object of the **Binding** class is created\
    \ first, and then the **Source** property is used to set the binding source. Similarly,\
    \ the **Path** property is used to set the property of the binding source, and\
    \ finally, the **SetBinding** method is used to bind the target control to the\
    \ source.\n\n+   7. Set the **Window1** window as the startup object by double-clicking\
    \ the **App.xaml** file in **Solution Explorer** and changing the **StartupUri**\
    \ attribute of the **App.xaml** file to **Window1.xaml**.\n\n+   8. Press the\
