    # Using the DataGrid Control


    DataGrid is a new control that has been introduced in WPF 4.0. Similar to the
    DataGrid control in ASP.NET Web Forms and Windows Forms, the DataGrid control
    in WPF 4.0 is used to display data in a customizable grid. The data inside a DataGrid
    control is displayed in a table, which is a collection of rows and columns. You
    can display the data from a database inside the DataGrid control or from any collection
    that implements the IEnumerable collection.


    A DataGrid is an instance of the DataGrid class, which has various properties
    that allow you to work with the DataGrid control. Table 7.11 lists the noteworthy
    properties of the DataGrid class:


    Table 7.11: Noteworthy Properties of the DataGrid Class


    | Property | Description |

    |---|---|

    | AlternatingRowBackground | Retrieves or sets the back color for alternating
    rows in a DataGrid control. |

    | AutoGenerateColumns | Retrieves or sets a value indicating whether the columns
    are generated automatically in a DataGrid control. |'
  merge: -1
  img_proc: true
