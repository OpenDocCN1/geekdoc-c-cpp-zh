- pgno: 188
  md: 'Now that you have learned about some important properties, methods, and events
    of the ToolStripItem class, let''s create a Windows Forms application named ToolStripDemo,
    where we can use some of these properties, methods, and events. Perform the following
    steps to create the ToolStripDemo application:


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010 to open the Visual Studio 2010 integrated development environment
    (IDE).

    +   2. Select File→New→Project from the menu bar to open the New Project dialog
    box.

    +   3. Select Visual C#→Windows from the Installed Templates pane of the New Project
    dialog box.

