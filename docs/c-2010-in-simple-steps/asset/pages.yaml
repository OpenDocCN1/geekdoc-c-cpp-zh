    Let''s now learn to add and configure a data adapter in the next section.


    # Adding and Configuring a Data Adapter


    A DataAdapter object enables you to access data from a database by serving as
    a bridge between a DataSet object and a data source. A DataAdapter object establishes
    a connection to and retrieves data from a data source by using a Connection object
    and a Command object, respectively. All the commands required to manipulate, update,
    and modify the data in a data source are available in a DataAdapter object.


    Let''s now learn how to access data in a DataAdapter from a database in a Windows
    Forms application. In our case, we use the DatabaseOperationsExample application
    created in the Using the Add Connection Dialog Box section of this chapter.


