    # Interoperating with Dynamic Languages


    DLR made it simpler for language designers to develop a language that has interoperability
    with other DLR languages such as IronRuby and IronPython and .NET languages such
    as C# and VB.NET. In addition, the aim was to provide support to access the .NET
    Base Class library.


    The theme of C# 2010 is to interoperate with dynamic languages. This interoperability
    with dynamic languages is intended to facilitate the use and manipulation of an
    object from IronPython, IronRuby, JScript, or a standard .Net library in same
    way. In C#, the objects of dynamic languages are exposed using the dynamic keyword
    in such a way that the objects seem familiar to a C# programmer. You can perform
    the following steps to use IronPython within your C# application:


    +   1. Write a layer of your application in IronPython

    +   2. Use Python as the configuration language

    +   3. Use a Python library such as feedparser

    +   4. Put a live interpreter in the application for debugging purposes


    Now, let''s summarize the key points that we have learned in this chapter in the
    next section.


    # Summary


    In this chapter, you learned about:


    +   - DLR, its features and services

    +   - Dynamic type, its implicit conversion, dynamic operation, and runtime lookup

    +   - The DynamicObject and ExpandoObject classes and instantiating their objects

    +   - Interoperability of .NET languages with dynamic languages'
