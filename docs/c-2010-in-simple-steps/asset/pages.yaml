- pgno: 105
  md: "Computer programming, in simple words, means giving instructions to a computer\
    \ to process the data and provides the required output for performing a particular\
    \ task. There are mainly two types of programming approaches: procedure-oriented\
    \ programming (POP) and object-oriented programming (OOP).\n\nPOP is a programming\
    \ methodology wherein a particular problem is divided into smaller sections of\
    \ code containing a finite number of steps. Each of these sections of code is\
    \ then solved separately. The steps required to solve a problem and produce the\
    \ desired outcome are first determined, and then integrated into a single place\
    \ called a procedure. A procedure call is then used to invoke a procedure. In\
    \ addition, a procedure can call another procedure, which means that the procedures\
    \ that you define in an application to solve a problem are dependent on each other.\
    \ This dependence of a procedure on another procedure makes reusability of an\
    \ application difficult. Some programming languages that use the POP concept are\
    \ COBOL, FORTRAN, and C.\n\nThe concept of OOP revolves entirely around objects\
    \ and their interaction to design applications and computer programs, which you\
    \ learn later in the chapter. An object is an atomic entity having its own identity,\
    \ state, and behavior. The concept of OOP has been introduced to overcome the\
    \ difficulty of limited or no reusability of code in POP languages. It also adopts\
    \ the approach of combining the independent objects, which interact with each\
    \ other to solve the overall problem and execute the business logic of the program.\
    \ Between these two approaches, that is, POP and OOP, OOP is considered as the\
    \ better one, since it follows a model related to any real-world object, which\
    \ can be anything from a book to a library. It also ensures reusability of the\
    \ methods, created in one application, in other applications. Examples of languages\
    \ that follow OOP concepts are C++, JAVA, and C#.\n\nIn this chapter, you learn\
    \ about the four main principles of OOP: encapsulation, inheritance, abstraction,\
    \ and polymorphism. You also learn about constructors, destructors, and the garbage\
    \ collection mechanism in C#. In addition, you learn about classes and objects,\
    \ structures, properties, indexers, interfaces, and namespaces used in C#. Finally,\
    \ you learn about the concepts of OOP in context with the C# programming language.\n\
    \n# Working with C# 2010 Classes and Objects\n\nA class is the primary building\
    \ block of a program created in any programming language following the OOP concept,\
    \ such as C#. You can use various classes to encapsulate variables and methods\
    \ into a single unit. Let's consider an example to understand the concept of classes\
    \ better. Suppose you need to create an object of a class named Bird in your program.\
    \ To do so, you first need to create a class called Bird, which contains all the\
    \ functionalities or behaviors and properties of any bird. You can then use the\
    \ Bird class to create the objects of the Bird class, as needed. Further, you\
    \ can use the Bird class as a template to create an object named Owl. The Owl\
    \ object of the Bird class would contain a property nocturnal, which would imply\
    \ that owl is a nocturnal bird.\n\nClasses allow you to define a self-contained\
    \ environment, wherein you control all the methods that can be applied to a given\
    \ set of data and also control access to the data. Classes also give you the ability\
    \ to extend a runtime environment and reuse the existing functionalities of the\
    \ runtime environment in a new way.\n\nYou can create a class with the class keyword,\
    \ followed by the class name. A class can be thought of as a container that may\
    \ have data members (variables, constants, or fields) and member functions (methods,\
    \ properties, events, indexers, operators, instance constructors, destructors\
    \ and static constructors), and other classes. A class also supports inheritance,\
    \ which is a mechanism in which a derived class extends a base class. The syntax\
    \ of class in C# is:\n\n```\nclass <className>\n{\n    <access-modifier> [static]\
    \ <return-type> Methodname( <signature>);\n    <access-modifier> [static] <variable\
    \ type> variablename;\n}\n```\n\n# Note\n\nYou learn about inheritance later in\
    \ the chapter."
  merge: -1
  img_proc: true
- pgno: 106
  md: "To access the data members and member functions of a class, you need to declare\
    \ an object of that class. The syntax to declare an object in C# is:\n\n```\n\
    <className> <objectName> = new <className>();\n```\n\nC# provides many ways of\
    \ defining classes, such as providing different access levels, inheriting features\
    \ from other classes, and enabling you to specify and control the behavior and\
    \ output of the code when objects are instantiated or destroyed. To implement\
    \ all these in your C# application, you need to know about the following concepts:\n\
    \n+   - Access modifiers\n+   - Methods\n+   - Constructors and destructors\n\
    +   - Partial classes\n+   - Static classes\n+   - Extension methods\n\nLet's\
    \ learn about each of these in detail in the following sections.\n\n# Introducing\
    \ Access Modifiers\n\nA class member or type's accessibility level can be specified\
    \ using access modifiers. An access modifier helps avoid jumbling of data and\
    \ methods with the existing code, as well as protects an object of a class from\
    \ outside interference. It protects an object by defining a certain scope to access\
    \ data and methods in a restricted manner. You can declare a class and its methods\
    \ with an access modifier. However, one method can contain only one modifier.\
    \ The different types of access modifiers used in C# are listed in Table 4.1:\n\
    \nTable 4.1: Access Modifiers in C#\n\n| Access Modifiers | Description | Syntax\
    \ |\n|---|---|---|\n| Public | Gives public access to members both inside and\
    \ outside a class without any restrictions. | class SampleClass\n{\n    public\
    \ int x; // No access\n    // restrictions.\n} |\n| Protected | Gives protected\
    \ access to members. You can access protected members from either the class in\
    \ which they are declared or a class derived from the class in which they are\
    \ declared. | class A\n{\n    protected int x = 123;\n} |\n| Internal | Gives\
    \ access to the members that are in the current assembly. If a member with internal\
    \ access modifier is accessed outside the assembly in which it has been defined,\
    \ an error is generated in an application. | public class BaseClass\n{\n    //\
    \ Only accessible within the\n    // same assembly\n    internal static int x\
    \ = 0;\n} |\n| Private | Gives access to the members that are within the body\
    \ of the class in which they are declared. | class Employee\n{\n    private int\
    \ i;\n    double d; // private access by default\n} |"
  merge: -1
  img_proc: true
- pgno: 107
  md: "**Table 4.1: Access Modifiers in C#**\n\n| Access Modifiers | Description |\
    \ Syntax |\n|---|---|---|\n| Protected internal | Gives access to the members\
    \ that are visible either to the current assembly or to the types derived from\
    \ the class in which they are declared. | namespace MyAssembly //current\n//assembly\n\
    {\n  public class One\n  {\n    protected internal int Method()\n    {\n     \
    \ //method code\n    }\n  }\n  public class Two : One\n  {\n    public int Add()\n\
    \    {\n      One obj = new One();\n      return obj.Method();\n    }\n  }\n}\n\
    \n> **Note**\n> \n> *An assembly is a collection of one or more files that are\
    \ used as a single unit. It forms a single unit of deployment and is the primary\
    \ building block of a .NET application.*\n\nNext, let's discuss about methods\
    \ and how you can work with them in C#.\n\n# Working with Methods\n\nA method\
    \ in C# is a block of code that contains a series of statements to perform an\
    \ action. Every action in C# is performed in the context of a method. Methods\
    \ can be declared inside a class or a struct.\n\n> **Note**\n> \n> *A struct is\
    \ a value type that consists of constructors, constants, data members, methods,\
    \ and more. You can create a structure in C# by using the struct keyword. You\
    \ learn more about structure in C# in detail in the later chapter.*\n\nA method\
    \ declaration typically includes access modifiers that specify the access level,\
    \ the return value, the name of the method, and the method parameters. All these\
    \ combined together is called the signature of the method.\n\nThe following code\
    \ snippet shows how you can declare a method:\n\n```\n```csharp\nclass Passenger\n\
    {\n    public void Title() { }\n    public void Name(int age) { }\n    public\
    \ int Address(int houseno, int pincode)\n    {\n        //Some code\n    }\n}\n\
    ```\n```"
