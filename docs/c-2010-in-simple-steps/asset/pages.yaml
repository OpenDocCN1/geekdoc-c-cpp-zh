- pgno: 329
  md: 'C# is a statically typed language, yet in its latest version, Microsoft has
    introduced the concept of dynamic programming. The reason for the support of dynamic
    programming being introduced in C# is due to the growth and popularity of languages,
    such as Ruby, Lisp, Smalltalk, and Python. C# has become more dynamic than static
    in nature, with the inclusion of anonymous types and methods in C# 2005 and the
    var keyword in C# 2008.


    Dynamic programming is one of the most exciting and awaited features of C# 2010,
    which is expected to give developers more flexibility. C# 2010 implements the
    concept of dynamic programming with the keyword, dynamic. Although dynamic is
    a static type, yet if you declare any method, property, member, or operator of
    an object as dynamic, its actual type is resolved only at runtime.


    In this chapter, you learn about the Dynamic Language Runtime (DLR), the new dynamic
    type and the instances of DynamicObject and ExpandoObject classes. You also learn
    about the interoperability of .NET languages with dynamic languages. Let''s begin
    with discussing DLR first.


    # Describing Dynamic Language Runtime


    As we all know that Microsoft designed the .NET Framework to support a vast array
    of programming languages to take advantage of the Common Language Runtime (CLR).
    The CLR provides a host of services that can be implemented by any of the .NET
    languages. Today, CLR supports dynamic languages because of the addition of DLR
    on top of CLR. DLR contains a small set of services that are explicitly designed
    to cater the needs of dynamic languages. The services provided by DLR include
    shared dynamic type system, standard hosting model, and support for faster generation
    of dynamic code. These services can be implemented by all dynamic languages that
    use DLR to share their code with some other dynamic languages such as Ruby and
    Python as well as with existing .NET languages such as VB.NET and C#.


    DLR is added on top of CLR so that the creation and utilization of dynamic languages
    in .NET Framework can be simplified and the features of dynamic languages can
    be used in C# as well. You can find DLR within the .NET Framework in the System.Dynamic
    namespace. Fig.C#-11.1 shows the architecture and features of DLR:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_329_0.png)


    Fig.C#-11.1'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'In Fig.C#11.1, there are several languages at the top, such as IronPython,
    IronRuby, C#, VB.NET, and others in which you can write the source code. At the
    bottom, there are various technologies, such as Microsoft .NET, Ruby, Microsoft
    Silverlight, Python and Microsoft Office. DLR allows data to be accessed amongst
    various technologies and languages with the help of appropriate binders. Now,
    let''s discuss about the three features, Expression Trees, Call Site Caching,
    and Dynamic Object Interoperability of DLR, which are as follows:


    +   - **Expression Trees:** Refers to the representation of code in a data structure
    similar to a tree. However, expression trees in DLR, are the advanced version
    of the expression trees that were introduced with LINQ in .NET 2008. Expression
    trees are used to represent the language semantics in DLR; therefore, DLR has
    extended the LINQ expression trees to incorporate control flow, assignment, and
    various other language-modeling nodes. If you are using any .NET language that
    uses DLR, then, the language needs to produce expression trees and not the Intermediate
    Language (IL), which is generated by DLR automatically.

    +   - **Call Site Caching:** Refers to a place in your source code wherein certain
    operations, such as a-b are performed. When you perform the operation a-b, DLR
    usually caches the characteristics of a and b and all the requisite information
    about the operation. If the operation that you are currently performing has ever
    been performed earlier, then, DLR simply retrieves all the essential information
    from the cache for faster dispatch.

    +   - **Dynamic Object Interoperability:** Implies that the dynamic behavioral
    abilities are not automatically added to all objects and .NET types. An object
    can have dynamic capabilities, only if its corresponding class has dynamic dispatch
    capabilities. A class that implements the IDynamicObject interface or derives
    from the DynamicObject class and overrides a few methods of the DynamicObject
    class provides dynamic dispatch capabilities.


    Binders in call sites are used by DLR to communicate with .NET Framework and various
    other services, such as Silverlight and COM. Binders actually represent language-specific
    semantics and specify how a particular operation can be performed at the call
    site. All the dynamically and statically typed languages can use DLR for the purpose
    of sharing libraries and gaining access to all the technologies that DLR supports.
    The functionality of each of the binders (Fig.C#11.1) is as follows:


    +   - **Object binder:** Enables to talk to .NET objects

    +   - **JavaScript binder:** Enables to talk to JavaScript in Silverlight

    +   - **IronPython binder:** Enables to talk to IronPython

    +   - **IronRuby binder:** Enables to talk to IronRuby

    +   - **COM binder:** Enables to talk to COM


    Now, let''s learn about the dynamic type in the next section.


    # Exploring the Dynamic Type


    C# 4.0 has introduced a number of new features and one amongst them is the new
    static type called dynamic. When you use a dynamic type, it indicates to the compiler
    that its type checking should be performed dynamically at runtime and not during
    compilation. Microsoft has designed a C# runtime binder to perform late binding
    of types that have been declared as dynamic.


    The syntax to declare a variable as dynamic is as follows:


    ```

    dynamic d;

    ```


    C# has a var type, which is similar to dynamic type but there is a difference
    between dynamic type and var. When you declare a variable using the var keyword,
    its type is resolved during compilation. At the time of compilation the compiler
    identifies the data type of value that is assigned to a variable. Moreover, Visual
    Studio also provides IntelliSense for its methods and properties. However, when
    you declare a variable as dynamic, the compiler has no idea about the data type
    of value that is assigned to a variable. Furthermore, if you have a variable of
    dynamic type then, its type can be changed during runtime without any chances
    of encountering an error.'
  merge: -1
  img_proc: true
