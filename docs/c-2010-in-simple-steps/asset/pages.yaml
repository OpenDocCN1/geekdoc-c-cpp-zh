  md: 'Next, let''s learn about implicit line continuations.


    # Implicit Line Continuations


    There may be situations where you might need to continue a single statement over
    multiple lines. In such situations, you can implicitly continue a statement in
    the next line, as shown in the following code snippet:


    ```

    Console.WriteLine(

    CalculateArea(length: 10, breadth: 5));

    ```


    Now, let''s proceed towards exploring keywords in C# 2010.


    # Exploring C# 2010 Keywords


    Keywords are those words or identifiers, which are reserved to be used for a specific
    task. You cannot use a keyword to define the name of a variable or method. Keywords
    are the reserved words whose meanings are predefined to the C# compiler. They
    are used in all the programming languages. A keyword is an essential part of a
    language definition. However, there are some keywords that have special meaning
    in the context of code but such keywords are not reserved keywords. These keywords
    are known as contextual keywords. Table 2.1 lists the reserved and contextual
    keywords:


    Table 2.1: Reserved and Contextual Keywords in C# 2010


    Reserved Keywords

    | abstract | as | base | bool |

    | break | byte | case | catch |

    | char | checked | class | const |

    | continue | decimal | default | delegate |

    | do | double | else | enum |

    | event | explicit | extern | false |

    | finally | fixed | float | for |

    | foreach | goto | if | implicit |

    | in | in (generic modifier) | int | interface |

    | internal | is | lock | long |

    | namespace | new | null | object |

    | operator | out | out (generic modifier) | override |

    | params | private | protected | public |

    | readonly | ref | return | sbyte |

    | sealed | short | sizeof | stackalloc |

    | static | string | struct | switch |

    | this | throw | true | try |

    | typeof | uint | ulong | unchecked |

    | unsafe | ushort | using | virtual |

    | volatile | void | while |  |


    Contextual Keywords

    | add | alias | ascending | descending |

    | dynamic | from | get | global |'
