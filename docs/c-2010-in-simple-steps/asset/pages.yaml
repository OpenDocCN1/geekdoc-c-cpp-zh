- pgno: 332
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_332_0.png)


    In Fig.C#11.2, the type of the dynamic variable d4 changes dynamically and no
    error occurs. You can notice that the Console.WriteLine() statements display the
    runtime type of the d4 dynamic type.


    You have already learned that the compile time type checking of a dynamic type
    is bypassed because a dynamic type behaves similar to an object type. The type
    checking is bypassed for a dynamic type during compile time because at compile
    time the behavior of a dynamic type is similar to that of an object type. During
    the runtime, data type of a dynamic variable is inferred according to the value
    assigned to the dynamic variable. However, object types are not to be confused
    with dynamic types. Consider the following code snippet


    ```

    dynamic dynVar = 1;

    dynVar = dynVar + 5;

    object objVar = 3;

    objVar = objVar + 5;

    ```


    If you compile the preceding code snippet, an error occurs at line number 3, where
    you try to add 3 to an object type. However, no error is encountered when you
    add 5 to the dynamic variable dynVar. In fact, the statement where you have added
    5 to the dynamic variable is not checked during compilation. Also note that the
    result of most dynamic operations is always dynamic.


    Now that you have learned about dynamic types, let''s proceed further and learn
    about implicit conversion into a dynamic type.


    # Implicit Conversion into Dynamic Type


    You already know that when we convert a variable of one data type into a variable
    of another data type, then the process is known as type casting. You also know
    that when the compiler converts a data type into another type of data automatically,
    it is known as implicit conversion. You can assign any data type to a dynamic
    type variable to switch between dynamic and non-dynamic behavior. The following
    code snippet shows implicit conversion of a data type into a dynamic type:


    ```

    dynamic dynVar1 = 5;

    dynamic dynVar2 = "This is a string";

    ```


    By using the keyword, dynamic you can add dynamic behavior to a variable. However,
    you can also remove the dynamic behavior of a dynamic type by converting it into
    some other data type. You can dynamically implement implicit conversion from dynamic
    type to any type of your choice, using constructs similar to assignment statement,
    as shown in the following code snippet:


    ```

    dynamic d = 7;

    int a = d;

    ```


    To run the preceding code in your program, you need to assign the dynamic type
    d into the integer variable a inside a constructor for your class.


    Now, let''s learn more about dynamic operations in the following section.


    # Dynamic Operations


    You have learned that when you perform operations that include dynamic types,
    their type checking during compilation is bypassed, instead the types are resolved
    during runtime; therefore, the operations that include dynamic types are known
