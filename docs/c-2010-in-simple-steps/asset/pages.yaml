    As you can see in Fig.C#10.3, the numbers are arranged in ascending order.\n\n\
    # The Set Operators\n\nThe set operators in LINQ are used to perform query operations\
    \ that yield a result set that is based on the presence or absence of equivalent\
    \ elements within the same or separate collection. The Distinct(), Union(), Intersect(),\
    \ and Except() methods are known as the set operators in LINQ."
