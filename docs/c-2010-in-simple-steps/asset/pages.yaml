    # Garbage Collection in C# 2010


    The garbage collection feature of .NET Framework is responsible for the management
    of resources such as memory. It is due to this memory management aspect of .NET
    Framework that a .NET application developer need not worry about allocating and
    then releasing memory for objects in an application. In other words, it can be
    said that with the help of this feature, the .NET developers do not require to
    write code to perform memory management tasks. Therefore, the automatic garbage
    collection mechanism in C# helps prevent issues, such as memory leaks caused by
    forgetting to free an unused object, null pointer exceptions that are caused when
    an attempt is made to access the memory of an object that has long been freed,
    and many more.


    In C#, the garbage collection mechanism is managed by common language runtime
    (CLR). As long as there is free space in the managed heap, new objects are automatically
    allocated memory by CLR. Therefore, the garbage collection is performed periodically
    by the Garbage Collector (GC) to reclaim the memory from any unreferenced objects
    and to make it available for subsequent allocation to some other object. The garbage
    collection mechanism also enforces memory safety, which means that the contents
    of one object cannot be accessed by some other object.


    As stated earlier, garbage collection is performed periodically for .NET applications;
    yet there might be times when you need to force the GC to deallocate memory from
    any unused object. For this purpose, you can call the GC.Collect() method. This
    method causes an immediate garbage collection on objects of all generations. The
    synatx to call the GC.Collect() method to reclaim inaccessible memory from objects
    of generation 0 is as follows:


    ```

    GC.Collect();

    ```


    In .NET Framework 4.0, support for background garbage collection has been added
    as opposed to the concurrent garbage collection feature that was supported in
    the earlier versions of .NET Framework. This background garbage collection feature
    means that garbage collection can be simultaneously performed on generation 0
    and generation 1 objects while the garbage collection is being performed on generation
    2 objects.


    # Note


    > The .NET GC is a generational garbage collector. In fact, the managed heap has
    been partitioned into three generations, which are known as generation 0, generation
    1, and generation 2. A newly created object is stored in the generation 0 by the
    GC. As the memory is finite and there may soon come a time when there is no free
    space available in the managed heap; therefore, the GC will deallocate objects
    stored in generation 0. Those objects that survive the first pass of garbage collection
    are then moved on to generation 1. The generation 2 consists of those objects
    that survive the first two garbage collection passes. The objects stored in generation
    2 are also known as long-lived objects.'
