- pgno: 83
  md: "The flow of a program written in any programming language implies the way in\
    \ which the program executes. Normally, a program written in C# executes in a\
    \ sequential manner. In case you want to change the flow of execution of the program,\
    \ you need to use the control flow statements, such as if else and switch statements.\
    \ The control flow statements change the flow of execution of a program according\
    \ to your requirements. For instance, you can use the control flow statements\
    \ to execute only specific blocks of code on the fulfillment of specific conditions.\
    \ You can also use the control flow statements to transfer the program control\
    \ from one block of code to another.\n\nSometimes a situation may occur when your\
    \ program is logically correct and compiles successfully, but it fails to display\
    \ the required output and terminates abruptly. Such kind of situations may arise\
    \ due to an exception in your program. An abnormal condition that often occurs\
    \ while a program is being executed and disrupts the normal flow of application\
    \ is known as an exception.\n\nIn this chapter, you learn how to work with the\
    \ different statements used in C#, such as selection statements, iteration statements,\
    \ and jump statements. You also learn about exceptions and how to handle them.\
    \ In the end, you learn about comments, their types, how to adding comments to\
    \ a C# program.\n\nLet's start by learning how to work with different statements\
    \ in C#.\n\n# Working with Statements\n\nIn C#, statements serve as building blocks\
    \ for any program. You can perform varied functions with the help of statements,\
    \ such as declaring a local variable (a variable which is defined inside a method\
    \ and has no presence outside the method), calling a method, and creating an object.\
    \ In C#, some of the most commonly used statements are as follows:\n\n+   - **Simple\
    \ statement:** Consists of a single line of code. It is terminated by a semicolon.\
    \ The following code snippet shows an example of a simple statement:\n+   - **Compound\
    \ statement:** Consists of more than one statement enclosed in braces. A compound\
    \ statement is sometimes also called a block statement and usually appears as\
    \ the body of another statement, such as the if statement.\n+   - **Empty statement:**\
    \ Specifies that no operations are required to be performed but a statement is\
    \ required. You can specify an empty statement by a single semicolon. For example,\
    \ the following code snippet shows the use of the empty statement:\n+   - **Expression\
    \ statement:** Evaluates an expression and stores the resulting value in a variable.\
    \ An expression statement is shown in the following code snippet:\n+   - **Selection\
    \ statement:** Enables you to control the flow of program execution depending\
    \ on one or more conditions or criteria. The if...else and switch statements are\
    \ the examples of selection statements used in C#.\n\n```\nint var1 = 5;\n```\n\
    \n```\nvoid login() {\n    if(x > 3) goto exit;\n    // ...\n    exit: ;\n}\n\
    ```\n\n```\nfloat volume = length * breadth * height; //assigns the volume of\
    \ a cuboid to the //float variable volume\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "+   - **Iteration statement:** Allows you to repeatedly perform a specified\
    \ task(s) until certain condition is reached. The examples of iteration statements\
    \ are **for**, **while**, **do...while**, and **foreach** loops.\n+   - **Jump\
    \ statement:** Transfers the program control to a different section of code. The\
    \ **break**, **continue**, **goto**, **default**, and **return** statements are\
    \ examples of the jump statements.\n\n**Note**\nYou learn about the selection\
    \ statements, iteration statements, and jump statements in detail later in this\
    \ chapter.\n\nLet's now learn about the selection statements.\n\n# ### Working\
    \ with Selection Statements\n\nIn C#, the statements that cause the flow of a\
    \ program to change based on a certain condition are known as selection statements.\
    \ The program control checks a condition before executing the code inside the\
    \ selection statement. The selection statement causes the program control to adopt\
    \ a specific flow of execution based on whether or not a certain condition is\
    \ true. C# supports the following two types of selection statements:\n\n+   -\
    \ **if statement:** Allows you to test whether or not a certain condition is true.\
    \ If the condition is true, the program control is transferred to the block of\
    \ code that is inside the **if** statement; otherwise, the program control is\
    \ transferred to another block of code.\n+   - **switch statement:** Allows you\
    \ to compare an expression with different values.\n\nNow, let's discuss each of\
    \ these selection statements in detail.\n\n# ## The if Statement\n\nOne of the\
    \ most important and commonly used selection statement in C# is the **if** statement.\
    \ The **if** statement evaluates a specified condition or a set of conditions\
    \ to true or false. If the condition is true, the program control enters the **if**\
    \ block and executes all the statements and instructions inside the **if** block.\
    \ The syntax of the **if** statement is as follows:\n\n```\n```csharp\nif condition\
    \ { // condition\n    //statement\n}\n```\n```\n\nIn the preceding syntax, if\
    \ the condition inside the **if** block is evaluated to true, then the program\
    \ control is transferred to the statements inside the **if** block and executes\
    \ the statements.\nNow, let's create a console application named **If Example**\
    \ to learn how to use the **if** statement. Perform the following steps to create\
    \ the **If Example** application:\n\n+   1. Click Start→All Programs→Microsoft\
    \ Visual Studio 2010→Microsoft Visual Studio 2010 to open the Visual Studio 2010\
    \ integrated development environment (IDE).\n+   2. Select File→New→Project from\
    \ the menu bar.\n+      The New Project dialog box appears.\n+   3. Select Visual\
    \ C# from the Installed Templates pane and then select the Console Application\
    \ option from the middle pane of the New Project dialog box.\n+   4. Enter If\
    \ Example in the Name text box to specify the name of the application, and specify\
    \ an appropriate location for the application in the Location combo box. In this\
    \ case, we have selected the location, D:\\C#2010 Applications.\n+   5. Click\
    \ the OK button. The If Example application is created, as shown in Fig.C#-3.1:"
  merge: -1
  img_proc: true
