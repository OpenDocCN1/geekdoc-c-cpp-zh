- pgno: 15
  md: 'As shown in Fig.C#–1.1, .NET Framework 2.0 consists of components, such as
    .NET Framework Base Class Library, Windows Forms, ASP.NET, Console, ActiveX Data
    Objects for .NET (ADO.NET), Common Language Specification (CLS), Common Type System
    (CTS), and .NET languages, such as C# and Visual Basic.NET. Similarly, .NET Framework
    3.0 comprises WPF, Windows Communication Foundation (WCF), Windows Workflow Foundation
    (WF), and Windows CardSpace (WCS). .NET Framework 3.5 introduces a few enhancements,
    such as Language-Integrated Query (LINQ), ASP.NET AJAX, ADO.NET Entity Framework
    and Data Services, and new compilers for C#, Visual Basic.NET, and C++. Finally,
    .NET Framework 4.0 incorporates Parallel Extensions, Managed Extensibility Framework,
    Dynamic Language Runtime, and other additional enhancements.


    Let’s now learn about some of the important components of .NET Framework 4.0.


    # Explaining the Components of .NET Framework 4.0


    As mentioned earlier, .NET Framework 4.0 is based on .NET Framework 2.0, 3.0,
    and 3.5 and therefore includes several components that are a part of these versions
    of the .NET Framework. Some of the basic components of .NET Framework 4.0 are
    as follows:


    +   - CLR

    +   - CTS and CLS

    +   - Assemblies and metadata

    +   - .NET Framework Base Class Library

    +   - Windows Forms

    +   - ADO.NET

    +   - ASP.NET and ASP.NET AJAX

    +   - WPF

    +   - WCF

    +   - WF

    +   - WCS

    +   - LINQ


    Let’s now discuss these components one by one in detail in the following sections.


    # Common Language Runtime (CLR)


    One of the most important and central components of the .NET Framework is CLR.
    Also referred to as runtime, CLR essentially provides a runtime or execution environment
    within which all .NET applications run. The functionalities that CLR provides
    include memory management, exception handling, debugging, security, thread execution,
    code execution, type safety, verification, and compilation. In simple words, you
    can say that CLR manages the execution of .NET applications. The code that runs
    under CLR or targets CLR is known as managed code, while unmanaged code is the
    code that is compiled into native or machine code and is directly executed by
    an operating system. As managed code benefits from various features such as cross-language
    integration, enhanced security, type safety, and memory management, using the
    managed execution environment enables programmers to commit fewer mistakes, thereby
    create more secure and stable applications.


    Interoperability between various .NET languages, such as Visual C#, Visual Basic,
    or Visual C++ is facilitated by CLR, as it provides a common environment for the
    execution of code written in any of these languages. All .NET applications, when
    run, are compiled into an intermediate code called the Microsoft Intermediate
    Language (MSIL) or IL code, by the language compiler. This MSIL code is then used
    by the Just-In-Time (JIT) compiler to compile the code into the native machine
    code, which is the final executable code. Fig.C#–1.2 illustrates the functioning
    of CLR:'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_16_0.png)


    CLR is responsible for various aspects of .NET applications during their execution,
    such as memory management, garbage collection, exception handling, and type safety.
    In fact, the managed environment of runtime eliminates many common software issues,
    such as memory leaks and invalid memory references.


    # Common Type System (CTS) and Common Language Specification (CLS)


    An important component of the .NET Framework that provides support for cross-language
    integration among .NET-enabled programming languages is CTS. CTS defines a common
    set of types that can be used in applications written in different .NET languages
    and the operations that can be performed on these types. Two CTS-compliant languages
    do not require type conversion, when calling a code written in one language from
    a code written in another language. For all the languages supported by the .NET
    Framework, CTS provides a base set of data types; however, each language uses
    aliases for the base data types provided by CTS. For instance, the keyword Integer
    in Visual Basic and int in C# refer to a 32-bit signed integer. CTS therefore
    uses the data type System.Int32 to represent a 32-bit integer value.


    CLS is a subset of CTS and defines a set of basic language features and programming
    constructs that all .NET applications have in common and the rules to which they
    must conform. This enables interoperability between two .NET-compliant languages.
    The rules defined in CLS serve as guidelines for third-party compilers, designers,
    and library builders. CLS being a subset of CTS, the languages supported by CLS
    can use each other''s class libraries similar to their own. Application Programming
    Interfaces (APIs), which are designed by following the rules defined in CLS, can
    be used by all .NET-compliant languages.


    # Assemblies and Metadata


    An assembly is the basic building block of any .NET application. It is a single,
    logical deployment unit. Self-describing in nature, assemblies contain all the
    information that is needed by CLR to execute an application that targets CLR.
    Every .NET application is compiled into an assembly, which forms a unit of deployment,
    versioning, code reuse, and security of the application. This implies that everything
    you do in a .NET application occurs in the scope of an assembly.


    An assembly is created in the form of a Portable Executable (PE) file. This PE
    file can either be a dynamic link library file (.dll file) or an executable file
    (.exe file) that contains the MSIL code of the compiled application. An assembly
    is a collection of types and resources that include assembly metadata, and type
    metadata besides the MSIL. Assembly metadata is the metadata about the assembly
    itself and its components, while type metadata is the metadata about the types
    that are required for the assembly, such as classes, interfaces, enumerations,
    and structures. Two types of assemblies can be created in .NET, private assemblies
    and shared assemblies. A private assembly is used by a single .NET application
    and stored in the application''s directory while a shared assembly is referenced
    by more than one application. Shared assemblies must have a unique name (called
    strong name) and are stored in Global Assembly Cache (GAC).


    Metadata describes a program that is in the form of binary information stored
    in an assembly. When code is compiled in a PE file, the metadata is inserted into
    one part of the file, while the code is converted into MSIL and inserted into
    the another part of the file. Metadata describes every type and member of a program.
    At runtime, CLR loads the metadata into memory and finds information about the
    code, such as the classes and members specified in a program.


    Metadata contains information about the code inside a program in a language-neutral
    manner. It includes the following information:'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   - Assembly information, such as the identity of the assembly, which can
    be a name, version, culture, or public key; the types of assemblies; other referenced
    assemblies; and security permissions

    +   - Information about types, such as name, visibility, base class, interfaces
    used, and members (methods, fields, properties, events, and nested types)

    +   - Attribute information, which modifies the types and members of a class


    The information contained in the metadata of a .NET application is used by CLR
    to create objects, access data, and call member functions used in the assembly
    at run time.


    # ## .NET Framework Base Class Library


    As its name suggests, .NET Framework Base Class Library is a huge library of reusable
    classes, interface, and value types that are available to all the .NET programming
    languages. .NET Framework Base Class Library is object-oriented, language-independent,
    easy to use, and enhances the productivity of the .NET developer. This class library
    consists of a hierarchy of namespaces, and each of these namespaces is a logical
    grouping of classes, structures, interfaces, delegates, and enumerations. For
    example, the System.Collections namespace contains interfaces and classes that
    define various collections of objects, such as lists, queues, hash tables, and
    dictionaries. This namespace can be further broken down into other namespaces,
    such as System.Collections.ArrayList, which represent the ArrayList type in .NET.
    The classes, interfaces, structures, and enumerations are collectively referred
    to as types. These different types in the .NET Framework are arranged in a tree-like
    hierarchy of namespaces. This arrangement of .NET types in the form of namespaces
    resolves the issue of name collisions or name clashes that arises when any two
    types in a code have the same name. The System namespace is the root namespace
    for some of the most commonly-used types in the .NET Framework. Some of the important
    classes of the System namespace are Console, Math, Object, String, Array, Enum,
    and Delegate. Some important structures of the System namespace are Boolean, Byte,
    Char, Decimal, Single, Double, and Int32.


    # ## Windows Forms


    Windows Forms are Windows-based GUI applications that users can install and run
    on their computers. The basic component of a Windows Forms application is a form,
    which is a visual rectangular area on which either information is displayed to
    a user or some input from the user is accepted. A variety of controls can be placed
    inside this form to enhance the UI of the application. The .NET Framework facilitates
    the development of Windows Forms applications by using a .NET-compliant language.
    A Windows Forms application is an event-driven application, which means that some
    action is performed whenever an event, such as a mouse click or pressing of a
    key in the keyboard, takes place.


    # ## ADO.NET


    ADO.NET is a Microsoft technology that provides a consistent way to access data
    sources and databases of all types. It provides access to various data sources,
    such as Microsoft SQL Server, and data sources exposed through Object Linking
    and Embedding Data Base (OLE DB) and Extensible Markup Language (XML). ADO.NET
    can be used to connect to data sources to retrieve, manipulate, and update the
    data. The most important feature of ADO.NET is disconnected data architecture.
    In this architecture, .NET applications are connected to the databases only till
    data is being retrieved or modified. The data access operation in ADO.NET is made
    possible with the help of two components, namely datasets and the data provider.
    Datasets, which refer to a cached set of database records, follow disconnected
    data architecture to access or modify data. Therefore, applications do not require
    connecting to the database to process each record. In addition, all database operations
    are performed on the dataset instead of the database. The data provider, on the
    other hand, can be thought of as a bridge that helps to connect an application
    to a database. Using a data provider, an application can execute commands on a
    database and retrieve results from the database.


    For more information on ADO.NET, please refer to Chapter 8, ADO.NET and Data Binding.


    # ## ASP.NET and ASP.NET AJAX


    ASP.NET is a part of the Microsoft .NET Framework, which, with its powerful and
    rich set of features, enables .NET programmers to develop enterprise-level server-based
    dynamic and interactive Web applications. With'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'the ASP.NET Web development model, you can add HyperText Markup Language (HTML),
    Web server, and custom as well as user controls to a Web form. In ASP.NET Web
    applications, a Web form is the basic UI entity. You can also specify the behavior
    of a Web server and the user controls and add functionalities for these controls
    in the code of a Web application. An ASP.NET application can be written by using
    any of the .NET languages, such as Visual Basic, Visual C#, and Visual C++.


    AJAX is an acronym for Asynchronous JavaScript and XML and was earlier known as
    Atlas. It is an extension to ASP.NET, which means that the AJAX functionality
    can be added to ASP.NET applications. AJAX facilitates the transfer of information
    between aWeb server and a client in such a way that AJAX-based applications do
    not require a Web page to be reloaded again while certain modifications are being
    made to the page. Using AJAX, .NET developers can send only the modified portions
    of a Web page through asynchronous calls to the Web server. This decreases network
    traffic and the processing time of a Web page on the Web server. Gmail is an example
    of a popular AJAX-enabled Web application.


    # ### Windows Presentation Foundation (WPF)


    WPF is a component of .NET Framework 3.0 and issued to create applications with
    visually appealing UIs. Formerly known as Avalon, WPF combines two-dimensional
    (2D) and three-dimensional (3D) graphics, Microsoft Word documents, Portable Document
    Format (PDF) files, and multimedia into a single framework. It also offers a consistent
    programming model to develop WPF applications, in which the UI and business logic
    can be clearly separated. In addition, WPF offers Extensible Application Markup
    Language (XAML), which is a markup language created by Microsoft. With XAML, both
    .NET application developers and designers can easily and efficiently work and
    collaborate on the development process of WPF applications.You can also use WPF
    to create a wide range of standalone and Web applications.


    For more information on WPF, please refer to Chapter 7, Introducing Windows Presentation
    Foundation and XAML.


    # ### Windows Communication Foundation (WCF)


    One of the main technologies introduced with .NET Framework 3.0 was WCF, which
    provides a unified programming model to build service-oriented applications. For
    example, you can create a service-oriented application in which a service developed
    in .NET is used by another application that is built on a different platform or
    programming language. WCF combines and extends the capabilities of distributed
    systems, .NET Remoting, and Web services. All these features help service-oriented
    applications to communicate with one another, thereby simplifying the development
    process.


    > > **Note**

    > >

    > > A distributed system has multiple independent interconnected computers that
    communicate with each other with the help of a computer network. .NET remoting,
    on the other hand, provides a framework that can be used with ASP.NET Web services
    to develop distributed Web applications. Using .NET remoting, software components
    located on the same computer, different computers on the same network, or on computers
    across separate networks can communicate with each other. A Web service is a method
    that can be invoked through the Internet and then be used to return a value (if
    any) to the code invoking the Web service. You learn about Web services in detail
    in Chapter 13, Working with Web and WCF Services.


    Next, let''s discuss WF.


    # ### Windows Workflow Foundation (WF)


    WF is a Microsoft technology introduced in .NET Framework 3.0, which helps define,
    execute, and manage workflows. A workflow generally refers to a sequence of tasks
    that are performed to complete a given procedure or produce some result.WF applications
    consist of a series of shapes and icons that represent some actions. Before the
    advent of WF, application developers used to write both the business logic and
    its implementation in .NET languages, such as C#, Visual Basic .NET. However,
    with WF, the business logic code can be defined in a workflow application while
    the actual implementation code is written in a .NET language. Therefore, WF provides
    a declarative programming model to build workflow applications that only has the
    business logic code. For more information on WF, please refer to Chapter 12, Introduction
    to Windows Workflow Foundation.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# ## Windows CardSpace (WCS)


    WCS is a client software introduced by Microsoft that enables users to use their
    digital identities over the Internet in a familiar, simple, and secure way. WCS
    can be thought of as an online virtual information card or an ID card for the
    Internet, which can be used to validate a user''s identity. Using WCS, .NET programmers
    can build websites and software that are prone to identity related attacks, such
    as phishing. WCS takes care of the problems of traditional online security mechanisms
    by reducing the dependence on user names and passwords. WCS uses a separate desktop
    and cryptographically strong authentication to ensure secure online transactions.


    # ## Language-Integrated Query (LINQ)


    LINQ is a .NET Framework component that adds native data querying capabilities
    to .NET languages. It has a syntax similar to Structured Query Language SQL, which
    means that you can use LINQ to write statements in any .NET language, such as
    Visual C# and Visual Basic.NET. LINQ offers a consistent model to work with data
    across various data sources and formats, such as SQL Server databases, datasets,
    objects in a collection, and XML documents. The operations performed by a LINQ
    query typically consist of three main actions: obtaining a data source, creating
    the query, and executing the query.


    After discussing the components of .NET Framework 4.0, let''s now learn about
    the features of Visual Studio 2010.


    # ## Exploring the Key Features of Visual Studio 2010


    Visual Studio is an IDE from Microsoft that contains a complete set of development
    tools for building .NET applications. Visual Studio offers a rich set of tools
    and features that not only enable the application developers to write and modify
    their programs, but also helps detect and correct errors. The Visual Studio IDE
    includes a Code Editor, which is a window where you can write the source code
    for an application that you are developing. An integrated debugger is also available
    in Visual Studio, which is a tool that helps to monitor the behavior of an application
    while it is executing. If there is any error in the application, you can use the
    integrated debugger to determine the exact location of an error. The integrated
    debugger provides support for IntelliSense, which is a useful feature of Visual
    Studio and helps to increase the productivity of a .NET application developer.
    The IntelliSense feature helps in the development of applications as it automatically
    generates code in the Code Editor. In addition, Visual Studio provides templates
    for creating applications, such as Class Library, Windows Control Library, and
    Web Control Library. Templates to create console, Windows, and Web applications,
    and Web services are also available in Visual Studio 2010.


    Visual Studio 2010 is the latest version of Visual Studio that targets .NET Framework
    4.0. It helps to minimize the development time of .NET applications by providing
    different tools to integrate designers into the overall development process.


    Visual Studio 2010 also introduces a multi-paradigm programming language called
    Visual F#. This language combines the features of functional programming languages,
    such as C; dynamic programming languages, such as Ruby and Python; and object-oriented
    programming languages, such as Java and C#.


    > > **Note**

    > >

    > > A functional programming language is one that focuses more on what a program
    should do rather than specifying how it should do. A dynamic programming language,
    also referred to as a weakly typed programming language, enables you to declare
    variables without defining their data types. The resolution of the actual data
    type of any variable declared in a dynamic language is deferred until run time.
    Any programming language that is centered on the concept of objects and follows
    the principles of abstraction, encapsulation, polymorphism, and inheritance, is
    known as an object-oriented programming language. You learn about the object-oriented
    programming language in Chapter 4, Introducing Object-Oriented Programming Constructs.


    Before you start working with Visual Studio 2010, you need to know something about
    its main features and enhancements. The following is a list of the main features
    and enhancements introduced in Visual Studio 2010:'
  merge: -1
  img_proc: true
