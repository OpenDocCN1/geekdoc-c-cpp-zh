  md: "On the other hand, constants are those values which are fixed and do not change\
    \ during the execution of a program. For instance, the value of Pi is fixed, so\
    \ it can be declared as a constant. Moreover, any value that you do not want to\
    \ change can be declared as a constant. Let's learn to declare a variable in C#.\n\
    \n# Declaring Variables\n\nAny information in a program that can vary must be\
    \ stored in a named memory location called variable. After specifying a meaningful\
    \ name and appropriate data type to a variable, it is declared in the program\
    \ so that the compiler can easily recognize the variable declared with a specific\
    \ data type.\n\n> **Note**\n> \n> *A compiler is software that converts a source\
    \ code written in a programming language into a machine language, which a computer\
    \ can understand.*\n\nA variable declaration performs the following tasks:\n\n\
    +   - Tells the compiler the name of the variable\n+   - Tells about the type\
    \ of data a variable holds\n+   - Decides the scope of a variable\n\nMoreover,\
    \ a variable must be declared before it is used in a program. To declare a variable,\
    \ you must specify a data type to it according to the value assigned, followed\
    \ by the name of the variable. The following is the syntax for declaring a variable:\n\
    \n```\ndatatype variable1, variable2, variable3,... variableN;\n```\n\nIf the\
    \ variables to be declared are more than one and have same data types, then you\
    \ can declare the variables in the same line separated by a comma, as shown in\
    \ the preceding syntax. A code line in C# always ends with a semi colon. The following\
    \ are some examples of legal variable declaration:\n\n+   - float length;\n+ \
    \  - int age;\n+   - char b1, b2;\n+   - double pi;\n+   - decimal money;\n\n\
    # Assigning Values to Variables\n\nAfter the declaration of a variable, you need\
    \ to initialize its value. Initialization of a value to a variable means assigning\
    \ a value to a variable. While initializing a variable, ensure that a variable\
    \ is assigned a value before being used in a program. It is not mandatory to initialize\
    \ a variable at the time of declaration. The syntax for initialization is as follows:\n\
    \n```\nvariableName = value;\n```\n\nor\n\n```\nvariable1 = variable2 = variable3\
    \ = value;\n```\n\nFollowing is the syntax to initialize a variable at the time\
    \ of declaration:\n\n```\ndatatype variableName = value;\n```\n\nor\n\n```\ndatatype\
    \ variable1 = value, variable2 = value;\n```\n\nThe following are some valid examples\
    \ of initializing a variable:\n\n```\nint age = 23;\nbool status = false;\nfloat\
    \ height = 164.5f;\nchar sex = 'f';\nint a = 4, b = 6;\n```"
