    \ System.Linq;\nusing System.Text;\nnamespace MyFirstConsoleApplication\n{\n \
    \   class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            Console.WriteLine(\"Welcome to C# Programming\");\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\nIn Listing 1.1, you can see that the Main() method\
    \ has two lines of code. The first line—Console.WriteLine(\"Welcome to C# Programming\"\
    )—accesses the WriteLine() method of the Console class, which exists in the System\
    \ namespace in .NET Framework Base Class Library. When this line of code executes,\
    \ the message, Welcome to C# Programming, is displayed on the command-line console.\
    \ The second line of code—Console.ReadLine()—waits for the user to enter some\
    \ text on the command-line console.\n\n> Note\n> The Console class allows you\
    \ to read and display data from the command-line console.\n\n9 Select File→Save\
