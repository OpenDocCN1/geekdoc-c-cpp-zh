    Now, let''s learn about the namespaces in C#.


    # Working with Namespaces


    The concept of namespace is not new in C#. The concept of namespaces has been
    used in C++ and Java since a long time. A namespace is a kind of wrapper around
    one or more structural elements that make the elements unique.


    Whether or not you explicitly declare a namespace in the C# source file, the compiler
    adds a default namespace in your C# application. Namespaces have public access
    and is not modifiable.


    A namespace in C# has the following properties:


    +   - It organizes large code projects

    +   - The . operator delimits it

    +   - The using directive means that you do not need to specify the name of the
    namespace for every class


    Namespaces in C# are of two categories: user-defined and system-defined namespaces.
    The user-defined namespaces are the namespaces you create in the code, and the
    system-defined namespaces are the one that are already added in your code when
    you create a new application.


    All the codes you write exist within an implied namespace that exists for the
    current context of the code. The using directive is used to tell the compiler
    which namespaces you want to use in the program. The most common use of the using
    directive is to include the System namespace in your program, so that you can
    use the maximum functionalities of the System namespace.


    Let''s learn to create a user-defined namespace and also how you can pass the
    reference of the namespace in your program in the following sections.


    > **Note**

    > Namespaces are always public; therefore, the declaration of namespace cannot
    include any access modifiers.


    Next, let''s learn how to create namespaces in a C# application.


    # Creating Namespaces


    When you create a large number of classes, it can be helpful to categorize them
    into their own namespaces for the better organization of code. You can use namespaces
    to group the type so that you can use it multiple times and also avoid the conflict
    with the names that are already declared. When you create a namespace, you must
    use the namespace keyword, which is followed by its name.'
  merge: -1
  img_proc: true
