    \nFig.C#-13.13\n\n14 Click the OK button to close the message box.\n\nYou have\
    \ learned about Web Services. Now, let's learn to create a WCF service and a client\
    \ to use the WCF services in the following section.\n\n# Creating and Using a\
    \ WCF Service\n\nIn Visual Studio 2010 it is an easy task to create a WCF service\
    \ as Visual Studio 2010 has an in-built support for WCF. However, in versions\
    \ prior to Visual Studio 2008, you needed to install the components of WCF to\
