  md: "# Listing 10.10: Using the Sum() Method in the AggregateOperatorExample Application\n\
    \n```\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\n\nnamespace AggregateOperatorExample\n{\n    class Program\n\
    \    {\n        public static void Main(string[] args)\n        {\n          \
    \  int[] numArray = { 1,2,3,4,5,6,7,8,9 };\n            int numSum = numArray.Sum();\n\
    \            Console.WriteLine(\"The sum of the numbers is {0}.\", numSum);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n```\n\nIn Listing\
    \ 10.10, the Sum() method is used to calculate the sum of numbers.\n\n5 Press\
    \ the F5 key to run the application. The output appears, as shown in Fig.C#-10.11:\n\
    \n![](img/2db4b8b2cb67e7ccc52477a61fe289ab_320_0.png)\n\nFig.C#-10.11\n\nFig.C#-10.11\
    \ shows the sum of the numbers given in Listing 10.10 by using the Sum() method.\n\
    \nNow that you are familiar with the standard query operators available in LINQ,\
    \ let's discuss programming with LINQ to ADO.NET in the next section.\n\n# Explaining\
    \ LINQ to ADO.NET\n\nLINQ to ADO.NET is a term that describes the database-centric\
    \ aspects of LINQ. LINQ to ADO.NET consists of two separate technologies, LINQ\
    \ to DataSet and LINQ to SQL.\n\nLINQ to DataSet is a set of extensions to the\
    \ standard ADO.NET DataSet programming model that allows DataSet, DataTable, and\
    \ DataRow objects to be a natural target for a LINQ query expression. LINQ to\
    \ DataSet provides optimized querying capability over datasets.\n\nLINQ to SQL\
    \ allows you to interact with a relational database by removing the ADO.NET data\
    \ types through the use of entity classes. LINQ to SQL enables you to directly\
