  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_224_0.png)


    # Fig.C-7.4


    As shown in Fig.C-7.4, the UI of XBAP applications is similar to the UI of standalone
    WPF applications. In addition, some of the essential files, such as App.xaml and
    App.xaml.cs, are also part of the XBAP application. However, XBAP applications
    have the Page1.xaml and Page1.xaml.cs files instead of the MainWindow.xaml and
    MainWindow.xaml.cs files in standalone WPF applications. The Page1.xaml and Page1.xaml.cs
    files can be viewed in the Solution Explorer window and correspond to the MainWindow.xaml
    and MainWindow.xaml.cs files in a standalone WPF application.


    # Note


    > A WPF page is the basic entity in a XBAP application and is similar to a Web
    page. When you create an XBAP application, a page is automatically included in
    the application. You can also add new pages to the XBAP application. A single
    XBAP application page is an instance of the Page class.


    Now let''s explore the WPF 4.0 Designer in the next section.


    # Exploring the WPF 4.0 Designer


    In Visual Studio 2010, the WPF 4.0 Designer is the designer interface that offers
    an easy, quick, and interactive way to work with the UI of WPF applications. Before
    you start working with full-fledged WPF applications, let''s go through the important
    WPF Designer elements for a standalone WPF application, as shown in Fig.C-7.5:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_224_1.png)


    # Fig.C-7.5'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'As shown in Fig.C#7.5, the WPF Designer resembles the Windows Forms Designer.
    For instance, the window, MainWindow.xaml, of the WPF Designer is quite similar
    to a form in a Windows Forms application. The MainWindow.xaml window constitutes
    the main design area of the WPF Designer just as a Windows Form constitutes the
    main design area of a Windows Forms Designer. In addition, both WPF Designer and
    Windows Forms Designer have Solution Explorer, the Properties window, and the
    Toolbox. The difference between the two is that the WPF Designer is divided into
    two primary views, the Design view and XAML view. Other designer elements, such
    as the split view bar and the tag navigator help you to work with the Design and
    XAML views.


    Let''s explore the Design and the XAML views, the split view bar, and the tag
    navigator in the following sections.


    # The Design View


    As the name suggests, the Design view is the area where you build the visual aspects
    or UI of a WPF application by placing, dragging and resizing, and manipulating
    the appearance of the controls used in the application. The Design view allows
    you to easily and quickly build the UI of the WPF application in a What You See
    Is What you Get (WYSIWYG) manner, as shown in Fig.C#7.6.


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_225_0.png)


    Fig.C#7.6


    As shown in Fig.C#7.6, the Design view itself has several UI elements that help
    you to quickly design WPF applications. For instance, the Zoom control allows
    you to zoom in or out of the Design view; the move and resize handles allow you
    to appropriately position and resize the controls; and the margin lines allow
    you to set the margins of a control. Let''s briefly discuss the elements of the
    Design view.


    # Grid Rails, Gridlines, and Gridline Indicators


    The grid rails, gridlines, and gridline indicators pertain to the Grid control
    of WPF. When you create a WPF 4.0 application, a Grid control is added to the
    application by default. The Grid control allows you to represent a WPF application
    as a grid or lattice. The entire grid is enclosed by grid rails that span horizontally
    and vertically on the top and left respectively of the WPF application (Fig.C#7.6).


    By default, the grid has one row and one column; however, you can create additional
    rows and columns by clicking the desired positions on the grid rails. When you
    click the grid rails, gridlines and gridline indicators appear at those positions
    (Fig.C#7.6). When you click the grid rail on the top, a vertical gridline appears,
    dividing the grid into two columns. Similarly, when you click the grid rail on
    the left, a horizontal gridline appears, dividing the grid into two rows. You
    can control the height and width of the rows and columns by moving the gridline
    indicators, which appear as triangles on the grid rails.


    # The Zoom Control and Zoom to Fit Button


    You can find the Zoom control and the Zoom to Fit button at the upper-left corner
    of the Design view. The Zoom control allows you to zoom in and zoom out of the
    Design view. To zoom in or out, simply drag the'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Zoom control slider up or down. The current zoom level, which in Fig.C+7.7
    is 100%, can be seen on top of the Zoom control:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_226_0.png)


    In case you want to zoom or resize a window according to the available space in
    the WPF Design view, you can do so quickly by clicking the Zoom to Fit button,
    which appears just below the Zoom control.


    # The Move and Resize Handles


    You can move and resize the controls in the Design view by using the move and
    resize handles, respectively. These handles appear only when you select a control.
    Note that the move handle appears only for some selected controls, such as the
    Grid control. For these controls, the move handle is located at the upper-left
    corner of the control (Fig.C+7.8). You just need to click and drag the move handle
    to reposition the control in the Design view. To move those controls for which
    the move handle does not appear, you can simply select and drag them (Fig.C+7.8).


    When you select a control, you can also see its resize handles. The resize handles
    appear at the four corners of the control as square boxes, as shown in Fig.C+7.8:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_226_1.png)


    To resize a control, click any of the handles and drag it outward or inward. Note
    that when you click the resize handles of a control, the current height and width
    of the control are displayed in maroon color on the right and bottom of the control,
    as shown in Fig.C+7.9:'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_227_0.png)


    Fig.C#7.9


    Next, let''s discuss about the margin lines and margin stubs in the design view
    of WPF applications.


    # Margin Lines and Margin Stubs


    In WPF 4.0, controls exist within container controls. An example of a container
    control is the Grid control, which is automatically added to a WPF 4.0 application
    when you create the application. When you drag and drop the controls on the grid,
    you can change the distance, known as the margin, between a control and the grid.
    The margin is the distance from the edge of the control to the edge of its container
    control. If the container control is Grid, the margin is measured from the edge
    of the control to the nearest gridline. Each control has four margins: top, bottom,
    left, and right. These margins are represented by four lines, called margin lines,
    emerging from the edges of the control, as shown in Fig.C#7.10:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_227_1.png)


    Fig.C#7.10


    Note that margin lines appear only when a control is selected.


    You may notice in Fig.C#7.10 that only the top, bottom, and right margin lines
    of the Button control appear; there is no left margin line. Instead, there is
    a small circle, called the margin stub, on the left edge of the Button control.
    The margin stub indicates that the respective margin is set to zero. The margins
    for a control are collectively accessed through the Margin property of the control.
    You can set the Margin property of a control in the Design view, the XAML view,
    or the code-behind file. To set the Margin property of a control in the WPF Design
    view, select and drag the control. You can also use to set the Margin property
    by typing the values for the margins in the Properties window. You need to provide
    the values for the margins in a clockwise manner starting from the left margin,
    that is, left, top, right, and bottom. Note that when you type the new values
    for the margins in the Properties window, the size of the control may change.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Snaplines


    Snapline is a feature in the WPF Design view that helps you to align the controls
    in a WPF 4.0 application. A snapline appears only when you have more than one
    control in a WPF application and you drag or align the edges and text of a control
    horizontally or vertically. The snapline appears as a light brown line along the
    edges of the control, as shown in Fig.C7-7.11:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_228_0.png)


    Fig.C7-7.11


    In Fig.C7-7.11, you can see the number 49 displayed at one end of the snapline.
    This number represents the distance between the edges of the controls you want
    to align. In case you do not want to see the snaplines, you can press the ALT
    key while dragging or resizing the control.


    You are now familiar with the various UI components of the Design view. Let’s
    move on to explore the XAML view of the WPF Designer.


    # The XAML View


    As the name suggests, the XAML view allows you to view and work with the XAML
    code of WPF 4.0 applications. The XAML view and the Design view are inter-related
    such that whatever changes you make in the Design view are reflected in the XAML
    view and vice versa. This implies that you can also design WPF applications by
    using the XAML view. Fig.C7-7.12 shows the XAML view (along with the tag navigator)
    of a WPF 4.0 application:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_228_1.png)


    Fig.C7-7.12'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Now let''s discuss the split view bar.


    # The Split View Bar


    In Visual Studio 2010, you can simultaneously work with the Design view and the
    XAML view. This is possible because of the split view bar (Fig.C#7.12), which
    presents the split view of the WPF Designer. The split view refers to the separation
    or division of the WPF Designer into the Design view and XAML view. The split
    view bar has two tabs that correspond to the two panes on its left and the three
    buttons on its right. The first tab corresponds to the Design pane and it allows
    you to see the Design view, while the second tab corresponds to the XAML pane
    and it allows you to see the XAML view. There is a button, Swap Panes, between
    the Design and XAML panes on the split view bar. When you click the Swap Panes
    button, the Design view and XAML view are swapped with each other, as shown in
    Fig.C#7.13:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_229_0.png)


    Fig.C#7.13


    You can also use the split view bar handle to resize the Design or XAML view.
    You can do so by dragging the split view bar handle upward or downward.


    As stated earlier, there are three buttons on the right side of the split view
    bar. The first button, Vertical Split, allows you to vertically split the Design
    view and XAML view, as shown in Fig.C#7.14:'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_230_0.png)


    Fig.C7.14


    The second button, Horizontal Split, allows you to see both the Design view and
    the XAML view horizontally, which is the default view. The third button, Collapse
    Pane, allows you to collapse or hide one of the panes. For example, when you click
    the Collapse Pane button, the Design pane collapses and you get more space for
    the XAML view. In case you want to expand the collapsed pane, you can click the
    Expand Pane button that appears in place of the Collapse Pane button.


    # The Tag Navigator


    By default, the tag navigator appears just below the XAML view. It allows you
    to navigate to the parent XAML tag or element of the currently selected element.
    When you hover the mouse over a tag in the tag navigator, a thumbnail preview
    of that tag is displayed, as shown in Fig.C7.15:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_230_1.png)


    Fig.C7.15


    As shown in Fig.C7.15, the Button control or tag is the currently selected tag
    in the XAML view. Its name is displayed in bold in the tag navigator. The name
    of the Button tag is followed by hyperlinks that are separated from each other
    by a forward slash, that is, Window/Grid/Button. The hyperlinks represent the
    hierarchy up to the currently selected tag. If you place the mouse pointer over
    any of the hyperlinks, a thumbnail image of the hyperlink is displayed (Fig.C7.16).
    You can click any of the hyperlinks to select that tag. Note that if the currently
    selected tag has any child tags, then the Select Child arrow is enabled and when
    you click the arrow, a list of the child tags appear, as shown in Fig.C7.16:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_230_2.png)


