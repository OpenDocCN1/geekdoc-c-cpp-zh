- pgno: 37
  md: '> > **Note**

    > >

    > > You learn how to create console, Windows Forms, and Web applications later
    in this chapter.


    In this section, you learn about some of the essential elements of the Visual
    Studio 2010 IDE that are common for all kinds of .NET applications. In our case,
    we take the example of a Windows Forms application to learn about the IDE elements.
    Fig.C#-1.36 shows the Visual Studio 2010 IDE of a Windows Forms application:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_37_0.png)


    Fig.C#-1.36


    Some of the important components of the Visual Studio 2010 IDE are as follows:


    +   - The Start Page

    +   - Menu Bar and Toolbars

    +   - Solution Explorer

    +   - The Properties window

    +   - Toolbox

    +   - Designer and Code Editor

    +   - Server Explorer

    +   - The Output window

    +   - The Object Browser window

    +   - The Class View window


    Let''s discuss these components one by one in the following sections.


    # ## Start Page


    As the name suggests, Start Page (Fig.C#-1.35) is the first page that appears
    whenever you open Visual Studio 2010. This page contains various links to access
    the recently opened applications, the resources, articles, and news related to
    various products and technologies of Microsoft; and samples to create .NET applications
    and walkthroughs that help you to get started with Visual Studio 2010.


    # ## Menu Bar and Toolbars


    The menu bar is a collection of menus, each of which contains a logical set of
    options to perform a particular task. The menus that are available in the Visual
    Studio 2010 IDE may vary in different kinds of .NET applications. However, some
    of the menus are common to all kinds of .NET applications, for example, the **File**,
    **Edit**, **View**, **Build**, **Debug**, and **Help** menus. Every menu provides
    options to perform a particular type of task.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'For instance, the **File** menu contains options that are used to perform file
    management tasks, such as creating, opening, saving, and closing files (or applications).
    Fig.C#-1.37 shows the different menus present on the menu bar of a Windows Forms
    application:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_38_0.png)


    Fig.C#-1.37


    The menu bar of the Visual Studio 2010 IDE has a set of comprehensive options,
    some of which are more frequently used than others. To make it easier and quicker
    to access these menu options, the options are contained in toolbars. The toolbars
    appear just below the menu bar and have buttons as shortcuts for the most common
    menu options and other tasks. You can click the buttons on a toolbar to select
    an option or perform a particular task. Some of the common toolbars are **Standard**,
    **Build**, **Debug**, **Layout**, and **Help**. Fig.C#-1.38 shows the **Standard**
    toolbar, which appears by default in the Visual Studio 2010 IDE:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_38_1.png)


    Fig.C#-1.38


    Let’s now learn about **Solution Explorer**.


    # ## Solution Explorer


    In Visual Studio 2010, a **.NET** application is contained in a solution, which
    contains one or more projects, files, and other resources related to the application.
    **Solution Explorer** refers to a window in which the projects and files of a
    solution are displayed in the Visual Studio 2010 IDE. The window of **Solution
    Explorer** displays the projects and files in a hierarchical manner. Fig.C#-1.39
    shows the **Solution Explorer** window for a Windows Forms application:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_38_2.png)


    Fig.C#-1.39


    As you can see in Fig.C#-1.39, the **Solution Explorer** window contains a toolbar
    with various buttons, such as **Properties**, **Show All Files**, **Refresh**,
    **View Code**, **View Designer**, and **View Class Diagram**, which perform specific
    actions. Among these, **Show All Files**, **View Code**, and **View Designer**
    are the most frequently used buttons. The **Show All Files** button displays all
    the files that are part of a solution. The solution in our case is **WindowsFormsApplication1**
    (Fig.C#-1.39). The **View Code** button allows you to switch from the designer
    of the **WindowsFormsApplication1** Windows Forms application to its **Code Editor**.
    The **View Designer** button on the other hand, allows you to switch from **Code
    Editor** to the designer of the Windows Forms application. You will learn about
    the designer and **Code Editor** later in this chapter.


    In Fig.C#-1.39, note that below the toolbar, the entire application is displayed
    as a **hierarchy** of various nodes. The **root node** at the top of the hierarchy
    has the same name as the solution and also displays the number of projects that
    the solution contains. This node generally has one or more **child nodes**, which
    represent the projects contained in the solution. If the solution has multiple
    projects, then every project will have **child nodes** for its references, files,
    and other resources.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '> > **Tip**

    > > *If Solution Explorer is not visible in an application, then you can view
    it by selecting View->Solution Explorer on the menu bar or by pressing the CTRL+ALT+L
