    # Implementing Polymorphism


    Polymorphism, in general, can be explained as one entity containing multiple forms.
    In C#, you can use one procedure in multiple ways with the help of polymorphism.
    For example, suppose you have to write a program for calculating the area of some
    geometrical figure. You can use the same method name for calculating the area
    of a circle, a triangle, or a rectangle using different parameters.


    The important features of polymorphism are as follows:


    +   - Allows you to invoke methods of a derived class through the base class reference
    during run time

    +   - Helps implement different implementations of multiple methods that are called
    through the same name.

    +   - Helps call a method of a class irrespective of the specific implementation
    it provides.


    In C#, there are two ways to implement polymorphism:


    +   - Compile time polymorphism

    +   - Run-time polymorphism


    Let''s learn about them in detail in the next section.


    # Implementing Compile Time Polymorphism


    When the compiler compiles a program, the compiler has the information about the
    method arguments. Accordingly, the compiler binds the appropriate method to the
    respective object at the compile time itself. This process is called compile time
    polymorphism or early binding. You can implement compile time polymorphism through
    overloaded methods and operators. The arguments passed are matched in terms of
    number, type, and order; then the overloaded methods are invoked.


    Compile time polymorphism is categorized as follows:


    +   - Method overloading

    +   - Operator overloading


    # Method Overloading


    Method overloading is a concept in which a method behaves according to the number
    and types of parameters passed to it. Method overloading allows you to define
    multiple methods with the same name, but with different signatures. When you call
    overloaded methods, the compiler automatically determines which method should
    be used according to the signature specified in the method call.


    # Note


    > As described earlier, a method signature is the combination of the method''s
    name along with the number and types of the parameters.


    Let''s perform the following steps to create an application named MethodOverloading
    to learn how to overload a method:


    +   1. Repeat the steps 1 to 3 discussed while creating the CreatingMethod application
    in the Defining a Method section of this chapter.

    +   2. Enter MethodOverloading in the Name text box to specify the name of the
    application, and specify an appropriate location for the application in the Location
    combo box.

    +   3. Click the OK button. The MethodOverloading application is created.'
