    \ shown in Fig.C#-10.10:\n\n![](img/2db4b8b2cb67e7ccc52477a61fe289ab_319_0.png)\n\
    \nFig.C#-10.10\n\nIn Fig.C#-10.10, you can see that the Concat() method merges\
    \ the string arrays, city and state and displays the result as a single array\
    \ of strings.\n\n# The Conversion Operators\n\nConversion operators convert a\
    \ collection into an array and change the type of input objects. The different\
    \ conversion operators used in LINQ are the ToSequence(), ToArray(), ToList(),\
    \ ToDictionary(), ToLookup(), OfType(), and Cast() methods.\nThe ToSequence()\
    \ method returns a source argument by changing it to the IEnumerable<T> interface.\
    \ The ToArray() method enumerates a source sequence and returns an array containing\
    \ the elements of the sequence.\nThe ToList() method enumerates a source sequence\
    \ and returns a List<T> interface containing the elements of the sequence. The\
    \ ToDictionary() method lists a source sequence and evaluates the keySelector\
    \ and elementSelector functions for each element to produce the key and value\
    \ of the element in the source sequence.\nThe ToLookup() method implements one-to-many\
    \ dictionaries that map the element key to the sequence of values. The OfType()\
    \ method allocates and returns an enumerable object that captures the source argument.\n\
    The Cast() method is used to cast an element in a sequence to a given type. It\
    \ also allocates and returns an enumerable object that captures the source argument.\n\
    \n# The Aggregate Operators\n\nAggregate operators compute a single value from\
    \ a collection. The different aggregate operators in LINQ are the Aggregate(),\
    \ Average(), Count(), LongCount(), Max(), Min(), and Sum() methods. The Aggregate()\
    \ method calculates a sum value of the values in a collection. The Average() method\
    \ calculates the average value of the values in a collection. The Count() method\
    \ counts the elements in a collection. The LongCount() method counts the elements\
    \ in a large collection. The Max() method determines the maximum value in a collection.\
    \ The Min() method determines the minimum value of a collection. The Sum() method\
    \ calculates the sum of the values in a collection.\n\nNow, let's create a console\
    \ application named AggregateOperatorExample, to show the use of the Sum() method.\
    \ For this, perform the following steps:\n\n+   1. Repeat steps 1 to 3 shown earlier\
    \ while creating the EqualityOperator application in the The Equality Operator\
    \ section of this chapter.\n+   2. Enter AggregateOperatorExample in the Name\
    \ text box to specify the name of the application, and specify an appropriate\
    \ location for the application in the Location combo box.\n+   3. Click the OK\
    \ button. The AggregateOperatorExample application is created.\n+   4. Add the\
    \ code given in Listing 10.10 in the Program.cs file:"
