    Now, let''s learn about the anonymous methods and lambda expressions in the following
    section.


    # ## Exploring Anonymous Functions


    An in-line statement or expression that you use instead of a delegate type is
    referred to as an anonymous function. You can use an anonymous function whenever
    you need to initialize a named delegate or pass it instead of a named delegate
    type as a method parameter.


    There are two kinds of anonymous functions in C#, lambda expressions and anonymous
    methods, which are discussed next.


    # ### Lambda Expressions


    In .NET Framework 3.5, a new syntax for anonymous method was introduced with the
    name lambda expressions. An anonymous function that contains expressions and statements
    to create delegates or expression tree types is called a lambda expression. The
    lambda expressions uses the lambda operator => (pronounced as goes to). The lambda
    operator has right-associativity and its precedence is also same as that of the
    assignment (=) operator. The input parameter is specified on the left side of
    the lambda operator and the expression or the statement is specified on the right
    side, as shown in the following code snippet:


    ```

    `(input parameter) => expression`

    ```


    You can omit parenthesis if the lambda expression has only one parameter. If there
    is more than one parameter, parenthesis is necessary. If there are more than one
    parameter, a comma (,) separates the parameters. If lambda expressions are used,
    there is no need to add a variable to the declaration as the compiler automatically
    adds the variable.


    > > **Note**

    > >

    > > *An expression tree is basically used to represent code in a data structure
    similar to a tree. Each node in the tree is an expression, for instance, method
    invocation or binary operation such as x+y.*


    Using the lambda expressions, you can declare a method code inline instead of
    declaring a method with a delegate as lambda expressions has a concise syntax.


    The lambda expressions are very helpful in writing LINQ query expressions, as
    they provide a very compact and safe way to write functions that are passed as
    arguments for further evaluation.'
