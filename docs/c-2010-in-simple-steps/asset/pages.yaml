    > You can also save the changes in the Program.cs file (or the currently open\
    \ file) by pressing the CTRL+S keys in combination from the keyboard. Similarly,\
    \ you can press the CTRL+SHIFT+S keys to save the changes in all the files of\
    \ an application.\n\nTo save the changes made in the entire application, select\
    \ File→Save All from the menu bar.\n\n10 Select Debug→ Start Debugging from the\
