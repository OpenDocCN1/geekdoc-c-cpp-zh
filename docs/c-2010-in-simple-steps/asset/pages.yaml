- pgno: 67
  md: '# Table 2.4: Operators in C# 2010


    | Category | Operators | Description |

    | :--- | :--- | :--- |

    | Primary | x.y | Dot operator: Accesses the member variables and methods of a
    class. |

    | Primary | f(x) | Parenthesis: Specifies the operation order in an expression
    as well as performs type conversions. It can also be used to invoke a delegate
    or method. |

    | Primary | a[x] | Square brackets: Specifies that square brackets can be used
    with arrays, indexers, pointers, and attributes. |

    | Primary | x++ | Post-Increment operator: Increases the value of its operand
    (x) by 1. It first assigns the value of x and then increments its value. |

    | Primary | x-- | Post-Decrement operator: Decreases the value of its operand
    (x) by 1. It first assigns the value of x and then decrements its value. |

    | Primary | new | new operator: Creates objects and calls constructors. |

    | Primary | typeof | typeof operator: Allows you to discover the information about
    reference and value types using the Type object. |

    | Primary | checked | checked operator: Detects the overflow conditions in integral-type
    arithmetic operations and conversions. |

    | Primary | unchecked | unchecked operator: Ignores the error caused by the overflow
    conditions and accepts the generated result, regardless of the overflow conditions.
    |

    | Primary | -> | Pointer operator: Combines pointer dereferencing and member access.
    |

    | Unary | + | Unary Plus operator: Specifies that this operator is predefined
    for all numeric types and the result of a unary + operation on a numeric type
    is always the value of the operand. For example when you execute the following
    code snippet, the result displayed is 7 as the result of a unary + operation on
    7 is always the value of the operand (7):<br>`int x = 7;`<br>`Console.WriteLine(+x);`
    |

    | Unary | - | Unary minus operator: Specifies that this operator is predefined
    for all numeric types and the result of a unary - operation on a numeric type
    is the numeric negation of the operand. For example when you execute the following
    code snippet, the result displayed is -7 as the result of a unary - operation
    on 7 is always the numeric negation of the operand (7):<br>`int x = 7;`<br>`Console.WriteLine(-x);`
    |

    | Unary | ! | Logical negation operator: Inverts the result of a Boolean expression.
    |

    | Unary | ~ | Bitwise complement operator: Inverts the binary representation of
    an expression. |

    | Unary | ++x | Pre-increment operator: Increases the value of its operand (x)
    by 1. The pre-increment operation returns the value of the operand (x) after it
    has been incremented. |

    | Unary | --x | Pre-decrement operator: Decreases the value of its operand (x)
