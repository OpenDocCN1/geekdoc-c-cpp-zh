    # Using the StackPanel Control


    Suppose you want to place multiple controls on a WPF window such that one appears
    on top of the other, forming a vertical stack of controls. In such a scenario,
    instead of using a Grid or Canvas control and explicitly placing these controls
    accordingly, you can use a StackPanel control. This control is another container
    control that allows you to position its child controls in a vertical or horizontal
    stack. By default, the child controls of the StackPanel control are stacked vertically.
    The vertical stack increases from top to bottom. You can also stack the child
    controls horizontally. The horizontal stack increases from left to right.


    The StackPanel control is represented by the StackPanel class, which is derived
    from the Panel class. The StackPanel class has several properties that help you
    to work with the StackPanel control. Table 7.10 lists the noteworthy properties
    of the StackPanel class:


    # Table 7.10: Noteworthy Properties of the StackPanel Class


    | Property | Description |

    |---|---|

    | CanHorizontallyScroll | Retrieves or sets a value that indicates whether or
    not a StackPanel control can scroll horizontally |

    | CanVerticallyScroll | Retrieves or sets a value that indicates whether or not
    a StackPanel control can scroll vertically |

    | Orientation | Retrieves or sets a value that indicates whether the child controls
    of a StackPanel control are stacked horizontally or vertically |


    Let''s create a standalone WPF application named StackPanelDemo to show the use
    the StackPanel control. For this, perform the following steps:


    +   1. Repeat steps 1 to 3 as followed earlier while creating the GridDemo application
    in the Using the Grid Control section of this chapter.

    +   2. Enter the name StackPanelDemo in the Name text box and specify an appropriate
    location for the application in the Location combo box.

    +   3. Click the OK button. The StackPanelDemo application is created.

    +   4. Add the highlighted code given in Listing 7.12, in the MainWindow.xaml
    file:


    # Listing 7.12: Showing the Code to use a StackPanel Control


    ```

    <Window x:Class="StackPanelDemo.MainWindow"

    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"

    ```'
