- pgno: 343
  md: 'In Table 12.1, the activities that you can use in your Workflow applications
    are enlisted.


    # Host Process


    Since a workflow created with WF is not a standalone product; therefore, it needs
    a host application to be hosted and run. Host process is the process within which
    a workflow is hosted and run. A host process may be a Windows Forms application,
    a Web application, or a Web service application, where a user interaction can
    also take place.


    # Runtime Engine


    A runtime engine is not a separate service or process; it runs within the host
    process and is responsible to manage and execute each workflow instance. A host
    process may have multiple runtime engines running concurrently where each engine
    can execute multiple workflow instances simultaneously.


    # Runtime Services


    Runtime services consist of predefined and user-defined classes that interact
    with system outside the workflow. To run a particular instance of a workflow,
    the workflow runtime depends on a number of runtime services. Custom implementations
    of the runtime services can also be developed to meet the specific needs of an
    application. The runtime services are defined within the System.Workflow.Runtime.Hosting
    namespace. The following are important runtime services provided by WF:


    +   - **Persistence service**: Enables you to save the state of a workflow for
    later use. You can restart the workflow as per the requirement, even after weeks
    of inactivity.

    +   - **Tracking service**: Enables developers to monitor the state of workflows.
    This is particularly useful when you have multiple active workflows at a time
    (for example, a shopping cart application).

    +   - **Transactions services**: Enables transaction support to maintain data
    integrity.


    In this section, we have discussed the various components of WF. Next, let''s
    examine some of the enhancements to WF.


    # Enhancements to Windows Workflow


    WF 4.0 includes several changes as compared to the previous version of WF that
    help to easily create, execute, and maintain Workflow applications. Following
    are some of the improvements in WF 4.0:


    +   - Uses activity as the basic unit of creating a workflow instead of using
    classes such as SequentialWorkflowActivity or StateMachineWorkflowActivity. The
    CodeActivity class can be implemented to perform basic activity functionality.
    However, to customize the basic activity functionality, you should use the NativeActivity
    class.

    +   - Introduces a new control flow activity called the Flowchart, which provides
    an event-driven programming model.

    +   - Introduces the following new features to the built-in activity library:

    +     - Introduces new control flow activities, such as DoWhile, Pick, TryCatch,
    ForEach, Switch, and ParallelForEach.

    +     - Adds activities to the built-in activity library, such as Assign and AddToCollection
    activities to help manipulate data members.

    +     - Introduces new messaging activities such as SendContent and ReceiveReply.

    +     - Adds activities to the built-in activity library, such as TransactionScope
    and Compensate to control transactions.

    +   - Includes the following new options to run workflows:

    +     - WorkflowServiceHost: Specifies a host for workflows.

    +     - WorkflowApplication: Specifies a host for a particular instance of a workflow.

    +     - WorkflowInvoker: Acts as a method call and invokes a workflow.'
