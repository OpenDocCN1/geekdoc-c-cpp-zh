- pgno: 219
  md: 'Apart from including Windows Forms to develop desktop applications, Visual
    Studio 2010 encompasses Windows Presentation Foundation (WPF), previously known
    as Avalon, which offers several features and functionalities to develop high-end
    desktop applications. WPF supports various media, such as text, images, audio,
    and video, and allows you to work with two-dimensional (2D) as well as three-dimensional
    (3D) graphics. Unlike Windows Forms, which require numerous technologies, such
    as Graphics Device Interface (GDI+), Windows Media Player, and DirectX application
    programming interfaces (APIs) to work with 2D, 3D, and multimedia, WPF offers
    a cohesive medium that inherently provides the functionality of these technologies.
    This implies that you do not need to separate APIs in WPF to work with graphics,
    animations, and multimedia, and therefore it is easier and simpler to develop
    graphic-rich desktop applications by using WPF.


    WPF was initially incorporated with .NET Framework 3.0 and was fully included
    in .NET Framework 3.5 and Visual Studio 2008. The version of WPF included in .NET
    Framework 4.0 is WPF 4.0.


    In this chapter, you learn about the architecture of WPF 4.0, the improvements
    and enhancements in WPF 4.0, and the different types of WPF 4.0 applications.
    In addition, you learn about the WPF 4.0 Designer, the use of Extensible Application
    Markup Language (XAML) in WPF, and some of the common and new controls of WPF
    4.0. You also learn how to use resources and styles in WPF.


    We start the chapter by discussing the architecture of WPF 4.0.


    # Explaining the WPF 4.0 Architecture


    Although WPF 4.0 is a part of .NET Framework 4.0, it has both managed and unmanaged
    components. The managed and unmanaged components of WPF 4.0 are shown in Fig.C#7.1:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_219_0.png)


    Fig.C#7.1


    As shown in Fig.C#7.1, WPF 4.0 consists of the PresentationFramework, PresentationCore,
    WindowsBase, Common Language Runtime (CLR), Media Integration Layer (MIL or milcore),
    User32, DirectX, and Kernel components. The components that are shaded, that is,
    PresentationFramework, PresentationCore, WindowsBase, and milcore, are those that
    are essential to work with WPF 4.0 applications. To ensure that there is tight
    integration with DirectX, milcore is written in unmanaged code.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '> Note

    > The CLR, WindowsCodecs, User32, DirectX, and Kernel components of WPF 4.0 are
    part of the Microsoft Windows Vista operating system and it is beyond the scope
    of this chapter to discuss them.


    Now, let''s briefly discuss the components of WPF 4.0 in detail.


    # The PresentationFramework Component


    The PresentationFramework component refers to the PresentationFramework.dll assembly
    in .NET Framework 4.0. This component offers classes to control the appearance
    and presentation of WPF 4.0 applications. For instance, controls, layout, and
    data binding in WPF applications are handled by the PresentationFramework component.


    # The PresentationCore Component


    The PresentationCore component is implemented as the PresentationCore.dll assembly
    in .NET Framework 4.0. This component provides some of the most commonly used
    types and features of WPF 4.0. The classes and types offered by the PresentationCore
    component provide certain essential functionalities, such as properties, and events
    in WPF 4.0. Note that the PresentationCore component does not offer types for
    the user interface (UI) of WPF 4.0 applications such as those offered by the PresentationFramework
    component.


    # The WindowsBase Component


    The WindowsBase component is implemented as the WindowsBase.dll assembly in .NET
    Framework 4.0. This component provides the fundamental features of WPF, such as
    threading. Some of these features can be accessed and used outside the WPF domain.


    # The MIL or Milcore Component


    WPF 4.0 also contains an unmanaged component called milcore. An unmanaged component
    in WPF 4.0, milcore interacts with DirectX and acts as a medium or interface between
    CLR and DirectX (and managed WPF components). Due to this interaction with DirectX,
    milcore enables the display of 2D as well as 3D content in WPF 4.0 applications.


    Now, let''s discuss the various improvements in WPF 4.0.


    # Exploring the Improvements in WPF 4.0


    WPF forms an essential component of the .NET Framework that enables .NET application
    developers to create WPF applications with visually appealing UIs. Using WPF 4.0,
    .NET developers can integrate 3D graphics, multimedia, animation, document support,
    speech recognition, and more into the applications. WPF 4.0 introduces a few improvements
    that include the following:


    +   - **Addition of new controls:** Refers to the introduction of the new controls
    such as DataGrid, Calendar, and DatePicker. These controls enable application
    developers to create enhanced enterprise-level applications. In addition, these
    controls are 99% compatible with their Silverlight versions, which allow the reuse
    of code between Silverlight and WPF implementations.

    +   - **Touch input and their manipulation:** Refers to the support for touch
    input that WPF 4.0 elements provide. The UIElement 3D, and ContentElement classes
    consist of events that are raised when a user touches an element on a touch-screen.
    You can manipulate the UIElement class by rotating, scaling or translating it.
    For instance, when you can view some photographs in an application, you are able
    to zoom, move, resize, or rotate the photograph on the computer screen.

    +   - **New text rendering stack:** Refers to the improvements made in rendering
    text, which include text clarity, configurability, and support for international
    languages. Moreover, users can now select from auto, aliased, grayscale or ClearType
    text rendering modes. In addition to all this, the text stack includes support
    for the display-optimized character layout so that text with sharpness comparable
    to Win32/GDI text can be generated.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   - **Improved support for deployment:** Implies the improvements that have
    been made to the deployment size, time, and to the overall deployment experience.
    A WPF application can either target the standard installation of the full **.NET
    Framework 4.0** or **.NET Framework 4 Client Profile**. **.NET Framework 4 Client
    Profile** is a subset of the full **.NET Framework 4.0**. The overall application
    deployment experience is improved when WPF applications target **.NET Framework
    4 Client Profile**, as it contains only those functionalities that are required
    by desktop applications, such as Windows Forms and WPF. Therefore, instead of
    targeting the full **.Net Framework 4.0**, desktop applications generally target
    **.NET Framework 4 Client Profile** by default.


    Now that you have learned about the architecture of WPF 4.0 and the improvements
    made to it, let''s discuss the type of WPF applications you can create.


    # Describing Types of WPF Applications


    You can develop WPF 4.0 applications by using Visual Studio 2010. There are broadly
    two types of WPF applications supported by Visual Studio 2010, standalone WPF
    applications and XAML browser applications (also known as XBAPs). Let''s learn
    about these two types of applications in detail, in the following sections.


    # Standalone WPF Applications


    Standalone WPF applications are similar to Windows Forms applications, that is,
    you can install standalone applications on users'' computers and view them from
    the Start menu. Note that a standalone WPF application has the same privileges
    as that of a currently logged-in user. In other words, this means that a standalone
    WPF application has full access to a system''s resources, if the currently-logged
    on user has full access to the system''s resources. Let''s now learn how to create
    a standalone WPF application.


    In Visual Studio 2010, you can easily and quickly create a standalone WPF application,
    by using the project template. When you use the project template of Visual Studio
    2010 to create a standalone WPF application, the essential files are automatically
    added in the application.


    Perform the following steps to create a standalone WPF application in Visual Studio
    2010:


    +   1. Click **Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010** on your computer to open the Visual Studio 2010 IDE.

    +   2. Select **File→New→Project** from the menu bar in the Visual Studio 2010
    IDE, to open the **New Project** dialog box.

    +   3. Select **Visual C#→Windows** in the **Installed Templates** pane of the
    **New Project** dialog box. The **New Project** dialog box contains the **WPF
    Application** project template in the middle pane. This template includes the
    initial files and folders required while creating standalone WPF applications.

    +   4. Select **WPF Application** from the middle pane of the **New Project**
    dialog box.

    +   5. Enter an appropriate name and location for the standalone WPF application
    in the **Name** text box and **Location** combo box, respectively. In our case,
    we have specified **MyFirstWPFApplication** as the name and selected the default
    location, which is **C:\Users\temp\Documents\Visual Studio 2010\Projects**.

    +   6. Click the **OK** button in the **New Project** dialog box. The **New Project**
    dialog box closes and a new standalone WPF application named **MyFirstWPFApplication**
    is created, as shown in Fig.C4-7.2:'
  merge: -1
  img_proc: true
