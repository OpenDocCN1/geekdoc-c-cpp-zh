  md: '# Changing the Title of a Form


    The default title of the form in a Windows Forms application is set to Form1.
    However, you can change the title of a form at design time as well as at run time
    by changing the Text property of the form.


    Let''s create a Windows Forms application, SampleApplication, in which you can
    change the title of the Form1 form by performing the following steps:


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010 to open the Visual Studio 2010 IDE.

    +   2. Select File→New→Project from menu bar in Visual Studio 2010 IDE. The New
    Project dialog box appears.

    +   3. Select Visual C#→Windows in the Installed Templates pane and Windows Forms
    Application option in the middle pane in the New Project dialog box.

    +   4. Enter SampleApplication in the Name text box and specify an appropriate
    location in the Location combo box.

    +   5. Click the OK button. The SampleApplication application is created with
    the specified name and location.

    +   6. Click anywhere on the Form1 form and press the F4 key to open its Properties
    window.

    +   7. Set the Text property of the Form1 form to FirstForm in the Properties
    window (Fig.C#5.1).


