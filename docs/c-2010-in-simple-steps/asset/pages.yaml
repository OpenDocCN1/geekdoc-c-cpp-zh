    Next, let''s learn about the Properties window in Visual Studio 2010 IDE.


    # ## The Properties Window


    There are several projects, files, and resources that you work with while developing
    a .NET application in Visual Studio 2010. These projects and files have various
    attributes or properties, which you can view and set in the **Properties** window.
    The **Properties** window displays the properties of a solution, projects, files,
    and UI elements of a .NET application. Fig.C#-1.40 shows the properties of the
    **Form1** form in the **Properties** window, which appears when you select the
    **Form1** node in Solution Explorer and click the **Properties** button in the
    toolbar of Solution Explorer.


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_39_0.png)


    In Fig.C#-1.40, you can see that the properties of the **Form1** form in the **Properties**
    window appear grouped in different categories, such as **Behavior**.


    In Fig.C#-1.41, the properties of the **Form1** form are alphabetically grouped.
    You can group the properties of a form in alphabetical order by clicking the **Alphabetical**
    button on the toolbar of the **Properties** window, shown in Fig.C#-1.41:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_39_1.png)


    > > **Tip**

    > > *You can open the Properties window by selecting View->Properties Window from
    the menu bar or by pressing the F4 key from the keyboard.*


    Next, let''s learn about Toolbox in Visual Studio 2010 IDE.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Toolbox


    Toolbox is a window that contains icons for various items and controls that you
    can add to a .NET application to design the UI of the application. The icons in
    Toolbox are logically grouped under different tabs, such as Common Controls, Menus
    & Toolbars, and Containers. Each tab contains the icons of the UI items and controls
    that pertain to a specific category; for example, the Containers tab contains
    the icons of those controls that allow you to group Windows controls, such as
    buttons, labels, text boxes, and radio buttons. Fig.C+1.42 shows Toolbox containing
    the controls for a Windows Forms application:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_40_0.png)


    Fig.C+1.42


    To view the icons of the controls in a particular tab of Toolbox, you need to
    expand the tab by clicking it so that the triangle glyphs present on the left
    hand side of the name of the tab are expanded. The collapsed tabs, such as All
    Windows Forms and Containers (Fig.C+1.42), have an empty triangle. Fig.C+1.42
    shows the Common Controls tab in its expanded form:


    # Tip


    > You can open Toolbox by selecting View→Toolbox from the menu bar or by pressing
    the CTRL+ALT+X keys in combination from the keyboard.


    Now, let''s learn about Designer and Code Editor in Visual Studio 2010.


    # Designer and Code Editor


    As the name suggests, the designer helps you to design the UI of the application,
    while Code Editor helps you to add the code or functionality for the application.
    The available designer and Code Editor depend on the type of application and file
    with which you are working. Fig.C+1.43 show the designer for a Windows Forms application:
    Visual Studio 2010 IDE offers windows called designer and Code Editor to help
    you develop .NET application easily and quickly.


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_40_1.png)


    Fig.C+1.43'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Fig.C#1.44 shows the Code Editor window for a Windows Forms application:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_41_0.png)


    Fig.C#1.44


    Next, let''s learn about Server Explorer component in Visual Studio 2010.


    # Server Explorer


    Server Explorer refers to a window that you can use to connect to a database server
    and other services on a computer. In other words, Server Explorer allows you to
    create, modify, and close connections to databases. You can also add tables and
    query the databases or work with various system-specific services, such as event
    logging, message queues, and performance counters. Fig.C#1.45 shows Server Explorer
    with connections to different databases and services on a local computer:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_41_1.png)


    Fig.C#1.45


    # Tip


    > To open Server Explorer, select View→Server Explorer from the menu bar or press
    the CTRL+ALT+S keys in combination from the keyboard.


    Next, we discuss about the Output window in Visual Studio 2010.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# The Output Window


    When you compile or execute a .NET application, various status messages about
    the features in the Visual Studio IDE are generated and displayed in the Output
    window. This window displays these messages depending on the status of the compilation
    or execution of the application. Fig.C#1.46 displays the Output window when a
    Windows Forms application is compiled or build:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_42_0.png)


    Fig.C#1.46


    You can specify whether or not you want to view the messages during compilation
    or execution by selecting the Build or Debug option from the drop-down list that
    appears on top of the toolbar of the Output window.


    > **Tip**

    > To open the Output window in an application, select View→Output from the menu
    bar or press the CTRL+ALT+O keys in combination from the keyboard.


    Next, let''s learn about the Object Browser window in Visual Studio 2010.


    # The Object Browser Window


    The Object Browser window allows you to view the entities or objects, such as
    namespaces, classes, properties, methods, and events, which are available for
    an application. The Object Browser window has three panes: Object, Members, and
    Description. The Object pane appears on the left side, the Members pane appears
    on the upper-right side, and the Description pane on the lower-right side of the
    Object Browser window. Fig.C#1.47 shows Object Browser window:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_42_1.png)


    Fig.C#1.47


    In Fig.C#1.47, the Object pane of the Object Browser window displays the assemblies,
    such as System.Collections.Generic, System.Collections.ObjectModel, and System.ComponentModel
    of the application in the form of nodes. You can expand the nodes by clicking
    them such that the empty triangle beside the selected node changes to a filled
    triangle. When you expand a node, you can view the namespaces that exist in the
    assembly in the form of child nodes of the expanded node. When you expand a namespace
    node, you can view the classes contained in the namespace. In addition, when you
    select a class, the properties and methods of the class appear in the Members
    pane, and a description of the class appears in the Description pane (Fig.C#1.47).'
  merge: -1
  img_proc: true
- pgno: 43
  md: '> > **Tip**

    > >

    > > *To open Object Browser window, select View → Object Browser from the menu
    bar or press the CTRL+ALT+J keys in combination from the keyboard.*


    Next, let''s discuss about the Class View window.


    # ### The Class View Window


    The Class View window enables you to view items, such as assemblies, namespaces,
    classes, properties, and methods referenced or used in the current .NET application,
    in a hierarchical manner. The Class View window has two panes, Objects and Members,
    as shown in Fig.C#-1.48:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_43_0.png)


    Fig.C#-1.48


    As you can see in Fig.C#-1.48, the upper half of the Class View window is the
    Objects pane and the lower half is the Members pane. In the Objects pane, the
    projects of a solution form the top-level nodes of the hierarchical display. The
    child nodes of the project, WindowsFormsApplication1 represent the classes used
    in the project. Note that when you select a class node in the Objects pane of
    the Class View window, the properties and methods of the class are displayed in
    the Members pane.


    > > **Tip**

    > >

    > > *You can open the Class View window by selecting View → Class View from the
    menu bar or by pressing the CTRL+SHIFT+C keys in combination from the keyboard.*


    After getting familiar with the various components of the Visual Studio 2010 IDE,
    let''s learn to create application using Visual Studio 2010. As stated earlier,
    Visual Studio 2010 offers a comprehensive and all-inclusive environment to allow
    you to develop various types of applications, such as console, Windows, and Web
    applications. Let''s learn how to create these types of applications in the following
    sections.


    # ## Creating Simple Visual Studio 2010 Applications


    Visual Studio 2010 provides several project templates to develop different types
    of .NET applications. The project templates offer an easy and convenient means
    of developing .NET applications because these project templates by default include
    the files and assemblies that are required in the application.


    .NET applications can be broadly categorized as follows:


    +   - Console applications

    +   - Windows Forms applications

    +   - Web applications


    Let''s learn to create, save and run these different types of applications, starting
    with a console application.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Creating, Saving, and Running a Console Application


    Console applications refer to those .NET applications that do not have a GUI,
    apart from a command-line console. Users of a console application can interact
    with the application only through the command-line console, which means that data
    is displayed and read from the command-line. This makes console applications suitable
    in situations where user interaction is not required. Visual Studio 2010 offers
    an easy way to develop console applications by providing the appropriate project
    template.


    Let’s perform the following steps to create, save, and run a console application
    by using Visual Studio 2010:


    +   1. *Click* Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010 to open the Visual Studio 2010 IDE.

    +   2. *Select* File→New→Project from the menu bar. The New Project dialog box
    appears (Fig.C7-1.49).

    +   3. *Select* the Visual C# option in the Installed Templates pane. The installed
    project templates available for C# are displayed in the middle pane of the New
    Project dialog box (Fig.C7-1.49).

    +   4. *Select* Console Application from the middle pane of the dialog box to
    create a console application (Fig.C7-1.49).

    +   5. *Enter* an appropriate name for the console application in the Name text
    box. In our case, we have entered MyFirstConsoleApplication as the name (Fig.C7-1.49).

    +   6. *Enter* the path of the folder for the console application in the Location
    combo box. In our case, we have entered the location as D:\C# 2010 Applications
    (Fig.C7-1.49).

    +   7. *Click* the OK button, as shown in Fig.C7-1.49:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_44_0.png)


    The MyFirstConsoleApplication console application is created, as shown in Fig.C7-1.50:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_44_1.png)'
  merge: -1
  img_proc: true
