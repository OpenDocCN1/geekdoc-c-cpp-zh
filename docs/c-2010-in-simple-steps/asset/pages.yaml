    Now, let''s learn about the multicast delegates next.


    # Creating Multi-Cast Delegates


    In C#, you can create a multicast delegate that can hold references to more than
    one method. Multicast delegates derive from the MulticastDelegate class, which
    is a subclass of Delegate class and used to implement event handling.


    The syntax to define a multicast delegate is as follows:


    ```

    delegate void delegate_name(parameter_list);

    ```


    To invoke a multicast delegate, the delegate object is instantiated by passing
    the name of the method that it encapsulates in parenthesis. The methods that the
    delegate object encapsulates are called in the order the methods are specified
    in the delegate object. A multicast delegate object maintains a list of methods,
    also known as an invocation list, which is called when the delegate is invoked.
    You can add method references to your delegate object using the += operator and
    delete method references using the -= operator. However, note that the methods
    that you define must not have any return type.


