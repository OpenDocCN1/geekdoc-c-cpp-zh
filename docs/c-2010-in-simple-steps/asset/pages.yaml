    Now, let''s learn about the printing controls.


    # Using the Printing Controls


    In C# 2010, there are several controls that allow you to incorporate UI functionality
    of printing documents in .NET applications. There are two main controls that pertain
    to the printing process in C# 2010. They are as follows:


    +   - PrintDocument control

    +   - PrintDialog control


    Now, let''s learn about these two controls in the following section.


    # The PrintDocument Control


    The PrintDocument control represents an object, containing the document that a
    user wants to print. This control allows you to set various properties, such as
    DefaultPageSettings, and DocumentName for printing a document. As the PrintDocument
    control does not have any UI, therefore, it is not visible at run time.


    The PrintDocument control is an instance of the PrintDocument class that exists
    in the System.Drawing.Printing namespace. The PrintDocument class has several
    properties and methods that facilitate the printing process.


    Table 6.23 lists noteworthy properties of the PrintDocument class:


    Table 6.23: Noteworthy Properties of the PrintDocument Class


    | Property | Description |

    |---|---|

    | DefaultPageSettings | Retrieves or sets default page settings for all pages
    to be printed |

    | DocumentName | Retrieves or sets the name of the document to display while printing
    the document |

    | PrinterSettings | Retrieves or sets the printer that prints the document |


    Table 6.24 lists noteworthy events of the PrintDocument class:


    Table 6.24: Noteworthy Events of the PrintDocument Class


    | Event | Description |

    |---|---|

    | BeginPrint | Occurs after the Print() method is called but before the first
    page is printed |

    | EndPrint | Occurs after the last page of the document is printed |

    | PrintPage | Occurs when output to print for the current page is needed |

    | QueryPageSettings | Occurs just before a PrintPage event occurs |'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The PrintDocument class also has a method named Print, which allows you to
    start the printing process of a document.


    # The PrintDialog Control


    The PrintDialog control displays the Print dialog box that allows you to print
    a document. The Print dialog box allows you to select a printer and specify various
    options and settings, such as whether you want to print all the pages or only
    specific pages and how many copies of the document are to be printed. Note that
    without the PrintDialog control; the document is printed using the default printer
    and printer settings.


    The PrintDialog control is an instance of the PrintDialog class that exists in
    the System.Windows.Forms namespace. The PrintDialog class provides several properties
    and methods that you can use to print documents.


    Table 6.25 lists noteworthy properties of the PrintDialog class:


    Table 6.25: Noteworthy Properties of the PrintDialog Class


    | Property | Description |

    |---|---|

    | AllowCurrentPage | Retrieves or sets a value that indicates whether the users
    have the facility to print only the current page |

    | AllowPrintToFile | Retrieves or sets a value that indicates whether the Print
    to file check box is enabled |

    | AllowSomePages | Retrieves or sets a value that indicates whether the users
    have the facility to specify a range of pages |

    | Document | Retrieves or sets the PrintDocument object |

    | PrinterSettings | Retrieves or sets the printer settings which are modified
    in the Print dialog box |

    | PrintToFile | Retrieves or sets a value that indicates whether the Print to
    file check box is selected |


    The PrintDialog class provides a method named Reset that allows you to reset all
    dialog box options to their default values.


    Prior to displaying the Print dialog box using the PrintDialog control, you must
    set its Document property to a PrintDocument object. Moreover, you also need to
    set the PrinterSettings property of the PrintDocument object to the PrinterSettings
    property of the PrintDialog control.


