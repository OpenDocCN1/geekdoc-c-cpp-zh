  md: "# Implementing Encapsulation\n\nEncapsulation is a process of hiding the internal\
    \ details of an object and showing only the relevant information to a user. It\
    \ is a way to organize data and methods into a structure by hiding the way an\
    \ object is implemented. Encapsulation, therefore, helps to protect data from\
    \ being misused and also prevents access to data by any means other than those\
    \ specified.\n\nEncapsulation is implemented through access modifiers. Access\
    \ modifiers help to implement this feature by defining a scope to access data\
    \ and methods in a restricted manner. Consequently, you can describe encapsulation\
    \ as the ability of an object to hide its internal data and methods, and make\
    \ only the intended parts of the object programmatically accessible.\n\nLet’s\
    \ perform the following steps to create a console application named EncapsulationExample\
    \ to learn how to implement encapsulation:\n\n+   1. Repeat the steps 1 to 3 discussed\
    \ while creating the CreatingMethod application in the Defining a Method section\
    \ of this chapter.\n+   2. Enter EncapsulationExample in the Name text box to\
    \ specify the name of the application, and specify an appropriate location for\
    \ the application in the Location combo box.\n+   3. Click the OK button. The\
    \ EncapsulationExample application is created.\n+   4. In the Program.cs file,\
    \ add the highlighted code given in Listing 4.18:\n\nListing 4.18: Implementing\
    \ Encapsulation\n\n```\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\nusing System.Text;\nnamespace EncapsulationExample\n{\n    class\
    \ MyClass\n    {\n        private int x;\n        private float y;\n        protected\
    \ int z;\n        private void add()\n        {\n            Console.WriteLine(\"\
    This is a private method\");\n        }\n        public void sub()\n        {\n\
    \            Console.WriteLine(\"This is a public method\");\n        }\n    \
    \    protected void div()\n        {\n            Console.WriteLine(\"This is\
    \ a protected method\");\n        }\n    }\n    class Program : MyClass\n    {\n\
    \        static void Main(string[] args)\n        {\n            Program prg =\
    \ new Program();\n            prg.div();\n            prg.z = 20;\n          \
    \  prg.sub();\n            Console.ReadLine();\n        }\n    }\n```"
