  md: "# Pass by Reference\n\nWhen you want to treat the C# value types as reference\
    \ types or simply wish to retain any changes made to the value of a parameter\
    \ in a method, you can use the pass by reference mechanism. In other words, it\
    \ means that when you pass a value by reference, you actually pass the address\
    \ of that value and not a copy. Therefore, any changes made to it inside the method\
    \ persist outside the method as well. In C#, a parameter is passed by reference\
    \ using the ref and out keywords. We shall, however, describe how to pass a parameter\
    \ by reference using the ref keyword only. Let's perform the following steps to\
    \ pass a parameter by reference:\n\n+   1. Repeat steps 1 to 3 of the Defining\
    \ a Method section of this chapter.\n+   2. Enter PassByRef in the Name text box\
    \ to specify the name of the application, and specify an appropriate location\
    \ for the application in the Location combo box. In our case, we have selected\
    \ the default location, which is C:\\Users\\temp\\documents\\visual studio 2010\\\
    Projects.\n+   3. Click the OK button. The PassByRef application is created.\n\
    +   4. In the Program.cs file, add the highlighted code snippet given in Listing\
    \ 4.6:\n\nListing 4.6: Passing Parameters by Reference to a Method\n\n```\nclass\
    \ Program\n{\n    public static void ChangeValue(ref int x)\n    {\n        x\
    \ = x * x;\n        Console.WriteLine(\"The value inside the method: {0}\", x);\n\
    \    }\n    static void Main(string[] args)\n    {\n        int num = 5;\n   \
    \     Console.WriteLine(\"The value before calling the method: {0}\", num);\n\
    \        ChangeValue(ref num);\n        Console.WriteLine(\"The value after calling\
    \ the method: {0}\", num);\n        Console.ReadLine();\n    }\n}\n```\n\nIn Listing\
    \ 4.6, a method called ChangeValue() is defined, which takes the value of an integer\
    \ variable x as argument. The argument value is passed using the ref keyword in\
    \ the call for the ChangeValue() method. The ChangeValue() method computes the\
    \ square of the value inside the variable x and displays the same on the screen.\
    \ A local integer variable num is declared and assigned the value 5 inside the\
    \ Main() method. A call to the ChangeValue() method is made by passing the value\
    \ of variable num by reference; therefore, any changes made to num will cause\
    \ its value to be changed outside the ChangeValue()method.\n\n+   5. Press the\
    \ F5 key to run the PassByRef application.\n\nThe output of the application appears,\
    \ as shown in Fig.C4.4.5:\n\n![](img/2db4b8b2cb67e7ccc52477a61fe289ab_112_0.png)\n\
    \nIn Fig.C4.4.5, you can see that initially before any call to the method ChangeValue()\
    \ has been made, the value of num is 5. During the call to the method, the argument's\
    \ reference is passed, due to which the method accesses the referred memory location\
    \ and performs the necessary modifications on the variable at its memory location.\
    \ Therefore, the original value of the variable num is changed after the call\
    \ to the method ChangeValue()."
