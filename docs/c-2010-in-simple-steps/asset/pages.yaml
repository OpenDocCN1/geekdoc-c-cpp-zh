  md: "![](img/2db4b8b2cb67e7ccc52477a61fe289ab_89_0.png)\n\nFig.C+3.8\n\nNow, let's\
    \ learn about the switch statement.\n\n# The Switch Statement\n\nAnother form\
    \ of selection statement in C# is the switch statement, which is an alternative\
    \ for making selections in an easier way. Unlike the if statement that can be\
    \ used to check only a limited number of conditions, a switch statement allows\
    \ you to provide a list of possible values for a variable. You should use the\
    \ switch statement with the case statement and there can be any number of case\
    \ statements inside the switch statement. The switch statement passes the program\
    \ control to one of the case statements whose value matches with that of the variable\
    \ specified in the switch statement. The syntax of the switch statement is as\
    \ follows:\n\n```\n```\nswitch (variablename) // test expression\n{\n    case\
    \ 1://constant-expression\n    {\n        //statement\n    }\n    break;\n   \
    \ case 2://constant-expression\n    {\n        //statement\n    }\n    break;\n\
    \    default:\n    break;\n}\n```\n```\n\nIn the preceding syntax, the switch\
    \ statement compares a test expression with different case statements. The program\
    \ control passes from one case to another until a case statement is found whose\
    \ constant-expression matches with that of the test expression. The statements\
    \ within that case statement are then executed.\n\nNow, let's create a console\
    \ application named SwitchStatement to demonstrate how to use the switch statement.\
    \ Perform the following steps to create the SwitchStatement application:\n\n+\
