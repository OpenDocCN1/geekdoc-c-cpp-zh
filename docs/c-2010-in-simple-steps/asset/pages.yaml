    # Handling Common Events for Windows Forms Applications


    C# is an event driven language, a language in which the flow of the program is
    controlled by user actions, such as pressing a key or clicking a control. You
    can write code to handle an event in the code designer.


    There are mainly two types of events:


    +   - Mouse events: Refers to events generated by supplying the input through
    a mouse

    +   - Keyboard events: Refers to events generated by supplying the input through
    keyboard


    Let''s first learn to handle mouse events.


    # Handling Mouse Events


    The most common mouse event associated with controls in C# is the Click event.


    Let''s learn to handle the Click event of a Button control by performing the following
    steps:


    +   1. Repeat steps 1 to 3 of the Changing the Title of a Form section of this
    chapter.

    +   2. Enter MouseEvent in the Name text box and specify an appropriate location
    in the Location combo box.

    +   3. Click the OK button. The MouseEvent application is created with the specified
    name and location.

    +   4. Drag a Button control and TextBox control from Toolbox and drop these controls
    on the Form1 form (Fig.C#5.24).

    +   5. Set the Text property of button1 to Click in the Properties window, as
    shown in Fig.C#5.24:'
