    \nIn Fig.C#10.8, you can see that the words in Listing 10.7 have been arranged\
    \ alphabetically by using the Group clause.\n\nNext, let's learn about generation\
    \ operators.\n\n# The Generation Operators\n\nGeneration operators help to create\
    \ a new sequence of values in a collection. The generation operators used in LINQ\
    \ include the DefaultIfEmpty(), Empty(), Range(), and Repeat() methods.\n\nThe\
    \ DefaultIfEmpty() method replaces an empty collection with the default collection.\
    \ The Empty() method refers to an empty collection. The Range() method generates\
    \ a collection that contains a sequence of integer numbers. This method accepts\
    \ two integer type parameters, namely start and count. The start parameter refers\
    \ to the value of the first number to be generated in the sequence while the count\
    \ parameter specifies the total number of integer values to generate in the sequence.\n\
    \n> Note\n> \n> The Range() method throws an ArgumentOutOfRangeException exception\
    \ if the value of the count parameter specified is less than 0, or if the expression\
    \ start + count -1 is evaluated to a value larger than the maximum value that\
    \ an integer can hold in the .NET Framework.\n> \n> The Repeat() method generates\
    \ a collection that contains at least one repeated value. The Empty() method caches\
    \ a single empty sequence of a given type."
