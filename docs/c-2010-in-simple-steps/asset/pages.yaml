  md: "As shown in Fig.C#.8.36, when you click the **SHOW DATA** button, a message\
    \ box appears. The title of the message box is bound to the name of the employee\
    \ you entered in the **Binding to a CLR Object** window, and it displays the ID\
    \ of the employee.\n\nIn this section, you learned how to perform binding to CLR\
    \ objects, such as properties of controls. Now, let's learn to perform binding\
    \ to ADO.NET objects.\n\n# ## Binding to ADO.NET Objects\n\nYou can also bind\
    \ an ADO.NET object to a WPF application. For example, you can bind a data table\
    \ to a WPF application. You can implement the **IBindingList** interface to provide\
    \ change notifications. The **IBindingList** interface provides features that\
    \ support both complex and simple data binding to a data source. While binding\
    \ your WPF application to an ADO.NET object, the first step is to create a connection\
    \ with a database. After establishing the connection, the adapter is created,\
    \ which executes the SQL statement to retrieve the record from the database. The\
    \ result is stored in the data table of the dataset by calling the **Fill()**\
    \ method of the adapter. This result is then displayed in the WPF control.\n\n\
    To bind a WPF application to an ADO.NET object, you first need to create a connection\
    \ string to bind your WPF application to an ADO.NET object. You then need to bind\
    \ your controls by specifying the **ItemSource** and **ItemTemplate** properties.\
    \ To display a particular column data, you should specify the **DisplayMemberBinding**\
    \ property. Let's create an application in which you can bind an ADO.NET object\
    \ to a WPF application. For this, perform the following steps:\n\n+   1. Create\
    \ a WPF application named **BindingtoADO.NET**.\n+   2. Set the title of the **MainWindow**\
    \ window to **Binding to ADO.NET** by using the **Title** property.\n+   3. Add\
    \ the highlighted code given in Listing 8.13 to the **MainWindow.xaml** file.\n\
    \nListing 8.13: Adding the Code in the MainWindow.xaml File\n\n```\n```xml\n<Window\
    \ x:Class=\"BindingtoADO.NET.MainWindow\"\n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
