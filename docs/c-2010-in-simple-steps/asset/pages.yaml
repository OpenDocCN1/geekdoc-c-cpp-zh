- pgno: 265
  md: 'Table 8.1: Types of ADO.NET Data Providers


    | Data Provider | Description |

    |---|---|

    | .NET Framework Data Provider for Oracle | Provides access to Oracle database
    8.1.7 and later versions. It uses the System.Data.OracleClient namespace. |


    The data provider contains the following four main objects:


    +   - **Connection**: Establishes a connection with a database. The base class
    for all the Connection objects is the DbConnection class. Connection objects have
    methods for opening and closing a connection. The .NET Framework provides two
    types of Connection objects, the SqlConnection object, which is designed specifically
    to connect to Microsoft SQL Server and the OleDbConnection object, which is designed
    to provide connections to a wide range of databases, such as Microsoft Access
    and Oracle. Some commonly used methods of the Connection object are the Open()
    and Close() methods. The Open() method is used to open a connection with the database
    and the Close() method is used to close the connection.

    +   - **Command**: Executes a command against the database and retrieves a DataReader
    or DataSet object. It also executes the INSERT, UPDATE, or DELETE command against
    the database. The base class for all Command objects is the DbCommand class. The
    Command object is represented by two classes, SqlCommand and OleDbCommand. The
    Command object provides three methods to execute commands on a database: ExecuteNonQuery(),
    ExecuteScalar(), and ExecuteReader(). The ExecuteNonQuery() method executes commands
    that have no return value, such as INSERT, UPDATE, or DELETE. The ExecuteScalar()
    method returns a single value from a database query. The ExecuteReader() method
    returns a result set as a DataReader object.

    +   - **DataReader**: Retrieves data from the database in a forward-only, read-only
    mode. The base class for all DataReader objects is the DbDataReader class. The
    DataReader object is returned when the ExecuteReader() method of the Command object
    is called.

    +   - **DataAdapter**: Retrieves data from a database and stores that data in
    a DataSet object and reflects the changes made in the DataSet object to the database.
    The base class for all DataAdapter objects is the DbDataAdapter class. The DataAdapter
    object acts as an intermediary for all communication between the database and
    the DataSet object. The DataAdapter object is used to fill a DataTable or DataSet
    object with data from the database by using the Fill() method. The DataAdapter
    object commits the changes to the database by calling the Update() method. The
    DataAdapter object provides four properties that represent the database command:
    SelectCommand, InsertCommand, DeleteCommand, and UpdateCommand.


    # Datasets


    The other major component of ADO.NET is the DataSet object. This object always
    remains disconnected from the database, consequently reducing the load on the
    database. The DataSet object is used to connect a DataSet object to a data provider.
    The DataAdapter object is used as an intermediary between the DataSet object and
    the data provider. The data in the DataSet object can be manipulated and updated
    independent of the database as the DataSet object maintains a cached copy of the
    data from a database. Table 8.2 lists the various components that make up a DataSet
    object:


    Table 8.2: Components of the DataSet Object


    | Component | Description |

    |---|---|

    | DataRelationCollection | Contains a collection of DataRelation objects for a
    DataSet object. A DataRelation class is used to represent the parent/child relationship
    between tables in a database. |

    | ExtendedProperties | Contains custom information, such as an SQL statement to
    retrieve data or the time when data was retrieved from a database |

    | DataTableCollection | Contains all the tables retrieved from a database |'
  merge: -1
  img_proc: true
- pgno: 266
  md: '**Table 8.2: Components of the DataSet Object**


    | Component | Description |

    |---|---|

    | DataTable | Represents a table in the **DataTableCollection** object of a **DataSet**
    object |

    | DataRelation | Represents a relationship in the **DataRelationCollection** object
    of a **DataSet** object |

    | DataRowCollection | Contains all the rows in a **DataTable** object |

    | DataView | Represents a fixed customized view of a **DataTable** object |

    | PrimaryKey | Represents a column that uniquely identifies a row in a **DataTable**
    object |

    | DataColumnCollection | Contains all the columns in a **DataTable** object |


    Now, that you have learned about some of the important components of the **DataSet**
    object, let''s discuss the basic operations that you can perform on a database
    by using ADO.NET.


    # ## Basic Operations in ADO.NET


    Using ADO.NET, you can access, handle, and update data from databases in a consistent
    manner. In the following section, you learn to make use of the different components
    of ADO.NET to connect to a database, create a command, create a **DataSet** object,
    use a data adapter to retrieve data in a dataset, update a database by using datasets,
    and finally use a data reader.


    # ### Creating a Connection to a Database


    To work with data from a database, you need to first establish a connection with
    the database. To create a new connection with a database, you can make use of
    the **Add Connection** dialog box or specify a connection string in the code-behind
    file. Let''s first learn how to connect to a database by using the **Add Connection**
    dialog box.


    # ### Using the Add Connection Dialog Box


    You can create a connection string for any data provider by using the **Add Connection**
    dialog box. In our case, we show you how to connect to the **NORTHWND** database.
    Let''s create a connection string for Microsoft SQL Server by using the **Add
    Connection** dialog box in a Windows Forms application named **DatabaseOperationsExample**.
    For this, perform the following steps:


    +   1. **Click** **Start➤All Programs➤Microsoft Visual Studio 2010➤ Microsoft
    Visual Studio 2010** to open Microsoft Visual Studio 2010.

    +   2. **Select** **File➤New➤Project** from the menu bar. The **New Project**
    dialog box appears.

    +   3. **Select** **Visual C#** under the **Installed Templates** pane and **Windows
    Forms Application** from the middle pane of the **New Project** dialog box.

    +   4. **Enter** the name for the application as **DatabaseOperationsExample**
    and specify a location for the application in the **Location** combo box.

    +   5. **Click** the **OK** button to create the **DatabaseOperationsExample**
    application.

    +   6. **Select** **View➤Server Explorer** from the menu bar to open the **Server
    Explorer** window, as shown in Fig.C-8.2.


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_266_0.png)


    **Fig.C-8.2**'
