  md: "Now, let’s create a console application named WhileLoop to demonstrate how\
    \ to use the while loop. Perform the following steps to create the WhileLoop application:\n\
    \n+   1. Repeat steps 1 to 3 as discussed earlier while creating the If Example\
    \ application in the The if Statement section of this chapter.\n+   2. Enter WhileLoop\
    \ in the Name text box to specify the name of the application, and specify an\
