    Let''s now explore the various components of the Visual Studio 2010 IDE.


    # Exploring the Visual Studio 2010 IDE


    As stated earlier, the Visual Studio 2010 IDE enables you to develop various kinds
    of .NET applications, such as console, Windows Forms, and Web applications. The
    layout of the Visual Studio 2010 IDE is almost the same for all kinds of .NET
    applications, with only slight variations depending on the application.'
