    Next, let''s learn about another new feature of Visual Studio 2010, that is, Consume-first
    mode of IntelliSense.


    # The Consume-First Mode of IntelliSense


    IntelliSense in Visual Studio 2010 provides two alternatives to complete a statement
    in the Code Editor window. These alternatives are the suggestion mode and the
    consume-first mode of IntelliSense. The suggestion mode feature of IntelliSense
    helps in automatically completing the text as you type in the Code Editor window.
    To enable the suggestion mode of IntelliSense, you can press the CTRL+ALT+Space
    keys in combination. The consume-first mode of IntelliSense, on the other hand,
    disables the suggestion mode, which stops IntelliSense from automatically completing
    the text as you type it. You can disable the suggestion mode of IntelliSense,
    by pressing the CTRL+ALT+Space keys in combination. To enable the suggestion mode
    of IntelliSense, you can press the same keys again.'
