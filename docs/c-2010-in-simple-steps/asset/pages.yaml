  md: '# The Navigate To Feature


    Navigating to a specific symbol or file in the source code has become easier in
    Visual Studio 2010 with the Navigate To feature. You can use this feature to search
    for a symbol, variable, word, phrase, or file in your source code. This incremental
    search feature is especially beneficial when you are not sure of what you are
    looking for in the source code. For instance, when you enter a symbol, variable,
    word, or phrase in the Search terms text box of the Navigate To dialog box, the
    Navigate To feature immediately starts displaying the results, based on the term
    you enter as you start typing in the Search terms text box. You can also use Camel
    casing (words beginning in lowercase) and underscore characters in the Search
    terms text box to divide any phrase that you are typing into keywords. Fig.C+1.12
    shows the use of the Navigate To feature:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_25_0.png)


    Fig.C+1.12


    As shown in Fig.C+1.12, when you type the term fo in the Search terms text box,
    the results returned in the Results section of the NavigateTo dialog box are all
    the file names, method and property names, and event names that contain the term
    fo.


    # Tip


    You can open the NavigateTo dialog box by pressing the CTRL and , keys in combination.


    Next, let''s discuss about the Box Selection feature in Visual Studio 2010.


    # The Box Selection Feature


    Consider a scenario where you have declared certain variables and methods as public
    and now you need to modify them from public to private. In such a case, you can
    go through all the access modifiers one by one and change every occurrence of
    the public access modifier into private access modifier. However, this can be
    a tedious work. The new Box Selection feature saves you from such situations.
    Using the Box Selection feature, you can quickly select a block of text that you
    want to replace, by pressing the SHIFT+ALT keys in combination, as shown in Fig.C+1.13:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_25_1.png)


    Fig.C+1.13


    As shown in Fig.C+1.13, the selected text appears in a box. After selecting the
    text, you can enter the new text within the box, as shown in Fig.C+1.14:'
