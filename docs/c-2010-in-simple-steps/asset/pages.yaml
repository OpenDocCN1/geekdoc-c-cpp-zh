  md: "# # Exploring Parallel LINQ\n\nIf .NET Framework 3.5 was all about LINQ, then\
    \ .NET Framework 4.0 introduces the concept of PLINQ. PLINQ is nothing but a parallel\
    \ implementation of the LINQ pattern and aims to use all the processors present\
    \ in a system. PLINQ queries are syntactically very similar to the LINQ-to-Object\
    \ queries. For instance, consider the following simple LINQ-to-Object query:\n\
    \n```\n```csharp\nvar output = from x in source\n             where (some condition)\n\
    \             select (something)\n```\n```\n\nNow consider the following PLINQ\
    \ query:\n\n```\n```csharp\nvar output = from x in source.AsParallel()\n     \
    \        where (some condition)\n             select (something)\n```\n```\n\n\
    Note that the preceding PLINQ query is the same as the LINQ-to-Object query, barring\
    \ the AsParallel() method. This method is specific to PLINQ and is available in\
    \ the ParallelEnumerable class. This class can be found in the System.Linq namespace\
    \ and exposes most of the PLINQ functionalities.\n\n> > **Note**\n> > LINQ-to-Object\
    \ queries refer to the execution of LINQ queries on any in-memory IEnumerable\
    \ interface or IEnumerable<T> data source. In LINQ-to-Object queries, the queries\
    \ are executed without using the technologies, such as LINQ to SQL.\n\nSimilar\
    \ to the non-parallel sequential LINQ queries, PLINQ queries perform operations\
    \ on any in-memory IEnumerable interface or IEnumerable<T> data source. PLINQ\
    \ divides a data source into different segments and then executes each of these\
    \ segments on separate worker threads across multiple processors. In many cases,\
    \ queries run much faster because of parallel execution. However, parallelization\
    \ does not imply that all the queries will run fast as there may be various complexities\
    \ involved with parallelization. Moreover, note that the PLINQ concept applies\
    \ only for LINQ-to-Objects queries.\n\nNow, let's create a console application\
    \ called PLINQExample, to execute a simple PLINQ query. For this, perform the\
    \ following steps:\n\n+   1. Repeat steps 1 and 2 shown earlier while creating\
    \ the LINQQuery application in the Exploring LINQ Queries and their Execution\
    \ section of this chapter.\n+   2. Select the Visual C#➤Windows option in the\
    \ Installed Templates pane and the Console Application option in the middle pane\
    \ of the New Project dialog box.\n+   3. Enter PLINQExample in the Name text box\
    \ to specify the name of the application, and enter an appropriate location for\
    \ the application in the Location combo box.\n+   4. Click the OK button. The\
    \ PLINQExample application is created.\n+   5. Add the code given in Listing 10.14\
    \ to the Program.cs file:\n\nListing 10.14: Adding Code to the Program.cs File\
    \ in the PLINQExample Application\n\n```\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace PLINQExample\n{\n    class\
    \ Program\n    {\n        public static void Main(string[] args)\n        {\n\
    \            var datasource = Enumerable.Range(2, 20);\n            var output\
    \ = from x in datasource.AsParallel()\n                         where x % 2 ==\
    \ 0\n                         select x;\n            foreach (var x in output)\n\
    \            {\n```\n```"
