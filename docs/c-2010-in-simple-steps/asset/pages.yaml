    Let''s learn about type casting next.


    # Type Casting


    Casting is a process to perform explicit conversion. You can perform casting by
    prefixing a data type that specifies the type of conversion you want to perform.
    The syntax for casting is as follows:


    ```

    ```

    type variable1 = (type) variable2

    ```

    ```


    In the preceding syntax, type in the parenthesis is the conversion type. There
    may be loss of data in the casting process if you are casting a data type to a
    smaller data type. The following example shows casting:


    ```

    ```

    int x = (int) 24.46; // Fractional part of the float value will be lost i.e. x
    = 24

    ```

    ```


    In the preceding example, the float value 24.46 is converted to integer. Since
    an integer data type does not allow fractions, the fractional part of the value
    is truncated and the value, 24 is assigned to variable x.


    You can convert numeric values into strings in C#, as shown in the following code
    snippet:


    ```

    ```

    int x = 20;

    string str = x.ToString(); // x has been converted to string and its value will
    be as //string "20" now

    ```

    ```


    You can also convert a string into an integer value, as shown in the following
    code snippet:


    ```

    ```

    string str = "20";

    int y = int.Parse(str); //Now the value of y is 20

    ```

    ```


    Let''s learn about boxing and unboxing.


    # Boxing and Unboxing


    As mentioned earlier, all types whether reference or value types in C# are derived
    from the System.Object base class. Boxing is the process by which you can perform
    implicit conversion of a value type to an object type. Whenever you perform boxing
    on a value type, the CLR encloses it inside the System.Object base class and stores
    that value on the managed heap. The process of boxing is explained in the following
    code snippet:


    ```

    ```

    int i = 10;

    object ob = (object) i; //Boxing

    ```

    ```


    Unboxing on the other hand is the reverse process of boxing. It is the process
    in which you can perform explicit conversion of an object type to value type.
    The process of unboxing is shown in the following code snippet:


    ```

    ```

    object ob = 123;

    int i = (int) ob;

    ```

    ```


    Though both boxing and unboxing provides application developers the flexibility
    to treat value types as object types; computationally, these are quite expensive
    operations. This is due to the fact that when a value type is boxed, an object
    needs to be allocated and constructed.

