- pgno: 357
  md: 'A Web Service may be defined as an independent and self-sustained unit of a
    software application hosted on Internet. It implements specific functionalities
    to execute the business logic of an application. Suppose you want to host a Web
    site on Internet that calculates simple interest. In this situation, you can define
    a separate code for calculating simple interest at the client end in a Web Service
    and implement the Web Service in your Web site.


    A Web Service allows a Web site to communicate with other Web sites irrespective
    of the programming languages in which they are created. Similarly, it allows Windows
    Forms applications created in various programming languages to communicate with
    other Windows Forms applications. As a Web Service complies with common industry
    standards, it can be accessed by any application, regardless of the software and
    hardware platforms on which the application is running. The standards to which
    a Web Service must comply are as follows:


    +   - **Simple Object Access Protocol (SOAP):** Allows Web Services to communicate
    with other Web applications over the Internet. SOAP is a protocol that specifies
    a format for Extensible Markup Language (XML) messages, which is used by Web applications
    to request for and receive a Web Service from a Web server. These messages are
    also called SOAP messages.

    +   - **Web Services Description Language (WSDL):** Refers to an XML-based language
    that defines Web Services. Every Web Service consists of a corresponding WSDL
    document that specifies the location of a Web Service and lists all the services
    that it can provide.


    Earlier, it was difficult to create the applications that were used to communicate
    between a client and a server as a number of technologies, such as ASP.NET Web
    Service (ASMX Web Service), Web Enhancement Services (WSE), and Microsoft Message
    Queuing (MSMQ) were used to perform this task. Some of the services provided individually
    by these technologies are as follows:


    +   - **ASMX Web Service:** Allows sharing of information and enables the information
    to be accessed from any platform

    +   - **.NET Remoting service:** Allows transferring of data from a client to
    a server on the Windows operating system

    +   - **MSMQ service:** Allows queuing of messages that helps in sending and receiving
    messages even when the server is disconnected


    The Windows Communication Foundation (WCF) technology was introduced by Microsoft
    to simplify the process of developing a distributed application. It provides a
    unified programming model by bringing together the functionalities of various
    technologies, such as SOAP, WSDL, ASMX Web Service, WSE, and MSMQ. Using WCF a
    developer can create a distributed application without mastering various technologies.


    WCF is a set of .NET technologies that act as a platform for creating and distributing
    connected applications, the applications that are connected to a database. You
    can develop and deploy services on Windows using WCF, which provides a unified
    framework for rapidly building service-oriented applications. These service oriented
    applications help to build secure and reliable applications through the simplified
    model of WCF.


    Now, let''s learn about the new features in WCF 4.0.


    # ## Exploring the New Features of WCF 4.0


    Built on the features provided by WCF 3.5 SP1, the WCF 4.0 brings a number of
    significant changes and improvements. The major enhancements have been made in
    areas of configuration, tracing and diagnostics, serialization, and messaging.
    Following are the features of WCF 4.0:


    +   - **Simplification in Configuration:** Refers to the simplifications made
    in WCF configuration section that includes support for default endpoints, binding,
    and behavior configurations. WCF 4.0 has a default configuration model; therefore
    you do not need to define configuration for WCF application. In case you do not
    define configuration for your WCF application, then the WCF runtime automatically
    defines some endpoints and default binding/behavior configuration for your WCF
    application.'
  merge: -1
  img_proc: true
- pgno: 358
  md: "+   - **Default Endpoints:** Refers to the automatic application of default\
    \ endpoints during the configuration of WCF application. An endpoint basically\
    \ includes an address, a binding, and a contract. All WCF applications are defined\
    \ with one or more endpoints; however, while creating WCF 4.0 applications, there\
    \ is no need to define endpoints.\n+   - **Simplified IIS/ASP.NET Hosting:** Implies\
    \ that there is no need to write interface definition as you can directly define\
    \ a class and add ServiceContract and Service Operation with Operation Contract\
    \ to the class. The following code snippet shows addition of two numbers in a\
    \ WCF application:\n+   - **Support for integration of WCF and WF:** Refers to\
    \ the support that has been added for the integration of WCF and WF. This integration\
    \ is intended to help implement declarative long-running workflow services. In\
    \ this way, the developers can use the best features of both WCF and WF technologies.\n\
    +   - **Performance tracing based on Event Tracing for Windows (ETW):** Refers\
    \ to the improvements in tracing as WCF 4.0 trace events are based on ETW. The\
    \ performance tracing helps to integrate WCF with other related technologies such\
    \ as WF and also enhances the tracing performance of WCF applications.\n\n```\n\
    [ServiceContract]\npublic class Addition\n{\n    [OperationContract]\n    public\
    \ double AddNumbers(double a, double b)\n    {\n        return a + b;\n    }\n\
    }\n```\n\nNow, let's learn about the cloud services in the following section.\n\
    \n# Introducing Cloud Services\n\nMicrosoft introduced cloud services in .NET\
    \ Framework 4.0. These cloud services are modeled on the lines of cloud computing,\
    \ which is an Internet-based computing facility. Using the cloud computing facility,\
    \ resources (such as CPU and memory) software, data, and information can be shared\
    \ amongst the computer systems and other devices, such as mobile phones with Internet.\
    \ In other words, cloud computing provides hardware-independence to application\
    \ developers.\n\nA cloud is used to refer to Web-based applications, services\
    \ that are hosted on Web, centralized data centre, or an environment where one\
    \ can build and run scalable applications. Cloud services can be used to develop\
    \ the Web applications that work well even if there is a sudden increase or decrease\
    \ in the Web traffic. Using cloud services, previously built desktop or Web applications\
    \ can take advantage of cloud computing facility.\n\nThe newly unveiled Microsoft's\
    \ cloud platform is named as Windows Azure. It provides an execution environment\
    \ wherein .NET applications can be run and data can be stored in Microsoft's data\
    \ repositories that are spread across the world. Using Windows Azure, Microsoft\
    \ expects to bestow cloud computing facilities to users. Developers can access\
    \ any of the technologies such as WCF and WF any time and anywhere using Windows\
    \ Azure. Moreover, Windows Azure allows developers to concentrate on the development\
    \ aspect of applications rather than worrying about infrastructure requirements.\
    \ Now, let's learn to use a Web Service in the following section.\n\n# Creating\
    \ and Using a Web Service\n\nYou need to create an ASP.NET Empty Web Application\
    \ template found in the list of templates available in the New Project dialog\
    \ box to create a Web service application in Visual Studio 2010. Let's perform\
    \ the following steps to create a Web Service:\n\n+   1. Open Microsoft Visual\
    \ Studio 2010 from Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual\
    \ Studio 2010.\n+   2. Select File→New→Project from menu bar. The New Project\
    \ dialog box appears (Fig.C+13.1)."
