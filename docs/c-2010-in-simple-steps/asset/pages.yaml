- pgno: 289
  md: "![](img/2db4b8b2cb67e7ccc52477a61fe289ab_289_0.png)\n\nIn Fig.C#-8.33, the\
    \ ellipse is filled with blue color, when the **Blue** option is selected in the\
    \ list box. Next, let's learn about data binding on binding sources, such as CLR\
    \ and ADO.NET objects.\n\n# ## Binding Sources in WPF\n\nIn data binding, the\
    \ source refers to the object that you obtain data from. WPF supports the CLR\
    \ and ADO.NET data object binding sources. For the CLR object, data binding works\
    \ as long as the binding engine is able to access the source property by using\
    \ reflection. For ADO.NET object, you must establish a connection with the SQL\
    \ Server database.\n\n> > **Note**\n> >\n> > .NET Framework facilitates you to\
    \ obtain information (such as data type) about an existing variable in an application\
    \ by using reflection. For instance, you can use the GetType() method to know\
    \ about the data type of a variable used in an application. You can also use reflection\
    \ to access the properties or invoke the methods of an existing object by using\
    \ reflection in .NET applications.\n\nNext, let's learn how to bind to CLR objects\
    \ in WPF applications.\n\n# ## Binding to CLR Objects\n\nIn WPF, you can bind\
    \ to the public properties or subproperties of any CLR object. The binding object\
    \ in WPF uses CLR reflection to retrieve the values of the properties. When you\
    \ use the CLR object for data binding in WPF, you should implement the **INotifyPropertyChanged**\
    \ interface. This interface helps you to update the binding target when the binding\
    \ source property changes. This helps to ensure that the data used in the binding\
    \ stays current.\n\nIf the source object implements a proper notification mechanism,\
    \ the target updates happen automatically. You can also use the **UpdateTarget()**\
    \ method to update the target property to provide property change notification.\
    \ Now, let's learn how to implement CLR object binding in a WPF application. For\
    \ this, perform the following steps:\n\n+   1. Create a WPF application named\
    \ **BindingtoCLRObject**.\n+   2. Set the title of the **MainWindow** window to\
    \ **Binding to a CLR Object** by using the **Title** property.\n+   3. Add the\
    \ highlighted code given in Listing 8.10 to the **MainWindow.xaml** file:\n\n\
    **Listing 8.10:** Preparing the User Interface of the MainWindow.xaml File\n\n\
    ```\n```xml\n<Window x:Class=\"BindingtoCLRObject.MainWindow\"\n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \n    xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    Title=\"Binding\
    \ to a CLR Object\" Height=\"300\" Width=\"300\">\n    <Grid Name=\"grdMain\"\
    >\n        <Grid.ColumnDefinitions>\n            <ColumnDefinition Width=\"30\"\
    \ />\n            <ColumnDefinition Width=\"70\" />\n        </Grid.ColumnDefinitions>\n\
    ```\n```"
