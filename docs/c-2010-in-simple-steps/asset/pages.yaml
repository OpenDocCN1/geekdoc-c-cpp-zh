- pgno: 238
  md: 'the input text by performing various operations, such as aligning the text,
    wrapping the text around the control, or specifying the casing of the text.


    > **Note**

    > By default, the TextBox control has a context menu, which appears when a user
    right-clicks in the control. The context menu allows the user to perform common
    editing operations such as Cut, Copy, and Paste.


    The TextBox control is represented by the TextBox class, which is derived from
    the TextBoxBase class. The TextBox class has many properties that allow you to
    work with the TextBox control. Table 7.4 lists the noteworthy properties of the
    TextBox class:


    Table 7.4: Noteworthy Properties of the TextBox Class


    | Property | Description |

    |---|---|

    | CharacterCasing | Retrieves or sets a value that indicates the casing of the
    characters of the text entered in a TextBox control |

    | MaxLength | Retrieves or sets the maximum number of characters that you can
    enter in a TextBox control |

    | Text | Retrieves or sets the text contained in a TextBox control |

    | TextAlignment | Retrieves or sets the horizontal alignment of the text in a
    TextBox control |

    | TextWrapping | Retrieves or sets a value that indicates how text is wrapped
    in a TextBox control |


    Let''s create a standalone WPF application named TextBoxDemo to show the use of
    the TextBox control. For this, perform the following steps:


    +   1. Repeat steps 1 to 3 as followed earlier while creating the GridDemo application
    in the Using the Grid Control section in this chapter.

    +   2. Enter the name TextBoxDemo in the Name text box and specify an appropriate
    location for the application in the Location combo box.

    +   3. Click the OK button. The TextBoxDemo application is created.

    +   4. Add the highlighted code given in Listing 7.5, in the MainWindow.xaml file:


    # Listing 7.5: Showing the Use of the TextBox Control


