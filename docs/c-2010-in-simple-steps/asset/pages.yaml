  md: 'Table 7.11: Noteworthy Properties of the DataGrid Class


    | Property | Description |

    |---|---|

    | CanUserAddRows | Retrieves or sets a value indicating whether or not a user
    can add new rows to a DataGrid control. |

    | CanUserDeleteRows | Retrieves or sets a value that indicating whether or not
    a user can delete rows from a DataGrid control. |

    | CellStyle | Retrieves or sets the style applied to all the cells in a DataGrid
    control. |

    | Columns | Retrieves a collection that contains all the columns in a DataGrid
    control. |

    | HasItems | Retrieves a value that indicates whether a DataGrid control contains
    any other controls, such as a TextBlock control or a Button control or items,
    such as strings within it. |

    | Items | Retrieves a collection of all the controls and items that are used to
    populate a DataGrid control. |

    | ItemTemplate | Retrieves or sets the DataTemplate objects used to display each
