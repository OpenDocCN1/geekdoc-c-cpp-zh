- pgno: 70
  md: '# Using Arithmetic Operators


    Almost all the computer programs do arithmetic operations, such as addition, subtraction,
    multiplication, and division. There are five arithmetic operators, plus (+), minus
    (-), multiplication (*), division (/), and modulus (%) used in C#. The plus (+)
    sign is used for addition, minus (-) sign is used for subtraction, asterisk (*)
    is used for multiplication, forward slash (/) is used for division and modulus
    (%) is used to return the remainder.


    > Note

    > You learn about other C# operators in detail in next chapters.


    Table 2.5 lists the examples of arithmetic operators:


    Table 2.5: Examples of Arithmetic Operators in C#


    | Operation | Example | Result |

    |---|---|---|

    | Addition | 17 + 2 | 19 |

    | Subtraction | 9 - 4 | 5 |

    | Multiplication | 6 * 5 | 30 |

    | Division | 10 / 5 | 2 |

    | Modulus | 7 % 5 | 2 |


    Now, let''s consider an example where an assignment statement contains more than
    one arithmetic operator, as shown in the following code snippet:


    ```

    5 + 3 * 2

    ```


    In the preceding code snippet, answer depends on various things. For example,
    if you add 5 and 3 first and then multiply the result by 2, the answer is 16.
    However, if you multiply 3 with 2 first and then add 5 to it, the answer is 11.
    The possibility of such confusion can be avoided by using the rules of precedence.
    This means that the arithmetic operations are performed in the specified order
    of precedence, multiplication (*), division (/), modulus (%), addition (+), and
    subtraction (-).


    In an assignment statement, the multiplication and division operations are performed
    first; then modulus operations, and finally, the addition and subtraction operations.
    So, the answer of the preceding example would be 11 instead of 16, since the multiplication
    has been done before the addition.


    If the precedence level of the two operators is same (for example the multiplication
    and division), the operations are performed from left to right, as shown in the
    following example:


    ```

    20 / 2 * 5

    ```


    In the preceding example, since both the operators have the same precedence level,
    the division is performed first, yielding the result as 10. Then the multiplication
    operation is performed, which results in the final answer as 50. If you want to
    perform multiplication first and then division, then you can use parenthesis so
    that the operations within the parenthesis can be performed first. You can rewrite
    the example as follows:


    ```

    20 / (2 * 5)

    ```


    In the preceding example, multiplication is performed first and then the division
    operation is performed that yields the final result as 2. There are no limitations
    on the number of parenthesis to be used, but every left parenthesis needs a right
    parenthesis. If you type an assignment statement in Code Editor with unmatched
    parenthesis (a syntax error), the end of the statement gets squiggled (underlined
    text), which indicates an error. When you nest one parenthesis within another
    parenthesis, the evaluation starts with the innermost set of parenthesis, as shown
    in the following example:


    ```

    ( (2 + 3) * 5 ) + 7

    ```


    In this case, the addition of 2 and 3 is performed first; then the result is multiplied
    by 5; and finally 7 is added to the result. So, the final answer is 32.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Demonstrating Operator Precedence


    C# has a large set of operators and you can use many of the operators simultaneously
    in an expression to perform the required calculations. However, the use of two
    or more operators may result in the conflict of the operator precedence to decide
    the operation to be performed first. A C# expression containing operators is evaluated
    on the basis of the precedence level of each of the operator in the expression.
    Therefore, the operator precedence refers to a set of rules that specify the order
    in which the compiler evaluates the expression. When the operators are associated
    with either the expression on their left or the expression on their right, then
    it is known as the associativity of operators. Table 2.6 shows the precedence
    of different operators in C#:


    **Table 2.6: Operator Precedence**


    | Operator | Associativity |

    |---|---|

    | (x), (x,y), f(x), a[x], x++, x--, new, typeof, sizeof, checked, unchecked |
    Left |

    | + (unary), - (unary), ~, ++x, --x, (!)x | Left |

    | *, /, % | Left |

    | + (arithmetic), - (arithmetic) | Left |

    | <<, >> | Left |

    | <, >, <=, >=, is, as | Left |

    | ==, != | Left |

    | & | Left |

    | ^ | Left |

    | | | Left |

    | && | Left |

    | || | Left |

    | ? : | Right |

    | =, *=, /=, %=, +=, -=, <<=, >>=, &=, ^=, |= | Right |


    In Table 2.6, the precedence order of C# operators is listed. The operators at
    the same level have equal precedence and are evaluated in the given order in the
    expression until and unless they are separated by the parenthesis.


    Let''s learn to use the scope resolution operator.


    # Using the Scope Resolution Operator


    The :: (scope resolution) operator is added between two identifiers, and the left-hand
    identifier of the :: operator is taken as a global identifier, or an extern, or
    alias. When the left-hand identifier of the :: operator is global, the global
    namespace is searched for the right-hand identifier. Now, let''s perform the following
    steps to create a Console application named AliasClass, which shows the use of
    the :: operator with the global identifier:


    +   1. *Click Start*→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010, to open the Visual Studio 2010 IDE.

    +   2. *Select File*→New→Project to open the New Project dialog box.

    +   3. *Select Visual C#* in the Installed Templates pane of the New Project dialog
    box and then *select Console Application*.

    +   4. *Enter* the name of the application as AliasClass in the Name text box
    and *select* the default location, c:\users\temp\documents\visual studio 2010\Projects
    from the Location combo box.'
