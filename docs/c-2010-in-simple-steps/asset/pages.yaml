    Next, let’s discuss about the OpenFileDialog control.


    # Using the OpenFileDialog Control


    The OpenFileDialog control displays the **Open** dialog box, which prompts a user
    to select an existing file to view it. It allows the user to specify the path
    of an existing file that the user wants to open. The **OpenFileDialog** control
    encapsulates the functionality to first check whether the file that a user wants
    to open exists on the computer; if it exists, the control allows the user to open
    it.


    The **OpenFileDialog** control is an instance of the **OpenFileDialog** class,
    which inherits the **FileDialog** class.


    Table 6.17 lists noteworthy properties of the **OpenFileDialog** class:


    Table 6.17: Noteworthy Properties of the OpenFileDialog Class


    | Property | Description |

    | --- | --- |

    | CheckFileExists | Retrieves or sets a value indicating whether the Open dialog
    box displays a warning in case a user specifies the name of a non-existent file
    |

    | ShowReadOnly | Retrieves or sets a value signifying whether the Open dialog
    box displays a read-only check box |

    | ReadOnlyChecked | Retrieves or sets a value signifying whether the read-only
    check box is selected in the Open dialog box |

    | Multiselect | Retrieves or sets a value signifying whether the Open dialog box
    allows multiple file selection |

    | SafeFileName | Retrieves the file name (not the path) and extension of the selected
    file in the Open dialog box |

    | SafeFileNames | Retrieves an array of file names (not the path) and extensions
    for all the selected files in the Open dialog box |


    Table 6.18 lists noteworthy methods of the **OpenFileDialog** class:


    Table 6.18: Noteworthy Methods of the OpenFileDialog Class


    | Method | Description |

    | --- | --- |

    | OpenFile | Opens the selected file with read-only permissions |

    | Reset | Resets all options to their default values |


