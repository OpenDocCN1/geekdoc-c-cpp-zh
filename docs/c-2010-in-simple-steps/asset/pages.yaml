- pgno: 185
  md: 'At times, you may come across situations where you need to provide different
    options to users so that the users can perform several actions on a particular
    entity, such as creating, opening, saving, or printing a file. You can use check
    boxes to display all these options to the user. However, if there is large number
    of options it would not be possible to display all of them on a form as they take
    a lot of space. Moreover, it would be rather difficult for the user to locate
    the right option on the form. In such cases, the use of toolbars and menus offers
    an easy, convenient, and compact means of providing various options and tasks.
    Toolbars and menus are used to group related options. For example, you can group
    operations related to a file, such as creating, opening, and saving a file, under
    the File menu. Toolbars act as shortcuts to menus and are used to perform some
    common functions. In addition to toolbars and menus, C# 2010 also provides you
    various controls to work with dialog boxes.


    In this chapter, you learn how to create toolbars, menus, and status bar by using
    the ToolStrip, MenuStrip, and StatusStrip controls, respectively. You also learn
    how to work with some common dialog boxes, such as, the Open, Save As, and Print
    dialog boxes.


    Let''s start by learning about toolbars, menus, and status bar.


    # Creating Toolbars, Menus, and Status Bar in C# 2010


    As you know, toolbars and menus present a compact and convenient way of presenting
    different options. Toolbars provide commonly used menu items. In Windows Forms
    applications, you can create toolbars and menus by using the ToolStrip and MenuStrip
    controls, respectively. You can also display information about these controls
    and your application by using a status strip, provided by the StatusStrip control.


    Let''s discuss these controls in detail, starting with the ToolStrip control.


    # Using the ToolStrip Control


    The ToolStrip control is an improved version of the ToolBar control. It offers
    a strip of tools that correspond to menu options and controls, such as buttons,
    images, drop-down lists, and text boxes, which allow you to develop Windows Forms
    applications with rich yet compact user interface (UI). The ToolStrip control
    offers various commonly-used features and options to the users, such as layout
    options. It also allows the users to execute frequently performed tasks, such
    as saving files.


    The ToolStrip control is an instance of the System.Windows.Forms.ToolStrip class.
    This class provides various properties, methods, and events that allow you to
    work with the ToolStrip control. Table 6.1 lists noteworthy properties of the
    ToolStrip class:


    Table 6.1: Noteworthy Properties of the ToolStrip Class


    | Property | Description |

    |---|---|

    | Anchor | Retrieves or sets the edges of the container to which the ToolStrip
    control is bound |

    | AutoSize | Retrieves or sets a value that indicates whether the ToolStrip control
    is automatically resized to display its entire content |

    | Dock | Retrieves or sets the borders of the ToolStrip control that is docked
    to its parent control |

    | GripDisplayStyle | Retrieves or sets the orientation of the move handle of the
    ToolStrip control |

    | GripStyle | Retrieves or sets a value that indicates whether the ToolStrip control
    move handle is visible or hidden |

    | ImageList | Retrieves or sets the image list that contains the images displayed
    on a tool strip item |

    | IsDropDown | Retrieves a value that indicates whether the ToolStrip control
    is a ToolStripDownControl |

    | Items | Retrieves all the items of the ToolStrip control |

    | LayoutStyle | Retrieves or sets a value that indicates the way the ToolStrip
    control places its tool strip items inside a form |'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Table 6.1: Noteworthy Properties of the ToolStrip Class


    | Property | Description |

    |---|---|

    | Orientation | Retrieves the orientation of the ToolStripPanel object |

    | ShowItemToolTips | Retrieves or sets a value indicating whether ToolTips for
    the tool strip items are displayed |

    | Stretch | Retrieves or sets a value that indicates whether the ToolStrip control
    stretches from end to end in the ToolStripContainer class |

    | TabStop | Retrieves or sets a value indicating whether a user can give focus
    to a tool strip item using the TAB key |

    | TextDirection | Retrieves or sets the direction in which the text on the ToolStrip
    control appears |


    Table 6.2 lists noteworthy methods of the ToolStrip class:


    Table 6.2: Noteworthy Methods of the ToolStrip Class


    | Method | Description |

    |---|---|

    | GetItemAt | Retrieves the tool strip item at a specified location |

    | GetNextItem | Retrieves the next tool strip item from a specified reference
    point and moves it in a specified direction |


    Table 6.3 lists noteworthy events of the ToolStrip class:


    Table 6.3: Noteworthy Events of the ToolStrip Class


    | Event | Description |

    |---|---|

    | AutoSizeChanged | Occurs when the AutoSize property changes |

    | ItemAdded | Occurs when a new tool strip item is added to the ToolStripItemCollection
    class |

    | ItemClicked | Occurs when a tool strip item is clicked |

    | ItemRemoved | Occurs when a tool strip item is removed from the ToolStripItemCollection
    class |

    | LayoutCompleted | Occurs when the layout of the ToolStrip control completes
    |

    | LayoutStyleChanged | Occurs when the LayoutStyle property changes |


    # Note


    The ToolStrip class is inherited by the MenuStrip, StatusStrip, and ContextMenuStrip
    classes.


    The ToolStrip control contains various types of controls, such as buttons, combo
    boxes, labels, and text boxes, which are referred to as tool strip items. The
    tool strip items are instances of the ToolStripItem class, which exists in the
    System.Windows.Forms namespace. The individual tool strip items are instances
    of the classes that directly or indirectly inherit the ToolStripItem class. The
    classes that represent the tool strip items of the ToolStrip control are as follows:


    +   - ToolStripButton: Creates a toolbar button that can contain text or an image

    +   - ToolStripLabel: Creates a toolbar label that can contain text, image, and
    hyperlinks

    +   - ToolStripTextBox: Creates a toolbar text box in which users can enter text

    +   - ToolStripComboBox: Creates a toolbar combo box of the ToolStrip control

    +   - ToolStripSeparator: Creates a toolbar vertical line that logically groups
    the tool strip items

    +   - ToolStripDropDownButton: Creates a toolbar button that displays a drop-down
    list

    +   - ToolStripSplitButton: Creates a combination of a standard button on the
    left and a drop-down button on the right'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The ToolStripItem class and its derived classes have several properties, methods,
    and events that you can use to work with the tool strip items. Table 6.4 lists
    noteworthy properties of the ToolStripItem class:


    **Table 6.4: Noteworthy Properties of the ToolStripItem Class**


    | Property | Description |

    |---|---|

    | Alignment | Retrieves or sets a value that signifies whether the item aligns
    towards the start or the end of the ToolStrip control |

    | Anchor | Retrieves or sets the edges of the container to which a tool strip
    item is bound |

    | AutoSize | Retrieves or sets a value signifying whether an item is automatically
    resized |

    | AutoToolTip | Retrieves or sets a value indicating whether to use the Text property
    or the ToolTipText property for the ToolStripItem ToolTip |

    | Available | Retrieves or sets a value indicating whether the tool strip item
    should be placed in a ToolStrip control |

    | CanSelect | Retrieves a value indicating whether an item can be selected |

    | DisplayStyle | Retrieves or sets a value indicating whether or not the text
    and images are displayed on a tool strip item |

    | Dock | Retrieves or sets which tool strip item border is docked to its parent
    control and determines how tool strip item is resized with its parent |

    | Image | Retrieves or sets the image displayed on tool strip item |

    | Margin | Retrieves or sets the space between two adjacent tool strip items |

    | Name | Retrieves or sets the name of a tool strip item |

    | Text | Retrieves or sets the text that is to be displayed on a tool strip item
    |

    | TextDirection | Retrieves the orientation of text used on a tool strip item
    |

    | ToolTipText | Retrieves or sets the text that appears as a ToolTip for a control
    |

    | Visible | Retrieves or sets a value specifying whether a tool strip item is
    displayed |


    Table 6.5 lists noteworthy methods of the ToolStripItem class:


    **Table 6.5: Noteworthy Methods of the ToolStripItem Class**


    | Method | Description |

    |---|---|

    | DoDragDrop | Starts a drag-and-drop operation |

    | GetCurrentParent | Retrieves a ToolStrip control that contains the current tool
    strip item |

    | PerformClick | Activates a tool strip item when its Click event occurs |

    | Select | Selects an item in the ToolStrip control |


    Table 6.6 lists noteworthy events of the ToolStripItem class:


    **Table 6.6: Noteworthy Events of the ToolStripItem Class**


    | Event | Description |

    |---|---|

    | AvailableChanged | Occurs when there is a change in the value of the Available
    property |

    | Click | Occurs when a user clicks a tool strip item |

    | DisplayStyleChanged | Occurs when there is a change in the value of the DisplayStyle
    property |

    | OwnerChanged | Occurs when the owner of the tool strip item changes |

    | TextChanged | Occurs when the Text property of the tool strip item changes |'
