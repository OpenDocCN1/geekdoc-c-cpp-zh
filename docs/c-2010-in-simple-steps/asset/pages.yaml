- pgno: 307
  md: 'Language-Integrated Query (LINQ) is a component added to .NET Framework 3.5
    to provide native data-querying capabilities to the .NET Framework, by using syntax
    similar to that of Structured Query Language (SQL). It allows you to define statements
    that query a data source to yield a requested result set. LINQ provides a consistent
    way to obtain and manipulate data. You can use LINQ directly within C# programming
    language entities, called query expressions. These query expressions are based
    on numerous query operators that are designed to work in a manner similar to that
    of SQL. LINQ defines the set of query operators as the operators used to query,
    project, and filter data. The difference between SQL and LINQ is that unlike in
    SQL, query expressions in LINQ can be used to interact with numerous types of
    data, even with data that does not belong to a relational database. LINQ integrates
    the query syntax within a C# program, which makes it possible to access different
    data sources with the same syntax.


    Apart from LINQ, this chapter introduces you to Parallel LINQ or PLINQ, which
    is one of the various forms in which Visual Studio 2010 and .NET Framework 4.0
    offer enhanced support for parallel programming. The aim of parallel programming
    is to better use the ability of multi-core processors by enabling application
    developers to distribute their work across multiple processors.


    The chapter begins by discussing LINQ queries and the standard query operators
    used in LINQ. You also learn about programming with LINQ to ADO.NET. Towards the
    end of the chapter, you learn about PLINQ, which is a new addition to .NET Framework
    4.0.


    > LINQ to ADO.NET allows you to execute queries on any enumerable data source,
    such as Extensible Markup Language (XML) documents, and SQL databases by using
    the LINQ programming model. An enumerable data source is the one that implements
    the IEnumerable interface.


    Let’s begin by learning about LINQ queries.


    # Explaining LINQ Queries and their Execution


    A query is an expression that retrieves data from a data source. In addition,
    a query can be used to specify, sort, and group the retrieved data. LINQ queries
    are written in a specialized query language. In the past, you had to learn different
    languages for different data sources, for example, SQL for relational database
    and XQuery for Extensible Markup Language (XML). A LINQ query simplifies this
    situation by providing a consistent syntax to work with data across various kinds
    of data sources and their formats.


    You can use various clauses, such as from, where, orderby, and select, with a
    LINQ query. These are predefined clauses that are used to execute a LINQ query.


    The basic syntax of a LINQ query starts with the from clause and ends with the
    select or groupby clause. In addition, you can use the where, orderby, and orderbydescending
    clauses to perform additional functions, such as retrieving data.


    The three basic steps to execute a LINQ query are as follows:


    +   1. Obtaining the data source, which can be either a SQL database or an XML
    file

    +   2. Creating a query

    +   3. Executing the query


    A simple LINQ query is executed in a foreach statement. This statement in C# requires
    the IEnumerable or IEnumerable<T> interface. A LINQ query contains three clauses:
    from, where, and select. The from clause specifies the data source, the where
    clause applies filter, and the select clause specifies the type of result.


    Now, let’s create a Windows application, LINQQuery, in which you can use a simple
    LINQ query to retrieve data. For this, perform the following steps:


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010 to open the Visual Studio 2010 IDE.

    +   2. Select File→New→Project from the menu bar to open the New Project dialog
    box.'
