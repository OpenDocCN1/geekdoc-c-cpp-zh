  md: "![](img/2db4b8b2cb67e7ccc52477a61fe289ab_313_0.png)\n\nFig.C+10.5\n\nIn Fig.C+10.5,\
    \ each word from the string of words that were input is displayed. You can see\
    \ that the words are split and displayed in different lines.\n\n> Note\n> \n>\
    \ Both the select clause and the SelectMany() method are used to produce a result\
    \ from a data source. The difference between the two lies in the result. The select\
    \ clause is used to produce one result for every value in the data source, where\
    \ the result is a collection that has the same number of elements as the data\
    \ source. In contrast, the SelectMany() method produces a single result that contains\
    \ a concatenated collection of each element from the data source.\n\nNow let's\
    \ discuss partitioning operators in LINQ.\n\n# The Partitioning Operators\n\n\
    The partitioning operators in LINQ are used to divide an input sequence into two\
    \ sections, without rearranging the elements, and then returning the result set\
    \ with one of the sections that satisfies a given condition. The Take(), Skip(),\
    \ TakeWhile() and SkipWhile() methods are known as partitioning operators in LINQ.\n\
    \nThe Take() method moves elements up to a specified position in a sequence. The\
    \ TakeWhile() method retrieves elements based on a specified position until an\
    \ element satisfies the given condition. The Skip() method skips elements up to\
    \ a specified position in a sequence. The SkipWhile() method skips the elements\
    \ based on a given function until an element satisfies the given condition.\n\n\
    # The Join Operators\n\nThe join operators in LINQ are used to return an output\
    \ by joining the objects in one data sequence with the objects in another sequence\
    \ when there is a match between the two sequences. In other words, the join operators\
    \ produce a result only when common attributes are shared between two sequences.\
    \ The join operators provided in LINQ are the join clause and GroupJoin() method.\
    \ The join clause implements an inner join, which is a type of join where only\
    \ those objects that have a match in other data sets are returned. The GroupJoin()\
    \ method joins two sequences based on a keyselector function and groups the results.\n\
    \nNow, let's create a Windows application called JoinOperator, where you can use\
    \ the join clause. For this, perform the following steps:\n\n+   1. Repeat steps\
    \ 1 to 3 shown earlier while creating the LINQQuery application in the Explaining\
    \ LINQ Queries and their Execution section of this chapter.\n+   2. Enter JoinOperator\
    \ in the Name text box to specify the name of the application, and enter an appropriate\
    \ location for the application in the Location combo box.\n+   3. Click the OK\
    \ button. The JoinOperator application is created.\n+   4. Add a ListView control\
    \ and a Button control to Form1 and change the Text property of the button1 to\
    \ Join Data."
