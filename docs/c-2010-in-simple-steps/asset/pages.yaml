    Series is broken at number: \" + number);\n            Console.Write(\"\\nPress\
    \ ENTER to quit...\");\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n```\n\nIn Listing 3.10, the while loop will iterate infinitely, until the\
    \ break keyword is executed. Inside the while loop, the if statement checks the\
    \ condition whether the value of the variable is less than or equal to 10, and\
    \ if this condition is evaluated to true, then the program control is transferred\
    \ to the continue statement. The continue statement, in turn, transfers the program\
    \ control to the beginning of the loop as long as the condition is satisfied.\
    \ If the condition is evaluated to false, the program control is transferred to\
    \ the else block and the execution of the while loop terminates. The break keyword\
    \ inside the else block causes the program to terminate.\n\n5 Press the F5 key\
    \ to run the ContinueStatement application. The output of the application appears,\
    \ as shown in Fig.C#3.17:\n\n![](img/2db4b8b2cb67e7ccc52477a61fe289ab_98_0.png)\n\
    \nFig.C#3.17\n\nLet's now learn about exceptions.\n\n# Working with Exceptions\n\
    \nAn exception is a runtime error that arises because of some unexpected situation.\
    \ The exception handling feature in C# helps you to deal with any unexpected situation\
    \ or abnormal condition that might occur when a program is being executed. For\
    \ example, dividing a number by zero or passing a string value to an integer variable.\
    \ During the execution of a program, if an exception occurs you can terminate\
    \ the program explicitly by using the throw statement."
