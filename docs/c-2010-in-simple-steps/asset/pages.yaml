    # Working with Resources and Styles


    Consider a situation where you want to apply a background color on several elements
    in a WPF application. For this, you may set the Background property on these elements;
    however, this may prove to be rather tedious. WPF allows you to simplify and ease
    the use of such commonly used objects through resources. A resource refers to
    an object, element, or value that is a part of the resource dictionary and is
    reusable by other elements of an application. The resource dictionary is an instance
    of the ResourceDictionary class and refers to a collection of resources defined
    on an element.


    Although you can define resources for any UI element, it is advisable to define
    the resources on the root element, such as the Window or Page element. The resource
    that you define for an element also applies to all the child elements of the element.
    For example, if you define the resource for a Window element with a Grid element
    as its child, then the resource for the Window element applies to the Grid element
    also. However, if you define a resource for the Grid element, the resource applies
    only to the child elements of the Grid element.


    # Tip


    > Suppose you have a standalone WPF application with multiple Window elements
    and you want to apply a resource to all the Window elements. For this, you need
    to define the resource in the App.xaml file of the application.


    You can define a resource on an element by using the Resources property of the
    element. The Resources property refers to the resource dictionary of that element.
    With the Resources property, you can define as many resources as you want on an
    element. Every resource that you define on an element must have a unique key,
    which refers to a string that uniquely identifies the resource in the resource
    dictionary. The unique key is assigned to a resource by using the x:Key attribute.
    After you define the resources, you can use them by referencing a resource as
    a property value in any of the UI elements. The syntax to reference a resource
    in WPF is as follows:


    ```

    <elementName propertyName="{markupExtension KeyName}">

    ```'
