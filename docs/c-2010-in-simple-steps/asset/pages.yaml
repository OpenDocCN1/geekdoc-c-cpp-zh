- pgno: 231
  md: "This completes our discussion on the WPF Designer. Next let's discuss the XAML\
    \ Designer in WPF 4.0.\n\n# Exploring XAML and WPF\n\nWPF supports XAML (pronounced\
    \ as zammel), which is a declarative markup language based on Extensible Markup\
    \ Language (XML) introduced by Microsoft Corporation. This markup language allows\
    \ designers to easily and quickly define and describe the elements for the UI\
    \ of WPF applications. Application developers can then use the defined UI elements\
    \ by using XAML to specify the logic for those elements in the code-behind files\
    \ in any of the .NET languages, such as C#. However, you can also use the code-behind\
    \ files to create UI elements at run time. Consequently, WPF allows both segregation\
    \ and integration of the UI and business logic in WPF applications.\n\n# Note\n\
    \n> *XAML files have the .xaml extension, and are supported in Windows Workflow\
    \ Foundation (WF) and Microsoft Silverlight.*\n\nVisual Studio 2010 extends support\
    \ for XAML by incorporating XAML IntelliSense and allowing the debugging and compilation\
    \ of XAML content. In the following sections, you learn to work with elements\
    \ and attributes, namespaces, and markup extensions of XAML.\n\n# XAML Elements\
    \ and Attributes\n\nXAML makes use of markup tags or elements and attributes to\
    \ define the UI of WPF applications. The XAML elements directly correspond to\
    \ various managed WPF classes, while the XAML attributes correspond to the properties\
    \ and events of the classes.\n\nIn WPF, the XAML elements are represented as a\
    \ logical tree with several nodes. Each element corresponds to a tree node, while\
    \ the attributes of the elements become the properties of the nodes. When you\
    \ add an XAML element within an existing element, it becomes the child element\
    \ of the existing element and therefore the child node of the existing node. In\
    \ this way, as you keep adding XAML elements in a WPF application, the tree branches\
    \ out to reflect the UI of the application. Note that in an XAML file, there is\
    \ only one topmost or root element. In WPF standalone applications, the root element\
    \ is the MainWindow element, while in XBAP applications; the root element is the\
    \ Page element.\n\nLet's create a simple WPF standalone application named SampleWPFApplication.\
    \ Listing 7.1 shows the XAML code of the application:\n\nListing 7.1: Displaying\
    \ the XAML Code of the SampleWPFApplication Application\n\n```\n<Window x:Class=\"\
    SampleWPFApplication.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        Title=\"\
    MainWindow\" Height=\"300\" Width=\"300\">\n    <Grid>\n        <Button Margin=\"\
    100,25,100,200\" Name=\"button1\">Welcome</Button>\n        <Button Margin=\"\
    100,100,125,125\" Name=\"button2\">WPF</Button>\n        <Button Margin=\"50,150,50,10\"\
    \ Name=\"button3\">\n            <Label Margin=\"5,5,5,5\" Name=\"label1\">XAML</Label>\n\
    \        </Button>\n    </Grid>\n</Window>\n```\n\nAs shown in Listing 7.1, there\
    \ are four XAML elements, namely Window, Grid, Button, and Label. The Window and\
    \ Grid elements exist in the WPF application by default, while the Button and\
    \ Label elements are added by dragging and dropping the respective controls from\
    \ the Toolbox. These elements can be represented in a hierarchical manner as a\
    \ tree, as shown in Fig.C4-7.17;"
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/2db4b8b2cb67e7ccc52477a61fe289ab_232_0.png)


    # Fig.C*7.17


    In Fig.C*7.17, the Window element contains the Grid element, which in turn has
    three Button elements named button1, button2, and button3 as its child elements.
    The button3 element itself has a Label element named label1 as its child element.
    Note that the Window, Grid, Button, and Label XAML elements correspond to the
    instances of the Window, Grid, Button, and Label classes, respectively, while
    the attributes of the XAML elements correspond to the properties of the respective
    classes.


    You may recall from Listing 7.1 that the individual attributes are separated by
    whitespaces and are specified in name-value pairs. For every attribute, the name
    and value of an attribute is separated by the equal to operator (=). Note that
    the value is enclosed within double quotes. Consider the following code snippet:


    ```

    <Button Height="23" Name="button1">Welcome</Button>

    ```


    In the preceding code snippet, the value of the Height attribute is 23 and the
    value of the Name attribute is button1. The string Welcome is the text that appears
    on the button1 button.


    Although setting the properties through XAML attributes is easy, concise, and
    intuitive, WPF provides an alternate method of setting the property values, known
    as the property element syntax. In this method, you can set the properties by
    specifying them as elements rather than as attributes. In the property element
    syntax, the property is set by using the following syntax:


    ```

    <element_name.property_name [attribute1_name="value1" attribute2_name="value2"...attributeN_name="valueN"]>

    property_value</element_name.property_name>

    ```


    The various parameters of the preceding syntax can be briefly described as follows:


    +   - element_name: Refers to the name of the element to which the property belongs

    +   - property_name: Refers to the name of the property

    +   - attribute1_name, attribute2_name, ... attributeN_name: Refer to the names
    of the attributes that the property may contain

    +   - value1, value2, ... valueN: Refer to the values of the attributes

    +   - property_value: Refers to the value of the property


    As shown in the preceding syntax, the dot operator (.) separates the element and
    property names. Listing 7.2 shows the property element syntax for the properties
    of the Button class/element:


    # Listing 7.2 Setting the Properties of the Button Element by using the Property
    Element Syntax


    ```

    <Button>

    <Button.Height>23</Button.Height>

    <Button.Name>button1</Button.Name>

    <Button.Content>Welcome</Button.Content>

    </Button>

    ```


    In Listing 7.2, the Height, Name, and Content properties are set by using the
    property element syntax as the properties are specified as the child elements
    of the Button element.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Namespaces and XAML


    Similar to XML, XAML requires certain predefined namespaces to allow you to use
    elements and attributes in an XBAP application. Namespaces convey to the XAML
    parser the location of the classes and structural rules for a WPF application.
    When you create a standalone WPF application, references to the necessary namespaces
    are added in the Window element and the Page element (in XBAP applications) by
    default.


    By default, two namespaces are included in WPF applications, as shown in Listing
    7.1. The namespaces are added by using the xmlns attribute of the Window or Page
    element. The xmlns attribute is set as shown in the following code snippet:


    ```

    xmlns=http://schemas.microsoft.com/winfx/2006/presentation

    ```


    In the preceding code snippet, the xmlns attribute is set to the default namespace
    for the XAML code and WPF applications. This namespace is provided as a Uniform
    Resource Indicator (URI). The namespace includes all the XAML elements and attributes
    that are required to work with WPF.


    The second xmlns attribute is set as shown in the following code snippet:


    ```

    xmlns:x=http://schemas.microsoft.com/winfx/2006/xaml

    ```


    In the preceding code snippet, the xmlns attribute is set to the namespace that
    is required to work with XAML in general. This namespace is more exhaustive than
    the default namespace as it provides all the essential XAML elements and attributes,
    including those that do not pertain to WPF, for example, the elements for WF and
    Silverlight.


    Note that the second xmlns attribute (that refers to the XAML namespace) specifies
    x: as an alias for the namespace. This alias has to be prefixed with every element
    or attribute that belongs to the XAML namespace. For example, the x:Class attribute
    used in the Window element belongs to the XAML namespace and specifies the partial
    class (in the code-behind file) that implements the Window element, as shown in
    the following code snippet:


    ```

    x:Class="wpfApplication1.MainWindow"

    ```


    > Note

    > You can add the xmlns attribute in any of the XAML elements. However, it is
    advisable to add the references in the root element of the XAML file, that is,
    the Window or Page element.


    # Markup Extensions


    Till now you learned to set properties of elements, such as buttons, by using
    string or numeric values directly and explicitly. However, in some cases, you
    may not want to directly set the properties to string or numeric values; rather,
    you may want the properties to be set to a reference to a particular object. For
    such situations, WPF offers markup extensions. A markup extension is a means of
    setting the value of a property to an object reference. It also allows you to
    delay the assignment of a value to a property until run time or to bind a property
    to a value.


    Markup extensions provide an easy, flexible, and efficient way of assigning values
    to properties through attributes as well as the property element syntax. In WPF,
    markup extensions are offered by various markup extension classes that help you
    to set the property to different types of values. The markup extension classes
    inherit the System.Windows.Markup.MarkupExtension class. Table 7.1 lists some
    of the common markup extension classes:


    Table 7.1: Common Markup Extension Classes


    | Markup Extension Classes | XAML String Token | Description |

    |---|---|---|

    | BindingBase | Binding | Allows you to specify a data bound value for a given
    property |

    | StaticResourceExtension | StaticResource | Allows you to specify an existing
    resource to determine the value of a property |'
  merge: -1
  img_proc: true
- pgno: 234
  md: "Table 7.1: Common Markup Extension Classes\n\n| Markup Extension Classes |\
    \ XAML String Token | Description |\n|---|---|---|\n| DynamicResourceExtension\
    \ | DynamicResource | Allows you to set a property value by delaying the reference\
    \ to a given resource until run time |\n\nMarkup extensions are characterized\
    \ by their syntax, which is very different from the rest of the XAML content.\
    \ You can provide a markup extension as either attributes or property elements.\
    \ If you want to provide a markup extension as an attribute, you need to enclose\
    \ it within the curly braces { }. The opening curly brace is followed by the string\
    \ token for the markup extension class. The string token is followed by a whitespace,\
    \ which is then followed by the input to the markup extension. Consider the following\
    \ XAML code snippet:\n\n```\n<Button Margin=\"100\" Name=\"button1\" Content=\"\
    welcome\" Style=\"{StaticResource mybackground}\"/>\n```\n\nIn the preceding code\
    \ snippet, the StaticResource markup extension is used in the Button element to\
    \ set the value for its Style property. This implies that the Style property of\
    \ the Button element takes the value of the mybackground resource. You learn more\
    \ about resources and styles later in this chapter.\n\nNow, let's discuss the\
    \ controls available in WPF 4.0.\n\n# Working with WPF 4.0 Controls\n\nA control\
    \ is a UI element that allows interaction between an application and the users\
    \ of the application. WPF has a rich set of controls that allow you to develop\
    \ high-end applications. Some of the WPF controls are similar to those in Windows\
    \ Forms, such as the Button and TextBox controls. However, certain WPF controls,\
    \ such as Grid and Canvas, are unique in terms of their appearance and behavior.\
    \ In addition, some new controls, such as DataGrid, Calendar, and DatePicker,\
    \ have been introduced in WPF 4.0.\n\nIn WPF, you can add controls and work with\
    \ them in both the Design view and the code-behind file. However, it is recommended\
    \ that you define the look of the controls in the Design view and the behavior\
    \ of the controls in the code-behind file. You can add a control in a WPF application\
    \ by dragging the control from the Toolbox and dropping it on the Design view.\
    \ You can also add a control by double-clicking it in the Toolbox or writing the\
    \ corresponding XAML code in the XAML view. Note that changes to a control in\
    \ the Design view are automatically reflected in the XAML view and vice versa.\n\
    \n> **Note**\n> \n> Most of the WPF controls are derived from the System.Windows.Controls.Control\
    \ class, which itself inherits the System.Windows.FrameworkElement class.\n\n\
    Some common controls available in WPF 4.0 are as follows:\n\n+   - The Grid control\n\
    +   - The Button control\n+   - The TextBox control\n+   - The PasswordBox control\n\
    +   - The TextBlock control\n+   - The Border control\n+   - The GridSplitter\
    \ control\n+   - The Canvas control\n+   - The StackPanel control\n+   - The DataGrid\
    \ control\n+   - The Calendar control\n+   - The DatePicker control\n\nLet's discuss\
    \ these controls one by one, starting with the Grid control."
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Using the Grid Control


    When you create a WPF application, you may notice that a Grid control is automatically
    added to the default window or page in the application. Every window or page in
    a WPF application (standalone or XBAP) contains a Grid control by default.


    The Grid control is one of the most common and flexible container controls. A
    container control refers to a control that encompasses other controls and provides
    a predefined layout for these controls. The controls that are encompassed or contained
    within a container control are known as child controls or elements. In a Grid
    control, the child elements are contained in the cells of a grid. By default,
    a Grid control consists of a single cell, that is, one row and one column. However,
    you can create additional cells (rows and columns) in the Grid control by using
    the properties of the control.


    The Grid control is an instance of the Grid class, which has various properties
    that allow you to work with the control. Table 7.2 lists the noteworthy properties
    of the Grid class:


    Table 7.2: Noteworthy Properties of the Grid Class


    | Property | Description |

    |---|---|

    | ColumnDefinitions | Retrieves an ordered collection of columns defined in a
    Grid control |

    | RowDefinitions | Retrieves an ordered collection of rows defined in a Grid control
    |

    | ShowGridLines | Retrieves or sets a value that indicates whether or not the
    grid lines between the cells of a Grid control are visible |

    | Column | Retrieves or sets a value that indicates the column in which a child
    element of a Grid control appears |

    | ColumnSpan | Retrieves or sets a value that indicates the number of columns
    that a child element of a Grid control spans |

    | Row | Retrieves or sets a value that indicates the row in which a child element
    appears in a Grid control |

    | RowSpan | Retrieves the number of rows that a child element spans in a Grid
    control |


    > **Note**

    > The Column, ColumnSpan, Row, and RowSpan properties listed in Table 7.2 are
    attached properties of the Grid control. An attached property is a property of
    a control that can be accessed and set by other controls. For instance, the Column,
    ColumnSpan, Row, and RowSpan properties of the Grid control can be accessed by
    its child elements.


    Now, let''s create a standalone WPF application named GridDemo to show the use
    of the Grid control. For this, perform the following steps:


    +   1. Click Start→All Programs→Microsoft Visual Studio 2010→Microsoft Visual
    Studio 2010 to open the Visual Studio 2010 IDE.

    +   2. Select File→New→Project from the menu bar in the Visual Studio 2010 IDE,
    to open the New Project dialog box.

    +   3. Select Visual C#→Windows in the Installed Templates pane and the WPF Application
    option from the middle pane of the New Project dialog box.

    +   4. Enter the name GridDemo in the Name text box and specify an appropriate
    location for the application in the Location combo box.

    +   5. Click the OK button. The GridDemo application is created.

    +   6. Now add the highlighted code given in Listing 7.3, in the MainWindow.xaml
    file:'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Listing 7.3: Adding Rows and Columns in a Grid Control


    ```

    <Window x:Class="GridDemo.MainWindow"

    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"

    Title="Demo Grid" Height="300" Width="300">

    <Grid ShowGridLines="True" Background="Cornsilk">

    <Grid.RowDefinitions>

    <RowDefinition Height="68"/>

    <RowDefinition Height="68"/>

    <RowDefinition Height="68"/>

    <RowDefinition Height="68"/>

    </Grid.RowDefinitions>

    <Grid.ColumnDefinitions>

    <ColumnDefinition Width="139"/>

    <ColumnDefinition Width="139"/>

    </Grid.ColumnDefinitions>

    </Grid>

    </Window>

    ```


    In Listing 7.3, the ShowGridLines property of the Grid control is set to True,
    which implies that straight lines are visible between the rows and columns of
    the grid. The grid has two child elements, Grid.RowDefinitions and Grid.ColumnDefinitions.
    The Grid.RowDefinitions element refers to the RowDefinitions property of the grid,
    which allows you to define a collection of rows in the grid. The Grid.ColumnDefinitions
    element refers to the ColumnDefinitions property, which allows you to define a
    collection of columns in the grid. The Grid.RowDefinitions element has four RowDefinition
    elements, each corresponding to a row. Similarly, the Grid.ColumnDefinitions element
    has two ColumnDefinition elements, each of which corresponds to a column.


    7 Press the F5 key to run the application. The output appears, as shown in Fig.C#7.18:


    ![](img/2db4b8b2cb67e7ccc52477a61fe289ab_236_0.png)


    Fig.C#7.18 shows the grid lines between the rows and columns of a Grid control.


    # Using the Button Control


    The Button control in WPF is similar to the one available for Windows Forms applications.
    It allows you to perform an action when a user clicks it. The Button control in
    WPF is a basic UI component that can contain text as well as an image.


    The Button control is an instance of the Button class. Table 7.3 lists the noteworthy
    properties of the Button class:


    Table 7.3: Noteworthy Properties of the Button Class


    | Property | Description |

    |---|---|

    | IsCancel | Retrieves or sets a value that specifies whether or not a Button
    control is a Cancel button |

    | ClickMode | Retrieves or sets a value that indicates when the Click event of
    a Button control occurs, that is, when the mouse button is clicked, moved over
    the control, or released |'
