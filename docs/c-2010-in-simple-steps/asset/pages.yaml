    \n![](img/2db4b8b2cb67e7ccc52477a61fe289ab_86_2.png)\n\n# Fig.C+3.4\n\nAfter you\
    \ enter a number, the if statement inside the program checks the number. In case,\
    \ the number is divisible by two, the program control enters the if block and\
    \ displays the result that the number entered is even. However, note that we have\
    \ not specified any code that must execute when you enter a number that is not\
    \ divisible by 2. For this purpose, an else clause is used with the if statement.\
    \ The else clause is executed when the condition for the if block is not fulfilled.\
    \ In other words, when the condition for the if block evaluates to false, the\
    \ block of code inside the else block is executed.\n\n```\nif condition // condition\n\
    {\n    //statement\n}\nelse\n{\n    // else statement\n}\n```\n\nThe syntax of\
    \ the if...else statement is as follows:\n\nIn the preceding syntax, if the condition\
    \ specified inside the if block is evaluated to false, the statement inside the\
    \ else block is executed.\n\nNow, let's consider the If Example application created\
    \ in Listing 3.1 to learn how to use the if...else statement. Perform the following\
    \ steps in the If Example application to learn how an if...else statement works:\n\
    \n# Listing 3.2: Using the else Statement\n\n1 Add the code, given in Listing\
    \ 3.2, after the code of the if block given in Listing 3.1:\n\n```\n//This is\
    \ the else block.\nelse\n{\n    Console.WriteLine(\"The number entered is odd\"\
    );\n}\n```\n\n2 Press the F5 key to run the If Example application and enter an\
    \ odd number. The output appears, as shown in Fig.C+3.5:"
