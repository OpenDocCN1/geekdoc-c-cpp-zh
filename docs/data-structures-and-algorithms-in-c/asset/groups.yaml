  mdcn: "\n\n# 选择排序\n\n对于一个元素数组，选择最小的元素，并将其放在数组的开头；然后选择下一个最小的元素，并将其放在紧邻最小元素的位置；重复此操作，直到整个数组完成排序。\n\
    \n例如，原始数组为：2, 6, 9, 3, 5, 7\n\n我们使用 `min` 来存储当前遇到的最小值的索引；从开头的 2 开始，由于开头只遇到了 1\
    \ 个元素，我们将 `min` 设为 2，然后将其他元素与当前最小元素进行比较，没有元素比 2 小，因此 2 是数组中最小的元素。2 位于数组的开头。此时数组为：2,\
    \ 6, 9, 3, 5, 7\n\n我们移动到下一个 6，在这一轮中我们不需要考虑已经定位的 2。目前 6 是我们遇到的唯一元素，将 6 的索引赋值为最小；并将其他元素与\
    \ 6 进行比较，6<9 无变化，6<3，我们将 `min` 赋值为 3 的索引，3<5 无变化，3<7 无变化，因此 `min` 为 3，我们将 3 与当前轮的开头即\
    \ 6 进行交换：\n\n+ 2, 3, 9, 6, 5, 7\n\n我们现在移动到下一轮的下一个元素即 9；9<6，`min` 指向 6；6<5，`min`\
    \ 指向 5；5<7 无变化，因此当前轮 5 是最小的，我们将 5 与 9 交换：2, 3, 5, 6, 9, 7\n\n下一轮，`min` 指向 6，6<9\
    \ 无变化，6<7 无变化，`min` 指向 6：\n\n+ 2, 3, 5, 6, 9, 7\n\n下一轮：`min` 指向 9，9>7，`min` 指向\
    \ 7；7 与 9 交换：\n\n2, 3, 5, 6, 7, 9\n\n下一轮，`min` 指向 9，即数组的最后一个元素，现在数组已排序：\n\n2,\
    \ 3, 5, 6, 7, 9\n\n该算法如下：\n\n```cpp\n// 选择排序算法\nvoid SelectionSort(int A[], int\
    \ length)\n{\n//i 和 j 用于轮次循环\n//min 获取最小值的索引\n//temp 用作值交换的临时位置\nint i, j, min,\
    \ temp;\n\n// 它需要 length-1 轮循环，每轮选择一个最小值\n// 它从第 1 个元素开始，每轮的最小值将与第 i 位置的值进行交换\n\
    for (i = 0; i < length - 1; i++)\n{\n// 将 min 索引赋值为每轮的开头\nmin = i;\n\n// 比较直到数组末尾的元素\n\
    for (j = i + 1; j < length; j++)\n{\n// 如果找到了更小的值，则将 min 改为较小值的索引\nif (A[j] <\
    \ A[min])\n{\nmin = j;\n}\n}\n// 将最小值与 i 位置的值进行交换\nif (min != i)\n{\n    temp\
    \ = A[i];\n    A[i] = A[min];\n    A[min] = temp;\n}\n// 下一轮 i=i+1，将移动到下一个元素作为下一轮\n\
    }\n}\n```\n\n例如，假设有一个包含 A, B, C 和 D 的列表\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_55_0.png)\n\
    \n在这里我们想要插入另一个元素 H 在 C 和 D 之间，因此链表结构改变如下：\n\n对链表执行插入操作的代码：\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_55_1.png)\n\
    \n```cpp\n// 在列表中找到包含 SearchValue 的节点，在找到的值后插入一个带有 ToInsert 值的节点\n// 如果未找到该值，则插入到列表末尾\n\
    // 完成后返回列表\nNode * InsertNode(string ToInsert, Node * AList, string SearchValue)\n\
