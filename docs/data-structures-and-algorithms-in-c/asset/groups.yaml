- md: "\nIt prints out:\n\n2, 3, 1, 5, 9, 0, 2, 10, 12, 26, 3, 1\n\n# Binary Search\
    \ Tree\n\nIn a binary search tree, for each node, the value of the left node is\
    \ less than the value of the root node; the value of the right node is larger\
    \ than the value of the root node. For example, with the following binary tree:\n\
    \n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_74_0.png)\n\nFirst let's program how\
    \ to construct this tree.\n\n```cpp\n#include <iostream>\n#include <string>\n\
    using namespace std;\n\n//tree node structure\nclass TreeNode {\npublic:\nTreeNode\
    \ * leftChild;\nTreeNode * rightChild;\nint value;\n\n//default constructor\n\
    TreeNode(){}\n```\n\n```cpp\n//constructor, assign a value to the node\nTreeNode(int\
    \ val)\n{\n    value = val;\n}\n```\n\n```cpp\n//Binary Tree method and root property\n\
    class BinaryTree{\npublic:\n    TreeNode * root;\n```\n\n```cpp\n//constructor,\
    \ assign a value to the root of the binary tree\nBinaryTree(int aValue)\n{\n \
    \   root = new TreeNode(aValue);\n}\n```\n\n```cpp\n//insert a node to the tree\
    \ recursively finds out is correct location\nvoid InsertNode(TreeNode * subRoot,\
    \ TreeNode * tn)\n{\n    if (subRoot == NULL) {\n        subRoot = tn;\n    }\n\
    \n    if (tn->value < subRoot->value)\n{\n  InsertNode(subRoot->leftChild, tn);\n\
    }\nelse if (tn->value > subRoot->value)\n{\n  InsertNode(subRoot->rightChild,\
    \ tn);\n}\n}\n```\n\n```cpp\n//Print out all values in the Binary Tree\nvoid printTree(TreeNode\
    \ * subRoot)\n{\n  if (subRoot->leftChild != NULL) printTree(subRoot->leftChild);\n\
    \  cout << subRoot->value;\n  if (subRoot->rightChild != NULL) printTree(subRoot->rightChild);\n\
    }\n\nint main ()\n{\n  BinaryTree * bt = new BinaryTree(21);\n\n  TreeNode * tn\
    \ = new TreeNode(18);\n  bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(8);\n\
    \  bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(35);\n  bt->InsertNode(bt->root,\
    \ tn);\n  tn = new TreeNode(25);\n  bt->InsertNode(bt->root, tn);\n  tn = new\
    \ TreeNode(23);\n  bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(62);\n \
    \ bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(78);\n  bt->InsertNode(bt->root,\
    \ tn);\n\n  bt->printTree(bt->root);\n  return 0;\n}\n```\n\n**printTree** method\
    \ in this example is **an In-Order Traverse**, it first traverse the left child\
    \ and then the parent node, and then the right child, so it prints out:\n\n8,\
    \ 18, 21, 23, 25, 35, 62, 78.\n\nWe can see that the number is sorted ascending\
    \ by printing them using In-order traverse.\n\n# Width first Traverse\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_79_0.png)\n\
    \nWidth first traverse will traverse nodes level by level starting from the root.\
    \ In the above tree, width first traverse order is: 21, 18, 35, 8, 25, 62, 23,\
    \ 78\n\nThe algorithm is as following using queue data structure. In order to\
    \ use queue, need to add #include <queue>to the very beginning of the C++ code\n\
    \n```cpp\nvoid BreadthFirstTraversal(TreeNode *root)\n{\nqueue<TreeNode> que;\n\
    \nif (root == NULL) return;\n\nque.push(*root);\nwhile (!que.empty()) {\n  TreeNode\
    \ temp = que.front();\n  int val = temp.value;\n  cout << val;\n\n  if (temp.leftChild\
    \ != NULL) que.push(*temp.leftChild);\n\n  if (temp.rightChild != NULL) que.push(*temp.rightChild);\n\
    }\n}\n```\n\n# Depth First Traverse\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_82_0.png)\n\
    \nDepth first traverse will traverse nodes branch by branch starting from the\
    \ root. In the above tree, width first traverse order is: 21, 18, 8, 35, 25, 23,\
    \ 62, 78.\n\nDepth first traverse is also Pre-Order Traverse. It traverses the\
    \ parent node first and then traverses its left child and then the right child.\n\
    \nThe algorithm is as following, using the stack as data structure:\n\n```cpp\n\
    void PreOrderTraversal(TreeNode * root)\n{\n    stack<TreeNode*> sta;\n\n    if\
    \ (root == NULL) return;\n\n    sta.push(root);\n    while (!sta.empty()) {\n\
    \        TreeNode * temp = sta.top();\n        sta.pop();\n        int val = temp->value;\n\
    \        cout << val;\n\n        if (temp->rightChild != NULL) sta.push(temp->rightChild);\n\
    \n        if (temp->leftChild != NULL) sta.push(temp->leftChild);\n    }\n}\n\
    ```\n\n# Binary Tree Search\n\nFor example, we need to search the value 25, we\
    \ compare 25 with the root 21, it is larger than 21, we continue search its right\
    \ branch, which is 35, 25 is smaller than 35, we will continue 35’s left branch,\
    \ and then we found 25.\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_85_0.png)\n\
    \nTo search a value in the binary search tree, we compare the value with the parent\
    \ node, if the value is less than the parent, we search its left branch; if the\
    \ value is bigger than the parent, and we search its right branch, until we found\
    \ the value, or until no other value can be compared.\n\n```cpp\nbool Search(int\
    \ val, TreeNode * root)\n{\n  TreeNode * current=root;\n\n  while (current!=NULL)\
    \ {\n    if (val<current->value) current=current->leftChild;\n    else if (val>current->value)\
    \ current=current->rightChild;\n    else return true;\n  }\n  return false;\n\
    }\n```\n"
  mdcn: "\n\n输出如下：\n\n2, 3, 1, 5, 9, 0, 2, 10, 12, 26, 3, 1\n\n# 二叉搜索树\n\n在二叉搜索树中，对于每个节点，左子节点的值小于根节点的值；右子节点的值大于根节点的值。例如，对于如下二叉树：\n\
    \n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_74_0.png)\n\n首先让我们编写程序来构建这棵树。\n\n```cpp\n\
    #include <iostream>\n#include <string>\nusing namespace std;\n\n//树节点结构\nclass\
    \ TreeNode {\npublic:\nTreeNode * leftChild;\nTreeNode * rightChild;\nint value;\n\
    \n// 默认构造函数\nTreeNode(){}\n```\n\n```cpp\n// 构造函数，给节点赋值\nTreeNode(int val)\n{\n\
    \    value = val;\n}\n```\n\n```cpp\n// 二叉树类和根节点属性\nclass BinaryTree{\npublic:\n\
    \    TreeNode * root;\n```\n\n```cpp\n// 构造函数，给二叉树的根赋值\nBinaryTree(int aValue)\n\
    {\n    root = new TreeNode(aValue);\n}\n```\n\n```cpp\n// 插入节点到树，递归寻找正确的位置\nvoid\
    \ InsertNode(TreeNode * subRoot, TreeNode * tn)\n{\n    if (subRoot == NULL) {\n\
    \        subRoot = tn;\n    }\n\n    if (tn->value < subRoot->value)\n{\n  InsertNode(subRoot->leftChild,\
    \ tn);\n}\nelse if (tn->value > subRoot->value)\n{\n  InsertNode(subRoot->rightChild,\
    \ tn);\n}\n}\n```\n\n```cpp\n// 打印二叉树中所有的值\nvoid printTree(TreeNode * subRoot)\n\
    {\n  if (subRoot->leftChild != NULL) printTree(subRoot->leftChild);\n  cout <<\
    \ subRoot->value;\n  if (subRoot->rightChild != NULL) printTree(subRoot->rightChild);\n\
    }\n\nint main ()\n{\n  BinaryTree * bt = new BinaryTree(21);\n\n  TreeNode * tn\
    \ = new TreeNode(18);\n  bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(8);\n\
    \  bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(35);\n  bt->InsertNode(bt->root,\
    \ tn);\n  tn = new TreeNode(25);\n  bt->InsertNode(bt->root, tn);\n  tn = new\
    \ TreeNode(23);\n  bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(62);\n \
    \ bt->InsertNode(bt->root, tn);\n  tn = new TreeNode(78);\n  bt->InsertNode(bt->root,\
    \ tn);\n\n  bt->printTree(bt->root);\n  return 0;\n}\n```\n\n此示例中的 **printTree**\
    \ 方法是**中序遍历**，它首先遍历左孩子，然后是父节点，最后是右孩子，因此它的输出为：\n\n8, 18, 21, 23, 25, 35, 62, 78.\n\
    \n我们可以看到，通过中序遍历打印，数字是按升序排序的。\n\n# 宽度优先遍历\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_79_0.png)\n\
    \n宽度优先遍历将从根节点开始层层遍历节点。在上面的树中，宽度优先遍历的顺序是：21, 18, 35, 8, 25, 62, 23, 78。\n\n使用队列数据结构的算法如下。为了使用队列，需要在代码最开始添加\
    \ #include <queue>\n\n```cpp\nvoid BreadthFirstTraversal(TreeNode *root)\n{\n\
    queue<TreeNode> que;\n\nif (root == NULL) return;\n\nque.push(*root);\nwhile (!que.empty())\
    \ {\n  TreeNode temp = que.front();\n  int val = temp.value;\n  cout << val;\n\
    \n  if (temp.leftChild != NULL) que.push(*temp.leftChild);\n\n  if (temp.rightChild\
    \ != NULL) que.push(*temp.rightChild);\n}\n}\n```\n\n# 深度优先遍历\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_82_0.png)\n\
    \n深度优先遍历将从根节点开始分支遍历节点。在上面的树中，宽度优先遍历的顺序是：21, 18, 8, 35, 25, 23, 62, 78。\n\n深度优先遍历也是前序遍历。它先遍历父节点，然后遍历左孩子，最后遍历右孩子。\n\
    \n使用栈数据结构的算法如下：\n\n```cpp\nvoid PreOrderTraversal(TreeNode * root)\n{\n    stack<TreeNode*>\
    \ sta;\n\n    if (root == NULL) return;\n\n    sta.push(root);\n    while (!sta.empty())\
    \ {\n        TreeNode * temp = sta.top();\n        sta.pop();\n        int val\
    \ = temp->value;\n        cout << val;\n\n        if (temp->rightChild != NULL)\
    \ sta.push(temp->rightChild);\n\n        if (temp->leftChild != NULL) sta.push(temp->leftChild);\n\
    \    }\n}\n```\n\n# 二叉树搜索\n\n例如，我们需要搜索值 25，我们将 25 与根节点 21 比较，它大于 21，我们继续搜索它的右分支，即\
    \ 35；25 小于 35，我们将继续搜索 35 的左分支，然后找到了 25。\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_85_0.png)\n\
    \n在二叉搜索树中搜索值，我们将该值与父节点比较，如果值小于父节点，我们搜索它的左分支；如果值大于父节点，我们搜索它的右分支，直到找到该值，或者没有其他可以比较的值了。\n\
