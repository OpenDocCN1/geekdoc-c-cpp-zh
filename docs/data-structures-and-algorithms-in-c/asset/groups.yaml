    # Delete an element from an array.


    To delete an element from the array at the index q, after deleting the element,
    there is a space empty in this array at the location q, in this case, all elements
    behind the index q will move one spot forward so that the elements in the array
    are adjacent to each other.


    If q is the end of the array, the operation is easy, just remove the element in
    the array, and no need to move the element behind it to be one spot forward since
    there is no element behind it.


    If q is the middle of the array, then need to move all the elements behind q one
    spot at a time starting from the element right behind the q spot, and then one
    after another until the element at the very end of the array.


