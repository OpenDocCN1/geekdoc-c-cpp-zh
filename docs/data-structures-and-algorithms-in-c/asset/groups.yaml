- md: "\n# Selection Sort\n\nFor an array of elements, select the smallest element,\
    \ and put it to the beginning of the array; and then select the next smallest\
    \ element, and put it to the position next to the smallest element; do the same\
    \ thing until the whole array is sorted.\n\nFor example, the original array is:\
    \ 2, 6, 9, 3, 5, 7\n\nWe use min to store the index where the current smallest\
    \ value we have met; from the beginning 2, since the beginning only 1 element\
    \ is met, we set min to be 2, and then compare the other elements with the current\
    \ smallest element, no element is smaller than 2, so 2 is the smallest element\
    \ in the array. 2 is positioned at the beginning of the array. 2, 6, 9, 3, 5,\
    \ 7\n\nWe move to the next 6, in this round we don’t need to consider 2, which\
    \ is already positioned. Currently 6 is the only element we meet, assign the index\
    \ of 6 to be the smallest; and compare the other elements with 6, 6<9 no change,\
    \ 6<3, we assign the min to be the index of 3, 3<5, no change, 3<7, no change,\
    \ so min is 3, we swap 3 with the beginning of current round which is 6:\n\n+\
    \ 2, 3, 9, 6, 5, 7\n\nWe now move to the next element in the next round which\
    \ is 9; 9<6, min is pointed to 6; 6<5, min points to 5; 5<7, no change, so current\
    \ round 5 is the smallest, we swap 5 with 9: 2, 3, 5, 6, 9, 7\n\nNext round, min\
    \ points to 6, 6<9, no change, 6<7, no change, min points to 6:\n\n+ 2, 3, 5,\
    \ 6, 9, 7\n\nNext round: min points to 9, 9>7, min points to 7; 7 swap with 9:\n\
    \n2, 3, 5, 6, 7, 9\n\nNext round, min points to 9, the last element in the array,\
    \ the array is sorted now:\n\n2, 3, 5, 6, 7, 9\n\nThe algorithm is as following:\n\
    \n```cpp\n// Selection Sort Algorithm\nvoid SelectionSort(int A[], int length)\n\
    {\n//i and j are used for the rounds\n//min gets the index of minimum value\n\
    //temp is used as temporary place for values swap\nint i, j, min, temp;\n\n//it\
    \ takes length-1 rounds, each round selects the minimum value\n//it starts from\
    \ the 1st element, the minimum value of each round will be swapped with the value\
    \ in the ith location\nfor (i = 0; i < length - 1; i++)\n{\n//assign the min index\
    \ to the beginning of each round\nmin = i;\n\n//compare the element up to the\
    \ end of the array\nfor (j = i + 1; j < length; j++)\n{\n//if smaller value is\
    \ found, change the min value to be the smaller value index\nif (A[j] < A[min])\n\
    {\nmin = j;\n}\n}\n//swap the minimum value with the i index value\nif (min !=\
