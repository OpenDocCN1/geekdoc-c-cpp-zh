    \ loop below.\n\nNode * current=head;\n\n```\nwhile ( current != 0 ) {\n    cout\
    \ << (*current).data;\n    current = (*current).next;\n}\n```\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_11_0.png)\n\
    \nFor a list, you can easily append another node at the end of the list; or insert\
    \ another node at the beginning or in the middle of the list. The same thing,\
    \ you can easily remove a node from anywhere of the list, just remember that after\
    \ removing the middle node, you need to connect the node before the removed node\
    \ with the node after the removed so that the list won't be broken. The same when\
    \ inserting a node, you need to link the existing list with the inserted node\
    \ point to the next element in the list, and make the previous node point to the\
    \ inserted node.\n\nTo search an element in the linked list, we start from the\
    \ head of the list, and from the first node, we get the location of its next node,\
    \ and from the next node, we will continue to get the location of its own next\
    \ node, and in such way, we walk through all the nodes in the list. Whenever locating\
    \ a node, we compare the value in the node with the value that needs be searched,\
    \ if we find out the node, we will return this node location; otherwise we walk\
    \ to the end of the list, if the last node of the list does not satisfied the\
    \ search criteria,"
