    # Bubble Sort


    If to sort the array to be ascending, bubble sort indicates the biggest element
    will flow to the end of the array, like a bubble. After the biggest element on
    the top, the second biggest element to flow to the position next to the biggest
    element, and so on until the end of the element, which is the smallest element
    will be at located at the beginning of the array. In this way, all the elements
    are sorted.


    For example, the original array is: 2, 6, 9, 3, 5, 7


    We will start from the first element: 2:


    2<6, no swap; 6<9, no swap; 9>3, swap:


    2, 6, 3, 9, 5, 7


    9>5, swap: 2, 6, 3, 5, 9, 7


    9>7, swap: 2, 6, 3, 5, 7, 9


    No more element to swap for this round, 9 is the biggest element in the array


    Next round: 2<6, no swap; 6>3, swap:


    2, 3, 6, 5, 7, 9


    6>5, swap: 2, 3, 5, 6, 7, 9


    6<7, no swap, so 7 is the second largest element in the array:


    2, 3, 5, 6, 7, 9'
