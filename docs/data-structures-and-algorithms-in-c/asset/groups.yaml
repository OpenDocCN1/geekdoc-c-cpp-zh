    # Stack


    The characteristics of a stack are First In Last Out (FILO), and last in first
    out. For example you put several books on the table, one on the top of another,
    the first book you put will be on the bottom; and the last book you put will be
    on the top. Several days later, when you want to move these books by one, the
    first book you get is on the top, which was the last one put on the other books
    several days ago; and the last book you get is the book on the bottom, which was
    the first you put on the table several days ago. So in this case, it is first
    in last out, and last in first out. It is called a Stack.


    If the following is a stack, not a queue, and assume the right hand side is the
    end of the stack, the first one you can pop from the stack is Melon.


    | Apple | Orange | Banana | Cherry | Peach | Melon |


    After Melon is removed from the stack, the stack will look like the following.
    At this moment, Peach is the top one in the stack. At this moment, we can only
    remove or pop up the Peach.


    | Apple | Orange | Banana | Cherry | Peach |


    In such a sequence, after Peach it will be Cherry; after Cherry it will be Banana,
    after Banana it will be Orange, and the last is Apple. So the sequence is the
    opposite of queue.


