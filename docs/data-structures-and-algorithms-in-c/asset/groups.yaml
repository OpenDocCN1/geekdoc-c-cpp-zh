    \ :--- | :--- |\n\n# Sort an array\n\nIf the array stores integer value, sometimes\
    \ the elements in the array are not ordered ascending or descending. In order\
    \ to sort the array to ascending, there are different algorithms such as bubble\
    \ sort, insert sort, which are the most basic sorting algorithms.\n\n# Bubble\
    \ Sort\n\nTo sort the array to ascending, bubble sort indicates the biggest element\
    \ will flow to the end of the array, like a bubble. After the biggest element\
    \ on top, the second biggest element flows to the position next to the biggest,\
    \ and so on until the end, which the smallest element will be located at the beginning\
    \ of the array. In this way, all the elements are sorted.\n\nFor example, the\
    \ original array is: 2, 6, 9, 3, 5, 7\n\nWe will start from the first element:\n\
    2<6, no swap; 6<9, no swap; 9>3, swap: 2, 6, 3, 9, 5, 7\n9>5, swap: 2, 6, 3, 5,\
    \ 9, 7\n9>7, swap: 2, 6, 3, 5, 7, 9\nNo more element to swap for this round, 9\
    \ is the biggest element in the array.\n\nNext round: 2<6, no swap; 6>3, swap:\
    \ 2, 3, 6, 5, 7, 9\n6>5, swap: 2, 3, 5, 6, 7, 9\n6<7, no swap, so 7 is the second\
    \ largest element in the array: 2, 3, 5, 6, 7, 9\n\nNext round: 2<3, no swap;\
    \ 3<5, no swap; 5<6, no swap: 2, 3, 5, 6, 7, 9\nNext round: 2<3, no swap; 3<5,\
    \ no swap: 2, 3, 5, 6, 7, 9\nNext round: 2<3, no swap: 2, 3, 5, 6, 7, 9\nNext\
    \ round: 2 is the only element left for comparison, no swap: 2, 3, 5, 6, 7, 9\n\
    \nThe array is sorted now. The algorithm is as follows:\n\n```cpp\n/* BubbleSort\
    \ Algorithm */\nvoid BubbleSort(int A[], int length)\n{\n  /* variables to use\
    \ in the algorithm */\n  int i, j, temp;\n\n  /* i indicates upto which element\
    \ that the current round will compare to; for each round the biggest value flows\
    \ up to the end of the index range */\n  for (i = length-1; i >= 0; i--)\n  {\n\
    \    /* each round compare from the first element till the last element in the\
    \ range */\n    for (j = 1; j <= i; j++)\n    {\n      /* compare the element\
    \ with its upper element, swap if current element is bigger than its upper element\
    \ */\n      if (A[j - 1] > A[j])\n      {\n        /*do the swap between A[j-1]\
    \ and A[j]*/\n        temp = A[j - 1];\n        A[j - 1] = A[j];\n        A[j]\
    \ = temp;\n      }\n    }\n  }\n}\n```\n\n# Insertion Sort\n\nFor an array of\
    \ elements, start from the beginning, make the elements before the element that\
    \ will be inserted sorted (the first element is itself so it is sorted already);\
    \ for the element to be inserted, compare it with the already sorted elements,\
    \ get the location to be inserted. Do the same thing until the whole array is\
    \ sorted.\n\nFor example, the original array is: 2, 6, 9, 3, 5, 7\n\nWe will start\
    \ from the first element:\n2<6, no swap; 6<9, no swap; 9>3, swap: 2, 6, 3, 9,\
    \ 5, 7\n9>5, swap: 2, 6, 3, 5, 9, 7\n9>7, swap: 2, 6, 3, 5, 7, 9\n\nNext round:\
    \ 2<6, no swap; 6>3, swap: 2, 3, 6, 5, 7, 9\n6>5, swap: 2, 3, 5, 6, 7, 9\n6<7,\
    \ no swap, so 7 is the second largest element in the array: 2, 3, 5, 6, 7, 9\n\
    \nNext round: 2<3, no swap; 3<5, no swap; 5<6, no swap: 2, 3, 5, 6, 7, 9\nNext\
    \ round: 2<3, no swap; 3<5, no swap: 2, 3, 5, 6, 7, 9\nNext round: 2<3, no swap:\
    \ 2, 3, 5, 6, 7, 9\n\nThe array is sorted now. The algorithm is as follows:\n\n\
    ```cpp\n/*Sorting to be ascending from left to right*/\nint* InsertionSort(int\
    \ * A, int length)\n{\nint i, j, current;\n/*A[0]-A[i-1] are sorted, i starts\
    \ from 1;\nstart from the 2nd element until the last element in the array*/\n\
    for (i = 1; i < length; i++)\n{\ncurrent = A[i];\n/*j starts from the same value\
    \ as i, and go forward to compare the values\nget the location of the element\
    \ which is smaller than the current value which needs to be inserted*/\nfor (j\
    \ = i; j > 0 && A[j - 1] > current; j--)\n{\n  /*move one element that has larger\
    \ value backward to leave a space to be inserted*/\n  A[j] = A[j - 1];\n}\n/*get\
    \ the location to be inserted after the for loop*/\nA[j] = current;\n}\nreturn\
    \ A;\n}\n```\n"
