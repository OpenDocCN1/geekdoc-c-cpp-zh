- md: "\n# Data Structures and Algorithms in C++\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_0_0.png)\n\
    \nYujing He\n\n# Data Structures and Algorithms in C++\n\nCopyright @2012, Yujing\
    \ He\n\n# Content\n\n- [Data Structure](#)\n  - [Array](#)\n  - [Linked List](#)\n\
    \  - [Queue](#)\n  - [Stack](#)\n  - [Set](#)\n  - [Binary Tree](#)\n- [Algorithm](#)\n\
    \  - [Insert an element to an array](#)\n  - [Delete an element from an array.](#)\n\
    \  - [Search an element from an array](#)\n  - [Sort an array](#)\n  - [Bubble\
    \ Sort](#)\n  - [Insertion Sort](#)\n  - [Selection Sort](#)\n  - [Insert an element\
    \ to a list](#)\n  - [Delete an element from a list](#)\n\n- Get the intersection\
    \ of two arrays\n\n- Get the union of two arrays\n\n- Get the complement of an\
    \ array\n\n- Get the Cartesian product of two arrays\n\n- Binary Search Tree\n\
    \n- Width first Traverse\n\n- Depth First Traverse\n\n- Binary Tree Search\n\n\
    # Data Structure\n\nData structure is a way to represent the storage and the organization\
    \ of data in the computer for programming languages to easily access the data\
    \ and process the data within. There are several kinds of data structures that\
    \ are very commonly used: Array, List, Queue, Stack, Binary Tree, and Set that\
    \ we will discuss here.\n\nDifferent data structure has its own characteristics.\
    \ These data structures are used in most programming languages. Here we will use\
    \ the C++ language to represent those data structures and see how to use them.\n\
    \n# Array\n\nAn array is a sequence of data next to each other and one after another\
    \ in a linear order. Array elements normally are stored adjacent to each other\
    \ in the computer. Each element in the array is assigned a number associated with\
    \ it which is called index, which is from 0 to n-1, and n is the total number\
    \ of elements in the array because the index starts from 0 not from 1. For example,\
    \ if the array have 9 elements totally, and the index in this array will be from\
    \ 0 to 8, which is 0, 1, 2, 3, 4, 5, 6, 7, 8.\n\nIn C++, we use [] to indicate\
    \ that it is an array:\n\n```cpp\nstring A[4] = { \"a\", \"b\", \"c\", \"d\" };\n\
    ```\n\nThe above code shows that we initialize the array A to have four elements:\
    \ \"a\", \"b\", \"c\", \"d\". Each of these elements has its inherent index which\
    \ starts from 0. The \"a\" has the index 0, \"b\" has the index 1, \"c\" has the\
    \ index 2, and \"d\" has its index 3.\n\nThe Array A looks like the following:\n\
    \n| 0 | 1 | 2 | 3 |\n| a | b | c | d |\n\nTo access the element inside the array,\
    \ we just need to use A[t], here t can be from 0 to 3; but cannot be less than\
    \ 0 or larger than 3 since there are only 4 elements here, otherwise, it will\
    \ be out of bound of the range.\n\nTo access \"a\" which is the first element,\
    \ we use A[0]; to access \"b\" which is the 2nd element, we use A[1]; to access\
    \ \"c\" which is the 3rd element, we use A[2]; to access \"d\" which is the 4th\
    \ element, we use A[3].\n\nSo the number N’s element in the array, its index is\
    \ N-1. To access the element in the array by one, we can use the following \"\
    for\" statement. \"for\" statement is using the index to access each element with\
    \ the index from 0 to N-1. \"count << \" will print out each element.\n\n```cpp\n\
    for (int t = 0; t < 4; t++)\n{\n    cout << A[t];\n}\n```\n\n# Linked List\n\n\
    Linked List is a list of nodes connected one after another. Each node has a pointer\
    \ pointing to the address of next node. So in the computer, the nodes in the list\
    \ no need to be stored adjacent to each other. And in this case, unlike an array,\
    \ there is no index that can be used to access the node in the list directly.\
    \ You need to walk through the head of the list to the next, and then to the next\
    \ until the tail of the list.\n\nA -> B -> C -> D\n\nThe above is a list. The\
    \ list in the computer will be similar to the following:\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_9_0.png)\n\
    \nThe nodes in the list might or not be next to each other. The arrow in the diagram\
    \ represents the address of the next node. The last node point to no where, we\
    \ can use “null” to indicate, meaning no next node.\n\nEach node in the list has\
    \ two properties: data and next node’s address or it is called the next pointer;\
    \ Data field stores the actual data, such as string, integer, or floating number;\
    \ the next pointer stores the address of the next node.\n\nWe can use the following\
    \ struct to hold the two properties.\n\n```cpp\nstruct Node\n{\n    string data;\n\
    \    Node * next;\n};\n```\n\nTo construct the list, we provide value to the data\
    \ and the next for each node. “&” means to get the address of the node.\n\n```cpp\n\
    Node A;\nA.data = \"a\";\nNode B;\nB.data = \"b\";\nNode C;\nC.data = \"c\";\n\
    Node D;\nD.data = \"D\";\n```\n\n```cpp\nA.next = &B;\nB.next = &C;\nC.next =\
    \ &D;\n```\n\nTo access the node, we need to go from the first node, which is\
    \ called the header of the node, here in this list, the node A is the header of\
    \ this list.\n\nNode * head = &A;\n\nWe use the “current” pointer to indicate\
    \ each node that we arrive. For each current node, after print out the data it\
    \ holds, we move the current variable to the next node, and print its data until\
    \ the tail of the list.\n\n```cpp\nNode * current = head;\nwhile (current != nullptr)\
    \ {\n    cout << current->data;\n    current = current->next;\n}\n```\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_9_0.png)\n\
    \n# Queue\n\nThe characteristics of a queue are First In First Out (FIFO) and\
    \ Last In Out. It is like the line or queue in the real world. When you want to\
    \ purchase a coffee in Starbucks, the first customer gets served first, and the\
    \ last customer in line gets served last. The middle of the queue will be served\
    \ in sequence.\n\n| Apple | Orange | Banana | Cherry | Peach | Melon |\n\nIn the\
    \ above example, if the left side is the beginning of the queue, the first in\
    \ the queue is Apple, the following will be Orange, Banana, Cherry, Peach, Melon.\n\
    \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n#include\
    \ <queue>\n```\n\n```cpp\nint main ()\n{ /*create a queue \"Hello World !\"\n\
    \  queue<string> q;\n  q.push(\"Hello\");\n  q.push(\"\");\n  q.push(\"World\"\
    );\n  q.push(\"\");\n  q.push(\"!\");\n}\n```\n"
  mdcn: "\n\n# C++ 数据结构与算法\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_0_0.png)\n\n\
    Yujing He\n\n# C++ 数据结构与算法\n\nCopyright @2012, Yujing He\n\n# 目录\n\n- [数据结构](#)\n\
    \  - [数组](#)\n  - [链表](#)\n  - [队列](#)\n  - [栈](#)\n  - [集合](#)\n  - [二叉树](#)\n\
    - [算法](#)\n  - [向数组插入元素](#)\n  - [从数组中删除一个元素](#)\n  - [从数组中搜索一个元素](#)\n  - [对数组进行排序](#)\n\
    \  - [冒泡排序](#)\n  - [插入排序](#)\n  - [选择排序](#)\n  - [向链表插入元素](#)\n  - [从链表中删除一个元素](#)\n\
    \n- 获取两个数组的交集\n\n- 获取两个数组的并集\n\n- 获取数组的补集\n\n- 获取两个数组的笛卡尔积\n\n- 二叉搜索树\n\n- 广优先遍历\n\
    \n- 深度优先遍历\n\n- 二叉树搜索\n\n# 数据结构\n\n数据结构是在计算机中表示数据存储和组织的方式，以便编程语言能够轻松地访问和处理其中的数据。有几种常用的数据结构：我们在这里讨论的数组、链表、队列、栈、二叉树和集合。\n\
    \n不同的数据结构都有自己的特性。这些数据结构被用于大多数编程语言。在这里，我们将使用 C++ 语言来表示这些数据结构并查看如何使用它们。\n\n# 数组\n\
    \n数组是线性顺序上相邻且一个接一个的数据序列。数组元素通常在计算机中相邻存储。数组中的每个元素都分配了一个与其相关的数字，称为索引（index），范围从\
    \ 0 到 n-1，n 是数组中元素的总数，因为索引从 0 开始而不是从 1。例如，如果数组共有 9 个元素，那么该数组的索引将从 0 到 8，即 0, 1,\
    \ 2, 3, 4, 5, 6, 7, 8。\n\n在 C++ 中，我们使用 [] 来表示它是一个数组：\n\n```cpp\nstring A[4] =\
    \ { \"a\", \"b\", \"c\", \"d\" };\n```\n\n上面的代码显示我们初始化了数组 A 有四个元素：\"a\", \"b\"\
    , \"c\", \"d\"。这些元素中的每一个元素都有其从 0 开始的固有索引。\"a\" 的索引为 0，“b\" 的索引为 1，“c\" 的索引为 2，“d\"\
    \ 的索引为 3。\n\n数组 A 看起来如下：\n\n| 0 | 1 | 2 | 3 |\n| a | b | c | d |\n\n要访问数组内部的元素，我们只需要使用\
    \ A[t]，这里 t 可以从 0 到 3；但不能小于 0 或大于 3，因为这里只有 4 个元素，否则将越范围。\n\n要访问第一个元素 \"a\"，我们使用\
    \ A[0]；要访问第二个元素 \"b\"，我们使用 A[1]；要访问第三个元素 \"c\"，我们使用 A[2]；要访问第四个元素 \"d\"，我们使用 A[3]。\n\
    \n所以数组中第 N 个元素的索引是 N-1。要逐个访问数组中的元素，可以使用下面的 \"for\" 语句。\"for\" 语句使用索引来访问索引从 0 开始的每个元素。\n\
    \n```cpp\nfor (int t = 0; t < N; t++)\n{\n    cout << A[t];\n}\n```\n\n# 链表\n\n\
    链表是由一个接一个连接的节点列表。链表中的节点指向下一个节点的地址。在计算机中，链表节点是顺序存储的。与数组不同，我们需要从链表的头部开始访问，直到链表的末尾。\n\
    \nA -> B -> C -> D\n\n上面的列表如下所示：\n\n![](img/c11c4a3212693e8558c7b1c05f5b5ac7_9_0.png)\n\
    \n链表中的节点可能并不相邻。箭头表示下一个节点的地址。可以使用“null”来表示没有下一个节点。每个节点有两个属性：data和next。data 字段存储实际数据，如字符串、整数或浮点数；next指针存储下一个节点的地址。\n\
    \n我们可以使用以下结构体持有这两个属性：\n\n```cpp\nstruct Node\n{\n    string data;\n    Node *\
    \ next;\n};\n```\n\n为了构造链表，我们为数据和下一个提供值。\n\n```cpp\nNode A;\nA.data = \"a\";\n\
    Node B;\nB.data = \"b\";\nNode C;\nC.data = \"c\";\nNode D;\nD.data = \"d\";\n\
    ```\n\n```cpp\nA.next = &B;\nB.next = &C;\nC.next = &D;\n```\n\n要访问节点，我们需要从第一个节点开始，它是链表的头部。我们使用“current”指针来指示到达的每个节点。对于每个当前节点，在打印它保存的数据后，我们将当前变量移动到下一个节点，直到链表的末尾。\n\
    \n```cpp\nNode * current = &A;\nwhile (current != nullptr) {\n    cout << current->data;\n\
    \    current = current->next;\n}\n```\n\n# 队列\n\n队列的特性是先进先出（FIFO）和后进先（LIFO）。它就像现实世界中的队伍或队列。当你在星巴克购买咖啡时，先来的顾客先被服务，最后来的顾客最后被服务。队列中间的部分将按顺序服务。\n\
    \n| Apple | Orange | Banana | Cherry | Peach | Melon |\n\n在上面的例子中，如果左侧是队列的开头，队列中的第一个是\
    \ Apple，接下来是 Orange、Banana、Cherry、Peach、Melon。\n\n```cpp\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n#include <queue>\n```\n\n```cpp\nint\
    \ main ()\n{ /*创建一个队列 \"Hello World !\"\n  queue<string> q;\n  q.push(\"Hello\"\
    );\n  q.push(\"\");\n  q.push(\"World\");\n  q.push(\"\");\n  q.push(\"!\");\n\
    }\n```\n"
