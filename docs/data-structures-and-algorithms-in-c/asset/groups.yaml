    \ the node that has the SearchValue in the list, insert a node with the ToInsert\
    \ value after the value found\n//if no value found, insert to be the end of the\
    \ list\n//return the list after it is done\nNode * InsertNode(string ToInsert,\
    \ Node * AList, string SearchValue)\n  //if the list is an empty list, the header\
