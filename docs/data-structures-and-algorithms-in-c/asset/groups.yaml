    \ round: 2<3, no swap: 2, 3, 5, 6, 7, 9\n\nNext round: 2 is the only element left\
    \ for comparaison, no swap: 2, 3, 5, 6, 7, 9\n\nThe array is sorted now. The algorithm\
    \ is as follows:\n\n```\n/* BubbleSort Algorithm */\nvoid BubbleSort(int A[],\
    \ int length)\n{\n  /* variables to use in the algorithm */\n  int i, j, temp;\n\
    \n  /* i indicates upto which element that the current round will compare to;\
    \ for each round the biggest value till flow up to the end of the index range\
    \ */\n  for (i = length-1; i >= 0; i--)\n  {\n    /* each round compare from the\
    \ first element till the last element in the range */\n    for (j = 1; j <= i;\
    \ j++)\n    {\n      /* compare the element with its upper element, swap if current\
    \ element is bigger than its upper element */\n      if (A[j - 1] > A[j])\n  \
    \    {\n        /*do the swap between A[j-1] and A[j]*/\n        temp = A[j -\
    \ 1];\n```"
