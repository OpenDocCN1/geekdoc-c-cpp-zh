  md: "# Linked List\n\nLinked List is a list of nodes connected one after another.\
    \ Each node has a pointer pointing to the address of next node. So in the computer,\
    \ the nodes in the list no need to be stored adjacent to each other. And in this\
    \ case, unlike an array, there is no index that can be used to access the node\
    \ in the list directly. You need to walk through the head of the list to the next,\
    \ and then to the next until the tail of the list.\n\nA -> B -> C -> D\n\nThe\
