  md: '# Array


    An array is a sequence of data next to each other and one after another in a linear
    order. Array elements normally are stored adjacent to each other in the computer.
    Each element in the array is assigned a number associated with it which is called
    index, which is from 0 to n-1, and n is the total number of elements in the array
    because the index starts from 0 not from 1. For example, if the array have 9 elements
    totally, and the index in this array will be from 0 to 8, which is 0, 1, 2, 3,
    4, 5, 6, 7, 8.


    In C++, we use [] to indicate that it is an array:


    ```

    string A[4] = { "a", "b", "c", "d" };

    ```


    The above code shows that we initialize the array A to have four elements: "a",
    "b", "c", "d". Each of these elements has its inherent index which starts from
    0. The "a" has the index 0, "b" has the index 1, "c" has the index 2, and "d"
    has its index 3.


    The Array A looks like the following:


    | 0 | 1 | 2 | 3 |

    | a | b | c | d |


    To access the element inside the array, we just need to use A[t] , here t can
    be from 0 to 3; but cannot be less than 0 or larger than 3 since there are only
    4 elements here, otherwise, it will be out of bound of the range.


    To access "a" which is the first element, we use A[0]; to access "b" which is
    the 2nd element, we use A[1]; to access "c" which is the 3rd element, we use A[2];
    to access "d" which is the 4th element, we use A[3].


    So the number N’s element in the array, its index is N-1. To access the element
    in the array by one, we can use the following "for" statement. "for" statement
    is using the index to access each element with the index from'
