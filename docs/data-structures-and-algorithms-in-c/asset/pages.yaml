  md: '# Search an element from an array


    Search an element that is equal to a specific value in the array, we will go through
    every element in the array from the start to the end until the searched element
    is found, or until it is identified that none of the element in the array satisfies
    the search condition.


    If the first element satisfies the condition then the operation stops, otherwise
    it will compare one by one with the second element, the third elements, until
    the search is found, or until the last element is compared.


