  md: '# Set


    Set is a group of distinguished object. The object inside the set is well-defined.


    The operations for two sets can be Union, Intersection, Completion, and Cartesian
    product.


    Union of two sets is the combination of the elements of the two sets. If element
    exist in both sets, the union will only keep one copy of the common element.


    ![](img/c11c4a3212693e8558c7b1c05f5b5ac7_21_0.png)


    Intersection of the two sets is to get the elements which are common to both sets.


    Completion of a set is in the context of a set A can be completely included in
    another set B, then the completion of the set A is B minus A: B-A, which gets
    the elements containing in B, but not in A.


    ![](img/c11c4a3212693e8558c7b1c05f5b5ac7_21_1.png)'
