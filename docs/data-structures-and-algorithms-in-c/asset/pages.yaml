  md: '# Binary Tree


    A tree has branches. It can have 0 or several branches. The most commonly used
    tree type data structure is binary tree. Binary tree means it has only up to two
    branches for each node: the left branch and the right branch.


    In the following diagram, the node N has up to two branches, Left and Right. The
    node Left does not have any branch, and the node Right does not have any branch,
    they are called leaves. If Node is the top node of the whole tree, it is called
    root. So the tree structure is the upside down according to the tree in the real
    world. The tree in the garden has the root at the bottom, and leaves on the top.
    But in computer, the root is on the top, and leaves are on the bottom.


    ![](img/c11c4a3212693e8558c7b1c05f5b5ac7_24_0.png)


    In the following Algorithm section, we will get into more details about how to
    use each data structure in the programming.'
