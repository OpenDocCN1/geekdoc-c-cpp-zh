  md: '# Data Structure


    Data structure is a way to represent the storage and the organization of data
    in the computer for programming languages to easily access the data and process
    the data within. There are several kinds of data structures that are very commonly
    used: Array, List, Queue, Stack, Binary Tree, and Set that we will discuss here.


    Different data structure has its own characteristics. These data structures are
    used in most programming languages. Here we will use the C++ language to represent
    those data structures and see how to use them.'
