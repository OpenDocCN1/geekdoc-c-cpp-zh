  md: '# Insert an element to an array


    If insert an element at the very end of the array, the operation is easy, just
    assign the element to the end of the array where the first available space it
    has.


    For example, if the array space is 7; and the array have 5 elements currently,
    from index 0 to 4:


    | Ann | Tom | John | Nancy | Alice | | | |


    ```

    string students[8];

    students[0] = "Ann";

    students[1] = "Tom";

    students[2] = "John";

    students[3] = "Nancy";

    students[4] = "Alice";

    ```


    So insert a data to the first available space in the array will be:


    > **string toInsert = "Kate";**

    **students[5] = toInsert;**


    | Ann | Tom | John | Nancy | Alice | Kate | | |


    If insert an element in the middle of the array, then the elements after the place
    to be inserted need to be moved one space behind, so that the place to be inserted
    will be available for the new element.


    When the new element needs to be inserted to the very beginning of the array,
    then every element in the array needs to be moved one place behind, so that there
    is an empty space at the very beginning of the array to store the'
