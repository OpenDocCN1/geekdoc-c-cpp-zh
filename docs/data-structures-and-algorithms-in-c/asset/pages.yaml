  md: '# Insertion Sort


    For an array of elements, start from the beginning, make the elements before the
    element that will be inserted to sorted (the first element is itself so it is
    sorted already); for the element to be inserted, compare it with the element in
    the already sorted elements, get the location to be inserted. Do the same thing
    to every element until the whole array is sorted.


    For example, the original array is:


    2, 6, 9, 3, 5, 7


    We will start from the first element, 2 by it is sorted, so we won’t do any movement:


    2, 6, 9, 3, 5, 7


    When it comes to 6, 6>2, so it is in its correct location:


    2, 6, 9, 3, 5, 7


    For 9, 9>6, so it is also in its correct location:


    2, 6, 9, 3, 5, 7


    For 3, 3<9, so 9 should move one spot backward, 3<6, 6 also should move one spot
    backward; 3>2, so no need to move 2


    2, 3, 6, 9, 5, 7


    For 5, 5<9, so 9 should move one spot backward, 5<6, 6 also should move one spot
    backward; 5>3, so no need to move 3


    2, 3, 5, 6, 9, 7'
