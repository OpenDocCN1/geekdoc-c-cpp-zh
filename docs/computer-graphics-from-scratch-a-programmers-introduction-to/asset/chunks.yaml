    triangles in a way that produces the correct results.


    ![image](Images/12fig02.jpg)


    *Figure 12-2: There is no way to sort these triangles “back-to-front.”*


    ### Depth Buffering


    We can’t solve the ordering problem at the triangle level, so let’s try to solve
    it at the pixel level.


    For each pixel on the canvas, we want to paint it with the “correct” color, where
    the “correct” color is the color of the object that is closest to the camera.
    In [Figure 12-3](#ch12.xhtml_ch12fig3), that’s *P*[1].


    ![image](Images/12fig03.jpg)


    *Figure 12-3: Both* P[1] *and* P[2] *project to the same* P’ *on the canvas. Because*
    P[1] *is closer to the camera than* P[2], *we want to paint* P’ *the color of*
    P[1].


    At any time during rendering, each pixel on the canvas represents one point in
    the scene (before we draw anything, it represents a point infinitely far away).
    Suppose that for each pixel on the canvas, we kept the *Z* coordinate of the point
    it currently represents. When we need to decide whether to paint a pixel with
    the color of an object, we will do it only if the *Z* coordinate of the point
    we’re about to paint is smaller than the *Z* coordinate of the point that is already
    there. This guarantees that a pixel representing a point in the scene is never
    drawn over by a pixel representing a point that is farther away from the camera.


    Let’s go back to [Figure 12-3](#ch12.xhtml_ch12fig3). Suppose that because of
    the order of the triangles in a model, we want to paint *P*[2] first and *P*[1]
    second. When we paint *P*[2], the pixel is painted red, and its associated *Z*
    value becomes *Z*[*P*2]. Then we want to paint *P*[1], and since *Z*[*P*2] > *Z*[*P*1],
    we paint the pixel blue and we get the correct result.'
