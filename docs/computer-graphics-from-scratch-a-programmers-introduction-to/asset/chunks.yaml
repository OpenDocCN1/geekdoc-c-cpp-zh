    and simplifying a bit


    ![image](Images/e0044-08.jpg)


    #### The Specular Reflection Term


    We’re now ready to write an equation for the specular reflection:


    ![image](Images/e0044-09.jpg)


    As with diffuse lighting, it’s possible that cos(*α*) is negative, and we should
    ignore it for the same reason as before. Also, not every object has to be shiny;
    for matte objects, the specular term shouldn’t be computed at all. We’ll note
    this in the scene by setting their specular exponent to *–*1 and handling them
    accordingly.


    #### The Full Illumination Equation


    We can add the specular reflection term to the illumination equation we’ve been
    developing and get a single expression that describes illumination at a point:


    ![image](Images/e0045-01.jpg)


    where *I*[*P*] is the total illumination at point *P*, *I*[*A*] is the intensity
    of the ambient light, *N* is the normal of the surface at *P*, *V* is the vector
    from *P* to the camera, *s* is the specular exponent of the surface, *I*[*i*]
    is the intensity of light *i*, *L*[*i*] is the vector from P to light *i*, and
    *R*[*i*] is the reflection vector at *P* for light *i*.


    #### Rendering with Specular Reflections


    Let’s add specular reflections to the scene we’ve been working with so far. First,
    some changes to the scene itself:


    sphere {


        center = (0, -1, 3)


        radius = 1


        color = (255, 0, 0)  # Red


        specular = 500  # Shiny


    }


    sphere {


        center = (2, 0, 4)


        radius = 1


        color = (0, 0, 255)  # Blue


        specular = 500  # Shiny


    }


    sphere {


        center = (-2, 0, 4)


        radius = 1


        color = (0, 255, 0)  # Green


        specular = 10  # Somewhat shiny


    }


    sphere {


        center = (0, -5001, 0)


        radius = 5000


        color = (255, 255, 0)  # Yellow


        specular = 1000  # Very shiny


    }


    This is the same scene as before, with the addition of specular exponents to the
    sphere definitions.


    At the code level, we need to change ComputeLighting to compute the specular term
    when necessary, and add it to the overall light. Note that the function now needs
    ![Images](Images/varr.jpg) and *s*, as you can see in [Listing 3-2](#ch03.xhtml_ch3lis2).


    ComputeLighting(P, N, V, s) {


        i = 0.0


        for light in scene.Lights {


            if light.type == ambient {


                i += light.intensity


            } else {


                if light.type == point {


                    L = light.position - P


                } else {


                    L = light.direction


                }


                // Diffuse


                n_dot_l = dot(N, L)


                if n_dot_l > 0 {


                    i += light.intensity * n_dot_l/(length(N) * length(L))


                }


                // Specular


             ❶ if s != -1 {


                    R = 2 * N * dot(N, L) - L


                    r_dot_v = dot(R, V)


                 ❷ if r_dot_v > 0 {


                        i += light.intensity * pow(r_dot_v/(length(R) * length(V)),
    s)


                    }


                }


            }


        }


        return i


    }


    *Listing 3-2: *ComputeLighting* that supports both diffuse and specular reflections*


    Most of the code remains unchanged, but we add a fragment to handle specular reflections.
    We make sure it applies only to shiny objects ❶ and also make sure we don’t add
    negative light intensity ❷, as we did for diffuse reflection.


    Finally, we need to modify TraceRay to pass the new parameters to Compute Lighting.
    *s* is straightforward: it comes directly from the scene definition. But where
    does ![Images](Images/varr.jpg) come from?


    ![Images](Images/varr.jpg) is a vector that points from the object to the camera.
    Fortunately, we already have a vector that points from the camera to the object
    at TraceRay—that’s ![Images](Images/darr.jpg), the direction of the ray we’re
    tracing! So ![Images](Images/varr.jpg) is simply ![Images](Images/mdarr.jpg).


    [Listing 3-3](#ch03.xhtml_ch3lis3) gives the new TraceRay with specular reflection.


    TraceRay(O, D, t_min, t_max) {


        closest_t = inf


        closest_sphere = NULL


        for sphere in scene.Spheres {


            t1, t2 = IntersectRaySphere(O, D, sphere)


            if t1 in [t_min, t_max] and t1 < closest_t {


                closest_t = t1


                closest_sphere = sphere


            }


            if t2 in [t_min, t_max] and t2 < closest_t {


                closest_t = t2


                closest_sphere = sphere


            }


        }


        if closest_sphere == NULL {


            return BACKGROUND_COLOR


        }


        P = O + closest_t * D  // Compute intersection


        N = P - closest_sphere.center  // Compute sphere normal at intersection


        N = N / length(N)


      ❶ return closest_sphere.color * ComputeLighting(P, N, -D, closest_sphere.specular)


    }


    *Listing 3-3: TraceRay with specular reflection*


    The color calculation ❶ is slightly more involved than it looks. Remember that
    colors must be multiplied channel-wise and the results must be clamped to the
    range of the channel (in our case, [0–255]). Although in the example scene the
    light intensities add up to 1.0, now that we’re adding the contributions of specular
    reflections, the values could go beyond that range.


    You can see the reward for all this vector juggling in [Figure 3-16](#ch03.xhtml_ch3fig16).


    ![image](Images/03fig16.jpg)


    *Figure 3-16: The scene rendered with ambient, diffuse, and specular reflection.
    Not only do we get a sense of depth and volume, but each surface also has a slightly
    different appearance.*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/specular-demo](https://gabrielgambetta.com/cgfs/specular-demo)*.


    Note that in [Figure 3-16](#ch03.xhtml_ch3fig16), the red sphere with a specular
    exponent of 500 has a more concentrated bright spot than the green sphere with
    a specular exponent of 10, exactly as expected. The blue sphere also has a specular
    exponent of 500 but no visible bright spot. This is only a consequence of how
    the image is cropped and how the lights are placed in the scene; indeed, the left
    half of the red sphere also doesn’t exhibit any specular reflection.


    ### Summary


    In this chapter, we’ve taken the very simple raytracer developed in the previous
    chapter and given it the ability to model lights and the way they interact with
    the objects in the scene.


    We split lights into three types: point, directional, and ambient. We explored
    how each of them can represent a different type of light that you can find in
    real life, and how to describe them in our scene definition.


    We then turned our attention to the surface of the objects in the scene, splitting
    them into two types: matte and shiny. We discussed how rays of light interact
    with them and developed two models—diffuse and specular reflection—to compute
    how much light they reflect toward the camera.


    The end result is a much more realistic rendering of the scene: instead of seeing
    just the outlines of the objects, we now get a real sense of depth and volume
    and a feel for the materials the objects are made of.


    However, we are missing a fundamental aspect of lights: shadows. This is the focus
    of the next chapter.


    ## **4


    SHADOWS AND REFLECTIONS**


    ![image](Images/common.jpg)


    Our quest to render the scene in progressively more realistic ways continues.
    In the previous chapter, we modeled the way rays of light interact with surfaces.
    In this chapter, we’ll model two aspects of the way light interacts with the scene:
    objects casting shadows and objects reflecting on other objects.


    ### Shadows


    Where there are lights and objects, there are shadows. We have lights and objects.
    So where are our shadows?


    #### Understanding Shadows


    Let’s begin with a more fundamental question. Why *should* there be shadows? Shadows
    happen when there’s a light whose rays can’t reach an object because there’s some
    other object in the way.'
