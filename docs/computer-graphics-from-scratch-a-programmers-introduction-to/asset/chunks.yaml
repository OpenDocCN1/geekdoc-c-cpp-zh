  trans: '


    《从零开始计算机图形学》（Computer Graphics from Scratch）是我以一种易于理解的方式介绍计算机图形学领域的拙劣尝试。本书的设计旨在让高中生能够轻松理解，同时对专业工程师又保持足够的严谨性。它涵盖了与大学完整课程相同的内容——事实上，它是基于我在大学多年教授这门课程的经验。


    ## 本书对象


    这本书适合任何对计算机图形学感兴趣的读者，从高中生到资深专业人士均可。


    我有意识地选择在表述上倾向于简单和清晰。这体现在书中对思想和算法的选择上。虽然这些算法都是行业标准，但每当有多种方法可以特定结果时，我都会选择最容易理解的一种种。同时，我付出了大量努力确保没有任何敷衍或小技巧。我试着时刻记着阿尔伯特·爱因斯坦的建议：“一切都应该变得尽可能简单，但不能过于简单。”


    学习这本书几乎不需要先验知识，也没有硬件或软件依赖。书中使用的唯一原语是一个允许我们设置像素颜色的方法——这是我们能做到的最接近“从零开始”。算法在概念上很简单，数学原理也很直观——最多只涉及一点点高中三角函数。我们还用到了一些线性代数，书中包含了一个简短的附录，以非常实用的方式介绍了我们所需的所有内容。


    ## 本书内容


    本书从零开始，构建了两个完整且功能全的渲染器：光线追踪器（raytracer）和光栅化器（rasterizer）。尽管它们遵循完全不同的方法，但在渲染简单场景时，它们会产生相似的结果。图
    1 显示了这种对比。


    ![Image](img/fxviii-01.jpg)


    图 1：由本书开发的光线追踪器（左）和光栅化器（右）渲染的简单场景。


    虽然光线追踪器和光栅化器的功能有很大重叠，但它们并非完全相同，本书探索了它们的特定优势，其中一些优势可以在图 2 中看到。


    ![Image](img/fxix-01.jpg)


    图 2：光线追踪器和光栅化器各有其独特特征。左侧：光线追踪阴影和递归反射；右侧：光栅化纹理。


    书中在全文中提供了非正式的伪代码，并提供了用 JavaScript 编写的完整实现代码链接，这些代码可以直接在任何网络浏览器中运行。


    ## 为什么要阅读这本书？


    本书将为你提供编写软件渲染器所需的所有知识。它没有利用也没有教你如何使用现有渲染 API，如 `OpenGL`、`Vulkan`、`Metal` 或 `DirectX`。


    现代 GPU 强大且无处不在，很少有人有充分理由去编写纯软件渲染器。然而，编写软件渲染器的经历对于以下原因是有价值的：


    **着色器是软件。** 20 世纪 90 年代早期 GPU 直接在硬件中实现渲染算法，因此你可以使用它们但不能修改它们（这就是为什么 90 年代中期的大多数游戏看起来非常相似）。今天，你编写自己的渲染算法（在此语境下称为
    `shaders`），它们运行在 GPU 的专用芯片上。


    **知识就是力量。** 理解不同渲染技术背后的理论，而不是复制粘贴半生理解的代码片段或盲目崇拜流行方法，能让你写出更好的着色器和渲染流水线。


    **图形是有趣的。** 计算机科学领域很少有领域能提供计算机图形学所带来的那种即时满足。当你 SQL 查询运行得完美无缺时的成就感，与你第一次正确实现光线追踪反射时的感受完全无法比拟。我在大学教了五年计算机图形学，我经常想为什么我如此喜欢一个学期又一个教授同样的内容；最后，让这一切值得的是看到学生们发光的脸庞，看到他们将自己渲染的首个场景作为桌面背景。


    ## 关于本书


    本书分为两个部分：光线追踪（Raytracing）和光栅化（Rasterization），对应于我们将构建的两个渲染器。


    第一章介绍了理解这两个部分所必需的基础知识。我建议你按顺序阅读章节，但书的两个部分都足够自成体系，可以大部分独立阅读。


    以下是每章内容的简要概述：


    **第 1 章：介绍性概念** 我们定义了 `canvas`（画布），即我们将在上面的抽象抽象，以及 `PutPixel`，我们在上面绘图的唯一工具。我们还学习了表示和操作颜色。


    **第一部分：光线追踪**


    **第 2 章：基础光线追踪** 我们开发了一种基础的光线追踪算法，能够渲染几个看起来像彩色圆形的球体。


    **第 3 章：光** 我们建立了光线与物体相互作用的模型，并扩展了光线追踪器以模拟光。现在球体看起来像球体了。


    **第 4 章：阴影与反射** 我们改进了球体的外观：它们相互投射阴影，并可以具有镜面表面，我们可以看到其他球体的反射。


    **第 5 章：扩展光线追踪器** 我们介绍了可以添加到光线追踪器的额外功能的概述，但这些功能超出了本书的范围。


    **第二部分：光栅化**


    **第 6 章：线** 我们从空白画布开始，开发了绘制线的算法。


    **第 7 章：填充三角形** 我们复用上一章的核心思想，开发了绘制单色填充三角形的算法。


    **第 8 章：着色三角形** 我们扩展上一章的算法，为三角形填充平滑渐变色。


    **第 9 章：透投影** 我们暂时停止绘制 2D 形状，研究将 3D 点转换为可以绘制的 2D 点所需的几何和数学。


    **第 10 章：描述与渲染场景** 我们为场景中的物体开发表示方法，并探索如何使用透投影绘制。


    **第 11 章：裁剪** 我们开发了移除场景中相机看不到算法。现在我们可以从任何相机位置安全地渲染场景。


    **第 12 章：隐藏消除** 我们结合透投影和着色三角形来渲染看起来实体的物体；为了使其正常工作，我们需要确保远处的物体不会遮挡近处的物体。


    **第 13 章：着色** 我们探索如何将第 3 章中开发的照明方程应用于整个三角形。


    **第 14 章：纹理** 我们开发了一种算法，在三角形上“涂画”图像以伪造表面细节。


    **第 15 章：扩展光栅化器** 我们介绍了可以添加到光栅化器的功能概述，但这些功能超出了本书的范围。


    **附录：线性代数** 我们介绍了书中使用的线性代数基础概念：点、向量和矩阵。我们展示了对它们进行的操作，并提供了一些用途示例。


    ### 关于作者


