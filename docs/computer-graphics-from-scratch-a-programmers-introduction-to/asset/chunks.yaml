  trans: "\n\n在上一章中，我们只查看了光源与表面之间非常局部的交互，而忽略了场景中发生的所有其他情况。为了实现阴影的产生，我们需要一个更全局的视角，考虑光源、我们想要绘制的表面以及场景中其他物体之间的相互作用。\n\
    \n从概念上来说，我们尝试做的事情相对简单。我们想添加一小段逻辑，即：“如果点和光源之间有一个物体，则不要添加来自该光源的照照明。”\n\n我们想要区分的两种情况如图图\
    \ 4-1 所示。\n\n![image](img/04fig01.jpg)\n\n*图 4-1：当光源与该点之间有物体时，该点就会投下阴影。*\n\n事实证明，我们已经拥有完成此操作的所有工具。让我们从方向光开始。我们知道\
    \ `P`；那是我们感兴趣的点。我们知道 `![Images](img/larr.jpg)`；那是光源定义的一部分。已知 `P` 和 `![Images](img/larr.jpg)`，我们可以定义一条射线，即\
    \ `![Images](img/e0052-01.jpg)`，它从表面的点指向无限远的光源。这条射线是否交了任何其他物体？如果没有，则点和光源之间什么都没有，因此我们像以前一样计算来自该光源的照明。如果交，则该点处于阴影中，因此我们忽略来自该光源的照明。\n\
    \n我们已经知道如何计算射线与球体之间的最近交点：即我们正在用于从相机追踪射线的 `TraceRay` 函数。我们可以复用它的大部分部分来计算光线射线与场景其余部分之间的最近交点。\n\
    \n不过，该函数的参数略有不同：\n\n- 射线不是从相机开始，而是从 `P` 开始。\n- 射线的方向不是 (`V` – `O`) 而是 `![Images](img/larr.jpg)`。\n\
    - 我们不希望位于 `P` *后面*的物体向它投下阴影，因此我们需要 `t[min] = 0`。\n- 由于我们处理的是距离无限远的方向光，非常遥远的物体仍然应该给\
    \ `P` 投下阴影，因此 `t[max] = +∞`。\n\n图 4-2 显示了两个点，`P[0]` 和 `P[1]`。当从 `P[0]` 向光源方向追踪射线时，我们没有发现与任何物体的交；这意味着光可以到达\
    \ `P[0]`，因此它上面没有阴影。在 `P[1]` 的情况下，我们发现射线与球体之间有两个交点，`t > 0`（意味着交点在表面和光源之间）；因此，该点处于阴影中。\n\
    \n![image](img/04fig02.jpg)\n\n*图 4-2：球体给 P[1] 投下了阴影，但没有给 P[0]。*\n\n我们可以以非常相似的方式处理点光源，但有两个例外。第一，`![Images](img/larr.jpg)`\
    \ 不是常数，但我们已经知道如何从 `P` 和光源的位置计算它。第二，我们不希望距离光源更远的物体能够给 `P` 投下阴影，因此在这种情况下我们需要 `t[max]\
    \ = 1`。\n\n图 4-3 显示了这些情况。当我们从 `P[0]` 以 `L[0]` 方向投射射线时，我们发现了与小球的交；然而，这些交点的 `t >\
    \ 1`，意味着它们不在光源和 `P[0]` 之间。因此 `P[0]` 不在阴影中。相反，从 `P[1]` 以 `L[1]` 方向发射的射线与大球交，`0\
    \ < t < 1`，所以球体给 `P[1]` 投下了阴影。\n\n我们需要考虑一个字面情况。考虑射线 `![Images](img/e0053-01)`。如果我们从\
    \ `t[min] = 0` 开始寻找交点，我们会在 `P` 处找到一个！我们知道 `P` 在球体上，所以对于 `t = 0`，`![Images](img/e0053-02)`；换句话，每个点都会向自己投下阴影！\n\
    \n![image](img/04fig03.jpg)\n\n*图 4-3：我们利用交点处的 t 值来判断它们是否给该点投下阴影。*\n\n最简单的折中办法是将\
    \ `t[min]` 设置为一个小值 `ϵ` 而不是 0。从几何上讲，我们是在说射线从 `P` 所在的表面稍微偏移一点开始，而不是恰好在 `P` 处。因此，对于方向光的范围是\
    \ `[ϵ, ∞]`，对于点光的范围是 `[ϵ, 1]`。\n\n可能会尝试通过计算射线与 `P` 所属球体之间的交点来修复这个问题。这对于球体有效，但对于形状复杂的物体将失效。例如，当你用手遮住眼睛免受阳光照射时，你的手给你的脸投下了阴影，而这两个表面都是同一个物体的一部分——你的身体。\n\
    \n### 带有阴影的渲染\n\n让我们将上面的讨论转化为伪代码。在之前的版本中，`TraceRay` 追踪射线的函数计算射线与球体之间的交点。我们需要提取它的部分代码来计算光线射线，以便计算阴影。\n\
    \n```\nClosestIntersection(O, D, t_min, t_max) {\n  closest_t = inf\n  closest_sphere\
    \ = NULL\n  for sphere in scene.Spheres {\n    t1, t2 = IntersectRay(O, D, sphere)\n\
    \    if t1 in [t_min, t_max] and t1 < closest_t {\n      closest_t = t1\n    \
    \  closest_sphere = sphere\n    }\n    if t2 in [t_min, t_max] and t2 < closest_t\
    \ {\n      closest_t = t2\n      closest_sphere = sphere\n    }\n  }\n  return\
    \ closest_sphere, closest_t\n}\n```\n*列表 4-1：计算交点*\n\n我们可以重写 `TraceRay` 来复用该函数，结果版本变得简单得多。\n\
    \n```javascript\nTraceRay(O, D, t_min, t_max) {\n  closest_sphere, closest_t =\
    \ ClosestIntersection(O, D, t_min, t_max)\n  if (closest_sphere == NULL) {\n \
    \   return BACKGROUND_COLOR\n  }\n  P = O + closest_t * D\n  N = P - closest_sphere.center\n\
    \  N = N / length(N)\n  return closest_sphere.color * ComputeLighting(P, N, D)\n\
    }\n```\n*列表 4-2：提取 ClosestIntersection 后 TraceRay 版本*\n\n然后，我们需要在 `ComputeLighting`\
    \ 中添加阴影检查❶。\n\n```javascript\nComputeLighting(P, N, V, s) {\n  i = 0.0\n  for\
    \ light in scene.Lights {\n    if (light.type == ambient) {\n      i += light.intensity\n\
    \    } else {\n      if (light.type == point) {\n        L = light.position -\
    \ P\n        t_max = 1\n      } else {\n        L = light.direction\n        t_max\
    \ = inf\n      }\n      // 阴影检查\n      shadow_sphere, shadow_t = ClosestIntersection(P,\
    \ L, 0.001, t_max)\n      if (shadow_sphere != NULL) {\n        continue\n   \
    \   }\n      // 漫反射\n      n_dot_l = dot(N, L)\n      if (n_dot_l > 0) {\n   \
    \     i += light.intensity * n_dot_l / (length(N) * length(L))\n      }\n    \
    \  // 镜面反射\n      if (s != -1) {\n        R = 2 * N * dot(N, L) - L\n        r_dot_v\
    \ = dot(R, V)\n        if (r_dot_v > 0) {\n          i += light.intensity * pow(r_dot_v\
    \ / (length(R) * length(V)), s)\n        }\n      }\n    }\n  }\n  return i\n\
    }\n```\n*列表 4-3：支持阴影的 ComputeLighting*\n\n"
- fmt: "\nNow we’re getting somewhere. Objects in the scene interact with each other\
    \ in a more realistic way, casting shadows over each other. Next we’ll explore\
    \ more interactions between objects—namely, objects reflecting other objects.\n\
    \n## Reflections\n\nIn the previous chapter, we talked about surfaces that are\
    \ “mirror-like,” but that only gave them a shiny appearance. Can we have objects\
    \ that look like true mirrors—that is, can we see other objects reflected on their\
    \ surface? We can, and in fact doing this in a raytracer is remarkably simple,\
    \ but it can also be mind-twisting the first time you see how it’s done.\n\n###\
    \ Mirrors and Reflection\n\nLet’s look at how mirrors work. When you look at a\
    \ mirror, what you’re seeing are the rays of light that bounce off the mirror.\
    \ Rays of light are reflected symmetrically with respect to the surface normal,\
    \ as you can see in [Figure 4-5](#ch04.xhtml_ch4fig5).\n\n![image](Images/04fig05.jpg)\n\
    \n*Figure 4-5: A ray of light bounces off a mirror in a direction symmetrical\
    \ to the mirror’s normal.*\n\nSuppose we’re tracing a ray, and the closest intersection\
    \ happens to be with a mirror. What color is this ray of light? It’s not the color\
    \ of the mirror itself, because we’re looking at reflected light. So we need to\
    \ figure out where this light is coming from and what color it is. So all we have\
    \ to do is compute the direction of the reflected ray and figure out the color\
    \ of the light coming from that direction.\n\nIf only we had a function that,\
    \ given a ray, returned the color of the light coming from its direction . . .\n\
    \nOh, wait! We do have one, and it’s called `TraceRay`!\n\nIn the main loop, for\
    \ each pixel, we create a ray from the camera to the scene and we call `TraceRay`\
    \ to figure out what color the camera “sees” in that direction. If `TraceRay`\
    \ determines that the camera is seeing a mirror, it just needs to compute the\
    \ direction of the reflected ray and to figure out the color of the light coming\
    \ from that direction; it must call . . . itself.\n\nAt this point, I suggest\
    \ you read the last couple of paragraphs again until you get it. If this is the\
    \ first time you’ve read about recursive raytracing, it may take a couple of reads\
    \ and some head scratching until you really get it.\n\nGo on, I’ll wait—and once\
    \ the euphoria of this beautiful *aha!* moment has started to wane, let’s formalize\
    \ this a bit.\n\nWhen we design a recursive algorithm (one that calls itself),\
    \ we need to ensure we don’t cause an infinite loop (also known as “This program\
    \ has stopped responding. Do you want to terminate it?”). This algorithm has two\
    \ natural exit conditions: when the ray hits a non-reflective object and when\
    \ it doesn’t hit anything. But there’s a simple case where we could get trapped\
    \ in an infinite loop: the infinite hall effect. This is what happens when you\
    \ put a mirror in front of another and look into it——infinite copies of yourself!\n\
    \nThere are many ways to prevent an infinite recursion. We’ll just introduce a\
    \ *recursion limit* to the algorithm; this will control how “deep” it can go.\
    \ Let’s call it `r`. When `r` = 0, we see objects but no reflections. When `r`\
    \ = 1, we see objects and the reflections of some objects on them ([Figure 4-6](#ch04.xhtml_ch4fig6)).\n\
    \n![image](Images/04fig06.jpg)\n\n*Figure 4-6: Reflections limited to one recursive\
    \ call (*r* = 1). We see spheres reflected on spheres, but the reflected spheres\
    \ don’t look reflective themselves.*\n\nWhen `r` = 2, we see objects, the reflections\
    \ of some objects, and the reflections of the reflections of some objects (and\
    \ so on for greater values of `r`). [Figure 4-7](#ch04.xhtml_ch4fig7) shows the\
    \ result of `r` = 3. In general, it doesn’t make much sense to go deeper than\
    \ three levels, since the differences are barely noticeable at that point.\n\n\
    ![image](Images/04fig07.jpg)\n\n*Figure 4-7: Reflections limited to three recursive\
    \ calls (*r* = 3). Now we can see the reflections of the reflections of the reflections\
    \ of the spheres.*\n\nWe’ll make another distinction. “Reflectiveness” doesn’t\
    \ have to be an all-or-nothing proposition; objects may be only partially reflective.\
    \ We’ll assign a number between 0 and 1 to every surface, specifying how reflective\
    \ it is. Then we’ll compute the weighted average of the locally illuminated color\
    \ and the reflected color using that number as the weight.\n\nFinally, what are\
    \ the parameters for the recursive call to `TraceRay`?\n\n*   The ray starts at\
    \ the surface of the object, `P`.\n*   The direction of the reflected ray is the\
    \ direction of the incoming ray bouncing off `P`; in `TraceRay` we have ![Images](Images/darr.jpg),\
    \ the direction of the incoming ray towards `P`, so the direction of the reflected\
    \ ray is ![Images](Images/mdarr.jpg) reflected with respect to ![Images](Images/narr.jpg).\n\
    *   Similar to what happened with the shadows, we don’t want objects to reflect\
    \ themselves, so `t[min]` = `ϵ`.\n*   We want to see objects reflected, no matter\
    \ how far away they are, so `t[max]` = +∞.\n*   The recursion limit is one less\
    \ than the current recursion limit (to avoid an infinite recursion).\n\nNow we’re\
    \ ready to turn this into actual pseudocode.\n\n### Rendering with Reflections\n\
    \nLet’s add reflections to our raytracer. First, we modify the scene by adding\
    \ a reflective property to each surface, describing how reflective it is, from\
    \ 0 (not reflective) to 1 (a perfect mirror):\n\n```\nsphere {\n  reflective =\
    \ 0.0\n}\nsphere {\n  reflective = 0.2\n}\nsphere {\n  reflective = 0.3\n}\nsphere\
    \ {\n  reflective = 0.4\n}\nsphere {\n  reflective = 0.5\n}\n```\n\nWe already\
    \ use the “reflect” formula during the computation of specular, so we can factor\
    \ it out. It takes a ray ![Images](rarr.jpg) and a normal ![Images](narr.jpg)\
    \ and returns ![Images](rarr.jpg) reflected with respect to ![Images](narr.jpg).\n\
    \n```\nReflectRay(R, N) {\n  return 2 * N * dot(N, R) - R;\n}\n```\n\nThe only\
    \ change we need to make to `LightingLighting is replacing the reflection equation\
    \ with a call to this `ReflectRay`.\n\nThere’s a small change in the main method—we\
    \ need to pass a recursion limit to the top-level `TraceRay` call:\n\n```\ncolor\
    \ = TraceRay(O, D, 1, inf, recursion_depth)\n```\n\nWe can set the initial value\
    \ of `recursion_depth` to a sensible value as 3, as discussed previously. The\
    \ only significant changes happen near the end of `TraceRay`, where we compute\
    \ the reflections recursively. You can see the changes in [Listing 4-4](#ch04.xhtml_ch4lis).\n\
    \n```\nTraceRay(O, D, t_min, t_max, recursion_depth) {\n  closest_sphere, closest_t\
    \ = ClosestIntersection(O, D, t_min, t_max)\n  if (closest_sphere == NULL) {\n\
    \    return BACKGROUND_COLOR\n  }\n  // Compute local color\n  P = O + closest_t\
    \ * D\n  N = P - closest_sphere.center\n  N = N / length(N)\n  local_color = closest_sphere.color\
    \ * ComputeLighting(P, N, -D, closest_sphere.specular)\n  // If we hit the recursion\
    \ limit or the object is not reflective, we’ re done\n  r = closest_sphere.reflective\n\
    \  if (recursion_depth <= 0 || r <= 0) {\n    return local_color\n  }\n  // Compute\
    \ the reflected color\n  R = ReflectRay(-D, N)\n  reflected_color = TraceRay(P,\
    \ R, 0.001, inf, recursion_depth - 1)\n  return local_color * (1 - r) + reflected_color\
    \ * r\n}\n```\n\n*Listing 4-4: The raytracer pseudocode, now with reflections*\n"
  raw: '*Now* we’re getting somewhere. Objects in the scene interact with each other
    in a more realistic way, casting shadows over each other. Next we’ll explore more
    interactions between objects—namely, objects reflecting other objects.


    ### Reflections


    In the previous chapter, we talked about surfaces that are “mirror-like,” but
    that only gave them a shiny appearance. Can we have objects that look like true
    mirrors—that is, can we see other objects reflected on their surface? We can,
    and in fact doing this in a raytracer is remarkably simple, but it can also be
    mind-twisting the first time you see how it’s done.


    #### Mirrors and Reflection


    Let’s look at how mirrors work. When you look at a mirror, what you’re seeing
    are the rays of light that bounce off the mirror. Rays of light are reflected
    symmetrically with respect to the surface normal, as you can see in [Figure 4-5](#ch04.xhtml_ch4fig5).


    ![image](Images/04fig05.jpg)


    *Figure 4-5: A ray of light bounces off a mirror in a direction symmetrical to
    the mirror’s normal.*


    Suppose we’re tracing a ray, and the closest intersection happens to be with a
    mirror. What color is this ray of light? It’s not the color of the mirror itself,
    because we’re looking at reflected light. So we need to figure out where this
    light is coming from and what color it is. So all we have to do is compute the
    direction of the reflected ray and figure out the color of the light coming from
    that direction.


    If only we had a function that, given a ray, returned the color of the light coming
    from its direction . . .


    Oh, wait! We do have one, and it’s called TraceRay!


    In the main loop, for each pixel, we create a ray from the camera to the scene
    and we call TraceRay to figure out what color the camera “sees” in that direction.
    If TraceRay determines that the camera is seeing a mirror, it just needs to compute
    the direction of the reflected ray and to figure out the color of the light coming
    from that direction; it must call . . . *itself* .


    At this point, I suggest you read the last couple of paragraphs again until you
    get it. If this is the first time you’ve read about recursive raytracing, it may
    take a couple of reads and some head scratching until you really get it.


    Go on, I’ll wait—and once the euphoria of this beautiful *aha!* moment has started
    to wane, let’s formalize this a bit.


    When we design a recursive algorithm (one that calls itself), we need to ensure
    we don’t cause an infinite loop (also known as “This program has stopped responding.
    Do you want to terminate it?”). This algorithm has two natural exit conditions:
    when the ray hits a non-reflective object and when it doesn’t hit anything. But
    there’s a simple case where we could get trapped in an infinite loop: the *infinite
    hall* effect. This is what happens when you put a mirror in front of another and
    look into it—infinite copies of yourself!


    There are many ways to prevent an infinite recursion. We’ll just introduce a *recursion
    limit* to the algorithm; this will control how “deep” it can go. Let’s call it
    *r*. When *r* = 0, we see objects but no reflections. When *r* = 1, we see objects
    and the reflections of some objects on them ([Figure 4-6](#ch04.xhtml_ch4fig6)).


    ![image](Images/04fig06.jpg)


    *Figure 4-6: Reflections limited to one recursive call (*r* = 1). We see spheres
    reflected on spheres, but the reflected spheres don’t look reflective themselves.*


    When *r* = 2, we see objects, the reflections of some objects, and the reflections
    of the reflections of some objects (and so on for greater values of *r*). [Figure
    4-7](#ch04.xhtml_ch4fig7) shows the result of *r* = 3\. In general, it doesn’t
    make much sense to go deeper than three levels, since the differences are barely
    noticeable at that point.


    ![image](Images/04fig07.jpg)


    *Figure 4-7: Reflections limited to three recursive calls (*r* = 3). Now we can
    see the reflections of the reflections of the reflections of the spheres.*


    We’ll make another distinction. “Reflectiveness” doesn’t have to be an all-or-nothing
    proposition; objects may be only partially reflective. We’ll assign a number between
    0 and 1 to every surface, specifying how reflective it is. Then we’ll compute
    the weighted average of the locally illuminated color and the reflected color
    using that number as the weight.


    Finally, what are the parameters for the recursive call to TraceRay?


    *   The ray starts at the surface of the object, *P*.


    *   The direction of the reflected ray is the direction of the incoming ray bouncing
    off *P*; in TraceRay we have ![Images](Images/darr.jpg), the direction of the
    incoming ray towards *P*, so the direction of the reflected ray is ![Images](Images/mdarr.jpg)
    reflected with respect to ![Images](Images/narr.jpg).


    *   Similar to what happened with the shadows, we don’t want objects to reflect
    themselves, so *t*[*min*] = *ϵ*.


    *   We want to see objects reflected, no matter how far away they are, so *t*[*max*]
    = +*∞*.


    *   The recursion limit is one less than the current recursion limit (to avoid
    an infinite recursion).


    Now we’re ready to turn this into actual pseudocode.


    #### Rendering with Reflections


    Let’s add reflections to our raytracer. First, we modify the scene definition
    by adding a reflective property to each surface, describing how reflective it
    is, from 0.0 (not reflective at all) to 1.0 (a perfect mirror):


    sphere {


        center = (0, -1, 3)


        radius = 1


        color = (255, 0, 0)  # Red


        specular = 500  # Shiny


        reflective = 0.2  # A bit reflective


    }


    sphere {


        center = (-2, 1, 3)


        radius = 1


        color = (0, 0, 255)  # Blue


        specular = 500  # Shiny


        reflective = 0.3  # A bit more reflective


    }


    sphere {


        center = (2, 1, 3)


        radius = 1


        color = (0, 255, 0)  # Green


        specular = 10  # Somewhat shiny


        reflective = 0.4  # Even more reflective


    }


    sphere {


        color = (255, 255, 0)  # Yellow


        center = (0, -5001, 0)


        radius = 5000


        specular = 1000  # Very shiny


        reflective = 0.5  # Half reflective


    }


    We already use the “reflect ray” formula during the computation of specular reflections,
    so we can factor it out. It takes a ray ![Images](Images/rarr.jpg) and a normal
    ![Images](Images/narr.jpg) and returns ![Images](Images/rarr.jpg) reflected with
    respect to ![Images](Images/narr.jpg).


    ReflectRay(R, N) {


        return 2 * N * dot(N, R) - R;


    }


    The only change we need to make to ComputeLighting is replacing the reflection
    equation with a call to this new ReflectRay.


    There’s a small change in the main method—we need to pass a recursion limit to
    the top-level TraceRay call:


    color = TraceRay(O, D, 1, inf, recursion_depth)


    We can set the initial value of recursion_depth to a sensible value such as 3,
    as discussed previously.


    The only significant changes happen near the end of TraceRay, where we compute
    the reflections recursively. You can see the changes in [Listing 4-4](#ch04.xhtml_ch4lis4).


    TraceRay(O, D, t_min, t_max, recursion_depth) {


        closest_sphere, closest_t = ClosestIntersection(O, D, t_min, t_max)


        if closest_sphere == NULL {


            return BACKGROUND_COLOR


        }


        // Compute local color


        P = O + closest_t * D


        N = P - closest_sphere.center


        N = N / length(N)


        local_color = closest_sphere.color * ComputeLighting(P, N, -D, closest_sphere.specular)


        // If we hit the recursion limit or the object is not reflective, we’ re done


     ❶ r = closest_sphere.reflective


        if recursion_depth <= 0 or r <= 0 {


            return local_color


        }


        // Compute the reflected color


        R = ReflectRay(-D, N)


     ❷ reflected_color = TraceRay(P, R, 0.001, inf, recursion_depth - 1)


     ❸ return local_color * (1 - r) + reflected_color * r


    }


    *Listing 4-4: The raytracer pseudocode, now with reflections*'
