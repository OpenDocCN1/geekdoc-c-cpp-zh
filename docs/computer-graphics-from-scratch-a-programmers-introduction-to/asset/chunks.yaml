    就像我们在第 2 章 开始时做的那样，我们将首先开始定义一个 `camera`（相机）。我们将使用与之前相同的约定：相机位于 `O` = (0,0,0)，面向
    ![image](img/f0106-03.jpg) 的方向，其“上方向”向量为 ![image](img/f0106-02.jpg)。我们还将定义一个大小为
    `V[w]` 和 `V[h]` 的矩形 `viewport`（视口），其边缘与 ![image](img/f0106-01.jpg) 和 ![image](img/f0106-01a.jpg)
    平行，距离相机距离为 `d`。目标是在画布上绘制相机通过视口看到的任何内容。如果你需要复习这些概念，请参阅第 2 章。


    考虑相机前方某处的的一个点 `P`。我们感兴趣的是找到 `P′`，即相机通过视口看到 `P` 的视口上的点，如图图 9-1 所示。


    ![image](img/09fig01.jpg)


    *图 9-1: 一个简单的透视投影设置。相机通过 `P′` 看到 `P`，`P′` 在投影平面上。*


    这与我们进行光线追踪的操作相反。我们的光线追踪是从画布上的一个点开始，确定它通过该点可以看到什么；而这里，我们从场景中的一个点开始，并确定它在视口上的显示位置。


    ### 寻找 P′


    为了找到 `P′`，让我们从不同的角度（字面意义上的）来看图 9-1 所示的设置。图 9-2 显示了从“右侧”观察该设置的示意图，仿佛我们站在 ![image](img/f0106-01.jpg)
    轴上：![image](img/f0106-02.jpg) 指向上，![image](img/f0106-03.jpg) 指向右侧，![image](img/f0106-04.jpg)
    指向我们。


    ![image](img/09fig02.jpg)


    *图 9-2: 从右侧观察的透视投影设置*


    除了 `O`、`P` 和 `P′` 之外，该图还显示了点 `A` 和 `B`，它们帮助我们进行推导。


    我们知道 ![image](img/f0106-05.jpg)，因为我们定义 `P′` 是视口上的一个点，并且知道视口嵌入在平面 `Z = d` 中。


    我们还可以看到三角形 `OP′A` 和 `OPB` 是相似的，因为它们的对应边（`P′A` 和 `PB`、`OP` 和 `OP′` 以及 `OA` 和 `OB`）是平行的。这意味着它们的边比例是相同的；例如：


    ![image](img/f0107-01.jpg)


    由此我们得到


    ![image](img/f0107-02.jpg)


    该等式中每个线段的（带符号）长度都是我们已知或感兴趣的点的坐标：![image](img/f0107-03.jpg)、`|PB| = P[y]`、![image](img/f0107-04.jpg)
    以及 `|OB| = P[z]`。如果我们将这些值代入等式，就会得到


    ![image](img/f0107-05.jpg)


    我们可以画一张类似的图，这次是从上方俯视：![image](img/f0107-08.jpg) 指向上，![image](img/f0107-09.jpg)
    指向右侧，![image](img/f0107-10.jpg) 指向我们（图 9-3）。


    ![image](img/09fig03.jpg)


    *图 9-3: 透视投影设置俯视图*


    再次使用相似三角形的方法，我们可以推断出


    ![image](img/f0107-06.jpg)


    我们现在有了 `P′` 的三个坐标。


    ### 投影方程


    让我们把这些整合在一起。给定场景中的一个点 `P` 以及标准的相机和视口设置，我们可以计算 `P` 在视口上的投影，我们称之为 `P′`，如下：


    ![image](img/f0107-07.jpg)![image](img/f0108-01.jpg)


    `P′` 在视口上，但它仍然是 3D 空间中的一个点。我们如何在画布上获取对应的点？


    我们可以立即得到 ![image](img/f0108-02.jpg)，因为每个投影点都在视口平面上。接下来我们需要将 ![image](img/f0108-03.jpg)
    和 ![image](img/f0108-04.jpg) 转换为画布坐标 `C[x]` 和 `C[y]`。

