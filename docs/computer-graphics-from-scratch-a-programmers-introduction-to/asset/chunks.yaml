    Flat shading involved a single illumination calculation per triangle. Gouraud
    shading requires three illumination calculations per triangle, plus the interpolation
    of a single attribute, the illumination, across the triangle. The next step in
    quality requires us to calculate illumination at every pixel of the triangle.


    This doesn’t sound particularly complex from a theoretical point of view; we’re
    computing lighting at one or three points already, and we were computing per-pixel
    lighting for the raytracer after all. What’s tricky here is figuring out where
    the inputs to the illumination equation come from.


    Recall that the full illumination equation, with ambient, diffuse, and specular
    components, is:


    ![image](Images/f0170-01.jpg)


    First, we need ![Images](Images/f0170-02.jpg). For directional lights, ![Images](Images/f0170-02.jpg)
    is given. For point lights, ![Images](Images/f0170-02.jpg) is defined as the vector
    from the point in the scene, `P`, to the position of the light, `Q`. However,
    we don’t have `Q` for every pixel of the triangle, but only for the vertices.


    What we do have is the projection of `P`; that is, the `x′` and `y′` we’re about
    to draw on the canvas! We know that


    ![image](Images/f0170-03.jpg)


    We also happen to have an interpolated but geometrically correct value for ![Images](Images/f0170-07.jpg)
    as part of the depth-buffering algorithm, so


    ![image](Images/f0170-04.jpg)


    We can recover `P` from these values:


    ![image](Images/f0170-05.jpg)


    We also need ![Images](Images/f0170-06.jpg). This is the vector from the camera
    (which we know) to `P` (which we just computed), so ![Images](Images/f0170-06.jpg)
    is simply `P` –– `C`.


    Next, we need ![Images](Images/f0034-01.jpg). We only know the normals at the
    vertices of the triangle. When all you have is a hammer, every problem looks like
    a nail; our hammer is—you probably guessed it—linear interpolation of attribute
    values. So let’s take the values of `N[*x*]`, `N[*y*]`, and `N[*z*]` at each vertex
    and treat each of them as an attribute we can linearly interpolate. Then, at every
    pixel, we reassemble the interpolated components into a vector, normalize it,
    and use it as the normal at that pixel.


    This technique is called Phong shading, after Bui Tuong Phong, who invented it
    in 1973\. [Figure 13-9](#ch13.xhtml_ch13fig9) shows the results.


    ![image](Images/13fig09.jpg)


    *Figure 13-9: Phong shading. The surface of the sphere looks smooth and the specular
    highlight is clearly visible.*


    You can find a live implementation of this algorithm at `[https://gabrielgambetta.com/cgfs/shading-demo](https://gabrielgambetta.com/cgfs/shading-demo)`.


    The sphere looks much better now. Its surface displays the proper curvature, and
    the specular highlights look well defined. The contour, however, still betrays
    the fact that we’re rendering an approximation made of triangles. This is not
    a shortcoming of the shading algorithm, which only determines the color of each
    pixel of the surface of the triangles but has no control over the shape of the
    triangles themselves. This sphere approximation uses 420 triangles; we could get
    a smoother contour by using more triangles, at the cost of worse performance.


    Phong shading also solves the problem with the light getting close to a face,
    now giving the expected results ([Figure 13-10](#ch13.xhtml_ch13fig10)).


    ![image](Images/13fig10.jpg)


    *Figure 13-10: The closer the light is to the surface, the brighter and better
    defined the specular highlight looks.*


    At this point, we’ve matched the capabilities of the raytracer developed in [Part
    I](#part01.xhtml), except for shadows and reflections. Using the exact same scene
    definition, [Figure 13-11](#ch13.xhtml_ch13fig11) shows the output of the rasterizer
    we’re developing.


    ![image](Images/13fig11.jpg)


    *Figure 13-11: The reference scene, rendered by the rasterizer*


    For reference, [Figure 13-12](#ch13.xhtml_ch13fig12) shows the raytraced version
    of the same scene.


    ![image](Images/13fig12.jpg)


    *Figure 13-12: The reference scene, rendered by the raytracer*


    The two versions look almost identical, despite using vastly different techniques.
    This is expected, since the scene definition is identical. The only visible difference
    can be found in the contour of the spheres: the raytracer renders them as mathematically
    perfect objects, but we use an approximation made of triangles for the rasterizer.


    Another difference is the performance of the two renderers. This is very hardware-
    and implementation-dependent, but generally speaking, rasterizers can produce
    full-screen images of complex scenes up to 60 times per second or more, which
    makes them suitable for interactive applications such as videogames, while raytracers
    may take multiple seconds to render.


    ### Summary


    In this chapter, we added illumination to our rasterizer. The illumination model
    we use is exactly the same as in [Chapter 3](#ch03.xhtml_ch03), because we’re
    using different techniques to achieve performance and quality. The fastest shading
    algorithm, which also produces the least appealing results, is flat shading: we
    compute the illumination of a point in a triangle and use it for every pixel.
    This results in a very faceted appearance, especially for objects like spheres.
    One step up the quality ladder, we have Gouraud shading: we compute the illumination
    of three vertices of a triangle and then interpolate this value across the triangle.
    This gives objects a smoother appearance, including curved objects. However, this
    technique fails to capture subtle lighting effects, such as specular highlights.
    Finally, we studied Phong shading. Much like our raytracer, it computes the illumination
    at every pixel, producing the best results and also the worst performance. The
    trick in Phong shading is knowing how to compute all necessary values to evaluate
    the illumination equation; once again, the answer is linear interpolation—in this
    case, of normal vectors. In the next chapter, we’ll add even more detail to the
    surface of our triangles, using a technique we haven’t studied for the raytracer:
    texture mapping.


    ## 14 TEXTURES


    ![image](Images/common.jpg)


    Our rasterizer can render objects like cubes or spheres. But we usually don’t
    want to render abstract geometric objects like cubes and spheres; instead, we
    want to render real-world objects, like crates and planets or dice and marbles.
    In this chapter, we’ll look at how we can add visual detail to the surface of
    our objects using textures.


    ### Painting a Crate


    Let’s say we want our scene to have a wooden crate. How do we turn a cube into
    a wooden crate? One option is to add a lot of triangles to replicate the grain
    of the wood, the heads of the nails, and so on. This would work, but it would
    add a lot of geometric complexity to the scene, resulting in a big performance
    hit. Another option is to fake the details: instead of modifying the geometry
    of an object, we just "paint" something that looks like wood on top of it. Unless
    you’re looking at the crate from up close, you won’t notice the difference, and
    the computational cost is significantly lower than adding lots of geometric detail.
    Note that the two options aren’t incompatible: you can choose the right balance
    between adding geometry and painting on that geometry to achieve the image quality
    and performance you require. Since we know how to deal with geometry, we’ll explore
    the second option.

