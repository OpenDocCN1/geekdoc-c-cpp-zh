    \ color) {\n    dx = x1 - x0\n    dy = y1 - y0\n    if abs(dx) > abs(dy) {\n \
    \       // 线段接近水平\n        // 确保 x0 < x1\n        if x0 > x1 {\n            swap(P0,\
    \ P1)\n        }\n        a = dy/dx\n        y = y0\n        for x = x0 to x1\
    \ {\n            canvas.PutPixel(x, y, color)\n            y = y + a\n       \
    \ }\n    } else {\n        // 线段接近垂直\n        // 确保 y0 < y1\n        if y0 > y1\
    \ {\n            swap(P0, P1)\n        }\n        a = dx/dy\n        x = x0\n\
    \        for y = y0 to y1 {\n            canvas.PutPixel(x, y, color)\n      \
    \      x = x + a\n        }\n    }\n}\n```\n\n*列表 6-1: 处理所有情况的 DrawLine 版本*\n\n\
    这确实可以运行，但并不美观。其中存在大量的代码重复，而且选择使用哪个函数的逻辑、计算函数值的逻辑以及像素绘制本身都交织在一起。我们显然可以做得更好！\n\n\
    ### 线性插值函数\n\n我们有两个线性函数 `y = f(x)` 和 `x = f(y)`。为了抽象出我们正在处理像素这一事实，让我们用更通用的方式将其写为\
    \ `d = f(i)`，其中 `i` 是自变量（independent variable），即我们选择其取值的变量；`d` 是因变量（dependent\
    \ variable），其值取决于另一个变量，是我们想要计算的值。在接近水平的情况下，`x` 是自变量，`y` 是因变量；在接近垂直的情况下，情况则反过来。\n\
    \n当然，任何函数都可以写成 `d = f(i)`。但我们还知道另外两个可以完全定义该函数的点：它是线性的，以及它的两个值——即 `d[0] = f(i[0])`\
    \ 和 `d[1] = f(i[1])`。我们可以写一个简单的函数，接收这些值并返回 `d` 的所有中间值的列表，并像之前一样假设 `i[0] < i[1]`：\n\
    \n```javascript\nInterpolate (i0, d0, i1, d1) {\n    values = []\n    a = (d1\
    \ - d0) / (i1 - i0)\n    d = d0\n    for i = i0 to i1 {\n        values.append(d)\n\
    \        d = d + a\n    }\n    return values\n}\n```\n\n这个函数与 `DrawLine` 的前两个版本具有相同的“形状”，但变量被称为\
    \ `i` 和 `d` 而不是 `x` 和 `y`，而且它不是绘制像素，而是将值存储在列表中。\n\n注意，对应于 `i[0]` 的 `d` 值返回在 `values[0]`\
    \ 中，`i[0] + 1` 的值在 `values[1]` 中，依此类推；通常情况下，假设 `i[n]` 在范围 `[i[0], i[1]]` 内，`i[n]`\
    \ 的值返回在 `values[i_n - i_0]` 中。\n\n有一个我们需要考虑的边界情况：我们可能想为单个 `i` 值计算 `d = f(i)`——即当\
    \ `i[0] = i[1]` 时。在这种情况下，我们甚至无法计算 `a`，所以将其视为特殊情况：\n\n```javascript\nInterpolate\
    \ (i0, d0, i1, d1) {\n    if i0 == i1 {\n        return [ d0 ]\n    }\n    values\
    \ = []\n    a = (d1 - d0) / (i1 - i0)\n    d = d0\n    for i = i0 to i1 {\n  \
    \      values.append(d)\n        d = d + a\n    }\n    return values\n}\n```\n\
    \n作为一个实现细节，在本书的剩余部分，自变量 `i` 的值始终整数，因为它们代表像素；而因变量 `d` 的值始终是浮点数，因为它们代表通用函数的值。现在我们可以使用\
    \ `Interpolate` 来编写 `DrawLine`（列表 6-2）：\n\n```javascript\nDrawLine(P0, P1, color)\
    \ {\n    if abs(x1 - x0) > abs(y1 - y0) {\n        // 线段接近水平\n        // 确保 x0\
    \ < x1\n        if x0 > x1 {\n            swap(P0, P1)\n        }\n        ys\
    \ = Interpolate(x0, y0, x1, y1)\n        for x = x0 to x1 {\n            canvas.PutPixel(x,\
    \ ys[x - x0], color)\n        }\n    } else {\n        // 线段接近垂直\n        // 确保\
    \ y0 < y1\n        if y0 > y1 {\n            swap(P0, P1)\n        }\n       \
    \ xs = Interpolate(y0, x0, y1, x1)\n        for y = y0 to y1 {\n            canvas.PutPixel(xs[y\
    \ - y0], y, color)\n        }\n    }\n}\n```\n\n*列表 6-2: 使用 Interpolate 的 DrawLine\
    \ 版本*\n\n这个 `DrawLine` 可以处理所有情况（图 6-5）。\n\n![image](img/06fig05.jpg)\n\n*图 6-5:\
    \ 重构后的算法处理了所有情况。*\n\n你可以在 `https://gabrielgambetta.com/cgfs/lines-demo` 看到这个重构算法的现场演示。虽然这个版本并没有上一个短很多，但它清晰地将\
    \ `y` 和 `x` 的中间值计算与判断哪个是自变量的决策以及像素绘制代码分离开了。\n\n可能会让你感到惊讶的是，这个线条算法并不是最好或最快的；那种地位属于\
    \ Bresenham 算法（Bresenham’s Algorithm）。介绍这种算法的原因有二：首先，它更容易理解，这是本书的一个首要原则。其次，它为我们提供了\
    \ `Interpolate` 函数，我们将在后面大量使用。\n\n### 总结\n\n在本章中，我们迈了构建栅化器的第一步。使用我们唯一的工具 `PutPixel`，我们开发了一个绘制直线段的算法。我们还开发了\
    \ `Interpolate` 方法，在进入下一章节之前，请务必充分理解它。\n\n## 填充三角形形\n\n![image](img/common.jpg)\n\
    \n在前一章中，我们迈了绘制简单形状——即直线段——的第一步。使用 `Interpolate` 来绘制值。在本章中，我们将绘制更复杂的：三角形。\n\n###\
    \ 线框三角形\n\n我们可以使用 `DrawLine` 方法绘制三角形的轮廓：\n\n```javascript\nDrawWireframeTriangle\
    \ (P0, P1, P2, color) {\n    DrawLine(P0, P1, color);\n    DrawLine(P1, P2, color);\n\
    \    DrawLine(P2, P0, color);\n}\n```\n\n这种轮廓被称为“线框”，因为正如图 7-1（ch07.xhtml_7fig1）所示，它是由线条组成的。\n\
    \n![image](img/07fig1.jpg)\n\n*图 7-1: 顶点为 (-200,-250), (200,50) 和 (20,250) 的线框三角形*\n\
    \n这是一个很好的开始！接下来我们将探索如何填充三角形。\n\n### 填充三角形\n\n我们要用选择的颜色填充三角形。正如计算机图形中常见的情况，解决这个问题的方法有很多。我们将通过将它们视为水平线段的集合来绘制填充三角形，当它们画在一起时看起来就像一个三角形。图\
    \ 7-2（ch07.xhtml_7fig2）展示了如果我们可以看到单个段。\n\n![image](img/07fig2.jpg)\n\n*图 7-2:\
    \ 使用水平段绘制填充三角形*\n\n以下是我们想要做的非常粗略的初步近似：\n\n```\n对于三角形顶部和底部之间的每一条水平线 y\n    计算该\
    \ y 的 x_left 和 x_right\n    绘制 x_left, y, x_right, y\n```\n\n让我们从“在三角形的顶部和底部之间”开始。三角形由三个顶点\
    \ `P[0]`、`P[1]` 和 `P[2]` 定义。如果我们按照 `y` 值的增加对这些点进行排序，使得 `y[0] ≤ y[1] ≤ y[2]`，那么三角形占据的\
    \ `y` 值范围就是 `[y[0], y[2]]`：\n\n```javascript\nif y1 < y0 { swap(P1, P0) }\nif\
    \ y2 < y0 { swap(P2, P0) }\nif y2 < y1 { swap(P2, P1) }\n```\n\n对顶点进行这种排序使得事情变得更容易：这样做之后，我们总是认为\
    \ `P[0]` 是三角形的最低点，`P[2]` 是最高点，因此我们就不需要处理所有可能的排序。\n\n"
- fmt: "\nNext we have to compute the `x_left` and `x_right` arrays. This is slightly\
    \ tricky, because the triangle has three sides, not two. However, considering\
    \ only the values of `y`, we always have a “tall” side from `P[0]` to `P[2]`,\
    \ and two “short” sides from `P[0]` to `P[1]` and `P[1]` to `P[2]`.\n\nThere’s\
    \ a special case when `y[0] = y[1]` or `y[1] = y[2]`—that is, when one of the\
    \ sides of the triangle is horizontal. When this happens, the two other sides\
    \ have the same height, so either could be considered the “tall” side. Should\
    \ we choose the right side or the left side? Fortunately, it doesn’t matter; the\
    \ algorithm will support both left-to-right and right-to-left horizontal lines,\
    \ so we can stick to our definition that the “tall” side is the one from `P[0]`\
    \ to `P[2]`.\n\nThe values for `x_right` will come either from the tall side or\
    \ from joining the short sides; the values for `x_left` will come from the other\
    \ set. We’ll start by computing the values of `x` for the three sides. Since we’ll\
    \ be drawing horizontal segments, we want exactly one value of `x` for each value\
    \ of `y`; this means we can compute these values by using `Interpolate`, with\
    \ `y` as the independent variable and `x` as the dependent variable:\n\n```\n\
    x01 = Interpolate(y0, x0, y1, x1)\nx12 = Interpolate(y1, x1, y2, x2)\nx02 = Interpolate(y0,\
    \ x0, y2, x2)\n```\n\nThe `x` values for one of the sides are in `x02`; the values\
    \ for the other side come from the concatenation of `x01` and `x12`. Note that\
    \ there’s a repeated value in `x01` and `x12`: the `x` value for `y[1]` is both\
    \ the last value of `x01` and the first value of `x12`. We just need to get rid\
    \ of one of them (we arbitrarily choose the last value of `x01`), and then concatenate\
    \ the arrays:\n\n```\nremove_last(x01)\nx012 = x01 + x12\n```\n\nWe finally have\
    \ `x02` and `x012`, and we need to determine which is `x_left` and which is `x_right`.\
    \ To do this, we can choose any horizontal line (for example, the middle one)\
    \ and compare its `x` values in `x02` and `x012`: if the `x` value in `x02` is\
    \ smaller than the one in `x012`, then we know `x02` must be `x_left`; otherwise,\
    \ it must be `x_right`.\n\n```\nm = floor(x02.length / 2)\nif x02[m] < x012[m]\
    \ {\n    x_left = x02\n    x_right = x012\n} else {\n    x_left = x012\n    x_right\
    \ = x02\n}\n```\n\nNow we have all the data we need to draw the horizontal segments.\
    \ We could use `DrawLine` for this. However, `DrawLine` is a very generic function,\
    \ and in this case we’re always drawing horizontal, left-to-right lines, so it’s\
    \ more efficient to use a simple for loop. This also gives us more “control” over\
    \ every pixel we draw, which will be especially useful in the following chapters.\n\
    \n[Listing 7-1](#ch07.xhtml_ch7lis1) has the completed `DrawFilledTriangle`.\n\
    \n```\nDrawFilledTriangle (P0, P1, P2, color) {\n  ❶ // Sort the points so that\
    \ y0 <= y1 <= y2\n    if y1 < y0 { swap(P1, P0) }\n    if y2 < y0 { swap(P2, P0)\
    \ }\n    if y2 < y1 { swap(P2, P1) }\n  ❷ // Compute the x coordinates of the\
    \ triangle edges\n    x01 = Interpolate(y0, x0, y1, x1)\n    x12 = Interpolate(y1,\
    \ x1, y2, x2)\n    x02 = Interpolate(y0, x0, y2, x2)\n  ❸ // Concatenate the short\
    \ sides\n    remove_last(x01)\n    x012 = x01 + x12\n  ❹ // Determine which is\
    \ left and which is right\n    m = floor(x012.length / 2)\n    if x02[m] < x012[m]\
    \ {\n        x_left = x02\n        x_right = x012\n    } else {\n        x_left\
    \ = x012\n        x_right = x02\n    }\n  ❺ // Draw the horizontal segments\n\
    \    for y = y0 to y2 {\n      for x = x_left to x_right {\n        PutPixel(x,\
    \ y, color)\n      }\n    }\n}\n```\n[/content] (Note: The input content provided\
