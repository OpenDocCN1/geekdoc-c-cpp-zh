  trans: "\n为了渲染这些内容，我们只需要遍历实例列表；对于每个实例，我们复制模型的顶点，根据实例的位置对其进行平移，然后像以前一样渲染它们（列表 10-2）。\n\
    \n```\nRenderScene() {\n    for I in scene.instances {\n        RenderInstance(I);\n\
    \    }\n}\n\nRenderInstance(instance) {\n    projected = []\n    model = instance.model\n\
    \    for V in model.vertices {\n        V’ = V + instance.position\n        projected.append(ProjectVertex(V’))\n\
    \    }\n    for T in model.triangles {\n        RenderTriangle(T, projected)\n\
    \    }\n}\n```\n\n*列表 10-2：一种渲染包含多个对象实例场景的算法，每个实例位于不同位置*\n\n如果我们希望它按预期工作，模型顶点上的坐标应该定义在一个对该物体“有意义”的坐标系中；我们将这种坐标系称为\
    \ `model space`（模型空间）。例如，我们定义立方体时其中心位于 (0, 0, 0)；这意味着当我们说“位于 (1, 2, 3) 的立方体”时，我们的意思是“一个以\
    \ (1, 2, 3) 为中心的立方体”。\n\n在对 `model space` 中定义的顶点应用实例平移后，转换后的顶点现在位于场景坐标系中；我们将这种坐标系称为\
    \ `world space`（世界空间）。\n\n定义 `model space` 没有硬性规定；它取决于你的应用程序的需求。例如，如果你有一个人的模型，那么将坐标系的原点置于他们的脚下可能是合理的。\n\
    \n图 10-3 显示了一个包含两个立方体实例的简单场景。\n\n![image](img/10fig03.jpg)\n\n*图 10-3：具有两个相同立方体模型实例的场景，位于不同位置*\n\
    \n你可以在 [`gabrielgambetta.com/cgfs/instances-demo`](https://gabrielgambetta.com/cgfs/instances-demo)\
    \ 找到该算法的实现。\n\n### 模型变换 (Model Transform)\n\n我们上面描述的场景定义并没有给我们提供太大的活性。由于我们只能指定立方体的\
    \ `position`，我们可以实例化任意数量的立方体，但它们将都朝同一个方向。通常，我们希望对实例有更多的控制：我们还想指定它们的方向以及可能的缩放。\n\
    \n从概念上讲，可以用这三个元素定义一个 `model transform`（模型变换）：缩放因子、绕模型空间原点的旋转以及到场景特定点的平移：\n\n```\n\
    instance {\n    model = cube\n    transform {\n        scale = 1.5\n        rotation\
    \ = <绕 Y 轴旋转 45 度>\n        translation = (1, 2, 3)\n    }\n}\n```\n\n我们可以扩展 列表\
    \ 10-2 中的算法以适应新的变换。然而，我们 `apply` 变换的顺序很重要；特别是平移必须最后进行。这是因为大多数时候，我们希望围绕模型空间中的原点对实例进行旋转和缩放，所以我们需要在它们转换到世界空间之前完成这些。\n\
    \n为了理解结果差异，请查看 图 10-4，它显示了绕原点的 45° 旋转，随后是沿 Z 轴的平移。\n\n![image](img/10fig04.jpg)\n\
    \n*图 10-4：应用旋转后应用平移*\n\n图 10-5 显示在旋转之前应用了平移。\n\n![image](img/10fig05.jpg)\n\n\
    *图 10-5：应用平移后应用旋转*\n\n严格来说，给定一个旋转后接一个平移，我们可以找到一个平移后接一个旋转（可能不是绕原点旋转）来实现相同结果。然而，使用第一种形式来表达这种变换要自然得多。\n\
    \n我们可以写一个新版本的 `RenderInstance`，它支持缩放、旋转和位置（参见 列表 10-3）。\n\n```\nRenderInstance(instance)\
    \ {\n    projected = []\n    model = instance.model\n    for V in model.vertices\
    \ {\n        V’ = V + instance.position\n        projected.append(ProjectVertex(V’))\n\
    \    }\n    for T in model.triangles {\n        RenderTriangle(T, projected)\n\
    \    }\n}\n```\n*列表 10-3：一种渲染包含多个对象实例场景的算法，每个实例位于不同位置*\n"
