    \ light.intensity * n_dot_l/(length(N) * length(L))\n            }\n         \
    \   // 高光\n            if s != -1 {\n                R = 2 * N * dot(N, L) - L\n\
    \                r_dot_v = dot(R, V)\n                if r_dot_v > 0 {\n     \
    \               i += light.intensity * pow(r_dot_v/(length(R) * length(V)), s)\n\
