- fmt: "\n[Listing 6-1](#ch06.xhtml_ch6lis1) shows a version of `DrawLine` that handles\
    \ all the cases.\n\n```javascript\nDrawLine(P0, P1, color) {\n    dx = x1 - x0\n\
    \    dy = y1 - y0\n    if abs(dx) > abs(dy) {\n        // Line is horizontal-ish\n\
    \        // Make sure x0 < x1\n        if x0 > x1 {\n            swap(P0, P1)\n\
    \        }\n        a = dy/dx\n        y = y0\n        for x = x0 to x1 {\n  \
    \          canvas.PutPixel(x, y, color)\n            y = y + a\n        }\n  \
    \  } else {\n        // Line is vertical-ish\n        // Make sure y0 < y1\n \
    \       if y0 > y1 {\n            swap(P0, P1)\n        }\n        a = dx/dy\n\
    \        x = x0\n        for y = y0 to y1 {\n            canvas.PutPixel(x, y,\
    \ color)\n            x = x + a\n        }\n    }\n}\n```\n\n*Listing 6-1: A version\
    \ of DrawLine that handles all the cases*\n\nThis certainly works, but it isn’t\
    \ pretty. There’s a lot of code duplication, and the logic for selecting which\
    \ function to use, the logic to compute the function values, and the pixel drawing\
    \ itself are all intertwined. Surely we can do better!\n\n### The Linear Interpolation\
    \ Function\n\nWe have two linear functions `y = f(x)` and `x = f(y)`. To abstract\
    \ away the fact that we’re dealing with pixels, let’s write it in a more generic\
    \ way as `d = f(i)`, where `i` is the `independent variable`, the one we choose\
    \ the values for, and `d` is the `dependent variable`, the one whose value depends\
    \ on the other and which we want to compute. In the horizontal-ish case, `x` is\
    \ the independent variable and `y` is the dependent variable; in the vertical-ish\
    \ case, it’s the other way around.\n\nOf course, any function can be written as\
    \ `d = f(i)`. We know two more things that completely define our function: the\
    \ fact that it’s linear and two of its values—that is, `d[0] = f(i[0])` and `d[1]\
    \ = f(i[1])`. We can write a simple function that takes these values and returns\
    \ a list of all the intermediate values of `d`, assuming as before that `i[0]\
    \ < i[1]`:\n\n```javascript\nInterpolate (i0, d0, i1, d1) {\n    values = []\n\
    \    a = (d1 - d0) / (i1 - i0)\n    d = d0\n    for i = i0 to i1 {\n        values.append(d)\n\
    \        d = d + a\n    }\n    return values\n}\n```\n\nThis function has the\
    \ same “shape” as the first two versions of `DrawLine`, but the variables are\
    \ called `i` and `d` instead of `x` and `y`, and instead of drawing pixels, this\
    \ one stores the values in a list.\n\nNote that the value of `d` corresponding\
    \ to `i[0]` is returned in `values[0]`, the value for `i[0] + 1` in `values[1]`,\
    \ and so on; in general, the value for `i[n]` is returned in `values[i_n - i_0]`,\
    \ assuming `i[n]` is in the range `[i[0], i[1]]`.\n\nThere’s a corner case we\
    \ need to consider: we may want to compute `d = f(i)` for a single value of `i`—that\
    \ is, when `i[0] = i[1]`. In this case we can’t even compute `a`, so we’ll treat\
    \ it as a special case:\n\n```javascript\nInterpolate (i0, d0, i1, d1) {\n   \
    \ if i0 == i1 {\n        return [ d0 ]\n    }\n    values = []\n    a = (d1 -\
    \ d0) / (i1 - i0)\n    d = d0\n    for i = i0 to i1 {\n        values.append(d)\n\
    \        d = d + a\n    }\n    return values\n}\n```\n\nAs an implementation detail,\
    \ and for the remainder of this book, the values of the independent variable `i`\
    \ are always integers, as they represent pixels, while the values of the dependent\
    \ variable `d` are always floating point values, as they represent values of a\
    \ generic function. Now we can write `DrawLine` using `Interpolate` (Listing 6-2):\n\
    \n```javascript\nDrawLine(P0, P1, color) {\n    if abs(x1 - x0) > abs(y1 - y0)\
    \ {\n        // Line is horizontal-ish\n        // Make sure x0 < x1\n       \
    \ if x0 > x1 {\n            swap(P0, P1)\n        }\n        ys = Interpolate(x0,\
    \ y0, x1, y1)\n        for x = x0 to x1 {\n            canvas.PutPixel(x, ys[x\
    \ - x0], color)\n        }\n    } else {\n        // Line is vertical-ish\n  \
    \      // Make sure y0 < y1\n        if y0 > y1 {\n            swap(P0, P1)\n\
    \        }\n        xs = Interpolate(y0, x0, y1, x1)\n        for y = y0 to y1\
    \ {\n            canvas.PutPixel(xs[y - y0], y, color)\n        }\n    }\n}\n\
    ```\n\n*Listing 6-2: A version of DrawLine that uses Interpolate*\n\nThis `DrawLine`\
    \ can handle all cases (Figure 6-5).\n\n![image](Images/06fig05.jpg)\n\n*Figure\
    \ 6-5: The refactored algorithm handles all cases.*\n\nYou can see a live demo\
    \ of this refactored algorithm at `https://gabrielgambetta.com/cgfs/lines-demo`.\
    \ While this version isn’t much shorter than the previous one, it cleanly separates\
    \ the computation of intermediate values of `y` and `x` from the decision of which\
    \ is the independent variable and from the pixel-drawing code.\n\nIt might come\
    \ as a surprise that this line algorithm is not the best or the fastest there\
    \ is; that distinction belongs to Bresenham’s Algorithm. The reason to present\
    \ this algorithm is twofold. First, it is easier to understand, which is an overriding\
    \ principle in this book. Second, it gave us the `Interpolate` function, which\
    \ we will use extensively in the rest of the book.\n\n### Summary\n\nIn this chapter,\
    \ we’ve taken the first steps to building a rasterizer. Using the only tool we\
    \ have, `PutPixel`, we’ve developed an algorithm that can draw straight line segments\
    \ on the canvas. We have also developed the `Interpolate` helper method, a way\
    \ to efficiently compute values of a linear function. Make sure you understand\
    \ it well before proceeding, because we’ll be using it a lot. In the next chapter,\
    \ we’ll use `Interpolate` to draw more and interesting shapes on the canvas: triangles.\n\
    \n## 7 FILLED TRIANGLES\n\n![image](Images/common.jpg)\n\nIn the previous chapter,\
    \ we took our first steps toward drawing simple shapes—namely, straight line segments—using\
    \ only `PutPixel` and an algorithm based on simple math. In this chapter, we’ll\
    \ reuse some of the math to draw something more interesting: a filled triangle.\n\
    \n### Drawing Wireframe Triangles\n\nWe can use the `DrawLine` method to draw\
    \ the outline of a triangle:\n\n```javascript\nDrawWireframeTriangle (P0, P1,\
    \ P2, color) {\n    DrawLine(P0, P1, color);\n    DrawLine(P1, P2, color);\n \
    \   DrawLine(P2, P0, color);\n}\n```\n\nThis kind of outline is called a `wireframe`,\
    \ because it looks like a triangle made of wires, as you can see in Figure 7-1\
    \ (#ch07.xhtml_ch7fig1).\n\n![image](Images/07fig01.jpg)\n\n*Figure 7-1: A wireframe\
    \ triangle with vertices (–200,–250), (200,50), and (20,250)*\n\nThis is a promising\
    \ start! Next we’ll explore how to fill that triangle with a color.\n\n### Drawing\
    \ Filled Triangles\n\nWe want to draw a triangle filled with a color of our choice.\
    \ As is often the case in computer graphics, there’s more than one way to approach\
    \ this problem. We’ll draw filled triangles by thinking of them as a collection\
    \ of horizontal line segments that look like a triangle when drawn together. Figure\
    \ 7-2 (#ch07.xhtml_ch7fig2) shows what one such triangle would look like if we\
    \ could see the individual segments.\n\n![image](Images/07fig02.jpg)\n\n*Figure\
    \ 7-2: Drawing a filled triangle using horizontal segments*\n\nThe following is\
    \ a very rough first approximation of what we want to do:\n\n```\nfor each horizontal\
    \ line y between the triangle’s top and bottom\n    compute x_left and x_right\
    \ for this y\n    DrawLine(x_left, y, x_right, y)\n```\n\nLet’s start with “between\
    \ the triangle’s top and bottom.” A triangle is defined by its three vertices\
    \ `P[0]`, `P[1]`, and `P[2]`. If we sort these points by increasing value of `y`,\
    \ such that `y[0] ≤ y[1] ≤ y[2]`, then the range of values of `y` occupied by\
    \ the triangle is `[y[0], y[2]]`:\n\n```javascript\nif y1 < y0 { swap(P1, P0)\
    \ }\nif y2 < y0 { swap(P2, P0) }\nif y2 < y1 { swap(P2, P1) }\n```\n\nSorting\
    \ the vertices this way makes things easier: after doing this, we can always assume\
    \ `P[0]` is the lowest point of the triangle and `P[2]` is the highest, so we\
    \ won’t have to deal with every possible ordering.\n"
  raw: '[Listing 6-1](#ch06.xhtml_ch6lis1) shows a version of DrawLine that handles
    all the cases.


    DrawLine(P0, P1, color) {


        dx = x1 - x0


        dy = y1 - y0


        if abs(dx) > abs(dy) {


            // Line is horizontal-ish


            // Make sure x0 < x1


            if x0 > x1 {


                swap(P0, P1)


            }


            a = dy/dx


            y = y0


            for x = x0 to x1 {


                canvas.PutPixel(x, y, color)


                y = y + a


            }


        } else {


            // Line is vertical-ish


            // Make sure y0 < y1


            if y0 > y1 {


                swap(P0, P1)


            }


            a = dx/dy


            x = x0


            for y = y0 to y1 {


                canvas.PutPixel(x, y, color)


                x = x + a


            }


        }


    }


    *Listing 6-1: A version of DrawLine that handles all the cases*


    This certainly works, but it isn’t pretty. There’s a lot of code duplication,
    and the logic for selecting which function to use, the logic to compute the function
    values, and the pixel drawing itself are all intertwined. Surely we can do better!


    ### The Linear Interpolation Function


    We have two linear functions *y* = *f* (*x*) and *x* = *f* (*y*). To abstract
    away the fact that we’re dealing with pixels, let’s write it in a more generic
    way as *d* = *f* (*i*), where *i* is the *independent variable*, the one we choose
    the values for, and *d* is the *dependent variable*, the one whose value depends
    on the other and which we want to compute. In the horizontal-ish case, *x* is
    the independent variable and *y* is the dependent variable; in the vertical-ish
    case, it’s the other way around.


    Of course, *any* function can be written as *d* = *f* (*i*). We know two more
    things that completely define *our* function: the fact that it’s linear and two
    of its values—that is, *d*[0] = *f* (*i*[0]) and *d*[1] = *f* (*i*[1]). We can
    write a simple function that takes these values and returns a list of all the
    intermediate values of *d*, assuming as before that *i*[0] < *i*[1]:


    Interpolate (i0, d0, i1, d1) {


        values = []


        a = (d1 - d0) / (i1 - i0)


        d = d0


        for i = i0 to i1 {


            values.append(d)


            d = d + a


        }


        return values


    }


    This function has the same “shape” as the first two versions of DrawLine, but
    the variables are called i and d instead of x and y, and instead of drawing pixels,
    this one stores the values in a list.


    Note that the value of *d* corresponding to *i*[0] is returned in values[0], the
    value for *i*[0] + 1 in values[1], and so on; in general, the value for *i*[*n*]
    is returned in values[i_n - i_0], assuming *i*[*n*] is in the range [*i*[0], *i*[1]].


    There’s a corner case we need to consider: we may want to compute *d* = *f* (*i*)
    for a single value of *i*—that is, when *i*[0] = *i*[1]. In this case we can’t
    even compute *a*, so we’ll treat it as a special case:


    Interpolate (i0, d0, i1, d1) {


        if i0 == i1 {


           return [ d0 ]


        }


        values = []


        a = (d1 - d0) / (i1 - i0)


        d = d0


        for i = i0 to i1 {


            values.append(d)


            d = d + a


        }


        return values


    }


    As an implementation detail, and for the remainder of this book, the values of
    the independent variable *i* are always integers, as they represent pixels, while
    the values of the dependent variable *d* are always floating point values, as
    they represent values of a generic linear function.


    Now we can write DrawLine using Interpolate ([Listing 6-2](#ch06.xhtml_ch6lis2)).


    DrawLine(P0, P1, color) {


        if abs(x1 - x0) > abs(y1 - y0) {


            // Line is horizontal-ish


            // Make sure x0 < x1


            if x0 > x1 {


                swap(P0, P1)


            }


            ys = Interpolate(x0, y0, x1, y1)


            for x = x0 to x1 {


                canvas.PutPixel(x, ys[x - x0], color)


            }


        } else {


            // Line is vertical-ish


            // Make sure y0 < y1


            if y0 > y1 {


                swap(P0, P1)


            }


            xs = Interpolate(y0, x0, y1, x1)


            for y = y0 to y1 {


                canvas.PutPixel(xs[y - y0], y, color)


            }


        }


    }


    *Listing 6-2: A version of DrawLine that uses Interpolate*


    This DrawLine can handle all cases correctly ([Figure 6-5](#ch06.xhtml_ch6fig5)).


    ![image](Images/06fig05.jpg)


    *Figure 6-5: The refactored algorithm handles all cases correctly.*


    You can see a live demo of this refactored algorithm at *[https://gabrielgambetta.com/cgfs/lines-demo](https://gabrielgambetta.com/cgfs/lines-demo)*.


    While this version isn’t much shorter than the previous one, it cleanly separates
    the computation of the intermediate values of *y* and *x* from the decision of
    which is the independent variable and from the pixel-drawing code itself.


    It might come as a surprise that this line algorithm is not the best or the fastest
    there is; that distinction probably belongs to *Bresenham’s* *Algorithm*. The
    reason to present this algorithm is twofold. First, it is easier to understand,
    which is an overriding principle in this book. Second, it gave us the Interpolate
    function, which we will use extensively in the rest of this book.


    ### Summary


    In this chapter, we’ve taken the first steps to building a rasterizer. Using the
    only tool we have, PutPixel, we’ve developed an algorithm that can draw straight
    line segments on the canvas.


    We have also developed the Interpolate helper method, a way to efficiently compute
    values of a linear function. Make sure you understand it well before proceeding,
    because we’ll be using it a lot.


    In the next chapter, we’ll use Interpolate to draw more complex and interesting
    shapes on the canvas: triangles.


    ## **7


    FILLED TRIANGLES**


    ![image](Images/common.jpg)


    In the previous chapter, we took our first steps toward drawing simple shapes—namely,
    straight line segments—using only PutPixel and an algorithm based on simple math.
    In this chapter, we’ll reuse some of the math to draw something more interesting:
    a filled triangle.


    ### Drawing Wireframe Triangles


    We can use the DrawLine method to draw the outline of a triangle:


    DrawWireframeTriangle (P0, P1, P2, color) {


        DrawLine(P0, P1, color);


        DrawLine(P1, P2, color);


        DrawLine(P2, P0, color);


    }


    This kind of outline is called a *wireframe*, because it looks like a triangle
    made of wires, as you can see in [Figure 7-1](#ch07.xhtml_ch7fig1).


    ![image](Images/07fig01.jpg)


    *Figure 7-1: A wireframe triangle with vertices (–200,–250), (200,50), and (20,250)*


    This is a promising start! Next we’ll explore how to fill that triangle with a
    color.


    ### Drawing Filled Triangles


    We want to draw a triangle filled with a color of our choice. As is often the
    case in computer graphics, there’s more than one way to approach this problem.
    We’ll draw filled triangles by thinking of them as a collection of horizontal
    line segments that look like a triangle when drawn together. [Figure 7-2](#ch07.xhtml_ch7fig2)
    shows what one such triangle would look like if we could see the individual segments.


    ![image](Images/07fig02.jpg)


    *Figure 7-2: Drawing a filled triangle using horizontal segments*


    The following is a very rough first approximation of what we want to do:


    for each horizontal line y between the triangle’s top and bottom


        compute x_left and x_right for this y


        DrawLine(x_left, y, x_right, y)


    Let’s start with “between the triangle’s top and bottom.” A triangle is defined
    by its three vertices *P*[0], *P*[1], and *P*[2]. If we sort these points by increasing
    value of *y*, such that *y*[0] ≤ *y*[1] ≤ *y*[2], then the range of values of
    *y* occupied by the triangle is [*y*[0], *y*[2]]:


    if y1 < y0 { swap(P1, P0) }


    if y2 < y0 { swap(P2, P0) }


    if y2 < y1 { swap(P2, P1) }


    Sorting the vertices this way makes things easier: after doing this, we can always
    assume *P*[0] is the lowest point of the triangle and *P*[2] is the highest, so
    we won’t have to deal with every possible ordering.'
