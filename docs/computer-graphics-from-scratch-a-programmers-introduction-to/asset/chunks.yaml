    ![image](Images/Afig01.jpg)


    *Figure A-1: The 2D point* P *has coordinates (4, 3).*


    We can also refer to specific coordinates of a point using a subscript, like *P*[*x*]
    or *Q*[*y*]. So the point *P* can also be written as (*P*[*x*], *P*[*y*], *P*[*z*])
    when convenient.


    ### Vectors


    A *vector* represents the difference between two points. Intuitively, imagine
    a vector as an arrow that connects a point to another point; alternatively, think
    of it as the instructions to get from one point to another.


    #### Representing Vectors


    We represent a vector as a set of numbers between parentheses, and refer to them
    using a capital letter. This is the same representation we use for points, so
    we add a small arrow on top to remember they’re vectors and not points. For example,
    (2, 1) is a vector, which we might decide to call ![Images](Images/f0204-01.jpg).
    [Figure A-2](#appendix.xhtml_app01fig2) shows two equal vectors, ![Images](Images/f0204-01.jpg)
    and ![Images](Images/f0204-02.jpg).


    ![image](Images/Afig02.jpg)


    *Figure A-2: The vectors* ![Images](Images/f0204-03.jpg) *and* ![Images](Images/f0204-04.jpg)
    *are equal. Vectors don’t have a position.*


    Despite sharing their representation with points, vectors don’t represent or have
    a position; they are, after all, the *difference* between two positions. When
    you have a diagram like [Figure A-2](#appendix.xhtml_app01fig2), you have to draw
    vectors somewhere; but the vectors ![Images](Images/f0204-01.jpg) and ![Images](Images/f0204-02.jpg)
    are equal, because they represent the same displacement.


    In addition, the point (2, 1) and the vector (2, 1) are unrelated. Sure, the vector
    (2, 1) goes from (0, 0) to (2, 1), but it’s equally true that it goes from, say,
    (5, 5) to (7, 6).


    Vectors are characterized by their *direction* (the angle in which they point)
    and their *magnitude* (how long they are).


    The direction can be further decomposed into *orientation* (the slope of the line
    they’re on) and *sense* (which of the possible two ways along that line they point).
    For example, a vector pointing right and a vector pointing left both have the
    same horizontal orientation, but they have the opposite sense. However, we don’t
    make this distinction anywhere in this book.


    #### Vector Magnitude


    You can compute the magnitude of a vector from its coordinates. The magnitude
    is also called the *length* or *norm* of the vector. It’s denoted by putting the
    vector between vertical pipes, as in ![Images](Images/f0205-01.jpg), and it’s
    computed as follows:


    ![image](Images/f0205-02.jpg)


    A vector with a magnitude equal to 1.0 is called a *unit vector*.


    ### Point and Vector Operations


    Now that we’ve defined points and vectors, let’s explore what we can do with them.


    #### Subtracting Points


    A vector is the difference between two points. In other words, you can subtract
    two points and get a vector:


    ![image](Images/f0205-03.jpg)


    In this case, you can think of ![Images](Images/varr.jpg) as “going” from *Q*
    to *P*, as in [Figure A-3](#appendix.xhtml_app01fig3).


    ![image](Images/Afig03.jpg)


    *Figure A-3: The vector ![Images](Images/f0206-02.jpg) is the difference between*
    P *and* Q.


    Algebraically, you subtract each of the coordinates separately:


    (*V[x]*, *V[y]*, *V[z]*) = (*P[x]*, *P[y]*, *P[z]*) *–* (*Q[x]*, *Q[y]*, *Q[z]*)
    = (*P[x]* *–* *Q[x]*, *P[y]* *–* *Q[y]*, *P[z]* *–* *Q[z]*)


    #### Adding a Point and a Vector


    We can rewrite the equation above coordinate by coordinate:


    *V[x]* = *P[x]* *–* *Q[x]*


    *V[y]* = *P[y]* *–* *Q[y]*


    *V[z]* = *P[z]* *–* *Q[z]*


    These are just numbers, so all the usual rules apply. This means you can do this:


    *Q[x]* + *V[x]* = *P[x]*


    *Q[y]* + *V[y]* = *P[y]*


    *Q[z]* + *V[z]* = *P[z]*


    And grouping the coordinates again,


    ![image](Images/f0206-01.jpg)


    In other words, you can add a vector to a point and get a new point. This makes
    intuitive and geometric sense; given a starting position (a point) and a displacement
    (a vector), you end up in a new position (another point). [Figure A-4](#appendix.xhtml_app01fig4)
    presents an example.


    ![image](Images/Afig04.jpg)


    *Figure A-4: Adding* ![Images](Images/f0206-02.jpg) *to* Q *gives us* P.


    #### Adding Vectors


    You can add two vectors. Geometrically, imagine putting one vector “after” another,
    as in [Figure A-5](#appendix.xhtml_app01fig5).


    ![image](Images/Afig05.jpg)


    *Figure A-5: Adding two vectors. Addition is commutative. Remember, vectors don’t
    have a position.*


    As you can see, vector addition is commutative—that is, the order of the operands
    doesn’t matter. In the diagram, we can see that ![Images](Images/f0207-01.jpg).


    Algebraically, you add the coordinates individually:


    ![image](Images/f0207-02.jpg)


    #### Multiplying a Vector by a Number


    You can multiply a vector by a number. This is called the *scalar product*. This
    makes the vector shorter or longer, as you can see in [Figure A-6](#appendix.xhtml_app01fig6).


    ![image](Images/Afig06.jpg)


    *Figure A-6: Multiplying a vector by a number*


    If the number is negative, the vector will point the other way; this means it
    changes its sense and therefore its direction. But multiplying a vector by a number
    never changes its orientation—that is, it will remain along the same line.


    Algebraically, you multiply the coordinates individually:


    ![image](Images/f0208-01.jpg)


    You can also divide a vector by a number. Just like with numbers, dividing by
    *k* is equivalent to multiplying by ![Images](Images/f0208-02.jpg). As usual,
    division by zero doesn’t work.


    One of the applications of vector multiplication and division is to *normalize*
    a vector—that is, to turn it into a unit vector. This changes the magnitude of
    the vector to 1.0, but doesn’t change its other properties. To do this, we just
    need to divide the vector by its length:


    ![image](Images/f0208-03.jpg)


    #### Multiplying Vectors


    You can multiply a vector by another vector. Interestingly, there are many ways
    in which you can define an operation like this. We’re going to focus on two kinds
    of multiplication that are useful to us: the dot product and the cross product.


    ##### Dot Product


    The *dot product* between two vectors (also called the *inner product*) gives
    you a number. It’s expressed using the dot operator, as in ![Images](Images/f0208-04.jpg).
    It’s also written between angle braces, as in ![Images](Images/f0208-05.jpg).


    Algebraically, you multiply the coordinates individually and add them:


    ![image](Images/f0208-06.jpg)


    Geometrically, the dot product of ![Images](Images/f0170-06.jpg) and ![Images](Images/f0209-05.jpg)
    is related to their lengths and to the angle *α* between them. The exact formula
    neatly ties together linear algebra and trigonometry:


    ![image](Images/f0209-01.jpg)


    Either of these formulas help us see that the dot product is commutative (that
    is, ![Images](Images/f0209-02.jpg)) and that it’s distributive with respect to
    a scalar product (that is, ![Images](Images/f0209-03.jpg)).


    An interesting consequence of the second formula is that if ![Images](Images/f0209-04.jpg)
    and ![Images](Images/f0209-05.jpg) are perpendicular, then cos(*α*) = 0 and therefore
    ![Images](Images/f0209-06.jpg) is also zero. If ![Images](Images/f0170-06.jpg)
    and ![Images](Images/f0209-05.jpg) are unit vectors, then ![Images](Images/f0209-06.jpg)
    is always between *–*1.0 and 1.0, with 1.0 meaning they’re equal and *–*1.0 meaning
    they’re opposite.


    The second formula also suggests the dot product can be used to calculate the
    angle between two vectors:


    ![image](Images/f0209-07.jpg)


    Note that the dot product of a vector with itself, ![Images](Images/f0020-02.jpg),
    reduces to the square of its length:'
