    makes them suitable for interactive applications such as videogames, while raytracers
    may take multiple seconds to render the same scene once. This difference might
    tend to disappear in the future; advances in hardware in recent years are making
    raytracer performance much more competitive with that of rasterizers.


    ### Summary


    In this chapter, we added illumination to our rasterizer. The illumination equation
    we use is exactly the same as the one in [Chapter 3](#ch03.xhtml_ch03), because
    we’re using the same lighting model. However, where the raytracer computed the
    illumination equation at each pixel, our rasterizer can support a variety of different
    techniques to achieve a specific trade-off between performance and image quality.


    The fastest shading algorithm, which also produces the least appealing results,
    is flat shading: we compute the illumination of a single point in a triangle and
    use it for every pixel in that triangle. This results in a very faceted appearance,
    especially for objects that approximate curved surfaces such as spheres.


    One step up the quality ladder, we have Gouraud shading: we compute the illumination
    of the three vertices of a triangle and then interpolate this value across the
    face of the triangle. This gives objects a smoother appearance, including curved
    objects. However, this technique fails to capture more subtle lighting effects,
    such as specular highlights.


    Finally, we studied Phong shading. Much like our raytracer, it computes the illumination
    equation at every pixel, producing the best results and also the worst performance.
    The trick in Phong shading is knowing how to compute all the necessary values
    to evaluate the illumination equation; once again, the answer is linear interpolation—in
    this case, of normal vectors.


    In the next chapter, we’ll add even more detail to the surface of our triangles,
    using a technique that we haven’t studied for the raytracer: texture mapping.


    ## **14


    TEXTURES**


    ![image](Images/common.jpg)


    Our rasterizer can render objects like cubes or spheres. But we usually don’t
    want to render abstract geometric objects like cubes and spheres; instead, we
    want to render real-world objects, like crates and planets or dice and marbles.
    In this chapter, we’ll look at how we can add visual detail to the surface of
    our objects by using *textures*.


    ### Painting a Crate


    Let’s say we want our scene to have a wooden crate. How do we turn a cube into
    a wooden crate? One option is to add a lot of triangles to replicate the grain
    of the wood, the heads of the nails, and so on. This would work, but it would
    add a lot of geometric complexity to the scene, resulting in a big performance
    hit.


    Another option is to fake the details: instead of modifying the geometry of an
    object, we just “paint” something that looks like wood on top of it. Unless you’re
    looking at the crate from up close, you won’t notice the difference, and the computational
    cost is significantly lower than adding lots of geometric detail.


    Note that the two options aren’t incompatible: you can choose the right balance
    between adding geometry and painting on that geometry to achieve the image quality
    and performance you require. Since we know how to deal with geometry, we’ll explore
    the second option.'
