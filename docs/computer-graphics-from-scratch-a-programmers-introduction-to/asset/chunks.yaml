  trans: "\n\n`Projection`（投影）很少改变；它仅取决于视口的大小和画布的大小。例如，当应用程序从窗口切换到全屏时，画布的大小会发生。只有当相机的视场发生变化时，视口的大小才会改变；而这种情况并不常见。\n\
    \n`Camera`（相机）可能每一帧都发生变化；它取决于相机的位置和朝向，因此如果相机正在移动或旋转，就需要重新计算。然而，一旦计算完成，它对于帧中绘制的每个对象都保持不变，因此每帧最多只需要计算一次。\n\
    \n`Model`（模型）对于场景中的每个实例都是不同的；然而，对于不移动的实例（例如树木和建筑），它会随时间推移保持不变，因此可以计算一次并存储在场景本身。对于会移动的物体（例如赛车游戏中的汽车），在每次移动时都需要进行计算（很可能是每帧一次）。\n\
    \n场景渲染的高层级伪代码如下所示列表 10-5。\n\n```\nRenderModel(model, transform) {\n    projected\
    \ = []\n    for V in model.vertices {\n        projected.append(ProjectVertex(transform\
    \ * V))\n    }\n    for T in model.triangles {\n        RenderTriangle(T, projected)\n\
    \    }\n}\n\nRenderScene() {\n    M_camera = MakeCameraMatrix(camera.position,\
    \ camera.orientation)\n    for I in scene.instances {\n        M = M_camera *\
    \ I.transform\n        RenderModel(I.model, M)\n    }\n}\n```\n\n*列表 10-5：使用变换矩阵渲染场景的算法*\n\
    \n我们现在可以绘制包含多个不同模型实例的场景，这些实例可能在移动和旋转，而且我们可以在整个场景中移动相机。图 10-10 显示了我们立方体模型的两个实例，每个都有不同的变换（包括平移和旋转），从经过平移和旋转的相机进行渲染。\n\
    \n![image](img/10fig10.jpg)\n\n*图 10-10：具有相同立方体模型实例的场景，具有不同的实例变换和一个经过变换的相机*\n\n\
    你可以在 `[`gabrielgambetta.com/cgfs/transforms-demo`](https://gabrielgambetta.com/cgfs/transforms-demo)`\
    \ 找到此算法的现场实现。\n\n### 总结\n\n在本章中涵盖了大量内容。我们首先探索了如何表示由三角形组成的模型。然后，我们弄了如何将上一章中推出的透视投影方程应用于整个模型，这样我们就可以从抽象的\
    \ 3D 模型得到在屏幕上的表示。\n\n接下来，我们开发了一种方法，可以在场景中拥有同一个模型的多个实例，而无需模型本身的多个副本。然后，我们发现了如何消除目前为止一直处理的限制之一：我们的相机不再需要固定在坐标系的原点，也不需要指向\
    \ ![image](img/f0132-01.jpg)。\n\n最后，我们探索了如何将我们需要应用到顶点的所有变换表示为齐次坐标下的矩阵乘法，这允许我们通过将许多连续的变换压缩为仅有的三个矩阵，来减少渲染场景所需的计算量：一个用于透视投影和视口到画布的映射，一个用于实例变换，以及一个用于相机变换。\n\
    \n这在我们在场景中可以表示的内容方面给了我们很大的灵活性，也允许我们在场景中移动相机。但我们仍然有两个重要的限制。首先，移动相机意味着我们可能会得到位于它后面的物体，这会导致各种问题。其次，渲染效果看起来并不好：它仍然是线框图。\n\
    \n请注意，由于实际原因，我们在本书的其余部分将不再使用完整的投影矩阵。相反，我们将分别使用模型和相机变换，然后如下所示将其结果转换回笛卡尔坐标：\n\n\
    ![image](img/f0132-02.jpg)\n\n这允许我们在投影点之前，在 3D 中进行一些无法用矩阵变换表示的操作。\n\n在下一章中，我们将处理不应可见的物体，然后在本书的大部分时间里让渲染后的物体看起来更好。\n\
    \n# 11 裁剪 (CLIPPING)\n\n![image](img/common.jpg)\n\n在最后几章中，我们开发了方程和算法，将场景的 3D\
    \ 定义转换为可以在画布上绘制的 2D 形状；我们开发了场景结构，让我们能够定义 3D 模型并将这些模型的实例放置在场景中；我们开发了一种算法，让我们能够从任何视角渲染场景。\n\
    \n然而，这样做暴露了我们一直处理的限制之一：透视投影方程仅对相机前方的点按预期工作。由于我们现在可以在场景周围移动和旋转相机，这带来了一个问题。\n\n\
    在本章中，我们将开发必要的技术来消除这一限制：我们将探索如何识别相机后的点、三角形和整个物体，并开发处理它们的技术。\n\n### 裁剪过程概述\n\n在第\
    \ 9 章中，我们得到了以下方程：\n\n![image](img/f0134-01.jpg)\n\n除以 `P[z]` 的操作是有问题的；它可能导致除以零。此外，相机后的点具有负的\
    \ `Z` 值，我们目前无法正确处理。即使是相机前方但非常靠近相机点也会以严重畸变物体的形式产生问题。\n\n为了避免这些情况，我们将选择不渲染投影平面 `Z\
    \ = d` 之后的任何内容。这个裁剪平面允许我们将任何点分类为位于裁剪体的“内部”或“外部”——即从相机实际上可见的空间子集。\n\n### 裁剪体 (The\
    \ Clipping Volume)\n\n使用单个裁剪平面来确保相机背后的物体会被产生正确的结果，但并不完全高效。某些物体可能在相机前方但仍然不可见；例如，位于投影平面附近但非常靠右的物体将被投影到视口之外，因此不可见，如图\
    \ 11-1 所示。\n\n![image](img/11fig01.jpg)\n\n*图 11-1：位于投影平面前方但投影到视口外的物体*\n\n我们用于投影此类物体的任何计算资源，加上渲染它而进行的每个三角形和每个顶点计算都是浪费。完全忽略这些物体会更高效。\n\
    \n为了做到这一点，我们可以定义额外的平面将场景裁剪到正好是视口应该可见的内容；这些平面由相机和视口的四个边定义（图 11-2）。\n\n![image](img/11fig02.jpg)\n\
    \n*图 11-2：定义我们裁剪体的五个平面*\n\n每个裁剪平面将空间分成两部分，我们称为*半空间*。““内部”半空间是平面前方的一切；“外部”半空间是平面之后的一切。我们定义的裁剪体“内部”是每个裁剪平面定义的“内部”半空间的交集。在这种情况下，裁剪体看起来像一个切掉了顶部的无限高金字塔。\n\
    \n"
