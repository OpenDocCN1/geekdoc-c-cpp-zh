    这意味着，要相对于裁剪体对场景进行裁剪，我们只需要连续地对定义裁剪体的每个平面进行裁剪即可。在相对于其中一个平面裁剪后，剩余的任何几何体再对剩余的平面进行裁剪。在场景相对于所有平面完成裁剪后，剩余的几何体就是场景相对于裁剪体裁剪的结果。


    接下来，我们将查看如何相对于每个裁剪平面对场景进行裁剪。


    ### 针对平面裁剪场景


    考虑一个包含多个对象的场景，每个对象由四个三角形组成（图 11-3）。


    ![image](img/11fig03.jpg)


    *图 11-3：具有三个对象的场景*


    我们执行的操作越少，渲染器的速度就越快。我们将按照一系列阶段相对于裁剪平面对场景进行裁剪。每个阶段都将尝试尽可能地将几何体分类为 `accepted`（接受）或
    `discarded`（丢弃），取决于它们是在裁剪平面定义的半空间内部还是外部（即该平面的裁剪体内部）。任何无法被分类的几何体将移动到下一个阶段，该阶段将对其进行更详细的检查。


    第一阶段尝试对整个对象进行分类。如果一个对象完全位于裁剪体内部，则它被接受（在图 11-4 中为绿色）；如果它完全位于外部，则它被丢弃（在图 11-4 中为红色）。


    ![image](img/11fig04.jpg)


    *图 11-4：对象级裁剪。绿色表示接受，红色表示丢弃，灰色需要进一步处理。*


    如果一个对象无法被完全接受或丢弃，我们就移动到下一个阶段，并独立地对其每个三角形进行分类。如果一个三角形完全位于裁剪体内部，则被接受；如果完全位于外部，则被丢弃（参见图
    11-5）。


    ![image](img/11fig05.jpg)


    *图 11-5：三角形级裁剪。右侧对象的每个三角形被接受、丢弃或需要进一步处理。*


    最后，对于每个未被接受或丢弃的三角形，我们需要对三角形本身进行裁剪。移除原始三角形，并添加一个或两个新三角形来覆盖位于裁剪体内的三角形部分（参见图 11-6）。


    ![image](img/11fig06.jpg)


    *图 11-6：顶点级裁剪。部分位于裁剪体内部的每个三角形被分成一个或两个完全位于裁剪体内部的三角形。*


    现在我们已经对裁剪的工作原理有了清晰的概念理解，我们将开发数学方法和算法来创建一个工作实现。


    ### 定义裁剪平面


    让我们从投影平面 `Z = d` 开始，将其作为裁剪平面。这个方程很容易直视化，但对于我们的目的来说，它并不是最方便或通用的形式。


    3D 平面的通用方程为 `Ax + By + Cz + D = 0`，这意味着点 `P = (x, y, z)` 满足该方程当且仅当 `P` 在平面上。如果我们将系数（`A`,
    `B`, `C`）分组在向量 ![image](img/f0160-01.jpg) 中，我们可以将方程重写为 ![image](img/f0138-01.jpg)。


    注意，如果 ![image](img/f0138-01.jpg)，那么对于任何 `k` 的值，![image](img/f0138-01a.jpg) 都成立。特别，我们可以选择
    ![image](img/f0138-01b.jpg)，乘以原始方程，得到新方程 ![image](img/f0138-02.jpg)，其中 ![image](img/f0138-03.jpg)
    是单位向量。因此，任何给定的平面都可以方程 ![image](img/f0138-01.jpg) 表示，其中 ![image](img/f0160-01.jpg)
    是单位向量，`D` 是一个实数。


    这是一个非常方便的公式化：![image](img/f0160-01.jpg) 正好是平面的法线，而 `-D` 是从原点到平面的 `signed distance`（符号距离）。事实上，对于任何点
    `P`，![image](img/f0138-02a.jpg) 是平面到 `P` 的符号距离；`distance = 0` 只是 `P` 位于在内的特殊情况。


    如果 ![image](img/f0160-01.jpg) 是平面的法线，那么 ![image](img/f0138-03a.jpg) 也是，因此我们选择
    ![image](img/f0160-01.jpg) 指向裁剪体的“内部”。对于平面 `Z = d`，我们选择法线 `(0,0,1)`，它相对于相机指向“前方”。由于点
    `(0,0, d)` 包含在平面内，它必须是这样。

