- fmt: "\n# PART I\n\n# RAYTRACING\n\n## 2. BASIC RAYTRACING\n\n![image](Images/common.jpg)\n\
    \nIn this chapter, we’ll introduce raytracing, the first major algorithm we’ll\
    \ cover. We start by motivating the algorithm and laying out some basic pseudocode.\
    \ Then we look at how to represent rays of light and objects in a scene. Finally,\
    \ we derive a way to compute which rays of light make up the visible image of\
    \ each of the objects in our scene and see how we can represent them on the canvas.\n\
    \n### Rendering a Swiss Landscape\n\nSuppose you’re visiting some exotic place\
    \ and come across a stunning landscape—so stunning, you just `need` to make a\
    \ painting capturing its beauty. [Figure 2-1](#ch02.xhtml_ch2fig1) shows one such\
    \ landscape.\n\n![image](Images/02fig01.jpg)\n\n*Figure 2-1: A breathtaking Swiss\
    \ landscape*\n\nYou have a canvas and a paint brush, but you absolutely lack artistic\
    \ talent. Is all hope lost?\n\nNot necessarily. You may not have artistic talent,\
    \ but you are methodical. So you do the most obvious thing: you get an insect\
    \ net. You cut a rectangular piece, frame it, and fix it to a stick. Now you can\
    \ look at the landscape through a netted window. Next, you choose the best point\
    \ of view to appreciate this landscape and plant another stick to mark the exact\
    \ position where your eye should be.\n\nYou haven’t started the painting yet,\
    \ but now you have a fixed point of view and a fixed frame through which you can\
    \ see the landscape. Moreover, this fixed frame is divided into small squares\
    \ by the insect net. Now comes the methodical part. You draw a grid on the canvas,\
    \ giving it the same number of squares as the insect net. Then you look at the\
    \ top-left square of the net. What’s the predominant color you can see through\
    \ it? Sky blue. So you paint the top-left square of the canvas sky blue. You do\
    \ this for every square, and soon enough the canvas contains a pretty good painting\
    \ of the landscape, as seen through the frame. The resulting painting is shown\
    \ in [Figure 2-2](#ch02.xhtml_ch2fig2).\n\n![image](Images/02fig02.jpg)\n\n*Figure\
    \ 2-2: A crude approximation of the landscape*\n\nWhen you think about it, a computer\
    \ is essentially a very methodical machine absolutely lacking artistic talent.\
    \ We can describe the process of creating our painting as follows:\n\n```\nFor\
    \ each little square on the canvas\n    Paint it the right color\n```\n\nEasy!\
    \ However, that formulation is too abstract to implement directly on a computer.\
    \ We can go into a bit more detail:\n\n```\nPlace the eye and the frame as desired\n\
    For each square on the canvas\n    Determine which square on the grid corresponds\
    \ to this square on the canvas\n    Determine the color seen through that grid\
    \ square\n    Paint the square with that color\n```\n\nThis is still too abstract,\
    \ but it starts to look like an algorithm—and perhaps surprisingly, that’s a high-level\
    \ overview of the full raytracing algorithm! Yes, it’s that simple.\n\n### Basic\
    \ Assumptions\n\nPart of the charm of computer graphics is drawing things on the\
    \ screen. To achieve this as soon as possible, we’ll make some simplifying assumptions.\
    \ Of course, these assumptions impose some restrictions over what we can do, but\
    \ we’ll lift the restrictions in later chapters.\n\nFirst of all, we’ll assume\
    \ a fixed viewing position. The viewing position, the place where you’d put your\
    \ eye in the Swiss landscape analogy, is commonly called the `camera position`;\
    \ let’s call it `O`. We’ll assume that the camera occupies a single point in space,\
    \ that it is located at the origin of the coordinate system, and that it never\
    \ moves from there, so `O = (0, 0, 0)` for now.\n\nSecond, we’ll assume a fixed\
    \ camera orientation. The camera orientation determines where the camera is pointing.\
    \ We’ll assume it looks in the direction of the positive `Z` axis (which we’ll\
    \ shorten to ![Images](Images/zarrp.jpg)), with the positive `Y` axis (![Images](Images/yarrp.jpg))\
    \ up and the positive `X` axis (![Images](Images/xarrp.jpg)) to the right ([Figure\
    \ 2-3](#ch02.xhtml_ch2fig3)).\n\n![image](Images/02fig03.jpg)\n\n*Figure 2-3:\
    \ The position and orientation of the camera*\n\nThe camera position and orientation\
    \ are now fixed. Still missing from the analogy is the “frame” through which we\
    \ look at the scene. We’ll assume this frame has dimensions `V[w]` and `V[h]`,\
    \ and is frontal to the camera orientation—that is, perpendicular to ![Images](Images/zarrp.jpg).\
    \ We’ll also assume it’s at a distance `d`, its sides are parallel to the `X`\
    \ and `Y` axes, and it’s centered with respect to ![Images](Images/zarr.jpg).\
    \ That’s a mouthful, but it’s actually quite simple. Take a look at [Figure 2-4](#ch02.xhtml_ch2fig4).\n\
    \nThe rectangle that will act as our window to the world is called the `viewport`.\
    \ Essentially, we’ll draw on the canvas whatever we see through the viewport.\
    \ Note that the size of the viewport and the distance to the camera determine\
    \ the angle visible from the camera, called the `field of view`, or `FOV` for\
    \ short. Humans have an almost 180° horizontal FOV (although much of it is blurry\
    \ peripheral vision with no sense of depth). For simplicity, we’ll set `V[w] =\
    \ V[h] = d = 1`; this produces reasonable-looking images that are not distorted.\n\
    \n![image](Images/02fig04.jpg)\n\n*Figure 2-4: The position and orientation of\
    \ the viewport*\n\nLet’s go back to the “algorithm” presented earlier, use the\
    \ appropriate terms, and number the steps in `2-1`.\n\n```\nPlace the eye and\
    \ the frame as desired\nFor each square on the canvas\n    Determine which square\
    \ on the grid corresponds to this square on the canvas\n    Determine the color\
    \ seen through that grid square\n    Paint the square with that color\n```\n*Listing\
    \ 2-1: A high-level description of our algorithm*\n\nWe have just done step ❶\
    \ (or, more precisely, gotten it out the way). Step ❹ is trivial: we simply use\
    \ `canvas.PutPixel(x, y, color)`. Let’s do step ❷ quickly, and then focus our\
    \ attention on increasingly sophisticated ways of doing ❸ over the next chapters.\n\
    \n### Canvas to Viewport\n\nStep ❷ of our algorithm in [2-1](#ch02.xhtml_ch2lis)\
    \ asks us to Determine which square on the viewport corresponds to this pixel.\
    \ We know the canvas coordinates of the pixel—let’s call them `C[x]` and `C[y]`.\
    \ Notice how we conveniently placed the viewport so that its axes match those\
    \ of the canvas. Because the viewport is measured in world units and the canvas\
    \ is measured in pixels, going from canvas coordinates to space is just a change\
    \ of scale!\n\n![image](Images/e017-01.jpg)\n\nThere’s an extra detail. Although\
    \ the viewport is 2D, it’s embedded in 3D space. We defined it to be at a distance\
    \ `d` from the camera; every point in this plane (called the `projection plane`)\
    \ has, by definition, `z = d`. Therefore,\n\n```\nV[z] = d\n```\n\nAnd we’re done\
    \ with this step. For each pixel (`C[x], C[y]`) on the canvas, we can determine\
    \ its corresponding point on the viewport (`V[x], V[y], V[z]`).\n\n### Tracing\
    \ Rays\n\nThe next step is to figure out what color the light coming through (`V[x],\
    \ V[y], V[z]`) is, as seen from the camera’s point of view (`O[x], O[y], O[z]`).\n\
    \nIn the real world, light comes from a light source (the Sun, a light bulb, and\
    \ so on), bounces off several objects, and finally reaches our eyes. We could\
    \ try simulating the path of every photon leaving our simulated light sources,\
    \ but it would be *extremely* time-consuming. Not only would we have to simulate\
    \ a mind-boggling number of photons (a single 100 W light bulb emits 10^20 photons\
    \ per second!), only a tiny minority of them would happen to reach (`O[x], O[y],\
    \ O[z]`) after coming through the viewport. This technique is called *photon tracing*\
    \ or *photon* *mapping*; unfortunately, it’s outside the scope of this book.\n"
  raw: '## PART I


    RAYTRACING


    ## **2


    BASIC RAYTRACING**


    ![image](Images/common.jpg)


    In this chapter, we’ll introduce raytracing, the first major algorithm we’ll cover.
    We start by motivating the algorithm and laying out some basic pseudocode. Then
    we look at how to represent rays of light and objects in a scene. Finally, we
    derive a way to compute which rays of light make up the visible image of each
    of the objects in our scene and see how we can represent them on the canvas.


    ### Rendering a Swiss Landscape


    Suppose you’re visiting some exotic place and come across a stunning landscape—so
    stunning, you just *need* to make a painting capturing its beauty. [Figure 2-1](#ch02.xhtml_ch2fig1)
    shows one such landscape.


    ![image](Images/02fig01.jpg)


    *Figure 2-1: A breathtaking Swiss landscape*


    You have a canvas and a paint brush, but you absolutely lack artistic talent.
    Is all hope lost?


    Not necessarily. You may not have artistic talent, but you are methodical. So
    you do the most obvious thing: you get an insect net. You cut a rectangular piece,
    frame it, and fix it to a stick. Now you can look at the landscape through a netted
    window. Next, you choose the best point of view to appreciate this landscape and
    plant another stick to mark the exact position where your eye should be.


    You haven’t started the painting yet, but now you have a fixed point of view and
    a fixed frame through which you can see the landscape. Moreover, this fixed frame
    is divided into small squares by the insect net. Now comes the methodical part.
    You draw a grid on the canvas, giving it the same number of squares as the insect
    net. Then you look at the top-left square of the net. What’s the predominant color
    you can see through it? Sky blue. So you paint the top-left square of the canvas
    sky blue. You do this for every square, and soon enough the canvas contains a
    pretty good painting of the landscape, as seen through the frame. The resulting
    painting is shown in [Figure 2-2](#ch02.xhtml_ch2fig2).


    ![image](Images/02fig02.jpg)


    *Figure 2-2: A crude approximation of the landscape*


    When you think about it, a computer is essentially a very methodical machine absolutely
    lacking artistic talent. We can describe the process of creating our painting
    as follows:


    For each little square on the canvas


        Paint it the right color


    Easy! However, that formulation is too abstract to implement directly on a computer.
    We can go into a bit more detail:


    Place the eye and the frame as desired


    For each square on the canvas


        Determine which square on the grid corresponds to this square on the canvas


        Determine the color seen through that grid square


        Paint the square with that color


    This is still too abstract, but it starts to look like an algorithm—and perhaps
    surprisingly, that’s a high-level overview of the full raytracing algorithm! Yes,
    it’s that simple.


    ### Basic Assumptions


    Part of the charm of computer graphics is drawing things on the screen. To achieve
    this as soon as possible, we’ll make some simplifying assumptions. Of course,
    these assumptions impose some restrictions over what we can do, but we’ll lift
    the restrictions in later chapters.


    First of all, we’ll assume a fixed viewing position. The viewing position, the
    place where you’d put your eye in the Swiss landscape analogy, is commonly called
    the *camera position*; let’s call it *O*. We’ll assume that the camera occupies
    a single point in space, that it is located at the origin of the coordinate system,
    and that it never moves from there, so *O* = (0, 0, 0) for now.


    Second, we’ll assume a fixed camera orientation. The camera orientation determines
    where the camera is pointing. We’ll assume it looks in the direction of the positive
    *Z* axis (which we’ll shorten to ![Images](Images/zarrp.jpg)), with the positive
    Y axis (![Images](Images/yarrp.jpg)) up and the positive X axis (![Images](Images/xarrp.jpg))
    to the right ([Figure 2-3](#ch02.xhtml_ch2fig3)).


    ![image](Images/02fig03.jpg)


    *Figure 2-3: The position and orientation of the camera*


    The camera position and orientation are now fixed. Still missing from the analogy
    is the “frame” through which we look at the scene. We’ll assume this frame has
    dimensions *V*[*w*] and *V*[*h*], and is frontal to the camera orientation—that
    is, perpendicular to ![Images](Images/zarrp.jpg). We’ll also assume it’s at a
    distance *d*, its sides are parallel to the *X* and *Y* axes, and it’s centered
    with respect to ![Images](Images/zarr.jpg). That’s a mouthful, but it’s actually
    quite simple. Take a look at [Figure 2-4](#ch02.xhtml_ch2fig4).


    The rectangle that will act as our window to the world is called the *viewport*.
    Essentially, we’ll draw on the canvas whatever we see through the viewport. Note
    that the size of the viewport and the distance to the camera determine the angle
    visible from the camera, called the *field of view*, or FOV for short. Humans
    have an almost 180^∘ horizontal FOV (although much of it is blurry peripheral
    vision with no sense of depth). For simplicity, we’ll set *V*[*w*] = *V*[*h*]
    = *d* = 1; this results in a FOV of approximately 53^∘, which produces reasonable-looking
    images that are not overly distorted.


    ![image](Images/02fig04.jpg)


    *Figure 2-4: The position and orientation of the viewport*


    Let’s go back to the “algorithm” presented earlier, use the appropriate technical
    terms, and number the steps in [Listing 2-1](#ch02.xhtml_ch2lis1).


    ❶ Place the camera and the viewport as desired


       For each pixel on the canvas


         ❷ Determine which square on the viewport corresponds to this pixel


         ❸ Determine the color seen through that square


         ❹ Paint the pixel with that color


    *Listing 2-1: A high-level description of our raytracing algorithm*


    We have just done step ❶ (or, more precisely, gotten it out of the way for now).
    Step ❹ is trivial: we simply use canvas.PutPixel(x, y, color). Let’s do step ❷
    quickly, and then focus our attention on increasingly sophisticated ways of doing
    step ❸ over the next few chapters.


    ### Canvas to Viewport


    Step ❷ of our algorithm in [Listing 2-1](#ch02.xhtml_ch2lis1) asks us to Determine
    which square on the viewport corresponds to this pixel. We know the canvas coordinates
    of the pixel—let’s call them *C*[*x*] and *C*[*y*]. Notice how we conveniently
    placed the viewport so that its axes match the orientation of those of the canvas,
    and its center matches the center of the canvas. Because the viewport is measured
    in world units and the canvas is measured in pixels, going from canvas coordinates
    to space coordinates is just a change of scale!


    ![image](Images/e0017-01.jpg)


    There’s an extra detail. Although the viewport is 2D, it’s embedded in 3D space.
    We defined it to be at a distance *d* from the camera; every point in this plane
    (called the *projection plane*) has, by definition, *z* = *d*. Therefore,


    *V[z]* = *d*


    And we’re done with this step. For each pixel (*C*[*x*], *C*[*y*]) on the canvas,
    we can determine its corresponding point on the viewport (*V*[*x*], *V*[*y*],
    *V*[*z*]).


    ### Tracing Rays


    The next step is to figure out what color the light coming through (*V*[*x*],
    *V*[*y*], *V*[*z*]) is, as seen from the camera’s point of view (*O*[*x*], *O*[*y*],
    *O*[*z*]).


    In the real world, light comes from a light source (the Sun, a light bulb, and
    so on), bounces off several objects, and then finally reaches our eyes. We could
    try simulating the path of every photon leaving our simulated light sources, but
    it would be *extremely* time-consuming. Not only would we have to simulate a mind-boggling
    number of photons (a single 100 W light bulb emits 10^(20) photons per second!),
    only a tiny minority of them would happen to reach (*O*[*x*], *O*[*y*], *O*[*z*])
    after coming through the viewport. This technique is called *photon tracing* or
    *photon* *mapping*; unfortunately, it’s outside the scope of this book.'
