    但是等一下，那个大黄球是如何变成一个平坦的黄色地板的？它并没有变；它只是与其他三个球相比大得多，而且相机离它非常近，以至于看起来是平坦的——就像当我们站在地球表面时，看起来平坦的一样。


    ## 镜面反射


    让我们关注`shiny`物体。与哑光物体不同，光亮的物体根据观察角度的不同看起来略有不同。


    想象一个台球或一辆刚洗完的汽车。这类物体表现出非常特定的光模式，通常是亮斑，这些斑点似乎随着你移动它们而移动。与哑光物体不同，你对这些物体表面的感知实际上取决于视角。


    注意，如果你绕着一个红色台球走，它依然是红色的，但赋予它光泽的白色亮斑会随着你的移动而移动。这表明我们想要建模的新效果并不是取代漫漫反射，而是对它的补充。


    为了理解为什么会这样，让我们仔细观察表面是如何反射光线的。正如我们在上一节中看到的，当光线击中哑光体的表面时，它会向每个方向均匀地散射回来。这是因为物体的表面是不规则的，因此在微观层，它的表现就像一组指向随机方向的微小表面（图
    3-8）。


    ![image](img/03fig08.jpg)


    *图 3-8：通过显微镜观察哑光物体粗糙表面的情况。入射光向随机方向反射。*


    但如果表面不是那么规则呢？让我们来看另一个极端：一面完全抛光的镜子。当光线击中镜子时，它会向单一方向反射。如果我们将反射光的方向称为 ![Images](img/rarr.jpg)，并保持
    ![Images](img/larr.jpg) 指向光源的习惯，图 3-9 描述了这种情况。


    ![image](img/03fig09.jpg)


    *图 3-9：镜子反射的光线*


    取决于表面“抛光”的程度，它的行为或或少像镜子；这就是为什么它被称为`specular`（镜面）反射，源自拉丁语单词 `speculum`，意为“镜子”。


    对于完全抛光的镜子，入射光 ![Images](img/larr.jpg) 被反射到单一方向 ![Images](img/rarr.jpg)。这就是为什么你可以清晰地看到反射物体：对于每一条入射光
    ![Images](img/larr.jpg)，都有一条反射光 ![Images](img/rarr.jpg)。但并不是每个物体都是完全抛光的；虽然*大部分*的光反射到
    ![Images](img/rarr.jpg) 的方向，但*部分*光反射到接近 ![Images](img/rarr.jpg)的方向。越接近 ![Images](img/rarr.jpg)，在该方向反射的光就越多，如你在图
    3-10 中所示。物体的“光泽”决定了反射光随你远离 ![Images](img/rarr.jpg) 而减少的快慢。


    ![image](img/03fig10.jpg)


    *图 3-10：对于并非完全抛光的表面，方向越接近 ![Images](img/rarr1.jpg)，在该方向反射的光线越多。*


    我们想要确定有多少来自 ![Images](img/larr.jpg) 的光反射回我们视角的方向。如果 ![Images](img/varr.jpg) 是从
    `P` 指向相机的“观察向量”，而 `α` 是 ![Images](img/rarr.jpg) 和 ![Images](img/varr.jpg) 之间的角，我们得到了图
    3-11。


    ![image](img/03fig11.jpg)


    *图 3-11：镜面反射计算涉及的向量和角度*


    当 `α` = 0° 时，所有的光都反射到 ![Images](img/varr.jpg) 方向。当 `α` = 90° 时，没有光反射。就像漫反射一样，我们需要数学表达式来确定
    `α` 取中间值的情况。


    ## 建模镜面反射


    在本章开始，我提到过某些模型并不是基于物理模型的。这就是其中之一。以下模型是任意的，但使用它是因为它很容易计算且效果良好。


    考虑 `cos(α)`。它具有良好的属性，即 `cos(0)` = 1 且 `cos(±90)` = 0，正符合我们需要的；而且数值从 0 到 90 以非常优优的曲线逐渐减小（图
    3-12）。


    ![image](img/03fig12.jpg)


    *图 3-12：`cos(α)` 的图。*


    这意味着 `cos(α)` 符合我们对镜面反射函数的所有要求，那么为什么不使用它呢？


    还有一个细节。如果我们直接使用这个公式，每个物体的光泽都会完全一样。我们该如何调整方程来表示不同程度的光泽呢？


    记住，光泽是衡量反射随 `α` 增加而减少的快慢。获得光泽的一种简单方法是计算 `cos(α)` 的 `s` 次方。由于 0 ≤ `cos(α)` ≤ 1，我们保证
    0 ≤ `cos(α)^s` ≤ 1。`s` 的值越大，函数变得越“窄”，物体也就越亮。


