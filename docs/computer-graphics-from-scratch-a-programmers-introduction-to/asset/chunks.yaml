- fmt: "\nIn the previous chapter, we only looked at the very local interactions between\
    \ a light source and a surface, while ignoring everything else happening in the\
    \ scene. For shadows to happen, we need to take a more global view and consider\
    \ the interaction between a light source, a surface we want to draw, and other\
    \ objects present in the scene.\n\nConceptually, what we’re trying to do is relatively\
    \ simple. We want to add a little bit of logic that says “if there’s an object\
    \ between the point and the light, don’t add the illumination coming from this\
    \ light.”\n\nThe two cases we want to distinguish are shown in [Figure 4-1](#ch04.xhtml_ch4fig1).\n\
    \n![image](Images/04fig01.jpg)\n\n*Figure 4-1: A shadow is cast over a point whenever\
    \ there’s an object between the light source and that point.*\n\nIt turns out\
    \ we already have all of the tools we need to do this. Let’s start with a directional\
    \ light. We know `P`; that’s the point we’re interested in. We know `![Images](Images/larr.jpg)`;\
    \ that’s part of the definition of the light. Knowing `P` and `![Images](Images/larr.jpg)`,\
    \ we can define a ray, namely `![Images](Images/e0052-01.jpg)`, that goes from\
    \ the point on the surface to the infinitely distant light source. Does this ray\
    \ intersect any other object? If it doesn’t, there’s nothing between the point\
    \ and the light, so we compute the illumination from this light as before. If\
    \ it does, the point is in shadow, so we ignore the illumination from this light.\n\
    \nWe already know how to compute the closest intersection between a ray and a\
    \ sphere: the `TraceRay` function we’re using to trace the rays from the camera.\
    \ We can reuse most of it to compute the closest intersection between the ray\
    \ of light and the rest of the scene.\n\nThe parameters for this function are\
    \ slightly different, though:\n\n- Instead of starting from the camera, the ray\
    \ starts from `P`.\n- The direction of the ray is not (`V` – `O`) but `![Images](Images/larr.jpg)`.\n\
    - We don’t want objects *behind* `P` to cast shadows over it, so we need `t[min]\
    \ = 0`.\n- Since we’re dealing with directional lights, which are infinitely far\
    \ away, a very distant object should still cast a shadow over `P`, so `t[max]\
    \ = +∞`.\n\n[Figure 4-2](#ch04.xhtml_ch4fig2) shows two points, `P[0]` and `P[1]`.\
    \ When tracing a ray from `P[0]` in the direction of the light, we find no intersections\
    \ with any objects; this means the light can reach `P[0]`, so there’s no shadow\
    \ over it. In the case of `P[1]`, we find two intersections between the ray and\
    \ the sphere, with `t > 0` (meaning the intersection is between the surface and\
    \ the light); therefore, the point is in shadow.\n\n![image](Images/04fig02.jpg)\n\
    \n*Figure 4-2: The sphere casts a shadow over P[1], but not over P[0].*\n\nWe\
    \ can treat point lights in a very similar way, with two exceptions. First, `![Images](Images/larr.jpg)`\
    \ is not constant, but we already know how to compute it from `P` and the position\
    \ of the light. Second, we don’t want objects farther away from the light to be\
    \ able to cast a shadow over `P`, so in this case we need `t[max] = 1`.\n\n[Figure\
    \ 4-3](#ch04.xhtml_ch4fig3) shows these situations. When we cast a ray from `P[0]`\
    \ with direction `L[0]`, we find intersections with the small sphere; however,\
    \ these have `t > 1`, meaning they are not between the light and `P[0]`. Therefore\
    \ `P[0]` is not in shadow. On the other hand, the ray from `P[1]` with direction\
    \ `L[1]` intersects the big sphere with `0 < t < 1`, so the sphere casts a shadow\
    \ over `P[1]`.\n\nThere’s a literal case we need to consider. Consider the ray\
    \ `![Images](Images/e0053-01)`. If we look for intersections starting from `t[min]\
    \ = 0`, we’ll find one at `P`! We know `P` is on a sphere, so for `t = 0`, `![Images](Images/e0053-02)`;\
    \ in other words, every point would be casting a shadow over itself!\n\n![image](Images/04fig03.jpg)\n\
    \n*Figure 4-3: We use the value of t at the intersections to determine whether\
    \ they cast a shadow over the point.*\n\nThe simplest workaround is to set `t[min]`\
    \ to a small value `ϵ` instead of 0. Geometrically, we’re saying we want the ray\
    \ to start a tiny bit off the surface where `P` is, rather than exactly at `P`.\
    \ So the range will be `[ϵ, ∞]` for directional lights and `[ϵ, 1]` for point\
    \ lights.\n\nIt might be tempting to fix this by not computing intersections between\
    \ the ray and the sphere `P` belongs to. This would work for spheres, but it would\
    \ fail for objects with complex shapes. For example, when you use your hand to\
    \ protect your eyes from the Sun, your hand is casting a shadow over your face,\
    \ and both surfaces are part of the same object - your body.\n\n### Rendering\
    \ with Shadows\n\nLet’s turn the above discussion into pseudocode. In its previous\
    \ version, `TraceRay` computes the closest ray-sphere intersection, and then computes\
    \ lighting on the intersection. We need to extract the closest intersection code,\
    \ since we want to reuse it to compute shadows.\n\n```\nClosestIntersection(O,\
    \ D, t_min, t_max) {\n  closest_t = inf\n  closest_sphere = NULL\n  for sphere\
    \ in scene.Spheres {\n    t1, t2 = IntersectRaySphere(O, D, sphere)\n    if t1\
    \ in [t_min, t_max] and t1 < closest_t {\n      closest_t = t1\n      closest_sphere\
    \ = sphere\n    }\n    if t2 in [t_min, t_max] and t2 < closest_t {\n      closest_t\
    \ = t2\n      closest_sphere = sphere\n    }\n  }\n  return closest_sphere, closest_t\n\
    }\n```\n*Listing 4-1: Computing the closest intersection*\n\nWe can rewrite `TraceRay`\
    \ to reuse that function, and the resulting version is much simpler.\n\n```javascript\n\
    TraceRay(O, D, t_min, t_max) {\n  closest_sphere, closest_t = ClosestIntersection(O,\
    \ D, t_min, t_max)\n  if (closest_sphere == NULL) {\n    return BACKGROUND_COLOR\n\
    \  }\n  P = O + closest_t * D\n  N = P - closest_sphere.center\n  N = N / length(N)\n\
    \  return closest_sphere.color * ComputeLighting(P, N, -D, closest_sphere.specular)\n\
    }\n```\n*Listing 4-2: A simpler version of TraceRay after factoring out ClosestIntersection*\n\
    \nThen, we need to add the shadow check ❶ to `ComputeLighting`.\n\n```javascript\n\
    ComputeLighting(P, N, V, s) {\n  i = 0.0\n  for light in scene.Lights {\n    if\
    \ (light.type == ambient) {\n      i += light.intensity\n    } else {\n      if\
    \ (light.type == point) {\n        L = light.position - P\n        t_max = 1\n\
    \      } else {\n        L = light.direction\n        t_max = inf\n      }\n \
    \     // Shadow check\n      shadow_sphere, shadow_t = ClosestIntersection(P,\
    \ L, 0.001, t_max)\n      if (shadow_sphere != NULL) {\n        continue\n   \
    \   }\n      // Diffuse\n      n_dot_l = dot(N, L)\n      if (n_dot_l > 0) {\n\
    \        i += light.intensity * n_dot_l / (length(N) * length(L))\n      }\n \
    \     // Specular\n      if (s != -1) {\n        R = 2 * N * dot(N, L) - L\n \
    \       r_dot_v = dot(R, V)\n        if (r_dot_v > 0) {\n          i += light.intensity\
    \ * pow(r_dot_v / (length(R) * length(V)), s)\n        }\n      }\n    }\n  }\n\
    \  return i\n}\n```\n*Listing 4-3: ComputeLighting with shadow support*\n\n[Figure\
    \ 4-4](#ch04.xhtml_ch4fig4) shows what the freshly rendered scene looks like.\n\
    \n![image](Images/04fig04.jpg)\n\n*Figure 4-4: A raytraced scene, now with shadows*\n\
    \nYou can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/shadows-demo](https://gabrielgambetta.com/cgfs/shadows-demo)*.\
    \ In this demo, you can choose whether to trace rays from *t* = 0 or from *t*\
    \ = *ϵ* to get a clearer picture of the difference it makes.\n"
  raw: 'In the previous chapter, we only looked at the very local interactions between
    a light source and a surface, while ignoring everything else happening in the
    scene. For shadows to happen, we need to take a more global view and consider
    the interaction between a light source, a surface we want to draw, and other objects
    present in the scene.


    Conceptually, what we’re trying to do is relatively simple. We want to add a little
    bit of logic that says “if there’s an object between the point and the light,
    don’t add the illumination coming from this light.”


    The two cases we want to distinguish are shown in [Figure 4-1](#ch04.xhtml_ch4fig1).


    ![image](Images/04fig01.jpg)


    *Figure 4-1: A shadow is cast over a point whenever there’s an object between
    the light source and that point.*


    It turns out we already have all of the tools we need to do this. Let’s start
    with a directional light. We know *P*; that’s the point we’re interested in. We
    know ![Images](Images/larr.jpg); that’s part of the definition of the light. Knowing
    *P* and ![Images](Images/larr.jpg), we can define a ray, namely ![Images](Images/e0052-01.jpg),
    that goes from the point on the surface to the infinitely distant light source.
    Does this ray intersect any other object? If it doesn’t, there’s nothing between
    the point and the light, so we compute the illumination from this light as before.
    If it does, the point is in shadow, so we ignore the illumination from this light.


    We already know how to compute the closest intersection between a ray and a sphere:
    the TraceRay function we’re using to trace the rays from the camera. We can reuse
    most of it to compute the closest intersection between the ray of light and the
    rest of the scene.


    The parameters for this function are slightly different, though:


    *   Instead of starting from the camera, the ray starts from *P*.


    *   The direction of the ray is not (*V* *–* *O*) but ![Images](Images/larr.jpg).


    *   We don’t want objects *behind* *P* to cast shadows over it, so we need *t*[*min*]
    = 0.


    *   Since we’re dealing with directional lights, which are infinitely far away,
    a very distant object should still cast a shadow over *P*, so *t*[*max*] = +*∞*.


    [Figure 4-2](#ch04.xhtml_ch4fig2) shows two points, *P*[0] and *P*[1]. When tracing
    a ray from *P*[0] in the direction of the light, we find no intersections with
    any objects; this means the light can reach *P*[0], so there’s no shadow over
    it. In the case of *P*[1], we find two intersections between the ray and the sphere,
    with *t* > 0 (meaning the intersection is between the surface and the light);
    therefore, the point is in shadow.


    ![image](Images/04fig02.jpg)


    *Figure 4-2: The sphere casts a shadow over* P[1], *but not over* P[0].


    We can treat point lights in a very similar way, with two exceptions. First, ![Images](Images/larr.jpg)
    is not constant, but we already know how to compute it from *P* and the position
    of the light. Second, we don’t want objects farther away from the light to be
    able to cast a shadow over *P*, so in this case we need *t*[*max*] = 1 so that
    the ray “stops” at the light.


    [Figure 4-3](#ch04.xhtml_ch4fig3) shows these situations. When we cast a ray from
    *P*[0] with direction *L*[0], we find intersections with the small sphere; however,
    these have *t* > 1, meaning they are not between the light and *P*[0], so we ignore
    them. Therefore *P*[0] is not in shadow. On the other hand, the ray from *P*[1]
    with direction *L*[1] intersects the big sphere with 0 < *t* < 1, so the sphere
    casts a shadow over *P*[1].


    There’s a literal edge case we need to consider. Consider the ray ![Images](Images/e0053-01.jpg).
    If we look for intersections starting from *t*[*min*] = 0, we’ll find one at *P*
    itself! We know *P* is on a sphere, so for *t* = 0, ![Images](Images/e0053-02.jpg)
    ; in other words, every point would be casting a shadow over itself!


    ![image](Images/04fig03.jpg)


    *Figure 4-3: We use the value of *t* at the intersections to determine whether
    they cast a shadow over the point.*


    The simplest workaround is to set *t*[*min*] to a very small value *ϵ* instead
    of 0\. Geometrically, we’re saying we want the ray to start just a tiny bit off
    the surface where *P* is, rather than exactly at *P*. So the range will be [*ϵ*,
    +*∞*] for directional lights and [*ϵ*,1] for point lights.


    It might be tempting to fix this by just not computing intersections between the
    ray and the sphere *P* belongs to. This would work for spheres, but it would fail
    for objects with more complex shapes. For example, when you use your hand to protect
    your eyes from the Sun, your hand is casting a shadow over your face, and both
    surfaces are part of the same object - your body.


    #### Rendering with Shadows


    Let’s turn the above discussion into pseudocode.


    In its previous version, TraceRay computes the closest ray-sphere intersection,
    and then computes lighting on the intersection. We need to extract the closest
    intersection code, since we want to reuse it to compute shadows ([Listing 4-1](#ch04.xhtml_ch4lis1)).


    ClosestIntersection(O, D, t_min, t_max) {


        closest_t = inf


        closest_sphere = NULL


        for sphere in scene.Spheres {


            t1, t2 = IntersectRaySphere(O, D, sphere)


            if t1 in [t_min, t_max] and t1 < closest_t {


                closest_t = t1


                closest_sphere = sphere


            }


            if t2 in [t_min, t_max] and t2 < closest_t {


                closest_t = t2


                closest_sphere = sphere


            }


        }


        return closest_sphere, closest_t


    }


    *Listing 4-1: Computing the closest intersection*


    We can rewrite TraceRay to reuse that function, and the resulting version is much
    simpler ([Listing 4-2](#ch04.xhtml_ch4lis2)).


    TraceRay(O, D, t_min, t_max) {


        closest_sphere, closest_t = ClosestIntersection(O, D, t_min, t_max)


        if closest_sphere == NULL {


            return BACKGROUND_COLOR


        }


        P = O + closest_t * D


        N = P - closest_sphere.center


        N = N / length(N)


        return closest_sphere.color * ComputeLighting(P, N, -D, closest_sphere.specular)


    }  


    *Listing 4-2: A simpler version of TraceRay after factoring out ClosestIntersection*


    Then, we need to add the shadow check ❶ to ComputeLighting ([Listing 4-3](#ch04.xhtml_ch4lis3)).


    ComputeLighting(P, N, V, s) {


        i = 0.0


        for light in scene.Lights {


            if light.type == ambient {


                i += light.intensity


            } else {


                if light.type == point {


                    L = light.position - P


                    t_max = 1


                } else {


                    L = light.direction


                    t_max = inf


                }


                // Shadow check


             ❶ shadow_sphere, shadow_t = ClosestIntersection(P, L, 0.001, t_max)


                if shadow_sphere != NULL {


                    continue


                }


                // Diffuse


                n_dot_l = dot(N, L)


                if n_dot_l > 0 {


                    i += light.intensity * n_dot_l / (length(N) * length(L))


                }


                // Specular


                if s != -1 {


                    R = 2 * N * dot(N, L) - L


                    r_dot_v = dot(R, V)


                    if r_dot_v > 0 {


                        i += light.intensity * pow(r_dot_v / (length(R) * length(V)),
    s)


                    }


                }


            }


        }


        return i


    }


    *Listing 4-3: *ComputeLighting* with shadow support*


    [Figure 4-4](#ch04.xhtml_ch4fig4) shows what the freshly rendered scene looks
    like.


    ![image](Images/04fig04.jpg)


    *Figure 4-4: A raytraced scene, now with shadows*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/shadows-demo](https://gabrielgambetta.com/cgfs/shadows-demo)*.
    In this demo, you can choose whether to trace rays from *t* = 0 or from *t* =
    *ϵ* to get a clearer picture of the difference it makes.'
