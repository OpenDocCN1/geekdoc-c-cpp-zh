    This suggests another way to compute the length of a vector, as the square root
    of its dot product with itself:


    ![image](Images/f0209-09.jpg)


    ##### Cross Product


    The cross product between two vectors gives you another vector. It’s expressed
    using the cross operator, as in ![Images](Images/f0209-10.jpg)


    The cross product of two vectors is a vector perpendicular to both of them. In
    this book we only use the cross product on 3D vectors, shown in [Figure A-7](#appendix.xhtml_app01fig7).


    ![image](Images/Afig07.jpg)


    *Figure A-7: The cross product of two vectors is a vector perpendicular to both
    of them.*


    The computation is a bit more involved than the dot product. If ![Images](Images/f0041-01.jpg)
    = ![Images](Images/f0170-06.jpg) × ![Images](Images/f0209-05.jpg), then


    *R[x]* = *V[y]* ⋅ *W[z]* *–* *V[z]* ⋅ *W[y]*


    *R[y]* = *V[x]* ⋅ *W[z]* *–* *V[z]* ⋅ *W[x]*


    *R[z]* = *V[x]* ⋅ *W[y]* *–* *V[y]* ⋅ *W[x]*


    The cross product is not commutative. Specifically, ![Images](Images/f0210-01.jpg).


    We use the cross product to compute the *normal vector* of a surface—that is,
    a unit vector perpendicular to the surface. To do this, we take two vectors on
    the surface, calculate their cross product, and normalize the result.


    ### Matrices


    A *matrix* is a rectangular array of numbers. For the purposes of this book, matrices
    represent *transformations* that can be applied to points or vectors, and we refer
    to them with a capital letter, such as *M*. This is the same way we refer to points,
    but it will be clear by the context whether we’re talking about a matrix or a
    point.


    A matrix is characterized by its size in terms of columns and rows. For example,
    this is a 4 × 3 matrix:


    ![image](Images/f0210-02.jpg)


    ### Matrix Operations


    Let’s see what we can do with matrices and vectors.


    #### Adding Matrices


    You can add two matrices, as long as they have the same size. The addition is
    done element by element:


    ![image](Images/f0211-01.jpg)


    #### Multiplying a Matrix by a Number


    You can multiply a matrix by a number. You just multiply every element of the
    matrix by the number:


    ![image](Images/f0211-02.jpg)


    #### Multiplying Matrices


    You can multiply two matrices together, as long as their sizes are compatible:
    the number of columns in the first matrix must be the same as the number of rows
    in the second matrix. For example, you can multiply a 2 × 3 matrix by a 3 × 4
    matrix, but not the other way around! Unlike numbers, the order of the multiplication
    matters, even if you’re multiplying together two square matrices that could be
    multiplied in either order.


    The result of multiplying two matrices together is another matrix, with the same
    number of rows as the left-hand side matrix, and the same number of columns as
    the right-hand side matrix. Continuing with our example above, the result of multiplying
    a 2 × 3 matrix by a 3 × 4 matrix is a 2 × 4 matrix.


    Let’s see how to multiply two matrices, A and B:


    ![image](Images/f0211-03.jpg)


    To make things more clear, let’s group the values in A and B into vectors: let’s
    write A as a column of row (horizontal) vectors and B as a row of column (vertical)
    vectors. For example, the first row of A is the vector (*a*, *b*, *c*) and the
    second column of B is the vector (*h*, *l*, *p*):


    ![image](Images/f0211-04.jpg)![image](Images/f0212-01.jpg)


    Let’s give names to these vectors:


    ![image](Images/f0212-02.jpg)


    We know that A is 2 × 3, and B is 3 × 4, so we know the result will be a 2 × 4
    matrix:


    ![image](Images/f0212-03.jpg)


    Now we can use a simple formulation for the elements of the resulting matrix:
    the value of the element in row *r* and column *c* of the result—that is, *c*[*rc*]—is
    the dot product of the corresponding row vector in **A** and column vector in
    **B**, that is, ![Images](Images/f0212-04.jpg) and ![Images](Images/f0212-05.jpg):


    ![image](Images/f0212-06.jpg)


    For example ![Images](Images/f0212-07.jpg), which expands to *a* ⋅ *h* + *b* ⋅
    *l* + *c* ⋅ *p*.


    #### Multiplying a Matrix and a Vector


    You can think of an *n*-dimensional vector as either an *n* × 1 vertical matrix
    or as a 1 × *n* horizontal matrix, and multiply the same way you would multiply
    any two compatible matrices. For example, here’s how to multiply a 2 × 3 matrix
    and a 3D vector:


    ![image](Images/f0212-08.jpg)


    Since the result of multiplying a matrix and a vector (or a vector and a matrix)
    is also a vector and, in our case, matrices represent transformations, we can
    say that the matrix *transforms* the vector.


