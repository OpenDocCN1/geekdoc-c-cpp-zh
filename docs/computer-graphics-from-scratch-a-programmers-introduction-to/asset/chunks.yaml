    ![image](Images/common.jpg)


    Computer graphics is a fascinating topic. How do you go from a few algorithms
    and some geometric data to the special effects for movies like Star Wars and The
    Avengers, animated movies like Toy Story and Frozen, or the graphics of popular
    video games like Fortnite or Call of Duty?


    Computer graphics is also a frighteningly broad topic: from rendering 3D scenes
