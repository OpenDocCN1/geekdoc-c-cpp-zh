- fmt: '

    Repeating this process for every light, we end up with a set of images corresponding
    to the scene illuminated by each of the lights, with shadows correctly taken into
    account. The final step is to compose all the images into a final render of the
    scene by adding them together pixel by pixel.


    The idea of using the stencil buffer to render shadows dates back to the early
    1990s, but the first implementations had several drawbacks. The depth-fail variant
    described here was independently discovered several times during 1999 and 2000,
    most notably by John Carmack while working on `Doom 3`, which is why this variant
    is also known as `Carmack’s Reverse`.


    ## Shadow Mapping


    The other well-known technique to render shadows in a rasterizer is called `shadow
    mapping`. This renders shadows with less defined edges (imagine the shadows cast
    by objects on a cloudy day). These are often called `soft shadows`.


    To reiterate, the question we’re trying to answer is, given a point on a surface
    and a light, does the point receive illumination from that light? This is equivalent
    to determining whether there’s an object between the light and the point.


    With the raytracer, we traced a ray from the point to the light. In some sense,
    we’re asking whether the point can “see” the light, or, equivalently, whether
    the light can “see” the point.


    This leads us to the core idea of shadow mapping. We render the scene from the
    point of view of the light, preserving the depth buffer. Similar to how we created
    the environment maps we described above, we render the scene six times and end
    up with six depth buffers. These depth buffers, which we call `shadow maps`, let
    us determine the distance to the closest surface the light can “see” in any given
    direction.


    The situation is slightly more complicated for directional lights, because these
    have no position to render from. Instead, we need to render the scene from a `direction`.
    This requires using an `orthographic projection` instead of our usual perspective
    projection. With perspective projection and point lights, every ray starts from
    a point; with orthographic projection and directional lights, every ray is parallel
    to each other, sharing the same direction.


    When we want to determine whether a point is in shadow or not, we compute the
    distance and the direction from the light to the point. We use the direction to
    look up the corresponding entry in the shadow map. If this depth value is smaller
    than the distance from the point to the light, it means there’s a surface that
    is closer to the light than the point we’re illuminating, and therefore the point
    is in the shadow of that surface; otherwise, the light can “see” the point unobstructed,
    so the point is illuminated by the light.


    Note that the shadow maps have a limited resolution, usually lower than the canvas.
    Depending on the distance and the relative orientation of the point and the light,
    this might cause the shadows to look blocky. To avoid this, we can sample the
    depth of the surrounding depth entries as well and determine whether the point
    lies on the edge of a shadow (as evidenced by a depth discontinuity in the surrounding
    entries). If this is the case, we can use a technique similar to bilinear filtering,
    as we did in [Chapter 14](#ch14.xhtml_ch14), to come up with a value between `0.0`
    and `1.0` representing `how much` the point is visible from the light and multiply
    it by the illumination of the light; this gives the shadows created by shadow
    mapping their characteristic blurry appearance. Other ways to avoid the blocky
    appearance involve sampling the shadow map in different ways—for example, look
    into `percentage closer filtering`.


    ## Summary


    Like in [Chapter 5](#ch05.xhtml_ch05), this chapter briefly introduced several
    ideas you can explore by yourself. These extend the rasterizer developed over
    the previous chapters to bring its features closer to those of the raytracer,
    while retaining its speed advantage. There’s always a trade-off, and in this case
    it comes in the form of less accurate results or increased memory consumption,
    depending on the algorithm.


    ## AFTERWORD


    ![image](Images/common.jpg)


    Congratulations! You now have a good understanding of how 3D rendering works.
    You’ve created a raytracer and a rasterizer and gained a good conceptual understanding
    of the algorithms and math that power them.


    However, as I explained in the introduction, it’s impossible to cover the entirety
    of 3D rendering in a single book. Here’s a few topics you might want to explore
    on your own to expand your horizons:


    - **Global illumination, including radiosity and path tracing**: Find out how
    deep the “ambient light” rabbit hole goes!

    - **Physically based rendering**: Illumination and shading models that don’t just
    look good, but model real-life physics.

    - **Voxel rendering**: Think Minecraft, or MRI scans in hospitals.

    - **Level-of-detail algorithms**: This includes offline and dynamic mesh simplification,
    impostors, and billboards. These algorithms are how we efficiently render forests
    with billions of plants, crowds of millions of people, or extremely detailed 3D
    models.

    - **Acceleration structures**: This includes binary space partition trees, k-d
    trees, quadtrees, and octrees. These structures help efficiently render massive
    scenes, such as an entire city.

    - **Terrain rendering**: How to efficiently render a terrain model that might
    be as big as a country yet have human-scale detail.

    - **Atmospheric effects and particle systems**: Fog, rain, and smoke, but also
    some less intuitive materials like grass and hair.

    - **Image-based lighting**: Similar to environment mapping, but for diffuse lighting.

    - **High dynamic range, gamma correction**: The color representation rabbit hole
    also goes deep.

    - **Caustics**: Also known as “the moving white patterns at the bottom of the
    swimming pool.”

    - **Procedural generation of textures and models**: Add more variety and possibly
    infinitely big scenes.

    - **Hardware acceleration**: Using OpenGL, Vulkan, DirectX, and others to run
    graphics algorithms on GPUs.


    Of course, there are many other topics, and that’s just 3D rendering! Computer
    graphics is an even broader subject. Here are some areas you might want to investigate:


    - **Font rendering**: This is surprisingly more complex than you might think.

    - **Image compression**: How to store images in the least amount of space.

    - **Image processing (such as transforming and filtering)**: Think Instagram filters.

    - **Image recognition**: Is that a dog or a cat?

    - **Curve rendering, including Bezier curves and splines**: Find out what these
    weird arrows on the curves of your favorite drawing program really are!

    - **Computational photography**: How does the camera on your phone take such good
    pictures with almost no light?

    - **Image segmentation**: Before you can “blur the background” of your video call,
    you need to determine which pixels are background and which aren’t.


    Congratulations again on taking your first step into the world of computer graphics.
    Now you get to choose where to go next!


    ## LINEAR ALGEBRA


    ![image](Images/common.jpg)


    This appendix serves as a cheat sheet for linear algebra. The subject is presented
    as a set of tools, their properties, and what you can use them for. If you’re
    interested in the theory behind all this, you can pick up any introductory linear
    algebra textbook.


    The focus here is exclusively on 2D and 3D algebra, as that’s what’s required
    in this book.


    ### Points


    A *point* represents a position within a coordinate system.


    We represent a point as a sequence of numbers between parentheses—for example,
    `(4, 3)`. We refer to points using capital letters, such as `P` or `Q`.


    Each of the numbers in the point’s sequence is called a `coordinate`. The number
    of coordinates is the point’s `dimension`. A point with two coordinates is called
    two-dimensional, or `2D`.

