  trans: '


    对每种光重复此过程，我们最终得到一组图像，分别对应每种光照亮的场景，并正确地考虑了阴影。最后一步是通过逐像素相加，将所有图像合成成场景的最终渲染图。


    使用模板缓冲区（stencil buffer）渲染阴影的想法追溯到 20 世纪 90 年代初，但期的实现存在几个缺点。这里描述的深度失败（depth-fail）变体在
    1999 年和 2000 年间被独立发现了几次，最著名的是 John Carmack 在开发 `Doom 3` 期间发现，这也是为什么这种变体也被称为 `Carmack’s
    Reverse`。


    ## Shadow Mapping


    光栅化器中渲染阴影的另一种常用技术被称为 `shadow mapping`（阴影映射）。它渲染出的阴影边缘不够清晰（想象阴天时物体投下的阴影）。这些通常被称为
    `soft shadows`。


    重申，我们试图回答的问题是：给定表面上的一个点和一种光，该点是否接收了该光的照明？这等同于判断光和点之间是否存在物体。


    在光线追踪器中，我们从点向光发射了一条光线。在某种意义上，我们是在询问该点是否能“看到”光，或者等价于光是否能“看到”该点。


    这引导我们进入阴影映射的核心思想。我们从光的视角渲染场景，保留深度缓冲区（depth buffer）。类似于我们上面描述的创建环境映射的方法，我们渲染六次场景并得到六个深度缓冲区。这些深度缓冲区被称为
    `shadow maps`（阴影映射），让我们能够确定任何给定方向上光“看到”的最近表面的距离。


    对于平行光（directional lights），情况稍微复杂一些，因为它们没有渲染的位置。相反，我们需要从一个 `direction`（方向）渲染场景。这需要使用
    `orthographic projection`（正交投影）而不是常用的透视投影。使用透视投影和点光源，每条光线都从一个点开始；使用正交投影和平行光，每条光线都是平行的，共享相同的方向。


    当我们想要确定一个点是否处于阴影中时，我们计算从光到点的距离和方向。我们使用该方向在阴影映射中查找对应的条目。如果这个深度值小于点到光的距离，说明在我们要照明的点之外有一个距离光更近的表面，因此该点处于该表面的阴影中；否则，光可以无阻地“看到”该点，因此该点被光照明。


    注意，阴影映射的分辨率有限，通常低于画布。根据点和光的距离以及相对方向，这可能会导致阴影看起来是块状的。为了避免这种情况，我们可以对周围的深度条目进行采样，并判断点是否位于阴影边缘（通过周围条目中的深度不连续来证明）。如果是这种情况，我们可以使用类似于双线性过滤的技巧（正如我们在第
    14 章中做的那样），得到一个 `0.0` 到 `1.0` 之间的值，代表该点从光方向可见的程度，并将其乘以光的照明强度；这使得阴影映射创建的阴影具有特征性的模糊外观。避免块状外观的其他方法涉及以不同的方式对阴影映射进行采样——例如研究
    `percentage closer filtering`（比例深度过滤）。


    ## Summary


    就像在第 5 章中一样，本章简要介绍了几个你可以自己探索的想法。这些思想扩展了在前章节中开发的光栅化器，使其功能更接近光线追踪器，同时保留了它的速度优势。权衡是永远存在的，在这种情况下，取决于算法，它表现为结果准确性的降低或内存消耗的增加。


    ## AFTERWORD


    ![image](img/common.jpg)


    恭喜！你现在对 3D 渲染是如何工作的有有了良好的理解。你创建了一个光线追踪器和一个光栅化器，并对驱动它们的算法和数学有了良好的概念性理解。


    然而，正如我在引言中解释的，不可能在一本书中涵盖 3D 渲染的所有内容。这里是一些你可能想自己探索以开阔视野的主题：


    - **全局光照，包括辐射光照度（radiosity）和路径追踪（path tracing）**：去发现“环境光”的深渊到底有多深！

    - **基于物理的渲染 (Physically based rendering)**：照明和阴影模型不仅看起来好看，而且模拟了真实的物理世界。

    - **体素渲染 (Voxel rendering)**：想想 Minecraft 或医院的 MRI 扫描。

    - **细节水平算法 (Level-of-detail algorithms)**：这包括离线和动态网格简化、冒充者（impostors）和广告板（billboards）。这些算法使我们能够高效渲染拥有数十亿植物的森林、数百万的人群或极其详细的
    3D 模型。

    - **加速结构 (Acceleration structures)**：包括二叉空间划分树、k-d 树、四叉树和八叉树。这些结构有助于高效渲染巨大的场景，例如整个城市。

    - **地形渲染 (Terrain rendering)**：如何高效地渲染可能像国家一样大但具有人类尺度细节的地形模型。

    - **大气效应和粒子系统**：雾、雨、烟，以及一些不那么直观的材质，如草地和头发。

    - **基于图像的照明 (Image-based lighting)**：类似于环境映射，但用于漫反射照明。

    - **高动态范围 (HDR)、伽马校正 (gamma correction)**：颜色表示的深渊也很深。

    - **焦散光 (Caustics)**：也被称为“泳池底部移动的白色图案”。

    - **纹理和模型的程序化生成 (Procedural generation)**：增加更多多样性，可能可能是无限的场景。

    - **硬件加速**：使用 OpenGL、Vulkan、DirectX 等在 GPU 上运行图形算法。


    当然，还有许多主题，而这只是 3D 渲染！计算机图形是一个更广泛的主题。这里是你可能感兴趣的领域：


    - **字体渲染**：这比你想的要复杂。

    - **图像压缩**：用最少的空间存储图像。

    - **图像处理（如变换和滤波）**：想想 Instagram 滤镜。

    - **图像识别**：那是狗还是猫？

    - **曲线渲染（包括贝曲线和样条）**：去发现你喜欢的绘画程序中那些奇怪的箭头到底是什么！

    - **计算摄影学**：手机相机如何在几乎没有光线的情况下拍出这么好的照片？

    - **图像分割**：在视频通话“模糊背景”之前，你需要确定哪些像素是背景，哪些不是。


    再次恭喜你迈出了进入图形世界的第一步。现在你可以决定下一步去哪里了！


