- fmt: '

    More generally, if you want to compute the intersection between a ray and the
    object ![Images](Images/adotb.jpg) (where ![Images](Images/dot.jpg) is any set
    operation), you first compute the intersection between the ray and `A` and `B`
    separately, which gives you the ranges of `t` that are “inside” for each object,
    `R`[`A`]` and `R`[`B`]`. Then you compute ![Images](Images/e0072-01.jpg), which
    is the “inside” range for ![Images](Images/adotb.jpg). Once you have this, the
    closest intersection between the ray and ![Images](Images/adotb.jpg) is the smallest
    value of `t` that is both in the “inside” range of the object, and between `t`[`min`]`
    and `t`[`max`]`. [Figure 5-4](#ch05.xhtml_ch5fig4) shows the inside range for
    the union, intersection, and subtraction of two spheres.


    ![image](Images/05fig04.jpg)


    *Figure 5-4: Union, intersection, and subtraction of two spheres*


    The normal at the intersection is either the normal of the object that produced
    the intersection or its opposite, depending on whether you’re looking at the “outside”
    or “inside” of the original object.


    Of course, `A` and `B` don’t have to be primitives; they can be the result of
    set operations themselves! If you implement this cleanly, you don’t even need
    to know *what* `A` and `B` are, as long as you can get intersections and normals
    out of them. This way you can take three spheres and compute, for example, (`A`
    ∪ `B`) ∩ `C`.


    ## Transparency


    So far we have rendered every object as if it were fully opaque, but this doesn’t
    need to be the case. We can render partially transparent objects, like a fishbowl.


    Implementing this is quite similar to implementing reflection. When a ray hits
    a partially transparent surface, you compute the local and reflected color as
    before, but you also compute an additional color—the color of the light coming
    *through* the object, obtained with another call to `TraceRay`. Then you blend
    this color with the local and reflected colors, depending on how transparent the
    object is, much in the same way we did when computing object reflections.


    ## Refraction


    In real life, when a ray of light goes through a transparent object, it changes
    direction (this is why when you submerge a straw in a glass of water, it looks
    “broken”). More precisely, a ray of light changes direction when it’s going through
    a material (such as air) and enters a different material (such as water).


    The way the direction changes depends on a property of each material, called its
    *refraction index*, according to the following equation, called Snell’s Law:


    ![image](Images/e0074-01.jpg)


    Here, `α`[`1]` and `α`[`2]` are the angles between the ray and the normal before
    and after crossing the surface, and `n`[`1]` and `n`[`2]` are the refraction indices
    of the material outside and inside objects.


    For example, `n`[`air`]` is approximately `1.0`, and `n`[`water`]` is approximately
    `1.33`. So for a ray of light entering water at a 60° angle, we have


    ![image](Images/e0074-02.jpg)


    This example is shown in [Figure 5-5](#ch05.xhtml_ch5fig5).


    ![image](Images/05fig05.jpg)


    *Figure 5-5: A ray of light is refracted (changes direction) as it leaves air
    and enters water.*


    At the implementation level, each ray would have to carry an additional piece
    of information: the refraction index of the material it is currently going through.
    When the ray intersects a partially transparent object, you compute the new direction
    of the ray from that point, based on the refraction indices of the current material
    and the new material, and then proceed as before.


    Stop for a moment to consider this: if you implement constructive solid geometry
    and transparency, you can model a magnifying glass (the intersection of two spheres)
    that will behave like a physically correct magnifying glass!


    ## Supersampling


    *Supersampling* is more or less the opposite of subsampling. In this case you’re
    looking for accuracy instead of performance. Suppose the rays corresponding to
    two adjacent pixels hit different objects. You would paint each pixel with the
    corresponding colors.


    But remember the analogy that got us started: each ray is supposed to determine
    the “representative” color for each *square* of the “grid” we’re looking through.
    By using a single ray per pixel, we’re arbitrarily deciding that the color of
    the ray of light that goes through the middle of the square is representative
    of the whole square, but that may not be true.


    The way to solve this is just to trace more rays per pixel—4, 9, 16, as many as
    you want—and then average them to get the color for the pixel.


    Of course, this makes your raytracer 4, 9, or 16 times slower, for the exact same
    reasons why subsampling made it `N` times faster. Fortunately, there’s a middle
    ground. You can assume object properties change smoothly over their surface, so
    shooting four rays per pixel that hit the same object at very slightly different
    positions may not improve the scene much. So you can start with one ray per pixel
    and compare adjacent rays: if they hit different objects or if the color differs
    by more than a certain threshold, you apply pixel subdivision to both.


    ## Summary


    In this chapter, we have briefly introduced several ideas you can explore by yourself.
    These modify the basic raytracer we’ve developed in new ways—making it more efficient,
    able to represent complex objects, or modeling rays of light in a way that better
    approximates our physical world.

