    is reflected in a single direction, ![Images](Images/rarr.jpg). This is why you
    see reflected objects very clearly: for every incident ray of light ![Images](Images/larr.jpg),
    there’s a single reflected ray ![Images](Images/rarr.jpg). But not every object
    is perfectly polished; while *most* of the light is reflected in the direction
    of ![Images](Images/rarr.jpg), *some* of it is reflected in directions close to
    ![Images](Images/rarr.jpg). The closer to ![Images](Images/rarr.jpg), the more
    light is reflected in that direction, as you can see in [Figure 3-10](#ch03.xhtml_ch3fig10).
    The “shininess” of the object is what determines how rapidly the reflected light
    decreases as you move away from ![Images](Images/rarr.jpg).


    ![image](Images/03fig10.jpg)


    *Figure 3-10: For surfaces that aren’t perfectly polished, the closer a direction
    is to ![Images](Images/rarr1.jpg), the more rays of light are reflected in that
    direction.*


    We want to figure out how much light from ![Images](Images/larr.jpg) is reflected
    back in the direction of our point of view. If ![Images](Images/varr.jpg) is the
    “view vector” pointing from *P* to the camera, and *α* is the angle between ![Images](Images/rarr.jpg)
    and ![Images](Images/varr.jpg), we get [Figure 3-11](#ch03.xhtml_ch3fig11).


    ![image](Images/03fig11.jpg)


    *Figure 3-11: The vectors and angles involved in the specular reflection calculation*


    For *α* = 0^∘, all the light is reflected in the direction of ![Images](Images/varr.jpg).
    For *α* = 90^∘, no light is reflected. As with diffuse reflection, we need a mathematical
    expression to determine what happens for intermediate values of *α*.


    #### Modeling Specular Reflection


    At the beginning of this chapter, I mentioned that some models aren’t based on
    physical models. This is one of them. The following model is arbitrary, but it’s
    used because it’s easy to compute and it looks good.


    Consider cos(*α*). It has the nice properties that cos(0) = 1 and cos(±90) = 0,
    just like we need; and the values become gradually smaller from 0 to 90 in a very
    pleasant curve ([Figure 3-12](#ch03.xhtml_ch3fig12)).


    ![image](Images/03fig12.jpg)


    *Figure 3-12: The graph of cos(*α*).*


    This means cos(*α*) matches all of our requirements for the specular reflection
    function, so why not use it?


    There’s one more detail. If we used this formula straight away, every object would
    be equally shiny. How can we adapt the equation to represent varying degrees of
    shininess?


    Remember that shininess is a measure of how quickly the reflection function decreases
    as *α* increases. A simple way to obtain different shininess curves is to compute
    the power of cos(*α*) to some positive exponent *s*. Since 0 ≤ cos(*α*) ≤ 1, we
    are guaranteed that 0 ≤ cos(*α*)^(*s*) ≤ 1; so cos(*α*)^(*s*) is just like cos(*α*),
    only “narrower.” [Figure 3-13](#ch03.xhtml_ch3fig13) shows the graph for cos(*α*)^(*s*)
    for different values of *s*.


    ![image](Images/03fig13.jpg)


    *Figure 3-13: The graph of cos(*α*)^s*


    The bigger the value of *s*, the “narrower” the function becomes around 0 and
    the shinier the object looks. *s* is called the *specular exponent* and it’s a
    property of the surface. Since the model is not based on physical reality, the
    values of *s* can only be determined by trial and error—essentially, tweaking
    the values until they look “right.” For a physically based model, you can look
    into bi-directional reflectance functions (BDRFs).


    Let’s put all of this together. A ray of light hits a surface with specular exponent
    *s* at point *P*, where its normal is ![Images](Images/narr.jpg), from direction
    ![Images](Images/larr.jpg). How much light is reflected toward the viewing direction
    ![Images](Images/varr.jpg)?


    According to our model, this value is cos(*α*)^(*s*), where *α* is the angle between
    ![Images](Images/varr.jpg) and ![Images](Images/rarr.jpg); ![Images](Images/rarr.jpg)
    is in turn ![Images](Images/larr.jpg) reflected with respect to ![Images](Images/narr.jpg).
    So the first step is to compute ![Images](Images/rarr.jpg) from ![Images](Images/narr.jpg)
    and ![Images](Images/larr.jpg).


    We can decompose ![Images](Images/larr.jpg) into two vectors, ![Images](Images/lparr.jpg)
    and ![Images](Images/lnarr1.jpg), such that ![Images](Images/e0043-01.jpg), where
    ![Images](Images/lnarr1.jpg) is parallel to ![Images](Images/narr.jpg) and ![Images](Images/lparr.jpg)
    is perpendicular to ![Images](Images/narr.jpg) ([Figure 3-14](#ch03.xhtml_ch3fig14)).


    ![image](Images/03fig14.jpg)


    *Figure 3-14: Decomposing ![Images](Images/larr1.jpg) into its components ![Images](Images/lparr1.jpg)
    and ![Images](Images/lnarr2.jpg)*


    ![Images](Images/lnarr1.jpg) is the projection of ![Images](Images/larr.jpg) over
    ![Images](Images/narr.jpg); by the properties of the dot product and the fact
    that ![Images](Images/e0044-01.jpg), the length of this projection is ![Images](Images/e0044-02.jpg).
    We defined ![Images](Images/lnarr1.jpg) to be parallel to ![Images](Images/narr.jpg),
    so ![Images](Images/e0044-03.jpg).


    Since ![Images](Images/e0044-04.jpg), we can immediately get ![Images](Images/e0044-05.jpg).


    Now let’s look at ![Images](Images/rarr.jpg). Since it’s symmetrical to ![Images](Images/larr.jpg)
    with respect to ![Images](Images/narr.jpg), its component parallel to ![Images](Images/narr.jpg)
    is the same as ![Images](Images/larr.jpg)’s, and its perpendicular component is
    the opposite of ![Images](Images/larr.jpg)’s; that is, ![Images](Images/e0044-06.jpg).
    You can see this in [Figure 3-15](#ch03.xhtml_ch3fig15).


    ![image](Images/03fig15.jpg)


    *Figure 3-15: Computing* ![Images](Images/lrarr1.jpg)'
