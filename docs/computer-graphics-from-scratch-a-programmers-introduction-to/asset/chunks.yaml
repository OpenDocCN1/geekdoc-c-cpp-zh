    Suppose we keep track of the intersections between the ray and the shadow volume
    *after* the ray hits the surface. If the counter has a value of zero, then the
    value must also be zero *before* the ray hits the surface. If the counter has
    a nonzero value, it must have the opposite value on the other side of the surface.


    This means counting intersections between the ray and the shadow volume before
    the ray hits the surface is equivalent to counting the intersections after it—but
    in this case, we don’t have to worry about the position of the camera! [Figure
    15-6](#ch15.xhtml_ch15fig6) shows how this technique always produces correct results.


    ![image](Images/15fig06.jpg)


    *Figure 15-6: The counters have a value of zero for points that receive light,
    and a nonzero value for points that are in shadow, regardless of whether the camera
    is inside or outside the shadow volume.*


    ##### Setting up the Stencil Buffer


    We’re working with a rasterizer, not with a raytracer, so we need to find a way
    to keep these counters without actually computing any intersections between rays
    and shadow volumes. We can do this by using the stencil buffer.


    First, we render the scene as illuminated only by the ambient light. The ambient
    light casts no shadows, so we can do this without any changes to the rasterizer.
    This gives us one of the images we need to compose the final render, but it also
    gives us depth information for the scene, as seen from the camera, contained in
    the depth buffer. We need to keep this depth buffer for the next steps.


    Next, for each light, we follow these steps:


    1.   “Render” the back faces of the shadow volumes to the stencil buffer, incrementing
    its value whenever the pixel *fails* the depth buffer test. This counts the number
    of times the ray leaves a shadow volume after hitting the closest surface.


    2.   “Render” the front faces of the shadow volumes to the stencil buffer, decrementing
    its value whenever the pixel *fails* the depth buffer test. This counts the number
    of times the ray enters a shadow volume after hitting the closest surface.


    Note that during the “rendering” steps, we’re only interested in modifying the
    stencil buffer; there’s no need to write pixels to the canvas, and therefore no
    need to calculate illumination or texturing. We also don’t write to the depth
    buffer, because the sides of the shadow volumes aren’t actually physical objects
    in the scene. Instead, we use the depth buffer we computed during the ambient
    lighting pass.


    After doing this, the stencil buffer has zeros for the pixels that are illuminated
    and other values for the pixels that are in shadow. So we render the scene normally,
    illuminated by the single light corresponding to this pass, calling PutPixel only
    on the pixels where the stencil buffer has a value of zero.'
