    \ 4-8。\n\n![image](img/04fig08.jpg)\n\n*图 4-8：光线追踪的场景，现在包含了反射*\n\n你可以在 `[`gabrielgambetta.com/cgfs/reflections-demo`](https://gabrielgambetta.com/cgfs/reflections-demo)`\
    \ 找到该算法的在线实现。\n\n## 总结\n\n在之前的章节中，我们开发了一个基础框架用于在 2D 画布上渲染 3D 场景，模拟光线与物体表面相互作用的方式。这为我们提供了场景的一个简单的初始表示。\n\
    \n在本章中，我们扩展了这个框架，以模拟场景中不同物体不仅与光线相互作用，还彼此之间相互作用——通过相互投射阴影和相互反射。结果是渲染的场景看起来真实得多。\n\
    \n在下一章中，我们将简要讨论扩展这项工作的不同方法，从表示球体以外的物体，到渲染性能等实际考虑因素。\n\n# 5 扩展光线追踪器\n\n![image](img/common.jpg)\n\
    \n我们将通过对几个尚未涵盖的有趣话题进行快速讨论来结束本书的第一部分：将相机放置在场景的任何位置、性能优化、除球体以外的原始几何、使用构造实体几何（CSG）为物体建模、支持透明表面以及超采样。我们不会实现所有这些更改，但我鼓励你去尝试一下！前面的章节加上下面提供的描述，为你自己独立探索和实现这些内容提供了坚实的基础。\n\
    \n### 任意相机定位\n\n在关于光线追踪的讨论之初，我们做出了三个重要的假设：相机固定在 (0, 0, 0)，它指向 ![Images](img/zarrp.jpg)，并且它的“向上”方向是\
    \ ![Images](img/yarrp.jpg)。在本节中，我们将取消这些限制，以便可以将相机放置在场景的任何位置，并使其指向任何方向。\n\n让我们从相机位置开始。你可能已经注意到\
    \ `O` 在所有伪代码中仅使用了一次：作为顶层方法中来自相机的光线的原点。如果我们想改变相机的位置，我们*唯一*需要做的就是为 `O` 使用不同的值，然后完成了。\n\
    \n*位置*的变化会影响光线的*方向*吗？完全不会。光线的方向是从相机通向投影平面的向量。当我们移动相机时，投影平面会随之移动，因此它们的相对位置不会改变。我们编写\
    \ `CanvasToViewport` 的方式与这一思路是一致的。\n\n让我们关注相机朝向。假设你有一个代表相机所需朝的旋转矩阵。如果你只是旋转相机，相机的*位置*不会改变，但它看向的方向会改变；它会随着整个相机经历同样的旋转。因此，如果你有光线方向\
    \ ![Images](img/darr.jpg) 和旋转矩阵 `R`，那么旋转后的 `D` 就是 ![Images](img/e0066-01.jpg)。\n\
    \n简而言之，唯一需要更改的是的是我们在列表 2-2 中编写的主函数。列表 5-1 显示了更新后的函数。\n\n```python\nfor x in [-Cw/2,\
    \ Cw/2] {\n    for y in [-Ch/2, Ch/2] {\n      ❶ D = camera.rotation * CanvasToViewport(x,\
    \ y)\n      ❷ color = TraceRay(camera.position, D, 1, inf)\n        canvas.PutPixel(x,\
    \ y, color)\n    }\n}\n```\n*列表 5-1：主循环，已更新以支持任意相机位置和朝向*\n\n我们将相机旋转矩阵 ❶（它描述了相机在空间中的朝向）应用到即将追踪的光线方向上。然后我们使用相机位置作为光线的起点\
    \ ❷。\n\n图 5-1 显示了当从不同的位置和不同的相机朝向进行渲染时，我们的场景看起来如何。\n\n![image](img/05fig01.jpg)\n\
    \n*图 5-1：以不同的相机位置和朝向渲染的我们熟悉的场景*\n\n你可以在 `[`gabrielgambetta.com/cgfs/camera-demo`](https://gabrielgambetta.com/cgfs/camera-demo)`\
    \ 找到该算法的在线实现。\n\n### 性能优化\n\n之前的章节侧重于用尽可能清晰的方式解释光线追踪器。结果它是功能性的，但不特别快。这里是一些你可以自己探索以提高光线追踪器速度的。。为了好玩，请测量这些操作前后的时间。\n\
    \n#### 并行化\n\n让光线追踪器更快的最明显方法是同时追踪多个光线。由于离开相机的每个光线都是独立的，且场景数据是只读的，你可以在每个 CPU 核心上追踪一条光线而不会产生许多同步复杂性。事实上，光线追踪器属于一类被称为*尴尬并行（embarrassingly\
    \ parallel）*的算法，正是因为它们的本质使其易于并行化。\n\n不过，为每个光线创建一个线程可能不是好主意；管理数百万线程的开销可能会抵消你获得的速度提升。更合理的想法是创建一组“任务”，每个任务负责渲染画布的一个部分（矩形区域，直到单个像素），并在核心空闲时将其分发给工作线程。\n\
    \n#### 缓存不变值\n\n*缓存*是一种避免重复相同计算的方法。每当存在昂贵的计算且你预计将反复使用该计算结果时，存储（缓存）此结果并在下次需要时重用可能是一个好主意，特别是当该值不经常变化时。\n\
    \n考虑在光线追踪器花费大部分时间的 `IntersectRaySphere` 中计算的值：\n\n```python\na = dot(D, D)\nb\
    \ = 2 * dot(OC, D)\nc = dot(OC, OC) - r * r\n```\n不同时间段是不变的。\n\n一旦你加载了场景并知道球体的大小，就可以计算\
    \ `r * r`。除非球体的大小发生，否则该值不会改变。\n\n某些值在整个帧内是不变的。其中一个值就是 `dot(OC, OC)`，只有当相机或球体移动时，它才需要在帧之间更改。（注意，阴影和反射追踪的是并非从相机出发的光线，因此需要注意以确保在这种情况下不使用缓存值。）\n\
    \n某些值在整条光线范围内是不变的。例如，你可以在 `ClosestIntersection` 中计算 `dot(D, D)` 并将其传递给 `IntersectRaySphere`。\n\
    \n还有许多其他计算是可以重用的。发挥你的想象力！然而，并不是每个缓存值都能让整体变快，因为有时记录的开销可能高于节省的时间。始终使用基准测试来评估优化是否真的有帮助。\n"
