    \ A-2: The vectors* ![Images](Images/f0204-03.jpg) *and* ![Images](Images/f0204-04.jpg)\
    \ *are equal. Vectors don’t have a position.*\n\nDespite sharing their representation\
    \ with points, vectors don’t represent or have a position; they are, after all,\
    \ the *difference* between two positions. When you have a diagram like [Figure\
    \ A-2](#appendix.xhtml_app01fig2), you have to draw vectors somewhere; but the\
    \ vectors ![Images](Images/f0204-01.jpg) and ![Images](Images/f0204-02.jpg) are\
    \ equal, because they represent the same displacement.\n\nIn addition, the point\
    \ (2, 1) and the vector (2, 1) are unrelated. Sure, the vector (2, 1) goes from\
    \ (0, 0) to (2, 1), but it’s equally true that it goes from, say, (5, 5) to (7,\
    \ 6).\n\nVectors are characterized by their *direction* (the angle in which they\
    \ point) and their *magnitude* (how long they are).\n\nThe direction can be further\
    \ decomposed into *orientation* (the slope of the line they’re on) and *sense*\
