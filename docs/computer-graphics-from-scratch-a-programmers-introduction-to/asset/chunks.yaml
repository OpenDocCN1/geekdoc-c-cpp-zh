- fmt: "Note that nothing in the intersection equation says that the sphere has to\
    \ be *in* *front* of the camera; the equation will happily produce solutions for\
    \ intersections *behind* the camera. Obviously, this isn’t what we want, so we\
    \ should ignore any solutions with `t` < 0. To avoid further mathematical unpleasantness,\
    \ we’ll restrict the solutions to `t` > 1; that is, we’ll render whatever is *beyond*\
    \ the projection plane.\n\nOn the other hand, we don’t want to put an upper bound\
    \ on the value of `t`; we want to see all objects in front of the camera, no matter\
    \ how far away they are. However, because in later stages we *will* want to cut\
    \ rays short, we’ll introduce this formalism now and give `t` an upper value of\
    \ `+∞` (for languages that can’t represent “infinity” directly, a really really\
    \ big number does the trick).\n\nWe can now formalize everything we’ve done so\
    \ far with some pseudocode. As a general rule, we’ll assume the code has access\
    \ to whatever data it needs, so we won’t bother explicitly passing around parameters\
    \ such as the canvas and will focus on the really necessary ones.\n\nThe main\
    \ method now looks like [Listing 2-2](#ch02.xhtml_ch2lis2).\n\n```python\nO =\
    \ (0, 0, 0)\n\nfor x = -Cw/2 to Cw/2 {\n    for y = -Ch/2 to Ch/2 {\n        D\
    \ = CanvasToViewport(x, y)\n        color = TraceRay(O, D, 1, inf)\n        canvas.PutPixel(x,\
    \ y, color)\n    }\n}\n```\n*Listing 2-2: The main method*\n\nThe `CanvasToViewport`\
    \ function is very simple, and is shown in [Listing 2-3](#ch02.xhtml_ch2lis3).\
    \ The constant `d` represents the distance between the camera and the projection\
    \ plane.\n\n```python\nCanvasToViewport(x, y) {\n    return (x*Vw/Cw, y*Vh/Ch,\
    \ d)\n}\n```\n*Listing 2-3: The `CanvasToViewport` function*\n\nThe `TraceRay`\
    \ method ([Listing 2-4](#ch02.xhtml_ch2lis4)) computes the intersection of the\
    \ ray with every sphere and returns the color of the sphere at the nearest intersection\
    \ inside the requested range of `t`.\n\n```python\nTraceRay(O, D, t_min, t_max)\
    \ {\n    closest_t = inf\n    closest_sphere = NULL\n    for sphere in scene.spheres\
    \ {\n        t1, t2 = IntersectRaySphere(O, D, sphere)\n        if t1 in [t_min,\
    \ t_max] and t1 < closest_t {\n            closest_t = t1\n            closest_sphere\
    \ = sphere\n        }\n        if t2 in [t_min, t_max] and t2 < closest_t {\n\
    \            closest_t = t2\n            closest_sphere = sphere\n        }\n\
    \    }\n    if closest_sphere == NULL {\n        return BACKGROUND_COLOR\n   \
    \ }\n    return closest_sphere.color\n}\n```\n*Listing 2-4: The `TraceRay` method*\n\
    \nIn [Listing 2-4](#ch02.xhtml_ch2lis4), `O` represents the origin of the ray;\
    \ although we’re tracing rays from the camera, which is placed at the origin,\
    \ this won’t be the case in later stages, so it has to be a parameter. The same\
    \ applies to `t_min` and `t_max`. Note that when the ray doesn’t intersect any\
    \ sphere, we still need to return *some* color—I’ve chosen white in most of these.\
    \ Finally, `IntersectRay` ([Listing 2-5](#ch02.xhtml_ch2lis5)) just solves the\
    \ quadratic equation.\n\n```python\nIntersectRay(O, D, sphere) {\n    r = sphere.radius\n\
    \    CO = O - sphere.center\n    a = dot(D, D)\n    b = 2*dot(CO, D)\n    c =\
    \ dot(CO, CO) - r*r\n    discriminant = b*b - 4*a*c\n    if discriminant < 0 {\n\
    \        return inf, inf\n    }\n    t1 = (-b + sqrt(discriminant)) / (2*a)\n\
    \    t2 = (-b - sqrt(discriminant)) / (2*a)\n    return t1, t2\n}\n```\n*Listing\
    \ 2-5: The `IntersectRaySphere` method*\n\nTo put all of this into practice, let’s\
    \ define a very simple scene, shown in [Figure 2-10](#ch02.xhtml_ch2fig10).\n\n\
    ![image](Images/02fig10.jpg)\n*Figure 2-10: A very simple scene, viewed from above\
    \ (left) and from the right (right)*\n\nIn pseudoscene language, it’s something\
    \ like this:\n\n```python\nviewport_size = 1 x 1\nprojection_plane_d = 1\nsphere\
    \ {\n    center = (0, -1, 3)\n    radius = 1\n    color = (255, 0, 0) # Red\n\
    }\nsphere {\n    center = (2, 0, 4)\n    radius = 1\n    color = (0, 0, 255) #\
    \ Blue\n}\nsphere {\n    center = (-2, 0, 4)\n    radius = 1\n    color = (0,\
    \ 255, 0) # Green\n}\n```\n\nWhen we run our algorithm on this scene, we’re finally\
    \ rewarded with an incredibly awesome raytraced scene ([Figure 2-11](#ch02.xhtml_ch2fig11)).\n\
    \n![image](Images/02fig11.jpg)\n*Figure 2-11: An incredibly awesome raytraced\
    \ scene*\n\nYou can find a live implementation of this algorithm at [https://gabrielgambetta.com/cgfs/basic-rays-demo](https://gabrielgambetta.com/cgfs/basic-rays-demo).\n\
    \nI know, it’s a bit of a letdown, isn’t it? Where are the reflections and the\
    \ shadows and the polished look? Don’t worry, we’ll get there. This is a good\
    \ first step. The spheres look like circles, which is better than if they looked\
    \ like cats. The reason they don’t look quite like spheres is that we’re missing\
    \ a key component of how human beings determine the shape of an object: the way\
    \ it interacts with light. We’ll cover that in the next chapter.\n\n### Summary\n\
    \nIn this chapter, we’ve laid down the foundations of our raytracer. We’ve chosen\
    \ a fixed setup (the position and orientation of the camera and the viewport,\
    \ as well as the size of the viewport); we’ve chosen representations for spheres\
    \ and rays; we’ve explored the math necessary to figure out how rays interact\
    \ with objects.\n"
  raw: 'Note that nothing in the intersection equation says that the sphere has to
    be *in* *front* of the camera; the equation will happily produce solutions for
    intersections *behind* the camera. Obviously, this isn’t what we want, so we should
    ignore any solutions with *t* < 0\. To avoid further mathematical unpleasantness,
    we’ll restrict the solutions to *t* > 1; that is, we’ll render whatever is *beyond*
    the projection plane.


    On the other hand, we don’t want to put an upper bound on the value of *t*; we
    want to see all objects in front of the camera, no matter how far away they are.
    However, because in later stages we *will* want to cut rays short, we’ll introduce
    this formalism now and give *t* an upper value of +*∞* (for languages that can’t
    represent “infinity” directly, a really really big number does the trick).


    We can now formalize everything we’ve done so far with some pseudocode. As a general
    rule, we’ll assume the code has access to whatever data it needs, so we won’t
    bother explicitly passing around parameters such as the canvas and will focus
    on the really necessary ones.


    The main method now looks like [Listing 2-2](#ch02.xhtml_ch2lis2).


    O = (0, 0, 0)


    for x = -Cw/2 to Cw/2 {


        for y = -Ch/2 to Ch/2 {


            D = CanvasToViewport(x, y)


            color = TraceRay(O, D, 1, inf)


            canvas.PutPixel(x, y, color)


        }


    }


    *Listing 2-2: The main method*


    The CanvasToViewport function is very simple, and is shown in [Listing 2-3](#ch02.xhtml_ch2lis3).
    The constant d represents the distance between the camera and the projection plane.


    CanvasToViewport(x, y) {


        return (x*Vw/Cw, y*Vh/Ch, d)


    }


    *Listing 2-3: The *CanvasToViewport* function*


    The TraceRay method ([Listing 2-4](#ch02.xhtml_ch2lis4)) computes the intersection
    of the ray with every sphere and returns the color of the sphere at the nearest
    intersection inside the requested range of *t*.


    TraceRay(O, D, t_min, t_max) {


        closest_t = inf


        closest_sphere = NULL


        for sphere in scene.spheres {


            t1, t2 = IntersectRaySphere(O, D, sphere)


            if t1 in [t_min, t_max] and t1 < closest_t {


                closest_t = t1


                closest_sphere = sphere


            }


            if t2 in [t_min, t_max] and t2 < closest_t {


                closest_t = t2


                closest_sphere = sphere


            }


        }


        if closest_sphere == NULL {


         ❶ return BACKGROUND_COLOR


        }


        return closest_sphere.color


    }


    *Listing 2-4: The *TraceRay* method*


    In [Listing 2-4](#ch02.xhtml_ch2lis4), O represents the origin of the ray; although
    we’re tracing rays from the camera, which is placed at the origin, this won’t
    necessarily be the case in later stages, so it has to be a parameter. The same
    applies to t_min and t_max.


    Note that when the ray doesn’t intersect any sphere, we still need to return *some*
    color ❶ —I’ve chosen white in most of these examples.


    Finally, IntersectRaySphere ([Listing 2-5](#ch02.xhtml_ch2lis5)) just solves the
    quadratic equation.


    IntersectRaySphere(O, D, sphere) {


        r = sphere.radius


        CO = O - sphere.center


        a = dot(D, D)


        b = 2*dot(CO, D)


        c = dot(CO, CO) - r*r


        discriminant = b*b - 4*a*c


        if discriminant < 0 {


            return inf, inf


        }


        t1 = (-b + sqrt(discriminant)) / (2*a)


        t2 = (-b - sqrt(discriminant)) / (2*a)


        return t1, t2


    }


    *Listing 2-5: The *IntersectRaySphere* method*


    To put all of this into practice, let’s define a very simple scene, shown in [Figure
    2-10](#ch02.xhtml_ch2fig10).


    ![image](Images/02fig10.jpg)


    *Figure 2-10: A very simple scene, viewed from above (left) and from the right
    (right)*


    In pseudoscene language, it’s something like this:


    viewport_size = 1 x 1


    projection_plane_d = 1


    sphere {


        center = (0, -1, 3)


        radius = 1


        color = (255, 0, 0)  # Red


    }


    sphere {


        center = (2, 0, 4)


        radius = 1


        color = (0, 0, 255)  # Blue


    }


    sphere {


        center = (-2, 0, 4)


        radius = 1


        color = (0, 255, 0)  # Green


    }


    When we run our algorithm on this scene, we’re finally rewarded with an incredibly
    awesome raytraced scene ([Figure 2-11](#ch02.xhtml_ch2fig11)).


    ![image](Images/02fig11.jpg)


    *Figure 2-11: An incredibly awesome raytraced scene*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/basic-rays-demo](https://gabrielgambetta.com/cgfs/basic-rays-demo)*.


    I know, it’s a bit of a letdown, isn’t it? Where are the reflections and the shadows
    and the polished look? Don’t worry, we’ll get there. This is a good first step.
    The spheres look like circles, which is better than if they looked like cats.
    The reason they don’t look quite like spheres is that we’re missing a key component
    of how human beings determine the shape of an object: the way it interacts with
    light. We’ll cover that in the next chapter.


    ### Summary


    In this chapter, we’ve laid down the foundations of our raytracer. We’ve chosen
    a fixed setup (the position and orientation of the camera and the viewport, as
    well as the size of the viewport); we’ve chosen representations for spheres and
    rays; we’ve explored the math necessary to figure out how spheres and rays interact;
    and we’ve put all this together to draw the spheres on the canvas using solid
    colors.


    The next chapters build on this by modeling the way the rays of light interact
    with objects in the scene in increasing detail.


    ## **3


    LIGHT**


    ![image](Images/common.jpg)


    We’ll start adding “realism” to our rendering of the scene by introducing light.
    Light is a vast and complex topic, so we’ll present a simplified model that is
    good enough for our purposes. This model is, for the most part, inspired by how
    light works in the real world, but it also takes some liberties with the aim of
    making the rendered scenes look good.


    We’ll start with some simplifying assumptions that will make our lives easier,
    then we’ll introduce three types of light sources: point lights, directional lights,
    and ambient light. We’ll end the chapter by discussing how these lights affect
    the appearance of surfaces, including diffuse and specular reflection.


    ### Simplifying Assumptions


    Let’s make a few assumptions to make things simpler. First, we declare that all
    light is white. This lets us characterize any light using a single real number,
    *i*, called the *intensity* of the light. Simulating colored lights isn’t that
    complicated (we’d just use three intensity values, one per color channel, and
    compute all color and lighting channel-wise), but we’ll stick to white lights
    to keep things simple.


    Second, we’ll ignore the atmosphere. In real life, lights look dimmer the farther
    away they are; this is because of particles floating in the air that absorb part
    of the light as it travels through them. While this isn’t particularly complicated
    to do in a raytracer, we’ll keep it simple and ignore this effect; in our scene,
    distance doesn’t make lights any less bright.


    ### Light Sources


    Light has to come from somewhere. In this section, we’ll define three different
    types of light sources.


    #### Point Lights


    *Point lights* emit light from a fixed point in 3D space, called their *position*.
    They emit light equally in every direction; this is why they are also called *omnidirectional
    lights*. A point light is therefore fully described by its position and its intensity.


    A light bulb is a good real-life approximation of a point light. While a real-life
    light bulb doesn’t emit light from a single point, and it isn’t perfectly omnidirectional,
    it’s a pretty accurate approximation.


    Let’s define the vector ![Images](Images/larr.jpg) as the direction from a point
    in the scene, *P*, to the light, *Q*. We can calculate this vector, called the
    *light vector*, as *Q* *–* *P*. Note that since *Q* is fixed but *P* can be any
    point in the scene, ![Images](Images/larr.jpg) is different for every point in
    the scene, as you can see in [Figure 3-1](#ch03.xhtml_ch3fig1).


    ![image](Images/03fig01.jpg)'
