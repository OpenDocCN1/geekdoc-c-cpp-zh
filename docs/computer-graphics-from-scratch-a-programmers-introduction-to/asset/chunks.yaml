    need to compute reflections at all ❶. If the sphere is not reflective or we hit
    the recursion limit, we’re done, and we can just return the sphere’s own color.


    The most interesting change is the recursive call ❷ ; TraceRay calls itself, with
    the appropriate parameters for reflection and, importantly, decrementing the recursion
    depth counter; this, combined with the check ❶, prevents an infinite loop.


    Finally, once we have the sphere’s local color and the reflected color, we blend
    them together ❸, using “how reflective this sphere is” as the blending weight.


    I’ll let the results speak for themselves. Check out [Figure 4-8](#ch04.xhtml_ch4fig8).


    ![image](Images/04fig08.jpg)


    *Figure 4-8: The raytraced scene, now with reflections*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/reflections-demo](https://gabrielgambetta.com/cgfs/reflections-demo)*.


    ### Summary


    In the previous chapters, we developed a basic framework to render a 3D scene
    on a 2D canvas, modeling the way a ray of light interacts with the surface of
    an object. This gave us a simple initial representation of the scene.


    In this chapter, we extended this framework to model how different objects in
    the scene interact not only with rays of light, but with each other—by casting
    shadows over each other and by reflecting each other. As a result, the rendered
    scene looks significantly more realistic.


    In the next chapter, we’ll briefly discuss different ways to extend this work,
    from representing objects other than spheres to practical considerations such
    as rendering performance.


    ## **5


    EXTENDING THE RAYTRACER**


    ![image](Images/common.jpg)


    We’ll conclude the first part of the book with a quick discussion of several interesting
    topics that we haven’t yet covered: placing the camera anywhere in the scene,
    performance optimizations, primitives other than spheres, modeling objects using
    constructive solid geometry, supporting transparent surfaces, and supersampling.
    We won’t implement all of these changes, but I encourage you to give them a try!
    The preceding chapters, plus the descriptions offered below, give you solid foundations
    to explore and implement them by yourself.


    ### Arbitrary Camera Positioning


    At the very beginning of the discussion about raytracing we made three important
    assumptions: that the camera was fixed at (0, 0, 0), that it was pointing to ![Images](Images/zarrp.jpg),
    and that its “up” direction was ![Images](Images/yarrp.jpg). In this section,
    we’ll lift these restrictions so we can put the camera anywhere in the scene and
    point it in any direction.


    Let’s start with the camera position. You may have noticed that *O* is used exactly
    once in all the pseudocode: as the origin of the rays coming from the camera in
    the top-level method. If we want to change the position of the camera, the *only*
    thing we need to do is to use a different value for *O* and we’re done.


    Does the change in *position* affect the *direction* of the rays? Not at all.
    The direction of the rays is the vector that goes from the camera to the projection
    plane. When we move the camera, the projection plane moves together with it, so
    their relative positions don’t change. The way we have written CanvasToViewport
    is consistent with this idea.


    Let’s turn our attention to the camera orientation. Suppose you have a rotation
    matrix that represents the desired orientation of the camera. The *position* of
    the camera doesn’t change if you just rotate the camera around, but the direction
    it’s looking toward does; it undergoes the same rotation as the whole camera.
    So if you have the ray direction ![Images](Images/darr.jpg) and the rotation matrix
    *R*, the rotated *D* is just ![Images](Images/e0066-01.jpg).


    In summary, the only function that needs to change is the main function we wrote
    back in [Listing 2-2](#ch02.xhtml_ch2lis2). [Listing 5-1](#ch05.xhtml_ch5lis1)
    shows the updated function.


    for x in [-Cw/2, Cw/2] {


        for y in [-Ch/2, Ch/2] {


         ❶ D = camera.rotation * CanvasToViewport(x, y)


         ❷ color = TraceRay(camera.position, D, 1, inf)


            canvas.PutPixel(x, y, color)


        }


    }


    *Listing 5-1: The main loop, updated to support an arbitrary camera position and
    orientation*


    We apply the camera’s rotation matrix ❶, which describes its orientation in space,
    to the direction of the ray we’re about to trace. Then we use the camera position
    as the starting point of the ray ❷.


    [Figure 5-1](#ch05.xhtml_ch5fig1) shows what our scene looks like when rendered
    from a different position and with a different camera orientation.


    ![image](Images/05fig01.jpg)


    *Figure 5-1: Our familiar scene, rendered with a different camera position and
    orientation*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/camera-demo](https://gabrielgambetta.com/cgfs/camera-demo)*.


    ### Performance Optimizations


    The preceding chapters focused on the clearest possible way to explain and implement
    the different features of a raytracer. As a result, it is fully functional but
    not particularly fast. Here are some ideas you can explore by yourself to make
    the raytracer faster. Just for fun, measure before-and-after times for each of
    these. You’ll be surprised by the results!


    #### Parallelization


    The most obvious way to make a raytracer faster is to trace more than one ray
    at a time. Since each ray leaving the camera is independent of every other ray
    and the scene data is read-only, you can trace one ray per CPU core without many
    penalties or much synchronization complexity. In fact, raytracers belong to a
    class of algorithms called *embarrassingly* *parallelizable*, precisely because
    their very nature makes them extremely easy to parallelize.


    Spawning a thread per ray is probably not a good idea, though; the overhead of
    managing potentially millions of threads would probably negate the speed-up you’d
    obtain. A more sensible idea would be to create a set of “tasks,” each of them
    responsible for raytracing a section of the canvas (a rectangular area, down to
    a single pixel), and dispatch them to worker threads running on the physical cores
    as they become available.


    #### Caching Immutable Values


    *Caching* is a way to avoid repeating the same computation over and over again.
    Whenever there’s an expensive computation and you expect to use the result of
    this computation repeatedly, it might be a good idea to store (cache) this result
    and just reuse it next time it’s needed, especially if this value doesn’t change
    often.


    Consider the values computed in IntersectRaySphere, where a raytracer typically
    spends most of its time:


        a = dot(D, D)


        b = 2 * dot(OC, D)


        c = dot(OC, OC) - r * r


    Different values are immutable during different periods of time.


    Once you load the scene and you know the size of the spheres, you can compute
    r * r. That value won’t change unless the size of the spheres changes.


    Some values are immutable for an entire frame, at the very least. One such value
    is dot(OC, OC) and it only needs to change between frames if the camera or a sphere
    moves. (Note that shadows and reflections trace rays that don’t start at the camera,
    so some care is needed to make sure the cached value isn’t used in that case.)


    Some values don’t change for an entire ray. For example, you can compute dot(D,
    D) in ClosestIntersection and pass it to IntersectRaySphere.


    There are many other computations that can be reused. Use your imagination! Not
    every cached value will make things faster overall, however, because sometimes
    the bookkeeping overhead might be higher than the time saved. Always use benchmarks
    to evaluate whether an optimization is actually helping.


    #### Shadow Optimizations'
