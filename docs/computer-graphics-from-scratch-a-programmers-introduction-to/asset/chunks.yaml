  trans: "\n\n# 第一部分\n\n# 光线追踪\n\n## 2. 基础光线追踪\n\n![image](img/common.jpg)\n\n在本章中，我们将介绍光线追踪，这是我们将涵盖的首个主要算法。首先，我们将从算法动机出发，列出一些基础伪代码。然后，我们将如何表示场景中的光线和物体。最后，我们将推导出一种方法来计算哪些光线构成了场景中每个物体可见的图像，并观察我们如何在画布上表示它们。\n\
    \n### 渲染瑞士风景\n\n假设你正在访问某个异域风情，遇到了一处令人惊叹的风景——如此壮丽，你简直`需要`画一幅画来捕捉它的美。图 2-1 展示了这样一个景观。\n\
    \n![image](img/02fig01.jpg)\n\n*图 2-1：息为观止的瑞士风景*\n\n你有一块画布和一把画笔，但你完全缺乏艺术天赋。一切都幻灭了吗？\n\
    \n未必如此。你可能没有艺术天赋，但你做事很有条理。所以你做了最而易之的事：去拿一个昆虫网。你剪下一个矩形，装上框，并把它固定在一根棍子上。现在，你可以透过一个网状窗口观察风景了。接下来，你选择一个最佳视角来欣赏这处风景，并插下另一根棍子，标记眼睛应该所在的精确位置。\n\
    \n你还没有开始画，但现在你有了一个固定的视角和一个通过它观察风景的固定框架。此外，这个固定的框架被昆虫网分成了小方格。现在到了有条理的部分。你在画布上画一个网格，它的方格数量与昆虫网相同。然后，你观察网的左上角的方格。透过它看到的主要的颜色是什么？天蓝色。所以你把画布左上角的方格涂成天蓝色。你对每个方格都这样做，很快画布上就包含了一幅很不错的风景画，就像通过框架看到的那样。最终生成的画所示图\
    \ 2-2。\n\n![image](img/02fig02.jpg)\n\n*图 2-2：风景的粗略近似*\n\n想一想，计算机本质上是一台极其有条理但完全缺乏艺术天赋的机器。我们可以将创作绘画的过程描述如下：\n\
    \n```\n对于画布上的每个小方格\n    将它涂上正确的颜色\n```\n\n简单！然而，这种表述太抽象了，无法直接在计算机上实现。我们可以再详细一点一点：\n\
    \n```\n按需要放置眼睛和框架\n对于画布上的每个方格\n    确定网格上的哪个方格对应画布上的这个方格\n    确定透过该网格方格看到的颜色\n\
    \    用那种颜色涂画该方格\n```\n\n这仍然太抽象，但它开始看起来像一个算法——而且可能让你惊讶的是，这正是整个光线追踪算法的高级概述！是的，它就是这么简单。\n\
    \n### 基础假设\n\n计算机图形的魅力部分之一是在屏幕上绘制物体。为了尽可能快地实现这一目标，我们将做出一些简化假设。当然，这些假设对我们能做的事情施加了限制，但我们将在后面的章节中取消这些限制。\n\
    \n首先，我们将假设一个固定的观察位置。观察位置，即在“瑞士风景”类比中你放置眼睛的地方，通常称为`相机位置`（camera position）；我们称其为\
    \ `O`。我们假设相机占据空间中的一个点，它位于坐标系的原点，并且永远从那里移动，所以目前 `O = (0, 0, 0)`。\n\n其次，我们将假设一个固定的相机朝向。相机朝向决定了相机指向哪里。我们假设它指向正\
    \ `Z` 轴方向（我们将其简称为 ![Images](img/zarrp.jpg)），正 `Y` 轴(![Images](img/yarrp.jpg))向上，正\
    \ `X` 轴(![Images](img/xarrp.jpg))向右 (图 2-3)。\n\n![image](img/02fig03.jpg)\n\n\
    *图 2-3：相机的位置和朝向*\n\n相机位置和朝向现在固定了。类比中缺失的是我们观察场景的“框架”。我们假设这个框架的尺寸为 `V[w]` 和 `V[h]`，并且正对着相机朝向——即垂直于\
    \ ![Images](img/zarrp.jpg)。我们还假设它的距离为 `d`，侧边与 `X` 和 `Y` 轴平行，并相对于 ![Images](img/zarr.jpg)居中。这听起来很绕，但其实非常简单。看图\
    \ 2-4。\n\n作为我们通往世界的窗口的矩形被称为`视口`（viewport）。基本上，我们在画布上绘制透过视口看到的任何东西。注意视口的大小和相机的距离决定了从相机可见的角度，称为`视场`（field\
    \ of view），简称 `FOV`。人类拥有近乎 180° 的水平视场（尽管大部分是模糊的外周视觉，没有深度感）。为了简单起见，我们将 `V[w] =\
    \ V[h] = d = 1`；这会产生看起来合理的图像。\n\n![image](img/02fig04.jpg)\n\n*图 2-4：视口的位置和朝向*\n\
    \n### 画布到视口\n\n算法 2-1 中的第 2 步要求我们确定视口上的哪个方格对应画布上的这个像素。我们知道像素的画布坐标——我们称之为 `C[x]`\
    \ 和 `C[y]`。注意我们如何方便地放置视口，使其轴与画布一致。因为视口是以世界单位衡量的而画布是以像素衡量的，从画布坐标到空间只需要缩放！\n\n![image](img/e017-01.jpg)\n\
    \n还有一个细节。尽管视口是二维的，但它是嵌入在三维空间中的。我们定义它距离相机为 `d`；该平面上的每个点（称为投影平面）其 `z = d`。因此，\n\n\
    ```\nV[z] = d\n```\n\n我们这一步就完成了。对于画布上的每个像素 (`C[x], C[y]`)，我们可以确定它在视口上对应的点 (`V[x],\
    \ V[y], V[z]`)。\n\n### 射线追踪\n\n下一步是确定从相机视角 (`O[x], O[y], O[z]`) 看，透过 `V[x], V[y],\
    \ V[z]` 的光是什么。\n\n在现实世界中，光来自光源（太阳、灯泡等），在多个物体上反射，最后到达我们的眼睛。我们可以尝试模拟离开模拟光源的每一个光子的路径，但这将是*极其*耗时的。我们不仅必须模拟惊人的光子数量（单个\
    \ 100 瓦灯泡每秒发射 10²⁰ 个光子！），而且极少数光子恰好在透过视口后到达 (`O[x], O[y], O[z]`)。这种技术被称为*光子追踪*（photon\
    \ tracing）或*光子映射*（photon mapping）；遗憾的是，它超出了本书的范围。\n\n"
