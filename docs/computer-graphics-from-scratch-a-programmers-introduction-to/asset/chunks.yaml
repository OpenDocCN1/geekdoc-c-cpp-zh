  trans: "\n\n假设我们有两个画布点，`P[0]` 和 `P[1]`，坐标分别为 (`x[0]`, `y[0]`) 和 (`x[1]`, `y[1]`)。我们如何画出\
    \ `P[0]` 和 `P[1]` 之间的直线段呢？\n\n让我们先用参数坐标来表示直线，就像我们之前处理射线时做的那样（事实上，你可以把“射线”看作 3D\
    \ 里的直线）。直线上的任意点 `P` 都可以通过从 `P[0]` 开始，沿着 `P[0]` 到 `P[1]` 的方向移动一段距离得到：\n\n`P = P[0]\
    \ + t(P[1] – P[0])`\n\n我们可以将这个方程分解为两个，每个坐标一个：\n\n`x = x[0] + t ⋅ (x[1] – x[0])`\n\
    \n`y = y[0] + t ⋅ (y[1] – y[0])`\n\n让我们取第一个方程并解出 `t`：\n\n![image](img/f0080-01.jpg)\n\
    \n现在我们可以将 `t` 的这个表达式代入第二个方程：\n\n![image](img/f0080-02.jpg)\n\n稍微整理一下：\n\n![image](img/f0081-01.jpg)\n\
    \n注意 ![image](img/f0081-02.jpg) 是一个仅取决于线段端点的常量；我们称其为 `a`。因此我们可以将上面的方程重写为：\n\n\
    `y = y[0] + a ⋅ (x – x[0])`\n\n`a` 是什么？根据我们的定义，它衡量了每当 `x` 坐标变化一个单位，`y` 坐标的变化；换句话说，它是直线的**斜率**（slope）。\n\
    \n回到方程。展开乘法：\n\n`y = y[0] + ax – ax[0]`\n\n将常数项分组：\n\n`y = ax + (y[0] – ax[0])`\n\
    \n同样，(`y[0] – ax[0]`) 仅取决于线段的端点；我们称其为 `b`。最后我们得到\n\n`y = ax + b`\n\n这是线性函数的标准表达式，可以用来表示*几乎*任何直线。当我们解出\
    \ `t` 时，我们直接除以 `x[1] – x[0]`，而没有考虑 `x[1] = x[0]` 会发生什么。不能除以零，这意味着这个公式无法表示 `x[1]\
    \ = x[0]` 的直线——即垂直线。\n\n为了解决这个问题，我们暂时忽略垂直线，稍后再考虑如何处理它们。\n\n### 画线\n\n现在我们有了一种为每个感兴趣的\
    \ `x` 值获取 `y` 值的方法。这给了我们的一对满足直线方程的 (`x`, `y`)。\n\n现在我们可以写出一个函数的初步近似，用于画出从 `P[0]`\
    \ 到 `P[1]` 的线段。让 `x0` 和 `y0` 分别为 `P[0]` 的 `x` 和 `y` 坐标，`x1` 和 `y1` 为 `P[1]` 的坐标。假设\
    \ `x[0] < x[1]`，我们可以从 `x[0]` 遍历到 `x[1]`，为每个 `x` 值计算 `y` 的值，并在这些坐标处画一个像素：\n\n```cpp\n\
    DrawLine(P0, P1, color) {\n    a = (y1 - y0) / (x1 - x0)\n    b = y0 - a * x0\n\
    \    for x = x0 to x1 {\n        y = a * x + b\n        canvas.PutPixel(x, y,\
    \ color)\n    }\n}\n```\n\n注意，除法运算符 `/` 执行的是浮点除法，而不是整数除法。尽管在此上下文中 `x` 和 `y` 是整数，因为它们代表画布上的像素坐标。\n\
    \n另外注意，我们的 `for` 循环包含了范围的最后一个值。在 C、C++、Java 和 JavaScript 等语言中，这将写为 `for (x = x0;\
    \ x <= x1; ++x)`。我们将在书中统一这种约定。\n\n这个函数是上述方程的直接、简单的实现。它可以工作，但我们能让它更快吗？\n\n我们并不是为任意的\
    \ `x` 计算 `y` 的值。相反，我们只在 `x` 的整数增量处计算它们，并且是顺序计算的。在计算完 `y(x)` 之后，我们接着计算 `y(x + 1)`：\n\
    \n`y(x) = ax + b`\n\n`y(x + 1) = a ⋅ (x + 1) + b`\n\n我们可以稍微处理一下第二个表达式：\n\n`y(x\
    \ + 1) = ax + a + b`\n`y(x + 1) = (ax + b) + a`\n`y(x + 1) = y(x) + a`\n\n这并不意外；毕竟，斜率\
    \ `a` 衡量的是当 `x` 增加 1 时 `y` 的变化，这正是我们在这里所做的。这意味着我们只需要通过上一个 `y` 值加上斜率就可以计算下一个 `y`\
    \ 值；不需要对每个像素进行乘法，这使得函数更快。在开始时没有“上一个 `y` 值”，所以我们从 (`x[0]`, `y[0]`) 开始。然后不断给 `x`\
    \ 加 1，给 `y` 加 `a`，直到到达 `x[1]`。同样假设 `x[0] < x[1]`，我们可以将函数重写为：\n\n```cpp\nDrawLine(P0,\
    \ P1, color) {\n    a = (y1 - y0) / (x1 - x0)\n    y = y0\n    for x = x0 to x1\
    \ {\n        canvas.PutPixel(x, y, color)\n        y = y + a\n    }\n}\n```\n\n\
    到目前为止我们一直假设 `x[0] < x[1]`。有一个简单的解决方法可以支持该条件不成立的线：由于我们绘制像素的顺序并不重要，如果我们得到一条从右到左的线，只需\
    \ `swap(P0, P1)` 将其转换为从左到右即可：\n\n```cpp\nDrawLine(P0, P1, color) {\n    a = (y1\
    \ - y0) / (x1 - x0)\n    y = y0\n    for x = x0 to x1 {\n        canvas.PutPixel(x,\
    \ y, color)\n        y = y + a\n    }\n}\n\nif (x0 > x1) {\n    swap(P0, P1)\n\
    }\n// 重新执行逻辑...\n```\n\n```cpp\nDrawLine(P0, P1, color) {\n    a = (y1 - y0) /\
    \ (x1 - x0)\n    b = y0 - a * x0\n    for x = x0 to x1 {\n        y = a * x +\
    \ b\n        canvas.PutPixel(x, y, color)\n    }\n}\n```\n（注：根据原文逻辑，此处应为 swap\
    \ 后的重新处理，但原文示例代码块有截断，此处按翻译意图对齐）\n\n更正后的逻辑流表达：\n```cpp\nDrawLine(P0, P1, color)\
    \ {\n    a = (y1 - y0) / (x1 - x0)\n    y = y0\n    for x = x0 to x1 {\n     \
    \   canvas.PutPixel(x, y, color)\n        y = y + a\n    }\n}\n\nif (x0 > x1)\
