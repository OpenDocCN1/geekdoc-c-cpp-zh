  trans: "\n\n这些箭头允许我们根据每个三角形分类为“正面”或“背面”，取决于它们是朝相机还是背向相机。更正式地说，如果视图向量与此箭头（它实际上是三角形的法向量）之间的角度小于\
    \ `90°`，则该三角形是朝向的；否则，它是背向的（图 12-9）。\n\n![image](img/12fig09.jpg)\n\n*图 12-9：视图向量与三角形法向量之间的角度允许我们将其分类为正面或背面。*\n\
    \n此时，我们需要对 3D 模型施加一个限制：它们必须是*封闭的*（closed）。封闭封闭的精确定义相当复杂，但幸运的是，直观的理解就足够了。我们一直在处理的立方体就是封闭的；我们只能看到它的外部。如果我们移除它的其中一个面，它就不是封闭的，因为我们可以看到它的内部。这并不意味着我们不能拥有有孔或凹槽的对象；我们只需要用薄的“墙”来对这些部分进行建模即可。参见图\
    \ 12-10 中的示例。\n\n![image](img/12fig10.jpg)\n\n*图 12-10：开放和封闭对象的示例*\n\n为什么要施加这种限制？封闭对象有一个有趣的属性：无论模型或相机的方向如何，正面集合都会完全覆盖背面集合。这意味着我们完全不需要绘制背面，从而节省了宝贵的计算时间。\n\
    \n由于我们可以丢弃（剔除）所有背面，因此这种算法被称为*背面剔除*（back face culling）。对于一个可以减少我们一半渲染时间的算法来说，它的伪代码是极其地简单！\n\
    \n```\nCullBackFaces(object, camera) {\n  for T in object.triangles {\n    if\
    \ T is back-facing {\n      remove T from object.triangles\n    }\n  }\n}\n```\n\
    \n*列表 12-1：背面剔除算法*\n\n让我们更详细地查看如何判断一个三角形是正面还是背面。\n\n### 分类三角形\n\n假设我们有一个三角形的法向量\
    \ ![image](img/f0160-01.jpg) 以及从三角形顶点到相机的向量 ![image](img/f0160-02.jpg)。现在假设 ![image](img/f0160-01.jpg)\
    \ 指向对象的外部。为了将三角形分类为正面或背面，我们计算 ![image](img/f0160-01.jpg) 和 ![image](img/f0160-02.jpg)\
    \ 之间的角度，并检查它们是否在 `90°` 以内。\n\n我们可以再次利用点积的属性来使其变得简单。记住，如果 `α` 是 ![image](img/f0160-01.jpg)\
    \ 和 ![image](img/f0160-02.jpg) 之间的角度，那么\n\n![image](img/f0160-03.jpg)\n\n因为当 `|α|\
    \ ≤ 90°` 时 `cos(α)`是非负的，我们只需要知道这个表达式的符号就能将三角形分类为正面或背面。注意 ![image](img/f0160-03a.jpg)\
    \ 和 ![image](img/f0160-03b.jpg) 总是正数，所以它们不会影响表达式的符号。因此\n\n![image](img/f0160-04.jpg)\n\
    \n分类标准简单如下：\n\n![image](img/f0160-05.jpg)\n\n边界情况 ![image](img/f0160-06.jpg) 对应于我们正对着三角形的边缘观察——即相机和三角形在同一平面上。我们可以以任何方式对该三角形分类而不会对结果产生太大影响，因此我们选择将其分类为背面，以避免处理退化三角形。\n\
    \n我们从哪里获取法向量？事实证明有一种向量运算*叉积*（cross product）![image](img/f0160-07.jpg)，它可以接收两个向量\
    \ ![image](img/f0160-08.jpg) 和 ![image](img/f0160-09.jpg) 并产生一个与两者都垂直的向量（关于此操作的定义，参见线性代数附录）。换句话说，三角形表面两个向量的叉积就是该三角形的法向量。我们可以通过顶点相减来轻松获取三角形上的两个向量。因此，计算三角形\
    \ `ABC` 法向量的方向是非常直接的：\n\n![image](img/f0160-10.jpg)\n\n注意，“法向量的方向”不等同于“法向量”。这里有两个原因。第一个是\
    \ ![image](img/f0160-03a.jpg) 不一定等于 `1`。这并不重要，因为归一化 ![image](img/f0160-01.jpg)\
    \ 是轻而易举的，而且我们只关心 ![image](img/f0160-11.jpg) 的符号。\n\n第二个原因是如果 ![image](img/f0160-01.jpg)\
    \ 是 `ABC` 的法向量，那么 ![image](img/f0138-03a.jpg) 也是，在这种情况下我们非常在意 ![image](img/f0160-01.jpg)\
    \ 指向的方向，因为这正是我们将三角形分类为正面或背面的依据。\n\n此外，叉积不交换律：![image](img/f0161-01.jpg)。\n\n###\
    \ 总结\n\n在本章中，我们让我们的渲染器（之前只能渲染线框对象）能够渲染看起来实心的对象。这比仅仅用 `FilledTriangle` 代替 `WireframeTriangle`\
    \ 要复杂，因为我们需要靠近相机的三角形来遮挡较远的三角形。\n\n我们探索的第一个想法是从后到往前绘制三角形，但我们讨论过它有的几个缺点。更好的想法是在像素级别上操作；这个想法引导我们使用了深度缓冲（depth\
    \ buffering），无论我们绘制三角形的顺序如何，它都能产生正确的结果。\n\n我们最后探索了一种可选但很有价值的技术，它不会改变结果的正确性，但可以节省我们渲染大约一半三角形的时间：背面剔除。\n\
    \n# **13 着光**\n\n![image](img/common.jpg)\n\n让我们继续让图像更加真实；在本章中，我们将研究如何向场景添加光源以及如何照明它包含的对象。首先，让我们来看一下术语。\n\
    \n### 着光 vs. 照明\n\n本章的标题是“着光”（Shading），而不是“照明”（Illumination）；这是两个不同但密切相关的概念。*照明*（Illumination）指的是计算场景中单点光照效果所需的数学和算法；*着光*（Shading）处理的是将离散点集的光照效果扩展到整个对象的的技术。\n\
    \n"
- fmt: "\nIn [Chapter 3](#ch03.xhtml_ch03), we looked at all we need to know about\
    \ illumination. We can define ambient, point, and directional lights, and we can\
    \ compute the illumination at any point in the scene given its position and a\
    \ surface normal at that point:\n\n![image](Images/f0164-01.jpg)\n\nThis illumination\
    \ equation expresses how light illuminates a point in the scene. The way this\
    \ worked in our raytracer is exactly the same way it works in our rasterizer.\n\
    \nThe more interesting part, which we’ll explore in this chapter, is how to extend\
    \ the “illumination at a point” algorithms we developed into “illumination at\
    \ every point of a triangle” algorithms.\n\n#### Flat Shading\n\nLet’s start simple.\
    \ Since we can compute illumination at a point, we can just pick any point in\
    \ a triangle (for example, its center), compute the illumination at that point,\
    \ and use it to shade the whole triangle. To do the actual shading, we can multiply\
    \ the color of the triangle by the illumination value. [Figure 13-1](#ch13.xhtml_ch13fig1)\
    \ shows the results.\n\n![image](Images/13fig01.jpg)\n\n*Figure 13-1: In flat\
    \ shading, we compute illumination at the center of the triangle and use it for\
    \ the entire triangle.*\n\nThe results are promising. Every point in a triangle\
    \ has the same normal, so as long as a light is reasonably far from it, the light\
    \ vectors for every point are *approximately* parallel and every point receives\
    \ *approximately* the same amount of light. The discontinuity between the two\
    \ triangles that make up each side of the cube, especially visible on the green\
    \ face in [Figure 13-1](#ch13.xhtml_ch13fig1), is a consequence of the light vectors\
    \ being *approximately*, but not *exactly*, parallel.\n\nSo what happens if we\
    \ try this technique with an object for which every point has a different normal,\
    \ like the sphere in [Figure 13-2](#ch13.xhtml_ch13fig2)?\n\n![image](Images/13fig02.jpg)\n\
    \n*Figure 13-2: Flat shading works reasonably well for objects with flat faces,\
    \ but not so well for objects that are supposed to be curved.*\n\nNot so good.\
    \ It is very obvious that the object is not a true sphere, but an approximation\
    \ made out of flat, triangular patches. Because this kind of illumination makes\
    \ curved objects look flat, it’s called *flat shading*.\n\n#### Gouraud Shading\n\
    \nHow can we remove these discontinuities in lighting? Instead of computing illumination\
    \ only at the center of a triangle, we can compute illumination at its three vertices.\
    \ This gives us three illumination values between 0.0 and 1.0, one for each vertex\
    \ of the triangle. This puts us in exactly the same situation as [Chapter 8](#ch08.xhtml_ch08):\
    \ we can use `DrawShadedTriangle` directly, using the illumination values as the\
    \ “intensity” attribute.\n\nThis technique is called *Gouraud shading*, after\
    \ Henri Gouraud, who came up with the idea in 1971. [Figure 13-3](#ch13.xhtml_ch13fig3)\
    \ shows the results of applying it to the cube and the sphere.\n\n![image](Images/13fig03.jpg)\n\
    \n*Figure 13-3: In Gouraud shading, we compute illumination at the vertices of\
    \ the triangle and interpolate them across its surface.*\n\nThe cube looks better:\
    \ the discontinuity is gone, because both triangles of each face share two vertices\
    \ and they have the same normal, so the illumination at these two vertices is\
    \ identical for both triangles.\n\nThe sphere, however, still looks faceted, and\
    \ the discontinuities on its surface look really wrong. This shouldn’t be surprising:\
    \ we’re treating the sphere as a collection of flat surfaces. In particular, despite\
    \ every triangle sharing vertices with its neighboring triangles, they have different\
    \ normals. [Figure 13-4](#ch13.xhtml_ch13fig4) shows the problem.\n\n![image](Images/13fig04.jpg)\n\
    \n*Figure 13-4: We get two different values for the illumination at the shared\
    \ vertex, because they depend on the normals of the triangles, which are different.*\n\
    \nLet’s take a step back. The fact that we’re using flat triangles to represent\
    \ a curved object is a limitation of our techniques, not a property of the object\
    \ itself.\n\nEach vertex in the sphere model corresponds to a point on the sphere,\
    \ but the triangles they define are just an approximation of its surface. It would\
    \ be a good idea to make the vertices in the model represent the points in the\
    \ sphere as closely as possible. That means, among other things, using the actual\
    \ sphere normals for each vertex, as shown in [Figure 13-5](#ch13.xhtml_ch13fig5).\n\
    \n![image](Images/13fig05.jpg)\n\n*Figure 13-5: We can give each vertex the normal\
    \ of the curved surface it represents.*\n\nNote that this doesn’t apply to the\
    \ cube; even though triangles share vertex positions, each face needs to be shaded\
    \ independently of the others. There’s no single “correct” normal for the vertices\
    \ of a cube.\n\nOur renderer has no way to know whether a model is supposed to\
    \ be an approximation of a curved object or the exact representation of a flat\
    \ one. After all, a cube is a very crude approximation of a sphere! To solve this,\
    \ we’ll make the triangle normals part of the model, so its designer can make\
    \ this decision.\n\nSome objects, like the sphere, have a single normal per vertex.\
    \ Other objects, like the cube, have a different normal for each triangle that\
    \ uses the vertex. So we can’t make the normals a property of the vertices:\n\n\
    ```\nmodel {\n  name = cube\n  vertices {\n    0 = { position = (0, 0, 0), normal\
    \ = (-1, -1, -1) }\n    1 = { position = (1, 0, 0), normal = (1, -1, -1) }\n \
    \   2 = { position = (1, 1, 0), normal = (1, 1, -1) }\n    3 = { position = (0,\
    \ 1, 0), normal = (-1, 1, -1) }\n    4 = { position = (0, 0, 1), normal = (-1,\
    \ -1, 1) }\n    5 = { position = (1, 0, 1), normal = (1, -1, 1) }\n    6 = { position\
    \ = (1, 1, 1), normal = (1, 1, 1) }\n    7 = { position = (0, 1, 1), normal =\
    \ (-1, 1, 1) }\n  }\n  triangles {\n    0 = { vertices = (0, 1, 2), normal = (0,\
    \ 0, -1) }\n    1 = { vertices = (0, 2, 3), normal = (0, 0, -1) }\n    2 = { vertices\
    \ = (4, 5, 6), normal = (0, 0, 1) }\n    3 = { vertices = (4, 6, 7), normal =\
    \ (0, 0, 1) }\n    4 = { vertices = (0, 1, 5), normal = (-1, 0, 0) }\n    5 =\
    \ { vertices = (0, 5, 4), normal = (-1, 0, 0) }\n    6 = { vertices = (1, 2, 6),\
    \ normal = (1, 0, 0) }\n    7 = { vertices = (1, 6, 5), normal = (1, 0, 0) }\n\
    \    8 = { vertices = (0, 3, 7), normal = (0, 1, 0) }\n    9 = { vertices = (0,\
    \ 7, 4), normal = (0, 1, 0) }\n    10 = { vertices = (2, 3, 6), normal = (0, 1,\
    \ 0) }\n    11 = { vertices = (2, 6, 7), normal = (0, 1, 0) }\n  }\n}\n```\n\n\
    [Figure 13-6](#ch13.xhtml_ch13fig6) shows the scene rendered using Gouraud shading\
    \ and the appropriate normals.\n\n![image](Images/13fig06.jpg)\n\n*Figure 13-6:\
    \ Gouraud shading with normal specified in the model. The cubes still look like\
    \ cubes, and the sphere now looks like a sphere.*\n\nThe cubes still look like\
    \ cubes, and the sphere now looks like a sphere. In fact, you can only tell it’s\
    \ made of triangles by looking at its outline. This could be improved by using\
    \ more, smaller triangles, at the expense of requiring computing power.\n\nGouraud\
    \ shading starts breaking down when we try to render shiny objects, though; the\
    \ specular highlight on the sphere is decidedly unrealistic.\n\nThis is an indication\
    \ of a more general problem. When we move a point light very close to a big face,\
    \ we’d naturally expect it to look brighter and the specular effects to become\
    \ more pronounced; however, Gouraud shading produces the exact opposite ([Figure\
    \ 13-7](#ch13.xhtml_ch13fig7)).\n\n![image](Images/13fig07.jpg)\n\n*Figure 13-7:\
    \ Contrary to our expectations, the closer the point light is to a face, the darker\
    \ it looks.*\n\nWe expect points near the center of the triangle to receive a\
    \ lot of light, because the normals are roughly parallel. However, we’re not computing\
    \ lighting at the center of the triangle, but at its vertices. This means that\
    \ every interior pixel will end up with an intensity value that is the result\
    \ of interpolating between two small values, which is also a low value, as shown\
    \ in [Figure 13-8](#ch13.xhtml_ch13fig8).\n\n![image](Images/13fig08.jpg)\n\n\
    *Figure 13-8: Interpolating illumination from the vertices, which are dark, results\
    \ in a dark center, although the normal is parallel to the light vector at that\
    \ point.*\n\n#### Phong Shading\n\nWe can overcome the limitations of Gouraud\
    \ shading, but as usual, there’s a trade-off between quality and resource usage.\n"
  raw: 'In [Chapter 3](#ch03.xhtml_ch03), we looked at all we need to know about illumination.
    We can define ambient, point, and directional lights, and we can compute the illumination
    at any point in the scene given its position and a surface normal at that point:


    ![image](Images/f0164-01.jpg)


    This illumination equation expresses how light illuminates a point in the scene.
    The way this worked in our raytracer is exactly the same way it works in our rasterizer.


    The more interesting part, which we’ll explore in this chapter, is how to extend
    the “illumination at a point” algorithms we developed into “illumination at every
    point of a triangle” algorithms.


    ### Flat Shading


    Let’s start simple. Since we can compute illumination at a point, we can just
    pick any point in a triangle (for example, its center), compute the illumination
    at that point, and use it to shade the whole triangle. To do the actual shading,
    we can multiply the color of the triangle by the illumination value. [Figure 13-1](#ch13.xhtml_ch13fig1)
    shows the results.


    ![image](Images/13fig01.jpg)


    *Figure 13-1: In flat shading, we compute illumination at the center of the triangle
    and use it for the entire triangle.*


    The results are promising. Every point in a triangle has the same normal, so as
    long as a light is reasonably far from it, the light vectors for every point are
    *approximately* parallel and every point receives *approximately* the same amount
    of light. The discontinuity between the two triangles that make up each side of
    the cube, especially visible on the green face in [Figure 13-1](#ch13.xhtml_ch13fig1),
    is a consequence of the light vectors being *approximately*, but not *exactly*,
    parallel.


    So what happens if we try this technique with an object for which every point
    has a different normal, like the sphere in [Figure 13-2](#ch13.xhtml_ch13fig2)?


    ![image](Images/13fig02.jpg)


    *Figure 13-2: Flat shading works reasonably well for objects with flat faces,
    but not so well for objects that are supposed to be curved.*


    Not so good. It is very obvious that the object is not a true sphere, but an approximation
    made out of flat, triangular patches. Because this kind of illumination makes
    curved objects look flat, it’s called *flat shading*.


    ### Gouraud Shading


    How can we remove these discontinuities in lighting? Instead of computing illumination
    only at the center of a triangle, we can compute illumination at its three vertices.
    This gives us three illumination values between 0.0 and 1.0, one for each vertex
    of the triangle. This puts us in exactly the same situation as [Chapter 8](#ch08.xhtml_ch08):
    we can use DrawShadedTriangle directly, using the illumination values as the “intensity”
    attribute.


    This technique is called *Gouraud shading*, after Henri Gouraud, who came up with
    the idea in 1971\. [Figure 13-3](#ch13.xhtml_ch13fig3) shows the results of applying
    it to the cube and the sphere.


    ![image](Images/13fig03.jpg)


    *Figure 13-3: In Gouraud shading, we compute illumination at the vertices of the
    triangle and interpolate them across its surface.*


    The cube looks better: the discontinuity is gone, because both triangles of each
    face share two vertices and they have the same normal, so the illumination at
    these two vertices is identical for both triangles.


    The sphere, however, still looks faceted, and the discontinuities on its surface
    look really wrong. This shouldn’t be surprising: we’re treating the sphere as
    a collection of flat surfaces. In particular, despite every triangle sharing vertices
    with its neighboring triangles, they have different normals. [Figure 13-4](#ch13.xhtml_ch13fig4)
    shows the problem.


    ![image](Images/13fig04.jpg)


    *Figure 13-4: We get two different values for the illumination at the shared vertex,
    because they depend on the normals of the triangles, which are different.*


    Let’s take a step back. The fact that we’re using flat triangles to represent
    a curved object is a limitation of our techniques, not a property of the object
    itself.


    Each vertex in the sphere model corresponds to a point on the sphere, but the
    triangles they define are just an approximation of its surface. It would be a
    good idea to make the vertices in the model represent the points in the sphere
    as closely as possible. That means, among other things, using the actual sphere
    normals for each vertex, as shown in [Figure 13-5](#ch13.xhtml_ch13fig5).


    ![image](Images/13fig05.jpg)


    *Figure 13-5: We can give each vertex the normal of the curved surface it represents.*


    Note that this doesn’t apply to the cube; even though triangles share vertex positions,
    each face needs to be shaded independently of the others. There’s no single “correct”
    normal for the vertices of a cube.


    Our renderer has no way to know whether a model is supposed to be an approximation
    of a curved object or the exact representation of a flat one. After all, a cube
    is a very crude approximation of a sphere! To solve this, we’ll make the triangle
    normals part of the model, so its designer can make this decision.


    Some objects, like the sphere, have a single normal per vertex. Other objects,
    like the cube, have a different normal for each triangle that uses the vertex.
    So we can’t make the normals a property of the vertices; they need to be a property
    of the triangles that use them:


    model {


        name = cube


        vertices {


            0 = (-1, -1, -1)


            1 = (-1, -1,  1)


            2 = (-1,  1,  1)


            ...


        }


        triangles {


            0 = {


                vertices = [0, 1, 2]


                normals = [(-1, 0, 0), (-1, 0, 0), (-1, 0, 0)]


            }


            ...


        }


    }


    [Figure 13-6](#ch13.xhtml_ch13fig6) shows the scene rendered using Gouraud shading
    and the appropriate vertex normals.


    ![image](Images/13fig06.jpg)


    *Figure 13-6: Gouraud shading with normal vectors specified in the model. The
    cubes still look like cubes, and the sphere now looks like a sphere.*


    The cubes still look like cubes, and the sphere now looks remarkably like a sphere.
    In fact, you can only tell it’s made out of triangles by looking at its outline.
    This could be improved by using more, smaller triangles, at the expense of requiring
    more computing power.


    Gouraud shading starts breaking down when we try to render shiny objects, though;
    the specular highlight on the sphere is decidedly unrealistic.


    This is an indication of a more general problem. When we move a point light very
    close to a big face, we’d naturally expect it to look brighter and the specular
    effects to become more pronounced; however, Gouraud shading produces the exact
    opposite ([Figure 13-7](#ch13.xhtml_ch13fig7)).


    ![image](Images/13fig07.jpg)


    *Figure 13-7: Contrary to our expectations, the closer the point light is to a
    face, the darker it looks.*


    We expect points near the center of the triangle to receive a lot of light, because
    ![Images](Images/f0170-02.jpg) and ![Images](Images/f0034-01.jpg) are roughly
    parallel. However, we’re not computing lighting at the center of the triangle,
    but at its vertices. There, the closer the light is to the surface, the *bigger*
    the angle with the normal, so they receive little illumination. This means that
    every interior pixel will end up with an intensity value that is the result of
    interpolating between two small values, which is also a low value, as shown in
    [Figure 13-8](#ch13.xhtml_ch13fig8).


    ![image](Images/13fig08.jpg)


    *Figure 13-8: Interpolating illumination from the vertices, which are dark, results
    in a dark center, although the normal is parallel to the light vector at that
    point.*


    So, what to do?


    ### Phong Shading


    We can overcome the limitations of Gouraud shading, but as usual, there’s a trade-off
    between quality and resource usage.'
