    *Figure 3-1: A point light at `Q`. The `![Images](Images/larr1.jpg)` vector is
    different for every point `P`.*


    ## Directional Lights


    If a point light is a good approximation of a light bulb, does it also work as
    an approximation of the Sun?


    This is a tricky question, and the answer depends on what we are trying to render.
    At the solar-system scale, the Sun can be approximated as a point light. After
    all, it emits light from a point, and it emits in all directions, so it seems
    to qualify.


    However, if our scene represents something happening on Earth, it’s not such a
    good approximation. The Sun is so far away that every ray of light that reaches
    us has almost exactly the same direction. We could approximate this with a point
    light located very, very, very far away from the objects in the scene. However,
    the distance between the light and the objects would be orders of magnitude greater
    than the distance between objects, so we’d start running into numerical accuracy
    errors.


    To better handle these situations, we define `directional lights`. Like point
    lights, directional lights have an intensity, but unlike them, they don’t have
    a position; instead, they have a fixed `direction`. You can think of them as infinitely
    distant point lights located in the specified direction.


    While in the case of point lights we need to compute a different light vector
    `![Images](Images/larr.jpg)` for every point `P` in the scene, in this case `![Images](Images/larr.jpg)`
    is given. In the Sun-to-Earth scene example, `![Images](Images/larr.jpg)` would
    be `(center of Sun) – (center of Earth)`. [Figure 3-2](#ch03.xhtml_ch3fig2) shows
    what this looks like.


    ![image](Images/03fig02.jpg)


    *Figure 3-2: A directional light. The `![Images](Images/larr1.jpg)` vector is
    the same for every point `P`.*


    As we can see here, the light vector of a directional light is the same for every
    point in the scene. Compare this with [Figure 3-1](#ch03.xhtml_ch3fig1), where
    the light vector of a point light is different for every point in the scene.


    ## Ambient Light


    Can every real-life light be modeled as a point or directional light? Pretty much.
    Are these two types of light enough to light a scene? Unfortunately not.


    Consider what happens to the Moon. The only significant light source nearby is
    the Sun. So the “front half” of the Moon with respect to the Sun gets all its
    light, and its “back half” is in complete darkness. We see this from different
    angles from Earth, creating what we call the “phases” of the Moon.


    However, the situation down here on Earth is a bit different. Even points that
    don’t receive light directly from a light source aren’t completely in the dark
    (just look at the floor under your chair). How do rays of light reach these points
    if their “view” of the light sources is obstructed by something else?


    As mentioned in “Color Models” in [Chapter 1](#ch01.xhtml_ch01), when light hits
    an object, part of it is absorbed, but the rest is scattered back into the scene.
    This means that light can come not only from light sources, but also from objects
    that get light from light sources and scatter part of it back into the scene.
    But why stop there? The scattered light will in turn hit some other object, part
    of it will be absorbed, and part of it will be scattered back into the scene.
    And so on, until all of the energy of the original light has been absorbed by
    the surfaces in the scene.


    This means we should treat `every object` as a light source. As you can imagine,
    this would add a lot of complexity to our model, so we won’t explore that mechanism
    in this book. If you’re curious, search for `global illumination` and marvel at
    the pretty pictures.


    But we still don’t want every object to be either directly illuminated or completely
    dark (unless we’re actually rendering a model of the solar system). To overcome
    this limitation, we’ll define a third type of light source, called `ambient light`,
    which is characterized only by its intensity. We’ll declare that an ambient light
    contributes some light to every point in the scene, regardless of where it is.
    It’s a gross oversimplification of the very complex interaction between the light
    sources and the surfaces in the scene, but it works well enough.


    In general, a scene will have a single ambient light (because ambient lights only
    have an intensity value, any number of them can be trivially combined into a single
    ambient light) and an arbitrary number of point and directional lights.


    ### Illumination of a Single Point


    Now that we know how to define the lights in a scene, we need to figure out how
    the lights interact with the surfaces of the objects in the scene.


    In order to compute the illumination of a single point, we’ll compute the amount
    of light contributed by each light source and add them together to get a single
    number representing the total amount of light the point receives. We can then
    multiply the color of the surface at that point by this amount to get the shade
    of color that represents how much light it receives.


    So, what happens when a ray of light, be it from a directional light or a point
    light, hits a point on some object in our scene?


    We can intuitively classify objects into two broad classes, depending on how they
    reflect light: “matte” and “shiny” objects. Since most objects around us can be
    classified as matte, we’ll focus on this group first.


    ## Diffuse Reflection


    When a ray of light hits a matte object, the ray is scattered back into the scene
    equally in every direction, a process called `diffuse reflection`; this is what
    makes matte objects look matte.


    To verify this, look at some matte object around you, such as a wall. If you move
    with respect to the wall, its color doesn’t change. That is, the light you see
    reflected from the object is the same no matter where you’re looking from.


    On the other hand, the amount of light reflected does depend on the `angle` between
    the ray of light and the surface. Intuitively, this happens because the energy
    carried by the ray has to spread over a smaller or bigger area depending on the
    angle, so the energy reflected to the scene per unit of area is higher or lower,
    respectively, as shown in [Figure 3-3](#ch03.xhtml_ch3fig3).


    ![image](Images/03fig03.jpg)


    *Figure 3-3: The energy of a ray of light spreads over areas of different size,
    depending on its angle to the surface.*


    In [Figure 3-3](#ch03.xhtml_ch3fig3), we can see two rays of light of the same
    intensity (represented by having the same width) hitting a surface head-on and
    at an angle. The energy carried by the rays of light spreads uniformly across
    the areas they hit. The energy of the ray on the right spreads across a bigger
    area than that of the ray on the left, and therefore each point in its area receives
    less energy than in the left-hand case.


    To explore this mathematically, let’s characterize the orientation of a surface
    by its `normal vector`. The normal vector of a surface at point `P`, or simply
    “the normal,” is a vector perpendicular to the surface at `P`. It’s also a unit
    vector, meaning its length is 1\. We’ll call this vector `![Images](Images/narr.jpg)`.


    ### Modeling Diffuse Reflection


    A ray of light with direction `![Images](Images/larr.jpg)` and intensity `I` hits
    a surface with normal `![Images](Images/narr.jpg)`. What fraction of `I` is reflected
    back to the scene, as a function of `I`, `![Images](Images/narr.jpg)`, and `![Images](Images/larr.jpg)`?

    '
