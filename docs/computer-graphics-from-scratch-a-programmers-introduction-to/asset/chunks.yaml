- fmt: '

    Our rasterizer renders the scene in a single `pass`; it goes over every triangle
    in the scene and renders it on the canvas, computing the full illumination equation
    every time (on a per-triangle, per-vertex, or per-pixel basis, depending on the
    shading algorithm). At the end of this process, the canvas contains the final
    render of the scene.


    We’ll start by modifying the rasterizer to render the scene in several `passes`,
    one for each light in the scene (including the ambient light). Like before, each
    pass goes over every triangle, but it computes the illumination equation taking
    into account only the light associated with that pass.


    This gives us a set of images of the scene illuminated by each light separately.
    We can `compose` them together—that is, add them pixel by pixel—giving us the
    final render of the scene. This final image is identical to the image produced
    by the single-pass version. [Figure 15-3](#ch15.xhtml_ch15fig3) shows three light
    passes and the final composite for our reference scene.


    ![image](Images/15fig03.jpg)


    *Figure 15-3: A scene rendered using one pass per light*


    This lets us simplify our goal of “rendering a scene with shadows from multiple
    lights” into “rendering a scene with shadows from a single light, many times.”
    Now we need to find a way to render a scene illuminated by a single light, while
    leaving the pixels that are in shadow from that light completely black.


    For this, we introduce the `stencil buffer`. Like the depth buffer, it has the
    same dimensions as the canvas, but its elements are integers. We can use it as
    a stencil for rendering operations, for example, modifying our rendering code
    to draw a pixel on the canvas only if the corresponding element in the stencil
    buffer has a value of zero.


    If we can set up the stencil buffer in such a way that illuminated pixels have
    a value of zero and pixels in shadow have a nonzero value, we can use it to draw
    only the pixels that are illuminated.


    ### Creating Shadow Volumes


    To set up the stencil buffer, we use something called `shadow volumes`. A shadow
    volume is a 3D polygon “wrapped” around the volume of space that’s in shadow from
    a light.


    We construct a shadow volume for each object that might cast a shadow on the scene.
    First, we determine which edges are part of the silhouette of the object; these
    are the edges between front-facing and back-facing triangles (we can use the dot
    product to classify the triangles, like we did for the back-face culling technique
    in [Chapter 12](#ch12.xhtml_ch12)). Then, for each of these edges, we extrude
    them away from the direction of the light, all the way to infinity—or, in practice,
    to a really big distance beyond the scene.


    This gives us the “sides” of the shadow volume. The “front” of the volume is made
    by the front-facing triangles of the object itself, and the “back” of the volume
    can be computed by creating a polygon whose edges are the “far” edges of the extruded
    sides.


    [Figure 15-4](#ch15.xhtml_ch15fig4) shows the shadow volume created this way for
    a cube with respect to a point light.


    ![image](Images/15fig04.jpg)


    *Figure 15-4: The shadow volume of a cube with respect to a point light*


    Next, we’ll see how to use the shadow volumes to determine which pixels in the
    canvas are in shadow with respect to a light.


    ### Counting Shadow Volume–Ray Intersections


    Imagine a ray starting from the camera and going into the scene until it hits
    a surface. Along the way, it might enter and leave any number of shadow volumes.


    We can keep track of this with a counter that starts at zero. Every time the ray
    enters a shadow volume, we increment the counter; every time it leaves, we decrement
    it. We stop when the ray hits a surface and look at the counter. If it’s zero,
    it means the ray entered as many shadow volumes as it left, so the point must
    be illuminated; if it’s not zero, it means the ray is inside at least one shadow
    volume, so the point must be in shadow. [Figure 15-5](#ch15.xhtml_ch15fig5) shows
    a few examples of this.


    However, this only works if the camera itself is not inside a shadow volume! If
    a ray starts inside the shadow volume and doesn’t leave it before hitting the
    surface, our algorithm would incorrectly conclude that it’s illuminated.


    ![image](Images/15fig05.jpg)


    *Figure 15-5: Counting the intersections between rays and shadow volumes tells
    us whether a point along the ray is illuminated or in shadow.*


    We could check for this condition and adjust the counter accordingly, but counting
    how many shadow volumes a point is inside of is an expensive operation. Fortunately,
    there’s a way to overcome this limitation that is simpler and cheaper, if somewhat
    counter-intuitive.


    Rays are infinite, but shadow volumes aren’t. This means a ray always starts and
    ends outside a shadow volume. This, in turn, means that a ray always enters a
    shadow volume as many times as it leaves it; the counter for the entire ray must
    always be zero.


    Suppose we keep track of the intersections between the ray and the shadow volume
    *after* the ray hits the surface. If the counter has a value of zero, then the
    value must also be zero *before* the ray hits the surface. If the counter has
    a nonzero value, it must have the opposite value on the other side of the surface.


    This means counting intersections between the ray and the shadow volume before
    the ray hits the surface is equivalent to counting the intersections after it—but
    in this case, we don’t have to worry about the position of the camera! [Figure
    15-6](#ch15.xhtml_ch15fig6) shows how this technique always produces correct results.


    ![image](Images/15fig06.jpg)


    *Figure 15-6: The counters have a value of zero for points that receive light,
    and a nonzero value for points that are in shadow, regardless of whether the camera
    is inside or outside the volume.*


    ### Setting up the Stencil Buffer


    We’re working with a rasterizer, not with a raytracer, so we need to find a way
    to keep these counters without actually computing intersections between rays and
    shadow volumes. We can do this by using the stencil buffer.


    First, we render the scene as illuminated only by the ambient light. The ambient
    light casts no shadows, so we can do this without any changes to the rasterizer.
    This gives us one of the images we need to compose the final render, but it also
    gives us depth information for the scene, as seen from the camera, contained in
    the depth buffer. We need to keep this depth buffer for the next steps.


    Next, for each light, we follow these steps:


    1. `Render` the back faces of the shadow volumes to the stencil buffer, incrementing
    its value whenever the pixel *fails* the depth buffer test. This counts the number
    of times the ray leaves a shadow volume after hitting the closest surface.

    2. `Render` the front faces of the shadow volumes to the stencil buffer, decrementing
    its value whenever the pixel *fails* the depth buffer test. This counts the number
    of times the ray enters a shadow volume after hitting the closest surface.


    Note that during the `rendering` steps, we’re only interested in modifying the
    stencil buffer; there’s no need to write pixels to the canvas, and therefore no
    need to calculate illumination or texturing. We also don’t write to the depth
    buffer, because the sides of the shadow volumes aren’t actually physical objects
    in the scene. Instead, we use the depth buffer we computed during the ambient
    lighting pass.


    After doing this, the stencil buffer has zeros for the pixels that are illuminated
    and other values for the pixels that are in shadow. So we render the scene normally,
    illuminated by the single light corresponding to this pass, calling `PutPixel`
    only on the pixels where the stencil buffer has a value of zero.

    '
