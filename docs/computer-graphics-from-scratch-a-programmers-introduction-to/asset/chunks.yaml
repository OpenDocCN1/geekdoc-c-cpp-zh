    ## 致谢

    很少有书是一夜之间而成的；你即将阅读的这本书几乎花费了近 20 年的时间。正如你可能猜想的那样，许多人以各种方式参与了它的故事，我想感谢他们。按时间顺序排列：


    Omar Paganini 和 Ernesto Ocampo Edye 作为乌拉圭大学（Universidad del Uruguay）工程学院院长和计算机科学主任，在我认为是最佳时机时让我接管了计算机图形学工作，他们付给了我极大的信任。同事
    Roberto Lublinerman 在我教学的第一年一直是我伟大的导师。


    我 2003 年至 2008 年的学生们 除了我不断演化的教学方法中的无意“小白鼠”外，他们还接受并尊重一位比他们只大一岁的教授（在某些情况下甚至比他们小）。当他们创建出第一张光线追踪图像时脸上的快乐让这一切都值了。


    Alejandro Segovia Azapian 从学生变为助教再变为朋友，他的投入帮助我随时间演变了素材；看到他随后在实时渲染和性能优化领域非常成功的职业生涯包含了我一小部分，我感到非常自豪。他还是这本书的技术评审员，他的贡献涵盖了从修复错别字到对某些章节提出深度结构改进建议。


    JC Van Winkel 他完成了自己的编辑工作，并提出了许多宝贵的改进建议。


    Hacker News 的读者 我的课程笔记、图表和演示登上了 Hacker News 的首页，引起了大量的关注——包括 Starch Press 的关注。如果没有这些，这本书可能永远不会存在。


    Bill Pollock, Alex Freed, Kassie Andreadis 以及 Starch Press 团队 他们指导我清理并重塑了课程笔记和图表，这些内容在我看来基本上可以出版成书了，但他们将其变成了真正的书。他们将原始材料提升到了全新的高度；我不知道这需要如此大量的心力，Alex、Kassie
    和团队表现得非常出色。封面上只有我一个名字，但请不要误会，这是一个集体努力的结果。


    ## 引言

    ![image](img/common.jpg)


    计算机图形学是一个迷人的的话题。你如何从几个算法和一些几何数据，创造出《星球大战》、《复仇者联盟》等电影的特效，《玩具总动员》和《冰雪奇缘》等动画电影，或者是《堡垒之夜》、《使命召唤》等热门视频游戏的画面？


    计算机图形学也是一个广泛得令人惊讶的话题：从渲染 3D 场景到创建图像过滤器，从数字字体到模拟粒子系统，许多学科都可以被认为是计算机图形学的一部分。一本书无法涵盖所有这些主题，那需要一个图书馆。这本书专注于
    3D 场景渲染这一个主题。


