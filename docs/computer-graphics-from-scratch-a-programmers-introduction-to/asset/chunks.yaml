    normal map and the appropriate per-pixel shading, we create the illusion of extra
    geometrical detail. In (b) and (c), the shading of the diamonds depends on the
    direction of the incident light, and our brain interprets this as the diamonds
    having volume.


    There are a couple of practical considerations to keep in mind. First, the orientations
    of the vectors in the normal map are relative to the surface of the triangle they
    apply to. The coordinate system used for this is called *tangent space*, where
    two of the axes (usually *X* and *Z*) are tangent to (that is, embedded in) the
    surface and the remaining vector is perpendicular to the surface. At rendering
    time, the normal vector of the triangle, expressed in camera space, is modified
    according to the vector in the normal map to obtain a final normal vector that
    can be used for the illumination equations. This makes a normal map independent
    of the position and orientation of the object in the scene.


    Second, a very popular way to encode normal maps is as textures, mapping the values
    of *X*, *Y*, and *Z* to *R*, *G*, and *B* values. This gives normal maps a very
    characteristic purple-ish appearance, because purple, a combination of red and
    blue but no green, encodes flat areas of the surface. [Figure 15-2](#ch15.xhtml_ch15fig2)
    shows the normal map used in the examples in [Figure 15-1](#ch15.xhtml_ch15fig1).


    ![image](Images/15fig02.jpg)


    *Figure 15-2: The normal map used for the examples in [Figure 15-1](#ch15.xhtml_ch15fig1),
    encoded as a RGB texture*


    While this technique can drastically improve the perceived complexity of surfaces
    in a scene, it’s not without limitations. For example, since flat surfaces remain
    flat, it can’t change the silhouette of an object. For the same reason, the illusion
    breaks down when a normal-mapped surface is viewed from an extreme angle or up
    close, or when the features represented by the normal map are too big compared
    to the size of the surface. This technique is better suited to subtle detail,
    such as pores on the skin, the pattern on a stucco wall, or the irregular appearance
    of an orange peel. For this reason, the technique is also known as *bump mapping*.


    ### Environment Mapping


    One of the most striking characteristics of the raytracer we developed is the
    ability to show objects reflecting one another. It is possible to create a relatively
    convincing, but somewhat fake, implementation of reflections in our rasterizer.


    Imagine we have a scene representing a room in a house, and we want to render
    a reflective object placed in the middle of the room. For each pixel representing
    the surface of that object, we know the 3D coordinates of the point it represents,
    the surface normal at that point, and, since we know the position of the camera,
    we can also compute the view vector to that point. We could reflect the view vector
    with respect to the surface normal to obtain a reflection vector, just like we
    did in [Chapter 4](#ch04.xhtml_ch04).


    At this point, we want to know the color of the light coming from the direction
    of the reflection vector. If this were a raytracer, we’d just trace a ray in that
    direction and find out. However, this is not a raytracer. What to do?


    *Environment mapping* provides one possible answer to this question. Suppose that
    before rendering the objects inside the room, we place a camera in the middle
    of it and render the scene six times—once for each perpendicular direction (up,
    down, left, right, front, back). You can imagine the camera is inside an imaginary
    cube, and each side of the cube is the viewport of one of these renders. We keep
    these six renders as textures. We call this set of six textures a *cube map*,
    which is why this technique is also called *cube mapping*.


    Then we render the reflective object. When we get to the point of needing a reflected
    color, we can use the direction of the reflected vector to choose one of the textures
    of the cube map, and then a texel of that texture to get an approximation of the
    color seen in that direction—all without tracing a single ray!


    This technique has some drawbacks. The cube map captures the appearance of a scene
    from a single point. If the reflective object we’re rendering isn’t located at
    that point, the position of the reflected objects won’t fully match what we would
    expect, so it will become clear that this is just an approximation. This would
    be especially noticeable if the reflective object were to move within the room,
    because the reflected scene wouldn’t change as the object moves.


    This limitation also suggests the best applications for the technique: if the
    “room” is big enough and distant enough from the object—that is, if the movement
    of the object is small with respect to the size of the room—the difference between
    the true reflection and the pre-rendered environment maps can go unnoticed. For
    example, this would work very well for a scene representing a reflective spaceship
    in deep space, since the “room” (the distant stars and galaxies) is infinitely
    far away for all practical purposes.


    Another drawback is that we’re forced to split the objects in the scene into two
    categories: static objects that are part of the “room,” which are seen in reflections,
    and dynamic objects that can be reflective. In some cases, this might be clear
    (walls and furniture are part of the room; people aren’t), but even then, dynamic
    objects wouldn’t be reflected on other dynamic objects.


    A final drawback worth mentioning is related to the resolution of the cube maps.
    Whereas in the raytracer we could trace very precise reflections, in this case
    we need to make a trade-off between accuracy (higher-resolution cube map textures
    produce sharper reflections) and memory consumption (higher-resolution cube map
    textures require more memory). In practice, this means that environment maps won’t
    produce reflections that are as sharp as true raytraced reflections, especially
    when looking at reflective objects up close.


    ### Shadows


    The raytracer we developed featured geometrically correct, very well-defined shadows.
    These were a very natural extension to the core algorithm. The architecture of
    a rasterizer makes it slightly more complex to implement shadows, but not impossible.


    Let’s start by formalizing the problem we’re trying to solve. In order to render
    shadows correctly, every time we compute the illumination equation for a pixel
    and a light, we need to know whether the pixel is actually illuminated by the
    light or whether it’s in the shadow of an object with respect to that light.


    With the raytracer, we could answer this question by tracing a ray from the surface
    to the light; in the rasterizer, we don’t have such a tool, so we’ll have to take
    a different approach. Let’s explore two different approaches.


    #### Stencil Shadows


    *Stencil shadows* is a technique to render shadows with very well-defined edges
    (imagine the shadows cast by objects on a very sunny day). These are often called
    *hard shadows*.'
