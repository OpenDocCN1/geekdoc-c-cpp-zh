    ![image](img/f0209-08.jpg)


    这提供了另一种计算向量长度的方法，即其与自身点积的平方根：


    ![image](img/f0209-09.jpg)


    ## 叉积


    两个向量之间的叉积会得到另一个向量。它使用叉乘算子表示，如 ![Images](img/f0209-10.jpg)


    两个向量的叉积是一个垂直于这两个向量的向量。在本书中，我们只对 3D 向量使用叉积，见图 A-7。


    ![image](img/Afig07.jpg)


    *图 A-7：两个向量的叉积是一个垂直于这两个向量的向量。*


    其计算过程比点积稍微复杂一点。如果 ![Images](img/f0041-01.jpg) = ![Images](img/f0170-06.jpg) ×
    ![Images](img/f0209-05.jpg)，那么：


    `R[x]` = `V[y]` ⋅ `W[z]` – `V[z]` ⋅ `W[y]`


    `R[y]` = `V[x]` ⋅ `W[z]` – `V[z]` ⋅ `W[x]`


    `R[z]` = `V[x]` ⋅ `W[y]` – `V[y]` ⋅ `W[x]`


    叉积不满足交换律。具体来说，![Images](img/f0210-01.jpg)。


    我们使用叉积来计算面的*法向量*——即一个垂直于平面的单位向量。为了做到这一点，我们在曲面上取两个向量，计算它们的叉积，并对结果进行归一化处理。


    ## 矩阵


    *矩阵*是一个数字的矩形数组。对于本书而言，矩阵表示可以应用于点或向量的*变换*，我们用大写字母来称呼它们，例如 `M`。这与我们表述点的方式相同，但通过上下文可以清楚我们是在论论矩阵还是点。


    矩阵的特征是其列数和行数。例如，这是一个 4 × 3 矩阵：


    ![image](img/f0210-02.jpg)


    ## 矩阵操作


    让我们看看用矩阵和向量可以做什么。


    ### 矩阵相加


    你可以加上两个矩阵，只要它们的大小相同。相加是逐元素完成的：


    ![image](img/f0211-01.jpg)


    ### 矩阵乘以数


    你可以将一个矩阵乘以一个数。你只需要将矩阵的每个元素乘以该数即可：


    ![image](img/f0211-02.jpg)


    ### 矩阵相乘


    你可以将两个矩阵相乘，只要它们的大小是兼容的：第一个矩阵的列数必须等于第二个矩阵的行数。例如，你可以将一个 2 × 3 矩阵乘以一个 3 × 4 矩阵，但反之不行！与数字不同，乘法的顺序是重要的，即使你相乘的是可以以任意顺序相乘的方矩阵。


    两个矩阵相乘的结果是另一个矩阵，其行数与左侧矩阵相同，列数与右侧矩阵相同。继续我们上面的例子，一个 2 × 3 矩阵乘以一个 3 × 4 矩阵的结果是一个
    2 × 4 矩阵。


    让我们看看如何相乘两个矩阵 `A` 和 `B`：


    ![image](img/f0211-03.jpg)


    为了为了更清楚，让我们把 `A` 和 `B` 中的值分组为向量：将 `A` 写为一行（水平）向量的列，将 `B` 写为一列（垂直）向量的行。例如，`A` 的第一行是向量
    (`a`, `b`, `c`)，而 `B` 的第二列是向量 (`h`, `l`, `p`)：


    ![image](img/f0211-04.jpg)![image](img/f0212-01.jpg)


    给这些向量命名：


    ![image](img/f0212-02.jpg)


    我们知道 `A` 是 2 × 3，`B` 是 3 × 4，所以知道结果将是一个 2 × 4 矩阵：


    ![image](img/f0212-03.jpg)


    现在我们可以为结果矩阵的元素使用一个简单的公式：结果中第 `r` 行第 `c` 列的元素值——即 `c[rc]`——是 `A` 中对应的行向量与 `B` 中列向量的点积，即
    ![Images](img/f0212-04.jpg) 和 ![Images](img/f0212-05.jpg)：


    ![image](img/f0212-06.jpg)


    例如 ![Images](img/f0212-07.jpg)，它展开为 `a` ⋅ `h` + `b` ⋅ `l` + `c` ⋅ `p`。


    ### 矩阵乘以向量


    你可以将一个 *n*-维向量视为 *n* × 1 垂直矩阵或 1 × *n* 水平矩阵，并以乘以两个兼容矩阵的方式进行计算。例如，这里是如何将一个 2 ×
    3 矩阵乘以一个 3D 向量：


    ![image](img/f0212-08.jpg)


    由于矩阵乘以向量（或乘以矩阵）的结果也是向量，在我们情况下，我们可以说矩阵*变换*了向量。


