    \ because we chose a formulation where `y = f(x)`; in fact, it’s the same reason\
    \ why we can’t draw vertical lines—an extreme case where all the values of `y`\
    \ correspond to the same value of `x`.\n\n### Drawing Lines with Any Slope\n\n\
