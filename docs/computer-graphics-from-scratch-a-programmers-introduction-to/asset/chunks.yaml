  raw: 'First, we need an image to paint on our triangles; in this context, we call
    this image a *texture*. [Figure 14-1](#ch14.xhtml_ch14fig1) shows a wooden crate
    texture.


    ![image](Images/14fig01.jpg)


    *Figure 14-1: Wooden crate texture (by Filter Forge—Attribution 2.0 Generic (CC
    BY 2.0) license)*


    Next, we need to specify how this texture is applied to the model. We can define
    this mapping on a per-triangle basis, by specifying which points of the texture
    should go on each vertex of the triangle ([Figure 14-2](#ch14.xhtml_ch14fig2)).


    ![image](Images/14fig02.jpg)


    *Figure 14-2: We associate a point in the texture with each vertex of the triangle.*


    To define this mapping, we need a coordinate system to refer to points in the
    texture. Remember, a texture is just an image, represented as a rectangular array
    of pixels. We could use *x* and *y* coordinates and talk about pixels in the texture,
    but we’re already using these names for the canvas. Therefore, we use *u* and
    *v* for the texture coordinates and we call the texture’s pixels *texels* (a contraction
    of *tex*ture *el*ements).


    We’ll fix the origin of this (*u*, *v*) coordinate system at the top-left corner
    of the texture. We’ll also declare that *u* and *v* are real numbers in the range
    [0,1], regardless of the actual texel dimensions of the texture. This is very
    convenient for several reasons. For example, we may want to use a lower- or higher-resolution
    texture depending on how much RAM we have available; because we’re not tied to
    the actual pixel dimensions, we can change resolutions without having to modify
    the model itself. We can multiply *u* and *v* by the texture width and height
    respectively to get the actual texel indices *tx* and *ty*.


    The basic idea of texture mapping is simple: we compute the (*u*, *v*) coordinates
    for each pixel of the triangle, fetch the appropriate texel from the texture,
    and paint the pixel with that color. But the model only specifies *u* and *v*
    coordinates for the three vertices of the triangle, and we need them for each
    pixel . . .


    By now you can probably see where this is going. Yes, it’s our good friend linear
    interpolation. We can use attribute mapping to interpolate the values of *u* and
    *v* across the face of the triangle, giving us (*u*, *v*) at each pixel. From
    this we can compute (*tx*, *ty*), fetch the texel, apply shading, and paint the
    pixel with the resulting color. You can see the result of doing this in [Figure
    14-3](#ch14.xhtml_ch14fig3).


    ![image](Images/14fig03.jpg)


    *Figure 14-3: The texture looks deformed when applied to the objects.*


    The results are a little underwhelming. The exterior shape of the crates looks
    fine, but if you pay close attention to the diagonal planks, you’ll notice they
    look deformed, as if bent in weird ways. What went wrong?


    As in [Chapter 12](#ch12.xhtml_ch12), we made an implicit assumption that turns
    out not to be true: namely, that *u* and *v* vary linearly across the screen.
    This is clearly not the case. Consider the wall of a very long corridor painted
    with alternating vertical black and white stripes. As the wall recedes into the
    distance, the vertical stripes should look thinner and thinner. If we make the
    *u* coordinate vary linearly with *x′*, we get incorrect results, as illustrated
    in [Figure 14-4](#ch14.xhtml_ch14fig4).


    ![image](Images/14fig04.jpg)


    *Figure 14-4: Linear interpolation of u and v (left) doesn’t produce the expected
    perspective-correct results (right).*


    The situation is very similar to the one we encountered in [Chapter 12](#ch12.xhtml_ch12),
    and the solution is also very similar: although *u* and *v* aren’t linear in screen
    coordinates, ![Images](Images/f0179-01.jpg) and ![Images](Images/f0179-02.jpg)
    are. (The proof is very similar to the ![Images](Images/f0170-07.jpg) proof: consider
    that *u* varies linearly in 3D space, and substitute *x* and *y* with their screen-space
    expressions.) Since we already have interpolated values of ![Images](Images/f0170-07.jpg)
    at each pixel, it’s enough to interpolate ![Images](Images/f0179-01.jpg) and ![Images](Images/f0179-02.jpg)
    and get *u* and *v* back:


    ![image](Images/f0179-04.jpg)


    This produces the result we expect, as you can see in [Figure 14-5](#ch14.xhtml_ch14fig5).


    ![image](Images/14fig05.jpg)


    *Figure 14-5: Linear interpolation of* u/z *and* v/z *does produce perspective-correct
    results*.


    [Figure 14-6](#ch14.xhtml_ch14fig6) shows the two results side by side, to make
    it easier to appreciate the difference.


    ![image](Images/14fig06.jpg)


    *Figure 14-6: A comparison of the “linear* u and v” *result (left) and the “linear*
    u/z *and* v/z” *result (right)*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/textures-demo](https://gabrielgambetta.com/cgfs/textures-demo)*.


    These examples look nice because the size of the texture and the size of the triangles
    we’re applying it to, measured in pixels, is roughly similar. But what happens
    if the triangle is several times bigger or smaller than the texture? We’ll explore
    those situations next.


    ### Bilinear Filtering


    Suppose we place the camera very close to one of the cubes. We’ll see something
    like [Figure 14-7](#ch14.xhtml_ch14fig7).


    ![image](Images/14fig07.jpg)


    *Figure 14-7: A textured object rendered from up close*


    The image looks very blocky. Why does this happen? The triangle on the screen
    has more pixels than the texture has texels, so each texel is mapped to many consecutive
    pixels.


    We are interpolating texture coordinates *u* and *v*, which are real values between
    0.0 and 1.0\. Later, given the texture dimensions *w* and *h*, we map the *u*
    and *v* coordinates to *tx* and *ty* texel coordinates by multiplying them by
    *w* and *h* respectively. But because a texture is an array of pixels with integer
    indices, we round *tx* and *ty* down to the nearest integer. For this reason,
    this basic technique is called *nearest neighbor filtering*.


    Even if (*u*, *v*) varies smoothly across the face of the triangle, the resulting
    texel coordinates “jump” from one whole pixel to the next, causing the blocky
    appearance we can see in [Figure 14-7](#ch14.xhtml_ch14fig7).


    We can do better. Instead of rounding *tx* and *ty* down, we can interpret a fractional
    texel coordinate (*tx*, *ty*) as describing a position *between* four integer
    texel coordinates (obtained by the combinations of rounding *tx* and *ty* up and
    down). We can take the four colors of the surrounding integer texels, and compute
    a linearly interpolated color for the fractional texel. This will produce a noticeably
    smoother result ([Figure 14-8](#ch14.xhtml_ch14fig8)).


    ![image](Images/14fig08.jpg)


    *Figure 14-8: A textured object rendered from up close, using interpolated colors*


    Let’s call the four surrounding pixels *TL*, *TR*, *BL*, and *BR* (for top-left,
    top-right, bottom-left, and bottom-right, respectively). Let’s take the fractional
    parts of *tx* and *ty* and call them *fx* and *fy*. [Figure 14-9](#ch14.xhtml_ch14fig9)
    shows *C*, the exact position described by (*tx*, *ty*), surrounded by the texels
    at integer coordinates, and its distance to them.


    ![image](Images/14fig09.jpg)


    *Figure 14-9: We linearly interpolate a color at* C *from the four texels that
    surround it.*


    First, we linearly interpolate the color at *CT*, which is between *TL* and *TR*:


    *CT* = (1 *–* *fx*) ⋅ *TL* + *fx* ⋅ *TR*


    Note that the weight for *TR* is *fx*, not (1 *– fx*). This is because as *fx*
    becomes closer to 1.0, we want *CT* to become closer to *TR*. Indeed, if *fx*
    = 0.0, then *CT* = *TL*, and if *fx* = 1.0, then *CT* = *TR*.


    We can compute *CB*, between *TL* and *TR*, in a similar way:


    *CB* = (1 *–* *fx*) ⋅ *BL* + *fx* ⋅ *BR*


    Finally, we compute *C*, linearly interpolating between *CT* and *CB*:


    *C* = (1 *–* *fy*) ⋅ *BT* + *fy* ⋅ *CB*


    In pseudocode, we can write a function to get the interpolated color corresponding
    to a fractional texel:


    GetTexel(texture, tx, ty) {


      fx = frac(tx)'
