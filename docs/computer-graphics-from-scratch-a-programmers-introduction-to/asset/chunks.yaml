  trans: '

    书中章节的顺序并不是渲染流水线中的操作顺序；正如引言中所解释的，章节的安排是为了尽可能快地看到可见的进展。


    裁剪（Clipping）是一项 3D 操作；它获取场景中的 3D 对象并在场景中生成一组新的 3D 对象，或者更准确地说，它计算了场景与裁剪体之间的交集部分。由于这个原因，裁剪必须在对象放置于场景之后（即使用经过模型和相机变换后的顶点）但在透视投影之前进行。


    本章介绍的技术虽然可靠，但非常通用。你对场景的先验知识越多，你的裁剪效率就越。。例如，许多游戏通过在关卡中添加可见性信息来对其进行预处理；如果你能将一个场景划分为多个“房间”，就可以制作一张表格，列出从任何给定房间可以看到哪些房间。在稍后渲染场景时，你只需要确定相机位于哪个房间，就可以安全地忽略那里所有标记为“不可见”的房间，从而在渲染过程中节省大量的资源。当然，权端是需要更多的预处理时间以及更僵化的场景结构。如果你对这个主题感兴趣，可以阅读关于
    BSP 分划分和门户系统（portal systems）的内容。


    ## 总结


    在本章中，我们最终消除了透视投影方程引起的主要限制之一。我们克服了只有相机前的顶点才能被有意义投影的限制。为了实现这一点，我们对“位于相机前方”给出了精确定义：位于五个平面定义的裁剪体内的物体。


    我们开发了计算场景与裁剪体之间几何交集的方程和算法。结果，我们可以获取整个场景并移除所有不可能投影到视口上的内容。这不仅避免了透视投影方程无法处理的情况，还通过移除投影到视口之外的几何体节省了计算资源。


    然而，在裁剪场景之后，我们可能会得到在最终画布上应该是可见但实际上并不可见的几何体，这可能是因为它们前面还有其他东西！我们将在下一章寻找处理这个问题的方法。


    ## 12 隐藏表面消除


    ![image](img/common.jpg)


    我们现在可以从任何角度渲染任何场景，但生成的图像在视觉上很简单：我们正在以线框模式渲染对象，给人一种我们正在看一组对象的蓝图，而不是对象本身的感觉。


    本书的剩余章节将侧重于提高渲染场景的视觉质量。到本章结束时，我们将能够渲染看起来是实心的对象（而不是线框）。我们已经开发了一个绘制填充三角形的算法，但正如我们将看到的，在
    3D 场景中正确地使用该算法并不像看起来那么简单！


    ### 渲染实心对象


    当我们想让实心对象看起来是实心的时，首先想到的主意是使用我们在第 7 章中开发的 `DrawFilledTriangle` 函数，使用随机颜色绘制对象的每个三角形（图
    12-1）。


    ![image](img/12fig01.jpg)


    *图 12-1：使用 `DrawFilledTriangle` 代替 `DrawWireframeTriangle` 并产生我们预期的结果。*


    图 12-1 中的形状看起来不像立方体，对吧？如果你仔细观察，就会发现问题所在：立方体背面的部分被画在了正面的之上！这是因为我们盲目地以“随机顺序”在画布上绘制
    2D 三角形，或者更准确地说，按照它们在模型的 `Triangles` 列表中偶然定义的顺序绘制，而没有考虑它们之间的空间关系。


    你可能想回到模型定义并改变三角形的顺序来解决这个问题。然而，如果我们的场景中包含另一个旋转了 180° 的立方体实例，我们将回到原来的问题。简而言之，没有一个单一的“正确”三角形顺序可以适用于每个实例和相机朝向。我们该怎么办？


    ### 画家算法


    解决这个问题的第一个解决方案被称为画家算法（painter’s algorithm）。现实中的画家先画背景，然后用前景物体覆盖它们的部分。我们可以通过按从后向前绘制场景中的所有三角形来达到相同的效果。为了这样做，我们需要应用模型和相机变换，并根据它们到相机的距离对三角形进行排序。


    这解决了上述的“没有单一正确顺序”的问题，因为现在我们为物体和相机之间的特定相对位置寻找一个正确的排序。


    虽然这确实会按照正确的顺序绘制三角形，但它具有一些使其无法切实际的缺点。


    首先，它的扩展性不好。人类已知最高效的排序算法是 `O(n * log(n))`，这意味着如果三角形数量翻倍，运行时间将增加一倍以上。（为了说明，排序 100
    个三角形大约需要 200 次操作；排序 200 个三角形需要 460 次，而不是 400 次；排序 800 个三角形需要 2322 次操作，而不是 1840
    次！）换句话说，这对小场景有效，但随着场景复杂性的增加，它很快就会成为瓶颈。


    其次，它要求知道整个三角形列表。这需要大量的内存，并阻止我们使用流式方法。我们希望渲染器像流水线一样，三角形从一端进入，像素从另一端出来，但这种算法在所有三角形排序之前才开始绘制像素。


    第三，即使我们愿意接受这些限制，也存在不存在排序的情况。考虑图 12-2 中的情况。我们永远无法以产生结果的方式对这些三角形进行排序。


    ![image](img/12fig02.jpg)


    *图 12-2：无法从向前排序这些三角形。*


    ### 深度缓冲


    我们无法在三角形级别解决排序问题，因此让我们尝试在像素级别解决。


    对于画布上的每个像素，我们希望将其涂成“正确的”颜色，其中“正确”颜色是距离相机最近的颜色。在图 12-3 中，那是 `P1`。


    ![image](img/12fig03.jpg)


    *图 12-3：P1 和 P2 都投影到画布上的同一个 P'' 上。因为 P1 比 P2 更离相机，我们希望将 P'' 涂成 P1 的颜色。*


    在渲染的任何时候，画布上的每个像素都代表场景中的一个点（在绘制任何内容之前，它代表一个无限远处的点）。假设对于画布上的每个像素，我们保留了它当前代表的 Z
    坐标。当我们需要决定是否用对象的颜色涂画像素时，只有当正要绘制的点的 Z 坐标小于已存在点的 Z 坐标时，我们才会这样做。这保证了代表场景中点的像素不会被代表距离相机远处的像素所覆盖。


    让我们回到图 12-3。假设由于模型中三角形的顺序，我们想先画 `P2` 后画 `P1`。当我们画 `P2` 时，像素被涂成红色，其关联的 Z 值变为 `ZP2`。然后我们想画
    `P1`，由于 `ZP2 > ZP1`，我们把像素涂成蓝色并得到了正确的的结果。

