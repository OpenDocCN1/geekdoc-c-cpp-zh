    \ Volume\n\nUsing a single clipping plane to make sure objects behind the camera\
    \ are rendered will produce correct results, but it’s not entirely efficient.\
    \ Some objects may be in front of the camera but still not visible; for example,\
    \ the projection of an object near the projection plane but far, far to the right\
