- fmt: "\nHow does this categorization actually work? The way we’ve chosen to express\
    \ the clipping planes is such that plugging any point into the plane equation\
    \ gives us the signed distance from the point to the plane; in particular, we\
    \ can compute the signed distance `d` from the center of the bounding sphere to\
    \ the plane. So if `d` > `r`, the sphere is in front of the plane; if `d` < –`r`,\
    \ the sphere is behind the plane; otherwise `|d|` < `r`, which means the plane\
    \ intersects the sphere. [Figure 11-11](#ch11.xhtml_ch11fig11) illustrates all\
    \ three cases.\n\n![image](Images/11fig11.jpg)\n\nFigure 11-11: The signed distance\
    \ from the center of a sphere to a clipping plane tells us whether the sphere\
    \ is in front of the plane, behind the plane, or intersects the plane.*\n\n###\
    \ Clipping Triangles\nIf the sphere–plane test isn’t enough to determine whether\
    \ an object is fully in front or fully behind the clipping plane, we have to clip\
    \ each triangle against it.\n\nWe can classify each vertex of the triangle against\
    \ the clipping plane by looking at its signed distance to the plane. If the distance\
    \ is zero or positive, the vertex is in front of the clipping plane; otherwise,\
    \ it’s behind. [Figure 11-12](#ch11.xhtml_ch11fig12) illustrates this idea.\n\n\
    ![image](Images/11fig12.jpg)\n\nFigure 11-12: The signed distance from a vertex\
    \ to a clipping plane tells us whether the vertex is in front of or behind the\
    \ plane.*\n\nFor each triangle, there are four possible classifications:\n\n-\
    \ **Three vertices in front.** In this case, the whole triangle is in front of\
    \ the clipping plane, so we accept it and no further clipping against this plane\
    \ is needed.\n- **Three vertices behind.** In this case, the whole triangle is\
    \ behind the clipping plane, so we discard it and no further clipping is necessary\
    \ at all.\n- **One vertex in front.** Let `A` be the vertex of the triangle `ABC`\
    \ that is in front of the plane. In this case, we discard `ABC`, and add a new\
    \ triangle `AB′C′`, where `B′` and `C′` are the intersections of `AB` and `AC`\
    \ with the clipping plane ([Figure 11-13](#ch11.xhtml_ch11fig13)).\n- **Two vertices\
    \ in front.** Let `A` and `B` be the vertices of the triangle `ABC` that are in\
    \ front of the plane. In this case, we discard `ABC` and add two new triangles:\
    \ `ABA′` and `A′BB′`, where `A′` and `B′` are the intersections of `AC` and `BC`\
    \ with the clipping plane ([Figure 11-14](#ch11.xhtml_ch11fig14)).\n\n![image](Images/11fig13.jpg)\n\
    \nFigure 11-13: A triangle `ABC` with one vertex inside and two vertices outside\
    \ the clipping volume is replaced by a single triangle `AB’C’.*\n\n![image](Images/11fig14.jpg)\n\
    \nFigure 11-14: A triangle `ABC` with one vertex outside and two vertices inside\
    \ the clipping volume is replaced by two triangles `ABA’` and `A’BB’.*\n\n####\
    \ Segment-Plane Intersection\nTo clip triangles as discussed above, we need to\
    \ compute the intersection of the sides of the triangle with the clipping plane.\n\
    \nWe have a clipping plane given by the equation `⟨N, P⟩ + D = 0`. The triangle\
    \ side `AB` can be expressed with a parametric equation as `P = A + t(B – A)`\
    \ for 0 ≤ `t` ≤ 1. To compute the value of the parameter `t` where the intersection\
    \ occurs, we replace `P` in the plane equation with the parametric equation of\
    \ the segment:\n\n![image](Images/f0144-01.jpg)\n\nUsing the linear properties\
    \ of the dot product:\n\n`⟨N, A⟩ + t⟨N, B – A⟩ + D = 0`\n\nSolving for `t`:\n\n\
    ![image](Images/f0144-02.jpg)\n\nWe know a solution always exists because we know\
    \ `AB` intersects the plane; mathematically, `⟨N, B – A⟩` can’t be zero because\
    \ that would imply that the segment and the normal are perpendicular, which in\
    \ turn would imply that the segment and the plane don’t intersect.\n\nHaving computed\
    \ `t`, the intersection `Q` is simply:\n\n`Q = A + t(B – A)`\n\nNote that if the\
    \ original vertices carry additional attributes (for example, the `h` intensity\
    \ value we were using in [Chapter 7](#ch07.xhtml_ch07)), we need to compute the\
    \ values of these attributes for the new vertices.\n\nIn the equation above, `t`\
    \ is the fraction of the segment `AB` where the intersection occurs. Let `α[A]`\
    \ and `α[B]` be the values of some attribute `α` at the points `A` and `B`; if\
    \ we assume the attribute varies linearly across `AB`, then `α[Q]` can be computed\
    \ as:\n\n`α[Q] = α[A] + t(α[B] – α[A])`\n\nWe now have all the algorithms and\
    \ equations to implement our clipping pipeline.\n\n### Clipping Pseudocode\nLet’s\
    \ write some high-level pseudocode for the clipping pipeline. We’ll follow the\
    \ top-down approach we developed. To clip a scene, we clip each of its instances\
    \ ([Listing 11-1](#ch11.xhtml_ch11lis1)).\n\n```\nClipScene(scene, planes) {\n\
    \  clipped_instances = []\n  for I in scene.instances {\n    clipped_instance\
    \ = ClipInstance(I, planes)\n    if clipped_instance != NULL {\n      clipped_instances.append(clipped_instance)\n\
    \    }\n  }\n  clipped_scene = Copy(scene)\n  clipped_scene.instances = clipped_instances\n\
    \  return clipped_scene\n}\n```\nListing 11-1: An algorithm to clip a scene against\
    \ a set of clipping planes\n\nTo clip an instance, we either accept it, reject\
    \ it, or clip each of its triangles, depending on its bounding sphere ([Listing\
    \ 11-2](#ch11.xhtml_ch11lis2)).\n\n```\nClipInstance(instance, planes) {\n  for\
    \ P in planes {\n    instance = ClipInstancePlane(instance, plane)\n    if instance\
    \ == NULL {\n      return NULL\n    }\n  }\n  return instance\n}\n\nClipInstancePlane(instance,\
    \ plane) {\n  d = SignedDistance(plane, instance.bounding_sphere.center)\n  if\
    \ d > r {\n    return instance\n  } else if d < -r {\n    return NULL\n  } else\
    \ {\n    clipped_instance = Copy(instance)\n    clipped_instance.triangles = ClipTrianglesAgainstPlane(instance.triangles,\
    \ plane)\n    return clipped_instance\n  }\n}\n```\nListing 11-2: An algorithm\
    \ to clip an instance against a set of clipping planes\n\nFinally, to clip a triangle,\
    \ we either accept it, reject it, or decompose it into to two triangles, depending\
    \ on how many of its vertices are in front of the clipping plane ([Listing 11-3](#ch11.xhtml_ch11lis3)).\n\
    \n```\nClipTrianglesAgainstPlane(triangles, plane) {\n  clipped_triangles = []\n\
    \  for T in triangles {\n    clipped_triangles.append(ClipTriangle(T, plane))\n\
    \  }\n  return clipped_triangles\n}\n\nClipTriangle(triangle, plane) {\n  d0 =\
    \ SignedDistance(plane, triangle.v0)\n  d1 = SignedDistance(plane, triangle.v1)\n\
    \  d2 = SignedDistance(plane, triangle.v2)\n  if {d0, d1, d2} are all positive\
    \ {\n    return [triangle]\n  } else if {d0, d1, d2} are all negative {\n    return\
    \ []\n  } else if only one of {d0, d1, d2} is positive {\n    let A be the vertex\
    \ with a positive distance\n    compute B’ = Intersection(AB, plane)\n    compute\
    \ C’ = Intersection(AC, plane)\n    return [Triangle(A, B’, C’)]\n  } else /*\
    \ only one of {d0, d1, d2} is negative */ {\n    let C be the vertex with a negative\
    \ distance\n    compute A’ = Intersection(AC, plane)\n    compute B’ = Intersection(BC,\
    \ plane)\n    return [Triangle(A, B, A’), Triangle(A’, B, B’)]\n  }\n}\n```\n\
    Listing 11-3: An algorithm to clip a set of triangles against a clipping plane\n\
    \nThe helper function `SignedDistance` just plugs the coordinates of a point into\
    \ the equation of a plane ([Listing 11-4](#ch11.xhtml_ch11lis4)).\n\n```\nSignedDistance(plane,\
    \ vertex) {\n  normal = plane.normal\n  return (vertex.x * normal.x)\n    + (vertex.y\
    \ * normal.y)\n    + (vertex.z * normal.z)\n    + plane.D\n}\n```\nListing 11-4:\
    \ A function to compute the signed distance from a plane to a point\n"
  raw: 'How does this categorization actually work? The way we’ve chosen to express
    the clipping planes is such that plugging any point into the plane equation gives
    us the signed distance from the point to the plane; in particular, we can compute
    the signed distance *d* from the center of the bounding sphere to the plane. So
    if *d* > *r*, the sphere is in front of the plane; if *d* < –*r*, the sphere is
    behind the plane; otherwise |*d*| < *r*, which means the plane intersects the
    sphere. [Figure 11-11](#ch11.xhtml_ch11fig11) illustrates all three cases.


    ![image](Images/11fig11.jpg)


    *Figure 11-11: The signed distance from the center of a sphere to a clipping plane
    tells us whether the sphere is in front of the plane, behind the plane, or intersects
    the plane.*


    ### Clipping Triangles


    If the sphere–plane test isn’t enough to determine whether an object is fully
    in front or fully behind the clipping plane, we have to clip each triangle against
    it.


    We can classify each vertex of the triangle against the clipping plane by looking
    at its signed distance to the plane. If the distance is zero or positive, the
    vertex is in front of the clipping plane; otherwise, it’s behind. [Figure 11-12](#ch11.xhtml_ch11fig12)
    illustrates this idea.


    ![image](Images/11fig12.jpg)


    *Figure 11-12: The signed distance from a vertex to a clipping plane tells us
    whether the vertex is in front of or behind the plane.*


    For each triangle, there are four possible classifications:


    **Three vertices in front.** In this case, the whole triangle is in front of the
    clipping plane, so we accept it and no further clipping against this plane is
    needed.


    **Three vertices behind.** In this case, the whole triangle is behind the clipping
    plane, so we discard it and no further clipping is necessary at all.


    **One vertex in front.** Let *A* be the vertex of the triangle *ABC* that is in
    front of the plane. In this case, we discard *ABC*, and add a new triangle *AB′C′*,
    where *B′* and *C′* are the intersections of *AB* and *AC* with the clipping plane
    ([Figure 11-13](#ch11.xhtml_ch11fig13)).


    **Two vertices in front.** Let *A* and *B* be the vertices of the triangle *ABC*
    that are in front of the plane. In this case, we discard ABC and add two new triangles:
    *ABA′* and *A′BB′*, where *A′* and *B′* are the intersections of *AC* and *BC*
    with the clipping plane ([Figure 11-14](#ch11.xhtml_ch11fig14)).


    ![image](Images/11fig13.jpg)


    *Figure 11-13: A triangle* ABC *with one vertex inside and two vertices outside
    the clipping volume is replaced by a single triangle* AB’C’.


    ![image](Images/11fig14.jpg)


    *Figure 11-14: A triangle* ABC *with one vertex outside and two vertices inside
    the clipping volume is replaced by two triangles* ABA’ *and* A’BB’.


    #### Segment-Plane Intersection


    To clip triangles as discussed above, we need to compute the intersection of the
    sides of the triangle with the clipping plane.


    We have a clipping plane given by the equation ⟨*N*, *P*⟩ + *D* = 0\. The triangle
    side *AB* can be expressed with a parametric equation as *P* = *A* + *t*(*B* –
    *A*) for 0 ≤ *t* ≤ 1\. To compute the value of the parameter *t* where the intersection
    occurs, we replace *P* in the plane equation with the parametric equation of the
    segment:


    ![image](Images/f0144-01.jpg)


    Using the linear properties of the dot product:


    ⟨*N*, *A*⟩ + *t*⟨*N*, *B* – *A*⟩ + *D* = 0


    Solving for *t*:


    ![image](Images/f0144-02.jpg)


    We know a solution always exists because we know *AB* intersects the plane; mathematically,
    ⟨*N*, *B* – *A*⟩ can’t be zero because that would imply that the segment and the
    normal are perpendicular, which in turn would imply that the segment and the plane
    don’t intersect.


    Having computed *t*, the intersection *Q* is simply


    *Q* = *A* + *t*(*B* – *A*)


    Note that if the original vertices carry additional attributes (for example, the
    *h* intensity value we were using in [Chapter 7](#ch07.xhtml_ch07)), we need to
    compute the values of these attributes for the new vertices.


    In the equation above, *t* is the fraction of the segment *AB* where the intersection
    occurs. Let *α*[*A*] and *α*[*B*] be the values of some attribute *α* at the points
    *A* and *B*; if we assume the attribute varies linearly across *AB*, then *α*[*Q*]
    can be computed as


    *α[Q]* = *α[A]* + *t*(*α[B]* – *α[A]*)


    We now have all the algorithms and equations to implement our clipping pipeline.


    ### Clipping Pseudocode


    Let’s write some high-level pseudocode for the clipping pipeline. We’ll follow
    the top-down approach we developed before.


    To clip a scene, we clip each of its instances ([Listing 11-1](#ch11.xhtml_ch11lis1)).


    ClipScene(scene, planes) {


        clipped_instances = []


        for I in scene.instances {


            clipped_instance = ClipInstance(I, planes)


            if clipped_instance != NULL {


                clipped_instances.append(clipped_instance)


            }


        }


        clipped_scene = Copy(scene)


        clipped_scene.instances = clipped_instances


        return clipped_scene


    }


    *Listing 11-1: An algorithm to clip a scene against a set of clipping planes*


    To clip an instance, we either accept it, reject it, or clip each of its triangles,
    depending on its bounding sphere ([Listing 11-2](#ch11.xhtml_ch11lis2)).


    ClipInstance(instance, planes) {


        for P in planes {


            instance = ClipInstanceAgainstPlane(instance, plane)


            if instance == NULL {


                return NULL


            }


        }


        return instance


    }


    ClipInstanceAgainstPlane(instance, plane) {


        d = SignedDistance(plane, instance.bounding_sphere.center)


        if d > r {


            return instance


        } else if d < -r {


            return NULL


        } else {


            clipped_instance = Copy(instance)


            clipped_instance.triangles =


                ClipTrianglesAgainstPlane(instance.triangles, plane)


            return clipped_instance


       }


    }


    *Listing 11-2: An algorithm to clip an instance against a set of clipping planes*


    Finally, to clip a triangle, we either accept it, reject it, or decompose it into
    up to two triangles, depending on how many of its vertices are in front of the
    clipping plane ([Listing 11-3](#ch11.xhtml_ch11lis3)).


    ClipTrianglesAgainstPlane(triangles, plane) {


        clipped_triangles = []


        for T in triangles {


            clipped_triangles.append(ClipTriangle(T, plane))


        }


        return clipped_triangles


    }


    ClipTriangle(triangle, plane) {


        d0 = SignedDistance(plane, triangle.v0)


        d1 = SignedDistance(plane, triangle.v1)


        d2 = SignedDistance(plane, triangle.v2)


        if {d0, d1, d2} are all positive {


            return [triangle]


        } else if {d0, d1, d2} are all negative {


            return []


        } else if only one of {d0, d1, d2} is positive {


            let A be the vertex with a positive distance


            compute B’ = Intersection(AB, plane)


            compute C’ = Intersection(AC, plane)


            return [Triangle(A, B’, C’)]


        } else /* only one of {d0, d1, d2} is negative */ {


            let C be the vertex with a negative distance


            compute A’ = Intersection(AC, plane)


            compute B’ = Intersection(BC, plane)


            return [Triangle(A, B, A’), Triangle(A’, B, B’)]


        }


    }


    *Listing 11-3: An algorithm to clip a set of triangles against a clipping plane*


    The helper function SignedDistance just plugs the coordinates of a point into
    the equation of a plane ([Listing 11-4](#ch11.xhtml_ch11lis4)).


    SignedDistance(plane, vertex) {


        normal = plane.normal


        return (vertex.x * normal.x)


             + (vertex.y * normal.y)


             + (vertex.z * normal.z)


             + plane.D


    }


    *Listing 11-4: A function to compute the signed distance from a plane to a point*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/clipping-demo](https://gabrielgambetta.com/cgfs/clipping-demo)*.


    ### Clipping in the Rendering Pipeline'
