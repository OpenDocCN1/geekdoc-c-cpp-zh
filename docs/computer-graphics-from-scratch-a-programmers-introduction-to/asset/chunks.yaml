    \ y)\n        color = TraceRay(O, D, 1, inf)\n        canvas.PutPixel(x, y, color)\n\
    \    }\n}\n```\n*Listing 2-2: 主方法*\n\n`CanvasToViewport` 函数非常简单，在 Listing 2-3\
    \ 所示。常量 `d` 代表相机与投影平面之间的距离。\n\n```python\nCanvasToViewport(x, y) {\n    return\
    \ (x*Vw/Cw, y*Vh/Ch, d)\n}\n```\n*Listing 2-3: `CanvasToViewport` 函数*\n\n`TraceRay`\
    \ 方法(Listing 2-4) 计算光线与每个球体的交点，并在请求的 `t` 范围内返回最近交点处的球体颜色。\n\n```python\nTraceRay(O,\
    \ D, t_min, t_max) {\n    closest_t = inf\n    closest_sphere = NULL\n    for\
    \ sphere in scene.spheres {\n        t1, t2 = IntersectRaySphere(O, D, sphere)\n\
    \        if t1 in [t_min, t_max] and t1 < closest_t {\n            closest_t =\
    \ t1\n            closest_sphere = sphere\n        }\n        if t2 in [t_min,\
    \ t_max] and t2 < closest_t {\n            closest_t = t2\n            closest_sphere\
    \ = sphere\n        }\n    }\n    if closest_sphere == NULL {\n        return\
    \ BACKGROUND_COLOR\n    }\n    return closest_sphere.color\n}\n```\n*Listing 2-4:\
    \ `TraceRay` 方法*\n\n在 Listing 2-4 中，`O` 代表光线的起点；虽然我们是从相机开始追踪光线（而相机位于原点），但在稍后的阶段情况将不再如此，因此它必须是一个参数。`t_min`\
    \ 和 `t_max` 也是如此。注意，当光线没有与任何球体相交时，我们仍然需要返回*某种*颜色——我在大多数示例中选择了白色。最后，`IntersectRay`\
    \ (Listing 2-5) 只是求解二次方程。\n\n```python\nIntersectRay(O, D, sphere) {\n    r =\
    \ sphere.radius\n    CO = O - sphere.center\n    a = dot(D, D)\n    b = 2*dot(CO,\
    \ D)\n    c = dot(CO, CO) - r*r\n    discriminant = b*b - 4*a*c\n    if discriminant\
    \ < 0 {\n        return inf, inf\n    }\n    t1 = (-b + sqrt(discriminant)) /\
    \ (2*a)\n    t2 = (-b - sqrt(discriminant)) / (2*a)\n    return t1, t2\n}\n```\n\
    *Listing 2-5: `IntersectRaySphere` 方法*\n\n为了将这一切付诸实践，让我们定义一个非常简单的场景，如 Figure 2-10\
    \ 所示。\n\n![image](img/02fig10.jpg)\n*Figure 2-10: 一个非常简单的场景，从上方（左）和从右侧（右）视图*\n\
    \n在伪场景语言中，它大致如下：\n\n```python\nviewport_size = 1 x 1\nprojection_plane_d = 1\n\
    sphere {\n    center = (0, -1, 3)\n    radius = 1\n    color = (255, 0, 0) # 红色\n\
    }\nsphere {\n    center = (2, 0, 4)\n    radius = 1\n    color = (0, 0, 255) #\
    \ 蓝色\n}\nsphere {\n    center = (-2, 0, 4)\n    radius = 1\n    color = (0, 255,\
    \ 0) # 绿色\n}\n```\n\n当我们在场景上运行算法时，我们终于获得了一个令人惊叹的光线渲染场景（Figure 2-11）。\n\n![image](img/02fig11.jpg)\n\
    *Figure 2-11: 令人惊叹的光线渲染场景*\n\n你可以在 [`gabrielgambetta.com/cgfs/basic-rays-demo`](https://gabrielgambetta.com/cgfs/basic-rays-demo)\
    \ 找到该算法的实时实现。\n"
