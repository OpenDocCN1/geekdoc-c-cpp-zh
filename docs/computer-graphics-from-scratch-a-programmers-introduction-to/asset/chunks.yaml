    But wait, how did the big yellow sphere turn into a flat yellow floor? It hasn’t;
    it’s just so big compared to the other three spheres, and the camera is so close
    to it, that it looks flat—just like the surface of our planet looks flat when
    we’re standing on it.


    ## Specular Reflection


    Let’s turn our attention to `shiny` objects. Unlike matte objects, shiny objects
    look slightly different depending on where you’re looking from.


    Imagine a billiard ball or a car just out of the car wash. These kinds of objects
    exhibit very specific light patterns, usually bright spots, that seem to move
    as you move around them. Unlike matte objects, the way you perceive the surface
    of these objects does actually depend on your point of view.


    Note that a red billiard ball stays red if you walk around it, but the bright
    white spot that gives it its shiny appearance moves as you do. This shows that
    the new effect we want to model doesn’t replace diffuse reflection, but instead
    complements it.


    To understand why this happens, let’s take a closer look at how surfaces reflect
    light. As we saw in the previous section, when a ray of light hits the surface
    of a matte object, it’s scattered back to the scene equally in every direction.
    This happens because the surface of the object is irregular, so at the microscopic
    level it behaves like a set of tiny surfaces pointing in random directions ([Figure
    3-8](#ch03.xhtml_ch3fig8)).


    ![image](Images/03fig08.jpg)


    *Figure 3-8: What the rough surface of a matte object might look like through
    a microscope. The incident rays of light are reflected in random directions.*


    But what if the surface isn’t that irregular? Let’s go to the other extreme: a
    perfectly polished mirror. When a ray of light hits a mirror, it’s reflected in
    a single direction. If we call the direction of the reflected light ![Images](Images/rarr.jpg),
    and we keep the convention that ![Images](Images/larr.jpg) points toward the light
    source, [Figure 3-9](#ch03.xhtml_ch3fig9) illustrates the situation.


    ![image](Images/03fig09.jpg)


    *Figure 3-9: Rays of light reflected by a mirror*


    Depending on how “polished” the surface is, it behaves more or less like a mirror;
    this is why it’s called `specular` reflection, from `speculum`, the Latin word
    for `mirror`.


    For a perfectly polished mirror, the incident ray of light ![Images](Images/larr.jpg)
    is reflected in a single direction, ![Images](Images/rarr.jpg). This is why you
    see reflected objects very clearly: for every incident ray of light ![Images](Images/larr.jpg),
    there’s a single reflected ray ![Images](Images/rarr.jpg). But not every object
    is perfectly polished; while *most* of the light is reflected in the direction
    of ![Images](Images/rarr.jpg), *some* of it is reflected in directions close to
    ![Images](Images/rarr.jpg). The closer to ![Images](Images/rarr.jpg), the more
    light is reflected in that direction, as you can see in [Figure 3-10](#ch03.xhtml_ch3fig10).
    The “shininess” of the object is what determines how rapidly the reflected light
    decreases as you move away from ![Images](Images/rarr.jpg).


    ![image](Images/03fig10.jpg)


    *Figure 3-10: For surfaces that aren’t perfectly polished, the closer a direction
    is to ![Images](Images/rarr1.jpg), the more rays of light are reflected in that
    direction.*


    We want to figure out how much light from ![Images](Images/larr.jpg) is reflected
    back in the direction of our point of view. If ![Images](Images/varr.jpg) is the
    “view vector” pointing from `P` to the camera, and `α` is the angle between ![Images](Images/rarr.jpg)
    and ![Images](Images/varr.jpg), we get [Figure 3-11](#ch03.xhtml_ch3fig11).


    ![image](Images/03fig11.jpg)


    *Figure 3-11: The vectors and angles involved in the specular reflection calculation*


    For `α` = 0°, all the light is reflected in the direction of ![Images](Images/varr.jpg).
    For `α` = 90°, no light is reflected. As with diffuse reflection, we need a mathematical
    expression to determine what happens for intermediate values of `α`.


    ## Modeling Specular Reflection


    At the beginning of this chapter, I mentioned that some models aren’t based on
    physical models. This is one of them. The following model is arbitrary, but it’s
    used because it’s easy to compute and it looks good.


    Consider `cos(α)`. It has the nice properties that `cos(0)` = 1 and `cos(±90)`
    = 0, just like we need; and the values become gradually smaller from 0 to 90 in
    a very pleasant curve ([Figure 3-12](#ch03.xhtml_ch3fig12)).


    ![image](Images/03fig12.jpg)


    *Figure 3-12: The graph of `cos(α)`.*


    This means `cos(α)` matches all of our requirements for the specular reflection
    function, so why not use it?


    There’s one more detail. If we used this formula straight away, every object would
    be equally shiny. How can we adapt the equation to represent varying degrees of
    shininess?


    Remember that shininess is a measure of how quickly the reflection decreases as
    `α` increases. A simple way to obtain shininess is to compute the power of `cos(α)`
    to some `s`. Since 0 ≤ `cos(α)` ≤ 1, we are guaranteed that 0 ≤ `cos(α)^s` ≤ 1.
    The bigger the value of `s`, the “narrower” the function becomes and the shinier
    the object.

