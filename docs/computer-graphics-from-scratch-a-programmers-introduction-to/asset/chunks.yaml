  trans: "\n现在我们正进入正题。场景中的物体正以更真实的方式相互作用，彼此投下阴影。接下来，我们将探索物体之间的更多交互——即物体反射其他物体。\n\n\
    ## 反射\n\n在上一章中，我们讨论了“镜面般”的表面，但这只是让它们看起来有光泽。我们能拥有看起来像真正的镜子那物体吗——也就是说，我们能在它们的表面看到其他物体的反射吗？我们可以，事实上，在光线追踪中实现这一点非常简单，但第一次看到它的实现方式可能会让你大脑转不过。\n\
    \n### 镜子与反射\n\n让我们看看镜子是如何工作的。当你看向镜子时，你看到的是从镜子上弹回的光线。光线相对于表面法线对称反射，正如你在图 4-5 所示。\n\
    \n![image](img/04fig05.jpg)\n\n*图 4-5：光线以与镜子法线对称的方向从镜子上弹回。*\n\n假设我们正在追踪一条光线，最近的交点恰好是一个镜子。这束光线是什么颜色的？它不是镜子本身的颜色，因为我们看到的是反射光。所以，我们需要弄清楚这些光是从哪里来的，以及是什么颜色的。因此，我们要做的只是计算反射光线的方向，并确定来自该方向的光的颜色。\n\
    \n如果我们有一个函数，给定一条光线，并返回来自该方向的光的颜色……\n\n噢，等一下！我们有这样一个函数，它叫做 `TraceRay`！\n\n在主循环中，对于每个像素，我们创建一条从相机到场景的光线，并调用\
    \ `TraceRay` 来确定相机在那个方向“看到”的是什么颜色。如果 `TraceRay` 确定相机看到的是一面镜子，它只需要计算反射光线的方向并确定来自该方向的光的颜色；它必须调用……它自己。\n\
    \n此时，我建议你重读最后几段，直到你理解为止。如果这是你第一次读到递归光线追踪，可能需要读几次并挠几次脑筋才能真正理解。\n\n继续吧，我会等你的——等这种美丽的“*啊！*”瞬间的喜悦消退后，让我们把它形式化一点。\n\
    \n当我们设计一个递归算法（一个调用它自身的算法）时，我们需要确保不会导致无限循环（也称为“程序已停止响应。您要终止它吗？”）。该算法有两个自然的退出条件：当光线击中非反射物体以及当它没有击中任何东西时。但有一种简单的情况会导致陷入无限循环：无限镜廊效应。这就是当你在一面镜子面前放另一面镜子并向里面看发生的情况——无数个你自己！\n\
    \n防止无限递归有很多方法。我们只需为算法引入一个*递归限制*；这将控制它可以进入多“深”。我们将其设为 `r`。当 `r` = 0 时，我们看到物体但没有反射。当\
    \ `r` = 1 时，我们看到物体以及某些物体在上面的反射（图 4-6）。\n\n![image](img/04fig06.jpg)\n\n*图 4-6：反射限制一次递归调用（*r*\
    \ = 1）。我们看到球体反射在球体上，但反射球体本身看起来并不反射。*\n\n当 `r` = 2 时，我们看到物体、某些物体的反射，以及某些物体反射的反射（对于更大的\
    \ `r` 值也是如此以此类推）。图 4-7 显示了 `r` = 3 的结果。通常情况下，深度超过三层没有太大意义，因为在那个节点差异几乎无法察觉。\n\n\
    ![image](img/04fig07.jpg)\n\n*图 4-7：反射限制为三次递归调用（*r* = 3）。现在我们可以看到球体反射的反射的反射反射。*\n\
    \n我们还将做另一个区分。“反射性”不非得是一个非黑即白的对命题；物体可能只是部分反射的。我们将为每个表面分配一个 0 到 1 之间的数字，指定它的反射程度。然后我们将使用该数字作为权重，计算局部照明颜色和反射颜色的加权平均值。\n\
    \n最后，对 `TraceRay` 递归调用的参数是什么？\n\n*   光线起始于物体的表面 `P`。\n*   反射光线的方向是入射光线从 `P` 弹回的方向；在\
    \ `TraceRay` 中我们有 ![Images](img/darr.jpg)指向 `P` 的入射光线方向，因此反射光线的方向是 ![Images](img/mdarr.jpg)相对于\
    \ ![Images](img/narr.jpg) 的反射。\n*   与阴影的情况类似，我们不希望物体反射自身，所以 `t[min]` = `ϵ`。\n\
    *   我们希望看到反射的物体，无论它们多远，所以 `t[max]` = +∞。\n*   递归限制比当前递归限制减一（以避免无限递归）。\n\n现在我们准备好将其转换为实际伪代码了。\n\
    \n### 带反射的渲染\n\n让我们为光线追踪添加反射。首先，我们通过为每个表面添加一个反射属性来修改场景，描述它的反射程度，从 0（不反射）到 1（完美镜面）：\n\
    \n```\nsphere {\n  reflective = 0.0\n}\nsphere {\n  reflective = 0.2\n}\nsphere\
    \ {\n  reflective = 0.3\n}\nsphere {\n  reflective = 0.4\n}\nsphere {\n  reflective\
    \ = 0.5\n}\n```\n\n我们在计算高光时已经使用了“反射”公式，所以我们可以将其提取。它接收一条光线 ![Images](img/darr.jpg)\
    \ 和一条法线 ![Images](img/narr.jpg)，并返回相对于 ![Images](img/narr.jpg) 的反射 ![Images](img/rarr.jpg)。\n\
    \n```\nReflectRay(R, N) {\n  return 2 * N * dot(N, R) - R;\n}\n```\n\n我们需要对 `Lighting`\
    \ 进行的唯一更改是将反射方程替换为对 `ReflectRay` 的调用。\n\n主方法中有一个小变化——我们需要将递归限制传递给顶层 `TraceRay`\
    \ 调用：\n\n```\ncolor = TraceRay(O, D, 1, inf, recursion_depth)\n```\n\n正如之前提到的，可以将\
    \ `recursion_depth` 的初始值设置为合理的 3。主要的变化发生在 `TraceRay` 的结尾，在那里我们递归计算反射。你可以在列表 4-4\
    \ 中看到这些变化。\n\n```\nTraceRay(O, D, t_min, t_max, recursion_depth) {\n  closest_sphere,\
    \ closest_t = ClosestIntersection(O, D, t_min, t_max)\n  if (closest_sphere ==\
    \ NULL) {\n    return BACKGROUND_COLOR\n  }\n  // 计算局部颜色\n  P = O + closest_t\
    \ * D\n  N = P - closest_sphere.center\n  N = N / length(N)\n  local_color = closest_sphere.color\
    \ * ComputeLighting(P, N, -D, closest_sphere.specular)\n  // 如果达到递归限制或物体不反射，我们就结束了\n\
    \  r = closest_sphere.reflective\n  if (recursion_depth <= 0 || r <= 0) {\n  \
    \  return local_color\n  }\n  // 计算反射颜色\n  R = ReflectRay(-D, N)\n  reflected_color\
    \ = TraceRay(P, R, 0.001, inf, recursion_depth - 1)\n  return local_color * (1\
    \ - r) + reflected_color * r\n}\n```\n"
