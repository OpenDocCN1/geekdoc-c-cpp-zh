    接下来，我们应用投影方程来获取视口坐标：


    ![image](img/f0125-01.jpg)


    最后，我们将视口坐标映射到画布坐标：


    ![image](img/f0125-02.jpg)


    如你所见，对于每个顶点都有大量的计算和大量的中间值。如果我们能将这一切简化为一种更紧凑、更高效的形式，不是很好吗？


    让我们将变换表示为函数，这些函数接收一个顶点并返回一个变换后的顶点。令 `C[T]` 和 `C[R]` 为相机平移和旋转；`I[R]`、`I[S]` 和 `I[T]`
    分别为实例旋转、缩放和平移；`P` 为透视投影；`M` 为视口到画布的映射。如果 `V` 是原始顶点，`V′` 是画布上的点，我们可以这样表示上述所有方程：


    ![image](img/f0125-03.jpg)


    理想情况下，我们希望有一个单一变换 `F` 能够完成系列原始变换所的工作，但它的表达式要简单得多：


    ![image](img/f0125-04.jpg)


    找到表示 `F` 的简单方法并非易事。我们的主要障碍在于是以不同的方式表示每个变换的：我们将平移表示为点与向量之和，旋转表示为矩阵与点的乘法，缩放表示为实数与点的乘法，而透视投影表示为实数的乘法和除法。但如果我们能以相同的方式表示所有变换，并且这种方式具有一种组合变换的机制，我们就能得到想要的简单变换。


    ### 齐次坐标


    考虑表达式 `A = (1,2,3)`。`A` 代表的是一个 3D 点还是一个 3D 向量？如果我们不知道 `A` 使用的上下文，就无从得知。


    但让我们添加第四个值，称为 `w`，来标记 `A` 是点还是向量。如果 `w = 0`，它是一个向量；如果 `w = 1`，它是一个点。因此，点 `A` 被无歧地表示为
    `A = (1,2,3,1)`，而向量 ![image](img/f0160-08.jpg) 被表示为 `(1,2,3,0)`。


    由于点和向量共享相同的表示法，这些四分量坐标被称为`齐次坐标`。齐次坐标具有深远得多且复杂的几何解释，但这超出了本文的范围；在这里，我们仅将其作为一个方便的工具。对齐次坐标表示的点和向量的操作与它们的几何解释是兼容的。例如，两个点相减产生一个向量：


    ```

    (8,4,2,1) - (3,2,1,1) = (5,2,1,0)

    ```


    两个向量相加产生另一个向量：


    ```

    (0,0,1,0) + (1,0,0,0) = (1,0,1,0)

    ```


    同样，很容易看出点与向量相加产生一个点，向量乘以标量产生一个向量，等等，正如我们预期的那样。


    那么 `w` 值不为 0 或 1 的坐标代表什么？它们也代表点。事实上，3D 中的任何点在齐次坐标中都有无限种表示法。重要的是坐标值与 `w` 值之间的`比例`。例如，`(1,2,3,1)`
    和 `(2,4,6,2)` 代表同一个点，`(-3,-6,-9,-3)` 也是如此。


    在所有这些表示中，我们将 `w = 1` 的那个称为点在齐次坐标中的`标准表示`；将任何其他表示转换为其标准表示或笛卡尔坐标都是轻易的：


    ![image](img/f0126-01.jpg)


    因此我们可以将笛卡尔坐标转换为齐次坐标，再转换回笛卡尔坐标。但这如何帮助我们找到所有变换的单一表示呢？


    #### 齐次矩阵


    让我们从旋转矩阵开始。将笛卡尔坐标中的 `3×3` 旋转矩阵转换为齐次坐标中的 `4×4` 旋转矩阵是轻而易见的；由于点的 `w` 坐标不应改变，我们在右侧添加一列，在底部添加一行，用零填充，并在右下角元素放置一个
    `1` 以保持 `w` 的值：


    ![image](img/f0127-01.jpg)


    #### 齐次缩放矩阵


    缩放矩阵在齐次坐标中同样轻而易见，它的构造方式与旋转矩阵相同：


    ![image](img/f0127-02.jpg)


    #### 齐次平移矩阵


    旋转和缩放矩阵很容易；它们在笛卡尔坐标中已经表示为矩阵乘法，我们只需要添加一个 1 来保留 `w` 坐标。但对于我们在笛卡尔坐标中表示为加法的平移，我们能做什么呢？我们寻找一个
    `4×4` 矩阵使得：


    ![image](img/f0127-03.jpg)


    让我们先关注 `x + T[x]`。该值是矩阵第一行与点乘的结果——即：


    ![image](img/f0128-01.jpg)


    如果展开向量乘法，得到：


    ```

    Ax + By + Cz + D = x + T[x]

    ```


    从这里我们可以推导出 `A = 1`，`B = C = 0`且 `D = T[x]`。对其余坐标进行类似的推理，我们得到了平移的以下矩阵表达式：


    ![image](img/f0128-02.jpg)


    #### 齐次投影矩阵


    和与乘很容易表示为矩阵与向量的乘法，因为它们毕竟涉及求和乘。但透视投影方程包含除以 `z` 的除法。我们如何表示它呢？


    你可能想认为除以 `z` 等于乘以 `1/z`，你可能想通过将 `1/z` 放入矩阵来解决这个问题。然而，我们应该放入哪一个 `z` 坐标呢？我们希望这个投影矩阵适用于每个输入点，因此硬编码任何点的
    `z` 坐标都不会带给我们想要的结果。


    幸运的是，齐次坐标确实有一个除法实例：转换回笛卡尔坐标时对 `w` 坐标的除法。我们可以如何表示它？如果我们让原始点的 `z` 坐标出现在投影点的 `w`
    坐标，就能得到想要的结果：


    ![image](img/f0128-03.jpg)


    注意这个矩阵是 `3×4`；它乘以一个四分量向量（齐次坐标下的 3D 点）将得到一个三分量向量（齐次坐标下的 2D 点），然后通过除以 `w` 转换为 2D
    笛卡尔坐标。这给了我们需要的 `x′` 和 `y′` 值。这里缺失的元素是 `z''`，根据定义它等于 `d`。


    应用我们推导平移矩阵时的类似推理，我们可以这样表示透视投影：


    ![image](img/f0129-01.jpg)


    #### 齐次视口到画布矩阵


    最后一步是将视口点映射到画布。这只是一个 2D 缩放变换，使用了 ![image](img/f0129-02.jpg) 和 ![image](img/f0129-03.jpg)。因此该矩阵为：


    ![image](img/f0129-04.jpg)


    事实上，很容易将其与投影矩阵结合，得到一个简单的 3D 到画布矩阵：


    ![image](img/f0129-05.jpg)


    ### 重新回顾变换矩阵


    经过这些工作，我们可以将模型顶点 `V` 转换为画布像素 `V′` 所需的所有变换表示为矩阵。此外，我们可以通过相乘相应的矩阵来组合这些变换。因此，我们可以将整个变换序列表示为单一矩阵：


    ![image](img/f0129-06.jpg)


    现在变换顶点只需要计算以下矩阵与点的乘法即可：


    ```

    V′ = F ⋅ V

    ```


    此外，我们可以将变换分解为三个部分：


    ![image](img/f0130-01.jpg)


    这些矩阵不需要为每个顶点从头计算（这正是使用矩阵的意义）。由于矩阵乘法符合结合律，我们可以重用表达式中不改变的部分。

