- fmt: '

    You can see evidence of this color model directly on the cartridges of color printers,
    or sometimes in the shapes of cheaply printed flyers where the different colors
    are slightly offset from one another.


    ![image](Images/01fig04.jpg)


    *Figure 1-4: The four subtractive primary colors used by printers*


    ## Additive Color Model


    The subtractive color model is only half the story. If you’ve ever looked at a
    screen up close or with a magnifying glass (or, let’s be honest, accidentally
    sneezed on it), you’ve probably seen tiny colored dots: these are red, green,
    and blue.


    Computer screens are the opposite of paper. Paper doesn’t emit light; it merely
    reflects part of the light that hits it. Screens, on the other hand, are black,
    but they do emit light on their own. With paper, we start with white light and
    `subtract` the wavelengths we don’t want; with a screen, we start with no light
    and `add` the wavelengths we want.


    Different primary colors are necessary for this. Most colors can be created by
    adding different amounts of red, green, and blue to a black surface; this is the
    `RGB color model`, an `additive color model`, shown in [Figure 1-5](#ch01.xhtml_ch1fig5).


    The combination of additive primary colors is `lighter` than its components, whereas
    the combination of subtractive primary colors is `darker`; all the additive primaries
    add up to white, while all the subtractive primaries add up to black.


    ![image](Images/01fig05.jpg)


    *Figure 1-5: The additive primary colors and some of their combinations*


    ## Forget the Details


    Now that you know all this, you can selectively forget most of the details and
    focus on what’s important for our work.


    Most colors can be represented in either RGB or CMYK (or in any of the many other
    color models), and it’s possible to convert from one `color space` to another.
    Since we’re focusing on rendering things on a screen, we use the `RGB color model`
    for the rest of this book.


    As described above, objects absorb part of the light reaching them and reflect
    the rest. Which wavelengths are absorbed and which are reflected is what we perceive
    as the “color” of the surface. From now on, we’ll simply treat the color as a
    property of a surface and forget about light wavelengths.


    ### Color Depth and Representation


    Monitors create colors by mixing different amounts of red, green, and blue. They
    do this by lighting the tiny colored dots on their surface at different intensities
    by supplying different voltages to them.


    How many different intensities can we get? Although voltage is continuous, we’ll
    be manipulating colors with a computer, which uses discrete values (that is, a
    limited number of them). The more shades of red, green, and blue we can represent,
    the more colors we’ll be able to produce.


    Most images you see these days use 8 bits per primary color, which we call a `color
    channel` in this context. Using 8 bits per channel gives us 24 bits per pixel,
    for a total of `2^(24)` different colors (approximately 16.7 million). This format,
    known as `R8G8B8` or simply `888`, is the one we’ll use throughout this book.
    We say this format has a `color depth` of 24 bits.


    This is by no means the only possible format. Not so long ago, in order to save
    memory, 15- and 16-bit formats were popular, assigning 5 bits per channel in the
    15-bit case, and 5 bits for red, 6 for green, and 5 for blue in the 16-bit case
    (known as the `R5G6B5` or `565` format). Green gets the extra bit because our
    eyes are more sensitive to changes in green than to changes in red or blue.


    With 16 bits, we get `2^(16)` colors (approximately 65,000). This means you get
    one color for every 256 colors in 24-bit mode. Although 65,000 colors is plenty,
    for images where colors change very gradually you would be able to see very subtle
    “steps” that just aren’t visible with 16.7 million colors, where there are enough
    bits to represent the colors in between. For some specialized applications, such
    as color grading for movies, it’s a good idea to represent even more color detail,
    using even more bits per channel.


    We’ll use 3 bytes to represent a color, each holding the value of an 8-bit color
    channel, from 0 to 255. We’ll express the colors as (`R`, `G`, `B`)—for example,
    (255,0,0) representsrepresents pure red; (255,255,255) represents white; and (255,0,128)
    represents a reddish purple.


    ### Color Manipulation


    We’ll use a handful of operations to manipulate colors. If you know some linear
    algebra, you can think of colors as vectors in 3D color space. If not, don’t worry,
    we’ll go through the basic operations we’ll be using now.


    We can modify the intensity of a color by multiplying each of its color channels
    by a constant:


    ```

    k(R, G, B) = (kR, kG, kB)

    ```


    For example, (32,0,128) is twice as bright as (16,0,64).


    We can add two colors together by adding their color channels separately:


    ```

    (R[1], G[1], B[1]) + (R[2], G[2], B[2]) = (R[1]+R[2], G[1]+G[2], B[1]+B[2])

    ```


    ## The Scene


    So far, we have introduced the canvas, the surface on which we can color. Now
    we turn our attention to the objects we’re interested in rendering: the scene.


    The scene is the set of objects you may be interested in. It could represent anything,
    from a single sphere floating in empty space to an incredibly detailed model of
    a grumpy ogre’s nose.


    We need a coordinate system to talk about objects within the scene. We can’t use
    the same coordinate system as the canvas, for two reasons. First, the canvas is
    2D, whereas the scene is 3D. Second, the canvas and the scene use different units:
    we use pixels for the canvas and real-world units (such as the imperial or metric
    systems) for the scene.


    The choice of axes is arbitrary, so we’ll pick something useful for our purposes.
    We’ll say that *Y* is up and *X* and *Z* are horizontal, and all three axes are
    perpendicular to each other. Think of the plane *XZ* as the “floor,” while *XY*
    and *YZ* are vertical “walls” in a square room. This is consistent with the coordinate
    system we chose for the canvas, where *Y* is up and *X* is horizontal. [Figure
    1-6](#ch01.xhtml_ch1fig6) shows what this looks like.


    ![image](Images/01fig06.jpg)


    *The coordinate system we’ll use for our scenes*


    ### Summary


    In this chapter, we’ve introduced the canvas, an abstraction that represents a
    rectangular surface we can draw on, plus the one method we’ll build everything
    else on: PutPixel. We’ve also chosen a coordinate system to refer to the pixels
    on the canvas and described a way to represent the color of these pixels. Lastly,
    we introduced the concept of a scene and chose a coordinate system to use in the
    scene.


    Having laid these foundations, it’s time to start building a raytracer and a rasterizer
    on top of them.

