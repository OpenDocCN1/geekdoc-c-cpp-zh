  trans: "\n接下来，我们需要计算 `x_left` 和 `x_right` 数组。这有点棘手，因为三角形有三条边，而不是两条。然而，仅考虑 `y` 的值，我们总有一条从\
    \ `P[0]` 到 `P[2]` 的“高”边，以及两条从 `P[0]` 到 `P[1]` 以及 `P[1]` 到 `P[2]` 的“短”边。\n\n当 `y[0]\
    \ = y[1]` 或 `y[1] = y[2]` 时，存在特殊情况——即三角形的一边是水平的。当这种情况发生时，另外两条边的高度相同，因此任何一条都可以被视为“高”边。我们应该选择右边还是左边？幸运的是，这并不重要；算法将支持从左到右和从右到左的水平线，因此我们可以坚持定义，即“高”边是从\
    \ `P[0]` 到 `P[2]` 的那一条。\n\n`x_right` 的值可能来自高边，也可能来自短边的连接；`x_left` 的值则来自另一组。我们将开始计算三条边的\
    \ `x` 值。由于我们要绘制水平线段，我们希望每个 `y` 值对应对应一个 `x` 值；这意味着我们可以通过 `Interpolate` 来计算这些值，以\
    \ `y` 为自变量，`x` 为因变量：\n\n```\nx01 = Interpolate(y0, x0, y1, x1)\nx12 = Interpolate(y1,\
    \ x1, y2, x2)\nx02 = Interpolate(y0, x0, y2, x2)\n```\n\n其中一条边的 `x` 值在 `x02` 中；另一条边的值则来自\
    \ `x01` 和 `x12` 的拼接。请注意，`x01` 和 `x12` 中有一个重复的值：`y[1]` 的 `x` 值既是 `x01` 的最后一个值，也是\
    \ `x12` 的第一个值。我们只需要去掉其中一个（我们任意选择 `x01` 的最后一个值），然后对数组进行拼接：\n\n```\nremove_last(x01)\n\
    x012 = x01 + x12\n```\n\n现在我们有了 `x02` 和 `x012`，我们需要确定哪个是 `x_left`，哪个是 `x_right`。为了做到这一点，我们可以选择任意水平线（例如中间那条），并比较它们在\
    \ `x02` 和 `x012` 中的 `x` 值：如果 `x02` 中的 `x` 值小于 `x012` 中的值，那么我们就知道 `x02` 必须是 `x_left`；否则，它必须是\
    \ `x_right`。\n\n```\nm = floor(x02.length / 2)\nif x02[m] < x012[m] {\n    x_left\
    \ = x02\n    x_right = x012\n} else {\n    x_left = x012\n    x_right = x02\n\
    }\n```\n\n现在我们拥有了绘制水平线段所需的数据。我们可以使用 `DrawLine`。然而，`DrawLine` 是一个非常通用的函数，在这种情况下，我们总是绘制水平的从左到右的线，因此使用简单的\
    \ `for` 循环更高效。这也让我们对所绘制的每个像素有更多的“控制”，这在接下来的章节中将特别有用。\n\nListing 7-1 是完成后的 `DrawFilledTriangle`。\n\
    \n```\nDrawFilledTriangle (P0, P1, P2, color) {\n  ❶ // 对点排序使得 y0 <= y1 <= y2\n\
    \    if y1 < y0 { swap(P1, P0) }\n    if y2 < y0 { swap(P2, P0) }\n    if y2 <\
    \ y1 { swap(P2, P1) }\n  ❷ // 计算三角形边的 x 坐标\n    x01 = Interpolate(y0, x0, y1,\
    \ x1)\n    x12 = Interpolate(y1, x1, y2, x2)\n    x02 = Interpolate(y0, x0, y2,\
    \ x2)\n  ❸ // 拼接短边\n    remove_last(x01)\n    x012 = x01 + x12\n  ❹ // 确定哪个是左，哪个是右\n\
    \    m = floor(x012.length / 2)\n    if x02[m] < x012[m] {\n        x_left = x02\n\
    \        x_right = x012\n    } else {\n        x_left = x012\n        x_right\
    \ = x02\n    }\n  ❺ // 绘制水平线段\n    for y = y0 to y2 {\n      for x = x_left to\
    \ x_right {\n        PutPixel(x, y, color)\n      }\n    }\n}\n```\n"
- fmt: "\nMore formally, we have a function `h = f(P)` that gives each point `P` an\
    \ intensity value `h`; we know its values at `A` and `B`, `h(A) = h[A]` and `h(B)\
    \ = h[B]`, respectively. We want this function to be smooth. Since we know nothing\
    \ else about `h = f(P)`, we can choose any function that is compatible with what\
    \ we *do* know, such as a linear function ([Figure 8-2](#ch08.xhtml_ch8fig2)).\n\
    \n![image](Images/08fig02.jpg)\n\nFigure 8-2: A linear function `h(P)`, compatible\
    \ with what we know about `h(A)` and `h(B)\n\nThis is suspiciously similar to\
    \ the situation in the previous chapter: we had a linear function `x = f(y)`,\
    \ we knew the values of this function at the vertices of the triangle, and we\
    \ wanted to compute values of `x` along its sides. We can compute values of `h`\
    \ along the sides of the triangle in a very similar way, using `Interpolate` with\
    \ `y` as the independent variable (the values we know) and `h` as the dependent\
    \ variable (the values we want):\n\n```\nx01 = Interpolate(y0, x0, y1, x1)\nh01\
    \ = Interpolate(y0, h0, y1, h1)\nx12 = Interpolate(y1, x1, y2, x2)\nh12 = Interpolate(y1,\
    \ h1, y2, h2)\nx02 = Interpolate(y0, x0, y2, x2)\nh02 = Interpolate(y0, h0, y2,\
    \ h2)\n```\n\nNext, we concatenated the `x` arrays for the “short” sides and then\
    \ determined which of `x02` and `x012` was `x_left` and which was `x_right`. Again,\
    \ we can do something very similar here for the `h` vectors.\n\nHowever, we will\
    \ always use the `x` values to determine which side is left and which side is\
    \ right, and the `h` values will just “follow along.” `x` and `h` are properties\
    \ of actual points on the screen, so we can’t freely mix-and-match left- and right-side\
    \ values.\n\nWe can code this as follows:\n\n```\n// Concatenate the short sides\n\
    remove_last(x01)\nx012 = x01 + x12\nremove_last(h01)\nh012 = h01 + h12\n\n// Determine\
    \ which is left and which is right\nm = floor(x012.length / 2)\nif x02[m] < x012[m]\
    \ {\n    x_left = x02\n    h_left = h02\n    x_right = x012\n    h_right = h012\n\
    } else {\n    x_left = x012\n    h_left = h012\n    x_right = x02\n    h_right\
    \ = h02\n}\n```\n\nThis is very similar to the relevant section of the code in\
    \ the previous chapter ([Listing 7-1](#ch07.xhtml_ch7lis1)), except that every\
    \ time we do something with an `x` vector, we do the same with the corresponding\
    \ `h` vector.\n\n### Computing Interior Shading\n\nThe last step is drawing the\
    \ actual horizontal segments. For each segment, we know `x_left` and `x_right`,\
    \ as in the previous chapter; now we also know `h_left` and `h_right`. But this\
    \ time we can’t just iterate from left to right and draw every pixel with the\
    \ base color: we need to compute a value of `h` for *each pixel* of the segment.\n\
    \nAgain, we can assume `h` varies linearly with `x`, and use `Interpolate` to\
    \ compute these values. In this case, the independent variable is `x`, and it\
    \ goes from the `x_left` value to the `x_right` value of the specific horizontal\
    \ segment we’re shading; the dependent variable is `h`, and its corresponding\
    \ values for `x_left` and `x_right` are `h_left` and `h_right` for that segment:\n\
    \n```\nx_left_this_y = x_left[y - y0]\nh_left_this_y = h_left[y - y0]\nx_right_this_y\
    \ = x_right[y - y0]\nh_right_this_y = h_right[y - y0]\nh_segment = Interpolate(x_left_this_y,\
