    \ imagine a vector as an arrow that connects a point to another point; alternatively,\
    \ think of it as the instructions to get from one point to another.\n\n### Representing\
    \ Vectors\n\nWe represent a vector as a set of numbers between parentheses, and\
    \ refer to them using a capital letter. This is the same representation we use\
    \ for points, so we add a small arrow on top to remember they’re vectors and not\
    \ points. For example, (2, 1) is a vector, which we might decide to call ![Images](Images/f0204-01.jpg).\
    \ [Figure A-2](#appendix.xhtml_app01fig2) shows two equal vectors, ![Images](Images/f0204-01.jpg)\
