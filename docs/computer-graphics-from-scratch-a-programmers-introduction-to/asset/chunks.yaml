  raw: 'In this particular case, we’d have gotten the correct result regardless of
    the values of *Z*, because the points happened to come in a convenient order.
    But what if we wanted to paint *P*[1] first and *P*[2] second? We first paint
    the pixel blue and store *Z*[*P*1]; but when we want to paint *P*[2], we see that
    *Z*[*P*2] > *Z*[*P*1], so we *don’t* paint it—because if we did, *P*[1] would
    be covered by *P*[2], which is farther away! We get a blue pixel again, which
    is the correct result.


    In terms of implementation, we need a buffer to store the *Z* coordinate of every
    pixel on the canvas; we call this the *depth buffer*. It has the same dimensions
    as the canvas, but its elements are real numbers representing depth values, not
    pixels.


    But where do the *Z* values come from? These should be the *Z* values of the points
    after they’re transformed but before they’re perspective-projected. However, this
    only gives us *Z* values for vertices; we need a *Z* value for every pixel of
    every triangle.


    Here is yet another application of the attribute-mapping algorithm we developed
    in [Chapter 8](#ch08.xhtml_ch08). Why not use *Z* as the attribute and interpolate
    it across the face of the triangle, just like we did before with color-intensity
    values? By now you know how to do it: take the values of z0, z1, and z2; compute
    z01, z02, and z012; combine them to get z_left and z_right; then, for each horizontal
    segment, compute z_segment. Finally, instead of blindly calling PutPixel(x, y,
    color), we do this:


    z = z_segment[x - xl]


    if (z < depth_buffer[x][y]) {


        canvas.PutPixel(x, y, color)


        depth_buffer[x][y] = z


    }


    For this to work correctly, every entry in depth_buffer should be initialized
    to +*∞* (or just “a very big value”). This guarantees that the first time we want
    to draw a pixel, the condition will be true, because any point in the scene is
    closer to the camera than a point infinitely far away.


    The results we get now are much better—check out [Figure 12-4](#ch12.xhtml_ch12fig4).


    ![image](Images/12fig04.jpg)


    *Figure 12-4: The cubes now look like cubes, regardless of the ordering of their
    triangles.*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/depth-demo](https://gabrielgambetta.com/cgfs/depth-demo)*.


    #### Using 1/Z instead of Z


    The results look much better, but what we’re doing is subtly wrong. The values
    of *Z* for the vertices are correct (they come from data, after all), but in most
    cases the linearly interpolated values of *Z* for the rest of the pixels are incorrect.
    This might not even result in a visible difference at this point, but it would
    become an issue later.


    To see how the values are wrong, consider the simple case of a line segment from
    *A*(–1,0,2) to *B*(1,0,10), with its midpoint *M* at (0,0,6). Specifically, because
    *M* is the midpoint of *AB*, we know that *M*[*z*] = (*A*[*z*] + *B*[*z*])/2 =
    6\. [Figure 12-5](#ch12.xhtml_ch12fig5) shows this line segment.


    ![image](Images/12fig05.jpg)


    *Figure 12-5: A line segment* AB *and its midpoint* M


    Let’s compute the projection of these points with *d* = 1. Applying the perspective
    projection equations, we get ![image](Images/f0154-01.jpg). Similarly, ![image](Images/f0154-02.jpg).
    and ![image](Images/f0154-03.jpg). [Figure 12-6](#ch12.xhtml_ch12fig6) shows the
    projected points.


    ![image](Images/12fig06.jpg)


    *Figure 12-6: The points* A, B, *and* M *projected onto the projection plane*


    *A′B′* is a horizontal segment on the viewport. We know the values of *A*[*z*]
    and *B*[*z*]. Let’s see what happens if we try to compute the value of *M*[*z*]
    using linear interpolation. The implied linear function looks like [Figure 12-7](#ch12.xhtml_ch12fig7).


    ![image](Images/12fig07.jpg)


    *Figure 12-7: The values of* A[z] *and* B[z] *for* A[x’] *and* B[x’] *define a
    linear function* z = f(x’).


    The slope of the function is constant, so we can write


    ![image](Images/f0155-01.jpg)


    We can manipulate that expression to solve for *M*[*z*]:


    ![image](Images/f0155-02.jpg)


    If we plug in the values we know and do some arithmetic, we get


    ![image](Images/f0155-03.jpg)


    This says that the value of *M*[*z*] is 8*.*666, but we know for a fact it’s actually
    6!


    Where did we go wrong? We’re using linear interpolation, which we know works well,
    and we’re feeding it the correct values, which come from data, so why is the result
    wrong?


    Our mistake is hidden in the implicit assumption we make when we use linear interpolation:
    that the function we are interpolating is linear to begin with! In this case,
    it turns out it isn’t.


    If *Z* = *f* (*x′*, *y′*) was a linear function of *x′* and *y′*, we could write
    it as *Z* = *Ax′* + *By′* + *C* for some values of *A*, *B*, and *C*. This kind
    of function has the property that the difference of its value between two points
    depends on the difference between the points but not on the points themselves:


    ![image](Images/f0156-01.jpg)


    That is, for a given difference in screen coordinates, the difference in *Z* would
    always be the same.


    More formally, the equation of the plane that contains the line segment we’re
    studying is


    *Ax* + *By* + *Cz* + *D* = 0


    On the other hand we have the perspective projection equations:


    ![image](Images/f0156-02.jpg)


    We can get *x* and *y* back from these:


    ![image](Images/f0156-03.jpg)


    If we replace *x* and *y* in the plane equation with these expressions, we get


    ![image](Images/f0156-04.jpg)


    Multiplying by *d* and then solving for *z*,


    ![image](Images/f0156-05.jpg)


    This is clearly *not* a linear function of *x′* and *y′*, and this is why linearly
    interpolating values of *z* gave us an incorrect result.


    However, if we compute 1/*z* instead of *z*, we get


    ![image](Images/f0157-01.jpg)


    This clearly *is* a linear function of *x′* and *y′*. This means we could linearly
    interpolate values of 1/*z* and get the correct results.


    In order to verify that this works, let’s calculate the interpolated value for
    *M*[*z*], but this time using the linear interpolation of 1/*z*:


    ![image](Images/f0157-02.jpg)


    And therefore


    ![image](Images/f0157-03.jpg)


    This value is correct, in the sense that it matches our original calculation of
    *M*[*z*] based on the geometry of the line segment.


    All of this means we need to use values of 1/*z* instead of values of *z* for
    depth buffering. The only practical differences in the pseudocode are that every
    entry in the buffer should be initialized to 0 (which is conceptually 1/+*∞*),
    and that the comparison should be inverted (we keep the bigger value of 1/*z*,
    which corresponds to a smaller value of *z*).


    ### Back Face Culling


    Depth buffering produces the desired results. But can we make things even faster?


    Going back to the cube, even if each pixel ends up having the right color, many
    of them are painted over several times. For example, if a back face of the cube
    is rendered before a front face, many pixels will be painted twice. This can be
    costly. So far we’ve been computing 1/*z* for every pixel, but soon we’ll add
    more attributes, such as illumination. As the number of per-pixel operations we
    need to perform increases, computing pixels that will never be visible becomes
    more and more wasteful.


    Can we discard pixels earlier, before we go into all of this computation? It turns
    out we can discard *entire triangles* before we even start rendering!


    So far we’ve been talking informally about *front faces* and *back faces*. Imagine
    every triangle has two distinct sides; it’s impossible to see both sides of a
    triangle at the same time. In order to distinguish between the two sides, we’ll
    stick an imaginary arrow on each triangle, perpendicular to its surface. Then
    we’ll take the cube and make sure every arrow is pointing out. [Figure 12-8](#ch12.xhtml_ch12fig8)
    shows this idea.


    ![image](Images/12fig08.jpg)


    *Figure 12-8: A cube viewed from above, with arrows on each triangle pointing
    out*'
