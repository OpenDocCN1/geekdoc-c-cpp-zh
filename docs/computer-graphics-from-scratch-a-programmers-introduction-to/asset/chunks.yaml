  raw: 'Just like we did at the beginning of [Chapter 2](#ch02.xhtml_ch02), we’ll
    start by defining a *camera*. We’ll use the same conventions as before: the camera
    is at *O* = (0,0,0), looking in the direction of ![image](Images/f0106-03.jpg),
    and its “up” vector is ![image](Images/f0106-02.jpg). We’ll also define a rectangular
    *viewport* of size *V*[*w*] and *V*[*h*] whose edges are parallel to ![image](Images/f0106-01.jpg)
    and ![image](Images/f0106-01a.jpg), at a distance *d* from the camera. The goal
    is to draw on the canvas whatever the camera sees through the viewport. If you
    need a refresher on these concepts, refer to [Chapter 2](#ch02.xhtml_ch02).


    Consider a point *P* somewhere in front of the camera. We’re interested in finding
    *P′*, the point on the viewport through which the camera sees *P*, as shown in
    [Figure 9-1](#ch09.xhtml_ch9fig1).


    ![image](Images/09fig01.jpg)


    *Figure 9-1: A simple perspective projection setup. The camera sees* P *through*
    P’, *which is on the projection plane.*


    This is the opposite of what we did with raytracing. Our raytracer started with
    a point in the canvas, and determined what it could see through that point; here,
    we start from a point in the scene and want to determine where it is seen on the
    viewport.


    ### Finding P’


    To find *P′*, let’s look at the setup shown in [Figure 9-1](#ch09.xhtml_ch9fig1)
    from a different angle, literally. [Figure 9-2](#ch09.xhtml_ch9fig2) shows a diagram
    of the setup viewed from the “right,” as if we were standing on the ![image](Images/f0106-01.jpg)
    axis: ![image](Images/f0106-02.jpg) points up, ![image](Images/f0106-03.jpg) points
    to the right, and ![image](Images/f0106-04.jpg) points at us.


    ![image](Images/09fig02.jpg)


    *Figure 9-2: The perspective projection setup, viewed from the right*


    In addition to *O*, *P*, and *P′*, this diagram also shows the points *A* and
    *B*, which help us reason about it.


    We know that ![image](Images/f0106-05.jpg) because we defined *P′* to be a point
    on the viewport, and we know the viewport is embedded in the plane *Z* = *d*.


    We can also see that the triangles *OP′A* and *OPB* are similar, because their
    corresponding sides (*P′A* and *PB*, *OP* and *OP′*, and *OA* and *OB*) are parallel.
    This implies that the proportions of their sides are the same; for example:


    ![image](Images/f0107-01.jpg)


    From that, we get


    ![image](Images/f0107-02.jpg)


    The (signed) length of each segment in that equation is a coordinate of a point
    we know or we’re interested in: ![image](Images/f0107-03.jpg), |*PB*| = *P*[*y*],
    ![image](Images/f0107-04.jpg), and |*OB*| = *P*[*z*]. If we substitute these in
    the equation we get


    ![image](Images/f0107-05.jpg)


    We can draw a similar diagram, this time viewing the setup from above: ![image](Images/f0107-08.jpg)
    points up, ![image](Images/f0107-09.jpg) points to the right, and ![image](Images/f0107-10.jpg)
    points at us ([Figure 9-3](#ch09.xhtml_ch9fig3)).


    ![image](Images/09fig03.jpg)


    *Figure 9-3: Top view of the perspective projection setup*


    Using similar triangles again in the same way, we can deduce that


    ![image](Images/f0107-06.jpg)


    We now have all three coordinates of *P′*.


    ### The Projection Equation


    Let’s put all this together. Given a point *P* in the scene and a standard camera
    and viewport setup, we can compute the projection of *P* on the viewport, which
    we call *P′*, as follows:


    ![image](Images/f0107-07.jpg)![image](Images/f0108-01.jpg)


    *P′* is on the viewport, but it’s still a point in 3D space. How do we get the
    corresponding point in the canvas?


    We can immediately drop ![image](Images/f0108-02.jpg), because every projected
    point is on the viewport plane. Next we need to convert ![image](Images/f0108-03.jpg)
    and ![image](Images/f0108-04.jpg) to canvas coordinates *C*[*x*] and *C*[*y*].
    *P′* is still a point in the scene, so its coordinates are expressed in scene
    units. We can divide them by the width and height of the viewport. These are also
    expressed in scene units, so we obtain temporarily unit-less values. Finally,
    we multiply them by the width and height of the canvas, expressed in pixels:


    ![image](Images/f0108-05.jpg)


    This viewport-to-canvas transform is the exact inverse of the canvas-to-viewport
    transform we used in the raytracing part of this book. And with this, we can finally
    go from a point in the scene to a pixel on the screen!


    ### Properties of the Projection Equation


    Before we move on, there are some interesting properties of the projection equation
    that are worth discussing.


    The equations above should be compatible with our day-to-day experience of looking
    at things in the real world. For example, the farther away an object is, the smaller
    it looks; and indeed, if we increase *P*[*z*], we get smaller values of ![image](Images/f0108-03.jpg)
    and ![image](Images/f0108-04.jpg).


    However, things stop being so intuitive when we decrease the value of *P*[*z*]
    too much; for negative values of *P*[*z*], that is, when an object is *behind*
    the camera, the object is still projected, but upside down! And, of course, when
    *P*[*z*] = 0 we’d divide by zero and the universe would implode. We’ll need to
    find a way to avoid these unpleasant situations; for now, we’ll assume that every
    point is in front of the camera and deal with this in a later chapter.


    Another fundamental property of the perspective projection is that it preserves
    point alignment: if three points are aligned in space, their projections will
    be aligned on the viewport. In other words, a straight line is always projected
    as a straight line. This might sound too obvious to be worth mentioning, but note,
    for example, that the *angle* between two lines isn’t preserved: in real life,
    we see parallel lines “converge” at the horizon, such as when driving on a highway.


    The fact that a straight line is always projected as a straight line is extremely
    convenient for us: so far we have talked about projecting a point, but how about
    projecting a line segment, or even a triangle? Because of this property, the projection
    of a line segment between two points is the line segment between the projection
    of two points; and the projection of a triangle is the triangle formed by the
    projections of its vertices.


    ### Projecting Our First 3D Object


    This means we can go ahead and draw our first 3D object: a cube. We define the
    coordinates of its 8 vertices, and we draw line segments between the projections
    of the 12 pairs of vertices that make the edges of the cube, as seen in [Listing
    9-1](#ch09.xhtml_ch9lis1).


    ViewportToCanvas(x, y) {


      return (x * Cw/Vw, y * Ch/Vh);


    }


    ProjectVertex(v) {


      return ViewportToCanvas(v.x * d / v.z, v.y * d / v.z)


    }


    // The four "front" vertices


    vAf = [-1,  1, 1]


    vBf = [ 1,  1, 1]


    vCf = [ 1, -1, 1]


    vDf = [-1, -1, 1]


    // The four "back" vertices


    vAb = [-1,  1, 2]


    vBb = [ 1,  1, 2]


    vCb = [ 1, -1, 2]


    vDb = [-1, -1, 2]


    // The front face


    DrawLine(ProjectVertex(vAf), ProjectVertex(vBf), BLUE);


    DrawLine(ProjectVertex(vBf), ProjectVertex(vCf), BLUE);


    DrawLine(ProjectVertex(vCf), ProjectVertex(vDf), BLUE);


    DrawLine(ProjectVertex(vDf), ProjectVertex(vAf), BLUE);


    // The back face


    DrawLine(ProjectVertex(vAb), ProjectVertex(vBb), RED);


    DrawLine(ProjectVertex(vBb), ProjectVertex(vCb), RED);


    DrawLine(ProjectVertex(vCb), ProjectVertex(vDb), RED);


    DrawLine(ProjectVertex(vDb), ProjectVertex(vAb), RED);


    // The front-to-back edges


    DrawLine(ProjectVertex(vAf), ProjectVertex(vAb), GREEN);


    DrawLine(ProjectVertex(vBf), ProjectVertex(vBb), GREEN);


    DrawLine(ProjectVertex(vCf), ProjectVertex(vCb), GREEN);


    DrawLine(ProjectVertex(vDf), ProjectVertex(vDb), GREEN);


    *Listing 9-1: Drawing a cube*


    We get something like [Figure 9-4](#ch09.xhtml_ch9fig4).


    ![image](Images/09fig04.jpg)


    *Figure 9-4: Our first 3D object projected on a 2D canvas: a cube*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/perspective-demo](https://gabrielgambetta.com/cgfs/perspective-demo)*.'
