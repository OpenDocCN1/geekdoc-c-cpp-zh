- fmt: "\nSuppose we have two canvas points, `P[0]` and `P[1]`, with coordinates (`x[0]`,\
    \ `y[0]`) and (`x[1]`, `y[1]`) respectively. How can we draw the straight line\
    \ segment between `P[0]` and `P[1]`?\n\nLet’s start by representing a line with\
    \ parametric coordinates, just as we did with rays before (in fact, you can think\
    \ of “rays” as lines in 3D). Any point `P` on the line can be obtained by starting\
    \ at `P[0]` and moving some distance along the direction from `P[0]` to `P[1]`:\n\
    \n`P = P[0] + t(P[1] – P[0])`\n\nWe can decompose this equation into two, one\
    \ for each coordinate:\n\n`x = x[0] + t ⋅ (x[1] – x[0])`\n\n`y = y[0] + t ⋅ (y[1]\
    \ – y[0])`\n\nLet’s take the first equation and solve for `t`:\n\n![image](Images/f0080-01.jpg)\n\
    \nWe can now plug this expression for `t` into the second equation:\n\n![image](Images/f0080-02.jpg)\n\
    \nRearranging it a bit:\n\n![image](Images/f0081-01.jpg)\n\nNotice that ![image](Images/f0081-02.jpg)\
    \ is a constant that depends only on the endpoints of the segment; let’s call\
    \ it `a`. So we can rewrite the equation above as\n\n`y = y[0] + a ⋅ (x – x[0])`\n\
    \nWhat is `a`? According to the way we’ve defined it, it measures the change in\
    \ the `y` coordinate per unit change in the `x` coordinate; in other words, it’s\
    \ a measure of the `slope` of the line.\n\nLet’s go back to the equation. Distributing\
    \ the multiplication:\n\n`y = y[0] + ax – ax[0]`\n\nGrouping the constants:\n\n\
    `y = ax + (y[0] – ax[0])`\n\nAgain, (`y[0] – ax[0]`) depends only on the endpoints\
    \ of the segment; let’s call it `b`. Finally we get\n\n`y = ax + b`\n\nThis is\
    \ the standard formulation of a linear function, which can be used to represent\
    \ *almost* any line. When we solved for `t`, we added a division by `x[1] – x[0]`\
    \ without thinking what happens if `x[1] = x[0]`. We can’t divide by zero, which\
    \ means this formulation can’t represent lines with `x[1] = x[0]`—that is, vertical\
    \ lines.\n\nTo work around this issue, we’ll just ignore vertical lines for now\
    \ and figure out how to deal with them later.\n\n### Drawing Lines\n\nWe now have\
    \ a way to get the value of `y` for each value of `x` we’re interested in. This\
    \ gives us a pair (`x`, `y`) that satisfies the equation of the line.\n\nWe can\
    \ now write a first approximation of a function that draws a line segment from\
    \ `P[0]` to `P[1]`. Let `x0` and `y0` be the `x` and `y` coordinates of `P[0]`,\
    \ respectively, and `x1` and `y1` those of `P[1]`. Assuming `x[0] < x[1]`, we\
    \ can go from `x[0]` to `x[1]`, computing the value of `y` for each value of `x`,\
    \ and drawing a pixel at these coordinates:\n\n```cpp\nDrawLine(P0, P1, color)\
    \ {\n    a = (y1 - y0) / (x1 - x0)\n    b = y0 - a * x0\n    for x = x0 to x1\
    \ {\n        y = a * x + b\n        canvas.PutPixel(x, y, color)\n    }\n}\n```\n\
    \nNote that the division operator `/` is expected to perform real division, not\
    \ integer division. This is despite `x` and `y` being integers in this context,\
    \ as they represent coordinates of pixels on the canvas.\n\nAlso note that we\
    \ consider for loops to include the last value of the range. In C, C++, Java,\
    \ and JavaScript, among others, this would be written as `for (x = x0; x <= x1;\
    \ ++x)`. We will be using this convention throughout this book.\n\nThis function\
    \ is a direct, naive implementation of the equation above. It works, but can we\
    \ make it faster?\n\nWe aren’t calculating values of `y` for any arbitrary `x`.\
    \ On the contrary, we’re calculating them only at integer increments of `x` and\
    \ we’re doing so in order. Right after calculating `y(x)`, we calculate `y(x +\
    \ 1)`:\n\n`y(x) = ax + b`\n\n`y(x + 1) = a ⋅ (x + 1) + b`\n\nWe can manipulate\
    \ that second expression a bit:\n\n`y(x + 1) = ax + a + b`\n`y(x + 1) = (ax +\
    \ b) + a`\n`y(x + 1) = y(x) + a`\n\nThis shouldn’t be surprising; after all, the\
    \ slope `a` is the measure of how much `y` changes when `x` increases by 1, which\
    \ is exactly what we’re doing here. This means we can compute the next value of\
    \ `y` just by taking the previous value of `y` and adding the slope; no per-pixel\
    \ multiplication is needed, which makes the function faster. At the beginning\
    \ there’s no “previous value of y,” so we start at (`x[0]`, `y[0]`). Then we keep\
    \ adding 1 to `x` and `a` to `y` until we get to `x[1]`. Again assuming `x[0]\
    \ < x[1]`, we can rewrite the function as:\n\n```cpp\nDrawLine(P0, P1, color)\
    \ {\n    a = (y1 - y0) / (x1 - x0)\n    y = y0\n    for x = x0 to x1 {\n     \
    \   canvas.PutPixel(x, y, color)\n        y = y + a\n    }\n}\n```\n\nSo far we’ve\
    \ been assuming that `x[0] < x[1]`. There’s an easy workaround to support lines\
    \ where that doesn’t hold: since the order which we draw the pixels doesn’t matter,\
    \ if we get a right-to-left line, we can just `swap(P0, P1)` to transform it into\
    \ the left-to-right version of the same line, and draw it as before:\n\n```cpp\n\
    DrawLine(P0, P1, color) {\n    // Make sure x0 < x1\n    if x0 > x1 {\n      \
    \  swap(P0, P1)\n    }\n    a = (y1 - y0) / (x1 - x0)\n    y = y0\n    for x =\
    \ x0 to x1 {\n        canvas.PutPixel(x, y, color)\n        y = y + a\n    }\n\
    }\n```\n\nLet’s use our function to draw a couple of lines. Figure 6-1 shows the\
    \ line segment (-200, -100) to (240, 120), and Figure 6-2 shows a close-up of\
    \ the line.\n\n![image](Images/06fig01.jpg)\n*Figure-1: A straight line*\n\n![image](Images/06fig02.jpg)\n\
    *Figure-2: Zooming in on the straight line*\n\nThe line appears jagged because\
    \ we can only draw pixels on integer coordinates, and mathematical lines actually\
    \ have zero width; what we’re drawing is a quantized approximation of the ideal\
    \ line from (-200, -100) to (240, 120). There are ways to draw prettier approximations\
    \ of lines (you may want to look into MSAA, FXAA, SSAA, and TAA as possible entry\
    \ points to an interesting set of rabbit holes). We won’t go there for two reasons:\
    \ (1) it’s slower, and (2) our goal is not to draw pretty lines but to develop\
    \ some basic algorithms to render 3D scenes.\n\nLet’s try another line, (-50,\
    \ -200) to (60, 240). Figure 6-3 shows the result and Figure 6-4 shows the corresponding\
    \ close-up.\n\n![image](Images/06fig03.jpg)\n*Figure-3: Another straight line\
    \ with a higher slope*\n\n![image](Images/06fig04.jpg)\n*Figure-4: Zooming in\
    \ on the second straight line*\n\nOops. What happened?\n\nThe algorithm did exactly\
