    为了实现这一点，我们为每个三角形关联了一个 `normal map`（法线图）。法线图类似于纹理图，但它的元素是法向量而不是颜色。在渲染时，我们不像 Phong
    着光（Phong shading）那样计算插值法线，而是使用 `normal map` 获取我们正在渲染的特定像素的法向量，就像纹理映射获取该特定像素的颜色一样。然后，我们使用这个向量计算该像素的光照效果。


    图 15-1 显示了一个应用了纹理图的平面表面，以及在同时应用 `normal map` 时，不同光线方向产生的效果。


    ![image](img/15fig01.jpg)


    *图 15-1：在平面几何体上进行法线映射（normal mapping）的效果*


    图 15-1 中的三幅图像都是带有纹理的平面正方形（即两个三角形）的渲染图，如图 (a) 所示。当我们添加 `normal map` 和适当的逐像素着色时，我们创造了额外几何细节的幻觉。在
    (b) 和 (c) 中，菱形的着色取决于入射光的方向，我们的大脑将其解释为菱形具有体积感。


    有几个需要注意的实际考虑因素。首先，`normal map` 中向量的方向是相对于它们所属的三角形表面的。用于此的坐标系被称为 `tangent space`（切线空间），在该空间中，两个轴（通常是
    `X` 和 `Z`）切于表面（即嵌入表面中），而剩下的向量垂直于表面。在渲染时，以相机空间（camera space）表示的三角形法线向量会根据 `normal
    map` 中的向量进行修改，以获得一个可以用于光照方程的最终法线向量。这使得 `normal map` 独立于物体在场景中的位置和方向。


    其次，一种编码 `normal maps` 的非常流行的方法将其作为纹理，将 `X`、`Y` 和 `Z` 的值映射到 `R`、`G` 和 `B` 值。这使得
    `normal maps` 具有非常特征性的紫色外观，因为紫色（红色和蓝色的组合但没有绿色）编码了表面的平坦区域。图 15-2 显示了图 15-1 示例中使用的
    `normal map`。


    ![image](img/15fig02.jpg)


    *图 15-2：用于图 15-1 示例的法线图，编码为 RGB 纹理*


    虽然这种技术可以极大提高场景中表面的感知复杂度，但它并不是没有局限性。例如，由于平面仍然是平坦的，它无法改变物体的轮廓。出于相同的原因，当从极端角度或近距离观察应用了法线映射的表面时，或者当
    `normal map` 所表示的特征相对于表面尺寸过大时，这种幻觉就会消失。这种技术更适用于细微的细节，例如皮肤上的毛孔、灰泥墙上的图案或橘皮不规则的外观。由于这个原因，这种技术也被
    `bump mapping`（凸凹映射）。


    ### 环境映射（Environment Mapping）


    我们开发的的光线追踪器最引人注目的特征之一是显示物体相互反射的能力。在我们的光栅化器中，可以创建一个相对可信但有些虚假的反射实现。


    假设我们有一个代表房子内房间的场景，我们想要渲染一个放置在房间中间的反射物体。对于代表该物体表面的每个像素，我们知道它所代表点的 3D 坐标、该点的表面法线，由于我们知道相机的位置，我们还可以计算指向该点的视线向量。我们可以相对于表面法线反射视线向量以得到一个反射向量，就像我们在第
    4 章中做的那样。


    此时，我们想知道来自反射向量方向的光线颜色。如果这是一个光线追踪器，我们只需在该方向上射出一条射线并找到结果。然而，这不是一个光线追踪器。该怎么办？


    `Environment mapping`（环境映射）为这个问题提供了一个可能的答案。假设在渲染房间内的物体之前，我们在房间中间放置一个相机并渲染六次场景——每个垂直方向（上、下、左、右、前、后）各渲染一次。你可以想象相机位于一个虚拟的立方体内部，立方体的每个面都是其中一次渲染的视口。我们将这六次渲染保留为纹理。我们将这六个纹理称为
    `cube map`（立方体映射），这就是为什么这种技术也被称为 `cube mapping`。


    然后渲染反射物体。当我们需要反射颜色时，可以使用反射向量的方向来选择 `cube map` 中的纹理之一，然后使用该纹理的纹素（texel）来获得在该方向看到的颜色的近似值——这一切无需追踪任何射线！


    这种技术具有一些缺点。`cube map` 从单点捕捉场景的外观。如果我们渲染的反射物体没有位于该点，那么反射物体的位置将无法完全符合我们的预期，因此将明显看出这只是一个近似。如果反射物体在房间内移动，这一点将尤为明显，因为反射场景不会随着物体的移动而改变。


    这种局限性也暗示了该技术的最佳应用：如果“房间”足够大且距离物体足够远——即如果物体的移动相对于房间尺寸很小——真实反射与环境映射之间的差异就不会被察觉。例如，这对于一个代表太空中飞船的场景将非常有效，因为“房间”（遥远的星星和星系）在实践上是无限远的。


    另一个缺点是我们被迫将场景中的物体分为两类：属于“房间”的、出现在反射中的静态物体，以及可以反射的动态物体。在某些情况下，这一点是明确的（墙和家具是房间的一部分；人不是），但即使如此，动态物体也不会反射到动态物体。


    另一个值得提及的缺点与 `cube map` 的分辨率有关。我们需要在准确性（高分辨率 cube map 产生更尖锐的反射）和内存消耗（高分辨率 cube
    map 需要更多内存）之间进行平衡。这意味着这意味着环境映射产生的反射没有真正的光线追踪反射那么锐，特别是当近距离观察反射物体时。


    ### 阴影（Shadows）


    我们开发的光线追踪器具有几何正确且边缘清晰的阴影。这些是核心算法的自然扩展。光栅化器的架构使得实现阴影稍微复杂，但并非不可能。


    让我们先形式化我们要解决的问题。为了正确渲染阴影，每当我们为像素和光源计算光照方程时，我们需要知道该像素是否真的被光源照射，或者它是否处于相对于该光的物体阴影中。


    对于光线追踪器，我们可以通过从表面向光源射出射线来回答这个问题；对于光栅化器，我们没有这样的工具，所以必须采取不同的方法。让我们探索两种不同的方法。


    #### 模板阴影（Stencil Shadows）


    `Stencil shadows` 是一种渲染边缘清晰的阴影的技术（想象在非常晴朗的日子里物体投下的阴影）。这些通常被称为 `hard shadows`（硬阴影）。

