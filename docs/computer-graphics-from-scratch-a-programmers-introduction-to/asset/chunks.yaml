    This means that to clip the scene against a clipping volume, we just need to clip
    it in succession against each of the planes that define the clipping volume. Whatever
    geometry remains inside after clipping against one plane is then clipped against
    the remaining planes. After the scene has been clipped against all the planes,
    the geometry that remains is the result of clipping the scene against the clipping
    volume.


    Next we’ll take a look at how to clip the scene against each clipping plane.


    ### Clipping the Scene Against a Plane


    Consider a scene with multiple objects, each made of four triangles ([Figure 11-3](#ch11.xhtml_ch11fig3)).


    ![image](Images/11fig03.jpg)


    *Figure 11-3: A scene with three objects*


    The fewer operations we execute, the faster our renderer will be. We will clip
    the scene against a clipping plane as a sequence of stages. Each stage will attempt
    to classify as much geometry as possible as either `accepted` or `discarded`,
    depending on whether it’s inside or outside the half-space defined by the clipping
    plane (that is, the clipping volume of this plane). Whatever geometry can’t be
    classified moves on to the next stage, which will take a more detailed look at
    it.


    The first stage attempts to classify entire objects at once. If an object is completely
    inside the clipping volume, it’s accepted (green in [Figure 11-4](#ch11.xhtml_ch11fig4));
    if it’s completely outside, it’s discarded (red in [Figure 11-4](#ch11.xhtml_ch11fig4)).


    ![image](Images/11fig04.jpg)


    *Figure 11-4: Clipping at the object level. Green is accepted, red is discarded,
    and gray requires further processing.*


    If an object can’t be fully accepted or discarded, we move on to the next stage
    and classify each of its triangles independently. If a triangle is completely
    inside the clipping volume, it’s accepted; if it’s completely outside, it’s discarded
    (see [Figure 11-5](#ch11.xhtml_ch11fig5)).


    ![image](Images/11fig05.jpg)


    *Figure 11-5: Clipping at the triangle level. Each triangle of the rightmost object
    is either accepted, discarded, or requires further processing.*


    Finally, for each triangle that isn’t either accepted or discarded, we need to
    clip the triangle itself. The original triangle is removed, and either one or
    two new triangles are added to cover the part of the triangle that is inside the
    clipping volume (see [Figure 11-6](#ch11.xhtml_ch11fig6)).


    ![image](Images/11fig06.jpg)


    *Figure 11-6: Clipping at the vertex level. Each triangle that is partially inside
    the clipping volume is split into one or two triangles that are fully inside the
    clipping volume.*


    Now that we have a clear conceptual understanding of how clipping works, we’ll
    develop the math and algorithms to create a working implementation.


    ### Defining the Clipping Planes


    Let’s start with the equation of the projection plane `Z = d`, which we’ll use
    as a clipping plane. This equation is simple to visualize, but it’s not in the
    most convenient or general form for our purposes.


    The general equation for a 3D plane is `Ax + By + Cz + D = 0`, meaning a point
    `P = (x, y, z)` will satisfy that equation if and only if `P` is on the plane.
    If we group the coefficients (`A`, `B`, `C`) in a vector ![image](Images/f0160-01.jpg),
    we can rewrite the equation as ![image](Images/f0138-01.jpg).


    Note that if ![image](Images/f0138-01.jpg), then ![image](Images/f0138-01a.jpg)
    for any value of `k`. In particular, we can choose ![image](Images/f0138-01b.jpg),
    multiply the original equation, and get a new equation ![image](Images/f0138-02.jpg)
    where ![image](Images/f0138-03.jpg) is a unit vector. So any given plane can be
    represented by an equation ![image](Images/f0138-01.jpg), where ![image](Images/f0160-01.jpg)
    is a unit vector and `D` is a real number.


    This is a very convenient formulation: ![image](Images/f0160-01.jpg) happens to
    be the normal of the plane and `-D` is the `signed distance` from the origin to
    the plane. In fact, for any point `P`, ![image](Images/f0138-02a.jpg) is the signed
    distance from the plane to `P`; `distance = 0` is just the special case where
    `P` is contained in the plane.


    If ![image](Images/f0160-01.jpg) is the normal of a plane, so is ![image](Images/f0138-03a.jpg),
