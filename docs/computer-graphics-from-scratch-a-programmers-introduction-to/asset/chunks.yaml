    你可以直接在彩色打印机的墨盒上看到这种色彩模型的证据，或者有时在廉价打印的传单上看到，不同颜色之间会有轻微的偏移。


    ![image](img/01fig04.jpg)


    *图 1-4: 打印机使用的四种减色原色*


    ## 加色色彩模型


    减色色彩模型只是故事的一半。如果你曾近距离观察屏幕，或者用放大镜观察（或者诚地说，不小心往屏幕上喷了口喷嚏），你可能见过微小的彩色点：这些就是红、绿、蓝。


    电脑屏幕与纸是相反的。纸不发射光；它仅仅反射射在它上面的部分光。相反，屏幕虽然是黑色的，但它们会自己发射光。对于纸张，我们从白光开始并`subtract”（减）我们不需要的波长；对于屏幕，我们从无光开始并`add”（加）我们需要的波长。


    这需要不同的原色。大多数颜色可以通过在黑色表面上添加不同数量的红、绿、蓝来实现；这就是`RGB 色彩模型`，一种`加色色彩模型`，如图 1-5 所示。


    加色原色的组合比其组成部分`lighter`更亮），而减色原色的组合则`darker`更暗）；所有的加色原色相加得到白色，而所有的减色原色相加得到黑色。


    ![image](img/01fig05.jpg)


    *图 1-5: 加原生色及其部分组合*


    ## 忘记细节


    现在你已经了解了这一切，可以选择性地忘记大部分细节，专注于对我们工作至重要的内容。


    大多数颜色可以用 RGB 或 CMYK（或许多其他色彩模型中的任何一种）来表示，并且可以从一个`color space`（色彩空间）转换到另一个。由于我们关注的是在屏幕上渲染内容，因此在本书其余部分我们将使用`RGB
    色彩模型`。


    如上所述，物体会吸收到达它们的光的一部分并反射其余部分。哪些波长被吸收哪些被反射，取决于我们感知到的表面“颜色”。从现在起，我们将简单地将颜色视为表面的属性，并忘记光波长。


    ### 色彩深度与表示


    显示器通过混合不同数量的红、绿、蓝来创建颜色。它们通过为表面的微彩色点提供不同的电压，以不同的强度点亮它们来实现这一点。


    我们可以得到多少种不同的强度？尽管电压是连续的，但我们将使用计算机来处理颜色，而计算机使用离散值（即有限的数量）。我们能表示的红、绿、蓝色调越越多，我们能产生的颜色就越多。


    如今你看到的大多数图像每个原色使用 8 位，在本文背景中我们称之为`color channel`（色彩通道）。每个通道使用 8 位使每个像素拥有 24 位，总共有
    `2²⁴` 种不同的颜色（约 1670 万种）。这种格式被称为 `R8G8B8` 或简单称为 `888`，是我们将在书中使用的格式。我们说这种格式的`color
    depth`（色彩深度）为 24 位。


    这绝不是唯一的可能格式。不久前，为了节省内存，15 位和 16 位格式非常流行，在 15 位情况下为每个通道分配 5 位；在 16 位情况下，红色分配 5
    位，绿色分配 6 位，蓝色分配 5 位（被称为 `R5G6B5` 或 `565` 格式）。绿色获得额外的位是因为我们的眼睛对绿色的变化比对红色或蓝色的变化更敏感。


    使用 16 位我们可以得到 `2¹⁶` 种颜色（约 65,000 种）。这意味着在 24 位模式下，每 256 种颜色对应一种颜色。虽然 65,000 种颜色足够，但对于颜色变化非常缓慢的图像，你会看到非常微妙的“阶梯”现象，而这在
    16.7 万种颜色中是不可见的，因为那时有足够的位来表示之间的颜色。对于某些特殊应用（例如电影的调色），使用每个通道使用更多的位来表示更多的颜色细节是一个好主意。


    我们将使用 3 个字节来表示一种颜色，每个字节持有一个 8 位色彩通道的值，范围从 0 到 255。我们将颜色表示为 (`R`, `G`, `B`)——例如，(255,0,0)
    代表纯红；(255,255,255) 代表白色；(255,0,128) 代表红紫色。


    ### 色彩操作


    我们将使用一些操作来处理颜色。如果你了解一些线性代数，你可以将颜色视为 3D 色彩空间中的向量。如果不了解，别担心，我们将介绍现在将使用的基础操作。


    我们可以通过将每个每个色彩通道乘以一个常数来修改颜色的强度：


    ```

    k(R, G, B) = (kR, kG, kB)

    ```


    例如，(32,0,128) 的亮度是 (16,0,64) 的倍。


    我们可以通过分别相加它们的色彩通道将两种颜色加在一起：


    ```

    (R[1], G[1], B[1]) + (R[2], G[2], B[2]) = (R[1]+R[2], G[1]+G[2], B[1]+B[2])

    ```


    ## 场景


    到此为止，我们引入了可以绘制颜色的画布。现在我们关注渲染的对象：场景。


    场景是你感兴趣的物体集合。它可以代表悬浮在空间中的单个球体，也可以代表一个极其精细的巨人模型。


    我们需要一个坐标系来讨论场景中的物体。我们不能使用与画布相同的坐标系，原因有两个：第一，画布是 2D 的，而场景是 3D 的。第二，画布和场景使用的单位不同：画布使用像素，场景使用现实世界的单位（如英制或公制）。


    轴的选择是任意的，所以我们将根据目的选择一个有用的。我们将 Y 定义为向上，X 和 Z 定义为水平方向，且这三个轴相互垂直。将 XZ 平面想象成“地板”，而
    XY 和 YZ 是垂直的“墙壁”。这与我们为画布选择的坐标系保持一致，在画布中，Y 是向上的，X 是水平的。[图 1-6]显示了它的样子。


    ![image](img/01fig06.jpg)


    *我们用于场景的坐标系*


    ### 总结


    在本章中，我们引入了画布，这是一个可以绘制的矩形表面的抽象，以及我们构建其他所有内容的唯一方法：PutPixel。我们还选择了一个坐标系来指代画布上的像素，并描述了表示这些像素颜色的方法。最后，我们引入了场景的概念，并选择了一个用于场景的坐标系。


    在建立了这些基础之后，现在是时候在其基础上构建光线追踪器和光栅化器了。


