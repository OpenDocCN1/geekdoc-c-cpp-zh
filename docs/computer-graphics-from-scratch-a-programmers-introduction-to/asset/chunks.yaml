  raw: 'In order to render this, we just go through the list of instances; for each
    instance, we make a copy of the model’s vertices, translate them according to
    the position of the instance, and then render them as before ([Listing 10-2](#ch10.xhtml_ch10lis2)).


    RenderScene() {


        for I in scene.instances {


            RenderInstance(I);


        }


    }


    RenderInstance(instance) {


        projected = []


        model = instance.model


        for V in model.vertices {


            V’ = V + instance.position


            projected.append(ProjectVertex(V’))


        }


        for T in model.triangles {


            RenderTriangle(T, projected)


        }


    }


    *Listing 10-2: An algorithm to render a scene that can contain multiple instances
    of several objects, each in a different position*


    If we want this to work as expected, the coordinates of the vertices on the model
    should be defined in a coordinate system that “makes sense” for the object; we’ll
    call this coordinate system *model space*. For example, we defined our cube such
    that its center was (0, 0, 0); this means that when we say “a cube located at
    (1, 2, 3),” we mean “a cube centered around (1, 2, 3).”


    After applying the instance translation to the vertices defined in model space,
    the transformed vertices are now expressed in the coordinate system of the scene;
    we’ll call this coordinate system *world space*.


    There are no hard and fast rules to define a model space; it depends on the needs
    of your application. For example, if you have the model of a person, it might
    be sensible to place the origin of the coordinate system at their feet.


    [Figure 10-3](#ch10.xhtml_ch10fig3) shows a simple scene with two instances of
    our cube.


    ![image](Images/10fig03.jpg)


    *Figure 10-3: A scene with two instances of the same cube model, placed in different
    positions*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/instances-demo](https://gabrielgambetta.com/cgfs/instances-demo)*.


    ### Model Transform


    The scene definition we described above doesn’t give us a lot of flexibility.
    Since we can only specify the *position* of a cube, we could instantiate as many
    cubes as we wanted, but they would all be facing the same direction. In general,
    we want to have more control over the instances: we also want to specify their
    orientation and possibly their scale.


    Conceptually, we can define a *model transform* with these three elements: a scaling
    factor, a rotation around the origin in model space, and a translation to a specific
    point in the scene:


    instance {


        model = cube


        transform {


            scale = 1.5


            rotation = <45 degrees around the Y axis>


            translation = (1, 2, 3)


        }


    }


    We can extend the algorithm in [Listing 10-2](#ch10.xhtml_ch10lis2) to accommodate
    the new transforms. However, the order in which we *apply* the transforms is important;
    in particular, the translation must be done last. This is because most of the
    time we want to rotate and scale the instances around their origin in model space,
    so we need to do that before they’re transformed into world space.


    To understand the difference in the results, take a look at [Figure 10-4](#ch10.xhtml_ch10fig4),
    which shows a 45^∘ rotation around the origin followed by a translation along
    the Z axis.


    ![image](Images/10fig04.jpg)


    *Figure 10-4: Applying rotation and then translation*


    [Figure 10-5](#ch10.xhtml_ch10fig5) shows the translation applied before the rotation.


    ![image](Images/10fig05.jpg)


    *Figure 10-5: Applying translation and then rotation*


    Strictly speaking, given a rotation followed by a translation, we can find a translation
    followed by a rotation (perhaps not around the origin) that achieves the same
    result. However, it’s far more natural to express this kind of transform using
    the first form.


    We can write a new version of RenderInstance that supports scale, rotation, and
    position (see [Listing 10-3](#ch10.xhtml_ch10lis3)).


    RenderInstance(instance) {


        projected = []


        model = instance.model


        for V in model.vertices {


            V’ = ApplyTransform(V, instance.transform)


            projected.append(ProjectVertex(V’))


        }


        for T in model.triangles {


            RenderTriangle(T, projected)


        }


    }


    *Listing 10-3: An algorithm to render a scene that can contain multiple instances
    of several objects, each with a different transform*


    The ApplyTransform method looks like [Listing 10-4](#ch10.xhtml_ch10lis4).


    ApplyTransform(vertex, transform) {


        scaled = Scale(vertex, transform.scale)


        rotated = Rotate(scaled, transform.rotation)


        translated = Translate(rotated, transform.translation)


        return translated


    }


    *Listing 10-4: A function that applies transforms to a vertex in the correct order*


    ### Camera Transform


    The previous sections explored how we can position instances of models at different
    points in the scene. In this section, we’ll explore how to move and rotate the
    camera within the scene.


    Imagine you’re a camera floating in the middle of a completely empty coordinate
    system. Suddenly, a red cube appears exactly in front of you ([Figure 10-6](#ch10.xhtml_ch10fig6)).


    ![image](Images/10fig06.jpg)


    *Figure 10-6: A red cube appears in front of the camera.*


    A second later, the cube moves 1 unit toward you ([Figure 10-7](#ch10.xhtml_ch10fig7)).


    ![image](Images/10fig07.jpg)


    *Figure 10-7: The red cube moves toward the camera . . . or does it?*


    But did the cube really move 1 unit toward you? Or did you move 1 unit toward
    the cube? Since there are no points of reference at all, and the coordinate system
    isn’t visible, there’s no way to tell just by looking at what you see, because
    the *relative* position of the cube and the camera are identical in both cases
    ([Figure 10-8](#ch10.xhtml_ch10fig8)).


    ![image](Images/10fig08.jpg)


    *Figure 10-8: Without the coordinate system, we can’t tell whether it was the
    object or the camera that moved.*


    Now the cube rotates around you 45^∘ clockwise. Or does it? Maybe it was you who
    rotated 45^∘ counterclockwise? Again, there’s no way to tell ([Figure 10-9](#ch10.xhtml_ch10fig9)).


    ![image](Images/10fig09.jpg)


    *Figure 10-9: Without the coordinate system, we can’t tell whether it was the
    object or the camera that rotated.*


    What this thought experiment shows is that there’s no difference between moving
    the camera around a fixed scene and keeping the camera fixed while rotating and
    translating the scene around it!


    The advantage of this clearly self-centered vision of the universe is that by
    keeping the camera fixed at the origin and pointing at ![image](Images/f0116-02.jpg),
    we can use the projection equations derived in the previous chapter without any
    modification. The coordinate system of the camera is called the *camera* *space*.


    Let’s assume the camera also has a transform attached to it, consisting of translation
    and rotation. In order to render the scene from the point of view of the camera,
    we need to apply the *opposite* transforms to each vertex of the scene:


    *V[translated]* = *V[scene]* – *camera.translation*


    *V[cam_space]* = *inverse*(*camera.rotation*) ⋅ *V[translated]*


    *V[projected]* = *perspective*_*projection*(*V[cam_space]*)


    Note that we represent rotations using rotation matrices. Please refer to the
    Linear Algebra appendix for more details about this.


    ### The Transform Matrix


    Now that we can move both the camera and the instances around the scene, let’s
    take a step back and consider everything that happens to a vertex *V*[*model*]
    in model space until it’s projected into the canvas point (*cx*, *cy*).


    We first apply the model transform to go from model space to world space:


    *V[model_scaled]* = *instance.scale* ⋅ *V[model]*


    *V[model_rotated]* = *instance.rotation* ⋅ *V[model_scaled]*


    *V[world]* = *V[model_rotated]* + *instance.translation*


    Then we apply the camera transform to go from world space to camera space:


    *V[translated]* = *V[world]* – *camera.translation*


    *V[camera]* = *inverse*(*camera.rotation*) ⋅ *V[translated]*'
