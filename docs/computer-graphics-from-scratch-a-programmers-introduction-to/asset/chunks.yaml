    \ represent all the transforms we need to apply to a vertex as matrix multiplications\
    \ in homogeneous coordinates, and this allowed us to reduce the computations required\
    \ to render a scene by condensing many of the consecutive transforms into just\
    \ three matrices: one for the perspective projection and viewport-to-canvas mapping,\
    \ one for the instance transform, and one for the camera transform.\n\nThis has\
    \ given us a lot of flexibility in terms of what we can represent in a scene,\
    \ and it also allows us to move the camera around the scene. But we still have\
    \ two important limitations. First, moving the camera means we can end up with\
    \ objects behind it, which causes all sorts of problems. Second, the rendering\
    \ doesn’t look so great: it’s still a wireframe image.\n\nNote that for practical\
    \ reasons we won’t be using the full projection matrix in the rest of this book.\
    \ Instead, we’ll use the model and camera transforms separately and then convert\
    \ their results back to Cartesian coordinates as follows:\n\n![image](Images/f0132-02.jpg)\n\
    \nThis lets us do some more operations in 3D that can’t be expressed as matrix\
    \ transforms before we project the points.\n\nIn the next chapter, we’ll deal\
    \ with objects that shouldn’t be visible, and then we’ll spend the rest of this\
    \ book making the rendered objects look better.\n\n# 11 CLIPPING\n\n![image](Images/common.jpg)\n\
    \nIn the last few chapters, we developed equations and algorithms to transform\
    \ a 3D definition of a scene into 2D shapes we can draw on the canvas; we developed\
    \ a scene structure that lets us define 3D models and place instances of those\
    \ models in the scene; and we developed an algorithm that lets us render the scene\
    \ from any point of view.\n\nHowever, doing this exposes one of the limitations\
    \ we’ve been working with: the perspective projection equations only work as expected\
    \ for points that are in front of the camera. Since we can now move and rotate\
    \ the camera around the scene, this poses a problem.\n\nIn this chapter, we’ll\
    \ develop the techniques necessary to lift this limitation: we’ll explore how\
    \ to identify points, triangles, and entire objects that are behind the camera\
    \ and develop techniques to deal with them.\n\n### An Overview of the Clipping\
    \ Process\n\nBack in [Chapter 9](#ch09.xhtml_ch09), we arrived at the following\
    \ equations:\n\n![image](Images/f0134-01.jpg)\n\nThe division by `P[z]` is problematic;\
    \ it can cause a division by zero. Moreover, points behind the camera have negative\
    \ `Z` values, which we currently can’t handle properly. Even points in front of\
    \ the camera but very close to it will cause trouble in the form of severely distorted\
    \ objects.\n\nTo avoid these problematic cases, we’ll choose not to render anything\
