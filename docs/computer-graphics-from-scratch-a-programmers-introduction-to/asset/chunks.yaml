    \n### 完整光照方程\n\n我们将高光反射项添加到一直在开发的光照方程中，得到一个描述点光照的单一表达式：\n\n![image](img/e0045-01.jpg)\n\
    \n其中 `I[P]` 是点 `P` 的总光照，`I[A]` 是环境光强度，`N` 是 `P` 处的表面法线，`V` 是从 `P` 指向相机的向量，`s`\
    \ 是表面的高光指数，`I[i]` 是光 `i` 的强度，`L[i]` 是从 `P` 指向光 `i` 的向量，`R[i]` 是 `P` 处光 `i` 的反射向量。\n\
    \n### 带有高光反射的渲染\n\n让我们高光反射添加到我们目前为止的场景中。首先，对场景本身进行一些更改：\n\n```python\nsphere {\n\
