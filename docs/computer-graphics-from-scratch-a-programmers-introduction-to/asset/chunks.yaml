    更通地说，如果你想计算光线与对象 ![Images](img/adotb.jpg)（其中 ![Images](img/dot.jpg) 是任何集合操作）之间的交集，你需要分别计算光线与
    `A` 和 `B` 的交集，这将得到每个对象“内部”的 `t` 范围，即 `R`[`A]` 和 `R`[`B]`。然后你计算 ![Images](img/e0072-01.jpg)，这就是
    ![Images](img/adotb.jpg) 的“内部”范围。一旦得到了这个结果，光线与 ![Images](img/adotb.jpg) 之间的最近交点就是既在对象“内部”范围内，又在
    `t`[`min`]` 和 `t`[`max`]`之间的最小 `t` 值。图 5-4 显示了两个球体的并集、交集和减法的内部范围。


    ![image](img/05fig04.jpg)


    *图 5-4：两个球体的并集、交集和减法*


    交点处的法线可以是产生交点的对象的法线，或者是其相反方向，这取决于你观察的是原始对象的“外部”还是“内部”。


    当然，`A` 和 `B` 不一定是非元几何体；它们本身可以是集合操作的结果！如果你实现得足够简洁，你甚至不需要知道 `A` 和 `B` *是什么*，只要你能从它们中获取交点和法线即可。这样你就可以取三个球体并计算例如（`A`
    ∪ `B`）∩ `C`。


    ## 透明度 (Transparency)


    到目前为止，我们渲染每个对象都像它们是完全不透明的，但情况并不一定如此。我们可以渲染部分透明的对象，例如鱼缸。


    实现这一点与实现反射非常相似。当光线击中部分透明表面时，你像以前一样计算局部颜色和反射颜色，但还要计算一个额外的颜色——*穿过*对象的线颜色，该颜色通过再次调用
    `TraceRay` 获得。然后根据对象的透明程度，将此颜色与局部颜色和反射颜色进行混合，这与我们计算对象反射时的方法非常相似。


    ## 折射 (Refraction)


    在现实生活中，当一束光穿过透明物体时，它会改变方向（这就是为什么当你把吸管浸在水中时，它看起来是“断了”的）。更准确地说，光线在穿过一种材料（如空气）并进入另一种材料（如水）时会发生方向改变。


    方向的变化取决于每种材料的属性，根据以下称为斯涅定律的方程，称为*折射率*：


    ![image](img/e0074-01.jpg)


    在这里，`α`[`1]` 和 `α`[`2]` 是光线在穿过表面前后与法线之间的角，`n`[`1]` 和 `n`[`2]` 是对象外部和内部材料的折射率。


    例如，`n`[`air]` 大约为 `1.0`，`n`[`water]` 大约为 `1.33`。因此，对于以 60° 角进入水的光，我们有


    ![image](img/e0074-02.jpg)


    这个示例在图 5-5 所示。


    ![image](img/05fig05.jpg)


    *图 5-5：光线在离开空气进入水时发生了折射（改变了方向）。*


    在实现层面，每条光线都必须携带一个额外信息：它当前穿过的材料的折射率。当光线与部分透明对象相交时，你根据当前材料和新材料的折射率计算该点光线的新方向，然后像以前一样继续进行。


    停下来考虑一下：如果你实现了构造实体几何（CSG）和透明度，你就可以建模放大镜（两个球体的交集），它的行为将像一个物理上正确的放大镜！


    ## 总结 (Summary)


    在本章中，我们简要介绍了一些你可以自己探索的理念。这些理念以新的方式改进了我们开发的基础光线追踪器——使其更高效、能够表示复杂的对象，或者以更接近我们物理世界的方式模拟光线。


