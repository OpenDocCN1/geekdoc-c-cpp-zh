  raw: '*Computer Graphics from Scratch* is my humble attempt to present this one
    slice of computer graphics in an accessible way. It is written to be easily understood
    by high-school students, while staying rigorous enough for professional engineers.
    It covers the same topics as a full university course—it is, in fact, based on
    my years of teaching the subject at university.


    ### Who This Book Is For


    This book is for anyone with an interest in computer graphics, from high-school
    students to seasoned professionals.


    I have made a conscious choice to favor simplicity and clarity in the presentation.
    This is reflected in the choice of ideas and algorithms within the book. While
    the algorithms are industry-standard, whenever there’s more than one way to achieve
    a certain result, I have chosen the one that is easiest to understand. At the
    same time, I’ve put considerable effort into making sure there’s no hand-waving
    or trickery. I tried to keep in mind Albert Einstein’s advice: “Everything should
    be made as simple as possible, but no simpler.”


    There’s little prerequisite knowledge and no hardware or software dependencies.
    The only primitive used in this book is a method that lets us set the color of
    a pixel—as close to *from scratch* as we can get. The algorithms are conceptually
    simple, and the math is straightforward—at most, a tiny bit of high-school trigonometry.
    We also use some linear algebra, but the book includes a short appendix presenting
    everything we need in a very practical way.


    ### What This Book Covers


    This book starts from scratch and builds up to two complete, fully functional
    renderers: a raytracer and a rasterizer. Although they follow very different approaches,
    they produce similar results when used to render a simple scene. [Figure 1](#introduction.xhtml_introfig1)
    shows a comparison.


    ![Image](Images/fxviii-01.jpg)


    *Figure 1: A simple scene rendered by the raytracer (left) and the rasterizer
    (right) developed in this book.*


    While the features of the raytracer and rasterizer have considerable overlap,
    they are not identical, and this book explores their specific strengths, some
    of which can be seen in [Figure 2](#introduction.xhtml_introfig2).


    ![Image](Images/fxix-01.jpg)


    *Figure 2: The raytracer and the rasterizer have their own unique features. Left:
    raytraced shadows and recursive reflections; right: rasterized textures.*


    The book provides informal pseudocode throughout the text, as well as links to
    fully working implementations written in JavaScript that can run directly in any
    web browser.


    ### Why Read This Book?


    This book should give you all the knowledge you need to write software renderers.
    It does not make use of, or teach you how to use, existing rendering APIs such
    as OpenGL, Vulkan, Metal, or DirectX.


    Modern GPUs are powerful and ubiquitous, and few people have good reason to write
    a pure software renderer. However, the experience of writing one is valuable for
    the following reasons:


    **Shaders are software.** The first, ancient GPUs of the early 1990s implemented
    their rendering algorithms directly in hardware, so you could use them but not
    modify them (which is why most games from the mid-1990s look so similar to each
    other). Today, you write your own rendering algorithms (called *shaders* in this
    context) and they run in the specialized chips of a GPU.


    **Knowledge is power.** Understanding the theory behind the different rendering
    techniques, rather than copying and pasting half-understood fragments of code
    or cargo-culting popular approaches, lets you write better shaders and rendering
    pipelines.


    **Graphics are fun.** Few areas of computer science provide the kind of instant
    gratification offered by computer graphics. The sense of accomplishment you get
    when your SQL query runs just right is *nothing* compared to what you feel the
    first time you get raytraced reflections right. I taught computer graphics at
    university for five years, and I often wondered why I enjoyed teaching the same
    thing semester after semester for so long; in the end, what made it worth it was
    seeing the faces of my students light up and seeing them use their first rendered
    scenes as their desktop backgrounds.


    ### About This Book


    This book is divided into two parts, *Raytracing* and *Rasterization*, corresponding
    to the two renderers we are going to build.


    The first chapter introduces some basic knowledge necessary to understand these
    two parts. I suggest you read the chapters in order, but both parts of the book
    are self-contained enough that they can be read mostly independently.


    Here’s a brief overview of what you’ll find in each chapter.


    **[Chapter 1: Introductory Concepts](#ch01.xhtml_ch01)** We define the *canvas*,
