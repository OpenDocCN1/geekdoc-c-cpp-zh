    \ to the scene and how to illuminate the objects it contains. First, let’s look\
    \ at a bit of terminology.\n\n### Shading vs. Illumination\n\nThe title of this\
    \ chapter is “Shading,” not “Illumination”; these are two different but closely\
    \ related concepts. *Illumination* refers to the math and algorithms necessary\
    \ to compute the effect of light on a single point in the scene; *shading* deals\
    \ with techniques that extend the effect of light on a discrete set of points\
    \ to entire objects.\n"
  raw: 'These arrows let us classify each triangle as “front” or “back,” depending
    on whether they point toward the camera or away from the camera. More formally,
    if the view vector and this arrow (which is actually a normal vector of the triangle)
    form an angle of less than 90^∘, the triangle is front-facing; otherwise, it’s
    back-facing ([Figure 12-9](#ch12.xhtml_ch12fig9)).


    ![image](Images/12fig09.jpg)


    *Figure 12-9: The angle between the view vector and the normal vector of a triangle
    lets us classify it as front-facing or back-facing.*


    At this point, we need to impose a restriction on our 3D models: that they are
    *closed*. The exact definition of closed is pretty involved, but fortunately an
    intuitive understanding is enough. The cube we’ve been working with is closed;
    we can only see its exterior. If we removed one of its faces, it wouldn’t be closed
    because we could see inside it. This doesn’t mean we can’t have objects with holes
    or concavities; we would just model these with thin “walls.” See [Figure 12-10](#ch12.xhtml_ch12fig10)
    for some examples.


    ![image](Images/12fig10.jpg)


    *Figure 12-10: Some examples of open and closed objects*


    Why impose this restriction? Closed objects have the interesting property that
    the set of front faces completely covers the set of back faces, no matter the
    orientation of the model or the camera. This means we don’t need to draw the back
    faces at all, saving valuable computation time.


    Since we can discard (cull) all the back faces, this algorithm is called *back
    face* *culling*. Its pseudocode is remarkably simple for an algorithm that can
    cut our rendering time by half!


    CullBackFaces(object, camera) {


      for T in object.triangles {


        if T is back-facing {


          remove T from object.triangles


        }


      }


    }


    *Listing 12-1: The back face culling algorithm*


    Let’s take a more detailed look at how to determine whether a triangle is front-facing
    or back-facing.


    #### Classifying Triangles


    Suppose we have the normal vector ![image](Images/f0160-01.jpg) of a triangle
    and the vector ![image](Images/f0160-02.jpg) from a vertex of the triangle to
    the camera. Now suppose ![image](Images/f0160-01.jpg) points to the outside of
    the object. In order to classify the triangle as front-facing or back-facing,
    we compute the angle between ![image](Images/f0160-01.jpg) and ![image](Images/f0160-02.jpg)
    and check whether they’re within 90^∘ of each other.


    We can again use the properties of the dot product to make this simpler. Remember
    that if *α* is the angle between ![image](Images/f0160-01.jpg) and ![image](Images/f0160-02.jpg),
    then


    ![image](Images/f0160-03.jpg)


    Because cos(*α*) is non-negative for |*α*| ≤ 90^∘, we only need to know the sign
    of this expression to classify a triangle as front-facing or back-facing. Note
    that ![image](Images/f0160-03a.jpg) and ![image](Images/f0160-03b.jpg) are always
    positive, so they don’t affect the sign of the expression. Therefore


    ![image](Images/f0160-04.jpg)


    The classification criterion is simply this:


    ![image](Images/f0160-05.jpg)


    The edge case ![image](Images/f0160-06.jpg) corresponds to the case where we’re
    looking at the edge of a triangle head on—that is, when the camera and the triangle
    are coplanar. We can classify this triangle either way without affecting the result
    much, so we choose to classify it as back-facing to avoid dealing with degenerate
    triangles.


    Where do we get the normal vector from? It turns out there’s a vector operation,
    the *cross* *product* ![image](Images/f0160-07.jpg), that takes two vectors ![image](Images/f0160-08.jpg)
    and ![image](Images/f0160-09.jpg) and produces a vector perpendicular to both
    (for a definition of this operation, see the Linear Algebra appendix. In other
    words, the cross product of two vectors on the surface of a triangle is a normal
    vector of that triangle. We can easily get two vectors on the triangle by subtracting
    its vertices from each other. So computing the direction of the normal vector
    of the triangle *ABC* is straightforward:


    ![image](Images/f0160-10.jpg)


    Note that “the direction of the normal vector” is not the same as “the normal
    vector.” There are two reasons for this. The first one is that ![image](Images/f0160-03a.jpg)
    isn’t necessarily equal to 1\. This isn’t really important because normalizing
    ![image](Images/f0160-01.jpg) would be trivial and because we only care about
    the sign of ![image](Images/f0160-11.jpg).


    The second reason is that if ![image](Images/f0160-01.jpg) is a normal vector
    of *ABC*, so is ![image](Images/f0138-03a.jpg), and in this case we care deeply
    about the direction ![image](Images/f0160-01.jpg) points in, because this is exactly
    what lets us classify triangles as either front-facing or back-facing.


    Moreover, the cross product of two vectors is not commutative: ![image](Images/f0161-01.jpg).
    In other words, the order of the vectors in this operation matters. And since
    we defined *V*[1] and *V*[2] in terms of *A*, *B*, and *C*, this means the order
    of the vertices in a triangle matters. We can’t treat the triangles *ABC* and
    *ACB* as the same triangle anymore.


    Fortunately, none of this is random. Given the definition of the cross product
    operation, the way we defined *V*[1] and *V*[2], and the coordinate system we
    use (X to the right, Y up, Z forward), there is a very simple rule that determines
    the direction of the normal vector: if the vertices of the triangle *ABC* are
    in clockwise order when you look at them from the camera, the normal vector as
    calculated above will point toward the camera—that is, the camera is looking at
    the front face of the triangle.


    We just need to keep this rule in mind when designing 3D models manually and list
    the vertices of each triangle in clockwise order when looking at its front face,
    so that their normals point “out” when we compute them this way. Of course, the
    example cube model we’ve been using so far follows this rule.


    ### Summary


    In this chapter, we made our renderer, which could previously only render wireframe
    objects, capable of rendering solid-looking objects. This is more involved than
    just using DrawFilledTriangle instead of DrawWireframeTriangle, because we need
    triangles close to the camera to obscure triangles further away from the camera.


    The first idea we explored was to draw the triangles from back to front, but this
    had a few drawbacks that we discussed. A better idea is to work at the pixel level;
    this idea led us to a technique called depth buffering, which produces correct
    results regardless of the order in which we draw the triangles.


    We finally explored an optional but valuable technique that doesn’t change the
    correctness of the results, but can save us from rendering approximately half
    of the triangles of the scene: back face culling. Since all the back-facing triangles
    of a closed object are covered by all its front-facing triangles, there’s no need
    to draw the back-facing triangles at all. We presented a simple algebraic way
    to determine whether a triangle is front- or back-facing.


    Now that we can render solid-looking objects, we’ll devote the rest of this book
    to making these objects look more realistic.


    ## **13


    SHADING**


    ![image](Images/common.jpg)


    Let’s continue making our images more realistic; in this chapter, we’ll examine
    how to add lights to the scene and how to illuminate the objects it contains.
    First, let’s look at a bit of terminology.


    ### Shading vs. Illumination


    The title of this chapter is “Shading,” not “Illumination”; these are two different
    but closely related concepts. *Illumination* refers to the math and algorithms
    necessary to compute the effect of light on a single point in the scene; *shading*
    deals with techniques that extend the effect of light on a discrete set of points
    to entire objects.'
