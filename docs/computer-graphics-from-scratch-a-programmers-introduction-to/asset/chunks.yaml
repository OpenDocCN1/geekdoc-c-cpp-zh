    by more than a certain threshold, you apply pixel subdivision to both.


    ### Summary


    In this chapter, we have briefly introduced several ideas you can explore by yourself.
    These modify the basic raytracer we’ve been developing in new and interesting
    ways—making it more efficient, able to represent more complex objects, or modeling
    rays of light in a way that better approximates our physical world.


    This first part of the book should be proof that raytracers are beautiful pieces
    of software that can produce stunningly beautiful images using nothing but straightforward,
    intuitive algorithms and simple math.


    Sadly, this purity comes at a cost: performance. While there are numerous way
    to optimize and parallelize raytracers, as discussed in this chapter, they’re
    still too computationally expensive for real-time performance; and while hardware
    gets faster every year, some applications demand pictures 100 times faster—with
    no loss in quality. Of all these applications, games are the most demanding: we
    expect picture-perfect images drawn at least 60 times per second. Raytracers just
    don’t cut it.


    How have videogames been doing it since the early 90s, then?


    The answer lies in a completely different family of algorithms that we’ll explore
    in the second part of this book.


    ## PART II


    RASTERIZATION


    ## **6


    LINES**


    ![image](Images/common.jpg)


    In [Part I](#part01.xhtml) of this book, we studied raytracing extensively and
    developed a raytracer that could render our test scene with accurate lighting,
    material properties, shadows, and reflection using relatively simple algorithms
    and math. This simplicity comes at a cost: performance. While non-real-time performance
    is fine for certain applications, such as architectural visualization or visual
    effects for movies, it’s not enough for other applications, such as video games.


    In this part of the book, we’ll explore an entirely different set of algorithms
    that favor performance over mathematical purity.


    Our raytracer starts from the camera and explores the scene through the viewport.
    For every pixel of the canvas, we answer the question, *“Which* *object of the
    scene is visible here?”* Now we’ll follow an approach that is, in some sense,
    the opposite: for every object in the scene, we’ll try to answer the question
    *“In which parts of the canvas will this object be* *visible?”*


    It turns out we can develop algorithms that answer this new question much faster
    than raytracing could, as long as we’re willing to make some accuracy trade-offs.
    Later, we’ll explore how to use these fast algorithms to achieve results with
    a quality comparable to that of a raytracer.


    We’ll start from scratch again: we have a canvas of dimensions *C*[*w*] and *C*[*h*],
    and we can set the color of individual pixels with PutPixel(), but nothing else.
    Let’s explore how to draw the simplest possible element on the canvas: a line
    between two points.


    ### Describing Lines'
