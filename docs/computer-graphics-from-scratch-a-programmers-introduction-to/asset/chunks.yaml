- fmt: "\n`Projection` should rarely change; it only depends on the size of the viewport\
    \ and the size of the canvas. The size of the canvas changes when, for example,\
    \ the application goes from windowed to fullscreen. The size of the viewport would\
    \ only change if the field of view of the camera changes; this doesn’t happen\
    \ very often.\n\n`Camera` may change every frame; it depends on the camera position\
    \ and orientation, so if the camera is moving or turning, it needs to be recomputed.\
    \ Once computed, though, it remains constant for every object drawn in the frame,\
    \ so it would be computed at most once per frame.\n\n`Model` will be different\
    \ for each instance in the scene; however, it will remain constant over time for\
    \ instances that don’t move (for example, trees and buildings), so it can be computed\
    \ once and stored in the scene itself. For objects that do move (for example,\
    \ cars in a racing game) it needs to be computed every time they move (which is\
    \ likely to be every frame).\n\nA very high level of the scene rendering pseudocode\
    \ would look like [Listing 10-5](#ch10.xhtml_ch10lis5).\n\n```\nRenderModel(model,\
    \ transform) {\n    projected = []\n    for V in model.vertices {\n        projected.append(ProjectVertex(transform\
    \ * V))\n    }\n    for T in model.triangles {\n        RenderTriangle(T, projected)\n\
    \    }\n}\n\nRenderScene() {\n    M_camera = MakeCameraMatrix(camera.position,\
    \ camera.orientation)\n    for I in scene.instances {\n        M = M_camera *\
    \ I.transform\n        RenderModel(I.model, M)\n    }\n}\n```\n\n*Listing 10-5:\
    \ An algorithm to render a scene using transform matrices*\n\nWe can now draw\
    \ a scene containing several instances of different models, possibly moving around\
    \ and rotating, and we can move the camera throughout the scene. [Figure 10-10](#ch10.xhtml_ch10fig10)\
    \ shows two instances of our cube model, each with a different transform (including\
    \ translation and rotation), rendered from a translated and rotated camera.\n\n\
    ![image](Images/10fig10.jpg)\n\n*Figure 10-10: A scene with two instances of the\
    \ same cube model, having different instance transforms, and a transformed camera*\n\
    \nYou can find a live implementation of this algorithm at `[https://gabrielgambetta.com/cgfs/transforms-demo](https://gabrielgambetta.com/cgfs/transforms-demo)`.\n\
