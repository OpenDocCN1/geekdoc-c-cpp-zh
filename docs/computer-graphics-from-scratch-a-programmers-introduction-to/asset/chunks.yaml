    数字的顺序很重要；(4, 3) 与 (3, 4) 不同。按照惯例，二维空间中的坐标被称为 `x` 和 `y`，三维空间中被称为 `x`、`y` 和 `z`；因此，点
    (4, 3) 的 `x` 坐标为 4，`y` 坐标为 3。图 A-1 显示了 `P`，一个坐标为 (4, 3) 的二维点。


    ![image](img/Afig01.jpg)


    *图 A-1：二维点* `P` *的坐标为 (4, 3)。*


    我们也可以使用下标引用点的特定坐标，例如 `P[x]` 或 `Q[y]`。因此，在方便的情况下，点 `P` 也可以写为 `(P[x], P[y], P[z])`。


    ## 向量


    *向量*表示两个点之间的差。直观地说，将向量想象成连接一个点到另一个点的箭头；或者，将其看作从一个点到另一个点的指令。


    ### 向量的表示


    我们将向量表示为括号中的一组数字，并用大写字母引用它们。这与我们表示点的方法相同，因此我们在上方添加一个小箭头，以记住它们是向量而不是点。例如，(2, 1)
    是一个向量，我们可能将其记为 ![Images](img/f0204-01.jpg)。图 A-2](#appendix.xhtml_app01fig2) 显示了两个相等的向量，![Images](img/f0204-01.jpg)
    和 ![Images](img/f0204-02.jpg)。


    ![image](img/Afig02.jpg)


    *图 A-2：向量* ![Images](img/f0204-03.jpg) *和* ![Images](img/f0204-04.jpg) *相等。向量没有位置。*


    尽管与点共享表示法，但向量并不代表也不具有位置；毕竟，它们是两个位置之间的*差*。当你有一个像图 A-2 樣样的图表时，你必须在某处画出向量；但向量 ![Images](img/f0204-01.jpg)
    和 ![Images](img/f0204-02.jpg) 是相等的，因为它们代表相同的位移。


    此外，点 (2, 1) 和向量 (2, 1) 是无关的。确实，向量 (2, 1) 从 (0, 0) 到 (2, 1)，但同样，它也可以从（例如）(5, 5)
    到 (7, 6)。


    向量的特征是它们的*方向*（它们指向的角度）和它们的*大小*（它们的长度）。


    方向可以进一步分解为*朝向*（它们所在直线的斜率）和*指向*（它们指向沿沿那条直线的两个可能方向中的哪一个）。例如，指向右侧的向量和指向左侧的向量具有相同的水平朝向，但它们的指向相反。然而，我们在这书中任何地方都没有做这种区分。


    ### 向量的大小


    你可以根据坐标计算向量的大小。大小也称为向量的*长度*（length）或*范数*（norm）。它通过将向量放在竖线之间来表示，如 ![Images](img/f0205-01.jpg)，计算方法如下：


    ```

    ![image](img/f0205-02.jpg)

    ```


    大小等于 1.0 的向量被称为*单位向量*。


    ## 点与向量运算


    现在我们已经了点和向量，让我们探索对它们可以做什么。


    ### 点减法


    向量是两个点之间的差。换句话说，你可以减去两个点得到一个向量：


    ```

    ![image](img/f0205-03.jpg)

    ```


    在这种情况下，你可以将 ![Images](img/varr.jpg) 视为从 `Q` “到” `P`，如图 A-3 所示。


    ![image](img/Afig03.jpg)


    *图 A-3：向量 ![Images](img/f0206-02.jpg) 是* `P` *与* `Q` *之间的差。*


    在代数上，你分别减去每个坐标：


    ```

    (V[x], V[y], V[z]) = (P[x], P[y], P[z]) – (Q[x], Q[y], Q[z]) = (P[x] – Q[x], P[y]
    – Q[y], P[z] – Q[z])

    ```


    ### 点与向量相加


    我们可以逐坐标重写上面的方程：


    ```

    V[x] = P[x] – Q[x]

    V[y] = P[y] – Q[y]

    V[z] = P[z] – Q[z]

    ```

