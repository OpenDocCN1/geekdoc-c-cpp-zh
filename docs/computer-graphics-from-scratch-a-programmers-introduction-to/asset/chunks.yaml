    \ choose which one to use depending on the line we’re trying to draw. And the\
    \ criterion is quite simple; does the line have more different values of `x` than\
    \ different values of `y`? If there are more values of `x` than `y`, we use the\
    \ first version; otherwise, we use the second.\n"
  raw: 'Suppose we have two canvas points, *P*[0] and *P*[1], with coordinates (*x*[0],
    *y*[0]) and (*x*[1], *y*[1]) respectively. How can we draw the straight line segment
    between *P*[0] and *P*[1]?


    Let’s start by representing a line with parametric coordinates, just as we did
    with rays before (in fact, you can think of “rays” as lines in 3D). Any point
    *P* on the line can be obtained by starting at *P*[0] and moving some distance
    along the direction from *P*[0] to *P*[1]:


    *P* = *P*[0] + *t*(*P*[1] – *P*[0])


    We can decompose this equation into two, one for each coordinate:


    *x* = *x*[0] + *t* ⋅ (*x*[1] – *x*[0])


    *y* = *y*[0] + *t* ⋅ (*y*[1] – *y*[0])


    Let’s take the first equation and solve for *t*:


    ![image](Images/f0080-01.jpg)


    We can now plug this expression for *t* into the second equation:


    ![image](Images/f0080-02.jpg)


    Rearranging it a bit:


    ![image](Images/f0081-01.jpg)


    Notice that ![image](Images/f0081-02.jpg) is a constant that depends only on the
    endpoints of the segment; let’s call it *a*. So we can rewrite the equation above
    as


    *y* = *y*[0] + *a* ⋅ (*x* – *x*[0])


    What is *a*? According to the way we’ve defined it, it measures the change in
    the *y* coordinate per unit change in the *x* coordinate; in other words, it’s
    a measure of the *slope* of the line.


    Let’s go back to the equation. Distributing the multiplication:


    *y* = *y*[0] + *ax* – *ax*[0]


    Grouping the constants:


    *y* = *ax* + (*y*[0] – *ax*[0])


    Again, (*y*[0] *–* *ax*[0]) depends only on the endpoints of the segment; let’s
    call it *b*. Finally we get


    *y* = *ax* + *b*


    This is the standard formulation of a linear function, which can be used to represent
    *almost* any line. When we solved for *t*, we added a division by *x*[1] *–* *x*[0]
    without thinking what happens if *x*[1] = *x*[0]. We can’t divide by zero, which
    means this formulation can’t represent lines with *x*[1] = *x*[0]—that is, vertical
    lines.


    To work around this issue, we’ll just ignore vertical lines for now and figure
    out how to deal with them later.


    ### Drawing Lines


    We now have a way to get the value of *y* for each value of *x* we’re interested
    in. This gives us a pair (*x*, *y*) that satisfies the equation of the line.


    We can now write a first approximation of a function that draws a line segment
    from *P*[0] to *P*[1]. Let x0 and y0 be the *x* and *y* coordinates of *P*[0],
    respectively, and x1 and y1 those of *P*[1]. Assuming *x*[0] < *x*[1], we can
    go from *x*[0] to *x*[1], computing the value of *y* for each value of *x*, and
    drawing a pixel at these coordinates:


    DrawLine(P0, P1, color) {


        a = (y1 - y0) / (x1 - x0)


        b = y0 - a * x0


        for x = x0 to x1 {


            y = a * x + b


            canvas.PutPixel(x, y, color)


        }


    }


    Note that the division operator / is expected to perform real division, not integer
    division. This is despite *x* and *y* being integers in this context, as they
    represent coordinates of pixels on the canvas.


    Also note that we consider for loops to include the last value of the range. In
    C, C++, Java, and JavaScript, among others, this would be written as for (x =
    x0; x <= x1; ++x). We will be using this convention throughout this book.


    This function is a direct, naive implementation of the equation above. It works,
    but can we make it faster?


    We aren’t calculating values of *y* for any arbitrary *x*. On the contrary, we’re
    calculating them only at integer increments of *x* and we’re doing so in order.
    Right after calculating *y*(*x*), we calculate *y*(*x* + 1):


    *y*(*x*) = *ax* + *b*


    *y*(*x* + 1) = *a* ⋅ (*x* + 1) + *b*


    We can manipulate that second expression a bit:


    *y*(*x* + 1) = *ax* + *a* + *b*


    *y*(*x* + 1) = (*ax* + *b*) + *a*


    *y*(*x* + 1) = *y*(*x*) + *a*


    This shouldn’t be surprising; after all, the slope *a* is the measure of how much
    *y* changes when *x* increases by 1, which is exactly what we’re doing here.


    This means we can compute the next value of *y* just by taking the previous value
    of *y* and adding the slope; no per-pixel multiplication is needed, which makes
    the function faster. At the beginning there’s no “previous value of *y*,” so we
    start at (*x*[0], *y*[0]). Then we keep adding 1 to *x* and *a* to *y* until we
    get to *x*[1].


    Again assuming that *x*[0] < *x*[1], we can rewrite the function as follows:


    DrawLine(P0, P1, color) {


        a = (y1 - y0) / (x1 - x0)


        y = y0


        for x = x0 to x1 {


            canvas.PutPixel(x, y, color)


            y = y + a


        }


    }


    So far we’ve been assuming that *x*[0] < *x*[1]. There’s an easy workaround to
    support lines where that doesn’t hold: since the order in which we draw the pixels
    doesn’t matter, if we get a right-to-left line, we can just swap P0 and P1 to
    transform it into the left-to-right version of the same line, and draw it as before:


    DrawLine(P0, P1, color) {


        // Make sure x0 < x1


        if x0 > x1 {


            swap(P0, P1)


        }


        a = (y1 - y0) / (x1 - x0)


        y = y0


        for x = x0 to x1 {


            canvas.PutPixel(x, y, color)


            y = y + a


        }


    }


    Let’s use our function to draw a couple of lines. [Figure 6-1](#ch06.xhtml_ch6fig1)
    shows the line segment (*–*200, *–*100) *–* (240, 120), and [Figure 6-2](#ch06.xhtml_ch6fig2)
    shows a close-up of the line.


    ![image](Images/06fig01.jpg)


    *Figure 6-1: A straight line*


    ![image](Images/06fig02.jpg)


    *Figure 6-2: Zooming in on the straight line*


    The line appears jagged because we can only draw pixels on integer coordinates,
    and mathematical lines actually have zero width; what we’re drawing is a quantized
    approximation of the ideal line from (*–*200, *–*100) *–* (240, 120). There are
    ways to draw prettier approximations of lines (you may want to look into MSAA,
    FXAA, SSAA, and TAA as possible entry points to an interesting set of rabbit holes).
    We won’t go there for two reasons: (1) it’s slower, and (2) our goal is not to
    draw pretty lines but to develop some basic algorithms to render 3D scenes.


    Let’s try another line, (*–*50, *–*200) *–* (60, 240). [Figure 6-3](#ch06.xhtml_ch6fig3)
    shows the result and [Figure 6-4](#ch06.xhtml_ch6fig4) shows the corresponding
    close-up.


    ![image](Images/06fig03.jpg)


    *Figure 6-3: Another straight line with a higher slope*


    ![image](Images/06fig04.jpg)


    *Figure 6-4: Zooming in on the second straight line*


    Oops. What happened?


    The algorithm did exactly what we told it to; it went from left to right, computed
    one value of *y* for each value of *x*, and painted the corresponding pixel. The
    problem is that it computed *one* value of *y* for each value of *x*, while in
    this case we actually need *several* values of *y* for some values of *x*.


    This happens because we chose a formulation where *y* = *f* (*x*); in fact, it’s
    the same reason why we can’t draw vertical lines—an extreme case where all the
    values of *y* correspond to the same value of *x*.


    ### Drawing Lines with Any Slope


    Choosing *y* = *f* (*x*) was an arbitrary choice; we could equally have chosen
    to express the line as *x* = *f* (*y*). Reworking all the equations by exchanging
    *x* and *y*, we get the following algorithm:


    DrawLine(P0, P1, color) {


        // Make sure y0 < y1


        if y0 > y1 {


            swap(P0, P1)


        }


        a = (x1 - x0)/(y1 - y0)


        x = x0


        for y = y0 to y1 {


            canvas.PutPixel(x, y, color)


            x = x + a


        }


    }


    This is identical to the previous DrawLine, except the *x* and *y* computations
    have been exchanged. This one can handle vertical lines and will draw (0, 0) *–*
    (50, 100) correctly; but of course, it can’t handle horizontal lines at all, or
    draw (0, 0) *–* (100, 50) correctly! What to do?


    We can just keep both versions of the function and choose which one to use depending
    on the line we’re trying to draw. And the criterion is quite simple; does the
    line have more different values of *x* than different values of *y*? If there
    are more values of *x* than *y*, we use the first version; otherwise, we use the
    second.'
