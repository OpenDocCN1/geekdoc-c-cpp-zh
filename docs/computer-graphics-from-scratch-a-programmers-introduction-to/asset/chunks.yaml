- fmt: "\nSuccess! We’ve managed to go from the geometrical 3D representation of an\
    \ object to its 2D representation as seen from our synthetic camera!\n\nOur approach\
    \ is very artisanal, though. It has many limitations. What if we want to render\
    \ *two* cubes? Would we have to duplicate most of the code? What if we want to\
    \ render something other than a cube? What if we want to let the user load a 3D\
    \ model from a file? We clearly need a more data-driven approach to representing\
    \ 3D geometry.\n\n## Summary\n\nIn this chapter, we’ve developed the math to go\
    \ from a 3D point in the scene to a 2D point on the canvas. Because of the properties\
    \ of the perspective projection, we can immediately extend this to projecting\
    \ line segments and then to 3D objects.\n\nBut we have left two important issues\
    \ unresolved. First, [Listing 9-1](#ch09.xhtml_ch9lis1) mixes the perspective\
    \ projection logic with the geometry of the cube; this approach clearly won’t\
    \ scale. Second, because of the limitations of the perspective projection equation,\
    \ it can’t handle objects that are behind the camera. We will address these issues\
    \ in the next two chapters.\n\n# 10 DESCRIBING AND RENDERING A SCENE\n\n![image](Images/common.jpg)\n\
    \nIn the last few chapters, we’ve developed algorithms to draw 2D triangles on\
    \ the canvas given their 2D coordinates, and we’ve explored the math required\
    \ to transform the 3D coordinates of points in the scene to the 2D coordinates\
    \ of points on the canvas.\n\nAt the end of the previous chapter, we cobbled together\
    \ a program that used both to render a 3D cube on the 2D canvas. In this chapter,\
    \ we’ll formalize and extend that work with the goal of rendering a whole scene\
    \ containing an arbitrary number of objects.\n\n## Representing a Cube\n\nLet’s\
    \ think again about how to represent and manipulate a cube, this time with the\
    \ goal of finding a more general approach. The edges of our cube are 2 units long\
    \ and are parallel to the coordinate axes, and it’s centered on the origin, as\
    \ shown in [Figure 10-1](#ch10.xhtml_ch10fig1).\n\n![image](Images/10fig01.jpg)\n\
    \n*Figure 10-1: Our standard cube*\n\nThese are the coordinates of its vertices:\n\
    \n`A` = (1,1,1)\n\n`B` = (–1,1,1)\n\n`C` = (–1,–1,1)\n\n`D` = (1,–1,1)\n\n`E`\
    \ = (1,1,–1)\n\n`F` = (–1,1,–1)\n\n`G` = (–1,–1,–1)\n\n`H` = (1,–1,–1)\n\nThe\
    \ sides of the cube are square, but the algorithms we have developed work with\
    \ triangles. One of the reasons we chose triangles in the first place is that\
    \ any other polygon, including squares, can be decomposed into triangles. So we’ll\
    \ represent each square side of the cube using two triangles.\n\nHowever, we can’t\
    \ take *any* three vertices of the cube and expect them to describe a triangle\
    \ on its surface (for example, ADG is inside the cube). This means that the vertex\
    \ coordinates, by themselves, don’t fully describe the cube: we also need to know\
    \ which sets of three vertices describe the triangles that make up its sides.\n\
    \nHere’s a possible list of triangles for our cube:\n\nA, B, C\n\nA, C, D\n\n\
    E, A, D\n\nE, D, H\n\nF, E, H\n\nF, H, G\n\nB, F, G\n\nB, G, C\n\nE, F, B\n\n\
    E, B, A\n\nC, G, H\n\nC, H, D\n\nThis suggests a generic structure we can use\
    \ to represent *any* object made of triangles: a `Vertices` list, holding the\
    \ coordinates of each vertex; and a `Triangles` list, specifying which sets of\
    \ three vertices describe triangles on the surface of the object.\n\nEach entry\
    \ in the `Triangles` list may include additional information besides the vertices\
    \ that make it up; for example, this would be the perfect place to specify the\
    \ color of each triangle.\n\nSince the most natural way to store this information\
    \ is in two lists, we’ll use list indices to refer to the vertices in the vertex\
    \ list. So our cube would be represented like this:\n\nVertices\n0 = ( 1,  1,\
    \  1)\n1 = (-1,  1,  1)\n2 = (-1, -1,  1)\n3 = ( 1, -1,  1)\n4 = ( 1,  1, -1)\n\
    5 = (-1,  1, -1)\n6 = (-1, -1, -1)\n7 = ( 1, -1, -1)\n\nTriangles\n0 = 0, 1, 2,\
    \ red\n1 = 0, 2, 3, red\n2 = 4, 0, 3, green\n3 = 4, 3, 7, green\n4 = 5, 4, 7,\
    \ blue\n5 = 5, 7, 6, blue\n6 = 1, 5, 6, yellow\n7 = 1, 6, 2, yellow\n8 = 4, 5,\
    \ 1, purple\n9 = 4, 1, 0, purple\n10 = 2, 6, cyan\n11 = 2, 7, cyan\n\nRendering\
    \ an object with this representation is quite simple: we first project every vertex,\
    \ storing them in a temporary `projected` list (since each vertex is used an average\
    \ of four times); then we go through the triangle list, rendering each individual\
    \ triangle. A first approximation would look like `Listing 10-1`.\n\n```\nRenderObject(vertices,\
    \ triangles) {\n  projected = []\n  for V in vertices {\n    projected.append(ProjectVertex(V))\n\
    \  }\n  for T in triangles {\n    RenderTriangle(T, projected)\n  }\n}\n\nRenderTriangle(triangle,\
    \ projected) {\n  DrawWireframeTriangle(projected.v[0]);\n  DrawWireframeTriangle(projected.v[1]);\n\
    \  DrawWireframeTriangle(projected.v[2]);\n  DrawWireframeTriangle(triangle.color)\n\
    }\n```\n*Listing 10-1: An algorithm to render any object made of triangles*\n\n\
    We can go ahead and apply this directly to the cube as defined above, but the\
    \ results won’t look good. This is because some of its vertices are behind the\
    \ camera, which, as we discussed in the previous chapter, is a recipe for weird\
    \ things. And if you look at the vertex coordinates and [Figure 10-1](#ch10.xhtml_ch10fig1),\
    \ you’ll notice the coordinate origin, the position of our camera, is *inside*\
    \ the cube.\n\nTo work around this problem, we’ll just move the cube. To do this,\
    \ we need to move each vertex of the cube in the same direction. Let’s call this\
    \ direction ![image](Images/f0116-01.jpg), for “translation.” We’ll translate\
    \ the cube 7 units forward to make sure it’s completely in front of the camera.\
    \ We’ll also translate it 1.5 units to the left to make it look interesting. Since\
    \ “forward” is the direction of ![image](Images/f0116-02.jpg) and “left” is ![image](Images/f0116-03.jpg),\
    \ the translation vector is simply\n\n![image](Images/f0116-04.jpg)\n\nTo compute\
    \ the translated version `V’` of each vertex `V` in the cube, we just need to\
    \ add the translation vector to it:\n\n![image](Images/f0116-05.jpg)\n\nAt this\
    \ point, we can take the cube, translate each vertex, and then apply the algorithm\
    \ in [Listing 10-1](#ch10.xhtml_ch10lis1) to get our first 3D cube ([Figure 10-2](#ch10.xhtml_ch10fig2)).\n\
    \n![image](Images/10fig02.jpg)\n\n*Figure 10-2: Our cube, translated in front\
    \ of the camera, rendered with wireframe triangles*\n\nYou can find a live implementation\
    \ of this algorithm at [https://gabrielgambetta.com/cgfs/scene-demo](https://gabrielgambetta.com/cgfs/scene-demo).\n\
    \n## Models and Instances\n\nWhat if we want to render two cubes? A naive approach\
    \ would be to create a new set of vertices and triangles describing a second cube.\
    \ This would work, but it would waste a lot of memory. What if we wanted to render\
    \ *one million* cubes?\n\nA better approach is to think in terms of `models` and\
    \ `instances`. A `model` is a set of vertices and triangles that describes a certain\
    \ object in a generic way (think “a cube has eight vertices and six sides”). An\
    \ `instance` of a `model`, on the other hand, describes a concrete occurrence\
    \ of that model within the scene (think “there’s a cube at (0, 0, 5)”).\n\nHow\
    \ do we apply this idea in practice? We can have a single description of each\
    \ unique object in the scene and then place multiple copies of it by specifying\
    \ their coordinates. Informally, it would be like saying, “This is what a cube\
    \ looks like, and there’s cubes here, here and there.”\n\nThis is a rough approximation\
    \ of how we’d describe a scene using this approach:\n\n```\nmodel {\n  name =\
    \ cube\n  vertices {\n    ...\n  }\n  triangles {\n    ...\n  }\n}\n\ninstance\
    \ {\n  model = cube\n  position = (0, 0, 5)\n}\n\ninstance {\n  model = cube\n\
    \  position = (1, 2, 3)\n}\n```\n"
  raw: 'Success! We’ve managed to go from the geometrical 3D representation of an
    object to its 2D representation as seen from our synthetic camera!


    Our approach is very artisanal, though. It has many limitations. What if we want
    to render *two* cubes? Would we have to duplicate most of the code? What if we
    want to render something other than a cube? What if we want to let the user load
    a 3D model from a file? We clearly need a more data-driven approach to representing
    3D geometry.


    ### Summary


    In this chapter, we’ve developed the math to go from a 3D point in the scene to
    a 2D point on the canvas. Because of the properties of the perspective projection,
    we can immediately extend this to projecting line segments and then to 3D objects.


    But we have left two important issues unresolved. First, [Listing 9-1](#ch09.xhtml_ch9lis1)
    mixes the perspective projection logic with the geometry of the cube; this approach
    clearly won’t scale. Second, because of the limitations of the perspective projection
    equation, it can’t handle objects that are behind the camera. We will address
    these issues in the next two chapters.


    ## **10


    DESCRIBING AND RENDERING A SCENE**


    ![image](Images/common.jpg)


    In the last few chapters, we’ve developed algorithms to draw 2D triangles on the
    canvas given their 2D coordinates, and we’ve explored the math required to transform
    the 3D coordinates of points in the scene to the 2D coordinates of points on the
    canvas.


    At the end of the previous chapter, we cobbled together a program that used both
    to render a 3D cube on the 2D canvas. In this chapter, we’ll formalize and extend
    that work with the goal of rendering a whole scene containing an arbitrary number
    of objects.


    ### Representing a Cube


    Let’s think again about how to represent and manipulate a cube, this time with
    the goal of finding a more general approach. The edges of our cube are 2 units
    long and are parallel to the coordinate axes, and it’s centered on the origin,
    as shown in [Figure 10-1](#ch10.xhtml_ch10fig1).


    ![image](Images/10fig01.jpg)


    *Figure 10-1: Our standard cube*


    These are the coordinates of its vertices:


    *A* = (1,1,1)


    *B* = (–1,1,1)


    *C* = (–1,–1,1)


    *D* = (1,–1,1)


    *E* = (1,1,–1)


    *F* = (–1,1,–1)


    *G* = (–1,–1,–1)


    *H* = (1,–1,–1)


    The sides of the cube are square, but the algorithms we have developed work with
    triangles. One of the reasons we chose triangles in the first place is that any
    other polygon, including squares, can be decomposed into triangles. So we’ll represent
    each square side of the cube using two triangles.


    However, we can’t take *any* three vertices of the cube and expect them to describe
    a triangle on its surface (for example, ADG is inside the cube). This means that
    the vertex coordinates, by themselves, don’t fully describe the cube: we also
    need to know which sets of three vertices describe the triangles that make up
    its sides.


    Here’s a possible list of triangles for our cube:


    A, B, C


    A, C, D


    E, A, D


    E, D, H


    F, E, H


    F, H, G


    B, F, G


    B, G, C


    E, F, B


    E, B, A


    C, G, H


    C, H, D


    This suggests a generic structure we can use to represent *any* object made of
    triangles: a Vertices list, holding the coordinates of each vertex; and a Triangles
    list, specifying which sets of three vertices describe triangles on the surface
    of the object.


    Each entry in the Triangles list may include additional information besides the
    vertices that make it up; for example, this would be the perfect place to specify
    the color of each triangle.


    Since the most natural way to store this information is in two lists, we’ll use
    list indices to refer to the vertices in the vertex list. So our cube would be
    represented like this:


    Vertices


    0 = ( 1,  1,  1)


    1 = (-1,  1,  1)


    2 = (-1, -1,  1)


    3 = ( 1, -1,  1)


    4 = ( 1,  1, -1)


    5 = (-1,  1, -1)


    6 = (-1, -1, -1)


    7 = ( 1, -1, -1)


    Triangles


     0 = 0, 1, 2, red


     1 = 0, 2, 3, red


     2 = 4, 0, 3, green


     3 = 4, 3, 7, green


     4 = 5, 4, 7, blue


     5 = 5, 7, 6, blue


     6 = 1, 5, 6, yellow


     7 = 1, 6, 2, yellow


     8 = 4, 5, 1, purple


     9 = 4, 1, 0, purple


    10 = 2, 6, 7, cyan


    11 = 2, 7, 3, cyan


    Rendering an object with this representation is quite simple: we first project
    every vertex, storing them in a temporary projected vertices list (since each
    vertex is used an average of four times, this avoids a lot of repeated work);
    then we go through the triangle list, rendering each individual triangle. A first
    approximation would look like [Listing 10-1](#ch10.xhtml_ch10lis1).


    RenderObject(vertices, triangles) {


        projected = []


        for V in vertices {


            projected.append(ProjectVertex(V))


        }


        for T in triangles {


            RenderTriangle(T, projected)


        }


    }


    RenderTriangle(triangle, projected) {


        DrawWireframeTriangle(projected[triangle.v[0]],


                              projected[triangle.v[1]],


                              projected[triangle.v[2]],


                              triangle.color)


    }


    *Listing 10-1: An algorithm to render any object made of triangles*


    We can go ahead and apply this directly to the cube as defined above, but the
    results won’t look good. This is because some of its vertices are behind the camera,
    which, as we discussed in the previous chapter, is a recipe for weird things.
    And if you look at the vertex coordinates and [Figure 10-1](#ch10.xhtml_ch10fig1),
    you’ll notice the coordinate origin, the position of our camera, is *inside* the
    cube.


    To work around this problem, we’ll just move the cube. To do this, we need to
    move each vertex of the cube in the same direction. Let’s call this direction
    ![image](Images/f0116-01.jpg), for “translation.” We’ll translate the cube 7 units
    forward to make sure it’s completely in front of the camera. We’ll also translate
    it 1.5 units to the left to make it look more interesting. Since “forward” is
    the direction of ![image](Images/f0116-02.jpg) and “left” is ![image](Images/f0116-03.jpg),
    the translation vector is simply


    ![image](Images/f0116-04.jpg)


    To compute the translated version *V′* of each vertex *V* in the cube, we just
    need to add the translation vector to it:


    ![image](Images/f0116-05.jpg)


    At this point, we can take the cube, translate each vertex, and then apply the
    algorithm in [Listing 10-1](#ch10.xhtml_ch10lis1) to get our first 3D cube ([Figure
    10-2](#ch10.xhtml_ch10fig2)).


    ![image](Images/10fig02.jpg)


    *Figure 10-2: Our cube, translated in front of the camera, rendered with wireframe
    triangles*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/scene-demo](https://gabrielgambetta.com/cgfs/scene-demo)*.


    ### Models and Instances


    What if we want to render two cubes? A naive approach would be to create a new
    set of vertices and triangles describing a second cube. This would work, but it
    would waste a lot of memory. What if we wanted to render *one million* cubes?


    A better approach is to think in terms of *models* and *instances*. A model is
    a set of vertices and triangles that describes a certain object in a generic way
    (think “a cube has eight vertices and six sides”). An instance of a model, on
    the other hand, describes a concrete occurrence of that model within the scene
    (think “there’s a cube at (0, 0, 5)”).


    How do we apply this idea in practice? We can have a single description of each
    unique object in the scene and then place multiple copies of it by specifying
    their coordinates. Informally, it would be like saying, “This is what a cube looks
    like, and there’s cubes here, here and there.”


    This is a rough approximation of how we’d describe a scene using this approach:


    model {


        name = cube


        vertices {


            ...


        }


        triangles {


            ...


        }


    }


    instance {


        model = cube


        position = (0, 0, 5)


    }


    instance {


        model = cube


        position = (1, 2, 3)


    }'
