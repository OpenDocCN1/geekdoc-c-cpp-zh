    viewport and the size of the canvas. The size of the canvas changes when, for
    example, the application goes from windowed to fullscreen. The size of the viewport
    would only change if the field of view of the camera changes; this doesn’t happen
    very often.


    *M*[*Camera*] may change every frame; it depends on the camera position and orientation,
    so if the camera is moving or turning, it needs to be recomputed. Once computed,
    though, it remains constant for every object drawn in the frame, so it would be
    computed at most once per frame.


    *M*[*Model*] will be different for each instance in the scene; however, it will
    remain constant over time for instances that don’t move (for example, trees and
    buildings), so it can be computed once and stored in the scene itself. For objects
    that do move (for example, cars in a racing game) it needs to be computed every
    time they move (which is likely to be every frame).


    A very high level of the scene rendering pseudocode would look like [Listing 10-5](#ch10.xhtml_ch10lis5).


    RenderModel(model, transform) {


        projected = []


        for V in model.vertices {


            projected.append(ProjectVertex(transform * V))


        }


        for T in model.triangles {


            RenderTriangle(T, projected)


        }


    }


    RenderScene() {


        M_camera = MakeCameraMatrix(camera.position, camera.orientation)


        for I in scene.instances {


            M = M_camera * I.transform


            RenderModel(I.model, M)


        }


    }


    *Listing 10-5: An algorithm to render a scene using transform matrices*


    We can now draw a scene containing several instances of different models, possibly
    moving around and rotating, and we can move the camera throughout the scene. [Figure
    10-10](#ch10.xhtml_ch10fig10) shows two instances of our cube model, each with
    a different transform (including translation and rotation), rendered from a translated
    and rotated camera.


    ![image](Images/10fig10.jpg)


    *Figure 10-10: A scene with two instances of the same cube model, having different
    instance transforms, and a transformed camera*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/transforms-demo](https://gabrielgambetta.com/cgfs/transforms-demo)*.


    ### Summary


    We covered a lot of ground in this chapter. We first explored how to represent
    models made out of triangles. Then we figured out how to apply the perspective
    projection equation we derived in the previous chapter to entire models, so we
    can go from an abstract 3D model to its representation on the screen.


    Next we developed a way to have multiple instances of the same model in the scene
    without having multiple copies of the model itself. Then we found out how to lift
    one of the limitations we had been working with so far: our camera no longer needs
    to be fixed at the origin of the coordinate system or pointing toward ![image](Images/f0132-01.jpg).


    Finally, we explored how to represent all the transforms we need to apply to a
    vertex as matrix multiplications in homogeneous coordinates, and this allowed
    us to reduce the computations required to render a scene by condensing many of
    the consecutive transforms into just three matrices: one for the perspective projection
    and viewport-to-canvas mapping, one for the instance transform, and one for the
    camera transform.


    This has given us a lot of flexibility in terms of what we can represent in a
    scene, and it also allows us to move the camera around the scene. But we still
    have two important limitations. First, moving the camera means we can end up with
    objects behind it, which causes all sorts of problems. Second, the rendering doesn’t
    look so great: it’s still a wireframe image.


    Note that for practical reasons we won’t be using the full projection matrix in
    the rest of this book. Instead, we’ll use the model and camera transforms separately
    and then convert their results back to Cartesian coordinates as follows:


    ![image](Images/f0132-02.jpg)


    This lets us do some more operations in 3D that can’t be expressed as matrix transforms
    before we project the points.


    In the next chapter, we’ll deal with objects that shouldn’t be visible, and then
    we’ll spend the rest of this book making the rendered objects look better.


    ## **11


    CLIPPING**


    ![image](Images/common.jpg)


    In the last few chapters, we developed equations and algorithms to transform a
    3D definition of a scene into 2D shapes we can draw on the canvas; we developed
    a scene structure that lets us define 3D models and place instances of those models
    in the scene; and we developed an algorithm that lets us render the scene from
    any point of view.


    However, doing this exposes one of the limitations we’ve been working with: the
    perspective projection equations only work as expected for points that are in
    front of the camera. Since we can now move and rotate the camera around the scene,
    this poses a problem.


    In this chapter, we’ll develop the techniques necessary to lift this limitation:
    we’ll explore how to identify points, triangles, and entire objects that are behind
    the camera and develop techniques to deal with them.


    ### An Overview of the Clipping Process


    Back in [Chapter 9](#ch09.xhtml_ch09), we arrived at the following equations:


    ![image](Images/f0134-01.jpg)


    The division by *P*[*z*] is problematic; it can cause a division by zero. Moreover,
    points behind the camera have negative *Z* values, which we currently can’t handle
    properly. Even points in front of the camera but very close to it will cause trouble
    in the form of severely distorted objects.


    To avoid these problematic cases, we’ll choose not to render anything behind the
    projection plane *Z* = *d*. This *clipping plane* lets us classify any point as
    being *inside* or *outside* of the *clipping volume*—that is, the subset of space
    that is actually visible from the camera. In this case, the clipping volume is
    “whatever is in front of *Z* = *d*.” We’ll only render the parts of the scene
    that are inside the clipping volume.


    ### The Clipping Volume


    Using a single clipping plane to make sure no objects behind the camera are rendered
    will produce correct results, but it’s not entirely efficient. Some objects may
    be in front of the camera but still not visible; for example, the projection of
    an object near the projection plane but far, far to the right will be projected
    outside of the viewport and therefore won’t be visible, as shown in [Figure 11-1](#ch11.xhtml_ch11fig1).


    ![image](Images/11fig01.jpg)


    *Figure 11-1: An object that is in front of the projection plane, but will be
    projected outside of the viewport*


    Any computational resources we use to project such an object, plus all the per-triangle
    and per-vertex computations done to render it, would be wasted. It would be more
    efficient to ignore these objects altogether.


    To do this, we can define additional planes to clip the scene to *exactly* what
    should be visible on the viewport; these planes are defined by the camera and
    each of the four sides of the viewport ([Figure 11-2](#ch11.xhtml_ch11fig2)).


    ![image](Images/11fig02.jpg)


    *Figure 11-2: The five planes that define our clipping volume*


    Each of the clipping planes splits space in two parts we call *half-spaces*. The
    “inside” half-space is everything that’s in front of the plane; the “outside”
    half-space is everything that’s behind it. The “inside” of the clipping volume
    we’re defining is the *intersection* of the “inside” half-spaces defined by each
    clipping plane. In this case, the clipping volume looks like an infinitely tall
    pyramid with the top chopped off.'
