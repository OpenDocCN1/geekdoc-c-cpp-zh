- fmt: "\nAs a geometric analogy, let’s represent the intensity of the light as the\
    \ “width” of the ray. Its energy spreads over a surface of size `A`. When ![Images](Images/narr.jpg)\
    \ and ![Images](Images/larr.jpg) have the same direction—when the ray is perpendicular\
    \ to the surface—then `I` = `A`, which means the energy reflected per unit of\
    \ area is the same as the incident energy per unit of area: ![Images](Images/e0034-01.jpg).\
    \ On the other hand, as the angle between ![Images](Images/larr.jpg) and ![Images](Images/narr.jpg)\
    \ approaches 90^∘, `A` approaches `∞`, so the energy per unit of area approaches\
    \ 0; ![Images](Images/e0034-02.jpg). But what happens in between?\n\nThe situation\
    \ is depicted in [Figure 3-4](#ch03.xhtml_ch3fig4). We know ![Images](Images/narr.jpg),\
    \ ![Images](Images/larr.jpg), and `P`; I have added the angles `α` and `β`, and\
    \ the points `Q`, `R`, and `S` to make writing about the diagram easier.\n\n![image](Images/03fig04.jpg)\n\
    \n*Figure 3-4: The vectors and angles involved in the diffuse reflection calculations*\n\
    \nSince a ray of light technically has no width, we can assume that everything\
    \ happens in a flat, infinitesimally small patch of the surface. Even if it’s\
    \ the surface of a sphere, the area we’re considering is so infinitesimally small\
    \ that it’s almost flat in comparison with the size of the sphere, just like Earth\
    \ looks flat at small scales.\n\nThe ray of light, with a width of `I`, hits the\
    \ surface at `P`, at an angle `β`. The normal at `P` is ![Images](Images/narr.jpg),\
    \ and the energy carried by the ray spreads over `A`. We need to compute ![Images](Images/e0034-03.jpg).\n\
    \nConsider `RS`, the “width” of the ray. By definition, it’s perpendicular to\
    \ ![Images](Images/larr.jpg), which is also the direction of `PQ`. Therefore,\
    \ `PQ` and `QR` form a right angle, making `PQR` a right triangle.\n\nOne of the\
    \ angles of `PQR` is 90^∘, and another is `β`. The remaining angle is therefore\
    \ 90^∘ – `β`. But note that ![Images](Images/narr.jpg) and `PR` also form a right\
    \ angle, which means `α` + `β` must also be 90^∘. Therefore, ![Images](Images/e0035-01.jpg).\n\
    \nLet’s focus on the triangle `PQR` ([Figure 3-5](#ch03.xhtml_ch3fig5)). Its angles\
    \ are `α`, `β`, and 90^∘. The side `QR` measures ![Images](Images/iby2.jpg), and\
    \ the side `PR` measures ![Images](Images/aby2.jpg).\n\n![image](Images/03fig05.jpg)\n\
    \n*Figure 3-5: The `PQR` triangle in a trigonometry context*\n\nAnd now, trigonometry\
    \ to the rescue! By definition, ![Images](Images/e0035-02.jpg); substituting `QR`\
    \ with ![Images](Images/iby2.jpg) and `PR` with ![Images](Images/aby2.jpg), we\
    \ get\n\n![image](Images/e0035-03.jpg)\n\nwhich becomes\n\n![image](Images/e0035-04.jpg)\n\
    \nWe’re almost there. `α` is the angle between ![Images](Images/narr.jpg) and\
    \ ![Images](Images/larr.jpg). We can use the properties of the dot product (feel\
    \ free to consult the Linear Algebra appendix) to express `cos(α)` as\n\n![image](Images/e0035-05.jpg)\n\
    \nAnd finally\n\n![image](Images/e0035-06.jpg)\n\nWe have arrived at a simple\
    \ equation that gives us the fraction of light that is reflected as a function\
    \ of the angle between the surface normal and the direction of the light.\n\n\
    Note that the value of `cos(α)` becomes negative for angles over 90^∘. If we blindly\
    \ use this value, we can end up with a light source that makes a surface darker!\
    \ This doesn’t make any physical sense; an angle over 90^∘ just means the light\
    \ is actually illuminating the back of the surface, and therefore it doesn’t contribute\
    \ any light to the point we’re illuminating. So if `cos(α)` becomes negative,\
    \ we need to treat it as if it was 0.\n\n### The Diffuse Reflection Equation\n\
    \nWe can now formulate an equation to compute the full amount of light received\
    \ by a point `P` with normal ![Images](Images/narr.jpg) in a scene with an ambient\
    \ light of intensity `I[A]` and `n` point or directional lights with intensity\
    \ `I[n]` and light vectors ![Images](Images/lnarr.jpg) either known (for directional\
    \ lights) or computed for `P` (for point lights):\n\n![image](Images/e0036-01.jpg)\n\
    \nIt’s worth repeating that the terms where ![Images](Images/e0036-02.jpg) shouldn’t\
    \ be added to the point’s illumination.\n\n### Sphere Normals\n\nThere’s only\
    \ a small detail missing: where do the normals come from? The answer to this general\
    \ question is far more complex than it might seem, as we’ll see in the second\
    \ part of this book. Fortunately, at this point we’re only dealing with spheres,\
    \ and there’s a very simple answer for them: the normal vector of any point of\
    \ a sphere lies on a line that goes through the center of the sphere. As you can\
    \ see in [Figure 3-6](#ch03.xhtml_ch3fig6), if the sphere center is `C`, the direction\
    \ of the normal at `P` is `P – C`.\n\n![image](Images/03fig06.jpg)\n\n*Figure\
    \ 3-6: The normal of a sphere at P has the same direction as CP.*\n\nWhy “the\
    \ direction of the normal” and not “the normal”? A normal vector needs to be perpendicular\
    \ to the surface, but it also needs to have length 1. To normalize this vector\
    \ and turn it into a true normal, we need to divide it by its own length, thus\
    \ guaranteeing the result has length 1:\n\n![image](Images/e0037-01.jpg)\n\n###\
    \ Rendering with Diffuse Reflection\n\nLet’s translate all of this to pseudocode.\
    \ First, let’s add a couple of lights to the scene:\n\n```\nlight {\n  type =\
    \ ambient\n  intensity = 0.2\n}\nlight {\n  type = point\n  intensity = 0.6\n\
    \  position = (2, 1, 0)\n}\nlight {\n  type = directional\n  intensity = 0.2\n\
    \  direction = (1, 4, 4)\n}\n```\n\nNote that the intensities conveniently add\
    \ up to 1; because of the way the lighting equation works, this ensures that no\
    \ point can have a light intensity greater than this. This means we won’t have\
    \ any “overexposed” spots.\n\nThe lighting equation is fairly straightforward\
    \ to translate to pseudocode ([Listing 3-1](#ch03.xhtml_ch3lis)).\n\n```\nComputeLighting(P,\
    \ N) {\n  i = 0.0\n  for light in scene.Lights {\n    if (light.type == ambient)\
    \ {\n      i += light.intensity\n    } else {\n      if (light.type == point)\
    \ {\n        L = light.position - P\n      } else {\n        L = light.direction\n\
    \      }\n      n_dot_l = dot(N, L)\n      if n_dot_l > 0 {\n        i += light.intensity\
    \ * n_dot_l / (length(N) * length(L))\n      }\n    }\n  }\n  return i\n}\n```\n\
    \n*Listing 3-1: A function to compute lighting with diffuse reflection*\n\nIn\
    \ [Listing 3-1](#ch03.xhtml_ch3lis1), we treat the three types of light in slightly\
    \ different ways. Ambient lights are the simplest and are handled directly ❶.\
    \ Point and directional lights share most of the code, in particular the intensity\
    \ calculation ❺, but the direction vectors are computed in different ways (❷ and\
    \ ❸), depending on their type. The condition in ❹ makes we don’t add negative\
    \ values, which represent lights illuminating the back side of the surface, as\
    \ we discussed before.\n\nThe only thing left to do is to use `ComputeLighting`\
    \ in `TraceRay`. We replace the line that returns the color of the sphere:\n\n\
    ```\nreturn closest_sphere.color\n```\n\nwith this snippet:\n\n```\nP = O + closest_t\
    \ * D  // Compute intersection\nN = P - closest_sphere.center  // Compute sphere\
    \ normal at intersection\nN = N / length(N)\nreturn closest_sphere.color * ComputeLighting(P,\
    \ N)\n```\n\nJust for fun, let’s add a big yellow sphere:\n\n```\nsphere {\n \
    \ color = (255, 255, 0)  # Yellow\n  center = (0, -5001, 0)\n  radius = 5000\n\
    }\n```\n\nWe run the renderer and, lo and behold, the spheres now start to look\
    \ like spheres ([Figure 3-7](#ch03.xhtml_ch3fig7))!\n\n![image](Images/03fig07.jpg)\n\
    \n*Figure 3-7: Diffuse reflection adds a sense of depth and volume to the scene.*\n\
    \nYou can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/diffuse-demo](https://gabrielgambetta.com/cgfs/diffuse-demo)*.\n"
  raw: 'As a geometric analogy, let’s represent the intensity of the light as the
    “width” of the ray. Its energy spreads over a surface of size *A*. When ![Images](Images/narr.jpg)
    and ![Images](Images/larr.jpg) have the same direction—when the ray is perpendicular
    to the surface—then *I* = *A*, which means the energy reflected per unit of area
    is the same as the incident energy per unit of area: ![Images](Images/e0034-01.jpg).
    On the other hand, as the angle between ![Images](Images/larr.jpg) and ![Images](Images/narr.jpg)
    approaches 90^∘, *A* approaches *∞*, so the energy per unit of area approaches
    0; ![Images](Images/e0034-02.jpg). But what happens in between?


    The situation is depicted in [Figure 3-4](#ch03.xhtml_ch3fig4). We know ![Images](Images/narr.jpg),
    ![Images](Images/larr.jpg), and *P* ; I have added the angles *α* and *β*, and
    the points *Q*, *R*, and *S* to make writing about the diagram easier.


    ![image](Images/03fig04.jpg)


    *Figure 3-4: The vectors and angles involved in the diffuse reflection calculations*


    Since a ray of light technically has no width, we can assume that everything happens
    in a flat, infinitesimally small patch of the surface. Even if it’s the surface
    of a sphere, the area we’re considering is so infinitesimally small that it’s
    almost flat in comparison with the size of the sphere, just like Earth looks flat
    at small scales.


    The ray of light, with a width of *I*, hits the surface at *P*, at an angle *β*.
    The normal at *P* is ![Images](Images/narr.jpg), and the energy carried by the
    ray spreads over *A*. We need to compute ![Images](Images/e0034-03.jpg).


    Consider *RS*, the “width” of the ray. By definition, it’s perpendicular to ![Images](Images/larr.jpg),
    which is also the direction of *PQ*. Therefore, *PQ* and *QR* form a right angle,
    making *PQR* a right triangle.


    One of the angles of *PQR* is 90^∘, and another is *β*. The remaining angle is
    therefore 90^∘ *–* *β*. But note that ![Images](Images/narr.jpg) and *PR* also
    form a right angle, which means *α* + *β* must also be 90^∘. Therefore, ![Images](Images/e0035-01.jpg).


    Let’s focus on the triangle *PQR* ([Figure 3-5](#ch03.xhtml_ch3fig5)). Its angles
    are *α*, *β*, and 90^∘. The side *QR* measures ![Images](Images/iby2.jpg), and
    the side *PR* measures ![Images](Images/aby2.jpg).


    ![image](Images/03fig05.jpg)


    *Figure 3-5: The *PQR* triangle in a trigonometry context*


    And now, trigonometry to the rescue! By definition, ![Images](Images/e0035-02.jpg);
    substituting *QR* with ![Images](Images/iby2.jpg) and *PR* with ![Images](Images/aby2.jpg),
    we get


    ![image](Images/e0035-03.jpg)


    which becomes


    ![image](Images/e0035-04.jpg)


    We’re almost there. *α* is the angle between ![Images](Images/narr.jpg) and ![Images](Images/larr.jpg).
    We can use the properties of the dot product (feel free to consult the Linear
    Algebra appendix) to express cos(*α*) as


    ![image](Images/e0035-05.jpg)


    And finally


    ![image](Images/e0035-06.jpg)


    We have arrived at a simple equation that gives us the fraction of light that
    is reflected as a function of the angle between the surface normal and the direction
    of the light.


    Note that the value of cos(*α*) becomes negative for angles over 90^∘. If we blindly
    use this value, we can end up with a light source that makes a surface *darker*!
    This doesn’t make any physical sense; an angle over 90^∘ just means the light
    is actually illuminating the *back* of the surface, and therefore it doesn’t contribute
    any light to the point we’re illuminating. So if cos(*α*) becomes negative, we
    need to treat it as if it was 0.


    #### The Diffuse Reflection Equation


    We can now formulate an equation to compute the full amount of light received
    by a point *P* with normal ![Images](Images/narr.jpg) in a scene with an ambient
    light of intensity *I*[*A*] and *n* point or directional lights with intensity
    *I*[*n*] and light vectors ![Images](Images/lnarr.jpg) either known (for directional
    lights) or computed for *P* (for point lights):


    ![image](Images/e0036-01.jpg)


    It’s worth repeating that the terms where ![Images](Images/e0036-02.jpg) shouldn’t
    be added to the point’s illumination.


    #### Sphere Normals


    There’s only a small detail missing: where do the normals come from? The answer
    to this general question is far more complex than it might seem, as we’ll see
    in the second part of this book. Fortunately, at this point we’re only dealing
    with spheres, and there’s a very simple answer for them: the normal vector of
    any point of a sphere lies on a line that goes through the center of the sphere.
    As you can see in [Figure 3-6](#ch03.xhtml_ch3fig6), if the sphere center is *C*,
    the direction of the normal at point *P* is *P* *–* *C*.


    ![image](Images/03fig06.jpg)


    *Figure 3-6: The normal of a sphere at* P *has the same direction as* CP.


    Why “the direction of the normal” and not “the normal”? A normal vector needs
    to be perpendicular to the surface, but it also needs to have length 1\. To *normalize*
    this vector and turn it into a true normal, we need to divide it by its own length,
    thus guaranteeing the result has length 1:


    ![image](Images/e0037-01.jpg)


    #### Rendering with Diffuse Reflection


    Let’s translate all of this to pseudocode. First, let’s add a couple of lights
    to the scene:


    light {


        type = ambient


        intensity = 0.2


    }


    light {


        type = point


        intensity = 0.6


        position = (2, 1, 0)


    }


    light {


        type = directional


        intensity = 0.2


        direction = (1, 4, 4)


    }


    Note that the intensities conveniently add up to 1*.*0; because of the way the
    lighting equation works, this ensures that no point can have a light intensity
    greater than this value. This means we won’t have any “overexposed” spots.


    The lighting equation is fairly straightforward to translate to pseudocode ([Listing
    3-1](#ch03.xhtml_ch3lis1)).


    ComputeLighting(P, N) {


        i = 0.0


        for light in scene.Lights {


            if light.type == ambient {


             ❶ i += light.intensity


            } else {


                if light.type == point {


                 ❷ L = light.position - P


                } else {


                 ❸ L = light.direction


                }


                n_dot_l = dot(N, L)


              ❹ if n_dot_l > 0 {


                  ❺ i += light.intensity * n_dot_l/(length(N) * length(L))


                }


            }


        }


        return i


    }


    *Listing 3-1: A function to compute lighting with diffuse reflection*


    In [Listing 3-1](#ch03.xhtml_ch3lis1), we treat the three types of light in slightly
    different ways. Ambient lights are the simplest and are handled directly ❶. Point
    and directional lights share most of the code, in particular the intensity calculation
    ❺, but the direction vectors are computed in different ways (❷ and ❸), depending
    on their type. The condition in ❹ makes sure we don’t add negative values, which
    represent lights illuminating the back side of the surface, as we discussed before.


    The only thing left to do is to use ComputeLighting in TraceRay. We replace the
    line that returns the color of the sphere:


        return closest_sphere.color


    with this snippet:


        P = O + closest_t * D  // Compute intersection


        N = P - closest_sphere.center  // Compute sphere normal at intersection


        N = N / length(N)


        return closest_sphere.color * ComputeLighting(P, N)


    Just for fun, let’s add a big yellow sphere:


    sphere {


        color = (255, 255, 0)  # Yellow


        center = (0, -5001, 0)


        radius = 5000


    }


    We run the renderer and, lo and behold, the spheres now start to look like spheres
    ([Figure 3-7](#ch03.xhtml_ch3fig7))!


    ![image](Images/03fig07.jpg)


    *Figure 3-7: Diffuse reflection adds a sense of depth and volume to the scene.*


    You can find a live implementation of this algorithm at *[https://gabrielgambetta.com/cgfs/diffuse-demo](https://gabrielgambetta.com/cgfs/diffuse-demo)*.'
