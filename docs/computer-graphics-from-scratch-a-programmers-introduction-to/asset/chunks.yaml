    Instead, we’ll consider the rays of light “in reverse”; we’ll start with a ray
    originating from the camera, going through a point in the viewport, and tracing
    its path until it hits some object in the scene. This object is what the camera
    “sees” through that point of the viewport. So, as a first approximation, we’ll
    just take the color of that object as “the color of the light coming through that
    point,” as shown in [Figure 2-5](#ch02.xhtml_ch2fig5).


    ![image](Images/02fig05.jpg)


    *Figure 2-5: A tiny square in the viewport, representing a single pixel in the
    canvas, painted with the color of the object the camera sees through it*


    Now we just need some equations.


    ### The Ray Equation


    The most convenient way to represent a ray for our purposes is with a parametric
    equation. We know the ray passes through `O`, and we know its direction (from
    `O` to `V`), so we can express any point `P` in the ray as


    `P = O + t(V – O)`


    where `t` is any real number. By plugging every value of `t` from `–∞` to `+∞`
    into this equation, we get every point `P` along the ray.


    Let’s call `(V – O)`, the direction of the ray, ![Images](Images/darr.jpg). The
    equation becomes


    ![Images](Images/e0019-01.jpg)


    An intuitive way to understand this equation is that we start the ray at the origin
    (`O`) and “advance” along the direction of the ray (![Images](Images/darr.jpg))
    by some amount (`t`); it’s easy to see that this includes all the points along
    the ray. You can read more details about these vector operations in the Linear
    Algebra appendix. [Figure 2-6](#ch02.xhtml_ch2fig6) shows our equation in action.


    ![image](Images/02fig06.jpg)


    *Figure 2-6: Some points of the ray ![Images](Images/e0019-02.jpg) for different
    values of `t`.*


    [Figure 2-6](#ch02.xhtml_ch2fig6) shows the points along the ray that corresponds
    to `t = 0.5` and `t = 1.0`. Every value of `t` yields a different point along
    the ray.


    ### The Sphere Equation


    Now we need to have some sort of object in the scene, so that our rays can hit
    *something*. We could choose any arbitrary geometric primitive as the building
    block of our scenes; for raytracing, we’ll use spheres because they’re easy to
    manipulate with equations.


    What is a sphere? A sphere is the set of points that lie at a fixed distance from
    a fixed point. That distance is called the `radius` of the sphere, and the point
    is called the `center` of the sphere. [Figure 2-7](#ch02.xhtml_ch2fig7) shows
    a sphere, defined by its center `C` and its radius `r`.


    ![image](Images/02fig07.jpg)


    *Figure 2-7: A sphere, defined by its center and its radius*


    According to our definition above, if `C` is the center and `r` is the radius
    of a sphere, the points `P` on the surface of that sphere must satisfy the following
    equation:


    `distance(P, C) = r`


    Let’s play a bit with this equation. If you find any of this math unfamiliar,
    read through the Linear Algebra appendix.


    The distance between `P` and `C` is the length of the vector from `P` to `C`:


    `|P – C| = r`


    The length of a vector (denoted ![Images](Images/e0020-01.jpg)) is the square
    root of its dot product with itself (denoted ![Images](Images/e0020-02.jpg)):


    ![Images](Images/e0020-03.jpg)


    To get rid of the square root, we can square both sides:


    `⟨P – C, P – C⟩ = r²`


    All these formulations of the sphere equation are equivalent, but this last one
    is the most convenient to manipulate in the following steps.


    ### Ray Meets Sphere


    We now have two equations: one describing the points on the sphere, and one describing
    the points on the ray:


    `⟨P – C, P – C⟩ = r²`


    ![Images](Images/e0020-04.jpg)


    Do the ray and the sphere intersect? If so, where?


    Suppose the ray and the sphere do intersect at a point `P`. This point is both
    along the ray and on the surface of the sphere, so it must satisfy both equations
    at the same time. Note that the only variable in these equations is the parameter
    `t`, since `O`, ![Images](Images/darr.jpg), `C`, and `r` are given and `P` is
    the point we’re trying to find.


    Since `P` represents the same point in both equations, we can substitute `P` in
    the first one with the expression for `P` in the second. This gives us


    ![image](Images/e0021-01.jpg)


    If we can find values of `t` that satisfy this equation, we can put them in the
    ray equation to find the points where the ray intersects the sphere.


    In its current form, the equation is somewhat unwieldy. Let’s do some algebraic
    manipulation to see what we can get out of it.


    First, let ![Images](Images/e0021-02.jpg). Then we can write the equation as


    ![image](Images/e0021-03.jpg)


    Then we expand the dot product into its components, using its distributive properties
    (again, feel free to consult the Linear Algebra appendix):


    ![image](Images/e0021-04.jpg)


    Rearranging the terms a bit, we get


    ![image](Images/e0021-05.jpg)


    Moving the parameter `t` out of the dot products and moving `r²` to the other
    side of the equation gives us


    ![image](Images/e0021-06.jpg)


    Remember that the dot product of two vectors is a real number, so every term between
    angle brackets is a real number. If we give them names, we’ll get something much
    more familiar:


    ![image](Images/e0021-07.jpg)


    This is nothing more and less than a good old quadratic:


    ![image](Images/e0021.jpg)


    Fortunately, this makes geometrical sense. Depending on the discriminant `b² –
    4ac`, the quadratic equation can have no solutions, one solution, or two solutions
    ([Figure 2-8](#ch02.xhtml_ch2fig8)).


    ![image](Images/02fig08.jpg)


    *Figure 2-8: The geometrical interpretation of the solutions.*


    ### Rendering our First Spheres


    To recap, for each pixel on the canvas, we can compute the corresponding point
    on the viewport. Given the position of the camera, we can express the equation
    of a ray that starts at the camera and goes through that point of the viewport.
    Given a sphere, we can compute where the ray intersects that sphere.


    So all we need to do is compute the intersections of the ray and each sphere,
    keep the intersection closest to the camera, and paint the pixel on the canvas
    with the appropriate color. We’re almost ready to render our first spheres!


    The parameter `t` deserves some extra attention, though. Let’s go back to the
    ray equation:


    `P = O + t(V – O)`


    Since the origin and direction of the ray are fixed, varying `t` across all the
    real numbers will yield every point `P` in this ray. Note that for `t = 0` we
    get `P = O`, and for `t = 1` we get `P = V`. Negative values of `t` yield points
    in the *opposite* direction—that is, *behind* the camera. So, we can divide the
    parameter space into three parts, as in [Table 2-1](#ch02.xhtml_ch2tab1). [Figure
    2-9](#ch02.xhtml_ch2fig9) shows a diagram of the parameter space.


    **Table 2-1:** Subdivisions of the Parameter Space


    | `t` < 0 | Behind the camera |


    | 0 < `t` < 1 | Between the camera and the projection plane/viewport |


    | `t` > 1 | In front of the projection plane/viewport |


    ![image](Images/02fig09.jpg)


    *Figure 2-9: A few points in parameter space*

