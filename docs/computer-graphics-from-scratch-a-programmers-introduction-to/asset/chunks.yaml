    \ N, -D, closest_sphere.specular)\n}\n```\nListing 3-3: 带有高光反射的 TraceRay\n\n颜色计算\
    \ ❶ 比看起来的要复杂一些。记住，颜色必须分通道相乘，并将结果限制在通道的范围内（在我们的案例中为 [0–255]）。尽管在示例场景中光照强度总和为 1.0，但现在我们加上了高光反射的贡献，值可能会超出该范围。\n\
