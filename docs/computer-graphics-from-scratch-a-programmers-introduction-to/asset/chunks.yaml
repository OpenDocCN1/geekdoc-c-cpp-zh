    平直着色（Flat shading）每个三角形只进行一次照明计算。高罗德着色（Gouraud shading）每个三角形需要进行三次照明计算，并在整个三角形上对单一属性（即照明）进行插值。提升质量的下一步是我们需要计算三角形上每个像素的照明情况。


    从理论角度来看，这听起来并不特别复杂；毕竟我们已经在计算一个或三个点的光照了，而且我们之前为光线追踪器计算的是逐像素的光照。这里的棘手之处在于要弄清楚照明方程的输入是从哪里来的。


    回想一下包含环境光、漫反射和高光分的完整照明方程为：


    ![image](img/f0170-01.jpg)


    首先，我们需要![Images](img/f0170-02.jpg)。对于方向性光，![Images](img/f0170-02.jpg) 是给定的。对于点光源，![Images](img/f0170-02.jpg)
    定义为从场景中的点 `P` 指向光源位置 `Q` 的向量。然而，我们并没有三角形上每个像素的 `Q`，只有顶点处的 `Q`。


    我们拥有的是 `P` 的投影；也就是我们要在画布上绘制的 `x′` 和 `y′`！我们知道


    ![image](img/f0170-03.jpg)


    我们恰恰作为深度缓冲算法的一部分，拥有一个插值的但在几何上是正确的![Images](img/f0170-07.jpg) 的值，因此：


    ![image](img/f0170-04.jpg)


    我们可以从这些值中恢复出 `P`：


    ![image](img/f0170-05.jpg)


    我们还需要![Images](img/f0170-06.jpg)。这是从相机（我们是知道的）到 `P`（我们刚刚计算出的）的向量，因此![Images](img/f0170-06.jpg)简单来说就是
    `P` —— `C`。


    接下来，我们需要![Images](img/f0034-01.jpg)。我们只知道三角形顶点处的法线。当你手里只有锤子时，每个问题看起来都像钉子；我们的锤子就是——你可能猜到了——属性值的线性插值。所以，让我们取每个顶点处
    `N[*x*]`、`N[*y*]` 和 `N[*z*]` 的值，并将它们每一个都视为我们可以进行线性插值的属性。然后，在每个像素处，我们将插值分量重新组装一个向量，对其进行归一化，并将其作为该像素的法线。


    这种技术被称为冯着色（Phong shading），以冯宗彭（Bui Tuong Phong）命名，他在 1973 年发明了这种方法。图 13-9 显示了结果。


    ![image](img/13fig09.jpg)


    *图 13-9：冯着色。球体表面看起来很平滑，高光亮点清晰可见。*


    你可以在 `[`gabrielgambetta.com/cgfs/shading-demo`](https://gabrielgambetta.com/cgfs/shading-demo)`
    找到该算法的实时实现。


    球体现在看起来好多了。它的表面显示了正确的曲率，高光亮点看起来定义良好。然而，轮廓仍然暴露了我们渲染的是由三角形组成的近似值的事实。这并不是着色算法的缺陷，因为它只决定三角形表面每个像素的颜色，而不控制三角形本身的形状。这个球体近似使用了
    420 个三角形；我们可以通过更多的三角形来获得更平滑的轮廓，代价是性能下降。


    冯着色还解决了光源靠近面的问题，现在得到了预期的结果（图 13-10）。


    ![image](img/13fig10.jpg)


    *图 13-10：光源越靠近表面，高光亮点看起来越亮、越清晰。*


    到此时，我们已经匹配了第一部分中开发的光线追踪器的能力，除了阴影和反射。使用完全相同的场景定义，图 13-11 显示了我们正在开发的光栅化器的输出。


    ![image](img/13fig11.jpg)


    *图 13-11：光栅化器渲染的参考场景*


    作为参考，图 13-12 显示了相同场景的光线追踪版本。


    ![image](img/13fig12.jpg)


    *图 13-12：光线追踪器渲染的参考场景*


    尽管使用了完全不同的技术，这两个版本看起来几乎完全一样。这是预之中的，因为场景定义是相同的。唯一的视觉区别出现在球体的轮廓上：光线追踪器将其渲染为数学上完美的物体，而我们的光栅化器使用的是由三角形组成的近似值。


    另一个区别是两个渲染器的性能。这很大取决于硬件和实现，但通常来说，光栅化器每秒可以生成 60 次或更多复杂场景的全屏图像，这使得它们适用于游戏等交互式应用程序，而光线追踪器可能需要几秒钟来渲染。


    ### 总结


    在本章中，我们为光栅化器添加了照明。我们使用的照明模型与第 3 章相同，因为我们使用不同的技术来平衡性能和质量。最快但效果最差的着色算法是平直着色：我们计算三角形内一个点的照明并将其应用于每个像素。这导致物体看起来有很多棱面，特别是对于球体等物体。质量上上一个台阶是高罗德着色：我们计算三角形三个顶点的照明，并在整个三角形上进行插值。这使得物体看起来更平滑。然而，这种技术无法捕捉细微的光效应，例如高光亮点。最后，我们学习了冯着色。和光线追踪器一样，它计算每个像素的照明，产生了最好的结果但性能最差。冯着色的关键在于知道如何计算照明方程所需的值；再次是线性插值——在这里是法向量。在下一章中，我们将为三角形表面添加更多细节，使用一种我们尚未为光线追踪器学习过的技术：纹理贴图。

