    \ `t` 赋一个上限值 `+∞`（对于无法直接表示“无穷”的语言，用一个非常非常大的数字就能解决问题）。\n\n我们现在可以用一些伪代码对目前为止所做的一切形式化处理。作为一般规则，我们假设代码可以访问它所需的任何数据，因此我们不会费心显式地传递\
