    当表面的某一点由于另一个物体遮挡而处于阴影中时，紧邻它的点很有可能也处于同一个对象的阴影中（这被称为 `shadow_coherence`）。你可以在图 5-2
    中看到示例。


    ![image](img/05fig02.jpg)


    *图 5-2：距离较的点可能处于同一个对象的阴影中。*


    在点和光源之间寻找物体以确定该点是否处于阴影中，我们通常会检查与每个其他对象的交点。然而，如果我们知道紧邻的点处于某个特定对象的阴影中，我们可以先检查与该对象的交点。如果我们找到了交点，任务就完成了，不需要检查其他所有物体！如果我们没有找到与该对象的交点，只需回退到检查所有物体。


    同理，在寻找射线与物体的交点以确定点是否处于阴影中时，你并不真的需要找到`closest`交点；只需知道存在`at least one`交点就足够了，因为这足以阻止光线到达该点！因此，你不需要找到最近的交点，只需找到`any`交点即可。你可以写一个专门的
    `ClosestIntersection` 版本，在它发现*任意*交点时就返回结果。


    ### 空间结构（Spatial Structures）


    计算射线与场景中每个物体的交点是非常浪费的。许多数据结构可以让你一次性丢弃一组物体，而无需逐个计算。


    假设你有几个彼此靠近的球。你可以计算包含这些球的最小球的中心和半径。如果射线没有交叉这个`bounding sphere`，就可以确定它没有与其中的任何一个球相交，这只需要一次交点测试。当然，如果相交了，你仍然需要检查它是否与其中的球交叉。你可以进一步使用多层边界球（即球的组），形成一个层次结构，只有当射线有可能与其中的球相交时，才遍历到底部。虽然这一系列技术的具体细节不在本书的范围内，但你可以在`bounding
    volume hierarchy`下找到更多信息。


    ### 采样（Subsampling）


    有一种让你的光线追踪器快`N`倍的方法：减少`N`倍的像素！


    对于画布上的每个像素，我们通过视口发射一条射线来`sample`来自该方向的光。如果我们发射的射线比像素少，我们就是在`subsampling`场景。但我们如何这样做并仍然正确渲染场景呢？


    假设我们为像素发射射线，并且它们恰好命中同一个物体。你可以合理地跳过对场景中所有物体的初始搜索，直接计算该点的颜色。


    如果你跳过水平和垂直方向上的每个像素，你可以减少高达 75% 的交点计算——这是 4 倍的加速！当然，你可能会漏掉非常薄的物体；这是一种“不纯”的优化，因为它与之前讨论的方法相比，它得到的图像虽然相似但不保证完全相同。在某种程度上，这是通过“取角”来实现的。技巧是在保持满意结果的同时知道哪些角；在计算机图形的许多领域，重要的是结果的主观质量。


    ### 支持其他基几何（Supporting Other Primitives）


    在之前的章节中，我们使用球作为基几何，因为它们在数学上很容易处理；但一旦你有了可以渲染球的基础光线追踪器，添加其他基几何的支持不需要多少额外工作。


    注意 `TraceRay` 需要对射线和任何给定物体计算两个值：它们之间最近交点的 `t` 值以及该交点的法线。光线追踪器中的其他部分都是与物体无关！


    三角形是一个很好的支持基几何。三角形是最简单的多边形，因此可以用三角形构建任何其他多边形。它们在数学上很容易处理，因此是表示复杂表面的良好方法。


    要在光线追踪器中添加三角形支持，只需要修改 `TraceRay`。首先，计算射线（由起点和方向确定）与包含三角形的平面（由法线和到原点的距离确定）之间的交点。由于平面是无限大的，射线几乎总是与给定平面交叉（除非它们完全平行）。因此，第二步是确定射线与平面的交点是否在三角形内部。有很多方法可以做到这一点，包括使用重心坐标或使用叉积检查点相等。一旦你确定点在三角形内部，交点的法线就是平面的法线。让
    `TraceRay` 返回相应的值就不需要进一步更改！


    ### 构造实体几何（Constructive Solid Geometry）


    假设我们要渲染比球更复杂的物体，或者难以用三角形精确建模的弯曲物体。两个很好的例子是透镜（如放大镜中的）和死星（那不是一个月……）。


    我们可以很容易用自然语言描述这些物体。放大镜看起来像两个球切片胶在一起；死星看起来像一个球被挖掉了一个小球。


    我们可以更正式地将其表示为对其他物体应用集合运算（如并集、交集或差集）的结果。继续上面的例子，透镜可以被描述为两个球的交集，而死星可以被描述为一个大球减去一个小球（见图
    5-3）。


    ![image](img/05fig03.jpg)


    *图 5-3：构造实体几何的应用。* A ∩ B *给了我们一个透镜。* C – D *给了我们一个死星。*


    你可能认为计算实体的布尔运算是一个非常棘手的几何问题。你是完全正确的！幸运的是，`constructive solid geometry` 让我们能够渲染物体之间集合运算的结果，而完全不需要显式地计算这些结果！


    我们如何在我们的光线追踪器中做到这一点？对于每个物体，你可以计算射线进入和离开物体的点；例如在球的情况下，射线在 `min(t[1], t[2])` 处进入，在
    `max(t[1], t[2])` 处离开。假设你想计算两个球的交集；当射线在两个球内部时，它就在交集内部；当它在任何一个球外部时，它就在交集外部。在法运算的情况下，当射线在第一个物体内部但在第二个物体外部时，它就在内部。对于两个物体的并集，当射线在任意一个物体内部时，它就在内部。

