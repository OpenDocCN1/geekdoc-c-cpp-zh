  trans: "\n\n首先，我们需要一张图像来绘制在三角形上；在这种背景下，我们将这种图像称为 `texture`（纹理）。图 14-1 显示了一个木箱纹理。\n\
    \n![image](img/14fig01.jpg)\n\n*图 14-1：木箱纹理（来自 Filter Forge——采用 Attribution 2.0\
    \ Generic (CC BY 2.0) 许可证）*\n\n我们需要指定如何将此纹理应用到模型上。我们可以按每个三角形来定义这种映射，通过指定纹理的哪些点应该位于三角形的每个顶点（图\
    \ 14-2）。\n\n![image](img/14fig02.jpg)\n\n*图 14-2：我们将纹理中的点与三角形的每个顶点关联。*\n\n为了定义这种映射，我们需要一个坐标系来引用纹理中的点。记住，纹理仅仅是图像，表示为像素的矩形数组。我们可以使用\
    \ `x` 和 `y` 坐标并讨论纹理中的像素，但我们已经将这些名称用于画布了。因此，我们使用 `u` 和 `v` 作为纹理坐标，并将纹理的像素称为 `texels`（`tex`ture\
    \ `el`ements 的缩写）。\n\n我们将此（`u`, `v`）坐标系的原点固定在纹理的左上角。我们还会声明 `u` 和 `v` 是范围 [0,1]\
    \ 内的实数，无论纹理的实际 texel 尺寸如何。这出于几个原因非常方便。例如，我们可能想根据可用 RAM 的大小使用较低分辨率或更高分辨率的纹理；因为我们不受限于实际像素尺寸，我们可以在不修改模型本身的情况下更改分辨率。我们将\
    \ `u` 和 `v` 分别乘以纹理的宽度和高度，得到实际的 texel 索引 `tx` 和 `ty`。\n\n纹理映射的基本思想很简单：我们计算三角形每个像素的\
    \ (`u`, `v`) 坐标，从纹理中获取相应的 texel，并用该颜色绘制像素。但模型只指定了三角形三个顶点的 `u` 和 `v` 坐标，而我们在每个像素都需要这些坐标……\n\
    \n到这里，你可能已经预料到结果如何了。是的，它是我们老朋友线性插值。我们可以使用属性映射在整个三角形面上进行插值 `u` 和 `v` 的值，从而在每个像素处得到\
    \ (`u`, `v`)。基于此，我们可以计算出 (`tx`, `ty`)，获取 texel，应用着色，并用最终的颜色绘制像素。你可以在图 14-3 中看到此操作的结果。\n\
    \n![image](img/14fig03.jpg)\n\n*图 14-3：当纹理应用到物体时，看起来发生了变形。*\n\n结果有些不如人意。木箱的外形看起来还可以，但如果你仔细观察对角线板，你会发现它们看起来变形了，仿佛以奇怪的方式弯曲着。哪里出问题了？\n\
    \n正如第 12 章 所示，我们做了一个假设，但事实证明该假设并不成立：即 `u` 和 `v` 在屏幕上呈线性变化。这显然不是如此。考虑一条涂有交替黑白垂直条纹的极走廊墙壁。随着墙面向远处延伸，垂直条纹看起来应该变得越来越细。如果我们让\
    \ `u` 坐标随 `x′` 线性变化，就会得到错误的结果，如图 14-4 所示。\n\n![image](img/14fig04.jpg)\n\n*图 14-4：u\
    \ 和 v 的线性插值（左）没有产生预期的透视正确结果（右）。*\n\n这种情况与我们在第 12 章中遇到的情况非常相似，解决方案也非常相似：尽管 `u`\
    \ 和 `v` 在屏幕坐标中不是线性的，但 ![Images](img/f0179-01.jpg) 和 ![Images](img/f0179-02.jpg)\
    \ 是线性的。（证明过程与 ![Images](img/f0170-07.jpg) 的证明非常相似：考虑 `u` 在 3D 空间中线性变化，并将 `x` 和\
    \ `y` 替换为它们的屏幕空间表达式。）由于我们已经有了每个像素处 ![Images](img/f0170-07.jpg) 的插值，只需对插值 ![Images](img/f0179-01.jpg)\
    \ 和 ![Images](img/f0179-02.jpg) 即可找回 `u` 和 `v`：\n\n![image](img/f0179-04.jpg)\n\
    \n这产生了我们预期的结果，如图 14-5 所示。\n\n![image](img/14fig05.jpg)\n\n*图 14-5：u/z 和 v/z 的线性插值确实产生了透视正确的结果。*\n\
    \n图 14-6 并排显示了两个结果，以便观察。\n\n![image](img/14fig06.jpg)\n\n*图 14-6：线性结果与透视正确结果的对比。*\n\
    \n### 双线性过滤\n\n假设我们将相机非常靠近其中一个三角形。如果纹理大得多或小很多，会发生什么？我们接下来将讨论这些情况。\n\n```\nGetTexel(texture,\
    \ tx, ty) {\n  fx = frac(tx)\n}\n```\n\n"
- fmt: '

    ```javascript

    fy = frac(ty)


    tx = floor(tx)


    ty = floor(ty)


    TL = texture[tx][ty]


    TR = texture[tx+1][ty]


    BL = texture[tx][ty+1]


    BR = texture[tx+1][ty+1]


    CT = fx * TR + (1 - fx) * TL


    CB = fx * BR + (1 - fx) * BL


    return fy * CB + (1 - fy) * CT

    }

    ```


    This function uses `floor()`, which rounds a number down to the nearest integer,
    and `frac()`, which returns the fractional part of a number, and can be defined
    as `x - floor(x)`.


    This technique is called `bilinear filtering` (because we’re doing linear interpolation
    twice, once in each dimension).


    ### Mipmapping


    Let’s consider the opposite situation, rendering an object from far away. In this
    case, the texture has many more texels than the triangle has pixels. It might
    be less evident why this is a problem, so we’ll use a carefully chosen situation
    to illustrate.


    Consider a square texture in which half the pixels are black and half the pixels
    are white, laid out in a checkerboard pattern ([Figure 14-10](#ch14.xhtml_ch14fig10)).


    ![image](Images/14fig10.jpg)


    *Figure 14-10: A black-and-white checkerboard texture*


    Suppose we map this texture onto a square in the viewport such that when it’s
    drawn on the canvas, the width of the square in pixels is exactly half the width
    of the texture in texels. This means that only one-quarter of the texels will
    actually be used.


    We’d intuitively expect the square to look gray. However, given the way we’re
    doing texture mapping, we might be unlucky and get all the white pixels, or all
    the black pixels. It’s true that we might be lucky and get a 50/50 combination
    of black and white pixels, but the 50-percent gray we expect is not guaranteed.
    Take a look at [Figure 14-11](#ch14.xhtml_ch14fig11), which shows the unlucky
    case.


    ![image](Images/14fig11.jpg)


    *Figure 14-11: Mapping a big texture on a small object can lead to unexpected
    results, depending on which texels happen to be selected.*


    How to fix this? Each pixel of the square represents, in some sense, a 2 × 2 texel
    area of the texture, so we could compute the average color of that area and use
    that color for the pixel. Averaging black and white pixels would give us the gray
    we are looking for.


    However, this can get very computationally expensive very fast. Suppose the square
    is even farther away, so that it’s one-tenth of the texture width. This means
    every pixel in the square represents a 10 × 10 texel area of the texture. We’d
    have to compute the average of 100 texels for every pixel we want to render!


    Fortunately, this is one of those situations where we can replace a lot of computation
    with a bit of extra memory. Let’s go back to the initial situation, where the
    square was half the width of the texture. Instead of computing the average of
    the four texels we want to render for every pixel again and again, we could `precompute`
    a texture of half the original size, where every texel in the half-size texture
    is the average of the corresponding four texels in the original texture. Later,
    when the time comes to render a pixel, we can just look up the texel in this smaller
    texture, or even apply bilinear filtering as described in the previous section.


    This way, we get the better rendering quality of averaging four pixels, but at
    the computational cost of a single texture lookup. This does require a bit of
    preprocessing time (when loading a texture, for example) and a bit more memory
    (to store the full-size and half-size textures), but in general it’s a worthwhile
    trade-off.


    What about the 10× size scenario we discussed above? We can take this technique
    further and also precompute one-quarter-, one-eighth-, and one-sixteenth-size
    versions of the original texture (down to a 1 × 1 texture if we wanted). Then,
    when rendering a triangle, we’d use the texture whose scale best matches its size
    and get all the benefits of averaging hundreds, if not thousands, pixels at no
    extra runtime cost.


    This powerful technique is called `mipmapping`. The name is derived from the Latin
    expression `multum in parvo`, which means “much in little.”


    Computing all these smaller-scale textures does come at a memory cost, but it’s
    surprisingly smaller than you might think.


    Say the original area of the texture, in texels, is `A`, and its width is `w`.
    The width of the half-width texture is ![Images](Images/f0186-01.jpg), but it
    requires only ![Images](Images/f0186-02.jpg) texels; the quarter-width texture
    requires ![Images](Images/f0186-03.jpg) texels; and so on. [Figure 14-12](#ch14.xhtml_ch14fig12)
    shows the original texture and the first three reduced versions.


    ![image](Images/14fig12.jpg)


    *Figure 14-12: A texture and its progressively smaller mipmaps*


    We can express the sum of the textures as:


    ![image](Images/f0186.jpg)


    This series converges to `A`⋅1.333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333


    ### Trilinear Filtering


    Let’s take this one step further. Imagine an object far away. We render it using
    the mipmap level most appropriate for its size. Now imagine the camera moves toward
    the object. At some point, the choice of mipmap level will change from frame to
    frame. When choosing a mipmap level, for the square that 10 times smaller than
    the texture, we might choose the two mipmap levels that 8 times smaller and linearly
    interpolate between them, depending on the “distance” between the mipmap size
    and actual size ratio.


    Because the colors that come from each mipmap level are bilinearly interpolated
    and we apply another linear interpolation on top, this technique is called `trilinear
    filtering`.


    ### Summary


    In this chapter, we have given our rasterizer a massive jump in quality. Before
    this chapter, each triangle could have a single color; now we can draw arbitrarily
    complex images on them. We have also discussed how to make sure the textured triangles
    look good, regardless of the relative size of the texture. We presented bilinear
    filtering, mipmapping, and trilinear filtering as solutions to the most common
    causes of low-quality textures.


    ## 15 EXTENDING THE RASTERIZER


    ![image](Images/common.jpg)


    We’ll conclude this second part of the book the same way we concluded the first:
    with a set of possible extensions to the rasterizer we’ve developed in the preceding
    chapters.


    ### Normal Mapping


    In [Chapter 13](#ch13.xhtml_ch13), we saw how the normal vectors of a surface
    have a big impact on its appearance. For example, the right choice of normals
    can make a faceted object look smoothly curved; this is because the right choice
    of normals changes the way light interacts with the surface, which in turn changes
    the way our brain guesses the shape of the object. Unfortunately, there’s not
    much more we can do by interpolating normals beyond making surfaces look smoothly
    curved.


    In [Chapter 14](#ch14.xhtml_ch14), we saw how we could add fake detail to a surface
    by “painting” on it. This technique, called texture mapping, gives us much finer-grained
    control over the appearance of a surface. However, texture mapping doesn’t change
    the shape of the triangles—they’re still flat.


    *Normal mapping* combines both ideas. We can use normals to change the way light
    interacts with a surface and thus change the apparent shape of the surface; we
    can use attribute mapping to assign different values of an attribute to different
    parts of a triangle. By combining the two ideas, normal mapping lets us define
    surface normals at the pixel level.

    '
  raw: '  fy = frac(ty)


      tx = floor(tx)


      ty = floor(ty)


      TL = texture[tx][ty]


      TR = texture[tx+1][ty]


      BL = texture[tx][ty+1]


      BR = texture[tx+1][ty+1]


      CT = fx * TR + (1 - fx) * TL


      CB = fx * BR + (1 - fx) * BL


      return fy * CB + (1 - fy) * CT


    }


    This function uses floor(), which rounds a number down to the nearest integer,
    and frac(), which returns the fractional part of a number, and can be defined
    as x - floor(x).


    This technique is called *bilinear filtering* (because we’re doing linear interpolation
    twice, once in each dimension).


    ### Mipmapping


    Let’s consider the opposite situation, rendering an object from far away. In this
    case, the texture has many more texels than the triangle has pixels. It might
    be less evident why this is a problem, so we’ll use a carefully chosen situation
    to illustrate.


    Consider a square texture in which half the pixels are black and half the pixels
    are white, laid out in a checkerboard pattern ([Figure 14-10](#ch14.xhtml_ch14fig10)).


    ![image](Images/14fig10.jpg)


    *Figure 14-10: A black-and-white checkerboard texture*


    Suppose we map this texture onto a square in the viewport such that when it’s
    drawn on the canvas, the width of the square in pixels is exactly half the width
    of the texture in texels. This means that only one-quarter of the texels will
    actually be used.


    We’d intuitively expect the square to look gray. However, given the way we’re
    doing texture mapping, we might be unlucky and get all the white pixels, or all
    the black pixels. It’s true that we might be lucky and get a 50/50 combination
    of black and white pixels, but the 50-percent gray we expect is not guaranteed.
    Take a look at [Figure 14-11](#ch14.xhtml_ch14fig11), which shows the unlucky
    case.


    ![image](Images/14fig11.jpg)


    *Figure 14-11: Mapping a big texture on a small object can lead to unexpected
    results, depending on which texels happen to be selected.*


    How to fix this? Each pixel of the square represents, in some sense, a 2 × 2 texel
    area of the texture, so we could compute the average color of that area and use
    that color for the pixel. Averaging black and white pixels would give us the gray
    we are looking for.


    However, this can get very computationally expensive very fast. Suppose the square
    is even farther away, so that it’s one-tenth of the texture width. This means
    every pixel in the square represents a 10 × 10 texel area of the texture. We’d
    have to compute the average of 100 texels for every pixel we want to render!


    Fortunately, this is one of those situations where we can replace a lot of computation
    with a bit of extra memory. Let’s go back to the initial situation, where the
    square was half the width of the texture. Instead of computing the average of
    the four texels we want to render for every pixel again and again, we could *precompute*
    a texture of half the original size, where every texel in the half-size texture
    is the average of the corresponding four texels in the original texture. Later,
    when the time comes to render a pixel, we can just look up the texel in this smaller
    texture, or even apply bilinear filtering as described in the previous section.


    This way, we get the better rendering quality of averaging four pixels, but at
    the computational cost of a single texture lookup. This does require a bit of
    preprocessing time (when loading a texture, for example) and a bit more memory
    (to store the full-size and half-size textures), but in general it’s a worthwhile
    trade-off.


    What about the 10× size scenario we discussed above? We can take this technique
    further and also precompute one-quarter-, one-eighth-, and one-sixteenth-size
    versions of the original texture (down to a 1 × 1 texture if we wanted to). Then,
    when rendering a triangle, we’d use the texture whose scale best matches its size
    and get all the benefits of averaging hundreds, if not thousands, of pixels at
    no extra runtime cost.


    This powerful technique is called *mipmapping*. The name is derived from the Latin
    expression *multum in parvo*, which means “much in little.”


    Computing all these smaller-scale textures does come at a memory cost, but it’s
    surprisingly smaller than you might think.


    Say the original area of the texture, in texels, is *A*, and its width is *w*.
    The width of the half-width texture is ![Images](Images/f0186-01.jpg), but it
    requires only ![Images](Images/f0186-02.jpg) texels; the quarter-width texture
    requires ![Images](Images/f0186-03.jpg) texels; and so on. [Figure 14-12](#ch14.xhtml_ch14fig12)
    shows the original texture and the first three reduced versions.


    ![image](Images/14fig12.jpg)


    *Figure 14-12: A texture and its progressively smaller mipmaps*


    We can express the sum of the texture sizes as an infinite series:


    ![image](Images/f0186-04.jpg)


    This series converges to *A*⋅ 4/3, or *A* ⋅ 1.3333, meaning that all the smaller
    textures down to 1 × 1 texel only take one-third more space than the original
    texture.


    ### Trilinear Filtering


    Let’s take this one step further. Imagine an object far away from the camera.
    We render it using the mipmap level most appropriate for its size.


    Now imagine the camera moves toward the object. At some point, the choice of the
    most appropriate mipmap level will change from one frame to the next, and this
    will cause a subtle but noticeable difference.


    When choosing a mipmap level, we choose the one that most closely matches the
    relative size of the texture and the square. For example, for the square that
    was 10 times smaller than the texture, we might choose the mipmap level that is
    8 times smaller than the original texture, and apply bilinear filtering on it.
    However, we could also consider the *two* mipmap levels that most closely match
    the relative size (in this case, the ones 8 and 16 times smaller) and linearly
    interpolate between them, depending on the “distance” between the mipmap size
    ratio and the actual size ratio.


    Because the colors that come from each mipmap level are bilinearly interpolated
    and we apply another linear interpolation on top, this technique is called *trilinear
    filtering*.


    ### Summary


    In this chapter, we have given our rasterizer a massive jump in quality. Before
    this chapter, each triangle could have a single color; now we can draw arbitrarily
    complex images on them.


    We have also discussed how to make sure the textured triangles look good, regardless
    of the relative size of the triangle and the texture. We presented bilinear filtering,
    mipmapping, and trilinear filtering as solutions to the most common causes of
    low-quality textures.


