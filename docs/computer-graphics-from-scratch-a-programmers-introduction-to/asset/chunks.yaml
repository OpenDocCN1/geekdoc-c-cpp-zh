    Next, we apply the perspective equations to get viewport coordinates:


    ![image](Images/f0125-01.jpg)


    And finally we map the viewport coordinates to canvas coordinates:


    ![image](Images/f0125-02.jpg)


    As you can see, it’s a lot of computation and a lot of intermediate values for
    each vertex. Wouldn’t it be nice if we could reduce all of that to a more compact
    and efficient form?


    Let’s express the transforms as functions that take a vertex and return a transformed
    vertex. Let `C[T]` and `C[R]` be the camera translation and rotation; `I[R]`,
    `I[S]`, and `I[T]` the instance rotation, scale, and translation; `P` the perspective
    projection; and `M` the viewport-to-canvas mapping. If `V` is the original vertex
    and `V′` is the point on the canvas, we can express all the equations above like
    this:


    ![image](Images/f0125-03.jpg)


    Ideally, we’d like a single transform `F` that does whatever the series of original
    transforms does, but that has a much simpler expression:


    ![image](Images/f0125-04.jpg)


    Finding a simple way to represent `F` isn’t trivial. Our main obstacle is that
    we express each transform in a different way: we express translation as the sum
    of a point and a vector, rotation as the multiplication of a matrix and a point,
    scaling as the multiplication of a real number and a point, and perspective projection
    as real number multiplications and divisions. But if we could express all the
    transforms in the same way, and if such a way had a mechanism to compose transforms,
    we’d get the simple transform we want.


    ### Homogeneous Coordinates


    Consider the expression `A = (1,2,3)`. Does `A` represent a 3D point or a 3D vector?
    If we don’t know the context in which `A` is used, there’s no way to know.


    But let’s add a fourth value, called `w`, to mark `A` as a point or a vector.
    If `w = 0`, it’s a vector; if `w = 1`, it’s a point. So the point `A` is unambiguously
    represented as `A = (1,2,3,1)` and the vector ![image](Images/f0160-08.jpg) is
    represented as `(1,2,3,0)`.


    Since points and vectors share the same representation, these four-component coordinates
    are called `homogeneous coordinates`. Homogeneous coordinates have a far deeper
    and far more involved geometric interpretation, but that’s outside the scope of
    this; here, we’ll just use them as a convenient tool. Manipulating points and
    vectors expressed in homogeneous coordinates is compatible with their geometric
    interpretation. For example, subtracting two points produces a vector:


    ```

    (8,4,2,1) - (3,2,1,1) = (5,2,1,0)

    ```


    Adding two vectors produces another vector:


    ```

    (0,0,1,0) + (1,0,0,0) = (1,0,1,0)

    ```


    In the same way, it’s easy to see that adding a point and a vector produces a
    point, multiplying a vector by a scalar produces a vector, and so on, as we expect.


    So what do coordinates with a `w` value other than 0 or 1 represent? They also
    represent points. In fact, any point in 3D has infinite number of representations
    in homogeneous coordinates. What matters is the `ratio` between the coordinates
    and the `w` value. For example, `(1,2,3,1)` and `(2,4,6,2)` represent the same
    point, as does `(-3,-6,-9,-3)`.


    Of all of these representations we call the one with `w = 1` the `canonical representation`
    of the point in homogeneous coordinates; converting any other representation to
    its canonical representation or to Cartesian coordinates is trivial:


    ![image](Images/f0126-01.jpg)


    So we can convert Cartesian coordinates to homogeneous coordinates, and back to
    Cartesian coordinates. But how does this help us find a single representation
    for all the transforms?


    #### Homogeneous Matrix


    Let’s begin with a rotation matrix. Converting a `3×3` rotation matrix in Cartesian
    coordinates to a `4×4` rotation matrix in homogeneous coordinates is trivial;
    since the `w` coordinate of the point shouldn’t change, we add a column to the
    right, a row to the bottom, fill them with zeros, and place a `1` in the lower-right
    element to keep the value of `w`:


    ![image](Images/f0127-01.jpg)


    #### Homogeneous Scale Matrix


    A scaling matrix is also trivial in homogeneous coordinates, and it’s constructed
    in the same way as the rotation matrix:


    ![image](Images/f0127-02.jpg)


    #### Homogeneous Translation Matrix


    The rotation and scale matrices were easy; they were already expressed as matrix
    multiplications in Cartesian coordinates, we just had to add a 1 to preserve the
    `w` coordinate. But what can we do with a translation, which we had expressed
    as an addition in Cartesian coordinates? We’re looking for a `4×4` matrix such
    that:


    ![image](Images/f0127-03.jpg)


    Let’s focus on getting `x + T[x]` first. This value is the result of multiplying
    the first row of the matrix and the point—that is:


    ![image](Images/f0128-01.jpg)


    If we expand the vector multiplication, we get:


    ```

    Ax + By + Cz + D = x + T[x]

    ```


    From here we can deduce that `A = 1`, `B = C = 0`, and `D = T[x]`. Following a
    similar reasoning for the rest of the coordinates, we arrive at the following
    matrix expression for the translation:


    ![image](Images/f0128-02.jpg)


    #### Homogeneous Projection Matrix


    Sums and multiplications are easy to express as multiplications of matrices and
    vectors because they involve, after all, sums and multiplications. But the perspective
    projection equations have a division by `z`. How can we express that?


    You may be tempted to think that dividing by `z` is the same as multiplying by
    `1/z`, and you may want to solve this problem by putting `1/z` in the matrix.
    However, which `z` coordinate would we put there? We want this projection matrix
    to work for every input point, so hardcoding the `z` coordinate of any point would
    not give us what we want.


    Fortunately, homogeneous coordinates do have one instance of a division: the division
    by the `w` coordinate when converting back to Cartesian coordinates. If we can
    manage to make the `z` coordinate of the original point appear as the `w` coordinate
    of the “projected” point, we’ll get the projected `x` and `y` once we convert
    the point back to Cartesian coordinates:


    ![image](Images/f0128-03.jpg)


    Note that this matrix is `3×4`; it can be multiplied by a four-element vector
    (the transformed 3D point in homogeneous coordinates) and it will yield a three-element
    vector (the projected 2D point in homogeneous coordinates), which is then converted
    to 2D Cartesian coordinates by dividing by `w`. This gives us exactly the values
    of `x′` and `y′` we were looking for. The missing element here is `z''`, which
    we know is equal to `d` by definition.


    Applying the same reasoning we used to deduce the translation matrix, we can express
    the perspective projection as follows:


    ![image](Images/f0129-01.jpg)


    #### Homogeneous Viewport-to-Canvas Matrix


    The last step is mapping the projected point on the viewport to the canvas. This
    is just a 2D scaling transform with ![image](Images/f0129-02.jpg) and ![image](Images/f0129-03.jpg).
    This matrix is thus:


    ![image](Images/f0129-04.jpg)


    In fact, it’s easy to combine this with the projection matrix to get a simple
    3D-to-canvas matrix:


    ![image](Images/f0129-05.jpg)


    ### The Transform Matrix Revisited


    After all this work, we can express every transform we need to convert a model
    vertex `V` into a canvas pixel `V′` as a matrix. Moreover, we can compose these
    transforms by multiplying their corresponding matrices. So we can express the
    whole sequence of transforms as a single matrix:


    ![image](Images/f0129-06.jpg)


    Now transforming a vertex is just a matter of computing the following matrix-by-point
    multiplication:


    ```

    V′ = F ⋅ V

    ```


    Furthermore, we can decompose the transform into three parts:


    ![image](Images/f0130-01.jpg)


    These matrices don’t need to be computed from scratch for every vertex (that’s
    the point of using a matrix after all). Because matrix multiplication is associative,
    we can reuse the parts of the expression that don’t change.

