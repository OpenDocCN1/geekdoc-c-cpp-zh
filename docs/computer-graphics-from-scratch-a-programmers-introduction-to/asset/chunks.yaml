  trans: '


    *图 3-1：位于 `Q` 处的点光源。`![Images](img/larr1.jpg)` 向量对于每个点 `P` 都不同。*


    ## 方向光 (Directional Lights)


    如果说点光源是灯泡的良好近似，那么它也能作为太阳的近似吗？


    这是一个棘手的问题，答案取决于我们正试图渲染什么。在太阳系尺度下，太阳可以被近似为点光源。毕竟，它从某一点发射光，并且向所有方向发射光，因此它似乎符合条件。


    然而，如果我们的场景代表地球上发生的事情，那么它就不是那么好的近似了。太阳非常遥远，以到达我们的每一条光线的方向几乎完全相同。我们可以用一个距离场景中物体非常、非常、非常远的光源来近似这一点。然而，光与物体之间的距离将比物体之间的距离大几个数量级，因此我们会开始遇到数值精度误差。


    为了更好地处理这些情况，我们定义了`方向光`。像点光源一样，方向光具有强度，但与它们不同的是，它们没有位置；相反，它们有一个固定的`direction`（方向）。你可以将它们想象为位于指定方向的无限远点光源。


    在点光源的情况下，我们需要为场景中的每个点 `P` 计算不同的光向量 `![Images](img/larr.jpg)`，但在这种情况下，`![Images](img/larr.jpg)`
    是给定的。在太阳到地球的场景示例中，`![Images](img/larr.jpg)` 将是 `(太阳中心) – (地球中心)`。图 3-2 展示了它的样子的。


    ![image](img/03fig02.jpg)


    *图 3-2：一个方向光。`![Images](img/larr1.jpg)` 向量对于每个点 `P` 都是相同的。*


    正如我们在这里看到的，方向光的光向量对于场景中的每个点都是相同的。对比图 3-1，在该图中，点光源的光向量对于场景中的每个点都是不同的。


    ## 环境光 (Ambient Light)


    每种现实生活中的光都能被建模为点光或方向光吗？基本上可以。这两种光足以照亮场景吗？遗憾的是不能。


    考虑一下月球发生的情况。附近唯一的光源是太阳。因此，相对于太阳，月球的“前半部分”获得了所有的光，而它的“后半部分”处于完全黑暗中。我们从地球上不同的角度看到这一点，这就形成了我们所说的月球“相位”。


    然而，地球地面上的情况又有点不同。即使是不直接从光源接收光的点，也没有完全处于黑暗中（看看你椅子下的地板）。如果光线对光源的“视野”被其他东西阻挡，光线是如何到达这些点的呢？


    正如第 1 章中“颜色模型”所提到的，当光击中物体时，部分会被吸收，而另一部分则散射回场景中。这意味着光不仅可以来自光源，还可以来自那些从光源获得光并将部分散射回场景的物体。但为什么止于此呢？散射的光反过来会击中另一个物体，部分会被吸收，另一部分又会散射回场景中。如此反复，直到原始光的所有能量都被场景中的表面吸收。


    这意味着我们应该将`每一个物体`视为光源。正如你可以想象的，这将为我们的模型增加很多复杂性，因此我们不会在书中探索该机制。如果你好奇，可以搜索`global
    illumination`（全局光照）并惊叹那些漂亮的图片。


    但我们并不希望每个物体要么被直接照亮，要么完全黑暗（除非我们实际上在渲染太阳系模型）。为了克服这一局限性，我们将定义第三种光源，称为`环境光`，它的特征仅为其强度。我们将声明环境光为场景中的每个点贡献一些光，无论它在哪里。这是对光源与场景中表面之间极其复杂的相互作用的粗略简化，但效果足够好。


    通常情况下，一个场景将有一个环境光（因为环境光只有强度值，任意数量的环境光都可以很容易地合并为一个环境光）以及任意数量的点光源和方向光。


    ### 单点的照明 (Illumination)


    现在我们已经知道了如何定义场景中的光，我们需要弄清楚光是如何与场景中物体的表面相互作用的。


    为了计算单个点的照明，我们将计算每个光源贡献的光量，并将它们相加，得到一个代表该点接收的光总量的数字。然后我们可以将该点表面的颜色乘以此数量，得到代表其接收光量多少的颜色深浅。


    那么，当一条光线（无论是来自方向光还是点光源）击中我们场景中某个物体的一点时会发生什么？


    我们可以根据物体反射光的方式直观地将物体分为大类：“哑光”（matte）和“光泽”（shiny）物体。由于我们周围的大多数物体都可以归类为哑光，我们将首先关注这一组。


    ## 漫反射 (Diffuse Reflection)


    当光线击中哑光物体时，光线会向每个方向均匀地散射回场景，这一过程被称为`漫反射`；这使得哑光物体看起来是哑光的。


    为了验证这一点，观察你周围的某个哑光物体，例如墙。如果你相对于墙移动，它的颜色不会改变。也就是说，无论你从哪里观察反射光都是相同的。


    另一方面，反射的光量取决于光线与表面之间的`angle`。直观上，这是因为光线携带的能量根据角度分散在较小或更大的区域上，因此单位面积反射的能量相应越高或越低，如图
    3-3


    *图 3-3：光线的能量根据其与表面的角度分散在不同大小的区域上。*


    在图 3-3 中，我们可以看到两条相同强度（由相同宽度表示）的光线以垂直和角度击中表面。光线携带的能量均匀分布在它们击中的区域上。右侧光线的能量分散在比左侧更大的区域上，因此其区域内的每个点接收的能量较少。


    为了从数学上探索这一点，让我们用`法向量`来表征表面的方向。点 `P` 处的表面法向量（或称为“法线”）是垂直于表面的向量。它还是单位向量，意味着它的长度为
    1。我们将此向量称为`![Images](img/narr.jpg)`。


    ### 建模漫反射


    方向为`![Images](img/larr.jpg)`强度为`I`的光线击中具有法向量为`![Images](img/narr.jpg)`的表面。反射回场景的
    `I` 的比例是多少`I`、`![Images](img/narr.jpg)` 和 `![Images](img/larr.jpg)` 的函数？


