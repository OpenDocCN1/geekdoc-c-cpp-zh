  raw: 'I’m a senior software engineer at Google. In the past, I’ve worked at Improbable
    (*[http://improbable.io](http://improbable.io)*), who have a good shot at building
    the Matrix for real (or at the very least revolutionizing multiplayer game development),
    and at Mystery Studio (*[http://mysterystudio.com](http://mysterystudio.com)*),
    a game development company I founded and ran for about a decade and which released
    almost 20 games you’ve probably never heard of.


    I taught computer graphics for five years at university, where it was a semester-long
    third-year subject. I am grateful to all of my students, who served as unwitting
    guinea pigs for the materials that inspired this book.


    I have other interests besides computer graphics, engineering-related and otherwise.
    See my website, *[http://gabrielgambetta.com](http://gabrielgambetta.com)*, for
    more details and contact information.


    ## **1


    INTRODUCTORY CONCEPTS**


    ![image](Images/common.jpg)


    A raytracer and a rasterizer take very different approaches to rendering a 3D
    scene onto a 2D screen. However, there are a few fundamental concepts that are
    common to both approaches.


    In this chapter, we’ll explore the canvas, the abstract surface on which we’ll
    render our images; the coordinate system we’ll use to refer to pixels on the canvas;
    how to represent and manipulate colors; and how to describe a 3D scene so our
    renderers can work with it.


    ### The Canvas


    Throughout this book, we’ll be drawing things on a *canvas*: a rectangular array
    of pixels that can be individually colored. Whether this canvas is shown on a
    screen or printed on paper is irrelevant to our purposes. Our goal is to represent
    a 3D scene on a 2D canvas, so we’ll focus on rendering to this abstract, rectangular
    array of pixels.


    We’ll build everything in this book out of a single, very simple function, which
    assigns a color to a pixel on the canvas:


    canvas.PutPixel(x, y, color)


    This method has three arguments: an x coordinate, a y coordinate, and a color.
    Let’s focus on the coordinates for now.


    #### Coordinate Systems


    The canvas has a width and a height, measured in pixels, which we’ll call *C*[*w*]
    and *C*[*h*]. We need a coordinate system to refer to its pixels. For most computer
    screens, the origin is at the top left; *x* increases toward the right of the
    screen, and *y* increases toward the bottom, as in [Figure 1-1](#ch01.xhtml_ch1fig1).


    ![image](Images/01fig01.jpg)


    *Figure 1-1: The coordinate system used by most computer screens*


    This coordinate system is very natural for a computer because of the way video
    memory is organized, but it’s not the most natural for humans to work with. Instead,
    3D graphics programmers tend to use the coordinate system typically used to draw
    graphs on paper: the origin is at the center, *x* increases toward the right and
    decreases toward the left, while *y* increases toward the top and decreases toward
    the bottom, as in [Figure 1-2](#ch01.xhtml_ch1fig2).


    ![image](Images/01fig02.jpg)


    *Figure 1-2: The coordinate system we’ll use for our canvas*


    Using this coordinate system, the range of the *x* coordinate is ![Images](Images/e0003-01.jpg)
    and the range of the *y* coordinate is ![Images](Images/e0003-02.jpg). Let’s assume
    that using the PutPixel function with coordinates outside these ranges does nothing.


    In our examples, the canvas will be drawn on the screen, so we’ll need to convert
    from one coordinate system to the other. To do this, we need to change the center
    of the coordinate system and reverse the direction of the *Y* axis. The resulting
    conversion equations are:


    ![image](Images/e0003-03.jpg)


    We will assume PutPixel does this conversion automatically; from this point on,
    we can think of the canvas as having its coordinate origin at the center, with
    *x* increasing to the right and *y* increasing to the top of the screen.


    Let’s take a look at the remaining argument of PutPixel: the color.


    ### Color Models


    The theory of how color works is fascinating, but it’s outside the scope of this
    book. The following is a simplified version of the aspects relevant to us.


    When light hits our eyes, it stimulates the light-sensitive cells at the back
    of them. These generate brain signals that depend on the wavelength of the incoming
    light. We call the subjective experience of these brain signals *colors*.


    We can’t normally see wavelengths outside of the *visible range*. Wavelength and
    frequency are inversely related (the more frequently the wave hits, the smaller
    the distance between the peaks of that wave). This is why infrared (wavelengths
    longer than 740 nm, corresponding to frequencies lower than 405 terahertz [THz])
    is harmless, but ultraviolet (wavelengths shorter than 380 nm, corresponding to
    frequencies higher than 790 THz) can burn your skin.


    Every color imaginable can be described as different combinations of these colors.
    “White” is the sum of all colors, while “black” is the absence of any colors.
    It would be impractical to describe colors by describing the exact wavelengths
    they’re made of; fortunately, it’s possible to create almost all colors as a linear
    combination of just three colors, which we call *primary* *colors*.


    #### Subtractive Color Model


    The *subtractive color model* is a fancy name for that thing you did with crayons
    as a toddler. You take a white piece of paper and red, blue, and yellow crayons.
    You draw a yellow circle, then a blue circle that overlaps it, and you get green!
    Yellow and red—orange! Red and blue—purple! Mix the three together—something darkish!
    Wasn’t kindergarten amazing? [Figure 1-3](#ch01.xhtml_ch1fig3) shows the primary
    colors of the subtractive model, and the colors that result from mixing them.


    ![image](Images/01fig03.jpg)


    *Figure 1-3: Subtractive primary colors and their combinations*


    Objects are of different colors because they absorb and reflect light in different
    ways. Let’s start with white light, like sunlight (sunlight isn’t quite white,
    but it’s close enough for our purposes). White light contains light of every wavelength.
    When it hits an object, the object’s surface absorbs some of the wavelengths and
    reflects others, depending on the material. Some of the reflected light then hits
    our eyes, and our brains convert that to color. What color? The sum of the wavelengths
    that were reflected by the surface.


    So what’s going on with the crayons? You start with white light reflecting off
    the paper. Since it’s white paper, it reflects most of the light it receives.
    When you draw with a “yellow” crayon, you’re adding a layer of a material that
    absorbs some wavelengths but lets others pass through it. They’re reflected by
    the paper, pass through the yellow layer again, hit your eyes, and your brain
    interprets that particular combination of wavelengths as “yellow.” What the yellow
    layer does is *subtract* a bunch of wavelengths from the original white light.


    You can think of each colored circle as a filter: when you draw a blue circle
    overlapping the yellow one, you’re filtering out even more wavelengths from the
    original light, so what hits your eyes is whatever wavelengths weren’t filtered
    by either the blue or the yellow circles, which your brain sees as “green.”


    In summary, we start with all wavelengths and subtract some amount of the primary
    colors to create any other color. This color model gets its name from the fact
    that we’re creating colors by subtracting wavelengths.


    This model isn’t quite right, though. The actual primary colors in the subtractive
    model aren’t the blue, red, and yellow taught to toddlers and art students, but
    cyan, magenta, and yellow. Furthermore, mixing the three primary colors produces
    a somewhat darkish color that isn’t quite black, so pure black is added as a fourth
    “primary.” Because B is used to represent blue, black is denoted by K, and so
    we arrive at the *CMYK color model* ([Figure 1-4](#ch01.xhtml_ch1fig4)).'
