  trans: "\n\n在这种特殊情况下，无论 `Z` 的值如何，我们都能得到正确的结果，因为这些点的出现顺序恰好是方便的顺序。但如果我们想先绘制 `P[1]`，后绘制\
    \ `P[2]` 呢？我们首先将像素涂成蓝色并存储 `Z[P*1]`；但每当我们想要绘制 `P[2]` 时，我们发现 `Z[P*2] > Z[P*1]`，所以我们*不*绘制它——因为如果这样做的话，`P[1]`\
    \ 就会被 `P[2]` 覆盖，而后者更远！我们再次得到了一个蓝色像素，这是正确的结果。\n\n在实现方面，我们需要一个缓冲区来存储画布上每个像素的 `Z`\
    \ 坐标；我们称之为`深度缓冲区`（depth buffer）。它的尺寸与画布相同，但它的元素是表示深度值的实数，而不是像素。\n\n但 `Z` 值是从哪里来的呢？这些应该是点在经过变换之后、透视投影之前的\
    \ `Z` 值。然而，这只给了我们顶点的 `Z` 值；我们需要每个三角形每个像素都有一个 `Z` 值。\n\n这是我们在第 8 章中开发的属性映射算法的另一个应用。为什么不将\
    \ `Z` 作为属性并在三角形面上对其进行插值呢，就像我们之前对颜色强度值做的那样？到现在你已经知道如何做了了：取 `z0`、`z1` 和 `z2` 的值；计算\
    \ `z01`、`z02` 和 `z012`；将它们组合得到 `z_left` 和 `z_right`；然后，对于每个水平段，计算 `z_segment`。最后，我们不再盲目地调用\
    \ `PutPixel(x, y, color)`，而是这样做：\n\n```\nz = z_segment[x - xl]\n\nif (z < depth_buffer[x][y])\
    \ {\n    canvas.PutPixel(x, y, color)\n    depth_buffer[x][y] = z\n}\n```\n\n\
    为了让这正常工作，`depth_buffer` 中的每个条目都应该初始化为 `+∞`（或“一个很大的值”）。这保证了当我们第一次想要绘制一个像素时，条件将为真，因为场景中的任何点都比无限远的点离相机近。\n\
    \n我们现在得到的结果好得多——查看图 12-4。\n\n![image](img/12fig04.jpg)\n\n*图 12-4：现在的立方体看起来像立方体了，无论它们的三角形顺序如何。*\n\
    \n你可以在 [`gabrielgambetta.com/cgfs/depth-demo`](https://gabrielgambetta.com/cgfs/depth-demo)\
    \ 找到该算法的实时实现。\n\n### 使用 1/Z 代替 Z\n\n结果看起来好得多，但我们的做法在细节上是错误的。顶点的 `Z` 值是正确的（毕竟它们源于数据），但在大多数情况下，其余像素的线性插值\
    \ `Z` 值是不正确的。在目前这可能不会产生肉眼可见的差异，但以后会变成问题。\n\n为了看到这些值是如何错误的，请考虑从 `A(–1,0,2)` 到 `B(1,0,10)`\
    \ 的简单线段，其中点 `M` 在 (0,0,6)。具体来说，因为 `M` 是 `AB` 的中点，我们知道 `M[z] = (A[z] + B[z])/2\
    \ = 6`。图 12-5 显示了这条线段。\n\n![image](img/12fig05.jpg)\n\n*图 12-5：线段 AB 及其中点 M*\n\
    \n让我们取 `d = 1` 计算这些点的投影。应用透视投影方程，我们得到 ![image](img/f0154-01.jpg)。同样，![image](img/f0154-02.jpg)\
    \ 和 ![image](img/f0154-03.jpg)。图 12-6 显示了投影后的点。\n\n![image](img/12fig06.jpg)\n\
    \n*图 12-6：点 A、B 和 M 投影到投影面上的*\n\n`A′B′` 是视口上的一个水平段。我们知道 `A[z]` 和 `B[z]` 的值。让我们看看如果尝试使用线性插值计算\
    \ `M[z]` 的值会发生什么。隐含的线性函数如图 12-7 所示。\n\n![image](img/12fig07.jpg)\n\n*图 12-7：A[x']\
    \ 和 B[x'] 的 A[z] 和 B[z] 值定义了一个线性函数 z = f(x’)。*\n\n函数的斜率是常数，所以我们可以写成\n\n![image](img/f0155-01.jpg)\n\
    \n我们可以操作该表达式来解出 `M[z]`：\n\n![image](img/f0155-02.jpg)\n\n如果我们代入已知值并进行算术运算，我们得到\n\
    \n![image](img/f0155-03.jpg)\n\n这说明 `M[z]` 的值为 8.666，但我们确切知道实际上是 6！\n\n我们哪里搞错了？我们正在使用线性插值（我们知道它效果很好），而且我们输入的是正确的值（它们源于数据），那么为什么结果是错误的呢？\n\
    \n我们的错误隐藏在在使用线性插值时的一种隐含假设中：我们正在插值的函数本身就是线性的！在这种情况下，事实证明并不是。\n\n如果 `Z = f (x',\
    \ y')` 是 `x'` 和 `y'` 的线性函数，我们可以写成 `Z = Ax′ + By′ + C`，其中 `A`、`B` 和 `C` 是某些值。这种函数具有这样的属性：两点之间的值的差取决于点之间的差异，而不是点本身。\n\
    \n### 背剔除\n\n深度缓冲产生了预期的结果。但我们能让运行更快吗？\n\n回到立方体，即使每个像素最终都有正确的颜色，但许多像素被绘制了多次。例如，如果在渲染正面之前渲染立方体的背面，许多像素会被绘制两次。这是代价昂贵的。到目前为止，我们为每个像素计算\
    \ 1/z，但很快我们会添加更多属性，例如照明。随着我们需要对每个像素执行的操作增加，计算那些永远不会可见的像素将变得越来越浪费。\n\n我们能否在进行这些计算之前更早地丢弃像素？事实证明我们可以在开始渲染之前丢弃整个三角形！\n\
    \n"
- fmt: "\nThese arrows let us classify each triangle as “front” or “back,” depending\
    \ on whether they point toward the camera or away from the camera. More formally,\
    \ if the view vector and this arrow (which is actually a normal vector of the\
    \ triangle) form an angle of less than `90°`, the triangle is front-facing; otherwise,\
    \ it’s back-facing ([Figure 12-9](#ch12.xhtml_ch12fig9)).\n\n![image](Images/12fig09.jpg)\n\
    \n*Figure 12-9: The angle between the view vector and the normal vector of a triangle\
    \ lets us classify it as front-facing or back-facing.*\n\nAt this point, we need\
    \ to impose a restriction on our 3D models: that they are *closed*. The exact\
    \ definition of closed is pretty involved, but fortunately an intuitive understanding\
    \ is enough. The cube we’ve been working with is closed; we can only see its exterior.\
    \ If we removed one of its faces, it wouldn’t be closed because we could see inside\
    \ it. This doesn’t mean we can’t have objects with holes or concavities; we would\
    \ just model these with thin “walls.” See [Figure 12-10](#ch12.xhtml_ch12fig10)\
    \ for some examples.\n\n![image](Images/12fig10.jpg)\n\n*Figure 12-10: Some examples\
    \ of open and closed objects*\n\nWhy impose this restriction? Closed objects have\
    \ the interesting property that the set of front faces completely covers the set\
    \ of back faces, no matter the orientation of the model or the camera. This means\
    \ we don’t need to draw the back faces at all, saving valuable computation time.\n\
    \nSince we can discard (cull) all the back faces, this algorithm is called *back\
    \ face culling*. Its pseudocode is remarkably simple for an algorithm that can\
    \ cut our rendering time by half!\n\n```\nCullBackFaces(object, camera) {\n  for\
    \ T in object.triangles {\n    if T is back-facing {\n      remove T from object.triangles\n\
    \    }\n  }\n}\n```\n\n*Listing 12-1: The back face culling algorithm*\n\nLet’s\
    \ take a more detailed look at how to determine whether a triangle is front-facing\
    \ or back-facing.\n\n### Classifying Triangles\n\nSuppose we have the normal vector\
    \ ![image](Images/f0160-01.jpg) of a triangle and the vector ![image](Images/f0160-02.jpg)\
    \ from a vertex of the triangle to the camera. Now suppose ![image](Images/f0160-01.jpg)\
    \ points to the outside of the object. In order to classify the triangle as front-facing\
    \ or back-facing, we compute the angle between ![image](Images/f0160-01.jpg) and\
    \ ![image](Images/f0160-02.jpg) and check whether they’re within `90°` of each\
    \ other.\n\nWe can again use the properties of the dot product to make this simpler.\
    \ Remember that if `α` is the angle between ![image](Images/f0160-01.jpg) and\
    \ ![image](Images/f0160-02.jpg), then\n\n![image](Images/f0160-03.jpg)\n\nBecause\
    \ `cos(α)` is non-negative for `|α| ≤ 90°`, we only need to know the sign of this\
    \ expression to classify a triangle as front-facing or back-facing. Note that\
    \ ![image](Images/f0160-03a.jpg) and ![image](Images/f0160-03b.jpg) are always\
    \ positive, so they don’t affect the sign of the expression. Therefore\n\n![image](Images/f0160-04.jpg)\n\
    \nThe classification criterion is simply this:\n\n![image](Images/f0160-05.jpg)\n\
    \nThe edge case ![image](Images/f0160-06.jpg) corresponds to the case where we’re\
    \ looking at the edge of a triangle head on—that is, when the camera and the triangle\
    \ are coplanar. We can classify this triangle either way without affecting the\
    \ result much, so we choose to classify it as back-facing to avoid dealing with\
    \ degenerate triangles.\n\nWhere do we get the normal vector from? It turns out\
    \ there’s a vector operation, the *cross product* ![image](Images/f0160-07.jpg),\
    \ that takes two vectors ![image](Images/f0160-08.jpg) and ![image](Images/f0160-09.jpg)\
    \ and produces a vector perpendicular to both (for a definition of this operation,\
    \ see the Linear Algebra appendix. In other words, the cross product of two vectors\
    \ on the surface of a triangle is a normal vector of that triangle. We can easily\
    \ get two vectors on the triangle by subtracting its vertices from each other.\
    \ So computing the direction of the normal vector of the triangle `ABC` is straightforward:\n\
    \n![image](Images/f0160-10.jpg)\n\nNote that “the direction of the normal vector”\
    \ is not the same as “the normal vector.” There are two reasons for this. The\
    \ first one is that ![image](Images/f0160-03a.jpg) isn’t necessarily equal to\
    \ `1`. This isn’t really important because normalizing ![image](Images/f0160-01.jpg)\
    \ would be trivial and because we only care about the sign of ![image](Images/f0160-11.jpg).\n\
    \nThe second reason is that if ![image](Images/f0160-01.jpg) is a normal vector\
    \ of `ABC`, so is ![image](Images/f0138-03a.jpg), and in this case we care deeply\
    \ about the direction ![image](Images/f0160-01.jpg) points in, because this is\
    \ exactly what lets us classify triangles as either front-facing or back-facing.\n\
    \nMoreover, the cross product is not commutative: ![image](Images/f0161-01.jpg).\n\
    \n### Summary\n\nIn this chapter, we made our renderer, which could previously\
    \ render wireframe objects, capable of rendering solid-looking objects. This is\
    \ more involved than just using FilledTriangle instead of WireframeTriangle, because\
    \ we need triangles close to the camera to obscure triangles further away.\n\n\
    The first idea we explored was to draw the triangles from back to front, but this\
    \ had a few drawbacks we discussed. A better idea is to work at the pixel level;\
    \ this idea led us to depth buffering, which produces correct results regardless\
    \ of the order in which we draw the triangles.\n\nWe finally explored an optional\
    \ but valuable technique that doesn’t change the correctness of the results, but\
    \ can save us from rendering approximately half of the triangles: back face culling.\
