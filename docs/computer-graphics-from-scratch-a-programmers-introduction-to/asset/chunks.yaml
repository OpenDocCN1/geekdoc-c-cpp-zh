  raw: 'This means that to clip the scene against a clipping volume, we just need
    to clip it in succession against each of the planes that define the clipping volume.
    Whatever geometry remains inside after clipping against one plane is then clipped
    against the remaining planes. After the scene has been clipped against all the
    planes, the geometry that remains is the result of clipping the scene against
    the clipping volume.


    Next we’ll take a look at how to clip the scene against each clipping plane.


    ### Clipping the Scene Against a Plane


    Consider a scene with multiple objects, each made of four triangles ([Figure 11-3](#ch11.xhtml_ch11fig3)).


    ![image](Images/11fig03.jpg)


    *Figure 11-3: A scene with three objects*


    The fewer operations we execute, the faster our renderer will be. We will clip
    the scene against a clipping plane as a sequence of stages. Each stage will attempt
    to classify as much geometry as possible as either *accepted* or *discarded*,
    depending on whether it’s inside or outside the half-space defined by the clipping
    plane (that is, the clipping volume of this plane). Whatever geometry can’t be
    classified moves on to the next stage, which will take a more detailed look at
    it.


    The first stage attempts to classify entire objects at once. If an object is completely
    inside the clipping volume, it’s accepted (green in [Figure 11-4](#ch11.xhtml_ch11fig4));
    if it’s completely outside, it’s discarded (red in [Figure 11-4](#ch11.xhtml_ch11fig4)).


    ![image](Images/11fig04.jpg)


    *Figure 11-4: Clipping at the object level. Green is accepted, red is discarded,
    and gray requires further processing.*


    If an object can’t be fully accepted or discarded, we move on to the next stage
    and classify each of its triangles independently. If a triangle is completely
    inside the clipping volume, it’s accepted; if it’s completely outside, it’s discarded
    (see [Figure 11-5](#ch11.xhtml_ch11fig5)).


    ![image](Images/11fig05.jpg)


    *Figure 11-5: Clipping at the triangle level. Each triangle of the rightmost object
    is either accepted, discarded, or requires further processing.*


    Finally, for each triangle that isn’t either accepted or discarded, we need to
    clip the triangle itself. The original triangle is removed, and either one or
    two new triangles are added to cover the part of the triangle that is inside the
    clipping volume (see [Figure 11-6](#ch11.xhtml_ch11fig6)).


    ![image](Images/11fig06.jpg)


    *Figure 11-6: Clipping at the vertex level. Each triangle that is partially inside
    the clipping volume is split into one or two triangles that are fully inside the
    clipping volume.*


    Now that we have a clear conceptual understanding of how clipping works, we’ll
    develop the math and algorithms to create a working implementation.


    ### Defining the Clipping Planes


    Let’s start with the equation of the projection plane *Z* = *d*, which we’ll use
    as a clipping plane. This equation is simple to visualize, but it’s not in the
    most convenient or general form for our purposes.


    The general equation for a 3D plane is *Ax* + *By* + *Cz* + *D* = 0, meaning a
    point *P* = (*x*, *y*, *z*) will satisfy that equation if and only if *P* is on
    the plane. If we group the coefficients (*A*, *B*, *C*) in a vector ![image](Images/f0160-01.jpg),
    we can rewrite the equation as ![image](Images/f0138-01.jpg).


    Note that if ![image](Images/f0138-01.jpg), then ![image](Images/f0138-01a.jpg)
    for any value of *k*. In particular, we can choose ![image](Images/f0138-01b.jpg),
    multiply the original equation, and get a new equation ![image](Images/f0138-02.jpg)
    where ![image](Images/f0138-03.jpg) is a unit vector. So any given plane can be
    represented by an equation ![image](Images/f0138-01.jpg), where ![image](Images/f0160-01.jpg)
    is a unit vector and *D* is a real number.


    This is a very convenient formulation: ![image](Images/f0160-01.jpg) happens to
    be the normal of the plane and –*D* is the *signed distance* from the origin to
    the plane. In fact, for any point *P*, ![image](Images/f0138-02a.jpg) is the signed
    distance from the plane to *P* ; *distance* = 0 is just the special case where
    *P* is contained in the plane.


    If ![image](Images/f0160-01.jpg) is the normal of a plane, so is ![image](Images/f0138-03a.jpg),
    so we choose ![image](Images/f0160-01.jpg) such that it points to “inside” the
    clipping volume. For the plane *Z* = *d*, we choose the normal (0,0,1), which
    points “forward” with respect to the camera. Since the point (0,0, *d*) is contained
    in the plane, it must satisfy the plane equation, and we can solve for *D*:


    ![image](Images/f0138-04.jpg)


    and from this we immediately get *D* = –*d*.


    We could have gotten *D* = –*d* directly from the original plane equation *Z*
    = *d* by rewriting it as *Z* – *d* = 0\. However, we can apply this general method
    to derive the equations of the rest of the clipping planes.


    We know all these additional planes have *D* = 0 (because they all go through
    the origin), so all we need to do is determine their normals. To make the math
    simple, we’ll choose a 90^∘ field of view (FOV), meaning the planes are at 45^∘.


    Consider the left clipping plane. The direction of its normal is (1,0,1) (that
    is, 45^∘ right and forward). The length of that vector is ![image](Images/f0138-05.jpg)
    so if we normalize it we get ![image](Images/f0138-06.jpg). Therefore the equation
    of the left clipping plane is


    ![image](Images/f0138-07.jpg)


    Similarly, the normals for the right, bottom, and top clipping planes are ![image](Images/f0138-08.jpg),
    ![image](Images/f0138-09.jpg), and ![image](Images/f0138-10.jpg) respectively.
    Computing the clipping planes for any arbitrary FOV would involve a little bit
    of trigonometry.


    In summary, our clipping volume is defined by the following five planes:


    ![image](Images/f0139-01.jpg)


    Let’s now take a detailed look at how to clip geometry against a plane.


    ### Clipping Whole Objects


    Suppose we put each model inside the smallest sphere that can contain it; we call
    that sphere the *bounding sphere* of the object. Computing this sphere is surprisingly
    more difficult than it seems, and it falls outside the scope of this book. But
    a rough approximation can be obtained by first computing the center of the sphere
    by averaging the coordinates of all the vertices in the model, and then defining
    the radius to be the distance from the center to the vertex that it’s farthest
    away from.


    In any case, let’s assume we know the center *C* and the radius *r* of a sphere
    that completely contains each model. [Figure 11-7](#ch11.xhtml_ch11fig7) shows
    a scene with a few objects and their bounding spheres.


    ![image](Images/11fig07.jpg)


    *Figure 11-7: A scene with a few objects and their bounding spheres*


    We can categorize the spatial relationship between this sphere and a plane as
    follows:


    **The sphere is completely in front of the plane.** In this case, the entire object
    is accepted; no further clipping is necessary against this plane (but it may still
    be clipped by a different plane). See [Figure 11-8](#ch11.xhtml_ch11fig8) for
    an example.


    ![image](Images/11fig08.jpg)


    *Figure 11-8: The green object is accepted.*


    **The sphere is completely behind the plane.** In this case, the entire object
    is discarded; no further clipping is necessary (no matter what the other planes
    are, no part of the object will ever be inside the clipping volume). See [Figure
    11-9](#ch11.xhtml_ch11fig9) for an example.


    ![image](Images/11fig09.jpg)


    *Figure 11-9: The red object is discarded.*


    **The plane intersects the sphere.** This doesn’t give us enough information to
    know whether any part of the object is inside the clipping volume; it may be completely
    inside, completely outside, or partially inside. It is necessary to proceed to
    the next step and clip the model triangle by triangle. See [Figure 11-10](#ch11.xhtml_ch11fig10)
    for an example.


    ![image](Images/11fig10.jpg)


    *Figure 11-10: The gray objects can’t be fully accepted or discarded.*'
