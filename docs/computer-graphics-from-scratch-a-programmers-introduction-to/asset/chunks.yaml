  trans: "\n成功！我们已经成功地将对象的几何 3D 表示转换为了从我们的合成摄像机观察到的 2D 表示！\n\n然而，我们的方法非常“工工细作”。它有许多局限性。如果我们想渲染*两个*立方体呢？难道我们需要复制大部分代码吗？如果我们想渲染除立方体以外的物体呢？如果我们想让用户从文件加载\
    \ 3D 模型呢？我们显然需要一种更数据驱动的方法来表示 3D 几何结构。\n\n## 总结\n\n在本章中，我们开发了从场景中的 3D 点到画布上 2D\
    \ 点的数学方法。由于透视投影的特性，我们可以立即将此扩展到线段的投影，然后扩展到 3D 物体。\n\n但我们还留下了两个重要问题尚未解决。首先，列表 9-1\
    \ 将透视投影逻辑与立方体的几何混合在了一起；这种方法显然不可扩展。其次，由于透视投影方程的局限性，它无法处理相机后面的物体。我们将在接下来的两个章节中解决这些问题。\n\
    \n# 10 描述与渲染场景\n\n![image](img/common.jpg)\n\n在过去的几个章节中，我们开发了算法，根据给定的 2D 坐标在画布上绘制\
    \ 2D 三角形，并探索了将场景中点的 3D 坐标转换为画布上点的 2D 坐标所需的数学知识。\n\n在上章结束时，我们拼凑出一个程序，同时使用这两种方法在\
    \ 2D 画布上渲染了一个 3D 立方体。在本章中，我们将形式化并扩展这项工作，目标是渲染包含任意数量对象的整个场景。\n\n## 表示立方体\n\n让我们再次思考如何表示和操作立方体，这次的目标是寻找一种更通用的方法。我们立方体的边长为\
    \ 2 个单位，与坐标轴平行，并以原点为中心，如图图 10-1\n\n*图 10-1：我们的标准立方体*\n\n这些是它的顶点的坐标：\n\n`A` = (1,1,1)\n\
    \n`B` = (–1,1,1)\n\n`C` = (–1,–1,1)\n\n`D` = (1,–1,1)\n\n`E` = (1,1,–1)\n\n`F`\
    \ = (–1,1,–1)\n\n`G` = (–1,–1,–1)\n\n`H` = (1,–1,–1)\n\n立方体的面是正方形，但我们开发的算法是基于三角形的。我们最初选择三角形的原因之一是任何其他多边形（包括正方形）都可以分解为三角形。因此，我们将用两个三角形表示立方体的每个正方形面。\n\
    \n然而，我们不能取立方体的*任意*三个顶点并期望它们描述其表面上的三角形（例如，ADG 在立方体内部）。这意味着顶点坐标本身并不能完全描述立方体：我们还需要知道哪一组三个顶点描述了构成其侧面的三角形。\n\
    \n这里是我们的立方体可能的三角形列表：\n\nA, B, C\n\nA, C, D\n\nE, A, D\n\nE, D, H\n\nF, E, H\n\n\
    F, H, G\n\nB, F, G\n\nB, G, C\n\nE, F, B\n\nE, B, A\n\nC, G, H\n\nC, H, D\n\n\
    这表明我们可以使用一种通用的结构来表示*任何*由三角形组成的物体：一个 `Vertices` 列表，存储每个顶点的坐标；以及一个 `Triangles` 列表，指定哪组三个顶点描述物体表面的三角形。\n\
    \n`Triangles` 列表中的每项可能都包含构成它的顶点之外的额外信息；例如，这是指定每个三角形颜色的理想位置。\n\n由于存储这些信息最自然的方式是使用两个列表，我们将使用列表索引来引用顶点列表中的顶点。因此，我们的立方体表示如下：\n\
    \nVertices\n0 = ( 1,  1,  1)\n1 = (-1,  1,  1)\n2 = (-1, -1,  1)\n3 = ( 1, -1,\
    \  1)\n4 = ( 1,  1, -1)\n5 = (-1,  1, -1)\n6 = (-1, -1, -1)\n7 = ( 1, -1, -1)\n\
    \nTriangles\n0 = 0, 1, 2, red\n1 = 0, 2, 3, red\n2 = 4, 0, 3, green\n3 = 4, 3,\
    \ 7, green\n4 = 5, 4, 7, blue\n5 = 5, 7, 6, blue\n6 = 1, 5, 6, yellow\n7 = 1,\
    \ 6, 2, yellow\n8 = 4, 5, 1, purple\n9 = 4, 1, 0, purple\n10 = 2, 6, cyan\n11\
