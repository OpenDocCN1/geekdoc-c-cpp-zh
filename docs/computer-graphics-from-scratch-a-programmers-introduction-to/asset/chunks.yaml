- fmt: "\nIn this particular case, we’d have gotten the correct result regardless\
    \ of the values of `Z`, because the points happened to come in a convenient order.\
    \ But what if we wanted to paint `P[1]` first and `P[2]` second? We first paint\
    \ the pixel blue and store `Z[P*1]`; but when we want to paint `P[2]`, we see\
    \ that `Z[P*2] > Z[P*1]`, so we *don’t* paint it—because if we did, `P[1]` would\
    \ be covered by `P[2]`, which is farther away! We get a blue pixel again, which\
    \ is the correct result.\n\nIn terms of implementation, we need a buffer to store\
    \ the `Z` coordinate of every pixel on the canvas; we call this the `depth buffer`.\
    \ It has the same dimensions as the canvas, but its elements are real numbers\
    \ representing depth values, not pixels.\n\nBut where do the `Z` values come from?\
    \ These should be the `Z` values of the points after they’re transformed but before\
    \ they’re perspective-projected. However, this only gives us `Z` values for vertices;\
    \ we need a `Z` value for every pixel of every triangle.\n\nHere is yet another\
    \ application of the attribute-mapping algorithm we developed in [Chapter 8](#ch08.xhtml_ch08).\
    \ Why not use `Z` as the attribute and interpolate it across the face of the triangle,\
    \ just like we did before with color-intensity values? By now you know how to\
    \ do it: take the values of `z0`, `z1`, and `z2`; compute `z01`, `z02`, and `z012`;\
    \ combine them to get `z_left` and `z_right`; then, for each horizontal segment,\
    \ compute `z_segment`. Finally, instead of blindly calling `PutPixel(x, y, color)`,\
    \ we do this:\n\n```\nz = z_segment[x - xl]\n\nif (z < depth_buffer[x][y]) {\n\
    \    canvas.PutPixel(x, y, color)\n    depth_buffer[x][y] = z\n}\n```\n\nFor this\
    \ to work correctly, every entry in `depth_buffer` should be initialized to `+∞`\
    \ (or just “a very big value”). This guarantees that the first time we want to\
    \ draw a pixel, the condition will be true, because any point in the scene is\
    \ closer to the camera than a point infinitely far away.\n\nThe results we get\
    \ now are much better—check out [Figure 12-4](#ch12.xhtml_ch12fig4).\n\n![image](Images/12fig04.jpg)\n\
    \n*Figure 12-4: The cubes now look like cubes, regardless of the ordering of their\
    \ triangles.*\n\nYou can find a live implementation of this algorithm at [https://gabrielgambetta.com/cgfs/depth-demo](https://gabrielgambetta.com/cgfs/depth-demo).\n\
    \n### Using 1/Z instead of Z\n\nThe results look much better, but what we’re doing\
    \ is subtly wrong. The values of `Z` for the vertices are correct (they come from\
    \ data, after all), but in most cases the the linearly interpolated values of\
    \ `Z` for the rest of the pixels are incorrect. This might not even result in\
    \ a visible difference at this point, but it would become an issue later.\n\n\
    To see how the values are wrong, consider the simple case of a line segment from\
    \ `A(–1,0,2)` to `B(1,0,10)`, with its midpoint `M` at (0,0,6). Specifically,\
    \ because `M` is the midpoint of `AB`, we know that `M[z] = (A[z] + B[z])/2 =\
    \ 6`. [Figure 12-5](#ch12.xhtml_ch12fig5) shows this line segment.\n\n![image](Images/12fig05.jpg)\n\
    \n*Figure 12-5: A line segment AB and its midpoint M*\n\nLet’s compute the projection\
    \ of these points with `d = 1`. Applying the perspective projection equations,\
    \ we get ![image](Images/f0154-01.jpg). Similarly, ![image](Images/f0154-02.jpg).\
    \ and ![image](Images/f0154-03.jpg). [Figure 12-6](#ch12.xhtml_ch12fig6) shows\
    \ the projected points.\n\n![image](Images/12fig06.jpg)\n\n*Figure 12-6: The points\
    \ A, B, and M projected onto the projection plane*\n\n`A′B′` is a horizontal segment\
    \ on the viewport. We know the values of `A[z]` and `B[z]`. Let’s see what happens\
    \ if we try to compute the value of `M[z]` using linear interpolation. The implied\
    \ linear function looks like [Figure 12-7](#ch12.xhtml_ch12fig7).\n\n![image](Images/12fig07.jpg)\n\
    \n*Figure 12-7: The values of A[z] and B[z] for A[x'] and B[x'] define a linear\
    \ function z = f(x’).*\n\nThe slope of the function is constant, so we can write\n\
    \n![image](Images/f0155-01.jpg)\n\nWe can manipulate that expression to solve\
    \ for `M[z]`:\n\n![image](Images/f0155-02.jpg)\n\nIf we plug in the values we\
    \ know and do some arithmetic, we get\n\n![image](Images/f0155-03.jpg)\n\nThis\
    \ says that the value of `M[z]` is 8.666, but we know for a fact it’s actually\
    \ 6!\n\nWhere did we go wrong? We’re using linear interpolation, which we know\
    \ works well, and we’re feeding it the correct values, which come from data, so\
    \ why is the result wrong?\n\nOur mistake is hidden in the implicit assumption\
    \ we make when we use linear interpolation: that the function we are interpolating\
    \ is linear to begin with! In this case, it turns out it isn’t.\n\nIf `Z = f (x',\
    \ y')` was a linear function of `x'` and `y'`, we could write it as `Z = Ax′ +\
    \ By′ + C` for some values of `A`, `B`, and `C`. This kind of function has the\
