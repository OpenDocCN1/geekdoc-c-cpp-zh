    我是 Google 的一名高级软件工程师。过去，我曾在 Improbable（[`improbable.io`](http://improbable.io)）工作过，他们非常有机会实现现实版的“黑客帝国”（或至少能彻底改变多人游戏开发模式），还曾在
    Mystery Studio（[`mysterystudio.com`](http://mysterystudio.com)）工作过，那是我创立并运营了大约十年的游戏开发公司，发布了近
    20 款你可能从未听说过的游戏。


    我在大学教过五年的计算机图形学，那是一门为期一个学期的大三课程。我感谢所有的学生，他们是这些激发本书灵感的素材的无意间的“小白鼠”。


    除了计算机图形学，我还有其他兴趣，包括工程相关及其他。请访问我的网站（[`gabrielgambetta.com`](http://gabrielgambetta.com））获取更多详情和联系方式。


    # 1. 基础概念


    ![image](img/common.jpg)


    光线追踪器和光栅化器在将 3D 场景渲染到 2D 屏幕上采用了截然不同的方法。然而，这两种方法都有几个共同的基础性概念。


    在本章中，我们将探索画布（canvas），即我们渲染图像的抽象表面；我们用于引用画布上像素的坐标系；如何表示和处理颜色；以及如何描述 3D 场景以便我们的渲染器对其进行处理。


    ## 画布


    在整本书中，我们将在一个 `canvas` 上绘制内容：这是一个矩形的像素数组，可以对每个像素单独上色。画布是显示在屏幕上还是打印在纸上与我们的目标并无。我们的目标是在
    2D 画布上表示 3D 场景，因此我们将专注于渲染到这个抽象的矩形像素数组中。


    我们将书中的所有内容都基于一个单一且非常简单的函数构建，该函数为画布上的某个像素分配颜色：


    ```

    canvas.PutPixel(x, y, color)

    ```


    该方法有三个参数：x 坐标、y 坐标和颜色。我们先关注坐标。


    ### 坐标系


    画布有宽度和高度，以像素为单位，我们称其为 `C[w]` 和 `C[h]`。我们需要一个坐标系来引用它的像素。对于大多数计算机屏幕，原点位于左上角；`x`
    向屏幕右侧增加，`y` 向底部增加，如图 1-1。


    ![image](img/01fig01.jpg)


    *图 1-1：大多数计算机屏幕使用的坐标系*


    由于视频内存的组织方式，这种坐标系对计算机来说非常自然，但对人类操作来说并不自然。相反，3D 图形程序员倾向于使用通常在纸上画图的坐标系：原点位于中心，`x`
    向右增加向左减小，而 `y` 向上增加向下减小，如图 1-2。


    ![image](img/01fig02.jpg)


    *图 1-2：我们将为画布使用的坐标系*


    使用这种坐标系，`x` 坐标的范围是 ![Images](img/e0003-01.jpg)，`y` 坐标的范围是 ![Images](img/e0003-02.jpg)。假设在使用这些范围之外的坐标使用
    `PutPixel` 函数时什么都不会发生。


    在我们的示例中，画布将绘制在屏幕上，因此我们需要从一个坐标系转换为另一个。为了做到这一点，我们需要更改坐标系的中心，并反转 `Y` 轴的方向。得到的转换方程为：


    ![image](img/e0003-03.jpg)


    我们将假设 `PutPixel` 会自动完成这种转换；从现在起，我们可以认为画布的坐标原点位于中心，`x` 向右增加，`y` 向屏幕顶部增加。


    让我们来看看 `PutPixel` 的剩余参数：颜色。


    ### 颜色模型


    关于颜色工作原理的理论非常迷，但它超出了本书的范围。以下是与我们相关的方面的简化简版本。


    当光击中我们的眼睛时，它会刺激眼睛后部的光敏细胞。这些细胞产生取决于入射光波长的脑信号。我们将这些脑信号的主观体验称为`颜色`。


    我们通常无法看到`visible range` 之外的波长。波长和频率是反比关系（波撞击得越频繁，波峰之间的距离就越小）。这就是为什么红外线（波长大于 740
    nm，对应频率低于 405 太赫兹 [THz]）是害的，但紫外线（波长小于 380 nm，对应频率高于 790 THz）会灼伤皮肤。


    可以想象的每种颜色都可以描述为这些颜色的不同组合。“白色”是所有颜色的和，而“黑色”是任何颜色的缺失。通过描述颜色所组成的精确波长来描述颜色是不现实的；幸运的是，可以通过仅三种颜色（我们称之为`原色`）的线性组合来创建几乎所有的颜色。


    #### 减法混色模型


    `subtractive color model`（减法混色模型）是一个高级的名字，指的是你用蜡笔笔做的事情。你有一张白纸和红、蓝、黄。你画一个黄色圆，然后重叠一个蓝色圆，你就得到了绿色！红和蓝——紫色！（*注：此处原文逻辑似乎有误或为示例描述，已按意翻译*）。将这三种混合在一起——某种深色的颜色！这难道不神奇吗？图
    1-3 显示了原色及其组合


    物体之所以颜色不同，是因为它们吸收和反射光的方式不同。让我们从白光开始（阳光并不完全白，但对于我们的目的已经足够）。白光包含所有波长的光。当光击中物体时，物体表面吸收某些波长并反射其他波长。反射光进入我们的眼睛，我们的大脑将其转换为颜色。什么颜色？被表面反射的波长的和。


    所以蜡笔是怎么回事？你从纸上反射的光光开始。因为是白纸，它反射它接收的大部分光。当你用“黄色”蜡笔画时，你是在添加一层材料，它吸收某些波长但让其他波长通过。它们被纸反射，再次通过黄色层，击中你的眼睛，你的大脑将特定的波长组合解释为“黄色”。黄色层的作用是从原始光中`减去`大量的波长。


    你可以将每个彩色圆看作过滤器：当你把蓝色圆叠加时，你过滤掉了更多的波长，所以看到的是未被蓝色或黄色过滤掉的波长，你的大脑将其视为“绿色”。


    总之，我们从所有波长开始，减去某种量的原色来创建任何其他颜色。这种颜色模型的名称源于我们通过减去波长来创建颜色的事实。


    然而，这个模型并不完全正确。减法模型中的实际原色并不是教给幼儿和艺术学生的蓝、红、黄，而是青、品红和黄。此外，混合三种原色会产生某种不完全黑的深色，因此加入了纯黑色作为第四种“原色”。因为
    B 表示蓝色，所以黑色用 K 表示，因此我们得到了 `CMYK 颜色模型`（图 1-4）。


