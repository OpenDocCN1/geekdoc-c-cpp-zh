    When a point of a surface is in shadow because there is another object in the
    way, it’s quite likely that the point right next to it will also be in the shadow
    of the same object (this is called `shadow_coherence`). You can see an example
    of this in [Figure 5-2](#ch05.xhtml_ch5fig2).


    ![image](Images/05fig02.jpg)


    *Figure 5-2: Points that are close together are likely to be in the shadow of
    the same object.*


    When searching for objects between the point and the light, to determine whether
    the point is in shadow, we’d normally check for intersections with every other
    object. However, if we know that the point immediately next to it is in the shadow
    of a specific object, we can check for intersections with that object first. If
    we find one, we’re done and we don’t need to check every other object! If we don’t
    find intersections with that object, we just revert to checking every object.


    In the same vein, when looking for ray-object intersections to determine whether
    a point is in shadow, you don’t really need the `closest` intersection; it’s enough
    to know that there’s `at least one` intersection, because that will be enough
    to stop the light from reaching the point! So you can write a specialized version
    of `ClosestIntersection` that returns as soon as it finds `any` intersection.
    You also don’t need to compute and return `closest_t`; instead, you can return
    just a `Boolean` value.


    ### Spatial Structures


    Computing the intersection of a ray with every sphere in the scene is somewhat
    wasteful. There are many data structures that let you discard entire groups of
    objects at once without having to compute the intersections individually.


    Suppose you have several spheres close to each other. You can compute the center
    and radius of the smallest sphere that contains all these spheres. If a ray doesn’t
    intersect this `bounding sphere`, you can be sure that it doesn’t intersect any
    of the spheres it contains, at the cost of a single intersection test. Of course,
    if it does, you still need to check whether it intersects any of the spheres it
    contains.


    You could go further and have several levels of bounding spheres (that is, groups
    of groups of spheres), forming a hierarchy that needs to be traversed all the
    way to the bottom only when there’s a good chance that one of the actual spheres
    will be intersected by a ray.


    While the exact details of this family of techniques are outside the scope of
    this book, you can find more information under the name `bounding volume` `hierarchy`.


    ### Subsampling


    Here’s an easy way to make your raytracer `N` times faster: compute `N` times
    fewer pixels!


    For each pixel in the canvas, we trace one ray through the viewport to `sample`
    the color of the light coming from that direction. If we had fewer rays than pixels,
    we’d be `subsampling` the scene. But how can we do this and still render the scene
    correctly?


    Suppose you trace the rays for the pixels (10, 100) and (12, 100), and they happen
    to hit the same object. You can reasonably assume that the ray for the pixel (11,
    100) will also hit the same object, so you can skip the initial search for intersections
    with all the objects in the scene and jump straight to computing the color at
    that point.


    If you skip every other pixel in both the horizontal and vertical directions,
    you could be doing up to 75 percent fewer primary ray-scene intersection computations—that’s
    a 4x speedup!


    Of course, you may well miss a very thin object; this is an “impure” optimization,
    in the sense that, unlike the ones discussed before, it results in an image that
    closely resembles, but is not guaranteed to be identical to, the image without
    the optimization. In a way, it’s “cheating” by cutting corners. The trick is to
    know what corners can be cut while maintaining satisfactory results; in many areas
    of computer graphics, what matters is the subjective quality of the results.


    ### Supporting Other Primitives


    In the previous chapters, we’ve used spheres as primitives because they’re mathematically
    easy to manipulate; that is, the equations to find the intersections between rays
    and spheres are relatively simple. But once you have a basic raytracer than can
    render spheres, adding support to render other primitives doesn’t require much
    additional work.


    Note that `TraceRay` needs to be able to compute just two things for a ray and
    any given object: the value of `t` for the closest intersection between them and
    the normal at that intersection. Everything else in the raytracer is object-independent!


    Triangles are a good primitive to support. A triangle is the simplest possible
    polygon, so you can build any other polygon out of triangles. They’re mathematically
    easy to manipulate, so they’re a good way to represent approximations of more
    complex surfaces.


    To add triangle support to the raytracer, you only need to change `TraceRay`.
    First, you compute the intersection between the ray (given by its origin and direction)
    and the plane that contains the triangle (given by its normal and its distance
    from the origin).


    Since planes are infinitely big, rays will almost always intersect any given plane
    (except if they’re exactly parallel). So the second step is to determine whether
    the ray-plane intersection is actually inside the triangle. There are many ways
    to do this, including using barycentric coordinates or using cross-products to
    check whether the point is “on the inside” with respect to each of the three sides
    of the triangle.


    Once you have determined that the point is inside the triangle, the normal at
    the intersection is just the normal of the plane. Have `TraceRay` return the appropriate
    values and no further changes will be required!


    ### Constructive Solid Geometry


    Suppose we want to render objects more complicated than spheres or curved objects
    that are difficult to model accurately using a set of triangles. Two good examples
    are lenses (like the ones in magnifying glasses) and the Death Star (that’s no
    moon . . ).


    We can easily describe these objects in plain language. A magnifying glass looks
    like two slices of a sphere glued together; the Death Star looks like a sphere
    with a smaller sphere taken out of it.


    We can express this more formally as the result of applying set operations (such
    as union, intersection, or difference) to other objects. Continuing with our examples
    above, a lens can be described as the intersection of two spheres and the Death
    Star as a big sphere from which we subtract a smaller sphere (see [Figure 5-3](#ch05.xhtml_ch5fig3)).


    ![image](Images/05fig03.jpg)


    *Figure 5-3: Constructive solid geometry in action.* A ∩ B *gives us a lens.*
    C – D *gives us the Death Star.*


    You might be thinking that computing Boolean operations of solid objects is a
    very tricky geometrical problem. And you’d be completely correct! Fortunately,
    it turns out that `constructive solid geometry` lets us render the results of
    set operations between objects without ever having to explicitly compute these
    results!


    How can we do this in our raytracer? For every object, you can compute the points
    where the ray enters and exits the object; in the case of a sphere, for example,
    the ray enters at `min(t[1], t[2])` and exits at `max(t[1], t[2])`. Suppose you
    want to compute the intersection of two spheres; the ray is inside the intersection
    when it’s inside *both* spheres, and it’s outside when it’s outside *either* sphere.
    In the case of the subtraction, the ray is inside when it’s inside the first object
    but not the second one. For the union of two objects, the ray is inside when it’s
    inside either of the objects.

