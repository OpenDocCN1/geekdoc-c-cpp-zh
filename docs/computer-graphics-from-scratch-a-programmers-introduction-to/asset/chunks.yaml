    The order of the chapters in the book is not the order of operations in the rendering
    pipeline; as explained in the introduction, the chapters are ordered in such a
    way that visible progress is reached as quickly as possible.


    Clipping is a 3D operation; it takes 3D objects in the scene and generates a new
    set of 3D objects in the scene or, more precisely, it computes the intersection
    of the scene and the clipping volume. For this reason, clipping must happen after
    objects have been placed in the scene (that is, using the vertices after the model
    and camera transforms) but before perspective projection.


    The techniques presented in this chapter work reliably, but are very generic.
    The more prior knowledge you have about your scene, the more efficient your clipping
    can be. For example, many games pre-process their levels by adding visibility
    information to them; if you can divide a scene into “rooms,” you can make a table
    listing what rooms are visible from any given room. When rendering the scene later,
    you just need to figure out what room the camera is in, and you can safely ignore
    all the rooms marked as “non-visible” from there, saving considerable resources
    during rendering. The trade-off is, of course, more pre-processing time and a
    more rigid scene. If you’re interested in this topic, read about BSP partitioning
    and portal systems.


    ## Summary


    In this chapter, we finally lifted one of the main limitations caused by the perspective
    projection equation. We’ve overcome the limitation that only vertices in front
    of the camera can be meaningfully projected. In order to do this, we came up with
    a precise definition of what “being in front of the camera” means: whatever is
    inside a clipping volume we define with five planes.


    Then we developed the equations and algorithms to compute the geometrical intersection
    between the scene and the clipping volume. As a consequence, we can take an entire
    scene and remove everything that can’t possibly be projected onto the viewport.
    This not only avoids the cases that can’t be handled by the perspective projection
    equations, it also saves computation resources by removing geometry that would
    be projected outside of the viewport.


    However, after clipping a scene, we might still end up with geometry that could
    be visible in the final canvas, but which will not, most likely because there’s
    something else in front of it! We’ll find ways to deal with this in the next chapter.


    ## 12 HIDDEN SURFACE REMOVAL


    ![image](Images/common.jpg)


    We can now render any scene from any point of view, but the resulting image is
    visually simple: we’re rendering objects in wireframe, giving the impression that
    we’re looking at the blueprint of a set of objects, not at the objects themselves.


    The remaining chapters of this book focus on improving the visual quality of the
    rendered scene. By the end of this chapter, we’ll be able to render objects that
    look solid (as opposed to wireframe). We already developed an algorithm to draw
    filled triangles, but as we will see, using that algorithm correctly in a 3D scene
    is not as simple as it might seem!


    ### Rendering Solid Objects


    The first idea that comes to mind when we want to make solid objects look solid
    is to use the function `DrawFilledTriangle` that we developed in [Chapter 7](#ch07.xhtml_ch07)
    to draw each triangle of the objects using a random color ([Figure 12-1](#ch12.xhtml_ch12fig1)).


    ![image](Images/12fig01.jpg)


    *Figure 12-1: Using `DrawFilledTriangle` instead of `DrawWireframeTriangle` doesn’t
    produce the results we expect.*


    The shapes in [Figure 12-1](#ch12.xhtml_ch12fig1) don’t quite look like cubes,
    do they? If you look closely, you’ll see what the problem is: parts of the back
    faces of the cube are drawn on top of the front faces! This is because we’re blindly
    drawing 2D triangles on the canvas in a “random order” or, more precisely, in
    the order they happen to be defined in the `Triangles` list of the model, without
    taking into account the spatial relationships between them.


    You might be tempted to go back to the model definition and change the order of
    the triangles to fix this problem. However, if our scene includes another instance
    of the cube that is rotated 180°,, we’d go back to the original problem. In short,
    there’s no single “correct” triangle order that will work for every instance and
    camera orientation. What should we do?


    ### Painter’s Algorithm


    A first solution to this problem is known as the painter’s algorithm. Real-life
    painters draw backgrounds first, and then cover parts of them with foreground
    objects. We could achieve the same effect by drawing all the triangles in the
    scene back to front. To do so, we’d apply the model and camera transforms and
    sort the triangles according to their distance to the camera.


    This works around the “no single correct order” problem explained above, because
    now we’re looking for a correct ordering for a specific relative position of the
    objects and the camera.


    Although this would indeed draw the triangles in the correct order, it has some
    drawbacks that make it impractical.


    First, it doesn’t scale well. The most efficient sorting algorithm known to humans
    is `O(n * log(n))`, which means the runtime more than doubles if we double the
    number of triangles. (To illustrate, sorting 100 triangles would take approximately
    200 operations; sorting 200 triangles would take 460, not 400; and sorting 800
    triangles would take 2,322 operations, not 1,840!) In other words, this works
    for small scenes, but it quickly becomes a performance bottleneck as the complexity
    of the scene.


    Second, it requires us to know the whole list of triangles at once. This requires
    a lot of memory and stops us from using a stream-like approach. We want our renderer
    to be like a pipeline, where model triangles enter on one end and pixels come
    out the other, but this algorithm doesn’t start drawing pixels until every triangle
    has been sorted.


    Third, even if we’d be willing to live with these limitations, there are cases
    where a correct ordering just doesn’t exist. Consider the case in [Figure 12-2](#ch12.xhtml_ch12fig2).
    We will never be able to sort these triangles in a way that produces the results.


    ![image](Images/12fig02.jpg)


    *Figure 12-2: There is no way to sort these triangles “back-to-front.”*


    ### Depth Buffering


    We can’t solve the ordering problem at the triangle level, so let’s try to solve
    it at the pixel level.


    For each pixel on the canvas, we want to paint it the “correct” color, where the
    “correct” color is the color of the object that is closest to the camera. In [Figure
    12-3](#ch12.xhtml_ch12fig3), that’s `P1`.


    ![image](Images/12fig03.jpg)


    *Figure 12-3: Both `P1` and `P2` project to the same `P''` on the canvas. Because
    `P1` is closer to the camera than `P2`, we want to paint `P''` the color of `P1`.*


    At any time during rendering, each pixel on the canvas represents one point in
    the scene (before we draw anything, it represents a point infinitely away). Suppose
    that for each pixel on the canvas, we kept the `Z` coordinate of the point it
    currently represents. When we need to decide whether to paint a pixel with the
    color of an object, we will do it only if the `Z` coordinate of the point we’re
    about to paint is smaller than the `Z` coordinate of the point that is already
    there. This guarantees that a pixel representing a point in the scene is never
    drawn over by a pixel representing a point that is farther away from the camera.


    Let’s go back to [Figure 12-3](#ch12.xhtml_ch12fig3). Suppose that because of
    the order of the triangles in a model, we want to paint `P2` first and `P1` second.
    When we paint `P2`, the pixel is painted red, and its associated `Z` value becomes
    `ZP2`. Then we want to paint `P1`, and since `ZP2 > ZP1`, we paint the pixel blue
    and we get the correct result.

