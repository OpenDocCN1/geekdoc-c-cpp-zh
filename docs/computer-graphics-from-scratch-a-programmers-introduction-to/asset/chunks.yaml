    致我的父亲（1947–2007），一位建筑师和自学程序员，是他带我走这条道路。


    ![Image](img/f000v-01.jpg)

    *我的父亲，两半岁的我，以及 ZX81 。*


    ![Image](img/f000v-02.jpg)

    *我最早的有记录的程序，六岁半岁时编写，在我的 ZX Spectrum+ 屏幕上画了几条线。*


    ## 关于作者

    Gabriel Gambetta 在 5 岁左右开始在 ZX Spectrum 上编写游戏。在他出生地乌乌拉圭学习计算机科学并在当地一家声誉良好的公司工作后，他创了一家游戏开发公司并运营了
    10 年，同时在母校教授计算机图形学。最近，Gambetta 自 2011 年起一直在苏黎世的 Google 工作，期间曾在伦敦的多人游戏技术独角兽 Improbable
    担任过早期工程师，并在马德里过了一年的表演和电影制作。


    ## 关于技术评审员

    Alejandro Segovia Azapian 是一位拥有 14 年以上计算机图形学经验的软件工程师。他曾在 3D 图形领域的多个领先公司工作过，包括
    Autodesk、Electronic Arts、PDI/ DreamWorks 和 WB Games，涵盖了应用程序、游戏、游戏引擎和框架等各种实时图形项目。Alejandro
    目前在位于加州库比蒂诺的一家领先消费电子公司的 GPU 软件组工作。


