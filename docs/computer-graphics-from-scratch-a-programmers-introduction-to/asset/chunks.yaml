    相反，我们将“反向”考虑光线：我们从从相机发射的光线开始，经过视口中的一点，并追踪它的路径直到它击中场景中的某个物体。这个物体就是相机通过视口该点“看到”的东西。因此，作为初步近似，我们只需将物体的颜色视为“通过该点的光线的颜色”，如图图
    2-5 所示。


    ![image](img/02fig05.jpg)


    *图 2-5：视口中的一个小正方形，代表画布上的单个像素，用相机通过该点看到的物体颜色进行绘制*


    现在我们只需要一些方程。


    ### 射线方程


    对于我们的目的来说，表示射线的最方便的方法是使用参数方程。我们知道射线通过点 `O`，并且知道它的方向（从 `O` 到 `V`），因此我们可以将射线上的任意点
    `P` 表示为：


    `P = O + t(V – O)`


    其中 `t` 是任意实数。通过将从 `–∞` 到 `+∞` 的每一个 `t` 值代入此方程，我们就得到了射线沿线的每一个点 `P`。


    我们将 `(V – O)` 称为射线的方向，![Images](img/darr.jpg)。方程变为：


    ![Images](img/e0019-01.jpg)


    理解这个方程的一种直观方法是：我们从原点 (`O`) 开始射线，并沿着射线的方向 (![Images](img/darr.jpg)) “前进”一段距离 (`t`)；很很容易看出这包含了射线沿线的所有点。你可以在线性代数附录中阅读更多关于这些向量操作的详细信息。图
    2-6 展示了我们方程的运作。


    ![image](img/02fig06.jpg)


    *图 2-6：不同 `t` 值对应的射线上的一些点 ![Images](img/e0019-02.jpg)。*


    图 2-6 显示了对应于 `t = 0.5` 和 `t = 1.0` 的射线上的点。每一个 `t` 值都会产生射线上的一个不同点。


    ### 球体方程


    现在我们需要在场景中有一个某种物体，以便我们的射线可以击中*某些东西*。我们可以选择任何任意几何基元作为场景的构建模块；对于光线追踪，我们将使用球体，因为它们很容易用方程进行操作。


    什么是球体？球体是距离固定点距离相等的点集。该距离被称为球的 `radius`（半径），该点被称为球的 `center`（球心）。图 2-7 显示了一个由其中心
    `C` 和半径 `r` 定义的球体。


    ![image](img/02fig07.jpg)


    *图 2-7：由中心和半径定义的球体*


    根据我们上面的定义，如果 `C` 是球心 `r` 是半径，那么球表面的点 `P` 必须满足以下方程：


    `distance(P, C) = r`


    让我们来玩玩这个方程。如果你发现这些数学知识很陌生，请通读线性代数附录。


    `P` 和 `C` 之间的距离是从 `P` 到 `C` 的向量的长度：


    `|P – C| = r`


    向量的长度（用 ![Images](img/e0020-01.jpg) 表示）是与其自身点积的平方根（用 ![Images](img/e0020-02.jpg)
    表示）：


    ![Images](img/e0020-03.jpg)


    为了消除平方根，我们可以两边平方：


    `⟨P – C, P – C⟩ = r²`


    所有这些球体方程的表示形式都是等价的，但最后一种在后续步骤中操作起来最方便。


    ### 射线相交球体


    我们现在有两个方程：一个描述球体上的点，另一个描述射线上的点：


    `⟨P – C, P – C⟩ = r²`


    ![Images](img/e0020-04.jpg)


    射线和球体相交吗？如果是，相交在哪里？


    假设射线和球体在点 `P` 相交。这个点既在射线上又在球面上，因此它必须同时满足这两个方程。注意，这些方程中唯一的变量是参数 `t`，因为 `O`、![Images](img/darr.jpg)、`C`
    和 `r` 是给定的，而 `P` 是我们要找的点。


    由于 `P` 在两个方程中代表同一个点，我们可以将第一个方程中的 `P` 替换为第二个方程中 `P` 的表达式。这得到了：


    ![image](img/e0021-01.jpg)


    如果我们找到满足此方程的 `t` 值，就可以把它们放入射线方程中，找到射线与球体相交的点。


    目前的形式，方程有点臃肿。让我们进行一些代数运算，看看从中得到什么。


    首先，令 ![Images](img/e0021-02.jpg)。然后可以将方程写为：


    ![image](img/e0021-03.jpg)


    然后我们利用分配律将点积展开为它的分量（再次，欢迎查阅线性代数附录）：


    ![image](img/e0021-04.jpg)


    稍微重排项，我们得到：


    ![image](img/e0021-05.jpg)


    将参数 `t` 移出点积并将 `r²` 移到方程的另一侧，我们得到：


    ![image](img/e0021-06.jpg)


    记住两个向量的点积是一个实数，所以角括号之间的每一项都是实数。如果给它们命名，我们将得到一个熟悉多的东西：


    ![image](img/e0021-07.jpg)


    这无非是一个老旧的二次方程：


    ![image](img/e0021.jpg)


    幸运的是，这符合几何意义。根据判别式 `b² – 4ac`，二次方程可以无、一个解或两个解（图 2-8）。


    ![image](img/02fig08.jpg)


    *图 2-8：解的几何解释*


    ### 渲染我们的第一个球体


    总结，对于画布上的每个像素，我们可以计算对应的视口点。给定相机的位置，我们可以表示从相机开始并经过该点的射线方程。给定一个球体，我们可以计算射线与该球体的交点。


    因此，我们只需要计算射线与每个球体的交点，保留离相机最近的一个，并用相应的颜色绘制像素。我们几乎准备好渲染我们的第一个球体了！


    不过，参数 `t` 值得额外的关注。让我们回到射线方程：


    `P = O + t(V – O)`


    由于射线的起点和方向是固定的，遍历所有实数 `t` 将产生射线上的每一个点 `P`。注意当 `t = 0` 时得到 `P = O`，当 `t = 1` 时得到
    `P = V`。`t` 的负值产生相反方向的点——即相机后面的。因此，我们可以将参数空间分为三部分，如表 2-1 所示。图 2-9 显示了参数空间的示意图。


    **表 2-1：** 参数空间的划分


    | `t` < 0 | 相机后 |


    | 0 < `t` < 1 | 在相机和投影平面/视口之间 |


    | `t` > 1 | 在投影平面/视口前方 |


    ![image](img/02fig09.jpg)


    *图 2-9：参数空间中的一些点*

