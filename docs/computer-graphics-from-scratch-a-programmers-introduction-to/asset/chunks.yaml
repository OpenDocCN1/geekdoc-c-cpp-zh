    \ 0, 4)\n    radius = 1\n    color = (0, 255, 0)  # 绿色\n    specular = 10  # 有些光泽\n\
    }\n\nsphere {\n    center = (0, -5001, 0)\n    radius = 5000\n    color = (255,\
    \ 255, 0)  # 黄色\n    specular = 1000  # 非常光泽\n}\n```\n\n这是之前相同的场景，只是在球体定义中增加了高光指数。\n\
    \n在代码层面，我们需要修改 `ComputeLighting` 以在需要时计算高光项，并将其添加到总光照中。注意，该函数现在需要 ![Images](img/varr.jpg)\
    \ 和 `s`，正如你在 Listing 3-2 中所示。\n\n```python\nComputeLighting(P, N, V, s) {\n  \
    \  i = 0.0\n    for light in scene.Lights {\n        if light.type == ambient\
    \ {\n            i += light.intensity\n        } else {\n            if light.type\
