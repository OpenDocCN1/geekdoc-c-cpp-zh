  trans: "\n\n在第 3 章中，我们学习了关于光照的所有知识。我们可以定义环境光、点光源和方向光，并且给定场景中任意一点的位置和该点的表面法线，就可以计算该点的光照：\n\
    \n![image](img/f0164-01.jpg)\n\n这个光照方程表达了光线如何照亮场景中的一点。它在我们的光线追踪器中的工作方式与光栅化器中的工作方式完全相同。\n\
    \n更有趣的部分是本章将探讨的如何将我们开发的“点光照”算法扩展为“三角形每个点的光照”算法。\n\n#### 平面着色 (Flat Shading)\n\n\
    让我们从简单的开始。既然我们可以计算某点的光照，就可以选取三角形中的任意一点（例如它的中心），计算该点的光照，并用它为整个三角形进行着色。要执行实际着色，我们可以将三角形的颜色乘以光照值。图\
    \ 13-1 显示了结果。\n\n![image](img/13fig01.jpg)\n\n*图 13-1：在平面着色中，我们计算三角形中心的光照并将其用于整个三角形。*\n\
    \n结果是令人鼓舞的。三角形中的每个点都有相同的法线，因此只要光源离它足够远，每个点的光线向量就是*近似*平行的，每个点接收到的光量也*近似*相同。构成立方体每条边的两个三角形之间的不连续性（在图\
    \ 13-1 中的绿色面上尤为明显）是由于光线向量是*近似*但不是*完全*平行的导致。\n\n那么，如果我们对一个每个点的法线都不同的物体使用这种技术，例如图\
    \ 13-2 中的球体，会发生什么呢？\n\n![image](img/13fig02.jpg)\n\n*图 13-2：平面着色对于具有平直面的物体效果尚可，但对于应该是曲面的物体效果并不理想。*\n\
    \n效果不好。很明显，该物体不是真正的球体，而是由平面三角形块组成的近似值。由于这种光照会让曲面物体看起来是平的，因此它被称为*平面着色*。\n\n####\
    \ 郭罗德着色 (Gouraud Shading)\n\n我们如何消除光照中的这些不连续性呢？与其只在三角形中心计算光照，不如在它的三个顶点上计算光照。这为我们提供了三个\
    \ 0.0 到 1.0 之间的光照值，每个三角形每个顶点一个。这让我们处于了与第 8 章完全相同的情况：我们可以直接使用 `DrawShadedTriangle`，将光照值作为“强度”属性。\n\
    \n这种技术被称为*郭罗德着色*，以 Henri Gouraud 命名，他在 1971 年提出了这个想法。图 13-3 显示了将其应用于立方体和球体后的结果。\n\
    \n![image](img/13fig03.jpg)\n\n*图 13-3：在郭罗德着色中，我们计算三角形顶点的光照，并并在整个表面上对其进行插值。*\n\
    \n立方体看起来变好了：不连续性消失了，因为每个面的两个三角形共享两个顶点，且它们具有相同的法线，因此这两个三角形在这些顶点处的光照是完全相同的。\n\n\
    然而，球体看起来仍然是有棱面的，而且它表面的不连续性看起来非常糟糕。这并不令人意外：我们把球体视为一组平面的集合。特别是，尽管每个三角形都与其相邻的三角形共享顶点，但它们具有不同的法线。图\
    \ 13-4 展示了这个问题。\n\n![image](img/13fig04.jpg)\n\n*图 13-4：我们在共享顶点处得到了两个不同的光照值，因为这些值取决于三角形的法线，而法线是不同的。*\n\
    \n让我们后退一步。使用平面三角形来表示曲面物体是我们技术的局限性，而不是物体本身的属性。\n\n球体模型中的每个顶点都对应球体上的一点，但它们定义的三角形只是其表面的近似。让模型中的顶点尽可能地代表球体上的点会是一个好主意。这意味着除此之外，为每个顶点使用真实的球体法线，如图\
    \ 13-5 所示。\n\n![image](img/13fig05.jpg)\n\n*图 13-5：我们可以给每个顶点它所代表的曲面的法线。*\n\n注意，这不适用于立方体；尽管三角形共享顶点位置，但每个面都需要独立于其他面进行着色。立方体的顶点没有单一的“正确”法线。\n\
    \n我们的渲染器无法知道一个模型应该是曲面物体的近似值还是平直物体的精确表示。毕竟，立方体是球体非常粗糙的近似！为了解决这个问题，我们将三角形法线作为模型的一部分，这样设计师就可以做出这个决定。\n\
    \n某些物体（如球体）每个顶点有一个法线。其他物体（如立方体）对于使用该顶点的每个三角形都有不同的法线。因此我们不能将法线设置为顶点的属性：\n\n```\n\
    model {\n  name = cube\n  vertices {\n    0 = { position = (0, 0, 0), normal =\
    \ (0, 0, 1) }\n    1 = { position = (1, 0, 0), normal = (0, 0, 1) }\n    2 = {\
    \ position = (1, 1, 0), normal = (0, 0, 1) }\n    3 = { position = (0, 1, 0),\
    \ normal = (0, 0, 1) }\n    4 = { position = (0, 0, 1), normal = (0, 0, -1) }\n\
    \    5 = { position = (1, 0, 1), normal = (0, 0, -1) }\n    6 = { position = (1,\
    \ 1, 1), normal = (0, 0, -1) }\n    7 = { position = (0, 1, 1), normal = (0, 0,\
    \ -1) }\n    8 = { position = (1, 0, 0), normal = (-1, 0, 0) }\n    9 = { position\
    \ = (1, 1, 0), normal = (-1, 0, 0) }\n    10 = { position = (1, 1, 1), normal\
    \ = (-1, 0, 0) }\n    11 = { position = (1, 0, 1), normal = (-1, 0, 0) }\n   \
    \ 12 = { position = (0, 1, 0), normal = (0, -1, 0) }\n    13 = { position = (1,\
    \ 1, 0), normal = (0, -1, 0) }\n    14 = { position = (1, 1, 1), normal = (0,\
    \ -1, 0) }\n    15 = { position = (0, 1, 1), normal = (0, -1, 0) }\n    16 = {\
    \ position = (0, 0, 0), normal = (0, 1, 0) }\n    17 = { position = (1, 1, 0),\
    \ normal = (0, 1, 0) }\n    18 = { position = (0, 1, 1), normal = (0, 1, 0) }\n\
    \    19 = { position = (0, 0, 1), normal = (0, 1, 0) }\n  }\n  triangles {\n \
    \   0 = { vertices = (0, 1, 2) }\n    1 = { vertices = (0, 2, 3) }\n    2 = {\
    \ vertices = (4, 5, 6) }\n    3 = { vertices = (4, 6, 7) }\n    4 = { vertices\
    \ = (8, 9, 10) }\n    5 = { vertices = (8, 10, 11) }\n    6 = { vertices = (12,\
    \ 13, 14) }\n    7 = { vertices = (12, 14, 15) }\n    8 = { vertices = (0, 4,\
    \ 8) }\n    9 = { vertices = (0, 8, 4) }\n    10 = { vertices = (1, 5, 9) }\n\
    \    11 = { vertices = (1, 9, 8) }\n    12 = { vertices = (2, 6, 10) }\n    13\
    \ = { vertices = (2, 10, 9) }\n    14 = { vertices = (3, 7, 11) }\n    15 = {\
    \ vertices = (3, 11, 10) }\n  }\n}\n```\n\n图 13-6 显示了使用郭罗德着色和适当法线渲染的场景。\n\n![image](img/13fig06.jpg)\n\
    \n*图 13-6：在模型中指定法线的郭罗德着色。立方体看起来仍然是立方体，而球体现在看起来像球体。*\n\n#### 冯克着色 (Phong Shading)\n\
    \n我们可以克服郭罗德着色的局限性，但像常一样，质量和资源使用之间存在权衡。\n\n"
