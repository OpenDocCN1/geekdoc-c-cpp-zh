  md: 'components. However, because of its extensibility and its ability to handle
    various problems in software development, it’s very popular among professionals
    — especially when they want to create large applications.


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_152_0.png)


    The circles above represent different levels of software in an app. There are
    two principles to bear in mind about this graph:


    +   1. The center circle is the most abstract, and the outer circle is the most
    concrete. This is called the Abstraction Principle. The Abstraction Principle
    specifies that inner circles should contain business logic, and outer circles
    should contain implementation details. In other words, the closer you are to the
    center, the less dependency on a specific platform you have.


    +   2. Another principle of Clean Architecture is the Dependency Rule. This rule
    specifies that each circle can depend solely on the nearest inward circle — this
    is what makes the architecture work. This makes code based on Clean Architecture
    pretty decoupled and hence testable.


    The basic components of Clean Architecture are as follows, explained from outer
    circles inward:


    +   • Presentation and Framework: The outermost layer generally contains frameworks
    and tools specific to a platform. Using SwiftUI for making interfaces? Here’s
    the place. Using Room for database? It also belongs here. You usually can’t share
    code in this layer between platforms.'
