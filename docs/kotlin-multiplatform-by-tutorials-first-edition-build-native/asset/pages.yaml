- pgno: 127
  md: 'KMP uses the appropriate compiler to compile the code you wrote for each platform.
    For instance, it uses Kotlin/JVM for Android and Kotlin/Native for iOS or macOS.
    Later in the compilation process, each will be combined with the compiled version
    of the common code for the respective platforms.


    You may ask why you need this in the first place. Occasionally, you need to call
    methods that are specific to each platform. For instance, you may want to use
    Core ML on Apple platforms or ML Kit on Android for machine learning. You could
    define certain expect classes, methods and properties in the common code and provide
    the actual implementation differently for each platform.


    The expect/actual mechanism lets you call into native libraries of each platform
    using Kotlin. How cool is that!


    # Say hello to Organize


    After you create a great app to find an appropriate time for setting up your international
    meetings, you’ll need a way to make TODOs and reminders for those sessions. Organize
    will help you do exactly that.


    As with many apps you use every day, Organize has a page that shows you the device
    information the app is running on. If you’ve ever faced a bug in your apps, you
    know how valuable this information can be when debugging.


    Open the starter project for this section. It’s mostly a newly created project
    using the KMM plugin on Android Studio, with extra platforms and dependencies
    already set up. The main difference from the project you created in Section 1
    is that this time, you’re going to use Regular framework instead of Cocoaapods
    for iOS framework distribution. Learning a new thing is always welcome, after
    all.


    Long before Apple introduced Swift Package Manager, iOS developers used different
    approaches for managing dependencies. While Cocoaapods was — or still is — somehow
    the de facto way of managing dependencies, some people tend to use other approaches
    for many reasons.




    +   It’s easy to set up.


    +   It handles the entire process of building dependencies and linking them against
    your project.


    +   It has a large community that can help if anything goes wrong.


    +   Practically, you can find any dependency in their centralized repository.
    It also has a website for easier searching and finding.'
