  md: '# Fig. 1.6 - KMM Application Project Dialog


    In the next dialog, leave everything as the default. Here, you’re naming the Android
    folder androidApp, the iOS folder iosApp, and the shared folder shared. You can
    use any names you want, but the rest of the book will use these conventions.


    As mentioned earlier, you’ll use the CocoaPods dependency manager for iOS. When
    the Gradle files are created, Android Studio will add a section for CocoaPods.


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_17_0.png)


    # Fig. 1.7 - KMM Application Naming Dialog


    Click Finish, and after a while, a new project will open.


    You’ll first see the Android file structure in the left panel, but you want to
    see all the folders. Choose Project from the menu showing Android. Here, you can
    see all the folders and files created for you. You have a hidden folder for Gradle
    and Android Studio (.idea), and the androidApp, Gradle, iosApp and shared folders.'
