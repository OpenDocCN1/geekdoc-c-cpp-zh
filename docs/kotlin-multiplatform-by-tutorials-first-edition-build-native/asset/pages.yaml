- pgno: 130
  md: "```\n```kotlin\nexpect class Platform() {\n    val osName: String\n    val\
    \ osVersion: String\n\n    val deviceModel: String\n    val cpuType: String\n\n\
    \    val screen: ScreenInfo?\n\n    fun logSystemInfo()\n}\n\nexpect class ScreenInfo()\
    \ {\n    val width: Int\n    val height: Int\n    val density: Int\n}\n```\n```\n\
    \nBy writing this, you’re making a promise to KMP that you’re going to provide\
    \ this information. As you see, there’s no implementation for anything here. You\
    \ define what you want, just like an `interface` or `protocol`.\n\n> **Note:**\
    \ You’ve used Kotlin’s shorthand notation for constructor definition by using\
    \ `Platform()`. This means KMP now expects you to provide an implementation for\
    \ the constructor alongside the properties and methods.\n\nYou may be surprised\
    \ that you didn’t define `Platform` or `ScreenInfo` as a data class; after all,\
    \ these classes seem a perfect fit for a data class since they’re essentially\
    \ data holders.\n\nThe reason is that data classes in Kotlin automatically generate\
    \ some implementations under the hood. Consequently, you can’t use them here,\
    \ as expect classes shouldn’t have implementations.\n\nYou also can’t define nested\
    \ classes inside an `expect class`. Hence, you defined the `ScreenInfo` class\
    \ outside the `Platform` definition. You can also create a new file if you desire.\
    \ Doing it in the same file would work, too.\n\nIn the code gutter, click the\
    \ yellow rhombus with the letter A in it. This lets you navigate to the actual\
    \ implementation file for the platforms you defined in the project."
