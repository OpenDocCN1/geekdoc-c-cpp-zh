  md: "In this case, `MediaFile` is represented as a `UIImage`. The `ByteArray` required\
    \ for the upload is retrieved from the call to `UIImageJPEGRepresentation`.\n\n\
    With these implementations, you can now access the file’s content and upload it.\
    \ Although it’s beyond the scope of this chapter, it’s worth showing you an example\
    \ of how it can be made at Ktor level.\n\nImagine that you selected an image to\
    \ upload. Assuming your server supports multipart requests, you could write a\
    \ similar function:\n\n```\n```kotlin\n//1\npublic suspend fun uploadAvatar(data:\
    \ MediaFile): HttpResponse {\n    //2\n    return client.post(UPLOAD_AVATAR_URL)\
    \ {\n        //3\n        body = MultiPartFormDataContent(\n            formData\
    \ {\n                appendInput(\"filedata\", Headers.build {\n             \
    \       //4\n                    append(HttpHeaders.ContentType, \"application/octet-stream\"\
    )\n                }) {\n                    //5\n                    buildPacket\
    \ { writeFully(data.toByteArray()) }\n                }\n            }\n     \
    \   )\n    }\n}\n```\n```\n\nHere’s what’s happening:\n\n+   1. You need to receive\
    \ the `MediaFile` that contains a reference to your image. The important part\
    \ of this object is the `toByteArray` function that’s used on 5.\n+   2. The `client`\
    \ in this example is the same that you’ve been using until now. There’s no need\
    \ to install additional plugins or set any configuration.\n+   3. In this case,\
    \ the file will be sent through a multipart request, so the `body` of the request\
    \ needs to contain this information.\n+   4. Most servers require that the request\
    \ contains the content type of the file — in this case, `application/octet-stream`.\n\
    +   5. Depending on the total size of the file, more than one part might need\
    \ to be sent. Although the result is always an array of bytes, depending on the\
    \ platform that your app is running, `toByteArray` will call different functions."
