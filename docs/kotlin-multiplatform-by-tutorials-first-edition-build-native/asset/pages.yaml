    # Key points


    +   - A **suspend function** can only be called from another **suspend function**
    or from a coroutine.

    +   - You can use `launch` or `async` to create and start a coroutine.

    +   - A coroutine can start a thread from **Main**, **IO** or **Default** thread
    pools.

    +   - The new Kotlin/Native memory model gives you support to run multiple threads
    on iOS.


    # Where to go from here?


    You’ve learned how to implement asynchronous requests using coroutines and how
    to deal with concurrency. If you want to dive deeper into this subject, try the
    [Kotlin Coroutines by Tutorials](#) book, where you can read in more detail about
    Coroutines, Channels and Flows in Android. There’s also [Concurrency by Tutorials](#),
    which focuses on multithread in Swift, and [Modern Concurrency in Swift](#), which
    teaches you the new concurrency model with **async/away** syntax.


    In the next chapter, you’ll learn how to migrate a feature to support Kotlin Multiplatform
