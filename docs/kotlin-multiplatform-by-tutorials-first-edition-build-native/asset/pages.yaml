  md: '`Serializable` requires all the object types to be declared. This makes it
    a faster solution, since there’s no need to use reflection to understand the object
    type.


    One might argue that `Parcelable` is more complex to implement. This was true
    some years ago, since it was necessary to override a couple of methods and create
    the read/write methods according to the object fields. But, you don’t have to
    do all that now, as the **kotlin-parcelize** plugin generates this code automatically.
    So the only effort here is to add an annotation to the top of the class — `@Parcelize`
    — and extend `Parcelable`.


    # Implementing Parcelize in KMP


    `Parcelable` and `Parcelize` are a set of classes that are specific to the Android
    platform. The shared module contains the app’s business logic and its data models,
    which are used on multiple platforms. Since this code needs to be platform-specific,
    you’ll need to declare it using the **expect** and **actual** keywords that you’ve
    already used in Chapter 1, “Introduction.”


    `Parcelize` is part of a plugin named **kotlin-parcelize**, which contains the
    `Parcelable` code generator. Before writing the Android declaration for this class,
    you’ll need to first add it to the **shared** module’s **build.gradle.kts** file.
    Open it, and in the `plugin` section add:


    ```

    id("kotlin-parcelize")

    ```


    Synchronize the project and add this new dependency.


    To set a data class as **Parcelable**, one would add the annotation `@Parcelize`
    to the top of the class declaration and then extend the `Parcelable` generator.
    It should be something similar to:


    ```

    import kotlinx.parcelize.Parcelize


    @Parcelize

    data class RWEntry(val id: String, val entry: String): Parcelable

    ```


    However, since this platform-specific code shouldn’t exist on **commonMain**,
    you’ll need to define this behavior at the platform level — in this case in **androidMain**.


