    \ HttpResponse =\nclient.get(feedUrl)\n```\n```\n\n# Lambda expressions\n\nLambda\
    \ expressions allow you to execute specific code blocks as functions. They can\
    \ receive parameters and even return a specific type of object. You can see two\
    \ of them on `fetchFeed`: `onSuccess` and `onFailure` parameters on **FeedPresenter.kt**.\n\
    \n```\n```kotlin\nprivate fun fetchFeed(platform: PLATFORM, feedUrl: String) {\n\
    \    GlobalScope.apply {\n        MainScope().launch {\n            feed.invokeFetchRWEntry(\n\
    \                platform = platform,\n                feedUrl = feedUrl,\n  \
    \              onSuccess = { listener?.onNewDataAvailable(it, platform, null)\
    \ },\n                onFailure = { listener?.onNewDataAvailable(emptyList(),\
    \ platform, it) }\n            )\n        }\n    }\n}\n```\n```\n\nBoth of these\
    \ expressions receive an `it` parameter. In the first case, it’s a list of `RWEntry`,\
    \ and in the second it’s an `Exception`. Alternatively, you could define this\
    \ expression like the following to better identify what `it` really is:\n\n```\n\
    ```kotlin\nonSuccess = { list ->\n    listener?.onNewDataAvailable(list, platform,\
    \ null)\n}\n```\n```\n\n# Higher-order functions\n\nHigher-order functions support\
    \ receiving a function as an argument.\n\nA good example of this type of function\
    \ is the `onSuccess` and `onFailure`"
