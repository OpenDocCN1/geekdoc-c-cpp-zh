    # Challenges


    Here are some challenges for you to practice what you’ve learned in this chapter.
    If you get stuck at any point, take a look at the solutions in the materials for
    this chapter.


    # Challenge 1: Create a logger


    All the apps and the **shared** module use the **Logger** class defined on **shared/PlatformLogger.kt**.
    It’s a simple logger that calls on:


    +   - Android, the **android.util.Log**.

    +   - Desktop, the **println**.

    +   - iOS, the **platform.Foundation.NSLog**.


    In this first challenge, create and publish a new library — **shared-logger**
    — that should contain the **PlatformLogger.kt** implementation for all the three
    platforms: Android, desktop and iOS.


    # Challenge 2: Integrate the logger library


    Throughout this book, you created three different apps:


    +   - **Find time**, a time zone helper, in Section 1.'
