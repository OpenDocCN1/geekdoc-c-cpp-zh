  md: 'desktop. It doesn’t look like other native apps on Windows or macOS, either.
    Many would prefer to stick to the native UI toolkit of each platform instead of
    using Jetpack Compose, which uses Java Swing under the hood. For that matter,
    many developers wouldn’t create their desktop app using the approach you saw in
    this book. If you don’t do that, you won’t have Jetpack Compose for Desktop, and
    therefore, no code to share between Android and desktop.


    +   Each platform has its differences. A desktop app would usually need a different
    design than the Android app. For instance, it doesn’t need to have large touch
    targets, it doesn’t have multitouch, it mostly uses mouse and keyboard instead
    of touch as input, etc. If you want to create a great app for each platform, you
    need to take these into consideration.


    All these explanations apply to UI testing as well. If you somehow share UI code,
    you can have shared UI tests. If you don’t, you’ll need to create UI tests for
    each platform separately.


    # Challenge


    Here’s a challenge for you to see if you mastered this chapter. The solution is
    waiting for you inside the materials for this chapter.


    # Challenge: Moving page titles to viewmodels


    As viewmodels are responsible to make everything ready for views to show, you
    can make the viewmodels provide the page title to their respective views. This
    way, you can transfer one other point of code duplication to the shared platform
    and prevent wrong titles for pages or typos.


    # Key points


    +   You can use any design pattern you see fit with Kotlin Multiplatform.


    +   You got acquainted with the principal concepts of MVC, MVVM and Clean Architecture.


    +   Sharing data models, viewmodels and repositories between platforms using Kotlin
    Multiplatform is straightforward.


    +   You can share business logic tests using Kotlin Multiplatform.


    +   Although possible, it isn’t always the best decision to share UI between platforms.'
