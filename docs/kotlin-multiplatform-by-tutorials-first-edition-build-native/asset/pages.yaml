    # Declaring your app dependencies for Koin


    Koin uses a special Kotlin Domain Specific Language — or **DSL** — to let you
    describe your application and its dependency graph.


    There are three steps to start using Koin:


    +   1. **Declare your modules:** Modules are entities that Koin later injects
    into different parts of your app as needed. You can have as many modules as you
    want.

    +   2. **Start Koin:** A single call to `startKoin` function, passing in the modules
    in your app, will make a Koin instance ready to do the injection job in your app.

    +   3. **Perform the injection:** Using some special keywords provided by Koin
    lets you inject object instances at will.


    Inside the **shared** module, in the **commonMain** directory, create a sibling
    file to **Platform.kt** named **KoinCommon.kt**. You’re going to write Koin setup
    codes there.'
