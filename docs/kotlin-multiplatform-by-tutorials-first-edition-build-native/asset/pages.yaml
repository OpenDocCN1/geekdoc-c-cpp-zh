    )\n    OrganizeDb.Schema.create(driver)\n    driver\n}\n```\n```\n\nYou’re creating\
    \ a file named **OrganizeDb.db** inside the directory where the app’s codes are.\
    \ You then create the schema using the driver. After doing this, try running the\
    \ app. It’ll most likely crash. Don’t worry and continue.\n\nNext, remove the\
