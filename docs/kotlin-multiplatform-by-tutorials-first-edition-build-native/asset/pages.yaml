    And remove the import:\n\n```\nimport androidx.compose.ui.res.painterResource\n\
    ```\n\nAll done! A couple more sections to go, and you’ll have your app’s UI completely\
    \ shared.\n\n# ## Using custom fonts\n\nBoth apps need to use the Bitter font.\
    \ Previously, you moved all the folders from androidApp/res folder to commonMain/resources.\
    \ If you open it, you’ll see there’s a set of bitter_*.ttf that represent the\
    \ fonts your text can use.\n\nSimilar to what you’ve done in the previous section,\
    \ you’ll need to create a Multiplatform function to load them.\n\nStart by creating\
    \ a Font.kt file inside commonMain/theme on the shared-ui module. This class will\
    \ contain the function declaration:\n\n```\n@Composable\nexpect fun Font(name:\
    \ String, res: String, weight: FontWeight,\nstyle: FontStyle): Font\n```\n\nA\
    \ font can either be referenced through the R class on Android or with its path\
    \ on desktop. The res argument represents that. weight and style correspond to\
    \ its properties, and, of course, name to its name.\n\nOpen the androidMain/theme,\
    \ and create the corresponding Font.kt file with the following actual implementation:\n\
    \n```\n@Composable\nactual fun Font(name: String, res: String, weight: FontWeight,\n\
    style: FontStyle): Font {\n    val context = LocalContext.current\n    val id\
    \ = context.resources.getIdentifier(res, \"font\",\n    context.packageName)\n\
    \    return Font(id, weight, style)\n}\n```"
