- pgno: 283
  md: "If you weren’t using coroutines on `fetchFeed`, these instructions would run\
    \ sequentially. In other words, the app would only iterate to the next item after\
    \ `fetchFeed` returned, which would delay the app startup.\n\n# Suspend functions\n\
    \n**Suspend functions** are at the core of coroutines. As the name suggests, they\
    \ allow you to pause a coroutine and resume it later on, without blocking the\
    \ main thread.\n\nNetwork requests are one of the use cases for **suspend functions**.\
    \ Open the **FeedAPI.kt** file on **shared/commonMain/data** and look at the functions’\
    \ declaration:\n\n```\npublic suspend fun fetchRWEntry(feedUrl: String): HttpResponse\
    \ =\nclient.get(feedUrl)\n\npublic suspend fun fetchMyGravatar(hash: String):\
    \ GravatarProfile =\n  client.get(\"$GRAVATAR_URL$hash$GRAVATAR_RESPONSE_FORMAT\"\
    ) {\n    header(X_APP_NAME, APP_NAME)\n  }.body()\n```\n\nThey’re all **suspend\
    \ functions**. Since a response may take some time, the app cannot block and wait\
    \ for any of these functions to return.\n\nThis image defines the flow that triggers\
    \ `fetchRWEntry` to be called.\n\n![](img/2f50555a40af4ea8c85f09e577f0c5b9_283_0.png)\n\
    \nFig. 13.2 - Diagram showing the different steps of a network request with coroutines.\n\
    \nThe entry point, for all platforms, is the `fetchAllFeeds` function from **shared/commonMain/presentation/FeedPresenter.kt**.\
    \ Once invoked, it iterates over all the RSS feeds, and calls `fetchFeed` for\
    \ each one of its URLs:"
  merge: -1
  img_proc: true
- pgno: 284
  md: "+   1. This is a heavy operation that might block the UI. To avoid this, you’ll\
    \ do it asynchronously. Create a coroutine by calling `launch`.\n+   2. Once launched,\
    \ it calls `invokeFetchRWEntry` from **shared/commonMain/domain/GetFeedData.kt**.\
    \ A **suspend function** calls the **FeedAPI** to make the request.\n+   3. This\
    \ function suspends after making the request, and it waits until there’s a response\
    \ or the connection times out.\n+   4. This is done in a separate thread, so the\
    \ UI doesn’t get blocked.\n+   5. Once there’s a response, `fetchRWEntry` resumes\
    \ and returns to `invokeFetchRWEntry`, which can now deserialize the information\
    \ received.\n+   6. When this process finishes, the `onSuccess` or the `onFailure`\
    \ functions execute — depending on the result — and the UI receives an update.\
    \ Since you’re using `MainScope` to `launch` the coroutine, this means it will\
    \ run on the UI-thread. You’ll see this in detail in the next section.\n\nAs a\
    \ key point, you can only call a **suspend function** from another one or within\
    \ a coroutine.\n\n# Coroutine scope and context\n\nReturn to **FeedPresenter.kt**\
    \ from **shared/commonMain/presentation** and search for the `fetchFeed` function:\n\
    \n```\nprivate fun fetchFeed(platform: PLATFORM, feedUrl: String, cb: FeedData)\
    \ {\n    MainScope().launch {\n        // Call to invokeFetchRWEntry\n    }\n\
    }\n```\n\nYou already know that `launch` creates a new coroutine, but what’s `MainScope`?\
    \ A **coroutine scope** is where a coroutine is going to run — in this case, it\
    \ will be the main thread.\n\nIf you open the source code of `MainScope`:\n\n\
    ```\npublic fun MainScope(): CoroutineScope =\nContextScope(SupervisorJob() +\
    \ Dispatchers.Main)\n```\n\nYou can see that its `ContextScope` is built using:\n\
    \n+   - `SupervisorJob`: When you create a coroutine, it returns a `Job` that\
    \ corresponds to its instance. This allows you to cancel or to know more about"
  merge: -1
  img_proc: true
- pgno: 285
  md: "its current state:\n\n+   - isActive : If it's currently running.\n\n+   -\
    \ isCompleted : If all of its work, as well as its children, have ended. Moreover,\
    \ when the current Job gets cancelled — or fails — its value will be true.\n\n\
    +   - isCancelled : When the current job gets cancelled or fails.\n\nThe difference\
    \ between a SupervisorJob and a Job is that they have different policies. In the\
    \ first one, the children behave independently — if one fails, the others won't\
    \ be affected — whereas in the second one, if a parent fails, all of its children\
    \ will be cancelled.\n\n+   - Dispatchers : Define in which thread a coroutine\
    \ should run:\n\n+   - Default : Uses a shared pool of threads.\n\n+   - Main\
    \ : Has different behaviors depending on the platform that's currently running.\
    \ On JVM and Android, Main corresponds to the UI-thread, and should only be used\
    \ for operations that update the UI. On Native, it's the same as the Default dispatcher.\n\
    \n+   - Unconfined : Doesn't have any associated threading policy. Doesn't switch\
    \ to any specific thread.\n\n+   - IO : Should be used for long-running and heavy\
    \ tasks because it's one shared pool of threads, optimized for these types of\
    \ operations. It's currently not available for iOS.\n\nWhen you create a coroutine,\
    \ you have to define the dispatcher where it should run, but you can always switch\
    \ the context later on its execution by calling withContext with the prepended\
    \ Dispatcher as an argument.\n\nIn the fetchMyGravatar function from FeedPresenter.kt,\
    \ you're running the coroutine in the main thread, although the only part that\
    \ is necessary to run are the onSuccess and onFailure calls. You can update the\
