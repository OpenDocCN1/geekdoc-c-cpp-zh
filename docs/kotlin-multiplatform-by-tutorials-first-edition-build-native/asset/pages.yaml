  md: "Like `remember` in Jetpack Compose (JC), `StateObject` creates an observable\
    \ object that’s created once. Each time the view is redrawn, it will reuse the\
    \ existing object. Other objects can listen for changes, and SwiftUI will update\
    \ those objects. If you open the **TimezoneItems.swift** file, you’ll see that\
    \ it’s an `ObservableObject` that **Publishes** a list of time zones and selected\
    \ time zones. It also asynchronously gets the list of time zones from the `shared`\
    \ library.\n\n# TabView\n\n`TabView` is the SwiftUI equivalent of Jetpack Compose’s\
    \ `BottomNavigation`. You can use it to display a tab bar at the bottom of the\
    \ screen and lets the user switch between different views of the app.\n\nBack\
    \ in **ContentView.swift**, define `body` as follows:\n\n```\nvar body: some View\
    \ {\n    // 1\n    TabView {\n        // 2\n        TimezoneView()\n         \
    \   // 3\n            .tabItem {\n                Label(\"Time Zones\", systemImage:\
    \ \"network\")\n            }\n        // 4\n//        FindMeeting()\n//     \
    \       .tabItem {\n//                Label(\"Find Meeting\", systemImage: \"\
    clock\")\n//            }\n    }\n    .accentColor(Color.white)\n    // 5\n  \
    \  .environmentObject(timezoneItems)\n}\n```\n\n+   1. Create a SwiftUI `TabView`.\n\
    +   2. The first tab will be the `TimezoneView` that you’ll create next.\n+  \
    \ 3. Apply the `tabItem` with a system network icon and the word **Time Zones**.\n\
    +   4. The second tab will be the `FindMeeting` view that you haven’t created\
    \ yet. (It’s commented out for now.)\n+   5. Set the `timezoneItems` object as\
    \ an `environmentObject`.\n\nThere are several ways to pass objects around to\
    \ different views. Here, you pass `timezoneItems` via an Environment Object. The\
    \ users of this object i.e, any child view, will declare an `@EnvironmentObject`\
    \ variable that will receive that object."
  merge: -1
