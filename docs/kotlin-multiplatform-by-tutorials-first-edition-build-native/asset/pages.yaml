- pgno: 126
  md: 'Written by Saeed Taheri


    Any technology that aims to provide a solution for multiprogram development attacks
    the problem of handling platform differences from a new angle.


    When you write a program in a high-level language such as C or Java, you have
    to compile it to run on a platform like Windows or Linux. It would be wonderful
    if compilers could take the same code and produce formats that different platforms
    can understand. However, this is easier said than done.


    Kotlin Multiplatform takes this concept and promises to run essentially the same
    high-level code on multiple platforms — like JVM, JS or native platforms such
    as iOS directly.


    Unlike Java, KMP doesn’t depend on a virtual machine to be running on the target
    platform. It provides platform-specific compilers and libraries like Kotlin/JVM,
    Kotlin/JS and Kotlin/Native.


    In this chapter, you’re going to learn how to structure your code according to
    KMP’s suggested approach on handling platform-specific tidbits.


    # Reusing code between platforms


    Kotlin Multiplatform doesn’t compile the entire shared module for all platforms
    as a whole. Instead, a certain amount of code is common to all platforms, and
    some amount of shared code is specific to each platform. For this matter, it uses
    a mechanism called expect/actual.


    In Chapter 1, you got acquainted with those two new keywords. Now, you’re going
    to dive deeper into this concept.


    Think of expect as a glorified interface in Kotlin or protocol in Swift. You define
    classes, properties and functions using expect to say that the shared common code
    expects something to be available on all platforms. Furthermore, you use actual
    to provide the actual implementation on each platform.


    Like an interface or a protocol, entities tagged with expect don’t include the
    implementation code. That’s where the actual comes in.


    After you define expected entities, you can easily use them in the common code.'
