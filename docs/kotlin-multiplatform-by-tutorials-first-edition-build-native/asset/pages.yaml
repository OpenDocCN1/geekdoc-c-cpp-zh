    # ## Distribution


    When you’re finally satisfied with your app, you’ll want to distribute it to your
    users. The first step is to package it up into a distributable file. There isn’t
    cross- compilation support available at the moment, so the formats can only be
    built using your current machine.


    > **Note**: At the time of writing, macOS distribution builds required Java 15
    or greater. On M1 MacBook pros, you’ll find that the Azul Arm-based JVM distribution
    works well and is easy to install. There are many third-party packages out there.
    Do a Google search to find one that’s easy to install for your machine.


