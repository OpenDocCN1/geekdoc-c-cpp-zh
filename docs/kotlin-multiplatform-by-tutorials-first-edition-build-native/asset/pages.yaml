  md: '![](img/2f50555a40af4ea8c85f09e577f0c5b9_154_0.png)


    Fig. 7.3 - Alt+Enter on expect class name


    > **Note:** If Android Studio failed to automatically create the needed actual
    files for you, don’t worry. Create a file in the same package with the same name
    inside the missing platform’s folder.


    Open the Android version of **BaseViewModel.kt** and replace the content with
    this line:


    ```

    ```kotlin

    actual abstract class BaseViewModel : ViewModel()

    ```

    ```


    Don’t forget to import the needed package:


    ```

    ```kotlin

    import androidx.lifecycle.ViewModel

    ```

    ```


    On Android, the ViewModels should extend the **Lifecycle** version of `ViewModel`
    so they can escape the configuration changes on the devices.


    If this is confusing to iOS developers, here’s a small explanation:


    On Android, when a configuration change occurs — for example, the device rotates
    or the user changes the system-wide theme or locale — the system recreates all
    the view components. However, the system will keep the same instance of the ViewModel
    extending from the Lifecycle package of AndroidX in the memory. Hence, you can
    keep the view data inside the ViewModel and apply them to the newly created view
    components and the user won’t notice anything.


    For iOS and desktop, you don’t need to extend anything. What Android Studio did
    for the actual files on those platforms is more than enough. They look like this:


    ```

    ```kotlin

    actual abstract class BaseViewModel actual constructor()

    ```

    ```'
