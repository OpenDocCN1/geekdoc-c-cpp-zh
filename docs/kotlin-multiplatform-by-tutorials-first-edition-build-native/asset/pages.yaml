- pgno: 256
  md: "To **build learn**, you need to make three different requests to:\n\n+   -\
    \ The RSS feed of a specific topic.\n+   - An article webpage.\n+   - Your Gravatar\
    \ account.\n\nThe data for the first one is in the `RW_CONTENT` property inside\
    \ the **FeedPresenter.kt** file located in the **shared** module. It can be one\
    \ of the following:\n\n+   - [All](#)\n+   - [Android](#)\n+   - [iOS](#)\n+ \
    \  - [Gametech](#)\n+   - [Flutter](#)\n\nEach of these requests loads the latest\
    \ 20 articles published for its category.\n\nThe second request corresponds to\
    \ the `link` field of the `RWEntry`. Since an RSS entry doesn’t contain a URL\
    \ for the article image, you’ll need to fetch it manually from raywenderlich.com.\n\
    \nFinally, make the last request to [Gravatar](#), a service that allows you to\
    \ define an online profile that can be used across external sites. Your picture\
    \ from raywenderlich.com, for example, is retrieved from this service.\n\n# How\
    \ to make a network request\n\nOpen the **data** folder inside the **shared/src/commonMain**\
    \ module and create a new file named **FeedAPI.kt**. Add the following code:\n\
    \n```\n```kotlin\n//1\npublic const val GRAVATAR_URL = \"https://en.gravatar.com/\"\
    \npublic const val GRAVATAR_RESPONSE_FORMAT = \".json\"\n\n//2\n@ThreadLocal\n\
    public object FeedAPI {\n\n  //3\n  private val client: HttpClient = HttpClient()\n\
    \n  //4\n  public suspend fun fetchRWEntry(feedUrl: String): HttpResponse =\n\
    \    client.get(feedUrl)\n\n  //5\n  public suspend fun fetchMyGravatar(hash:\
    \ String): HttpResponse =\n```\n```"
  merge: -1
  img_proc: true
- pgno: 257
  md: "```\n```kotlin\nclient.get(\"$GRAVATAR_URL$hash$GRAVATAR_RESPONSE_FORMAT\"\
    )\n}\n```\n```\n\nWhen prompted for imports, use the following:\n\n```\n```kotlin\n\
    import io.ktor.client.HttpClient\nimport io.ktor.client.request.get\nimport io.ktor.client.statement.HttpResponse\n\
    import kotlin.native.concurrent.ThreadLocal\n```\n```\n\nIn the code above:\n\n\
    +   1. The constants `fetchMyGravatar` will use to make its request: the URL and\
    \ the response format.\n+   \n+   2. This annotation is only valid for iOS (Kotlin/Native).\
    \ It’s ignored in both Android and desktop. Using `@ThreadLocal`, the `FeedAPI`\
    \ won’t be shared across other threads that try to access it. Instead, a new copy\
    \ will be made. This guarantees the object won’t freeze. Read more about this\
    \ in Chapter 13, “Concurrency”.\n+   \n+   3. Initialization of the `HttpClient`\
    \ that you’ll use to make the requests.\n+   \n+   4. This function receives a\
    \ feed URL for a specific topic, makes the request and returns it as a response\
    \ via a `HttpResponse`. In this object, you can get additional information about\
    \ the status code of the response, its body, etc.\n+   \n+   5. Finally, you’ll\
    \ access Gravatar to retrieve information about your profile.\n\nYou’re making\
    \ a **GET** request in **learn**. Other HTTP methods are also available with Ktor:\
    \ **POST, PUT, DELETE, HEAD, OPTION** and **PATCH**.\n\n> **Note:** If you look\
    \ closely at these functions, you’ll see they’re declared using the keyword `suspend`.\
    \ It’s used so the current thread won’t get blocked while waiting for a response.\
    \ You’ll learn more about it and coroutines in Chapter 13, “Concurrency”.\n\n\
    You’ve made the requests, and now it’s time to process the responses.\n\n# Plugins\n\
    \nKtor has a set of plugins already built in that are disabled by default. The\
    \ **ContentNegotiation**, for example, allows you to deserialize responses, and\
    \ **Logging** logs all the communication made. You’ll see an example of both later\
    \ in this chapter."
  merge: -1
  img_proc: true
- pgno: 258
  md: "These plugins intercept all the requests and responses made, then process them\
    \ according to their purpose.\n\n# Parsing network responses\n\nTo deserialize\
    \ a JSON response you need to add two new libraries. Open the **build.gradle.kts**\
    \ file and in **commonMain/dependencies** section, add:\n\n```\n```kotlin\nimplementation(\"\
    io.ktor:ktor-client-content-negotiation:2.0.0-beta-1\")\nimplementation(\"io.ktor:ktor-serialization-kotlinx-json:2.0.0-beta-1\"\
    )\n```\n```\n\nSynchronize the project.\n\nIn **FeedAPI**, you’ve got two functions\
    \ that return an `HttpResponse`:\n\n+   - `fetchRWEntry` accesses the raywenderlich.com\
    \ XML feed. Since there’s no direct way to support its serialization from Ktor\
    \ or an official library from JetBrains at the moment, you’ll use one from the\
    \ community: KorIO.\n+   - `fetchMyGravatar` is set to receive a JSON response\
    \ containing information about your Gravatar account.\n\nYou’ll start with `fetchMyGravatar`.\
    \ Since it’s JSON, you can install `ContentNegotiation` for `json` so the response\
    \ from this function will be the deserialized object. To achieve this, update\
    \ the `client` initialization with:\n\n```\n```kotlin\nprivate val client: HttpClient\
    \ = HttpClient {\n\n  install(ContentNegotiation) {\n    json(nonStrictJson)\n\
    \  }\n}\n```\n```\n\nKtor will now use `json` to deserialize the response body.\
    \ Additionally, you also need to define the `nonStrictJson` property. Declare\
    \ it before the `HttpClient`:\n\n```\n```kotlin\nprivate val nonStrictJson = Json\
    \ { isLenient = true; ignoreUnknownKeys = true }\n```\n```\n\nWhen prompted for\
    \ imports, add:\n\n```\n```kotlin\nimport io.ktor.client.plugins.ContentNegotiation\n\
    import io.ktor.serialization.kotlinx.json.json\nimport kotlinx.serialization.json.Json\n\
    ```\n```"
  merge: -1
  img_proc: true
