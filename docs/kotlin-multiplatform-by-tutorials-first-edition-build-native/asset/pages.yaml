  md: "# Kotlin Multiplatform by Tutorials Chapter 1: Introduction\n\n![](img/2f50555a40af4ea8c85f09e577f0c5b9_20_0.png)\n\
    \nYour screen now shows the words Hello, Android and the Android version.\n\n\
    For iOS, open Platform.kt in shared/src/iosMain/kotlin/com/raywenderlich/findtime:\n\
    \n```\npackage com.raywenderlich.findtime\n\nimport platform.UIKit.UIDevice\n\n\
    actual class Platform actual constructor() {\n    actual val platform: String\
    \ = \n    UIDevice.currentDevice.systemName() + \" \" +\n    UIDevice.currentDevice.systemVersion\n\
    }\n```\n\nNotice that this class is written in Kotlin but uses iOS platform code.\
    \ Wow, you can write iOS code in Kotlin! When you build your project, the KMP\
    \ plugin will compile this class into a framework. Open Xcode. From the File menu,\
    \ choose Open and navigate to your project and into the iosApp folder. Select\
    \ the workspace file (iosApp.xcworkspace). For the project to run without errors,\
    \ you’ll need to build in Xcode. Select Product ▸ Build or press Command-B. Once\
