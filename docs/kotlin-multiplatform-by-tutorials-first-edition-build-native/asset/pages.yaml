- pgno: 368
  md: '# # Appendix C: Sharing Your Compose UI Between Android & Desktop


    Written by Carlos Mota


    Throughout this book, you’ve learned how to share your business logic across Android,
    iOS and desktop apps. What if you could go a step further and also share your
    Compose UI?


    That’s right — along with Kotlin Multiplatform, you now have **Compose Multiplatform**,
    which allows you to share your Compose UI with Android and desktop apps.


    > **Note:** This appendix uses **learn**, the project you built in chapters 11
    through 14.


    # ## Updating your project structure


    To follow along with the code examples throughout this appendix, download the
    **Starter** project and open **17-appendix-c-sharing-your-compose-ui-between-android-and-desktop/projects/starter**
    with Android Studio.


    **Starter** is the final version of **learn** from Chapter 14, without the iOS
    app and its platform-specific code. It contains the base of the project that you’ll
    build here, and **Final** gives you something to compare your code with when you’re
    done.


    To share your UI, you’ll need to create a new Kotlin Multiplatform module. This
    is required because different platforms have different specifications — which
    means you’ll need to write some platform-specific code. This is similar to what
    you’ve done throughout this book.


    Start by creating a new KMM library. You can easily do this by clicking the Android
    Studio status bar **File**, followed by **New** and **New Module**.


    Then, select **Kotlin Multiplatform Shared Module** and set:


    +   - **Module Name:** shared-ui

    +   - **Package Name:** com.raywenderlich.learn.ui

    +   - **iOS framework distribution:** Regular framework'
  merge: -1
