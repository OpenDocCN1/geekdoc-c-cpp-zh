    The big elephant in the room of the Organize app is that it doesn’t remember anything
    you add into it. As soon as you close the app or stop the debugger, every TODO
    item disappears for good.


    The reason for this issue is that it’s storing everything in memory and — surprisingly
    enough — computer memory, or to be more exact the RAM, may remind people of Dory
    the fish!


    Apps can persist their data if they store them on non-volatile storage. Examples
    of this type of storage are HDD, or Hard Disk Drive, SSD, or Solid-State Storage,
    and Flash Storage.


    Putting aside the details of how computers work and going more high level, you
    can mostly persist data using three different mechanisms:


    +   1. Key-Value Storage


    +   2. Database


    +   3. File system


    In this chapter, you’ll learn about the first two options, which are more structured
    and more straightforward than working with file systems directly.




    One of the most common use cases when persisting data is to store bits of information
    in a dictionary or map style.


    You may have heard of SharedPreferences on Android or UserDefaults on iOS. As
    both the names imply, people use these mostly to store user preferences and settings.


    Since the setup process for using each of these classes is platform-specific,
    you could use the old and sweet expect/actual mechanism to create a single interface
    for accessing key-value storage on each platform. Although you completely know
    how to do this manually, it’s a lot of boilerplate code to write.


    Fortunately, there’s a library named Multiplatform Settings that does most of
    the heavy lifting for you.'
