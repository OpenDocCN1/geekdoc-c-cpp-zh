  md: "To implement the same feature on the desktop app, open its **FeedViewModel.kt**,\
    \ located in the **desktopApp** module’s **ui/home** folder. Similar to what you\
    \ added for Android, update the existing `fetchMyGravatar` function to:\n\n```\n\
    ```kotlin\nfun fetchMyGravatar() {\n    Logger.d(TAG, \"fetchMyGravatar\")\n \
    \   presenter.fetchMyGravatar(this)\n}\n```\n```\n\nTo make the corresponding\
    \ requests and update the `onMyGravatarData` to notify the UI once they are available,\
    \ update the `onMyGravatarData` method to the following:\n\n```\n```kotlin\noverride\
    \ fun onMyGravatarData(item: GravatarEntry) {\n    Logger.d(TAG, \"onMyGravatarData\
    \ | item=$item\")\n    viewModelScope.launch {\n        profile.value = item\n\
