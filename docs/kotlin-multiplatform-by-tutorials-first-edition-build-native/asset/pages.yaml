- pgno: 103
  md: '# # 5 Developing UI: Compose Multiplatform


    Written by Kevin D Moore


    If you come from a mobile background, it’s exciting to know that you can build
    desktop apps with the knowledge you gained from learning Jetpack Compose (JC).
    JetBrains, the maker of the technology behind Android Studio and IntelliJ, have
    worked with Google to create Compose Multiplatform (CM). This uses some of the
    same code from Jetpack Compose but extends it to be used for multiple platforms.
    This chapter will focus on the desktop, but CM will work on the web as well.


    # ## Getting to know Compose Multiplatform


    CM uses the Java Virtual Machine (JVM) under the hood so that you can still use
    the older **Swing** technology if you want. It uses the **Skia** graphics library
    that allows hardware acceleration (like JC). Apps built with CM can run on macOS,
    Windows and Linux.


    # ## Differences in desktop


    Unlike mobile, the desktop has features like menus, multiple windows and system
    notifications. Menus can have shortcuts and windows will have different sizes
    and positions on the screen. The desktop doesn’t usually use app bars like mobile
    apps. You’ll usually use menus to handle actions.


    # ## Creating a desktop app


    To create a desktop app, you’re going to do several things:


    +   1. Create a desktop module.

    +   2. Create a shared UI module.

    +   3. Move most of the Android code to the shared UI module.

    +   4. Create some wrappers so that Android and desktop can have unique functionality.


    # ## Updating Gradle files


    To start, you’ll need to update a few of your current Gradle files. Open the'
  merge: -1
