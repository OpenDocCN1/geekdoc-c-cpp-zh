  md: "```\n```kotlin\nimplementation(Deps.JetBrains.datetime)\n// 2\nimplementation(Deps.napier)\n\
    }\n}\n```\n```\n\nThis will import two libraries:\n\n+   1. JetBrains datetime\
    \ library.\n+   2. Napier logging library.\n\nNow do a Gradle sync.\n\n# Datetime\
    \ library\n\nKotlin’s `kotlinx-datetime` is an easy-to-use multiplatform library\
    \ that helps with date- and time-based calculations. It uses several data types:\n\
    \n+   - `Instant` represents a moment in time.\n+   - `Clock` imitates a real-world\
    \ clock and provides the current instant.\n+   - `LocalDateTime` represents a\
    \ date with time but no associated time zone.\n+   - `LocalDate` represents only\
    \ a date.\n+   - `TimeZone` and `ZoneOffset` help you convert between `Instant`\
    \ and `LocalDateTime`.\n+   - `Month` is an enum representing all months in the\
    \ year.\n+   - `DayOfWeek` is an enum representing all days of the week. It uses\
    \ values like `MONDAY`, `TUESDAY`, etc. instead of integers.\n+   - `DateTimePeriod`\
    \ represents the difference between 2 instants.\n+   - `DatePeriod` is a subclass\
    \ of `DateTimePeriod` and represents the difference between two `LocalDate` instances.\n\
    +   - `DateTimeUnit` provides a set of units such as `NANOSECOND`, `WEEK`, `CENTURY`,\
    \ etc. that you can use to perform arithmetic operations on `Instant` and `LocalDate`.\n\
    \n# Time Zone Helper\n\nGo to the **com/raywenderlich/findtime** package in **shared/commonMain/**\
    \ and create a new Kotlin interface named **TimeZoneHelper**. Add the following:\n\
    \n```\n```kotlin\ninterface TimeZoneHelper {\n    fun getTimeZoneStrings(): List<String>\n\
    \    fun currentTime(): String\n    fun currentTimeZone(): String\n```\n```"
