- pgno: 260
  md: "+   1. all the network requests and responses.\n+   2. This is the logger class\
    \ that you’ll use to `log` all the network communication. Using `DEFAULT` falls\
    \ back to calling the `println` function.\n+   3. This specified the data that\
    \ needs to be logged.\n\nThe different types of logging levels are:\n\n+   - `LogLevel.ALL`:\
    \ Where everything is logged. Importantly, with this log level, if you’re uploading\
    \ a large file, all of its content will be printed. This ultimately can lead to\
    \ a buffer overflow error and crash your app. Don’t forget to cover this scenario.\n\
    +   - `LogLevel.HEADERS`: Logs the request and response headers.\n+   - `LogLevel.BODY`:\
    \ With this level set, it prints only the body.\n+   - `LogLevel.INFO`: Logs the\
    \ URL and the method that’s going to be used for requests. For responses, this\
    \ means its status, method and the “from” field.\n+   - `LogLevel.NONE`: Nothing\
    \ will be logged. As a safety mechanism, if you’re building your app for production,\
    \ you should select this level. Otherwise, you risk that someone might access\
    \ your network logs by simply opening **Logcat** with the device plugged into\
    \ the computer.\n\nAdditionally, you can define a custom logger class. To accomplish\
    \ this, go to the **data** folder inside the **shared** module and create a **HttpClientLogger.kt**\
    \ file with the following code:\n\n```\nimport com.rawenderrlich.learn.platform.Logger\n\
    \nprivate const val TAG = \"HttpClientLogger\"\n\npublic object HttpClientLogger\
    \ :\nio.ktor.client.plugins.logging.Logger {\n\n    override fun log(message:\
    \ String) {\n        Logger.d(TAG, message)\n    }\n}\n```\n\nHere, you’re extending\
    \ Ktor `Logger` and changing the one that should be used to log the requests and\
    \ responses. You do this by overriding the `log` function. Instead of using the\
    \ default one, you’re going to use the app `Logger` defined on **shared**.\n\n\
    Now, return to **FeedAPI.kt** and update the previously added `install` call to\
    \ instead use:\n\n```\nlogger = HttpClientLogger\n```"
