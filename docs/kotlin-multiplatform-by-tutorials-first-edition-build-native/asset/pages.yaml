  md: 'Here it comes — that phase in software development that makes you want to procrastinate,
    no matter how important you know it really is.


    Whether you like it or not, having a good set of tests — both automated and manual
    — ensures the quality of your software. When using Kotlin Multplatform, you’ll
    have enough tools at your hand to write tests. So if you’re thinking of letting
    it slide this time, you’ll have to come up with another excuse. :]




    Testing your code in the KMP world follows the same pattern you’re now familiar
    with. You test the code in the **common** module. You may also need to use the
    **expect/actual** mechanism as well. With this in mind, setting up the dependencies
    is structurally the same as it is with non-test code.


    From the starter project, open the **build.gradle.kts** inside the **shared**
    module. In the **sourceSets** block, add a block for **commonTest** source set
    after `val commonMain` by getting :


    ```

    ```kotlin

    val commonTest by getting {

    dependencies {

    implementation(kotlin("test-common"))

    implementation(kotlin("test-annotations-common"))

    }

    ```

    ```


    You’re adding two modules from the **kotlin.test** library. This library provides
    annotations to mark test functions and a set of utility functions needed for assertions
    in tests — independent of the test framework you’re using. The **common** in the
    name shows that you can use these inside your common multiplatform code. Do a
    Gradle sync.


    As you declared above, your test codes will be inside the **commonTest** folder.
    Create it as a sibling directory to **commonMain** by right-clicking the **src**
    folder inside the **shared** module and choosing **New ▸ Directory**. Once you
    start typing **commonTest**, Android Studio will provide you with autocompletion.
    Choose **commonTest/kotlin**.'
