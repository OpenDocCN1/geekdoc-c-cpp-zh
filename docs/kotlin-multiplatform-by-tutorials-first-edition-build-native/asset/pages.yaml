  md: "# # Fetching images\n\nIn the Android app, you were using Coil to fetch images.\
    \ Unfortunately, it currently doesn’t support Multiplatform, so you’ll migrate\
    \ this logic to a new one: Kamel.\n\nKamel uses Ktor (you can read more about\
    \ this library in Chapter 12, “Networking”) to fetch media. This API is similar\
    \ to Coil, so you won’t need to make many changes.\n\nOpen the build.gradle.kts\
    \ file from shared-ui and in the commonMain/dependencies section, add Kamel:\n\
    \n```\n```\napi(project(\":kamel-image\"))\n```\n```\n\nHere, you’re using a local\
    \ version of Kamel, since the current one doesn’t support the latest version of\
    \ Ktor.\n\nSynchronize the project.\n\nIn the shared-ui/components directory,\
    \ open ImagePreview.kt. This file contains the logic required to fetch an image\
    \ from the network and handles the request state: success, loading, and error.\n\
    \nThe AddImagePreview Composable first checks if the url is empty. If it isn’t,\
    \ it will create a request to download the image.\n\nKamel doesn’t deal with the\
    \ request directly in lazyPainterResource, so you can remove this logic. Update\
    \ the else clause to:\n\n```\n```\nelse {\n    Box {\n    //1\n    when (val resource\
    \ = lazyPainterResource(url)) {\n    //2\n    is Resource.Loading -> {\n    Logger.d(TAG,\
    \ \"Loading image from uri=$url\")\n    AddImagePreviewEmpty(modifier)\n    }\n\
    \    //3\n    is Resource.Success -> {\n    Logger.d(TAG, \"Loading successful\
    \ image from uri=$url\")\n\n    KamelImage(\n    resource = resource,\n    contentScale\
    \ = ContentScale.Crop,\n    contentDescription = \"Image preview\",\n    modifier\
    \ = modifier,\n    crossfade = true\n    )\n    }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 377
  md: "```\n```kotlin\n// ...\nis Resource.Failure -> {\n    Logger.d(TAG, \"Loading\
    \ failed image from uri=$url.\\nReason=${resource.exception}\")\n\n    AddImagePreviewEmpty(modifier)\n\
    }\n}\n}\n}\n```\n```\n\nHere’s a step-by-step breakdown of this logic:\n\n+  \
    \ 1. `lazyPainterResource` is part of the Kamel library, and it’s similar to the\
    \ `request` that you had before. It returns the current state of the request via\
    \ `Resource.*` which can either be `Loading`, `Success`, or `Failure`.\n+   \n\
    +   2. Handling the state of a request, in case it’s `loading`, this means that\
    \ the operation is ongoing. Visually, it will show an image placeholder that contains\
    \ the app’s logo.\n+   \n+   3. If the image is available, the result is a `success`.\
    \ An `Image` Composable is added with the received file.\n+   \n+   4. On the\
    \ contrary, if the result is a `failure`, you’ll display an empty preview.\n\n\
    With the image-fetching API migrated to Kamel, don’t forget to remove all the\
    \ Coil imports along with the `OptIn` annotation at the beginning of the file.\
    \ Scroll to the top of **ImagePreview.kt** and remove:\n\n```\n```kotlin\nimport\
    \ androidx.compose.ui.platform.LocalContext\nimport coil.annotation.ExperimentalCoilApi\n\
    import coil.compose.ImagePainter\nimport coil.compose.rememberImagePainter\nimport\
    \ coil.request.ImageRequest\n\n@OptIn(ExperimentalCoilApi::class)\n```\n```\n\n\
    # Using LiveData and ViewModels\n\n**learn** was built using **LiveData** and\
    \ **ViewModels** that are available in Android through the **runtime-livedata**\
    \ library. Since it contains Android-specific code, it won’t be possible to use\
    \ the same library in the desktop app.\n\nFortunately, there’s a strong community\
    \ around Kotlin Multiplatform and Compose that tries to reduce the gap between\
    \ Android and desktop and creates libraries that you can use on both platforms.\
    \ One of these libraries is **PreCompose**. It was written by [Tlaster](https://github.com/Tlaster)\
    \ and supports the Android Jetpack Lifecycle, ViewModel, LiveData and Navigation\
    \ components in Multiplatform."
