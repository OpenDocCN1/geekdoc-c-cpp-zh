    You did a couple of weird things here. Most importantly, you didn’t provide a
    useful actual implementation for `ScreenInfo`.


    Java doesn’t have a UI toolkit in itself. If a platform owner wants to use JVM
    and provide developers with a way to develop user interfaces, it creates a UI
    toolkit or uses one already available.


    You may have heard about Swing or Abstract Window Toolkit (AWT). Jetpack Compose
    for Desktop uses Swing internally to make window-based desktop applications. As
    of writing this book, Jetpack Compose for Desktop doesn’t provide a way to query
    screen information outside its composable methods.


    You can’t use Swing or AWT methods directly in the desktop section of the **shared**
    module, either. The problem is that this module is using **Android Gradle Plugin**.
    Because Android has its own UI toolkit and because of the way Android uses Java,
    there’s no way to have the `java` plugin alongside **Android Gradle Plugin**.
    Therefore, you can’t use AWT or Swing methods here.


    This issue has long been listed in both [Google Issue Tracker](https://issuetracker.google.com/)
    and [JetBrains YouTrack](https://youtrack.jetbrains.com/), and unfortunately,
    there’s no solution for it yet.


    Now it makes sense why you defined the `screen` property as optional and there’s
    no value for it on desktop.


    > **Note:** Since the Android Gradle Plugin is applied to the whole module, the
    IDE allows you to import Android-related classes such as `Log` or `DisplayMetrics`
    even inside the **Desktop** folder. However, using them will make your desktop
    app crash, since they’re not available at runtime.'
