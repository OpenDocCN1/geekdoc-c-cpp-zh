  md: '+   - For UI tests, you consult each platform’s provided solution: Jetpack
    Compose Tests for UIs created with Jetpack Compose and XCTest for UIs created
    with UIKit or SwiftUI.


    # Where to go from here?


    This chapter barely scratched the surface of testing. It didn’t talk about mocks
    and stubs, and it tried not to use third-party libraries, for that matter. There
    are a few libraries worth mentioning, though:


    +   - **Kotest**: A multiplatform Kotlin testing library with extended assertions
    and support for property testing. It can generate values for edge cases and random
    values.

    +   - **Turbine**: A small multiplatform library geared toward testing Kotlin
    Flows. This chapter didn’t talk about Coroutines and Flows. However, if you ever
    wanted to test those, take a look at Turbine as `kotlinx-coroutines-test` library
    doesn’t support Kotlin/Native yet.

    +   - **MockK**: This is the most famous library for mocking in Kotlin. Although
    there’s a multiplatform version available, it lacks support for iOS.


    If you want to learn more about testing in general, there are great resources
    out there, such as screencasts and articles, as well as these two books from raywenderlich.com:


    +   - Android Test-Driven Development by Tutorials

    +   - iOS Test-Driven Development by Tutorials'
