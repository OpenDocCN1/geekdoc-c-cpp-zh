- pgno: 153
  md: 'Controllers or Presenters: This is the layer you used to have in MVC as Controller
    or ViewModel in MVVM. They receive input from the outer layer and pass them to
    the next layer. You can combine MVVM and MVC with Clean Architecture. It’s also
    a good thing to do since the responsibilities of your controllers or ViewModels
    will decrease.


    Use Cases or Interactors: This layer defines the actions the user can trigger.
    The objects in the previous layer have access to use cases and can only call into
    the defined interactions. In the original definition of Clean Architecture, this
    is the layer you put your business logic in. As you’re free to add your layers,
    you can delegate this responsibility to inner layers as well.


    Entities: Abstract definitions of all the data sources. It can contain some business
    logic.


    While creating the Organize app, you’re going to use the MVVM design pattern.
    You’re free to choose any other pattern you like better for your applications.


    # ## Sharing business logic


    KMP shines when you try to minimize the duplicated code you write. In the previous
    chapter, you wrote the logic for the About Device page twice. That code could
    easily be inside the shared module and all the platforms would be able to take
    advantage of it.


    # ## Creating ViewModels


    Open the starter project in Android Studio. It’s mostly the final project of the
    previous chapter.


    Inside the presentation directory of the commonMain folder in the shared module,
    create a new file and name it BaseViewModel.kt.


    Fill the file with this line:


    ```

    expect abstract class BaseViewModel()

    ```


    You’re familiar with this line. This time, though, it’s defining an abstract class,
    which all our app’s ViewModels would extend. Next, you’re going to implement the
    actual implementations of this class on all three platforms.


    Put the cursor in the middle of the class name and press Alt+Enter. Android Studio
    will help you create all the needed actual files. Repeat the process until the
    red line below the class name showing the error for absent files disappears.'
