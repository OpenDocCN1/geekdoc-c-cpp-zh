- pgno: 345
  md: '# Nullability


    Perhaps the most known trait of Kotlin is its nullability. Ideally, there are
    no more **NullPointerExceptions** — in other words, exceptions triggered by calls
    to objects that don’t exist. The word “ideally” is needed here since developers
    have the final word and can always go against what the language advises.


    To define if a variable can be null, you need to use the `?` operator.


    You can see that `listener` has the type of `FeedData`, but its value can be `null`.
    Now, try to make any operation on this object. On `fetchAllFeeds`, before the
    `Logger` call, add:


    ```

    ```kotlin

    listener.onMyGravatarData(GravatarEntry())

    ```

    ```


    You’re sending an empty `GravatarEntry` since this parameter cannot be null. Looking
    at this instruction, you can see there’s a red underline under the `.`, with the
    message:


    > Only safe (?.) or non-null asserted (!!.) calls are allowed on a nullable receiver
    of type `FeedData`?


    Since this variable might be null, you shouldn’t do any operation before checking
    its value. There are two different possibilities here:


    +   1. Explicitly say that it won’t be null. You can use the character `!!` to
    tell the compiler that this value will never be `null`, so you can make any call
    that you need:


    ```

    ```kotlin

    listener!!.onMyGravatarData(GravatarEntry())

    ```

    ```


    Going against the language rules is never a good idea, so try to run away from
    this implementation.


    The equivalent in Swift to this annotation is just to use a single `!`.


    +   2. Only call the method if the value is not null. In this case, `listener`
    is mutable, so you can’t just add an `if` condition to see if it’s not null (since
    it might be changed by another thread). The solution is to use the `?` operator
    again. In this scenario it will only call `onMyGravatarData` if `listener` is
    not null:'
  merge: -1
  img_proc: true
