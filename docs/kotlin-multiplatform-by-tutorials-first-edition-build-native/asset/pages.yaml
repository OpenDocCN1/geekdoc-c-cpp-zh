  md: '# ## Model-View-ViewModel


    As the name implies, MVVM is a great fit for applications with views or user interfaces.
    Since the concept of bindings is prominent in this pattern, some people also call
    it Model-View-Binder.


    It’s much newer than MVC. John Gossman, one of Microsoft’s engineers, announced
    MVVM in his blog in 2005. Microsoft embraced MVVM in .NET frameworks and made
    this pattern very popular.


    Google introduced the architecture components in Google I/O 2017. This was the
    first time Google decided to recommend a design pattern for developing Android
    applications. Throughout the years, Google also introduced different tools and
    components around the concept of MVVM. Nowadays, MVVM is the first choice for
    most Android developers when developing an app.


    The components of MVVM are as follows:


    +   ■ Model: It’s much like the model layer of MVC. It represents the app data
    and rules.


    +   ■ View: Pretty much similar to the component with the same name in MVC. It
    represents the model, receives input from the user and forwards the handling of
    the input to the ViewModel via a link between View and ViewModel. People usually
    call this link a Binding.


    +   ■ ViewModel: ViewModel is basically the state of data in the model. It exposes
    some public methods and properties to which the View subscribes and receives the
    changes automatically. People call this mechanism Data Binding, or simply Binding.


    Android developers are no stranger to using LiveData, or recently, Kotlin Flow
    or StateFlow, as the Binder inside ViewModel.


    After Apple introduced the Combine framework and SwiftUI as a first-party solution
    to reactive programming and declarative UI, iOS developers started using the MVVM
    design pattern and the binding mechanism more and more.


    # ## Clean Architecture


    In 2012, Robert C. Martin, also known as Uncle Bob, published a post in his blog
    explaining the details of a new design pattern he came up with based on Hexagonal
    Architecture, Onion Architecture and many more.


    Clean Architecture has a steeper learning curve because it has more'
