  md: "If you have to update the UI, and you’re using `GlobalScope`, you must switch\
    \ to the UI-thread before. Otherwise, when running your iOS app, you’ll get the\
    \ following exception:\n\n> kotlin.native.IncorrectDereferenceException: illegal\
    \ attempt to access non-shared (...) from other thread\n\nYou also have the `coroutineScope`\
    \ function that allows you to create a coroutine, but it uses the parent scope\
    \ as context. It has some particularities, namely:\n\n+   - If the parent gets\
    \ cancelled, it will cancel all of its children.\n+   - Only after all the children\
    \ end can the parent also terminate.\n\n# Coroutine builders, scope and context\n\
    \nYou’ve seen how to start a coroutine by calling `launch`. This function is part\
    \ of the **coroutine builders**:\n\n+   - `runBlocking`: blocks the current thread\
    \ until the coroutine that it creates ends.\n\n> **Note:** It shouldn’t be used\
    \ inside an existing coroutine, since it will stop its execution.\n\n+   - `launch`:\
    \ Creates a coroutine without blocking the current thread. You can define the\
    \ **CoroutineScope** from where it should run. This scope guarantees structured\
    \ concurrency — in other words, a coroutine only ends after all of its children\
    \ have completed their operations.\n+   - `async`: Similar to `launch` in the\
    \ way it’s constructed and how it runs. It differs on its return type in that\
    \ in this case it’s not a **Job**, but it’s a **Deferred<T>** object that will\
    \ contain the future result of this function.\n\nReturn to the `fetchMyGravatar`\
    \ function and add below:\n\n```\nprivate suspend fun fetchMyGravatar(): GravatarEntry\
    \ {\n    return CoroutineScope(Dispatchers.Default).async {\n        feed.invokeGetMyGravatar(\n\
    \            hash = md5(GRAVATAR_EMAIL)\n        )\n    }.await()\n}\n```"
