    that are platform-specific. Although you can move all the files inside res folder
    to this new location, there are a couple of ones that don’t necessarily need to
    be shared, since they are Android-specific:


    +   ■ ic_launcher_background.xml, the app icon background.

    +   ■ colors.xml, colors used for XML attributes.

    +   ■ themes.xml, defines the window background.


    Move all the folders except values inside androidApp/res to shared-ui.


    With your code and its resources moved to a different module, you need to import
    it to the androidApp. Otherwise, MainActivity won’t be able to resolve its imports.


    Open build.gradle.kts from androidApp and in the dependencies section, below shared
    add:


    ```

    implementation(project(":shared-ui"))

