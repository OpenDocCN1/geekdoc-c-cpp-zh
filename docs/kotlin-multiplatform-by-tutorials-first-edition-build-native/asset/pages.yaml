  md: "```\n```kotlin\nfor (feed in content) {\n    fetchFeed(feed.platform, feed.url)\n\
    }\n```\n```\n\nHere, you’re iterating through all the values of `content`. Starting\
    \ with the first element in the list, on each iteration you’ll get a different\
