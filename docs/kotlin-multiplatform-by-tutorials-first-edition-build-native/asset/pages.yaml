- pgno: 252
  md: '# Challenges


    Here are some challenges for you to practice what you’ve learned in this chapter.
    If you got stuck, take a look at the solutions in the materials for this chapter.


    # Challenge 1: Load an RSS feed


    You’re currently loading the different sections from the **RW_CONTENT** property
    inside **FeedPresenter.kt**. In this challenge, you will:


    +   - Create an **RW_ALL_FEED** property that contains the RSS feed content of
    one of the feed URLs from **RW_CONTENT**.

    +   - Read this property and parse its content in the shared module so it can
    be available for all apps to use.

    +   - In **androidApp** and **desktopApp**, open the **FeedViewModel.kt** file
    inside **ui/home**, and populate **items** with this new data.

    +   - In **iOSApp**, open **FeedClient** inside **extensions**, and in the **fetchFeeds**
    function add the new feeds.


    # Challenge 2: Add tests to your implementation


    Now that you’ve implemented this new feature, you’ll add tests to guarantee your
    implementation is correct. Don’t forget to test scenarios where some attributes
    are not available on the JSON file or there are more than the ones available in
    **RWEntry.kt**.


    > **Note:** You should be able to read a JSON string containing the content to
    be serialized and access to the object afterward.


    # Key points


    +   - Exchanging data between local and remote applications requires the content
    that’s transferred be serialized and deserialized, depending on if it’s being
    sent or received, respectively.

    +   - **kotlinx.serialization** is a multiplatform library that supports serialization.
    It allows serializing/deserializing **JSON, Protocol buffers, CBOR, Properties,
    HOCON, YAML** and **Apache Avro**.

    +   - You can create custom serializers by implementing the serialize/deserializer
    for a custom type and then associating it with that class.'
