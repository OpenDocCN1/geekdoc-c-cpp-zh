    # Getting to know SwiftUI


    Creating the project using the KMM plugin creates two Swift files: **ContentView.swift**
    and **iOSApp.swift**. These two files are like a “Hello World” app. They show
    a text field in the center of the screen with the word “Hello”. The plugin adds
    several files to make development easier.


    # App


    Open **iOSApp.swift**:


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_85_0.png)


    The starting point in a SwiftUI app is a struct that’s marked with the `@main`
    attribute above the struct. This struct usually implements the `App` protocol.
    The `App` protocol requires you to create a variable named `body` that returns
    a `Scene`. A `Scene` is a container for the root view of a view hierarchy. A `WindowGroup`
    is a `Scene` and is also a container for your views. On iOS, this will contain
    only one window, but on macOS and iPadOS, it can contain multiple windows. Since
    it’s a single expression, a return isn’t required. None of the names of these
    files are special — the only important piece is to instruct the compiler where
    to start the app, and you do that with the `@main` tag.


    Since `iOSApp` doesn’t describe what your app does, rename the file to `TimezoneApp`
    by selecting it in the left sidebar and pressing **Return**. Type `TimezoneApp`
    and press return again. Next, change `struct iOSApp: App` to `struct TimezoneApp:
    App`.


