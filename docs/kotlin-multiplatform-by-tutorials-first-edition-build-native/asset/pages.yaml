- pgno: 309
  md: '# # 14 Creating Your KMP Library


    Written by Carlos Mota


    In the previous chapters, you’ve built **learn** for Android, iOS and desktop.
    All of these apps fetch the raywenderlich.com RSS feed and show you the latest
    articles written about Android, iOS, Flutter and Unity. You can search for a specific
    topic or save an article locally to read it later. During the app’s development
    process, you’ve worked with:


    +   - Serialization

    +   - Networking

    +   - Databases

    +   - Concurrency


    And, along this journey, you’ve also built additional tools that can be reused
    in other projects:


    +   - Logger

    +   - Dispatchers


    In this chapter, you’re going to learn how you can create and publish a library
    so you can reuse it in the other apps that you develop in this book — and for
    the next one you’re going to build. :]


    # ## Migrating an existing feature to Multiplatform


    Throughout this book, you’ve learned how to develop a project that had a library
    already shared across different platforms. However, you may want to migrate an
    existing app to Kotlin Multiplatform.


    In this section, you’re going to see how a simple feature like opening a website
    link in a browser can easily be moved to KMP.


    # ### Learning how to open a link in different platforms


    In **learn**, when you click on an article, a web page opens — whether it’s on
    Android, iOS or desktop. The behavior is similar on all three platforms, although'
  merge: -1
  img_proc: true
