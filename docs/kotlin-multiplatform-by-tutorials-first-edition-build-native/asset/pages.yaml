- pgno: 281
  md: '# # 13 Concurrency


    *Written by Carlos Mota*


    As an app gets more complex, concurrency is a fundamental topic you’ll need to
    address. **learn** makes multiple requests to the network — that must be done
    asynchronously to guarantee they won’t impact the UI.


    > **Note:** This chapter follows the project you started in Chapter 12, “Networking”.
    Or, you can use this chapter’s starter project.


    Here’s what you’ll do in this chapter:


    +   - You’ll learn what coroutines are and how you can implement them.

    +   - You’ll enable the new Kotlin/Native memory model.


    # ## The need for structured concurrency


    Structured concurrency allows doing multiple computations outside the UI-thread
    to keep the app as responsive as possible. It differs from concurrency in the
    sense that a task can only run within the scope of its parent, which cannot end
    before all of its children.


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_281_0.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: "![](img/2f50555a40af4ea8c85f09e577f0c5b9_282_0.png)\n\nTo improve its performance,\
    \ these three tasks are running in the same thread, but concurrently to each other.\
    \ They were divided into smaller segments that run independently.\n\nStructured\
    \ concurrency recently gained a lot of popularity with the releases of **kotlinx.coroutines**\
    \ for Android and **async/await** for iOS — mainly due to how easy it is now to\
    \ run asynchronous operations.\n\n# Different concurrency solutions\n\nThere’s\
    \ a set of libraries built for Kotlin Multiplatform that support concurrency:\n\
    \n+   - **kotlinx.coroutines**: The most popular one, mostly because of its use\
    \ among Android developers and recommendation from JetBrains and Google. It’s\
    \ lightweight, it allows running multiple coroutines in a single thread and it\
    \ supports exception handling and cancellation.\n+   - **Reaktive**: An implementation\
    \ of Reactive Extensions using the **Observable** pattern.\n+   - **CoroutineWorker**:\
    \ Supports multithreaded coroutines.\n\nIn this chapter, you’ll learn how to use\
    \ **kotlinx.coroutines**. Spoiler alert: You’ve already worked with coroutines\
    \ before. ;]\n\nIf you’re already familiar with coroutines, you can skip the next\
    \ few sections and go to “Structured concurrency in iOS”, or directly to “Working\
    \ with kotlinx.coroutines”, for the next developments in **learn**.\n\n# Understanding\
    \ kotlinx.coroutines\n\n**Ktor** uses coroutines to make network requests without\
    \ blocking the UI-thread, so you’ve already used them unwittingly in the previous\
    \ chapter.\n\nOpen the **FeedPresenter.kt** file from **shared/commonMain/presentation**\
    \ and search for `fetchAllFeeds` and `fetchFeed`. In the first function, you’ve\
    \ got:\n\n```\n```kotlin\nfor (feed in content) {\n  fetchFeed(feed.platform,\
    \ feed.url)\n}\n```\n```"
