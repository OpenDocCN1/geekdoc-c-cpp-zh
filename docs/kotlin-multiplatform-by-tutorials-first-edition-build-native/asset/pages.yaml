    \ languages. You just need to use the keyword `as` followed by the type of the\
    \ class that you want to cast.\n\n# Converting between different types\n\nYou\
    \ can easily convert between primitive types by calling `.to<>()` for the type\
    \ that you want:\n\n```\n```kotlin\n// Convert String to Integer\n\"raywenderlich\"\
