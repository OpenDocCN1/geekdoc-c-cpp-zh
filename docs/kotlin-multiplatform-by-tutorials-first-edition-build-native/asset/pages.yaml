    \n  )\n\n  val decoded = Json.encodeToString(RWContent.serializer(), data)\n\n\
    \  val content = \"{\\\"platform\\\":\\\"all\\\",\\\"url\\\":\\\"https://www.raywenderlich.com/feed...\"\
    \n```\n```"
