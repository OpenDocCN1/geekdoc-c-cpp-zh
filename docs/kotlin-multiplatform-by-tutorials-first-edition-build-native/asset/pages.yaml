- pgno: 340
  md: '# ## Appendix A: Kotlin: A Primer for Swift Developers


    Written by Carlos Mota


    Kotlin is a language developed by JetBrains that gained popularity and wide adoption
    when Google announced that from that point on, all of their Android libraries
    would no longer be written in Java. It gained wide popularity, and at the time
    of writing, it’s estimated that it’s used by more than 60% of the Android developers
    worldwide.


    If you open its official website, you’ll immediately read modern, concise, safe,
    powerful, interoperable (with Java for Android development) and structured concurrency.
    All of these keywords are functionalities that developers look for in any programming
    language, and Kotlin has all of them.


    Even more importantly, Kotlin is not only for Android. It also supports Web front-end,
    server-side and — the focus of your work throughout this book — Multiplatform.


    # ## Kotlin and Swift: Comparing both languages


    The syntax between both languages is quite similar. If you’re a Swift developer,
    you can easily program in Kotlin. This appendix shows you how to start.


    The examples shown in this appendix are code snippets from learn. A final version
    of the project is available in the materials repository.


    # ## Basics


    In this section, you’ll learn the Kotlin basics — or as Swift developers are familiar
    with, its foundations. :]


    One good thing about Android Studio is that in most cases, if you’re missing an
    import or using a wrong type for a variable, it will automatically warn you and
    suggest a fix.


    > Note: Every time Android Studio underlines your code or shows a tooltip box,
    you can automatically accept its suggestion by pressing Alt-Enter.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'The extension of a Kotlin file is .kt. The tree hierarchy of a Multiplatform
    project typically follows the Android naming convention for package names — you’ve
    got three folder levels. In learn, it’s com/raywenderlich/learn, and they usually
    correspond to:


    +   • com, domain

    +   • raywenderlich, company name

    +   • learn, app name


    Since the package name is unique — you can’t have two apps on the Google Play
    Store with the same one — this convention guarantees there is no conflict between
    apps from different companies.


    Every time you declare a new class or object, you must define the package declaration.
    This should be the first instruction of a new file. Or, if you have a copyright
    header, right after it.


    If you open the FeedPresenter.kt inside the presentation folder from the shared
    module, you can see that the import is:


    > package com.raywenderlich.learn.presentation


    In this case, presentation is the subfolder where this class is. The package definition
    should correspond to the same tree hierarchy — otherwise, you might end up importing
    the wrong files.


    There’s no package declaration to add in Swift.




    Typically, when an import is missing, Android Studio shows you a prompt with one
    or more suggestions, so you shouldn’t have any issues. In any case, if you want
    to add one manually, you need to add it after the package declaration:


    > import com.raywenderlich.learn.data.model.GravatarEntry


    This is different from Swift. There’s no need to add classes — you just need to
    import the framework you’re going to use.'
  merge: -1
  img_proc: true
