  md: '# 7 App Architecture


    In the previous chapter, you started creating the Organize app. However, you didn’t
    make it to the organization part. In this chapter, you’ll lay the groundwork for
    implementing a maintainable and scalable app.


    Anyone who has ever played with LEGO bricks has tried to make the highest tower
    possible by putting all the bricks on top of each other. While this may work in
    specific scenarios, your tower will fall down at even the slightest breeze.


    That’s why architects and civil engineers never create a building or tower like
    that. They plan extensively so their creations stay stable for decades. The same
    applies to the software world.


    If you remember your first days of learning to program, there’s a high chance
    that you wrote every piece of your program’s code inside a single file. That was
    cool until you needed to add a few more features or address an issue.


    Although the term software architecture is relatively new in the industry, software
    engineers have applied the fundamental principles since the mid- 1980s.


    # Design patterns


    The broad heading of software architecture consists of numerous subtopics. One
    of these is architectural styles — otherwise known as software design patterns.
    This topic is so substantial that many people use software design patterns to
    refer to the software architecture itself.


    Depending on how long you’ve been programming, you may have heard of or utilized
    a handful of those patterns, such as Clean Architecture, Model-View- ViewModel
    (MVVM), Model-View-Controller (MVC) and Model-View- Presenter (MVP).


    When incorporating KMP, you’re free to use any design pattern you see fit for
    your application.


    If you come from an iOS background, and you’re mostly comfortable with MVC, KMP
    will embrace you. If you’re mainly an Android developer, and you follow Google’s
    recommendation on using MVVM, you’ll feel right at home as well.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'There is no best or worst way to do it.


    Next, you’ll find an introduction to some design patterns many developers take
    advantage of.


    # Model-View-Controller


    The MVC pattern’s history goes back to the 1970s. Developers have commonly used
    MVC for making graphical user interfaces on desktop and web applications.


    In the mobile world, Apple made MVC mainstream when it introduced the iPhone SDK
    in 2008. If you did iOS development before SwiftUI, you may have noticed that
    one of the base components was a `UIViewController`. It speaks for itself how
    Apple heavily invested in this pattern.


    For long years before Google became opinionated about Android development patterns
    and architectures, developers used Model-View-Presenter, or **MVP**, which is
    a close deviation of MVC.


    In MVC, you partition your code into three separate camps:


    +   - **Model:** The central component of the pattern. It’s completely independent
    of the UI and handles the logic and rules of the application.

    +   - **View:** Any representation of information, such as lists, grids, etc.
    This section is usually platform- and framework-dependent. You can use UIKit and
    SwiftUI on iOS and Views or Jetpack Compose on Android.

    +   - **Controller:** Accepts input and converts it to commands for model or view.
    It also receives feedback from the model and reflects the changes to the view.
    It’s somehow the know-it-all of the pattern.


    The diagram below shows the relationship between the different partitions:


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_150_0.png)'
