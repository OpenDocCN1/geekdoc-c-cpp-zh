    Synchronize and wait for this operation to finish.


    Once done, open MainActivity.kt. All the imports should now be resolved. Nevertheless,
    the view models still need to be addressed. Because they’re Android-specific,
    you need to use an external library to support them when targeting Multiplatform.
    You can read more about this in the “Use LiveData and ViewModel” section of this
    chapter.


    # Compose Multiplatform


    Jetpack Compose was initially introduced for Android as the new UI toolkit where
    one could finally leave the XML declarations and the findViewById calls'
