- pgno: 251
  md: "This `serializers` property contains the **serializer** you’ll need to encode\
    \ and decode your data.\n\nStart by creating an encoding test:\n\n```\n```kotlin\n\
    @Test\nfun testEncodeCustomPlatformAll() {\n    val data = PLATFORM.ALL\n\n  \
    \  val encoded = Json.encodeToString(serializers.serializer(), data)\n    val\
    \ expectedString = \"\\\"all\\\"\"\n    assertEquals(expectedString, encoded)\n\
    }\n```\n```\n\nWhen you receive a response, the body is a string response in a\
    \ JSON format:\n\n```\n```json\n{\n  \"platform\":\"all\",\n  \"url\":\"https://www.raywenderlich.com/feed.xml\"\
    ,\n\n  \"image\":\"https://assets.carolus.raywenderlich.com/assets/razeware_460-\n\
    308933a0bda63e3e327123cab8002c0383a714cd35a10ade9bae9ca20b1f438b.png\"\n}\n```\n\
    ```\n\nTo test if **RWSerializer** is working correctly on the test above, check\
    \ if the result corresponds to the JSON response `\"all\"` after encoding the\
    \ `PLATFORM.ALL` property into a string.\n\nIf it does, the `assertEquals` function\
    \ will return true, otherwise the test will fail.\n\nNow, add the decoder test:\n\
    \n```\n```kotlin\n@Test\nfun testDecodeCustomPlatformAll() {\n    val data = PLATFORM.ALL\n\
    \n    val decoded = Json.decodeFromString<PLATFORM>(data.value)\n    assertEquals(decoded,\
    \ data)\n}\n```\n```\n\nHere, you’re doing the opposite. From the string “all”,\
    \ returned from `data.value`, you want the corresponding `PLATFORM` enum value.\
    \ For that, you call `decodeFromString` and confirm if the returned object is\
    \ the one you’re expecting."
