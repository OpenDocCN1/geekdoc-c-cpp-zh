  md: '# # 11 Serialization


    Written by Carlos Mota


    Great job on completing the first two sections of the book! You’re doing great.
    Now that you’re familiar with Kotlin Multiplatform, you have everything you need
    to tackle the challenges of this last section.


    Here, you’ll start making a new app called **learn**. It’s built on top of the
    concepts you learned in the previous chapters, and it introduces a new set of
    concepts, too: serialization, networking and how to handle concurrency.


    **learn** uses the raywenderlich.com RSS feeds to show the latest tutorials for
    Android, iOS, Unity and Flutter. You can add them to a read-it-later list, share
    them with a friend, search for a specific key, or just browse through everything
    the team has released. It will have the same look and feel you’re already used
    to from the raywenderlich.com website.


    # ## The need for serialization


    Your application can send or receive data from a third party, either a remote
    server or another application in the device. Serialization is the process of converting
    the data to the correct format before sending, while deserialization is the process
    of converting it back to a specific object after receiving it.


    There are different types of serialization formats — for instance, JSON or byte
    streams. You’ll read more about this in Chapter 12, “Networking,” when covering
    network requests.


    Android uses this concept to share data across activities, services or receivers
    — either in the same application or to third-party apps. The difference is that
    instead of relying on `Serializable` to send data from custom types, the OS requires
    you to implement `Parcelable` to send these objects.


    # ## Project overview


    To follow along with the code examples throughout this section, download the **starter**
    project and open **11-serialization/projects/starter** with Android Studio.


    > > **Note:** This project uses Jetpack Compose 1.2.0-alpha01 and Multiplatform'
