- pgno: 374
  md: 'In this image, you can see that Jetpack Compose can be spliced into the:


    +   Compose UI Toolkit, which is platform-specific.


    +   Compose Plugins, which contains the Compose runtime and compiler.


    By changing the Compose UI Toolkit, you can use Compose on other platforms.


    With the <u>Compose Multplatform</u>, JetBrains provided this exact support. It
    allows using Compose both for desktop and web. In this book, you’ve seen how to
    develop an app for the first platform and run it on macOS, Windows and Linux.




    The desktop app is already using Compose for desktop through the JetBrains Compose
    plugin. To make Android and desktop share the same UI, the <u>shared- ui</u> module
    needs to use the same one, instead of the Android version you’re using in the
    <u>androidApp</u>.


    This is required because there’s currently a limitation between both Android and
    Multplatform Compose frameworks. Google and JetBrains launch libraries updates
    at different times. This means that one of the Compose UI Toolkits might be using
    a version that may not be compatible with the other one. Since you’re sharing
    UIs between different applications, you need to guarantee that everything works.
    You can track the progress of this <u>issue</u> on Google’s IssueTracker.


    It’s worth mentioning that to keep everything stable, the <u>org.jetbrains.compose</u>
    plugin replaces the <u>androidx.compose.*</u> artifacts with the ones from JetBrains.
    This is a temporary <u>solution</u> to deal with these different versions.




    Open the <u>BookmarkContent.kt</u> file from <u>shared-ui</u>. Here you’ll see
    that the imports to <u>androidx.compose*</u> are not being resolved.


    You need to add the Compose Multiplatform plugin and its libraries to solve this.
    Open the <u>build.gradle.kts</u> file from <u>shared-ui</u> and import JetBrain’s
    Compose. In the <u>plugins</u> section, before <u>com.android.library</u>, add:


    ```

    id("org.jetbrains.compose") version "1.1.0"

    ```'
