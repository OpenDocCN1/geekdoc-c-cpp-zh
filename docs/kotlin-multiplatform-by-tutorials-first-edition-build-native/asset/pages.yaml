    \ create the corresponding **PlatformParcelable.kt** file. Open it and add:\n\n\
    ```\n```kotlin\npackage com.raywenderlich.learn.platform\n\nactual typealias Parcelable\
    \ = android.os.Parcelable\nactual typealias Parcelize = kotlinx.android.parcel.Parcelize\n\
    ```\n```\n\nSince `Parcelable` and `Parcelize` already exist on the Android platform,\
    \ there’s no need to create them. Instead, use `typealias` to create a reference\
    \ link between the expected class and the actual class itself. In other words,\
    \ it’s as if you’re calling **android.os.Parcelable** or **kotlinx.android.parcel.Parcelize**\
    \ directly.\n\n> **Note:** Type aliases don’t create a new type of data, but instead\
    \ create a link to an existing one. Get more information about Kotlin’s **typealias**\
    \ directly from the [official documentation](...)."
  merge: -1
