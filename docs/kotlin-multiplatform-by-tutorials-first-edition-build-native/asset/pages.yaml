- pgno: 373
  md: 'behind and shift towards a new paradigm – declarative UI. It’s a more concise
    and modern approach – decoupled from API versions, it empowers you to create apps
    faster.


    > **Note:** You can learn more about Jetpack Compose for Android in Chapter 3,
    Developing UI, and by reading the Jetpack Compose by Tutorials from raywenderlich.com.


    If you look at the [official documentation](https://developer.android.com/jetpack/compose)
    for Jetpack Compose, you can see that, at the time of writing, it’s *composed*
    of seven libraries:


    +   - **compose.animation**: Animations that you can easily use.

    +   - **compose.material**: The material design system to use on components.

    +   - **compose.material3**: The newest version of material design.

    +   - **compose.foundation**: Contains the basic building Composables – Column,
    Text, Image, and so on.

    +   - **compose.ui**: Handles input management, drawing and layouts.

    +   - **compose.runtime**: It’s platform-agnostic, which means that it doesn’t
    know what Android or UI are. It can be seen as a tree-management solution.

    +   - **compose.compiler**: Transforms the `@Composable` into UI.


    They can be structured into the following high-level diagram:


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_373_0.png)'
