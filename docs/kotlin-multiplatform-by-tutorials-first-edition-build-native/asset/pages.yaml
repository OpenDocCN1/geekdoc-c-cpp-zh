  md: "# Hour sheet\n\nYou’ll want to show the hours that are available to meet. You\
    \ can do that by showing the hours in a sheet, which in this case, is a modal\
    \ dialog). This is a simple view with a list of hours and a dismiss button. Create\
    \ a new SwiftUI View named **HourSheet.swift** in the iOSApp folder. Remove the\
    \ `Text` view, and then add the following two variables right at the beginning\
    \ of the view:\n\n```\n```swift\n@Binding var hours: [Int]\n@Environment(\\.presentationMode)\
    \ var presentationMode\n```\n```\n\nThe first variable is an array of hours the\
    \ caller will pass in. The second one is the `showHoursDialog` `Boolean`. This\
    \ will hide the dialog by setting this variable to false. Add the following inside\
    \ `body`:\n\n```\n```swift\n// 1\nNavigationView {\n    // 2\n    VStack {\n \
    \       // 3\n        List {\n            // 4\n            ForEach(hours, id:\
    \ \\.self) { hour in\n                Text(\"\\(hour)\")\n            }\n    \
    \    } // List\n    } // VStack\n    .navigationTitle(\"Found Meeting Hours\"\
    )\n    // 5\n    .toolbar {\n        ToolbarItem(placement: .navigationBarTrailing)\
    \ {\n            Button(action: {\n                presentationMode.wrappedValue.dismiss()\n\
    \            }) {\n                Text(\"Dismiss\")\n                    .frame(alignment:\
    \ .trailing)\n                    .foregroundColor(.black)\n            }\n  \
