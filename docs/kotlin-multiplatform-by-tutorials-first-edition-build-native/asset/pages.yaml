- pgno: 361
  md: '# # Appendix B: Debugging Your Shared Code From Xcode


    Written by Carlos Mota


    Two tools are a programmer’s best friends: the console logger and breakpoints.
    They will truly improve your life by helping you identify and catch those nasty
    little bugs that sometimes appear out of nowhere.


    You’ve used the logger throughout this book. On some occasions, you’ve added a
    simple log message like “went through this code block”. On other occasions, you’ve
    printed all the variables in a method. Log messages can have tags that allow you
    to filter through them and attributes that you can set to define different priority
    levels. This can help you easily understand where something went wrong.


    Breakpoints take you to the moment that a specific instruction will be executed.
    You can see all the steps that lead to this stop and all that will succeed. Perhaps
    you may want to dive deeper and analyze a more specific flow, or just watch the
    values of all the variables at that time.


    Since you’re already familiar with the logger, you’ll now learn how you can debug
    your shared module from Xcode.


    # ## Debugging the shared module


    Both Android Studio and Xcode have great debugging capabilities. The native code
    is simple to debug on both IDEs. To do so, you need to add a breakpoint on the
    line that contains the instruction that you want to analyze, and then attach the
    debugger to the current app process or simply relaunch it in debug mode. For both
    options, the app halts before executing that instruction.


    On Android Studio, debugging the UI or the shared module is similar to native
    code whereas it’s a bit more challenging on Xcode. Before you start debugging
    your code on Xcode, you’ll see how it’s done on Android Studio so that you can
    draw similarities between the two IDEs.


    # ## Debugging in Android Studio


    The steps required to debug the shared module are the exact steps described earlier
    — but instead of adding a breakpoint on the Android app, you need to add it on
    the **shared** module.'
