- pgno: 254
  md: '# # 12 Networking

    **Written by Carlos Mota**


    Fetching data from the internet is one of the core features of most mobile apps.
    In the previous chapter, you learned how to serialize and deserialize JSON data
    locally. Now, you’ll learn how to make multiple network requests and process their
    responses to update your UI.


    By the end of the chapter, you’ll know how to:


    +   - Make network requests using Ktor.

    +   - Parse network responses.

    +   - Test your network implementation.


    # ## The need for a common networking library


    Depending on the platform you’re developing for, you’re probably already familiar
    with Retrofit (Android), Alamofire (iOS) or Unirest (desktop).


    Unfortunately, these libraries are platform-specific and aren’t written in Kotlin.


    > **Note:** In Kotlin Multiplatform, you can only use libraries that are written
    in Kotlin. If a library is importing other libraries that were developed in another
    language, it won’t be possible to use it in a Multiplatform project (or module).


    Developers needed a new library — a library that could provide the same functionalities
    as the ones mentioned above, but was built for Multiplatform applications. With
    that in mind, Ktor was created.


    # ## Using Ktor


    Ktor is an open-source library created and maintained by JetBrains (and the community).
    It’s available for both client and server applications.


    It’s fully written in Kotlin and uses coroutines for asynchronous calls. In the
    upcoming sections, you’ll see how easy it is to use it in your applications.


    > **Note:** Find more information about Ktor on the [official website](...).'
  merge: -1
  img_proc: true
- pgno: 255
  md: "# # Adding Ktor\n\nOpen **build.gradle.kts** from **shared**. Inside the `commonMain`\
    \ `dependencies` section, add the following dependencies at the end:\n\n```\n\
    ```kotlin\nimplementation(\"io.ktor:ktor-client-core:2.0.0-beta-1\")\nimplementation(\"\
    io.ktor:ktor-client-serialization:2.0.0-beta-1\")\n```\n```\n\nHere, you’re adding\
    \ the Ktor core library along with the serialization library that it will use\
    \ to parse the responses and transform the data into objects the app can process.\n\
    \nKtor has different HTTP client engines depending on the platform to which you’re\
    \ compiling the project. Although desktop doesn’t require a specific library,\
    \ since you’re also targeting Android and iOS, you’ll need to add the following\
    \ in `androidMain` and `iosMain` respectively:\n\n```\n```kotlin\nimplementation(\"\
    io.ktor:ktor-client-android:2.0.0-beta-1\")\n```\n```\n\n```\n```kotlin\nimplementation(\"\
    io.ktor:ktor-client-ios:2.0.0-beta-1\")\n\nimplementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.0-native-mt\"\
    ) {\n    version {\n        strictly(\"1.6.0-native-mt\")\n    }\n}\n```\n```\n\
    \nLooking at the iOS implementation, you’ll see that you’ve also set a specific\
    \ version of the `kotlinx-coroutines`. This is required because the coroutines\
    \ version that’s bundled with Ktor only supports single-thread usage. You can\
    \ read more about this in Chapter 13, “Concurrency”.\n\nThe recommended version\
    \ for Kotlin 1.6.10 is to use `1.6.0-native-mt`.\n\n> > **Note:** You need to\
    \ add this version to the `iOSMain` dependencies section and not on `commonMain`\
    \ because the constraint is with iOS.\n\nClick **Sync Now** to synchronize and\
    \ wait for Android Studio to fetch and import these new libraries.\n\n# ## Connecting\
    \ to the API with Ktor"
