  md: '5. When the app reaches a breakpoint, it suspends. No more code will be executed
    without a user action. This one allows the app to resume and continue until it
    finds another breakpoint.


    6. Step over. You can go to the next instruction without needing to add another
    breakpoint.


    7. With the step into action, you can access the method that’s going to be invoked.


    8. Step out from the current execution. The app will continue to run until this
    method returns.


    9. By right-clicking in this area, you can select “Add Expression...” and the
    instruction that you want to monitor will be displayed in this list.


    As you can see, the Kotlin Native Xcode Support Plugin is a great tool to debug
    your business logic from Xcode.




    There isn’t an option to uninstall a plugin directly from Xcode. The best solution
    is to close the IDE and go directly to the directory where they’re installed:


    ```

    ~/Library/Developer/Xcode/Plug-ins/

    ```


    Remove the ones that are no longer needed. In this case, it’s the Kotlin.ideplugin.




    Well done! Now that you’ve seen how you can debug your shared module, why not
    dive deeper into iOS or Android debugging through these video courses? Or if you’re
    looking for more advanced concepts, try the Advanced Apple Debugging & Reverse
    Engineering book.


    In the next appendix, you can learn how to reuse your UI between Android and desktop.
    Now that you know how to share your business logic, see how you can also share
    your Compose UI.


    See you there. :]'
