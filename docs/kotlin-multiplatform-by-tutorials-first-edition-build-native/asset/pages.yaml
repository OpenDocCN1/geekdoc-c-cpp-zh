  md: 'This chapter doesn’t help you with adding the UI for setting due dates on reminders.
    Set a due date for yourself to add due date support to Organize! :]


    # Adding Coroutines


    Take a look at how you set up `RemindersViewModel`, and you’ll remember that you
    needed to invoke the `onRemindersUpdated` lambda to notify users of the ViewModel
    of potential changes.


    This gets the job done; however, you can achieve the same result as well as many
    additional features by using a more robust solution, such as a Kotlin Flow.


    Kotlin Flow lets you observe streams of data. They’re sequential and can emit
    individual values for an observer to process.


    Kotlin Coroutines are the building blocks of Flows. You can’t collect values out
    of a Flow without using Coroutines. In other words, you use Flows when you want
    to observe multiple asynchronously computed values. The asynchronous keyword in
    Kotlin will immediately bring up the `suspend` functions concept, for which you
    need to be acquainted with Coroutines to work on.


    SQLDelight will let you consume a database query as a Flow. For this to work,
    you need to use some extension methods defined in the Coroutines Extensions library
    of SQLDelight. You should set up your app to work with Coroutines in the first
    place.


    Multithreaded programming is difficult. Coroutines have come to simplify it for
    developers. However, working with Coroutines in an environment besides JVM, such
    as on iOS, has always been a hassle.


    Recently, JetBrains has been touting a new memory model for Kotlin Native, which
    promises to simplify working with Coroutines on native platforms as well. You’re
    going to get acquainted with that in the coming chapters.


    Hence, for brevity, this chapter doesn’t talk about using SQLDelight with Kotlin
    Flows.


    # Challenge


    Databases have four basic operations: Create, Read, Update and Delete, a.k.a.
    **CRUD**. In Organize, you used three of those operations. Implementing the only
    remaining one — Delete — is a good candidate for a challenge.


    # Challenge: Adding support for deleting reminders'
