    \nFortunately, `JdbcSqliteDriver` has another constructor, which takes a path\
    \ to the database in the form of `jdbc:sqlite:PATH`. The `PATH` can either be\
    \ relative or absolute. You can use that initializer, however, you should pay\
    \ attention to the `create` method. You should call it only once. If you try to\
    \ call `create` on an existing database, the app will crash.\n\nFor you to see\
    \ this in action, you can set up the driver as follows for the first launch:\n\
