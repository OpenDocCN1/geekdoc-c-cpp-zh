- pgno: 208
  md: '+   - Dependency Injection is a necessary step to take for having a maintainable,
    scalable and testable codebase.

    +   - You can inject dependencies into classes manually, or use a library to do
    all the boilerplate codes for you.

    +   - Koin is a popular and declarative library for DI, and it supports Kotlin
    Multiplatform.

    +   - You declare the dependencies as modules, and Koin resolves them at runtime
    when needed.

    +   - When testing your code, you can take advantage of Koin to do the injections.

    +   - You can test if Koin can resolve the dependencies at runtime using `checkModules`
    method.

    +   - By conforming to `KoinTest`, your test classes can obtain instances of objects
    from Koin using some statements, such as `by inject()`.


    # Where to go from here?


    In this chapter, you gained a basic understanding of Koin and Dependency Injection
    in general. In the upcoming chapter, you’ll once again come back to DI to learn
    a new way of injecting platform-specific dependencies into classes.


    To learn more about Koin in particular, the best source may be the [official documentation](official
    documentation), which is rather concise and self-explanatory, while covering numerous
    scenarios.


    As mentioned in the chapter, there are other DI libraries as well. However, either
    those don’t work in Multiplatform scenarios, or they’re not as famous as Koin.


    If you aren’t targeting Multiplatform, you can consult **Hilt** and **Dagger**
    on Android. In the iOS world, there isn’t a go-to library. However, **Resolver**
    has recently gained a bit of traction.


    For testing in particular, Koin also provides you with a way to mock or stub different
    objects.'
