    \nThat concludes integrating the Multplatform Settings library into Organize.\n\
    \n\n\nA database is an organized collection of data. Whenever you’re dealing with\
    \ a structured set of data that you need to access in a certain way, it’s a good\
    \ choice to use a database over directly messing with the file system.\n\nAlthough\
    \ databases have many kinds and models, relationally based ones such as SQLite\
    \ have been the most popular among mobile developers.\n\nFor instance, Core Data,\
