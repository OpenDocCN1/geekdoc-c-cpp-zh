    # Sharing tests and UI


    By sharing business logic, you reduced the code you need to write for each platform
    to their respective UI code.


    In the next chapter, you’re going to add tests to the project. Since all the business
    logic now resides in a single place, you’re going to write a single set of tests.
    Hence, you’ll write fewer test codes — which means you’re secretly rejoicing!


    You might have thought it was a little weird to copy and paste code between Android
    and desktop. And, you might be thinking of a way to share these pretty similar
    pieces of code. Since you’ve been using Jetpack Compose for both of these platforms,
    there are a couple of ways to share these codes. You’ll learn more about one option
    in **Appendix 3**.


    One thing to notice is that sharing UI code may not always be a good decision
    for a couple of reasons:


    +   - You may have noticed that the desktop app looks a bit weird aesthetically.
    It’s adhering to Material Design guidelines, which isn’t a typical approach on'
