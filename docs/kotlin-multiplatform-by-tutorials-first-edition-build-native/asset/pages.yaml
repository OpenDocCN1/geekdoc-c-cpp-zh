- pgno: 311
  md: 'The `getDesktop` call returns an instance of `Desktop` that contains its context
    as well as a couple of functions that let you access some of your computer’s features
    — like open and edit files, browser, mail, print, and more. Here, you’re using
    `browse` to open your default browser with the `url` from the item that you click
    on.


    The `try`...`catch` block is necessary — according to the documentation, on some
    platforms, the desktop API might not be available. This might lead to unwanted
    behaviors. Following this approach guarantees that in the worst case, although
    the app won’t open a link, it also won’t crash.


    > **Note:** Alternatively, you could also use `isDesktopSupported` to check if
    the desktop API is available. In any case, be careful, because calling `browse`
    might trigger an `IOException`.


    Now that you’re familiar with how the three platforms open a URL, it’s time to
    move this logic to KMP.


    # Adding a new module


    The first thing to decide is if you want to move this logic to the existing **shared**
    module or create a new one. Since adding a new library also requires you to migrate
    the code, you’re going with this more complete solution.


    The first step is to add a new **KMM Module**. Go to **File ▸ New ▸ New Module...**,
    and select the **Kotlin Multiplatform Shared Module** template on the bottom of
    the list. Here, define the:


    +   - **Module Name:** shared-action

    +   - **Package Name:** com.raywenderlich.learn.action

    +   - **iOS framework distribution:** XCFramework


    Click **Finish** and wait for the project to synchronize. Afterward, if you look
    at the Android Studio **Project** tab, you’ll see a new **shared-action** module
    added.


    Open **settings.gradle.kts** file in the project root folder. Confirm that **shared-action**
    is now part of **learn**:


    ```

    ```kotlin

    include(":shared-action")

    ```

    ```'
