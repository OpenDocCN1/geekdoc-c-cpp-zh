  md: '![](img/2f50555a40af4ea8c85f09e577f0c5b9_330_0.png)


    Fig. 14.10 - GitHub token configuration


    > **Note:** It’s important to choose a name that you can easily remember later
    on. It helps when you receive an email from GitHub saying that your token is about
    to expire and you need to decide whether you want to renew it or not.


    Click **Generate token**. Copy the authentication token.


    # Create a new repository


    To publish your libraries, you need a repository to push them. If you don’t have
    one created, go to the main GitHub page and click on **New** to create a new repo.


    Alternatively, you can go directly to this [link](link).


    Write a **repository name** — for instance, **shared-action** — decide if you
    want to make it public or private, and select the **Add a README file** checkbox,
    so there’s already a branch created for you to use.


    # Publish your library


    With the GitHub Package repository ready, return to Android Studio and open the
    **gradle.properties** file located in the root directory. Here, add your account
    username and the token that you copied earlier:


    ```

    ```properties

    #Repository Credentials

    mavenUsername=YOUR_USERNAME

    mavenPassword=YOUR_TOKEN

    ```

    ```'
