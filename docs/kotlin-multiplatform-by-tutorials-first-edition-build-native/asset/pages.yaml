    \ feed.url)\n}\n```\n```\n\nThat uses the `index` to go through all elements.\
    \ Or, you could get the `index` and the `feed` directly via:\n\n```\n```kotlin\n\
    for ((index, feed) in content.withIndex()) {\n    fetchFeed(feed.platform, feed.url)\n\
    }\n```\n```\n\nOr, you can even get the `feed` from:\n\n```\n```kotlin\nfor (index\
    \ in 0..content.size) {\n    val feed = content[index]\n    fetchFeed(feed.platform,\
    \ feed.url)\n}\n```\n```\n\nThese are all possibilities that iterate through the\
    \ list of all the elements from `content` to get the same result.\n\n# while\n\
    \nThe `while` and `do...while` loops are similar to Swift. You just need to add\
    \ the condition that should end the cycle and the code that should run while it\
    \ isn’t met.\n\n```\n```kotlin\nwhile (condition) {\n    //Do something\n}\n\n\
