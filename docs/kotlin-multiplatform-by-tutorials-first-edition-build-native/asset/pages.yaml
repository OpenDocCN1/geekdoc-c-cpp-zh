  md: '# 9 Dependency Injection


    Written by Saeed Taheri


    Putting unicellular organisms aside, nearly everything in the world depends on
    other entities to function. Whether it’s something in nature or something mankind
    has created, it usually takes multiple things to create a working instance of
    anything.


    Imagine an assembly line in a car factory. They don’t create the engines and the
    wheels on the assembly line. Car manufacturers outsource many of the parts to
    other companies. In the end, they bring them all to the assembly line, _inject_
    each part into the making-in-progress and a shiny new car appears. The car is
    _dependent_ on other objects. The same applies to the software world.


    If you were to model the `Car` into a class, one of its dependencies would be
    the `Engine`. The car object shouldn’t be responsible for creating the engine.
    You should inject the engine from outside into the assembly line — or in programming
    nomenclature, constructor, or initializer.


    # Advantages of dependency injection


    Dependency injection, or DI, has many advantages.


    +   Maintainability: DI makes your code maintainable. If your classes are loosely
    coupled, you can catch bugs more easily and address a possible issue faster than
    you would with a convoluted class that doesn’t adhere to the single-responsibility
    principle.


    +   Reusability: Going back to the car factory example, you’re able to reuse the
    same model of wheels for many cars the factory manufactures. Loosely coupled code
    will let you reuse many parts of your code in different ways.


    +   Ease of refactoring: There may come a time in the lifetime of your app when
    you need to apply a change to your codebase. The less coupled your classes are,
    the easier the process will be. Imagine you needed to change the engine if you
    wanted to have new headlights!


    +   Testability: Everything comes back to the code being loosely coupled. If each
    object is self-contained, you can test its functionality independent of others.
    No one would like a car whose engine wouldn’t work when a windshield wiper is
    broken! This way, each team responsible for each module will test their product
    and hand it over to other teams.'
