- pgno: 18
  md: "# # Kotlin Multiplatform keywords\n\nNow that you have the project created,\
    \ you need to know about two new keywords that were added to the Kotlin language\
    \ to support KMP: **expect** and **actual**. These let you create functions or\
    \ variables in the shared module using the **expect** keyword. Those functions\
    \ or variables aren’t defined in the **commonMain** folder, but are _expected_\
    \ in each multiplatform module — like **androidMain** or **iosMain**. If you open\
    \ the shared folder, you’ll see:\n\nHere, you can see folders for Android, common\
    \ and iOS. You’ll add the shared classes and code to **commonMain/kotlin**. If\
    \ you need to write code that is platform specific, you’ll write an **expect**\
    \ function or variable in the common folder and the **actual** code in both the\
    \ Android and iOS folders. Open the **commonMain** folder and open **Platform.kt**.\n\
    \n![](img/2f50555a40af4ea8c85f09e577f0c5b9_18_0.png)\n\n![](img/2f50555a40af4ea8c85f09e577f0c5b9_18_1.png)\n\
    \n```\npackage com.raywenderlich.findtime\nexpect class Platform() {\n    val\
    \ platform: String\n}\n\n\n```"
  merge: -1
  img_proc: true
