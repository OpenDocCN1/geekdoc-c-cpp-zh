  md: '# # How to publish a library to the GitHub Packages repository


    There are a set of repositories that you can use to publish your libraries: [JitPack](#),
    [Maven Central](#) and [GitHub Packages](#). These are the most common. Or, you
    can always set up your own package repository.


    Depending on the repository that you select, the configuration process should
    be similar to the one presented in this section. Typically, the differences are
    the URL that you use to connect to and the authentication required.


    Here, you’re going to use GitHub Packages — mainly because it’s simple to configure
    and has a free tier that you can use. You just need to create an account.


    Before you can publish a library, you need to first create the access token that
    Gradle will use to authenticate your account.


    # ## Create your access token


    Log in to GitHub and go to your account **Settings**. You can see this option
    by clicking your avatar in the top right corner of the website. Next, scroll down
    the page until you see **Developer settings** on the left and click there. You’ll
    be redirected to a new screen. From there, go to **Personal access tokens** and
    then **Generate new token**.


    Or, you can go directly to this [link](#).


    In this screen, you can configure a name for your token, how long it will be valid
    and which permissions it should have. For the name, add: **Publish Maven Repository**
    and check the **write:packages** and **read:packages** checkboxes.


    It will automatically select the **repo** attribute. Your screen will be similar
    to this one:'
  merge: -1
  img_proc: true
