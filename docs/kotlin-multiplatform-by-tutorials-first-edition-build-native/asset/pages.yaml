- pgno: 248
  md: "# ## Working with targets that don’t support Parcelize\n\nNow that you’ve implemented\
    \ **Parcelize** on common and Android, if you look at the `actual` fields that\
    \ you’ve added, you’ll see a red underline, which means that something is wrong.\
    \ This happens because the app is targeting other platforms that are missing the\
    \ `actual` implementation.\n\nGo to the `iosMain` folder and inside the `platform`\
    \ directory, create the corresponding **PlatformParcelable.kt** file.\n\n> **Note**:\
    \ Press Alt + Enter, and Android Studio automatically suggests creating the files\
    \ for the remaining platforms. Generate these files by pressing OK.\n\nOpen **PlatformParcelable.kt**\
    \ and add:\n\n> package com.raywenderlich.learn.platform\n> \n> actual interface\
    \ Parcelable\n\nThat’s it! iOS doesn’t have a corresponding **Parcelable** interface,\
    \ so define an empty declaration. The compiler automatically removes both the\
    \ annotation and class since there’s no declaration set. The generated framework\
    \ doesn’t contain any reference to `Parcelize` and `Parcelable`.\n\nAdd the same\
    \ file to **desktopMain/platform**.\n\nThis is the expected behavior, since this\
    \ is an Android-only specific feature.\n\n# ## Adding Parcelize to existing classes\n\
    \nWith everything set, go to **commonMain** and search for the **RWContent** and\
    \ **RWEntry** data classes. They’re inside the **data/model** package.\n\nIn each\
    \ of these files, add the `@Parcelize` annotation above the class declaration\
    \ and extend `Parcelable` :\n\nThe RWContent.kt file will look like this:\n\n\
    > @Parcelize\n> @Serializable\n> data class RWContent(\n>     val platform: PLATFORM,\n\
    >     val url: String,\n>     val image: String\n> ) : Parcelable"
  merge: -1
  img_proc: true
- pgno: 249
