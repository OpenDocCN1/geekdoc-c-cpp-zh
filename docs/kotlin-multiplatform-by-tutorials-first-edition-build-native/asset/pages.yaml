  md: "Similar to Swift, you can add three types of comments:\n\n+   - **Line**, where\
    \ you just need to add `//` before the code or text that you want to comment.\
    \ In this example, `Logger` won’t be executed:\n\n```\npublic fun fetchMyGravatar(cb:\
    \ FeedData) {\n    //Logger.d(TAG, \"fetchMyGravatar\")\n\n    //Update the current\
    \ listener with the new one.\n    listener = cb\n    fetchMyGravatar()\n}\n```\n\
    \n+   - **Block**, where you need to surround your code or text with `/* */`.\
    \ This is also used for adding the copyright section at the beginning of a file:\n\
    \n```\n/*\n * Copyright (c) 2021 Razeware LLC\n *\n */\n```\n\n+   - **KDoc**,\
    \ which corresponds to the documentation that’s going to be generated for your\
    \ project. You can use tags like `@property`, `@param`, `@return`, `@constructor`,\
    \ etc. to provide additional information about a function:\n\n```\n/**\n * This\
    \ method fetches your Gravatar profile.\n *\n * @property cb, the callback used\
    \ to notify the UI that the\n * profile was successfully fetched or not.\n */\n\
    public fun fetchMyGravatar(cb: FeedData) {\n    //Your code goes here\n}\n```\n\
    \n> **Note:** The equivalent version of Kdoc for Swift is [Jazzy](https://github.com/realm/jazzy).\n\
    \n# Variables\n\nSimilar to Swift, in Kotlin you also have two types of variables:\n\
    \n+   - **val**, which corresponds to Swift’s **let**. It’s a read-only (immutable)\
    \ variable that can only be set once – in its declaration. In this case, `scope`\
    \ is initialized with a specific value when declared. This value can never change\
    \ throughout the app execution:\n\n```\n\n```"
  merge: -1
  img_proc: true
- pgno: 343
  md: "```\n```kotlin\nprivate val scope = PresenterCoroutineScope(defaultDispatcher)\n\
    ```\n```\n\n+   - **var** is the same keyword as in Swift. It’s a mutable variable,\
    \ so you can set it as many times as you need. In this example, the initial value\
    \ of `listener` is `null`. When the UI makes a new request for data, it’s going\
    \ to be updated with a new callback reference:\n\n```\n```kotlin\nprivate var\
    \ listener: FeedData? = null\n```\n```\n\nIn Swift, the above declaration is:\n\
    \n```\n```swift\nprivate var listener: FeedData? = nil\n```\n```\n\nYou can have\
    \ **optional** values in both languages. The only difference is Kotlin uses `null`,\
    \ whereas Swift uses `nil` to represent the absence of a value.\n\n# Lazy initialization\n\
    \nKotlin supports lazy initialization through the use of the `lazy` keyword. This\
    \ variable needs to be immutable — in other words, you need to declare it as `val`.\n\
    \nThe value of this variable will only be calculated when it’s first accessed.\
    \ You should only define a variable as lazy if you don’t need to access it right\
    \ away and the variable does some heavy work.\n\nOpen the **FeedPresenter.kt**\
    \ file inside **shared/presentation** and search for `content` declaration:\n\n\
    ```\n```kotlin\nval content: List<RWContent> by lazy {\n  json.decodeFromString(RW_CONTENT)\n\
    }\n```\n```\n\nAs you can see, it’s defined as `lazy`. Do this to avoid decoding\
    \ `RW_CONTENT` immediately when the app starts. It’s one less thing to process.\n\
    \nIf your app has a heavy startup, following this approach will give you a faster\
    \ and smoother initialization of the app. The value will only be set when there’s\
    \ a call to `content`.\n\n# Late initialization\n\nYou can delay the initialization\
    \ of a variable until your app needs it. For that, you need to set it as `lateinit`,\
    \ and it can’t be set as immutable or null."
