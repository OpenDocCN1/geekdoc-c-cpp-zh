- pgno: 15
  md: '# ## Install CocoaPods


    CocoaPods is a dependency manager for iOS. Since CocoaPods has been around for
    a long time, it’s easy to use in Xcode and easy to add dependencies.


    Run the following command in Terminal on your Mac:


    ```

    sudo gem install cocoapods

    ```


    The command above installs cocoapods using the default Ruby installation available
    on macOS.


    # ## Creating your first project


    It’s time to create your first project! In Android Studio, open the File menu
    and choose New ▸ New Project.


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_15_0.png)


    In the New Project window, scroll down to the last entry and choose Kotlin Multiplatform
    App. If you don’t see this, make sure you installed the KMM plugin. Also, make
    sure to restart Android Studio after installing the plugin. Click Next.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/2f50555a40af4ea8c85f09e577f0c5b9_16_0.png)


    In the next dialog, enter the name **Find Time** and a package name of **com.raywenderlich.findtime**
    or your own package name. Choose the directory you want to store the project and
    press **Next**.


    ![](img/2f50555a40af4ea8c85f09e577f0c5b9_16_1.png)'
