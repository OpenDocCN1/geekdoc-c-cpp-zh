    \ \"https://www.raywenderlich.com/feed.xml\",\n        image = \"https://assets.carolus.rawenderlich.com/assets/razeware_460-308933a0bda63e3e327123cab8002c0383a714cd35a10ade9ca20b1f438b.png\"\
    \n    )\n\n    assertEquals(content, decoded)\n}\n```\n```\n\nEssentially, you\
