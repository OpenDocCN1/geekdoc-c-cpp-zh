- pgno: 207
  md: "First, make `RemindersViewModelTest` conform to `KoinTest`. This conformance\
    \ will make the test class a `KoinComponent`. The `KoinComponent` interface is\
    \ here to help you retrieve instances directly from Koin using some special keywords.\n\
    \nNext, make `RemindersViewModelTest` extend from `KoinTest` and change the `viewModel`\
    \ property definition to this:\n\n```\n```kotlin\nclass RemindersViewModelTest\
    \ : KoinTest {\n    private val viewModel: RemindersViewModel by inject()\n\n\
    \    //...\n}\n```\n```\n\nThe `by` keyword in Kotlin delegates the implementation\
    \ of the accessors for a property to another object. By using `by inject()`, Koin\
    \ will lazily retrieve your instances from the dependency graph. The `inject()`\
    \ function is an extension to `KoinTest`.\n\nThe last piece is to initialize Koin\
    \ before the test, and stop it after the test — pretty much like when you tested\
    \ the Koin integrity.\n\nImplement these two functions in the test class:\n\n\
    ```\n```kotlin\n@BeforeTest\nfun setup() {\n    initKoin()\n}\n\n@AfterTest\n\
    fun tearDown() {\n    stopKoin()\n}\n```\n```\n\nIn the `setup` method, you don’t\
    \ need to initialize the `viewModel` property yourself anymore. You just call\
    \ the `initKoin` method, which you called at the application’s launch. It provides\
    \ the default values for the modules. The `tearDown` function is exactly the same\
    \ as in the `DITest` class.\n\nRun the tests for the `RemindersViewModelTest`\
    \ class, and they will pass as they used to do.\n\n# Key points\n\n+   - Classes\
    \ should respect the single-responsibility principle and shouldn’t create their\
    \ own dependencies."
