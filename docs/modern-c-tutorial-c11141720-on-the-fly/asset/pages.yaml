    # Purpose


    The book claims "On the Fly". Its intent is to provide a comprehensive introduction
    to the relevant features regarding modern C++ (before 2020s). Readers can choose
    interesting content according to the following table of content to learn and quickly
    familiarize the new features you would learn. Readers should be aware that all
    of these features are not required. It should be learnt when you need it.


    At the same time, instead of grammar-only, the book introduces the historical
    background as simple as possible of its technical requirements, which provides
    great help in understanding why these features come out.


    In addition, the author would like to encourage that readers should be able to
    use modern C++ directly in their new projects and migrate their old projects to
    modern C++ gradually after read the book.


