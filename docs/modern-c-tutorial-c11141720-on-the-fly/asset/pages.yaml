  md: "# 9.4 Memory Alignment\n\nCustom literals support literals:\n\n+   - Integer\
    \ literal: When overloading, you must use unsigned long long, const char *, and\
    \ template literal operator parameters. The former is used in the above code;\n\
    - Floating-point literals: You must use long double, const char *, and template\
    \ literals when overloading;\n- String literals: A parameter table of the form\
    \ (const char *, size_t) must be used;\n- Character literals: Parameters can only\
    \ be char, wchar_t, char16_t, char32_t.\n\n# 9.4 Memory Alignment\n\nC++ 11 introduces\
    \ two new keywords, alignof and alignas, to support control of memory alignment.\
    \ The alignof keyword can get a platform-dependent value of type std::size_t to\
    \ query the alignment of the platform. Of course, we are sometimes not satisfied\
    \ with this, and even want to customize the alignment of the structure. Similarly,\
    \ C++ 11 aligns. To reshape the alignment of a structure. Let's look at two examples:\n\
    \n```\n#include <iostream>\n\nstruct Storage {\n    char a;\n    int b;\n    double\
    \ c;\n    long long d;\n};\n\nstruct alignas(std::max_align_t) AlignasStorage\
    \ {\n    char a;\n    int b;\n    double c;\n    long long d;\n};\n\nint main()\
    \ {\n    std::cout << alignof(Storage) << std::endl;\n    std::cout << alignof(AlignasStorage)\
    \ << std::endl;\n    return 0;\n}\n```\n\nwhere std::max_align_t requires exactly\
    \ the same alignment for each scalar type, so it has no difference in maximum\
    \ scalars. In turn, the result on most platforms is long double, so the alignment\
    \ requirement for AlignasStorage we get is 8 or 16."
