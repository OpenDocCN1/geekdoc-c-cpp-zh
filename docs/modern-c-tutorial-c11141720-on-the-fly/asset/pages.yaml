  md: '# Preface


    # Introduction


    C++ user group is fairly large. From the advent of C++98 to the official finalization
    of C++11, it has accumulated over a decade. C++14/17 is an important complement
    and optimization for C++11, and C++20 brings this language to the door of modernization.
    The extended features of all these new standards are given to the C++ language.
    Infused with new vitality. C++ programmers, who are still using traditional C++
    (this book refers to C++98 and its previous C++ standards as traditional C++),
    may even be amazed by the fact that they are not using the same language while
    reading modern C++ code.


    Modern C++ (this book refers to C++11/14/17/20) introduces a lot of features into
    traditional C++, which makes the whole C++ language modernized. Modern C++ not
    only enhances the usability of the C++ language itself, but the modification of
    the auto keywords gives us more confidence in manipulating extremely complex template
    types. At the same time, a lot of enhancements have been made to the language
    runtime. The emergence of Lambda expressions has made C++ have the "closure" feature
    of "anonymous functions", which is almost in modern programming languages (such
    as Python/Swift). It has become commonplace, and the emergence of reference has
    solved the problem of temporary object efficiency that C++ has been criticized.


    C++17 is the direction that has been promoted by the C++ community in the past
    three years. It also points out an important development direction of modern C++
    programming. Although it does not appear as much as C++11, it contains a large
    number of small and beautiful languages and features (such as structured binding),
    and the appearance of these features again corrects our programming paradigm in
    C++.


    Modern C++ also adds lot of tools and methods to orient its standard library,
    such as std::thread at the level of the language itself, which supports concurrent
    programming and no longer depends on the underlying system on different platforms.
    The APIs implement cross-platform support at the language level; std::regex provides
    full regular expression support and more. C++98 has been proven to be a very successful
    "paradigm", and the emergence of modern C++ further promotes this paradigm, making
    C++ a better language for system programming and library development. Concepts
    verification on the compile-time of parameters, enhancing the usability of the
    language


    In conclusion, as an advocate and practitioner of C++, we always maintain an open
    mind to accept new things, and we can promote the development of C++ faster, making
    this old and new language more vibrant.


    # Targets


    +   * This book assumes that readers are already familiar with traditional C++
    (i.e. C++98 or earlier), at least they do not have any difficulty in reading traditional
    C++ code. In other words, those who have long experience in traditional C++ and
    people who desire to quickly understand the features'
