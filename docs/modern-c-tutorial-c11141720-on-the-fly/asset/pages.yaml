    \ at the end of the declaration period, such code is also extremely safe. Whether\
    \ critical_section() returns normally or if an exception is thrown in the middle,\
    \ a stack rollback is thrown, and unlock() is automatically called.\n\nAnd std::unique_lock\
    \ is more flexible than std::lock_guard, std::unique_lock is more flexible. Objects\
    \ of std::unique_lock manage the locking and unlocking operations on the mutex\
    \ object with exclusive ownership (no other unique_lock objects owning the ownership\
    \ of a mutex object). So in concurrent programming, it is recommended to use std::unique_lock.\n\
    \nstd::lock_guard cannot explicitly call lock and unlock, and std::unique_lock\
    \ can be called anywhere after the declaration. It can reduce the scope of the\
    \ lock and provide higher concurrency.\n\nIf you use the condition variable std::condition_variable::wait\
    \ you must use std::unique_lock as a parameter.\n\nFor instance:\n\n```\n#include\
