    # constexpr


    C++ itself already has the concept of constant expressions, such as 1+2, 3*4.
    Such expressions always produce the same result without any side effects. If the
    compiler can directly optimize and embed these expressions into the program at
    compile time, it will increase the performance of the program. A very obvious
    example is in the definition phase of an array:


    ```

    #include <iostream>

    #define LEN 10

    ```


    ```

    int len_foo() {

    int i = 2;

    return i;

    }

    constexpr int len_foo_constexpr() {

    return 5;

    }

    ```


    ```

    constexpr int fibonacci(const int n) {

    return n == 1 || n == 2 ? 1 : fibonacci(n-1) + fibonacci(n-2);

    }

    ```


