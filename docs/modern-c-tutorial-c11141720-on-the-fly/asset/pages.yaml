    \ thread are executed sequentially, and instruction ordering is not allowed, but\
    \ the order of atomic operations between threads is arbitrary. The type is specified\
    \ by std::memory_order_relaxed. Let's look at an example:\n\n```\nstd::atomic<int>\
    \ counter = {0};\nstd::vector<std::thread> vt;\nfor (int i = 0; i < 100; ++i)\
