  md: "# 7.5 Atomic Operation and Model      CHAPTER 07 PARALLELISM AND CONCURRENCY\n\
    \n2. Release/consumption model: In this model, we begin to limit the order of\
    \ operations between processes. If a thread needs to modify a value, but another\
    \ thread has a dependency on that operation of the value, that is, the latter\
    \ depends. Specifically, A has completed three writes to x, and B releases only\
    \ on the third write operation, regardless of the first two writes of x, A when\
    \ calling x.release() (ie use std::memory_order_release), the option std::memory_order_consume\
    \ ensures that B observes when calling x.load()) Three writes to x. Let's look\
    \ at an example:\n\n```\n// initialize as nullptr to prevent consumer load a dangling\
    \ pointer\nstd::atomic<int*> ptr(nullptr);\nint v;\nstd::thread producer([&]()\
    \ {\n    int* p = new int(42);\n    ptr.store(p, std::memory_order_release);\n\
    });\n\nstd::thread consumer([&]() {\n    int* p;\n    while (!(p = ptr.load(std::memory_order_consume)))\
    \ {\n        std::cout << \"x: \" << *p << std::endl;\n        std::cout << \"\
    y: \" << v << std::endl;\n    }\n});\n\nproducer.join();\nconsumer.join();\n```\n\
    \n3. Release/Acquire model: Under this model, we can further tighten the order\
    \ of atomic operations between different threads, specifically specifying the\
    \ timing between releasing std::memory_order_acquire and getting std::memory_order_acquire.\
    \ All writes before the release operation are visible to any other thread, ie,\
    \ happens-before.\n\nAs you can see, std::memory_order_release ensures that the\
    \ write behavior does not occur before the release operation, which is a forward\
    \ barrier, std::memory_order_acquire ensures that its previous write behavior\
    \ does not occur after this acquisition operation, which is a backward barrier.\
    \ For the std::memory_order_acq_rel option, it combines the characteristics of\
    \ two and defines a memory barrier, so that the current thread's reading and writing\
    \ of memory will not be rearranged before and after this operation.\n\nLet's check\
    \ out an example:\n\n```\nstd::vector<int> v;\nstd::atomic<int> flag = {0};\n\
    std::thread release([&]() {\n    v.push_back(42);\n    flag.store(1, std::memory_order_release);\n\
    });\n```"
