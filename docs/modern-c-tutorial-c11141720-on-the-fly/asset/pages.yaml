    \ R, typename T, typename U>\nR add(T x, U y) {\n  return x+y;\n}\n```\n\nNote:\
    \ There is no difference between typename and class in the template parameter\
    \ list. Before the keyword typename appears, class is used to define the template\
    \ parameters. However, when defining a variable with nested dependency type in\
    \ the template, you will need to use typename to eliminate ambiguity.\n\nSuch\
    \ code is actually very ugly, because the programmer must explicitly indicate\
    \ the return type when using this template function. In fact we don't know what\
    \ kind of operation the add() function will do, and what kind of return type to\
    \ get.\n\nThis problem was solved in C++11. Although you may immediately react\
    \ to using decltype to derive the type of x+y, we write something like this:\n\
    \n```\ndecltype(x+y) add(T x, U y)\n```\n\nBut in fact, this writing of it cannot\
    \ be compiled. This is because x and y have not been defined when the compiler\
    \ reads decltype(x+y). To solve this problem, C++11 also introduces a trailing\
    \ return type, which uses the auto to post the return type:\n\n```\ntemplate<typename\
    \ T, typename U>\nadd2(T x, U y) -> decltype(x+y){\n  return x + y;\n}\n```\n\n\
