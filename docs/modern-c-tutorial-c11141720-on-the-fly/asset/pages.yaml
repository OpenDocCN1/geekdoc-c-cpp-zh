  md: "# 7.2 Mutex and Critical Section\n\n```\n#include <iostream>\n#include <thread>\n\
    ```\n\n```\nint v = 1;\n\nvoid critical_section(int change_v) {\n    static std::mutex\
    \ mtx;\n    std::lock_guard<std::mutex> lock(mtx);\n\n    // execute contention\n\
    \    v = change_v;\n\n    // mtx will be released after leaving the scope\n}\n\
    \nint main() {\n    std::thread t1(critical_section, 2), t2(critical_section,\
