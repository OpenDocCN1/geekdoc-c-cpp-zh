    # 1.2 Compatibilities with C


    For some force majeure and historical reasons, we had to use some C code (even
    old C code) in C++, for example, Linux system calls. Before the advent of modern
    C++, most people talked about “what is the difference between C and C++”. Generally
    speaking, in addition to answering the object-oriented class features and the
    template features of generic programming, there is no other opinion, or even a
    direct answer. “Almost” is also a lot of people. The Venn diagram in Figure 1.2
    roughly answers the C and C++ compatibility.


    From now on, you should have the idea that “C++ is not a superset of C” in your
    mind (and not from the beginning, later [References for further reading] (# further
    references) The difference between C++98 and C99 is given). When writing C++,
    you should also avoid using program styles such as *void* whenever possible. When
    you have to use C, you should pay attention to the use of **extern** “C”, separate
    the C language code from the C++ code, and unify the link, for instance:


    ```

    // foo.h

    #ifdef __cplusplus

    extern "C" {

    #endif


    add(int x, int y);


    #ifdef __cplusplus

