  md: "\n![](img/e38a3926c5c51066839ec75b97aea207_61_0.png)\n\n## Conclusion\n\nThe\
    \ technology of smart pointers is not novel. It is a common technology in many\
    \ languages. Modern C++ introduces this technology, which eliminates the abuse\
    \ of new/delete to a certain extent. It is a more mature technology. Programming\
    \ paradigm.\n\n## Further Readings\n\n- Why does C++11 have make_shared but not\
    \ make_unique\n\n## Chapter 06 Regular Expression\n\n### 6.1 Introduction\n\n\
    Regular expressions are not part of the C++ language and therefore we only briefly\
    \ introduced it here.\n\nRegular expressions describe a pattern of string matching.\
    \ The general use of regular expressions is mainly to achieve the following three\
    \ requirements:\n\n- 1. Check if a string contains some form of substring;\n-\
    \ 2. Replace the matching substrings;\n- 3. Take the eligible substring from a\
    \ string.\n\nRegular expressions are text patterns consisting of ordinary characters\
    \ (such as a to z) and special characters. A pattern describes one or more strings\
    \ to match when searching for text. Regular expressions act as a template to match\
    \ a character pattern to the string searched.\n\n### Ordinary characters\n\nOrdinary\
    \ characters include all printable and unprintable characters that are not explicitly\
    \ specified as metacharacters. This includes all uppercase and lowercase letters,\
    \ all numbers, all punctuation, and some other symbols.\n\n### Special characters\n\
    \nA special character is a character with special meaning in a regular expression,\
    \ and is also the matching syntax of a regular expression. See the table below:\n\
    \n| Special characters | Description |\n|---|---|\n| $ | Matches the end position\
    \ of the input string. |\n| () | Matches the start and end of a subexpression.\
    \ Subexpressions can be obtained for later use. |\n| * | Matches the previous\
    \ subexpression zero or more times. |\n| + | Matches the previous subexpression\
    \ one or more times. |\n| . | Matches any single character except the newline\
    \ character \\n. |\n| [ | Marks the beginning of a bracket expression. |\n| ?\
    \ | Matches the previous subexpression zero or one time, or indicates a non-greedy\
    \ qualifier |\n| \\ | Marks the next character as either a special character,\
    \ or a literal character, or a backward reference. For example, \\n Matches the\
    \ character. The sequence \\n Matches the \\ character, while \\( matches the\
    \ \\'. |\n| ' | Matches newline characters. |\n| { | Marks the beginning of a\
    \ qualifier expression. |\n| \\| | Indicates a choice between the two. |\n\n###\
    \ Quantifiers\n\nThe qualifier is used to specify how many times a given component\
    \ of a regular expression must appear to satisfy the match. See the table below:\n\
    \n| Character | Description |\n|---|---|\n| * | matches the previous subexpression\
    \ zero or more times. For example, foo* matches fo and foooo. * is equivalent\
    \ to {0,}. |\n| + | matches the previous subexpression one or more times. For\
    \ example, foo+ matches foo and fooo but does not match fo. + is equivalent to\
    \ {1}. |\n| ? matches the previous subexpression zero or one time. For example,\
    \ Your(s)? can match Your in or Yours. ? is equivalent to {0,1}. |\n| {n} is a\
    \ non-negative integer. Matches the n times. For example, o{2} cannot match o\
    \ in for, but can match two o in foo. |\n| {n,} is a non-negative integer. Matches\
    \ at least n times. For example, o{2} cannot match o in for, but matches all o\
    \ in foooooo. o{1} is equivalent to o+. o{0} is equivalent to *: |\n| {n,m} m\
    \ and n are non-negative integers, n is less or equal to m. For, o{1,3} will match\
    \ the first three o in foooooo. o(0,1) is equivalent to?. Note that there are\
    \ no spaces between the comma and the two numbers. |\n\nWith these tables, we\
    \ can read almost all regular expressions.\n\n### 6.2 std::regex and Its Related\n\
    \nThe most common way to match string content is to use regular expressions. Unfortunately,\
    \ in traditional C++, expressions have not been supported by the language level,\
    \ and are not included in the standard library. C++ is a high-performance language.\
    \ In the development of backend services, the use of regular expressions is also\
    \ used when joining URL links. The most mature and common practice in today.\n\
    \nThe general solution is to use the regular expression library of boost. C++11\
    \ officially incorporates the processing of regular expressions into the standard\
    \ library, providing standard support from the language level and no longer relying\
    \ on third parties.\n\nThe regular expression provided by C++11 operates on the\
    \ std::regex object, and the pattern std::regex (essentially std::basic_regex)\
    \ is initialized and matched by std::regex_match produces std::match (essentially\
    \ the std::match_results object).\n\nWe use a example to briefly introduce this\
    \ use library. Consider the following regular expression:\n\n- [a-z].txt: In this\
    \ expression, [a-z] means matching a lowercase letter, + can match the previous\
    \ expression multiple times, so [a-z]+ matches a string of lowercase letters.\
    \ In the regular expression, . means to match any character, and \\. means to\
    \ match the character ., and the last txt means to match exactly three letters.\
    \ So the content of is a test file containing pure lowercase letters.\n\nstd::regex_match\
    \ is used to match strings and regular expressions, and there are many different\
    \ overloaded forms. The simplest form is to pass std::string and std::regex to\
    \ match. When the match is successful, it will return true, otherwise it will\
    \ return false. For example:\n\n```cpp\n#include <iostream>\n#include <string>\n\
    #include <regex>\n```\n\n```cpp\nint main() {\n    std::string fname[] = {\"foo.txt\"\
    , \"bar.txt\", \"test\", \"a0.txt\"};\n    // In C++, \\\\ will be used as an\
    \ escape character in the string. In order for \\\\ to be passed\n    std::regex\
    \ txt(\"[a-z]+\\.txt\");\n    for (const auto &fname : fname) {\n        std::cout\
    \ << fname << \" << \" << std::regex_match(fname, txt) << std::endl;\n    }\n\
    }\n```\n\nAnother common form is to pass in the three arguments std::string/std::smatch/std::regex.\
    \ The essence of std::smatch is actually std::match_results. In the standard library,\
    \ std::match_results<std::string::const_iterator>, which means match_results of\
    \ a iterator. Use std::match to easily get the matching results, for example:\n\
    \n```cpp\nstd::regex base_regex(\"a-z]+\\.txt\");\nstd::smatch base_match;\nfor(const\
    \ auto &fname : fname) {\n    if (std::regex_match(fname, base_match, base_regex))\
    \ {\n        // the first element of std::smatch matches the entire string\n \
    \       // the second element of std::smatch matches the first brackets\n    \
    \    if (base_match.size() == 2) {\n            std::string base = base_match[1].str();\n\
    \            std::cout << \"sub-match[1]:\" << base << std::endl;\n        }\n\
    \    }\n}\n```\n\nThe output of the above code snippets is:\n\n```\nfoo.txt: 1\n\
    bar.txt: 1\ntest: 0\na0.txt: 0\n```\n"
  mdcn: "\n\n![](img/e38a3926c5c51066839ec75b97aea207_61_0.png)\n\n## 结论\n\n智能指针技术并不新颖。它是许多语言中的通用技术。现代\
    \ C++ 引入了这项技术，在很大程度上消除了对 `new/delete` 的滥用。是一种更成熟的编程范式。\n\n## 进阶阅读\n\n- 为什么 C++11\
    \ 有 make_shared 但没有 make_unique\n\n## 第06 章 正则表达式\n\n### 6.1 引言\n\n正则表达式并不是 C++\
    \ 语言的一部分，因此我们在这里只对其进行简要介绍。\n\n正则表达式描述了一种字符串匹配的模式。正则表达式的通用用途主要为了实现以下三项需求：\n\n-\
    \ 1. 检查字符串是否包含某种形式的子字符串；\n- 2. 替换匹配到的子字符串；\n- 3. 从字符串中提取符合条件的子字符串。\n\n正则表达式是由普通字符（如\
    \ a 到 z）和特殊字符组成的文本模式。模式描述了在搜索文本时匹配的一个或多个字符串。正则表达式充当模板，用于将字符模式匹配到待搜索的字符串上。\n\n\
    ### 普通字符\n\n普通字符包括所有未显式指定为元字符的可打印和不可打印字符。这包括所有大写和小写字母、所有数字、所有标点符号以及其他符号。\n\n###\
    \ 特殊字符\n\n特殊字符是在正则表达式中具有特殊含义的字符，也是正则表达式的匹配语法。见下表：\n\n| 特殊字符 | 说明 |\n|---|---|\n\
    | $ | 匹配输入字符串的结束位置。 |\n| () | 匹配子表达式的开始和结束。可以获取子表达式供以后使用。 |\n| * | 匹配上一个子表达式零或多次。\
    \ |\n| + | 匹配上一个子表达式一次或多次。 |\n| . | 匹配除换行符 \\n 以外的任意单个字符。 |\n| [ | 标记括号表达式的开始。\
    \ |\n| ? | 匹配上一个子表达式零或一次，或表示非贪婪限定符 |\n| \\ | 标记下一个字符为特殊字符、字面字符或反向引用。例如，\\n 匹配字符\
    \ n。序列 \\n 匹配字符 \\，而 \\( 则匹配字符左括号 (。 |\n| ' | 匹配换行符。 |\n| { | 标记限定符表达式的开始。 |\n\
    | \\| | 表示两者之间的选择。 |\n\n### 量词\n\n限定符用于指定正则表达式中的给定组件必须出现多少才能满足匹配。见下表：\n\n| 字符\
    \ | 说明 |\n|---|---|\n| * | 匹配上一个子表达式零或多次。例如，foo* 匹配 foo 和 foooo。* 等价于 {0,}。 |\n\
    | + | 匹配上一个子表达式一次或多次。例如，foo+ 匹配 foo 和 fooo 但不匹配 fo。+ 等价于 {1}。 |\n| ? | 匹配上一个子表达式零或一次。例如，Your(s)?\
    \ 可以匹配 Your 或 Yours。? 等价于 {0,1}。 |\n| {n} | 是一个非负整数。匹配 n 次。例如，o{2} 无法匹配 for 中的\
    \ o，但可以匹配 foo 中的两个 o。 |\n| {n,} | 是一个非负整数。至少匹配 n 次。例如，o{2} 无法匹配 for 中的 o，但匹配 foooooo\
    \ 中所有的 o。o{1} 等价于 o+。o{0} 等价于 *。 |\n| {n,m} | m 和 n 是非负整数，n 小于或等于 m。例如，o{1,3}\
    \ 将匹配 foooooo 中的前三个 o。o{0,1} 等价于 ?。注意逗号和两个数字之间没有空格。 |\n\n通过这些表格，我们可以读懂几乎所有的正则表达式。\n\
    \n### 6.2 std::regex 及其相关内容\n\n匹配字符串内容最常用的方法是使用正则表达式。遗憾的是，在传统的 C++ 中，语言层面并不支持表达式，也没有包含在标准库中。C++\
    \ 是一种高性能语言。在后端服务的开发中，连接 URL 链接时也会使用正则表达式。这是目前最成熟且常见的做法。\n\n通用的解决方案是使用 boost 的正则表达式库。C++11\
    \ 正式将正则表达式的处理引入了标准库，从语言层面提供了标准支持，不再依赖于第三方。\n\nC++11 提供的正则表达式作用于 `std::regex` 对象，而模式\
    \ `std::regex`（本质上是 `std::basic_regex`）通过 `std::regex_match` 初始化并匹配，产生 stdstd::match（本质上是\
    \ std::match_results 对象）。\n\n我们用一个示例来简要介绍这个库的使用。考虑以下正则表达式：\n\n- [a-z].txt: 在此表达式中，[a-z]\
    \ 表示匹配小写字母，+ 可以匹配上一个表达式多次，所以 [a-z]+ 匹配一个小写字母字符串。在正则表达式中，. 表示匹配任意字符，而 \\ 表示匹配字符\
    \ .，最后的 txt 表示匹配精确的三个字母。因此文件名的内容是一个包含纯小写字母的测试文件。\n\n`std::regex_match` 用于匹配字符串和正则表达式，有许多不同的重载形式。简单的形式是传递\
    \ std::string 和 std::regex 进行匹配。当匹配成功时，它将返回 true，否则返回 false。例如：\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\n#include <regex>\n```\n\n```cpp\nint main() {\n\
    \    std::string fname[] = {\"foo.txt\", \"bar.txt\", \"test\", \"a0.txt\"};\n\
    \    // 在 C++ 中，\\\\ 将作为字符串中的转义字符。为了传递 \\\n    std::regex txt(\"[a-z]+\\.txt\"\
    );\n    for (const auto &fname : fname) {\n        std::cout << fname << \" <<\
    \ \" << std::regex_match(fname, txt) << std::endl;\n    }\n}\n```\n\n另一种形式是传递三个参数\
    \ std::string/std::smatch/std::regex。std::smatch 的本质实际上是 std::match_results。在标准库中，它是\
    \ std::match_results<std::string::const_iterator>，意味着迭代器的匹配结果。使用 std::match 可以轻松获取匹配结果，例如：\n\
    \n```cpp\nstd::regex base_regex(\"[a-z]+\\.txt\");\nstd::smatch base_match;\n\
    for(const auto &fname : fname) {\n    if (std::regex_match(fname, base_match,\
    \ base_regex)) {\n        // std::smatch 的第一个元素匹配整个字符串\n        // std::smatch\
    \ 的第二个元素匹配第一个括号的内容\n        if (base_match.size() == 2) {\n            std::string\
    \ base = base_match[1].str();\n            std::cout << \"sub-match[1]:\" << base\
    \ << std::endl;\n        }\n    }\n}\n```\n\n上述代码段的输出为：\n\n```\nfoo.txt << 1\n\
    bar.txt << 1\ntest << 0\na0.txt << 0\n```\n\n"
