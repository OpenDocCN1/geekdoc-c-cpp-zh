    ### 1.1 Deprecated Features

    Before learning modern C++, let''s take a look at the main features that have
    deprecated:

    **Note:** Deprecated is not completely unusable, it only intended to imply that
    features will disappear from future standards and should be avoided. However,
    deprecated features are still part of the standard library, and many of them are
    actually "permanently" reserved for compatibility reasons.


    - The string literal is no longer allowed to be assigned to `char*`. If you need
    to assign and initialize `char*` with string literal, you should use `char const`
    or `auto`.

