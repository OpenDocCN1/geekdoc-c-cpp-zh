    \ constexpr\n\n正如我们在本章开头看到的，C++11 引入了 `constexpr` 关键字，它可以将表达式或函数编译为常量结果。一个自然想法是，如果我们将这一特性引入条件判断中，让代码在编译时完成分支判断，是否可以让程序更高效？C++17\
    \ 将 `constexpr` 关键字引入 `if` 语句，允许你在代码中声明表达式的条件。考虑以下代码：\n\n```cpp\n#include <iostream>\n\
    \ntemplate<typename T>\nauto print_type_info(const T& t) {\n    if constexpr(std::is_integral<T>::value)\
