    \n要理解它，你得了解 C++ 中参数转发（parameter forwarding）的概念，我们将在“语言运行时加固”章节中详细介绍，你稍后可以回来本节的内容。\n\
    \n简单来说，`decltype(auto)` 主要用于推导转发函数或包的类型，这不需要我们显式地指定 `decltype` 的参数表达式。考虑以下示例，当我们需要封装以下函数时：\n\
    \n```cpp\nstd::string lookup1();\nstd::string& lookup2();\n```\n\n```cpp\nIn C++11:\n\
