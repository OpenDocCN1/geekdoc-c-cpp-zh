    \ being destroyed.\n\nThis avoids meaningless copy constructs and enhances performance.\
    \ Let's take a look at an example involving a standard library:\n\n```cpp\n#include\
    \ <iostream> // std::cout\n#include <utility> // std::move\n#include <vector>\
    \ // std::vector\n#include <string> // std::string\n\nint main() {\n\n    std::string\
    \ str = \"Hello world.\";\n    std::vector<std::string> v;\n\n    // push_back(const\
    \ T&), copy\n    v.push_back(str);\n    // \"str: Hello world.\"\n    std::cout\
    \ << \"str: \" << str << std::endl;\n\n    // push_back(const T&), no copy\n \
    \   // the string will be moved to vector, and therefore std::move can reduce\
    \ copy cost\n    v.push_back(std::move(str));\n    // str is empty now\n    std::cout\
    \ << \"str: \" << str << std::endl;\n\n    return 0;\n}\n```\n\n## Perfect forwarding\n\
    \nAs we mentioned earlier, the rvalue reference of a declaration is actually an\
    \ lvalue. This creates problems for us to parameterize (pass):\n\n## 3.3 rvalue\
    \ Reference\n\n```cpp\n#include <iostream>\n#include <utility>\nvoid reference(int&\
    \ v) {\n    std::cout << \"lvalue reference\" << std::endl;\n}\nvoid reference(int&&\
    \ v) {\n    std::cout << \"rvalue reference\" << std::endl;\n}\ntemplate <typename\
    \ T>\nvoid pass(T& v) {\n    std::cout << \" normal param passing: \";\n    reference(v);\n\
    }\nint main() {\n    std::cout << \"rvalue pass:\" << std::endl;\n    pass(1);\n\
    \n    int l = 1;\n    pass(l);\n\n    return 0;\n}\n```\n\nFor pass(1), although\
    \ the value is the rvalue, v is a reference, it is also an lvalue. Therefore reference(v)\
    \ will call reference(int&) and output lvalue. For pass(1), 1 is an rvalue, why\
    \ is it successfully passed to pass(T& v)?\n\nThis is based on the reference collapsing\
    \ rule: In traditional C++, we are not able to continue to reference a reference\
    \ type. However, C++ has relaxed this with the advent of rvalue references, resulting\
    \ in a reference collapse rule that allows us to use references, both lvalue and\
    \ rvalue. But follow the rules below:\n\n| Function parameter type | Argument\
    \ parameter type | Post-derivation function parameter type |\n|---|---|---|\n\
    | T& | lvalue ref | T& |\n| T& | rvalue ref | T& |\n| T&& | lvalue ref | T& |\n\
    | T&& | rvalue ref | T& |\n\nThe use of T&& in a template function may not be\
    \ able to make an rvalue reference, and when an lvalue is passed, a reference\
    \ to this function will be derived as an lvalue. More precisely, no matter what\
    \ type of reference the template parameter is, the template parameter can be derived\
    \ as a right reference type if and only if the argument type is an rvalue reference.\
    \ This makes v a successful delivery of deliveries.\n\nPerfect forwarding is based\
    \ on the above rules. The so-called forwarding is to let us pass the parameters,\
    \ keep the original parameter type (lvalue reference keeps lvalue, rvalue reference\
    \ keeps rvalue reference). To solve this problem, we should use std::forward (pass)\
    \ the parameters:\n\n```cpp\n#include <iostream>\n#include <utility>\nvoid reference(int&\
    \ v) {\n    std::cout << \"lvalue reference\" << std::endl;\n}\nvoid reference(int&&\
    \ v) {\n    std::cout << \"rvalue reference\" << std::endl;\n}\ntemplate <typename\
    \ T>\nvoid pass(T v) {\n    std::cout << \" normal param passing: \" <<\n    reference(v);\n\
    \    std::cout << \" std::move param passing: \" <<\n    reference(std::move(v));\n\
    \    std::cout << \" std::forward param passing: \" <<\n    reference(std::forward<T>(v));\n\
    \    std::cout << \" _static_cast<T&> param passing: \" <<\n    reference(static_cast<T&&>(v));\n\
    }\nint main() {\n    std::cout << \"rvalue pass:\" << std::endl;\n    pass(1);\n\
    \    int l = 1;\n    std::cout << \"lvalue pass:\" << std::endl;\n    pass(l);\n\
    \    return 0;\n}\n```\n\nThe outputs are:\n\nrvalue pass:\nnormal param passing:\
    \ lvalue reference\nstd::move param passing: rvalue reference\nstd::forward param\
    \ passing: rvalue reference\nstatic_cast<T&&> param passing: rvalue reference\n\
    lvalue pass:\nnormal param passing: lvalue reference\nstd::move param passing:\
    \ lvalue reference\nstd::forward param passing: lvalue reference\nstatic_cast<T&&>\
    \ param passing: lvalue reference\n"
  mdcn: "\n\n- 1. 首先构造两个作为返回右值（as-return-rvalue）的 A 对象，并获取这两个构造函数的输出；\n- 2. 函数返回后，它将生成一个\
    \ xvalue，它被 A 的移动结构（A&&）引用，从而扩展其生命周期，并将右值中的指针保存到 obj 中。在移动操作过程中，指向值的指针被设置为 `nullptr`，这防止了区域被销毁。\n\
    \n这避免了无意义的拷贝构造并提升了性能。让我们来看涉及标准库的示例：\n\n```cpp\n#include <iostream> // std::cout\n\
    #include <utility> // std::move\n#include <vector> // std::vector\n#include <string>\
    \ // std::string\n\nint main() {\n\n    std::string str = \"Hello world.\";\n\
    \    std::vector<std::string> v;\n\n    // push_back(const T&), copy\n    v.push_back(str);\n\
    \    // \"str: Hello world.\"\n    std::cout << \"str: \" << str << std::endl;\n\
    \n    // push_back(const T&), no copy\n    // 字符串将被移动到 vector 中，因此 std::move 可以减少拷贝成本\n\
    \    v.push_back(std::move(str));\n    // str 现在是空的\n    std::cout << \"str: \"\
    \ << str << std::endl;\n\n    return 0;\n}\n```\n\n## 完美转发 (Perfect forwarding)\n\
    \n正如我们之前提到的，声明的右值引用实际上是一个左值（lvalue）。这为我们进行参数化（传递）造成了问题：\n\n## 3.3 右值引用 (rvalue\
    \ Reference)\n\n```cpp\n#include <iostream>\n#include <utility>\nvoid reference(int&\
    \ v) {\n    std::cout << \"lvalue reference\" << std::endl;\n}\nvoid reference(int&&\
    \ v) {\n    std::cout << \"rvalue reference\" << std::endl;\n}\ntemplate <typename\
    \ T>\nvoid pass(T& v) {\n    std::cout << \" normal param passing: \";\n    reference(v);\n\
    }\nint main() {\n    std::cout << \"rvalue pass:\" << std::endl;\n    pass(1);\n\
    \n    int l = 1;\n    pass(l);\n\n    return 0;\n}\n```\n\n对于 `pass(1)`，虽然值是右值，但\
    \ `v` 是一个引用，它也是一个左值。因此 `reference(v)` 将调用 `reference(int&)` 并输出 lvalue。对于 `pass(1)`，`1`\
    \ 是一个右值，为什么它能成功地传递给 `pass(T& v)` 呢？\n\n这是基于引用折叠规则（reference collapsing rule）：在传统的\
    \ C++ 中，我们无法继续引用引用类型。然而，C++ 随着右值引用的出现放宽了这一限制，产生了引用折叠规则，允许我们使用左值引用和右值引用。但必须遵循以下规则：\n\
    \n| 函数参数类型 | 实际参数类型 | 推导后的函数参数类型 |\n|---|---|---|\n| T& | lvalue ref | T& |\n\
    | T& | rvalue ref | T& |\n| T&& | lvalue ref | T& |\n| T&& | rvalue ref | T& |\n\
    \n在模板函数中使用 `T&&` 可能无法产生右值引用，当传递一个左值时，该函数的引用将被推导为左值。更准确地说，无论模板参数是什么种类型的引用，当且仅当参数类型为右值引用时，模板参数才能被推导为右引用类型。这使得\
    \ `v` 完成了成功的传递。\n\n完美转发基于上述规则。所谓的“转发”是为了让我们在传递参数时保持原始的参数类型（左值引用保持左值，右值引用保持右值引用）。为了解决这个问题，我们应该使用\
    \ `std::forward`（传递）参数：\n\n```cpp\n#include <iostream>\n#include <utility>\nvoid\
    \ reference(int& v) {\n    std::cout << \"lvalue reference\" << std::endl;\n}\n\
    void reference(int&& v) {\n    std::cout << \"rvalue reference\" << std::endl;\n\
    }\ntemplate <typename T>\nvoid pass(T v) {\n    std::cout << \" normal param passing:\
    \ \" <<\n    reference(v);\n    std::cout << \" std::move param passing: \" <<\n\
    \    reference(std::move(v));\n    std::cout << \" std::forward param passing:\
    \ \" <<\n    reference(std::forward<T>(v));\n    std::cout << \" _static_cast<T&>\
    \ param passing: \" <<\n    reference(static_cast<T&&>(v));\n}\nint main() {\n\
    \    std::cout << \"rvalue pass:\" << std::endl;\n    pass(1);\n    int l = 1;\n\
    \    std::cout << \"lvalue pass:\" << std::endl;\n    pass(l);\n    return 0;\n\
    }\n```\n\n输出结果：\n\nrvalue pass:\nnormal param passing: lvalue reference\nstd::move\
    \ param passing: rvalue reference\nstd::forward param passing: rvalue reference\n\
    static_cast<T&&> param passing: rvalue reference\nlvalue pass:\nnormal param passing:\
    \ lvalue reference\nstd::move param passing: lvalue reference\nstd::forward param\
    \ passing: lvalue reference\nstatic_cast<T&&> param passing: lvalue reference\n\
    \n"
