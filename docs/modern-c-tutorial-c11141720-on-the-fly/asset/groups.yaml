  mdcn: "\n\n# 7.5 原子操作与内存模型\n\n```cpp\ncs[i] = std::thread(consumer);\n}\nfor (int\
    \ i = 0; i < 2; ++i) {\n    cs[i].join();\n}\nreturn 0;\n```\n\n值得提到的是，虽然我们可以在生产者中使用\
    \ `notify_one()`，但并不真正建议使用它。因为在有多个消费者的情况下，我们的消费者实现只是简单地放弃了对锁的持有，这使得其他消费者可能竞争这个锁，从而利用多个消费者之间的并发性。尽管如此，但实际上由于\
    \ `std::mutex` 的存在，我们根本无法期望多个消费者能够在并行的消费者队列中产生内容，我们仍然需要一种更细粒度的方法。\n\n# 7.5 原子操作与内存模型\n\
    \n细心的读者可能会被这样一个事实所诱惑：上一节中生产者-消费者模型的示例可能存在导致程序错误的编译器优化。例如，布尔值变量 **notified** 并没有通过\
    \ *volatile* 修改，且编译器对该变量进行了优化，将其存储为寄存器中。结果是，消费者线程永远无法观察到该值的变化。这是一个很好的问题。为了解释这个问题，我们需要进一步讨论从\
    \ C++11 开始引入的内存模型概念。让我们先来看一个问题：以下代码的输出是什么？\n\n```cpp\n#include <thread>\n#include\
    \ <iostream>\n\nint main() {\n    int a = 0;\n    volatile int flag = 0;\n\n \
    \   std::thread t1([&]() {\n        while (flag != 1) {\n            int b = a;\n\
    \            std::cout << \"b = \" << b << std::endl;\n        }\n    });\n\n\
    \    std::thread t2([&]() {\n    a = 5;\n    flag = 1;\n```\n\n```cpp\n));\n\n\
    \    t1.join();\n\n    t2.join();\n\n    return 0;\n\n}\n```\n\n直觉上，`t2` 中的 `a\
    \ = 5;` 似乎始终在 `flag = 1;` 之前执行，而 `t1` 中的 `while (flag != 1)` 似乎 `std::cout <<\
    \ \"b = \" << b << std::endl;` 不会在标记改变之前执行。从逻辑上讲，`b` 的值应该等于 5。但实际情况比这复杂得多，或者说代码本身是未定义行为，因为对于\
    \ `flag`，它们在两个并行线程中被读写。这存在竞争。再次，即使我们忽略竞争性的读写，CPU 仍然可能出现乱序执行，编译器对指令重排的影响也会导致 `a\
    \ = 5` 发生在 `flag = 1` 之后。因此，`b` 可能输出 0。\n\n# 原子操作\n\n`std::mutex` 可以解决并发读写问题，但互斥是一个操作系统层面的函数。这是因为互斥的实现通常包含两个基本原理：\n\
    \n- 1. 提供线程之间的自动状态转换，即“锁定”状态\n- 2. 确保在整个互斥操作期间，被操作变量的内存与临界区隔离开\n\n这是一组非常强大的同步条件，换句话说，当它最终编译成\
    \ CPU 指令时，它的表现像很多指令（我们稍后将看如何实现简单的互斥）。对于一个只需要原子操作（无中间状态）的变量来说，这似乎太严苛了。\n\n同步条件的研究有非常久的历史，我们在这里不进行细节。读者应该理解，在现代\
    \ CPU 架构下，CPU 指令级提供了原子操作。因此，在 C++11 多线程安全变量的读写中，引入了 `std::atomic` 模板，通过实例化一个原子类型，使得原子类型的读写操作从一组指令减少到单条\
    \ CPU 指令。例如：\n\n```cpp\nstd::atomic<int> counter;\n```\n\n并为整数或浮点数的原子类型提供了基本的成员函数，例如包括\
    \ `fetch_add`、`fetch_sub` 等，对应的 `+`、`-` 版本则通过重载提供。例如，以下示例：\n\n```cpp\n#include\
    \ <atomic>\n#include <thread>\n#include <iostream>\n```\n\n```cpp\nstd::atomic<int>\
    \ count = {0};\n```\n\n```cpp\nint main() {\n    std::thread t1([](){\n      \
    \  count.fetch_add(1);\n    });\n    std::thread t2([](){\n        count++; //\
    \ 等同于 fetch_add\n        count += 1; // 等同于 fetch_add\n    });\n    t1.join();\n\
    \    t2.join();\n    std::cout << count << std::endl;\n    return 0;\n}\n```\n\
    \n当然，并不是所有类型都提供原子操作，因为原子操作的可行性取决于 CPU 架构以及实例化的类型结构是否满足架构的内存对齐要求，因此我们始终可以通过 `std::atomic<T>::is_lock_free`\
    \ 来检查原子类型是否需要支持原子操作，例如：\n\n```cpp\n#include <atomic>\n#include <iostream>\n```\n\
    \n```cpp\nstruct A {\n    float x;\n    int y;\n    long long z;\n}\n```\n\n```cpp\n\
    int main() {\n    std::atomic<A> a;\n    std::cout << std::boolalpha << a.is_lock_free()\
    \ << std::endl;\n    return 0;\n}\n```\n\n# 7.5 原子操作与内存模型\n\n# 一致性模型\n\n多个线程并行时，上一节中生产者消费者模型的示例可能存在导致程序错误的编译器优化。例如，布尔值\
    \ **notified** 并没有通过 *volatile* 修改，且编译器对该变量进行了优化，将其存储为寄存器。结果是，消费者线程永远无法观察到该值的变化。这是一个很好的问题。为了解释这个问题，我们需要进一步讨论从\
    \ C++11 开始引入的内存模型概念。让我们先来看一个问题：以下代码的输出是什么？\n\n如果我们强制线程之间的操作是原子的，由于多线程，出现了顺序执行。有什么方法可以正确地加速这一点？答案是，通常我们考虑四种不同的一致性模型：\n\
    \n- 1. 线性一致性（Linear Consistency）：也称为强一致性或一致。它要求任何读取操作都能读到最新的写入，且所有线程的操作与全局时钟一致。\n\
    \n```cpp\nx.store(1)           x.load()\nT1          -------->\n\nT2----------------->\n\
    \            x.store(2)\n```\n\n在这种情况下，线程 T1、T2 是原子的，且 `store(1)` 严格在 `store(2)`\
    \ 之前执行。值得提到的是，全局时钟的要求很难实现，这就是为什么人们继续研究其他一致算法。\n\n- 2. 顺序一致性（Sequential Consistency）：它要求任何读取操作都能读到最后写入的数据，但不要求与全局时钟的顺序一致。\n\
    \n```cpp\nx.store(1)   x.store(3)   x.load()\nT1          ------------------+----->\n\
    \nT2 ---------------------\nx.store(2)\n```\n\n顺序一致性要求下，`x.load()` 必须读取最后写入的数据，但\
    \ `store(2)` 和 `store(1)` 之间没有任何保证，因为 T2 的 `store(2)` 发生在 `store(3)` 之前。\n\n3.\
    \ 因果一致性（Causal Consistency）：它的要求进一步降低，因此只保证因果操作的序列，而对非因果操作顺序不保证。\n\n```cpp\na\
    \ = 1 b = 2\nT1 --------------------------->\n\nT2 -------------------------------------\n\
    x.store(3) c = a + b y.load()\n```\n\n```cpp\na = 1 b = 2\nT1 ----------+--------------------\n\
    \nT2 ----------+---------------------\nx.store(3) y.load() c = a + b\n```\n\n\
    ```cpp\nb = 2 a = 1\nT1 ----------+--------------------\n\nT2 -------------------------------------\n\
    y.load() c = a + b x.store(3)\n```\n\n上述三个示例都是因果一致的，因为在整个过程中，只有 `c` 依赖 `a` 和 `b`，而\
    \ `x` 和 `y` 在示例中没有关联。（但在实际情况下，我们需要更详细的信息来确定 x 与 y 没有关联）\n\n"
