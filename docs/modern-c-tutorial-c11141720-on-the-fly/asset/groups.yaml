    \ element : vec) {\n            element += 1; // 可写\n        }\n        std::cout\
    \ << element << std::endl; // 只读\n    }\n}\n```\n\nC++ 模板一直是语言的一门特殊艺术，甚至可以作为一种新语言使用。模板的哲学是在编译时处理所有问题，只在运行时处理，从而极大地优化了性能。因此，模板也是\
    \ C++ 的黑魔法之一。\n\n### 外部模板\n\n在传统的 C++ 中，模板只有在在使用时才由编译器实例化。换句话说，只要在编译单元（文件）中遇到完整的模板就会实例化。这导致了重复实例化，我们没有办法不触发实例化。为此，C++11\
    \ 引入了外部模板语法，允许我们显式编译器何时实例化模板：\n\n```cpp\ntemplate class std::vector<bool>; //\
    \ 强制实例化\nextern class std::vector<double>; // \n```\n\n在传统的 C++ 中，`>>` 总是被视为右移运算符。但实际上我们可以轻松编写嵌套模板：\n\
    \n```cpp\nstd::vector<std::vector<int>> matrix;\n```\n\n这在传统的 C++ 编译器下是不合法的，C++11\
