    std::string& look_up_a_string_2() {\n    return lookup2();\n}\n```\n\n使用 `decltype(auto)`，我们可以让编译器完成这些繁琐的参数转发：\n\
    \n```cpp\ndecltype(auto) look_up_a_string_1() {\n    return lookup1();\n}\ndecltype(auto)\
