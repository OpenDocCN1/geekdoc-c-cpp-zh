    # Chapter 05 Smart Pointers and Memory Management


    # 5.1 RAII and Reference Counting


    Programmers who understand Objective-C/Swift/JavaScript should know the concept
    of reference counting. The reference count is counted to prevent memory leaks.
    The basic idea is to count the number of dynamically allocated objects. Whenever
    you add a reference to the same object, the reference count of the referenced
    object incremented once. Each time a reference is deleted, the reference count
    is decremented by one. When the reference count of an object is reduced to zero,
    the pointed heap memory is automatically deleted.


    In traditional C++, “remembering” to manually release resources is not always
    a best practice. Because we are likely to forget to release resources and lead
    to leakage. The usual practice is that for an object, we allocate space when constructor,
    and free space when the destructor (called when leaving the scope). That is, we
    often say that the RAII resource acquisition is the initialization technique.


    There are exceptions to everything, we use **new** and **delete** to “remember”
    to release resources. C++11 introduces the concept of smart pointers, using the
    idea of reference counting, so that programmers no longer need to care about manually
    releasing memory. These smart pointers include std::shared_ptr/unique_ptr/weak_ptr,
    which include in the header file <memory>.


    Note: The reference count is not garbage collection. The reference count can recover
    the objects that are no longer used soon as possible, and will not cause waits
    during the recycling process. More clearly and clearly indicate the life cycle
    of resources.


