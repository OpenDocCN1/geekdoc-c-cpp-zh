  mdcn: "\n\n# 第 05 章 智能指针与内存管理\n\n根据实际场景使用，以获得更好的性能。\n\n虽然 `std::tuple` 是高效的，但标准库提供的功能有限，无法满足运行时索引和迭代的需求。幸运的是，我们可以自己实现这些方法。\n\
    \n# 第 05 章智能指针与内存管理\n\n## 5.1 RAII 与引用计数\n\n理解 Objective-C/Swift/JavaScript 的程序员应该知道引用计数的概念。基本思想是统计动态分配对象的数量。每当你向同一个对象添加一个引用时，对象的引用计数加一。每次引用被删除时，引用计数减一。当对象的引用计数减到零时，指向的堆内存会被自动删除。\n\
    \n在传统的 C++ 中，手动“记住”释放资源并不是最佳实践，因为我们可能会忘记释放资源导致内存泄漏。通常的做法是使用 RAII 技术，在初始化时获取资源，并在析构函数中释放资源。\n\
    \nC++11 引入了智能指针的概念，使得程序员不再需要手动释放内存。这些智能指针包括 `std::shared_ptr`/`std::unique_ptr`/`std::weak_ptr`，它们包含在\
    \ `<memory>` 头文件中。注意：引用计数不是垃圾回收。引用计数可以尽可能早地回收对象，而会在回收过程中等待。这更清晰地指示了资源的生命周期。\n\n\
    ## 5.2 std::shared_ptr\n\n`std::shared_ptr` 是一种智能指针，它跟踪有多少个智能指针指向同一个对象，当引用计数变为零时，会自动删除该对象。\n\
    \n但使用 `std::shared_ptr` 仍然需要配合 `new` 调用，这导致了某种不对称。`std::make_shared` 可以消除对 `new`\
    \ 的显式使用，因为 `std::make_shared` 会在内部生成该类型的智能指针对象。例如：\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\nvoid foo(std::shared_ptr<int> i) {\n    (*i)++;\n}\n\nint\
    \ main() {\n    // auto pointer = new int(10); // 非法，直接赋值\n    // 构建一个 std::shared_ptr\n\
    \    auto pointer = std::make_shared<int>(10);\n    foo(pointer);\n    // shared_ptr\
    \ 在离开作用域前被销毁\n    return 0;\n}\n```\n\n`std::shared_ptr` 可以通过 `get()` 方法获取原始指针，并通过\
    \ `reset()` 方法减少引用计数。例如：\n\n```cpp\nauto pointer = std::make_shared<int>(10);\n\
    auto pointer2 = pointer; // 引用计数+1\nauto pointer3 = pointer; // 引用计数+1\nint *p\
    \ = pointer.get(); // 不增加引用计数\nstd::cout << \"pointer.use_count() = \" << pointer.use_count()\
    \ << std::endl; // 3\nstd::cout << \"pointer2.use_count() = \" << pointer2.use_count()\
    \ << std::endl; // 3\nstd::cout << \"pointer3.use_count() = \" << pointer3.use_count()\
    \ << std::endl; // 3\n\npointer2.reset();\nstd::cout << \"reset pointer 2:\" <<\
    \ std::endl;\nstd::cout << \"pointer2.use_count() = \" << pointer2.use_count()\
    \ << std::endl; // 2\n// 注意：这里似乎重复行，保持逻辑：\n// std::cout << \"pointer2.use_count()\
    \ = \" << pointer2.use_count() << std::endl; // 0, pointer2 已重置\nstd::cout <<\
    \ \"pointer3.use_count() = \" << pointer3.use_count() << std::endl; // 2\n\npointer3.reset();\n\
    std::cout << \"reset pointer 3:\" << std::endl;\nstd::cout << \"pointer.use_count()\
    \ = \" << pointer.use_count() << std::endl; // 1\nstd::cout << \"pointer2.use_count()\
    \ = \" << pointer2.use_count() << std::endl; // 0\nstd::cout << \"pointer3.use_count()\
    \ = \" << pointer3.use_count() << std::endl; // 0, pointer3 已重置\n```\n\n## 5.3\
    \ std::unique_ptr\n\n`std::unique_ptr` 是一种独占智能指针，禁止其他指针共享对象，从而保证代码安全。\n\n```cpp\n\
    std::unique_ptr<int> pointer = std::make_unique<int>(10); // make_unique 引入于 C++14\n\
    std::unique_ptr<int> pointer2 = pointer; // 非法\n```\n\n`make_unique` 是比较复杂的。C++11\
    \ 没有提供 `std::make_unique`，可以自己实现：\n\n```cpp\ntemplate<typename T, typename...\
    \ Args>\nstd::unique_ptr<T> make_unique(Args&&... args) {\n    return std::unique_ptr<T>(new\
    \ T(std::forward<Args>(args)...));\n}\n```\n\n至于为什么没有提供，C++ 标准委员会主席 Herb Sutter\
    \ 在他的博客中提到是因为他们忘记了。然而，由于它是可移动的，我们可以使用 `std::move` 将其转移给 `unique_ptr`，例如：\n\n```cpp\n\
    #include <iostream>\n#include <memory>\n\nstruct Foo {\n    Foo() { std::cout\
    \ << \"Foo\" << std::endl; }\n    ~Foo() { std::cout << \"-Foo\" << std::endl;\
    \ }\n    void foo() { std::cout << \":foo\" << std::endl; }\n};\n\nvoid f(const\
    \ Foo&) {\n    std::cout << \"f(const Foo&)\" << std::endl;\n}\n\nint main() {\n\
    \    std::unique_ptr<Foo> p1(std::make_unique<Foo>());\n\n    // p1 不空，打印\n  \
    \  if (p1) p1->foo();\n    std::unique_ptr<Foo> p2(std::move(p1));\n    // p1\
    \ 现在为空，不打印\n    if (p1) p1->foo();\n    // p2 不为空，打印\n    if (p2) p2->foo();\n\
    \    std::cout << \"p2 was destroyed\" << std::endl;\n}\n```\n\n## 5.4 std::weak_ptr\n\
    \n如果你仔细考虑 `std::shared_ptr`，你仍然会发现资源无法释放的问题。看以下示例：\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\nclass A;\nclass B;\n\nclass A {\npublic:\n    std::shared_ptr<B>\
    \ pointer;\n    ~A() {\n        std::cout << \"A was destroyed\" << std::endl;\n\
    \    }\n};\n\nclass B {\npublic:\n    std::shared_ptr<A> pointer;\n    ~B() {\n\
    \        std::cout << \"B was destroyed\" << std::endl;\n    }\n};\n\nint main()\
    \ {\n    std::shared_ptr<A> a = std::make_shared<A>();\n    std::shared_ptr<B>\
    \ b = std::make_shared<B>();\n    a->pointer = b;\n    b->pointer = a;\n\n   \
    \ return 0;\n}\n```\n\n结果是 A 和 B 都不会被销毁。这是因为 b 内部的指针也引用了 a，这使得 a 和 b 的引用计数变为 2，离开作用域。当\
    \ a, b 智能指针被销毁时，它们只会导致 a 和 b 的引用计数减一。这导致指向 a, b 对象的内存引用计数非零，但外部无法发现这一点，从而导致了内存泄漏，如图\
    \ 5.1 所示。\n\n解决此问题的方法使用弱引用 `std::weak_ptr`，它是一种弱引用（相比 std::shared_ptr 是强引用）。弱引用不会导致引用计数增加。当使用弱引用时，最终的释放过程如图\
    \ 5.2 所示。\n\n在上面的图中，B 被留在了最后一步，并且没有任何智能指针指向它，这部分内存资源也将被释放。\n\n`std::weak_ptr`\
    \ 没有 `*` 和 `->` 运算符，因此它无法操作资源。它的唯一功能是检查 `std::shared_ptr` 是否，`expired()` 方法在资源未释放时返回\
    \ `false`，否则返回 `true`。\n\n![](img/e38a3926c5c51066839ec75b97aea207_60_0.png)\n\
    \n"
