    \ l = {1, 2, 3};\n    std::sort(l.begin(), l.end());\n    return 0;\n}\n```\n\n\
    错误的根源在于 `std::sort` 必须提供随机迭代器。在概念语言中，我们可以这样约束模板参数：\n\n附录中我们将简要讨论现代 C++ 的最佳实践。通常，作者对\
    \ C++ 最佳实践的想法主要吸收自《Effective Modern C++》和 C++ Style Guide。在附录中，我们将简要讨论并使用实际示例说明这些方法，并介绍一些作者个人的、非常见的、合理的最佳实践，以及如何确保代码的整体质量。\n\
