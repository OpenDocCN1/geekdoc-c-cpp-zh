    \ T> MagicType<std::vector<T>>;\n```\n\nC++11 使用 `using` 引入别名语法，同时支持与 `typedef`\
    \ 相同的效果。通常使用 `typedef` 定义别名，但函数指针别名的定义语法不同，这通常给直接读取带来了困难。\n\n```cpp\ntypedef int\
    \ (*process)(void);\nusing NewProcess = int(*)(void);\ntemplate<typename T>\n\
    using TrueMagic = MagicType<std::vector<T>>;\n\nint main() {\n    TrueMagic m;\n\
    }\n```\n\n### 默认模板参数\n\n我们可能定义了加法函数：\n\n```cpp\ntemplate<typename T, typename\
    \ U>\nauto add(T x, U y) -> decltype(x+y) {\n    return x+y;\n}\n```\n\n使用时，发现发现调用\
    \ `add` 都必须指定其模板参数的类型。C++11 的便利之处在于指定模板的默认参数：\n\n```cpp\ntemplate<typename T =\
    \ int, typename U = int>\nauto add(T x, U y) -> decltype(x+y) {\n    return x+y;\n\
    }\n// 使用: add(1, 2) 或 add<double>(1, 2.0)\n```\n\n### 变长模板\n\n模板一直是 C++ 的独特黑魔法之一。在传统的\
    \ C++ 中，类模板和函数模板只能接受一组指定的模板参数；C++11 添加了一种新的表示方法，允许任意数量的模板参数，定义时不需要固定参数数量：\n\n\
    ```cpp\ntemplate<typename... Ts> class Magic;\n```\n\n`Magic` 类可以接受无限制数量的 `typename`\
    \ 作为模板的形式参数，如下所示：\n\n```cpp\nclass Magic<int,\n    std::vector<int>,\n    std::map<int,\
