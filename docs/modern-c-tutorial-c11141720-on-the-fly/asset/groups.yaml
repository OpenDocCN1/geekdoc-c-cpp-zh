    \n当我们在运行时声明、定义变量或常量，并控制代码流、面向对象的函数、模板编程等时，这些可能会在编写代码或编译器编译代码时发生。我们通常称这为语言可用性，指的是发生在运行之前的语言行为。\n\
    \n## 2.1 常量\n\n### nullptr\n\n`nullptr` 的出现是为了替代 NULL。在某种意义上，传统的 C++ 将 NULL 和\
    \ 0 视为相同，这取决于编译器如何定义 NULL，某些编译器将 NULL 定义为 `((void*)0)`，而有些直接将其定义为 0。\n\nC++ 不允许将\
    \ `void *` 隐式转换为其他类型。但如果编译器尝试将 NULL 定义为 `((void*)0)`，那么在以下代码中：\n\n```cpp\nchar\
    \ *ch = NULL;\n```\n\nC++ 没有通过 `void *` 隐式转换将 NULL 定义为 0。这仍然产生了一个问题。将 NULL 定义为\
    \ 0 会导致 C++ 的重载功能变得混乱。考虑以下两个函数：\n\n```cpp\nvoid foo(char*);\nvoid foo(int);\n\
    ```\n\n那么 `foo(NULL)` 语句将调用 `foo(int)`，这会导致代码违背直觉。\n\n为了解决这个问题，C++11 引入了 `nullptr`\
    \ 关键字，专门用于区分空指针。`nullptr` 的类型是 `nullptr_t`，它可以隐式转换为任何指针或指针类型，并可以与它们进行相等或不等的比较。\n\
    \n你可以尝试使用 clang++ 编译以下代码：\n\n```cpp\n#include <iostream>\n#include <type_traits>\n\
    \nvoid foo(char *);\nvoid foo(int);\n\nint main() {\n    if (std::is_same<decltype(NULL),\
    \ void(*)>::value) {\n        std::cout << \"NULL = 0\" << std::endl;\n    }\n\
    \    if (std::is_same<decltype(NULL), void(*)>::value) {\n        std::cout <<\
    \ \"NULL = (void*)0\" << std::endl;\n    }\n    if (std::is_same<decltype(NULL),\
    \ nullptr_t>::value) {\n        std::cout << \"NULL = nullptr\" << std::endl;\n\
    \    }\n\n    foo(0);              // 会调用 foo(int)\n    foo(NULL);      // 不编译\n\
    \    foo(nullptr);      // 会调用 foo(char*)\n    return 0;\n}\n\nvoid foo(int i)\
    \ {\n    std::cout << \"foo(int) is called\" << std::endl;\n}\n\n// 输出是：\nfoo(int)\
    \ is called\nfoo(char*) is called\n```\n\n从输出可以看出 NULL 不同于 0。因此，养成直接使用 `nullptr`\
    \ 的习惯。此外，在代码中使用的 `decltype` 和 `std::is_same` 是现代 C++ 的语法。简单来说，`decltype` 用于类型推导，`std::is_same`\
    \ 用于比较两个类型的相等性。我们将在 `constexpr` 部分详细讨论。\n\n### constexpr\n\nC++ 本身已经有了常量表达式的概念，例如\
    \ `1+2`、`3*4`。这类表达式总是产生相同的结果。如果编译器可以在编译时直接嵌入这些表达式，将会提高性能。一个非常明显的例子是在数组定义：\n\n\
    ```cpp\n#include <iostream>\n#define LEN 10\n\nint len_foo() {\n    int i = 2;\n\
    \    return i;\n}\n\nconstexpr int len_foo() {\n    return 5;\n}\n\nconstexpr\
    \ int fibonacci(int n) {\n    return n == 1 || n == 2 ? 1 : fibonacci(n-1) + fibonacci(n-2);\n\
    }\n\nint main() {\n    char arr1[10]; // 合法\n    char arr2[LEN]; // 合法\n    int\
    \ len = 10;\n    // arr3[len];               // 非法\n\n    const int len2 = len\
    \ + 1;\n    constexpr int len2c = len + 2 + 3;\n    // arr4[len2];           \
    \   // 非法，但在大多数编译器中可以\n    char arr4[len2c];         // 合法\n\n    // arr5[len_foo()];\
    \          // 非法\n    char arr6[len_foo() = 2 ? 1]; // 合法\n\n    // 1, 2, 3, 5,\
    \ 8, 13, 21, 34, 55\n    std::cout << fibonacci(10) << std::endl;\n\n    return\
    \ 0;\n}\n```\n\n在上面的示例中，`arr4[len2]` 可能会让人困惑，因为 `len2` 被定义为常量。为什么 `arr4[len2]`\
    \ 是法的？因为 C++ 标准规定数组长度必须是常量表达式，对于 `len2`，它是一个 const 常量而不是常量表达式（尽管大多数编译器支持，但它是非法行为）。我们需要使用\
    \ C++11 引入的 `constexpr` 特性来解决这个问题；在 C++98 中，编译器不知道 `len_foo()` 在运行时返回常量，这导致了错误的产生。注意，大多数编译器现在都有自己的优化。许多非法行为在编译优化下变成了合法的。如果你需要重现错误，需要使用旧版本的编译器。C++11\
    \ 允许用户显式声明函数或对象构造将在编译时变为常量表达式。`constexpr` 关键字显式告诉编译器 `len_foo` 应该是一个编译时表达式。\n\n\
    此外，`constexpr` 函数可以使用递归：\n\n```cpp\nconstexpr int fibonacci(int n) {\n    return\
    \ n == 1 || n == 2 ? 1 : fibonacci(n-1) + fibonacci(n-2);\n}\n```\n\n从 C++14 开始，`constexpr`\
    \ 函数内部可以使用简单语句作为局部变量、循环和分支。例如，代码在 C++11 标准下无法编译。\n\n## 2.2 变量与初始化\n\n```cpp\n\
    constexpr int fibonacci(int n) {\n    if(n == 1) return 1;\n    if(n == 2) return\
    \ 1;\n    return fibonacci(n-1) + fibonacci(n-2);\n}\n```\n\n对于此，我们可以写一个简化版本使其从\
    \ C++11 开始可用：\n\n```cpp\nconstexpr int fibonacci(int n) {\n  return n == 1 ||\
    \ n == 2 ? 1 : fibonacci(n-1) + fibonacci(n-2);\n}\n```\n\n### if-switch\n\n在传统的\
    \ C++ 中，变量的声明可以声明一个临时 int，尽管它可以位于任何地方，即使是一个语句，但在 `if` 和 `switch` 语句中没有办法声明临时变量。例如：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n```\n\n\
    ```cpp\nint main() {\n  std::vector<int> vec = {1, 2, 3, 4};\n\n  // 从 c++17 开始，可以使用\
    \ auto 简化\n  const std::vector<int>::iterator itr = std::find(vec.begin(), vec.end(),\
    \ 2);\n  if (itr != vec.end()) {\n    *itr = 3;\n  }\n\n  if (const std::vector<int>::iterator\
    \ itr = std::find(vec.begin(), vec.end(), 3);\n      itr != vec.end()) {\n   \
    \ *itr = 4;\n  }\n\n  // 应该输出：1, 4, 3, 4。可以使用 auto 简化\n  for (std::vector<int>::iterator\
    \ element = vec.begin(); element != vec.end(); ++element) {\n    std::cout <<\
    \ *element << std::endl;\n  }\n}\n```\n\n"
