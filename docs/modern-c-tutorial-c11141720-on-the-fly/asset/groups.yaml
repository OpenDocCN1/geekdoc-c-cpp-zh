    ## 9.4 内存对齐 (Memory Alignment)\n\n自定义字面量支持字面量：\n\n- 整数字面量：重载时，必须使用 `unsigned long\
    \ long`、`const char *` 和模板字面量运算符参数。前者用于上面的代码；\n- 浮点数字面量：重载时必须使用 `long double`、`const\
    \ char *` 和模板字面量；\n- 字符串字面量：必须使用形式为 `(const char *, size_t)` 的参数列表；\n- 字符字面量：参数只能是\
    \ `char`、`wchar_t`、`char16_t`、`char32_t`。\n\nC++11 引入了两个新关键字 `alignof` 和 `alignas`\
    \ 来支持内存对齐的控制。`alignof` 关键字可以获取 `std::size_t` 类型的平台相关值以查询平台的对齐情况。当然，我们有时对此并不满意，甚至想要自定义结构的对齐。同样，C++\
