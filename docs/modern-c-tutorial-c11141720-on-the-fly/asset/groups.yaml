    \ << sizeof...(args) << std::endl;\n}\n```\n\n我们可以向 `magic` 函数传递任意数量的参数：\n\n```cpp\n\
    magic(); // 0\nmagic(1); // 1\nmagic(1, \"\"); // 2\n```\n\n### 1. 递归模板函数\n\n\
