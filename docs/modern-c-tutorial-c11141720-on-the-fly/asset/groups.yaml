    ```\n\n### 类型别名模板\n\n在理解类型别名模板之前，你需要理解“模板”和“类型”的区别。模板用于生成类型。在传统的 C++ 中，`typedef`\
    \ 可以为类型定义新名称，但由于模板不是类型，因此无法为模板定义新名称。例如：\n\n```cpp\ntemplate<typename T, typename\
