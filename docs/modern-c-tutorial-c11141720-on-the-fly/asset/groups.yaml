    \n### 基于范围的 for 循环\n\n最后，C++11 引入了基于范围的迭代方法，我们能够编写像 Python 一样简洁的循环，并且进一步简化之前的示例：\n\
    \n## 2.5 模板\n\n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\
    \nint main() {\n    std::vector<int> vec = {1, 2, 3, 4};\n    if (auto itr = std::find(vec.begin(),\
