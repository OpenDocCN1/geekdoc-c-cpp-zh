  mdcn: "\n\n## 7.5 原子操作与内存模型 第 07 章 并行与并发\n\n4. **最终一致性 (Final Consistency)**：这是最弱的一致性要求。它只保证操作会在未来的某个点被观察到，但并不要求观测到的时间。因此我们甚至可以稍微加强这一条件，例如指定操作的观测时间始终是有界的。当然，这就不属于我们的讨论范围了。\n\
    \n```\nx.store(3)   x.store(4)\nT1--------------------------------------------------------------------->\n\
    T2--------------------------------------------------------------------->\nx.read()\
    \      x.read()      x.read()      x.read()\n```\n\n在上述情况下，如果我们假设 x 的初始值为 0，那么\
    \ T2 中的四个 'x.read()' 可能不限于以下结果：\n\n```\n3 4 4 4 // x 的写入操作被迅速观察到\n0 3 3 4 // x\
    \ 写入操作的观测时间存在延迟\n0 0 0 4 // 最后一次读取了 x 的最终值，但之前的更改没有被观察到。\n0 0 0 0 // 当前时间内没有观察到\
    \ x 的写入操作，但情况\n```\n\n## 内存顺序 (Memory Orders)\n\n为了实现极致性能并满足不同强度的一致性要求，C++11 为原子操作定义了六种不同的内存序列。std::memory_order\
    \ 指定了多个线程之间的同步模型：\n\n1. **宽松模型 (Relaxed model)**：在此模型下，单线程内的原子操作按顺序执行的，不允许指令排序，但线程之间的原子操作顺序是任意的。该类型由\
    \ `std::memory_order_relaxed` 指定。让我们来看一个例子：\n\n```cpp\nstd::atomic<int> counter\
    \ = {0};\nstd::vector<std::thread> vt;\nfor (int i = 0; i < 100; ++i) {\n    vt.emplace_back([&]{\n\
    \        counter.fetch_add(i, std::memory_order_relaxed);\n    });\n}\nfor (auto&\
    \ t : vt) {\n    t.join();\n}\nstd::cout << \"current counter: \" << counter <<\
    \ std::endl;\n```\n\n2. **释放/消费模型 (Release/consumption model)**：在此模型中，我们开始限制进程之间的操作顺序。如果一个线程需要修改一个值，但另一个线程对该值的操作有依赖，即后者依赖于前者。具体来说，A\
    \ 对 x 完成了三次写入，而 B 仅在第三次写入操作时释放，无论 x 的前两次写入如何，当 A 调用 `x.release()`（即使用 `std::memory_order_release`）时，`std::memory_order_consume`\
    \ 选项确保 B 在调用 `x.load()` 时观察到对 x 的三次写入。让我们来看一个例子：\n\n```cpp\n// 初始化为 nullptr 以防止消费者加载悬空指针\n\
    std::atomic<int*> ptr(nullptr);\nint v;\nstd::thread producer([&]() {\n    int*\
    \ p = new int(42);\n    ptr.store(p, std::memory_order_release);\n});\n\nstd::thread\
    \ consumer([&]() {\n    int* p;\n    while (!(p = ptr.load(std::memory_order_consume)))\
    \ {\n        std::cout << \"x: \" << *p << std::endl;\n        std::cout << \"\
    y: \" << v << std::endl;\n    }\n});\n\nproducer.join();\nconsumer.join();\n```\n\
    \n3. **释放/获取模型 (Release/Acquire model)**：在此模型下，我们可以进一步收紧不同线程之间原子操作的顺序，特别是指定释放\
    \ `std::memory_order_acquire` 和获取 `std::memory_order_acquire` 之间的时机。释放操作之前的所有写入对任何其他线程可见，即发生于（happens-before）。\n\
    \n如你所见，`std::memory_order_release` 确保写入行为发生在释放操作之前，这是一个前向屏障；`std::memory_order_acquire`\
    \ 确保之前的写入发生在获取操作之后，这是一个后向屏障。对于 `std::memory_order_acq_rel` 选项，它结合了二者的特征定义了一个内存屏障，使得当前线程的读写在该操作前后不会重排。让我们来看一个例子：\n\
    \n```cpp\nstd::vector<int> v;\nstd::atomic<int> flag = {0};\nstd::thread release([&]()\
    \ {\n    v.push_back(42);\n    flag.store(1, std::memory_order_release);\n});\n\
    \nstd::thread acquire([&]() {\n    int expected = 1; // 必须使用 compare_exchange_strong\n\
    \    while (!flag.compare_exchange_strong(expected, 2, std::memory_order_acq_rel))\
    \ {\n        expected = 1; // 必须使用 compare_exchange_strong\n    }\n    // flag\
    \ 已经变为 2\n    while (flag.load(std::memory_order_acquire) == 2) {\n        std::cout\
    \ << v[0] << std::endl; // 必须是 42\n    }\n});\nrelease.join();\nacquire.join();\n\
    ```\n\n在这种情况下使用 `compare_exchange_strong`，它是一种比较交换原语；较弱的版本 `compare_exchange_weak`\
    \ 允许在失败时返回失败，是因为在某些平台上当 CPU 执行上下文切换时会产生不一致。此外，`compare_exchange_strong` 的性能可能略低于\
    \ `compare_exchange_weak`，但在大多数情况下应该使用 `compare_exchange_strong`。\n\n4. **顺序一致性模型\
    \ (Sequential Consistent Model)**：在此模型下，原子操作满足一致性，可以通过 `std::memory_order_seq_cst`\
    \ 显式指定。让我们来看一个简单的示例：\n\n```cpp\nstd::atomic<int> counter{0};\nstd::vector<std::thread>\
    \ vt;\nfor (int i = 0; i < 100; ++i) {\n    vt.emplace_back([&](){\n        counter.fetch_add(1,\
    \ std::memory_order_seq_cst);\n    });\n}\n\nfor (auto & t : vt) {\n    t.join();\n\
    }\nstd::cout << \"current counter: \" << counter << std::endl;\n```\n\n这个示例与第一个相同，只需将原子操作的内存顺序改为\
    \ `memory_order_seq_cst`。感兴趣的读者可以编写自己的程序来测量这些内存序列带来的性能差异。\n\n## 总结\n\nC++11 语言为并发提供了支持。本节介绍了\
    \ `std::thread`/`std::mutex`/`std::future` 等并发编程中不可避免的工具。此外，我们还引入了内存模型，作为 C++11\
    \ 最重要的特性之一。它们为 C++ 的高性能计算提供了关键基础。\n\n## 练习\n\n- 1. 编写一个简单的线程池，提供以下功能：\n\n```cpp\n\
    ThreadPool p(4); // 指定工作线程\n\n// 提交任务并返回一个 std::future\nauto f = pool.enqueue([](int\
    \ life) {\n    return life;\n}, 42);\n\n// 从 future 获取结果\nstd::cout << f.get()\
    \ << std::endl;\n```\n\n- 2. 使用 `std::atomic<bool>` 实现互斥锁。\n\n## 扩展阅读\n\n- C++\n\
    - Thread document\n- Herlihy, M. P., & Wing, J. M. (1990). Linearizability: a\
    \ correctness condition for concurrent objects. ACM Transactions on Programming\
    \ Languages and Systems, 12(3), 463–492. https://doi.org/10.1145/78969.78972\n\
    \n## 第08 章 文件系统\n\n文件系统库提供了与文件系统、路径、文件、目录操作相关的函数。与正则表达式库类似，它是 boost 发布并最终合并到 C++\
