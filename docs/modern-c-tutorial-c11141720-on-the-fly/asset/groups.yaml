    \ 0 也是可能的：\n\n```cpp\nclass Magic<> nothing;\n```\n\n如果你不想生成 0 个模板参数，可以手动定义至少一个模板参数：\n\
    \n```cpp\ntemplate<typename Require, typename... Args> class Magic;\n```\n\n变长模板参数也可以直接调整为模板函数。经典\
    \ C 中的 `printf` 函数可以达到无限数量的形式参数的调用，但不是类安全的。除了定义类安全的变长函数外，C++11 还可以让类打印函数处理非自包含的对象。除了在模板参数中使用\
    \ `...` 来表示模板参数的无限长度外，函数也使用了相同的表示来表示无限长度参数，这为我们简单地编写变长参数函数提供了方便的方法，例如：\n\n```cpp\n\
