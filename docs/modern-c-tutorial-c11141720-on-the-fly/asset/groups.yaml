    \ 2.6 Object-oriented\n\n### Delegate constructor\n\nC++11 introduces the concept\
    \ of a delegate construct, which allows a constructor to call another constructor\
    \ in the same class, simplifying the code:\n\n```cpp\n#include <iostream>\nclass\
    \ Base {\npublic:\n    int value1;\n    int value2;\n    Base() {\n        value1\
    \ = 1;\n    }\n    Base(int value) : Base() { // delegate Base() constructor\n\
    \        value2 = value;\n    }\n};\n\nint main() {\n    Base b(2);\n    std::cout\
    \ << b.value1 << std::endl;\n    std::cout << b.value2 << std::endl;\n}\n```\n\
    \n### Inheritance constructor\n\nIn traditional C++, constructors need to pass\
    \ arguments one by one if they need inheritance, which leads to inefficiency.\
    \ C++11 introduces the concept of inheritance constructors using the keyword:\
    \ \n\n```cpp\n#include <iostream>\nclass Base {\npublic:\n  int value1;\n  int\
    \ value2;\n  Base() {\n    value1 = 1;\n  }\n  Base(int value) : Base() // delegate\
    \ Base() constructor\n    value2 = value;\n  }\n};\nclass Subclass : public Base\
    \ {\npublic:\n  using Base::Base; // inheritance constructor\n};\nint main() {\n\
    \  Subclass s(3);\n  std::cout << s.value1 << std::endl;\n  std::cout << s.value2\
    \ << std::endl;\n}\n```\n\n### Explicit virtual function overwrite\n\nIn traditional\
    \ C++, it is often prone to accidentally overloading virtual functions. E.g: \n\
    \n```cpp\nstruct Base {\n  virtual void foo();\n};\nstruct SubClass: Base {\n\
    \  void foo();\n};\n```\n\nSubClass::foo may not be a programmer trying to overload\
    \ a virtual function, just adding a function with the same name. Another possible\
    \ scenario is when the virtual function of the base class is deleted, the subclass\
    \ owns no function and no function. C++11 introduces the keywords override and\
    \ final to prevent this.\n\n### override\n\nWhen overloading a virtual function,\
    \ the override keyword will explicitly tell the compiler to check if it is indeed\
    \ an override:\n\n```cpp\nstruct Base {\n    virtual void foo(int);\n};\nstruct\
    \ SubClass : Base {\n    void foo(int) override; // legal\n    void foo(float)\
    \ override; // illegal\n};\n```\n\n### final\n\nfinal is to prevent the class\
    \ from being inherited or the function from being overridden:\n\n```cpp\nstruct\
    \ Base {\n    virtual void foo() final;\n};\nstruct SubClass1 : Base {\n}; //\
    \ illegal\nclass SubClass2 final {\n}; // legal\nstruct SubClass3 : Base {\n \
    \   void foo() // // illegal\n};\n```\n\n### Explicit delete function\n\nIn traditional\
    \ C++, if the programmer does not provide it, the compiler will default to generating\
    \ constructors, copy constructors, assignment operators, and destructors for the\
    \ object. In addition, C++ also defines operators as delete for all classes. This\
    \ part of the function can be overridden when the programmer needs it.\n\nThis\
    \ raises some requirements: the ability to accurately control the generation of\
    \ default functions. For example, when copying a class is prohibited, the copy\
    \ constructor and the assignment operator must be declared as delete. Trying to\
    \ use these undefined functions will result in compilation or link errors, which\
    \ is a very unconventional way.\n\nAlso, the default constructor generated by\
    \ the compiler cannot exist at the same time as the user-defined constructor,\
    \ but sometimes we want to have both constructors at the same time, which is awkward.\
    \ C++11 provides a solution to the above requirements, allowing explicit declarations\
    \ to take or reject functions that come with the compiler. E.g:\n\n```cpp\nclass\
    \ Magic {\npublic:\n    Magic() = default; // explicit let compiler use default\
    \ constructor\n    Magic& operator=(const Magic&) = delete; // explicit declare\
    \ refuse constructor\n    Magic(int magic_number);\n};\n```\n\n## 2.6 Object-oriented\
    \ CHAPTER 02: LANGUAGE USABILITY ENHANCEMENTS\n\nIn traditional C++, enumerated\
    \ types are not type-safe, and enumerated types are treated as integers, which\
    \ allows two completely different enumerated types to be directly compared (although\
    \ the compiler gives them check, but not all). Even the enumeration value names\
    \ of different enum types in the same namespace cannot be the same, which is usually\
    \ not what we want to see.\n\nC++11 introduces an enumeration class and declares\
