    ```

    - C++98 exception description, `exception_handler`, `set_exception()` and other
    related features are deprecated and should use `noexcept`.

    - `auto_ptr` is deprecated and `unique_ptr` should be used.

    - `register` keyword is deprecated and can be used but no longer has any practical
    meaning.

    - The destructor, properties for which it generates copy constructors and copy
    assignment operators are deprecated.

    - C language type conversion is deprecated (i.e. using `convert_type`) before
    `static_cast`, `reinterpret_cast`, `const_cast` should be used for type conversion.

