  - "[PAGE 75]\n\n# 7.5 Atomic Operation and Memory Model CHAPTER 07 PARALLELISM AND\
    \ CONCURRENCY\n\n# Consistency Model\n\nMultiple threads executing in parallel,\
    \ discussed at some macro level, can be roughly considered a distributed system.\
    \ In a distributed system, any communication or even local operation takes a certain\
    \ amount of time, and even unreliable communication.\n\nIf we force the operation\
    \ of a variable v between multiple threads to be atomic, that is, any thread after\
    \ the operation of v Others can synchronize to changes in v, for the variable\
    \ v, which appears as a sequential execution of the program, it does not have\
    \ any efficiency gains due to the introduction of multithreading. Is there any\
    \ way to accelerate this properly? The answer is to weaken the synchronization\
    \ conditions between processes in atomic operations.\n\nIn principle, each thread\
    \ can correspond to a cluster node, and communication between threads is almost\
    \ equivalent to communication between cluster nodes. Weakening the synchronization\
    \ conditions between processes, usually we consider four different consistency\
    \ models:\n\n+   1. Linear consistency: Also known as strong consistency or atomic\
    \ consistency. It requires that any read operation can read the most recent write\
    \ of a certain data, and the order of operation of all threads is consistent with\
    \ the order under the global clock.\n\n```\nx.store(1)           x.load()\nT1\
    \          -------+----------->\n\nT2--------------------------->\n          \
    \  x.store(2)\n```\n\nIn this case, thread T1, T2 is twice atomic to x, and x.store(1)\
    \ is strictly before x.store(2). x.store(2) strictly occurs before x.load(). It\
    \ is worth mentioning that linear consistency requirements for global clocks are\
    \ difficult to achieve, which is why people continue to study other consistent\
    \ algorithms under this weaker consistency.\n\n+   2. Sequential consistency:\
    \ It is also required that any read operation can read the last data written by\
    \ the data, but it is not required to be consistent with the order of the global\
    \ clock.\n\n```\nx.store(1)   x.store(3)   x.load()\nT1          -------+----------+------->\n\
    T2--------------------------->\n            x.store(2)\n```\n\nor"
