    \ 0;\n}\n```\n\n其中 `std::max_align_t` 对每个标量类型都需要完全相同的对齐，因此它在最大标量上没有区别。反之，大多数平台上的结果是\
    \ `long double`，因此我们得到的 `AlignasStorage` 的对齐要求是 8 或 16。\n\n## 总结\n\n本节引入的几个特征都是在现代\
    \ C++ 特性中更频繁使用但尚未引入的功能。`noexcept` 是最重要的特性。它的特性之一是防止异常的扩散，有效地让编译器最大限度地优化我们的代码。\n\
    \n## 第 10 章展望：C++20 简介\n\nC++20 似乎是一个令人兴奋的更新。例如，早在 C++11 时代，那个迫切呼唤但最终失落的 Concept（概念）现在已指日可待。C++20\
    \ 引入了许多特性，如 Concepts/Modules/Ranges。\n\n### Concept (概念)\n\nConcept 是 C++ 的进一步增强。简单来说，Concept\
    \ 是一种编译时特性。它允许编译器在编译时评估模板参数，极大地提升了我们的体验。例如，以下代码会导致编译错误，因为 `std::list` 不支持随机访问：\n\
