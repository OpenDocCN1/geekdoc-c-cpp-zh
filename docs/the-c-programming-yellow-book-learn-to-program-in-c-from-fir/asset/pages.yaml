  md: "# Creating Programs\n\n# Methods\n\n```\nstatic double readValue(\n    double\
    \ low,    // lowest allowed value\n    double high,   // highest allowed value\n\
    \    string prompt = \"\" // optional prompt for the user\n    string error =\
    \ \"\" // optional error message\n)\n{\n    \n```\n\nThis has two optional parameters,\
    \ a prompt and an error message. The idea is that the user of the method can give\
    \ a custom error message if the user gives an invalid age. You can now call the\
    \ method like this:\n\nx = readValue(25, 100, \"Enter your age\", \"Age out of\
    \ range\");\n\nIf I don't want a prompt or a custom error message I can leave\
    \ them out. But if I just supply one argument it is mapped onto first in the sequence\
    \ of optional parameters. In other words, I can't supply a custom error message\
    \ without providing a custom prompt.\n\nThe way to get around this (as I'm sure\
    \ you have figured out) is to identify the optional parameters you want to use\
    \ by their name.\n\nx = readValue(25, 100, error:\"Age out of range\");\n\nThis\
    \ call of readValue would use the default prompt, but would have a custom error\
    \ message.\n\n# Programmer's Point: I'm not so on default values for parameters\n\
