  md: '# 4.3 Structures


    Structures let us organise a set of individual values into a cohesive lump which
    we can map onto one of the items in the problem we are working on. This is important
    in many applications.


    # 4.3.1 What is a Structure?


    Often when you are dealing with information you will want to hold a collection
    of different things about a particular item. The Friendly Bank has commissioned
    an account storage system and you can use structures to make this easier. Like
    any programmer who has been on my course you would start by doing the following:


    +   - Establish precisely the specification, i.e. get in written form exactly
    what they expect your system to do.

    - Negotiate an extortionate fee.

    - Consider how you will go about storing the data.


    # A sample structure


    From your specification you know that the program must hold the following:


    +   - customer name - string

    - customer address - string

    - account number - integer value

    - account balance - integer value

    - overdraft limit - integer value


    The Friendly Bank have told you that they will be putting up to 50 people into
    your bank storage, after a while you come up with the following:


    ```

    const int MAX_COST = 50;

    AccountState[] states = new AccountState[MAX_COST];

    string[] names = new string[MAX_COST];

    string[] addresses = new string[MAX_COST];

