  md: '# Computers and Programs


    # Describing the Solution


    The actual instructions which describe your solution to the problem must also
    be part of your program. A single, simple, instruction to do something in a C#
    program is called a *statement*. A statement is an instruction to perform one
    particular operation, for example add two numbers together and store the result.


    The really tricky thing about programming are statements which can change when
    statement is performed next, so that your program can look at things and decide
    what to do. In case of C# you can lump statements together to form a lump of program
    which does is called a *method*.


    A method can be very small, or large. It can return a value which may or not be
    of interest. You can name it any like, and your program can contain as many methods
    as you fit. Method may refer to others. The C# language has a huge number of libraries
    available which you can use. These save you from ''reinventing the wheel'' each
    time you write a program. You will look at methods in detail later in this.


    Seamosed programmers break down into a number of smaller ones and make a method
    for each.


    # Identifiers and Keywords


    You give a name to each that you create, and you try to make the name of the function
    what it does, for example *ShowSaveToFile*. The C# language actually runs your
    program by looking for a method with a special name, *Main*. This is called when
    program starts running, and *Main* finishes, your program ends. The names that
    you invent to identify are values; wordLength might be a good choice when we want
    to hold the length of word used. Later on we will look at the rules and conventions
    which must use when you create identifiers.


    The words of the C# language itself are called keywords. In a recipe a keyword
    would be something like “mix” or “bake”. You would say things like “heat sugar
    until molten” or “mix until smooth”. In fact, you’ll find programs look a lot
    like recipes: Keywords will appear blue in some of the listings in this.


    # Objects


    Some of the things that we create are objects that are part of the framework we
    use. Continuing our cooking analogy, these are things like mixing bowls and ovens,
    and the names of objects will be in a different shade of blue in some of the listings
    in this.


    # Text in a Computer Program


    There are two kinds of text in your program. There are the instructions that you
    want the computer to perform and there are the messages that you want the program
    to display in front of the user. Your mum might add the following instruction
    to her cake recipe:


    > Now write the words “Happy Christmas” on top of the cake in icing.


    She is using double quotes to mark the text that is to be drawn on the cake, and
    “Happy Christmas” is not part of the instructions; C# works exactly the same way.
    This is what needs to be written. These kinds of messages are coloured red in
    this text.


    # Colours and Conventions


    The colours that I use in this text are intended to line up the colours you see
    when you edit your program using a professional program editor such as the one
    supplied as part of Visual Studio. The colours just serve to make the programs
    easier to understand, and do not have any special meaning. They are automatically
    by the editor you write your program.


    C# Programming Rob Miles 2016


