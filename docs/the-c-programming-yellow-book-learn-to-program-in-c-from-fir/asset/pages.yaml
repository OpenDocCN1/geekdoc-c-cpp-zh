  md: "# Creating Solutions\n\n# Inheritance\n\nFrom the point of view of interface\
    \ design this means the account number will be set when the account is created\
    \ and the account class will provide a method to let us get the value (but there\
    \ will not be a method to set the account number).\n\nWe don't care what the GetAccountNumber\
    \ actually does, as long as it always returns the value for a particular account.\
    \ So this requirement ends being expressed in the interface that is implemented\
    \ by the account.\n\n```\ninterface IAccount {\n  int GetAccountNumber();\n}\n\
    ```\n\nThis method returns the integer which is the account number for this instance.\
    \ By placing it in the interface we can say the account must deliver its value,\
    \ but we have not described how this should be done. The design of the interfaces\
    \ in a system is just this. They state what we have for behaviours, but do not\
    \ necessarily state how they are made to. I have to add comments to get more detail\
    \ about what the method does.\n\nThe need for things like accounts, which really\
    \ need to be unique in the world, has resulted in the creation of a set of methods\
    \ in the C# library to create things Globally Unique Identifiers or GUIDs. These\
    \ are data items created based on the date, time and certain information about\
    \ the host computer. Each GUID is unique in the world. We could use these in our\
    \ Account constructor to create a GUID which allows each account to have a unique\
    \ number.\n\n# 4.9 Inheritance\n\nInheritance is another way we can implement\
    \ creativity. It is a way that we can pick up behaviours from classes and just\
    \ modify the bits we want to make new ones. In this respect we can regard it as\
    \ a mechanism for what is called code reuse. It can also be used at the design\
    \ stage of a program if you have a set of related objects you wish to create.\n\
    \nInheritance lets a class pick up behaviours from the class that is its parent.\
    \ You can regard an interface as a statement by a class that has a set of behaviours\
    \ it implements an interface. If a class is descended from a particular parent\
    \ class means that it has a set of behaviours it has inherited from its parent.\
    \ In the short:\n\n> Interface: \"I can do these things have told you I can\"\n\
    Inheritance: \"I can do these things because my parent can\"\n\n# 4.9.1 Extending\
    \ a parent class\n\nWe can see an example of use for inheritance in our bank account\
    \ project. We have already noted that a BabyAccount must behave just like a CustomerAccount\
    \ except in respect of the cash withdrawal. Customer accounts can draw out much\
    \ as they want. Baby accounts are only allowed to draw up 10 pounds at a time.\n\
    \nWe have solved this problem from a design point of view using interfaces. By\
    \ separating the thing that does the job from the description of the job (which\
    \ is what an interface lets you do) and then plug in IAccount with different behaviours\
    \ as required. We can create new accounts at any time after the system has been\
    \ deployed. These can be introduced and work alongside the others because they\
    \ behave correctly (i.e. they implement the interface).\n\nBut this makes things\
    \ a bit tiresome when we write the program. We need to create a BabyAccount class\
    \ which contains a lot of code which is duplicated in the CustomerAccount class.\
    \ \"This is not a problem\" you probably think I can use the editor block copy\
    \ to move the program text across.. But:\n\nC# Programming Rob Miles 2016\n\n\
    116"
