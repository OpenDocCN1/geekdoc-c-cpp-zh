    \ the data.\n\n# 4.13.4 Using the C# Hashtable collection\n\nFortunately for the\
    \ designers of the C# have created a hash table for use. This will store items\
    \ for us based on a particular object which is called the key. It turns out to\
    \ be very easy to create a bank storage mechanism based on this:\n\n```\nclass\
    \ HashBank : IBank {\n    Hashtable bankHashtable = new Hashtable();\n\n    public\
    \ IAccount FindAccount(string name)\n{\n        return bankHashtable[name] as\
    \ IAccount;\n    }\n\n    public bool StoreAccount(IAccount account)\n{\n    \
    \    bankHashtable.Add(account.GetName(), account);\n        return true;\n  \
    \  }\n}\n```\n\nCode 47 A hash table bank\n\nThe Hashtable class can be found\
    \ in the System.Collections namespace. It provides a method Add which gives the\
    \ value of the key and a reference to the item to be stored directly by hash code.\
    \ It also allows you to use a reference to the key (or by name) to locate an item:\n\
    \n```\nreturn bankHashtable[name] as IAccount;\n```\n\nWe have to use the \"as\"\
    \ part of this code as the collection will return a reference to an Object. We\
    \ have to return a reference to an item that implements the IAccount interface.\
    \ The as is a form of casting (where we force the compiler to read an item as\
    \ being part of particular). It is used in reference to the code:\n\n```\nreturn\
    \ bankHashtable[name];\n```\n\nThe as operator as if bankHashtable[name] does\
    \ not return an account, or returns something of the wrong type, the as operator\
    \ will generate a null reference. This is just what the caller of our FindAccount\
    \ method is expecting this can be returned back directly. If it is not (i.e. at\
