    # A Graphical User Interface


    ![](img/d50be9be3b33c7dfe37bae51200a38c3_193_0.png)


    Above you can see part of the hierarchy that the XAML designers built. The top
    class is FrameworkElement. It contains all the information that is common to all
    controls on the screen. Each of the other classes is a child of this class. Children
    pick up all the behaviours and properties of their parent class and add some of
    their own. The design is bit more complex than shown above, the FrameworkElement
    class is a child of a class called UIElement, but it shows the principles before
    the controls.


    Creating a hierarchy like this has a lot of advantages. If we need a custom of
    textbox we can extend the TextBox class and add the properties and behaviours
    that we need. As far as software implementing the XAML system is concerned it
    means we treat all the controls the same and then ask each control to draw itself
    in a manner appropriate to component.


    Our program will manipulate the elements if they were C# objects, although they
    were actually defined in a XAML source file. This works because the program is
    built with the XAML system will create objects that match elements in the source
    file.


    # Managing Name Elements


    When we want to use the interface elements in our program we need a way of referring
    to them. If we take a look at the XAML that our implementing machine we can see
    that some of the components have been given a name property:


    ```

    <TextBox Name="firstTextBox" Width="100" Margin="0,18" TextAlignment="Center"
    />

    ```


    I have set the name of this textbox to firstTextBox. You''ll never guess what
    the text box is called. Note that the name of a property in this context is actually
    setting the name of the variable declared inside the program. In other words,
    as a result of what I''ve done there will now be the following statement in my
    program somewhere:


    ```

    TextBox firstTextBox;

    ```


    These declarations are created automatically when the program is built and so
    we don''t need to worry about where the above statement is. We just have to remember
    that this is how the program works. Note that not all the elements in my user
    interface have got names, there is no point in giving a name to the TextBox that
    holds the "" character as I will never need to interact with this when the program
