  md: "# Creating Solutions\n\n# The Construction of Objects\n\n\"But wait a minute\"\
    , you say, \"We’ve making objects for a while and I’ve never had to provide a\
    \ constructor method\". This is because the C# compiler is, for a change, being\
    \ friendly here. Rather than shout at you for not providing a constructor method,\
    \ the compiler instead creates a default one for you to use.\n\nYou might think\
    \ this is strange, in normally the compiler loses no time in telling you off you\
    \ don’t do something, but in this case it is simply solving the problem without\
    \ telling you. There are two ways to look at this:\n\n+   **nice compiler**: the\
    \ compiler is trying to make life easier for you\n\n+   **evil compiler**: the\
    \ compiler knows that if it does automatically now you will suffer more later\
    \ when you try to understand why you don’t need to add one\n\nHow you regard the\
    \ action of the constructor is up to you.\n\n# # 4.7.1 The Default Constructor\n\
    \nA constructor has the same name as the class, but it does not return anything.\
    \ It is called when we perform `new`. If you don’t supply a constructor (and we\
    \ haven’t so far) the compiler creates one for us.\n\n```\npublic class Account\n\
    {\n    public Account ()\n    {\n}\n\n```\n\nThis is what the default constructor\
    \ looks like. It is public so that it can be accessed from external classes who\
    \ might want to make instances of the class. It accepts no parameters. If I create\
    \ my own constructor the compiler assumes I know what I’m doing and stops providing\
    \ the default. This can cause problems, which we will discuss later.\n\n# # 4.7.2\
    \ Our Own Constructor\n\nFor fun, we could make a constructor which prints out\
    \ that it has been called:\n\n```\npublic class Account\n{\n    public Account\
    \ ()\n    {\n        Console.WriteLine (\"We just made an account\");\n    }\n\
    \n```\n\nThis constructor is not very creative (ho) but it lets us know when it\
    \ has been called. This means that when my program executes the line:\n\n```\n\
    robsAccount = new Account();\n```\n\n- the program will print out the message:\n\
    \nwe just made an account\n\nNote that this is not very useful, in इतना that it\
    \ will result in a lot of printing out which the user of the program might not\
    \ appreciate, but it shows how the process works.\n\n# # Feeding the Constructor\
    \ Information\n\nIt is useful to be able to get control when an Account is created,\
    \ but it would be even nicer to be able to feed information into the Account when\
    \ I create it. As example, I want to see the name, address, and initial balance\
    \ of an account holder when the account is created. In other words I want to do:\n\
    \n```\nrobsAccount = new Account (\"Rob Miles\", \"Hull\", 0 );\n```"
