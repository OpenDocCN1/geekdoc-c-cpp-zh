    will range from an operator in a call centre, an operator on a dial terminal,
    a customer on a mobile phone and a customer at a cash machine. I hope you can
    see that the only way to manage all these different ways of interacting with the
    bank account is to separate the business object (the account itself) from input/output
    behaviour.


    Note that we never do this like the user interface code to decide what constitutes
