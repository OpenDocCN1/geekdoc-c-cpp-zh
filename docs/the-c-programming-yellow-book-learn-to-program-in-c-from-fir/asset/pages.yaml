  md: "# Advanced Programming\n\n# Storing Business Objects\n\nThis method is supplied\
    \ with a text stream. It reads the name and the balance from this stream and creates\
    \ a new CustomerAccount based on this data.\n\n# Programmer's Point: Streams are\
    \ wonderful\n\nUsing streams is a very good idea. The Cf input/output system lets\
    \ us connect streams to all manner of things, not just files on a disk. For example,\
    \ you can create a stream which is connected to a network port. This means that\
    \ if you make your business objects save and load themselves using streams they\
    \ can be sent over network with no extra work from you.\n\n# Saving and loading\
    \ bank accounts\n\nNow that we have a way of saving multiple accounts to a single\
    \ stream we can write a save method for the bank. This will open a stream and\
    \ save all the accounts to it:\n\n```\npublic void Save(System.IO.TextWriter textOut)\n\
    \    textOut.WriteLine(bankhashtable.Count);\n    foreach (Customer account in\
    \ bankHashtable.Values)\n{\n        account.Save(textOut);\n    }\n```\n\nThis\
    \ is the Save method which would be for a Hashtable based bank. It gets each account\
    \ out of the hash and saves it in the given stream. Note that we are using a new\
    \ C# loop construction here, foreach. This is very useful when dealing with collections\
    \ of data. It works through a collection, in this case the Values property of\
    \ the bankHashtable, and supplies each item in.\n\nNote that before it writes\
    \ out the number of accounts in the bank. This can be obtained by the Count property\
    \ of the Hashtable. We do this so when the bank is read back the load method knows\
    \ how many accounts are required. We could just write out the data and the load\
    \ method stop when it reaches the end of the file, but this would not allow us\
    \ to check if the file had been corrupted.\n\n```\npublic static HashBank load(System.IO.Reader\
    \ textIn)\n{\n    HashBank result = new HashBank();\n    string countString =\
    \ text.ReadLine();\n    int count = int.Parse(countString);\n    for (int i =\
    \ 0; i < count; i++)\n{\n        CustomerAccount account = CustomerAccount(textFile);\n\
    \        result.bankhashtable.Add(account.GetName(), account);\n    }\n    return\
    \ result;\n```\n\nThis reads the size of the bank and reads each of the accounts\
    \ in turn and adds it to the hash table. Note that this load method does not handle\
    \ errors. A production version of the program would check that each account was\
    \ loaded correctly before adding it to the hash table.\n\nC# Programming © Rob\
    \ Miles 2016\n\n154"
