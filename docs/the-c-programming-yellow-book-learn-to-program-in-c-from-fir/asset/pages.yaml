    # C#


    Programming languages get around both of these problems. They are simple enough
    to be made sense of computer programs and they reduce ambiguity.


    # Programmer''s Point: The language is not that important


    There are a great many programming languages around, during your career you will
    have to learn more than just one. C# is a great language to start programming
    in, but do not think that it is the only language you will ever learn.


    # 1.4 C#


    There are literally hundreds of programming languages around: C (pronounced C#).
    If you make the mistake of calling language C you will show your ignorance away!
    C# is a very flexible and powerful programming language with an interesting history.
    It was developed by Microsoft Corporation for a variety of reasons, technical,
    political and others marketing.


    C# bears a strong resemblance to the C++ and Java programming languages, having
    borrowed (or improved) features provided by these languages. The origins of Java
    and C++ can be traced back to a language called C, which is highly dangerous and
    enticing language which was invented in the early 1970s. C is famous for the language
    the UNIXX operating system was written in, and was designed for this.


    # 1.4.1 Dangerous C


    I referred to C as a dangerous language. If I make a mistake by that? Consider
    the saw. If I, Rob Miles, want to use a chainsaw as I am not an experienced saw
    user I would expect it to have lots of built in safety features such as guards
    and anticlock devices with the thing will probably limit the uses of the tool,
    i.e because of all the safety stuff I might not be able to cut down certain kinds
    of tree. If I were a real lumberjack would go out and buy a professional chainsaw
    which has no safety features whatever can be used to cut down most anything. If
    I make a mistake with the professional tool I could easily lose my leg; the amateur
    machine would not happen.


    In programming terms what this means is that C lacks some features provided by
    other programming languages. This makes the language much more flexible.


    However, if I did something C will not stop me, I will have a much greater chance
    of crashing the computer with a C program than I do with a safer language.


    # Programmer''s Point: Computers are always stupid


    I reckon that you should always around the basis that any computer will tolerate
    no errors on your part and anything that you do is stupid will always cause a
    disaster! This makes things wonderfully.


    # 1.4.2 Safe C#


    The C# language attempts to get the best of both worlds in this respect. A C program
    can contain managed or unmanaged parts. The managed code is fused over by the
    system which runs it. This makes sure that it is hard (but probably not impossible)
    to crash your computer running managed code. However, all this fusing comes at
    a price, causing your programs to run more slowly.


    To get the maximum possible performance, and enable direct access to parts of
    the underlying computer system, you can mark your programs as unmanaged. An unmanaged
    program goes faster, but if it crashes it is capable of taking the computer'
