    \ to implement the change I had to go through all the accounts and update the\
    \ rate. This would be tedious, and if I missed one account, possibly expensive.\n\
    \nI solve the problem by making the interest rate static:\n\n```\npublic class\
    \ Account {\n    public decimal Balance;\n    public static decimal InterestRateCharged\
    \ ;\n}\n```\n\nThe interest rate is now part of the class, not part of any instance.\
    \ This means I have to change the rate when I get hold of it:\n\n```\nRobbsAccount\
    \ = new Account();\nRobbsAccount.Balance = 100;\nRobbsAccount.InterestRateCharged\
    \ = 10;\n```\n\nSince it is a member of the class I now have to use the class\
    \ name to get hold of it instead of the instance name reference.\n\n# Programmer's\
    \ Point: Static Data Members are Useful and Dangerous\n\nWhen you are collecting\
    \ metadata about your project you should look for things that can be static. This\
    \ makes the limits of (the largest age you are going to permit a person to have)\
    \ can be static. There might be a time when the age changes, and you don't have\
    \ to update all the objects in your project.\n\nBut of course, as Spiderman once\
    \ said, \"With power come great responsibility.\" You should be careful about\
    \ how you provide access to static data items. A change to a single static value\
    \ will affect your entire system. So they should always be private and updated\
    \ by means of method calls.\n\n# 4.6.3 Using a static method in a class\n\nWe\
    \ can make methods static too. We have been doing this for ages with the Main\
    \ method. You can also use them when designing your system. For example, we might\
    \ have a method that decides whether or not someone is allowed to have a bank\
    \ account. It would take into account age and income, depending on whether these\
