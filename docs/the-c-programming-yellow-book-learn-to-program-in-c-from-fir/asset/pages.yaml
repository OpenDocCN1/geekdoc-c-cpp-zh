  md: "# 5.5.3 Throwing an Exception\n\nThe throw keyword throws an exception at that\
    \ point in the code. The thing that thrown must be based on the System.Exception\
    \ class. For example, I want to throw an exception if the name of my account holder\
    \ is an empty string. I can do this with the code:\n\n```\nif ( inName.Length\
    \ == 0 ) {\n    throw new Exception(\"Invalid Name\");\n}\n```\n\nThe throw code\
    \ is followed by a reference to the exception to be thrown. Then that, this point\
    \ the exception would transfer to the \"nearest\" catch construction. This might\
    \ be a catch of mine, or it might be supplied by the system. If the exception\
    \ is caught by the system it means that program will be terminated. However, I\
    \ can catch the exception as follows:\n\n```\ntry {\n    a = new Account(newName,\
    \ newAddress);\n} catch (BankException exception) {\n    Console.WriteLine(\"\
    Error : \" + exception.Message);\n}\n```\n\nThe code tries to create new account.\
    \ If this causes an exception to be thrown, the code in the exception handler\
    \ is observed. The reference exception is set to refer to the exception which\
    \ has been thrown. The Message member of an exception is the text exception which\
    \ was given. This means that if I try to create an account with an empty name\
    \ the exception will be thrown, the catch invoked, and the message printed.\n\n\
    # Programmer's Point: Design your error exceptions yourself\n\nAn exception is\
    \ an object which describes how things have gone wrong. It can contain a text\
    \ message which you can display to the user to. However, you should seriously\
    \ consider extending the exception class to make exceptions of your own even more\
    \ informative. Errors should be numbered, i.e. your exceptions should be tagged\
    \ with an error number. This helps a great deal in working with different languages.\
    \ The customer can say \"Error number 25\" when they are reporting a problem it\
    \ makes much easier for the support person to respond sensibly. Note that, with\
    \ just about everything else, you need to design in your handling of errors.\n\
    \n# 5.5.4 Multiple Exception Types\n\nIt is worth spending thinking about how\
    \ the exceptions and errors in your system are to be managed. We can have many\
    \ catch constructions if we like, and the catch will be matched up to the type\
    \ of exception that was thrown:"
