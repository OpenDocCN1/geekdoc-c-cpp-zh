    # Writing a Program


    You can see examples of this construction in the loop definition in the example
    above.


    The other shorthand which we use when we add a particular value to a variable.
    We could put:


    ```

    house_cost = house_cost + window_cost;

    ```


    This is perfectly OK, but again is rather long winded. C# has some additional
    operators which allow us to shorten this to:


    ```

    house_cost += window_cost;

    ```


    The += operator combines addition and the assignment, so that the value in house_cost
    is increased by window_cost. Some other shorthand operators are:


    | a += b | the value in a is replaced by a + b |

    | a -= b | the value in a is replaced by a - b |

    | a /= b | the value in a is replaced by a / b |

    | a *= b | the value in a is replaced by a * b |


    There are other combination operators; I will leave you to find them!


    # Statements and Values


    One of the few things about C# is that all statements return a value, which you
    can use in another statement if you like. Most of the time it will be very useful,
    when we get to around deciding things (see later). In order to show how this is
    done, consider the following:


    ```

    i = j;

    ```


    This is perfectly legal (and even sensible!). C# has the effect of setting both
    i and j to 0. Assignment always returns the value which is being assigned (i.e.
    the bit on the right of the gozina). This value can then be used as a value or
    operand. If you are advised to put brackets around the statement which is being
    used as a value, this makes the whole thing much clearer for you and the compiler:


    When you consider operators like ++ there is possible ambiguity, that you do not
    know if the value before or after the increment. C# provides a way of getting
    either value, depending on what effect you want. You determine whether to see
    the value before or after the sum by the position of the ++ +


    ```

    i++ Means "give me the value before the increment"\++i Means "give me the value
    after the increment"

    ```


    As an example:


    ```

    int i = 2, j;

    j = ++i;

    ```


    - would make j equal to 3. The other special operators, += all return the value
    after the operator has performed.


    # Programmer''s Point: Always strive for simplicity


    Don''t get carried away with this. The fact that you can produce code:


    ```

    height = width = speed = count = size = 0;

    ```


    - does not mean what you think. Nowadays I am writing a program first consideration
    is whether or not the program is easy to understand. I don''t think that the statement
    above is very easy to read – so irrespective of how much efficient it is, I will
    not do it.


