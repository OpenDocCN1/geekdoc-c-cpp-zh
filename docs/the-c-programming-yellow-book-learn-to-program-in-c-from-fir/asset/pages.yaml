  md: '# Computers and Programs


    # Programs and Programming


    customer sign it, and the bottom line is that you provide a system which behaves
    according to the design specification the customer must pay you. Once you have
    your design specification, then you can think about ways of solving the problem.
    You might think that this is not necessary if you are writing a program for yourself;
    there is no customer to satisfy. This is not true. Writing some of specification
    forces you to think about your program at a detailed level. It also forces you
    to think about what your system is not going to do and set the expectations of
    the customer right at the start.


    # Programmer''s Point: The specification must be although there


    I have written many programs for money. I would never write a program without
    getting a solid specification first. This is true even (or perhaps especially)
    if I do a job for a friend.


    Modern development techniques the customer right at the heart of the development
    and involve them in the design process. These work on the basics that it is very
    hard (and actually not useful) to get a definitive specification at the start
    of a project. As a developer you don''t really know much about the customer''s
    business and they don''t know the limitations and possibilities of the technology.
    With this in mind it is a good idea to make a series of versions of the solution
    and discuss each with the customer before moving on to the next. This is called
    prototyping.


    # 1.2.2 A Simple Problem


    Consider the scenario; you are in your favourite chair in the pub templating the
    universe when you are interrupted in your reverie by a friend of yours who sells
    double glazing for a living. He knows you like your help in solving a problem
    which he has


    He has started making his window units and is looking for a program which will
    do the costing of the materials for him. He wants to just enter the dimensions
    of the window and then get a printout of the cost to make the window, in terms
    of the amount of wood and glass required.


    "This looks like a nice earner" you think, and once you have agreed to a price
    you start work. The first thing you need to do is find out exactly what the customer
    wants you do...


    # Specifying the Problem


    When considering to write the specification of a system there are three important
    things:


    +   * What information flows into the system.

    * What flows out of the system.

    * What the system does with the information.


    There are lots of ways of representing this information in the form of diagrams,
    for now we will stick with written text when specifying each of the stages:


    # Information going in


    In the case of our immortal double-glazing problem we can describe the information
    as:


    +   * The width of the window.

    * The height of the window.


    # Information coming out


    The information that our customers want to see:


    +   * The area of glass required

    * The length of wood required to build a frame.'
