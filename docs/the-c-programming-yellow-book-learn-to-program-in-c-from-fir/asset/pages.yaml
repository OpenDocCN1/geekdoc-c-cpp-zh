  md: "# Advanced Programming\n\n# Storing Business Objects\n\n# Using streams\n\n\
    A better solution is to give the save method a stream to save itself, rather than\
    \ a filename. A stream is the thing that the C# creates when we open a connection\
    \ to a file:\n\n```\nSystem.IO.TextWriter textOut =\nnew System.IO.StreamWriter(\"\
    Test.txt\");\n```\n\nThe reference textOut refers to a stream which is connected\
    \ to the file Test.txt. We can create a save method which accepts the stream reference\
    \ as a parameter instead of:\n\n```\npublic void Save(System.IO.TextWriter textOut)\n\
    {\n    textOut.WriteLine(name);\n    textOut.WriteLine(balance)\n}\n```\n\nThis\
    \ method can be called from our original file method:\n\n```\npublic bool Save\
    \ (string filename)\n{\n    System.IO.TextWriter textOut = null;\n    try {\n\
    \        textOut = new System.IO.StreamWriter(filename);\n        Save(textOut);\n\
    \    } catch {\n        return false;\n    } finally {\n        if (textOut !=\
    \ null)\n            textOut.Close();\n        }\n    }\n    return true;\n}\n\
    ```\n\nThis method creates a stream and then passes it to the same method to save\
    \ the item. Note that this is an example of overloading in that we have two methods\
    \ which share the same name.\n\nThe load for our bank account can be replaced\
    \ by which works in a similar way.\n\n```\npublic static CustomerAccount Load(System.IO.TextReader\
    \ textIn)\n{\n    CustomerAccount result = null;\n    try {\n        string name\
    \ = textIn.ReadLine();\n        string balanceText = textIn.ReadLine();\n    \
    \    decimal balance = decimal.Parse(balanceText);\n        result = new CustomerAccount(name,\
    \ balance);\n    } catch {\n        return null;\n    }\n    return result;\n\
    }\n```"
