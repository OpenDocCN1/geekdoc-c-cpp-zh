    # Character Escape Sequences


    This leads to the question "How do we express the (single quote) character". This
    is achieved by the use of an escape sequence. This is a sequence of characters
    which starts with a special character escape. Escape in this context means "escape
    from the normal hum-denum conventions of meaning what you are and let''s do something
    special". The escape sequence is \(backslash) character. Possible escape sequences
    are:


    | Character | Escape Sequence name |

    |---|---|

