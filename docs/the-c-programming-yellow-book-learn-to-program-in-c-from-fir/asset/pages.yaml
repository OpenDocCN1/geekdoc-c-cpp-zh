    # 3.4.6 Throwing an Exception


    Now that we know how to catch exceptions, the next thing we need to consider is
    how to throw them. This turns out to be very easy:


    ```

    throw new Exception("Boom");

    ```


    The statement above makes a exception and then throws it. When you make a new
    exception you can give it a string that contains the exception will deliver. In
    this case I have used somewhat unhelpful message "Boom". Throwing an exception
    might cause your program to end if the code does not run a **try** construction.


    # 3.4.7 Exception Etiquette


    Exceptions are best reserved for situations when your program reality cannot go
    any further. If you are going to throw an exception this should be in a situation
    where program reality could not do anything else. For example if a user of the
    double gallery program enters a window height that is too large the program can
    print the message "Height too large" and ask for another value. This means that
    errors at this level are not worthy of exception. I reserve my exceptions for
    catastrophic events that my program reality cannot deal with and must pass on
    to them, and you should too.


    # Programmer''s Point: Plan your Exception Handling


    When you design a program you should consider what events count as "showoppers"
    and how you are going to deal with them. You can create your own custom exception
    types based on the one provided by the System and use these in your error handling.


