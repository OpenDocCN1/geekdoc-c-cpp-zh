    , \"March\", \"April\",\n    \"May\", \"June\", \"July\", \"August\",\n    \"\
    September\", \"October\", \"November\", \"December\"\n};\n```\n\nA program can\
    \ contain a list of initialisation values we use to create an array with the required\
    \ content. Note that the initialisation we will then used to create"
