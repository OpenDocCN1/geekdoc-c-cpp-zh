  md: '# 5 Advanced Programming


    # 5.1 Generics and Collections


    Generics are very useful. This statement probably doesn''t tell you what they
    do, but it does indicate that they are very useful. They sound a bit scary; telling
    people you learned about "generics" probably conjures images of people with white
    coats and test tubes, at least those who cannot spell very well. I digress; the
    root of Generics is probably "general", in the idea that there is a way that you
    specify a general purpose operation and apply it in different contexts in a appropriate
    way to each of them. This sounds a bit like abstraction and indicates you are
    sort on the right track. If it doesn''t, then it might be worth re-reading those
    bits of the book until they make sense.


    Perhaps the best way to talk about generics is to see how they can help us solve
    a problem for the bank. We have seen that when we count Account references in
    an Array we are how many elements it contains. This leads to a "straw that breaks
    the camel''s back" problem, where adding the 10,001 customer to the bank is not
    actually a cause for celebration, because the array size was set at 0 and our
    program crashes.


    One way to solve this problem is to use a really big array, but we aren''t keen
    that it means that for smaller banks we probably be wasting a lot of time. Frequently
    the CF library provides a number of solutions, starting with the simple ArrayList.


    # 5.1.1 The ArrayList class


    The ArrayList is a cousin of the HashTable we have just seen, in that it lives
    in the System.Collections namespace. It lets us create something very useful,
    an array that can grow in size. We can always add new elements to the ArrayList,
    and some clever code in the library makes sure that works.


    # Creating an ArrayList


    It is very easy to create an ArrayList:


    ```

    ArrayList store = new ArrayList();

    ```


    Note that you don''t have to set the size of the ArrayList, although there are
    overloaded constructors that let you give this information and help the library
    code along a bit:


    ```

    ArrayList storeFifty = new ArrayList(50);

    ```


    The ArrayList called storeFifty is initially able to store 50 references, but
    it can hold more or less as needed.


    # Adding Items to an ArrayList


    Adding items to an ArrayList is also very easy. The class provides an add method:


    ```

    Account robsAccount = new Account ()

    store.Add(robsAccount);

    ```


    It is important to remember what is going on here. We are not putting an Account
    into our array; we are just making one element of the array to that account. In
    this respect the word Add can be a bit misleading, but what it actually does is
    a reference, not the thing itself.


    Remember that it would be perfectly possible to have robsAccount in multiple arraylists,
    just like your name can appear on multiple lists in the real world. It might be'
