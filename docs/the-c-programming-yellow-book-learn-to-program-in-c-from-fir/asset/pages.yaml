    If you can carefully map each of the elements in the list above into the XAML
    file. The only thing that is a bit confusing is the <StackPanel> element. It is
    very simple and really useful. Rather than having to define the position on the
    screen of each element, a <StackPanel> just lets you "pick" a series of layout
    elements. The default arrangement is to stack the items on the screen, but you
    can also stack items across the screen. And this is really useful, a <StackPanel>
    inside another <StackPanel>, you can make a stack of rows. This nesting of elements
    is recurring them inside XAML files.


    # Programmer''s Point: Use automatic layout as you can when you do this you are
    making


    I always when I start absolutely positioning them on the screen. As soon as you
    make assumptions about the size of the screen or the dimensions of text. Modern
    computers are supported in a huge range of different screen sizes and users can
    also change the size of the text on the screen to zoom into the display. They
    may also change the orientation of their screen from landscape to portrait while
    they prefer it. To fix the position of elements means that it will work well for
    one particular device, but will look very wrong on another. This makes your program
    much less likely to display problems.


    # XAML Elements and Objects


    From a programming point of view each of the XAML elements on the screen of the
    display is a software object. Objects are a great way to represent things that
    we want to work with. It turns out objects are great for representing other things,
    such as items on a display. If you think about it, a box text on the screen-a
    TextBox will have properties such as the position on the screen, the colour of
    the text, the text itself and so so on.


    You are (or should be) familiar with the process of compilation, where the source
    code (i.e. what we type in) for a C# program is converted into a lower level of
    instructions that will be executed by the computer. When a program that uses the
    XAML user interface is compiled the system also "compiles" the XAML description
    to create a set of C# objects, each of which represents a user interface element.
    There are three types of element in the adding machine:


    +   1. TextBox–allows the user to enter text into the program.

    2. TextBlock–a block of text that conveys information.

    3. Button–something we can press to cause events in our program.


    If you think about it, you can break the properties of these elements into two
    kinds, that all the elements need to have, for example position on the screen,
    and those that are specific to that type of element. For example only a <TextBox
    will record the position of the cursor where text is being entered. With a software
    design point of view this is a really good use for a class hierarchy.


    C# Programming Rob Miles 2016


