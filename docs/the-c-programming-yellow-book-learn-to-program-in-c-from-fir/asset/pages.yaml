  md: '# Advanced Programming


    # Threads and Threading


    up completely, when a specific set of timing events occurs. Synchronisation problems
    like the “Deadly Embrace” described above may only when two users request a particular
    feature at the same time.


    When you have problems with a multi-threaded system the biggest difficulty is
    making the fault occur so you can fix it. The only way to investigate the problem
    is to add lots of write statements so that the program makes a log you can examine
    after it has failed. Of course, spend time writing the log output affects the
    timing of events in the program and can often cause a fault to move, or if you
    are very lucky, vanish completely.


    You should protect any variables shared between threads by the Monitor class as
    described above. This will stop inadvertent data corruption. If variables get
    “out of step” then this is a sign that you have threads fighting over data items.


    You should try to avoid any “Deadly Embrace” by making your threads producers
    or consumers of data. If consumers are always waiting for producers (and never
    wait for you) then you can be sure that the situation where one thread waits for
    that is waiting for.


    Finally you should design in the logging and debugging behaviour (you can use
    always conditional condition to turn the logging off later) so that if you have
    a problem it is easy to get some diagnostic information which you want your program
    at the time it went wrong.


    # Programmer’s Point: Put Threads into your Design


    I think what I am really saying is that any thread use should be designed into
    your program, and not tacked on afterwards. If you want to use the threads that
    they are managed and how they should communicate be decided right at the start
    of your program and your whole system should be constructed with them in mind.


    # 5.4.8 Threads and Processes


    You can regard different threads as all living in the computer together in the
    same way a train of numbers can share a particular railway. The next step is to
    have more than one railway. In programming terms this is a move from threads to
    processes. Processes are different from threads, in that each process has its
    own memory space which is isolated from other processes.


    When you are using a word processor and a web browser at the same time on your
    computer each of them is running on your computer as different process. Your process
    may fire off several threads that run within it (which allows one to perform checking,
    but nothing in the word processor program can ever access the variables in the
    other.


    In a C# you can create a process and start it in a similar way to starting a thread.
    You can also use the Class to start programs for you. This is held in the System.Diagnostics
    namespace, so you can add a Using statement to make it easier to get hold of the
    class:


    ```

    using System.Diagnostics;

    ```


    To start a program on your system you can use the Start method with the Process
    class:


    ```

    Process.Start("Notepad.exe");

    ```


    The Start method is supplied with the name of the program that you want to start.
    The above line of C# would start the Notepad program.


    You can also create Process instances that you can control from within your program
    in a similar manner to threads.


    C# Programming © Rob Miles 2016


