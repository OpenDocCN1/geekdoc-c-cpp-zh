  md: "# Creating Solutions\n\n# Static Items\n\nNow I can create accounts and set\
    \ balances and interest rates on. (if I was doing this properly Id make this stuff\
    \ private and provide methods etc, else I'm keeping things simple just now).\n\
    \n```\nRobbsAccount = new Account();\nRobbsAccount.Balance = 100;\nRobbsAccount.InterestRateCharged\
    \ = 10;\n```\n\nThe snag is; I've been told that the interest rate is held for\
