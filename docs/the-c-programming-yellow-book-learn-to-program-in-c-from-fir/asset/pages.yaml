  md: "# Creating Solutions\n\n# Designing Objects\n\n```\nclass Bank\n{\n    public\
    \ static void Main ()\n    {\n        Account RobsAccount;\n        RobsAccount\
    \ = new Account();\n        if (RobsAccount.WithdrawFunds (5))\n        {\n  \
    \          Console.WriteLine(\"Cash Withdrawn\");\n        }\n        else\n \
    \       {\n            Console.WriteLine(\"Insufficient Funds\");\n        }\n\
    \    }\n}\n```\n\n![](img/d50be9be3b33c7dfe37bae51200a38c3_100_0.png)\n\nThis\
    \ creates an account and then tries to draw five funds out of it. This course\
    \ will fail, since the initial balance on my account is zero, but this shows how\
    \ I providing access to members in an account. The method WithdrawFunds is a member\
    \ of the Account class and thenfore access private members of the class.\n\n#\
    \ Programmer's Point: Metadata makes Members and Methods\n\nI haven't mentioned\
    \ metadata for at least five minutes. So perhaps now is a good time. The data\
    \ that I gather about my bank system will drive how I access the members of my\
    \ classes. In the code above that I am protecting the balance value is a reflection\
    \ of how the customer wants to make sure that value is managed properly.\n\n#\
    \ public Methods\n\nYou have noticed that I made the WithdrawFunds method public.\
    \ This means that code running outside the class can make calls to that method.\
    \ This has to be the case, since we want people to interact with our objects by\
    \ calling methods in them. In the general rules are:\n\n+   - if it is a data\
    \ member (i.e. it holds data) of the class, make it private\n- if it is a method\
    \ (i.e. it does something) make it public\n\nOf course, the code can be broken\
    \ on special occasions. If you don't care about corruption of the member and you\
    \ want your program to run as quickly as possible you can make a data member public.\
    \ If you write a method which is only used inside a class and performs some special,\
    \ secret, task you can make it private.\n\n# Programmer's Point: Use coding conventions\
    \ to show which things are private\n\nIf you look at the code I wrote (and I advise\
    \ you to do this, it is good stuff) you will find that when name of the public\
    \ variable I use a capital letter to start the name (as in case of withdrawals\
    \ to from our bank account). But I make the first letter of private members lower\
    \ (as in the case of the balance data member of our bank account). This makes\
    \ it easy for everyone reading my code, because they can see from the name of\
    \ a class member whether not it is public or private. The convention also extends\
    \ to variables which are local to a block. These (for example the ubiquitous i)\
    \ always starts with a lower case letter."
