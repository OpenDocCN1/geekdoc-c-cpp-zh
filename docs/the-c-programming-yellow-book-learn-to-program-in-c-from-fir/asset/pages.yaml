    Jim\", \"Jim House\");\n        Accounts[2] = new Account(\"Fred\");\n    }\n\
    ```\n\nCode Sample 35 Overloaded Constructors\n\nThe sample code above shows constructor\
    \ overloading being used properly. The code creates an array of account references\
    \ (called Accounts) and then sets the first elements to point Account. The first\
    \ element points to an Account for Rob with a full address and 100000 pounds.\
    \ The second element (element 1) refers to an account for Jim with his address\
    \ and the default balance of 0. The third element (element 0) refers to an account\
    \ for Fred which has the default (\"Not Supplied\") and a default balance of 0.\n\
    \n# Programmer's Point: Object Construction Should Be Planned\n\nThe way in which\
    \ objects are constructed is something you should plan carefully when you write\
    \ your program. You should create one \"master\" constructor which handles the\
    \ most comprehensive method of constructing the object. Then you should make all\
    \ the other constructor methods use this to get hold of that method.\n\n# 4.7.5\
    \ A constructor cannot fail\n\nIf you watch a James Bond movie there is usually\
    \ a point where agent 007 tells that the fate of the world is in his hands. Failure\
    \ is not an option. Constructors are a bit like this. Constructors cannot fail.\
    \ And this is a problem:\n\nWhenever we have methods in the past we can make sure\
    \ their behaviour is error checked so that the method cannot upset the state of\
    \ our object. For example, attempts to withdraw negative amounts of money from\
    \ a bank account should be rejected.\n\nThe whole basis of why we have allowed\
    \ objects to be manipulated is to make sure they cannot be broken by the people\
    \ using them. If you try to do something stupid with a method call it should refuse\
    \ to perform the action and return something that indicates it could not do the\
    \ job.\n\nSo we know that we create a method that changes the data in an object\
    \ we have to make sure that the change is always valid. For example, we would\
    \ not let the following succeed:\n\n```\nRobAccount.PayFunds(1234567890);\n```\n\
    \nThere will be upper limit to the amount of cash you can pay in, so that the\
    \ PayFunds method will refuse to pay the money in. But what is to stop the following:\n\
    \n```\nAccount = new Account(\"Rob\", \"Hull\", 1234567890);\n```\n\nLike James\
    \ Bond, constructors are not allowed to fail. Whatever happens during the constructor\
    \ call, it will complete and a new instance will be created."
