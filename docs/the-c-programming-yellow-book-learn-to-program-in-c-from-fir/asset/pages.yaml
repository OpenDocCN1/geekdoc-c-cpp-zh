  md: "# Creating Programs\n\n# Arrays\n\nA constant variable is given a value when\
    \ it is declared. This value can then be read by the program, never updated. So,\
    \ if I wanted to write a scores program that could be easily changed for any size\
    \ of team I could write:\n\n```\nusing System;\nclass ArrayDemo\n{\n    public\
    \ static void Main ()\n    {\n        const int SCORE_SIZE = 1000;\n        int\
    \ [] scores = new int[SCORE_SIZE];\n        for (int i=0; i < SCORE_SIZE; i++)\n\
    \        {\n            scores[i] = readint(\"Score : \",0,1000);\n        }\n\
    \    }\n}\n```\n\n# Sample 16 Using an Array\n\nThe variable SCORE_SIZE is an\
    \ integer which has been marked with const. This means that it cannot be changed\
    \ by statements in the program. It will never have a value other than 1000. It\
    \ is a convention that constants of this kind are given in LARGE LETTERS with\
    \ underscore words.\n\nEverywhere I used a fixed value to represent the size of\
    \ the array I now mean that if the size of the team I just have to change the\
    \ value assigned to the constant I declare it and then re-compile the program.\
    \ The other benefit of this is that the for loop looks a lot more meaningful.\
    \ Since the variable i is now going from 0 to SCORE_SIZE it is more obvious to\
    \ the reader that it is working through the score array.\n\n# 3.3.4 Creating a\
    \ Two Dimensional Array\n\nHowever we want to hold more than just a row. We want\
    \ a grid. We can do this by creating a two dimensional array. You can think of\
    \ this as an \"array of arrays\" if you like (but only if this doesn't make your\
    \ head hurt). For example, to hold the board for a game of noughts and crosses\
    \ (tic tac toe) we could use:\n\n```\nint [,] board = new int [3,3];\nboard[1,1]\
    \ = 1;\n```\n\nThis works like one dimensional array, but there are some important\
    \ differences. The [,] now has a comma. The presence of a comma implies on each\
    \ side of it. This means that the array now has two dimensions, rather than just\
    \ one. When we give the size of the board we must supply two dimensions rather\
    \ than just one. Then, when we want to specify an element we have two subscript\
    \ values. In the code above I've set the value in the middle (the best one) to\
    \ one.\n\nYou can think of a 2D array as a grid:\n\n| 0 | 1 | 2 |\n|---|---|---|\n\
    | 0 | 0 | 0 |\n| 1 | 1 | 0 |\n| 2 | 0 | 0 |\n\nThe first script could be used\
    \ to specify which row and which second column. The diagram shows the board with\
    \ the best move already taken.\n\nIn the example the array is square (i.e. the\
    \ same dimension across as). We can change this if we:\n\n```\nint [,] board =\
    \ new int [3,10];\n```\n\n- but this would make it rather hard to play a sensible\
    \ game on.\n\nC# Programming © Rob Miles 2016\n\n64"
