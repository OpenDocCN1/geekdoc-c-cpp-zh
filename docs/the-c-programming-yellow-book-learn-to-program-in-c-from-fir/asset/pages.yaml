  md: "# Creating Solutions\n\n# From Object to Component\n\n```\npublic interface\
    \ IPrintToPaper\n{\n    void DoPrint();\n}\n```\n\nNow anything implements the\
    \ IPrintToPaper interface will contain the DoPrint method and can be thought of\
    \ in terms of its ability to print.\n\nA class can implement as many interfaces\
    \ as it needs. Each interface is a new way in which it can be referred to and\
    \ accessed.\n\n```\npublic class BabyAccount : IAccount, IPrintToPaper\n{\n```\n\
    \nThis means a BabyAccount instance behaves like an account and also contains\
    \ a DoPrint method which can be used to make print out.\n\n# 4.8. Designing with\
    \ Interfaces\n\nIf you apply the \"abstraction\" technique you should end up with\
    \ a system process which goes along the lines of:\n\n+   - gather as much metadata\
    \ as you can about the problem; what is important to the customer, what values\
    \ need to be represented and manipulated and the range of values\n- identify classes\
    \ that you will have to create components in the problem\n- identify the actions\
    \ (methods) and the values (properties) that the components must provide\n- put\
    \ these into interfaces for each of the components\n- decide how these values\
    \ and actions are to be tested\n- implement the components and test them as you\
    \ go\n\nYou/could do much of this on paper, before you write any code at all.\
    \ There are also graphical tools that you can use to draw formal diagrams to represent\
    \ information. The field of Software Engineering is entirely based on process.\n\
    \nYou should also have that interfaces are good things to hang on. If you have\
    \ a set of fundamentals that all bank accounts must (for example paying in money\
    \ must always make the account balance go up) then you can write tests that bind\
    \ to the IAccount interface and can be used to test any of the components that\
    \ are created.\n\n# Programmer's Interface: Interfaces are just promises\n\nAn\
    \ interface is less a binding contract, more a promise. Because a class has a\
    \ method called PayFunds does not mean that it will pay money into the account;\
    \ it means that method with that name exists within the class. Nothing in C allows\
    \ you to enforce a particular behaviour on a method: that is down to how much\
    \ you trust the program that the class you made and how your tests are. In fact,\
    \ we sometimes use this to effect when building a program, that we can create\
    \ \"dummy\" components which implement the interface but don't have the behaviour\
    \ as such.\n\nThe interface gives us a great deal of flexibility when making the\
    \ components and fitting them together. It means that once we have found out what\
    \ our bank account class needs to hold for we can then go on what we consider\
    \ are going to add the accounts to. This is the real detail in the specification.\
    \ Once we have set out an interface for a component we can just think in terms\
    \ of what the component must do, not precisely how it does.\n\nFor example, the\
    \ manager has told us that each bank account must have an account number. This\
    \ is a very important value, in that it will be fixed for the life of the account\
    \ and never be changed. No two accounts should ever have the same number.\n\n\
    C# Programming | Rob Miles 2016\n\n115"
