  md: "# 5.2 Storing Business Objects\n\nFor our bank to work well we have to have\
    \ a way of storing the bank accounts and bringing them back again. If we want\
    \ our program to be able to process a large number of accounts we know that we\
    \ have to create an array to manage this. This means that our data storage requirements\
    \ are that we should load all the accounts into memory when the program starts,\
    \ and save them when the program completes.\n\nStart with, we will consider how\
    \ we save one account. We can then move on to consider the code which will save\
    \ a large number of them. The account that we are going to work with only two\
    \ members but the ideas we are exploring can be extended to handle classes containing\
    \ much larger amounts of data. We can express the required account behaviour in\
    \ terms of the following interface:\n\n```\npublic interface Account {\n    void\
    \ PayFunds (decimal amount);\n    bool WithdrawFunds (decimal amount);\n    decimal\
    \ GetBalance();\n    string GetName();\n}\n```\n\nAll the accounts in the bank\
    \ are going to be managed in terms of objects which implement this interface to\
    \ manage the balance and read the name of the account owner.\n\nWe can create\
    \ a class called Account which implements the interface and contains the required\
    \ methods. It also has a constructor which allows the initial name and balance\
    \ values to be set when the account is created."
