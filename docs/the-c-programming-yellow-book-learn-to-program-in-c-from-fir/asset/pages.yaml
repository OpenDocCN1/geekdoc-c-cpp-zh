  md: "# 4.6 Static Items\n\nAt the moment all the members that we have created in\
    \ our class are part of an instance of the class. This means that whenever we\
    \ create an instance of the Account class we get a balance member. However, we\
    \ can also create members who are held part of the class, i.e. they exist outside\
    \ of any particular instance.\n\n# 4.6.1 Static class members\n\nThe static keyword\
    \ lets us create members which are not held in an instance, but in the class itself.\n\
    \nit is very important that you learn what static means in the context of C# programs.\
    \ We have used lots in just every program that we have written:\n\n```\nclass\
    \ AccountTest {\n    public static void Main () {\n        Account test = new\
    \ Account();\n        test.PayInFunds(\"Balance:\");\n        Console.WriteLine(\"\
    Balance:\" + test.getBalance());\n    }\n}\n```\n\nThe AccountTest class has a\
    \ static member called Main. We know that this is the method called to run the\
    \ program. It is part of the class AccountTest. If I made fifty Account instances,\
    \ they would all share the same Main method. In terms of C# the keyword static\
    \ flags a member as part of the class, not part of instance of the class. I will\
    \ write that again in a posh font, for it is important:\n\n> A static member is\
    \ a member of the class, not a member of an instance of the class\n\nI don't have\
    \ to make an instance of the AccountTest class to be able to use the Main method.\
    \ This is how my program actually gets to work, in that when it starts it has\
    \ made any changes of anything, and so this method must be there, otherwise it\
    \ can run.\n\nStatic does not mean \"cannot be changed\". I think this is for\
    \ more posh font stuff:\n\n> Static does not mean \"cannot be changed.\"\n\nMembers\
    \ of a class which have been made static can be used like any other member of\
    \ a class. Either a data member or a method can be static.\n\n# 4.6.2 Using a\
    \ static data member of a class\n\nPerhaps an example of static data would help\
    \ at this point. Consider the interest rate of our bank accounts. The customer\
    \ tells us that one of the members of the account class will need to be the interest\
    \ rate on accounts. In the program we can implement this by adding another member\
    \ to the class which holds the current interest rate:\n\n```\npublic class Account\
    \ {\n    public decimal Balance;\n    public decimal InterestRateCharged;\n}\n\
    ```"
