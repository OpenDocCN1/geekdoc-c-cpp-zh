  md: '# 3.6.4 Closing a Stream


    When your program has finished writing to a stream it is very important that the
    stream is explicitly closed using the Close method:


    `writer.Close();`


    When the Close method is called the stream will write out any text to the file
    that is waiting to be written and disconnect from the program. Any further attempts
    to write to the stream will fail with an exception. Once a file is closed it can
    be accessed by other programs on the computer, i.e. once the .txt file and take
    a look at what is inside it. Forgetting to close a file is bad for a number of
    reasons:


    +   - It is possible that the program may finish without the file being closed.
    In this situation some of the data that you wrote into it will not be there.

    - If your program has a stream connected to a file other programs may be able
    to use that file. It will also be impossible to move or rename the file.

    - An open stream creates a small but significant, part of operating resource.
    If your program creates lots of streams but does not close this might lead to
    problems opening other files later.


    So, close the file or suffer the consequences.


    # 3.6.5 Streams and Namespaces


    If you rush out and try the avid bits of code you find don''t work. Sorry about
    that. There is something else that you need to know before you use the StreamWriter
    type. Like most of objects that deal with input and output, this object is defined
    in the System.IO namespace. We have touched on namespaces before, when we were
    told to have the name something using System; at the start of our C# programs.
    Now we''ll find out more about them now.


    Namespaces are all to do with finding resources. The C# language provides a whole
    lot of extra resources supplied with a C# installation. While the Console object
    that lets us read and write text to the user, a C# installation actually contains
    thousands of resources, which of each must be uniquely identified. If you are
    organizing a huge number of things you would find very helpful to label items
    into groups. Namespaces do all the time. You put all the Romans in one room, and
    the Greeks in another. The designers of the C# language created a namespace where
    programmers can do the same kind of thing with their resources.


    A namespace is, quite literally, a "space where names have meaning". The full
    name of the Console that you have been using to write text to the user is System.Console.
    That is, the Console class in the System namespace. It makes it quite OK to use
    this form in your programs:


    ```

    System.Console.WriteLine("Hello World");

    ```


    The above uses the fully qualified name of the console and calls the WriteLine
    for resource. However, we''ve not had to use this form because at the start of
    our programs we have to tell the compiler to use the System namespace to find
    any names it hasn''t seen before. Using the keyword allows us to tell the compiler
    where to look for resources.


    using System;


    This statement tells the compiler to look in the System namespace for resources.
    Once we have specified a namespace in a program file we will not need to use the
    fully qualified name for that namespace. Whenever the compiler finds'
