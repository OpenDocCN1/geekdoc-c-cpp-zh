    who caused the failure and make him or her pay for the next one.


    # 4.5.4 Test Driven Development


    I love test development. If I write anything new you can get by your boots

    I will write using a test driven approach. This solves three problems that I can
    see:


    +   You don''t test at the end of the project. This is usually the

    time to test, since you might be using code that you wrote some time back.

    The bugs are in an old piece of code you have to go through the effort of

    remembering how it works. Far better to test the code as you write it, when

    have the best possible understanding of what it is supposed to be.


    +   You can write code early in the project which will probably be later on.

    Many projects are doomed because people start programming before they

    have a proper understanding of the problem. The writing test is first actually
    a

    really good way of refining your understanding. It gives you a good chance

    the tests that you will will be useful at some point too.


    +   When you have bugs in your project you need to convince yourself

    t the fixes have not broken some other part (about the most common way)

    of introducing new faults into a program is to mend a bug). If you have a set

    of automatic tests that run every bug fix you have a way of stopping this

    from happening.


