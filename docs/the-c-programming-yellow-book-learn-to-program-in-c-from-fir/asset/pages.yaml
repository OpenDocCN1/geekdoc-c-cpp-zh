    \ for the particular instance. This is a good idea.\n\n# Loading and factories\n\
    \nWhen it comes to loading our classes it gets a little tricky. Trick would be\
    \ sensible to add load methods to the IAccount, so we can ask instances of a particular\
    \ kind of account to load themselves. However, there is a problem here, in when\
