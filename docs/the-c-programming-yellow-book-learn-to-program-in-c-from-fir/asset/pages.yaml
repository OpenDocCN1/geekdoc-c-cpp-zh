    # Writing a Program


    # ==


    **equals.** If the left hand side and the right hand side are equal the expression
    has the value `true`. If they are not equal the value is `false`.


    4 == 5


    - would evaluate to `false`. Note that it is not particularly meaningful to compare
    floating point variables to see if they hold exactly the same value. Because of
    the fact they are held to limited precision you might find conditions fail when
    they should not for example the following equation:


    ```

    x = 3.0 * (1.0 / 3.0);

    ```


    - may result in x containing 0.99999999, which would mean that:


    ```

    x = 1.0

    ```


    If you want to compare floating point values and see if the difference is very
    small.


    - be `false` - even though mathematically the test should evaluate to `true`.


    # !


    **not equal.** The reverse of equals. If the operands are not equal the expression
    has the value `true`, if they are equal the value `false`. Again, this is not
    advisable for use with floating point numbers.


    # <


    **less than.** If the operand on the left is less than the one on the right of
    the expression is `true`. If the left hand operand is less than or equal to the
    right hand the expression gets `false`. It is quite wise to compare floating point
    numbers in this way.


    # >


    **greater than.** If the operand on the left is greater than the one on the right
    result is `true`. If the operand on the left is less than or equal to the one
    on the right result is `false`.


    # <=


    **less or equal to.** If the operand on the left is less than or equal to the
    one on the right you get `true`, otherwise you get `false`.


    # >=


    **greater or equal to.** If the operand on the left is greater than or equal to
    the one on the right you get `true`, otherwise it is `false`.


    # !


    **not.** This is used to invert a particular value or expression, for example
    you can say `!true`, which is `false`, or you could say: `!(x==y)`. You not not
    want to invert the sense of an expression.


