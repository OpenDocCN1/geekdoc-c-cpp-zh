    # Storing real values


    Real is a generic term for numbers which are not integers. They have a decimal
    point and a fractional part. Depending on the value decimal point floats around
    the number, the name float.


    C provides a type of box which can hold a real number. A standard float value
    has a range of 1.5E-45 to 3.4E48 with a precision of 7 digits (it is not as good
    as most calculators).


    If you want more precision (although of course your programs will use up more
    memory and run slower) you can use a double instead of float for double precision.
    This takes up computer memory but it has a range of 5.0E-324 to 1.7E308 and a
    precision of 15 digits.


    An example of a float could be something which would help the average price of
    ice cream in inches:


    ```

    float averageIceCreamPricePence;

    ```


    An example of a double could show which the width of the universe in inches:


    ```

    double uniWidthInches;

    ```


    Finally, if you want the ultimate in precision but a slightly smaller range you
    can use the decimal type. This uses the storage space of a double and holds values
    to precision of 28-29 digits. It is used in financial calculations where the numbers
    are not so large but they need to be held to very high accuracy.


    ```

    decimal roOverdraft;

    ```


    # real literal values


    There are two ways in which you can store floating point numbers; as float or
    as double. When it comes to putting literal values in the program the compiler
    likes to know if you are writing a floating point value (smaller sized box) or
    double (larger sized box).


    A float literal can be expressed as a real number with an f:


    ```

    2.5f;

    ```


    A double literal is expressed as a real number without the f:


    ```

    3.5

    ```


    You can also use exponent to represent double and float values:


    ```

    9.465284E15

    ```


    This is a decimal literal value which is actually the number of meters in a light
    year. If you put an f on the end of it becomes a floating point literal value.


    Unlike the way that integers work, with real numbers the compiler is fussy about
    how they can and cannot be combined. This is because when you move a value from
    a double precision variable into an ordinary floating point variable is lost.
    This means that you have to take special steps to make sure that you as a programmer
    make clear that you want this to happen and you can live with the consequences.
    This process is known as casting and we will consider it in a detail bit later.'
