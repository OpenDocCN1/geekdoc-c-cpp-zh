  md: '# Simple Data Processing


    # Manipulating Data


    A cast can also lose information in other ways:


    ```

    int i;

    i = (int) 1.999;

    ```


    The code above 1.999 (which would be compiled as a value of type double) and casts
    it to int. This process discards the fractional part, which means that the value
    will end up with the value 1 in it, even though the original number was much closer
    to 2. You should remember that truncation takes place whenever you cast a value
    with a fractional part (float, double, decimal) into one without.


    # Casting and Literal Values


    We have seen that you can use "literal" values into your program. These are just
    values you want to use in your calculations. For example, in our double glazing
    program we had to multiply the width length in meters by 3.25 to convert the value
    from meters to feet (where 3.2 feet is a meter).


    C# keeps careful of the things that it is combining, and this includes how it
    allows literals to be used. This is by that statements:


    ```

    int i;

    i = 3.4 / "stupid";

    ```


    +   - will be treated with the contempt they richly deserve. The C# compiler knows
    that it is da to divide the value 3.4 by the string "stupid". However, consider
    this:


    ```

    float x;

    x = (float) 3.4;

    ```


    This code looks perfectly legal. However, it is not. Because the literal 3.4 is
    a double precision value when expressed as a literal, and the variable x has declared
    as a floating point. If you want to put a floating point literal value into a
    floating point variable x can use:


    ```

    float x;

    x = (float) 3.4;

    ```


    This casts the double precision literal into a floating point, so that the assignment
    works.


    To life easier the creators of C# have added a different way we can express a
    floating point literal value in a program. If you put an f after the value this
    is regarded as a floating point value. This means:


    ```

    float x;

    x = 3.4f;

    ```


    +   - would compile correctly.


    # 2.2.8 Types of Data in Expressions


    When C# uses an operator, it makes a decision as to the type of the result that
    is to be produced. Essentially, if the operands are integer it says that the result
    should be integer. If the two are floating point it says that the result should
    be floating point. This can lead to problems, consider the following:


    ```

    1/2

    1/2,0

    ```


    You might think that this would give the same result. Not the C# compiler thinks
    that the first expression, which involves only integers, should give an integer
    result. It would calculate this to be the integer value 0 (the fractional part
    is always truncated). The second expression, because it involves a floating point
    value would be evaluated to give a double precision floating point result, the
    more accurate answer of 0, 5.'
