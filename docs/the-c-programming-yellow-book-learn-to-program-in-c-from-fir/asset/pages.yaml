    # 4.13.2 Searching and Performance\n\nThe solution will work fine, and could be\
    \ used as the basis of a bank. However, it becomes very slow as the size of the\
    \ bank increases. Each time we add a new account the searching gets slower the\
    \ FindAccount method must look through more items to find. On a bank with fifty\
    \ accounts this is not a problem, but if there are thousands of accounts this\
    \ simple search will be too slow.\n\n# 4.13.3 Storing Accounts using a Hash Table\n\
    \nFortunately for us we use a device \"hash table\" which allows us to easily\
    \ find items on a key. This is much faster than a sequential search, since it\
    \ uses a technique which will take us to the required item.\n\nThe idea is to\
    \ do something mathematical (\"hashing\") to the information in the search property\
    \ to generate a number which can then be used to identify the location where the\
    \ data is stored.\n\nFor example, we could take all the letters in the account\
    \ name, like the ASCII code for each letter and add these values up. The name\
    \ \"Rob\" could be converted to 82+114+98=291. We would look in 291 for such account.\n\
    \nOf this case is not foolproof, the name \"Rpa\" would give the same total (82+112+97)\
    \ and refer to the same location. This is poetically referred as a \"hash clash\"\
    . We can do better things with the way we combine the values to reduce the chances\
    \ of this happening, but we can completely avoid clashes.\n\nCllashes can be resolved\
    \ by adding a test when we are storing an account. If we find the location we\
    \ would like to use is not null we simply work our way looking down for the first\
    \ location from that point.\n\nWhen we want to find a given item we use the hash\
    \ to take us the starting position for the search and then look for the one with\
    \ the matching name."
