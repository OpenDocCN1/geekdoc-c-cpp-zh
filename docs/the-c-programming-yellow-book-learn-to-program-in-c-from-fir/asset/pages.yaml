    \    bool WithdrawFunds (decimal amount);\n    decimal GetBalance();\n    string\
    \ GetName();\n\n    bool Save(string filename);\n    void Save(System.IO.TextWriter\
    \ textOut);\n}\n```\n\nWe can now ask any item that implements the IAccount interface\
    \ to save itself to either a file or a stream. This is very useful when we store\
    \ our collection of accounts, since the account will not have to behave differently\
