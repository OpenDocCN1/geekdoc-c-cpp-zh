    # 4.11 The power of strings and chars


    It is probably worth spending a few moments considering the string in a bit more
    detail. This is because you get a lot of extra features which will save you lot
    of work. These are exposed as methods which you can call on a string reference.
    The methods will return a new string, transformed in the way that you ask. You
    can sort out the case of the text, trim spaces off the start and extract sub-strings
    using these methods.


    # 4.11.1 String Manipulation


    Strings are rather special. They can be regarded like a bit. A bit can be regarded
    as either an animal or a bird in many respects. A string can be regarded as an
    object (referred to by means of reference) or a value (referred to as value).


    This hybrid behaviour is provided because it makes things easier for programmers.
    It does not mean that we have to refer to strings as a special when you are learning
    programming, because they seem to break some of the rules that we learn.


    It is important that you understand what happens when you transform a string.
    This is because, although strings are objects, they don''t behave like objects
    all the time.


    ```

    string s1="Rob";

    string s2=s1;

    s2 = "different";

    Console.WriteLine(s1 + " "" + s2);"

    ```


    If you know about objects and references, you should be expecting s1 when change
    s2 is changed. The second statement made the reference s2 refer to the same object
    as s1, so changing s2 should change the object s1 refers to. To find out more
    about this, take a look at section 4.4.1.


    This does not happen because C# regards an instance of a string in a special way.
    It is immutable. This is because programmers want strings to behave like values
    in this respect.


    # 4.11.2 Immutable strings


    The idea is if you try to change a string, the C# system creates a new string
    and makes the reference refer to "changing" to that one. When the system sees
    the:


    ```

    s2 = "different";

    ```


    - it makes a new string which contains the text "different" and makes s2 refer
    to that. The thing s1 is referring to is unchanged. So, after the assignment s1
    and s2 no longer refer to the same object. This behaviour, never allowing a thing
    to be changed by making a new one each time it is required, is how the system
    keeps immutable.


    You might ask the question: "Why go to all the trouble? It might seem all this
    hassle could be saved by just making strings into value types. Well, no. Consider
    the situation where you are storing a large document in the computer. By using
    references we only need one string with the word "the" in it. All the occurrences
    in the text can refer to that one instance. This saves memory and it also makes
    searching for words much faster.'
