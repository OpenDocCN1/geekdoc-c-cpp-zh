  md: "# 3.3.5 Arrays and Lookup Tables\n\nArrays make great lookup tables. They provide\
    \ a neat way of going from a number to something else. For example, you might\
    \ want to print out the name of the month, from the month value. You could do\
    \ this by using tests:\n\n```\nint monthNo = 1;\nstring monthName;\n\nif (monthNo\
    \ == 1)\n    monthName = \"January\";\n\nif (monthNo == 2)\n    monthName = \"\
    February\";\n```\n\nThis would be tedious to write. A neater way would be to use\
    \ an array which you call monthNames. Then we could do like this:\n\n```\nmonthName\
    \ = monthNames[monthNo];\n```\n\nFor this to work we need to make sure that each\
    \ of the elements in the monthNames array would hold the name of the month.\n\n\
    ```\nstring monthNames[] = new string[13];\n```\n\nSo we would have some setting\
    \ up before we use the lookup table:\n\n```\nmonthNames[1] = \"January\";\nmonthNames[2]\
    \ = \"February\";\n```\n\n# Programmer's Point: Sometimes it is OK to \"waste\"\
    \ array element\n\nIf you followed the text carefully up to now you will have\
