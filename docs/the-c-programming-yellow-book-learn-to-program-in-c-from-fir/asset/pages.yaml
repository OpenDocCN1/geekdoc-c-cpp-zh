    # ### Using a Class from a Namespace


    A global class (one created outside any namespace) can be referred to by its name.
    If you want to use a class from a namespace you have to give the namespace a name.


    ```

    CustomerBanking.Account test;

    ```


    This creates a variable which can refer to instances of the Account class. The
    `Account` class we use is the one in the `CustomerBanking` namespace.


    A name like this, with the namespace in front, is known as a fully qualified name.
    If we want to create an instance of the class we use the fully qualified name
    again:


    ```

    test = new CustomerBanking.Account();

    ```


    If I want to use the Account class from the `CustomerBanking` namespace I have
    to modify my test accordingly.


    # ### Using a namespace


    If you are using a lot of things from a particular namespace C# provides a way
    in which you can tell the compiler to look in that namespace when it has to resolve
    the name of a particular item. We do this with the using keyword:


    ```

    using CustomerBanking;

    ```


    When the compiler sees a line:


    ```

    Account Robs;

    ```


    - it automatically looks in the `CustomerBanking` namespace to see if there is
    a class `Account`. If there is that. We have already used this technique a lot.
    The `System` namespace is where a lot of library components are located. We can
    use these by means of fully qualified names:


    ```

    System.Console.WriteLine ("Hello World");

    ```


    However, it is common for most programs to have the line:


    ```

    using System;

    ```


    - at the very top. That the programmer can write:


    ```

    Console.WriteLine ("Hello World");

    ```


    The compiler goes, "I''ll go and look for a thing like Console in all the namespaces
    that I''ve used to use". If it finds one, only Console, then it is well and it
    uses that. If it finds two Console (if I was an idiot I could put a Console class
    in my `CustomerBanking` namespace I suppose) it will complain that it doesn''t
    know which to use.


    # ### Nesting Namespaces


    You can put one namespace inside another. This allows you to break things into
    smaller chunks. The System namespace is like this, there is a namespace which
    is part of the System namespace which is specifically concerned with Input/Output.
    You can use the items in the `System.IO` namespace with an appropriate include:


    ```

    using System.IO;

    ```


    In terms of declaring the namespace you do it like this:'
