  md: "# Creating Solutions\n\n# From Object to Component\n\n+   - creating things\
    \ which contain member variables as properties and member\nmethods as actions\
    \ (objects)\n\nRather than spend a lot of time at the start of a project worrying\
    \ just how we are going\nrepresent an account and precisely what it should do,\
    \ we just say “We need an account\nhere” and then move on to other things. Later\
    \ we will come back and revisit the\nproblem in a greater level of detail, and\
    \ from the point of view of what the Account\nclass needs to do.\n\nThe next thing\
    \ to do is consider how we take a further step back and consider\\expressing a\
    \ solution using components and interfaces. In this section you will find out\
    \ the difference between an object and a component, and how to design systems\n\
    them.\n\n# ## 4.8.1 Components and Hardware\n\nBefore we start on things from\
    \ a software point of view it is probably worth\nconsidering things from a hardware\
    \ point of view. You should be familiar with the way\nthat, in a typical computer,\
    \ some parts are not “wired” to the system. For\nexample, the graphics adapter\
    \ is a separate device which is plugged into the\nmain board. This is good; it\
    \ means that I can buy a new graphics adapter at any\ntime and fit it into the\
    \ machine to improve the performance.\n\nFor this to work properly the people\
    \ who make main boards and the people make\ngraphics adapters have to agree on\
    \ an interface between two devices. This takes\nform a large document which describes\
    \ exactly how the two components\ninteract, for example which signals are inputs,\
    \ which signals are outputs and so.\nAny main board which contains a socket built\
    \ to the standard can accept a graphics\ncard.\n\nSo, from the point of view of\
    \ hardware, components are possible because we have\ncreated interfaces which\
    \ describe exactly how they fit together.\n\nSoftware components are exactly the\
    \ same.\n\n# ## Why Need Software Components?\n\nAt the moment you might not see\
    \ a need for software components. When we are\ncreating a system we work out what\
    \ each of the parts of it needs to do, and then we\ncreate those parts. It is\
    \ not obvious at this stage when components are required.\n\nA well, designed\
    \ system without components is exactly like a computer with graphics\nadapter\
    \ is part of the main board. It is not possible for me to improve the\ngraphics\
    \ adapter because it is “wired” into the system.\n\nHowever, it is unfortunately\
    \ the case that with our bank system we may have a need\nto create different forms\
    \ of bank account class. For “BabyAccount” class which only lets the account holder\
    \ up to tens\neach time. This might happen even after we have installed the system\
    \ and it is being\nused.\n\nIf everything has been wired into place this will\
    \ be impossible. By describing\nobjects in terms of their interfaces however,\
    \ we can use anything that behaves like an\nAccount in this position.\n\n# ##\
    \ 4.8.2 Components and Interfaces\n\nOne point I should make here that we are\
    \ not talking about the user interface to our\nprogram. The user interface is\
    \ the way a person using our program would work for\n them. This is usually either\
    \ text (the user types in commands and gets\nresponses) or graphical (the user\
    \ clicks on “buttons” on a screen using the mouse).\n\nAn interface on the other\
    \ hand just specifies how a software component could be used\by another software\
    \ component. Please don't be tempted to answer any question"
