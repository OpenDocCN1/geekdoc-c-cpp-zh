    # 4.10.1 Objects and ToString


    We have taken it as read that objects have a magical ability to print themselves
    out. If I write the code:


    ```

    int i = 99;

    Console.WriteLine(i);

    ```


    This will print out:

    99


    The integer somehow knows to how to print itself out. Now it is time to find out
    how this is achieved, and also how we can give our own objects the same magical
    ability.


    It turns out this is all provided by the "objectness" of things in C#. We know
    that an object can contain information and do things for us (if we have seen the
    whole basis of building programs is to decide what the objects should do and then
    make these things). We also see that you can extend a parent object to create
    a child which has all the abilities of the parent, plus the new ones that we added.
    Now we are going to see how abilities of objects are used in making parts of the
    C# implementation work.


    # The Object class


