    (the array) and extend up to the size of the array minus 1. If you create a four
    element array you get of elements in the array by subscript values of 0,12 or
    3. The best way to regard a subscript is the distance the array you are going
    to move the element that you want. This means that the first element in the array
    must have a subscript value of 0.


    # Syntax Highlighting


    Some program editors (for example Visual Studio) display different program elements
    in different colors, to make it easier for the programmer to understand the code.
    Keywords are displayed in blue, strings in red and green. Note that the colours
    are added by the editor, and there is nothing in the actual C# source file that
    determines the colour of the text.


    # Test harness


    The test harness will contain simulations of those portions of the input and output
    the system is being tested will use. You put your program into a test harness
    and then the program thinks it is in the completed system. A test harness is very
    useful when debugging it removes the need for the complete system (for example
    a farewell?).


    # This


    this is a C# keyword which has different meanings depending on the context in
    which it is given. It is used in a constructor of a class to call another constructor.
    It is also used as a reference to the current instance, for use in non-static
    methods running inside that instance.


    # Typesafe


    We have seen that C# is fussy about combining things that should not be combined.
    Try to put a float value into an int variable and the compiler will get error
    at this point. The reason for this is that the designers of the language have
    noticed few common programming mistakes and designed it so that these mistakes
    are detected before the program runs, or when it crashes. One of these is the
    use of values in contexts where it is not meaningful to do (put a string into
    a bool) or could result in loss of data or accuracy (put a data into a byte).
    This kind of fussiness is called safety and is very big on it. Other languages
    are much more relaxed about combining things, and on the basis that the programmer
    knows best. They assume that because code has been written to something, that
    thing must be the right.


    C# is very keen on this (as am I). It is important that developers get all the
    help to stop them doing stupid things, and a language that stops them from combining
    things in a way that might not be sensible is a good thing in my book.


    Of course if you really want to impose your will on the compiler and force it
    to compile your code in spite of any type safety issues you can do this by casting.


    # Unit test


    A unit test is a small test that exercises a component and ensures that it performs
    a particular function correctly. Unit tests should be written alongside the development
    process so that they can be applied to code just after (or in test drive development)
    before the code is written.'
