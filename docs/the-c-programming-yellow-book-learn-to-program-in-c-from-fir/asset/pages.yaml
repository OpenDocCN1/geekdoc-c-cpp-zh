  md: '# 4 Creating Solutions


    # 4.1 Our Case Study: Friendly Bank


    The body of this section is based on a case study which will allow you to see
    the features of C# in a strong context. You are taking the role of a programmer
    who will be using the language to create a solution for a customer.


    The program we are making for a bank, the "United Friendly and Really Nice Bank
    of Lovely People™", otherwise known as the Friendly Bank. We will be creating
    the entire bank application using C# and will be exploring the features of C#
    that makes this easy.


    It is unlikely that you will get to actually implement an entire banking system
    during your professional career as a programmer (although it be quite fun and
    relatively lucrative). However, from a programming point of view it is an interesting
    problem and as we approach it will uncover lots of techniques which will be useful
    in other programs that we write.


    # Programmer''s Point: Look for Patterns


    The number of different programs in the world is actually quite small. A lot of
    the things that our bank is going to do (store a large amount of information about
    a large number of individuals, search for information for a particular person,
    implement transactions that change the content of one or more items in the system)
    are common to many types of programs, from video games to others.


    # 4.1.1 Bank Scope


    The scope of the system is a description of the things that the system is going
    to do. This is also, by implication, a statement of what the system will not do.
    This is equally as important, as a customer will not usually have a clear idea
    of what you are doing and may well expect you to deliver things you have no intention
    of providing. By setting out the scope at the beginning you can make sure that
    there are no unpleasant surprises later.


    At the moment we are simply concerned with managing the account information in
    the bank. The manager tells us that the bank stores information about each customer.
    Their information includes their name, address, account number, balance and overdraft
    value. Other data items may be added later.


    There are many thousands of customers and the manager also tells us that there
    are a number of different types of accounts (and new types of account are invented
    from time to time).


    The system must also generate warning letters and statements as required.


    # BANK NOTES


    At the end of some sections there will be a description of how this new piece
    of C# will affect how we create our bank system. These notes should put the feature
    into a useful context.


    # 4.2 Enumerated Types


    These really sound fine. If anyone asks what you learned today you might say "I
    learned how to use enumerated types" and they will be really impressed. If they
    know about programming they''ll say "Oh, you mean you''ve numbered some states".'
