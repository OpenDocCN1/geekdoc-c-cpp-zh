  md: "# Advanced Programming\n\n# Generics and Collections\n\nthat the bank has many\
    \ lists of customers. It will have a list of all the customers, with a list of\
    \ \"special\" customers and perhaps another list of those who owe the most money.\
    \ So, an item \"in\" an arraylist is never actually in it, the list contains a\
    \ reference to it. When an item is removed from an arraylist, it is not necessarily\
    \ destroyed; it is just no longer on that list.\n\n# Accessing Items in an ArrayList\n\
    \nItems in arrays can be accessed in the same way as array elements, but with\
    \ a tricky twist. It would be very nice if we could just get the hold of the account\
    \ from the arraylist and use it.\n\n```\nAccount a = store[0];\na.PayFunds(50);\n\
    ```\n\nUnfortunately not If you write this code you get a compilation error. The\
    \ reason for this is that an arraylist holds a list of object references. If you\
    \ wonder about it, this is the only thing that it can hold. The designers of the\
    \ ArrayList had no idea precisely what type of object a programmer would want\
    \ to use with and so they had to use the object.\n\nYou will not member from the\
    \ discussion of object hierarchies an object reference can refer to an instance\
    \ of any class (since they are all derived from object) and so that is the only\
    \ kind of reference that the arraylist works.\n\nThis is not actually a huge problem,\
    \ because a program can use a cast to change the type of the arraylist returns:\n\
    \n```\nAccount a = (Account) store[0];\na.PayFunds(50);\n```\n\nThis would get\
    \ it at the start of the arraylist, a cast it into an account and then pay fifty\
    \ pounds into it.\n\nA slightly larger problem is that an arraylist is not typesafe.\
    \ This means that we can't be sure that an arraylist gives us nothing other than\
    \ accounts in it:\n\n```\nKitchenSink k = new KitchenSink();\nstore.add(k);\n\
    ```\n\nThis puts a reference to a KitchenSink instance into our bank storage.\
    \ This will cause problems (an typesafe exception) if we try to use it as an Account.\
    \ To get a properly typesafe storage we have to take a look at generics in a bit\
    \ later.\n\n# Removing Items from an ArrayList\n\nIt is not possible to remove\
    \ items from an arraylist, but the arraylist provides a very useful Remove behaviour.\
    \ This is given a reference to the one to be removed:\n\n```\nstore.remove(robsAccount);\n\
    ```\n\nThis removes the first occurrence of the reference robAccount from the\
    \ store arraylist. If the store contained more than one reference robAccount then\
    \ each of them could be removed individually. Note that if the reference is not\
    \ in the arraylist (i.e. if I run the code above store did not contain robAccount)\
    \ this does cause an error. If you remove an item the size of the arraylist is\
    \ decreased.\n\n# Finding the size of an ArrayList\n\nYou can use the property\
    \ Count to find how many items are there in the list:\n\n```\nif (store.Count\
    \ == 0)\n{\n    Console.WriteLine(\"The bank is empty\");\n}\n```"
