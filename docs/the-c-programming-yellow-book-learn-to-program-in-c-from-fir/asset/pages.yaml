  md: "# Checking to see if an ArrayList contains an item\n\nThe final trick I'm going\
    \ to mention (but there are lots more things an arraylist can do for you) is the\
    \ Contains method. This is simply a quick way of finding out whether or an arraylist\
    \ contains a particular reference.\n\n```\nif (a.Contains(obsAccount))\n{\n  \
    \  Console.WriteLine(\"Rob is in the bank\");\n}\n```\n\nThe Contains method is\
    \ given a reference to an object and return true if the arraylist contains that\
    \ reference. You could curse this behaviour, but having it built into the class\
    \ makes it much easier.\n\n# ArrayLists and Arrays\n\nArrayLists and arrays look\
    \ a lot like. They both store a large number of items and you can use subscripts\
    \ (values in square brackets) to get hold of elements from either. They also throw\
    \ exceptions if you access elements that are not in the array. If you use arraylist\
    \ in place of arrays and have the benefits of storage that grows and shrinks as\
    \ you need it, the only problem that you have is that an arraylist will hold references\
    \ to objects, not any particular class. However, this can be fixed when you move\
    \ over to the list class.\n\n# 5.1.2 The List class\n\nThe List gives you everything\
    \ that an arraylist gives, with the advantage that it is also type. It is newer\
    \ than the ArrayList class, based on the generic features provided by a more recent\
    \ version of the C language. To understand how it works you understand a bit of\
    \ generics.\n\n# Generics and Behaviours\n\nIf you think about it, the fundamental\
    \ behaviours of arrays are always the same. Whether you have an int, float or\
    \ Account the array that job does is exactly the same. It has a bunch of things\
    \ in one place, and provides you with many means to work with them. The ArrayList\
    \ array gives you that an array of integers is exactly the same as those you have\
    \ with an array of Accounts. Because each array is declared as holding values\
    \ of a particular type, C# can make sure that any array always holds the appropriate\
    \ type of values. The way that the system works, there is just no way that you\
    \ can take any reference and place it in an array of integers. This is all to\
    \ the good, but the ArrayList breaks things a bit.\n\nThe ArrayList was added\
    \ afterwards, and because it is not quite as much a part of the language as an\
    \ array, it has to use a compromise to hold references to objects in any item\
    \ of them. This does this by using generics, but then there is nothing to stop\
    \ references of any kind being added to an arraylist.\n\nIf you me an array of\
    \ Accounts I can be sure that everything in the array is an account. However,\
    \ if you give me an ArrayList there is no way I can be sure that accounts are\
    \ all correct. It could contain a bunch of KitchenSink references for all I know.\
    \ And I only really find out when I start to process elements as Accounts and\
    \ my programs start to grow.\n\nOne way to solve this problem would be to find\
    \ a way of making the ArrayList strongly typed, so that it becomes as much a part\
    \ of C# as the array is. However, that is not what the designers of C# did. Instead\
    \ they introduced a new language feature, generics.\n\nGenerics let me write code\
    \ that deals with objects \"things of a particular type\". It doesn't matter what\
    \ the thing I'm dealing with, we can sort out that when we want to work with something."
