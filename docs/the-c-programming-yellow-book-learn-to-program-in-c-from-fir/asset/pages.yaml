  md: "# Simple Data Processing\n\n# Writing a Program\n\nWriting a loop in this way\
    \ is quicker and simpler than using a form of while because it keeps all the elements\
    \ of the loop in one place instead of leaving them spread about the program. This\
    \ means that you are less likely to forget to do something like the control variable\
    \ an initial value, or update it.\n\nIf you are so stupid as worry about the value\
    \ of the control variable in the loop you can expect your program to stupid things,\
    \ i.e. if you put i back to 0 within the loop it will forever.\n\n# Programmer's\
    \ Point: Don't be clever/stupid\n\nSome people like to show how clever they are\
    \ by doing things with the setup, condition and update statements, can do things\
    \ other than simple assignment, increment and test. Some programmers think they\
    \ are very clever if they can do the work \"inside\" for the part at the top and\
    \ have an empty statement after it.\n\nI call these the \"stupid people\". There\
    \ is rarely need for so convoluted code. When you are writing the two things which\
    \ you should be worrying about \"How do I do this works\" and \"How is easy to\
    \ understand? Complicated code does not help you of these things.\n\n# Breaking\
    \ Out Of Loops\n\nSometimes you may want to escape from a loop while you are in\
    \ the middle of it, i.c. your program may decide there is no need or point to\
    \ go and wishes to loop out of the loop and continue the statement after it.\n\
    \nYou can do this with the break statement. This is a command to leave the loop\
    \ immediately. Your program would normally use some form of decision to quit in\
    \ this way. I find it useful so that I provide a \"get out of here\" option in\
    \ the middle of something, for example in the following program snippet the variable\
    \ aborted, runningOK normally true, becomes false when it is time to finish normally\n\
    \n```\nwhile (runningOK)\n{\n    complex stuff\n    if (aborted)\n{\n        break\
    \ ;\n    }\n    more complex stuff\n    ...\n}\nbit we get to if aborted becomes\
    \ true\n```\n\nNote that we are using two variables as switches, they do not hold\
    \ values as such; they are actually used to represent states within the program\
    \ as it runs. This is a standard programming trick that you will find very useful.\n\
    \nYou can break out of any of the three kinds of loop. In every case the program\
    \ continues running at the statement after the last statement of the loop."
