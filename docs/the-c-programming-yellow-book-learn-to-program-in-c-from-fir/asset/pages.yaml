  md: "# Creating Solutions\n\n# The Construction of Objects\n\nThis poses a problem.\
    \ It looks as if we can veto values at every point except the one which is most\
    \ important, i.e. when the object is created.\n\n# Programmer's Point: Managing\
    \ Failure is Hard Work\n\nThis brings us on to a kind of recurring theme in our\
    \ quest to become great programmers. Writing code to do a job is usually very\
    \ easy. Writing code which will handle all the possible failure conditions in\
    \ a useful way is trickier. It is a fact of programming life that you will (or\
    \ at least) spend more time worrying about how things fail than you ever do about\
    \ how they work correctly.\n\n# Constructors and Exceptions\n\nThe only way around\
    \ this is to have the constructor throw an exception if it is unhappy. This means\
    \ that the user of the constructor must make sure that it catches exceptions when\
    \ creating objects, which is not a bad thing. The clever way to do this is to\
    \ make the constructor call the set methods for each of the properties that it\
    \ has given, and if any of them returns with an error the constructor should throw\
    \ the exception at Point:\n\n```\npublic Account (string inName, string inAddress)\n\
    {\n    if (SetName (inName) == false) {\n        throw new Exception (\"Bad name\
    \ \" + inName);\n    }\n    if (SetAddress (inAddress) == false) {\n        throw\
    \ new Exception (\"Bad address \" + inAddress);\n    }\n}\n```\n\nIf we try to\
    \ create an account with a bad name it will throw an exception, which is what\
    \ we want. The only problem here is that if the address is wrong too, the user\
    \ of the method will not know this until they have fixed the name and then called\
    \ the constructor again.\n\nI hate it when I'm using a program and this happens.\
    \ It is normally when I'm filling in a form on the web. I type in my name wrong\
    \ and it complains about that. Then I put my name right, and it complains about\
    \ my address. What I want is a way in which get a report of all the invalid parts\
    \ of the item at once. This can be done, at the expense of a little bit of complication."
