    using System;\n```\n\n```\nclass WhileLoopInsteadOfFor\n{\n    public static void\
    \ Main ()\n{\n        int i ;\n        i = 1;\n        while (i < 11 )\n     \
    \   {\n            Console.WriteLine ( \"Hello mum\" );\n            i = i + 1;\n\
    \        }\n    }\n}\n```\n\nCode Sample 06 While loop instead of For\n\nThis\
    \ useless program prints hello 10 times. It does this by using a variable to control\
    \ the loop. The variable is an initial value (1) and then tested each time we\
    \ go around the loop. The control variable is increased for each pass through\
    \ the statements. Eventually it will reach 11, at which the loop terminates and\
    \ we program steps.\n\nC# provides a control allow you to set up a loop of this\
    \ form in all one:\n\n```\nfor ( setup ; finish test ; update )\n{\n    things\
    \ we want to do a given\n    number of times\n}\n```\n\nWe could use this to re-write\
    \ the above program as:\n\n```\nusing System;\nclass ForLoop\n{\n    public static\
    \ void Main ()\n{\n        int i;\n        for ( i = 1 ; i < 11 ; i = i + 1 )\n\
    \        {\n            Console.WriteLine ( \"Hello mum\" );\n        }\n    }\n\
    }\n```\n\nCode Sample 07 For loop\n\nThe setup puts a value into the control variable\
    \ which it will start. The test is a condition which must be true for the for\
    \ -- continue. The update is the statement which is performed to update the control\
    \ variable at the end of each loop. Note that the three elements are separated\
    \ by semicolons. The precise sequence of events is as follows:\n\n+   1. Put the\
    \ value into the control variable.\n2. Test to see if we have finished the loop\
    \ yet and exit to the statement after the loop if we have.\n3. Perform the statements\
    \ to be repeated.\n4. Perform the update.\n5. Repeat from step 2.\n\nThe variable\
    \ controls things is often called the control variable, and is usually given the\
    \ name i."
