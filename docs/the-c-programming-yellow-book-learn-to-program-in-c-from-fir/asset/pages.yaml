  md: "# Creating Programs\n\n# Exceptions and Errors\n\n```\ntry {\n    // Exceptions\
    \ at this level will be caught by the\n    // \"outer\" catch clause\n    try\
    \ {\n        // Exceptions at this level will be caught by the\n        // \"\
    inner\" catch clause\n    } catch (Exception inner) {\n        // This is the\
    \ \"inner\" catch clause\n    }\n    // Exceptions at this level will be caught\
    \ by the\n    // \"outer\" catch clause\n} catch (Exception outer) {\n    // This\
    \ is the \"outer\" catch clause\n}\n```\n\nThe above code shows how this works.\
    \ If code in the innermost block throws an exception, the run time system will\
    \ find the catch. However, once execution leaves inner block the catch is the\
    \ one which will be in the event of an exception being thrown.\n\n# Programmer's\
    \ Point: Don't Catch Everything\n\nBen calls this Pokémon syndrome: \"Gotta catch\
    \ all!\" Don't feel obliged to catch every exception that your code might throw.\
    \ If someone asks you your Load method to fetch a file that doesn't exist the\
    \ best thing you can do is a \"file not found\" exception, except try and handle\
    \ things by returning a null reference or empty item. Returning a placeholder\
    \ will just bigger problems later trying to use the empty item that was returned.\
    \ The faster you get a fail to manifest the easier it is to identify the cause.\n\
    \n# 3.4 Adding a Finally Clause\n\nSometimes there are things that your program\
    \ must do irrespective of whether or not an exception is thrown. These are things\
    \ like closing files, releasing resources and generally tying up. However, we\
    \ know that when an exception is thrown the statements in the catch clause are\
    \ called, and then the program returns to the type of program. The code in the\
    \ catch clause could return from the method it is running within or even an exception\
    \ itself. In these situations any code following after your catch construction\
    \ would not get the chance to run.\n\nFortunately C# provides a solution to this\
    \ problem by allowing you to add a finally clause to your try-catch construction.\
    \ Statements inside inside the finally clause will run irrespective of whether\
    \ or not the program in the try block throws an exception.\n\n```\ntry {\n   \
    \ // Code that might throw an exception\n} catch (Exception outer) {\n    // This\
    \ code catches the exception\n} finally {\n    // Code that is obeyed whether\
    \ an exception\n    // is thrown or not\n}\n```\n\nC# Programming © Rob Miles\
    \ 2016\n\n69"
