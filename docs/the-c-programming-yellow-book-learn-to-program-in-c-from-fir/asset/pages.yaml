  md: '# Proving it Works


    In a real world you would now create a test which will allow you to prove that
    the program works, you could for example say:


    > "If I give the above program the inputs 2 metres high and 1 metre wide the program
    should tell me I need 4 square metres of glass and 19.5 feet of wood."


    The test procedure which is designed for a proper project should test out all
    possible states within the program, In a large system person writing the program
    may have to create a test harness which is fitted around the program and will
    allow it to be tested. Both the customer and supplier should agree on the manner
    and type of the tests to be performed and sign a document describing these.


    Testing is a very important part of program development. There is one development
    technique where you write the tests before you write the actual program that does
    the job. This is actually a good idea, and we will explore it later. In terms
    of code production, you can expect to write more code to test your solution as
    in the solution itself. Remember when you are working out how much work is involved
    in a particular job.


    # Getting Paid


    At this point the customer knows if a system is created which will pass all the
    tests the customer will have no choice but pay for the work! Note that also the
    design and test procedures have been frozen, there is no ambiguity which will
    lead the customer requesting changes to the work although which this can still
