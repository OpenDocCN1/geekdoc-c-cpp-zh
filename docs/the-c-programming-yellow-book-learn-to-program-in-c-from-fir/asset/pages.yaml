  md: '# Sorting by moving objects around


    If we hold the accounts as an array of structure items we would have to do a lot
    of work just to keep the list in order. The bank may well want to order the information
    in more than one way too, for example they might want to order it on both customer
    surname and on account number. Without references this would be impossible. With
    references we just need to keep a number of arrays of references, each of which
    is ordered in a particular way:


    # Sorting by using references


    If we just sort the references we don''t have to move the large data items at
    all. New objects can be added without having to move any objects, instead the
    references can be moved around.


    # References and Data Structures


    Our list of sorted references is all very good, but if we want to add something
    to our sorted list we still have to move the references around. We can get over
    this, and also speed up searching, by structuring our data into a tree form.


    # Sorting by use of a tree


    In the tree above each node has two references; one can refer to a node which
    is ''lighter'', the other to a node which is ''darker''. If I want a sorted list
    of the items I just have to go as far down the ''lighter'' side as I can and I
    will end up at the lightest.'
