    \    t2.Start();\n    Console.WriteLine(\"Number of overdrafts:\" + overDraftCount);\n\
    }\n```\n\nThis is a long-winded way of starting multiple threads. if you decide\
    \ to do this in C# you will discover easier ways to do this. However, you will\
    \ be able to see that the program starts two threads running. One counts the overdrafts\
    \ for the first part of the array and the other counts the overdrafts in the second\
    \ part of the array. Both threads update the overDraftCount variable when they\
    \ find an overdraft.\n\nIn a machine with multiple processors it could be completing\
    \ the count much quickly because each thread can run on a different processor.\
    \ But that's the good news. Unfortunately the bad news is that it will also under-report\
    \ the number of overdrafts by a random amount. This is potentially disastrous\
    \ for our bank.\n\nThe reason is that the two threads will \"fight\" over the\
    \ single overDraftCount variable. Consider the following sequence of actions:\n\
    \n+   1. Thread discovers an overdraft account and fetches the value of overDraftCount\
    \ variable so that it can add 1 to it.\n2. Before the addition can be performed,\
    \ Thread 1 is started and Thread 2 is allowed to run.\n3. Thread 2 also discovers\
    \ an overdraft, fetches the value of overDraftCount, adds 1 to it and stores it\
    \ in memory.\n4. Later Thread 1 gets control again, adds 1 to the value it fetched\
    \ before it was interrupted and stores the result back in memory.\n\nBecause of\
    \ the way that Thread 1 was interrupted during its calculation, it has overwritten\
    \ the changes that Thread 2 made. A count increment has been lost.\n\nRemember\
    \ that a program has no control over when threads in it will get control. The\
