  md: "# Creating Programs\n\n# Variables and Scope\n\n```\n{\n  int i;\n}\n{\n  int\
    \ i;\n  int j;\n}\n```\n\nThe first incarnation of i has been destroyed before\
    \ the second, so this code is OK.\n\n# For loop local variables\n\nA special kind\
    \ of variable can be used when you create a for loop construction. This allows\
    \ you to declare a control variable which exists for the duration of the loop\
    \ itself.\n\n```\nfor (int i = 0 ; i < 10 ; i = i + 1) {\n  Console.WriteLine(\"\
    Hello\");\n}\n```\n\nThe variable i is declared and initialized at the start of\
    \ the for loop and only exists for the duration of the block itself.\n\n# 3.2.3\
    \ Data Member in classes\n\nLocal variables are all very well, but they disappear\
    \ when the program execution leaves the block where they are declared. We often\
    \ need to have variables that exist outside the methods in a class.\n\n# Variables\
    \ to a Method\n\nConsider the following code:\n\n```\nclass LocalExample {\n \
    \ static void OtherMethod () {\n    local = 99; // this will not compile\n  }\n\
    \  static void Main () {\n    int local = 0;\n    Console.WriteLine(\"local is:\
    \ \" + local);\n  }\n}\n```\n\nCode Sample 14 Non-compiling local variable\n\n\
    The variable local is declared and used within the Main method, and can't be used\
    \ anywhere else. If a statement in OtherMethod tries to use local variable the\
    \ program will fail to compile.\n\n# Variables which are Data Members of a Class\n\
    \nIf I want to allow two methods in a class to share a variable I will have to\
    \ make it a member of the class. This means declaring it outside the methods in\
    \ the class.\n\n```\nclass MemberExample {\n  // the variable member is part of\
    \ the class\n  static int member = 0;\n}\n```"
