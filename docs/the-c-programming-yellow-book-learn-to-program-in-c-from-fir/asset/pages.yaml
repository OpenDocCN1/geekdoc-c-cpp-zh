  md: '# Creating Programs


    # Using Files


    ![](img/d50be9be3b33c7dfe37bae51200a38c3_78_0.png)


    A C# program can contain an object representing a particular stream that has created
    and connected to the file. The program performs operations on the file by calling
    methods on the stream object to tell it what to do.


    C# has a range of different stream types which you use depending on what you want
    to do. All of the streams are in exactly the same way. In fact you are already
    familiar with how streams are used, see the Console class, which connects a C#
    program to the user, implemented as a stream. The ReadLine and StreamWriter methods
    are commands to any stream that will ask it to read and write data.


    We are going to consider two streams which let programs use files; these are the
    StreamWriter and StreamReader types.


    # 3.6.2 Creating an Output Stream


    You create a stream object just like you would create any one, by using new. When
    the stream is created it can be passed the name of the file that is to be opened.


    ```

    StreamWriter writer;

    writer = new StreamWriter("test.txt");

    ```


    The writer will be made to refer to the stream you want to write into. When the
    new StreamWriter is created the program will open a file called test.txt for output
    and connect to the stream. If this process fails for any reason, perhaps your
    operating system is not able/allowed to write the file or the name is invalid,
    the action will fail with an appropriate exception.


    Note that this code does not have a problem if the file test.txt already exists.
    All that happens is a brand new, empty file is created in place of what was there.
    This is potentially dangerous It means you could use the two statements above
    to completely destroy the contents of an existing file, which would be bad. Most
    useful programs ask the user whether or not an existing file should be overwritten,
    you will find out how to do this.


    # 3.6.3 Writing to a Stream


    Once the stream has been created it is by calling the stream methods it provides.


    ```

    writer.WriteLine("hello world");

    ```


    The above statement calls the WriteLine method on the stream to write the text
    "hello world" into the file test.txt. This is exactly the same technique that
    is used to write information to the console for the user to read. In fact you
    can use all the writing features including those we explored in the next section
    printing your output.


    Each time you write a line to the file it is added to the end of the lines that
    have already been written. If your program got stuck in an infinite loop it is
    possible that it might fill up the storage device. If this happens, the write
    cannot be performed successfully, the call of WriteLine will throw an exception.
    A properly written program should probably make sure that any exceptions like
    this (they can also be thrown when you open a file) are caught and handled correctly.'
