  md: "# 5.5 Structured Error Handling\n\nBy now I hope that you are starting to think\
    \ very hard how programs fail. You should also be thinking when you build a system\
    \ you consider how you are going to manage the way that it will fail. This is\
    \ actually a very important part of the design process. When something bad happens\
    \ the program must deal with this in a managed way. The key to achieving this\
    \ is to think about making your own exceptions for your system.\n\nWe have been\
    \ on the receiving end of exceptions lately. We have seen that something bad happens\
    \ while a file is being read, or a Parse method is given an invalid string, the\
    \ system will throw an exception to indicate that it is unhappy. This means that\
    \ badly behaved code like this needs to be caught so that our program can respond\
    \ responsibly. We are now going to take a closer look at exceptions and see creating\
    \ our own exception types.\n\n# 5.5.1 The Exception class\n\nThe C System namespace\
    \ holds a large number of different exceptions, but they are all based on the\
    \ Exception class. You are strongly advised to create your own exception type\
    \ which extends the system. You can create System.Exception when something goes\
    \ wrong, but this means that exceptions produced by your code will get mixed up\
    \ with other parts of the system. If you want your code to be able to handle your\
    \ errors the best way is to create one or more of your own exceptions.\n\nThis\
    \ means that, with everything else in your system, you will need to design how\
    \ your program will handle and generate errors. This all (of course) leads back\
    \ to the metadata that you have gathered, in the specification will give you information\
    \ about how things can fail and the way that the errors are produced.\n\n# 5.5.2\
    \ Creating your exception type\n\nCreating your exception type is very easy. It\
    \ can be done by simply extending the System.Exception class:\n\n```\npublic class\
    \ BankException : System.Exception\n{}\n```\n\nThis works because System.Exception\
    \ class has a default constructor which takes no parameters. The default constructor\
    \ in BankException (which is added automatically by the compiler) can just use\
    \ this to make an Exception instance.\n\nHowever, there is a version of the Exception\
    \ constructor which lets us add a message to the exception. This can be picked\
    \ up and used to discover what went wrong. To create a standard exception with\
    \ a message I pass the constructor a string. If I want to use this with a message\
    \ that has a newline I sort out the constructor chaining for my exception class\
    \ and write code as follows:\n\n```\npublic class BankException : System.Exception\n\
    {\n    public BankException (string message) =\n        base (message)\n    }\n\
    }\n```\n\nThis makes use of the base keyword to call the constructor of the parent\
    \ class and pass it the string message."
