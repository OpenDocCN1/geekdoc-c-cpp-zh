    # A First C# Program


    # ()


    This is a pair of brackets enclosing nothing. This may sound weird, but actually
    tells the compiler that the method Main has no parameters. A parameter to method
    gives the method to work on. When you define a method you can call C# that it
    works on one or more things, for example sIn(x) could work on a floating point
    value of angle x. We will cover methods in great detail later in this document.


    # {


    As the name implies, braces come in packs of two, for every one brace there must
    be a matching close. Braces allow programmers to lump pieces of program together.
    Such a lump of program is often called a block. A block can contain the declaration
    of variables used within it, followed by a sequence of program statements which
    are executed in order. In this case the braces enclose the parts of the method
    Main.


    When the compiler sees the matching close brace at the end it knows it has reached
    the end of the method and can look for another (if any). The effects of an unpaired
    brace are invariably fatal....


    # double


    By now you feel that you need a double. But that is not what double means in this
    context. What it means is "double precision floating point number"


    Our program needs to remember certain values as it runs. Notably it will be in
    values for the width and height of the windows and then calculate and print values
    for the glass area and width length. C# defines where these values are variables.
    At the beginning of any block, you can reserve space to hold some data values.
    Each item can hold a particular kind of value. Essentially, C# can handle three
    types of data, floating point numbers, integer numbers and text (i.e. letters,
    digits and punctuation). The process of creating a value is called the variable.


    A double can hold a very wide range of values to a very precision.


    You declare some names of a particular variable by giving the type of the data,
    followed by a list of the names you want the variables to have. We are using the
    double for now. Later we will use other types.


    # width, height, woodlength, glassArea


    This is a list of items in C# is separated by , (comma) commas in this case it
    is a list of variable names. Once the compiler sees the word double (see above)
    it is expecting to find the name of at least one variable to be created. The compiler
    works its way, creating blocks which can hold values of type double and giving
    them the appropriate names. From this point we can refer to the names, and compiler
    will know that we are using particular variable.


    # Programmer''s Point: Where your data comes from


    In fact, the limitations in the accuracy to which people can read tape measures,
    and the fact that we are not going to make windows as wide as the universe, a
    double precision floating point number is overkill for this application. You would
    instead ask the customer if it is OK to just express the dimensions inimetres
    instead. We will look at the considerations driving the particular variable types
    a bit later. All decisions are driven by the metadata (data about) that you gather
    when you are finding out about the system you are creating.'
