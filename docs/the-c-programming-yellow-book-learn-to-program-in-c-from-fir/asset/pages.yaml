  md: "# Programmer's Point: Block Copy is Evil\n\nI still make mistakes when I write\
    \ programs. You might think that after a huge number of years in the job I get\
    \ everything right every time. Wrong. A lot of the mistakes I make are caused\
    \ by improper use of block copy. I write some code and find that I need something\
    \ similar, not exactly the same, in another part of the program. So I copy it.\
    \ Then I copy most, but not all, of the new and find that my program does not\
    \ work properly.\n\nTry not to do this. A great programmer writes every piece\
    \ of code once, and only once. If you need to use it in more one place, make it\
    \ a method.\n\nWhat we really want to do is pick up all the benefits in the CustomerAccount\
    \ and then just change the method that behaves differently. It turns out that\
    \ we can do this in C# using inheritance. When I create the BabyAccount class\
    \ I can tell the compiler that it is based on the CustomerAccount one:\n\n```\n\
    public class BabyAccount : CustomerAccount, IAccount\n{\n}\n```\n\nThe key here\
    \ is the highlighted part after the class. I have put the name of the class that\
    \ BabyAccount is extending. This means that everything that CustomerAccount can\
    \ do, BabyAccount can do.\n\nI can write code here:\n\n```\nBabyAccount b = new\
    \ BabyAccount();\nnb.PayFunds(50);\n```\n\nThis works, although BabyAccount does\
    \ not have a PayFunds method, the parent class does. This means that the PayFunds\
    \ method of the CustomerAccount class is used at this point.\n\nSo, instances\
    \ of the BabyAccount have abilities which they pick up from their parent class.\
    \ In fact, at the moment, the BabyAccount has no behaviours of own; it gets everything\
    \ from its parent.\n\n# 4.9.2 Overriding methods\n\nWe now know that we can make\
    \ a new class based on an existing one. The next thing we need to be able to is\
    \ change the behaviour of the method that we are interested in. We want to replace\
    \ the WithdrawFunds method with a new one. Now, in the BabyAccount class I can\
    \ do it like this:\n\n```\npublic class BabyAccount : CustomerAccount, IAccount\n\
    {\n    override bool WithdrawFunds (decimal amount)\n    {\n        if (amount\
    \ > 10)\n        {\n            return false;\n        }\n        if (balance\
    \ < amount)\n        {\n            return false;\n        }\n        balance\
    \ = balance - amount;\n        return true;\n    }\n}\n```\n\nThe keyword override\
    \ means \"use this version of the method in preference to the one in the 'parent\"\
    . This means that code like:\n\n```\nBabyAccount b = new BabyAccount();\nb.PayFunds(50);\n\
    b.WithdrawFunds(55);\n```\n\nC# Programming by Rob Miles 2016\n\n117"
