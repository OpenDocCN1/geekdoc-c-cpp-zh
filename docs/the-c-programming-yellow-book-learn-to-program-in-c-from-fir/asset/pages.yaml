    is the number of days since 1st Jan. Three different, overloaded, methods could
    be provided to set the date, each with the same name. In that case the SetDate
    method could be said to have been overloaded.


    # Override


    Sometimes you want to make a more specialized version of an existing class. This
    class may entail providing updated versions of methods in the class. You can do
    this by creating a child class which extends the parent and then overriding the
    methods, which need to be changed. When the method is called on instances of the
    child class, the new method is called, not the overridden one in the parent. You
    can use the base keyword to get access to the overridden method if you need to.


    # Portable


    When applied to computer software, the more portable something is the easier it
    is to move it onto a different type of computer. Computers contain different kinds
    of processors and operating systems which can run programs specifically written
    for them. A portable application is one which can be transferred to a new processor
    or operating system with relative ease. High Level languages tend to be portable,
    machine code is much harder to handle.


    # Private


    A private member of a class is only visible to code in methods inside that class.
    It is conventional to make data members of a class private so that they cannot
    be changed by code outside the class. The programmer can then **provide methods
    or C# properties to manage the values** which may be assigned to the private members.
    **The only reason for not** making a data member private is to remove the performance
    hit of using a method to access the data.


    # Property


    A property is an item of data which is held in an object. An example of a BankAccount
    class would be the balance of the account. Another holder The C# language has
    a special construction to make the management of properties easy for programmers.


    # Protected


    A protected member of a class is visible to methods in the class and in methods
    in classes which extend this class. It is kind of a half way between private (no
    access to methods outside this class) and public (everyone has access). It lets
    you designate members in parent classes as being visible in the child classes.


    # Public


    A public member of a class is visible to methods outside the class. It is conventional
    to make the method members of a class public so that they can be used by code
    in other classes. A public method is how a class provides services to other classes.


    # Reference


    A reference is a bit like a tag which can be attached to an instance of a class.
    The reference has a particular name. C# uses a reference to find its way to the'
