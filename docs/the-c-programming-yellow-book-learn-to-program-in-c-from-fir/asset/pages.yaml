  md: "# Creating Programs\n\n```\nstatic void OtherMethod() {\n    member = 99;\n\
    }\n\nstatic void Main() {\n    Console.WriteLine(\"member is : \" + member);\n\
    \    OtherMethod();\n    Console.WriteLine(\"member is now : \" + member);\n}\n\
    ```\n\n# Code Sample 15 Using a member variable\n\nThe variable member is now\
    \ part of the class MemberExample, and the Main method and OtherMethod can use\
    \ this variable. The program would print out:\n\nmember is : 0\nmember is now\
    \ : 99\n\nThis is because the call to OtherMethod would change the value of member\
    \ to 99 when it runs.\n\nClass variables are very useful if you want to have a\
    \ number of methods \"sharing\" a set of data. For example, if you were creating\
    \ a program to play chess it would be wise to make the variable that stores the\
    \ board a member of the class. Then the methods that read the player's move, display\
    \ the board, and calculate the computer could use the same board information.\n\
    \nNote that I have the data member of class static, so that it is part of the\
    \ class and not an instance of it. This is nothing to worry about now; we will\
    \ investigate the meaning of static later. Now you just have to remember to put\
    \ in the static keyword, otherwise your program will not compile.\n\nOne common\
    \ programming mistake is to make every variable static. Marking a variable as\
    \ const means \"the value cannot be changed\". Marking a variable with static\
    \ means \"the variable is part of the class and is always present\". If it helps\
    \ you to think of static as something which is like us, with the background noise\
    \ on your radio when you tune it off. Alternatively you can think of it as a stationary,\
    \ and not going anywhere.\n\n# Programmer's Point: Plan your variable use\n\n\
    You should plan your use of variables in your programs. You decide which variables\
    \ are only required for local blocks and should be members of the class. Bear\
    \ in mind that if you make a variable member of the class it can be used by any\
    \ method (which increases the chances of bad happening to it). I only need to\
    \ keep track of the number of member variables in a class to the minimum possible\
    \ and use local variables if I only need to store for a small part of the code.\n\
    \n# 3.3 Arrays\n\nWe now know how to create programs that can read in values,\
