  md: '# Simple Data Processing


    # Manipulating Data


    # 2.2 Manipulating Data


    In this section we are going to take a look at how we programs manipulate data,
    how values can be stored, retrieved and generally fiddled. This provides us with
    the ability to perform the data processing of programs.


    # 2.2.1 Variables and Data


    In the glazing看来 we decided to hold the width and the height of the windows that
    we are working on in variables that we described. Before we go much further in
    our programming career we need to consider what this means, and what other types
    of data we can store in programs that we write.


    Oper on data. A programming language must give you a way of storing the data you
    are processing, otherwise it is useless. The actual data actually means something
    that you as a programmer decide (see the above digression on data).


    A variable is a named location where you can store something. You choose a box
    of particular size with a name to reflect what is going to be stored there (we
    used names like wordLength in the above program). You also need to choose the
    type of the variable (particular size and shape of box) from the range of storage
    types that C# provides. The type of the variable is part of the metadata about
    that variable.


    Programs also contain literal values. A literal value is just a value in your
    program which you use for some purpose. For each type of variable the C# language
    has a way in which literal values of type are expressed.


    # 2.2.2 Storing Numbers


    When considering numeric values there are two kinds of data:


    +   - Nice chunky individual values, for the example of a sheep in a field, tech
    on a cog, apples in a basket. These are referred to as integers.

    - Nasty real world types, for example the current temperature, the length of a
    piece of string, the speed of a car. These are referred to as reals.


    In the first case we can hold the value exactly; you always have an number of
    items, they are integral.


    In the second case we cannot hold the value exactly; we are looking at exactly.
    Even if you use a measure of string to 100 decimal places it is still not going
    to give you your exact length - you only get the value more accurately. These
    are real. A computer it operates on expressions of bits which can be regarded
    as numbers. We know that it works in terms of ones and off it has problems holding
    real values. To handle real values the computer actually stores them as limited
    quantity, which we hope is adequate (and usually is).


    This means that we want to store something we have tell the computer whether it
    is an integer or a real. We also need to consider the range of possible values
    that we need to hold to store the data.


    You tell about a variable you want to create by declaring it. The declaration
    identifies the type of the thing you want to store. Think of this as C# creating
    a box of a particular size, specifically designed to hold items of the given type.
    The box is tagged with metadata (there is that word again) so that the system
    knows what can be put into it and how that can be used.


    When you are writing a specification you worry about the precision to which values
    are to be. Too much accuracy may slow the machine - too little may result in the
    wrong values used.


    C# Programming © Rob Miles 2016


