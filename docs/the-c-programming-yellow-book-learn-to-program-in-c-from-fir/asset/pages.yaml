  md: '# Simple Data Processing


    # Writing a Program


    # 2.3.5 Neater Printing


    Note that the way that a number is printed does not affect how it is stored by
    the program, it just tells the printing method how it is supposed to be.


    If you run any of the programs you will have discovered that the way in which
    numbers are printed leaves much to be desired. Integers seem to come out, floating
    point numbers seem to have a mind of their own. To get around C# provides a slightly
    different way in which numbers can be printed. This provides flexibility, and
    is also somewhat easier to use if you are printing a large number of values.


    # Using Placeholders in Print Strings


    A placeholder marks the place where the value is to be printed. Consider:


    ```

    int i = 150;

    double f = 1234.56789;

    Console.WriteLine("i: {0} f:{1}", i, f);

    Console.WriteLine("i: {1} f:{0}", i, f);

    i: 150 f: 1234.56789;

    ```


    This would print out:


    ```

    i: 150 f: 1234.56789;

    ```


    The (n) part of the string says "parameter n, counting from 0". In the second
    write statement I have swapped the order of the numbers, but since I''ve swapped
    the order of the parameters the output is the same.


    If I do something, for example use (99) to get the 99th parameter, theWriteLine
    method will fail with an error. This error will **not** be picked up by the compiler
    however, the program will fail when it runs.


    # Adjusting real number precision


    Placeholders have formatting information added to them:


    ```

    int i = 150;

    double f = 1234.56789;

    Console.WriteLine("i: {0:f} f:{1:0.0}", i, f);

    ```


    This would print out:


    ```

    i:150 f: 1234.6

    ```


    The 0 characters stand for one or more digits. When placed after a decimal point
    they can be used to control the number of decimal places which are used to express
    a value. Note that if the number is an integer it is printed out as **12.00**.


    # Specifying the number of printed digits


    I can specify a number of digits by putting in a given number of zeros:


    ```

    int i = 150;

    double f = 1234.56789;

    Console.WriteLine("i: {0:00000} f:{1:000000}", i, f);

    ```


    This would print out:


    ```

    i: 00150 f: 0123457

    ```


    Note that if I do this getting zeros printed, which is useful if you are printing
    things like cheques.


    # Really Fancy Formatting


    If you want really fancy levels of control you can use the # character. A # in
    the format strings "put a digit here if you have one":


    ```

    int i = 150;

    double f = 1234.56789;

    Console.WriteLine("i: {0:####} f:{1:#.##.00}", i, f);

    ```


    C# Programming by Rob Miles 2016


