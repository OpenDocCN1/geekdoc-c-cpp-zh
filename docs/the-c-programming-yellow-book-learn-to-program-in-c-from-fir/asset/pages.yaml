  md: '# Advanced Programming


    # Debugging


    # Programmer''s Point: Customers really care about the user interface


    If there is part of the system which the customer is guaranteed to have strong
    opinions about it is the user interface. The design of this should start at the
    very beginning of the product and be refined as it goes. Never, ever assume you
    know that the user interface should work in a particular way. I have to spend
    more time working user interface code just than any other part of the system.
    The good news is that with Visual Studio it is very easy to create realistic looking
    prototypes the front end of a system. These can then be shown to the customer
    (get them signed off) to establish that you are doing the right thing.


    # 5.8 Debugging


    Some people are born to debug. Not everyone is good at debugging, some will always
    be better than others. Having said that there are techniques which you can use
    to ease the process, and we are going to explore some of these. The good news
    is if you use a test drive approach to your development the number of faults are
    found by the users should be as small as possible, but will still be some things
    that need to be fixed.


    Incidentally, the reason why problems with faults are called bugs is that the
    original was caused by an actual insect which got stuck in the computer, causing
    it to fail. It is not however most faults are caused. It is very rare that you
    will fail your program because the hardware is faulty. I''ve been programming
    for many years and only seen this in a handful of occasions. The sad thing is
    that most of the bugs have been put there by programmers. In other words, debugging
    is working hard to find out how stupid you were in the first place.


    # 5.8.1 Fault Reporting


    We have already seen that a fault is something the user sees as a result of error
    in your program.


    Faults are uncovered by the testing process or by users. If a program fails as
    a part of test, the steps to manifest it will be well recorded. However, if a
    user reports a fault the evidence may be anecdotal, you will not be supplied with
    a sequence of steps which cause the fault to appear, you will simply be told "There''s
    a bug in the print."


    There is a strong argument for informing a fault report if you have not been given
    a sequence of steps to follow to make it happen. This approach will not work well
    with your users. It is important to stress to users that any fault report will
    only be taken seriously if it is documented.


    # Programmer''s Point: Design Your Fault Reporting


    Like just everything else I''ve ever mentioned, in which you manage your fault
    reports should be considered at the start of the project. In other words, you
    set up a process to deal with faults that are reported. In a large scale development
    fault reports are managed, assigned to programmers and tracked very carefully.
    The number of faults are reported, and the time to deal with them, is valuable
    information about the quality of the thing that you are making. Also, if you formalize
    (or even automate) the fault reporting process you can ensure that you get the
    maximum information about the problem.


    # The two types of Fault


    Faults split into two kinds, which always happen and those which sometimes happen.


    Faults which always happen are easy, you can perform the sequence which always
    causes the bug to manifest itself and use suitable techniques to find it (later).


    C# Programming © Rob Miles 2016


    195'
