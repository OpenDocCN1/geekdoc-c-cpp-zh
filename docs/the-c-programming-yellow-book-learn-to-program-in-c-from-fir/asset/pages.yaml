  md: '# Simple Data Processing


    # Writing a Program


    +   - It should be clear who wrote it, and when it was changed. If you wrote something
    good you should put your name on it. If you change what you wrote should add information
    about the changes you made and why.


    A big part of a well written program is the comments that the programmer puts.
    A program without comments is a bit like aeroplane which has an autopilot but
    no. There is a chance that it might take you to the right place, but it will be
    very hard to tell where it is going from the inside.


    # Block Comments


    When the C# compiler sees the /** sequence which means the start of a comment
    and you says to it:


    > > "Here is a piece of information for greater minds than mine to ponder. I will
    ignore everything until I see a /*which closes the comment."


    As an example:


    ```

    /* This program works glass and wood required for a double glazing salesman. */

    ```


    Be generous with your comments. They help to make your program much easier to
    understand. You will be surprised to find how quickly you forget how your program
    work. You can also use comments to keep people informed of the particular version
    of the program, when it was last modified and why, and the name of the programmer
    who wrote it - even if it was you.


    If are using an editor that supports syntax highlighting then you will find comments
    all displayed in grey.


    # Line Comments


    Another form of comment use of the // sequence. This marks the start of a comment
    which extends to the end of that particular line of code. It is useful for putting
    a quick note on the end of a statement:


    ```

    position = position + 1 ; // move on the next customer

    ```


    Ive annotated the statement to give the reader extra information about what it
    actually does.


    # Programmer''s Point: Don''t add much detail


    Writing comments is a very sensible thing to do. But not go mad. Remember that
    the person who is reading your program can be expected to know the C# language
    and doesn''t need them explained to in too much detail:


    ```

    goatCount = goatCount + 1 ; // add line to goatCount

    ```


    This is plain explaining to the reader reckon. If you use sensible identifiers
    you should find that your program express most of what it does directly from the
    code itself.


    # 2.3.2 Controlling Program Flow


    Our first double glazing program is very simple, it runs straight through the
    first statement to the last, and then stops. Often you will be across situations
    where your program must change what it does according to the data which is given
    to it. Basically there are three types of program flow:


    +   1. straight line

    2. chosen depending on a given condition

    3. repeated according to a given condition'
