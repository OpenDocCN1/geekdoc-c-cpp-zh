  md: "# Creating Solutions\n\n# Inheritance\n\nThe call of PayFunds will use the\
    \ method in the parent (that has not been overridden) and the call of WithdrawFunds\
    \ will use the method in BabyAccount.\n\n# Virtual Methods\n\nActually, there\
    \ is one other thing that we need to do in order for the overriding to work. The\
    \ C# compiler needs to know if a method is going to be overridden. This is because\
    \ it must call an overridden method in a slightly different way than a \"normal\"\
    \ one. In other words, the above code would not compile properly because the compiler\
    \ has not told that WithdrawFunds might be overridden in classes that are children\
    \ of the parent class.\n\nTo make the overriding work I have to change my declaration\
    \ of the method in the CustomerAccount class.\n\n```\npublic class CustomerAccount\
    \ : IAccount\n{\n    private decimal balance = 0;\n\n    public virtual bool WithdrawFunds\
    \ (decimal amount)\n{\n        if (balance < amount)\n        {\n            return\
    \ false;\n        }\n        balance = balance - amount;\n        return true;\n\
    \    }\n}\n```\n\nThe keyword virtual means \"I want to make another version of\
    \ this method in a child class\". You don't have to override it, but if you don't\
    \ have the word present, you definitely can't.\n\nThis makes override and virtual\
    \ a kind of matched pair. You use virtual to mark a method as able to be overridden\
    \ and override to actually provide a replacement for the method.\n\n# Protection\
    \ of data in class hierarchies\n\nIt turns out that the code above won't work.\
    \ This is because the value in the CustomerAccount class is private. We carefully\
    \ made it private so that methods in other classes can't get hold of the value\
    \ and change it.\n\nHowever, this is strict, in that it stops the BabyAccount\
    \ class from being able to change the value. To solve this problem C# provides\
    \ a slightly restrictive access level called protected. This makes the method\
    \ visible to classes which extend the parent. In other words, the methods in the\
    \ BabyAccount class can see and use the protected member because they are in the\
    \ same class hierarchy as the class containing the member.\n\nA hierarchy is bit\
    \ like a family tree. Every class has a parent and can do all the things that\
    \ the parent can. It also has access to all the protected members of the classes\
    \ above it.\n\n```\npublic class CustomerAccount : IAccount\n{\n    protected\
    \ decimal balance = 0;\n\n    }\n```\n\nI'm not terribly happy about doing this,\
    \ the balance is very important to me and I'd rather that nobody notices the CustomerAccount\
    \ class could see it. However, for\n\nC# Programming © Rob Miles 2016\n\n118"
