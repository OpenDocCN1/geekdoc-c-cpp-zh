  md: '# Creating Solutions


    Delegates are useful because they let us manipulate references to methods. We
    can manage which particular method is going to be called in a given situation
    in terms of a lump of data which we can move around.


    Delegates are an important part of how events are managed in a C# project. Events
    are things that happen our program may need to respond to. They include people
    buttoning in our user interface, clocks ticking and messages arriving via the
    network. In each case we need to tell the system what to do when the event occurs.
    The way that C# does this is by allowing us to create instances of delegate classes
    which we give the event operations. When the event occurs (this is sometimes called
    the event "firing") the method referred to the event is called to deliver the
    message. I call a delegate "A way of telling a piece of program what to do when
    something happens". A posish delegate would have the form:


    # Delegate is a type safe reference to a method in a class.


    # Type safe delegates


    The phrase type safe in this context means that if the method accepts integer
    parameters and returns a string, the delegate for method will have exactly the
    same appearance and cannot be used in any other way. This word is used to distinguish
    delegate from things like pointers which are used in more primitive languages
    like C.


    In C you create pointers to methods, but the environment does not know (or even
    care) what the methods really look like. This means that you can call them in
    the wrong way and cause your program to explode. Don''t worry about this too much.
    Remember that delegates are safe to use.


    # Using a Delegate


    As an example, consider the calculation of fees in our bank. The bank will have
    a number of different methods which do this, depending on the type of customer
    and the status of that customer. It might want to have a way in which a program
    can choose which fee method to use as runs.


    We have seen that overloading lets us create methods which are specific to a particular
    type of object, for example we provided a custom withdrawfunds for the BabyAccount
    class which drew out a limited amount of each. These techniques are very useful,
    but they are hard wired into the code that we write. Once we compile the methods
    in it cannot change.


    A delegate is a "stand in" for a method. If you call it you can use it as a kind
    of method selector. A delegate type is created like this:


    ```

    public delegate decimal CalculateFee (decimal balance);

    ```


    Note that I haven''t created any delegates yet, I''ve just compiled what the delegate
    type CalculateFee looks like. This delegate can stand for a method which accepts
    a single decimal parameter (the balance on the account) and returns a decimal
    value (the amount we are going to charge the customer). An example of a method
    we might want to use with this delegate you consider is this one:


