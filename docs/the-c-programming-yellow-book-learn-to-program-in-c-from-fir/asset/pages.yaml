  md: '# Advanced Programming


    # Generics and Collections


    This sounds a bit confusing, how about an example.


    If you wanted to share marbles amongst you and your friends could come up with
    way of doing that. Something like: "Divide the number of marbles by your friends
    and then distribute the remainder randomly". You now have a system that lets you
    share marbles. However, you could also use it to share sweets, cakes or even cars.
    What the system works is not particularly important. You could take your universal
    sharing algorithm and use it to share anything. The sharing algorithm could have
    been invented without worrying about the type of thing being shared; it could
    be a general sharing behaviour that is applied to the things we want to share.
    In this respect, generics can be regarded as another form of abstraction.


    # Generics and the List


    In the case of generics, you want that of a list. What the list is not important
    when making the list, just as long as you have a way of telling it what to store.
    The List class provides generics adds a few new methods to allow you to express
    this. The List class lives in the System.Collections.Generic namespace like this:


    ```

    List<Account> accountList = new List<Account>();

    ```


    The above statement creates a list called accountList which can hold references
    to Accounts. The type between the < and characters helps you tell the list kind
    of things it can store. You could create a List that can hold integers in a similar
    way:


    ```

    List<int> scores = new List<int>();

    ```


    Because we have the compiler check the type of things the list can hold it can
    perform type validation and make sure that nothing bad happens when the list is
    used:


    ```

    KitchenSink k = new KitchenSink();naccountList.Add(k);

    ```


    The above statements would cause a compilation error, the accountList variable
    is declared as holding a list of Account references, and will not accept the kitchen
    sink.


    Since the compiler knows AccountList holds Account references, this means that
    you can write code like this:


    ```

    accountList[0].PayFunds(50);

    ```


    There is no need to cast the item in the list as the type has been established.


    You can do everything with a List (Add, Count, Remove) that you can with an ArrayList,
    which makes the perfect way to store a large number of items of a particular type.


    # 5.1.3 The Dictionary class


    Just as Array has a more powerful, generically enhanced, called List, the HashTable
    has a more powerful called Dictionary. This allows the key to be hashable, and
    the items it stores to be typeof. For example, we might want to use the name of
    an account holder as a way of looking up a particular account. In other words,
    we have a string as the key reference as the value. We can create a dictionary
    to hold these key/value pairs as follows:


    ```

    Dictionary<string, Account> accountDictionary = new Dictionary<string, Account>();

    ```


    We can add items into our dictionary:


    ```

    accountDictionary.Add("Rob", robAccount);

    ```


    This looks like the way that the HashTable was used (and it is). However, using
    a Dictionary has the advantage that we can only add Account values which are located
    by means of a string. In other statements like this would be rejected.'
