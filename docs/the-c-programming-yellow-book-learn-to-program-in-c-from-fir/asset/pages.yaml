  md: "# Dependency\n\nIn general, too much dependency in your designs is a bad thing.\
    \ Dependency exists between two classes when a change in one class means that\
    \ you might have to change the other as. It usually means that you have not properly\
    \ allocated between the objects in your system and two objects are looking after\
    \ the same data. As an example the discussion of the CustomerAccount ChildAccount\
    \ Load method\n\nDependency is optional. For example a user interface may be depended\
    \ on a business object class (if you add new properties to the business object\
    \ you will need to update the user interface. However, it is unlikely that the\
    \ ways to the user interface works will mean that the business object needs to\
    \ be loaded.\n\n# Event\n\nAn event is some occurrence which your program may\
    \ need to respond to. Events include things like mouse movement, keys being hit,\
    \ windows resizing, buttons pressed, timers ticking etc. Many modern programs\
    \ work on the basis of events which are connected to methods. When the event occurs\
    \ the method is called deliver notification. Windows make use of delegates (a\
    \ delegate is a type safe reference to the method) to allow event generators to\
    \ be informed of the method to be called when the event takes place.\n\n# Exception\n\
    \nAn exception is an object that describes something that has just happened. Exceptions\
    \ are part of the way a C# program can deal with errors. When a running program\
    \ gets to a position where it can't continue (a file cannot be opened or an input\
    \ value may not sense) it can get up and \"throw\" an exception:\n\n```\nthrow\
    \ new Exception(\"Oh Dear\");\n```\n\nThe Exception object contains a Message\
    \ property that is a string which can be used to describe what has gone wrong.\
    \ In the above example the message would be set to \"Oh Dear\".\n\nIf the exception\
    \ is not \"caught\" the program will end at that point. You can make a program\
    \ respond to exceptions by enclosing code that might throw an exception in a try\
    \ - catch construction. When the exception is thrown the program transfers execution\
    \ to the code in catch:\n\n```\ntry {\n    // code that might throw an exception\n\
    } catch (Exception e) {\n    // code that is obeyed if an exception is thrown\n\
    \    // e is a reference to the exception that was thrown\n} finally {\n    //\
    \ code in here is always obeyed, whether the exception\nwas thrown or not\n}\n\
    ```\n\nA try - catch construction can also contain a finally clause, which contains\
    \ code that is executed whether or not the exception is thrown."
  merge: -1
