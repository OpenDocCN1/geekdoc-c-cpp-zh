  md: "# 4.9.7 Abstract methods and classes\n\nAt the moment we are using overriding\
    \ to modify the behaviour of an existing parent method. However, it is also possible\
    \ to overriding in a slightly different context. I can use it to force a set of\
    \ behaviours on items in a class hierarchy. If there are some things an account\
    \ must do then we can make abstract and then get the child classes to actually\
    \ provide the implementation.\n\nFor example, in the context of the bank application\
    \ we might want to provide a method that creates a letter to the customer that\
    \ their account is overdrafted. We will have to define it for each type of account\
    \ (we don't want to use the same language to a bank account system we know for\
    \ one older). Then at the time we create the bank account system we know that\
    \ this method, but we don't know precisely what it does in every situation.\n\n\
    We could provide a \"standard\" in the CustomerAccount class and then rely on\
    \ the programmers overriding this with a more specific method but then we have\
    \ no way of making sure they really provide the method.\n\nC provides a way of\
    \ flagging a method as abstract. This means that the method body is not provided\
    \ in this class, but will be provided in a child class:\n\n```\npublic abstract\
    \ class Account\n{\n    public abstract string RudeLetterString();\n```\n\nThe\
    \ fact that my new Account class contains an abstract method means that the class\
    \ itself is abstract (and must be marked as such). It is not possible to make\
    \ an instance of an abstract class. If you think about it this is sensible. An\
    \ instance of Account would not know what to do if the RudeLetterString method\
    \ was called.\n\nAn abstract class can be thought of as a kind of interface. If\
    \ you want to make an instance of a class based on an abstract parent you must\
    \ provide implementations of all the abstract methods given in the parent.\n\n\
    # Abstract classes and interfaces\n\nYou might decide that an abstract class looks\
    \ like an interface. This is true, in that an interface also provides a \"shopping\
    \ list\" of methods which must be provided by a class. However, abstract classes\
    \ are different in they can contain fully implemented methods alongside the abstract\
    \ ones. This can be useful because means you don't have to repeatedly implement\
    \ the same methods in each of the components that implement a particular interface.\n\
    \nThe problem is that you can only inherit from one parent, so you can only pick\
    \ up the behaviours of one class. If you want to implement interfaces well, you\
    \ may have to repeat methods as well.\n\nPerhaps at this point a fully worked\
    \ example might help. If we consider our bank problem we can identify two types\
    \ of behaviour:\n\n+   - those whose every type of bank account must provide (for\
    \ example PayFunds and GetBalance)\n- those each type of bank account must provide\
    \ in a way specific to that particular account type (for example WithdrawFunds\
    \ and RudeLetterString)\n\nThe trick is to use all the methods in the first category\
    \ and put them inside the second category. The methods in the second category\
    \ must be abstract. This leads us to a class design bit like this:"
