    # Programmer''s Point: Multiple Threads Can Improve Performance


    If you work out to spread your program over several threads this can make a big
    difference to the speed it runs at. The method above can only use a maximum of
    25% of your system, since it only runs on one of the four available processors.


    # 5.4.4 Running a Thread


    Note that these descriptions of thread behaviour are for the Microsoft .NET environment
    and are not strictly part of the C# language itself. If you write programs for
    the Windows 8 operating system you may be creating software based on Windows RT.
    In that case you will find that threads are used in a slightly different way.


    An individual thread is managed by your program as an instance of the Thread class.
    This class lives in the System namespace. We have used namespaces to locate resources
    before we use them. The easiest way to make sure we can use all the threading
    resources is to add a using directive at the start of our program:


    ```

    using System.Threading;

    ```


    The Thread class provides a link between your program and the operating system.
    One job of the operating system is to manage threads on your computer and decide
    exactly when each should get to run. By calling methods the Thread class you can
    start and stop them.


    # Selecting where a Thread starts running


    When you create a thread you need to tell the thread where to start running. This
    is like telling your younger brother on the track you''d like to place your train.
    You do this by using delegates. A delegate is a way of referring to a method in
    a class. The delegate type used by threads is the ThreadStart type. This delegate
    type can refer to a method that does not return a value or accept any parameters.
    If you take a look at the busyLoop method above you will find that this method
    fits the bill perfectly. You can create a ThreadStart delegate to refer to this
    method as follows:


    ```

    ThreadStart busyLoopMethod = new ThreadStart(busyLoopMethod);

    ```


    # Creating a Thread


    Once you have your start point defined you can create a Thread value:


    ```

    Thread t1 = new Thread(busyLoopMethod);

    ```


