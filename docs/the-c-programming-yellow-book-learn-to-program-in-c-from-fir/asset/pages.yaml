  md: '# Properties in Elements


    Once we have given our TextBox variable a proper name we can move on to give it
    all the properties that are required for this application. We can also change
    lots of properties for the textbox including the width of the textbox, the margin
    (which sets the position) and so.


    When we talk about the "properties" of Silverlight elements on the page we use
    the displayed in a TextBox we are actually talking about property values in the
    class that implements the TextBox. In other words, when a program contains a statement
    such as:


    ```

    resultTextBlock.Text = "";

    ```


    This will cause a Set method to run inside the resultTextBlock which sets the
    text on the TextBox to the appropriate value.


    If you are asking the question "Why do we use properties in XAML elements?" It
    makes sense to use them in a bank account where we want able to be the protected
    inside my objects in a XAML page, where there seems to be no point in having validation
    of the incoming value. In fact running this code would slow down the setting process.
    So making the value a public string we could make the program smaller and faster,
    which has to be a good thing.


    Well, sort of. If we change the value on a TextBox we would like the text on the
    XAML page in front of the user to change as well. This is how our machine will
    display the result. If a program changed the value of a data member there would
    be no way the XAML system could know the message on the screen to be updated.


    However, if the Text is a property when a program updates the behaviour in the
    TextBox will get to run. The code in the set handler can update the stored value
    of the field and it can trigger an update of the display to make the new value
    visible. Properties provide a means by which an object can get control when a
    value the object is being changed, and this is extremely important. The simple
    example:


    ```

    resultTextBlock.Text = "";

    ```


    - may cause hundreds of C# statements to run as the new value is stored in the
    TextBox and an update of the display is triggered to make the screen change.


    # Page Design with XAML


    XAML turns to be very useful. Once you get the hang of the information to describe
    components it turns to be much quicker to draw things and move them about by just
