  md: 'Glossary of Terms


    The End?


    # Value type


    A type holds a simple value. Value types are passed as values into method calls
    and their values are copied upon assignment; i.e. x = y causes the value in y
    to be copied into x. Changes to the value in x will not affect the value of y.
    Note that this is in contrast to reference types where the result of the assignment
    would make x and y refer to the same instance. Virtual Method


    A method is a member of a class. I can call the method to do a job. Sometimes
    I want to extend a class to produce a child class which is a more specialized
    version of that class. In that case I want to replace (override) the method in
    the parent with a new one in the child class. For this to take place the method
    in the parent class must have been marked as virtual. Only virtual methods can
    be overridden. Making a method virtual slightly slows down access to it, in that
    the program must look for any overrides of the method before calling it. This
    is why not all methods are made virtual initially.


