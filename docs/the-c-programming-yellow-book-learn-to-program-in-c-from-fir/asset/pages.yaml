    # 5.4 Threads andThreading


    If you want to call yourself a proper programmer you know something about threads.
    They make programs much easier to create, but they can also be the source of nasty
    bugs. In the future, where the speed of computer processors is going to be limited
    by things like the speed of light and the size of atoms, they are the way that
    we will be able to keep on improving the performance of our systems.


    # 5.4.1 What is a thread?


    At the moment our are using only a single thread when you run. The thread usually
    starts in the Main and finishes when the end of this method is reached. You can
    visualise a thread as a train running along a track. The track is the statement
    that the thread is executing. In the same way you can put more than one train
    on a single track, a computer can run more than one thread in a single block of
    code.


    A computer can support multiple threads in two ways. First is by rapidly switching
    between active threads, giving each thread the run for a limited time before moving
    on to another. When a thread is not running it is held in a "frozen" state, waiting
    for its turn. As far as the thread is concerned it is running continuously, but
    in reality a thread may only be active for a fraction of a second every now and
    then.


    The second way to support multiple threads is to actually have more than one processor.
    The first computers had only one processor and were forced to use "time slicing"
    to support threads. Newer machines now have "dual core" or "quad core" processors
    which can actually run threads simultaneously.


    # 5.4.2 Why do we have threads?


    Threads make it possible for your computer to do something useful while one program
    is held up. Your program can play music and download files while your program
    waits for you to press the next key. A modern computer perform millions of instructions
    per second; it makes sense to share this ability among several tasks.


    The programs that you have been writing and running all executed as threads in
    your computer. This is how your program can be active at the same time as other
    programs you might wish to use alongside it. You have not been aware of the operating
    system (usually Windows) does a very good job of sharing the processing power.


    Threads provide another level of "abstraction", in if we wish to do more than
    at the same time it is very useful to send a thread to perform the task, rather
    than interleaving the second task with the first. If we wrote a word processor
    we might find useful to create threads to perform time consuming tasks like printing
    or spell checking. These could be performed "in the background" while the user
    continues on the document.'
