  md: "# Coupling\n\nIf a class is dependent on another the two classes are said to\
    \ be coupled. Generally speaking a programmer should strive to have as little\
    \ coupling in their designs as possible, since it makes harder to update the system.\n\
    \nCoupling is often discussed alongside cohesion, in that you should aim for high\
    \ cohesion and low coupling.\n\n# Creative Laziness\n\nIt seems to me that some\
    \ aspects of laziness work well when applied to programming. Code reuse, where\
    \ you try and pick before you do anything is another good example of this. Making\
    \ sure the work, is right before you however the design so that you can get someone\
    \ else to do a lot of the work is the best example of creative laziness in action.\n\
    \n# Declarative language\n\nA declarative language tells a computer system about\
    \ stuff. It doesn't give instructions that explain how to perform an action; it\
    \ just makes the system aware of the fact that something exists and has a particular\
    \ set of properties.\n\nC# contains declarations; this is how a program can create\
    \ variables.\n\n```\nint i;\n```\n\nThis declaration creates an integer variable\
    \ which is identified by the name i. However, a C# program also contains statements\
    \ which tell the computer how to perform an action.\n\n```\ni = i + 1;\n```\n\n\
    This statement changes the value in i, making it larger by 1. The ability to do\
    \ this means that C# is not a declarative language. The markup language XAML however,\
    \ XAML is designed to describe the design of a page. A XAML source file contains\
    \ descriptions of items. \n\n```\n<TextBox Name=\"firstNumberTextBox Text=\"0\"\
    \nVerticalAlignment=\"Top\" Width=\"460\"\nTextAlignment=\"center\">\n</TextBox>\n\
    ```\n\nThis chunk of XAML describes a TextBox display. It gives the width, the\
    \ initial name and the name of the element. It does, however, not never, tell\
    \ the system what to do with the element, or any behaviour that it has. This is\
    \ because XAML does not provide a way of expressing behaviour; it is simply there\
    \ to tell the system about stuff.\n\n# Delegate\n\nA delegate is a type reference\
    \ to a method. A delegate is created for a method signature (for example this\
    \ method accepts two integers and returns a float). It can then be directed at\
    \ a method in a class which matches that signature. Note that the delegate instance\
    \ holds two items, a reference to the instance/class which contains the method\
    \ and a reference to the method itself. The fact that a delegate is an object\
    \ means it can be passed around like any other.\n\nDelegates are used to inform\
    \ event generators (like buttons, timers and the like) of the method which is\
    \ to be called when the event they generate takes."
  merge: -1
