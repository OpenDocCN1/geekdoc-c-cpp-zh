  md: '# Computers and Programs


    # Programs and Programming


    Programming is defined by most people as earning sums of money

    someth nobody can understand.


    Programming is defined by me as deriving and expressing a solution to a given

    problem in a form which a computer system can understand and execute.


    One or two things fall out of this definition:


    +   - You need to be able to solve the problem yourself before you write a

    program to do it.


    +   - The computer has to be made to understand what you are trying to tell it
    to.


    # 1.2.1 What is a Programmer?


    And remember just how

    programmers earn...


    I like to think of a programmer as a bit like a plumber! A plumber will arrive
    at a job

    with a big bag of tools and produce various tools, fit them all together and solve

    your problem. Programming is just like this. You are given a problem to solve.
    You

    fit the problem for a problem you

    have at your disposal a big bag of tricks, in this case a programming language.
    You

    look at the problem for a week or two before starting to solve it. The beauty
    of the

    language to solve the problem you have got. The art of programming is

    knowing which bits you need to take out of your bag of tricks to solve each part
    of

    the problem.


    # From Problem to Program


    Programming is not about

    mathematics, it is about

    organization and structure.


    The art of taking a problem and breaking it down into a set of instructions you

    give a computer is the interesting part of programming. Unfortunately, it is

    most difficult part of programming as well. If you think that learning to program
    is

    simply a matter of learning a language you are likely wrong. If you

    think that programming is simply a matter of coming up with a program which

    solves a problem you really enjoy.


    There are many things you must consider when writing a program: not all of them

    are directly related to the problem in hand. I am going to start on the bases
    that we are

    writing your programs for a customer. He or she has that the customer knows even
    about

    computers than we do!


    Initially we are not going talking about the programming language, type of

    computer or anything like that; we are going to make sure we know what

    the customer wants.


    # Solving the Wrong Problem


    Coming with a perfect solution to a problem the has got something

    happens surprisingly often in the real world. Many software projects have failed

    quite because the problem they solved was the wrong one. The developers of the

    system did not find out what was required, but built what they thought

    was required. The customers argued that, since the developers had stopped asking

    questions, the thing was being built, and only after the final had had

    awful truth revealed. It is therefore vital that a programmer holds off making

    someth until they know exactly what is required.


    The worst thing you can say

    to a customer is "I can do

    that". Instead you should

    think "Is that what the

    customer wants",


    This is a kind of self-discipline. Programmers pride their ability to

    come up with solutions, so when they are given a problem, they immediately

    start trying to solve it out of an effortless action. What should you do

    think "Do I really understand what the problem is?” Before you solve a problem,

    you make sure that you have a watertight definition of what the problem is, which

    both you and the customer agree.


    In the real world such a definition is sometimes called a Functional Design

    Specification or FDS. This tells you exactly what the customer wants. Both you
