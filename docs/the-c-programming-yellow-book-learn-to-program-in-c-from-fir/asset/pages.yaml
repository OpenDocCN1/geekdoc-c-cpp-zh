    will appear in the console window. If I want to refer to this as Console I have
    to tell the compiler using means that if I refer to something by a particular
    name the compiler will see if there is anything matching that can make. We will
    use other namespaces later.


    Classes are the basis of object programming, as we will see.


    # class GlazerCac


    C# program is made of one or more classes. A class is a container which holds
    data and program code to do a particular job. In the case of our double glazing
    the calculator just contains a single method which will work out our width and
