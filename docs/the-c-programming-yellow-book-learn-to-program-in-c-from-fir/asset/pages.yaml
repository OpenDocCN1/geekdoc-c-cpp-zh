  md: "# Creating Solutions\n\n# From Object to Component\n\nabout the C# interface\
    \ mechanism with a long description of how windows and buttons work. This will\
    \ earn you zero marks.\n\n# Interfaces and Design\n\nSo, instead of starting off\
    \ by defining classes we should instead thinking about describing their interfaces,\
    \ i.e. what it is have to do. In C# we express this information in a thing called\
    \ interface. An interface is a set of method definitions which are lumped together.\n\
    \nOur first pass at a bank account interface could be follows:\n\n```\npublic\
    \ interface IAccount {\n    void PayFunds(decimal amount);\n    bool WithdrawFunds(decimal\
    \ amount);\n    decimal GetBalance();\n}\n```\n\nThis says that the IAccount interface\
    \ is comprised of three methods, one to pay money; another to withdraw it and\
    \ a third which returns the balance on the account. From the balance management\
    \ point of view this is all we need. Note that at the interface level I am not\
    \ saying how it should be done, I instead just saying what should be done. An\
    \ interface is placed in a source file just like a class, and compiled in the\
    \ same way. It is set out of methods which relate to a particular task or role,\
    \ in this case what a class must do to be considered a bank account.\n\n# Programmer's\
    \ Point: Interface names start with I\n\nWe have seen that there are things called\
    \ coding conventions, which set down standards for naming variables. Another convention\
    \ is that the name of an interface should start with the letter I. If you don't\
    \ do your programs will compile fine, since the compiler has no opinions on variable\
    \ names, but you may have sleeping at night. And quite right too.\n\n# 4.8.3 Implementing\
    \ an Interface in C#\n\nInterfaces becoming interesting when we make a class implement\
    \ them. Implementing an interface is like setting up a contract between the supplier\
    \ of resources and the consumer. If a class implements an interface it is saying\
    \ that for every method described in the interface, it has a corresponding implementation.\n\
    \nIn the case of the bank account, I am going to create a class which implements\
    \ the interface, so that it can be thought of as an account component, irrespective\
    \ of what it really is:\n\nC# Programming © Rob Miles 2016\n\n111"
