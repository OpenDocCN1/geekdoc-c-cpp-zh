  md: "# Programmer's Point: Don't Replace Methods\n\nI am very against replacing\
    \ methods over overriding them. If you want to have a policy of allowing programmers\
    \ to make custom versions of classes in this it is much more sensible to make\
    \ use of overriding since this allows a well-managed way of using the method that\
    \ you over-rid. I am wondering why I mentioned this at all.\n\n# 4.9.5 Stopping\
    \ Overriding\n\nOverriding is very powerful. It means that a programmer can change\
    \ just one tiny part of a class and make a new one with all the behaviour of the\
    \ parent. This goes well with a design process which means as you move down \"\
    family tree\" of classes you get more and more specific.\n\nHowever, overriding/replacing\
    \ is not always desirable. The GetBalance method. This is never going to a replacement.\
    \ And yet you programmer could write their own and override or replace the one\
    \ in the parent:\n\n```\npublic new decimal GetBalance () {\n    return 1000000;\n\
    }\n```\n\nThis is the banquet of the bottle of beer that is never. No matter how\
    \ much is drawn out, it returns a balance value of a million pounds! A programmer\
    \ could insert this into this class and give himself a nice advice. What this\
    \ means is we need a way to mark some methods as not being able to override. C\
    \ does by giving us a sealed keyword which means \"You can't override this method\"\
    .\n\nUnfortunately this is hard to use. The rules are that you can only see an\
    \ overriding method (which means we can't see the GetBalance virtual method in\
    \ the CustomerAccount class) and a naughty person could always replace a sealed\
    \ method in the parent that has the same name in the.\n\nAnother use for sealed,\
    \ which has a bit more potential, is that you can mark a class as sealed. This\
    \ means that the class cannot be extended, i.e. it cannot be used as the basis\
    \ for another account.\n\n```\npublic sealed class BabyAccount : CustomerAccount,\
    \ IAccount {\n....\n```\n\nThe compiler will now stop the BabyAccount from being\
    \ used as the base of another account.\n\n# BANK NOTES: PROTECT YOUR CODE\n\n\
    As far the bank application is concerned, the customer will not have particularly\
    \ strong opinions on how you use things like sealed in your programs. They will\
    \ want to have confidence in the code that you make. One of the unfortunate things\
    \ about this business is that you will have to allow for the fact that people\
    \ who use your components might not be all nice and trustworthy. This means that\
    \ you should take steps when you decide to determine or not your methods should\
    \ be flagged as virtual and also make sure that you seal things when you can do.\n\
    \nFor a programming course at this level it is probably a bit heavy handed de\
    \ to labour this point right now, and if it didn't make sense there is no particular\
    \ need to worry, just remember when you create a program this is an risk that\
    \ you will have to consider."
