    \ information from users of your methods. They can provide \"secret switches\"\
    \ that make working in a particular way and which a user might need to know about\
    \ making something properly. If you use them, make use of comments in both the\
    \ method and the code that uses it, so that someone reading your code also understands\
    \ what the default behaviours do and how they can be modified.\n\n# 3.1.7 Parameter\
    \ Passing By Value\n\nA method is very good for getting work done, but it can\
    \ be limited because of the way it works. For example, if I want to write a method\
    \ that reads the name and the age of a person I have. From what we have seen,\
    \ I can only return one value the name of a person, or write one method which\
    \ returns the age. But I can't write a method that returns both values at the\
    \ same time as a method can only return one value. You will find out when you\
    \ try, changing the value of an argument does not change the value of the thing\
    \ passed in. This is because, unless you specify otherwise, the value of an argument\
