  md: '# Storing integer values


    Integers are the easiest type of value for the computer to store. Each value will
    map onto a particular pattern of bits. The only issue is one of range. The bigger
    the larger number of bits that you need to represent it.


    C# provides a variety of integer types, depending on the range of values you would
    like to store:


    | type | bits | range |

    | --- | --- | --- |

    | sbyte | 8 bits | -128 to 127 |

    | byte | 8 bits | 0 to 255 |

    | short | 16 bits | -32,768 to 32,767 |

    | ushort | 16 bits | 0 to 65,535 |

    | int | 32 bits | -2,147,483,648 to 2,147,483,647 |

    | uint | 32 bits | 0 to 4,294,967,295 |

    | long | 64 bits | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |

    | ulong | 64 bits | 0 to 18,446,744,073,709,551,615 |


    The standard integer type, int, can hold surprisingly large numbers: -2,147,483,648
    to 2,147,483,647. If you want to hold even larger integers than this (although
    you have no idea why you''d want this) there is a long version.


    An example of an integer variable would be something you track of the number of
    sheep in a field:


    ```

    int numberOfSheep = 0;

    ```


    This creates a variable, which sets the value to 0. Using int (which can hold
    negative values) lets you manipulate "negative sheep" which is probably not necessary
    (unless you run a sheep and let people borrow them). Remember that the language
    itself is unaware of any such considerations. If you want to make sure that we
    have more than 1000 sheep and sheep never goes negative you must adjust yourself.


    When you edit your program source using Visual Studio (or another code editor
    that supports syntax highlighting) you will find the names of types that are built
    into the C# language (such as int and float) are displayed in blue, as shown above.


    # Programmer''s Point: Check what you owe maths


    Something else you should bear in mind is that a program will not always detect
    when you exceed the range of a variable. If I put the value 255 into a variable
    of type this is OK, because 255 is the biggest value of the type it can hold.
    However, if I add one to the value in this variable the system may not detect
    this as an error. In fact this may cause the value to "wrap around" to 0. Which
    could cause your program big bugs.


    # integer literal values


    An integer literal is expressed as a sequence of digits with no decimal point:


    23


    This is the integer value 23. I could use it in my program as follows:


    ```

    numberOfSheep = 23;

    ```


    If I use one of the "shorter" types the literal value is regarded by the compiler
    as being of that type:


    ```

    sbyte tinyVal = 127;

    ```'
