    # Reference Importance


    The key to this way of working is that an object can contain references to other
    objects, as well as the data payload. We will consider this aspect of object later;
    now we just need to remember that the reference and the object are distinct and
    separate.


    # BANK NOTES: REFERENCES AND ACCOUNTS


    For a bank with thousands of customers the use of references is crucial to the
    management of the data that they hold. The accounts will be in the memory of the
    computer, and because the size of each account and the number of accounts being
    stored, it will not be possible to move them around if we want to sort them.


    This means the only way to manipulate it is to leave them in the same place and
    have lists of references to them. The references are very small "tags" which can
    be used to locate the actual item in memory. Sorting a list of references is very
    easy, and it would also be possible to have several lists. This means that we
    can offer the manager of a bank sorted by customer name and view sorted in order
    of balance. And if the manager comes along with a need for a new structure or
    we can create that in terms of references as well.


    # 4.5 Designing With Objects


    We are now to start thinking in terms of objects. The reason that we do is like
    a way of making of our systems as easy as possible. This all comes back to the
    "creative laziness" that programmers are famous for. The thing that we are trying
    to do is best expressed as:


    > "Put off all the hard work for as long as we can, and if possible get someone
    else to do it"


    Objects let us do this. If we return to our bank account we can see that there
