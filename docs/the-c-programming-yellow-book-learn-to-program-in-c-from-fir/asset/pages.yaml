    # Signature


    A C# method has a particular signature which allows it to be uniquely identified
    in a program. The signature is the name of the method and type and order of the
    parameters to that method:


    ```

    void Silly(int a, int b) - has the signature of the name Silly and two int parameters.

    ```


    ```

    void Silly(float a, int b) - has the signature of the name Silly and an float
    followed by an integer parameter. This means that the code:

    ```


    ```

    Silly(1, 2);

    ```


    +   - would call the first method, whereas:


    ```

    Silly(1.0f, 2);

    ```


    +   - would call the second method.


    Note that the type of the method has no effect on the signature.


    # Source file


    You prepare a source file with a text editor of some kind. It is text which you
    want to pass through a compiler to produce a program file for execution.


    # Static


    In the context of C# keyword static makes a member of a class part of a class
    rather than part of instance of a class. This means that you don''t need to create
    an instance of a class to use a static member. It also means that static members
    are accessed by means of the name of their class rather than reference to an instance.
    Static members are useful for creating class members which are to be shared with
    all the instances, for example interest rates for all accounts in your bank.


    # Stream


    A stream is an object which represents a connection to something which is going
    to move data for. The movement might be to a disk file, a network port or even
    to the system console. Streams remove the need to modify a program depending on
    where the output is to be sent or received from.


    # Structure


    A structure is a collection of data items. It is not managed by reference, and
    structures are copied on assignment. Structures are also passed by value into
    methods. Structures are useful for holding chunks of related data in single units.
    They are not as flexible as objects managed by reference, but they are more efficient
    to use in accessing structure items does not require a reference to be followed
    in the same way as for an object.


