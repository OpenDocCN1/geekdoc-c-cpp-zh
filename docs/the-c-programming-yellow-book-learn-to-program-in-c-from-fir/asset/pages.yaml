    # C#


    I''m not going to get into details of how to download and install the .NET framework;
    that is for other documents, I am going to assume that you are using a computer
    which has a text editor (usually Notepad) and the .NET framework installed.


    # The Human Computer


    Of course initially is best if you work through your programs on paper. I reckon
    that you write programs best when you are not sitting at the computer, i.e. the
    best approach is to write (or at least map out) your solution on paper long away
    from the machine. Once you are sitting in front of the keyboard there is a great
    temptation to start pressing keys and typing which is not much work. You will
    almost certainly end up with something which almost works, which will then spend
    hours fiddling with to get it going.


    If you had sat with a pencil and worked out the solution you would probably get
    to a working system in around half the time.


    # Programmer''s Point: Great Programmers debug less


    I am not impressed by hacking programmers who spend days at terminals fighting
    with enormous programs and debugging them into shape. I am impressed by someone
    who turns up, in the programs and makes it work first time!


    # 1.4.6 What Comprises a C# Program?


    If you wanted to tell you how to make your favourite fruitcake she''d write the
    recipe on a piece of paper. The recipe would be a list of ingredients followed
    by a sequence of actions to perform on them.


    A program can be regarded as a recipe, but written for a computer to follow, not
    a cook. The ingredients will be values (called *variables*) that you want your
    program to work with. The program itself will be a sequence of actions (called
    *statements*) that are to be followed by the compiler. Rather than writing the
    program on a piece of paper you instead put it into a file, the compiler acts
    on a *source file*.


    This is what the compiler acts on. A source file contains three things:


    +   * instructions to the compiler

    * information about the structures which will hold the data to be stored and manipulated.

    * instructions which manipulate the data.


    To make this in turn:


    # Controlling the Compiler


    The C compiler needs to know things about your program. It needs to know which
    external resources your program is going to use. It can also be told about options
    for the construction of your program which are important. Some of your program
    will provide this information to the compiler what to do.


    # Storing the Data


    Programs work by processing data. The data needs to be stored within the computer
    while the program processes it. All computer languages support *variables* of
    one form or another. A variable is simply a name location in which a value is
    held which can hold more than one item, for example a single *structure* could
    hold all the information about a particular base customer. As part of the program
    design process you will need to decide what items of data need to be stored. You
    must also decide on sensible names that you will use to identify these items.


