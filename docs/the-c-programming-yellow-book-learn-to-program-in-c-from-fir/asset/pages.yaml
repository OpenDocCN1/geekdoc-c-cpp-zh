  md: "# Creating Solutions\n\n# From Object to Component\n\nbank, this means that\
    \ we want to deal with objects in terms of IAccount (the set of account abilities)\
    \ rather than CustomerAccount (a particular account class).\n\nIn C# this means\
    \ that we need to be able to reference variables which refer to objects in terms\
    \ of interfaces they implement, rather than the particular type that they are\
    \ out of that it is quite easy.\n\n```\nIAccount account = new CustomerAccount();\n\
    account.PayInFunds(50);\nConsole.WriteLine(\"Balance: \" + account.getBalance());\n\
    ```\n\n# Code Sample 3 Simple Interface\n\nThe account variable is allowed to\
    \ refer to objects which implement the IAccount interface. The compiler will check\
    \ to make sure that CustomerAccount does this, and if it does, the compilation\
    \ is successful.\n\nNote that there will be no instance of IAccount interface.\
    \ It is simply a way that we can refer to something that has that ability (it\
    \ contains the required methods). This is same in real life. There is no physical\
    \ thing like a \"lecturer\", merely a large number of people who can refer to\
    \ as having that particular ability or role.\n\n# 4.8.5 Using interfaces\n\nNow\
    \ that we have our system designed with interfaces it is much easier to extend\
    \ it. We can create a BabyAccount class which implements the IAccount interface.\
    \ This implements all the required methods, but they behave slightly differently\
    \ when we make withdrawals of ten pounds to:\n\n```\npublic class BabyAccount\
    \ : IAccount {\n    private decimal balance = 0;\n\n    public bool WithdrawFunds\
    \ (decimal amount) {\n        if (amount > 10) {\n            return false;\n\
    \        }\n        if (balance < amount) {\n            return false;\n     \
    \   }\n        balance = balance - amount;\n        return true;\n    }\n\n  \
    \  public void PayInFunds (decimal amount) {\n        balance = balance + amount;\n\
    \    }\n\n    public decimal GetBalance () {\n        return balance;\n    }\n\
    }\n```\n\nThe nice thing about this is that as it is a component we don't have\
    \ to change all the classes which use it. When we create the objects we just have\
    \ to ask if a standard account or a baby account is required. The rest of the\
    \ system can use this object without caring exactly what it is. We will course\
    \ to create some tests especially for it, so that we can make sure that our existing\
    \ withdrawals of ten pounds fail, but using the new kind of account in our system\
    \ is very easy."
