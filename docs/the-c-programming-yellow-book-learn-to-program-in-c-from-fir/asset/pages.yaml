  md: "# Creating Solutions\n\n# Designing With Objects\n\n- and take away all money.\
    \ If we are going to provide a way of stopping this from happening we need to\
    \ protect the data inside our objects.\n\n# 4.5.2 Member Protection inside objects\n\
    \nIf objects are going to be useful we have to have a way of protecting the data\
    \ within them. Ideally I want to control when someone tries to change a value\
    \ in them, and stop the change being made if I don't like it. The posh word is\
    \ for encapsulation. I want all the important data hidden inside object so that\
    \ I have complete control over what is done with it. This technology is the key\
    \ to my defensive programming approach which is geared to making that whatever\
    \ happens, part of the program does not go wrong.\n\nFor example, in our bank\
    \ program we want to make sure the balance is never changed in a manner that we\
    \ can't control. The first thing we need to do is stop the outside world from\
    \ playing with our balance value:\n\n```\nclass Account\n    private decimal balance;\n\
    }\n```\n\nThe property is no longer marked as public. Instead it is now private.\
    \ This means the outside world no longer have direct access to it. If I write\
    \ the code:\nRobbsAccount.balance = 0;\n\n- I get an error when I try to compile\
    \ the program:\nPrivateDemo.cs(13,33): error CS0122: 'PrivateDemo.Members.balance'\
    \ is inaccessible due to its protection level\n\nThe balance is now inside the\
    \ object and is not visible to the outside world.\n\n# Changing private members\n\
    \nI can tell what you are thinking at this point. You are thinking \"What is the\
    \ point of making it private, now you can't change it at all\". Well, thanks for\
    \ the vote of confidence folks. It turns out that I can change the value, but\
    \ only using code actually running in the class. Consider the program:\n\n```\n\
    class Account\n    private decimal balance = 0;\n    public bool WithdrawFunds(decimal\
