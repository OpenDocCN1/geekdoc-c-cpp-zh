  md: '# Advanced Programming


    # Threads and Threading


    complete without being interrupted. You can do this by using a feature *mutual
    exclusion* or *mutex*. We can return to our train analogy here.


    # Using Mutual Exclusion to Manage Data Sharing


    Allowing two threads to share the same variable is a bit like two trains to share
    the same piece of track. Both are dangerous. The single problem was solved by
    using a single token which was held by the engine. When they entered the track
    they gave the token. When the first left the single track the driver had the token
    back. Anyone wanting to enter the track had to wait for their turn with the tokens.


    Mutual exclusion works in the same way by using an instance of an object to play
    the role of the token.


    ```

    static Object sync = new object();

    ```


    This object doesn''t actually hold data. It is just as the token which is held
    by the active process.


    ```

    Monitor.Enter(sync);

    overDraftCount = overDraftCount + 1;

    Monitor.Exit(sync);

    ```


    The code between `Monitor.Enter` and `Monitor.Exit` calls can only be performed
    by one thread at a time. There is no chance of Windows interrupting the statement
    and switching to another process. The increment operations will complete in their
    entity. Once execution leaves the statements between the Monitor calls the thread
    can be suspended as usual.


    Threads that aren''t "park" in a queue of waiting threads. This is held in order,
    so the first thread to get to the entry point will be the first to get the token,
    with other threads lining up for their turn. The `Monitor` class looks all for
    us; we don''t know how it works.


    # Programmer''s Point: Threads Can Totally Break Your Program


    If a thread grabs hold of a synchronisation object and doesn''t let go of it,
    this will stop all threads from running if they need that. This is a really good
    way to make your programs fail. Another one, called the "Deadly Embrace" where
    thread a has got object x and is waiting for object y, and thread b has got object
    y and is waiting for object x. This is the computer version of "I''m not calling
    him to apologise, I''m going to wait for him to call me"


    # 5.4.6 Thread Control


    There are a number of additional features for thread management. These let you
    pass threads, wait for a thread to finish, see if there is a thread still active
    and suspend and remove threads.


    # Pausing Threads


    As you can see, one way to "pause" a thread is to create a loop with an enormous
    limit. This will certainly pause your program, but at the expense of other threads
    that want to run. If you just want your program to pause, allow to the user to
    read the output or wait a little while for something to happen you should use
    the `Sleep` method which is provided by the `Thread` class.


    ```

    Thread.Sleep(500);

    ```


    This method is given the number of milliseconds (thousand''s of a second) that
    the execution is to pause. The above call would pause a program for a half second.'
