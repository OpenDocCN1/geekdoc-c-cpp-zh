    # A Graphical User Interface


    We are going to discover that it is hard to talk about XAML without mentioning
    Visual Studio, the integrated development environment that lets programmers create
    applications which contain a XAML designed interface connected to C# code behind.


    Visual Studio can synchronise the XAML description of a user interface with the
    program code that is connected to it. It also contains graphical editor that can
    design the interface itself.


    It is perhaps best to regard C#, XAML and Visual Studio as a whole, they are designed
    to work together to make it easy for programmers to create these kinds of applications.


    # Programmer''s Point: Learn how to use Visual Studio


    It is possible to create XAML files and complete applications by just writing
    the text files that contain the C# and XAML elements. However, this will take
    a very long time. At this point you should spend some time in learning how to
    use Visual Studio, which provides a very rich environment for programs like this.
    It will let you drag elements around a design surface (if you position them by
    hand) and automatically create event handlers for things like buttons.


    # 5.7.1 The XAML Markup Language


    We are going to useensible Application Markup Language (or XAML) which has been
    designed by Microsoft to make it easy to create a good looking application. To
    understand this we are going to learn a few things about how markup languages
    work. The good news is that this knowledge is extremely useful, lots of modern
    user interface systems work in a similar way.


    XAML is a declarative language. This means that all it can do is give information
    to a computer about stuff. In all case of XAML it is the design of the screen,
    page, or that the user sees.


    # Extensible Markup Languages


    At this point you may be wondering what an Extensible Application Markup Language
    actually is. Well, it is a markup language for applications that is extensible.
    I is helped. What we mean by this is that you can use the rules of the language
    to create constructions that describe anything. English is a lot like this. We
    have letters and punctuation which are the syntax of English text. We also have
    rules (grammar) that set out make up words. sentences have many kinds of words.
    We have nouns that describe and verbs that describe actions. Someone had to come
    up and invent a new word or set to describe them. When the computer was invented,
    with phrases like “built up”, “system crash” and “too slow.


    XAML languages are extensible that we can invent new words and phrases that fit
    within the rules of the language these constructions to describe anything like.
    They are called markup languages because they are used to describe the arrangement
    of items on a page. The word markup was originally used in printing when you wanted
    to say things like “Print the name Rob in very large font. The most famous markup
    language is probably HTML, Hypertext Markup Language, which is used by the World
    Web to describe the format of web pages.


    Programmers frequently invent their own data storage formats using XML. As an
    example, a snippet of XML that describes a set of high scores might look like:'
