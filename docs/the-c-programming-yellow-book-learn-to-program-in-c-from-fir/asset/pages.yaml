  md: "# Creating Programs\n\n# Methods\n\nIn this case the method call made changes\
    \ to the content of the variable. Note that C# is careful about when a parameter\
    \ is a reference. You have to put the ref in the method heading and also in the\
    \ call of the method.\n\n# Programmer's Point: Document your side-effects\n\n\
    A change by the method to something around it is called a side effect of the method.\
    \ In other words, when someone calls our addTodoRefParam method, it is going to\
    \ have the \"side effect\" of changing something outside the method itself (namely\
    \ the value of the parameter by reference). Generally speaking you have to be\
    \ careful with side effects, as someone reading your program has to know that\
    \ your method has made changes in this way.\n\n# 3.1.9 Passing Parameter values\
    \ as 'out' references\n\nWhen you pass a parameter as a reference you are giving\
    \ the method control of it. This isn't what you want. Just allow the method to\
    \ change the variable. This is the case when we want to read the name and age\
    \ of a user. The original value of the parameters is no interest to the method.\
    \ Instead just want to deliver results to them. In this case I can replace the\
    \ ref with\n\n```\nstatic void readPerson (out string name, out int age) {\n \
    \   name = readstring(\"Enter your name : \");\n    age = readInt(\"Enter your\
    \ age : \", 0, 100);\n}\n```\n\nThe readPerson method reads the name and age of\
    \ a person. Note that it uses two methods that I have created, readString and\
    \ readInt.\n\nI can call readPerson as follows:\n\n```\nstring name;\nint age;\n\
    readPerson (out name, out age);\n```\n\nNote that I use the out keyword in the\
    \ call of the method as well.\n\nThe readPerson method will read the person and\
    \ deliver the information into the two variables.\n\n# Programmer's Point: Languages\
    \ can help programmers\n\nThe out keyword is a nice example of how design of a\
    \ programming language can make programs safer and easier to write. It makes sure\
    \ that a programmer can't use the value of the parameter in the method. It also\
    \ allows the compiler to make somewhere in the method the output parameters are\
    \ assigned values. This is very useful. It means if I mark the parameters as out\
    \ I must have them a value for the program to compile. This makes it harder for\
    \ me to get the program wrong, as I am protected against forgetting to do that\
    \ part of the job.\n\n# 3.1.10 Method Libraries\n\nThe first thing that a good\
    \ programmer will do when they start writing code is to create a set of libraries\
    \ which can be used to make their job easier. In the code I have written a couple\
