  md: '# Advanced Programming Organisation


    class. the compiler now knows where to find all the parts of the application,
    and so it can build the executable program.


    # Library References at Runtime


    We have made two files which contain program code:


    **AccountManagement.dll** the library containing the Account class code


    **AccountTest.exe** the executable program that creates an Account instance


    Both these files need to be present for the program to work correctly. This is
    because of the "dynamic" in dynamic link library. It means that library is only
    loaded when the program runs, not when it is built.


    # Deleting System Components


    This means that if something horrid like delete the Accountmanagement.dll and
    run the program causes all kinds of nasty things to happen:


    ```

    Unhandled Exception: System.IO.FileNotFoundException: File or assembly name AccountManagement,
    or one of its dependencies, was not found.

    File name: "AccountManagement" at AccountTest.Main()\ lots of other stuff

    ```


    This means that we need to be careful when we send out a program and make sure
    that all the components are present when the program runs.


    # Updating System Components


    Creating a system out of a number of executable components has the advantage that
    we can update part of it without affecting everything else. If I modify the AccountManagement
    and re-compile it, the new version is pushed by AccountTest automatically. Of
    course this only works as long as I don''t change the appearance of the classes
    or methods AccountTest uses.


    The good news is that I can fix the broken parts of the program without sending
    out an new version.


    The bad news is that this hardly ever works. There is a special phrase, "dll hell",
    reserved for what happens. Unless the fixed code is exactly there is a good chance
    that it might break other part of the program. Windows works in this way, and
    the number of times I''ve installed a new program (or worse update of an existing
    one) which has another program on the computer is too numerous to happily remember


    # Programmer''s Point: Use Version Control and Change Management


    So many things end up rooted in a base for good planning and management and here
    we are again. When you think about selling your program for money you must make
    sure that you have a managed approach to how you are going to send out and upgrades.
    The good news is that ways of making sure that certain versions of your program
    only work with particular program files. The bad news is that you have to plan
    how to use this technology, and then make sure you use it. If this sounds boring
    and pedantic then I''m very sorry, if you do not do this it will go bankrupt or
    both.


    # 5.6.2 Namespaces


    We can use libraries to break up our solution into a number of files. This makes
    management of the solution slightly easier. But we also have another problem.
    We don''t want to break things into physical chunks. We also want to use logical
    ones as well.'
