  md: '# Creating Solutions


    # Inheritance


    This code repays careful study. Note how I have moved all the things that accounts
    must do into the parent Account class. Then I have added customised methods into
    the child classes where appropriate. Note also that I have left the interface
    in place. That is because; even though I now have an abstract structure I still
    want to think of the account objects in terms of their "accountness" rather than
    any particular type.


    If we make new kind of account classes which are based on the Account parent each
    new class must provide its own version of the RudeLetterString method.


    # References to abstract classes


    References to abstract classes work like references to interfaces. A reference
    to an Account class can refer to any class which extends from parent. This might
    seem useful, as we can consider something as an "account" rather than a BabyAccount,


    However, I prefer it if you manage references to abstract things (like accounts)
    in terms of their interface instead.


    # 4.9.8 Designing with Objects and Components


    For the purpose of this task you now have broad knowledge of all the tools that
    can be used to design large software systems. If you have an understanding of
    what interface and abstract classes are to achieve this will stand you in very
    good stead for your programming career. Broadly:


    **Interface:** lets you identify a set of behaviours which component can be made
    to implement. Any component which implements the interface can be thought in terms
    of a reference of that interface. A concrete example of this would be something
    like IPrinter. Lots of items in my bank system will need to do this and so we
    put the details of the interface for them to implement in their own way. Our printer
    can just regard each of the instances that implement this interface purely in
    this way. Interfaces let me describe a set of behaviours which a component can
    implement more than one interface, allowing different faces to the systems that
    you use.


    **Abstract:** lets you create a parent class which provides to all the classes
    which it extends. If you want to create a related set of items, for all the different
    kinds of bank account you might need to deal with, including credit card, deposit
    account, account then the best way to do this is to set up a parent class which
    contains abstract and non-abstract methods. The child classes can make use of
    the methods from the parent and override the ones that need to be provided for
    that particular class.


    # Use Interface References


    One consideration is that even if you make use of an abstract parent class I reckon
    that should still make use of interfaces to reference the data objects themselves.
    This gives you a degree of flexibility that you can use to get good effect.


    # BANK NOTES: MAKING GOOD OF INTERFACE AND ABSTRACT


    If bank takes over another bank and to share account information we might need
    a way to use these interfaces. If their accounts are software components too (and
    they should be) all we have to do is implement the required interfaces at each
    end and our systems understand each other. In other words the bank must create
    references in the IAccount interface, and get their account objects (whatever
    they are called) to implement the interface, and presto, I can use them now.


    This would be much more difficult if my entire system talks in terms of a parent
    class – since their classes would not fit into this hierarchy at all.


    C2 Programming Rob Miles 2016


    125'
