  md: "# Creating Solutions\n\n# The Construction of Objects\n\nThis could create\
    \ a new account and set the name property to Miles, the address to Hull and the\
    \ initial balance to zero. It turns out that I can do this very easily, all I\
    \ have to do is the constructor method to accept these parameters and use them\
    \ to set up the members of the class.\n\n```\nclass Account {\n    // private\
    \ member data\n    private string name;\n    private string address;\n    private\
    \ decimal balance;\n\n    // constructor\n    public Account (string inName, string\
    \ inAddress, decimal inBalance) {\n        name = inName;\n        address = inAddress;\n\
    \        balance = inBalance;\n    }\n```\n\nThe constructor takes the values\
    \ supplied in the parameters and uses them to set up the members of the Account\
    \ that is being created. In this respect it behaves exactly as any other method\
