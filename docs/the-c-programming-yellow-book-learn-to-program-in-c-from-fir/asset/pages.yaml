  md: "# 4.2.1 Enumeration and states\n\nEnumerated sounds posh. But if you think\
    \ of \"enumerated\" as just meaning \"numbered\" things gets a bit easier. To\
    \ understand what we are doing here we need to consider the problem which these\
    \ types are intended to solve.\n\nWe know that if we want to hold an integer value\
    \ we can use an int type. If we want to hold something that is either true or\
    \ false we can use a bool. However, sometimes we want to hold a range of particular\
    \ values or states.\n\n# Sample states\n\nEnumerated types are very useful when\
    \ storing state information. States are not the same as other items such as the\
    \ name of a customer or the balance of their account.\nFor example, if I am writing\
    \ a program to play the game Battleships (squares of \"sea\" different types of\
    \ craft which can be attacked) I may decide that a given square of the sea can\
    \ have the following thing in it:\n\n+   - Empty sea\n- Attacked\n- Battleship\n\
    - Cruiser\n- Submarine\n- Rowing boat\n\nIf you think about it, I am sort of assembling\
    \ more metata here, in I have decided that I need to keep track of the state and\
    \ I have worked out exactly what I can put in it. I could do something with numbers\
    \ if I like:\n\n+   - Empty sea = 1\n- Attacked = 2\n- Battleship = 3\n- Cruiser\
    \ = 4\n- Submarine = 5\n- Rowing boat = 6\n\nHowever, this would mean that I have\
    \ to keep track of the values myself and remember that if we get the value 7 in\
    \ a sea location this is clearly wrong.\nC# has a way in which we can create a\
    \ type that has just a particular set of possible values. These types are called\
    \ \"enumerated types\".\n\n```\nenum SeaState {\n    EmptySea,\n    Attacked,\n\
    \    Battleship,\n    Cruiser,\n    Submarine,\n    RowingBoat\n}\n```\n\nI created\
    \ a type SeaState which can be used to hold the state of a particular part of\
