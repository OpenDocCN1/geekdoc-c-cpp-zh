  md: "# Creating Programs\n\n# Methods\n\n```\nint test = 20;\naddOne(test);\nConsole.WriteLine(\"\
    test is : \" + test);\n```\n\nThe piece of C# above calls the method with the\
    \ test variable as the argument. When it runs it out the following:\n\n+   i is\
    \ : 21\ntest is : 20\n\nIt is very important that you understand what is happening\
    \ here. The value of test is being used in the call of addOne. The program works\
    \ out the result of the expression to be passed into the method call as an argument.\
    \ It passes this value into call. This means you can write code like:\n\n```\n\
    test = 20;\naddOne(test + 99);\n```\n\nThis would print out:\n\n+   i is : 120\n\
    \nPass by value is very safe, nothing the method does affect variables in the\
    \ code which it calls. However, it is a limitation when we to create a method\
    \ that returns more than one value.\n\n# 3.1.8 Parameter Passing By Reference\n\
    \nIt is very important that you understand how references work. If you don't understand\
    \ these you can't call yourself a proper programmer!\n\nFortunately C# provides\
    \ a way, that rather than passing the value of a variable into a method, a reference\
    \ to that variable is supplied. Inside the method, rather than using the value\
    \ of the reference is used to get the actual variable itself. The thing that is\
    \ passed into the method is the position or address of memory, rather than the\
    \ content of the variable.\n\nSo rather than passing in \"20\" in our above code\
    \ the compiler will generate code which passes in \"memory location 5023\" instead\
    \ (assuming the variable test code is stored at 5023). This memory is used by\
    \ the method, the value of the value. In other words:\n\n> \"If you pass by reference,\
    \ changes to the parameter change the variable reference passed\"\n\nIf you find\
    \ references are confusing not you are alone. However, we use them in real life\
    \ all the time with no problems. If you say \"Deliver the cake to 23 High Street,\"\
    \ you are giving the delivery by a method. Using a reference in a program is just\
    \ the same. The program will say \"Get the value from location 5023\" rather than\
    \ \"The value is 1\"\n\nConsider the code:\n\n```\nstatic void addOneToRefParam\
    \ ( ref int i ) {\n    i = i + 1;\n    Console.WriteLine(\"i is : \" + i);\n}\n\
    ```\n\nNote that the Keyword ref has been added to the information about the parameter.\n\
    \n```\ntest = 20;\naddOneToRefParam(ref test);\nConsole.WriteLine(\"test is :\
    \ \" + test);\n```\n\nThe code makes a call to the new method, and also has the\
    \ code ref in front of the parameter. In this case the output is as follows:\n\
    \n+   i is : 21\ntest is : 21\n\nC# Programming © Rob Miles 2016\n\n55"
