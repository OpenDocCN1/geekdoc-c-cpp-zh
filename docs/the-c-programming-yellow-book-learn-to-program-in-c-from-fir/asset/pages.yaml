  md: 'You can see what we need if you take a look at the diagram:


    ![](img/d50be9be3b33c7dfe37bae51200a38c3_11_0.png)


    The area of the glass is the width multiplied by the height. To make the frame
    we will need two pieces of wood the width of the window, and two pieces of wood
    the height of the window.


    # Programmer’s Point: metadata is important


    Information about information is called metadata. The word meta in this situation
    implies a “stepping back” from the program to allow it to be considered in a broader
    context. In the case of our window program the metadata will tell us more about
    the values that are being used and produced, specifically the units in which the
    information is expressed and the valid range of values that the information may
    have. For any quantity you represent in a program that you write must have at
    least this level of metadata.


    # What the program actually does


    The program can define the two values according to the following equations:


    ```

    glass area = width of window * height of window

    length = (width of window + height of window) * 2

    ```


    # Putting in more detail


    We have a fairly good understanding of what our program is going to do for us.
    Being sensible and fair thinking we do not stop here, we now have to worry how
    our program will decide when the information coming in is actually valid.


    This must be done in conjunction with the customer, he or she must understand
    that if information is given which fits the range specified, your program will
    regard the data as act accordingly.


    In the case of we could therefore expand the definition of data coming in:


    +   The width of the window, in metres and being a value between 0.5 Metres and
    3.5 metres inclusive.

    -The height of the window, in metres and being a value between 0.5 and 2.5 metres
    inclusive.


    Note that we have also added units to our description, this is very important
    - perhaps our customer buys from a supplier who sells by the foot, in which case
    our output description should:


    +   The area of glass required for the window, in square metres. Remember that
    we are selling double glazing, so two panes will be required.

    -The length of wood required for the frame, in feet using the conversion factor
    of 3.25 feet per metre.


    Note that both you and the customer must understand the document!


    Having this all up in a form that both you and the customer can understand, we
    must then sign the completed specification, and work commence.'
