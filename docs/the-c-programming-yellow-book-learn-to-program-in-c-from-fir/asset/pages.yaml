  md: '# Advanced Programming


    # A Graphical User Interface


    Unfortunately it turns out that most programmers (including me) are not that good
    at designing attractive user interfaces (although I''m sure you are). In real
    life a company will employ graphic designers who create artistic looking front
    ends. The role of the programmer then be to put the code that builds these displays
    to get the job done.


    Microsoft designed XAML as a recognition of this issue. It enforces a strong separation
    between the screen design and the code that is controlled by it. This makes it
    easy for a programmer to create an initial interface which is subsequently changed
    by a designer into a much more attractive one. It is also possible for a programmer
    to take a complete user interface design and then fit theហើយ each of the display
    components.


    # Describing XAML Elements


    We can start to discover how XAML lets design an application by taking a look
    at how you could construct a program using it. Consider the following screen.


    ![](img/d50be9be3b33c7dfe37bae51200a38c3_191_0.png)


    This is a very simple Windows program that I''ve called "Adding Machine". You
    can use to perform very simple sums. You just enter two numbers into the text
    boxes at the top and then press the equals button. It rewards you with the sum
    of these two numbers. At the moment it is showing us that 0 plus 0 is 0. Each
    individual item on the screen is called a UElement or User Interface element.
    I''m going to call these elements from now. There are six of them on the screen
    above.


    +   1. The title "Adding Machine". This is a block of text with a font size of
    18 so that stands out.

    2. The topbox, where I can type a number.

    3. A text item holding the character +

    4. The bottom textbox, where I can type another number.

    5. A button, which we press to perform the sum.

    6. A result textbox, which changes to show the result when the button is pressed.
    At the moment it is empty, as I haven''t done any yet.


    Each of these items has a particular position on the screen, particular size of
    text and lots of other properties too. We can change the colour of the text in
    a text box, however it is aligned to the left, right or centre of the enclosing
    box and lots of other things, by updating the XAML that describes the page. The
    actual XAML that describes the display is as follows:


