    \ system, which is managing the execution of your program inside the computer,\
    \ will look for the catching clause. If your program does not contain a catch\
    \ for the exception it will be caught by a catch which is part of the run time\
    \ system. The code in this catch clause will display the exception details and\
    \ then stop the program. Programs can have multiple levels of try – catch, and\
    \ the program will use the catch which matches the level of the code in the try\
