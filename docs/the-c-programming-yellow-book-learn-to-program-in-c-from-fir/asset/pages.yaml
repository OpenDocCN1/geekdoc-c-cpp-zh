    When we get to consider objects we find that this little keyword has all kinds
    of interesting ramifications. But for now I''d be grateful if you just make sure
    that put it here in order to make your programs properly.


    # void


    A void is nothing. In programming the void keyword means that the method we are
    about does not return anything of interest to us. The method will just do a job
    and finish. In some cases we write methods which return a result (in fact we will
    use such a method in the program).


    In order to stop someone else accidentally using the value of returned by our
