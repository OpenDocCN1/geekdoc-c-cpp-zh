  md: '# Advanced Programming


    # Debugging


    Faults which sometimes happen are a pain. What this means that you do not have
    a definite sequence of events which causes the system to fail. This does not mean
    that there is no sequence (unless you are suffering from a hardware induced transient
    of some kind – which is rather rare) that you have not found the sequence.


    An example would be a fault which functions correctly and works at other times.
    You might track this down to the number of pages printed, on the page, or the
    size of the document which is being edited when the print is requested.


    The manifestation of a fault may be after the error itself has actually occurred,
    for example a program may fail when an item is removed from a database, but the
    error may be in the routine which stored the item, or in code which overwrote
    the database lives.


    A fault may change or disappear when the program is changed; errors may overwrite
    completely different parts of the program if the layout of the code changes. This
    can lead to the most annoying kind of fault, where you put in extra statements
    to find out more about the problem, and the problem simply disappears!


    If you suspect such error, your first test is to change the code and layout in
    some way and re-run the program. If the fault changes in nature this indicates
    problems with program or data corrupted.


    # 5.8.2 Bugswating


    You can split faults into other categories, when the program crashes (i.stops
    completely) or when it does the wrong thing. Surprisingly, crashes are often easier
    to find. They usually point to:


    +   - a state which is not catered for (make sure that all selections have a default
    handler which does something and that you use defensive programming techniques
    when values are passed between modules)

    - programs that get stuck into loops, do – while constructions will never fail,
    for loops contain code which changes the control variable, methods that call themselves
    by mistake and recurse their way into stack overflow

    - an exception is not caught properly


    If your program does the wrong thing, this can be harder to find. Look for:


    +   - use of un-initialised members of classes

    - typographical errors (look for incorrectly spelt variable name, incorrect comparison
    operators, improperly terminated comments)

    - logical errors (look for faults in the sequence of instructions, invalid loop
    termination''s, wrongly constructed conditions)


    As I said, some folks are just good at finding bugs. Here are some tips:

    Don''t make any assumptions. If you assume that "the only way to get it here through
    this sequence" or "there is no way that this piece of code could be obeyed" will
    be wrong. Rather than making assumptions, add extra code to prove what you think
    is really happening.


    # Talk to the Duck


    Explain the problem to someone else – even if is just the cat or a rubber duck!
    The act of explaining the problem can often lead you to deduce the answer. It
    is best if the person you are talking to is skeptical of your statements.


    Look at all possible (seemingly unrelated) factors in the manifestation of the
    bug. This is particularly important if the bug is intermittent. If the bug appears
    on Friday afternoons on your UNIX system, find out if another department uses
    the machine to'
