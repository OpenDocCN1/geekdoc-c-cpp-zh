  md: '# Computers and Programs


    # Programs and Programming


    Note that the data processing side of computers, which you might think is entirely
    reading and writing numbers, is much more than that, examples of typical data
    processing applications are:


    **Digital watch**: a micro-computer in your watch is taking pulses from a crystal
    and requests from buttons, processing this data and producing a display which
    tells you the time.


    **Car**: a micro-computer in the engine is taking information from sensors telling
    it the engine speed, road, oxygen content of the air, setting of the accelerator
    etc and producing voltages out which control the setting of the carburtor, of
    the spark etc, to optimise the performance of the engine.


    **CD Player**: a computer is taking from the disk and converting it into the sound
    that you want to hear. At the same time, it is keeping the head precisely positioned
    and also monitoring all the buttons in case you select another part of the disk.


    **Games Console**: a computer is taking instructions from the controllers and
    using to manage the artificial world that it is creating for playing the game.


    Note that some of these data processing applications are merely applying technology
    to existing devices to improve the way they work. However, the CD player and games
    could not be made without built-in data processing ability.


    Most complex devices contain data processing components of their performance and
    exist only because we can be in intelligence. In this world we are, as software
    writers are moving. It is important to think of the business of data processing
    as much more than out the company payroll, reading in numbers and printing out
    results. These are the traditional uses of computers.


    > Note that this "raises the stakes" in the consequences of software failing could
    be very damaging.


    As software engineers it is expected a great deal of work will be spent data processing
    components into other devices to drive them. You will not press a switch to make
    some work will make computer to it work. Embedded systems will make computer users
    of everybody, and we will have to make sure they are not even when there is a
    computer!


    You should also remember that seemingly innocuous programs can have life threatening
    possibilities. For example, a doctor may use a spread to calculate doses of drugs
    for patients. In this case a defect could result in illness or even death (not
    I don''t think that doctors actually do this—but you know.)


    # Programmer''s Point: At the bottom there is always hardware


    It is important that your programs are actually executed by a piece of hardware
    which has physical limitations. You must make sure that the code you write will
    fit in the target market and operate at a reasonable speed. The power and capacity
    of modern computers makes this less of an issue in the past, but you should still
    be aware of these aspects, I will mention them when appropriate.


    # 1.2 Programs and Programming


    I tell you I am "Software Engineer".


    Programming is a black art. It is the kind of thing that you grudgingly admit
    to doing at night with the blinds drawn and nobody watching. Tell people that
    your programs and computers will get one of the following:


    +   1. A blank state.

    2. "That''s interesting", followed by a long description of the double glazing
    that they have just fitted.

    3. Asked to solve every computer problem that they have ever, and will ever have.

    4. A look which indicates that you can''t be very good one as they all drive Ferraris
    and tap into the Bank of England will.'
