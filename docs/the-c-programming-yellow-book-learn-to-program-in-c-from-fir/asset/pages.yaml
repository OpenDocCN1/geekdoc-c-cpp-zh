    \ the member that we need to store about the balance of our bank accounts. Members\
    \ of a class hold a value which describes some data of the class is holding often\
    \ called properties. I've used the decimal type for the account balance since\
    \ this is specifically designed to hold financial values.\n\nWe have seen that\
    \ each of the data items in a class is a member of it. Each time I create an instance\
