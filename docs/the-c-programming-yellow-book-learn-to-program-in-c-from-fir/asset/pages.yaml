  md: '# Simple Data Processing


    # Manipulating Data


    perform will cause data to be lost from the program. It considers every operation
    in terms of "widening and narrowing" values.


    # Widening and Narrowing


    The general principle C# uses is if you are "narrowing" a value it will ask you
    to explicitly tell it that is what you want to do. If you are widening there is
    no problem.


    However, if I change to a bigger case there is no problem. The bigger case will
    take everything that is in the smaller case and have room for more.


    In C# terms "size" of a type ranges (the biggest and smallest) and the precision
    (number of decimal places). This means that if I write:


    ```

    int i = 1;

    float x = i;

    ```


    This works because the floating point type can hold all the values supported by
    the integer type. However:


    ```

    float x = 1;

    int i = x;

    ```


    - would cause the compiler to complain (even though at the moment the variable
    x holds an integer). The compiler is concerned you may be discarding information
    by such an assignment and treats it as an error.


    Note that this applies within floating point values as well, for example:


    ```

    double d = 1.5;

    float f = d;

    ```


    - would cause an error as well, since the compiler knows that a double is wider
    than a float.


    # Casting


    We can force C# to regard a value as being of a certain type by the use of Casting.
    A cast takes the form of an additional instruction to the compiler for it to regard
    a value in a particular way. You cast a value by putting the type you want to
    see there in brackets before it. For example:


    ```

    double d = 1.5;

    float f = (float) d;

    ```


    In the above code the message to the compiler is "I don''t care that this assignment
    could cause loss of information. I, the writer of the program, will take the responsibility
    of making sure the program runs correctly." You can regard casting the compiler''s
    way of washing its hands of the problem. If a program fails because data is lost
    it is not because the compiler did something silly.


    As we saw above, each type of variable has a range of possible values, and the
    range of floating point is much greater than that for integers. This means if
    you do things like:


    ```

    int i = 1;

    i = (int) 123456781234567890.9999;

    ```


    - the cast does not fail the value. The value placed in i will be invalid. In
    C# no checks for mistakes like this. It is up to you to write your program to
    make sure you never exceed the range of the data types you are using - the program
    will not notice but the user will!


    I do not think of this as a failure in C#. It gives you great flexibility, at
    the cost of knowing what you are doing....


    C# Programming Rob Miles 2016


    30'
