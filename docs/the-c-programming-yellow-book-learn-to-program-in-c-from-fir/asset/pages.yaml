  md: "# Creating Programs\n\n# Methods\n\n```\nstatic double readValue (\n  string\
    \ prompt, // prompt for the user\n  double low, // lowest allowed value\n  double\
    \ high // highest allowed value\n){\n  ...\n}\n```\n\nThe method readValue has\
    \ been defined with three parameters. A call of the method must have three argument\
    \ values: a prompt, a low and a high value.\n\nThis means the following call of\
    \ readValue would be rejected by the compiler:\n\n```\nx = readValue(25, 100,\
    \ \"Enter your age\");\n```\n\nThis is because the prompt string must go first,\
    \ followed by the low and high limits for the value to be read.\n\nIf you want\
    \ to make changes and not have to worry about the order of the arguments you can\
    \ name each one:\n\n```\nx = readValue(low:25, high:100, prompt: \"Enter your\
    \ age\");\n```\n\nNow the compiler uses the name of argument, rather than its\
    \ position in the list. This has the side effect of making it much clearer to\
    \ someone reading your code exact meaning each argument value.\n\n# Programmer’s\
    \ Point: I used named arguments\n\nI love this feature of C#. It makes programmers\
    \ clearer and it also means you don't have to scratch your head and wonder if\
    \ the low value is given before the high value when you create the method call.\n\
    \n# Optional Arguments\n\nSometimes the value of an argument might have a sensible\
    \ default value. For example, if we just wanted the readValue to fetch a value\
    \ from the user and not display a prompt we could do this by providing an empty\
    \ string:\n\n```\nx = readValue(low:25, high:100, prompt: \"\");\n```\n\nHowever,\
    \ this is a bit messy. We can change the definition of the method to give a default\
    \ value for the prompt parameter:\n\n```\nstatic double readValue (\n  double\
    \ low, // lowest allowed value\n  double high, // highest allowed value\n  string\
    \ prompt = \"\", // optional prompt for the user\n{\n  ...\n}\n```\n\nWe can now\
    \ call the method and leave the prompt out if we:\n\n```\nx = readValue(25, 100);\n\
    ```\n\nWhen the method runs the prompt will be an empty string if the user doesn't\
    \ provide a value.\n\nNote that I've had to rearrange the order of the parameters\
    \ so that the prompt is the last parameter. Optional parameters must be provided\
    \ after all the required ones.\n\nThere is a potential problem here however. Consider\
    \ this method:"
