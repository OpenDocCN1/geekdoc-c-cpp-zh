  md: "# 4.9.6 Constructors and Hierarchies\n\nA constructor is a method which gets\
    \ control during the process of creation. It is used by a programmer to allow\
    \ initial values to be set into an object:\n\nIn this case we want to create a\
    \ new for a baby Rob Miles with an initial value of 100 points.\n\nThe code above\
    \ work only if the BabyAccount class has a constructor which accepts a string\
    \ as first parameter and a decimal value as the second.\n\nYou might think I could\
    \ solve this by writing a constructor a like this:\n\n```\npublic BabyAccount\
    \ (string inName, decimal inBalance)\n{\n    name = inName;\n    balance = inBalance;\n\
    }\n```\n\nBut the BabyAccount class is an extension of the CustomerAccount class.\
    \ In other words, to make a BabyAccount the program must make a CustomerAccount.\n\
    \nThe first thing we would have to do is add a constructor method to the CustomerAccount\
    \ class that sets the name and the balance for the customer:\n\n```\npublic CustomerAccount\
    \ (string inName, decimal inBalance) : base (inName, inBalance)\n{\n    // set\
    \ the name and the balance\n}\n```\n\n\nThe base keyword is used in the same way\
    \ as this is to call another constructor in the same class. The constructor above\
    \ shows that the Account class CustomerAccount is a child of a constructor which\
    \ accepts two parameters, the string and a second decimal value.\n\n# Constructor\
    \ Hierarchy\n\nWhen considering constructors and hierarchies you must remember\
    \ that when an instance of a child class an instance of the parent must first\
    \ created. This means that a constructor in the parent must run before the constructor\
    \ in the child. In other words, to create a BabyAccount you must first create\
    \ a CustomerAccount. The result of this is that programmers must take use of constructor\
    \ chaining. They must make sure that each level in the creation process a constructor\
    \ is called to set up the class at last.\n\nThis illustrates an issue that you\
    \ have class hierarchies. They can be regarded as \"brittle\" in that they are\
    \ easily broken. Changes in one part of the class hierarchy result in you having\
    \ to make changes to other parts. In the case we had a need idea to improve the\
    \ creating of BabyAccount instances that need up ending needs to the CustomerAccount\
    \ class too.\n\n# Programmer's Point: Design your class construction process\n\
    \nThe means by which your class instances are created is something you should\
    \ design inside the system that you are building. It is part of the overall architecture\
    \ of the system you are building. I think of these things as a bit the girders\
    \ you use to hold the floors and roof of a large building. They tell programmers\
    \ who are going to build the components which are going to implement the solution\
    \ how to create those components. It is of course important that you have these\
    \ designs written down and readily available to the development team."
