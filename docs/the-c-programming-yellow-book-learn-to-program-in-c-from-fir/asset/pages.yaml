    # Debugging


    do a payroll run at that time and fills up all the scratch space, or the loading
    department turn on the big heist and inject loads of noise into the mains


    Leave the problem alone for a while. Go off and doing something different and
    you will find that the answer will appear. Alternatively you might find the answer
    as soon as you come back to the problem.


    Remember that although the bug is of course impossible, it is happening. This
    means that either the impossible is possible, or one of your assumptions is that
    it is impossible!


    Can you get back to a state where the bug was not present, and then look at the
    changes made? If the system is failing as a result of a change or heaven, forbid
    a bug, try to move back to a point where the bug is not, and then introduce the
    changes until the bug appears. Alternatively, look carefully how the introduction
    of the feature affects other modules in the system. Good Source Code Control System
    is very here, in fact it can tell you what actually has changed from one version
    to the next.


    One that I should make at this point is that debugging is that fixing faults in
    a solution which should work. In other words you might know how the program is
    supposed to work but you try to fix problems with what actually it does. I have
    nearly moved towards the side of being or changing the way their conditions operate
    to "see" if this will make the program work". Such efforts are doomed, just throwing
    a bunch of components at the wall and expecting a DVD player to land on the floor
    is also not going to work.


    # Rip it up and start again


    In projects it is possible that the effort involved in starting again is as having
    to find out what is wrong with a broken solution you have created. If you have
    some time off debugging, explain the code to a friend and check all your assumptions
    then maybe, just this might be the best way forward.


    # Programmer''s Point: Bug Fixes Cause Bugs


    The primary cause of bugs is probably the fixing process. This is because when
    you change the program to make one of it work the change you make often breaks
    other features of the system. I have found statistics that "two for one" is frequently
    to be expected, that in every bug will introduce new bugs. The only way and around
    this is to make sure that your process (which you created as a series of lots
    of unit tests) can run automatically after you''ve fixed the fix. This at least
    makes that the fix has not broken anything important.


    # 5.8.3 Making Perfect Software


    There is no such thing as perfect software. One of the rules by which I work is
    "any useful program will have bugs in it". Other I can write programs that I guarantee
    contain no bugs. However, such programs will be very small and therefore not good
    by much. As soon as I create a useful program, with its outputs and behaviors,
    I starting debugging.


    This does not mean that every program I write is useless, unless that it will
    not be perfect. When considering faults you must also consider their impact. Part
    of the job of a project manager in a development is deciding when a program is
    good enough sell, whether or not a fault in the code is a "stopper" or not.


    A stopper is a fault which makes the program un-salable. If the program crashes
    every third times you run it, or someone needs the store of this computer, this
    is probably the behaviour of a stopper. But if it does something like always the
    first page twice if you do a print using the Chinese font and kind of laser printer
    this might be regarded as a problem most could live with.


    C# Programming © Rob Miles 2016


