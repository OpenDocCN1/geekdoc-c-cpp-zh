    # # 1.4.4 Making C# Run


    You actually wrote the program using some form of editor - which may be part of
    the compiling and running system.


    C# is a compiled programming language. The computer cannot understand the language
    directly, so a program called a compiler converts the C# text into low level instructions
    which are much simpler. Low level instructions are in converted into the actual
    commands the hardware which runs your program.


    We will look in more detail at this aspect of how C# programs work a little later,
    for now the thing to remember is that you need to show your C# program to the
    compiler before you get to actually run it.


    A compiler is a very large program which knows how to decide if your program is
    legal. The first thing it does is check for errors in the code that you have used.
    If no errors are found by the compiler it will produce output.


    The compiler will also flag warnings when it notices that you have done something
    which is not technically illegal, but may indicate that you have made a mistake.
    An example of a situation is when you create something but don''t use it for anything.
    The compiler would tell you about this, in case you have forgotten to add a bit
    of your program.


    # # 1.4.5 Creating C# Programs


    Microsoft has used a tool Visual Studio, which is a great place to write programs.
    It provides the compiler along with an integrated editor, and debugger. It is
    provided in a number of versions with different features sets. There is a free
    version, called Visual Studio edition, which is a great place to get started.
    Another free resource is the Microsoft .NET Framework. This provides a bit of
    command line tools, i.e. things that you type to the command prompt, which can
    be used to compile and run C# programs. How you create and run your programs is
    up to you.'
