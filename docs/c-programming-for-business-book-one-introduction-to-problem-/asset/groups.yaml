    # Chapter Three – Processing


    # Bomdas Rules


    +   - Brackets

    - Order

    - Multiplication

    - Division

    - Addition

    - Subtraction


    The *Bomdas* mnemonic is sometimes known as *Bodmas*. This rule states to work
    out *brackets* first, then the order is *multiply and divide* before *adding*
    and subtracting. A computer and calculator will follow these rules. But if working
    out manually, some problems may result. For example


    9 / 3 * 6


    Is nine divided by three and the resulting three multiplied by six, providing
    an answer of 18. Or is three multiplied by six and the resulting 18 divided into
    nine giving 0.5. Whilst a computer or calculator will process correctly, the solution
    is not always straightforward. **Bomdas** suggests division before multiplication.
    But Bomdas** suggests multiplication before division. Using both mnemonics will
    provide different answers.


    The rule is: division and multiplication are treated the same. To solve, you move
    from left to right for multiplication and division. In the above example, nine
    is divided by three and the resulting three is multiplied by six.


    # Examples of data manipulation


    | 9/3 * 6 = | 9/3 * 6 = | 9/(3 * 6) = |

    |--- | --- | --- |

    | 18 | 0.5 | 0.5 |

    | ☑ | ☑ | ☑ |

    | 2 + 3 * 4 = | 2 + 3 * 4 = | (2 + 3) * 4 = |

    |--- | --- | --- |

    | 14 | 20 | 20 |

    | ☑ | ☑ | ☑ |'
