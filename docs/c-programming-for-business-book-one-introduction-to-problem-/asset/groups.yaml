    # Error Correcting


    Omitted Semicolon

    Expect errors in program design. The following code contains an error when run.


    ```

    firstCHIPProgram.c

    1 #include <stdio.h>

    2 main()

    3 (

    4     printf("Hi")

    5     getch();

    6 )

    7

    ```


