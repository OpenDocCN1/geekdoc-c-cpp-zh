    \ }\n33:\n34: //Circumference Function\n35: int circumference(int radius)\n36:\
    \ {\n37:     float pi = 3.142;\n38:     return (2 * pi * radius);\n39: }\n40:\n\
    41: //End of functions\n42:\n```\n\n# Commentary\n\nTwo functions exist, one for\
    \ computing diameter of a circle, the other circumference - lines 28 to 39. Integer\
    \ declarations for diameter and circumference are declared within each function\
    \ (lines 29 and 35). The integer radius is declared in line 15 and scanned to\
    \ memory in line 18. The functions are called in lines 13 to 26 and returned from\
    \ lines 28 to 39.\n\nQ7.2. Extend the above program to create a function for the\
    \ area of the circle.\n\n# Epilogue\n\nIf the reader has enjoyed or benefited\
    \ from book one, they may want to consider books two or three in the series C\
    \ Programming For Business.\n\n# Book 2\n\nBook two deals with applying much of\
    \ one to business problems. But the reader should be familiar with some business\
    \ maths, statistics and finance. Areas where programming is applied include forecasting,\
    \ financial management, HR management, simple profit and loss statements and ratios,\
    \ methods of depreciation, probability theories, and games. Knowledge of loops,\
    \ data types and processing from book one is essential.\n\nA section shows how\
    \ for loops may compute and compare straight line, reducing balance and sum of\
    \ digits depreciation. The user inputs an asset's cost and its expected life in\
    \ years. As a result, C computes depreciation each year from a variety of depreciation\
    \ methods.\n\nA chapter dedicated to forecasting comprises loops and nested loops.\
    \ Beginning first with while, these advance to for safeguarding data entry. For\
    \ example, for loops ensuring that quantity of data items input is as intended\
    \ and while loops ensuring data values are within a relevant range. Formulae for\
    \ straight line graphs, eg y = mx + c or y = a + bx and polynomials, eg a = bx²\
    \ are applied to business situations. More complicated formulae are applied for\
    \ computing b, a and r values for forecasting - values used and understood by\
    \ business consultants. Some knowledge of correlation and regression is required.\n\
    \nA chapter takes tables loops and develops these further to compute discount\
    \ and annuity values. From these, a chapter is devoted to capital investment appraisal.\
    \ Loops are used to compute discount values from user input of a user-specified\
    \ discount factor - a percentage. Discount values are multiplied by respective\
    \ estimated cash flows and then a net present value for decision making. Programs\
    \ begin with user inputting all values (year, estimated cash flows and discount\
    \ values from hard copy tables they themselves provide). Then advance to a user\
    \ writing their own program for discount tables. From these values are input against\
    \ respective year's cash flow. The program is developed even further to auto-computing\
    \ discount values within a for loop allowing input of cash flows only. The user\
    \ inputs a discount value – a percentage – then cash flows. The program computes\
    \ everything else, including internal rates of return. A while loop allows a user\
    \ to change discount factors to interpolate a more accurate internal rate of return.\
    \ Sale and leaseback, and computation of expected values is also looked at. Previous\
    \ knowledge of the discounted cash flow model is required.\n\nA case study for\
    \ a vending machine shows how quantities of coins are calculated. Loops allow\
    \ for intake of coins and change given. Management reports are available where\
    \ management may gain access to information, eg stocks of various coins available,\
    \ stocks of coffee available, re-order quantities, etc. The program combines loops\
    \ with alpha-numeric password protection introducing the programmer to Strcmp\n\
    \nDatabases stored in permanent and temporary memory are designed. Structures\
    \ are looked at in a human resource database stored in temporary memory, using\
    \ password protection, and combining several data types: char, int, DATE, for\
    \ computation of redundancy payments according to redundancy law with computations\
    \ based on the Redundancy Payments Acts 1967-2003. An electronic phonebook stored\
    \ in permanent memory and combining loops with switch statements introduces the\
    \ reader to pointers and file creation.\n\nNormal and Poisson distributions and\
    \ learning curve theory applies knowledge of data types, processing and loops.\
    \ Pay-slips are processed with combinations of income tax types and bands.\n\n\
    The famous matches game is taken from the factory canteen to the computer. Players\
    \ may pit their wits against the computer in a game that involves 17 digital matches.\
    \ Both player and computer take turns to pick one to three matches, so reducing\
    \ the number of matches available. Person to pick last match loses.\n\n# Book\
    \ 3\n\nDevoted to arrays in business and problem solving not covered in books\
    \ one or two, the reader should be familiar with all of book one and with popular\
    \ topics in Business Finance. Areas looked at where loops on their own are insufficient,\
    \ for example in assessing risk of investments. Knowledge of arrays, capital investment\
    \ appraisal and standard deviations introduced in book one is required. Book Three\
    \ combines loops and arrays from book one and two to discounted cash flows, where\
    \ a series of projects may be evaluated with summary data printed in tabular format.\
    \ Expected values are written as a series of cash flows with associated outcome\
    \ are looked at where standard deviation, variation and coefficient of variation\
    \ computed. Invaluable figures for business consultants.\n\nVariable costing is\
    \ discussed. A user may specify a quantity of product lines, input sales values\
    \ and variable costs for each. Then fixed costs. The program is designed to compute\
    \ break even points, contribution to sales ratios and margins of safety for each\
    \ product range. The reader must be familiar with arrays, for loops, variable\
    \ costing and break even analysis.\n\nPay-slip preparation is extended to include\
    \ character arrays and a selection of loops to generate a user-determined number\
    \ of payslips with firstname, lastname and various tax bands. Examples discussed\
    \ in book one and two are combined. As a result, pay-slip preparation comprises\
    \ character arrays for employees' names, while loops for data input accuracy and\
    \ for a specific number of employees.\n\nA section applies arrays to graphic content,\
    \ where horizontal bar charts are printed to screen to present data visually.\
    \ Programs are written to solve problems using the Binomial Distribution.\n\n\
    Guess a number game is extended. A case study looks in detail at pitfalls of early,\
    \ inadequate design of a lot program, how random numbers are generated and how\
    \ to avoid duplication. Loops and arrays are combined with some of the most advanced\
    \ areas of C for correct program design. To be fair to players, the chapter is\
    \ extended to cover comprehensively the probability of winning the lot using loops,\
    \ arrays and probability theory. True to good nature, the programmer will prey\
    \ on the weaknesses of the gambler too much with built in safeguards in program\
    \ design allowing a gambler to play a limited number of times with a maximum bet\
    \ limits. The lotto game is looked at holistically, something never included in\
    \ any language in the history of programming.\n"
  mdcn: "\n\n# 代码\n\n```\n1: //程序目标 - 使用函数计算圆的属性/\n2: #include <stdio.h>\n3: \n4:\n\
    5: main()\n6: {\n7: getRadius();\n8: \n9: printf(\"\\nProgram End\\n\");\n10:\
