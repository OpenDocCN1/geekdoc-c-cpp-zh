- md: "\n## CHAPTER TWO – DATA TYPES\n\n### Other Data Types\n\nAs well as declaring\
    \ data types of int or float, they may be declared as follows:\n\n| Data Type\
    \ | Occupation of Memory (bytes) | Displayed | Numeric range |\n| --- | --- |\
    \ --- | --- |\n| long int | 4 | %d or %i | -2,147,483,648 to 2,147,483,647 |\n\
    | long | 4 | %ld (ie alpha 1 for not numeric 1) | -2,147,483,648 to 2,147,483,647\
    \ |\n| short int | 2 | | -32,768 to 32,767 |\n| short | 2 | | -32,768 to 32,767\
    \ |\n| unsigned long | 4 | No negative values allowed but an increase in positive.\
    \ | 0 – 4,294,967,295, ie double a positive values of long but minus numbers |\n\
    | unsigned int | 4 | No negative values allowed but an increase in positive. |\
    \ 0 to 65,535, ie double short's positive range |\n| float | 4 | %f. | Properties\
    \ unspecified |\n| double | 8 | %lf (ie alpha 1 not numeric 1) | Properties unspecified\
    \ |\n| char | 1 | %s | One or a series of alpha values, eg a person's name |\n\
    \nDoubles allow floating point decimals to be more precise than floats and integers\
    \ require larger memory storage. The remaining data types may be used in specific\
    \ situations. A employee or works number might be declared as unsigned long.\n\
    \n## CHAPTER TWO - DATA TYPES\n\n### Example\n\nScreen Input and Output in Program\n\
    \n![](img/d66aad4cac4279bfe1f0f55cccf5946a_43_0.png)\n\n```c\n1: /*Program Aim:\
    \ Show the Difference of Floats and Doubles*/\n2: #include <stdio.h>\n3: void\
    \ main() {\n4: \n5: float f, g, h=0;\n6: double x, y, z=0;\n7: \n8: printf(\"\
    Data Entry Showing Behaviour of Floats\\n\");\n9: printf(\"\\nEnter float: %f\\\
    t\");\n10: scanf(\"%f\", &f);\n11: printf(\"Enter float g: \\t\");\n12: scanf(\"\
    %f\", &g);\n13:\n14: h = f/g;\n15: printf(\"\\nFloat h = \\t%0.16f\", h);\n16:\n\
    17: printf(\"\\nData Entry Showing Behaviour of Doubles\");\n18: printf(\"\\nEnter\
    \ double x: \\t\");\n19: scanf(\"%lf\", &x);\n20: printf(\"\\nEnter double y:\
    \ \\t\");\n21: scanf(\"%lf\", &y);\n22:\n23: z = x/y;\n24: printf(\"\\nDouble\
    \ z = \\t%0.16f\", z);\n25:\n26: getch();\n27:\n28: }\n```\n\nIn the above, lines\
    \ 15 and 24 have allowed floating point to sixteen decimal places with the code\
    \ %0.16f and %0.16lf. However it is z that is the more accurate to sixteen decimal\
    \ places. Float h loses its accuracy at eight decimal places, double z continues\
    \ to be accurate at sixteen decimal places.\n\nAny program that requires processing\
    \ of data not exceeding seven decimal places, floats rather than doubles should\
    \ be used as less memory is consumed.\n\n## CHAPTER TWO – DATA TYPES\n\nQ2.3.\
    \ Although the code below appears to run satisfactorily, there is a problem with\
