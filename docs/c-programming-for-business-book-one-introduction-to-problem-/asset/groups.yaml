    \ \\n\");\n8: printf(\"\\nhotenuse = %f, Opposite = %f, Adjacent = %f\\\n```\n\
    \n### Commentary\nThe above program is for computing the length of a side of a\
    \ right angled triangle lengths the other sides are known. In this case, the program\
    \ is prompted to enter the side they want. A hypotenuse requires h to be entered.\
    \ If an adjacent, a. If an opposite, o. The program is designed to allow input\
    \ of upper or lower case. Once an alpha character is input, the user is then prompted\
    \ to enter values for the remaining sides of the triangle. The computer\n\n##\
    \ CHAPTER FOUR – FLOW CONTROL\nthen computes the unknown side using Pythagoras’s\
    \ theorem. Lines 21, 34, and 47 contains formulae for computing. All triangle\
    \ sides have been declared as floats - line 6.\n\nLine 21 has been designed so\
    \ that each of the two sides are squared before adding, then square rooting. For\
    \ example, 3 is squared, then 4 is squared. The resulting 9 and 16 are added to\
    \ provide 25. The 25 is then square rooted.\n\nRemember $3^2 + 4^2$ is not the\
    \ same as $7^2$. Design and positioning of parentheses is important. 21, 34 and\
    \ 47 contains an additional function $sqrt$. This means square root. This function\
    \ works similar to $exp(log(25)/2)$.\n\n## CHAPTER FOUR – FLOW CONTROL\n\n###\
    \ Summary of Switch and If, else if, else\n\nswitch works with a numeric or single\
    \ alpha character. if, else if, else works with ranges of values. Speed of processing\
    \ is superior with a switch in specific situations as switch jumps to the switch\
    \ number and ignores preceding and succeeding code within the switch section of\
    \ code. switch may look neater and better organized.\n\nA grades problem with\
    \ a range of marks ranging zero to one hundred, then if, else if, else is more\
    \ suitable as this minimizes code. For example, four lines of code are used in\
    \ the statement\n\n```\nif (mark >=40 && mark <50)\n{\n    printf(\"You got grade\
    \ D\");\n}\n```\n\nCompared to a switch requiring 14 lines of code.\n\n```\nSwitch\
    \ (mark)\n{\n    case 40:\n    case 41:\n    case 42:\n    case 43:\n    case\
    \ 44:\n    case 45:\n    case 46:\n    case 47:\n    case 48:\n    case 49:\n\
    \    printf(\"nYou got a D\");\n    break;\n```\n"
