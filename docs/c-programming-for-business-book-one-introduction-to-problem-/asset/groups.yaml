- md: "\n# WILLIAM KANE\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_0_0.png)\n\n#\
    \ C PROGRAMMING FOR BUSINESS\n\nBOOK ONE: INTRODUCTION TO PROBLEM SOLVING IN C\
    \ LANGUAGE\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_1_0.png)\n\nhttps://archive.org/details/cprogrammingforb0000kane\n\
    \n# C Programming For Business\n\nBook One: Introduction to Problem Solving\n\
    in C C Language\n\nWilliam Kane\n\nCopyright © William Kane, 2017\n\nFirst Published\
    \ in Ireland, in 2017, in co-operation with\nChoice Publishing, Drogheda, County\
    \ Louth,\nRepublic of Ireland.\nwww.choicepublishinging.ie\n\nPaperback ISBN:\
    \ 978-1-911131-32-8\n\nAll rights reserved. No part of this publication may be\
    \ reproduced, stored in a retrieval system, transmitted in any\nform, or by any\
    \ means, electronic, mechanical, photocopying, recording or otherwise, without\
    \ the prior permission\nof the copyright holder.\n\nA CIP catalogue record for\
    \ this book is available from the National Library.\n\n# Dedication\n\nTo Anna\
    \ Maguire, Brian Downey and Dublin City VEC\n\n# Acknowledgments\n\nTo the staff\
    \ of Choice Publishing\n\n# Table of Contents\n\n* Chapter One – Introduction\
    \ 01\n* Chapter 2 – Data Types 11\n* Chapter 3 – Processing 59\n* Chapter 4 –\
    \ Flow Control 79\n* Chapter 5 – Loops 137\n* Chapter 6 – Arrays 205\n* Chapter\
    \ 7 – Functions 237\n* Epilogue 249\nAppendix One Answers 253\nAppendix Two Download\
    \ C 269\nIndex 283\n\n## Chapter One - Introduction ...................................................................................\
    \ 2\nSaving a C Program......................................................................................................\
    \ 2\nProgram to Output a Blank Screen...............................................................................\
    \ 3\nMy First Program ................................................................................................\
    \ 4\nLine Numbering .................................................................................................\
    \ 6\nError Correcting .................................................................................................\
    \ 7\nOmitted Semicolon.............................................................................................\
    \ 7\nPositioning of Code...........................................................................................\
    \ 8\nCommenting Code................................................................................................\
    \ 9\n\n## Saving a C Program\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_9_0.png)\n\
    \nClick Compile & Run Icon\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_9_1.png)\n\
    \n- Give a suitable name and ensure that this is saved as a .c file.\n- The Compile\
    \ & Run icon is also used to run a program already saved.\n\n# CHAPTER ONE - INTRODUCTION\n\
    \nAll programs discussed in all chapters contain the following code as a minimum.\n\
    \n```c\n#include <stdio.h>\nmain()\n{\n  getch();\n}\n```\n\n# Program to Output\
    \ a Blank Screen\n\nScreen Input and Output Program\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_10_0.png)\n\
    \nCommentary\nThe opening line consists of a hash, #, immediately followed by\
    \ the word include. Then a space. Then opening and closing angle brackets with\
    \ the phrase stdio.h in lower case inside. This line is really saying to include\
    \ the standard input output library file – a file included in C's download. Without\
    \ inclusion of this header file, programs will not run. It is important not to\
    \ confuse angle brackets with parenthesis, square brackets or braces for programs\
    \ to run correctly.\n\nLine two of code comprises the phrase main() in lower case.\
    \ Opening and closing parenthesis, ie round brackets, conclude this short statement.\
    \ main refers to the main part of the program that will follow immediately inside\
    \ the braces underneath main(). Navigating from one line to the next is achieved\
    \ by pressing Enter on the keyboard.\n\nFollowing this main() line, opening and\
    \ closing braces, ie curly brackets, with the phrase getch(); in this phrase stands\
    \ for characters is in lower case. The opening and closing parenthesis immediately\
    \ after getch() are followed by a semi-colon. The phrase getch(); is required\
    \ for almost all programs run in C. This line of code is usually located to the\
    \ end of program's code which will part of the program and always before the last\
    \ brace. Whilst programs run in C without getch the output will not always be\
    \ printed to screen. A semi-colon concludes the getch(); statement within the\
    \ main() part of the program in the above. A semi-colon is important for concluding\
    \ many lines of code. An omitted semi-colon will result in syntax error. As a\
    \ result, code requires correcting.\n\n# My First Program\n\n```c\n#include <stdio.h>\n\
    main()\n{\n    printf(\"Hi\");\n    getch();\n}\n```\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_11_0.png)\n\
    \n# Commentary\nIn the above example, line 4 contains what is printed to screen.\
    \ In this case \"Hi\". In line 4 this specific example, it does not matter what\
    \ is inside quotation marks; it could be \"Hi world!\". What is inside quotation\
    \ marks will print to screen, providing all other lines of code are accurate and\
    \ in their correct order. Lines 3 and 6 consist of opening and closing braces.\
    \ Note their position. Both are at the same location on their respective lines,\
    \ ie vertical to each other. This makes code easy to read. Had one of these braces\
    \ been indented and the other not, the program would still have ran. However,\
    \ ensuring that a closing brace is located at the same indentation to its opening\
    \ brace makes code friendly. By looking at the code above and looking at the closing\
    \ brace in line 6, a person can quickly deduce that its opening brace is at line\
    \ 3. When code becomes more elaborate, it is important to have opening and closing\
    \ braces located connection to each other, ie vertical, to identify and correct\
    \ errors. For every opening brace, there must be a closing brace.\n\n# Line Numbering\n\
    \nLine numbering makes code easy to read and, as a result, easy to correct. To\
    \ ensure code is line numbered, select Tools – Editor – Display. Toggle on Line\
    \ Numbers and click OK.![](img/d66aad4cac4279bfe1f0f55cccf5946a_13_0.png)\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_13_1.png)\n\
    \nPrograms now now look as follows, line numbering to the left.\n\n```c\nfirstProgram08072017.c\n\
    1 #include <stdio.h>\n2 main()\n3 (\n4     printf(\"Hi\");\n5     getch();\n6\
    \ )\n7\n```\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_14_0.png)\n\n# Error Correcting\n\
    \nOmitted Semicolon\nExpect errors in program design. The following code contains\
    \ an error when run.\n\n```c\nfirstProgram.c\n1 #include <stdio.h>\n2 main()\n\
    3 (\n4     printf(\"Hi\")\n5     getch();\n6 )\n7\n```\n\n| Compiler | Resources\
    \ | Compile Log | Debug | Find Results | Close |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| Line | File | Message | | | |\n| | E:\\BookC\\Draft1\\ChapterOne\\\
    First... | In function 'main' | | | |\n| 5 | E:\\BookC\\Draft1\\ChapterOne\\First...\
    \ | syntax error before \"getch\" | | | |\n\nLine 5 is highlighted. Underneath,\
    \ the statement, syntax error before \"get\". To its left the number 5 in the\
    \ column. This statement tells us that a syntax error exists immediately before\
    \ get(); in line 5. Looking closely, we see a semi-colon is absent from line 4's\
    \ code immediately after get(); A semi-colon is necessary to terminate line 4.\
    \ Inputting a semi-colon to end line 4s printf(\"Hi\"); will correct the error\
    \ and cause the program to run smoothly.\n\n# Positioning of Code\n\nTwo items\
    \ are needed for positioning code. Backslash and t, \\t, and backslash and n.\
    \ Both tabulation and new line are important for presentation and printing to\
    \ screen.\n\n```c\nfirstProgram08072017.c\n1 #include <stdio.h>\n2 main()\n3 (\n\
    4 printf(\"\\tHi\");\n5 getch();\n6 )\n7 ?\n```\n\n```c\nfirstProgram08072017.c\n\
    1 #include <stdio.h>\n2 main()\n3 (\n4 printf(\"\\nHi\");\n5 getch();\n6 )\n7\
    \ ?\n```\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_15_0.png)\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_15_1.png)\n\
    \n\\t in Line 4 tabulates to the right\n\\n in Line 4 creates a new line or line\
    \ break\n"
  mdcn: "\n\n# 威廉·凯恩\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_0_0.png)\n\n# 商务人士\
    \ C 语言编程\n\n第一卷：C 语言解决问题导论\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_1_0.png)\n\
    \nhttps://archive.org/details/cprogrammingforb0000kane\n\n# 商务人士 C 语言编程\n\n第一卷：C\
    \ 语言解决问题导论\n\n威廉·凯恩 (William Kane)\n\n版权 © William Kane, 2017\n\n2017年于爱尔兰首次出版，由位于爱尔兰共和国卢斯斯郡德罗格赫达的\
    \ Choice Publishing 出公司合作出版。\nwww.choicepublishinging.ie\n\n平装本 ISBN：978-1-911131-32-8\n\
    \n版权所有。未经版权持有者事先许可，本书的任何部分不得以任何形式或通过任何方式（电子、机械、复印、录制或其他）进行复制、存储在检索系统中或传输。\n\n\
    国家图书馆提供此书的 CIP 图书记录。\n\n# 献辞\n\n致 Anna Maguire, Brian Downey 以及都柏林职业教育委员会 (VEC)\n\
    \n# 致谢\n\n致 Choice Publishing 的全体员工\n\n# 目录\n\n* 第一章 – 引言 01\n* 第2章 – 数据类型 11\n\
    * 第3章 – 处理 59\n* 第4章 – 流程控制 79\n* 第5章 – 循环 137\n* 第6章 – 数组 205\n* 第7章 – 函数 237\n\
    * 结语 249\n 附录一 答案 253\n 附录二 下载 C 269\n 索引 283\n\n## 第一章 - 引言 ...................................................................................\
    \ 2\n保存 C 程序......................................................................................................\
    \ 2\n输出空白屏幕的程序...............................................................................\
    \ 3\n我的第一个程序 ................................................................................................\
    \ 4\n行号编号................................................................................................s\
    \ 6\n错误纠正................................................................................................\
    \ 7\n遗漏的分号.............................................................................................\
    \ 7\n代码的位置...........................................................................................\
    \ 8\n代码注释................................................................................................\
    \ 9\n\n## 保存 C 程序\n\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_9_0.png)\n\n点击“编译并运行”图标\n\
    \n![](img/d66aad4cac4279bfe1f0f55cccf5946a_9_1.png)\n\n- 赋予一个合适的名称并确保其被保存为 .c\
    \ 文件。\n- “编译并运行”图标也用于运行已保存的程序。\n\n# 第一章 - 引言\n\n所有章节中讨论的所有程序至少包含以下代码。\n\n```c\n\
    #include <stdio.h>\nmain()\n{\n  getch();\n}\n```\n\n# 输出空白屏幕的程序\n\n屏幕输入输出程序\n\
    \n![](img/d66aad4cac4279bfe1f0f55cccf5946a_10_0.png)\n\n评注\n第一行由一个井号 # 开始，紧接着是单词\
    \ include。然后是一个空格。然后是左、右角括号，里面是小写的字母 stdio.h。这一行代码实际上的意思是包含标准输入输出库文件——这是 C 的下载包中包含的一个文件。如果不包含此头文件，程序将无法运行。重要的是，不要将角括号与括号、方括号或大括号混淆，以确保程序正确运行。\n\
    \n代码的第二行包含小写的短语 main()。左、右圆括号（即圆括号）结束了这个短句。main 指的是程序的主体，该部分将紧跟在 main() 下方的大括号内部。通过按下键盘上的\
    \ Enter 键可以从一行移动到下一行。\n\n紧接 main() 这一行之后，是左、右大括号（即花括号），短语为 `getch()`，其中 getch\
    \ 表示“字符”，且是小写的。`getch()` 紧后的左、右圆括号之后是一个分号。几乎所有在 C 中运行的程序都需要 `getch();`。这行代码通常位于程序代码的末尾，它是程序的一部分，并且始终位于最后一个大括号之前。虽然\
    \ C 程序可以在没有 getch 的情况下运行，但输出并不总是打印到屏幕上。分号结束了上方程序 main() 部分中的 `getch();` 语句。分号对于结束许多行代码至关重要。遗漏分号会导致语法错误。因此，代码需要纠正。\n\
    \n# 我的第一个程序\n\n```c\n#include <stdio.h>\nmain()\n{\n    printf(\"Hi\");\n    getch();\n\
    }\n```\n![](img/d66aad4cac4279bfe1f0f55cccf5946a_11_0.png)\n\n# 评注\n在上面的示例中，第4行包含了打印到屏幕上的内容。在这种情况下是\
    \ \"Hi\"。在这一特定的第4行中，引号内包含什么并不重要；它可以是 \"Hi world!\"。引号内的内容将打印到屏幕上，前提是所有其他行代码都是准确且顺序正确的。第3行和第6行由左、右大括号组成。注意它们的位置。它们在各自的行中处于相同的位置，即垂直对应。这使得代码易于阅读。\n\
    \n# 行号编号\n\n行号使得代码易于阅读。要启用行号，选择工具 (Tools)– 显示 (Display)– 开启行号。(img/d66aad4cac4279bfe1f0f55cccf5946a_13_0.png)\n\
    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_13_1.png)\n\n程序现在看起来如下：\n\n```c\nfirstProgram08072017.c\n\
    1 #include <stdio.h>\n2 main()\n3 (\n4     printf(\"Hi\");\n5     getch();\n6\
    \ )\n```\n\n# 错误纠正\n\n遗漏分号会遇到错误。以下代码在运行时包含一个错误。\n\n```c\nfirstProgram.c\n1 #include\
    \ <stdio.h>\n2 main()\n3 (\n4     printf(\"Hi\")\n5     getch();\n6 )\n```\n\n\
    | 编译器 | 资源 | 编译日志 | 调试 | 结果 |\n| :--- | :--- | :--- | :--- | :--- |\n| 行 | 文件\
    \ | 消息 | | |\n| | E:\\BookC\\Draft1\\ChapterOne\\First... | 在函数 'main' 中 | | |\n\
    | 5 | E:\\BookC\\Draft1\\ChapterOne\\First... | \"getch\" 之前的语法错误 | | |\n\n第5行被高亮。在下方语句中，\"\
    getch\" 之前有错误。在其左侧是数字 5。该语句告诉我们在 getch(); 之前存在语法错误。仔细观察，我们发现第4行缺少了分号。在第4行的 printf(\"\
    Hi\"); 之后输入分号将修复错误并使程序正常运行。\n\n# 代码的位置\n\n代码的位置需要两个项目。反斜杠和 t，\\t，以及反斜杠和 n，\\n。所有的制进和换行对于演示和打印到屏幕都非常重要。\n\
    \n```c\nfirstProgram08072017.c\n1 #include <stdio.h>\n2 main()\n3 (\n4 printf(\"\
    \\tHi\");\n5     getch();\n6 )\n7 ?\n```\n\n```c\nfirstProgram08072017.c\n1 #include\
    \ <stdio.h>\n2 main()\n3 (\n4 printf(\"\\nHi\");\n5     getch();\n6 )\n7 ?\n```\n\
    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_15_0.png)\n\n"
