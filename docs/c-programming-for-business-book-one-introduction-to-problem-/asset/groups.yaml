    \ than a simple If, Else is recommended. Should an outcome result from a range\
    \ of values, eg grade A is between 60 and 70 then If, Else, Else statements are\
    \ used. Another reason for using Switch over if, else else in specific situations\
    \ is presentation. Switch statements are very reader friendly.\n\n## CHAPTER FOUR\
    \ — FLOW CONTROL\n\nHow code is read by a compiler differs in switch over If,\
    \ else if, else statements. When a specific case is input, eg 2 for Tuesday, the\
