    \n## 第三章 – 处理\n\n### Bomdas 规则\n\n- 括号 (Brackets)\n- 顺序 (Order)\n- 乘法 (Multiplication)\n\
    - 除法 (Division)\n- 加法 (Addition)\n- 减法 (Subtraction)\n\n*Bomdas* 助记法有时被称为 *Bodmas*。这条规则规定先处理*括号*，然后按照顺序进行*乘除*，最后才是*加减*法运算。计算机和计算器会遵循这些规则。但如果手动计算，可能会出现问题。例如\n\
    \n9 / 3 * 6\n\n是 9 除以 3 得到的 3 乘以 6，答案为 18。还是 3 乘以 6 得到的 18 除以 9 得到 2*？虽然计算机或计算器会正确处理，但解决方案并不总是直观的。**Bomdas**\
    \ 建议先除后乘。但 **Bomdas** 也建议先乘后除。使用这两种助记法会得到不同的答案。\n\n规则是：除法和乘法被同等对待。解决时，乘法和除法应从左到右进行。在上面的示例中，9\
    \ 除以 3，得到的 3 乘以 6。\n\n## 数据操作示例\n\n| 9/3 * 6 = | 9/3 * 6 = | 9/(3 * 6) = |\n|\
    \ :--- | :--- | :--- |\n| 18 | 0.5 | 0.5 |\n| ☑ | ☑ | ☑ |\n| 2 + 3 * 4 = | 2 +\
    \ 3 * 4 = | (2 + 3) * 4 = |\n| :--- | :--- | :--- |\n| 14 | 20 | 20 |\n| ☑ | ☑\
    \ | ☑ |\n\n## 第三章 - 处理\n\n这一切对于在 C 语言中设计解决问题的方程至关重要。一个方程看起来没问题，但实际上可能有问题。\n\n\
    ## 使用 Bomdas 处理的数据\n程序和屏幕输入输出\n\n```\nabcdefghijkWORKS14092016.c\n3 main() {\n\
    4     (\n5      float a, b, c, d, e, f, g, h, j, k = 0;\n7      printf(\"Enter\
    \ a: \");\n8      scanf(\"%f\", &a);\n9      printf(\"Enter b: \");\n10     scanf(\"\
