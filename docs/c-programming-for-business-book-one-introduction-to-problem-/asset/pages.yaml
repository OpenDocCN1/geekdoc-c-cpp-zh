  md: '# CHAPTER ONE - INTRODUCTION


    # Commenting Code


    Code may be commented. This goes unheard by the computer. To comment, place two
    forward slashes // at the beginning of a commenting line. Everything to the right
    of the forward slashes in that line is ignored during compiling. Should comments
    run a number of lines, two forward slashes may be used for each line. Alternatively,
    a forward slash and asterisk /* may be used to begin the commenting. Then an asterisk
    and forward slash */ to end.


    Example

    //This line of code will not be read but will be visible to programmer.


    /*This section of code will not be read but will be visible to programmer. It
    allows a programmer to input notes explaining code. For example where a section
    of code begins, where a section ends, another section begins and another section
    ends. When code runs several pages, this makes it easier for programmers to work
    */


    ```

    firstCHProgramWithComments.c

    1 //My first C Program

    2 #include <stdio.h>

    3 main(

    4 (

    5     printf("Hi");

    6     getch();

    7 )

    8

    9     /*My first C program

    10 has been a

    11 success*/

    ```


    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_16_0.png)'
