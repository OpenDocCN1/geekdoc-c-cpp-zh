  md: '# CHAPTER FIVE - LOOPS


    # Commentary


    In the above do loop, execution of the loop takes place regardless of the input.
    Clearly, a denominator of two is input. This should mean six is divided by two
    providing an answer of three. However, when the program is run first time round,
    we get a line of output *Cannot divide by zero*, despite the denominator entered
    not being zero. This is as a result of the *do while loop*. The while statement
    at the end of the loop in line 19 is not read by the compiler until the loop –
    lines 13 to 19 iterates once, irrespective of input. In this specific situation,
    the *do while loop* is unsuitable. Only the *while* works for this specific example
    of dividing a numerator where the denominator must not be zero.


    The only differences between the above two programs are two lines, 13 and 19.
    Note, the *while* line of a *do while* ends with a semi-colon, the *while* line
    of a *while loop* does not.


    **Q5.9.** Design a program with two questions. Each question has a choice of four
    answers and must be answered correctly before proceeding to the next question.
    Once the two questions have been answered correctly, the program prints a statement
    stating Program End.'
