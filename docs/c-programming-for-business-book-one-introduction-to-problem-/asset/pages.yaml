  md: 'respective year''s cash flow. The program is developed even further to auto-computing
    discount values within a for loop allowing input of cash flows only. The user
    inputs a discount value – a percentage – then cash flows. The program computes
    everything else, including internal rates of return. A while loop allows a user
    to change discount factors to interpolate a more accurate internal rate of return.
    Sale and leaseback, and computation of expected values is also looked at. Previous
    knowledge of the discounted cash flow model is required.


    A case study for a vending machine shows how quantities of coins are calculated.
    Loops allow for intake of coins and change given. Management reports are available
    where management may gain access to information, eg stocks of various coins available,
    stocks of coffee available, re-order quantities, etc. The program combines loops
    with alpha-numeric password protection introducing the programmer to Strcmp


    Databases stored in permanent and temporary memory are designed. Structures are
    looked at in a human resource database stored in temporary memory, using password
    protection, and combining several data types: char, int, DATE, for computation
    of redundancy payments according to redundancy law with computations based on
    the Redundancy Payments Acts 1967-2003. An electronic phonebook stored in permanent
    memory and combining loops with switch statements introduces the reader to pointers
    and file creation.


    Normal and Poisson distributions and learning curve theory applies knowledge of
    data types, processing and loops. Pay-slips are processed with combinations of
    income tax types and bands.


    The famous matches game is taken from the factory canteen to the computer. Players
    may pit their wits against the computer in a game that involves 17 digital matches.
    Both player and computer take turns to pick one to three matches, so reducing
    the number of matches available. Person to pick the last match loses.'
