  md: '# Book 3


    Devoted to arrays in business and problem solving not covered in books one or
    two, the reader should be familiar with all of book one and with popular topics
    in Business Finance. Areas looked at include where loops on their own are insufficient,
    for example in assessing riskiness of investments. Knowledge of arrays, capital
    invest appraisal and standard deviations introduced in book one is required. Book
    Three combines loops and arrays from book one and two to discounted cash flows,
    where a series of projects may be evaluated with summary data printed in tabular
    format. Expected values are written as a series of cash flows in format of potential
    cash flows with associated outcome are looked at where a, standard deviation,
    variation and co-efficient of variation computed. Invaluable figures for business
    consultants.


    Variable costing is discussed. A user may specify a quantity of product lines,
    input sales values and variable costs for each. Then fixed costs. The program
    is designed to compute break even points, contribution to sales ratios and margins
    of safety for each product range. The reader must be familiar with arrays, for
    loops, variable costing and break even analysis.


    Pay-slip preparation is extended to include character arrays and a selection of
    loops to generate a user-determined number of pay-slips with firstname, lastname
    and various tax bands. Examples discussed in book one and two are combined. As
    a result, pay-slip preparation comprises character arrays for employees'' names,
    while loops for data input accuracy and for a specific number of employees.


    A section applies arrays to graphic content, where horizontal bar charts are printed
    to screen to present data visually. Programs are written to solve problems using
    the Binomial Distribution.


    Guess a number game is extended. A case study looks in detail at pitfalls of early,
    inadequate design of a lot program, how random numbers are generated and how to
    avoid duplication. Loops and arrays are combined with some of the most advanced
    areas of C for correct program design. To be fair to players, the chapter is extended
    to cover comprehensively the probability of winning the lot using loops, arrays
    and'
