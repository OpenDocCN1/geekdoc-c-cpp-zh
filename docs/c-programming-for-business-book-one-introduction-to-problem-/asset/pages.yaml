    # Commentary


    In the above, lines 12 to 25 comprise if statements rather than else if. This
    has the effect of producing output not as intended. Whilst a mark of 15 is less
    than 20, is less than 30, is less than 40, is less than 50, is less than 60 and
    is less than 70, the aim of the program is to produce a grade obtained from within
    a band of marks. So it is important to use if, else if, and else statements correctly
    for achieving program aim, correct processing and output. Using if statements
    incorrectly in the above resulted in additional lines to screen. This is not what
    was intended. The if statement, rather than showing when the compiler identified
    the first correct line for outputting to screen continued to read and continued
    to output to screen.


    In order for the above program to process and output correctly, the if statements
    in lines 12, 15, 18, 21 and 24 should read else if. Using an if, else if, else
    statement makes choices mutually exclusive to each other. This means that only
    one option will be selected. This example shows the importance of having accurate
    if, else if and else statements.'
