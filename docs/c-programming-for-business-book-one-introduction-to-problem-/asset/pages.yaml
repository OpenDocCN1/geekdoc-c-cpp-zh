  md: '# CHAPTER THREE - PROCESSING


    Commentary

    Line 19''s z = v / w / x / y; is not the same as


    v / w * y / x; or (v / w) / (x);


    In solving, the compiler moves left to right. Had the compiler solved the above
    moving left to right, it would have divided 20 into 10, giving 0.5. 0.5 into 30
    gives 60. Finally, 60 into 40 results in 0.666667. This is yet another separate
    and incorrect answer.


    In division, C moves from left to right. In the above, 40 is divided by 30. The
    resulting 1.33333 is divided by 10. Then 0.13333 is then divided by 20 providing
    an answer of 0.06667. Only if parenthesis were used as follows


    z = (v / w) / (x / y);


    would output an answer of 2.66667, a third potential value for z. This example
    shows importance of design and use of parentheses.


    # Rules in Addition and Subtraction


    Whilst appearing very straightforward, rules on precedence are paramount in addition
    and subtraction. For example, in designing a program for a simple payslip that
    involves income tax and PRSI. How do you design? For example is


    ```

    netPay = grossPay - incomeTax - prsi;

    ```


    the same as


    ```

    netPay = grossPay - (incomeTax + prsi);

    ```


    In the first formula, subtraction should move right to left, prsi is deducted
    from incomeTax leaving a total amount deductible from gross pay less than that
    in the second formula''s (incomeTax + prsi). Design and testing is crucial once
    Bodmas, Bomdas, left to right and right to left rules are established.


    68'
