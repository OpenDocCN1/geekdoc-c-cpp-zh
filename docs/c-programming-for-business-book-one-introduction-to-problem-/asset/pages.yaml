  md: "# C Programming For Business\n\nA Word to the wise\n\nFor best use of this\
    \ book the reader needs access to the C Programming language.\nC is not C++, C#,\
    \ C Sharp, Visual C, Objective C or Python.\n\nAt time of publication, C could\
    \ be downloaded for free onto onto laptops running\nWindows XP, Windows 7 and\
    \ Windows 8 from\nhttp://www.bloodshed.net/dev/devcpp.html\n\nYou should run the\
    \ following program in C (all lowercase) before book purchase:\n\n```\n#include\
    \ <stdio.h>\nmain()\n{\n    printf(\"Hi\");\n    getch();\n}\n```\n\nTopics covered\
    \ include:\n\nVariable Declarations and Processing\n\nControl Flow comprising\
    \ conditional statements - If, Else If, Else and Switch\nIterative Control Flow\
