- img_proc: true
  md: '# CHAPTER TWO – DATA TYPES


    # Code


    ```

    1: /*Program Aim: To show declaration,

    2:   data entry, and output of print to screen*/

    3:

    4: #include <stdio.h>

    5: main()

    6:

    7:   int x;

    8:

    9:   printf("Enter x: \t");

    10:  scanf("%d", &x);

    11:

    12:  printf("\nYou entered: \t&d", x);

    13:

    14:  getch();

    15: }

    16:

    ```


    # Commentary


    When the above program is run, the data inputter is prompted to enter a value
    for x (line 9 of code). The printf statement here followed by a line of text in
    double quotation marks, enclosed in parenthesis and terminated with a semicolon
    tells us this. All must be present – the printf, the opening and closing parenthesis,
    the opening and closing double quotation marks, and the semi colon – for the program
    to execute to this stage. Line 10 of code allows the data inputter to input a
    value. If 5 is input and Enter pressed, line 12 is executed. Line 12 prints to
    screen You entered: 5. However this program will only execute if the code is designed
    correctly. For example, line 10 must be very accurate – %d in double quotation
    marks tells us that an integer to be scanned from the keyboard. & allows for this
    integer to be scanned. The ampersand & be absent, the program will not run as
    intended and there will be no prompt for input of a value for x.


    All symbols and how these are used are very important. Ampersands and per cent
    symbols are used in later chapters for additional tasks, namely conditional statements
    and numeric manipulation. Understanding these symbols in specific situations is
    important.'
  merge: -1
