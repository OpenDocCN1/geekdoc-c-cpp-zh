    # Comparison of Integers and Floats


    | %d for integers | %f for floats |

    |---|---|

    | getch2702015.c | getch2702015.c |

    | 1 /* Integer: to show declaration | 1 /* Float: to show declaration |

    | 2 of integers and data manipulation* */ | 2 of floats and data manipulation*
    */ |

