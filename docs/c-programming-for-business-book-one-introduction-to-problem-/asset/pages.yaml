    # Criticism of Random Number Generation


    The above random number generator will produce the same random numbers each time
    the program is opened and the program run. The random numbers are determined by
    the computer''s processor. As a result, the player, once familiar with this program,
    will become familiar with the numbers generated each time the game is played.
    This means that the rand() function needs to be amended. This could be achieved
    by setting each random number drawn to the current time (rather than to a time
