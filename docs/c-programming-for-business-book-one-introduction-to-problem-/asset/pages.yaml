  md: '# CHAPTER ONE - INTRODUCTION


    Line 5 is highlighted. Underneath, the statement, syntax error before "get". To
    its left the number 5 in the column. This statement tells us that a syntax error
    exists immediately before get(); in line 5. Looking closely, we see a semi-colon
    is absent from line 4''s code immediately after get(); A semi-colon is necessary
    to terminate line 4. Inputting a semi-colon to end line 4s printf("Hi"); will
    correct the error and cause the program to run smoothly.


    # Positioning of Code


    Two items are needed for positioning code. Backslash and t, V, and backslash and
    n. Both tabulation and new line are important for presentation and printing to
    screen.


    ```

    firstHIProgramW/KS08072017.c

    1 # include <stdio.h>

    2 main ()

    3 (

    4 printf("\tHi");

    5 get();

    6 )

    7 ?

    ```


    ```

    firstHIProgramW/KS08072017.c

    1 #include <stdio.h>

    2 main ()

    3 (

    4 printf("\nHi");

    5 get();

    6 )

    7 ?

    ```


    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_15_0.png)


    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_15_1.png)


    V in Line 4 tabulates to the right


    \V in Line 4 creates a new line or line break


    The importance of tabulating and presentation of code will become apparent later.
    Tabulation means information may be printed to screen in tabular or columnar format.
    As a result, this is easy to read. Without tabulation, information created from
    loops in future chapters would not be presentable. Using \V and \V will also help
    separate chunks of code and make programs more reader friendly when printed to
    screen.'
