  md: '# Epilogue


    If the reader has enjoyed or benefited from book one, they may want to consider
    books two or three in the series C Programming For Business.


    # Book 2


    Book two deals with applying much of one to business problems. But the reader
    should be familiar with some business maths, statistics and finance. Areas where
    programming is applied include forecasting, financial management, HR management,
    simple profit and loss statements and ratios, methods of depreciation, probability
    theories, and games. Knowledge of loops, data types and processing from book one
    is essential.


    A section shows how for loops may compute and compare straight line, reducingbalance
    and sum of digits depreciation. The user inputs an asset''s cost and its expected
    life in years. As a result, C computes depreciation each year from a variety of
    depreciation methods.


    A chapter dedicated to forecasting comprises loops and nested loops. Beginning
    first with while, these advance to for safeguarding data entry. For example, for
    loops ensuring that quantity of data items input is as intended and while loops
    ensuring data values are within a relevant range. Formulae for straight line graphs,
    eg y = mx + c or y = a + bx and polynomials, eg a = bx² are applied to business
    situations. More complicated formulae are applied for computing b, a r and r values
    for forecasting - values used and understood by business consultants. Some knowledge
    of correlation and regression is required.


    A chapter takes tables loops and develops these further to compute discount and
    annuity values. From these, a chapter is devoted to capital investment appraisal.
    Loops are used to compute discount values from user input of a user-specified
    discount factor - a percentage. Discount values are multiplied by respective estimated
    cash flows and then a net present value for decision making. Programs begin with
