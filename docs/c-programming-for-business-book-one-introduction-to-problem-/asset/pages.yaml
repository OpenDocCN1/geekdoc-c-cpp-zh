    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_34_0.png)


    ![](img/d66aad4cac4279bfe1f0f55cccf5946a_34_1.png)


    | Integers Used | Floats Used |

    |---|---|

    | Line 7 contains int. | Line 7 contains float. |

    | Lines 10, 13 and 17 contain %d | Lines 10, 13 and 17 contain %f. |


    The advantages and disadvantages of using floats over integers are:


    +   * Floats provide a number of places to the right of the decimal point – valuable
    in computing numbers to decimal point.

    * Integers truncate and do not round. Declaring them as integers, eleven by three
    provides a result of three. Four would be a more accurate answer, as 3.6666667
    is more accurate again.

    * Floats may be slower due to their rounding.

    * If a remainder, ie modulus %, is used, integers have the advantage over floats
    because floats cannot compute remainders.'
