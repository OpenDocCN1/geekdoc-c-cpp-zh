  md: '# CHAPTER TWO – DATA TYPES


    # Other Data Types


    As well as declaring data types of int or float, they may be declared as follows:


    | Data Type | Occupation of Memory (bytes) | Displayed | Numeric range |

    | --- | --- | --- | --- | --- |

    | long int | 4 | %d or %i | -2 147 483 648 to 2 147 483 647 |

    | long | 4 | %ld (ie alpha 1 for not numeric 1) | -2 147 483 648 to 2 147 483
    647 |

    | short int | 2 | | -32 768 to 32 767 |

    | short | 2 | | -32 768 to 32 767 |

    | unsigned long | 4 | No negative values allowed but an increase in positive.
    | 0 – 4 294 967 295, ie double a positive values of long but minus numbers |

    | unsigned int | 4 | No negative values allowed but an increase in positive. |
    0 to 65 535, ie double short''s positive range |

    | float | 4 | %f. | Properties unspecified |

    | double | 8 | %lf (ie alpha 1 not numeric 1) | Properties unspecified |

    | char | 1 | %s | One or a series of alpha values, eg a person''s name |


    Doubles allow floating point decimals to be more precise than floats and integers
    require larger memory storage. The remaining data types may be used in specific
    situations. A employee or works number might be declared as unsigned long.'
