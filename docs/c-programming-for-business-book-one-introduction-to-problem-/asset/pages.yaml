  md: '# # Chapter Two - Data Types


    # ## Declaration of Variables


    Data types most commonly used in C programming are integers, floats and characters.
    Integers are declared as int. An integer declaration may be a single or a series
    of alpha characters, eg int a or int alpha. An integer is a whole number. An integer
    declared as int 4Xeros is incorrectly declared as this begins numerically.


    # ## Declaration of an Integer and Keyboard Entry


