- img_proc: true
  md: '# CHAPTER FOUR — FLOW CONTROL


    How code is read by a compiler differs in switch over If, else if, else statements.
    When a specific case is input, eg 2 for Tuesday, the compiler jumps directly to
    case 2, without reading the preceding cases or succeeding cases. In If, Else If,
    Else statements, more code is read by the compiler than in switch statements.
    So for a program running several hundred pages of code and comprising many, many
    choices, a switch statement will result in speedier processing of data.


    Writing code involves careful use of single and double quotation marks, semi-colons
    and colons in switch. Each case statement in switch statements ends with a colon:


    The switch statement comprises of #include <stdio.h> followed by main(), then
    opening / (line 11) and closing / (line 38) braces with code in between. Switch
    (no) – line 10 does not have a terminating colon or semicolon. Variables are declared
    immediately after the opening brace after main(). Line 5 has integer no declared.
    The switch statement itself begins in line 10 and ends at line 38. Almost all
    sections of code within lines 12 to 34 are similar.


    ```

    case ...:

    printf("...");

    break;

    ```


    Each of the above three phrases, printf and break are in lower case. The case
    line is terminated with a colon ; not a semi colon ; Lines comprising printf and
    break statements end with a semicolon. These three lines appear in all switch
    statement cases. A series of switch statements should conclude with a default
    statement. Lines 37 and 38 show this with the lines


    ```

    default:

    printf("Incorrect Entry");

    ```


    The default: line, like each case line is terminated with a colon. A default statement,
    ending the switch – line 36 - lets the user know should an unavailable choice
    be made.


