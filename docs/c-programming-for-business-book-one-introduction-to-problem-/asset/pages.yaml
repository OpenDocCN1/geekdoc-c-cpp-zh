    # Commentary


    Lines 13 to 17 while ensures that a rate per hour too low or too high be entered,
    this amount must be re-input. Line 13, the beginning of a while loop uses a combination
    of relational operators. The pipes || refer to or. Should a rate per hour be less
    than 5 or greater than 20, this amount must be re-entered. Minimum and maximum
    values of five and twenty are contained in lines 5 and 6, declaration of variables.
    A while loop rather than an if condition has been used in this example because
    if does not allow continuous looping to take place.


    For example, inputting and re-inputting 90 as a rate per hour will cause a while
    loop to continually invite for accurate input. An if condition will not. Should
    it be used instead of while and incorrect data be input, the if condition will
    prompt only for re-input of data. This means that should incorrect data be second
    time round, there will be no prompt for re-input of accurate data. So, in this
    situation, a while loop must be used rather than an if condition. A while loop
    ensures the program runs intended.


