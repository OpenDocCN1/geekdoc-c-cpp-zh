    # Commentary


    By using the modulus sign % (ie cent), a remainder may be computed. Ten divided
    by nine provides a remainder of one. Modulus is valuable in converting seconds
    into hours, minutes and seconds or deciding if a year is a leap year. For these
    programs, integers must be used, not floats. Were floats to be used, programs
    will not run as intended. Whilst floats provide decimals in division, these are
    unsuitable for computing modulus.


