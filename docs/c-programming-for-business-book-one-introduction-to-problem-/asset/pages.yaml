    j; at line 12. Line 13 contains k at its end. As a result, k must be declared
    as a variable in line 4.


    The example above, having k replace i * j is important since computing may become
    complicated. For example, should


    ```

    k = a+b*c-d/e+f*g-h/

    ```


    it is neater to write this in line 12 – similar to above right – and have k appear
    toward the end of line 13’s - then have k appear as it does above left in line
    12.


