    \n上传你的 Superlooper 精灵。\n\n5. 在 Scratch 菜单栏中，点击“放大”（Grow）按钮。现在多次点击舞台上的 Superlooper。让它长大，直到它大约是舞台宽度的一半。\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_20_0.png)\n\n# 6. 我们需要画你的宇航服和喷气背包。\n\
    \n在画的时候，请记住宇航员精灵需要大约是绘制区域宽的三分之一。如果它比这个尺寸大或小很多，游戏将无法正常运行。\n\n![](img/c022ded506ce3bf5933f47355fd556be_20_1.png)\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_20_2.png)\n\n![](img/c022ded506ce3bf5933f47355fd556be_20_3.png)\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_20_4.png)\n\n![](img/c022ded506ce3bf5933f47355fd556be_20_5.png)\n\
    \n在“精灵”面板中，点击“画一个精灵”图标。\n\n先选择矩形（Rectangle）工具。\n\n确保它被设置为填充。\n\n如果出错，只需点击“撤销”。\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_20_6.png)\n\n![](img/c022ded506ce3bf5933f47355fd556be_20_7.png)\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_20_8.png)\n\n使用三个白色矩形画出你的宇航服。\n\n使用深灰色画出你的靴子和喷气背包。\n\
    \n使用浅灰色画出你的手套和衣领。\n\n![](img/c022ded506ce3bf5933f47355fd556be_20_9.png)\n\n![](img/c022ded506ce3bf5933f47355fd556be_20_10.png)\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_20_11.png)\n\n现在选择圆形（Eclipse）工具画你的头盔。\n\
    \n使用画笔（Brush）工具并挑选颜色在头盔内画出你的脸。\n\n最后，从你的喷气背包中画一些火焰。\n\n现在点击“脚本”标签，并将此代码拖到脚本区域，让喷气背包在太空中飞出。确保你已选定宇航员图标。\n\
    \n# 7.\n\n```\nwhen clicked\n将大小设置为 80 %\n去 x: y: 永远\n  面向 [鼠标指针]\n  如果 <空格键>\
    \ 按下\n    移动 2 步\n  否则\n    将 y增加 -5\n```\n\n当点击绿旗按钮时，运行以下代码：\n\n将小行星缩小到其尺寸的一半。\n\
    \n将小行星移动到舞台上的随机位置。\n\n确保小行星从舞台边缘开始。\n\n重复此代码，直到小行星撞中 Superlooper：\n\n让小行星面向 Superlooper。\n\
    \n让小行星向 Superlooper 移动 1 步。\n\n如果小行星被激光（Button）命中，运行此代码：\n\n将小行星移动到舞台上的随机位置。\n\
    \n确保小行星从舞台边缘开始。\n\n播放音效。\n\n如果小行星撞中 Superlooper，停止所有其他代码，这样激光就会停止，Superlooper\
    \ 也无法旋转。\n\n按下绿旗按钮保护 Superlooper 免受小行星攻击。你的游戏看起来应该是这样的！\n\n要保存游戏，选择“文件”并下载到你的电脑。\n\
    \n![](img/c022ded506ce3bf5933f47355fd556be_21_0.png)\n\n按下“空格”键发射喷气背包，并使用鼠标指向你想飞行的地方。\n\
