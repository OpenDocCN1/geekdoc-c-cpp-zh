    4. 现在，我们需要为舞台设置背景以显示发射区域。


    在**角色面板**（Sprites Pane）中，点击**舞台**（Stage）图标。在该图标下方，从库中点击**选择背景**。选择**斜坡**（Slopes），然后点击**确定**。


    ![](img/c022ded506ce3bf5933f47355fd556be_10_0.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_10_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_10_2.png)


    5. 点击舞台右上角的**绿旗**按钮测试你的代码并启动超级飞行器（Superlooper）！


    要保存你的游戏，点击**文件**菜单，然后点击**下载到电脑**。当你想再次玩时，可以点击**文件**并点击**从电脑上传**。


    前往 Zyskinar 是一段漫长的旅程。我们必须轮流驾驶超级飞行器。现在轮到你了！


    ![](img/c022ded506ce3bf5933f47355fd556be_11_0.png)


    控制超级飞行器。

    编写代码让飞船向左和向右转。


    ## 飞吧！


    - 1. **打开 Scratch** 点击文件菜单并点击“新建”开始一个新文件。


    - 2. 我们需要删除猫的角色。在角色面板中，右键点击猫图标。在 Mac 电脑上，按住 ''Ctrl'' 键并点击删除。


    ```

    File

    New

    ```


    ```

    duplicate

    delete

    ```


    - 3. 现在我们已经发射了超级飞行器，我们需要创建一个星空背景。


    在角色面板中，点击舞台图标。在正下方，点击从库中选择背景。选择**星星**（Stars），然后点击**确定**。


    ## 现在你需要上传你之前绘制的超级飞行器角色。（如果你还没有绘制超级飞行器，请转到第 7 页并按照步骤 2 到 9 进行操作。）


    在角色面板中，点击**从文件上传角色**。


    ![](img/c022ded506ce3bf5933f47355fd556be_12_0.png)


    ## 现在你需要添加代码让超级飞行器向上飞行。


    在屏幕中心，点击**脚本**（Scripts）选项卡。将这段代码拖入脚本区域。注意在代码组中寻找颜色对应的代码块。


    ![](img/c022ded506ce3bf5933f47355fd556be_12_1.png)


    - 当点击绿旗按钮时，运行以下代码：

    - 让超级飞行器从舞台底部的中心开始。

    - 让超级飞行器指向正上。（使用下拉菜单）。

    - 将超级飞行器缩小到你绘制时尺寸的 30%。

    - 在无限循环中重复该代码块：

    - 让超级飞行器向前移动 2 步。

    （要让它运行更快或更慢，请更改步数！）


    ## 添加这两个独立的代码块，以便在你按下键盘上的方向键时，让超级飞行器向左或向右转。


    ![](img/c022ded506ce3bf5933f47355fd556be_12_2.png)


    - 当按下“左”箭头键时，运行以下代码：

    - 让超级飞行器逆时针旋转 15 度。

    - 当按下“右”箭头键时，运行此代码：

    - 让超级飞行器顺时针旋转 15 度。


    ![](img/c022ded506ce3bf5933f47355fd556be_12_3.png)


    点击舞台右上角的绿旗按钮测试你的代码。练习在太空中飞行，为任务的下部分做好准备。


    如果你想保存这个游戏，点击文件菜单然后下载到电脑。


    ## 我们进入了辐射场！我们必须转弯避开危险的黄色粒子，否则我们会被炸成碎片！


    快！你需要编写代码让超级飞行器避开黄色粒子。


    ## 辐射场


    - 1. **打开 Scratch**

    开始一个新文件。

    - 2. **右键点击**猫的角色。

    在 Mac 上，按住 ''Ctrl'' 并点击。点击**删除**。


    ![](img/c022ded506ce3bf5933f47355fd556be_13_0.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_2.png)


    - 3. 为了绘制辐射场，点击**背景**（Backdrops）选项卡。


    ![](img/c022ded506ce3bf5933f47355fd556be_13_3.png)


    现在你可以看到**绘制区域**。选择**油刷**（Fill）工具。


    ![](img/c022ded506ce3bf5933f47355fd556be_13_4.png)


    通过点击背景来填充。


    Scripts Backdrops


    选择**黑色**（black）


    - 4. 现在选择**画刷**（Brush）工具。选择**黄色**。让画刷变粗一些。


    使用画刷在辐射场中绘制危险的黄色粒子。不要添加太多点，导致超级飞行器永远无法通过。


    ![](img/c022ded506ce3bf5933f47355fd556be_13_5.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_6.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_7.png)


    - 5. 现在你需要上传你之前绘制的超级飞行器角色。在**角色面板**中，点击**从文件上传角色**。找到你的文件并点击**确定**（如果你还没有绘制超级飞行器，请转到第
    7 页并按照步骤 2 到 9 进行操作）。


    ![](img/c022ded506ce3bf5933f47355fd556be_13_8.png)


    ## 让我们添加一个音效，当飞行器撞击辐射场时播放。


    Sounds

    选择

    声音（Sounds）

    选项卡。


    新声音：


    点击从库中选择声音的按钮。


    滚动到

    选择**水波**（Space ripple）。

    点击确定。


    ## Scripts


    点击脚本选项卡。让飞行器移动直到它撞击危险的黄色粒子。“碰到**颜色”（Touching colour）代码块位于感应组。将它拖入“重复直到”循环的空隙。


    ## 如何为“碰到”代码块设置颜色


    点击颜色方块。


    - 当点击绿旗按钮时，运行以下代码；

    将超级飞行器缩小到 20%。

    从舞台左侧开始。

    让超级飞行器指向右侧。

    在循环中重复代码，直到

    飞行器撞击黄色粒子：

    让飞行器向前移动 10 步。

    播放音效。（选择

    水波。）

    颜色已设置。


