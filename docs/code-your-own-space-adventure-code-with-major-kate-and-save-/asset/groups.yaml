    content of the websites referred to in this book.


    # INFORMATION ON RESOURCES


    You can use Scratch on a PC or Mac by opening your web browser

    and going to: http://scratch.mit.edu

    Then click ''Try it out''.


    There is a very similar website called ''Snap'', which works on iPads.

    It is available here: http://snap.berkeley.edu/run


    If you want to run Scratch without using the web, you can download it from here:

    http://scratch.mit.edu/scratch/download/


    # CONTENTS


    - USING SCRATCH 4

    - THE SUPERLOOPER 7

    - BLAST OFF! 8

    - FLY AWAY! 10

    - RADIATION FIELD 12

    - ASTEROID ATTACK 14

    - SPACE WALK! 18

    - GOING BANANAS 23

    - UNDERGROUND RESCUE 26

    - FLIGHT TO BANANAREETA 30

    - GLOSSARY AND INDEX 32


    # USING SCRATCH


    In this book, we will use a computer language called Scratch to code our games.
    It''s free to use and easy to learn. Before you set off on your mission with Astronaut
    Kate, take a few minutes to get to know Scratch.


    # FINDING SCRATCH


    To start using Scratch, open a web browser and click in the address bar. Type
    in scratch.mit.edu then press ''Return''. Click Try it out.


    # STARTING SCRATCH


    To code a computer game, you need to tell your computer exactly what to do. You
    do this by giving it commands. In Scratch, commands are shown in the form of ''code
    blocks''. You build a game by choosing code blocks and then joining them to create
    a program.


    Your Scratch screen should look like this:


    ![](img/c022ded506ce3bf5933f47355fd556be_5_0.png)


    Choose the group of commands you need.


    These are the code blocks in the current group.


    This is the Scripts Area. Drag your code blocks here to build your games.


    # USING CODE BLOCKS


    Before you drag out any code blocks, try clicking on one to make the cat sprite
    move forward ... or rotate 15 degrees.


    Click in the white boxes (which are shown in this book as coloured) then type
    different numbers to change how far the sprite moves or turns.


    ![](img/c022ded506ce3bf5933f47355fd556be_6_0.png)


    Now try dragging code blocks over to the Scripts Area and joining them together.
    Click on one of the blocks to run the whole program.


    You can break code blocks apart, but you need to start with the bottom block if
    you want to separate them all. To remove a code block, drag it off the Scripts
    Area.


    Use the colour of the code blocks to work out which group you will find the block
    in. It will also give you a clue about what the code block will do.


    ![](img/c022ded506ce3bf5933f47355fd556be_6_1.png)


    Get the ''Pen down'' block from the green Pen group.


    The ''Repeat'' block is a mustard colour, so it''s in the Control group.


    The code blocks are in the Motion group.


    # USING THE DRAWING AREA


    To draw a new sprite, click on Paint sprite button located in the top bar of the
    Sprites Pane.


    ![](img/c022ded506ce3bf5933f47355fd556be_6_2.png)


    To draw a backdrop for the Stage, click on Stage button located in Sprites Pane
    then click on Paint new backdrop.


    The Drawing Area will appear on the right of your Scratch screen:


    ![](img/c022ded506ce3bf5933f47355fd556be_6_3.png)


    - Brush: Use this tool for drawing.

    - Rectangle: Draw a rectangle. Hold down ''Shift'' key to make a square.

    - Ellipse (Oval): Draw an ellipse. Hold down ''Shift'' key to make a circle.

    - Fill: Fill an area by clicking it with the mouse.

    - Zoom: in and out.

    - Pick colours here.

    - Change line thickness.


    Call from Mission Control: Major Kate is in urgent need of your help. Without
    a moment''s hesitation, race to Mission Control... goodness you are here! An SOS
    has come from Planet Zysinar. They have been invaded by a hostile form. We need
    to leave right now! The problem is that my rocket, the Superloop, is still in
    need of repairs after an asteroid strike. I hope you have the skills to help.
    Can you help save the Zyskarians? You need to get the Superloop ready for launch.
    Draw it on your computer and make sure that its blasters are fully functioning!


    # THE SUPERLOOP


    1. Open Scratch: We need to delete the cat sprite. In the Sprites Pane, right
    click the cat. On a Mac computer, hold the ''Ctrl'' key and click. Click Delete.

    2. To start drawing the Superloop, click Paint new sprite in the Sprites Pane.
    Choose the Ellipse tool. Now you should be able to see the Drawing Area. At the
    bottom of the screen, click Solid so we can draw a filled-in shape.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_0.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_8_1.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_8_2.png)


    3. Pick a dark colour for the rocket fins.

    4. Choose a long ellipse. Drag the body so it is in the middle of the circle.
    Draw a circle by dragging the mouse. Make it this size and position in the Drawing
    Area. Draw a long ellipse to be the rocket''s body.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_3.png)


    If things go wrong, click Undo and go back a step or two.


    5. The basic rocket is now ready.

    8. Add any extra details you want using the Rectangle tool.

    9. Click the Select tool. Draw a select box around the left side of your artwork.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_4.png)


    Change colour and use the Ellipse tool to add ports. Press the ''Delete'' key
    (or Backspace on a Mac) to delete the selected area.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_5.png)


    The Superloop is now ready!

    Turn over to find out how to save your Superloop design so you can use it for
    the rest of your adventures. Quick - turn over!


    Thank you for fixing the Superloop! We must leave right now to save the Zyskarians.
    It''s up to you to blast us off into space.

    5-4-3-2-1...


    # BLAST OFF!


    1. Before you do anything else, save the Superloop rocket sprite you have drawn.
    This is very important! In the Sprites Pane, right click the Superloop. On a Mac
    computer, hold the ''Ctrl'' key and click. Click Save to local file. Type in Superloop
    as a name for your sprite. Click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_9_0.png)


    2. In the middle of the Scratch screen, click the Scripts tab so Scratch is ready
    for you to add some code to make the rocket move.


    ![](img/c022ded506ce3bf5933f47355fd556be_9_1.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_9_2.png)


    3. Drag these blocks into the Scripts Area, in this order. Remember that the colour
    of each block tells us which group it is in. The ''When green flag clicked'' block
    is in the Events group. The blue blocks are in the Motion group. The purple blocks
    are in the Looks group. The ''Forever'' loop block is in Control.


    | when clicked | tells Scratch to run the code below when the Green flag is clicked
    |

    |---|---|

    | go to x: 0 y: -100 | Move the Superloop to the centre of the Stage, near the
    bottom. (You will need to type 0 and -100 in the white boxes.) |

    | point in direction 20 | Position the Superloop so it is pointing upward. (Use
    the drop-down menu.) |

    | set size to 30 % | Shrink the Superloop sprite to about one third of the size
    you drew. |

    | say 5 for 1 secs | Display ''5'' in a speech bubble, for 1 second. |

    | say 4 for 1 secs | Display ''4'' in a speech bubble, for 1 second. |

    | say 3 for 1 secs | Display ''3''. |

    | say 2 for 1 secs | Display ''2''. |

    | say 1 for 1 secs | Display ''1''. |

    | say Blast Off for 1 secs | Display ''Blast Off!'' for 1 second. |

    | forever | Repeat the code in the loop: |

    | move 2 steps | Move the Superloop 2 steps. (You will need to type 2 in the white
    box or the Superloop will blast off dangerously fast!) |

    '
