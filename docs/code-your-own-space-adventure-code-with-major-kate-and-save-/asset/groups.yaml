  - '[PAGE 19]


    # OH NO! Those asteroids bashed holes in the Superlooper. All our food supplies
    have floated into space!


    I need to go on a space walk to repair the hull. And don''t forget to collect
    the floating food ...


    You need to build code that allows you to collect the bananas that are floating
    around the Superlooper. You also need to fix the damage to the hull. That''s easier
    than it sounds - you can ''fix'' the holes by touching them!


    First of all, draw yourself a space suit and jet pack.


    # SPACE WALK!


    +   - Open Scratch.

    Start a new file.


    +   - Right click the cat sprite. On a Mac, hold ''Ctrl'' and click.


    Now we will create a starry background.


    In the Sprites Pane, click the Stage icon.


    Just below, click Choose backdrop from library.


    Choose Stars, then click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_19_0.png)'
