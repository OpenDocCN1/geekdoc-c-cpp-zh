    # 资源信息


    你可以在 PC 或 Mac 上使用 Scratch，只需打开网页浏览器并访问：http://scratch.mit.edu

    然后点击“Try it out”（尝试一下）。


    有一个名为“Snap”的非常类似的网站，可以在 iPad 上运行。

    这里获取：http://snap.berkeley.edu/run


    如果你想在不使用网页的情况下运行 Scratch，可以从这里下载：

    http://scratch.mit.edu/scratch/download/


    # 目录


    - 使用 SCRATCH 4

