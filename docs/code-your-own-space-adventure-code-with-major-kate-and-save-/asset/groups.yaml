    File

    New

    ```


    ```

    duplicate

    delete

    ```


    - 3. Now we have launched the Superlooper, we need to create a starry sky background.


    In the Sprites Pane, click the Stage icon. Just below, click Choose backdrop from
    library. Choose Stars, then click OK.


    ## Now you need to upload the Superlooper sprite that you drew earlier. (If you
    haven''t already drawn the Superlooper, turn to page 7 and follow steps 2 to 9.)


    In the Sprites Pane, click Upload sprite from file.


    ![](img/c022ded506ce3bf5933f47355fd556be_12_0.png)


    ## Now you need to add code to make the Superlooper fly upwards.


    In the centre of the screen, click the Scripts tab. Drag this code into the Scripts
    Area. Remember to look for each block in the code group with the right colour.


