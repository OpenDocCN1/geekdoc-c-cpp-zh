- md: '

    At last! You touch down on the barren surface of Planet Zyskinar. You cannot see
    any Zyskinarians through the porthole, but ...


    Planet Zyskinar has been invaded by giant bugs! Zyskinar used to be a beautiful
    place, covered in fruit trees and flowers. The bugs have eaten everything in sight!
    The Zyskinarians must be hiding somewhere. We must save the planet! But how?


    You wrack your brains to come up with a clever plan. That''s it! If the bugs like
    fruit so much, you can lure them into the Superlooper''s cargo hold with those
    bananas you collected earlier. Make sure you add code to count how many bugs you
    catch.


    ![](img/c022ded506ce3bf5933f47355fd556be_23_0.png)


    # GOING BANANAS


    - 1. Start a new Scratch file. Delete the cat sprite.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_0.png)


    We will create a background showing the barren surface of Planet Zyskinar.


    - 2. Click the Stage icon. Just below, click Choose backdrop from library. Choose
    Moon, then click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_1.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_2.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_3.png)


    - 3. We want to fill the Stage with the surface of the planet, so we need to stretch
    part of the image. Choose the Select tool. Drag a box around the bottom half of
    the image. Move your mouse over the handle at the top. Drag it up to stretch the
    picture. Choose the Ellipse tool and set it to solid fill. Draw brown craters.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_4.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_5.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_6.png)


    - 4. Upload your Superlooper sprite. 5. Click the Shrink button in the Menu bar.
    Now click the Superlooper on the Stage to shrink it until it is the size of one
    of the craters.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_7.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_8.png)


    - 6. To create a banana sprite, click the Choose sprite from library button. Click
    the Bananas icon. OK OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_9.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_10.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_11.png)


    We need a way to count how many bananas have been lured away. We will use a special
    part of our program to do this, called a variable. Variables are a storing of
    numbers to keep score.


    - 7. Pen Make a Variable Variable name: bugs OK Click the Data group. Click Make
    a variable. Call it bugs. Then click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_12.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_13.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_14.png)


    # Now add code for the bananas sprite so you can make it follow the mouse around
    the Stage - and use it to lure the bugs back to your spaceship! The orange blocks
    are in the Data group. The green ‘Equals’ block is in the Operators group. You
    will need to drop the little ‘Bugs’ block into its left-hand hole.


    - 8.


    ![](img/c022ded506ce3bf5933f47355fd556be_25_0.png)


    Run the code below when the Green Flag button is clicked:


    Set the bug count to zero at the start of the game.


    Shrink the banana to half of its size.


    Repeat the code in the loop until 5 bugs have been caught:


    Move the banana sprite to the mouse pointer.


    All 5 bugs have been lured back to the Superlooper so show a congratulations message.


    - 9. We need to create these hungry giant bugs! Choose sprite from library


    ![](img/c022ded506ce3bf5933f47355fd556be_25_1.png)


    Click the Beetle icon. Click OK


    - 10. Click the Scripts tab and add this code to the bug to make it follow the
    banana.![](img/c022ded506ce3bf5933f47355fd556be_25_2.png)


    Run the code below when the Green Flag is clicked:


    Make sure the bug is visible.


    Shrink the bug to 40% of its size.


    Start in a random place.


    Repeat the code in the loop until the bug touches the Superlooper:


    Point the bug towards the mouse pointer (the banana will be there).


    Move the bug forward 1 step.


    If the banana is touching a brown crater (see page 13 for setting the color to
    brown), then run this code:


    Move the bug backwards 2 steps.


    Increase bug count by 1.


    Hide the bug - it is now in the Superlooper.


    - 11. We need 4 more bugs to finish off our game. In the Sprites Pane, right click
    the bug. On a Mac, hold ''Ctrl'' and click Duplicate. Repeat this 3 more times.
    Drag the bugs around the Stage. Click the giant bugs into the Superlooper.


    To save your game, click File and Download to your computer.![](img/c022ded506ce3bf5933f47355fd556be_26_0.png)


    The giant bugs are now safely inside the Superlooper''s cargo hold. They waste
    no time eating up the remaining bananas!


    You set out on search of the Zyskinarians. Suddenly one pops out of a hole! Help!
    Fellow Zyskinarians are hiding in tunnels deep beneath the ground. They are running
    out of air. I beg you to rescue them in your spaceship before it is too late.
    You must fly the Superlooper through the tunnels to rescue the Zyskinarians. It
    will be tricky squeezing through those gaps. But you must act quickly!


    # UNDERGROUND RESCUE


    - 1. Start a new Scratch file. Delete the cat sprite.![](img/c022ded506ce3bf5933f47355fd556be_27_0.png)


    - 2. To draw a backdrop showing Planet Zyskinar and its underground tunnels, click
    the Backdrops tab. Now you should be able to see the Drawing Area.![](img/c022ded506ce3bf5933f47355fd556be_27_1.png)


    Use the Fill tool to colour the background black, then use a white Brush to add
    stars at the top. Draw a large pale brown rectangle and a thin, darker one at
    the top. Draw black rectangles to create tunnels. Make them roughly the width
    shown here. Use the Brush tool to add texture to the ground.


    Upload your Superlooper sprite.


    - 4. Let''s animate the Superlooper''s engine so it looks as if it is blasting.
    To do this we will create a second ''costume'' for the Superlooper, showing flames
    from the engine. We will tell Scratch to switch to the second costume when the
    Superlooper is flying along. In the center of the Scratch screen, click the Costumes
    tab, then right click the Superlooper icon. On a Mac, hold ''Ctrl'' and click.![](img/c022ded506ce3bf5933f47355fd556be_28_0.png)


    The Superlooper sprite now has two costumes. Make sure you have costume2 selected.
    On the Drawing Area, use the Brush tool to draw short flames from the engine.
    To get a preview of your animation, click on costume1, then costume2... It should
    look as if the flames are flickering.![](img/c022ded506ce3bf5933f47355fd556be_28_1.png)


    # 6. Scripts


    Click the Scripts tab and add this code to the Superlooper to make it fly around:


    ```

    when up arrow key pressed

    when left arrow key pressed

    when right arrow key pressed

    when down arrow key pressed

    ```


    Add these 4 separate sets of code, one for each direction: up, down, left and
    right. When the ''Right'' arrow key is pressed, run this code: Show the flames
    from the engine. Move the rocket to the right by changing the x-coordinate. If
    you haven''t learnt about coordinates yet, don''t worry - this is a good way to
    find out about them. Just test out these 4 sets of blocks!


    # 7. We need to make a variable to count how many Zyskinarians have been saved.
    Remember: a variable is the way we keep score in a computer program.![](img/c022ded506ce3bf5933f47355fd556be_29_0.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_29_1.png)


    Click the Data group. Click Make a variable. Call it saved.


    Then click OK.


    # 8. Now click the Scripts tab and add this code to the Superlooper.![](img/c022ded506ce3bf5933f47355fd556be_29_2.png)


    Run the code below when the Green flag button is clicked:


    At the start, set the count of saved Zyskarians to zero.


    Start the Superlooper near the top right of the Stage.


    Point the Superlooper upwards.


    Shrink the Superlooper to 12% of its size. (You may need to make this percentage
    even smaller if the game is too hard.)


    Make the Superlooper is visible.![](img/c022ded506ce3bf5933f47355fd556be_29_3.png)


    Repeat the code in the loop until the Superlooper hits the ground (for help with
    setting the color, turn to page 13):


    if all 10 Zyskarians have been saved:

    Show a congratulations message.![](img/c022ded506ce3bf5933f47355fd556be_29_4.png)


    Run this code if the Superlooper hits the ground:


    Play a sound effect (to create this sound effect, turn to page 17 and follow step
    11).


    Repeat the code in this loop 24 times:


    Turn the Superlooper by 15 degrees.


    Make the Superlooper disappear. (Disaster!)


    # 9. Of course, we need to draw a Zyskarian sprite! Click the Paint new sprite
    icon. Make your Zyskarian about half the height of the Drawing Area.![](img/c022ded506ce3bf5933f47355fd556be_29_5.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_29_6.png)

    '
  mdcn: '


    终于！你降落在了 Zyskinar 行星荒凉的表面。你透过观察窗看不到任何 Zyskinar 人，但是……


    Zyskinar 行星被巨型昆虫入侵了！Zyskinar 曾经是一个美丽的地方，到处满了果树和花。昆虫吃光了目所及的一切！Zyskinar 人一定躲在某个地方。我们必须拯救这个星球！但如何做呢？


    你绞尽脑汁想出一个聪明的计划。就是了！如果这些昆虫那么喜欢水果，你就可以用之前收集的香蕉把它们诱进超级循环器（Superlooper）的货舱。确保你添加了代码来计算你抓住了多少昆虫。


    ![](img/c022ded506ce3bf5933f47355fd556be_23_0.png)


    # 疯狂香蕉


    - 1. 创建一个全新的 Scratch 文件。删除猫咪精灵。


    ![](img/c022ded506ce3bf5933f47355fd556be_24_0.png)


    我们将创建一个显示 Zyskinar 行星荒凉表面的背景。


    - 2. 点击舞台图标。在下方，点击“从库中选择背景”。选择“月球”（Moon），然后点击确定。


    ![](img/c022ded506ce3bf5933f47355fd556be_24_1.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_2.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_3.png)


    - 3. 我们想让舞台充满行星表面，因此我们需要拉伸图像的一部分。选择“选择”工具。在图像的下半部分画一个框。将鼠标移动到顶部的手上。向上拖动以拉伸图片。选择“圆形”工具并将其设置为实心填充。画出棕色的陨石坑。


    ![](img/c022ded506ce3bf5933f47355fd556be_24_4.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_5.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_6.png)


    - 4. 上传你的超级循环器精灵。5. 点击菜单栏中的“缩小”按钮。现在点击舞台上的超级循环器，将其缩小直到它和其中一个陨石坑一样大。


    ![](img/c022ded506ce3bf5933f47355fd556be_24_7.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_8.png)


    - 6. 为了创建一个香蕉精灵，点击“从库中选择精灵”按钮。点击“香蕉”图标。确定，，确定。


    ![](img/c022ded506ce3bf5933f47355fd556be_24_9.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_10.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_11.png)


    我们需要一种方法来计算引走了多少根香蕉。我们将使用程序的的一个特殊部分来实现这一点，称为“变量”。变量是存储数字以计数的容器。


    - 7. 画笔 创建一个变量 变量名：bugs 确定。点击“数据”组。点击“建立一个变量”。命名为 bugs。然后点击确定。


    ![](img/c022ded506ce3bf5933f47355fd556be_24_12.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_13.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_24_14.png)


    # 现在为香蕉精灵添加代码，让它可以跟随鼠标在舞台上移动 - 并用它将昆虫引回你的飞船！橙色色块在“数据”组中。绿色的“等于”块在“运算符”组中。你需要将小的“Bugs”块拖入它的左侧孔中。


    - 8.


    ![](img/c022ded506ce3bf5933f47355fd556be_25_0.png)


    当点击绿旗帜按钮时运行以下代码：


    在游戏开始时将昆虫计数设置为零。


    将香蕉缩小到原来的一半。


    重复循环中的代码，直到抓到 5 只昆虫：


    将香蕉精灵移动到鼠标指针处。


    所有 5 只昆虫都已引回超级循环器，因此显示祝贺消息。


    - 9. 我们需要创建这些饥饿的巨型昆虫！从库中选择精灵


    ![](img/c022ded506ce3bf5933f47355fd556be_25_1.png)


    点击甲虫图标。点击确定


    - 10. 点击“脚本”标签卡，并为昆虫添加此代码让它跟随香蕉。![](img/c022ded506ce3bf5933f47355fd556be_25_2.png)


    当点击绿旗帜时运行以下代码：


    确保昆虫可见。


    将昆虫缩小到原来大小的 40%。


    在随机位置开始。


    重复循环中的代码，直到昆虫碰到超级循环器：


    让昆虫指向鼠标指针（香蕉就在那里）。


    让昆虫向前移动 1 步。


    如果香蕉碰到棕色陨石坑（设置颜色为棕色见第 13 页），则运行此代码：


    让昆虫向后移动 2 步。


    昆虫计数加 1。


    隐藏昆虫 - 它现在已经在超级循环器里了。


    - 11. 我们还需要 4 只昆虫来完成游戏。在精灵面板中，右键点击昆虫。在 Mac 上，按住 ''Ctrl'' 并点击“复制”。重复重复 3 次。将昆虫拖到舞台上。将巨型昆虫点击进入超级循环器。


    要保存游戏，点击“文件”并“下载”到你的电脑。![](img/c022ded506ce3bf5933f47355fd556be_26_0.png)


    巨型昆虫现在安全地位于超级循环器的货舱内。它们没有浪费时间，吃光了剩下的香蕉！


    你出发寻找 Zyskinar 人。突然，其中一个从洞里钻了出来！救命！同类的 Zyskinar 人躲在地下深处的隧道里。他们的空气快用光了。我恳求你在太晚之前用你的飞船营救他们。你必须驾驶超级循环器穿过隧道来营救
