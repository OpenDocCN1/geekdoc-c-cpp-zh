  raw:
  - '[PAGE 23]


    At last! You touch down on the barren surface of Planet Zyskinar. You cannot see
    any Zyskinarians through the porthole, but ...


    Planet Zyskinar has been invaded by giant bugs! Zyskinar used to be a beautiful
    place, covered in fruit trees and flowers. The bugs have eaten everything in sight!
    The Zyskinarians must be hiding somewhere. We must save the planet! But how?


    You wrack your brains to come up with a clever plan. That''s it! If the bugs like
    fruit so much, you can lure them into the Superlooper''s cargo hold with those
    bananas you collected earlier. Make sure you add code to count how many bugs you
    catch.


    ![](img/c022ded506ce3bf5933f47355fd556be_23_0.png)'
  - '[PAGE 24]


    # GOING BANANAS


    +   1. Start a new Scratch file.

    Delete the cat sprite.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_0.png)


    We will create a background showing the barren surface of Planet Zyskinar.


    +   2. Click the Stage icon.

    Just below, click Choose backdrop from library.

    Choose Moon, then click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_2.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_3.png)


    +   3. We want to fill the Stage with the surface of the planet, so we need to
    stretch part of the image.

    Choose the Select tool. Drag a box around the bottom half of the image.

    Move your mouse over the handle at the top. Drag it up to stretch the picture.

    Choose the Ellipse tool and set it to solid fill. Draw brown craters.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_4.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_5.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_6.png)


    +   4. Upload your Superlooper sprite.

    5. Click the Shrink button in the Menu bar. Now click the Superlooper on the Stage
    to shrink it until it is the size of one of the craters.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_7.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_8.png)


    +   6. To create a banana sprite, click the Choose sprite from library button.

    Click the Bananas icon.

    OK OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_9.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_10.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_11.png)


    We need a way to count how many bananas have been lured away. We will use a special
    part of our program to do this, called a variable. Variables are a storing of
    numbers to keep score.


    +   7. Pen Make a Variable Variable name: bugs OK Click the Data group. Click
    Make a variable. Call it bugs. Then click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_24_12.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_13.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_24_14.png)'
  - '[PAGE 25]


    # Now add code for the bananas sprite so you can make it follow the mouse around
    the Stage - and use it to lure the bugs back to your spaceship! The orange blocks
    are in the Data group. The green ‘Equals’ block is in the Operators group. You
    will need to drop the little ‘Bugs’ block into its left-hand hole.


    # 8.


    ![](img/c022ded506ce3bf5933f47355fd556be_25_0.png)


    Run the code below when the Green Flag button is clicked:


    Set the bug count to zero at the start of the game.


    Shrink the banana to half of its size.


    Repeat the code in the loop until 5 bugs have been caught:


    Move the banana sprite to the mouse pointer.


    All 5 bugs have been lured back to the Superlooper so show a congratulations message.


    # 9. We need to create these hungry giant bugs! Click Choose sprite from library


    ![](img/c022ded506ce3bf5933f47355fd556be_25_1.png)


    Click the Beetle icon.


    Click OK


    # 10. Click the Scripts tab and add this code to the bug to make it follow the
    banana.


    ![](img/c022ded506ce3bf5933f47355fd556be_25_2.png)


    Run the code below when the Green Flag button is clicked:


    Make sure the bug is visible.


    Shrink the bug to 40% of its size.


    Start in a random place on the Stage.


    Repeat the code in the loop until the bug touches the Superlooper:


    Point the bug towards the mouse pointer (the banana will be there).


    Move the bug forward 1 step.


    If the banana is touching a brown crater (see page 13 for help setting the color
    to brown), then run this code:


    Move the bug backwards 2 steps.


    Increase the bug count by 1.


    Hide the bug - it is now in the Superlooper.'
  - '[PAGE 26]


    # 11. We need 4 more bugs to finish off our game.


    In the Sprites Pane, right click the bug. On a Mac, hold ''Ctrl'' and click. Click
    Duplicate. Repeat this 3 more times. Drag the bugs around the Stage.


    Click the Green flag to lure the giant bugs into the Superlooper.


    To save your game, click File and Download to your computer.


    ![](img/c022ded506ce3bf5933f47355fd556be_26_0.png)


    The giant bugs are now all safely inside the Superlooper''s cargo hold. They waste
    no time in eating up the remaining bananas!'
  - '[PAGE 27]


    You set out on foot in search of the Zyskinlarians.

    Suddenly one pops out of a hole!


    Help! My fellow Zyskinarians are hiding in tunnels deep beneath the ground. They
    are running out of air. I beg you to rescue them in your spaceship before it is
    too late.


    You must fly the Superlooper through the tunnels to rescue the Zyskinarians. It
    will be tricky squeezing through those tight gaps. But you must act quickly!


    # UNDERGROUND RESCUE


    +   1. Start a new Scratch file.

    Delete the cat sprite.


    ![](img/c022ded506ce3bf5933f47355fd556be_27_0.png)


    +   2. To draw a backdrop showing the Planet Zyskinar and its underground tunnels,
    click the Backdrops tab. Now you should be able to see the Drawing Area.


    ![](img/c022ded506ce3bf5933f47355fd556be_27_1.png)


    Use the Fill tool to colour the background black, then use a white Brush to add
    stars at the top. Draw a large pale brown rectangle and a thin, darker one at
    the top. Draw black rectangles to create tunnels. Make them roughly the width
    shown here. Use the Brush tool to add some texture to the ground.'
  - '[PAGE 28]


    # Upload your Superlooper sprite.


    4. Let''s animate the Superlooper''s engine so it looks as if it is blasting.
    To do this we will create a second ''costume'' for the Superlooper, showing flames
    coming from the engine. We will tell Scratch to switch to the second costume when
    the Superlooper is flying along.


    In the center of the Scratch screen, click the Costumes tab, then right click
    the Superlooper icon. On a Mac, hold ''Ctrl'' and click.


    ![](img/c022ded506ce3bf5933f47355fd556be_28_0.png)


    The Superlooper sprite now has two costumes.


    Make sure you have costume2 selected. On the Drawing Area, use the Brush tool
    to draw short flames coming from the engine.


    To get a preview of your animation, click on the costume1 icon, then costume2,
    ... It should look as if the flames are flickering.


    ![](img/c022ded506ce3bf5933f47355fd556be_28_1.png)


    # 6. Scripts


    Click the Scripts tab and add this code to the Superlooper to make it fly around.


    ```

    when up arrow key pressed

    when left arrow key pressed

    when right arrow key pressed

    when down arrow key pressed

    ```


    Add these 4 separate sets of code, one for each direction: up, down, left and
    right.


    When the ''Right'' arrow key is pressed, run this code: Show the flames from the
    engine. Move the rocket to the right by changing the x-coordinate.


    If you haven''t learnt about coordinates yet, don''t worry - this is a good way
    to find out about them. Just test out these 4 sets of blocks do!'
