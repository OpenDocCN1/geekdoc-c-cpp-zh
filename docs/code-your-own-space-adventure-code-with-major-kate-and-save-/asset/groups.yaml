    Superlooper. IT''S YOUR TURN NOW!


    ![](img/c022ded506ce3bf5933f47355fd556be_11_0.png)


    Take control of the Superlooper.

    Create code that will make the ship turn to the left and right.


    ## FLY AWAY!


    - 1. **Open Scratch** Click the File menu and New to start a new file.


    - 2. We need to delete the cat sprite. In the Sprites Pane, right click the cat
    icon. On a Mac computer, hold the ''Ctrl'' key and click Delete.


