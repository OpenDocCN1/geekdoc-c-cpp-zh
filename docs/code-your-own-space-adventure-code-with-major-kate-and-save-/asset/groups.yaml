  mdcn: "\n\n# 8. 点击“脚本”（Scripts）标签，并为激光（Button1）精灵添加此代码。\n\n![](img/c022ded506ce3bf5933f47355fd556be_17_0.png)\n\
    \n```\nwhen clicked\n当点击绿旗按钮时，运行以下代码：\n将激光精灵缩小到其尺寸的 10%。\n```\n\n```\nwhen space\
    \ key pressed\n当按下“空格”键时，运行此代码：\n将激光移动到舞台的中心。\n让激光指向 Superlooper 的方向。\n重复循环中的代码，直到激光到达屏幕边缘：\n\
    让激光向前移动 10 步。\n```\n\n# 需要帮助找到这个代码块吗？\n\n在“感应”（Sensing）选择感应组。在该组的底部找到这个积木。拖动左上角，将其掉入“面向方向”（Point\
    \ in direction）模块的空隙中。使用菜单选择方向（Direction）和精灵 Sprite1。\n\n# 9. 测试你为止的代码。你应该能够让\
