    ## Add these two separate blocks of code to make the Superlooper turn left or
    right when you press the cursor keys on your keyboard.


    ![](img/c022ded506ce3bf5933f47355fd556be_12_2.png)


    - Run the code below when the ''Left'' arrow key is pressed:

    - Turn the Superlooper 15 degrees anticlockwise.

    - Run this code when the ''Right'' arrow key is pressed:

    - Turn the Superlooper 15 degrees clockwise.


    ![](img/c022ded506ce3bf5933f47355fd556be_12_3.png)


    Click the Green flag button at the top right of the Stage to test your code. Practise
    flying around space to prepare yourself for the next part of your mission.


    Click the File menu then Download to your computer if you want to save this game.


    ## We''ve hit a radiation field! We must swerve to avoid the dangerous yellow
    particles or we''ll be blown to smithereens!


    Quick! You need to create code to make the Superlooper avoid the yellow particles.


    ## RADIATION FIELD


    - 1. **Open Scratch**

    Start a new file.

    - 2. **Right click** the cat sprite.

    On a Mac, hold ''Ctrl'' and click. Click **Delete**


    ![](img/c022ded506ce3bf5933f47355fd556be_13_0.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_2.png)


    - 3. To draw the radiation field, click the Backdrops tab.


    ![](img/c022ded506ce3bf5933f47355fd556be_13_3.png)


    Now you can see the **Drawing Area**. Choose the **Fill** tool.


    ![](img/c022ded506ce3bf5933f47355fd556be_13_4.png)


    Fill in the background by clicking on it.


    Scripts Backdrops


    Choose **black**


    - 4. Now choose the **Brush** tool. Choose **yellow**. Make the brush width thicker.


    Use the brush to draw in the dangerous yellow particles in the radiation field.
    Do not add so many dots that the Superlooper will never be able to pass through
    them.


    ![](img/c022ded506ce3bf5933f47355fd556be_13_5.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_6.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_13_7.png)


    - 5. Now you need to upload the Superlooper sprite that you drew earlier. In the
    **Sprites Pane**, click **Upload sprite from file**. Find your file and click
    **OK** (if you haven''t already drawn the Superlooper, turn to page 7 and follow
    steps 2 to 9 now).


    ![](img/c022ded506ce3bf5933f47355fd556be_13_8.png)


    ## Let''s add a sound effect to play when the rocket hits the radiation field.


    Sounds

    Choose the

    Sounds tab.


    New sound:


    Click the Choose sound

    from library button.


    Scroll down to

    choose Space ripple.

    Click OK.


    ## Scripts


    Click the Scripts tab. to make the rocket move until it hits a dangerous yellow
    particle. The ‘Touching

    colour'' block is in the Sensing group. Drop

    it into the hole in the ‘Repeat until’ loop.


    ## How to set the colour for a ‘Touching’ block


    Click the colour square.


    - Run the code when the Green flag is clicked;

    Shrink the Superlooper to 20%.

    Start at the left side of the Stage.

    Point the Superlooper to the right.

    Repeat the code in the loop until

    looper hits a yellow particle:

    Move the rocket forward. steps

    play sound effect. (Choose

    Space ripple.)

    The colour is set.


    Click the Green flag button at the top right of the Stage to test your code. Click
    the File menu then Download to your computer

    to save this game.

