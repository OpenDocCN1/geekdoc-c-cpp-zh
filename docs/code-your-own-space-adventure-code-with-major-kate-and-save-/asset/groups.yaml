    - 地下救援 26

    - 飞往香蕉雷塔之旅 30

    - 词汇表与索引 32


    # 使用 SCRATCH


    在本书中，我们将使用一种名为 Scratch 的编程语言来编写游戏。它是免费且易于学习的。在你和凯特航员出发执行任务之前，花几分钟了解一下 Scratch。


    # 寻找 Scratch


    要开始使用 Scratch，打开网页浏览器并点击地址栏。输入 scratch.mit.edu 然后按“回车”键。点击“Try it out”。


    # 开始使用 Scratch


    要编写电脑游戏，你需要准确地告诉电脑要做什么。你通过给它下命令来实现这一点。在 Scratch 中，命令以“代码块”的形式显示。你通过选择代码块并将它们连接在一起来创建一个程序。


    你的 Scratch 屏幕看起来应该是这样的：


    ![](img/c022ded506ce3bf5933f47355fd556be_5_0.png)


    选择所需的命令组。


    这些是当前组中的代码块。


    这是脚本区域（Scripts Area）。将你的代码块拖到这里来构建你的游戏。


    # 使用代码块


    在拖出任何代码块之前，尝试点击其中一个，让猫精灵向前移动……或者旋转 15 度。


    点击白色方框（在书中显示为彩色），然后输入不同的数字来改变精灵移动或旋转的距离。


    ![](img/c022ded506ce3bf5933f47355fd556be_6_0.png)


    现在尝试将代码块拖到脚本区域并将它们连接在一起。点击其中一个代码块来运行整个程序。


    你可以拆分代码块，但如果你想分离所有的块，需要从底部的块开始。要移除代码块，请将其拖出脚本区域。


    利用代码块的颜色来判断你会在哪个组中找到该块。它还会给你关于该代码块将执行什么操作提示。


    ![](img/c022ded506ce3bf5933f47355fd556be_6_1.png)


    从绿色的“画笔”（Pen）组获取“画笔”（Pen down）块。


    “重复”（Repeat）块是芥末色的，所以它在“控制”（Control）组。


    代码块在“动作”（Motion）组。


    # 使用绘制区域


    要画一个新精灵，点击精灵面板（Sprites Pane）顶部的“画画”（Paint sprite）按钮。


    ![](img/c022ded506ce3bf5933f47355fd556be_6_2.png)


    要为舞台（Stage）画背景，点击精灵面板中的“舞台”（Stage）按钮，然后点击“画新背景”（Paint new backdrop）。


    绘制区域将出现在 Scratch 屏幕的右侧：


    ![](img/c022ded506ce3bf5933f47355fd556be_6_3.png)


    - 画笔（Brush）：使用此工具进行绘制。

    - 矩形（Rectangle）：画矩形。按住“Shift”键可以画正方形。

    - 椭圆（Ellipse/Oval）：画椭圆。按住“Shift”键可以画圆形。

    - 填充（Fill）：用鼠标点击区域进行填充。

    - 缩放（Zoom）：放大和缩小。

    - 在此处选择颜色。

    - 更改线条粗细。


    任务控制中心呼叫：凯特少校急需你的帮助。不要犹豫，快去任务控制中心……谢天你终于来这儿了！齐斯纳尔星球发来了 SOS。他们被一种敌对生物入侵了。我们必须立即离开！问题是我的火箭“超级循环”在被小行星袭击后仍需要修理。我希望你有能力提供帮助。你能帮忙拯救齐斯纳尔人吗？你需要让超级循环准备好发射。在你的电脑上画出它，并确保它的激光完全正常工作！


    # 超级循环


    1. 打开 Scratch：我们需要删除猫精灵。在精灵面板中，右键点击猫。在 Mac 电脑上，按住“Ctrl”键并点击。点击“删除”（Delete）。

    2. 要开始画超级循环，在精灵面板中点击“画新精灵”（Paint new sprite）。选择椭圆工具。现在你应该可以看到绘制区域了。在屏幕底部，点击“实心”（Solid），这样我们就可以画填充形状了。


    ![](img/c022ded506ce3bf5933f47355fd556be_8_0.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_8_1.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_8_2.png)


    3. 为火箭尾翼选择一个深色。

    4. 选择长椭圆。拖动机身使其成为身体。

    5.。你需要让超级循环准备好发射。在你的电脑上画出它，并确保它的激光完全正常工作！


    ![](img/c022ded506ce3bf5933f47355fd556be_8_3.png)


    3. 为火箭尾翼选择一个深色。

    4. 选择长椭圆。拖动机身使其成为身体。

    5.。你需要让超级循环准备好发射。在你的电脑上画出它，并确保它的激光完全正常工作！


    ![](img/c022ded506ce3bf5933f47355fd556be_8_4.png)


    3. 为火箭尾翼选择一个深色。

    4. 选择长椭圆。拖动机身使其成为身体。

    5.。你需要让超级循环准备好发射。在你的电脑上画出它，并确保它的激光完全正常工作！


    超级循环现在准备好了！

    感谢你，立即离开去拯救齐斯纳尔人！

    我们必须立即离开去拯救齐斯纳尔人！

    感谢你，立即离开去拯救齐斯纳尔人！

    疯狂时刻

    4-3-2-1...


    # 发射！


    1. 在做其他事情之前，删除超级循环精灵。非常重要！在精灵面板中，右键点击超级循环。在 Mac 电脑上，按住“Ctrl”键并点击。点击“删除”（Delete）。输入超级循环作为精灵的名字。


    ![](img/c022ded506ce3bf5933f47355fd556be_9_0.png)


    2. 在 Scratch 屏幕中间，点击脚本（Scripts）标签以便添加一些代码让火箭移动起来。


    ![](img/c022ded506ce3bf5933f47355fd556be_9_1.png)

    ![](img/c022ded506ce3bf5933f47355fd556be_9_2.png)


    3. 将这些块拖入脚本区域，按此顺序。记住每个块的颜色告诉我们它属于哪个组。“当绿色旗被点击”块在“事件”组。蓝色块在“动作”组。紫色块在“外观”组。“永远”（Forever）循环块在“控制”组。


    | 当点击 | 告诉 Scratch 在点击绿色旗时运行下面的代码 |

    |---|---|

    | 直到 x: 0 y: -100 | 将超级循环移动到舞台中心底部。（你需要在白色框中输入 0 和 -100。） |

    | 朝向 20 | 调整超级循环的方向使其向上。（使用下拉菜单。） |

    | 设置大小为 30 % | 将超级循环精灵缩小到你画的尺寸的三分之一。 |

    | 说 5 持续1 秒 | 在气泡中显示“5”，持续 1 秒。 |

    | 说 4 持续1 秒 | 在气泡中显示“4”，持续 1 秒。 |

    | 说 3 持续1 秒 | 显示“3”。 |

    | 说 2 持续1 秒 | 显示“2”。 |

    | 说 1 持续1 秒 | 显示“1”。 |

    | 说 发射！ 持续1 秒 | 显示“发射！”，并持续 1 秒。 |

    | 永远 | 重复循环中的代码： |

    | 移动 2 步 | 让超级循环移动 2 步。（你需要在白色框中输入 2，否则火箭将以极其危险的速度发射！） |


    '
