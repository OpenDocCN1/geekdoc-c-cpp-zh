    将香蕉缩小到其尺寸的 30%。\n确保香蕉在舞台上可见。\n重复此代码，直到香蕉被 Sprite2 碰到：\n逆时针旋转香蕉 5 度。\n隐藏香蕉——它们被宇航员抓住了！\n\
