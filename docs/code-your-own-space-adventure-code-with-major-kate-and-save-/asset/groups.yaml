    # CODE YOUR OWN SPACE ADVENTURE


    By Max Wainwright


    CODE WITH MAJOR KATE AND SAVE PLANET ZYSKINAR


    ![](img/c022ded506ce3bf5933f47355fd556be_0_0.png)


    # CODE YOUR OWN SPACE ADVENTURE

    ## CODE WITH MAJOR KATE AND SAVE PLANET ZYSKINAR


    ![](img/c022ded506ce3bf5933f47355fd556be_2_0.png)


    By Max Wainwright


    QED


    Quarto is the authority on a wide range of topics.

    Quarto educates, entertains and enriches the lives of

    our readers--enthusiasts and lovers of hands-on living.

    www.quartoknows.com


    Author: Max Wainwright

    Illustration and design: Henry Smith

    Designer: Adrian Morris

    Editor: Claudia Martin


