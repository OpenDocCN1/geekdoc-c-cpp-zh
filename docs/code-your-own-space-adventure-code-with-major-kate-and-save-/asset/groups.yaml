    \n- 选择圆形（Ellipse）工具。将其设置为实心。选择一种合适的小行星颜色。\n- 画一个圆。\n- 使用橡皮擦画出陨石。使用橡皮擦让边缘变得粗糙一些。\n\
    - 如果出错，请使用“撤销”（Undo）。\n\n# 让我们添加一个激光击中小行星时播放的音效。\n\n新声音：\n\n点击“声音”（Sounds）标签。\n\
    \n点击“从库中选择声音”（Choose sound from library）。\n\n向下滚动并选择 Zoop 声音。\n\n点击“确定”。\n\n#\
    \ 点击“脚本”标签，并将此代码拖到小行星的脚本区域。\n\n```\nwhen clicked\n将大小设置为 50\n移到随机位置\n移动 400 步\n\
    重复直到碰到 ?\n  面向 Sprite ?\n  移动 10 步\n如果碰到 ? 然后\n  移到随机位置\n  移动 400 步\n停止全部\n```\n\
    \n当点击绿旗按钮时，运行以下代码：\n\n将小行星缩小到其尺寸的一半。\n\n将小行星移动到舞台上的随机位置。\n\n确保小行星从舞台边缘开始。\n\n\
    重复此代码，直到小行星撞中 Superlooper：\n\n让小行星面向 Superlooper。\n\n让小行星向 Superlooper 移动 1 步。\n\
    \n如果小行星被激光（Button）命中，运行此代码：\n\n将小行星移动到舞台上的随机位置。\n\n确保小行星从舞台边缘开始。\n\n播放音效。\n\n\
    如果小行星撞中 Superlooper，停止所有其他代码，这样激光就会停止，Superlooper 也无法旋转。\n\n按下绿旗按钮保护 Superlooper\
    \ 免受小行星攻击。你的游戏看起来应该是这样的！\n\n要保存游戏，选择“文件”并下载到你的电脑。\n\n# 哎呀！那些小行星在 Superlooper 上撞出了洞。我们所有的食物供应都漂到了太空！\n\
    \n我需要进行太空漫游来修理船体。别忘了收集漂浮的食物……\n\n你需要编写代码，让你能够收集在 Superlooper 周围漂浮的香蕉。你还需要修复船体的损坏。这比声音要简单——你可以通过触摸它们来“修复”漏洞！\n\
    \n首先，为你画一套宇航服和喷气背包。\n\n# 太空漫游！\n\n- 打开 Scratch。\n创建一个新文件。\n\n- 右键点击猫精灵。在 Mac 上，按住“Ctrl”并点击。\n\
