  md: '# CODE YOUR OWN SPACE ADVENTURE


    Astronaut Kate needs your help to save the Zyskinarians from an alien invasion!


    Prepare for an out of this world mission that will see you fixing the Superlooper
    rocket and navigating through an asteroid storm to reach Planet Zyskin.


    From drawing simple shapes, to building games, Code Your Own Space Adventure introduces
    essential coding concepts. Using Scratch, simple and practical tasks are explained
    using easy-to-follow, step-by-step instructions.'
