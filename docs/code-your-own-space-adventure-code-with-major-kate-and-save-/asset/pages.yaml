  md: 'Phew! You made it through the radiation field and are now within two light
    years of Planet Zyksinar. But Kate has bad news ...


    It''s one crisis after another! The scanners tell me we are entering an asteroid
    field. Blast those rocks with the ship''s lasers ...


    Now work out how to build code to swerve the Superlooper smoothly out of the way
    of any oncoming asteroids. And don''t forget to code a laser sprite that you can
    fire at that asteroid sprite.


