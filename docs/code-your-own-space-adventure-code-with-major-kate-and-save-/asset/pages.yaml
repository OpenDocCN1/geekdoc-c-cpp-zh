  md: 'Upload your Superlooper sprite.


    5. In the Scratch Menu bar, click the Grow button. Now click one or more times
    on the Superlooper on the Stage. Make it grow until it is about half the width
    of the Stage.


    ![](img/c022ded506ce3bf5933f47355fd556be_20_0.png)


    # 6. We need to draw your space suit and jet pack.


    While drawing, keep in mind that the astronaut sprite needs to be about third
    of the width of the Drawing Area. If it''s much bigger or smaller than this size,
    the game will not work properly.


    ![](img/c022ded506ce3bf5933f47355fd556be_20_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_20_2.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_20_3.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_20_4.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_20_5.png)


    In the Sprites Pane, click the Paint new sprite icon.


    Choose the Rectangle tool to start with.


    Make sure it is set to fill in.


    If you make a mistake, just click Undo.


    ![](img/c022ded506ce3bf5933f47355fd556be_20_6.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_20_7.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_20_8.png)


    Use three white rectangles to draw your space suit.


    Use dark grey to draw your boots and jet pack.


