- img_proc: true
  md: '# USING SCRATCH


    In this book, we will use a computer language called Scratch to code our games.
    It''s free to use and easy to learn. Before you set off on your mission with Astronaut
    Kate, take a few minutes to get to know Scratch.


    # FINDING SCRATCH


    To start using Scratch, open a web browser and click in the address bar. Type
    in scratch.mit.edu then press ''Return''. Click Try it out.


    # STARTING SCRATCH


    To code a computer game, you need to tell your computer exactly what to do. You
    do this by giving it commands. In Scratch, commands are shown in the form of ''code
    blocks''. You build a game by choosing code blocks and then joining them to create
    a program.


    Your Scratch screen should look like this:


    ![](img/c022ded506ce3bf5933f47355fd556be_5_0.png)


    Choose the group of commands you need.


    These are the code blocks in the current group.


    This is the Scripts Area. Drag your code blocks here to build your games.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# USING CODE BLOCKS


    Before you drag out any code blocks, try clicking on one to make the cat sprite
    move forward ... or rotate 15 degrees.


    Click in the white boxes (which are shown in this book as coloured) then type
    different numbers to change how far the sprite moves or turns.


    ![](img/c022ded506ce3bf5933f47355fd556be_6_0.png)


    Now try dragging code blocks over to the Scripts Area and joining them together.
    Click on one of the blocks to run the whole program.


    You can break code blocks apart, but you need to start with the bottom block if
    you want to separate them all. To remove a code block, drag it off the Scripts
    Area.


    Use the colour of the code blocks to work out which group you will find the block
    in. It will also give you a clue about what the code block will do.


    ![](img/c022ded506ce3bf5933f47355fd556be_6_1.png)


    Get the ''Pen down'' block from the green Pen group.


    The ''Repeat'' block is a mustard colour, so it''s in the Control group.


    The code blocks are in the Motion group.


    # USING THE DRAWING AREA


    To draw a new sprite, click on the Paint new sprite button located in the top
    bar of the Sprites Pane.


    ![](img/c022ded506ce3bf5933f47355fd556be_6_2.png)


    To draw a backdrop for the Stage, click on the Stage button located in the Sprites
    Pane then click on Paint new backdrop underneath it.


    The Drawing Area will appear on the right of your Scratch screen:


    ![](img/c022ded506ce3bf5933f47355fd556be_6_3.png)


    +   Brush

    Use this tool for drawing.


    +   Rectangle

    Draw a rectangle. Hold down the ''Shift'' key to make a square.


    +   Ellipse (Oval)

    Draw an ellipse. Hold down the ''Shift'' key to make a circle.


    +   Fill

    Fill an area by clicking in it with the mouse.


    Zoom in and out.


    Pick colours here.


    Change line thickness.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'A call comes in from Mission Control. Major Kate Glenn is in urgent need of
    your help. Without a moment''s hesitation, you race to Mission Control ...


    Thank goodness you are here! An SOS has come in from Planet Zyskinar. They have
    been invaded by a hostile life form. We need to leave right now!


    The problem is that my rocket, the Superlooper, is still in need of repairs after
    an unlucky asteroid strike on my last mission.

    I was told you had the skills to help.


    Can you help me save the Zyskinarians?


    You need to get the Superlooper ready for launch. Draw it on your computer screen
    and make sure that its rocket blasters are fully functioning!'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# THE SUPERLOOPER


    +   1. Open Scratch

    We need to delete the cat sprite. In the ** Sprites Pane**, right click the cat.
    On a Mac computer, hold the ''Ctrl'' key then click.

    Click Delete.


    +   3. Now you should be able to see the Drawing Area.


    +   2. To start drawing the Superlooper, click the Paint new sprite in the Sprites
    Pane.


    Choose the Ellipse tool.

    At the bottom of the screen, click the Solid ellipse so we can draw a filled-in
    shape.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_0.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_8_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_8_2.png)


    +   4. Pick a dark colour for the rocket fins.


    +   5. Choose a longer ellipse.


    Drag the body so it is in the middle of the circle.


    Draw a circle by dragging the mouse. Make it this size and position in the Drawing
    Area.


    Draw a longer ellipse to be the rocket''s body.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_3.png)


    If things go wrong, click Undo and go back a step or two.


    +   8. The basic rocket is now ready.


    +   9. Add any extra details you want using the Rectangle tool.


    +   Click the Select tool.


    Draw a select box around the left side of your artwork.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_4.png)


    Change colour and use the Ellipse tool to add portoles.


    Press the ''Delete'' key (or Backspace'' on a Mac) to delete the selected area.


    ![](img/c022ded506ce3bf5933f47355fd556be_8_5.png)


    The Superlooper is now ready!


    Turn over to find out how to save your Superlooper design so you can use it for
    the rest of your adventures. Quick - turn over!'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Thank you for fixing the Superlooper! We must leave right now to save the
    Zyskarians. It''s up to you to blast us off into space.

    5-4-3-2-1...


    # BLAST OFF!


    +   1. Before you do anything else, save the Superlooper rocket sprite you have
    drawn. This is very important!


    In the Sprites Pane, right click the Superlooper. On a Mac computer, hold the
    ''Ctrl'' key and click.


    Click Save to local file.


    Type in Superlooper as a name for your sprite. Click OK.


    ![](img/c022ded506ce3bf5933f47355fd556be_9_0.png)


    +   2. In the middle of the Scratch screen, click the Scripts tab so Scratch is
    ready for you to add some code to make the rocket move.


    ![](img/c022ded506ce3bf5933f47355fd556be_9_1.png)


    ![](img/c022ded506ce3bf5933f47355fd556be_9_2.png)


    +   3. Drag these blocks into the Scripts Area, in this order. Remember that the
    colour of each block tells us which group it is in. The ''When green flag clicked''
    block is in the Events group. The blue blocks are in the Motion group. All the
    purple blocks are in the Looks group. The ''Forever'' loop block is in Control.


    | when clicked | tells Scratch to run the code below when the Green flag button
    is clicked |

    |---|---|

    | go to x: 0 y: -100 | | Move the Superlooper to the centre of the Stage, near
    the bottom.

    (You will need to type 0 and -100 in the white boxes.) |

    | point in direction 20 | | Position the Superlooper so it is pointing upward.
    (Use the drop-down menu.) |

    | set size to 30 % | | Shrink the Superlooper sprite to about one third of the
    size you drew. |

    | say 5 for 1 secs | | Display ''5'' in a speech bubble, for 1 second. |

    | say 4 for 1 secs | | Display ''4'' in a speech bubble, for 1 second. |

    | say 3 for 1 secs | | Display ''3''. |

    | say 2 for 1 secs | | Display ''2''. |

    | say 1 for 1 secs | | Display ''1''. |

    | say Blast Off for 1 secs | | Display ''Blast Off!'' for 1 second. |

    | forever | | Repeat the code in the loop: |

    | move 2 steps | | Move the Superlooper 2 steps. (You will need to type 2 in the
    white box or the Superlooper will blast off dangerously fast!) |'
  merge: -1
