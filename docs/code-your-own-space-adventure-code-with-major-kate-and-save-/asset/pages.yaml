  md: '# GLOSSARY


    Animation – A series of pictures shown one after the other to give the illusion
    of movement (for example, that a sprite is walking).


    Operators group – The set of Scratch blocks that deals with calculations and comparing
    values.


    Code – A series of instructions or code blocks


    Program – The set of commands that tell a computer how to do something such as
    play a game.


    Command – A word or code block that tells the computer what to do.


    Scratch – A computer language that uses blocks of code to make a program.


    Co-ordinates – The position of an object determined by its x (centre to right)
    and y (centre to top) values.


    Scripts Area – The part of the right-hand side of the Scratch screen where code
    blocks are dragged to create programs.


    Data group – The set of Scratch code blocks that control and access variables.


    Sensing group – The set of Scratch blocks that detect when specific keys are pressed
    or where the mouse is.


    Degree – The unit measuring the angle that an object turns.


    Speed – How fast an object moves forwards. In Scratch, we use speed values to
    move objects backwards.


    Drawing Area – The part of the right-hand side of the Scratch screen that is used
    to draw sprites and backgrounds.


    Duplicate – A simple way to create a copy of a sprite in Scratch.


    Sprite – An object that moves around the screen.


    Events group – The set of Scratch blocks that are triggered when particular events
    happen, such as a key being pressed.


    Sprites Pane – Part of the lower left of the Scratch screen where you select a
    sprite to add code or to change its appearance.


    If – A common form of selection in coding, where command(s) are run if something
    is true.


    Stage – The area at the top of the Scratch screen where you can watch your sprites
    move about.


    Language – A system of commands (in the form of blocks, words or numbers) that
    tell a computer what to do.


    Variable – A value or piece of information stored by a computer program. In computer
    games, a variable is commonly used to store the score.


    Loop – A sequence of code blocks repeated a number of times.


    # INDEX


    +   animations 27

    arrow keys 27

