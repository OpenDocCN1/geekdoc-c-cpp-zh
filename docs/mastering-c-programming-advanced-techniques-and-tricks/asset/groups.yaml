    \ to the crash.\n- info display local variables in the current stack frame.\n\
    - show the source code around the current line.\n"
  mdcn: "\n\n# 理解日志的重要性\n\n日志记录（Logging）是记录程序运行信息的过程，它对于故障排除和监控应用程序的健康具有不可估的价值。当 bug\
    \ 或意外行为出现时，日志通常能为理解发生错误提供首要线索。有效日志的关键在于捕获适量的详细信息——信息太少会导致日志毫无用处，而信息过多则会让人无从从备。\n\
    \n# 有效日志的原则\n\n有效的日志策略共享以下几个共同原则：\n\n- 日志应包含与系统理解和故障排除相关的信息。\n- 消息必须清晰且易于理解，避免歧义。\n\
    - 日志消息的格式化和分类有助于更容易分析。\n- 时间戳、模块名称和操作标识符等上下文有助于定位问题。\n\n# 代码示例：实现有效的日志\n\n考虑一个处理用户交易的简单\
    \ C 应用程序。\n在此应用程序中实现有效日志，涉及策略性地放置日志语句，以捕获关键事件和数据。\n\n```c\n#include <stdio.h>\n\
    #include <time.h>\n\nvoid process_transaction(int userID, double amount) {\n \
    \   time_t now = time(NULL);\n    printf(\"[INFO] [%ld] Beginning transaction\
    \ for user: %d, amount: $%.2f\\n\", now, userID, amount);\n    // Simulate transaction\
    \ processing 这在真实场景中可能会发生错误\n    printf(\"[INFO] [%ld] Transaction successful\
    \ for user: %d, amount: $%.2f\\n\", now, userID, amount);\n}\n\nint main() {\n\
    \    process_transaction(123, 150.00);\n    return 0;\n}\n```\n\n# 解释日志输出\n\n\
    当运行此程序时，它输出的日志提供了交易过程的洞察：\n\n```\n[INFO] [1616179002] Beginning transaction for\
    \ user: 12345, amount: $150.00\n[INFO] [1616179002] Transaction successful for\
    \ user: 12345, amount: $150.00\n```\n\n从这些日志中，人们不仅可以发现交易的成功完成，还能了解操作的时间和具体细节。在现实场景中，交易可能在某些条件下失败，在关键点放置的类似日志语句（可能包括错误或异常捕获）可以为调试提供无价值的信息。\n\
    \n# 复杂系统的高级日志技术\n\n在更复杂的系统中，可以使用如日志聚合和日志分析工具等额外的日志技术。这些工具将系统所有部分的日志汇集到中心位置，使其更容易识别指示潜在问题的模式或异常情况。\n\
    此外，实现结构化日志（即日志条目以结构化格式格式，例如 JSON）可以简化自动化日志分析。\n\n有效日志对于调试复杂系统至关重要。通过遵循相关性、清晰性、一致性和上下文原则，并利用日志聚合和分析的高级技术，开发者可以显著增强他们诊断并高效解决问题的能力。\n\
    \n6.6\n\n# 使用 Thread Sanitizer 调试多线程应用程序\n\nC 程序中的多线程可以通过利用并发执行显著提高性能。然而，它也引入了复杂性，使调试更具挑战性。竞态条件、死锁和内存损坏等问题在多线程应用程序中更为常见。坦率地说，Thread\
    \ Sanitizer (TSan) 等工具提供了在开发周期早期检测线程问题的强大方法。本节探讨了如何使用 Thread Sanitizer 有效地调试多线程\
    \ C 程序。\n\n# 理解 Thread Sanitizer\n\nThread Sanitizer 是一种用于检测 C/C++ 程序中线程问题的运行时工具。它拦截所有的线程操作（包括锁管理），并检查各种并发问题，例如：\n\
