    \ 和 UDP（用户数据报文协议）Socket。本节将深入探讨 Socket 编程的基础，涵盖 TCP 和 UDP Socket，并通过详细的代码示例演示它们的用法。\n\
    \n理解 Socket：从本质上，Socket 是两个进程之间通信的接口。将 Socket 想象成客户端和服务器之间双向通信链路的一端。每个 Socket\
    \ 都有关联的 IP 地址和端口，它们共同工作以唯一标识通信端点。\n\nTCP 提供了一种可靠的、面向连接的方式来发送和接收数据。通过 TCP 连接发送的数据保证按顺序到达且不重复，这使得\
