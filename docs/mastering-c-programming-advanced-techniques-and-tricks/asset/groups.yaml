    \ tools like Thread Sanitizer (TSan) provide powerful ways to detect threading\
    \ issues early in the development cycle. This section explores how to use Thread\
    \ Sanitizer to debug multithreaded C programs effectively.\n\n# Understanding\
    \ Thread Sanitizer\n\nThread Sanitizer is a runtime tool designed to detect threading\
    \ issues in C/C++ programs. It intercepts all thread operations, including lock\
    \ management, and checks for various concurrency problems, such as:\n\n- Data\
    \ races\n- Deadlocks\n- Use after free in multithreaded contexts\n- Double locks\n\
    - Thread leaks\n\nTo use Thread Sanitizer, you must compile your program with\
    \ the -fsanitize=thread flag using a supported compiler, such as GCC or Clang.\
    \ This flag instructs the compiler to include the TSan instrumentation code in\
    \ the resulting binary.\n\n# Code Example: Detecting Data Races with Thread Sanitizer\n\
    \nConsider a simple C program that creates two threads. Both threads attempt to\
    \ modify a global variable without proper synchronization mechanisms, leading\
    \ to a data race.\n\n```c\n#include <stdio.h>\n#include <pthread.h>\n#include\
    \ <stdlib.h>\n\nint counter = 0;\n\nvoid* increment(void* arg) {\n    for (int\
    \ i = 0; i < 100000; i++) {\n        counter++;\n    }\n    return NULL;\n}\n\n\
    int main() {\n    pthread_t t1, t2;\n    pthread_create(&t1, NULL, increment,\
    \ NULL);\n    pthread_create(&t2, NULL, increment, NULL);\n    pthread_join(t1,\
    \ NULL);\n    pthread_join(t2, NULL);\n    printf(\"Final counter: %d\\n\", counter);\n\
    \    return 0;\n}\n```\n\nTo compile this program with Thread Sanitizer, you would\
    \ use a command similar to the following:\n\n```bash\ngcc -fsanitize=thread -g\
