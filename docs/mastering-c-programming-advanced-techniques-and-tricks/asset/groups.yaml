    \ 复用，并演示了如何在 C 语言中利用这些概念构建可扩展服务器。\n\n阻塞 Socket：在传统的 Socket 编程中，Socket 默认是阻塞的。这意味着发送或接收数据的调用会直到操作完成。虽然这种模型对于低并发要求的应用程序良好，但对于阻塞\
