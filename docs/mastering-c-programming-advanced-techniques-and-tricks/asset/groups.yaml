    \ <signal.h>\n#include <pthread.h>\n\n// Signal handler function\nvoid sig_handler(int\
    \ sig) {\n    printf(\"Received signal %d\\n\", sig);\n}\n\nvoid *thread_func(void\
    \ *arg) {\n    sigset_t set;\n    // Block all signals except SIGUSR1 in this\
