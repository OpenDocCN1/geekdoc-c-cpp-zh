  - '[PAGE 159]


    # Profiling Applications with gprof to Identify Performance Bottlenecks


    Profiling is a crucial step in the optimization process of any application. It
    involves analyzing a program to determine which sections of code are consuming
    the most resources, such as CPU time. For C programmers, ''gprof'' is a valuable
    tool that offers insight into the performance characteristics of a program, enabling
    developers to identify and focus their optimization efforts on the parts of the
    code that matter most. This section explores how to use ''gprof'' to profile C
    applications and interpret the results to pinpoint performance bottlenecks.'
  - '[PAGE 160]


    # An Introduction to gprof


    ‘gprof’ is a performance analysis tool for C programs that provides both flat
    profiles and call graph information. A flat profile shows how much time your program
    spent executing each function, while the call graph shows the call relationships
    between functions and how much time was spent in the call trees.


    To use ‘gprof’, you first need to compile your program with the ‘pg’ flag, which
    instructs the compiler to insert special instrumentation code into the executable.
    After running your program, a file named ‘gmon.out’ is generated, containing profiling
    data that ‘gprof’ can analyze.'
