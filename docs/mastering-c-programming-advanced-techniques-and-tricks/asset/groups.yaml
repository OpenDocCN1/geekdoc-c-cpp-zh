    \ = newNode;\n}\n```\n\n### 删除操作：链表的删除可以通过定位要删除的节点并调整指针以跳过被删除节点来实现。\n\n按键删除：在这里，我们搜索具有特定键的节点，然后更新指针将其从列表中移除。\n\
    \n```c\nvoid deleteNodeByKey(Node** head, int key) {\n    Node *temp = *head,\
