    \    if (prev == NULL) *head = temp->next;\n    else prev->next = temp->next;\n\
    \    free(temp);\n}\n```\n\n### 遍历：遍历链表涉及顺序访问每个节点直到到达末尾。这通常使用循环来访问每个节点。\n\n```c\n\
