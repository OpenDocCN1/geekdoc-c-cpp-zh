    }\n```\n\n在本示例中，SIGUSR1 由主线程引发并在线程中处理。注意，在更复杂的场景下，可能需要额外的同步来从处理器内部访问共享资源。\n\n\
    ## 多线程信号处理的最佳实践\n\n### 信号内部的工作最小化\n信号处理器应执行最少的工作，理想情况下由程序的其他部分检查标记或使用机制与其他通信。\n\
    \n### 使用 sigaction()\n获取信号处理的控制，包括在处理器执行期间阻塞其他信号。\n\n### 小心使用同步\n避免锁定可能被信号中断的互斥锁，因为这会导致死锁。\n\
