    # Optimizing Data Structures for Alignment


    When defining structures, the C compiler automatically inserts padding to ensure
    each member is aligned properly according to the target platform''s requirements.
    However, understanding and optimizing the layout of your data structures can significantly
    improve the performance.


    Example: Optimizing Structure Memory Layout


    Consider the following structure:


    ```

    typedef struct { a; // 1 byte 3 bytes padding b; // 4 bytes c; // 1 byte 3 bytes
    padding } ExampleStruct;

    ```


    This struct, when not optimized for alignment, will have a size of 12 bytes due
    to automatic padding inserted by the compiler to align the int variable on a 4-byte
    boundary.


    A more optimized version could rearrange the members to minimize padding:


    ```

    typedef struct { a; // 1 byte c; // 1 byte 2 bytes padding b; // 4 bytes } OptimizedExampleStruct;

    ```


    The optimized struct has a size of 8 bytes, reducing memory usage and potential
    cache misses.'
