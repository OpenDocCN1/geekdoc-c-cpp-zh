    that can be read or written to a disk per second. the time it takes to complete
    a single I/O operation, such as the time from issuing a read command to receiving
    the first byte of data.


    Optimizing for throughput may involve different strategies than optimizing for
    latency, and sometimes there’s a trade-off between the two.


    Buffering and Batch Processing:


