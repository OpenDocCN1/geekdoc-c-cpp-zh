    // Sum from 0 to 1 million Create the thread to complete NULL; sum_runner, Wait
    for the thread to complete NULL; 0; }

    ```


    In this example, the sum_runner function calculates the sum of numbers from 0
    to it and it is executed in a separate thread. The pthread_create function creates
    the thread, and pthread_join waits for the thread to complete its execution. This
    basic pattern can be extended to create multiple threads performing different
    parts of a calculation in parallel, thus utilizing multiple cores effectively.'
