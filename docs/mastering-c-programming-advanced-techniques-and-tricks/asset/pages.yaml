- pgno: 210
  md: '# Compiler Optimizations: Inline Functions, Loop Unrolling, and More


    Compiler optimizations are a suite of techniques aimed at improving the performance
    of C programs without requiring changes to the source code. Modern C compilers,
    such as GCC and Clang, provide a vast array of optimization options that can automatically
    alter the generated code to run faster and/or use less memory. In this section,
    we delve into specific optimization techniques like inlining functions and loop
    unrolling work and how they can be manually guided or leveraged through compiler
    flags.


    # Inline Functions:


    Inlining is a compiler optimization technique where the compiler replaces a function
    call with the actual code of the function. This eliminates the overhead associated
    with function calls, including passing arguments, stack frame management, and
    return value handling. While function inlining can significantly speed up a program,
    especially in tight loops or heavily used utility functions, it also has the potential
    to increase the binary size (a phenomenon known as code bloat).


    Modern compilers are generally smart about deciding which functions to inline.
    However, developers can also hint the compiler using the inline keyword, suggesting
    that a function should be inlined if it will result in performance improvements.


    ```

    inline int a, int b) { a > b ? a : b; }

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'In the above example, whenever the max function is called, the compiler may
    replace the call with the actual comparison code, thereby avoiding the function
    overhead.


    Loop Unrolling:


    Loop unrolling is another optimization technique aimed at reducing the overhead
    of loop control. By duplicating the body of the loop a fixed number of times and
    decreasing the number of iterations accordingly, the program does fewer iterations
    and fewer tests and jumps, which can be particularly beneficial on architectures
    with deep pipelines or where branch prediction is a challenge.


    Consider the following loop that sums the elements of an array:


    ```

    int array, int size) { total = 0; i = 0; i < size; i++) { += array[i]; total;
    }

    ```


    An unrolled version of this loop might look like this for unrolling by a factor
    of 4:


    ```

    int array, int size) { total = 0; limit = size - 3; i = 0; i < limit; i += 4)
    { += array[i] + array[i+1] + array[i+2] + array[i+3]; i < size; i++) { += array[i];
    total; }

    ```


    This manual unrolling reduces the number of iterations and conditional jumps,
    which can lead to performance improvements for large arrays.


    Other Compiler Optimizations:'
