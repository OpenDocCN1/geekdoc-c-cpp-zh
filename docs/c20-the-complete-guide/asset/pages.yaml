  md: '# Clocks in Detail


    # 14.7 Clocks in Detail


    C++20 now has support for a couple of clocks. This section discusses their differences
    and how to use special clocks.


    # 14.7.1 Clocks with a Specified Epoch


    C++20 now provides the following clocks associated with an epoch (so that they
    define a unique point in time):


    +   * **The system clock** is the clock of your operating system. Since C++20
    it is specified to be Unix Time, which counts since the epoch January 1, 1970
    00:00:00 UTC.


    Leap seconds are handled in a way that some seconds might add a little bit longer.
    Therefore, you never have years with 61 seconds and all years with 365 days have
    the same number of 31,536,000 seconds.


    +   * **The UTC** is the clock representing the Coordinated Universal Time, popularly
    known as GMT (Greenwich Mean Time), and Zulu Time. Local time differs from UTC
    by the UTC offset of your timezone. It uses the same epoch (January 1, 1970 00:00:00
    UTC).


    Leap seconds are handled in a way that some minutes might have 61 seconds. For
    example, there is a timepoint 1972-06-30 23:59:60 because a leap second was added
    at the last minutes of June 1972. Therefore, years with 365 days have 31,536,001
    or over 31,536,002 seconds.


    +   * **The GPS clock** uses the time of the Global Positioning System, which
    is the atomic time scale implemented by the atomic clocks in the GPS ground stations
    and satellites. GPS time starts with the epoch of January 6, 1980 00:00:00 UTC.


    Each hour has 60 seconds, but GPS takes leap seconds into account by switching
    earlier to the next hour. As a result, GPS is more and more seconds ahead of UTC
    (or more and more seconds behind before 1980). For example, the time point 2021-01-01
    00:00:00 UTC is represented as GPS time point as 2021-01-01 00:00:18 GPS. So,
    while writing this book GPS time points are 18 seconds ahead.


    All years with 365 days (the difference between a mine date and the GPS date one
    year later) have the same of 31,536,000 seconds, but may be one or two seconds
    shorter than the "real" year.


    +   * **The TAI** uses the International Atomic Time, which is the atomic time
    scale based on a continuous counting of the SI. TAI time starts with the epoch
    of January 1, 1958 00:00:00 UTC.


    TAI is currently ahead of UTC by 37 seconds. TAI is always ahead of GPS by 19
    seconds. which is the atomic time scale implemented by the atomic clocks in the
    GPS ground stations and satellites.

    As it is the case for GPS, each hour has 60 seconds, and leap seconds are taken
    into account by switching earlier to the next hour. As a result, TAI is more and
    more seconds ahead of UTC, but always has a constant offset of 19 seconds to GPS.
    For example, the time point 2021-01-01 00:00:00 UTC is represented as TAI time
    point as 2021-01-01 00:00:37 TAI. So, while writing this book TAI time points
    are 37 seconds ahead.


    8 For details about Unix Time see, for example, http://en.wikipedia.org/wiki/Unix_time.'
