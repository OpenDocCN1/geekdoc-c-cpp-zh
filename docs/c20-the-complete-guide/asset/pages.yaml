    \ one) and the name of the module may have nothing to do with the name or location\
    \ of the file.\n\nOf course, it makes sense to keep filenames and modules somehow\
    \ in sync; however, that decision is only a decision of the configuration management\
    \ of your source code.\n\nAs written, already there are no specific file extensions\
