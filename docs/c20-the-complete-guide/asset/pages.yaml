  md: "# 3.1 Motivating Example of Concepts and Requirements\n\n```\n{\n    return\
    \ b < a ? a : b; // compare values\n}\n\ntemplate<typename T>\nrequires IsPointer<T>\n\
    auto maxValue(T a, T b) // maxValue() for pointers\n{\n    return maxValue(*a,\
    \ *b); // compare values the pointers point to\n}\n```\n\nNote that a clause constrains\
    \ a template with a concept that no longer needs parentheses.\nNow we have two\
    \ function templates with the same name, but only one of them available for each\
    \ type:\n\n```\nint x = 42;\nint y = 77;\nstd::cout << maxValue(x, y) << '\\\n\
    '; // calls maxValue() for not pointers\nstd::cout << maxValue(&x, &y) << '\\\n\
    '; // calls maxValue() for pointers\n```\n\nBecause the implementation for pointers\
    \ delegates the computation of the return value to the objects the pointers refer\
    \ to, the second calls calls maxValue() templates. When passing pointers to int,\
    \ we instantiate the template for pointers being int* and the basic maxValue()\
    \ template that is not for pointers T being int.\nThis even works recursively.\
    \ We can ask for the maximum value of a pointer to a pointer to an int:\n\n```\n\
    int* xp = &x;\nint* yp = &y;\nstd::cout << maxValue(&xp, &yp) << '\\\n'; // calls\
    \ maxValue() for int**\n```\n\n# Overload Resolution with Concepts\n\nOverload\
    \ resolution considers templates with constraints as more special than templates\
    \ without. Therefore, it is enough to only constrain the implementation for pointers:\n\
    \n```\ntemplate<typename T>\nT maxValue(T a, T b) // maxValue() for a value of\
    \ type T\n{\n    return b < a ? a : b; // compare values\n}\n```\n\n```\ntemplate<typename\
    \ T>\nrequires IsPointer<T>\nauto maxValue(T a, T b) // maxValue() for pointers\
    \ (higher priority)\n{\n    return maxValue(*a, *b); // compare values the pointers\
    \ point to\n}\n```"
