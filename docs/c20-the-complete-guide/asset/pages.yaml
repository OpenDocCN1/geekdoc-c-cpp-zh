  md: '# Chapter 1: Comparisons and Operator <==


    In general, the compiler tries to call:


    +   - a free-standing operator !=: operator!=(x, y)

    - a member operator !=: x.operator=(y)


    Having both operators == defined is an ambiguity error


    +   - a free-standing operator ==: operator===(x, y)

    - a member operator ==: x.operator==(y)


    Note that the member operator == may be generated from a defaulted operator<=>
    member.

    Again, having both operators == defined is an ambiguity error. This also applies
    if the member operator== is generated by a defaulted operator<=>.


    When an implicit type conversion for the first operand v is necessary, the compiler
    tries to reorder the operands. Consider:


    ```

    v != y // v converts to the type of y

    ```


    In that case the compiler tries to call:


    +   - a free-standing operator !=: operator=(v, y)

    - a free-standing operator ==: operator==(v, y)

    - a member operator ==: y.operator==(v)

    (note that the member operator == may be generated from a defaulted operator<=>
    member)


    So in this case a free-standing function is preferred over a member function because
    the order of the operands does not have change.

    Note that a rewritten expression never tries to call a member operator !=.


    # Calling Relational Operators


    For the relational operators we have similar behavior except the rewritten statements
    fall back on the new operator <= and compare the result with 0. The operator behaves
    like a three-way comparison function returning a negative value for less, 0 for
    equal, and a positive value for greater (it does not return a numeric value, but
    values that behave like that).

    For example, to compile


    ```

    x <= y

    ```


    the compiler now tries all of the:


    ```

    x.operator<=(y) // calling member operator<= for x

    operator<=(x, y) // calling a free-standing operator<= for x and y


    x.operator<>(y) <= 0 // calling member operator<=> for x

    operator<=>>(x, y) <= 0 // calling a free-standing operator<=> for x and y


    0 <= y.operator<>(x) // calling member operator<=> for y

    ```


    Again, the last is tried to support an implicit type conversion for the first
    operand, for which it has to become a parameter.'
