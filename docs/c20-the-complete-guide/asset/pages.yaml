    \ object of type Customer.\n\nPrivate module fragments can be used to restrict\
    \ the reachability of classes and functions.\n\n# 19.1.4 Modules and Namespaces\n\
    \nAs already mentioned, symbols of a module are imported in the same scope they\
    \ are exported. In contrast to some programming languages, C++ modules do not\
    \ automatically introduce a namespace for a module.\n\nYou might therefore use\
    \ the convention exporting everything in a module in a namespace with its name.\
    \ You can do that in two ways:\n\n+   * Specify what you want to export inside\
    \ the namespace:\n  ```cpp\nexport module Square; // declare module \"Square\"\
    \n\nnamespace Square {\n  int square(int i);\n  ...\n  export class Square {\n\
    \  };\n\n  export template<typename T>\n  Square toSquare(const T& x) {\n  }\n\
    \n  int square(int i) // not exported\n  ...\n}\n  ```\n\n+   * Specify everything\
    \ you want to export in a namespace declared with export:\n  ```cpp\nexport module\
    \ Square; // declare module \"Square\"\n\nint square(int i);\n\nexport namespace\
    \ Square {\n  class Square {\n  ...\n  };\n\ntemplate<typename T>\nSquare toSquare(const\
    \ T& x) {\n  ...\n}\n  ```"
