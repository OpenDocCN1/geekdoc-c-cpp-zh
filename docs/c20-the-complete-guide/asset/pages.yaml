    \ introduced before could not be used:\n\n```\ntemplate<std::ranges::input_range\
    \ Range>\nstd::ranges::range_value_t<Range> maxValue(const Range& rg)\n{\n   \
    \ // ERROR iterating over the elements of a filter view\n}\n```\n\nFor this reason,\
    \ the generic maxValue() function is better implemented as follows:\n\n```\nlib/maxvalue2.hpp\n\
    #include <ranges>\n\ntemplate<std::ranges::input_range Range>\nstd::ranges::range_value_t<Range>\
    \ maxValue(Range&& rg)\n{\n    if (std::ranges::empty(rg)) {\n        return std::ranges::range_value_t<Range>{};\n\
    \    }\n    auto pos = std::ranges::begin(rg);\n    auto max = *pos;\n    while\
    \ (++pos != std::ranges::end(rg)) {\n        if (*pos > max) {\n            max\
    \ = *pos;\n        }\n    }\n    return max;\n}\n```\n\nHere we declare parameter\
    \ rg as a universal/forwarding reference:\n\n```\ntemplate<std::ranges::input_range\
    \ Range>\n```\n\n> ^8 In the C++ standard universal references are called forwarding\
    \ references, which is unfortunate, because they do not really forward until std::forward<>()\
    \ is called for them, and perfect forwarding is not always the reason to use these\
    \ references (as in this example demonstrates)."
