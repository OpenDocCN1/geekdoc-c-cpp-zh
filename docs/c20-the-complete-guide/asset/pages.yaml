  md: "# Chapter 13: Formatted Output\n\nThe function takes a std::format_parse_context,\
    \ provides an API to iterate over the remaining characters of the passed format\
    \ string starting with the first character specific for the value to parse:\n\n\
    +   - If the format string is \"{}\"\n  ctx.begin() points to: \"{}\"\n- If the\
    \ format string is \"Twice: {0}{0}\"\n  ctx.begin() points to: \"{0}{0}\"\n  called\
    \ for the first time\n\nThere is also a ctx.end(), which points to the end of\
    \ the whole format string. If the format string is \"{1:7f}\\\\n\", ctx.begin()\
    \ is the position of the 7 and ctx.end() is the end of the whole format string\
    \ after the \\n.\n\nThe task of parse() is to parse the specified format of the\
    \ passed argument and return the position of the end of our specifier, which is\
    \ the trailing }. In our implementation, we simply return the position of the\
    \ first character we get, which is if the next character is really } (this is\
    \ the first thing we have to improve). Calling std::format() with any specified\
    \ format character is error:\n\n```\nAlways40 val;\nstd::format('{:7}', val) //\
    \ ERROR\n```\n\nNote that the member function must be constexpr to support compile-time\
    \ computing of the format string. Note that this code has to accept all restrictions\
    \ of constexpr functions (which were relaxed with C++20).\n\nHowever, you can\
    \ see how this API allows us to parse whatever format we have specified for our\
    \ type. Of course, we follow the conventions of the standard specifiers to avoid\
    \ programmer confusion.\n\n# Performing the Formatting\n\nIn format() we implement\
    \ the function to format the passed value:\n\n```\n// format by always writing\
    \ its value:\nauto format(const Always40& value, std::format_context& ctx) const\
    \ {\n    return std::format_to(ctx.out(), \"{}\", value.getValue());\n}\n```\n\
    \nThe function takes two parameters:\n\n+   - Our value passed as argument to\
    \ std::format() (or similar functions)\n- A std::format_context, which provides\
    \ the API to write the resulting characters of the formatting (according to the\
    \ parsed format).\n\nThe most important function of the format context is out(),\
    \ which yields an object you can pass to std::format_to() to write the actual\
    \ characters of the formatter. The function has to return the new position for\
    \ further output, which is returned by std::format_to().\n\nNote that it is currently\
    \ unclear whether the format() member function of a formatter should be const.\
    \ However, if you implement it you should better use const (unless the implementation\
    \ modifies something). See wg21.link/lwg3636 for details."
