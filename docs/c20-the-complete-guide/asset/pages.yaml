    # 6.1.2 Range adaptor counted


    The range adaptor std::views::counted() provides the most flexible way to create
    a view from a begin iterator and count. Depending on what you pass, it creates
    a view for the first n elements of a begin iterator/.

    It is up to the programmer to ensure that the count is valid (passing a count
    that is too high results in undefined behavior). The count may be 0, which means
    the range is empty


    +   * It yields a std::span if yields different types depending on the passed
    iterator is a contiguous_iterator (refers to elements that are stored in contiguous
    containers). This applies to pointers and iterators of std::vector<>, std::array<>,
    and arrays.

    * Otherwise, it yields a std::ranges::subrange if the passed iterator is random_access_iterator
    (supports to jump back and forth between elements). This applies to iterators
    of list, std::deque<.

    * Otherwise, it yields a std::ranges::subrange of std::counted_iterator with a
    dummy sentinel of type std::default_sentinel_t. This means that the iterator counts
    while iterating. This applies to iterators of list, associative containers, and
    unordered containers (hash tables).


    For example:


    ```

    std::vector<int> vec(1, 2, 3, 4, 5, 6, 7, 8, 9);

    auto vec5 = std::ranges::find(vec, 5);

    auto v1 = std::views::counted(vec, 5); // view to element 5 and 2 more elements
    in vec

    // v1 is std::span<int>

    ```


    ```

    std::deque<int> deq(1, 2, 3, 4, 5, 6, 7, 8, 9);

    auto deg5 = std::ranges::find(deque, 5);

    auto v2 = std::views::counted(deque, 3); // view to element 5 and 2 more elements
    in deq

    // v2 is std::ranges::subrange<std::deque<int>>::iterator

    ```


    ```

    std::list<int> lst(1, 2, 3, 4, 5, 6, 7, 8, 9);

    auto lst5 = std::ranges::find(lst, 5);

    auto v2 = std::views::counted(lst, 3); // view to element 5 and 2 more elements
    in lst

    // v3 is std::ranges::subrange<std::counted_iterator<std::list<int>>::iterator,

    // std::default_sentinel_t>

    ```


    > 2 For laves of move-only types there is an issue that all() is ill-formed although
    viewable_range is satisfied.'
