    ```

    std::ranges::viewable_range<std::vector<int>>                     // false

    std::ranges::viewable_range<std::vector<int>&>                // true

    std::ranges::viewable_range<std::vector<int>&&>                 // false

    std::ranges::viewable_range<std::ranges::iota_view<int>>         // true

