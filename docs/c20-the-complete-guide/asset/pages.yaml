  md: '# 20  Chapter 2: Placeholder Types for Function Parameters


    ```

    for (const auto& elem : coll) {

    std::cout << elem << ''\\n'';

    }

    ```


    Such a declaration is just short to declare/define a template such as the following:


    ```

    template<typename T>

    void printColl(const T& coll) // equivalent generic function

    for (const auto& elem : coll) {

    std::cout << elem << ''\\n'';

    }

    ```


    The only difference is that using auto you no longer have a name for a template
    T. For this reason, this feature is also called the abbreviated function template
    syntax.


    Because functions are auto templates, all rules of using function templates apply.
    That especially has the consequence that you cannot implement a function with
    auto parameters in one translation unit (CPP file) while calling it in a different
    translation unit. Functions with auto parameters in a header file to be usable
    in CPP files (or you to explicitly instantiate the function in one translation
    unit). However, it does not need to be declared as inline, because function templates
    are always inline.


    # 2.1.1 auto for Parameters of Member Functions


    You can also use this feature to define member functions:


    ```

    class MyType {

    ...

    void assign(const auto&newVal);

    };

    ```


    That declaration is equivalent to (with the difference that there is no type T
    defined):


    ```

    class MyType {

    ...

    template<typename T>

    void assign(const T& newVal);

    };

    ```


    However, note that may not be declared inside functions. Therefore, with that
    feature you can no longer define the class or data structure locally inside a
    function:


    ```

    void foo() {

    struct Data {

    void mem(auto); // ERROR can''t declare templates inside functions

    };

    };

    ```'
