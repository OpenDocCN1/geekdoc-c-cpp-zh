  md: '# Chapter 13


    # Formatted Output


    The C++ IOStream library provides only inconvenient and limited ways to support
    formatted output (specifying a field width, fill characters, etc.). For that reason,
    formatted output still often uses functions sprintf().


    C++20 introduces a new library for formatted output, which is described in this
    chapter. It allows a convenient specification of formatting attributes and is
    extensible.


    # 13.1 Formatted Output by Example


    Before we go into details, let us look at some motivating examples.


    # 13.1.1 Using std:: : format )


    The key approach is provided by the function std::format(), which allows you to
    specify a string in which placeholders of braces can be used to pass arguments:


    ```

    #include <format>

    ...

    std::string str{"hello"};

    ...

    std::cout << std::format("String ''{}'' has {} chars\n", str, str.size());

    std::cout << std::format("{0} is the size of string ''{0}''\n", str, str.size());

    ```


    The output of these two statements are:


    String ''hello'' has 5 chars

    5 is the size of string ''hello''


    The function std::format(), defined in <format>, takes a format string (a string
    literal, string, or string view known at compile time), in which {} represents
    the next argument (with the default formatting of its type), and yields a std::string
    with the formatted inserted arguments. An optional integral value'
