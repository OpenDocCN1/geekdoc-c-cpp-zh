  md: '# Glossary


    # small/short string optimization (SSO)


    An approach to save allocating memory for short strings by always reserving memory
    for a certain number of characters. A typical value in standard library implementations
    is to always reserve 16 or 24 bytes of memory that the string can have 15 or 23
    characters (plus 1 byte for the null terminator) without allocating memory. This
    makes all string objects larger but usually saves a lot of running time in practice,
    strings are shorter than 16 or 24 characters and allocating memory on the heap
    is quite an expensive operation.


    # stateless


    A function or operations is stateless if it does not change its state due to a
    call. That is it should not change its behavior over time and yield the same result
    for the same arguments.


    # standard template library (STL)


    The STL is the part of the C++ standard library that deals with containers (data
    structures), algorithms, and as glue the iterators. This approach was adopted
    for the first C++ standard with the goal that programmers benefit from various
    data structures and algorithms without the need to implement them. As generic
    code you still compile-time error messages when you try to combine things that
    are not supported.


    # U


    # universal reference


    A reference that can universally refer to any object while not making const. It
    can also extend the lifetime of return values. It is declared as value reference
    of a template parameter (T&) or with auto&&. Universal references are useful to
    perfectly forward arguments with std::forward<> (for the reason that the C++ standard
    names them forwarding references), but also to refer to passed arguments or extend
    the lifetime of temporary return values, when making them const a problem (which
    is the case for some views).


    # V


    # value category


    A classification of expressions. The traditional value categories lvalues and
    rvalues were inherited from the programming language C. C++11 introduced alternative
    categories: glvalues (generalized lvalues), whose evaluation identifies stored
    objects, (pure rvalues), whose evaluation initialize objects. Additional categories
    subdivide glvalues into lvalues (localizable values) and xvalues (expiring values).
    In addition, rvalues (readable values) serve as a composed category for both xvalues
    and prvalues (before C++11, rvalues were prvalues since C++11).


    # variable template


    A amplified variable. It allows us to define variables or static members by substituting
    the template parameters with specific types or values.


    # variadic template


    A template with a template parameter that represents an arbitrary number of types
    or values.'
