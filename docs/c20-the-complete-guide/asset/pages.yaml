  md: '# Glossary


    This glossary provides a short definition of the most important non-trivial technical
    terms used in this book.


    # A


    **argument-dependent lookup (ADL)**nA feature that allows the programmer to skip
    namespace qualification of a function when one of the parameters is in its namespace.
    That is, a function will be looked up also in all namespaces of the arguments
    passed.


    # C


    **class template argument deduction (CTAD)**nA process that implicitly determines
    template arguments from the context in which class templates are used. It was
    introduced with C++17 and allows you to specify template arguments of an object
    when the template parameters can be deduced from the constructor.


    # F


    **forwarding reference**nThe term the C++ standard uses for *universal references*.


    **full specialization**nA alternative definition for a *(primary)* template that
    no longer depends on any template parameter.


    **function object (functor)**nAn object that can be used as a function. For this,
    in the class `operator()` is defined. All lambdas are function objects.'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# G


    glvalue


    A *value* category of expressions that produce a location for a stored value (generalized
    localizable value). A glvalue can be an *lvalue* or an *xvalue*.


    # I


    incomplete type


    A class, struct, or unscoped enumeration type that is declared but not defined,
    an array of unknown size, void (optionally with const and/or volatile), or an
    array of an incomplete element type.


    # L


    lvalue


    A *value* category of expressions that produce a location for a stored value that
    is not assumed to be movable (i.e., *glvalues* that are no *xvalues*). Examples
    are:


    +   - Named objects (variables)

    - String literals

    - Returned lvalue references

    - Functions and all references to functions

    - Data members (unless values member of rvalues)


    # P


    partial specialization


    An alternative definition for a (*primary*) template that still depends on one
    or more template parameters.


    predicate


    A callable (function, function object, or lambda) that checks whether a certain
    criterion applies to one or more arguments. It returns a Boolean value, is read-only,
    and stateless.


    prvalue


    A *value* category of expressions that perform initializations. Prvalues can be
    assumed to designate pure mathematical value such as 1 or *true* and temporaries
    without names. Examples are:


    +   - All literals except string literals (42, true, nullptr, etc.)

    - Returned values (values not returned by reference)

    - Results of constructor calls

    - Lambdas

    - this


    What was called a *rvalue* before C++11 is called a *prvalue* in C++11.'
