  md: '# 14.4.1 Characteristics of Time Zones


    Dealing with time zones is a bit tricky because it is a topic that can become
    pretty complex. For example, you have to take into account:


    +   - Time differences are not necessarily multiples of hours. In fact we also
    have differences of 30 or even 15/45 minutes. For example, a significant part
    of Australia (the Northern Territory and South Australia with Adelaide) has the
    standard time of UTC+9:30 and Nepal has the time zone of UTC+5:45. Time zones
    may also have 0 minutes difference (as time zones in north and south America).

    - Time zone abbreviations might refer to different time zones. For example, CST
    might stand for Central Standard Time (the standard time of Chicago, Mexico City,
    and Costa Rica) or China Standard Time (the international name of the time zone
    of Beijing and Shanghai), or Cuba Standard Time (the time zone of Havana).

    - Time zones change. Countries decide to change their zone(s) or when daylight
    saving starts. As a consequence, you might have to make multiple updates per year
    account when dealing with time zones.


    # The Time Zone Database


    To deal with time zones, the C++ standard library uses the IANA time zone database,
    which is available at http://www.iana.org/time-zones. This database has multiple
    updates each year to be up-to-date when time zones change so programs can react
    accurately.


    +   - The entry for the time zone database is a time zone name, which is usually

    - a city in a certain area.

    - For example: America/Chicago, Asia/Hong_Kong, Europe/Berlin, Pacific/Honolulu

    - a GMT entry with the offset from UTC time.

    - For example: Etc/UTC, Etc/GMT+6, which stands for UTC-6, or Etc/GMT-8, which
    stands for UTC+8


    Yes, the UTC time offsets are not inverted as GMT entries; you cannot search for
    something like UTC+6 or UTC+5:45.

    A few canonical and alias names are supported (e.g., UTC or GMT) and also some
    deprecated entries are available (e.g., PST8DT, US/Hawaii, Canada/Central, or
    just Japan). However, you cannot search for a single time zone abbreviation as
    entry as CST or PST. We discuss how to deal with time zone abbreviations.


    See also http://en.wikipedia.org/wiki/List_of_tz_database_time_zones for a list
    of time names.


    # Updating the Time Zone Database


    The way systems handle the time zone database implementation is defined. The operating
    systems have to decide how to provide the necessary data and how to keep it up-to-date.
    Freestanding systems usually do not support this API. In case, the request to
    a time zone (e.g., with locate_zone()) throws an exception.


    An update of the timezone database is usually done as part of an operating system
    update. Updates generally require a reboot of the machine, and no C++ application
    runs during an update.'
