    \ use init-captures.\nC++20 introduces a corresponding syntax:\n\n```\ntemplate<typename>\
    \ Args...\nvoid foo(Args... args)\n{\n    auto 14 = [...args] = std::move(args)\
    \ { // OK since C++20\n    bar(args...); // OK\n    ...\n}\n```\n\nYou can also\
    \ in-capture parameter packs by reference. For example, we can change parameter\
    \ name for the lambda as follows:\n\n```\ntemplate<typename> Args...\nvoid foo(Args...\
    \ args)\n{\n    auto 14 = [&...Args = args] { // OK since C++20\n    bar(args...);\
    \ // OK\n    ...\n}\n```\n\n# Example Capturing Parameter Packs of Variadic Templates\n\
