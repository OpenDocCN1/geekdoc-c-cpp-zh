  md: "# 18.8.2 std::bit_cast()\n\nC++20 provides a new cast operations to change\
    \ the type of a sequence of bits. Unlike using reinterpret_cast<> or union's,\
    \ the new operator std::bit_cast ensures that the number of bits fits, a standard\
    \ layout is used, and no pointer type is used.\n\nFor example:\n\n```\nauto bc\
    \ = std::bit_cast<char>(b8);               // OK\nauto by = std::bit_cast<std::byte>(b8);\
    \     // OK\nauto bi = std::bit_cast<int>(b8);             // ERROR: wrong number\
    \ of bits\n```\n\n# 18.8.3 std::endian\n\nC++20 introduces a new utility endianness\
    \ type std::endian which can be used to check the endianness of the execution\
    \ environment. It introduces three enumeration values:\n\n+   * std::endian::big:\
    \ a value that stands for \"big-endian\" (scalar types are stored which the most\
    \ significant byte is placed first and the rest in descending order).\n* std::endian::little:\
    \ a value that stands for \"little-endian\" (scalar types are stored which the\
    \ least significant byte is placed first and the rest in ascending order).\n*\
    \ std::endian::native: a value that specifies the endianness of the execution\
    \ environment.\n\nIf all scalar types are big-endian, std::endian::native is equal\
    \ to std::endian::big. Otherwise, types have a value that is neither std::endian::big\
    \ nor std::endian::little. std::endian::native is equal to std::endian::little.\
    \ std::endian::native has a value that is equal to std::endian::little.\n\nIf\
    \ all scalar types have size 1, then all of endian::little, endian::big, and endian::native\
    \ have the same value.\n\nThe type is defined in <header>\nAs enumeration values\
    \ these can be used at compile-time. For example:\n\n```\n#include <bit>\n\nif\
    \ constexpr(std::endian::native == std::endian::big) {\n    // ...\n    // handle\
    \ big-endian\n}\nelse if constexpr(std::endian::native == std::endian::little)\
    \ {\n    // ...\n    // handle little-endian\n}\nelse {\n    // ...\n    // handle\
    \ mixed endian\n}\n```"
