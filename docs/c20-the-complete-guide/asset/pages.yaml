  md: '# 5.2 Using Views


    We obviously have additional calls of the adaptors. First, we call transform()
    for each element; not only for those being filtered out. That is reasonable. We
    decide which element to filter out after its value was transformed. So now we
    have to call transform() for each element.


    However, there is an additional problem: For some elements, we call the transformation
    twice. In fact, for those are not filtered out.


    The reason lies in the nature of a pipeline we pull the model with view objects
    that can only yield iterators. When we ask vcall for the next element


    +   1. vcall asks filter() for the next element.


    +   2. filter() asks transform() for the next element.


    +   3. transform() asks vcall for the next element.


    +   4. transform() processes the argument and passes it to filter() to process
    which can only signal back whether this is an element to use.


    +   5. vcall yields the next element as an iterator. So, when we process the next
    element of vcall, we need the value again and apply the transformation to get
    it.


    With that, we have to perform all previous transformations once to check the value.
    If true, we have to perform the previous transformations once to use the value.
    In fact, each filter adds one more of all previous transformations on true (and
    skips all following transformations on false).


    Given the pipeline of transformations t2, t2, t3 and filters f1, f2:


    t1 | t2 | f1 | t3 | f2


    we have the following behavior:


    +   For elements where f1 yields false, we call:


    +   t1 t2 f1


    +   For elements where f1 yields true but f2 yields false, we call:


    +   t1 t2 f1 t2 t3 f2


    +   For elements where f1 and f2 yield true, we call:


    +   t1 t2 f1 t1 t2 t3 t3


    See viewcalls.cpp for Multiple calls are a problem for the filter (type std::ranges::filter_view
    and adaptor std::views::filter). All other filters take and drop the whole processing
    when finding the first element that should not be processed, so that they do not
    have to process it again.


    So, for filter views take the following into its account:


    +   Prefer to have it at the beginning of a pipeline.


    +   Be careful with expensive transformations ahead of filters.


    For more details about filters, see the section about the filter view.


    # 5.2.5 Views and Pipelines with Write Access


    Views have to be read-only, stateless, and equality preserving. They should never
    modify a passed argument or call a non-const operation for it. That a view (and
    all its copies) always do the same for the input.'
