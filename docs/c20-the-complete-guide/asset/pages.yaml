    # Specifiers for Strings


    For strings, the default format specifier is s. However, because it is default,
    you usually do not have to provide this spec. Note also that for strings you can
    specify a certain precision, which is interpreted as the maximum number of characters
    used:


    ```

    std::format("{}", "counter"); // yields "counter"

    std::format("{:s}", "counter"); // yields "counter"

    std::format("{:.5}", "counter"); // yields "count"

    std::format("{:.5}", "hi"); // yields "hi"

    ```


    Note that only the string types of character types char and wchar are supported.
    There is no support for strings and sequences of the types u8string and char8_t,
    u16string and char16_t, or u32string and char32_t. In fact, the C++ standard library
    provides formatters for the following types:


    +   * char* and const char*

    * const char*[n] (string literals)

    * std::string and std::basic_string<char, traits, allocator>

    * std::string_view and std::basic_string_view<char, traits>'
