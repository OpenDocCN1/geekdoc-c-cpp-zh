  md: "# 3.2 Typical Application of Concepts and Requirements in Practice\n\nBecause\
    \ the switch happens inside a function, could we use the constexpr feature introduced\
    \ with C++. We can use it with a requires expression as its condition:⁴\n\n```\n\
    if constexpr (requires { coll.push_back(val); }) {\n coll.push_back(val);\n}\n\
    else {\n coll.insert(val);\n}\n```\n\nThe other option is to introduce a name\
    \ for the support of push_back() and insert() . Here, we also have multiple options:\n\
    \n+   We can define a variable template of type bool (like type traits):\ntemplate<typename\
    \ T>\ninline constexpr SupportsPushBack = requires(T coll)\ncoll.push_back(std::declval<typename\
    \ T::value_type>());\n\n\n+   We can define a concept:\ntemplate<typename T>\n\
    concept SupportsPushBack = requires(T coll)\ncoll.push_back(std::declval<typename\
    \ T::value_type>());\n\n\nIn both cases we use one template argument by trying\
    \ to insert an object of the element type of the container. Here, we can use the\
    \ definition of concepts and requirements does not create code. It is an unevaluated\
    \ context where we can use std::declval<> for \"assume we have an object of this\
    \ type\" and does not matter whether we declare it as value or non-const reference.\n\
