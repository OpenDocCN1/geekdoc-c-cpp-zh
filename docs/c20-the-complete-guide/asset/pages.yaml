  md: "# 16.1 Motivation for std::thread\n\n```\n// start thread calling task2() with\
    \ name and val as arguments\nt2 = std::thread{task2, name, val};\n...\ncatch (...)\
    \ { // if we have an exception\n    // clean-up the started threads:\nt1.join();\
    \ // wait for first thread\n    if (t2.joinable()) { // might or might not be\
    \ started\n        t2.join(); // wait for second thread\n    }\nthrow; // rethrow\
    \ the caught exception\n}\n// wait for threads to finish:\nt1.join();\nt2.join();\n\
    ```\n\nOn one hand after starting the first thread, calling the second thread\
    \ might have already thrown, so this has to happen in the true clause. On the\
    \ other hand we want to wait for them in the same scope, so we have to forward\
    \ declare the second thread. And when an exception occurs we check whether the\
    \ second thread was started or not, before joining a thread that was not started\
    \ another exception.\n\nAnd calling join() for both threads might take significant\
    \ time (or even take forever), you risk that on an exception you have no reaction.\
    \ Note that you \"kill\" started threads (these are not processes). A thread can\
    \ only end by ending itself or ending the program as a whole.\n\nSo, before calling()\
    \ you better make sure that the thread you wait for more or less immediately cancels\
    \ its execution. With std::thread there is no mechanism for that. You have to\
    \ implement the request for cancellation in a way that, for example, the started\
    \ thread checks from time to time a flag that is raised by the caller.\n\n# 16.1.2\
    \ Using std::thread\n\nstd::thread solves these problems. First, it is an RAII\
    \ type. The destructor of the type join() is joinable (the \"j\" stands for \"\
    joining\"). Thus, the complex code above simply looks as follows to have the same\
    \ effect:\n\n```\nvoid foo() {\n...\n// start thread calling task1() with name\
    \ and val as arguments\nstd::thread t1{task1, name, val};\n// start thread calling\
    \ task2() with name and val as arguments\nt2 = std::thread{task2, name, val};\n\
    ...\n// wait for threads to finish:\nt1.join();\n```"
