    # 18.6.9 is_pointer_interconvertible_with_class<> and is_corresponding_member<>


    To check the relationship between classes, C++20 introduces new functions:


    ```

    template<typename S, typename M>

    constexpr bool is_pointer_interconvertible_with_class(M S::*m) noexcept;

    template<typename S1, typename S2, typename M1, typename M2>

    constexpr bool is_corresponding_member(M1 S1::*m1, M2 S2::*m2) noexcept;

    ```


    The C++ standard notes: The type of a pointer-to-member expression &C::B is not
    always a pointer to member of C, leading to potentially surprising results when
    using these functions in conjunction with inheritance.


    ```

    struct A { int a; };

    struct B { int b; };

    struct C : public A, public B { };

    ```


    ```

    std::is_pointer_interconvertible_with_class(&C::b) // true

    // true, despite its appearance, C::b has type "pointer to member of B of type
    int"

    ```


    ```

    std::is_pointer_interconvertible_with_class<C>()(&C::b) // false

    // false because it refuses the use of class C fails

    ```


    ```

    std::is_corresponding_member(&C::a, &C::b) // true

    ```


    ¹ See the talk Template Metaprogramming: A Compendium by Walter E. Brown at CppCon
    2014 (https://www.youtube.com/watch?v=Amis2IQQrzY) for a source of this.'
