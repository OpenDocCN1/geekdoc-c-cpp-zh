  md: "# 19.2 Modules with Multiple Files\n\nNote that partitions are only an internal\
    \ implementation aspect of a module. Whether or not code is in a partition has\
    \ no impact on code that imports a module.\n\n# 19.2.4 Interface Partitions\n\n\
    You can also split the interface of a module in multiple files. In that case you\
    \ declare interface partitions, which themselves export whatever was exported.\n\
    \nInterface partitions are especially useful if modules provide multiple interfaces\
    \ maintained by different programmers/and teams. For simplicity, let use the current\
    \ example to demonstrate how to use this by only defining the Customer interface\
    \ in a separate file.\n\nTo define only the Customer interface we can provide\
    \ the following file:\n\n```\nlang/mod3/mod3customer.cpp\n// start module unit\
    \ with global module fragment\n#include <string>\n#include <vector>\nexport module\
    \ Mod3:Customer; // interface partition declaration\nimport :Order; // internal\
    \ partition to use Order\nexport class Customer {\nprivate:\n    std::string name;\n\
    \    std::vector<Order> orders;\npublic:\n    Customer(std::string n)\n      \
    \  : name{n}\n    void buy(std::string ordername, double price) {\n        orders.push_back(Order{ordername,\
    \ price});\n    }\n    void buy(int num, std::string ordername, double price)\
    \ {\n        orders.push_back(Order{num, ordername, price});\n    }\n    double\
    \ sumPrice() const;\n    double averagePrice() const;\n    void print() const;\n\
    };\n```\n\nThe partition is more or less the former primary module interface with\
    \ only one difference:\n\n+   - As a partition we declare its name after the module\
    \ name and a colon: Mod3:Customer Like the primary module interface."
