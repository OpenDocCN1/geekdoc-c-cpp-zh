  md: '# 14.3.3 Timepoint Types


    C++20 introduces a couple of new timepoints. Based on the general definition available
    since C++11:


    ```

    template<typename Clock, typename Duration = typename Clock::duration>

    class time_point;

    ```


    the new types provide a more convenient way of using timepoints with the different
    clocks.


    Standard timepoint types since C++20 describes the names and meanings of the convenient
    timepoint types.


    | Type | Meaning | Defined as |

    | --- | --- | --- |

    | local_time<Dur> | Local timepoint | time_point<LocalTime, Dur> |

    | local_seconds | Local time in seconds | time_point<LocalTime, seconds> |

    | local_days | Local time in days | time_point<LocalTime, days> |

    | sys_days<Dur> | System timepoint | time_point<system_clock, Dur> |

    | sys_seconds | System time in seconds | time_point<system_clock, seconds> |

    | sys_days | System time in days | time_point<system_clock, days> |

    | utc_time<Dur> | UTC timepoint | time_point<utc_clock, Dur> |

    | utc_seconds | UTC time in seconds | time_point<utc_clock, seconds> |

    | tai_time<Dur> | TAI timepoint | time_point<tai_clock, Dur> |

    | tai_seconds | TAI time in seconds | time_point<tai_clock, seconds> |

    | gps_time<Dur> | GPS timepoint | time_point<gps_clock, Dur> |

    | gps_seconds | GPS time in seconds | time_point<gps_clock, seconds> |

    | file_time<Dur> | Filesystem timepoint | time_point<file_clock, Dur> |


    Table 14.3. Standard timepoint types since C++20


    For each standard clock (except the steady clock), we have a _time> which allows
    us to declare objects that represent a date and the time of it. In addition, a
    _seconds type allows us to define date/time objects of the corresponding type
    with the granularity of seconds. For system time, a _days type allows us to define
    date/time objects of the corresponding type with the granularity of days:


    ```

    std::chrono::sys_days d;  // shortcut for time_point<system_clock, days>

    ```


    Please note that objects of this type represent one timepoint, although the type
    unfortunately has a plural name. For example, sys_days means a single day defined
    as a system timepoint (the name comes from "system time with granularity days").


    # 14.3.4 Calendrical Types


    As extension to timepoint types, C++20 introduces types for the civil (Gregorian)
    calendar to the chrono library.


    While timepoints are specified as durations from an epoch, calendrical types have
    distinct and combined types for years, months, weekdays, and days of a month.
    Both are useful to use:'
