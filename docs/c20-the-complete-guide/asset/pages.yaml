    \ String Member reserve() ( )\n\nFor strings, the member function reserve() can\
    \ no longer be used to request to shrink the capacity (memory allocated for the\
    \ value) of strings:\n\n```\nvoid modifyString(std::string& s) {\n    if (...)\
    \ {\n        s.clear();\n        s.reserve(0); // no longer shrink memory (as\
    \ before some platforms)\n        return;\n    }\n}\n```\n\nThe reason is that\
    \ releasing might take some time so that the performance of this call could vary\
    \ significantly when porting code.\n this reason, passing no argument even is\
    \ no longer supported:\n\n```\ns.reserve(); // ERROR since C++20\n```"
