  md: '# 14.6 Using the Chrono Extensions in Practice


    After introducing the new features and types of the chrono library, this section
    discusses how to use them in practice. See also http://github.com/HowardHinnant/date/wiki/Examples-and-Recipes
    for more examples and recipes.


    # 14.6.1 Invalid Dates


    Values of calendrical types may not be valid. This can happen in two ways:


    +   By an initialization with an invalid value. For example:

    ```cpp

    std::chrono::day d{0}; // invalid day

    std::chrono::year_month ym{2021/13}; // invalid year_month

    std::chrono::year_month_day ymd{2021/2/31}; // invalid year_month_day

    ```


    +   By a computation that results in an invalid date. For example:

    ```cpp

    auto ymd1 = std::chrono::year(2021)/1/31; // January 31, 2021

    ymd1 += += std::chrono::months{1}; // February 31, 2021 (invalid)



    auto ymd0 = std::chrono::year(2020)/2/29; // February 29, 2020

    ymd1 += += std::chrono::years{1}; // February 29, 2021 (invalid)

    ```


    Values of standard date members lists the internal types and possible values of
    a date


    | Member | Internal Type | Valid Values |

    |---|---||

    | day | unsigned char | 1 until 31 |

    | month | unsigned char | 1 until 12 |

    | year | unsigned char | -32767 until 32767 |

    | weekday | unsigned char | 0 (Sunday) until 6 (Saturday) and 7 (again Sunday),
    which is converted to 0 |

    | weekday index | unsigned char | 1 until 5 |


    Table 14.9. Valid values of standard date members


    All combined types are valid if the individual components are valid (e.g., a valid
    month_weekday is valid if both the month and the weekday are valid). However,
    additional checks may apply:


    +   A full date of type year_month_day has to exist. By taking leap years into
    account, for example:

    ```cpp

    2020y/2/29; // valid (there is a February 29 in 2020)

    2021y/2/29; // invalid (there is no February 29 in 2021)

    ```


    +   A month_day is only valid if the day could be valid in that month For February
    29 is valid, but 30 is not. For example:

    ```cpp

    February/29; // valid (a February can have 29 days)

    February/30; // invalid (no February can have 30 days)

    ```'
