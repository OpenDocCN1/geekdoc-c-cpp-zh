    \ generic parameters. For example:\n```cpp\n<typename T>(T* ptr) { // OK since\
    \ C++20\n// can use T as element type and N as size of the value ptr points to\n\
    ```\n\nOr:\n```cpp\n<typename T, int N>(T (&arr)[N]) {\n    // can use T as element\
    \ type and N as size of the passed array\n```\n\nIf you are wondering why not\
    \ to use a template function in these cases, remember that lambdas provide some\
    \ benefits that functions cannot provide:\n\n+   - They can be defined inside\
    \ functions.\n- They can capture runtime values to specify their functional behavior\
    \ at runtime.\n- You can pass them as arguments without the need to specify the\
    \ parameter types."
