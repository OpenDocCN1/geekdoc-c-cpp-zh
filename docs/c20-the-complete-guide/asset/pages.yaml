  md: '# 14.2 Basic Chrono Concepts and Terminology


    The chrono library was designed to be able to deal with the fact that timers and
    clocks might be different on different systems and improve over time in precision.
    To avoid having to provide a new time type every 10 years or so, the basic goal
    established with C++11 was to provide a precision-neutral concept by separating
    duration and point of time ("timepoint”). C++20 extends these basic concepts with
    support for dates and time zones and a few other extensions.


    As a result, the core of the chrono library consists of the following types or
    concepts:


    +   * **A duration** is defined as a specific number of ticks over a time. One
    example is a duration such as "3 minutes" (3 ticks of a "minute\”). Other examples
    are "42 milliseconds" or "86,400 seconds," which represents the duration of 1
    day. This concept also allows something like "1.5 times a third of a second,"
    where 1.5 is the number of ticks and a third of a second the unit used.

    * **A timepoint** is defined as a combination of a duration and time (the so-called
    epoch).


    A typical example is a **system timepoint** that represents New Year’s Midnight
    2000. Because the system epoch is specified as Unix/POSIX birth here, the timepoint
    would be defined as "946,684,800 seconds since January 1, 1970," when leap seconds
    into account, which some timepoints do.


    However, the epoch might also be an unspecified or pseudo epoch. For example,
    a *local timepoint* is associated with however time we have. It still needs a
    certain value for the epoch, but which point in time becomes clear when we apply
    this timepoint to a specific time. A typical example is Midnight on New Year’s
    Eve. The celebration and fireworks do not start simultaneously; when it depends
    on the timezone we are in.


    +   * **A clock** is the object that defines the epoch of a timepoint. Thus, different
    clocks have different epochs. Each timepoint is parameterized by a clock.

    * C++11 introduced two basic classes (a *system_clock* to deal with the system
    time and a *steady_clock* for measurements and timers that should not be influenced
    by the changes of the system). C++20 adds new clocks to deal with UTC timepoints
    (supporting leap seconds), GPS timepoints, TAI (international atomic time) timepoints,
    and timepoints of the filesystem.


    To deal with local timepoints, C++20 also adds a pseudo clock *local_t*, which
    is not bound to a specific epoch/origin.


    Operations dealing with multiple timepoints, as processing the duration/difference
    between two timepoints, usually require the same epoch/clock. However, conversions
    between different clocks are possible.


    A clock (if not local) provides a convenience function now() to yield the current
    point in time.


    +   * **A calendar type** (introduced with C++20) allows us to deal with the attributes
    of calendars using the common terminology of days, months, and years. These types
    can be used to represent a single attribute of a date (day, month, year, and *weekday*)
    and combinations of them (such as *year_month_day* or *weekday* for a full date).


    Different symbols such as Wednesday, November, and last allow us to use common
    terminology for partial and full dates, such as "last Wednesday of November."


    Fully specified calendars (having a year, month, and day or specific weekday of
    the month) can be converted to or from timepoints using the system clock or the
    pseudo clock for the local time.'
