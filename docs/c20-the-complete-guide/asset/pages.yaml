  md: '# Chapter 7


    # View Types in Detail


    This chapter discusses the details of and every view type the C++20 standard library
    introduced. We start with a first overview and introducing the base classes C++20
    provides for views. Then, we discuss all view types of C++20 views (views that
    refer to external elements or views that generate values themselves). Finally,
    we document all modifying views types that especially may be used for components
    in pipelines of views: views that filter out elements, views that modify elements,
    views that mutate (change the order of) elements, and views that deal with multiple
    ranges.


    # 7.1 Overview of all Views


    C++20 provides a significant number of different views. Most, not all of them
    can be created with a range adaptor, which is usually simpler to use and creates
    a view that has the best performance.


    # 7.1.1 Overview of Features That Create Views


    Table Features to Create Views and their Adaptors lists the features to create
    views and the corresponding adapters. Some views prefer view external elements
    (and therefore wrap ranges), while others create a sequence of values themselves.


    In general, you prefer using the adapters. For example, you would always prefer
    to use the adaptor over the type: std::views::all(ranges::ref_view>). However,
    for some view types such as basic::istream_view that is not possible.


    Note the different namespaces used:


    +   - span and string_view are in namespace std.

    - All adapters are in namespace std::views.

    - All other view types are in namespace std::ranges.'
