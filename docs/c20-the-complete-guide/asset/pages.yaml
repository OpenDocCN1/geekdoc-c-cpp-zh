  md: '# Chapter 14: Dates and Time Zones for <chrono>


    # Using the parse () Manipulator


    Instead of calling from_stream()


    ```

    std::chrono::from_stream(sstream, "%F %T", tp);

    ```


    you could also call:


    ```

    sstream >> std::chrono::parse("%F %T", tp);

    ```


    Please note that the C++20 standard does not formally allow you to parse the format
    directly as a string literal, that you have to call


    ```

    sstream >> std::chrono::parse(std::string{"%F %T"}, tp);

    ```


    However, this should be fixed with http://wg21.link/lwg3554.


    std::chrono::parse() is an IO stream manipulator. It allows you to parse multiple
    values inside one statement reading from an input stream. In addition, to move
    semantics you can even pass a temporary input stream. For example:


    ```

    chr::sys_days tp;

    chr::hours h;

    chr::minutes m;

    // parse date into tp, hour h and minute into m

    std::istringstream("12/24/21 18:00") >> chr::parse("%D", tp)

    >> chr::parse("%H", h)

    >> chr::parse("%M", m);

    std::cout << tp << " at " << h << " ''" << m << "\n";

    ```


    This code outputs:


    2021-12-24 at 18h Min


    # Parsing Time Zones


    Parsing time zones is a bit tricky, because zone abbreviations are not unique


    To help here, from_stream() has the following formats:


    ```

    istream from_stream(istream, format, value)

    istream from_stream(istream, format, value, abbrevPtr)

    istream from_stream(istream, format, value, abbrevPtr, offsetPtr)

    ```


    Optionally you can pass the address of a std::string to store a parsed time zone
    abbreviation into the string and you can pass the address of a std::chrono::minutes
    object to store a parsed time zone offset into that string (in both cases nullptr
    can be passed)


    However, you still have to be careful:


    +   - chr::sys_seconds tp;

    std::istringstream sstream("2021-4-13 12:00 UTC");

    chr::from_stream(sstream, "%F %R %Z", tp);'
