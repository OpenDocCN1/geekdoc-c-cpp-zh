  md: "# 17.5 Synchronized Output Streams\n\nC++20 provides a new mechanism to synchronize\
    \ concurrent output to streams.\n\n# 17.5.1 Motivation of Synchronized Output\
    \ Streams\n\nIf multiple thread write concurrently to a stream, the output usually\
    \ has to be synchronized:\n\n+   - In general, concurrent output to a stream causes\
    \ undefined behavior (it is a data race, the C++ term for a race condition with\
    \ undefined behavior).\n- Concurrent output to standard streams like std::cout\
    \ is supported, but the result is not very useful, because character might be\
    \ mixed in by any arbitrary order.\n\nFor example, consider the following program:\n\
    \n```\nlib/iostream.cpp\n#include <iostream>\n#include <cmath>\n#include <thread>\n\
    \nvoid squareRoots(int num) {\n    for (int i = 0; i < num; ++i) {\n        std::cout\
    \ << \"squareroot of \" << i << \" is \"\n                  << std::sqrt(i) <<\
    \ '\\\\n';\n    }\n}\n\nint main() {\n    std::thread t1(squareRoots, 5);\n  \
    \  std::thread t2(squareRoots, 5);\n    std::thread t3(squareRoots, 5);\n}\n```\n\
    \n3 threads concurrently to write to :cout. This is valid because a standard output\
    \ stream is used. However, the output may look like this:\n\nsquaroot of squaroot\
    \ of 0 is 0 is 0\n0squaroot of squaroot of\n01squaroot of is is 101 is is\n\n\
    1squaroot of squaroot of\n12squaroot of is is 21 is 1.44121\n\n1.44121squaroot\
    \ of squaroot of\n23squaroot of is is 31.44121 is 1.73205"
