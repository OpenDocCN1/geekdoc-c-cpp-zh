    \ according to the passed name\n}\n```\n\nNote that you cannot skip the type in\
    \ the declaration of the function template. We can use std::invocable as\ntype\
    \ constraint of the declaration of an object, which is callable (function, function\
    \ object, or lambda)\nto call:\n\n```\ntemplate<std::invocable auto GetVat> //\
    \ GetVat is type-constrained function/lambda to call\nWithout auto would declare\
    \ a function template that has ordinary type parameter, which we can use\nspecific\
    \ or define the type of a callable no arguments:\ntemplate<std::invocable GetVat>\
    \ // GetVat is a constrained type\nauto getDefaultTax = []() {\nreturn 0.19;\n\
    };\n```\n\nIt would also work if you declare the function template with the concrete\
    \ type of the lambda (which, however,\nwe have to define the type of lambda first):\n\
    \n```\ntemplate<decltype(getDefaultTax)> GetVat\nint addTax(int value)\n{\n  \
    \  return static_cast<int>(std::round(value * (1 + GetVat())));\n}\n```\n\nNote\
    \ the following constraints for lambdas as non-type template parameters:\n\n+\
    \   - The lambda may not capture anything.\n- The lambda must be usable at compile\
