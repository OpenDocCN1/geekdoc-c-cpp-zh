    # 7.3.3 std::ranges::common_view


    Class template std::ranges::common_view<> is a view that harmonizes the begin
    and end iterator of a range to be able to pass to container where the same type
    is required (such as constructors of containers or traditional algorithms).


    For the class template there is a range adaptor std::views::common(), which takes
    a range as argument and converts it to a common_view via begin() and end() do
    not yield the same type. If the argument is a std::ranges::common_range, std::views::common()
    just yields the passed argument.


    The major use of common view is to pass ranges or views that have different types
    for the begin and end to generic code that expects them to have the same type.
    A typical example is to pass begin and end of a range to a constructor of an adaptor
    or to a traditional algorithm.


    ```

    std::list<int> lst {1, 2, 3, 4, 5, 6, 7, 8, 9};


    auto v1 = std::views::take(lst, 5); // begin() and end() have different types

    std::vector col(v1.begin(), v1.end()); // ERROR: container requires the same type


    auto v2 = std::views::common(std::views::take(lst, 5)); // same types now

    std::vector<int> col(v2.begin(), v2.end()); // OK

    ```


    Table 7.6 Operations of Class std::ranges::common_view lists the API of iterators
    of initial range have different types.


    Note that the constructor if you use the common() adaptor the types might be this:


    ```

    auto v1 = std::ranges::common_view{std::ranges::subrange(beg,beg)}; // ERROR

    auto v2 = std::views::common(std::ranges::subrange(beg,beg)); // OK

    ```


    Internally, common_view uses std::common_iterator.'
