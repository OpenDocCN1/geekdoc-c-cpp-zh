  md: "# 9.1.3 Lambdas as Non-Type Template Parameters\n\nBecause lambdas are just\
    \ shortcuts for function objects, they can also be used now as non-type template\
    \ parameters provided the lambda is at compile time.\n\nConsider the following\
    \ example:\n\n```\n#include <iostream>\n#include <cmath>\n\ntemplate<std::invocable\
    \ auto GetV>\nint addTax(int value)\n{\n    return static_cast<int>(std::round(value\
    \ * (1 + GetV())));\n}\n\nint main() {\n    auto getDefaultTax = [] {\n      \
    \  return 0.19;\n    }\n\n    std::cout << addTax<getDefaultTax>(100) << '\\n';\n\
    \    std::cout << addTax<getDefaultTax>(4199) << '\\n';\n    std::cout << addTax<getDefaultTax>(1950)\
    \ << '\\n';\n}\n```\n\nThe function addTax() uses a helper function, which can\
    \ now also be a lambda:\n\n```\ntemplate<std::invocable auto GetV>\nint addTax(int\
    \ value)\n{\n    return static_cast<int>(std::round(value * (1 + GetV())));\n\
    }\n```\n\nTo this function template, we can pass a lambda now:\n\n```\nauto getDefaultTax\
    \ = [] {\n    return 0.19;\n}\n```\n\naddTax<getDefaultTax>(100) // passes lambda\
    \ as template argument\n\nWe could even define the lambda directly when calling\
    \ the function template:\n\n```\naddTax<[]{ return 0.19; }>(100) // passes lambda\
    \ as template argument\n```"
