  md: '# 3.4.1 Defining Concepts


    Concepts are defined as follows:


    ```

    template<...>

    concept name = ... ;

    ```


    The equal sign is required (you cannot declare a concept without defining it).
    Behind the equal sign you can specify any compile-time expression that convert
    to true or false.


    Concepts are like constexpr templates of type bool, but the type is not explicitly
    specified:


    ```

    template<typename> T

    concept ::::MyConcept = ... ;

    ```


    ```

    std::is_same<MyConcept<...>, bool> // yields true

    ```


    That means, at compile time or runtime you can always use a concept where the
    value of a Boolean expression is needed. However, the template parameters may
    have constraints (you cannot use a concept to define a concept). You cannot define
    concepts inside a function (it is the case for all templates).


    # 3.4.2 Special Abilities of Concepts


    Concepts have special abilities. If you compare the usual definition of a Boolean
    variable template (as it is specially used to define traits):


    ```

    template<typename> T

    inline constexpr bool IsOrHasThisOrThat = ... ;

    ```


    with a definition of a concept:


    ```

    template<typename> T

    concept IsOrHasThisOrThat = ... ;

    ```


    we have the following differences:


    +   - Concepts do not represent code. They have no type, storage, lifetime, or
    any other properties associated with objects.

    - By instantiating them at compile time for specific template parameters, their
    instantiation becomes true or false. Therefore, you cannot use them wherever you
    use true or false and you get all properties of these literals.

    - Concepts do not have to be declared as inline, they are implicitly.

    - Concepts can be used as type constraints:


    ```

    template<IsOrHasThisOrThat T>

    ...

    ```


    Variable templates cannot be used that way.


    +   - Concepts are the only way to give constraints a name, which means that you
    need them to decide whether a constraint is a special case of another constraint.
    To decide whether a constraint subsumes you need concepts to compare the constraint
    with.'
