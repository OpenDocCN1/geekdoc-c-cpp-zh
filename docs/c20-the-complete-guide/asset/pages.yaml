  md: '# Chapter 5: Ranges and Views


    ```

    std::vector<int> coll{25, 42, 2, 0, 122, 5, 7};

    ```


    ```

    std::sort(coll.begin(), coll.end()); // sort all elements of the collection

    ```


    C++20 introduces the concept of a range, which is an abstract description of a
    single object representing a sequence of values. Each container can be used as
    a range and therefore you can now pass containers as large:


    ```

    #include <vector>

    #include <algorithm>

    #include <ranges>

    ```


    ```

    std::vector<int> coll{25, 42, 2, 0, 122, 5, 7};

    ```


    ```

    std::ranges::sort(coll); // sort all elements of the collection

    ```


    Here, we pass the vector to the range algorithm sort() to sort all elements in
    the vector.

    A few things are already remarkable in this little example:


    +   * To deal with ranges you need the header <ranges>.\* Almost all features
    of the ranges library are defined in the namespace std::ranges.


    A new namespace was necessary, because we introduced several new API''s and we
    wanted to keep the existing names (such as the name of the algorithm sort()).
    To avoid ambiguities and conflicts with existing API''s, the overall functionality
    was introduced in the sub-namespace ranges.

    It is common to introduce a shortcut for the namespace std::ranges, such as rng,
    so in practice the code above might look as follows


    ```

    #include <vector>

    #include <algorithm>

    #include <ranges>

    namespace rng = std::ranges; // define shortcut for std::ranges

    ```


    ```

    std::vector<int> coll{25, 42, 2, 0, 122, 5, 7};

    ```


    ```

    rng::sort(coll); // sort all elements of the collection

    ```


    In this book I might refer from time-to-use namespace rng if otherwise symbols
    and code size becomes too large.


