    \ both the feature to signal cancellation in asynchronous scenarios and the new\
    \ class std::jthread.\n\n# 16.1 Motivation for std::jthread\n\nC++11 introduced\
    \ a type std::thread to map one-to-one with threads provided by the operating\
    \ system. However, the introduced type has a severe flaw: it is not an RAII type.\n\
    \n# 16.1.1 The Problem of std::thread\n\nstd::thread requires that at the end\
    \ of its lifetime the running thread either join() (to wait for the end of the\
    \ running thread) or detach() (to let it run in the background) is called. If\
    \ neither has been called, the destructor immediately calls an abnormal program\
    \ termination with a core dump.\n\n```\nvoid foo()\n{\n    // start calling task(task)\
