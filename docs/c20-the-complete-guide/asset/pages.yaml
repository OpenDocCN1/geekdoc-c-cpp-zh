  md: '# Using Spans with fixed vs. dynamic Extent


    Both fixed and dynamic extents have their benefits.


    Specifying a fixed size allows us to detect violations better (at runtime or even
    at compile time). For example, you cannot assign std::array<> with the wrong number
    of elements to a span with a fixed extent:


    ```

    std::vector vec{1, 2, 3};

    std::array arr{1, 2, 3, 4, 5, 6};

    ```


    ```

    std::span<int, 3> sp3{vec};

    std::span sp{vec};

    ```


    ```

    sp3 = arr; // compile-time ERROR

    sp = arr; //OK

    ```


    Using spans with dynamic extents provides more flexibility:


    ```

    std::span<int> sp;

    ... //OK

    ```


    ```

    std::vector vec{1, 2, 3, 4, 5}; // OK(span has 5 elements)

    sp = vec;

    sp = {vec.begin(), 3}; // OK(span has 3 elements)

    ```


    # 8.2 Spans Considered Harmful


    Spans refer to a sequence of elements. As that have the usual problems with reference
    semantics have. It is up to the programmer to ensure that the span refers to is
    valid.


    Errors happen pretty fast. For example, if function getData() returns a collection
    of ints by value (e.g., over std::array, or raw array), the following statements
    create fatal errors:


    ```

    std::span<int, 3> first3(getData()); // ERROR: reference to temporary object

    ```


    ```

    std::span sp{getData().begin(), 3}; // ERROR: reference to temporary object

    ```


    ```

    sp = getData(); // ERROR: reference to temporary object

    ```


    This can look a bit more subtle such using the range-based for loop:


    ```

    for (const auto elem : std::span(getData().data(), 3)) // fatal runtime ERROR

    ```


    See http://vg2.link/p2012 why this is an (as long as the fix proposed in that
    paper is not accepted and implemented).


    Compilers will probably be able to detect these problems with the "lifetime extension"
    which is currently being implemented for major compilers. However, can only detect
    simple lifetime dependencies like the one between a span and the object it initialized
    with


    In addition, you have to ensure that the referenced sequence of elements remains
    valid. This can be a problem if other parts of the program end the lifetime of
    a referred sequence while the span still is in use.'
