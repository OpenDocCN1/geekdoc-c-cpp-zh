    \ was introduced.\nThis chapter introduces the how to define and deal with comparisons\
    \ since C++20 using these new features.\n\n# ## 1.1 Motivation for Operator<=>\n\
    \nLet us first motivate the new ways comparisons are handled since C++20 and the\
    \ new operator <=.\n\n# ### 1.1.1 Defining Comparison Operators Before C++20\n\
    \nBefore C++20 you had to define six operators for a type to provide full support\
    \ for all possible comparisons of its objects.\nFor example, if you wanted to\
    \ compare objects of a type Value (having an integral ID), you had to implement\
    \ the following:\n\n```\nclass Value {\nprivate:\n    long id;\n\npublic:\n  \
    \  ...\n// equality operators:\n    bool operator==(const Value& rhs) const {\n\
    \        return id == rhs.id; // basic check for equality\n    }\n    bool operator!=(const\
    \ Value& rhs) const {\n        return !(*this == rhs); // derived check\n    }\n\
    }\n```"
