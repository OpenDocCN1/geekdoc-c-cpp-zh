  md: "# 3.2 Typical Application of Concepts and Requirements in Practice\n\n```\n\
    std::vector<double> dVec;\nadd(dVec, 0.7); // OK: calls 2nd add() for double\n\
    ```\n\nWhen passing a double, both function overload match. The second overload\
    \ is preferred, because it is a perfect match for the second argument.\n\nHowever,\
    \ if we pass a float, we have the following:\n\n```\nfloat f = 0.7;\nadd(dVec,\
    \ f); // OOPS: calls 1st add() for T being float\n```\n\nThe reason lies in the\
    \ subtle details of overload resolution. Again, both function could be called.\
    \ Overload resolution has some general rules, as such:\n\n+   * No type conversion\
    \ is better than a type conversion.\n* No template parameter is better than a\
    \ template parameter.\n\nHere, however, overload resolution has to decide between\
    \ a type conversion and using a template parameter. Unfortunately, the version\
    \ with the template parameter is preferred.\n\n# Fixing Overload Resolution\n\n\
    The fix for the overload resolution is pretty simple. Instead of declaring the\
    \ second parameter with a specific type, we should just require that the value\
    \ to insert has a floating-point type. For this, we can constrain the function\
    \ template using the new standard concept std::floating_point:\n\n```\ntemplate<typename\
    \ Coll, typename requires std::floating_point<T>\nvoid add(Collo& coll, const\
    \ T& val)\n{\n    // special stuff for floating-point values\n    coll.push_back(val);\n\
    }\n```\n\nBecause we use a concept that applies to a single template parameters,\
    \ we can also use the shorthand notation:\n\n```\ntemplate<typename Coll, std::floating_point\
    \ T>\nvoid add(Collo& coll, const T& val)\n{\n    // special stuff for floating-point\
    \ values\n    coll.push_back(val);\n}\n```\n\nFor floating-point values we have\
    \ two function templates that can be called, one with and without a specific requirement:\n\
    \n```\ntemplate<typename Coll, typename T>\nvoid add(Collo& coll, const T& val)\
    \ // for generic value types\n{\n    coll.push_back(val);\n}\n```"
