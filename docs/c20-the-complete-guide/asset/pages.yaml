    The formatters for chrono types are using the syntax for standard format specifiers
    (each specifier is optional):


    align width .prec L spec


    +   * fill, align, with and prec mean as for standard format specifiers.

    * spec specifies the general notation of the formatting, for specifiers that support
    it.

    * L also acts as turns on locale-dependent formatting.


    Conversion specifiers for chrono types lists all specifiers for formatted output
    of date/time types with an example based on Sunday, June 9, 2019 17:33:16 and
    850 Milliseconds.


    Without using a specific specifier, the default output operator is used, which
    makes invalid dates throw. When using specific specifiers the case is not:


    ```

    std::chrono::year_month_day ymd{2021/2/31}; // February 31, 2021

    std::cout << std::format("{:%F", ymd); // 2021-02-31 is not a valid ...

    std::cout << std::format("{:%F", ymd); // 2021-02-31

    std::cout << std::format("{:%Y-%m-%d", ymd); // 2021-02-31

    ```


    If the date/time type does not provide the information for a conversion specifier,
    a std::invalid_error exception is thrown. For example, an exception is thrown
    when:


