    \ it is a good idea to constrain the template parameter with the concept std::invocable\
    \ or std::regular_invocable\nThat you can ensure the passed parameter is a callable\
    \ you can call with no arguments. If the passed lambda should take, you need something\
    \ like this\n\n```\ntemplate<std::invocable<std::string>> auto GetVat\nint addTax(int\
