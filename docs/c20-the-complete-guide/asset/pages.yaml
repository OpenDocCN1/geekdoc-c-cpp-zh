  md: '# Chapter 6


    # Components for Ranges and View


    After introducing ranges and views, this chapter gives a first overview of all
    types and utilities a programmer should know when using ranges.


    The general chapter about concepts presents all range concepts.


    The chapter about view types presents all the details of the standard view types.


    # 6.1 Major Range Adaptors


    As introduced with views the way they are used, C++ provides several range adapters
    to easily create views with the best performance.


    Several of these adapters apply to specific view types. However, some of them
    might create different things depending on the characteristics of the passed ranges.
    For example, adapters might yield the passed range if they have the characteristics
    of the result.


    There are a few adapters that make it easy to create or convert ranges to views
    with specific characteristics (independent from the content). These adapters are:


    +   - std::views::all(), is the primary adaptor to yield a view for a passed range


    +   - std::views::counted(), is the primary adapter to convert a begin and a count
    into a view


    +   - std::views::common(), which yields a view with harmonized types for the
    begin iterator and the sentinel (iterator) to be able to pass the range/view to
    traditional range parameters


    These adapters are already described in this section.


    All major adapters always yield borrowed range. That is, the lifetime of iterators
    from these adapters only depends on the lifetime of the argument passed to them.
    In other words: Using these adapters does not introduce lifetime issues.


    # 6.1.1 Range Adaptor all()


    The range adaptor std::views::all() is the adaptor to convert any range that is
    not a view yet into a view. That you guarantee that you have a cheap handle to
    deal with the elements of a range.'
