    # 7.4.4 IStream View


    Class template std::ranges::basic_istream_view<> is a view that reads elements
    from an input stream (such as the standard input, from a file, or from a stream).


    For example:


    ```

    std::istream mystream("0 1 2 4");

    for (const auto& elem : std::ranges::istream_view<int>(mystream)) { // OK

    std::cout << elem << '' '';

    }

    std::cout << ''\n'';

    ```


    Unfortunately, the current specification of istream_view break all conventions
    we have for streams and ranges:


    +   - You can fully specify std::ranges::basic_istream_view<int, char, std::char_traits<char>>
    v1(mystream);

    - The last parameter has a default value, so that you can use:

    std::ranges::basic_istream_view<int, char> v2(mystream); // OK

    - However, currently you cannot skip more:

    std::ranges::basic_istream_view<int> v3(mystream); // ERROR

    - Also the usual convention, that we use a specific basic_ prefix for char is
    not satisfied:

    std::ranges::istream_view<int> v4(mystream); // ERROR

    - Even worse, a helper function with this name exists in namespace std::ranges:

    auto v5 = std::ranges::istream_view<int>(mystream); // OK (uses helper function)

    - And no corresponding adapter is adopted:

    auto v6 = std::views::istream<int>(mystream); // ERROR: not supported


