  md: "# 10.2 Keyword constval\n\nconstexpr int i4 = nextTwoDigitValue(-1); // compile-time\
    \ ERROR\nNote that using static_assert() would not work here, because it cannot\
    \ be called for values known at compile time and constval does not make a compile-time\
    \ value inside the function:\n\n```\nconstval int nextTwoDigitValue(int val)\n\
    {\n    static_assert(val >= 0 && val < 99); // always ERROR: val is no compile-time\
    \ value\n}\n```\n\nBy this trick, you can constrain compile-time functions to\
    \ certain values. That way, you could signal an invalid format of a string parsed\
    \ at compile time.\n\n# 10.2.4 Compile-Time value versus Compile-Time Context\n\
    \nYou might assume that each every value in a compile-time function is a compile-time\
    \ value. However, that is not true. Also in compile-time functions, there is a\
    \ difference between static typing of the code and dynamic computing of values.\n\
    Consider the following example:\n\n```\nconstval void process()\n{\n    constexpr\
    \ std::array a1{0, 8, 15};\n    constexpr auto n1 = std::ranges::count(a1, 0);\
    \ // OK\n    std::array<int, n1> a1b; // OK\n\n    std::array a2{0, 8, 15};\n\
    \    constexpr auto n2 = std::ranges::count(a2, 0); // ERROR\n\n    std::array\
    \ a3{0, 8, 15};\n    auto n3 = std::ranges::count(a3, 0); // OK\n    std::array<int,\
    \ n3> a3b; // ERROR\n}\n```\n\nAlthough we are in a function that can only be\
    \ used at compile time, a2 is not a compile-time value. Therefore, any processing\
    \ with it cannot be used as compile-time value such initializing the constexpr\
    \ variable n2.\n\nFor the same reason, n1 can be used to declare the size of a\
    \ std::array. Using n3, which is constexpr, fails (even if n3 is declared as const).\n\
    \nThe same applies if process() is declared as constexpr function. Whether it\
    \ is called in a compile-time context does not matter."
