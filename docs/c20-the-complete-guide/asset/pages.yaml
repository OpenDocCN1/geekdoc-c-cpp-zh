  md: "# 3.1 Motivating Example of Concepts and Requirements\n\n```\nauto maxValue(auto\
    \ a, auto b) // maxValue() for values\n{\n    return b < a ? a : b; // compare\
    \ values\n}\n```\n\nNow, we could pass a pointer to an int and a pointer to a\
    \ double.\n\n# Trailing requires Clauses():\n\nConsider the pointer version of\
    \ maxValue\n\n```\nauto maxValue(IsPointer auto a, IsPointer auto b)\n{\n    return\
    \ maxValue(*a, *b); // compare values the pointers to\n}\n```\n\nThere is still\
    \ an implicit requirement that is not obvious: finally the values have to be comparable.\n\
    Compilers detect that when (recursively) instantiating the maxValue() templates.\
    \ However, the error message might be a problem, because the error occurs late\
    \ and the requirement is not visible in the declaration of maxValue() for pointers.\n\
    \n# Standard Concepts\n\nTo let the pointer version already declare that the values\
    \ point to are comparable, we can add another constraint to the function:\n\n\
    ```\nauto maxValue(IsPointer auto a, IsPointer auto b)\nrequires std::three_way_comparable<decltype(*a),\
    \ decltype(*b)>\n{\n    return maxValue(*a, *b);\n}\n```\n\nWhat we use here to\
    \ declare the constraint is a trailing requires clause, which can be specified\
    \ after the parameter list. It has the benefit that we can use parameters to refer\
    \ to a standard check that whether the values are comparable. three_way_comparable_with\
    \ is one of many standard concepts the C++ standard library provides in namespace\
    \ std. Its name comes from the new way to define relational operators using operator<>.\n\
    \n# requires Expressions\n\nSo far, the maxValue() templates do not work for pointer-like\
    \ types that are not raw pointers, as smart pointers. The code could also compile\
    \ for those types, we better define pointer objects as objects, for which we can\
    \ call operator*.\n\nSuch a requirement is easy to specify since C++20:\n\n```\n\
    template<typename T>\nconcept IsPointer = requires(T p) { *p }; // constraint\
    \ that calling operator * has to be valid\n```"
