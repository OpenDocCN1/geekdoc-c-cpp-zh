    \nA function with auto parameters is different from a lambda. For example, you\
    \ still cannot pass a function with auto as a parameter without specifying the\
    \ generic parameter:\n\n```\nbool lessNameFunc(const auto& c1, const auto& c2)\
    \ { // sorting criterion\n    return c1.getName() < c2.getName(); // by compare\
    \ name\n}\n```\n\n```\nstd::sort(persons.begin(), persons.end(),\n    lessNameFunc());\
    \ // ERROR: can't deduce type of parameters in sorting criterion\n```\n\nRemember\
    \ that the declaration of lessName is equivalent to:\n\n```\ntemplate<typename\
    \ T1, typename T2>\nbool lessName(const T1& c1, const T1& c2) { // sorting criterion\n\
    \    return c1.getName() < c2.getName(); // by compare name\n```\n\nBecause the\
    \ function is not directly called, the compiler cannot deduce the template parameters\
    \ to the call. Therefore, you have to explicitly specify the template parameters:\n\
    \n```\nstd::sort(persons.begin(), persons.end(),\n    lessName<Customer, Customer>);\
    \ // OK\n```\n\nBy using a lambda, you do not have to specify the type of the\
    \ template parameters when passing the lambda as argument:\n\n```\nauto lessNameLambda\
    \ = [](const auto& c1, const auto& c2) { // sorting criterion\n    return c1.getName()\
    \ < c2.getName(); // by compare name\n};\n```\n\n```\nstd::sort(persons.begin(),\
    \ persons.end(),\n    lessNameLambda); // OK\n```\n\nOn the other hand, a function\
    \ template parameter is easy to specify:\n\n```\nvoid printFunc(const auto& arg)\
    \ {\n}\n```\n\n```\nprintFunc<std::string>(\"hello\"); // call function template\
