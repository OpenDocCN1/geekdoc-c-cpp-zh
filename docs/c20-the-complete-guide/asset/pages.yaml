  md: "# Chapter 3: Concepts and Requirements\n\n24\n\n}\n\nHere, the constraint is\
    \ formulated in a requires clause, which is introduced with the keyword requires\n\
    (there are other ways to formulate constraints).\n\nTo specify the constraint\
    \ the template cannot be used for raw pointers we use the standard type trait\n\
    std::is_pointer<v> (which yields the value member of the standard type std::is_pointer<v>).\n\
    With this constraint we can no longer use the function template for raw pointers:\n\
    \n```\nint x = 42;\nint y = 77;\nstd::cout << maxValue(x, y) << '\\n';      //\
    \ OK: maximum value of ints\nstd::cout << maxValue(&x, &y) << '\\n'; // ERROR:\
    \ constraint not met\n```\n\nThe requirement is a compile-check and has no impact\
    \ on the performance of the compiled code. It\nmeans that the template simply\
    \ cannot be used for raw pointers. When raw pointers are passed, the\ncompiler\
    \ behaves as if the template were not.\n\n# Defining and Using a concept\n\nIt\
    \ might be pretty like we need a constraint for pointers more than once. For this\
    \ reason, we can\nintroduce a concept for it:\n\n```\ntemplate<typename T>\nconcept\
    \ IsPointer = std::is_pointer<T>;\n```\n\nA concept is a template where we introduce\
    \ a name for one or more constraints on the passed template\nparameters. After\
    \ the equal sign have we specify the constraints as a Boolean expression that\
    \ is evaluated\nat compile-time. In this case, we require that the template argument\
    \ passed to IsPointer< has to be a raw\npointer.\n\nNow, we use this concept to\
    \ constrain the maxValue() template:\n\n```\ntemplate<typename T>\nrequires (!IsPointer<T>)\n\
    T maxValue(T a, T b)\n{\n    return b < a ? a : b;\n}\n```\n\n# Overloading with\
    \ Concepts\n\nBy using constraints we can even overload the maxValue() template\
    \ to have one imple-\ntation for pointers and one for other types:\n\n```\ntemplate<typename\
    \ T>\nrequires (!IsPointer<T>)\nT maxValue(T a, T b)    // maxValue() not for\
    \ pointers\n```\n\n¹ Type traits were introduced as standard type functions in\
    \ C++11 and the ability to call them with a _v suffix\nintroduced with C++17."
