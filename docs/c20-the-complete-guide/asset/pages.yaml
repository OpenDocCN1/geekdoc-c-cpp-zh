    \n# 12.2 Designated Initializers\n\nC++ provides now a way to specify initializers\
    \ of aggregates, which member should be initialized with a value. However, you\
    \ can use this only to skip parameters, not to revert the order.\n\nFor example,\
    \ assume we have the following aggregate type:\n\n```\nstruct Value {\n    double\
    \ amount = 0;\n    int precision = 2;\n    std::string unit = \"Dollar\";\n}\n\
    ```\n\nThe following is how to initialize values of this type are:\n\n```\nValue\
    \ v1{100};                          // OK (no designated initializers)\nValue\
    \ v2{.amount = 100, .unit = \"Euro\"}; // OK (second member has default value)\n\
    Value v3{.precision = 8, .unit = \"$\\$};     // OK (first member has default\
    \ value)\n```\n\nSee lang/designated.cpp for a complete example.\n\nNote that\
    \ following constraints:\n\n+   - You pass the initializer with = or {}.\n- You\
    \ can skip members, but you have to follow their order.\n- You either to use designated\
    \ initializers for all or none of the arguments. Mixed initialization is not allowed.\n\
    - Nested initialization with designated initializers is possible, but not directly\
    \ using .mem.mem.\n- Designated initializers can also be used in unions.\n- Using\
    \ designated initialization for arrays is not supported.\n\nThe restriction to\
    \ follow the order, using them for all or none of the arguments, not supporting\
    \ direct nesting, and not support arrays is a restrictions to the programming\
    \ language C. The restriction to expect the order of the members has the reason\
    \ that the initialization should reflect the order in which constructors are called\
    \ (which is the opposite order destructors are called).\n\nFor example:\n\n```\n\
    Value v4{100, .unit = \"Euro\"};      // ERROR: all or none designated\nValue\
    \ v5{.unit = \"$\", .amount = 20};      // ERROR: invalid order\nValue v6{.amount\
    \ = 29.9, .unit = \"Euro\"};  // ERROR: only with {}\n```\n\nAnd as an example\
    \ of nested initialization with = {} and unions:\n\n```\nunion Sub {\n    double\
    \ x = 0;\n    int y = 0;\n}\n```"
