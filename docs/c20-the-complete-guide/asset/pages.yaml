    \ that is used by push_back() instead:\n\n```\ntemplate<typename Coll, typename\
    \ T>\nrequires std::convertible_to<T, typename Coll::value_type>\nvoid add(Coll&\
    \ coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\nHere, we use the standard\
    \ concept std::convertible_to to ensure that the passed argument T can be (implicitly\
    \ or explicitly) converted to the element type of the collection."
