    Semaphores were first proposed by Olivier Giroux in http://wg21.link/p0514r1.
    The finally accepted wording was formulated by Bryce Adesteelin Leblanc, Olivier
    Giroux, JF Bastien, Detlef Vollmann, and David Olsen in http://wg21.link/p1135r6.


    Atomic references were first proposed as atomic<view> by H. Carter Edwards, Hans
    Boehm, Olivier Giroux, James Reus in http://wg21.link/p0019r0. The finally accepted
    wording was formulated by Daniel Sunderland, H. Carter Edwards, Hans Boehm, Olivier
    Giroux, Mark Hoemann, D. Holman, Bryce Adesteelin Leblanc, and James in http://wg21.link/p0019r8.
    The API for wait() and notification was also finally proposed by David Olsen in
    http://wg21.link/p1643r1.


    Atomic shared pointers were first proposed as atomic_shared_ptr> by Herb Sutter
    in http://wg21.link/n4058 and were adopted then for the concurrency TS (http://wg21.link/n4577).
    The finally accepted wording to integrate them into the C++ standard as partial
