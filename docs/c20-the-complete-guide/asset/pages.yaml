  md: 'For argument dependent lookup the problem is that utilities like std::begin()
    do not work if you explicitly qualify the call with namespace std.3 Assume you
    want to write code that always finds the right begin() function for an object
    of an arbitrary type.


    +   * To also support types that have no begin() member you cannot call the member
    function obj.begin(); // only works if a member function is provided


    +   * However, calling a free-standing begin() has find std::begin(), which only
    works without qualification obj has a type known in std:

    ```cpp

    begin(obj);

    ``` // does not find std::begin() if obj is not in std


    +   * So we might explicitly qualify to use std::begin(), but then the implementation
    of std::begin() does not find an overloaded free-standing begin():

    ```cpp

    class MyType {

    nint* begin(MyType);

    ...

    MyType obj;

    std::begin(obj); // std::begin() does not find ::begin(MyType)

    ```


    +   * The known workaround to use std::begin() in generic code is to put an additional
    declaration in front of the call and not qualify the call:

    ```cpp

    using std::begin;

    begin(obj); // OK, works in all these cases

