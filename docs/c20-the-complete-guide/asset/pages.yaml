    of UTF-8 characters but also output that did not work at.


    # Dealing with Broken Code


    You might wonder now, how to deal with code that formerly worked with UTF-8 characters.
    The easiest way to deal with it is to use reinterpret_cast<>:


    ```

    auto s = u8"text";

    std::cout << s;

    std::cout << reinterpret_cast<const char*>(s);

    // s is char8_t* since C++20

    // ERROR since C++20

    // OK

    ```


    For single character using a static_cast is enough:


    ```

    auto c = u8''x'';

    std::cout << c;

    std::cout << static_cast<char>(c);

    // c is char8_t since C++20

    // ERROR since C++20

    // OK

    ```


    You can use this or one of the other workarounds on the feature map for the char8_t
    characters.


    ```

    auto s = u8"text";

    #ifdef _CPP_char8_t

    std::cout << reinterpret_cast<const char*>(s);

    #else

    std::cout << s;

    #endif

    // s is const char8_t* since C++20

    // OK in C++17, ERROR since C++20

    ```


    If why C++20 does not provide a working output operator for UTF-8 characters,
    please note that this is a pretty complex issue, for which I simply do not have
    enough time to solve it. You can read more about here: http://stackoverflow.com/58895428


