  md: "# # Chapter 3\nConcepts and Requirements\n\nThis chapter introduces the new\
    \ C++ *concepts* with the keywords concept and requires.\nFor sure, *concepts*\
    \ are a milestone for C++, because concepts provide a language feature for something\
    \ we need a lot when writing generic code: specifying requirements. Although there\
    \ have been workarounds, we now have an easy and readable way to specify the requirements\
    \ for generic code, get better diagnostics when requirements are broken, disable\
    \ generic code when it does not work (although it might compile), and switch between\
    \ different generic code for different types.\n\n# ## 3.1 Motivating Example of\
    \ Concepts and Requirements\n\nConsider the following function template returning\
    \ the maximum of two values:\n\n```\ntemplate <typename T>\nT maxValue(T a, T\
    \ b) {\n  return b < a ? a : b;\n}\n```\n\nThis function template can be called\
    \ for two arguments that have the same type, provided the operations performed\
    \ for the parameters (comparing with operator< and copying) are valid.\nHowever,\
    \ passing two pointers would compare their addresses instead of the values they\
    \ refer to.\n\n# ### 3.1.1 Improving the Template Step-by-Step\n\nUsing a *requires*\
    \ clause\n\nTo fix that, we can equip the template with a *constraint* so that\
    \ it is not available if raw pointers are passed:\n\n```\ntemplate <typename T>\n\
    requires (!std::is_pointer<T>)\nT maxValue(T a, T b) {\n  return b < a ? a : b;\n\
    }\n```"
