    Atomic reference have the following restrictions compared to std::atomic::


    +   * No volatile support

    * The objects to refer might need alignment that is greater than the usual alignment
    for the underlying type. The static member std::atomic_ref<T>::required_alignment
    provides this minimum alignment.


    Atomic reference have the following extensions compared to std::atomic::


    +   * A copy constructor to create another reference to the same object (but an
    assignment operator is only provided to assigning the underlying values)

    * Thread synchronization support with wait(), notify_one(), and notify_all(),
    as it is now provided for all atomic types.


    Regarding all other features the same as std::atomic<> are provided


    +   * The type provides both a high-level API with memory barriers and a low-level
    API to disable them.

    * The static member is_always_lock_free and the non-static member function is
    lock_free() yield whether atomic operation is lock-free. This might still depend
    on the used alignment.


