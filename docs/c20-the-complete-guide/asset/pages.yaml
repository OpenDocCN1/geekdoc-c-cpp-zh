  md: "# 13.2 Formatted Output in Detail\n\n# 13.2.2 Standard Format Specifiers\n\n\
    As standard format specifiers you can use the following format (each specifier\
    \ is optional):\n\n```\nfill align sign # 0 width .prec L type\n```\n\n+   * fill\
    \ is the character to fill the value up to width (default: space). It can only\
    \ be specified if align is specified.\n* align is\n  - < left-aligned\n  - > right-aligned\n\
    \  - centered\nThe default alignment depends on the type.\n* sign is\n  - only\
    \ negative sign for negative values (default)\n  - + positive or negative sign\n\
    \  - space negative sign\n* # forces to use an alternative form of some notations:\n\
    \  - Writes a prefix such as # 0, and Ox for binary, hexadecimal notation of integral\
    \ values\n  - Forces always to write a dot (and keeping zeros) for floating-point\
    \ notations\n* 0 in front of width pads values with zeros.\n* width specified\
    \ a minimum field width.\n* prec after a dot specifies the precision:\n  - For\
    \ floating-point types, it specifies how many digits are after the dot or in total\
    \ (depending on the notation).\n  - For string types, it specifies the maximum\
    \ number of characters processed from the string.\n* L turns into locale-dependent\
    \ formatting (matters for arithmetic types and bool)\n* type specifies the general\
    \ notation of the formatting. That you can print characters as integral values\
    \ (and vice versa) or choose the general notation of floating-point values.\n\n\
    # 13.2.3 Width, Precision, and Fill Characters\n\nFor all values, a positive integer\
    \ value after the colon (without a leading dot) specifies a minimum field width\
    \ for the output of the value as a whole (including sign etc.). It can be used\
    \ together with a specification of alignment: For example:\n\n```\nstd::format(\"\
    {:7}\", 42);           // yields \"    42\"\nstd::format(\"{:7}\", \"hi\");  \
    \    // yields \"     hi\"\nstd::format(\"{:-7}\", \"hi\");        // yields \"\
    \    hi\"\nstd::format(\"{:>7}\", \"hi\");       // yields \"      hi\"\n```\n\
    \nYou can also specify padding zeros and a fill character. The padding 0 can only\
    \ be used for arithmetic types (except char and bool) and is ignored if an alignment\
    \ is specified:\n\n```\nstd::format(\"{:07}\", 42);      // yields \"0000042\"\
    \n```"
