  md: '# About This Book


    This book will present all the new language and library features of C++20. It
    will cover the motivation and context of each new feature with examples and background
    information.


    As usual for my books, the focus lies on the application of the new features in
    practice and the book will demonstrate how features impact day-to-day programming
    and how you can benefit from them in projects. This applies to both application
    programmers and programmers who provide generic frameworks and foundational libraries.


    # What You Should Know Before Reading This Book


    To get the most from this book, you should already be familiar with C++, ideally
    C++11, C++14, and/or C++17. You should be familiar with the concepts of classes
    and references in general, and you should be able to write C++ programs using
    components and containers from the C++ standard library. You should also be familiar
    with the basic features of “Modern C++,” such as auto or the range-based for


    However, you do not have to be an expert. My goal is to make the content understandable
    for the average C++ programmer who not necessarily know all the details of the
    latest features. I will discuss basic features and review more subtle issues as
    the need arises.


    This ensures that the text is accessible to experts and intermediate programmers
    alike.


    # Overall Structure of the Book


    This book covers all changes to C++ introduced with C++20. This applies to both
    language and library features as well as both features that affect day-to-day
    application programming and features for the sophisticated implementation of (foundation)
    libraries. However, the more general cases and examples usually come first.


    The different chapters are grouped, but the grouping has no deeper didactic reason
    than that it makes sense to first introduce language features because they might
    be used by the following library features. In principle, you can read the chapters
    in any order. If features from different chapters are combined, there are corresponding
    cross-references.'
