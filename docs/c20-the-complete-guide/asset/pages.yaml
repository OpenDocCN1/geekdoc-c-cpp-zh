  md: "# Chapter 10: Compile-Time Computing\n\n}\n\nTherefore, using std::is_constant_evaluated()\
    \ usually only makes sense in constexpr functions. However, cannot use std::is_constant_evaluated()\
    \ inside a constexpr function to call a consteval function, because calling a\
    \ consteval function from a constexpr function is not allowed in general:^4\n\n\
    ```\nconstval int funcConstEval(int i) {\n    return i;\n}\nconstexpr int foo(int\
    \ i) {\n    if (std::is_constant_evaluated(i)) {\n        return funcConstEval(i);\
    \ // ERROR\n    } else {\n        return funcRuntime(i);\n    }\n}\n```\n\n# std::is_constant_evaluated()\
    \ and Operator ?\n\nIn the C++20 standard is an interesting example to clarify\
    \ the way std::is_constant_evaluated() can be used. Modified it is as follows:\n\
    \n```\nint sz = 10;\nconstexpr bool sz1 = std::is_constant_evaluated() ? 20 :\
    \ sz; //true, so 20\nconstexpr bool sz2 = std::is_constant_evaluated() ? sz :\
    \ 20; //false, so ERROR\n```\n\nThe reason for this is: sz1 and sz2 is either\
    \ static initialization or dynamic initialization.^5\n\n+   * The initialization\
    \ of sz1 and sz2 must be constant. The compiler attempts to evaluate the initialization-izer\
    \ with std::is_constant_evaluated() treated as a constant value. which succeeds.\
    \ The result is 1, and that a constant. So, sz1 is initialized with 20.\n* With\
    \ sz2, the result is sz, which is not a constant. So, sz2 is (nominally) dynamically\
    \ initialized. Therefore, the previous result is discarded and the initializer\
    \ is evaluated with std::is_constant_evaluated() producing false instead. So,\
    \ the expression to initialize sz2 is also 20.\n\nHowever, sz2 is not necessarily\
    \ a constant, because std::is_constant_evaluated() is not necessarily a constant-expression\
    \ during this evaluation. So, the initialization of sz2 with this 20 does not\
    \ compile.\n\nBy using instead of constexpr it becomes even more tricky:\n\n```\n\
    int sz = 10;\nconst bool sz1 = std::is_constant_evaluated() ? 20 : sz; //true,\
    \ so 20\n```\n\n> ^4 C++23 will probably enable code like this with constval.\n\
    \n> ^5 Thanks to David Vandevoorde for pointing this out."
