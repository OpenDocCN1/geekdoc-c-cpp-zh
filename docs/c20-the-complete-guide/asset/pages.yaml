    # Restricted Operations for Calendrical Types


    The calendrical types were designed to detect at compile-time when operations
    are not useful or do not have the best performance. As a result, "obvious" operations
    do not operate as table Standard operations for calendrical types lists:


    +   * Day and month arithmetic depends on the year. You cannot add days/months
    or compute the difference of all month types that do not have a year.

    * Day arithmetic for fully specified dates has a bit of time to deal with the
    different length of months and leap years. You can add/subtract days or compute
    the difference of these types.

    * Because chrono makes assumption about the first day of a week, you cannot get
    an order between weekdays. When comparing with weekdays, only operator== and operator!=
    are supported. Weekday arithmetic is modulo 7 so it does not really matter which
    is the first day of a week. You can compute the difference of any two weekdays
