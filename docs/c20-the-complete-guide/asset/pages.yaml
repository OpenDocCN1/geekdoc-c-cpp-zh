  md: '# 3.3 Constraints and Requirements in Detail


    Let us discuss how to specify constraints and requirements in detail.


    # 3.3.1 Constraints


    To specify requirements template parameters you need constraints, which are Boolean
    expressions that evaluate to true or false at compile time to decide whether to
    instantiate and compile a template or not.

    A constraint can be:


    +   - an ad-hoc Boolean compile-time expression (with a restricted syntax that
    it might need parentheses around avoiding ambiguities)

    - a requires expressions specifying operations and types

    - a concept (defined before, by using the keyword concept)


    The basic application of a constraint is a requires clause, which uses the keyword
    requires and the constraint(s) to restrict the availability of the template. All
    constraints could also be used where Boolean expression can be used (especially
    if an constexpr condition).

    To combine multiple constraints, we use &&. For example:


    ```

    template<typename T>

    requires (sizeof(T) > 4 // ad-hoc Boolean expression

    && requires { typename T::value_type; } // requires expression

    && std::input_iterator<T> // concept

    ```


    The order of constraints does not matter.

    It is also possible to express "alternative" constraints using ||. For example:


    ```

    template<typename T>

    requires std::integral<T> || std::floating_point<T>

    Tower(T b, T p);

    ```


    Specifying alternative constraints is rarely needed and should not be too costly
    because excessive use of the || operator in requires clauses may potentially tax
    compilation resources (i.e., make compilation noticeably slower).

    A single constraint can also involve multiple template parameters. For example:


    ```

    template<typename T, typename U>

    requires std::convertible_to<T, U>

    auto f(T x, U y) {

    ...

    ```


    That way, constraints can impose a relationship between type parameters.


    # 3.3.2 Ad hoc Boolean Expressions


    The first way to formulate constraints for templates is to use compile-time expressions
    that convert to true or false. These expressions may especially use:


    +   - Type predicates, such as type traits'
