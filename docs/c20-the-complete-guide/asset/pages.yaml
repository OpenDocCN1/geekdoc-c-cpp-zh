  md: "# 6.2.3 std::default_sentinel\n\nA default sentinel is an iterator that provides\
    \ no operations at all. C++20 provides a corresponding object std::default_sentinel,\
    \ which has type std::default_sentinel_t in <iterator>. The type has no members:\n\
    \n```\nnamespace std {\n    class default_sentinel_t {\n    };\n    inline constexpr\
    \ default_sentinel_t default_sentinel();\n}\n```\n\nThe type and value are provided\
    \ to serve as a dummy sentinel (end), which is used when an iterator knows a range\
    \ ends. For those iterators, a comparison with std::default_sentinel triggers\
    \ the internal check of the iterator whether it is at the end or how far it is\
    \ from.\n\nFor example, counted iterators define an operator == for themselves\
    \ with a default sentinel to perform checking where they are at:\n\n```\nnamespace\
    \ std {\n    template<std::input_or_output_iterator I>\n    class counted_iterator\
    \ {\n\n        friend constexpr bool operator==(const counted_iterator& p,\n \
    \                             std::default_sentinel_t t) {\n            // returns\
