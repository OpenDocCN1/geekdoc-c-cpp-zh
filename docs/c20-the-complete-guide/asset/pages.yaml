    \nBy using the new constval keyword with lambdas, you can now require that lambdas\
    \ become immediate functions that \"function calls\" of them have been evaluated\
    \ at compile time. For example:\n\n```\nauto hashed = [] (const char* str) constval\
    \ {\n...\n};\n```\n\n```\nauto hashWine = hashed(\"wine\"); // /hash() called\
    \ at compile time\n```\n\nDue to the const of the definition of the lambda, any\
    \ call has to happen at compile-time with values known at compile-time. Passing\
    \ a runtime value is an error:\n\n```\nconst char* s = \"beer\";\nauto hashBeer\
    \ = hashed(s);\n// ERROR\n```\n\n```\nconstexpr const char* cs = \"water\";\n\
    auto hashWater = hashed(cs);\n// OK\n```\n\nNote that hashed itself does not have\
    \ to be const. It is a runtime object of the lambda for which the \"function call\"\
    \ is performed at compile time.\n\nThe discussion of constval precise in the section\
    \ about the new constval keyword provides programmers to define the initialization\
