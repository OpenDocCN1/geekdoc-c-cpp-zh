    Operations of Class std::ranges::single_view<> lists the API of a single view.


    | Operation | Effect |

    | --- | --- |

    | single_view<type> v | Creates a view with one value initialized elements of
    type type |

    | single_view v(val) | Creates a view with one element of value val |

    | v.begin() | Yields a pointer to the element |

    | v.end() | Yields a pointer to the element |

    | v.empty() | Yields false |

    | if (v) | Always true |

    | v.size() | Yields 1 |

    | v.front() | Yields a reference to the current value |

    | v.back() | Yields a reference to the current value |

    | v[idx] | Yields the current value for idx 0 |

    | r.data() | Yields a pointer to the element |


    Table 7.8. Operations of Class std::ranges::single_view>


    Note for a non-const view you modify v22(42):


    ```

    std::ranges::single_view v22(42);

    std::cout << v2.front() << ''\\n''; // prints 42

    ++v2.front(); // OK, modifies value of the view

    std::cout << v2.front() << ''\\n''; // prints 43

    ```


    ```

    std::ranges::single_view<const int> v32(42);

    ++v3.front(); // ERROR

    ```


    The constructor takes a value or moves it into the view. This it cannot refer
    to the initial value (declaring the element type to be reference does not compile).

    Because begin() and end() yield the same value, the view is always a common range.
    Because iterators refer to the value stored in the view to modify it, the single
    view is not a borrowed range (the lifetime of its iterators depends on view).


    # 7.4.3 std::ranges::empty_view


    Class template std::ranges::ranges::empty_view<> is a view with no elements. However,
    you have to specify the element type.


    The overall effect is that an empty view behaves roughly like an empty vector.
    In fact it models the concepts:


    +   - std::ranges::contiguous_range (which implies std::ranges::random_access_range)

    - std::ranges::sized_range'
