  md: "# 19.2 Modules with Multiple Files\n\n```\nc1.print();\nstd::cout << \" Average:\
    \ \" << c1.averagePrice() << '\\\\n';\n}\n```\n\nWe used the exported Customer\
    \ from the primary module interface to create a customer, place some orders, print\
    \ the customer with all orders, and print the value of the average order.\nThe\
    \ program has the following output:\n\nKim:\n\n| 1 table | 59.90 | 59.90 |\n|\
    \ 4 chair | 9.20 | 36.80 |\n\nSum: 96.70\nAverage: 48.35\n\nNote that any trial\
    \ to use Order in the code importing the module results in a compile-time error.\n\
    \n# 19.2.3 Internal Module Partitions\n\nIn the example, we have introduced a\
    \ data structure Order that is used inside the module only. It looks like we need\
    \ to declare it in the primary module interface to make it available to all implementation\
    \ units, which does not really scale in large projects.\nWith internal partitions\
    \ you can define internal stuff of a module in separate files. Note that partitions\
    \ can also be used to define the exported interface in a separate file, which\
    \ we will discuss.\nNote that internal partitions are sometimes called partition\
    \ implementation units which is based on the fact that in the C++20 standard they\
    \ are officially called \"module implementation units that are module partitions\"\
    \ and that sound like they are the implementations of interface partitions. They\
    \ do not just serve like internal header files for a module, that may provide\
    \ declarations and definitions.\n\n# Defining an Internal Partition\n\nUsing an\
    \ internal partition, we can define the local Order in its own module unit as\
    \ follows:\n\n```\nlang/mod2/mod2order.cpp\n\nmodule; // start module unit with\
    \ global module fragment\n\n#include <string>\n\nmodule Mod2:Order; // internal\
    \ partition declaration\n\nstruct Order {\n    int count;\n    std::string name;\n\
    \    double price;\n```"
