  md: "# 11.1.1 Using Template Parameters for Generic Lambdas in Practice\n\nExplicit\
    \ template parameters can be useful to specialize (or partially restrict the type\
    \ of parameters of) generic lambdas. Consider the following example:\n\n```\n\
    <typename T>(const std::vector<T>& vec) // only can pass vectors\n...\nn};\n```\n\
    \nThis lambda accepts only vectors as arguments. When using auto it would not\
    \ be easy to restrict the argument to vectors, because C++ does not (yet) support\
    \ something like std::vector<auto>. However, in this case you could use type constraints\
    \ to constrain the type of the parameter (such as to require random access or\
    \ even a specific type).\n\nExplicit template parameters also help to avoid the\
    \ need decltype. For example, for perfect-forwarding a generic parameter in a\
    \ lambda you can:\n\n```\n<typename...> Types(Types&& args) {\nfoo(std::forward<Types>(args)...);\n\
    };\n```\n\ninstead of:\n\n```\n(auto&&... args) {\nfoo(std::forward<decltype(args)>(args)...);\n\
    };\n```\n\nA similar example would be to provide specific behavior of a certain\
    \ type when visiting a std::variant<> introduced in C++17):\n\n```\nstd::variant<int,\
    \ std::string> var;\n```\n\n```\n// generic lambda([](const auto val) {\nstd::visit([](\n\
    if constexpr(std::is_same_v<decltype(val), const std::string&>) {\n  // string\
    \ specific processing\n}\n  std::cout << val << '\\n';\n},\nnvar);\n```\n\nWe\
    \ have to use decltype() to get the type of the parameter and compare that as\
    \ a const& (or remove const and the reference). With C++20, you can write the\
    \ following:\n\n```\nstd::visit([]<typename T>(const T& val) { // since C++20\n\
    if constexpr(std::is_same_v<T, std::string>) {\n  // string specific processing\n\
    }\n  std::cout << \"value: \" << val << '\\n';\n},\nvar);\n```"
