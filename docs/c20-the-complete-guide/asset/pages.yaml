  md: '# 5.2 Using Views


    | Adaptor | Type | Effect |

    | --- | --- | --- |

    | all(...) | varies | Converts a view into an iterator and a count |

    | counted(...) | varies | Creates a view from a begin iterator and a sentinel
    |

    | | subrange ref_view | Creates a view that refers to a range (low level)

    | iota(fst) | iota_view | Creates a view with an endless incrementing sequence
    of values starting with fst |

    | iota(fst, lst) | iota_view | Creates a view with an incrementing sequence of
    values from fst up to lst (not included) |

    | single(val) | single_view | Creates a view with val as the only element |

    | empty<type> | empty_view | Creates an empty of element type type |

    | | basic_istream_view | Creates a read-only view for a sequence of characters
    (since C++17) |

    | | basic_string_view span | Creates a view to a sequence of elements in contiguous
    memory |


    Table 5.1. Initial views


    | Adaptor | Type | Effect |

    | --- | --- | --- |

    | take(num) | varies | Takes the first num elements of a range |

    | take_while(pred) | take_while_view | Takes all elements that match a predicate
    |

    | drop(num) | varies | Drops the first num elements of a range |

    | drop_while(pred) | drop_while_view | Drops all elements that match a predicate
    |

    | filter(pred) | filter_view | Filters to use all elements that match a predicate
    |

    | transform(pred) | transform_view | Transforms all elements of a range |

    | elements<idx> | elements_view | Uses the idth member of each tuple-like element
    |

    | keys | elements_view | Uses the first member of each tuple-like element |

    | values | elements_view | Uses the second member of each tuple-like element |

    | reverse | varies | Reverses the order of elements |

    | join | join_view | Joins the elements of multiple ranges |

    | split(pred) | split_view | Split a range into sub-ranges |

    | lazy_split(pred) | lazy_split_view | Split an input/const range into sub-ranges
    |

    | common | varies | Harmonizes views of begin iterator and sentinel |


    Table 5.2. Views to Operate on Ranges


    All of the views provide move (and optional) operations and a destructor with
    constant complexity (the time operations takes not depend on the number of elements).¹
    The concept std::ranges::view checks the corresponding requirements.


    > ¹ The original C++20 standard also requires views to have a default constructor.
    However, requirement was removed later with http://wg21.link/P2325R3'
