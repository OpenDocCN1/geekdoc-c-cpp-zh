  md: '# 14.1 Overview by Example


    UTC: 2021-12-05 18:30:00

    Berlin: 2021-12-05 19:30:00 CET

    L.A.: 2021-12-05 10:30:00 PST


    Let us go step through this program.


    # Namespace Declarations


    We start with namespace and using declarations to make the use of the namespace
    of the chrono library a bit more convenient:


    +   * First we use chr :: as a shortcut for the standard namespace of the chrono
    library : chrono:

    ```cpp

    namespace chr = std::chrono; // shortcut for std::chrono

    ```nTo make examples more readable, I will from time to time use chr :: instead
    of std::chrono

    * Then, we ensure that can use literal suffixes as y, min, and h (the latter is
    new in C++20).

    ```cpp

    using namespace std::literals; // for min, h, y suffixes

    ```nTo avoid any qualification you could use a using declaration:

    ```cpp

    using namespace std::chrono; // skip chrono namespace qualification

    ```However, as you should, limit the scope of such a using declaration to avoid
    unwanted side effects.


    # Type year_month_day


    The first real statement is the initialization of first as an object of std::chrono::year_month_day,


    ```

    chr::year_month_day_first = 2021y / 1 / 5;

    ```


    The year_month_day is a calendrical type providing attributes for all three fields
    of a data that it is easy to deal with the year, the month, and the day of a particular
    date.


    Because we want to iterate over all fifth of day in the current year, we initialize
    the object with January 5, 2021, passing a first year and then using operator
    / to combine with a value for the month and a value for the day.


    This way of initialization for date types is safe and requires only specifying
    the type of the first operand. In fact, what happens is as follows:


    +   * First, we specify the y as an object of type std::chrono::year.

    Here, we use the new literal y:

    ```cpp

    2021y

    ```


    To have this literal, we need to provide one of the following using declarations:


    ```

    ```cpp

    using std::literals; // enable all standard literals

    using std::chrono::literals; // enable all standard chrono literals

    using namespace std::chrono; // enable all standard chrono literals

    using namespace std; // enable all standard literals

    ```

    ```


    Without literals we would need something like the following:


    ```

    std::chrono::year{2021};

    ```'
