  md: "# 36 Chapter 3: Concepts and Requirements\n\nHowever, there is an important\
    \ benefit if the concept ConvertsWithoutNarrowing also checks for the concept\
    \ std::convertible_to. In that case the compiler can detect that ConvertsWithoutNarrowing\
    \ is more constrained than std::convertible_to. The terminology is ConvertsWithoutNarrowing\
    \ subsumes std::convertible_to.\n\nThat allows a programmer to do the following:\n\
    \n```\ntemplate<typename F, typename T>\nrequires std::convertible_to<F, T>\n\
    void foo(F, T)\n{\n    std::cout << \"may be narrowing\\n\";\n}\n```\n\n```\n\
    template<typename F, typename T>\nrequires ConvertsWithoutNarrowing<F, T>\nvoid\
    \ foo(F, T)\n{\n    std::cout << \"without narrowing\\n\";\n}\n```\n\nWithout\
    \ specifying that ConvertsWithoutNarrowing subsumes std::convertible_to, the compiler\
    \ would raise an ambiguity error here when calling foo() with two parameters that\
    \ convert to each other without narrowing.\n\n# 3.2.3 Requirements to Use Different\
    \ Statements\n\nFinally, we might want to make our add() function template more\
    \ flexible:\n\n+   - We might also want to support collections that only provide\
    \ insert() instead of push_back() to insert new elements.\n- We might want to\
    \ support passing a collection (container or range) to insert multiple values.\n\
    \nYes, you can argue that these are different functions and they should have different\
    \ names and if that works it often better to use different names. However, the\
    \ C++ standard library is a good example of the benefits you can get if different\
    \ API's are harmonized. For example, you can use the same generic code to iterate\
    \ over all containers, internally containers use very different ways to go to\
    \ the next element and access its value.\n\n# Calling Different Member Functions\n\
    \nTo switch between push_back() and insert() in the implementation of a function,\
    \ we have several options. There are two to solve:\n\n+   - We have to detect\
    \ whether push_back() or insert() is supported.\n- We have to ensure that we compile\
    \ only calls that are supported."
