  md: '+   Stop sources of type std:::stop_source can request a stop its associated
    shared stop state.


    +   Stop tokens of type std:::stop_token can be used to react to a stop for its
    associated stop state. You can actively poll whether there is a stop request or
    register a callback of std:::stop_callback which will be called when a stop is
    requested.


    +   Once a stop request has been made, it cannot be withdrawn (a stop request
    has no effect).


    +   Stop sources and stop tokens can be copied and moved around to be signal or
    react to a stop at multiple locations. Copying a source or token is relatively
    cheap so that you can pass them by value to avoid lifetime issues (copying is
    not as cheap as copying an integral value or raw pointer around; it is more like
    passing a shared pointer; so, when passing them to a sub-function it might better
    to pass them by reference).


    +   The mechanism is thread safe and can be used in concurrent situations: can
    request a stop check for a requested stop, can register or unregister callbacks
    are properly synchronized and the associated shared stop state is automatically
    destroyed when the last user (stop source or stop token) gets destroyed.


    The following example shows how to use both stop source and a stop token:


    ```

    #include <stop_token>

    ...

    // create_stop_source and stop_token:

    std::stop_source ssrc; // creates a shared stop state

    std::stop_token stok(ssrc.get_token()); // creates a token for the stop state

    ```


    You simply create the stop_source object, which provides the API to request a
    stop. The constructor also creates the associated shared stop state. You can ask
    the stop for the stop_token object, which provides the API to react to a stop
    requests (by polling or registering callbacks).


    You can pass the token (and/or the source) to locations/threads to establish the
    asynchronous communication between the places that might request a stop and those
    that might react to a stop.


    There is no other way to create a stop token with an associated shared stop state.
    The default constructor has no associated stop state.


    # 16.2.1 Stop Sources and Stop Tokens in Detail


    Let us look at the API''s stop sources, stop tokens, and stop callbacks in detail.


    # Stop Sources in Detail


    Operations of Objects of Class stop_source lists the API of std:::stop_source.


    To make it possible to create stop sources with no associated stop state (which
    might be useful because the stop state needs resources), you can create a stop
    source with a special constructor and assign a stop to source later:


    ```

    std::stop_source ssrc{nostopstate}; // no associated shared stop state

    ...

    ssrc = std::stop_source(); // assign new shared stop state

    ```'
