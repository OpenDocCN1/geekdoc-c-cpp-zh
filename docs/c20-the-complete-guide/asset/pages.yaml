  md: "# 10.5 Using Heap Memory, Vectors, and Strings at Compile Time\n\n```\nconst\
    \ bool sz2 = std::is_constant_evaluated() ? sz : 20; //false, so also 20\ndouble\
    \ arr1[sz1]; //OK\ndouble arr2[sz2]; // may or not compile\n```\n\nOnly sz1 is\
    \ a compile-time constant an always be initialized and array. For the reason above,\
    \ sz2 is also initialized to 20. However, because it is not necessarily a constant,\
    \ the initialization of arr2 may or not compile (according to the compiler and\
    \ optimizations used).\n\n# 10.5 Using Heap Memory, Vectors, and Strings at Compile\
    \ Time\n\nSince C++20, compile-time functions can allocate memory provided the\
    \ memory is released at compile time. For this reason, you can now use strings\
    \ or vectors at compile time. However, you cannot use the compile-time created\
    \ strings or vectors at runtime because memory allocated at compile time has to\
    \ be released at compile time.\n\n# 10.5.1 Using Vectors at Compile Time\n\nHere\
    \ is a first example, using a std::vector<> at compile time:\n\n```\n#include\
    \ <vector>\n#include <ranges>\n#include <algorithm>\n#include <numeric>\n\ntemplate<std::ranges::input_range\
    \ T>\nconstexpr auto modifiedAvg(const T& rg)\n{\n    using elemType = std::ranges::range_value<T>;\n\
    \n// initialize compile-time vector with passed elements:\n    std::vector<elemType>\
    \ v(std::ranges::begin(rg),\n                           std::ranges::end(rg));\n\
    \n// perform several modifications:\n    v.push_back(elemType{});\n    std::ranges::sort(v);\n\
    \n    auto newEnd = std::unique(v.begin(), v.end());\n\n// return average of modified\
    \ vector:\n    auto sum = std::accumulate(v.begin(), newEnd,\n               \
    \                elemType{});\n    return sum / static_cast<double>(v.size());\n\
    }\n```"
