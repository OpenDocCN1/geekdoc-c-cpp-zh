  md: "# Chapter 14\n\n# Dates and Time Zones for <chrono>\n\nC++11 introduced the\
    \ chrono library with basic support for durations and time points. You could specify\
    \ and deal with durations of different units and time points of different clocks.\
    \ However, there was no support for high-level durations and time points such\
    \ as dates (days, months and years), weekdays, and dealing with different time\
    \ zones.\n\nC++20 extends the existing chrono library with support for dates,\
    \ time zones, and several other features. This extension is described in this\
    \ chapter.^1\n\n# 14.1 Overview by Example\n\nBefore we go into details, let us\
    \ look at some motivating examples.\n\n# 14.1.1 Schedule a Meeting on the 5th\
    \ of Every Month\n\nConsider a program where we want to iterate over all months\
    \ in a year to schedule a meeting on the 5th announced in different time zones.\
    \ The program can be written as follows:\n\n```\nlib/chrono1.cpp\n#include <chrono>\n\
