  md: "42 Chapter 3: Concepts and Requirements\n\n# SFINAE\n\nThe major approach to\
    \ disable the availability of templates from C++20 is SFINAE. The term “SFINAE”\
    \ (pronounced like sfee-nay) stands for “substitution failure is not an error”\
    \ and means the rule that we simply ignore generic code if it is not well-formed\
    \ instead of raising a compile-time error.\n\nGeneric example, to switch push_back()\
    \ and insert(), we could declare the function templates before C++20 as follows:\n\
    \n```\ntemplate<typename Coll, typename T>\nauto add(Coll& coll, const T& val)\
    \ -> decltype(coll.push_back(val))\n{\n    return coll.push_back(val);\n}\n```\n\
    \n```\ntemplate<typename Coll, typename T>\nauto add(Coll& coll, const T& val)\
    \ -> decltype(coll.insert(val))\n{\n    return coll.insert(val);\n}\n```\n\nBecause\
    \ we make the call to push_back() here part of the first template declaration,\
    \ this template is ignored if push_back() is not supported. The corresponding\
    \ declaration is necessary in the second template for insert() (overload resolution\
    \ does not understand that one template is more constrained than the other).\n\
    However, that is a very simple way to place a requirement and programmers might\
    \ overlook it.\n\n# std::enable_if\n\nFor more complicated cases of disabling\
    \ generic code the C++ standard library since C++11 provides std::enable_if<.\n\
    This is a trait that takes a Boolean condition which yields invalid code if false.\
    \ By using the std::enable_if<>somewhere inside a declaration, you could also\
    \ “SFINAE out” generic code.\nFor example, you could use the std::enable_if<>\
    \ type to exclude calls from calling the add() function template in the following\
    \ way:\n\n```\n// disable the template for floating-point values:\ntemplate<typename\
    \ Coll, typename T>\ntype = std::enable_if<std::is_floating_point<T>>::type\n\
    void add(Coll& coll, const T& val)\n{\n    coll.push_back(val);\n}\n```\n\nThe\
    \ trick is to insert an additional template parameter to be able to use the trait\
    \ std::enable_if<>. The trait yields void if it does not disable the template\
    \ (you can specify that it yields another type as optional second parameter)."
