  md: '# 5.3 Borrowed Iterators and Ranges


    # 5.3.2 Borrowed Ranges


    Range types can claim that they are borrowed ranges. That means they always return
    iterators that cannot dangle. When temporary borrowed ranges are used as parameters,
    algorithms can return iterators to them because the iterators can never dangle.


    In general, containers and views are not borrowed ranges. However, we have two
    kinds of views that are borrowed ranges:


    +   Views that store all information to iterate locally:

    - `std::ranges::iota_view`, generating an increasing sequence of values. Here
    the iterator locally stores the current value and does not refer to any other
    object

    - `std::ranges::empty_view`, which any iterator is at the end so that it cannot
    iterate over element values at all.


    +   Views that refer to other ranges so that the iterators directly refer to the
    underlying ranges:

    - `std::ranges::subrange`

    - `std::ranges::ref_view`

    - `std::span`

    - `std::string_view`


    Note that borrowed ranges can still dangle, when they refer to an underlying range
    (the latter category above) and the underlying range is no longer there.


    As a result, we can catch but not all runtime errors at compile time, which I
    can demonstrate with the various ways to try to find an element with the value
    8 in various ranges (yes, usually we should check, whether an iterator was returned)


    +   Ivalues (objects with names) are borrowed ranges so that the returned iterator
    cannot be dangling as long as the iterator exists in the same or a sub-scope of
    the range


    ```

    auto pos0 = std::ranges::find(col, 8);                   // borrowed range

    std::cout << *pos0;                                     // (runtime error if no
    8 found)

    ```


    ```

    auto pos1 = std::ranges::find(std::vector{8}, 8);      // yields dangling

    std::cout << *pos1;                                     // compile-time ERROR

    ```


    +   For temporary views it depends. For example:


    ```

    auto pos2 = std::ranges::find(std::views::single(8), 8); // yields dangling

    std::cout << *pos2;                                     // compile-time ERROR

    ```


    ```

    auto pos3 = std::ranges::find(std::views::iota(8), 8);     // borrowed range

    std::cout << *pos3;                                     // (runtime error if no
    8 found)

    ```


    ```

    auto pos4 = std::ranges::find(std::views::empty<int>(), 8); // borrowed range

    std::cout << *pos4;                                     // runtime ERROR as no
    8 found

    ```


    For example, single view iterators refer to the value of their element in the
    view; therefore, single view are no borrowed ranges.'
