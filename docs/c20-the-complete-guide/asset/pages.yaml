  md: '# 5.2.1 Views from Ranges


    Containers and strings are not views because they are not lightweight enough:
    they own and copy their elements.

    To use containers and string as views you should use the all\(\ adaptor or a specific
    view that already performs some modification with the range.

    As written, you have different options for this:


    +   - You can pass the container as a parameter to adaptor:

    ```cpp

    auto first4 = std::views::take(coll, 4);

    ```

    - You can pipe the container into an adaptor:

    ```cpp

    auto first4 = coll | std::views::take(4);

    ```

    - You can pass the container as a parameter to the view type:

    ```cpp

    std::ranges::take_view first4{coll, 4};

    ```


    All these creations have an important restriction: they do not compile for temporary
    objects and other values passed as arguments:

    ```cpp

    std::vector<int> getValues(); // forward declaration

    std::ranges::take_view take5{getValues(), 5}; // compile-time ERROR

    ```

    This means you cannot copy like:


    ```

    // process first 5 elements of returned code:

    for (const auto& elem : std::ranges::take_view(getValues(), 5)) { // ERROR

    ...

    nor:

    // process first 5 elements of returned collection:

    for (const auto& elem : getValues() | std::views::take(5)) { // ERROR

    ...

    ```


    Instead, you have to initialize a reference with the return value, which by rule
    extends the lifetime of the return value and is an lvalue (because it has a name):

    // process first 5 elements of returned collection:

    ```cpp

    const auto& r = getValues(); // reference extends lifetime of return value

    for (const auto& elem : std::views::take(r, 5)) { // OK

    ```


    If you want to preserve non-const (which is necessary to iterating over some views),
    you have to use a universal/forward reference:

    // process first 5 elements of returned collection:

    ```cpp

    auto&& r = getValues(); // reference extends lifetime of return value

    for (const auto& elem : std::views::take(r, 5)) { // OK

    ```'
