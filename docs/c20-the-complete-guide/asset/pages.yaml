    \ is detected in the deep darkness of the implementation of std::vector. We get\
    \ between 40 and 90 lines of error messages, where you have to carefully look\
    \ for the broken requirement:\n\n```\nprog.cpp:11:17: required from 'void add(Coll&,\
    \ const T&)\n[with Coll = std::vector<std::atomic<int>>; T = std::atomic<int>']\n\
    prog.cpp:25:18: required from here\n.../gcc/include/bits/stl_constructor.h:96:17\n\
