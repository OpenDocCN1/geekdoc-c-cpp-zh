  md: "# Chapter 1: Comparisons and Operator <==\n\n+   - operator== defines equality\
    \ and can be used by the equality operators == and !=,\n- operator<= defines the\
    \ ordering and can be used by the relational operators <, <=, >, >=.\n\nTo have\
    \ more control over the generated comparison operators, you can define operator==\
    \ and operator<=\nFor example:\n\n```\nlang/value20def.hpp\n\n#include <compare>\n\
    \nclass Value {\nprivate:\n    long id;\n    ...\npublic:\n    constexpr Value(long\
    \ i) noexcept\n        : id(i) {}\n\n    // for equality operators:\n    bool\
    \ operator===(const Value& rhs) const {\n        return id == rhs.id; // defines\
    \ equality (== and !=)\n    }\n\n    // for relational operators:\n    auto operator<=>(const\
    \ Value& rhs) const {\n        return id <= rhs.id; // defines ordering (<, <=,\
    \ >, >=)\n    }\n};\n```\n\nThat way you can specify in which order or implement\
    \ special behavior.\nThe way these basic operators work is if an expression uses\
    \ one of the comparison operators and does not find a matching direction, the\
    \ expression gets rewritten so that it can use these operators.\nCorresponding\
    \ to rewriting calls of equality operators, rewriting might also change the order\
    \ of relational operators, which might enable implicit type conversion for the\
    \ first operand. For example, if\n\nx <= y\ndoes not find a matching definition\
