  md: "# 3.7 Design Guidelines for Concepts\n\nStandard Concepts Support Overload\
    \ Resolution Better\n\nCompilers are for example to detect whether a concept is\
    \ part of another concept.\n\nConsider the following example, where we overload\
    \ a function foo() with two requirements defined as type traits:\n\n```\ntemplate<typename\
    \ T, typename U>\nrequires std::is_same<T, U>    // using traits\nvoid foo(T,\
    \ U)\n{\n    std::cout << \"foo() for parameters of same type\" << '\\nn';\n}\n\
    ```\n\n```\ntemplate<typename T, typename U>\nrequires std::is_same<T, U> && std::is_integral<V>\n\
    void foo(T, U)\n{\n    std::cout << \"foo() for integral parameters of same type\"\
    \ << '\\nn';\n}\n```\n\nfoo(1, 2); // ERROR: ambiguity: both requirements are\
    \ true\n\nThe problem is that if we evaluate both overloads fits and there is\
    \ no rule that one of them has priority over the other. Therefore, the compiler\
    \ stops compiling an ambiguity error.\n\nIf we use the corresponding concepts\
    \ instead, the compiler finds out that the second requirement is a specialization\
    \ and prefers it if both requirements are met\n\n```\ntemplate<typename T, typename\
    \ U>\nrequires std::is_as<T, U>    // using concepts\nvoid foo(T, U)\n{\n    std::cout\
    \ << \"foo() for parameters of same type\" << '\\nn';\n}\n```\n\n```\ntemplate<typename\
    \ T, typename U>\nrequires std::is_as<T, U> && std::integral<T>\nvoid foo(T, U)\n\
    {\n    std::cout << \"foo() for integral parameters of same type\" << '\\nn';\n\
    }\n```\n\nfoo(1, 2); // OK: second foo() preferred"
