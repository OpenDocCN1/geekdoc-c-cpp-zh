    \nBoth strings and string views have new member functions starts_with() and ends_with().\
    \ They provide an easy way to check the leading and trailing character of a string\
    \ against a certain sequence of characters. You can compare against a single character,\
    \ an array of characters, or a string or string view. For example\n\n```\nvoid\
