    # 1.2 Defining and Using Comparisons


    The following sections will explain the details of the handling of the comparator
    operators since C++20.


    # 1.2.1 Using Operator <=>


    Operator <=> is a new binary operator. It is defined for all fundamental data
    types, for which the relational operators are defined. As usual, it can be user-defined
    as operator<>().


    Operator <=> has precedence over all other operators except that you need to use
    in an output statement but not to compare its result with another value:


    ```

    std::cout << (0 < x <> y) << ''\n''; // fails 0 < (<=> y)

    ```


    Please note that you have to include a specific header file to deal with the result
    of operator <=>:

    However, most header files for standard types (strings, containers, <utility>)
    include this header. To call the operator or values that do not return a header,
    you have to include <compare>.


    ```

    #include <compare>

    ```


    ```

    #include <compare>    // for calling <=>

    ```


    # 1.2.2 Comparison Category Types


    The new operator <=> does not return a Boolean value. Instead, it acts like three-way-comparisons
    yielding a negative value to less, a positive value to greater, and 0 to equal
    or equivalent. This behavior is similar to the return value of the C function
    strcmp(); however, there is an important difference: the return value is not an
    integral value. Instead, the C++ standard library provides three return types,
    which reflect the category of the comparison.


    # Comparison Categories


    When comparing two values to put them in an order, we have different categories
    of behavior that could happen:


    +   * **Strong ordering** (also called total ordering) any value of a given type
    is either less than equal or greater than any value of this type (including itself)

    Typical examples of this category are integral values or common string types.
    A string s1 is either less or greater than a string s2.

    If a value is neither less greater is to be equal. If you have multiple objects
    you can sort them in ascending or descending order (with equal values having any
    order among each other).'
