  md: "# 10.4 std::is_constant_evaluated()\n\nHere is how the two branches get called:\n\
    \n```\nconstexpr int l1 = len(\"hello\"); // uses then branch\nint l2 = len(\"\
    hello\"); // uses else branch (no required compile-time context\n```\n\nThe first\
    \ call of len() happens in a compile-time context. For that reason, is_constant_evaluated()\
    \ yields true so we use the then branch. The second call of len() happens in a\
    \ runtime context, so is_constant_evaluated() yields false and str is called.\
    \ The latter happens if the compiler decides to evaluate the call at compile-time.\
    \ The important point is that the call of len() and therefore the call of std::is_constant_evaluated()\
    \ happens in a runtime context.\n\nHere is a function that does the opposite:\
    \ converting integral and value to a string both at compile time or at runtime:\n\
    \n```\ncomptime/asstring.hpp\n\n#include <string>\n#include <format>\n\n// convert\
    \ integral value to string\n// - can be used at compile time or runtime\nconstexpr\
    \ std::string asString(long long value)\n{\n    if (std::is_constant_evaluated())\
    \ {\n        // compile-time version:\n        if (value == 0) {\n           \
    \ return \"0\";\n        }\n        if (value < 0) {\n            return \"-\"\
    \ + asString(-value);\n        }\n        std::string s = asString(value / 10)\
    \ + std::string(1, value % 10 + '0');\n        if (s.size() > 1 && s[0] == '0')\
    \ // skip leading 0 if any\n            s.erase(0, 1);\n        }\n        return\
    \ s;\n    }\n    else {\n        // runtime version:\n        return std::format(\"\
    {}\", value);\n    }\n}\n```\n\nAt runtime we simply use std::format(). At compile-time\
    \ we manually create a string of the optional negative sign and all digits (we\
    \ use a recursive approach to bring them in the right order). An example of this\
    \ you can find in the section about exporting compile-time string to runtime strings."
