  md: "# 19.2 Modules with Multiple Files\n\n};\n\nAs you can see, we need the header\
    \ files and the internal data structure Order to define class Customer. However,\
    \ by not exporting them, they cannot be used directly by code importing this module.\n\
    \nFor class Customer, the member functions averagePrice(), sumPrice(), and print()\
    \ are only undeclared. We implement them in implementation files associated with\
    \ the module.\n\n# Module Implementation Units\n\nTo provide source code that\
    \ is not exported by a module, you can use module implementation units. They serve\
    \ like ordinary CPP translation units with a leading statement that they apply\
    \ to a specific module.\n\nWe may have as many implementation units as we like.\
    \ In our example, I provide two, one to implement numeric operations and one to\
    \ implement I/O operations.\n\nThe module implementation unit for numeric operations\
    \ looks as follows:\n\n```\nlang/mod1/price.cpp\nmodule Mod1; // implementation\
    \ unit of Mod1\ndouble Customer::sumPrice() const\n{\n    double sum = 0.0;\n\
    \    for (const Order& od : orders) {\n        sum += od.count * od.price;\n \
    \   }\n    return sum;\n}\ndouble Customer::averagePrice() const\n{\n    if (orders.empty())\
    \ {\n        return 0.0;\n    }\n    return sumPrice() / orders.size();\n}\n```\n\
    \nThe file is a module unit because it starts with a declaration introducing that\
    \ this is a file of module Mod1:\n\n```\nmodule Mod1;\n```\n\nThis declaration\
    \ implicitly imports the primary module interface (but nothing else). Thus, the\
    \ declarations of types Order and Customer are known and we can directly provide\
    \ implementations of their member functions.\n\nNote that a module implementation\
    \ unit does not export anything. export is only allowed in a module interface,\
    \ which is declared with export module (and remember that is only one primary\
    \ module interface allowed per module)."
