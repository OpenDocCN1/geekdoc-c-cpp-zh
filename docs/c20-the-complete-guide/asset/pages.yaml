    When using views (and the ranges library in general), there are a few thing that
    are surprising or even broken regarding const:


    +   - Views remove the propagation of const

    - Functions like cbegin() and end(), which have the goal to ensure elements are
    const while iterating over them, are either not provided or broken.

    - It might not be possible to iterate over a view when it is const.


    These drawbacks have nothing to do with the nature of views and some design decisions
    that were made.

    There are fixes where at least fix the broken const of cbegin() and end(). Unfortunately,
    the C++ standards committee decided not apply them to C++20. These will hopefully
    come (and change behavior) with C++23.


