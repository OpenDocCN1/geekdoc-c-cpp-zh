  md: '# 14.7.2 The Pseudo Clock local_t


    As introduced already, there is a special clock of type std::chrono::local_t.
    This clock allows us to specify local timepoints, which have no zone (not even
    UTC) yet. Its epoch is interpreted as “local time” which means you have to combine
    it with a timezone to know which point in time it represents.


    local_t is a "pseudo clock" because it not fulfill all requirements of clocks.
    In fact, it does not provide a member function now():


    auto now = std::chrono::local_t::now(); // ERROR: now() not provided


    Instead you need a system clock timepoint and a time zone. Then, you can convert
    the timepoint using a time zone such as the timezone or UTC:


    auto sysNow = chr::system_clock::now(); // NOW as system timepoint

    nchr::local_time now1

    point = chr::locate_zone("UTC")->to_local(sysNow); // NOW in UTC as local timepoint

    chr::local_time now2

    point = chr::locate_zone("Asia/Tokyo")->to_local(sysNow); // Now in Tokyo as local
    timepoint

    chr::local_time now3

    point = chr::current_zone()->to_local(sysNow); // NOW locally as local timepoint


    Another way to get the same result is to get_local_time() for a zoned time (a
    timepoint with associated timezone):


    chr::local_time_now4 = chr::zoned_time(chr::current_zone(), sysNow).get_local_time();


    A different approach is to parse a string into a local timepoint:


    chr::local_seconds tp; // timepoint<local_t, seconds>

    std::istringstream ss("2021-01-14 18:30") >> chr::parse(std::string("%F %R"),
    tp);


    Remember the subtle difference of local timepoints to compare to other timepoints:


    +   A system/UTC/GST timezone represents a point in time. Applying it to a timezone
    will convert the time value it represents.


    +   A local timepoint represents a local time point. Its global time point becomes
    clear once it is combined with a timezone.


    For example:


    auto now = chr::current_zone()->to_local(chr::system_clock::now());

    std::cout << now << ''\n'';

    std::cout << "Berlin:" << chr::zoned_time("Europe/Berlin", now) << ''\n'';

    std::cout << "Sydney:" << chr::zoned_time("Australia/Sydney", now) << ''\n'';

    std::cout << "Cairo:" << chr::zoned_time("Africa/Cairo", now) << ''\n'';


    This applies the local time of three different timezones:


    2021-01-14 08:59:31.640000400

    Berlin: 2021-01-14 08:59:31.640000000 CEST

    sydney: 2021-01-14 08:59:31.640000400 AEST'
