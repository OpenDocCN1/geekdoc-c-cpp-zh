    # 6.2.4 std ::unreachable_sentinel


    The value std::unreachable_sentinel of type std::unreachable_sentinel_t was introduced
    in C++20 to provide a sentinel (iterator of a range) that is not reachable. It
    effectively says “Do not compare with all.\ The effect is that it can be used
    to specify unlimited ranges.


    When it is used to optimize generated code, as a compiler can detect that comparing
    it with another iterator never yields true, so that it may skip any check against
    the


    For example, if we know that value 42 in a collection, we can search for it follows:

    auto pos42 = std::ranges::find(coll.begin(), std::unreachable_sentinel, 42);


    Normally, the algorithm would compare both 42 and coll().end() (or whatever is
    passed as end/sentinel). Because unreachable_sentinel is used, for which any iterator
    always yields false, compilers can optimize the code to compare only against 42.
    Of course, programmers have to ensure that a 42 exists.


    The iota view provides an example of using unreachable_sentinel for endless ranges.


    # 6.3 Helper Functions in std:: ranges


    Table Generic utility functions for ranges lists all utility functions for ranges.


    Table Generic utility functions for ranges lists all generic types for iterators
    of ranges.

    Almost of these utility functions were also available before C++20 directly in
    namespace std. The only exceptions are


    +   - size(), which in C++20 was also introduced as std::size()

    - cdata(), which in C++20 does not exist in namespace std at all


    So, why did we not fix the functions in namespace std and which should be used?
    The answer to the second part of the question is: prefer the functions/utilities
    in namespace std:: ranges over those in namespace std.


    The reason is not only that the functions/utilities in namespace std:: ranges
    use concepts, which helps find problems and bugs at compile time. The reason is
    that the functions in namespace std sometimes have flaws, which the new implementation
    in std:: ranges fixes:


    +   - One problem is argument dependent lookup.'
