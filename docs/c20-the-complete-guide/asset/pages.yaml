    # Local Dates and Times


    Again, we can iterate over with a specific time of day. However, this time we
    can convert each day to std::chrono::local_days


    ```

    auto tp(local_days{d} + 18h + 30min);

    ```


    The type std::chrono::local_days is a shortcut of time_point<local_t, days>. The
    pseudo clock std::chrono::local_t is used here, which means we have a local time
    point, a time point with no associated time zone (not UTC).


    The next statement combines the local point with the current time zone so that
    we get a time-zone specific point of time using std::chrono::zoned_time>.


    ```

    chr::zoned_time{chr::current_zone(), tp}; // local time

    ```


    The difference between time points and time zones is subtle:


    +   - A point may be associated with a defined epoch so that it defines a unique
    point in time. However, it might also be associated with an undefined or pseudo
    epoch, for which the meaning is not clear.

    - A zone is associated with a time zone so that the epoch finally has a defined
    meaning and always represents a unique point in time.


    The default output operators demonstrate the different types:


    ```

    auto tpLocal{local_days{d} + 18h + 30min);

    std::chrono::cout << "point: " << tpLocal << ''\\n'';

    ```


    ```

    chr::zoned_time timeLocal{chr::current_zone(), tpLocal}; // apply to local timezone

    ```'
