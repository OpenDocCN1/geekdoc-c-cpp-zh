  md: '# Stop Callbacks in Detail


    The type of stop callback, stop_callback is a class template with a very limited
    API. Effectively, it only provides a constructor to register a callable for a
    stop token and a destructor that unregisters the callable. Copying and moving
    is deleted and no other function is provided.


    The template parameter is the type of the callback and is usually deduced when
    the constructor is initialized:


    ```

    auto func = [] { ... };

    ```


    ```

    std::stop_callback cb(myToken, func); // deduces stop_callback<decltype(func)>

    ```


    The type has a member callback_type to deal with the type of the callback.

    The constructors accept both lvalues (objects with a name) and rvalues (temporaries
    or objects marked with std::move()):


    ```

    auto func = [] { ... };

    ```


    ```

    std::stop_callback cb1(myToken, func); // copies func

    std::stop_callback cb2(myToken, std::move(func)); // moves func

    std::stop_callback cb3(myToken, { ... }}); // moves the lambda

    ```


    # 16.2 Constraints and Guarantees of Stop Tokens


    The implemented mechanism is pretty robust regarding a couple of scenarios as
    they might occur in asynchronous contexts, but you cannot do everything.


    The C++20 standard library guarantees the following:


    +   - All request_stop(), stop_requested(), and stop_possible() calls are synchronized.

    - The callback registration is guaranteed to be performed atomically. If there
    is a concurrent call to request_stop() from another thread, then the current thread
    will see the request to stop and immediately invoke the callback on the current
    thread or the other thread will see the registration and will invoke the callback
    before returning from request_stop().

    - The callable of a stop_callback is guaranteed not to be called after the destructor
    of the stop_callback returns.

    - The destructor of a callback waits for its call to finish if it is just called
    by another thread (it does not wait for other callbacks to finish).


    However, note the following constraints:


    +   - A callback should not be invoked of its callable exits via an exception
    then std::terminate() is called.

    - Do not destroy a callback in its invocation. The destructor does not wait for
    the callback to finish.'
