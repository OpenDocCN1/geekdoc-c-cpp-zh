    \ for std::chrono\n    using namespace std::literals; // for h, m, y suffixes\n\
    ```\n\n> ^1 Many thanks to Howard Linnant, the author of this library, for his\
    \ incredible support in writing this chapter. He provided fast and elaborated\
    \ answers, several code examples, and even some particular wording (with permission\
    \ not marked as a quote to keep the chapter easy to read)."
