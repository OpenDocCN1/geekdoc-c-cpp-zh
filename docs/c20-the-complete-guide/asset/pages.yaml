  md: '# Code Simplifications


    I try explain all features with helpful examples. However, to concentrate on the
    key aspects to be taught, I might often skip details that should be part of the
    code.


    +   - Most of the time I use an ellipsis ("...") to signal additional code that
    is missing. Note that I do not use code here. If you see an ellipsis with code,
    code must have these three dots as a language feature (such as "typename...").\n-
    In header files I usually skip the preprocessor guards. All header files should
    have something like the:


    ```

    #ifndef MYFILE_HPP

    #define MYFILE_HPP

    ...

    #endif //MYFILE_HPP

    ```


    So, please beware and fix the code when using these header files in your projects.


    # The C++ Standards


    C++ has different versions defined by different C++ standards.

    The Original C++ standard was published in 1998 and was subsequently amended by
    a technical corrigendum in 2003, which provided minor corrections and clarifications
    to the original standard. "this old C++ standard" is known as C++98 or C++03.

    The world of "Modern C++" began with C++11 and was extended with C++14 and C++17.
    The international C++ standards committee now aims to issue a new standard every
    three years. Clearly, that leaves time for massive additions, but it brings changes
    to the broader community more quickly. The development of larger features, therefore,
    takes time and might cover multiple standards.

    C++20 is now the beginning of the "Even more Modern C++" evolution. Again, several
    ways to program will probably change. However, as compilers, need some time to
    provide the latest language features. At the time of writing this book, C++20
    is already partially supported by major compilers. However, as differ greatly
    in their support of new different language features. Some will compile or even
    all of the code in this book, while others may only be able to handle a significant
    subset. I expect that this problem will be resolved as programmers everywhere
    demand support from their vendors.


    # Example Code and Additional Information


    You can access all example programs and find more information about this book
    from its website, which has the following URL:


    ```

    http://www.cppstd20.com

    ```'
