    std::is_nothrow_convertible_v<std::string_view, std::string_view> // true

    ```


    # 18.6.3 Type Trait is_layout_compatible<T1, T2>


    std::is_layout_compatible<T1, T2>::value

    yields whether T1 and T2 are layout compatible so that you can safely convert
    pointers to them with reinterpret_cast.


    # 18.6.4 Type Trait is_layout_pointer_interconvertible_base_of


    std::is_layout_pointer_interconvertible_base_of<Base, Der>::value

    yields true if a pointer Der can safely be converted to a pointer to its base
    type Base with reinterpret_cast.

    If both are the same types it yields true.


