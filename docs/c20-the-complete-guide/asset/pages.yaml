  md: "# Chapter 13: Formatted Output\n\nIf your formatter only yields string literals,\
    \ you can derive n the same way from the formatter for type std::string_view.\
    \ This is especially useful to implement a formatter for enumeration values:\n\
    \n```\nenum class Color { red, green, blue };\n```\n\n```\ntemplate<\nstruct std::formatter<Color>\
    \ : std::formatter<std::string_view> {\n    auto format(Color c, format_context&\
    \ ctx) const {\n        switch (c) {\n            case Color::red:\n         \
    \       return std::formatter<std::string_view>::format(\"red\", ctx);\n     \
    \       case Color::green:\n                return std::formatter<std::string_view>::format(\"\
    green\", ctx);\n            case Color::blue:\n                return std::formatter<std::string_view>::format(\"\
    blue\", ctx);\n        }\n        return std::formatter<std::string_view>::format(\"\
    <other Color>\", ctx);\n    }\n};\n```\n\nAlternatively, you could implement the\
    \ body of this format() member as follows:\n\n```\nstd::string_view name = \"\
    other Color\";\nswitch (c) {\n    case Color::red:\n        name = \"red\"\n \
    \       break;\n    case Color::green:\n        name = \"green\"\n        break;\n\
    \    case Color::blue:\n        name = \"blue\"\n        break;\n}\nreturn formatter<string_view>::format(name,\
    \ ctx);\n```\n\nYou can use this formatter as follows: \n\n```\nstd::cout << std::format(\"\
    {{} is {}\\n\", 42, color::red); // prints 42 is red\n```\n\nIf you have more\
    \ complicated strings, you can always create a std::string and use the formatter\
    \ for strings.\n\nAgain note that it is currently not clear which member function\
    \ of a formatter should be const (see wg21.link/lwg3636 for details). However,\
    \ if you declare your format() function as const you cannot call a standard format()\
    \ function that is not declared const. So, for the moment you might better not\
    \ use const."
