    # 18.4 New Utility Functions


    # 18.4.1 ssize()


    Pretty often we need the size of a collection or array as a signed value. For
    example, to avoid a warning:


    ```

    for (int i = 0; i < coll.size(); ++coll) { // possible warning

    }

    ```


    The problem is that size() yields an unsigned value and comparisons between signed
    and unsigned value might fail with pretty high values.


    While you can declare as unsigned int or std::size, there might be a good reason
    to use it as int. A helper function then allows the following instead:


    ```

    for (int i = 0; i < std::size(coll); ++coll) { // usually no warning

    }

    ```


    Thanks to ADL, it is enough to write the following when a standard container or
    other standard types are used:


    ```

    for (int i = 0; i < ssize(coll); ++coll) // OK for std types

    }

    ```


    Note that this is sometimes necessary to avoid compile-time errors. An example
    is the initialization of latches, barriers, and semaphores. Also note the library
    provides ssize() in namespace std::ranges.


    # 18.5 std::source_location


    Sometimes it is important to let the program deal with the location of the source
    code that is currently processed. This is especially useful for logging, testing,
    and checking of invariants. So far, programmers had to use the C preprocessor
    macros __FILE__, __LINE__, and __func__. C++20 introduces a type feature for that
    one can be initialized with the current source location and this information can
    be passed around just any other object.


    The use is simple:


    ```

    #include <source_location>

    ```


    ```

    void foo()

    ```'
