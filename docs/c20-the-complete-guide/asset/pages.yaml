    # 5.1.3 Views


    To deal with ranges, C++20 also introduces views. Views are lightweight ranges
    that


    +   * can refer to ranges and subranges

    * can iterate over elements of range by filtering some elements or performing
    transformations of their values

    * can represent a sequence of values themselves


    For example, you can use a view to iterate over the first 5 elements of a range:


    ```

    for (const auto& elem : std::views::take(coll, 5)) {

    }

    ```


    Here


    ```

    std::views::take(coll, 5)

    ```


    we pass a view to coll that ends with its sixth (or the last element if there
    are fewer elements). The view provides the usual API of range to begin(), end(),
    and operator ++ can be used to iterate over the elements and operator * and -
    can be used to deal with the values.

    Such a view could be sort only to the first 5 elements:


    ```

    std::ranges::sort(std::views::take(coll, 5)); // sort the first 5 elements of
    coll

    ```


    Views can also generate a sequence of values themselves. For example, the iota
    view, can iterator iterate over all values from 1 to 10 as follows:


    ```

    for (int val : std::views::iota(1, 11)) { // iterate from 1 to 10

    }

    ```


    Internally, adapters use view types as std::ranges::take_view or std::ranges::iota_view,
    which you could also use directly. However, the adapters should be preferred because
    they are often smarter'
