    \ tools. Nevertheless, as you saw I give advice to use special extensions for\
    \ module interfaces, which we discuss later in detail.\n\n# 19.2 Modules with\
    \ Multiple Files\n\nThe purpose of modules is to deal with code of significant\
    \ size distributed over multiple files. In the future, modules will be used to\
    \ wrap code of small, medium-size, and large components consisting of 2, 10, or\
    \ even 100 files. These files might be provided and maintained by multiple programmers\
    \ and teams.\n\nTo demonstrate the scalability of this approach and its benefits,\
    \ let us now know how multiple files can be used to define a module that can be\
    \ exported/imported by other code. The code size of the example is still small\
