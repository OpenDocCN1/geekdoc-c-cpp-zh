  md: '# Chapter 14: Dates and Time Zones for <chrono>


    +   - Then, we use operator / to combine std::chrono::year with an integral value,
    which creates an object of type std::chrono::year_month.

    Because the first operator / it is clear that the second operand must be a month.
    You cannot specify a day there.

    - Finally, we use operator / again to combine std::chrono::year_month object with
    an integral value to create a std::chrono::year_month_day.

    Because the after operator yields the right type, we could also declare first
    with auto. Without the namespace declarations we could and have to write:


    ```

    auto first = std::chrono::year(2021) / 1 / 5;

    ```


    With the chrono literals, we could simple write:

    auto first = 2021/1/5;


    # Other Ways to Initialize Date Types


    There are other ways to initialize a date type like year_month_day:

    auto d1 = std::chrono::year{2021}/1/31; // January 31, 2021

    auto d2 = std::chrono::month{1}/31/2021; // January 31, 2021

    auto d3 = std::chrono::day{31}/1/2021; // January 31, 2021


    That is, the type of the first argument for operator / specifies how interpret
    the other ones.

    With the chrono literals, we could simple:

    using namespace std::literals;

    auto d4 = 2021/1/31; // January 31, 2021

    auto d5 = 31d/1/2021; // January 31, 2021


    There is no standard suffix for month, but we have predefined standard objects:

    auto d6 = std::chrono::January / 31 / 2021;


    With the using declaration we could even write the following:

    using namespace std::chrono;

    auto d6 = January/31/2021; // January 31, 2021

    in all cases we initialize an object of type std::chrono::year_month_day.


    # New Duration Types


    In our example, we call a loop to iterate over all the months of the year:

    for (auto d = first; d.year() == first.year(); d += months{1}) {

    }


    The type std::chrono::year_month is a new type representing a month. You can use
    it for allrical types to deal with the specific month of a date such as adding
    one month here:

    std::chrono::year_month_day d = ...;

    d += months{1}; // add one month'
