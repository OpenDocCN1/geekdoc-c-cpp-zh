    # 3.6 Semantic Constraints


    Concepts might check both syntactic and semantic constraints:


    +   - Syntactic constraints mean that we can check at compile-time whether certain
    requirements are satisfied ("Is a specific operation supported?” or "Does a specific
    operation yield a specific type?").

    - Semantic constraints mean that certain requirements are satisfied, which can
    only be checked at runtime ("Does operation have the same effect?” or "Does the
    same operation performed for a specific value always yield the same result?").


    A simple example of a semantic constraint is the difference between the concepts
    std::invocable and std::regular_invocable. The latter guarantees not to modify
    the state of the passed argument and the passed arguments. We cannot check with
    a compiler, so the difference document the intention of the specified API. Often,
    for simplicity, std::::invocable is used.'
