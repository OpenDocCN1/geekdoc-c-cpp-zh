    std::ranges::view<Rg>

    - guarantees that Rg is a `view` (a range that is cheap to copy, assign, and destroy).

    A view has the following requirements:¹

    - It has to be `range` (support to iterate over the elements)

    - It has to be `movable`.


    Move constructor/assignment, copy constructor/assignment (if available), and destructor
    to have constant complexity (the time they take do not depend on the number of
    elements).

    All but the last requirements are covered by corresponding concepts. The last
    has to be guaranteed by the implementer of a type by deriving publicly from `std::ranges::view_interface`
    or from `std::ranges::view_base` or by specializing `std::ranges::enable_view<Rg>`
    to yield true.


