    # 18.8 Utilities to Deal with Bits


    C++20 provides better and cleaner setup for dealing with bits:


    +   * Missing low-level bit operations

    * Bit casts

    * Checks for the endianness of a platform

    All of these utilities are defined in <bit>.


    # 18.8.1 Bit Operations


    Hardware usually has special support for bit operations such as "rotate left"
    or "rotate right." However, before C++20, C++ programmers did not have direct
    access to these instructions. The newly introduced bit operations provide a direct
    API to the bit instructions of the underlying CPU.


    Table Operations lists all standardized bit operations C++20 introduced. They
    are provided in header file <bit> as free-standing functions in namespace std.


    | Operation | Meaning |

    |---|---|

    | rotl(val, n) | Yields val with $n$ bits rotated to the left |

    | rotr(val, n) | Yields val with $n$ bits rotated to the right |

    | count_zero(val) | Yields number of leading (most significant) 0 bits |

    | count_one(val) | Yields number of leading (most significant) 1 bits |

    | count_zero(val) | Yields number of trailing (least significant) 0 bits |

    | count_one(val) | Yields number of trailing (least significant) 0 bits |

    | popcount(val) | Yields number of 1 bits in the value |

    | has_single_bit(val) | Yields whether val is a power of 2 (one bit set) |

    | bit_floor(val) | Yields previous power-of-two value |

    | bit_ceil(val) | Yields next power-of-two value |

    | bit_width(val) | Yields number of bits necessary to store the value |


    Consider, for example, the following program:


    lib/bitops8.cpp


    ```

    #include <iostream>

    ```'
