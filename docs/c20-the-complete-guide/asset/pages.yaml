    \ defined\n;\n```\n\nThe effect is that both operators use their default implementation,\
    \ which compares objects by member. This means that the order of the members in\
    \ the class matters.\n\nThus,\n\nclass Value {\n\n```\n  auto operator<=>(const\
    \ Value& rhs) const = default;\n;\n```\n\nwe all need to be able to use six comparison\
