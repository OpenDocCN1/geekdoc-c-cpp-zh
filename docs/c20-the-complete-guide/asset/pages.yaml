  md: "For such span the member function size() always yields the size specified as\
    \ part of the type. The default constructor is not callable here (unless the extent\
    \ is 0).\n\nA span where the number of elements changes is a span with dynamic\
    \ extent. The number of elements depends on the sequence of elements the span\
    \ refers to and might change by the assignment operator. However, there is no\
    \ way to change the extent (number of elements).\nFor both cases, let us come\
    \ with a first example.\n\n# 8.1.2 Example Using a Span with Fixed Extent\n\n\
    Here is a first example, using a span with fixed extent:\n\n```\nlib/spanfix.cpp\n\
    #include <iostream>\n#include <string>\n#include <vector>\n#include <ranges>\n\
    #include <algorithm>\n#include <span>\n#include <cassert>\n\ntemplate<typename\
    \ T, std::size_t Sz>\nvoid printSpan(std::span<T, Sz> sp)\n{\n    for (const auto&\
    \ elem : sp) {\n        std::cout << \" \" << elem << \" \";\n    }\n    std::cout\
    \ << \"\\n\";\n}\n\nint main()\n{\n    std::vector<std::string> vec{\"New York\"\
    , \"Tokyo\", \"Rio\", \"Berlin\", \"Sydney\"};\n\n    // define view to first\
    \ 3 elements:\n    assert(vec.size() >= 3);\n    std::span<const std::string,\
    \ 3> sp3{vec.begin(), 3};\n    std::cout << \"first 3: \";\n    printSpan(sp3);\n\
    \n    // sort referenced elements:\n    std::ranges::sort(vec);\n    std::cout\
    \ << \"first 3 after sort(): \";\n    printSpan(sp3);\n}\n```"
