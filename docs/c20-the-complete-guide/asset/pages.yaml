  md: "However, be careful: overloading once using references and once not using references\
    \ might cause ambiguities.\n\nBy using concepts it is possible to prefer some\
    \ constraints over others. However, this requires that subsume other concepts\
    \ are used.\n\n# Type Constraints\n\nIf a constraint is a concept applied to a\
    \ single parameter, there are ways to shortcut the specification of the constraint.\
    \ If you can specify it directly as a type constraint when declaring the template\
    \ parameter:\n\n```\ntemplate<IsPointer T> // only for pointers\nauto maxValue(T\
    \ a, T b)\n{\n    return maxValue(*a, *b);\n} // compare values the pointers point\
    \ to\n```\n\nIn addition, you can use the concept as a type constraint when declaring\
    \ parameters with auto:\n\n```\nauto maxValue(IsPointer a, IsPointer auto b)\n\
    {\n    return maxValue(*a, *b);\n} // compare values the pointers point to\n```\n\
    \nThis also works for parameters passed by reference:\n\n```\nauto maxValue3(const\
    \ IsPointer auto& a, const IsPointer auto& b)\n{\n    return maxValue(*a, *b);\n\
    } // compare values the pointers point to\n```\n\nNote that by constraining parameters\
    \ directly, we changed the specification of the template: we no longer require\
    \ that a and b have the same type. We only require that both are pointer-like\
    \ objects of arbitrary type.\n\nWhen using the template syntax, it looks as follows:\n\
    \n```\ntemplate<IsPointer T1, IsPointer T2> // only for pointers\nauto maxValue(T1\
    \ a, T2 b)\n{\n    return maxValue(*a, *b);\n} // compare values the pointers\
    \ point to\n```\n\nWe should also allow different types for for the basic function\
    \ template comparing values. One way to do that is to specify two template parameters:\n\
    \n```\ntemplate<typename T1, typename T2>\nauto maxValue(T1 a, T2 b)\n{\n    return\
    \ b < a ? a : b;\n} // compare values\n```\n\nThe other option would be to also\
    \ use auto parameters:"
