    ```

    namespace chr = std::chrono;

    ```


    ```

    // initialize a utc_time<> with a leap second:

    chr::utc_time<chr::utc_clock::duration> tp;

    std::istringstream("2015-06-30 23:59:60")

    >> >> chr::parse(std::string("%F %T"), tp);


    // convert it to other clocks and print:

    auto tpUtc = chr::clock_cast<chr::utc_clock>(tp);

    std::cout << "utc_time: " << std::format("{%F %T", tpUtc) << ''\n'';

    auto tpSys = chr::clock_cast<chr::system_clock>(tp);

    std::cout << "sys_time: " << std::format("{%F %T", tpSys) << ''\n'';

    auto tpGps = chr::clock_cast<chr::gps_clock>(tp);

    std::cout << "gps_time: " << std::format("{%F %T", tpGps) << ''\n'';

    auto tpTai = chr::clock_cast<chr::tai_clock>(tp);

    std::cout << "tai_time: " << std::format("{%F %T", tpTai) << ''\n'';

    auto tpFile = chr::clock_cast<chr::file_clock>(tp);

    std::cout << "file_time: " << std::format("{%F %T", tpFile) << ''\n'';

    ```


    The program has the following output:

    utc_time: 2015-06-30 23:59:60.000000 UTC

    sys_time: 2015-06-30 23:59:59.999999 UTC

    gps_time: 2015-07-01 00:00:06.000000 GPS

    tai_time: 2015-07-01 00:00:00.000000 TAI

    file_time: 2015-06-30 23:59:59.999999 UTC


    Note that all of these clocks have pseudo pseudonyms formatted for output.


    +   Any conversion from a clock leap point adds the epoch. The time value remains
    the same.

    Conversion between UTC, GPS, and TAI timepoints add or subtract the necessary
    offsets.

    Conversion between UTC and system time do not change the time value except that
    for the time point of a UTC second the last time point ahead is used as system
    time.


    Conversions from local timepoints to others are also supported. However, for local
    timepoints you have to use to_local() (after converting to a system timepoint).

    Conversions to or from timepoints of the steady_clock are not supported.


    # Clock Conversions Internally


    Under the hood, clock_cast<> is a "two-hub spoke to convert and from system wheel."10
    The two hubs are system_clock and utc_clock. Every convertible clock has convert
    to and from one of these hubs (but not both).


    > 10 Thanks to Howard Hintant for printing out.'
