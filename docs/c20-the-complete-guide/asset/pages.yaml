    std::array a2(0, 8, 15);

    ```


    ```

    const std::span<int> sp1{a1}; // span/view is const

    std::span<const int> sp2{a2}; // elements are const

    ```


    ```

    sp1[0] = 42; // OK

    sp2[0] = 42; // ERROR

    ```


    ```

    sp1 = a2; // ERROR

    sp2 = a2; // OK

    ```


