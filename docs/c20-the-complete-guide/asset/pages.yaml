    # 6.1.3 Range Adapter common ()


    The range adapter std::views::common yields a view with harmonized types for the
    begin iterator

    and the sentinel (end iterator) for the passed range. It acts like the range std::views::all()
    with

    the additional behavior to create a std::ranges::common_view from the passed argument,
    if its iterators

    have different types.


    For example, we want to call a general algorithm algo() that requires the same
    type for both

    the begin and the end iterator. Then we can call it of may-different types as
    follows:


    ```

    template <typename TBeg, typename TEnd>

    void callAlgo(TBeg beg, TEnd end)

    {

    auto v = std::views::common(std::ranges::subrange(beg,end));

    algo(v.begin(), v.end()); // assume algo() requires iterators with the same type

    }

    ```


    common(rg) returns if it is already a view with the same begin and end iterator


    +   - A std::ranges::ref_view of rg if it is a range object with the same begin
    and end iterator

    - Otherwise, a std::ranges::ref_view of rg if it is a range object

    - Otherwise, a std::ranges::common_view of rg


    For example:


    ```

    std::list<int> lst;

    std::ranges::iota_view iv{1, 10};

    ```


    ```

    auto v1 = std::views::common(lst); // std::ranges::ref_view<decltype(lst)>

    auto v2 = std::views::common(iv);   // decltype(iv)

    auto v3 = std::views::common(std::views::all(vec));

    // std::ranges::ref_view<decltype(vec)>

    ```


    ```

    std::list<int> lst {1, 2, 3, 4, 5, 6, 7, 8, 9};

    auto v1 = std::views::take(lst, 5); // begin() and end() have different types

    auto v4 = std::views::common(common); // std::ranges::common_view<decltype(vt)>

    ```


    Note that both the constructors of a std::ranges::common_view and the helper type
    std::common::iterator

    require passed iterators have different types. So, you should use this adaptor
    if you do not know which

    iterator types differ.'
