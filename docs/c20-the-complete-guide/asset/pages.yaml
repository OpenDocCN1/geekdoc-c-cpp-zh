    # Using Subranges to Harmonize Array Types


    The type of subranges only depends on the type of iterators (whether or not size()
    is provided).

    is can be used to harmonize the type of arrays without losing any information.


    Consider the following example:


    ```

    int arr1[5] = {...};

    int arr2[10] = {...};

    std::array<int, 15> arr3 = {...};

    std::array<int, 20> arr4 = {...};

    ```


    Passing arr1 til arr4 to a subrange yields the same type. This can be useful to
    avoid multiple instanti-

    tions and code generations of generic code for raw arrays and std::array''s of
    the same element type but different size. If function templates are called and
    the calls are not optimized away, the function template is instantiated only once,
    when subranges are passed:'
