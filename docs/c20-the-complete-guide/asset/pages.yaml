  md: '# 280 Chapter 14: Dates and Time Zones for <chrono>


    +   * A time zone (introduced with C++20) allows us to deal with the fact that
    simultaneous events result in different times when time zones come into play.
    The local time of the meeting would be significant in Asia, but significant earlier
    if we meet at 18:30 UTC, in America.


    Thus, time zones give timepoints a (different) meaning by applying or converting
    it to a different local time.


    +   * A zoned time (introduced with C++20) is the combination of a timepoint with
    a time zone. It can be used to apply a local timepoint to a specific time zone
    (which might be the “current” time zone) or convert timepoints to different zones.


    A zoned time can be seen as a date and time object, the combination of an epoch
    (the origin of a point), a distance (from the origin), and time (to adjust the
    resulting). For all of these concepts and types C++20 adds for output (even formatted)
    and parsing. That way you can decide whether print date/time values in formats
    like:


    ```

    Nov/24/2011

    24.11.2011

    2011-11-24 16:30:00 UTC

    Thursday, November 11, 2011

    ```


