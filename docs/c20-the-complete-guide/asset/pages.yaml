  md: '# Chapter 4


    # Standard Concepts in Detail


    This chapter describes all *concepts* of the C++20 standard library in detail.


    # 4.1 Overview of all Standard Concepts


    Table *Basic Concepts for Types and Objects* lists the basic concepts for types
    and objects in general.


    Table *Concepts for Ranges, Iterators, and Algorithms* lists the concepts for
    ranges, iterators, and algorithms. to create views and the corresponding adaptors.


    Table *Auxiliary Concepts* lists the concepts that are mainly used a building
    blocks for other concepts and usually not directly used by application programmers.


    # 4.1.1 Header Files and Namespaces


    Almost all concepts are defined in header <concepts>, which is included by <ranges>
    and <iterator>. The only exceptions are


    +   * three_way_comparable_concepts, which are defined in <compare> (which is
    included by almost every other header file)


    +   * uniform_random_bit_generator, which is defined in <random>


    Almost all concepts are defined in namespace std. The only exception are the ranges
    concepts, which are defined in namespace std::ranges.'
