  md: '# # Chapter 5


    # ## Ranges and Views


    Since the first C++ standard, the way to deal with the elements of containers
    and other sequences always have been to use iterators for the position of the
    first element (*begin*) and the position behind the last element (*end*). Therefore,
    algorithms that operate on ranges usually take two parameters to process all elements
    of a container and provides functions like begin() and end() to process these
    parameters.


    C++20 provides a new way to deal with you can specify objects that as a whole
    represent a range (a sequence of elements) and pass these objects to algorithms
    to process all elements of the sequence as a whole.


    The change sounds pretty simple, but as you will see it has a lot of consequences.
    The way to deal algorithms changes dramatically for the caller and for the implementor.
    Therefore, C++20 provides several new features to deal with ranges:


    +   * New implementations of standard algorithms

    * Several helper function and new type utilities

    * Concepts that specifically deal with ranges

    * Special handling for views (lightweight ranges that are cheap to create and
    use)


    This chapter introduces the basic aspects and features of ranges and views. The
    following chapters discuss details.


    # ## 5.1 A Tour of Ranges by Example


    We understand ranges by looking at a few examples using them.


    # ### 5.1.1 Passing Containers to Algorithms as Ranges


    Since C++98, we are used to iterate over half-open ranges when dealing with collections
    of elements. By passing the begin and end of a range (often coming from the begin()
    and end() member functions of a container), you could specify which elements have
    to be processed:


    ```

    #include <vector>

    #include <algorithm>

    ```'
