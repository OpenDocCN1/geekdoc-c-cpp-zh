  md: '# 13.1.4 Using std::formatted_size ()


    To know how many characters will be written (without writing any), you can use
    std::formatted_size().

    For example:


    ```

    auto sz = std::formatted_size("String ''{}'' has chars\n", str, str.size());

    ```


    That way, you could reserve or check ahead for enough memory.


    # 13.2 Formatted Output in Detail


    This section describes the syntax of formatting in detail.


    # 13.2.1 General Format of Format Strings


    The general way to specify the formatting of arguments is to pass a format string
    that can have replacement fields specified by {...} and All other characters are
    printed as they are. To print the characters {}, and use {{}} and {}.

    For example:


    The replacement fields may have an index to specify the argument and a format
    specifier after a colon:


    +   {}

    use the next argument with its default formatting

    {n}

    use the n-th argument (first argument has index 0) with its default formatting

    {:fmt}

    use the next argument formatted according to fmt

    {n:fmt}

    use the n-th argument formatted according to fmt


    You can have either one of the arguments specified by an index, or all of them:


    ```

    std::format("{}: {}", key, value); // OK

    std::format("{1}: {0}", value, key); // OK

    std::format("{}: {} or {0}", value, key); // ERROR

    ```


    Additional arguments are ignored.

    The syntax of the format specifier depends on the type of the passed argument.


    +   * For arithmetic types, strings, and raw pointers, there is a standard format
    defined.

    * C++20 specifies also a standard format for chrono types (durations, time points,
    and calendrical types).'
