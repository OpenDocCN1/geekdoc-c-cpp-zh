  md: '# Chapter 15


    # Coroutines


    This chapter introduces coroutines.

    outines (invented in 1958 by Mel Conway) are functions that you can suspend.

    c++20 provides first basic support for coroutines by introducing some language
    features and data types to deal with them. However, some glue code has to be written
    to be able to deal with coroutines, which makes using coroutines very flexible
    but also requires some effort even in simple cases. The plan is to provide standard
    types and functions to deal with coroutines later with C++23 in the C++ standard
    library.


    # 15.1 What Are Coroutines?


    While ordinary functions (or procedures) are called and then run from the end
    or until a return statement is reached, coroutines can run in multiple steps.
    At certain moments you can suspend a coroutine which means that the function pauses
    its computation until it gets resumed. You might suspend it because the function
    has to wait for something, there are other (more important things to do), or you
    have an intermediate result to yield to the caller.


    This behavior is it bit like having multiple function calls. However, the key
    benefit is that a coroutine keeps its state when it gets suspended to when it
    gets resumed.


    Note that this concept is introduced from the question when to coroutine and a
    function calling it. This is not an asynchronous event mechanism and do not necessarily
    need multi-threading. It is an orthogonal feature however might make sense with
    the other features.


    Figure XXX demonstrates the basic API when dealing with coroutines:


    +   1. A function might call a coroutine and wait until it gets suspended for
    the first time.

    2. The coroutine might perform some initial code to finish up the setup or to
    starting some computation and then suspend for the first time.

    3. The caller gets a coroutine interface object to deal with running the coroutine.

    With this object the caller gets a flexible interface to resume a suspended coroutine,
    to deal with intermediate or final values, and to handle special situations such
    as exceptions. The generator might just provide a function resume() to resume
    the coroutine or it might provide an iterator-based interface,'
