  md: '# R


    resource acquisition is initialization (RAII)

    a programming pattern to delete clean-ups necessary for the end of using a resource
    to a destructor, so that they happen automatically when the object representing
    the resource leaves its scope or ends its lifetime.


    # regular type


    A type that matches built-in type (such as int) semantics. Based on http://steppanovpapers.com/DeSt98.pdf
    it offers basic operations


    +   - Default constructor (T x);

    - Copying (T y = x); and in C++ moving

    - Assignment (x = y); and in C++ move assignment

    - Equality and inequality (x == y and x != y)

    - Ordering (x < y etc.)

    with the "usual" rules:

    - If an object is a copy of the other objects are equal.

    - A copy of an object is equal to an object created with the default constructor
    and where the source value was assigned to.

    - Objects have semantics. If two objects are equal and we modify one of them they
    are no longer equal.

    If only the comparators missing the type is called semiregular.


    # rvalue


    A value category of expressions that are not lvalues. An rvalue can be a prvalue
    (such as a temporary object without name) or an xvalue (e.g., an lvalue marked
    with std::move()). What was called an rvalue1 before C++11 is called a prvalue
    since C++11.


    # S


    # semiregular type


    - If an object is a copy of the other objects have the same value

    - A copy of an object has the same value as an object created with the default
    constructor and where the source value was assigned to

    - Objects have semantics. If two objects have the same value and we modify one
    of them they no longer have the same value.


    # substitution failure is not an error (SFINAE)


    A mechanism that silently discards templates instead of triggering compilation
    errors when arguments to template parameters make their declarations ill-formed.
    You can use the mechanism to disable templates for certain arguments by forcing
    ill-formed declarations then.'
