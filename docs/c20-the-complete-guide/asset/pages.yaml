  md: "# 10.6 Other constexpr Extensions\n\nBesides the ability to use heap memory\
    \ at compile time, compile-time functions (whether declared as constexpr or consteval),\
    \ can use a couple of additional language features since C++20. As a consequence\
    \ and in addition, a couple of library features can now be used at compile time.\n\
    \n# 10.6.1 constexpr Language Extensions\n\nSince C++20, the following language\
    \ features are possible to be used in compile.time functions (whether declared\
    \ with constexpr or consteval):\n\n+   - You now use heap memory at compile time.\n\
    - Runtime polymorphism is supported:\n  - You can now use virtual functions.\n\
    \  - You can now use dynamic_cast.\n  - You can now use typeid.\n- You can have\
    \ try-catch blocks (but you are still not allowed to throw).\n- You can now change\
    \ the active member of a union.\n\nNote that you are not allowed to use static\
    \ in constexpr or consteval functions.\n\n# 10.6.2 constexpr Library Extensions\n\
    \n# constexpr Algorithms and Utilities\n\nMost algorithms in <algorithm>, <numeric>,\
    \ and <utility> are constexprnow. That means that you can sort and accumulate\
    \ elements now at compile time (see the example using vectors at compile time).\n\
    \nHowever, note that parallel algorithms (algorithms that have an execution policy\
    \ parameter) can still be used at runtime.\n\n# constexpr Library Types\n\nTypes\
    \ of the C++ standard library now have better support for constexpr so that objects\
    \ can be used (better) at compile time:\n\n+   - Vectors and strings can be used\
    \ at compile time.\n- A couple of std::complex<> operations become constexpr.\n\
    - A couple of missing constexpr in std::optional<> and std::variant<> were added.\n\
    - constexpr was deead to std::invoke(), std::ref(), std::cref(), std::bind(),\
    \ std::bind_front(), mem_fn(), not_fn().\n- In pointer_traits, pointer_to() for\
    \ raw pointers can now be used at compile time."
