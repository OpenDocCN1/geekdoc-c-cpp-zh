  md: '# Chapter 17


    # Concurrency Features


    After introducing std::jthread and stop tokens in the previous chapter, this chapter
    documents all other concurrency features C++20 introduced:


    +   - Latches and barriers

    - Counting and binary semaphores

    - Various extensions for atomic types


    # 17.1 Thread Synchronization with Latches and Barriers


    Two new types provide new mechanisms to synchronize asynchronous computation/processing
    of multiple threads:


    +   - Latches allow you to have a one-time synchronization where threads can wait
    for multiple tasks to finish.

    - Barriers allow you to have a repeated synchronization of multiple threads when
    you have to react when all have done their current/next processing.


    # 17.1.1 Latches


    A latch is a new synchronization mechanism for concurrent execution that support
    a single-use asynchronous countdown. Starting with an initial value various threads
    can atomically count this value down to zero. The moment counter reaches zero,
    all threads waiting for this countdown continue.


    Consider the following example:


    lib/latch.cpp


    ```

    #include <iostream>

    #include <array>

    #include <thread>

    #include <latch>

    using namespace std::literals; // for duration literals

    ```'
