  md: "Visual C++ requires specific command-line extensions and prefers a different\
    \ file extension .ixx than\nthe I propose. For this reason:\n\n+   - Compile an\
    \ interface file file.cpp as follows:\n  cl /c /interface /Tp file.cpp\n\nThe\
    \ option /Tp specifies that the following file is C++ code. The option /interface\
    \ specifies that all\nfollowing files are interface (having both interface and\
    \ non-interface files on one command-line\nmight not work).\n\nIf you use the\
    \ file extension .ixx instead the compiler recognizes the file automatically as\
    \ interface\nfile.\n\n+   - Compile an internal partition file.cpp as follows:\n\
    \  cl /c /internalPartition /Tp file.cpp\n\nThe option /Tp specifies that the\
    \ following file is C++ code. The option /internalPartition\nspecifies that all\
    \ files are internal partitions.\n\n+   - gcc/g++:\nGCC does not require any special\
    \ file extension or command-line option at all. So, by using special\nfile extensions,\
    \ we have to specify that the files contain C++ code using the command-line option\
    \ -xc++\n\n+   - Compile an interface file file.cpp as follows:\n  g++ -c -xc++\
    \ file.cpp\n\n+   - Compile an internal partition file file.cpp as follows:\n\
    \  g++ -c -xc++ file.cpp\n\n+   - Clang:\nClang currently only supports interface\
