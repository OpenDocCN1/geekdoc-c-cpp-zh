  md: "# 19.2.1 Module Units\n\nIn general modules consist of multiple module units.\
    \ Module units are translation units that belong to a module.\n\nAll units have\
    \ to be compiled in some way. Even if they contain only declarations, which would\
    \ have been placed in header files in traditional code, some kind of pre-compilation\
    \ is necessary. The files are transferred into an internal binary format, which\
    \ can be used to avoid that you have to compile the same code again and again.\n\
    \nHowever we have different ways to split a module into multiple files:\n\n+ \
    \  - Module implementation units allow programmers to provide just code that is\
    \ compiled in the traditional object files.\n- Internal partitions allow programmers\
    \ to provide declarations and definitions that are only visible inside a module.\
    \ However, even when declared, they are pre-compiled to avoid multiple compilations.\n\
    - Interface partitions allow programmers to split the exported module API even\
    \ in multiple files.\nThe next section introduces these different module units\
    \ by example.\n\n# 19.2.2 A Module with Multiple Implementation Units\n\nThe first\
    \ example of a module that is provided by multiple files uses only module files\
    \ to define/implement types and functions.\n\n# A Primary Module Interface with\
    \ a Global Module Fragment\n\nFirst, again we have the primary module interface\
    \ unit that defines what we export:\n\n```\nmodule; // start module unit with\
    \ global module fragment\n\nlang/mod1.cpp\n\n#include <string>\n#include <vector>\n\
    \nexport module Mod1; // module declaration\n\nstruct Order {\n    int count;\n\
    \    std::string name;\n    double price;\n};\n\nOrder(int c, std::string n, double\
    \ p)\n    : count{c}, name{n}, price{p} {\n}\nn\nexport class Customer {\n```"
