  md: "# 14.6 Using the Chrono Extensions in Practice\n\n+   A year_month_weekday\
    \ is only valid if the weekday can exist in the specified month of a year. For\
    \ example:\n\n```\n2020y/1/Thursday [5];    // valid (there is a fifth Thursday\
    \ in January 2020)\n2020y/1/Sunday [5];      // invalid (there is no fifth Sunday\
    \ in January 2020)\n```\n\nEach calendar type provides a member function ok()\
    \ to check whether the value is valid. Default output operators signal invalid\
    \ dates.\nThe way to handle dates depends on your programming logic. For the typical\
    \ scenario where you have created a day too high for a month, you have the following\
    \ options:\n\n+   Round down to the last day of the month:\n\n```\nauto ymd =\
    \ std::chrono::year{2021}/1/31;\nymd -= std::chrono::months{1};\nif (!ymd.ok())\
    \ {\n    ymd = ymd.year()/ymd.month()/std::chrono::last;      // February 28,\
    \ 2021\n}\n```\n\nNote that the expression creates a year_month_last which is\
    \ converted to the year_month_day.\n\n+   Round up to the first day of the next\
    \ month:\n\n```\nauto ymd = std::chrono::year{2021}/1/31;\nymd += std::chrono::months{1};\n\
    if (!ymd.ok()) {\n    ymd = ymd.year()/ymd.month()/1 + std::chrono::months{1};\
    \      // March 1, 2021\n}\n```\n\nDo not add 1 to the date for December because\
