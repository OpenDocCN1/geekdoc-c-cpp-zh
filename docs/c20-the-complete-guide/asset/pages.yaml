  md: "# Chapter 18\n\n# Other C++ Standard Library Improvements\n\nThis chapter presents\
    \ several other small features and extensions C++20 introduces in its standard\
    \ library.\n\n# 18.1 Updates for String Types\n\nIn C++20 some aspects of string\
    \ types changed. These changes affect strings (type std::basic_string< with its\
    \ instantiations such as std::string), string views (std::basic_string_view<>\
    \ with its instantiations such as std::string_view), or both.\n\nIn fact, C++20\
    \ introduces the following improvements for string types:\n\n+   * All strings\
    \ now support the spaceship <>. For this, they now declare only operator== and\
    \ operator<=> and no longer declare operator!=, operator<, operator>, and operator>=.\n\
    * All string types now provide the new member functions starts() and end_with().\n\
    * For strings, the member function reverse() can no longer be used to request\
    \ or shrink the capacity (memory allocated for value) of strings. For this reason,\
    \ you no longer pass argument to reserve().\n* For UTF-8, C++ provides new string\
    \ types std::u8string and std::u8_view. They are defined as std::basic_string<>\
    \ and std::basic_string_view<> for the new UTF-8 type char8_t. This means library\
    \ functions returning UTF-8 now have the return type std::u8string. This change\
    \ might break existing code when switching to C++20.\n* Strings (std::string and\
    \ other instantiations of std::basic_string<>) are constexpr now that you can\
    \ use strings at compile time.\n  Note that you cannot use a std::string at both\
    \ compile time and runtime. However, there are ways to export a compile-time string\
    \ to the runtime.\n* String views are now marked as views and borrowed ranges."
