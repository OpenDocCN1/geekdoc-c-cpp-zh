  md: "# Chapter 9\nNon-Type Template Parameter (NTTP)\nExtensions\n\nC++20 supports\
    \ additional types as *non-type template parameter (NTTP).* Floating-point values,\
    \ objects of some data structures and simple classes, and even lambdas can be\
    \ passed as template arguments now. This chapter describes these types and useful\
    \ applications of this feature.\n\n# 9.1 New Types for Non-Type Template Parameters\n\
    \nSince C++20 you can use new types for non-type template parameters:\n\n+   -\
    \ Floating-point types (such as double)\n- Structures and simple classes (such\
    \ as std::pair<>), which indirectly also allows us to use string literals as template\
    \ parameters\n- Lambdas\n\n# 9.1.1 double Values as Non-Type Template Parameters\n\
    \nConsider the following:\nlang/ntttpdouble.cpp\n\n```\n#include <iostream>\n\
    #include <cmath>\n\ntemplate<double> Vat\nint addTax(int value)\n{\n    return\
    \ static_cast<int>(std::round(value * (1 + Vat)));\n}\n```"
