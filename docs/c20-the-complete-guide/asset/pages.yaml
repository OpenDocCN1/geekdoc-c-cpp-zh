  md: '# Chapter 8


    # Spans


    With C++20, a couple of types were introduced to refer to sequences of elements
    without allocating memory for them. The std::span<> class template is one of them.
    By requiring that the elements are stored in contiguous fixed memory, the class
    provides the best performance for subsequences.


    Objects of type std::span refer to external sequences of elements All elements
    have to be stored one after another in contiguous memory. You can read-only or
    write access. And you can choose between a specified number of elements or leave
    the number of elements until it is clear which elements the span refers to.


    A span is in fact just as raw pointer to a sequence of elements combined with
    a size for the number of elements. That allows us to deal with the elements like
    with an array. However, special rules apply to its reference semantics (especially
    regarding correctness)


    Using a span is cheap and fast (you should always pass it by value). However,
    it is also potentially dangerous because, in the same way as raw pointers, it
    is to the programmer to ensure that the referred element sequence is still valid
    when using a span. In addition, the fact that a span supports write access can
    introduce situations where correctness is broken (or at least does not work the
    way you might expect).


    # 8.1 Using Spans


    Let us look at some first examples of using spans. However, first we have to discuss
    how the number of elements in a span can be specified.


    # 8.1.1 Fixed and Dynamic Extent


    When you declare a span, you can choose between a specified number of elements
    or leave the number of elements open until it is clear which elements the span
    refers to.


    A span with a fixed number of elements is called a span with fixed extent. It
    is declared with the element type and size (like a std::array).


    ```

    std::span<int, 5> // type of a span with fixed extent of 5 elements

    ```'
