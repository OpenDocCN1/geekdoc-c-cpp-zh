  md: '# 5.2 Using Views


    ```

    *** coll | filter | transform:

    filter 8

    filter 15

    trans 15

    => -15

    filter 7

    filter 0

    trans 0

    => 0

    filter 9

    trans 9

    => -9

    ```


    We call filter() for each element, and for the elements that were not filtered
    we call transform(). That is probably what everybody would expect.


    However, there is one thing that is remarkable. The whole processing does not
    happen when we define the view. It happens after the first statement when we use
    the view. That is, we use lazy evaluation. A view is just the description of a
    processing. The processing is performed by element when we ask for the next value
    result.


    That has a benefit: we do not start with the processing of elements we never need.
    For example, consider the view we use to find::the first result value that is
    0:


    ```

    std::ranges::find(vColl, 0);

    ```


    The output would be then:


    ```

    filter 8

    filter 15

    trans 15

    filter 7

    filter 0

    trans 0

    ```


    Pipelines of views use a pull model. Whenever a consumer asks for the next value
    of a view, it gets processed using all adapters. This is one reason why pipelines
    work with initial ranges and views yielding an infinite number of elements: we
    do not compute an unlimited number of values not knowing how many are used; we
    consider as many values as requested.


