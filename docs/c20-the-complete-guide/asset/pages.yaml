    # Barriers in Detail


    Class std::barrier is declared in header file <barrier>. Table Operations of Objects
    of Class barrier lists the API of std: std::barrier.


    | Operation | Effect |

    | barrier{num} | Creates a barrier for num asynchronous tasks |

    | barrier{num, cb} | Marks num as asynchronous tasks and cb as callback |

    | b.arrive() | Marks one as done and yields an arrival token |

    | b.arrive(val) | Marks val as done and yields an arrival token |

    | b.wait(arrivalToken) | Blocks until all tasks are done and the callback was
    called (if any) |

    | b.arrive_and_wait() | Marks one as done and blocks until all tasks are done
    and the callback was called (if any) |

    | b.arrive_and_drop() | Marks one as done and decrements the number of tasks to
    repeatedly perform |

    | max() | Static function that yields the maximum possible value for num |


    Table 17.2. Operations of Objects of Class barrier


    std::barrier<> is a class template with the type of the callback as the template
    parameter. Usually the type is deduced by class template argument deduction:


    ```

    void callback() noexcept; // forward declaration

    ```


    ```

    std::barrier b{6, callback}; // deduces std::barrier<decltype(callback)>

    ```


    Note that the C++ standard requires that callbacks for barriers guarantees not
    to throw. Therefore, to be portable, you must declare the function or lambda with
    noexcept. If no callback is passed, an implementation-specific type is used representing
    an operation that has no effects.


    The call


    +   - 1.arrive_and_wait();


    is equivalent to


    +   - 1.wait(1.arrive());'
