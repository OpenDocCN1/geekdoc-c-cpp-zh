  md: "# 28 Chapter 3: Concepts and Requirements\n\nInstead of using the type trait\
    \ for raw pointers, the concept formulates a simple requirement: The expression\n\
    *p has to be valid for an object p of the passed type T.\n\nHere, we are using\
    \ the requires again to introduce a requires expression, which can define\none\
    \ or more requirements for types and parameters. By declaring a p of type T, we\
    \ can simply specify\noperations for such an object have to be supported.\n\n\
    We can also require multiple operations, type members, and that expressions yield\
    \ types.\nexample:\n\n```\ntemplate<typename T>\nconcept IsPointer requires(T\
    \ p) {\n    // operator * has to be valid\n    { p < p } -> std::convertible_to<bool>;\
    \ // yields bool\n    p == nullptr; // can compare with nullptr\n};\n```\n\nNow\
    \ we specify three requirements, which all apply to a parameter p of type T we\
    \ define this concept\n\n+   * The type has to support operator *\n* The type\
    \ has to support operator <, which has to yield a Boolean value.\n* Objects of\
    \ that type have to be comparable with nullptr.\n\nNote that we do not need two\
    \ parameters of type T to check whether < can be called. The runtime value\ndoes\
    \ not matter. However, note that there are some restrictions to specify how an\
    \ expression yields\n(e.g. you cannot use just bool before).\n\nAlso note that\
    \ we do not require p to be the nullptr here (that we can only check at runtime).\n\
    We require only that we can compare p with the nullptr. However, that rules iterators,\
    \ because\ngeneral they cannot be compared with nullptr (except they are implemented\
    \ as raw pointers as\nstd::array<S>).\n\nAgain, this is a compile-constraint that\
    \ has no impact on the generated code; we decide whether\nand which types the\
    \ code compiles. it does not matter that we declare parameter as a value\ninstead\
    \ of a reference.\n\nYou could also use the requires expression as an ad-hoc constraint\
    \ directly in the requires clause (which\nlooks a bit funny but makes total sense\
    \ once you understand the difference of a requires clause and a requirements\n\
