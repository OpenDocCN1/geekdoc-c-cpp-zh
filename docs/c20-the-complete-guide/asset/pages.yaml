  md: "# Chapter 8: Spans\n\n* Never initialize a span with a (returned) temporary\
    \ value, because the span would refer to an object that is destroyed after the\
    \ assignment:\n\n```\nstd::span<int, 3> sp3a = std::array{1, 2, 3}; // fatal ERROR\n\
    std::span<int, 3> sp3b = returnArray(); // fatal ERROR\n```\n\n* By specifying\
    \ that the elements are const std::string; we cannot modify them by the span.\
    \ Note that declaring the span as const does not provide read-only access to the\
    \ references elements:\n\n```\nstd::span<const std::string, 3> sp3(vec.begin(),\
    \ 3); // elements cannot be modified\nconst std::span<std::string, 3> sp3(vec.begin(),\
    \ 3); // elements can be modified\n```\n\n* Using a different type of span than\
    \ for the referenced elements looks like you can use any qualifier for a span\
    \ that converts to the underlying element type, however is not true. You can only\
    \ add qualifiers such as:\n\n```\nstd::vector<int> vec{...};\nstd::span<long,\
    \ 3> sp3(vec.begin(), 3); // ERROR\n```\n\n* You could use data(sp) instead of\
    \ begin() here. The important thing is that the passed sequence is valid.\nHowever,\
    \ using begin(sp) provides better options for compilers to detect undefined behavior\
    \ by passing an invalid number of elements.\n\n# Passing and Printing a Span\n\
    \nNext, we print the span, passing it to a generic print function:\nprintSpan(sp3);\n\
    \nThe print function can deal with any span (long as an output operator for the\
    \ elements is defined):\n\n```\ntemplatetypename T, std::size_t Sz>\nvoid printSpan(std::span<T,\
    \ Sz> sp)\n{\n    for (const auto& elem : sp) {\n        std::cout << \"\" <<\
    \ elem << \"\\n\";\n    }\n    std::cout << '\\nn';\n}\n```\n\nAs you can see,\
    \ the span is passed by value. That is recommended because a span is just a pointer\
    \ and a size.\n\nInside the function, we use a range-based loop to iterate over\
    \ the elements of the span. This is possible because a span provides iterator\
    \ support with begin() and end().\n\nHowever, beware: whether we pass the span\
    \ by value or by const reference, inside the function we can still modify the\
    \ elements as long as they are not declared as const."
