  md: "# 3.2 Typical Application of Concepts and Requirements in Practice\n\nThere\
    \ are multiple reason why using constraints and requirements can be useful.\n\n\
    The reason is that we require the parameters to be comparable with nullptr, which\
    \ in general does not work. It demonstrates that it is important to think carefully\
    \ about the definition of general concepts.\n\n```\nauto val = maxValue(coll.begin(),\
    \ pos);\n// ERROR\n}\n```\n\n+   - Constraints to help understand the restrictions\
    \ on templates and to make more understandable error messages when these are broken.\n\
    - Constraints can be used to disable generic code for cases when it does not make\
    \ sense:\n  - Specify generic type might compile, but not the right thing.\n \
    \ - We might have to fix overload resolution, which decides which multiple callable\
    \ functions to call.\n- Constraints can be used to overload or specialize generic\
    \ code so that for different types different code is compiled.\n\nLet us take\
    \ a closer look to the reasons by developing another example step by step. This\
    \ way we also introduce a couple of additional details about constraints, requirements,\
    \ and concepts.\n\n# 3.2.1 Requirements to Understand Code and Error Messages\n\
    \nAssume we want to generate generic code that inserts the value of an object\
    \ into it collection. Thanks to templates we can implement it as code that is\
    \ compiled for the types of passed objects we know them:\n\n```\ntemplate<typename\
    \ Coll, typename T>\nvoid add(Coll& coll, const T& val)\n{\n    coll.push_back(val);\n\
    }\n```\n\nThis code does not compile. There is a hidden requirement for the types\
    \ of the argument: the call to push_back() for the value of T has to be supported\
    \ by the container of type Coll.\nYou could also that this is a combination of\
    \ multiple basic requirements:\n\n+   - Type Coll has to support push_back().\n\
    - There has to be a conversion from type T to the type of the elements of Coll.\n\
    - If the passed argument has the elements of Coll, that type has to support copying\
    \ (because a new element is initialized with the passed value).\n\nIf any of these\
    \ requirements are broken, the code does not compile. For example:\n\n```\nstd::vector<int>\
    \ vec;\nadd(vec, 42);\nadd(vec, \"hello\"); // ERROR: no conversion from string\
    \ literal to int\n```\n\n```\nstd::set<int> coll;\n```"
