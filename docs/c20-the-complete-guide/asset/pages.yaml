  md: '# 14.3 Basic Chrono Extensions with C++20


    Be careful when using std::chrono::months and std::chrono::years. months and years
    represent the average duration of a month, which is a fractional. The duration
    of an average year is computed by taking years into account:


    +   * Every 4 years have one more day (366 instead of 365 days)

    * However, 100 years do not have one more day

    * However, every 400 years we have one more day again


    So the value is 400 * 365 - 100 - 4 + 1 divided by 400. The duration of an average
    month is a 12th of it.


    # 14.3 Clocks


    C++20 introduces a couple of new clocks (remember, clocks define the origin/epoch
    of a timepoint). Standard clock types since C++20 describes their names and meanings.


    | Type | Meaning | Epoch |

    |---|---|---|n| system_clock | Associated with the lock of the system (C++11)
    | UTC time |

    | utc_clock | Clock for UTC time values | UTC time |

    | gps_clock | Clock for GPS values | GPS time |

    | tai_clock | Clock for international atomic values | TAI time |

    | file_clock | Clock for timepoints of the filesystem library | impl.spec. |

    | local_t | Pseudo code for local timepoints | open |

    | steady_clock | Clock for measurements (C++11) | impl.spec. |


    Table 14.2. Standard clock types since C++20


    The column Epoch specifies whether the clock specifies a unique point in time
    so that you always have a specific UTC time defined. This requires a stable specified
    epoch. For the file_clock the epoch is system but will-stable across multiple
    runs of a program. The epoch of the steady_clock might change from one year of
    your application to the next (e.g., when the system rebooted). For the pseudo
    local_t, the epoch is interpreted as "local time," which means you have to combine
    it with a timezone to know which point in time it represents.


    C++20 also provides a high_resolution_clock. However, its use can introduce issues
    when copying code from one another. In practice, high_resolution_clock is an alias
    for either system_clock or steady_clock, which means that the clock is steady
    and sometimes is not and that this clock might or not support conversions to other
    clocks or time_t. As the high_resolution_clock is on no platform finer than the
    steady_clock, you should use the steady_clock instead.


    We discuss later in detail


    +   * The difference of clocks in detail

    * Conversions between clocks

    * Which clocks deal with leap seconds


    > 2 Thanks to Howard Hinnant for pointing that out.'
