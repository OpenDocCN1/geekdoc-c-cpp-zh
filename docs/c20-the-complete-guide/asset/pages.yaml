  md: '# 14.3 Basic Chrono Extensions with C++20


    +   - Timepoint types are great as long as we only compute with seconds, hours
    and days (such as doing something on each day of a year).


    +   - Calendrical types are great for arithmetic the fact that months and years
    have a different number of days they count. In addition, you can deal with something
    like “the third Monday of the month” or “the last day of the month.”


    Standard calendrical types lists the calendrical types together with their default
    output format.


    | Type | Meaning | Output Format |

    | --- | --- | --- |

    | day | Day | 05 |

    | month | Month | Feb |

    | year | Year | 1999 |

    | weekday | Weekday | Mon |

    | weekday_indexed | nth weekday | Mon [2] |

    | weekday_last | Last weekday | Mon [last] |

