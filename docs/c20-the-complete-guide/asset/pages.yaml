    # 1.4 Overload Resolution with Rewritten Expressions


    Let us finally elaborate on the evaluation of expressions with comparison operators
    with the support of rewritten calls.


    # Calling Equality Operators


    To compile


    ```

    x != y

    ```


    the compiler now might try all of the following:


    ```

    x.operator!=(y) // calling member operator!= for x

    operator!=(x, y) // calling a free-standing operator!= for x and y

    ```


    ```

    !x.operator==(y) // calling member operator== for x

    !operator==(x, y) // calling a free-standing operator== for x and y

    ```


    ```

    !x.operator==(y) // calling member operator== is generated by operator<= for x

    ```


    ```

    !y.operator==(x) // calling member operator== is generated by operator<= for y

    ```


    The last form is tried to support an implicit type conversion for the first operand,
    which requires that the operand is a parameter.'
