  md: "# 19.1.3 Reachable versus Visible\n\nWhen using modules, a new distinction\
    \ comes into play: reachability versus visibility. When exporting data, we might\
    \ not be able to see and directly use a name or symbol of the module; although\
    \ we might be able to use it indirectly.\n\nSymbols that are reachable but not\
    \ visible can occur, when an exported API provides access to a type that is not\
    \ exported. Consider the following example:\n\n```\nexport module ModReach; //\
    \ declare module ModReach\n\nstruct Data { // declare a type not exported\n  \
