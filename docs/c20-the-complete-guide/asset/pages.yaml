    Ideally, C++ compilers should detect bugs at compile time. Since string literals
    are known at compile time, C++ can check for format violations when string literals
    are used as format strings and does so in std::format():


    ```

    std::format("{:d}", 42);                // OK

    std::format("{:s}", 42);                // compile-time ERROR

    ```


