    96 |    -> decltype((::new((void*)0))_Tp(std::declval<Args&>(...)))\n  |\n```\n\
    \nYou might think about using this by defining a concept that checks whether you\
    \ can perform the push_back() call:\n\n```\ntemplate<typename Coll, typename T>\n\
    concept SupportsPushBack = requires(Coll c, T v) {\n  c.push_back(v);\n};\n```\n\
    \nHowever, the check for being copyable is detected in the deep darkness of the\
    \ code for std::vector<> (this time the concept is checked instead of when the\
