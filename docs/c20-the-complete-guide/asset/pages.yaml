    Let us look at examples of if int and long have a different size:


    +   - Available only if int

    ```cpp

    template<typename T>

    requires sizeof(int) != sizeof(long)

    ```


    +   - Available only if sizeof(T) is not too large:

    ```cpp

    template<typename T>

    requires (sizeof(T) <= 64)

    ```


    +   - Available only if the non-type template parameter Sz is greater than zero:

    ```cpp

    template<typename T, std::size_t Sz>

    requires (Sz > 0)

    ```


    +   - Available only for raw pointers

    ```cpp

    template<typename T>

    requires (std::is_pointer_v<T> || std::same_as<T, std::nullptr_t>)

    ```


    std::same_as is a new standard concept. You could also use the type trait std::same_as:

    ```cpp

