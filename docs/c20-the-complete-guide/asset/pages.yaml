    \ - in a constant-expression, or\n- in a constant context (if constexpr, a consteval\
    \ function, or an constant initialization), or\n- for an initializer of a variable\
    \ used at compile time\n\nFor example:\n\n```\nconstexpr bool isConstEval() {\n\
    \    return std::is_constant_evaluated();\n}\nbool g1 = isConstEval(); // true\n\
    const bool g2 = isConstEval(); // true\nstatic bool g3 = isConstEval(); // true\n\
    static int g4 = g1 + isConstEval(); // false\nint main() {\n    bool l11 = isConstEval();\
    \ // false\n    const bool l12 = isConstEval(); // true\n    static bool l13 =\
    \ isConstEval(); // true\n    int l14 = g1 + isConstEval(); // false\n    const\
    \ int l15 = g1 + isConstEval(); // false\n    static int l16 = g1 + isConstEval();\
    \ // false\n    int l17 = isConstEval() + isConstEval(); // false\n    const auto\
    \ l18 = isConstEval() + isConstEval() + 42 + isConstEval(); // true\n}\n```\n\n\
    We get the same effect if isConstEval() is called indirectly via a constexpr function.\n\
