  md: "# 11.1 Generic Lambdas with Template Parameters\n\nYou can also declare template\
    \ parameters for consteval lambdas to force that they are executed at compile\
    \ time.\n\n# 11.1.2 Explicit Specification of Lambda Template Parameters\n\nLambdas\
    \ provide a convenient way to define function objects (functors). For generic\
    \ lambdas their function operator (operator()) is a template. With the syntax\
    \ to specify a name for the parameter instead of using auto, you have to name\
    \ the template parameter in the generated function call operator. For example,\
    \ if you define the following lambda:\n\n```\nauto primeNumbers = []<int Num>()\
    \ {\n  std::array<int, Num> primes;\n  // compute and assign first Num prime numbers\n\
    \  return primes;\n};\n```\n\nthe compiler defines a corresponding closure type:\n\
    \n```\nclass NameChosenByCompiler {\npublic:\n  \n  template<int Num>\n  auto\
    \ operator() const {\n    std::array<int, Num> primes;\n    // compute and assign\
    \ first Num prime numbers\n    return primes;\n  }\n};\n```\n\nand creates an\
    \ object of this class (using the default constructor if no values are captured):\n\
    \n```\nauto primeNumbers = NameChosenByCompiler();\n```\n\nTo specify the template\
    \ parameter, you have to pass it to operator() when you use the lambda\nas as\
    \ a function:\n\n```\n// initialize array with the first 20 prime numbers:\nauto\
    \ primes20 = primeNumbers.operator()<20>(),\n```\n\nThere is no way to avoiding\
    \ operator() when specifying its template parameters except using an\ndirect call.\n\
    \nYou can to make the template parameter deducible by making it a compile-time\
    \ value, however, the\resulting syntax is not much better!\n\n```\nauto primeNumbers\
    \ = []<int Num>(std::integral_constant<int, Num>) {\n  std::array<int, Num> primes;\n\
    \  // compute and assign first Num prime numbers\n  return primes;\n};\n```"
