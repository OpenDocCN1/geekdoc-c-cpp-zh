    \ T& val) // for floating-point value types\n{\n    // special stuff for floating-point\
    \ values\n    coll.push_back(val);\n}\n```\n\nThis is enough to overload resolution\
    \ also prefers overloads or specializations that constraints over those that have\
    \ no constraints or\n\n```\nstd::vector<int> iVec;\nadd(iVec, 42); // OK: calls\
    \ add() for generic value types\n\nstd::vector<double> dVec;\nadd(dVec, 0.7);\
    \ // OK: calls add() for floating-point types\n```\n\n# Restrictions on Different\
    \ Signatures\n\nIf two overloads or specializations have constraints, it is important\
    \ that overload resolution can decide which one is better. For that, overloaded\
    \ functions have have the same signature.\n\nIf the signature differs, the most\
    \ constrained overload is not preferred. For example, if we declare the overload\
    \ for floating-point values to take the argument by value, passing a floating-point\
    \ value becomes ambiguous:\n\n```\ntemplate<typename Coll, typename T>\nvoid add(Coll&\
    \ coll, const T& val) // note: pass by const reference\n{\n    coll.push_back(val);\n\
    }\n```\n\n```\ntemplate<typename Coll, std::floating_point T>\nvoid add(Coll&\
    \ coll, T val) // note: pass by value\n{\n    // special stuff for floating-point\
    \ values\n    coll.push_back(val);\n}\n```\n\n```\nstd::vector<double> dVec;\n\
    add(dVec, 0.7); // ERROR: both templates match and no preference\n```\n\nThe latter\
    \ declaration is no longer a special case of the former declaration. We have just\
    \ two different function templates that both could be called.\n\nIf you really\
    \ want to have different signatures, you have to constrain the first function\
    \ template not to be available for floating-point values."
