  md: "# 10.5 Using Heap Memory, Vectors, and Strings at Compile Time\n\n```\nstd::string\
    \ s = returnString(); // OK\n...\n}\n```\n\nYou can also solve the problem by\
    \ returning just the compile-time string with data() or c_str() or as a std::string_view.\
    \ You would return the address of memory allocated at compile time Frequently,\
    \ the compiler raises a compile-time error if that happens.\n\nHowever, we can\
    \ use the same trick as described for vectors above. We can convert the string\
    \ into an array of fixed size and return both the array and the size of the vector.\
    \ Here is a complete example:\n\n```\ncomptime/comptimestring.cpp\n```\n\n```\n\
    #include <iostream>\n#include <string>\n#include <array>\n#include <cassert>\n\
    #include <asstring.hpp>\n\n// function template to export a compile-time string\
    \ to runtime:\ntemplate<int MaxSize>\nconst auto toRuntimeString(std::string s)\n\
    {\n    // ensure the exported array is large enough:\n    assert(s.size() <= MaxSize);\n\
    \n    // create a compile-time array and copy all characters into it:\n    std::array<char,\
    \ MaxSize+1> arr{}; // ensure all elements are initialized\n    for (int i = 0;\
    \ i < s.size(); ++i) {\n        arr[i] = s[i];\n    }\n\n    // return the compile-time\
    \ array and the string size:\n    return std::pair(arr, s.size());\n}\n```\n\n\
    ```\n// function to import an exported compile-time string at runtime\nstd::string\
    \ fromComptimeString(const auto& dataAndSize)\n{\n    // init string with exported\
    \ array of chars and size:\n    return std::string{dataAndSize.first.data(),\n\
    \                       dataAndSize.second};\n}\n```\n\n// test the functions:\n\
    \n```\nconst auto comptMaxStr();\n```"
