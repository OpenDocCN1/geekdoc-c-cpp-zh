  md: "# 12.1 New Type char8_t\n\nIf your compiler accepts the character € in your\
    \ source code (which means it has to support a file encoding with a character\
    \ set such as UTF-8 or ISO-88519), you could even use this symbol in literals:\n\
    \n```\nconst char8_t* cEuro = u8\"\\u20AC\"; // OK if valid character for the\
    \ compiler\nstd::string sEuro = u8\"\\u20AC\"; // OK if valid character for the\
    \ compiler\n```\n\nBecause this source code is not portable, you better use Unicode\
    \ characters (as v \\u20AC for the € symbol).\n\nNote that a few things in the\
    \ C++ standard library changed char8_t were added\n\n+   - Overloads using or\
    \ returning UTF-8 strings use the new UTF-8 strings\n\nIn addition, that char8_t\
    \ is not guaranteed to have 8 bits. It is defined internally as an unsigned char,\
    \ which typically has 8 bits, but may have more. As usual, you can use std::numeric_limits\
    \ to check its number of bits:\n\n```\nstd::cout << \"char8_t has \"\n  << std::numeric_limits<char8_t>::digits\
    \ << \" bits\\\\n\";\n```\n\n# 12.1.1 Changes in the C++ Standard Library for\
    \ char8_t\n\nThe C++ standard library changed the following to support char8_t:\n\
    \n+   - u8string is now provided (defined as std::basic_string<char8_t>)\n- u8string_view\
    \ is now provided (defined as std::basic_string_view<char8_t>)\n- std::numeric_limits<char8_t>\
    \ is now defined\n- std::char_traits<char8_t> is now defined\n- Hash functions\
    \ for char8_t strings and string views are provided\n- std::mbrtoc8(C) and crtomb()\
    \ are now provided\n- codecvt facets to convert char8_t and char16 or char32_t\
    \ are now provided\n- For filesystem paths, u8string() now returns std::u8string\
    \ instead of std::string\n- std::atomic<char8_t> is now provided\n\nNote that\
    \ these changes might break code when compiled with C++20, which is discussed\
    \ next.\n\n# 12.1.2 Broken Backward Compatibility\n\nBecause C++20 changes the\
    \ type of UTF-8 literals and signatures returning UTF-8 strings, code using UTF-8\
    \ characters might no longer compile."
