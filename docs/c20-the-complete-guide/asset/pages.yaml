  md: '# 8.3.1 Performance of Spans


    Spans are designed with best performance as a goal. For this, they internally
    use just a raw pointer to the sequence of elements. However, raw pointers expect
    elements being stored sequentially in one chunk of memory (otherwise ++ could
    not be used by the raw pointers to iterate over the elements). For this reason,
    spans require to have elements in continuous memory.


    With this requirement, spans can provide the best performance of all types of
    views. Spans do not need any allocation and do with any direction. The only overhead
    when using a span is the overhead of constructing it.¹


    Spans checks whether a referenced sequence has its elements in continuous memory
    via concepts at time. When a span is initialized or a new sequence is assigned,
    iterators have to satisfy the condition std::contiguous_iterator and containers/ranges
    have to satisfy the concepts std::contiguous_range and std::size_range.


    Because spans internally are just a pointer and a size, it is very cheap to copy
    them. For this reason, should always pass by value instead of passing them by
    const reference.


    # Type Erasure


    The fact that spans perform element access with raw pointers to the memory means
    that a span erases the information in which container these elements are. A span
    to the elements of a vector has the same type as a span to the elements of an
    array (provided they have the same extent):


    ```

    std::array arr(1, 2, 3, 4, 5);

    std::vector vec(1, 2, 3, 4, 5);

    ```


    ```

    std::span<int> vecSpanDyn(vec);

    std::span<int> arrSpanDyn(arr);

    std::same_as<decltype(arrSpanDyn), decltype(vecSpanDyn)> // true

    ```


    However, note that class template deduction for spans deduces a fixed extent from
    an array and dynamic extent from a vector. That means:


    ```

    std::array arr(1, 2, 3, 4, 5); // deduces std::span<int, 5>

    std::vector vec{1, 2, 3, 4, 5); // deduces std::span<int>

    std::span<int> span = vecSpan5(vec);

    ```


    ```

    std::same_as<decltype(arr), decltype(vecSpan)> // false

    std::same_as<decltype(arr), decltype(vecSpan5)> // true

    ```


    # Spans vs. Subranges


    The requirement for contiguous storage of the elements is the major difference
    to subranges, which are also introduced with C++20. Subranges internally still
    use iterators and can therefore refer to all types of containers and ranges. However,
    that may signify more overhead.


    > ¹ Thanks to Barry Revzin for pointing that out.'
