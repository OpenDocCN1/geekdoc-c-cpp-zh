    \ is an interesting one discussed later in detail. Let us look at what is technically\
    \ possible here.\n\nWe can use any form of a required name in the if constexpr\
    \ condition:\n\n```\nif constexpr (SupportsPushBack<coll>) {\n coll.push_back(val);\n\
    }\nelse {\n coll.insert(val);\n}\n```\n\nThe other option is to overload two implementations:\n\
