    \ // partial_ordering used as the return type\n    }\n```\n\nIf you do not know\
    \ the comparison types (e.g., their type is a template parameter), you can use\
    \ a new type trait::common_comparison_category<> that computes the strongest comparison\
    \ category:\n\n```\nclass Person {\n    std::string name;\n    double value;\n\
    \n    auto operator<=>(const Person& rhs) const // OK <<>\n        -> std::common_comparison_t<decltype(name\
    \ <=> rhs.name), decltype(value <=> rhs.value)> {\n            auto cmp1 = name\
    \ <=> rhs.name;\n            if (cmp1 != 0) return cmp1; // used as or converted\
    \ to common comparison type\n            return value <=> rhs.value; // used as\
    \ or converted to common comparison type\n        }\n```\n\nBy using the trailing\
    \ return type syntax (with auto in front and the return type after ->), we can\
    \ use the parameters to compute the comparison types. In this case you could use\
