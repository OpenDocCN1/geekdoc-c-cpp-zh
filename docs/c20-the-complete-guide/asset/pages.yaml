  md: '# Chapter 1: Comparisons and Operator =>


    a != b // tries; a!=b, !(a==b), and !(b==a)


    Therefore, for a type TypeA and b of TypeB, the compiler will be able to compile


    a != b


    if there


    +   - a freestanding operator!=(TypeA, TypeB)

    - a freestanding operator===(TypeA, TypeB)

    - a freestanding operator===(TypeB, TypeA)

    - a member function TypeA::operator!=(TypeB)

    - a member function TypeA::operator===(TypeB)

    - a member function TypeB::operator===(TypeA)


    Directly calling a defined operator! is preferred (over the order which it has
    to fit). Reordering the operands has the lowest priority. Having both a freestanding
    and a member function is an ambiguity error.

    Thus, with


    ```

    bool operator==(const TypeA, const TypeB&);

    ```


    or


    ```

    class TypeA {

    public:

    ...

    bool operator==(const TypeB&) const;

    };

    ```


    the compiler will be able to compile

    MyType a;

    MyType b;


    ```

    a == b; // OK: fits perfectly

    b == b; // OK, rewritten as: a == b

    a != b; // OK, rewritten as: ! (a == b)

    b != a; // OK, rewritten as: ! (a == b)

    ```


    Note that thanks to rewriting, implicit type conversions for the first operand
    are also possible when rewriting it to become the parameter of the defined member
    function.

    See the example sentinel1.cpp for how to benefit from this feature by only defining
    a member operator == for an iterator which usually has a != with a different order
    or is called.


    # Operator <=>


    There is no equivalent there that for relational operators it is enough to have
    operator < defined. However, you only have to define the new operator <==>.

    In fact, the following is enough to enable programmers to use all possible comparators:


    ```

    lang/value20.hpp

    #include <compare>

    ```'
