  md: '# 3.6 Semantic Constraints


    As another example, besides certain syntactic differences there is a semantic
    difference between the concepts weakly_incrementable and incrementable:


    +   - weakly_incrementable only requires that a type supports the increment operators.
    Incrementing the same value may yield different results.

    - incrementable requires each increment of the same value gives the result.


    Therefore:


    +   - When incrementable is satisfied, you can iterate multiple times from a starting
    value over a range.

    - When only weakly_incrementable is satisfied, you can iterate over a range once.
    A second iteration with the same starting value may yield different results.


    This matters for iterators: Input stream iterators (iterators that read values
    from a stream) can only iterate once because the next iteration yields different
    values. Consequently, input iterator satisfies weakly_incrementable concept but
    not the incrementable concept. However, the concepts cannot be used for this purpose:


    ```

    std::weakly_incrementable<std::stream_iterator<int>> // yields true

    std::stream_iterator<int> // OOPS: also yields true

    ```


    The reason is that the difference is a semantic constraint that cannot be checked
    at compile time. So the concepts can be used to document the constraints:


    ```

    template<std::weakly_incrementable<T>>nvoid algo1(T beg, T end); // single-pass
    algorithm


    template<std::incrementable<T>>nvoid algo2(T beg, T end); // multi-pass algorithm

    ```


    Note that we use different names for the algorithms here. Due to the fact that
    we cannot check the semantic difference of the constraints, it is up to the programmer
    to not pass an input stream iterator:


    ```

    algo1(std::stream_iterator<int>{std::cin}; // OK

    std::stream_iterator<int>{{}});

    ```


