    # Date Types for Weekdays


    Because we want to iterate over all First Mondays of each month in the current
    year, we initialize an object of the very special calendrical type std::chrono:month_year_weekday
    and initialize it with the first Monday of January of the current year:


    ```

    auto first = today.year() / 1 / chr::Monday[1];

    ```


    Again we use operator/ to combine different fields. However, this time types for
    weekdays come into play:


    +   - First, we call today.year() / 1 to combine a std::chrono::year with an integral
    value to create a std::chrono::year_month.

    - Then, we use Monday, a standard object of type std::chrono::weekday with operator[]
    to create an object std::chrono::weekday_indexed representing the nth weekday.

    - Finally, operator/ is used to combine the std::chrono::month_year with the std::chrono::weekday_indexed
    object, which creates an object of type std::chrono::month_year_weekday.


    Therefore, a fully specified declarations would look as follows:


    ```

    std::chrono::month_year_weekday first = today.year() / 1 / std::chrono::Monday[1];

    ```


    Note that the default output format of month_year_weekday uses slashes instead
