    # Other C++ Language Improvements


    This chapter presents several other small features and extensions C++20 introduces
    for its core language.


    #  12.1 New Character Type char8_t


    For better UTF-8 support, C++20 introduces the new character char8_t and a new
    corresponding string type std::u8string.


    Type char8_t is a new keyword and serves as the type to hold UTF-8 characters
    and character sequences.


    ```

    char8_t c = u8''; // character with UTF-8 encoding for character ©

    const char8_t* s = u8"K\u00F6n"; // character sequence with UTF-8 encoding for
    Köln

    ```


    The introduction of this type is a breaking change:


    +   * u8 literals now use char8_t instead of char

    * For UTF-8 strings the new types: std::u8string and std::u8view are used now


    Consider the following:


    ```

    auto c = u8''; // character with UTF-8 encoding for character ©

    auto s1 = u8"K\u00F6n"; // character sequence with UTF-8 encoding for Köln

    using namespace std;

    auto s2 = u8"K\u00F6n"; // string with UTF-8 encoding for Köln

    auto sv = u8"K\u00F6n"; // string view with UTF-8 encoding for Köln

    ```


    The types of c and s have changed here:


    +   * Before C++20 this was equivalent to:

    char c = u8''; // UTF-8 character type before C++20

    const char* s1 = u8"K\u00F6n"; // UTF-8 character sequence type before C++20

    using namespace std;

    std::string s2 = u8"K\u00F6n"; // UTF-8 string type before C++20

    std::string_view sv = u8"K\u00F6n"; // UTF-8 string view type before C++20


    +   * Since C++20 this is equivalent to:'
