    # 9.4 Afternotes


    The request for more non-type template parameters exists since the first C++ standard.
    We discussed it already in the first edition of C++ Templates – The Complete Guide
    (see http://tmplbook.com).


    Allowing arbitrary literal types for non-type template parameters was first proposed
    by Jens Maurer in http://wg21.link/n3413. Allowing class objects as non-type template
    parameters was then proposed for C++20 by Jeff Snyder in http://wg21.link/p0732r0.
    Allowing floating-point values as non-type template parameters was then proposed
    for C++20 by Jorg Brown in http://wg21.link/p1714r0.


    The finally accepted wordings were formulated by Jeff Snyder and Louis Dionne
    in http://wg21.link/p0732r2 and by Jens Maurer in http://wg21.link/p1907r1.'
