  md: '# 7.3 Creating Views to External Elements


    This section discusses all features of C++20 that create views that refer to external
    elements (passed as a range or as begin and end or by count).


    # 7.3.1 std::ranges::subrange


    Class template std::ranges::subrange<> defines a view to the elements of a range
    that is either passed as single argument or as pair of begin iterator and sentinel.
    The view itself internally represents the elements by storing begin and end/sentinel.


    The major use of subrange is to convert a pair of iterator and sentinel (end iterator)
    into one object. Example:


    ```

    void foo(auto beg, auto end)

    {

    std::ranges::subrange rg{beg, end};

    }

    ```


    Two adapters can also create a subrange:


    +   * std::views::all(rg), creates a subrange if rg is not already a view. That
    can be used to pass containers as lightweight objects.

    * std::views::counted(beg, sz), which creates a subrange of sz elements starting
    with the iterator beg if beg does not refer to consecutive memory (for consecutive
    memory, counted() creates a span).


    Operations of Class std::ranges::subrange<> lists the API of a subrange.

    The constructors taking a szhint allows programmers to convert an unsized range
    into a sized range. If you pass szhint the behavior is undefined if you specify
    a known size (e.g., it is a forward list), the hint is used as size.

    Iterators do not refer to this view. They refer to the underlying range. Therefore,
    a subrange is a borrowed range. However, note that iterators can dangle, when
    the underlying range is no longer there.


    # Tuple-Like Interface of Subranges


    std::ranges::subrange also has a tuple-like interface to support structured bindings
    (introduced in C++17). You can easily initialize a begin iterator and sentinel
    (end iterator) doing something like the following:


    ```

    auto [beg, end] = std::ranges::subrange(coll);

    ```


    For this, class std::ranges::subrange provides


    +   * a specialization of std::tuple_size

    * specializations of std::tuple_element

    * get<>() functions for the indexes 0 and 1'
