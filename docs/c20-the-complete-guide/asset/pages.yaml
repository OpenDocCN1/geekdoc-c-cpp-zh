  md: "# 3.7 Design Guidelines for Concepts\n\nThe problem is that the compiler cannot\
    \ detect that SameAs<> is commutative. The order might matter and the first requirement\
    \ is not necessarily a subset of the second requirement.\n\nHowever we can solve\
    \ that by making clear for SameAs<> the order of the elements does not matter.\
    \ We need a helper concept:\n\n```\ntemplate<typename T, typename U>\nconcept\
    \ SameAs = std::is_same_v<T, U>;\n\ntemplate<typename T, typename U>\nconcept\
    \ SameAs = SameHelper<T, U> && SameHelper<U, T>; // commutative\n```\n\nNow, the\
    \ order of parameters does no longer matter for IsSame<>:\n\n```\ntemplate<typename\
    \ T, typename U>\nrequires SameAs<T, U> // use SameAs\nvoid foo(T, U)\n{\n   \
    \ std::cout << \"foo() for parameters of same type\" << '\\n';\n}\n```\n\n```\n\
    template<typename T, typename U>\nrequires SameAs<U, T> && std::integral<T> //\
    \ use SameAs with order\nvoid foo(T, U)\n{\n    std::cout << \"foo() for integral\
    \ parameters of same type\" << '\\n';\n}\nfoo(1, 2); // OK: second foo() preferred\n\
    ```\n\nThe compiler can find out that the first building SameAs<U,T> is part of\
    \ a sub-concept of SameAs<T,U> and std::integral<T> is an extension. Therefore,\
    \ the second foo() has preference.\n\nThe C++ standard knows problems like this\
    \ and therefore defines the concept std::same_as accord-, so that the order of\
    \ elements does not matter:\n\n```\ntemplate<typename T, typename U>\nrequires\
    \ std::same_as<T, U> // use same_as<\nvoid foo(T, U)\n{\n    std::cout << \"foo()\
    \ for parameters of same type\" << '\\n';\n}\n```\n\n```\ntemplate<typename T,\
    \ typename U>\nrequires std::same_as<U, T> && std::integral<T> // use same_as<>\
    \ with other\nvoid foo(T, U)\n{\n    std::cout << \"foo() for integral parameters\
    \ of same type\" << '\\n';\n}\n```"
