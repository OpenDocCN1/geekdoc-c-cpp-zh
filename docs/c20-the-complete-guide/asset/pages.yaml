    implementation


    template<std::incrementable<T>>nvoid algo(T beg, T end); // multi-pass implementation

    ```


    If you pass an input stream iterator, the compiler will wrongly use the multi-pass
    implementation:


    ```

    algo(std::stream_iterator<int>{std::cin}; // Oops: calls the wrong overload

    std::stream_iterator<int>{{}});

    ```


    Fortunately, there is a solution here, for this semantic difference C++98 had
    already introduced iterator traits, which are used by the iterator concepts. If
    you use these concepts (or the corresponding concepts), everything works fine:'
