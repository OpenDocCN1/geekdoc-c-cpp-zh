  md: "# 3.2 Typical Application of Concepts and Requirements in Practice\n\n# Restrictions\
    \ on Narrowing\n\nWe have another interesting issue here: Both function templates\
    \ allow us to pass a double to add it into a collection of int:\n\n```\nstd::vector<int>\
    \ iVec;\n```\n\n```\nadd(dVec, 1.9); // OOPS: add l1\n```\n\nThe reason is that\
    \ we have implicit conversions from double to int (due to being compatible to\
    \ the programming language C). Such an implicit conversion where we lose parts\
    \ of the value is called narrowing. It means that the code compiles and converts\
    \ the value 1.9 to 1 before it gets inserted.\n\nIf you do not want to support\
    \ narrowing, you have multiple options: One is to disable type conversions at\
    \ all by requiring that the pass value type matches the element of the collection:\n\
    \n```\nrequires std::same_as<typename Coll>::value_type, T>\n```\n\nHowever, for\
    \ that reason it is better to define a concept that yields a type which can be\
    \ converted to another type without narrowing, which is possible in a short tricky\
    \ requirement.³\n\n```\ntemplate<typename From, typename To>\nconcept ConvertsWithNarrowing\
    \ =\n    std::convertible_to<From, To> &&\nrequires (From&& x) {\n    std::type_identity_t<To[]>(std::forward<From>(x))\n\
    \    } -> std::same_as<To[1]>;\n}\n```\n\nWe can use this concept to formulate\
    \ a corresponding constraint:\n\n```\ntemplate<typename Coll, typename T>\nrequires\
    \ ConvertsWithNarrowing<T, typename Coll>::value_type\nvoid add(Coll& coll, const\
    \ T& val)\n{}\n```\n\n# Subming Constraints\n\nIt would probably be enough to\
    \ define the concept for narrowing conversions without requiring the concept std::convertible_to_t,\
    \ because the rest checks this implicitly:\n\n```\ntemplate<typename From, typename\
    \ To>\nconcept ConvertsWithNarrowing_t = requires (From&& x) {\n    { std::type_identity_t<To[]>(std::forward<From>(x))\
    \ } -> std::same_as<To[1]>;\n}\n```\n\n> ³ Thanks to Giuseppe D'Angelo and Zhihao\
    \ Yuan for the tricky check for narrowing conversions introduced in http://wg21.link/p0870."
