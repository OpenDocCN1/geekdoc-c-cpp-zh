  md: "# Define Concepts with Care\n\nTo detect sub-concepts, the compiler has to\
    \ be able detect concepts and the way they are called match. This requires careful\
    \ definition of concepts. For example, consider we define our own concept SameAs\
    \ and use it as follows:\n\n```\ntemplate<typename T, typename U>\nconcept SameAs\
    \ = std::is_same_v<T, U>; // define SameAs\n\ntemplate<typename T, typename U>\n\
    requires SameAs<T, U> // use SameAs\nvoid foo(T, U) {\n    std::cout << \"foo()\
    \ for parameters of same type\" << '\\\\n';\n}\n\ntemplate<typename T, typename\
    \ U>\nrequires SameAs<T, U> && std::integral<T> // use SameAs again\nvoid foo(T,\
    \ U) {\n    std::cout << \"foo() for integral parameters of same type\" << '\\\
    \\n';\n}\n```\n\nfoo(1, 2); // OK: second foo() preferred\nHowever, what happens\
    \ if we exchange the parameters when we call SameAs<> in the requirement for the\
    \ second foo():\n\n```\ntemplate<typename T, typename U>\nconcept SameAs = std::is_same_v<T,\
    \ U>; // define SameAs\n\ntemplate<typename T, typename U>\nrequires SameAs<T,\
    \ U>\nvoid foo(T, U) {\n    std::cout << \"foo() for parameters of same type\"\
    \ << '\\\\n';\n}\n```\n\n```\ntemplate<typename T, typename U>\nrequires SameAs<U,\
    \ T> && std::integral<T> // use SameAs with other order\nvoid foo(T, U) {\n  \
    \  std::cout << \"foo() for integral parameters of same type\" << '\\\\n';\n}\n\
    ```\n\nfoo(1, 2); // ERROR: ambiguity: both true but no sub-concept"
