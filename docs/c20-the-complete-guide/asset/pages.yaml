    \ comparison type. If you know the weakest comparison type, you can just use it\
    \ as the return type:\n\n```\nclass Person {\n    std::string name;\n    double\
    \ value;\n\n    std::partial_ordering operator<=>(const Person& rhs) const { //\
    \ OK\n        auto cmp1 = name <=> rhs.name;\n        if (cmp1 != 0) return cmp1;\
