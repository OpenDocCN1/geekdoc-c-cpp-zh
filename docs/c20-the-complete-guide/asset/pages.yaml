  md: '# Preface


    C++20 is the next evolution in modern C++ programming, which is already (partially)
    supported by the latest version of gcc, clang, and Visual C++. The move to C++20
    is at least as big as a step as the move to C++11. C++20 contains a significant
    number of new language features and libraries that will again change the way we
    program in C++. This applies to both application programmers and programmers who
    provide foundation libraries.


    # An Experiment


    This book is an experiment in two ways:


    +   - I am writing an in-depth book covering a complex new features provided by
    different authors and C++ working groups. However, I can ask questions and I do.

    - I am publishing the book myself on Leanpub and for printing on demand. That
    is, this book is written step by step and I will publish new versions as soon
    as there is a significant improvement that makes the publication of a new version
    worthwhile.


    The good thing is:


    +   - You get the view of the language features from an experienced application
    programmer—somebody who feels the pain a feature might cause and asks the relevant
    questions to be motivated and explain the design and its consequences for programming
    practice.

    - You can benefit from my experience with C++20 while I am still learning and
    writing.

    - This book and all readers can benefit from your early feedback.


    This means that you are also part of the experiment. So help me: give feedback
    about flaws, errors, that are not explained well, or gaps, so that we all benefit
    from these improvements.


    # Versions of This Book


    Because this book is written incrementally, the following is a history of the
    major updates (newest first):


    +   - 2021-12-31: Describe where typename is no longer required for type members
    of template parameters

    - 2021-12-30: Describe bit operations (including bit_cast<>()'
