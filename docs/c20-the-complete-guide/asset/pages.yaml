  md: "# Relaxed Constraints for constexpr Functions\n\nEvery C++ version since C++11\
    \ C++20 relaxed the constraints for constexpr functions. This also means that\
    \ the consteval functions have only these relaxed constraints.\n\nBasically, the\
    \ constraints for constexpr and consteval functions are now as follows:\n\n+ \
    \  - Parameters and return type (if any) are now literal types.\n- The body may\
    \ only contain variables of literal that are neither static nor thread_local\n\
    - Using goto and labels is not allowed.\n- The function may only be a constructor\
    \ or destructor, the class has no virtual base class.\n- They are implicitly inline.\n\
    - They cannot be used as coroutines.\n\n***** This chapter/section is at work\
    \ *****\n\n# std::is_constant_evaluated()\n\nC++20 provides a new helper function\
    \ to switch code between compile-time and runtime computing: std::is_constant_evaluated().\
    \ It is defined in header <<type_traits> (although it is not re-ally function).\n\
    \nIt allows to switch from calling a helper function only callable at code that\
    \ can be used at compile-time. For example:\n\ncomptime/isconstexpr.hpp\n\n```\n\
    #include <type_traits>\n#include <cstring>\n\nconstexpr int len(const char* s)\
    \ {\n    if (std::is_constant_evaluated()) {\n        int idx = 0;\n        while\
    \ (s[idx] != '\\0') { // compile-time friendly code\n            ++idx;\n    \
    \    }\n        return idx;\n    }\n    else {\n        return std::strlen(s);\
    \ // function called at runtime\n    }\n}\n```\n\nIn function len() we compute\
    \ the length of a raw string or string literal. If called at runtime, we use the\
    \ standard C function strlen. However, to enable that the function can be used\
    \ at compile-time, we provide a different implementation if we are in a compile-time\
    \ context."
