  md: "# 8.1 Using Spans\n\n# Dealing with Reference Semantics\n\nNext, we sort the\
    \ elements span refers to (we use the new std::ranges::sort that takes the container\
    \ as a whole):\n\n```\nstd::ranges::sort(vec);\n```\n\nBecause the span has reference\
    \ semantics, this sorting also affects the elements of the span: they are also\
    \ sorted.\n\nIf we do not have a span of const elements, we can also sort() for\
    \ the span. In that case we would only sort the first 3 elements in the vector:\n\
    \n```\nstd::vector<std::string> vec{\"New York\", \"Rio\", ...}; // elements not\
    \ const\nstd::span<const std::string, 3> span3{vec.begin(), 3};\nstd::ranges::sort(span3);\
    \ // sort first 3 elements only\n```\n\nNext, we insert a new element into the\
    \ vector elements the span refers to. Due to the reference semantics of a span,\
    \ this is something we have to be very careful about, because the vector allocates\
    \ memory it invalidates all iterators and pointers to its elements. A reallocation\
    \ invalidates a span referring to the elements of the vector. The span refers\
    \ to elements that are no longer there:\n\nFor this reason, we double check the\
    \ capacity (maximum number of elements for which memory is allocated) before the\
    \ insertion. If it changed, we reinitialize the span to refer to the first three\
    \ elements in the new memory:\n\n```\nauto oldCapa = vec.capacity();\nvec.push_back(\"\
    Cairo\");\nif (oldCapa != vec.capacity()) {\n  span3 = std::span<std::string,\
    \ 3>{vec.begin(), 3};\n}\n```\n\nWe can perform only this reinitialization, because\
    \ the span itself is not const.\n\n# Assigning a Different Subdivision\n\nIn general,\
    \ the assignment operator of a span allows us to assign another sequence of elements.\
    \ The requirement is that the assigned value has the same number of elements of\
    \ the same type stored in contiguous memory.\n\nThe example uses this to refer\
    \ to the last three elements in the vector:\nspan3 = std::span<std::string, 3>(vec.end()\
    \ - 3, vec.end());\n\nHere you can also see that we can reference the sequence\
    \ with two iterators defining the begin and end of the sequence as a half-open\
    \ range (begin included, end excluded). In this case the span is iterator 3 elements\
    \ from the end.\n\nHowever, the new value can come from a totally different source.\
    \ For example:\n\n```\nstd::vector<std::string> vec{\"New York\", \"Tokyo\", \"\
    Rio\", \"Berlin\", \"Sydney\"};\nstd::span<const std::string, 3> span3{vec.begin(),\
    \ 3};\n```"
