    # Specifiers for Integer Types


    Table *Formatting Options for Integral Types* lists the possible formatting type
    options for integral types (including `bool` and char)


    | Spec. | 42 | ''@'' | true | Meaning |

    | --- | --- | --- | --- | --- |

    | none | 42 | | true | Default format |

    | d | 64 | | 1 | Decimal notation |

    | b/B | 101010 | 1000000 | 1 | Binary notation |

    | #b | 0b101010 | 0b1000000 | 0b | Binary notation with prefix |

    | #B | 0b101010 | 0B1000000 | 0B | Binary notation with prefix |

    | o | 52 | | 1 | Octal |

    | x | 2a | | 1 | Hexadecimal notation |

    | X | 2A | | 1 | Hexadecimal notation |

    | #x | 0x2a | 040 | 0x1 | Hexadecimal notation with prefix |

    | #X | 0X2A | 040 | 0X1 | Hexadecimal notation with prefix |

    | c | | | ''\1'' | As character with the value |

    | s | invalid | invalid | true | bool as string |


    Table 13.1. Formatting Options for Integral Types


    For example:


    ```

    std::cout << std::format("{:#b} {:#b} {:#b}\n", 42, ''@'', true);

    ```


    will print:


    ```

    0b101010 0b1000000 0

    ```


    Note the following:


    +   - d (decimal) for integer types

    - c (as character) for character types

    - s (as string) for type bool

    - If L is specified after the notation, the locale-dependent character sequence
    for Boolean values and the locale-dependent separators separates decimal and point
    characters for arithmetic values are used.


    # Specifiers for Floating-Point Types


    Table *Formatting Options for Floating-Point Types* lists the possible formatting
    type options for floating-point types.


    For example:


    ```

    std::cout << std::format("{0} {0:##} {0:g}\n", -1.0);

    ```


    will print:


    ```

    -1 -1. -1.00000 -1.000000e+00

    ```'
