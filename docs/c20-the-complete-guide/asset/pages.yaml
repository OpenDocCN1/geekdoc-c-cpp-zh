  md: '# Chapter 18: Other C++ Standard Library Improvements


    | Trait | Effect |

    | --- | --- |

    | is_bounded_array<T> | Yields true if T is an array type with known extent |

    | is_unbounded_array<T> | Yields true if T is an array type with unknown extent
    |

    | is_nothrow_convertible<T, T2> | Yields true if T is convertible to T2 without
    throwing |

    | is_layout_compatible<T1, T2> | Yields true if T1 is layout compatible with type
    T2 so that reinterpret_cast<...> of pointers is defined |

    | is_layout_pointer_interconvertable...base_of<BaseT, DerT> | Yields true if DerT
    can safely be converted to its pointer to base type BaseT |

    | remove_cvref<T> | Yields type T without being a constant, and volatile |

    | unwrap_reference<T> | Yields the wrapped type of T if it is std::reference_wrapper<>
    or otherwise T |

    | unwrap_ref_decay<T> | Yields the wrapped type of T if it is std::reference_wrapper<>
    or otherwise the decayed type of T |

    | common_reference<T...> | Yields the common type (if any) of all types T... to
    which you can assign a value |

    | type_identity<T> | Yields T as it is |

    | is_clock<T> | Yields true if T is a clock type |


