  md: "# Chapter 10\n\n# Compile-Time Computing\n\nThis chapter presents several extensions\
    \ of C++ to support compile-time computing.\n\nPart of this chapter are the two\
    \ new keywords constinit and consteval, and the extensions that allow programmers\
    \ to use heap memory, vectors, and strings at compile time.\n\n# 10.1 Keyword\
    \ constinit\n\nOne new C++20 introduces **constinit**. It can be used to force\
    \ and ensure that a mutable static global variable gets initialized at compile\
    \ time. So, roughly speaking the effect is described as:\n\n```\nconstinit = constexpr\
    \ const\n```\n\nYes, a constinit variable is **not const** (the keyword would\
    \ have been named compiletimeinit). The name comes from the fact that initializations\
    \ when usually compile-time constants are initialized.\n\nYou can use constinit\
    \ whenever you declare a static or global variable. For example:\n\n```\n// outside\
    \ any function\nconstinit auto i = 42;\n\nint getNextClassId() {\n    static constinit\
    \ int maxId = 0;\n    return ++maxId;\n}\n\nclass MyType {\n    static constinit\
    \ long max = sizeof(int) * 1000;\n};\n\n```\n\n> ¹ Thanks to Jonathan Müller for\
    \ pointing this out."
