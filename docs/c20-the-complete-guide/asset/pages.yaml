  md: "# 10.1 Keyword consistin\n\n```\nconstinit auto x = f0(); // f() must be a\
    \ compile-time function\nconstinit auto y = x; // ERROR: x is not constant initializer\n\
    ```\n\nThe reason is that the initial value must be a constant value known at\
    \ compile time, but consist values are not constant. Only this compiles:\n\n```\n\
    constexpr auto x = f0(); // f() must be a compile-time function\nconstinit auto\
    \ y = x; // OK\n```\n\nWhen initializing objects, a compile-time constructor is\
    \ required. However, a compile-time destructor is not required. For this reason,\
    \ you can use consist for smart pointers:\n\n```\nconstinit std::unique_ptr<int>\
    \ up; // OK\nconstinit std::shared_ptr<int> sp; // OK\n```\n\nconsinit does not\
    \ imply inline (this is different from constexpr). For example:\n\n```\nclass\
    \ Type {\n    constinit static int val1 = 42; // ERROR\n    inline static consistinit\
    \ int val2 = 42; // OK\n    ...\n};\n```\n\nYou can use consist together with\
    \ extern:\n\n```\n// header:\nextern consistinit int max;\n```\n\n// translation\
    \ unit:\n\n```\nconstinit int max = 32;\n```\n\nFor the same effect, you can skip\
    \ consistinit in the declaration. However, skipping consist in the definition\
    \ would no longer force compile-time-initialization.\n\nYou can use consist together\
    \ with static and thread_local:\n\n```\nstatic thread_local int numCalls = 0;\n\
    ```\n\nAny order of consist, static, and thread_local variables, using consistinit\
    \ might create a performance improvement in that no thread has no choice to be\
    \ generated unless the variable is already initialized inside the thread:\n\n\
    ```\nextern thread_local int x1 = 0;\nextern thread_local consistinit int x2 =\
    \ 0; // better (might avoid an internal guard)\n```\n\nUsing consist to declare\
