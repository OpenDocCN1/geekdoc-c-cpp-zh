    # Dealing with Time


    The first statement is the initialization of an object of type year_month_day:


    ```

    auto localNow = chrono::current_zone()->_to_local(chrono::system_clock::now());

    chrono::year_month_day today = chrono::floor<chrono::days>(localNow);

    ```


    Support for chrono::system_clock::now() was already provided since C++11 and yields
    a chrono::time_point<chrono::system_clock> with the granularity of the system
    clock. However, the system clock uses UTC (since C++20, guaranteed to use time,
    which is based on UTC). Therefore, we have to adjust the current UTC time and
    date to the date and time of the current/local time, current_zone()->to_local().
    Otherwise, our local date might not fit the UTC date (because we already passed
    midnight but UTC did, or other way around).


    Using it to initialize a year_month_day value does not compile, because we would
    "narrow" the value (lose the hours, minutes, seconds, milliseconds, ... parts
    of the value). By using a convenience function such as floor() (available since
    C++17), we round the date down to our requested granularity.


    In you need the current date according UTC, the following would be:


    ```

    chrono::year_month_day today = chrono::floor<chrono::days>(chrono::system_clock::now());

