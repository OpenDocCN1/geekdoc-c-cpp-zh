  md: "# 19.5 Private Module Fragments\n\nIf you declare a module in a primary module\
    \ unit, you might sometimes need a private module fragment. It allows programmers\
    \ to have declaration and definitions inside the module interface unit that are\
    \ not reachable by any other module or translation unit. One way to use it is\
    \ to disable exporting the class or function although its declaration is exported.\n\
    \nConsider, for example, the following module unit:\n\n```\nexport module MyMod;\n\
    \nexport class C; // class C is exported\nexport void print(const C& c); // print()\
    \ is exported\n\nclass C { // provides details of the exported class\nprivate:\n\
    \    int value;\npublic:\n    void print() const;\n};\n\nvoid print(const C& c)\
    \ { // provides details of the exported function\n    c.print();\n}\n```\n\nHere\
    \ we first declare class C and function print() with export:\n\n```\nexport module\
    \ MyMod;\n\nexport class C; // class C is exported\nexport void print(const C&\
    \ c); // print() is exported\n```\n\nexport may be specified only once at the\
    \ point where a name is introduced in its namespace. The details are also exported\
    \ later. Therefore, any translation unit can import this module and use objects\
    \ of type C:\nimport MyMod;\n\n```\nC c; // OK, definition of class C was exported\n\
    print(c); // OK (compiler can replace the function call by its body)\n```\n\n\
    However, if you want to encapsulate the definition inside the module so that importing\
    \ code only sees the declaration and you still have to define the definition in\
    \ the module interface unit, you have to place the definitions in the private\
    \ module fragment:\n\n```\nexport module MyMod;\n\nexport class C; // declaration\
