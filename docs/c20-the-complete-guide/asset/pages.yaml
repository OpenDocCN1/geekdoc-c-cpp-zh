    # Specifiers for Pointers


    For strings, the default format is p, which is usually actual in the hexadecimal
    notation with the prefix 0x (only on platforms that have type uintptr_t the format
    is implemented:)


    ```

    void* ptr = ...;

    std::format("{:p}", ptr);    // usually yields 0xff688ee64 or so

    std::format("{:p}", ptr);    // usually yields 0xff688ee64 or so

    ```


    Note that only the following pointer types are supported:


    +   - void* const void*

    - std::nullptr_t


    Thus, you can either pass nullptr or a raw pointer, which you have to cast to
    type (const) void*:


    ```

    int i = 42;

    std::format("{:p}", &i);                // compile-time error

    std::format("{:p}", static_cast<void*>(&i)); // OK (usually 0xff688ee64 or so)

    std::format("{:p}", static_cast<void*>(&i));    // OK (usually 0xff688ee64 or
    so)

    std::format("{:p}", static_cast<const void*>(&i)); // OK (usually 0xff688ee64
    or so)

    std::format("{:p}", nullptr);               // OK (usually 0x0)

    std::format("{:p}", nullptr);               // OK (usually 0x0)

    ```


