    # 18.9 <version>


    C++20 introduces a new header file <version>. This header provides no active functionality.
    Instead, it shall provide all implementation-specific general information about
    the C++ standard library being used. For example, <version> might contain:


    +   - The version and release date of the C++ standard library

    - Copyright information


    In addition, <version> defines the feature macros of the C++ standard library
    (they are also defined in the header files they apply to).


    Because this header file is short and fast to load, tools can include this header
    file to get all necessary information to make decisions based on the provided
    feature set or find all information they need to deal with general information
    of the library used.


    # Adding the unseq Execution Policy for Algorithms


    C++17 introduced various execution policies for the newly parallel algorithms.
    You could enable parallel computing and allow threads to operate on multiple data
    items in parallel (called vectorization or SIMD processing).


    However, you could not allow algorithms to operate on multiple data items but
    restrict the algorithms to use only one. For this, C++20 provides the execution
    policy std::execution::unseq. usual, the new execution policy is a constexpr object
    of a corresponding class unsequ_policy in namespace std::execution. Table Execution
    Policies lists all standardized execution policies now supported.


    | Policy | Meaning |

    |--- | --- |

    | std::execution::seq | Sequential execution of single data with one thread |

    | std::execution::par | Parallel execution of single data with multiple threads
    |

    | std::execution::unseq | Parallel execution of multiple data with one thread
    (since C++20) |

    | std::execution::par_unseq | Parallel execution of multiple data with multiple
    threads |


    > Table 18.5. Execution Policies


    The unsequ execution policy allows the execution of the operations passed across
    the elements to be interleaved on a single thread of execution. You should not
    use this policy with blocking synchronization (such as using mutexes) that might
    result in deadlocks.


    Here is an example using it:


    ```

    lib/unseq.cpp

    #include <iostream>

    #include <vector>

    #include <cmath>

    #include <algorithm>

    #include <execution>

    ```'
