    # 17.4.1 Atomic Shared Pointers


    C++11 introduced shared pointers with an optional atomic interface. With functions
    like atomic_load(), atomic_store(), and atomic_exchange() you could access the
    values to shared pointers refer concurrently. However, the problem you could solve
    this still use shared pointers with the non-atomic interface, which would then
    undermine atomic use of the shared pointers.


    C++20 now provides atomic operations for shared pointers and weak pointers:


    +   * std::atomic<std::shared_ptr<T>>

    * std::atomic<std::weak_ptr<T>>


    The former atomic API for shared/weak pointers is deprecated now.


    Note that atomic shared/weak pointers do not provide the additional operations
    atomic raw pointers provide. They provide the same API as std::atomic<> in general
    for a trivially copyable type T.


    Thread synchronization support with wait(), notify_one(), and notify_all(), is
    provided. The low-level atomic interface with the option to use the parameters
    for memory order is also supported.'
