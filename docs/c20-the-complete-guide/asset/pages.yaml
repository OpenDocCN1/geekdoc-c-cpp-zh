  md: '# Chapter 19


    # Modules


    This chapter presents the new C++20 feature modules. Modules provide a way to
    combine code from multiple files into one logical entity (module, component).
    As for classes, data encapsulation helps to provide a clear definition of the
    API of the module. As a side effect, it is possible to ensure that module code
    does not have to be compiled multiple times even if it is placed in “header files.”


    This chapter was written with tremendous help and support by Daniela Engert and
    Hendrik Niemeyer, who also gave great introductions about this topic at the Meeting
    C++ 2020 and the ACCU 2021 conference, respectively.


    # 19.1 Motivation of Modules by a First Example


    Modules allow programs to define an API for code in the large. The code might
    consist of multiple classes, multiple files, several functions, and various auxiliary
    utilities including templates. By using the keyword export you can explicitly
    specify at one location what is exported as the API of a module wrapping all code
    providing a certain functionality. Thus, we can define a clean API of a component
    implemented in various files.


    Let us look at a few simple examples that declares a module in one file and uses
    this module then in another.


    # 19.1.1 Implementing and Exporting a Module


    The specification of the API of a module is defined in its primary module interface
    unit, which each module has exactly once:

    lang/mod0.cpp


    ```

    export module Square; // declare module Square


    int square(int i);


    export class Square {

    ```'
