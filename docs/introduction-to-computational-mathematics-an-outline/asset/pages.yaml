  md: "# Centered Difference Approximation\n\n# Centered Difference\n\nSubtract $O(h^3)$\
    \ versions of Eqs (1) and (2).\n\n```\n$f(a+h) = f(a) + f'(a) \\cdot h + \\frac{1}{2!}f''(a)\
    \ \\cdot h^2 + O(h^3)$\n$f(a-h) = f(a) - f'(a) \\cdot h - \\frac{1}{2!}f''(a)\
    \ \\cdot h^2 + O(h^3)$\n$f(a+h) - f(a-h) = 2f'(a) \\cdot h + O(h^3)$\n```\n\n\
    Solve for $f'(a)$ to obtain:\nThe Centered Difference Formula\n\n> $f'(a) = \\\
    frac{f(a+h) - f(a-h)}{2h} + O(h^2). \\quad (CD)$\n\n# Example\n\n+   - Once more,\
