  md: "# Appendix III: Rate of Convergence\n\nDefinition (Rate of Convergence)\nLet\
    \ $x_n \to x^*$ and set $\\epsilon_n = |x^* - x_n|$. Then $x_n$ converges to $x^*$\
    \ with rate $r$ iff there is a positive constant $C$ (the asymptotic error constant)\
    \ such that\n$$\\lim_{n\\to\\infty} \\frac{\\epsilon_{n+1}}{\\epsilon_n^r} = C$.\n\
    \n# Terminology\n\n| Rate | Parameters |\n|---|---|\n| Sublinear | $r=1$ and $C=1$\
    \ |\n| Linear | $r=1$ and $0 < C < 1$ |\n| Superlinear | $r > 1$ |\n| Quadratic\
    \ | $r=2$ |\n| Cubic | $r=3$ |\n\nNB: Quadratic and cubic are special cases of\
    \ superlinear convergence."
