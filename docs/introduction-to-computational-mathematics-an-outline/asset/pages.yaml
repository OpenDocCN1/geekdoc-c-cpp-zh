    \ \\end{bmatrix} = \begin{bmatrix} 1 & -2 & 4 & -8 & 16 & a_0 \\ 1 & -1 & 1 &\
    \ -1 & 16   &   & & 0 & 0 & 0 &  & &  & & 1 & 1 & 1 & 1 &   &      & 16 & a_4\
    \ \\end{bmatrix}$\n```\n\n+   3. Solve via your favorite method: $p_4(x) = \\\
    frac{2}{3}x^4 - \\frac{8}{3}x^2 + 1$."
