  md: "# Taylor's Theorem\n\nDefinition (Taylor Polynomials (1712/1715$^6$))\nIf $f$\
    \ has sufficiently many derivatives at $x=a$, the Taylor polynomial of degree\
    \ $n$ (or order $n$) is\n$$p_n(x) = \\sum_{k=0}^{n} \\frac{f^{(k)}(a)}{k!}(x-a)^k$$\
    \ \nwhere $f^{(0)}(a) = f(a)$.\n\nTheorem (Taylor's Theorem)\nSuppose $f$ has\
    \ $n+1$ derivatives on a neighborhood of $a$. Then $f(x) = p_n(x) + R_n(x)$ where\n\
    $$R_n(x) = \\frac{f^{(n+1)}(c)}{n+1}(x-a)^{n+1}$$\nfor some $c$ between $x$ and\
    \ $a$.\n\n> $^6$Actually, discovered by Gregory in 1671, $\\approx 14$ years before\
    \ Taylor was born!"
  merge: -1
