    \ has 5 points, we compute a 4th degree polynomial\n$p_4(x) = a_0 + a_1x + a_2x^2\
    \ + a_3x^3 + a_4x^4$.\n\n+   2. Substitute the values of $\\mathcal{S}$ into $p_4$;\
    \ write the results as a system of linear equations.\n\n```\n$\\begin{bmatrix}\
    \ 1 \\ -1 \\ 1 \\ -1 \\ 1 \\end{bmatrix} = \begin{bmatrix} a_0-2a_1+4a_2-8a_3+16a_4\
