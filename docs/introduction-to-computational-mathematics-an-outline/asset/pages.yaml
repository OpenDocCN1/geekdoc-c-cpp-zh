  md: '# Conversions


    # Basic Base Transmogrification: Fractions


    Binary → Decimal

    (Vector version)

    Think of the binary number as a vector of 1''s and 0''s. Use a dot product to
    convert to decimal.


    +   1. $x_2 = 0.10111$


    +   2. $x_{10} = \{ 1\ 0\ 1\ 1\ 1 \} \cdot (2^{-1}\ 2^{-2}\ 2^{-3}\ 2^{-4}\ 2^{-5})$


    +   3. $x_{10} = 2^{-1} + 2^{-3} + 2^{-4} + 2^{-5} = 0.71875$


    Decimal → Binary

    (Algebra version)

    Successively compute the bits (from left to right)


    +   1. $bit = [2x]$

    then set $x = \text{frac}(2x)$


    +   2. Repeat until $x=0$ (or when reaching maximum length)


    E.g., $x_{10} = 0.71875$

    $b_{-1} = 1$; then set $x = 0.43750$

    $b_{-2} = 0$; $x = 0.87500$

    $b_{-3} = 1$; $x = 0.75000$

    $b_{-4} = 1$; $x = 0.50000$

    $b_{-5} = 1$; $x = 0.0$ Stop


    Whence $x_2 = 0.10111$'
