  md: '# The CORDIC Algorithm


    In 1959, Jack Volder designed a way to compute trigonometric functions very quickly,
    the CORDIC algorithm,3 while working on digitizing the navigation system of the
    B58 Hustler, the Mach 2-capable supersonic bomber. During the ''70s, John Walther
    extended CORDIC to compute exponentials, logs, and hyperbolic trigonometric functions.
    The algorithm became the standard for calculators (using BCD).


    # CORDIC Recurrence Equations


    ```

    $x_{k+1} = x_k - 2^{-k}m\delta_k y_k$

    ny_{k+1} = y_k + 2^{-k}\delta_k x_k$

    z_{k+1} = z_k - \delta_k \sigma_k$$

    ```


    where $m=1$ (trig), $0$ (arith), or $-1$ (hypertrig), $\delta_k=\pm1$, and $\sigma_k$
    is a scaling factor.'
  merge: -1
  pgno: 190
