  md: '# # Newton Interpolation


    # Newton Basis Polynomials


    In order to make it easy to add a new knot, we change the set of basis polynomials.
    Given a set of $n+1$ knots, $\{x_k\}$, set


    ```

    $N_0(x) = 1$

    $N_1(x) = (x - x_0)$

    $N_2(x) = (x - x_0)(x - x_1)$

    $N_3(x) = (x - x_0)(x - x_1)(x - x_2)$

    $:$

    $N_n(x) = (x - x_0)(x - x_1) \cdots (x - x_{n-1})$

    ```


    Now let


    ```

    $P_n(x) = \sum_{k=0}^{n} a_k N_k(x)$

    ```


    Note that $\mathcal{B}_N = \{N_k(x) | k = 0..n\}$ forms a basis for $\mathbb{P}_n$.'
  merge: -1
  pgno: 162
