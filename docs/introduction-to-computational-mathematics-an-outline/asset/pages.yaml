    |

    | Halley''s method | Approximating (1 pt) | $H(x_n) = x_n - \frac{2f(x_n)f''(x_n)}{2[f''(x_n)]^2-f(x_n)f''''(x_n)}$
    |


    | Method | Error | Convergence Speed | Computation Cost |

    | --- | --- | --- | --- |

    | Bisection | $\epsilon_{n+1} \leq \frac{1}{2}\epsilon_n$ | Linear (order 1) |
    Low |

    | Regula Falsi | $\epsilon_{n+1} \leq C\epsilon_n$ | Linear (order 1) | Medium
    |

    | Secant method | $\epsilon_{n+1} \leq C\epsilon_n\epsilon_{n-1}$ | Superlinear
