    Let $\mathcal{S} = \{[-2,1], [-1,-1], [0,1], [1,-1], [2,1]\}$.


    Begin by building a *difference tableau*.


    | x | -2 | -1 | 0 | 1 | 2 |

    |---|---|---|---|---|---|n| y | 1 | -1 | 1 | -1 | 1 |

    | $[y_0]$ | 1 | -1 | 1 | -1 | 1 |

    | $[y_0,y_1]$ | | | -2 | -2 | 2 |

    | $[y_0,y_1,y_2]$ | | | 2 | -2 | 2 |

    | $[y_0,y_1,y_2,y_3]$ | | | | -4/3 | 4 |

    | $[y_0,y_1,y_2,y_3,y_4]$ | | | | | 2/3 |


    Then $P_4(x) = \sum_{k=0}^{n} [y_0, \dots, y_k]N_k(x)$


    $1-2(x+2)+2(x+2)(x+1)-\frac{4}{3}(x+2)+\frac{2}{3}(x+2)(x+1)(x)(x-1)$


