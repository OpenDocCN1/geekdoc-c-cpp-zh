  md: '# Newton''s Method Pseudocode


    ```

    input : x0, eps, n

    extern: f(x), df(x)=f''(x)

    1: fx0 ← f(x0);

    2: dfx0 ← df(x0);

    3: for i ← 1 to n do

    4:     x1 ← x0 - fx0/dfx0;

    5:     fx1 ← f(x1);

    6:     if |fx1| + |x1-x0| <eps then

    7:         return: x1

    8:     x0 ← x1;

    9:     fx0 ← fx1;

    10:    dfx0 ← df(x0)

    return: x1

    ```'
