    \ $bit = x \\mod 2$\nthen set $x = [x/2]$\n2. Repeat until $x = 0$\n\nE.g., $x_{10}\
    \ = 46$\n$b_0 = 0$; then set $x = 23$\n$b_1 = 1$; $x = 11$\n$b_2 = 1$; $x = 5$\n\
    $b_3 = 1$; $x = 2$\n$b_4 = 0$; $x = 1$\n$b_5 = 1$; $x = 0$\n\nWhence $x_2 = 101110$"
