  md: "# Example: Euler's Method as a Loop\n\nEuler's Method\nnThe solution to a differential\
    \ equation $y' = f(x,y)$ can be approximated using the differential triangle.\
    \ Calculate the next point from the current point $(x_k, y_k)$ by following the\
    \ tangent line for a step $\\Delta x = h$. Then the new point is $(x_{k+1}, y_{k+1})\
    \ = (x_k + h, y_k + h \\cdot y'(x_k, y_k))$.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_45_0.png)\n\
    \nImplement Euler's method as a loop:\n\n+   * Define the derivative function\
    \ $y' = f(x,y)$\nGet the initial point $(x_0, y_0)$\nGet the stepsize $h$\nDetermine\
    \ the number of steps $n = (b-a)/h$\nfor i from 1 to n do\n  * Compute $x_{k+1}\
    \ = x_k + h$ and $y_{k+1} = y_k + h \\cdot y'(x_k, y_k)$\n  end do\nReturn the\
    \ collection of points $\\{(x_i, y_i)\\}_{i=0}$"
