  md: '# The Newton Coefficients


    Calculating the $a_k$''s


    For a set of $n+1$ data points $\{[x_k, y_k]\}$, define the (forward) divided

    differferences recursively as


    Then the Newton interpolating polynomial is


    $$P_n(x) = [y_0] + [y_0, y_1](x-x_0) + [y_0, y_1, y_2](x-x_0)(x-x_1)$$n$$+ [y_0,
    y_1, y_2, y_3](x-x_0)(x-x_1)(x-x_2) + \dots$$n$$= \sum_{k=0}^n [y_0, \dots, y_k]N_k(x).$$'
