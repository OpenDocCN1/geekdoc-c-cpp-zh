    Build flow charts for the Maple code shown below:


    | Algorithm 1. | Algorithm 2. |

    |---|---|

    | n := 12; | n := 12; |

    | r := 1; | R := n; |

    | for i from 2 to n do | j := n - 1; |

    | r := r · i; | while j > 1 do |

