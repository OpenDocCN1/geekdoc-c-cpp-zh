  md: '# # Conversions


    ## Terminating Expansions?

    When does a fraction''s expansion terminate?

    Base 10: A decimal fraction terminates when $r = \frac{n}{10^p} = \frac{n}{2^p
    \cdot 5^p}$.nBase 2: A binary fraction terminates when $r = \frac{m}{2^p}$.


    +   ### Examples

    1. $\frac{1}{10} = 0.1\overline{10} = 0.00011_2$

    2. $\frac{1}{3} = 0.\overline{3}_{10} = 0.0\overline{1}_2$

    3. $\sqrt{2} \dote 1.4142135623730950488_{10} \dote 1.011010100001001111_2$

    4. $\pi \dote 3.1415926533897932385_{10} \dote 11.0010010000111111011_2$'
