  md: '# Appendix I: Taylor’s Theorem


    Methodus Incrementorum Directa et Inversa (1715)¹


    In 1712, Taylor wrote a letter containing his theorem without proof to Machin.
    The theorem appears with proof in Methodus Incrementorum as Corollary II to Proposition
    VII. The proposition is a restatement of “Newton’s [interpolation] Formula.” Maclaurin
    introduced the method (undet coeffs; order of contact) we use now to present Taylor’s
    theorem in elementary calculus classes in A Treatise of Fluxions (1742) §751.


    Corollary (Maclaurin''s Corollary II (pg 23))


    If for the evanescent increments, the fluxions that are proportional to them are
    written, the quantities $v, v'', v'''', v'''''', v''''''''$, &c. being now made
    all equal to the time $z$ uniformly flows to $z+v$, then $x$ will become

    $$x+\dot{x}\frac{v}{1\dot{z}}+\ddot{x}\frac{v^2}{1.2\dot{z}^2}+\dddot{x}\frac{v^3}{1.2.3\dot{z}^3}
    +&c.$$


    +   - Investigate the connection between synthetic division and Taylor expansions.


    > ¹See Ian Bruce''s annotated translation.'
