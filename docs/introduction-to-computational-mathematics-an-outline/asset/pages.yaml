  md: '# Binary Coded Decimal


    # BCD


    The digits 0 to 9 can be represented with four binary bits:


    | x | x | x | x |

    | 8 | 4 | 2 | 1 |


    For example, $93_{10}$ would be 93


    | BCD: | 1 | 0 | 0 | 1 | 0 | 0 | 1 | 1 | vs. | Binary: | 0 | 1 | 0 | 1 | 1 | 1
    | 0 | 1 |

    | 8 | 4 | 2 | 1 | 8 | 4 | 2 | 1 | | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    # Advantages


    # Disadvantages


    +   - Eliminates some repeating expansions

    - Rounding is simpler

    - Displaying values easier


    +   - Fewer numbers per 8 bits (100/256 $\approx$ 39%)

    - Complicated arithmetic routines

    - Slower to compute


    Nearly all calculators use BCD formats.'
