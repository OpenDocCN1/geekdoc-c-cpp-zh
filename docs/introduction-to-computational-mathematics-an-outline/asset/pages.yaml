  md: "# Appendix V: TI's Solving Algorithm\n\n# Bisection and Secant Combined\n\n\
    The solve function and the Solver application use a clever, modified combination\
    \ of the secant method and bisection.3 The logic is:\n\n+   1. Order the bracketing\
    \ points $a$ and $b$ so that $|f(b)| \\le |f(a)|$.\n2. Calculate a new point $c$\
    \ using the secant method.\n3. If $c$ is:\n   a. outside the interval, replace\
    \ $c$ with the midpoint (bisection),\n   b. too close to an endpoint (within $h$),\
    \ replace $c$ with $c=b \\pm h$, a specified minimum step in the interval.\n4.\
    \ The new bracketing points are $a \\& c$ or $b \\& c$, whichever pair has the\
    \ sign change.\n5. If the error tolerance is met or the number of iterations is\
    \ maximum, then return $c$, otherwise, go to Step 1.\n\n> 3 “Solve() uses a combination\
    \ of bisection and the secant method, as described in Shampine and Allen Numerical\
    \ Computing: An Introduction, Saunders, 1973\" (pp. 96–100 and 244) according\
    \ to the TI 85 Knowledge Base."
