  md: '# Types of Loops


    Loop Types

    Counting Loops: For loops perform an action a pre-specified number of times.

    Condition Loops: While loops perform an action as long as a given condition is
    true.


    +   Examples

    - For each employee, calculate their monthly pay.

    - For each integer $i$ less than $n$, compute the $i$th number in the Fibonacci
    sequence.

    - While the current remainder in the Euclidean algorithm is greater than 1, calculate
    the next remainder.

    - While the game isn''t over, process the user''s input.'
