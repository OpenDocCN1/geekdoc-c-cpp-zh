  md: '# The Collatz Conjecture Project


    # Lothar Collat''s Proposition


    Lothar Collat posed a problem in 1937 that is quite simple to state, but that
    still eludes proof. For any positive integer $n$, define the sequence


    ```

    $a_1 = n \quad and \quad a_{k+1} = \begin{cases} \frac{1}{2}a_k & \text{if } a_k
    \text{ is even} \ 3a_k + 1 & \text{if } a_k \text{ is odd} \end{cases} \quad for
    k > 1$

    ```


    Collatz conjectured the sequence would always reach 1 no matter the starting value
    $n \in \mathbb{N}$.


    # Conjecture (Collatz''s $3n+1$ Problem)


    For every $n \in \mathbb{N}$, there is a $k \in \mathbb{N}$ such that the sequence
    above has $a_k = 1$.


    # Currently...


    The conjecture has been verified for all starting values up to $87 \cdot 2^{60}$.\nRead
    "The $3x+1$ Problem" by J. Lagarias (January 1, 2011 version) and check Eric Roosendaal''s
    web site http://www.ericr.nl/wondrous/.'
  merge: -1
