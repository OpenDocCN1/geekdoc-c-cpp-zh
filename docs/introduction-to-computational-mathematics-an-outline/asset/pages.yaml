- img_proc: true
  md: '# # Newton''s Method Algorithm


    # Algorithm (Newton''s Method (Basic Outline))


    Given $f$ and $x_0$.


    +   1. Set $k = 1$ and $N(x) = x - \frac{f(x)}{f''(x)}$

    2. Compute $x_k = N(x_{k-1})$.

    3. If $f(x_k) \approx 0$, then $x_k$ is a root; quit

    4. else if $|f(x_k)|$ or $|x_k - x_{k-1}|$ is very small, then $x_k \approx$ a
    root; quit

    5. Set $k = k+1$ and (if $k$ isn''t too big) go to 2.'
