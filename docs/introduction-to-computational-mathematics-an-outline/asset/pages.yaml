  md: '# Interlude: Splines


    # Splines


    Lagrange and Newton polynomials oscillate excessively when there are a number
    of closely spaced knots. To alleviate the problem, use “splines,” piecewise, smaller-degree
    polynomials with conditions on their derivatives. The two most widely used splines:


    Bézier splines are piecewise Bernstein polynomials [Casteljau (1959) and Bézier
    (1962)].


    Cubic B-splines are piecewise cubic polynomials with second derivative equal to
    zero at the joining knots [Schoenberg (1946)].


    Along with engineering, drafting, and CAD, splines are used in a wide variety
    of fields. TrueType fonts use 2-D quadratic Bézier curves. PostScript and MetaFont
    use 2-D cubic Bézier curves.'
