    | Method | Type | Update Function |

    | --- | --- | --- |

    | Bisection | Bracketing (2 pts) | $B(a,b) = \frac{1}{2}(a+b)$ |

    | Regula Falsi | Bracketing (2 pts) | $R(a,b) = \frac{af(b)-bf(a)}{f(b)-f(a)}$
