  md: "# Newton-Raphson Method\n\n# Newton-Raphson Method²\n\nIf a function $f$ is\
    \ \"nice,\" use the tangent line to approximate $f$. The root of the tangent line\
    \ — easy to find — approximates the root of $f.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_99_0.png)\n\
    \n+   1. $f(x) = f(a) + f'(a)(x - a)$\n2. Set $f(x) = 0$; solve for $x$:\n\n$x\
    \ = a - \frac{f(a)}{f'(a)}$\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_99_1.png)\n\
    \n+   3. Set $N(x) = x - \frac{f(x)}{f'(x)}$. Then\n\n$x_{n+1} = N(x_n)$"
