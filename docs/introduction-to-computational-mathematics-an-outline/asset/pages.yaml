  md: "# Conversions\n\n# Basic Base Transmogrification: Integers\n\n**Binary $\r\
    ightarrow$ Decimal**\n*(Vector version)\nThink of the binary number as a vector\
    \ of 1's and 0's. Use a dot product to convert to decimal.\n\n**Decimal $\rightarrow$\
    \ Binary**\n*(Algebra version)\nSuccessively compute the bits (from right to left)\n\
    \n+   1. $x_2 = 101110$\n2. $x_{10} = \\{1\\ 0\\ 1\\ 1\\ 1\\ 0\\}\\cdot{\\{2^5\\\
