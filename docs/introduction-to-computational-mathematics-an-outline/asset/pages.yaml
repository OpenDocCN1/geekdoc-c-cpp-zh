  md: '# Spline Fit to a Transition Curve


    # Transition Curves


    A transition curve is a section of highway or railroad track used to go from a
    straight section into a curve. A transition curve is designed to prevent sudden
    changes in lateral acceleration, which would occur with a circular segment, by
    smoothly transitioning into and out of a curve. The basic transition curve parametric
    function $\mathcal{F}(t)$ uses the Fresnel sine and cosine integrals


    ```

    $C(t) = \int_0^t \cos\left(\frac{1}{2}\pi t^2\right) dt \quad S(t) = \int_0^t
    \sin\left(\frac{1}{2}\pi t^2\right) dt$

    ```


    to give $\mathcal{T}(t) = [C(t), S(t)]$. These integrals do not have elementary
    antiderivatives, and must be evaluated numerically.

    A segment from the spiral $\mathcal{T}$ forms a transition curve which will provide
    a smooth transition without a sudden change in lateral acceleration.

    Graph $C$ and $S$ to see their respective behaviors.


    This project will investigate using splines to lay out a roadbed.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_208_0.png)'
