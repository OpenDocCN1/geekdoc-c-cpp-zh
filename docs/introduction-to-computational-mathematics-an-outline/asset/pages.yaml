  md: '# # Halley''s Method Error


    Theorem


    Let $f \in \mathcal{C}^3(I)$ on some interval $I \subset \mathbb{R}$. Suppose
    $\alpha \in I$ is a root of $f$.

    Choose $x_0 \in I$ and define


    ```

    $x_{n+1} = x_n - \frac{2f(x_n)f''(x_n)}{2f''(x_n)^2 - f(x_n)f''''(x_n)}.$

    ```


    Then


    ```

    $|\alpha - x_{n+1}| \le M \cdot |\alpha - x_n|^3$

    ```


    or, with $\epsilon_n = |\alpha - x_n|$,


    ```

    $\epsilon_{n+1} \le M \cdot \epsilon_n^3$

    ```


    where $M$ is an upper bound for $\frac{3f''''(x)^2-2f''(x)f''''(x)}{12f''(x)^2}$
    on $I$.


    This is called cubic or “order 3” convergence.'
