  md: "# Floating Point Numbers\n\n> Definition (Floating Point Representation)\n\
    nA number $x$ is represented (and approximated) as\n$x = \\sigma \\times f \\\
    times \\beta^{e-p}$\nwhere\n$\\sigma$: sign $\\pm1$, $f$: mantissa, $\beta$: base,\
    \ usually 2, 10, or 16\n$\\e$: biased exponent (shifted), $p$: exponent's bias\
    \ (shift)\nnThe standard floating point storage format is\n\n| $\\sigma$ | $e$\
    \ | $f$ |\n\n# Exponent Bias\n\nThe bias value is chosen to give equal ranges\
    \ for positive and negative exponents without needing a sign bit. E.g., for an\
    \ exponent with\n\n+   8 bits: $0 \\le e \\le 255 = 2^8 - 1$. Use $p = 2^8/2 -\
    \ 1$ gives an exp range of $-127 \\le e - 127 \\le 128$.\n11 bits: $0 \\le e \\\
    le 2047 = 2^{11} - 1$. Use $p = 2^{11}/2 - 1 = 1023$ gives $-1023 \\le e - 1023\
    \ \\le 1024$."
