  md: '# Horner''s Form


    # Partial Factoring


    William Horner studied solving algebraic equations and efficient forms for computation.
    Horner observed that partial factoring simplified a polynomial calculation. Consider:


    Standard Form $\Leftrightarrow$ Horner''s Form

    $1+2x = 1+2x$

    $1 add+1 mult 1 add+1 mult


    $1+2x+3x^2 = 1+x\cdot(2+3x)$

    $2 add+3 mult 2 add+2 mult


    $1+2x+3x^2+4x^3 = 1+x\cdot(2+x\cdot[3+4x])$

    $3 add+6 mult 3 add+3 mult


    $1+2x+3x^2+4x^3+5x^4 = 1+x\cdot(2+x\cdot[3+x\cdot(4+5x)])

    $4 add+10 mult 4 add+4 mult


    $1+2x+3x^2+4x^3+5x^4+6x^5 = 1+x\cdot(2+x\cdot[3+x\cdot(4+x\cdot[5+6x])])

    $5 add+15 mult 5 add+5 mult


    # What are the patterns?'
  merge: -1
