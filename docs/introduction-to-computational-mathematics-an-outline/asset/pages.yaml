  md: '# Secant Method Error


    > Theorem

    Let $f \in C^2(I)$ for some interval $I \subset \mathbb{R}$. Suppose $\alpha \in
    I$ is a root of $f$.

    Choose $x_0$ and $x_1 \in I$, and define

    $$x_{n+1} = x_n - f(x_n) \cdot \frac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})}$$

    Then

    $$|\alpha - x_{n+1}| \le M \cdot |\alpha - x_n| \cdot |\alpha - x_{n-1}|$$

    or, with $\epsilon_n = |\alpha - x_n|$,,

    $$\epsilon_{n+1} \le M \cdot \epsilon_n \cdot \epsilon_{n-1}$$

    where $M$ is an upper bound for $\frac{1}{2}|f''''(x)/f''(x)|$ on $I$.


    This is superlinear convergence of “order 1.6.” (Actually, it''s order $\frac{1+\sqrt{5}}{2}$
    )'
