  md: "# Properties\n\n# Floating Point Arithmetic Properties\n\nCommutative: Addition\
    \ is commutative:\n$n_1 + n_2 = n_2 + n_1$\n\nMultiplication is commutative:\n\
    $n_1 \times n_2 = n_2 \times n_1$\n\nNonassociative: Addition is **not** associative:\n\
    $(n_1 + n_2) + n_3 \neq n_1 + (n_2 + n_3)$\n\nMultiplication is **not** associative:\n\
    $(n_1 \times n_2) \times n_3 \neq n_1 \times (n_2 \times n_3)$\n\nNondistributive:\
    \ Multiplication does **not** distribute over addition:\n$n_1 \times (n_2 + n_3)\
    \ \neq (n_1 \times n_2) + (n_1 \times n_3)$"
