- img_proc: true
  md: '# Proving Taylor''s Theorem


    Proof. (Taylor''s Theorem — Outline).


    +   1. The FToC $\Rightarrow f(x) = f(a) + \int_{0}^{x-a} f''(x-t) dt$.

    2. Integrate by parts with $u = f''(x-t)$ and $dv = dt$:


    $f(x) = f(a) + f''(a)(x-a) + \int_{0}^{x-a} f''''(x-t) \cdot t dt.$

    3. Repeat the process: choose $u = f^{(k)}(x-t)$ and $dv = t^{k-1}/(k-1)!$ to
    arrive at


    $f(x) = f(a) + f''(a)(x-a) + \frac{f''''(a)}{2!}(x-a)^2 + \dots + \frac{f^{(n)}(a)}{n!}(x-a)^n
    + R_n(a,x)$

    where

    $R_n(a,x) = \frac{1}{n!}\int_{0}^{x-a} f^{(n+1)}(x-t) \cdot t^n dt.$'
  merge: -1
