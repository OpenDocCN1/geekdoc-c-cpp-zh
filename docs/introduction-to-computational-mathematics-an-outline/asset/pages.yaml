  md: '# Further Reductions


    # Chebyshev’s Polynomials


    Pafnuty L. Chebyshev worked in number theory, approximation theory, and statistics.
    The special polynomials named for him are the Chebyshev Polynomials $T_n(x)$,
    which have many interesting properties. For example, $T_n$ is even or odd with
    $n$, oscillates between $-1$ and $1$ on the interval $[-1, 1]$, and also has all
    its zeros in $[-1, 1]$. The Horner form of $T_n$ is quite interesting. Let $u
    = x^2$, then:


    ```

    $-3x+4x^3 \iff x(-3+4x^2) = x(-3+4u)$


    $1-8x^2+8x^4 \iff 1+u(-8+8u)$


    $5-20x^3+16x^5 \iff x(5+u[-20+16u])$


    $-1+18x^2-48x^4+32x^6 \iff -1+u(18+u[-48+32u])$


    $-7x+56x^3-112x^5+64x^7 \iff ?


    $1-32x^2+160x^4-256x^6+128x^8 \iff ?$

    ```'
