  md: '# # Newton''s Method Error


    > ### Theorem

    Let $f \in \mathcal{C}^2(I)$ on some interval $I \subset \mathbb{R}$. Suppose
    $\alpha \in I$ is a root of $f$.

    Choose $x_0 \in I$ and define

    $$x_{n+1} = x_{n} - \frac{f(x_n)}{f''(x_n)}$$nThen

    $$|\alpha - x_{n+1}| \le M \cdot |\alpha - x_n|$$

    or, with $\varepsilon_n = |\alpha - x_n|,\n$$\varepsilon_{n+1} \le M \cdot \varepsilon_n^2$$

    where $M$ is an upper bound for $\frac{1}{2}|f''''(x)/f''(x)|$ on $I$.


    This is called quadratic or "order 2" convergence.'
  merge: -1
