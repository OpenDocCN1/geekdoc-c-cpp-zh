  md: '# Regula Falsi


    # Regula Falsi


    The *regula falsi*, or “false position,” method⁴ is very old; the Egyptians used
    the concept. The method appears in the Vaishali Ganit (India, 3rd century BC),
    Book on Numbers and Computation & Nine Chapters on the Mathematical Art (China,
    2nd century BC), Book of the Two Errors (Persia, c. 900), and came to the west
    in Fibonacci’s Liber Abaci (1202).


    Regula falsi combines the secant and bisection techniques: Use the secant to find
    a “middle point,” then keep the interval with a sign change, i.e., that brackets
    the root.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_107_0.png)


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_107_1.png)


    > ⁴Also called Modified Regula Falsi, Double False Position, Regula Positionum,
    Secant Method, Rule of Two Errors, etc. My favourite name is Yíng bù zú: “Too
    much and not enough.”'
  merge: -1
  pgno: 107
