  md: '# Halley''s Method Algorithm


    # Algorithm (Halley’s Method (Basic Outline))


    Given $f$ and $x_0$.


    +   0. Compute $f''$ and $f''''$.


    +   1. Set $k = 1$ and $H(x) = x - \frac{2f(x)f''(x)}{f''(x)^2 - f(x)f''''(x)}$.


    +   2. Compute $x_k = H(x_{k-1})$.


    +   3. If $f(x_k) \approx 0$, then $x_k$ is a root; quit


    +   4. else if $|f(x_k)|$ or $|x_k - x_{k-1}|$ is very small, then $x_k \approx$
    a root; quit


    +   5. Set $k = k+1$ and (if $k$ isn''t too big) go to 2.'
