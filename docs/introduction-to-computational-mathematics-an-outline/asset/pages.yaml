    \ Mode |\n|---|---||\n| | $\\delta_k = \text{sgn}(z_k)$ $(z_k \to 0)$ | $\\delta_k\
    \ = -\text{sgn}(y_k)$ $(y_k \to 0)$ |\n| $m = 1$ | $\\langle x_0, y_0, z_0 \r\
    angle = \\langle K, 0, \theta \rangle$ $x_n \to \\cos(\theta)$; $y_n \to \\sin(\t\
