  md: '# # Preface: Is Computation Important?


    A simple computational error can cause very serious problems.


    # The Mars Climate Orbiter Crash


    Two teams used different units of measure when writing the Orbiter’s software:
    NASA used the metric system, and Lockheed Martin used the Imperial system. Read
    NASA’s Mars Climate Orbiter page.


    # The Ariane 5 Explosion


    The European Space Agency’s Ariane 5 rocket exploded 37 seconds after takeoff;
    the explosion was caused by an integer overflow in the software used for launching
    the rocket. Watch the launch video.


    # The Gulf War Dhahran “Scud” Missile Attack


    The Patriot missile software measured time in binary and decimal based on the
    system clock that used 10th’s of a second, a non-terminating fraction in binary.
    After running for over 100 hours, the system was inaccurate. Twenty-eight U.S.
    soldiers died when the system failed to track a Scud missile fired from Iraq.
    Read Michael Barr’s “Leth Software Defects: Patriot Missile Failure.”'
  merge: -1
