  md: '# TI Floating Point Software


    TI Floating Point Software

    There are six RAM locations called the Floating Point Registers OP1 to OP6;

    each is 11 bytes (with 9 byte mantissas); they are used extensively for floating

    point computations. The routines listed below, called in assembly programs,

    operate on the value in OP1 unless noted.


    TI''s operating system² includes the functions:


    | Standard Function | |

    |---|---|

    | FPAdd (OP1+OP2) Ceiling | Sin ASIn |

    | FPSSub (OP1–OP2) Int | Cos ACos |

    | FPRecip (1/OP1) Trunc | Tan ATan |

    | FPMult (OP1×OP2) Frac | SinH ASinH |

    | FPDiv (OP1÷OP2) Round | CosH ACosH |

    | FPSquare (OP1×OP1) RndGuard (to 10 d) | TanH ATnH |

    | SqRoot RnFx (to FIX) | LnX EToX |

    | Factorial (n·0.5 ≧ -0.5) Random | LogX TenX (10⁰OP1) |

    | Max(OP1, OP2) RandInt | |

    | Min(OP1, OP2) |'
