  md: '# S III. Case Study: TI Calculator Numerics


    # Introduction


    Texas Instruments started a research project in 1965 to design a pocket calculator.
    The first pocket calculators appeared in the early 1970s from the Japanese companies
    Sanyo, Canon, and Sharp. The HP-35 (it had 35 keys) was the first scientific pocket
    calculator, introduced by Hewlett Packard in 1972 for $395. In 1974, HP released
    the HP-65 ($795), the first programmable pocket calculator.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_173_0.png)


    Texas Instruments'' TI-8x series is based on the Zilog Z-80 processor (1976),
    an 8-bit CPU originally running at 2 MHz. The TI-81 came out in 1990 with a 2
    MHz Z80 and 2.4 KB RAM. The TI-84 Plus CE (released in 2015) has a 48 MHz Z80
    with 4 MB Flash ROM and 256 KB RAM. In 2013, the calculators'' displays upgraded
    to 320 × 240 pixels from the 1990''s 96 × 64 pixels.¹


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_173_1.png)


    > ¹TI''s Nspire calculators use an ARM processor.'
  merge: -1
