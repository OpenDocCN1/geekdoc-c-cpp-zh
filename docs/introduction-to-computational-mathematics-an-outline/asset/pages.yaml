  md: "# Interlude: Bernstein Polynomials\n\n# Definition (Bernstein Polynomials of\
    \ $f$)\n\nBernstein Basis Polynomials: $b_{n,k}(x) = \binom{n}{k}x^k(1-x)^{n-k}$\
    \ for $k=0..n$\n\nBernstein Polynomial of $f$: Let $f:[0,1] \\to \\mathbb{R}$.\
    \ Then\n\n$B_n(f) = \\sum_{k=0}^n f\\left(\\frac{k}{n}\\right)\\binom{n}{k}x^k(1-x)^{n-k}$\n\
    \n$\textbf{Note: If $g:[a,b] \\to \\mathbb{R}$, then use $f(x)=g(a+(b-a)x)$.\n\
    \n# Example\n\nLet $f(x)=x^3$ for $x \\in[0,1]$. Then $B_n(f) = \\sum_{k=0}^n\
    \ \\frac{k^3}{n^3}\\binom{n}{k}x^k(1-x)^{n-k}$\n\n$B_1(x)=x \\quad\\quad\\ B_2(x)=\\\
    frac{1}{4}x+\\frac{3}{4}x^2$\n\n$B_3(x)=\\frac{1}{9}x+\\frac{2}{3}x^2+\\frac{1}{9}x^3\
    \ \\quad\\quad B_4(x)=\\frac{1}{16}x+\\frac{9}{16}x^2+\\frac{3}{8}x^3$"
