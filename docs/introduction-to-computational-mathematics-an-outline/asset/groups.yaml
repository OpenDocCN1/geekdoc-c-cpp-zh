  - '[PAGE 111]


    # Halley''s Method


    Halley''s method^5 of 1694 extends Newton’s method to obtain cubic convergence.
    Halley was motivated by de Lagny''s 1692 work showing algebraic formulas for extracting
    roots. Using the quadratic term in Taylor''s formula obtains the extra degree
    of convergence. Just as Newton did not recognize the derivative appearing in his
    iterative method, Halley also missed the connection to calculus — it was first
    seen by Taylor in 1712. The version of Halley’s method we use comes from applying
    Newton’s method to the auxiliary function


    $$g(x) = \frac{f(x)}{\sqrt{|f''(x)|}}$$$


    Then the iterating function for Halley''s method is


    $$x_{n+1} = x_n - \frac{2f(x_n)f''(x_n)}{2f''(x_n)^2 - f(x_n)f''''(x_n)}$$$


    ^5For historical background and a nice development, see Scavo and Thoo, “On the
    Geometry of Halley’s Method,” Am. Math. Mo., Vol. 102, No. 5, pp. 417–426.'
  - '[PAGE 112]


    # # Halley''s Method Error


    Theorem


    Let $f \in \mathcal{C}^3(I)$ on some interval $I \subset \mathbb{R}$. Suppose
    $\alpha \in I$ is a root of $f$.

    Choose $x_0 \in I$ and define


    ```

    $x_{n+1} = x_n - \frac{2f(x_n)f''(x_n)}{2f''(x_n)^2 - f(x_n)f''''(x_n)}.$

    ```


    Then


    ```

    $|\alpha - x_{n+1}| \le M \cdot |\alpha - x_n|^3$

    ```


    or, with $\epsilon_n = |\alpha - x_n|$,


    ```

    $\epsilon_{n+1} \le M \cdot \epsilon_n^3$

    ```


    where $M$ is an upper bound for $\frac{3f''''(x)^2-2f''(x)f''''(x)}{12f''(x)^2}$
    on $I$.


    This is called cubic or “order 3” convergence.'
