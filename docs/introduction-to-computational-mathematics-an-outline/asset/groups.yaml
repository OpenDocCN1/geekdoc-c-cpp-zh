    # Patterns


    # Observations


    +   - Each of the formulas has the same form: a weighted sum


    $A_n = w_1 \cdot f(x_1) + w_2 \cdot f(x_2) + \cdots + w_n \cdot f(x_n)$

    with different sets of weights $w_i$ and different sets of nodes $x_i$.

    - Any closed interval can be mapped to and from $[-1, 1]$, so we can focus just
    on $\int_{-1}^{1} f(x) dx. \quad T(t) = 2\frac{t-a}{b-a} - 1; \quad T^{-1}(t)
    = a(\frac{1+t}{2}) + b(\frac{1-t}{2})$

    - Gauss posed the question: Is there a “best choice” of weights $\{w_i\}$ and
    nodes $\{x_i\}$? Do nodes have to be equidistant?

    - The answer depends on what “best” means.


    Since we have $2n$ unknowns $w_i$ and $x_i$, let''s look for a set that integrates
    a $2n-1$ degree polynomial exactly. (Remember: a $2n-1$ degree polynomial has
    $2n$ coefficients.)'
  - '[PAGE 138]


    # Sampling 3


    # Example (Third Degree)


    Set $n = 3$. Determine the choice of $w_i$ and of $x_i$ so that


    $$\int_{-1}^{1} x^p dx = \sum_{k=1}^{3} w_k \cdot x_k^p$


    exactly for $p = 0, 1, \dots, 5 = 2 \cdot 3 - 1$.


    The range for the power $p$ gives us six equations:


    ```

    $$\begin{cases} w_1 + w_2 + w_3 &= 2 \ w_1 x_1 + w_2 x_2 + w_3 x_3 &= 0 \ w_1
    x_1^2 + w_2 x_2^2 + w_3 x_3^2 &= \frac{2}{3} \ w_1 x_1^3 + w_2 x_2^3 + w_3 x_3^3
    &= 0 \ w_1 x_1^4 + w_2 x_2^4 + w_3 x_3^4 &= \frac{2}{5} \ w_1 x_1^5 + w_2 x_2^5
    + w_3 x_3^5 &= 0 \end{cases} \implies \begin{cases} x_1 = -\sqrt{\frac{3}{5}},
    & x_2 = 0, & x_3 = \sqrt{\frac{3}{5}} \ w_1 = \frac{5}{9}, & w_2 = \frac{8}{9},
    & w_3 = \frac{5}{9} \end{cases}$

    ```


    Our Gaussian quadrature is $G_3(f) = \frac{5}{9} f\left(-\sqrt{\frac{3}{5}}\right)
    + \frac{8}{9} f(0) + \frac{5}{9} f\left(\sqrt{\frac{3}{5}}\right)$.'
