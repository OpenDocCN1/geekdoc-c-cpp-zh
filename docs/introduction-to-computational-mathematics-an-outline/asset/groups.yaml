    theta)$; $y_n \\to \\sin(\\theta)$ | $z_n \\to \\tan^{-1}(y/x)$ |\n| $m = 0$ |\
    \ $\\langle x_0, y_0, z_0 \\rangle = \\langle x, 0, z \\rangle$ $y_n \\to x \\\
