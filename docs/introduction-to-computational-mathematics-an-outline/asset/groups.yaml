    langle K', 0, \\theta \\rangle$ $x_n \\to \\cosh(\\theta)$; $y_n \\to \\sinh(\\\
    theta)$ | $z_n \\to \\tanh^{-1}(y/x)$ |\n| （重复 $\\sigma_k$） | $\\langle x_0, y_0,\
    \ z_0 \\rangle = \\langle w+1, w-1, 0 \\rangle$ $x_n + y_n \\to e^\\theta$ | $z_n\
    \ \\to \\frac{1}{2}\\ln(w)$ |\n| | $K = \\prod_{j=0}^n \\cos(\\sigma_k),quad K'\
    \ = \\prod_{j=0}^n \\cosh(\\sigma_k)$ |\n\n# Maple 中的 CORDIC\n\n## Maple CORDIC\
    \ 三角函数\n\n```\nCORDIC[Trig] :=proc(t)\n  local n, K, x, y, z, j, del;\n  n :=47;\n\
