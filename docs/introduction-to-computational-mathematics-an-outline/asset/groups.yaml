    \ - f(x_n)f''(x)}.$\n```\n\nThen\n\n```\n$|\\alpha - x_{n+1}| \\le M \\cdot |\\\
    alpha - x_n|^3$\n```\n\nor, with $\\epsilon_n = |\\alpha - x_n|,$\n\n```\n$\\\
    epsilon_{n+1} \\le M \\cdot \\epsilon_n^3$\n```\n\nwhere $M$ is an upper bound\
