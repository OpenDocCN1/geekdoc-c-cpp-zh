  - '[PAGE 140]


    # Gaussian Properties


    ### Theorem (Error Estimate)

    Let $f$ have $2n$ continuous derivatives. Then for $\varepsilon_n = |G_n - \int_{-1}^{1}
    f(x)dx|$, $\varepsilon_n \le \frac{\pi}{2^{2n} \cdot (2n)!} \cdot M_{2n}$ where
    $M_{2n} \ge \max |f^{(2n)}(x)|$.


    ### Values of Gaussian Weights and Nodes

    There are numerous sources online, e.g.,


    +   1. The classic Abramowitz and Stegun *Handbook* (see the **entire book**)

    2. Holoborodko or Kamermans


    We could calculate the values directly:

    Set $P_n(x) = \frac{1}{2^{2n}!} \cdot \frac{d^n}{dx^n} [(x^2-1)^n]$ (the Legendre
    polynomials). Then $\{x_i\}_{i=1}^n = \{ \text{zeros of } P_n \}$ and $w_i = \frac{2}{(1-x_i^2)}
    [P''_n(x_i)]^2$.'
  - '[PAGE 141]


    # Gauss-Kronrod Quadrature


    Aleksandr Kronrod''s Idea (1964)


    One difficulty in Gaussian quadrature is that increasing the number of nodes requires
    recomputing all the values of


    +   - nodes

    - weights

    - function evaluations


    Kronrod⁴ discovered he could interlace $n+1$ new nodes with $n$ original Gaussian
    nodes and a rule of order $3n+1$. A $2n+1$ node Gaussian quadrature would have
    order $4n+1$, but with significant extra computation for an increase of only $n$
    in order Kronrod''s method.


    > Bad news: calculating the nodes and weights is way beyond the scope of our class.
    The nodes are the roots of the Stieltjes or Stieltjes-Legendre polynomials. (App
    IV)


    Gauss-Kronrod quadrature is used in Maple, Mathematica, MATLAB, and Sage; it''s
    included in the QUADPACK library, the GNU Scientific Library, the NAG Numerical
    Libraries, and in R. $GK_{7,15}$ is the basis of numerical integration in TI calculators.
    (Casio uses Simpson''s rule; HP, adaptive Romberg.)


    ⁴Kronrod, A. S. (1964). “Integration with control of accuracy” (in Russian), Dokl.
    Akad. Nauk SSSR 154, 283–286.'
