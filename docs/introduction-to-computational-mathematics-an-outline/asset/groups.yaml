  - '[PAGE 162]


    # # Newton Interpolation


    # Newton Basis Polynomials


    In order to make it easy to add a new knot, we change the set of basis polynomials.
    Given a set of $n+1$ knots, $\{x_k\}$, set


    ```

    $N_0(x) = 1$

    $N_1(x) = (x - x_0)$

    $N_2(x) = (x - x_0)(x - x_1)$

    $N_3(x) = (x - x_0)(x - x_1)(x - x_2)$

    $:$

    $N_n(x) = (x - x_0)(x - x_1) \cdots (x - x_{n-1})$

    ```


    Now let


    ```

    $P_n(x) = \sum_{k=0}^{n} a_k N_k(x)$

    ```


    Note that $\mathcal{B}_N = \{N_k(x) | k = 0..n\}$ forms a basis for $\mathbb{P}_n$.'
  - '[PAGE 163]


    # The Newton Coefficients


    Calculating the $a_k$''s


    For a set of $n+1$ data points $\{[x_k, y_k]\}$, define the (forward) divided

    differferences recursively as


    Then the Newton interpolating polynomial is


    $$P_n(x) = [y_0] + [y_0, y_1](x-x_0) + [y_0, y_1, y_2](x-x_0)(x-x_1)$$n$$+ [y_0,
    y_1, y_2, y_3](x-x_0)(x-x_1)(x-x_2) + \dots$$n$$= \sum_{k=0}^n [y_0, \dots, y_k]N_k(x).$$'
  - '[PAGE 164]


    # First Sample


    # A Used Polynomial


    Let $\mathcal{S} = \{[-2,1], [-1,-1], [0,1], [1,-1], [2,1]\}$.


    Begin by building a *difference tableau*.


    | x | -2 | -1 | 0 | 1 | 2 |

    |---|---|---|---|---|---|n| y | 1 | -1 | 1 | -1 | 1 |

    | $[y_0]$ | 1 | -1 | 1 | -1 | 1 |

    | $[y_0,y_1]$ | | | -2 | -2 | 2 |

    | $[y_0,y_1,y_2]$ | | | 2 | -2 | 2 |

    | $[y_0,y_1,y_2,y_3]$ | | | | -4/3 | 4 |

    | $[y_0,y_1,y_2,y_3,y_4]$ | | | | | 2/3 |


    Then $P_4(x) = \sum_{k=0}^{n} [y_0, \dots, y_k]N_k(x)$


    $1-2(x+2)+2(x+2)(x+1)-\frac{4}{3}(x+2)+\frac{2}{3}(x+2)(x+1)(x)(x-1)$


    $P_4(x) = 1-\frac{8}{3}x^2+\frac{2}{3}x^4$.'
