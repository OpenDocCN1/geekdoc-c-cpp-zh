    \ 的起始值的验证。阅读 J. Lagarias 的《$3x+1$ 问题》（2011年1月1日版本），并访问 Eric Roosendaal 的网站 http://www.ericr.nl/wondrous/\n\
    \n# Col拉茨猜想\n\n- 1. 编写一个程序 Collatz，用于确定起始值 $n$ 的*总停止时间*。即，给定 $a_1 = n$，找到第一个使得\
