- md: "\n# Gaussian Quadrature\n\nJohann Carl Friedrich Gauss\n\nAbout 1815, while\
    \ Gauss was finishing constructing an astronomical observatory, he wrote a paper³\
    \ on approximating integrals. Gauss's technique was studied and extended by Christoffel\
    \ in 1858. There are several good ways to develop this method. We'll use the easiest\
    \ ...\n\n# In Search of Improvements\n\nWrite the rules we've seen as sums:\n\
    - Left endpt: $L_n = \\frac{1}{n}f(x_0) + \\frac{1}{n}f(x_1) + \\dots + \\frac{1}{n}f(x_{n-1})$\n\
    - Right endpt: $R_n = \\frac{1}{n}f(x_1) + \\frac{1}{n}f(x_2) + \\dots + \\frac{1}{n}f(x_n)$\n\
    - Midpoint: $M_n = \\frac{1}{n}f(x_{m1}) + \\frac{1}{n}f(x_{m2}) + \\dots + \\\
    frac{1}{n}f(x_n)$\n- Trapezoid: $T_n = \\frac{1}{2}f(x_0) + \\frac{1}{n}f(x_1)\
    \ + \\dots + \\frac{1}{n}f(x_{n-1}) + \\frac{1}{2}f(x_n)$\n- Simpson’s: $S_n =\
    \ \\frac{1}{3n}f(x_0) + \\frac{4}{3n}f(x_1) + \\frac{2}{3n}f(x_2) + \\dots + \\\
    frac{4}{3n}f(x_{n-1}) + \\frac{1}{3n}f(x_n)$\n\n> ³ Methodus nova integralium\
    \ valores per approximationem invieniendi, Comment Soc Regiae Sci Gottingensis\
    \ Recientiores, v. 3, 1816.\n\n# Patterns\n\n# Observations\n\n- Each of the formulas\
    \ has the same form: a weighted sum\n  $A_n = w_1 \\cdot f(x_1) + w_2 \\cdot f(x_2)\
    \ + \\cdots + w_n \\cdot f(x_n)$\n  with different sets of weights $w_i$ and different\
    \ sets of nodes $x_i$.\n- Any closed interval can be mapped to and from $[-1,\
    \ 1]$, so we can focus just on $\\int_{-1}^{1} f(x) dx. \\quad T(t) = 2\\frac{t-a}{b-a}\
    \ - 1; \\quad T^{-1}(t) = a(\\frac{1+t}{2}) + b(\\frac{1-t}{2})$\n- Gauss posed\
    \ the question: Is there a “best choice” of weights $\\{w_i\\}$ and nodes $\\\
    {x_i\\}$? Do nodes have to be equidistant?\n- The answer depends on what “best”\
    \ means.\n\nSince we have $2n$ unknowns $w_i$ and $x_i$, let's look for a set\
    \ that integrates a $2n-1$ degree polynomial exactly. (Remember: a $2n-1$ degree\
    \ polynomial has $2n$ coefficients.)\n\n# Sampling 3\n\n# Example (Third Degree)\n\
    \nSet $n = 3$. Determine the choice of $w_i$ and of $x_i$ so that\n\n$$\\int_{-1}^{1}\
    \ x^p dx = \\sum_{k=1}^{3} w_k \\cdot x_k^p$$\n\nexactly for $p = 0, 1, \\dots,\
    \ 5 = 2 \\cdot 3 - 1$.\n\nThe range for the power $p$ gives us six equations:\n\
    \n```\n$$\\begin{cases} w_1 + w_2 + w_3 &= 2 \\\\ w_1 x_1 + w_2 x_2 + w_3 x_3\
    \ &= 0 \\\\ w_1 x_1^2 + w_2 x_2^2 + w_3 x_3^2 &= \\frac{2}{3} \\\\ w_1 x_1^3 +\
    \ w_2 x_2^3 + w_3 x_3^3 &= 0 \\\\ w_1 x_1^4 + w_2 x_2^4 + w_3 x_3^4 &= \\frac{2}{5}\
    \ \\\\ w_1 x_1^5 + w_2 x_2^5 + w_3 x_3^5 &= 0 \\end{cases} \\implies \\begin{cases}\
    \ x_1 = -\\sqrt{\\frac{3}{5}}, & x_2 = 0, & x_3 = \\sqrt{\\frac{3}{5}} \\\\ w_1\
    \ = \\frac{5}{9}, & w_2 = \\frac{8}{9}, & w_3 = \\frac{5}{9} \\end{cases}$$\n\
    ```\n\nOur Gaussian quadrature is $G_3(f) = \\frac{5}{9} f\\left(-\\sqrt{\\frac{3}{5}}\\\
    right) + \\frac{8}{9} f(0) + \\frac{5}{9} f\\left(\\sqrt{\\frac{3}{5}}\\right)$.\n\
    \n# Testing Gauss\n\n# Random Polynomials\n\nGenerate and test a random 5th-degree\
    \ polynomial.\n\n```\np := unapply(sort(randpoly(x, degree = 5), x, x)\n  x ->\
    \ -7x^5 + 22x^4 - 55x^3 + 94x^2 + 87x\nG3 := 5/9*p(-sqrt(3/5)) + 8/9*p(0) + 5/9*p(sqrt(3/5))\n\
    Int(p(x), x=-1..1) = -2488/15\n```\n\nGenerate and test a random 7th-degree polynomial.\n\
    \n```\nq := unapply(sort(randpoly(x, degree = 7), x, x)\n  x -> 97x^7 - 73x^6\
    \ - 4x^5 - 83x^3 - 10x\nint(q(x), x=-1..1) = 5/9*q(-sqrt(3/5)) + 8/9*q(0) + 5/9*q(sqrt(3/5))\
    \ = 2662/25\n```\n\n# Gaussian Properties\n\n### Theorem (Error Estimate)\nLet\
    \ $f$ have $2n$ continuous derivatives. Then for $\\varepsilon_n = |G_n - \\int_{-1}^{1}\
    \ f(x)dx| \\le \\frac{\\pi}{2^{2n} \\cdot (2n)!} M_{2n}$ where $M_{2n} \\ge \\\
    max |f^{(2n)}(x)|$.\n\n### Values of Gaussian Weights and Nodes\nThere are numerous\
    \ sources online e.g.,\n1. The classic Abramowitz and Stegun *Handbook*\n2. Holoborod\
    \ or Kamans\n\nWe could calculate the values directly: Set $P_n(x) = \\frac{1}{2^n\
    \ n!} \\frac{d^n}{dx^n} [(x^2-1)^n]$ (the Legendre polynomials). Then $\\{x_i\\\
    }_{i=1}^n = \\text{zeros of } P_n \\}$ and $w_i = \\frac{2}{(1-x_i^2)[P'_n(x_i)]^2}$.\n\
    \n# Gauss-Kronrod Quadrature\n\nAleksandr Kronrod's Idea (1964)\n\nOne difficulty\
    \ in Gaussian quadrature is that increasing the number of nodes requires recomputing\
    \ all the weights function evaluations. Kronrod discovered he could interlace\
    \ $n+1$ new nodes with $n$ original Gaussian nodes and a rule of order $3n+1$.\
    \ A $2n+1$ node Gaussian quadrature would have order $4n+1$, but with significant\
    \ extra computation for an increase of only $n$ in Kronrod's method.\n\n> Bad\
    \ news: calculating the nodes and weights is beyond the scope of our class. The\
    \ nodes are the roots of the Stieltjes or Stieltjes-Legendre polynomials (App\
    \ IV)\n\nGauss-Kronrod quadrature is used in Maple, Mathematica, and Sage; it's\
    \ included in the QUADPACK library, the GNU Scientific Library, the NAG Numerical\
    \ Libraries, and in R. $GK_{7,15}$ is the basis of numerical integration in TI\
    \ calculators (Casio uses Simpson's rule; HP, adaptive Romberg.)\n\nKronrod, A.\
    \ S. (1964). “Integration with control of accuracy” (in Russian), Donetsk. Akad.\
    \ SSSR 154, 283–286.\n\n# Gauss-Kronrod Quadrature in Practice\n\n# $GK_{7,15}\
    \ (1989)$\n\nA widely used implementation is based on a Gaussian quadrature with\
    \ 7 nodes. Kronrod adds 8 to total 15 nodes. $GK_{7,15}$ on $[-1, 1]$\n\n| Gauss-7\
    \ nodes | Weights |\n||---| |\n| 0.00000 00000 00000 | 0.41795 91836 73469 |\n\
    | $\\pm0.40584 51513 77397$ | 0.38183 00505 05119 |\n| $\\pm0.74153 11855 99394$\
    \ | 0.29770 53914 89277 |\n| $\\pm0.94910 79123 42759$ | 0.12948 49661 68870 |\n\
    \n$G_7 = \\sum_{k=1}^{7} w_k f(x_k)$\n\n$GK_{7,15} = \\sum_{j=1}^{15} w_j f(x_j)$\n\
    \n| Kronrod-15 nodes | Weights |\n||---|---|\n| 0.00000 00000 00000 $G$ | 0.20948\
    \ 21410 84728 |\n| $\\pm0.20788 49550 07898$ $K$ | 0.20443 24500 75298 |\n| $\\\
    pm0.40584 51513 77397$ $G$ | 0.19035 05780 64785 |\n| $\\pm0.58608 72354 67691$\
    \ $K$ | 0.16900 47266 39267 |\n| $\\pm0.74153 11855 99394$ $G$ | 0.14065 32597\
    \ 15525 |\n| $\\pm0.86486 44233 59769$ $K$ | 0.10479 00103 22250 |\n| $\\pm0.94910\
    \ 79123 42759$ $G$ | 0.06309 20926 29779 |\n| $\\pm0.99145 53711 20813$ $K$ |\
    \ 0.02329 53220 10529 |\n\n$\\varepsilon_{7,15} \\approx |G_7 - GK_{15}|$\nor,\
    \ in practice, use $\\approx [G_7 - GK_{15}]^{3/2}$\n\n# GK\n\nSee Maple's Online\
    \ Help for numeric to see methods available.\n\n# A Class\n\nEasy, but Hard\n\
    Set $f(x) = x$. Calculate $\\int_{0}^{6} f(x) dx$.\nSet $n = 10$. Find\n- 1. The\
    \ exact value\n- 2. Left endpoint approximation\n- 3. Right endpoint approximation\n\
    - 4. Midpoint approximation\n- 5. Trapezoid rule\n- 6. Simpson’s rule\n- 7. Gauss\
    \ quadrature\n- 8. Gaussian-Kronrod 7-15 quadrature\n\n# A Menagerie of Integrals\n\
    \n# Integrals for Testing Quadratures, I\n\nLyness:\nPiessens, de Doncker, Überhuber,\
    \ & Kahan:\n- 1. $I(\\lambda) = \\int_{1}^{2} \\frac{1}{(x-\\lambda)^{2}}$\n-\
    \ 2. $\\int_{0}^{1} x^{\\alpha} \\log\\left(\\frac{1}{x}\\right) dx = \\frac{1}{(1+\\\
    alpha)^{2}}$\n- 5. $\\int_{0}^{1} |x-\\frac{1}{3}|^{\\alpha} dx = \\frac{(\\frac{2}{3})^{\\\
    alpha+1}+(\\frac{1}{3})^{\\alpha+1}}{1+\\alpha}$\n- 3. $\\int_{0}^{1} \\frac{4-\\\
    alpha}{(x-\\frac{\\pi}{4})^{2}+16-\\alpha}} dx = \\text{an}\\left((4-\\pi)4^{4-\\\
    alpha}\\right)+\\text{an}\\left(\\pi 4^{\\alpha-1}\\right)$\n- 6. $\\int_{0}^{1}\
    \ |x-\\frac{\\pi}{4}|^{\\alpha} dx = \\frac{(1-\\frac{\\pi}{4})^{\\alpha+1}+(\\\
    frac{\\pi}{4})^{\\alpha+1}}{1+\\alpha}$\n- 7. $\\int_{-1}^{1} \\frac{1}{1-x^{2}}\
    \ \\frac{1}{1+x+2^{\\alpha}} dx = \\frac{\\pi}{(1+2^{\\alpha})^{2}-1}$\n- 8. $\\\
    int_{0}^{\\pi} \\cos(2^{\\alpha} \\sin(x)) dx = \\pi J_{0}(2^{\\alpha})$\n\n#\
    \ Test Integrals, II\n\n# Integrals for Testing Numerical Quadratures, II\n\n\
    Piessens et al. (continued):\n- 8. $\\int_{0}^{\\pi/2} \\sin^{\\alpha-1}(x)dx\
    \ = 2^{\\alpha-2} \\frac{\\Gamma^2(\\frac{\\alpha}{2})}{\\Gamma(\\alpha)}$\n-\
    \ 10. $\\int_{0}^{1} \\frac{\\cos(2^{\\alpha}x)}{\\sqrt{x(1-x)}}dx = \\pi \\cos(2^{\\\
    alpha-1})J_0(2^{\\alpha-1})$\n- 9. $\\int_{0}^{1} \\log^{\\alpha-1}(\\frac{1}{x})dx\
    \ = \\Gamma(\\alpha)$\n- 11. $\\int_{0}^{\\infty} x^2e^{-2^{\\alpha}x}dx = 2^{3\\\
    alpha+1}$\n- 12. $\\int_{0}^{\\infty} \\frac{x^{\\alpha-1}}{(1+10x^2)}dx = \\\
    frac{(1-\\alpha)\\pi}{10^{\\alpha}\\sin(\\pi\\alpha)}$\n\nBerntsen, Elspid, &\
    \ Søvik:\n- 13. $\\int_{0}^{1} |x-\\frac{1}{3}|^{-1/2}dx$ (singularity)\n- 15.\
    \ $\\int_{0}^{1} e^{2|x-1/3|}}dx$ ($C_0$ function)\n- 14. $\\int_{-1}^{1} U(x)e^{x/2}dx$\
    \ (discontinuity)\n- 16. $\\int_{-2}^{2} \\frac{(x-\\frac{\\pi}{2})^2}{10^{-4}}dx$\
    \ (sharp peak)\n"
  mdcn: "\n\n# 高斯积分\n\n约翰·卡尔·弗里德里希·高斯\n\n大约1815年，当高斯完成建造天文台时，他写了一篇关于积分近似的论文³。高斯的技术在1858年被克里斯托费研究并扩展。开发这种方法有几种很好的方式。我们将使用简单的一种……\n\
    \n# 寻找改进方法\n\n我们将见过的规则写成求和的形式：\n- 左端点：$L_n = \\frac{1}{n}f(x_0) + \\frac{1}{n}f(x_1)\
    \ + \\dots + \\frac{1}{n}f(x_{n-1})$\n- 右端点：$R_n = \\frac{1}{n}f(x_1) + \\frac{1}{n}f(x_2)\
    \ + \\dots + \\frac{1}{n}f(x_n)$\n- 中点：$M_n = \\frac{1}{n}f(x_{m1}) + \\frac{1}{n}f(x_{m2})\
    \ + \\dots + \\frac{1}{n}f(x_n)$\n- 梯形：$T_n = \\frac{1}{2}f(x_0) + \\frac{1}{n}f(x_1)\
    \ + \\dots + \\frac{1}{n}f(x_{n-1}) + \\frac{1}{2}f(x_n)$\n- 辛普森：$S_n = \\frac{1}{3n}f(x_0)\
    \ + \\frac{4}{3n}f(x_1) + \\frac{2}{3n}f(x_2) + \\dots + \\frac{4}{3n}f(x_{n-1})\
    \ + \\frac{1}{3n}f(x_n)$\n\n> ³ Methodus nova integralium valores per approximationem\
    \ invieniendi, Comment Soc Regiae Sci Gottingensis Recientiores, v. 3, 1816.\n\
    \n# 模式\n\n# 观察\n\n- 每个公式具有相同的形式：加权求和\n  $A_n = w_1 \\cdot f(x_1) + w_2 \\cdot\
    \ f(x_2) + \\cdots + w_n \\cdot f(x_n)$\n  具有不同的权重集 $w_i$ 和不同的节点集 $x_i$。\n- 任何闭区间都可以映射到和从\
    \ $[-1, 1]$，因此我们只需要关注 $\\int_{-1}^{1} f(x) dx. \\quad T(t) = 2\\frac{t-a}{b-a}\
