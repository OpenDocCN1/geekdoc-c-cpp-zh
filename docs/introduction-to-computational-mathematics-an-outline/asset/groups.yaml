    # Bernoulli’s Method for Polynomial Roots


    # Bernoulli’s Method (1728)⁶


    Let $p(x) = x^n + a_{n-1}x^{n-1} + \dots + a_0$ be a polynomial (wolog assuming
    $p$ is monic) and let $r$ be the root of $p$ with the largest magnitude. If $r$
    is real and simple, define the sequence $\{x_k\}$ recursively by


    ```

    $x_k = -a_{n-1}x_{k-1} - a_{n-2}x_{k-2} - \dots - a_0x_{k-n} \quad k = 1, 2, \dots$

    $x_0 = 1, x_{-1} = x_{-2} = \dots = x_{-n+1} = 0$.

    ```


    Then


    ```

    $\frac{x_{n+1}}{x_n} \to r$.

    ```


    +   - Bernoulli’s method works best when $p$ has simple roots and $r$ is not “close”
    to $p$''s next largest root.


    +   - If the ratio does not tend to a limit, but oscillates, the root of greatest
    modulus is one of a pair of conjugate complex roots.” (Whittaker & Robinson, *The
    Calculus of Observations*, 1924.)'
  - '[PAGE 204]


    # # Deflation


    # Deflating a Polynomial


    Let $p(x)$ be a polynomial. If a root $r$ of $p$ is known, then the *deflated
    polynomial* $q(x)$ is


    ```

    $$p_1(x) = \frac{p(x)}{x - r}.$$

    ```


    The coefficients of $p_1$ are easy to find using *synthetic division*.


    # The Technique


    +   1. Use Bernoulli''s method to find $r$, the largest root of $p$

    2. Deflate $p$ to obtain $p_1$

    3. Repeat to find all roots.


    Problem: Since there is error in $r$''s computation, there is error in $p_1$''s
    coefficients. Error compounds quickly with each iteration.'
