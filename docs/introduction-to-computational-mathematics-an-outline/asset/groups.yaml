    # VI. Polynomial Interpolation


    # ### What Is Polynomial Interpolation?


    An interpolating polynomial $p(x)$ for a set of points $\mathcal{S}$ is a polynomial
    that goes through each point of $\mathcal{S}$. That is, for each point $P_i =
    (x_i, y_i)$ in the set, $p(x_i) = y_i$.


    Typical applications include:


    +   - Approximating Functions

    - TrueType Fonts (2nd deg)

    - Fast Multiplication

    - Cryptography

    - PostScript Fonts (3rd deg)

    - Data Compression


    Since each data point determines the value of one polynomial coefficient, an $n$-point
    data set has an $n-1$ degree interpolating polynomial.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_151_0.png)'
  - "[PAGE 152]\n\n# Free Sample\n\n# Finding an Interpolating Polynomial\n\nLet $\\\
    mathcal{S} = \\{[-2, 1], [-1, -1], [0, 1], [1, -1], [2, 1]\\}$.\n\n+   1. Since\
    \ $\\mathcal{S}$ has 5 points, we compute a 4th degree polynomial\n$p_4(x) = a_0\
    \ + a_1x + a_2x^2 + a_3x^3 + a_4x^4$.\n\n+   2. Substitute the values of $\\mathcal{S}$\
    \ into $p_4$; write the results as a system of linear equations.\n\n```\n$\\begin{bmatrix}\
    \ 1 \\ -1 \\ 1 \\ -1 \\ 1 \\end{bmatrix} = \begin{bmatrix} a_0-2a_1+4a_2-8a_3+16a_4\
    \ \\ a_0-a_1+a_2-a_3+a_4 \\ a_0 \\ a_0+a_1+a_2+a_3+a_4 \\ a_0+2a_1+4a_2+8a_3+16a_4\
    \ \\end{bmatrix} = \begin{bmatrix} 1 & -2 & 4 & -8 & 16 & a_0 \\ 1 & -1 & 1 &\
    \ -1 & 16   &   & & 0 & 0 & 0 &  & &  & & 1 & 1 & 1 & 1 &   &      & 16 & a_4\
    \ \\end{bmatrix}$\n```\n\n+   3. Solve via your favorite method: $p_4(x) = \\\
    frac{2}{3}x^4 - \\frac{8}{3}x^2 + 1$."
  - '[PAGE 153]


    # Toward a Better Way: Lagrange Interpolation


    Knots or Nodes: The $x$-values of the interpolation points.


    Lagrange Fundamental Polynomial: Given a set of $n+1$ knots, define


    ```

    $L_i(x) = \prod_{\substack{k=0,n \ k \neq i}} \frac{x-x_k}{x_i-x_k} = \frac{x-x_0}{x_i-x_0}
    \times \cdots \times \frac{x-x_{i-1}}{x_i-x_{i-1}} \times \frac{x-x_{i+1}}{x_i-x_{i+1}}
    \times \cdots \times \frac{x-x_n}{x_i-x_n}$

    ```


    Lagrange Interpolating Polynomial: Given a set of $n+1$ data points $(x_k, y_k)$,
    define


    ```

    $p_n(x) = \sum_{k=0}^n y_k L_k(x)$

    ```'
