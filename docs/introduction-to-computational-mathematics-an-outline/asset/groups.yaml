    \n³历史上，这些方法的开发方向是相反：维特使用了 $10^{-k}$ 的离散步长（1600）；牛顿使用了割线法（1669），然后是截断幂级数（1687）；辛普森使用了流率/导数（1740）处理一般函数。\n\
    \n# 割线法误差\n\n> 定理\n设 $f \\in C^2(I)$，对于某个区间 $I \\subset \\mathbb{R}$。假设 $\\alpha\
