    \ 之间 $Collatz(n)$ 的最大值。\n- 5. 哪个初始值 $n \\le 10^6$ 最大的总停止时间？（注意！例如，Collatz(159,487)\
    \ = 183，但在 $a_{183} = 1$ 之前，该序列会达到 $a_{67} = 17,202,377,752$，这个值远远超出了无符号 32 位整数的范围。）\n\
    - 6. 报告 Col拉茨猜想的历史。\n\n**专家额外题：** 证明 $Collatz(2^mn) = m + Collatz(n)$。\n\n# CORDIC\
