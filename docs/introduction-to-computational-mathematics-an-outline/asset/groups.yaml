    \ your polynomial and the trajectories using your data chart.\n- 5. Can you determine\
    \ a specific value where the trajectories change from one to another target point?\n\
    - 6. Investigate the Modified Newton's Method's rate of convergence.\n\n# V. Numerical\
    \ Integration\n\n1. Numerical Integration .....................................................................................\
    \ 118\n2. Left Endpoint, Right Endpoint, and Midpoint Sums ......................................\
    \ 119\n3. Trapezoid Sums ................................................................................................\
    \ 120\n4. Simpson's Rule .................................................................................................\
    \ 122\n5. Gaussian Quadrature ........................................................................................\
    \ 126\n6. Gauss-Kronrod Quadrature ................................................................................\
