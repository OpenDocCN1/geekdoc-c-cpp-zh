    \ 63\n\n## II. Control Structures: Flow\n\nFlow Control\n\n**Conditional Statements.**\
    \ A *condition* determines an action:\nIf the condition is true, then do an action.\n\
    If the condition is not true, then do a different action.\n\nE.g.,\n\n- If a number\
    \ is even, divide it by 2. Otherwise *mult* by 3 & add 1.\n- If error is less\
    \ than $10^{-5}$, stop. If not, reapply Newton’s method.\n\n**Repeating Blocks\
    \ / Loops:** Repeat an action a specified number of times (NB: *Loops embed a\
    \ conditional*):\nCount to a value doing an action each time.\n\nE.g.,\n\n- Add\
    \ the first 20 prime numbers.\n- Starting at $t=0; y_0=0$, use Euler’s method\
    \ to find $y(1)$ when $y'=t$.\n\n> $3$ Is there a difference between *not true*\
    \ and *false*? See, e.g., *Intuitionistic Logic* at the Stanford Encyclopedia\
    \ of Philosophy.\n\n## Types of Conditional Statements\n\n### Basic Conditional\
    \ Types\n\nSimple: IF condition THEN do action for true\nIF condition THEN do\
    \ action for true ELSE do action for false\n\nCompound: IF condition$_1$ THEN\
    \ do action$_1$\nELSE IF condition$_2$ THEN do action$_2$\nELSE IF condition$_3$\
    \ THEN do action$_3$\n...\nELSE do action$_n$ when all conditions are false\n\n\
    ### Example (NC 2011–2013 Tax Rate Schedule$^4$)\n\n**IF** your filing status\
    \ is single;\n\n| and taxable income is more than: | but not over: | your tax\
    \ is: |\n| :--- | :--- | :--- |\n| $0 | $12,750 | 6% OF THE NC TAXABLE INCOME\
    \ AMOUNT ON FORM D-400 |\n| $12,750 | $60,000 | $765 + 7% OF THE AMOUNT OVER $12,750\
    \ |\n| $60,000 | ... | $4,072.50 + 7.75% OF THE AMOUNT OVER $60,000 |\n\n> $4$In\
    \ 2014, NC converted to a regressive “flat tax” currently at 5.25% (2021).\n\n\
    ## Types of Loops\n\nLoop Types\nCounting Loops: For loops perform an action a\
    \ pre-specified number of times.\nCondition Loops: While loops perform an action\
    \ as long as a given condition is true.\n\n- Examples\n- For each employee, calculate\
    \ their monthly pay.\n- For each integer $i$ less than $n$, compute the $i$th\
    \ number in the Fibonacci sequence.\n- While the current remainder in the Euclidean\
    \ algorithm is greater than 1, calculate the next remainder.\n- While the game\
    \ isn't over, process the user's input.\n\n## Example: Collatz Flow Chart\n\n\
    ### Collatz Function\n\n- Start with an integer greater than 1. If it's even,\
    \ divide it by 2. Otherwise, multiply it by 3 then add 1. Repeat until the value\
    \ reaches 1 counting the number of steps.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_43_0.png)\n\
    \nA program to calculate the number of steps requires a loop with a conditional\
    \ inside.\n\nXKCD: Collatz Conjecture\n\n## Example: Collatz — A Loop and a Conditional\n\
    \n### Pseudocode\n\n| We see a conditional loop in the Collatz function's flow\
    \ chart: | There is an “if” statement inside the loop to calculate the new term:\
    \ |\n| :--- | :--- |\n| while (the term > 1) do Calculate the next term | If (the\
    \ term is even) then divide by 2 |\n| end do | else multiply by 3, then add 1\
    \ end if |\n\nPutting these together gives:\nGet the first term\nSet the term\
    \ counter to 1\nwhile (the term > 1) do\nIf (the term is even) then divide by\
    \ 2\nelse multiply by 3, then add 1\nend if\nIncrement the term counter\nend do\n\
    Return the term counter\n\n## Example: Euler's Method as a Loop\n\nEuler's Method\n\
    The solution to a differential equation $y' = f(x,y)$ can be approximated using\
    \ the differential triangle. Calculate the next point from the current point $(x_k,\
    \ y_k)$ by following the tangent line for a step $\\Delta x = h$. Then the new\
    \ point is $(x_{k+1}, y_{k+1}) = (x_k + h, y_k + h \\cdot y'(x_k, y_k))$.\n\n\
    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_45_0.png)\n\nImplement Euler's method\
    \ as a loop:\n\n- Define the derivative function $y' = f(x,y)$\nGet the initial\
    \ point $(x_0, y_0)$\nGet the stepsize $h$\nDetermine the number of steps $n =\
    \ (b-a)/h$\nfor i from 1 to n do\n  Compute $x_{k+1} = x_k + h$ and $y_{k+1} =\
    \ y_k + h \\cdot y'(x_k, y_k)$\n  end do\nReturn the collection $\\{(x_i, y_i)\\\
    }$\n\n## Control Structures: Flowchart\n\n### A Common Sample\n\n- 1. List the\
    \ squares of the first 5 integers showing even and odd.\n- 2. Use a for loop to\
    \ step through the integers and an if-then conditional for even or odd.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_46_0.png)\n\
    \n## Control Structures: Diagram\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_47_0.png)\n\
    \n## Excel Control Structures\n\n### Conditional Statements\n\nIf: =IF(condition,\
    \ true action, false action)\nCan nest up to 7 IFs: =IF(condition1, IF(condition2,\
    \ ...), ...\nBut I've nested 12 deep without problems\n\nCase: = CHOOSE(index,\
    \ case_1, case_2, ...)\nMaximum of 29 cases (see also: LOOKUP)\n\n### Note\n\n\
    Many versions of Excel include Visual Basic for Applications (VBA), a small programming\
    \ language for macros. VBA includes a standard-if-then-else/elseif-end if structure.\
    \ (See the Excel Easy tutorial.)\n\n### Loop Structures\n\n| For: N/A (must be\
    \ programmed in VBA) |\n| While: N/A (must be programmed in VBA) |\n\n| |\n\n\
    View:\n\n- Excel (Mac) website\n- Excel (Win) website\n\n## Maple Control Structures\n\
    \n### Conditional Statements\n\n```\nIf: if condition then statements;\nelse statements;\n\
    end if\n\nif condition_1 then statements;\nelif condition_2 then statements;\n\
    else statements;\nend if\n```\n\nCase: N/A (use piecewise or if-elif-end if)\n\
    \n### Loop Structures\n\n```\nFor: for index from start_value to end_value\nby\
    \ increment do\n  statements;\n  end do\n\nfor index in expression_sequence do\n\
    \  statements;\n  end do\n\nWhile: while condition do\n  statements;\n  end do\n\
    ```\n\nView:\n\n- Maple website\n- Maple Online Help\n\n(See also: the Sage, Xcas,\
