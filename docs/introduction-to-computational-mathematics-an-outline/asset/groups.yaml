  - "[PAGE 156]\n\n# An “Easier” $L_k$ Formula\n\nFor a set $[x_k]$ of $n+1$ knots,\
    \ we defined $L_i(x) = \\prod_{k=0..n, k \neq i} \\frac{x-x_k}{x_i-x_k}$. This\
    \ formula is computationally intensive.\n\nSet $\\omega(x) = \\prod_{k=0}^n (x-x_k)$.\n\
    \n+   1. The numerator of $L_i$ is $\\omega(x)/(x-x_i)$.\n\n+   2. The denominator\
    \ of $L_i$ is $\\omega(x)/(x-x_i)$ evaluated at $x_i$. Rewrite as $\\frac{\\omega(x)}{x-x_i}\
    \ \\frac{\\omega(x)-\\omega(x_i)}{x-x_i}$. Take the limit as $x \to x_i$:\n\n\
    $\\lim_{x \to x_i} \\frac{\\omega(x)-\\omega(x_i)}{x-x_i} = \\omega'(x_i)$.\n\n\
    Thus $L_i(x) = \\frac{\\omega(x)}{(x-x_i) \\omega'(x_i)}$. A very compact formula!"
  - "[PAGE 157]\n\n# Properties of the $L_k$'s\n\n# Proposition\n\nFor the Lagrange\
    \ interpolating polynomial $p_n(x) = \\sum_{k=0}^{n} y_k L_k(x):\n\n+   1. $p_n(x)$\
    \ is the unique nth degree polynomial s.t. $p_k(x) = y_k$ for $k=0..n$.\n\n+ \
    \  2. $L_k(x_j) = \\delta_{kj} = \begin{cases} 1 & j=k \\ 0 & j \neq k \\end{cases}$\
    \ (See Kronecker delta.)\n\n+   3. $\\sum_{k=0}^{n} L_k(x) = 1$.\n\n+   4. If\
    \ $q(x)$ is a polynomial of degree $\\leq n$ with $y_k = q(x_k)$, then $q \\equiv\
    \ p_n$.\n\n+   5. The set $\\{L_k(x) : k=0..(n-1)\\}$ is a basis of $\\mathbb{P}_{n-1}$.\n\
    \n# Theorem (Lagrange Interpolation Error)\n\nIf $f \\in \\mathcal{C}^{n+1}[a,b]$\
    \ and $\\{x_k\\} \\in [a,b]$, then\n\n$\\epsilon_n = |f(x) - p_n(x)| \\leq \\\
    frac{(b-a)^{n+1}}{(n+1)!} \\max |f^{(n+1)}(x)|$."
