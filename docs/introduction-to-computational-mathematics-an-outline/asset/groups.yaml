    # # The Fourier Power Spectrum


    # ## Calculating the Power Spectrum of a Signal


    The *Power Spectrum* of a signal $f$ gives the amount of power of a specific frequency
    component in the signal. The value at the frequency $\omega$ is given by


    ```

    P(\omega) = \sqrt{a_{\omega}^2(f) + b_{\omega}^2(f)}$

    ```


    where $a_{\omega}(f)$ and $b_{\omega}(f)$ are the Fourier coefficients of $f$
    at the frequency $\omega$. The Fourier coefficients $a$ and $b$ are computed with
    the integrals $(\omega \ge 1)$


    ```

    $a_{\omega}(f) = \int_{-\pi}^{\pi} f(t)\cos(\omega t)dt \quad \text{and} \quad
    b_{\omega}(f) = \int_{-\pi}^{\pi} f(t)\sin(\omega t)dt$

    ```


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_206_0.png)


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_206_1.png)


    The *Spectrum Plot* shows the power level at each frequency.'
