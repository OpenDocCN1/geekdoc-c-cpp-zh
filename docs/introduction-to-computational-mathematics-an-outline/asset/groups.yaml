  - '[PAGE 95]


    # IV. Root Finding Algorithms: The Bisection Method


    # The Bisection Method


    If a continuous function $f$ has a root $r$ in an interval, then $r$ is in either
    the interval''s left half or right half. Suppose $r$ is in the right half interval.
    Then $r$ must be in either this smaller interval''s left half or right half. Find
    which half and continue the procedure.


    This process depends on the *Intermediate Value Theorem*


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_95_0.png)


    # Theorem (Bolzano''s Intermediate Value Theorem (1817))


    Let $f$ be continuous on $[a,b]$. Suppose that $y^*$ is between $f(a)$ and $f(b)$.
    Then there is a point $c \in (a,b)$ such that $f(c) = y^*$. In particular, if
    $f(a) \cdot f(b) < 0$, then $f$ has a root $r$ with $a < r < b$.'
  - '[PAGE 96]


    # The Bisection Error


    Theorem (Bisection Algorithm)

    Let $[a,b]$ be an interval on which $f$ changes sign. Define

    nx_n = c_n = \frac{1}{2}(a_{n-1} + b_{n-1})

    with $[a_n,b_n]$ chosen by the algorithm. Then $f$ has a root $\alpha \in [a,b]$,
    and

    $|\alpha - x_n| \leq (b-a) \cdot (\frac{1}{2})^n$.

    For an error tolerance $\varepsilon > 0$, set

    n = \frac{\log(b-a) - \log(\varepsilon)}{\log(2)}

    too obtain $|\alpha - x_n| \leq \varepsilon$. (This is called linear convergence.)


    Theorem (Cauchy’s Bound for Real Roots^1 (1829))

    Suppose that $r$ is a root of $p(x) = x^n + a_{n-1}x^{n-1} + \cdots + a_0$. Let

    M = \max_{k=0..n-1} |a_k|$. Then $|r| \leq M+1$.'
  - '[PAGE 97]


    # The Bisection Method Algorithm


    Algorithm (Bisection Method (Basic Outline))

    Given $f$ and $[a,b]$.

    1. Set $k = 0$ and $[a_0,b_0] = [a,b]$.

    2. Calculate $c = \frac{1}{2}(a_k + b_k)

    3. if $f(c) \approx 0$, then $c$ is a root; quit

    4. if $f(c) \cdot f(a_k) < 0$, then set $[a_{k+1},b_{k+1}] = [a_k,c]

    5. else if $f(c) \cdot f(b_k) < 0$, then set $[a_{k+1},b_{k+1}] = [c,b_k]

    6. Set $k = k+1$ and (if $k$ isn''t too big) go to 2.'
- md: "\n# The Bisection Method Pseudocode\n\n```\ninput : a, b, eps\nextern: f(x)\n\
    1: fa ← f(a);\n2: fb ← f(b);\n3: if fa·fb > 0 then\n4:   stop;               \
    \              /* Better: sign(fa) ≠ sign(fb) */\n5: n ← ceiling((log(b-a)-log(eps))/log(2));\n\
    6: for i ← 1 to n do\n7:   c ← a+0.5*(b-a);\n8:   fc ← f(c);\n9:   if abs(fc)<eps\
    \ then\n10:    return: c\n11:  if fa·fc < 0 then\n12:    b ← c;\n13:    fb ← fc;\n\
    14:  else\n15:    if fa·fc > 0 then\n16:      a ← c;\n17:      fa ← fc;\n18: \
    \   else\n19:      return: c\n20: return: c\n```\n\n# Newton-Raphson Method\n\n\
    If a function $f$ is \"nice,\" use the tangent line to approximate $f$. The root\
    \ of the tangent line — easy to find — approximates the root of $f$.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_99_0.png)\n\
    \n- 1. $f(x) = f(a) + f'(a)(x - a)$\n- 2. Set $f(x) = 0$; solve for $x$:\n\n$x\
    \ = a - \\frac{f(a)}{f'(a)}$\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_99_1.png)\n\
    \n- 3. Set $N(x) = x - \\frac{f(x)}{f'(x)}$. Then\n\n$x_{n+1} = N(x_n)$\n\n# Newton's\
    \ Method Error\n\n> Theorem\nLet $f \\in \\mathcal{C}^2(I)$ on some interval $I\
    \ \\subset \\mathbb{R}$. Suppose $\\alpha \\in I$ is a root of $f$.\nChoose $x_0\
    \ \\in I$ and define\n$$x_{n+1} = x_{n} - \\frac{f(x_n)}{f'(x_n)}$$\nThen\n$$|\\\
    alpha - x_{n+1}| \\le M \\cdot |\\alpha - x_n|$$\nor, with $\\varepsilon_n = |\\\
    alpha - x_n|,$\n$$\\varepsilon_{n+1} \\le M \\cdot \\varepsilon_n^2$$\nwhere $M$\
    \ is an upper bound for $\\frac{1}{2}|f''(x)/f'(x)|$ on $I$.\n\nThis is called\
    \ quadratic or \"order 2\" convergence.\n\n# Newton's Method Algorithm\n\n# Algorithm\
    \ (Newton's Method (Basic Outline))\n\nGiven $f$ and $x_0$.\n\n- 1. Set $k = 1$\
    \ and $N(x) = x - \\frac{f(x)}{f'(x)}$\n- 2. Compute $x_k = N(x_{k-1})$.\n- 3.\
    \ If $f(x_k) \\approx 0$, then $x_k$ is a root; quit\n- 4. else if $|f(x_k)|$\
    \ or $|x_k - x_{k-1}|$ is very small, then $x_k \\approx$ a root; quit\n- 5. Set\
    \ $k = k+1$ and (if $k$ isn't too big) go to 2.\n\n# Newton's Method Pseudocode\n\
    \n```\ninput : x0, eps, n\nextern: f(x), df(x)=f'(x)\n1: fx0 ← f(x0);\n2: dfx0\
    \ ← df(x0);\n3: for i ← 1 to n do\n4:     x1 ← x0 - fx0/dfx0;\n5:     fx1 ← f(x1);\n\
    6:     if |fx1| + |x1-x0| < eps then\n7:         return: x1\n8:     x0 ← x1;\n\
    9:     fx0 ← fx1;\n10:    dfx0 ← df(x0)\nreturn: x1\n```\n\n# Secant Method\n\n\
    Newton's method requires evaluating the derivative — this can be from difficult\
    \ to impossible in practice. Approximate the derivative in Newton's method with\
    \ a secant line³:\n\n```\n$x_{n+1} = x_n - \\frac{f(x_n)}{f(x_n) - f(x_{n-1})}\
    \ = x_n - f(x_n) \\cdot \\frac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})}$\n```\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_103_0.png)\n\
    \n³Historically, the methods developed the opposite way: Viete used discrete steps\
    \ of $10^{-k}$ (1600); Newton used secants (1669), then truncated power series\
    \ (1687); Simpson used fluxions/derivatives (1740) with general functions.\n\n\
    # Secant Method Error\n\n> Theorem\nLet $f \\in C^2(I)$ for some interval $I \\\
    subset \\mathbb{R}$. Suppose $\\alpha \\in I$ is a root of $f$.\nChoose $x_0$\
    \ and $x_1 \\in I$, and define\n$$x_{n+1} = x_n - f(x_n) \\cdot \\frac{x_n - x_{n-1}}{f(x_n)\
    \ - f(x_{n-1})}$$\nThen\n$$|\\alpha - x_{n+1}| \\le M \\cdot |\\alpha - x_n| \\\
    cdot |\\alpha - x_{n-1}|$$\nor, with $\\epsilon_n = |\\alpha - x_n|,$\n$$\\epsilon_{n+1}\
    \ \\le M \\cdot \\epsilon_n \\cdot \\epsilon_{n-1}$$\nwhere $M$ is an upper bound\
    \ for $\\frac{1}{2}|f''(x)/f'(x)|$ on $I$.\n\nThis is superlinear convergence\
    \ of \"order 1.6.\" (Actually, it's order $\\frac{1+\\sqrt{5}}{2}$)\n\n# Secant\
    \ Method Algorithm\n\n# Algorithm (Secant Method (Basic Outline))\n\nGiven $f,\
    \ x_0$, and $x_1$:\n\n- 1. Set $k = 2$ and $S(x_0,x_1) = x_1 - f(x_1) \\cdot \\\
    frac{x_1 - x_0}{f(x_1) - f(x_0)}$.\n- 2. Compute $x_k = S(x_{k-1}, x_{k-2})$.\n\
    - 3. If $f(x_k) \\approx 0$, then $x_k$ is a root; quit\n- 4. else if $|x_k -\
    \ x_{k-1}|$ is very small, then $x_k \\approx$ a root; quit\n- 5. Set $k = k+1$\
    \ and (if $k$ isn't too big) go to 2.\n\n# Secant Method Pseudocode\n\n```\ninput\
    \ : x0, x1, eps, n\nextern: f(x)\n1: f0 ← f(x0);\n2: f1 ← f(x1);\n3: for i ← 1\
    \ to n do\n4:   c ← x1 - f1*(x1-x0)/(f1-f0);\n5:   fc ← f(c);\n6:   x0 ← x1;\n\
    7:   x1 ← c;\n8:   f0 ← fc;\n9:   f1 ← fc;\n10:  if |x1-x0| < eps then\n     \
    \ return: x1\nreturn: x1\n```\n\n# Regula Falsi\n\n# Regula Falsi\n\nThe *regula\
    \ falsi*, or “false position,” method is very old; the Egyptians used the concept.\
    \ The method appears in Vaishali Ganit (India, 3rd century), Book on Numbers and\
    \ Nine Chapters on Mathematical Art (China, 2nd century), Book of Errors (Persia,\
    \ c. 900), and came to the west in Fibonacci’s Liber Abaci (1202). Regula falsi\
    \ combines the secant and bisection techniques: Use the secant to find a “middle\
    \ point,” then keep the interval with sign change, i.e., that brackets the root.\n\
    \n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_107_0.png)\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_107_1.png)\n\
    \n⁴Also called Regula Falsi, Double False Position, Regula Position, Secant Method,\
    \ Rule of Errors, etc. My favourite name is “Too much and not enough.”\n\n# Regula\
    \ Falsi Method Error\n\nTheorem\n\nLet $f \\in \\mathcal{C}^2(I)$ for some interval\
    \ $I \\subset \\mathbb{R}$. Suppose $\\alpha \\in I$ is a root of $f$.\nChoose\
    \ $a$ and $b \\in I$ such that $\\text{sign}(f(a)) \\neq \\text{sign}(f(b))$,\
    \ and define\n$c = b-f(b) \\cdot \\frac{b-a}{f(b)-f(a)}$.\nThen\n$|\\alpha-c|\
    \ \\le M \\cdot |\\alpha-a|$\nor, with $\\varepsilon_n = |\\alpha-x_n|,$\n$\\\
    varepsilon_{n+1} \\le M \\cdot \\varepsilon_n$\nwhere $0 < M < 1$ is a constant\
    \ depending on $|f''(x)|$ and $|f'(x)|$ on $I$.\n\nThis is linear or “order 1”\
    \ convergence. (The same as the bisection method.)\n\n# Regula Falsi Algorithm\n\
    \nAlgorithm (Regula Falsi (Basic Method))\n\nGiven $f, a,$ and $b$:\n\n1. Set\
    \ $k=1$ and $S(a,b) = b - f(b) \\cdot \\frac{b-a}{f(b)-f(a)} = \\frac{a \\cdot\
    \ f(b) - b \\cdot f(a)}{f(b)-f(a)}$\n2. Compute $c = S(a,b)$.\n3. If $f(c) \\\
    approx 0$, then $c$ is a root; quit\n4. If $f(c) \\cdot f(a) < 0$, then $b \\\
    leftarrow c$\n5. else $a \\leftarrow c$\n6. If $|b-a|$ is very small compared\
    \ to $|a|$, then $a$ is a root; quit\n7. Set $k = k+1$, and (if $k$ isn't too\
    \ big) go to 2.\n\n```\ninput : a, b, eps, n\nextern: f(x)\n1: fa ← f(a);\n2:\
