    \ then\n      return: x1\nreturn: x1\n```\n\n# 哈莱顿法\n\n哈莱顿法⁵1694年扩展了牛顿法以获得三次收敛。哈莱顿受到de\
    \ Lagny1692年提取根公式的启发。正如牛顿没有注意到他方法中的导数，泰勒在1712年首次看到。我们使用的哈莱顿法源于将牛顿法应用于辅助函数\n\n\
    $$g(x) = \\frac{f(x)}{\\sqrt{|f'(x)|}}$$\n\n# 哈莱顿法误差\n\n定理\n\n设 $f \\in \\mathcal{C}^3(I)$，对于某个区间\
    \ $I \\subset \\mathbb{R}$。假设 $\\alpha \\in I$ 是 $f$ 的根。\n选择 $x_0 \\in I$ 并定义\n\
    \n```\n$x_{n+1} = x_n - \\frac{2f(x_n)f'(x_n)}{2f'(x_n)^2 - f(x_n)f''(x)}.$\n\
    ```\n\n则\n\n```\n$|\\alpha - x_{n+1}| \\le M \\cdot |\\alpha - x_n|^3$\n```\n\n\
    或者令 $\\epsilon_n = |\\alpha - x_n|,$\n\n```\n$\\epsilon_{n+1} \\le M \\cdot \\\
    epsilon_n^3$\n```\n\n其中 $M$ 是 $I$ 上 $\\frac{3f''(x)^2-2f'(x)f''(x)}{12f'(x)^2}$\
