  mdcn: '


    # I. 计算机算术：科学计数法


    ## 科学计数法的定义

    标准化（Normalized）：任何数值都可以写为：

    $d_0.d_1d_2d_3 \dots d_n \times 10^p$

    其中 $1 \le d_0 \le 9$。


    工程计数法（Engineering）：任何数值都可以写为：

    $n.d_1d_2d_3 \dots d_m \times 10^q$

    其中 $1 \le n \le 999$ 且 $q$ 是 3 的倍数。


    - 示例（NIST 常数）

    - 真空中光速：$2.99792458 \times 10^8$ m/s

    - 牛顿引力常数：$6.67384 \times 10^{-11}$ $\text{m}^3/(\text{kg}\cdot\text{s}^2)$

    - 阿沃加罗常数：$6.022141 \times 10^{-23}$ $\text{mol}^{-1}$

    - 质子质量：$1.672621777 \times 10^{-27}$ kg

    - 天文单位：$92.9558027 \times 10^6$ mi


    # 转换


    ## 基础进制转换：整数


    ### 二进制 $\rightarrow$ 十进制

    （向量法）

    将二进制数看作一个由 1 和 0 组成的向量。使用点积转换为十进制。


    **十进制 $\rightarrow$ 二进制**

    （代数法）

    连续计算各个位（从右到左）


    - 1. $x_2 = 101110$

    2. $x_{10} = \{1\ 0\ 1\ 1\ 1\ 0\}\cdot{\{2^5\ 2^4\ 2^3\ 2^2\ 2^1\ 2^0\}$

    3. $x_{10} = 2^5 + 2^3 + 2^2 = 46$


    - 1. $bit = x \mod 2$

    然后设置 $x = [x/2]$

    2. 重复直到 $x = 0$


    例如，$x_{10} = 46$

    $b_0 = 0；然后设置 $x = 23$

    $b_1 = 1$; $x = 11$

    $b_2 = 1$; $x = 5$

    $b_3 = 1$; $x = 2$

    $b_4 = 0$; $x = 1$

    $b_5 = 1$; $x = 0$


    由此 $x_2 = 101110$


    # 转换


    ## 基础进制转换：分数


    ### 二进制 $\rightarrow$ 十进制

    （向量法）

    将二进制数看作一个由 1 和 0 组成的向量。使用点积转换为十进制。


    - 1. $x_2 = 0.10111$


    - 2. $x_{10} = \{ 1\ 0\ 1\ 1\ 1 \} \cdot (2^{-1}\ 2^{-2}\ 2^{-3}\ 2^{-4}\ 2^{-5})$


    - 3. $x_{10} = 2^{-1} + 2^{-3} + 2^{-4} + 2^{-5} = 0.71875$


    ### 十进制 $\rightarrow$ 二进制

    （代数法）

    连续计算各个位（从左到右）


    - 1. $bit = [2x]$

    然后设置 $x = \text{frac}(2x)$


    - 2. 重复直到 $x=0$（或达到最大长度）


    例如，$x_{10} = 0.71875$

    $b_{-1} = 1$;然后设置 $x = 0.43750$

    $b_{-2} = 0$; $x = 0.87500$

    $b_{-3} = 1$; $x = 0.75000$

    $b_{-4} = 1$; $x = 0.50000$

    $b_{-5} = 1$; $x = 0.0$ 停止


    由此 $x_2 = 0.10111$


    # 转换


    ## 有限小数展开？

    分数的展开何时会终止？

    10 进制：当小数分数 $r = \frac{n}{10^p} = \frac{n}{2^p \cdot 5^p}$ 时，终止终止。

    2 进制：当二进制分数 $r = \frac{m}{2^p}$ 时，终止。


    - ### 示例

    1. $\frac{1}{10} = 0.1\overline{10} = 0.00011_2$

    2. $\frac{1}{3} = 0.\overline{3}_{10} = 0.0\overline{1}_2$

    3. $\sqrt{2} \dote 1.4142135623730950488_{10} \dote 1.011010100001001111_2$

    4. $\pi \dote 3.141592653387932385_{10} \dote 11.0010010001111101_2$


    # 转换


    ## 示例（转换循环小数）

    将 $n = 0.01011011\dots = 0\overline{101}_2$ 转换为十进制。


    - 1. 将循环块转换为十进制：

    $101_2 = 5_{10}$


    - 2. 将 $n$ 写为 2 的幂形式：

    $n = 5 \cdot 2^{-4} + 5 \cdot 2^{-7} + 5 \cdot 2^{-10} + 5 \cdot 2^{-13} + \dots$


    - 3. 将 $n$ 表示为等级数：

    $n = 5 \cdot 2^{-4} \cdot \sum_{k=0}^{\infty} 2^{-3k}$


    - 4. 求等级数和：

    $n = 5 \cdot 2^{-4} \cdot \frac{1}{1-2^{-3}}$


    # 转换


    ## 二进制编码小数 (BCD)

    数字 0 到 9 可以四个二进制位表示：


    | x | x | x | x |

    |---|---|---|---|

    | 8 | 4 | 2 | 1 |


    例如，$93_{10}$ 将是：

    | BCD: | 1001 | 0011 | vs. 二进制: | 01011101 |

    | 128 | 64 | 32 | 16 |


    ### 优点

    - 消除了某些循环展开

    - 舍入更简单

    - 显示数值


    ### 缺点

    - 8 位中表示的数字较少（100/256 $\approx$ 39%）

    - 运算复杂

    - 几乎所有的计算器都使用 BCD 格式。


    # 浮点数


    ## 定义（浮点表示）

    一个数字 $x$ 被表示（近似）为：

    $x = \sigma \times f \times \beta^{e-p}$

    其中

    $\sigma$：符号（$\pm1$），$f$：尾数，$\beta$：通常为 2，

    $e$：带偏移指数，$p$：指数偏移


    ### 指数偏移

    选择偏移值是为了给正负指数提供相同的范围。例如，对于：

    | 位 | $\sigma$ | $e$ | $f$ |

    |---|---|---|

    | 8 位：$0 \le e \le 255 = 2^8 - 1。使用 $p = 2^8/2 - 1$ 得到范围 $-127 \le e \le 127$
    | | |

    | 11 位：$0 \le e \le 2047 = 2^{11} - 1。使用 $p = 2^{11}/2 - 1$ 得到 $-1023 \le e \le
    1023$ | | |


    ### 样本

    - 1. $-3.95 = (-1)^1 \times 0.123475 \times 2^{21-16}$

    所以 $\sigma = 1, f = 0.123475, \beta = 2, e = 21$，且 $p = 16$。

    注意：$(-1)^1 \times 0.3475 \times 2^{21-16} = -3.95$，所以误差为 0。

    存储格式：1 | 21 | 0.123475 |


    - 2. $1/3 = (-1)^0 \times 0.229166667 \times 2^{16384-16383}$

    所以 $\sigma = 0, f = 0.229166667, \beta = 2, e = 16384$，且 $p = 16383$。

    注意：$(-1)^0 \times 2.29166667 \times 2^{16384-16383} = 0.66666667$，误差为 $5 \cdot
    10^{-10}$。

    存储格式：0 | 16384 | 0.229166667 |


    - 3. $2^{10} = 1024 = (-1)^0 \times 0.250 \times 2^{66-63}$

    所以 $\sigma = 0, f = 0.250, \beta = 2, e = 66$，且 $p = 63$。

    注意：$(-1)^0 \times 0.250 \times 2^{66-63} = 1024.0$，误差为 0。

    存储格式：0 | 66 | 0.250000000 |


    # IEEE 标准的浮点算术


    ### 单精度位

    | 模式 | 值 |

    |---|---|

    | $0 < e < 255$ | $n = (-1)^\sigma \times 1.f \times 2^{e-127}$ 化 |

    | $e = 0, f \neq 0$ | 非规格化 $n = (-1)^\sigma \times 0.f \times 2^{-1-127}$ |

    | $e = 255, f = 0$ | 正负无穷大 |

    | $e = 255, f \neq 0$ | NaN（非数字） |


    ### 双精度位

    | 模式 | 值 |

    |---|---|

    | $0 < e < 2047$ | $n = (-1)^\sigma \times 1.f \times 2^{e-1023}$ 化 |

    | $e = 0, f \neq 0$ | 非规格化 $n = (-1)^\sigma \times 0.f \times 2^{-1-1023}$ |

    | $e = 2047, f = 0$ | 正负无穷大 |

    | $e = 2047, f \neq 0$ | NaN（非数字） |


    # 机器指数


    ### 定义

    机器指数 $\epsilon$ 是数值表示精度的度。在 IEEE 754 浮点数中，它通常定义为 1 与两个相邻规格化数之间的差。


    对于单精度：

    $$\epsilon = 2^{-23} \approx 1.19 \times 10^{-7}$$


    对于双精度：

    $$\epsilon = 2^{-52} \approx 2.22 \times 10^{-16}$$


    '
