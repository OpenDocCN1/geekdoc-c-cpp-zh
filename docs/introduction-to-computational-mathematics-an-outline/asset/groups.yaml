    \ |\n| $e = 0$, $f = 0$ all bits are zero | $n = (-1)^\\sigma \\times 0.0$ signed\
    \ zero |\n| $f \\neq 0$ at least 1 nonzero bit | $n = (-1)^\\sigma \\times 2^{-126}\
    \ \\times 0.f$ subnormal number |\n| $e = 255$, $f = 0$, $\\sigma = 0$ | +INF\
    \ plus infinity |\n| $e = 255$, $f = 0$, $\\sigma = 1$ | -INF minus infinity |\n\
    | $e = 255$, $f \\neq 0$ | NaN Not-a-Number |\n\n# Big and Small & Gaps\n\n##\
    \ IEEE-754 Largest and Smallest Representable Numbers\n| Precision | Digits |\
    \ Max Exp | Smallest # | Largest # |\n| --- | --- | --- | --- | --- |\n| Single\
    \ | ≈ 9 | ≈ 38.2 | ≈ 1.18 · 10⁻³⁸ | 3.4 · 10³⁸ |\n| Double | ≈ 17 | ≈ 307.95 |\
    \ ≈ 2.225 · 10⁻³⁰⁷ | 1.798 · 10³⁰⁸ |\n\n## Gaps in the Floating Point Line\nThe\
    \ size of the gap between consecutive floating point numbers gets larger as the\
    \ numbers get larger.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a311544b_22_0.png)\n\n\
    Each tick mark represents one floating point number.\n\n# Machine Epsilon\n\n\
    ### Definition\nThe machine epsilon $\\varepsilon$ is the largest value such that\n\
    \n$$1 + \\varepsilon = 1$$\n\nfor a given numeric implementation.\n\n```\nwmcb:►\
