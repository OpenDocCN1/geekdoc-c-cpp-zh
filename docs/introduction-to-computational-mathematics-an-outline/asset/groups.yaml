    \n# IV. Root Finding Algorithms: The Bisection Method\n\n## The Bisection Method\n\
    \nIf a continuous function $f$ has a root $r$ in an interval, then $r$ is in either\
    \ the interval's left half or right half. Suppose $r$ is in the right half interval.\
    \ Then $r$ must be in either this smaller interval's left half or right half.\
    \ Find which half and continue the procedure.\n\nThis process depends on the *Intermediate\
    \ Value Theorem*\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_95_0.png)\n\n# Theorem\
    \ (Bolzano's Intermediate Value Theorem (1817))\n\nLet $f$ be continuous on $[a,b]$.\
    \ Suppose that $y^*$ is between $f(a)$ and $f(b)$. Then there is a point $c \\\
    in (a,b)$ such that $f(c) = y^*$. In particular, if $f(a) \\cdot f(b) < 0$, then\
    \ $f$ has a root in $(a,b)$.\n\n# The Bisection Error\n\nTheorem (Bisection Algorithm)\n\
    Let $[a,b]$ be an interval on which $f$ changes sign. Define $x_n = c_n = \\frac{1}{2}(a_{n-1}\
    \ + b_{n-1})$\nwith $[a_n,b_n]$ chosen by the algorithm. Then $f$ has a root $\\\
    alpha \\in [a,b]$, and\n$|\\alpha - x_n| \\leq (b-a) \\cdot (\\frac{1}{2})^n$.\n\
    For an error tolerance $\\varepsilon > 0$, set\n$n = \\frac{\\log(b-a) - \\log(\\\
    varepsilon)}{\\log(2)}$\nto obtain $|\\alpha - x_n| \\leq \\varepsilon$. (This\
    \ is called linear convergence.)\n\nTheorem (Cauchy’s Bound for Real Roots (1829))\n\
    Suppose that $r$ is a root of $p(x) = x^n + a_{n-1}x^{n-1} + \\cdots + a_0$. Let\n\
    M = \\max_{k=0..n-1} |a_k|$. Then $|r| \\leq M+1$.\n\n# The Bisection Method Algorithm\n\
    \nAlgorithm (Bisection Method (Basic Outline))\nGiven $f$ and $[a,b]$.\n1. Set\
    \ $k = 0$ and $[a_0,b_0] = [a,b]$.\n2. Calculate $c = \\frac{1}{2}(a_k + b_k)$\n\
    3. if $f(c) \\approx 0$, then $c$ is a root; quit\n4. if $f(c) \\cdot f(a_k) <\
    \ 0$, then set $[a_{k+1},b_{k+1}] = [a_k,c]$\n5. else if $f(c) \\cdot f(b_k) <\
    \ 0$, then set $[a_{k+1},b_{k+1}] = [c,b_k]$\n6. Set $k = k+1$ and (if $k$ isn't\
    \ too big) go to 2.\n"
