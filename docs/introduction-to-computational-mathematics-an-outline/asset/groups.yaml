    # # Preface: A Computational Mathematics Course


    This slide deck was developed while teaching Appalachian State’s MAT 2310, Computational
    Mathematics (3 cr). The course was designed to introduce numerical analysis and
    give students experience with basic programming structures in a mathematical environment.
    A sample syllabus is as follows:


    +   1. Computer Arithmetic ....... 2 weeks 4. Root-Finding Algorithms . . 3 weeks

    2. Control Structures . . . . . . . . . 2 weeks 5. Numerical Integration . . .
    . 2 weeks

    3. Numerical Differentiation . . 3 weeks 6. Polynomial Interpolation . . 2 weeks

    Midterm Exam Team Project Posters . . . . 1 week

    Final Exam


    Programming was done with the computer algebra system Maple, to easily adjust
    precision, and with Python. The Special Topics and Case Study come in as time
    time allows. A selection of group projects appears at the end of this Outline.


    Thanks go to the students of MAT 2310 who lived through the development of both
    a new course and these slides. Many also go to my colleagues Greg Rhoads, René
    Salinas, and Eric Marland who co-designed the course and gave great feedback during
    the adventure.


    > — WmCB, Aug 2022'
