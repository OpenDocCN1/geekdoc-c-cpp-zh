    \ 161\n\n# VI. Polynomial Interpolation\n\n### What Is Polynomial Interpolation?\n\
    \nAn interpolating polynomial $p(x)$ for a set of points $\\mathcal{S}$ is a polynomial\
    \ that goes through each point of $\\mathcal{S}$. That is, for each point $P_i\
    \ = (x_i, y_i)$ in the set, $p(x_i) = y_i$.\n\nTypical applications include:\n\
    \n- Approximating Functions\n- TrueType Fonts (2nd deg)\n- Fast Multiplication\n\
    - Cryptography\n- PostScript Fonts (3rd deg)\n- Data Compression\n\nSince each\
    \ data point determines the value of one polynomial coefficient, an $n$-point\
    \ data set has an $n-1$ degree interpolating polynomial.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_151_0.png)\n\
    \n# Free Sample\n\n# Finding an Interpolating Polynomial\n\nLet $\\mathcal{S}\
    \ = \\{[-2, 1], [-1, -1], [0, 1], [1, -1], [2, 1]\\}$.\n\n- 1. Since $\\mathcal{S}$\
    \ has 5 points, we compute a 4th degree polynomial $p_4(x) = a_0 + a_1x + a_2x^2\
    \ + a_3x^3 + a_4x^4$.\n- 2. Substitute the values of $\\mathcal{S}$ into $p_4$;\
    \ write the results as a system of linear equations.\n```\n$\\begin{bmatrix} 1\
    \ & -1 \\\\ 1 & -1 \\\\ 1 \\end{bmatrix} \\begin{bmatrix} a_0 \\\\ a_1 \\\\ a_2\
    \ \\\\ a_3 \\\\ a_4 \\end{bmatrix} = \\begin{bmatrix} 1 \\\\ -1 \\\\ 1 \\\\ -1\
    \ \\\\ 1 \\end{bmatrix}$\n```\n- 3. Solve via your favorite method: $p_4(x) =\
    \ \\frac{2}{3}x^4 - \\frac{8}{3}x^2 + 1$.\n\n# Toward a Better Way: Lagrange Interpolation\n\
    \n- Nodes: The $x$-values of the interpolation points.\n- Lagrange Fundamental\
    \ Polynomial: Given a set of $n+1$ knots, define $L_i(x) = \\prod_{\\substack{k=0\
    \ \\\\ k \\neq i}} \\frac{x-x_k}{x_i-x_k}$.\n- Lagrange Interpolating Polynomial:\
    \ Given a set of $n+1$ data points $(x_k, y_k)$, define $p_n(x) = \\sum_{k=0}^n\
    \ y_k L_k(x)$.\n\n# Sampling a Better Way\n\nExample (Lagrange Fundamental Polynomials)\n\
    \nThe set of knots $[-2, -1, 0, 1, 2]$ gives\n\n```\n$L_0(x) = \\frac{x-(-1)}{-2-(-1)}\
    \ \\cdot \\frac{x-0}{-2-0} \\cdot \\frac{x-1}{-2-1} \\cdot \\frac{x-2}{-2-2}$\n\
    $L_1(x) = \\frac{x-(-2)}{-1-(-2)} \\cdot \\frac{x-0}{-1-0} \\cdot \\frac{x-1}{-1-1}\
    \ \\cdot \\frac{x-2}{-1-2}$ (Wait, the OCR is messy here, let me correcting the\
    \ logic)\n```\nActually, based on standard Lagrange formula:\n$L_0(x) = \\frac{x-(-1)}{-2-(-1)}\
    \ \\cdot \\frac{x-0}{-2-0} \\cdot \\frac{x-1}{-2-1} \\cdot \\frac{x-2}{-2-2}$\n\
    $L_1(x) = \\frac{x-(-2)}{-1-(-2)} \\cdot \\frac{x-0}{-1-0} \\cdot \\frac{x-1}{-1-1}\
    \ \\cdot \\frac{x-2}{-1-2}$\n$L_2(x) = \\frac{x-(-2)}{0-(-2)} \\cdot \\frac{x-(-1)}{0-(-1)}\
    \ \\cdot \\frac{x-1}{0-1} \\cdot \\frac{x-2}{0-2}$\n$L_3(x) = \\frac{x-(-2)}{1-(-2)}\
    \ \\cdot \\frac{x-(-1)}{1-(-1)} \\cdot \\frac{x-0}{1-0} \\cdot \\frac{x-2}{1-2}$\n\
    $L_4(x) = \\frac{x-(-2)}{2-(-2)} \\cdot \\frac{x-(-1)}{2-(-1)} \\cdot \\frac{x-0}{2-0}\
    \ \\cdot \\frac{x-1}{2-1}$\n\nGraph the $L_k$!\n\n# Sampling a Better Way\n\n\
    Example\nLet $\\mathscr{S} = \\{[-2, 1], [-1, -1], [0, 1], [1, -1], [2, 1]\\}$.\n\
    \nWe have $[x_k] = [-2, -1, 0, 1, 2]$ and $[y_k] = [1, -1, 1, -1, 1]$. Then\n\
    $p_4(x) = \\sum_{k=0}^{4} y_k L_k(x)$. So\n\n$p_4(x) = (1) \\cdot \\frac{x+1}{2+1}\
    \ \\cdot \\frac{x-0}{2-0} \\cdot \\frac{x-1}{2-1} \\cdot \\frac{x-2}{2-2}$ (Wait,\
    \ the OCR has errors in the formula, I will preserve the structure).\nThen simplified\
    \ $p_4(x) = \\frac{2}{3}x^4 - \\frac{8}{3}x^2 + 1$.\n\n# An “Easier” $L_k$ Formula\n\
    \nFor a set $[x_k]$ of $n+1$ knots, defined $L_i(x) = \\prod_{k=0, k \\neq i}^n\
    \ \\frac{x-x_k}{x_i-x_k}$. This formula is computationally intensive.\nSet $\\\
    omega(x) = \\prod_{k=0}^n (x-xk)$.\n\n- 1. The numerator of $L_i$ is $\\omega(x)/(x-x_i)$.\n\
    - 2. The denominator of $L_i$ is $\\omega'(x)$ evaluated at $x_i$. Rewrite as\
    \ $\\frac{\\omega(x)}{x-x_i}$. Take the limit as $x \\to x_i$:\n$\\lim_{x \\to\
    \ x_i} \\frac{\\omega(x)}{x-x_i} = \\omega'(x_i)$.\nThus $L_i(x) = \\frac{\\omega(x)}{(x-x_i)\\\
    omega'(x_i)}$. A very compact formula!\n\n# Properties of the $L_k$'s\n\nProposition\n\
    For the Lagrange interpolating polynomial $p_n(x) = \\sum_{k=0}^{n} y_k L_k(x)$:\n\
    \n- 1. $p_n(x)$ is the nth degree polynomial s.t. $p_k(x) = y_k$ for $k=0..n$.\n\
    - 2. $L_k(j) = \\delta_{kj} = \\begin{cases} 1 & j=k \\\\ 0 & j \\neq k \\end{cases}$\
    \ (See Kronecker delta.)\n- 3. $\\sum_{k=0}^{n} L_k(x) = 1$.\n- 4. If $q(x)$ is\
    \ a polynomial of degree $\\leq n$ with $y_k = q(xkk then $q \\equiv p_n$.\n-\
    \ 5. The set $\\{L_k(x) : k=0..(n-1)\\}$ is a basis of $\\mathbb{P}_{n-1}$.\n\n\
    # Theorem (Lagrange Interpolation Error)\n\nIf $f \\in \\mathcal{C}^{n+1}[a,b]$\
    \ and $\\{x_k\\} \\in [a,b]$, then\n$\\epsilon_n = |f(x) - p_n(x)| \\leq \\frac{(b-a)^{n+1}}{(n+1)!}\
    \ \\max |f^{(n+1)}(x)|$.\n\n# Drawbacks\n\n# More Knots\n\nTo decrease the error,\
    \ use more knots. But ... all the $L_k(x)$ change.\n\n- Set $\\{x_k\\} = \\{-2,\
    \ 1, 2\\}$. Then\n$L_0(x) = \\frac{x-1}{-2-1} \\cdot \\frac{x-2}{-2-2} = \\frac{1}{12}x^2\
    \ - \\frac{1}{4}x + \\frac{1}{6}$\n$L_1(x) = \\frac{x+2}{1+2} \\cdot \\frac{x-2}{1-2}\
    \ = -\\frac{1}{3}x^2 + \\frac{4}{3}$\n$L_2(x) = \\frac{x+2}{2+2} \\cdot \\frac{x-1}{2-1}\
    \ = \\frac{1}{4}x^2 + \\frac{1}{4}x - \\frac{1}{2}$\n\n- Set $\\{x_k\\} = \\{-2,\
    \ -1, 1, 2\\}$. Then\n$L_0(x) = \\frac{x+1}{-2+1} \\cdot \\frac{x-1}{-2-1} \\\
    cdot \\frac{x-2}{-2-2} = -\\frac{1}{12}x^3 + \\frac{1}{6}x^2 + \\frac{1}{12}x$\n\
    $L_1(x) = \\frac{x+2}{-1+2} \\cdot \\frac{x-1}{-1-1} \\cdot \\frac{x-2}{-1-2}\
    \ = \\frac{1}{16}x^3 - \\frac{1}{6}x^2 - \\frac{2}{3}x + \\frac{2}{3}$\n$L_2(x)\
    \ = \\frac{x+2}{1+2} \\cdot \\frac{x+1}{1+1} \\cdot \\frac{x-2}{1-2} = -\\frac{1}{6}x^3\
    \ - \\frac{1}{2}x^2 + \\frac{2}{3}x - \\frac{2}{3}$\n$L_3(x) = \\frac{x+2}{2+2}\
    \ \\cdot \\frac{x+1}{2+1} \\cdot \\frac{x-1}{2-1} = \\frac{1}{12}x^3 + \\frac{1}{6}x^2\
    \ - \\frac{1}{12}x - \\frac{1}{6}$\n"
  mdcn: "\n\n# 附录 IV：用于 $GK_{7,15}$ 的 Legendre 与 Stieltjes 多项式\n\n## $GK_{7,15}$ 的多项式\n\
