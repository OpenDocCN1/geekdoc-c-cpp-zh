    \ \\times 2^{21-16}$\nSo $\\sigma = 1, f = 0.123475, \\beta = 2, e = 21$, and\
    \ $p = 16$.\nNote: $(-1)^1 \\times 0.23475 \\times 2^{21-16} = -3.95$, so err\
    \ = 0.\nStorage format: 1 | 21 | 0.123475 |\n\n- 2. $1/3 = (-1)^0 \\times 0.229166667\
    \ \\times 2^{16384-16383}$\nSo $\\sigma = 0, f = 0.229166667, \\beta = 2, e =\
