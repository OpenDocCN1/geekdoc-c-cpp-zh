    \ bits (100/256 $\\approx$ 39%)\n- Complicated arithmetic\n- Slower to compute\
    \ Nearly all calculators use BCD formats.\n\n# Floating Point Numbers\n\n## Definition\
    \ (Floating Point Representation)\nA number $x$ is represented (and approximated)\
    \ as\n$x = \\sigma \\times f \\times \\beta^{e-p}$\nwhere\n$\\sigma$: sign $\\\
    pm1$, $f$: mantissa, $\\beta$: usually 10,\n$e$: biased exponent (shifted), $p$:\
