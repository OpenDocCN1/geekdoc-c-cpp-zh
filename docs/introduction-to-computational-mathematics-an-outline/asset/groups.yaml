  - '[PAGE 113]


    # Halley''s Method Algorithm


    # Algorithm (Halley’s Method (Basic Outline))


    Given $f$ and $x_0$.


    +   0. Compute $f''$ and $f''''$.


    +   1. Set $k = 1$ and $H(x) = x - \frac{2f(x)f''(x)}{f''(x)^2 - f(x)f''''(x)}$.


    +   2. Compute $x_k = H(x_{k-1})$.


    +   3. If $f(x_k) \approx 0$, then $x_k$ is a root; quit


    +   4. else if $|f(x_k)|$ or $|x_k - x_{k-1}|$ is very small, then $x_k \approx$
    a root; quit


    +   5. Set $k = k+1$ and (if $k$ isn''t too big) go to 2.'
  - "[PAGE 114]\n\n# Halley's Method Pseudocode\n\n```\ninput : x0, eps, n\nextern:\
    \ f(x), df(x)=f'(x), ddf(x)=f''(x)\n1: fx0 ← f(x0);\n2: dfx0 ← df(x0);\n3: ddfx0\
    \ ← ddf(x0);\n4: for i ← 1 to n do\n5:     x1 ← x0 - 2·fx0·dfx0 / (2·dfx0^2 -\
    \ fx0·ddfx0)\n      fx1 ← f(x1);\n6: if |fx1| + |x1-x0| <eps then\n7:     return:\
    \ x1\n8: x0 ← x1;\n9: fx0 ← f(x1);\n10: dfx0 ← df(x1);\n11: ddfx0 ← ddf(x1);\n\
    12: return: x1\n```"
