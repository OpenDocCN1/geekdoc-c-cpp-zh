- md: "\n# One Function for All\n\n## Project: One Function for All, the Normal Distribution\n\
    \nThe mean and standard deviation for total SAT scores for 2021 are $\\mu = 1061$\
    \ (from Evidence-Based Reading 533 + Math 528) and $\\sigma = 217$, respectively.$^1$\
    \ Define the function\n\n```\n$F(x) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}} \\int_{-\\\
    infty}^{x} e^{-\\frac{1}{2}(\\frac{(t-\\mu)}{\\sigma})^2}dt$\n```\n\n- 1. Estimate\
    \ the derivative of $F(x)$ for student scores that are one standard deviation\
    \ above the mean.\n- 2. The minimum score for students scoring in the top 10%\
    \ is found by solving $0.10 = 1 - F(x)$. Use a root-finding method to find $x$.\n\
    - 3. Use a quadrature rule to evaluate $F(1157)$ — Appalachian State University’s\
    \ mean SAT score for entering first-year students in 2021.$^2$\n- 4. Use an interpolating\
    \ polynomial to approximate $F(x)$ for $x \\in [1100, 1500]$.\n\n> $^2$From the\
    \ SAT Suite of Assessments Annual Report, The College Board.\n$^2$From the College\
    \ Admission Scores website.\n\n# A Bit Adder in Excel\n\n## Project: Adding Bits\
    \ in Excel\n\n- 1. Implement the one-bit adder in Excel using IF-THEN statements\
    \ and AND, OR, and NOT functions.\n- 2. Test your design with all 8 triples of\
    \ 1-bit values.\n- 3. Make an eight-bit adder with carries.\n- 4. Test your design\
    \ with 10 random pairs of 8-bit numbers.\n- 5. Develop a mathematical model for\
    \ the cost of computing the sum of two eight-bit values.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_187_0.png)\n\
    \n# The Collatz Conjecture Project\n\n## Lothar Collat's Proposition\n\nLothar\
    \ Collat posed a problem in 1937 that is quite simple to state, but that still\
    \ eludes proof. For any positive integer $n$, define the sequence\n\n```\n$a_1\
    \ = n \\quad and \\quad a_{k+1} = \\begin{cases} \\frac{1}{2}a_k & \\text{if }\
    \ a_k \\text{ is even} \\\\ 3a_k + 1 & \\text{if } a_k \\text{ is odd} \\end{cases}\
    \ \\quad for k > 1$\n```\n\nCollatz conjectured the sequence would always reach\
    \ 1 no matter the starting value $n \\in \\mathbb{N}$.\n\n# Conjecture (Collatz's\
    \ $3n+1$ Problem)\n\nFor every $n \\in \\mathbb{N}$, there is a $k \\in \\mathbb{N}$\
    \ such that the sequence above has $a_k = 1$.\n\n# Currently...\n\nThe conjecture\
    \ has been verified for all starting values up to $87 \\cdot 2^{60}$. Read \"\
    The $3x+1$ Problem\" by J. Lagarias (January 1, 2011 version) and check Eric Roosendaal's\
    \ web site http://www.ericr.nl/wondrous/.\n\n# The Collatz Conjecture\n\n- 1.\
    \ Write a program, Collatz, that determines the *total stopping time* of a starting\
    \ value $n$. That is, given $a_1 = n$, find the first $k$ such that $a_k = 1$.\
    \ Define $Collatz(n) = k$.\n- 2. Explain why $Collatz(2^m) = m$.\n- 3. Generate\
    \ a point-plot of the sequence $[n, Collatz(n)]$ for $n = 1$ to 100,000.\n- 4.\
    \ Use your graph to find the maximum value of $Collatz(n)$ for $n$ from 1 to 100,000.\n\
    - 5. Which initial value $n \\le 10^6$ produces the largest total stopping time?\
    \ (Careful! For example, Collatz(159,487) = 183, but before $a_{183} = 1$, this\
    \ sequence hits $a_{67} = 17,202,377,752$, a value that very much overflows an\
    \ unsigned 32-bit integer.)\n- 6. Report on the history of Collatz's conjecture.\n\
    \n**Extra for Experts:** Prove that $Collatz(2^mn) = m + Collatz(n)$.\n\n# The\
    \ CORDIC Algorithm\n\nIn 1959, Jack Volder designed a way to compute trigonometric\
    \ functions very quickly, the CORDIC algorithm, while working on digitizing the\
    \ navigation system of the B58 Hustler, the Mach 2-capable supersonic bomber.\
    \ During the '70s, John Walther extended CORDIC to compute exponentials, logs,\
    \ and hyperbolic trigonometric functions. The algorithm became the standard for\
    \ calculators (using BCD).\n\n# CORDIC Recurrence Equations\n\n```\n$x_{k+1} =\
    \ x_k - 2^{-k}m\\delta_k y_k$\n$y_{k+1} = y_k + 2^{-k}\\delta_k x_k$\n$z_{k+1}\
    \ = z_k - \\delta_k \\sigma_k$\n```\n\nwhere $m=1$ (trig), $0$ (arith), or $-1$\
    \ (hyper), $\\delta_k=\\pm1$, and $\\sigma_k$ is a scaling factor.\n\n# CORDIC\
    \ Parameters\n\n| Parameter Choices | Rotation Mode | Vector Mode |\n| :--- |\
    \ :--- | :--- |\n| | $\\delta_k = \\text{sgn}(z_k)$ $(z_k \\to 0)$ | $\\delta_k\
    \ = -\\text{sgn}(y_k)$ $(y_k \\to 0)$ |\n| $m = 1$ | $\\langle x_0, y_0, z_0 \\\
    rangle = \\langle K, 0, \\theta \\rangle$ $x_n \\to \\cos(\\theta)$; $y_n \\to\
    \ \\sin(\\theta)$ | $z_n \\to \\tan^{-1}(y/x)$ |\n| $m = 0$ | $\\langle x_0, y_0,\
    \ z_0 \\rangle = \\langle x, 0, z \\rangle$ $y_n \\to x \\times z$ | $z_n \\to\
    \ y/x$ |\n| $m = -1$ | $\\langle x_0, y_0, z_0 \\rangle = \\langle K', 0, \\theta\
    \ \\rangle$ $x_n \\to \\cosh(\\theta)$; $y_n \\to \\sinh(\\theta)$ | $z_n \\to\
    \ \\tanh^{-1}(y/x)$ |\n| (some $\\sigma_k$ repeated) | $\\langle x_0, y_0, z_0\
    \ \\rangle = \\langle w+1, w-1, 0 \\rangle$ $x_n + y_n \\to e^\\theta$ | $z_n\
    \ \\to \\frac{1}{2}\\ln(w)$ |\n\n$K = \\prod_{j=0}^n \\cos(\\sigma_k),quad K'\
    \ = \\prod_{j=0}^n \\cosh(\\sigma_k)$\n\n# CORDIC in Maple\n\n## CORDIC Trigonometric\
    \ Functions with Maple\n\n```\nCORDIC[Trig] :=proc(t)\n  local n, K, x, y, z,\
    \ j, del;\n  n :=47;\n  K:=cos(arctan(1.0));\n  for j to n-1 do\n    K:=K.cos(arctan(2.-j))\n\
    \  end do;\n  (x[1], y[1],z[1]) := (K, 0, evalf(t));\n  for j to n+1 do\n    del:=sign(z[j]);\n\
    \    if del=0 then del :=1 if;\n    x[j+1]:=x[j]-del.y[j].2.-j+1;\n    y[j+1]:=y[j]+del.x[j].2.-j+1;\n\
    \    z[j+1]:=z[j]-del.arctan(2.-j+1);\n  end do;\n  return (normal([x[j], y[j],\
    \ z[j]]));\nend proc:\n```\n\n# The CORDIC Project\n\n- 1. Modify the Maple program\
    \ CORDIC[Trig] to compute $\\arctan(\\theta)$.\n- 2. Write a Maple program CORDIC[HyperTrig]\
