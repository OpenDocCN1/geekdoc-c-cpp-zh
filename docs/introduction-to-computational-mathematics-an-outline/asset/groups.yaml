    le M \\cdot |\\alpha-a|\nor, with $\\varepsilon_n = |\\alpha-x_n|$,\n$\\varepsilon_{n+1}\
    \ \\le M \\cdot \\varepsilon_n$\nwhere $0 < M < 1$ is a constant depending on\
    \ $|f''(x)|$ and $|f'(x)|$ on $I$.\n\nThis is linear or “order 1” convergence.\
    \ (The same as the bisection method.)"
  - '[PAGE 109]


    # Regula Falsi Algorithm


    Algorithm (Regula Falsi (Basic Method))

    Given $f, a,$ and $b$:

    1. Set $k=1$ and $S(a,b) = b - f(b) \cdot \frac{b-a}{f(b)-f(a)} = \frac{a \cdot
    f(b) - b \cdot f(a)}{f(b)-f(a)}

    2. Compute $c = S(a,b).

    3. If $f(c) \approx 0$, then $c$ is a root; quit

    4. If $f(c) \cdot f(a) < 0$, then $b \leftarrow c$

    5. else $a \leftarrow c$

    6. If $|b-a|$ is very small compared to $|a|$, then $a$ is a root; quit

    7. Set $k = k+1$, and (if $k$ isn''t too big) go to 2.'
