  - '[PAGE 130]


    # Trapezoid Sums


    Instead of the degree 0 rectangle approximations to the function, use a linear
    degree 1 approximation. The area of the trapezoid is given by


    ```

    $A_T = \frac{1}{2}[f(x_{k-1}) + f(x_k)]\Delta x_k.$

    ```


    This gives an approximation for the integral


    ```

    $\int_a^b f(x)dx \approx \sum_{k=1}^n \frac{1}{2}[f(x_{k-1}) + f(x_k)]\Delta x_k.$

    ```


    [Midpoint: measure height at average $x$ v. trapezoid: average the height measures]


    The formula is often written as


    ```

    $T_n \approx \left[f(x_0) + \left(2\sum_{k=1}^{n-1} f(x_k)\right) + f(x_n)\right]\frac{\Delta
    x_k}{2}.

    ```


    Error for the trapezoid rule is


    ```

    $\epsilon_n \le \frac{(b-a)^3}{12} \cdot M_2 \cdot \frac{1}{n^2}.$

    ```


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_130_0.png)'
