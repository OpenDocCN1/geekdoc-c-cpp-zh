  - '[PAGE 136]


    # Gaussian Quadrature


    Johann Carl Friedrich Gauss

    About 1815, while Gauss was finishing constructing an astronomical observatory,
    he wrote a paper³ on approximating integrals. Gauss''s technique was studied and
    extended by Christoffel in 1858. There are several good ways to develop this method.
    We''ll use the easiest ...


    # In Search of Improvements


    Write the rules we''ve seen as sums:

    Left endpt: $L_n = \frac{1}{n}f(x_0) + \frac{1}{n}f(x_1) + \dots + \frac{1}{n}f(x_{n-1})$nRight
    endpt: $R_n = \frac{1}{n}f(x_1) + \frac{1}{n}f(x_2) + \dots + \frac{1}{n}f(x_n)$

    Midpoint: $M_n = \frac{1}{n}f(x_{m1}) + \frac{1}{n}f(x_{m2}) + \dots + \frac{1}{n}f(x_n)$

    Trapezoid: $T_n = \frac{1}{2}f(x_0) + \frac{1}{n}f(x_1) + \dots + \frac{1}{n}f(x_{n-1})
    + \frac{1}{2}f(x_n)$

    Simpson’s: $S_n = \frac{1}{3n}f(x_0) + \frac{4}{3n}f(x_1) + \frac{2}{3n}f(x_2)
    + \dots + \frac{4}{3n}f(x_{n-1}) + \frac{1}{3n}f(x_n)$


    > ³ Methodus nova integralium valores per approximationem invieniendi, Comment
    Soc Regiae Sci Gottingensis Recientiores, v. 3, 1816.'
