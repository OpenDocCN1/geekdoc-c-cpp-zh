  - '[PAGE 128]


    # V. Numerical Integration


    # ### What Is Numerical Integration?


    Numerical integration or (numerical) quadrature is the calculation of a definite
    integral using numerical formulas, not the fundamental theorem. The Greeks studied
    quadrature: given a figure, construct a square that has the same area. The two
    most famous are Hippocrates of Chios'' Quadrature of the Lune (c. 450 BC) and
    Archimedes'' Quadrature of the Parabola (c. 250 BC). Archimedes used the method
    of exhaustion — a precursor to calculus — invented by Eudoxus.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_128_0.png)


    Squaring the circle is one of the classical problems of constructing a square
    with the area of a given circle — it was shown to be impossible by Lindemann''s
    theorem (1882).¹


    > ¹Lindemann was the first to prove that π is transcendental.'
