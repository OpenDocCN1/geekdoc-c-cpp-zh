    # 切比夫多项式\n\n帕夫努季·L·切比雪夫（Pafnuty L. Chebyshev）工作于数论、近似理论和统计学。以他命名的特殊多项式是切比夫多项式\
    \ $T_n(x)$，它们具有许多有趣的性质。例如，$T_n$ 随 $n$ 的奇偶性而变化，在区间 $[-1, 1]$ 上在 $-1$ 和 $1$ 之间振荡，且所有零点都在\
    \ $[-1, 1]$ 内。$T_n$ 的霍纳形式非常有趣。设 $u = x^2$，则：\n\n```\n$-3x+4x^3 \\iff x(-3+4x^2)\
    \ = x(-3+4u)$\n\n$1-8x^2+8x^4 \\iff 1+u(-8+8u)$\n\n$5-20x^3+16x^5 \\iff x(5+u[-20+16u])$\n\
