    \ n!} \\frac{d^n}{dx^n} [(x^2-1)^n]$（勒让德多项式）。然后 $\\{x_i\\}_{i=1}^n = P_n$ 的零点，$w_i\
    \ = \\frac{2}{(1-x_i^2)[P'_n(x_i)]^2}$。\n\n# 高斯-克罗德积分\n\n亚历山·克罗德的想法（1964）\n\n\
    高斯积分的一个困难是增加节点数量需要重新计算所有的权重函数值。克罗德发现可以将 $n+1$ 个新节点与 $n$ 个原始高斯节点交替排列，得到一个 $3n+1$\
    \ 阶规则。$2n+1$ 节点的高斯积分将具有 $4n+1$ 阶，但克罗德方法仅增加了 $n$ 个节点却需要巨大的额外计算。\n\n> 坏消息：计算节点和权重超出了我们的课程范围。节点是\
