    VIII. 参考文献 ................................................... 200\n\n*注：* 大纲内的浅蓝色文本为内部链接；灰色文本链接指向网页。\n\
    \n# 计算数学导论：大纲\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_7_0.png)\n\n照片 © WmCB,\
    \ 2015\n\n我曾两次被问到：“请问，巴贝奇先生，如果您向机器里输入错误的数字，会得到正确的答案吗？”……我无法正确理解引发此类问题的思想混淆程度。——\
    \ 查尔斯·巴贝奇《传记节选》第 67 页。计算计算\n\n# 前言：计算重要吗？\n\n简单的计算错误可能会导致严重问题。\n\n# 火星轨道器坠毁\n\n\
    两个团队使用了不同的单位：NASA 使用了公制，洛克希德马丁使用了单位。\n\n# 5 号火箭爆炸\n\n火箭在起飞后 37 秒因软件整数溢出而爆炸。查看火箭视频。\n\
    \n# 海湾战争达赫兰导弹\n\n爱国者导弹系统在二进制下计算时间。在运行 100 小时后，该系统失效，导致 28 名美国士兵死亡。阅读 Michael Barr\
    \ 的“导弹软件缺陷”。\n\n# 前言：计算的三个因素\n\n在学习计算时要考虑三个方面。前两个相互制衡：\n\n## 准确性与效率\n\n**准确性**涉及产生多少错误以及如何控制错误。\n\
    \n**效率**涉及需要多少计算来产生结果。\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_9_0.png)\n\n\
    **稳定性**是第三个记住的方面。在稳定的计算中，输入的微小变化只会产生输出的微小变化。作为对比，研究“伦兹吸引子”。\n\n![](img/de7f33bb3aa5a3d79f7b9_1.png)\n\
    \n# 前言：计算数学课程\n\n这套幻灯片是在阿巴拉契亚州立大学教授 MAT 2310（3 学分）期间开发的。该课程旨在介绍数值分析，并让学生在数学环境中获得编程经验。示例大纲如下：\n\
    \n- 1. 计算机算术 ....... 2 周\n- 4. 寻根算法 . . 3 周\n- 2. 控制结构 . . . . . . . . . 2 周\n\
    - 5. 数值积分 . . . . 2 周\n- 3. 数值微分 . . 3 周\n- 6. 多项式插值 . . 2 周\n- 中期考试\n- 团队项目海报\
    \ . . . 1 周\n- 期末考试\n\n编程是使用代数系统 Maple 完成的，以便于调整精度，并使用了 Python。特殊课题和案例研究视时间而定。小组项目出现在大纲的最后。\n\
    \n感谢 MAT 2310 的学生们，他们经历了了新课程和这些幻灯片的开发过程。非常感谢我的同事 Greg Rhoads、René Salinas 和 Eric\
    \ Marland，他们共同设计了课程并在过程中提供了极好的反馈。\n\n> — WmCB, 2022年8月\n\n# I. 计算机算术\n\n章节\n1.\
