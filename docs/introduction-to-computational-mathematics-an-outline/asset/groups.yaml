  - '[PAGE 30]


    # Error


    # Defining Error


    Absolute Error: The value $err_{abs} = |actual - approximate|$


    Relative Error: The ratio $err_{rel} = \frac{|actual - approximate|}{|actual|}
    = \frac{err_{abs}}{|actual|}$


    # Example (Weighty Thoughts)


    A long-tailed field mouse normally weighs up to about 50 g. Suppose a lab-tech
    makes an error of 2.5 g ($\approx a penny$) when weighing a mouse. The relative
    error is


    $err_{rel} = \frac{2.5g}{50g} = 5\%$.


    A mature African bush elephant normally weighs about 6.5 tons. Suppose a zookeeper
    makes an error of 50# ($\approx 7-yr-old boy$) weighing an elephant. The relative
    error is


    $err_{rel} = \frac{50\#}{13000\#} \dote 0.4\%$.'
