    \ |a_k|$。则 $|r| \\leq M+1$。\n\n# 二分法算法\n\n算法（二分法概要）\n给定 $f$ 和 $[a,b]$。\n1. 设置\
    \ $k = 0$ 且 $[a_0,b_0] = [a,b]$。\n2. 计算 $c = \\frac{1}{2}(a_k + b_k)$\n3. 如果 $f(c)\
    \ \\approx 0$，则 $c$ 为根；退出。\n4. 如果 $f(c) \\cdot f(a_k) < 0$，则设置 $[a_{k+1},b_{k+1}]\
    \ = [a_k,c]$。\n5. 否则如果 $f(c) \\cdot f(b_k) < 0$，则设置 $[a_{k+1},b_{k+1}] = [c,b_k]$。\n\
    6. 设置 $k = k+1$ 并（如果 $k$ 不太大）返回第 2 步。\n\n"
