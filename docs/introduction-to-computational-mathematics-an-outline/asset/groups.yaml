    $b_{-5} = 1$; $x = 0.0$ Stop\n\nWhence $x_2 = 0.10111$\n\n# Conversions\n\n##\
    \ Terminating Expansions?\nWhen does a fraction's expansion terminate?\nBase 10:\
    \ A decimal fraction terminates when $r = \\frac{n}{10^p} = \\frac{n}{2^p \\cdot\
    \ 5^p}$.\nBase 2: A binary fraction terminates when $r = \\frac{m}{2^p}$.\n\n\
    - ### Examples\n1. $\\frac{1}{10} = 0.1\\overline{10} = 0.00011_2$\n2. $\\frac{1}{3}\
