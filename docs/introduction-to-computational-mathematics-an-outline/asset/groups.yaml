    # # Space Shuttle Acceleration


    # ## Space Shuttle Acceleration: The Situation³


    The Space Shuttle had three phases from ignition to achieving orbit. The first
    phase began by the shuttle lifting off the launch pad using solid rocket boosters
    (SRBs) to accelerate extremely quickly. At approximately two minutes, the SRBs
    were separated and fell back to Earth.


    The second phase began with SRB separation and lasted approximately 6.5 minutes.
    The shuttle speed increased to 17,500 mph — the speed needed to achieve orbit.
    (Note this speed is a good deal less than the Earth''s escape velocity of 25,000
    mph).


    The third phase began at about 9 minutes when the fuel external tank was jettisoned
    and the shuttle entered orbit. NASA''s data (next pg) lists the time, altitude,
    and velocity for STS-121 from July 4, 2006.


    PROJECT.


    +   1. Using different divided difference formulas, compute and graph the shuttle''s
    acceleration. Compare the results from each method.

    2. Determine the maximum acceleration and its time.

    3. Approximate the acceleration when the shuttle entered orbit at 9 minutes.

    4. Explain why the shuttle''s velocity cannot be computed from ΔAltitude/time.'
