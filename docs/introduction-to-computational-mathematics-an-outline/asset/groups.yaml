    \ the Geometry of Halley’s Method,” Am. Math. Mo., Vol. 102, No. 5, pp. 417–426.\n\
    \n# Halley's Method Error\n\nTheorem\n\nLet $f \\in \\mathcal{C}^3(I)$ on some\
