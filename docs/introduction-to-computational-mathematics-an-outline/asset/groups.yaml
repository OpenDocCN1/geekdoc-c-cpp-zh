    \ 82\n\n# III. Numerical Differentiation\n\nWhat is Numerical Differentiation?\n\
    \nNumerical Differentiation is the approximation of the derivative of a function\
    \ at a point using numerical formulas, The basic form uses the slope of a short\
    \ chord rather than the tangent line. Since we are subtracting numbers, loss of\
    \ computational precision can be a serious problem. Taylor series will be our\
    \ basic tool for developing error bounds for numerical derivatives. Errors have\
    \ two main components: truncation errors from Taylor polynomials and round-off\
    \ errors from finite-point arithmetic.\n\nDefinition (Taylor Polynomials)\nIf\
    \ $f$ has sufficiently many derivatives at $x=a$, the Taylor polynomial of degree\
    \ $n$ (or order $n$) is\n$$p_n(x) = \\sum_{k=0}^{n} \\frac{f^{(k)}(a)}{k!}(x-a)^k$$\n\
    where $f^{(0)}(a) = f(a)$.\n\nTheorem (Taylor's Theorem)\nSuppose $f$ has $n+1$\
    \ derivatives on a neighborhood of $a$. Then\n$$f(x) = p_n(x) + R_n(x)$$\nfor\
    \ some $c$ between $x$ and $a$. Actually, discovered by Gregory 14 years before\
    \ Taylor was born!\n\nProving Taylor's Theorem (Outline).\n1. The formula $\\\
    Rightarrow f(x) = f(a) + \\int_{a}^{x} f'(t) \\, dt$.\n2. Integrate by parts with\
    \ $u = f'(t)$ and $dv = dt$:\n$f(x) = f(a) + f'(a)(x-a) + \\int_{a}^{x} f''(t)\
    \ \\cdot t \\, dt$.\n3. Repeat the process: choose $u = f^{(k)}(t)$ and $dv =\
    \ \\frac{t^{k-1}}{(k-1)!}$ to arrive at\n$f(x) = f(a) + f'(a)(x-a) + \\frac{f''(a)}{2!}(x-a)^2\
    \ + \\dots + \\frac{f^{(n)}(a)}{n!}(x-a)^n + R_n(a,x)$\nwhere\n$R_n(a,x) = \\\
    frac{1}{n!}\\int_{a}^{x} f^{(n+1)}(t) \\cdot t^n \\, dt.$\n\n| Tailored Expressions\
    \ | Forms of the Remainder |\n| :--- | :--- |\n| Lagrange (1797) | $R_n(x) = \\\
    frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$ |\n| Cauchy (1821) | $R_n(x) = \\frac{f^{(n+1)}(c)}{n!}(x-a)^n$\
    \ |\n| Integral Form | $R_n(x) = \\frac{1}{n!}\\int_a^x f^{(n+1)}(t)(x-a)^n \\\
    , dt$ |\n| Uniform Form | $|R_n(x)| \\leq \\frac{|x-a|^{n+1}}{(n+1)!} \\cdot \\\
    max |f^{(n+1)}(x)| = O(|x-a|^{n+1})$ |\n\nUseful Taylor Expansions\nSet $x = a+h$\
    \ in the Taylor polynomial.\n$f(a+h) = f(a) + f'(a) \\cdot h + \\frac{1}{2!}f''(a)\
    \ \\cdot h^2 + \\frac{1}{3!}f'''(a) \\cdot h^3 + \\dots$ (1)\nAnd now set $x =\
    \ a-h$.\n$f(a-h) = f(a) - f'(a) \\cdot h + \\frac{1}{2!}f''(a) \\cdot h^2 - \\\
    frac{1}{3!}f'''(a) \\cdot h^3 \\pm \\dots$ (2)\n\n# Forward Difference Approximation\n\
    \nForward Difference\nSubtract $f(a)$ from both sides of Eq (1), then divide by\
    \ $h$ to obtain\n```\n$$\\frac{f(a+h) - f(a)}{h} = f'(a) + \\frac{O(h^2)}{h}$$\n\
    ```\nThe Forward Difference Formula is:\n```\n$$f'(a) = \\frac{f(a+h) - f(a)}{h}\
    \ + O(h). \\quad (FD)$$\n```\n\nExamples\n1. Suppose $f(x) = 1 + xe^{\\sin(x)}$.\
    \ For $a=0$ and $h=0.1$, we have\n$f'(x) \\approx (1.1105 - 1.0000)/0.1 = 1.1050$.\n\
    2. Suppose $P_0 = (1.000, 3.320)$ and $P_1 = (1.100, 3.682)$. Then\n$f'(x) \\\
    approx (3.682 - 3.320)/(1.100 - 1.000) = 3.620$.\n\n# Backward Difference Approximation\n\
    \nBackward Difference\nSubtract $f(a)$ from both sides of Eq (2), then divide\
    \ by $h$ to obtain\n```\n$$\\frac{f(a-h)-f(a)}{h} = -f'(a) + \\frac{O(h^2)}{h}$$\n\
    ```\nThe Backward Difference Formula is:\n```\n$$f'(a) = \\frac{f(a)-f(a-h)}{h}\
    \ + O(h). \\quad (BD)$$\n```\n\nExamples\n1. Again, suppose $f(x) = 1+xe^{\\sin(x)}$.\
    \ For $a=0$ and $h=0.1$, we have\n$f'(x) \\approx (1.000 - 0.910)/0.1 = 0.900$.\n\
    2. Suppose $P_0 = (1.000, 3.320)$ and $P_1 = (0.900, 2.970)$. Then\n$f'(x) \\\
    approx (3.320-2.970)/(1.000-0.900) = 3.500$.\n\n# Centered Difference Approximation\n\
    \nCentered Difference\nSubtract $O(h^3)$ versions of Eqs (1) and (2).\n```\n$f(a+h)\
    \ = f(a) + f'(a) \\cdot h + \\frac{1}{2!}f''(a) \\cdot h^2 + O(h^3)$\n$f(a-h)\
    \ = f(a) - f'(a) \\cdot h - \\frac{1}{2!}f''(a) \\cdot h^2 + O(h^3)$\n$f(a+h)\
    \ - f(a-h) = 2f'(a) \\cdot h + O(h^3)$\n```\nSolve for $f'(a)$ to obtain:\nThe\
    \ Centered Difference Formula:\n> $f'(a) = \\frac{f(a+h) - f(a-h)}{2h} + O(h^2).\
    \ \\quad (CD)$\n\nExample\n- Once more, suppose $f(x) = 1 + xe^{\\sin(x)}$. For\
    \ $a=0$ and $h=0.1$, we have\n$f'(x) \\approx (1.110 - 0.910)/0.2 = 1.000$\n"
  mdcn: "\n\n# 霍纳形式\n\n# 部分因式分解\n\n威廉·霍纳（William Horner）研究了代代数方程的求解以及高效计算的形式。霍纳观察到部分因式分解可以简化多项式的计算。考虑：\n\
