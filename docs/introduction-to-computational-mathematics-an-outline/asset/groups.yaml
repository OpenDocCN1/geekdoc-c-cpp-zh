    \ 个未知数 $w_i$ 和 $x_i$，让我们寻找一组能够精确积分 $2n-1$ 次多项式的集合。（记住：一个 $2n-1$ 次多项式有 $2n$ 个系数。）\n\
    \n# 采样 3\n\n# 示例（三次）\n\n设置 $n = 3$。确定 $w_i$ 和 $x_i$ 的选择，使得\n\n$$\\int_{-1}^{1}\
    \ x^p dx = \\sum_{k=1}^{3} w_k \\cdot x_k^p$$\n\n对于 $p = 0, 1, \\dots, 5 = 2 \\\
    cdot 3 - 1$ 精确成立。\n\n幂 $p$ 的范围给了我们六个方程组：\n\n```\n$$\\begin{cases} w_1 + w_2 +\
    \ w_3 &= 2 \\\\ w_1 x_1 + w_2 x_2 + w_3 x_3 &= 0 \\\\ w_1 x_1^2 + w_2 x_2^2 +\
    \ w_3 x_3^2 &= \\frac{2}{3} \\\\ w_1 x_1^3 + w_2 x_2^3 + w_3 x_3^3 &= 0 \\\\ w_1\
    \ x_1^4 + w_2 x_2^4 + w_3 x_3^4 &= \\frac{2}{5} \\\\ w_1 x_1^5 + w_2 x_2^5 + w_3\
    \ x_3^5 &= 0 \\end{cases} \\implies \\begin{cases} x_1 = -\\sqrt{\\frac{3}{5}},\
    \ & x_2 = 0, & x_3 = \\sqrt{\\frac{3}{5}} \\\\ w_1 = \\frac{5}{9}, & w_2 = \\\
    frac{8}{9}, & w_3 = \\frac{5}{9} \\end{cases}$$\n```\n\n我们的高斯积分 $G_3(f) = \\frac{5}{9}\
