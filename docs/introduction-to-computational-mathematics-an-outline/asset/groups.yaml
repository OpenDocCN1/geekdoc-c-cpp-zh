  mdcn: "\n\n# 间插：伯恩斯坦多项式 (Bernstein Polynomials)\n\n## 定义（$f$ 的伯恩斯坦多项式）\n\n伯恩斯坦基多项式：$b_{n,k}(x)\
    \ = \\binom{n}{k}x^k(1-x)^{n-k}$，$k=0..n$\n\n$f$ 的伯恩斯坦多项式：设 $f:[0,1] \\to \\mathbb{R}$。那么\n\
    \n$B_n(f) = \\sum_{k=0}^n f\\left(\\frac{k}{n}\\right)\\binom{n}{k}x^k(1-x)^{n-k}$\n\
    \n**注意：** 如果 $g:[a,b] \\to \\mathbb{R}$，则使用 $f(x)=g(a+(b-a)x)$。\n\n## 示例\n\n设\
    \ $f(x)=x^3，$x \\in[0,1]$。那么 $B_n(f) = \\sum_{k=0}^n \\frac{k^3}{n^3}\\binom{n}{k}x^k(1-x)^{n-k}$\n\
    \n$B_1(x)=x \\quad\\quad B_2(x)=\\frac{1}{4}x+\\frac{3}{4}x^2$\n\n$B_3(x)=\\frac{1}{9}x+\\\
    frac{2}{3}x^2+\\frac{1}{9}x^3 \\quad\\quad B_4(x)=\\frac{1}{16}x+\\frac{9}{16}x^2+\\\
    frac{3}{8}x^3$\n\n## 伯恩斯坦基函数\n\n### 伯恩斯坦基函数，$n = 3$\n\n$k=0: \\quad b_{3,0}(x)\
    \ = (1-x)^3 \\quad k=1: \\quad b_{3,1}(x) = 3x(1-x)^2$\n$k=2: \\quad b_{3,2}(x)\
    \ = 3x^2(1-x) \\quad k=3: \\quad b_{3,3}(x) = x^3$\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_160_0.png)\n\
    \n## 伯恩斯坦与拉格朗日\n\n### 示例（$f(x) = \\text{Heaviside}(x-\\frac{1}{2})$）\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_161_0.png)\n\
    \n## 牛顿插值法\n\n### 牛顿基多项式\n\n为了方便添加新节点，我们改变了基多项式的集合。给定一组 $n+1$ 个节点 $\\{x_k\\}$，令：\n\
    \n```\n$N_0(x) = 1$\n$N_1(x) = (x - x_0)$\n$N_2(x) = (x - x_0)(x - x_1)$\n$N_3(x)\
    \ = (x - x_0)(x - x_1)(x - x_2)$\n:$\n$N_n(x) = (x - x_0)(x - x_1) \\cdots (x\
    \ - x_{n-1})$\n```\n\n现在令\n\n```\n$P_n(x) = \\sum_{k=0}^{n} a_k N_k(x)$\n```\n\
    \n注意 $\\mathcal{B}_N = \\{N_k(x) | k = 0..n\\}$ 构成 $P_n$ 的一个基。\n\n### 牛顿系数\n\n\
    计算 $a_k$\n\n对于一组 $n+1$ 个数据点 $\\{x_k, y_k\\}$，递归地定义（前向）差分，因为牛顿插值多项式为：\n\n$P_n(x)\
    \ = [y_0] + [y_0, y_1](x-x_0) + [y_0, y_1, y_2](x-x_0)(x-x_1) + [y_0, y_1, y_2,\
    \ y_3](x-x_0)(x-x_1)(x-x_2) + \\dots = \\sum_{k=0}^n [y_0, \\dots, y_k]N_k(x)$。\n\
    \n### 第一个样本\n\n设 $\\mathcal{S} = \\{[-2,1], [-1,-1], [0,1], [1,-1], [2,1]\\}$。从构建差分表开始。\n\
    \n| x | -2 | -1 | 0 | 1 | 2 |\n|---|---|---|---|---|---|\n| y | 1 | -1 | 1 | -1\
    \ | 1 |\n| $[y_0]$ | 1 | -1 | 1 | -1 | 1 |\n| $[y_0,y_1]$ | | -2 | 2 | -2 | 2\
    \ |\n| $[y_0,y_1,y_2]$ | | | 2 | -2 | 2 |\n| $[y_0,y_1,y_2,y_3]$ | | | | -4/3\
    \ | 4 |\n| $[y_0,y_1,y_2,y_3,y_4]$ | | | | | 2/3 |\n\n那么 $P_4(x) = \\sum_{k=0}\
    \ [y_0, \\dots, y_k]N_k(x) = 1-2(x+2)+2(x+2)(x+1)-\\frac{4}{3}(x+2)(x+1)+\\frac{2}{3}(x+2)(x-1)\
    \ = 1-\\frac{8}{3}x^2+\\frac{2}{3}x^4$。\n\n### 第二个样本\n\n### Heaviside 函数\n\n设\
    \ $\\mathscr{S} = \\{[0,0], [\\frac{1}{3},0], [\\frac{2}{2},0], [\\frac{3}{3},1],\
    \ [\\frac{4}{4},1], [1,1]\\}$。开始构建差分表。\n\n| x | 0 | 0.2 | 0.4 | 0.8 | 1 |\n|---|---|---|---|---|---|\n\
    | y | 0 | 0 | 0 | 1 | 1 |\n| $[y_0,y_1]$ | | | 0 | 5 | 0 |\n| $[y_0,y_1,y_2]$\
    \ | | | $25/2$ | $-25/2$ | 0 |\n| $[y_0,y_1,y_2,y_3]$ | | | $125/6$ | $-125/3$\
    \ | $125/6$ |\n| $[y_0,y_1,y_2,y_3,y_4]$ | | | | $-625/8$ | $625/8$ |\n| $[y_0,y_1,y_2,y_3,y_4,y_5]$\
    \ | | | | | $625/4$ |\n\n那么 $P_5(x) = \\sum_{k=0}^5 [y_0, \\dots, y_k]N_k(x) =\
    \ \\frac{137}{12}x - \\frac{875}{8}x^2 + \\frac{1000}{3}x^3 - \\frac{3125}{6}x^4\
    \ + \\frac{625}{4}x^5$。\n\n## 两种比较\n\n### 示例（$\\cos(\\pi x)$ vs 拉格朗日、牛顿与泰勒）\n\n\
    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_166_0.png)\n\n拉格朗日：$L_4 = \\frac{(x+1)(x)(x-1)(x-2)}{24}\
    \ + \\frac{(x+2)(x)(x-1)(x-2)}{6} + \\frac{(x+2)(x+1)(x-1)(x-2)}{4} + \\frac{(x+2)(x+1)(x)(x-1)}{6}$\n\
    \n牛顿法：$N_4 = 1-2(x+2)+2(x+2)(x+1)-\\frac{4}{3}(x+2)(x+1) + \\frac{2}{3}(x+2)(x+1)(x-1)$\n\
    \n泰勒法：$T_4 = 1-\\frac{\\pi^2}{2}x^2+\\frac{\\pi^4}{24}x^4$\n\n### 第二次比较\n\n###\
    \ 移位 Heaviside：$f(x) = \\text{Heaviside}(x-1/2)$ 在 $[0,1]$ 上\n\n拉格朗日：$L_5 = \\\
    frac{3125}{12}(x-\\frac{1}{3})(x-\\frac{2}{3})(x-\\frac{4}{3}) - \\frac{3125}{24}(x-\\\
    frac{1}{5})(x-\\frac{2}{5})(x-\\frac{3}{5}) + \\frac{625}{24}(x-\\frac{1}{5})(x-\\\
    frac{2}{5})(x-\\frac{3}{5})$\n\n牛顿法：$N_5 = \\frac{125}{6}(x-\\frac{1}{5})(x-\\\
    frac{2}{5})(x-\\frac{3}{5}) - \\frac{625}{8}(x-\\frac{1}{5})(x-\\frac{2}{5})(x-\\\
    frac{3}{5}) + \\frac{625}{4}(x-\\frac{1}{5})(x-\\frac{2}{5})(x-\\frac{3}{5})$\n\
    \n伯恩斯坦法：$B_5 = 10x^3(1-x)^2 + 5x^4(1-x)$\n\n泰勒法：$T_5$ 在中心点 $a = \\frac{1}{2}$\
    \ 处是不可能的。（为什么？）在 $a \\in (1/2, 1]$ 处，$T_5 = 1$。\n\n## 间插：样条 (Splines)\n\n### 样条\n\
    \n当存在多个间隔节点时，拉格朗日和牛顿多项式会产生过度震荡。为了缓解这个问题，使用“样条”，即对导数有条件的分段低次多项式。两种最常用的样条是：\n\n\
    - Bézier 样条是分段伯恩斯坦多项式 [Casteljau (1959) 和 Bézier (1962)]。\n- 三次 B 样条是在节点节点二阶导数为零的分段三次多项式\
    \ [Schoenberg (1946)]。\n\n除了工程、绘图和 CAD 外，样条还用于许多领域。TrueType 字体使用 2-D Bézier 曲线。PostScript\
    \ 和 MetaFont 使用 2-D Bézier 曲线。\n\n## 练习，I\n\n### 练习\n\n对于 1. 到 5. 给出的每个函数：\n\n\
