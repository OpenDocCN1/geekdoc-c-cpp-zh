    \ |\n| $1+2x+3x^2 = 1+x\\cdot(2+3x)$ | $2$ 加$+3$ 乘 $2$ 加$+2$ 乘 |\n| $1+2x+3x^2+4x^3\
    \ = 1+x\\cdot(2+x\\cdot[3+4x])$ | $3$ 加$+6$ 乘 $3$ 加$+3$ 乘 |\n| $1+2x+3x^2+4x^3+5x^4\
    \ = 1+x\\cdot(2+x\\cdot[3+x\\cdot(4+5x)])$ | $4$ 加$+10$ 乘 $4$ 加$+4$ 乘 |\n| $1+2x+3x^2+4x^3+5x^4+6x^5\
    \ = 1+x\\cdot(2+x\\cdot[3+x\\cdot(4+x\\cdot[5+6x])]) $ | $5$ 加$+15$ 乘 $5$ 加$+5$\
    \ 乘 |\n\n# 规律是什么？\n\n# 规律\n\n# 两种规律\n\n如果 $p(x)$ 是一个 $n$ 次多项式，在标准形式下的计算成本为 $O(n^2)$。使用霍纳形式可以将成本降低到\
    \ $O(n)$。\n\n示例：设 $p(x) = a_0 + a_1x + a_2x^2 + a_3x^3 + a_4x^4 + a_5x^5 + a_6x^6$。\n\
    \n霍纳形式：$p(x) = a_0 + x(a_1 + x[a_2 + x(a_3 + x[a_4 + x(a_5 + a_6x)]])$。\n\n这种因式分解形式显著减少了在给定\
    \ $x$ 值下评估 $p$ 所需的工作。\n\n修改后：$p'(x) = a_1 + x[2a_2 + x(3a_3 + x[4a_4 + x(5a_5\
