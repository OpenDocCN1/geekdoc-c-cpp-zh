  - '[PAGE 124]


    # II. Special Topic: Modified Newton’s Method


    # Newton’s Method Revisited


    Newton’s method uses the iteration function


    $N(x) = x - \frac{f(x)}{f''(x)}$


    A fixed point of $N$, which is a value $x^*$ where $N(x^*) = x^*$, is a zero of
    $f(x)$. It was really Simpson who realized the connection of Newton’s method with
    calculus; Newton had developed an algebraic method in 1669 (not publishing it
    until 1711); Simpson’s generalized version appeared in 1740 in his text *A New
    Treatise of Fluxions*. In 1690, midway between Newton and Simpson, Raphson published
    a simplified version of Newton’s method that was based on iterations, much like
    ours today.'
- md: "\n# Modified Newton’s Method\n\nTo modify Newton's method, replace the \"correcting\
    \ factor\" quotient $f/f'$ with $f'/f''$. Our new iterator is\n\n```\n$M(x) =\
    \ x - \\frac{f'(x)}{f''(x)}$\n```\n\nChoose an initial value $x_0$. Then calculate\
    \ the values $x_{n+1} = M(x_n)$ for $n = 1,2,\\dots$. The question is: Does $x_n$\
    \ have a limit?\n\n# ### Convergence?\n\nUse Newton’s example function: $y = x^3\
    \ - 2x - 5$. Then\n\n```\n$M(x) = x - \\frac{3x^2 - 2}{6x}$\n```\n\nStarting with\
    \ $x_0 = 1$ gives the sequence $x_1 = 0.83\\overline{3}, x_2 = 0.816\\overline{6},\
    \ x_3 = 0.81649659, x_4 = 0.81649658$. Where are these points going?\n\n# Exercises\n\
    \n# Problems\n\n- 1. Use Maple to generate a personalized random polynomial with:\n\
