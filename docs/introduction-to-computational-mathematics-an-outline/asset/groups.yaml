    # ## Accuracy versus Efficiency


    **Accuracy** concerns how much error occurs and how to control the error.


    **Efficiency** concerns how much computation is needed to produce a result.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_9_0.png)


    **Stability** is the third aspect to always keep in mind. In a stable computation,
    a small change in inputs produces only a small change in outputs. As a counterpoint,
    investigate instability in a "Lorenz attractor."


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_9_1.png)'
