    leftarrow c$\n6. 如果 $|b-a|$ 对于 $|a|$ 非常小，则 $a$ 是根；退出\n7. 设置 $k = k+1$，并（如果 $k$\
    \ 不太大）跳转到 2。\n\n```\ninput : x0, eps, n\nextern: f(x)\n1: f0 ← f(x0);\n2: f1 ←\
