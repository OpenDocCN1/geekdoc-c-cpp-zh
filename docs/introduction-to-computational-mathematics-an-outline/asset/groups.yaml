  - '[PAGE 132]


    # Simpson''s Rule


    # Simpson''s Rule


    We now move to a degree 2 approximation. The easiest way to have 3 data points
    is to take the panels in pairs: instead of rectangle base $[x_i, x_{i+1}]$, use
    $[x_i, x_{i+1}, x_{i+2}]$. So we require an even number of panels. The area under
    the parabola is


    ```

    $A_S = \frac{1}{3} [f(x_i) + 4f(x_{i+1}) + f(x_{i+2})] \Delta x$.

    ```


    This gives a $2n$-panel approximation for the integral


    ```

    $\int_a^b f(x) dx \approx \left[ \sum_{k=1}^n (f(x_{2k-2}) + 4f(x_{2k-1}) + f(x_{2k}))
    \right] \frac{\Delta x}{3}$

    ```


    most often written as


    ```

    $S_{2n} = [f(x_0) + 4f(x_1) + 2f(x_2) + 4f(x_3) + \dots + 4f(x_{2n-1}) + f(x_{2n})]
    \frac{\Delta x}{3}$.

    ```


    The error is bounded by


    ```

    $\epsilon_n \le \frac{(b-a)^5}{180} \cdot M_4 \cdot \frac{1}{n^4}$.

    ```


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_132_0.png)'
