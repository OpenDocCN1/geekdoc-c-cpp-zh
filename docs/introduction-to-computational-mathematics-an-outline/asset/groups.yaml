    \ 63\n\n## II. 控制结构：流程\n\n流程控制\n\n**条件语句。** *条件*决定了一个动作：\n如果条件为真，则执行某项动作。\n如果条件为假，则执行另一个动作。\n\
    \n例如：\n\n- 如果数字是偶数，则将其除以 2。否则*乘以* 3 并加 1。\n- 如果误差小于 $10^{-5}$，则停止。否则，重新应用牛顿法。\n\
    \n**重复块 / 循环：** 按指定的次数重复动作（注：*循环包含条件判断*）：\n计数到某个值，每次执行一次动作。\n\n例如：\n\n- 相加前 20\
    \ 个质数。\n- 从 $t=0; y_0=0$ 开始，使用欧拉法在 $y'=t$ 时找到 $y(1)$。\n\n> $3$ *不为真*not true）与*假*（false）有区别吗？参见例如《斯坦福哲学百科书》中的*直觉主义*(Intuitionistic\
    \ Logic）。\n\n## 条件语句类型\n\n### 基础条件类型\n\n简单：IF 条件为真则执行动作\nIF 条件为真则执行动作 ELSE 条件为假则执行动作\n\
    \n复合：IF 条件$_1$ 则执行动作$_1$\nELSE IF 条件$_2$ 则执行动作$_2$\nELSE IF 条件$_3$ 则执行动作$_3$\n\
    ...\nELSE 当所有条件均为假时执行动作$_n$\n\n### 示例（北卡罗来纳州2011–2013年税率$^4$）\n\n**IF** 你的申报状态为单身；\n\
    \n| 且纳税收入超过： | 但不超过： | 你的税率为： |\n| :--- | :--- | :--- |\n| $0 | $12,750 | 纳税收入的\
    \ 6% |\n| $12,750 | $60,000 | $65 + 超过 $12,750 的 7% |\n| $60,000 | ... | $72.50\
    \ + 超过 $60,000 的 7.75% |\n\n> $4$ 2014年，北卡罗来纳州改为单一累进税，目前为 5.25%。\n\n## 循环类型\n\n\
    循环类型\n计数循环：For循环按指定的次数执行动作。\n条件循环：只要给定条件为真，While循环就执行动作。\n\n示例\n- 对于每个员工计算月工资。\n\
    - 对于每个小于 $n$ 的整数 $i$，计算斐波那契数列中的第 $i$ 个。\n- 当欧几里得算法的余数大于1时，计算下一个余数。\n- 当游戏未结束时，处理用户输入。\n\
    \n## 示例：Collat 流程图\n\n### Collat 函数\n\n- 从大于 1 的整数开始。如果是偶数，则除以 2。否则，乘以 3 并加 1。重复直到值达到\
    \ 1，计算步数。\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_43.png)\n\n计算步数的程序需要一个带有条件的循环。\n\
    \nXKCD：Collat 猜想\n\n## 示例：Collat — 循环与条件语句\n\n### 伪代码\n\n| 我们在 Collat 函数的流程图中看到了条件循环：\
    \ | 循环内部有一个“if”语句来计算新项： |\n| :--- | :--- |\n| while (项 > 1) do 计算下一项 | If (项为偶数)\
    \ 则除以 2 |\n| end do | else 乘以 3 并加 1 end if |\n\n将这些内容组合在一起得到：\n获取第一项\n将计数器设为\
    \ 1\nwhile (项 > 1) do\n  If (项为偶数) 则除以 2\n  else 乘以 3 并加 1\n  end if\n  计数器加1\n\
    end do\n返回计数器\n\n## 示例：作为循环的欧拉法\n\n欧拉法\n微分方程 $y' = f(x,y)$ 的解可以使用微分三角形近似。通过沿当前点\
    \ $(x_k, y_k)$ 的切线移动距离 $\\Delta x = h$ 计算下一个点。然后新点为 $(x_{k+1}, y_{k+1}) = (x_k\
    \ + h, y_k + h \\cdot y'(x_k, y_k))$。\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_45.png)\n\
    \n用循环实现欧拉法：\n\n- 定义导数函数 $y' = f(x,y)$\n获取初始点 $(x_0, y_0)$\n获取步长 $h$\n确定步数 $n =\
    \ (b-a)/h$\nfor i从1到n\n  计算 $x_{k+1} = x_k + h$ 和 $y_{k+1} = y_k + h \\cdot y'(x_k,\
    \ y_k)$\n  end do\n返回集合 $\\{(x_i, y_i)\\}$\n\n## 控制结构：流程图\n\n### 常见样本\n\n- 1.\
    \ 列出前5个整数的平方，并显示奇偶。\n- 2. 使用for循环遍历整数，并使用if-then条件判断奇偶。\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_46.png)\n\
    \n## 控制结构：图表\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_47.png)\n\n## Excel 控制结构\n\
    \n### 条件语句\n\nIf: =IF(条件, 真动作, 假动作)\n可以嵌套最多7个IF：=IF(条件1, IF(条件2, ...), ...\n但我嵌套过12层也没有问题。\n\
    \nCase: = CHOOSE(索引, 情况1, 情况2, ...)\n最多支持 29 种情况（另另参见：LOOKUP）\n\n### 注意\n\n许多版本的Excel包含Visual\
    \ Basic for Applications（VBA），一种用于宏的微型编程语言。VBA包含了标准的if-then-else/elseif-end if结构。（参见Excel入门教程。）\n\
    \n### 循环结构\n\n| For: 不/适用（必须在VBA中编程） |\n| While: 不/适用（必须在VBA中编程） |\n\n| |\n\n\
    查看：\n\n- Excel (Mac) 网站\n- Excel (Win) 网站\n\n## Maple 控制结构\n\n### 条件语句\n\n```\n\
    If: 如果条件则语句;\nelse 语句;\nend if\n\nif 条件1 则语句;\nelif 条件2 则语句;\nelse 语句;\nend if\n\
    ```\n\nCase: 不/适用（使用 piecewise 或 if-elif-end if）\n\n### 循环结构\n\n```\nFor: 对于索引从起始值到结束值\n\
    by增量 do\n  语句;\n  end do\n\nfor 在表达式序列中\n  语句;\n  end do\n\nWhile: 当条件 do\n  语句;\n\
    \  end do\n```\n\n查看：\n\n- Maple 网站\n- Maple在线帮助\n\n（另参见 Sage、Xcas 以及 TI Nspire、Maxima\
