    \ 82\n\n# III. 数值差分\n\n什么是数值差分？\n\n数值差分是函数在某点导数的近似，使用割线而非切线。数值差分包含两个主要的误差部分：截断误差（truncation\
    \ errors）和舍入误差（round-off errors）。数值差分是开发数值误差边界的基本工具。\n\n泰勒级数（定义）\n如果 $f$ 在 $a$\
    \ 的附近具有足够阶的导数，泰勒级数：\n$$f(x) = f(a) + f'(a)(x-a) + \\frac{f''(a)}{2!}(x-a)^2 +\
    \ \\dots + \\frac{f^{(n)}(a)}{n!}(x-a)^n + R_n(x)$$\n其中 $R_n(x)$ 是余项。\n\n泰勒定理（假设）\n\
    假设 $f$ 在 $a$ 的邻域内具有 $n+1$ 阶可导数，那么对于 $x$ 和 $a$ 之间的某点 $c$，\n$$R_n(x) = \\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$$\n\
    这就是泰勒公式的余项形式。证明泰勒定理（大纲）：\n1. 通过分部法对 $f(x) = f(a) + \\int_a^x f'(t) dt$ 进行积分。\n\
    2. 令 $u = f'(t), dv = dt$。\n3. 重复此过程 $n$ 次，以得到 $n$ 阶展开式和余项。\n\n"
