  - '[PAGE 175]


    # TI Floating Point


    # TI Floating Point Structure


    TI’s numeric model is not IEEE-754 compliant. The floating point format is


    | 0 | +1 | +2 | +3 | +4 | +5 | +6 | +7 | +8 |

    |---|---|---|---|---|---|---|---|---|

    | s/T | EXP | DD | DD | DD | DD | DD | DD | DD |


    s/T: Sign and Type Byte


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|

    | SIGN | reserved | | | | | | |


    Floating point types: Real: 0Ch; Complex: 01h; (List: 01h; Matrix: 02h, etc.)


    EXP: Power of 10 exponent coded in binary, biased by 80h


    DD: Mantissa in BCD, 7 bytes of two digits per byte. While the mantissa has 14
    digits, only 10 (+2 exponent digits) are displayed on the screen. (Many math routines
    use 9-byte mantissas internally to improve accuracy.)


    Examples: 3.14159265 = 00 80 31 41 59 26 50 00 00

    −230.45 = 80 82 23 04 50 00 00 00 00'
  - '[PAGE 176]


    # TI Floating Point Software


    TI Floating Point Software

    There are six RAM locations called the Floating Point Registers OP1 to OP6;

    each is 11 bytes (with 9 byte mantissas); they are used extensively for floating

    point computations. The routines listed below, called in assembly programs,

    operate on the value in OP1 unless noted.


    TI''s operating system² includes the functions:


    | Standard Function | |

    |---|---|

    | FPAdd (OP1+OP2) Ceiling | Sin ASIn |

    | FPSSub (OP1–OP2) Int | Cos ACos |

    | FPRecip (1/OP1) Trunc | Tan ATan |

    | FPMult (OP1×OP2) Frac | SinH ASinH |

    | FPDiv (OP1÷OP2) Round | CosH ACosH |

    | FPSquare (OP1×OP1) RndGuard (to 10 d) | TanH ATnH |

    | SqRoot RnFx (to FIX) | LnX EToX |

    | Factorial (n·0.5 ≧ -0.5) Random | LogX TenX (10⁰OP1) |

    | Max(OP1, OP2) RandInt | |

    | Min(OP1, OP2) |'
  - '[PAGE 177]


    # Numeric Derivatives


    nDeriv

    TI uses a centered difference formula


    $f''(a) \approx \frac{f(a+\varepsilon) - f(a-\varepsilon)}{2\varepsilon}$


    The default step size is $\varepsilon = 0.001$. The command can''t be nested and
    doesn''t check whether or not $f$ is differentiable at $a$.


    Syntax: nDeriv(expression, variable, value[$\varepsilon$])


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_177_0.png)


    (Screen images are from a TI-84+ SE with the 2.55MP OS.)'
  - '[PAGE 178]


    # Numerically Finding Roots


    solve

    TI uses a blend of the bisection and secant root-finding algorithms. (See Appendix
    V.) The default initial interval is $[-10^{99},10^{99}]$. Solve does not find
    roots of even multiplicity since the algorithm requires a sign change. (solve
    is available only through CATALOG or the Solver application.)


    Syntax: solve(expression,variable,initial_guess)


    ```

    solve(e^{x-1}-cos(X))

    .7171847972

    solve(X^2,X,1)

    Error

    ```'
  - '[PAGE 179]


    # Numeric Quadrature


    fnInt

    Tl uses an adaptive Gauss-Kronrod 7-15 quadrature


    $\int_{-1}^{1} f(x)dx \approx \sum_{k=1}^{15} f(x_k) \cdot w_k$


    The default error tolerance is $\varepsilon=10^{-5}$. The command can''t be nested
    and doesn''t check if $f$ is integrable over $[a,b]$.


    Syntax: fnInt(expression, variable, lower, upper[,$\varepsilon$)


    ```

    $\int_{-1}^{1}(\sin(x^2))dx\n.6205366034

    ```


    ```

    $\int_{-2}^{2}(\pi-3x^{11})dx\nError

    ```'
  - '[PAGE 180]


    # Transcendental and Other Functions


    +   For trigonometric, logarithmic, and exponential functions, TI uses a modified
    CORDIC algorithm. CORDIC''s standard “rotations” of $2^{-k}$ are replaced with
    $10^{-k}$. (See the CORDIC Project.)


    +   The factorial $x!$ where $x$ is a multiple of $\frac{1}{2}$ for $-\frac{1}{2}
    \le x \le 69$ is computed recursively using


    $$x! = \begin{cases} x \cdot (x-1)! & x > 0 \ 1 & x = 0 \ \sqrt{\pi} & x = -\frac{1}{2}
    \end{cases}$$


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_180_0.png)'
  - "[PAGE 181]\n\n# Appendix V: TI's Solving Algorithm\n\n# Bisection and Secant\
    \ Combined\n\nThe solve function and the Solver application use a clever, modified\
    \ combination of the secant method and bisection.3 The logic is:\n\n+   1. Order\
    \ the bracketing points $a$ and $b$ so that $|f(b)| \\le |f(a)|$.\n2. Calculate\
    \ a new point $c$ using the secant method.\n3. If $c$ is:\n   a. outside the interval,\
    \ replace $c$ with the midpoint (bisection),\n   b. too close to an endpoint (within\
    \ $h$), replace $c$ with $c=b \\pm h$, a specified minimum step in the interval.\n\
    4. The new bracketing points are $a \\& c$ or $b \\& c$, whichever pair has the\
    \ sign change.\n5. If the error tolerance is met or the number of iterations is\
    \ maximum, then return $c$, otherwise, go to Step 1.\n\n> 3 “Solve() uses a combination\
    \ of bisection and the secant method, as described in Shampine and Allen Numerical\
    \ Computing: An Introduction, Saunders, 1973\" (pp. 96–100 and 244) according\
    \ to the TI 85 Knowledge Base."
