    \ 137\n   Exercises ................................................................................................................\
    \ 138\n   Links and Others ...................................................................................................\
    \ 139\n\n# V. Numerical Integration\n\n### What Is Numerical Integration?\n\n\
    Numerical integration or (numerical) quadrature is the calculation of a definite\
    \ integral using numerical formulas, not the fundamental theorem. The Greeks studied\
    \ quadrature: given a figure, construct a square that has the same area. The two\
    \ most famous are Hippocrates of Chios' Quadrature of the Lune (c. 450 BC) and\
    \ Archimedes' Quadrature of the Parabola (c. 250 BC). Archimedes used the method\
    \ of exhaustion — a precursor to calculus — invented by Eudoxus.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_128_0.png)\n\
    \nSquaring the circle is one of the classical problems of constructing a square\
    \ with the area of a given circle — it was shown to be impossible by Lindemann's\
    \ theorem (1882).¹\n\n> ¹Lindemann was the first to prove that π is transcendental.\n\
    \n# Methods of Elementary Calculus\n\n# Rectangle Methods\n\nLeft endpoint sum\n\
    \n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_129_0.png)\n\nMidpoint sum\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_129_1.png)\n\
    \nRight endpoint sum\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_129_2.png)\n\n\
    ```\n$A_n \\approx \\sum_{k=1}^{n} f(x_{k-1}) \\Delta x_k$\n```\n\n```\n$A_n \\\
    approx \\sum_{k=1}^{n} f(m_k) \\Delta x_k$\n$m_k = \\frac{1}{2}(x_{k-1} + x_k)$\n\
    ```\n\n```\n$A_n \\approx \\sum_{k=1}^{n} f(x_k) \\Delta x_k$\n```\n\n```\n$\\\
    epsilon_n \\leq \\frac{(b-a)^2}{2} \\cdot M_1 \\cdot \\frac{1}{n}$\n```\n\n```\n\
    $\\epsilon_n \\leq \\frac{(b-a)^2}{24} \\cdot M_2 \\cdot \\frac{1}{n^2}$\n```\n\
    \n```\n$\\epsilon_n \\leq \\frac{(b-a)^2}{2} \\cdot M_1 \\cdot \\frac{1}{n}$\n\
    ```\n\nwhere $M_i = \\max |f^{(i)}(x)|$\n$\\int_{0}^{\\pi} f(x) dx = 2 \\approx\
    \ [1.984, 2.008, 1.984]n=10$\n\n# Trapezoid Sums\n\nInstead of the degree 0 rectangle\
    \ approximations to the function, use a linear degree 1 approximation. The area\
    \ of the trapezoid is given by\n\n```\n$A_T = \\frac{1}{2}[f(x_{k-1}) + f(x_k)]\\\
    Delta x_k.$\n```\n\nThis gives an approximation for the integral\n\n```\n$\\int_a^b\
    \ f(x)dx \\approx \\sum_{k=1}^n \\frac{1}{2}[f(x_{k-1}) + f(x_k)]\\Delta x_k.$\n\
    ```\n\n[Midpoint: measure height at average $x$ v. trapezoid: average the height\
    \ measures]\n\nThe formula is often written as\n\n```\n$T_n \\approx \\left[f(x_0)\
    \ + \\left(2\\sum_{k=1}^{n-1} f(x_k)\\right) + f(x_n)\\right]\\frac{\\Delta x}{2}.$\n\
    ```\nError for trapezoid rule is\n\n```\n$\\epsilon_n \\le \\frac{(b-a)^3}{12}\
    \ \\cdot M_2 \\cdot \\frac{1}{n^2}.$\n```\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_130_png)\n\
    \n# Sample Trapezoid Example\n\nLet $f(x) = \\sin(x) + \\frac{1}{2}\\sin(2x) -\
    \ \\frac{1}{4}\\sin(4x) + \\frac{1}{16}\\sin(8x)$ over $[0, \\pi]$.\nWith an equipartition,\n\
    $\\Delta x = \\pi/10 \\approx 0.314$.\n\nThen\n$T_{10} = \\left[f(0) + \\left(2\
    \ \\sum_{k=1}^{9} f\\left(\\frac{k\\pi}{10}\\right)\\right) + f(\\pi)\\right]\\\
    frac{\\Delta x}{2}$\nwhich gives $T_{10} = 1.984$\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_131_0)\n\
    \n# Simpson's Rule\n\nWe now move to a degree 2 approximation. The easiest way\
    \ to have 3 points is to take in pairs: instead of rectangle $[x_i, x_{i+1}]$,\
    \ use $[x_i, x_{i+1}, x_{i+2}]$. So we require an even number of panels. The area\
    \ under the parabola is\n\n```\n$\\int_a^b f(x) dx \\approx \\sum_{k=1}^n (f(x_{2k-2})\
    \ + 4f(x_{2k-1}) + f(x_{2k})) \\frac{\\Delta x}{3}$\n```\nThis gives a $2n$-panel\
    \ approximation often written as\n\n```\n$S_{2n} = [f(x_0) + 4f(x_1) + 2f(x_2)\
    \ + 4f(x_3) + \\dots + 4f(x_{2n-1}) + f(x_{2n})] \\frac{\\Delta x}{3}.$\n```\n\
    The error is bounded by\n\n```\n$\\epsilon_n \\le \\frac{(b-a)^5}{180} \\cdot\
    \ M_4 \\cdot \\frac{1}{n^4}.$\n```\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_132_png)\n\
    \n# Sample Simpson\n\nLet $f(x) = \\sin(x) + \\frac{1}{2}\\sin(2x) - \\frac{1}{4}\\\
    sin(4x) + \\frac{1}{16}\\sin(8x)$ over $[0, \\pi]$.\nWith a 10-panel equipartition,\n\
    $\\Delta x = \\pi/10 \\approx 0.31415926$.\nThen, with $y_i = f(x_i)$,\n$S_{10}\
    \ = \\frac{1}{3}[y_0+4y_1+2y_2+\\cdots+4y_9+y_{10}]$\nwhich gives $S_{10} = 2.000006784$\
    \ with absolute error of $6.78 \\cdot 10^{-6}$.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_133_0)\n\
    \n# A Maple Comparison\n\nApproximating a Difficult Integral\n\nConsider $\\int_{1}^{2}\
    \ \\frac{10^{-4}}{(x-\\frac{\\pi}{2})^2+10^{-8}} dx$. This integrand has a sharp\
    \ peak at $\\pi/2$.\nThe exact value of the integral (using $F$) is\n$arctan(5\
    \ \\cdot 10^3 \\cdot (4-\\pi)) - arctan(5 \\cdot 10^3 \\cdot (2-\\pi)) \\approx\
    \ 3.1411844701381$.\nMaple gives\n\n | $n=50$ | $n=500$ | $n=5000$ |\n|---|---|---|---|\n\
    | left | $0.0497133$ | $0.541336$ | $3.422282$ |\n| right | $0.0497180$ | $0.541336$\
    \ | $3.422282$ |\n| midpoint | $3.1212000$ | $4.052010$ | $2.88243$ |\n| trapezoid\
    \ | $0.0497157$ | $0.541336$ | $3.422282$ |\n| Simpson | $2.0972500$ | $2.881790$\
    \ | $3.06256...$ |\n\nTo achieve a relative error below 1% requires approximately\
    \ $n \\geq 6000$.\n\n# The Chart\n\n| Quadrature | \"Height\" | Error Bound² |\n\
    | --- | --- | --- |\n| Left end point | $f(x_i)$ | $\\frac{(b-a)^2}{2} \\cdot\
    \ M_1 \\cdot \\frac{1}{n} = O(h)$ |\n| Right end point | $f(x_{i+1})$ | $\\frac{(b-a)^2}{2}\
    \ \\cdot M_1 \\cdot \\frac{1}{n} = O(h)$ |\n| Trapezoid Rule | $\\frac{f(x_i)\
    \ + f(x_{i+1})}{2}$ | $\\frac{(b-a)^3}{12} \\cdot M_2 \\cdot \\frac{1}{n^2} =\
    \ O(h^2)$ |\n| Midpoint | $f\\left(\\frac{x_i+x_{i+1}}{2}\\right)$ | $\\frac{(b-a)^3}{24}\
    \ \\cdot M_2 \\cdot \\frac{1}{n^2} = O(h^2)$ |\n| Simpson's Rule | $\\frac{f(x_i)\
    \ + 4f(x_{i+1}) + f(x_{i+2})}{3}$ | $\\frac{(b-a)^5}{180} \\cdot M_4 \\cdot \\\
    frac{1}{n^4} = O(h^4)$ |\n\nwhere $M_i \\geq \\max |f^{(i)}(x)|$ and $h = 1/n$.\n\
    \n> ²An approximation without an error bound has little to no value!\n"
  mdcn: "\n\n# 修改后的牛顿法\n\n要对牛顿法进行修改，将“修正因子”商数 $f/f'$ 替换为 $f'/f''$。我们新的迭代器为：\n\n```\n\
