    # Example: Collatz Flow Chart


    # Collatz Function


    +   - Start with an integer greater than 1. If it''s even, divide it by 2. Otherwise,
    multiply it by 3 then add 1. Repeat until the value reaches 1 counting the number
    of steps.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_43_0.png)


    A program to calculate the number of steps requires a loop with a conditional
    inside.


    XKCD: Collatz Conjecture'
  - '[PAGE 44]


    # Example: Collatz — A Loop and a Conditional


    # Pseudocode


    | We see a conditional loop in the Collatz function''s flow chart: | There is
    an “if” statement inside the loop to calculate the new term: |

    |--- | --- |

    | while (the term > 1) do Calculate the next term | If (the term is even) then
    divide by 2 |

    | end do | else multiply by 3, then add 1 end if |


    Putting these together gives:

    Get the first term

    Set the term counter to 1

    while (the term > 1) do

    If (the term is even) then divide by 2

    else multiply by 3, then add 1

    end if

    Increment the term counter

    end do

    Return the term counter'
  - "[PAGE 45]\n\n# Example: Euler's Method as a Loop\n\nEuler's Method\nnThe solution\
    \ to a differential equation $y' = f(x,y)$ can be approximated using the differential\
    \ triangle. Calculate the next point from the current point $(x_k, y_k)$ by following\
    \ the tangent line for a step $\\Delta x = h$. Then the new point is $(x_{k+1},\
    \ y_{k+1}) = (x_k + h, y_k + h \\cdot y'(x_k, y_k))$.\n\n![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_45_0.png)\n\
    \nImplement Euler's method as a loop:\n\n+   * Define the derivative function\
    \ $y' = f(x,y)$\nGet the initial point $(x_0, y_0)$\nGet the stepsize $h$\nDetermine\
    \ the number of steps $n = (b-a)/h$\nfor i from 1 to n do\n  * Compute $x_{k+1}\
    \ = x_k + h$ and $y_{k+1} = y_k + h \\cdot y'(x_k, y_k)$\n  end do\nReturn the\
    \ collection of points $\\{(x_i, y_i)\\}_{i=0}$"
