    # III. Numerical Differentiation


    What is Numerical Differentiation?


    Numerical Differentiation is the approximation of the derivative of a function
    at a point using numerical formulas, not the algebraic rules for differentiation.
    The basic form uses the slope of a short chord rather than the tangent line.


    ![](img/de7f33bb3a5a3d79f7bc9c0a3115448b_81_0.png)


    Since we are subtracting numbers that are close together, loss of computational
    precision can be a serious problem.


    Taylor series expansions will be our basic tool for developing formulas and error
    bounds for numerical derivatives. The errors will have two main components: truncation
    errors from Taylor polynomials and round-off errors from finite-precision floating-point
    arithmetic.'
