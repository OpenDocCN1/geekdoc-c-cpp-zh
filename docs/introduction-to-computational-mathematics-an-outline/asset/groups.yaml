    # Special Topic: Computation Cost & Horner’s Form


    # Introduction to Cost


    The arithmetic cost of computation is a measure of how much mathematical work
    a particular expression takes to compute. We will measure an expression in terms
    of the number of arithmetic operations it requires. For example, we’ll measure
    the cost of computing the expression as


    sin(2x^4 + 3x + 1)


    2 additions + 5 multiplications + 1 function call for a total of 7 arithmetic
    operations plus a function call.


    At a lower level, the time cost of a CPU instruction is the number of clock cycles
    taken to execute the instruction. Current CPUs⁵ are measured in Floating-point
    Operations per Second or FLOPS. For example, the eight-core Intel® Core™ i9 processor
    used in an iMac (19/2019) can achieve over 235 gigaFLOPS = 10¹¹¹ floating-point
    operations per second.'
- md: "\n# Horner's Form\n\n# Partial Factoring\n\nWilliam Horner studied solving\
    \ algebraic equations and efficient forms for computation. Horner observed that\
    \ partial factoring simplified a polynomial calculation. Consider:\n\n| Standard\
    \ Form | Horner's Form |\n| :--- | :--- |\n| $1+2x = 1+2x$ | $1$ add$+1$ mult\
    \ $1$ add$+1$ mult |\n| $1+2x+3x^2 = 1+x\\cdot(2+3x)$ | $2$ add$+3$ mult $2$ add$+2$\
    \ mult |\n| $1+2x+3x^2+4x^3 = 1+x\\cdot(2+x\\cdot[3+4x])$ | $3$ add$+6$ mult $3$\
    \ add$+3$ mult |\n| $1+2x+3x^2+4x^3+5x^4 = 1+x\\cdot(2+x\\cdot[3+x\\cdot(4+5x)])$\
    \ | $4$ add$+10$ mult $4$ add$+4$ mult |\n| $1+2x+3x^2+4x^3+5x^4+6x^5 = 1+x\\\
    cdot(2+x\\cdot[3+x\\cdot(4+x\\cdot[5+6x])]) $ | $5$ add$+15$ mult $5$ add$+5$\
    \ mult |\n\n# What are the patterns?\n\n# Patterns\n\n# Two Patterns\n\nIf $p(x)$\
