    \ do;\n  (x[1], y[1],z[1]) := (K, 0, evalf(t));\n  for j to n+1 do\n    del:=sign(z[j]);\n\
    \    if del=0 then del :=1 if;\n    x[j+1]:=x[j]-del.y[j].2.-j+1;\n    y[j+1]:=y[j]+del.x[j].2.-j+1;\n\
    \    z[j+1]:=z[j]-del.arctan(2.-j+1);\n  end do;\n  return ([x[j], y[j], z[j]]);\n\
    end proc:\n```\n\n# CORDIC 项目\n\n- 1. 修改 Maple 程序 CORDIC[Trig] 计算 $\\arctan(\\\
