  - '[PAGE 125]


    # Modified Newton’s Method


    # Modified Newton’s Method


    To modify Newton''s method, replace the "correcting factor" quotient $f/f''$ with
    $f''/f''''$. Our new iterator is


    ```

    $M(x) = x - \frac{f''(x)}{f''''(x)}$

    ```


    Choose an initial value $x_0$. Then calculate the values $x_{n+1} = M(x_n)$ for
    $n = 1,2,\dots$. The question is: Does $x_n$ have a limit?


    # Convergence?


    Use Newton’s example function: $y = x^3 - 2x - 5$. Then


    ```

    $M(x) = x - \frac{3x^2 - 2}{6x}$

    ```


    Starting with $x_0 = 1$ gives the sequence $x_1 = 0.83\overline{3}, x_2 = 0.816\overline{6},
    x_3 = 0.81649659, x_4 = 0.81649658$. Where are these points going?'
