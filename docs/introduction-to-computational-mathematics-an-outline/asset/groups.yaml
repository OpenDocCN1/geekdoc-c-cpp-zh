    \ Explain the result.\n2. Enter $\\pi - 3.141592654$ on a TI-84 and a TI Nspire\
    \ CAS. Explain the different results.\n3. Explain the result of $nDeriv(|x|,x,0)$.\n\
    4. Define $Y1$ to be the function $f(x) = \\frac{10^{-8}-(x-\\pi/2)^2}{10^{-16}+(x-\\\
    pi/2)^2}$. Explain the results from using solve with an initial guess of:\n  \
    \ a. 0\n   b. 1.5\n5. Define $f$ by $f(x) = |x-\\frac{1}{3}|^{-8/9}$. Compare\
    \ evaluating $\\int_{-1}^{1} f(x)dx$ with\n   a. a TI-84+ SE,\n   b. Maple."
