    Set $x = a+h$ in the Taylor polynomial. Then


    $f(a+h) = f(a) + f''(a) \cdot h + \frac{1}{2!}f''''(a) \cdot h^2 + \frac{1}{3!}f''''''(a)
    \cdot h^3 + \dots$ (1)


    And now set $x = a-h$. Then


    $f(a-h) = f(a) - f''(a) \cdot h + \frac{1}{2!}f''''(a) \cdot h^2 - \frac{1}{3!}f''''''(a)
    \cdot h^3 \pm \dots$ (2)'
  - '[PAGE 85]


    # Forward Difference Approximation


    # Forward Difference


    Subtract $f(a)$ from both sides of Eq (1), then divide by $h$ to obtain


    ```

    $$\frac{f(a+h) - f(a)}{h} = f''(a) + \frac{O(h^2)}{h}$$

    ```


    The Forward Difference Formula is


    ```

    $$f''(a) = \frac{f(a+h) - f(a)}{h} + O(h). \quad (FD)$$

    ```


    # Examples


    +   1. Suppose $f(x) = 1 + xe^{\sin(x)}$. For $a=0$ and $h=0.1$, we have

    $f''(x) \approx (1.1105 - 1.0000)/0.1 = 1.1050$.


    +   2. Suppose $P_0 = (1.000, 3.320)$ and $P_1 = (1.100, 3.682)$. Then

    $f''(x) \approx (3.682 - 3.320)/(1.100 - 1.000) = 3.620$.'
  - '[PAGE 86]


    # Backward Difference Approximation


    # Backward Difference


    Subtract $f(a)$ from both sides of Eq (2), then divide by $h$ to obtain


    ```

    $$\frac{f(a-h)-f(a)}{h} = -f''(a) + \frac{O(h^2)}{h}$$$$

    ```


    The Backward Difference Formula is


    ```

    $$$f''(a) = \frac{f(a)-f(a-h)}{h} + O(h). \quad (BD)$$$

    ```


    # Examples


    +   1. Again, suppose $f(x) = 1+xe^{\sin(x)}$. For $a=0$ and $h=0.1$, we have

    $f''(x) \approx (1.0000-0.910)/0.1 = 0.900$.


    +   2. Suppose $P_0 = (1.000,3.320)$ and $P_1 = (0.900,2.970)$. Then

    $f''(x) \approx (3.320-2.970)/(1.000-0.900)=3.500$.'
  - "[PAGE 87]\n\n# Centered Difference Approximation\n\n# Centered Difference\n\n\
    Subtract $O(h^3)$ versions of Eqs (1) and (2).\n\n```\n$f(a+h) = f(a) + f'(a)\
    \ \\cdot h + \\frac{1}{2!}f''(a) \\cdot h^2 + O(h^3)$\n$f(a-h) = f(a) - f'(a)\
    \ \\cdot h - \\frac{1}{2!}f''(a) \\cdot h^2 + O(h^3)$\n$f(a+h) - f(a-h) = 2f'(a)\
    \ \\cdot h + O(h^3)$\n```\n\nSolve for $f'(a)$ to obtain:\nThe Centered Difference\
    \ Formula\n\n> $f'(a) = \\frac{f(a+h) - f(a-h)}{2h} + O(h^2). \\quad (CD)$\n\n\
    # Example\n\n+   - Once more, suppose $f(x) = 1 + xe^{\\sin(x)}$. For $a=0$ and\
    \ $h=0.1$, we have\n  $f'(x) \\approx (1.110 - 0.910)/0.2 = 1.000$"
