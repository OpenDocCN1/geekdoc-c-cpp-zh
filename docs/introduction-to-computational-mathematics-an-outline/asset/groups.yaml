    ## Spline Fitting a Transition Curve for a Roadbed


    Two roads are perpendicular and need to be connected by a curve. We''ll blend
    two transition curves to make the road. One curve will start at A and turn toward
    the north until B. The second transition curve will start at C and turn meeting
    the first at B. The two curves'' tangents match at B. We will compute viewpoints
    along the centerline using the two transition curves, then fit a cubic spline
    through the data-points to lay out the roadbed to make surveying and construction
    reasonable. Use the data table below to determine the cubic spline.


