    \ \\frac{f(x)}{\\sqrt{|f'(x)|}}$$\n\nThen the iterating function for Halley's\
    \ method\n\n$$x_{n+1} = x_n - \\frac{2f(x_n)f'(x_n)}{2f'(x_n)^2 - f(x_n)f''(x)}$$\n\
