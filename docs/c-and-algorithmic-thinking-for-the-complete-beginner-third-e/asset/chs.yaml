  9) 今年刚好能被 4 整除且不能被 100 整除，或者被 400 整除。\n\n### 复习题\n\n回答以下问题。\n\n1) 什么是布尔表达式？\n2)\
  \ C++ 支持哪些比较运算符？\n3) 哪个逻辑运算符执行逻辑与（conjunction）？\n4) 哪个逻辑运算符执行逻辑或（disjunction）？\n\
  5) 逻辑运算符 AND (`&&`) 何时返回真结果？\n6) 逻辑运算符 OR (`||`) 何时返回真结果？\n7) 阐述逻辑运算符的优先级。\n8) 什么是代码缩进？\n\
  9) 什么是算术运算符？110) 设计流程图并编写对应单分支决策结构的 C++ 语句。描述该决策结构如何工作。\n11) 设计流程图并编写对应双分支决策结构的\
  \ C++ 语句。描述该决策结构如何工作。\n12) 设计流程图并编写对应多分支决策结构的 C++ 语句。描述该决策结构如何工作。\n13) “嵌套决策结构”意味着什么？\n\
  14) 嵌套控制结构意味着什么？\n15) 嵌套控制结构可以嵌套多深？有什么限制吗？\n16) 设计流程图并编写求解线性方程的 C++ 语句。\n17) 设计流程图并编写求解二次方程的\
  \ C++ 语句。\n18) 什么是闰年？\n19) 什么是回文数？\n\n# 第五部分：循环控制结构\n\n## 第 24 章\n\n循环结构\n\n###\
  \ 24.1 什么是循环结构？\n循环结构是一种允许语句或语句块执行多次直到满足特定条件的结构。\n\n### 24.2 从顺序控制到循环结构\n下一个示例允许用户输入四个数字，然后计算并显示它们的和。如你所见，还没有使用循环结构，只有顺序结构。\n\
  \n```cpp\ndouble x, y, z, w, total;\ncin >> x;\ncin >> y;\ncin >> z;\ncin >> w;\n\
  total = x + y + z + w;\ncout << total << endl;\n```\n\n虽然这段代码很短，但考虑一个允许用户输入千个而不是四个数字的示例。你能想象写千次\
  \ `cin` 语句吗？如果只需要写一次这个语句并指示计算机执行千次，不是更好吗？这就是循环控制结构大显用场的地方！\n\n但在深入循环结构之前，先尝试解决一个小谜题！在不使用循环结构的情况下，尝试只用两个变量\
  \ `x` 和 `total` 重写上面的示例。\n\n嗯……显然你现在正在的是：“用这两个变量能做的只能是在变量 `x` 中读取单个值，然后将该值赋予变量 `total`”。你的想法是正确的，所示所示：\n\
  \n```cpp\ncin >> x; // 读取第一个数字\ntotal = x;\n```\n\n这可以等价地写为\n\n```cpp\ntotal = 0;\n\
  cin >> x;\ntotal = total + x;\n```\n\n第一个用户提供的数字已经存储在变量 `total` 中，所以变量 `x` 现在可以进一步使用了！因此，你可以重用变量\
  \ `x` 读取第二个值，它也会累加到变量 `total` 中，如下所示：\n\n```cpp\ntotal = 0;\ncin >> x; // 读取第一个数字\n\
  total = total + x;\ncin >> x; // 读取第二个数字\ntotal = total + x;\n```\n\n\n\n\n![](img/notice.jpg)\n\
  `total = total + x` 将 `x` 的值累加到 `total` 中，这意味着它将 `x` 的值加到 `total` 之前的任何值上。例如，如果变量\
  \ `total` 包含值 5，变量 `x` 包含值 3，则语句 `total = total + x` 将值 8 赋值给变量 `total`。\n\n由于第二个由用户提供的数字已经累加在变量\
  \ `total` 中，变量 `x` 可以被复用！这个过程可以一直重复，直到四个数字都被读取并累加到变量 `total` 中。最终代码如下。请注意，它目前还没有使用任何循环控制结构！\n\
  \n```\ntotal = 0;cin >> x;total = total + x;cin >> x;total = total + x;cin >> x;total\
  \ = total + x;cin >> x;total = total + x;cout << total << endl;\n```\n\n![](img/notice.jpg)这段代码和本节开头的初始代码被认为是等等的。然而，它们之间的主要区别在于后者包含了四对相同的语句。\n\
  \n显然，你可以使用这个示例来读取并找到四个以上数字之和。然而，多次编写这些语句对会非常繁琐，而且如果不小心漏掉了任何一对，可能会导致错误。\n\n你在这里真正需要的是保留一对语句，但使用循环控制结构来执行四次（或者如果你愿意，可以执行\
  \ 1000 次）。你可以使用类似下面的代码片段。\n\n```\ntotal = 0;execute_these_statements_4_times {cin\
  \ >> x;total = total + x;}cout << total << endl;\n```\n\n显然，在 `C++` 中并没有 `execute_these_statements_4_times`\
  \ 语句。这仅用于演示之目的，但很快你就会学习关于 `C++` 支持的所有循环控制结构的所有知识！\n\n### 24.3 复习题：判断题对对以下每个陈述选择对或错。\n\
  \n1) 循环控制结构是一种允许多次执行一个语句或一个语句块，直到满足指定条件的结构。\n2) 可以使用顺序控制结构来提示用户输入 1000 个数字，然后计算它们的和。\n\
  3) 下面的代码片段在变量 `total` 中累加了值 10。`total = 10;a = 0;total = total + a;`\n4) 下面的 `C++`\
  \ 程序满足有效性属性。\n```\n#include <iostream>using namespace std;int main() {int a, total;a\
  \ = 5;total = total + a;cout << total << endl;return 0;}\n```\n5) 以下两个代码片段都将值 5\
  \ 赋值给变量 `total`。`a = 5;total = a;` `total = 0;a = 5;total = total + a;`\n\n## 第\
  \ 25 章\n\n前测试、中测试和后测试循环结构\n\n### 25.1 前置循环结构\n\n前置循环结构所示如下图所示。\n\n![Image](img/chapter25-01.png)\n\
  \n让我们看看当执行流到达前置循环结构时会发生什么。如果 `Boolean_Expression` 求值为真，则执行该结构的语句或语句块，然后执行流返回再次检查一次\
  \ `Boolean_Expression`。如果 `Boolean_Expression` 再次求值为真，则重复该过程。当 `Boolean_Expression`\
  \ 在某一点求值为假时，执行流退出循环，迭代停止。\n\n![](img/notice.jpg)判定符号（菱形）既用于判定控制结构，也用于循环控制结构。然而，在循环控制结构中，菱形的出口之一总有一个向上的方向。\n\
  \n![](img/notice.jpg)“前置循环结构”之所以这样命名，是因为首先求值布尔表达式，然后执行该结构的语句或语句块。\n\n![](img/notice.jpg)由于布尔表达式在进入循环之前就会求值，因此前置循环可能执行从零次到多次迭代。\n\
  \n![](img/notice.jpg)每当执行循环控制结构的语句或语句块时，计算机科学中的术语是“循环正在迭代”或“循环执行一次迭代”。\n\n`C++`\
  \ 语句的通用形式为：\n\n```\nwhile (Boolean_Expression) {A statement or block of statements}\n\
  ```\n\n下面的示例显示了从 1 到 10 的数字。\n\n![](img/my_exercise_header.png) project_25.1\n#include\
  \ <iostream>using namespace std;int main() {int i = 1;while (i <= 10) {\n\n> cout\
  \ << i << endl;\n\n> i++;\n\n}return 0;}\n```\n\n![](img/notice.jpg)就像在判定控制结构中，循环控制结构内部的语句应该缩进。\n\
  \n与判定控制结构类似，当只需要一个语句作为 `while` 语句的一部分时，允许省略大括号 `{ }`。因此，`while` 语句可以如下所示。\n\n```\n\
  while (Boolean_Expression)One_Single_Statement;\n```\n\n![](img/remember.jpg)为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使\
  \ `while` 语句仅包含一个语句。\n\n#### 练习 25.1-1 设计流程图并计算总迭代次数\n\n为以下代码片段设计相应的流程图。这段 `C++`\
  \ 代码执行了多少迭代？\n\n```\nint i = 4;while (i > 0) {i--;}cout << \"The end\";\n```\n\n\
  ##### 答案\n\n相应的流程图片段如下。\n\n![Image](img/chapter25-02.png)\n\n接下来，一个跟踪表可以帮助你观察执行流。\n\
  \n| 步骤 | 语句 | 注释 | i | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | i\
  \ = 4 | | 4 | | |\n| 2 | while (i > 0) | 结果为真 | 1^(st) | 迭代 | |\n| 3 | i‑-- | |\
  \ 3 | | |\n| 4 | while (i > 0) | 结果为真 | 2^(nd) | 迭代 | |\n| 5 | i‑-- | | 2 | | |\n\
  | 6 | while (i > 0) | 结果为真 | 3^(rd) | 迭代 | |\n| 7 | i‑-- | | 1 | | |\n| 8 | while\
  \ (i > 0) | 结果为真 | 4^(th) | 迭代 | |\n| 9 | i‑-- | | 0 | | |\n| 10 | while (i > 0)\
  \ | 结果为假 | | | |\n| 11 | cout << \"The end\" | 显示: The end | | | |\n\n如你从跟踪表所示，总迭代次数为四次。\n\
  \n![](img/notice.jpg)当前置循环结构的语句或语句块被执行 N 次时，布尔表达式会被求值 N+1 次。因此，要确定总迭代次数，应计算语句或语句块执行的次数，而不是布尔表达式求值的次数。\n\
  \n#### 练习 25.1-2 计算总迭代次数\n\n这段代码片段执行了多少迭代？\n\n```\nint i = 4;while (i >= 0) {cout\
  \ << i;i--;}cout << \"The end\";\n```\n\n##### 答案\n\n这个练习与上一个几乎相同。主要区别在于，这里的布尔表达式在\
  \ i = 0 时仍然为真。因此，它执行了一次额外的迭代，即五次迭代。\n\n#### 练习 25.1-3 计算总迭代次数\n\n这段代码片段执行了多少迭代？\n\
  \n```\nint i = 1;while (i != 6) {i += 2;}cout << \"The end\";\n```\n\n##### 答案\n\
  \n让我们创建一个跟踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 | i | | |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | i = 1 | | 1 | | |\n| 2 | while (i != 6) | 结果为真 | 1^(st) | 迭代 |\
  \ |\n| 3 | i += 2 | | 3 | | |\n| 4 | while (i != 6) | 结果为真 | 2^(nd) | 迭代 | |\n|\
  \ 5 | i += 2 | | 5 | | |\n| 6 | while (i != 6) | 结果为真 | 3^(rd) | 迭代 | |\n| 7 | i\
  \ += 2 | | 7 | | |\n| 8 | while (i != 6) | 结果为真 | ... | ... | |\n\n如你从跟踪表所示，由于值\
  \ 6 从未被赋值给变量 `i`，这段代码片段将无限次迭代！显然，这段代码不满足有限性属性。\n\n#### 练习 25.1-4 计算总迭代次数\n\n这段代码片段执行了多少迭代？\n\
  \n```\nint i = -10;while (i > 0) {cout << i;i--;}cout << \"The end\";\n```\n\n#####\
  \ 答案\n\n最初，值 −10 被赋值给变量 `i`。布尔表达式直接求值为假，执行流直接进入 `cout << \"The end\"` 语句。因此，这段代码片段执行了零次迭代。\n\
  \n\n\n\n\n### 练习 25.1-5 求四个数的和\n\n使用先置测试循环结构，编写一个 C++ 程序，让用户输入四个数字，然后计算并显示它们的和。\n\
  \n##### 解决方案\n\n你还记得第 24.2 节中计算四个数和的示例吗？在最后，经过一些处理后，建议的代码片段变成了：\n\n`total = 0;execute_these_statements_4_times\
  \ {cin >> x;total = total + x;}cout << total << endl;`\n\n现在，你需要一种方法用真实的 C++ 语句来“呈现”`execute_these_statements_4_times`。`while`语句可以实现这一点，但你需要额外的变量来计算迭代的总数。这样，当执行了所需的次数后，执行流将退出循环。\n\
  \n下面是一个通用的代码片段，它会按照`total_number_of_iterations`指定的次数进行迭代：\n\n`i = 1;while ( i <=\
  \ total_number_of_iterations ) {A statement or block of statementsi++;}`\n\n其中`total_number_of_iterations`\
  \ 可以是一个常量值，甚至是一个变量或表达式。\n\n将此代码片段与之前的结合后，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ project_25.1-5\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\ndouble total, x;\nint i;\ntotal = 0;\ni = 1;\nwhile (i <= 4) {\n    cin >>\
  \ x;\n    total = total + x;\n    i++;\n}\ncout << total << endl;\nreturn 0;\n}\n\
  ```\n\n![](img/notice.jpg)变量`i`的名称并不是固定的。你可以使用任何喜欢的变量名，例如 `counter`、`count`、`k`\
  \ 等。\n\n### 练习 25.1-6 求奇数的和\n\n设计一个流程图并编写相应的 C++ 程序，让用户输入 20 个整数，然后计算并显示所有奇数的和。\n\
  \n##### 解决方案\n\n这非常简单。程序在循环内部必须做的是检查用户提供的数字是否为奇数，如果是，则该数字必须累加到变量`total` 中；偶数则必须忽略。流程图如下。它包含一个嵌套在先置测试循环结构中的单分支决策结构。\n\
  \n![Image](img/chapter25-03.png)\n\n相应的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_25.1-6\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\nint total, i, x;\ntotal = 0;\ni = 1;\nwhile (i <= 20) {\n    cin >> x;\n  \
  \  if (x % 2 != 0) {\n        total += x; // 等等同于 total = total + x\n    }\n   \
  \ i++;\n}\ncout << total << endl;\nreturn 0;\n}\n```\n\n![](img/notice.jpg)只要保持它们在语法和逻辑上正确，你可以将任何决策控制结构嵌套在任何循环控制结构中。\n\
  \n### 练习 25.1-7 求 N 个数的和\n\n编写一个 C++ 程序，让用户输入 N 个数字，然后计算并显示它们的和。N 的值必须在程序开始时由用户提供。\n\
  \n##### 解决方案\n\n在这个练习中，迭代的总次数取决于用户必须输入的值。下面是一个迭代 N 次的通用代码片段，其中 N 由用户提供。\n\n`cin\
  \ >> n;i = 1;while (i <= n) {A statement or block of statementsi++;}`\n\n根据你目前所学到的知识，最终程序变为：\n\
  \n![](img/my_exercise_header.png) project_25.1-7\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\nint n, i;\ndouble x, total;\ntotal = 0;\ncin\
  \ >> n;\ni = 1;\nwhile (i <= n) {\n    cin >> x;\n    total += x;\n    i++;\n}\n\
  cout << total << endl;\nreturn 0;\n}\n```\n\n### 练习 25.1-8 求未知数量数字的和\n\n编写一个 C++\
  \ 程序，让用户反复输入整数值，直到输入值 -1 为止。当数据输入完成后，必须显示输入数字之和。（-1 的值不能包含在最终和中）。接下来，创建一个跟踪表，使用\
  \ 10、20、5 和 -1 作为输入值来检查你的程序是否正常运行。\n\n##### 解决方案\n\n在这个练习中，迭代的总次数是未知的。如果你使用决策控制结构，你的程序将像下面的代码片段：\n\
  \n`total = 0;cin >> x;if (x != -1) { // 检查变量 x total += x; // 执行此语句 cin >> x; //\
  \ 以及执行此语句 if (x != -1) { // 检查变量 x total += x; // 执行此语句 cin >> x; // 以及执行此语句 if\
  \ (x != -1) { // 检查变量 x total += x; // 执行此语句 cin >> x; // 以及执行此语句 ... ... } } }cout\
  \ << total << endl;`\n\n现在让我们用循环控制结构来重写这个程序。接下是最终程序。如果你尝试跟踪执行流，你会发现它的运行方式与上一个相同。\n\
  \n![](img/my_exercise_header.png) project_25.1-8\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\ndouble total, x;\ntotal = 0;\ncin >> x;\nwhile\
  \ (x != -1) { // 检查变量 x\n    total += x; // 执行此语句\n    cin >> x; // 以及执行此语句\n}\n\
  cout << total << endl;\nreturn 0;\n}\n```\n\n现在让我们创建一个跟踪表，使用 10、20、5 和 -1 作为输入值来确定此程序是否正常运行。\n\
  \n| 步骤 | 语句 | 备注 | x | total |\n| --- | --- | --- | --- | --- |\n| --- | --- | |\
  \ | |\n| 1 | total = 0 | | | 0 |\n| 2 | cin >> x | | 10 | 0 |\n| 3 | while (x !=\
  \ -1) | 结果结果为真 | | |\n| 4 | total += x | | | 10 |\n| 5 | cin >> x | | 20 | 10 |\n\
  | 6 | while (x != -1) | 结果结果为真 | | |\n| 7 | total += x | | | 30 |\n| 8 | cin >>\
  \ x | | 5 | 30 |\n| 9 | while (x != -1) | 结果结果为真 | | | |\n| 10 | total += x | |\
  \ | 35 |\n| 11 | cin >> x | | -1 | 35 |\n| 12 | while (x != -1) | 结果结果为假 | | | |\n\
  | 13 | cout << total << endl; | | 显示为: 35 | | |\n\n如你所见，最后变量 `total` 包含值 35，这确实是\
  \ 10 + 20 + 5 的和。此外，用户提供的最后一个值 -1 不参与最终的和。\n\n当在循环开始之前已知迭代次数时，通常被称为“确定循环”。然而在这个练习中，迭代次数在开始之前是未知的，它取决于某个条件。这种类型的循环被称为“不确定循环”。\n\
  \n### 25.2 后置测试循环结构\n\n后置测试循环结构如下流程图所示。\n\n![Image](img/chapter25-04.png)\n\n![](img/remember.jpg)在循环控制结构中，菱形的出口总有一个向上的方向。\n\
  \n让我们看看执行流到达后置测试循环结构时会发生什么。该结构中的语句或语句块被直接执行，如果 `Boolean_Expression` 为真，执行流将回到语句或语句块正上点。语句或语句块再次执行一次，如果\
  \ `Boolean_Expression` 再次为真，则重复该过程。当 `Boolean_Expression` 在某处变为假时，迭代停止，执行流退出循环。\n\
  \n\n\n\n\n![](img/notice.jpg)后测试循环与先测试循环的区别在于，后测试循环首先执行结构中的语句或语句块，然后才评估布尔表达式。因此，后测试循环至少执行一次迭代！\n\
  \n![](img/remember.jpg)每当循环控制结构的语句或语句块被执行一次时，计算机科学中使用的术语是“循环正在迭代”或“循环执行了一次迭代”。\n\
  \nC++ 语句的一般形式为：\n\n```\ndo {A statement or block of statements} while (Boolean_Expression);\n\
  ```\n\n下面的示例显示了从 1 到 10 的数字。\n\n![](img/my_exercise_header.png)project_25.2\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int i;\n    i = 1;\n\
  \    do {\n        cout << i << endl;\n        i++;\n    } while (i <= 10);\n  \
  \  return 0;\n}\n```\n![](img/notice.jpg)注意 `do-while` 语句末尾有一个分号 `;`。\n\n当只需要一个单一语句作为\
  \ `do-while` 语句的一部分时，允许省略大括号 `{}`。因此，`do-while` 语句可以写如下：\n\n```\ndo One_Statement;\
  \ while (Boolean_Expression);\n```\n为了防止潜在的逻辑错误，许多程序员即使在 `do-while` 语句仅包含一个语句也倾向于始终使用大括号。\n\
  \n### 练习 25.2-1 设计流程图并计算总迭代次数\n\n为以下代码段设计对应的流程图。这段 C++ 代码执行了多少次迭代？\n\n```cpp\nint\
  \ i;\ni = 3;\ndo {\n    i--;\n} while (i > 0);\ncout << \"The end\";\n```\n\n####\
  \ 解答\n\n对应的流程图片段如下。\n\n![Image](img/chapter25-05.png)\n现在，让我们创建一个追踪来观察执行流。\n\n|\
  \ 步骤 | 语句 | 注释 | i |\n| :--- | :--- | :--- | :--- |\n| 1 | `i = 3` | | 3 |\n| 2\
  \ | `i--` | | 2 |\n| 3 | `while (i > 0)` | 结果为真 | 2 |\n| 4 | `i--` | | 1 |\n| 5\
  \ | `while (i > 0)` | 结果为真 | 1 |\n| 6 | `i--` | | 0 |\n| 7 | `while (i > 0)` | 结果为假\
  \ | 0 |\n| 8 | `cout << \"The end\"` | 显示：The end | 0 |\n\n正如你从追踪表中看到的，总迭代次数为三次![](img/notice.jpg)后测试循环结构中的语句或语句块都执行了\
  \ `N` 次，而布尔表达式也被评估了 `N` 次。因此，要确定总迭代次数，你可以计算语句或语句块执行的次数，也可以计算布尔表达式评估的次数。这两个计数是相等！\n\
  \n### 练习 25.2-2 计算总迭代次数\n\n这段代码段执行了多少次迭代？\n\n```cpp\nint i = 3;\ndo {\n    cout\
  \ << i;\n    i--;\n} while (i >= 0);\ncout << \"The end\";\n```\n\n#### 解答\n\n这个练习与上一个几乎相同。主要区别在于这里的布尔表达式在\
  \ `i = 0` 时仍然为真。因此，它多执行了一次迭代，总共四次。\n\n### 练习 25.2-3 设计流程图并计算总迭代次数\n\n为以下代码段设计对应的流程图。这段代码执行了多少次迭代？\n\
  \n```cpp\nint i = -1;\ndo {\n    cout << \"Hello there!\" << endl;\n    i--;\n}\
  \ while (i > 0);\ncout << \"The end\";\n```\n\n#### 解答\n\n对应的流程图片段如下。\n\n![Image](img/chapter25-06.png)\n\
  初始将值 `-1` 赋值给变量 `i`。在循环内部，显示消息“Hello there!”并且变量 `i` 减一（结果为 `-2`）。布尔表达式 `i > 0`\
  \ 评估为假，执行流直接进入 `\"The end\"` 语句。因此，该算法执行了一次迭代！\n\n### 练习 25.2-4 计算总迭代次数\n\n这段代码段执行了多少次迭代？\n\
  \n```cpp\nint i = 1;\ndo {\n    i = i + 2;\n} while (i != 4);\ncout << \"The end\"\
  ;\n```\n\n#### 解答\n\n让我们创建一个追踪来观察执行流。\n\n| 步骤 | 语句 | 注释 | i |\n| :--- | :--- | :---\
  \ | :--- |\n| 1 | `i = 1` | | 1 |\n| 2 | `i = i + 2` | | 3 |\n| 3 | `while (i !=\
  \ 4)` | 结果为真 | 3 |\n| 4 | `i = i + 2` | | 5 |\n| 5 | `while (i != 4)` | 结果为真 | 5\
  \ |\n| 6 | `i = i + 2` | | 7 |\n| 7 | `while (i != 4)` | 结果为真 | 7 |\n| 8 | `...`\
  \ | | ... |\n| 9 | `...` | | |\n\n正如你从追踪表中看到的，由于值 `4` 永远没有赋值给变量 `i`，这段代码段将无限无限次！显然，这段代码不满足有限性属性。\n\
  \n### 练习 25.2-5 求 N 个数字的积\n\n编写一个 C++ 程序，允许用户输入 `N` 个数字，然后计算并显示它们的积。`N` 的值必须由用户在程序开始提供。如果将后测试循环结构切换为先测试循环结构会怎样？对于所有可能的\
  \ `N` 输入值，两个程序的运行方式是否完全相同？\n\n#### 解答\n\n下面的两个程序都允许用户输入 `N` 个数字、计算并显示它们的积。左侧使用先测试，右侧使用后测试循环结构。如果你尝试执行它们并输入任何大于零的\
  \ `N` 值，两个程序的运行方式完全相同！\n\n![](img/my_exercise_header.png)project_25.2-5a\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int n, i;\n    double\
  \ p, x;\n    cin >> n;\n    p = 1;\n    i = 1;\n    while (i <= n) {\n        cin\
  \ >> x;\n        p = p * x;\n        i++;\n    }\n    cout << p << endl;\n    return\
  \ 0;\n}\n```\n![](img/my_exercise_header.png)project_25.2-5b\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int n, i;\n    double p, x;\n    cin >>\
  \ n;\n    p = 1;\n    i = 1;\n    do {\n        cin >> x;\n        p = p * x;\n\
  \        i++;\n    } while (i <= n);\n    cout << p << endl;\n    return 0;\n}\n\
  ```\n\n### 25.3 中测试循环\n\n中测试循环结构如图图所示。\n\n![Image](img/chapter25-07.png)\n\n让我们看看执行流到达中测试循环结构会发生什么。结构中的语句或语句块\
  \ 1 被直接执行，如果布尔表达式评估为假，则执行语句或语句块 2，然后执行流返回到语句或语句块 1 上方的点。语句或语句块 1 再次被执行，如果布尔表达式再次评估为假，则重复该过程。当布尔表达式在某一点评估为真时，迭代停止，执行流退出循环。\n\
  \n尽管这种循环结构在某些计算机语言（如 Ada）中被直接支持，但遗憾 C++ 没有。然而，你仍然可以使用 `while` 语句结合 `if` 和 `break`\
  \ 语句编写中测试循环。主思想如后面给出的通用形式代码段所示。\n\n```\nwhile (true) {\n    A statement or block\
  \ of statements 1\n    if (Boolean_Expression) break;\n    A statement or block\
  \ of statements 2\n}\n```\n\n\n\n\n\n![](img/my_exercise_header.png) 项目 _25.3\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int i = 1;\n\
  \    while (true) {\n        cout << i << endl;\n        if (i >= 10) break;\n \
  \       i++;\n    }\n    return 0;\n}\n```\n\n### 练习 25.3-1 设计流程图并计算总迭代次数\n\n为以下代码段设计对应的流程图，并创建一个追踪表以确定每一步中变量\
  \ `i` 的值。\n\n```cpp\nint i = 10;\nwhile (true) {\n    cout << i << endl;\n    i\
  \ += 5;\n    if (i > 45) break;\n    cout << i * i << endl;\n    i += 10;\n}\ncout\
  \ << \"The end\";\n```\n\n#### 答案\n\n对应的流程图片段如下。\n\n![Image](img/chapter25-08.png)\n\
  \n现在，让我们创建一个追踪表来观察执行流程。\n\n| 步骤 | 语句 | 备注 | i |\n| --- | --- | --- | --- |\n| 1\
  \ | `i = 10` | | 10 |\n| 2 | `cout << i << endl` | 显示：10 | |\n| 3 | `i += 5` | |\
  \ 15 |\n| 4 | `if (i > 45)` | 结果为假 | |\n| 5 | `cout << i * i << endl` | 显示：225 |\
  \ |\n| 6 | `i += 10` | | 25 |\n| 7 | `cout << i << endl` | 显示：25 | |\n| 8 | `i +=\
  \ 5` | | 30 |\n| 9 | `if (i > 45)` | 结果为假 | |\n| 10 | `cout << i * i << endl` |\
  \ 显示：900 | |\n| 11 | `i += 10` | | 40 |\n| 12 | `cout << i << endl` | 显示：40 | |\n\
  | 13 | `i += 5` | | 45 |\n| 14 | `if (i > 45)` | 结果为假 | |\n| 15 | `cout << i * i\
  \ << endl` | 显示：2025 | |\n| 16 | `i += 10` | | 55 | |\n| 17 | `cout << i << endl`\
  \ | 显示：55 | |\n| 18 | `i += 5` | | 60 | |\n| 19 | `if (i > 45)` | 结果为真 | |\n| 20\
  \ | `cout << \"The end\"` | 显示：The end | |\n\n### 25.4 复习题：判断对错\n\n对以下每个陈述判断对错。\n\
  \n1) 先测试循环（pre-test loop）可能执行零次迭代。\n2) 在流程图中，先测试循环结构中菱形符号的两个出口方向都是向上的。\n3) 先测试循环结构中的语句或语句块至少执行一次。\n\
  4) 当 `while` 语句的布尔表达式求值为为真时，它停止迭代。\n5) 在先测试循环结构中，当语句或语句块执行 `N` 次时，布尔表达式求值了 `N -\
  \ 1` 次。\n6) 后测试循环（post-test loop）可能执行零次迭代。\n7) 在后测试循环结构中，当语句或语句块执行 `N` 次时，其布尔表达式也求值了\
  \ `N` 次。\n8) 不能在后测试循环结构内部嵌套决策控制结构。\n9) 在中测试循环（mid-test loop）结构中，语句或块 1 的执行次数与语句或块\
  \ 2 的执行次数相同。\n10) 在以下代码段中，单词“Hello”显示了 10 次。\n```cpp\nint i = 1;\nwhile (i <= 10)\
  \ cout << \"Hello\" << endl;\ni++;\n```\n11) 下 C++ 程序不满足有限性。\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int i;\n    i = 1;\n    while (i != 10)\
  \ {\n        cout << \"Hello\" << endl;\n        i += 2;\n    }\n    return 0;\n\
  }\n```\n12) 在以下代码段中，单词“Hello”显示了无限次。\n```cpp\nint i = 1;\ndo {\n    cout << \"Hello\"\
  \ << endl;\n} while (i >= 10);\n```\n13) 以下 C++ 程序满足有效性。\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int i;\n    do {\n        cout << \"Hello\"\
  \ << endl;\n        i -= 2;\n    } while (i > 10);\n    return 0;\n}\n```\n14) 以下代码段不满足确定性。\n\
  ```cpp\nint b;\ndouble a;\ncin >> b;\nif (b != 1) {\n    do {\n        a = 1 / (b\
  \ - 1);\n        b++;\n    } while (b <= 10);\n}\n```\n15) 在以下代码段中，单词“Zeus”显示了 10\
  \ 次。\n```cpp\nint i = 1;\nwhile (true) {\n    cout << \"Zeus\" << endl;\n    if\
  \ (i > 10) break;\n    i++;\n}\n```\n\n### 25.5 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n1)\
  \ 在流程图中，菱形符号用于：\na) 决策控制结构中。\nb) 循环控制结构中。\nc) 以上都是\n2) 后测试循环\na) 比先测试循环多执行一次迭代。\n\
  b) 与先测试循环执行相同的迭代。\nc) 取决于情况\n3) 在后测试循环结构中，语句或语句块\na) 在循环布尔表达式求值之前执行。\nb) 在循环布尔表达式求值之后执行。\n\
