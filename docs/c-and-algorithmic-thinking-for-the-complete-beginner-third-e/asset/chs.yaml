  int i = 1;\nwhile (i >= 10) {cout << \"Hi!\" << endl;cout << \"Apollo\" << endl\n\
  ```\n“Apollo”显示了：\na) 10 次。\nb) 1 次。\nc) 0 次。\nd) 以上都不是\n8) 以下代码段：\n```cpp\nint\
