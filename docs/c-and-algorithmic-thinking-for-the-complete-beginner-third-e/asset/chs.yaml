  18) 为什么清理好你的循环至关重要？\n19) 什么是无限循环？\n\n# 第六部分\n\nC++ 中的数据结构\n\n## 第 31 章\n\n一维数组与映射\n\
  \n### 31.1 引言\n\n变量是内存中存储值的良好方法，但它们有一个局限性——它们一次只能存储一个值。然而，在许多情况下，程序需要在内存中保留大量数据，此时变量并不是最佳选择。\n\
  \n\n\n\n\n例如，考虑以下练习：\n\n编写一个 C++ 程序，让用户输入三个数字。然后按升序顺序显示这些数字。\n\n考虑以下代码片段。它允许用户输入三个数字。\n\
  \n```cpp\nfor (i = 0; i <= 2; i++) {cin >> number;}\n```\n\n当循环最终完成迭代时，变量 `number`\
  \ 只包含最后提供的那个数字。遗憾的是，之前的两个数字都丢失了！使用这段代码片段，无法将它们按升序顺序显示。\n\n一种可能的解决方案是使用三个独立的变量，如下所示：\n\
  \n```cpp\ncin >> num1;cin >> num2;cin >> num3;if (num1 <= num2 && num2 <= num3)cout\
  \ << num1 << \"  \" << num2 << \"  \" << num3 << endl;else if (num1 <= num3 && num3\
  \ <= num2)cout << num1 << \"  \" << num3 << \"  \" << num2 << endl;else if (num2\
  \ <= num1 && num1 <= num3)cout << num2 << \"  \" << num1 << \"  \" << num3 << endl;else\
  \ if (num2 <= num3 && num3 <= num1)cout << num2 << \"  \" << num3 << \"  \" << num1\
  \ << endl;else if (num3 <= num1 && num1 <= num2)cout << num3 << \"  \" << num1 <<\
  \ \"  \" << num2 << endl;elsecout << num3 << \"  \" << num2 << \"  \" << num1 <<\
  \ endl;\n```\n\n这不是一个完美的解决方案，但它有效！然而，如果这个练习的措辞要求用户输入 1000 个数字而不是三个呢？考虑一下！你能为所有这些数字编写一个类似的\
  \ C++ 程序吗？当然不能！幸运的是，有数据结构！\n\n![](img/notice.jpg)在计算机科学中，数据结构是组织好的数据集合，以便你能够以最有效的方式对其进行操作。\n\
  \nC++ 中有数据结构可用，包括数组（arrays）、向量（vectors）、有序和无序映射（maps）以及字符串（strings）。是的，你听得没错！由于字符串是字母数字字符的集合，它被认为是一种数据结构。\n\
  \n除了字符串（你已经学习了足够的内容）之外，数组和无序映射是 C++ 中最常用的数据结构。接下来的章节将分析这两者。\n\n### 31.2 什么是数组？\n\
  \n数组是一种可以在一个通用名称下存储多个值的数据结构。它可以被看是一个元素的集合，其中每个元素都被分配了一个唯一的数字，称为索引位置（index position），或简单的索引（index）。数组是可变的（mutable），这意味着一旦创建了数组，其元素的值就可以更改。\n\
  \n![](img/notice.jpg)计算机科学中的数组类似于数学中使用的矩阵。数学矩阵是数字或其他数学对象的集合，按行和列排列。\n\n数组有一维数组和多维数组。多维数组可以是二维、三维、四维等。\n\
  \n### 一维数组\n\n以下示例展示了一个存储六个学生成绩的一维数组。数组的名称为 `grades`。为了方便起见，相应的索引写在每个元素上方。在 C++\
  \ 中，默认情况下，索引编号始终从零开始。\n\n![Image](img/chapter31-01.png)\n\n![](img/remember.jpg)由于索引编号从零开始，数组最后一个元素的索引比数组中的总元素数少\
  \ 1。在 `grades` 数组中，最后一个元素的索引是 5，而总元素数为 6。\n\n你可以将数组想象成是六个独立的变量——`grades0`、`grades1`、`grades2`、……\
  \ `grades5`——每个变量持有一个学生的成绩。然而，数组的优势在于它可以在一个通用名称下持有多个值。\n\n### 二维数组\n\n通常，多维数组对于处理多组数据非常有用。例如，假设你想存储加州在四月四周的每日最高温度。一种方法是使用四个一维数组，每周周一个。此外，每个数组将有七个元素，对应每周的每一天，如下：\n\
  \n![Image](img/chapter31-02.png)\n\n然而，这种方法有点笨拙，因为你必须单独处理每个数组。更好的方法是使用具有四行（每周一行）和七列（每周每天一列）的二维数组，如下：\n\
  \n![Image](img/chapter31-03.png)\n\n### 三维数组\n\n下一个示例显示了一个三维数组，存储了 2013 年和 2014\
  \ 年加州在四月四周的每日最高温度。\n\n![Image](img/chapter31-04.png)\n\n![](img/notice.jpg)注意，存在四维、五维甚至一百维的数组。然而，经验表明，作为一名程序员，你一生中需要的最大数组维度可能二维或三维。\n\
  \n#### 练习 31.2-1 设计数组\n\n设计一个可以存储 8 个人年龄的数组，然后向数组中添加一些典型值。\n\n### 答案\n\n这是一个简单的题。你只需要设计一个包含\
  \ 8 个元素（索引从 0 到 7）的数组。可以是单行或单列的数组，如下：\n\n![Image](img/chapter31-05.png)\n\n但请记住，C++\
  \ 中没有单行或单列的数组。这些概念可能存在于数学矩阵中（或在你的想象中！但不存在于 C++ 中。C++ 中的数组是一维的——就此！如果你想将它们可视化为单行或单列，那取决于你。\n\
  \n#### 练习 31.2-2 设计数组\n\n设计必要的数组来存储七个人的名字和年龄，然后向数组中添加一些典型值。\n\n### 答案\n\n这个练习可以用两个数组来实现。让我们每个都设计为一列。\n\
  \n![Image](img/chapter31-06.png)\n\n如你所示，`names` 数组中的元素与 `ages` 数组中的元素之间是一一对应的。七个人中的第一个是\
  \ John Thompson，他 17 岁。名字“John Thompson”存储在 `names` 数组的索引 0 处，他的年龄存储在 `ages` 相同的索引处。下一个人的名字（Ava\
  \ Miller）和她的年龄（25）分别存储在 `names` 和 `ages` 数组的索引 1 处，依此类推。\n\n#### 练习 31.2-3 设计数组\n\
  \n设计必要的数组来存储十个人的名字，以及他们一月、二月和三月的平均体重（以磅为单位）。然后向数组中添加一些典型值。\n\n### 答案\n\n在这个练习中，你需要一个用于名字的一维数组，以及一个用于人们体重的二维数组，它们的元素之间有一一对应的关系。\n\
  \n![Image](img/chapter31-07.png)\n\n### 31.3 在 C++ 中创建一维数组\n\nC++ 有许多方法创建数组并向其添加元素（和值）。取决于给定的问题，使用哪种取决于你。\n\
  \n让我们尝试使用最常用的方法创建以下数组。\n\n![Image](img/chapter31-08.png)\n\n### 第一种方法\n\n要创建一个数组并直接给其元素赋值，你可以使用以下通用形式的\
  \ C++ 语句：\n\n`type array_name[] = { value0, value1, value2, … , valueM };`\n\n其中\n\
  \n- ►`type` 可以是 `int`、`double`、`string` 等。\n- ►`array_name` 是数组的名称。\n- ►`value0`、`value1`、`value2`、……\
  \ `valueM` 是数组元素的值。\n\n对于这种方法，你可以使用以下语句创建数组 `ages`：\n\n`int ages[] = {12, 25, 9,\
  \ 11};`\n\n![](img/notice.jpg)索引会自动设置。值 12 被分配给索引位置 0 的元素，值 25 被分配给索引位置 1 的元素，此类此类。索引编号默认从零开始。\n\
  \n### 第二种方法\n\n你可以使用以下通用形式的语句在 C++ 中创建一个空元素大小数组：\n\n`type array_name[size];`\n\n\
  \n\n\n其中 `size` 可以是任何正整数值，甚至可以是一个包含任何正整数值的变量。\n\n下一个语句创建了一个具有 4 个空元素的数组 `ages`。\n\
  \n```cpp\nint ages[4];\n```\n\n![](img/notice.jpg)`int ages[4]` 语句在主内存（RAM）中留出了四个位置。\n\
  \n要给数组元素赋值，你可以使用下面的语句，其通用形式如下：\n\n`array_name[index] = value;`\n\n其中 `index` 是该元素在数组中的索引位置。\n\
  \n接下来的代码段创建了数组 `ages`（在主内存中留出四个位置），然后给它的元素赋值。\n\n```cpp\nint ages[4];\nages[0] =\
  \ 12;ages[1] = 25;ages[2] = 9;ages[3] = 11;\n```\n\n![](img/notice.jpg)数组 `ages`\
  \ 的大小为 4。\n\n当然，除了使用常量值作为 `index` 外，你还可以使用变量或表达式，如下所示。\n\n```cpp\nint k;\nint ages[4];\n\
  k = 0;ages[k] = 12;ages[k + 1] = 25;ages[k + 2] = 9;ages[k + 3] = 11;\n```\n\n###\
  \ 31.4 如何从一维数组中获取值\n\n从数组中获取值只是指向特定元素的问题。一维数组的每个元素都可以使用 `index` 唯一地标识。接下来的代码段创建了一个数组并在屏幕上显示“A+”（不带双引号）。\n\
  \n```cpp\nstring grades[] = {\"B+\", \"A+\", \"A\", \"C-\"};\ncout << grades[1]\
  \ << endl;\n```\n\n当然，除了使用常量值作为 `index` 外，你还可以使用变量或表达式。接下来的示例创建了一个数组并在屏幕上显示“Aphrodite\
  \ and Hera”（不带双引号）。\n\n```cpp\nstring gods[] = {\"Zeus\", \"Ares\", \"Hera\", \"\
  Aphrodite\", \"Hermes\"};\nk = 2;\ncout << gods[k + 1] << \" and \" << gods[k] <<\
  \ endl;\n```\n\n#### 练习 31.4-1 创建跟踪表\n\n为接下来的代码段创建跟踪表。\n\n```cpp\nint x;\nint a[4];\n\
  a[3] = 9;\nx = 0;\na[x] = a[3] + 4;\na[x + 1] = a[x] * 3;\nx++;\na[x + 2] = a[x\
  \ - 1];\na[2] = a[1] + 5;\na[3] = a[3] + 1;\n```\n\n##### 答案\n\n不要忘记你可以像操作变量一样操作数组的每个元素。因此，当你为使用数组的\
  \ C++ 程序创建跟踪表时，可以为每个元素创建一列，如下：\n\n| 步骤 | 语句 | 注释 | x | a[0] | a[1] | a[2] | a[3]\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | `int a[4]` | 这创建了一个没有值的数组\
  \ `a` | ? | ? | ? | ? | ? |\n| 2 | `a[3] = 9` | | ? | ? | ? | ? | 9 |\n| 3 | `x\
  \ = 0` | | 0 | ? | ? | ? | 9 |\n| 4 | `a[x] = a[3] + 4` | | 0 | 13 | ? | ? | 9 |\n\
  | 5 | `a[x + 1] = a[x] * 3` | | 0 | 13 | 39 | ? | 9 |\n| 6 | `x++` | | 1 | 13 |\
  \ 39 | ? | 9 |\n| 7 | `a[x + 2] = a[x - 1]` | | 1 | 13 | 39 | ? | 13 |\n| 8 | `a[2]\
  \ = a[1] + 5` | | 1 | 13 | 39 | 44 | 13 |\n| 9 | `a[3] = a[3] + 1` | | 1 | 13 |\
  \ 39 | 44 | 14 |\n\n#### 练习 31.4-2 使用不存在的索引\n\n以下 C++ 程序没有满足算法的哪种属性？\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    string grades[] = {\"\
  B+\", \"A+\", \"A\", \"C-\"};\n    cout << grades[100] << endl;\n    return 0;\n\
  }\n```\n\n##### 答案\n\n这个 C++ 程序没有满足两个属性。第一个是显而易见的：没有数据输入。第二个是确定性属性（definiteness）。你永远不能引用数组中不存在的元素。在这个练习中，由于索引位置\
  \ 100 没有元素，最后一条语句会导致运行时错误。\n\n### 31.5 如何修改数组元素的值\n\n修改现有数组元素的值是轻而易举。你只需要使用合适的 `index`\
  \ 并给该元素赋一个新值。接下来的示例正展示了这一点。\n\n```cpp\n// 创建一个数组\nstring tribes[] = {\"Navajo\"\
  , \"Cherokee\", \"Sioux\"};\n// 修改现有元素的值\ntribes[1] = \"Apache\";\ncout << tribes[0]\
  \ << endl;    // 显示为：Navajo\ncout << tribes[1] << endl;    // 显示为：Apache\ncout <<\
  \ tribes[2] << endl;    // 显示为：Sioux\n```\n\n### 31.6 如何遍历一维数组\n\n现在是有的部分。程序可以使用循环控制结构（通常是\
  \ for 循环）来遍历数组的元素。你可以使用两种方法来遍历一维数组。\n\n##### 第一种方法\n\n这种方法通过其 `index` 引用每个数组元素。以下是通用形式编写的代码段：\n\
  \n```cpp\nfor (index = 0; index <= size_of_the_array - 1; index ++) {\n    process\
  \ array_name[index];\n}\n```\n\n其中，`process` 是任何 C++ 语句或语句块，用于在每次迭代中处理数组 `array_name`\
  \ 的一个元素。\n\n接下来的代码段将显示 `gods` 数组的所有元素，每次迭代显示一个。\n\n```cpp\nint i;\nstring gods[]\
  \ = {\"Zeus\", \"Ares\", \"Hera\", \"Aphrodite\", \"Hermes\"};\nfor (i = 0; i <=\
  \ 4; i++) {\n    cout << gods[i] << \"\\t\";\n}\n```\n\n![](img/notice.jpg)变量 `i`\
  \ 的名称并不是固定的。你可以使用任何喜欢的变量名，例如 `index`、`ind`、`j` 等。\n\n![](img/notice.jpg)注意，由于数组\
  \ `gods` 包含五个元素，for 循环必须从 0 迭代到 4，而不是从 1 迭代到 5。这是因为四个元素的索引对应为 0, 1, 2, 3 和 4。\n\n\
  由于数组是可变的，你可以循环控制结构来修改其全部或部分值。接下来的代码段将数组 `b` 的某些元素的值倍。\n\n```cpp\nint b[] = {80,\
  \ 65, 60, 72, 30, 40};\nfor (i = 0; i <= 3; i++) {\n    b[i] = b[i] * 2;\n}\n```\n\
  \n##### 第二种方法\n\n遍历序列元素，除了 for 循环外，还有另一种循环，foreach 循环。有时，使用 foreach 循环是更好的（甚至是必要的）。\n\
  \nforeach 循环的通用形式在下面的流程图中。\n\n![Image](img/chapter31-09.png)\n\n在 C++ 中，foreach\
  \ 循环的通用形式是\n\n```cpp\nfor (const auto& element : sequence) {\n    A statement or\
  \ block of statements\n}\n```\n\n其中\n\n► `element` 必须是一个变量\n► `sequence` 必须是一个数据结构，如字符串、数组等。\n\
  \n接下来的代码段将显示 `grades` 数组的所有元素，每次迭代显示一个。\n\n```cpp\nstring grades[] = {\"B+\", \"\
  A+\", \"A\", \"C-\"};\nfor (const auto& grade : grades) {\n    cout << grade <<\n\
  ;\n```\n\n```\n\n.jpg 在第一次迭代中，第一个元素的值赋值给变量 `grade`。在第二次迭代中，第二个元素的值赋值给 `grade`，以此类推！\n\
  \n注意 `grade` 变量不需要在程序开头声明。C++ 会自动声明它并选择类型！在这个示例中，选择的类型是 `string`。\n\n但请记住，这种方法无法修改数组元素的值。例如，如果你想让\
  \ `numbers` 中的所有元素翻倍，你不能这样做：\n\n```cpp\nint numbers[] = {5, 10, 3, 2};\nfor (const\
  \ auto& number : numbers) {\n    number = number * 2;\n}\n```\n\n![](img/notice.jpg)`number`\
  \ 是一个简单的变量，在每次迭代中，数组的连续值被赋值给它。然而，相反的情况从未发生！`number` 的值无法赋值回元素！\n\n![](img/notice.jpg)如果你想修改数组的值，你应该使用第一种方法。\n\
  \nforeach 循环也可以遍历字符串的字符。接下来的示例显示了字母“H”、“e”、“l”、“l”和“o”（都不带双引号）。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    string msg = \"Hello\";\n\
  \    for (const auto& letter : msg) {\n        cout << letter << endl;\n    }\n\
  \    return 0;\n}\n```\n\n![](img/notice.jpg)`string` 类型的变量是一个数据结构，包含一个字符序列。\n\n\
  接下来的示例与上一个等效。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    int k;\n    string msg = \"Hello\";\n    for (k = 0; k < msg.length(); k++)\
  \ {\n        char letter = msg[k];\n        cout << letter << endl;\n    }\n   \
  \ return 0;\n}\n```\n\n正如你所看到的，处理数据结构时，foreach 循环有时比 for 循环更方便！\n\n#### 练习 31.6-1\
  \ 寻找求和\n\n\n\n\n编写一个 C++ 程序，创建一个包含以下值的数组：\n\n`56, 12, 33, 8, 3, 2, 98`\n\n然后计算并显示它们的总和。\n\
  \n## 解决方案\n\n你学习了两种遍历数组元素的方法。让我们都使用这两种方法并看看差异。\n\n### 第一种方法\n\n解决方案如下：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int i, total;\n   \
  \ int values[] = {56, 12, 33, 8, 3, 2, 98};\n    total = 0;\n    for (i = 0; i <=\
  \ 6; i++) {\n        total += values[i];  //这等于 total = total + values[i]\n    }\n\
  \    cout << total << endl;\n    return 0;\n}\n```\n\n### 第二种方法\n\n解决方案如下：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int total;\n    int\
  \ values[] = {56, 12, 33, 8, 3, 2, 98};\n    total = 0;\n    for (const auto& value\
  \ : values) {\n        total += value;\n    }\n    cout << total << endl;\n    return\
  \ 0;\n}\n```\n\n### 31.7 如何将用户输入的值添加到一维数组中\n\n这里没有新内容。与其从键盘读取一个值并将其赋值给变量，不如直接将该值赋值给特定的数组元素。下一个代码片段提示用户输入四个人的名字，并将它们赋值给数组\
  \ `names` 中索引位置为 0, 1, 2 和 3 的元素。\n\n```cpp\nint main() {\n    string names[4];\
  \  //在主内存 (RAM) 中预留留 4 个位置\n    cout << \"Enter name No 1: \";\n    cin >> names[0];\n\
  \    cout << \"Enter name No 2: \";\n    cin >> names[1];\n    cout << \"Enter name\
  \ No 3: \";\n    cin >> names[2];\n    cout << \"Enter name No 4: \";\n    cin >>\
  \ names[3];\n…\n```\n\n使用 `for`-循环，该代码片段可以等价地写为：\n\n```cpp\nconst int ELEMENTS =\
  \ 4;\nint main() {\n    int i;\n    string names[ELEMENTS];  //在主内存 (RAM) 中预留 4\
  \ 个位置\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cout << \"Enter name No\
  \ \" << i + 1 << \": \";\n        cin >> names[i];\n    }\n    …\n```\n\n处理数组大小的一种非常好的策略是使用常量。\n\
  \n#### 练习 31.7-1 反序显示单词\n\n编写一个 C++ 程序，让用户输入 20 个单词。程序必须按照它们提供的顺序的完全反向显示这些单词。\n\n\
  ##### 解决方案\n\n数组对于这类问题是完美的。以下是一个适当的解决方案。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    int i;\n    string words[20];\n    for (i = 0; i <= 19;\
  \ i++) {\n        cin >> words[i];\n    }\n    for (i = 19; i >= 0; i--) {\n   \
  \     cout << words[i] << endl;\n    }\n    return 0;\n}\n```\n\n由于索引计数从零开始，因此最后一个数组元素的索引比数组中元素的总数少\
  \ 1。\n\n有时练习的措辞可能没有提到使用数据结构。然而，这并不意味着你可以不能使用。当你发现有必要时，请随时使用数据结构（数组、映射等）。\n\n####\
  \ 练习 31.7-2 反序显示正数\n\n编写一个 C++ 程序，让用户向数组中输入 100 个数字。然后它按照用户提供的顺序的完全反向顺序仅显示正数。\n\n\
  ##### 解决方案\n\n在这次练习中，程序必须接受用户的所有值并将它们存储在数组中。但是，在负责显示元素的 `for`-循环内部，必须使用一个嵌套的决策控制结构来检查并仅显示正值。解决方案如下。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS = 100;\n\
  int main() {\n    int i;\n    double values[ELEMENTS];\n    for (i = 0; i <= ELEMENTS\
