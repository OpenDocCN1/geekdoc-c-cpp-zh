  \n想象下一个 C++ 程序帮助你找到家。在这个程序中，递归发生是因为 `void` 函数 `find_your_way_home()` 在函数内部调用了自己。\n\
  \n```cpp\nvoid find_your_way_home() {\n    if (you_are_already_at_home) {\n    \
  \    stop_walking();\n    }else {\n        take_one_step_toward_home();\n      \
  \  find_your_way_home();\n    }\n}\n```\n\n\n\n\n\n```cpp\nint main() {\n    find_your_way_home();\n\
  \    return 0;\n}\n```\n\n现在，让我们尝试通过一个真实的示例来分析递归。接下来的 C++ 程序使用递归计算 5 的阶乘。\n\n![](img/my_exercise_header.png)\
  \ project_37.8\n\n```cpp\n#include <iostream>\nusing namespace std;\nint factorial(int\
  \ value) {\n    if (value == 1) {\n        return 1;\n    } else {\n        return\
  \ value * factorial(value - 1);\n    }\n}\nint main() {\n    cout << factorial(5)\
  \ << endl; //它显示为: 120\n    return 0;\n}\n```\n\n![](img/remember.jpg) 在数学中，非负整数\
  \ `N` 的阶乘是所有小于或等于 `N` 的正整数的乘积。它用 `N!` 表示，根据定义，`0` 的阶乘等于 `1`。例如，`5` 的阶乘是 `1 × 2 ×\
  \ 3 × 4 × 5 = 120`。\n\n![](img/notice.jpg) 递归发生是因为函数 `factorial()` 在函数内部调用了自己。\n\
  \n![](img/notice.jpg) 注意，这里没有任何循环控制结构！\n\n你现在可能很困惑。在不使用循环控制结构的情况下，`1 × 2 × 3 × 4\
  \ × 5` 这个乘积是如何计算出来的？下面的图可能会帮助你理解。它展示了函数 `factorial(5)` 在倒溯系列调用过程中执行的乘法操作。\n\n![Image](img/chapter37-03.png)\n\
  \n让我们来看看这张图是如何工作的。`main` 代码调用函数 `factorial(5)`，后者又调用函数 `factorial(4)`，后者再调用 `factorial(3)`，依此类推。最后一个调用\
  \ `(factorial(1))` 向其调用者 `(factorial(2))` 返回值 `1`，后者又向其调用者 `(factorial(3))` 返回值\
  \ `1 × 2 = 2`，依此类推。当函数 `factorial(5)` 从最顶层的调用返回时，你就得到了最终答案。\n\n为了避免逻辑错误，所有的递归子程序必须遵循三个重要的规则：\n\
  \n1) 它们必须调用自己。\n2) 它们必须有一个边界情况（base case），即“告诉”子程序停止递归的条件。边界情况通常是一个可以直接解决的小型问题。它是“最简单”可能问题的解决方案。在在上一个示例的\
  \ `factorial()` 函数中，边界情况是 `1` 的阶乘。当 `factorial(1)` 被调用时，布尔表达式 `value == 1` 求值为真，并信号递归的结束。\n\
  3) 它们必须改变状态并向边界情况移动。状态改变意味着子程序更改了它的某些数据。通常，数据以某种方式变得越来越小。在上一个示例的 `factorial()` 函数中，由于边界情况是\
  \ `1` 的阶乘，整个概念依赖于向该边界情况移动的想法。\n\n总之，递归帮助你编写更具创意、更优雅的程序，但请记住它并不总是最佳选择。递归的主要缺点是程序员很难想透逻辑，因此很难调试包含递归子程序的代码。此外，递归算法的性能可能比非递归算法差，因为它可能会消耗过多的\
  \ CPU 时间和/或过多的主内存（RAM）。因此，有时遵循 KISS 原则，使用循环控制结构而不是使用递归来解决算法会更好。\n\n![](img/notice.jpg)\
  \ 对于那些不知道 KISS 原则的人，它是“Keep It Simple, Stupid”（保持简单，小笨蛋！）的缩写！它指出，大多数系统在保持简单的情况下运行最好，避免任何不必要的复杂性！\n\
  \n### 37.9 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\n1) 每个子程序都使用自己的内存空间来存储其变量的值。\n2) 子程序中使用的变量“生命周期”与子程序的执行时间一样长。\n\
  3) 在 C++ 程序执行期间一直“存在”的变量只有 `main` 代码中的变量和全局变量。\n4) 子程序可以调用 `main` 代码。\n5) 如果按值传递参数且其值在子程序内部被更改，则它在外部不会发生变化。\n\
  6) 实际参数的名字与相应的形式参数的名字必须相同。\n7) 实际参数的总数不能大于形式参数的总数。\n8) 表达式不能传递给子程序。\n9) 默认情况下，C++\
  \ 中的数组是通过引用传递的。\n10) 你可以将数组传递给 `void` 函数，但 `void` 函数不能（直接或间接地）将数组返回给调用者。\n11) 函数可以通过其形式参数列表接收数组。\n\
  12) 一般来说，`void` 函数可以调用任何函数。\n13) 一般来说，函数可以调用任何 `void` 函数。\n14) 在一条语句中，函数只能被调用一次。\n\
  15) `void` 函数可以通过其形式参数列表返回值。\n16) 子程序可以被另一个子程序或 `main` 代码调用。\n17) 可选参数必须位于任何非可选参数的左侧。\n\
  18) 变量的作用域是指该变量的影响范围。\n19) 如果全局变量的值在子程序内部被更改，则该更改也会反映在子程序外部。\n20) 你可以有两个同名的具有全局作用域的变量。\n\
  21) 递归是一种子程序调用自己的编程技术。\n22) 递归算法必须有一个边界情况。\n23) 使用递归解决问题并不总是最佳选择。\n\n### 37.10 复习练习\n\
