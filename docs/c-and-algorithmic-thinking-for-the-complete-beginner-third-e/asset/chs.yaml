  \ accelerate() {\n        cout << \"汽车加速\" << endl;\n    }\n};\n```\n\n还有一个趣味：类中的字段和方法本质上只是普通的变量和子程序！\n\
  \n注意：在面向对象编程 (`OOP`) 中，使用的术语是“方法”（而不是“函数”）和“void 方法”（而不是“void 函数”）。\n\n注意：`Car`\
  \ 类只是一个模板。还没有创建对象！\n\n注意：`public` 关键字指定其下面的字段和方法可以使用类的实例从外部访问。\n\n注意类末尾存在分号 ( ;\
  \ ) 字符。\n\n注意：类的名称应该遵循大驼峰命名法，以及第 5.4 节中介绍的所有变量命名规则。\n\n要创建两个对象（换句话说，创建两个 Car 类的实例），你需要以下两行代码。\n\
