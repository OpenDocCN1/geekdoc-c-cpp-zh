  > cout << \"Enter an odd positive integer: \";\n\n> cin >> x;\n\n}\n\nodds[i] =\
  \ (int)x;\n\n}\n//倒序显示元素\nfor (i = ELEMENTS - 1; i >= 0; i--) {\n\n> cout << odds[i]\
  \ << \"\\t\";\n\n}\nreturn 0;}\n```\n\n##### 带不同错误信息的验证\n\n在这里，替换代码片段基于第 34.2 节\
  \ 第三种方法。为了验证数据输入并为每种输入错误显示不同的错误信息，C++ 程序如下：\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int ELEMENTS = 20;\nint main() {\nint i;\nbool failure;\n\
  double x;\nint odds[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\ndo {\n\n\
  > cout << \"Enter an odd positive integer: \";\n\n> cin >> x;\n\n> failure = false;\n\
  \n> if (x <= 0) {\n\n> > cout << \"Invalid value: Non-positive entered!\" << endl;\n\
  \n> > failure = true;\n\n> }\n\n> else if (x != (int)x) {\n\n> > cout << \"Invalid\
  \ value: Float entered!\" << endl;\n\n> > failure = true;\n\n> }\n\n> else if ((int)x\
  \ % 2 == 0) {\n\n> > cout << \"Invalid value: Even entered!\" << endl;\n\n> > failure\
  \ = true;\n\n> }\n\n} while (failure);\n\nodds[i] = (int)x;\n\n}\n//倒序显示元素\nfor\
  \ (i = ELEMENTS - 1; i >= 0; i--) {\n\n> cout << odds[i] << \"\\t\";\n\n}\nreturn\
  \ 0;}\n```\n\n\n\n\n\n这是本书最后一次讨论该主题。第一次是在第 23.2 节中使用决策控制结构，第二次是在第 30.4 节中使用循环控制结构。因此，已经没有什么可以讨论的了，除非：当你在一个已经包含某些值的数据结构中寻找最小值或最大值时，你不需要担心变量\
  \ `minimum` 或 `maximum` 的初始值，因为你只需要将数据结构第一个元素的值赋值给它们即可！\n\n### 练习 34.3-1 哪个深度最深？\n\
  \n编写一个 C++ 程序，让用户输入 20 个湖泊的深度，然后显示最深湖泊的深度。\n\n#### 解决方案\n\n在用户在数组 `depths` 中输入 20\
  \ 个湖泊的深度后，变量 `maximum` 的初始值可以设置为 `depths[0]` 的值，即数组 `depths` 的第一个元素。程序可以从索引 1 开始搜索任何大于该值的后续值。最终解决方案非常直观，将在接下来给出，不再做进一步解释。\n\
  \n![](img/my_exercise_header.png)\n\n```cpp\nproject_34.3-1a\n#include <iostream>\n\
  using namespace std;\nconst int LAKES = 20;\nint main() {\n    int i;\n    double\
  \ maximum;\n    double depths[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n\
  \        cin >> depths[i];\n    }\n    maximum = depths[0]; //Initial value\n  \
  \  //此后，从索引 1 开始搜索\n    for (i = 1; i <= LAKES - 1; i++) {\n        if (depths[i]\
  \ > maximum) {\n            maximum = depths[i];\n        }\n    }\n    cout <<\
  \ maximum << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)从位置 0 而不是 1 开始迭代并没有错，尽管程序会执行一次无用的迭代。\n\
  \n![](img/notice.jpg)给变量 `maximum` 分配一个“几乎任意”的初始值也是错的，但没有理由这样做。第一个元素的值就足够了！如果你坚持要这样做的话，可以分配一个初始值\
  \ 0，因为地球上不存在深度为负的湖泊。\n\n但请记住，寻找数组最大值的另一种方法是使用 `max_element()` 函数，如下所示。\n\n![](img/my_exercise_header.png)\n\
  \n```cpp\nproject_34.3-1b\n#include <iostream>\n#include <algorithm>\nusing namespace\
  \ std;\nint main() {\n    const int LAKES = 20;\n    int i;\n    double maximum;\n\
  \    double depths[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n        cin\
  \ >> depths[i];\n    }\n    maximum = *max_element(depths, end(depths));\n    cout\
  \ << maximum << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)相应地，如果你想找到数组的最小值，可以使用\
  \ `min_element()` 函数。\n\n### 练习 34.3-2 哪个湖泊最深？\n\n编写一个 C++ 程序，让用户输入 20 个湖泊的名称和深度，然后显示最深湖泊的名称。\n\
  \n#### 解决方案\n\n如果你不知道如何找到最深湖泊的名称，可能需要通过重新阅读练习 30.4-2 来复习记忆。\n\n在这个练习中，你需要两个一维数组：一个用于存储名称，另一个用于存储湖泊的深度。解决方案见所示。\n\
