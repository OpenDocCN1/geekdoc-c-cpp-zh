  \ endl;\n    }\n    return 0;\n}\n```\n\n### 练习 26.1-11 统计元音\n\n编写一个 C++ 程序，提示用户输入一条消息，然后统计并显示消息中包含的元音数量。\n\
  \n#### 解决方案\n\n下面的 C++ 程序统计英语消息中的元音。for 循环遍历消息包含的所有字符。单分支判断结构每次迭代检查一个字符，如果它是元音，则变量\
  \ `count` 增加一。\n\n![](img/my_exercise_header.png) project_26.1-11\n```cpp\n#include\
  \ <iostream>\n#include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\n\
  using namespace std;\nint main() {\n    string message;\n    char character;\n \
  \   string vowels = \"AEIOU\";\n    int i, count;\n    cout << \"Enter an English\
  \ message: \";\ngetline(cin, message);\n    message = to_upper_copy(message);\n\
  \    count = 0;\n    for (i = 0; i <= message.length() - 1; i++) {\n        character\
  \ = message[i];\n        if (vowels.find(character) != -1) {\n            count++;\n\
  \        }\n    }\n    cout << \"Vowels: \" << count << endl;\n    return 0;\n}\n\
  ```\n\n\n\n\n\n- **规则 1**：计数变量可以出现在循环内部的语句中，但其值绝不能被修改（参见随后的练习 26.2-1）。如果 `final_value`\
  \ 和 `offset` 是变量而非常量值，该规则同样适用。\n- **规则 2**：`offset` 绝不能为零。如果设置为零，循环将执行无限次迭代（参见随后的练习\
  \ 26.2-2）。\n- **规则 3**：如果 `initial_value` 小于 `final_value`，则 `offset` 必须为正数；如果是负数，则循环将执行零次迭代（参见随后的练习\
  \ 26.2-3）。然而，在某些情况下，故意违反这一规则是有用的。\n- **规则 4**：如果 `initial_value` 大于 `final_value`，则\
  \ `offset` 必须为负数；如果是正数，则循环将执行零次迭代（参见随后的练习 26.2-4）。\n\n### 练习 26.2-1 计算总迭代次数\n\n\
  以下代码段执行了多少次迭代？\n\n```cpp\nfor (i = 5; i <= 10; i++) {cout << i;i--;}\n```\n\n####\
  \ 答案\n\n此代码段违反了 for 循环的第一条规则，该规则规定：计数变量可以出现在循环内部的语句中，但其值绝不能被修改。下面的流程图片段可以帮助更好地理解实际情况。\n\
  \n.![Image](img/chapter26-05.png)\n\n如所示，由于变量 `i` 的初始值 5 小于 10，执行流进入了循环。但在循环内部，语句\
  \ `i ← i - 1` 取消了语句 `i ← i + 1`，导致变量 `i` 不递增，从而永远无法达到最终值 `final_value` 10。因此，循环执行了无限次迭代。\n\
  \n![](img/remember.jpg)与计数变量类似，如果 `final_value` 和 `offset` 是变量而非常量值，它们的值在循环内部绝不能被修改。\n\
  \n### 练习 26.2-2 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```cpp\nfor (i = 5; i <= 10; i += 0)\
  \ {cout << i;}\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第二条规则，该规则规定：`offset` 绝不能为零。对应的流程图片段可以帮助更好地理解实际情况。\n\
  \n.![Image](img/chapter26-06.png)\n\n如所示，由于变量 `i` 的初始值小于 10，执行流进入了循环。然而，语句 `i ←\
  \ i + 0` 永远不会增加变量 `i`，这意味着永远无法达到最终值 `final_value` 10。因此，循环执行了无限次迭代。\n\n![](img/remember.jpg)`offset`\
  \ 绝不能为零。\n\n### 练习 26.2-3 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```cpp\nfor (i = 5; i >=\
  \ 10; i--) {cout << i;}\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第三条规则，该规则规定：如果 `initial_value`\
  \ 小于 `final_value`，则 `offset` 必须为正数；如果是负数，则循环将执行零次迭代。对应的流程图片段可以帮助更好地理解实际情况。\n\n\
  .![Image](img/chapter26-07.png)\n\n![](img/remember.jpg)计数器递减时比较运算符应该是 `≥`，计数器递增时应该是\
  \ `≤`。\n\n当执行流到达循环控制结构时，值 5 被赋值给变量 `i`。然而，布尔表达式求值为为假，执行流从未进入循环！因此，循环执行了零次迭代。\n\n\
  ![](img/notice.jpg)for 循环实际上是一个预测试循环结构。正如此，它可能会执行从零次到多次迭代。\n\n![](img/remember.jpg)在某些情况下，故意违反\
  \ for 循环的第三条规则是有用的。\n\n### 练习 26.2-4 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```cpp\nfor (i\
  \ = 10; i <= 5; i++) {cout << i;}\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第四条规则，该规则规定：如果\
  \ `initial_value` 大于 `final_value`，则 `offset` 必须为负数；如果是正数，则循环将执行零次迭代。对应的流程图片段可以帮助更好地理解实际情况。\n\
  \n.![Image](img/chapter26-08.png)\n\n![](img/remember.jpg)计数器递增时比较运算符应该是 `≤`，计数器递减时应该是\
  \ `≥`。\n\n当执行流到达循环控制结构时，值 10 被赋值给变量 `i`。然而，布尔表达式求值为假，执行流从未进入循环！因此，循环执行了零次迭代。\n\n\
  ![](img/remember.jpg)在某些情况下，故意违反 for 循环的第四条规则是有用的。\n\n### 练习 26.2-5 求 N 个数字的和\n\n\
