  \ 寻找平均值\n\n有 20 名学生，每个人都收到了 10 节课的成绩。编写一个 C++ 程序，提示用户输入每个学生所有课程的成绩，然后计算并显示每个学生所有大于\
  \ 89 的平均值。\n\n#### 解决方案\n\n由于你已经学习了两种单独处理每一行的方法，让我们把它们都用上吧。\n\n##### 第一种方法 —— 创建辅助数组\n\
  \n在这种方法中，程序单独处理每一行，并创建一个辅助数组，数组中的每个元素存储一行的平均值。接下来是所需的两个数组。\n\n![Image](img/chapter33-03.png)\n\
  \n在创建平均数组后，程序可以找到并显示所有大于 89 的平均值。该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_33.2-1a\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
  \ STUDENTS = 20;\nconst int LESSONS = 10;\nint main() {\n    int i, j;\n    int\
  \ grades[STUDENTS][LESSONS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n      \
  \  cout << \"For student No. \" << i + 1 << \"...\" << endl;\n        for (j = 0;\
  \ j <= LESSONS - 1; j++) {\n            cout << \"enter grade for lesson No. \"\
  \ << j + 1 << \": \";\n            cin >> grades[i][j];\n        }\n    }\n    //\
  \ 创建平均数组. 遍历行\n    double average[STUDENTS];\n    for (i = 0; i <= STUDENTS - 1;\
  \ i++) {\n        average[i] = 0;\n        for (j = 0; j <= LESSONS - 1; j++) {\n\
  \            average[i] += grades[i][j];\n        }\n        average[i] /= LESSONS;\n\
  \    }\n    // 显示所有大于 89 的平均值\n    for (i = 0; i <= STUDENTS - 1; i++) {\n     \
  \   if (average[i] > 89) {\n            cout << average[i] << endl;\n        }\n\
  \    }\n    return 0;\n}\n```\n\n##### 第二种方法 —— 直接找到并显示即可！\n\n这种方法不使用辅助数组；它只是计算并直接显示所有大于\
  \ 89 的平均值。该 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_33.2-1b\n```cpp\n\
  #include <iostream>\nusing namespace std;\nconst int STUDENTS = 20;\nconst int LESSONS\
  \ = 10;\nint main() {\n    int i, j;\n    double average;\n    int grades[STUDENTS][LESSONS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n        cout << \"For student No. \"\
  \ << i + 1 << \"...\" << endl;\n        for (j = 0; j <= LESSONS - 1; j++) {\n \
  \           cout << \"enter grade for lesson No. \" << j + 1 << \": \";\n      \
  \      cin >> grades[i][j];\n        }\n    }\n    // 计算每一行的平均值并直接显示大于 89 的值\n \
  \   for (i = 0; i <= STUDENTS - 1; i++) {\n        average = 0;\n        for (j\
  \ = 0; j <= LESSONS - 1; j++) {\n            average += grades[i][j];\n        }\n\
  \        average /= LESSONS;\n        if (average > 89) {\n            cout << average\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 33.3 逐列处理\n\n逐列处理每一列意味着每一列都被单独处理，并且每一列的结果（可以是总和、平均值等）可以被单独用于后续处理。假设你有一个如下的\
  \ 4 × 5 数组。\n\n![Image](img/chapter33-04.png)\n\n和之前一样，让我们尝试逐列寻找每列的总和。再次，你有两种方法可以使用。这两种方法都会遍历列。\n\
  \n##### 第一种方法 —— 创建辅助数组\n\n在这种方法中，程序单独处理每一列，并创建一个辅助数组，数组中的每个元素存储一列的总和。这种方法赋予了你很大的灵活性，因为你可以在程序的后续中使用这个新数组。底部是辅助数组\
  \ `total`。\n\n![Image](img/chapter33-05.png)\n\n现在，让我们编写相应的代码。为了更容易理解过程，再次使用了“从内层到外层”的方法。以下代码计算第一列（索引为\
  \ 0）的总和，并存储在辅助数组 `total` 的位置 0 处。假设变量 `j` 为 0。\n\n```cpp\ns = 0;\nfor (i = 0; i\
  \ <= ROWS - 1; i++) {\n    s += b[i][j];\n}\ntotal[j] = s;\n```\n\n该程序可以等价地写：\n\n\
  ```cpp\ntotal[j] = 0;\nfor (i = 0; i <= ROWS - 1; i++) {\n    total[j] += b[i][j];\n\
  }\n```\n\n现在，将这段代码嵌套在遍历所有列的 `for` 循环中，如下：\n\n```cpp\nfor (j = 0; j <= COLUMNS -\
  \ 1; j++) {\n    total[j] = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total[j]\
  \ += b[i][j];\n    }\n}\n```\n\n##### 第二种方法 —— 直接找到并处理\n\n这种方法不使用辅助数组；它只是计算并处理总和。代码片段如下。\n\
  \n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    total = 0;\n    for (i = 0;\
  \ i <= ROWS - 1; i++) {\n        total += b[i][j];\n    }\n    process total;\n\
  }\n```\n\n相应地，以下代码计算并显示每一列的平均值。\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n\
  \    total = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total += b[i][j];\n\
  \    }\n    cout << total / ROWS << endl;\n}\n```\n\n### 练习 33.3-1 寻找平均值\n\n有 10\
  \ 名学生，每个人都收 5 节课的成绩。编写一个 C++ 程序，提示用户输入每个学生所有课程的成绩，然后计算并显示每节课所有大于 89 的平均值。\n\n####\
  \ 解决方案\n\n由于你已经学习了两种单独处理每一列的方法，让我们把它们都用上吧。\n\n##### 第一种方法 —— 创建辅助数组\n\n在这种方法中，程序单独处理每一列，并创建一个辅助数组，数组中的每个元素存储一列的平均值。接下来是两个数组。\n\
  \n![Image](img/chapter33-06.png)\n\n在创建平均数组后，程序可以找到并显示所有大于 89 的平均值。该 C++ 程序如下。\n\
  \n![](img/my_exercise_header.png) project_33.3-1a\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int STUDENTS = 10;\nconst int LESSONS = 5;\nint main()\
  \ {\n    int i, j;\n    int grades[STUDENTS][LESSONS];\n    for (i = 0; i <= STUDENTS\
  \ - 1; i++) {\n        cout << \"For student No. \" << i + 1 << \"...\" << endl;\n\
  \        for (j = 0; j <= LESSONS - 1; j++) {\n            cout << \"enter grade\
  \ for lesson No. \" << j + 1 << \": \";\n            cin >> grades[i][j];\n    \
  \    }\n    }\n    // 创建平均数组. 遍历列\n    double average[LESSONS];\n    for (j = 0;\
  \ j <= LESSONS - 1; j++) {\n        average[j] = 0;\n        for (i = 0; i <= STUDENTS\
  \ - 1; i++) {\n            average[j] += grades[i][j];\n        }\n        average[j]\
  \ /= STUDENTS;\n    }\n    // 显示所有大于 89 的平均值\n    for (j = 0; j <= LESSONS - 1;\
  \ j++) {\n        if (average[j] > 89) {\n            cout << average[j] << endl;\n\
  \        }\n    }\n    return 0;\n}\n```\n\n##### 第二种方法 —— 直接找到并显示即可！\n\n这种方法不使用辅助数组；它只是计算并直接显示所有大于\
  \ 89 的平均值。该 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_33.3-1b\n```cpp\n\
  #include <iostream>\nusing namespace std;\nconst int STUDENTS = 10;\nconst int LESSONS\
  \ = 5;\nint main() {\n    int i, j;\n    double average;\n    int grades[STUDENTS][LESSONS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n        // 注意：原文文本逻辑在嵌套循环上存在细微不匹配，\n\
  \        // 但遵循所提供片段的结构：\n    }\n    // 根据列处理所需的逻辑进行重构：\n    for (j = 0; j <= LESSONS\
  \ - 1; j++) {\n        average = 0;\n        for (i = 0; i <= STUDENTS - 1; i++)\
  \ {\n            average += grades[i][j];\n        }\n        average /= STUDENTS;\n\
  \        if (average > 89) {\n            cout << average << endl;\n        }\n\
  \    }\n    return 0;\n}\n```\n\n\n\n\n### 33.4 如何在程序中使用多个数据结构\n\n到目前为止，每个示例或练习都只使用了一个数组或一个无序映射（unordered\
  \ map）。但如果一个问题要求你使用两个数组、一个数组和一个无序映射，或者一个数组和两个无序映射呢？接下来你将看到一些练习，它们向你展示如何组合各种数据结构来应对各种独特的挑战。\n\
  \n### 练习 33.4-1 使用三个一维数组\n\n有 20 名学生，每个人都收到了两门课程的成绩。编写一个 C++ 程序，提示用户输入每个学生的姓名和两门课程的成绩。该程序必须找到并显示所有两门课程成绩都大于\
  \ 89 的学生的姓名。\n\n#### 解决方案\n\n以下是所需的数组，包含了一些典型值。\n\n![Image](img/chapter33-07.png)\n\
  \n如你所见，数组 `names` 中的元素与数组 `gradesLesson1` 以及 `gradesLesson2` 中的元素之间存在一一对应的关系。 20\
  \ 名学生中的第一位是 George，他两门课程的成绩分别是 95 分和 92 分。名字“George”存储在 `names` 数组的索引 `0` 处，在 `gradesLesson1`\
  \ 和 `gradesLesson2` 数组相同的索引处也存储了他两门课程的成绩。下一个学生（Anna）和她的成绩分别存储在 `names`、`gradesLesson1`\
  \ 和 `gradesLesson2` 数组的索引 `1` 处，以此此类推。\n\n该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int STUDENTS = 20;\n\
  int main() {\n    int i;\n    string names[STUDENTS];\n    int gradesLesson1[STUDENTS];\n\
  \    int gradesLesson2[STUDENTS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n \
  \       cout << \"Enter student name No\" << (i + 1) << \": \";\n        cin >>\
  \ names[i];\n        cout << \"Enter grade for lesson 1: \";\n        cin >> gradesLesson1[i];\n\
  \        cout << \"Enter grade for lesson 2: \";\n        cin >> gradesLesson2[i];\n\
  \    }\n    //显示两门课程成绩都大于 89 的学生的姓名\n    for (i = 0; i <= STUDENTS - 1; i++) {\n\
  \        if (gradesLesson1[i] > 89 && gradesLesson2[i] > 89) {\n            cout\
  \ << names[i] << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 练习 33.4-2\
  \ 使用一维数组结合二维数组\n\n有 10 名学生，每个人都收到了五门课程的成绩。编写一个 C++ 程序，提示用户输入每个学生的姓名和所有课程的成绩，然后计算并显示有超过一个成绩大于\
  \ 89 的学生姓名。\n\n#### 解决方案\n\n在这个练习中，你可以像在上一个练习中那样做。例如，你可以使用一个一维数组来存储学生的姓名，并使用五个一维数组来存储每个学生在每门课程的成绩。这并不方便，但行得通。显然，当成绩超过两个时，这并不是最合适的方法。\n\
  \n这里最好的方法是使用一个一维数组存储学生的姓名，并使用一个二维数组存储每个学生在每门课程的成绩。\n\n实际上有两种方法。使用哪种方法完全取决于你！如果你决定在二维数组中，行代表学生，列代表课程，那么你就可以使用下面讨论的第一种方法。如果你决定行代表课程，列代表学生，那么你可以使用后面的第二种方法。\n\
  \n#### 第一种方法——行代表学生，列代表课程\n\n在这种方法中，二维数组必须有 10 行（每行代表一个学生）和 5 列（每列代表一门课程）。所有其他数组可以如下方式与该二维数组结合。\n\
  \n![Image](img/chapter33-08.png)\n\n![](img/notice.jpg) 辅助数组 `count` 将由程序创建，并存储每个学生大于\
  \ 89 的成绩数量。\n\n现在，让我们看看如何读取值并存储在 `names` 和 `grades` 数组中。一个简单的解决方案是使用一个 `for` 循环读取姓名，然后嵌套的\
  \ `for` 循环读取成绩。然而，对于用户来说，先输入所有姓名再输入所有成绩可能并不实用。一种更符合用户习惯的方法是提示用户输入一个学生姓名，以及该学生所有的成绩，然后处理下一个学生姓名及其相应的成绩，以此此类推。解决方案如下。\n\
  \n![](img/my_exercise_header.png)\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nconst int STUDENTS = 10;\nconst int LESSONS = 5;\nint main() {\n    int\
  \ i, j;\n    //一起起读取姓名和成绩。遍历 grades 数组中的行\n    string names[STUDENTS];\n    int\
  \ grades[STUDENTS][LESSONS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n      \
  \  cout << \"Enter name for student No. \" << i + 1 << \": \";\n        cin >> names[i];\n\
  \        for (j = 0; j <= LESSONS - 1; j++) {\n            cout << \"Enter grade\
  \ No. \" << j + 1 << \" for \" << names[i] << \": \";\n            cin >> grades[i][j];\n\
  \        }\n    }\n    //创建数组 count。遍历行\n    int count[STUDENTS];\n    for (i =\
  \ 0; i <= STUDENTS - 1; i++) {\n        count[i] = 0;\n        for (j = 0; j <=\
  \ LESSONS - 1; j++) {\n            if (grades[i][j] > 89) {\n                count[i]++;\n\
  \            }\n        }\n    }\n    //显示有超过一个成绩大于 89 的学生的姓名\n    for (i = 0; i\
  \ <= STUDENTS - 1; i++) {\n        if (count[i] > 1) {\n            cout << names[i]\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n#### 第二种方法——行代表课程，列代表学生\n\
  \n在这种方法中，二维数组必须有 5 行（每行代表一门课程）和 10 列（每列代表一个学生）。所有其他数组可以如下所示与该二维数组结合，所示。\n\n![Image](img/chapter33-09.png)\n\
  \n![](img/notice.jpg) 辅助数组 `count` 将由程序创建并存储每个学生大于 89 的成绩数量。显然，为了创建数组 `count`，程序将遍历列。解决方案如下。\n\
