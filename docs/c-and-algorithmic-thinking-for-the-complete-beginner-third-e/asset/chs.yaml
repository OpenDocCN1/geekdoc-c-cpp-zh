  \ {\n        z++;\n        y = 6 * a + z;\n    }\n    cout << z << \", \" << y <<\
  \ endl;\n    return 0;\n}\n```\n\n2) 创建一个跟踪表，以确定以下 C++ 程序在每一步中变量的值。然后，设计对应的流程图。\n\
