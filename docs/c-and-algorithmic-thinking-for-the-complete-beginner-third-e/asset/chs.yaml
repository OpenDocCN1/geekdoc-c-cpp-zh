  ```\n\n### 练习 33.4-3 使用数组结合无序映射\n\n有 30 名学生，每个人都收到了某次考试的成绩。编写一个 C++ 程序，提示用户输入每个学生的成绩（字母形式）。然后根据下表为每个学生显示成绩的百分比。\n\
  \n| 成绩 | 百分比 |\n| --- | --- |\n| A | 90-100 |\n| B | 80-89 |\n| C | 70-79 |\n| D\
  \ | 60-69 |\n| E / F | 0-59 |\n\n#### 解决方案\n\n可以使用 `unordered_map` 来存储给定的表格。该方案非常直接，不需要额外的解释。\n\
  \n```cpp\n#include <iostream>\n#include <unordered_map>\nusing namespace std;\n\
  const int STUDENTS = 30;\nint main() {\n    int i;\n    string grade, gradeAsPercentage;\n\
  \    unordered_map<string, string> gradesTable = {\n        {\"A\", \"90-100\"},\n\
  \        {\"B\", \"80-89\"},\n        {\"C\", \"70-79\"},\n        {\"D\", \"60-69\"\
  },\n        {\"E\", \"0-59\"},\n        {\"F\", \"0-59\"}\n    };\n    string names[STUDENTS];\n\
  \    string grades[STUDENTS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n     \
  \   cout << \"Enter student name No\" << i + 1 << \": \";\n        cin >> names[i];\n\
  \    }\n```\n\n\n\n\n\n```cpp\ncin >> names[i];\ncout << \"Enter their grade: \"\
  ;\ncin >> grades[i];\n}\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    grade = grades[i];\n\
  \    gradeAsPercentage = gradesTable[grade];\n    cout << names[i] << \"  \" <<\
  \ gradeAsPercentage << endl;\n}\nreturn 0;\n```\n\n![](img/remember.jpg)`unordered_map`\
  \ 结构定义在库 `unordered_map` 中。它在 C++ 中无法直接访问，因此你需要包含 `unordered_map` 库。\n\n现在，如果你完全理解了最后一个\
  \ `for` 循环是如何工作的，请看接下来的代码片段。它等同于最后一个 `for` 循环，但执行效率更高，因为它使用的变量更少！\n\n```cpp\nfor\
  \ (i = 0; i <= STUDENTS - 1; i++) {cout << names[i] << \"  \" << gradesTable[grades[i]]\
  \ << endl;}\n```\n\n### 33.5 从二维数组创建一个一维数组\n\n为了更容易理解如何从二维数组创建一个一维数组，让我们来看一个例子。\n\
  \n编写一个 C++ 程序，从一个现有的 3 × 4 二维数组（所示）创建一个包含 12 个元素的一维数组，要求如下：二维数组第一列的元素必须放置在一维数组的前三个位置，第二列的元素必须放置在接下来的三个位置，依此类推。\n\
  \n下面展示了该 3 × 4 二维数组以及新创建的一维数组。\n\n![Image](img/chapter33-10.png)\n\n接下来的 C++ 程序通过遍历列来创建新的一维数组，这样更方便。它使用了示例中给出的现有数组。\n\
  \n![](img/my_exercise_header.png) project_33.5\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int ROWS = 3;\nconst int COLUMNS = 4;\nconst int ELEMENTS\
  \ = ROWS * COLUMNS;\nint main() {\n    int i, j, k;\n    int a[ROWS][COLUMNS] =\
  \ {\n        {5, 9, 3, 2},\n        {11, 12, 4, 1},\n        {10, 25, 22, 18}\n\
  \    };\n    k = 0; //这里是新数组的索引。\n    int b[ROWS * COLUMNS];\n    for (j = 0; j\
  \ <= COLUMNS - 1; j++) { // 遍历列\n        for (i = 0; i <= ROWS - 1; i++) {\n   \
  \         b[k] = a[i][j];\n            k++;\n        }\n    }\n    for (k = 0; k\
  \ <= ELEMENTS - 1; k++) {\n        cout << b[k] << \"\\t\";\n    }\n    return 0;\n\
  }\n```\n\n### 33.6 从一维数组创建一个二维数组\n\n为了更容易理解如何从一维数组创建一个二维数组，让我们来看一个例子。\n\n编写一个 C++\
  \ 程序，从一个现有的包含 12 个元素的一维数组（所示）创建一个 3 × 4 的二维数组，要求如下：一维数组的前三个元素必须放置在二维数组的第一列，一维数组的下三个元素必须放置在下一列，依此类推。\n\
  \n下面展示了该 12 个元素的一维数组以及新创建的二维数组。\n\n![Image](img/chapter33-11.png)\n\n接下来的 C++ 程序通过遍历列来创建新的二维数组，这是很方便的。它使用了示例中给出的现有数组。\n\
  \n![](img/my_exercise_header.png) project_33.6\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int ROWS = 3;\nconst int COLUMNS = 4;\nint main() {\n  \
  \  int k, j, i;\n    int a[] = {5, 11, 10, 9, 12, 25, 3, 4, 22, 2, 1, 18};\n   \
  \ k = 0; //这里是数组的索引。\n    int b[ROWS][COLUMNS];\n    for (j = 0; j <= COLUMNS -\
  \ 1; j++) { // 遍历列\n        for (i = 0; i <= ROWS - 1; i++) {\n            b[i][j]\
  \ = a[k];\n            k++;\n        }\n    }\n    for (i = 0; i <= ROWS - 1; i++)\
  \ { // 遍历行\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            cout << b[i][j]\
  \ << \"\\t\";\n        }\n        cout << endl;\n    }\n    return 0;\n}\n```\n\n\
  ### 33.7 有用的数据结构函数/方法\n\n#### 统计元素数量\n`sizeof(array)`\n\n此函数返回任何数组的大小（以字节为单位）。\n\
  \n示例：\n\n![](img/my_exercise_header.png) project_33.7a\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int i;\n    int a[] = {3, 6, 10, 12, 4,\
  \ 2};\n    // 每个整数占用 4 字节\n    cout << sizeof(a) << endl; // 它可能显示：24\n    cout\
  \ << sizeof(a) / sizeof(a[0]) << endl; // 它显示：7\n    for (i = 0; i <= sizeof(a)\
  \ / sizeof(a[0]) - 1; i++) {\n        cout << a[i] << \"  \"; // 它显示：3 6 10 12 4\
  \ 2\n    }\n    int b[3][4] = {\n        {5, 9, 3, 2},\n        {11, 12, 4, 1},\n\
  \        {10, 25, 22, 18}\n    };\n    cout << sizeof(b) / sizeof(b[0]) << endl;\
  \ // 它显示：3\n    cout << sizeof(b[0]) / sizeof(b[0][0]) << endl; // 它显示：4\n    return\
  \ 0;\n}\n```\n在二维数组 `b` 中，`sizeof(b) / sizeof(b[0])` 返回行数（3），而 `sizeof(b[0]) / sizeof(b[0][0])`\
  \ 返回列数（4）。如果你想获取数组中的总元素数量，可以使用 `sizeof(b) / sizeof(b[0][0])`。\n\n#### 获取最大值\n`max_element(array,\
  \ end)`\n\n该语句返回数组 `array` 中的最大值。\n\n示例：\n\n![](img/my_exercise_header.png) project_33.7b\n\
  ```cpp\n#include <iostream>\n#include <algorithm>\nusing namespace std;\nint main()\
  \ {\n    int a[] = {5, 11, 10, 9, 12, 25, 3, 4, 22, 2, 1, 18};\n    cout << *max_element(a,\
  \ a+12) << endl; // 它显示：25\n    return 0;\n}\n```\n`max_element()` 函数定义在 `algorithm`\
  \ 库中。它在 C++ 中无法直接访问，你需要包含 `algorithm` 库。\n\n#### 获取最小值\n`min_element(array, end)`\n\
  \n该语句返回数组 `array` 中的最小值。\n\n示例：\n\n![](img/my_exercise_header.png) project_33.7c\n\
  ```cpp\n#include <iostream>\n#include <algorithm>\nusing namespace std;\nint main()\
  \ {\n    int a[] = {5, 11, 10, 9, 12, 25, 3, 4, 22, 2, 1, 18};\n    cout << *min_element(a,\
  \ a+12) << endl; // 它显示：1\n    return 0;\n}\n```\n`min_element()` 函数定义在 `algorithm`\
  \ 库中。它在 C++ 中无法直接访问，你需要包含 `algorithm` 库。\n\n#### 数组排序\n`sort(array, end)`\n\n该语句对数组\
  \ `array` 进行升序排序。\n\n示例：\n\n![](img/my_exercise_header.png) project_33.7d\n```cpp\n\
  #include <iostream>\n#include <algorithm>\nusing namespace std;\nint main() {\n\
  \    int i;\n    int a[] = {3, 6, 10, 12, 4, 2};\n    sort(a, a+6);\n    for (i\
  \ = 0; i <= sizeof(a) / sizeof(a[0]) - 1; i++) {\n        cout << a[i] << \"  \"\
  ; // 它显示：2 3 4 6 10 12\n    }\n    return 0;\n}\n```\n`sort()` 函数定义在 `algorithm`\
  \ 库中。它在 C++ 中无法直接访问，你需要包含 `algorithm` 库。\n\n#### 计数计数\n`struct.count(key_name)`\n\
  \n此方法返回键 `key_name` 在无 map `struct` 中出现的次数。由于 map 中的所有键都是唯一的，此方法只能返回 1（如果键存在）或 0（如果键不存在）。\n\
  \n示例：\n\n![](img/my_exercise_header.png) project_33.7e\n```cpp\n#include <iostream>\n\
  #include <unordered_map>\nusing namespace std;\nint main() {\n    unordered_map<string,\
  \ string> family = {\n        {\"father\", \"John\"},\n        {\"mother\", \"Maria\"\
  },\n        {\"son\", \"George\"},\n        {\"daughter\", \"Helen\"}\n    };\n\
  \    if (family.count(\"father\") == 1) {\n        cout << family[\"father\"] <<\
  \ endl; // 它显示：John\n    }\n    if (family.count(\"grandpa\") == 0) {\n        cout\
  \ << \"No grandpa\" << endl; // 它显示：No grandpa\n    }\n    return 0;\n}\n```\n\n\
