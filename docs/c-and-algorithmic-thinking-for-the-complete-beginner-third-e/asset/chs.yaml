  \ 如何帮助你发现逻辑错误。\n\n### 第三部分\n\n顺序控制结构\n\n## 第 10 章\n\n顺序控制结构简介\n\n### 10.1 什么是顺序控制结构？\n\
  \n顺序控制结构是指逐行执行，即语句按照它们出现的相同顺序顺序执行，而不跳过任何一个。例如，它们可能执行一系列读取或写入操作、算术运算或对变量赋值。\n\n以下程序展示了顺序执行的\
  \ C++ 语句示例。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    double num, result;\n    // Prompt the user to enter value for num\n    cout\
  \ << \"Enter a number: \";\n    cin >> num;\n    // Calculate the square of num\n\
  \    result = num * num;\n    // Display the result on screen\n    cout << \"The\
  \ square of \" << num << \" is \" << result << endl;\n    return 0;\n}\n```\n\n\
  顺序控制结构是在 4.11 节中学到的三个基本控制结构中最简单的。另外两种结构是“选择结构”和“循环结构”。计算机编程中的所有问题都可以仅用这三个结构来解决！\n\
  \n在 C++ 中，你可以使用双斜杠 // 添加注释。注释是给人类读者阅读的。编译器和解释器会忽略它们。\n\n#### 练习题 10.1-1 计算矩形面积\n\
  \n编写一个 C++ 程序，提示用户输入矩形的底和高，然后计算并显示其面积。\n\n解决方案\n\n你可能在学校里学过，可以使用以下公式计算矩形的面积：\n\n\
  面积 = 底 × 高\n\n在 4.6 节中，你学习了创建算法时涉及的三个主要阶段：数据输入、数据处理和结果输出。\n\n在练习中，这三个主要阶段如下：\n\n\
  ►数据输入 – 用户必须输入底和高的值值\n►数据处理 – 程序必须计算矩形的面积\n►结果输出 – 程序必须显示上一个阶段计算出的矩形面积\n\n此问题的解决方案显示在此。\n\
  \n\n\n\n\n![](img/my_exercise_header.png) `project_10.1-1`\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double area, b, h;\n    //Data input - Prompt\
  \ the user to enter values for base and height\n    cout << \"Enter the length of\
  \ base: \";\n    cin >> b;\n    cout << \"Enter the length of height: \";\n    cin\
  \ >> h;\n    //Data processing - Calculate the area of the rectangle\n    area =\
  \ b * h;\n    //Results output - Display the result on user's screen\n    cout <<\
  \ \"The area of the rectangle is \" << area << endl;\n    return 0;\n}\n```\n\n\
  #### 练习 10.1-2 计算圆的面积\n\n编写一个 C++ 程序，用于计算并显示圆的面积。\n\n##### 解决方案\n\n你可以使用以下公式计算圆的面积：\n\
  \n`Area = π · Radius²`\n\n`π` 的值是一个已知常量，大约等于 `3.14159`。因此，用户必须输入的值只有 `Radius` 的值。\n\
  \n在练习中，你在第 4.6 节 中学习的三个主要阶段如下：\n\n►数据输入 – 用户必须输入 `Radius` 的值\n►数据处理 – 程序必须计算圆的面积\n\
  ►结果输出 – 程序必须显示上一个阶段计算出的圆的面积。\n\n该问题的解决方案所示。\n\n![](img/my_exercise_header.png) `project_10.1-2a`\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double area,\
  \ radius;\n    //Data input - Prompt the user to enter a value for radius\n    cout\
  \ << \"Enter the length of radius: \";\n    cin >> radius;\n    //Data processing\
  \ - Calculate the area of the circle\n    area = 3.14159 * radius * radius;\n  \
  \  //Results output - Display the result on user's screen\n    cout << \"The area\
  \ of the circle is \" << area << endl;\n    return 0;\n}\n```\n\n更好的方法是使用常量 `PI`。\n\
  \n![](img/my_exercise_header.png) `project_10.1-2b`\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst double PI = 3.14159;\nint main() {\n    double area,\
  \ radius;\n    //Data input - Prompt the user to enter a value for radius\n    cout\
  \ << \"Enter the length of radius: \";\n    cin >> radius;\n    //Data processing\
  \ - Calculate the area of the circle\n    area = PI * radius * radius;\n    //Results\
