  \ C++ 程序，让用户输入一个长单词并显示其缩写。\n\n## “顺序结构”中的复习\n\n### 复习交叉字游戏\n\n1) 解决以下交叉字游戏。\n\n\
  ![Image](img/review03-01.png)\n\n横向 (Across)\n2) `length()` 方法返回字符串中字符的数量。\n6) 你使用键盘可以输入的任何内容。\n\
  7) C++ 提供了许多。\n8) 这种控制结构指的是语句逐行执行的执行。\n\n竖向 (Down)\n1) 一个空白字符。\n3) 从字符串开头或结尾移除空白字符的过程。\n\
  4) `sin()` 函数返回一个数字的。\n5) `abs()` 函数返回一个数字的。\n\n### 复习题\n\n1) 什么是顺序控制结构？\n2) 顺序控制结构可以执行哪些操作？\n\
  3) 在计算机科学中，“类型转换”（type casting）是什么意思？\n4) 给出一个如何使用整数除法的商和余数的例子。\n5) 什么是函数？\n6) “嵌套函数”是什么意思？\n\
  \n### 第四部分\n\n选择控制结构\n\n## 第 15 章\n\n提问\n\n### 15.1 引言\n\n你目前为止学到的所有都是顺序控制结构，语句按照它们在程序中出现的顺序顺序执行。然而，在实际的\
  \ C++ 编程中，你很少希望语句按顺序执行。很多时候，你希望在一种情况下执行一组语句，而在另一种情况下执行完全不同的另一个语句。\n\n### 15.2 什么是布尔表达式？\n\
  \n假设变量 `x` 包含值 5。这意味着如果你问“x 是否大于 2?”，答案显然是“是”。对于计算机来说，这些问题被称为布尔表达式。例如，如果你写 `x >\
  \ 2`，这就是一个布尔表达式，计算机必须检查表达式 `x > 2` 是否为真或假。\n\n\n\n\n\n![](img/remember.jpg)决策控制结构可以评估一个布尔表达式或一组布尔表达式，然后决定执行哪一个语句块。\n\
  \n### 15.3 如何编写简单的布尔表达式\n\n简单的布尔表达式写形式如下：\n\n`Operand1 Comparison_Operator Operand2`\n\
  \n其中：\n\n- ► `Operand1` 和 `Operand2` 可以是值、变量、常量或数学表达式\n- ► `Comparison_Operator`（比较运算符）可以是表\
  \ 15-1 所示的运算符之一。\n\n| 比较运算符 | 描述 |\n| --- | --- |\n| `==` | 等于（非赋值） |\n| `!=` |\
  \ 不等于 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n表 15-1\
  \ C++ 中的比较运算符\n\n以下是一些布尔表达式的示例：\n\n- ► `x > y`。这个布尔表达式是向计算机提出的一个提问，可以读作“`x` 大于 `y`\
  \ 吗？”\n- ► `x <= y`。这个布尔表达式也是向计算机提出的一个提问，可以读作“`x` 小于或等于 `y` 吗？”\n- ► `x != 3 * y\
  \ + 4`。这可以读作“`x` 不等于表达式 `3 * y + 4` 的结果吗？”\n- ► `s == \"Hello\"`。这可以读作“`s` 等于单词\
  \ 'Hello' 吗？”换句话说，这个提问可以读作“`s` 包含单词 'Hello' 吗？”\n- ► `x == 5`。这可以读作“`x` 等于 5 吗？”\n\
  \n![](img/notice.jpg)初学者在编写 C++ 程序时经常犯的一个非常常见的错误是将赋值运算符与等号运算符混淆。他们经常在想表达 `x == 5`\
  \ 的时候错误地写成 `x = 5`。\n\n#### 练习 15.3-1 填充表格\n\n根据变量 `a`、`b` 和 `c` 的值，在下表中填充“true”（真）或“false”（假）。\n\
  \n| a | b | c | a == 10 | b <= a | c > 3 * a − b |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| 3 | −5 | 7 | | | |\n| 10 | 10 | 21 | | | |\n| −4 | −2 | −9 | | | |\n\
  \n**解答**\n\n前两个布尔表达式非常直观，不需要进一步解释。\n\n关于布尔表达式 `c > 3 * a − b`，请注意 `b` 为负数的情况。例如，在第一行中，`a`\
  \ 等于 3，`b` 等于 -5。表达式 `3 * a - b` 的结果是 `3 * 3 − (−5) = 3 * 3 + 5 = 14`。由于变量 `c` 的内容（第一行中）并不大于\
  \ 14，因此布尔表达式 `c > 3 * a − b` 的结果为 `false`。\n\n经过计算，表格变为：\n\n| a | b | c | a == 10\
  \ | b <= a | c > 3 * a − b |\n| --- | --- | --- | --- | --- | --- |\n| 3 | −5 |\
  \ 7 | false | true | false |\n| 10 | 10 | 21 | true | true | true |\n| −4 | −2 |\
  \ −9 | false | false | true |\n\n### 15.4 逻辑运算符与复杂的布尔表达式\n\n复杂的布尔表达式可以由简单的布尔表达式构建，并写成：\n\
  \n`BE1 Logical_Operator BE2`\n\n其中：\n\n- ► `BE1` 和 `BE2` 可以是任何布尔表达式。\n- ► `Logical_Operator`（逻辑运算符）可以是表\
  \ 15-2 所示的运算符之一。\n\n| 逻辑运算符 | 描述 |\n| --- | --- |\n| `&&` | 与（AND，也称为逻辑与） |\n| `||`\
  \ | 或（OR，也称为逻辑析取） |\n| `!` | 非（NOT，也称为否定或逻辑非） |\n\n表 15-2 C++ 中的逻辑运算符\n\n![](img/notice.jpg)当你将简单的布尔表达式与逻辑运算符结合时，整个布尔表达式被称为“复杂的布尔表达式”。例如，表达式\
  \ `x == 3 && y > 5` 就是一个复杂的布尔表达式。\n\n![](img/notice.jpg)在流程图中，本书使用了通用的 AND、OR 和\
  \ NOT 运算符！\n\n#### 与运算符 ( && )\n\n当你在两个布尔表达式之间使用与（`&&`）运算符（`BE1 && BE2`）时，意味着当两个布尔表达式（BE1\
  \ 和 BE2）都为真时，整个复杂布尔表达式的结果为真。\n\n你可以将这些信息组织在所谓的真值表中。真值表显示了两个或多个布尔表达式所有可能的值组合之间的逻辑操作结果。这里是与（`&&`）运算符的真值表。\n\
  \n| BE1（布尔表达式 1） | BE2（布尔表达式 2） | BE1 && BE2 |\n| --- | --- | --- |\n| false | false\
  \ | false |\n| false | true | false |\n| true | false | false |\n| true | true |\
  \ true |\n\n还是困惑吗？你不应该困惑！这非常简单！让我们来看一个。复杂的布尔表达式\n\n```\nname == \"John\" && age\
  \ > 5\n```\n\n只有当变量 `name` 包含 “John”（不带双引号）且变量 `age` 包含大于 5 的值时才为真。两个布尔表达式都必须为真。如果至少有一个为假（例如变量\
  \ `age` 的值为 3），那么整个复杂的布尔表达式为假。\n\n#### 或运算符 ( || )\n\n当你在两个布尔表达式之间使用或（`||`）运算符（`BE1\
  \ || BE2`）时，意味着当第一个（BE1）或第二个（BE2）布尔表达式为真时（至少一个），整个复杂布尔表达式的结果为真。\n\n这里是或（`||`）运算符的真值表。\n\
  \n| BE1（布尔表达式 1） | BE2（布尔表达式 2） | BE1 || BE2 |\n| --- | --- | --- |\n| false | false\
  \ | false |\n| false | true | true |\n| true | false | true |\n| true | true | true\
  \ |\n\n让我们来看一个示例。复杂的布尔表达式\n\n```\nname == \"John\" || name == \"George\"\n```\n\n\
  当变量 `name` 包含单词 “John” 或 “George”（不带双引号）时为真。至少有一个布尔表达式必须为真。如果两个布尔表达式都为假（例如变量 name\
  \ 包含单词 “Maria”），那么整个复杂表达式为假。\n\n#### 非运算符 ( ! )\n\n当你在布尔表达式前面使用非（`!`）运算符（`!BE`）时，意味着当布尔表达式\
  \ `BE` 为假时，整个复杂表达式的结果为真，反之亦然。\n\n这里是非（`!`）运算符的真值表。\n\n| BE（布尔表达式） | !(BE) |\n| ---\
  \ | --- |\n| false | true |\n| true | false |\n\n例如，复杂表达式\n\n```\n!(age > 5)\n```\n\
  \n当变量 `age` 包含小于或等于 5 的值时为真。例如，如果变量 `age` 的值为 6，那么整个复杂表达式为假。\n\n![](img/notice.jpg)逻辑运算符非（`!`）反转布尔表达式的结果。在\
  \ C++ 中，布尔表达式必须放在括号内。\n\n#### 练习 15.4-1 计算复杂布尔表达式的结果\n\n当变量 `a`、`b`、`c` 和 `d` 分别包含值\
  \ 5、2、7 和 -3 时，计算以下复杂表达式的结果。\n\ni) `(3 * a + b / 4 - c * b / a > 23) && (b != 2)`\n\
  ii) `(a * b - c / 2 + 21 * c / 3) || (a >= 5)`\n\n**解答**\n\n不要害怕！结果很容易找到。你只需要记住与（`&&`）和或（`||`）运算符的规则即可。\n\
  \ni) 与（`&&`）运算符的结果在两个表达式都为真时为真。如果你仔细观察，右侧布尔表达式（`b != 2`）的结果为假。所以，不需要浪费时间计算左侧表达式的结果。最终结果无疑为假。\n\
  ii) 或（`||`）运算符的结果在至少有一个布尔表达式为真时为真。如果你仔细观察，右侧布尔表达式（`a >= 5`）的结果实际上为真。所以，不用计算左侧布尔表达式的结果。最终结果无疑为真。\n\
  \n### 15.5 将布尔表达式的结果赋值给变量\n\n既然布尔表达式实际上返回一个值（真或假），这个值可以直接赋值给变量。例如，语句\n\n```\na =\
  \ x > y;\n```\n\n将真或假值赋值给布尔变量 `a`。它可以读作“如果变量 `x` 的内容大于变量 `y` 的内容，则将真值赋值给变量 `a`；否则，赋值假值。”下一个示例在屏幕上显示值\
  \ 1（真）。\n\n\n\n\n\n![](img/my_exercise_header.png) 项目 _15.5\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int x, y;\n    bool a;\n \
  \   x = 8;\n    y = 5;\n    a = x > y;\n    cout << a << endl;\n    return 0;\n\
  }\n```\n\n![](img/notice.jpg)在 C++ 中，布尔值 `true` 等于整数值 `1`。\n\n### 15.6 逻辑运算符的优先级顺序是什么？\n\
  \n一个复杂的布尔表达式可能会使用多个逻辑运算符，如下所示的表达式：\n\n`x > y || x == 5 && x <= z || !(z == 1)`\n\
  \n因此，一个合理的问题是：“哪个逻辑操作最先执行？”\n\nC++ 中的逻辑运算符遵循与大多数编程语言相同的优先级规则。优先级顺序为：逻辑非（`!`）首先执行，逻辑与（`&&`）接着执行，最后执行逻辑或（`||`）。\n\
  \n| 高优先级 ![Image](img/arrow_up.jpg) | 低优先级 | 逻辑运算符 |\n| --- | --- | --- |\n| `!`\
  \ | | |\n| `&&` | | |\n| `||` | | |\n\n表 15-3 逻辑运算符的优先级顺序\n\n![](img/notice.jpg)你始终可以使用括号来改变默认优先级。\n\
  \n### 练习 15.6-1 填充真值表\n\n根据变量 `a`、`b` 和 `c` 的值，在下表中用“true”或“false”填充表格。\n\n| a |\
  \ b | c | `a > 2 || c > b && c > 2` | `!(a > 2 || c > b && c > 2)` |\n| --- | ---\
  \ | --- | --- | --- |\n| 1 | −5 | 7 | | |\n| 10 | 10 | 3 | | |\n| −4 | −2 | −9 |\
  \ | |\n\n### 答案\n\n若要计算复杂布尔表达式的结果，你可以使用以下图形方法。\n\n对于 `a = 1`，`b = −5`，`c = 7`，最终结果为\
  \ `true`，如所示。\n\n![Image](img/chapter15-01.png)\n\n![](img/notice.jpg)逻辑与（`&&`）操作优先级更高，在逻辑或（`||`）操作之前执行。\n\
  \n对于 `a = 10`，`b = 10`，`c = 3`，最终结果为 `true`，如所示。\n\n![Image](img/chapter15-02.png)\n\
  \n对于 `a = −4`，`b = −2`，`c = −9`，最终结果为 `false`，如所示。\n\n![Image](img/chapter15-03.png)\n\
  \n表格第五列的值可以很容易计算，因为其列标题中的布尔表达式与第四列的表达式几乎相同。唯一的区别是表达式前面的逻辑非（`!`）运算符。因此，第五列的值只需对第四列的结果取反即可！\n\
  \n最终的真值表所示。\n\n| a | b | c | `a > 2 || c > b && c > 2` | `!(a > 2 || c > b && c\
  \ > 2)` |\n| --- | --- | --- | --- | --- |\n| 1 | −5 | 7 | true | false |\n| 10\
  \ | 10 | 3 | true | false |\n| −4 | −2 | −9 | false | true |\n\n### 练习 15.6-2 将英语句子转换为布尔表达式\n\
  \n一位主任要求学生根据年龄举手。他想找到符合条件的学生：\n\ni) 年龄在 9 到 12 岁之间。\nii) 8 岁以下且 11 岁以上。\niii) 8\
  \ 岁、10 岁和 12 岁。\niv) 年龄在 6 到 8 岁之间以及 10 到 12 岁之间。\nv) 既不是 10 岁也不是 12 岁。\n\n### 答案\n\
  \n为了组合所需的布尔表达式，使用了变量 `age`。\n\ni) 句子“年龄在 9 到 12 岁之间”可以用图形化表示，如所示。\n\n![Image](img/chapter15-04.png)\n\
  \n但要注意！在数学中写 `9 ≤ age ≤ 12` 是合法的，但在 C++ 中以下写法是不可能的：\n\n`9 <= age <= 12`\n\n你可以做的是将表达式分成两部分，如所示：\n\
  \n```\nage >= 9 && age <= 12\n```\n\n![](img/notice.jpg)为了确认，你可以对“感兴趣区域”（你指定的数据范围）内部外部的多个值测试此布尔表达式。例如，对于年龄值\
  \ 7、8、13 和 17，该表达式的结果为 false。相反，对于年龄值 9、10、11 和 12，结果为 true。\n\nii) 句子“8 岁以下且 11\
  \ 岁以上”可以用图形化表示，如所示。\n\n![Image](img/chapter15-05.png)\n\n![](img/notice.jpg)注意，你在解\
  \ (i) 中看到的两个圆圈缺失了。这意味着 8 和 11 这两个值不包含在两个感兴趣区域内。\n\n小心处理“8 岁以下且 11 岁以上”这个句子。这是一个陷阱！不要犯写成如下的错误：\n\
  \n```\nage < 8 && age > 11\n```\n\n地球上不存在既同时小于 8 岁又大于 11 岁的人！\n\n陷阱在“and”（和）这个词上。尝试重新表述句子，改为“学生们！如果你小于\
  \ 8 岁或大于 11 岁，请举手”。现在好多了了，正确的布尔表达式变为：\n\n```\nage < 8 || age > 11\n```\n\n![](img/notice.jpg)为了确认，你可以对感兴趣区域内部外部的多个值测试此表达式。例如，对于年龄值\
  \ 8、9、10 和 11，表达式的结果为 false。相反，对于年龄值 6、7、12 和 15，结果为 true。\n\niii) 哎呀！句子“8 岁、10\
  \ 岁和 12 岁”中又有一个关于“and”字的陷阱！显然，下一个布尔表达式是错误的：\n\n```\nage == 8 && age == 10 && age\
  \ == 12\n```\n\n和之前一样，没有任何学生是同时是 8 岁、10 岁和 12 岁的！再次，正确的布尔表达式必须使用逻辑或（`||`）运算符。\n\n\
  ```\nage == 8 || age == 10 || age == 12\n```\n\n![](img/notice.jpg)为了确认，你可以对多个值测试此表达式。例如，对于年龄值\
  \ 7、9、11 和 13，表达式的结果为 false。对于年龄值 8、10 和 12，结果为 true。\n\niv) 句子“年龄在 6 到 8 岁之间以及\
  \ 10 到 12 岁之间”可以用图形化表示，如所示。\n\n![Image](img/chapter15-06.png)\n\n布尔表达式为：\n\n```\n\
  age >= 6 && age <= 8 || age >= 10 && age <= 12\n```\n\n![](img/notice.jpg)为了确认，你可以对感兴趣区域内部外部的多个值测试此表达式。例如，对于年龄值\
  \ 5、9、13 和 16，表达式的结果为 false。对于年龄值 6、7、12 和 15，结果为 true。\n\nv)“既不是 10 岁也不是 12 岁”的布尔表达式可以写为：\n\
  \n```\nage != 10 && age != 12\n```\n\n或者写为：\n\n```\n!(age == 10 || age == 12)\n\
  ```\n\n![](img/notice.jpg)当箭头相互指向时，使用逻辑与运算符（`&&`）。否则，当箭头方向相反时使用逻辑或（`||`）。\n\n![Image](img/chapter15-07.png)\n\
  \n## 15.7 算术、比较和逻辑运算符的优先级顺序是什么？\n\n在许多情况下，表达式可能包含不同类型的运算符，如下所示：\n\n```\na * b +\
  \ 2 > 21 || !(c == 2) && c > 13\n```\n\n在这种情况下，首先执行算术运算，接着执行比较运算，最后执行逻辑运算，如下表所示。\n\
  \n| 高优先级 ![Image](img/arrow_up.jpg) | 低优先级 | 逻辑运算符 |\n| --- | --- | --- |\n| 算术运算符\
  \ | *, /, % | |\n| +, − | | |\n| 比较运算符 | <, <=, >, >=, ==, != | |\n| 逻辑运算符 | ! |\
  \ |\n| && | | |\n| || | | |\n\n表 15-4 算术、比较和逻辑运算符的优先级顺序\n\n## 15.8 如何取反布尔表达式\n\n\
  取反是反转布尔表达式含义的过程。有两种方法取反布尔表达式。\n\n### 方法一\n\n这种方法最简单。只需在原始布尔表达式前面使用一个逻辑非（`!`）运算符，你的取反布尔表达式就准备好了！例如，如果原始布尔表达式为：\n\
  \n```\nx > 5 && y == 3\n```\n\n取反后的表达式变为：\n\n```\n!(x > 5 && y == 3)\n```\n\n![](img/notice.jpg)注意，整个表达式必须在括号内。如果你将表达式写为\
  \ !(x > 5) && y == 3，那是完全错误的。在这种情况下，逻辑非（!`运算符只会取反第一个布尔表达式 x > 5。\n\n### 方法二\n\n\
  这种方法稍微复杂一点，但不难学习。你只需要根据下表取反每个运算符。\n\n| 原始运算符 | 取反运算符 |\n| --- | --- |\n| == | !=\
  \ |\n| != | == |\n| > | <= |\n| < | >= |\n| <= | > |\n| >= | < |\n\n\n\n\n\n| `&&`\
  \ | `||` |\n| `||` | `&&` |\n| `!` | `!` |\n\n![](img/notice.jpg)注意，非 (`!`) 运算符保持不变。\n\
  \n例如，如果原始布尔表达式为\n\n`x > 5 && y == 3`\n\n那么取反后的布尔表达式变为\n\n`x <= 5 || y != 3`\n\n\
  然而，有一个小细节需要注意。如果在复杂的布尔表达式中同时存在 AND (`&&`) 和 OR (`||`) 运算符，那么在取反后的布尔表达式中，使用 OR (`||`)\
  \ 运算符的表达式部分必须被括在括号内，以保持初始的优先级。例如，如果原始布尔表达式为\n\n`x >= 5 && x <= 10 || y == 3`\n\n\
  那么取反后的布尔表达式必须是\n\n`(x < 5 || x > 10) && y != 3`\n\n![](img/notice.jpg)如果你忘记将表达式\
  \ `x < 5 || x > 10` 括括号内，由于 AND (`&&`) 运算符的优先级高于 OR (`||`) 运算符，表达式 `x > 10 && y\
  \ != 3` 将被求值，这显然错误的！\n\n### 练习题 15.8-1 取反布尔表达式\n\n使用两种方法取反以下布尔表达式。\n\ni) `b != 4`\n\
  ii) `a * 3 + 2 > 0`\niii) `!(a == 5 && b >= 7)`\niv) `a == true`\nv) `b > 7 && !(x\
  \ > 4)`\nvi) `a == 4 || b != 2`\n\n#### 答案\n\n#### 第一种方法\n\ni) `!(b != 4)`\nii)\
  \ `!(a * 3 + 2 > 0)`\niii) `!(!(a == 5 && b >= 7))`，或者等价于 `a == 5 && b >= 7`\n\n\
  ![](img/notice.jpg)两次取反等于肯定。也就是说，两个连续的非 (`!`) 运算符会相互抵消。\n\niv) `!(a == true)`\n\
  v) `!(b > 7 && !(x > 4))`\nvi) `!(a == 4 || b != 2)`\n\n#### 第二种方法\n\ni) `b == 4`\n\
  ii) `a * 3 + 2 <= 0`\n\n![](img/notice.jpg)注意，算术运算符不会被“取反”。永远不要用加号 (`+`) 替换为减号 (`−`)\
  \ 运算符！\n\niii) `!(a != 5 || b < 7)`\n\n![](img/notice.jpg)注意，非 (`!`) 运算符保持不变。\n\n\
  iv) `a != true`\nv) `b <= 7 || !(x <= 4)`\nvi) `a != 4 && b == 2`\n\n### 15.9 复习题：判断题\n\
  \n判断每个陈述的对错。\n\n1) 布尔表达式是一个始终结果为两个值之一的表达式。\n2) 布尔表达式包含至少一个逻辑运算符。\n3) 在 C++ 中，表达式\
  \ `x = 5` 用于测试变量 `x` 是否等于 5。\n4) 以下语句不是有效的 C++ 语句。`a = b == c;`\n5) 布尔表达式 `b < 5`\
  \ 用于测试变量 `b` 是否小于或等于 5。\n6) AND (`&&`) 运算符也称为逻辑析取运算符。\n7) OR (`||`) 运算符也称为逻辑取补运算符。\n\
  8) 如果两个布尔表达式都为真，那么它们的逻辑交与操作的结果等于它们逻辑析取操作的结果。\n9) 如果两个布尔表达式的值不同，那么它们的逻辑析取结果一定为真。\n\
  10) 表达式 `c == 3 && d > 7` 被认为一个复杂的布尔表达式。\n11) 当两个操作数（布尔表达式）都为真时，逻辑运算符 OR (`||`)\
  \ 的结果为真。\n12) 当变量 `x` 包含 55 以外的任何值时，布尔表达式 `!(x == 5)` 的结果为真。\n13) 非 (`!`) 运算符在逻辑运算符中优先级最高。\n\
  14) OR (`||`) 运算符在逻辑运算符中优先级最低。\n15) 在布尔表达式 `(x > y || x == 5) && x <= z` 中，AND (`&&`)\
  \ 操作在 OR (`||`) 操作之前执行。\n16) 在布尔表达式 `a * b + c > 21 || c == b / 2` 中，程序首先测试 `c`\
  \ 是否大于 21。\n17) 当老师想找到小于 8 岁且大于 11 岁的学生时，对应的布尔表达式是 `age < 8 && age > 11`。\n18) 布尔表达式\
  \ `x < 0 && x > 100` 对于任何 `x` 的值始终始终为假。\n19) 布尔表达式 `x > 0 || x < 100` 对于任何 `x` 的值始终为真。\n\
  20) 布尔表达式 `x > 5` 等于 `!(x < 5)`。\n21) 布尔表达式 `!(x > 5 && y == 5)` 不等于 `!(x > 5) &&\
  \ y == 5`。\n22) 在威廉·莎士比亚的《哈姆莱特》（第三幕第一场）中，主角说“生存还是毁灭，这是一个问题……”。如果你将此写成布尔表达式 `toBe\
  \ || !toBe`，那么以下代码片段的“莎士比亚”表达式为真：\n```\ntoBe = 1 > 0;\nQuestion = toBe || toBe;\n\
  ```\n23) 布尔表达式 `!(!(x > 5))` 等于 `x > 5`。\n\n### 15.10 复习题：选择\n\n为每个陈述选择正确答案。\n\n\
