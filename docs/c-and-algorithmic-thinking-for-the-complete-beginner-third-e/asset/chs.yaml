  #### 练习 34.1-1 创建一个包含其相邻元素平均值的数组\n\n编写一个 C++ 程序，让用户向数组中输入 100 个正数值。然后，程序必须创建一个包含\
  \ 98 个元素的新数组。该新数组在每个位置上必须包含用户提供的数组中当前位置及后两个位置元素的平均值。\n\n#### 解 Solution\n\n让我们尝试通过一个使用\
  \ 10 个元素的示例来理解这个练习。\n\n![Image](img/chapter34-01.png)\n\n数组 `newArr` 是新创建的数组。在数组\
  \ `newArr` 中，位置 0 的元素是数组 `b` 中当前位置及后两个位置元素的平均值；即 `(5 + 10 + 9) / 3 = 8`。位置 1 的元素是数组\
  \ `b` 中当前位置及后两个位置元素的平均值；即 `(10 + 9 + 2) / 3 = 7`，以此此类推。\n\n该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS_OF_A = 100;\n\
  const int ELEMENTS_OF_NEW = ELEMENTS_OF_A - 2;\nint main() {\n    int i;\n    double\
  \ a[ELEMENTS_OF_A];\n    for (i = 0; i <= ELEMENTS_OF_A - 1; i++) {\n        cin\
  \ >> a[i];\n    }\n    double newArr[ELEMENTS_OF_NEW];\n    for (i = 0; i <= ELEMENTS_OF_NEW\
  \ - 1; i++) {\n        newArr[i] = (a[i] + a[i + 1] + a[i + 2]) / 3;\n    }\n  \
  \  for (i = 0; i <= ELEMENTS_OF_NEW - 1; i++) {\n        cout << newArr[i] << \"\
  \\t\";\n    }\n    return 0;\n}\n```\n\n#### 练习 34.1-2 创建一个具有最大值的数组\n\n编写一个 C++\
  \ 程序，让用户向两个各 20 个元素的数组 `a` 和 `b` 中输入数值。然后，程序必须创建一个包含 20 个元素的新数组 `newArr`。该新数组在每个位置上必须包含数组\
  \ `a` 和 `b` 对应位置的最大值。\n\n#### 解 Solution\n\n\n\n\n这里没有新内容了！你需要两个 `for` 循环来读取数组 `a`\
  \ 和 `b` 的值，一个用于创建数组 `newArr`，另一个用于在屏幕上显示数组 `newArr`。\n\n此处展示了 C++ 程序。\n\n![](img/my_exercise_header.png)\
  \ project_34.1\n\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS\
  \ = 20;\nint main() {\nint i;\n//读取数组 a 和 b\ndouble a[ELEMENTS];\nfor (i = 0; i\
  \ <= ELEMENTS - 1; i++) {\n    cin >> a[i];\n}\ndouble b[ELEMENTS];\nfor (i = 0;\
  \ i <= ELEMENTS - 1; i++) {\n    cin >> b[i];\n}\n//创建数组 newArr\ndouble newArr[ELEMENTS];\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {\n    if (a[i] > b[i]) {\n        newArr[i]\
  \ = a[i];\n    }\n    else {\n        newArr[i] = b[i];\n    }\n}\n//显示数组 newArr\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {\n    cout << newArr[i] << endl;\n}\nreturn\
  \ 0;\n}\n```\n\n#### 练习 34.1-3 合并一维数组\n\n编写一个 C++ 程序，对于两个给定的分别包含 10 和 15 个元素的数组\
  \ `a` 和 `b`，创建一个包含 25 个元素的新数组 `newArr`。这个新数组必须在前 10 个位置上包含数组 `a` 的元素，在接下来的 15 个位置上包含数组\
  \ `b` 的元素。\n\n##### 解决方案\n\n正如接下来的示例所示，数组 `a` 的元素索引位置与 `newArr` 的元素索引位置之间存在直接的一一对应关系。具体而言，数组\
  \ `a` 中位置 0 的元素存储在数组 `newArr` 的位置 0，数组 `a` 中位置 1 的元素存储在数组 `newArr` 的位置 1，依此类推。然而，这种对应关系并不适用于数组\
  \ `b`；它的元素在 `newArr` 中需要移动 10 个位置。\n\n![Image](img/chapter34-02.png)\n\n为了将数组 `a`\
  \ 的值赋值给数组 `newArr`，你可以使用以下代码片段。\n\n```cpp\nfor (i = 0; i <= ELEMENTS_OF_A - 1; i++)\
  \ {newArr[i] = a[i];}\n```\n\n然而，要将数组 `b` 的值赋值给数组 `newArr`，你的代码片段应该略有不同，如下所示：\n\n\
  ```cpp\nfor (i = 0; i <= ELEMENTS_OF_B - 1; i++) {newArr[ELEMENTS_OF_A + i] = b[i];}\n\
  ```\n\n最终 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_34.1-3\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\nint i;\n//创建数组 a 和 b\n\
  int a[] = { 5, 10, 9, 6, 7, -6, 13, 12, 11, 2 };\nint b[] = { -11, 25, 4, 45, 67,\
  \ 87, 34, 23, 33, 55, 13, 15, -4, -2, -22 };\n//计算数组 a, b 和 newArr 的元素个数\nconst\
  \ int ELEMENTS_OF_A = sizeof(a) / sizeof(a[0]);\nconst int ELEMENTS_OF_B = sizeof(b)\
  \ / sizeof(b[0]);\nconst int ELEMENTS_OF_NEW_ARR = ELEMENTS_OF_A + ELEMENTS_OF_B;\n\
  //创建数组 newArr\nint newArr[ELEMENTS_OF_NEW_ARR];\nfor (i = 0; i <= ELEMENTS_OF_A\
  \ - 1; i++) {\n    newArr[i] = a[i];\n}\nfor (i = 0; i <= ELEMENTS_OF_B - 1; i++)\
  \ {\n    newArr[ELEMENTS_OF_A + i] = b[i];\n}\n//显示数组 newArr\nfor (i = 0; i <= ELEMENTS_OF_NEW_ARR\
  \ - 1; i++) {\n    cout << newArr[i] << \"\\t\";\n}\nreturn 0;\n}\n```\n\n#### 练习\
  \ 34.1-4 创建两个数组 —— 分离正值与负值\n\n编写一个 C++ 程序，让用户向数组中输入 100 个数值，然后创建两个新数组 `pos` 和 `neg`。数组\
  \ `pos` 必须包含正值，而数组 `neg` 必须包含负值。值 0（如果有）不应添加到最终的数组 `pos` 或 `neg` 中。\n\n##### 解决方案\n\
  \n让我们通过以下示例来分析这种方法。\n\n![Image](img/chapter34-03.png)\n\n在这个练习中，数组 `ar` 的元素索引位置与数组\
  \ `pos` 和 `neg` 之间不存在一一对应关系。例如，数组 `ar` 中位置 1 的元素并没有存储在数组 `neg` 的位置 1，或者数组 `ar` 中位置\
  \ 2 的元素并没有存储在数组 `pos` 的位置 2。因此，你不能执行以下操作：\n\n```cpp\nfor (i = 0; i <= ELEMENTS -\
  \ 1; i++) {\n    if (ar[i] > 0) {\n        pos[i] = ar[i];\n    }\n    else if (ar[i]\
  \ < 0) {\n        neg[i] = ar[i];\n    }\n}\n```\n\n因为这会导致以下两个数组。\n\n![Image](img/chapter34-04.png)\n\
  \n你在这里需要两个独立的索引变量：用于数组 `pos` 的 `posIndex` 和用于数组 `neg` 的 `negIndex`。这些索引变量必须独立地增加，并且只有当元素被添加到相应的数组时才增加。索引变量\
  \ `posIndex` 只有在元素被添加到数组 `pos` 时才增加，而索引变量 `negIndex` 只有在元素被添加到数组 `neg` 时才增加，如下所示代码片段所示。\n\
  \n```cpp\nposIndex = 0;\nnegIndex = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \    if (ar[i] > 0) {\n        pos[posIndex] = ar[i];\n        posIndex++;\n   \
  \ }\n    else if (ar[i] < 0) {\n        neg[negIndex] = ar[i];\n        negIndex++;\n\
  \    }\n}\n```\n\n这可以等价地写为：\n\n```cpp\nposIndex = 0;\nnegIndex = 0;\nfor (i = 0;\
  \ i <= ELEMENTS - 1; i++) {\n    if (ar[i] > 0) {\n        pos[posIndex++] = ar[i];\n\
  \    }\n    else if (ar[i] < 0) {\n        neg[negIndex++] = ar[i];\n    }\n}\n\
  ```\n\n![](img/notice.jpg) 注意变量 `posIndex` 和 `negIndex` 具有双重角色。当循环迭代时，每个指向新元素放置放置的位置。但当循环结束，变量\
  \ `posIndex` 和 `negIndex` 指向下一个位置。\n\n（注：原文后续部分存在大量重复和逻辑乱码，已根据语意进行了对齐处理）\n\n\n\n\
  \n正如你在第 30.3 节中所学习过的，有三种方法可以用于验证数据输入。你的方法取决于你是否希望显示错误信息，以及你是希望为每种类型的输入错误显示不同的错误信息，还是对任何类型的错误显示通用的错误信息。让我们来看看这三种方法如何适配并应用于数组。\n\
  \n## 第一种方法 – 不带错误信息的数据输入验证\n\n在第 30.3 节中，你学习了如何验证用户输入的单个值而不显示任何错误信息。为了方便起见，这里再次给出通用形式的代码片段。\n\
  \n```cpp\ndo {cout << \"Prompt message\";cin >> input_data;} while (input_data test\
  \ 1 fails || input_data test 2 fails || …);\n```\n\n你还记得它是如何运行的吗？如果用户输入了有效值，执行流将继续继续程序的下一个部分。然而，如果他们输入了无效值，主要目标是反复提示他们，直到他们最终提供一个有效值。\n\
  \n在向数组输入数据时，你可以使用相同的原理。如果你使用 for 循环来遍历数组的所有元素，代码片段如下。\n\n```cpp\nfor (i = 0; i <=\
  \ ELEMENTS - 1; i++) {do {\n\n> cout << \"Prompt message\";\n\n> cin >> input_data;\n\
  \n} while (input_data test 1 fails || input_data test 2 fails || …);input_array[i]\
  \ = input_data;}\n```\n\n如你所示，当执行流退出嵌套的后测试循环结构时，变量 `input_data` 确实包含一个有效值，该值随后赋值给数组\
  \ `input_array` 的一个元素。然而，可以使用简单的方法实现相同的过程，而不使用额外的变量 `input_data`，如下：\n\n```cpp\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {do {\n\n> cout << \"Prompt message\";\n\n>\
  \ cin >> input_array[i];\n\n} while (input_array[i] test 1 fails || input_array[i]\
  \ test 2 fails || … );}\n```\n\n## 第二种方法 – 带通用错误信息的数据输入验证\n\n与之前一样，下一个代码片段取自第 30.3\
  \ 节并适配于数组操作。它验证数据输入并显示通用的错误信息（即对任何类型的输入错误显示相同的错误信息）。\n\n```cpp\nfor (i = 0; i <=\
  \ ELEMENTS - 1; i++) {cout << \"Prompt message\";cin >> input_array[i];while (input_array[i]\
  \ test 1 fails || input_array[i] test 2 fails || … ) {\n\n> cout << \"Error message\"\
  \ << endl;\n\n> cout << \"Prompt message\";\n\n> cin >> input_array[i];\n\n}}\n\
  ```\n\n## 第三种方法 – 带不同错误信息的数据输入验证\n\n再次，下一个代码片段取自第 30.3 节并适配于数组操作。它验证数据输入并为每种类型的输入错误显示不同的错误信息。\n\
  \n```cpp\nfor (i = 0; i <= ELEMENTS - 1; i++) {do {\n\n> cout << \"Prompt message\"\
  ;\n\n> cin >> input_array[i];\n\n> failure = false;\n\n> if (input_array[i] test\
  \ 1 fails) {\n\n> > cout << \"Error message 1\" << endl;\n\n> > failure = true;\n\
  \n> }\n\n> else if (input_array[i] test 2 fails) {\n\n> > cout << \"Error message\
  \ 2\" << endl;\n\n> > failure = true;\n\n> }\n\n> else if (…\n\n> …\n\n> }\n\n}\
  \ while (failure);}\n```\n\n### 练习 34.2-1: 倒序显示奇数\n\n编写一个 C++ 程序，提示用户向数组输入 20 个奇数正整数，然后按照它们提供的顺序的完全相反顺序显示它们。程序必须验证数据输入，防止用户输入非正值、浮点数或偶数。请用三个版本解决此练习：\n\
  \na) 在不显示任何错误信息的情况下验证数据输入。\nb) 验证数据输入并显示通用错误信息。\nc) 验证数据输入并为每种输入错误显示不同的错误信息。\n\n\
  #### 解决方案\n\n这里将介绍你在第 34.2 节中学习的所有种验证数据输入的方法。让我们先在不进行数据验证的情况下解决这个练习。\n\n```cpp\n\
  const int ELEMENTS = 20;\nint main() {\nint i, x;\nint odds[ELEMENTS];\nfor (i =\
  \ 0; i <= ELEMENTS - 1; i++) {\n\n> cout << \"Enter an odd positive integer: \"\
  ;\n\n> cin >> x;\n\n> odds[i] = x;\n\n}\n//倒序显示元素\nfor (i = ELEMENTS - 1; i >= 0;\
  \ i--) {\n\n> cout << odds[i] << \"\\t\";\n\n}\nreturn 0;}\n```\n\n##### 无错误信息的验证\n\
  \n为了在不显示任何错误信息的情况下验证数据输入，请使用第 30.3 节中的第一个方法。将虚线部分替换为以下代码片段。\n\n```cpp\ndo {cout\
  \ << \"Prompt message\";cin >> input_data;} while (input_data test 1 fails || input_data\
  \ test 2 fails || …);\n```\n`input_data` 必须是 `double` 类型。\n\n最终程序变为：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nconst int ELEMENTS = 20;\nint main()\
  \ {\nint i;\ndouble x;\nint odds[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n\ndo {\n\n> cout << \"Enter an odd positive integer: \";\n\n> cin >> x;\n\n\
  } while (x <= 0 || x != (int)x || (int)x % 2 == 0);\n\nodds[i] = (int)x;\n\n}\n\n\
  //倒序显示元素\ncout << odds[i] << \"\\t\";\n}\n```\n这是为了允许用户输入整数或浮点数。\n\n##### 带错误信息的验证\n\
  \n为了验证数据输入并显示通用错误信息，请将虚线部分替换为基于第 30.3 节 第二种方法的代码片段。C++ 程序如下：\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nconst int ELEMENTS = 20;\nint main() {\nint\
  \ i;\ndouble x;\nint odds[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\n\
  > cout << \"Enter an odd positive integer: \";\n\n> cin >> x;\n\nwhile (x <= 0 ||\
