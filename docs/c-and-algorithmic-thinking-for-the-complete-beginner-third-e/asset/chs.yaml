  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n#### 34.5 在数据结构中搜索元素\n\n\
  在计算机科学中，搜索算法是在数据集中查找具有特定特征项的算法。对于数据结构，搜索算法通过遍历数据结构来找到与给定值相等的元素或元素。\n\n在数据结构中进行搜索时，有两种情况：\n\
  \n- 你想在一个可能包含多个相同值的数据结构中搜索给定值。因此，你需要找到所有与给定值相同的元素（或其对应的索引）。\n- 你想在一个每个值都是唯一的的数据结构中搜索给定值。因此，你只需要找到与给定值相同的元素（或其对应的索引），然后停止继续搜索！\n\
  \n最常用的搜索算法是：\n\n- 线性搜索（或顺序搜索）算法\n- 二分查找算法\n\n线性搜索和二分查找算法各有优劣。\n\n##### 练习 34.5-1\
  \ 线性搜索算法 —— 在可能包含多个相同值的一维数组中搜索\n\n编写代码片段，对一维数组进行搜索以找到用户提供的值。假设数组可能包含多个相同值。使用线性搜索算法。\n\
  \n##### 方案\n\n线性（或顺序）搜索算法检查数组的第一个元素是否等于给定值，然后检查第二个元素、第三个，以此此类推，直到数组末尾。由于这种逐个检查元素的过程非常慢，因此线性搜索适用于元素较少的数组。\n\
  \n代码片段所示。它在数组 `haystack` 中查找用户提供的值 `needle`！\n\n```cpp\ncout << \"输入要搜索的值：\";\n\
  cin >> needle;\nfound = false;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i]\
  \ == needle) {\n        cout << needle << \" 位于位置：\" << i << endl;\n        found\
  \ = true;\n    }\n}\nif (!found) {\n    cout << \"未找到!\" << endl;\n}\n```\n\n#####\
