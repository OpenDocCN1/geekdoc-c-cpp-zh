  \ 函数中，和没有赋值给变量 `s`，而是直接计算并返回的。此外，在主代码中，返回值没有赋值给变量，而是直接显示的的。\n\n![](img/remember.jpg)用户定义的函数可以像\
  \ C++ 的内置函数一样调用。\n\n### 36.7 void 函数是如何执行的？\n\n当主代码调用 void 函数时，会执行以下步骤：\n\n1. 主代码语句的执行被中断。\n\
  2. 实际参数列表中的变量值或表达式的结果被传递（赋值）给形式参数列表中的对应参数（变量），执行流跳转到 void 函数定义所在。\n3. void 函数的语句被执行。\n\
  4. 当执行流到达 void 函数的结尾时，执行流从调用函数之前的位置继续执行。\n\n在下一个 C++ 程序中，void 函数 `minimum()` 接受三个参数并显示最低值。\n\
  \n![](img/my_exercise_header.png)\n\n```cpp\ninclude <iostream>\nusing namespace\
  \ std;\nvoid minimum(double val1, double val2, double val3) {\n    double minim;\n\
  \    minim = val1;\n    if (val2 < minim) {\n        minim = val2;\n    }\n    if\
  \ (val3 < minim) {\n        minim = val3;\n    }\n    cout << minim << endl;\n}\n\
  int main() {\n    double a, b, c;\n    cin >> a;\n    cin >> b;\n    cin >> c;\n\
  \    minimum(a, b, c);\n    return 0;\n}\n```\n\n当 C++ 程序开始运行时，第一个执行的语句是 `cin >>\
  \ a`（这被认为是程序的第一条语句）。\n\n下面是一个追踪表，显示了精确的执行流、变量 `a` 和 `b` 的值如何从主代码传递到函数，以及函数如何返回其结果。假设用户输入了值\
  \ 3 和 8。\n\n| 步骤 | 主代码语句 | a | b | maxim |\n| --- | --- | --- | --- | --- |\n| 1\
  \ | `cin >> a` | 3.0 | ? | ? |\n| 2 | `cin >> b` | 3.0 | 8.0 | ? |\n| 3 | `maxim\
  \ = maximum(a, b)` | | | |\n\n当调用函数 `maximum()` 时，主代码语句的执行被中断，变量 `a` 和 `b` 的值被传递（赋值）给形式参数\
  \ `val1` 和 `val2`，执行流跳转到函数定义所在。然后，执行函数的语句。\n\n| 步骤 | 函数 maximum() 语句 | val1 | val2\
  \ | m |\n| --- | --- | --- | --- | --- |\n| 4 | `m = val1` | 3.0 | 8.0 | 3.0 |\n\
  | 5 | `if (val2 > m)` | 值为 true | |\n| 6 | `m = val2` | 3.0 | 8.0 | 8.0 |\n| 7 |\
  \ `return m` | | | |\n\n当执行流到达 `return` 语句时，值 8 从函数返回到主代码（赋值给变量 `maxim`），执行流从调用函数之前的位置继续执行。主代码在屏幕上显示值\
  \ 8。\n\n| 步骤 | 主代码语句 | a | b | maxim |\n| --- | --- | --- | --- | --- |\n| 8 | `cout\
  \ << maxim << endl` | 3.0 | 8.0 | 8.0 |\n\n#### 练习 36.6-1 基础 – 计算两个数之和\n\n执行以下操作：\n\
