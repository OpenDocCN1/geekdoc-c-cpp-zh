  cout << \"Enter the name of a planet: \";cin >> name;      //Initialization of name\n\
  while (to_upper_copy(name) != \"STOP\") {\n    // A statement or block of statements\n\
  \    cout << \"Enter the name of a planet: \";cin >> name;    //Update/alteration\
  \ of name\n}\n```\n\n现在，让我们添加剩余的语句，仍然不进行数据输入验证。请记住，由于 -459.67^o 是温度尺度的下限，你可以使用比此更的值作为变量\
  \ `maximum` 的初始值。\n\n```cpp\nmaximum = -460;mName = \"\";cout << \"Enter the name\
