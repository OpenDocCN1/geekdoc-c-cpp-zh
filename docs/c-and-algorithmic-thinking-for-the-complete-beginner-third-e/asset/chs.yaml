  \n#### 练习 23.3-3 求解线性方程 ax + b = 0\n\n设计一个流程图并编写相应的 C++ 程序，找到并显示线性方程\n\n`ax + b\
  \ = 0` 的根\n\n##### 解决方案\n\n在方程 `ax + b = 0` 中，系数 `a` 和 `b` 是已知的实数，`x` 代表要找到的未知量。因为\
  \ `x` 的幂次是一次，所以方程被分类为一次方程，也称为线性方程。\n\n方程的根是 `x` 的值，该值使方程成立；即等式的左侧 `ax + b` 等于零。\n\
  \n在此练习中，用户必须输入系数 `a` 和 `b` 的值，程序必须找到使 `ax + b` 等于零的 `x` 值。\n\n方程 `ax + b = 0` 在求解\
  \ `x` 时变为 `x = -b / a`。根据用户输入的数据，可能会出现三种可能的情况：\n\ni) 用户可能对系数 `a` 输入值 0，对系数 `b` 输入非零值。在这种情况下，`x\
  \ = -b / a` 的结果未定义。\n\nii) 用户可能对系数 `a` 和 `b` 都输入值 0。正如你所知，除以零无法执行的。\n\niii) 用户可能输入任何其他数值对。\n\
  \n这三种情况及其结果路径在使用多分支结构表示所示。\n\n![Image](img/chapter23-11.png)\n\n![Image](img/chapter23-12.png)\n\
  \nC++ 程序所示。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    double a, b, x;\n    cout << \"Enter coefficients and b: \" << endl;\n    cin\
  \ >> a >> b;\n    if (a != 0) {\n        x = -b / a;\n        cout << x << endl;\n\
  \    } else if (b != 0) {\n        cout << \"Undefined\" << endl;\n    } else {\n\
  \        cout << \"Indeterminate form\" << endl;\n    }\n    return 0;\n}\n```\n\
  \n#### 练习 23.3-4 求解二次方程 ax² + bx + c = 0\n\n设计一个流程图并编写相应的 C++ 程序，找到并显示二次方程 `ax²\
  \ + bx + c = 0` 的根\n\n##### 解决方案\n\n在方程 `ax² + bx + c = 0` 中，系数 `a`、`b` 和 `c` 是已知的实数，`x`\
  \ 代表要找到的未知量。因为 `x` 的幂次是二次，所以方程被分类为二次方程，也称为二次方程。\n\n方程的根是 `x` 的值，该值使方程成立；即等式的左侧 `ax²\
  \ + bx + c` 等于零。\n\n在此练习中，用户必须输入系数 `a`、`b` 和 `c` 的值，程序必须找到使 `ax² + bx + c` 等于零的\
  \ `x` 值。\n\n这个问题根据系数 `a` 的值分为两个独立的子问题。\n\ni) 如果系数 `a` 不等于零，可以使用判别式 `D` 找到方程的根。请注意，下所示的练习解决方案在\
  \ `D < 0` 时没有找到复根；这出了本书的范围。\n\nii) 如果系数 `a` 等于零，方程变为线性方程 `bx + c = 0`，其解决方案在上一个练习中提供（练习\
  \ 23.3-3）。\n\n所有必要的路径所示。\n\n![Image](img/chapter23-13.png)\n\n![](img/notice.jpg)右侧路径\
  \ (a = 0) 是线性方程 bx + c = 0 的解决方案。\n\n\n\n\n你可以根据此图设计以下流程图。\n\n![Image](img/chapter23-14.png)\n\
  \n这里是 C++ 程序。\n\n![](img/my_exercise_header.png) project_23.3-4\n```cpp\n#include\
  \ <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    double a,\
  \ b, c, D, x1, x2, x;\n    cout << \"Enter values for coefficients a, b and c: \"\
  \ << endl;\n    cin >> a >> b >> c;\n    if (a != 0) {\n        D = b * b - 4 *\
  \ a * c;\n        if (D >= 0) {\n            if (D > 0) {\n                x1 =\
  \ (-b + sqrt(D)) / (2 * a);\n                x2 = (-b - sqrt(D)) / (2 * a);\n  \
  \              cout << \"Roots: \" << x1 << \", \" << x2 << endl;\n            }\n\
  \            else {\n                x = -b / (2 * a);\n                cout <<\
  \ \"One double root: \" << x << endl;\n            }\n        }\n        else {\n\
  \            cout << \"Complex Roots\" << endl;\n        }\n    } else {\n     \
  \   if (b != 0) {\n            x = -c / b;\n            cout << \"Root: \" << x\
  \ << endl;\n        }\n        else if (c != 0) {\n            cout << \"Undefined\"\
  \ << endl;\n        }\n        else {\n            cout << \"Indeterminate form\"\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 23.4 连续值范围的练习\n\n正如你所所的，在许多问题中，变量的值或表达式的结果可以决定必须执行哪条语句或语句块。在接下来的练习中，你将学习如何测试一个值或表达式的结果是否属于特定的值范围（来自一系列连续的值范围）。\n\
  \n假设你想显示一条消息，表示女性在不同温度下可能穿的衣服类型。\n\n| 室外温度（华氏度） | 女性可能穿的衣服类型 |\n| --- | --- |\n\
  | 温度 < 45 | 毛衣、外套、牛仔裤、衬衫、鞋子 |\n| 45 ≤ 温度 < 65 | 毛衣、牛仔裤、夹克、鞋子 |\n| 65 ≤ 温度 < 75 |\
  \ 七分裤、短裤、T 恤、背心、人字拖、运动鞋 |\n| 75 ≤ 温度 | 短裤、T 恤、背心、短裙、连衣裙、人字拖 |\n\n乍一看，单分支决策结构似乎是逻辑上的合理选择。虽然不是错误的，但更深入的分析显示，每个条件都是相互依赖的，这意味着当其中一个评估为真时，其他条件都不应被评估。你只需要从一组可能性中选择一个替代方案。\n\
  \n要解决这类练习，你可以使用多分支决策结构或嵌套决策控制结构。然而，前者是最好的选择，因为它更方便并增加了可读性，正如接下来的代码片段所示。\n\n```cpp\n\
  if (temperature < 45)cout << \"Sweater, coat, jeans, shirt, shoes\" << endl;else\
  \ if (temperature >= 45 && temperature < 65)cout << \"Sweater, jeans, jacket, shoes\"\
  \ << endl;else if (temperature >= 65 && temperature < 75)cout << \"Capris, shorts,\
  \ t-shirt, tank top, flip flops, athletic shoes\" << endl;else if (temperature >=\
  \ 75)cout << \"Shorts, t-shirt, tank top, skort, skirt, flip flops\" << endl;\n\
  ```\n\n然而，仔细检查后发现，所有下划线的布尔表达式实际上并不是必需的。例如，如果第一个布尔表达式 `temperature < 45` 评估为假，执行流将继续评估第二个布尔表达式。然而在这一步中，由于第一个布尔表达式已经评估为假，变量\
  \ `temperature` 显然大于或等于 45。因此，布尔表达式 `temperature >= 45` 在评估时显然为真，因此可以省略。同样的逻辑适用于所有情况；你可以省略所有下划线的布尔表达式。最终代码片段所示，已移除了所有不必要的评估。\n\
  \n```cpp\nif (temperature < 45)cout << \"Sweater, coat, jeans, shirt, shoes\" <<\
  \ endl;else if (temperature < 65)cout << \"Sweater, jeans, jacket, shoes\" << endl;else\
  \ if (temperature < 75)cout << \"Capris, shorts, t-shirt, tank top, flip flops,\
  \ athletic shoes\" << endl;elsecout << \"Shorts, t-shirt, tank top, skort, skirt,\
  \ flip flops\" << endl;\n```\n\n#### 练习 23.4-1 计算折扣\n\n客户根据其订单的总金额获得折扣。如果订单总金额小于\
  \ $30，则不给予折扣。如果总金额大于或等于 $30 且小于 $70，则应用 5% 的折扣。如果总金额大于或等于 $70 且小于 $150，则应用 10% 的折扣。如果总金额为\
  \ $150 或更多，客户将获得 20% 的折扣。编写一个 C++ 程序，提示用户输入订单总金额，计算并显示所应用的折扣率、美元金额的折扣以及折扣后的最终金额。假设用户输入的金额是非负值。\n\
  \n解决方案\n\n下表总结了提供的各种折扣。\n\n| 范围 | 折扣 |\n| --- | --- |\n| amount < $30 | 0% |\n|\
  \ $30 ≤ amount < $70 | 5% |\n| $70 ≤ amount < $150 | 10% |\n| $150 ≤ amount | 20%\
  \ |\n\n该 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_23.4-1a\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    double amount, discountAmount,\
  \ finalAmount, discount = 0;\n    cout << \"Enter total amount: \";\n    cin >>\
  \ amount;\n    if (amount < 30) {\n        discount = 0;\n    }else if (amount >=\
  \ 30 && amount < 70) {\n        discount = 5;\n    }else if (amount >= 70 && amount\
