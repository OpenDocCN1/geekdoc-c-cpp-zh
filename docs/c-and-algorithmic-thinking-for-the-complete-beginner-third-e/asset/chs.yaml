  \n注意：在 `OOP` 中，你可以使用同一个类作为模板来创建（实例化）很多对象！\n\n### 39.2 C++ 中的类和对象\n\n现在你已经掌握了类和对象的理论概念，让我们深入到\
  \ C++ 中编写一个类。下面的代码片段创建了 `Car` 类。类中四个四个字段和三个方法。\n\n```cpp\nclass Car {\npublic:\n\
  \    // 定义四个字段\n    string brand = \"\";\n    string model = \"\";\n    string color\
  \ = \"\";\n    string licensePlate = \"\";\n    // 定义 turnOn()\n    void turnOn()\
