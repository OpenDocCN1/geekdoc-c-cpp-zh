  \ 1、3 和 5 的列）。\n\n#### 答案\n\n接下来是该 C++ 程序。\n\n![](img/my_exercise_header.png) project_32.4-2\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nconst int ROWS = 5;\nconst int\
  \ COLUMNS = 7;\nint main() {\n    int i, j;\n    double a[ROWS][COLUMNS];\n    for\
  \ (i = 0; i <= ROWS - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n\
  \            cout << \"Enter a value for element \" << i << \", \" << j << \": \"\
  ;\n            cin >> a[i][j];\n        }\n    }\n    // 遍历列\n    for (j = 1; j\
  \ <= COLUMNS - 1; j += 2) { // 从 1 开始并步增 2\n        for (i = 0; i <= ROWS - 1; i++)\
  \ {\n            cout << a[i][j] << \"  \";\n        }\n    }\n    return 0;\n}\n\
  ```\n\n![](img/notice.jpg) 本书尽可能尽可能使用变量 `i` 作为行索引，变量 `j` 作为列索引。当然，你也可以使用其他变量名，例如\
  \ `row`、`r` 表示行索引，或者 `column`、`c` 表示列索引，但 `i` 和 `j` 被大多数程序员广泛使用。在使用一段时间后，你的大脑会将\
  \ `i` 与行联系起来，将 `j` 与列联系起来。因此，使用这些变量名作为二维数组索引的算法或程序将更容易被理解。\n\n### 32.5 变量 i 和 j\
  \ 有什么故事？\n\n许多程序员认为名字 `i` 代表“index（索引）”，而使用 `j` 仅仅因为它排在 `i` 之后。另一些人认为名字 `i` 代表“integer（整数）”。事实可能于两者之间。\n\
  \n在计算机出现以前，数学家就已经使用 `i`、`j` 和 `k` 来表示数学中的整数。后来，在最早的高级计算机语言之一 `FORTRAN` 中，变量 `i`、`j`、`k`、`l`、`m`\
  \ 和 `n` 默认都是整数。因此，第一批程序员养成了在程序中使用变量 `i` 和 `j` 的习惯，这成为了大多数计算机语言的惯例。\n\n### 32.6 方矩阵\n\
  \n在数学中，行数和列数相同的矩阵称为方矩阵。以下是方矩阵的一些示例。\n\n.![Image](img/chapter32-06.png)\n\n.![Image](img/chapter32-07.png)\n\
  \n#### 练习 32.6-1 寻找主对角线元素之和\n\n编写一个 C++ 程序，让用户在 10 × 10 数组中输入数值，然后显示主对角线元素之和。\n\n\
  #### 答案\n\n在数学中，方矩阵的对角线是从左上角到右下角的元素集合。以下是用深色背景显示的示例。\n\n.![Image](img/chapter32-08.png)\n\
  \n.![Image](img/chapter32-09.png)\n\n![](img/notice.jpg) 注意主对角线上的行索引等于列索引。让我们学习这两种方法。\n\
  \n##### 方法一——遍历行\n\n在这种方法中，程序遍历行并检查行索引是否等于列索引。对于这种情况，数组是 $N \\times N$ 的，行数和列数相等。解决方案如下。\n\
  \n![](img/my_exercise_header.png) project_32.6-1a\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int N = 10;\nint main() {\n    int i, j;\n    double\
  \ a[N][N];\n    for (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <= N - 1;\
  \ j++) {\n            cin >> a[i][j];\n        }\n    }\n    double total = 0;\n\
  \    for (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n  \
  \          if (i == j) {\n                total += a[i][j];\n            }\n   \
  \     }\n    }\n    cout << \"Sum = \" << total << endl;\n    return 0;\n}\n```\n\
  \n##### 方法二——直接遍历主对角线\n\n这种方法比第一种高效得多，因为 for 循环执行的迭代次数仅为 10 次。\n\n![](img/my_exercise_header.png)\
  \ project_32.6-1b\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
  \ N = 10;\nint main() {\n    int i, j, k;\n    double a[N][N];\n    for (i = 0;\
  \ i <= N - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n            cin >>\
  \ a[i][j];\n        }\n    }\n    double total = 0;\n    for (k = 0; k <= N - 1;\
  \ k++) {\n        total += a[k][k];\n    }\n    cout << \"Sum = \" << total << endl;\n\
  \    return 0;\n}\n```\n\n### 练习 32.6-2 寻找副对角线元素之和\n\n编写一个 C++ 程序，让用户在 5 × 5 数组中输入数值，然后计算副对角线元素之和。\n\
  \n#### 答案\n\n在数学中，方矩阵的副对角线是从右上角到左下角的元素集合。接下来，你可以找到一个用深色背景高显示的 5 × 5 方矩阵示例。\n\n$N\
  \ \\times N$ 数组中副对角线上的索引满足以下方程：\n\n$i + j = N - 1$\n\n其中变量 $i$ 和 $j$ 分别对应行索引和列索引。解出\
  \ $j$，方程变为：\n\n$j = N - i - 1$\n\n使用这个公式，你可以计算副对角线上任意元素的索引；即对于变量 $i$ 的任意值，你都可以找到对应的变量\
  \ $j$ 值。例如，在之前的 5 × 5 方数组中，$N$ 等于 5，当 $i$ 为 3 时，变量 $j$ 的值为：\n\n$j = N - i - 1 \\\
  iff j = 5 - 3 - 1 \\iff j = 1$\n\n利用所有这些知识，现在编写对应的 C++ 程序。\n\n![](img/my_exercise_header.png)\
  \ project_32.6-2\n```cpp\n#include <iostream>\nusing namespace std;\nconst int N\
  \ = 5;\nint main() {\n    int i, j;\n    double a[N][N];\n    for (i = 0; i <= N\
  \ - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n            cin >> a[i][j];\n\
  \        }\n    }\n    double total = 0;\n    for (i = 0; i <= N - 1; i++) {\n \
  \       total += a[i][N - i - 1];\n    }\n    cout << \"Sum = \" << total << endl;\n\
  \    return 0;\n}\n```\n\n\n\n\n\n```cpp\nj = N - i - 1;       //等同于：\ntotal +=\
  \ a[i][j];    //total += a[i][N - i - 1];\n}\ncout << \"Sum = \" << total << endl;return\
  \ 0;}\n```\n\n![](img/notice.jpg)\n注意，负责计算反对角线元素之和的 for 循环直接遍历反对角线遍历。\n\n### 练习\
  \ 32.6-3 填充数组\n\n编写一个 C++ 程序，创建并显示以下数组。\n\n![Image](img/chapter32-11.png)\n\n####\
  \ 答案\n\n如你所示，主对角线上的值为 `-1`。你已经知道阶矩阵主对角线元素的共同特征是它们的行索引等于列索引。现在，你还需要找到所有包含值 `10` 的元素之间的共同特征，以及所有包含值\
  \ `20` 的元素之间的另一个共同特征。实际上，这些特征是存在的！任何包含值 `10` 的元素的行索引在任何情况下都大于其对应的列索引，同样，任何包含值 `20`\
  \ 的元素的行索引在任何情况下都小于其对应的列索引。\n\n因此，该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\n\
