  \n## 第 12 章 复杂表达式\n\n### 12.1 编写表达式\n\n在第 7 节中，你学习了算术运算符。在本节中，你将学习如何使用它们。算术运算符遵循相同的优先级，这意味着乘法和除法先于加法执行。`pow()`\
  \ 函数具有双重作用，用于计算幂并转换为 C++。\n\n#### 12.1-1 表示表达式\n\n哪些 C++ 语句正确表示了下列表达式？\n![Image](img/chapter12.png)\n\
  \ni) `x = 27 / 10 + z;`\nii) `x = 27 / (10 + z);`\niii) `x = (27 / 10) + z;`\niv)\
  \ `x = 27 / (10 + z)`\nv) `x = 27 / (10 + z) * z;`\nvi) `x = 27 / ((10 + z));`\n\
  vii) `x = 27 / (10 + z) * z;`\nviii) \n\n解答：\ni) 错误。由于乘法和除法在加法之前执行，这等同于 $27/10 +\
  \ z$。\nii) 错误。必须使用括号来进行除法。\niii) 错误。由于除法在加法之前执行，这等同于 $27/10 + z$。\niv) 正确。这等同于 $27/(10+z)$。\n\
  v) 错误。在括号内进行除法。这等同于 $27/(10+z) \\times z$。\nvi) 正确。这等同于 $27/(10+z)$。\nvii) 正确。除法先于乘法执行（从左到右）。该项先计算，然后乘以\
  \ 27。\nviii) 错误。\n\n#### 12.1-2 编写表达式\n\n编写一个 C++ 程序计算表达式：\n![Image](img/chapter12.png)\n\
  \n解答：首先，你必须区分数据输入和输出结果。显然，输出结果赋值给 `y`，用户必须输入 `x` 和 `z`。该练习的解答所示：\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double x, y, z;\n    cin >>\
  \ x >> z;\n    y = 10 * x - (10 - z) / 4;\n    cout << \"The result is: \" << y\
  \ << endl;\n    return 0;\n}\n```\n\n#### 12.1-3 编写复杂表达式\n\n编写一个 C++ 程序计算表达式：\n\
  ![Image](img/chapter12-02.png)\n\n假设用户只输入正值 $x$、$w$ 和 $z$。\n\n解答：哎！现在表达式更复杂了！事实上，它复杂得多！所以，让我们来看一种完全不同的方法。主要思想是将复杂表达式分解为更小、更简单的表达式并将每个子结果赋值给临时变量。这种方法如下：\n\
  \n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\nint main()\
  \ {\n    double denominator, nominator, temp1, temp2, temp3, w, x, y, z;\n    cin\
  \ >> x >> w >> z;\n    temp1 = 3 * x * x + 5 * x + 2;\n    temp2 = 7 * w + 1 / z;\n\
  \    temp3 = (3 + x) / 7;\n    nominator = 5 * temp1 / temp2 + z;\n    denominator\
  \ = 4 * temp3;\n    y = nominator / denominator;\n    cout << \"The result is: \"\
  \ << y << endl;\n    return 0;\n}\n```\n\n\n\n\n你可能会说：“好吧，但我浪费了这么多变量，而且大家所知，每个变量都是主内存的一部分。我如何才能用单行编写原始表达式并浪费更少的内存呢？”\n\
  \n这项工作对于高级程序员来说可能小菜一碟，但对你呢？对一个新手程序员呢？\n\n下一个方法将帮助你编写即使是最复杂的数学表达式而不出现任何语法或逻辑错误！规则非常简单：“在将复杂表达式分解为更小、更简单的表达式并将每个子结果赋值给临时变量后，从后往前，将每个变量替换为其赋值的表达式。但要注意！当你用赋值的表达式替换变量时，必须始终将该表达式用括号括起来！”\n\
  \n困惑了吗？别担心！操作起来更简单。让我们尝试重写之前的 C++ 程序。从后往前，将变量 `nominator` 和 `denominator` 替换为它们赋值的表达式。结果是\n\
  \n![Image](img/chapter12-11.png)\n\n![](img/notice.jpg)注意额外的括号。\n\n现在你必须将变量 `temp1`、`temp2`\
  \ 和 `temp3` 替换为它们赋值的表达式，单行表达式就完成了！\n\n![Image](img/chapter12-12.png)\n\n最后看起来可能很吓，但并没有那么困难，对吧？\n\
  \nC++ 程序现在可以重写为\n\n![](img/my_exercise_header.png) \n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double w, x, y, z;\n    cin >> x >> w >>\
  \ z;\n    y = (5 * (3 * x * x + 5 * x + 2) / (7 * w + 1 / z) + z) / (4 * ((3 + x)\
  \ / 7));\n    cout << \"The result is: \" << y << endl;\n    return 0;\n}\n```\n\
