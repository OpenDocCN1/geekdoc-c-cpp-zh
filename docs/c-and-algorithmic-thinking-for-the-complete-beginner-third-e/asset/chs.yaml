  \    } else if (os == \"Android\") {\n        cout << \"Google\" << endl;\n    }\n\
  \    return 0;\n}\n```\n\n## 第 23 章 决策控制结构进阶\n\n### 23.1 决策控制结构的简单练习\n\n#### 练习\
  \ 23.1-1 是整数吗？\n\n编写一个 C++ 程序，提示用户输入一个数字，然后显示消息，指示该数字的数据类型是整数还是实数。\n\n##### 解决方案\n\
  \n众所周知，当一个数字不包含小数部分时，被视为整数。在 C++ 中，你可以使用 `(int)` 运算符来获取任何实数的整数部分。如果用户提供的数字等于它的整数部分，则该数字被视为整数。\n\
  \n例如，如果用户输入数字 7，该数字和它的整数部分 `(int)(7)` 是相等的。\n\n相反，如果用户输入数字 7.3，该数字和它的整数部分 `(int)(7.3)`\
  \ 是相等的。\n\n该 C++ 程序如下。\n\n![](img/my_exercise_header.png) 项目 23.1-1\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double x;\n    cout << \"\
  Enter a number: \";\n    cin >> x;\n    if (x == (int)x) {\n        cout << x <<\
  \ \" is integer\" << endl;\n    } else {\n        cout << x << \" is real\" << endl;\n\
  \    }\n    return 0;\n}\n```\n\n![](img/notice.jpg) 变量 `x` 声明为 `double`。这是为了允许用户输入整数或实数的必要。\n\
  \n#### 练习 23.1-2 验证数据输入并寻找奇偶数\n\n设计一个流程图并编写相应的 C++ 程序，提示用户输入一个非负整数，然后显示消息，指示该数是否为偶数；否则必须显示“Odd”（奇数）。此外，如果用户输入负值或浮点数，必须显示错误消息。\n\
