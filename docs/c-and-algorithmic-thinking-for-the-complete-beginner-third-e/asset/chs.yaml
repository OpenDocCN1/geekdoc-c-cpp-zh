  b) 序列\nc) 循环\nd) 以上都是控制结构。\n\n9) 下列哪个 C++ 语句包含语法错误？\na) `cout << \"Hello Poseidon\"\
  )`\nb) `cout << \"It's me! I contain a syntax error!!!\" << endl;`\nc) `cout <<\
  \ \"Hello Athena\" << endl;`\nd) 以上都不是\n\n10) 下列哪个 `cout` 语句实际上被执行了？\na) `cout <<\
  \ \"Hello Apollo << endl;`\nb) `/* cout << \"Hello Artemis\" << endl; */`\nc) `//This\
  \ will be executed// // cout << \"Hello Ares\" << endl;`\nd) `/* This will be executed\
  \ */ cout << \"Hello Aphrodite\" << endl;`\ne) 以上都不是\n\n# 第 5 章：变量与常量\n\n## 5.1\
  \ 什么是变量？\n\n在计算机科学中，变量是计算机主内存（RAM）中的一个位置，程序可以在其中存储一个值并在程序执行时更改它。\n\n将变量想象成一个透明的盒子，你一次可以向其中放入并保持一个物体。因为盒子是透明的，你还能看到里面装了什么。此外，如果你有两个或多个盒子，你可以给每个盒子起一个唯一的名称。例如，你可以三个盒子，每个盒子包含一个不同的数字，并将盒子命名为\
  \ `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter05-01.png)\n\n示例中命名为 `numberA`、`numberB`\
  \ 和 `numberC` 的盒子分别包含数字 13、8 和 4。当然，你可以随时检查甚至修改这些盒子中任何一个所包含的值。\n\n现在，假设有人让你找到前两个盒子的值的和，然后将结果存储在最后一个盒子中。你必须遵循的步骤是：\n\
  \n1) 查看前两个盒子，并检查它们包含的值。\n2) 使用你的 `CPU`（这是你的大脑）计算总和（结果）。\n3) 将结果（值为 21）插入最后一个盒子中。然而，由于每个盒子一次只能包含一个单一值，值\
  \ 4 实际上被数字 21 替换了。\n\n盒子现在看起来这样。\n\n![Image](img/chapter05-02.png)\n\n在流程图中，在变量中存储值的动作由左箭头表示。\n\
  \n![Image](img/chapter05-03.png)\n\n该动作通常表示为“给变量赋值一个值，或表达式的结果”。左箭头被称为赋值运算符。\n\n\
  ![](img/notice.jpg) 注意，这个箭头始终指向左侧。你不允许使用右箭头。此外，在箭头的左侧必须存在一个单一变量。\n\n在真实的计算机科学中，这三个盒子实际上是主内存（RAM）中的三个独立区域，命名为\
  \ `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter05-04.png)\n\n当程序指示 `CPU`\
  \ 执行以下语句时：\n\n```\nnumberC ← numberA + numberB\n```\n\n它遵循与上一个示例相同的三个步骤过程。\n\n1)\
  \ 数字 13 和 8 从命名为 `numberA` 和 `numberB` 的 RAM 区域传输到 `CPU`。（这是第一步，在这一步你检查了前两个盒子中包含的值）。\n\
  2) `CPU` 计算 `13 + 8` 的和。（这是第二步，在这一步你使用你的大脑计算总和或结果）。\n3) 结果 21 从 `CPU` 传输到命名为 `numberC`\
  \ 的 RAM 区域。\n\n## 5.2 什么是常量？\n\n有时，你可能需要一个在程序运行期间不会改变的值。这种值被称为常量。简单来说，常量可以被看作锁定的变量。\n\
  \n常量的名称还可以提高程序的可读性并帮助避免错误。例如，假设你在使用值 3.14159265（但作为常量），如果你拼写错误，会导致错误的结果。但如果给这个值一个名称，编译器就会检测到错误。\n\
  \n在流程图中，我们使用 `=` 号将常量设置为一个值。\n\n![Image](img/chapter05-06.png)\n\n![](img/notice.jpg)\
  \ 本书使用大写字母来区分常量和变量。\n\n考虑一个让用户输入三种产品价格，然后计算并显示产品 20% 增值税（VAT）的算法。图 5-1 显示在使用常量之前的过程。\n\
  \n![Image](img/chapter05-07.png)\n\n图 5-1 未使用常量计算三种产品的 20% VAT\n\n尽管这个算法是完全正确的，但问题是作者使用了三次\
  \ 20% 的税率 `20/100`。如果这是一个真正的计算机程序，`CPU` 将被迫三次计算 `20/100` 的除法结果。\n\n一个更好的解决方案是使用变量，如图\
  \ 5-2 所示。这减少了除法操作的次数，也减少了拼错误的可能性。\n\n![Image](img/chapter05-08.png)\n\n图 5-2 使用变量\
  \ vat 计算三种产品的 20% VAT\n\n这一次，`20/100` 只计算了一次，然后使用其结果计算每种产品的 VAT。但即使现在，该算法（以后可能会变成计算机程序）并不完美；`vat`\
  \ 是一个变量，任何程序员都可能可能意外更改它的值。\n\n理想的解决方案是将变量 `vat` 改为常量 `VAT`，如图 5-3 所示。\n\n![Image](img/chapter05-09.png)\n\
  \n图 5-3 使用常量 VAT 计算三种产品的 20% VAT\n\n![](img/notice.jpg) 注意，当在流程图中声明常量时，使用 `=` 号而不是左箭头。\n\
  \n出于许多原因，最后一个方案是最佳选择。\n\n\n\n\n\n- 任何人（包括程序员本人）都无法通过在程序的任何位置意外编写诸如 `VAT ← 0.60`\
  \ 这样的语句来改变常量 `VAT` 的值。\n- 拼写错误的可能性被降到了最低。\n- 算术运算的数量保持尽可能低。\n- 如果某天财政部长决定将增值税率从\
  \ 20% 提高到 22%，程序员只需要更改一行代码！\n\n### 5.3 存在多少种类型的变量和常量？\n\n在大多数计算机语言中存在许多不同类型的变量和常量。这种多样性的由于每个变量或常量可以持有的数据类型不同。大多数情况下，变量和常量持有以下类型的数据。\n\
  \n- **整数（Integers）**：整数值是不带任何小数部分的正负数，例如 `5`、`100`、`135`、`-25` 和 `-5123`。\n- **实数（Reals）**：实数值是包含小数部分的正负数，例如\
  \ `5.1`、`7.23`、`5.0`、`3.14` 和 `-23.78976`。实数也被称为 `floats`。\n- **布尔值（Booleans）**：布尔变量（或常量）只能持有两个值之一：`true`\
  \ 或 `false`。\n- **字符（Characters）**：字符是一个字母数字值（字母、符号或数字），它通常包含在单引号或双引号中，例如 `\"a\"\
  `、`'c'` 或 `\"@\"`。在计算机科学中，字符序列被称为 `string`。字符串的示例有 `\"Hello Zeus\"`、`\"I am 25 years\
  \ old\"` 或 `\"Peter Loves Jane For Ever\"`。\n\n在 C++ 中，字符串必须包含在双引号中。\n\n### 5.4\
  \ C++ 中变量和常量的命名规则和约定\n\n当你为变量或常量命名时，必须遵循某些规则。\n\n- 变量或常量的名称只能由拉丁字符（英语大写或小写字母）、数字和下划线（`_`组成。对于常量，尽管允许小写字母，但建议只使用大写字母。这种约定有助于视觉上将常量与变量区分开。变量名的示例有\
  \ `firstName`、`lastName1` 和 `age`，而常量名的示例有 `VAT` 和 `COMPUTER_NAME`。\n- 变量和常量名对大小写敏感，这意味着大写和小写字母之间存在明显区别。例如，`myVAR`、`myvar`、`MYVAR`\
  \ 和 `MyVar` 实际上是四个名称。\n- 不允许出现空格。如果变量或常量名包含多个单词，你可以在单词之间使用下划线（`_`），或者将每个单词（第一个除外）大写（驼峰命名法\
  \ Camel Case）。例如，变量名 `student first name` 是错误的。相反，你可以使用 `student_first_name`，或者更好的是\
  \ `studentFirstName`。\n- 有效的变量或常量名可以以字母或下划开头。允许使用数字，但不能放在名称的开头。例如，变量名 `1studentName`\
  \ 写得不对。相反，你可以使用类似 `studentName1` 或 `student1Name`。\n- 变量或常量名不应该是关键字。\n\n### 5.5\
  \ “声明变量”这句话意味着什么？\n\n声明（Declaration）为变量预留部分内存（RAM）的过程。在许多语言中，你必须指定类型，以便编译器知道需要预留多大的空间。\n\
  \n| 声明语句 | 高层语言 |\n| :--- | :--- |\n| `Dim sum As Integer` | Visual Basic |\n| `int\
  \ sum;` | C++, Java |\n| `sum: Integer` | Pascal |\n| `var sum;` | Javascript |\n\
  \n### 5.6 如何在 C++ 中声明变量\n\nC++ 是一种强类型语言。这意味着每个变量都必须与特定的数据类型相关。在 C++ 中，某些类型包括：\n\n\
  - `bool`：只能持有两个值：`true` 或 `false`。\n- `unsigned short`：可以持有 `0` 到 `65535` 之间的无符号整数。\n\
  - `short`：可以持有 `-32768` 到 `32767` 之间的有符号整数。\n- `unsigned int`：可以持有 `0` 到 `2³² -\
  \ 1` 之间的无符号整数。\n- `int`：可以持有 `-2³¹` 到 `2³¹ - 1` 之间的有符号整数。\n- `float`：可以持有单精度有符号实数。\n\
  - `double`：可以持有双精度有符号实数。\n- `char`：可以持有单个字符或 `-128` 到 `127` 之间的有符号整数。\n\n在许多语言中，还有一种称为\
  \ `string` 的类型，它可以持有字符序列。在 C++ 中，字符串的声明方式与基本类型相同，但处理方式不同。\n\n要声明变量，C++ 语句的一般形式为：\n\
  \n```cpp\ntype name [ = value];\n```\n\n其中：\n- `type` 可以是 `bool`、`short`、`int`、`string`\
  \ 等。\n- `name` 是有效的变量名，遵循小驼峰命名法（Lower Camel Case）。\n- `value` 是可选的。如果提供，它可以是任何有效的初始值。\n\
  \nC++ 变量声明的示例：\n\n```cpp\nint number1;\nbool found;\nstring firstName;\nstring studentName;\n\
  ```\n\n声明并直接赋值的示例：\n\n```cpp\nint num = 5;\nstring name = \"Hera\";\nchar favoriteCharacter\
  \ = 'w';\n```\n\n这些等同于：\n\n```cpp\nint num;\nstring name;\nchar favoriteCharacter;\n\
  num = 5;\nname = \"Hera\";\nfavoriteCharacter = 'w';\n```\n\n\n\n\n最后，你还可以通过逗号分隔在同一行内声明多个相同类型的变量。\n\
  \n```cpp\nint a, b;double x, y, z;unsigned int w = 3, u = 2;\n```\n\n### 5.7 如何在\
  \ C++ 中声明常量\n\n你可以使用 `const` 关键字在 C++ 中声明常量。语句的一般形式如下。\n\n```cpp\nconst type NAME\
  \ = value;\n```\n\n其中\n\n- `type` 可以是 `bool`、`short`、`int`、`string` 等。\n- `NAME`\
  \ 是一个有效的常量名。它应该遵循第 5.4 节中提出的所有常量命名规则和惯例。\n- `value` 是任何有效值。\n\n以下示例了如何在 C++ 中声明了一些常量。\n\
  \n```cpp\nconst double VAT = 0.22;const int NUMBER_OF_PLAYERS = 25;const string\
  \ COMPUTER_NAME = \"pc01\";const string FAVORITE_SONG = \"We are the world\";const\
  \ char FAVORITE_CHARACTER = 'w';\n```\n\n![](img/notice.jpg)注意，在 C++ 中，你使用双引号（`\"\
  \ \"`）声明 `string` 类型的常量，但使用单引号（`' `）声明 `char` 类型的常量。\n\n![](img/remember.jpg)一旦定义了常量，它的值在程序运行时无法更改。\n\
  \n![](img/remember.jpg)C++ 要求所有语句必须以分号（`;`）结束。\n\n![](img/remember.jpg)虽然常量名可以包含小写字母，但建议只使用大写字母。这有助于你在视觉上将常量与变量区分开来。\n\
  \n### 5.8 复习题：判断对错\n\n对以下每个语句选择对或错。\n\n1) 变量是计算机辅助存储设备中的一个位置。\n2) 在流程图中，对于赋值运算符，你可以使用左箭头或右箭头。\n\
  3) 变量的内容在程序执行期间可以改变。\n4) 常量的内容在程序执行期间可以改变。\n5) 值 `10.0` 是整数。\n6) 布尔变量只能持有两个值中的之一。\n\
  7) 双引号括起来的值 `\"10.0\"` 是一个实值。\n8) 在计算机科学中，string（字符串）是你可以穿的衣服！\n9) 变量名可以包含数字。\n\
  10) 变量可以在程序执行期间改变其名称。\n11) 变量名不能是数字。\n12) 常量名必须始终是描述性的。\n13) 名字 `student name` 不是一个有效的变量名。\n\
  14) 名字 `STUDENT_NAME` 是一个有效的常量名。\n15) 在 C++ 中，常量名可以包含大小写字母。\n16) 在 C++ 中，你需要在使用变量之前它。\n\
  17) 在 C++ 程序中，你必须至少使用一个常量。\n\n### 5.9 复习题：单选择\n\n为以下每个语句选择正确答案。\n\n1) 变量是位于 ___\
  \ 的地方\na) 硬盘。\nb) DVD 光盘。\nc) USB 闪存。\nd) 以上都是\ne) 以上都不是\n\n2) 变量可以持有\na) 一时持有一个值。\n\
  b) 同时持有多个值。\nc) 以上都是\nd) 以上都不是\n\n3) 一般来说，在程序中使用常量\na) 帮助程序员完全避免拼写错误。\nb) 帮助程序员避免使用除法和乘法。\n\
  c) 以上都是\nd) 以上都不是\n\n4) 以下哪项是整数？\na) `5.0`\nb) `-5`\nc) `\"5\"`\nd) 以上都不是整数。\n\n\
  5) 布尔变量可以持有值\na) `one`。\nb) `\"true\"`。\nc) `true`。\nd) 以上都不是\n\n6) 在 C++ 中，字符可以是\n\
  a) 被单引号括起来。\nb) 被双引号括起来。\nc) 以上皆是。\n\n7) 以下哪个不是有效的 C++ 变量？\na) `city_name`\nb) `cityName`\n\
  c) `cityname`\nd) `city-name`\n\n8) 你可以使用 `const` 关键字定义常量。一旦定义了常量，\na) 它永远无法被更改。\n\
  b) 它可以再次使用 `const` 关键字更改。\nc) 以上都不正确。\n\n### 5.10 复习题\n\n完成以下练习题。\n\n1) 将第一列的每个元素与第二列的某个元素匹配。\n\
  \n| 值 | 数据类型 |\n| --- | --- |\n| 1. `\"true\"` | a. Boolean |\n| 2. `123` | b. Real\
  \ |\n| 3. `false` | c. String |\n| 4. `10.0` | d. Integer |\n\n2) 将第一列的每个元素与第二列的某个元素匹配。\n\
  \n| 值 | 数据类型 |\n| --- | --- |\n| 1. 人的名字 | a. Boolean |\n| 2. 人的年龄 | b. Real |\n\
  | 3. 除法 `5.0/2.0` 的结果 | c. Integer |\n| 4. 是黑色的还是白色的？ | d. String |\n\n3) 完成下表\n\
  \n| 值 | 数据类型 | 声明与初始化 |\n| --- | --- | --- |\n| 我朋友的名字 | String | `string name =\
  \ \"Mark\";` |\n| 我的地址 | | `string address = \"254 Lookout Rd. Wilson, NY 27893\"\
  ;` |\n| 每日平均气温 | | |\n| 电话号码 | | `string phoneNumber = \"1-891-764-2410\";` |\n\
  | 我的社会安全号码 (SSN) | | |\n| 汽车的速度 | | |\n| 家庭中孩子的数量 | | |\n\n## 第 6 章：处理输入和输出\n\n\
  ### 6.1 如何向用户输出消息和结果\n\n你可以使用 `cout` 对象在 C++ 中输出消息。语句的一般形式如下。\n\n```cpp\ncout <<\
  \ \"message\";\n```\n\n其中\n\n- `cout` 是标准输出对象。\n- `<<` 是插入运算符。\n- `\"message\"`\
  \ 是要显示的字符串字面量。\n\n以下示例展示了如何输出不同类型：\n\n```cpp\ncout << \"Hello, World!\";\ncout <<\
  \ 25;\ncout << 3.14;\ncout << 'A';\n```\n\n![](img/notice.jpg)注意，在 C++ 中，你使用双引号（`\"\
  \ \"`）声明 `string` 类型的常量，但使用单引号（`' `）声明 `char` 类型的常量。\n\n![](img/remember.jpg)一旦定义了常量，它的值在程序运行时无法更改。\n\
  \n![](img/remember.jpg)C++ 要求所有语句必须以分号（`;`）结束。\n\n![](img/remember.jpg)虽然常量名可以包含小写字母，但建议只使用大写字母。这有助于你在视觉上将常量与变量区分开来。\n\
  \n### 6.2 如何输出特殊字符\n\n要输出换行，你可以使用特殊字符序列 `\\n` 或 `endl` 操符。\n\n```cpp\ncout << \"\
  Line 1\\n\";\ncout << \"Line 2\";\n```\n或者\n```cpp\ncout << \"Line 1\" << endl;\n\
  cout << \"Line 2\" << endl;\n```\n\n要创建一个制表位，使用 `\\t` 序列。\n\n```cpp\ncout << \"\
  Name:\\tAlice\";\ncout << \"Age:\\t25\";\n```\n\n### 6.3 如何提示用户输入数据？\n\n\n\n\n\n\
  你还记得创建算法或计算机程序涉及三个主要阶段吗？第一阶段是“数据输入”阶段，在该阶段，计算机允许用户输入数据，如数字、姓名、地址或出生年份。\n\n流程图使用斜四边形和关键字\
  \ `Read` 让用户输入数据。\n\n![Image](img/chapter06-07.png)\n\n其中 `var_name1`、`var_name2`\
  \ 和 `var_name3` 必须是变量。\n\n你刚刚看到的斜四边形等同于以下流程图片段。\n\n.![Image](img/chapter06-08.png)\n\
  \n![](img/notice.jpg)当执行 `Read` 语句时，执行流会被中断，直到用户输入所有数据。当数据输入完成后，执行流将继续到下一条语句。通常数据是从键盘输入的。\n\
  \n在 C++ 中，数据输入可以使用以下 C++ 语句之一完成。\n\n```cpp\n//从键盘读取数字或字符串（不包含空格或制表符）\ncin >> var_name1\
  \ >> var_name2 >> var_name3 >> …  ;//从键盘读取包含空格和制表符的字符串\ngetline(cin, var_name_str);\n\
  ```\n\n其中\n\n►`var_name1`、`var_name2`、`var_name3`、`…`可以是任何类型的变量。\n►`var_name_str`\
  \ 可以是任何 `string` 变量。\n\n![](img/notice.jpg)在 C++ 中，`>>` 运算符被称为“提取运算符”。\n\n![](img/notice.jpg)注意，当\
  \ `cin` 从键盘读取读取字符串时，它会将空格字符视为终止字符。因此，使用 `cin` 读取字符串意味着始终只读取一个单词，而不是短语或整个句子。要读取两个或多个单词，你应该使用\
  \ `getline()` 函数。\n\n下面的示例允许用户输入姓名，然后带上“Hello”一词将其显示出来。\n\n```cpp\nstring name;\n\
  cin >> name;\ncout << \"Hello \" << name;\n```\n\n当此示例中的 `cin` 语句执行时，执行流停止，等待用户输入姓名。`cout\
  \ << \"Hello \" << name` 语句尚未执行！只要用户不输入任何内容，计算机就会一直等待，如图 6–5 所示。\n\n.![Image](img/chapter06-09.png)\n\
  \n图 6–5 当 `cin` 语句执行时，计算机等待数据输入。\n\n当用户最终输入姓名并按下“Enter ![Image](img/key_enter.png)”键时，执行流将继续到下一条\
  \ `cout` 语句，如图 6–6 所示。\n\n.![Image](img/chapter06-10.png)\n\n图 6–6 当用户按下“Enter ![Image](img/key_enter.png)”键时，执行流继续。\n\
  \n然而，如果在每次数据输入之前显示一条“提示”（prompt）消息，那么之前的示例就可以改进。这使得程序更加用户友好。例如，查看以下代码片段。\n\n```cpp\n\
  string name;\ncout << \"What is your name? \";\ncin >> name;\ncout << \"Hello \"\
  \ << name;\n```\n\n在前面的代码片段中，在 `cin` 语句执行之前，会显示消息“What is your name?”（不带双引号），如图\
  \ 6–7 所示。\n\n.![Image](img/chapter06-11.png)\n\n图 6–7 在 `cin` 语句之前显示“提示”消息。\n\n\
  `cin` 语句也可以用于请求多个值。下面的代码片段允许用户输入姓名和年龄。\n\n```cpp\nstring name;\nint age;\ncin >>\
  \ name >> age;\ncout << \"Wow, you are already\" << age << \"years old,\" << name\
  \ << \"!\";\n```\n\n然而，正如已经所说的，如果在每次数据输入之前显示一条“提示”消息，效果会更好。下面的代码片段提示用户输入姓名和年龄。\n\
  \n```cpp\nstring name;\nint age;\ncout << \"What is your name? \";\ncin >> name;\n\
  cout << \"What is your age? \";\ncin >> age;\ncout << \"Wow, you are already \"\
  \ << age << \" years old, \" << name << \"!\";\n```\n\n对应的流程图片段如下所示。\n\n![Image](img/chapter06-12.png)\n\
  \n下面的代码片段提示用户输入产品名称和价格。\n\n```cpp\nstring productName;\ndouble productPrice;\ncout\
  \ << \"Enter product name: \";\ngetline(cin, productName);\ncout << \"Enter product\
  \ price: \";\ncin >> productPrice;\n```\n\n然而，如果在 `cin` 语句之后使用 `getline()` 函数，就会出现特定问题。由于\
  \ `cin` 会忽略 `\\n` 字符序列（“Enter ![Image](img/key_enter.png)”键）并将其留在输入缓冲区（流）中，随后的 `getline()`\
  \ 函数会遇到该序列并停止读取后续内容。在后续示例中，变量 `productName` 将为空，因为 `getline()` 函数识别到了前面的 `cin` 语句留存在输入缓冲区中的残留\
  \ `\\n` 字符序列。\n\n```cpp\ndouble productPrice;\nstring productName;\ncout << \"Enter\
  \ product price: \";\ncin >> productPrice;\ncout << \"Enter product name: \";\n\
  getline(cin, productName);\ncout << productPrice << \" \" << productName;\n```\n\
  \n![](img/notice.jpg)当用户输入一个值并按下“Enter ![Image](img/key_enter.png)”键时，他们会将该值和 `\\\
  n` 字符序列发送到输入缓冲区（流）。要要这个问题，你需要在使用 `getline()` 函数之前清除输入缓冲区中任何剩余的 `\\n` 字符序列，如下例所示。\n\
  \n```cpp\ndouble productPrice;\nstring productName;\ncout << \"Enter product price:\
  \ \";\ncin >> productPrice;\n//忽略 \\n\ncin.ignore();\ncout << \"Enter product name:\
  \ \";\ngetline(cin, productName);\n```\n\n最后但同样重要的是，在书中，“prompts”（提示）和“lets”（允许）这两个词之间存在区别。当练习说“编写一个提示用户输入的程序……”时，这意味着你必须包含一条提示消息。然而，当练习说“编写一个允许用户输入的程序……”时，这意味着你实际上并不被要求包含它；也就是说，包含它并不是错的！\n\
  \ncin >> name >> age;\n\n在这里发生的情况（当程序执行时）是，计算机显示一个没有任何提示消息的文本光标，并等待用户输入两个值——一个姓名，一个年龄。因此，用户必须像预言者一样猜出该输入什么！他们必须先输入姓名再输入年龄，还是反过来？所以，显然提示消息是是必须的，因为这。\n\
  \n### 6.4 复习题：判断对错\n\n对以下每个陈述判断对或错。\n\n1) 在 C++ 中，`cin` 是一个关键字。\n2) `cout` 语句可以显示消息或变量的内容。\n\
  3) 当执行 `cin` 语句时，执行流会被中断，直到用户输入一个值。\n4) 你不能使用单个 `cin` 语句读取多个数据值。\n5) 在数据输入之前，必须始终显示提示消息。\n\
  \n### 6.5 复习题：单选择\n\n为以下每个陈述选择正确答案。\n\n1) 语句 `cout << hello` 显示\na) 单词“hello”（不带双引号）。\n\
  b) 单词“hello”（带双引号）。\nc) 变量 `hello` 的内容。\nd) 以上都不是\n\n2) 语句 `cout << \"HELLO\"` 显示\n\
  a) 单词“HELLO”（不带双引号）。\nb) 单词“HELLO”（带双引号）。\nc) 常量 `HELLO` 的内容。\nd) 以上都不是\n\n3) 语句\
  \ `cout << \"Hello\\nHermes\"` 显示\na) 消息“Hello Hermes”（不带双引号）。\nb) 第一行显示单词“Hello”，下一行显示单词“Hermes”（不带双引号）。\n\
  c) 消息“HelloHermes”（不带双引号）。\nd) 消息“Hello\\nHermes”（不带双引号）。\ne) 以上都不是\n\n4) 语句 `cin\
  \ >> data1data2`\na) 允许用户输入一个值并赋值给变量 `data1`。变量 `data2` 保持为空。\nb) 允许用户输入一个值并赋值给变量\
  \ `data1data2`。\nc) 允许用户输入两个值并赋值给变量 `data1` 和 `data2`。\nd) 以上都不是\n\n\n\n\n\nC++\
  \ 中最常用的运算符是值赋值运算符（`=`）。例如，下面的 C++ 语句将值 `5` 赋值给变量 `x`。\n\n```cpp\nx = 5;\n```\n\n\
  正如你在第 5 章中读到的，这等同于流程图中使用的左箭头。\n\n.![Image](img/chapter07-01.png)\n\n流程图中使用的左箭头可能比\
  \ (`=`) 符号更方便、更清晰，因为它在视觉上直观地展示了右侧的值或表达式的结果被赋值给左侧的变量。\n\n需要注意的是，(`=`) 符号并不等同于数学中使用的符号。在数学中，表达式\
  \ `x = 5` 读作“x 等于 5”。但在 C++ 中，表达式 `x = 5` 读作“将值 5 赋值给 x”或“将 x 设置为 5”。它们看起来看起来一样，但行为方式完全不同！\n\
  \n例如，在数学中，以下两行是等价的。第一行可以读作“x 等于 y 和 z 之和”，第二行可以读作“y 和 z 之和等于 x”。\n\n```text\nx =\
  \ y + z\ny + z = x\n```\n\n相反，在 C++ 中，以下两个语句绝对是不等价的。\n\n```cpp\nx = y + z;\ny +\
  \ z = x;\n```\n\n第一条语句是一个有效的 C++ 语句，表示“将 y 和 z 之和赋值给 x”。然而，第二条语句是无效的，因为它试图将 `x`\
  \ 的值赋值给 `y + z`，这在 C++ 中是不允许的！\n\n![](img/remember.jpg)在 C++ 中，(`=`) 符号左侧的变量代表主内存（RAM）中的一个区域，该区域可以存储值。\n\
  \n![](img/remember.jpg)(`=`) 符号左侧只能存在单个变量，而右侧可以是数字、变量、字符串，甚至是一个复杂的数学表达式。\n\n在表 7-1\
  \ 中你可以找到一些值赋值的示例。\n\n| 示例 | 描述 |\n| --- | --- |\n| `a = 9;` | 将值 `9` 赋值给变量 `a`。\
  \ |\n| `b = c;` | 将变量 `c` 的内容赋值给变量 `b`。 |\n| `d = \"Hello Zeus\";` | 将字符串 `Hello\
  \ Zeus` 赋值给变量 `d`。 |\n| `d = a + b;` | 计算变量 `a` 和 `b` 内容之和，并将结果赋值给变量 `d`。 |\n| `b\
  \ = x + 1;` | 计算变量 `x` 的内容与 `1` 之和，并将结果赋值给变量 `b`。请注意，变量 `x` 的内容不会被改变。 |\n| `x =\
  \ x + 1;` | 计算变量 `x` 的内容与 `1` 之和，并将结果赋值回变量 `x`。换句话说，将变量 `x` 增加 1。 |\n\n表 7-1 值赋值示例\n\
  \n对最后一个示例感到困惑吗？你现在正在想你的数学老师？如果你在黑板上写下 `x = x + 1`，他们的反应会是什么？你能凭空想象出一个等于自己加 1 的数字吗？这个语句意味着\
  \ `5` 等于 `6`，`10` 等于 `11`，这显然是错误的！\n\n显然，计算机科学中的情况是不同的。语句 `x = x + 1` 是完全有效的！它指示\
  \ CPU 从主内存（RAM）获取变量 `x` 的值，将该值加 `1`，并将结果赋值回变量 `x`。变量 `x` 的旧值会被新值取代。\n\n还是不理解？让我们来看看\
  \ CPU 和主内存（RAM）是如何协作执行语句 `x = x + 1` 的。假设内存中有一个命名为 `x` 的区域，它包含数字 `13`。\n\n![Image](img/chapter07-02.png)\n\
  \n当程序指令 CPU 执行语句时：\n\n```cpp\nx = x + 1;\n```\n\n将执行以下步骤：\n\n► 将数字 `13` 从 RAM 中命名为\
  \ `x` 的区域传输到 CPU；► CPU 计算 `13` 和 `1` 之和；以及► 结果 `14` 从 CPU 传输到 RAM 的 `x` 区域，替换现有的数字\
  \ `13`。\n\n执行后，RAM 看起来像这样。\n\n.![Image](img/chapter07-03.png)\n\n既然你已经理解了一切，让我们深入探讨最后一个细节。在\
  \ C++ 中，你可以用一个语句为多个变量赋值同一个单值。以下语句将值 `4` 赋值给所有变量 `a`、`b` 和 `c`。\n\n```cpp\na = b\
  \ = c = 4;\n```\n\n### 7.2 算术运算符\n\n就像每种高级编程语言一样，C++ 支持几乎所有的算术运算符。\n\n| 算术运算符 |\
  \ 描述 |\n| --- | --- |\n| `+` | 加法 |\n| `−` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n\
  | `%` | 整除后的余数（取模） |\n\n前两个运算符非常直观，不需要进一步解释。\n\n如果你需要乘以两个数字或两个变量的内容，必须使用星号（`*`）符号。例如，如果你想用\
  \ `2` 乘以 `y`，你必须写 `2 * y`。\n\n![](img/notice.jpg)在数学中，跳过乘法运算符并编写 `3x` 是合法的，意味着“3\
  \ 乘以 x”。但在 C++ 中，在任何存在乘法操作的地方，你都必须使用星号。这是初学者程序员常犯的最常见错误之一。要执行除法，必须使用斜杠（`//`）符号。例如，如果你想用\
  \ `10` 除以 `2`，你必须写 `10 / 2`。\n\n然而，重要的是，在 C++ 中，整数除法的结果始终是一个整数。因此，在表达式 `7 / 2` 中，由于\
  \ `7` 和 `2` 都是整数，结果是 `3`（而不是人们预期的 `3.5`）。相比之下，在表达式 `7.0 / 2` 中，至少有一个数字是实数，结果确实是\
  \ `3.5`。\n\n以下三个语句是等价的。它们都输出值 `3.5`。\n\n```cpp\ncout << 7.0 / 2;\ncout << 7 / 2.0;\n\
  cout << 7.0 / 2;\n```\n\n但是，如果你想在除法之前执行乘法，可以使用括号来改变优先级。这意味着\n\n```cpp\ny = 6 / (3\
  \ * 2);\n```\n\n等同于 ![Image](img/chapter07-08.png)，并将值 `1` 赋值给变量 `y`（乘法在除法之前执行）。\n\
  \n模运算符（`%`）返回整数除法的余数，这意味着语句\n\n```cpp\nc = 13 % 3;\n```\n\n将值 `1` 赋值给变量 `c`。\n\n\
  ![](img/notice.jpg)在 C++ 中，模运算符不能用于浮点数。例如，操作 `13.4 % 4` 是无法执行的。\n\n![](img/notice.jpg)记住流程图是表示算法的一种松散方法。虽然流程图允许使用模运算符\
  \ `%`，但此本书使用了广泛接受的 `MOD` 运算符！例如，C++ 语句 `y = 13 % 3` 在流程图中表示为\n\n.![Image](img/chapter07-04.png)\n\
  \n在数学中，正如你可能已经知道的，你可以可以使用括号（圆括号），也可以使用大括号（花括号）和方括号，如下表达式所示。\n\n.![Image](img/chapter07-06.png)\n\
  \n然而，在 C++ 中没有所谓的大括号或方括号。括号是你唯一的工具；因此，相同的表达式必须使用括号代替大括号或方括号。\n\n```cpp\ny = 5.0\
  \ / 2.0 * (3 + 2 * (4 + 7 * (6 – 4.0 / 3.0)));\n```\n\n### 7.3 算术运算符的优先级是什么？\n\n\
  算术运算符遵循与数学相同的优先级规则，这些规则是：先执行乘法和除法，后执行加法和减法。\n\n| 高优先级 ![Image](img/arrow_up.jpg)\
  \ | 低优先级 | 算术运算符 |\n| --- | --- | --- |\n| `*`, `/`, `%` | | |\n| `+`, `−` | | |\n\
  \n当同一个表达式中同时存在乘法和除法时，它们从左到右执行（与阅读方式相同），这意味着表达式\n\n```cpp\ny = 6 / 3 * 2;\n```\n\n\
  等同于 ![Image](img/chapter07-07.png)，并将值 `4` 赋值给变量 `y`（除法在乘法之前执行）。\n\n\n\n\n\n![](img/notice.jpg)请记住，在\
  \ C++ 中无法以 `![Image](img/chapter07-09.png)` 或 `![Image](img/chapter07-10.png)` 的形式书写分数。忘掉它！Visual\
  \ Studio Code 或任何 IDE 中都没有公式编辑器。所有的分数都必须写在单行内。例如，`![Image](img/chapter07-09.png)`\
  \ 必须写为 `6 / 3`，而 `![Image](img/chapter07-10.png)` 必须写为 `(4 * x + 5) / 6`。\n\n运算符优先级可以总结如下：\n\
  \n1) 首先执行括号内的任何操作。 2) 接下来，从左到右执行任何乘法和除法操作。3) 最后，从左到右执行任何加减操作。\n\n所以，在下一个例子中：\n\n\
  `y = 12 + (20 + 3) - 8 / 4 * 3;`\n\n操作执行顺序如下：\n\n![Image](img/chapter07-11.png)\n\
  \n### 7.4 复合赋值运算符\n\nC++ 提供了一组特殊的运算符，称为复合赋值运算符，它们可以帮助你更快地编写代码。下表详细介绍了这些运算符。每个运算符都提供了一个示例，而“等价于”列显示了不使用复合赋值运算符的对应语句。\n\
  \n| 运算符 | 描述 | 示例 | 等价于 |\n| --- | --- | --- | --- |\n| += | 加法赋值 | `a += b;` |\
  \ `a = a + b;` |\n| -= | 减法赋值 | `a -= b;` | `a = a - b;` |\n| *= | 乘法赋值 | `a *=\
  \ b;` | `a = a * b;` |\n| /= | 除法赋值 | `a /= b;` | `a = a / b;` |\n| %= | 取模赋值 |\
  \ `a %= b;` | `a = a % b;` |\n\n![](img/notice.jpg)记住，在流程图中，本书仅使用“等价于”列所示的常用运算符。例如，C++\
  \ 语句 `a += b` 在流程图中表示为\n\n![Image](img/chapter07-12.png)。\n\n#### 练习 7.4-1 哪些 C++\
  \ 语句在语法上是正确的？\n\n以下哪些 C++ 赋值语句在语法上是正确的？\n\ni) `a = -10;`\nii) `10 = b;`\niii) `aB\
  \ = aB + 1;`\niv) `a = \"COWS\";`\nv) `a = COWS;`\nvi) `a + b = 40;`\nvii) `a =\
  \ 3 b;`\nviii) `a = \"true\";`\nix) `a = true;`\nx) `a /= 2;`\nxi) `a += 1;`\nxii)\
  \ `a =* 2;`\n\n解\n\ni) 正确。它将整数值 `-10` 赋值给变量 `a`。\nii) 错误。在赋值运算符的左侧只能存在变量。\niii)\
  \ 正确。它将变量 `aB` 增加了 1。\niv) 正确。它将字符串 “COWS”（不带双引号）赋值给变量 `a`。\nv) 正确。它将常量（甚至是变量）`COWS`\
  \ 的内容赋值给 `a`。\nvi) 错误。在赋值运算符的左侧只能存在变量（而不是表达式）。\nvii) 错误。它应该写为 `a = 3 * b`。\nviii)\
  \ 正确。它将字符串 “true”（不带双引号）赋值给变量 `a`。\nix) 正确。它将值 `true` 赋值给变量 `a`。\nx) 正确。这等价于 `a\
  \ = a / 2`。\nxi) 正确。这等价于 `a = a + 1`。\nxii 错误。它应该写为 `a *= 2`（等价于 `a = a * 2`）。\n\
  \n#### 练习 7.4-2 寻找变量类型\n\n以下每个变量的类型是什么？\n\ni) `a = 15;`\nii) `width = \"10 meters\"\
  ;`\niii) `b = \"15\";`\niv) `temp = 13.5;`\nv) `b = true;`\nvi) `b = \"true\";`\n\
  \n解\n\ni) 值 `15` 属于整数集，因此变量 `a` 是整数。\nii) 值 “10 meters” 是文本，因此变量 `width` 是字符串。\n\
  iii) 值 “15” 是文本，因此变量 `b` 是字符串。\niv) 值 `13.5` 属于实数集，因此变量 `temp` 是实数（浮点型 float）。\n\
  v) 值 `true` 是布尔值，因此变量 `b` 是布尔类型。\nvi) 值 “true” 是文本，因此变量 `b` 是字符串。\n\n### 7.5 递增/递减运算符\n\
  \n给数字加 1 或从数字中减 1 都是计算机编程中非常频繁使用的操作，因此 C++ 引入了一组特殊的运算符来实现这些操作。C++ 支持两种类型的递增和递减运算符：\n\
  \n► 前递增/递减运算符\n► 后递增/递减运算符\n\n请记住，在流程图中，本书仅使用“等价于”列所示的常用运算符。例如，C++ 语句 `a += b` 在流程图中表示为\n\
  \n（注：此处原文存在部分重复和错乱，已根据逻辑进行了整理）\n\n前递增/递减运算符位于变量左侧。后递增/递减运算符位于变量右侧。\n\n（注：原文文本在 7.5\
  \ 节存在多处重复和断句，此处已根据核心含义进行了翻译）\n\n### 7.6 字符串运算符\n\n将两个独立的字符串合并成一个字符串称为拼接。可以使用两种运算符来拼接（连接）字符串，如下表所示。\n\
  \n| 运算符 | 描述 | 示例 | 等价于 |\n| --- | --- | --- | --- |\n| + | 拼接 | `a = \"Hi\" + \"\
  \ there\";` | |\n| += | 拼接赋值 | `a += \"Hello\";` | `a = a + \"Hello\";` |\n\n以下代码片段显示\
  \ “What's up, dude?”\n\n```cpp\nstring a, b, c;\na = \"What's \";\nb = \"up, \"\
  ;\nc = a + b;\nc += \"dude?\";\ncout << c << endl;\n```\n\n#### 练习 7.6-1 姓名拼接\n\n\
  编写一个 C++ 程序，提示用户输入姓和名（赋值两个不同的变量）。然后将它们合并成一个字符串（拼接）并显示在屏幕上。\n\n解\n\nC++ 程序所示如下：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    string firstName,\
  \ lastName, fullName;\n    cout << \"Enter first name: \";\n    cin >> firstName;\n\
  \    cout << \"Enter last name: \";\n    cin >> lastName;\n    fullName = firstName\
  \ + \"  \" + lastName;\n    cout << fullName << endl;\n    return 0;\n}\n```\n\n\
  ### 7.7 复习题：对/错\n\n判断以下每个陈述的对错。\n\n\n\n\n\n1) 语句 `x = 5` 可以读作“变量 `x` 等于 5”。\n2)\
  \ 赋值运算符将表达式的结果赋值给变量。\n3) 字符串只有通过使用 `cin` 语句才能赋值给变量。\n4) 语句 `5 = y` 将值 `5` 赋值给变量\
  \ `y`。\n5) 在赋值运算符的右侧必须始终存在一个算术运算符。\n6) 在赋值运算符的右侧只能存在变量。\n7) 你不能在赋值运算符的双方都使用同一个变量。\n\
  8) 语句 `a = a + 1` 将变量 `a` 减 1。\n9) 语句 `a = a + (−1)` 将变量 `a` 减 1。\n10) 在 C++ 中，单词\
  \ `MOD` 是一个保留字。\n11) 语句 `x = 0 % 5` 将值 `5` 赋值给变量 `x`。\n12) 运算 `5 % 0` 是不可能的。\n13)\
  \ 在所有算术运算符中，加法和减法的优先级最高。\n14) 当除法和乘法运算符在表达式中共存时，先执行乘法运算。\n15) 表达式 `8 / 4 * 2` 等于\
  \ `1`。\n16) 表达式 `4 + 6 / 6 + 4` 等于 `9`。\n17) 表达式 `a + b + c / 3.0` 计算三个数的平均值。\n\
  18) 语句 `a += 1` 等于 `a = a + 1`。\n19) 语句 `a = \"true\"` 将一个布尔值赋值给变量 `a`。\n20) 语句\
  \ `a = 2·a` 使变量 `a` 的内容翻倍。\n21) 语句 `a += 2` 和 `a = a − (−2)` 不等价。\n22) 语句 `a −=\
  \ a + 1` 始终将值 `1` 赋值给变量 `a`。\n23) 语句 `a = \"George\" + \" Malkovich\"` 将值“GeorgeMalkovich”（不带双引号）赋值给变量\
  \ `a`。\n24) 下面的代码片段满足确定性属性。\n\n```\ndouble a, b, x;\ncin >> a >> b;\nx = a / (b\
