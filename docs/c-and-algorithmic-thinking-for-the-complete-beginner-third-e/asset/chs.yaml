  \ 程序。\n\n![Image](img/chapter21-24.png)\n\n## 第 22 章：决策控制结构的技巧与窍门\n\n### 22.1 引言\n\
  \n本章旨在向你介绍一些可以帮助写出“更好”代码的实用技巧和窍门。在设计自己的算法甚至是自己的 C++ 程序时，你应该始终记住这些技巧。\n\n这些技巧和窍门可以帮助你提高代码的可读性，并帮助代码变得更短甚至运行更快。当然，没有单一的完美方法，因为在某些情况下，使用特定的技巧可能有所帮助，但在另一些情况下，相同的技巧可能会产生恰相反的结果。在大多数情况下，代码优化取决于编程经验。\n\
  \n![](img/remember.jpg) 较小的算法并不总是特定问题的最佳解决方案。为了解决特定问题，你可能会写一个非常短的算法，但遗憾的是它证明会消耗大量的\
  \ CPU 时间。相反，你用另一个算法解决同一个问题，尽管它看起来更长，但计算结果的速度快得多。\n\n### 22.2 选择决策控制结构\n\n下面的图可以帮助你根据检查的变量数量，判断哪种决策控制结构是给定问题的更好选择。\n\
  \n![Image](img/chapter22-01.png)\n\n![](img/notice.jpg) 此图推荐的是最佳选项，而非唯一选项。例如，当一个变量有两种以上的情况时，使用嵌套的决策控制结构并不是错误的。然而，建议的多重选择决策结构和建议的\
  \ case 决策结构更加方便。\n\n### 22.3 精简决策控制结构\n\n仔细观察以下以通用形式提供的流程图片段。\n\n![Image](img/chapter22-02.png)\n\
  \n如你所见，二选一决策结构的两条路径开头都有两个相同的语句或语句块，末尾也都有两个相同的语句或语句块。这意味着，无论 `Boolean_Expression`\
  \ 的结果如何，这些语句在两种情况下都会执行。因此，你可以简单地将它们移动到外部，并分别放在二选一决策结构的之前和之后，如等等结构所示。\n\n![Image](img/chapter22-03.png)\n\
  \n![](img/notice.jpg) 只要所有路径中都存在相同的语句或语句块，该技巧就可以适用于任何决策控制结构。\n\n![](img/notice.jpg)\
  \ 在某些情况下无法应用此技巧。例如，如果一个语句（或语句块）影响了该结构的布尔表达式，那么你就不能将其移动到决策控制结构之前。\n\n你仍然感到困惑吗？接下来，你将看到一些可以帮助你更好理解的练习。\n\
  \n#### 练习 22.3-1 “收缩”算法\n\n使用较少的语句重新设计以下流程图。\n\n![Image](img/chapter22-04.png)\n\
  \n#### 答案\n\n如你所见，语句 `y ← a * 2` 存在于二选一决策结构的两条路径中。这意味着，无论布尔表达式的结果如何，该语句在两种情况下都会执行。因此，你可以简单地将语句移动到外部并放在二选一决策结构之前，如下所示。\n\
  \n![Image](img/chapter22-05.png)\n\n#### 练习 22.3-2 “收缩” C++ 程序\n\n使用较少的语句重写以下 C++\
  \ 程序。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int\
  \ a, y;\n    cin >> a;\n    if (a > 0) {\n        y = a * 4;\n        cout << y;\n\
  \    } else {\n        y = a * 3;\n        cout << y;\n    }\n    return 0;\n}\n\
  ```\n\n#### 答案\n\n如你所见，语句 `cout << y` 存在于二选一决策结构的两条路径中。这意味着，无论布尔表达式的结果如何，该语句在两种情况下都会执行。因此，你可以简单地将语句移动到外部并放在二选一决策结构之后，如下所示。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int a, y;\n\
  \    cin >> a;\n    if (a > 0) {\n        y = a * 4;\n    } else {\n        y =\
  \ a * 3;\n    }\n    cout << y;\n    return 0;\n}\n```\n\n#### 练习 22.3-3 “收缩”算法\n\
  \n使用较少的语句重新设计以下流程图，然后编写对应的 C++ 程序。\n\n![Image](img/chapter22-06.png)\n\n#### 答案\n\
  \n如果你尝试将 `Write y` 语句移动到多重选择决策结构之外，生成的流程图显然与初始流程图不等价。\n\n![Image](img/chapter22-07.png)\n\
  \n这是因为右侧的最后路径，该路径在初始流程图中并不包含 `Write y` 语句。\n\n检查两个流程图，看它们是否产生相同的结果。例如，假设用户输入了一个错误的数字。在两个流程图中，执行流都将指向\
  \ `Write \"Wrong Number\"` 语句。之后，初始流程图不再执行其他语句，而第二个流程图会执行一个额外的 `Write y` 语句。\n\n\
  ![](img/remember.jpg) 如果一个语句或语句块在所有路径中不存在，你就不能将其移动到决策控制结构之外。\n\n你现在可能想是否有其他方法可以将\
  \ `Write y` 语句移动到多重选择决策结构之外。答案是“肯定的”，但你需要稍微重新安排流程图。你需要完全移除右侧的最后路径，并在开头使用全新的决策控制结构来检查用户提供的数字是否错误。一种可能的解决方案所示。\n\
  \n![Image](img/chapter22-08.png)\n\n对应的 C++ 程序为：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double a, y;\n    cin >> a;\n    if (a >=\
  \ 30) {\n        cout << \"Wrong Number\" << endl;\n    } else {\n        if (a\
  \ < 10) {\n            y = a * 2;\n        } else if (a < 20) {\n            y =\
  \ a / 2;\n        } else {\n            y = a + 2;\n        }\n        cout << y\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n### 22.4 逻辑运算符——使用，还是不使用：这是一个哲学问题！\n\
  \n在某些情况下，你可以使用逻辑运算符代替嵌套的决策控制结构，这可以提高可读性。请看以下以通用形式提供的流程图片段。\n\n![Image](img/chapter22-09.png)\n\
  \n如你所见，语句或语句块 1 只有在两个布尔表达式都为真时才执行。语句或语句块 2 在所有其他情况下都会执行。因此，这个流程图片段可以使用 AND 逻辑运算符重新设计。\n\
  \n![Image](img/chapter22-10.png)\n\n现在，让我们来看另一个以通用形式提供的流程图片段。\n\n![Image](img/chapter22-11.png)\n\
  \n在这个流程图片段中，当 `Boolean_Expression_1` 为真或 `Boolean_Expression_2` 为真时，会执行语句或语句块 2。因此，你可以如所示使用\
  \ OR 逻辑运算符重新设计这个流程图片段。\n\n![Image](img/chapter22-12.png)\n\n![](img/notice.jpg)\
  \ 显然，这些方法也可以同样适用于嵌套的决策控制结构。\n\n#### 练习 22.4-1 重写代码\n\n使用逻辑运算符重写以下 C++ 程序。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    string today, name;\n\
  \    cin >> today >> name;\n    if (today == \"February 16\") {\n        if (name\
  \ == \"Loukia\") {\n```\n\n\n\n\n\n```cpp\ncout << \"Happy Birthday!!!\";\n}\nelse\
  \ {\n    cout << \"No match!\";\n}\n}else {\n    cout << \"No match!\";\n}\nreturn\
  \ 0;\n```\n\n### Solution\n\n`cout << \"Happy Birthday!!!\"` 语句只有在两个布尔表达式都为真时才会执行。`cout\
  \ << \"No match!\"` 语句在所有其他情况下都会执行。因此，你可以使用逻辑与 (`&&`) 运算符重写该 C++ 程序。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    string today, name;\n\
  \    cin >> today >> name;\n    if (today == \"February 16\" && name == \"Loukia\"\
  ) {\n        cout << \"Happy Birthday!!!\";\n    } else {\n        cout << \"No\
  \ match!\";\n    }\n    return 0;\n}\n```\n\n#### 练习 22.4-2 重写代码\n\n使用逻辑运算符重写以下\
  \ C++ 程序。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n \
  \   int a, b, y;\n    cin >> a >> b;\n    y = 0;\n    if (a > 10) {\n        y++;\n\
  \    } else if (b > 20) {\n        y++;\n    } else {\n        y--;\n    }\n   \
  \ cout << y << endl;\n    return 0;\n}\n```\n\n### Solution\n\n当变量 `a` 大于 10 或变量\
  \ `b` 大于 20 时，会执行 `y++` 语句。因此，你可以使用逻辑或 (`||`) 运算符重写该 C++ 程序。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int a, b, y;\n    cin >> a\
  \ >> b;\n    y = 0;\n    if (a > 10 || b > 20) {\n        y++;\n    } else {\n \
  \       y--;\n    }\n    cout << y << endl;\n    return 0;\n}\n```\n\n### 22.5 合并两个或多个单分支决策结构\n\
  \n有时，你可能会设计一个包含两个或多个连续单分支决策结构的算法，每个结构都评估相同的布尔表达式。这里有一个示例。\n\n![Image](img/chapter22-13.png)\n\
  \n当出现这种情况时，你可以直接将所有的单分支决策结构合并为一个，如下所示。\n\n![Image](img/chapter22-14.png)\n\n单分支决策结构需要是彼此相邻的。如果它们之间存在任何语句，除非你能将该语句移动到代码中的其他位置，否则你无法合并它们。\n\
  \n#### 练习 22.5-1 合并决策控制结构\n\n在以下 C++ 程序中，合并单分支决策结构。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int a;\n    cin >> a;\n    if (a > 0) {\n\
  \        cout << \"Hello\" << endl;\n    }\n    if (a > 0) {\n        cout << \"\
  Hermes\" << endl;\n    }\n    return 0;\n}\n```\n\n### Solution\n\n第一个和第二个决策控制结构评估的是完全相同的布尔表达式，因此它们可以简单地合并为一个。\n\
  \n该 C++ 程序变为：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    int a;\n    cin >> a;\n    if (a > 0) {\n        cout << \"Hello\" << endl;\n\
  \        cout << \"Hermes\" << endl;\n    }\n    return 0;\n}\n```\n\n#### 练习 22.5-2\
  \ 合并决策控制结构\n\n在以下 C++ 程序中，尽可能合并所有的单分支决策结构。\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int a, y, b;\n    cin >> a;\n    y = 0;\n  \
  \  if (a > 0) {\n        y += a + 1;\n    }\n    cin >> b;\n    if (!(a <= 0)) {\n\
  \        cout << \"Hello Hera\" << endl;\n    }\n    a++;\n    if (a > 0) {\n  \
  \      cout << \"Hallo Welt\" << endl;\n    }\n    cout << y << endl;\n    return\
  \ 0;\n}\n```\n\n### Solution\n\n仔细观察可以发现，第一个和第二个决策控制结构评估的是完全相同的布尔表达式。具体来说，对 `a >\
  \ 0` 取反得到 `a <= 0`，而对 `a <= 0` 再次取反（这次使用了非逻辑 `!` 运算符）得到 `!(a <= 0)`。因此，`a > 0` 实际上等于\
  \ `!(a <= 0)`。\n\n两次否定等于肯定。\n\n然而，在第一个和第二个决策控制结构之间存在语句 `cin >> b`，这阻止了你将它们合并为一个。幸运的是，这个语句可以移动到程序的开头，因为它并不会影响执行的其余部分。\n\
  \n另一方面，在第二个和第三个决策控制结构之间存在语句 `a++`，这同样阻止了合并；遗憾的是，这个语句无法移动到其他地方，因为它确实影响执行的其余部分（第二个和第三个决策控制结构依赖于该语句）。因此，第三个决策控制结构无法与前两个合并！\n\
  \n最终的 C++ 程序如下：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int a, b, y;\n    cin >> a;\n    cin >> b;\n    y = 0;\n    if (a > 0)\
  \ {\n        y += a + 1;\n        cout << \"Hello Hera\" << endl;\n    }\n    a++;\n\
  \    if (a > 0) {\n        cout << \"Hallo Welt\" << endl;\n    }\n    cout << y\
  \ << endl;\n    return 0;\n}\n```\n\n### 22.6 用双分支决策结构替换两个单分支决策结构\n\n看下一个示例。\n\n\
  ```cpp\nif (x > 40){//Do something}\nif (x <= 40){//Do something else}\n```\n\n\
  第一个决策控制结构评估变量 `x` 以测试它是否大于 40，紧接着，第二个决策控制结构再次评估该变量，以测试它是否小于或等于 40！\n\n这是初学者程序员经常犯的非常常见的“错误”。他们使用了两个单分支决策结构，尽管使用一个双分支决策结构就能完成相同的工作。\n\
  \n上一个示例可以使用仅一个双分支决策结构重写，如下所示：\n\n```cpp\nif (x > 40){//Do something}\nelse{//Do\
  \ something else}\n```\n\n尽管这两个示例都完全正确且运行良好，但后一种方案更好。CPU 只需要评估一个布尔表达式，这会导致执行时间更快。\n\
  \n两个单分支决策结构必须是彼此相邻的。如果它们之间存在任何语句，除非你能将该语句移动到代码中的其他位置，否则你无法“合并”它们（即用双分支决策结构替换它们）。\n\
  \n#### 练习 22.6-1 “合并”决策控制结构\n\n在以下代码段中，尽可能合并所有的单分支决策结构。\n\n```cpp\nint a, y, b;\n\
  cin >> a;\ny = 0;\nif (a > 0) {y += a;}\ncin >> b;\nif (!(a > 0)) {cout << \"Hello\
  \ Zeus\" << endl;}\nif (y > 0) {cout << y + 5 << endl;}\ny += a;\nif (y <= 0) {cout\
  \ << y + 12 << endl;}\n```\n\n### Solution\n\n第一个决策控制结构评估变量 `a` 以测试它是否大于 0，紧接着第二个决策控制结构再次评估变量\
  \ `a` 以测试它是否不大于 0。尽管它们之间存在语句 `cin >> b`，但该语句可以移动到其他地方，因为它并不会影响执行的其余部分。因此，第一个和第二个决策控制结构可以合并！\n\
  \n另一方面，在第三个和第四个决策控制结构之间存在语句 `y += a`，这阻止了合并。该语句无法移动到其他地方，因为它确实影响执行的其余部分（第三个和第四个决策控制结构依赖于该语句）。因此，第三个和第四个决策控制结构无法合并！\n\
  \n最终的代码段变为：\n\n```cpp\nint a, y, b;\ncin >> a;\ncin >> b;\ny = 0;\nif (a > 0) {y\
  \ += a;}\nelse {cout << \"Hello Zeus\" << endl;}\nif (y > 0) {cout << y + 5 << endl;}\n\
  y += a;\nif (y <= 0) {cout << y + 12 << endl;}\n```\n\n### 22.7 将最可能为布尔表达式放在前面\n\
  \n多分支结构和 case 决策结构通常需要在决定执行哪个语句或语句块之前检查多个布尔表达式。在下一个决策控制结构中：\n\n```cpp\nif (Boolean_Expression_1)\
  \ {A statement or block of statements 1}\nelse if (Boolean_Expression_2) {A statement\
  \ or block of statements 2}\nelse if (Boolean_Expression_3) {A statement or block\
  \ of statements 3}\n```\n\n\n\n\n程序首先测试 `Boolean_Expression_1` 是否为真。如果不是，它会测试 `Boolean_Expression_2`\
  \ 是否为真，如果不是，再测试 `Boolean_Expression_3`。然而，如果 `Boolean_Expression_1` 在大多数情况下为假，而\
  \ `Boolean_Expression_3` 在大多数情况下为真呢？这意味着在测试通常为真的 `Boolean_Expression_3` 之前，浪费时间去测试通常为假的\
  \ `Boolean_Expression_1`。\n\n为了让你的程序更高效，你可以将最可能为真的布尔表达式放在开头，最可能为假的布尔表达式放在结尾，如下：\n\
  \n```cpp\nif (Boolean_Expression_3) {A statement or block of statements 3}else if\
  \ (Boolean_Expression_2) {A statement or block of statements 2}else if (Boolean_Expression_1)\
  \ {A statement or block of statements 1}\n```\n\n![](img/remember.jpg)尽管这种变化看起来无关紧要，但你节省的每一点时间积累起来都可以使你的程序运行得更快、更高效。\n\
  \n### 练习 22.7-1 重新排列布尔表达式\n\n根据研究，美国最喜欢的宠物是狗，猫位第二，豚鼠紧随，鹦鹉最后。在下面的代码段中，重新排列布尔表达式，使程序在大多数情况下运行得更快、更高效。\n\
  \n```cpp\nstring kind;cout << \"What is your favorite pet? \";cin >> kind;if (kind\
  \ == \"Parrots\") {cout << \"It screeches!\" << endl;}else if (kind == \"Guinea\
  \ pig\") {cout << \"It squeaks\" << endl;}else if (kind == \"Dog\") {cout << \"\
  It barks\" << endl;}else if (kind == \"Cat\") {cout << \"It meows\" << endl;}\n\
  ```\n\n#### 答案\n\n对于这项研究，你可以重新排列代码片段，使其在大多数情况下运行得快一点。\n\n```cpp\nstring kind;cout\
  \ << \"What is your favorite pet? \";cin >> kind;if (kind == \"Dog\") {cout << \"\
  It barks\" << endl;}else if (kind == \"Cat\") {cout << \"It meows\" << endl;}else\
  \ if (kind == \"Guinea pig\") {cout << \"It squeaks\" << endl;}else if (kind ==\
  \ \"Parrots\") {cout << \"It screeches!\" << endl;}\n```\n\n### 22.8 为什么代码缩进如此重要？\n\
  \n当你阅读此这本书时，你可能会疑惑为什么在 C++ 语句前面会出现空格字符，为什么这些语句没有像下面的示例那样写在段落的最左侧边缘。\n\n```cpp\n\
  #include <iostream>using namespace std;int main() {int x, y;cout << \"Enter a number:\
  \ \";cin >> x;cout << \"Enter a second number: \";cin >> y;if (x > 5) {cout << \"\
  Variable x is greater than 5\" << endl;}else {x = x + y;cout << \"Hello Zeus!\"\
  \ << endl;if (x == 3) {cout << \"Variable x contains a value of 3\" << endl;}else\
  \ {x = x - y;cout << \"Hello Olympians!\" << endl;if (x + y == 24) {cout << \"The\
  \ sum of x + y is equal to 24\" << endl;}else {cout << \"Nothing of the above\"\
  \ << endl;}}}return 0;}\n```\n\n答案显而易见！没有缩进的代码难以阅读和理解。任何阅读这种编写代码的人都会对 if – else\
  \ 的配对感到困惑（即一个 else 属于哪一个 if）。此外，如果一个很长的 C++ 程序是这样写的，几乎不可能找到（例如）一个被遗忘的右大括号 } } 所在的位置。\n\
  \n代码缩进可以定义为一种组织源代码的方法。缩进使用空格或制表符对代码进行格式化，以提高可读性。良好的缩进非常有帮助，即使需要花费额外的精力，因为从长远来看，当你重新查看代码时，它可以为你节省大量时间。遗憾的是，它有时会被忽视，而问题会在以后发生。遵循特定的编程风格有助于你避免语法错误和逻辑错误。它还能帮助程序员更容易地学习和理解他人编写的代码。\n\
  \n![](img/notice.jpg)代码缩进类似于作者在视觉上安排书籍文本的方式。他们不是写一长串句子，而是将文本分成章节和段落。这种行为不会改变文本的含义，但它使其更容易阅读。\n\
  \n所有出现在大括号 { } 内部的语句都应该缩进。例如，通过对双二分支决策结构内部的语句进行缩进，你在视觉上将它们区分开来。结果是任何人都可以一眼看出当布尔表达式求为真时执行哪些语句，以及当布尔表达式求为假时执行哪些语句。\n\
  \n![](img/notice.jpg)只有人类在阅读和理解没有缩进的程序时才有困难。计算机可以执行任何带有或不带缩进的 C++ 代码，只要不包含语法错误。\n\
  \n### 22.9 复习题：判断对错\n\n为下述每个陈述选择对或错。\n\n1) 较小的算法总是解决给定问题的最佳解决方案。\n2) 你始终可以将一个语句移动到双分支决策结构外部并紧接其前面，只要它位于决策结构两个路径的开头。\n\
  3) 你始终可以使用逻辑运算符来代替嵌套的决策控制结构来提高可读性。\n4) 两个单分支决策结构可以合并为一个单分支决策结构，仅当它们是连续的且评估的是等价的布尔表达式时。\n\
  5) 从双分支决策结构转换为两个单分支决策结构总是可能的。\n6) 两个单分支决策结构可以替换为一个双分支决策结构，仅当它们是连续的且仅当它们评估的是同一个布尔表达式时。\n\
  7) 包含决策控制结构且未编写代码缩进的 C++ 程序无法被计算机执行。\n\n### 22.10 复习题：单选择\n\n为下述每个陈述选择正确答案。\n\n\
