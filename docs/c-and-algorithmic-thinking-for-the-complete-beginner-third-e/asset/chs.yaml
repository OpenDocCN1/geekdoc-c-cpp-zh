  \ 函数！它会返回最大深度，而不是具有该最大深度的湖泊名称！\n\n### 练习 34.3-3 哪个国家哪个平均面积的哪个湖泊最深？\n\n编写一个 C++ 程序，让用户输入\
  \ 20 个湖泊的名称、深度，以及它们所属的国家和平均面积。程序随后必须显示关于最深湖泊的所有可用信息。\n\n#### 解决方案\n\n让我们来看下一个六个湖泊的例子。深度以英尺为单位，平均面积以平方英里为单位。\n\
  \n![Image](img/chapter34-05.png)\n\n显而易见，贝加湖是最深的湖泊，位于索引 2。如果你按照类似于上一个练习（练习 34.3-2）的方法来处理这个练习，你需要在每次发现比之前存储的更大的深度时，额外记录名称、国家和面积。然而，下面提供的解决方案采用了一种更高效的方法，仅使用一个变量（`indexOf`）来跟踪这些值所在的索引。\n\
  \n![](img/my_exercise_header.png)\n\n```cpp\nproject_34.3-3\n#include <iostream>\n\
  using namespace std;\nconst int LAKES = 20;\nint main() {\n    int i;\n    double\
  \ maximum;\n    string names[LAKES];\n    double depths[LAKES];\n    string countries[LAKES];\n\
  \    double areas[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n        cin >>\
  \ names[i];\n        cin >> depths[i];\n        cin >> countries[i];\n        cin\
