  \ / 10)` |\n\n### 13.3 显示消逝的时间\n\n编写一个 C++ 程序，提示用户输入一个表示时间的整数，并以“DD day(s) HH hour(s)\
  \ MM minute(s) and SS second(s)”的格式显示。例如，如果用户输入 70005，必须显示“8 day(s) 2 hour(s) 26\
  \ minute(s) and 45 second(s)”。\n\n### 解决方案\n\n你可能已经知道，60 秒一分钟，3600 秒一小时（60×60），以及\
  \ 86400 秒一天（3600×24）。让我们尝试用上一个练习中的第一种方法分析数字 70005。\n\n| 天数 = 8 | 如果你使用 (` /` ) 运算符将用户提供的数字除以\
  \ 86400，就可以得到整数商 `days = (int)(70005 / 86400)` |\n| 剩余秒 = 8805 | 如果你使用 (` %` ) 运算符将用户提供的数字除以\
  \ 86400，就可以得到整数余数 `r = 70005 % 86400` |\n| 小时 = 2 | 如果你使用 (` /` ) 运算符将剩余秒数除以 3600，就可以得到整数商\
  \ `hours = (int)(8805 / 3600)` |\n| 剩余秒 = 1605 | 现在的剩余秒是 `r = 8805 % 3600` |\n|\
  \ 分钟 = 26 | 如果你使用 (` /` ) 运算符将剩余秒数除以 60，就可以得到整数商 `minutes = (int)(1605 / 60)` |\n\
  | 秒数 = 45 | 最后一个余数恰好是秒数，是 `seconds = 1605 % 60` |\n\n解决该算法的 C++ 程序如所示。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int days, hours, minutes,\
  \ number, r, seconds;\n    cout << \"Enter a period of time in seconds: \";cin >>\
  \ number;\n    days = (int)(number / 86400);\n    r = number % 86400;\n    hours\
  \ = (int)(r / 3600);\n    r = r % 3600;\n    minutes = (int)(r / 60);\n    seconds\
  \ = r % 60;\n    cout << days << \" day(s) \" << hours << \" hour(s) \" << endl;\n\
  \    cout << minutes << \" minute(s) and \" << seconds << \" second(s)\" << endl;\n\
  \    return 0;\n}\n```\n\n你也可以使用上一个练习中的第二种方法来解决这个练习。\n\n\n\n\n\n![](img/my_exercise_header.png)\
