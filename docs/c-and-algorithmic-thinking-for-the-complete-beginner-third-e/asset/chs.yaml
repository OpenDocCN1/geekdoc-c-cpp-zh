  \ n` | | 5.0 |\n| 5 | `cout << n << endl` | 它显示: 5 | |\n| 6 | `cout << a << endl`\
  \ | 它显示: −5 | |\n\n![](img/notice.jpg) 注意在步骤 5 时，`void` 函数的变量 `n` 包含值 5.0，但当流在步骤\
  \ 6 返回主代码时，主代码的变量 `a` 仍然包含值 −5.0。实际上，主代码变量 `a` 的值并没有改变。\n\n## 36.8 复习题：对错判断\n\n\
  判断每个陈述对或错。\n\n1) C++ 中有两类返回值的子程序。\n2) 用于向函数传递值的变量称为参数。\n3) `abs()` 函数是用户定义的函数。\n\
  4) 调用用户定义函数的方法与调用内置函数相同。\n5) 函数的形式参数列表中可以有任意数量的参数。\n6) 在函数中，形式参数列表必须包含一个参数。\n7)\
  \ 在函数中，形式参数列表是可选的。\n8) 函数不能返回数组。\n9) 语句 `return x + 1;` 是有效的。\n10) 形式参数可以是表达式。\n\
  11) 实参数可以是表达式。\n12) 函数的实参数列表中可以没有参数。\n13) 下述语句三次调用函数 `cubeRoot()`：`cb = cubeRoot(x)\
  \ + cubeRoot(x) / 3;`\n14) 下述代码显示的值与 `cout << cubeRoot(x) + 5 << endl;` 相同：`cb =\
  \ cubeRoot(x); y = 5; cout << y << endl;`\n15) 函数必须包含 `return` 语句，而 `void` 函数不需要。\n\
  16) 函数名 `play-the-guitar` 是有效的。\n17) 在 C++ 中，你可以将函数放在主代码下方。\n18) 当主代码调用函数时，其执行会被中断。\n\
  19) 一般来说，函数可以向调用者返回值。\n20) `abs()` 函数是内置函数。\n21) 下述代码显示 0.5：\n```cpp\n#include <iostream>\n\
  using namespace std;\ndouble divide(double b, double a) {\n    return a / b;\n}\n\
  int main() {\n    double a = 10;\n    double b = 5;\n    cout << divide(a, b) <<\
  \ endl;\n    return 0;\n}\n```\n22) 在计算机科学中，不返回的子子被称为 `void` 函数。\n23) 在 C++ 中，通过编写函数名加上括号来调用\
  \ `void` 函数。\n24) 在主代码调用的 `void` 函数中，实列表变量必须来自主代码。\n25) 在 `void` 函数调用中，实列表中可以使用变量。\n\
  26) 在 `void` 函数中，所有形式参数名称必须不同。\n27) `void` 函数的形式参数列表必须包含至少一个参数。\n28) 形式参数和实参数之间存在一一对应关系。\n\
  29) 可以在语句中调用 `void` 函数。\n30) 当执行到达 `void` 函数结束时，从调用处继续。\n31) `void` 函数向调用者返回值。\n\
  32) `void` 函数可以从调用者接收值。\n33) 调用 `void` 函数的方式与调用函数不同。\n34) 在下述 C++ 程序中，执行的第一条语句是\
