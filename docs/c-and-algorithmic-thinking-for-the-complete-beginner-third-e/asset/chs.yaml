  \ 章\n\n子程序简介\n\n### 35.1 什么是子程序？\n\n在计算机科学中，子程序是一个封装成单元的语句块，用于执行特定任务。当需要执行该特定任务时，可以在程序中多次调用它。\n\
  \n在 C++ 中，内置函数是此类子程序的一个示例。以著名的 `abs()` 函数为例。它由一组在 `abs` 名称下封装成单元的语句块组成，并执行特定任务——返回数字的绝对值。\n\
  \n![](img/notice.jpg)\n如果你在想 `abs()` 函数内部可能存在什么样的语句，这里有一段可能的语句块。\n\n```cpp\nif (number\
  \ < 0)\nreturn number * (-1);\nelse\nreturn number;\n```\n\n通常来说，子程序分为两类：函数（functions）和过程（procedures）。函数和过程的区别在于函数返回结果，而过程不返回。然而，在某些计算机语言中，这种区别并不明显。在某些语言中，函数也可以作为过程使用且不返回结果；而在某些语言中，过程可以返回一个或多个结果。\n\
  \n\n\n\n\n![](img/notice.jpg)取决于所使用的计算机语言，“函数”（function）和“过程”（procedure）这两个术语可能有所不同。例如，在\
  \ Visual Basic 中，它们被称为“functions”和“subprocedures”，在 FORTRAN 中被称为“functions”和“subroutines”，而在\
  \ C++ 中，通常首选术语是“functions”和“void functions”。\n\n## 35.2 什么是过程程序？\n\n假设你被分配了一个解决你地区药物滥用问题的项目。可能的方法（可能被证明非常困难甚至是不可能的）是尝试自己解决这个问题！\n\
  \n然而，更好的方法是将大问题细分为较小的子问题，例如预防、治疗和康复，每个子问题都可以进一步细分为更小的子问题，如图 35–1 所示。\n\n![Image](img/chapter35-01.png)\n\
  \n图 35–1 一个问题可以细分为更小的问题\n\n作为该项目的负责人，你可以租一栋建筑并在其中建立三个部门：预防部门及其所有下部门；治疗部门及其所有下部门；以及康复部门及其所有下部门。最后，你聘用员工（来自各个领域的专家），组建团队并雇佣他们为你完成工作！\n\
  \n过程程序完全在做相同的事情。它将一个初始问题细分为较小的子问题，每个子问题进一步细分为更小的子问题。最后，为每个子问题编写一个小的子程序，由主程序（像负责人一样）调用（雇佣）每一个子程序来完成工作的不同部分。\n\
  \n过程程序具有几个优点：\n\n►它允许程序员在需要时重用相同的代码，而无需重新改写或复制它。►它相对容易实现。►它帮助程序员更容易地跟踪执行流，从而简化调试过程。\n\
  \n![](img/notice.jpg)当一个非常大的程序全部整合在一起时，调试和维护可能会变得非常困难。出于这个原因，将其细分为较小的子程序通常会许多，每个子程序执行一个定义明确的过程。\n\
  \n### 35.3 什么是模块化编程？\n\n在模块化编程中，具有共同功能的子程序可以组合到独立的模块中，每个模块可以有自己的 set 数据。因此，一个程序可以由多个部分组成，其中每个部分（模块）都可以包含一个或多个更小的部分（子程序）。\n\
  \n![](img/notice.jpg)`cmath` 库就是一个例子。它包含了具有共同功能的（与数学相关的）子程序，如 `sqrt()`、`sin()`、`cos()`、`tan()`\
  \ 等许多程序。\n\n如果你在之前的药物问题示例中使用模块化编程，那么你就可以拥有三栋独立的建筑——一栋用于存放预防部门及其所有下部门，第二栋用于存放治疗部门及其所有下部门，第三栋用于存放康复部门及其所有下部门（如图\
  \ 35–2 所示）。这三栋建筑可以被认为是模块化编程中的三个不同模块，每个模块都包含具有共同功能的子程序。\n\n![Image](img/chapter35-02.png)\n\
  \n图 35–2 具有共同功能的子程序可以组合到独立的模块中。\n\n## 35.4 复习题：判断对错对对以下每个陈述判断对错。\n\n1) 子程序是一个封装成单元的语句块，用于执行特定任务。\n\
  2) 通常来说，子程序有两种类型：函数和过程。\n3) 通常来说，函数和过程之间的区别在于过程返回结果，而函数不返回结果。\n4) C++ 只支持过程。\n5)\
  \ 过程程序将初始问题细分为较小的子问题。\n6) 过程程序的优点是能够重用相同的代码，而无需重新编写或复制它。\n7) 过程程序帮助程序员更容易跟踪执行流。\n\
  8) 模块化编程增加了程序开发速度。\n9) 在模块化编程中，具有共同功能的子程序被组合到独立的模块中。\n10) 在模块化编程中，每个模块可以有自己的 set\
  \ 数据。\n11) 模块化编程使用的结构与结构化编程不同。\n12) 程序可以由多个模块组成。\n\n## 第 36 章 用户自定义子程序\n\n### 36.1\
  \ 返回值的子程序\n\n在 C++ 和许多其他计算机语言中，返回值的子程序被称为函数。函数分为两类：内置函数（如 `abs()`）和用户自定义函数（即你可以亲自编写并在自己的程序中使用的函数）。\n\
  \n返回返回值的 C++ 函数的一般形式所示：\n\n```cpp\nreturn_type name([type1 arg1, type2 arg2, type3\
  \ arg3, …]) {\n    Local variables declaration section\n    A statement or block\
  \ of statements\n    return value;\n}\n```\n\n其中\n\n► `return_type` 是函数返回值的数据类型。\n\
  ► `name` 是函数的名称。\n► `arg1`, `arg2`, `arg3`, `…` 是参数列表（变量、数组等），用于从调用者向函数传递值。参数的数量可以根据需要设置。\n\
  ► `type1`, `type2`, `type3`, `……` 是每个参数的数据类型。每个参数必须有一个数据类型。\n► `value` 是返回给调用者的值。它可以是一个常量、一个变量、一个表达式，甚至是数据结构。它的数据类型必须与函数的\
  \ `return_type` 匹配。\n\n![](img/notice.jpg)注意参数是可选的；也就是说，函数可以不包含参数。\n\n![](img/notice.jpg)在\
  \ Section 5.4 中你学习了在给变量命名时必须遵循的规则。为子程序命名遵循完全相同的规则！\n\n函数名可以比作一个盒子（见图 36–1），它包含一个语句或语句块。它接受参数\
  \ `arg1`、`arg2`、`arg3`、`…` 作为输入值，并返回 `value` 作为输出值。\n\n![Image](img/chapter36-01.png)\n\
  \n图 36–1 函数可以比作一个盒子\n\n例如，下一个函数通过参数 `num1` 和 `num2` 接受两个数字，然后计算它们的和并返回结果。\n\n```cpp\n\
  double getSum(double num1, double num2) {\n    double result;\n    result = num1\
  \ + num2;\n    return result;\n}\n```\n\n当然，这也可以写为：\n\n```cpp\ndouble getSum(double\
  \ num1, double num2) {\n    return num1 + num2;\n}\n```\n\n### 36.2 如何调用函数\n\n每次调用函数都如下：写下函数名，后面跟一个参数列表（如果需要），要么是在将函数的返回值赋值给变量的语句中，要么直接在表达式中。\n\
  \n让我们来看一些例子。以下函数通过参数 `num` 接受一个数值，并返回该值的三次方结果。\n\n```cpp\ndouble cube(double num)\
  \ {\n    double result;\n    result = num * num * num;\n    return result;\n}\n\
  ```\n\n现在，假设你想计算以下表达式的结果\n\n.![Image](img/chapter36-02.png)\n\n你可以将函数 `cube()` 的返回值赋值给变量，如下所示\n\
  \n```cpp\ncin >> x;\ncb = cube(x);        //将返回值赋值给变量\ny = cb + 1 / x;     //并使用该变量\n\
