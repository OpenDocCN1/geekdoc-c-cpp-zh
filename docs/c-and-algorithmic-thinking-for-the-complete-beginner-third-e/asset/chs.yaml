  \ 30 天。\n\n## 第 11 章\n## 数字处理\n### 11.1 简介\n\n就像每种高级编程语言一样，C++ 提供了许多现用的子程序（称为函数），你可以随时随地使用它们。\n\
  \n![](img/notice)“子程序”是一组封装成单个单元的语句。每个子程序都有描述性的名称并执行特定的任务。\n\n为了更好地理解 C++ 函数，让我们看看计算正数平方根的迭代公式。\n\
  \n![Image](img/chapter11-01.png)\n\n其中\n\n`y` 是你想要求平方根的 `x[n]` 是 y 的平方根的 n 次迭代值\n\
  \n你现在可能感到有些沮丧。你可能认为应该写一个程序来通过海伦公式计算平方根，但事实并非如此！目前，没有人这样计算平方根。幸运的是，C++ 为此目的提供了函数！这个函数实际上是一个小子程序被命名为\
  \ `sqrt`，你只需要按名称调用它，它就会为你完成工作。这里显示了一个示例：\n\n```cpp\n#include <iostream>\n#include\
  \ <cmath>\nusing namespace std;\nint main() {\n    double x, y;\n    cin >> x;\n\
  \    y = sqrt(x);\n    cout << y;\n    return 0;\n}\n```\n\n\n\n\n`sqrt()` 函数定义在\
  \ `cmath` 库中。因此，为了使用 `sqrt()` 函数，你必须在程序的开头使用 `#include <cmath>` 语句包含 `cmath` 库。\n\
  \n尽管 C++ 支持许多数学子程序（函数），但本章仅涵盖了对于本书目的而言绝对必要的函数。不过，如果你需要更多信息，可以访问以下地址之一：\n\n- [`tinyurl.com/2v2eadrf`](https://tinyurl.com/2v2eadrf)\n\
  - [`cplusplus.com/reference/cmath/`](https://cplusplus.com/reference/cmath/)\n\n\
  每当你需要进行数学计算（例如寻找平方根、正弦、余弦、绝对值等）时，就会使用到数学子程序。\n\n### 11.2 有用的数学函数（子程序）及更多\n\n###\
  \ 绝对值\n`abs(number)`\n\n此函数返回 `number` 的绝对值。\n\n#### 示例\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int a, b;\n    a = -5;\n    b = abs(a);\n\
  \    cout << abs(a) << endl;     //它显示: 5\n    cout << b << endl;          //它显示:\
  \ 5\n    cout << abs(-5.2) << endl;  //它显示: 5.2\n    cout << abs(5.2) << endl; \
  \  //它显示: 5.2\n    return 0;\n}\n```\n\n#### Pi Pi\n`M_PI`\n\n这包含 `π` 的值。\n\n注意\
  \ `M_PI` 是一个常量，而不是函数。这就是为什么没有使用括号。\n\n#### 示例\n```cpp\n#include <iostream>\n#include\
  \ <cmath>\nusing namespace std;\nint main() {\n    cout << M_PI << endl;   //它显示:\
  \ 3.14159\n    cout.precision(19);     //设置最大显示位数\n    cout << M_PI << endl;   //它显示:\
  \ 3.141592653589793116\n    return 0;\n}\n```\n\n常量 `M_PI` 定义在 `cmath` 库中。它在 C++\
  \ 中无法直接访问，因此你需要包含 `cmath` 库。然而，在 Visual Studio Community 中，为了使用常量 `M_PI`，而不是包含 `cmath`\
  \ 库，你需要在程序的开头使用 `#define _USE_MATH_DEFINES` 语句定义 `_USE_MATH_DEFINES`。\n\n语句 `cout.precision(19)`\
  \ 将 `cout` 语句显示的最大位数设置为 19。\n\n### 正弦\n`sin(number)`\n\n此函数返回 `number` 的正弦。`number`\
  \ 的值必须以弧度表示。你可以乘以 `M_PI / 180` 将角度转换为弧度。\n\n#### 示例\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double a, b;\n    a =\
  \ sin(3 * M_PI / 2);            //3π/2 弧度的正弦\n    b = sin(270 * M_PI / 180);   \
  \    //270 度的正弦\n    cout << a << \"  \" << b << endl;   //它显示: -1  -1\n    return\
  \ 0;\n}\n```\n\n`sin()` 函数定义在 `cmath` 库中。它在 C++ 中无法直接访问，因此你需要包含 `cmath` 库。\n\n###\
  \ 余弦\n`cos(number)`\n\n此函数返回 `number` 的余弦。`number` 的值必须以弧度表示。你可以乘以 `M_PI / 180`\
  \ 将角度转换为弧度。\n\n#### 示例\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nint main() {\n    double a, b;\n    a = cos(2 * M_PI);                //2π弧度的余弦\n\
  \    b = cos(360 * M_PI / 180);       //360 度的余弦\n    cout << a << \"  \" << b <<\
  \ endl;   //它显示: 1  1\n    return 0;\n}\n```\n\n`cos()` 函数定义在 `cmath` 库中。它在 C++\
  \ 中无法直接访问，因此你需要包含 `cmath` 库。\n\n### 正切\n`tan(number)`\n\n此函数返回 `number` 的正切。`number`\
  \ 的值必须以弧度表示。你可以乘以 `M_PI / 180` 将角度转换为弧度。\n\n#### 示例\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double a;\n    a = tan(10\
  \ * M_PI / 180);  //10 度的正切\n    cout << a << endl;         //它显示: 0.176327\n  \
  \  return 0;\n}\n```\n\n`tan()` 函数定义在 `cmath` 库中。它在 C++ 中无法直接访问，因此你需要包含 `cmath`\
  \ 库。\n\n### 字符串转整数\n`stoi(value)`\n\n此函数将整数的字符串表示转换为其数值等。\n\n#### 示例\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    string s1 = \"5\";\n    string\
  \ s2 = \"3\";\n    int k;\n    k = stoi(s1);\n    cout << k << endl;         //它显示:\
  \ 5\n    cout << stoi(s2) << endl;   //它显示: 3\n    return 0;\n}\n```\n\n### 字符串转实数\n\
  `stod(value)`\n\n此函数将实数的字符串表示转换为其数值等。\n\n#### 示例\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    string s1 = \"6.5\";\n    string s2 = \"\
  3.4\";\n    double x;\n    x = stod(s1);\n    cout << x << endl;         //它显示:\
  \ 6.5\n    cout << stod(s2) << endl;   //它显示: 3.4\n    return 0;\n}\n```\n\n###\
  \ 实数转整数\n`(int)number`\n\n此函数返回 `number` 的整数部分。如果 `number` 包含小数部分，该部分将在转换时丢失。\n\n\
  #### 示例\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double\
  \ a = 5.9;\n    int k = (int)a;\n    cout << k << endl;         //它显示: 5\n    return\
  \ 0;\n}\n```\n\n### 整数转实数\n`(double)number`\n\n此函数将 `number` 作为实数。\n\n#### 示例\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int a = 5;\n\
  \    double x = (double)a;\n    cout << x << endl;         //它显示: 5\n    return\
  \ 0;\n}\n```\n\n\n\n\n![](img/my_exercise_header.png) 项目 11.2\n\n```cpp\n#include\
  \ <iostream>\n#include <cstdlib>\nusing namespace std;\nint main() {\n    cout <<\
  \ rand() << endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand() << endl;  //它显示一个\
  \ 0 到 RAND_MAX 之间的随机整数\n    cout << rand() << endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n\
  \    return 0;\n}\n```\n\n![](img/notice.jpg)函数 `rand()` 定义在库 `cstdlib` 中。它在 C++\
  \ 中无法直接访问，因此你需要包含库 `cstdlib`。\n\n![](img/notice.jpg)随机数在计算机游戏中被广泛使用。例如，“敌人”可能会在随机时间出现，或向随机方向移动。此外，随机数还用于模拟程序、统计程序、计算机安全中的数据加密等。\n\
  \n伪随机数看起来是随机的，但实际上它们并不是！如果你执行之前的程序，你会发现每次执行它时，得到的都是完全相同的“随机”数序列。\n\n这就像拿了一副已经洗好的牌，按顺序取出第一张，然后是第二张，然后是第三张，以此此类推。然后你将这些牌按照取牌前的顺序放回牌组。接着你再次开始，按顺序取出第一张，然后是第二张，然后是第三张，以此此类推。显然，这三张牌和你之前取的是模样的。所以你你需要做是在开始取牌之前总是洗洗牌。\n\
  \n在 C++ 中你需要执行相同的操作。你需要“洗牌”。为了做到这一点，你可以像下面的示例所示，在程序的开头使用 `srand(time(NULL))` 语句。\n\
  \n![](img/my_exercise_header.png) 项目 11.2\n\n```cpp\n#include <iostream>\n#include\
  \ <ctime>\n#include <cstdlib>\nusing namespace std;\nint main() {\n    srand(time(NULL));\n\
  \    cout << rand() << endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand() <<\
  \ endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand() << endl;  //它显示一个 0 到\
  \ RAND_MAX 之间的随机整数\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数 `time()` 定义在库\
  \ `ctime` 中。它在 C++ 中无法直接访问，因此你需要包含库 `ctime`。\n\n如果你想得到一个最小值和最大值之间的伪随机整数，可以使用以下模式：\n\
  \n`minimum + rand() % (maximum - minimum + 1)`\n\n![](img/my_exercise_header.png)\
  \ 项目 11.2m\n\n```cpp\n#include <iostream>\n#include <ctime>\n#include <cstdlib>\n\
  using namespace std;\nint main() {\n    srand(time(NULL));\n    cout << 2 + rand()\
  \ % (10 - 2 + 1) << endl;  //它显示一个 2 到 10 之间的随机整数\n    cout << 20 + rand() % 6 <<\
  \ endl;            //它显示一个 20 到 25 之间的随机整数\n    return 0;\n}\n```\n\n## 四舍五入\n\n\
  `round(number)`\n\n该函数返回 `number` 最接近的整数。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ 项目 11.2n\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\
  int main() {\n    double a = 5.9;\n    cout << round(a) << endl;    //它显示: 6\n \
  \   cout << round(5.4) << endl;  //它显示: 5\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `round()` 定义在库 `cmath` 中。它在 C++ 中无法直接访问，因此你需要包含库 `cmath`。\n\n如果你需要保留指定精度的 `number`\
  \ 数值，可以使用以下公式：\n\n`round(number * pow(10, precision)) / pow(10, precision)`\n\n\
  ### 示例\n\n![](img/my_exercise_header.png) 项目 11.2o\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double a, y;\n    a =\
  \ 5.312;\n    y = round(a * pow(10, 2)) / pow(10, 2);\n    cout << y << endl;  \
  \             //它显示: 5.31\n    a = 5.315;\n    y = round(a * pow(10, 2)) / pow(10,\
  \ 2);\n    cout << y << endl;               //它显示: 5.32\n    cout << round(2.3447\
  \ * pow(10, 3)) / pow(10, 3) << endl;  //它显示: 2.345\n    cout << round(2.3447 *\
  \ 1000) / 1000 << endl;              //它显示: 2.345\n    return 0;\n}\n```\n\n## 平方\n\
  \n`sqrt(number)`\n\n该函数返回 `number` 的平方根，其中 `number` 可以是正值或零。\n\n### 示例\n\n![](img/my_exercise_header.png)\
