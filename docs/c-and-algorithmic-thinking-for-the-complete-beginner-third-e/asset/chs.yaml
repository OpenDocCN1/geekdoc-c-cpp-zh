  ```\n12) 以下代码片段满足有限性（finiteness）。\n```cpp\ni = 1;\nwhile (i != 100) {\n    cout\
  \ << \"Hello there!\" << endl;\n    i += 5;\n}\n```\n13) 当先置测试循环结构的布尔表达式中使用不等于（`!=`）比较运算符时，循环将始终无限迭代。\n\
  14) 以下代码片段满足有限性。\n```cpp\ni = 0;\ndo {\n    cout << \"Hello there!\" << endl;\n\
  \    i += 5;\n} while (i < 100);\n```\n\n### 29.9 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n\
