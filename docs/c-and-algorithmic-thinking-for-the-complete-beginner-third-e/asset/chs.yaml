  \n#### 练习 34.4-10 三最慢用时\n\n十位赛车手在赛道上尽可能快地驾驶。每辆赛车运行 20 圈，并记录每圈对应的用时（秒）。编写一个 C++ 程序，提示用户输入每位驾驶手的姓名以及每圈的用时。该程序必须显示每位驾驶手的姓名及其三个最慢的用时。使用插入排序算法。\n\
  \n##### 方案\n\n在此练习中，你需要以下两个数组。\n\n![Image](img/chapter34-36.png)\n\n在用户输入所有数据后，C++\
  \ 程序必须对数组的每一行进行降序排序，但最后必须显示前三列。\n\n使用“从内层到层”的方法，下一个代码片段使用插入排序算法对二维数组 `elapsedTimes`\
  \ 的第一行（行索引 0）进行降序排序。假设变量 `i` 的值为 0。\n\n```cpp\nfor (m = 1; m <= LAPS - 1; m++) {\n\
  \    element = elapsedTimes[i][m];\n    n = m;\n    while (n > 0 && elapsedTimes[i][n\
  \ - 1] < element) {\n        elapsedTimes[i][n] = elapsedTimes[i][n - 1];\n    \
  \    n--;\n    }\n    elapsedTimes[i][n] = element;\n}\n```\n\n现在，为了对所有行进行排序，你需要将此代码片段嵌套在一个遍历所有行的\
  \ `for` 循环中，如下：\n\n```cpp\nfor (i = 0; i <= CARS - 1; i++) {\n    for (m = 1; m\
  \ <= LAPS - 1; m++) {\n        element = elapsedTimes[i][m];\n        n = m;\n \
  \       while (n > 0 && elapsedTimes[i][n - 1] < element) {\n            elapsedTimes[i][n]\
  \ = elapsedTimes[i][n - 1];\n            n--;\n        }\n        elapsedTimes[i][n]\
  \ = element;\n    }\n}\n```\n\n现在，让我们关注给定的练习。最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ 项目 _34.4-10\n```cpp\n#include <iostream>\nusing namespace std;\nconst int CARS\
