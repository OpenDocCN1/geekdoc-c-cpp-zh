  \ `n` 输入了非正值，for 语句将执行零次迭代。\n\n### 26.3 复习题：对/错\n\n判断以下每个陈述的对错。\n\n1) 在 for 语句中，计数器的值在每次循环结束时自动递增或递减。\n\
