  | 3 | `s = 0` | | 5 | 13 | 0 |\n| 4 | `while (m2 != 0)` | 结果为真 | | | |\n| 5 | `if\
  \ (m2 % 2 != 0)` | 结果为真 | | | |\n| 6 | `s += m1` | | 5 | 13 | 5 |\n| 7 | `m1 *=\
  \ 2` | | 10 | 13 | 5 |\n| 8 | `m2 = (int)(m2 / 2)` | | 10 | 6 | 5 |\n| 9 | `while\
  \ (m2 != 0)` | 结果为真 | | | |\n| 10 | `if (m2 % 2 != 0)` | 结果为假 | | | |\n| 11 | `m1\
  \ *= 2` | | 20 | 6 | 5 |\n| 12 | `m2 = (int)(m2 / 2)` | | 20 | 3 | 5 |\n| 13 | `while\
  \ (m2 != 0)` | 结果为真 | | | |\n| 14 | `if (m2 % 2 != 0)` | 结果为真 | | | |\n| 15 | `s\
  \ += m1` | | 20 | 3 | 25 |\n| 16 | `m1 *= 2` | | 40 | 3 | 25 |\n| 17 | `m2 = (int)(m2\
  \ / 2)` | | 40 | 1 | 25 |\n| 18 | `while (m2 != 0)` | 结果为真 | | | |\n| 19 | `if (m2\
  \ % 2 != 0)` | 结果为真 | | | |\n| 20 | `s += m1` | | 40 | 1 | 65 |\n| 21 | `m1 *= 2`\
  \ | | 80 | 1 | 65 |\n| 22 | `m2 = (int)(m2 / 2)` | | 80 | 0 | 65 |\n| 23 | `while\
  \ (m2 != 0)` | 结果为假 | | | |\n| 24 | `cout << s << endl` | 显示值 65，这当然是乘法 5 × 13 的结果\
  \ | | | |\n\n#### 练习 30.5-4 寻找约数个数\n\n编写一个 C++ 程序，让用户输入一个正整数，然后显示其所有约数的总数。\n\n#####\
  \ 答案\n\n让我们来看一些例子。\n\n- 值 12 的约数是 1, 2, 3, 4, 6, 12。\n- 值 15 的约数是 1, 3, 5, 15。\n\
  - 值 20 的约数是 1, 2, 4, 5, 10, 20。\n- 值 50 的约数是 1, 2, 5, 10, 25, 50。\n\n如果变量 `x` 包含用户提供的整数，那么\
  \ `x` 的所有可能的约数都在 1 到 `x` 之间。因此，你只需要一个 `for`-循环，变量 `counter` 的值从 1 到 `x`，在每次迭代中，使用一个简单的选择结构来检查\
  \ `counter` 的值是否是 `x` 的约数。该 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.5-4a\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int x, numberOfDivisors,\
  \ i;\n    cin >> x;\n    numberOfDivisors = 0;\n    for (i = 1; i <= x; i++) {\n\
  \        if (x % i == 0) {\n            numberOfDivisors++;\n        }\n    }\n\
  \    cout << numberOfDivisors << endl;\n    return 0;\n}\n```\n\n该程序对于输入值 20 执行了\
  \ 20 次迭代。但是，如果它能执行少于一半的迭代并达到相同的的结果，不是更好吗？当然是！所以，让我们它更高效吧！\n\n正如你可能知道的，对于任何用户提供的整数（在变量\
  \ `x` 中）：\n\n- 值 1 总是一个约数。\n- 用户提供的整数始终是其自身的约数。\n- 除了用户提供的整数，在 1 到 `x` 范围的中点之后没有其他约数了。\n\
  \n因此，对于任何整数，显然有 2 个约数，即值 1 和用户提供的整数本身。因此，程序必须从值 2 开始，直到 1 到 `x` 范围的中点，检查其他可能的约数。改进后的\
  \ C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.5-4b\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int x, numberOfDivisors, i;\n\
  \    cin >> x;\n    numberOfDivisors = 2;\n    for (i = 2; i <= (int)(x / 2); i++)\
  \ {\n        if (x % i == 0) {\n            numberOfDivisors++;\n        }\n   \
  \ }\n    cout << numberOfDivisors << endl;\n    return 0;\n}\n```\n\n这个 C++ 程序执行的迭代少于上一个程序的一半！例如，对于输入值\
  \ 20，这个 C++ 程序仅执行了 $(20 - 2) / 2 = 9$ 次迭代！\n\n#### 练习 30.5-5 是否是质数？\n\n编写一个 C++\
  \ 程序，提示用户输入一个大于 1 的整数，然后显示消息指示该数是否为质数。质数是任何大于 1 且除 1 和自身外没有其他约数的整数。7、11 和 13 都是这样的数字。\n\
  \n##### 答案\n\n这个练习基于上一个。它非常简单！如果用户提供的整数只有两个约数（1 和它本身），那么这个数就是质数。C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_30.5-5a\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int x, numberOfDivisors, i;\n    cout << \"Enter an integer greater than\
  \ 1: \";\n    cin >> x;\n    numberOfDivisors = 2;\n    for (i = 2; i <= (int)(x\
  \ / 2); i++) {\n        if (x % i == 0) {\n            numberOfDivisors++;\n   \
  \     }\n    }\n    if (numberOfDivisors == 2) {\n        cout << \"Number \" <<\
  \ x << \" is prime\" << endl;\n    }\n    return 0;\n}\n```\n\n现在让我们让程序更高效。当发现第三个约数时，执行流可以跳出循环，因为这意味着用户提供的整数绝对不是质数。C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_30.5-5b\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int x, numberOfDivisors, i;\n    cout <<\
  \ \"Enter an integer greater than 1: \";\n    cin >> x;\n    numberOfDivisors =\
  \ 2;\n    for (i = 2; i <= (int)(x / 2); i++) {\n        if (x % i == 0) {\n   \
