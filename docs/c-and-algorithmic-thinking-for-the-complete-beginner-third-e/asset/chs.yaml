  cin >> x;\ncout << cube(x) + 1 / x << endl; //在 cout 语句中直接调用\n```\n\n![](img/notice.jpg)调用自定义函数就像调用\
  \ C++ 的内置函数一样。\n\n现在让我们来看另一个例子。下一个 C++ 程序定义了函数 `getMessage()`，然后主代码调用了它。返回值被赋值给变量\
