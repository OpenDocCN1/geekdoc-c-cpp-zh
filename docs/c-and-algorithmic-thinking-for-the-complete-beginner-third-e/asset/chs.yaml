  \ `Student` 类中，将 `finalGrade` 修改为私有字段 `_finalGrade`，并为其添加访问和设置方法。当字段设置为 A、B、C、D、E\
  \ 或 F 以外的值时抛出错误。\n\n\n\n\n你目前所看到的所有程序都可以被描述为“临时的”。尽管它们读取了某些输入数据并显示了一些输出结果，但所有的值都存储在计算机主内存（RAM）中的变量、数组和其他数据结构中；因此，当程序执行结束时，这些值将会丢失。即使没有发生这种情况，在你关闭电脑时它们也会丢失。然而，在许多情况下，你需要将这些值保存在更持久的存储设备中，例如硬盘驱动（HDD）或固态硬盘（SSD）。\n\
  \nC++ 可以读取存储在计算机文件中输入数据，也可以将输出结果写入相同或不同的文件中。这种读/写过程被称为文件 I/O（文件输入/输出），可以使用 C++ 的一些现成可用函数和方法来实现。\n\
  \n通常，使用的文件类型是文本文件。文本文件包含字符序列，并存储在持久性存储设备（HDD、SSD 等）中。\n\n![](img/notice.jpg)计算机编程中使用的另一种类型是“二进制文件”；但这种类型超出了本书的范围，将不再进行进一步分析。\n\
  \n在接下来的章节中，你将学习如何打开和关闭文本文件，如何从文本文件中读取值或向文本文件写入值，甚至学习如何在其中搜索一个值。\n\n### 40.2 打开文件\n\
  \n要使用文件（进行读取、写入或追加），首先需要做的是打开文件。在 C++ 中，这通过以下通用形式的语句来实现：\n\n```\nfstream descriptor;descriptor.open(filename,\
  \ [, mode]);\n```\n\n或者更简洁的语句：\n\n```\nfstream descriptor(filename, [, mode]);\n\
  ```\n\n其中\n\n- `fstream` 是定义在库 `fstream` 中的一个类。它用于从文本文件读取数据、向文本文件写入数据或追加数据。在 C++\
  \ 中无法直接访问，因此你需要包含 `fstream` 库。\n- `descriptor` 是文件对象的名称，可以用于从文件读取、写入或追加内容。\n- `filename`\
  \ 是一个字符串，包含存储在硬盘（或任何其他存储设备，如 SSD、Flash USB 盘等）中的文件夹（目录）和文件名。\n- `mode` 是一个定义了你想要访问文件\
  \ `filename` 方式的值。此参数是可选的。如果省略，它的默认值为 `fstream::in`。该参数的三个基本值如下表所示。\n\n| mode |\
  \ 说明 |\n| --- | --- |\n| `fstream::in` | 打开一个文本文件进行读取。文件指针指向文件的开头（位置 0）。 |\n| `fstream::out`\
  \ | 打开一个文本文件进行写入。如果文件名已存在，C++ 将覆盖它；否则，C++ 将创建一个新文件。 |\n| `fstream::app` | 打开一个文本文件进行追加，保留文件中之前的任何内容。文件指针指向文件的末尾。如果文件名不存在，C++\
  \ 将创建一个新文件。 |\n\n![](img/notice.jpg)在某种程度上，文件指针可以类比为数组的索引。你将在第 40.5 节学习更多关于文件指针的知识。\n\
  \n让我们来看一些例子。\n\n**示例 1**\n\n以下语句\n\n```cpp\nfstream f(\"names.txt\", fstream::in);\
  \    //等同于：fstream f(\"names.txt\")\n```\n\n打开文本文件“names.txt”进行读取。文本文件“names.txt”必须存在于保存可执行文件（.exe）的相同的文件夹（目录）中。\n\
  \n**示例 2**\n\n该语句\n\n```cpp\nfstream fgrades(\"c:/temp/grades.txt\", fstream::out);\n\
  ```\n\n在文件夹（目录）“c:/temp”中创建文本文件“grades.txt”并打开进行写入。如果文件已存在，C++ 将覆盖它。\n\n![](img/notice.jpg)注意，文件的路径定义使用斜杠（\
  \ / ）而不是反斜杠（ \\ ）字符。\n\n**示例 3**\n\n该语句\n\n```cpp\nfstream fgrades(\"c:/temp/students/grades.txt\"\
  , fstream::app);\n```\n\n打开文本文件“grades.txt”进行追加。该文件必须存在于文件夹（目录）“c:/temp”的子文件夹（子目录）“students”中。如果文件不存在，C++\
  \ 将创建一个新文件。\n\n### 40.3 关闭文件\n\n在完成文件的读取、写入或追加操作后，使用 `close()` 方法关闭文件关重要。该方法表示文件的使用已完成，引导操作系统（OS）保存主内存（RAM）中可能存在的任何未保存数据。`close()`\
  \ 方法的通用形式如下：\n\n```\ndescriptor.close();\n```\n\n其中 `descriptor` 是文件对象。\n\n来看一些例子。\n\
  \n**示例 1**\n\n以下代码片段\n\n```cpp\nfstream f(\"names.txt\", fstream::in);\n```\n\n\
  打开文本文件“names.txt”进行读取。文本文件“names.txt”必须存在于保存可执行文件（.exe）的相同的文件夹（目录）中。\n\n**示例 2**\n\
  \n该语句\n\n```cpp\nfstream fgrades(\"c:/temp/grades.txt\", fstream::out);\n```\n\n\
  在文件夹（目录）“c:/temp”中创建文本文件“grades.txt”并打开进行写入。如果文件已存在，C++ 将覆盖它。\n\n![](img/notice.jpg)注意，文件的路径定义使用斜杠（\
  \ / ）而不是反斜杠（ \\ ）字符。\n\n**示例 3**\n\n该语句\n\n```cpp\nfstream fgrades(\"c:/temp/students/grades.txt\"\
  , fstream::app);\n```\n\n打开文本文件“grades.txt”进行追加。该文件必须存在于文件夹（目录）“c:/temp”的子文件夹（子目录）“students”中。如果文件不存在，C++\
  \ 将创建一个新文件。\n\n### 40.4 在文件中写入（或追加）\n\n要向文件中写入（或甚至追加）一个值，可以使用以下通用形式的语句：\n\n```\n\
  descriptor << value;\n```\n\n其中\n\n- `descriptor` 是文件对象的名称，可以用于从文件读取、写入或追加内容。\n\
  - `value` 是你想写入（或追加）到文件的值（字符串、整数或浮点数）。\n\n接下来的示例在文件夹（目录）“c:/temp”中创建文件“40.4”。如果文件已存在，C++\
  \ 将覆盖它；否则，C++ 将创建一个新文件。然后程序在文件中写入三个字符串。\n\n![](img/my_exercise_header.png) project40.4a\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nconst string\
  \ PATH = \"c:/temp/\";\nint main() {\n    fstream fout(PATH + \"40.4\", fstream::out);\n\
  \    fout << \"Good Morning\";\n    fout << \"Good Evening\";\n    fout << \"Good\
  \ Night\";\n    fout.close();\n    return 0;\n}\n```\n\n![](img/notice.jpg)在 C++\
  \ 中无法直接访问 fstream，因此你需要包含 `fstream` 库。\n\n尝试执行上面的程序，然后定位并打开（使用记事本程序）最近创建的“c:/temp/40.4”文件。你在文件中看到：\n\
  \nGood MorningGoodEveningGood Night\n\n三个字符串都在同一行。这是是因为插入运算符（`<<`）不会在字符串末尾自动添加“换行”。\n\
  \n要强制 C++ 写入“换行”，可以使用 `endl` 操纵（在第 6.2 节中介绍）。下一个示例对之前创建的文件“c:/temp/40.4”进行追加。随后，写入了一个换行符以及三行文本。\n\
  \n![](img/my_exercise_header.png) project40.4b\n```cpp\n#include <iostream>\n#include\
  \ <fstream>\nusing namespace std;\nconst string PATH = \"c:/temp/\";\nint main()\
  \ {\n    fstream fout(PATH + \"40.4\", fstream::app);\n    fout << endl;\n    fout\
  \ << \"Hello!\" << endl;\n    fout << \"Hi!\" << endl;\n    fout << \"Bye!\" <<\
  \ endl;\n    fout.close();\n    return 0;\n}\n```\n\n如果你执行此程序，然后用记事本程序打开“c:/temp/40.4”文件，你现在将看到以下内容：\n\
  \nGood MorningGood EveningGood Night\nHello!\nHi!\nBye!\n\n![](img/notice.jpg)第一行“Good\
  \ MorningGood EveningGood Night”在打开文件进行追加之前就已经于文件中。\n\n\n\n下一个示例在 `c:/temp` 文件夹中创建\
  \ `f_data40.4-ii.txt` 文件。如果文件 `f_data40.4-ii.txt` 已经存在，C++ 将覆盖它；否则，C++ 将创建一个新文件。然后，程序会在文件中分\
  \ 10 行每行写入 10 个字符串。\n\n![](img/my_exercise_header.png) project_40.4c\n```cpp\n#include\
  \ <iostream>\n#include <fstream>\nusing namespace std;\nconst string PATH = \"c:/temp/\"\
  ;\nint main() {\n    int i;\n    fstream fout(PATH + \"f_data40.4-ii.txt\", fstream::out);\n\
  \    for (i = 1; i <= 10; i++) {\n        fout << \"Line \" << i << endl;\n    }\n\
  \    fout.close();\n    return 0;\n}\n```\n\n### 40.5 文件指针\n\n如前所述，文件指针与数组索引非常相似。它们都用于指定读取信息或写入新信息的位置。然而，文件指针与数组索引之间的主要区别在于，前者在每次执行读取或写入操作时都会自动移动。\n\
  \n假设一个文件已经包含了消息“HELLO JOHN\\nHI ALL!”。如果你打开这个特定文件进行读取，文件指针将自动放置在文件的开头，如下所示。\n\n\
  ![Image](img/chapter40-01.png)\n\n如果你现在执行读取操作（如下一节所述），读取将从文件指针指示的位置开始，指针将自动向末尾移动，其移动的位移与你读取的字符数相同。下面显示了如果你从文件中读取一行，文件指针将所处的位置。\n\
  \n![Image](img/chapter40-02.png)\n\n![](img/notice.jpg)接下来的读取操作将从单词“HI”开始的位置开始。\n\
  \n相反，如果你以追加模式打开文件，文件指针将自动定位在文件的末尾，如图所示：\n\n![Image](img/chapter40-03.png)\n\n如果你稍后执行写入操作，写入将从文件指针指示的位置开始，指针将自动向末尾移动，其移动的位移与你在文件中写入的字符数相同。\n\
  \n![Image](img/chapter40-04.png)\n\n### 40.6 从文件中读取\n\n假设文件 `f_data40.6.txt` 包含以下文本。\n\
  \n15.3 15 Round the number down\n22.6 23 Round the number up\n55.5 56 Round the\
  \ number up again\n\n#### 读取到当前行结束\n\n要读取从文件的当前位置到当前行末尾的所有字符，并将它们赋值给变量 `var_name_str`，可以使用以下通用形式的语句：\n\
  \n`getline(descriptor, var_name_str);`\n\n其中：\n\n- `descriptor` 是用于打开文件的文件对象的名称。\n\
  - `var_name_str` 可以是任何 `string` 类型的变量。\n\n接下来的程序将文件 `f_data40.6.txt` 的三行赋值给变量 `s1`、`s2`\
  \ 和 `s3`。\n\n![](img/my_exercise_header.png) project_40.6a\n```cpp\n#include <iostream>\n\
