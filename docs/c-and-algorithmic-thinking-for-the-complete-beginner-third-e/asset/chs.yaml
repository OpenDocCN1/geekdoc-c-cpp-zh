  \n修改 Section 39.7 – 类继承的 C++ 程序如下：\n\ni)在 `SchoolMember` 类中，将 `name` 和 `age` 修改为私有字段\
  \ `_name` 和 `_age`，并分别为它们添加访问器和设置方法。当 `name` 设置为空值时抛出错误，而 `age` 设置为负值时必须抛出错误。\n\
