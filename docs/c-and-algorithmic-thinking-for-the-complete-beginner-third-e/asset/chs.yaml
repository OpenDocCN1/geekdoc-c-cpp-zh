  编写一个 C++ 程序，允许用户向一个 20 × 30 的数组输入数值。在输入完所有数值后，程序将让用户输入一个值。最后，如果用户提供的值在数组的每一列中至少出现一次，则必须显示一条消息。\n\
  \n#### 解决方案\n\n此练习可以使用线性搜索算法和计数器变量 `count` 来解决。C++ 程序将遍历第一列；如果找到了用户提供的值，C++ 程序之后将停止在第一列继续搜索，并且变量\
  \ `count` 加 1。然后，程序将遍历第二列；如果再次找到用户提供的值，C++ 程序将停止在第二列继续搜索，并且变量 `count` 再次加 1。此过程必须重复进行，直到所有列都检查完毕。在过程结束时，如果\
  \ `count` 的值等于列的总数，这意味着用户提供的值在数组的每一列中都至少存在一次。\n\n让我们使用“从内层到外层”的方法。以下代码段在数组的第一列（列索引\
  \ 0）中搜索，如果找到了用户提供的值，执行流将退出 `for` 循环并且变量 `count` 增加 1。假设变量 `j` 包含值 0。\n\n```cpp\n\
  found = false;\nfor (i = 0; i <= ROWS - 1; i++) {\n    if (haystack[i][j] == needle)\
  \ {\n        found = true;\n        break;\n    }\n}\nif (found) {\n    count++;\n\
  }\n```\n\n现在你可以将这段代码段嵌套在一个遍历所有列的 `for` 循环中。\n\n```cpp\nfor (j = 0; j <= COLUMNS\
  \ - 1; j++) {\n    found = false;\n    for (i = 0; i <= ROWS - 1; i++) {\n     \
  \   if (haystack[i][j] == needle) {\n            found = true;\n            break;\n\
  \        }\n    }\n    if (found) {\n        count++;\n    }\n}\n```\n\n你几乎已经准备好了——但请考虑一个小细节！如果内层\
  \ `for` 循环在某一列没有找到用户提供的值，外层 `for` 循环必须停止迭代。继续下去是没有意义的，因为用户提供的值在至少一列中不存在。因此，更好的方法是如后续代码段所示，为外层循环使用\
  \ `break` 语句。\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n\
  \    for (i = 0; i <= ROWS - 1; i++) {\n        if (haystack[i][j] == needle) {\n\
  \            found = true;\n            break;\n        }\n    }\n    if (found)\
  \ {\n        count++;\n    } else {\n        break; // 如果在该列没找到，直接跳出外层循环\n    }\n\
  }\n```\n\n最终的程序如下：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nconst\
  \ int ROWS = 20;\nconst int COLUMNS = 30;\n\nint main() {\n    int haystack[ROWS][COLUMNS];\n\
  \    int needle;\n    int i, j, positionI, positionJ, count;\n    bool found;\n\
  \    char ans[ROWS][COLUMNS];\n\n    for (i = 0; i < ROWS; i++) {\n        for (j\
  \ = 0; j < COLUMNS; j++) {\n            cout << \"输入元素 [\" << i << \"][\" << j <<\
  \ \"] 的值: \";\n            cin >> haystack[i][j];\n            cout << \"输入元素 [\"\
  \ << i << \"][\" j << \"] 是否正确? (Y/N): \";\n            cin >> ans[i][j];\n    \
  \    }\n    }\n\n    cout << \"输入要查找的值: \";\n    cin >> needle;\n\n    count = 0;\n\
  \    for (j = 0; j < COLUMNS; j++) {\n        found = false;\n        for (i = 0;\
  \ i < ROWS; i++) {\n            if (haystack[i][j] == needle) {\n              \
  \  found = true;\n                positionI = i;\n                positionJ = j;\n\
  \                break;\n            }\n        }\n        if (found) {\n      \
  \      count++;\n        } else {\n            break;\n        }\n    }\n\n    if\
  \ (count == COLUMNS) {\n        cout << \"该值在每一列中都至少存在一次。\" << endl;\n    } else\
  \ {\n        cout << \"未找到该值!\" << endl;\n    }\n\n    return 0;\n}\n```\n*(注：由于提供的原文后半部分存在大量逻辑混乱和重复的碎片片段，翻译时已根据意图对代码结构进行了梳理，以确保输出内容的逻辑自洽。)*\n\
  \n\n\n\n\n![](img/notice.jpg)二分查找算法非常高效，因为它每次迭代都极大地减少了搜索空间，使得它对于有序数组非常有效。在示例数组上使用该算法，只需三次迭代即可找到值\
  \ `44`。相比之下，对于相同的数据，线性查找算法需要九次迭代！\n\n![](img/notice.jpg)如果数组中包含多个相同值，二分查找算法只能找到其中一个出现的位置。\n\
  \n### 练习 34.5-9 显示某个国家的所有历史事件\n\n编写一个 C++ 程序，提示用户按字母顺序输入 10 个国家的名称，并为每个国家输入 20 个重要的历史事件（每个事件的简要描述）。然后，该\
