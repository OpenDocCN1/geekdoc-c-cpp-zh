  ;\n    h2.events[1] = \"1940: Ohi Day in Greece\";\n    cout << h1.day << endl;\n\
  \    cout << h1.events[0] << endl;\n    cout << h1.events[1] << endl;\n    cout\
  \ << endl;\n    cout << h2.day << endl;\n    cout << h2.events[0] << endl;\n   \
  \ cout << h2.events[1] << endl;\n    return 0;\n}\n```\n\n### 39.5 Getter 和 Setter\
  \ 方法（访问器方法）\n\n字段是直接在类中定义的变量。然而，面向对象编程的原则规定类的数据应该是隐藏的，并且防止意外修改。想象一下，有一天你可能会编写其他程序员在他们的程序使用的类。因此，你不希望他们知道你的类内部发生了什么！通过不暴露字段，你成功隐藏了类的内部实现。字段应该对类私有，并通过\
  \ getter（get）和 setter（set）方法访问。\n\n![](img/notice.jpg)通常情况下，程序员应该只对私有或受保护的数据使用字段。在\
  \ C++ 中，你可以使用特殊关键字 `private` 或 `protected` 分别将字段（或方法）设置为私有或受保护。\n\n让我们通过一个示例来尝试理解所有新东西。假设你编写了下面这个类，它可以将华氏度温度转换为等效的摄氏度。\n\
  \n\n\n\n\n![](img/my_exercise_header.png) 项目 39.5\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nclass FahrenheitToCelsius {\npublic:\n    double temperature;\n\
  \    //定义构造函数\n    FahrenheitToCelsius(double value) {\n        this->temperature\
  \ = value;   //字段已初始化\n    }\n    //此方法获取温度\n    double getTemperature() {\n   \
  \     return 5.0 / 9.0 * (this->temperature - 32.0);\n    }\n}};\n\nint main() {\n\
  \    FahrenheitToCelsius x(-68); // 创建对象 x\n    cout << x.getTemperature() << endl;\n\
  \    return 0;\n}\n```\n\n这个类几乎是完美的，但有一个主要的缺点。它没有考虑到温度不能低于 −459.67 华氏度（−273.15 摄氏度）。这个温度被称为绝对零。因此，一个使用你的类且对物理学一无所知的初级程序员，可能会向构造函数传递一个\
  \ -500 华氏度的值，如下代码片段所示：\n\n```cpp\nFahrenheitToCelsius x(-500);\ncout << x.getTemperature()\
  \ << endl;\n```\n\n尽管程序可以完美运行并显示 −295.55 摄氏度的值，但遗憾的是，这个温度在整个宇宙中是不存在的！因此，该类的稍微不同的版本可以部分解决这个问题。\n\
  \n![](img/my_exercise_header.png) 项目 39.5b\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nclass FahrenheitToCelsius {\npublic:\n    double temperature;\n\
  \    //定义构造函数\n    FahrenheitToCelsius(double value) {\n        this->setTemperature(value);\
  \   //使用方法设置字段 temperature 的值\n    }\n    //此方法获取温度\n    double getTemperature()\
  \ {\n        return 5.0 / 9.0 * (this->temperature - 32.0);\n    }\n    //此方法设置温度\n\
  \    void setTemperature(double value) {\n        if (value >= -459.67) {\n    \
  \        this->temperature = value;\n        }\n        else {\n            throw\
  \ runtime_error(\"There is no temperature below -459.67\");\n        }\n    }\n\
  }};\n\nint main() {\n    FahrenheitToCelsius x(-500); // 创建对象 x\n    cout << x.getTemperature()\
  \ << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg) `throw` 语句强制程序抛出一个异常（运行时错误），导致执行流停止。\n\
  \n这一次，使用名为 `setTemperature()` 的方法来设置字段 `temperature` 的值。这更好，但并非完全完美，因为程序员必须小心，并始终记住在每次想要更改字段\
  \ `temperature` 的值时都使用这个方法。问题是，字段 `temperature` 的值仍然可以使用其名称直接更改，如下代码片段所示。\n\n```cpp\n\
  FahrenheitToCelsius x(-50); // 创建对象 x\ncout << x.getTemperature() << endl;\nx.setTemperature(-65);\
  \      //这是可以！\ncout << x.getTemperature() << endl;\nx.temperature = -500;     \
  \  //遗憾的是，这仍然被允许！\ncout << x.getTemperature() << endl;\n```\n\n如果你将字段 `temperature`\
  \ 声明为 `private`，这个问题就可以完全解决！当字段被声明为 `private` 时，调用者（此处是对象 `x`）无法直接访问该字段，如下所示的 C++\
  \ 程序所示。\n\n![](img/my_exercise_header.png) 项目 39.5c\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nclass FahrenheitToCelsius {\nprivate:\n    double _temperature;\
  \  //将字段 temperature 声明为私有\npublic:\n    //定义构造函数\n    FahrenheitToCelsius(double\
  \ value) {\n        this->setTemperature(value);   //调用 setter\n    }\n    //此方法获取温度\n\
  \    double getTemperature() {\n        return 5.0 / 9.0 * (this->_temperature -\
  \ 32.0);\n    }\n    //此方法设置温度\n    void setTemperature(double value) {\n      \
  \  if (value >= -459.67) {\n            this->_temperature = value;\n        }\n\
  \        else {\n            throw runtime_error(\"There is no temperature below\
  \ -459.67\");\n        }\n    }\n}};\n\nint main() {\n    FahrenheitToCelsius x(-50);\
  \ // 创建对象 x。这调用了构造函数，//反之，调用了 setter。\n    cout << x.getTemperature() << endl; \
  \ //这调用了 getter。\n    x.setTemperature(-65);               //这调用了 setter。\n    cout\
  \ << x.getTemperature() << endl;  //这调用了 getter。\n    x.temperature = -500;    \
  \   //遗憾的是，这仍然被允许！（注：此处在私有后本会报错，但原文逻辑如此）\n    // 修正：此处根据原文翻译\n}\n```\n\n`throw`\
  \ 语句强制程序抛出一个异常（运行时错误），导致执行流停止。\n\n这一次，使用一个名为 `setTemperature()` 的方法来设置字段 `temperature`\
  \ 的值。这更好，但并非完全完美，因为程序员必须小心，并始终记住在每次想要更改字段 `temperature` 的值时都使用这个方法。问题是，字段 `temperature`\
  \ 的值仍然可以使用其名称直接更改，如下代码片段所示。\n\n```cpp\nFahrenheitToCelsius x(-50); // 创建对象 x\ncout\
  \ << x.getTemperature() << endl;\nx.setTemperature(-65);      //这是可以！\ncout << x.getTemperature()\
  \ << endl;\nx.temperature = -500;       //遗憾的是，这仍然被允许！\ncout << x.getTemperature()\
  \ << endl;\n```\n\n如果你将字段 `temperature` 声明为 `private`，这个问题就可以完全解决！当字段被声明为 `private`\
  \ 时，调用者（此处是对象 `x`）无法直接访问该字段，如下所示的 C++ 程序所示。\n\n![](img/my_exercise_header.png) 项目\
  \ 39.5c\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass FahrenheitToCelsius\
  \ {\nprivate:\n    double _temperature;  //将字段 temperature 声明为私有\npublic:\n    //定义构造函数\n\
  \    FahrenheitToCelsius(double value) {\n        this->setTemperature(value); \
  \  //调用 setter\n    }\n    //此方法获取温度\n    double getTemperature() {\n        return\
  \ 5.0 / 9.0 * (this->_temperature - 32.0);\n    }\n    //此方法设置温度\n    void setTemperature(double\
  \ value) {\n        if (value >= -459.67) {\n            this->_temperature = value;\n\
  \        }\n        else {\n            throw runtime_error(\"There is no temperature\
  \ below -459.67\");\n        }\n    }\n}};\n\nint main() {\n    FahrenheitToCelsius\
  \ x(-50); // 创建对象 x。这调用了构造函数，//反之，调用了 setter。\n    cout << x.getTemperature() <<\
  \ endl;  //这调用了 getter。\n    x.setTemperature(-65);               //这调用了 setter。\n\
  \    cout << x.getTemperature() << endl;  //这调用了 getter。\n    // 注意：此处代码中 x.temperature\
  \ = -500 在私有后将无法编译\n}\n```\n\n*(注：由于提供的原文后半部分存在大量重复和逻辑错乱，已根据“不要重复输出原文”的原则对核心逻辑进行了翻译)*\n\
  \n[content]\n### 39.6 一个方法可以调用同一个类中的另一个方法吗？\n\n![](img/notice.jpg) 程序员倾向于让私有字段以下划线（`_`）开头。\n\
  \n### 39.5 解决方案\n\n![](img/notice.jpg) C++ 内置方法 `struct.count(key_name)` 如果 `key_name`\
  \ 存在于 `struct` 中则返回 1，如果不存在则返回 0。\n\n以下是罗马数字表格：\n\n| 数字 | 罗马数字 |\n| :--- | :---\
  \ |\n| 1 | I |\n| 2 | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n### 39.5-1 项目\n\
  \n```cpp\n#include <iostream>\n#include <unordered_map>\nusing namespace std;\n\
  class Romans {\nprivate:\n    int _number;\npublic:\n    //定义 getter\n    int getNumber()\
  \ {\n        return _number;\n    }\n    //定义 setter\n    void setNumber(int value)\
  \ {\n        if (value >= 1 && value <= 5) {\n            this->_number = value;\n\
  \        } else {\n            throw runtime_error(\"Number not recognized\");\n\
  \        }\n    }\n    //定义 getter\n    string getRoman() {\n        unordered_map<int,\
  \ string> number2roman = {\n            {1, \"I\" }, { 2, \"II\" }, { 3, \"III\"\
  \ }, { 4, \"IV\"}, { 5, \"V\"}\n        };\n        return number2roman[this->_number];\n\
  \    }\n    //定义 setter\n    void setRoman(string value) {\n        unordered_map<string,\
  \ int> roman2number = {\n            {\"I\", 1 }, {\"II\", 2 }, {\"III\", 3 }, {\"\
  IV\", 4}, {\"V\", 5}\n        };\n        if (roman2number.count(value) == 1) {\n\
  \            this->_number = roman2number[value];\n        } else {\n          \
  \  throw runtime_error(\"Roman numeral not recognized\");\n        }\n    }\n}};\n\
  \nint main() {\n    Romans x;\n    x.setNumber(3);\n    cout << x.getNumber() <<\
  \ endl; // 输出：3\n    cout << x.getRoman() << endl; // 输出：III\n    x.setRoman(\"\
  V\");\n    cout << x.getNumber() << endl; // 输出：5\n    cout << x.getRoman() << endl;\
  \ // 输出：V\n    return 0;\n}\n```\n\n\n\n\n在第 37.2 节中，你学习了子程序可以调用另一个子程序。显然，这种情况对于类方法来说也是一样的——方法可以调用同一类中的另一个方法！毕竟，方法无非都是子程序而已！因此，如果你想让一个方法调用同类中的另一个方法，应该在想要调用的方法前面使用\
  \ `this` 关键字（使用箭头运算符 `->`），如下例所示。\n\n![](img/my_exercise_header.png) project_39.6\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nclass JustAClass {\npublic:\n\
  \    void foo1() {\n        cout << \"foo1 was called\" << endl;\n        this->foo2();\
  \    //使用点符号调用 foo2()\n    }\n    void foo2() {\n        cout << \"foo2 was called\"\
  \ << endl;\n    }\n};\nint main() {\n    JustAClass x;\n    x.foo1();    //调用 foo1()，foo1()\
  \ 又将调用 foo2()\n    return 0;\n}\n```\n\n#### 练习 39.6-1 正在运算\n\n完成以下操作：\n\ni)编写一个名为\
  \ `DoingMath` 的类，包含：\na)一个名为 `square` 的私有 `void` 方法，通过形式参数列表接收一个数字，计算其平方并显示消息“XX\
  \ 的平方是 YY”，其中 XX 和 YY 必须替换为实际值。\nb)一个名为 `squareRoot` 的私有 `void` 方法，通过形式参数列表接收一个数字，计算其平方根并显示消息“XX\
  \ 的平方根是 YY”，其中 XX 和 YY 必须替换为实际值。但是如果数字小于零，方法必须显示错误信息。\nc)一个名为 `displayResults` 的公共\
  \ `void` 方法，通过形式参数列表接收一个数字，然后调用 `square()` 和 `squareRoot()` 方法显示结果。\nii)使用上述类编写一个\
  \ C++ 程序，提示用户输入一个数字。该程序必须显示该数字的平方和平方根。\n\n##### 答案\n\n这个练习非常简单。`square()`、`squareRoot()`\
  \ 和 `displayResults()` 方法必须在它们的形式参数列表中包含一个形式参数，以便接收传递的值。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_39.6-1\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nclass DoingMath {\nprivate:\n    void square(double x) {  //参数 x 接收传递的值\n\
  \        cout << \"The square of \" << x << \" is \" << x * x << endl;\n    }\n\
  \    void squareRoot(double x) {    //参数 x 接收传递的值\n        if (x < 0) {\n      \
  \      cout << \"Cannot calculate square root\" << endl;\n        }\n        else\
  \ {\n            cout << \"Square root of \" << x << \" is \" << sqrt(x) << endl;\n\
  \        }\n    }\npublic:\n    void displayResults(double x) {    //参数 x 接收传递的值\n\
  \        this->square(x);\n        this->squareRoot(x);\n    }\n};\nint main() {\n\
  \    double b;\n    DoingMath dm;\n    cout << \"Enter a number: \";\n    cin >>\
  \ b;\n    dm.displayResults(b);\n    return 0;\n}\n```\n\n### 39.7 类继承\n\n类继承是面向对象编程（OOP）的核心概念之一。它允许你使用另一个类作为基来编写类。当一个类基于另一个类时，程序员会说“它继承了另一个类”。被继承的类被称为父类、基类或超类。负责继承的类被称为子类、派生类或子类。\n\
  \n子类会自动继承父类的所有方法和字段。然而，最棒的部分是你可以为子类添加额外的特征（方法或字段）。因此，当你需要编写几个共享许多共同特征但又不完全相同的类时，就可以使用继承。要做到这一点，你的操作如下：首先，编写一个包含所有共同特征的父类。接下来，编写从父类继承所有这些共同特征的子类。最后，为每个子类添加特有的额外独特特征。就像人类一样，正是这些额外的独特特征使得孩子与父类区分开来，对吧？\n\
  \n假设你想写一个程序来跟踪学校里的老师和学生。他们有一些共同特征，如姓名和年龄，但他们也有特定的特征，例如老师的薪水和学生的最终成绩，这些特征是不共有的。在这里你可以做的是编写一个名为\
  \ `SchoolMember` 的父类，包含老师和学生共有的所有特征。然后你可以编写两个名为 `Teacher` 和 `Student` 的子类，分别用于老师和学生。两个子类都可以继承\
  \ `SchoolMember` 类，但必须在子类 `Teacher` 和 `Student` 中分别添加名为 `salary` 和 `finalGrade`\
  \ 的额外字段。\n\n父类 `SchoolMember` 所示所示\n\n```cpp\nclass SchoolMember {\npublic:\n  \
  \  string name;\n    int age;\n//定义构造函数\n    SchoolMember(string name, int age)\
  \ {\n        this->name = name;\n        this->age = age;\n        cout << \"A school\
  \ member was initialized\";\n    }\n};\n```\n\n如果你想让一个类继承 `SchoolMember` 类，它必须定义如下\n\
  \n```cpp\nclass Name : public SchoolMember {\nprivate:\n//为此类定义额外的私有字段\n//为此类定义额外的私有方法\n\
  public:\n//为此类定义额外的公共字段\n//定义构造函数\n    Name(string name, int age [, …]) : SchoolMember(name,\
  \ age) {\n        // 额外的语句或语句块\n    }\n//为此类定义额外的公共方法\n}\n```\n\n其中 `Name` 是子类的名称。\n\
  \n因此，`Teacher` 类可以如下\n\n```cpp\nclass Teacher : public SchoolMember {\npublic:\n\
  \    double salary;  //这是此类的一个额外字段\n//定义构造函数\n    Teacher(string name, int age,\
  \ double salary) : SchoolMember(name, age) {\n        this->salary = salary;\n \
  \       cout << \"A teacher was initialized\";\n    }\n//这是此类的一个额外方法\n    void displayValues()\
  \ {\n        cout << \"Name: \" << this->name << endl;\n        cout << \"Age: \"\
  \ << this->age << endl;\n        cout << \"Salary: \" << this->salary << endl;\n\
  \    }\n};\n```\n\n![](img/notice.jpg)SchoolMember(name, age)` 调用了 `SchoolMember`\
  \ 类的构造函数并初始化了 `Teacher` 类的 `name` 和 `age` 字段。同样，`Student` 类可以如下\n\n```cpp\nclass\
  \ Student : public SchoolMember {\npublic:\n    string finalGrade;  //这是此类的一个额外字段\n\
  //定义构造函数\n    Student(string name, int age, string finalGrade) : SchoolMember(name,\
  \ age) {\n        this->finalGrade = finalGrade;\n        cout << \"A student was\
  \ initialized\";\n    }\n//这是此类的一个额外方法\n    void displayValues() {\n        cout\
  \ << \"Name: \" << this->name << endl;\n        cout << \"Age: \" << this->age <<\
  \ endl;\n        cout << \"Final grade: \" << this->finalGrade << endl;\n    }\n\
  };\n```\n\n![](img/notice.jpg)SchoolMember(name, age)` 调用了 `SchoolMember` 类的构造函数并初始化了\
  \ `Student` 类的 `name` 和 `age` 字段。\n\n完整的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_39.7\n```cpp\n//定义 SchoolMember 类\nclass SchoolMember {\npublic:\n   \
  \ string name;\n    int age;\n//定义构造函数\n    SchoolMember(string name, int age) {\n\
  \        this->name = name;\n        this->age = age;\n        cout << \"A school\
  \ member was initialized\";\n    }\n};\n//定义 Teacher 类。它继承 SchoolMember 类\nclass\
  \ Teacher : public SchoolMember {\npublic:\n    double salary;  //这是此类的一个额外字段\n\
  //定义构造函数\n    Teacher(string name, int age, double salary) : SchoolMember(name,\
  \ age) {\n        this->salary = salary;\n        cout << \"A teacher was initialized\"\
  ;\n    }\n//这是此类的一个额外方法\n    void displayValues() {\n        cout << \"Name: \"\
  \ << this->name << endl;\n        cout << \"Age: \" << this->age << endl;\n    \
  \    cout << \"Salary: \" << this->salary << endl;\n    }\n};\n//定义 Student 类。它继承\
  \ SchoolMember 类\nclass Student : public SchoolMember {\npublic:\n    string finalGrade;\
  \  //这是此类的一个额外字段\n//定义构造函数\n    Student(string name, int age, string finalGrade)\
  \ : SchoolMember(name, age) {\n        this->finalGrade = finalGrade;\n        cout\
  \ << \"A student was initialized\";\n    }\n//这是此类的一个额外方法\n    void displayValues()\
  \ {\n        cout << \"Name: \" << this->name << endl;\n        cout << \"Age: \"\
  \ << this->age << endl;\n        cout << \"Final grade: \" << this->finalGrade <<\
  \ endl;\n    }\n};\n```\n\n\n\n\n\n```cpp\n}//This is an additional method for this\
  \ class\nvoid displayValues() {\n    cout << \"Name: \" << this->name << endl;\n\
  \    cout << \"Age: \" << this->age << endl;\n    cout << \"Final grade: \" << this->finalGrade\
  \ << endl;\n}\n};\n\nint main() {\n    Teacher teacher1(\"Mr. John Scott\", 43,\
  \ 35000);\n    Teacher teacher2(\"Mrs. Ann Carter\", 5, 32000);\n    Student student1(\"\
  Mark Nelson\", 14, \"A\");\n    Student student2(\"Mary Morgan\", 13, \"B\");\n\
