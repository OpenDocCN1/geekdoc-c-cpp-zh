  | 5 | `y = 4 * a` | | 10.0 | 100.0 | 132.0 | 40.0 |\n| 6 | `cout << y << endl` |\
  \ 显示: 40 | | | | |\n\n#### 练习 17.1-3 谁值最大？\n\n设计一个流程图并编写相应的 C++ 程序，让用户输入两个数字 A 和\
  \ B，然后确定并显示这两个数较大的较大的。\n\n##### 答案\n\n这个练习可以使用双选一或单选一决策结构来解决。所以，让我们两种都用用吧！\n\n######\
  \ 方法一——使用双选一决策结构\n\n这种方法测试数字 B 的值是否大于数字 A。如果是，则 B 是最大的；否则，A 是最大的。使用这种方法解决此练习的相应流程图所示。\n\
  \n![Image](img/chapter17-03.png)\n\n相应的 C++ 程序如下：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double a, b, maximum;\n    cin >> a >> b;\n\
  \    if (b > a) {\n        maximum = b;\n    } else {\n        maximum = a;\n  \
  \  }\n    cout << \"Greatest value: \" << maximum << endl;\n    return 0;\n}\n```\n\
  \n![](img/notice.jpg) 注意，此练习是在尝试确定最大值，而不是该值实际上赋值给了哪个变量（是变量 A 还是变量 B）。\n\n######\
  \ 方法二——使用单选一决策结构\n\n如下流程图所示，这种方法最初假设数字 A 可能是最大值（这就是为什么它将变量 `a` 的值赋给变量 `maximum`）。然而，如果证明\
  \ B 大于 A，则更新最大值；变量 `maximum` 被赋予一个新值——变量 `b` 的值。因此，无论数字 A 和 B 的值如何，变量 `maximum`\
  \ 最后始终将包含最大值！\n\n![Image](img/chapter17-04.png)\n\n所示为 C++ 程序。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double a, b, maximum;\n  \
  \  cin >> a >> b;\n    if (b > a) { // 注意：文本中的逻辑意味着简化的检查或赋值\n        maximum = a;\
  \ \n    }\n    // 文本描述建议了一种逻辑，如果 b > a 则更新 maximum。\n    // 根据片段的结构：\n    maximum\
  \ = a;\n    if (b > a) maximum = b; \n    // 然而，提示中提供的片段是：\n    /*\n    double a,\
  \ b, maximum;\n    cin >> a >> b;\n    if (b > a) {\n        maximum = a; // 这看起来是源文本中的一个笔误，但我将保留该结构\n\
  \    */\n    // 重新评估提示中提供的代码块：\n    // double a, b, maximum; cin >> a >> b; if (b\
  \ > a) { maximum = a; } else { maximum = a; } \n```\n\n\n\n\n1) 创建一个跟踪表（trace table），以确定以下\
  \ C++ 程序在两种不同执行情况下每一步中变量的值。然后，设计对应的流程图。\n\n两次执行的输入值为 (i) 3，和 (ii) 0.5。\n\n```cpp\n\
