  \n### 8.1 什么是追踪表？\n\n追踪表是一种用于测试算法或计算机程序在执行过程中出现的逻辑错误的技术。追踪表模拟了执行流。语句逐条执行，当执行赋值语句时，变量的值会发生变化。\n\
  \n追踪表具有教学意义。初学者通常使用它们来帮助他们可视化特定算法或程序的工作原理，并协助他们检测逻辑错误。\n\n这里有一个典型的追踪表。\n\n| 步骤 |\
  \ 语句 | 注释 | variable1 | variable2 | variable3 |\n| --- | --- | --- | --- | --- |\
  \ --- |\n| 1 | | | | | |\n| 2 | | | | | |\n| … | | | | | |\n\n让我们来看看实际操作！对于下面的 C++\
  \ 程序，创建一个追踪表来确定每一步中变量的值。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  int main() {\n    int x, y, z;\n    x = 10;\n    y = 15;\n    z = x * y;\n    z++;\n\
  \    cout << z << endl;\n    return 0;\n}\n```\n\n该程序的追踪表如下。注释是可选的，但有助于读者更好地理解正在发生什么。\n\
  \n| 步骤 | 语句 | 注释 | x | y | z |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `x\
  \ = 10` | 将值 10 赋值给变量 `x`。 | 10 | ? | ? |\n| 2 | `y = 15` | 将值 15 赋值给变量 `y`。 | 10\
  \ | 15 | ? |\n| 3 | `z = x * y` | 将 `x * y` 的积赋值给 `z`。 | 10 | 15 | 150 |\n| 4 |\
  \ `z++` | `z` 增加了 1。 | 10 | 15 | 151 |\n| 5 | `cout << z << endl` | 显示：151 | | |\n\
  \n#### 练习 8.1-1 创建追踪表\n\n为该 C++ 程序创建追踪表，确定每一步中变量的值。两种执行情况为：(i) `0.3` 和 (ii) `4.5`。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int a;\n\
  \    double b, c;\n    cin >> b;\n    c = 3;\n    c = c * b;\n    a = c % 10; //\
  \ 注意：此处根据逻辑推全\n    cout << a << endl;\n    return 0;\n}\n```\n\n解答\n\ni) 对于输入值 `0.3`，追踪表如下。\n\
  \n| 步骤 | 语句 | 注释 | a | b | c |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `cin\
  \ >> b` | 输入值 `0.3` | ? | 0.3 | ? |\n| 2 | `c = 3` | | ? | 0.3 | 3.0 |\n| 3 | `c\
  \ = c * b` | | ? | 0.3 | 0.9 |\n| 4 | `a = 10 * c` | | 9 | 0.3 | 0.9 |\n| 5 | `a\
  \ = a % 10` | | 9 | 0.3 | 0.9 |\n| 6 | `cout << a << endl` | 显示：9 | | | |\n\nii)\
  \ 对于输入值 `4.5`，追踪表如下。\n\n| 步骤 | 语句 | 注释 | a | b | c |\n| --- | --- | --- | --- |\
  \ --- | --- |\n| 1 | `cin >> b` | 输入值 `4.5` | ? | 4.5 | ? |\n| 2 | `c = 3` | | ?\
  \ | 4.5 | 3.0 |\n| 3 | `c = c * b` | | ? | 4.5 | 13.5 |\n| 4 | `a = 10 * c` | |\
  \ 135 | 4.5 | 13.5 |\n| 5 | `a = a % 10` | | 5 | 4.5 | 13.5 |\n\n\n\n\n\n| 5 | `a\
  \ = a % 10` | | 5 | 4.5 | 13.5 |\n| 6 | `cout << a << endl` | 显示为: 5 |\n\n### 练习\
  \ 8.1-2 创建追踪表\n\n执行以下程序时会显示什么结果？\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    string Ugly, Beautiful, Handsome;\n    Ugly = \"Beautiful\"\
  ;\n    Beautiful = \"Ugly\";\n    Handsome = Ugly;\n    cout << \"Beautiful\" <<\
  \ endl;\n    cout << Ugly << endl;\n    cout << Handsome << endl;\n    return 0;\n\
  }\n```\n\n#### 答案\n\n让我们创建一个追踪表来寻找输出结果。\n\n| 步骤 | 语句 | 注释 | Ugly | Beautiful | Handsome\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `Ugly = \"Beautiful\"` | 将字符串\
  \ “Beautiful” 赋值给变量 `Ugly`。 | Beautiful | ? | ? |\n| 2 | `Beautiful = \"Ugly\"`\
  \ | 将字符串 “Ugly” 赋值给变量 `Beautiful`。 | Beautiful | Ugly | ? |\n| 3 | `Handsome = Ugly`\
  \ | 将变量 `Ugly` 的值赋值给变量 `Handsome`。 | Beautiful | Ugly | Beautiful |\n| 4 | `cout\
  \ << \"Beautiful\" << endl` | 显示为: Beautiful | | | |\n| 5 | `cout << Ugly << endl`\
  \ | 显示为: Beautiful | | | |\n| 6 | `cout << Handsome << endl` | 显示为: Beautiful |\
  \ | | |\n\n### 练习 8.1-3 交换变量的值\n\n编写一个 C++ 程序，让用户输入两个值并分别存储在变量 `a` 和 `b` 中。在程序结束时，这两个变量必须交换它们的值。例如，如果变量\
  \ `a` 和 `b` 分别包含值 5 和 7，在交换后，变量 `a` 必须包含值 7，变量 `b` 必须包含值 5！\n\n#### 答案\n\n下面的代码片段虽然看起来可能是正确的，但它是错误的，并没有真正交换变量\
  \ `a` 和 `b` 的值！\n\n```cpp\nint a, b;\ncin >> a;\ncin >> b;\na = b;\nb = a;\ncout\
  \ << a << \"  \" << b << endl;\n```\n\n让我们来看看为什么！假设用户输入了两个值 5 和 7。追踪表所示。\n\n| 步骤\
  \ | 语句 | 注释 | a | b |\n| --- | --- | --- | --- | --- |\n| 1 | `cin >> a` | 用户输入值\
  \ 5 | 5 | ? |\n| 2 | `cin >> b` | 用户输入值 7 | 5 | 7 |\n| 3 | `a = b` | 将变量 `b` 的值赋值给变量\
  \ `a`。值 5 丢失了！ | 7 | 7 |\n| 4 | `b = a` | 将变量 `a` 的值赋值给变量 `b` | 7 | 7 |\n| 5 | `cout\
  \ << a << \" \" << b << endl` | 显示为: 7 7 | | |\n\n哎！值 5 在哪里？\n\n解决方案并不显而易见！那么，到底如何真正交换值呢？\n\
  \n考虑两个杯子：一杯橙汁（称为 `glass A`）和一杯柠檬汁（称为 `glass B`）。如果你想交换它们的内容，你所做的只是找到并使用一个额外的空杯子（称为\
  \ `glass C`）。\n\n![Image](img/chapter08-01.png)\n\n必须遵循的步骤是：\n\n1) 将 `glass A`（橙汁）的内容倒进\
  \ `glass C`。\n\n![Image](img/chapter08-02.png)\n\n2) 将 `glass B`（柠檬汁）的内容倒进 `glass\
  \ A`。\n\n![Image](img/chapter08-03.png)\n\n3) 将 `glass C`（橙汁）的内容倒进 `glass B`。\n\n\
  ![Image](img/chapter08-04.png)\n\n交换圆满完成！\n\n你可以按照相同的步骤在 C++ 中交换两个变量的内容。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int a, b, c;\n    cin\
  \ >> a;\n    cin >> b;\n    c = a;    // 将 glass A (橙汁) 的内容倒进 glass C\n    a = b;\
  \    // 将 glass B (柠檬汁) 的内容倒进 glass A\n    b = c;    // 将 glass C (橙汁) 的内容倒进 glass\
  \ B\n    cout << a << \"  \" << b << endl;\n    return 0;\n}\n```\n\n![](img/remember.jpg)双斜杠\
  \ (`//`) 之后的文本被视为注释，永远不会执行。\n\n### 练习 8.1-4 交换变量的值 – 另一种方法\n\n编写一个 C++ 程序，让用户输入两个整数值并分别存储在变量\
  \ `a` 和 `b` 中。最后，这两个变量必须交换它们的值。然后，使用输入值 5 和 7 的追踪表来确认你的代码的正确性。\n\n#### 答案\n\n由于变量包含数值，你可以使用以下\
  \ C++ 程序（作为另一种方法）。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int a, b;\n    cin >> a;\n    cin >> b;\n    a = a + b;\n    b = a - b;\n\
  \    a = a - b;\n    cout << a << \"  \" << b << endl;\n    return 0;\n}\n```\n\n\
  现在让我们使用输入值 5 和 7 的追踪表来确认变量 `a` 和 `b` 正确交换了它们的内容。\n\n| 步骤 | 语句 | 注释 | a | b |\n|\
  \ --- | --- | --- | --- | --- |\n| 1 | `cin >> a` | 用户输入值 5 | 5 | ? |\n| 2 | `cin\
  \ >> b` | 用户输入值 7 | 5 | 7 |\n| 3 | `a = a + b` | | 12 | 7 |\n| 4 | `b = a - b` |\
  \ | 12 | 5 |\n| 5 | `a = a - b` | | 7 | 5 |\n| 6 | `cout << a << \"  \" << b <<\
  \ endl` | 显示为: 7 5 | | |\n\n*(注：原始文本中的追踪表值不完整；我已根据提供的代码进行了填充)*\n\n\n\n\n6) 它在流程图中显示了执行流。\n\
