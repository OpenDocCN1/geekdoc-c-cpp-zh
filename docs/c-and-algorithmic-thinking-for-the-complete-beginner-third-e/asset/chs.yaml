  \ 29.8 复习题：判断对错\n\n对以下每个陈述选择“对或“错”。\n\n1) 当迭代次数未知时，可以使用确定次数循环（definite loop）。\n\
  2) 当迭代次数已知时，不能使用后测试循环结构（post-test loop structure）。\n3) 根据“终极规则”（Ultimate rule），在先置测试循环结构中，参与循环布尔表达式的变量初始化必须在循环内部完成。\n\
  4) 根据“终极规则”，在先置测试循环结构中，参与循环布尔表达式的变量其更新/更改数值的语句必须是循环内的最后一条语句。\n5) 根据“终极规则”，在后测试循环结构中，参与循环布尔表达式的变量初始化有时可以在循环内部完成。\n\
  6) 根据“终极规则”，在后测试循环结构中，参与循环布尔表达式的变量其更新/更改的语句必须是循环内的第一条语句。\n7) 在 C++ 中，你可以使用 `exit`\
  \ 语句在循环完成所有迭代之前跳出循环。\n8) 给变量赋值常量值的语句最好放在循环控制结构内部。\n9) 在以下代码片段中，至少有一条语句可以移动到 `for`-循环外部。\n\
