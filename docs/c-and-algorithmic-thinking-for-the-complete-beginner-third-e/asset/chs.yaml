  \n提示：避免检查每个数字，这将需要 100 个 case！尝试一种更高效、巧妙的方法！\n\n## 第 19 章\n\n# 分支结构\n\n### 19.1\
  \ 分支结构\n\n分支结构是多分支决策结构的简化版本。它可以帮助你更快编写代码并增加可读性，特别是对于需要复杂决策结构的算法。分支结构用于扩展备选项的数量，与多分支决策结构相同。\n\
  \n的通用形式如下\n\n```cpp\nswitch (变量或要求值的表达式) {\ncase value-1:\n    > 语句或语句块 1\n    break;\n\
  case value-2:\n    > 语句或语句块 2\n    break;\ncase value-3:\n    > 语句或语句块 3\n    break;\n\
  ..case value-N:\n    > 语句或语句块 N\n    break;\ndefault:\n    > 语句或语句块 N + 1\n}\n```\n\
  \n注意：最后一个语句或语句块 `N+1` 是可选的，可以省略（你也需要省略 `default` 关键字）。\n\n注意：为了避免产生意外结果，请记住在每个 case\
  \ 结束处始终包含 `break` 关键字。如果你省略了它，实际上会执行两个语句或块：省略 `break` 的当前语句，以及下一个。\n\n注意：注意在 `C++`\
  \ 中 `switch` 语句仅适用于某些数据类型，如 `bool`、`short`、`unsigned short`、`int`、`unsigned int`\
  \ 或 `char`。\n\n\n\n\n\n![](img/notice.jpg)你不能总是使用 case 选择结构来代替多重选择结构。在 case 选择结构中，被评估的变量或表达式只写一次，这意味着该相同变量或表达式在所有\
  \ case 中都会被评估。然而，在多重选择结构中，每个 case 被评估的变量或表达式可以不同。\n\n这里显示了一个使用 case 选择结构的示例。\n\n\
  ![](img/my_exercise_header.png) project_19.1 \n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    char letter;\n    cout << \"What is the first\
  \ letter of your name? \";\n    cin >> letter;\n    switch (letter) {\n        case\
  \ 'J':\n            cout << \"Maybe you are my cousin!\" << endl;\n            break;\n\
  \        case 'A':\n            cout << \"Maybe you are my sister!\" << endl;\n\
  \            break;\n        case 'L':\n            cout << \"Maybe you are my mom!\"\
  \ << endl;\n            break;\n        default:\n            cout << \"Maybe I\
  \ don't know you.\" << endl;\n    }\n    return 0;\n}\n```\n\n#### 练习 19.1-1 星期几\n\
  \n编写一个 C++ 程序，提示用户输入一个 1 到 5 之间的整数，然后显示相应的工作日（周一、周二、周三、周四或周五）。如果输入的值无效，则必须显示错误信息。\n\
  \n##### 解决方案\n\n下面展示了解决此练习的流程图。\n\n![Image](img/chapter19-01.png)\n\n相应的 C++ 程序可以使用多重选择结构或\
  \ case 选择结构来编写。让我们尝试这两种方法！\n\n###### 第一种方法——使用多重选择结构\n\n![](img/my_exercise_header.png)\
  \ project_19.1-1a \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int day;\n    cout << \"Enter an integer between 1 and 5: \";\n    cin\
  \ >> day;\n    if (day == 1) {\n        cout << \"Monday\" << endl;\n    } else\
  \ if (day == 2) {\n        cout << \"Tuesday\" << endl;\n    } else if (day == 3)\
  \ {\n        cout << \"Wednesday\" << endl;\n    } else if (day == 4) {\n      \
  \  cout << \"Thursday\" << endl;\n    } else if (day == 5) {\n        cout << \"\
  Friday\" << endl;\n    } else {\n        cout << \"Invalid Number\" << endl;\n \
  \   }\n    return 0;\n}\n```\n\n###### 第二种方法——使用 case 选择结构\n\n![](img/my_exercise_header.png)\
  \ project_19.1-1b \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int day;\n    cout << \"Enter an integer between 1 and 5: \";\n    cin\
  \ >> day;\n    switch (day) {\n        case 1:\n            cout << \"Monday\" <<\
  \ endl;\n            break;\n        case 2:\n            cout << \"Tuesday\" <<\
  \ endl;\n            break;\n        case 3:\n            cout << \"Wednesday\"\
  \ << endl;\n            break;\n        case 4:\n            cout << \"Thursday\"\
  \ << endl;\n            break;\n        case 5:\n            cout << \"Friday\"\
  \ << endl;\n            break;\n        default:\n            cout << \"Invalid\
  \ Number\" << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)case 选择结构和多重选择结构具有相同的流程图。\n\
  \n### 19.2 复习题：判断对错\n\n对以下每个陈述判断对或错。\n\n1) case 选择结构用于扩展备选项的数量。\n2) case 选择结构可以一直用来代替多重选择结构。\n\
  3) case 选择结构可以根据程序员意任意数量的备选项。\n4) 在 case 选择结构中，最后一个语句或语句块 `N + 1`（出现在 `default`\
  \ 关键字下方）总是会被执行。\n5) 在 case 选择结构中，当之前的没有任何 case 评估为真时，执行最后一个语句或语句块 `N + 1`（出现在 `default`\
  \ 关键字下方）。\n6) 最后一个语句或语句块 `N + 1` 以及 `default` 关键字不能省略。\n7) 在接下来的 C++ 程序中，只有当变量 `a`\
  \ 包含除 1、2 或 3 以外的值时，才会执行语句 `y++`。\n```cpp\nswitch (a) {\n    case 1: x = x + 5;\
  \ break;\n    case 2: x = x - 2; break;\n    case 3: x = x - 9; break;\n    default:\
  \ x = x + 3; y++;\n}\n```\n\n### 19.3 复习练习\n\n完成以下练习。\n\n1) 创建一个跟踪表，以确定下一个 C++ 程序在三次不同执行情况下每一步中变量的值。\n\
  \n三次执行的输入值为：(i) 1，(ii) 3，以及 (iii) 250。\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    int a, x, y;\n    cin >> a;\n    x = 0;\n    y = 0;\n\
  \    switch (a) {\n        case 1: x = x + 5; y = y + 5; break;\n        case 2:\
  \ x = x - 2; y--; break;\n        case 3: x = x - 9; y = y + 3; break;\n       \
  \ default: x = x + 3; y++;\n    }\n    cout << x << \", \" << y << endl;\n    return\
  \ 0;\n}\n```\n\n2) 创建一个跟踪表，以确定下一个 C++ 程序在三次执行情况下每一步中变量的值。\n\n三次执行的输入值为：(i) 10, 5；(ii)\
  \ 5, 3；以及 (iii) 4, 6。\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nint main() {\n    int a, x;\n    double y;\n    cin >> a;\n    cin >> y;\n\
  \    switch (a) {\n        case 10: x = x % 2; y = pow(y, 2); break;\n        case\
  \ 3: x = x * 2; y--; break;\n        case 5: x += 4; y += 7; break;\n        default:\
  \ x -= 3; y++;\n    }\n    cout << x << \", \" << y << endl;\n    return 0;\n}\n\
