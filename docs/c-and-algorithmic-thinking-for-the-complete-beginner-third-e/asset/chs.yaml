  #### 练习 30.5-7 赫顿法平方根\n\n编写一个 C++ 程序，提示用户输入一个非负值，然后使用赫顿法计算其平方根，如下。\n\n###### ![Image](img/chapter11-01.png)\n\
  \n其中\n\n- `y` 是你想要寻找平方根的数\n- `x[n]` 是 `y` 的平方根的第 `n` 次迭代值\n\n此外，使用循环控制结构，程序必须在用户输入任何负值时显示错误消息。\n\
  \n##### 答案\n\n你现在几乎肯定感到很困惑，正在抓腮腮。不要被这些数学东西吓到！你可以尝试通过下面的流程图来理解赫顿法！\n\n![Image](img/chapter30-03.png)\n\
  \n\n\n\n还是困惑吗？让我们来看一个例子。让我们尝试寻找 25 的平方根：\n\n- 设定一个猜测。假设 `8` 是你的第一个猜测值。\n- `8` 的平方是\
  \ `64`。\n- 由于 `64` 与 `25` 并不“足够接近”，通过计算该表达式设定新的猜测：\n\n.![Image](img/chapter30-04.png)\n\
  \n- `5.56` 的平方大约是 `30.91`。\n- 由于 `30.91` 与 `25` 并不“足够接近”，通过计算该表达式设定新的猜测：\n\n.![Image](img/chapter30-05.png)\n\
  \n- `5.02` 的平方是 `25.2`。\n- 如果你认为 `25.2` 与 `25` “足够接近”，你可以停止整个过程，并得出 25 的近似平方根为 `5.02`。\n\
  \n![](img/notice.jpg)显然，如果需要更高的精度，你可以继续该过程，直到找到一个被认为更接近 25 平方根的值。\n\n现在，让我们看看对应的\
  \ C++ 程序。\n\n![](img/my_exercise_header.png) project_30.5-7\n```cpp\n#include <iostream>\n\
  #include <ctime>\n#include <cstdlib>\nusing namespace std;\nconst double ACCURACY\
  \ = 0.0000000000001;\nint main() {\n    double y, guess;\n    srand(time(NULL));\n\
  \    cout << \"Enter 一个非负数: \";\n    cin >> y;\n    while (y < 0) {\n        cout\
  \ << \"无效值。请输入一个非负数: \";\n        cin >> y;\n    }\n    guess = 1 + rand()%((int)y);\
  \  //在 1 和用户提供的值之间产生一个随机初始猜测\n    while (abs(guess * guess - y) > ACCURACY) { //是否“足够接近”？\n\
  \        guess = (guess + y / guess) / 2;    //没有，则创建一个新的“猜测”！\n    }\n    cout\
  \ << guess << endl;\n    return 0;\n}\n```\n![](img/notice.jpg)注意检查“是否足够接近”的方式。当差值的绝对值\
  \ `|guess² - y|` 小于 `0.0000000000001`（其中 `y` 是用户提供的值）时，执行流退出循环。\n\n#### 练习 30.5-8\
  \ 计算 π\n\n编写一个 C++ 程序使用 Madhava–Leibniz 级数计算 `π`，精度为 `0.00001`。\n\n.![Image](img/chapter30-06.png)\n\
  \n### 解解\n\nMadhava–Leibniz 级数可以求解 `π`，变为\n\n.![Image](img/chapter30-07.png)\n\n\
  分数越多，精度越高！因此，为了计算这个公式，程序需要进行多次迭代，以便使用尽可能多的分数。但当然，它不能无限迭代下去！当当前计算的 `π` 值与上一次迭代计算的值“足够接近”时，循环必须停止迭代，这意味着它们差值的绝对值已经变得非常小。常量\
  \ `ACCURACY` 定义了这种差异必须有多小。这里显示了该 C++ 程序。\n\n![](img/my_exercise_header.png) project_30.5-8\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nconst double ACCURACY = 0.00001;\n\
  int main() {\n    double pi, piPrevious;\n    int sign, denom;\n    pi = 0;\n  \
  \  sign = 1;    //这是第一个分数的符号\n    denom = 1;   //这是第一个分数的分母\n    do {\n        piPrevious\
  \ = pi;   //保留上一次的 pi\n        pi += sign * 4 / (double)denom;   //通过加上分数（项）计算新的\
  \ pi\n        sign = -sign;   //为下一个分数准备符号\n        denom += 2;    //为下一个分数准备分母\n\
  \    } while (abs(pi - piPrevious) > ACCURACY);  //是否“足够接近”？\n    cout << \"Pi ~=\
  \ \" << pi << endl;\n    return 0;\n}\n```\n![](img/notice.jpg)注意变量 `sign` 在每次迭代中在值\
  \ `-1` 和 `+1` 之间切换的方式。\n\n如果你减小常量 `ACCURACY` 的值，`π` 的计算将越来越精确。取决于你计算机的速度，你可以相当快地算出\
  \ `π` 的前五位。然而，计算 `π` 的后续每个数位所需的时间会呈指数级增长。在现代计算机上使用这种方法计算 40 位 `π` 可能需要数年！\n\n####\
  \ 练习 30.5-9 用分数近似实数\n\n编写一个 C++ 程序，提示用户输入一个 0 到 100 之间的实数，然后尝试找到能更好地近似它的分数值，其中 `N`\
  \ 是 0 到 100 之间的整数，`M` 是 1 到 100 之间的整数。使用循环控制结构，程序还必须验证数据输入，允许用户只输入 0 到 100 之间的值。不需要显示任何错误信息。\n\
  \n### �解法\n\n解决方案非常简单。你只需要遍历变量 `n` 和 `m` 的所有可能组合，并检查哪一个更接近用户提供的实数。\n\n要遍历变量 `n`\
  \ 和 `m` 的所有可能组合，你可以使用嵌套循环控制结构，即两个嵌套在一起的 `for` 循环，如下所示。\n\n```cpp\nfor (n = 0; n\
  \ <= 100; n++) {\n    for (m = 1; m <= 100; m++) {\n        …\n    }\n}\n```\n![](img/notice.jpg)总迭代次数为\
  \ `101 × 100 = 10100`。这是一个很大的数字，但对于现代计算机来说，这微不足道！\n\n![](img/notice.jpg)变量 `m` 代表分的分母，分母不能为零。这就是为什么它从\
  \ 1 开始而不是从 0 开始。\n\n以下标准\n\n.![Image](img/chapter30-09.png)\n\n可以评估近似值有多“好”。\n\n\
  困惑吗？让我们尝试通过遍历 `N` 和 `M` 的所有组合来用分数近似值 `0.333`。\n\n- 对于 `N = 1`, `M = 1`，准则等于 !![Image](img/chapter30-10.png)\
  \ = `0.6670`\n- 对于 `N = 1`, `M = 2`，准则等于 !![Image](img/chapter30-11.png) = `0.1670`\n\
  - 对于 `N = 1`, `M = 3`，准则等于 !![Image](img/chapter30-12.png) = `0.0003`\n- 对于 `N =\
  \ 1`, `M = 4`，准则等于 !![Image](img/chapter30-13.png) = `0.0830`\n- …\n- 对于 `N = 100`,\
  \ `M = 99`，准则等于 !![Image](img/chapter30-14.png) = `0.6771`\n- 对于 `N = 100`, `M =\
  \ 100`，准则等于 !![Image](img/chapter30-15.png) = `0.6670`\n\n显然，值 `0.0003` 是所有可能结果中的最小值。因此，组合\
  \ `N = 1` 和 `M = 3`（对应分数 `1/3`）被视为值 `0.333` 的最佳近似。\n\n现在是 C++ 程序：\n\n![](img/my_exercise_header.png)\
  \ project_30.5-9\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    double x, y, minimum;\n    int bestN, bestM, n, m;\n    do {\n        cout\
  \ << \"输入一个 0 到 100 之间的实数: \";\n        cin >> x;\n    } while (x < 0 || x > 100);\n\
  \    minimum = 100;\n    for (n = 0; n <= 100; n++) {\n        for (m = 1; m <=\
  \ 100; m++) {\n            y = abs(n /(double)m - x);\n            if (y < minimum)\
  \ {\n                minimum = y;\n                bestN = n;\n                bestM\
  \ = m;\n            }\n        }\n    }\n    cout << \"分数是: \" << bestN << \" /\
  \ \" << bestM << endl;\n    return 0;\n}\n```\n![](img/notice.jpg)将变量 `m` 转换为 `double`\
  \ 类型会欺骗 C++ 并执行普通除法（返回实数的除法）。如果你省略 `(double)` 强制类型转换，由于被除数除数都是 `int` 类型，C++ 将执行整数除法并产生错误结果。\n\
  \n### 30.6 循环控制结构的通用练习\n\n#### 练习 30.6-1 0 到 100 华氏转开尔文\n\n编写一个 C++ 程序显示从 0 到 100\
  \ 的所有华氏度及其对应的开尔文度。使用增量值 `0.5`。已知\n\n`1.8 × Kelvin = Fahrenheit + 459.67`\n\n###\
  \ 解法\n\n公式求解开尔文变为\n\n.![Image](img/chapter30-16.png)\n\n这里你需要一个 `for` 循环，以 `0.5`\
  \ 的偏移量将变量 `fahrenheit` 的值从 0 增加到 100。 Solution 所示。\n\n![](img/my_exercise_header.png)\
  \ project_30.6-1\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    double fahrenheit, kelvin;\n    for (fahrenheit = 0; fahrenheit <= 100;\
  \ fahrenheit += 0.5) {\n        kelvin = (fahrenheit + 459.67) / 1.8;\n        cout\
  \ << \"Fahrenheit: \" << fahrenheit << \" Kelvin: \" << kelvin << endl;\n    }\n\
  \    return 0;\n}\n```\n\n#### 练习 30.6-2 棋盘上的大米\n\n\n\n\n\n有一个关于一个穷人发明象棋的传说。印度国王对这个新游戏非常满意，于是他提议给那个穷人他想要的任何物品。这位贫穷但聪明的老人告诉国王，他希望棋盘的第一个格子上放一粒米，第二个格子要两粒，第三个格子要四粒，以此类推，棋盘上\
  \ 64 个格子中的每一个都翻倍。在国王看来，这是一个谦微的要求，于是他命令仆人把米拿过来。\n\n编写一个 C++ 程序，计算并显示棋盘上最后将有多少粒米，以及多少磅米。假设一磅米大约包含\
  \ `30,000` 粒米。\n\n## 解决方案\n\n假设棋盘只有 `2 × 2 = 4` 个格子，并且变量 `grains` 被赋予初始值 `1`（这是第\
  \ `1^(st)` 格子的米数）。一个循环三次的 for 循环可以在每次迭代中将变量 `grains` 的值翻倍，如下一个代码段所示。\n\n```cpp\n\
  grains = 1;\nfor (i = 2; i <= 4; i++) {\n    grains = 2 * grains;\n}\n```\n\n变量\
  \ `grains` 在每次迭代结束时的值如下表所示。\n\n| 迭代 | grains 的值 |\n| --- | --- |\n| 第 1 次 | 2 ×\
  \ 1 = 2 |\n| 第 2 次 | 2 × 2 = 4 |\n| 第 3 次 | 2 × 4 = 8 |\n\n在第 `3^(rd)` 次迭代结束后，变量\
  \ `grains` 值 `8`。这个值并不是棋盘上的米总数，而仅仅是第 `4^(th)` 格子的米数。如果你需要找到棋盘上的米总数，可以累加所有格子的米，即\
  \ `1 + 2 + 4 + 8 = 15`。\n\n在现实世界中，真正的棋盘包含 `8 × 8 = 64` 个格子，因此你需要迭代 `63` 次。C++ 程序如下。\n\
  \n![](img/my_exercise_header.png) project_30.6\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int i;\n    unsigned long long grains, total;\n\
  \    double weight;\n    total = grains = 1;\n    for (i = 2; i <= 64; i++) {\n\
  \        grains = 2 * grains;\n        total = total + grains;\n    }\n    weight\
  \ = total / 30000.0;\n    cout << total << \"  \" << weight << endl;\n    return\
  \ 0;\n}\n```\n\n如果你在好奇这些数字有多大，这里是答案：棋盘上将有 `18,446,744,073,709,551,615` 粒米；也就是说`614,891,469,123,651.8`\
  \ 磅！\n\n![](img/notice.jpg)不将变量 `grains` 和 `total` 声明为 `int` 甚至 `long` 的原因是这两种类型都无法容纳如此巨大的数字。`long`\
  \ 类型的上限是 `+2⁶³ − 1`，遗憾的是这仍然不够。\n\n## 练习题 30.6-3 仅仅是一项调查\n\n一家民意调查公司询问 `1000` 名市民他们早上是否吃早餐。编写一个\
  \ C++ 程序，提示市民输入他们的性别（`M` 代表男性，`F` 代表女性，`O` 代表其他）以及对该问题的回答（`Y` 代表是，`N` 代表否，`S` 代表有时），然后计算并显示回答“是”的市民人数，以及在回答“否”的市民中女性占的百分比。使用循环控制结构，程序还必须验证数据输入，且性别仅接受\
  \ `M`、`F` 或 `O`，回答仅接受 `Y`、`N` 或 `S`。\n\n## 解决方案\n\nC++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_30.6-3\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\nconst int CITIZENS = 1000;\n\
  int main() {\n    int totalYes, femaleNo, i;\n    string gender, answer;\n    totalYes\
  \ = femaleNo = 0;\n    for (i = 1; i <= CITIZENS; i++) {\n        do {\n       \
  \     cout << \"Enter gender: \";\n            cin >> gender;\n            gender\
  \ = to_lower_copy(gender);\n        } while (gender != \"m\" && gender != \"f\"\
  \ && gender != \"o\");\n        do {\n            cout << \"Do you eat breakfast\
  \ in the morning? \";\n            cin >> answer;\n            answer = to_lower_copy(answer);\n\
  \        } while (answer != \"y\" && answer != \"n\" && answer != \"s\");\n    \
  \    if (answer == \"y\") {\n            totalYes++;\n        }\n        if (gender\
  \ == \"f\" && answer == \"n\") {\n            femaleNo++;\n        }\n    }\n  \
  \  cout << totalYes << \"  \" << femaleNo * 100 /(double)CITIZENS << \"%\" << endl;\n\
  \    return 0;\n}\n```\n\n## 练习题 30.6-4 消息是回文吗？\n\n回文是指正反着读都相同的单词或句子。（你可能记得从练习 23.5-4\
  \ 知道数字也可以是回文）。编写一个 C++ 程序，提示用户输入一个单词或句子，然后显示用户提供的单词或句子是否为回文。以下是一些回文词和短语。\n\n- ►Anna\n\
  - ►Radar\n- ►Madam\n- ►A nut for a jar of tuna.\n- ►Dennis and Edna sinned.\n- ►Murder\
  \ for a jar of red rum.\n- ►Borrow or rob?\n- ►Are we not drawn onward, we few,\
  \ drawn onward to new era?\n\n## 解决方案\n\n在开始逐个比较字母并检查第一个字母是否与最后一个相同、第二个字母是否与倒数第二个相同，以此类推之前，你需要记住几点：\n\
  \n- 在给定的句子或单词中，有些字母是大写的，有些是小写的。例如，在句子“A nut for a jar of tuna”中，尽管第一个和最后一个字母相同，但它们并不被认为是相等。因此，程序在开始比较之前必须先将所有字母（例如转换为小写）。\n\
  - 移除空格、句号、问号和逗号等字符对于程序准确比较字母至关重要。例如，如果没有这一步，在句子“Borrow or rob?”中，程序会误地认为它不是回文，因为它会尝试将开头的“B”与最后的问号“?”进行比较。\n\
  - 假设检查的句子是“Borrow or rob?”。在将所有字母转换为小写并移除所有多空格和问号后，句子变成了“borroworrob”。这些字母及其在字符串中的对应位置如下：\n\
  \n![Image](img/chapter30-17.png)\n\n你在这里应该意识到，for 循环只需要迭代字母的一半即可。你能猜出为什么吗？程序应该开始迭代，并比较位置\
  \ `0` 处的字母与位置 `10` 处的字母。然后它应该比较位置 `1` 处的字母与位置 `9` 处的字母，以此类推。最后一次迭代应该是比较位置 `4` 和\
  \ `6` 处的字母。此后继续检查就没有意义了，因为所有字母都已经比较过了。\n\n这个问题有许多解决方案。其中一些列在下面。程序内部编写的注释可以帮助你完全理解它们的运行方式。然而，如果你对它们的运行方式仍有疑问，可以使用\
  \ Visual Studio Code 逐步执行。\n\n### 方法一\n\n解决方案在此给出。\n\n![](img/my_exercise_header.png)\
  \ project_30.6-4a\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\nint main() {\n    int i,\
  \ middlePos, j;\n    string message, messageClean, letter;\n    char leftLetter,\
  \ rightLetter;\n    bool palindrome;\n    cout << \"Enter a message: \";\n    getline(cin,\
  \ message);\n    message = to_lower_copy(message);\n    // 创建一个新的包含除空格、句号和问号外所有字符的字符串\n\
  \    messageClean = \"\";\n    for (i = 0; i <= message.length() - 1; i++) {\n \
  \       letter = message[i];\n        if (letter != \" \" && letter != \",\" &&\
  \ letter != \".\" && letter != \"?\") {\n            messageClean += letter;\n \
  \       }\n    }\n    j = messageClean.length() - 1; // 这是 messageClean 的最后一个位置\n\
  \    middlePos = (int)(j / 2); // 这是 messageClean 的中间位置\n    palindrome = true;\
  \ // 在开始，假设句子是回文\n    // 这个 for 循环逐个比较字母。\n    for (i = 0; i <= middlePos; i++)\
  \ {\n        leftLetter = messageClean[i];\n        rightLetter = messageClean[j];\n\
  \        // 如果至少有一对字母验证失败，将变量 palindrome 设置为 false\n        if (leftLetter != rightLetter)\
  \ {\n            palindrome = false;\n        }\n        j--;\n    }\n    // 如果变量\
  \ palindrome 仍然为 true\n    if (palindrome) {\n        cout << \"The message is palindrome\"\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n\n\n\n\n# 第二种方法\n\n之前的方法可以正常工作，但假设用户输入了一个非常长且不是回文的句子；例如，它的第二个字母与最后一个字母不同。遗憾的是，在之前的方法中，尽管变量\
  \ `palindrome` 从第二次迭代开始就已被设为 `false`，但最后一个 `for` 循环仍然会继续迭代，直到句子的中间。所以，让我们尝试让这个程序变得更好。正如你所知道的，你可以使用\
  \ `break` 语句在循环完成所有迭代之前跳出循环。\n\n此外，由于只有四种不同的字符需要被移除（空格、逗号、句号和问号），你只需要调用四次函数 `replace_all_copy()`，就可以避免第一个循环，如下面所示的\
  \ C++ 程序所的。\n\n![](img/my_exercise_header.png)\n\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\n\nint main() {\n    int i, middlePos, j;\n    string message,\
  \ messageClean;\n    bool palindrome;\n    cout << \"Enter a message: \";\n    getline(cin,\
  \ message);\n    message = to_lower_copy(message);\n    // 创建一个包含除空格、逗号、句号和问号之外所有字符的新字符串\n\
  \    messageClean = replace_all_copy(message, \"  \", \"\");\n    messageClean =\
  \ replace_all_copy(messageClean, \",\", \"\");\n    messageClean = replace_all_copy(messageClean,\
  \ \".\", \"\");\n    messageClean = replace_all_copy(messageClean, \"?\", \"\");\n\
  \    j = messageClean.length() - 1;\n    middlePos = (int)(j / 2);\n    palindrome\
  \ = true;\n    for (i = 0; i <= middlePos; i++) {\n        if (messageClean[i] !=\
  \ messageClean[j]) {\n            palindrome = false;\n            break;\n    \
  \    }\n        j--;\n    }\n    if (palindrome) {\n        cout << \"The message\
  \ is palindrome\" << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)显而易见，一个问题有很多解决方案。找到最优解取决于你！\n\
  \n![](img/notice.jpg)如果你想移除所有不需要的字符（空格、逗号、句号、问号、&符号等），你可以使用下面的代码段代替。它在变量 `messageClean`\
  \ 中只保留字母！\n\n```cpp\n// 创建一个只包含字母的新字符串\nmessageClean = \"\";\nstring validChars\
  \ = \"abcdefghijklmnopqrstuvwxyz\";\nfor (i = 0; i < message.length(); i++) {\n\
  \    if (validChars.find(message[i]) != -1) {\n        messageClean += message[i];\
  \   // 拼接\n    }\n}\n```\n\n### 30.7 复习题：判断对错\n\n请对以下每个陈述判断对或错。\n\n1) 数据验证是限制数据输入的过程，强制用户只输入有效值。\n\
  2) 你可以使用定次数循环（definite loop）来验证数据输入。\n3) 为了强制用户只输入正数且不显示任何错误信息，可以使用下面的代码片段。\n```cpp\n\
  do {\n    cout << \"Enter a positive number: \";\n    cin >> x;\n} while (x <= 0);\n\
  ```\n4) 为了强制用户输入 1 到 10 之间的数字，可以使用下面的代码片段。\n```cpp\ncout << \"Enter a number between\
  \ 1 and 10: \";\ncin >> x;\nwhile (x >= 1 && x <= 10) {\n    cout << \"Wrong number\"\
  \ << endl;\n    cout << \"Enter a number between 1 and 10: \";\n    cin >> x;\n\
  }\n```\n5) 为了在 10 个用户提供的数字中找到最小数，可以使用下面的代码片段。\n```cpp\nminimum = 0;\nfor (i = 1;\
  \ i <= 10; i++) {\n    cin >> w;\n    if (w < minimum) {\n        minimum = w;\n\
  \    }\n}\n```\n6) 为了在 10 个用户提供的数字中找到最大数，可以使用下面的代码片段。\n```cpp\nmaximum = 0;\nfor\
  \ (i = 1; i <= 10; i++) {\n    cin >> w;\n    if (w > maximum) {\n        maximum\
  \ = w;\n    }\n}\n```\n7) 为了在 10 个用户提供的正数中找到最大数，可以使用下面的代码片段。\n```cpp\nmaximum =\
  \ 0;\nfor (i = 1; i <= 10; i++) {\n    cin >> w;\n    if (w > maximum) {\n     \
