  \n# 前言\n\n### 关于作者\n我出生于 1973 年，从小起，我就发现了对计算机编程的热爱。12 岁时，我得到了我的第一台电脑——`Commodore\
  \ 64`，它包含一个基于 `ROM` 的 `BASIC` 编程语言版本和 `64 kilobytes` 的内存。它带我进入了编程的世界！\n\n我拥有皮埃卢技术教育学院的计算机工程学位。此外，我在色拉斯德摩里特斯大学获得了电气与计算机工程的\
  \ `Dipl. Eng.` 学位和集成硕士学位。在之前，我在一家专门工业数据流和产品标签的公司担任软件开发人员，我的职责包括为数据终端开发软件应用程序，以及用于在\
  \ `SQL Server` 上进行数据采集和存储的 PC 软件。\n\n多年来，我设计了各种应用程序，包括仓库管理系统和各公司的网站。目前，我在一所职业高中担任计算机科学教师，教授计算机编程、计算机网络、互联网/内网编程工具以及数据库等课程。我编写了多本书，主要关注算法和计算思维，利用了如\
  \ `Python`、`C#`、`C++`、`PHP` 和 `Visual Basic` 等语言。\n\n在职业追求之外，我婚姻美满，并拥有养育两个优秀孩子的快乐。\n\
  \n### 致谢\n我特别感谢我的朋友兼资深编辑 Victoria (Vicki) Austin，她在第一版的文字校对工作中提供的帮助。没有她，这本书可能无法发挥出全部潜力。在她耐心的指导和宝贵且具有建设性的建议下，她帮助我将这本书提升到了更高的水平！\n\
  \n### 本书的结构\n你手中的这本书遵循螺旋式课程教学法，这种方法是由美国心理学家杰姆·布鲁纳（Jerome Bruner）在 1960 年提出的。根据这种方法，在教授某一学科时，基本概念会反复出现——每次都更加深入——直到读者对该主题达到完全理解。首先，读者学习基本元素而不必担心细节。随后，会教授更多细节并反复提到基本元素，最终将其存储在大脑的长记忆中。\n\
  \n根据杰姆·布鲁纳的观点，学习需要学生的积极参与、实验、探索和发现。本书包含许多示例，大部分都可以实际操作。这为读者提供了接触 `C++` 并能够创建自己的程序的机会。\n\
  \n### 谁应该买这本书？\n本书已针对最新的 `C++` 版本进行了完全更新，提供了全面的编程介绍，不假设读者具备该主题的先验知识。它为渴望从零学习 `C++`\
  \ 的个人设计，为算法思维提供了坚实的基础——这是每个职业程序员必须掌握的基础技能。算法思维不仅包括编写代码，它还意味着通过代码掌握解决问题的艺术。\n\n本版保留了前一版本的所有受欢迎功能，同时引入了丰富的新练习，并进行了广泛的修订和更新。此外，全新的章节为处理文本文件提供了实用的介绍。\n\
  \n本书的结构既适用于课堂教学也适用于自学，每章末尾都有一组问题和练习题，旨在加强你的理解并应用所学知识。书中约有 250 道已解练习题和 480 道未解练习题、500\
  \ 道判断题、150 道单选题以及 200 道复习题和填字游戏（答案和解析在线提供），这本书非常适合：\n\n\n\n\n\n-   追求自学的初学者或中级程序员\n\
  -   高中生\n-   大学大一学生\n-   教育工作者\n-   教授\n-   任何想要使用最佳实践和技术开始学习或教授计算机编程的人\n\n## 本书使用的约定\n\
  \n以下是对书中使用的某些约定定的说明。“约定”是指文本中某些部分的显示标准方式。\n\n### C++ 语句\n\n本书使用了大量用 `C++` 语言编写的示例。`C++`\
  \ 语句使用如下所示的字体显示。\n\n```cpp++\nThis is a C++ statement\n```\n\n### 段落文本中的关键字、变量、函数和参数\n\
  \n关键字、变量、函数（子程序）和参数有时会在段落正文中显示。当它们出现时，特殊文本将使用与段落其他部分不同的字体。例如，`firstName = 5` 就是段落文本中的一个\
  \ `C++` 语句示例。\n\n### 斜体单词\n\n你可能会注意到，某些特殊文本也以斜体形式显示。在书中，斜体单词表示通用类型，必须被替换为适用于你数据的特定名称。例如，`C++`\
  \ 语句的通用形式可能如下：\n\n```cpp\nvoid name(type1 arg1, type2 arg2 )\n```\n\n为了完成该语句，必须将关键字\
  \ `name`、`type1`、`arg1`、`type2` 和 `arg2` 替换为有意义的内容。你在程序中使用该语句时，可能如下：\n\n```cpp\n\
  void displayRectangle(int width, int height)\n```\n\n### 三点（…）：省略号\n\n在语句的通用形式中，你可能会在示例列表后面看到三个点（`…`），也称为“省略号”。它们不是语句的一部分。省略号表示列表中可以包含你需要的任意数量的项。例如，语句通用形式中的省略号：\n\
  \n```cpp\ndisplayMessages(arg1, arg2, … );\n```\n\n表示列表可能包含两个以上的参数。当你在程序中使用该语句时，你的语句可能像这样：\n\
  \n```cpp\ndisplayMessages(message1, \"Hello\", message2, \"Hi!\");\n```\n\n### 斜体方括号\n\
  \n某些语句或函数（子程序）的通用形式可能包含斜体“方括号” `[ ]`，这表示括起来的部分是可选的。例如，语句的通用形式\n\n```cpp\nsubject.substr(beginIndex\
  \ [, length])\n```\n\n表示 `[, length]` 部分是可以省略的。\n\n例如，以下两个语句可能会产生不同的结果，但它们在语法上都是正确的。\n\
  \n```cpp\na = s.substr(3);\nb = s.substr(3, 9);\n```\n\n### 深色页头\n\n本书中的大多数示例都使用如下所示的字体。\n\
