  \n\n\n假设文件“f_data41.1-3.txt”中至少包含一个值。\n\n## 解决方案\n\n最终程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_41.1-3\n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace\
  \ std;\nconst string PATH = \"c:/temp/\";\nint main() {\n    double number, maximum,\
  \ minimum;\n    fstream fin(PATH + \"f_data41.1-3.txt\");\n    //读取第一个值\n    fin\
  \ >> maximum;\n    minimum = maximum;\n    // 逐行读取其余值\n    while (!fin.eof()) {\n\
  \        fin >> number;\n        if (number > maximum ) {\n            maximum =\
  \ number;\n        }\n        if (number < minimum) {\n            minimum = number;\n\
  \        }\n    }\n    fin.close();\n    // 将最大和最小值写入文件\n    fstream fout(PATH +\
  \ \"output.txt\", fstream::out);\n    fout << maximum << \"  \" << minimum;\n  \
  \  fout.close();\n    return 0;\n}\n```\n\n## 练习 41.1-4 合并文件\n\n假设有两个名为“text1.txt”和“text2.txt”的文本文件。编写一个\
  \ C++程序合并这两个文件的内容并将合并后的文本写入名为“final.txt”的第三文件中，将“text1.txt”的内容放在“text2.txt”内容之前。\n\
  \n### 解决方案\n\n这个练习可以使用几种方法解决。让我们来看看其中两种。\n\n### 第一种方法\n\n程序打开“text1.txt”文件，读取所有内容，将其赋值给变量\
  \ `contents`，然后关闭文件。接下来，它打开“text2.txt”文件，读取所有内容，将其与之前的的内容（变量 `contents` 中的内容）合并并关闭文件。最后，它打开“final.txt”并将合并后的内容写入其中，如下程序所示。\n\
  \n![](img/my_exercise_header.png) project_41.1-4a\n```cpp\n#include <iostream>\n\
  #include <fstream>\nusing namespace std;\nconst string PATH = \"c:/temp/\";\nint\
  \ main() {\n    string s, contents = \"\";\n    fstream fin;\n    fin.open(PATH\
  \ + \"text1.txt\");\n    while (!fin.eof()) {\n        getline(fin, s);\n      \
  \  contents += s + \"\\n\";\n    }\n    fin.close();\n    fin.open(PATH + \"text2.txt\"\
  );\n    while (!fin.eof()) {\n        getline(fin, s);\n        contents += s +\
  \ \"\\n\";\n    }\n    fin.close();\n    fstream fout(PATH + \"final.txt\", fstream::out);\n\
  \    fout << contents;\n    fout.close();\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意在程序开头是如何声明对象\
  \ `fin` 的。通过这样你就可以反复使用同一个对象来打开和读取多个文件。\n\n### 第二种方法\n\n下面的程序在开始时打开所有三个文件，写入合并后的内容，然后关闭它们。\n\
  \n![](img/my_exercise_header.png) project_41.1-4b\n```cpp\n#include <iostream>\n\
  #include <fstream>\nusing namespace std;\nconst string PATH = \"c:/temp/\";\nint\
  \ main() {\n    string s, contents = \"\";\n    fstream fin1(PATH + \"text1.txt\"\
  );\n    fstream fin2(PATH + \"text2.txt\");\n    fstream fout(PATH + \"final.txt\"\
  , fstream::out);\n    while (!fin1.eof()) {\n        getline(fin1, s);\n       \
  \ contents += s + \"\\n\";\n    }\n    while (!fin2.eof()) {\n        getline(fin2,\
  \ s);\n        contents += s + \"\\n\";\n    }\n    fout << contents;\n    fout.close();\n\
  \    fin2.close();\n    fin1.close();\n    return 0;\n}\n```\n\n![](img/notice.jpg)关闭文件的顺序不需要与打开它们的顺序一致。例如，你可以先打开“text2.txt”文件并最后关闭它，或者先打开它并先关闭它。\n\
  \n## 练习 41.1-5 在文件中搜索\n\n在 ways，社会安全号码（SSN）是一个九位的数字身份标识，适用于所有美国公民，以便出于社会安全目的对其进行识别。假设有一个名为“SSN.txt”的文件，其中包含了加利福尼亚州所有公民的\
  \ SSN 以及他们的全名，每行一条记录。文件结构示例所示。\n\n123456789 Aristides Bouras\n123000000 Loukia Ainarozidou\n\
  121212121 John Papas Junior..\n\n编写一个 C++程序，提示用户输入要搜索的 SSN 的前几，然后在文件中搜索并显示所有 SSN\
  \ 以这些数字开头的公民的姓和名。\n\n### 解决方案\n\n在这个特定的练习中，如果用户输入了 SSN 的所有九位数字进行搜索且找到了该 SSN，程序必须显示相应公民的姓和名。另一方面，如果用户输入的数字少于九位，程序必须搜索并显示所有\
  \ SSN 以这些数字开头的公民的姓和名。该练习的解决方案如下。\n\n![](img/my_exercise_header.png) project_41.1-5\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nconst string\
  \ PATH = \"c:/temp/\";\nint main() {\n    string ssnSearch, line, ssn, fullName;\n\
  \    bool found;\n    cout << \"Enter an SSN to search: \";\n    cin >> ssnSearch;\n\
  \    fstream fin(PATH + \"SSN.txt\");\n    found = false;\n    while (!fin.eof())\
  \ {\n        getline(fin, line);\n        ssn = line.substr(0, 9);\n        if (ssn\
  \ == ssnSearch) {\n            fullName = line.substr(10);\n            cout <<\
  \ fullName << endl;\n            found = true;\n            break;\n        }\n\
  \    }\n    fin.close();\n    if (!found) {\n        cout << \"Not found!\" << endl;\n\
  \    }\n    return 0;\n}\n```\n\n## 练习 41.1-6 使用子程序合并文件\n\n完成以下：\n\ni)编写一个名为 `readContent`\
  \ 的子程序，接受文件名并返回其内容。ii)编写一个名为 `writeContent` 的子程序，接受文件名和一个字符串，并将该字符串写入文件。iii)使用上述子程序，编写一个\
  \ C++程序，提示用户输入文件名，并将第一个文件的内容复制到第二个文件中。假设用户输入的是有效文件名。\n\n### 解决方案\n\n尽管这个特定的练习看起来很简单，但有必要强调关于\
  \ `readContent()` 函数的一些点。检查下面包含错误的 `readContent()` 函数并尝试找到它。该函数可以成功执行而没有任何语法错误。\n\
  \n```cpp\nstring readContent(string filename) {\n    string s, contents = \"\";\n\
  \    fstream fin(filename);\n    while (!fin.eof()) {\n        getline(fin, s);\n\
  \        contents += s + \"\\n\";\n    }\n    return contents;\n    fin.close();\n\
  }\n```\n\n这里发生的情况是，当执行返回语句时，C++忽略函数的其余语句，这意味着文件可能不会关闭。想象在程序中多次调用这个函数。你会得到许多可能不会关闭的文件。\n\
  \n![](img/notice.jpg)最新版本的 C++在没有引用（`fin`）时可能会关闭文件，但让文件打开并等待 C++为你关闭是一个坏习惯。\n\n\
  良好的做法是将返回语句放在函数的末尾，如下面程序所示。\n\n![](img/my_exercise_header.png) project_41.1-6\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nstring readContent(string\
  \ filename) {\n    string s, contents = \"\";\n    fstream fin(filename);\n    while\
  \ (!fin.eof()) {\n        getline(fin, s);\n        contents += s + \"\\n\";\n \
  \   }\n    fin.close();\n    return contents;\n}\nvoid writeContent(string filename,\
  \ string contents) {\n    fstream fout(filename, fstream::out);\n    fout << contents;\n\
  \    fout.close();\n}\nint main() {\n    string source, destination;\n    cout <<\
  \ \"Enter source filename: \";\n    cin >> source;\n    cout << \"Enter destination\
  \ filename: \";\n    cin >> destination;\n    string c = readContent(source); //等于：writeContent(destination,\
  \ c); //writeContent(destination, readContent(source))\n    return 0;\n}\n```\n\n\
  ### 41.2 复习练习\n\n完成以下练习。\n\n1)假设有一个名为“f_data41.2-1.txt”的文件，其中包含 10 个两位整数（用单个空格字符分隔）。文件结构示例所示。13\
