  \ 练习 30.5-2 寻找 x 和 y\n\n编写一个 C++ 程序，显示 -20 到 +20 范围内满足以下公式的 `x` 和 `y` 的所有整数值：\n\n\
  3x² − 6y² = 6\n\n#### Solutions\n\n如果你只想显示变量 `x` 和 `y` 的所有组合，可以使用以下代码段：\n\n```cpp\n\
  int x, y;\nfor (x = -20; x <= 20; x++) {\n    for (y = -20; y <= 20; y++) {\n  \
  \      cout << x << \"  \" << y << endl;\n    }\n}\n```\n\n然而，在所有这些组合中，你只需要满足表达式\
  \ 3x² − 6y² = 6 的组合。决策控制结构对于该目的非常完美！最终的 C++ 程序如下。\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\n\nint main() {\n    int x, y;\n    for (x\
  \ = -20; x <= 20; x++) {\n        for (y = -20; y <= 20; y++) {\n            if\
  \ (3 * pow(x, 2) - 6 * pow(y, 2) == 6) {\n                cout << x << \"  \" <<\
  \ y << endl;\n            }\n        }\n    }\n    return 0;\n}\n```\n\n#### 练习\
  \ 30.5-3 俄罗斯乘法算法\n\n你可以使用下方的流程图中的“俄罗斯乘法算法”来乘以两个正整数。\n\n![Image](img/chapter30-02.png)\n\
  \n编写相应的 C++ 程序并创建一个跟踪表，以确定在输入值 5 和 13 时每一步中变量的值。\n\n#### 解决方案\n\n在给定的流程图中，单分支决策结构嵌套在一个预测试循环结构中。对应的\
  \ C++ 程序如下。\n\n\n\n\n\n![](img/my_exercise_header.png) project_30.5-3\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int m1, m2, s;\n  \
  \  cin >> m1;\n    cin >> m2;\n    s = 0;\n    while (m2 != 0) {\n        if (m2\
