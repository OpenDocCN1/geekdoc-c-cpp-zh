  \n### 28.3 将流程图转换为 C++ 程序\n\n这种转换并不总是容易的。在某些情况下，流程图设计者并没有遵循特定的规则，因此在将流程图转换为 C++\
  \ 程序之前，可能需要对流程图进行一些修改。以下是此类情况的一个示例。\n\n![Image](img/chapter27-02.png)\n\n如你所示，此流程图片段包含的循环控制结构和你已经学过的任何结构都不匹配，例如预测试、后测试、中测试，甚至没有\
  \ for 循环控制结构。因此，你只有一种选择，就是通过添加额外的语句或删除现有的语句来修改流程图，直到已知的循环控制结构开始出现。以下是一些练习题，在其中一些练习中，初始流程图确实需要修改。\n\
  \n### 练习 28.3-1 编写 C++ 程序\n\n为以下流程图片段编写对应的 C++ 代码。\n\n![Image](img/chapter28-06.png)\n\
  \n## 解决方案\n\n这是一个非常简单的题。你必须克服的唯一障碍是真（true）和假（false）路径的位置并不正确。你需要让真路径而不是假路径来执行迭代。正如你所知道的，交换路径是可能的，但你同时也需要对布尔表达式进行取反。因此，对应的代码片段变为：\n\
  \n```cpp\ni = 0;\nwhile (i <= 90) {\n    cout << i << endl;\n    i = i + 2;\n}\n\
  cout << \"The End\" << endl;\n```\n\n使用 for 循环，该代码片段可以等价地写作：\n\n```cpp\nfor (i =\
  \ 0; i <= 90; i += 2) {\n    cout << i << endl;\n}\ncout << \"The End\" << endl;\n\
  ```\n\n### 练习 28.3-2 编写 C++ 程序\n\n为以下流程图编写对应的 C++ 程序。\n\n![Image](img/chapter28-07.png)\n\
  \n## 解决方案\n\n这个流程图包含一个后测试循环结构，其内部嵌套了一个双分支决策结构。对应的 C++ 程序如下。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i = 1;\n    do {\n   \
  \     if (i < 45) {\n            cout << i << endl;\n        }\n        else {\n\
  \            cout << -i << endl;\n        }\n        i++;\n    } while (i < 90);\n\
  \    cout << \"The End\" << endl;\n    return 0;\n}\n```\n\n### 练习 28.3-3 编写 C++\
  \ 程序\n\n为以下流程图编写对应的 C++ 程序。\n\n![Image](img/chapter28-08.png)\n\n## 解决方案\n\n噢！真一团糟！有这么多菱形！不过要小心，它们都是决策结构。你对循环结构应该非常熟悉。正如你所知道的，在循环结构中，其中一个菱形有一个向上的方向。因此，从初始图中提取出的流程图片段显然是决策结构。等等，你正在寻找的决策结构。\n\
  \n![Image](img/chapter28-09.png)\n\n当然，它是一个双分支决策结构。现在让我们识别其余部分。在双分支决策结构之前有一个流程图。\n\
  \n![Image](img/chapter28-10.png)\n\n最后，之前提到的双分支决策结构和后测试结构嵌套在流程图片段中。\n\n![Image](img/chapter28-11.png)\n\
  \n等等，预测试结构可以使用 `while` 或 `for` 语句在 C++ 中编写。程序如下。\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    int i;\n    double s;\n\
  \    s = 0;\n    for (i = 0; i <= 99; i++) {\n        do {\n            cin >> n;\n\
  \        } while (n < 0);\n        if (n < 100) {\n            s = pow(n, 2);\n\
  \        } else {\n            s = pow(n, 3);\n        }\n    }\n    cout << s <<\
  \ endl;\n    return 0;\n}\n```\n\n### 练习 28.3-4 编写 C++ 程序\n\n为以下流程图编写对应的 C++ 程序。\n\
  \n![Image](img/chapter28-12.png)\n\n## 解决方案\n\n这是一个中测试循环结构。由于这种结构没有直接对应的 C++ 语句，你可以使用\
  \ `break` 语句——或者你可以将流程图转换为更熟悉的形式。\n\n#### 方法一—— 使用 `break` 语句\n\n主要思想是创建一个无限循环 `while\
  \ (true) { ... }`，并在语句或块之间的布尔表达式求值为真时跳出循环。根据这种方法，初始流程图可以用 C++ 改写为：\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i;\n    double S, a;\n\
  \    S = 0;\n    while (true) {\n        cin >> a;\n        i++;\n        if (i\
  \ >= 90) break;\n        S = S * i;\n    }\n    cout << S << endl;\n    return 0;\n\
  }\n```\n\n记住，虽然 `break` 语句很有用，但它可能导致你写出难以阅读和理解的代码，尤其是当你大量使用它时。因此，请谨慎且少量地使用！\n\n\
  #### 方法二——转换流程图\n\n中测试循环结构及其等价形式（使用预测试循环结构）所示。\n\n![Image](img/chapter28-13.png)\n\
  \n相应的，初始图变为\n\n![Image](img/chapter28-14.png)\n\n现在，很容易编写对应的 C++ 程序了。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int i;\n    double\
  \ S, a;\n    S = 0;\n    cin >> a;\n    i++;\n    while (i < 90) {\n        S =\
  \ S * i;\n        cin >> a;\n        i++;\n    }\n    cout << S << endl;\n    return\
  \ 0;\n}\n```\n\n\n\n\n\n### 28.4 复习题\n\n完成以下练习。\n\n1) 设计与以下 C++ 程序对应的流程图：```cpp\n\
