  \n编写一个 C++ 程序，提示用户输入一个句子，并统计句子中每个元音出现的频率。使用 `unordered_map` 将元音作为键，并将它们的频率作为值。\n\
  \n#### 解决方案\n\n在编程领域，文本数据的处理和分析起着至关重要的作用。一项常见任务是统计给定文本中特定元素的频率，从而为其语言特征提供见解。元音是英语的基础组成部分，分析它们的频率可以揭示模式、辅助语言处理，甚至为某些加密算法提供帮助。\n\
  \n在下面的解决方案中，程序首先创建一个名为 `vowelsFrequency` 的 `unordered_map`，用于存储和管理每个元音（A, E, I,\
  \ O, U）的频率，初始频率均设为零。对于用户提供的句子中的每个字符，程序会检查它是否为元音，如果是元音，则更新 `vowelsFrequency` map\
  \ 中对应的频率计数。\n\n```cpp\n#include <iostream>\n#include <unordered_map>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\n\nint main() {\n    string\
  \ sentence, letter;\n    // 创建一个 unordered map 来存储每个元音的频率，初始\n    // 均设为零。\n   \
  \ unordered_map<string, int> vowelsFrequency = {\n        {\"A\", 0},\n        {\"\
  E\", 0},\n        {\"I\", 0},\n        {\"O\", 0},\n        {\"U\", 0}\n    };\n\
  \    cout << \"Enter an English sentence: \";\n    getline(cin, sentence);\n   \
  \ // 遍历用户提供句子的字符，如果它是元音，\n    // 更新（增加）vowelsFrequency unordered map 中对应的频率计数。\n\
  \    for (const auto& character : to_upper_copy(sentence)) {\n        letter = character;\n\
  \        if (vowelsFrequency.count(letter) == 1) {\n            vowelsFrequency[letter]++;\n\
  \        }\n    }\n    // 显示每个元音的频率\n    for (const auto& element : vowelsFrequency)\
  \ {\n        cout << element.first << \": \" << element.second << endl;\n    }\n\
  \    return 0;\n}\n```\n\nC++ 内置方法 `struct.count(key_name)` 如果键 `key_name` 存在于 `unordered_map`\
  \ `struct` 中返回 1，如果 `key_name` 不存在则返回 0。\n\n### 34.7 复习题：判断对错\n\n对以下每个陈述判断对错。\n\n\
  1) 冒泡排序算法（当按升序排列数组时）的核心思想是反复将数组中最小的元素移动到最低索引位置。\n2) 在升序排列的数组中，第一个元素是所有元素最大的。\n3)\
  \ 使用冒泡排序算法时，交换的总数取决于给数组。\n4) 冒泡排序算法执行交换次数最多的情况是你想要对一个已经按升序排序的数组进行降序排序。\n5) 在冒泡排序算法中，当决策控制结构测试布尔表达式\
  \ `A[n] > A[n − 1]` 时，意味着数组 `A` 的元素正在按降序排序。\n6) 在 C++ 中，排序算法比较字母的方式与比较数字相同。\n7)\
  \ 如果你想对数组 `A` 排序但保持与数组 `B` 元素的一一对应，你必须重新排列数组 `B` 的元素。\n8) 冒泡排序算法的性能有时比改进后的冒泡排序算法好。\n\
  9) 根据冒泡排序算法，在每次遍历中（最后一次外），只有一个元素被保证放置在正确的位置。\n10) 冒泡排序算法只能通过使用 `for-loops` 实现。\n\
  11) 快速排序算法不能用于排序二维数组的每一列。\n12) 插入排序算法可以按降序或升序排序。\n13) 最快的排序算法之一是改进后的冒泡排序算法。\n14)\
  \ 对于一个包含 `N` 个元素的一维数组，冒泡排序算法执行 ____ 次比较。\n15) 对于一个包含 `N` 个元素的一维数组，冒泡排序算法执行 ____\
  \ 次遍历。\n16) 当使用改进后的冒泡排序算法时，如果执行了一次完整的遍历且没有进行任何交换，则算法知道数组已排序，无需继续后续遍历。\n17) 使用选择排序算法时，如果你想对数组进行降序排序，你需要寻找最大值。\n\
  18) 选择排序算法在主内存受限的计算机系统上表现良好。\n19) 选择排序算法适用于大规模数据操作。\n20) 选择排序算法是一种非常复杂的算法。\n2121)\
  \ 插入排序算法的性能通常优于选择排序和冒泡排序算法。\n22) 插入排序算法有时被证明比快速排序算法更快。\n23) 快速排序算法被认为是最好且最快的排序算法之一。\n\
  24) 排序后的数组只包含彼此不同的元素。\n25) 搜索算法是在数据集中搜索具有特定特征项的算法。\n26) 顺序搜索算法只能用在包含算术值的数组上。\n27)\
  \ 最常用的搜索算法之一是快速搜索算法。\n28) 一种搜索算法被称为堆排序算法。\n29) 线性（或顺序）搜索算法的工作方式如下：它可以检查数组的最后一个元素是否等于给定值，然后检查倒数第二个元素，依此类推，直到到达数组开头或找到给定值。\n\
  30) 线性搜索算法在某些情况下可以比二分搜索算法更快地找到元素。\n31) 线性搜索算法可以用于大规模数据操作。\n32) 线性搜索算法不能用于已排序的数组。\n\
  33) 二分搜索算法可以用于大规模数据操作。\n34) 如果数组多次包含某个值，二分搜索算法只能找到给定值的第一次出现的位置。\n35) 使用搜索算法时，如果数组包含唯一值且找到了要查找的元素，则没有必要继续检查。\n\
  36) 二分搜索算法的主要缺点是数据需要排序。\n37) 二分搜索算法只能用于包含算术值的数组。\n38) 如果要查找的元素位于数组的最后一个位置，从数组开始搜索的线性搜索算法将检查数组中的元素。\n\
  39) 线性搜索算法可以用于二维数组。\n40) 如果使用二分搜索算法查找的元素位于至少包含三个元素的数组的第一个位置，则只需一次迭代即可找到。\n\n###\
