  ```cpp\ncountNames = 0;\ncountNotJohns = 0;\nname = \"\";\nwhile (name != \"STOP\"\
  ) {\n    cout << \"Enter a name: \";\n    cin >> name;\n    countNames++;\n    if\
  \ (name != \"John\") {\n        countNotJohns++;\n    }\n}\ncout << \"Total names\
  \ entered: \" << countNames << endl;\n```\n\n\n\n\n```cpp\n}cout << countA << \"\
  \  \" << countB << endl;return 0;}\n```\n\n人们可能会提出的合理问题是：“为什么要使用多分支控制结构？为什么不使用二选一决策结构呢？”\n\
  \n假设确实使用了如下的双选一决策结构：\n\n```cpp\nif (a > b) {countA++;}else {countB++;}\n```\n\n\
  在这个决策控制结构中，当变量 `b` 大于变量 `a` 时，变量 `countB` 会递增（这是理想的），但当变量 `b` 等于变量 `a` 时它也会递增（这是不理想的）。相反，使用多分支控制结构可以确保变量\
  \ `countB` 仅在变量 `b` 大于变量 `a`（而不是在等于 `a` 时）才递增。\n\n### 练习 30.1-2 根据位数计数数字\n\n编写一个\
  \ C++ 程序，提示用户输入 20 个整数，然后统计并显示一位数、两位和三位数整数的总数。假设用户输入的值在 1 到 999 之间。\n\n#### 答案\n\
  \n利用练习 18.1-2 中的知识，C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.1-2 \n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int count1,\
  \ count2, count3, i, a;\n    count1 = count2 = count3 = 0;\n    for (i = 1; i <=\
  \ 20; i++) {\n        cout << \"Enter a number: \";\n        cin >> a;\n       \
  \ if (a <= 9) {\n            count1++;\n        } else if (a <= 99) {\n        \
  \    count2++;\n        } else {\n            count3++;\n        }\n    }\n    cout\
  \ << count1 << \"  \" << count2 << \"  \" << count3 << endl;\n    return 0;\n}\n\
  ```\n\n### 练习 30.1-3 有多少数字的和符合总和\n\n编写一个 C++ 程序，让用户重复输入数值，直到它们的和超过 1000。在结束时，程序必须显示输入数字的总数量。\n\
  \n#### 答案\n\n在这种情况下，由于精确的迭代次数未知，因此不能使用确定循环；需要使用不确定循环。让我们使用预测试循环来创建该循环。然而，为了确保程序没有逻辑错误，遵循第\
  \ 29.3 中讨论的“Ultimate”规则至关重要。根据该规则，预测试循环结构应如下（通用形式）：\n\n```cpp\nInitialize total\n\
  while (total <= 1000) {\n    A statement or block of statements\n    Update/alter\
  \ total\n}\n```\n\n由于循环的布尔表达式依赖于变量 `total`，因此该变量必须在循环开始前初始化，并在循环内部更新（修改）。更具体地说，更新/修改变量\
  \ `total` 的语句必须是循环的最后一条语句。随后，C++ 程序如下：\n\n![](img/my_exercise_header.png) project_30.1-3\
  \ \n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int count;\n\
  \    double total, x;\n    count = 0;\n    total = 0;   //Initialization of total\n\
  \    while (total <= 1000) {   //Boolean expression dependent on total\n       \
  \ cin >> x;\n        count++;\n        total += x;   //Update/alteration of total\n\
  \    }\n    cout << count << endl;\n    return 0;\n}\n```\n\n### 练习 30.1-4 寻找正整数的总数\n\
  \n编写一个 C++ 程序，提示用户重复输入整数值，直到输入实数为止。在结束时，程序必须显示输入正整数的总数。\n\n#### 答案\n\n再次，你不知道精确的迭代次数，因此不能使用\
  \ `for` 循环。\n\n根据“Ultimate”规则，预测试循环结构如下（通用形式）：\n\n```cpp\ncout << \"Enter a number:\
  \ \"; cin >> x;    //Initialization of x\nwhile ( (int)(x) == x ) {   //Boolean\
  \ expression dependent on x\n    A statement or block of statements\n    cout <<\
  \ \"Enter a number: \"; cin >> x;   //Update/alteration of x\n}\n```\n\n最终的 C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_30.1-4 \n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double x;\n    int count;\n    count = 0;\n\
  \    cout << \"Enter a number: \"; cin >> x;\n    while ((int)(x) == x) {\n    \
  \    if (x > 0) {\n            count++;\n        }\n        cout << \"Enter a number:\
  \ \";\n        cin >> x;\n    }\n    cout << count << endl;\n    return 0;\n}\n\
  ```\n\n![](img/notice.jpg)注意，即使用户提供的第一个数字是实数（浮点数），程序也能正常运行；预测试循环结构确保执行流永远不会因为实数进入循环！\n\
  \n### 练习 30.1-5 按照用户意愿次数迭代\n\n编写一个 C++ 程序，提示用户输入两个数字，然后计算并显示第一个数的第二个数字次方幂。程序必须按照用户的意愿进行任意迭代。在每次计算结束后，程序必须提示用户他们是否希望再次计算。如果答案是“yes”，程序必须重复；否则结束。让你的程序接受所有可能的形式的答案“yes”，如“yes”、“YES”、“Yes”甚至“YeS”。\n\
  \n#### 答案\n\n根据“Ultimate”规则，预测试循环结构如下（通用形式）：\n\n```cpp\nanswer = \"YES\";   //Ιnitialization\
  \ of answer\nwhile (to_upper_copy(answer) == \"YES\") {\n    Prompt the user to\
  \ enter two numbers and then calculate and display the first number raised to the\
  \ power of the second one.\n    cout << \"Would you like to repeat? \";\n    cin\
  \ >> answer;   //Update/alteration of answer\n}\n```\n\n![](img/notice.jpg)`to_upper_copy()`\
  \ 函数确保程序对于任何用户提供的答案（yes、YES、Yes 甚至 yEs）都能正常运行！\n\n然而，这次我们不使用预测试循环结构，而是采用后测试循环结构。这是一个更好的方法，因为可以省略循环外部答案变量的初始化。与预测试循环结构不同，执行流无论如何进入循环，答案的初始化将在后测试循环内部完成，如下：\n\
  \n![](img/my_exercise_header.png) project_30.1-5 \n\n```cpp\n#include <iostream>\n\
  #include <cmath>\n#include <boost/algorithm/string.hpp>\nusing boost::algorithm;\n\
  using namespace std;\nint main() {\n    int a, b;\n    double result;\n    string\
  \ answer;\n    do {\n        cout << \"Enter two numbers: \" << endl;\n        cin\
  \ >> a >> b;\n        result = pow(a, b);\n        cout << \"The result is: \" <<\
  \ result << endl;\n        cout << \"Would you like to repeat? \";\n        cin\
  \ >> answer;\n    } while (to_upper_copy(answer) == \"YES\");\n    return 0;\n}\n\
  ```\n\n### 练习 30.1-6 寻找数字之和\n\n编写一个 C++ 程序，让用户输入一个整数，然后计算其数字之和。\n\n#### 答案\n\n在练习\
  \ 13.1-2 中，你学习了当总位数已知如何拆分整数的数字。但在本练习中，用户可以输入任何值，无论多小大。因此，总位数是一个未知数量。\n\n为了解决这个练习，可以使用循环控制结构。然而，你有两种方法可以使用。\n\
  \n第一种方法\n\n在这种方法中，核心思想是在每次迭代中分离出一个数字。然而，挑战在于确定所需的迭代总次数，因为它取决于用户提供的整数的大小。那么，这会造成障碍吗？显然不是！\n\
  \n在循环内部，用户提供的整数在每次迭代中都会不断减少，直到最终达到零。这个零值可以作为停止循环控制结构迭代的条件。例如，如果用户提供的数字是 4753，它在第一次迭代中变为\
  \ 475，在第二次迭代中变为 47，然后是 4，最终变为 0。\n\n让我们尝试使用下面的流程图来理解提议的解决方案。某些语句以通用形式编写。\n\n\n\n\
  \n\n![Image](img/chapter30-01.png)\n\n# 语句\n\n`digit ← 提取变量 x 的最后一位。`\n\n可以使用此处所示的常用\
  \ `MOD 10` 操作来实现。\n\n`digit ← x MOD 10`\n\n然而，整个概念依赖于以下语句：\n\n`x ← 保留变量 x 最后一位以外的所有数字。`\n\
  \n这条语句最终会将变量 `x` 的值置零，然后执行流退出循环。要编写此语句，可以使用此处所示的 `DIV 10` 操作。\n\n`x ← x DIV 10`\n\
  \n因此，C++ 程序变得所示：\n\n![](img/my_exercise_header.png) project_30.1-6a \n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int x, s, digit;\n    cin\
  \ >> x;\n    s = 0;\n    while (x != 0) {\n        digit = x % 10;      //这里就是 x\
  \ MOD 10 操作\n        s = s + digit;\n        x = (int)(x / 10);   //这里就是 x DIV 10\
  \ 操作\n    }\n    cout << s << endl;\n    return 0;\n}\n```\n\n让我们为输入值 `4753` 创建一个追踪表，以便更好地理解到底发生了什么。\n\
  \n| 步骤 | 语句 | 注释 | x | digit | s |\n| --- | --- | --- | --- | --- | --- |\n| 1 |\
  \ `cin >> x` | 用户输入值 4753 | 4753 | ? | ? |\n| 2 | `s = 0` | | 4753 | ? | 0 |\n|\
  \ 3 | `while (x != 0)` | 结果为真 | | | |\n| 4 | `digit = x % 10` | | 4753 | 3 | 0 |\n\
  | 5 | `s = s + digit` | | 4753 | 3 | 3 |\n| 6 | `x = (int)(x / 10)` | | 475 | 3\
  \ | 3 |\n| 7 | `while (x != 0)` | 结果为真 | | | |\n| 8 | `digit = x % 10` | | 475 |\
  \ 5 | 3 |\n| 9 | `s = s + digit` | | 475 | 5 | 8 |\n| 10 | `x = (int)(x / 10)` |\
  \ | 47 | 5 | 8 |\n| 11 | `while (x != 0)` | 结果为真 | | | |\n| 12 | `digit = x % 10`\
  \ | | 47 | 7 | 8 |\n| 13 | `s = s + digit` | | 47 | 7 | 15 |\n| 14 | `x = (int)(x\
  \ / 10)` | | 4 | 7 | 15 |\n| 15 | `while (x != 0)` | 结果为真 | | | |\n| 16 | `digit\
  \ = x % 10` | | 4 | 4 | 15 |\n| 17 | `s = s + digit` | | 4 | 4 | 19 |\n| 18 | `x\
  \ = (int)(x / 10)` | | 0 | 4 | 19 |\n| 19 | `while (x != 0)` | 结果为假 | | | |\n| 20\
  \ | `cout << s << endl` | 显示为: 19 | | | |\n\n![](img/remember.jpg)在 C++ 中，两个整数相除的结果始终是一个整数。因此，在语句\
  \ `x = (int)(x / 10)` 中，由于变量 `x` 和常量值 `10` 都是整数，`(int)` 强制转换运算符是多余的。然而，为了提高可读性，将其保留在那里是一个良好的习惯。\n\
  \n## 第二种方法\n\n在这种方法中，核心思想是将用户提供的整数转换为字符串，然后使用 `for`-循环来遍历其所有的字符（数字）。然而，在 `for`-循环中，你需要在将每个数字从\
  \ `char` 类型转换回 `int` 类型之前，将其累加到变量 `s` 中。C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_30.1-6b \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i, x, s;\n    string xStr, digit;\n    cin >> x;\n    xStr = to_string(x);\
  \  //将用户的输入转换为字符串\n    s = 0;\n    for (i = 0; i <= xStr.length() - 1; i++) {\n\
  \        digit = xStr[i];  //获取字符串形式的“数字”\n        s = s + stoi(digit);\n    }\n\
  \    cout << s << endl;\n    return 0;\n}\n```\n\n### 30.2 嵌套循环控制结构的练习\n\n#### 练习\
  \ 30.2-1 显示所有包含给定数字的三位整数\n\n编写一个 C++ 程序，提示用户输入一个数字（0 到 9），然后显示所有至少包含该用户提供的数字的三位整数。例如，对于用户提供的\
  \ 7，357、771 和 700 就是这样的整数。\n\n解决方案\n\n有三种不同的方法！第一种使用一个 `for`-循环，第二种使用嵌套的 `for`-循环，最后一种将所有三位整数转换为字符串。让我们分析一下它们！\n\
  \n###### 第一种方法——使用 for 循环和判断结构\n\n主要思想是使用一个 `for`-循环，变量 `counter` 的值从 100 到 999。在循环内部，`counter`\
  \ 变量被拆分为各个数字（`digit[3]`、`digit[2]`、`digit[1]`），并使用判断结构检查是否至少有一个数字等于提供的数字。C++ 程序如下。\n\
  \n![](img/my_exercise_header.png) project_30.2-1a \n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int x, i, digit3, r, digit2, digit1;\n \
  \   cout << \"输入一个数字 0 - 9: \";\n    cin >> x;\n    for (i = 100; i <= 999; i++)\
  \ {\n        digit3 = (int)(i / 100);\n        r = i % 100;\n        digit2 = (int)(r\
  \ / 10);\n        digit1 = r % 10;\n        if (digit3 == x || digit2 == x || digit1\
  \ == x) {\n            cout << i << endl;\n        }\n    }\n    return 0;\n}\n\
  ```\n\n###### 第二种方法——使用嵌套循环结构和判断结构\n\n这里的主要思想是使用三个嵌套的 `for`-循环。在这种情况下，有三个计数变量（`digit3`、`digit2`\
  \ 和 `digit1`），它们每一个对应三位整数的一个数字。C++ 程序如下。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    int x, digit3, digit2, digit1;\n    cout << \"输入一个数字 0\
  \ - 9: \";\n    cin >> x;\n    for (digit3 = 1; digit3 <= 9; digit3++) {\n     \
  \   for (digit2 = 0; digit2 <= 9; digit2++) {\n            for (digit1 = 0; digit1\
  \ <= 9; digit1++) {\n                if (digit3 == x || digit2 == x || digit1 ==\
  \ x) {\n                    cout << digit3 * 100 + digit2 * 10 + digit1 << endl;\n\
  \                }\n            }\n        }\n    }\n    return 0;\n}\n```\n\n如果你遵循执行流，值\
  \ 100 是第一个评估的“整数”（`digit3 = 1`，`digit2 = 0`，`digit1 = 0`）。然后，最内层循环结构将变量 `digit1`\
  \ 加 1，下一个评估的值是“整数”101。这持续到 `digit1` 达到值 9；即“整数”达到 109。然后执行流退出最内层循环结构，变量 `digit2`\
  \ 加 1，最内层循环结构再次开始，因此评估的值是“整数”110、111、112……119。该过程一直持续到评估直到 999 的整数。\n\n注意变量 `digit3`\
  \ 从 1 开始，而变量 `digit2` 和 `digit1` 从 0 开始。这是必要的，因为三位数的范围是从 100 开始而不是 0。\n\n注意 `cout`\
  \ 语句是如何组合三位数的。\n\n###### 第三种方法——将所有三位整数转换为字符串\n\n使用 `for`-循环，变量 `counter` 的值从 100\
  \ 到 999。在循环内部，计数变量被转换为字符串，`find()` 函数检查用户提供的“数字”是否存在于字符串中。C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_30.2-1c \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i;\n    string x;\n    cout << \"输入一个数字 0 - 9: \";\n    cin >> x;\n\
  \    for (i = 100; i <= 999; i++) {\n        if (to_string(i).find(x) != -1) {\n\
  \            cout << i << endl;\n        }\n    }\n    return 0;\n}\n```\n\n注意变量\
  \ `x` 的类型为 string。\n\n#### 练习 30.2-2 显示特定条件下实例\n\n编写一个 C++ 程序，显示所有三位整数，其中第一位小于第二位，且第二位小于第三位。例如，值\
  \ 357、456 和 159 就是这样的整数。\n\n解决方案\n\n使用上一个练习的知识（练习 30.2-1），有三种不同的方法！让我们分析所有的它们！\n\
  \n###### 第一种方法——使用 for 循环和判断结构\n\n使用 `for`-循环和判断结构，C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_30.2-2a \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i, r, digit1, digit2, digit3;\n    for (i = 100; i <= 999; i++) {\n\
  \        digit3 = (int)(i / 100);\n        r = i % 100;\n        digit2 = (int)(r\
  \ / 10);\n        digit1 = r % 10;\n        if (digit3 < digit2 && digit2 < digit1)\
  \ {\n            cout << i << endl;\n        }\n    }\n    return 0;\n}\n```\n\n\
  ###### 第二种方法——使用嵌套循环结构和判断结构\n\n（注：此处原文未提供具体代码块，此处根据描述逻辑翻译）\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_30.2-2b\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int digit1, digit2, digit3;\n    for (digit3 = 1; digit3 <= 9; digit3++)\
  \ {\n        for (digit2 = 0; digit2 <= 9; digit2++) {\n            for (digit1\
  \ = 0; digit1 <= 9; digit1++) {\n                if (digit3 < digit2 && digit2 <\
  \ digit1) {\n                    cout << digit3 * 100 + digit2 * 10 + digit1 <<\
  \ endl;\n                }\n            }\n        }\n    }\n    return 0;\n}\n\
  ```\n\n### 第三种方法 – 仅使用嵌套循环控制结构\n\n这种方法基于第二方法。它们之间的主要区别在于在这种情况下，变量 `digit1` 总是从大于\
  \ `digit2` 的值开始，而变量 `digit2` 总是从大于 `digit3` 的值开始。这样，第一个显示的整数将是 `123`。\n\n![](img/notice.jpg)在\
  \ `123` 之下和 `789` 之上，没有任何整数可以让布尔表达式 `digit3 < digit2 && digit2 < digit1` 为真。\n\n\
  该 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.2-2c\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int digit3, digit2, digit1;\n\
  \    for (digit3 = 1; digit3 <= 7; digit3++) {\n        for (digit2 = digit3 + 1;\
  \ digit2 <= 8; digit2++) {\n            for (digit1 = digit2 + 1; digit1 <= 9; digit1++)\
  \ {\n                cout << digit3 * 100 + digit2 * 10 + digit1 << endl;\n    \
  \        }\n        }\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)这种解决方案是最有效的，因为它没有使用任何决策控制结构，而且迭代次数保持在最少！\n\
  \n![](img/remember.jpg)正如你所看到的，一个问题可以有很多解决方案。找到最优解取决于你自己！\n\n### 30.3 使用循环控制结构进行数据验证\n\
  \n如你所所的，数据验证是限制数据输入的过程，它强制用户只输入有效值。你已经遇到过一种使用决策控制结构进行数据验证的方法。让我们回顾一个例子。\n\n```cpp\n\
  cout << \"Enter a non-negative number: \";cin >> x;\nif (x < 0) {\n    cout << \"\
  Error: Negative number entered!\";\n}else {\n    cout << sqrt(x) << endl;\n}\n```\n\
  \n然而，这种方法对用户可能并不是最的。如果他们输入了无效数字，程序会显示错误信息，执行流不可避免地到达末尾。用户必须重启程序以重新输入有效数字。\n\n接下来，你将看到三种通用形式的方法，用于使用循环控制结构来验证数据输入。在用户输入无效值的情况下，主要目标是反复提示他们，直到他们最终提供有效值为止。当然，如果用户最初输入的是有效值，执行流将继续进入程序的下一个部分。\n\
  \n你使用哪种方法取决于你是否希望显示错误信息，以及你是否希望显示不同的错误信息（为每种输入错误显示一个），或者只对任何错误显示通用的错误信息。\n\n####\
  \ 第一种方法 – 不带错误信息的验证数据输入\n\n要在不显示任何错误信息的情况下验证数据输入，可以使用以下通用形式的代码片段。\n\n```cpp\ndo\
  \ {\n    cout << \"Prompt message\";\n    cin >> input_data;\n} while (input_data\
  \ test 1 fails || input_data test 2 fails || …);\n```\n\n#### 第二种方法 – 使用通用错误信息验证数据输入\n\
  \n要验证数据输入并显示通用错误信息（即对任何类型的输入错误显示相同的错误信息），可以使用以下通用形式的代码片段。\n\n```cpp\ncout << \"\
  Prompt message\";\ncin >> input_data;\nwhile (input_data test 1 fails || input_data\
  \ test 2 fails || … ) {\n    cout << \"Error message\" << endl;\n    cout << \"\
  Prompt message\";\n    cin >> input_data;\n}\n```\n\n#### 第三种方法 – 使用不同错误信息验证数据输入\n\
  \n要验证数据输入并为每种输入错误显示不同的错误信息，可以使用以下通用形式的代码片段。\n\n```cpp\ndo {\n    cout << \"Prompt\
  \ message\";\n    cin >> input_data;\n    failure = false;\n    if (input_data test\
  \ 1 fails) {\n        cout << \"Error message 1\" << endl;\n        failure = true;\n\
  \    }else if (input_data test 2 fails) {\n        cout << \"Error message 2\" <<\
  \ endl;\n        failure = true;\n    }else if (……\n} while (failure);\n```\n\n\
  ![](img/notice.jpg)语句 `while (failure)` 等同于语句 `while (failure == true)`。\n\n#####\
  \ 练习 30.3-1 寻找奇数偶数 - 不带错误信息的验证\n\n编写一个 C++ 程序，提示用户输入一个非负整数，然后显示该数是否为偶数；否则必须显示“Odd”（奇数）。使用循环控制结构，程序还必须验证数据输入，允许用户只输入非负整数。\n\
  \n解决方案\n\n你将在第 30.3 节中学到的三种验证数据输入的方法将在这里介绍。但首先，让我们在不进行数据验证的情况下解决这个练习。\n\n```cpp\n\
  cout << \"Enter a non-negative integer: \";\ncin >> x;\nif (x % 2 == 0) {\n    cout\
  \ << \"Even\" << endl;\n}else {\n    cout << \"Odd\" << endl;\n}\n```\n\n不带错误信息的验证\n\
  \n要在不显示任何错误信息的情况下验证数据输入，请使用第 30.3 节中的第一种方法。只需将虚线矩形标记的语句替换为以下代码片段。\n\n```cpp\ndo\
  \ {\n    cout << \"Enter a non-negative integer: \";\n    cin >> x;\n} while (x\
  \ < 0 || (int)x != x);\n```\n\n最终的 C++ 程序变为\n\n![](img/my_exercise_header.png) project_30.3-1a\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double x;\n\
  \    do {\n        cout << \"Enter a non-negative integer: \";\n        cin >> x;\n\
  \    } while (x < 0 || (int)x != x);\n    if ((int)x % 2 == 0) {\n        cout <<\
  \ \"Even\" << endl;\n    }else {\n        cout << \"Odd\" << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n![](img/notice.jpg)变量 `x` 必须声明为 `double`。这是为了允许用户输入整数或浮点数。\n\n使用通用错误信息的验证\n\
  \n要验证数据输入并显示通用错误信息，请将虚线矩形标记的语句替换为基于第 30.3 节中第二种方法的代码片段。该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_30.3-1b\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    double x;\n    cout << \"Enter a non-negative integer: \";\n    cin >>\
  \ x;\n    while (x < 0 || (int)x != x) {\n        cout << \"Error! A negative value\
  \ or a float entered.\" << endl;\n        cout << \"Enter a non-negative integer:\
  \ \";\n        cin >> x;\n    }\n    if ((int)x % 2 == 0) {\n        cout << \"\
  Even\" << endl;\n    }else {\n        cout << \"Odd\" << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n带错误信息的验证\n\n在这里，替换的代码片段基于第 30.3 节中的第三种方法。要验证数据输入并为每种输入错误显示不同的错误信息，该\
  \ C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.3-1c\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double x;\n    bool failure;\n\
  \    do {\n        cout << \"Enter a non-negative integer: \";\n        cin >> x;\n\
  \        failure = false;\n        if (x < 0) {\n            cout << \"Error! You\
  \ entered a negative value\" << endl;\n            failure = true;\n        }else\
  \ if ((int)x != x) {\n            cout << \"Error! You entered a float\" << endl;\n\
  \            failure = true;\n        }\n    } while (failure);\n    if ((int)x\
  \ % 2 == 0) {\n        cout << \"Even\" << endl;\n    }else {\n        cout << \"\
  Odd\" << endl;\n    }\n    return 0;\n}\n```\n\n##### 练习 30.3-2 寻找四个数的之和\n\n编写一个\
  \ C++ 程序，提示用户输入四个正数，然后计算并显示它们的和。使用循环控制结构，程序还必须验证数据输入，并在用户输入任何非正值时显示错误信息。\n\n解决方案\n\
  \n\n\n\n\n此练习已经在练习 26.1-4 中讨论过。这里的唯一区别是，该程序必须验证数据输入，并在用户输入无效值时显示错误消息。为了方便起见，这里重现了该项练习中提出的解决方案。\n\
  \n```cpp\ntotal = 0;for (i = 1; i <= 4; i++) {cout << \"Enter a number: \";    \
  \  cin >> x;total += x;}cout << total << endl;\n```\n\n此练习的主要目的是演示如何将验证数据输入的循环控制结构嵌套到其他现有的循环控制结构中。在练习中，您应该将用虚线矩形标记的语句替换为以下代码段：\n\
  \n```cpp\ncout << \"Enter a number: \";cin >> x;while (x <= 0) {cout << \"Please\
  \ enter a positive value!\" << endl;cout << \"Enter a number: \"; cin >> x;}\n```\n\
  \n最终的 C++ 程序将变为：\n\n![](img/my_exercise_header.png) project_30.3-2\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i;\n    double total,\
  \ x;\n    total = 0;\n    for (i = 1; i <= 4; i++) {\n        cout << \"Enter a\
  \ number: \";\n        cin >> x;\n        while (x <= 0) {\n            cout <<\
  \ \"Please enter a positive value!\" << endl;\n            cout << \"Enter a number:\
  \ \";\n            cin >> x;\n        }\n        total += x;\n    }\n    cout <<\
  \ total << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意，替换后的代码段完全嵌套在这个外部\
  \ for 循环中。\n\n### 30.4 使用循环控制结构寻找最小值和最小值\n\n在第 23.2 节中，您学习了如何使用单分支决策结构找到四个值中的最小值和最大值。现在，以下代码段实现了相同的结果但仅使用了一个变量\
  \ `w` 来存储用户提供的值。\n\n```cpp\ncin >> w;    //用户输入第 1 个值\nmaximum = w;\ncin >> w; \
  \   //用户输入第 2 个值\nif (w > maximum) {maximum = w;}\ncin >> w;    //用户输入第 3 个值\nif\
  \ (w > maximum) {maximum = w;}\ncin >> w;    //用户输入第 4 个值\nif (w > maximum) {maximum\
  \ = w;}\n```\n\n除了第一对语句外，所有其他语句块都是相同的。因此，您可以只保留这些语句对中的一组，并将其封装在一个执行三次迭代的循环控制结构中，如下所示。\n\
  \n```cpp\ncin >> w;    //用户输入第 1 个值\nmaximum = w;\nfor (i = 1; i <= 3; i++) {\n\
  \    cin >> w;    //用户输入第 2、3、4 句值\n    if (w > maximum) {\n        maximum = w;\n\
  \    }\n}\n```\n\n当然，如果您想允许用户输入更多值，可以简单地增加 `for`循环的 `final_value`。\n\n相应的，接下来展示一个寻找并显示\
  \ 10 个人中体重最重者的程序。\n\n![](img/my_exercise_header.png) project_30.4a\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int w, maximum, i;\n    cout\
  \ << \"Enter a weight (in pounds): \";\n    cin >> w;\n    maximum = w;\n    for\
  \ (i = 1; i <= 9; i++) {\n        cout << \"Enter a weight (in pounds): \";\n  \
  \      cin >> w;\n        if (w > maximum) {\n            maximum = w;\n       \
  \ }\n    }\n    cout << maximum << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意`for`循环迭代的次数比用户提供的值的总数少一次。\n\
  \n尽管这个 C++ 程序运行正常，但让我们尝试一些稍微不同的方法。与其在循环之前提示用户输入第一个值并在循环内提示输入剩余的九个值，让我们让他们在循环内输入所有值。\n\
  \n然而，这里出现的问题是，无论如何，在循环迭代之前，必须为变量 `maximum` 分配一个初始值。但是，这个值不能任意选择；它取决于给定的问题。因此，选择一个“几乎任意”的初始值需要仔细的考虑，因为错误的选择可能会导致不准确的结果。\n\
  \n在练习中，所有用户提供的值都与人的体重有关。由于没有机会找到体重为负的人（至少在地球上如此），您可以安全地将初始值 `-1` 分配给变量 `maximum`，如下：\n\
  \n![](img/my_exercise_header.png) project_30.4b\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int maximum, i, w;\n    maximum = -1;\n    for\
  \ (i = 1; i <= 10; i++) {\n        cout << \"Enter a weight (in pounds): \";\n \
  \       cin >> w;\n        if (w > maximum) {\n            maximum = w;\n      \
  \  }\n    }\n    cout << maximum << endl;\n    return 0;\n}\n```\n\n一旦执行流进入循环，用户输入第一个值，决策控制结构就会求值为真。此时，变量\
  \ `maximum` 中的初始值 `-1` 将被这第一个用户提供的值所覆盖，此之后执行流将正常进行。\n\n![](img/notice.jpg)注意这种方法可能适用于所有情况。如果某个练习要求用户输入任何数字（不限于正数），则这种方法无法适用，因为用户可能只输入负值。如果发生这种情况，初始值\
  \ `-1` 将永远不会被任何用户提供的值所替换。这种方法仅在用户提供值的下限已知时用于寻找最大值，或仅在用户提供值的上限已知时用于寻找最小值。例如，如果练习要求寻找最轻的人，您可以将初始值\
  \ `+1500` 分配给变量 `minimum`，因为地球上没有体重那么重的人！作为参考，Jon Brower Minnoch 是一位美国人，他在体重巅峰时期被记录为史以来最重的人类，体重约为\
  \ 1,400 磅!!!!!\n\n#### 练习 30.4-1 验证并寻找最小值和最大值\n\n编写一个 C++ 程序，提示用户输入 10 个个人的体重，然后寻找最轻和最重的体重。使用循环控制结构，程序必须验证数据输入，并在用户输入非正值或大于\
  \ 1500 的值时显示错误消息。\n\n解决方案\n\n以上练习作为指南，您现在应该能够闭着眼睛完成！\n\n要验证数据输入，您只需要将上一个练习中的以下两行代码：\n\
  \n```cpp\ncout << \"Enter a weight (in pounds): \";cin >> w;\n```\n\n替换为以下代码段：\n\
  \n```cpp\ncout << \"Enter a weight (in pounds): \";cin >> w;while (w < 1 || w >\
  \ 1500) {cout << \"Invalid value! Enter a weight between 1 and 1500 (in pounds):\"\
  ;cin >> w;}\n```\n\n以下是寻找最轻体重的最终程序。\n\n![](img/my_exercise_header.png) project_30.4-1\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int minimum,\
  \ maximum, i, w;\n    minimum = 1500;\n    maximum = 0;\n    for (i = 1; i <= 10;\
  \ i++) {\n        cout << \"Enter a weight (in pounds): \";\n        cin >> w;\n\
  \        while (w < 1 || w > 1500) {\n            cout << \"Invalid value! Enter\
  \ a weight between 1 and 1500 (in pounds): \";\n            cin >> w;\n        }\n\
  \        if (w < minimum) {\n            minimum = w;\n        }\n        if (w\
