  #### 解决方案\n\n让我们使用下面的序列控制结构来解决这个练习。变量 `p` 必须初始化为 1 而不是 0。这是为了让语句 `p = p * i` 能够正常运行；否则最终的积将为零。\n\
  \n`p = 1; i = 2; p = p * i; i += 2; p = p * i; i += 2; p = p * i; i += 2; p = p\
  \ * i; i += 2; p = p * i; i += 2;`\n\n正如上一个练习（练习 26.1-6）所示，该序列控制结构可以被 for 循环替换，如下。\n\
  \n![](img/my_exercise_header.png) project_26.1-7\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int p, i;\n    p = 1;\n    for (i = 2; i\
  \ <= 10; i += 2) {\n        p = p * i;\n    }\n    cout << p << endl;\n    return\
  \ 0;\n}\n```\n\n### 练习 26.1-8 查找 2² + 4² + 6² + … (2N)² 的和\n\n编写一个 C++ 程序，让用户输入整数\
