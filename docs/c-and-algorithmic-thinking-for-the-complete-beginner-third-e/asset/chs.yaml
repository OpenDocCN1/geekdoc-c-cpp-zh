  \ 结果为假 | |\n| 4 | `cout << n << endl` | 它显示: 5 | |\n| 5 | `cout << a << endl` |\
  \ 它显示: 5 | |\n\n### ii) 对于输入值 −5，追踪表所示。\n\n| 步骤 | 语句 | 主代码 | void 函数 `displayAbs()`\
