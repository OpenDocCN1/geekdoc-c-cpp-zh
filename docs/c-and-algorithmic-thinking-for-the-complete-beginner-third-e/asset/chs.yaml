  \ 指令序列。\nc) 以上两者都是\n\n4) 当有人编写食谱时，他们是\na) “程序员”\nb) “用户”\nc) 以上都不是\n\n5) 以下不属于创建算法的三个主要阶段的是：\n\
  a) 数据保护\nb) 数据输入\nc) 结果输出\nd) 数据处理\n\n6) 流程图可以\na) 画在。\nb) 直接原样输入计算机。\nc) 以上两者都是\n\
