  car2.accelerate();\n```\n\n![](img/remember.jpg)类是一个不可执行的模板，而对象是类的实例，是可以执行的！\n\n\
  ![](img/remember.jpg)一个类可以被用来创建你想要的任意数量的对象（实例化）！\n\n### 39.3 构造函数与 this 关键字\n\n\
  在 C++ 中，有一种方法具有特殊作用，被称为构造函数（constructor）。每当类的实例（对象）被创建时，构造方法就会自动执行。你想要对对象进行的任何初始化都可以在此方法中完成。在\
  \ C++ 中，构造函数是一个名称与其所属类名相同的方法。\n\n请看下面的示例。构造方法 `Person()` 会被自动调用两次，一次是在对象 `p1` 创建时，另一次是在对象\
  \ `p2` 创建时，这意味着消息“An object was created”会被显示两次。\n\n![](img/my_exercise_header.png)\
  \ project_39.3a\n```cpp\n#include <iostream>\nusing namespace std;\nclass Person\
  \ {\npublic:\n//Define the constructor\nPerson() {\n    cout << \"An object was\
  \ created\" << endl;\n}\n};\nint main() {\n    Person p1, p2;\n    return 0;\n}\n\
  ```\n\n![](img/notice.jpg)注意，在构造函数的名称前面没有 `void` 关键字。\n\n在 C++ 的面向对象编程（OOP）中，有一个名为\
  \ `this` 的关键字，它作为一个指向当前对象的引用变量。请看下面的示例。\n\n![](img/my_exercise_header.png) project_39.3b\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nclass Person {\npublic:\nstring\
  \ name;\nint age;\n//Define the constructor\nPerson() {\n    cout << \"An object\
  \ was created\" << endl;\n}\nvoid sayInfo() {\n    cout << \"I am \" << this->name\
  \ << endl;\n    cout << \"I am \" << this->age << \" years old\" << endl;\n}\n};\n\
  int main() {\n    Person person1;\n//Assign values to its fields\n    person1.name\
  \ = \"John\";\n    person1.age = 14;\n    person1.sayInfo();   //Call the method\
  \ sayInfo() of the object person1\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意，在方法外部声明字段\
  \ `name` 和 `age`（但在类内部）时，你需要编写字段名而不需要使用箭头运算符（`->`）。然而，从方法内部访问字段时，你应该使用箭头运算符（`->`），例如\
  \ `this->name` 和 `this->age`。\n\n现在你脑海中可能旋转的问题是：“为什么在 `sayInfo()` 方法内部有必要将这些字段 `name`\
  \ 和 `age` 引用为 `this->name` 和 `this->age`？真的有必要在它们前面使用 `this` 关键字吗？” 一个简单的答案是，方法内部总有存在两个同名额外局部变量（`name`\
  \ 和 `age`）的可能性。因此，你需要一种方法来区分这些局部变量和对象的字段。如果你感到困惑，请尝试理解下面的示例。在 `MyClass` 类中有一个字段\
  \ `b`，在类类的 `myMethod()` 方法中有一个局部变量 `b`。`this` 关键字用于区分局部变量和字段。\n\n![](img/my_exercise_header.png)\
  \ project_39.3c\n```cpp\n#include <iostream>\nusing namespace std;\nclass FooClass\
  \  {\npublic:\nstring b;   //This is a field\nvoid myMethod() {\n    string b =\
  \ \" *** \";  //This is a local variable\n    cout << b << this->b << b << endl;\n\
  }\n};\nint main() {\n    FooClass x;    //Create object x\n    x.b = \"Hello!\"\
  ;   //Assign a value to its field\n    x.myMethod();     //It displays: *** Hello!\
  \ ***\n    return 0;\n}\n```\n\n![](img/notice.jpg)`this` 关键字可以从类的方法内部引用该类的任何成员（字段或方法）。\n\
  \n### 39.4 向构造函数传递初始值\n\n任何方法，甚至是构造函数方法，都可以在其形式参数列表中包含形式参数。例如，在构造函数方法中，你可以使用参数在创建期间向对象传递一些初始值。接下来的示例创建了四个对象，每个对象代表希腊神话中的一个\
  \ `Titan`。\n\n![](img/my_exercise_header.png) project_39.4\n```cpp\n#include <iostream>\n\
  using namespace std;\nclass Titan {\npublic:\nstring name;\nstring gender;\n//Define\
  \ the constructor\nTitan(string n, string g) {\n    this->name = n;\n    this->gender\
  \ = g;\n}\n};\nint main() {\n    Titan titan1(\"Cronus\", \"male\");\n    Titan\
  \ titan2(\"Oceanus\", \"male\");\n    Titan titan3(\"Rhea\", \"female\");\n    Titan\
  \ titan4(\"Phoebe\", \"female\");\n    return 0;\n}\n```\n\n在 C++ 中，拥有同名的一个字段和一个局部变量（甚至是一个形式参数）是合法的。因此，`Titan`\
  \ 类也可以写成如下所示：\n\n```cpp\nclass Titan {\npublic:\nstring name;\nstring gender;\n\
  //Define the constructor\nTitan(string n, string g) {\n    this->name = n;     //Fields\
  \ and arguments can have the same name\n    this->gender = g;\n}};\n\n``` `name`\
  \ 和 `gender` 是用于向构造函数传递值的参数，而 `this->name` 和 `this->gender` 是用于在对象存储值的字段。\n\n####\
  \ Exercise 39.4-1 Historical Events\n\n执行以下操作：\n\ni)编写一个名为 `HistoryEvents` 的类，包括：\n\
