  \n## 解决方案\n\n在本次练习中，你需要编写一个 `void` 函数，它接受调用者传递的值（这是主代码），然后计算并显示其绝对值。解决方案所示。\n\n\
  ![](img/my_exercise_header.png) \n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nvoid displayAbs(double n) {\n    if (n < 0) {\n        n = (-1) * n;\n \
  \   }\n    cout << n << endl;\n}\nint main() {\n    double a;\n    cin >> a;\n \
  \   displayAbs(a); // 这显示用户提供的数字的绝对值。\n    cout << a << endl; // 这显示用户提供的数字。\n \
  \   return 0;\n}\n```\n\n现在，让我们创建对应的追踪表。\n\n### i) 对于输入值 5，追踪表所示。\n\n| 步骤 | 语句 |\
