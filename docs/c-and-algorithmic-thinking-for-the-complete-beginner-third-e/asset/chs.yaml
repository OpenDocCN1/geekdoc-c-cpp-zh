  \ `cout << \"Invalid number\";` | -10 | Invalid number |\n\n## 练习 16.1-4 逻辑运算符 \n\
  \n\n\n设计流程图并编写相应的 C++ 程序，根据布尔表达式的执行来确定输出。\n\n如果 `x` 大于 0 且 `y` 小于 10，则输出“Both conditions\
  \ met”；如果 `x` 大于 0 或 `y` 小于 10，则输出“One condition met”；否则，则输出“Neither condition met”。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int x, y;\n\
  \    cout << \"Enter x: \";\n    cin >> x;\n    cout << \"Enter y: \";\n    cin\
  \ >> y;\n    if (x > 0 && y < 10) {\n        cout << \"Both conditions met\" <<\
  \ endl;\n    } else if (x > 0 || y < 10) {\n        cout << \"One condition met\"\
  \ << endl;\n    } else {\n        cout << \"Neither condition met\" << endl;\n \
  \   }\n    return 0;\n}\n```\n\n解决方案\n\n流程图如下。\n\n![Image](img/chapter16-07.png)\n\
  \ni)对于 x=5, y=5，追踪表如下：\n\n| 步骤 | 语句 | x | y | 输出 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | `cin >> x;` | 5 | | |\n| 2 | `cin >> y;` | 5 | 5 | |\n| 3 | `if\
  \ (x > 0 && y < 10)` | 5 | 5 | |\n| 4 | `cout << \"Both conditions met\";` | 5 |\
  \ 5 | Both conditions met |\n\nii)对于 x=5, y=15，追踪表如下：\n\n| 步骤 | 语句 | x | y | 输出\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `cin >> x;` | 5 | | |\n| 2 | `cin\
