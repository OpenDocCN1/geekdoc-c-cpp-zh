  \n### 16.1 单分支决策结构\n\n这是最简单的决策控制结构。它只在“真”路径上包含一个语句或语句块，如下面的一般形式给出的流程图片段所示。\n\n![Image](img/chapter16-01.png)\n\
  \n如果 `Boolean_Expression` 的求值为真，则执行该结构中的语句或语句块；否则，跳过这些语句。\n\nC++ 语句的一般形式为：\n\n```cpp\n\
  if (Boolean_Expression) {A statement or block of statements}\n```\n\n![](img/notice.jpg)注意，语句或语句块缩进了\
  \ 2 个空格。\n\n在下一个示例中，只有当用户输入小于 18 的值时，才会显示消息“你未成年！”。当用户输入大于或等于 18 的值时，不显示任何内容。\n\n\
  ![](img/my_exercise_header.png) project_16.1a\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int age;\n    cout << \"Enter your age: \";\n\
  \    cin >> age;\n    if (age < 18) {\n        cout << \"You are underage!\" <<\
  \ endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意 `cout` 语句缩进了 `2 +\
  \ 2 = 4` 个空格。\n\n在下一个示例中，只有当用户输入小于 18 的值时，才会显示消息“你未成年！”和消息“你还得再等几年”。与之前一样，当用户输入大于或等于\
  \ 18 的值时，不显示任何消息。\n\n![](img/my_exercise_header.png) project_16.1b\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int age;\n    cout << \"Enter\
  \ your age: \";\n    cin >> age;\n    if (age < 18) {\n        cout << \"You are\
  \ underage!\" << endl;\n        cout << \"You have to wait for a few more years.\"\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)所有出现在 `if` 语句内部的语句都应该向右缩进相同数量的空格。在上一个示例中，两个\
  \ `cout` 语句都缩进了 2 个空格。\n\n![](img/notice.jpg)为了节省纸张，本书每层缩进使用 2 个空格。然而，专家建议每层缩进使用\
  \ 4 个空格。\n\n![](img/notice.jpg)为了缩进文本光标，你可以不需要输入空格字符，而是按一下“Tab ![Image](img/key_tab.png)”键！\n\
  \n![](img/notice.jpg)为了对现有的语句或语句块进行缩进，选择它们并按下“Tab ![Image](img/key_tab.png)”键！\n\
  \n![](img/notice.jpg)为了取消语句或语句块的缩进，选择它们并按下“Shift ↑ + Tab ![Image](img/key_tab.png)”组合键！\n\
  \n在下一个示例中，只有当用户输入名字“Zeus”时，才会显示消息“你是众神之王”。无论用户输入什么名字，都会显示消息“你住在奥林匹斯山”。\n\n![](img/my_exercise_header.png)\
  \ project_16.1c\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    string name;\n    cout << \"Enter the name of an Olympian: \";\n    cin\
  \ >> name;\n    if (name == \"Zeus\") {\n        cout << \"You are the King of the\
  \ Gods!\" << endl;\n    }\n    cout << \"You live on Mount Olympus.\" << endl;\n\
  \    return 0;\n}\n```\n\n![](img/notice.jpg)注意最后一个 `cout` 语句不属于单分支决策结构的语句块。\n\n\
  ![](img/notice.jpg)初级程序员在编写 C++ 程序时一个非常常见的错误是混淆了赋值运算符与“等于”运算符。他们经常写成 `if (name =\
  \ \"Zeus\")`，而实际上他们想表达的是 `if (name == \"Zeus\")`。\n\n当 `if` 语句中只包含一个单一语句时，你可以省略大括号\
  \ `{ }`。因此，`if` 语句可以写成：\n\n```cpp\nif (Boolean_Expression) One_Single_Statement;\n\
  ```\n\n或者你甚至可以将整个决策结构写在一行上，如下所示：\n\n```cpp\nif (Boolean_Expression) One_Single_Statement;\n\
  ```\n\n## 练习 16.1-1 结构与追踪表\n\n设计流程图并编写相应的 C++ 程序，根据布尔表达式的执行来确定变量的值。\n\n```cpp\n\
