  \ |\n| | num1 | num2 | result | a | b | s |\n| 1 | `cin >> num1` | 2.0 | ? | ? |\
  \ | |\n| 2 | `cin >> num2` | 2.0 | 4.0 | ? | | |\n| 3 | `result = total(num1, num2)`\
  \ | | | 2.0 | 4.0 | ? |\n| 4 | `s = a + b` | | | 2.0 | 4.0 | 6.0 |\n| 5 | `return\
  \ s` | 2.0 | 4.0 | 6.0 | | |\n| 6 | `cout << \"The sum of \" << ...` | 显示: The sum\
  \ of 2 + 4 is 6 |\n\nii) 对于输入值 10, 20，追踪表所示。\n\n| 步骤 | 语句 | 主代码 | 函数 total() |\n\
