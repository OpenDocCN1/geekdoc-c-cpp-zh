  \ 使用选择控制结构的通用性练习\n\n#### 练习 23.5-1 寻找闰年\n\n编写一个 C++ 程序，提示用户输入一个年份，然后显示该年份是否为闰年；否则必须显示“Not\
  \ a leap year（不是闰年）”。此外，如果用户输入的年份小于 1582，则必须显示错误信息。\n\n（注意这涉及数据验证！）\n\n##### 解决方案\n\
  \n根据 1582 年首次引入的格列哥历，当满足以下条件之一时，该年份为闰年：\n\n1. 第 1 个条件：年份能被 4 整除，且不能被 100 整除。\n2.\
  \ 第 2 个条件：年份能被 400 整除。\n\n在表中，某些年份不是闰年，因为两个条件都不为真。\n\n| 年份 | 是否为闰年 | 条件 |\n| ---\
  \ | --- | --- |\n| 1600 | 是 | 第 2 个条件为真。能被 400 整除 |\n| 1900 | 否 | 两个条件均为假。 |\n|\
  \ 1904 | 是 | 第 1 个条件为真。能被 4 整除且不能被 100 整除 |\n| 1905 | 否 | 两个条件均为假。 |\n| 2000 | 是\
  \ | 第 2 个条件为真。能被 400 整除 |\n| 2002 | 否 | 两个条件均为假。 |\n| 2004 | 是 | 第 1 个条件为真。能被 4\
  \ 整除且不能被 100 整除 |\n| 2024 | 是 | 第 1 个条件为真。能被 4 整除且不能被 100 整除 |\n\n该 C++ 程序所示所示。\n\
  \n![](img/my_exercise_header.png) 项目 _23.5-1\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int y;\n    cout << \"Enter a year: \";\n  \
  \  cin >> y;\n    if (y < 1582) {\n        cout << \"Error! The year cannot be less\
  \ than 1582\" << endl;\n    } else {\n        if (y % 4 == 0 && y % 100 != 0 ||\
  \ y % 400 == 0) {\n            cout << \"Leap year!\" << endl;\n        } else {\n\
  \            cout << \"Not a leap year\" << endl;\n        }\n    }\n    return\
  \ 0;\n}\n```\n\n![](img/remember.jpg) 与 (`&&`) 运算符的优先级高于 或 (`||`) 运算符。\n\n#### 练习\
