  \ C++ 中，你必须将函数放在主代码之前。在其他计算机语言中（如 `Java` 或 `PHP`），你可以将函数放在主代码的上方，也可以放在下方。尽管如此，大多数程序员仍然倾向于将所有函数放在顶部以便更好地观察。\n\
  \n### 36.3 不返回值的子程序\n\n在计算机科学中，不返回值的子程序可以被称为过程（procedure）、子过程（subprocedure）、子程序（subroutine）、void\
  \ 函数（void function）等。在 C++ 中，通常使用的术语是 `void function`。\n\nC++ `void function` 的通用形式为：\n\
  \n```cpp\nvoid name([type1 arg1, type2 arg2, type3 arg3, …]) {\n    Local variables\
  \ declaration section\n    A statement or block of statements\n}\n```\n\n其中\n\n\
  - `name` 是 `void function` 的名称。\n- `arg1`, `arg2`, `arg3`, …` 是参数列表（变量、数组等），用于从调用者向\
  \ `void function` 传递值。你可以根据需要任意数量的参数。\n- `type1`, `type2`, `type3`, …` 是每个参数的数据类型。每个参数必须有一个数据类型。\n\
  \n![](img/notice.jpg)注意参数是可选的；也就是说，`void function` 可以不包含参数。\n\n例如，下一个 `void function`\
  \ 通过参数 `num1` 和 `num2` 接收两个数字，然后计算它们的和，最后显示结果。\n\n```cpp\nvoid displaySum(double\
  \ num1, double num2) {\n    double result;\n    result = num1 + num2;\n    cout\
  \ << result << endl;\n}\n```\n\n### 36.4 如何调用 void 函数\n\n你可以通过直接编写其名称来调用 `void function`。下一个例子定义了\
  \ `void function` `displayLine()`，主代码在需要显示水平线时会调用该 `void function`。\n\n![](img/my_exercise_header.png)\
  \ project_36.4a\n\n```cpp\n#include <iostream>\nusing namespace std;\n//Define the\
  \ void function\nvoid displayLine() {\n    cout << \"---------------------\" <<\
  \ endl;\n}\nint main() {\n    cout << \"Hello there!\" << endl;\n    displayLine();\n\
  \    cout << \"How do you do?\" << endl;\n    displayLine();\n    cout << \"What\
  \ is your name?\" << endl;\n    displayLine();\n    return 0;\n}\n```\n\n你可以向 `void\
  \ function` 传递（发送）值，只要 void function 括号内至少存在一个参数。在下一个例子中，`void function` `displayLine()`\
  \ 被调用了三次，但每次都通过变量 `length` 传递了不同的值，导致打印出三条长度不同的横线。\n\n![](img/my_exercise_header.png)\
  \ project_36.4b\n\n```cpp\n#include <iostream>\nusing namespace std;\nvoid displayLine(int\
  \ length) {\n    int i;\n    for (i = 1; i <= length; i++) {\n        cout << \"\
  -\";\n    }\n    cout << endl;\n}\nint main() {\n    cout << \"Hello there!\" <<\
  \ endl;\n    displayLine(12);\n    cout << \"How do you do?\" << endl;\n    displayLine(14);\n\
  \    cout << \"What is your name?\" << endl;\n    displayLine(18);\n    return 0;\n\
  }\n```\n\n![](img/remember.jpg)由于 `void function` `displayLine()` 不返回值，下面这行代码是错误的。你不能将\
  \ `void function` 赋值给变量，因为没有任何返回值！\n\n```cpp\ny = display_line(12);\n```\n\n此外，你不能在语句中调用它。下面这行代码也是错误的。\n\
  \n```cpp\ncout << \"Hello there!\\n\" << display_line(12) << endl;\n```\n\n### 36.5\
  \ 形参与实参\n\n每个函数（或 `void function`）都包含一个称为形参列表（formal argument list）的参数列表。如所述，此列表中的参数是可选的；形参数列表可以不包含参数、一个参数或多个参数。\n\
  \n当调用子程序（函数或 `void function`）时，可以将一个参数列表传递给子程序。这个列表被称为实参列表（actual argument list）。\n\
  \n在下一个例子中，形参（变量）`n1` 和 `n2` 构成形参数列表，而实参（变量）`x` 和 `y` 以及实参（表达式）`x + y` 和 `y / 2`\
  \ 构成实参列表。\n\n![](img/my_exercise_header.png) project_36.5\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n//Define the function multiply().\n// The two arguments n1\
  \ and n2 are called formal arguments.\ndouble multiply( double n1, double n2 ) {\n\
  \    double result;\n    result = n1 * n2;\n    return result;\n}\n//Main code starts\
  \ here\nint main() {\n    double x, y, w;\n    cin >> x;\n    cin >> y;\n    //Call\
  \ the function multiply().\n    // The two arguments x and y are called actual arguments.\n\
  \    w = multiply( x, y );\n    cout << w << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意参和实参之间存在一一对应关系。在第一次调用中，实参\
  \ `x` 被传递给形参 `n1`，实参 `y` 被传递给形参 `n2`。在第二次调用中，实参（表达式）`x + 2` 被传递给形参 `n1`，实参（表达式）`y\
  \ / 2` 被传递给形参 `n2`。\n\n### 36.6 函数是如何执行的？\n\n当主代码调用函数时，会执行以下步骤：\n\n- 主代码语句的执行被中断。\n\
  - 实参列表中变量的值或表达式的结果被传递（赋值）给形参数列表中对应的参数（变量），执行流跳转到函数所在的位置。\n- 执行函数的内部语句。\n- 当执行流到达\
  \ `return` 语句时，值从函数返回到主代码，执行流从调用函数之前继续。\n\n在下一个 C++ 程序中，`maximum()` 函数接收两个参数（数值），并返回这两个值中的较大者。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\ndouble maximum(double val1,\
  \ double val2) {\n    double m;\n    m = val1;\n    if (val2 > m) {\n        m =\
  \ val2;\n    }\n    return m;\n}\n//Main code starts here\nint main() {\n    double\
  \ a, b, maxim;\n    cin >> a;\n    cin >> b;\n    maxim = maximum(a, b);\n    cout\
  \ << maxim << endl;\n    return 0;\n}\n```\n\n\n\n\n当 C++ 程序开始运行时，第一个执行的语句是 `cin\
  \ >> a`（这被认为是程序的的第一条语句）。\n\n下面是一个追踪表，显示了精确的执行流、变量 `a` 和 `b` 的值如何从主代码传递到函数，以及函数如何返回其结果。假设用户输入了值\
  \ 3 和 8。\n\n| 步骤 | 主代码语句 | a | b | maxim |\n| --- | --- | --- | --- | --- |\n| 1\
  \ | `cin >> a` | 3.0 | ? | ? |\n| 2 | `cin >> b` | 3.0 | 8.0 | ? |\n| 3 | `maxim\
  \ = maximum(a, b)` | | | |\n\n当调用函数 `maximum()` 时，主代码语句的执行被中断，变量 `a` 和 `b` 的值被传递（赋值）给形式参数\
  \ `val1` 和 `val2`，执行流跳转到函数定义所在。然后，执行函数的语句。\n\n| 步骤 | 函数 maximum() 语句 | val1 | val2\
  \ | m |\n| --- | --- | --- | --- | --- |\n| 4 | `m = val1` | 3.0 | 8.0 | 3.0 |\n\
  | 5 | `if (val2 > m)` | 值为 true |\n| 6 | `m = val2` | 3.0 | 8.0 | 8.0 |\n| 7 | `return\
  \ m` | | | |\n\n当执行流到达 `return` 语句时，值 8 从函数返回到主代码（赋值给变量 `maxim`），执行流从调用函数之前的位置继续执行。主代码在屏幕上显示值\
  \ 8。\n\n| 步骤 | 主代码语句 | a | b | maxim |\n| --- | --- | --- | --- | --- |\n| 8 | `cout\
  \ << maxim << endl` | 3.0 | 8.0 | 8.0 |\n\n#### 练习 36.6-1 基础 – 计算两个数之和\n\n执行以下操作：\n\
  \ni) 编写一个名为 `total` 的子程序，通过其形式参数列表接受两个数值，然后计算并返回它们的和。\nii) 使用上述子程序编写一个 C++ 程序，让用户输入两个数字并显示它们的和。接下来，创建一个追踪表，以确定\
  \ C++ 程序在两次执行过程中每一步中变量的值。\n\n两次执行的输入值为：(i) 2, 4；以及 (ii) 10, 20。\n\n解决方案\n\n在本次练习中，你需要编写一个函数，该函数从调用者（即主代码）接受两个值，然后计算并返回它们的和。解决方案所示所示。\n\
  \n![](img/my_exercise_header.png)\n\n```cpp\ninclude <iostream>\nusing namespace\
  \ std;\ndouble total(double a, double b) {\n    double s;\n    s = a + b;\n    return\
  \ s;\n}\nint main() {\n    double num1, num2, result;\n    cin >> num1;\n    cin\
  \ >> num2;\n    result = total(num1, num2);\n    cout << \"The sum of \" << num1\
  \ << \" + \" << num2 << \" is \" << result << endl;\n    return 0;\n}\n```\n\n现在，让我们创建追踪表。由于你对它们已经更加熟悉了，删除了“备注”列。\n\
