  \n### 32.1 在 C++ 中创建二维数组\n\n二维数组是一种可以存储按行和列组织的值的数据结构。它允许你高效地表示和操作表格化数据。例如，一个可以存储三名学生四门课程成绩的数组如下。\n\
  \n![Image](img/chapter32-01.png)\n\n二维数组有行和列。在这个特定的示例中，`array grades` 有 3 行 4 列。\n\
  \n与一维数组一样，有许多方法可以创建并向二维数组添加元素（以及值）。让我们尝试使用最常用的方法创建 `grades` 数组。\n\n#### 方法一\n\n\
  要创建一个数组并直接为其元素赋值，可以使用可以使用 C++ 语句，其通用形式如下：\n\n`type array_name[number_of_rows][number_of_columns]\
  \ = {{value0-0, value0-1, value0-2, …, value0-M},{value1-0, value1-1, value1-2,\
  \ …, value1-M},{value2-0, value2-1, value2-2, …, value2-M},…{valueN-0, valueN-1,\
  \ valueN-2, …, valueN-M}};`\n\n其中：\n\n- `type` 可以是 `int`、`double`、`string` 等。\n\
  - `array_name` 是数组名称。\n- `number_of_rows` 和 `number_of_columns` 可以是任何正整数。`number_of_rows`\
  \ 的值是可选的。\n- `value0-0`、`value0-1`、`value0-2`、…… `valueN-M` 是数组元素的值。\n\n对于这种方法，你可以可以使用语句创建\
  \ `grades` 数组：\n\n`string grades[3][4] = {{\"B+\", \"A+\", \"A\", \"C-\"},{\"B\"\
  , \"A\", \"C\", \"A+\"},{\"B\", \"B\", \"B-\", \"B+\"}};`\n\n也可以写成一行：\n\n`string\
  \ grades[][4] = {{\"B+\", \"A+\", \"A\", \"C-\"}, {\"B\", \"A\", \"C\", \"A+\"},\
  \ {\"B\", \"B\", \"B-\", \"B+\"}};`\n\n索引会自动设置。第一个值 “B+” 被赋值给索引 0 列 0，第二个值 “A+”\
  \ 被赋值给索引 0 列 1，以此类推。\n\n#### 方法二\n\n你可以可以使用语句在 C++ 中创建一个带有空元素的二维数组，其通用形式如下：\n\n\
  `type array_name[number_of_rows][number_of_columns];`\n\n其中：\n\n- `type` 可以是 `int`、`double`、`string`\
  \ 等。\n- `array_name` 是数组名称。\n- `number_of_rows` 和 `number_of_columns` 可以是任何正整数。这两个值都是必须的。\n\
  \n然后你可以可以使用语句为数组元素赋值，其通用形式如下：\n\n`array_name[row_index][column_index] = value;`\n\
  \n其中 `row_index` 和 `column_index` 分别是数组元素的行索引和列索引。\n\n以下代码片段创建一个 3 行 4 列 12 个空元素的\
  \ `grades` 数组，然后为其元素赋值。\n\n```cpp\nstring grades[3][4];\ngrades[0][0] = \"B+\";\n\
  grades[0][1] = \"A+\";\ngrades[0][2] = \"A\";\ngrades[0][3] = \"C-\";\ngrades[1][0]\
  \ = \"B\";\ngrades[1][1] = \"A\";\ngrades[1][2] = \"C\";\ngrades[1][3] = \"A+\"\
  ;\ngrades[2][0] = \"B\";\ngrades[2][1] = \"B\";\ngrades[2][2] = \"B-\";\ngrades[2][3]\
  \ = \"B+\";\n```\n\n### 32.2 如何从二维数组获取值\n\n二维数组由行和列组成。下面的示例展示了一个三行四列的二维数组。\n\n![Image](img/chapter32-03.png)\n\
  \n二维数组的每个元素可以使用一对索引来唯一标识：行索引和列索引，如下所示。\n\n`array_name[row_index][column_index]`\n\
  \n以下代码片段创建一个具有三行四列的二维数组 `grades`，然后显示它的某些元素。\n\n```cpp\nstring grades[3][4] = {{\"\
  B+\", \"A+\", \"A\", \"C-\"},{\"B\", \"A\", \"C\", \"D\"},{\"B\", \"B\", \"B-\"\
  , \"B+\"}};\ncout << grades[1][2] << endl; // 它显示: C\ncout << grades[2][2] << endl;\
  \ // 它显示: B-\ncout << grades[0][0] << endl; // 它显示: B+\n```\n\n#### 练习 32.2-1 创建追踪表\n\
  \n为以下代码片段创建追踪表。\n\n\n\n\n\n```cpp\nint a[3][2] = {{0, 0},{0, 0},{0, 0}};a[1][0]\
  \ = 9;a[0][1] = 1;a[0][0] = a[0][1] + 6;x = 2;a[x][1] = a[0][0] + 4;a[x - 1][1]\
  \ = a[0][1] * 3;a[x][0] = a[x - 1][1] - 3;\n```\n\n## 解决方案\n\n此代码段使用了一个 3 × 2 数组，即具有\
  \ 3 行 2 列的数组。追踪表如下。\n\n| 步骤 | 语句 | 注释 | x | a |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | `int[3][2] a = {{0, 0}, {0, 0}, {0, 0}}` | 这创建了一个初始值为零的数组 `a`。 | ? |\
  \ \\| 0 \\| 0 \\| \\| 0 \\| 0 \\| \\| 0 \\| 0 \\| |\n| 2 | `a[1][0] = 9` | | ? |\
  \ \\| 0 \\| 0 \\| \\| 9 \\| 0 \\| \\| 0 \\| 0 \\| |\n| 3 | `a[0][1] = 1` | | ? |\
  \ \\| 0 \\| 1 \\| \\| 9 \\| 0 \\| \\| 0 \\| 0 \\| |\n| 4 | `a[0][0] = a[0][1] +\
  \ 6` | | ? | \\| 7 \\| 1 \\| \\| 9 \\| 0 \\| \\| 0 \\| 0 \\| |\n| 5 | `x = 2` |\
  \ | 2 | \\| 7 \\| 1 \\| \\| 9 \\| 0 \\| \\| 0 \\| 0 \\| |\n| 6 | `a[x][1] = a[0][0]\
  \ + 4` | | 2 | \\| 7 \\| 1 \\| \\| 9 \\| 0 \\| \\| 0 \\| 11 \\| |\n| 7 | `a[x -\
  \ 1][1] = a[0][1] * 3` | | 2 | \\| 7 \\| 1 \\| \\| 9 \\| 3 \\| \\| 0 \\| 11 \\|\
  \ |\n| 8 | `a[x][0] = a[x - 1][1] - 3` | | 2 | \\| 7 \\| 1 \\| \\| 9 \\| 3 \\| \\\
  | 0 \\| 11 \\| |\n\n### 32.3 如何遍历二维数组\n\n由于二维数组由行和列组成，程序可以按行遍历，也可以按列遍历。\n\n### 按行遍历\n\
  \n按行遍历意味着首先处理第 0 行，接着处理第 1 行，然后是第 2 行，以此此类推。下面是一个 3 × 4 数组的示例。箭头显示了执行行遍历时遵循的“路径”，换句话说，它们显示了元素处理的顺序。\n\
  \n![Image](img/chapter32-04.png)\n\n![](img/remember.jpg)一个 3 × 4 数组是一个具有 3 行 4\
  \ 列的二维数组。在 `Y × X` 表示法中，第一个数字 (Y) 始终代表总行数，第二个数字 (X) 始终代表总列数。\n\n当按行遍历时，数组元素的处理方式如下：\n\
  \n► 第 0 行的元素处理顺序为 `a[0][0]` -> `a[0][1]` -> `a[0][2]` -> `a[0][3]`\n► 第 1 行的元素处理顺序为\
  \ `a[1][0]` -> `a[1][1]` -> `a[1][2]` -> `a[1][3]`\n► 第 2 行的元素处理顺序为 `a[2][0]` ->\
  \ `a[2][1]` -> `a[2][2]` -> `a[2][3]`\n\n### 方法一\n\n使用 C++ 语句，让我们尝试通过行遍历来处理 3 ×\
  \ 4 数组（3 行 × 4 列）的所有元素。\n\n```cpp\ni = 0; // 变量 i 指向第 0 行。\nfor (j = 0; j <= 3;\
  \ j++) { // 此循环控制结构处理第 0 行的所有元素\n    process a[i][j];\n}\ni = 1; // 变量 i 指向第 1 行。\n\
  for (j = 0; j <= 3; j++) { // 此循环控制结构处理第 1 行的所有元素\n    process a[i][j];\n}\ni =\
  \ 2; // 变量 i 指向第 2 行。\nfor (j = 0; j <= 3; j++) { // 此循环控制结构处理第 2 行的所有元素\n    process\
  \ a[i][j];\n}\n```\n\n当然，使用嵌套循环控制结构也可以相同的结果：\n\n```cpp\nfor (i = 0; i <= 2; i++)\
  \ {\n    for (j = 0; j <= 3; j++) {\n        process a[i][j];\n    }\n}\n```\n\n\
  让我们看一些例子。以下代码段允许用户向数组 `b` 输入 10 × 10 = 100 个值。\n\n```cpp\nfor (i = 0; i <= 9; i++)\
  \ {\n    for (j = 0; j <= 9; j++) {\n        cin >> b[i][j];\n    }\n}\n```\n\n\
  以下代码段将数组 `b` 的所有值减 1。\n\n```cpp\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <=\
  \ 9; j++) {\n        b[i][j]--; // 等于：b[i][j] = b[i][j] - 1\n    }\n}\n```\n\n以下代码段显示数组\
  \ `b` 的所有元素。\n\n```cpp\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++)\
  \ {\n        cout << b[i][j] << \"\\t\";\n    }\n    cout << endl;\n}\n```\n![](img/notice.jpg)\
  \ `cout << endl` 语句用于在行与行之间“显示”空行。\n\n### 方法二\n\n还有另一种方法非常简单，但没有前一种方法灵活。如下所示，在某些情况下它是无法使用的。以下是用通用形式编写的代码片段：\n\
  \n```cpp\nfor (const auto& row : array_name) {\n    for (const auto& element : row)\
  \ {\n        process element;\n    }\n}\n```\n\n其中 `process` 是任何 C++ 语句或语句块，用于每次迭代处理数组中的一个元素。以下\
  \ C++ 程序显示数组 `b` 的所有元素，每次迭代显示一个。\n\n```cpp\nfor (const auto& row : b) {\n    for\
  \ (const auto& element : row) {\n        cout << element << \"\\t\";\n    }\n  \
  \  cout << endl;\n}\n```\n\n但记住，这种方法不能用于修改数组中元素的值。例如，如果你想将 `numbers` 中所有元素的值翻倍，你不能执行以下操作：\n\
  \n```cpp\nint numbers[2][4] = {{5, 10, 3, 2}, {2, 4, 1, 6}};\nfor (const auto& x\
  \ : numbers) {\n    for (const auto& number : x) {\n        number *= 2;\n    }\n\
  ```\n\n### 按列遍历\n\n按列遍历意味着首先处理第 0 列，接着处理第 1 列，然后是第 2 列，以此此类推。下面是一个 3 × 4 数组的示例。箭头显示了执行列遍历时遵循的“路径”，换句话说，它们显示了元素处理的顺序。\n\
  \n![Image](img/chapter32-04.png)\n\n当按列遍历时，数组元素的处理方式如下：\n\n► 第 0 列的元素处理顺序为 `a[0][0]`\
  \ -> `a[1][0]` -> `a[2][0]`\n► 第 1 列的元素处理顺序为 `a[0][1]` -> `a[1][1]` -> `a[2][1]`\n\
  ► 第 2 列的元素处理顺序为 `a[0][2]` -> `a[1][2]` -> `a[2][2]`\n► 第 3 列的元素处理顺序为 `a[0][3]` ->\
  \ ...\n\n### 方法一\n\n使用 C++ 语句，让我们尝试通过列遍历来处理 3 × 4 数组（3 行 × 4 列）的所有元素。\n\n```cpp\n\
  j = 0; // 变量 j 指向第 0 列。\nfor (i = 0; i <= 2; i++) { // 此循环控制结构处理第 0 列的所有元素\n   \
  \ process a[i][j];\n}\nj = 1; // 变量 j 指向第 1 列。\nfor (i = 0; i <= 2; i++) { // 此循环控制结构处理第\
  \ 1 列的所有元素\n    process a[i][j];\n}\nj = 2; // 变量 j 指向第 2 列。\nfor (i = 0; i <= 2;\
  \ i++) { // 此循环控制结构处理第 2 列的所有元素\n    process a[i][j];\n}\nj = 3; // 变量 j 指向第 3 列。\n\
  for (i = 0; i <= 2; i++) { // 此循环控制结构处理第 3 列的所有元素\n    process a[i][j];\n}\n```\n\
  \n当然，使用嵌套循环控制结构也可以相同的结果：\n\n```cpp\nfor (j = 0; j <= 3; j++) {\n    for (i = 0;\
  \ i <= 2; i++) {\n        process a[i][j];\n    }\n}\n```\n\n让我们看一些例子。以下代码段允许用户向数组\
  \ `b` 输入 10 × 10 = 100 个值。\n\n```cpp\nfor (j = 0; j <= 9; j++) {\n    for (i = 0;\
  \ i <= 9; i++) {\n        cin >> b[i][j];\n    }\n}\n```\n\n以下代码段将数组 `b` 的所有值减 1。\n\
  \n```cpp\nfor (j = 0; j <= 9; j++) {\n    for (i = 0; i <= 9; i++) {\n        b[i][j]--;\
  \ // 等于：b[i][j] = b[i][j] - 1\n    }\n}\n```\n\n以下代码段显示数组 `b` 的所有元素。\n\n```cpp\n\
  for (j = 0; j <= 9; j++) {\n    for (i = 0; i <= 9; i++) {\n        cout << b[i][j]\
  \ << \"\\t\";\n    }\n    cout << endl;\n}\n```\n\n### 方法二\n\n还有另一种方法非常简单，但没有前一种方法灵活。如下所示，在某些情况下它是无法使用的。以下是用通用形式编写的代码片段：\n\
  \n```cpp\nfor (const auto& col : array_name) {\n    for (const auto& element : col)\
  \ {\n        process element;\n    }\n}\n```\n\n其中 `process` 是任何 C++ 语句或语句块，用于每次迭代处理数组中的一个元素。以下\
  \ C++ 程序显示数组 `b` 的所有元素，每次迭代显示一个。\n\n```cpp\nfor (const auto& row : b) {\n    for\
  \ (const auto& element : row) {\n        cout << element << \"\\t\";\n    }\n  \
  \  cout << endl;\n}\n```\n\n但记住，这种方法不能用于修改数组中元素的值。例如，如果你想将 `numbers` 中所有元素的值翻倍，你不能执行以下操作：\n\
  \n```cpp\nint numbers[2][4] = {{5, 10, 3, 2}, {2, 4, 1, 6}};\nfor (const auto& row\
  \ : numbers) {\n    for (auto& x : row) {\n        x *= 2;\n    }\n}\n```\n\n##\
  \ 32.5 如何向二维数组添加用户输入的值\n\n与一维数组一样，与其从键盘读取用户输入的值并将其赋值给变量，不如直接将该值赋值给特定的数组元素。以下代码片段创建了二维数组名称，提示用户输入六个值，并将这些值赋值给数组元素。\n\
  \n\n\n\n\n```cpp\nint main() {\n    string names[3][2];\n    cout << \"Name for\
  \ row 0, column 0: \";\n    cin >> names[0][0];\n    cout << \"Name for row 0, column\
  \ 1: \";\n    cin >> names[0][1];\n    cout << \"Name for row 1, column 0: \";\n\
  \    cin >> names[1][0];\n    cout << \"Name for row 1, column 1: \";\n    cin >>\
  \ names[1][1];\n    cout << \"Name for row 2, column 0: \";\n    cin >> names[2][0];\n\
  \    cout << \"Name for row 2, column 1: \";\n    cin >> names[2][1];\n    // …\n\
  }\n```\n\n使用嵌套的 for 循环，这段代码片段可以等价写为：\n\n```cpp\nconst int ROWS = 3;\nconst int COLUMNS\
  \ = 2;\nint main() {\n    int i, j;\n    string names[ROWS][COLUMNS];\n    for (i\
  \ = 0; i <= ROWS - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n   \
  \         cout << \"Name for row \" << i << \", column \" << j << \": \";\n    \
  \        cin >> names[i][j];\n        }\n    }\n    return 0;\n    // …\n}\n```\n\
  \n### 练习 32.4-1 只显示实数\n\n编写一个 C++ 程序，提示用户在 5 × 7 数组中输入数值，然后显示包含实数的元素索引。\n\n####\
