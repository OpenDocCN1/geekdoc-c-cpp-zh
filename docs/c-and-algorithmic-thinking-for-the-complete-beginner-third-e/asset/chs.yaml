  Invalid\";` | 3 | 1 | Invalid |\n\n## 16.2 复习习题：判断/错误\n\n对以下每个陈述判断判断或错误。\n\n\n\n\
  \n\n1) 当必须执行一组语句时，使用单分支决策结构。\n2) 你使用单分支决策结构，是为了让其他程序员更容易理解你的程序。\n3) 单分支决策结构中包含的语句可能一个都不执行。\n\
  4) 在流程图中，决策符号（**Decision symbol**）并不并不代表算法的开始和结束。\n5) 下面的代码在语法上是正确的：\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nconst int if = 5;\nint main() {\n    int x;\n\
  \    x = if + 5;\n    cout << x << endl;\n    return 0;\n}\n```\n6) 单分支决策结构使用了保留关键字\
  \ `else`。\n7) 下面的代码片段满足确定性属性：\n```cpp\nif (b != 3) {\n    x = a / (b - 3);\n}\n\
  ```\n8) 下面的 C++ 程序满足确定性属性：\n```cpp\n#include <iostream>\nusing namespace std;\n\
  int main() {\n    double a, b, x;\n    cin >> a >> b;\n    if (b != 3) {\n     \
  \   x = a / (b - 3);\n    }\n    cout << x << endl;\n    return 0;\n}\n```\n\n###\
  \ 16.3 复习题：多选题\n\n为以下每个陈述选择正确答案。\n\n1) 单分支决策结构用于以下情况：\n   a) 语句一个接一个执行。\n   b) 在执行某些语句之前必须做出决策。\n\
  \   c) 以上都不是。\n   d) 以上都是。\n\n2) 单分支决策结构在以下路径上包含语句或语句块：\n   a) 仅假路径。\n   b) 两条路径都有。\n\
  \   c) 仅真路径。\n\n3) 在下面的代码片段 `if (x == 3)x = 5;y++;` 中，语句 `y++` 的执行情况：\n   a) 仅当变量\
  \ `x` 的值为 3 时执行。\n   b) 仅当变量 `x` 的值为 5 时执行。\n   c) 仅当变量 `x` 的值不等于 3 时执行。\n   d)\
  \ 总是执行。\n\n4) 在下面的代码片段 `if (x % 2 == 0) y++;` 中，语句 `y++` 在以下情况执行：\n   a) 变量 `x`\
  \ 能被 2 整除。\n   b) 变量 `x` 包含偶数。\n   c) 变量 `x` 不包含奇数。\n   d) 以上都是。\n   e) 以上都不是。\n\
  \n5) 在下面的代码片段 `x = 3 * y;if (x > y) y++;` 中，语句 `y++` 是：\n   a) 总是执行的。\n   b) 从不执行。\n\
  \   c) 仅当变量 `y` 包含正值时执行。\n   d) 以上都不是。\n\n### 16.4 复习练习\n\n完成以下练习。\n\n1) 识别以下 C++\
