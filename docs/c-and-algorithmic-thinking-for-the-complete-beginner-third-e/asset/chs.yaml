  \ 的子程序，显示以下菜单：\n    1) 米转换为英里\n    2) 英里转换为米\n    3) 退出\n    ii) 编写一个名为 `metersToMiles`\
  \ 的子程序，通过形式参数列表接受一个米单位的值，然后显示消息“XX 米等于 YY 英里”，其中 XX 和 YY 必须替换为实际值。\n    iii) 编写一个名为\
  \ `milesToMeters` 的子程序，通过形式参数列表接受一个英里单位的值，然后显示消息“YY 英里等于 XX 米”，其中 XX 和 YY 必须替换为实际值。\n\
  \    iv) 使用上述子程序，编写一个 C++ 程序，显示上述菜单，并提示用户输入一个选项（1、2 或 3）和一个距离。程序必须计算并显示所需的值。该过程必须根据用户的意愿重复。\n\
  \n    已知 1 英里 = 1609.344 米。\n\n19) LAV 手机公司每月收取客户 10 美元的基础费用，并根据客户每月内使用手机通话的总秒数收取额外费用。使用下表所示的费率。\n\
  \n| 手机通话秒数 | 额外费率（美元/秒） |\n| --- | --- |\n| 1 - 600 | 免费 |\n| 601 - 1200 | $0.01\
  \ |\n| 1201 及以上 | $0.02 |\n\n    完成以下操作：\n    i) 编写一个名为 `amountToPay` 的子程序，通过形式参数列表接受秒数，然后显示要支付的总金额。请注意费率是阶梯式的。此外，联邦、州和地方税会在每张账单中增加\
  \ 11%。\n    ii) 使用上述子程序，编写一个 C++ 程序，提示用户输入手机通话的秒数，然后显示要支付的总金额。\n\n# 第 37 章\n子程序的提示技巧\n\
  \n### 37.1 两个子程序可以使用同名的变量吗？\n\n每个子程序都使用自己的内存空间来存储变量的值。即使是主代码也有自己的内存空间！这意味着你可以在主代码中有一个名为\
  \ `test` 的变量，在子程序中有一个另一个名为 `test` 的变量，在另一个子程序中还有一个名为 `test` 的变量。注意！这三个变量是三个完全不同的变量，位于不同的内存位置，可以持有完全不同的值。\n\
  \n如后续程序所示，在三个不同的内存位置上有三个名为 `test` 的变量，每一个都持有一个完全不同的值。下方的追踪表可以帮助你理解实际情况。\n\n![](img/my_exercise_header.png)\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nvoid f1() {\n    string test;\n\
  \    test = \"Testing!\";\n    cout << test << endl;\n}\nvoid f2(int test) {\n \
  \   cout << test << endl;\n}\n//Main code starts here\nint main() {\n    int test;\n\
  \    test = 5;\n    cout << test << endl;\n    f1();\n    f2(10);\n    cout << test\
  \ << endl;\n    return 0;\n}\n```\n\n追踪表所示：\n\n| 步骤 | 语句 | 备注 | 主代码 | void 函数 f1()\
  \ | void 函数 f2() |\n| --- | --- | --- | --- | --- | --- |\n| test | test | test\
  \ | | | |\n| 1 | test = 5 | | 5 | | |\n| 2 | cout << test << endl | 显示: 5 | 5 |\
  \ | |\n| 3 | f1() | 调用了 f1() | | ? | |\n| 4 | test = \"Testing!\" | | | Testing!\
  \ | |\n| 5 | cout << test << endl | 显示: Testing! | | Testing! | |\n| 6 | f2(10)\
  \ | 调用了 f2() | | | 10 |\n| 7 | cout << test << endl | 显示: 10 | | | 10 |\n| 8 | cout\
  \ << test << endl | 显示: 5 | 5 | | |\n\n![](img/notice.jpg) 注意，子程序中使用的变量“生命周期”持续到子程序执行完毕。这意味着在调用子程序之前，它的任何变量（包括形式参数列表中的变量）都不存在主内存（RAM）中。它们在子程序被调用时定义在主内存中，当子程序结束且执行流返回调用者时，它们都会从主内存中移除。只有“永远”存在（或者至少在\
  \ C++ 程序执行期间）的变量是主代码的变量和全局变量！你将在第 37.6 节学习更多关于全局变量的知识。\n\n\n\n\n[content]\n\n###\
  \ 37.2 子程序可以调用另一个子程序吗？\n\n到目前，你可能认为只有主代码可以调用子程序。然而，事实并非如此！子程序可以调用任何其他子程序，而该子程序又可以调用另一个程序，以此类推。你可以进行任何需要的组合。例如，你可以编写一个调用\
  \ void 函数的函数、一个调用函数的 void 函数、一个调用另一个函数的函数，甚至可以一个调用 C++ 内置函数之一的函数。\n\n接下来的示例正是展示了这种情况。主代码调用\
  \ void 函数 `displaySum()`，该函数反过来又调用函数 `add()`。\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint add(int number1, int number2) {\n    int result;\n    result\
  \ = number1 + number2;\n    return result;\n}\nvoid displaySum(int num1, int num2)\
  \ {\n    cout << add(num1, num2) << endl;\n}\nint main() {\n    int a, b;\n    cin\
  \ >> a >> b;\n    displaySum(a, b);\n    return 0;\n}\n```\n\n当执行流到达函数 `add()` 的\
  \ `return` 语句时，它会返回到调用者处，即 void 函数 `displaySum()`。然后，当执行流到达 void 函数 `displaySum()`\
  \ 的结尾时，它会返回到调用者处，即主代码。\n\n注意，这两个子程序的编写顺序没有限制。如果将 void 函数 `displaySum()` 写在函数 `add()`\
  \ 之前，结果也将是完全相同的。\n\n### 37.3 按值和按引用传递参数\n\n在 C++ 中，变量是通过值传递传递给子程序的。这意味着如果参数的值在子程序内部发生变化，它在子程序外部不会发生变化。看下面的示例。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nvoid f1(int b) {\n    b++;\
  \ // 这是 void 函数 f1() 的一个变量\n    cout << b << endl; // 显示为: 11\n}\nint main() {\n\
  \    int a;\n    a = 10; // 这是主代码中的一个变量\n    f1(a);\n    cout << a << endl; // 显示为:\
  \ 10\n    return 0;\n}\n```\n\n变量 `a` 的值 10 通过参数 `b` 传递给 void 函数 `f1()`。然而，尽管 void\
  \ 函数内部修改了变量 `b` 的内容，当执行流返回主代码时，这个变化不会影响 `a` 的值。\n\n在上一个示例中，主代码和 void 函数使用了两个不同的变量。然而，即使主代码和\
  \ void 函数都使用同名的变量，结果也是一样的。接下来的示例操作方式完全相同，显示的结果也上一个示例完全一致。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nvoid f1(int a) {\n    a++; // 这是 void 函数 f1() 的一个变量\n    cout\
  \ << a << endl; // 显示为: 11\n}\nint main() {\n    int a;\n    a = 10; // 这是主代码中的一个变量\n\
  \    f1(a);\n    cout << a << endl; // 显示为: 10\n    return 0;\n}\n```\n\n尽管如此，如果你想让子程序改变其参数的值并在子程序外部也反映这一变化，你必须按引用传递参数。为了做到这一点，你必须在形式参数列表的参数名称前加上（附加）一个安符（`&`）。看下面的示例，在形式参数列表中参数\
  \ `b` 前面加上了一个安符（`&`）。\n\n```cpp\n#include <iostream>\nusing namespace std;\nvoid\
  \ f1(int &b) {\n    b++;\n    cout << b << endl; // 显示值 11\n}\nint main() {\n  \
  \  int a;\n    a = 10;\n    f1(a);\n    cout << a << endl; // 显示值 11\n    return\
  \ 0;\n}\n```\n\n但要注意一点：只有变量可以按引用传递。你不能像这里所示按引用传递常量值或表达式。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nvoid f1(int &b) {\n    b++;\n}\nint main() {\n    int x;\n\
  \    x = 9;\n    f1(x); // 这可以正常工作！\n    f1(10); // 这是错误的！\n    f1(x + 1); // 这也是错误的！\n\
  \    return 0;\n}\n```\n\n正如你可能已经意识到的，按引用传递值可以为子程序提供“返回”一个或多个值的间接方法。在下一个示例中，函数 `divMod()`\
  \ 将变量 `a` 除以变量 `b` 并找到它们的整数商和整数余数。如果一切顺利，它返回 `true`；否则返回 `false`。此外，通过两个参数 `intQuotient`\
  \ 和 `intRemainder`，函数还间接返回了计算出的商和计算出的余数。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nbool divMod(int a, int b, int &intQuotient, int &intRemainder) {\n    bool\
  \ returnValue = true;\n    if (b == 0) {\n        returnValue = false;\n    } else\
  \ {\n        intQuotient = (int)(a / b);\n        intRemainder = a % b;\n    }\n\
  \    return returnValue;\n}\nint main() {\n    int val1, val2;\n    int intQ = 0,\
  \ intR = 0;\n    bool ret;\n    cin >> val1 >> val2;\n    ret = divMod(val1, val2,\
  \ intQ, intR);\n    if (ret == true) {\n        cout << intQ << \"  \" << intR <<\
  \ endl;\n    } else {\n        cout << \"Sorry, wrong values entered!\" << endl;\n\
  \    }\n    return 0;\n}\n```\n\n关于形式参数列表中的参数，一个很好的策略是将所有按值传递的参数写在按引用传递的参数之前。\n\n\
  ### 37.4 传递和/返回数组\n\n将数据结构作为参数传递给子程序和传递简单变量一样容易。接下来的示例将数组 `a` 传递给 void 函数 `display()`，后者将显示该数组。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS = 10;\n\
  void display(int b[]) {\n    int i;\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \        cout << b[i] << \"\\t\";\n    }\n}\nint main() {\n    int i;\n    int a[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> a[i];\n    }\n    display(a);\n\
  \    return 0;\n}\n```\n\n与变量不同，C++ 中的数据结构默认是按引用传递的。这意味着如果你将（例如）一个数组传递给子程序，而该子程序更改了数组中一个或多个元素的值，这些变化也会反映在子程序外部。看下面的示例。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nvoid f1(int x[]) {\n    x[0]++;\n\
  \    cout << x[0] << endl; // 显示为 6\n}\nint main() {\n    int y[] = {5, 10, 15,\
  \ 20};\n    cout << y[0] << endl; // 显示为 5\n    f1(y);\n    cout << y[0] << endl;\
  \ // 显示为 6\n    return 0;\n}\n```\n\n向子程序传递数组传递引用而不是副本，这意味着 `y` 和 `x` 实际上是同一个数组的别名。主内存（RAM）中只存在一个数组副本。如果子程序更改了元素的值，这个变化也会反映在主程序中。\n\
  \n在下一个示例中，C++ 程序必须找到数组 `t` 的三个最小值。为了实现这一点，程序通过其形式参数 `x` 将数组传递给 void 函数 `getArray()`，该函数反过来使用插入排序算法对数组\
  \ `x` 进行排序。当执行流返回主代码时，数组 `t` 也已经好了。这是因为正如所述，C++ 中的数组按引用传递的。因此，主代码最终做的只是显示数组前三个元素的值。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS = 10;\n\
  void getArray(int x[]) {\n    int m, n, element;\n    for (m = 1; m <= ELEMENTS\
  \ - 1; m++) {\n        element = x[m];\n        n = m;\n        while (n > 0 &&\
  \ x[n - 1] > element) {\n            x[n] = x[n - 1];\n            n--;\n      \
  \  }\n        x[n] = element;\n    }\n}\nint main() {\n    int i;\n    int t[] =\
  \ {75, 73, 78, 70, 71, 74, 72, 69, 79, 77};\n    getArray(t);\n    cout << \"Three\
  \ lowest values are: \" << endl;\n    cout << t[0] << \"  \" << t[1] << \"  \" <<\
  \ t[2] << endl;\n    // 在这一步，数组 t 已经排序\n    for (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n        cout << t[i] << endl;\n    }\n    return 0;\n}\n```\n\n\n\n\n\n![](img/notice.jpg)由于主代码中的数组\
  \ `t` 是通过引用传递给 `void` 函数的，因此主内存（RAM）中只存在一份数组，这意味着 `t` 和 `x` 实际上是同一个数组的别名。当执行流返回主代码时，数组\
  \ `t` 也会被排序。\n\n然而，在很多情况下通过引用传递数组可能会导致完全灾难的后果。假设你有以下两个数组。数组 `names` 包含 10 个城市的名称，数组\
  \ `t` 包含这些城市在某一天某个特定小时记录的对应温度。\n\n![Image](img/chapter37-01.png)\n\n现在，假设你希望显示数组\
  \ `t` 中最低的三个温度。如果你调用之前 C++ 程序中的 `void` 函数 `getArray()`，你就会遇到问题。虽然可以按照要求显示这三个最低温度，但数组\
  \ `t` 变得已经排序了；因此，它的元素与 `names` 数组元素之间的一一对应关系将永远丧失！\n\n一种可能的解决方案是编写一个函数，在该函数中将数组复制到一个辅助数组，并让函数返回一个只包含三个最低值的较小数组。然而，在\
  \ C++ 中从子程序返回数组并没有返回简单变量那样容易。\n\n要从子程序返回数组，可以使用以下提供的通用形式代码段作为指南。\n\n```cpp\ntype\
  \ *function_name() {static type ret_array[N];...return ret_array;}int main() {type\
  \ *rx_name = function_name(); //This calls the function…\n```\n\n其中：\n\n- `type`\
  \ 是函数返回的数组的数据类型\n- `function_name` 是函数名\n- `ret_array[N]` 是函数返回给调用者的数组（包含 `N` 个元素）\n\
  - `rx_name` 是接收函数返回数组的数组名称。\n\n根据此，所提的解决方案所示。\n\n![](img/my_exercise_header.png)\
  \ project_37.4d\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS\
  \ = 10;\nint *getArray(int x[]) {\nint m, n, element;\nint auxX[ELEMENTS];\n//将数组\
  \ x 复制到数组 auxX\nfor (m = 0; m <= ELEMENTS - 1; m++) {\n    auxX[m] = x[m];\n}\n\
  //对数组 auxX 进行排序\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n    element = auxX[m];\n\
  \    n = m;\n    while (n > 0 && auxX[n - 1] > element) {\n        auxX[n] = auxX[n\
  \ - 1];\n        n--;\n    }\n    auxX[n] = element;\n}\nstatic int retArray[] =\
  \ { auxX[0], auxX[1], auxX[2] };\nreturn retArray;\n}\nint main() {\nint i;\nint\
  \ t[] = { 75, 73, 78, 70, 71, 74, 72, 69, 79, 77 };\nint *low = getArray(t);\ncout\
  \ << \"Three lowest values are: \" << endl;\ncout << low[0] << \"  \" << low[1]\
  \ << \"  \" << low[2] << endl;\n// 在这一步中，数组 t 没有被排序\nfor (i = 0; i <= ELEMENTS -\
  \ 1; i++) {\n    cout << t[i] << endl;\n}\nreturn 0;\n}\n```\n\n![](img/notice.jpg)注意，你不能使用类似\
  \ `int auxX[] = x` 的语句来将数组 `x` 的元素复制到 `auxX`。这就是为什么在前面的示例未使用 `for-loop` 来将数组 `x`\
  \ 的元素复制到数组 `auxX` 中。\n\n### 37.5 默认参数值（可选参数）\n\n如果你为形式参数列表中的参数分配了默认值，这意味着如果没有为该参数传递值，则将使用默认值。在下一个示例中，函数\
  \ `prependTitle()` 设计用于在名称之前为标题添加前缀（添加开头）。然而，如果没有为参数 `title` 传递值，函数将使用默认值“M”。\n\n\
  ![](img/my_exercise_header.png) project_37.5\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nstring prependTitle(string name, string title = \"M\") {\n   \
  \ return title + \"  \" + name;\n}\nint main() {\n    cout << prependTitle(\"John\
  \ King\") << endl; //It displays: M John King\n    cout << prependTitle(\"Maria\
  \ Miller\", \"Ms\") << endl; //It displays: Ms Maria Miller\n    return 0;\n}\n\
  ```\n\n![](img/notice.jpg)当为形式参数列表中的参数分配了默认值时，该参数被称为“可选参数”。\n\n![](img/notice.jpg)在形式参数列表中，任何可选参数都必须位于任何非可选参数的右侧；相反操作将是错误的。\n\
  \n### 37.6 变量的作用域\n\n变量的作用域是指该变量的影响范围。在 C++ 中，变量可以具有局部作用域或全局作用域。在子程序内部声明的变量具有局部作用域，且只能在该子程序内部被访问。相反，在子程序外部声明的变量具有全局作用域，可以从任何子程序内部以及主代码中访问。\n\
  \n让我们来看一些例子。下一个示例声明了一个全局变量 `test`。尽管尽管如此，这个全局变量的值在 `void` 函数内部被访问并显示。\n\n![](img/my_exercise_header.png)\
  \ project_37.6a\n```cpp\n#include <iostream>\nusing namespace std;\nint test; //Declare\
  \ test as global\nvoid displayValue() {\n    cout << test << endl; //It displays:\
  \ 10\n}\nint main() {\n    test = 10; //This is a global variable\n    displayValue();\n\
  \    cout << test << endl; //It displays: 10\n    return 0;\n}\n```\n\n![](img/notice.jpg)全局变量必须在主函数外部声明。大多数程序员倾向于将它们都放在顶部以便于观察。\n\
  \n但要小心！如果全局变量的值在子程序内部被更改，此更改也会反映在子程序外部。在下一个示例中，`void` 函数 `displayValue()` 将全局变量\
  \ `test` 的值增加到 11，当执行流返回主代码时，将显示 11 的值。\n\n![](img/my_exercise_header.png) project_37.6b\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint test; //Declare test as global\n\
  void displayValue() {\n    test++;\n    cout << test << endl;\n}\nint main() {\n\
  \    test = 10;\n    displayValue();\n    cout << test << endl;\n    return 0;\n\
  }\n```\n\n下一个程序声明了一个全局变量 `test`、`void` 函数 `displayA()` 内部的局部变量 `test` 以及 `void`\
  \ 函数 `displayB()` 内部的另一个局部变量 `test`。请记住，全局变量 `test` 和两个局部变量 `test` 是三个不同的变量！此外，第三个函数\
  \ `displayC()` 使用并修改了全局变量 `test` 的值。这是因为在该内部没有局部变量 `test`。\n\n![](img/my_exercise_header.png)\
  \ project_37.6c\n```cpp\n#include <iostream>\nusing namespace std;\nint test; //Global\
  \ variable\nvoid displayA() {\n    int test; //Local variable\n    test = 7;\n \
  \   cout << test << endl; //It displays: 7\n}\nvoid displayB() {\n    int test;\
  \ //Local variable\n    test = 9;\n    cout << test << endl; //It displays: 9\n\
  }\nvoid displayC() {\n    //Use the value of the global variable\n    cout << test\
  \ << endl; //It displays: 10\n    test++; //Increase the value of the global variable\n\
  }\nint main() {\n    test = 10; //This is the global variable\n    cout << test\
  \ << endl; //It displays: 10\n    displayA();\n    cout << test << endl; //It displays:\
  \ 10\n    displayB();\n    cout << test << endl; //It displays: 10\n    displayC();\n\
  \    cout << test << endl; //It displays: 11\n    return 0;\n}\n```\n\n### 37.7\
