  \ 语句，它们都将到达 case 11。\n\n#### 练习 23.5-3 检查大小写和标点符号\n\n编写一个 C++ 程序，提示用户输入一个句子，然后检查其大小写和标点符号。程序必须判断字符串是否以大写字母开头并以标点符号结束（仅检查句号、问号和感叹号）。\n\
  \n##### 解决方案\n\n在此练习中，你需要分离字符串的第一个字符和最后一个字符。正如你所知道的，你可以使用下标表示法访问字符串的任何字符。你可以使用索引\
  \ 0 访问第一个字符，索引 1 访问第二个字符，以此此类推。\n\n因此，你可以使用以下 C++ 语句分离字符串的第一个字符\n\n```cpp\nfirstChar\
  \ = sentence[0];\n```\n\n另一方面，最后一个字符的索引比字符串长度少 1。你可以使用 `length()` 方法获取任何字符串的长度。使用以下语句，你可以分离字符串\
  \ sentence 的最后一个字符\n\n```cpp\nlength = sentence.length();\nlastChar = sentence[length\
  \ - 1];\n```\n\n\n\n\n或者，使用更简洁的语句：\n\n```cpp\nlastChar = sentence[sentence.length()\
  \ - 1];\n```\n\n此处展示了该 C++ 程序。\n\n![](img/my_exercise_header.png) project_23.5-3\n\
  ```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\nusing namespace\
  \ boost::algorithm;\nusing namespace std;\nint main() {\n    string sentence, firstChar,\
  \ lastChar;\n    bool sentenceIsOkay;\n    cout << \"Enter a sentence: \";\n   \
  \ getline(cin, sentence);\n    // 获取第一个字符并将其 char 转换为 string\n    firstChar = sentence[0];\n\
  \    // 获取最后一个字符并将其 char 转换为 string\n    lastChar = sentence[sentence.length() -\
  \ 1];\n    sentenceIsOkay = true;\n    if (firstChar != to_upper_copy(firstChar))\
  \ {\n        sentenceIsOkay = false;\n    } else if (lastChar != \".\" && lastChar\
  \ != \"?\" && lastChar != \"!\") {\n        sentenceIsOkay = false;\n    }\n   \
  \ if (sentenceIsOkay) {\n        cout << \"Sentence is okay!\" << endl;\n    }\n\
  \    return 0;\n}\n```\n\n起初，程序假设句子是正确的（`sentenceIsOkay = true`）。然后，它检查大小写是否正确以及标点是否正确，如果发现错误，则将变量\
  \ `sentenceIsOkay` 赋值为 `false`。\n\n![](img/remember.jpg)`cin` 语句在从键盘读取字符串时，会将空格字符视为终止字符。因此，使用\
  \ `cin` 读取字符串意味着始终读取单个单词，而不是短语或整个句子。要读取两个或更多单词，可以使用 `getline()` 函数。\n\n#### 练习 23.5-4\
  \ 数字是回文吗？\n\n回文数是指在反转数字后保持不变的数字。例如，数字 13631 就是一个回文。编写一个 C++ 程序，让用户输入一个五位整数，并测试该数字是否为回文。此外，当用户输入浮点数或任何少于或五位的整数时，必须为每种类型的输入错误显示不同的错误信息。\n\
  \n（注意：这涉及数据验证！）\n\n##### 解决方案\n\n实际上有两种不同的方法！第一种方法是将数字的数字拆分为五个不同的变量，而第二种方法将数字视为字符串处理。让我们分析一下两者！\n\
  \n###### 方法一\n\n要测试用户输入的是否回文数，你需要像在第 13 章中学习的那样，将其数字拆分为五个不同的变量。然后，你可以检查第 1 位是否等于第\
  \ 5 位，第 2 位是否等于第 4 位。如果该判断结果为真，则该数字是回文数。\n\n为了验证数据输入，你需要检查用户输入的是否五位数。请记住，所有五位数数字都在\
  \ 10000 到 99999 范围内。因此，你只需要将数据输入限制在这个范围内。\n\n为了显示许多不同的错误信息，最佳实践是使用多重选择决策结构，首先检查所有情况的数据输入有效性，然后尝试解决所需的问题。例如，如果你需要检查各种错误，可以像下面操作。\n\
  \n![Image](img/chapter23-23.png)\n\n此处展示了最终的 C++ 程序。\n\n![](img/my_exercise_header.png)\
  \ project_23.5-4a\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int digit1, r, digit2, digit3, digit4, digit5;\n    double x;\n    cin\
  \ >> x;\n    if (x != (int)x) {\n        cout << \"You entered a float\" << endl;\n\
  \    } else if (x < 10000) {\n        cout << \"You entered less than five digits\"\
  \ << endl;\n    } else if (x > 99999) {\n        cout << \"You entered more than\
  \ five digits\" << endl;\n    } else {\n        // 将 x 的数字拆分为 5 个不同的变量\n       \
  \ digit1 = (int)(x / 10000);\n        r = (int)x % 10000;\n        digit2 = (int)(r\
  \ / 1000);\n        r = r % 1000;\n        digit3 = (int)(r / 100);\n        r =\
  \ r % 100;\n        digit4 = (int)(r / 10);\n        digit5 = r % 10;\n        if\
  \ (digit1 == digit5 && digit2 == digit4) {\n            cout << \"Palindrome\" <<\
  \ endl;\n        } else {\n            cout << \"Not Palindrome\" << endl;\n   \
  \     }\n    }\n    return 0;\n}\n```\n\n###### 方法二\n\n这种方法将数字视为字符串处理。它比较第一个字符和最后一个字符、第二个字符和倒数第二个字符。如果它们相等，意味着该数字是回文数。此处展示了该\
  \ C++ 程序。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n \
  \   string xStr;\n    double x;\n    cin >> x;\n    if (x != (int)x) {\n       \
  \ cout << \"You entered a float\" << endl;\n    } else if (x < 10000) {\n      \
  \  cout << \"You entered less than five digits\" << endl;\n    } else if (x > 99999)\
  \ {\n        cout << \"You entered more than five digits\" << endl;\n    } else\
  \ {\n        xStr = to_string((int)x);\n        if (xStr[0] == xStr[4] && xStr[1]\
  \ == xStr[3]) {\n            cout << \"Palindrome\" << endl;\n        } else {\n\
  \            cout << \"Not palindrome\" << endl;\n        }\n    }\n    return 0;\n\
  }\n```\n\n### 23.6 布尔表达式参考和实用技巧\n\n本节总结了你到为止在 C++ 旅程中遇到的所有布尔表达式，以及额外的表达式和实用技巧。无论你是初学者还是资深程序员，这些表达式和技巧都将成为你编程工具箱中宝贵的工具。请妥善保存，因为你不知道它们何时会派上用场。对于某些表达式，提供了两种或两种以上的方法来实现所需的结果。\n\
  \n1. 如何检查数字 `x` 是否在 `A` 和 `B` 之间：► `x >= A && x <= B`\n2. 如何检查数字不在 `A` 和 `B` 之间：►\
  \ `!(x >= A && x <= B)`\n3. 如何检查 `x` 是否等于 `A`、`B` 或 `C`：► `x == A || x == B || x\
  \ == C`\n4. 如何检查 `x` 既不等于 `A` 不等于 `B` 也不等于 `C`：► `x != A && x != B && x != C`\n\
  5. 如何检查 `x` 是否为整数：► `x == (int)x`\n6. 如何检查 `x` 是否为偶数：► `x % 2 == 0`\n7. 如何检查 `x`\
  \ 是否为奇数：► `x % 2 != 0`\n8. 如何检查 `x` 是否包含奇数：► `x % 2 != 0`\n9. 如何检查 `x` 是否是 `y` 的倍数：►\
  \ `x % y == 0`\n10. 提取浮点数的整数部分：► `(int)x`\n11. 提取浮点数的第一位数字：► `(int)(x % 10)`\n12.\
  \ 提取浮点数的第二位数字：► `(int)(x * 100)`\n13. 提取浮点数的第 $N^{th}$ 位数字：► `(int)(x * pow(10,\
  \ N)) % 10`\n14. 提取整数的最后一位：► `x % 10`\n15. 提取整数的倒数第二一位：► `(int)(x / 10) % 10`\n\
  16. 提取整数的第 $N^{th}$ 位：► `(int)(x / pow(10, N)) % 10`\n17. 如何检查单词/句子是否以字母“B”开头：►\
  \ `x[0] == 'B'`\n18. 如何检查单词/句子是否以句号“.”结尾：► `x[x.length() - 1] == '.'`\n19. 找到三个数字\
  \ `x`, `y`, `z` 中的中间数字：► `x + y + z - minimum -`\n20. 找到三个数字 `x`, `y`, `z` 中两个最小数字的和：►\
  \ `x + y + z - maximum`\n21. 找到三个数字 `x`, `y`, `z` 中两个最大数字的和：► `x + y + z - minimum`\n\
  22. 找到五个数字 `x`, `y`, `z`, `w`, `u` 中的三个中间数字的和：► `x + y + z + w + u - minimum - maximum`\n\
  23. 如何检查两个数字之间的距离是否大于 `NUMBER`：► `abs(x - y) > NUMBER`\n24. 如何检查正整数是否为三位数：► `x >=\
  \ 100 && x <= 999`\n25. 如何检查整数是否为三位数：► `abs(x) >= 100 && abs(x) <= 999`\n26. 如何检查正整数是否为四位数且以\
  \ 5 开头：► `x >= 5000 && x <= 5999`\n27. 如何检查两个数字是否具有同符号符号：► `x > 0 && y > 0 || x\
  \ < 0 && y < 0`\n28. 如何检查两个数字是否均为偶数或均为奇数：► `x % 2 == 0 && y % 2 == 0 || x % 2 ==\
  \ 1 && y % 2 == 1`\n29. 如何检查两个条件 `BE1` 或 `BE2` 中恰有一个为真，但不同时（异或运算）：► `BE1 && !(BE2)\
  \ || BE2 && !(BE1)`\n30. 如何检查年份 `y` 是否为闰年：► `y % 4 == 0 && y % 100 != 0 || y % 400\
