  \n![Image](img/chapter21-02.png)\n\n#### 练习 21.2-3 设计流程图\n\n设计与以下 C++ 程序对应的流程图。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double a,\
  \ y, b;\n    cin >> a;\n    if (a < 0)\n        y = a * 2;\n    else if (a < 10)\n\
  \        y = a / 2;\n    else if (a < 100)\n        y = a + 2;\n    else {\n   \
  \     cin >> b;\n        y = a * b;\n        if (y > 0) //这是一个嵌套的双分支决策结构\n     \
  \       y--;\n    }\n}\n```\n\n\n\n\n\n```cpp\ny++;      //\n}\ncout << y << endl;return\
  \ 0;}\n```\n\n### 答案\n\n在这个 C++`程序` 中，一个双重分支决策结构被嵌套在一个多重分支决策结构中。\n\n流程图所示。\n\n![Image](img/chapter21-03.png)\n\
  \n### 21.3 你很可能会犯的错误！\n\n在流程图中，初级程序员经常犯的一个常见错误是让某些路径未连接，如下方的流程所示。\n\n![Image](img/chapter21-04.png)\n\
