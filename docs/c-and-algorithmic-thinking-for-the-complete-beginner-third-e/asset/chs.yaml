  \ No 29 (Glass bottles): Volume = 8.472940 cubic feet\n```\n\niii) 找到并显示所有物品的总体积（立方英尺）。\n\
  iv) 找到并显示体积最大的箱子的描述。\n\n请记住，一个立方英尺等于 1728 立方英寸。\n\n## 5)\n编写一个 C++ 程序，提示用户输入两个文件名。程序必须合并这两个文件的内容，并将合并后的文本写入名为\
  \ `final.txt` 的第三文件中，将第一个文件的内容放在第二个文件内容之后。如果用户提供的文件名不包含 `.txt` 扩展名，程序必须显示错误信息。\n\
  \n## 6)\n假设有一个名为 `f_data41.2-6.txt` 的文件，其中包含 15 个数字，每行一个。编写一个 C++ 程序，使用泡沫排序算法对这些数字进行升序排序，并将排序后的值写入同一个文件中，位于初始未排序值的下方。\n\
  \n## 7)\n假设有一个名为 `f_data41.2-7.txt` 的文件，其中包含八个城市名称及其在特定日的最高温度。文件的结构示例所示：`New York82.3Washington\
  \ DC84.3..`\n\n因此，奇数行包含城市名称，偶数行包含每个城市的最高温度。编写一个 C++ 程序逐行读取文件，并将城市名称和温度分别存储在数组 `cities`\
  \ 和 `temperatures` 中。假设文件中至少有一个城市名称及其对应的温度。程序随后必须：\n\ni) 计算并显示所有城市的平均温度。\nii) 找到并显示最高温度以及所有具有该温度的城市名称。\n\
  \n## 8)\n诸如“revolutionary”和“internationalization”之类的单词非常长，反复写它们会非常疲。。如果一个单词的长度超过\
  \ 10 个字符，我们就认为它太长。在这种情况下，该单词必须替换为特殊的缩写，其生成方法为：保留单词的首字母和最后一个字母，并在它们之间插入字母的数量。例如，“revolutionary”变成“r11y”，“internationalization”变成“i18n”。\n\
  \n假设有一个名为 `f_data41.2-8.txt` 的文件，包含英文文本。执行以下操作：\n\ni) 编写一个名为 `abbreviate` 的子程序，接受一个单词，当其长度超过\
  \ 10 个字符时，返回其缩写；否则返回原单词。\nii) 使用上述子程序，编写一个 C++ 程序，从文件中读取文本并在所有长单词替换为其缩写后显示出来。\n\n\
  假设单词由单个空格字符分隔。\n\n## 9)\nPig Latin（猪爪拉丁语）是一种在英语国家经常使用的趣味语言游戏。它涉及根据一组简单的规则改变单词的字母。以下是将单词翻译成\
  \ Pig Latin 的规则：\n- 如果单词以元音开头，直接在单词末尾加上“way”。例如，“apple”变成“appleway”。\n- 如果单词以一个或多个辅音开头，将辅音移动到单词末尾并加上“ay”。例如，“banana”变成“ananabay”，“flower”变成“owerflay”。\n\
  \n假设有一个名为 `f_data41.2-9.txt` 的文件，包含英文文本。执行以下操作：\n\ni) 编写一个名为 `pigLatinTranslator`\
  \ 的子程序，接受一个英文单词并返回对应的 Pig Latin 翻译。\nii) 使用上述子程序，编写一个 C++ 程序从文件中读取文本并将相应的翻译写入 `pig_latin_translation.txt`\
  \ 文件。\n\n假设文本仅包含小写字母，且单词由单个空格分隔。\n\n## 10)\n给定两个字符串 `X = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
  ` 和 `Y = \"JKWCTAMEDXSLFBYUNG RZOIQHP\"`，你可以加密任何消息。持有字符串 `Y` 的人可以通过逐一映射字符串 X 到字符串\
  \ Y 来解密消息。具体来说，“A”加密为“J”，“B”加密为“K”，“C”加密为“W”，依此类推。根据这种加密方法，编写一个 C++ 程序提示用户输入消息，然后将加密消息写入名为\
  \ `encrypted.txt` 的文件。空格字符不能被加密，应在加密消息中保持不变。\n\n## 11)\n编写一个 C++ 程序解密上一个的消息（位于 `encrypted.txt`\
  \ 中），并将解密消息写入名为 `decrypted.txt` 文件。\n\n## 12)\n编写一个名为 `copyFile` 的子程序，接受两个参数（源和目标），然后使用目标名称创建源文件的新副本。\n\
  \n## 13)\n假设有一个名为 `f_data41.2-13.txt` 的文件，其中包含三角形三边的长度（每行一个）。文件的结构示例所示：`16.020.622.7`\n\
  \n执行以下操作：\n\ni) 编写一个名为 `Triangle` 的类，包括：\na) 三个私有浮点型字段名为 `_sideA`、`_sideB` 和 `_sideC`。\n\
