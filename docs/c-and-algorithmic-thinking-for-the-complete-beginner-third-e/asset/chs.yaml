  \    student2.displayValues();\n    return 0;\n}\n```\n\n### 39.8 复习题：判断题\n\n对以下每个陈述判断对或错。\n\
  \n1) 在编写大型程序时，过程化编程优于面向对象的编程。\n2) 面向对象编程关注对象。\n3) 对象将数据和功能结合在一起。\n4) 面向对象编程让你更容易维护代码，但你的代码无法被他人方便地使用。\n\
  5) 你可以在不使用类的情况下创建对象。\n6) 创建类的新实例的过程被称为“安装”（installation）。\n7) 在 OOP 中，你总是必须为同一个类创建至少两个实例。\n\
  8) 构造函数方法在对象实例化时执行。\n9) 当你创建两个同一类的实例时，该类的构造函数方法会执行两次。\n10) 字段上方 `private` 关键字指定该字段可以从类外部访问。\n\
  11) 方法上方的 `public` 关键字指定该方法可以从类外部调用。\n12) 面向对象编程原则规定，类的数据应该是隐藏的，并防止被意外修改。\n13) Getter\
  \ 和 setter 方法提供了一种灵活的机制，用于读取、写入或计算字段的值。\n14) Getter 和 setter 方法暴露了类的内部实现细节。\n15)\
  \ 类继承是 OOP 的核心概念之一。\n16) 当一个类被继承时，它被该为“派生类”。\n17) 父类会自动继承子类的所有方法和字段。\n\n### 39.9\
