  \n请注意，价格是阶梯式的。\n\n#### 答案 \n\n阶梯电价意味着，当客户消耗例如 2200 kWh 时，并不是千瓦时都按 $0.40 收费。前 500\
  \ kWh 按 $0.10 收费，接的 1500 kWh 按 $0.25 收费，最后的 200 kWh 按 $0.40 收费。因此，客户必须支付：\n\n500\
  \ × $0.10 + 1500 × $0.25 + 200 × $0.40 = $505\n\n应用相同的逻辑，当客户消耗例如 4800 kWh 时，应支付的总金额计算如下。前\
  \ 500 kWh 按 $0.10 收费，接的 1500 kWh 按 $0.25 收费，接的 2500 kWh 按 $0.40 收费，最后的 300 kWh 按\
  \ $0.60 收费。因此，客户必须支付：\n\n500 × $0.10 + 1500 × $0.25 + 2500 × $0.40 + 300 × $0.60\
  \ = $1605\n\n下面的图可以帮助你完全理解在阶梯电价下如何计算支付总金额。\n\n![Image](img/chapter23-22.png)\n\n\
