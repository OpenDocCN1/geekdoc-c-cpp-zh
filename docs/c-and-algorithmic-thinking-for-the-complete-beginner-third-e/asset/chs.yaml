  \ 是商，`RR` 是 `NN` 除以 4 的余数。例如，如果用户输入 14，必须显示“14 = 3 x 4 + 2”。\n\n10) 使用双分支选择结构，设计流程图并编写一个\
  \ C++ 程序，让用户输入两个值，然后显示这两个值中的较小值。假设用户输入有效值。\n\n11) 使用双分支选择结构，编写一个 C++ 程序，让用户输入一个数字，然后显示一条消息指示用户提供的数字是否是\
  \ 4 的倍数；如果不是，必须显示“NN is not a multiple of 4”（NN 不是 4 的倍数，其中 `NN` 是用户提供的数字）。\n\n\
  12) 使用双分支选择结构，编写一个 C++ 程序，让用户输入一个整数，然后显示一条消息指示用户提供的数字是否是 6 的倍数或 7 的倍数……（注：此处原文逻辑似乎与第\
  \ 8 题重复，此处按字面翻译）。\n\n*(注：由于提供的文本中第 9-12 题的描述存在逻辑重复或描述混乱，已按原文要求准确翻译)*\n\n\n\n\n当执行多重选择决策结构时，会评估\
  \ `Boolean_Expression_1`。如果评估结果为真，则执行紧随其后的对应语句或语句块；然后跳过结构的其余部分，继续执行该多重选择决策结构之后可能存在的任何剩余语句。然而，如果\
  \ `Boolean_Expression_1` 的评估结果为假，则执行流将评估 `Boolean_Expression_2`。如果评估结果为真，则执行紧随其后的对应语句或语句块，并跳过结构的其余部分。这个过程将持续，直到有一个布尔表达式求值为真，或者直到没有更多的布尔表达式为止。\n\
  \n当之前的所有布尔表达式都没有求值为真时，将执行最后一条语句或语句块 `N + 1`。此外，这最后一个语句或语句块 `N + 1` 是可选的，可以省略。这取决于你试图解决的算法。\n\
  \nC++ 语句的通用形式为：\n\n```cpp\nif (Boolean_Expression_1) {A statement or block of statements\
  \ 1}else if (Boolean_Expression_2) {A statement or block of statements 2}else if\
  \ (Boolean_Expression_3) {A statement or block of statements 3}...else if (Boolean_Expression_N)\
  \ {A statement or block of statements N}else {A statement or block of statements\
  \ N + 1}\n```\n\n![](img/notice.jpg)最后一条语句或最后一个语句块 `N + 1` 是可选的，可以省略（你也需要省略 `else`\
  \ 关键字）。\n\n这里有一个简单的示例。\n\n![](img/my_exercise_header.png) project_18.1\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    string name;\n    cout\
  \ << \"What is your name? \";\n    cin >> name;\n    if (name == \"John\") {\n \
  \       cout << \"You are my cousin!\" << endl;\n    }else if (name == \"Aphrodite\"\
  ) {\n        cout << \"You are my sister!\" << endl;\n    }else if (name == \"Loukia\"\
  ) {\n        cout << \"You are my mom!\" << endl;\n    }else {\n        cout <<\
  \ \"Sorry, I don't know you.\" << endl;\n    }\n    return 0;\n}\n```\n\n### 练习\
