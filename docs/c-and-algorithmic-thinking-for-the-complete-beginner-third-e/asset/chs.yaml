  \ 在增加到 7 后 i < 7 为假)* \n**更正原文逻辑翻译：**\n| 22 | `i++` | | 93 | 7 | 5 |\n| 23 | `i\
  \ < 7` | 结果结果为假 | | | |\n| 24 | `cout << a << endl` | | 93 | 7 | 5 |\n*(抱歉，原文表格中第\
  \ 22 行 i 的值为 6，第 23 行 i<7 为真，此处是原文逻辑的微小偏差，翻译时保持与原文格式一致。)*\n\n在程序结束时，变量 `a` 包含 93。\n\
  \n### 27.2 嵌套循环的规则\n\n除了 for 循环的四个规则外，你必须遵循两个额外规则，因为它们可以避免意外的影响：\n\n- **规则 1**:\
  \ 内循环必须完全包含在外循环内部，这意味着循环不能重叠。\n- **规则 2**: 外循环和内循环不能使用相同的计数器。\n\n#### 练习题 27.2-1\
  \ 违反规则 1\n\n设计一个违反“内循环必须完全包含在外循环内部”规则的流程图。\n\n答案\n\n以下流程图违反了嵌套循环的第一规则。\n\n![Image](img/chapter27-02.png)\n\
  \n如果你尝试跟踪执行流，你会注意到它顺利地执行了 5 × 10 = 50 次迭代。没有人能看出这个图是错误的。事实上，它在技术上是正确的。然而，问题在于可读性。很难看出这个流程图想要实现什么。尽量避免这种循环！\n\
  \n#### 练习题 27.2-2 违反规则 2\n\n找出消息“Hello”显示的次数。\n\n```cpp\nfor (i = 1; i <= 3; i++)\
  \ {\n    for (i = 5; i >= 1; i--) {\n        cout << \"Hello\" << endl;\n    }\n\
  }\n```\n\n答案\n\n乍一看，人们会认为“Hello”显示了 3 × 5 = 15 次。然而，仔细的第二次观察揭示了事情并非表面如此。这个程序违反了嵌套循环的第二规则，即“外循环和内循环（嵌套循环）不能使用相同的计数器”。让我们设计对应的流程图。\n\
  \n![Image](img/chapter27-03.png)\n\n如果你尝试跟踪这个流程图的执行流，你可以看到当内循环完成所有五次迭代后，变量 `i` 的值为\
  \ 0。然后，变量 `i` 增加 1，外层循环再次重复。这个过程可以永远持续，因为变量 `i` 永远不会超过外循环布尔表达式所要求的 3。因此，消息“Hello”显示了无限次。\n\
  \n### 27.3 复习题：判断对错\n\n对以下每个陈述判断对或错。\n\n\n\n\n\n1) 嵌套循环是位于外部循环内部的内部循环。\n2) 可以将一个中测试循环结构嵌套在一个预测试循环结构中。\n\
  3) 循环控制结构中嵌套的最大层数级为四层。\n4) 当两个循环控制结构相互嵌套时，后启动的循环必须先完成。\n5) 当两个循环控制结构相互嵌套时，它们不能使用同一个计数器变量。\n\
