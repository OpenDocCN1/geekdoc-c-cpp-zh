  \ << \" second(s)\" << endl;\n    return 0;\n}\n```\n\n## 练习题 13.1-4 反转数字\n\n编写一个\
  \ C++ 程序，提示用户输入一个三位整数，然后构建并显示它的反转数字。例如，如果用户输入数字 875，程序必须显示 578。\n\n### 解决方案\n\n\
  为了分离用户提供的整数的三个数字，你可以使用第一种或第二种方法。之后，这个练习中唯一的困难在于构建反转数字。\n\n以数字 875 为例。分离后的三个数字将是：\n\
  \n`digit1 = 8`\n`digit2 = 7`\n`digit3 = 5`\n\n然后你可以通过简单地计算乘积之和来构建反转数字：\n\n`digit3\
  \ × 100 + digit2 × 10 + digit1 × 1 = 5 × 100 + 7 × 10 + 8 × 1 = 578`\n\n为了换一种方式，让我们使用第二种方法分离用户提供的数字。C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) # project_13.1-4\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int digit1, digit2, digit3,\
  \ number, r, reversedNumber;\n    cout << \"Enter a three-digit integer: \";\n \
  \   cin >> number;\n    digit3 = number % 10;      //这是最右边的数字\n    r = (int)(number\
  \ / 10);\n    digit2 = r % 10;           //这是中间的数字\n    digit1 = (int)(r / 10);\
  \    //这是最左边的数字\n    reversedNumber = digit3 * 100 + digit2 * 10 + digit1;\n   \
  \ cout << reversedNumber << endl;\n    return 0;\n}\n```\n\n## 13.2 复习练习题\n\n完成以下练习题。\n\
