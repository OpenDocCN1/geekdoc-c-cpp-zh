  \n### 34.6 数据结构的综合性练习\n\n#### 练习 34.6-1 哪些天有降雪？\n\n编写一个 C++ 程序，让用户输入 1 月份 31 天每天同一时间记录的温度（摄氏度）。然后，该\
  \ C++ 程序必须显示可能降雪的日期（1, 2, ..., 31），即温度低于 36 摄氏度（约 2 摄氏度）的天。\n\n#### 解答\n\n该练习的一维数组如下所示。\n\
  \n![Image](img/chapter34-44.png)\n\n以及 C++ 程序如下。\n\n![](img/my_exercise_header.png)\n\
  project_34.6-1\n```cpp\n#include <iostream>\nusing namespace std;\nconst int DAYS\
  \ = 31;\nint main() {\n    int i;\n    int t[DAYS];\n    for (i = 0; i <= DAYS -\
  \ 1; i++) {\n        cin >> t[i];\n    }\n    for (i = 0; i <= DAYS - 1; i++) {\n\
  \        if (t[i] < 36) {\n            cout << i + 1 << \"\\t\" << endl;\n     \
  \   }\n    }\n    return 0;\n}\n```\n\n#### 练习 34.6-2 是否有降雪？\n\n编写一个 C++ 程序，让用户输入\
  \ 1 月份 31 天每天同一时间记录的温度（摄氏度）。然后，该 C++ 程序必须显示一条消息，指示是否有降雪可能，即是否存在任何温度低于 36 摄氏度（约 2\
  \ 摄氏度）。\n\n#### 解答\n\n在本次练习中，你不能复制上一个练习中使用的方法。以下代码片段是错误的。\n\n```cpp\nfor (i = 0;\
  \ i <= DAYS - 1; i++) {if (t[i] < 36) {\n```\n\n\n\n\n\n```cpp\ncout << \"There\
  \ was a possibility of snow in January!\" << endl;\n```\n\n如果 1 月份有多一天的温度低于 36 华氏，那么相同的消息就会显示多次——显然你并不希望这样做！你实际上希望只显示一次消息，无论\
  \ 1 月份是有一天、二天还是更多天低于 36 华氏。\n\n实际上，这两种方法。让我们都学习一下这两种方法。\n\n### 第一种方法——统计所有低于 36\
  \ 华氏的温度\n\n在这种方法中，你可以使用程序中的变量来统计所有温度低于 36 华氏的天数。在检查完所有日期后，程序可以检查该变量的值。如果该值不为零，则意味着至少有一天可能下雪。\n\
  \n![](img/my_exercise_header.png) project_34.6-2a\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int DAYS = 31;\nint main() {\n    int i, count;\n  \
  \  int t[DAYS];\n    for (i = 0; i <= DAYS - 1; i++) {\n        cin >> t[i];\n \
  \   }\n    count = 0;\n    for (i = 0; i <= DAYS - 1; i++) {\n        if (t[i] <\
  \ 36) {\n            count++;\n        }\n    }\n    if (count != 0) {\n       \
  \ cout << \"There was a possibility of snow in January!\" << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n### 第二种方法——使用标志位（flag）\n\n在这种方法中，与其统计所有温度低于 36 华氏的天数，不如使用一个布尔变量（标志位）。解决方案如下所示。\n\
  \n![](img/my_exercise_header.png) project_34.6-2b\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int DAYS = 31;\nint main() {\n    int i;\n    bool found;\n\
  \    int t[DAYS];\n    for (i = 0; i <= DAYS - 1; i++) {\n        cin >> t[i];\n\
  \    }\n    found = false;\n    for (i = 0; i <= DAYS - 1; i++) {\n        if (t[i]\
  \ < 36) {\n            found = true;\n            break;\n        }\n    }\n   \
  \ if (found) {\n        cout << \"There was a possibility of snow in January!\"\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg) 将变量 `found` 想象成一个真实的旗。初始时，旗不是升起的（`found\
  \ = false`）。但是，在 for 循环中，当发现低于 36 华氏的温度时，旗升起（将值 `true` 赋值给变量 `found`），并且再也不会被放下。\n\
  \n![](img/notice.jpg) 注意 `break` 语句！一旦发现低于 36 华氏的温度，此后继续检查就没有意义了。\n\n![](img/notice.jpg)\
  \ 如果循环完成了所有迭代且没有发现低于 36 华氏的温度，变量 `found` 仍然将包含它的初始值（`false`），因为执行流从未进入过决策控制结构。\n\
  \n### 练习题 34.6-3 哪些城市可能下雪？\n\n编写一个 C++ 程序，提示用户输入十个城市的名称以及它们在 1 月 31 天内每天同一小时记录的温度（华氏度）。该\
