  \n## 第 29 章\n\n循环控制结构的技巧与窍门\n\n### 29.1 引言\n\n本章旨在向你介绍一些可以帮助编写“更好”代码的实用技巧和窍门。在设计自己的算法甚至编写自己的\
  \ C++ 程序时，你应该始终记住这些技巧。\n\n这些技巧可以帮助你提高代码的可读性，帮助你在每个特定问题中选择更合适的循环控制结构，并帮助代码变得更短甚至运行得更快。当然，没有单一的完美方法，因为在某些情况下使用某个特定技巧可能很有帮助，但在另一些情况下，同样的技巧可能会产生恰恰相反的结果。大多数情况下，代码优化取决于编程经验。\n\
  \n![](img/remember.jpg)较小的算法并不总是解决特定问题的最佳方案。为了解决某个特定问题，你可能会编写一个简洁的算法，遗憾的是它可能会消耗大量的\
  \ CPU 时间和/或大部分内存。\n\n### 29.2 选择循环结构\n\n下面的图可以帮助你根据迭代次数选择最合适的循环结构。\n\n![Image](img/chapter29-01.png)![](img/notice.jpg)此图推荐的是最佳选项，而非唯一选项。例如，当迭代次数已知时，使用先测试循环或后测试循环结构并不是错误的。不过，`for`\
  \ 循环更加方便。\n\n### 29.3 “终极”规则\n\n在使用先测试或后测试循环结构时，经常困扰程序员脑的一个问题是：如何确定哪些语句应该放在循环内部，哪些放在外部，以及按什么顺序排列。有一个简单而强大的规则——“终极”规则！一旦你遵循它，产生逻辑错误的可能性就会降为零！\n\
  \n“终极”规则规定：\n\n- 参与循环表达式的变量必须在进入循环之前进行初始化。\n- 参与循环表达式的变量的值必须在循环内更新（修改）。更具体地说，执行此更新/修改的语句必须是循环的最后几个语句之一。\n\
  \n例如，如果 `x` 是参与循环表达式的变量，先测试循环结构应如下所示：\n\n```\n初始化 x\nwhile (布尔表达式(x)) {\n    语句或语句块\n\
  \    更新/修改 x\n}\n```\n\n而后测试循环结构应如下所示：\n\n```\n初始化 x\ndo {\n    语句或语句块\n    更新/修改\
  \ x\n} while (布尔表达式(x));\n```\n\n其中\n\n- `初始化 x` 是任何给变量 `x` 分配初始值的语句。它可以是 `cin`\
  \ 等输入语句，也可以使用赋值运算符 `=` 的语句。但在后测试循环中，此语句有时是多余的，可以省略，因为 `x` 的初始化可以直接在循环内部完成。\n- `布尔表达式(x)`\
  \ 可以是从简单到复杂的任何布尔表达式，依赖于变量 `x`。\n- `更新/修改 x` 是任何改变 `x` 值的语句，例如另一个输入语句、使用赋值运算符 `=`\
  \ 的赋值语句，甚至是复合赋值运算符。重要的是，该语句必须放置在循环布尔表达式计算点之前。这意味着它应该是循环内部最后一个语句之一。\n\n以下是使用“终极”规则的一些示例。\n\
  \n示例 1\n\n```cpp\ncin >> a;\nwhile (a > 0) {\n    cout << a << endl;\n    a = a\
  \ - 1;\n}\n```\n\n示例 2\n\n```cpp\ncin >> a;\ncin >> b;\nwhile (a > b) {\n    cout\
  \ << a << \"  \" << b << endl;\n    cin >> a;\n    cin >> b;\n}\n```\n\n示例 3\n\n\
  ```cpp\ns = 0;\ndo {\n    cin >> y;\n    s = s + y;\n} while (s < 1000);\n```\n\n\
  示例 4\n\n```cpp\ny = 0;\ndo {\n    cin >> y;\n} while (y < 0);\n```\n\n\n\n\n\n在本例中，在循环外初始化变量\
  \ `y` 是多余的，可以省略，如下所示。\n\n```cpp\ndo {cin >> y;  //对 y 进行初始化和更新/修改} while (y < 0);\
  \  //依赖于 y 的布表达式\n```\n\n### 示例 5\n\n```cpp\nodd = 0;   //初始化 odd\neven = 0;  //初始化\
  \ even\nwhile (odd + even < 5) {  //依赖于 odd 和 even 的布尔表达式\ncin >> x;if (x % 2 ==\
  \ 0) {\n\n> even++;  //对 even 进行更新/修改\n\n}else {\n\n> odd++;   //对 odd 进行更新/修改\n\
  \n}}cout << \"Odds: \" << odd << \" Evens: \" << even << endl;\n```\n\n现在，你就会明白为什么你应该始终遵循“`Ultimate`\
  \ 规则”了！让我们来看下面的练习：\n\n编写一个代码段，让用户重复输入数字，直到总共输入三个正数为止。\n\n这个练习是给一个班级的，一个学生给出了以下代码段作为答案。\n\
  \n```cpp\nint positivesCount;double x;positivesCount = 0;cin >> x;while (positivesCount\
  \ != 3) {if (x > 0) {\n\n> positivesCount += 1;\n\n}cin >> x;}cout << \"Three Positives\
  \ provided!\" << endl;\n```\n\n乍看之下，它是正确的。它让用户输入一个数字，进入循环，检查用户提供的数字是否为正数，然后让用户输入第二个数字，以此此类推。然而，这段代码包含一个逻辑错误——不幸的是，这是一个非常棘手的错误。你能发现它吗？\n\
  \n通过尝试不同的输入值（正数、负数甚至零）来跟踪执行流。当用户输入一个正数时，变量 `positivesCount` 增加 1；当他们输入负数或零时，它保持不变。一切看起来都运行得很顺畅，不是吗？——运行得如此顺畅可能会让你怀疑这本书是否可靠，或者你是否应该把它扔掉！\n\
  \n只有当用户尝试输入三个预期的正数值时，问题才会变得显而易见。下面的追踪表可以帮助你确定问题所在。假设用户想要输入值 5、−10、−2、4 和 20。\n\n\
  | Steps | 语句 | Notes | positivesCount | x |\n| --- | --- | --- | --- | --- |\n|\
  \ 1 | `positivesCount = 0` | | 0 | ? |\n| 2 | `cin >> x` | | 0 | 5.0 |\n| 3 | `while\
  \ (positivesCount != 3)` | 结果为真 | | |\n| 4 | `if (x > 0)` | 结果为真 | | |\n| 5 | `positivesCount\
  \ += 1` | | 1 | 5.0 |\n| 6 | `cin >> x` | | 1 | −10.0 |\n| 7 | `while (positivesCount\
  \ != 3)` | 结果为真 | | |\n| 8 | `if (x > 0)` | 结果为假 | | |\n| 9 | `cin >> x` | | 1 |\
  \ −2.0 |\n| 10 | `while (positivesCount != 3)` | 结果为真 | | |\n| 11 | `if (x > 0)`\
  \ | 结果为假 | | | |\n| 12 | `cin >> x` | | 1 | 4.0 |\n| 13 | `while (positivesCount\
  \ != 3)` | 结果为真 | | | |\n| 14 | `if (x > 0)` | 结果为真 | | | |\n| 15 | `positivesCount\
  \ += 1` | | 2 | 4.0 |\n| 16 | `cin >> x` | | 2 | 20.0 |\n| 17 | `while (positivesCount\
  \ != 3)` | 结果为真 | | | |\n| 18 | `if (x > 0)` | 结果为真 | | | |\n| 19 | `positivesCount\
  \ += 1` | | 3 | 20.0 |\n| 20 | `cin >> x` | | 3 | ??? |\n\n逻辑错误在这里！在第 20 步，尽管用户提供的正数总数已经是三个，且你期望执行结束，但不幸的是，用户仍然被要求输入额外的数字！但是，你需要的是一个让用户输入三个正数的代码段，而不是四个，对吧？\n\
  \n这就是为什么你应该始终按规则办事！让我们看看这段代码段应该怎么写。\n\n由于 `while` 循环的布尔表达式依赖于变量 `positivesCount`，因此该变量必须在循环外初始化。该变量也必须在循环内部更新/修改。执行此更新/修改的语句必须是循环内的最后一个语句，如下面的代码段（通用形式）所示。\n\
  \n```cpp\npositivesCount = 0;            //初始化 positivesCount\nwhile (positivesCount\
  \ != 3) {  //此依赖于 positivesCount\n一条语句或语句块\nif (x > 0) {\n\n> positivesCount +=\
  \ 1;       //对 positivesCount 进行更新/修改\n\n}}\n```\n\n现在，你可以添加任何必要的语句来完成代码。你在这里只需要添加的语句是让用户输入数字的语句（这必须在循环内完成）以及显示最后消息的语句（这必须在循环完成所有迭代后完成）。因此，最终的代码段变为：\n\
  \n```cpp\nint positivesCount;double x;positivesCount = 0;while (positivesCount !=\
  \ 3) {cin >> x;if (x > 0) {\n\n> positivesCount += 1;\n\n}}cout << \"Three Positives\
  \ provided!\" << endl;\n```\n\n### 29.4 跳出循环\n\n循环可能会消耗过多的 CPU 时间，因此在使用它们时必须非常小心。有时，你需要在循环完成所有迭代之前跳出或结束循环，通常是在满足特定条件时。\n\
  \n假设有一个隐藏密码，你设法知道它是三个字符，且只包含数字。下面的 `for` 循环执行 900 次迭代，试图通过暴力破解攻击找到那个隐藏密码。\n\n```cpp\n\
  found = false;for (i = 100; i <= 999; i++) {if (i == hiddenPassword) {\n\n> password\
  \ = i;\n\n> found = true;\n\n}}if (found) {cout << \"Hidden password is: \" << password\
  \ << endl;}\n```\n\n![](img/notice.jpg)暴力破解攻击是获取任何受密码保护内容的最简单方法。攻击者尝试字母、数字和符号的组合，希望最终能猜中。\n\
  \n现在，假设隐藏密码是 123。正如你所知的，`for` 循环按指定的次数迭代，在这种情况下，不幸的是，它会一直持续到变量 `i` 达到 999。\n\n有人可能会认为\
  \ 800 – 900 次迭代没什么什么，他们可能是对的。然而，在大规模数据处理中，每次迭代都关重要。因此，在使用循环控制结构时要非常小心，特别是那些迭代多次的结构。如果隐藏密码是十位数的呢？这意味着\
  \ `for` 循环必须执行 9,000,000,000 次迭代！\n\n有两种方法可以帮助你的像之前那样的程序更快。这两种方法的核心思想都是在满足特定条件时跳出循环；在这种情况下，当找到隐藏密码时。\n\
  \n#### 第一种方法——使用 `break` 语句\n\n你可以使用 `break` 语句在循环实际完成所有迭代之前跳出循环。\n\n看下面的 C++ 程序。当找到隐藏密码时，执行流会立即退出（跳出）`for`\
  \ 循环。\n\n```cpp\nfound = false;for (i = 100; i <= 999; i++) {if (i == hiddenPassword)\
  \ {\n\n> password = i;\n\n> found = true;\n\n> break;\n\n}}if (found) {cout << \"\
  Hidden password is: \" << password << endl;}\n```\n\n语句 `if (found)` 等同于语句 `if (found\
  \ == true)`。\n\n#### 第二种方法——使用标志位（flag）\n\n`break` 语句并不是在所有的计算机语言中都存在；由于这本书的目的是教你“算法思维”（而不仅仅是\
  \ C++ 支持的特殊语句），让我们来看另一种方法。\n\n在下面的 C++ 程序中，当找到隐藏密码时，布尔表达式 `found == false` 会强制执行流退出循环。\n\
  \n```cpp\nfound = false;i = 100;while (found == false && i <= 999) {if (i == hiddenPassword)\
  \ {\n\n> password = i;\n\n> found = true;\n\n}i++;}if (found) {cout << \"Hidden\
  \ password is: \" << password << endl;}\n```\n\n\n\n\n\n![](img/notice.jpg)将变量 `found`\
  \ 视为一个标记。初始时，该标记未被“触发”（`found = false`）。执行流进入循环，只要标记保持置位状态，循环就会继续迭代（`while found\
  \ == false …`）。当循环内部发生触发标记的事件时（将变量 `found` 赋值为 `true`），执行流就会退出循环。\n\n![](img/notice.jpg)`while\
  \ (found == false && i <= 999)` 也可以写成 `while (!found && i <= 999)`。\n\n![](img/notice.jpg)在未找到隐藏密码的情况下，`i\
  \ <= 999` 这个布尔表达式仍然是必要的。\n\n### 29.5 清理你的循环\n\n如前所述，循环会消耗大量的 CPU 时间，因此你必须非常小心并节制地使用它们。虽然大量的迭代有时是不可避免的，但你总有办法可以让你的循环运行得更好。\n\
  \n下面的代码段计算数字 1, 2, 3, 4, 5, … 10000 的和。\n\n```\ns = 0;i = 1;do {countOfNumbers =\
  \ 10000;s = s + i;i++;} while (i <= countOfNumbers);cout << s << endl;\n```\n\n\
  在使用循环（尤其是执行多次迭代的循环）时，你应该始终避免在循环内部放置任何对该循环没有作用的语句。在上例中，`countOfNumbers = 10000` 就是这样一条语句。遗憾的是，只要它存在于循环内部，计算机就会无缘地执行\
  \ 10000 次，这自然会影响计算机性能。\n\n为了解决这个问题，你可以简单地将此语句移动循环循环外部如下：\n\n```\ncountOfNumbers\
  \ = 10000;s = 0;i = 1;do {s = s + i;i++;} while (i <= countOfNumbers);cout << s\
  \ << endl;\n```\n\n#### 练习 29.5-1 清理循环\n\n下面的代码段计算数字 1, 2, 3, 4, … 10000 的平均值。尝试将尽可能多的语句移到循环外部，以提高程序的效率。\n\
  \n```\ns = 0;for (i = 1; i <= 10000; i++) {s = s + i;average = s / 10000;}cout <<\
  \ average << endl;\n```\n\n解答\n\n初级程序员在计算平均值时犯的一个非常常见的错误，是将将总和除以数字个数的语句（此处为 `average\
  \ = s / 10000`）放在循环内部。想一下！假设你想计算自己在学校的平均分。你的第一步是计算你所修的 10 门课程成绩的总和。然后，当所有成绩相加后，你将总和除以\
  \ 10。这意味着你执行了 10 次加法只执行了一次除法。\n\n![](img/notice.jpg)计算平均值是一个两步骤。\n\n因此，在循环内部计算平均值是没有意义的。你可以将此语句移到循环外部，紧跟循环之后，让循环只负责数字：\n\
  \n```\ns = 0;for (i = 1; i <= 10000; i++) {s = s + i;}average = s / 10000;cout <<\
  \ average << endl;\n```\n\n#### 练习 29.5-2 清理循环\n\n下一个公式\n\n.![Image](img/chapter29-02.png)\n\
  \n使用以下代码段求解，其中 `N` 由用户提供。\n\n```\nint n, i, j, denom;double s;cout << \"Enter N:\
  \ \";cin >> n;s = 0;for (i = 1; i <= n; i++) {denom = 0;for (j = 1; j <= n; j++)\
  \ {\n\n> denom += pow(j, j);\n\n}s += i / (double)denom;}cout << s << endl;\n```\n\
  \n尝试将尽可能多的语句移到循环外部，以使代码更高效。\n\n解答\n\n从公式可以看出，分母对于所有分数都是通的。因此，为每个分数反复计算它是没有意义的。你可以只计算一次分母并多次使用该结果，如下：\n\
  \n```\nint n, i, j, denom;double s;cout << \"Enter N: \";cin >> n;denom = 0;for\
  \ (j = 1; j <= n; j++) {denom += pow(j, j);}s = 0;for (i = 1; i <= n; i++) {s +=\
  \ i / (double)denom;}cout << s << endl;\n```\n\n### 29.6 死循环以及如何停止它们\n\n所有的 `while`\
  \ 循环都必须在循环内部包含最终引导执行流退出循环的内容。但错误仍然会发生！例如，下面的代码段包含一个死循环。遗憾的是，程序员忘记在循环内部增加变量 `i`；因此，变量\
  \ `i` 永远无法达到值 10。\n\n```\ni = 1;while (i != 10) {cout << \"Hello there!\" << endl;}\n\
  ```\n\n![](img/notice.jpg)如果循环无法停止迭代，它被称为死循环或无限循环。\n\n程序员可能犯的另一个错误如下：\n\n```\ni\
  \ = 1;while (i != 10) {cout << \"Hello there!\" << endl;i += 2;}\n```\n\n尽管这段代码段内部确实包含一个增加变量\
  \ `i` 的语句（`i += 2`），但遗憾的是，执行流从未退出循环，因为值 10 从未被赋值给变量 `i`。\n\n死循环会永远迭代下去，停止其迭代的唯一方法是使用强制力量！例如，当\
  \ Windows 操作系统中的应用程序“卡死”（可能是因为执行流进入了死循环）时，用户必须使用组合键 `ALT+CTRL+DEL` 来强制结束应用程序。\n\n\
  在 Visual Studio Community 或 Visual Studio Code 中，当你意外编写并执行死循环时，可以简单地点击相应的“停止调试”\
  \ ![Image](img/vs_stop_button.png)或“停止” ![Image](img/vs_code_stop_button.png)工具图标，执行就会停止。\n\
  \n![](img/notice.jpg)在 Visual Studio Code 中，强制结束应用程序的另一种方法是使用组合键 `CTRL+C`。\n\n###\
  \ 29.7 “由内而外”方法\n\n“由内而外”是本书提出的一个方法，帮助你从内部学习“算法思维”。这种方法首先处理内部（嵌套）控制结构，然后随着算法（或程序）的发展，添加更多的控制结构。这种方法可以用于复杂的控制结构，甚至是\
  \ C++ 程序。本书在任何需要的地方都使用这种方法。\n\n让我们尝试下面的例子。\n\n编写一个 C++ 程序，显示如下所示的乘法表。\n\n![Image](img/chapter29-03.png)\n\
  \n根据“由内而外”方法，你首先编写内部控制结构，当一切测试并运行良好后，你可以添加外部控制结构。\n\n所以，让我们尝试只显示乘法表的第一行。如果你检查这一行，会发现每次乘法中，乘数始终是\
