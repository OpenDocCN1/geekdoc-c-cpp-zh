  你刚刚看到的程序的流程图如下。当执行流到达 `for`-循环时，初始值 `1` 被赋值给变量 `i`，布尔表达式 `i ≤ 5` 结果为 `true`，执行语句\
  \ `Write i` 并在屏幕上显示值 `1`。变量 `i` 加 1，执行流回到菱形符号正上方的点。布尔表达式再次求值为 `true`，显示值 `2`，重复该过程。在第\
  \ `5^(th)` 次迭代中，显示值 `5`，变量 `i` 的值变为 `6`，布尔表达式求值为 `false`，执行流退出循环。\n\n![Image](img/chapter26-02.png)\n\
  \n当变量 `counter` 增加（或减少）`1` 时，使用复合赋值运算符甚至递增（或递减）运算符会更方便。接接的示例使用递增运算符 `++` 显示从 `1`\
  \ 到 `10` 的数字。\n\n![](img/my_exercise_header.png) project_26.1b\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i;\n    for (i = 1; i\
