  \n# 第一部分：介绍性知识\n\n## 第 1 章：计算机是如何工作的\n\n### 1.1 引言\n\n在当今社会，几乎每项任务都需要使用计算机。在学校里，学生使用计算机上网和发送电子邮件。在工作中，人们使用它们制作演示文稿、分析数据以及与客户交流。在家里，人们使用计算机玩游戏、连接社交网络并与世界各地的人聊天。当然，不要忘记像\
  \ iPhone 这样的智能手机。它们也是计算机！\n\n计算机之所以能执行许多不同的任务，是因为它们是可以编程的。换句话说，计算机可以执行程序告诉它的任何工作。程序是一组语句（通常称为指令或命令），计算机遵循这些语句来执行特定任务。\n\
  \n程序对计算机是至关重要的，因为没有程序，计算机就是一台什么都做不了的笨机器。实际上是程序告诉计算机做什么以及什么时候做什么。另一方面，程序员或软件开发者是设计、创建并经常测试计算机程序的人。\n\
  \n本书将通过 `C++` 语言为你介绍计算机编程的基础概念。\n\n### 1.2 什么是硬件？\n\n硬件术是指组成计算机的所有设备或组件。如果你打开过计算机或笔记本电脑的外壳，你可能见过它的许多组件，例如微处理器\
  \ (`CPU`)）、内存和硬盘。计算机不是一个设备，而是一个共同工作的设备系统。这里讨论了典型计算机系统的基本组件。\n\n- 中央处理单元 (`CPU`)\n\
  \n这是计算机实际执行程序中定义的所有任务的部分（基本算术、逻辑和输入输出操作）。\n\n- 主内存 (`RAM` – 随机存存储器）\n\n这是计算机存放程序（在运行时）以及程序正在处理的数据的区域。当你关闭计算机或拔掉电源插头时，存储在此类内存中的所有程序和数据都会丢失。\n\
  \n- 主内存 (`ROM` – 只读存储器）\n\n\n\n\nROM 或只读存储器是一种特殊的内存，计算机只能对其进行读取（但不能更改）。存储在此类内存中的所有程序和数据在计算机关闭时都不会丢失。ROM\
  \ 通常包含制造商的指令，以及一个名为 `bootstrap loader`（引导加载器）的程序，其功能是在电源开启后启动计算机系统的运行。\n\n## 二级存储设备\n\
  \n这通常是指硬盘或 `SSD`（固态硬盘），有时（但较少见）是指 `CD/DVD 驱动器`。与主内存（`RAM`）相比，这类内存可以存储较长时间的数据，即使计算机没有供电也是如此。然而，存储在该内存中的程序无法直接执行。它们必须被传输到速度得多的内存中，即主内存。\n\
  \n## 输入设备\n\n输入设备是指所有从外部收集数据并将其输入计算机进一步处理的设备。键盘、鼠标和麦克风都是输入设备。\n\n## 输出设备\n\n输出设备是指所有将数据输出到外部世界的设备。显示器（屏幕）和打印机都是输出设备。\n\
  \n### 1.3 什么是软件？\n\n计算机执行的一切都由软件控制。软件分为两类：系统软件和应用软件。\n\n- **系统软件**是控制和管理计算机基本操作的程序。例如，系统软件控制计算机的内部操作。它管理所有连接到它的设备，保存数据、加载数据并允许其他程序的执行。系统软件的三大类型是：\n\
  \    - **操作系统**。`Windows`、`Linux`、`macOS`、`Android` 和 `iOS` 都是操作系统的示例。\n    - **实用软件**。这类软件通常与操作系统一起安装。它用于使计算机尽可能高效地运行。防病毒实用程序和备份工具被视为实用软件。\n\
  \    - **设备驱动程序**。设备驱动程序控制连接到你计算机的设备，例如鼠标或显卡。设备驱动程序是一个像翻译官的程序。它将操作系统的指令翻译成设备可以实际理解的指令。\n\
  - **应用软件**指的是你用于日常任务的所有其他程序，例如浏览器、文字处理器、记事本、游戏等许多程序。\n\n### 1.4 计算机如何执行（运行）程序\n\n\
  当你打开计算机时，主内存（`RAM`）是完全空的。计算机需要做的第一工作是将操作系统从硬盘传输到主内存。\n\n在操作系统加载到主内存后，你就可以执行（运行）任何喜欢的程序（应用软件）。这通常通过点击、双击或轻点程序对应的图标来实现。例如，假设你点击了你最喜欢的文字处理器的图标。此动作指令你的计算机将文字处理程序从硬盘复制（或加载）到主内存（`RAM`），以便\
  \ `CPU` 可以执行它。\n\n![](img/remember.jpg)程序存储在硬盘等二级存储设备上。当你在计算机上安装一个程序时，该程序会被复制到硬盘中。然后，当你执行一个程序时，该程序从硬盘复制（加载）到主内存（`RAM`），并执行该程序的副本。\n\
  \n![](img/notice.jpg)“运行”（run）和“执行”（execute）这两个词是同义词，可以互换。\n\n### 1.5 编译器和解释器\n\n\
  计算机可以执行用严格定义的计算机语言编写的程序。你不能使用英语或希腊语等自然语言编写程序，因为你的计算机无法理解！\n\n但计算机实际上理解什么呢？计算机可以理解一种特定的低级语言，被称为`机器语言`。在机器语言中，所有的语句（或命令）都由\
  \ 0 和 1 组成。下面是一个用机器语言编写的程序示例，用于计算两个数字之和。\n\n```\n0010 0001 0000 01000001 0001 0000\
  \ 01010011 0001 0000 01100111 0000 0000 0001\n```\n\n震惊了吗？别担心，你不会用这种方式写程序的。希望现在不再有人这样写计算机程序了。如今，所有的程序员都用高级语言编写程序，然后他们使用特殊程序将它们翻译成机器语言。\n\
  \n![](img/notice.jpg)高级语言是不局限于特定类型计算机的语言。\n\n程序员用于执行翻译的程序有两种：编译器和解释器。\n\n- **编译器**是一个将用高级语言编写的语句翻译成独立的机器语言程序的程序。你可以在你希望任何时候执行该机器语言程序。翻译完成后，除非你对高级语言程序更改了修改，否则不需要再次运行编译器。\n\
  - **解释器**是一个同时翻译并执行用高级语言编写的语句的程序。当解释器读取高级语言程序中的每一个单独语句时，它将其翻译成机器语言代码并直接执行。这个过程对程序中的每个语句都会重复进行。\n\
  \n### 1.6 什么是源代码？\n\n程序员用高级语言编写的语句（通常称为指令或命令）被称为源代码或简单的代码。程序员首先在名为 `code editor`（代码编辑器）的程序中输入`源代码`，然后使用编译器将其翻译成机器语言程序，或使用解释器同时翻译并执行它。\n\
  \n![](img/notice.jpg)虽然现在看起来可能不寻常，但使用简单的文本编辑器编写程序是可能的！\n\n### 1.7 复习题：判断对错\n\n对以下每项选择对或错。\n\
  \n1) 现代计算机之所以能执行这么多任务是因为它们具有被编程的能力。\n2) 计算机可以在没有程序的情况下。\n3) 硬盘是硬件的示例。\n4) 数据可以在主内存（`RAM`）中存储很长时间，即使计算机没有供电。\n\
  5) 数据存储在主内存（`RAM`）中，但程序不是。\n6) 声器是输出设备的示例。\n7) `Windows` 和 `Linux` 是软件的示例。\n8) 设备驱动程序是硬件的示例。\n\
  9) 媒体播放器是系统软件的示例。\n10) 当你打开计算机时，主内存（`RAM`）已经操作系统。\n11) 当你打开文字处理应用时，它实际上是从二级存储设备复制到主内存（`RAM`）的。\n\
  12) 在机器语言中，所有的语句（命令）都是 0 和 1 的序列。\n13) 如今，计算机无法理解 0 和 1。\n14) 如今，软件是用由 1 和 0 组成的语言编写的。\n\
  15) 软件指的是计算机的物理组成部分。\n16) 编译器和解释器是软件。\n17) 编译器将源代码翻译成可执行文件。\n18) 解释器创建一个机器语言程序。\n\
  19) 考虑到程序可能会被执行多次，在通过解释翻译并执行一次后，对解释器的需求就消失了。\n20) 源代码可以使用简单的文本编辑器编写。\n21) 源代码可以在计算机上不经过编译或解释执行。\n\
  22) 用机器语言编写的程序需要编译（翻译）。\n23) 编译器翻译用高级语言编写的程序。\n\n### 1.8 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\
  \n\n\n\n\n1) 以下哪一项不是计算机硬件？\na) 硬盘\nb) DVD 光盘\nc) 声卡\nd) 主内存 (RAM)\n\n2) 以下哪一项不是次级存储设备？\n\
  a) DVD 读写设备\nb) 固态硬盘 (SSD)\nc) USB 闪存 U 盘\nd) RAM\n\n3) 以下哪种操作是 CPU 能执行的？\na) 将数据传输到主内存\
  \ (RAM)。\nb) 从主内存 (RAM)传输数据。\nc) 执行算术运算。\nd) 手术操作。\n\n4) 触摸屏是\na) 输入设备。\nb) 输出设备。\n\
  c) 以上两者都是。\n\n5) 以下哪一项不是软件？\na) Windows\nb) Linux\nc) iOS\nd) 视频游戏\ne) 网页浏览器\nf)\
  \ 以上所有都是软件。\n\n6) 以下哪个陈述是正确的？\na) 程序存储在硬盘上。\nb) 程序存储在 USB 闪存盘（USB 优盘）上。\nc) 程序存储在主内存（RAM）中。\n\
  d) 以上全部都是正确的。\n\n7) 以下哪个陈述是正确的？\na) 程序直接从硬盘上执行。\nb) 程序直接从 DVD 光盘上执行。\nc) 程序直接从主内存（RAM）中执行。\n\
  d) 以上全部都是正确的。\ne) 以上都不正确。\n\n8) 程序员无法用以下语言编写计算机程序：\na) 机器语言。\nb) 英语、希腊语等自然语言。\n\
  c) C++。\n\n9) 编译器会将\na) 用机器语言编写的程序翻译成高级语言程序。\nb) 用自然语言（英语、希腊语等）编写的程序翻译成机器语言程序。\n\
  c) 用高级计算机语言编写的程序翻译成机器语言程序。\nd) 以上都不是。\ne) 以上都是都是。\n\n10) 机器语言是\na) 机器之间相互通信使用的语言。\n\
  b) 一种由数字指令组成、计算机直接使用的语言。\nc) 使用英语单词进行操作的语言。\n\n11) 在用高级计算机语言编写的程序中，如果两个相同的语句连续出现，解释器会\n\
  a) 翻译并执行第一个，然后翻译并执行第二个。\nb) 先翻译第一个，再翻译第二个，最后都执行它们。\nc) 只翻译第一个（因为它们是相同的），然后执行两次。\n\
  \n## 第 2 章\n\n## C++ 与集成开发环境 \n\n### 2.1 什么是 C++？\n\nC++ 是一种广泛使用的通用型高级计算机编程语言，它允许程序员创建桌面应用或移动端应用程序、大规模应用、嵌入式系统、操作系统内核、驱动程序、客户端/服务器应用程序以及许多其他类型的软件。C++\
  \ 是其前身 C 语言语言的扩展。C++ 与 C 之间的主要区别在于 C++ 包含了现代编程技术，例如面向对象编程 (OOP)。此外，在 C++ 中，你可以用“C\
  \ 风格”或“面向对象风格”编写代码——甚至可以两者兼用！\n\n### 2.2 脚本和程序有什么区别？\n\n从技术上说，脚本是被解释执行的，而程序是被编译的，但这实际上并不是它们的主要区别。它们之间还有另一个更重要的区别！\n\
  \n使用 `JavaScript` 或 `VBA`（应用程序 Visual Basic）等脚本语言编写脚本的主要目的是控制另一个应用程序。因此，你可以说，在某些方面\
  \ `JavaScript` 控制网页浏览器，而 `VBA` 控制着 Microsoft® Office 应用程序（如 `MS Word` 或 `MS Excel`）。\n\
  \n另一方面，用 `C++`、`C#` 或 `Java`（仅举几个）等编程语言编写的程序独立于任何其他应用程序执行。在用户需要的任何时候，程序都可以作为独立程序执行，不需要宿主应用程序。\n\
  \n![notice.jpg] Microsoft Office 的宏是用 `VBA` 编写的脚本。它们的目的是自动化 Microsoft Office 中的某些功能。\n\
  \n![notice.jpg] 很多人认为 `JavaScript` 是 `Java` 的简化版，但实际上名称的相似性仅仅是巧合。\n\n![remember.jpg]\
  \ 脚本不能作为独立程序运行。它需要宿主应用程序才能执行。\n\n### 2.3 为什么你应该学习 C++\n\nC++ 是所谓的“高级”计算机语言。C++ 的编码风格与\
  \ C 语言相似。它非常易理解，并且在 `Windows`、`Linux` 和 `Unix` 等多个平台上高效高效。C++ 是一种灵活且强大的语言，非常适合开发大规模应用、嵌入式系统、操作系统内核、驱动程序、客户端/服务器应用程序、艺术应用、音乐播放器甚至视频游戏。\n\
  \nC++ 无处不在！它存在桌面电脑、笔记本电脑、移动设备上，甚至存在价值数百万的数据中心里。凭借全球庞大的开发者社区，C++ 能够高效开发许多令人兴奋的应用程序和服务。C++\
  \ 程序员的大量可用是机构选择 C++ 进行新开发而非任何其他编程语言的主要原因。这也是你实际上应该学习 C++ 的非常好的理由！\n\n### 2.4 C++\
  \ 是如何工作的\n\n计算机不理解英语或希腊语等自然语言，因此你需要一种如 `C++` 的计算机语言与它们通信。C++ 是一种非常强大的高级计算机语言。C++\
  \ 编译器将 C++ 语言转换为计算机可以理解的语言，这被称为“机器语言”。\n\n几乎每种类型的操作系统都有 C++ 编译器。因此你可以编译源代码并创建执行文件，例如针对\
  \ `Windows`、`Linux` 或 `macOS`。\n\n### 2.5 Boost C++ 库\n\nBoost 是一个 C++ 语言的库集合，为事件处理、字符串处理、内存处理、异步输入输出\
  \ (I/O) 等任务提供支持。它包含了 140 多个库，帮助你在无需等待 C++ 标准修订的情况下提高生产力。在这本书中，练习和示例使用了一小部分 Boost\
  \ 库。\n\n如果你需要更多信息，可以访问：\n\n[`tinyurl.com/mr2fkv`](https://tinyurl.com/mr2fkv)\n\n\
