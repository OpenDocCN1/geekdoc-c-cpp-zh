  \  }\n    return 0;\n}\n```\n\n### 31.8 什么是 Map（映射）？\n\n在计算机科学中，map 和数组之间的主要区别是\
  \ map 元素可以使用键（key）唯一标识，而不一定是整数值。map 的每个键都与一个元素关联（如果你愿意的话，也可以称为映射到一个元素）。map 的键可以是\
  \ `string`、`int`、`double` 等类型。\n\n接下来的示例展示了一个包含家庭成员的 map。该 map 的名称为 `family`，对应的键写在每个元素上方。\n\
  \n![Image](img/chapter31-10.png)\n\n![](img/notice.jpg)map 元素的键在 map 内部必须是唯一的。这意味着在\
  \ map `family` 中，例如你不能有两个名为 `father` 的键。\n\n![](img/notice.jpg)map 元素的值可以是任何类型。\n\
  \n### 31.9 在 C++ 中创建无序 map（Unordered Maps）\n\n让我们尝试使用最常用的方法来创建以下无序 map。\n\n![Image](img/chapter31-11.png)\n\
  \n##### 第一种方法\n\n要创建一个无序 map 并直接为其元素赋值，可以使用下面通用形式给出的下一个 C++ 语句：\n\n```cpp\nunordered_map<key_type,\
  \ value_type> map_name = {{ key0, value0 },{ key1, value1 },{ key2, value3 },\n\
  // …\n// …\n{ keyM, valueM }};\n```\n\n其中：\n\n- `key_type` 是键的类型。可以是 `string`、`int`、`double`\
  \ 等。\n- `value_type` 是元素的类型。可以是 `string`、`int`、`double` 等。\n- `map_name` 是无序 map\
  \ 的名称。\n- `key0`, `key1`, `key2`, …, , `keyM` 是 map 元素的键。\n- `value0`, `value1`,\
  \ `value2`, …, , `valueM` 是 map 元素的值。\n\n使用这种方法，可以使用以下语句创建无序 map `pupil`：\n\n```cpp\n\
  unordered_map<string, string> pupil = {{\"firstName\", \"Ann\"},{\"lastName\", \"\
  Fox\"},{\"age\", \"8\"},{\"class\", \"2nd\"}};\n```\n\n![](img/notice.jpg)每个键通过逗号\
  \ ( , ) 与其值隔开，元素被包含在大括号 `{ }` 内并用逗号隔开，所有内容被包含在大括号 `{ }` 内。\n\n![](img/notice.jpg)在\
  \ 第 5.4 节 中你学习了变量命名时必须遵循的规则。为无序 map 命名遵循相同的规则！\n\n![](img/notice.jpg)结构 `unordered_map`\
  \ 定义在库 `unordered_map` 中。它在 C++ 中无法直接访问，因此你需要包含库 `unordered_map`。\n\n##### 第二方法\n\
  \n在这种方法中，你可以使用下面通用形式给出的语句创建一个完全空的无序 map：\n\n```cpp\nunordered_map<key_type, value_type>\
  \ map_name;\n```\n\n然后按照下面通用形式给出的 C++ 语句添加一个元素（键-值对）：\n\n```cpp\nmap_name[key] =\
  \ value;\n```\n\n使用这种方法，可以使用以下代码段创建无序 map `pupil`：\n\n```cpp\nunordered_map<string,\
  \ string> pupil;\npupil[\"firstName\"] = \"Ann\";\npupil[\"lastName\"] = \"Fox\"\
  ;\npupil[\"age\"] = \"8\";\npupil[\"class\"] = \"2nd\";\n```\n\n### 31.10 如何从无序\
  \ map 中获取值\n\n要获取特定 map 元素的值，必须使用其对应的键指向该元素。下面的代码段创建了一个无序 map，然后在屏幕上显示“Ares is the\
  \ God of War”（不带引号）。\n\n```cpp\nunordered_map<string, string> olympians;\nolympians[\"\
  Zeus\"] = \"King of the Gods\";\nolympians[\"Hera\"] = \"Goddess of Marriage\";\n\
  olympians[\"Ares\"] = \"God of War\";\nolympians[\"Poseidon\"] = \"God of the Sea\"\
  ;\nolympians[\"Demeter\"] = \"Goddess of the Harvest\";\nolympians[\"Artemis\"]\
  \ = \"Goddess of the Hunt\";\nolympians[\"Apollo\"] = \"God of Music and Medicine\"\
  ;\nolympians[\"Aphrodite\"] = \"Goddess of Love and Beauty\";\nolympians[\"Hermes\"\
  ] = \"Messenger of the Gods\";\nolympians[\"Athena\"] = \"Goddess of Wisdom\";\n\
  olympians[\"Hephaistos\"] = \"God of Fire and the Forge\";\nolympians[\"Dionysus\"\
  ] = \"God of the Wine\";\ncout << \"Ares is the \" << olympians[\"Ares\"] << endl;\n\
  ```\n\n![](img/notice.jpg)只有键可以用于访问元素。这意味着 `olympians[\"Ares\"]` 正确返回“God of War”，但\
  \ `olympians[\"God of War\"]` 无法返回“Ares”。\n\n#### 练习 31.10-1 罗马数字转数字\n\n罗马数字如下表所示。\n\
  \n| 数字 | 罗马数字 |\n| --- | --- |\n| 1 | I |\n| 2 | II |\n| 3 | III |\n| 4 | IV |\n\
  | 5 | V |\n\n编写一个 C++ 程序，提示用户输入 I 到 V 之间的罗马数字，然后显示对应的数字。假设用户输入有效值。\n\n##### 解决方案\n\
  \n显而易见的解决方案是使用多分支决策结构，类似于后面代码段所示：\n\n```cpp\nif (romanNumeral == \"I\")number =\
  \ 1;\nelse if (romanNumeral == \"II\")number = 2;\nelse if (romanNumeral == \"III\"\
  )number = 3;\nelse if (romanNumeral == \"IV\")number = 4;\nelse if (romanNumeral\
  \ == \"V\")number = 5;\n```\n\n然而，这种方法非常冗长，如果你想扩展程序以处理额外的罗马数字，它可能会变得更加复杂。因此，凭借对无序\
  \ map 的知识，你可以采用更高效的方法，如后面代码段所示：\n\n```cpp\nunordered_map<string, int> roman2number\
  \ = {{\"I\", 1}, {\"II\", 2}, {\"III\", 3}, {\"IV\", 4}, {\"V\", 5}};\nnumber =\
  \ roman2number[romanNumeral];\n```\n\n该练习的解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_31.10-1\n```cpp\n#include <iostream>\n#include <unordered_map>\nusing\
  \ namespace std;\nint main() {\n    string romanNumeral;\n    int number;\n    unordered_map<string,\
  \ int> roman2number = {\n        {\"I\", 1}, {\"II\", 2}, {\"III\", 3}, {\"IV\"\
  , 4}, {\"V\", 5}\n    };\n    cout << \"Enter a Roman numeral: \";\n    cin >> romanNumeral;\n\
  \    number = roman2number[romanNumeral];\n    cout << romanNumeral << \": \" <<\
  \ number << endl;\n    return 0;\n}\n```\n\n#### 练习 31.10-2 在无序 map 中使用不存在的键\n\n\
  下面的 C++ 程序有什么错误？\n\n```cpp\nunordered_map<string, string> family = {{\"father\"\
  , \"John\"},{\"mother\", \"Maria\"},{\"son\", \"George\"}};\ncout << family[\"daughter\"\
  ] << endl;\n```\n\n##### 解决方案\n\n类似于数组，代码不满足确定性（definiteness）。你不能引用不存在的字典元素。由于没有键\
  \ `daughter`，最后的语句会抛出运行时错误。\n\n### 31.11 如何修改 map 元素的值\n\n要修改现有 map 元素的值，你需要使用相应的键并为该元素分配新值。后面的示例展示了这一点。\n\
  \n```cpp\nunordered_map<string, string> tribes = {{\"Indian\", \"Navajo\"},{\"African\"\
  , \"Zulu\"}};\ncout << tribes[\"Indian\"] << endl;   //显示 Navajo\ncout << tribes[\"\
  African\"] << endl; //显示 Zulu\ntribes[\"Indian\"] = \"Apache\";        //修改现有元素的值\n\
  cout << tribes[\"Indian\"] << endl;   //显示 Apache\ncout << tribes[\"African\"] <<\
  \ endl;  //显示 Zulu\n```\n\n#### 练习 31.11-1 给不存在的键赋值\n\n下面的代码段是否有任何错误？\n\n```cpp\n\
  unordered_map<int, string> tribes = {{0, \"Navajo\"},{1, \"Cherokee\"},{2, \"Sioux\"\
  }};\ntribes[3] = \"Apache\";\n```\n\n##### 解决方案\n\n不，这次这段代码段完全没有错误。乍一看，你可能认为最后一条语句尝试修改不存在的键的值并抛出错误。但对于\
  \ C++ 的无序 map 并非如此。由于 `tribes` 是一个无序 map 且键 `3` 不存在，最后的语句向无序 map 中添加了一个全新的第四个元素！\n\
  \n\n\n\n![](img/remember.jpg)无序 map（unordered map）的键可以是 `string`、`int`、`double`\
  \ 等类型。\n\n但记住，如果 `tribes` 实际上是一个数组，那么最后一条语句将抛出错误。看以下代码片段：\n\n```cpp\nstring tribes[]\
  \ = {\"Navajo\", \"Cherokee\", \"Sioux\"};\ntribes[3] = \"Apache\";\n```\n\n在这个示例中，由于\
  \ `tribes` 是数组且索引 `3` 不存在，最后一条语句试图修改不存在的元素的值，显然会抛出错误！\n\n### 31.12 如何遍历 map\n\n\
  要遍历 map 的元素，可以使用 `for` 循环。以下是通用形式编写的代码片段：\n\n```cpp\nfor (const auto& element :\
  \ map_name) {\n    process element.first;\n    process element.second;\n    process\
  \ map_name[element.first];\n}\n```\n\n其中：\n\n- ► `process` 是任何 C++ 语句或语句块，用于在每次迭代中处理无序\
  \ map `map_name` 的一个元素。\n- ► `element.first` 是元素的键（key）。\n- ► `element.second` 是元素的值（value）。\n\
  \n以下 C++ 程序显示字母 A、B、C、D 以及它们对应的摩尔斯密码。\n\n```cpp\nunordered_map<string, string> morseCode\
  \ = {{\"A\", \".-\"},{\"B\", \"-...\"},{\"C\", \"-.-.\"},{\"D\", \"-..\"}};\nfor\
  \ (const auto& element : morseCode) {\n    cout << element.first << \"  \" << element.second\
  \ << endl;\n}\n// 或者你可以这样做：\nfor (const auto& element : morseCode) {\n    cout <<\
  \ element.first << \"  \" << morseCode[element.first] << endl;\n}\n```\n\n下一个示例为计算机软件软件的每位员工发放了\
  \ $2000 的奖金！\n\n```cpp\nunordered_map<string, double> salaries = {{\"Project Manager\"\
  , 83000.0},{\"Software Engineer\", 81000.0},{\"Network Engineer\", 64000.0},{\"\
  Systems Administrator\", 61000.0},{\"Software Developer\", 70000.0}};\nfor (const\
  \ auto& x : salaries) {\n    salaries[x.first] = salaries[x.first] + 2000;\n}\n\
  ```\n\n### 31.13 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\n1) 数组是用于存储多个值的结构体。\n2) 数组元素位于主内存（RAM）中。\n\
