  \ `max_element()` 在每次循环迭代时都会被调用——也就是说了 200 次！\n\n### 练习 34.3-5 寻找二维数组的最小值\n\n编写一个\
  \ C++ 程序，让用户输入 10 个不同城市在 1 月每天同一时刻记录的温度（华氏度）。该 C++ 程序必须显示出最低温度。\n\n#### 解决方案\n\n\
  在这个练习中，你需要使用以下数组。\n\n![Image](img/chapter34-06.png)\n\n![](img/notice.jpg)数组 `t`\
  \ 有 31 列（0 到 30），与 1 月份的天数相同。\n\n这里没有新新意。变量 `minimum` 的初始值可以是元素 `t[0][0]` 的值。然后，程序可以遍历行甚至遍历列来寻找最小值。解决方案如下：\n\
  \n![](img/my_exercise_header.png) 练习 34.3-5\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int CITIES = 10;\nconst int DAYS = 31;\nint main() {\n \
  \   int i, j, minimum;\n    // 读取数组\n    int t[CITIES][DAYS];\n    for (i = 0; i\
  \ <= CITIES - 1; i++) {\n        for (j = 0; j <= DAYS - 1; j++) {\n           \
  \ cin >> t[i][j];\n        }\n    }\n    // 寻找最小值\n    minimum = t[0][0];\n    for\
  \ (i = 0; i <= CITIES - 1; i++) {\n        for (j = 0; j <= DAYS - 1; j++) {\n \
  \           if (t[i][j] < minimum) {\n                minimum = t[i][j];\n     \
  \       }\n        }\n    }\n    cout << minimum << endl;\n    return 0;\n}\n```\n\
  ![](img/notice.jpg)在这个练习中你不能这样做，因为如果你这样做了且变量 `j` 从 1 开始，那么索引为 0 的整列将不会被检查！\n\n```cpp\n\
  // 寻找最小值\nminimum = t[0][0];\nfor (i = 0; i <= CITIES - 1; i++) {\n    for (j =\
  \ 1; j <= DAYS - 1; j++) {  // 错误！变量 j 必须从 0 开始\n        if (t[i][j] < minimum)\
  \ {\n            minimum = t[i][j];\n        }\n    }\n}\n```\n\n### 练习 34.3-6 寻找最冷日的城市\n\
  \n编写一个 C++ 程序，让用户输入 10 个城市的名称，以及这些城市在 1 月份每天同一时刻记录的温度（华氏度）。该 C++ 程序必须显示温度最低的城市名称以及记录该温度的日期。\n\
  \n#### 解决方案\n\n在这个练习中，需要以下两个数组。\n\n![Image](img/chapter34-07.png)\n\n解决方案很简单。每当变量\
  \ `minimum` 更新其值时，两个变量 `m_i` 和 `m_j` 就可以分别存储变量 `i` 和 `j` 的当前值。最后，这两个变量将包含最小值所在位置的行索引和列索引。解决方案如下：\n\
  \n![](img/my_exercise_header.png) 练习 34.3-6\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int CITIES = 10;\nconst int DAYS = 31;\nint main() {\n \
  \   int i, j, minimum, m_i, m_j;\n    string names[CITIES];\n    int t[CITIES][DAYS];\n\
  \    for (i = 0; i <= CITIES - 1; i++) {\n        cin >> names[i];\n        for\
  \ (j = 0; j <= DAYS - 1; j++) {\n            cin >> t[i][j];\n        }\n    }\n\
  \    minimum = t[0][0];\n    m_i = 0;\n    m_j = 0;\n    for (i = 0; i <= CITIES\
  \ - 1; i++) {\n        for (j = 0; j <= DAYS - 1; j++) {\n            if (t[i][j]\
  \ < minimum) {\n                minimum = t[i][j];\n                m_i = i;\n \
  \               m_j = j;\n            }\n        }\n    }\n    cout << \"Minimum\
  \ temperature: \" << minimum << endl;\n    cout << \"City: \" << names[m_i] << endl;\n\
  \    cout << \"Day: \" << m_j + 1 << endl;\n    return 0;\n}\n```\n![](img/notice.jpg)给变量\
  \ `m_i` 和 `m_j` 分配初始值 0 是必要的，因为最小值始终有可能就是元素 `t[0][0]` 的值。\n\n### 练习 34.3-7 寻找每一行的最小值和最大值\n\
  \n编写一个 C++ 程序，让用户向 $20 \\times 30$ 个元素的数组 `b` 中输入值，然后找到并显示每一行的最小值和最大值。\n\n#### 解决方案\n\
  \n实际上有两种方法。第一种方法创建两个辅助的一维数组 `minimum` 和 `maximum`，然后显示它们。`minimum` 和 `maximum` 数组将在每个位置分别包含每行的最小值和最大值。另一方面，第二种方法是直接查找并显示每一行的最小值和最大值。让我们学习这两种方法。\n\
  \n#### 第一种方法——创建辅助数组\n\n为了更好地理解这种方法，让我们使用“从内层到外”的方法。当以下代码片段完成迭代时，辅助的一维数组 `minimum`\
  \ 和 `maximum` 将在位置 0 分别包含数组 `b` 第一行（行索引 0）的最小值和最大值。假设变量 `i` 包含值 0。\n\n```cpp\nminimum[i]\
  \ = b[i][0];\nmaximum[i] = b[i][0];\nfor (j = 1; j <= COLUMNS - 1; j++) {\n    if\
  \ (b[i][j] < minimum[i]) {\n        minimum[i] = b[i][j];\n    }\n    if (b[i][j]\
  \ > maximum[i]) {\n        maximum[i] = b[i][j];\n    }\n}\n```\n![](img/notice.jpg)注意变量\
  \ `j` 从 1 开始。从列索引 0 而不是 1 开始迭代并没有错误，尽管程序会执行一次无用的迭代。\n\n现在一切都弄清楚了，为了处理整个数组 `b`，你只需要将之前的代码片段嵌套到一个遍历所有行的\
  \ for 循环中，如下所示：\n\n```cpp\nfor (i = 0; i <= ROWS - 1; i++) {\n    minimum[i] = b[i][0];\n\
  \    maximum[i] = b[i][0];\n    for (j = 1; j <= COLUMNS - 1; j++) {\n        if\
  \ (b[i][j] < minimum[i]) {\n            minimum[i] = b[i][j];\n        }\n     \
  \   if (b[i][j] > maximum[i]) {\n            maximum[i] = b[i][j];\n        }\n\
  \    }\n}\n```\n最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png) 练习 34.3-7\n```cpp\n\
  #include <iostream>\nusing namespace std;\nconst int ROWS = 30;\nconst int COLUMNS\
  \ = 20;\nint main() {\n    int i, j;\n    double b[ROWS][COLUMNS];\n    for (i =\
  \ 0; i <= ROWS - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n     \
  \       cin >> b[i][j];\n        }\n    }\n    double minimum[ROWS];\n    double\
  \ maximum[ROWS];\n    for (i = 0; i <= ROWS - 1; i++) {\n        minimum[i] = b[i][0];\n\
  \        maximum[i] = b[i][0];\n        for (j = 1; j <= COLUMNS - 1; j++) {\n \
  \           if (b[i][j] < minimum[i]) {\n                minimum[i] = b[i][j];\n\
  \            }\n            if (b[i][j] > maximum[i]) {\n                maximum[i]\
  \ = b[i][j];\n            }\n        }\n        cout << minimum[i] << \"  \" <<\
  \ maximum[i] << endl;\n    }\n    return 0;\n}\n```\n\n#### 第二种方法——直接查找最小值和最大值\n\
  \n再次使用“从内层到外”的方法。以下代码片段查找并直接显示数组 `b` 第一行（行索引 0）的最小值和最大值。假设变量 `i` 包含值 0。\n\n```cpp\n\
  minimum = b[i][0];\nmaximum = b[i][0];\nfor (j = 1; j <= COLUMNS - 1; j++) {\n \
  \   if (b[i][j] < minimum) {\n        minimum = b[i][j];\n    }\n    if (b[i][j]\
  \ > maximum) {\n        maximum = b[i][j];\n    }\n}\n```\n为了处理整个数组 `b`，你只需要将上述代码片段嵌套到一个遍历所有行的\
  \ for 循环中，如下：\n\n```cpp\nfor (i = 0; i <= ROWS - 1; i++) {\n    double minimum,\
  \ maximum;\n    minimum = b[i][0];\n    maximum = b[i][0];\n    for (j = 1; j <=\
  \ COLUMNS - 1; j++) {\n        if (b[i][j] < minimum) {\n            minimum = b[i][j];\n\
  \        }\n        if (b[i][j] > maximum) {\n            maximum = b[i][j];\n \
  \       }\n    }\n    cout << minimum << \"  \" << maximum << endl;\n}\n```\n最终的\
  \ C++ 程序如下。\n\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ROWS\
  \ = 30;\nconst int COLUMNS = 20;\nint main() {\n    int i, j;\n    double b[ROWS][COLUMNS];\n\
  \    for (i = 0; i <= ROWS - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++)\
  \ {\n            cin >> b[i][j];\n        }\n    }\n    for (i = 0; i <= ROWS -\
  \ 1; i++) {\n        double minimum, maximum;\n        minimum = b[i][0];\n    \
  \    maximum = b[i][0];\n        for (j = 1; j <= COLUMNS - 1; j++) {\n        \
  \    if (b[i][j] < minimum) {\n                minimum = b[i][j];\n            }\n\
  \            if (b[i][j] > maximum) {\n                maximum = b[i][j];\n    \
  \        }\n        }\n        cout << minimum << \"  \" << maximum << endl;\n \
  \   }\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\nminimum = b[i][j];\n}\nif (b[i][j]\
  \ > maximum) {\n    maximum = b[i][j];\n}\n}\ncout << minimum << \"  \" << maximum\
  \ << endl;\n}\nreturn 0;\n```\n\n### 34.4 数组排序\n\n排序算法是计算机科学中的一个重要课题。排序算法是一种按照特定顺序排列数组元素的算法。有很多种排序算法，每种算法都有特定的优缺点。\n\
  \n大多数排序算法通过比较数组中的元素来工作。它们通常根据效率和内存需求来评估。\n\n有许多排序算法，其中包括：\n\n- 冒泡排序算法\n- 改进的冒泡排序算法\n\
  - 选择排序算法\n- 插入排序算法\n- 堆排序算法\n- 归排序算法\n- 快速排序算法\n\n就效率而言，冒泡排序被认为效率最低，而列表中随后的每个算法性能都优于前一个。快速排序算法被认为是最好、最快的排序算法之一，特别是对于大规模数据操作。\n\
  \n排序算法不仅可以用于按升序或降序显示数据，还可以帮助从一组给值中找到最小值和最大值。例如，在一个升序排列的数组中，最小值位于第一个索引位置，最大值位于最后一个索引位置。虽然仅为了寻找最值而对数组排序是非常无效的，但如果程序由于其他原因对数组进行了排序，而你随后需要最小值或最大值，你就知道在哪里可以找到它们了！\n\
  \n你可能需要排序算法的另一个场景是，你想找到并显示数组中最大的三个（或最小的三个）数字。在这种情况下，你可以按降序排列数组，然后只显示位于索引位置 0、1 和\
  \ 2 的前三个元素。\n\n正如你所知道的，C++ 包含了用于数组排序的 `sort()` 函数。然而，在某些情况下有必要实现自定义排序算法，特别是当你需要在排序数组的同时保持其与第二个数组元素的一一对应关系时。\n\
  \n## 练习 34.4-1 冒泡排序算法 – 对带有数值的一维数组排序\n\n编写一个 C++ 程序，允许用户输入 20 个数值到数组中，然后使用冒泡排序算法将它们按升序排序。\n\
  \n### 解决方案\n\n冒泡排序可能是效率最低的排序算法之一，但它在教学中被广泛使用。其核心思想（当要求按升序排序数组时）是反复地将数组中最小的元素移动到索引最低的位置。工作原理如下：算法遍历数组元素，比较每对相邻元素，然后交换它们的内容（如果顺序错误）。这个过程会重复多次，直到数组排序完毕。\n\
  \n例如，让我们尝试按升序对以下数组排序。\n\n![Image](img/chapter34-08.png)\n\n最低的值是 5。根据冒泡排序算法，这个值必须逐渐“冒泡”或“上升”到位置\
  \ 0，就像可乐杯中的气泡上升一样。当值 5 被移动到位置 0 后，下一个较小的值是 8。现在，值 8 必须“冒”到位置 1。接下来是值 12，它必须“冒”到位置\
  \ 2，依此类推。这个过程一直持续直到所有元素都放在正确的位置。\n\n但如何使用算法完成这种“冒泡”过程呢？让我们详细查看整个过程。对于之前包含六个元素的数组\
  \ A，必须执行五轮。\n\n### 第一轮\n\n**第 1 次比较**\n最初比较索引位置 4 和 5 处的元素。由于值 12 小于值 49，这两个元素交换内容。\n\
  \n**第 2 次比较**\n比较索引位置 3 和 4 处的元素。由于值 12 不小于值 5，因此不进行任何交换。\n\n**第 3 次比较**\n比较索引位置\
  \ 2 和 3 处的元素。由于值 5 小于值 8，这两个元素交换内容。\n\n**第 4 次比较**\n比较索引位置 1 和 2 处的元素。由于值 5 小于值\
  \ 25，这两个元素交换内容。\n\n**第 5 次比较**\n比较索引位置 0 和 1 处的元素。由于值 5 小于值 17，这两个元素交换内容。\n\n![Image](img/chapter34-09.png)\n\
  \n第一轮已经完成，但正如你所看到的，数组还没有排序。唯一能保证放在正确位置的值是 5。然而，由于后续还会有几轮，因此不需要值 5 参与随后的比较。在接下来的一轮中，即四次比较。\n\
  \n**第 1 次比较**\n比较索引位置 4 和 5 处的元素。由于值 49 不小于值 12，因此不进行任何交换。\n\n**第 2 次比较**\n比较索引位置\
  \ 3 和 4 处的元素。由于值 12 不小于值 8，因此不进行任何交换。\n\n**第 3 次比较**\n比较索引位置 2 和 3 处的元素。由于值 8 小于值\
  \ 25，这两个元素交换内容。\n\n**第 4 次比较**\n比较索引位置 1 和 2 处的元素。由于值 8 小于值 17，这两个元素交换内容。\n\n![Image](img/chapter34-10.png)\n\
  \n第二轮已经完成，值 8 保证被放在正确的位置。然而，由于后续还会有几轮，因此不需要值 8（当然还有值 5）参与随后的比较。在接下来的一轮中，即三次比较。\n\
  \n**第 1 次比较**\n比较索引位置 4 和 5 处的元素。由于值 49 不小于值 12，因此不进行任何交换。\n\n**第 2 次比较**\n比较索引位置\
  \ 3 和 4 处的元素。由于值 12 不小于值 12，因此不进行任何交换。\n\n**第 3 次比较**\n比较索引位置 2 和 3 处的元素。由于值 12\
  \ 小于值 25，这两个元素交换内容。\n\n![Image](img/chapter34-11.png)\n\n第三轮已经完成，值 12 保证被放在正确的位置。正如之前提到的，由于后续还会有几轮，因此不需要值\
  \ 12（当然还有 8 和 5）参与随后的比较。在接下来的一轮中，即两次比较。\n\n**第 1 次比较**\n比较索引位置 4 和 5 处的元素。由于值 49\
  \ 不小于值 25，因此不进行任何交换。\n\n**第 2 次比较**\n比较索引位置 3 和 4 处的元素。由于值 25 不小于值 17，因此不进行任何交换。\n\
  \n![Image](img/chapter34-12.png)\n\n第四轮已经完成，值 17 保证被放在正确的位置。正如之前提到的，由于将还有最后一轮，因此不需要值\
  \ 17（当然还有 12, 8 和 5）参与随后的比较。在最后的一轮中，即一次比较。\n\n**第五轮**\n在最后这一轮中，只执行了一次比较。由于值 49 不小于值\
  \ 25，因此不进行任何交换。\n\n![Image](img/chapter34-13.png)\n\n第五轮已经完成，最后两个值（25 和 49）现在保证处于正确的位置。冒泡排序算法结束，数组已按升序排序！\n\
  \n现在你需要一个 C++ 程序来完成之前的整个过程。让我们使用“从内层到外”的方法。下面显示仅执行第一轮的代码片段。请注意这是内层（嵌套）循环控制结构。假设变量\
  \ `m` 包含值 1。\n\n```cpp\nfor (n = ELEMENTS - 1; n >= m; n--) {\n    if (a[n] < a[n\
  \ - 1]) {\n        temp = a[n];\n        a[n] = a[n - 1];\n        a[n - 1] = temp;\n\
  \    }\n}\n```\n\n![](img/notice.jpg)在第一轮中，变量 `m` 必须包含值 1。这确保了在最后迭代时，比较的元素是索引位置\
  \ 1 和 0 处的元素。\n\n\n\n\n\n![](img/remember.jpg)交换两个元素的内容使用了你已经学会的方法！请回想那两杯橙汁和柠檬汁。如果这没能让你产生任何记忆，你需要复习一下记忆并重新阅读\
  \ 练习 8.1-3。\n\n如果只需要重新执行之前的代码段，就可以进行第二轮操作。然而，变量 `m` 需要包含值 `2`。这将确保索引位置为 `0` 的元素不会被再次比较。同样，对于第三轮操作，可以重新执行之前的代码段，但由于相同的原因，变量\
  \ `m` 需要包含值 `3`。\n\n因此，之前的代码段需要执行五次（每轮一次），并且每次变量 `m` 必须递加 `1`。使用冒泡排序算法排序数组 `a` 的最终代码段如下。\n\
  \n```cpp\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n    for (n = ELEMENTS - 1; n >=\
  \ m; n--) {\n        if (a[n] < a[n - 1]) {\n            temp = a[n];\n        \
  \    a[n] = a[n - 1];\n            a[n - 1] = temp;\n        }\n    }\n}\n```\n\n\
  ![](img/remember.jpg)对于 `N` 个元素，算法需要执行 `N - 1` 轮。例如，如果数组 `a` 包含 `20` 个元素，则语句 `(m\
  \ = 1; m <= ELEMENTS - 1; m++)` 将执行 `19` 轮。\n\n完整的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.4-1\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS\
  \ = 20;\nint main() {\n    int i, m, n;\n    double temp;\n    double a[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> a[i];\n    }\n    for\
  \ (m = 1; m <= ELEMENTS - 1; m++) {\n        for (n = ELEMENTS - 1; n >= m; n--)\
  \ {\n            if (a[n] < a[n - 1]) {\n                temp = a[n];\n        \
  \        a[n] = a[n - 1];\n                a[n - 1] = temp;\n            }\n   \
  \     }\n    }\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cout << a[i]\
  \ << \"\\t\";\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)冒泡排序算法非常低效。它执行的比较总数为\
  \ ![Image](img/chapter34-14.png)，其中 `N` 是数组元素的总数。\n\n![](img/notice.jpg)交换的总数取决于给定的数组。最坏的情况是你对一个已经按降序排序的数组进行升序排序，反之亦然。\n\
  \n### 练习 34.4-2 包含字母数字值的一维数组\n\n编写一个代码段，使用冒泡排序算法对数组的字母数字值进行降序排序。\n\n#### Solution\n\
  \n将此练习的描述与上一个练习相比，有两个不同。首先，冒泡排序算法需要对字母数字值进行排序，例如姓名或城市名称；其次，它必须以降序进行排序。\n\n为了排序字母数字数据，不需要更改算法中的任何内容！C++\
  \ 处理字母的方式处理数字相同。字母 `A` 被认为小于 `B`，`B` 被认为小于 `C`，以此此类推。当然，如果数组包含第一个字母相同的单词，C++ 会继续比较它们的第二个字母，可能还会比较第三个字母（如果有必要的话）。例如，名字\
  \ `Johathan` 被认为小于名字 `Jone`，因为第四个字母 `a` 小于第四个字母 `e`。\n\n![](img/notice.jpg)结合字典中单词组织的方式来考虑字母数字排序。\n\
  \n现在，让我们看看需要什么才能使算法按降序而不是升序排序。你还记得冒泡排序实际上是如何工作的吗？元素逐渐“冒泡”到索引最低的位置，就像气泡在可乐中上升一样。在这个练习中，你想要让较大的（而不是较小的）元素“冒泡”到较低索引的位置。因此，你只需要反转判断结构中的比较运算符即可！\n\
  \n按降序排序字母数字值的代码段如下。\n\n```cpp\nstring tempStr;\nfor (m = 1; m <= ELEMENTS - 1; m++)\
  \ {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n] > a[n - 1]) {\n\
  \            tempStr = a[n];\n            a[n] = a[n - 1];\n            a[n - 1]\
  \ = tempStr;\n        }\n    }\n}\n```\n\n### 练习 34.4-3 在保持与第二个数组关系的同时对一维数组排序\n\n\
  编写一个 C++ 程序，让用户输入 20 个湖泊的名称及其平均面积。程序随后必须使用冒泡排序算法按平均面积升序对其进行排序。\n\n#### Solution\n\
  \n在这个练习中，你需要以下两个数组。\n\n![Image](img/chapter34-15.png)\n\n如果你想在排序面积数组的同时保持两个数组元素之间的一一对应关系，你必须也重新排列名称数组的元素。这意味着当面积数组的两个元素交换内容时，名称数组中对应的元素也必须交换内容。C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_34.4-3\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int LAKES = 20;\nint main() {\n    int i, m, n;\n  \
  \  double temp;\n    string tempStr;\n    string names[LAKES];\n    double areas[LAKES];\n\
  \    for (i = 0; i <= LAKES - 1; i++) {\n        cin >> names[i];\n        cin >>\
  \ areas[i];\n    }\n    for (m = 1; m <= LAKES - 1; m++) {\n        for (n = LAKES\
  \ - 1; n >= m; n--) {\n            if (areas[n] < areas[n - 1]) {\n            \
  \    temp = areas[n];\n                areas[n] = areas[n - 1];\n              \
  \  areas[n - 1] = temp;\n                tempStr = names[n];\n                names[n]\
  \ = names[n - 1];\n                names[n - 1] = tempStr;\n            }\n    \
  \    }\n    }\n    for (i = 0; i <= LAKES - 1; i++) {\n        cout << names[i]\
  \ << \"\\t\" << areas[i] << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意，你不能使用变量\
  \ `temp` 来交换名称数组的内容；这是因为变量 `temp` 声明为 `double`，而数组包含 `string`。因此，你需要另一个声明为 `string`\
  \ 的变量 `tempStr`。\n\n### 练习 34.4-4 排序姓和名\n\n编写一个 C++ 程序，提示用户输入 100 个人的姓和名。程序随后必须按姓的字母顺序显示这些姓名。在两个或多人共享相同姓氏的情况下，他们的名字也应该按字母顺序显示。\n\
  \n#### Solution\n\n你已经知道如何在保持与第二个数组元素一一对应关系的情况下排序数组。现在，你必须处理第一个数组中两个姓相同的情况。根据练习的描述，第二个数组中对应的名字也必须按字母顺序排序。例如，下面的数组\
  \ `lastNm` 包含了 100 个人的姓。它是按字母顺序排序的，并且包含了三次 `Parker` 姓。数组 `firstNm` 中对应的名字 `Andrew`、`Anna`\
  \ 和 `Chloe` 也必须按字母顺序排序，如下所示。\n\n![Image](img/chapter34-16.png)\n\n为了方便起见，这里再次提供了冒泡排序的基本版本。请注意，该算法保持了\
  \ `lastNm` 和 `firstNm` 数组元素之间的一一对应关系。\n\n```cpp\nfor (m = 1; m <= PEOPLE - 1; m++)\
  \ {\n    for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n] < lastNm[n -\
  \ 1]) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n - 1];\n\
  \            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n     \
  \       firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n  \
  \      }\n    }\n}\n```\n\n\n\n\n然而，为了解决这个练习，必须对泡泡排序算法进行相应的调整。根据这个基础版本的泡排序算法，当位置\
  \ `n` 处的最后一个姓氏“小于”位置 `n - 1` 处的最后一个姓氏时，算法会交换对应的内容。但如果这些位置上的姓氏相同，则算法必须验证对应的名字是否处于正确顺序。如果不是，则需要在数组\
  \ `firstNm` 中进行交换。改进后的泡泡排序算法如代码片段所示。\n\n```cpp\nfor (m = 1; m <= PEOPLE - 1; m++)\
  \ {\n    for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n] < lastNm[n -\
  \ 1]) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n - 1];\n\
  \            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n     \
  \       firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n  \
  \      }\n        else if (lastNm[n] == lastNm[n - 1]) { //If the last names are\
  \ equal\n            if (firstNm[n] < firstNm[n - 1]) { //check the corresponding\
  \ first names\n                tempStr = firstNm[n]; //and swap if not in correct\
  \ order\n                firstNm[n] = firstNm[n - 1];\n                firstNm[n\
  \ - 1] = tempStr;\n            }\n        }\n    }\n}\n```\n\n接下来是最终 C++ 程序。\n\n\
  ![](img/my_exercise_header.png) project_34.4-4\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int PEOPLE = 100;\nint main() {\n    int i, m, n;\n\
  \    string tempStr;\n    //Read arrays firstNm and lastNm\n    string firstNm[PEOPLE];\n\
  \    string lastNm[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1; i++) {\n        cout\
  \ << \"First name for person No. \" << i + 1 << \": \";\n        cin >> firstNm[i];\n\
  \        cout << \"Last name for person No. \" << i + 1 << \": \";\n        cin\
  \ >> lastNm[i];\n    }\n    //Sort arrays lastNm and firstNm\n    for (m = 1; m\
  \ <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >= m; n--) {\n         \
  \   if (lastNm[n] < lastNm[n - 1]) {\n                tempStr = lastNm[n];\n   \
  \             lastNm[n] = lastNm[n - 1];\n                lastNm[n - 1] = tempStr;\n\
  \                tempStr = firstNm[n];\n                firstNm[n] = firstNm[n -\
  \ 1];\n                firstNm[n - 1] = tempStr;\n            }\n            else\
  \ if (lastNm[n] == lastNm[n - 1]) {\n                if (firstNm[n] < firstNm[n\
  \ - 1]) {\n                    tempStr = firstNm[n];\n                    firstNm[n]\
  \ = firstNm[n - 1];\n                    firstNm[n - 1] = tempStr;\n           \
  \     }\n            }\n        }\n    }\n    //Display arrays lastNm and firstNm\n\
  \    for (i = 0; i <= PEOPLE - 1; i++) {\n        cout << lastNm[i] << \"\\t\" <<\
  \ firstNm[i] << endl;\n    }\n    return 0;\n}\n```\n\n#### 练习 34.4-5 排序二维数组\n\n\
  编写一个代码片段，按升序对二维数组的每一列进行排序。\n\n##### 解决方案\n\n二维数组的一个示例如下。\n\n![Image](img/chapter34-17.png)\n\
  \n由于该数组有七列，泡泡排序算法需要执行七次，每列执行一次。因此，整个泡泡排序算法应该嵌套在一个循环七次的 `for` 循环中。\n\n但让我们按照正确的顺序来。使用“从内层到外层”的方法，下一个代码片段对二维数组\
  \ `a` 的第一列（列索引 0）进行排序。假设变量 `j` 的值为 0。\n\n```cpp\nfor (m = 1; m <= ROWS - 1; m++)\
  \ {\n    for (n = ROWS - 1; n >= m; n--) {\n        if (a[n][j] < a[n - 1][j]) {\n\
  \            temp = a[n][j];\n            a[n][j] = a[n - 1][j];\n            a[n\
  \ - 1][j] = temp;\n        }\n    }\n}\n```\n\n现在，为了对所有列进行排序，你可以此代码片段嵌套在一个遍历所有列的\
  \ `for` 循环中，如下：\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    for (m = 1;\
  \ m <= ROWS - 1; m++) {\n        for (n = ROWS - 1; n >= m; n--) {\n           \
  \ if (a[n][j] < a[n - 1][j]) {\n                temp = a[n][j];\n              \
  \  a[n][j] = a[n - 1][j];\n                a[n - 1][j] = temp;\n            }\n\
  \        }\n    }\n}\n```\n\n这并不难，对吧？\n\n#### 练习 34.4-6 改进的泡泡排序算法 – 排序一维数组\n\n编写一个\
  \ C++ 程序，让用户输入 20 个人的体重，然后显示三个最重三个最轻的体重。使用改进的泡泡排序算法。\n\n##### 解决方案\n\n为了解决这个练习，C++\
  \ 程序可以对用户提供的数据进行升序排序，然后显示索引位置 17、18 和 19 的元素（三个最重量的体重）以及索引位置 0、1 和 2 的元素（三个最轻的体重）。但那个改进版本的泡泡排序算法是什么，它实际上是如何工作的？假设你有如下包含六个人个人体重的数组。\n\
  \n![Image](img/chapter34-18.png)\n\n如果你观察得仔细一点，你可以自己确认只有不在正确位置的元素是 ![Image](img/chapter34-19.png)，对于\
  \ 1000 个元素，泡泡排序执行 499500 次！为了实现这一点，程序可以使用一个标志位来指示是否发生了交换。在每一轮开始时，将标志位赋值为 `false`；当发生交换时，将其赋值为\
  \ `true`。这就是为什么 `swaps = false` 语句必须放在两个 `for` 语句之间。\n\n```cpp\nfor (m = 1; m <=\
  \ ELEMENTS - 1; m++) //给变量赋值为 false\n    swaps = false;//执行新的一轮\n    for (n = ELEMENTS\
  \ - 1; n >= m; n--) {\n        if (w[n] < w[n - 1]) {\n            temp = w[n];\n\
  \            w[n] = w[n - 1];\n            w[n - 1] = temp;\n            swaps =\
  \ true;\n        }\n    }\n    //如果 swaps 仍为 false，则数组已排序。停止迭代\n    if (!swaps)\
  \ break;\n```\n\n泡泡排序所示。`!swaps` 等同于语句 `swaps == false`。\n\n接下来是最终的 C++ 程序。\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS = 20;\nint\
  \ main() {\n    int i, m, n;\n    bool swaps;\n    double temp;\n    double w[ELEMENTS];\n\
  \    for (i = 0; i < ELEMENTS; i++) {\n        cin >> w[i];\n    }\n    for (m =\
  \ 1; m <= ELEMENTS - 1; m++) {\n        swaps = false;\n        for (n = ELEMENTS\
  \ - 1; n >= m; n--) {\n            if (w[n] < w[n - 1]) {\n                temp\
  \ = w[n];\n                w[n] = w[n - 1];\n                w[n - 1] = temp;\n\
  \                swaps = true;\n            }\n        }\n        if (!swaps) break;\n\
  \    }\n    cout << \"三个最重的体重是:\" << endl;\n    cout << w[ELEMENTS - 3] << \"  \"\
  \ << w[ELEMENTS - 2] << \"  \" << w[ELEMENTS - 1] << endl;\n    cout << \"三个最轻的体重是:\"\
  \ << endl;\n    cout << w[0] << \"  \" << w[1] << \"  \" << w[2] << endl;\n    return\
  \ 0;\n}\n```\n\n#### 练习 34.4-7 选择排序算法 – 排序一维数组\n\n编写一个代码片段，使用选择排序算法对数组元素进行升序排序。\n\
  \n##### 解决方案\n\n选择排序算法对于大规模数据效率低下，正如泡泡排序算法一样，但它通常比后者更好。它是所有排序算法中最简单的，在主内存（RAM）有限的计算机系统中表现良好。\n\
  \n该算法找到数组中最小（或最大的，取决于排序顺序）的元素并将其与位置 0 处的内容交换。然后对数组剩余部分重复此过程；找到下一个最小元素并放入下一个位置，直到检查所有元素。\n\
  \n例如，让我们尝试按升序对以下数组进行排序。\n\n\n\n\n\n![Image](img/chapter34-20.png)\n\n最低值是 4，位于位置\
  \ 4。根据选择排序算法，该元素将其与位置 0 处的元素交换。数组 `A` 变为：\n\n![Image](img/chapter34-21.png)\n\n\
  数组剩余部分（索引位置 1 到 5）中的最小值是 9，位于位置 5。该元素将其与位置 1 处的元素交换。数组 `A` 变为：\n\n![Image](img/chapter34-22.png)\n\
  \n数组剩余部分（索引位置 2 到 5）中的最小值是 18，位于位置 4。该元素将其与位置 2 处的元素交换。数组 `A` 变为：\n\n![Image](img/chapter34-23.png)\n\
  \n按照同样的方法，下一个最小值是 19，位于位置 5。数组 `A` 变为：\n\n![Image](img/chapter34-24.png)\n\n下一个最小值是\
  \ 36，位于位置 5。该元素与位置 4 处的元素交换，数组 `A` 最终按升序排序完成！\n\n![Image](img/chapter34-25.png)\n\
  \n现在，让我们编写相应的 C++ 程序。使用“从内层到外”的方法是为了帮助你更好地理解整个过程。下一个代码片段找到最小元素，然后将其与位置 0 处的元素交换。请注意，这是内层（嵌套）循环控制结构。假设变量\
  \ `m` 包含值 0。\n\n```cpp\nminimum = a[m];\nindexOfMin = m;\nfor (n = m; n <= ELEMENTS\
  \ - 1; n++) {\n    if (a[n] < minimum) {\n        minimum = a[n];\n        indexOfMin\
  \ = n;\n    }\n}\n//找到最小值了！现在交换值。\ntemp = a[m];\na[m] = a[indexOfMin];\na[indexOfMin]\
  \ = temp;\n```\n\n现在，为了对数组中的所有元素重复此过程，你可以将此代码片段嵌套在一个遍历所有元素的 `for` 循环中。按升序排序数组的最终选择排序算法如下：\n\
  \n```cpp\nfor (m = 0; m <= ELEMENTS - 1; m++) {\n    minimum = a[m];\n    indexOfMin\
  \ = m;\n    for (n = m; n <= ELEMENTS - 1; n++) {\n        if (a[n] < minimum) {\n\
  \            minimum = a[n];\n            indexOfMin = n;\n        }\n    }\n  \
  \  temp = a[m];\n    a[m] = a[indexOfMin];\n    a[indexOfMin] = temp;\n}\n```\n\n\
  ![](img/notice.jpg)如果你想按降序排序数组，你只需要搜索最大值而不是最小值。\n\n![](img/remember.jpg)就像冒泡算法一样，为了用选择排序算法对字母数字数据进行排序，你可以做的一件事：保持算法不变！\n\
