  \n### 27.1 什么是嵌套循环？\n\n嵌套循环是一个循环中的另一个循环，换句话说，就是外循环中的内循环。\n\n外层循环控制内循环完整迭代的次数。这意味着外层循环的第一次迭代会触发内循环开始迭代直到完成。然后，外层循环的第二次迭代会再次触发内循环开始迭代直到完成。这个过程不断重复，直到外层循环完成所有的迭代。\n\
  \n以以下 C++ 程序为例。\n\n![](img/my_exercise_header.png) project_27.1\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i, j;\n    for (i = 1;\
  \ i <= 2; i++) {\n        for (j = 1; j <= 3; j++) {\n            cout << i << \"\
  \  \" << j << endl;\n        }\n    }\n    return 0;\n}\n```\n\n在这个程序中，由变量 `i` 控制的外层循环决定了内循环执行的完整迭代次数。具体来说，当变量\
  \ `i` 为 1 时，内循环执行三次迭代（对于 `j = 1`、`j = 2` 和 `j = 3`）。在完成内循环后，外层循环再执行一次迭代（对于 `i =\
  \ 2`）。因此，内循环重启，再次执行三次新的迭代（对于 `j = 1`、`j = 2` 和 `j = 3`）。\n\n上一个示例与以下示例。\n\n```cpp\n\
  int i, j;\ni = 1; // 外循环给变量 i 赋值为 1\nfor (j = 1; j <= 3; j++) { // 内循环执行三次迭代\n \
  \   cout << i << \"  \" << j << endl;\n}\ni = 2; // 外循环给变量 i 赋值为 2\nfor (j = 1;\
  \ j <= 3; j++) { // 内循环重新开始并执行三次新的迭代\n    cout << i << \"  \" << j << endl;\n}\n\
  ```\n\n输出结果如下。\n\n![Image](img/chapter27-01.png)\n\n![](img/notice.jpg) 只要不违反语法规则，你就可以根据需要嵌套任意数量的循环控制结构。但出于实际考虑，当你移动四层或五层嵌套时，整个结构会变得非常复杂且难以理解。然而，经验表明，作为一名程序员，你一生中进行的最大嵌套层数可能只有三四层。\n\
  \n![](img/notice.jpg) 内循环和外循环不需要是相同类型。例如，`for` 语句可以嵌套（包含）`while` 语句，反之亦然。\n\n####\
  \ 练习题 27.1-1 说“Hello Zeus”。统计总迭代次数。\n\n找出消息“Hello Zeus”显示的次数。\n\n![](img/my_exercise_header.png)\
  \ project_27.1-1\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i, j;\n    for (i = 0; i <= 2; i++) {\n        for (j = 0; j <= 3;\
  \ j++) {\n            cout << \"Hello Zeus\" << endl;\n        }\n    }\n    return\
  \ 0;\n}\n```\n\n##### 答案\n\n变量 `i` 和 `j` 的值（按出现顺序）如下：\n\n- 对于 `i = 0`，内循环执行 4 次迭代（对于\
  \ `j = 0`、`j = 1`、`j = 2` 和 `j = 3`），消息“Hello Zeus”显示 4 次。\n- 对于 `i = 1`，内循环执行 4\
  \ 次迭代（对于 `j = 0`、`j = 1`、`j = 2` 和 `j = 3`），消息“Hello Zeus”显示 4 次。\n- 对于 `i = 2`，内循环执行\
  \ 4 次迭代（对于 `j = 0`、`j = 1`、`j = 2` 和 `j = 3`），消息“Hello Zeus”显示 4 次。\n\n因此，消息“Hello\
  \ Zeus”总共显示 3 × 4 = 12 次。\n\n![](img/remember.jpg) 外层循环控制内循环的完整迭代次数！\n\n#### 练习题\
