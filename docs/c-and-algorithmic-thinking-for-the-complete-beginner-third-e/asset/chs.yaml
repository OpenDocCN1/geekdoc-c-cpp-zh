  \n## 第 13 章：商与余数的练习\n\n### 13.1 引言\n\n哪些类型的问题可能需要使用整数除法的商和余数？虽然这个问题可能没有简单的答案，但商和余数可以：\n\
  \n- 将一个数字拆分为单个数字\n- 检查整数是奇数还是偶数\n- 确定一个数是否是倍数\n- 将经过的时间转换为小时、分钟和秒\n- 寻找最大约数\n- 确定一个数字是否是回文\n\
  - 统计特定数字出现的次数\n\n#### 13.1-1 计算商和余数\n\n编写一个 C++ 程序，提示用户输入两个整数，然后计算商和余数。\n\n解：\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int number1,\
  \ number2, q, r;\n    cout << \"Enter first number: \";\n    cin >> number1;\n \
  \   cout << \"Enter second number: \";\n    cin >> number2;\n    q = (int)(number1\
  \ / number2);\n    r = number1 % number2;\n    cout << \"Integer Quotient: \" <<\
  \ q << \"\\nInteger Remainder: \" << r << endl;\n    return 0;\n}\n```\n\n#### 13.1-2\
  \ 计算数字之和\n\n编写一个 C++ 程序，提示用户输入一个四位整数，然后计算其各位数字之和。\n\n\n\n\n\n| 第四位 = 3 | 最后一个剩余数字，恰好是第四位，是\
  \ `digit4 = 53 % 10` |\n\n这里显示了解决该算法的 C++ 程序。\n\n![](img/my_exercise_header.png)\
