  \n![Image](img/chapter34-42.png)\n\n假设用户输入了一个要查找的国家，二分查找算法找到了该国家，例如在 `countryNames`\
  \ 数组的索引位置 `2` 处。该程序可以使用此值 `2` 作为 `eventDescriptions` 数组的列索引，并显示第 `2` 列的所有事件描述。\n\
  \nC++ 程序如下。\n\n![](img/my_exercise_header.png)\nproject_34.5-9\n```cpp\n#include\
