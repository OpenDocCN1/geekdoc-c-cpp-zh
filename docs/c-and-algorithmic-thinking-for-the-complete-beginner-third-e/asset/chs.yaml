  \ 10，程序必须显示“天气寒冷且无风”。假设用户输入有效值。\n\n## 第 21 章 决策结构的流程图\n\n### 21.1 引言\n\n通过前面的章节，你已经熟悉了所有的决策结构。由于流程图是学习“算法思维”以及帮助更好地理解特定结构的理想方式，本章专门教授如何将\
  \ C++ 程序转换为流程图，或将流程图转换为 C++ 程序。\n\n### 21.2 将 C++ 程序转换为流程图\n\n将 C++ 程序转换为对应的流程图，你需要回顾所有的决策结构及其对应的流程图片段。它们在这里汇总：\n\
  \n单分支决策结构（single-alternative structure）\n\n![Image](img/chapter16-01.png)\n\n双分支决策结构（dual-alternative\
  \ structure）\n\n![Image](img/chapter17-01.png)\n\n多分支决策结构（multiple-alternative structure）\n\
  \n![Image](img/chapter18-01.png)\n\n![](img/notice.jpg)可以使用同样的流程图来表示使用 `case` 结构的\
  \ C++ 代码！\n\n#### 练习 21.2-1 设计流程图\n\n设计与以下 C++ 程序对应的流程图。\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double x, z, w, y, a;\n\
  \    cin >> x;\n    z = pow(x, 3);\n    w = (z - 4) * (x - 3) / 7 + 36;\n    if\
  \ (z >= w && x < z) {\n        y = 2 * x;\n        if (y > 0) { //这是一个嵌套单分支决策结构\n\
  \            y += 1;\n        }\n    } else {\n        y = 4 * x;\n        a++;\n\
  \    }\n    cout << y << endl;\n    return 0;\n}\n```\n\n答案\n\n在这个 C++ 程序中，单分支决策结构嵌套在一个双分支决策结构内部。其对应的流程图如下。\n\
  \n![Image](img/chapter21-01.png)\n\n![](img/notice.jpg)流程图表示算法的一种非常灵活的方法。因此，编写 `x³`\
  \ 或使用 `pow()` 函数完全随你所欲；任何熟悉流程图的人都能清晰理解你想表达的内容。\n\n![](img/notice.jpg)在流程图中，本书使用了通用的\
  \ `AND`、`OR` 和 `NOT` 运算符！\n\n#### 练习 21.2-2 设计流程图\n\n设计与以下通用形式代码片段对应的流程图。\n\n```\n\
