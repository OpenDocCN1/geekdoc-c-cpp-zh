  \n以下程序使用冒泡排序算法对 `total` 数组进行排序。由于算法必须按降序排序，较大的元素必须逐渐“泡”到索引较低的位置，就像气泡在可乐杯中上升一样。然而，鉴于只需要找到三位最优秀的运动员（共有\
  \ 20 名运动员），算法仅需执行 3 趟即可。通过这样做，只有前三个较大的元素会逐渐“泡”到数组的前三个位置。\n\n解决方案在下所示。\n\n![](img/my_exercise_header.png)\
