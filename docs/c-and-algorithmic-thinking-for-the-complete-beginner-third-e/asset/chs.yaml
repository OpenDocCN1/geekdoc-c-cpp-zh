  \ |\n| 11 | 暴风 |\n| 12 | 飓风级 |\n\n# 第 20 章：嵌套决策控制结构\n\n### 20.1 什么是嵌套决策控制结构？\n\n\
  嵌套决策控制结构是指“嵌套”（包含）在另一个决策控制结构内部的控制结构。这意味着一个决策控制结构可以嵌套（包含）另一个决策控制结构（后者就变成了“嵌套”决策控制结构）。反之，这个嵌套决策控制结构也可以包含另一个决策结构，以此此类推。\n\
  \n这里展示了一个嵌套决策控制结构的示例。\n\n![Image](img/chapter20-01.png)\n\n它可以被重新排列为：\n\n![Image](img/chapter20-02.png)\n\
  \n这里展示了对应的 C++ 代码。\n\n```cpp\nif (x < 30) {\n    if (x < 15) {\n        y = y +\
  \ 2;\n    }else {\n        y--;\n    }\n}else {\n    y++;\n}\n```\n\n这种嵌套的深度没有实际限制。只要不违反语法规则，你可以随意嵌套任意数量的决策控制结构。然而，出于实际考虑，当你移动三层或四层嵌套时，整个结构会变得非常复杂且难以理解。\n\
  \n![](img/notice.jpg)复杂的代码可能会导致无效结果！尝试通过将大型嵌套决策控制结构拆分为多个较小的结构，或者使用其他类型的决策控制结构，使你的代码尽可能简单。\n\
  \n显然，只要保持语法和逻辑上的正确，你可以将任何决策控制结构嵌套在任何其他决策控制结构内部。在下一个示例中，一个 case 决策结构嵌套在一个双分支决策结构内部。\n\
  \n![](img/my_exercise_header.png) project_20.1\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int x;\n    cout << \"Enter a choice: \"\
  ;\n    cin >> x;\n    if (x < 1 || x > 4) {\n        cout << \"Invalid choice\"\
  \ << endl;\n    }else {\n        cout << \"Valid choice\" << endl;\n        switch\
  \ (x) {\n            case 1:\n                cout << \"1st choice selected\" <<\
  \ endl;\n                break;\n            case 2:\n                cout << \"\
  2nd choice selected\" << endl;\n                break;\n            case 3:\n  \
  \              cout << \"3rd choice selected\" << endl;\n                break;\n\
  \            case 4:\n                cout << \"4th choice selected\" << endl;\n\
  \                break;\n        }\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意\
  \ `switch` 语句中缺少了 `default` 关键字。如果你想包含它，考虑到检查的唯一选择是 1、2, 3 或 4，你可以将 `case 4` 替换为\
  \ `default`。\n\n### 练习 20.1-1 追踪表与嵌套决策控制结构\n\n创建一个追踪表，以确定下一个 C++ 程序在三种不同执行情况下每一步中变量的值。\n\
  \n三次执行的输入值分别为：(i) 13，(ii) 18 和 (iii) 30。\n\n![](img/my_exercise_header.png) project_20.1-1\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int x, y;\n\
  \    cin >> x;\n    y = 10;\n    if (x < 30) {\n        if (x < 15) {\n        \
  \    y = y + 2;\n        }\n        else {\n            y--;\n        }\n    }else\
  \ {\n        y++;\n    }\n    cout << y << endl;\n    return 0;\n}\n```\n\n####\
  \ 解答\n\ni) 对于输入值 13，追踪表如下。\n\n| 步骤 | 语句 | 注释 | x | y |\n| --- | --- | --- | ---\
  \ | --- |\n| 1 | `cin >> x` | 用户输入值 13 | 13 | ? |\n| 2 | `y = 10` | | 13 | 10 |\n\
  | 3 | `if (x < 30)` | 结果为真 | | |\n| 4 | `if (x < 15)` | 结果为真 | | |\n| 5 | `y = y\
  \ + 2` | | 13 | 12 |\n| 6 | `cout << y << endl` | 显示: 12 | | |\n\nii) 对于输入值 18，追踪表如下。\n\
  \n| 步骤 | 语句 | 注释 | x | y |\n| --- | --- | --- | --- | --- |\n| 1 | `cin >> x` |\
  \ 用户输入值 18 | 18 | ? |\n| 2 | `y = 10` | | 18 | 10 |\n| 3 | `if (x < 30)` | 结果为真\
  \ | | |\n| 4 | `if (x < 15)` | 结果为假 | | |\n| 5 | `y--` | | 18 | 9 |\n| 6 | `cout\
  \ << y << endl` | 显示: 9 | | |\n\niii) 对于输入值 30，追踪表如下。\n\n| 步骤 | 语句 | 注释 | x | y\
  \ |\n| --- | --- | --- | --- | --- |\n| 1 | `cin >> x` | 用户输入值 30 | 30 | ? |\n|\
  \ 2 | `y = 10` | | 30 | 10 |\n| 3 | `if (x < 30)` | 结果为真 | | |\n| 4 | `if (x < 15)`\
  \ | 结果为假 | | |\n| 5 | `y++` | | 30 | 11 |\n| 6 | `cout << y << endl` | 显示: 11 |\
