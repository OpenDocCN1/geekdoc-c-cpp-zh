  \ endl;  //它显示: 22.6 23 Round the number up\n    cout << s3 << endl;  //它显示: 55.5\
  \ 56 Round the number up again\n    return 0;\n}\n```\n\n#### 读取数值\n\n要从文件的当前位置读取值直到第一个空格字符或当前行末尾（以先者先为），并将其赋值给变量\
  \ `var_name`，可以使用以下通用形式的语句：\n\n`descriptor >> var_name;`\n\n其中：\n\n- `descriptor`\
  \ 是用于打开文件的文件对象的名称。\n- `var_name` 可以是任何 `string`、`int`、`double` 等类型的变量。\n\n以下程序将文件\
  \ `f_data40.6.txt` 中的前两个值赋值给变量 `d1`、`i1`，并将第一行的文本赋值给变量 `s1`。然后，它对文件的第二行执行相同的操作，将值赋值给变量\
