    function:


    #include <iostream>


    #include <string>


    #include <vector>


    #include <numeric>


    std::string joinStrings(const std::vector<std::string>& strings, const std::string&
    delimiter) {


        // Using the + operator


        std::string result;


        for (const auto& str : strings) {


            result += str + delimiter;


        }


        // Remove the extra delimiter at the end


        if (!result.empty()) {


