    # String Valid Number


    To determine if a given string is a valid number in C++, you can use either regular
    expressions or string parsing techniques. Both approaches have their advantages,
    and I will explain how to use each of them to solve the problem.


    Regular Expressions Approach: Regular expressions provide a concise and powerful
    way to match patterns within strings. You can define a regular expression pattern
    that matches valid number formats and then check if the given string matches that
    pattern.


    Here’s an example implementation using regular expressions:


    #include <regex>


    #include <iostream>


    bool isValidNumber(const std::string& str) {


        // Regular expression pattern for a valid number


        std::regex numberPattern("^[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)?$");


        return std::regex_match(str, numberPattern);


    }


    int main() {


        std::string input;


        std::cout << "Enter a number: ";


        std::getline(std::cin, input);


        if (isValidNumber(input))


            std::cout << "Valid number!" << std::endl;


        else


            std::cout << "Invalid number!" << std::endl;


        return 0;


    }


    In this example, we use the std::regex_match function to check if the given string
    matches the regular expression pattern. The pattern ^[-+]?[0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)?$
    matches various number formats, including integers, decimals, and scientific notation.


    String Parsing Approach: String parsing involves examining the characters of a
    string and checking if they conform to the rules of a valid number. This approach
    is more flexible and allows for custom handling of different number formats.


    Here’s an example implementation using string parsing:


    #include <iostream>


    #include <string>


    #include <cctype>


    bool isValidNumber(const std::string& str) {


        bool hasDigits = false;


        bool hasDot = false;


        bool hasE = false;


        // Skip leading whitespace


        size_t i = 0;


        while (i < str.length() && std::isspace(str[i]))


            i++;


        // Check optional sign character


        if (str[i] == ''+'' || str[i] == ''-'')


            i++;


        // Check digits or dot before optional ''e'' character


        while (i < str.length() && (std::isdigit(str[i]) || str[i] == ''.'')) {


            if (std::isdigit(str[i]))


                hasDigits = true;


            if (str[i] == ''.'')


                hasDot = true;


            i++;


        }


        // Check optional ''e'' character and digits after it


        if (i < str.length() && (str[i] == ''e'' || str[i] == ''E'')) {


            hasE = true;


            i++;


            if (str[i] == ''+'' || str[i] == ''-'')


                i++;


            while (i < str.length() && std::isdigit(str[i]))


                i++;


        }


        // Skip trailing whitespace


        while (i < str.length() && std::isspace(str[i]))


            i++;


        // The number should have at least one digit and no more characters


        return hasDigits && i == str.length();


    }


    int main() {


        std::string input;


        std::cout << "Enter a number: ";


        std::getline(std::cin, input);


        if (isValidNumber(input))


            std::cout << "Valid number!" << std::endl;


        else


            std::cout << "Invalid number!" << std::endl;


        return 0;


