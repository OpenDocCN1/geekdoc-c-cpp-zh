  raw: 'To calculate the length of a given string in C++, you can use the length()
    or size() member function of the std::string class. Both functions return the
    number of characters in the string.


    Here’s an example program that demonstrates how to use the length() member function:


    #include <iostream>


    #include <string>


    int main() {


        std::string str;


        std::cout << "Enter a string: ";


        std::getline(std::cin, str);


        // Calculate the length using length() function


        int length = str.length();


        std::cout << "Length of the string is: " << length << std::endl;


        return 0;


    }


    In this program, we start by declaring a std::string variable named str. We then
    prompt the user to enter a string using std::getline() to handle spaces and special
    characters properly.


    Next, we calculate the length of the string by calling length() on the str object
    and assign the result to the length variable.


    Finally, we print the length of the string using std::cout. The std::endl is used
    to insert a newline character after the output.


    You can use a similar approach with the size() member function. Both length()
    and size() functions perform the same task and return the same value, so you can
    choose either one based on your preference.


    Remember to include the necessary header files iostream and string for input/output
    operations and string handling, respectively.


    # String Concatenation


    In C++, you can concatenate two strings using either the + operator or the append()
    member function of the string class. Here’s an example program that demonstrates
    both approaches:


    #include <iostream>


    #include <string>


    int main() {


        std::string str1 = "Hello";


        std::string str2 = " world";


        // Using the + operator


        std::string result = str1 + str2;


        std::cout << "Using + operator: " << result << std::endl;


        // Using the append() member function


        std::string result2 = str1;


        result2.append(str2);


        std::cout << "Using append(): " << result2 << std::endl;


        return 0;


    }


    In this program, we have two strings: str1 and str2\. We want to concatenate them
    to form a single string.


    Using the + operator:


    *   We can use the + operator to concatenate str1 and str2 directly. This operator
    performs string concatenation when used with std::string objects. The result is
    stored in the result variable.


    Using the append() member function:


    *   The std::string class provides the append() member function, which concatenates
    one string with another.


    *   To use append(), we create a new string called result2 and initialize it with
    str1.


    *   We then call the append() function on result2 and pass str2 as the argument.
    This appends str2 to the end of result2.


    Both methods produce the same result, and the output of the program will be:


    Using + operator: Hello world


    Using append(): Hello world


    You can choose whichever method you find more convenient for concatenating strings
    in your C++ programs.


    # String Comparison


    Here’s an example of a C++ program that compares two strings for equality using
    both the == operator and the compare() member function of the string class:


    #include <iostream>


    #include <string>


    int main() {


        std::string str1 = "Hello";


        std::string str2 = "World";


        // Using the == operator


        if (str1 == str2) {


            std::cout << "The strings are equal (using == operator)" << std::endl;


        } else {


            std::cout << "The strings are not equal (using == operator)" << std::endl;


        }


        // Using the compare() member function


        if (str1.compare(str2) == 0) {


            std::cout << "The strings are equal (using compare() member function)"
    << std::endl;


        } else {


            std::cout << "The strings are not equal (using compare() member function)"
    << std::endl;


        }


        return 0;


    }


    In this program, we have two strings: str1 and str2\. We compare them for equality
    using both the == operator and the compare() member function.


    *   The == operator compares the content of the two strings character by character
    and returns true if they are equal, and false otherwise.


    *   The compare() member function of the string class compares two strings and
    returns an integer value. If the strings are equal, it returns 0\. If the first
    string is lexicographically less than the second string, it returns a negative
    value. If the first string is lexicographically greater than the second string,
    it returns a positive value.


    In the program, we use an if statement to check the result of the comparison and
    print the appropriate message based on the comparison result.


    Note that the == operator and the compare() member function are case-sensitive.
    So, for example, “Hello” and “hello” will be considered different strings. If
    you want a case-insensitive comparison, you can use functions like tolower() or
    toupper() to convert the strings to the same case before performing the comparison.


    # String Substring


    To extract a substring from a given string in C++, you can use the substr() member
    function of the std::string class. The substr() function allows you to create
    a new string containing a portion of the original string based on the specified
    starting index and length.


    Here’s an example program that demonstrates the usage of substr():


    #include <iostream>


    #include <string>


    int main() {


        std::string originalString = "Hello, World!";


        int startIndex = 7; // Index where the substring starts


        int length = 5;     // Length of the substring


        std::string extractedSubstring = originalString.substr(startIndex, length);


        std::cout << "Original String: " << originalString << std::endl;


        std::cout << "Extracted Substring: " << extractedSubstring << std::endl;


        return 0;


    }


    In this example, the original string is “Hello, World!”. We want to extract a
    substring starting from index 7 (which corresponds to the character ‘W’) with
    a length of 5 characters. The substr() function is called with the startIndex
    and length arguments, and it returns a new string containing the extracted substring.


    The output of the program will be:


    Original String: Hello, World!


    Extracted Substring: World


    The substr() function takes two parameters:


    1.  Starting index: It specifies the position in the original string where the
    substring should start. The index is zero-based, so the first character is at
    index 0.


    2.  Length: It indicates the number of characters to be included in the substring.
    If the length is not specified, the function extracts all the characters from
    the starting index to the end of the string.


    It’s important to note that the starting index and length must be within the valid
    range of the original string to avoid accessing out-of-bounds memory. If the starting
    index is greater than or equal to the length of the string, an empty string will
    be returned. If the length specified exceeds the available characters from the
    starting index to the end of the string, the returned substring will contain only
    the available characters.


    Make sure to include the <string> header file to use the std::string class and
    its member functions.


    # String Trimming


    To remove leading and trailing whitespace from a string in C++, you can use the
    find_first_not_of() and find_last_not_of() member functions of the std::string
    class. Here’s how you can do it:


    #include <iostream>


    #include <string>


    std::string trimString(const std::string& str) {


        std::size_t first = str.find_first_not_of('' '');


        if (first == std::string::npos) // If the string is all whitespace


            return "";


        std::size_t last = str.find_last_not_of('' '');


        return str.substr(first, last - first + 1);


    }


    int main() {


        std::string input;


        std::cout << "Enter a string: ";


        std::getline(std::cin, input);


        std::string trimmedString = trimString(input);


        std::cout << "Trimmed string: " << trimmedString << std::endl;


        return 0;


    }'
