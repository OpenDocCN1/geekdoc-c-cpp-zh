    the string from beginning to end using an iterator (it). If the character at the
    current position matches the target character, we use the erase() function to
    remove that character from the string and update the iterator to point to the
    next position. If the characters don’t match, we simply increment the iterator.
    This loop continues until we reach the end of the string.


