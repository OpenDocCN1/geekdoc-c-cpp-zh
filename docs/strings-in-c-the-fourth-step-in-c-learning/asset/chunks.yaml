    \    std::string extractedSubstring = originalString.substr(startIndex, length);\n\
    \    std::cout << \"Original String: \" << originalString << std::endl;\n    std::cout\
    \ << \"Extracted Substring: \" << extractedSubstring << std::endl;\n    return\
    \ 0;\n}\n```\n\nIn this example, `originalString` is `\"Hello, World!\"`. We want\
    \ to extract a substring starting from index `7` with a length of `5`. The `substr()`\
    \ function takes two parameters:\n\n1. `startIndex`: The position in the original\
    \ string where the substring should start. The index is zero-based.\n2. `length`:\
    \ The number of characters to be included in the substring. If the length is not\
    \ specified, the function extracts all characters from the `startIndex` to the\
    \ end of the string.\n\nIt’s important to note that the `startIndex` must be within\
    \ the valid range of the original string. If it is greater than or equal to the\
