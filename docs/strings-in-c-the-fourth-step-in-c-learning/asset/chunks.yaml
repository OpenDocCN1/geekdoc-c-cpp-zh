    string and converts it to lowercase using the tolower() function. Here’s how the
    tolower() function works:


    *   The tolower() function is part of the <cctype> header, which provides functions
    for character classification and transformation.


    *   tolower() takes a single argument of type int or unsigned int, representing
    the character to be converted.


    *   It returns an integer value that represents the lowercase equivalent of the
    input character, if it is an uppercase letter. If the input character is already
    lowercase or not an alphabet character, the function returns the original character.


    *   The tolower() function only operates on individual characters, so we need
    to iterate over each character in the input string and apply the function to convert
    them all.


    In the convertToLowercase() function, we initialize an empty string lowercase
    to store the converted lowercase string. Then, we loop over each character c in
    the input string and use std::tolower(c) to convert it to lowercase. The converted
    character is then appended to the lowercase string.


    Finally, in the main() function, we get the input string from the user using std::getline(),
    call the convertToLowercase() function, and display the converted lowercase string.


    Note: The std::tolower() function handles ASCII characters correctly. If you’re
    working with non-ASCII characters, you may need to use additional techniques or
    libraries to handle them appropriately.


    # String Character Replacement


    To replace all occurrences of a specific character in a string with another character
    in C++, you can utilize the replace() member function of the std::string class.
    Here’s an example program that demonstrates this:


    #include <iostream>


    #include <string>


    int main() {


        std::string str = "Hello, World!";


        char target = ''o'';


        char replacement = ''*'';


        size_t pos = str.find(target); // Find the first occurrence of the target
    character


        while (pos != std::string::npos) {


            str.replace(pos, 1, 1, replacement); // Replace 1 character at position
    ''pos'' with ''replacement''


            pos = str.find(target, pos + 1); // Find the next occurrence of the target
    character


        }


        std::cout << "Modified string: " << str << std::endl;


        return 0;


    }


    In this program, we have a string str containing the original string, and we want
    to replace all occurrences of the character ‘o’ with ‘*‘.


    First, we use the find() member function of the std::string class to locate the
    first occurrence of the target character ‘o’ in the string. If the character is
    found, find() returns the position (index) of the first occurrence. If it’s not
    found, find() returns std::string::npos (a special constant representing “not
    found”).


    Next, we enter a while loop that continues until no more occurrences of the target
    character are found. Inside the loop, we use the replace() member function of
    the std::string class to replace the character at the found position (pos) with
    the replacement character (’*’). The replace() function takes four arguments:
    the starting position, the number of characters to replace, the new string to
    replace with, and the length of the new string. In this case, we are replacing
    only one character.


    After replacing the character, we update the pos variable by using find() again,
    but this time we provide the starting position as pos + 1 to find the next occurrence
    of the target character. This ensures that we continue searching for and replacing
    all subsequent occurrences of the character.


    Finally, we print the modified string to verify the result.


