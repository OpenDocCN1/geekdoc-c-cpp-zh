  trans: "\n在 C++ 中计算给定字符串的长度，你可以使用 `std::string` 类的 `length()` 或 `size()` 成员函数。这两个函数都返回字符串中的字符数。\n\
    \n这里是一个演示如何使用 `length()` 成员函数的程序：\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nint main() {\n    std::string str;\n    std::cout << \"Enter a string: \";\n\
    \    std::getline(std::cin, str);\n    // 使用 length() 函数计算长度\n    int length =\
    \ str.length();\n    std::cout << \"Length of the string is: \" << length << std::endl;\n\
    \    return 0;\n}\n```\n\n在这个程序中，我们首先声明了一个名为 `str` 的 `std::string` 变量。然后，我们提示用户使用\
    \ `std::getline()` 输入字符串，以便正确处理空格和特殊字符。\n\n接下来，我们通过在 `str` 对象上调用 `length()` 来计算字符串的长度，并将结果赋值给变量\
    \ `length` 。\n\n最后，我们使用 `std::cout` 打印字符串的长度。`std::endl` 用于在输出后插入一个换行符。\n\n你可以使用\
    \ `size()` 成员函数采用类似的方法。`length()` 和 `size()` 函数执行相同的任务并返回相同的值，因此你可以根据喜好选择其中任何一个。\n\
    \n记住包含必要的头文件 `iostream` 和 `string`，分别用于输入输出操作和字符串处理。\n\n# 字符串拼接\n\n在 C++ 中，你可以使用\
    \ `+` 运算符或字符串类的 `append()` 成员函数来拼接两个字符串。这里是一个演示这两种方法的程序：\n\n```cpp\n#include <iostream>\n\
    #include <string>\n\nint main() {\n    std::string str1 = \"Hello\";\n    std::string\
    \ str2 = \" world\";\n    // 使用 + 运算符\n    std::string result = str1 + str2;\n\
    \    std::cout << \"Using + operator: \" << result << std::endl;\n    // 使用 append()\
    \ 成员函数\n    std::string result2 = str1;\n    result2.append(str2);\n    std::cout\
    \ << \"Using append(): \" << result2 << std::endl;\n    return 0;\n}\n```\n\n\
    在这个程序中，我们有两个字符串：`str1` 和 `str2`。我们想要拼接它们以形成单个字符串。\n\n### 使用 `+` 运算符：\n- 我们可以使用\
    \ `+` 运算符直接拼接 `str1` 和 `str2`。该运算符在与 `std::string` 对象一起使用时会执行字符串拼接。结果存储在变量 `result`\
    \ 中。\n\n### 使用 `append()` 成员函数：\n- `std::string` 类提供了 `append()` 成员函数，它可以将一个字符串与另一个字符串拼接。\n\
    - 要使用 `append()`，我们创建了一个名为 `result2` 的新字符串并用 `str1` 初始化它。\n- 然后，我们在 `result2`\
    \ 上调用 `append()` 函数并将 `str2` 作为参数传递。这会将 `str2` 追加到 `result2` 的末尾。\n\n这两种方法产生相同的结果，程序的输出将是：\n\
    `Using + operator: Hello world`\n`Using append(): Hello world`\n\n你可以在 C++ 程序中选择你认为更方便的方法来拼接字符串。\n\
    \n# 字符串比较\n\n这里有一个 C++ 程序示例，它通过使用 `==` 运算符和字符串类的 `compare()` 成员函数来比较两个字符串的相等性：\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
    \ str1 = \"Hello\";\n    std::string str2 = \"World\";\n    // 使用 == 运算符\n   \
    \ if (str1 == str2) {\n        std::cout << \"The strings are equal (using ==\
    \ operator)\" << std::endl;\n    } else {\n        std::cout << \"The strings\
    \ are not equal (using == operator)\" << std::endl;\n    }\n    // 使用 compare()\
    \ 成员函数\n    if (str1.compare(str2) == 0) {\n        std::cout << \"The strings\
    \ are equal (using compare() member function)\" << std::endl;\n    } else {\n\
    \        std::cout << \"The strings are not equal (using compare() member function)\"\
    \ << std::endl;\n    }\n    return 0;\n}\n```\n\n在这个程序中，我们有两个字符串：`str1` 和 `str2`。我们同时使用\
    \ `==` 运算符和 `compare()` 成员函数来比较它们的相等性。\n\n- `==` 运算符逐字符地比较两个字符串的内容，如果它们相等则返回 `true`，否则返回\
    \ `false`。\n- `compare()` 成员函数比较两个字符串，如果它们相等则返回 `0`；如果第一个字符串在字典序上小于第二个字符串，则返回负值；如果大于第二个字符串，则返回正值。\n\
    \n# 子字符串\n\n在 C++ 中，从给定字符串中提取子字符串，你可以使用 `std::string` 类的 `substr()` 成员函数。这里是一个演示\
    \ `substr()` 用法的程序：\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main()\
    \ {\n    std::string originalString = \"Hello, World!\";\n    int startIndex =\
    \ 7; // 子字符串开始的位置\n    int length = 5; // 子字符串的长度\n    std::string extractedSubstring\
    \ = originalString.substr(startIndex, length);\n    std::cout << \"Original String:\
    \ \" << originalString << std::endl;\n    std::cout << \"Extracted Substring:\
    \ \" << extractedSubstring << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，`originalString`\
    \ 是 `\"Hello, World!\"`。我们想要从索引 `7` 开始提取长度为 `5` 的子字符串。`substr()` 函数接收两个参数：\n\n\
    1. `startIndex`：子字符串开始的位置。索引从零。\n2. `length`：包含在子字符串中的字符数。如果不指定长度，函数将提取从 `startIndex`\
    \ 到字符串结尾的所有字符。\n\n注意的是 `startIndex` 必须在原始字符串的有效范围内。如果它大于或等于字符串的长度，则返回空字符串。如果指定的长度超过了可用字符，返回的子字符串仅包含可用字符。\n\
    \n# 字符串修剪\n\n在 C++ 中去除字符串首尾的空格，你可以使用 `std::string` 类的 `find_first_not_of()` 和\
    \ `find_last_not_of()` 成员函数。你可以这样操作：\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\n\nstd::string trimString(const std::string& str) {\n    std::size_t\
    \ first = str.find_first_not_of(' ');\n    if (first == std::string::npos) //\
    \ 如果字符串全是空格\n        return \"\";\n    std::size_t last = str.find_last_not_of('\
    \ ');\n    return str.substr(first, last - first + 1);\n}\n\nint main() {\n  \
    \  std::string input;\n    std::cout << \"Enter a string: \";\n    std::getline(std::cin,\
    \ input);\n    std::string trimmedString = trimString(input);\n    std::cout <<\
    \ \"Trimmed string: \" << trimmedString << std::endl;\n    return 0;\n}\n```\n"
- fmt: "\nIn the above code, we define a function `trimString()` that takes a constant\
    \ reference to a string (`str`) and returns the trimmed version of that string.\
    \ Here’s a breakdown of the code:\n\n1. The `find_first_not_of()` member function\
    \ of the `std::string` class is used to find the position of the first character\
    \ in the string that is not a whitespace character. It returns the index of that\
    \ character or `std::string::npos` if no such character is found.\n2. We check\
    \ if `first` is equal to `std::string::npos`, which indicates that the entire\
    \ string is composed of whitespace characters. In that case, we return an empty\
    \ string.\n3. The `find_last_not_of()` member function is used to find the position\
    \ of the last character in the string that is not a whitespace character. It returns\
    \ the index of that character or `std::string::npos` if no such character is found.\n\
    4. We use the `substr()` member function of the `std::string` class to extract\
    \ the substring starting from `first` and ending at `last`. The length of the\
    \ substring is calculated as `last - first + 1`.\n5. The trimmed string is returned\
    \ from the function.\n\nIn the `main()` function, we prompt the user to enter\
    \ a string using `std::getline()`, and then we call the `trimString()` function\
    \ to obtain the trimmed version of the input string. Finally, we output the trimmed\
    \ string to the console.\n\nNote that this implementation trims only leading and\
    \ trailing whitespace. If you also want to remove whitespace within the string,\
    \ you can modify the `trimString()` function accordingly.\n\n# String Searching\n\
    \nIn C++, you can use the `find()` or `rfind()` member functions of the `std::string`\
    \ class to search for a specific substring within a larger string.\n\nThe `find()`\
    \ function is used to find the first occurrence of the substring within the string,\
    \ starting from a specified position (or from the beginning if no position is\
    \ provided). It returns the position of the first character of the found substring,\
    \ or `std::string::npos` if the substring is not found.\n\nHere’s an example usage\
    \ of `find()`:\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main()\
    \ {\n    std::string largerString = \"Hello, world!\";\n    std::string substring\
    \ = \"world\";\n    size_t position = largerString.find(substring); // Find the\
    \ first occurrence of the substring\n    if (position != std::string::npos) {\n\
    \        std::cout << \"Substring found at position: \" << position << std::endl;\n\
    \    } else {\n        std::cout << \"Substring not found.\" << std::endl;\n \
    \   }\n    return 0;\n}\n```\n\nOutput:\n`Substring found at position: 7`\n\n\
    The `rfind()` function, on the other hand, is used to find the last occurrence\
    \ of the substring within the string, starting from a specified position (or from\
    \ the end if no position is provided). It also returns the position of the first\
    \ character of the found substring or `std::string::npos` if the substring is\
    \ not found.\n\nHere’s an example usage of `rfind()`:\n\n```cpp\n#include <iostream>\n\
    #include <string>\n\nint main() {\n    std::string largerString = \"Hello, world!\"\
    ;\n    std::string substring = \"o\";\n    size_t position = largerString.rfind(substring);\
    \ // Find the last occurrence of the substring\n    if (position != std::string::npos)\
    \ {\n        std::cout << \"Substring found at position: \" << position << std::endl;\n\
    \    } else {\n        std::cout << \"Substring not found.\" << std::endl;\n \
    \   }\n    return 0;\n}\n```\n\nOutput:\n`Substring found at position: 8`\n\n\
    Both `find()` and `rfind()` functions provide a flexible way to search for substrings\
    \ within a larger string, allowing you to easily determine whether the substring\
    \ exists and its position within the string.\n\n# String Reversal\n\nIn C++, you\
    \ can use the `reverse()` algorithm from the `<algorithm>` header to reverse a\
    \ given string. Here’s an example program that demonstrates how to do it:\n\n\
    ```cpp\n#include <iostream>\n#include <algorithm>\n\nint main() {\n    std::string\
    \ str = \"Hello, World!\";\n    // Reversing the string using the reverse() algorithm\n\
    \    std::reverse(str.begin(), str.end());\n    std::cout << \"Reversed string:\
    \ \" << str << std::endl;\n    return 0;\n}\n```\n\nIn this program, we include\
    \ the necessary headers `<iostream>` and `<algorithm>`.\n\nThe `std::reverse()`\
    \ algorithm is called with two arguments: the iterator to the beginning of the\
    \ string (`str.begin()`) and the iterator to the end of the string (`str.end()`).\
    \ It reverses the elements within the range defined by these iterators.\n\nAfter\
    \ calling `std::reverse()`, the original string `str` will be modified and contain\
    \ the reversed version.\n\n# String Count\n\nHere’s a C++ program that counts\
    \ the occurrence of a character in a string using a loop:\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\n\nint countCharacter(const std::string& str,\
    \ char character) {\n    int count = 0;\n    for (char c : str) {\n        if\
