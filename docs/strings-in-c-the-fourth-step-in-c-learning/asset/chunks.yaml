    # String Searching


    In C++, you can use the find() or rfind() member functions of the std::string
    class to search for a specific substring within a larger string.


    The find() function is used to find the first occurrence of the substring within
    the string, starting from a specified position (or from the beginning if no position
    is provided). It returns the position of the first character of the found substring,
    or std::string::npos if the substring is not found.


    Here’s an example usage of find():


    #include <iostream>


    #include <string>


    int main() {


        std::string largerString = "Hello, world!";


        std::string substring = "world";


        size_t position = largerString.find(substring); // Find the first occurrence
    of the substring


        if (position != std::string::npos) {


            std::cout << "Substring found at position: " << position << std::endl;


        } else {


            std::cout << "Substring not found." << std::endl;


        }


        return 0;


    }


    Output:


    Substring found at position: 7


    The rfind() function, on the other hand, is used to find the last occurrence of
    the substring within the string, starting from a specified position (or from the
    end if no position is provided). It also returns the position of the first character
    of the found substring or std::string::npos if the substring is not found.


    Here’s an example usage of rfind():


    #include <iostream>


    #include <string>


    int main() {


        std::string largerString = "Hello, world!";


        std::string substring = "o";


        size_t position = largerString.rfind(substring); // Find the last occurrence
    of the substring


        if (position != std::string::npos) {


            std::cout << "Substring found at position: " << position << std::endl;


        } else {


            std::cout << "Substring not found." << std::endl;


        }


        return 0;


    }


    Output:


    Substring found at position: 8


    Both find() and rfind() functions provide a flexible way to search for substrings
    within a larger string, allowing you to easily determine whether the substring
    exists and its position within the string.


    # String Reversal


    In C++, you can use the reverse() algorithm from the <algorithm> header to reverse
    a given string. Here’s an example program that demonstrates how to do it:


    #include <iostream>


    #include <algorithm>


    int main() {


        std::string str = "Hello, World!";


        // Reversing the string using the reverse() algorithm


        std::reverse(str.begin(), str.end());


        std::cout << "Reversed string: " << str << std::endl;


        return 0;


    }


    In this program, we include the necessary headers <iostream> and <algorithm>.


    The std::reverse() algorithm is called with two arguments: the iterator to the
    beginning of the string (str.begin()) and the iterator to the end of the string
    (str.end()). It reverses the elements within the range defined by these iterators.


    After calling std::reverse(), the original string str will be modified and contain
    the reversed version.


    Finally, we output the reversed string using std::cout.


    When you run this program, the output will be:


    Reversed string: !dlroW ,olleH


    That’s how you can use the reverse() algorithm from the <algorithm> header to
    reverse a string in C++.


    # String Character Count


    Here’s a C++ program that counts the occurrence of a specific character in a string
    using a loop:


    #include <iostream>


    #include <string>


    int countCharacter(const std::string& str, char character) {


        int count = 0;


        for (char c : str) {


            if (c == character) {


                count++;


            }


        }


        return count;


    }


    int main() {


        std::string str;


        char character;


        std::cout << "Enter a string: ";


        std::getline(std::cin, str);


        std::cout << "Enter a character to count: ";


        std::cin >> character;


        int occurrenceCount = countCharacter(str, character);


        std::cout << "The character ''" << character << "'' occurs " << occurrenceCount
    << " times in the string." << std::endl;


        return 0;


    }


    Explanation:


    1.  The function countCharacter takes two parameters: str is the string in which
    we want to count the occurrences, and character is the character we want to count.


    2.  Inside the function, we initialize a counter variable count to 0, which will
    keep track of the number of occurrences.


    3.  We use a range-based for loop to iterate over each character c in the string
    str.


    4.  Inside the loop, we check if the current character c is equal to the desired
    character character. If they match, we increment the count variable.


    5.  After iterating through the entire string, we return the final count.


    6.  In the main function, we prompt the user to enter a string and store it in
    the str variable using std::getline.


    7.  We then ask the user to enter the character they want to count and store it
    in the character variable.


    8.  Next, we call the countCharacter function with the given string and character
    and store the result in the occurrenceCount variable.


    9.  Finally, we display the count of occurrences to the user.


    Note: This program considers case-sensitive matching. If you want to perform a
    case-insensitive character count, you can convert both the input string and the
    character to either uppercase or lowercase before comparing them in the loop.


    # String Uppercase Conversion


    Here’s an example program in C++ that converts a given string to uppercase using
    the toupper() function from the <cctype> header:


    #include <iostream>


    #include <cctype>


    int main() {


        std::string str;


        // Read the input string


        std::cout << "Enter a string: ";


        std::getline(std::cin, str);


        // Convert the string to uppercase


        for (char& c : str) {


            c = std::toupper(c);


        }


        // Print the uppercase string


        std::cout << "Uppercase string: " << str << std::endl;


        return 0;


    }


    Explanation:


    1.  The program includes the necessary headers: <iostream> for input/output operations
    and <cctype> for the toupper() function.


