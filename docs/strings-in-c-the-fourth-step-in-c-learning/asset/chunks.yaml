    # String Maximum Number


    To find the maximum number that can be formed by rearranging the digits of a given
    number, we can use either sorting techniques or string manipulation techniques
    in C++. I’ll explain both approaches.


    Approach 1: Sorting Technique


    1.  Convert the given number to a string.


    2.  Sort the characters of the string in descending order.


    3.  Convert the sorted string back to an integer.


    Here’s an example implementation using the sorting technique:


    #include <iostream>


    #include <algorithm> // for std::sort


    #include <string>


    int findMaxNumber(int number) {


        // Convert the number to a string


        std::string numberString = std::to_string(number);


        // Sort the characters of the string in descending order


        std::sort(numberString.begin(), numberString.end(), std::greater<char>());


        // Convert the sorted string back to an integer


        int maxNumber = std::stoi(numberString);


        return maxNumber;


    }


    int main() {


        int number;


        std::cout << "Enter a number: ";


        std::cin >> number;


        int maxNumber = findMaxNumber(number);


        std::cout << "Maximum number formed: " << maxNumber << std::endl;


        return 0;


    }


    Approach 2: String Manipulation Technique


    1.  Convert the given number to a string.


    2.  Create an integer array to store the frequency count of each digit from 0
    to 9.


    3.  Iterate over the string and update the frequency count of each digit.


    4.  Construct the maximum number by iterating from 9 to 0 and appending the digits
    to a string based on their frequency count.


    5.  Convert the constructed string to an integer.


    Here’s an example implementation using the string manipulation technique:


    #include <iostream>


    #include <string>


    int findMaxNumber(int number) {


        // Convert the number to a string


        std::string numberString = std::to_string(number);


        // Create an integer array to store frequency count of each digit


        int frequencyCount[10] = {0};


        // Update frequency count of each digit


        for (char digit : numberString) {


            int num = digit - ''0'';


            frequencyCount[num]++;


        }


        // Construct the maximum number by iterating from 9 to 0


        std::string maxNumberString;


        for (int i = 9; i >= 0; i--) {


            maxNumberString += std::string(frequencyCount[i], ''0'' + i);


        }


        // Convert the constructed string to an integer


        int maxNumber = std::stoi(maxNumberString);


        return maxNumber;


    }


    int main() {


        int number;


        std::cout << "Enter a number: ";


        std::cin >> number;


        int maxNumber = findMaxNumber(number);


        std::cout << "Maximum number formed: " << maxNumber << std::endl;


        return 0;


    }


    Both approaches will give you the maximum number that can be formed by rearranging
    the digits of the given number.


    # String Group Shifted Strings


    To solve the problem of grouping shifted strings together, you can utilize string
    manipulation and hashing in C++. Here’s an explanation of how you can approach
    this problem:


    1.  Identify the Shifted Strings: Start by iterating through the given array of
    strings and for each string, identify its shifted counterparts. Two strings are
    considered shifted if one can be obtained from the other by shifting all characters
    by the same offset.


    2.  Normalize the Strings: Normalize each string by calculating the offset between
    its characters. To do this, find the difference between the current character
    and the first character in the string. Adjust the difference to be within the
    range of 0 to 25 (assuming lowercase English letters). This step ensures that
    all shifted strings have a consistent representation.


    3.  Hash the Normalized Strings: Use a hash function to convert each normalized
    string into a unique hash value. The hash function should ensure that shifted
    strings produce the same hash value. One simple approach is to concatenate the
    normalized string and use it as the hash value.


    4.  Group the Strings: Create a hash map (unordered_map) where the keys are the
    hash values and the values are vectors (or lists) of strings. Iterate through
    the array of strings again, and for each string, calculate its hash value using
    the normalized representation. Add the string to the corresponding vector in the
    hash map based on its hash value.


    5.  Retrieve the Grouped Strings: Iterate through the hash map and retrieve the
    grouped strings. Output the grouped strings as separate groups or in any desired
    format.


    Here’s a sample C++ implementation to solve this problem:


    #include <iostream>


    #include <vector>


    #include <unordered_map>


    using namespace std;


    string normalizeString(const string& str) {


        string normalized = str;


        int offset = str[0] - ''a'';


        for (char& c : normalized) {


            c = (c - offset + 26) % 26; // Normalize the characters


        }


        return normalized;


    }


    void groupShiftedStrings(const vector<string>& strings) {


        unordered_map<string, vector<string>> groups;


        for (const string& str : strings) {


            string normalized = normalizeString(str);


            groups[normalized].push_back(str);


        }


        // Print the grouped strings


        for (const auto& entry : groups) {


            const vector<string>& group = entry.second;


            for (const string& str : group) {


                cout << str << " ";


            }


            cout << endl;


        }


    }


    int main() {


        vector<string> strings = {"abc", "bcd", "acef", "xyz", "az", "ba", "a", "z"};


        groupShiftedStrings(strings);


        return 0;


    }


    In this example, the input array strings contains several strings, including shifted
    versions of each other. The groupShiftedStrings function groups the shifted strings
    together and outputs them as separate groups. The normalizeString function is
    used to normalize each string by calculating the offset between its characters.


    Note: This solution assumes that the input strings only consist of lowercase English
    letters. If the strings can contain other characters, you may need to modify the
    normalization step accordingly.


