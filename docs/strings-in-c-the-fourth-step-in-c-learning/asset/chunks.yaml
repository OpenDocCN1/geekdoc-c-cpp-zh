    # Option 1: Using the <regex> Library (Regular Expressions)


    The <regex> library in C++ provides a powerful way to perform pattern matching
    using regular expressions. Here’s an example of how you can use it:


    #include <iostream>


    #include <regex>


    int main() {


        std::string input = "Hello, World!";


        std::regex pattern("W[a-z]+");  // Regular expression pattern


        if (std::regex_search(input, pattern)) {


            std::cout << "Pattern matched!" << std::endl;


        } else {


            std::cout << "Pattern not found." << std::endl;


        }


        return 0;


    }


    In this example, we’re searching for the pattern “W[a-z]+” in the input string
    “Hello, World!”. The pattern matches any word that starts with ‘W’ and is followed
    by one or more lowercase letters. The std::regex_search function returns true
    if the pattern is found in the input string.


    You can use various regular expression features like character classes, quantifiers,
    anchors, etc., to define more complex patterns. The <regex> library provides many
    functions and classes for regular expressions, allowing you to perform search,
    match, replace operations, and more.


    # Option 2: Implementing a Pattern Matching Algorithm


    If you prefer to implement your own pattern matching algorithm, there are several
    approaches you can take. One common algorithm is the wildcard matching algorithm,
    which uses wildcard characters like ‘*’ and ‘?’ to match patterns. Here’s an example
    implementation:


    #include <iostream>


    bool wildcardMatch(const char* str, const char* pattern) {


        // Base cases


        if (*str == ''\0'' && *pattern == ''\0'') {


            return true;  // Both strings reached the end


        }


        if (*str == ''\0'' || *pattern == ''\0'') {


            return false;  // One string reached the end, but not the other


        }


        // Recursive cases


        if (*pattern == ''*'') {


            // Match zero or more characters


            return wildcardMatch(str + 1, pattern) || wildcardMatch(str, pattern +
    1);


        }


        if (*pattern == ''?'' || *str == *pattern) {


            // Match single character or exact match


            return wildcardMatch(str + 1, pattern + 1);


        }


        return false;  // No match


    }


    int main() {


        const char* input = "Hello, World!";


        const char* pattern = "W*";


        if (wildcardMatch(input, pattern)) {


            std::cout << "Pattern matched!" << std::endl;


        } else {


            std::cout << "Pattern not found." << std::endl;


