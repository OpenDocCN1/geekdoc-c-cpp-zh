- fmt: "\nTo calculate the length of a given string in C++, you can use the `length()`\
    \ or `size()` member function of the `std::string` class. Both functions return\
    \ the number of characters in the string.\n\nHere’s an example program that demonstrates\
    \ how to use the `length()` member function:\n\n```cpp\n#include <iostream>\n\
    #include <string>\n\nint main() {\n    std::string str;\n    std::cout << \"Enter\
    \ a string: \";\n    std::getline(std::cin, str);\n    // Calculate the length\
    \ using length() function\n    int length = str.length();\n    std::cout << \"\
    Length of the string is: \" << length << std::endl;\n    return 0;\n}\n```\n\n\
    In this program, we start by declaring a `std::string` variable named `str`. We\
    \ then prompt the user to enter a string using `std::getline()` to handle spaces\
    \ and special characters properly.\n\nNext, we calculate the length of the string\
    \ by calling `length()` on the `str` object and assign the result to the `length`\
    \ variable.\n\nFinally, we print the length of the string using `std::cout`. The\
    \ `std::endl` is used to insert a newline character after the output.\n\nYou can\
    \ use a similar approach with the `size()` member function. Both `length()` and\
    \ `size()` functions perform the same task and return the same value, so you can\
    \ choose either one based on your preference.\n\nRemember to include the necessary\
    \ header files `iostream` and `string` for input/output operations and string\
    \ handling, respectively.\n\n# String Concatenation\n\nIn C++, you can concatenate\
    \ two strings using either the `+` operator or the `append()` member function\
    \ of the string class. Here’s an example program that demonstrates both approaches:\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
    \ str1 = \"Hello\";\n    std::string str2 = \" world\";\n    // Using the + operator\n\
    \    std::string result = str1 + str2;\n    std::cout << \"Using + operator: \"\
    \ << result << std::endl;\n    // Using the append() member function\n    std::string\
    \ result2 = str1;\n    result2.append(str2);\n    std::cout << \"Using append():\
    \ \" << result2 << std::endl;\n    return 0;\n}\n```\n\nIn this program, we have\
    \ two strings: `str1` and `str2`. We want to concatenate them to form a single\
    \ string.\n\n### Using the `+` operator:\n- We can use the `+` operator to concatenate\
    \ `str1` and `str2` directly. This operator performs string concatenation when\
    \ used with `std::string` objects. The result is stored in the `result` variable.\n\
    \n### Using the `append()` member function:\n- The `std::string` class provides\
    \ the `append()` member function, which concatenates one string with another.\n\
    - To use `append()`, we create a new string called `result2` and initialize it\
    \ with `str1`.\n- We then call the `append()` function on `result2` and pass `str2`\
    \ as the argument. This appends `str2` to the end of `result2`.\n\nBoth methods\
