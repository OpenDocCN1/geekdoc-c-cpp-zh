    # String Remove Duplicate Letters


    Here’s an example program in C++ that removes duplicate letters from a given string
    and returns the result in lexicographical order using a stack:


    #include <iostream>


    #include <stack>


    #include <vector>


    #include <algorithm>


    std::string removeDuplicateLetters(const std::string& input) {


        std::stack<char> stk;


        std::vector<bool> visited(26, false); // To keep track of visited characters


        std::vector<int> count(26, 0); // To count the frequency of each character


        // Count the frequency of each character in the input string


        for (char ch : input) {


            count[ch - ''a'']++;


        }


        for (char ch : input) {


            count[ch - ''a'']--; // Decrement the frequency of the current character


            if (visited[ch - ''a'']) {


                continue; // Skip if the character is already visited


            }


            while (!stk.empty() && ch < stk.top() && count[stk.top() - ''a''] > 0)
    {


                visited[stk.top() - ''a''] = false;


                stk.pop();


            }


            stk.push(ch);


            visited[ch - ''a''] = true;


        }


        std::string result;


        while (!stk.empty()) {


            result.push_back(stk.top());


            stk.pop();


        }


        // Reverse the string to get the correct order


        std::reverse(result.begin(), result.end());


        return result;


    }


    int main() {


        std::string input = "abracadabra";


        std::string result = removeDuplicateLetters(input);


        std::cout << "Result: " << result << std::endl;


        return 0;


    }


    Explanation:


    1.  We use a stack (std::stack<char> stk) to store the characters in the desired
    order. We also use a vector visited to keep track of visited characters and another
    vector count to count the frequency of each character in the input string.


    2.  We iterate over each character in the input string and decrement its frequency
    in the count vector.


    3.  If the character is already visited, we skip it.


    4.  If the character is smaller than the top of the stack (stk.top()), and there
    are more occurrences of the top of the stack character (count[stk.top() - ‘a’]
    > 0), we pop the top of the stack until these conditions are no longer true. This
    ensures that we maintain the lexicographical order in the stack.


    5.  After the loop, the stack contains the characters in the desired order.


    6.  We construct the result string by popping characters from the stack and appending
    them to the result.


    7.  Finally, we reverse the result string to obtain the lexicographically sorted
    string.


    8.  In the main function, we test the removeDuplicateLetters function with an
    example input string (“abracadabra”) and print the result.


    The expected output for the given example input is:


    Result: abcd


    The program removes duplicate letters from the input string (“abracadabra”) and
    returns the result in lexicographical order (“abcd”).


    # String Minimum Window Substring


    The problem of finding the minimum window substring can be efficiently solved
    using the two-pointer approach and a sliding window. Here’s an explanation of
    how to implement this solution in C++:


    #include <iostream>


    #include <unordered_map>


    using namespace std;


    string minWindowSubstring(string s, string t) {


        // Create a character frequency map for string t


        unordered_map<char, int> targetFreq;


        for (char c : t) {


            targetFreq[c]++;


        }


        int requiredCount = t.length();  // Number of unique characters in t


        int minWindowSize = INT_MAX;    // Minimum window size found so far


        int left = 0, right = 0;        // Pointers for the sliding window


        int minWindowStart = 0;         // Start index of the minimum window substring


        unordered_map<char, int> windowFreq;  // Character frequency map for the current
    window


        while (right < s.length()) {


            // Expand the window by moving the right pointer


            char currentChar = s[right];


            windowFreq[currentChar]++;


            // If the current character is in string t and its frequency is satisfied,
    decrease the required count


            if (targetFreq.find(currentChar) != targetFreq.end() && windowFreq[currentChar]
    <= targetFreq[currentChar]) {


                requiredCount--;


            }


            // If all characters in t are found in the current window, try to minimize
    the window size


            while (requiredCount == 0) {


                // Update the minimum window substring if a smaller window is found


                if (right - left + 1 < minWindowSize) {


                    minWindowSize = right - left + 1;


                    minWindowStart = left;


                }


                // Shrink the window by moving the left pointer


                char leftChar = s[left];


                windowFreq[leftChar]--;


                if (targetFreq.find(leftChar) != targetFreq.end() && windowFreq[leftChar]
    < targetFreq[leftChar]) {


                    requiredCount++;


                }


                left++;


            }


            right++;


        }


        // Return the minimum window substring if found, otherwise return an empty
    string


        if (minWindowSize != INT_MAX) {


            return s.substr(minWindowStart, minWindowSize);


        } else {


            return "";


        }


    }


    int main() {


        string s = "ADOBECODEBANC";


        string t = "ABC";


        string minWindow = minWindowSubstring(s, t);


        cout << "Minimum window substring: " << minWindow << endl;


        return 0;


    }


    In this program, we use two pointers, left and right, to create a sliding window
    over the string s. We maintain two frequency maps: targetFreq for characters in
    string t, and windowFreq for characters in the current window.


    We start by expanding the window by moving the right pointer. If the character
    at right is present in targetFreq, we update windowFreq and check if its frequency
    is satisfied. If the frequency is satisfied, we decrease the requiredCount (number
    of unique characters in t) since we found a required character.


    Once we find all characters from t in the window, we try to minimize the window
    size by moving the left pointer. We update the minimum window substring if a smaller
    window is found. Then, we shrink the window by moving left, update windowFreq,
    and check if the removed character affects the requiredCount.


    We repeat this process until we reach the end of string s. Finally, we return
    the minimum window substring if found, otherwise an empty string.


    In the example given, the output would be: “BANC”, as it is the minimum window
    substring of “ADOBECODEBANC” that contains all characters from “ABC”.


