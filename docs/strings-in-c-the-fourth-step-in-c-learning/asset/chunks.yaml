    Here’s an example program in C++ that calculates the minimum number of operations
    required to convert one string into another using dynamic programming:


    #include <iostream>


    #include <vector>


    #include <algorithm>


    int minDistance(const std::string& word1, const std::string& word2) {


        int m = word1.length();


        int n = word2.length();


        // Create a 2D vector to store the minimum distances


        std::vector<std::vector<int>> dp(m + 1, std::vector<int>(n + 1, 0));


        // Initialize the base cases


        for (int i = 0; i <= m; i++) {


            dp[i][0] = i;


        }


        for (int j = 0; j <= n; j++) {


            dp[0][j] = j;


        }


        // Calculate the minimum distance


        for (int i = 1; i <= m; i++) {


            for (int j = 1; j <= n; j++) {


                if (word1[i - 1] == word2[j - 1]) {


                    dp[i][j] = dp[i - 1][j - 1];


                } else {


                    dp[i][j] = 1 + std::min({dp[i - 1][j], dp[i][j - 1], dp[i - 1][j
    - 1]});


                }


            }


        }


        // Return the minimum distance


        return dp[m][n];


    }


