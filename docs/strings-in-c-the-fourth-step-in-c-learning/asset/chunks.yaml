    #include <iostream>


    #include <string>


    #include <vector>


    std::string convertToZigzag(const std::string& str, int numRows) {


        if (numRows <= 1 || numRows >= str.length()) {


            return str;


        }


        std::vector<std::string> rows(numRows, "");


        int currentRow = 0;


        bool goingDown = false;


        for (char c : str) {


            rows[currentRow] += c;


            if (currentRow == 0 || currentRow == numRows - 1) {


                goingDown = !goingDown;


            }


            currentRow += goingDown ? 1 : -1;


        }


        std::string result;


        for (const std::string& row : rows) {


            result += row;


        }


        return result;


    }


    int main() {


        std::string input;


        int numRows;


        std::cout << "Enter the string: ";


        std::cin >> input;


        std::cout << "Enter the number of rows: ";


        std::cin >> numRows;


        std::string zigzag = convertToZigzag(input, numRows);


        std::cout << "Zigzag conversion: " << zigzag << std::endl;


        return 0;


    }


    Let’s go through the code step by step:


    1.  The convertToZigzag function takes two parameters: the input string str and
    the number of rows numRows in the zigzag pattern. It returns the zigzag converted
    string.


    2.  In the main function, we prompt the user to enter the input string and the
    number of rows.


    3.  The convertToZigzag function first performs some checks. If the number of
    rows is less than or equal to 1, or greater than or equal to the length of the
    input string, we can’t form a zigzag pattern, so we simply return the original
    string.


    4.  We create a vector of strings called rows, where each string represents a
    row in the zigzag pattern. The vector is initialized with numRows empty strings.


    5.  We maintain two variables: currentRow to keep track of the current row we
    are processing, and goingDown to indicate whether we are moving down the pattern
    or up.


    6.  We iterate through each character c in the input string. For each character,
    we add it to the current row by appending it to the string at the currentRow index
    in the rows vector.


    7.  We check if we have reached the topmost or bottommost row. If so, we reverse
    the direction by toggling the value of goingDown.


    8.  We update the currentRow variable accordingly. If goingDown is true, we increment
    currentRow by 1; otherwise, we decrement it by 1.


    9.  After processing all the characters, we concatenate the strings in the rows
