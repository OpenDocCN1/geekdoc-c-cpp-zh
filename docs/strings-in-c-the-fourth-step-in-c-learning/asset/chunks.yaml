    \ `findLongestWord` 函数。最后，它返回找到的最长拼接单词。\n\n# 字符串转整数 (Atoi)\n\n这是一个 C++ 示例程序，它可以将给定的字符串转换为整数，同时处理前导空格、可选符号和整数溢出：\n\
    \n```cpp\n#include <iostream>\n#include <string>\n#include <climits> // 用于 INT_MAX\
