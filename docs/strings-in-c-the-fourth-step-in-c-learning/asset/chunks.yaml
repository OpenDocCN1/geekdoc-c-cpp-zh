  raw: 'To find the longest word formed by concatenating other words from a given
    list of words, you can use recursion and hashing in C++. Here’s an explanation
    of how to approach this problem:


    1.  Build a Hash Set: Create a hash set to store all the words from the given
    list. This step helps in efficient lookup and retrieval of words during the recursion
    process.


    2.  Sort the Words: Sort the words in the list based on their length in descending
    order. This step ensures that we start the recursion with the longest words, increasing
    the chances of finding a longer concatenated word.


    3.  Define a Recursive Function: Create a recursive function, let’s say findLongestWord,
    that takes two parameters: the current word being evaluated and the hash set of
    words. Initially, the current word is an empty string.


    4.  Base Case: The base case of the recursion is when the current word is found
    in the hash set (indicating that it’s a valid word from the given list) and it
    is not an empty string. In this case, we return the current word.


    5.  Recursive Case: In the recursive case, we iterate over the characters of the
    current word. We split the word into two parts at each character position and
    check if both parts are valid words present in the hash set. If they are, we recursively
    call the findLongestWord function on the second part of the word. We compare the
    lengths of the current longest word found so far with the longest word obtained
    from the recursive call and update accordingly.


    6.  Iterate through the Sorted Words: Finally, iterate through the sorted list
    of words and call the findLongestWord function on each word, passing in the hash
    set. After the iteration, you will have the longest word formed by concatenating
    other words.


    Here’s a sample implementation in C++:


    #include <iostream>


    #include <unordered_set>


    #include <vector>


    #include <algorithm>


    using namespace std;


    bool compareLength(const string& a, const string& b) {


        return a.length() > b.length();


    }


    string findLongestWord(const string& current, unordered_set<string>& wordSet)
    {


        if (!current.empty() && wordSet.find(current) != wordSet.end())


            return current;


        string longestWord;


        for (int i = 0; i < current.length(); i++) {


            string prefix = current.substr(0, i + 1);


            if (wordSet.find(prefix) != wordSet.end()) {


                string suffix = current.substr(i + 1);


                string longestSuffix = findLongestWord(suffix, wordSet);


                if (longestSuffix.length() > longestWord.length())


                    longestWord = longestSuffix;


            }


        }


        return longestWord;


    }


    string findLongestConcatenatedWord(vector<string>& words) {


        unordered_set<string> wordSet(words.begin(), words.end());


        sort(words.begin(), words.end(), compareLength);


        for (const string& word : words) {


            if (findLongestWord(word, wordSet) == word)


                return word;


        }


        return "";


    }


    int main() {


        vector<string> words = {"cat", "cats", "catsdogcats", "dog", "dogcatsdog",
    "hippopotamuses", "rat", "ratcatsdogcat"};


        string longestConcatenatedWord = findLongestConcatenatedWord(words);


        cout << "Longest concatenated word: " << longestConcatenatedWord << endl;


        return 0;


    }


    In the above example, the findLongestConcatenatedWord function takes a vector
    of words as input, builds a hash set, sorts the words, and then calls the findLongestWord
    function on each word. Finally, it returns the longest concatenated word found.


    # String String to Integer (Atoi)


    Here’s an example program in C++ that converts a given string to an integer while
    handling leading whitespace, optional sign, and integer overflow:


    #include <iostream>


    #include <string>


    #include <climits> // for INT_MAX and INT_MIN


    int myAtoi(const std::string& str) {


        int sign = 1; // default positive sign


        long long result = 0; // using long long to handle integer overflow


        int i = 0;


        // Skip leading whitespace


        while (str[i] == '' '')


            i++;


        // Check optional sign


        if (str[i] == ''-'' || str[i] == ''+'') {


            sign = (str[i] == ''-'') ? -1 : 1;


            i++;


        }


        // Convert the remaining digits


        while (isdigit(str[i])) {


            result = result * 10 + (str[i] - ''0'');


            // Check for integer overflow


            if (result * sign > INT_MAX)


                return INT_MAX;


            if (result * sign < INT_MIN)


                return INT_MIN;


            i++;


        }


        return result * sign;


    }


    int main() {


        std::string input;


        std::cout << "Enter a string: ";


        std::getline(std::cin, input);


        int converted = myAtoi(input);


        std::cout << "Converted integer: " << converted << std::endl;


        return 0;


    }


    Explanation:


    1.  The myAtoi function takes a const std::string& as input and returns the converted
    integer.


    2.  It initializes the sign as positive and the result as 0.


    3.  The function then iterates over the string character by character.


    4.  The first while loop skips any leading whitespace in the string.


    5.  If there is an optional sign (‘-‘ or ‘+’) present after the leading whitespace,
    it adjusts the sign accordingly and moves to the next character.


    6.  The second while loop converts the remaining digits by multiplying the result
    by 10 and adding the current digit (obtained by subtracting the ASCII value of
    ‘0’ from the character).


    7.  During the conversion, it checks for integer overflow by comparing the result
    multiplied by the sign with INT_MAX and INT_MIN constants.


    8.  If an overflow is detected, it returns INT_MAX or INT_MIN accordingly.


    9.  Finally, it returns the result multiplied by the sign.


    10.  In the main function, it takes user input using std::getline and passes the
    input to the myAtoi function.


    11.  The converted integer is then printed to the console.


    This implementation uses string manipulation techniques such as iterating over
    characters, checking for specific characters (leading whitespace and optional
    sign), and converting characters to integers. Additionally, it handles integer
    overflow by utilizing a larger data type (long long) to perform the calculation
    and checking against the limits provided by the INT_MAX and INT_MIN constants.


    # String Generate Parentheses


    Here’s an example program in C++ that generates all valid combinations of n pairs
    of parentheses using recursion and backtracking:


    #include <iostream>


    #include <vector>


    #include <string>


    using namespace std;


    void generateParentheses(int leftCount, int rightCount, string current, vector<string>&
    result) {


        // Base case: If we have used up all pairs of parentheses, add the current
    combination to the result.


        if (leftCount == 0 && rightCount == 0) {


            result.push_back(current);


            return;


        }


        // If we have remaining left parentheses, add one and recurse.


        if (leftCount > 0) {


            generateParentheses(leftCount - 1, rightCount, current + "(", result);


        }


        // If we have remaining right parentheses, add one only if it doesn''t violate
    the balanced property.


        if (rightCount > leftCount) {


            generateParentheses(leftCount, rightCount - 1, current + ")", result);


        }


    }


    vector<string> generateParentheses(int n) {


        vector<string> result;


        generateParentheses(n, n, "", result);


        return result;


    }


    int main() {


        int n;


        cout << "Enter the number of pairs of parentheses: ";


        cin >> n;


        vector<string> combinations = generateParentheses(n);


        cout << "Valid combinations of " << n << " pairs of parentheses:" << endl;


        for (const auto& combination : combinations) {


            cout << combination << endl;


        }


        return 0;


    }'
