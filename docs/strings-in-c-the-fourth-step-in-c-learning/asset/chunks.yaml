    # String Permutation


    Recursion is a programming technique where a function calls itself to solve a
    smaller subproblem. Backtracking, on the other hand, is an algorithmic approach
    that involves exploring all possible solutions by making a series of choices and
    undoing them if they lead to a dead end.


    Here’s the program:


    #include <iostream>


    #include <string>


    using namespace std;


    void swap(char& a, char& b) {


        char temp = a;


        a = b;


        b = temp;


    }


    void generatePermutations(string str, int left, int right) {


        if (left == right) {


            cout << str << endl;


        } else {


            for (int i = left; i <= right; i++) {


                swap(str[left], str[i]);


                generatePermutations(str, left + 1, right);


                swap(str[left], str[i]); // backtrack


            }


        }


    }


    void printAllPermutations(string str) {


        int n = str.length();


        generatePermutations(str, 0, n - 1);


    }


    int main() {


        string input;


        cout << "Enter a string: ";


        cin >> input;


        cout << "All permutations of the string are:\n";


        printAllPermutations(input);


        return 0;


    }


