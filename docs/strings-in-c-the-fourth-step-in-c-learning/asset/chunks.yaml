    \ Substring Pattern\n\nHere’s a C++ program that checks if a given string can\
    \ be formed by repeating a substring:\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\n\nbool isRepeatedSubstringPattern(const std::string& str) {\n    int\
    \ len = str.length();\n    // Try all possible substring lengths\n    for (int\
    \ i = 1; i <= len / 2; i++) {\n        if (len % i == 0) {\n            std::string\
    \ substring = str.substr(0, i);\n            std::string repeatedString;\n   \
    \         // Create a repeated string using the substring\n            for (int\
    \ j = 0; j < len / i; j++) {\n                repeatedString += substring;\n \
    \           }\n            // Check if the repeated string matches the input string\n\
    \            if (repeatedString == str) {\n                return true;\n    \
    \        }\n        }\n    }\n    return false;\n}\n\nint main() {\n    std::string\
    \ input;\n    std::cout << \"Enter a string: \";\n    std::cin >> input;\n   \
    \ if (isRepeatedSubstringPattern(input)) {\n        std::cout << \"The string\
    \ can be formed by repeating a substring.\" << std::endl;\n    } else {\n    \
    \    std::cout << \"The string cannot be formed by repeating a substring.\" <<\
    \ std::endl;\n    }\n    return 0;\n}\n```\n\n### Explanation\n\n1. The `isRepeatedSubstringPattern`\
    \ function takes a string `str` as input and returns a boolean indicating whether\
    \ the string can be formed by repeating a substring.\n2. The function starts by\
    \ getting the length of the input string using `str.length()` and stores it in\
    \ the variable `len`.\n3. The function then iterates through all possible substring\
    \ lengths from `1` to `len / 2` (inclusive). We don’t need to check for substrings\
    \ longer than half the length of the input string because it wouldn’t be possible\
    \ to form the input string by repeating a longer substring.\n4. For each substring\
    \ length `i`, the function checks if `len` is divisible by `i` using the modulus\
