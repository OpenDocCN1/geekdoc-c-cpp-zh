    \nA suffix array is an array that contains the starting positions of all suffixes\
    \ of a given string when they are sorted in lexicographic order. It is a simple\
    \ and memory-efficient data structure that can be constructed in $O(n \\log n)$\
    \ time, where $n$ is the length of the input string.\n\nHere’s an outline of the\
    \ algorithm to find the longest repeated substring using suffix arrays:\n\n1.\
    \ Construct the suffix array for the input string. There are efficient algorithms\
    \ available to build a suffix array, such as the `Skew Algorithm` or the `SA-IS`\
    \ algorithm.\n2. Traverse the suffix array and compare adjacent suffixes to find\
    \ the longest common prefix between them. The longest common prefix (`LCP`) between\
    \ two suffixes represents the length of the shared substring between them.\n3.\
    \ Keep track of the maximum `LCP` value encountered during the traversal. Also,\
    \ remember the indices of the corresponding suffixes from the suffix array.\n\
    4. Once the traversal is complete, the longest repeated substring can be obtained\
    \ by taking a substring of the input string using the starting index and the length\
    \ of the longest common prefix.\n\nHere’s a C++ implementation using suffix arrays:\n\
    \n```cpp\n#include <iostream>\n#include <algorithm>\n#include <vector>\n\nusing\
    \ namespace std;\n\n// Structure to store suffix and its index\nstruct Suffix\
    \ {\n    int index;\n    string suffix;\n};\n\n// Comparator function for sorting\
    \ suffixes\nbool compareSuffix(const Suffix& a, const Suffix& b) {\n    return\
    \ a.suffix < b.suffix;\n}\n\n// Construct the suffix array\nvector<int> constructSuffixArray(const\
    \ string& str) {\n    int n = str.length();\n    vector<Suffix> suffixes(n);\n\
    \    // Store suffixes and their indexes\n    for (int i = 0; i < n; i++) {\n\
