    following steps:


    1.  It initializes the count array with all elements set to zero.


    2.  It iterates over each character in the first string and increments the corresponding
    count in the count array.


    3.  It iterates over each character in the second string and decrements the corresponding
    count in the count array.


    4.  Finally, it checks if all elements in the count array are zero. If any element
    is non-zero, it means the strings are not anagrams, and the function returns false.
    Otherwise, it returns true.


    Using character frequency counting is an efficient way to check if two strings
    are anagrams. It has a time complexity of O(n), where n is the length of the strings.
    The program counts the frequency of each character in one string and decreases
    the frequency for each character in the other string. If the strings are anagrams,
    the frequency count for each character will be balanced and result in zeros for
