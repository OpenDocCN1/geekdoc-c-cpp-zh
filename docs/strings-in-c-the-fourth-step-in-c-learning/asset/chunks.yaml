                // Update the result and carry


                result[i + j + 1] = (product % 10) + ''0'';


                carry = product / 10;


            }


            // If there''s any remaining carry, add it to the previous digit


            result[i] = carry + ''0'';


        }


        // Remove leading zeros from the result


        int start = 0;


        while (start < lenRes - 1 && result[start] == ''0'') {


            start++;


