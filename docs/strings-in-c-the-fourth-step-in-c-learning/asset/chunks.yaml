    Modified string: Hell*, W*rld!


    As you can see, all occurrences of the character ‘o’ have been replaced with ‘*‘.


    # String Word Count


    Here’s an example of a C++ program that counts the number of words in a string
    using a loop:


    #include <iostream>


    #include <string>


    using namespace std;


    int countWords(const string& input) {


        int wordCount = 0;


        bool insideWord = false;


        for (char ch : input) {


            if (ch == '' '' || ch == ''\t'' || ch == ''\n'') {


                // If a whitespace character is encountered


                // and we were previously inside a word, it means


                // the word has ended, so we increment the count.


                if (insideWord) {


                    wordCount++;


                    insideWord = false;


                }


            } else {


                // If a non-whitespace character is encountered,


                // we are inside a word.


                insideWord = true;


            }


        }


        // If the last character in the input was a word, we increment the count.


        if (insideWord) {


            wordCount++;


        }


        return wordCount;


    }


    int main() {


        string input;


        cout << "Enter a string: ";


        getline(cin, input);


        int result = countWords(input);


        cout << "Word count: " << result << endl;


        return 0;


    }


    Explanation:


    1.  The countWords function takes a const string& parameter input representing
    the string for which we want to count the words.


    2.  It initializes two variables: wordCount to keep track of the word count, and
    insideWord to indicate whether we are currently inside a word or not.


    3.  The function then iterates through each character ch in the input string using
    a range-based for loop.


    4.  Inside the loop, it checks if ch is a whitespace character (space, tab, or
    newline). If it is, and we were previously inside a word (insideWord == true),
    it means the word has ended, so we increment the wordCount and set insideWord
    to false.


    5.  If ch is a non-whitespace character, we set insideWord to true since we are
    inside a word.


    6.  After the loop, we check if the last character in the input was a word (insideWord
    == true). If it was, we increment the wordCount.


    7.  Finally, the countWords function returns the wordCount.


    8.  In the main function, we prompt the user to enter a string and read it using
    getline to allow spaces in the input.


    9.  We then call the countWords function, passing the input string, and store
    the result in the result variable.


    10.  Finally, we output the word count to the console.


    Note: This implementation assumes that words are separated by spaces, tabs, or
    newline characters. If your definition of a word differs, you can modify the condition
    in the loop accordingly.


