    \    int occurrenceCount = countCharacter(str, character);\n    std::cout << \"\
    The character '\" << character << \"' occurs \" << occurrenceCount << \" times\
    \ in the string.\" << std::endl;\n    return 0;\n}\n```\n\n说明：\n\n1. `countCharacter`\
    \ 函数接收两个参数：`str` 是要计数的字符串，`character` 是要计数的字符。\n2. 函数内部，我们初始化计数器 `count` 为 0。\n\
    3. 我们使用范围的 for 循环遍历字符串中的每个字符 c。\n4. 在循环内部，我们检查 `c` 是否等于 `character`。如果是，则 `count`\
    \ 加。\n5. 遍历完成后，我们返回 `count`。\n6. 在 `main` 函数中，我们提示用户输入字符串并使用 `std::getline` 存储在\
    \ `str` 中。\n7. 然后要求用户输入要计数的字符并存储在 `character` 中。\n8. 接下来，我们调用 `countCharacter(str,\
    \ character)`并将结果存储在变量 `occurrenceCount` 中。\n9. 最后将结果显示给用户。\n\n注意：此程序是区分大小写的。如果你想进行不区分大小的字符计数，可以在比较之前将输入字符串和字符都转换为小写。\n\
    \n# 字符串大写转换\n\n这是一个使用 `<cctype>` 头中的 `toupper()` 函数将给定字符串转换为大写的 C++ 示例程序：\n\n\
    ```cpp\n#include <iostream>\n#include <cctype>\n\nint main() {\n    std::string\
    \ str;\n    // 读取输入字符串\n    std::cout << \"Enter a string: \";\n    std::getline(std::cin,\
    \ str);\n    // 将字符串转换为大写\n    for (char& c : str) {\n        c = std::toupper(c);\n\
    \    }\n    // 输出大写字符串\n    std::cout << \"Uppercase string: \" << str << std::endl;\n\
    \    return 0;\n}\n```\n\n说明：\n\n1. 程序包含了必要的头文件：`<iostream>` 用于输入输出操作，`<cctype>`\
    \ 用于 `toupper()` 函数。\n2. 定义了 `main()` 函数并声明了一个名为 `str` 的 std::string 变量来存储输入字符串。\n\
    3. 使用 `std::cout` 提示用户输入字符串。使用 `std::getline()` 读取整行输入，包括空格。\n4. 使用循环遍历 `str`\
