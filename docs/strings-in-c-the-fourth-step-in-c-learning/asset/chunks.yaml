    of words from a dictionary, you can use dynamic programming or a trie data structure.
    Here’s an explanation of both approaches:


    Dynamic Programming Approach:


    *   Define a boolean array dp of size n+1, where n is the length of the input
    string. dp[i] will be true if the substring from index 0 to i-1 can be segmented
    into words, and false otherwise.


    *   Initialize dp[0] as true since an empty string can always be segmented.


    *   Iterate from i = 1 to n:


    *   For each i, iterate from j = 0 to i-1:


    *   Check if dp[j] is true and the substring from index j to i-1 is present in
    the dictionary. If both conditions are satisfied, set dp[i] to true and break
    out of the loop.


    *   After the iterations, dp[n] will be true if the entire string can be segmented
    into words; otherwise, it will be false.


    Here’s a C++ implementation of this approach:


    #include <iostream>


    #include <unordered_set>


    using namespace std;


    bool wordBreak(string s, unordered_set<string>& dictionary) {


        int n = s.length();


        bool dp[n + 1];


        memset(dp, false, sizeof(dp));


        dp[0] = true;


        for (int i = 1; i <= n; i++) {


            for (int j = 0; j < i; j++) {


                if (dp[j] && dictionary.count(s.substr(j, i - j)) > 0) {


                    dp[i] = true;


                    break;


                }


            }


        }


        return dp[n];


    }


    int main() {


        string s = "leetcode";


        unordered_set<string> dictionary = {"leet", "code"};


        if (wordBreak(s, dictionary))


            cout << "String can be segmented into words.";


        else


            cout << "String cannot be segmented into words.";


        return 0;


    }


    1.  Trie Data Structure Approach:


    *   Build a trie data structure using the words in the dictionary.


    *   Define a boolean array dp of size n+1, where n is the length of the input
    string. dp[i] will be true if the substring from index 0 to i-1 can be segmented
    into words, and false otherwise.


    *   Initialize dp[0] as true since an empty string can always be segmented.


    *   Iterate from i = 1 to n:


    *   For each i, iterate from j = i-1 to 0:


    *   Check if dp[j] is true and the substring from index j to i-1 is present as
    a word in the trie. If both conditions are satisfied, set dp[i] to true and break
    out of the loop.


    *   After the iterations, dp[n] will be true if the entire string can be segmented
    into words; otherwise, it will be false.


    Here’s a C++ implementation of this approach:


    #include <iostream>


    #include <unordered_set>


    using namespace std;


    class TrieNode {


    public:


        bool isEnd;


        TrieNode* children[26];


        TrieNode() {


            isEnd = false;


            memset(children, 0, sizeof(children));


        }


    };


    void insertWord(TrieNode* root, string word) {


        TrieNode* curr = root;


        for (char ch : word) {


            int index = ch - ''a'';


            if (!curr->children[index])


                curr->children[index] = new TrieNode();


            curr = curr->children[index];


        }


        curr->isEnd = true;


    }


    bool wordBreak(string s, unordered_set<string>& dictionary) {


        int n = s.length();


        bool dp[n + 1];


        memset(dp, false, sizeof(dp));


        dp[0] = true;


        TrieNode* root = new TrieNode();


        for (string word : dictionary)


            insertWord(root, word);


