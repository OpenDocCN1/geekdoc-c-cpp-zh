    # String Aliases


    To find all pairs of aliases (anagrams) in a given list of strings in C++, you
    can use either hashing or sorting. Here’s an explanation of how to solve the problem
    using each approach:


    Hashing Approach:


    *   Create a hash table to store the sorted version of each string as the key
    and a list of strings that are anagrams as the value.


    *   Iterate through each string in the list.


    *   Sort the characters of the current string and store it as a sorted string.


    *   Check if the sorted string exists as a key in the hash table.


    *   If it does, add the current string to the list of values for that key.


    *   If it doesn’t, create a new key-value pair in the hash table with the sorted
    string as the key and a new list containing the current string as the value.


    *   Finally, iterate through the hash table and print all the values that have
    more than one string (aliases).


    Here’s an example implementation:


    #include <iostream>


    #include <unordered_map>


    #include <algorithm>


    #include <vector>


    void findAliases(const std::vector<std::string>& strings) {


        std::unordered_map<std::string, std::vector<std::string>> hashTable;


        for (const std::string& str : strings) {


            std::string sortedStr = str;


            std::sort(sortedStr.begin(), sortedStr.end());


            hashTable[sortedStr].push_back(str);


        }


        for (const auto& pair : hashTable) {


            const std::vector<std::string>& aliases = pair.second;


            if (aliases.size() > 1) {


                for (const std::string& alias : aliases) {


                    std::cout << alias << " ";


                }


                std::cout << std::endl;


            }


        }


    }


    int main() {


        std::vector<std::string> strings = {"listen", "silent", "elbow", "below",
    "state", "taste", "C++", "++C"};


        std::cout << "Aliases:\n";


        findAliases(strings);


        return 0;


    }


    Output:


    Aliases:


    listen silent


    elbow below


    state taste


    C++ ++C


    Sorting Approach:


    *   Iterate through each string in the list.


    *   Sort the characters of the current string.


    *   Store the sorted string as a key in a map or hash table and append the current
    string to the corresponding value list.


    *   Finally, iterate through the map or hash table and print all the values that
    have more than one string (aliases).


    Here’s an example implementation:


    #include <iostream>


    #include <unordered_map>


    #include <algorithm>


    #include <vector>


    void findAliases(const std::vector<std::string>& strings) {


        std::unordered_map<std::string, std::vector<std::string>> hashTable;


        for (const std::string& str : strings) {


            std::string sortedStr = str;


            std::sort(sortedStr.begin(), sortedStr.end());


            hashTable[sortedStr].push_back(str);


        }


        for (const auto& pair : hashTable) {


            const std::vector<std::string>& aliases = pair.second;


            if (aliases.size() > 1) {


                for (const std::string& alias : aliases) {


                    std::cout << alias << " ";


                }


                std::cout << std::endl;


            }


        }


    }


    int main() {


        std::vector<std::string> strings = {"listen", "silent", "elbow", "below",
    "state", "taste", "C++", "++C"};


        std::cout << "Aliases:\n";


        findAliases(strings);


        return 0;


    }


    Output:


    Aliases:


    listen silent


    elbow below


    state taste


    C++ ++C


    Both approaches have a time complexity of O(N * M * log M), where N is the number
    of strings and M is the maximum length of a string. The sorting operation takes
    O(M * log M) time, and it is performed for each string in the list.


    # String Zigzag Word Conversion


    Here’s a C++ program that performs zigzag conversion on a given word:


    #include <iostream>


    #include <string>


    #include <vector>


    std::string convertToZigzag(const std::string& word, int numRows) {


        // If numRows is 1 or the word length is less than numRows, return the word
    as it is


        if (numRows == 1 || word.length() <= numRows) {


            return word;


        }


        std::vector<std::string> rows(numRows);  // Create numRows number of rows


        int currentRow = 0;


        bool goingDown = false;


        for (char c : word) {


            rows[currentRow] += c;  // Add character to the current row


            // Check if we need to change the direction


            if (currentRow == 0 || currentRow == numRows - 1) {


                goingDown = !goingDown;


            }


            // Update the current row based on the direction


            currentRow += goingDown ? 1 : -1;


        }


        // Concatenate all the rows to form the zigzag pattern


