    \ member functions of the `std::string` class. Here’s how you can do it:\n\n```cpp\n\
    #include <iostream>\n#include <string>\n\nstd::string trimString(const std::string&\
    \ str) {\n    std::size_t first = str.find_first_not_of(' ');\n    if (first ==\
    \ std::string::npos) // If the string is all whitespace\n        return \"\";\n\
    \    std::size_t last = str.find_last_not_of(' ');\n    return str.substr(first,\
    \ last - first + 1);\n}\n\nint main() {\n    std::string input;\n    std::cout\
    \ << \"Enter a string: \";\n    std::getline(std::cin, input);\n    std::string\
