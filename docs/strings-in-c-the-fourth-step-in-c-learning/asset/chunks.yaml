    # String Anagram Check


    Here’s an example program in C++ that checks if two given strings are anagrams
    using character frequency counting:


    #include <iostream>


    #include <cstring>


    bool areAnagrams(const std::string& str1, const std::string& str2) {


        // Create an array to store the frequency of characters


