    # String Character Removal


    Here’s an example program in C++ that removes all occurrences of a specific character
    from a string using the erase() and remove() member functions of the std::string
    class:


    #include <iostream>


    #include <string>


    #include <algorithm>


    int main() {


        std::string str = "Hello, World!";


        char target = ''o'';


        // Using erase() member function


        for (auto it = str.begin(); it != str.end(); ) {


            if (*it == target) {


                it = str.erase(it); // erase() removes the character and returns an
    iterator to the next position


            } else {


                ++it;


            }


        }


        std::cout << "After erase(): " << str << std::endl;


        // Resetting the string


        str = "Hello, World!";


        // Using remove() and erase() member functions


        str.erase(std::remove(str.begin(), str.end(), target), str.end());


        std::cout << "After remove() and erase(): " << str << std::endl;


        return 0;


    }


