    # String Comparison\n\nHere’s an example of a C++ program that compares two strings\
    \ for equality using both the `==` operator and the `compare()` member function\
    \ of the string class:\n\n```cpp\n#include <iostream>\n#include <string>\n\nint\
    \ main() {\n    std::string str1 = \"Hello\";\n    std::string str2 = \"World\"\
    ;\n    // Using the == operator\n    if (str1 == str2) {\n        std::cout <<\
    \ \"The strings are equal (using == operator)\" << std::endl;\n    } else {\n\
    \        std::cout << \"The strings are not equal (using == operator)\" << std::endl;\n\
    \    }\n    // Using the compare() member function\n    if (str1.compare(str2)\
    \ == 0) {\n        std::cout << \"The strings are equal (using compare() member\
    \ function)\" << std::endl;\n    } else {\n        std::cout << \"The strings\
    \ are not equal (using compare() member function)\" << std::endl;\n    }\n   \
    \ return 0;\n}\n```\n\nIn this program, we have two strings: `str1` and `str2`.\
    \ We compare them for equality using both the `==` operator and the `compare()`\
    \ member function.\n\n- The `==` operator compares the content of the two strings\
    \ character by character and returns `true` if they are equal, and `false` otherwise.\n\
    - The `compare()` member function compares two strings and returns `0` if they\
    \ are equal, a negative value if the first string is lexicographically less than\
    \ the second, and a positive value if it is greater.\n\n# Substring\n\nTo extract\
    \ a substring from a given string in C++, you can use the `substr()` member function\
