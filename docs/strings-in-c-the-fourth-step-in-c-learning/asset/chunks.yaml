    6. 我们通过从栈中弹出字符并将其添加到 `result` 中来构建 `result` 字符串。\n7. 最后，我们反转 `result` 字符串以获得字典序排序的字符串。\n\
    8. 在 `main` 函数中，我们用示例字符串 \"abracadabra\" 测试 `removeDuplicateLetters` 并打印结果。\n\
    给定输入的的预期输出为：Result: abcd\n\n# 字符串最小子串\n\n寻找最小窗口子串的问题可以使用双指针方法和滑动窗口高效地解决。以下是如何在\
    \ C++ 中实现此点的解释：\n\n```cpp\n#include <iostream>\n#include <unordered_map>\n\nusing\
    \ namespace std;\n\nstring minWindow(string s, string t) {\n    //为字符串 t 创建频率映射\n\
    \    unordered_map<char, int> targetFreq;\n    for (char c : t) {\n        targetFreq[c]++;\n\
    \    }\n    int requiredCount = t.length(); // t 中唯一字符的数量\n    int minWindowSize\
    \ = INT_MAX; // 目前为止找到的最小大小\n    int left = 0, right = 0; // 滑动窗口的指针\n    int\
    \ minWindowStart = 0; // 最小窗口的起始索引\n    unordered_map<char, int> windowFreq; //\
    \ 当前窗口的频率映射\n    while (right < s.length()) {\n        // 通过移动右指针来扩大窗口\n     \
    \   char currentChar = s[right];\n        windowFreq[currentChar]++;\n       \
    \ // 如果当前字符在字符串 t 中且频率满足要求，减少所需计数\n        if (targetFreq.find(currentChar) !=\
    \ targetFreq.end() && windowFreq[currentChar] <= targetFreq[currentChar]) {\n\
    \            requiredCount--;\n        }\n        // 如果窗口内包含 t 的所有字符，尝试最小化窗口大小\n\
    \        while (requiredCount == 0) {\n            // 如果发现更小的窗口，更新最小窗口大小\n   \
    \         if (right - left + 1 < minWindowSize) {\n                minWindowSize\
    \ = right - left + 1;\n                minWindowStart = left;\n            }\n\
    \            // 通过移动左指针来缩小窗口\n            char leftChar = s[left];\n         \
    \   windowFreq[leftChar]--;\n            if (targetFreq.find(leftChar) != targetFreq.end()\
    \ && windowFreq[leftChar] < targetFreq[leftChar]) {\n                requiredCount++;\n\
    \            }\n            left++;\n        }\n        right++;\n    }\n    //\
    \ 如果找到则返回最小窗口子串，否则返回空字符串\n    if (minWindowSize != INT_MAX) {\n        return\
    \ s.substr(minWindowStart, minWindowSize);\n    } else {\n        return \"\"\
    ;\n    }\n}\n\nint main() {\n    string s = \"ADOBECODEB\";\n    string t = \"\
    ABC\";\n    string result = minWindow(s, t);\n    cout << \"Result: \" << result\
    \ << endl;\n    return 0;\n}\n```\n"
- fmt: "\n3. Each of the nine `3×3` sub-grids (or boxes) of the grid must contain\
    \ the digits 1-9 without repetition.\n\nHere’s the program that validates the\
    \ Sudoku board:\n\n```cpp\n#include <iostream>\n#include <vector>\n#include <unordered_set>\n\
    \nusing namespace std;\n\nbool isValidSudoku(vector<vector<char>>& board) {\n\
    \    // Check rows\n    for (int row = 0; row < 9; row++) {\n        unordered_set<char>\
    \ rowSet;\n        for (int col = 0; col < 9; col++) {\n            if (board[row][col]\
    \ != '.') {\n                if (rowSet.count(board[row][col]) > 0) {\n      \
    \              return false;  // Duplicate digit found in the row\n          \
    \      }\n                rowSet.insert(board[row][col]);\n            }\n   \
    \     }\n    }\n    // Check columns\n    for (int col = 0; col < 9; col++) {\n\
    \        unordered_set<char> colSet;\n        for (int row = 0; row < 9; row++)\
    \ {\n            if (board[row][col] != '.') {\n                if (colSet.count(board[row][col])\
    \ > 0) {\n                    return false;  // Duplicate digit found in the column\n\
    \                }\n                colSet.insert(board[row][col]);\n        \
    \    }\n        }\n    }\n    // Check sub-grids (3x3 boxes)\n    for (int box\
    \ = 0; box < 9; box++) {\n        unordered_set<char> boxSet;\n        int startRow\
    \ = (box / 3) * 3;\n        int startCol = (box % 3) * 3;\n        for (int row\
    \ = startRow; row < startRow + 3; row++) {\n            for (int col = startCol;\
    \ col < startCol + 3; col++) {\n                if (board[row][col] != '.') {\n\
    \                    if (boxSet.count(board[row][col]) > 0) {\n              \
    \          return false;  // Duplicate digit found in the sub-grid\n         \
    \           }\n                    boxSet.insert(board[row][col]);\n         \
    \       }\n            }\n        }\n    }\n    return true; // Sudoku board is\
    \ valid\n}\n\nint main() {\n    vector<vector<char>> board = {\n        {'5','3','.',\
    \ '.', '.', '.', '.', '.', '.'},\n        {'6',','.',' '9','1','5', '.', '.',\
    \ '.'},\n        {'.','9','8', '.', '.', '.', '.', '.', '.'},\n        {'8', '.',\
    \ '.', '.', '6', '.', '.', '.', '.'},\n        {'4', '.', '.', '8','. '.', '.',\
    \ '.', '1'},\n        {'7', '.', '.', '.', '2', '.', '.', '6'},\n        {'.','6',\
    \ '.', '.', '.', '.', '2','8','.'},\n        {'.', '.', '.', '4','1','9', '.',\
    \ '.', '.'},\n        {'.', '.', '.', '.', '8', '.', '.', '.', '7'}\n    };\n\
    \    if (isValidSudoku(board)) {\n        cout << \"The Sudoku board is valid.\"\
    \ << endl;\n    } else {\n        cout << \"The Sudoku board is not valid.\" <<\
    \ endl;\n    }\n    return 0;\n}\n```\n\n**Explanation:**\n- We use nested loops\
    \ to iterate over each cell of the Sudoku board.\n- For each row, column, and\
    \ sub-grid, we maintain a `unordered_set` (hash set) to keep track of digits encountered\
    \ so far.\n- If we encounter a digit that is not `.`, we check if it already exists\
    \ in the set. If it does, it’s a duplicate digit and the Sudoku board is not valid.\n\
    - If we have iterated over all cells without finding duplicates, we conclude that\
    \ the Sudoku board is valid.\n- In the `main` function, we create a sample Sudoku\
    \ board and call `isValidSudoku` to check its validity. The result is printed\
    \ accordingly.\nNote that the input Sudoku board is represented as a 2D vector\
    \ of characters. Empty cells are denoted by `.`. You can modify the board to test\
    \ different Sudoku boards.\n\n# String Aliases\n\nTo find all pairs of aliases\
    \ (anagrams) in a given list of strings in C++, you can use either hashing or\
    \ sorting. Here’s an explanation of how to solve the problem using each approach:\n\
    \n### Hashing Approach\n- Create a hash table to store the sorted version of each\
    \ string as the key and a list of strings that are anagrams as the value.\n- Iterate\
    \ through each string in the list.\n- Sort the characters of the current string\
    \ and store it as a sorted string.\n- Check if the sorted string exists as a key\
    \ in the hash table.\n- If it does, add the current string to the list of values\
    \ for that key.\n- If it doesn’t, create a new key-value pair in the hash table\
    \ with the sorted string as the key and a new list containing the current string\
    \ as the value.\n- Finally, iterate through the hash table and print all the values\
    \ that have more than one string (aliases).\n\nHere’s an example implementation:\n\
    \n```cpp\n#include <iostream>\n#include <unordered_map>\n#include <algorithm>\n\
    #include <vector>\n\nvoid findAliases(const std::vector<std::string>& strings)\
    \ {\n    std::unordered_map<std::string, std::vector<std::string>> hashTable;\n\
    \    for (const std::string& str : strings) {\n        std::string sortedStr =\
    \ str;\n        std::sort(sortedStr.begin(), sortedStr.end());\n        hashTable[sortedStr].push_back(str);\n\
    \    }\n    for (const auto& pair : hashTable) {\n        const std::vector<std::string>&\
    \ aliases = pair.second;\n        if (aliases.size() > 1) {\n            for (const\
    \ std::string& alias : aliases) {\n                std::cout << alias << \" \"\
    ;\n            }\n            std::cout << std::endl;\n        }\n    }\n}\n\n\
    int main() {\n    std::vector<std::string> strings = {\"listen\", \"silent\",\
    \ \"elbow\", \"below\", \"state\", \"taste\", \"C++\", \"++C\"};\n    std::cout\
    \ << \"Aliases:\\n\";\n    findAliases(strings);\n    return 0;\n}\n```\n\n**Output:**\n\
    ```\nlisten silent \nelbow below \nstate taste \n```\n\n### Sorting Approach\n\
    Both approaches have a time complexity of O(N * M log M), where N is the number\
    \ of strings and M is the maximum length of a string. The sorting operation takes\
    \ O(M log M) time, and it is performed for each string in the list.\n\n# String\
    \ Zigzag Conversion\n\nHere’s a C++ program that performs zigzag conversion on\
    \ a given word:\n\n```cpp\n#include <iostream>\n#include <string>\n#include <vector>\n\
    \nstd::string convertToZigzag(const std::string& word, int numRows) {\n    //\
    \ If numRows is 1 or the word length is less than numRows, return the word as\
    \ it is\n    if (numRows == 1 || word.length() <= numRows) {\n        return word;\n\
    \    }\n    std::vector<std::string> rows(numRows); // Create numRows number of\
    \ rows\n    int currentRow = 0;\n    bool goingDown = false;\n    for (char c\
    \ : word) {\n        rows[currentRow] += c;  // Add character to the current row\n\
    \        // Check if we need to change the direction\n        if (currentRow ==\
    \ 0 || currentRow == numRows - 1) {\n            goingDown = !goingDown;\n   \
    \     }\n        // Update the current row based on the direction\n        currentRow\
    \ += goingDown ? 1 : -1;\n    }\n    // Concatenate all the rows to form the zigzag\
    \ pattern\n    std::string zigzagWord;\n    return zigzagWord;\n}\n```\n"
