  raw: 'To find the longest repeated substring in a given string, you can use either
    suffix arrays or suffix trees. Both data structures can efficiently solve this
    problem. Let’s first explain how to use suffix arrays.


    Suffix Arrays: A suffix array is an array that contains the starting positions
    of all suffixes of a given string when they are sorted in lexicographic order.
    It is a simple and memory-efficient data structure that can be constructed in
    O(n log n) time, where n is the length of the input string.


    Here’s an outline of the algorithm to find the longest repeated substring using
    suffix arrays:


    1.  Construct the suffix array for the input string. There are efficient algorithms
    available to build a suffix array, such as the Skew Algorithm or the SA-IS algorithm.


    2.  Traverse the suffix array and compare adjacent suffixes to find the longest
    common prefix between them. The longest common prefix (LCP) between two suffixes
    represents the length of the shared substring between them.


    3.  Keep track of the maximum LCP value encountered during the traversal. Also,
    remember the indices of the corresponding suffixes from the suffix array.


    4.  Once the traversal is complete, the longest repeated substring can be obtained
    by taking a substring of the input string using the starting index and the length
    of the longest common prefix.


    Here’s a C++ implementation using suffix arrays:


    #include <iostream>


    #include <algorithm>


    #include <vector>


    using namespace std;


    // Structure to store suffix and its index


    struct Suffix {


        int index;


        string suffix;


    };


    // Comparator function for sorting suffixes


    bool compareSuffix(const Suffix& a, const Suffix& b) {


        return a.suffix < b.suffix;


    }


    // Construct the suffix array


    vector<int> constructSuffixArray(const string& str) {


        int n = str.length();


        vector<Suffix> suffixes(n);


        // Store suffixes and their indexes


        for (int i = 0; i < n; i++) {


            suffixes[i].index = i;


            suffixes[i].suffix = str.substr(i);


        }


        // Sort the suffixes


        sort(suffixes.begin(), suffixes.end(), compareSuffix);


        // Store indexes of sorted suffixes


        vector<int> suffixArray(n);


        for (int i = 0; i < n; i++)


            suffixArray[i] = suffixes[i].index;


        return suffixArray;


    }


    // Find the longest repeated substring using suffix array


    string findLongestRepeatedSubstring(const string& str) {


        int n = str.length();


        vector<int> suffixArray = constructSuffixArray(str);


        int maxLength = 0;


        int maxIndex = 0;


        // Traverse the suffix array and find the longest common prefix


        for (int i = 1; i < n; i++) {


            int length = 0;


            int j = suffixArray[i - 1];


            int k = suffixArray[i];


            // Compare characters until a mismatch is found


            while (j < n && k < n && str[j] == str[k]) {


                length++;


                j++;


                k++;


            }


            // Update the maximum length and index


            if (length > maxLength) {


                maxLength = length;


                maxIndex = suffixArray[i - 1];


            }


        }


        // Return the longest repeated substring


        return str.substr(maxIndex, maxLength);


    }


    // Test the implementation


    int main() {


        string input;


        cout << "Enter a string: ";


        cin >> input;


        string longestRepeatedSubstring = findLongestRepeatedSubstring(input);


        if (longestRepeatedSubstring.empty()) {


            cout << "No repeated substring found." << endl;


        } else {


            cout << "Longest repeated substring: " << longestRepeatedSubstring <<
    endl;


        }


        return 0;


    }


    This program prompts the user to enter a string and then finds the longest repeated
    substring using suffix arrays. The result is displayed as output.


    Using suffix trees to solve this problem is another approach, but it involves
