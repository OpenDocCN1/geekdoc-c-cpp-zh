- fmt: "\n5. Within the loop, the `std::toupper()` function is called to convert each\
    \ character to uppercase. The modified character is assigned back to the original\
    \ character in the string.\n\n6. After the loop, the program prints the resulting\
    \ uppercase string using `std::cout`.\n\n7. The program ends by returning `0`\
    \ from the `main()` function, indicating successful execution.\n\nThe `toupper()`\
    \ function from `<cctype>` is used to convert characters to uppercase. It takes\
    \ a character as input and returns the uppercase equivalent of that character\
    \ if it is a lowercase letter. If the input character is already uppercase or\
    \ not a letter, it is returned unchanged. The `toupper()` function is called within\
    \ the loop to convert each character of the string to uppercase.\n\n# String Lowercase\
    \ Conversion\n\nHere’s a C++ program that converts a given string to lowercase\
    \ using the `tolower()` function from the `<cctype>` header:\n\n```cpp\n#include\
    \ <iostream>\n#include <cctype> // Include the <cctype> header for tolower()\n\
    \nstd::string convertToLowercase(const std::string& input) {\n  std::string lowercase;\n\
    \  for (char c : input) {\n    lowercase += std::tolower(c); // Convert each character\
    \ to lowercase\n  }\n  return lowercase;\n}\n\nint main() {\n  std::string input;\n\
    \  std::cout << \"Enter a string: \";\n  std::getline(std::cin, input);\n  std::string\
    \ lowercase = convertToLowercase(input);\n  std::cout << \"Converted string: \"\
    \ << lowercase << std::endl;\n  return 0;\n}\n```\n\nIn this program, we define\
    \ a function `convertToLowercase()` that takes an input string and converts it\
    \ to lowercase using the `tolower()` function. Here’s how the `tolower()` function\
    \ works:\n\n- The `tolower()` function is part of the `<cctype>` header, which\
    \ provides functions for character classification and transformation.\n- `tolower()`\
    \ takes a single argument of type `int` or `unsigned int`, representing the character\
    \ to be converted.\n- It returns an integer value that represents the lowercase\
    \ equivalent of the input character, if it is an uppercase letter. If the input\
    \ character is already lowercase or not an alphabet character, the function returns\
    \ the original character.\n- The `tolower()` function only operates on individual\
    \ characters, so we need to iterate over each character in the input string and\
    \ apply the function to convert them all.\n\nIn the `convertToLowercase()` function,\
    \ we initialize an empty string `lowercase` to store the converted lowercase string.\
    \ Then, we loop over each character `c` in the input string and use `std::tolower(c)`\
    \ to convert it to lowercase. The converted character is then appended to the\
    \ `lowercase` string.\n\nFinally, in the `main()` function, we get the input string\
    \ from the user using `std::getline()`, call the `convertToLowercase()` function,\
    \ and display the converted lowercase string.\n\nNote: The `std::tolower()` function\
    \ handles ASCII characters correctly. If you’re working with non-ASCII characters,\
    \ you may need to use additional techniques or libraries to handle them appropriately.\n\
    \n# String Character Replacement\n\nTo replace all occurrences of a specific character\
    \ in a string with another character in C++, you can utilize the `replace()` member\
    \ function of the `std::string` class. Here’s an example program that demonstrates\
    \ this:\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n  \
    \  std::string str = \"Hello, World!\";\n    char target = 'o';\n    char replacement\
    \ = '*';\n    size_t pos = str.find(target); // Find the first occurrence of the\
    \ target character\n    while (pos != std::string::npos) {\n        str.replace(pos,\
    \ 1, 1, replacement); // Replace 1 character at position 'pos' with 'replacement'\n\
    \        pos = str.find(target, pos + 1); // Find the next occurrence of the target\
    \ character\n    }\n    std::cout << \"Modified string: \" << str << std::endl;\n\
    \    return 0;\n}\n```\n\nIn this program, we have a string `str` containing the\
    \ original string, and we want to replace all occurrences of the character `o`\
    \ with `*`.\n\nFirst, we use the `find()` member function of the `std::string`\
    \ class to locate the first occurrence of the target character `o` in the string.\
    \ If the character is found, `find()` returns the position (index) of the first\
    \ occurrence. If it’s not found, `find()` returns `std::string::npos` (a special\
    \ constant representing “not found”).\n\nNext, we enter a while loop that continues\
    \ until no more occurrences of the target character are found. Inside the loop,\
    \ we use the `replace()` member function of the `std::string` class to replace\
    \ the character at the found position (`pos`) with the replacement character (`*`).\
    \ The `replace()` function takes four arguments: the starting position, the number\
    \ of characters to replace, the new string to replace with, and the length of\
    \ the new string. In this case, we are replacing only one character.\n\nAfter\
    \ replacing the character, we update the `pos` variable by using `find()` again,\
    \ but this time we provide the starting position as `pos + 1` to find the next\
    \ occurrence of the target character. This ensures that we continue searching\
    \ for and replacing all subsequent occurrences.\n\nFinally, we print the modified\
    \ string. When you run this program, the output will be: `Hell*, W*ld!`.\n\n#\
