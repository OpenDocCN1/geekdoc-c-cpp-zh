  \ 函数接收罗马数字字符串作为输入并计算其整数表示。它遍历罗马数字字符串的每个字符。对于每个字符，它从 `romanMap` 获取其整数值，并检查下一个字符是否更大。如果是，则从结果中减去当前值；否则，将当前值加入结果。这是基于罗马数字中较小数字放在较大数字之前时表示减法的规则。\n\
