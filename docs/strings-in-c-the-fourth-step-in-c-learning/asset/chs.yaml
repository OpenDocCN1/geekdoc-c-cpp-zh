  \ & 0xfc) >> 2;\n        char_array_4[1] = ((char_array_3[0] & 0x03) << 4) + ((char_array_3[1]\
  \ & 0xf0) >> 4);\n        char_array_4[2] = ((char_array_3[1] & 0x0f) << 2) + ((char_array_3[2]\
  \ & 0xc0) >> 6);\n        char_array_4[3] = char_array_3[2] & 0x3f;\n        for\
  \ (int k = 0; k < 4; k++) {\n            encoded += base64_chars[char_array_4[k]];\n\
  \        }\n        i = 0;\n    }\n}\nif (i != 0) {\n    for (int j = i; j < 3;\
  \ j++) {\n        char_array_3[j] = '\\0';\n    }\n    char_array_4[0] = (char_array_3[0]\
  \ & 0xfc) >> 2;\n    char_array_4[1] = ((char_array_3[0] & 0x03) << 4) + ((char_array_3[1]\
  \ & 0xf0) >> 4);\n    char_array_4[2] = ((char_array_3[1] & 0x0f) << 2) + ((char_array_3[2]\
