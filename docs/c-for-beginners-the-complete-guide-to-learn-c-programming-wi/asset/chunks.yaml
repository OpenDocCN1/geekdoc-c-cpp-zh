- fmt: "\n# Logical Operators\n\nLogical operators are used a lot in machines. Imagine\
    \ a “not” operator in the security system of a bank. Let’s say locked doors are\
    \ “0”[`false]`], and unlocked doors are “1”. Because the bank should stay secure,\
    \ our default value is “0.” This is called a failed-closed system, because if\
    \ things go wrong the doors will be closed (the default). All signals that go\
    \ to the door are controlled by a “not” signal: if nothing is going on, the doors\
    \ should remain locked, and if there is robbery they should also. Remain locked.\
    \ Doors that open during a robbery will get a “not” signal to fail-close. But\
