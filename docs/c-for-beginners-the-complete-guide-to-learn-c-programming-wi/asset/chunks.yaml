  trans: "\n\n# C++ 编程示例\n\n## While 循环演示\n```cpp\n//打印程序的说明\n\ncout << \"this 程序将编号并打印\
    \ 10 行内容--\";\n\n//当 i 小于 11 时，打印 \"hello. World\"\nwhile (i < 11) {\n    cout\
    \ << \"\\n\\t\" << i << \" hello. World\";\n    i++; //单元计数器 i\n}\n\nreturn 0;\n\
    }\n```\n\n## For 循环演示\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    int main() {\n    //打印程序的说明\n    cout << \"this 程序将编号并打印 10 行内容--\";\n\n    //当\
    \ i 小于 11 时，打印 \"hello. World\"\n    for (int i= 1; i < 11; i++ ) {\n        cout\
    \ << \"\\n\\t\" << i << \" hello. World\";\n    }\n\n    return 0;\n}\n```\n\n\
    ## Do-While 循环演示：展示退出控制循环\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\n    //初始化计数器 i\n    int i = 11;\n\n    //打印程序的说明\n    cout <<\
    \ \"this 程序可能会或可能打印一个 \\\"hello. World\\\"\";\n\n    //当 i 小于 11 时，打印 \"hello.\
    \ World\"\n    do {\n        cout << \"\\n\\t\" << i << \" hello. World\";\n \
    \       i++; //单元计数器 i\n    } while (i < 11);\n\n    return 0;\n}\n```\n\n## 嵌套\
    \ if-else 演示\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    cout << \"this 程序将遍历一个顺序的\"\n         << \"\\n2 到 4 的数字列表，并使用嵌套 if-else\
    \ \"\n         << \"\\n 语句选出最大的。\"\n         << \"\\n 最大的数字:\\n\\t\";\n    if\
    \ ( 2 > 3 )\n        cout << \"2\";\n    else if ( 3 > 4 )\n        cout << \"\
    3\";\n    else\n        cout << \"4\";\n    return 0;\n}\n```\n\n## 嵌套 if-else\
    \ 与嵌套三元运算符比较\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    cout << \"this 程序将遍历一个顺序的\"\n         << \"\\n2 到 4 的数字列表，并使用两种方法选出\"\
    \n         << \"最大的数字：\"\n         << \"\\n 嵌套 if-else 和嵌套三元运算符\"\n         <<\
    \ \"\\n 嵌套 if-else 最大的数字:\\n\\t\";\n    if ( 2 > 3 )\n        cout << \"2\";\n\
    \    else if ( 3 > 4 )\n        cout << \"3\";\n    else\n        cout << \"4\"\
    ;\n    cout <<\"\\n 嵌套三元运算符最大的数字:\\n\\t\";\n    int a = 2 > 3 ? 2 : 3 > 4 ? 3\
    \ : 4;\n    cout<<a;\n    return 0;\n}\n```\n\n## Switch 演示\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\n    //初始化变量\n    int x =\
    \ 2;\n\n    //打印说明\n    cout<< \"this 程序根据 x 打印选项。\\n\"\n         << \"\\n 变量\
    \ x 等于：\" << x\n         << \"\\n\\t\";\n\n    // 程序 switch\n    switch (x) {\n\
    \        case 1:\n            cout << \"选项是 1\";\n            break;\n       \
    \ case 2:\n            cout << \"选项是 2\";\n            break;\n        case 3:\n\
    \            cout << \"选项是 3\";\n            break;\n        default:\n      \
    \      cout << \"程序退出\";\n            break;\n    }\n\n    return 0;\n}\n```\n\
    \n## 函数演示\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// 函数声明\nvoid\
    \ myfunction();\n\n// 主方法\nint main() {\n    myfunction(); // 调用函数\n    return\
    \ 0;\n}\n\n// 函数定义\nvoid myfunction() {\n    cout << \"我刚刚执行了!\";\n}\n```\n\n\
    ## 带参数传递的函数\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// 声明函数\n\
    int max(int x, int y);\n\n// 主\nint main() {\n    int a = 10, b = 20;\n    //\
    \ 调用上述函数查找 'a' 和 'b' 的最大值\n    int m = max(a, b);\n    cout << \"m 是 \" << m;\n\
    \    return 0;\n}\n\n// 定义函数\nint max(int x, int y) {\n    if (x > y)\n      \
    \  return x;\n    else\n        return y;\n}\n```\n\n## 没有函数重载的程序\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint plus(int x, int y) {\n    return x\
    \ + y;\n}\n\ndouble plus(double x, double y) {\n    return x + y;\n}\n\nint main()\
    \ {\n    int my1 = plus(8, 5);\n    double my2 = plus(4.3, 6.2);\n    cout <<\
    \ \"int: \" << my1 << \"\\n\";\n    cout << \"double: \" << my2;\n    return 0;\n\
    }\n```\n\n## 函数重载\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ plus(int x, int y) {\n    return x + y;\n}\n\ndouble plus(double x, double y)\
    \ {\n    return x + y;\n}\n\nint main() {\n    int my1 = plus(8, 5);\n    double\
    \ my2 = plus(4.3, 6.2);\n    cout << \"int: \" << my1 << \"\\n\";\n    cout <<\
    \ \"double: \" << my2;\n    return 0;\n}\n```\n\n## 参考\n- [在 Linux ubuntu 16.04\
    \ 中运行 c,c++ 程序（初学者教程）](https://www.youtube.com/watch?v=a7ny-roht)\n- [15-1134.00—开发者](https://www.geeksforgeeks.org/15-1134.00/)\n\
    - [15-1199.03—管理员](https://www.geeksforgeeks.org/15-1199.03/)\n- [Agarwal, h.\
    \ (2017a, 1 月 13 日).c 和 c++ 中的循环。](https://www.geeksforgeeks.org/loops-in-c-and-cpp/)\n\
    - [Agarwal, h. (2017b, 5 月 16 日).设置 c++ 环境。](https://www.geeksforgeeks.org/setting-c-development-environment/)\n\
    - [Awasthi, s. (n.d.).c/c++ 中的 switch 语句—geeksforgeeks。](https://www.geeksforgeeks.org/switch-statement-cc/)\n\
    - [Bluefish 编辑器：特性。(n.d.).](http://bluefish.office.nl/features.html)\n- [C++ |\
    \ 嵌套三元运算符。(2018, 10 月 15 日)](https://www.geeksforgeeks.org/c-nested-ternary-operator/)\n\
    - [C++ 代码 [粘贴站点]。(2015, 12 月 5 日)](https://pastebin.com/f7kkzvyf)\n- [C++ 函数重载。(n.d.).](https://www.w3schools.com/cpp/cpp_function_overloading.asp)\n\
    \n"
