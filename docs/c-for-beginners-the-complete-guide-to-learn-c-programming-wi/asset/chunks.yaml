    ## Introduction

    This book is fit for beginners and for coders who are interested in getting into
    Backend programming. Although c++ is sometimes portrayed as a specter of days
    past, the language is still with us and it continues to be behind some of the
    biggest technologies we use today–not mentioning its big imprint in the gaming
    world. Its power and versatility continue to make it one of the most important
    languages of our time. It is not going anywhere and learning it will expand your
    horizons.


    C++ is often utilized as a backend language for big data because of its little
    processing overhead. Companies like spotify, adobe, youtube, and amazon power
    their backend with c++, and you will soon see why.


    C++ is also behind powerful gaming engines. Gaming engines allow programmers to
    build a game without coding everything from scratch and to effectively render
    content. The unity game engine and the unreal engine are examples of gaming engines
    that run on c++.


    C++ is a beautiful, efficient language because of the favorable power/hardware
    ratio: it uses little hardware for the amount of power it gives us. This is why
    those who learn it love it.


    In this book we will cover the following topics:

    * Programming terminology and principles in programming

    * Setting up a c++ environment

    * Getting started: syntax, data types, and variables

    * Power of c++: operations, loops, switches, and decision making

    * Creating custom functions in c++


    You will also find a useful glossary at the end so that you can use the book as
    a reference once you get cracking.


    ## Chapter 1: setting up a c++ development environment

    At its most basic, programming is writing a list of instructions in code that
    the machine can understand. The code resides in executables files. These files
    come with file extensions that tell a compiler what language is in the file. These
    extensions are the suffixes you often see at the end of the file, like `.js`.
    `.cpp` or `.hpp`.


    To write code and save it in an executable file you need the following things:

    1. A text editor: this will allow you to write and edit the code.

    2. A language compiler: this program takes the code you have written and translates
    it into machine language that your computer can understand and follow.


    All programming languages work like this except html, css, and javascript - these
    programs are interpreted and executed by the browser (“introduction,” n.d.). This
    means browser languages like javascript are software-based, while c++ is compiled
    and then run directly on your machine, not in a software environment.


    This means c++ is an assembly language. Assembly languages are low-level programming
    languages that need a compiler so they can run on a machine (lithmee, 2018). In
    this context, the word low-level does not carry a bad connotation; it is descriptive,
    meaning that the language is closer to the machine or just a step away from it.


    As you can probably guess, c++ is a general-purpose language that can run almost
    anywhere. This means it can be assembled and compiled in several different ways.
    This will largely depend on your operating system and the creation utilities you
    are using.


    Our c++ exercises will be compiled on an online ide. Ide stands for integrated
    development environment and it is used to edit and compile code. I bet that description
    sounds familiar. Yes, an ide is an example of a text editor, but unlike a plain
    text editor, it has extra features that are important to the programming process.
    An ide can do things like compile code, debug code, highlight code, warn you of
    syntax errors, and more.


    ![image44.png](images/00001.jpeg)

    Geeks for geeks ide: a web-based program compiler


    This ide can be found at [https://ide.geeksforgeeks.org/](https://ide.geeksforgeeks.org/)
    and has several programming languages. We will be focusing on c++. This ide has
    many coding utilities: a tabbed working space, an input box, and a code manager.
    This code manager includes the two bottom buttons highlighted on the left. These
    code manager buttons allow you to download and upload code as files with their
    corresponding file extension. This ide also allows you to run and generate a url.
    We’ll be using these urls for our lessons.


    In this book, we will use a geeks for geeks web-based ide, but you should learn
    to set up a local ide. For the majority of your programming career, that is where
    you will be working. Plus, you can customize the ide to fit your needs and spruce
    up your code.


    ### Setting up your text editor

    Ide environments that are focused on programming always have a text editor and
    a compiler within them. Non-ide environments separate compilers and plain text
    editors. The text editor serves as a programming interface in non-ide setups;
    this simply means the text editor will be the place you tinker with the code.


    ![Text Box 56](images/00002.jpeg)

    When looking for a text editor, you need one with syntax highlighting and indenting
    as all programming languages follow their syntax. This is because you want to
    be able to read your code easily and you want collaborators to be able to do so
    too. These text editors help by improving readability. This is especially important
    because coding is no longer and has never been a solitary task. There is no one-man
    genius like in the movies.

