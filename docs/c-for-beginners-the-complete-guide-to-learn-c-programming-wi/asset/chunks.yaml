    Github and pastebin are code aggregators that have syntax highlighting add-ons
    enabled. Github will allow you to host your entire project on their site, while
    pastebin only allows code snippets. On these platforms, you can save code in a
    variety of languages.


    They are very useful to programmers because they allow programmers to share code,
    collaborate, test, and so forth. Learning how to deploy a project to Github is
    one of the most important things in programming because it has become so standardized.
    So, maintaining a github profile has also become important, as it holds all the
    projects you are working on, have worked on, and your activity (peshev, 2017).
    To a potential employer or collaborator, this information is invaluable.


    ![image34.png](images/00003.jpeg)


    ## C++ code syntax example


    This is a screenshot from paste bin with syntax highlighting enabled [(“c++ code,”
    2015)](https://www.zotero.org/google-docs/?MBrR1L). Syntax highlighting and tabbed
    spacing help with making the code more comprehensible. All text editors with syntax
    highlighting will use this scheme: libraries in green, and functions, data types,
    and data in blue. Strings will show up as red.


    When you are working locally you will not have luxuries like these readily available.
    The first text editor you will find on your system if you are using windows is
    notepad. Wordpad is another one that has more gui features. What you will notice
    as you open these programs is how plain and boring they are. They are like word
    but worse, because they shouldn’t be simple word processors if writing efficient,
    elegant code is important to us. Their word processor-like aspects make them more
    suitable for writing words in them, not code, although you can code in them.


    ![image7.png](images/00004.jpeg)


    ## Side-by-side comparison of windows’ notepad utility and wordpad utility


    This is a screenshot that features two of windows’ built-in utilities, notepad
    on the left and wordpad on the right. Wordpad has more microsoft suite gui features
    that may be more recognizable to you, including microsoft''s quick access bar
    located above the highlighted "file" tab. Notepad is very barebones in comparison.
    Both utilities, unlike word processors, allow you to save in different file extensions.
    However, wordpad is more similar to a word processor than notepad, saving files
    in rich text format (.rtf). Wordpad will warn you that you will lose formatting
    if you save in an extension other than rich text format.


    What makes notepad and wordpad unique is that they can save files in a variety
    of file extensions, while word processors cannot. File extensions are important
    because they tell the compiler how to interpret what is written in the file, and
    that leads to the machine having a set of instructions it can understand and execute.


    Despite their abilities, these two programs lack crucial text editor features
    like syntax highlighting. You might think this is no big deal, but it is; the
    same words in code can mean different things because of how and when they appear,
    so. highlighting helps us distinguish what they refer to. So. if everything is
    plain, black and white, you have to work harder to figure out what a piece of
    code refers to. It sounds complex now, but once you code this will become obvious
    and necessary.


    Notepad++, not to be confused with windows’ notepad, has highlighting features
    but you will have to activate them like so:


    ![image1.png](images/00005.jpeg)


    ### Screenshot of notepad++ with c++ syntax


    Notepad is free and, as the name suggests, was programmed in c++. This screenshot
    illustrates how to enable language. C++ syntax can specifically be enabled by
    going to `Language` > navigating to `C++`. Notepad++ is only available on the
    windows platform (.exe).


    Blue is a more advanced text editor that comes with more features (“blue editor
    features”). Unlike notepad++, blue is available on multiple platforms other than
    windows. But I would not recommend blue for beginners because it has a lot of
    features that can be overwhelming to a beginner. If you are not new to programming
    you can give it a shot; you will find it has many of the gui features typical
    of an ide editor. Once in the text editor, you must select a compiler. Let me
    show you you would set up your local environment on three platforms: windows,
    linux, and mac. All you need to do is install an ide. Just remember it has to
    have a text editor and a compiler within it. Codeblocks is a useful, open-source
    ide made for c++ and it easily fits with a variety of compilers including microsoft''s
    visual++. Installing codeblock is easy. You just have to go to their downloads
    page at [http://www.codeblocks.org/downloads/26](http://www.codeblocks.org/downloads/26)
    and select the latest version.


    ![image13.png](images/00006.jpeg)


    ### Codeblocks download page


    As of this writing, codeblocks has version 20.03 for windows and linux distributions.
    The page also includes notes for installation. Once the program is installed,
    you are set. You can use it to write c++ programs. To do so you have to follow
    three steps: creating a file, building the program, and running the program. Creating
    a new file is a bit more nuanced. Here is what you have to do:


    * Go to `File` > `new`

    * Select `create an empty file` and input your code

    * Save the file with a `.cpp` extension


    And, needless to say, you have to build a program before you can run it. You can
    do this by going to `Build` > `build and run` in the menu.


    ![image20.png](images/00007.jpeg)


    ### Screenshot of “hello world” in codeblocks


    This is a live screenshot of our "hello world" program in code blocks. After this
    program is run, an error shows up in the build messages of the code. codeblocks
    highlights the error on line 6. Given your knowledge of c++ syntax from the earlier
    section, you should see how to repair the code. How can we repair the code?


    Hint: data and functions are supposed to show up in blue. By the way, this program
    is very lightweight for the amount of work it allows you to do. codeblock is available
    on windows and linux, but there is no mac version.


    ## Mac os ide installation and setup


    For mac, you will need to get xcode. It is a free ide software development suite
    for mac. You can get it on the mac app store. Xcode supports a variety of other
    languages like java, python, and ruby.


    It is geared toward developing software for mac operating systems; this can be
    for the tv for apple tv, watches for apple watches, and the iPads for ipad tablets
    (“what’s new in xcode 9,” n.d.). Xcode offers a variety of software development
    kits (sdks) for different mac platforms to help programmers through apple’s proprietary
    programming schemes. SDKs are a set of tools, provided by hardware and software
    vendors, used for developing applications for specific platforms. SDKs allow developers
    to be fully integrated within a development community, like apple’s or android’s.


    Mac uses proprietary compilers that will only work with xcode, so. if you are
    on mac you have little choice but to develop with c++ using xcode.

