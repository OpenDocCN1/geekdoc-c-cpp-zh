    on the right feature the “light-mode” and “dark-mode” views of the same code embedded
    in their articles. These views are more detailed, highlighting comments, functions,
    and distinguishing different statements. For example, data types such as `int`
    are distinguished with a different color from other statements such as `using`.
    Also The embedded views, unlike the ide, distinguish strings from other data.
    This is a perfect example of how syntax highlighting can vary across platforms.
