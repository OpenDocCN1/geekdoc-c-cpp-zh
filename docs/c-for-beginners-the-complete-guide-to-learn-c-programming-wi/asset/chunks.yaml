    This screenshot features a successful run of “hello. World” with the memory used
    to run the program. This ide has light syntax highlighting, focusing mainly on
    comments, statements, and operand data. Compared to Geeksforgeeks’ embedded code
    in their articles, their embedded code is much more detailed [(“writing first
