    ## Logical Operators


    Logical operators add more complexity to relational operators. These are comparable
    to human ideas of "and" or "or". They also have qualities that switch the meaning
    of the relational operator. Logical operators are used in conjunction with relational
    operators to combine two or more conditions to describe a constraint. They make
    us catch a lot more and do a lot more with our conditionals. There are three logical
    operators (jaggi, 2015b):


    “”: the logical “and” operator returns a boolean true when both conditions are
    met and false if they aren’t.


    “![00113.jpeg](images/00113.jpeg)”: the logical “or” operator returns a boolean
    true when one (or both) of the conditions are met, and false if none of the conditions
    are met.


    “![00114.jpeg](images/00114.jpeg)”: the logical “not” operator returns a boolean
    true if the conditions in consideration are not satisfied. If one of the conditions
    is true, then it returns a boolean false.

