    ### `char` 关键字

    数据类型关键字，是 "character”（字符）的缩写，无论大小写如何都存储单个字符。大小为 1 字节。char 值用单引号包围。

    基础数据类型


    ### `cout` 对象

    C++ 编程对象，属于 `<iostream>` 库，允许程序使用 `<<` 打印值和文本。该对象必须定义数据类型，通常为 `std`。

    使用 `cout`


    ### `double` 关键字

    数据类型关键字，用于存储带有 15 位小数的数字。大小为 8 字节。此数据类型可以容更多的小数，更优于数学计算。

    基础数据类型


    ### `else`

    语句用于在伴随的 `if()` 表达式为假时指定代码。else 不能脱离 `if()` 使用。


    ### `endl` 操作符

    输入/输出操作符，输出 `\n` 并刷新输出流。

