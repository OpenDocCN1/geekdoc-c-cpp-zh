    ### `bool` 关键字

    数据类型关键字，是 "boolean”（布尔）的缩写，存储具有两种状态的值：true 或 false。大小为 1 字节。这些值可以使用操作符表示为 "0/1"
    或 "false/true"。

    ## 基础数据类型


    ### `boolalpha/nobalpha` 操作符

    输入/输出操作符，用于在布尔值的 "0/1" 使用和 "false/true" 使用之间切换。

