    \ errors within functions. Now let's turn our attention to Parameter passing.\n\
    \n### Parameter passing\n\nFunctions are scripts that are given to the compiler.\
    \ To complete the task and be useful, these functions need inputs to compute.\
    \ To remind you, these inputs are called arguments or parameters. Programmers\
    \ describe parameters differently based on where they originate or appear. Parameters\
    \ that go into a defined function are called actual parameters. For instance,\
    \ if you have a summing function called `sum(x,y)`, when `main()` passes 2 and\
    \ 3 into the function those parameters are actual parameters. Conversely, `x`\
    \ and `y` are formal parameters because they are variables that the data is going\
    \ to be bound to. This applies to all other parameters before actual parameters\
    \ are passed. There are two ways to pass parameters to functions (“functions in\
    \ c/c++,”\n\n- **Pass by value**: values of actual parameters are copied into\
    \ stored in the function’s formal parameters. Any changes made inside `main()`\
    \ do not impact the actual parameters that were passed.\n- **Pass by reference**:\
    \ both actual and formal parameters refer to the same locations. Therefore, any\
    \ changes made inside the `main()` function will impact the actual parameters\
