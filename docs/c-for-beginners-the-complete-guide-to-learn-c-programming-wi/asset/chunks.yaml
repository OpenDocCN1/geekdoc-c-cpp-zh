- fmt: '

    In addition to programming, we also explored some basic computer science concepts.
    We looked at the behavior of machines and their language. We talked about how
    learning programming is like learning a new language: both have syntax and rules
    that ensure communication is possible. C++ is a back-end server language that
    is used for managing servers that control oceans of data. Unlike high-level languages
    like python, which are more human, c++ wants programmers to be more detailed in
    their code. Each variable must be unique in a function or we will have an error.
    All functions and statements are case sensitive and have specific rules that govern
    them. We have implemented many `if()`…`else` statements and made nested if-else
    statements. We saw that conditional statements like `if()` can be executed without
    the else, but a missing else statement can cause an error if the `condition` is
    false. And just as a missing verb indicates a sentence is incomplete, else statements
    cannot be implemented without an `if()`.


    We saw how computers communicate in binary numbers using logical math. We saw
    bitwise function work at the bit level, completing logical math computations like
    `and`, `or`, and `not`. All the other c++ functions that are object-based must
    be translated by the compiler into machine language. But bitwise functions are
    faster because they skip that step and communicate directly to the machine. They
    are often deployed in competitive programming to make highly agile programs and
    routines. Outside of competitive programming, bitwise functions have some functionality
    in managing big data.


    The challenge with bitwise functions is that they are very difficult for humans
    to understand because they are binary. To see what computers see we had a brief
    computer science lesson on binary and binary math. We made a “byte-sized” stream
    of register with our bitwise routine program and we made dynamic buffers to store
    bits for bitwise computations. Those virtual buffers and registers are how servers
    manage terabytes of data. Think about this; our buffers and registers were all
    one byte long, but a terabyte is ![00211.jpeg](images/00211.jpeg)![00212.jpeg](images/00212.jpeg)![00213.jpeg](images/00213.jpeg)bytes).
    It was serving over 3.25 billion hours of content (“how much data does youtube
    store? - quora,” n.d.). Bitwise functions give these servers the ability to work
    with this load without interruption or massive delays. This is one of the best
    examples of the power of c++ and its ability to handle big complex systems. It
    is a useful language for programmers to learn. If you visualize these data streams
    as arrays of 8 slots, it will be easier for you to rationalize many bitwise operators,
    especially shift operators.


    In addition to binary programming, we worked with different kinds of data and
    explored different aspects of object programming. We did plenty of exercises where
    we dealt with strings, for example. In fact, we used and deployed strings in every
    one of our exercises. We saw that strings are also arrays of data, and can be
    manipulated like objects except in a few ways. Strings have a length, size and
    can be parsed with various objects in the `<string>` library. Think of the copy
    constructor call combination we learned. To parse a container of any type, `vector`
    or array, you need a `for()` loop with an address of operator element. That task
    has a dedicated function in the `<string>` library where all you need is the index
    of the item you are parsing. If there is one thing you should take away from this
    book it is proficiency in handling strings: break out escape sequences, handling
    strings through array indexing, and passing strings to different functions.


    We also learned and discussed functionality and design considerations. We talked,
    for instance, about how and when to use loops. Our security example was best illustrated
    by our control loop example in a system. Banks, as we said, should always have
    their doors locked; most events in the bank require exits and the only time they
    should open it is in fire. The system should keep everything in check, where a
    condition is tested after the routine. Control loops are also useful in other
    areas, like data control. YouTube data corrections as a secondary routine. This
    makes sure the system is always running, not hindered by send requests.


    As c++ is a backend language it has to handle and work with multiple types of
    data. We had a brief discussion about this when we spoke of vector-based images
    as an object and their properties. Photo manipulation software is programmed in
    c++ where aspects like image manipulation take full use of quality, unlike `.png`
    that are arrays of pixels like `.svg` or `.pdf` use containers to describe their
    locations, which has more features in c++ that allows preservation of the image.


    This book is also meant to be reference, so I encourage you to use the glossary
    and index to review pics. The glossary has all the terms bolded and some of the
    code snippets we looked at. It also includes the section where the terms are discussed
    in more detail.


    ### Glossary


    #### Term Definition


    `+`, Binary arithmetic operation that sums two variables. Also used to concatenate
    strings in the `<string>` library operation: string concatenation


    `++`

    Increment operator used to increase the value of an integer by 1. This unary operator
    is often used to increase a variable within a loop. Unary operators


    `--`

    Unary operator that decreases a variable within a loop. This unary operator is
    often used to increase a variable within a loop. Unary operators


    `-`, Arithmetic operator that subtracts one operand from another. Arithmetic operators


    `-`, Unary minus operator that is used to change the sign of a variable or argument.
    Performing a unary operation on a negative integer will make it positive and vice
    versa. Unary operators


    `-=`

    The atomic subtraction used to combine the `-` and `=` operators. This operator
    first subtracts the current value of the variable on the left from the value on
    the right. It then assigns the result to the variable on the left. For example,
    `x-=y` would be a shorter way of writing `x=x-y` without having to use a separate
    arithmetic operator. Assignment operators


    `!`, binary operator. Binary logical “not” operator that returns a boolean true
    if the conditions in consideration are not satisfied. If one of the conditions
    is true, then it returns a boolean false. Logical operators


    `!`,

    Not operator used to reverse the boolean logical state of an operand. For example,
    if a variable `x` has a boolean value of false, `!x` will be true. Unary operators


    `!=`

    “not-equal” operator that also checks whether two given operands are equal or
    not. However, this operator returns a boolean true if the operands are not equal
    and returns false if the operands are equal. Relational operators


    `*`

    Binary operation that multiplies two operands. The order of the operands does
    not matter. Arithmetic operators


    `*=`

