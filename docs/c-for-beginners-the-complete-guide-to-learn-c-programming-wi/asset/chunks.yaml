- fmt: "\nIn the screenshot, a `gnc gcc` is already present. Running the highlighted\
    \ command will install the `gnu gcc` on your system if it isn’t there (patel,\
    \ 2014). The console will prompt you to. Type “y” for it to. Begin the installation.\
    \ You also are offered package management features like the ability of the terminal\
    \ to inform you of outdated or unnecessary packages. It will also suggest commands\
    \ that will make your system more efficient. This explains the popularity of linux\
    \ with programmers; although ready, it allows them to troubleshoot with ease,\
    \ gives them more control, and it is easy to navigate when compared to Guis. This\
    \ is because programmers are more likely to remember a line of code than where\
    \ something resides in the gui.\n\nThe following command will install all the\
    \ libraries required to compile code and eventually run c++:\n\n```\nsudo apt-get\
    \ install build-essential\n```\n\n![image39.png](images/00017.jpeg)\n\n### 1.\
    \ Install gnu gcc in ubuntu console\n\nThis screenshot shows a system with the\
    \ `build-essential` libraries installed and inputting the highlighted installation\
    \ command (patel, 2014). Just as with installing the `gcc`, after using the command\
    \ and finding there is no copy of the `build-essential` libraries in your system,\
    \ it will prompt you to. Install. Type in “y” and the terminal will install libraries.\n\
    \n*   Check the installation with the following command:\n\n```\ng++ --version\n\
    ```\n\nIf all went well it will tell you what version of `gcc` is installed.\n\
    \nBecause linux has a built-in text editor you will have to. Use the following\
    \ command to access the gui for the text editor:\n\n```\ngedit\n```\n\nYou will\
    \ be free to write your program as you see fit. Remember to save the programs\
    \ with the `.cpp` extension so that they will be compiled correctly.\n\n![image52.png](images/00018.jpeg)\n\
    \n#### Gedit in ubuntu\n\nThis screenshot features linux’s built-in text-editor,\
    \ `gedit` ([running c, c++ programs in linux] ubuntu 16.04 (ubuntu tutorial for\
    \ beginners), n.d.). `gedit` is a linux programming text editor utility that has\
    \ syntax highlighting and tabbed spacing features for a diverse array of programming\
    \ languages. Be sure to have “c++” selected from the highlighted dropdown menu.\
    \ You can save your program file in the gui by clicking the “save” button. Be\
    \ sure to list which directory you have your file saved, as you will have to point\
    \ the compiler to that directory to compile and run the code.\n\nTo test and run\
    \ your code you must follow these instructions:\n\n1.  **Lead the terminal to\
    \ the files directory**\n    To do this use this command. Enter it in the directory\
    \ repeatedly until the `.cpp` file is revealed.\n\n    ```\nls\n    ```\n\n2.\
    \  **Compile and test the program file**\n    Use these commands to do so:\n\n\
    \    ![00019.jpeg](images/00019.jpeg)\n\n    If there are any errors this command\
    \ will tell you which line contains the error just like you would expect from\
    \ an ide. Then you can open the program file through `gedit [filename.cpp]` and\
    \ fix the line of code.\n\n3.  **Run the program file**\n    The compiler will\
    \ create an executable file called `test` that will run the program. You can execute\
    \ it by entering `./test` in the terminal.\n\n    ![image32.png](images/00020.jpeg)\n\
    \n    *Testing, compiling and running a .cpp file in ubuntu*\n\n    This screenshot\
    \ features the terminal testing, compiling, and running the example code written\
    \ in `gedit` ([running c, c++ programs in linux] ubuntu 16.04 (ubuntu tutorial\
    \ for beginners), n.d.).\n\nLinux distros are verbose console-based systems and\
    \ most of them can handle programming in any language through the terminal. Learning\
    \ to work in the linux environment is beneficial as it exposes you to server-side\
    \ programming.\n\nNote: the process for installing `gcc` and compiling on cento\
    \ is similar. To install, you instead use “![00021.jpeg](images/00021.jpeg)”.\
    \ This command automatically installs the needed libraries as well. The steps\
    \ for composing, compiling, testing, and running the program are all the same.\n\
    \nCreating your own programming environment helps prepare you for real-world scenarios\
    \ in a way that online coding spaces cannot. In this book, we will be using an\
    \ online ide. This is because everyone will have the same learning environment\
    \ with standardized outputs and interfaces. It simplifies things.\n\n## Chapter\
    \ 2: basics of c++, principles of programming\n\nProgramming languages are like\
    \ any other human language: they have structure, syntax, and rules. It is not\
    \ enough to know the words of another human language. Knowing how to use them\
    \ and how they function in that language is an integral part of communicating\
    \ effectively in that language. Programming languages function the same way, but\
    \ the communication they care about trying to. help is one between man and machine.\
    \ While machines, at least today, can never be as clever and capable as we are,\
    \ there is a lot they can understand at a rate and with an efficacy that is alien\
    \ to us. All programming is a set of instructions. These instructions can be rules,\
    \ they can be actions you want the machine to perform, or something else. But\
    \ all this communication is possible because we follow the rules of a programming\
    \ language.\n\nProgramming rules, or syntax, are a list of delineating symbols\
    \ used to communicate aspects of a program like functions and variables. Syntax\
    \ is important to the compiler because it tells the compiler what to give. Before\
    \ we start, it is worth keeping a few things in mind. Unlike python or high-level\
    \ languages, c++ does not resemble humans quite. High-level languages like `js`,\
    \ `python`, and `c#` are made this way because it makes them easy to read.\n\n\
    ### Principles of programming\n\nC++ has many ways of completing the task. Just\
    \ like human languages, there are many ways of saying the same thing, but some\
    \ ways are best suited for certain occasions and some aren’t. Developers will\
    \ want that because it increases performance of the entire application. that is\
    \ the first principle of programming: complete a task with the least amount of\
    \ functions possible. In most cases, this means using a loop or a switch statement\
    \ in a frugal way.\n\nThe best way to do this is by understanding the nature of\
    \ the problem first and how best implement the solution. In other words, you will\
