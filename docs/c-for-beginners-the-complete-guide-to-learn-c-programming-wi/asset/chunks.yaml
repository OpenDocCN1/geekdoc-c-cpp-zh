    文件下载并安装后，打开 xcode 并点击“create a new xcode project”（创建一个新的项目）图标。然后在初始窗口中选择“new project”。


    ![image12.png](img/00008.jpeg)


    Xcode 初始界面：选择新项目


    这些截图显示的是 8.3.3 版本的 Xcode 构建（patel, 2017）。因此，我们的示例看起来可能与较新的版本有所不同。在编写本文时，最新版本是
    12.1，它主要包含了对各种平台 SDK 的更新（“Xcode,” n.d.）。尽管存在这些差异，这些截图仍将帮助你在更新的版本中找到方向。我们的指令仍然会产生结果。


    完成此操作后，会弹出一个提示窗口，要求你选择模板。该窗口将引导你完成其余的设置。选择 mac 部分，然后进入 application（应用程序）部分；在其中，选择
    command line tool（命令行工具）。


    它看起来像这样：


    ![image6.png](img/00009.jpeg)


    1. 项目选择屏幕：macos > application > command line tool


    Xcode 拥有许多内置代码工具，用于在各种苹果平台上运行程序。因此，为了运行测试程序，你必须选择 macos 以便在你的程序上运行。此外，为了访问 c++
    需要的汇编语言开发，你需要使用 Xcode 的命令行工具。该命令行工具也可以处理 objective-c 和 c 语言。


    选择模板后，指南将提供命令行工具的选项。在这里，你可以为项目命名、添加你的组织名称、使用 bundle identifier（包标识）并选择编程语言。


    ![image49.png](img/00010.jpeg)


    2. 命令行工具选项：language > select c++


    Xcode 的命令行工具可以处理微软的专有语言，如 swift。此程序可以在 mac 编译器中与基于 c 的语言一起运行，包括 c++。默认选择 swift。


    在同一个窗口中，你将被要求添加一个组织标识符（organization identifier）。记住，Xcode 的命令行工具是针对专有 macos 操作系统的编程模板，因此组织标识符用于在苹果数据库中为你的程序创建一个唯一标识：：苹果开发者网站和
    icoud 容器、appstore 中的 itunes connect 门户。这将你的 app 整合到专有的 macos 框架中。


    ![image11.png](img/00011.jpeg)


    3. 命令行工具选项：organization identifier > “cpp”


    组织标识符是一种命名约定，有助于程序员将项目集成到苹果的专有软件开发方案中。在这里，我们使用 `cpp` 作为标识符，它生成 `cpp.hello.world`
    作为我们的 bundle identifier。一旦指定了标识符，指南允许我们继续下一步。


    现在，在你选择的目录中保存你的项目。在左侧面板中，Xcode 能够打开该文件。你必须选择 `main.cpp` 以在 Xcode 中访问你程序的全局 c++
    文件。如果你需要，可以将 cpp 文件上传到目录中并进行编辑。


    ![image40.png](img/00012.jpeg)


    3. Xcode 命令行工具：“main.cpp”


    此截图显示了 ide 风格的 Xcode 命令行工具工作区。它在文本编辑器编辑器中打开了 ![00013.jpeg](img/00013.jpeg)（patel,
    2017）。


    一旦你写了一些代码并想要运行它，请选择 product（产品）并点击 run（运行）。此外，你也可以通过选择按钮来运行和构建程序。


    ![image36.png](img/00014.jpeg)


    4. Xcode 命令行工具：“hello world”构建和运行


    与 code::blocks ide 类似，你必须先构建后运行你的程序。此截图还显示了“hello world”的结果和返回值（patel, 2017）。


    如果你是一个认为自己将来将在苹果设备上工作的程序员，那么在 xcode 中工作和实践是一项很好的投资。例如，苹果在各种消费品和服务（如流媒体服务和设备）方面拥有健康的市场份额。尽管如此，你应该记住
    c++ 主要用作服务器端语言。服务器端编程是控制内容如何传递到 youtube 等动态网站的代码。大多数服务器端编程是在 linux 上完成的。


    ### Linux 编译器安装


    Linux 是一个基于控制台的操作系统，因此它不需要文本编辑器。相反，我们将重点关注安装和设置编程编译器。Mac 和 windows 会自动在 ide 中初始化编译器，但在
    linux 中，需要更亲手操作的方法。你将被要求执行后端初始化。这看起来有很多工作要做，但从大局来看，它允许那些使用 linux 的人员对开发过程拥有完全控制，并释放更多的计算能力。


    因为 linux 是一个使用控制台界面的操作系统，对于初学者或任何习惯 windows 或 mac 的人来说会很奇怪。这是因为用户通常习惯 gui（图形用户界面）。linux
    无 gui 可以释放更多的计算能力用于编程——gui 需要一些计算能力来生成和维护。这就是为什么许多服务器和其他编程环境具有控制台界面。此外，它们中的许多使用
    console。


    linux 发行版（distro）是一种基于 linux 内核的操作系统，使用包管理系统安装额外的软件。以下是安装和初始化编译器的指令。针对 ubuntu，这是一个流行的发行版。注意：许多此类发行版提供了桌面体验。可以考虑
    cento，它基于 red hat 并非免费。红帽 linux (rhel) 用于许多服务器设置且不是免费。然而， cento 使用了它的许多组件，是准备在红帽环境中工作的极佳发行版。

