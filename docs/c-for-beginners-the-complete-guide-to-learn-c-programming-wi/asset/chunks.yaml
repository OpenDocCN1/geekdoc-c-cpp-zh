    状态变化在低级语言中经常被讨论，因为它们非常接近机器语言。低级语言也被称为编译型语言，因为它们会被编译成机器语言。这与 `python` 等高级语言形成对比。如果你还记得，我们提到过高级语言由于内置库的存在，不需要在声明变量时指明其数据类型。例如，`python`
    使用 `python` 环境来识别变量及其数据类型。而在 `c++` 中，变量和数据类型必须经过声明。数据类型告诉编译器如何处理数据。


    当你考虑到数学中的向量时，数据类型就更有意义了；与传达数量的整数不同，向量告诉我们空间的大小和方向。因此，向量与整数是不同的数据类型。此类属性被用于像 photoshop
    这样的软件中，以帮助渲染。


    注意：基于向量的图像可以进行操作而不会丢失图像质量。这是因为像 `.jpeg` 或 `.png` 等文件将图像的像素位置作为整数存储在网格上。而 `svg`
    或 `.pdf` 等矢量文件使用向量来描述其像素位置。因此，当图像放大时，向量会指示颜色应该如何扩展，而普通的图像文件则不会。这就是在处理非矢量图像文件时导致像素化和失真的原因。


    ## 输入和输出：声明变量


    在上一章中，我们在学习如何使用 `cout` 时声明了一些内容。在本节中，我们将查看数据类型的示例以及它们是如何声明的。以下是变量声明示例及其代表的含义（“c++变量”等）。请记住，变量本质上存储的是特定类型的数据：


