    State changes are discussed often in lower-level languages because of how close
    they are to Machine language. Lower-level languages are also called compiled languages
    because they are compiled into Machine language. This is in contrast to High-level
    languages like `python`. If you remember, we spoke of how higher-level languages
    do not need variables to be declared with their data types because of their built-in
    libraries. For instance, `python` uses a `python` environment to recognize variables
    and their data types. In `c++` variables and the data types have to be declared.
    A data type tells the compiler how to treat the data.


    Data types make more sense when you think of vectors in math; unlike integers,
    which communicate amounts, vectors tell us the size and direction of space. Therefore,
    vectors are a different data type than an integer. Properties like these are used
    in software like photoshop to help with rendering.


    Note: vector-based images can be manipulated without losing the quality of the
    image. This is because files like `.jpeg` or `.png` store pixel location of an
    image as integers on a grid. Vector files such as `svg` or `.pdf` use vectors
    to describe their pixel locations. Therefore, when the image is made larger, the
    vectors indicate how the colors should expand while the regular image files do
    not. This is what causes the pixelation and distortion when manipulating non-vector
    image files.


    ## Input and output: declaring variables


    In the previous chapter, we declared some things as we were learning how to use
    `cout`. In this section, we are going to look at examples of data types and how
    they are declared. Below are examples of variable declarations and what they stand
    for (“c++ variables,” etc.). Keep in mind that variables essentially store types
    of data:


    - “![00057.jpeg](images/00057.jpeg)”: keyword is short for “integer” and stores
    whole numbers, without decimals. This keyword includes positive and negative integers.

    - “![00058.jpeg](images/00058.jpeg)”: stores numbers with decimals, both positive
    and negative numbers.

    - “![00059.jpeg](images/00059.jpeg)”: keyword is short for “character” and stores
    single characters regardless of their capitalization. `char` values are single-quoted.

    - “![00060.jpeg](images/00060.jpeg)”: stores text, such as in our "hello World"
    example. `string` values are double-quoted.

    - “![00061.jpeg](images/00061.jpeg)”: keyword is short for “boolean” and stores
    values with two states: true or false. As previously discussed, these values can
    be expressed as either “0/1” or “false/true.”


    In the next section, we will discuss them in detail. Now let us look at examples
    of these. To create a variable you have to assign it a value after the `=` operator.
    Their syntax looks like this:


    ```cpp

    [datatype][variable_name] = [value];

    ```


    Note: each `![00062.jpeg](images/00062.jpeg)` must be unique within your function.
    Otherwise, it will cause an error. Now let us create a variable called `mynum`
    with the `int` data type and a value of `10`, then have our program print it out.


    ![image2.png](images/00063.jpeg)


