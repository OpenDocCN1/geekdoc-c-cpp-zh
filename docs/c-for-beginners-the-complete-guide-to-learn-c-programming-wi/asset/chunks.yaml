    ## 逻辑运算符


    逻辑运算符增加了关系运算符的复杂性。这些可以类比于人类的“与”或“或”。它们还具有改变关系运算符含义的特性。逻辑运算符与关系运算符结合，组合两个或多个条件来描述约束。它们让我们在条件语句中捕捉更多、执行更多。有三个逻辑运算符（jaggi,
    2015b）：


    “”: 逻辑“与”运算符在两个条件都满足时返回布尔值 true，否则返回 false。


    “![00113.jpeg](img/00113.jpeg)”: 逻辑“或”运算符在一个（或两个）条件满足时返回布尔值 true，在所有条件都不满足时返回
    false。


    “![00114.jpeg](img/00114.jpeg)”: 逻辑“非”运算符在所考虑的条件不满足时返回布尔值 true。如果其中一个条件为真，则它返回布尔值
    false。


