  trans: "\n\n# 逻辑运算符\n\n逻辑运算符在机器中被广泛使用。想象银行安全系统中的“非（not）”运算符。假设锁上的门为“0”[`false`]，未锁住的门为“1”。因为银行必须保持安全，我们的默认值是“0”。这被称为“失效关闭（failed-closed）”系统，因为如果发生故障，门将处于关闭状态（默认状态）。所有发往门的信号都由一个“非”信号控制：如果没有发生任何情况，门应该保持锁定状态；如果发生抢劫，它们也应该是锁定的。保持锁定。在抢劫期间打开的门将接收到“非”信号以失效关闭。但在火灾期间，这些门应该打开，因此失效关闭的“非”信号将返回真以打开门。\n\
    \n## 逻辑例程序\n\n让我们通过构建一个逻辑例程序来探索逻辑运算符。请遵循以下指令：\n\n1. 使用此 URL 打开并编辑关系例程序：[`ide.geeksforgeeks.org/dfd3cek85y`](https://ide.geeksforgeeks.org/dFD3cEk85y)\n\
    2. 编辑这些额外的变量以测试逻辑运算符：\n   ![00115.jpeg](img/00115.jpeg)\n3. 打印程序的解释\n4. 测试 `if(a>b\
    \ && c==d)` 并打印结果\n5. 创建一个 if 语句，在大于结果时打印结果\n6. 创建一个嵌套的 else 语句，在为假时打印结果\n7. 测试\
    \ `(a>b || c==d)` 并打印结果\n8. 测试 `(!B)` 并打印结果\n9. 清理代码中任何不行\n\n它看起来是这样的：\n![image54.png](img/00116.jpeg)\n\
    \n### 逻辑例程序\n\n此截图是逻辑例程序的成功运行，显示了所有逻辑函数的示例。你可以通过此 URL 访问此工作区：[`ide.geeksforgeeks.org/x9ixjuydbg`](https://ide.geeksforgeeks.org/x9ixjUYDBG)\n\
    \n如你所见，仅通过一个 ![00117.jpeg](img/00117.jpeg) 语句可能很难打印“与（and）”函数。![00118.jpeg](img/00118.jpeg)\
    \ 修改此练习以创建一个能更好地解释自身的程序！提示：你只需要额外增加一个 ![00119.jpeg](img/00119.jpeg) 语句。你可以通过此\
    \ URL 与我们的代码进行比对—— [`ide.geeksforgeeks.org/nh8yyv9kjy`](https://ide.geeksforgeeks.org/nh8yYV9Kjy)。\n\
    \n## 理解逻辑门\n\n让我们暂时放下例程序，探索使用逻辑运算符的其他方式。逻辑运算符基于机器逻辑，特别是逻辑门。逻辑门是具有一个或多个输入和一个输出的电子电路。逻辑门的功能与逻辑运算符相同。“与”门只有在所有输入都为“1”时才通过“1”；“或”门在接收到来自任何一个输入的的“1”时通过“1”；“非”门在接收到“0”作为输入时通过“1”。\n\
    \n逻辑门可以控制电路中的数据流，就像我们的逻辑操作结合条件语句一样。这在逻辑运算符中被称为条件短路（conditional short-circuit）。\n\
    \n### 短路求值\n\n逻辑与和或运算符会短路。回想 `and` 当两个关系运算符在条件上为真时如何返回真布尔值。此外，关系运算符是按照它们在条件语句中出现的顺序进行的——如果第一个为假，第二个将不会被评估，因此发生了短路。\n\
    \n`or` 运算符的处理方式有所不同。只需要一个关系运算符返回真，它就会通过真布尔值。所以，如果第一个关系运算符返回真，它就不会检查下一个。\n\n这非常有用，因为我们可以给程序更复杂的指令，告诉它在什么情况下如何表现。“或”和“与”是短路的反面。让我们用它写一个程序，告诉我们条件何时短路以及与或门。请遵循以下指令：\n\
    \n1. 打开一个新的 ide 工作区\n2. 声明两个 ![00057.jpeg](img/00057.jpeg) 变量：![00120.jpeg](img/00120.jpeg)\n\
    3. 打印程序的解释\n4. 此程序将测试 `or` 是否等于。\n5. 声明两个 ![00061.jpeg](img/00061.jpeg) 变量：\n\
    \   - `and = (a == b) && std::cout << \"and\";`\n   - `or = (a == b) || std::cout\
    \ << \"or\";`\n\n它看起来是这样的：\n![image27.png](img/image27.png)\n\n### 逻辑例程序\n\n此截图是逻辑例程序的成功运行，显示了所有逻辑函数的示例。你可以通过此\
    \ URL 访问此工作区：[`ide.geeksforgeeks.org/x9ixjuydbg`](https://ide.geeksforgeeks.org/x9ixjUYDBG)\n\
    \n如你所见，仅通过一个 ![00117.jpeg](img/00117.jpeg) 语句可能很难打印“与（and）”函数。![00118.jpeg](img/00118.jpeg)\
    \ 修改此练习以创建一个能更好地解释自身的程序！提示：你只需要额外增加一个 ![00119.jpeg](img/00119.jpeg) 语句。你可以通过此\
    \ URL 与我们的代码进行比对—— [`ide.geeksforgeeks.org/nh8yyv9kjy`](https://ide.geeksforgeeks.org/nh8yYV9Kjy)\n\
    \n## 位运算运算符\n\n在电路层面，机器通过位运算运算符进行通信。这赋予了它们在单比特层面的决策能力。换句话说，它们在机器层面上运行。\n\n"
