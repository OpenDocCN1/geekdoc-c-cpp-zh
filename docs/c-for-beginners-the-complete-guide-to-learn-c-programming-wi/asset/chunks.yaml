    我鼓励你搭建一个本地 IDE 并对其进行开发。这将让你成长得更快，并适应真实世界的场景。我们讨论过针对微软和 Mac 上 Xcode 的代码块。如果你使用的是
    Linux，有一些可以在所有发行版中使用的标准选项。Linux 是一种基于控制台的环境，深受软件开发者的青睐，因为控制台环境内置了许多直接与程序交互的特性。


    许多发行版提供了基于 GUI 的桌面环境，这对于许多用户来说是更优的。它们大多数都是开源的，可以免费下载和安装。我们非常推荐 centos，这是一个免费的
    Linux 发行版。服务器管理：CentOS 使用了许多红帽企业 Linux (`rhel`) 的组件。它是准备在红帽服务器管理环境中工作的最佳发行版。


    ##  编码最佳实践：学习的所有权与协作


    在我们共同相处的时间里，我们看到了许多软件开发的技巧和最佳实践。在第一章中，我们讨论了程序如何用尽可能少的代码来完成任务。感谢的是，随着 `c++` 每个新版本的发布，增加了更多实现这一目标的方法。大多数初级编程课程教授的是较旧、效率较低的方法来处理常见的编程任务，如解析数组、条件语句和调用函数。你会发现这些技术中的大部分在实际编程环境中从未被用过。大多数初级课程侧重于让初学者牢固地掌握基础——你知识的基础往往与你将如何进步同样重要。随着你的成长，你将发现更高效的方法用你的代码解决问题，但这只有在实践和学习的情况下才能实现。


    如果你想成为一名更优秀的程序员，你必须掌握自己学习的主权。学习开发前的工具，例如算法。这一切的核心在于学习解决问题。你还可以尝试其他开发前的工具，比如绘图。绘图对于视觉型学习者非常有帮助。所有这些方法对于成长程序员都大有益；你选择哪种并不重要，只要你利用了这些开发前的工具即可。


    回到 `algorithms`，更详细的算法将解释输入、输出和其他数据所需的各种数据类型。算法的优势在于你可以将它们作为简写。你还可以对代码进行注释和管理。这些习惯将帮助你的代码对团队成员来说保持有序且连贯。所有这些实践都将有助于提升看待和思考程序的方式。


    软件开发者在团队中工作，几个人可能同时处理同一段代码。在这种情况下，注释代码的重要性就变得尤为明显。


    与他人合作也会加速你的成长。与他人一起编码时，你可以从他们的经验和知识中学习。正如我们所说的，`c++` 拥有各种库对象、语句和其他工具。它就像人类语言中的词汇一样丰富，因为实现同样的事情有许多方法。你解决问题的方法取决于你发现高效方法的能力。但最终，所有的编程和软件开发都是创造性的活动。与他人合作将增加你的编程“词汇量”——你将从他们创造性地解决问题中学习，并在过程中发现自己的见解。你应该始终记住，每个人都能做出贡献，而他们的贡献受其经验程度的影响很大。所以，即使你是
    `c++` 新手，你仍然拥有解决问题的独特经验和方法，这是别人不具备的，因为你的思考方式不同。这本身对任何团队都是有价值，特别是当你学会很好地交流你的想法时。我强烈建议你将术语表作为帮助你清晰交流的一种方式。


    除了注释之外，保持代码尽可能整洁也是一种良好的习惯。我已经演示了如何注释代码行以防止在编辑期间破坏代码。在你的练习中，当你把代码破坏到无法修复时，你可以随时从我们保存的想法重新开始，或者简单地刷新浏览器重新开始（这取决于你运行和生成代码的状态）。只有在你需要保存代码时才生成
    URL，而不是在开发过程中生成。


    我们还强调了代码结构的重要性。例如，我们讨论了声明和定义函数重要性：最佳实践是在顶部声明函数，并在 `main()` 函数之后定义它们。这与声明整数类似。这些技术确保你在开头就拥有一个函数、变量和对象的清单。它像索引一样，可以帮助你避免定义错误。


    格式化和编辑代码中不必要的行可以减少开发过程中的错误。当你做出更改时，应该始终更新注释。未格式化的代码不会影响性能，但代码的逻辑会。格式化你的代码是一种协作礼貌，更不用它让你的工作变得容易得多。你团队中的其他程序员能够实现你的代码，甚至对其进行改进，并且会留下注释。


    但这些实践并不仅仅对你有处。随着世界的不断发展，情况正变得越来越复杂，因此程序向用户解释自身是一件好事。如果你的程序有输出，请确保它是易于阅读的。我们已经在书中看到如何做到这一点。使用转义序列如
    `\n` 创建新行，使用 `\t` 创建水平表格，以便为代码留出足够的空白。但作为一名与服务器和其他设备工作的后端程序员，你可能不需要像为客户端提供内容的前端程序员那样频繁地打印。可能需要看到你的输出的用户只是通过终端管理这些机器的其他技术人员和管理员。格式化实践在后端编程中经常被低估，但仍然是一个良好的习惯。对于管理员和技术人员来说是有价值的，因为他们没有资源去处理程序员在调试时习惯于那些晦涩的编译器生成的错误。


    ## 总结：`c++` 中的计算机科学概念


