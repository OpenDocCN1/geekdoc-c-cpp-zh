    C++ 中进行决策和切换的核心。


    ## 第 5 章：C++ 中的决策


    我们将讨论决策函数；这些是像 `if-else` 循环之类的函数。编程很大程度上依赖于决策，而决策是由涉及我们在第 4 章中看到的运算符的逻辑表达式提供的。决策函数结合逻辑表达式，使机器能够根据程序员选择的标准做出决策。


