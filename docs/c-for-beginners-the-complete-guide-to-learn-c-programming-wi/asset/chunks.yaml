    ## 第 3 章：变量和数据类型


    我们已经讨论过底层编程如何紧似机器语言，但它们不同，因为它们仍然使用了让人想起人类语言的元素，如语法、结构和变量。变量是人类用来向机器传递含义的数学概念。计算机科学的很大一部分在于认识言语是一系列数学概念。这包括允许机器在比特位级别做出决策的逻辑门。在非常小的尺度上，位运算函数可以帮助许多计算过程，从控制显示到切换服务器上的流量。我们将在第
