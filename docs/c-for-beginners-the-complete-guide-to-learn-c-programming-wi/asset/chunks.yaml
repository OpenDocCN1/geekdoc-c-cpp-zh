    ## 省略命名空间


    我们已经讨论过使用 `namespace` 语句。我们说过它有助于全局声明字符串，但对于像“hello world”这样的小程序，它并不重要。对于使用多个函数的较大型程序，使用该语句单独声明每个字符串是一个良好的习惯。这可以节省编译器的内存，否则你会发现编译器陷入了不必要的负担，必须调用整个字符串命名空间库来打印代码。单独声明每个字符串可能会让你的代码冗长，但它会减少编译开销，并聚焦你的指令。`std`
    命名空间包含多个对象和定义，这使得计算机难以找到操作和定义字符串的适当方法。当你的函数将被多个程序调用时，命名空间约定非常重要。因此，不必要地放在其中可能会导致你的函数定义不当，并引起它们之间产生识别错误。


    让我们通过从代码中移除 `using namespace` 来让我们的代码更高效。


    ![image48.png](img/00054.jpeg)


    ### 测试稳定性：使用注释移除“using namespace”


    此截图是在删除了 `![00055.jpeg](img/00055.jpeg)` 后，“hello world”程序的失败运行测试。你可以通过以下 URL
