    \ ours with this url -- [https://ide.geeksforgeeks.org/nh8yyv9kjy](https://ide.geeksforgeeks.org/nh8yYV9Kjy).\n\
    \n## Understanding Logical Gates\n\nLet’s take a break from routines and explore\
    \ other ways we can use logical operators. Logical operators are based on machine\
    \ logic, especially logical gates. Logical gates are electronic circuits that\
    \ have one or more inputs while having one output. Logical gates have the same\
    \ function as logical operators. “and” gates only pass “1” when all inputs are\
    \ “1”; “or” gates pass “1” when they receive a “1” from any of their inputs; “not”\
    \ passes “1” when they receive a “0” as their input.\n\nLogical gates can control\
    \ the flow of data in a circuit, the same as our logical operations when combined\
    \ with a conditional statement. It is called a conditional short-circuit in logical\
    \ operators.\n\n### Short-Circuit Evaluation\n\nLogical and and or operators short-circuit.\
    \ Recall how `and` returns a true boolean value when both relational operators\
    \ are conditionally true. What’s more, relational operators are assessed in the\
    \ order that they appear in a conditional statement – if the first one is false\
    \ the second one will not be evaluated, so it short circuits.\n\n`or` operators\
    \ do this differently. Only one relational operator has to return true for it\
    \ passes a true boolean value. So if the first relational operator returns true,\
    \ it won't check the next one.\n\nThis is very useful because we can give more\
    \ complex instructions to a program about how to behave in what circumstances.\
