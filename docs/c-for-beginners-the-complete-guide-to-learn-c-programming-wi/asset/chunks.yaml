    - “![00061.jpeg](img/00061.jpeg)”：关键字是“boolean”（布尔）的缩写，存储具有两种状态的值：真或假。如之前讨论的，这些值可以表示为“0/1”或“false/true”。


    在下一节中，我们将详细讨论它们。现在让我们来看看这些示例。要创建一个变量，你必须在 `=` 运算符之后给它分配一个值。它们的语法如下：


    ```cpp

    [datatype][variable_name] = [value];

    ```


