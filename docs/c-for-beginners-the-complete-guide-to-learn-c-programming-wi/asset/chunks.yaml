    Github 和 pastebin 是启用了语法高亮插件的代码聚合器。Github 允许你在他们的网站上托管整个项目，而 pastebin 仅允许发布代码片段。在这些平台上，你可以用多种语言保存代码。


    这些工具对程序员来说非常有用，因为它们允许程序员共享代码、协作、测试等。学习如何将项目部署到 Github 是编程中最重要的事情之一，因为它已经变得非常标准化了。因此，维护一个
    github 个人资料也变得非常重要，因为它包含了你正在进行、曾经进行过的项目，以及你的活动记录（peshev, 2017）。对于潜在的雇主或合作者来说，这些信息是无价的。


    ![image34.png](img/00003.jpeg)


    ## C++ 代码语法示例


    这是一个开启了语法高亮的 paste bin 截图 [(“c++ code,” 2015)](https://www.zotero.org/google-docs/?MBrR1L)（注：此处为示例翻译，实际翻译中会根据要求保留链接）。语法高亮和制表符间距有助于使代码更易于理解。所有带有语法高亮的文本编辑器都会使用这种方案：库显示为绿色，函数、数据类型和数据显示为蓝色。字符串将显示为红色。


    你在本地工作时，将无法轻松获得这些便利。如果你使用 windows 系统，在系统中找到的第一个文本编辑器是记事本（Notepad）。Wordpad 是另一个具有更多
    GUI 特性的工具。当你打开这些程序时，你会注意到它们是多么单调无味。它们像 Word 但更糟，因为如果编写高效、优雅的代码对我们来说很重要，那么它们就不应该只是简单的文字处理器。它们类似文字处理器的特性使其更适合在里面写字而不是代码，尽管你可以在它们写代码。


    ![image7.png](img/00004.jpeg)


    ## Windows 记事本与 Wordpad 工具的对比


    这张截图显示了 Windows 的两个内置工具，左侧是记事本，右侧是 Wordpad。Wordpad 具有更多微软套件的 GUI 特性，你可能更加熟悉，包括位于高亮“文件”标签上方的微软快速访问栏。相比之下，记事本非常简陋。与文字处理器不同，这两个工具都允许你以不同的文件扩展名保存。然而，Wordpad
    比记事本更像文字处理器，它以富文本格式 (.rtf) 保存文件。如果你使用富文本格式以外的扩展名保存，Wordpad 会警告你将丢失格式。


    记事本和 Wordpad 的独特之处在于它们可以以各种文件扩展名保存文件，而文字处理器不能。文件扩展名很重要，因为它们告诉编译器如何解释文件中书写的内容，这使得机器拥有一组它可以理解并执行的指令。


    尽管有这些能力，这两个程序仍然缺乏语法高亮等关键的文本编辑器功能。你可能认为这没什么，但其实不然；代码中相同的单词因为它们出现的方式和时间可能具有不同的含义，因此，高亮帮助我们区分它们指代什么。所以，如果一切都是平面的黑白，你就必须花更多精力去理解某段代码指的是什么。现在听起来很复杂，一旦你开始写代码，这就会变得明显且必要。


    Notepad++（不要与 Windows 的记事本混淆）具有高亮功能，但你必须这样激活它们：


    ![image1.png](img/00005.jpeg)


    ### Notepad++ 带 C++ 语法的截图


    Notepad 是免费的，正如名称所示，它是用 c++ 编写的。这张截图说明了如何启用语言。可以通过进入 `Language` > 导航到 `C++` 来专门启用
    C++ 语法。Notepad++ 仅适用于 windows 平台 (.exe)。


    Blue 是一个更高级的文本编辑器，带有更多功能（“蓝色功能”）。与 Notepad++ 不同，Blue 在 windows 之外的多个平台上可用。但我不推荐初学者使用
    Blue，因为它有很多许多让初学者无所适措的功能。如果你不是编程新手，可以尝试一下；你会发现它具有许多 ide 编辑器的典型 GUI 特性。进入文本编辑器后，你必须选择一个编译器。让我为你演示如何在三个平台（windows、linux
    和 mac）上设置本地环境。你只需要安装一个 ide。只需记住它必须包含一个文本编辑器和一个编译器。Codeblocks 是一个为 c++ 设计的实用开源
    ide，它可以轻松适配各种编译器，包括微软的 visual++。安装 codeblocks 很容易。你只需要访问下载页面 [`www.codeblocks.org/downloads/26`](http://www.codeblocks.org/downloads/26)
    并选择最新版本即可。


    ![image13.png](img/00006.jpeg)


    ### Codeblocks 下载页面


    截至本文写作时，codeblocks 有适用于 windows 和 linux 发行版的 20.03 版本。页面还包含安装说明。一旦安装了程序，你就完成了。你可以用它来编写
    c++ 程序。要这样做，你需要遵循三个步骤：创建文件、编译程序和运行程序。创建新文件稍微复杂一点。这是你需要做的：


    * 进入 `File` > `new`

    * 选择 `create an empty file` 并输入你的代码

    * 使用 `.cpp` 扩展保存文件


    而且，不用说，你必须在运行之前编译程序。你可以通过进入菜单中的 `Build` > `build and run` 来实现这一点。


    ![image20.png](img/00007.jpeg)


    ### codeblocks 中“hello world”的截图


    这是我们在 code blocks 中运行“hello world”程序的实时截图。程序运行后，代码的编译消息中会出现一个错误。codeblocks 高亮了第
    6 行的错误。根据你之前节中学的 c++ 语法知识，你应该知道如何修复代码。我们如何修复代码呢？


    提示：数据和函数应该显示为蓝色。顺便说一下，这个程序对于它允许你完成的工作来说非常轻量。codeblock 可用于 windows 和 linux，但没有
    mac 版本。


    ## Mac os ide 安装与设置


    对于 mac，你需要获取 xcode。它是一个适用于 mac 的免费 ide 软件开发套件。你可以在 mac 应用商店获取它。Xcode 支持 java、python
    和 ruby 等多种其他语言。


    它面向为 mac 操作系统开发软件；这可以包括用于 apple tv 的电视、用于 apple watches 的手表以及用于 ipad 平板的 iPad（“xcode
    9 新特性，”n.d.）。Xcode 为不同的 mac 平台提供了多种软件开发工具包 (sdks)，以帮助程序员通过苹果的专有编程方案。SDK 是由硬件和软件供应商提供的一组工具，用于为特定平台开发应用程序。SDK
    允许开发者完全集成到开发社区中，如苹果或安卓。


    Mac 使用专有编译器，这些编译器只能在 xcode 中运行，所以。如果你在 mac 上，你除了使用 xcode 进行 c++ 开发外没有其他选择。


    '
- fmt: '

    Once the file is downloaded and installed, open xcode and click on the “create
    a new xcode project” icon. Then select “new project” in the initial window.


    ![image12.png](images/00008.jpeg)


    Initial screen for xcode: select a new project


    These screenshots feature an xcode build from version 8.3.3 (patel, 2017). Therefore,
    our examples might look different from a more up-to-date build. As of this writing,
    the most current version is 12.1, which mostly includes updates to the various
    platforms sdks (“Xcode,” n.d.). Despite these differences, these screenshots will
    still help you orient yourself in the more current build. Our instruction will
    still yield results.


    After you do this, a prompt window will appear that will ask you to choose a template.
    This window will guide you through the rest of the setup. Select the mac sections
    and go to the application section; in there, choose the command line tool.


    It looks something like this:


    ![image6.png](images/00009.jpeg)


    1. Project selection screen: macos > application > command line tool


    Xcode has many built-in code utilities for running programs on various apple platforms.
    Therefore, to run a test program you would have to select macos for it to run
    on your program. Further, to access assembly language development needed for c++,
    you would have to use xcode’s command-line tool. This command-line tool can handle
    objective-c and c languages as well.


    After you select a template, the guide will present options for the command line
    tool. Here, you can name the project, add your organization’s name, use a bundle
    identifier, and select a programming language.


    ![image49.png](images/00010.jpeg)


    2. Command line tool options: language > select c++


    Xcode’s command line tool can handle microsoft’s proprietary languages like swift.
    This program can run alongside c-based languages in mac compilers, including c++.
    Swift is selected by default.


    In the same window, you will be required to add an organization identifier. Remember
    that xcode’s command line tool is a programming template for proprietary macos
    operating systems, so the organization identifier is used to create a unique idea
    for your program in apple databases: the apple developer website and icoud container,
    itunes connect portal in the appstore. This will streamline your app into a proprietary
    macos framework.


    ![image11.png](images/00011.jpeg)


    3. Command line tool options: organization identifier > “cpp”


    The organization''s identifier is a naming convention that helps programmers integrate
    their projects into Apple’s proprietary software development scheme. Here, we
    are using `cpp` as our identifier, which generates `cpp.hello.world` as our bundle
    identifier. Once we indicate an identifier, the guide allows us to proceed to
    the next step.


    Now, save your project in a directory of your choice. On the left-hand side pane,
    xcode will be able to open the file. You will have to select `main.cpp` to access
    the global c++ file for your program in xcode. If you so desire, you can upload
    cpp files into the directory, and edit them.


    ![image40.png](images/00012.jpeg)


