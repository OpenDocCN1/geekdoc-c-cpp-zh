    ## 第 4 章：C++ 中的操作


    我们讨论了 C++ 主要是一种后端、服务器端语言，适用于控制服务器和其他用于交付内容的决策用程序。在上一章中，我们通过观察字符串来看了 C++ 处理数据的一些较小方式。在其中，我们看到了操作所起的核心作用。操作允许我们控制程序中的循环和决策。更好地理解操作允许我们为程序添加更多功能。功能是程序员使用语言的方法和特征来实现目的的方式。我们已经看到这些字符串处理方法是如何工作的，但更好的想法是我们在允许我们实现特定目的（如内容管理）的上下文中使用这些特征。


    **注意**：“操作数”（operand）描述被操作的值。“运算符”（operator）描述指示正在执行的操作的操作的符号。以下是 C++ 中的操作列表，按它们接受的操作数数量分类：


    *   **一元**：仅接受 1 个操作数。

    *   **二元**：接受 2 个操作数。

    *   **三元**：接受多于 2 个操作数。


