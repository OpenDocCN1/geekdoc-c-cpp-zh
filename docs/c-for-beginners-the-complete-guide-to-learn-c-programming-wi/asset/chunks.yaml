    文章中的嵌入代码相比，它们的嵌入代码要详细得多 (“writing first c++ program,” 2017)。右侧的两截图显示了嵌入在文章中的相同代码的“浅模式”和“深色模式”视图。这些视图更加详细，高亮了注释、函数并区分了不同的语句。例如，`int`
    等数据类型用不同的颜色与 `using` 等其他语句区分。此外，嵌入视图与 ide 不同，将字符串与其他数据区分来。这是语法高亮如何随平台变化的完美示例。早些我们看到过一个包含错误的代码块示例。下面是完全相同的代码与修正后的代码并列。


    ![image9.png](img/00025.jpeg)


    ## 代码块中的“hello. World”与 geeksforgeeks ide 的比较


    这张截图对前一个示例（带有错误的“hello. World”代码块）与 geeksforgeeks ide 中相同的修正后代码进行了并排对比。通过学习两者，你应该能够看到
