  trans: "\n正如我所说的，程序员需要努力编写高效、易于理解的代码。这会让你和你所有人的工作变得更轻松。使用 `switch` 代替 `if().else`\
    \ 是实现这一目标的方法之一，特别是在我们需要处理大量表达式的情况下。三元运算符减少了代码行数，正因如此，它们并不适用于代码跨行的情况。\n\n`switch`\
    \ 语句为这两个问题提供了解决方案。`switch` 语句是多分支语句，提供了一种简洁的方法在一个变量上执行不同的代码块。以下是语法（awasthi, 等）：\n\
    \n![00196.jpeg](img/00196.jpeg)\n\n```\n{\n![00197.jpeg](img/00197.jpeg)\n![00198.jpeg](img/00198.jpeg)\n\
    ![00199.jpeg](img/00199.jpeg)\n![00198.jpeg](img/00198.jpeg)\n![00200.jpeg](img/00200.jpeg)\n\
    }\n```\n\n注意：`switch` 只能将整数与 case 数字进行比较。要添加条件部分，你必须通过操作对变量进行更改。该运算符必须产生一个整数。\n\
    \n让我们创建一个 `switch` 演示。练习 `switch` 的各个组件：\n\n1. 打开一个新的 ide cpp 工作区\n2. 初始化一个变量\n\
    ![00201.jpeg](img/00201.jpeg)\n1. 打印程序的解释\n2. 初始化 switch\n![00202.jpeg](img/00202.jpeg)\n\
    1. 对于 case 1，打印 \"choice is 1\"\n2. 对于 case 2，打印 \"choice is 2\"\n3. 对于 case 3，打印\
    \ \"choice is 3\"\n4. 对于 default，打印 \"program exit\"；\n\n![image50.png](img/00203.jpeg)\n\
    \nswitch 演示。\n\n这是我们 `switch` 演示的截图。你可以通过此 URL 访问我们保存的工作区副本：[`ide.geeksforgeeks.org/dsehfxulz5`](https://ide.geforgeeks.org/dSehFXULz5)。我们强烈建议使用此演示。将我们之前的练习之一转换为\
    \ `switch`。一个极佳的候选是我们的关系例程程序。它有 6 个 `if().Else` 语句！这总共有 12 种不同的场景。你如何将此程序转换为 `switch`？提示：考虑使用\
    \ `input` 函数为每个关系例程程序创建一个菜单。你可以通过此 URL 自己学习关系例程程序：[`ide.geeksforgeeks.org/dfd3cek85y`](https://ide.geforgeeks.org/dFD3cEk85y)。\n\
    \n现在我们已经了解了决策函数是什么以及它们是如何工作的，让我们把注意力转向函数及其在编程中的作用上。\n\n## 第 6 章：创建函数\n\n我们讨论过算法，它将其视为一种理解问题和规划你的代码如何工作以修复问题的方法。算法接收输入，执行操作，然后给出一个结果，导致状态更改。函数是一个你可以多次调用的代码块，而无需重新编写代码。代码通常是执行某个所需任务并具有高重用性的内容。函数由头头和函数体组成。以下是函数的语法格式：\n\
    \n```\n[datatype]function_name(arguments)\n{\n    //statements\n    Return0;\n\
    }\n```\n\n正如你所看到的，以及许多其他编程语言一样，c++ 大部分是一系列函数、语句和运算符，中间夹杂着对象和其他数据存储元素。我们到目前为止编写的所有内容都使用了\
    \ `main()` 函数，其语法与上面类似。因此，函数对你来说并不陌生。每个函数必须返回一个数据类型，就像 `main()` 函数返回 `int` 一样。如果函数没有返回，则使用\
    \ `void` 作为返回类型。正如你可能猜到的，返回语句是终止函数的语句。函数接收的输入称为参数（arguments）。并不是所有函数都会接收输入，正如我们在\
    \ `main()` 中看到的；无论如何，你仍然可以将参数传递给函数进行处理。这就是库将对象传递给 `Main` 的方式。\n\n### 创建并调用函数\n\
    \n开始调用函数，你必须在 `main()` 之前声明并定义它。这是因为 c++ 是按顺序执行的。c++ 实践具有优先权，函数也获得优先级以便你可以调用它们。它们之所以这样命名是因为它们让代码更有组织。一旦函数被声明，我们就可以在\
    \ `main()` 之外定义它。让我们写一个简单的函数，以便我们更好地理解它们。遵循这些指令：\n\n1. 打开一个新的 ide cpp 工作区\n2.\
    \ 声明你的函数\n`void function();`\n3. 在 `main()` 中调用你的函数\n`function();`\n4. 在 main\
    \ 之外定义你的函数\n![00204.jpeg](img/00204.jpeg)\n![image42.png](img/00205.jpeg)\n\n\
    函数演示。\n\n这是我们函数演示的截图。你可以通过此 URL 访问我们保存的工作区副本：[`ide.geforgeeks.org/b9isihapz`](https://ide.geforgeeks.org/b9isihAp)。如果你想进行更多练习，我们建议使用此练习作为模板，将我们过去的练习之一转换为函数！考虑我们使用\
    \ ![00206.jpeg](img/00206.jpeg) 的练习。\n"
