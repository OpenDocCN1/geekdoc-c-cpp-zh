    上面的程序声明了两个执行相似计算的独立函数。在大型程序中，这是对空间的浪费也是低效的。它使得编辑代码变得困难，因为在较大的程序中，其中一个函数不太可能位于同一个位置。为了提高效率，我们应该将这些函数合并到一个名称下，并“堆叠”数据类型。你可以这样操作：


