    Remember that you can reset the workspace to a successful state by using the url.


    We had our share of output in our code. Let’s use the input in the top right and
    the `cin` object so our program takes inputs and operates on them. We can do this
    by writing programs that take two numbers and adds them together. To do this,
    we have to declare two variables that will store our inputs:


    - Two `int` variables named `x` and `y`

    - One `int` variable named `sum`


    We can also tell the program to prompt the user inputs. Note: in our ide, you
    must enter the inputs before you run the program. Each input should be on its
    own line.


    ![image46.png](images/00064.jpeg)


