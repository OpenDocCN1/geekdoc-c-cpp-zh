    ## Relational Operators


    Most programs, not just in c++, use conditionals and loops to control flow. Operators
    in this section are used to perform conditional switching. For instance, in games,
    the game engine adapts to how the player interacts with the game. It gives the
    gamer more of an engaging and dynamic experience.


    If the gamer completes challenges quickly, it might mean they find the game too
    easy. As a result, the game adjusts by increasing difficulty, but not too much.
    If the game is too hard, the engine might respond to that by making it a little
    easier to play. This is called dynamic gameplay, and it happens because coding
    languages have conditional switching. Conditional switching, the adaptation, happens
    through relational operators that compare two values. All relational operators
    are binary (jaggi, 2015b). Here they are:


    “![00099.jpeg](images/00099.jpeg)”: “equal” operator that checks whether two given
    operands are equal. If the operands are equal, it returns a boolean `true`; if
    not, it returns false.


    “![00100.jpeg](images/00100.jpeg)”: “not-equal” operator that also checks whether
    two given operands are equal or not. However, this operator returns a boolean
    true if the operands are not equal and returns false if the operands are equal.


    “![00101.jpeg](images/00101.jpeg)”: “greater-than” operator that checks if the
    operand on the left is greater than the operand on the right. If so, this operator
    returns a boolean true. Otherwise, it returns false.


    “![00102.jpeg](images/00102.jpeg)”: “less-than” operator that checks if the operand
    on the left is less than the operand on the right. If so, this operator returns
    a boolean true. It returns boolean false otherwise.


    “![00103.jpeg](images/00103.jpeg)”: “greater-than or equal-to.” operator that
    checks if the operand on the left is greater than or equal to the operand on the
    right. If so, this operand returns a boolean true. If not, it returns a boolean
    false.


    “![00104.jpeg](images/00104.jpeg)”: “lesser-than or equal-to.” operator that checks
    whether the operand on the left is less than or equal to the operand on the right.
    If so, this operand returns a boolean true. If not, it returns false.


    Like we did with the arithmetic operators, let’s create a count program which
    demonstrates relational operators, we are going to be using conditional `if()`
    statements in our code. An `if()` statement executes the code within its braces
    if a specified condition is met. If the condition is not met, it executes the
    `else` statement. The `else` statement does not have a condition. Relational operators
    are case sensitive; both `if` and `else` must be lowercase. `if()` can be implemented
    without an `else`, but a missing `else` can cause an error.


