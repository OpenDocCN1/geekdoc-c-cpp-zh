    *   调用头文件 `io` 以使用输入输出函数

    *   调用执行所在的主函数（main）

    *   打印“hello. World”

    *   指示机器状态的终止语句


    我们可以看到 C++ 是多么繁琐，因为大多数步骤都涉及到执行代码所需的 C++ 后端方面，例如调用库文件。在大多数情况下，你的算法并不需要写得如此详尽。


    尽管这个算法很简单，但它说明了开发者如何处理任务并将其转换为代码。在下一章中，我们将使用这个算法来编写我们的程序。


    正如你在示例中注意到的，代码中包含注释，解释了代码中每个部分的作用。这些注释的前面是 `//`。编译器不会读取任何以 `//` 开头的代码行，因为它们不会产生任何作用，只是为了帮助其他维护代码的人员理解代码的功能。在代码中包含注释是一个良好的习惯，这样人们就能知道每行代码的作用。


    # C++ 语法概览


    我们已经讨论了语法对编译器的重要性，但理解编程语言的语法也同样重要，因为它能帮助你调试代码。就像人类语言一样，如果你了解一种语言的规则，当你出错时可以很容易地纠正。调试是发现并消除代码中错误和异常的过程，也称为“bug”（“什么是调试？”N.d.）。这是一个纠正的过程。


    IDE 拥有调试工具可以高亮代码中出现错误的地方，但这些功能并不总是可靠的。例如，漏掉结束代码行的分号是一个常见错误，但调试器会高亮 `.h` 文件中的错误，而不是程序文件
    `.cpp` 中发生错误的地方。大多数调试器并不足够智能，能检测到内容的缺失，并在未终止的行违反库中的规则时，抛出编译器给出的冗长错误。然而，程序员只需在注意到某一行缺少了红色的分号时，就能发现错误。


    ![image38.png](img/00022.jpeg)


    geeksforgeeks ide 中缺少行分隔符的“hello. World”程序


    这张截图显示了缺少分隔符的“hello. World”。你会立即注意到，该 ide 对 C++ 的语法高亮与我们在上一章中探索的编程环境不同。语法可能会随平台而异。这就是为什么我们正在通过
    geeksforgeeks 将该过程标准化。在我们选择的 ide 中，分号没有被高亮。然而，ide 可以通过识别和标记分号来弥补这一点，如截图所示。你可以通过访问生成的
    url 来练习和探索这个程序：`https://ide.geeksforgeeks.org/mzbupp6sl`。


    ## 调试 C++


    当代码较小时，很容易看出这一点，但在处理较大的项目时，任务可能会变得困难。我听过有些程序员花费一周或更长时间尝试修复代码中的某一行，结果发现是非常细微的问题，如字母缺失或不匹配。为了让调试更容易，建议将代码拆分成更小的模块（“什么是调试？”N.d.）。通过这种方法可以发现并轻松处理许多错误。


    让我们观察“hello. World”程序并详细研究它的语法。虽然语法高亮在不同平台上可能会有所，但代码的这些方面在所有平台上都是一致被高亮的。


    ### 注释

    正如我所说，这些是编译器将忽略的代码行。它们用于注释代码并为其他程序员留有帮助的解释。这非常棒，因为通常当我们与他人一起编码时，建议在算法中留下注释，以便为他人简化。在大多数平台上，注释会被高亮为绿色。注释前面总是会有
    `//`。


    ### 头文件库

    以 `#` 开头的行被编译器用于调用库函数。这些行非常重要，因此它们出现在每个程序中。在“hello. World”示例中，我们调用了一个用于管理字符串的库。这些代码行在不同平台上将以不同的颜色高亮。在
    geeksforgeeks 中，颜色是紫色。


    ### 语句

    语句通过编译器识别的指令描述了代码行的开始。这包括声明处理指令，如 `using...` 或 `return...`。在我们的 hello world 程序中，它们在不同平台上也有不同的高亮方式。在
    geeksforgeeks 上，它们被高亮为紫色。


    ### 函数

    这是封装指令的代码。它可能接受输入并输出结果。每个函数的编写方式如下：`function_name()` 后面跟着大括号 `{}`。大括号中的任何内容都是将执行的指令集。在我们的示例中，`main()`
    是启动通过 `cout` 输出“hello. World”指令的函数。在 `.cpp` 程序中，程序函数必须始终出现 `int main()`。


    ![Text Box 58### 数据这些是变量以及其他类型的数据函数和语句。在 geeksforgeeks ide 中，它们被高亮为蓝色。![image31.png](img/00024.jpeg)


