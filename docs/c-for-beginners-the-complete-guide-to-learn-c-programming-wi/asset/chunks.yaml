    Operations that combine assignments with other operations. Atomic operations allow
    programmers to manipulate a value stored within a variable and reassign it immediately.


    ### Base-10

    Number system used by human beings to assign place value to numerals. Base-10
    is also known as the decimal system because a digit''s value in a number is determined
    by where it lies in relation to the decimal point. The value is multiplied by
    a base power of 10, where each point away from the left of the decimal is `10^(n+1)`
    and each point to the right of the decimal is `10^(n-1)`.


