    ## 使用 endl：输出操作符


    正如我们所说，编程语言一样灵活。你可以用多种方式表达一条指令，终止字符串也不例外。转义序列和 `endl` 之间的区别在于 `endl` 会刷新并更新存储字符串的缓冲区。程序员使用
    endl 在打印大量文本后清理内存。你可以看到这对于内存管理很有用。`endl` 是输出操作符的一个示例。输出操作符是允许你使用 `<<` 运算符或 `>>`
