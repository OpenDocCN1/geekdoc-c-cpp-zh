    I will admit that it is not as impressive in a few code lines like this, but being
    able to notice errors and explain them is one of the most important skills for
    programmers. At this point you should not worry much about being able to do this.
    The more you code and learn, the better equipped you will be to notice and fix
    errors. Software and web development are industries with a high failure rate because
    of this. To succeed as a developer you need to solve problems quickly, find bugs
    more efficiently, and fix them. This also applies on the administrative side,
    because being able to find, fix, and explain bugs is a large part of desk service
    level agreements.


    In tech, service level agreements (`slas`) are agreements between a service provider
    and a client. They agree upon aspects of the service, like support, quality, availability,
    and responsibilities (wieder, butler, theilmann, & yahyapur, 2011). Comprehensive
    `slas` offer a debugging debriefing, where every error is logged and listed with
    its cause, workaround, and solution. This is the best way to do it in technology
    management firms and development stages. However, administrators have more resources
    to dedicate to debugging than developers themselves. They are compensated at a
    higher rate as well. For instance, web developers make approximately 60,000 a
    year in the us; web administrators, those in charge of `slas`, make about 1/3
    more at 90,000 a year (“15-1199.03—web administrators,” n.d.). This level of expertise
    is valuable because it understands how the compiler translates c++.




    # First program: output and basic strings


    “hello. World” is every programming language’s beginner project; its aim is to
    show the learner the basic syntax of the program and how it functions. As you
    learn more languages you will write many “hello. World” programs. In the previous
    section, we used it to explore topics like algorithms, syntax, and c++ programming
    environments. In this section we will go further: we will manipulate the code.


    C++ uses the `cout` object from the `iostream` library. An object is a method
    that a computer uses to manage data. In our example, `cout` was used to tell the
    compiler to print “hello. World with the `>>` operator. Don’t freak out; we will
    discuss operators and objects in later chapters. For now, it’s enough to understand
    that the compiler reads `cout` as specific instructions because that instruction
    is defined in the `iostream` library that we declared.


    Now, let’s look at “hello. World” and the `cout` object by changing the print
    output. Find the original code here so you can use it as a reference:


    [Https://ide.geeksforgeeks.org/ea8zmekido.](https://ide.geeksforgeeks.org/eA8ZMEKiDO)


    ![image16.png](images/00026.jpeg)

    “hello. World” program in geeksforgeeks ide


    ## hello. World” program in geeksforgeeks ide


    This screenshot is the successful run of “hello. World” in split-screen mode.
    As we begin to use the ide for coding exercises, note the input and output boxes.
    While there are no inputs for this program, you will input data into the top box
    labeled “input goes here…” when prompted by the program in the output below.


    You can access this program in the saved ide here: [https://ide.geeksforgeeks.org/ea8zmekido.](https://ide.geeksforgeeks.org/eA8ZMEKiDO).


    You can also view a copy of the code in the index.


    ## Using cout


    The `cout` object uses the `<<` operator to print values and text, and we can
    have as many of them as we like. Using the ide in your browser, change the code
    to print output:


    ```

    Hello. World

    I am learning c++

    ```

    ![image30.png](images/00027.jpeg)


    ### Adding output


    This screenshot is the successful run of our edited “hello. World” program in
    split-screen mode. While the program ran without any errors, it didn’t produce
    the result we wanted. Observing the output, the printed text is missing a new
    line. We will have to instruct the compiler to add the new line to get the desired
    result. Adding lines can be done in several ways: we can add delimiters within
    the strings or use another object from the `iostream` library.


    #### Using escape sequences


    Although it might be tempting to write a string within output and enter a line,
    it will not work. It will break the code and it will not run. Don’t believe me?
    Test it! You can add a new line by using an escape sequence. Escape sequences
    are used in many instances where you need to introduce special characters within
    strings. It can also add lines, like so:


    ![image23.png](images/00028.jpeg)


    #### Using in-string escape sequences to delimit and manipulate the output


    This screenshot is the successful run of our edited “hello. World” program in
    split-screen mode. Using ![0029.jpeg](images/0029.jpeg), we were able to get our
    expected output. As you look at the code, you can see that doubles are used. So,
    if you want to add doubles in a string, you will have to use an escape sequence
    so the compiler knows that is not part of the code. Not doing so may cause unforeseen
    errors or bugs. This is why escape sequences matter. Here is a list of the many
    instances where they can be used (`escape sequences—cppreference.com,” n.d.):


    - `![0030.jpeg](images/0030.jpeg)`: used for single quotes

    - `![0031.jpeg](images/0031.jpeg)`: used for double quotes

    - `![0032.jpeg](images/0032.jpeg)`: used for question marks

    - `![0033.jpeg](images/0033.jpeg)`: used for backslashes

    - `![0034.jpeg](images/0034.jpeg)`: stands for “form feed” and is used to go to
    the next “page”

    - `![0029.jpeg](images/0029.jpeg)`: stands for “line feed” and is used to go to
    the next line

    - `![0035.jpeg](images/035.jpeg)`: stands for “horizontal tab” and adds 5 spaces
    horizontally

    - `![0036.jpeg](images/0036.jpeg)`: stands for “vertical tab” and is used for
    spacing in vertical languages


    Note: if you decide to try different escape sequences as text delimiters, be sure
    to only use the ![0037.jpeg](images/0037.jpeg)![0038.jpeg](images/0038.jpeg)![0039.jpeg](images/0039.jpeg)
    button to save your work at another url to return to later. To return to our exercise,
    you can use our saved ide workspace url ([https://ide.geeksforgeeks.org/psgblshe4h](https://ide.geeksforgeeks.org/PsgBLSHE4h)).


    You can also access this code in the index.


    ## Using endl: inputoutput manipulators


    Like we have said, programming languages are as versatile as human language. You
    can express one instruction in many ways, and terminating a string is no exception.
    The difference between an escape sequence and `endl` is that `endl` flushes and
    refreshes the buffer used to store the string. Programmers use endl to clear memory
    after printing a lot of text. You can see why this is useful in memory management.
    `endl` is an example of an inputoutput manipulator. Inputoutput manipulators are
    functions that allow you to control inputoutput streams using the `<<` operator
    or the `>>` operator (`inputoutput manipulators—cppreference.com,” n.d.).


    ![image29.png](images/0040.jpeg)


    ### Using an inputoutput manipulator to delimit and manipulate the output


    This screenshot is the successful run of our edited “hello. World” program in
    split-screen mode. Using ![0041.jpeg](images/0041.jpeg), we were able to get our
    expected output. In a program this small, it is difficult to see the effects of
    using a memory manipulator. Manipulators only begin to make a difference when
    using them in called functions.

