    你已经看到在 C++ 中有许多方法可以实现某件事，所以请利用这一点。不要害怕实验和尝试新事物，并去学习你感兴趣的其他事情的方法。书中的练习并不是标准答案，编程中并不存在这样的东西。


    ## 结论


    学习编程是一场认知之旅，是一段充满人心、兴奋且有时令人沮丧的旅程。当我们到达这本书的结尾时，回顾我们学到的一些课程是很重要的。


    ## 扩展你的练习：准备你的环境


    有很多支持 C++ 的编程环境和文本编辑器。有些会有多个版本的 C++。在编写本文时，C++ 的最新版本是 17，但支持最好的是 C++14。C++ 14
    是 C++ 的演进版本，它具有更易于理解的语言特性。你可以预计这一趋势将持续。大多数编程环境中旧旧且广泛提供的 c++ 版本是 c++11。

