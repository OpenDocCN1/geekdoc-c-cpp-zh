    `iostream` 库中的另一个对象。


    #### 使用转义序列


    虽然在输出中编写字符串并换行看起来很有诱，但行不通的。它会破坏代码且无法运行。不信我的话？试试看！你可以通过转义序列来添加换行。转义序列用于许多需要在字符串中引入特殊字符的实例。它也可以添加行，如下所示：


