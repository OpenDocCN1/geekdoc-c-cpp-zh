    \ a data type, just like the `main()` function returns `int`. If a function does\
    \ not, `void` is used as the return type. As you might have guessed, the return\
    \ is the statement that terminates the function. The inputs that functions receive\
    \ are called parameters or arguments. Not all functions will take inputs as we\
    \ have seen with `main()`; regardless of this, you can still pass parameters into\
    \ the function for it. This is how libraries pass objects into `Main`.\n\n###\
    \ Create and call a function\n\nTo begin calling a function, you must declare\
    \ and define it before `main()`. This is because c++ executes sequentially. c++\
    \ practices take precedence and functions get priority so you can call them. They\
    \ are also called this way because they make code more organized. Once a function\
    \ is declared, we can define it outside `main()`. Let’s write a simple function\
