    Programmers spend a lot of time automating mundane, repetitive tasks through scripts
    and routines. What allows scripts and routines to achieve this are loops. As the
    name suggests, loops repeat the same instructions as long as a certain condition
    is met (“c++ while loop,” n.d.). Loops are often used to navigate aggregated objects
    with indices like arrays and vectors. For instance, you might write a loop that
    keeps searching an array until a specific item is found. There are two types of
    loops: entry-controlled loops and exit loops.


