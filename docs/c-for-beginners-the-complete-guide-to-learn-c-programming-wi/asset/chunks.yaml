    # Operators


    Operator for the atomic multiplication, used to combine the `*` and `=` operators.
    This operator first multiplies the current value of the variable on the left to
    the value on the right and then assigns the result to the variable on the left.
    For example, `x*=y` would be a shorter way of writing `x=x*y` without having to
    use a separate arithmetic operator.


    ## Assignment Operators


    ### `/`

    Binary division "forward slash" operator that divides the first operand into the
    second.


    ## Arithmetic Operators


    ### `/=`

    Atomic division operator is a combination of `/` and `=` operators. This operator
    first divides the current value of the variable on the left by the value on right
    and then assigns the result to the variable on the left. For example, `x/=y` would
    be a shorter way of writing `x=x/y` without having to use a separate arithmetic
    operator.


    ## Using Escape Sequences


    ### `\?` escape sequence

    Used for question marks.

    Using escape sequences


    ### `\''` escape sequence

    Used for single quotes.

    Using escape sequences


    ### `\"` escape sequence

    Used for double quotes.

    Using escape sequences


    ### `\\` escape sequence

    Used for backslashes.

    Using escape sequences


    ### `\f` escape sequence

    Stands for "form feed" and is used to go to the next "page".

    Using escape sequences


    ### `\n` escape sequence

    Stands for "line feed" and is used to go to the next line.

    Using escape sequences


    ### `\t` escape sequence

    Stands for "horizontal tab" and adds 5 spaces horizontally.

    Using escape sequences


    ### `\v` escape sequence

    Stands for "vertical tab" and is used for spacing in vertical languages.

    Using escape sequences


    ## Unary Operators


    ### `&` unary operator

    Address operator that is used to point to the address of a variable.


    ### `&`, binary operator

    Bitwise and that takes two numbers as operands and does and on every bit within
    the stream of the two numbers. The result stream of `and` is 1 only if both bits
    are 1.


    ## Bitwise Operators


    ### `&&`

    Binary logical "and" operator that returns a boolean true when both the conditions
    in consideration are satisfied. Otherwise, it returns false.

    ## Logical Operators


    ### `%`

    Binary modulus operator that returns the remainder from dividing the first operand
    into the second.

    ## Arithmetic Operators


    ### `^`

    Bitwise xor that takes two numbers as operands and does xor on every bit within
    the stream of the two numbers. The result stream of xor is 1 if the two bits are
    different.

    ## Bitwise Operators


    ### `+=`

    Operator for atomic addition, used to combine the `+` and `=` operators. This
    operator first adds the current value of the variable on the left to the value
    on the right. It then stores the result to the variable on the left. For example,
    `x+=y` would be a shorter way of writing `x=x+y` without having to use a separate
    arithmetic operator.

    ## Assignment Operators


    ### `<`

    "less-than" operator that checks whether the first operand is less than the second
    operand. If so., this operator returns a boolean true. Otherwise, it returns false.

    ## Relational Operators


    ### `<<`

    Left shift operator that takes two numbers and left shifts the bits of the first
    operand. The second operand is used to determine the number of places to shift.

    ## Bitwise Operators


    ### `<=`

    "lesser-than or equal-to." operator that checks whether the first operand is less
    than or equal to the second operand. If so., this operand returns a boolean true.
    Otherwise it returns false.

    ## Relational Operators


    ### `=`

    Equal assignment operator, used to assign the value on the right to the variable
    on the left.

    ## Assignment Operators


    ### `==`

    "equal" operator that checks whether two given operands are equal. If the operands
    are equal, it returns a boolean "true", if not it returns false.

    ## Relational Operators


    ### `>`

    "greater-than" operator that checks whether the first operand is greater than
    the second operand. If so., this operator returns a boolean true. Otherwise, it
    returns false.

    ## Relational Operators


    ### `>=`

    "greater-than or equal-to." operator that checks whether the first operand is
    greater than or equal to the second operand. If so., this operand returns a boolean
    true. Otherwise, it returns a boolean false.

    ## Relational Operators


    ### `>>`

    Right shift operator that takes two numbers and right shifts the bits of the first
    operand. The second operand is used to determine the number of places to shift.

    ## Bitwise Operators


    ### `|`

    Bitwise or that takes two numbers as operands and does or on every bit within
    the stream of two numbers. The result stream of or is 1 if any of the two bits
    is 1.

    ## Bitwise Operators


    ### `||`

    Binary logical "or" operator that returns a boolean true when one (or both) of
    the conditions in consideration are satisfied. If none of the conditions are satisfied,
    it returns false.

    ## Logical Operators


    ### `~`

    Bitwise not operator that takes one number and switches the state of all the bits
    (1s to 0s, 0s to 1s).

    ## Bitwise Operators


    ## Basic Data Types


    ### `bool` keyword

    Datatype keyword that is short for "boolean" and stores values with two states:
    true or false. Has a size of 1 byte. These values can be expressed as either "0/1"
    or "false/true" with a manipulator.

    ## Basic data types


    ### `boolalpha/nobalpha` manipulator

    Input-output manipulator that switches between using "0/1" to "false/true" for
    boolean values.

    Using `endl`: input/output manipulator


    ### `char` keyword

    Dat type keyword that is short for "character" and stores single characters regardless
    of their capitalization. Has a size of 1 byte. Char values are surrounded by single
    quotes.

    Basic data types


    ### `cout` object

    C++ programming object part of `<iostream>` library that allows a program to print
    values and text using `<<`. This object must be defined with a datatype, usually
    `std`.

    Using `cout`


    ### `double` keyword

    Data type keyword that is used to store numbers with decimals with 15 decimal
    digits. Has a size of 8 bytes. This data type can hold more decimal numbers and
    is preferred for mathematical calculations.

    Basic data types


    ### `else`

    Statement is used to specify code in the event that its accompanying `if()` expression
    is false. Else cannot be used with `if()`.


    ### `endl` manipulator

    Input-output manipulator that outputs `\n` and flushes the output stream.

    Using `endl`: input/output


    ### `ends` manipulator

    Input-output manipulator that outputs `\0` [zero].

    Using `endl`: input/output


    ### `float` keyword

    Keyword data type that stores numbers with decimals with 7 decimal digits. Has
    a size of 4 bytes. This data type is preferred for holding monetary numbers.


    ### `flush` manipulator

    Input-output manipulator that flushes the output stream.

    Using `endl`: input/output


    ### `get_money` manipulator

    Input-output manipulator that receives an input as a monetary value. This manipulator
    works in c++11 only and may cause errors in outdated C++ programming environments.

    Using `endl`: input/output


    ### `get_time` manipulator

    Input-output manipulator that receives an input as a date/time value according
    to a specified format. This manipulator works in c++11 only and may cause errors
    in outdated C++ programming environments.

    Using `endl`: input/output


    ### `int` keyword

    Keyword that is short for "integer" and stores whole numbers. Has a size of 4
    bytes. This keyword includes positive and negative integers.


    ### `put_money` manipulator

