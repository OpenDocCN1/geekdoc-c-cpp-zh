    ### Unary operator routine with post and pre-operations


    This screenshot is of our unary operator program. To study it fully, you can access
    it on our saved workspace using this url: [https://ide.geeksforgeeks.org/mvtykyc4](https://ide.geeksforgeeks.org/mvtykyc4)


    The program operates on `a` while it calculates, it stores the value in `buf`
    we can observe comparing `a` with the `buf`, the post-operation delays changing
    the value of `a`; in contrast, pre-operations change the value immediately. On
    top of all, we have the `sizeof()` operator. It looks like a function but it is
    categorized as an operator. It checks the size of an object and returns the size
    in bytes.


    Recall our conversation about bit streams. What didn’t say is that they are often
    divided into a group of 8. One byte is a single 8-bit stream that can present
    255 numbers. In our bitwise routine, our registers were 1 byte long, that was
    because we were working with numbers that were less than 255. Let’s write a program
    that can get the size of an array using `sizeof()`. Here we go:


