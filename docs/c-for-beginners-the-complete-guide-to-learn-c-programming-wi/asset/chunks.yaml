    在我们的示例中，我们很好地使用了值传递。`main` 使用的变量（`a`、`b`）与 `max()` 中的变量（`x`、`y`）位于不同的位置。你可以看到，在较大的程序中，`main()`
    可能会发生多个复杂的计算，这会非常有用。优选传递值，因为这确保实际变量在函数被再次调用之前一直存在。


    使用引用传递参数有自己的优势，特别是在较大的程序中。使用引用传递非本质值可以加快程序运行并提高响应速度。用于函数自动化的脚本可能会使用引用传递参数，因为自动化过程可能会反复且快速地发生。这些特性是基于引用的结构的卖点。现在让我们把转向代码的压缩和优化。


    ## 函数重载


    所有定义的对象和类必须具有唯一的名称。你不能运行具有两个相同变量的程序，否则将抛出错误。你可能之前在我们处理例程和演示时见过这种情况，特别是当我们必须修改程序时。所以请记住：声明两次的变量会导致错误。但奇怪的是，只要参数不同，多个函数可以与其他函数具有相同的名称。这在函数返回不同数据类型的情况下是允许的。尽管如此，最好通过重载函数来返回多种数据类型。这就是所谓的函数重载；这是一个程序员组合多个函数以接收多种数据类型的过程。为什么呢？因为它简化并整合了代码。请看以下代码（“c++
    函数重载”，n.d.）：


