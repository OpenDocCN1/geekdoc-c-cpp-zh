    That was a good example of two unary operations: `sizeof()` and the address pointer
    `&`. The `for()` loop we used to print the array is called a copy constructor
    call. Constructor copy calls consist of a `for()` loop with an index variable,
    an address operator, and a container object with an index. The copy constructor
    sets up `[0]: [the size of arr]` by using the address pointer to automatically
    deduce the `[size of arr]` and print its contents. In simple words, a copy constructor
    uses address operator to reduce the size of the program.


    The `sizeof()` operator is an objective operation and it uses a single operand,
    the `arr` array object. They both have disadvantages and advantages. The `sizeof()`
    operator uses one operand and is easier to spot without esoteric memory registers.
    The call combination had to use an additional object (`e`), to print the array
    but it would have done with less incrementing operators. We are going to discuss
