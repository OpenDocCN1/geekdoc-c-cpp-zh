    # C++ 力量：高级字符串


    我们将查看的另一个数据类型是字符串（strings）。字符串是计算机科学中最流行的数据类型之一；它们是字符序列。将它们想象成句子可能会有所帮助，但并不是每个句子都代表一个字符串。我们已经在我们的“hello
    World”应用程序中看到它们如何工作。字符串是一个独立的数据类型，拥有它们自己的库。为了操作和处理它们，程序需要适当的头文件——string 库。这些库具有方法和功能，允许程序操纵字符串。


    ## 操作：字符串拼接


    字符串拼接（String concatenation）是将不同的字符串组合成一个字符串的过程。它是字符串的合并。这是程序最常见的功能之一。例如，当你在网站或游戏中输入名字，然后切换到另一个页面时，屏幕上欢迎你“hello.,
    [your_name]!”，程序就是使用了拼接来实现这一点的。它将“hello,”与你的名字以及最后的“!”结合在了一起。


    在 C++ 中，字符串拼接通过 `+` 运算符完成。让我们通过创建一个打印带有问候语的输入字符串的程序来演示。为了实现这一功能，我们必须包含 `<string>`
    库，它包含了处理字符串所需的对象和语句。


