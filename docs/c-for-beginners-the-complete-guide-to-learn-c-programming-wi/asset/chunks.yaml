    \ 库\n3. 声明操作数变量及其值\n\n`![00130.jpeg](img/00130.jpeg)`\n`![00131.jpeg](img/00131.jpeg)`\n\
    \n1. 声明用于计算的寄存器 `c`\n`![00132.jpeg](img/00132.jpeg)`\n1. 打印操作数的值及其对应的寄存器：\n\n\
    `![00133.jpeg](img/00133.jpeg)`\n`![00134.jpeg](img/00134.jpeg)`\n`![00135.jpeg](img/00135.jpeg)`\n\
    `![00136.jpeg](img/00136.jpeg)`\n\n注意：由于所有数字都小于 255，我们将整个练习中使用 `![00137.jpeg](img/00137.jpeg)`\
    \ 的位流。\n\n1. 为 `![00138.jpeg](img/00138.jpeg)` 计算位 `and`\n`![00139.jpeg](img/00139.jpeg)`\n\
    1. 在 `![00140.jpeg](img/00140.jpeg)` 中打印结果和寄存器\n\n注意：由于我们在使用位函数，最好使用 `![00141.jpeg]`\
