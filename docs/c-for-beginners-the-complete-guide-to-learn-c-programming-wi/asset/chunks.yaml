    数据类型指定存储在变量中的信息的大小和类型。每个类型都有自己的关键字和关联的大小（“c++数据类型”）：


    - “![00057.jpeg](img/00057.jpeg)”：关键字是“integer”的缩写，存储整数。大小为 4 字节。

    - “![00066.jpeg](img/00066.jpeg)”：存储带有 7 位小数的小数数字。大小为 4 字节。

