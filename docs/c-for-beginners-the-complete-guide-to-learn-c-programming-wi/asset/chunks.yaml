    ## Chapter 4: operations in c++


    We talked about how c++ is mainly a back-end, server-side language that is suited
    for controlling servers and other decision-making utilities for delivering content.
    In the last chapter, we looked at small ways that c++ handles data by looking
    at strings. In it, we saw the central role that operations play. Operations allow
    us to control loops and decision making in programs. A better understanding of
    operations allows us to add more functionality to our programs. Functionality
    is how programmers use methods and features of a language to achieve an end. We
    have seen how these string handling methods work, but what would be better is
    if we used those features in a context that allows us to achieve a particular
    end, like content management.


    **Note**: “operand” describes the value being operated on. “operator” describes
    the symbol indicating the operation being carried out. The following is a list
    of operations in c++, categorized by how many operands they accept:


    *   **Unary**: accept only 1 operand.

    *   **Binary**: accept 2 operands.

    *   **Ternary**: accept more than 2 operands.


    They are further divided into:

    1.  Arithmetic

    2.  Relational

    3.  Logical

    4.  Bitwise

    5.  Assignment

    6.  Other


    In this chapter, we will look at 5 types of operations and their functionalities.


    **Note**: operators have precedence, just as in mathematics. For example, parentheses
    which are used to call a function have higher precedence. However, you should
    try to keep your lines of code as simple as possible.


    ### Binary operators


    Binary operators are the majority of operations you find in c++. As the name suggests,
    binary operators compare operands. They are perfect for decision-making and controlling
    switches.


    ### Arithmetic operators


    They are the most common and well understood of all operations because of how
    much we use them even outside programming, since they are primarily mathematical.
    We use them to perform mathematical operations.


    **Note**: in the string concatenation example, the used to concatenate was not
    an arithmetic function. Instead, it was a function of the library that handled
    the concatenation. Most operators in this category require two operands. The only
    exceptions are the unary `++` and `--` which we use to increase or decrease within
    a loop. The binary operators are:


    *   `+`: the addition operator that adds two operands.

    *   `-`: the subtraction operator that subtracts one operand from another.

    *   `*`: the multiplication operator that multiplies two operands.

