    For now, let’s turn our attention to ternary operators.## Ternary operators


    C++ only has one ternary operator. Ternary operators, also called conditional
    operators, take 3 or more operands – they are logic-based operators. The result
    is always determined by whether or not the first expression is true, then the
    second will be evaluated; if the first expression is false, the third expression
    will be evaluated. If you recall our if()…else statement in the relational program
    routine, it had three parts: an initial expression that the function evaluates,
    an expression it evaluates if the initial expression is true, and an else statement
    which is evaluated when the initial expression is not true. Conditional operators
    have the same components as an if()…else statement. They are just more compact.


