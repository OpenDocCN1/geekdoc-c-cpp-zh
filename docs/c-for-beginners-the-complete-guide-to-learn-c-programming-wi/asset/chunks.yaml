    ## 关系运算符


    大多数程序（不仅仅是 C++）都使用条件和循环来控制流程。本节运算符用于执行条件切换。例如，在游戏中，游戏引擎会根据玩家与游戏的交互方式进行调整。它为玩家提供了更具参与感且动态体验。


    如果玩家快速完成挑战，可能意味着他们觉得游戏太简单了。结果是游戏通过增加难度来调整，但不会过头。如果游戏太难，引擎可能会通过让游戏变得更容易来应对。这被称为动态游戏，它的发生是因为编程语言具有条件切换功能。条件切换（即适应）是通过比较两个值的关系运算符实现的。所有的关系运算符都是二元的（jaggi,
    2015b）。它们如下：


    “![00099.jpeg](img/00099.jpeg)”: “等于”运算符，检查给定的两个操作数是否相等。如果操作数相等，它返回布尔值 `true`；否则，返回
    `false`。


    “![00100.jpeg](img/00100.jpeg)”: “不等于”运算符，同样检查给定的两个操作数是否相等。然而，如果操作数不等，该运算符返回布尔值
    `true`；如果操作数相等，则返回 `false`。


    “![00101.jpeg](img/00101.jpeg)”: “大于”运算符，检查左侧操作数是否大于右侧操作数。如果是，该运算符返回布尔值 `true`。否则，返回
    `false`。


    “![00102.jpeg](img/00102.jpeg)”: “小于”运算符，检查左侧操作数是否小于右侧操作数。如果是，该运算符返回布尔值 `true`。否则，返回布尔值
    `false`。


    “![00103.jpeg](img/00103.jpeg)”: “大于等于”运算符，检查左侧操作数是否大于或等于右侧操作数。如果是，该运算符返回布尔值 `true`。如果不是，返回布尔值
    `false`。


    “![00104.jpeg](img/00104.jpeg)”: “小于等于”运算符，检查左侧操作数是否小于或等于右侧操作数。如果是，该运算符返回布尔值 true。如果不是，返回
    false。


