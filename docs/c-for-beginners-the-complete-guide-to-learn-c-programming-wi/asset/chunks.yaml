    practice. You should practice the same code successfully with the namespace. Remember
    that you can reset the workspace to the successful state using the url.


    ## Basic data types


    Data types specify the size and type of information stored in a variable. Each
    has its own keyword and an associated size (“c++ data types,”):


    - “![00057.jpeg](images/00057.jpeg)”: keyword is short for “integer” and stores
    whole numbers. Has a size of 4 bytes.

    - “![00066.jpeg](images/00066.jpeg)”: stores decimal numbers with 7 decimal digits.
    Has a size of 4 bytes.

    - “![00058.jpeg](images/00058.jpeg)”: stores decimal numbers with 15 decimal digits.
    Has a size of 8 bytes.

    - “![00059.jpeg](images/00059.jpeg)”: keyword is short for “character” and stores
    single characters regardless of their capitalization. Has a size of 1 byte.

    - “![00061.jpeg](images/00061.jpeg)”: keyword is short for “boolean” and stores
    values that have a state of either true or false. Has a size of 1 byte.


    Note: recall the `![00060.jpeg](images/00060.jpeg)` data type. We have worked
    with this special datatype extensively. String values can vary in size. Due to
    this, they are handled in the `iostream` library to apply more flexibility for
    text handling. We’ll return to `strings` and discuss some advanced topics in the
    next section.


    These sizes matter for data handling. For instance, when you use `int` with `float`/`double`
    all those numbers will be converted to `int`. It is because the compiler uses
    4 bytes to calculate integers which have the allocation for decimals. The program
    will still run but your calculations will not be accurate. Let’s explore this
    more by modifying our program and looking at the results. We are going to be using
    a long-popular decimal number (pi):


    ![00067.jpeg](images/00067.jpeg). It will test the limits of `float` and `double`.


    ![image33.png](images/00068.jpeg)


    ### Using int with float or double


    This screenshot is a successful test run of our modified program calculating `![00069.jpeg](images/00069.jpeg)`,
    `![00070.jpeg](images/00070.jpeg)`, `![00071.jpeg](images/00071.jpeg)`, and `![00072.jpeg](images/00072.jpeg)`,
    which are not modified to store decimals. As a result, the result is missing the
    decimals.


    To get the result we are looking for, it would be best to change the variable
    data types. Will using `float` data types differ from `double` data types? Can
    we expect a different result? Remember you can reset by going to a successful
    state of the workspace using the url.


    ![image51.png](images/00073.jpeg)


    Comparing float and double

