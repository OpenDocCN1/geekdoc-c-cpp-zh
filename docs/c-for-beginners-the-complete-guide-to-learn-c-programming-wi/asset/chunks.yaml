    I encourage you to set up a local IDE and work on it. It will allow you to grow
    faster and get accustomed to real-world scenarios. We have spoken of code blocks
    for microsoft and xcode of mac. If you have linux, there are standardized options
    you can use across all distro. Linux is a console-based environment that is highly
    preferred by software developers because console-based environments are entrenched
    with many built-in features that directly interact with programs.


    There are many dist that provide a gui-based desktop that is preferable for many
    users. Most of them are open source, free to download and install. We highly recommendcentos,
    a free linux distro. Server management. CentOS uses many of red hat enterprise
    linux (`rhel`) components. It is the best distro for preparing to work in red
    hat server management environments.


    ## Coding best practices: ownership of learning and collaboration


    In our time together, we have seen many techniques and best practices for software
    development. In the first chapter, we talked about how programs should fulfill
    their tasks with as little code as possible. Thankfully, with each new version
    of `c++`, more ways of doing this are added. The majority of beginner programming
    courses teach older, less efficient methods of implementing common programming
    tasks like parsing arrays, conditional statements, and calling functions. You
    will find most of these techniques are never used in actual programming situations.
    Most beginner courses are focused on equipping beginners with a strong grasp of
    the basics – the foundation of your knowledge is often as important as how you
    are going to progress. As you grow, you will find more efficient ways of solving
    problems with your code, but this can only happen if you practice and study.


    If you want to improve as a programmer, you have to take ownership of your learning.
    Learn pre-development tools like algorithms. It is all about learning to fix problems.
    There are other pre-development tools you can try, like diagraming. Diagraming
    is good for individuals who are visual learners. All of these are great for growing
    as a programmer; it does not matter which you choose, as long as pre-development
    tools are something you take advantage of.


    Turning back to `algorithms`, more detailed algorithms will explain all sorts
    of data types required for inputs, outputs, and other data. The advantage of algorithms
    is that you can use them as a shorthand. You can also annotate and manage your
    code. These habits will help keep your code ordered and coherent to your team
    members. All these practices will help enhance how you see and think about programs.


    Software developers work in teams, with several people working on the same piece
    of code at the same time. The importance of annotating your code becomes very
    apparent in such situations.


    It also happens that working with others will accelerate your growth. When coding
    with others, you learn from their experience and knowledge. As we have said, `c++`
    has a variety of library objects, statements, and other tools. It is as rich as
    vocabulary in human languages because there are many ways of doing the same things.
    Your way of fixing a problem will depend on your ability to see efficient ways
    of doing so. But ultimately all programming and software developments are creative
    endeavors. Working with others will increase your programming “vocabulary” – you
    will learn from how creatively they fix problems and you will find insights of
    your own in the process. You should always keep in mind that everyone can contribute
    something and what they contribute is heavily influenced by the amount of experience
    they have. So, even if you are new to `c++`, you still have a unique experience
    and approach to solving problems that other people don’t have because you think
    differently. That in itself is valuable to any team, particularly if you learn
    to communicate your ideas well. I highly recommend you use the glossary as one
    of the ways to help you communicate clearly.


    In addition to annotations, it is good practice to make your code as clean as
    possible. I have demonstrated how to comment lines of code to prevent breaking
    the code during editing. In your exercises, when you break the code beyond repair,
    you can always start over from our saved ideas, or you can simply refresh the
    browser to start over (this will depend on the state you ran and generated the
    code). Only generate-urls when you need to save your code, not while you are developing.


    We also stressed the importance of code structure. For instance, we talked about
    the importance of declaring and defining functions: the best practice is to declare
    your functions on the top and define them after the `main()` function. It is similar
    to declaring integers. The techniques ensure you have an inventory of functions,
    variables, and objects right at the beginning. It works like an index and can
    help you avoid definition errors.


    Formatting and editing your code unnecessary lines reduces the possibility of
    errors during development. You should always update your comments when you make
    a change. Unformatted code will not impact performance, the logic of the code
    will. It is a collaboration courtesy to format your code, not to mention how much
    easier it makes for you. Other programmers on your team will be able to implement
    your code, or even improve it, and they will leave comments.


    But these types of practices are not just good for you. As the world moves forward
    it is becoming more and more complicated, so it is good for programs to explain
    themselves to the user. If your program prints, make sure it is easy to read.
    We have seen how this can be done in this book. Use escape sequences like `\n`
    to create new lines and `\t` to create horizontal table so there is enough whitespace
    to your code. But as a back-end programmer working with servers and other equipment,
    you may not have to print as often as a front-end programmer who serves content
    to the client. The only users who may need to see your prints are other technicians
    and administrators managing those machines through the terminal. Formatting practices
    are often underused in backend programming, but it is still a good practice to
    have. It is valuable to administrators and technicians, who do not have the resources
    to navigate esoteric compiler-generated errors that programmers are used to when
    debugging.


    ## Take away: computer science concepts in `c++`

