    As you have noticed in the example, there are comments in the code that explain
    what each part of the code does. These comments are preceded by `//`. The compiler
    will not read any lines of code preceded by `//` because they don’t do anything
    but help other people working on the code read what the code does. It is good
    practice to include comments in your code so people know what each line of code
    does.


    # Overview of the C++ syntax


    We have talked about the importance of syntax for the compiler, but it is also
    important to understand the syntax of a programming language because it will allow
    you to debug the code. Just like with human languages, if you know the rules of
    a language you can correct yourself easily when you make mistakes. Debugging is
    the process of finding and removing errors and abnormalities in the code, also
    known as “bugs” (“what is debugging?” N.d.). It is a process of correction.


    IDEs have debugging tools that highlight where errors occur in the code, but these
    features aren’t always reliable. For instance, leaving out a semicolon to terminate
    a line of code is a common error, but the debugger will highlight the error in
    the `.h` file instead of the code where the mistake happens in the program file
    `.cpp`. Most debuggers are not intelligent enough to detect an absence of something
    and will throw the verbose error that the compiler gives when the unterminated
    line violates a rule in the library. However, a programmer will pick up the error
    simply when they notice the red semicolon line is missing from one of the lines.


    ![image38.png](images/00022.jpeg)


    “hello. World” program in geeksforgeeks ide without a line delimiter


    This screenshot features “hello. World” with a missing delimiter. Immediately
    you will notice that the ide has different syntax highlighting for C++ than the
    programming environments we explored in the previous chapter. Syntax can vary
    from platform. This is why we are standardizing the process with geeksforgeeks.
    In our chosen ide, semicolons are not highlighted. However, the ide can make up
    for this by recognizing and annotating semicolons, as highlighted in the screenshot.
    You can practice and explore this program by going to its generated url: `https://ide.geeksforgeeks.org/mzbupp6sl`.


    ## Debugging C++


    It is easy to see this when the code is small, but when working on a larger project
    the task can be difficult. I have heard of programmers who spend a week or more
    trying to fix a line in their code to discover something very minuscule like a
    missing letter or mismatch. To make debugging easier, it is advised that you separate
    code into smaller modules (“what is debugging?” N.d.). Many errors can be found
    and easily dealt with this way.


    Let us look at the “hello. World” program and study its syntax in detail. While
    syntax highlighting may vary across different platforms, these aspects of code
    are consistently highlighted on all platforms.


    ### Comments

    As I said, these are the lines of code that the compiler will ignore. They are
    used to annotate code and leave helpful explanations for other programmers. This
    is great because normally when we code with others, it is advised that you leave
    comments in your algorithm to simplify it for others. In most platforms comments
    will be highlighted green. Comments are always preceded with `//`.


    ### Header file library

    Lines that start with `#` are used by the compiler to call library functions.
    These lines are very essential, so they appear in every program. In the “hello.
    World” example we call a library that is used to manage strings. These lines of
    code will be highlighted in different colors across different platforms. In geeksforgeeks
    the color is purple.


    ### Statements

    Statements describe the beginning of a line of code with instructions that the
    compiler recognizes. This includes declaration handling instructions, like `using...`
    or `return...`. In our hello world program. They are also highlighted differently
    across platforms. On geeksforgeeks they are highlighted purple.


    ### Functions

    This is code that encapsulates instructions. It may take inputs and output a result.
    Every function is written like this: `[function_name()` followed by curly braces
    `{}`. Anything in the curly braces is the set of instructions that will be executed.
    In our example, `main()` is the function that initiates the instructions that
    will output “hello. World” with `cout`. In a `.cpp` program, `int main()` must
    always appear for the program function.


    ![Text Box 58](images/00023.jpeg)


    ### Data

    These are variables and other kinds of data functions and statements. In the geeksforgeeks
    ide, they are highlighted blue.


    ![image31.png](images/00024.jpeg)


    # Comparison of “hello. World” program in geeksforgeeks ide and the geeksforgeeks
