    These binary assignment operators combine assignments and arithmetic functions.
    They work well when controlling loops and conditional statements. Atomic assignment
    operators are closely related to unary arithmetic operators. Both are frequently
    used to control loops. Let’s take a look at unary operations.## Unary operations


    Before we discuss unary operations, let’s look at code that uses them.


    ![image5.png](images/00161.jpeg)


    ### While loop featuring a unary operator


    This screenshot is of a simple while loop that prints the value of the counter,
    ![00162.jpeg](images/00162.jpeg) will cause an error as the while loop would not
    be able to advance. We will talk about loops extensively in the [decision making
    chapter](https://docs.google.com/document/d/1rfTukE008PScFE0mgrN2m-UKMEAv4Y8VYrXHB3BjvOU/edit).
    To study it fully, you can access it on our saved workspace using this url: [https://ide.geeksforgeeks.org/mgmutzdlpb](https://ide.geeksforgeeks.org/MgMUtZdlpb)


    The `i = 1 + i` is the same as `i++`. Using the unary form makes the code neater
    because it precludes the `+` arithmetic operator and the `=` assignment operator.
    We can also use an atomic addition operator to complete the code: `i+=1` is the
    same as `i++`. But a format like that would require the compiler to store and
    operate on an additional operand. Unary operators are there to simplify code by
    only having one operand. Remember, unary operators are those operators that use
    one operand. Here are some of the other examples of unary operators (kumar, 2017):


    *   “![00163.jpeg](images/00163.jpeg)”: increment operator used to increase the
    value of an integer by 1. It can be placed in front of a variable to increment
    the value immediately or after to temporarily save the value before increment.

    *   “![00164.jpeg](images/00164.jpeg)”: decrement operator used to decrease the
    value of an integer by 1. Similar to the increment, programmers can also implement
    pre-decrement and post-decrement instructions.

    *   “![00090.jpeg](images/00090.jpeg)”: unary minus operator that is used to change
    the sign of a variable or argument. Performing a unary minus operation on a negative
    integer will make it positive and vice versa.

    *   `!`: not operator is used to reverse the boolean logical state of an operand.
    For example, if a variable ![00165.jpeg](images/00165.jpeg).

    *   `&`: address of operator that is used to point to the address of a variable.


    Let’s make a unary operator routine to see how the pre- and post-instructions
    work. Follow these instructions:


    1. Open a new ide workspace

    2. Declare and initialize our variable and a buffer: `int a = 10, buf`

    3. Print an explanation of the program and the starting value

    4. Calculate a post-increment equal to `buf` and print the result

