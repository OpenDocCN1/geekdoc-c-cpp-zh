    ## 目录

    - 引言

    - 第 1 章：搭建 C++ 开发环境

    - 第 2 章：C++ 基础、编程原理

    - 第 3 章：变量与数据类型

    - 第 4 章：C++ 中的操作

    - 第 5 章：C++ 中的决策判断

    - 第 6 章：创建函数

    - 结论

    - 参考文献


    ## 引言

    本书适合初学者以及对进入后端编程感兴趣的编码人员。尽管 C++ 有时被描绘成过去的幽灵，但这门语言依然在我们身边，并继续支撑着我们今天使用的一些顶级技术——更不用说它在游戏领域中的巨大影响。它的强大和多功能性使其成为我们时代最重要的语言之一。它不会消失，学习它将开宽你的视野。


    由于 C++ 处理开销较小，它经常被作大数据的后端语言。spotify、adobe、youtube 和 amazon 等公司使用 C++ 驱动其后端，你很快就会明白原因。


    C++ 也是强大游戏引擎后后。游戏引擎允许程序员无需从头编写所有代码即可构建游戏，并有效地渲染内容。Unity 游戏引擎和 Unreal 引擎就是运行在 C++
    之上的游戏引擎示例。


    C++ 是一门优、高效的语言，因为它具有极佳的性能/硬件比例：对于它提供的性能，所需的硬件资源很少。这就是为什么学习它的人喜爱它。


    在书中，我们将涵盖以下主题：

    * 编程术语和编程原理

    * 搭建 C++ 环境

    * 入门：语法、数据类型和变量

    * C++ 的威力：操作、循环、分支语句和决策判断

    * 在 C++ 中创建自定义函数


    你还可以在书末找到一个实用的术语表，这样一旦你开始学习，就可以将本书作为参考。


    ## 第 1 章：搭建 C++ 开发环境

    从根本上说，编程是用代码编写一份机器可以理解的指令列表。这些代码存在于可执行文件中。这些文件带有扩展名，告诉编译器文件中的是什么语言。这些扩展名是你经常在文件末尾后缀，例如
    `.js`、`.cpp` 或 `.hpp`。


    要编写代码并保存到可执行文件中，你需要以下物品：

    1. 一个文本编辑器：这将允许你编写和编辑代码。

    2. 一个语言编译器：该程序将你编写的代码翻译成计算机可以理解并遵循的机器语言。


    所有的编程语言都是这样工作的，但 html、css 和 javascript 例——这些程序由浏览器解释并执行（“introduction,” n.d.）。这意味着像
    javascript 这样的浏览器语言是基于软件的，而 C++ 是编译后直接在你的机器上运行，而不是在软件环境中。


    这意味着 C++ 是一种汇编语言。汇编语言是低级编程语言，需要编译器并在机器上运行（lithmee, 2018）。在这种语境下，“低级”一词并不带有负面含义；它是描述性的，意味着这种语言更接近机器，或者与机器仅一步之遥。


    正如你可能猜到的那样，C++ 是一种通用语言，可以在几乎任何运行。这意味着可以通过多种不同的方式进行汇编和编译。这在很大程度上取决于你的操作系统以及你正在使用的创建工具。


    我们的 C++ 练习将在在线 IDE 上编译。IDE 代表集成开发环境（Integrated Development Environment），用于编辑和编译代码。我打赌这个描述听起来很熟悉。是的，IDE
    是文本编辑器的一个例子，但与纯文本编辑器不同，它具有对编程过程重要的额外功能。IDE 可以执行编译代码、调试代码、高亮代码、警告你语法错误等操作。


    ![image44.png](img/00001.jpeg)

    Geeks for geeks ide：一个基于 Web 的编译器


    这个 IDE 可以在 [`ide.geeksforgeeks.org/`](https://ide.geeksforgeeks.org/) 找到，并包含多种编程语言。我们将专注于
    C++。这个 IDE 有许多编码工具：一个标签工作空间、一个输入框和一个代码管理器。这个代码管理器包含了左侧显示的两个底部按钮。这些代码管理器按钮允许你下载带有相应文件扩展名的代码文件并上传。此
    IDE 还允许你运行并生成 URL。我们将使用这些 URL 进行我们的课程。


    在书中，我们将使用 geeks for geeks 的 Web 端 IDE，但你应该学会搭建本地 IDE。在你的职业生涯的大部分时间里，那将是你工作的地方。此外，你可以根据需求自定义
    IDE 并美化你的代码。


    ### 设置你的文本编辑器

    专注于编程的 IDE 环境始终包含一个文本编辑器和一个编译器。非 IDE 环境将编译器和纯文本编辑器分开。在非 IDE 设置中，文本编辑器作为编程界面；这仅仅意味着文本编辑器将是你摆弄代码的地方。


    ![Text Box 56](img/00002.jpeg)

    在寻找文本编辑器时，你需要一个具有语法高亮和缩进功能的，因为所有的编程语言都遵循其语法。这是因为你希望能够轻松地阅读自己的代码，也希望合作者也能这样做。这些文本编辑器通过提高可读性提供了帮助。这一点尤为重要，因为编码不再是也从不是一项孤独的任务。没有电影里那种单人天才。


