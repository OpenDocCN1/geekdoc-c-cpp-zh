    # 运算符


    原子乘法运算符，用于组合 `*` 和 `=` 运算符。该运算符首先将左侧变量的当前值乘以右侧的值，然后将结果赋值给左侧变量。例如，`x*=y` 是 `x=x*y`
    的更短写方式，而无需使用单独的算术运算符。


    ## 赋值运算符


    ### `/`

    二元除法“正斜杠”运算符，用于将第一个操作数除以第二个操作数。


    ## 算术运算符


    ### `/=`

    原子除法运算符是 `/` 和 `=` 运算符的组合。该运算符首先将左侧变量的当前值除以右侧的值，然后将结果赋值给左侧变量。例如，`x/=y` 是 `x=x/y`
    的更短写方式，而无需使用单独的算术运算符。


    ## 使用转义序列


    ### `\?` 转义序列用于问号。

    使用转义序列


    ### `\''` 转义序列

    用于单引号。

    使用转义序列


    ### `\"` 转义序列

    用于双引号。

    使用转义序列


    ### `\\` 转义序列

    用于反斜线。

    使用转义序列


    ### `\f` 转义序列

    代表“换页”（form feed），用于跳转到下一“页”。

    使用转义序列


    ### `\n` 转义序列

    代表“换行”（line feed），用于跳转到下一行。

    使用转义序列


    ### `\t` 转义序列

    代表“水平制表符”（horizontal tab），在水平方向上添加 5 个空格。

    使用转义序列


    ### `\v` 转义序列

    代表“垂直制表符”（vertical tab），用于垂直语言中的间距。

    使用转义序列


    ## 一元运算符


    ### `&` 一元运算符

    地址运算符，用于指向变量的地址。


    ### `&`, 二元运算符

    位与，接收两个数字作为操作数，对数字流中的每一位进行与逻辑操作。只有当两个位都为 1 时，`and` 的结果流才为 1。


    ## 位运算符


    ### `&&`

    二元逻辑“与”运算符，当考虑的两个条件都满足时，返回布尔值 true。否则，返回 false。

    ## 逻辑运算符


    ### `%`

    二元取模运算符，返回第一个操作数除以第二个操作数后的余数。

    ## 算术运算符


    ### `^`

    位异或（xor），接收两个数字作为操作数，对数字流中的每一位进行异或操作。如果两个位不同，则异或的结果流位为 1。

    ## 位运算符


    ### `+=`

    原子加法运算符，用于组合 `+` 和 `=` 运算符。该运算符首先将左侧变量的当前值加上右侧的值，然后将结果存储到左侧变量。例如，`x+=y` 是 `x=x+y`
    的更短写方式，而无需使用单独的算术运算符。

    ## 赋值运算符


    ### `<`

    “小于”运算符，检查第一个操作数是否小于第二个操作数。如果是，该运算符返回布尔值 true。否则，返回 false。

    ## 关系运算符


    ### `<<`

    左移运算符，接收两个数字并向左移动第一个操作数的位。第二个操作数用于确定移动的位数。

    ## 位运算符


    ### `<=`

    “小于或等于”运算符，检查第一个操作数是否小于或等于第二个操作数。如果是，该运算符返回布尔值 true。否则，返回 false。

    ## 关系运算符


    ### `=`

    相等赋值运算符，用于将右侧的值赋值给左侧变量。

    ## 赋值运算符


    ### `==`

    “相等”运算符，检查两个给定的操作数是否相等。如果操作数相等，它返回布尔值 "true"，否则返回 false。

    ## 关系运算符


    ### `>`

    “大于”运算符，检查第一个操作数是否大于第二个操作数。如果是，该运算符返回布尔值 true。否则，返回 false。

    ## 关系运算符


    ### `>=`

    “大于或等于”运算符，检查第一个操作数是否大于或等于第二个操作数。如果是，该运算符返回布尔值 true。否则，返回布尔值 false。

    ## 关系运算符


    ### `>>`

    右移运算符，接收两个数字并向右移动第一个操作数的位。第二个操作数用于确定移动的位数。

    ## 位运算符


    ### `|`

    位或，接收两个数字作为操作数，对数字流中的每一位进行或操作。如果两个位中任一个为 1，则或的结果流位为 1。

    ## 位运算符


    ### `||`

    二元逻辑“或”运算符，当所考虑的其中一个（或两个）条件满足时，返回布尔值 true。如果没有任何条件满足，则返回 false。

    ## 逻辑运算符


    ### `~`

    位非运算符，接收一个数字并翻转所有位的状态（1 变 0，0 变 1）。

    ## 位运算符


