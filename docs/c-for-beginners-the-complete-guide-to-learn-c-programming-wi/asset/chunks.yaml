    ## Omitting namespace


    We have already spoken about using namespace statements. We said it helps declare
    strings globally, but when it comes to a small program like “hello world” it is
    not so important. For larger programs that use several functions, it is good practice
    to use the statement to declare each string separately. This saves memory space
    in the compiler, or you will find yourself in a situation where the compiler is
    bogged down unnecessarily, having to pull the entire string namespace library
    to print code. Declaring each string separately might make your code wordier,
    but it will reduce compiler overhead, and it focuses your instructions. `std`
    namespace has multiple objects and definitions that can make it difficult for
    the computer to find the appropriate way to manipulate and define a string. The
    namespace convention is important when you have functions that are going to be
    called by multiple programs. So putting it in there unnecessarily has the potential
    of making your functions poorly defined and causing recognition errors between
    them.


    Let’s make our code more efficient by removing the `using namespace` from our
    code.


