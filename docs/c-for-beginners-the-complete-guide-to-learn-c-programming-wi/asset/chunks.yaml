  trans: "\n对于人类来说，计算这些并不容易，但这就是计算机通信的方式——通过位流（streams of data bits）。它们识别和计数这些数字，就像处理十进制数字一样容易。因此，使用在计算机原生层面运行的位操作符可以提高速度和性能\
    \ [(killian, 2012)](https://www.zotero.org/google-docs/?w3RGU2)，因为它跳过了从目标语言编程到机器语言的翻译。这就是为什么你会发现位运算在竞争性编程中经常被使用。以下是\
    \ C++ 位运算符列表（“c/c++ 中的位运算符”，2014）：\n\n- “”：位 `and`（与）运算接收两个数字（操作数），并在这些数字流的每一个比特位上运行。如果两者都为\
    \ 1，则 `and` 流的结果将为 1。\n- `![00124.jpeg](img/00124.jpeg)`：位 `or`（或）运算接收两个数字（操作数），并在这些数字流的每一个比特位上运行。如果其中任一个为\
    \ 1，则 `or` 流的结果即为 1。\n- `![00125.jpeg](img/00125.jpeg)` 位 `xor`（异或）运算接收两个数字作为操作数，并在两个数字流的每一个比特位上执行\
    \ `xor` 运算。如果两个比特不同，则 `xor` 结果流为 1。\n- `![00126.jpeg](img/00126.jpeg)` 左移运算符接收两个数字，并将第一个操作数的比特向左移动。第二个操作数用于确定移动的位数。\n\
    - `![00127.jpeg](img/00127.jpeg)` 右移运算符接收两个数字，并将第一个操作数的比特向右移动。第二个操作数用于确定移动的位数。\n\
    - `![00128.jpeg](img/00128.jpeg)` 位 `not`（取反）运算符接收一个数字并翻转所有比特的状态（1 变 0，0 变 1）。\n\
    \n注意：机器使用寄存器（registers）和缓冲区（buffers）来存储用于计算的比特。寄存器仅仅是一个存储数组，每个比特在数组中都有自己的位置。如果你将这些数据流看作一个数组，将有助于你理解许多位运算符，特别是移位运算符。\n\
    \n让我们写一个位运算例程程序。首先，我们需要创建一个位寄存器并研究位流。这需要 `<bitset>` 库中的 `bitset<x>()` 函数。它允许你打印长度为\
