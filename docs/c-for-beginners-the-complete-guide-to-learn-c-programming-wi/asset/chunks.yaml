  trans: '

    除了编程之外，我们还探索了一些基础计算机科学概念。我们研究了机器的行为及其语言。我们讨论了学习编程如何像学习一门新语言：两者都有确保通信成为可能的语法和规则。C++
    是一种后端服务器语言，用于管理控制海量数据的服务器。与 python 这种更具人性化的高阶语言不同，c++ 要求程序员在代码中写得更详尽。在函数中，每个变量必须是唯一的，否则就会出错。所有函数和语句都是大小写敏感的，并受特定规则限制。我们实现了许多
    `if()`…`else` 语句，并制作了嵌套的 `if-else` 语句。我们看到像 `if()` 这样的条件语句可以在没有 `else` 的执行，但如果
    `condition` 为假，缺少 `else` 语句可能会导致错误。正如缺少动词表示句子不完整一样，没有 `if()` 就无法实现 `else` 语句。


    我们看到了计算机如何使用逻辑数学通过二进制数进行通信。我们看到了位运算函数在位位上工作，完成如 `and`、`or` 和 `not` 等逻辑数学计算。所有其他基于对象的
    c++ 函数都必须由编译器翻译成机器语言。但位运算更快，因为它们跳过了那一步并直接与机器通信。它们通常部署在竞争性编程中，以实现高度敏捷的程序和程序。在竞争性编程之外，位运算在大数据管理也有某些功能。


    位运算的挑战在于它们对人类来说很难理解，因为是二进制的。为了看到计算机看到的内容，我们进行了关于二进制和二进制数学的短期计算机科学课程。我们用位运算程序建立了“字节大小”的寄存器流，并创建了动态缓冲区来存储位运算的位。这些虚拟缓冲区和寄存器就是服务器管理
    TB 数据的方式。想一下：我们的缓冲区和寄存器都只有一个字节长，但一个太字节是 ![00211.jpeg](img/00211.jpeg)![00212.jpeg](img/00212.jpeg)![00213.jpeg](img/00213.jpeg)字节）。它提供了超过
    32.5 亿小时的内容（“youtube 存储了多少数据？ - quora”，未发布）。位运算让这些服务器能够处理这种负载而不会中断或产生巨大延迟。这是 C++
    力量及其处理大型复杂系统能力的最佳例子之一。它是程序员应该学习的一门非常有用的语言。如果你将这些数据流可视化为具有 8 个槽位的数组，你将更容易理解许多位运算符，特别是移位运算符。


    除了二进制编程，我们还处理了不同类型的数据，并探索了对象编程的不同方面。我们做了很多练习，例如处理字符串。事实上，我们在每一个练习中都使用并部署了字符串。我们看到字符串也是数据数组，可以像对象一样进行操作，但在少数情况下例外。字符串有长度、大小，并可以使用
    `<string>` 库中的各种对象进行解析。想想我们学到的拷贝构造函数调用组合。要解析任何类型的容器（`vector` 或数组），你需要一个带有元素地址操作符的
    `for()` 循环。该任务在 `<string>` 库中有一个专门的函数，你只需要你正在解析的项的索引。如果说你从这本书中中学到任何东西，那就是熟练地处理字符串：拆分转义序列、通过数组索引处理字符串以及将字符串传递给不同的函数。


    我们还学习并讨论了功能和设计考虑。例如，我们讨论了何时以及如何使用循环。我们的安全示例通过系统中的控制循环示例得到了最好的说明。正如我们所说的，银行应该始终锁好门；银行的大多数事件都需要出口，只有在火灾时才应该打开。系统应该保持一切受控，在程序之后测试条件。控制循环在其他领域也有用，例如数据控制。作为辅助程序的
    YouTube 数据修正。这确保系统始终运行，不会被发送请求所阻。


    由于 C++ 是一种后端语言，它必须处理和操作多种类型的数据。当我们讨论基于 vector 的图像对象及其属性时，对此进行了简短讨论。照片处理软件是用 C++
    程序的，其中图像处理等方面充分利用了质量，不像 `.png` 像 `.svg` 或 `.pdf` 那样的像素数组使用容器来描述位置，后者在 C++ 中更多功能允许保留图像。


    这本书也旨在作为参考，因此我鼓励使用术语表和索引来复习知识。术语表包含了所有加粗的术语以及我们看过的代码片段。它还包含了详细讨论术语的章节。


    ### 术语表


    #### 术语定义


    `+`, 二进制算术运算，对两个变量求和。也用于 `<string>` 库中的中的字符串拼接操作：字符串拼接


    `++`

    递增运算符，用于将整数的值加 1。这个单元运算符通常用于循环内增加变量的值。单元运算符


    `--`

    单元运算符，用于循环内减少变量的值。这个单元运算符通常用于循环内增加变量的值。单元运算符


    `-`, 算术运算符，从一个操作数中减去另一个操作数。算术运算符


    `-`, 单元负运算符，用于更改变量或参数的符号。在负整数上执行单元操作将使其转变为正数，反之亦然。单元运算符


    `-=`

    结合 `-` 和 `=` 运算符的原子减法。该运算符首先从右侧的值中减去左侧变量的当前值，然后将结果赋值给左侧变量。例如，`x-=y` 是 `x=x-y`
    的简短写法，而无需使用单独的算术运算符。赋值运算符


    `!`, 二元运算符。二进制逻辑“非”运算符，当所考虑的条件不满足时返回布尔值真。如果其中一个条件为真，则返回布尔值假。逻辑运算符


    `!`,

    非运算符，用于反转操作数的布尔逻辑状态。例如，如果变量 `x` 的布尔值为假，`!x` 将为真。单元运算符


    `!=`

    “不等于”运算符，也检查两个给定操作数是否相等。然而，如果操作数不相等，该运算符返回布尔值真，如果操作数相等，则返回布尔值假。关系运算符


    `*`

    二元运算，乘以两个操作数。操作数的顺序不重要。算术运算符


    `*=`


