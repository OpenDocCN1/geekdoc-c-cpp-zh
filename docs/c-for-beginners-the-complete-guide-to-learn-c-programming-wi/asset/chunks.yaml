    我必须承认，在短短几行代码中它并不那么令人印象深刻，但能够发现错误并解释它们是程序员最重要的技能之一。在这个阶段，你不必太担心自己是否能做到这一点。你写得越多、学得越多，你发现和修复错误的能力就越强。软件和网络开发正因为这一点而是一个失败率高的行业。要成为一名成功的开发者，你需要快速解决问题、更高效地找到
    bug 并修复它们。这也适用于管理端，因为能够发现、修复和解释 bug 是桌面级服务水平协议（SLA）的重要组成部分。


    在技术领域，服务水平协议（`slas`）是服务提供者与客户之间的协议。他们对服务的某些方面达成一致，如支持、质量、可用性和责任（wieder, butler,
    theilmann, & yahyapur, 2011）。全面的 `slas` 提供调试简报，其中每个错误都会记录并列出其原因、变通方法和解决方案。这是技术管理公司和开发阶段执行此工作的最佳方式。然而，管理员比开发者本身拥有更多资源来投入调试。他们的薪酬也更高。例如，美国
    Web 开发人员年薪约为 60,000 美元；负责 `slas` 的 Web 管理员高出约 1/3，达到 90,000 美元（“15-1199.03—web
    administrators，” 无日期）。这种专家水平非常有价值，因为他们理解编译器是如何翻译 c++ 的。



    # 第一个程序：输出和基础字符串


    “Hello World”是每个编程语言的入门项目；它的目的是向学习者展示程序的基本语法及其运行方式。随着你学习越多的语言，你将编写许多“Hello World”程序。在上一节中，我们用它来探索算法、语法和
    c++ 编程环境等主题。在本节中，我们将更进一步：我们将操作代码。


    C++ 使用来自 `iostream` 库的 `cout` 对象。对象是计算机用于管理数据的方法。在我们的示例中，`cout` 用于告诉编译器使用 `>>`
    运算符打印“hello. World”。不要惊慌；我们将在后面的章节中讨论操作符和对象。现在，只需理解编译器将 `cout` 读取为特定指令即可，因为该指令定义在我们声明的
    `iostream` 库中。


    现在，让我们通过更改打印输出来看“hello. World”和 `cout` 对象。在这里找到原始代码，以便将其作为参考：


