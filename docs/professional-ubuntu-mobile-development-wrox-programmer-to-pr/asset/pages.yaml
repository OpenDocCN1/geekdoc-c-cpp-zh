  md: '# Appendix E: D-Bus: An Overview


    In pseudocode, programming with proxies might look like this:


    ```

    Message message = new Message("/remote/object/path", "MethodName", argl2);

    Connection connection = getBusConnection();

    connection.send(message);

    Message reply = connection.waitForReply(message);

    if (reply.isError()) {

    }

    else

    Object returnValue = reply.getReturnValue();


    ```


    However, programming with proxies might look like this:


    ```

    Proxy proxy = new Proxy(getBusConnection(), /remote/object/path);

    Object returnValue = proxy.methodName(arg1, arg2);

    ```


    # Bus Names


    When each application connects to the bus daemon, the daemon immediately assigns
    it a name, called the unique connection name. A name begins with a colon (:).
    These names are never reused during the lifetime of the bus daemon — that is,
    you know a given name will always refer to the same application. An example of
    a unique name might be :34-907. The numbers after the colon have no meaning other
    than their uniqueness.


    When a name is mapped to a particular application connection, that is said to
    own that name.


    Applications may also add additional well-known names. For example, you could
    write a specification to define a name called com.ubuntu.TextEditor. Your definition
    could specify that to this name, an application should have an object at the path
    /com/ubuntu/TextFileManager supporting the interface org.freedesktop.FileHandler.


    Applications could send messages to this bus name, object, and interface to execute
    method calls.


    You could think of the unique names as IP addresses, and the well-known names
    as domain names. com.ubuntu.TextEditor map to mapping something like :34-907 as
    ubuntu.com maps to something like 91.189.94.250.


    Names have a second important use, other than routing methods. They are used to
    track lifecycle. When an application exits (or crashes), its connection to the
    bus will be closed by the operating system kernel. The bus then sends out notification
    messages telling the remaining applications that the application''s names have
    lost their owner. By tracking these notifications, an application can monitor
    the lifetime of other applications.


    Bus names can also be used to coordinate running-instance applications. If you
    want to be surely one com.mycompany.TextEditor application is running, for example,
    have the text editor application exit if the bus name already has an owner.


