    # ## Improving Boot Speed


    This section describes how to improve and increase boot speed on an Ubuntu Jaouncy
    device. This is an area which is under very heavy development as the ambitious
    target boot speed for Ubuntu 10.04 (karmic+1) is 10 seconds.


    > karmic+1 refers to the release of Ubuntu after the karmic 9.10 release. The
