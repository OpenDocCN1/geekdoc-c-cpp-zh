    \n![](img/001c747b841ab338ed35c50dbdd0c933_105_0.png)\n\nFigure 4-6\n\nAnother\
    \ toolkit saw some excitement in mobile development communities is Clutter. This\
    \ was originally developed by GNOME developers at OpenedHand and is now a part\
    \ of the Moblin project and developed at the Open Source Technology Center.\n\n\
    # Clutter\n\nClutter is a GObject-based library for creating hardware-accelerated\
    \ graphical user interfaces. It relies upon OpenGL (1.4+) or OpenGL ES (1.1 or\
    \ 2.0) for rendering, can be compiled on different platforms (Linux, Mac OS, and\
    \ Win32) and has multiple bindings to other languages (Python, Ruby, and Vala).\
    \ It also supports media playback using Gstreamer and 2D graphics rendering using\
    \ Cairo.\n\nClutter works by having a stage (a window) and then adding actors\
    \ (widgets) to the stage and manipulating them via the Actor API. Actors can contain\
    \ child actors (ClutterGroup, for example) and be manipulated as a whole.\n\n\
    Animations and visual effects can be created via the use of timelines and behaviors.\
    \ Timelines provide accurate frame-based animations. Behaviors further extend\
    \ this by taking a timeline and applying a control function (clutter.Alpha) to\
    \ actors to modify some property of the actor in respect to time."
