    The programmer can create a common menu, which will be shared (memory and functionality-wise)
    by all the windows. A window can override this common menu by having its own menu.
    The following code demonstrates this:


    ```

    GtkMenu *common_menu = create_common_menu();

    GtkMenu *window_specific_menu = create_window_specific_menu();

