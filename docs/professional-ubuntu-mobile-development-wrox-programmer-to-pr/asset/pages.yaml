  md: '# Introduction


    # UDS Intrepid


    At the UDS (Ubuntu Developer Summit) for Intrepid, there were demonstrations of
    preliminary versions of both the Network Remix and Ubuntu MID. There were also
    demonstrations of additional work done on the Ubuntu MID done by the Canonical
    OEM team. Along with these were further demonstrations of the Ubuntu CMPC image.
    It was decided that some consolidation was necessary.


    As a result of all this, the Ubuntu developers decided that there would be specific
    Ubuntu Mobile releases for Intrepid.


    # Intrepid


    So, for Intrepid, there was work done to create Ubuntu Mobile. The Ubuntu Mobile
    release was designed for larger 7-9-inch screens, which work best on the Samsung
    Q1 (that happened to be the 7-9-inch hardware owned by the developers working
    on this release flavor).


    The Ubuntu Mobile releases do not have any of the hardware settings or hard-coded
    configurations that were present in the Hardy-based Ubuntu MID, and so not be
    nearly tied to the specific device. Indeed, one of the specific goals for Intrepid
    Ubuntu MID particularly was to move away from the hard coding, and so enable a
    wider variety of devices (perhaps including appropriately sized hardware such
    as the Algo MID or Sharp D4).


    Intrepid has an ubuntu-mid.img as well as an ubuntu-mobile.img. Images are officially
    built in the Ubuntu infrastructure on cdimage.ubuntu.com, which results in daily
    ubuntu-mobile images. The ubuntu-mobile release was a beta one, which was well
    reviewed on UMPCPortal (www.umpportal.com/) and generated some community interest.


    # Jaunty


    The Jaunty Ubuntu Mobile release was based on Ubuntu 2.2, which was based on Clutter
    and GTK. This brought significant improvements to Ubuntu Mobile. These enhanced
    GTK+ make finger-friendly interfaces, while staying compatible with APIs in calling
    and an optional/complementary user interface library called Clutter. Clutter,
    discussed in Chapter 4, is an OpenGL rendering library for creating visually rich
    and interactive interfaces.


    # Karmic


    The Karmic release for Ubuntu Mobile is focused on the Ubuntu Network Remix and
    ARM releases of Ubuntu (see below). In addition, a one-off Mobile Remix was rolled
    out primarily for demonstration and comparison purposes, but also to showcase
    the best of both projects.


    During this cycle, Ubuntu MID became community-maintained in the Ubuntu Liquid
    Remix project. If you would like to join this project, go to https://edge.launchpad.net/-.
    The first community release will be based on Ubuntu Lucid, which will be an LTS
    version of Ubuntu.


    # Ubuntu ARM


    On November 13, 2008, Canonical, the commercial sponsor of Ubuntu, announced that
    in response to demands from device manufacturers the Ubuntu operating system would
    be available on the ARMv7 processor architecture. This includes both the ARM Cortex-A8
    and Cortex-A9-based systems, which are the highest performing, most power-efficient
    processors released to date from ARM.'
