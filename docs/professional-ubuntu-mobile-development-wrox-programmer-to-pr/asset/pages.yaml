    # # Performing a Dual Boot


    Q: Would it be possible to dual boot Ubuntu Netbook Remix on a Windows mobile
    device?


    A: This very depends much on the device hardware. A fair number of existing models
    support some form of alternate booting, directly from some physical device, or
    through an application that replaces the currently running operating system with
    that from a physical device or selected.


    The majority of current devices supported by Ubuntu fall into the first category,
    and allow booting from alternate physical devices (most commonly USB keys, and
    Many devices are targeted for the low cost market, and to meet that, they incorporate
    a small SSD for data storage (4–16GB). Systems such as the Eee from Asus are capable
    of running both Windows and Linux, but not from the same drive because of space.
    It is possible to install Linux on a USB device and run it “Live” from the SSD
    for XP.


    A useful application for this GNU Haret, which you can find at http://handholds.org/-koconnor/haret/
    or http://handholds.org/moin/moin.cgi/HaRET.


    # # Setting a Flag Automatically


    Q: Is there a way to set up configure.ac so that it automatically sets the USE_HILDON
    flag if building for the LPIA architecture?


    A: Is it possible to add the following rule to debian/rules:


    ```

    ifeq ($(DEB_BUILD_ARCH), lpia):


    DEB_CONFIGURE_EXTRA_FLAGS = --enable-hildon


    endif

    ```


    This causes configure to be called with an extra --enable-hildon argument when
    building on the LPIA architecture.


    259'
