- img_proc: true
  md: '# Chapter 8: Kernel Fine-Tuning


    +   - It''s much easier and quicker to compile and install the driver.


    +   - The OEM may need to stick with the current kernel for compatibility reasons.


    +   - In some situations, it might be forbidden to use a non-tested kernel for
    reliability reasons. This means a new kernel version would result in more enforced
    validation and increased costs before being pushed to an end user.


    +   - The required driver (or driver version) is not currently present in the
    kernel tree.


    There are a plenty of ways to develop a driver that resides outside the kernel
    or a new version that is currently either applied or not in the current kernel.
    If it''s not standardized, it can make a lot of work for driver developers to
    make each driver version compatible with the many kernel versions and/ Linux distributions
    that exist and also a lot of work for the final users to get, build, and install
    the driver.


    In order to help developers and users, a framework that''s called Dynamic Kernel
    Modules Support was created. It provides a very easy mechanism to install and
    use new (or up-to-date) drivers by using few simple commands and configurations.
    The following section demonstrates how to use this framework and how users can
    get the most out of.


    # Inside the DKMS Framework


    The DKMS has some commands to export its usability to the userland. But before
    we demonstrate these, it''s important to show how this framework works internally.


    > “Userland” refers to any code that''s located outside the kernel.


    DKMS has its own modules tree. Every module needs to be added to that tree prior
    to being built and properly installed. The four valid states a module can be in
    as follows:


    +   - Out of DKMS tree


    +   - Added to DKMS tree


    +   - Built


    +   - Installed


    The desired module needs to reside in the /usr/src path inside the <module>-<version>/
    directory. That is the place where the framework will look for the drivers. The
    module must have a dkms.conf file properly configured. This configuration file
    should be provided by whoever is delivering the driver with DKMS framework support.


    In order to better understand DKMS usage, imagine the following scenario. There
    is a module package called opensafs, which uses DKMS and comes natively with Ubuntu.
    This is a distributed, cross-platform, open source filesystem for sharing of files
    between remote computers. Currently, the version provided'
