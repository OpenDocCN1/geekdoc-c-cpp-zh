  md: '# Chapter 8: Kernel Fine-Tuning


    # Create a Debian Package


    If the OEM or user aims to build a non-Ubuntu kernel source or would like to generate
    a Debian package, this is the right method to choose because you want to use the
    latest 2.6 kernel tree. Of course, it will also work with any official and non-official
    compiled kernel.


    This method offers two primary ways to get the kernel source code. As in the previous
    Ubuntu method, it''s possible to get it either from git or from the debian repositories.
    Let''s first look at the git repository and the deb source repositories.


    The non-ubuntu git repository used is the latest linux-2.6 kernel tree from kernel.org.
    However, the source repository could be changed. The same logic applies to the
    deb repository as well. Only the initial steps will be different — i.e. the kernel
    configuration, compilation, and installation steps are all equal.


    The first step in this method is to ensure the kernel has all dependencies already
    installed on the device:


    ```

    $ sudo apt-get update

    $ sudo apt-get install git-core fakeroot makedumpfile

    $ sudo apt-get install libncurses5-dev build-essential

    $ sudo apt-get install kernel-package

    $ sudo apt-get build-dep linux

    ```


    Now get the linux tree:


    ```

    $ git clone \\

    git://git.kernel.org/pub/scm/kernel/git/torvalds/linux-2.6.git \nlinux-2.6.git

    ```


    It''s important to mention that this tree is intended for development purposes
    and may not be stable. So, if anything during the compilation goes wrong, it is
    possible to change to any previous version using the git tool.


    This step can last some time depending on the connection speed. After it''s completed,
    a directory called linux-2.6.git will be created. This is the place where all
    the work will be done. Change to:


    ```

    $ cd linux-2.6.git/

    ```


    Unlike the first method, there is no pre-built workable configuration file. In
    order to avoid wasting time looking for an initial workable one, just copy the
    configuration file by the current kernel. This should decrease the customizing
    time:


    ```

    $ cp /boot/config- -r .config

    ```


    Now the kernel source is downloaded and there is an initial configuration file.
    It is time to start the configuration stage. There are many ways to do this and
    the ncurses front end will be shown here.


    The configuration steps through the ncurses front end will look like Figures 8-1,
    8-2, and 8-3, respectively. It can be started by typing the following command:


    ```

    $ make menuconfig

    ```'
