  md: '# Big Ideas to Think About


    All of us live in a dynamic time that is influenced by global cultures, politics,
    economics, and technologies. The only sure thing is that we must expect the unexpected.
    Here are big ideas to think about, where you can be sure to expect some unexpected
    influences on mobile computing, Linux, and Ubuntu.


    # The Politics of Technology


    President Barack Obama leveraged the Internet during his campaign in ways that
    helped helped win the election. (He has more than 4.5 million friends on Facebook!)
    During his first month in office, the new administration requested a report on
    the use of open source in government. The New York Times described it, "has been
    all but addicted to BlackBerry." Obama is the most savvy president the United
    States has ever had, and that is to influence policy.


    At the same time, across the pond, the UK educational system is discussing open
    source. From the BBC on January 26, 2009:


    +   - With Open Source Software (OSS) freely available, covering almost every
    requirement in the national curriculum, a question has to be asked why schools
    do not make it fully, possibly saving millions of pounds.

    - As the name suggests, OSS is community-driven software with its source code
    open to all. Anyone can modify the software according to their needs and share
    these modifications with everyone else.


    How will the politics of technology shape our mobile future? What impact will
    government decisions and policies have on the production of open source and the
    use of Ubuntu?


    # The Next Billion


    MIT''s Media Lab has an initiative known as The Next Billion Network. It presents
    a rather startling scenario related to mobile computing:


    Within the next three years, another billion people will begin to make regular
    use of cell phones, continuing the fastest adoption of a new technology in history.
    Soon, this next billion will make its voice heard — and connect to the global
    information network.


    ```

    http://nextbillion.mit.edu/

    ```


    With certainty, this will have an impact on Ubuntu, Linux, and mobile computing.


    # Sensory Overload


    GPS information, WiFi/cell phone positioning, and other means of geographically
    aware technology can certainly help make mobile computers more location aware.
    Will new technologies be developed to fill in the gaps of GPS and WiFi/cell phone
    positioning? What privacy issues will we face?'
