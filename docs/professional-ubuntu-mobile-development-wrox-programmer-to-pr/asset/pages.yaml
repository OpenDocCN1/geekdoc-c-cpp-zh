    Applications will be auto-started if a desktop file is located in an autostart
    directory. The system wide setting for this (the variable $XDG_CONFIG_DIRS) is,
    by default, /etc/xdg/autostart/

    The per user setting for this (the variable $XDG_CONFIG_HOME) is, by default,
    ~/.config/autostart/


    Applications will be started after a user logs in.


    # XDG Base Directory Specification


    This specifies where files should be located in a base directory. The base directory
    for a user''s data is specified in the environment variable $XDG_DATA_HOME, and
    for a user''s configuration files in the environment variable $XDG_CONFIG_HOME.


    The default value for $XDG_DATA_HOME is $HOME/.local/share, and for $XDG_CONFIG_HOME
    is $HOME/.config.


    Similarly, a preference of de-ordered base directories relative to which configuration
    files should be searched by the environment variable $XDG_CONFIG_DIRS.


    > This specification defines directories relative to which data files should be
    searched, $XDG_DATA_DIRS, and relative to which essential data should be cached,
    $XDG_CACHE_HOME.


    # Desktop Menu Specification


    This can be thought of as an XML configuration file with the extension .menu,
    which defines the layout of menu items (.desktop files) and whether these items
    should be displayed in the menu. The XML file is located by default


    ```

    $XDG_CONFIG_DIRS/menu/$XDG_MENU_PREFIX)applications.menu

    ```


    with the $XDG_MENU_PREFIX variable allows that a user''s can override (rather
    be merged) with a system menu. The .desktop files are located in $XDG_DATA_DIRS/applications/
    or by default.


    This specification adds the fields Categories, OnlyShowInNotShowIn the Desktop
    Entry Specification discussed above. Categories is a way to group menu items,
    OnlyShowIn is a way to make items only appear in specific environments, and NotShowIn
    is the reverse.


