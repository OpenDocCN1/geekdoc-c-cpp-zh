  md: '# Appendix A: Ubuntu''s Right ARM


    OpenCV (Open Source Computer Vision) is a library of programming functions that
    are mainly aimed at real-time computer vision.


    Although OpenCV has been open source for a long time, its website doesn''t support
    the ARM platform. There are dozens of dependencies required to make OpenCV work
    with Python. Plus, there is typically heavy dependency on floating point hardware
    for graphics processing (this version of the SheevaPlug lags floating point hardware).
    These early days of running Ubuntu on ARM are proving productive: OpenCV ran fine
    on the SheevaPlug.


    # Relocatables


    Another application of interest is in a market segment I “Relocatables” — as a
    short form of “Relocatable Computing.” The essence of relocables is that you can
    move your computer infrastructure easily from place to place with minimal setup.


    Relocatables would be useful if your network moves, as to cover outdoor sporting
    events or disaster recoveries. Anywhere network infrastructure runs the risk of
    being damaged or destroyed, Relocatables could be a useful solution.


    One simple example of this is municipal WiFi, where wireless devices might need
    to be in support of community events. It turns out that one of the toughest of
    “Municipal WiFi” is finding electricity to run low-powered radios and computers.
    Often, building owners will provide access to a roof for placing antennas, but
    power is absent. Thus, we turned to solar as a workable solution for providing
    power. The SheevaPlug is low power, and now well within reach of being powered
    by solar.


    As a result, the challenge was to step it up a notch. So, a challenge goal was
    put to build a cluster of SheevaPlugs into a solar-powered super computer. This
    is what what comes to be known as SWARM.


    # What''s the Buzz on SWARM?


    SWARM is an acronym that stands for:


    +   S — Sheeva/Solar-powered

    W — Wired/Wireless/Watt-Friendly/Relocatables/Web-Server

    A — Advanced/Application

    R — Running/Racing

    M — Memcached/Machines


    My goal was to gather the needed parts and assemble a SWARM on June 17, 2009,
    for the fifteenth anniversary of the Boston Linux User (BLU) Group. As you can
    see from the following photos, recap the highlights in our construction of the
    SWARM, everything worked as planned.'
