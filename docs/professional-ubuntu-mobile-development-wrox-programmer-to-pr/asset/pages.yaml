  md: '# Introduction


    Professional Ubuntu Mobile Development is designed for all developers interested
    in a practical, hands-on way of learning development on mobile devices. The book
    is designed to show you how to complete real-world tasks in efficient and often,
    we hope, innovative ways. Our goal is to include the examples in this book will
    help you understand the techniques we when working with Ubuntu Mobile. Our hope
    is that you can creatively apply them to your own real-world problems.


    As such, the book is not a "static" object but we authors have tried to model
    this dynamism through an emphasis on discrete, reusable units of logic — the chapters
    — the names of which became obvious as we worked at customizing Ubuntu Mobile.
    This means the book can be approached in numerous ways.


    # Whom This Book Is For


    The book is for developers with some experience working with Debian-like systems
    as Ubuntu, but it is also for developers with experience with other operating
    systems, who perhaps want to explore or rapidly come up-to-date with the key features
    of Ubuntu Mobile. It is well suited for developers who are "perfectionists with
    deadlines" and, as such, is not an introduction to either embedded development
    or Ubuntu. To get the most from the book, you should understand programming principles
    and have a healthy dose of curiosity about how things work and how to adapt the
    examples provided to your particular situation and demands.


    It is also not a book about how to install Ubuntu onto any particular mobile device
    (there are other guides available on the Internet for this), but it is a book
    which will be useful if you would like to use Ubuntu in its various flavors for
    your customization projects.


    # What This Book Covers


    On August 28, 1909, The North-China Herald published an article called "The Moving
    Target Problem,"" which concerned the growing popularity of moving targets at
    the expense of the bull''s-eye when training riflemen. This was to the chagrin
    of the military, which maintained that the best rifleman in actual warfare would
    be the one who had had training on the bull''s-eye and had from his earliest career
    to observe and rectify his errors in marksmanship.


    Anyone who has written a book will certainly side with the military on this one.
    The scope of Ubuntu is large and the mobile project that some things in this book
    might have changed when you read them. What this book gives a snapshot of current
    best practices and the tools you need to at implement them.


    The most important thing when developing for an embedded device is to have a development
    environment set up. Once this is, it is possible to develop, package, and test
    your application in an environment that provides a reasonable approximation of
    the device. This is followed by'
  merge: -1
