  md: '# Ubuntu’s Right ARM


    Now that Ubuntu has been released for the ARM (Advanced RISC Machines) platform,
    there are many intriguing new application possibilities. An entire class of solutions
    is available in the realm of power-efficient computing.


    One example is SheevaPlug. In February 2009, Marvell brought to market a new device
    called the SheevaPlug, based on its ARM processor. Marvell provided an open architectural
    blueprint for “plugs” reminiscent of the early, standards-based component designs
    that laid the foundation of the PC industry. Marvell’s combination of technology
    and product vision has popularized an entirely new market segment: plug computing.
    (Go to http://plugcomputer.org/ for more details).


    The Street Journal reported on the launch of this new product and segment with
    an article on February 23, 2009. The coverage hinted at a new mini-industry:


    > “There are multiple pain points we can solve here,” said Simon Milner, Marvell
    vice president and general manager of its enterprise-business unit.


    One big problem is consumers’ growing hoard of digital photographs, music and
    videos — increasingly stored on laptop computers that could be lost or stolen.
    Companies already sell devices to safeguard such information, including devices
    that combine disk drives and networking features.


    Marvell says it believes plug computers can make these products more useful, a
    concept some people first discovered at the Consumer Electronics Show in January
    without disclosing Marvell’s involvement. The devices connect with an Ethernet
    cable to a home router and to storage devices using the widely employed technology
    called USB.


    The Wall Street Journal picked up on the power savings potential — less than five
    watts for a SheevaPlug compared to the electrically thirsty alternatives. In addition,
    the Wall Street Journal mentioned $49 as an eventual price point for some models.'
  merge: -1
