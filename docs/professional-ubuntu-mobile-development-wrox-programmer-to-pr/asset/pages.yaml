  md: '# Chapter 4: Application Development


    ![](img/001c747b841ab338ed35c50dbdd0c933_117_0.png)


    # What Key Technologies Do I Need to Know to Develop Applications for a Mobile
    Device?


    It is necessary to have a good understanding of some fundamental concepts in order
    to ensure the correct configuration and smooth functioning of an application on
    Ubuntu Mobile devices. The first of these is D-Bus.


    # D-Bus


    D-Bus is an inter-process communication mechanism — a medium for local communication
    processes running on the same host. D-Bus is meant to be fast and lightweight,
    and is designed for use as a unified middleware layer underneath the main free
    desktop environments.


    There are two Bus types:


    +   - SystemBus — This is a Bus service to connect daemons that offer system services.
    Services, generally, start when the machine boots.


    +   - SessionBus — This is a Bus service to connect applications that are generally
    started by the user. Rhythbox is an example of such an application.


    82'
