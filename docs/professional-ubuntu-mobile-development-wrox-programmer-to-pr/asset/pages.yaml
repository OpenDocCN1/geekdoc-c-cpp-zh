  md: '# 8 Kernel Fine-Tuning


    The kernel is the portion of software that''s closest to the hardware. It is responsible
    for the device management and the system''s basic functionality as well as ensuring
    the system will be secure and robust enough to run all the applications.


    The Linux kernel is fully configurable. It was designed to support a large number
    of different platforms and for each platform can be set up in many different ways.
    Ubuntu Mobile has some stable and generic kernel configurations, which support
    various platforms with a few kernel packages. A consequence of this is that probably
    an end user will not have to do any extra work to get Ubuntu Mobile running properly
    on supported hardware. However, this generalization can decrease system performance,
    which is one area of interest to OEMs and device manufacturers.


    This chapter demonstrates kernel-tuning methods that enable you to create kernel
    packages. The results are more specific to the target hardware and more optimized
    for the hardware''s usage patterns.


    # Ubuntu MID Kernel Overview


    The Ubuntu MID kernel is based on the LPIA architecture. This architecture was
    designed to support i386 devices, but uses a different set of configurations from
    all previous i386-based Ubuntu kernels. LPIA''s build options are mainly focused
    on power management.


    # Kernel-Tuning Methods


    The user can approach kernel optimization using one of two methods.


    The first method creates an Ubuntu package. This is a better choice in a situation
    that has at least one of the following requirements:'
  merge: -1
  pgno: 200
- img_proc: true
  md: "# Chapter 8: Kernel Fine-Tuning\n\n+   - A standard Ubuntu kernel package needs\
    \ to be created.\n\n+   - The latest development Ubuntu kernel version needs to\
    \ be used.\n\n+   - The optimization should be based on an existing Ubuntu kernel\
    \ package favor.\n\n+   - The generated package should be integrated with Ubuntu\
    \ as much as possible.\n\nThe second method results in a Debian package. This\
    \ is a better choice in a situation that has at least one of the following requirements:\n\
    \n+   - A Debian package is wanted or at least enough to start with.\n\n+   -\
    \ It is not a requirement to use an Ubuntu kernel.\n\n+   - The developer thinks\
    \ it's a simpler method.\n\nIf both methods are applicable, this method creates\
    \ an Ubuntu kernel package. Although it seems obvious, it's important to mention\
    \ that an OEM or user should know the hardware specifications in order to create\
    \ the customized kernel package capable of running correctly on a target device.\n\
    \n# Create an Ubuntu Package\n\nAs mentioned earlier, this method creates an Ubuntu\
    \ kernel package. The kernel source from Ubuntu has plenty of scripts capable\
    \ of generating kernel packages in an automated way. Consequently, as a prerequisite\
    \ to this method, the user should get the source from Ubuntu.\n\nThere are two\
    \ choices when downloading the kernel source. You can obtain it from either a\
    \ deb or a git repository. In general, the source from a deb repository won't\
    \ be up-to-date as a git repository. So, first we demonstrate the method of getting\
    \ the source from git and then we cover the use of a deb repository. However,\
    \ before starting the process, it is necessary to install some dependencies:\n\
    \n```\n$ sudo apt-get update\n$ sudo apt-get install git-core fakeroot makedumpfile\
    \ kernel-wedge\n$ sudo apt-get install libcurses5-dev build-essential\n$ sudo\
    \ apt-get build-dep linux\n```\n\nNow, clone the ubuntu kernel tree:\n\n```\n\
    $ git clone git://kernel.ubuntu.com/ubuntu/ubuntu-jaunity.git \\\n ubuntu-jaunity.git\n\
    $ cd ubuntu-jaunity.git/\n```\n\nThe first step is to add the new flavor to the\
    \ build scripts. Add it to the lpia architecture in both files shown here:"
  merge: -1
