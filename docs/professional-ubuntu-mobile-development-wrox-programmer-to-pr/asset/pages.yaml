    # What Is a Derived Distribution?


    Confusion exists over the exact definition of the term "derivative" or derived
    distribution. Deriving new software from some original that some sort of change
    has taken place in the original — if this was not the case, then it would just
    a simple gcc compile of the original source (something called a compilation in
    copyright law). Obviously, if the original source code is changed, then the upstream
    author has the right to insist that the work be licensed under the same provisions
    as the original code. This clear — the confusion comes with the definition of
    a new work.


    Copyright law also allows for a situation where the original source code is "annotated,"
    "elaborated," or "modified" if it is considered, on the whole work. This new work
    is then subject to the same terms as the original source code mentioned earlier.


    The problem is with the phrase "on the phrase — on the clause," in English, is
    used most frequently to mean "generally" which seems awfully vague for legal clause
    in a copyright contract. As a consequence of this, a new work might be seen as
    a derived work if creative expression is added to the original work, even if there
    are no actual changes to the original source code.


    Some people think that this doubt has led to more interest in using other licenses
    (such as the LGPL), which explicitly allow for derivative works rather than relying
    on the GPL.


    # When to Use the LGPL


    The original name for this library was "The Library General Public Licence , because
    this license covers the linking of libraries applications. Today it is commonly
    referred to as "The Lesser General Public Licence"


    Imagine there are two applications. When both are licensed under the GPL, the
    code must be made available. However, the situation is complicated when one is
    GPL and the other a proprietary application, and even so when the proprietary
    application makes use of some library from the GPL one. The LGPL specifically
    allows for the linking of a proprietary application to GPL libraries without requiring
    that the proprietary application makes its source code available. If the proprietary
    application changes some of the source code in the GPL library (perhaps to make
    the application bind better), then only those changes need to be published. In
    practice as a matter of courtesy, companies should do their utmost to make sure
    that code is accepted upstream as quickly as possible. It is easier to maintain
    this way, ensures future application compatibility, and makes community relationships
    stronger.'
