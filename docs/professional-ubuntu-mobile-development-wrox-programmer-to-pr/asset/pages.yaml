  md: '# Chapter 6: Application Selection


    # Test the Gypsy by GPS Connection


    Install the gypsy daemon library by adding the following:


    ```

    deb http://ppa.launchpad.net/ianlawrence/ppa/ubuntu trusty main

    deb-src http://ppa.launchpad.net/ianlawrence/ppa/ubuntu trusty main

    ```


    to /etc/apt/sources.list and then to do the following:


    ```

    $ sudo apt-get update && sudo apt-get install gypsy

    The .debs (for 5.1) are also available at http://ianlawrence.info/downloads/debian/

    gypsy-lpia/gypsy_0.5-1.deb and at http://ianlawrence.info/downloads/

    debian/gypsy-lpia/libgypsy0_0.5-1.deb

    ```


    The bluetooth gypsy device that was used by the Nokia Wireless GPS Module LD-3W.
    To communicate with it, you need to find its address. Make sure gypsy is enabled:


    ```

    $ sudo apt-get install bluetooth bleu-utils bluez-gnome gnome-bluetooth

    libbluetooth2 libtct14 libgnomenet0 nautilus-sendto

    ```


    Run the following:


    ```

    user@host:~$ hcitool scan

    Scanning ...

    00:19:B7:8C:A7:F7 IPhone

    00:02:76:C5:58:B2 Nokia LD-3W

    ```


    This returns the address of the gypsy device: 00:02:76:C5:58:B2.


    # Interaction with the Gypsy Daemon


    The code to interact with the gypsy daemon (gypsy.py) and to show its status (status.py)
    was written by Ross Burton and released LGPL and GPL. It can be checked out by
    running the following:


    ```

    $ bzr branch http://burtonini.com/bzr/gypsy-status/

    ```


    Add the bluetooth address to gypsy.py:


    ```

    dbus.mainloop.glib.DBusMainLoop(set_as_default=True)

    gps = GPS("00:02:76:C5:58:B2")

    gps.Start()

    ```


    Then, inside a target terminal, add the following:


    ```

    export DISPLAY=:2

    python status.py

    ```


