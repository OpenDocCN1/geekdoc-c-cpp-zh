  md: "# Appendix E: D-Bus: An Overview\n\n# Proxy Objects\n\nTo interact with a remote\
    \ object, you use a proxy object. This is a Python object that acts as a proxy\
    \ or \"stand-in\" for the remote object. When you call a method on a proxy object,\
    \ this causes dbus-Python to make a method call on the remote object, passing\
    \ back any return values from the remote object's method as the return values\
    \ of the proxy object method.\n\nTo obtain a proxy object, call the get_object\
    \ method on the Bus. For example, NetworkManager has the well-known name org.freedesktop.NetworkManager\
    \ and exports an proxy object whose path is /org/freesktop/NetworkManager/Devices/eth0.\
    \ You can get a proxy for the object representing eth0 like this:\n\n```\nimport\
    \ dbus\nbus = dbus.SystemBus()\nproxy = bus.get_object('org.freedesktop.NetworkManager',\n\
    \    '/org/freesktop/NetworkManager/Devices/eth0')\n# proxy is a dbus.proxies.ProxyObject\n\
    ```\n\n# Interfaces and Methods\n\nD-Bus uses interfaces to provide a namespace\
    \ for methods. An interface is a series of related methods and signals (on signals\
    \ later), identified by a name that is a series of dot-separated components starting\
    \ with a reversed domain name. For instance, each NetworkManager object representing\
    \ a network interface implements the org.freedesktop.NetworkManager.Devices, which\
    \ has methods as getProperties.\n\nTo call a method, call the method of the same\
    \ name on the proxy object, passing in the interface name via the dbus_interface\
    \ keyword argument:\n\n```\nimport dbus\nbus = dbus.SystemBus()\neth0 = bus.get_object('org.freedesktop.NetworkManager',\n\
    \    '/org/freesktop/NetworkManager/Devices/eth0')\nprops = eth0.getProperties('org.freedesktop.NetworkManager.Devices')\n\
    # props is a tuple of tuples, the first of which is the proxy object\n```\n\n\
    As a shortcut, if you're going to call many methods with the same interface, you\
    \ can construct a dbus.Interface object and call methods on that, without needing\
    \ to specify the interface again:\n\n```\nimport dbus\nbus = dbus.SystemBus()\n\
    eth0 = bus.get_object('org.freedesktop.NetworkManager',\n    '/org/freesktop/NetworkManager/Devices/eth0')\n\
    eth0_dev_iface = dbus.Interface(eth0,\n    'org.freedesktop.NetworkManager.Devices')\n\
    props = eth0_dev_iface.getProperties()\n# props is the same as before\n```"
