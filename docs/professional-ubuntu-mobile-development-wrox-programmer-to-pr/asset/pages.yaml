  md: '# Chapter 7: Theming


    # Performance Testing of Themes


    It is possible to run a range of performance tests on themes. The simplest test
    to run is one using the metacity-theme-viewer.


    Metacity is a compositing window manager that is used by default in GNOME.


    Run the following command on UNR:


    ```

    $ metacity-theme-viewer Human

    ```


    It outputs the following results:


    +   Loaded theme "Human" in 0.02 seconds

    Drew 100 frames in 0.61 client-side seconds (16.1 milliseconds per frame) and
    3.4817 seconds wall clock time including X server resources (34.8167 milliseconds
    per frame)


    # Test the Human Metacity Theme


    The theme should render properly in all the tabs. There''s also a Benchmark tab
    that can be used to compare speeds with other themes. For example, the Human on
    Ubuntu Remix takes 34.8167 milliseconds to draw one window frame, whereas the
    Simple takes 84.8415 milliseconds.


    Another benchmarking tool for GTK+ themes is called GtkPerf. It is available through
    apt (sudo apt-get install gtkperf). This tool also works on Ubuntu MID.


    It can be run like this:


