  md: '# Chapter 11: Putting It Together


    SquashFS is a read-only filesystem that compresses whole filesystems or single
    directories and then writes them to other devices/partitions or to ordinary files.
    These can be mounted directly (if a device) using a loopback device (if it is
    a file).


    There is a trick to enable optimizations on a Solid State Drive (SSD) filesystem.
    All elevator=noop /boot/grub/menu.list using the original Grub, or add it to the
    configuration file in Grub2. See the following section for more information about
    Grub.


    ```

    elevator=noop helps I/O reorder requests to the disk. This means when the head
    moves across the disk, it can serve requests in an orderly, sequential manner,
    rather than going back and forth.

    ```


    Now that some basic questions have been answered, it is possible to think about
    what customizations will be required in the image. When working with an OEM, this
    will likely be agreed upon beforehand a Terms of Work agreement. If you are "homebrewing,"
    you will know what customizations you want to make.


    # Customizing the User Interface


    The default Ubuntu can be heavily modified. Everything from the boot selector
    to the desktop theme de be changed. This section discusses some the relevant customizations
    that can be made.


    # Boot Selector


    For karmic, the default boot selector is Grub. Grub2 is an improvement on the
    original Grub boot loader as it can be more easily customized. With the new design,
    other architectures are also supported. For now, however, it cannot be used as
    a bootloader for the ARM architecture. In this case, u-boot is used instead.


    Grub2 comes with a configuration file in /etc/default/grub, which contains information
    contained in the old Grub menu.list. Its file looks like this:


    ```

    # This file is sourced by update-grub, and its variables are propagated

    # to its children in /etc/grub.d/


    GRUB_DEFAULT=0

    GRUB_TIMEOUT=4

    GRUB_DISTRIBUTOR=''ls_release -i 2> /dev/null || echo Debian''

    GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"


    # Uncomment to disable graphical terminal (grub-pci only)

    #GRUB_TERMINAL=console


    # Uncomment if you don''t want grub to pass "root=UUID=xxx" parameter to Linux

    #GRUB_DISABLE_LINUX_UUID=true

    ```


    In addition to the file /etc/default/grub, the folder /etc/grub.d/ contains other
    files that are read during the execution of update-grub or update-gr2 commands.
    The contents are imported into /boot/grub/grub.cfg.'
