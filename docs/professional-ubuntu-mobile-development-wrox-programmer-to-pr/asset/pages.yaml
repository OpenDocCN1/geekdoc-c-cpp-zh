  md: "# Chapter 4: Application Development\n\n<allow_active>yes</allow_active>\n\n\
    returns the method without asking for authorization.\n\nThe allow_active tag specifies\
    \ the default answer that PolicyKit will return for an active session.\n\nThe\
    \ next key technology that is necessary to understand when developing applications\
    \ for a mobile device is GConf.\n\n# GConf\n\nGConf is a way to store configuration\
    \ settings that ships with GNOME. Conceptually it resembles the Windows Registry,\
    \ GConf abstracts the registry concept into a library. This provides a simple\
    \ interface to applications, and an architecture that tries to make things easy\
    \ for OEMs, system administrators, and developers.\n\nEssentially, GConf provides\
    \ a preferences database, which is like a simple filesystem. The filesystem keys\
    \ organized into a hierarchy. Each key is a directory containing more keys, or\
    \ a value. For example, /apps /metacity/general/titlebar_font contains an integer\
    \ value that gives the size of the title bar for the Metacity window manager.\n\
    \nThe following Python application uses of GConf. It is an application that has\
    \ the most recent features used by a user, which pulls from the GConf settings.\
    \ The gconf-example.glade file is not shown here, but it is included in the code\
    \ downloaded on the Wx site.\n\n```\n```python\n#!/usr/bin/env python\n# -*- coding:\
    \ utf-8 *\nimport gtk\nimport gconf\n\nclass GConfApp(object):\n    def __init__(self):\n\
    \        #setting the glade file\n        self.gladefile = 'gconf-example.glade'\n\
    \        self.gconfwindow = '/apps/gconf-example/winfo'\n        self.gconfprefs\
    \ = '/apps/gconf-example/prefs'\n        self.wTree = gtk.Window(self.gladefile,\
    \ 'window')\n\n        signals = {\n            'on_window_delete_event': self.on_window_delete_event,\n\
    \            'on_window_delete_event': self.on_window_destroy,\n            'on_window_destroy':\
    \ self.on_window_destroy,\n        }\n        self.wTree.signal.autoconnect(signals)\n\
    \n        self.window = self.wTree.get_widget('window')\n```\n```\n\n91"
