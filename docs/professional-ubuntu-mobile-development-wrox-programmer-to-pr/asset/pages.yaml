  md: "# Chapter 4: Application Development\n\n# Object Paths and Bus Names\n\nWhen\
    \ communicating over a bus, applications obtain a 'service name': This is how\
    \ the application chooses to be known by other applications on the same bus. The\
    \ service names are brokered by the D-Bus bus daemon and are used to route messages\
    \ from one application to another.\n\nBecause it is a binary protocol, D-Bus messages\
    \ incur low overhead when marshaling data. Messages consist of two sections, the\
    \ header and the body. The header contains the metadata for the data. This can\
    \ include routing information and the type signature for the data. The body contains\
    \ the data being sent.\n\nComplex data types such as arrays and dictionaries can\
    \ be encoded into a message. This allows communication between applications written\
    \ in a wide range of languages with the ability to retain a common set of data\
    \ structures.\n\nMessages are sent to objects, not applications. Applications\
    \ are free to register as many objects they wish. A D-Bus object can be thought\
    \ of like any other object in a programming language with the exception that they\
    \ are pointed to not by memory addresses but by object paths. Object paths take\
    \ the form of a string that looks similar to UNIX filesystem paths.\n\nThey are\
    \ slash-separated labels, consisting of letters, digits, and the underscore character\
    \ '_'. They must always start with a slash and must not end with one. Here's an\
    \ example:\n\n```\n/com/pum/SimpleTextEditor\n```\n\nD-Bus objects are invoked\
    \ through both methods and signals. D-Bus methods are similarly like any other\
    \ method in an object-oriented language.\n\nYou invoke an object by directly sending\
    \ a method to an object's interface on a service. The method may contain a list\
    \ of parameters you wish to send to the method. A method can reply back both synchronously;\
    \ where your program waits for a reply; or asynchronously when your program will\
    \ be notified when a reply has been received. Methods do not have to send a reply.\
    \ Signals are simple notifications that an event has occurred. A signal is broadcast\
    \ over the bus and therefore does not require a service to send. Any listening\
    \ for a signal will be notified when it is emitted.\n\nAn example which gets properties\
    \ and methods from DeviceKit D-Bus can be seen in the code from 'Putting All the\
    \ Concepts' section:\n\n```\ndef _get_dev_interface(self, object_path, interface):\n\
    \    bus = dbus.SystemBus()\n    proxy_obj = dbus.get_object('org.freedesktop.DeviceKit.Disks',\n\
    \                                object_path)\n    iface_obj = dbus.interface(proxy_obj,\
    \ interface)\n\n    return iface_obj\n\ndef _get_dev_prop(self, device, property):\n\
    \    props_iface_obj = self._get_dev_interface(device,\n                     \
    \          'org.freedesktop.DBus.Properties')\n\ntry:\n```\n\n83"
