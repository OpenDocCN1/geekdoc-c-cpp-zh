  md: '# Chapter 11: Putting It Together


    # GDM


    GDM is the Display Manager from the GNOME project. It is highly customizable and
    has an easy configuration and pre-configuration system.


    # Pre-Configuring GDM


    The default gdm behavior can be changed. The config file follows the ini file
    format. The configuration includes several sections: daemon, security, xdmcp,
    gui, greeter, chooser, debug, and servers. The configuration is found in /etc/gdm/gdm.conf-custom.


    The following code shows how to enable the onscreen keyboard:


    ```

    # gdm.conf-custom

    # gdm

    [daemon]

    AddGtkModules=true

    GtkModulesList=:atk-bridge:/usr/lib/gtk-2.0/modules/libxdwmouselistener:/usr/lib/gtk-2.0/modules/libkeymouselistener

    [security]

    [xdmcp]

    [gui]

    [greeter]

    SoundOnLogin=false

    [chooser]

    [debug]

    [servers]

    ```


    GDM can also be themed. This is explained in Chapter 7, "Theming."


    # Setting the Default Ubuntu, XFCE, and Hilda Behaviors


    Gtk-based desktops use GConf as the default database for configurations. The following
    file is an example of how to set a default configuration for gconf. This file
    is always in a scr/debian directory of a configuration package:


    ```

    # <package-name>.gconf-defaults

    /desktop/gnome/interface/gtk_theme brdesktop

    /desktop/gnome/background/picture_filename /usr/share/wallpapers/desktop03.jpg

    /desktop/gnome/volume_manager/autocompath_auto "thumb import-formats %h"

