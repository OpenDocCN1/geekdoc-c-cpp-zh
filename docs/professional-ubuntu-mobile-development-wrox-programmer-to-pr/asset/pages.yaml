  md: '# Chapter 8: Kernel Fine-Tuning


    ```

    $ cd debian/

    $ cd scripts/misc

    $ sed -e s/getall\ lpia\ lpia/getall\ lpia\ lpia\ lpiacustom/ -i getabis

    $ cd ../$

    $ cd rules/

    $ sed -e s/lpia/lpia\ lpiacustom/ -i lpia.mk

    $ cd ..//

    ```


    Now enter the config directory. This is where all of the specified architecture
    configuration settings can be modified:


    ```

    $ cd config/lpia/

    ```


    As you can see in this directory, there are two config files. One is the common
    configuration file config for all flavors. Another is config.lpia, which is the
    particular configuration for the lpia flavor. As the new flavor is based on the
    current lpia favor, you can copy the particular configuration file, as follows:


    ```

    $ cp config.lpia.lpiacustom

    ```


    Now append the config file for all flavors. This will make it possible to remove
    the common config file later on, as every flavor will have the configuration:


    ```

    $ cat config >> config.lpia

    $ cat config >> config.lpiacustom

    ```


    The next step is to edit the lpiacustom configuration file. This can be done manually
    through the following command:


    ```

    $ vim config.lpiacustom

    ```


    It can also be done by using ncurses front-end configuration tool for the kernel.


    > Ncurses is a toolkit for developing GUI-like applications that run under a terminal.
    Its header files must be installed before proceeding.


    First go back to the parent directory:


    ```

    $ cd ../../

    ```


    Now prepare the kernel and configure it using the front end:


    ```

    $ debian/rules prepare-lpiacustom

    $ make O=debian/build/build-lpia-lpiacustom menuconfig

    ```


    At this point, a screen that looks like Figure 8-1 should appear.


