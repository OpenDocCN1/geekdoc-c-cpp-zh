    # Other Toolkits


    If the new application is written for a device without a touchscreen or one that
    will run a distribution as Ubuntu Net Remix, then it is possible to use GTK as
    a framework.


    GTK+ is a toolkit designed to facilitate the development of applications using
    a standard graphics interface. It was initially created as a tool in the production
    of the GIMP, a graphics design package — GTK stands for “GIMP Toolkit.”


    It is useful for producing far more than just the GIMP, however, and it has been
    applied to every kind of GUI application imaginable.


    A GTK environment handles user requests by introducing an “event loop”, which
    is a stack of the various input instructions the user provides, as keystrokes
    and mouse clicks, and provides a set of handling functions that define what action
    to take when instruction is received: When the program is running, the handling
    functions are set up and the loop is started, and keeps running until a “quit”
    event is processed (for example, when the “Exit” entry in a menu is pulled down
    and selected).'
