  md: '# # 13

    Common Problems and Possible Solutions


    This chapter attempts to gather several of the most common problems that have
    been posted to the ubuntu-mobile mailing lists as well as solutions that have
    been offered around the Internet.


    # ## The Boot Process Stops


    Q: I downloaded Ubuntu MID, I extracted the files in the image, and I prepared
    a USB stick for booting with this image.


    After the USB boots, I Press Enter to start the installation and, after several
    OS messages, the boot process stops. The last message I receive is


    ```

    ```will mount root from /dev/sdb```

    ```


    That''s all.


    **A: This can be caused by improperly writing to the USB stick.**


    To copy the image to the USB stick (assuming /dev/sdb for the stick), use the
    following


    ```

    ```$ sudo bs=1024 if=<image file> of=/dev/sdb

    dd is a program used for low-level copying and conversion of raw data.```

    ```'
