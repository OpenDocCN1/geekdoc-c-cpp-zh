    # Modifying Themes


    It is often necessary to customize themes, particularly when working with an OEM.
    Before the GNOME Home Interface Guidelines," you might want to read "Visual Design
    for http://library.gnome.org/devel/hig-book/stable/, which starts as follows:


    Visual design is not just about making your application pretty. A well-designed
    application will make it easy for the user to understand the information that
    being presented, and show them clearly how they can interact with information.


    Substitute the word "application" for theme in the preceding quote and you should
    have a good idea about the objective of theming.


    # A Useful Tool When Working with Themes


    This following bash script displays information on the current theme. It is useful
    to use working with Themes and Gconf.


    First, install zenith, which is a handy suite for GTK widgets:


    ```

    $ sudo apt-get install zenith

    ```


    Call the script that follows get_theme_info.sh and execute it like ./get_theme_info.sh
    (after making it):


    ```

    #!/bin/bash

    icons=$(gconftool-2 -g /desktop/gnome/interface/icon-theme)

    theme_gtk=$(gconftool-2 -g /desktop/gnome/interface/gtk-theme)

    theme_metacity=$(gconftool-2 -g /apps/metacity/general/theme)

    font_gtk=$(gconftool-2 -g /desktop/gnome/interface/font_name)

    font_meta=$(gconftool-2 -g /apps/metacity/general/titlebar_font)

    zenith="$zenith -info text"

    icons: $icons

    GTK theme: $theme_gtk

    metacity theme: $theme_metacity

    gtk font: $font_gtk

    metacity font: $font_meta

    Professional Ubuntu Mobile Development*

    ```'
