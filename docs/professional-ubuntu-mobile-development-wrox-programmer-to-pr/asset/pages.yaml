  md: '# Chapter 10: Tips and Tricks


    # Recharging Correctly


    As a user, try to recharge the device without interruptions. Also, when you first
    use the device, run the battery down to zero and then fully recharge. This calibrates
    the battery.


    # Laptop Mode


    When laptop mode is enabled, the kernel will try to be smart about when to do
    writes in order to give the disk as much time as possible in a low power state.


    Laptop-mode-tools are installed by running the following:


    ```

    $ sudo apt-get install laptop-mode-tools

    ```


    To start laptop mode, run sudo laptop_mode start, which shows the following:


    ```

    Laptop Mode Tools1.45

    Laptop mode enabled, active

    dev/sda

    setting Advanced Power Management level to 0xfe (254)

    dev/sda

    setting standby to 12 (12 minutes)

    ```


    Running laptop mode increases dirty_expire_centisecs and dirty_writeback_centisecs
    in /proc/sys/vm which means pages will not be written to disk as often. It also
    changes the ratio of dirty background writebacks, taken together, result in rapid
    bursts of disk activity and longer dormant states.


    The configuration file for laptop-mode is


    ```

    /etc/laptop-mode/laptop-mode.conf

    ```


    A tool (which comes with laptop-mode) called lm-profiler will monitor the device
    disk usage and running network services and it will suggest disabling unused services.
    Running gives it an output following the:


    ```

    $ sudo lm-profiler

    ```


    ```

    Write accesses at 445/600 in lm-profiler run: gconfd-2

    Read accesses at 465/600 in lm-profiler run: hald-addon-tool

    Read accesses at 526/600 in lm-profiler run: gconfd-2

    Read accesses at 535/600 in lm-profiler run: chrome

    Profiling run completed.

    ```


    Program: "anacron"


