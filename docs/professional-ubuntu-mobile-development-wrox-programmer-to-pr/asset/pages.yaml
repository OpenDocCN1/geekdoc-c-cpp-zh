    # Dynamic Kernel Module Support


    Refer to the Dynamic Kernel Module Support (DKMS) official page for more information,
    you’ll find at http://linux.dell.com/dkms/.


    As previously, it is possible to tune a Linux kernel to make the configuration
    closer to the actual device hardware being used, rather than sticking with a more
    generic solution provided by the distribution. According to the methods shown
    previously, the entire kernel must be compiled and installed. This means that
    the tuned kernel could be different from the generic one and behave quite differently,
    too. Of course, it might not be a problem if the source comes from a stable release.


    But if the OEM needs to update a driver version or use a drive that is not present
    in the current kernel? Is it necessary to change the kernel to a new (old) version
    that contains the required driver? The answer is no, thanks to the Linux kernel’s
    ability to add new functionalities at runtime by loading a kernel module. It is
    possible to compile and load a new driver without having to touch the already
    configured and compiled kernel image.


    There are many reasons for the OEM to change the current kernel when wishing to
    use a new or up-to-date driver version:'
  merge: -1
