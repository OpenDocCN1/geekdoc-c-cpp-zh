  md: '# About the Authors


    Ian Robert Lawrence is a Scrum Master at the Instituto Nokia de Tecnologia. He
    is a founding member of both the Ubuntu Brazil and Debian Amazonas communities
    and he is studying for an MBA in The Strategic Management of Technology Innovation
    at UNICAMP.


    Rodrigo Cesar Lopes Belem is a free software developer and advocate who has contributed
    to many open source projects such as Enlightenment and Ubuntu. He has been working
    with free software since 2001 and currently works as a software developer at the
    Instituto Nokia de Tecnologia. He is studying for a Computer Science degree at
    the Federal University of Amazonas and holds an LPIC Level 2 certificate.'
