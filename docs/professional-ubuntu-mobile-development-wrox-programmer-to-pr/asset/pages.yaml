    /usr/bin/matchbox-window-manager \

    -theme /usr/share/themes/mobilebasic/matchbox/theme.xml \

    ```


    Compiz is a compositing window manager for the X Window System, which uses 3D
    Graphics hardware to create desktop environments for window.


    # What Happens When a MID Device Boots?


    On boot, startup will execute /etc/event.d/session, which will launch the X Window
    System using the


    ```

    exec openvent -e s - su -1 ubuntu -c *env XDG_SESSION_COOKIE startx -br*

    ```


    Once X starts, it processes the session scripts in /etc/X11/Xsession.d., including
    the /etc/X11/Xsesion.d25midstart file, which has a call


    ```

    MID_GUI=/usr/share/ubuntu-mid-default-settings/mid-gui-start

    ```


    On older versions of Ubuntu there was one of the GTK2_RC_FILES environment variables
    for GTK+2 widget themes in this file, as the following:


    ```

    export GTK2_RC_FILES=/usr/share/themes/mobilebasic/gtk-

    d2.0:/usr/share/themes/mobilebasic/gtk-2.0/gtkrc.maemo_af_desktop

    ```


    These files define all the GTK+ styles and bindings that will create the look
    and feel of all the widgets in the applications and in the Hidden desktop.


    On Ubuntu Jaunty, the theme changes are now made by setting the following Gconf
    key to the name of a theme directory:/desktop/gnome/interface/gtk_theme. For example
    this could be set to mobiletheme or any other theme in the directory by using
    the following:


    ```

    gconftool --set string /desktop/gnome/interface/gtk_theme mobiletheme

    ```


    When that keys change, the change is propagated to xtsettings and, through this,
    all GTK apps are notified of the new theme, and they immediately redraw themselves.
    GTK applications launched later using the new theme.


    Gconf, which is described in Chapter 4, is a system for storing application preferences.
    It exists so that preferences can be more easily managed. It is also transparent.
    This means that a setting changed in one application will instantly update in
    all other applications that are interested in that setting. This technology is
    vital for the application of coherent user interfaces on mobile devices.


    The easiest way to manage Gconf settings is to use gconf-editor:


    ```

    $ sudo apt-get install gconf-editor

    $ gconf-editor

    ```'
