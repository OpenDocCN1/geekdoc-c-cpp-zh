  md: '# Configuring Actions


    Hook scripts are used when you want to perform some action at a determined moment
    during pbubuilder. These actions can be scripted, too.


    A hook directory can be defined by the variable HOOKDIR. This can be set in the
    command line as:


    ```

    $ sudo HOOKDIR=/path/to/hookdir pbuilder -build file.dsc

    ```


    You can also set it as follows:


    ```

    $ pbubuilder -hookdir /path/to/hookdir -build whatever-else-you-want

    ```


    The hook script name must be in the form X<digit><digit><whatever-else-you-want>
    much like boot scripts. Here is the example c0shell hook<whatever-else-you-want>
    hook script, which will invoke a shell if the build fails.


    ```

    #!/bin/bash

    # invoke shell if build fails.

    apt-get install -y - force-yes vim less

    cd /tmp/pbbuild/debian/

    /bin/bash <dev/tty > /dev/tty 2 /dev/tty

    ```


    # Additional Hook Manipulation with PBbuilder


    Some of the most useful hook manipulation commands we have found are as follows.
    They start with the first letter, of which is A.


    ```

    A<digit><digit><whatever-else-you-want

    ```


    This is executed before a build starts — unpacking the build system, and unpacking
    the source, and satisfying the build-dependency.


    B is used like this:


    ```

    B<digit><digit><whatever-else-you-want

    ```


    This is executed after the build system finishes building successfully and before
    copying back the build result.


    C is used like this:


    ```

    C<digit><digit><whatever-else-you-want

    ```


    This is executed after build failure and before cleanup.


    D is used like this:


    ```

    D<digit><digit><whatever-else-you-want

    ```'
