    The LSB Testkit contains tools for analyzing dependencies (libraries and interfaces
    that are required externally) of application packages. In particular, ATK helps
    developers test their applications for LSB compliance, and enables easy steps
    for LSB certification.


    # Installing the LSB Application Testkit


    First, download the toolkit from http://www.linuxfoundation.org/en/Downloads.
    Next, run the install.sh script in the downloaded directory. The script asks a
    couple of questions, and installs the packages using dpkg:


