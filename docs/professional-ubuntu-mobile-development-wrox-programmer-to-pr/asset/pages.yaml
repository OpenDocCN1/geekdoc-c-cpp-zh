  md: '# Fine-Tuning the Kernel


    It may be necessary on a low-disk space device to remove all unnecessary drivers
    and modules from the kernel. It is also much good idea to optimize processors
    (such as by enabling hyperthreading), manage memory in a coherent manner, and
    ensure that network parameters are correct.


    The Atom processor on the target device is a new architecture, but based on older
    technologies. It''s the first in-order x86 from Intel since the Pentium.


    A processor receives instructions by one and puts them in a pipeline and then
    executes them. In an in-order architecture, the instructions are executed in the
    order in which they arrive, whereas an out-of-order architecture is capable of
    changing the order in the pipeline.


    On the Atom, there is a long pipeline coupled to an in-order architecture — consequently
    hyperthreading can be effective and significantly increases performance. This
    needs to be enabled in both the kernel and the BIOS of the device itself.


    CPU performance can be measured with htop and systat, which are available in repositories.


    To find out how to actually make changes, read Chapter 8, “Kernel Fine-Tuning."


    # Defining Power Policies


    DeviceKit-Power (see Chapter 3, “Power Management”) is now integrated into the
    new Gnome-Power-Manager for karmic.


    It is important to note that since Ubuntu Unity, powernow-k8 and acpufreq are
    no longer available modules but can be compiled into the kernel. This is as important
    as used by projects such as Linux-PHC to undervolt a CPU to extend battery time
    and to reduce the CPU''s temperature while affecting performance.


    As a result, enabling undervolting is necessary to either compile a kernel with
    the stand-alone modules (this is at the expense of boot) or to use the kernel
    from the Linux PHC PPA at https://linux-phc.net/~/archive/ppa.


    Linux-PHC utilizes the production tolerance of a CPU. CPUs have different production
    qualities so the vendor defines only those of low quality can be undervolted.
    Actual performance results for undervolting on the Atom processor are mixed at
    present, so it is recommended to also optimize the system as fully as possible
    for power savings, suspending devices when possible (WLAN, USB, LAN).


    # Is It an Embedded System?


    Depending on its hardware type, the filesystem may need to be compacted. When
    creating embedded systems, every byte of the storage on the device is important,
    so compression is used everywhere possible.'
