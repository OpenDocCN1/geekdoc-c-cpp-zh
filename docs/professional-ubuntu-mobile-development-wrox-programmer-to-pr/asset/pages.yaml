  md: '# Building the Package


    Now, with the files in it is possible to actually build the package. Move into
    the ubuntu-golden folder and issue the command


    ```

    $ debuild -sa

    ```


    This will build and sign the deb. We run the debuild command because our theme
    is a brand new package with no existing version in Ubuntu''s repositories and
    so dput (covered layer) will upload the .org.tar.gz file to the PPA.


    For more information about debuild and PPAs, look at https://help.launchpad.net/Packaging/PPA.


    # Uploading to a PPA


    To upload the new xfce4-ubuntu-golden Debian package to a PPA begin by installing
    dput:


    ```

    $ apt-get install dput

    ```


    dput is the tool you use to upload your source package to Launchpad. It uploads
    the following files:


    +   - .dsc

    - .changes

    - .diff.gz

    - And optionally, .org.tar.gz (if you use debuild -S -sa to build the package)


    To upload to a PPA, use:


    ```

    $ dput ppa:ianlawrence/ppa <changesfile>

    ```


    This, in the case of our package, will be::</Para>


    ```

    $ ppa:ianlawrence/ppa xfce4-theme-ubuntu-golden_0.1jauntyl_source.changes

    ```


