  md: '# Chapter 2: The Development Environment


    To install the Ubuntu MID image, a similar process to the one for the VirtualBox
    installation will be followed. Set up the .img as the second hard disk so you
    can install on the first disk. You might think of doing something like this:


    ```

    $ kvm -localtime -m 512 -hda installed-mid.img -hdb ubuntu-9.04-beta-mid-lpia.img

    ```


    However, the preceding command will not work! Besides the fact that installed-mid
    does not exist, the Bochs OSs used in QEMU and KVM do not allow for booting on
    the second hard disk. As a workaround, the Ubuntu Mobile Team provides a small
    (less than 400KB) ISO image from which the second hard disk can be chosen. This
    is available at http://people.ubuntu.com/~isolinux.iso.


    The script to generate the preceding ISO is available using bz (see Appendix A),
    which you can find at lp:-ubuntu-mobile-dev/ubuntu-mobile/mobile-scripts.


    Some of the issues are discussed in later detail in the following:


    Boot KVM with the following:


    ```

    $ kvm -m 512 -cdrom isolinux.iso -hda installed-mid.img -hdb ubuntu-9.04-mid-lpia.img

    ```


    installed-mid.img in the command is created using the following:


    ```

    $ qemu-img create installed-mid.img 4G

