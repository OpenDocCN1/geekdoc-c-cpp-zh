  md: '# Chapter 10: Tips and Tricks


    # CPUFREQ and Governors


    The power that is consumed by a processor is related to the speed at which it
    is running — it''s a performance versus battery trade-off. A way to manage this
    is to use CPUFREQ in the running kernel, along with the different controlling
    algorithms — it, the governors control its use.


    Cpu frequency scaling algorithms or drivers only allow the CPU to be set to one
    frequency. In order to offer dynamic frequency scaling, the cpufreq core must
    be able to tell these drivers of a "target frequency." This is done by using cpufreq
    governors.


    Available governors can be listed by using this command:


    ```

    $ cat /sys/devices/system/cpu0/cpufreq/scaling_available_governors

    The output like

    userspace demand powersave conservative performance

    ```


    The governor currently in use is shown by:


    ```

    $ cat /sys/devices/system/cpu0/cpufreq/scaling_governor

    ```


    outputs:


    ```

    ondemand

    ```


    The chosen governor is loaded automatically from the init script /etc/init.d/powernowd;
    for example, you can add the option -m 3, which puts powernowd into LEAPS mode,
    causing it to jump immediately to the highest frequency if usage is above 80 percent
    or to the lowest frequency if usage is below 20 percent.


    # Use Power Management Settings on Disks


    To see if your disks support the setting of power management, you can run the
    following (substituting your device mount):


    ```

    $ hdparm -i /dev/mapper/lawrence-root

    ```


    If your hard drive supports AdvancedPM, you can use hdparm to tell the disk to
    go into power savings mode after an elapsed period of idle time. The relevant
    options for hdparm are:


    +   -B — Sets the Advanced Power Management setting (1–255)

    -S — Sets standby (spindown) timeout

    -y — Puts the IDE drive in standby mode

    -Y — Puts the IDE drive to sleep'
