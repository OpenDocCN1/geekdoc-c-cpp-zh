  md: '# Chapter 6: Application Selection


    # Location-Aware Users


    Users with aging parents and young children find the concept of location important
    to them. This user group also has a relatively high disposable income as they
    have spent years working and so present an attractive market to an OEM. The users
    generally expect from a location-aware mobile device include the following:


    +   * The capability to automatically reconfigure itself, such that it always
    uses the right network settings (for firewalls and VPN), and prints on the right
    printer (i.e., use the home printer when at home, the work printer prints when
    at work)

    * Security, allowing only from designated physical locations

    * Help to find if it is misplaced, or stolen

    * The ability to easily share a power or presentation with everyone else in a
    room, without having to e-mail it or set a folder on a common server


    Some of this functionality could be presented to the user using a simple web interface
    running locally on the device.


    # A Practical Example


    In this section, you learn how to create a GPS-enabled standalone web application
    for a MID device. It embeds a web server and database using a Python application,
    which receives information from the D-Bus interface using XML-RPC. It uses the
    Django web application framework.


    D-Bus is covered in detail in Chapter 4.


    # Background


    Traditionally, GPS was provided on Debian-like systems using a daemon called gpsd.
    There are however, some problems with gpsd in resource-constrained environments,
    most notably that gpsd is designed to be run at start, and stopped when the system
    is down (or a USB/Bluetooth hotplug device when device is plugged-in or removed).
    There, if a client is started before gpsd is running (for example, a GPS applet
    is started before the Bluetooth device is connected), the only way for it to know
    about gpsd is for it to attempt to connect to the socket and keep trying very
    often until it succeeds.


    This makes client programs very busy, always having to wake up to check if they
    can connect. On a system that runs on batteries, having processes that can''t
    sleep very often is a bad thing. Also there is a problem with the granularity
    of the info that gpsd provides, as running clients get notified about everything,
    even if they don''t care about it. It emits a new fix on every NMEA sentence received,
    which for most GPS devices is about a five second, and each time the clients are
    all woken even if they don''t care about the data that has changed.


    138'
