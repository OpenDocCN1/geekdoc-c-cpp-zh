    # Updating a Customized Kernel Tree


    The kernel will continuously evolve. Newer versions are going to be released after
    the customized packages created earlier were made. Fortunately, the git control
    version tool supports updating a modified kernel tree (at least with less effort
    than reapplying all the changes shown previously).


    We will demonstrate two scenarios for updating a kernel tree — the choice depends
    on whether an Ubuntu kernel tree is being used or not. It is important to have
    a good understanding of the tool in order to process this section, particularly
    if the first method is chosen. Please refer to Appendix B, which contains classification
    for any step.


    # Updating an Ubuntu Kernel Tree


    If you choose the first method, one of the main advantages is that the latest
    Ubuntu kernel version can be used. If new changes are released in that git tree,
    it''s possible to update the downloaded kernel tree and apply it without having
    to redo the modifications.'
