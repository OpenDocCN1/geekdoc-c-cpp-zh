    # The Generational Divide


    If you have any doubt about the promise of Ubuntu as an operating system, or the
    likelihood that it will gain a significant market presence in the future, you
    may find this short story of interest.


    Sometimes people evaluate a computer''s use by asking: "Is it enough for your
    grandmother to use?" A better question is: "Is it enough for a 15-year-old to
    use?" I love my grandmother dearly, even if she had an interest in computers,
    I doubt big business would be in building a five-year business plan around her
    usual scenarios. On the other hand, a 15-year-old typically has the interest and
    need, and presents an attractive lifetime value proposition.


    My 15-year-old son came to me one evening carrying his Windows-powered notebook.
    "Hey, Dad, can you take a look at this and help me WiFi working?" I anticipated
    what would have happened with his sister''s notebook — it was time for Windows
    reinstall.


    He turned the laptop around show me the screen and what was shocking: the Ubuntu
    desktop.


    "I installed Ubuntu. The browser is super fast when I plug in the Ethernet. Now
    I remember what the Internet was like." He''d been fighting the gradually degrading
    performance of his Windows Vista installation for weeks and finally decided to
    quit.


    His notebook was just a year old — with plenty of horsepower and a price tag that
    pushed over $1,000. It had all the latest technologies — WiFi card, hard disk,
    a nice screen. But it slowed noticeably and inexplicably. My gut reaction was
    to reinstall Windows for him. I made the offer despite the dread I felt anticipating
    a multi-day effort to get Windows working again. Chasing down drivers for Windows
    is no fun.


    "What happened?" I asked. "I can reinstall Windows for you."'
