  md: "# Chapter 4: Application Development\n\n```\ncl = gconf.client_get_default()\n\
    width = cl.get_int(self.gconfinfo + '/' + 'window_width') or 640\nheight = cl.get_int(self.gconfinfo\
    \ + '/' + 'window_height') or 480\nself.window.set_default_size(width, height)\n\
    \nself._hpaned = self.wtree.get_widget('hpaned')\nif cl.get(self.gconfinfo + '/'\
    \ + self._hpaned.name):\n    paned_position = cl.get_int(self.gconfinfo + '/'\
    \ + self._hpaned.name)\n    self._hpaned.set_position(paned_position)\n    self._hpaned.set_data('last_position',\
    \ self._hpaned.get_position())\n\nself.window.show_all()\n```\n\n```\ndef save_state(self):\n\
    \    \"\"\"\n    Save the dimensions of the main window, and the position of the\
    \ panes\n\n    cl = gconf.client_get_default()\n    cl.set_int(self.gconfinfo\
    \ + '/' + 'window_width', self.window.allocation.width)\n    cl.set_int(self.gconfinfo\
    \ + '/' + 'window_height', self.window.allocation.height)\n    cl.set_int(self.gconfinfo\
    \ + '/' + '%s' % self._hpaned.name, self._hpaned.get_position())\n```\n\n```\n\
    def on_window_delete_event(self, args):\n    self.save_state()\n```\n\n```\ndef\
    \ on_window_destroy(self, args):\n    self.window.destroy()\n    gtk.main_quit()\n\
    ```\n\n```\nif __name__ == '__main__':\n    gconfapp = GConfApp()\n    gtk.main()\n\
    ```\n\nThe preceding code functions operate in a client-server way. After first\
    \ setting some signals, it gets the default GConf client. The actual values for\
    \ the files that are shown in the UI are obtained from a Glide file with the call\
    \ to\n\n```\n<widget class=\"GtkRecentChooserWidget\" id=\"recentchooser1\">\n\
    \    <property name=\"visible\">True</property>\n    <property name=\"limit\"\
    >50</property>\n</widget>\n```\n\nThe main advantage of using GConf is that the\
    \ configuration data is stored in a tree which is used previously, which makes\
    \ it a lot easier to manage the preferences of a large application, with perhaps\
    \ many preferences and configuration options. It also enables notifications across\
    \ applications. This makes it possible for multiple applications, or running instances\
    \ of the same application, to immediately react to changes to preferences, and\
    \ perform the necessary work to adapt to the new preferences."
