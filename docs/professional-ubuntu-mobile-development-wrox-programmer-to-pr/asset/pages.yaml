  md: '# 2

    nThe Development Environment


    The development process for a mobile device tends to be different from the normal
    process that you might use when you develop on a workstation or server. Often
    you''ll need to generate a complete OS image from scratch in a working environment,
    which you''ll install on the target device.


    In the case of the Ubuntu Mobile project, a complete set of packages is available
    to the developer, so many of the complexities that are typically associated with
    building-your-own-OS-from-scratch projects are not an issue. Various tools bridge
    the remaining gap between Ubuntu Mobile development and normal Ubuntu development.


    This chapter shows different ways you can access the development environment that
    you''ll need in order to begin development. Developing for a mobile device, which
    perhaps has a different architecture from your workstation — for example, an i86
    desktop and a Low Power Intel Architecture (LPIA) device — it becomes necessary
    to separate the host (sometimes called the source) from the guest (sometimes called
    the target) environment. The most common way today is to use virtualization.


    Virtualization completely separates an operating system from the underlying platform
    resources — different technologies can be used to make this happen. For the Hardly
    release, Ubuntu choose to focus virtualization efforts on KVM. Kernel Virtual
    Machine (KVM) is a patch to the kernel that enables guest operating systems to
    sit directly on the host hardware. KVM also employs Quick Emulator (QEMU) to turn
    the Linux Kernel itself into a Hypervisor.


    > A Hypervisor is software that allows multiple operating systems to run on a
    host computer concurrently. QEMU is virtualization software that enables hardware.


    KVM, then, is intended for systems where the processor has hardware support for
    virtualization and it has the added advantage of falling back to QEMU if this
    is not available. By sitting on the'
