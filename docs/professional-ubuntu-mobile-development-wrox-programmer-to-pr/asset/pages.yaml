    # Arm on QEMU


    Before installing Ubuntu on hardware, it is better to try it with an emulator
    first. Working in this way allows applications to be built and packaged with a
    native compiler rather than cross-compiling.


    A cross compiler is a compiler that is capable of creating executable code for
    an architecture other than the one on which the compiler is run. Creating ARM
    binaries on an i386 environment is one example.


    To do this for Ubuntu Jaunty, download the script from http://people.ubuntu.com/~agra/build-arm-rootfs.
    Make it executable:


    ```

    $ chmod +x qemu build-arm-rootfs

    ```


    Note that QEMU and debootstrap need to be installed.


    Run the following script (this command takes a long time):


    ```

    sudo ./build-arm-rootfs -f pumd-arm <user> -p <password> --notargetball

    ```


    > Take a note of this username and password in the command above because they
    are the username and password used to login into the guest machine.'
