- img_proc: true
  md: '# Appendix E: D-Bus: An Overview


    The other instances are created per user login session. These instances allow
    applications in the user''s session to communicate with one another.


    The system-wide and per-user daemons are separate. Normal within-session IPC does
    not involve the system-wide message bus process and vice versa.


    # D-Bus Applications


    D-Bus is designed for two specific cases:


    +   - Communication between desktop applications in the same desktop session;
    to allow integration of the desktop session as a whole, and address issues of
    process lifecycle (When do desktop components start and stop?)


    +   - Communication between the desktop session and the operating system, where
    the operating system would typically include the GNOME and KDE desktops and any
    daemons or processes


    For the within-desktop-session use case, the GNOME and KDE desktops have significant
    experience with different IPC solutions such as CORBA and DCOB. D-Bus is built
    on that experience and tailored to the needs of these desktop projects.


    The problem solved by the system-wide or communication-with-the-OS case is best
    explained by the following text from the Linux Hotplug project:


    > A gap in current Linux support is that policies with any sort of dynamic "interact
    with user" component are currently supported. For example, that''s often needed
    the first time a network adapter or printer is connected, and to determine appropriate
    places to mount disk drives. It would seem that such actions could be supported
    for any responsible human who can identify: single user workstations, or any system
    is remotely administered.


    > This is a classic "remote sysadmin" problem, where in this case hotplugging
    needs to deliver an event from one domain (operating system kernel) in this another
    (desktop for a logged-in user, or remote sysadmin). Any effective response must
    go the other way: the remote domain taking action lets the kernel expose the desired
    devices. (The action can be taken asynchronously — for example, letting new hardware
    be idle until it finishes.) At this writing, Linux has widely adopted solutions
    to such problems. However, the D-Bus work may begin to solve that problem.


    D-Bus might be useful for other purposes the one for which it was designed (Figure
    E-1). General properties that distinguish it from other forms of IPC are:


    +   - Binary protocol to be used asynchronously (similar in spirit to the X Window
    System protocol),


    +   - Stateful, reliable connections held open over time.


    +   - The message bus is a daemon, not a "swarm" or distributed architecture.


    +   - Many implementation and deployment issues are specified rather than left
    ambiguous-configurable/pluggable.


    298'
