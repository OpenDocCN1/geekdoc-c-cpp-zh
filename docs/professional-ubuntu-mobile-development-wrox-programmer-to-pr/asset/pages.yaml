  md: "# Chapter 5: Application Packaging\n\n# PBuilder\n\nIt is possible to build\
    \ packages the way we have shown earlier, you must already have all the build\
    \ dependencies of the package that you are building on your running system.\n\n\
    A tool pbuilder can help with this. pbuilder checks the build dependencies automatically\
    \ and it does this because the package is built within a minimal Ubuntu installation\
    \ with the build dependencies downloaded according to the Debian/control.\n\n\
    The primary aim of pbuilder is different from other auto-building systems in Debian\
    \ in that it does not try to build as many packages as possible It does not try\
    \ to guess what a package needs, and in most cases it tries the worst choice of\
    \ all if there is a choice to be made.\n\n# Configuring PBuilder\n\nIt can be\
    \ a good idea to configure pbuilder. There are many ways to do this in the /etc\
    \ directory is the main configuration file for pbuilder called pbuilderrc.\n\n\
    Edit this file to look\n\n```\nBASEGTZ=/var/cache/pbuilder/base.tgz\n#EXTRAPACKAGES=gcc3.0-athlon-builder\n\
    #export DEBIAN_BUILDARCH=athlon\nBUILDPLACE=/var/cache/pbuilder/\nMIRRORPATH=http://archive.ubuntu.com/ubuntu\n\
    USEPROC=yes\nUSEDEVOPTS=yes\nUSEDEVFS=no\nBUILDDIR=/var/cache/pbuilder/result/\n\
    # specifying the distribution forces the distribution on \"pbuilder update\"\n\
    DISTRIBUTION=\"\"\n# specifying the components of the distribution (the default\
    \ is \"main\")\n#COMPONENTS=\"main restricted universe multiverse\"\n# specifying\
    \ the cache for APT\nAPTCACHE_PATH=/var/cache/pbuilder/aptcache/\\nAPTCACHEHERDLINE=\"\
    yes\"\nREEMOVEPACKAGES=\"\"\n#HOOKDIR=/usr/lib/pbuilder/hooks/\nHOOKDIR=\"\"\n\
    # make debconf not interact with user\nexport DEBIAN_FRONTEND=\"noninteractive\"\
    \nDEBIMAIL=\"\"\n# for pbuilder debuild (sudo -E keeps the environment as-is)\n\
    BUILDSOURCEROOTDIR=\"fakeroot\"\nBUILDEREROOTID=sudo\n# to satisfy build-dependencies;\
    \ the default is an internal shell\n# implementation which is slow; there are\
    \ two alternative\n# implementations, the \"experimental\" implementation,\npbuilder-satisfydepends-experimental,\
    \ which might be useful to pull\n# packages from experimental or from repositories\
    \ with a low APT Priority,\n the \"aptitude\" implementation, which will resolve\
    \ build-dependencies and\nbuild-conflicts with aptitude which helps dealing with\
    \ complex cases but does\n```\n\n120"
