  md: "# Chapter 4: Application Development\n\n# D-Bus Security\n\nThe bus daemon\
    \ has multiple instances on a typical computer. The system daemon has heavy security\
    \ restrictions on what messages it will accept, and is used for system-wide communication.\
    \ The other instances are created once per user login session. These instances\
    \ allow applications in the user's session to communicate with one another.\n\n\
    Security is configured for these instances in a configuration file. This file\
    \ lives in /etc/dbus-1/system.d.\n\nTo configure policies, create a file in this\
    \ directory called application.conf with the policies (this file could be anything\
    \ — the name does not matter). This file will look like:\n\n```\n<DOCTYPE busconfig\
    \ PUBLIC\n//freedesktop//DTD D-Bus Configuration 1.0//EN\"\n\"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd>\n\
    <busconfig>\n  <policy user=\"root\">\n    <allow own=\"net.sourceforge.PyDistcc\"\
    \n      send_destination=\"net.sourceforge.PyDistcc\"\n      send_interface=\"\
    net.sourceforge.PyDistcc\"\n  </policy>\n  <policy user=\"rodrigo\">\n    <allow\
    \ own=\"net.sourceforge.PyDistcc\"\n      send_destination=\"net.sourceforge.PyDistcc\"\
    \n      send_interface=\"net.sourceforge.PyDistcc\"\n  </policy>\n  <policy at_console=\"\
    true\">\n    <allow send_destination=\"net.sourceforge.PyDistcc\"\n      send_interface=\"\
    net.sourceforge.PyDistcc\"\n  </policy>\n  <policy context=\"default\">\n    <deny\
    \ own=\"net.sourceforge.PyDistcc\"\n      send_destination=\"net.sourceforge.PyDistcc\"\
    \n      send_interface=\"net.sourceforge.PyDistcc\"\n  </policy>\n</busconfig>\n\
    ```\n\nThe code example shows the use of policies. The default policy of the D-Bus\
    \ system bus is as:\n\n+   - Name ownership is DENIED by default.\n- Method calls\
    \ are DENIED by default.\n- Replies to method calls, including errors, are PERMITTED\
    \ by default.\n- Signals are PERMITTED by default.\n\nTherefore each service must,\
    \ in its policy configuration, permit an appropriate user to own the name it wishes\
    \ to claim — for example:\n\n```\n<policy user=\"rodrigo\">\n  <allow own=\"net.sourceforge.PyDistcc\"\
    />\n</policy>\n```"
  merge: -1
