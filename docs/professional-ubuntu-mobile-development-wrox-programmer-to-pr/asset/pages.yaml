  md: "# Chapter 4: Application Development\n\nThemeable EFL applications are made\
    \ using the Edge Layout engine, which sits above Evas, the X11 canvas library.\
    \ Edge features a transparent, signal-based separation of interface and application\
    \ logic so that every application it uses is \"skinnable\".\n\nAn Edge interface\
    \ file is just a single file arranged to accommodate interface information, images,\
    \ and fonts. This is generated by processing an Edge Data Collection file with\
    \ the Edge Compiler. This makes them a device very easy. An example of how a theme\
    \ layout can be seen in the main.edc file for a wider border:\n\n```\n#define\
    \ COLOR_FG 246 151 67 255\n#define COLOR_BG 245 245 255\n\nfonts {\n  /* use the\
    \ default */\n}\n\ncollections {\n  #include \"border.edc\"\n}\n\nThis includes\
    \ another file border.edc, which looks like this:\n\ngroup {\n  name, \"e/widgets/border/default/border\"\
    ;\n\nparts {\n  part {\n    name, \"main\";\n    type, RECT;\n    description\
    \ {\n      state, \"default\" 0.0;\n      color, COLOR_FG;\n    }\n  }\n  part\
    \ {\n    name, \"main_inner\";\n    type, RECT;\n    description {\n      state,\
    \ \"default\" 0.0;\n      color, COLOR_BG;\n      rell.offset, 1 1;\n      rell.offset,\
    \ -2 -2;\n    }\n  }\n}\n```\n\nNote that the main_inner file is saved in the\
    \ same directory as main.edc.\n\nHere, the main_inner part hides all of main,\
    \ except for the 1-pixel border. A key concept is the notion of \"parts\", which\
    \ come together to form the theme.\n\nA theme can then be compiled using:\n\n\
    ```\n$ edge_cc main.edc\n```"
