    # Creating a Default Ubuntu Image


    Now is the time to think about creating the image. This image should be installable
    on a device and to accomplish this, an installer is necessary.


    The techniques that are demonstrated in the rest of the chapter are useful only
    when working with mobile devices, but can also be easily adapted to create installation
    images for desktops and servers.


    # Choosing Which Type of Installer to Use


    There are two different types of installer; deforming which one to use will depend
    to some degree on the target audience for the device and what type of image you
    want to create.


    # When to Use Debian-(Ubuntu Alternate Image)


    The alternate installer is used for more advanced installations as it provides
    options that are not available with the regular desktop image. This might include
    passing options to kernel modules or forcing a static network configuration. Consider
    this another example: In Chapter 6 a user''s home directory was created. If this
    needs to be extended a whole drive on a device, then this option is available
    only in the alternate image.


    The alternate installer should also be used if the installation needs to be automated
    across a number of devices or if the device has a low memory footprint (less 256MB
    RAM).


    # When to Use Ubiquity (Ubuntu Desktop Image)


    Ubiquity is a graphical interface for Ubuntu, written in Python, which uses the
    debian-installer (d-i) as a backend for many of its functions. Ubiquity was built
    because the original interface to d-i was seen as some fairly crude. This is a
    d-i system called debconf to use its user interface, and because it depends on
    responses to questions it can lack a certain flexibility. Ubiquity is different
    as its primary focus is on ease of use for new users, and so uses a filter debconflector,
    which sits between d-i and the debconf front end, intercepting the debconf protocol
    into events that can be handled in the same way as UI elements with widget libraries
    like GTK+ or Qt.


    > More info about the debian-installer can be found at http://d-i.alioth.debian.org/doc/talks/debconf/


    # Getting Started on the Image: Preparing the Environment


    There are many ways to build Ubuntu images. A variety of existing tools attempt
    to automate this task — as remastersys, uck (Ubuntu Customization Kit), and methods
    that manually edit the default Ubuntu images. This section will describe the official
    Ubuntu way to create images.'
