    # # Summary


    A good way to learn theming is to examine other people'' themes. This chapter
    has shown the make-up of a theme and how theming works on both Ubuntu MID and
    Ubuntu Netbook Remix. It also discussed basic theme customization and how this
    can be performance tested. Part of the appeal of Ubuntu for an OEM is that it
    is fully customizable and that a device can be configured to look exactly as the
    manufacturer wishes. This is a powerful feature as more and more device become
    involved in the mobile device market.'
