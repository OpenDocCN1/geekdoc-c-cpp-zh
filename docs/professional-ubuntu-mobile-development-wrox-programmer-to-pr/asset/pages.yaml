  md: '# D-Bus: An Overview


    This is a condensed version of the canonical D-Bus tutorial found at http://dbus.freedesktop

    .org/doc/dbus-tutorial.html, which was written by Havoc Pennington, David Wheeler,

    John Palmieri and Colin Walters.


    D-Bus is a system for interprocess communication (IPC). Architecturally, it has
    several layers:


    +   - A library, libdbus, allows two applications to connect to each other and
    exchange

    messages.

    - A message daemon executable, built on libdbus that multiple applications can
    connect

    to The daemon can run messages from one application to zero or more other

    applications.

    - Wrapper libraries or bindings based on particular application frameworks — for
    example,

    libdbus-glib and libdbus-qt. There are bindings to languages such as Python.

    These libraries are the API most people use, as they simplify the details of

    D-Bus programming. libdbus is intended to be a low-level backend for the higher
    level

    bindings. The libdbus API is useful only for implementation.


    libdbus supports one-to-one connections, just like a raw network. However, rather

    sending byte streams over the connection, you send messages. Messages have a header

    identifying the kind of message, and a body containing a payload. libdbus abstracts
    the

    exact transport used (sockets versus whatever), and handles such authentication.


    The bus daemon forms the hub of a wheel. Each spoke of the wheel is a one-to-one

    connection to an application using libdbus. An application sends a message to
    the bus daemon

    over its spoke, and the bus forwards the message to other connected applications

    appropriate. Think of the daemon as a router.


    The bus daemon has multiple instances on a typical computer. The first instance
    is a machine-

    global singleton, that is, a system daemon similar to sendmail or Apache. This
    instance has heavy

    security restrictions on what messages it will accept, and is used for system-wide
    communication.'
