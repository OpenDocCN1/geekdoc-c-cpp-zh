    # Building Your Own Virtual Image


    Rather than using a pre-rolled image from cdimage.ubuntu.com, it is possible to
    build a virtual image. To do this, install a tool called ubuntu-vm-builder.


    ```

    $ sudo apt-get install ubuntu-vm-builder

    ```


    Then run like this:


    ```

    $ ubuntu-vm-builder kvm jaunty --mem=512 --user <username> --pass <password>

    --dpkg openssh-server

    ```


    This creates a minimal KVM virtual machine for jaunty, adds a user with a password,
    and adds the openssh-server package to the image. Creating a virtual image this
    way can be useful in order to provide a clean testing environment. It can also
    be found if the preceding command is combined with a local repository mirror such
    as:


    ```

    $ ubuntu-vm-builder kvm jaunty --mem=512 --user <username> --pass <password>

    --dpkg openssh-server --mirror http://localhost:9999

    ```


    This command creates a folder with two files in disk: q0.cow2, which is the QEMU
    image, and a script called run.sh. Execute the script like this:


    ```

    ./run.sh

    ```


    This passes the qcow image as a parameter to QEMU.


    # Working with Images


    The Ubuntu-Mobile team has made some scripts available, which you''ll find in
    the mobile-scripts package at https://code.edge.launchpad.net/ubuntu-mobile-dev/ubuntu-mobile/mobile-scripts.
    These scripts are used by the Ubuntu Mobile developers when they''re working with
    images. To get the scripts first, install Bazaar, which is a source code management
    tool that is by Ubuntu and many other software projects:


    ```

    $ sudo apt-get install bzr

    ```'
