  md: '# Introspection


    D-Bus objects may support the interface org.freedesktop.DBus.Introspectable. This
    interface has one method, introspect, which takes no arguments and returns an
    XML string. The XML string describes the interfaces, methods, and signals of the
    object.


    # Python and D-Bus


    There are two dbus deemons. Each user login session should have a session bus,
    which is local to that session. It is used to communicate between desktop applications.
    Connect to the session bus by creating a SessionBus object.


    ```

    import dbus

    session_bus = dbus.SessionBus()

    ```


    The system bus is global and usually started during boot; it''s used to communicate
    with system services such as udev, Network Manager, and HAL. To connect to the
    system bus, create a SystemBus object:


    ```

    import dbus

    system_bus = dbus.SystemBus()

    ```


    Of course, you can connect both in the same application.


    # Method Calls


    D-Bus applications can export objects for other applications'' use. To start working
    with an object another you need to know the following:


    +   - The bus name — This identifies the application that you want to communicate
    with. You''ll usually identify applications by a well-known name, which is a dot-separated
    string with a reversed domain name, such as org.freedesktop.NetworkManager or
    com.example.


    +   - The object path — Applications can export many objects. For instance, example.com''s
    word processor might provide an object representing the word processor application
    itself and for each document that is opened, or it might also provide an object
    for each paragraph that''s within a document.


    To identify which one you want to interact with, you use an object path, a slash-separated
    string representing a filename. For instance, example.com''s word processor might
    provide an object at / representing the word processor itself, and objects at
    /documents/123 and /documents/345 representing opened document windows.


    As you expect, one of the main things you can do with remote objects is to call
    their methods. In Python, methods may have parameters, and they may return one
    or more values.'
