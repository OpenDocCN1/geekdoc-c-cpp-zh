  md: '# Chapter 2: The Development Environment


    +   - livecd.ubuntu-mid.sort

    - livecd.ubuntu-mid.squashfs

    - livecd.ubuntu-mid.initrd

    - livecd.ubuntu-mid.initrd-lpia

    - livecd.ubuntu-mid.kernel

    - livecd.ubuntu-mid.kernel-lpia


    Now it is possible to use one of the scripts (create-image.sh) from mobile-scripts
    to actually create the image.


    Make sure the script is in the same folder as the files mentioned and that it
    has the executable permission bit set:


    ```

    $ chmod +x create-image.sh

    $ /create-image.sh ubuntu-mid 40

    ```


    where ubuntu-mid (LPIA) is the distribution to be built and 40 is the extra space
    in MB to be allocated in the image for installing extra packages and other customizations
    that may be required.


    The edit_squashfs.sh script (shown next) can also be used to alter the size of
    an image.


    The built image can be tested now in KVM/QEMU:


    ```

    $ kvm -localtime -m 512 -hda ubuntu-mid.img

    ```


    # Installing Applications inside the Image


    The edit_squashfs.sh from mobile-scripts spawns a root shell inside the image
    that was just built in the previous section. It is possible to run apt-get update
    and install packages. On exiting the shell with Ctrl+D or the exit command, the
    script will offer to re-roll the squashfs for you.


    The script is used like this:


    ```

    $ sudo ./edit_squashfs.sh ubuntu-mid.img

    ```


    It is a good idea to run apt-get clean when inside the chroot and exiting to clean
    up space in the /var/cache/apt/archives directory. Indeed the preceding script
    does this. This is because space is a premium. Another idea is also to install
    deborphan or gtkorphan in order to remove unused packages and libraries that are
    taking up space (apt-get install deborphan).


    The space available to install new applications/packages is what was specified
    in the create-image.sh command (40MB). If this needs to be increased, use the
    grow_image.sh script discussed next.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Chapter 2: The Development Environment


    # Increasing a Downloaded Image Size


    To increase the size of the downloaded image (perhaps to install more applications)
    use the grow_image sh script.


    This script was created to satisfy a potential case whereby OEM wants to modify
    the applications on a device and maybe the theme but does not want to modify the
    kernel or the seeds.


    > Seeds are discussed in more detail in Chapter 11.


    You use the script like this:


    ```

    $ ./grow_image.sh ubuntu-mid.img 50

    ```


    This creates a new image with the size specified (50MB) and then it is possible
    to run the edit_squashfs.sh script on this to make the changes necessary and then
    re-roll the image.


    # Summary


    Mobile development can be challenging. You need to use your workstation to develop
    for a device with perhaps a different processor, as is the case with Ubuntu ARM
    or with a different operating system.


    Creating an image (or downloading one from the archives) and then running it in
    VirtualBox or KVM/ QEMU will provide an isolated environment. This environment
    can then be used for software development, software testing, or application packaging.'
