  md: "# Chapter 4: Application Development\n\nIt must also allow method calls to\
    \ be made on objects exports, for particular users. This can be done by allowing\
    \ method calls to the claimed name:\n\n```\n<policy user=\"rodrigo\">\n  <allow\
    \ owner=\"net.sourceforge.PyDistcc\">\n    send_destination=\"net.sourceforge.PyDistcc\"\
    \n    send_interface=\"net.sourceforge.PyDistcc\"/>\n</policy>\n```\n\nIt is important\
    \ that send_destination be included on all allow or deny tags and omitting it\
    \ is a potential security hole. Do not do this:\n\n```\n<allow send_interface=\"\
    x.y.z\" />\n```\n\nIt would allow any service to receive method calls of the given\
    \ instance!\n\n# PolicyKit\n\nIf the D-Bus service needs privileges (something\
    \ requiring sudo) then it is possible to use PolicyKit to control this access.\n\
    \nPolicyKit (http://hal.freedesktop.org/docs/PolicyKit/PolicyKit.html) comes by\
    \ default with Ubuntu and is divided into two parts - the first is a 'mechanism'\
    \ (which runs privileged) and the second part is the 'policy agent' (which runs\
    \ unprivileged) with the two parts interacting on the system. The 'mechanism'\
    \ uses PolicyKit to determine whether to allow access to the process or the user\
    \ who requested it. As an example the devicekit power policy (which is defined\
    \ in the XML file /usr/share/PolicyKit/org.freedesktop.devicekit.power.qos.policy)\
    \ has an 'action' concerning minimal latency\n\n```\n<action id=\"org.freedesktop.devicekit.power.qos.set-minimum-latency\"\
    >\n  <description>Set administrator settings for latency</description>\n  <message>Authentication\
    \ is required to set administrator settings for latency</message>\n  <defaults>\n\
    \    <allow allow_inactive>no</allow_inactive>\n    <allow allow_active>auth_admin</allow_active>\n\
    \  </defaults>\n</action>\n```\n\nsending a D-Bus message\n\n```\n$ dbus-send\
    \ --session --print-reply \\\n  --dest=org.freedesktop.PolicyKit.AuthenticationAgent\
    \ / \\\n  org.freedesktop.PolicyKit.AuthenticationAgent.ObtainAuthorization \\\
    \n  string:org.freedesktop.devicekit.power.qos.set-minimum-latency \\\n  uint32:0\
    \ \\\n  uint32:$PPID\n```\n\npops up an interface asking for authorization. Changing\n\
    \n```\n<allow_active>auth_admin</allow_active>\n```"
