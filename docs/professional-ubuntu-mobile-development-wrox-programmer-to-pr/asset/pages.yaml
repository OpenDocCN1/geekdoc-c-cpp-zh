  md: "# # Chapter 3: Power Management\n\n![](img/001c747b841ab338ed35c50dbdd0c933_76_0.png)\n\
    \nFigure 3\n\n# # Device Kit Power\n\nThe DeviceKit set of daemons replaces the\
    \ core functionality of HAL — the Hardware Abstraction layer. The daemons were\
    \ written because applications currently need a lot of complicated code to do\
    \ things such as working out the remaining battery life. All of the DeviceKit\
    \ daemons are activated and have low memory requirements.\n\nDeviceKit-power also\
    \ implements a QoS (Quality of Service) interface for latency control (discussed\
    \ shortly). This is needed to produce a device that uses little power when idle,\
    \ but at the same time does not feel sluggish.\n\nDeviceKit-power provides a D-Bus\
    \ interface (for more information on D-Bus see Chapter 4) for power sources on\
    \ the device and to control device-wide power management. Any application can\
    \ access the org.freedesktop.DeviceKit.Power service on the system message bus.\n\
