    squeeze longer battery life (up to 8 hours) out of a very thin form factor.


    Freescale, with Peloton, an Original Device Manufacturer originally part of ASUS,
    are working with Canonical to customize Ubuntu for this architecture. The Ubuntu
    Port to arm is discussed further in Appendix A.


    The Ubuntu Netbook Remix is a standard Ubuntu desktop along with some specific
    customizations to enable it to work better on devices with small screens, such
    as netbooks.


    These are the Ubuntu Netbook Remix Launcher, which provides an alternate menu
    along with a Go Applet, which works in conjunction with the launcher to provide
    access to the desktop. There is also Maximus, which is a daemon to automatically
    maximize a window with a Window Picker Applet, which displays open windows as
    icons on the panel. These tools are pulled together into a new theme (for jaunty)
    called Ubuntu Network Theme.


    It is easy to switch between the “classic” and the netbook desktops by installing
    the desktop switcher package:


