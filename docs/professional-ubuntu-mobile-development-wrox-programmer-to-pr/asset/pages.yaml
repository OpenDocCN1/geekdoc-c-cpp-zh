  md: "# Chapter 4: Application Development\n\n# Layout\n\nRather than explicitly\
    \ designing the layout of an application, defining the specific coordinates and\
    \ dimensions of each element of the application, GTK+ uses relative positioning\
    \ to indicate the placement of objects relative to each other. \"Packing boxes\"\
    \ are the main objects that are used to achieve this placement.\n\nThese are invisible\
    \ widget containers that we can pack widgets into which come in two forms, a horizontal\
    \ box, and a vertical box. You may use any combination of boxes inside or beside\
    \ boxes to create the desired effect.\n\n# Horizontal Boxes\n\nWhen packing widgets\
    \ into a horizontal box, the objects are inserted horizontally from left to right:\n\
    \n```\ngtk_hbox_new();\n```\n\nA horizontal box uses the functions gtk_box_pack_start()\
    \ and gtk_box_pack() to control layout and spacing.\n\n# Vertical Boxes\n\nIn\
    \ a vertical box, widgets are packed from top to bottom:\n\n```\ngtk_vbox_new();\n\
    ```\n\nA vertical box uses the functions gtk_box_pack_start() and gtk_box_pack()\
    \ to control layout and spacing.\n\n# Glade\n\nIn practice, laying out an application\
    \ is often done using Glade. The Glade Interface Designer is a GNOME application\
    \ that allows laying widgets visually rather than using C code. Glade can generate\
    \ C or C++ source code, which compiles to build the application; however, method\
    \ is no longer the best way to use Glade. Instead, use the Glade project, a .glade\
    \ file in XML format, is parsed by the application at runtime using libglade.\
    \ This allows you to modify/update the UI without recompiling the program and\
    \ separates the layout from the interface\n\nA Glade file is used in an application\
    \ as follows:\n\n```\n/* \ngxml = glade_xml_new(GLADE_FILE, NULL, NULL);\nglade_xml_new_signal_autoconnect(gxml);\n\
    ```\n\nThe call to glade_xml_new creates a new glade_xml object, which gxml references,\
    \ and it also creates all the widgets in the Glade file, which we pass to the\
    \ function as the first argument. This would be declared somewhere in the application,\
    \ as in the following:\n\n```\n/* this will hold the path to the glade file after\
    \ the \"make install\" */\n#define GLADE_FILE PACKAGE_DATA_DIR/gnome3/gnome3.glade\n\
    ```"
