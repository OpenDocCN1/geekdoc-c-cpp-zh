  md: '# Chapter 1: Mobile Linux


    The major eras in computer technology can be classified as follows:


    +   - 1960s — Mainframes (“Big Iron”) and minicomputers (multiuser, interactive)


    +   - 1970s — Personal/desktop computer: microprocessor-driven, installable applications


    +   - 1980s — Luggables: movable computers, weighing 15–30 pounds


    +   - 1990s — Laptops followed by slimmed down notebooks: 14-inch screen or larger


    +   - 2000s — Notebooks: 12-13 inch screen, Portable Media Players (for example,
    iPod)


    +   - 2007–2010 — Netbooks: 7–10.2 inch, Mobile Internet Devices (MIDs): 4–7-inch
    screen


    The year 2000 marked the beginning of the cell phone and smart device era. The
    Nokia 9210 Communicator and RIM Blackberry hit the market with compact offerings
    that were phones but also much more. They weren''t general purpose computers,
    but you might have gotten the sense that they what they wanted to be when they
    grew up.


    # Changing Focus


    Two of the defining characteristics in the evolution of computers have been physical
    and display size. These defining attributes influence user interactions as well
    as developer strategies and solutions.


    Apple opened the door on the smallest consumer-oriented segment with its insanely
    successful introduction of iPods in October 2001. The first iPod was a computer
    stick the size of a small pack of gum. Consumer electronics have a tendency to
    get smarter through the magic of software and soon the ip line complete media
    devices.


    In January 2007, Apple completely blew the roof off this segment by introducing
    the iPhone. Later in the year, the iPod Touch was introduced. These portable electronic
    devices had powerful operating systems under the hood — variants of OS X specially
    for the hardware. Elegantly packaged, with WiFi, and high-resolution touches,
    they ran applications like those on notebook computers. Apple was effectively
    shifting what would come to be a Mobile Internet Device (MID).


    Loyal customers stood in long lines to snap up the first products. International
    customers paid huge premiums for early adopters. Enthusiastic developers created
    thousands of new applications ... even though it seemed Apple didn''t want them.
    An ecosystem of telephone carriers, music providers, and accessory makers helped
    grow the market.


    Apple sold an astounding number of iPods — more than 173 million of these very
    mobile devices by September 2008. You''ve seen them everywhere — on trains, planes,
    and buses; and in gyms, schools, office buildings, and sports venues. (Goodness,
    I have one who owns nine of these!)


    When Apple introduced the Macintosh in 1984, they rewrote the world of human interface
    design. In releasing the iPhone and iPod Touch, Apple rewrote the book on user
    interface design for small mobile computers. The iPhone redefined what was possible
    for small consumer packaging. Consider the specs: 3.5-inch diagonal multi-touch
    display (480×320 pixel resolution at 163 dpi), less than 5 ounces, in slim packaging.'
