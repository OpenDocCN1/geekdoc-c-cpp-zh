    # Turning Points


    The financial crisis that began in September 2008 tripped up economies around
    the world. Big software companies, leading hardware manufacturers, and dominant
    manufacturers were all affected. At the beginning of 2009, the mobile phone began
    to slow down. TechCrunch reported that the "top five cell phones (Nokia, Samsung,
    LG, Sony Ericsson, and Motorola) dropped 13 percent year-over-year in the fourth
    quarter of 2008. Unit shipments decelerated from 14 percent in the second quarter
    to 2 percent growth in the third, and finally went into negative territory in
    the fourth quarter." The article''s author asked, "Are cell phones no longer a
    growth business?"


    Even Apple''s idyllic iPhone fell off the selling cliff. Apple sold 6.9 million
    units in the September 2008 quarter, but that fell by more than 25 percent to
    4.4 million in the December quarter. At the same time, RIM made a big-splash introduction
    — backed by a $100 million marketing campaign — of its highly anticipated BlackBerry
    Storm. It was judged by many observers to be a relative flop compared to the iPhone
    introduction: BlackBerry sold a half-million units in the first month.


    Cell phones and laptops took talk in the first years of the twenty-first century,
    but it could be a very different picture over the course of the next decade. The
    same day saw declines in phone sales were being reported, a lead story in BusinessWeek
    rallied excitement around a promise of growth: "Intel Readies Push into Mobile
    Internet Devices."


    While people were getting on on hold, notebook (and mobile) sales were rising.
    The December 2008 Wall Street Journal reported quarterly sales of notebook computers
    that exceeded that of desktop sales for the first time ever:


    World-wide shipments of notebook computers rose nearly 40% from last year to 38.6
    million units as desktop shipments 1.3% to 38.5 million units.'
