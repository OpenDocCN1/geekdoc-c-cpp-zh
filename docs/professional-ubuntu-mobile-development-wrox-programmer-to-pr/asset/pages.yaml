  md: '# Essential reading for open source software developers


    As the most popular open source operating system in use today, Ubuntu has recently
    released versions that are aimed at device manufacturers who build Internet-ready
    handheld devices based on both the Atom and ARM processors. This exciting book
    provides an overview of the tools and techniques you need to understand when customizing
    a mobile Internet device, and offers step-by-step tutorials that walk you through
    some common tasks. Written by Ubuntu community developers, the book begins with
    an overview of the Linux landscape and then moves through setting up, developing,
    packaging and building a distribution for a mobile device.


    +   - Discusses why the look and feel of a device is so important

    - Reviews how to choose the right applications

    - Shows how to develop applications for a mobile device

    - Explains how to prepare your application for distribution

    - Offers techniques for fine-tuning the kernel

    - Walks through "customizing" and building your own distribution

    - Discusses how to test for stands of stability and performance

    - Reveals tips for handling common problems and executing solutions


    Ian Lawrence is a Scrum Master at the Instituto Nokia de Tecnologia. He is a founding
    member of the Ubuntu Brazil and Debian Americas communities.


    Rodrigo Cesar Lopes Belem is a freelance software developer and advocate who has
    contributed to many open source projects such as Enlightenment and Ubuntu. He
    currently works as a software developer at the Instituto Nokia de Tecnologia.


    Wrox Professional guides are planned and written by working programmers to meet
    the real-world needs of programmers, developers, and IT professionals. Relevant,
    they address the issues technology professionals face every day. They provide
    practical solutions, and expert education in new technologies, all designed to
    help programmers do a better job.


