- img_proc: true
  md: 'If no output directory is specified, the source package is extracted into a
    directory named

    source-version under the current working directory.


    # dpkg-scanpackages


    dpkg-scanpackages sorts through a tree of Debian binary packages and creates a
    Packages.gz

    file, which can be used by a device''s software update tool.


    # dpkg-scansources


    dpkg-scanpackages sorts through a tree of Debian source packages and creates a
    Packages.gz

    file, which can be used by a device''s software update tool.


    To use the two preceding commands and to make your custom Debian packages apt-getable,

    you need the following files in the same directory:


    +   - The binary packages (.deb)

    - The source packages (.orig.tar.gz, .diff.gz, and .andsc)

    - An optional override file


    # diff


    The diff program can be used to compare two files and to make patches. A typical
    example

    might be `diff -run file.old file.new > file.diff`. This command will create a
    diff

    (recursively if directories are involved) that shows the changes, or "delta" between
    the two files.


    # patch


    The patch program is used to apply a patch (usually created by diff) to a file
    or directory.

    to apply the patch created previously, use `patch -p0 < file.diff`. The `-pN=`
    parameter

    strips leading slashes from each file found in the patch. For example, if the
    file name was /src

    ui/list.c, setting p0 gives the complete path whereas p1 gives src/list.c.


    # build-essential


    This package contains a list of required tools that are essential when building

    source from source.


    If you have this build-essential software installed, you only need to install
    whatever a package

    specifies as its build-time dependencies to build that package.


    # devscripts


    devscripts contains many scripts that make the package work easier, including
    debclean,

    debdiff, and dget.


    debclean is used to purge a Debian source tree, debdiff is used to compare two
    versions of a

    Debian package to check for added or removed files, and dget downloads Debian
    source and

    binary packages.


    # gnupg


    gnupg is a complete and free replacement for PGP used to sign files (including

    packages).'
