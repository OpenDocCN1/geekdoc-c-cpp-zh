  md: '# NETWORKING


    The following commands are necessary for networking in both VirtualBox and KVM.
    First, on the guest

    computer, log in with the user account created previously, open a terminal and
    install openssh-server:


    ```

    $ sudo apt-get install openssh-server

    ```


    Then add a user:


    ```

    $ sudo adduser <username>

    ```


    This sets up the basic tools that are required for networking.


    If you would like full networking between the host and guest, use the “Advanced
    Networking on

    VirtualBox and KVM/QEMU” section.


    # Networking in VirtualBox


    On the host, use the VBoxManage command to open a TCP service port which will
    be used

    for SSH. Then, run the following:


    ```

    $ VBoxManage setextradata mid ->

    *VBoxInternal/Devices/pcnet/0/LIN#0/Config/ssh/HostPort* 2222

    $ VBoxManage setextradata mid ->

    *VBoxInternal/Devices/pcnet/0/LIN#0/Config/ssh/GuestPort* 22

    $ VBoxManage setextradata mid ->

    *VBoxInternal/Devices/pcnet/0/LIN#0/Config/ssh/Protocol* TCP

    ```


    The three commands above should be on single lines. The VBoxManage command allows
    you to get

    more information from your virtual machine and it allows you to perform actions
    and configuration

    tuning. For the name of the virtual machine - mid in the above example - was obtained
    by

    running:


    ```

    $ VBoxManage list vms grep Name

    ```


    Completely shutdown the guest computer using the VirtualBox management console.
    On the host

    computer, enter the following:


    ```

    $ ssh -l <username> -p 2222 localhost

    ```


    You have SSH access to the MID guest:


    ```

    $ ssh -1 <username> -p 2222 localhost

    ```


    The HostPort (2222 in this case) must be greater than or equal to 1024 because
    listening on port

    0–1023 requires root permissions.'
