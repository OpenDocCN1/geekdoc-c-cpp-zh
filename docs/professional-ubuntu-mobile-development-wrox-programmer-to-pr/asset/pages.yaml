  md: '# Introduction


    # History and Background to the Ubuntu Mobile Project


    This background comprises various conversations on IRC at #ubuntu-mobile, and
    it now forms the basis of the wiki page at https://wiki.ubuntu.com/MobileTeam/History.


    The project started with an announcement at the start of the Ubuntu Hardy release
    cycle by Ubuntu CTO Matt Zimmermann to the ubuntu-devel mailing list, which said:


    +   - It is clear that new types of device — small, handheld, graphical tablets
    that are Internet-enabled — are going to change the way we communicate and collaborate.
    These devices place new demands on open source software and require innovative
    graphical interfaces, improved management and better responsiveness.


    To fulfill the aims of our mission and in response to the technical challenges
    that these devices pose, we are announcing the Ubuntu Mobile and Embedded project.


    # The Ubuntu Mobile and Embedded Project


    This was an extension of the GNOME Mobile and Embedded Initiative (GMAE). The
    naming of the Ubuntu Mobile and Embedded Project caused confusion at the time
    mainly because there existed a previous Ubuntu Embedded Team. This team was working
    towards the creation of tools, documentation, and a binary/source release for
    the purpose of running Ubuntu on small PC hardware and true embedded devices.
    The Ubuntu Embedded team was mainly looking at getting Ubuntu working on ARM processor-based
    devices.


    The Ubuntu Mobile and Embedded Team then started work during the Ubuntu Hardy
    release cycle and as time passed, most of the focus during this cycle was on getting
    Hilda and Mobile into Ubuntu, and porting to the LPIA architecture from Intel:


    +   - Hilda is an application framework for mobile devices developed by Nokia
    and now a part of GMAE, which focuses on providing a finger-friendly interface.
    It is primarily a set of extensions that provide mobile-device-oriented functionality.


    +   - Moblin is an Intel-sponsored, open-source community and application framework
    to create consumer-friendly applications and user interfaces across a range of
    Mobile Internet Devices (MIDs), netbooks, and embedded devices.


    +   - LPIA (Low Power Intel Architecture) is a new processor architecture, which,
    while resembling i386, uses different optimization options in the compiler and
    different configuration and build options for some packages. Specifically, LPIA
    uses GCC-4.2 as the system compiler (instead of GCC-4.1 which is used for the
    other Ubuntu architectures).'
