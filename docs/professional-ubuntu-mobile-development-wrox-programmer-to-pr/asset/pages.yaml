    elements of Nokia’s Maeno platform.


    # Elementary


    A widget set which is part of the Enlightenment suite is Elementary. This is well
    suited for embedded devices as it has a small footprint and although it is a small
    API, it is one which can be entirely themed using the power of Edge. This makes
    it very attractive for device manufacturers looking to customize a device.


