  md: '# Chapter 4: Application Development


    Part of the appeal of Clutter is that it is cross-platform. The desire to “unite
    the desktops” is currently gaining some momentum. One toolkit which is cross-platform
    is QT, and the most visible use of Qt is the KDE desktop.


    GUADEC (Gnome) and Academy (KDE) recently had a joint conference in Gran Canaria.


    The underlying technology behind KDE QT and Mark Shuttleworth noted the following:


    > Qt will help us deliver more luscious applications to users. Nokia’s continued
    investment in cross-platform Qt libraries, and the Linux platform, is a driver
    of innovation in the free software desktop and mobile device stack.


    # QT


    Nokia recently recruited Trollch and changed the license of QT from GPL v2 to
    the LGPL v2.1 license.


    OEMs can now link directly to QT libraries and not have all their linked code
    become available under the GPL. They now have the option to pick and choose which
    code they want to share.


    The following example was written in Qt4 on Ubuntu Jaanty and is based on the
    tutorial at http://python.org/moin/JonathanGardnerPyQtTutorial but updated for
    QT4. It will


    +   - Use QT Designer to generate Qt UI files.

    - Use pyu to generate Python programs.

    - Use Qt Signals in Python.

    - Create a simple application to interface a system command.


    In order to start developing (in Python) with QT, make sure Python qt-dev, qt4.designer
    and pyqt-tools are installed (apt-get install python-dev-qt4-designer pyqt4.dev-tools).
    Then start using:


    ```

    $designer

    ```


    This command will present Qt designer. This is somewhat like the Glade interface
    that you saw earlier, and functions basically the same way. Drag UI elements to
    the widget and right-click to change properties.


    Create a new widget. Name it pum and then add the following:


    +   - QLineEdit — Name it command in the property dialog.

    - QPushButton — Name it schedule in the property dialog. Change its text to “Schedule”.

    - QDateTimeEdit — Name it time in the property dialog.


    When this is completed, save the file pumd.ui in a new folder. The interface should
    look like Figure 4-8.'
