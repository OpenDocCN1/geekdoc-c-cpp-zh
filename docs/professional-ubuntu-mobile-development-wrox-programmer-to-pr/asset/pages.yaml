  md: '# Chapter 11: Putting It All Together


    “germinated” into a full list of packages required for a specific task. archive
    has a corresponding set of listings the packages it contains — so, for example,
    the base seed will contain a minimum set of packages needed to get a minimal command
    on deploy.


    The seeds expand into a list of packages that are then built using some automated
    scripts to create CD and DVD images. These images are then published daily to
    cimage.ubuntu.com and eventually as releases.ubuntu.com. The types of images that
    are created


    +   - .iso images — Ubiquity (desktop) and the alternate installer

    - .img images — Used for ARM and LPIA images.


    # Inside Seed Generation


    Germinate is a program that constructs lists of packages by reading seed files.
    Seed are files that contain row lists. These raw are processed by the germinate
    program to generate another list, which contains all of the dependencies of the
    packages in the raw list (Germinate also creates lists of suggests and recommends
    in its output). An example output illustrated in Figure 11-1 shows this — the
    “minimal” seed output.


    ![](img/001c747b841ab338ed35c50dbdd0c933_266_0.png)


    Figure 11-1


    In the preceding tale, aptitude is included because depends depends on it, and
    busybox-initramfs is included because it depends on it.


    The raw seed file sometimes has headers at the top of the file, in “key: value”
    format. These are not parsed by germinate but are used by the germinate update-metapack
    when generating its output. The packages in the raw seed lists should be listed
    in bullet form with each package preceded by an asterisk. The raw seed file itself
    can be written in wiki format (as shown below) because everything that does not
    start with an asterisk is ignored.


    ```

    = Development==

    ```


    These packages are needed in order to build Ubuntu packages.


    +   * build-essential

    * fakeroot


    ```

    = Hardware & Network Access ==

    ```


    +   * pptp-linux # client for Microsoft-compatible VPN''s, needed for some ISPs

    * sl-modem-daemon # needed for some Winmods (see Outofthebox-Winmods)

    * bpalgin

    * ndiswrapper-utils-1.9 [amd64 i386]

    * ndisgtk


