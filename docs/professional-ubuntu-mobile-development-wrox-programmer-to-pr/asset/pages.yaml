  md: '# Chapter 12: Mobile Directions


    Whilevalds was working on his first lines of Linux kernel, Richard Stallman was
    marching on Lotus Development and protesting for Free Software. That was around
    1990, when I worked for Lotus Development. I looked out my office window one day
    and saw Stallman and others in front of Lotus''s main office building. I remember
    one protestor who held a sign with something improbable written on: To paraphrase,
    it said "All Software Should Be Free."


    At the time, it was difficult to comprehend how any rational individual could
    expect complex and high quality software as Lotus 1-2-3 could be developed for.
    (Of the more than 100 people working on Lotus 1-2-3, Richard Stallman, on the
    other hand, describing himself as a "squatter," seemed to manage a rent-free and
    free overnight accommodation at MIT, in addition to commanding his $260/hour fee!)


    Over the next years, a great deal of talent change swept the tech industry. The
    world, business models and environments changed — usually gradually then explosively
    in the fall of 2008. Today is in a very different place than it was ten years
    ago, and even more evolved from where it was 20 years ago. As a method for explaining
    how some of this evolution might be discussed, I offer four development models
    for your consideration. All of the models are inspired by various works of natural
    philosophers. I call these Darwin, Mendel, Mendel, and Frankenstein.


    # Darwin


    The Darwin Model of Software Development is named for Charles Darwin, famous for
    his publication of "On the Origin of Species." Darwin published his breakthrough
    book at the age of 51. Darwin''s work documents his research and formulation of
    theories on "Natural Selection." Wikipedia provides a concise description of this
    research and discoveries: Natural Selection is the process by which favorable
    traits become more common in successive generations of reproducing organisms,
    and unfavorable traits become less common, due to differential reproduction.


    Applying the Darwin Model explains why more people use Windows than DOS, why Linux
    has become more than UNIX, and why notebooks replaced laptops (which previously
    supplanted lugables). The Darwin Model explains why computers don''t be 50 feet
    long and 8 feet tall. DeMoivre writes in his statistical book, "The Probability
    of an Event is greater or less, according to the number of Chances by it may happen,
    compared with the whole number of Chances by it may happen or fail." Because there
    has been a recent run of mobile technologies — hardware and software — and open
    source offers virtually infinite combinations, there is a high probability some
    wonderful mobile devices will "happen"


    # Mendel


    The Mendel Model of software development is named after the person after the Father
    of Mendel Genetics, Gregor Mendel. In a paper written by Mendel, "Experiments
    on Plant Hybridization," people caught the first glimpse of how dominant and recessive
    genes worked. Mendel was a clever part time scientist and learned how to create
    "best of breed" outcomes. Wikipedia describes Mendelian inheritance as "a set
    of primary tenets relating to the transmission of hereditary characteristics from
    parent organisms to their children.


    247'
