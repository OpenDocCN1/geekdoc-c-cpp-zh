  md: "# Chapter 5: Application Packaging\n\n# Initial Debiantization\n\nIf dh-make\
    \ is not installed, run\n\n```\n$ sudo apt-get install dh-make\n```\n\nand then\
    \ run this tool:\n\n```\n$ ln -s ubuntu-golden ubuntu-golden-0.1\n$ dh_make -createorig\
    \ -indep\n$ ls - debian/\nchangelog dirs init.d.ex menu.ex README.Debian\ncompat\
    \ docs init.d.lsb.ex postinst.ex rules\ncontrol emacsen-install.ex manage.1ex\
    \ postrm.ex teste.default.ex\ncopyright emacsen-remove.ex manage.ex sgml preinst.ex\
    \ teste-doc.BASE\ncron.d.ex emacasen-startup.ex manage.xml perrm.ex watch\n```\n\
    \n# rules\n\nThe file is an executable Makefile that has rules for building the\
    \ binary package from the packages. A full explanation of rules file can be found\
    \ at https://wiki.ubuntu.com/PackagingGuide/Complete#rules\n\nA default file created\
    \ by dh_make looks like:\n\n```\n#!/usr/bin/make -f\n# *- makefile -*\n# Sample\
    \ debian rules that uses debhelper.\n# This file was originally written by Joey\
    \ Hess and Craig Small.\n# As a special exception, when this file is copied by\
    \ dh-make into a\n# dh-make output file, you may use that output file without\
    \ restriction.\n# This special exception was added by Craig Small in version 0.37\
