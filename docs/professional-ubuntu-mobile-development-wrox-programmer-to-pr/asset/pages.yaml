    # I''d Give My Right ARM for a SheevaPlug


    I was one of the lucky ones to get my hands on a SheevaPlug soon after the initial
    announcement. Within the first week, they were sold out and others were on backorder.
    The initial demand exceeded what Marvel had anticipated. It was one of the clear
    that this segment has "legs to run with." This is what you received (and receive)
    with the initial $99 Developer Kit:


    +   - Marvel ARM ARM CPU at 1.2 GHz

    - 512MB DDR2 @ 400 MHz

    - 512MB NAND Flash (direct boot from Flash)

    - Gigabit Ethernet/RJ45

    - USB 2.0 (direct boot from USB)

    - SDIO

    - JTAG/UART serial interface

    - No fan. No drive. No noise.

    - Elegant packaging/Built-in AC power supply

    - Ubuntu pre-installed

    - No license fees ("open" reference design

    - No graphics/VGA support

    - No built-in WiFi


    The power consumption varies depending on the tasks that are run, but it won''t
    exceed 7 watts as you can see from the following power profiles:


    +   - With cupleid in C1, 2.5W

    - With cupleid in C0, 3.0W

    - 3.3W at idle with gigabit ethernet

    - 5.0W idle with gigabit+HDD USB+special

    - 7.0W + 100% cpu


    Figure A-1 shows what a SheevaPlug looks inside.'
