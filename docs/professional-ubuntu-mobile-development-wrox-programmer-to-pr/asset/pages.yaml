  md: '# Chapter 11: Putting It All Together


    In the preceding example, pptp-linux is a dependency. If it were in brackets,
    it would indicate that the package is recommended and not depends. For instance,
    the Online Services example that follows is

    :


    +   Online Services:

    * (ubuntu-client-gnome)


    A leading exclamation mark in a seed file indicates a per-seed blacklist. An exclamation
    mark means to never include this in the seed or in any of its seeds. An example
    of this follows:


    ```

    == Blacklist ==

    libvacodec cannot be shipped on CDS (c.f. Ubuntu technical board resolution

    2007-01-02).

    !libvacodec*

    ```


    The asterisk at the end of libvacodec is used for regular matching in the germinate
    code to place everything that starts with libvacodec into the per seed blacklist.


    Other things to notice in seed files are substitution variables. A package containing
    substitution variables will be expanded into one package for each possible combination
    of the those variables. An example is:


    +   * Kernel-Stem: linux linux-image


    == i386 ==


    * $(Kernel-Stem)-generic-pae [i386]

    * linux-headers-generic-pae [i386]

    * $(Kernel-Stem)-virtual [i386]

    * linux-headers-virtual [i386]


    Seed entries can also be followed by square brackets. [powerpc]


    which indicates that the language-support-$ package should not be used on the
    powerpc architecture. The converse is also true, of that seed entries followed
    by [lpia 1386] (without the exclamation mark) indicate that they should only be
    used on LPIA and i386 architectures.


    Finally, if the package name in the seed starts with % then expands to all binaries
    from the given source package.


    # Germinating the Seeds


    As mentioned previously, the raw seed files are germinated into a full list of
    packages using the germinate program. The germinate program requires some default
    seed files to be present in order to work. The most important of these seed files
    (which are mandatory) are STRUCTURE, supported, and blacklist.


    These mandatory files do not necessarily need to contain anything but they must
    be present for germinate to work.'
