    Ubuntu, MEPIS, Xandros, Linspire, etc.

    Is this correct?

    in order to install these packages, you need administrator privileges. You are
    currently running this script as an unprivileged user.

    You have sudo available. Should I use it?

    Using the command `sudo /bin/sh -c` to gain root access. Please type the appropriate
    password if prompted.

    Installing packages...


    # Running the LSB Application Testkit


    The toolkit installs into /opt/lsb/app-testkit/manager; to start the web interface,
    run /opt/lsb/app-testkit/manager/bin/lsb-atk-start.pl 8080 and then browse to
    http://127.0.0.1:8080.


    This will display the test suite that''s shown in Figure 9-5.


