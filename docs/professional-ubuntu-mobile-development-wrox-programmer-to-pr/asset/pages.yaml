    # # Application Ideas


    My initial goals for the SheevaPlug included several energy efficient, 24/7 applications:
    a backup server, a media server, as well as a home automation and information
    system. For software, I was looking forward to using the tools we are familiar
    with in Ubuntu: Python, Django, networking databases, a fully stocked application
    repository and more.


    The SheevaPlug proved easy to work with for someone with basic Linux familiarity
    and prior experience working with Ubuntu. Although there is no graphics or VGA
    support, it was easy to SSH into the device or manage it via the JTAG serial connection.
    MIMO Monitors is shipping 7-inch screens that work across a USB connection. Its
    USB to LCD controller makes it possible to display visuals without the need for
    VGA or video support. Key technology has recently been released as open source
    and Ubuntu support is possible.


    In the first days of experimenting with the SheevaPlug, I was able to successfully
    attach wireless USB 802.11g radios (from Edimax). I had the same success attaching
    a USB webcam to the SheevaPlug, Before I knew it, I had all the core ingredients
    of a home control/surveillance system powered by the Sheeva.


    I was thrilled, and a little startled, when I discovered I could easily run simple
    OpenCV applications on the SheevaPlug.


    267'
