    Vendors offering devices for the Multimedia Users group have a preexisting and
    ready-made market growing out of the current market for smartphones. Although
    multimedia is often associated with images, text, and it can also mean application
    programs that integrate data from a broad spectrum of interests. Probably the
    best known and most popular application that does this for mobile devices is Canola.
    It is built using Python and the Enlightenment Foundation Libraries (EFL), and
    it uses a plug-system to enableYouTube, Flickr, and more. There are Google Summer
