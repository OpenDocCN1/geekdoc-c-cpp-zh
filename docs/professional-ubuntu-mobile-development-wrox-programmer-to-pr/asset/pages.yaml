  md: "# Chapter 3: Power Management\n\nAfter the machine has woken up, all the hook\
    \ scripts are executed in reverse order with the parameter resume (resume from\
    \ RAM) or thaw (resume from disk) as instructed.\n\n> Note that suspend-hybrid\
    \ is currently a placeholder and is not completely implemented.\n\nThe hooks do\
    \ various things such as preparing the bootloader or stopping the Bluetooth subsystem.\n\
    \nThe hooks for suspend are placed in the following:\n\n```\n/usr/lib/pm-utils/sleep.d\n\
    /etc/pm/sleep.d\n```\n\nThe hooks for the power state are placed in the following:\n\
    \n```\n/usr/lib/pm-utils/power.d\n/etc/pm/power.d\n```\n\nHooks in /etc/pm/ take\
    \ precedence over those in /usr/lib/pm-utils/, so it is possible for a developer\
    \ to override the defaults.\n\nAn example suspend/resume script for Bluetooth,\
    \ called 49bluetooth, which is found in /usr/lib/pm-utils/sleep.d., looks like\
    \ this:\n\n```\n$($PM_FUNCTIONS) \n\n[-f /proc/acpi/ibm/bluetooth ] || exit $NA\n\
    \nsuspend_bluetooth()\n{\n\tif grep -q enabled /proc/acpi/ibm/bluetooth; then\n\
    \tsavestate ibm_bluetooth enable\n\techo disable > /proc/acpi/ibm/bluetooth\n\t\
