  md: '# 7


    # Theming


    Theming allows a user or device manufacturer to customize the look and, to some
    extent, the feel of the operating system, window manager, or widget set.


    This chapter begins showing the theme structure on Ubuntu MID and Ubuntu Netbook
    Remix through the gtckrc file and GConf. This is followed by a fully customized
    Ubuntu MID theme. Finally, theme performance and optimization are covered along
    with some suggestions for further investigation.


    # What Is a Theme?


    A GTK+ theme consists of three things:


    +   - A theme engine (sapwood in the case of Ubuntu MID), which is a shared object
    and includes code to draw the graphical elements

    - A configuration file to set the operation of the theme engine and the core parts
    of GTK+2

    - Extra data files for the extra theme engine, such as images


    Not included in the context of themes are:


    +   - Icons

    - Backgrounds

    - Fonts

    - Sounds


    Not all themes have extra images and data.'
  merge: -1
