  md: '# Appendix E: D-Bus: An Overview


    There are four message types:


    +   - Method call messages ask to invoke a method on an object.


    +   - Method return messages return the results of invoking a method.


    +   - Error messages return an exception caused by invoking a method.


    +   - Signal messages are notifications that a given signal has been emitted (that
    an event has occurred). You could also think of these as "event" messages.


    A method call maps very simply to messages: You send a method call message, and
    receive either a method return message or an error in reply.


    Each message has a header, including fields, and a body, including arguments.
    You can think of the header as the routing information for the message, and the
    body as the proxy. Header fields might include the sender name, destination bus
    name, method or signal name, and so forth. For example, the letter "i" means "32-bit
    type signature so the signature "ii" means the payload carries 32-bit integers.


    # Calling Method: Behind the Scenes


    A method call in D-Bus consists of two messages: a method call message sent from
    process A to process B, and a matching method reply sent from process B A. Both
    the call and the reply are routed through the bus daemon. The caller includes
    a serial number in each call message, and the reply message includes this number
    to allow the caller to match replies to calls.


    The call message will contain any arguments to the method. The reply message may
    indicate an error, or may contain data returned by the method.


    The steps of a method invocation in D-Bus are as follows:


    +   1. The language binding provides a proxy, such that invoking a method on an
    in-process object invokes a method on a remote object in another process. If so,
    the application calls a method on the proxy, and the proxy constructs a method
    call to send to the remote process.


    +   2. For lower-level APIs, the application may construct method call message
    itself, without using a proxy.


    +   3. In either case, the method message contains a bus name belonging to the
    remote process; the name of the method; the arguments to the method; an object
    path inside the remote process; and, optionally, the name of the interface that
    the service provides.


    +   4. The method call message is sent to the bus daemon.


    +   5. The bus daemon looks at the destination bus name. If a process owns that
    name, the daemon forwards the method call to that process. Otherwise, the bus
    daemon creates an error message and sends it back as the reply to the method call.


    +   6. The receiving unpacks the method call. In a simple low-level API situation,
    it may immediately run the method and send a method reply to the bus daemon. When
    using a high-level binding API, the binding might examine the object path, interface,
    and


    303'
  merge: -1
