  md: '# Chapter 4: Application Development


    # Menus


    Menus are created externally using GtkMenu. They are then added to a HildonWindow
    with hildon_window_set_menu().


    An example of this looks like the following:


    ```

    GtkMenu *menu;

    menu = gtk_menu_new();

    fill_in_menu(menu);

    hildon_window_set_menu(menu);

    ```


    # Toolbars


    Toolbars are created using a call to hildon_window_add_toolbar(). Consider the
    following example:


    ```

    GtkToolbar *toolbar;

    toolbar = create_toolbar();

    /* Adding the toolbar */

    hildon_window_add_toolbar(window, toolbar);

    ```


    # Window-Specific Settings


    Window-specific commands can be sent to the main window manager and task navigator.
    Applications can tell the task navigator some window requires the user''s attention.
    This will trigger the blinking of the window''s icon in the task navigator.


    This is shown by the following:


    ```

    gtk_window_set_urgency_hint (GTK_WINDOW (window), TRUE);

    ```


    Similarly, applications are to change the icon representing each HildonWindow
    in the task navigator using the gtk_window_set_icon set of functions.


    The following code demonstrates this:


    ```

    GdkPixbuf *icon = create_icon();

    gtk_window_set_icon (GTK_WINDOW (window), icon);

    ```


    Also, the title can be set per window with the following:


    ```

    gtk_window_set_title (GTK_WINDOW (window), "Window Title");

    ```


    If the application name was set with g_set_application name(), it will precede
    the window title in the title bar.


    # Program-Wide Settings


    The HildonProgram object provides the programmer with the capability to set program-wide
    settings for all the registered HildonWindows.'
