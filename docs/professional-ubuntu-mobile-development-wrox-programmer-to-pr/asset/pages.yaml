    For the karmic release, the target boot speed is expected to be somewhere between
    the current speed (28s on Jaouncy) and the ambitious new target. A consequence
    of this (which was discussed at UDS Barcelona) is that both the initramfs and
    the X Server are likely to see a lot of work in the coming months, so the techniques
    described below may not be the best ways to reduce boot speed. Please refer to
    the ubuntu-boot mailing list for the latest information.


    # ## Hard Coding Modules


    It is possible to list modules so that they are called when the initramfs is called.
    Doing this means that only the modules that the specific device needs to boot
    are loaded.


    +   * initramfs is a small ram-based initial root filesystem that the kernel runs
    as its first program as the device boots.'
