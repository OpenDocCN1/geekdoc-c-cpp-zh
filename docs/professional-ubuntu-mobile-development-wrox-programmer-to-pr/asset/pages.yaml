- img_proc: true
  md: '# Chapter 11: Putting It Together


    INHERITED is a space-separated list of seeds from WHICH it inherits. For example,
    netbook-remix: desktop-common in the preceding STRUCTURE file indicates that packages
    in the netbook-remix seed may depend on packages in the desktop-common seed without
    requiring that those packages appear in the netbook-remix output. Any line like
    the following:


    ```

    include BRANCH

    ```


    which is in the section below, causes another seed branch to be included.

    The supported seed lists all the packages that are necessary to build the distribution
    (but which do not necessarily be included on the final image for space reasons),
    germinate, therefore, does not add all the packages that result from building-dependencies
    of seeds and their dependencies to every output, unless they are in the seed list.
    These packages are added to supported. Like any other seed, the supported seed
    may contain its own list of packages.


    The blacklist file does not define a list of packages but list packages that will
    never be included in the output of germinate.

    The other seeds that use in the STRUCTURE file in the Ubuntu Netbook Remix example,
    such as netbook-remix, desktop-common, live, ship-live, and so on, can be called
    anything but they need to exist, and they need to be listed as such in the STRUCTURE
    file.


    # An Example: Germinating Ubuntu Netbook Remix


    Begin by branching the Ubuntu Netbook Remix seed. Make a seeds directory:


    ```

    $ mkdir seeds; cd seeds

    $ bzr branch lp:-ubuntu-core-dev/ubuntu-seeds/unr.karmic

    ```


    move into the usr.remix folder, and in the STRUCTURE file there is a line like
    the following:


    ```

    include platform.karmic

    ```


    which means the platform karmic seed is required. Move back to the seeds folder
    and branch platform.karmic:


    ```

    $ cd

    $ bzr branch lp:-ubuntu-core-dev/ubuntu-seeds/platform.karmic

    ```


    Make next an output folder and move it into the following:


    ```

    $ mkdir output; cd output

    ```


    Make sure the germinate tool is installed (sudo apt-install germinate) and then
    invoke it:


    ```

    $ germinate -S file:///home/<user>/Dev/Book/test/seeds/ -s usr.karmic -m

    http://172.16.50.131:9999/ubuntu -d karmic -a 1386 -c karmic, restricted

    universe,multiverse

    ```


    172.16.50.131:9999 is your local mirror — use archive.ubuntu.com if you do not
    have a local mirror set up.'
