    # # A Short History: From Big Iron to Mighty Mouse


    The Harvard Mark I that''s shown in Figure 1-1 was 51 feet long and 8 feet high.
    It first booted in 1944 to multiply, divide, do logarithms, and process trigonometric
    functions. This system was widely viewed as the beginning of the modern era. Imagine,
    a computer that could only five multiplication problems and two division problems
    a minute! Logarithmic processing was a good time to go for a coffee break.


    ![](img/001c747b841ab338ed35c50dbdd0c933_37_0.png)


    Since that time, there has been an incredible evolution of computing technology
    following the steady path of Moore''s Law, which is shown in Figure 1-2.


    ![](img/001c747b841ab338ed35c50dbdd0c933_37_1.png)'
