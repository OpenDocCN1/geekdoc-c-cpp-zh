  md: '# Chapter 6: Application Selection


    gpsd has no ways for clients to say that they are only interested in position
    data, or in whether the device has a fix or not. Even if the GPS unit is stationary,
    satellite data is constantly changing, and the clients will be woken up on every
    message. Because of these problems lain Holmes at o-hand wrote gypsy. This is
    a GPS multiplexing daemon that gives finer control of GPS info and allows programs
    to call the following objects:


    +   - Gypsy Position — For location information

    - Gypsy Course — For course information

    - Gypsy Accuracy — For accuracy information

    - Gypsy Satellite — For satellite information


    # Implementation


    First, install Django:


    ```

    $ sudo apt-get install python-django

    ```


    In the Home directory, create a directory called "Web" and move it into like this:


    ```

    $ mkdir Web;cd Web

    ```


    Next, create a directory:


    ```

    $ mkdir django_projects

    ```


    Move into the projects directory and start a new project called "locate" using
    Django’s command line utility. This will create a basic directory structure and
    the necessary configuration files:


    ```

    $ cd ~/Web/django_projects

    $ django-admin.py startproject locate

    ```


    > Do not use upache, postgresql or mysql. These are not suitable for an embedded
    device. The application will use the Cherry Py standalone WSGI server and SQLite.


    Edit settings.py so that it looks like:


    ```

    DATABASE_ENGINE = ''sqlite3''

    DATABASE_NAME = os.path.join(os.path.dirname(__file__), ''data'', ''locate.db'')

    DATABASE_USER = '''' # Not used with sqlite3.

    DATABASE_PASSWORD = '''' # Not used with sqlite3.

    ```


    The code DATABASE_NAME = os.path.join(os.path.dirname(__file__), ''data'', ''locate.db'')
    is a trick that enables the SQLite filesystem database to be stored in the project
    inside the folder'
