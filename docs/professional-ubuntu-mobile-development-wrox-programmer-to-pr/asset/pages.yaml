    # Summary


    This chapter highlighted some of the potential groups of users that an OEM can
    target when thinking about the “look and feel” of a device. This is not an inclusive
    list, and there are other important groups. For example, one type of user that
    was identified by members of the Ubuntu Mobile team was in Asia, particularly
    in Japan, where many people use a device solely for reading e-books while taking
    public transportation. Determining how to target such groups is left to you. Such
