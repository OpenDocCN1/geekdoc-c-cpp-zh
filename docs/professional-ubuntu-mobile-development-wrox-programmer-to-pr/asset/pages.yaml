  md: '# # Chapter 4: Application Development


    In addition to knowing these specifications, it is also important to know what
    frameworks are available to use when developing an application.


    # ## Hildon: An Application Framework for Handheld Devices


    The Hildon Application Framework is designed for small devices and has been widely
    used on this form factor. The framework has had strong support from Nokia, is
    a part of GNOME Mobile, and has been extended to better support stylus-based usage
    and high display density.


    Basic GNOME technologies are used such as GTK as the GConf configuration system,
    and both of these are discussed later in the chapter.


    Hildon is an extended and modified GTK, which is referred to as the “Hildon widget.”
    It effectively provides a desktop environment for mobile devices.


    On Hildon, one notable deviation from traditional desktop GNOME is the replacement
    of bonobo and its related technologies built under the guise of CORBA with D-Bus.


    # ## What Is Hildon in Terms of Code?


    A HildonProgram is a Object representing the whole application. In this context,
    it is important to note that a HildonProgram is not a GtkWidget.


    Only one HildonProgram can be created per process. It is accessed with hildon_program_get_instance.


    HildonWindows are registered to the HildonProgram using hildon_program_add_window().
    As the method name suggests, several HildonWindows are likely to be registered
    to a HildonProgram.


    The following C code highlights some key concepts and functionalities that are
    available when working with the framework.


    # ## Creating the Program


    Here''s code:


    ```

    /* Start the container and window */

    HildonProgram *program;

    HildonWindow *window;

    /* Start up GTK */

    gtkk_init(&argc, &argv);

    /* Make a Hildon program */

    program = HILDON_PROGRAM(hildon_program_get_instance());

    ```'
