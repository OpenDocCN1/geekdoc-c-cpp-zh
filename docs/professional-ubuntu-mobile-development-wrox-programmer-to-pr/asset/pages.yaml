    # Configuring the Touchscreen


    Touchscreens are more and more common in all kinds of devices, from Notebooks
    to MIDs to all-in-one PCs. For Ubuntu Jaunty, evtouch will go to be maintained
    as the solution for the mobile team as it covers the broadest set of touchscreens.


    Evouch is a touchscreen driver for X. The driver is actually an evdev-driver,
    which supports events for moving in absolute coordinates, relative coordinates,
    and mouse buttons.


    The graphical touchscreen calibration tool on Ubuntu MID is accessed through Preferences
    -> Calibrate Touchscreen. If this does not work as expected on a device, it is
    possible to manually run the calibrate script. Run:


    ```

    $ lshal | grep evtouch

    ```


    This ensures that the device is used by the evtouch driver rather than, say for
    example, the evdev one. If this command returns empty, do the following:


    ```

    sudo apt-get install xserver-xorg-input-evtouch

    ```


    Stop and then start the X Server, or reboot.


    Then run the calibration touchscreen program:


    ```

    # /usr/lib/xf86-input-evtouch/calibrate.sh

    ```


    When this is completed, look in /etc/evtouch/config and note the answers.'
