  md: '# Chapter 12: Mobile Directions


    # Cloud Computing


    We are seeing cloud computing reach out to consumers and corporations. People
    now routinely use the Cloud to e-mail as webmail. Google has a full range of applications
    available online. Twitter, FriendFeed, Facebook, and other network tools maintain
    sensitive personal data on the Web. Cloud computing can eliminate or reduce the
    step of synchronization and massive file copying between mobile and fixed computer
    systems. This will drive faster adoption to handheld mobile devices as MiDs? With
    so much private data on the Web, are there new security measures and standards
    that must be considered and incorporated into software stacks?


    # ARM Wrestling


    It looks like a battlefield is forming along the lines between x86 and ARM architectures.
    The puns seem endless, "ARM Wrestling" or "A shot in the ARM for Intel." In the
    long-run, this would be good for the consumer; and prove costly for the industry.
    Competition creates innovation and accelerates improvement. However, the threat
    to Intel''s x86 processor dominance is quite real. From The New York Times on
    June 30, 2008:


    In addition to Qualcomm and Nvidia, there are more than 200 licensees of the ARM
    processor design, including major chip makers like Marvel and Texas Instruments.
    Together, they supply more than 1.1 billion phones, many of which use multiple
    ARM chips. The chips are also used in a growing area of special consumer electronics
    like G.P.S. navigators and set-top TV boxes.


    There are lots of ARM us out there! Here''s another data point, from the ARM Wikipedia
    entry:


    As of June 2008, over 10 billion ARM cores have been built, and iSupply predicts
    5 billion a year will ship in 2011.


    I''ve installed Ubuntu on both ARM-based and Atom-powered systems. I like the
    processing power of the Atom, but I like the low-power consumption of the ARM.
    This will be an exciting battle to participate in.


    At the same time, an important new technology foundation for mobile solutions
    is being developed. The Moblin initiative, for example, has growing from hardware
    and software companies after receiving initial funding from Intel. In April 2007,
    Intel first introduced the concept of a "MID" computer at its Developer Conference
    in China. In July 207, Intel formalized a software initiative under the name of
    Moblin and launched a website at Moblin.org. (The name Moblin is a contraction
    of mobile and Linux.)


    In October 2007, I attended the Ubuntu conference for several days of mobile computing.
    Canonical staff and Intel participants joined those sessions, with a number of
    other source contributors also. After an initial release of Mobile V1 based on
    Ubuntu, Intel directed further explorations to Fedora distributions. That provided
