    # Controlling Radio Transmitters


    Constant polling for radio connections of all kinds can use a lot of power.


    To limit this, device manufacturers have implemented various techniques. On Nokia
    devices, such as the N810, all network connections are routed through a connection
    tracker. This makes it possible to disable the network until an application tries
    to access the network, when a new connection can be established. The Power Save
    Poll protocol (PS-Poll) works and helps reduce the amount of time to be spent.


    Rather than having the radio on all times, PS-Poll allows the WiFi adapter to
    notify the access point when it is powered down. While the radio is powered down,
    the access point will hold any network packets that would need to be sent to it.


    Network latencies increase with PS-Poll. This is generally not noticeable when
    browsing the Web, but in situations where lower latency is important (for example,
    gaming, video and media streaming), PS-Poll may not be the best solution.


    PS-Poll functions principally with wireless cards that use the ipw2100/ipw2200
    driver or the newer iwl3945/iwl4965 drivers. To set PS-Poll on an ipw2100/ipw2200
    card to do the following:


    ```

    iwpriv wlan0 set_power 5

    ```


    where wlan0 is the interface name for the network adapter. The number 5 in the
    iwpriv command is the degree to which the power saving should be enabled:'
