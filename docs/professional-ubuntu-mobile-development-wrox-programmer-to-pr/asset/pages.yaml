  md: '# Chapter 7: Theming


    On Ubuntu MID, these elements are usually installed or configured by the distributor
    or OEM per their preferences, and there are currently no packages and management
    tools available to integrate elements into a theme.


    # Where Are Themes Located in the Filesystem?


    Themes are located in /usr/share/themes or in the user''s home .themes directory.


    # What Is a Theme Engine and Where Are They Located?


    GTK engines are built to render buttons and everything that is “inside” a GTK
    window. That’s why they call GTK engines. There are several GTK engines and they
    are located in: /usr/lib/gtk-2.0/2.10.0/engines/


    Of this, the Ubuntu MID software release uses the sapwood engine (libsapwood.so).
    Others included in the package gtk2-engine includes:


    +   - Clearlooks, the default GNOME theme, based on Bluecurve

    - Crux, formerly known as the Easel engine

    - High contrast, which is used by some accessibility themes

    - Industrial, the famous engine from Novell (formerly Xian)

    - LighthouseBlue, another engine based on Bluecurve

    - Metal, which gives a metallic look

    - Mist, a flat and high performance engine

    - Redmond95, which provides a look similar to that of Windows

    - Thince


    # Theming Ubuntu MID


    Sapwood provides a server and client library for accessing theme images. The server
    is responsible for loading the theme-related images and distributing them to clients.
    Sapwood saves memory to, for example, the Pixbuf engine as it shares images between
    applications using a cache.


    > Sapwood is also much faster because it tiles the 16-bit images using the X Server.


    It is possible to observe this in the following location:


    ```

    $ /usr/share/ubuntu-mid-default-settings/mid-gui-start

    ```


    After first checking that Compiz is not enabled, the script tells the Matchbox
    Window Manager to use the mobilebasic theme:'
