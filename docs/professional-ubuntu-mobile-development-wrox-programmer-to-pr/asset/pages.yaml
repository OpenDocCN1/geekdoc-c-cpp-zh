  md: '# Chapter 6: Application Selection


    # Social Network Users


    This market segment is sometimes referred to by marketers as Generation Y (Gen
    Y)(this is a succession from the term Generation X, which was made popular by
    the novel of the same name) and it is generally understood to be people born in
    the early 1980s and 1990s.


    This is evidently a large market and is consequently of considerable interest
    to device manufacturers and ISVs.


    People in this segment are comfortable with the Internet, particularly within
    social networks such as Facebook, Twitter, and MySpace. A survey of 707 college
    students in the United States, undertaken by Reyn Junco and Jeanna Mastrocisca
