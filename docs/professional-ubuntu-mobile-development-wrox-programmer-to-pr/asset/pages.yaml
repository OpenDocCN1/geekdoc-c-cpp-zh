  md: '# # Introduction


    # # The Ubuntu Hardy Release


    During the Hardy cycle, then, was work toward getting Ubuntu working on various
    devices, based on both the Menlow and McCalin platforms from Intel:


    +   - McCalin preceded Menlow. It contains an Intel A100/A110 processor. An example
    of a device using this processor is the Samsung Q1 Ultra.

    - Menlow is the name of the platform that contains an Intel Atom processor (codename
    Silverthorne and Diamondville). It uses Puibso Chipset (aka System Controller
    Hub). An example of a device using this processor is the Aigo MID. This work didnt
    complete within the Hardy cycle, and continued in a PPA.

    - PPA (Personal Package Archive) is a way for developers to build and publish
    packages of their code, documentation, artwork, themes, or any other contribution
    to free software.


    This resulted in the first release image of Ubuntu MID (which was some time after
    the official Ubuntu Hardy release).


    While this release was targeted for 4 to 6-inch screen devices, most of the testing
    and the work was done on a Samsung Q1 (known as the reference device) or on somewhat
    awkward development kits.


    # # The Ubuntu Mobile Team


    Some time after the Ubuntu developer alpha release there were some nomenclature
    cleanups within the Ubuntu project. As a result of this, the Ubuntu Mobile and
    Embedded Team, as the goals were increasingly divergent from those of the Ubuntu
    Embedded Team and of “pure” embedded development itself.


    # # Netbook Remix


    Completely independently, a group of Canonical developers from the Original Equipment
    Manufacturer (OEM) team was looking at technologies to support the “netbook” devices.
    OEM refers to companies that make products for others to repackage and sell.


    Using a mix of GNOME, OpenHand code, and some of the work that went into Ubuntu
    MID, and additional development, they produced the “Netbook Remix,” loosely over
    Ubuntu Hardy.


    The resulting Netbook Remix was released before the first release of Ubuntu MID.
    More about the reasoning and ideas behind the Netbook Remix can be found at http://www.markshuttworth.com/archives/151.


    > > The Netbook Remix is based on Ubuntu Long Term Support (LTS) releases as Hardy.'
