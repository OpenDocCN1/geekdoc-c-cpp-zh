  md: '# Summary


    In a generic kernel package, it''s very hard to provide everything that an OEM
    needs to provide if it is targeting a large, worldwide user base. Even if this
    were possible, the optimizations come at a cost. This chapter has shown methods
    for making a kernel closer to a device by getting a generic kernel and optimizing
    it.


    Of course, it is not possible to say exactly what should be done for each device
    as each device needs a different optimization. Instead, this chapter demonstrated
    how optimization can be achieved through simple steps. By using a well-tuned kernel,
    an OEM and, more importantly, an end user can get much more use and pleasure out
    of a device.'
