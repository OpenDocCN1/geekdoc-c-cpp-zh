  md: '# Chapter 12: Mobile Directions


    Linux-based distributions are careful, selective, scientific, and personalized
    works of many people individually "breeding" their own distributions. Creating
    a distribution is essentially a work of Mendelian selection. The individual programs,
    packages, and customizations in a distro are tailored to the preferences and needs
    of the people who are creating the distribution.


    Mend could quickly trace back the inherited traits of Ubuntu from Debian. Mark
    Shellsworth got involved with the Internet as a student. He became a developer
    in 1994, after he created the first package for Apache. Shellsworth was the "Master
    of the Universe" for Ubuntu — the group of individuals who edit, maintain, include,
    exclude, and identify interdependencies in the components of a new Ubuntu release.


    # Mayr


    The Mayr Model of software development is named after Ernst Mayr. Mayr came to
    be known as the leading evolutionary biologist. His great work revealed the intricacies
    of adaptation and multiplication of species. Mayr''s work harmonized and connected
    the work of Darwin and Mendel, bringing together previously warring camps of scientists.
    Mayr''s theories built bridges rather than walls. Mayr was well known for the
    way in which he recruited and mentored other scientists by bird watching societies.


    The Mayr Model explains the co-existence of diverse distributions. In many ways,
    Mayr''s methodology proved the worth of open source development. Through collaboration
    and knowledge sharing, Mayr brought together individuals from different areas
    with common interests. There is another similarity to Mayr worth noting Eric Raymond
    noted that "Every good work of software starts with a developer''s personal itch."
    Echoing that refrain, Mayr was known to encourage his students to take up their
    own research projects: "Everyone should have a problem."


    # Frankenstein


    Finally, there''s the Frankenstein Model of software development. As you might
    guess, this is based on the work of Mary Shelley''s Frankenstein or The Modern
    Prometheus, which is her 1818 novel that was inspired by discussions she had with
    Erasmus Darwin, grandfather of Charles Darwin. The plot of the story is simple
    — a scientist named Frankenstein discovers he has the ability to animate life
    during his days. Frankenstein then brings to life, from a patchwork of body parts,
    a new birth. Does this quote from the book sound familiar to any open source developers?


    > I worked hard for nearly two years, for the purpose of infuse life into an inanimate
    body. For this I had deprived myself of rest and health. I desired it with an
    ard for exceeded moderation; but now that I had finished, the beauty of dream
    vanished, and breathless horror followed my heart.


    The Frankenstein Model is descriptive of how outcomes — despite the best of intentions
    — come out of short of expectations. These are the projects that do not end well
    for anyone. Yet, the code lives on. If there is a lesson to be learned, Frankenstein
    puts it out this way: "Peace! Peace! Learn my miseries, and I do not seek to increase
    your own."


    There is no fooling the future; it is what it will become. However, these different
    models might help you understand the past, and make well-informed guesses about
    the future.'
