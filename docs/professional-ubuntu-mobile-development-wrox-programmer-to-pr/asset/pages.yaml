    # Hook Script Resource


    With Bazaar installed (sudo apt-get install bzr), check out the following:


    ```

    bzr branch lp:ubuntu-members/pbbuilder/pbbuilder-hooks

    ```


    This contains some example scripts. These include the use of D01aptdate, which
    runs apt-get update before proceeding further, and B01list-missing, which lists
    missing files.


    # Mount Bind a Package Repository for Use with Builder


    Bind mounting directories is useful for many tasks. One of the most useful things
    is to mount a directory which is a package repository:


    ```

    BINDMOUNTS=/var/cache/pbbuilder/result

    # cat /var/cache/pbbuilder/hooks/D07results

    #/bin/sh

    cd /var/cache/pbbuilder/result/

    /usr/bin/dpkg-scanpackages . /dev/null /var/cache/pbbuilder/result/Packages

    /usr/bin/apt-get updates

    ```


    This way, you can use dev file: /var/cache/pbbuilder/result in the OTHERREPOSITORY
    variable.


    # Ubuntu Policy


    The Ubuntu policy document at http://people.canonical.com/-cjwatson/ubuntu-policy/policy.
    describes "the policy requirements for the Ubuntu distribution." It also discusses
    policies that relate to packages, such as the technical requirements that each
    package must satisfy to be included in the Ubuntu distribution. It is modeled
    closely on the Debian policy.


    This document is extremely important. Please read it. One important thing to know
    how the archive of packages in Ubuntu is divided into categories:


    # Categories


    The categories are restricted, universe, and multiverse, and each has different
    requirements in order for a package to be included in them.


    +   - Main — Packages in main must not require a package outside of main for compilation
    or execution (thus, the package must not declare a "Depends", "Recommends," or
    "Build-Depends" relationship on a non-main package)

    - Restricted — Source code may not be available for packages in restricted and
    modifications may also not be permitted.

    - Universe — Packages in this category are not supported by Ubuntu Developers
    or Canonical. Furthermore, packages must not require a package outside of main
    and universe for compilation or execution (thus, the package must not declare
    a "Depends", "Recommends," or "Build-Depends" relationship on a non-main and non-universe
    package).'
  merge: -1
  pgno: 161
- img_proc: true
  md: '+   - Multiverse — Packages must be placed in multiverse if source code is
    not available, modifications are not permitted, or if they are encumbered by patents
    or other legal issues that make their distribution problematic.


    Every package must also provide a copyright file and distribution license in the
    /usr/share/doc/package/copyright.


    # # Sections


    The preceding categories are further broken down into sections. These sections
    are specified in the control file of the Debian package. They are useful for organizing
    packages into logical blocks. The sections that are available include admin, graphics,
    web, X11, and metapackages. The full list is available in the policy document
    itself. The use of metapackages is covered in Chapter 11, “Putting It All Together.”


    The maintainers of the Ubuntu archive may override the section value to ensure
    the consistency of the Ubuntu distribution. Consequently, it is important to include
    this information in the package.


    # # Summary


    This chapter shows some basic tools used in packaging and covers how to create
    a simple archive with the files necessary to create a Debian package. It shows
    you how to set up a local repository for packages. You also see how to use and
    customize pbuilder along with other custom scripts, which can be run before, during,
    or after a pbuilder run. Finally, we discussed the Ubuntu policy document and
    how software is categorized in the repositories.'
