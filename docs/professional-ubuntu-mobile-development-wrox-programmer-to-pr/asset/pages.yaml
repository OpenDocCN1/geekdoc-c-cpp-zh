    # Phoronix Test Suite


    The Phoronix Test Suite supports monitoring system sensors. The Phoronix Test
    Suite will automatically monitor selected sensors while each test in the chosen
    suite is running and at the end will provide the low and high thresholds for each
    sensor as well as the average. In addition to this, sensor results are then plotted
    on line graphs.


    The sensor detection and monitoring itself is done through LM-Sensors and the
    ACPI interface. LM-Sensors is a hardware monitoring package for Linux, which allows
    access to information from temperature, voltage, and fan speed sensors. It is
    used as the default but if LM-Sensors isn''t installed, the suite will fall back
    to using the Advanced Configuration and Power Interface.


    To install Phoronix Test Suite and the sensor interfaces, run the following:


    ```

    $ apt-get install lm-sensors libsensors-dev phoronix-test-suite

    ```


    The full list of sensors can be found by running the following:


    ```

    $ phoronix-test-suite module-info system_monitor

    ```


    The sensors that are actually detected on the current system and their values
    can be read by running the following:


    ```

    $ MONITOR=all phoronix-test-suite test-module system_monitor

    ```'
