  md: '# About the Contributors


    Brian DeLLacey worked for more than 15 years with all types of computers and software
    languages including Lotus Development and IBM. At Harvard Business School, he
    spent eight years researching and writing about innovation, startups, and information
    technology. His interests include open source development, emerging mobile web
    solutions, and the future of operating systems. He holds an MBA and an A.B. in
    Mathematics.


    Felipe Balbi has been developing Linux Kernel drivers for the last three years.
    He currently works for the Nokia Corporation developing the kernel for Maemo Devices
    and he is also an active member of linux-usb community and the USB OTG Working
    Group.


    David Cohen is a BSc Computer Science graduate who is currently finishing an MSc
    degree in the same area. He’s been working with open source for 8 years and has
    been a Linux kernel developer for the last 5. At the moment, he’s working for
    Nokia, contributing to the development of the kernel for Maemo Devices.'
