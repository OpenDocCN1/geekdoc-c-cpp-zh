    # Evolution and Software Development


    Linus Torvalds defines this with kind of inventive and creative spirit. If you
    want an excellent read and a detailed look at how invention works, check out *Just
    for Fun: The Story of an Accidental Revolutionary* by Linus Torvalds and David
    Diamond. The book begins in the early days, before Linus became Linux, and it’s
    a page turner. By the time you’re done, you’ll have one of the best narratives
    on how technology development really happens. The hardware equivalent of a story
    like this would be Tracy Kidder’s Pulitzer Prize winning “Soul of a New Machine.”


    Torvalds’s book is fun to read, but it’s also a learning lab look at how great
    open source technologies evolve. In the case of Linux, the project started small,
    with few expectations. It quickly grew beyond something that the imagination (and
    even big corporations) could comprehend.


    There’s a good chance that somewhere in the world, another young genius or engineer
    is working on something that will have at least much an impact on the computer
    industry in the next decade or two.'
