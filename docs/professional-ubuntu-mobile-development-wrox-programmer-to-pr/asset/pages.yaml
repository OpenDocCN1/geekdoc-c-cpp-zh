  md: "# Chapter 4: Application Development\n\nThe capability to react to changes\
    \ and to show system changes in a coherent manner to a user was substantially\
    \ improved during the Jaunty and karmic cycles through the use of a new notifications\
    \ framework. This is the next key technology to understand.\n\n# Notifications\n\
    \nA new way to present information to a user was debated in the Jaunty release\
    \ of Ubuntu. This is a way to generate passive pop-ups (also called “poptarts”),\
    \ which notify the user of some event.\n\nWhile some information requires a response\
    \ from the user (a low battery for instance), a large amount of the information\
    \ generated by a system is purely informative and requires no user interaction.\
    \ Notifications (provided through the notify-os daemon or through the org.freedesktop.Notifications\
    \ DBus interface) provide for such a case in that they do not provide “actions”\
    \ for the user (cannot be clicked and hover and then fade). Semantically, the\
    \ bubbles are either confirmations (brightness increased, for example) or notifications\
    \ (new track playing).\n\nCommands to the notification system can be sent manually\
    \ using\n\n```\n$ notify-send\n```\n\nand also programmatically using the D-Bus\
    \ interface. There are four ways to manually use the notify-send tool (which is\
    \ provided by the package libnotify-bin):\n\n# Icon - Summary - Body\n\n```\n\
    $ notify-send 'Hello Rodrigo' -i notification-message-IM\n```\n\n# Icon - Summary\n\
    \n```\n$ notify-send 'WiFi connection lost' -i notification-network-wireless-disconnected\n\
    ```\n\n# Summary - Body\n\n```\n$ notify-send 'PUPD' 'This is some notification'\n\
    ```\n\n# Summary - only\n\n```\n$ notify-send 'Summary-only'\n```\n\nTo send a\
    \ notification programmatically (this is from the “Putting All the Concepts Together”\
    \ section in this chapter, use):\n\n```\ndef __init__(self):\n    (...)\n    #\
    \ saving notification system availablity status\n    self._notification_available\
    \ = pynotify.init('disk-applet')\n    (...)\n\ndef on_device_added(self, device):\n\
    ```"
