  md: '# Chapter 5: Application Packaging


    # Creating Your Repository


    In some cases, using a PPA is not satisfactory and it is more convenient to have
    the packages available locally. This is particularly true when building a remix
    or customization of Ubuntu. If this is the case, there are two ways to create
    a local repository. The first is the "simple" approach; the second uses a tool
    called repropro, which helps automate the process.


    # Simple Repository


    Simple repositories do not organize packages in subdirectories. They only create
    a list of packages, called Packages.gz, by scanning the directory.


    The commands that are used to build this type of repository are dpkg-scanpackages
    and dpkg-scansours. The following is an example of use these commands:


    ```

    dpkg-scanpackages binary /dev/null | gzip -9c > Packages.gz

    dpkg-scansours binary /dev/null | gzip -9c > Sources.gz

    ```


    # Automatic Repository


    The automatic repository is the way that large repositories, such as Debian and
    Ubuntu, are built. This repository format allows access from clients from many
    platforms in a way in which files will not be duplicated. Such a structure is
    called a pool.


    There are several tools that can be used to build this type of repository. One
    tool is called repropro. It manages .deb packages and their related files as .dsc,
    .diff, .tar.gz, and .udeb.


    # Setting Up a Repository


    First of all, you will need to create the initial directory structure. It should
    look like this:


    ```

    $ mkdir /path/to/your/repository/ubuntu

    $ mkdir /path/to/your/repository/ubuntu/conf

    $ mkdir /path/to/your/repository/ubuntu/incoming

    ```


    This repropro config file. Your distributions file should look like this:


    ```

    Codename: karmic

    Suite: karmic

    Components: main

    Architectures: i386 source

    Description: Repo for book

    ```


    This file should go to /path/to/your/repository/ubuntu/conf.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Adding Packages to a Repository


    To add packages to a repository, use the following:


    ```

    $ repropro -Vb include jaunty name_of_file.changes

    ```


    Packages can also be added by doing:


    ```

    $ repropro -b includedeb karmic some-package.deb

    ```


    When working on an older distribution (for example, hardy) you may find that some
    application functionality from a more recent distribution (for example, intrepid)
    would be useful. In this case it is necessary to "backport" the application to
    the older distribution.


    # Removing Packages From a Repository


    Packages can be removed with:


    ```

    $ repropro -V /path/to/repository/ubuntu remove karmic some-package.deb

    ```


    # Backporting KVM


    Add the sources for intrepid to sources.list, like this:


    ```

    deb-src http://archive.ubuntu.com/ubuntu/ intrepid main universe restricted multiverse

    ```


    Comment out the other deb-src lines in the sources.list. Next, run the following:


    ```

    $ apt-get source kvm

    ```


    Move into the unpacked folder (in this case, kvm-72+dfsg) and run the following:


    ```

    $ debuild

    ```


    If this gives build dependencies such as the following:


    ```

    dpkg-checkbuilddeps: Unmet build dependencies: quilt (>= 0.40) uuid-dev libssd1.2-dev
    libasound2-dev libnutils-dev nasm textizhtml bcc iasl

    dpkg-buildpackage: warning: Build dependencies/conflicts unsatisfied; aborting.

    ```


    you need to add this:


    ```

    $ sudo apt-get build-dev kvm

    ```


    Then run debuild again. This will create the .deb in the parent folder.'
