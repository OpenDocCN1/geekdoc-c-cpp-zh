  md: '# Chapter 2: The Development Environment


    # Networking in KVM/QEMU


    The default virtual network connection with KVM/QEMU is usermode networking. Usermode
    networking makes the virtual machine behave as if it were behind a firewall that
    blocks all connections (the only "pingable" address is the DHCP server/firewall
    on 10.0.2.2). What this means in practice is that, by default, the guest computer
    has access to the outside network, but cannot access the host machine.


    To override usermode networking in order to enable access to the host, start KVM
    like this:


    ```

    $ kvm -hda installed-mid.img -m 1024M -redir tcp:2222:22

    ```


    On the host, enter the following:


    ```

    $ ssh -l <username> -p 2222 localhost

    ```


    # Advanced Networking on VirtualBox and KVM/QEMU


    If it a requirement to have the virtual machine with full network support or if
    many virtual machines will be running on the host, it is necessary to set up bridging
    and a switch to connect the host and the guest.


    > The following configuration can be used for advanced networking with both VirtualBox
    and KVM/QEMU.


    First, install vde2 dnsmasq on the host:


    ```

    $ apt-get install vde2 dnsmasq

    ```


    VDE is a virtual switch that can connect multiple machines and dnsmasq is a small
    caching DNS proxy and DHCP/FTTP server.


    Next, the name tap0 code snippet can be anything you want, as it is a virtual
    connection and does not really exist on the hardware. Likewise, the 172.122.120.1
    address has been chosen because it is uncommon and less likely to conflict with
    any other network to which you are connected. You can use anything however:


    ```

    auto tap0

    iface tap0 inet

    address 172.122.120.1

    netmask 255.255.255.0

    vde2-switch -

    post-up /etc/init.d/dnsmasq start

    # Allowing access to the network

    post-up /sbin/sysctl -w net.ipv4.ip_forward=1

    # assuming the interface on the host connected to the network is eth0

    post-up /sbin/iptables -t nat -A POSTROUTING -o wlan0 -j MASQUERADE

    ```'
