- img_proc: true
  md: '# Appendix E: D-Bus: An Overview


    method name, and convert the method call into an invocation of a method on a native
    object (Object, java.lang.Object, QObject), and then convert the return value
    from the native method to a method message reply.


    +   7. The bus daemon receives the method reply and sends it to the process that
    made the method call.


    +   8. The process that made the method call looks at the method reply and makes
    use of any return values included in the reply. The reply may also indicate that
    an error occurred. When using a binding, the method reply message may be converted
    into the return value of a proxy method, or into an exception.


    +   9. The bus daemon reorders messages. That is, if you send two method call
    messages to the same recipient, they will be received in the order they were sent.
    The recipient is not required to reply to the calls in order, however; for example,
    it may process each method call in a separate thread, and return reply messages
    in an undefined order depending on when the threads complete. Method calls have
    unique serial number by the method caller to match reply messages.


    # Emitting a Signal: Behind the Scenes


    A signal in D-Bus consists of a single message, sent by one process to any number
    of other processes. That is, it is a unidirectional broadcast. The signal may
    contain arguments (a data payload), but because it is a broadcast, it never has
    a "return value". Contrast this with a method where the method call has a matching
    method message reply.


    The emitter (aka sender) of a signal has no knowledge of the signal recipients.
    Recipients register with the bus daemon to receive signals based on "match rules"
    — these rules would typically include the sender and the signal name. The bus
    daemon sends each signal to recipients who have expressed interest in that signal.


    The process of emitting a signal in D-Bus occurs in the following manner:


    +   1. A signal is created and sent to the bus daemon. When using the low-level
    API this may be done manually; with certain bindings it may be done for you by
    the binding when a native object emits a signal or event.


    +   2. The signal message contains the name of the interface that specifies the
    signal, the name of the signal, the bus name of the process sending the signal,
    and any arguments.


    +   3. Any process on the message bus can register "match rules" indicating which
    signals it is interested in. The bus has a list of registered matches.


    +   4. The bus daemon examines the signal and determines which processes are interested
    in it. It sends the signal message to these processes.


    Each process receiving the signal decides what to do with it; if using a binding,
    the binding may choose to emit a native signal on a proxy object. If using the
    low-level API, the process may just look at the signal sender and name, and decide
    what to do based on what it sees.'
