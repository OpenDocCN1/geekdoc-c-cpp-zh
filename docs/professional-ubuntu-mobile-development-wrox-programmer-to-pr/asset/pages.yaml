  md: '# Chapter 5: Application Packaging


    fakeroot


    Gives a fake root environment and enables the running of a command like this (notice
    the user $ and not the root #):


    $ dpkg-buildpackage -rfakeroot


    It is useful for building packages as a normal user.


    lintian


    lintian contains automated checks for many aspects of Debian policy as well as
    some checks for common packaging errors.


    lintian uses an archive directory (called a laboratory), which defaults to /tmp
    and in this directory it stores information about the packages it examines. It
    can keep this information between multiple invocations in order to avoid repeating
    expense data-collection operations.


    pbuilder


    Using pbuilder as a package builder enables you to build the package from within
    a chroot environment. You can build binary packages without using pbuilder, but
    you must have all the build dependencies installed on your system first. Pbuilder
    customization is covered in more detail in this chapter.


    # Packaging and Using a PPA


    With Launchpad''s Personal Package Archives (PPA) it is possible to build and
    then publish binary packages for multiple architectures by uploading source code
    to the web service. Currently the limit on the size of a personal archive is 1GB
    per PPA. If you have multiple PPAs, it is 1GB per PPA. To use the service, your
    PGP key needs to be uploaded and you will need to add the Ubuntu Code of Conduct.


    To show packaging in a real-world situation, we will pack the ubuntu-golden theme,
    which will be created in Chapter 7. This will be uploaded to a Launchpad PPA.


    For more information on Launchpad see Appendix C.


    Create a folder called ubuntu-golden and inside this folder create two other folders
    called debian and gtk-2.0. Inside the gtk-2.0 folder, place the gtk file we created
    in the theme chapter.


    The deb directory is where all the packaging information is stored and it allows
    us to separate the packaging files from the application source files. Inside this
    folder, we will need to create the essential files for any Ubuntu package: changelog,
    control, copyright, and rules. These are the files needed to create the binary
    packages (.deb files) from the original source code. We will look at each file
    in turn.


    This is just a quick demonstration of the files that can be missing. For additional
    information what is missing, please read the Packaging Guide at https://wiki.ubuntu.com/.
    Packaging is an art and if you find yourself going through this that you have
    a natural ability or interest in this area, then this guide is the best place
    to start.


