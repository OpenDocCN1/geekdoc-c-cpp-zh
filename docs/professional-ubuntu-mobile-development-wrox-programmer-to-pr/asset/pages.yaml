  md: '# Chapter 4: Application Development


    # Signals


    Signals are processed by attaching a "callback" function to a given signal for
    any particular output (widget). For example, after creating a new button


    ```

    button = gtk::Button()

    ```


    a callback function that acts when the button is pressed can be set up by calling
    the following:


    ```

    button.connect("clicked", self.callback, "a button")

    ```


    which connects the "clicked" signal of the button to a callback.


    The use of signals can also be seen in the "Putting All Concepts Together" section
    later in this chapter. The first two lines of the code below connect to the status
    icon, and signals are created which drive the mounting. The final three lines
    connect to the status signals already created.


    ```

    self.connect("activate", self.._on_activate_event)

    self.connect("popup-mem", self.._on_popup_menu_event)

    # add a signal to detect when a cd is inserted into the drive

