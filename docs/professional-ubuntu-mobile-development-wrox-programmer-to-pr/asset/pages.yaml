    # Creating a New Application


    OEMs will want to significantly customize the interface of a device as well as
    the range of default applications presented to their end users "out-of-the-box."
    This may require applications to be developed if the required functionality does
    not exist in the Ubuntu repositories. In addition to following a user-driven development
    process and choosing the development methodology (Scrum is highly recommended)
    there are some other key considerations when developing for mobile devices.


    # Application Design


    The most important thing to consider when developing for mobile devices is the
    reduction in screen area when compared with a regular desktop. With this in mind
    the Ubuntu Desktop Sprint in Boston, the mobile team brainstormed some key points
    to consider when working in this environment:


    +   - Screens and dialogs must fit onscreen. This is normally OK.

    - Applications with multiple screens (such as GIMP) should present an easy, obvious
    way to navigate between screens.

    - The filesystem is not visible as a user is on a normal desktop environment.
    Consequently, users should never need to know a filename; they should only interact
    with metadata (thumbnails for the image viewer, song/artist name for music, from/to/subject
    headers in e-mail, and so).

    - Wherever possible, traditional open/save dialogs should be avoided — although
    (given the most popular iPhone user requests)the ability to copy and paste between
    applications is important.

    - "Attach File" dialogs need to present a friendly list of objects to attach (thumbnails
    or metadata). If the user has to be presented with a list of files, the list must
    include only relevant files. Hidden files and folders should be excluded.

    - The number of configuration options should be minimized. Applications should
    come preconfigured with intelligent defaults. Options should be included only
    if they''re easily understood by the computer-phone or if they''re likely to be
    useful to a large number of users.

    - Users love instant feedback. For any interaction with the UI in a visual/audio
    feedback within 200ms, which is the limit of what''s necessary for the appearance
    of "instant." For a tactile device like a MID, it''s important that widgets act
    like physical objects. Delayed reactions remind the user they''re on a computer.

    - Battery life is a major goal for the Ubuntu Mobile platform. Applications should
    use the application request latency from Device Kit, see Chapter 3.


    55'
