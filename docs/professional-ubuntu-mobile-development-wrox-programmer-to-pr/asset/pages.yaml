  md: '# 11


    # # Putting It All Together


    This chapter walks you through the process of creating a custom distribution of
    Ubuntu Mobile, which could potentially be used by an OEM to go to market. It could
    just as easily be used by a laptop "homebrewer" who wishes to resurrect an old,
    unused mobile device that''s gathering dust.


    Like beer making, no special equipment (apart from a laptop and Internet connection)
    is needed to create your image. Choosing a good beer recipe and following good
    brewing procedures can give you top quality beer even with basic equipment. The
    same principles apply to creating a custom image.


    We draw from the previous chapters and show you how to use the techniques and
    skills that you learned in those chapters in order to undertake an example project
    — creating a customized Ubuntu Mobile image for Ubuntu karmic that can be installed
    on a target device.


    # ## Important Things to Consider


    When creating an image for release, there are some key questions to ask — the
    answers to which will influence the content of the image and the default settings
    on the device.


    Ubuntu is updated on a six-month schedule. Within this six-month release cycle
    there are standard, Long Term Support (LTS) desktop, LTS server, and point releases.


    If what is the bleeding edge software, the latest point release should be used.
    However, it can make more sense (especially for OEMs) to build on an LTS release.
    A new LTS is released every two years.


    With the Long Term Support (LTS) versions, commercial support is available from
    Canonical. This is available for three years on the desktop and five years on
    the server. (24/7 commercial support for Ubuntu Mobile is available through Canonical''s
    global support team and partners. See http://www.ubuntu.com/support/paid for more
    details.)'
  merge: -1
