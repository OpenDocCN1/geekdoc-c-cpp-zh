  md: '# Appendix B: Git Usage


    $ git rebase master topic is used to let Git re-apply topic on top of the current
    master, updating all of the topic history.


    $ git tags a known point in history. Generally used to make a release out of the
    current state of the tree.


    # Contributor


    A contributor — a developer who contributes to somebody''s project — will need
    a different set of commands in order to get her work integrated in the upstream
    project. It''s important here to know how to work with a shared repository, when
    to rebase, when to merge, and so on:


    +   - git pulls new code from upstream.


    +   - git push publishes code to the central repository if you have permission.


    +   - git format-patch generates an dropbox patch file that can be mailed using
    git send-email.


    +   - git send-email sends the patches generated with git format-patch.


    # Integrator


    The main developer of a shared project will generally play the role of integrator.
    When playing that role, you might have to integrate (from now on called push)
    another developer''s work. It''s important to remember that on a shared repository
    you not rewrite the history of the repository. Otherwise, everybody working downstream
    will not be able to pull again from your shared tree, forcing them to clone the
    tree again.


    +   - git am is used to apply patches in mbox format mailed to you by your contributors.


    +   - git pull will fetch and merge code from your trusted contributors.


    +   - git revert is used to undo broken or unneeded commits.


    +   - git push is used to publish code to a central and shared repository.


    # Maintainer


    Being a maintainer is generally the same as being an integrator. On a few projects,
    however that might become a completely different role. Imagine the maintainer
    being the main developer on a project and the integrator being the person doing
    some packaging work, for instance. In those cases, you have to play a different
    role with a different set of commands:'
