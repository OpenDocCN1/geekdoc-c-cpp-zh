  md: '# Acknowledgments


    Book acknowledgments are not just list of debts the authors have racked up — many
    readers to see such a roll call of names as a code shortcut to a book’s authority.
    As such, this book is then dedicated both to upstream and to the Debian and Ubuntu
    communities — the developers, documentation writers, artists, business developers,
    Loco teams, and those who made this book possible.


    Acknowledging my debts to the following people, however, doing so feels great:
    My family, especially parents, Carolyn and Gez, who sacrificed so much to get
    me into a position to be able to write these words. I like to make you proud and
    I am profoundly grateful for everything. My beautiful fiancé, Jozi, who makes
    me laugh and smile, and my friends, who give their opinions and make me think.
    I love you all.


    Acknowledging my debts to the following people, however, is necessary. I am grateful
    for the complete professionalism and understanding provided by Carol Long, Kenyon
    Brown and the rest of the team at Wiley — I really enjoyed working with you. This
    book would certainly not have happened without Brian Delaney, David Cohen and
    Felipe Balbi. I met Brian at UDS Boston (thanks Mark!) for the Mobile Link and
    Mobile Directions chapters. Both David and Felipe are old colleagues and low-level
    hackers who wrote the Fine Tuning and GIT sections. Superstars one and all. At
    the Instituto Nokia de Technology, I specifically want to thank Ragnar, Bruno
    and Milton for help with testing, and Thiago, for helping out with the review.


    This section would not be complete without mentioning my co-author Rodrigo Belem.
    He is a gifted programmer and “muito elemento”, too thanks for the insights, for
    the many hours spent hacking, and for the friendship. Finally, this book is dedicated
    to the people of Brazil who love, laugh, suffer, and cry with equal passion, and
    to the people of Amazonas, for whom mobility is a way of life. Finally, we are
    slowing down and listening to what they have to say.


    > Ian Laurence


    My participation in this book would not have been possible without the love and
    support of my mother and my sisters. My father gave me to love, encouragement,
    guidance, and the first push to learn how to fix problems. If not for him, I would
    not have followed a technology career.


    Thanks to my Mom and Dad’s families for all their love.


    I surpassed many problems during the process of writing this book, and fundamental
    in this respect were (and are) Adriana Mele and Heider Cesar. Thanks also to my
    fiancé for her love, attention, and encouragement in the final stages of writing
    this book.


    In walking my path, many people appeared and were essential in influencing my
    hesitant steps to arrive at where I am today. These people are Guelber Menezes,
    Hau Wang, Bruno Monteiro, Thiago Ibiapina, and Frank Choit.'
  merge: -1
