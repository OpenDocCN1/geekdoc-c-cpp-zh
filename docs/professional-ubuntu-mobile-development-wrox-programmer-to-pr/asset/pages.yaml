  md: '# Application Packaging


    There are several reasons why you might want to learn how to package for Ubuntu.
    First, building and fixing Ubuntu packages is a great way to contribute to the
    Ubuntu community. It is also a good way to learn how Ubuntu and the applications
    you have installed work. It is also useful if you need to package an application
    that is not yet in the archive.



    Finally, it is obviously important if you intend to highly customize the default
    set of applications that come with Ubuntu Mobile.


    # Background and Important Tools


    One of the things that makes Ubuntu such a well respected Linux distribution is
    its packaging system, which is based on Debian which is seen as one of the most
    elegant methods of installing, upgrading, and removing software available in the
    Free Software world.


    To become a good packer some familiarity with the following tools is necessary
    (this list is not exhaustive, but rather a snapshot of some of the applications
    which we use):


    # Configure


    Configure is generally developed to be used on multiple platforms. Because each
    of these platforms has different compilers and include files, there is a need
    to write Makefiles (see the next entry) and build scripts that they can work on
    a variety of platforms. The GNU Project, faced with this problem, devised a set
    of tools to help with this task. The `configure` script runs a series of tests
    to determine important information about your machine.


    # make


    Make is a tool that controls the generation of executables and other non-source
    files of a program from the program''s source files.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Chapter 5: Application Packaging


    Make gets its knowledge of how to build your program from a file called a Makefile.
    A makefile is a special file containing shell commands, that you create and name
    Makefile, and is executed by typing the command make in the same directory as
    the Makefile. When you write a program, you should write a makefile for it, so
    that it is possible to use make to build and install the program.


    apt is an acronym for the Advanced Package Tool. This tool has been used extensively
    throughout the book. The following apt commands are used for packaging:


    +   - apt-cache dump — Shows every package in the cache. This command is used
    in combination with the grep pipe as apt-cache dump | grep search for packages
    whose names or dependencies include bar.

    - apt-cache show — Lists the repositories (main/restricted/universe/multiverse)
    in which a package exists.

    - apt-cache showsrc — Shows information about a binary package.

    - apt-cache repends — Shows reverse dependencies for a package (which packages
    require the queried one).

    - apt-rdepends — Recursively lists package dependencies as well as forward build-dependencies.


    dpkg is a Debian packaging tool that can be used to install, query, and uninstall
    packages.

    The following commands are used for packaging:


    +   - dpkg -S — Shows the package to which a particular file belongs.

    - dpkg -l — Shows currently installed packages. This is similar to apt-cache dump
    but for installed packages.

    - dpkg - — Shows the contents of a binary package. It is useful for ensuring that
    files are installed to the right places.

    - dpkg -f — Shows the control file for a binary package. It is useful for ensuring
    that the dependencies are correct.

    - dpkg -L — Lists files "owned" by package(s).

    - dpkg -s — Displays package status details.


    A useful command when working with source packages is:


    ```

    $ dpkg-source -x filename.dsc [output-directory]

    ```


    This extracts a source package. One non-option argument must be supplied, the
    name of the Debian source control file (.dsc). An optional non-option argument
    may be supplied to specify the directory to extract the source package to — this
    must not exist.'
