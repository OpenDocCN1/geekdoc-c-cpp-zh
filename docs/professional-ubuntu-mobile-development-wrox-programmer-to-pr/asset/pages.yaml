  md: '# Chapter 2: The Development Environment


    Linux kernel, OSes appear as Linux processes and can be managed just like any
    other Linux application.


    KVM does not, however, currently operating a GUI that could help a developer new
    to Ubuntu Mobile quickly up-to-speed with development. VirtualBox from Sun Microsystems,
    Inc. is a virtualization solution available under the GPL that has a front end
    and is simple to get up-to-running. Some examples are demonstrated in this chapter
    using VirtualBox and KVM. Finally, for maximum control of the development environment,
    you learn how to create an image from scratch. This method offers more opportunity
    for customization, and is the preferred choice for experienced developers.


    # Getting Started


    Begin by downloading the Jaunty Ubuntu MID release from `http://cdimage.ubuntu.com/releases/jaunty/release/`
    and save it into a folder on your hard drive.


    All of the techniques demonstrated in this chapter (apart from the section on
    ARM) use the Ubuntu MID release, however, they were also tested and work with
    the Ubuntubook Remix release. Download this release if you are targeting a notebook.


    # Getting Familiar with the Ubuntu Mobile Environment


    This section covers the Ubuntu Mobile environment.


    # VirtualBox


    Sun xVM VirtualBox is a collection of virtual machine tools that allow a developer
    to run multiple operating system images at the same time. To see this in action,
    first install the software.


    ```

    $ sudo apt-get install virtualbox-ose

    ```


    Virtualbox-ose is located in the universe repository. To enable this community-maintained
    software repository, go to System -> Administration -> Software Sources and select
    the universe box.


    When it is installed, it is possible to convert the image that you downloaded
    in the “Getting Started” section earlier so it can be used in VirtualBox.


    To do this, run the command (substitute the name of .img file with the one that
    you downloaded):


    ```

    $ vboxmanager convertdd ubuntu-9.04-mid-lpia.img ubuntu-9.04-beta-mid-lpia.vdi

    ```


    This converts ubuntu-9.04-beta-mid-lpia.img to the .vdi format so it can be used
    as a “hard disk” in VirtualBox (this is explained in more detail later).'
