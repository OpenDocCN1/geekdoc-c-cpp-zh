  md: '# Chapter 8: Kernel Fine-Tuning


    by Ubuntu 1.4.9, the latest stable version is 1.4.10. We''ll use DKMS to demonstrate
    how to install the up-to-date version in a pre-installed tuned kernel, while at
    the same time keeping the openafs Ubuntu installed in the generic kernel provided
    by the distribution. Consequently, both versions will be installed at the same
    time and managed by the DKMS framework.


    # Basic DKMS Commands


    There be two kernels installed: linux-image-2.6.28-11-generic (Ubuntu) and linux-image-6-29-custom
    (Tuned).


    It''s important to note that the headers must also be installed on the kernel
    images.


    The kernel from Ubuntu will be the active kernel. The first step is to install
    the openafs-1.4.9 already provided by Ubuntu. Notice that everything should be
    as root.


    ```

    # apt-get install openafs-modules-dkms

    ```


    As you can see, the openafs module is automatically compiled and installed. This
    happens because the dkms commands are already precompiled in the .deb installation
    scripts. Now that the 1.4.9 version has been installed, it is necessary to download
    the newer version (1.4.10) so that this can be installed alongside the 1.4.9 version.
    The most recent version is available in the Debian repositories, so the next step
    is:


    ```

    # wget -c http://ftp.debian.org/debian/pool/main/o/openafs/openafs-modules-dkms_

    1.4.10-dfsg1-2_i386.deb

    ```


    It is not advisable to install the driver as a regular file. If this were to,
    it would overwrite the Ubuntu package and completely overwrite the older version.
    The goal is to keep the Ubuntu kernel and install the newest version in the tuned
    kernel.


    Inside the deb file is a directory named openafs-1.4.10 which is needed. Extract
    it from the deb file and copy it to the correct path in order with DKMS:


    ```

    # ar vx openafs-modules-dkms_1.4.10+dfsg1-2_i386.deb

    # tar xzvf openafs-modules-dkms_1.4.10+dfsg1-2_i386.deb

    # cp -fr /usr/src/openafs-1.4.10 /usr/src

    ```


    After running these commands, the newest driver is copied to the /usr/src path.
    At this point the driver is out of the DKMS tree. Now it is possible to start
    use the dkms commands. The first task is to verify the current status of all the
    drivers in the tree. At least the openafs v1.4.9 (which is already installed)
    will be:


    ```

    # dkms status

    openafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    If nothing is shown after the status command, then no openafs module is installed.
    Something might be wrong with the openafs-modules-dkms package installation. That
    step must be undone.


    Now it is possible to add the up-to-date driver to the tree and change its state
    to Added to the DKMS tree:


    183'
