  md: '# Chapter 9: Testing and Usability


    # Ubuntu Desktop QA


    Currently, testing the functionality of the GNOME desktop on Ubuntu means using
    the accessibility libraries to trigger the user interface widgets of the application
    under test. A prerequisite to this happening is that Assistive Technology Service
    Provider Interface (AT-SPI) be enabled.


    AT-SPI technologies are currently migrating to D-Bus. See Chapter 4 and Appendix
    E for more details.


    To do this on Ubuntu Netbook Remix, go to Preferences <=> Assistive Technologies
    and select the Enable assistive technologies checkbox. This can be seen in Figure
    9-1


    ![](img/001c747b841ab338ed35c50dbdd0c933_223_0.png)


    Figure 9-1


    The interface is enabled at login using gdm, so restart the GNOME session (log
    out and log in). Also, if Compiz is enabled for the desktop then accessibility
    will not work. In this case, choose the plain gnome session in gdm.


    Next, install the Python packages python-ldtp, python-distutils-extra, and python-setuptools
    (as well as Bazaar if it is not already installed):


    ```

    $ sudo apt-get install python-ldtp, python-distutils-extra python-setuptools bzr

    ```


    # Mago — A Desktop Testing Initiative


    To use Mago, check out this branch:


    ```

    $ bzr branch lp:mago

    ```'
