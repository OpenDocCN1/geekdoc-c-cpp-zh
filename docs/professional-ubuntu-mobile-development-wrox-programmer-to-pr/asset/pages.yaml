    gobject.SIGNAL_RUN_LAST, goblet.TYPE_NONE,

    (gobject.TYPE_STRING, gobject.TYPE_BOOLEAN))

    # add a signal to detect when a device is mounted, so an action can be

    # performed after that

    gobject.signal_new("device-mounted", gtk.StatusIcon,

    gobject.SIGNAL_RUN_LAST, goblet.TYPE_NONE, (gobject.TYPE_STRING,))

    gobject.signal_new("device-unmounted", gtk.StatusIcon,

    gobject.SIGNAL_RUN_LAST, goblet.TYPE_NONE, (gobject.TYPE_STRING))

