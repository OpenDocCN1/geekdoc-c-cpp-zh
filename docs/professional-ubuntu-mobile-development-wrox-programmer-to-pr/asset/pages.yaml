    Another toolkit for a mobile developer to use is the Enlightenment Foundation
    Libraries (EFL) or simply “e.\” These libraries form the basis of the Enlightenment
    Window Manager.


    # EFL


    EFL is a toolkit that is well-suited to embedded development, as it has very low
    memory overheads. According to the developers, “Enlightenment provides the building
    blocks for creating beautiful applications.


    EFL consists of:


    +   - Evas

    - Ecore

    - Edje

    - Embryo

    - EET


    The EFL libraries fit well into the embedded device context and are particularly
    useful for animations, transparent components, and themeable applications. A user
    interacts with the window manager, which itself shows a compiled Edje theme. Events
    are captured by Ecore while Evas communicates directly with the kernel to efficiently
    control hardware resources as 3D acceleration.'
