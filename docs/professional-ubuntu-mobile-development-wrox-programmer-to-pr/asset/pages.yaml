    # # Git Usage


    Git is a distributed SCM (Source Code Management) System that was written by Linus
    Torvalds in 2005 to follow the development of the Linux kernel. Since then, it
    has been developed by a rather large group of hackers around the world.


    Intended to be used in a distributed environment, git is really good for sharing
    work in a group of developers no matter what the group''s size or geographical
    location. It''s optimized for merging code from other developers into your repository.


    So that you can understand git as quickly as possible, we have organized this
    according to the kind of project for which it might be used. In each section,
    basic git commands are used, which are necessary for a developer to play a role
    in the project.


    First, the basic repository commands from git — clone, init, fsck, and gc — are
    used, and then commands that are necessary to work with git as an individual developer
    in a standalone project are shown. Finally, commands that are useful for a multi-person
    project are demonstrated with different roles: contributor, maintainer, and integrator.


    # # How Git Works


    Git has three different objects that it uses to describe the whole project: blob,
    tree, and changeset. Each of these objects is used for a different purpose, but
    all are involved in tracking the content modifications in your project.


    # # Blob Object


    A blob object is just a binary blob of data and doesn''t refer to anything. The
    only data verification done in the blob object is that it is indexed by SHA1 hash
    and besides, that has no other attributes — no name associations, no permissions.
    It''s a pure blob of data that can be translated into file contents.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Appendix B: Git Usage


    # Tree Object


    The tree object is defined by a list of permission, name, and blob data sorted
    by name. This means that two identical separate tree objects will share (or point
    to) the same blobs. This gives you a really interesting feature in git for tracking
    file renames. We don''t really mess with the data anyhow, just point to it via
    a different path — or a different tree object.


    # Changeset Object


    The changeset introduces the notion of history into a git repository. It doesn''t
    merely give you the physical state of the tree, but also describes how and why
    you got to that particular state. A changeset is defined by the tree that it results
    in, its parent changesets (zero or more) that took the source code up to that
    point, and a human readable comment on what happened.


    # How Git Objects Relate to Each Other


    It''s simple to understand git if you understand how these three types of objects
    relate to one another. Figure B-1 shows how git works and how it tracks the contents
    of your source code.


    ![](img/001c747b841ab338ed35c50dbdd0c933_313_0.png)


    Figure B-1


    # Basic Repository Commands


    Before you can actually start using git, you need to have a repository to work
    with. If you''re starting a standalone project, you will initialize an empty repository
    and add source code to it as you develop; but on the other hand, if you''re working
    on a pre-existing repository, you need to clone that in order to have a local
    copy to work with.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Appendix B: Git Usage


    Also, it''s important to keep your repository clean and free of errors so you
    don''t lose data while working on it. The last two commands in this section are
    useful for housekeeping your git repository.


    # Creating a New Repository


    ```

    $ mkdir -p projects/my_first_project

    $ cd projects/my_first_project

    $ git init

    Initialized empty Repository in /home/user/projects/my_first_project/.

    ```


    If you take a look at the .git directory, you will see a bunch of directories
    and files that git uses to track the content of your project. Yes, that''s right,
    git tracks content only, not files. This means that when you move or rename a
    file, for it doesn''t really matter — it points to the same content via a different
    path and that is it, or in others, the tree object has a different way to reach
    the blob object.


    # Cloning an Existing Repository


    You might want to collaborate with an existing project. In that case, you would
    have to clone the main tree of that project and start working on top of it. In
    that situation you could use the following:


    ```

    $ mkdir -p projects

    $ cd projects

    $ git clone git://<url>/path/to/project.git

    ```


    For a real-life example, you could clone the Linux kernel tree from Linus Torvalds
    with the following command:


    ```

    $ git clone git://git.kernel.org/pub/scm/linux/kernel/torvalds/linux-2.6.git

    ```


    Cloning will literally make a local copy of the remote repository, meaning you
    will have the complete history of that project available for you. You can work
    completely, commit to your local copy, generate diffs, check out older code, create
    branches, anything.


    Because your goal is to be a distributed SCM, it''s natural that you can do all
    that work on a local copy of the mainline remote repository. Without this freedom,
    it would be impossible to have a real distributed SCM.


    # Checking Repository for Errors


    It seems almost inevitable that filesystems get corrupted. You can try to avoid
    such corruption by checking your repository’s health with the following:


    ```

    $ git fsck

    ```'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Appendix B: Git Usage


    This a rather slow operation as it has to check whether you have unreachable objects,
    dangling objects amongst common errors. Upon running this command, you might see
    something like the following:


    ```

    dangling tree b47648f75aa2a0c9508bdd6efe0bb2da17c6

    dangling tree 2eedf3560f4d043b0047f5c8bc5f163841e5

    ```


    This means that you have two objects dangling (or existing objects that aren''t
    used) could be removed from your repository. Remember that dangling objects are
    not a problem; they often appear in a repository, especially if you re your commits
    frequently.


    # Housekeeping a Repository


    It''s important to keep your repository clean; this will help git do its job faster.
    Here you look at how to remove loose objects, re-create git''s packs, and remove
    the unnecessary ones. Start by running the:


    ```

    $ git gc

    ```


    gc does its best to repack your repository, and remove loose objects and unused
    old packs. However, for sanity housekeeping only git doesn''t try to be too aggressive
    by itself. That''s when you want to use the following three commands:


    ```

    $ git repack

    ```


    With proper options, you can tell git repack to get all your objects and instead
    of creating an incremental pack with the delta, create only one pack with all
    our objects. This will save a considerable amount of disk space and help git a
    bit faster. To achieve this, you can use git repack -a -f -d.


    The command git-prune will prune (remove) all unused loose objects from your repository.
    In other words, all loose objects already contained in a pack will be purged.


    ```

    $ git prune

    ```


    Similar to git prune, the command git prune-packed will remove unused packs from
    your repository.


    ```

    $ git prune-packed

    ```


    There''s not much to say about this command. You can use -n to check the packs
    that will be removed and -q to suppress the progress indicator.


