    Amazon.com\n\n![](img/image00182.jpeg)\n\n## 第一章\n[阅读书籍：第一章] 首先。\n\n现在我们将编写一个程序，在你的电脑上显示\
    \ Hello World。这是 Hamangi 历史上的一个。将此作为世界上大多数人人生的第一步。我将使用 `Codeblocks` 来运行这本书。但即使你使用其他工具也没有问题，所有情况下的工作方式都是相同的。把代码写在编辑器里。如果你不能自己完成，也可以看视频。视频\
    \ - 安装 Codeblock。\n\n好了。现在去“开始”菜单中的“程序”，并启动 `Codeblocks`。它将位于“应用程序”> “编程”中。\n\n\
    在这里，你可以看到程序启动时的提示信息。\n\n现在在编辑器中创建一个文件以保存代码。我将保存该文件。在任何地方给文件命名即可。“另存为”类型将是 `C /\
    \ C++` 文件。\n\n在编辑器中看到的文件名为 `hello.c`。系统中所有文件的扩展名都是 `.c`。\n\n在这里我们将编写我们的代码。在编辑器中输入代码并保存文件。\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    printf(\"Hello World\");\n \
    \   return 0;\n}\n```\n\n现在去“构建”（Build）并点击“编译当前文件”（Compile Current File）。如果你以前写过代码，编译器会告诉你有\
    \ 0 个错误，0 个警告，语法正确。现在再次回到“构建”菜单并点击“运行”（Run）。然后程序就会启动。\n\n在这里看到，你已经完成了 Hello World。下一行显示\
    \ `Process returned 0 (0x0)`（意味着我们不需要再担心了）以及执行时间：0.031 s。运行花费了 0.031 秒。然后是 `line\
    \ 0, Press any key to continue.`。如果你在键盘上找不到任何键，可以在任何地方按。如果你能成功运行并看到 Hello World\
    \ 文本，那就太棒了。你正在做一项重要的工作。\n\n让我们看看写了什么。第一行是：`#include <stdio.h>`，这是你后面写的。第三行是空的。这就是为什么它看起来像一段旋律。第三行：`int\
    \ main ()`。这是一个主函数。系统从主函数开始工作，所以所有程序都有一个（且只有一个）主函数。在主函数的开头，它以大括号开始，以大括号结束。在结束之前，我写了\
    \ `return 0;`。你已经写了，现在先不解释，等我谈到函数时会告诉你。所以现在，让我们在任何地方写一段代码：`int main()` 这里会有一个代码。`return\
    \ 0; }`。\n\n注意程序的下一行：`printf (\"Hello World\");` 这是一个语句。在这里 `printf()` 是一个函数，它的功能是执行某些操作。双引号的内容将写在屏幕上。执行这个函数。有一个名为\
    \ `stdio.h` 的文件。这是一个头文件（`.h` 头文件附件）。`stdio.h` 文件包含了所有的输入输出函数，我们只需要使用它们，现在不需要知道这些函数是如何运作的。由于你使用了\
    \ `printf()` 函数，所以在程序的开头写了 `#include <stdio.h>`。还有很多这样的头文件，我们将来会查看其中的一些。\n\n现在注意语句的结尾。`printf\
    \ (\"Hello World\");` 有最后一个对称符号。在语句后面紧跟着一个分号。一个语句的结束意味着另一个语句的开始。`return 0;` 也是一个语句，所以你也必须以对称符号结尾。如果你忘记在开头加上分号，就会出现编译错误。你可以看到删除分号的诱惑。\n\
    \n这是需要记住的最重要之一。你会注意到我从编辑器的左侧开始写 `#include <stdio.h>`、`int main ()` 和 `{}`。而 `printf`\
    \ 和 `return 0` 前面有四个空格。这是一个缩进。即使你不这样做，工作也会继续，但很多代码的先驱并不会仁慈，也不会进行创新。虽然养成良好习惯有点困难，但就像刷牙一样重要。\n\
