    \ 中选择 `Tab Indents`，并在 `Tab size` 中输入空格 `4`。\n\n## 第二章\n[阅读书籍：第二章] 数据类型、输入和输出。\n\
    \n在这一章我们将编写一些短故事。它们肯定都会看到代码并进行一些小更改，想要运行和编译。\n\n我们的第一步将处理两个数字。现在，数字必须保存在编辑器的内存中，我如何处理它们呢？别哭！有一种通用的语言变量被使用。\n\
    \n我们处理两个数字的第一步：\n\n```c\n#include <stdio.h>\nint main()\n{\n    int a, b, sum;\n\
    \    a = 50;\n    b = 60;\n    sum = a + b;\n    printf(\"Sum is %d\", sum);\n\
    \    return 0;\n}\n```\n\n```c\n#include <stdio.h>\nint main()\n{\n    int a =\
    \ 50, b = 60, sum;\n    sum = a + b;\n    printf(\"Sum is %d\", sum);\n    return\
    \ 0;\n}\n```\n\n现在你是一个了。程序的输出会是什么？\n\n```c\n#include <stdio.h>\nint main()\n{\n\
    \    int x, y;\n    x = 1;\n    y = x;\n    x = 2;\n    printf(\"%d\", y);\n \
    \   return 0;\n}\n```\n\n"
