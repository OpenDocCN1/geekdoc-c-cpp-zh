  trans: '

    ACM ICPC（ACM 世界大学生程序设计竞赛）是规模最大的大学生赛事之一。队伍的选拔是许多发展足球运动员努力的结果。来自各大洲的队伍通过比赛被选出。一个小组由三名成员和一名老师组成。有趣的是，并没有所谓的“活动成员必须是表亲”这种规定。任何拥有分部的人都可以参加这项比赛。


    此外，ERNET 预计将举办各种赛事，来自所有学院大学的学生、老师和兽医都可以参与。这些包括 [Google Code Jam](http://code.google.com/codejam)、[Topcoder](http://www.topcoder.com/tc)
    和 [Codechef](http://www.codechef.com/)。种类之多难以言不尽。然而，在所有这些行业中，孟加拉的农民们都被征服了。

