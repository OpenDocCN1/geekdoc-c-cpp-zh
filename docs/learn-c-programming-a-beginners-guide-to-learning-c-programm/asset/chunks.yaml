    , country);\n    length = 10;\n    for(i = 0; i < length; i++) {\n        if(country[i]\
    \ >= 97 && country[i] <= 122) {\n            country[i] = 'A' + (country[i] -\
    \ 'a');\n        }\n    }\n    printf(\"%s\\n\", country);\n    return 0;\n}\n\
    ```\n\n现在你可以写下大写转小写的逻辑。然后 Kera 再次开始读书。在这里你可以看到（在数组中）有多少个元素。我已经把它写下来并直接给出。现在我们将写一个函数来测量\
    \ cane 的长度！这完全不是那样。通过循环，将检查元素，如果发现字符 `'\\0'`，循环将停止，也就是说循环将持续到找到 `'\\0'` 为止。循环运行的次数将相同。\n\
    \n```c\n#include <stdio.h>\n\nint string_length(char str[])\n{\n    int i, length\
    \ = 0;\n    for(i = 0; str[i] != '\\0'; i++) {\n        length++;\n    }\n   \
    \ return length;\n}\n\nint main()\n{\n    char country[100];\n    int length;\n\
    \    while(1 == scanf(\"%s\", country)) {\n        length = string_length(country);\n\
    \        printf(\"length: %d\\n\", length);\n    }\n    return 0;\n}\n```\n\n\
