    \ ch = 'c'; ch = 'A' + (ch - 'a');`。在这里，从 `ch` 中减去 `'a'` 就像从 `'c'` 中减去 `'a'`（原本从\
    \ 99 变为 97）。Biyagfal 2. 如果他这次执行了那 2 个 `'A'` 的 yags，那么 `'C'` 将丢失！\n\n现在让我们写以下内容：\n\
