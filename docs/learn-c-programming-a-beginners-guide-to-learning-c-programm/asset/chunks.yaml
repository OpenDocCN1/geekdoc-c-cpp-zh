  trans: "\n你已经学会了在游戏过程中使用不同的条件。通过这些技巧，你可能已经开始学会解决纠纷了。非常棒。现在我们来寻找另一个问题及其解决方案。编写一个程序，显示从\
    \ 1 到 10 的所有整数（每行一个数字）。这个问题非常简单，解决方案也极其简单。我知道，在一分钟内，你就能写出自然语法：\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    printf(\"1\\n\");\n    printf(\"2\\n\");\n \
    \   printf(\"3\\n\");\n    printf(\"4\\n\");\n    printf(\"5\\n\");\n    printf(\"\
    6\\n\");\n    printf(\"7\\n\");\n    printf(\"8\\n\");\n    printf(\"9\\n\");\n\
    \    printf(\"10\\n\");\n    return 0;\n}\n```\n\n在这里我们从 1 到 10 对所有内容进行了了编号。你也可以使用\
    \ `printf()` 来：`printf (\"1 \\n2 3 n3 4 n4 n5 6 n6 n7 8 n8 9 n9 10 n10 n\")`。\n\
    \n再次，我还在写。`n` 是一个变量，我们将它的值设置为 1。然后我们给 `n` 赋值。然后将 `n` 的值加 1（写 `n = n + 1` 或简写为\
    \ `n ++`）。\n\n```c\nint n = 1;\nprintf(\"%d\\n\", n);\nn = n + 1;\nprintf(\"%d\\\
    n\", n);\nn = n + 1;\nprintf(\"%d\\n\", n);\nn = n + 1;\n```\n\n### 使用变量和递增\n\n\
    `/* 循环十次 * /`\n\n再次，将 `n` 的值增加到 1 只需要一行代码。\n\n```c\nprintf(\"%d\\n\", n);\nn =\
    \ n + 1;\n```\n\n反之，我们可以写：\n\n```c\nprintf(\"%d\\n\", n++);\n```\n\n无论如何，都可以从\
    \ 1 写到 10。如果我们被要求从 1 写到 100、1000 或 10000 呢，该怎么办？尽可能多做是很重要的。我知道，你不会同意做这么多。\n\n\
    解决这个问题只有一个循环结构。同样的事情可以反复执行。循环中间给了一百个条件，如果条件不满足，它就会不断重复循环内部的工作。两种循环是 `while` 和\
    \ `for`。\n\n### while 循环\n\n我们现在将使用 `while` 来写那个名字。\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int n = 1;\n    while(n <= 10) {\n        printf(\"%d\\n\"\
    , n);\n        n++;\n    }\n    return 0;\n}\n```\n\n多么令人惊讶！现在我们想要尽可能多地坐，而不是 10\
    \ 次，而是尽可能多次。`while` 循环写在第一个循环内部。我做了数百次测试。只要有数百次是真的，循环的内部运行就会继续。循环的内部运行将在第三层内部。就像我们为循环做了两件事：你设置\
    \ `n` 的值，然后 `n` 的值增加 1。如果 `n` 的值增加了 1，那么它将是 1，然后 `n <= 10` 就会成立（因为 `n > 10`）。并且也会退出循环。也就是说，每当满足条件时，循环就会被移除。Eshen\
    \ 的父亲也很关心。循环的内部部分从四叶开始。Eba 的表哥是一个。在白天的输出会是什么？\n\n```c\n#include <stdio.h>\n\n\
    int main()\n{\n    int n = 1;\n    while(n <= 10) {\n        printf(\"%d\\n\"\
    , n);\n        n++;\n    }\n    return 0;\n}\n```\n\n它也会执行从 1 到 10 的所有数字吗？让我们看看。运行游戏。输出是什么？分钟的每一行都是\
    \ 1 而没有剩余。非常难过。让我们看看悲伤背后的原因。`int n = 1;` 将 `n` 的值设置为 1。\n\n然后我将在 `while` 循环中进行数百次测试。我们给出了数百次\
    \ `n <= 10`，所以 `n` 的值等于 10。这数百次是真的，因为 `n` 的值是 1。然后我们将 `n` 的值赋值为 `printf(\"% d\
    \ \\n\", n);`。然后 `n` 的值会增加 1 吗？它不会增加，因为我们已经通过提供符号 `}`（意味着循环结束）完成了第三个森林。我会再次尝试，再次测试\
    \ `n` 的值，以此此类推，因为 `n` 的值没有增加，`n <= 10` 始终是真的——没关系。\n\n现在你可以使用 `while` 循环并请求不同类型的研究。你可以通过始终诚实的条件来保持一个铜质开口。`while\
    \ (1) {...}` 这里 1 被用作百分比。Cutter 1 说要诚实。所以循环的内部运行将一直持续，不会停止。`while (1) {...}` 这里的\
    \ 1 被用作真值。这样  5  父亲也很关心了。\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int\
    \ n = 5;\n    while (n <= 10) {\n        printf(\"%d\\n\", n);\n        n++;\n\
    \        if (n > 10) {\n            break;\n        }\n    }\n    return 0;\n\
    }\n```\n\n### break 和 continue\n\n我们要 1 到 10 吗？我们在 `while` 循环中使用了 `continue`。由于\
    \ `continue` 循环中 `n = 0`，自然语法如下：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n\
    \    int n = 0;\n    while(n < 10) {\n        n = n + 1;\n        if (n % 2 ==\
    \ 0) {\n            continue;\n        }\n        printf(\"%d\\n\", n);\n    }\n\
    \    return 0;\n}\n```\n\n这个程序只使用 1 到 10 之间的奇数。`printf(\"% d \\n\", n)` 因为我们继续使用根。现在我们将看你在六年级学习的商。让我们从\
    \ 5 的名字开始。游戏的输出如下：\n\n5 X 1 = 5\n5 X 2 = 10\n5 X 3 = 15\n5 X 4 = 20\n5 X 5 = 25\n\
    5 X 6 = 30\n5 X 7 = 35\n5 X 8 = 40\n5 X 9 = 45\n5 X 10 = 50\n\n你现在不需要写很多 `printf`\
    \ 函数了。在循环的帮助下，我写道：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int n = 5;\n\
    int i = 1;\n    while (i <= 10) {\n        printf(\"%d X %d = %d\\n\", n, i, n*i);\n\
    \        i = i + 1;\n    }\n    return 0;\n}\n```\n\n所以我们使用了 `while` 循环。现在学习使用\
    \ `for` 循环。如果我们使用 `for` 循环写 5 的名字，那么头部将脱颖而出：\n\n```c\n#include <stdio.h>\n\nint\
    \ main()\n{\n    int n = 5;\n    int i;\n    for(i = 1; i <= 10; i = i + 1) {\n\
    \        printf(\"%d X %d = %d\\n\", n, i, n*i);\n    }\n    return 0;\n}\n```\n"
