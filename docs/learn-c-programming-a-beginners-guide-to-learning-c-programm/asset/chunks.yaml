    \ `==` 等数字（符号）进行，但不能直接使用英文单词。我们需要以相同的方式进行这种比较。例如，按照字母顺序排序。\n\n大和小又是什么呢？只有当我不解释世界而仅仅提供一些示例时，我才能理解。'aab'\
    \ 比 'aaa' 大。同样，在 'ba' 和 'ca' 之间，'ca' 大。在这种情况下，我们将编写一个函数 `string_compare()`，其功能是：通过比较两个字符串，如果大于第一个第三部分则返回\
    \ 1；如果 1 等于 1 或者相等则返回 0。该函数的返回类型将是简单的，参数类型为双类型。\n\n```c\nint string_compare(char\
    \ a[], char b[])\n{\n}\n```\n\n我们的主要任务是比较 `a` 的第一个元素与 `b` 的第一个元素，`b` 的第三元素与 `a`\
    \ 的第三元素。每当 `a` 的因元素小于 `b` 的因元素时，我们可以给它一个小于 `a, b` 的标记。因此，我将通过返回 `-1` 来结束函数。同样，每当\
    \ `a` 的因元素大于 `b` 的因元素时，它返回 1 并结束函数，因为 `a` 大于 `b`。如果一切都相等呢？我们将返回 0。这意味着两者是相等的。\n\
    \n```c\nint string_compare(char a[], char b[])\n{\n    int i, j;\n    for(i =\
    \ 0; a[i] != '\\0' && b[i] != '\\0'; i++) {\n        if(a[i] < b[i]) {\n     \
    \       return -1;\n        }\n        if(a[i] > b[i]) {\n            return 1;\n\
    \        }\n    }\n    if(string_length(a) == string_length(b)) {\n        return\
    \ 0;\n    }\n    if(string_length(a) < string_length(b)) {\n        return -1;\n\
    \    }\n    if(string_length(a) > string_length(b)) {\n        return 1;\n   \
    \ }\n}\n```\n\n## 字符串库\n\n我讨论了 Bing 的 ginseng。有趣的是，有一个名为 `string.h` 的硬件文件，里面有很多功能性函数（如\
