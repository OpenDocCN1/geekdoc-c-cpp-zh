  trans: "\n\n# 函数体与返回值\n\n`function_body`: 你必须对函数将如何工作给出说明。我必须再写一张卡片。`return value`:\
    \ 当函数完成工作时，它会返回到调用它的地方。我们可以在返回时将该值发送给 `Kaena`。`sqrt()` 函数就是我们要做的。可以立即将其发回去吗？如果平方根的值是\
    \ `x`，那么我们就返回 `x`；我会通过返回把值传回。\n\n```c\nint root = sqrt (25);\n```\n\n在这里，在确定 `sqrt`\
    \ 函数的平方根 `25` 之后，平方根将被返回，并存储在一个名为 `root` 的简单变量中。\n\n## 示例\n\n给出一个例子。你们中热爱数学的人熟悉\
    \ `sin`、`cos`、`tan` 等等。`sin 300` 的值是 `0.5`。这里 `sin` 是一个函数，我们给它的参数赋值。然后函数返回该角度的正弦（简写为\
    \ `sin`）值。这次切拉，话不再说，开始玩游戏了。然后看发生了什么。\n\n```c\n#include <stdio.h>  \n\nint main()\
    \    \n\n{\n\n    double a, b, c;\n    a = 2.5;\n    b = 2.5;\n    c = a + b;\n\
    \    printf(\"%lf\\n\" c);\n    return 0;\n}\n```\n\n开始游戏。输出是什么？`5.000000`\n\n\
    ## 函数加法逻辑\n\n现在我们写一个函数来两个数字相加。我不做主函数的工作。\n\n```c\n#include <stdio.h>\n\nint add(int\
    \ num1, int num2)\n\n{\n    double sum = num1 + num2;\n    return sum;\n}\n\n\
    int main()\n{\n    double a, b, c;\n    a = b = 2.5;\n    c = add(a, b);\n   \
    \ printf(\"%lf\\n\", c);\n    return 0;\n}\n```\n\n开始游戏。输出是什么？`4.000000`！哦，我们犯了错误。如果\
    \ `num1` 和 `num2` 进来，它们将不再是 `int` 类型，而是 `double` 类型。由于这两个变量的偏差，损失减少到了 `2.5`（你是指类型转换吗？）。我们犯了一个错：\n\
    \n```c\nint add(double num1, double num2)\n\n{\n    double sum = num1 + num2;\n\
    \    return sum;\n}\n```\n\n这次运行的输出是什么？`5.000000`。让我们解决这个问题吧！啊，这次我们稍微改动了 `a`、`b`\
    \ 的值。`a = 2.8; b = 2.7;`。让我们试试。输出会是什么？`5.500000`？这应该是 `(2.8 + 2.7 = 5.5)`。你会得到输出\
    \ `5.000000`。原因是什么？\n\n因为我们函数的返回类型是 `int`，它等于一个整数的返回。在相加 `num1` 和 `num2` 之后，`5.5`\
    \ 的 `sum` 会在 `sum` 中。所以我们改变返回类型。\n\n这次我们的程序将正常工作了：\n\n```c\n#include <stdio.h>\n\
    \ndouble add(double n1, double n2)\n\n{\n    double sum = n1 + n2;\n    return\
    \ sum;\n}\n\nint main()\n\n{\n    double a, b, c;\n    a = 2.8;\n    b = 2.7;\n\
    \    c = add(a, b);\n    printf(\"%lf\\n\", c);\n    return 0;\n}\n```\n\n## 作用域与原型\n\
    \n现在我们要来一个实验。`add` 函数将写在 `main` 函数之后：\n\n```c\n#include <stdio.h>\n\nint main()\n\
    \n{\n    double a = 2.8, b = 2.7, c;\n    c = add(a, b);\n    printf(\"%lf\\n\"\
    , c);\n    return 0;\n}\n\ndouble add(double n1, double n2)\n\n{\n    double sum\
    \ = n1 + n2;\n    return sum;\n}\n```\n\n如果你运行这个程序，你会看到 `error: 'add' was not\
    \ declared in this scope`，也就是说你无法识别 `add` 函数。但不仅如此，在中文的帮助下你可以做伟大的事情。在 `main` 函数之前给\
