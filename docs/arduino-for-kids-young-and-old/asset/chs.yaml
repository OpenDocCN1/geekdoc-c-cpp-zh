  \ = 0; // the right digit of the display \n```\n\n`volatile` 关键字是程序员（即你）用来告诉编译器该变量可能会在正常控制流之外发生变化，因此不应对其进行优化的方法。基本上，当编译器创建程序时，它会优化代码以利用任何硬件能力，使软件运行得更快。由于这个变量可能会被中断更改，而编译器可能无法自行判断这一点，因此我想确保编译器不要尝试优化这部分代码。对于代码的其他部分，考虑到目前为止涵盖的所有内容，我觉得它们某种程度上是不言自懂的。\n\
  \n# 最终板\n\n我利用了一家在线 PCB 制造商制作了几块板子，用来实现我的电路。总的来说，六（6）块板的费用约为 50.00 美元（含运费）。整体不错。最终制制的\
  \ PCB 如下所示。\n\n![运行中的最终 PCB](img/00034.jpeg)\n\n如你在图片中所示，我的板子正在运行并按照我的意图工作。你可能还会注意到，我的\
  \ `Arduino®` 上安装了一个扩展板，以便与我的扩展板接口。这是为了方便测试，我想将我需要的各种引脚暴露为真正的公引。默认情况下，`Arduino® UNO`\
  \ 上的连接是母座的，而我需要公引来连接到扩展板。由于方便性因素，我使用了 `Arduino® UNO` 进行初步测试。在木制赛车车上，我将会在我的 `Arduino®\
  \ NANO` 上使用公引，它们将直接连接到扩展板。在将所有东西放置在车上进行最终验证时，我发现我从未包含过从扩展板将 9V 电池电源连接到 `Arduino®`\
  \ 的方法。即使你认为已经涵盖了一切，似乎总会有东西被遗漏。我将固定靠近身体的电线，并将 `Arduino® NANO` 放在前面，看起来像一个发动机。我唯一需要做的事情是稍微抬高扩展板本身，以确保它不会碰到轮子。零件在胶水在木制赛车车上的最终设置可以在下面的图片中看到。\n\
  \n![车上的零件](img/00035.jpeg)\n\n![车上零件的侧视图](img/00036.jpeg)\n\n## 总结\n\n在本章中，我探索了创建一个连接到\
  \ `Arduino®` 的接口板，以便在木制赛车上显示数字和大灯。我从一个想法开始，一直努力到最终产品，该产品可以安装在木制赛车上显示赛车号码。最后，它只是为了装饰，不过是一个很酷的装饰。\n\
  \n![章节结束图形](img/00001.jpeg)\n\n# 扩展板 (Shields)\n\n## 性能提升\n\n扩展板为你的 `Arduino®` 平台带来了新功能。扩展板允许你在基础微控制器上添加功能，以完成其他很棒的事情。虽然扩展板带来的大多数功能可以自己构建，但拥有一个现成的、带有可能运行的代码开箱即用绝对是一个额外的奖励。我用过的一些扩展板包括以太网和\
  \ `Bluetooth®` 通信模块。\n\n那么扩展板看起来是什么样子的呢？大多数情况下，它们与 `Arduino® UNO` 非常非常相似。\n\n![标准扩展板图像](img/00037.jpeg)\n\
  \n从像上面的俯视图来看，它甚至看起来像一个 `Arduino® UNO`。主要原因是，大多数扩展板（如果不是所有的话）设计为兼容市面上尽可能多的 `Arduino®`\
  \ 和克隆板。通常，扩展板会暴露与 `Arduino®` 板可提供的相同数字和模拟引脚。除了这些引脚外，扩展板上通常还会有一个复位按钮，以便于重置板子，因为扩展板很可能会覆盖主板上的复位按钮。在某些情况下，可能还存在标准\
  \ LED。虽然这很酷，但在使用扩展板时你必须小心，因为某些你通常可以使用的引脚如果扩展板本身正在使用它们，你可能就无法使用。例如，上面所示是以太网扩展板具有典型的\
  \ `Arduino® UNO` 引脚布局，但如果你仔细观察，你会发现第 10 (10) 和第 4 (4) 引脚的标记不相同。由于以太网芯片和 SD 卡槽都使用\
  \ SPI 进行通信，这两个引脚被默认示例程序（sketches）用作片选（chip selects）。你仍然可以访问这些引脚，但你希望确保不要使用它们，因为这可能会干扰以太网模块或\
  \ SD 卡的操作。除此之外，只需在你的程序中包含正确的库，上上板，然后开始编程即可。需要注意的是的一一点，在主板或扩展板供电时，绝不能安装或移除扩展板。即使只是通过\
  \ USB 线连接到计算机。如果其中一个处于电源状态，安装或移除扩展板可能会损坏主板或扩展板本身。\n\n### 以太网\n\n[以太网扩展板](http://arduino.cc/en/Main/ArduinoEthernetShield)\
  \ 设计用于方便连接到本地网络进行通信。这带来了许多可能性，例如远程监控、远程控制、数据收集等。此扩展板还包含一个微 SD 卡槽用于数据存储，对于离线存储数据也有益，可以在建立互联网连接后进行上传。此扩展板的主要用途之一是可以通过本地网络与\
  \ `Arduino®` 通信，而不需要 LCD 或其他手段来观察控制器的状态。\n\n### 蓝牙\n\n`Bluetooth®` 扩展板为你的微控制器带来了无线技术。这允许与支持\
  \ `Bluetooth®` 串口协议 (SPP) 的 PC 或其他设备进行通信。我使用过的扩展板是：[BT Shield](http://www.seeedstudio.com/wiki/Bluetooth_Shield)，它只支持串口协议。其他模块例如\
  \ [Maker Shed BLE Shield](http://www.makershed.com/Bluetooth_Low_Energy_BLE_Shield_for_Arduino_2_0/mkrbl1.htm)\
  \ 支持 `Bluetooth® LE` 并可能支持其他协议，如高级传输协议 (A2DP) 或免提协议 (HFP)。到目前，我的经验限于使用串口协议通信来控制连接到\
  \ `Arduino®` 的电机，此外还有我们在本章之前看过的 OBDII 连接器。\n\n### 通用\n\n除了预制的扩展板外，市场上还有来自各种来源的许多套件，允许你构建自己的扩展板来连接你手头的任何设备。这些原型扩展板是快速构建电路以与外部设备接口的好方法，可以在开发\
  \ PCB 并订购成品板之前验证设计。我用过的大多数原型扩展板都带有一些组件来建立基础，例如 6 引脚系统内编程接口 (ISP)、ISP、排针和堆叠式排针，以便根据需要将额外的扩展板放置在原型扩展板上方或下方。\n\
  \n\n\n\n\n通常情况下，如果你有一个需要完成的任务，可能已经有一个现成的扩展板（shield）准备好去完成它了。从通信、电机控制到到传感器读取，有各种扩展板可以满足你的需求。当扩展板无法满足要求时，可用的原型套件是构建接口电路的一种简单简便的方法，可以让你在开发\
  \ PCB 之前尝试你的想法。除了现有的扩展板外，大多数扩展板都带有示例代码，你可以直接在自己的项目中使用它们，或者将其作为开发更大、更好项目的起点。这种可能性是无限的。\n\
