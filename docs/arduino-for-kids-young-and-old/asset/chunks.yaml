    \ command. Once you have included the library that you need, in this case, the\
    \ EEPROM library, you will be able to use the functionality that it provides in\
    \ your sketch.\n\nSo we included some additional functionality in our code. That\
    \ is pretty cool and something we will want to remember in the future to save\
