- fmt: "\n```cpp\n /*\n * RotaryEncoder -  the purpose of this sketch is to handle\
    \ the input of\n *                  a rotary encoder to adjust the brightness\
    \ of an LED.\n *\n * The rotary encoder output will be tied to one interupt and\
    \ one normal input\n * line in order to detect movement and determine which direction.\n\
    \ *\n * One output line will be connected to the LED and we will use PWM\n * to\
    \ adjust the brightness based on the amount the rotary encoder is\n * turned.\n\
    \ *\n * We will store the current brightness of the LED (0 - 255) so that we can\n\
    \ * restore it after a reboot.\n */\n\nconst int ledOutput = 3;\nconst int directionPin\
    \ = 4;\nconst long signature = 0xFACE; // some non-arbritary value\n\n/* Module\
    \ includes */\n\n#include <EEPROM.h>\n\n/* Structures used in this sketch */\n\
    \ntypedef struct\n{\n  long signature;\n  int brightness;\n} EE_Structure;\n\n\
    /*\n * Variables used by this sketch\n */\n\nvolatile EE_Structure StoredData;\n\
    \n/*\n * Method declarations \n */\n\nint ReadInteger(int offset);\nvoid WriteInteger(int\
    \ offset, int value);\nlong ReadLong(int offset);\nvoid WriteLong(int offset,\
    \ long value);\nvoid HandleDecoderTrigger();\n\n/*\n * ReadInteger - a helper\
    \ function to read in an integer from the nonvolatile storage\n *\n * Params -\
    \ offset - the offset into the EEPROM where data is stored\n *\n * Returns - int\
    \ - the value read from the specified location\n */\n\nint ReadInteger(int offset)\n\
    {\n  int returnValue = 0;\n\n  // Read in EEPROM\n  for (int count = 0; count\
    \ < sizeof(int); count++)\n  {\n    returnValue |= EEPROM.read(offset + count)\
    \ << (count * 8); // read in a byte from eeprom and shift it x to build up an\
    \ integer of data\n  }\n\n  return returnValue;\n}\n\n/*\n * WriteInteger - a\
    \ helper function to write in an integer to the nonvolatile storage\n *\n * Params\
    \ - offset - the offset into the EEPROM where data is to be stored\n *       \
    \ - value - the value to be stored\n *\n * Returns - none\n */\n\nvoid WriteInteger(int\
    \ offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize = sizeof(int);\n\
    \n  for (int count = 0; count < intSize; count++)\n  {\n    dataValue = value\
    \ >> ((intSize - 1 - count) * 8); // We need to shift from left to right so upper\
    \ first then on down\n    EEPROM.write(offset + count, dataValue);\n  }\n}\n\n\
    /*\n * ReadLong - a helper function to read in a long from the nonvolatile storage\n\
    \ *\n * Params - offset - the offset into the EEPROM where data is stored\n *\n\
    \ * Returns - long - the value read from the specified location\n */\n\nlong ReadLong(int\
    \ offset)\n{\n  long value = 0;\n\n  int storedValue = ReadInteger(offset);\n\n\
    \  value = (storedValue << 16);\n\n  storedValue = ReadInteger(offset + 2);\n\n\
    \  value += storedValue;\n\n  return value;\n}\n\n/*\n * WriteInteger - a helper\
    \ function to write in a long to the nonvolatile storage\n *\n * Params - offset\
    \ - the offset into the EEPROM where data is stored\n *        - value - the value\
    \ to be stored\n *\n * Returns - none\n */\n\nvoid WriteLong(int offset, long\
    \ value)\n{\n  int upperValue = (value >> 16);\n  int lowerValue = value && 0xFFFF;\n\
    \n  WriteInteger(offset, upperValue);\n  WriteInteger(offset + 2, lowerValue);\n\
    }\n\n/*\n * HandleDecoderTrigger - called when the encoder is turned\n *\n * Params\
    \ - none\n *\n * Returns - nothing\n */\n\nvoid HandleDecoderTrigger(void)\n{\n\
    \  byte directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // clockwise\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // counter clockwise\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n}\n\n/*\n * Setup - main configuration point of\
    \ our sketch to configure\n *         the Arduino for reading signals from a rotary\
    \ encoder\n *         and setting the brightness of the LED based on the\n * \
    \        amount the rotary encoder is turned and which direction.\n *\n * Params\
    \ - none\n *\n * Returns - nothing\n */\n\nvoid setup()\n{\n  StoredData.signature\
    \ = ReadLong(0); \n\n  if (StoredData.signature == signature)\n  {\n    // Have\
    \ we been here before?\n    StoredData.brightness = ReadInteger((char *)&StoredData.brightness\
    \ - (char *)&StoredData.signature);\n  }\n  else\n  {\n    // Store signature\
    \ and default brightness of 0\n    WriteLong(0, signature);\n    WriteInteger((char\
    \ *)&StoredData.brightness - (char *)&StoredData.signature, StoredData.brightness);\n\
    \  }\n\n  pinMode(directionPin, INPUT);\n\n  attachInterrupt(0, HandleDecoderTrigger,\
    \ FALLING);  // trigger on falling edge\n}\n\n/*\n * loop - main method which\
    \ will be called each time the\n * arduino goes through its main\n * Params -\
    \ none\n * Returns - nothing\n */\n\nvoid loop()\n{\n  static int lastBrightness\
    \ = 0;\n  static int brightnessOffset = (char *)&StoredData.brightness - (char\
    \ *)&StoredData.signature;\n\n  if (lastBrightness != StoredData.brightness)\n\
    \  {\n    analogWrite(ledOutput, StoredData.brightness);\n    WriteInteger(brightnessOffset,\
    \ StoredData.brightness);\n  }\n\n  // Pause for 500 milliseconds\n  delay(500);\n\
    }\n```\n\n# RotaryEncoder\n\nThe purpose of this sketch is to handle the input\
    \ of a rotary encoder to adjust the brightness of an LED. The rotary encoder output\
    \ will be tied to one interrupt and one normal input line in order to detect movement\
    \ and determine which direction. One output line will be connected to the LED\
    \ and we will use PWM to adjust the brightness based on the amount the rotary\
    \ encoder is turned. We will store the current brightness of the LED (0 - 255)\
    \ so that we can restore it after a reboot.\n\n## Constants\n```cpp\nconst int\
    \ ledOutput = 3;\nconst int directionPin = 4;\nconst long signature = 0xFACE;\
    \ // some non-arbritary value\n```\n\n## Module includes\n```cpp\n#include <EEPROM.h>\n\
    ```\n\n## Structures used in this sketch\n```cpp\ntypedef struct\n{\n  long signature;\n\
    \  int brightness;\n} EE_Structure;\n```\n\n## Variables used by this sketch\n\
    ```cpp\nvolatile EE_Structure StoredData;\n```\n\n## Method declarations\n```cpp\n\
    int ReadInteger(int offset);\nvoid WriteInteger(int offset, int value);\nlong\
    \ ReadLong(int offset);\nvoid WriteLong(int offset, long value);\nvoid HandleDecoderTrigger();\n\
    ```\n\n### ReadInteger\n`ReadInteger` - a helper function to read in an integer\
    \ from the nonvolatile storage.\n- **Params**: `offset` - the offset into the\
    \ EEPROM where data is stored.\n- **Returns**: `int` - the value read from the\
    \ specified location.\n\n```cpp\nint ReadInteger(int offset)\n{\n  int returnValue\
    \ = 0;\n\n  // Read in EEPROM\n  for (int count = 0; count < sizeof(int); count++)\n\
    \  {\n    returnValue |= EEPROM.read(offset + count) << (count * 8); // read in\
    \ a byte from eeprom and shift it x to build up an integer of data\n  }\n\n  return\
    \ returnValue;\n}\n```\n\n### WriteInteger\n`WriteInteger` - a helper function\
    \ to write in an integer to the nonvolatile storage.\n- **Params**: `offset` -\
    \ the offset into the EEPROM where data is to be stored; `value` - the value to\
    \ be stored.\n- **Returns**: none.\n\n```cpp\nvoid WriteInteger(int offset, int\
    \ value)\n{\n  byte dataValue = 0;\n  byte intSize = sizeof(int);\n\n  for (int\
    \ count = 0; count < intSize; count++)\n  {\n    dataValue = value >> ((intSize\
    \ - 1 - count) * 8); // We need to shift from left to right so upper first then\
    \ on down\n    EEPROM.write(offset + count, dataValue);\n  }\n}\n```\n\n### ReadLong\n\
    `ReadLong` - a helper function to read in a long from the nonvolatile storage.\n\
    - **Params**: `offset` - the offset into the EEPROM where data is stored.\n- **Returns**:\
    \ `long` - the value read from the specified location.\n\n```cpp\nlong ReadLong(int\
    \ offset)\n{\n  long value = 0;\n\n  int storedValue = ReadInteger(offset);\n\n\
    \  value = (storedValue << 16);\n\n  storedValue = ReadInteger(offset + 2);\n\n\
    \  value += storedValue;\n\n  return value;\n}\n```\n\n### WriteLong\n`WriteLong`\
    \ - a helper function to write in a long to thevolatile storage.\n- **Params**:\
    \ `offset` - the offset into the EEPROM where data is stored; `value` - the value\
    \ to be stored.\n- **Returns**: none.\n\n```cpp\nvoid WriteLong(int offset, long\
    \ value)\n{\n  int upperValue = (value >> 16);\n  int lowerValue = value && 0xFFFF;\n\
    \n  WriteInteger(offset, upperValue);\n  WriteInteger(offset + 2, lowerValue);\n\
    }\n```\n\n### HandleDecoderTrigger\n`HandleDecoderTrigger` - called when the encoder\
    \ is turned.\n- **Params**: none.\n- **Returns**: nothing.\n\n```cpp\nvoid HandleDecoderTrigger(void)\n\
    {\n  byte directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // clockwise\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // counter clockwise\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n}\n```\n\n### Setup\n`setup` - main configuration\
    \ point of our sketch to configure the Arduino for reading signals from a rotary\
    \ encoder and setting the brightness of the LED based on the amount the rotary\
    \ encoder is turned and which direction.\n- **Params**: none.\n- **Returns**:\
    \ none.\n\n```cpp\nvoid setup()\n{\n  StoredData.signature = ReadLong(0); \n\n\
    \  if (StoredData.signature == signature)\n  {\n    // Have we been here before?\n\
    \    StoredData.brightness = ReadInteger((char *)&StoredData.brightness - (char\
    \ *)&StoredData.signature);\n  }\n  else\n  {\n    // Store signature and default\
    \ brightness of 0\n    WriteLong(0, signature);\n    WriteInteger((char *)&StoredData.brightness\
    \ - (char *)&StoredData.signature, StoredData.brightness);\n  }\n\n  pinMode(directionPin,\
    \ INPUT);\n\n  attachInterrupt(0, HandleDecoderTrigger, FALLING);  // trigger\
    \ on falling edge\n}\n```\n\n### Loop\n`loop` - main method which will be called\
    \ each time the arduino goes through its main loop.\n- **Params**: none.\n- **Returns**:\
    \ nothing.\n\n```cpp\nvoid loop()\n{\n  static int lastBrightness = 0;\n  static\
    \ int brightnessOffset = (char *)&StoredData.brightness - (char *)&StoredData.signature;\n\
    \n  if (lastBrightness != StoredData.brightness)\n  {\n    analogWrite(ledOutput,\
    \ StoredData.brightness);\n    WriteInteger(brightnessOffset, StoredData.brightness);\n\
    \  }\n\n  // Pause for 500 milliseconds\n  delay(500);\n}\n```\n\nNow that we\
    \ have an idea of what an EEPROM can be used for, we should look at that line\
    \ of code that mentions it.\n\n```cpp\n#include <EEPROM.h>\n```\n\nAn `EEPROM`\
    \ is a special device that can store data even when the power to the system is\
    \ turned off. This is called non-volatile memory or sometimes persistent memory.\
    \ One of the special things about this memory is that it can be written to at\
    \ runtime and is built into the micro-controller that we are using the Atmel®\
    \ device. This allows us to store data between user sessions and restore that\
    \ data at runtime in order to pick up where we left off. In this case we will\
    \ be storing the last known brightness level of the LED in order to restore the\
    \ LED to the same brightness level when we turn the circuit back on. This can\
    \ be very handy depending on your application. If this was a television and the\
    \ encoder was used to set the volume of the television, you would want it to come\
    \ back on at the same volume level as when you turned it off. While you could\
    \ just leave the television running all of the time, that would be very wasteful.\
    \ In this case, we can store the current volume in persistent memory and then\
    \ restore it when we power back up making the television more user friendly. So\
    \ now that we have an idea of what an EEPROM can be used for, we should look at\
    \ that line of code that mentions it.\n"
  raw: "```\n /*\n * RotaryEncoder -  the purpose of this sketch is to handle the\
    \ input of\n *                  a rotary encoder to adjust the brightness of an\
    \ LED.\n *\n * The rotary encoder output will be tied to one interupt and one\
    \ normal input\n * line in order to detect movement and determine which direction.\n\
    \ *\n * One output line will be connected to the LED and we will use PWM\n * to\
    \ adjust the brightness based on the amount the rotary encoder is\n * turned.\n\
    \ *\n * We will store the current brightness of the LED (0 - 255) so that we can\n\
    \ * restore it after a reboot.\n */\n\nconst int ledOutput = 3;\nconst int directionPin\
    \ = 4;\nconst long signature = 0xFACE; // some non-arbritary value\n\n/* Module\
    \ includes */\n\n#include <EEPROM.h>\n\n/* Structures used in this sketch */\n\
    \ntypedef struct\n{\n  long signature;\n  int brightness;\n} EE_Structure;\n\n\
    /*\n * Variables used by this sketch\n */\n\nvolatile EE_Structure StoredData;\n\
    \n/*\n * Method declarations \n */\n\nint ReadInteger(int offset);\nvoid WriteInteger(int\
    \ offset, int value);\nlong ReadLong(int offset);\nvoid WriteLong(int offset,\
    \ long value);\nvoid HandleDecoderTrigger();\n\n/*\n * ReadInteger - a helper\
    \ function to read in an integer from the nonvolatile storage\n *\n * Params -\
    \ offset - the offset into the EEPROM where data is stored\n *\n * Returns - int\
    \ - the value read from the specified location\n */\n\nint ReadInteger(int offset)\n\
    {\n  int returnValue = 0;\n\n  // Read in EEPROM\n  for (int count = 0; count\
    \ < sizeof(int); count++)\n  {\n    returnValue |= EEPROM.read(offset + count)\
    \ << (count * 8); // read in a byte from eeprom and shift it x to build up an\
    \ integer of data\n  }\n\n  return returnValue;\n}\n\n/*\n * WriteInteger - a\
    \ helper function to write in an integer to the nonvolatile storage\n *\n * Params\
    \ - offset - the offset into the EEPROM where data is to be stored\n *       \
    \ - value - the value to be stored\n *\n * Returns - none\n */\n\nvoid WriteInteger(int\
    \ offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize = sizeof(int);\n\
    \n  for (int count = 0; count < intSize; count++)\n  {\n    dataValue = value\
    \ >> ((intSize - 1 - count) * 8); // We need to shift from left to right so upper\
    \ first then on down\n    EEPROM.write(offset + count, dataValue);\n  }\n}\n\n\
    /*\n * ReadLong - a helper function to read in a long from the nonvolatile storage\n\
    \ *\n * Params - offset - the offset into the EEPROM where data is stored\n *\n\
    \ * Returns - long - the value read from the specified location\n */\n\nlong ReadLong(int\
    \ offset)\n{\n  long value = 0;\n\n  int storedValue = ReadInteger(offset);\n\n\
    \  value = (storedValue << 16);\n\n  storedValue = ReadInteger(offset + 2);\n\n\
    \  value += storedValue;\n\n  return value;\n}\n\n/*\n * WriteInteger - a helper\
    \ function to write in a long to the nonvolatile storage\n *\n * Params - offset\
    \ - the offset into the EEPROM where data is to be stored\n *        - value -\
    \ the value to be stored\n *\n * Returns - none\n */\n\nvoid WriteLong(int offset,\
    \ long value)\n{\n  int upperValue = (value >> 16);\n  int lowerValue = value\
    \ && 0xFFFF;\n\n  WriteInteger(offset, upperValue);\n  WriteInteger(offset + 2,\
    \ lowerValue);\n}\n\n/*\n * HandleDecoderTrigger - called when the encoder is\
    \ turned\n *\n * Params - none\n *\n * Returns - nothing\n */\n\nvoid HandleDecoderTrigger(void)\n\
    {\n  byte directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // clockwise\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // counter clockwise\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n}\n\n/*\n * Setup - main configuration point of\
    \ our sketch to configure\n *         the Arduino for reading signals from a rotary\
    \ encoder\n *         and setting the brightness of the LED based on the\n * \
    \        amount the rotary encoder is turned and which direction.\n *\n * Params\
    \ - none\n *\n * Returns - nothing\n */\n\nvoid setup()\n{\n  StoredData.signature\
    \ = ReadLong(0); \n\n  if (StoredData.signature == signature)\n  {\n    // Have\
    \ we been here before?\n    StoredData.brightness = ReadInteger((char *)&StoredData.brightness\
    \ - (char *)&StoredData.signature);\n  }\n  else\n  {\n    // Store signature\
    \ and default brightness of 0\n    WriteLong(0, signature);\n    WriteInteger((char\
    \ *)&StoredData.brightness - (char *)&StoredData.signature, StoredData.brightness);\n\
    \  }\n\n  pinMode(directionPin, INPUT);\n\n  attachInterrupt(0, HandleDecoderTrigger,\
    \ FALLING);  // trigger on falling edge\n}\n\n/*\n * loop - main method which\
    \ will be called each time the\n *        Arduino goes through its main loop to\
    \ change the state\n *        of the headlights and update the 7 segment displays\n\
    \ *\n * Params - none\n *\n * Returns - nothing\n */\n\nvoid loop()\n{\n  static\
    \ int lastBrightness = 0;\n  static int brightnessOffset = (char *)&StoredData.brightness\
    \ - (char *)&StoredData.signature;\n\n  if (lastBrightness != StoredData.brightness)\n\
    \  {\n    analogWrite(ledOutput, StoredData.brightness);\n    WriteInteger(brightnessOffset,\
    \ StoredData.brightness);\n  }\n\n  // Pause for 500 milliseconds i.e. 1/2 second.\n\
    \  delay(500);\n} \n```\n\nFor this sketch we have introduced a number of new\
    \ items which I will go over as they appear within the sketch. The first item\
    \ is the signature that I am using. While it is the same as other constant variables\
    \ I have used in the past, I am defining this one in hexadecimal format i.e. [base\
    \ 16](#part0012_split_001.html_Ref14) format. Base 16 format allows the user to\
    \ specify a number using 16 unique tokens which are typically the numbers zero\
    \ (0) through nine (9) and the letters A through F. Because in hexadecimal we\
    \ have this selection of letters to choose from, I opted to spell out a word that\
    \ is easily recognizable. Also note that this is a long integer data variable\
    \ which will be 4 bytes on this platform.\n\n```\n const long signature = 0xFACE;\
    \ // some non-arbritary value \n```\n\nFor this sketch, I chose the word FACE\
    \ as it stands out. The likelihood of this particular letter order coming up randomly\
    \ in memory is fairly low so I can be fairly certain that if I do find this sequence\
    \ of letters in memory then my persistent storage i.e. the EEPROM is initialized.\
    \ Speaking of EEPROM's, I should probably explain what they are and what the following\
    \ line of code does.\n\n```\n #include <EEPROM.h> \n```\n\nAn [EEPROM](#part0012_split_001.html_Ref15)\
    \ is a special device that can store data even when the power to the system is\
    \ turned off. This is called non-volatile memory or sometimes persistent memory.\
    \ One of the special things about this memory is that it can be written to at\
    \ runtime and is built into the micro-controller that we are using i.e. the Atmel®\
    \ device. This allows us to store data between user sessions and restore that\
    \ data at runtime in order to pick back up where we left off. In this case we\
    \ will be storing the last known brightness level of the LED in order to restore\
    \ the LED to the same brightness level when we turn the circuit back on. This\
    \ can be very handy depending on your application. If this was a television and\
    \ the encoder was used to set the volume of the television, you would want it\
    \ to come back on at the same volume level as when you turned it off. While you\
    \ could just leave the television running all of the time, that would be very\
    \ wasteful. In this case, we can store the current volume in persistent memory\
    \ and then restore it when we power back up making the television more user friendly.\
    \ So now that we have an idea of what an EEPROM can be used for, we should look\
    \ at that line of code that mentions it."
