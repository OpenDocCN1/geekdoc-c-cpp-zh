    *   Expansion board to mount the seven segment displays and the headlights


    As mentioned before, the digital I/O pins will drive the individual segments of
    the displays and will also be used to turn on and off the headlights. I am thinking
    perhaps I could use a photodetector to determine when the headlights should be
    turned on. In addition, having a way to set the displays to a value dynamically
    would be very beneficial as I can then use the same code regardless of which car
    is adorned with the electronics. I can also change the assigned number to whatever
    the race officials assign to each child''s car. Given all of the pieces I will
    need to do this, I had better plan on having an expansion board to hold the additional
    components given a bread board will not fit on the derby car and would likely
    push me over the maximum weight limit.


    ### Constraints


    With all of the requirements captured, I now need to look at what constraints
    I have in order to meet all of my requirements but not exceed any of the constraints
    that I have.


    *   Cost - I need to create 4 of these

    *   Size - this needs to be mounted to a pine wood derby car which has a width
    of 1.75" and a length of 7.0"

    *   Weight - a pinewood derby car is limited to 5 ounces

    *   Reproducible - I need to make 4 of these and simplicity is always a good thing


    So of the all of the constraints that I have, cost is the one that is the most
    flexible. The size and weight are hard and fast rules set by the derby regulations.
    While I could possibly do something with reproducibility in mind, I only need
    four (4) so in the long run that will not be as important to me.


    ### Design


    With my requirements and constraints detailed, I can now start looking at a design
    that will meet my needs. The first thing is to decide which Arduino® will meet
    my needs while not breaking the bank in terms of cost. The most common choices
    are as follows:


    | Board | Digital I/O | Interrupts | Analog Inputs | Length (In) | Width (In)
    | Cost * |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | NANO | 14 | 2 | 8 | 1.7 | 0.7 | $25.00 |

    | UNO | 14 | 2 | 6 | 2.95 | 2.1 | $30.00 |

    | MEGA | 54 | 6 | 16 | 4.25 | 2.1 | $60.00 |


    * Cost is variable and will depend on when and where you purchase it. I am listing
    some average prices I have seen online however I expect that you can find better
    pricing if you shop around. There is also the Arduino® Pro Mini from Sparkfun
    Electronics however it requires an USB to FTDI cable negating some of the cost
    savings.


    While the MEGA has more than enough digital I/O''s, it also costs a significant
    amount more than the other options. In addition, it is also a good bit larger
    than the others with a dimension of 4.25" x 2.1". All things considered, the Arduino®
    NANO will be the best choice not only because it is the most inexpensive but also
    because it will fit nicely on the pinewood derby car. The biggest issue I am going
    to have is that it only has 14 digital I/O''s and I need at least 16 not counting
    the interrupt and a sensor for the head lights. This was assuming I would use
    a simple on/off for each of the headlights. If I was to instead make that an analog
    input than I could turn the headlights on when a certain darkness was detected.


    The best way I can see to handle the digital I/O issue is to add a couple of chips
    to expand my I/O pins. I can place these additional chips on the expansion board
    that will hold the 7 segment displays and the headlights which will be two LED''s.
    The chips I have in mind are some that I have used in the past on other designs
    so I have good understanding of how they work and any limitations they may have.
    The chip''s that I have in mind are the `SN74LS595` shift register. The beauty
    of this device is that it takes a serial input and converts it to a parallel output.
    I can shift in a value to represent my 7 segment display and use this device to
    drive the actual segments of the display. At a minimum, I only need two digital
    I/O lines to operate this device and I end up with 8 output lines. Not a bad trade
    off to go from 2 digital I/O''s to 8. Now granted, this is one way and I can only
    use it to expand my outputs however for my current project, this is perfect. For
    this particular device, it has two clock signals, one for the shift register and
    one for the storage register. The storage register is a buffer of sorts that allows
    you to build up the complete 8 bit data value before sending it to the output
    pins. The choice to make is whether you want to have a separate output for each
    of these clock lines which, if your output is better to turn on all at the same
    time, then the second clock line is what you need. I would like to be able to
    shift out the whole value at once to reduce flicker so I will utilize this additional
    clock line and use three digital I/O lines for each of my 7 segment displays.
    I am doing this so when I write a value to the `SN74LS595`, I will see a clean
    transition from one number to the next. I will also use two digital I/O''s for
    my headlights so I can turn them on and off independently. So with this, I am
    now using 8 digital I/O''s. I have enough I/O''s on the Arduino NANO to do this.


    Now that I have my design started I can see that some of my requirements are going
    to be impractical. In order to adjust the number for each car, I will either have
    to have a couple of switches which will increase the number of I/O''s I need or
    I will need to use an analog input and convert the analog value to a digital equivalent.
    As for the photodetector I think I will just pass on this. While it would be cool
    to have the lights come on when needed and turn off when not needed, I am going
    for the flashy look where I want them flashing all the time. Another thing had
    been utilizing an interrupt to trigger when the lights should change. I can still
    do this as it will be simple to be done in code without any hardware however it
    isn''t really necessary. I can simply have a loop do this given the actual micro-controller
    will not be doing much in terms of work. I will however tie the input buttons
    to the interrupt pins so I can increase the number as required and reduce the
    potential of missing an input form the button. With the above design considerations
    my final requirements are as follows:


    *   8 digital outputs

    *   2 push buttons

    *   Inputs to set the display value from 00 to 99

    *   Expansion board to mount the seven segment displays and the headlights


    ### Implementation


    Now that I have my main board selected and I have determined what additional major
    components I will need, I can start implementing my design. I have also refined
    my requirements to match my needs with the capabilities I have or can easily obtain.


    #### Hardware

