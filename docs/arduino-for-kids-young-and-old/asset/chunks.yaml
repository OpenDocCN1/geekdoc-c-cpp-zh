  trans: "\n\n```\n void loop()\n{\n  /*\n   * 获取当前的 millis 来检查是否达到了我们的目标增量\n   */\n\
    \  unsigned long currentCycle = millis(); \n  unsigned long delta = currentCycle\
    \ - lastCycle;\n\n  // 如果我们超过了更新频率，则更新并重新开始\n  if (delta > updateFrequency)\n\
    \  {\n    //--------------------------------------------\n    // 将我的秒（毫秒计）\n \
    \   // 转换为 RPM，即每分钟转数\n    //\n    // 我使用浮点数以获得更高的准确性\n    //--------------------------------------------\n\
    \    float variableRate = ((float)delta / 1000.0f) * 60;\n\n    unsigned long\
    \ currentSpeed = (speedCount * (variableRate)) / fanBlades;\n\n    // 重置速度计数器并将当前周期设置为上一个周期\n\
    \    lastCycle = currentCycle;\n    speedCount = 0;\n\n    //--------------------------------------------\n\
    \    // 在我们重置了上述值后，输出当前速度\n    // 这是因为在我们计算 RPM 的时候\n    // 中断程序仍在运行\n    //--------------------------------------------\n\
    \    Serial.print(\"Current speed is: \");\n    Serial.print(currentSpeed);\n\
    \    Serial.print(\"\\n\");\n  }\n} \n```\n\n这个 sketch 程序非常直观，主要功能是中断例程。在这个例程中，我们记录风扇叶触发中断引脚的次数。大部分工作在主循环\
    \ `loop` 中完成，在循环中我们确定每秒触发中断的次数，并将值转换为 RPM 值。为了实现这一点，我通过调用 `millis()` 函数获取当前的毫秒计数。该函数返回一个\
    \ `unsigned long` 类型的值，代表自 Arduino® 通电以来经过的毫秒数。我这样做是为了将它与我上一次通过 `loop` 函数读取到的值进行比较。一旦我达到一个\
    \ `delta`（即大于我的 `updateFrequency` 的时间跨度），我将通过乘以风扇遮挡红外发射器的次数，来确定风扇旋转的转速。由于风扇有多个叶片，我必须在方程中考虑这一点。虽然我试图确保每秒只执行一次，但我永远无法确定\
    \ `loop` 函数被调用的频率。鉴于此，我给变量 `variableRate` 分配了一个值，代表我的实际时间增量除以 `1000.0f`（一秒中的毫秒数）。然后我乘以六十（60），将值从秒转换为分钟。完成后，我可以获取风扇遮挡红外发射器的总次数，乘以经过的时间，并除以风扇的叶片数量，从而得到最终的每分钟转数（RPM）值。在将值从浮点转换为\
    \ `unsigned long` 整数时，我会丢失一些精度，但对于这个 sketch 来说，应该是没问题的。\n\n### 总结\n\n在本章中，我研究了中断以及如何比轮询（polling）更积极地响应外部事件。轮询非常耗时，并且取决于运行情况，可能会导致错过的事件。中断通过让你的设计能够在事件发生时做出反应，缓解了这一点。缺点是，你必须小心在中断中所执行的操作不要与你在主应用程序循环中的操作冲突。同时，确保实际的中断例程足够快，不要阻止系统执行需要执行的任务也是明智的。\n\
    \n![章节结束图形](img/00001.jpeg)\n\n# 通信\n\n## 一次一个协议与外部世界通信\n\n通信可以有多种形式，从简单的语言，到交通灯等视觉指示，再到复杂设备之间复杂的协议。在本章中，我们将探索用于在复杂设备之间通信的协议。我们的\
    \ Arduino® 将是通信通道的一端，而各种设备和机器将是与 Arduino® 通的另一端。\n\n### 串口 (RS-232)\n\n在之前的章节中，我们查看了\
    \ Arduino® 与主机电脑之间使用 `COMM Port` 进行的初始通信。该端口已用于许多不同的应用，从键盘、鼠标到整系列完全不同的设备。典型的 RS-232\
    \ 通信端口将利用以下信号：\n\n| 信号名称 | 用途 | DB-9 引脚 | DB-25 引脚 |\n| :--- | :--- | :--- | :---\
    \ |\n| Rx | 接收来自发送设备的数据 | 2 | 2 |\n| Tx | 向发送设备传输数据 | 3 | 3 |\n| Gnd | 两个设备之间的共地\
    \ | 5 | 7 |\n\n虽然 Arduino® 与主机之间的标准通信是一个有效用例，并且对于我们调试 sketch 关关重要，但我想探索它可以用于其他应用场景。在这种情况下，我恰好有一个使用\
    \ Arduino® 自身之间串口通信的蓝牙® 扩展板。取决于你使用的 Arduino® 模块，你可以使用硬件串口或软件串口。软件串口设计用于模拟真实的硬件串口，允许你在选择\
    \ Arduino® 使用哪些引脚时具有更大的灵活性。缺点是它是一种仿真，可能会出现异常并且速度可能较慢。但总的来说，在大多数情况下使用软件串口对你的 sketch\
    \ 和微控制器来说应该是透明的。我使用的扩展板来自 [Seeed Studio](http://www.seeedstudio.com/depot/Bluetooth-Shield-p-866.html?cPath=19_21)，它是灵活的，既可以作为主设备也可以作为从设备。\n\
    \n虽然 Arduino® 与主机电脑之间的标准通信是一个有效用例，并且对于我们调试 sketch 关关重要，但我想探索它可以用于其他应用场景。在这种情况下，我恰好有一个使用\
    \ Arduino® 自身之间串口通信的蓝牙® 扩展板。取决于你使用的 Arduino® 模块，你可以使用硬件串口或软件串口。软件串口设计用于模拟真实的硬件串口，允许你在选择\
    \ Arduino® 使用哪些引脚时具有更大的灵活性。缺点是它是一种仿真，可能会出现异常并且速度可能较慢。但总的来说，使用软件串口对你的 sketch 和微控制器来说应该是透明的。我使用的扩展板来自\
    \ [Seeed Studio](http://www.seeedstudio.com/depot/Bluetooth-Shield-p-866.html?cPath=19_21)，它是灵活的，既可以作为主设备也可以作为从设备。另一个不错的特性是它可以使用任何数字引脚来实现系统接口。\n\
    \n在你的项目中使用硬件串口（s）时必须小心，因为第一个串口也用于连接到 USB。当你利用 `Serial` 类的功能时，发送和接收的数据通过此端口传输到主机系统。\n\
    \n| Arduino® | Serial 0 | Serial 1 | Serial 2 | Serial 3 |\n| :--- | :--- | :---\
    \ | :--- | :--- |\n| UNO R3 | 0 (RX), 1 (TX) | N/A | N/A |\n| Leonardo | USB (CDC)\
    \ | 0 (RX), 1 (TX) | N/A | N/A |\n| DUE | 0 (RX), 1 (TX) | 19 (RX), 18 (TX) |\
    \ 17 (RX), 16 (TX) | 15 (RX), 14 (TX) |\n| YUN | USB (CDC) | 0 (RX), 1 (TX) |\
    \ N/A | N/A |\n| MEGA 2560 | 0 (RX), 1 (TX) | 19 (RX), 18 (TX) | 17 (RX), 16 (TX)\
    \ | 15 (RX), 14 (TX) |\n\n还有许多未列出的其他 Arduino 或兼容开发板，但它们大多基于上述列出的开发板之一，并且在大多数情况下，具有非常相似的功能，即串口的数量以及它们所在的引脚。\n\
    \n在处理完这些之后，让我们看看与蓝牙® 扩展板通信的代码。在这个 sketch 中，我将使用引脚六（6）和七（7）与扩展板通信。蓝牙®扩展板将作为主设备连接到另一个作为从设备的设备。在这个示例中，我将与\
    \ [OBDII 接口](http://en.wikipedia.org/wiki/On-board_diagnostics) 通信，以查看车辆上的诊断代码。\n\
    \n#### 所需组件\n\n*   Arduino® 板\n\n*   Seeed Studio 蓝牙扩展板[16]\n\n*   通用 OBDII 连接器[17]\n\
    \n#### 工具\n\n无。\n\n#### 软件\n\n以下代码演示了如何与蓝牙® 扩展板通信，然后使用该设备与远程设备进行通信以发送和接收数据。\n\n"
