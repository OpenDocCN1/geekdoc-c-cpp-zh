    \ [PCI Express](http://en.wikipedia.org/wiki/PCI_Express) and others. Most of\
    \ these are standard in a PC type setting but not always found in an embedded\
    \ micro-controller. In terms of an embedded micro-controller such as the Atmel®\
    \ device used on the Arduino® the above communication methods will be the most\
    \ common and easy to interface with. We also looked at both SPI and I2C which\
    \ are quite similar to each other but do have various pro's and con's.\n\n| Protocol\
    \ | Pro's | Con's |\n\n| Serial | Simple and quite ubiquitous. Has both standard\
    \ and TTL interfaces. | Somewhat slow. Not good for any type of broadcasting i.e.\
    \ sending data to multiple devices at the same time unless you have a special\
    \ adapter. |\n\n| SPI | Speed. Can run very fast and can use the same clock and\
    \ data line to communicate with a number of devices. | Requires a dedicated select\
    \ pin for each device participating on the SPI bus. |\n\n| I2C | Can be faster\
    \ than Serial but not up there with SPI. Only uses two wires as the target device\
    \ address is part of the data that is transmitted. | Potential for conflicts when\
    \ trying to send data when another device is already using the bus. Not as fast\
    \ as SPI. |\n\n![chapter end graphic](images/00001.jpeg)\n\n# Storage\n\n## Bits\
