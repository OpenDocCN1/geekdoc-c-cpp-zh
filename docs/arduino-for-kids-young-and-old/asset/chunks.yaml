    这段代码的编写基于这样一个假设：旋转编码器的每一次旋转将触发它，表示是时候读取辅助引脚上的数值了，我将其命名为 `directionPin`。我使用的旋转编码器输出
    2 位正交信号，包含两个（2）个输入 `Arduino®` 输入。第一个输入用于检测设备的移动。它被映射到中断引脚，因此我不需要不断检查该引脚是否发生了变化。当触发输入达到
    `LOW` 值时，信号被认为是开启的。如果编码器顺时针旋转，另一个输入将是 `HIGH` 信号；如果编码器逆时针旋转，则它将是 `LOW` 信号。这使我既能知道编码器正在旋转，又能检测它的运动方向。根据编码器旋转的方向，我将增加或减少
    LED 的亮度。为了安全起见并避免我的中断例程序出现多次重叠调用，我在进入解码处理程序时禁用中断，并在退出时重新启用。这里的关键是确保在禁用中断期间，我能快速地完成所有必要的操作。通常情况下，让中断关闭任何段时间都不是明智的。然而，对于我们的设置来说，这可能是一个无关紧的问题，但最佳实践是保持中断例程序短小且切中要。作为一个有趣的旁知识，键盘上的按键通常被作为中断处理。在确定按了哪个键的期间，你可以想象保持例程序简短简单会是好的。主要目标是确定按了哪个键，并将其传递给应用程序处理。如果你在每次按键之间必须等待计算机确定应该如何处理该键值，那么打字将是非常令人沮丧的


    ## 风扇转速计


    在这个项目中，我们将利用中断来确定风扇旋转的速度。检测风扇速度有很多方法，但对于这个项目，我们将使用红外发射器和探测器，就像在电视遥控器或类似的电子设备中找到的那样。为了正确实现这一点，我们需要将红外发射器放置在风扇的一侧，将探测器放置在另一侧，使得扇叶在遮挡探测器接收发射器输出时会导致探测器的状态发生改变。由于每片扇叶都会导致探测器上产生一个脉冲，我们需要知道风扇上有多少片扇叶，并使用这个数字来确定风扇每旋转一次我们会看到多少次中断。对于风扇，我们实际上可以使用任何能切断发射器和探测器连接的物体。电脑风扇非常方便，因为许多风扇接受不同的电压以改变其旋转速度。然而，考虑到检测电路的性质，任何切断发射器和探测器之间视线的物体都会导致中断触发。这在其他应用中非常有用，例如运动检测或障碍检测，如你可能会看到的自动车库门器。


    ### 所需组件


    * `Arduino®` 开发板

    * 红外发射器，例如[型号：276-142](http://www.radioshack.com/product/index.jsp?productId=2049723)

    * 红外探测器，例如上述发射器随附的那个

    * 100 姆电阻

    * 15K 姆电阻

    * PC 5v 风扇


    ### 工具


    * 面包板

    * 跳线线

    * 电压表


    ### 原理图


    ![旋转编码器触发电路](img/00028.jpeg)


    ![Creative Commons - 署名 - 相同共享](img/00005.jpeg) 图片由：[Fritzing](http://fritzing.org/)
    创建


    ### 软件


    对于这段代码，我们将配置中断，当风扇叶移开红外发射器的路径并激活红外探测器时触发中断。在上面的图中，风扇将位于两个红外设备之间。

