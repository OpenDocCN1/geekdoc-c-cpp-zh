  trans: "\n\n除了模拟引用外，我们还将把 `fanTachPin` 设置为数字输入，这与我们之前的做法非常相似，但在使用方法上会有细微不同。最后，启动串口并将波特率设置为\
    \ `9600`。这将允许我们观察到被读取的风扇转速。\n\n### 循环 (Loop)\n\n和之前一样，`loop` 方法是完成所有工作的地方。在这个例中，我们将从电位器读取一个值，并向风扇写入一个代表风扇旋转转速的值。此外，我们还将读取风扇转速引脚的脉冲宽度，并将其作为速度显示在串口接口上。\n\
    \n```\n void loop()\n{\n  int fanControlValue = 0;\n  int fanSpeed = 0;\n  int\
    \ fanTach = 0;\n\n  // 读取温度值，范围为 0 到 1023\n  fanControlValue = analogRead(fanControlPin);\n\
    \n  // 我们的 PWM 输出范围是 0 到 255，因此我们将除以\n  // 4，以便将读取到的值转换到输出引脚期望的\n  // 正确范围内。\n\
    \  fanSpeed = fanControlValue / 4;\n\n  analogWrite(fanSpeedPin, fanSpeed);\n\n\
    \  // 读取风扇转速值，该值会在持续 X\n  // 内保持高电信号\n  fanTach = pulseIn(fanTachPin, HIGH);\n\
    \n  char buffer[256];\n  int rpm = 1000000 / fanTach; // 因为单位是微秒，所以使用 100 万\n\n\
    \  // 目标值和实际转速预期不会相同\n  sprintf(buffer, \"Target: %d, Tach: %d\", fanSpeed, rpm);\n\
    \n  Serial.println(buffer);\n\n  // 等待一秒并再次检查\n  delay(1000);\n} \n```\n\n从风扇控制引脚读取电压并将其转换为适用于我们\
    \ PWM 输出的值。输入范围从 `0` 到 `1023`，而输出范围只能是 `0` 到 `255`。正如此，我将通过将读取到的值除以四（`4`）来缩放输入值。一旦转换了数值，我们将写入该速度以设置风扇的运行。请注意，写入的实际数值并非速度，而是一个\
    \ `0` 到 `255` 之间的值。风扇可能在达到最低值（即 `0`）之前就会关闭，并在不为零（`0`）时开启。这是因为开启晶体管需要一定的电压，并且取决于你使用的组件、风扇以及你选择的电压。一旦值被写入风扇速度引脚，我将从转速计读取值以确定风扇的旋转速度。\n\
    \n```\n // 读取风扇转速值，该值会在持续 X\n  // 内保持高电信号\n  fanTach = pulseIn(fanTachPin, HIGH);\
    \ \n```\n\n对于此脚本，我为数字引脚包含了一种新的输入方法。这是 `pulseIn` 方法，设计用于读取 `HIGH` 或 `LOW` 信号的长度。该方法将返回代表脉冲处于\
    \ `HIGH` 或 `LOW` 时间长度的值。该值代表脉冲持续的微秒数。在上面的示例中，我正在测量脉冲为 `HIGH` 持续的时间，以确定风扇的转速。`pulseIn`\
    \ 方法的返回值单位是微秒。因此，我们的旋转频率将是 1 除以微秒数。我在显示器上读到大约 `500` 微秒，这使得 RPM 约为 `2000`，这与我根据风扇文档的预期一致。\n\
    \n一旦我们知道了风扇的转速，我们将向用户显示目标速度和转速计值。之后，我们将睡眠一（`1`）秒，然后再次检查电位器并相应调整风扇速度。你可能会发现风扇转速不稳定，可能会出现显著的波动。我们将在关于中断的章节中解决这个问题。\n\
    \n这种类型的电路与你电脑主板控制 CPU 温度的方式类似。基本上，系统将想要测量 CPU 的当前温度，如果温度超过某个点，则增加风扇速度，当温度下降回某个阈值时则降低速度。如果我们取输入章节中的电路，并将风扇接口添加到该电路中，我们就可以在温度达到设定点时开启风扇。\n\
    \n### 脉冲宽度调制 - 舵机 (Servos)\n\n我们将最后的一个领域是舵机，我们可以控制它来执行某些工作。舵机用于控制机器人手臂，也可以用于控制遥控汽车等。\n\
    \n* Arduino® 开发板\n* 4.7K 欧姆电阻\n* LED\n* +5v DC 电源\n* 5v 舵机，例如这个 [LS-3006](http://www.frys.com/product/7027261)\n\
    \n#### 工具\n\n* 面包板\n* 跳线线\n* 电压表\n\n### 原理图 (Schematic)\n\n![电机电路](img/00023.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 使用 [Fritzing](http://fritzing.org/)\
    \ 创建图像\n\n上面的图显示了连接到 Arduino 的舵机，控制信号连接到 `11`，这是一个 PWM 输出引脚。主要的注意的是，我将舵机连接到 Arduino\
    \ 的 `Vin` 引脚。非常重要是将舵机连接到此引脚而不是 `+5v` 引脚。这还需要你为 Arduino 连接一个 `5v` DC 电源。这是因为舵机消耗的电流超过了\
    \ Arduino 引脚安全能提供的电流。通过连接到 `Vin` 引脚，你将使用直流电源为舵机提供电流，并保护你的 Arduino 不受损坏。这意味着你不应该仅使用\
    \ USB 端口作为电源，因为它最多只能提供 `500` 毫培，这对于舵机和 Arduino 板来说可能是不够的。\n\n#### 软件\n\n以下代码用于控制舵机。主要目标是能够让舵机正反转动。另一个注意的是，舵机有多种格式。有些可以旋转整圈，而另一些只能旋转特定的角度。我拥有的\
    \ `LS-3006` 能够旋转完整的 360 度。\n\n"
- fmt: "\n```cpp\n /*\n * ServoPWM - the purpose of this sketch is to control a servo\
    \ in order to do some work.\n *            the led is used to indicate which direction\
    \ the servo is going with it being\n *            off when the servo is going\
    \ forward and on when it is going backward.\n *\n * The ledPin is used to drive\
    \ the LED to turn it on or off.\n *\n * The servoPin is used to drive the servo\
    \ motor.\n *\n */        \nconst int ledPin = 8;\nconst int servoPin = 11;\n\n\
    /*\n *  The frequency of the arduino PWM signal is around 490 Hz\n *  This translates\
    \ into 2 milliseconds per cycle.\n */\n\nconst int pwmFrequency = 490;\n\ntypedef\
    \ enum\n{\n  FORWARD = 0,\n  BACKWARD = 1\n} eDirection;\n\neDirection servoDirection\
    \ = FORWARD;\n\n/*\n * Motor speeds for the LS-3006\n * which are defined in microseconds.\n\
    \ */\n\ntypedef enum\n{\n  FORWARD_SPEED = 128,  // (1000 microseconds) which\
    \ is equal to half of our cycle\n  BACKWARD_SPEED = 250, // (2000) microseconds\
    \ which is basically the full cycle\n  NEUTRAL_SPEED = 192,  // (1500 microseconds)\
    \ which is equal to three quarters of the cycle,\n} eMotorSpeed;\n\neMotorSpeed\
    \ motorSpeed = FORWARD_SPEED;\n\n/*\n * Method declarations\n */\n\n/* No additional\
    \ methods in this sketch */\n\n/*\n * Setup - main configuration point of our\
    \ sketch to configure\n *         the Arduino for PWM output\n *\n * Params -\
    \ none\n *\n * Returns - nothing\n */\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\
    \  \n}\n\n/*\n * loop - main method which will be called each time the\n *   \
    \     Arduino goes through its main loop to change the\n *        direction of\
    \ the servo\n *\n * Params - none\n *\n * Returns - nothing\n */\n\nvoid loop()\n\
    {\n  // Set our LED to the proper state based on the direction\n  if (servoDirection\
    \ == FORWARD)\n  {\n    motorSpeed = FORWARD_SPEED;\n    digitalWrite(ledPin,\
    \ LOW);\n    servoDirection = BACKWARD;  // set it for next time\n  }\n  else\n\
    \  {\n    motorSpeed = BACKWARD_SPEED;\n    digitalWrite(ledPin, HIGH);\n    servoDirection\
    \ = FORWARD;  // set it for next time\n  }\n\n  analogWrite(servoPin, motorSpeed);\n\
    \n  // Rest for a second and then change directions\n  delay(1000);\n} \n```\n\
    \n## Constants\n\nConstants. What would we do without them? So I have again declared\
    \ a few as follows:\n\n```cpp\n const int ledPin = 8;\nconst int servoPin = 11;\
    \ \n```\n\nThis just defines the pin which the LED is to be connected to along\
    \ with the pin which will drive the signal (`PWM`) to the servo.\n\n```cpp\n const\
    \ int pwmFrequency = 490;\n\ntypedef enum\n{\n  FORWARD = 0,\n  BACKWARD = 1\n\
    } eDirection;\n\neDirection servoDirection = FORWARD; \n```\n\nIn this section\
    \ I have declared what the frequency of the `PWM` signal will be i.e. how often\
    \ it will cycle from on to off. I have also defined an [enumeration](http://en.wikipedia.org/wiki/Enumerated_type)\
    \ to indicate when the servo is moving forward or backward i.e. clockwise or counter-clockwise.\n\
    \n```cpp\n typedef enum\n{\n  FORWARD_SPEED = 128,  // (1000 microseconds) which\
    \ is equal to half of our cycle\n  BACKWARD_SPEED = 250, // (2000) microseconds\
    \ which is basically the full cycle\n  NEUTRAL_SPEED = 192,  // (1500 microseconds)\
    \ which is equal to three quarters of the cycle,\n} eMotorSpeed;\n\neMotorSpeed\
    \ motorSpeed = FORWARD_SPEED; \n```\n\nThe above definitions are the most important\
    \ in this sketch as they define the values to be sent to the `PWM` control pin\
    \ to represent the signals to control the direction of the servo.\n\n## Method\
    \ Declarations\n\nThere are not any additional methods declared for this sketch.\n\
    \n## Setup\n\nThe `setup()` method is where I will configure my Arduino® to operate\
    \ as I need. For this sketch the only pin to configure is the pin connected to\
    \ the onboard LED which will be declared as an output.\n\n```cpp\n void setup()\n\
    {\n  pinMode(ledPin, OUTPUT);  \n} \n```\n\nThis code will set the `ledPin` to\
    \ act as an output signal. This will allow us to control the LED to indicate the\
    \ direction of the servo.\n\n## Loop\n\nAs before, the `loop()` method is where\
    \ all of the work is done. For this sketch we are toggling the direction of the\
    \ servo every second from forward to backward. While this code isn't really useful,\
    \ the idea is to show how it could be used. The applications for this type of\
    \ circuit are endless however it would be a really good fit for a robotic arm\
    \ or perhaps a conveyor belt where you need a little more torque and not necessarily\
    \ the speed.\n\n```cpp\n void loop()\n{\n  // Set our LED to the proper state\
    \ based on the direction\n  if (servoDirection == FORWARD)\n  {\n    motorSpeed\
    \ = FORWARD_SPEED;\n    digitalWrite(ledPin, LOW);\n    servoDirection = BACKWARD;\
    \  // set it for next time\n  }\n  else\n  {\n    motorSpeed = BACKWARD_SPEED;\n\
    \    digitalWrite(ledPin, HIGH);\n    servoDirection = FORWARD;  // set it for\
    \ next time\n  }\n\n  analogWrite(servoPin, motorSpeed);\n\n  // Rest for a second\
    \ and then change directions\n  delay(1000);\n} \n```\n\nFor this circuit, we\
    \ are just moving the servo forward and backward using the `PWM` signals from\
    \ the Arduino®. The LED pin is used to indicate which direction the servo should\
    \ be moving in i.e. forward or backward. This is useful to ensure that the device\
    \ is operating as expected as it is sometimes difficult to see which direction\
    \ the servo is going depending on its speed. To make this really useful, I would\
    \ use an input to trigger an action such as a proximity sensor where I would stop\
    \ the servo from moving when the proximity sensor was triggered.\n\n### Digital\
    \ Output\n\nThe Arduino® supports a number of digital outputs that are capable\
    \ of producing either a `HIGH` or `LOW` signals representing five (5) volts and\
    \ zero (0) volts accordingly. So where are digital output's used? In one case\
    \ you could use them as an electronic switch to activate an external circuit such\
    \ as an LED to indicate something is currently active such as a power on LED.\n\
    \n#### Power On LED\n\nFor our first look at digital outputs, we will create a\
    \ simple power on circuit that will light up a LED when the system has reached\
    \ state. I am going to utilize a tricolor LED in order to have state information.\
    \ The LED will be red when the board is powered down, yellow when the board is\
    \ booting up, and finally green when the board is functional.\n\n* Arduino® Board\n\
    * (3) 470 Ohm Resistor\n* (2) 4.7K Ohm Resistor\n* (2) 2N2222 Transistor\n* tricolor\
    \ LED\n* 3.0 v battery\n\n### Tools\n\n* breadboard\n* jumper wires\n* voltage\
    \ meter\n\n### Schematic\n\nIn this circuit, I am going to utilize an external\
    \ battery that will turn on the RED channel of the tricolor LED when there isn't\
    \ any power to the Arduino®. Once the board starts powering up, we will turn the\
    \ LED to YELLOW, and then finally we will turn it to GREEN once we enter our `LOOP`\
    \ method. The main thing to note is that we need to connect the battery ground\
    \ terminal to the ground pin on our Arduino® in order to establish a common ground\
    \ amongst our components.\n\n![Power Indicator Tri-color LED circuit](images/00024.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created\
    \ using: [Fritzing](http://fritzing.org/)\n\n## Software\n\nThe following code\
    \ is used to manage the power indicator circuit to give a visual representation\
    \ of the state of the circuit.\n"
  raw: "```\n /*\n * ServoPWM - the purpose of this sketch is to control a servo in\
    \ order to do some work.\n *            the led is used to indicate which direction\
    \ the servo is going with it being\n *            off when the servo is going\
    \ forward and on when it is going backward.\n *\n * The ledPin is used to drive\
    \ the LED to turn it on or off.\n *\n * The servoPin is used to drive the servo\
    \ motor.\n *\n */\t        \nconst int ledPin = 8;\nconst int servoPin = 11;\n\
    \n/*\n *  The frequency of the arduino PWM signal is around 490 Hz\n *  This translates\
    \ into 2 milliseconds per cycle.\n */\n\nconst int pwmFrequency = 490;\n\ntypedef\
    \ enum\n{\n  FORWARD = 0,\n  BACKWARD = 1\n} eDirection;\n\neDirection servoDirection\
    \ = FORWARD;\n\n/*\n * Motor speeds for the LS-3006\n * which are defined in microseconds.\n\
    \ */\n\ntypedef enum\n{\n  FORWARD_SPEED = 128,  // (1000 microseconds) which\
    \ is equal to half of our cycle\n  BACKWARD_SPEED = 250, // (2000) microseconds\
    \ which is basically the full cycle\n  NEUTRAL_SPEED = 192,  // (1500 microseconds)\
    \ which is equal to three quarters of the cycle\n} eMotorSpeed;\n\neMotorSpeed\
    \ motorSpeed = FORWARD_SPEED;\n\n/*\n * Method declarations\n */\n\n/* No additional\
    \ methods in this sketch */\n\n/*\n * Setup - main configuration point of our\
    \ sketch to configure\n *         the Arduino for PWM output\n *\n * Params -\
    \ none\n *\n * Returns - nothing\n */\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\
    \  \n}\n\n/*\n * loop - main method which will be called each time the\n *   \
    \     Arduino goes through its main loop to change the\n *        direction of\
    \ the servo\n *\n * Params - none\n *\n * Returns - nothing\n */\n\nvoid loop()\n\
    {\n  // Set our LED to the proper state based on the direction\n  if (servoDirection\
    \ == FORWARD)\n  {\n    motorSpeed = FORWARD_SPEED;\n    digitalWrite(ledPin,\
    \ LOW);\n    servoDirection = BACKWARD;  // set it for next time\n  }\n  else\n\
    \  {\n    motorSpeed = BACKWARD_SPEED;\n    digitalWrite(ledPin, HIGH);\n    servoDirection\
    \ = FORWARD;  // set it for next time\n  }\n\n  analogWrite(servoPin, motorSpeed);\n\
    \n  // Rest for a second and then change directions\n  delay(1000);\n} \n```\n\
    \n###### Constants\n\nConstants. What would we do without them? So I have again\
    \ declared a few as follows:\n\n```\n const int ledPin = 8;\nconst int servoPin\
    \ = 11; \n```\n\nThis just defines the pin which the LED is to be connected to\
    \ along with the pin which will drive the signal (PWM) to the servo.\n\n```\n\
    \ const int pwmFrequency = 490;\n\ntypedef enum\n{\n  FORWARD = 0,\n  BACKWARD\
    \ = 1\n} eDirection;\n\neDirection servoDirection = FORWARD; \n```\n\nIn this\
    \ section I have declared what the frequency of the PWM signal will be i.e. how\
    \ often it will cycle from on to off. I have also defined an [enumeration](http://en.wikipedia.org/wiki/Enumerated_type)\
    \ to indicate when the servo is moving forward or backward i.e. clockwise or counter-clockwise.\n\
    \n```\n typedef enum\n{\n  FORWARD_SPEED = 128,  // (1000 microseconds) which\
    \ is equal to half of our cycle\n  BACKWARD_SPEED = 250, // (2000) microseconds\
    \ which is basically the full cycle\n  NEUTRAL_SPEED = 192,  // (1500 microseconds)\
    \ which is equal to three quarters of the cycle\n} eMotorSpeed;\n\neMotorSpeed\
    \ motorSpeed = FORWARD_SPEED; \n```\n\nThe above definitions are the most important\
    \ in this sketch as they define the values to be sent to the PWM control pin to\
    \ represent the signals to control the direction of the servo.\n\n###### Method\
    \ Declarations\n\nThere are not any additional methods declared for this sketch.\n\
    \n###### Setup\n\nThe setup method is where I will configure my Arduino® to operate\
    \ as I need. For this sketch the only pin to configure is the pin connected to\
    \ the onboard LED which will be declared as an output.\n\n```\n void setup()\n\
    {\n  pinMode(ledPin, OUTPUT);  \n} \n```\n\nThis code will set the ledPin to act\
    \ as an output signal. This will allow us to control the LED to indicate the direction\
    \ of the servo.\n\n###### Loop\n\nAs before, the loop method is where all of the\
    \ work is done. For this sketch we are toggling the direction of the servo every\
    \ second from forward to backward. While this code isn't really useful, the idea\
    \ is to show how it could be used. The applications for this type of circuit are\
    \ endless however it would be a really good fit for a robotic arm or perhaps a\
    \ conveyor belt where you need a little more torque and not necessarily the speed.\n\
    \n```\n void loop()\n{\n  // Set our LED to the proper state based on the direction\n\
    \  if (servoDirection == FORWARD)\n  {\n    motorSpeed = FORWARD_SPEED;\n    digitalWrite(ledPin,\
    \ LOW);\n    servoDirection = BACKWARD;  // set it for next time\n  }\n  else\n\
    \  {\n    motorSpeed = BACKWARD_SPEED;\n    digitalWrite(ledPin, HIGH);\n    servoDirection\
    \ = FORWARD;  // set it for next time\n  }\n\n  analogWrite(servoPin, motorSpeed);\n\
    \n  // Rest for a second and then change directions\n  delay(1000);\n} \n```\n\
    \nFor this circuit, we are just moving the servo forward and backward using the\
    \ PWM signals from the Arduino®. The LED pin is used to indicate which direction\
    \ the servo should be moving in i.e. forward or backward. This is useful to ensure\
    \ that the device is operating as expected as it is sometimes difficult to see\
    \ which direction the servo is going depending on its speed. To make this really\
    \ useful, I would use an input to trigger an action such as a proximity sensor\
    \ where I would stop the servo from moving when the proximity sensor was triggered.\n\
    \n### Digital Output\n\nThe Arduino® supports a number of digital outputs that\
    \ are capable of producing either a HIGH or LOW signals representing five (5)\
    \ volts and zero (0) volts accordingly. So where are digital output's used? In\
    \ one case you could use them as an electronic switch to activate an external\
    \ circuit such as an LED to indicate something is currently active such as a power\
    \ on LED. Of course it could also be used for the reverse where the LED comes\
    \ on when the power to the main board is lost or the like. When a number of the\
    \ digital outputs are used in conjunction with each other, they can be used to\
    \ interface with external devices such as LCD's and other wide data path devices.\n\
    \n#### Power On LED\n\nFor our first look at digital outputs, we will create a\
    \ simple power on circuit that will light up a LED when the system has reached\
    \ an operating state. I am going to utilize a tricolor LED in order to have state\
    \ information. The LED will be red when the board is powered down, yellow when\
    \ the board is booting up, and finally green when the board is functional.\n\n\
    *   Arduino® Board\n\n*   (3) 470 Ohm Resistor\n\n*   (2) 4.7K Ohm Resistor\n\n\
    *   (2) 2N2222(A) Transistor\n\n*   tricolor LED\n\n*   3.0 v battery\n\n#####\
    \ Tools\n\n*   breadboard\n\n*   jumper wires\n\n*   voltage meter\n\n##### Schematic\n\
    \nIn this circuit, I am going to utilize an external battery that will turn on\
    \ the RED channel of the tricolor LED when there isn't any power to the Arduino®.\
    \ Once the board starts powering up, we will turn the LED to YELLOW, and then\
    \ finally we will turn it to GREEN once we enter our LOOP method. The main thing\
    \ to note is that we need to connect the battery ground terminal to the ground\
    \ pin on our Arduino® in order to establish a common ground amongst our components.\
    \ For this circuit, the lack of signal coming from the Arduino® digital output\
    \ pin will result in the LED being lit up RED. I am going to utilize the two transistors\
    \ to act like switches in order to prevent the GREEN and BLUE channels from lighting\
    \ up when the Arduino® isn't powered on. Once we have power, the transistors,\
    \ will allow the Arduino® to apply voltage to the base of each transistor turning\
    \ the switch on to allow the flow of electricity through the LED.\n\n![Power Indicator\
    \ Tri-color LED circuit](images/00024.jpeg)\n\n![Creative Commons - Attribution\
    \ - Share Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \n##### Software\n\nThe following code is used to manage the power indicator circuit\
    \ to give a visual representation of the state of the circuit."
