  trans: "\n\n# 数据结构与枚举\n\n第一个结构定义了一个字节，它由我们感兴趣的要访问设备地址、我们要发送的命令，以及数据的高两个比特位组成（其中最高位未被使用）。尽管我在这个名为\
    \ `CommandByte` 的结构中定义了看起来像三个（3）字节的数据，但实际上我只定义了一个（1）字节，该字节由这三个定义的字段组成。\n\n你会发现，定义的总位数等于一个字节的大小，即八（8）位。我本可以写一个类似的宏来设置地址和命令的值，但对于后来的接手者来说，这样并不能很清楚正在发生了什么。通过利用语言和编译器的特性，我可以编写出清晰且易于维护的代码。\n\
    \n第二个结构基本上是两个字节，第一个字节是命令字节，包含地址和命令；第二个字节是要发送到设备的数据字节。我还使用了 `union`（联合体）来方便访问 `CommandByte`，这同时也允许我简单地将\
    \ `cmdByte` 值传递给 SPI 传输例程。`union` 是一种编程结构，允许你声明多种访问相同数据的方式。在这种情况下，命令字节 `CommandByte`\
    \ 可以通过各个位字段（即 `Address`、`Command` 和 `DataBits`）访问，也可以通过 `cmdByte` 字段一次性访问。`union`\
    \ 允许开发者开发者根据需要访问该值。\n\n提供枚举是为了代码的清晰性，并能够方便地指定我想发出的命令以及我想将其发送到哪个地址。我可以使用简单的整数值，但枚举的优点是更易读，并且在某些高级编程语言中，还能提供额外的收益，例如编译时的类型验证。\n\
    \n# SPI 配置\n\n接下来要查看的是 SPI 总线的配置。\n\n```cpp\n pinMode(spiCS, OUTPUT);\n  pinMode(potCS,\
    \ OUTPUT);\n\n  digitalWrite(potCS, HIGH);\n\n  /* Configure SPI */\n  SPI.begin();\n\
    \n  SPI.setBitOrder(MSBFIRST);\n  SPI.setDataMode(SPI_MODE0);\n  SPI.setClockDivider(SPI_CLOCK_DIV128);\
    \ \n```\n\n在上述代码中，我们做的第一件事是将 SPI 片片选择线配置为输出。无论你将使用 `spiCS` 引脚本身还是其他引脚，该引脚都必须配置为\
    \ `OUTPUT` 引脚，否则 SPI 总线将无法工作。我还将数字电位器的片选信号设置为 `HIGH`，以确保 SPI 总线上的任何杂信号都不会传输到数字电位器。\n\
    \n一旦配置了选择引脚，我就开始 SPI 通信，并将其配置为与我的设备配合。在这种情况下，我的设备 `MCP4621` 使用的是最高位（MSB）数据格式。我将\
    \ SPI 总线配置为上表定义的数据模式零（0）。然后我指定了时钟分频器以降低 SPI 总线的速度。在这种情况下，我将基础系统时钟除以 128，得到 125KHz\
    \ 的时钟速度。我可以让设备运行得更快，高达 10MHz，但对于我的操作来说，速度并不是主要考虑的问题。\n\n# 数据传输\n\n最后，一旦我配置了 SPI\
    \ 总线，就可以对其进行读写操作。以下代码演示了如何通过 SPI 总线传输数据。\n\n```cpp\n void UpdatePot(int selectPin,\
    \ struct _CommandData *pData)\n{  \n  digitalWrite(selectPin, LOW);\n\n  delay(100);\
    \ // required delay\n\n  SPI.transfer(pData->command.cmdByte);\n  SPI.transfer(pData->data);\n\
    \n  digitalWrite(selectPin, HIGH);\n} \n```\n\n我们必须做的第一件事是选择正确的设备，它将接收我们要写入 SPI\
    \ 总线的数据。在将 `selectPin` 驱动低电平（即被选中）后，我添加了一个延迟。这个延迟并不是绝对必要的，但它确保了接收数据的设备有时间准备接收。通常需要几十纳秒的延迟，但我使用的延迟完全足够了，而且对于我们在这里的操作来说，这种延迟是感知不到的。\n\
    \n如果你正在向一个必须快速变换颜色的 LED 灯带写入数据，我会缩短这个延迟，并将时钟提高到 LED 灯带能承受的最高速度。每个都需要不同的配置设置。一旦选择引脚处于正确状态，我就会将命令字节和数据传输到数字电位器。数据传输完成后，我将选择引脚置回\
    \ `HIGH` 状态，从而禁用接收设备的 SPI 接口。需要注意的是，SPI 总线上的每次数据传输都可能导致数据作为传输的一部分被读回。这取决于程序员根据发送到接收设备的内容来判断是否存在这种情况。\n\
    \n数字电位器是一个控制 LED 亮度等其他功能的良好设备。在特殊情况下，`MCP4621` 还可以用于存储少量与设备本身关联的数据，以便持久化值，无论该组件连接到哪个微控制器都可以使用。除了它是一个良好的设备外，它可以通过\
    \ SPI 总线访问的特性使其易于接口化。\n\n"
- fmt: "\nThis method can be a really quick way to simulate an SPI bus without actually\
    \ using SPI. The major downside is that it is much slower than a true SPI BUS\
    \ and is not as flexible. In particular, it is great for sending data to a device\
    \ but not quite as convenient for reading data back in. Typically you will have\
    \ to send out a command to the device in order to have it send back the response.\
    \ While not a big issue if the target device multiplexes the MOSI pin with the\
    \ MISO pin, than you will have to configure the data pin for output when sending\
    \ the command and than reconfigure it for input when receiving the data back from\
    \ the target device. Of course you can always have the data read back in via a\
    \ different I/O pin of the Arduino® too. This can be considerably slower and prone\
    \ to timing issues.\n\n## I2C\n\nInter-integrated circuit, (I2C), is another serial\
    \ data communication interface used between peripheral devices. I2C utilizes two\
    \ signals which are as follows:\n\n| Signal Name | Purpose |\n| :--- | :--- |\n\
    | SCL | The clock signal to synchronize the I2C devices |\n| SDA | Serial data\
    \ line between the primary and subordinate devices |\n\nIn a lot of respects,\
    \ I2C is very similar to SPI in three (3) wire mode where it consists of a synchronization\
    \ clock and a data line used for both transmission and reception. The main difference\
    \ is that I2C does not have a dedicated chip select line and instead relies on\
    \ addressing within the data to indicate which device the data is intended for.\
    \ I2C currently is not as fast as SPI however for most applications this will\
    \ probably be a moot point. Because I2C only utilizes a clock and a data line\
    \ i.e. it doesn't include a chip select, the data sent includes the address of\
    \ the recipient. This address is typically 7 bits following the start bit. This\
    \ allows the controlling device to select which recipient device will receive\
    \ the command / data. It is good to note that while only one device may be the\
    \ intended recipient of the sent data, any device on the same bus will see the\
    \ same data that is sent. The devices that don't have the same address as the\
    \ target device should simply ignore the data. There are other addressing schemes\
    \ including 10 bit addressing and as much as 16 bit addressing. In all cases it\
    \ is dependent upon the device(s) being used and the data sheet for the specific\
    \ device should be consulted prior to use. On the Arduino®, the addressing used\
    \ is seven (7) bits. It is recommended on the Arduino® website to shift an eight\
    \ (8) bit address down by one (1) bit in order to convert it to a seven (7) bit\
    \ address.\n\nThe following table identifies the pins which the various Arduino®\
    \ modules utilize for I2C communications.\n\n| Arduino® | SDA | SCL |\n| :---\
    \ | :--- | :--- |\n| UNO R3 | A4 | A5 |\n| Leonardo | 2 | 3 |\n| DUE | 20, SDA1\
    \ | 21, SCL1 |\n| YUN | 2 | 3 |\n| MEGA 2560 | 20 | 21 |\n\nFor our purposes,\
    \ we will interface with an LCD panel that implements an I2C interface. This will\
    \ allow us to write out status information to a screen other than the serial port\
    \ connected to the programming computer. This will allow an easier time debugging\
    \ your projects and will provide feedback regarding the activity of your device(s).\
    \ The particular screen that I will be using is based off of the `SH1106` controller\
    \ chip.\n\n### Required Components\n\n* Arduino® Board\n* OLED LCD, 128x64 based\
    \ on the `SH1106` controller chip\n\n### Tools\n\n* breadboard\n* jumper wires\n\
    * voltage meter\n\n### Schematic\n\n![I2C display](images/00030.jpeg)\n\n![Creative\
    \ Commons - Attribution - Share Alike](images/00005.jpeg) Image created using:\
    \ Fritzing\n\n### Software\n\nFor this sketch we will be utilizing the `Wire`\
    \ library in order to communicate over the I2C bus. The first thing I found when\
    \ programming this device is that the board is 128x64 pixels however a lot of\
    \ the documentation I had seen indicated it supported 132x64. After monkeying\
    \ with some weird display issues I found it was indeed 128x64. I created a library\
    \ to work with the display which can be downloaded from the web. The main Arduino®\
    \ sketch is fairly minimal mostly for testing out my library for proper operation.\
    \ In the above graphic you can see that in terms of connections, there are not\
    \ a lot. The bottom row of the image showing pins 1 through 20 are internal to\
    \ the board. The board I have has four (4) pins that can plug into a breadboard\
    \ and cover the voltage, ground, SCL, and SDA pins.\n\nFor the code, I will focus\
    \ more on the `Wire` library opposed to the code I wrote to work with it. However\
    \ I will go through a few of the routines that will interface with the `Wire`\
    \ library.\n\n```\n typedef enum\n{\n    StartSend = 0,\n    MidSend,\n    FinishSend,\n\
    \    Complete\n} SendState;\n\n/*\n *  Send Command - used to send a command byte\
    \ to the LCD\n *\n * Params\n *      command - the command to be sent\n *    \
    \  state   - the state of the transmission\n *\n *  Returns\n *      byte - the\
    \ return value from the transmission\n */\n\nbyte sh1106_lcd::SendCommand(byte\
    \ command, SendState state)\n{\n    if (state == StartSend || state == Complete)\
    \ {\n        Wire.beginTransmission(SH1106_ADDR);\n    }\n    Wire.write(command);\n\
    \    if (state == FinishSend || state == Complete) {\n        Wire.endTransmission();\n\
    \    }\n    return command;\n}\n\n/*\n *  Send Data - used to send a data byte\
    \ to the LCD\n *\n * Params\n *      data - the data to be sent\n *      state\
    \   - the state of the transmission\n *\n *  Returns\n *      byte - the return\
    \ value from the transmission\n */\n\nbyte sh1106_lcd::SendData(byte data, SendState\
    \ state)\n{\n    if (state == StartSend || state == Complete) {\n        Wire.beginTransmission(SH1106_ADDR);\n\
    \    }\n    Wire.write(data);\n    if (state == FinishSend || state == Complete)\
    \ {\n        Wire.endTransmission();\n    }\n    return data;\n}\n\n/*\n *  Send\
    \ Byte - used to send a byte to the LCD\n *\n * Params\n *      data - the data\
    \ to be sent\n *      state   - the state of the transmission\n *\n *  Returns\n\
    \ *      byte - the return value from the transmission\n */\n\nbyte sh1106_lcd::SendByte(byte\
    \ data, SendState state)\n{\n    Wire.write(data);\n    byte transmissionStatus\
    \ = 0;\n    if (state == FinishSend || state == Complete) {\n        transmissionStatus\
    \ = Wire.endTransmission();\n    }\n    return transmissionStatus;\n}\n```\n\n\
    In the above code, I have written two main methods to send commands and data to\
    \ the LCD and a third method which will be utilized by each of the other methods.\
    \ Because we can send both data and commands to the controller chip, I have two\
    \ separate methods to handle that with the only difference being the first value\
    \ written out onto the I2C bus indicating whether the following byte is a command\
    \ or is data. I am sure there other ways I could have done it to conserve space\
    \ however I chose this way as it is clear in regard to my intent. The other item\
    \ of interest in this code is the send state `SendState` enumeration which I am\
    \ using to track what state I am in terms of sending data to the I2C device. The\
    \ `Wire` library can buffer up to thirty two (32) bytes of data in its transmission\
    \ queue to send out at one time. As can be seen above, the starting of the send\
    \ along with the finishing of the send adds overhead and for every single byte\
    \ of data, this can add up to a lot of activity on the I2C bus unnecessarily.\n"
  raw: "This method can be a really quick way to simulate an SPI bus without actually\
    \ using SPI. The major downside is that it is much slower than a true SPI BUS\
    \ and is not as flexible. In particular, it is great for sending data to a device\
    \ but not quite as convenient for reading data back in. Typically you will have\
    \ to send out a command to the device in order to have it send back the response.\
    \ While not a big issue if the target device multiplexes the MOSI pin with the\
    \ MISO pin, than you will have to configure the data pin for output when sending\
    \ the command and than reconfigure it for input when receiving the data back from\
    \ the target device. Of course you can always have the data read back in via a\
    \ different I/O pin of the Arduino® too. This can be considerably slower and prone\
    \ to timing issues.\n\n### I2C\n\nInter-integrated circuit, (I2C), is another\
    \ serial data communication interface used between peripheral devices. I2C utilizes\
    \ two signals which are as follows:\n\n| Signal Name | Purpose |\n\n| SCL | The\
    \ clock signal to synchronize the I2C devices |\n\n| SDA | Serial data line between\
    \ the primary and subordinate devices |\n\nIn a lot of respects, I2C is very similar\
    \ to SPI in three (3) wire mode where it consists of a synchronization clock and\
    \ a data line used for both transmission and reception. The main difference is\
    \ that I2C does not have a dedicated chip select line and instead relies on addressing\
    \ within the data to indicate which device the data is intended for. I2C currently\
    \ is not as fast as SPI however for most applications this will probably be a\
    \ moot point. Because I2C only utilizes a clock and a data line i.e. it doesn't\
    \ include a chip select, the data sent includes the address of the recipient.\
    \ This address is typically 7 bits following the start bit. This allows the controlling\
    \ device to select which recipient device will receive the command / data. It\
    \ is good to note that while only one device may be the intended recipient of\
    \ the sent data, any device on the same bus will see the same data that is sent.\
    \ The devices that don't have the same address as the target device should simply\
    \ ignore the data. There are other addressing schemes including 10 bit addressing\
    \ and as much as 16 bit addressing. In all cases it is dependent upon the device(s)\
    \ being used and the data sheet for the specific device should be consulted prior\
    \ to use. On the Arduino®, the addressing used is seven (7) bits. It is recommended\
    \ on the Arduino® website to shift an eight (8) bit address down by one (1) bit\
    \ in order to convert it to a seven (7) bit address.\n\nThe following table identifies\
    \ the pins which the various Arduino® modules utilize for I2C communications.\n\
    \n| Arduino® | SDA | SCL |\n\n| UNO R3 | A4 | A5 |\n\n| Leonardo | 2 | 3 |\n\n\
    | DUE | 20, SDA1 | 21, SCL1 |\n\n| YUN | 2 | 3 |\n\n| MEGA 2560 | 20 | 21 |\n\n\
    For our purposes, we will interface with an LCD panel that implements an I2C interface.\
    \ This will allow us to write out status information to a screen other than the\
    \ serial port connected to the programming computer. This will allow an easier\
    \ time debugging your projects and will provide feedback regarding the activity\
    \ of your device(s). The particular screen that I will be using is based off of\
    \ the SH1106[[19]](#part0012_split_001.html_Ref19) controller chip.\n\n#### Required\
    \ Components\n\n*   Arduino® Board\n\n*   OLED LCD, 128x64 based on the SH1106\
    \ controller chip\n\n#### Tools\n\n*   breadboard\n\n*   jumper wires\n\n*   voltage\
    \ meter\n\n#### Schematic\n\n![I2C display](images/00030.jpeg)\n\n![Creative Commons\
    \ - Attribution - Share Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \n#### Software\n\nFor this sketch we will be utilizing the Wire library in order\
    \ to communicate over the I2C bus. The first thing I found when programming this\
    \ device is that the board is 128x64 pixels however a lot of the documentation\
    \ I had seen indicated it supported 132x64\\. After monkeying with some weird\
    \ display issues I found it was indeed 128x64\\. I created a library to work with\
    \ the display which can be downloaded from the web [[20]](#part0012_split_001.html_Ref20).\
    \ The main Arduino® sketch is fairly minimal mostly for testing out my library\
    \ for proper operation. In the above graphic you can see that in terms of connections,\
    \ there are not a lot. The bottom row of the image showing pins 1 through 20 are\
    \ internal to the board. The board I have has four (4) pins that can plug into\
    \ a breadboard and cover the voltage, ground, SCL, and SDA pins.\n\nFor the code,\
    \ I will focus more on the Wire library opposed to the code I wrote to work with\
    \ it. However I will go through a few of the routines that will interface with\
    \ the Wire library.\n\n```\n typedef enum\n{\n    StartSend = 0,\n    MidSend,\n\
    \    FinishSend,\n    Complete\n} SendState;\n\n/*\n *  Send Command - used to\
    \ send a command byte to the LCD\n *\n * Params\n *      command - the command\
    \ to be sent\n *      state   - the state of the transmission\n *\n *  Returns\n\
    \ *      byte - the return value from the transmission\n */\n\nbyte sh1106_lcd::SendCommand(byte\
    \ command, SendState state)\n{\n    if (state == StartSend || state == Complete)\n\
    \    {\n        Wire.beginTransmission(SH1106_ADDR1);\n        Wire.write(SH1106_COMMAND);\n\
    \    }\n\n    return SendByte(command, state);\n}\n\n/*\n *  Send Data - used\
    \ to send a data byte to the LCD\n *\n * Params\n *      data - the data to be\
    \ sent\n *      state   - the state of the transmission\n *\n *  Returns\n * \
    \     byte - the return value from the transmission\n */\n\nbyte sh1106_lcd::SendData(byte\
    \ data, SendState state)\n{\n    if (state == StartSend || state == Complete)\n\
    \    {\n        Wire.beginTransmission(SH1106_ADDR1);\n        Wire.write(SH1106_DATA);\n\
    \    }\n\n    return SendByte(data, state);\n}\n\n/*\n *  Send Byte - used to\
    \ send a byte to the LCD\n *\n * Params\n *      data - the data to be sent\n\
    \ *      state   - the state of the transmission\n *\n *  Returns\n *      byte\
    \ - the return value from the transmission\n */\n\nbyte sh1106_lcd::SendByte(byte\
    \ data, SendState state)\n{\n    Wire.write(data);\n\n    byte transmissionStatus\
    \ = 0;\n\n    if (state == FinishSend || state == Complete)\n    {\n        transmissionStatus\
    \ = Wire.endTransmission();\n    }\n\n    return transmissionStatus;\n} \n```\n\
    \nIn the above code, I have written two main methods to send commands and data\
    \ to the LCD and a third method which will be utilized by each of the other two\
    \ methods. Because we can send both data and commands to the controller chip,\
    \ I have two separate methods to handle that with the only difference being the\
    \ first value written out onto the I2C bus indicating whether the following byte\
    \ is a command or is data. I am sure there other ways I could have done it to\
    \ conserve space however I chose this way as it is clear in regard to my intent.\
    \ I did create a third method, SendByte which is used by each of the other methods\
    \ in order to reduce the code size when and after data is sent. The other item\
    \ of interest in this code is the send state SendState enumeration which I am\
    \ using to track what state I am in terms of sending data to the I2C device. I\
    \ am doing this for potential speed savings when writing to the end device as\
    \ some devices can accept a number of commands or data values in one transmission\
    \ sequence. The Wire library can buffer up to thirty two (32) bytes of data in\
    \ its transmission queue to send out at one time. As can be seen above, the starting\
    \ of the send along with the finishing of the send adds overhead and for every\
    \ single byte of data, this can add up to a lot of activity on the I2C bus unnecessarily.\
    \ So to alleviate this, I created a simple enumeration in the code to track what\
    \ state I am in and cut down on the number of bytes being sent over the bus to\
    \ improve overall throughput."
