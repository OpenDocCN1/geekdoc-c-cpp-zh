    \ can use the voltage meter to ensure that I have wired my LM335 correctly and\
    \ it is measuring a voltage in the general range I expect. Typical voltage meters\
    \ are actually multimeters which can measure in addition to voltage, current and\
    \ resistance. One such feature on my multimeter is the continuity check where\
    \ I can ensure that I have wired things properly by checking two points and audibly\
    \ verifying that I have continuity between them. So while I may mention that a\
    \ voltage meter or multimeter is one of the tools recommended, I may not indicate\
    \ when I use it. Basically it is one of those tools that you should have for whatever\
    \ circumstances come up.\n\n### Digital Input\n\nFor digital inputs, the Arduino®\
    \ has a number of pins available to accomplish this. When we say digital input,\
    \ we are referring to the micro-controller being able to recognize an incoming\
    \ signal as either HIGH or LOW. For the devices we are looking at, this would\
    \ be equivalent to zero (0) volts representing a LOW value and five (5) volts\
    \ representing a HIGH* value. The main thing to remember with digital inputs is\
    \ that the value to trigger either a HIGH or LOW is not exact. There is a range\
    \ of values that will cause the input to be HIGH or LOW. The datasheet indicates\
    \ that a LOW signal is anything from -0.5v through 1.5v when the micro-controller\
    \ is powered by 5v. The datasheet also indicates that a HIGH signal is anything\
    \ from 3.0v through 5.5v when the micro-controller is powered by 5v. The main\
    \ thing to note is that any voltage between 1.5v and 3.0v will be undefined and\
    \ should be avoided to prevent unexpected application execution. Using our last\
    \ example, I am now going to create a circuit and sketch that will only trigger\
    \ when the temperature reaches a certain value such as 80°F which would be 26.67°C.\n\
    \n* the Arduino® UNO runs on 5 volts hence the value when set to HIGH will be\
    \ 5 volts. Other boards, such as the [Arduino Due](http://arduino.cc/en/Main/ArduinoBoardDue),\
    \ run at a lower voltage such as 3.3v so the output voltage when set to HIGH will\
    \ be equivalent to that lower voltage.\n\n#### Temperature Comparison\n\nFirst\
    \ we will develop a circuit that will trigger when a certain temperature is reached.\
    \ For this circuit, we will want it to trigger at 80°F which would be 26.67°C.\
    \ Using what we know about the LM335, 0°C is equal to 2.73v and each 1°C increases\
    \ the voltage by 10mV. If we divide the 26.67°C by 100 to get it into the 10mV\
    \ range, we will see that we need a voltage increase from 0°C of 0.2667v. So our\
    \ target voltage across the LM335 will be 2.9967v. Oddly enough this is almost\
    \ enough voltage to trigger our digital input however due to the variations found\
    \ in components, doing this would be problematic and result in flaky operation\
    \ of our program and circuit. To overcome this, we will create a comparison circuit\
    \ that will trigger the digital HIGH value in the required range which is above\
    \ 3.0v.\n\n##### Required Components\n\n*   Arduino® Board\n\n*   4.7K Ohm Resistor\n\
    \n*   (2) 10K Trim potentiometers\n\n*   LM335 temperature sensor[[7](#part0012_split_001.html_Ref7)]\
    \ or similar such as the NTE7225[[8](#part0012_split_001.html_Ref8)]\n\n*   LM311\
    \ voltage comparator[[9](#part0012_split_001.html_Ref9)] or similar such as the\
    \ NTE943M[[10](#part0012_split_001.html_Ref10)]\n\n##### Tools\n\n*   breadboard\n\
    \n*   jumper wires\n\n*   voltage meter\n\n##### Schematic\n\nFor this schematic\
    \ we will be using the circuit from before however this time we will be using\
    \ a voltage comparator to compare our temperature voltage with our target voltage.\
