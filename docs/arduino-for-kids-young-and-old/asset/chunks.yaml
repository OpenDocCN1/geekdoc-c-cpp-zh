  trans: "\n\n![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 使用 [Fritzing](http://fritzing.org/)\
    \ 创建图像\n\n## 软件\n\n以下是监控输入信号所需的代码，用于判断我们的温度读数是否大于设定点，如果是的话，则采取适当的操作（例如开启风扇）。\n\
    \n```cpp\n /*\n  * 该电路设计用于根据房间的当前温度在高电平（HIGH）和低电平（LOW）之间切换。\n  * 电位器和电阻用于将 5v\
    \ 信号 分分为两个值，\n  * 从而为我们提供触发比较器输出所需的比较值。\n  * 2.73v 等于 0°C，因此为了让比较器触发，我们希望\n  *\
    \ 确保电位器上产生 2.73v + X 的电压，其中\n  * X 是我们想要切换开启的温度。\n  * temperaturePin（现在称为 setPointPin）将再次读取温度，\n\
    \  * 但它实际上是电位器上的电压，\n  * 所以我们可以将其作为设定点。\n  * temperatureTogglePin 将用于判断我们是在高于\n\
    \  * 还是低于目标温度。\n  */        \n const int setPointPin = 0;\n const int temperatureTogglePin\
    \ = 7;\n const float baseVoltage = 2.730f; /* 0°C 时为 2.730V */\n const float voltageReference\
    \ = 5.0f;\n const float maxSampleCount = 1023.0f;\n const float CtoFConversion\
    \ = 9.0f / 5.0f;\n const float FtoCConversion = 5.0f / 9.0f;\n const float CtoFDelta\
    \ = 32.0f;\n\n /*\n  * 方法声明\n  */\n\n float getTemperature(float temperatureVoltage);\n\
    \ float convertTemperatureToF(float temperatureInCelsius);\n float convertTemperatureToC(float\
    \ temperatureInFahrenheit);\n\n /*\n  * getTemperature - 根据输入的电压值确定摄氏度温度，\n  *\
    \         假设 2.73v 等于 0°C\n  *\n  * 参数 - temperatureVoltage - 代表温度的输入电压\n  *\n\
    \  * 返回 - float - 根据输入电压的实际摄氏度温度\n  */\n\n float getTemperature(float temperatureVoltage)\n\
    \ {\n   float currentTemperature = 0.0f;\n\n   // 根据数据手册，每 10 mv 等于 1 °K - 0°C\
    \ 是 273°K 等于 2.73v\n   // 温度缩放 100 倍以便从开尔文单位转换为摄氏度单位\n   currentTemperature =\
    \ (temperatureVoltage - baseVoltage) * 100;\n\n   return currentTemperature;\n\
    \ }\n\n /*\n  * convertTemperatureToF - 将温度从摄氏度转换为华氏度\n  *\n  * 参数 - temperatureInCelsius\
    \ - 输入的摄氏度温度\n  *\n  * 返回 - float - 以华氏度表示的温度\n  */\n\n float convertTemperatureToF(float\
    \ temperatureInCelsius)\n {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature\
    \ = (temperatureInCelsius * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n\
    \ }\n\n /*\n  * convertTemperatureToC - 将温度从华氏度转换为摄氏度\n  *\n  * 参数 - temperatureInCelsius\
    \ - 输入的华氏度温度\n  *\n  * 返回 - float - 以摄氏度表示的温度\n  */\n\n float convertTemperatureToC(float\
    \ temperatureInFahrenheit)\n {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature\
    \ = (temperatureInFahrenheit - CtoFDelta) * FtoCConversion;\n\n   return convertedTemperature;\n\
    \ }\n\n /*\n  * Setup -  sketch 程序的主配置点，用于\n  *         配置 Arduino 的模拟输入\n  *\n\
    \  * 参数 - 无\n  *\n  * 返回 - 无\n  */\n\n void setup()\n {\n   pinMode(temperatureTogglePin,\
    \ INPUT);\n   analogReference(DEFAULT);\n   Serial.begin(9600);\n }\n\n /*\n \
    \ * loop - 主方法，每次 Arduino 执行\n  *        主循环时都会调用，用于读取\n  *        设定点温度值并检查我们的数字\n\
    \  *        输入引脚是否为高电平。\n  *\n  * 参数 - 无\n  *\n  * 返回 - 无\n  */\n\n void loop()\n\
    \ {\n    int    rawSetPointValue = 0;\n    float  setPointVoltage = 0.0f;\n  \
    \  float  temperatureSetPoint = 0.0f;\n\n    // 读取温度值，范围在 0 到 1023 之间\n    rawSetPointValue\
    \ = analogRead(setPointPin);\n\n    // 将我们输入的电压表示转换为我们可以利用的值\n    setPointVoltage\
    \ = ((float)rawSetPointValue * voltageReference) / maxSampleCount;\n\n    // 我们现在有了以摄氏度表示的当前温度\n\
    \    temperatureSetPoint = getTemperature(setPointVoltage);\n\n    // 同时以摄氏度和华氏度打印当前温度\n\
    \    Serial.print(\"The temperature set point is: \");\n    Serial.print(temperatureSetPoint);\n\
    \    Serial.print(\"C which is \");\n    Serial.print(convertTemperatureToF(temperatureSetPoint));\n\
    \    Serial.println(\"F\");\n\n   if (digitalRead(temperatureTogglePin) == HIGH)\n\
    \   {\n    Serial.println(\"We have reached our set point.\");\n   }\n   else\n\
    \   {\n    Serial.println(\"Set point has not been reached.\");\n   }\n   // 休息一秒并再次检查\n\
    \   delay(1000);\n }\n```\n\n- `setPointPin` 是 `0`。\n- `temperatureTogglePin`\
    \ 是 `7`。\n- `baseVoltage` 是 `2.730f`。\n- `voltageReference` 是 `5.0f`。\n- `maxSampleCount`\
    \ 是 `1023.0f`。\n- `CtoFConversion` 是 `9.0f / 5.0f`。\n- `FtoCConversion` 是 `5.0f\
    \ / 9.0f`。\n- `CtoFDelta` 是 `32.0f`。\n\n方法声明有：\n- `getTemperature(float temperatureVoltage)`\n\
    - `convertTemperatureToF(float temperatureInCelsius)`\n- `convertTemperatureToC(float\
    \ temperatureInFahrenheit)`\n\n`getTemperature` 函数根据输入的电压值确定摄氏度温度，假设 `2.73v` 等于\
    \ `0°C`。它接收 `temperatureVoltage` 作为参数并返回实际的摄氏度温度。\n\n`convertTemperatureToF` 函数将温度从摄氏度转换为华氏度。它接收\
    \ `temperatureInCelsius` 作为参数并返回以华氏度表示的温度。\n\n`convertTemperatureToC` 函数将温度从华氏度转换为摄氏度。它接收\
    \ `temperatureInFahrenheit` 作为参数并返回以摄氏度表示的温度。\n\n`setup` 函数使用 `pinMode(temperatureTogglePin,\
    \ INPUT)`、`analogReference(DEFAULT)` 和 `Serial.begin(9600)` 配置 Arduino 的模拟输入。\n\
    \n`loop` 函数是主方法，每次 Arduino 执行主循环时都会被调用。它通过 `analogRead(setPointPin)` 读取设定点温度值，将其转换为\
    \ `setPointVoltage`，使用 `getTemperature()` 计算 `temperatureSetPoint`，并同时以摄氏度和华氏度打印结果。最后，它通过\
    \ `digitalRead()` 检查 `temperatureTogglePin` 是否为 `HIGH`。\n\n"
