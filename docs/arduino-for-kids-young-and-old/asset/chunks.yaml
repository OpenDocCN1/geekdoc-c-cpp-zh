    \ = analogRead(setPointPin);\n\n    // Convert our incoming voltage representation\
    \ to a value we can utilize\n    setPointVoltage = ((float)rawSetPointValue *\
    \ voltageReference) / maxSampleCount;\n\n    // We now have the current temperature\
    \ expressed in celsius\n    temperatureSetPoint = getTemperature(setPointVoltage);\n\
    \n    // Print out the current temperature in both C and F\n    Serial.print(\"\
    The temperature set point is: \");\n    Serial.print(temperatureSetPoint);\n \
    \   Serial.print(\"C which is \");\n    Serial.print(convertTemperatureToF(temperatureSetPoint));\n\
    \    Serial.println(\"F\");\n\n   if (digitalRead(temperatureTogglePin) == HIGH)\n\
    \   {\n    Serial.println(\"We have reached our set point.\");\n   }\n   else\n\
    \   {\n    Serial.println(\"Set point has not been reached.\");\n   }\n   // Rest\
    \ for a second and check again\n   delay(1000);\n } \n```\n\nA significant amount\
    \ of the code above is straight from the earlier example which will now be used\
    \ to monitor the set point temperature and allow us to tweak the value as the\
    \ program is executing. Once we have the set point established we can than vary\
    \ the temperature that our LM335 is reading by holding our finger on it to warm\
    \ it up or using a fan to cool it off. While I won't rehash everything that was\
    \ done before, I will highlight the main differences that were made.\n\n```\n\
    \ const int setPointPin = 0;\n const int temperatureTogglePin = 7; \n```\n\nI\
    \ changed the the temperaturePin variable name to setPointPin which better describes\
    \ what this constant variable is doing i.e. defining the pin on the Arduino® that\
    \ we will read for the set point temperature. The second constant variable is\
    \ temperatureTogglePin which is the pin on the Arduino® which we will monitor\
    \ to detect if the LM335 has reached the setPoint or not.\n\n```\n /*\n  * Setup\
    \ - main configuration point of our sketch to configure\n  *         the Arduino\
    \ for analog input\n  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\
    \n void setup()\n {\n   pinMode(temperatureTogglePin, INPUT);\n   analogReference(DEFAULT);\n\
    \   Serial.begin(9600);\n } \n```\n\nThe next major change is in the setup method\
    \ where I am now configuring the temperature toggle pin to be a digital input\
    \ pin. The method, pinMode, instructs the Arduino® to configure this pin for digital\
    \ input data. Remember that most pins on the Atmel® micro-controller, which is\
    \ what the Arduino® utilizes, can be configured to perform a number of disparate\
    \ functions. In order to use these functions, we must ensure the micro-controller\
    \ is configured properly before we start running our code.\n\n```\n /*\n  * loop\
    \ - main method which will be called each time the\n  *        Arduino goes through\
    \ its main loop to read the\n  *        setPoint temperature value and check our\
    \ digital\n  *        input pin to see if it is high or not.\n  *\n  * Params\
    \ - none\n  *\n  * Returns - nothing\n  */\n\n void loop()\n {\n    int    rawSetPointValue\
    \ = 0;\n    float  setPointVoltage = 0.0f;\n    float  temperatureSetPoint = 0.0f;\n\
    \n    // Read in the temperature value which will be in a range from 0 to 1023\n\
    \    rawSetPointValue = analogRead(setPointPin);\n\n    // Convert our incoming\
    \ voltage representation to a value we can utilize\n    setPointVoltage = ((float)rawSetPointValue\
    \ * voltageReference) / maxSampleCount;\n\n    // We now have the current temperature\
    \ expressed in celsius\n    temperatureSetPoint = getTemperature(setPointVoltage);\n\
    \n    // Print out the current temperature in both C and F\n    Serial.print(\"\
    The temperature set point is: \");\n    Serial.print(temperatureSetPoint);\n \
    \   Serial.print(\"C which is \");\n    Serial.print(convertTemperatureToF(temperatureSetPoint));\n\
    \    Serial.println(\"F\");\n\n  if (digitalRead(temperatureTogglePin) == HIGH)\n\
    \   {\n    Serial.println(\"We have reached our set point.\");\n   }\n   else\n\
    \   {\n    Serial.println(\"Set point has not been reached.\");\n   }\n   // Rest\
    \ for a second and check again\n   delay(1000);\n } \n```"
