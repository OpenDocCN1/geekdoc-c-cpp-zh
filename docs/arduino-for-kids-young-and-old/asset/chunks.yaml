    再次强调，这并不是什么高科技。我觉得它的有用之处在于，如果我添加或删除一个状态，不需要回头修改代码中的任何循环来反映添加或删除的状态。当然，例外是 `switch`
    语句，其中每个状态都已声明，因此删除或添加时必须进行更新。在这个草图中，我在各个状态之间切换，直到到达 `ActiveCommunications` 状态。一旦进入活动通信状态，我就可以从
    USB 串口读取命令，并将其发送到蓝牙®模块以传输到 OBDII 接口。然后，当返回响应时，我可以将其显示在我的电脑上。关于适用于基于 ELM 的 OBDII
    适配器的命令列表，请参阅以下链接：[ELM 数据表](http://elmelectronics.com/DSheets/ELM327DS.pdf)。


    ## SPI


    串行外设备接口（`SPI`）是一种用于设备间通信的高速串行接口。这是一个全双工接口，意味着在许多配置下它可以同时传输和接收。SPI 的一个优秀特性是它可以连接到多个设备，使用片选（chip
    select）来选择数据的接收者和/或源。片选信号会激活目标设备，允许多个设备共享同一条总线。SPI 接口由以下连接组成：


    | 信号名称 | 别名 | 用途 |

    | :--- | :--- | :--- |

    | SCLK | 无 | 同步 SPI 设备的时钟信号 |

    | SDO | MOSI, DO, SO, 等 | 从主设备到从接收器的串行数据输出 |

    | SDI | MISO, DI, SI, 等 | 从从设备设备到主设备的串行数据输入 |

    | CS | SS, STE, 等 | 从主设备发出的片选信号，用于启用即引导从设备（设备）接收数据 |


    在通常情况下，考虑到上述所有信号，你会发现 SPI 被称为四（4）线接口。在某些情况下，SPI 可能会以三（3）线配置使用，其中 `SDO` 和 `SDI`
    线合并。此外，还有片选（`CS`）线用于指示数据流的方向，以及用于保持所有内容对齐的时钟信号。在某些情况下，例如三（3）线模式，两条数据线在设备端集成在一起，而在主机系统端（在此例中为
    Arduino®），则使用电阻来连接输入和输出引脚。数据根据 SPI 总线上发出的命令进行流动。在这种情况下，主机控制器将发出读取或写入命令，然后根据写入的命令期望数据回流。最后，在某些情况下，接收设备（设备）永远不会有任何数据返回，因此通信只需要三（3）根线。


    除了上述定义的信号名称外，SPI 总线还有不同的操作模式。特别是，你可以设置通信速度、时钟信号相对于数据的极性（polarity）以及时钟相对于数据的相位（phase）。这些听起来可能很复杂，但它们基本上意味着何时捕获数据，即：在时钟信号的上升沿或下降沿触发数据读取。这被定义为相位，它取决于时钟信号的极性，也就是说在时钟为低电平或高电平时触发。欲了解完整详情请访问：[SPI
    Wiki](http://en.wikipedia.org/wiki/Serial_Peripheral_Interface_Bus)。


    下表详细列出了根据 Arduino® 文档的配置。


    | 模式 | 时钟极性 | 时钟相位 |

    | :--- | :--- | :--- |

    | 0 | 0 表示以低值为时钟基准，数据在高电平状态期间有效 | 0 表示在时钟从低到高转换时捕获数据，位于时钟高电平状态的开始 |

    | 1 | 0 表示以低值为时钟基准，数据在高电平状态期间有效 | 1 表示在时钟从高到低转换时捕获数据，位于时钟高电平状态的结束 |

    | 2 | 0 表示以高值为时钟基准，数据在低电平状态期间有效 | 0 表示在时钟从低到高转换时捕获数据，位于时钟低电平状态的开始 |

    | 3 | 0 表示以高值为时钟基准，数据在低电平状态期间有效 | 1 表示在时钟从高到低转换时捕获数据，位于时钟低电平状态的结束 |


    注：此表适用于 Atmel® 微控制器以及一些其他控制器，但可能根据你使用的微控制器而有所不同。


    另一个需要考虑的因素是沿 SPI 总线传输数据位的顺序。因为它是串行的，位必须按顺序流动，且顺序可能很重要。在查看一个字节的数据时，有一个有效位（即高位，最有效位）和一个无效位（即最低有效位）。SPI
    总线可以按最有效位顺序传输数据（即先发送最大的位），也可以按最低有效位顺序发送（即先发送最低有效位）。通常情况下你会先发送最有效位数据，但你将需要注意通过
    SPI 通信的任何设备的顺序。在某些情况下，确定正确的顺序可能是困难的，必须进行一些尝试和错误来确定正确的设置。


    SPI 谜图中最后一个可配置的部分是时钟从低电平到高电平转换的速度。这是设备的频率，可以达到 25 MHz，取决于设备。对于 Arduino® 而言，SPI
    总线的速度是灵活的，允许与各种设备接口。以下是假设时钟为 16 MHz 的有效分频器：


    | 名称 | 数值 | 速度 |

    | :--- | :--- | :--- |

    | SPI_CLOCK_DIV2 | 2 | 8 MHz |

    | SPI_CLOCK_DIV4 (默认值) | 4 | 4 MHz |

    | SPI_CLOCK_DIV8 | 8 | 2 MHz |

    | SPI_CLOCK_DIV16 | 16 | 1 MHz |

    | SPI_CLOCK_DIV32 | 32 | 500 kHz |

    | SPI_CLOCK_DIV64 | 64 | 250 kHz |

    | SPI_CLOCK_DIV128 | 128 | 125 kHz |


    Arduino® DUE 稍微不同之处在于你需要指定从设备选择引脚和分频值（0 到 255 之间的任何值）。DUE 的默认值为 21，这会将速度设置为 4
    MHz，这是其他 Arduino 板板的默认值。


    因此，SPI 在连接线较少方面似乎非常简单，并且有现成的库供接口使用。然而，我们应该在哪里使用它呢？SPI 总线有很多用途，支持它的设备也很多，这在微控制器数据线有限时非常有益。在我们的用例中，我们将与数字电位器接口，这将允许我们控制三色
    LED 显示的光强度。


    #### 所需组件


    *   Arduino 板板

    *   (2) 150 Ohm 电阻

    *   270 Ohm 电阻

    *   2N2222A 三极管

    *   标准 5mm 发光二极管 (LED)

