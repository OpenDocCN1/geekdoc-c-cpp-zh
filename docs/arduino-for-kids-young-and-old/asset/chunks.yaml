  trans: "\n注释块中其他值得注意的内容是 `Params` 和 `Returns` 句。第一行告诉代码的查看者需要向方法传递哪些参数。如上所示，并不是所有方法都需要参数。第二行指示了在方法完成后可能预期从方法返回的值。在这种情况下，没有返回任何内容。稍后，我们将探索既接收参数又向调用它的应用程序返回值的方法。这种约定是我最经常使用的习惯，这也是我倾向于在函数（即方法）的开头使用单行注释的原因之一。即使没有传递任何参数，也没有返回值，但把它们明确写出来也无益处。\n\
    \n注释块之后是方法名，它声明了返回值的类型（如果有的话），并详细说明了应用程序调用该方法时需要提供的任何参数。在这种情况下，该方法不接受任何参数，也不返回任何值。这通过单词\
    \ `void` 来指示。接下来是左大括号 `{`，它表示方法定义的开始。还有一个右大括号 `}`，表示方法定义的结束。左、右大括号不仅不仅限于方法定义，还将将用于后续将探索的其他结构中。现在我们进入实际代码。第一行如下：\n\
    \n```\n Serial.begin(9600); \n```\n\n这段代码是 Arduino® 平台的一部分，它调用了 `Serial` 对象的 `begin`\
    \ 方法。对象是相关方法和变量的集合，它们共同工作以执行某项任务。C++ 中对象的术语是 `class`（类），它是 C++ 以及泛面向对象编程的基础。随着本书的进行，我们将查看各种对象和结构。如你所见，`begin`\
    \ 方法接受一个参数，在当前情况下该参数值为 `9600`。此值代表了 Arduino® 串口运行的速度。虽然速度可以是多个值 [6]，但 `9600` 是我容易记住并通常使用的值。在速度方面，这个值通常被给为波特率，即每秒传输的符号数。这个值恰好与比特率相同，导致导致传输速度为每秒\
    \ `9600` 位。然而，最终的数据速率会略低，因为某些位被用于指示每个数据包的开始和结束。主要，当你打开串口监视器应用程序（如 Arduino® 软件自带的程序）时，你需要确保它被设置为与速程图中指定的相同速度。那么，我们为什么要启动串口呢？通常，这是调试应用程序最简单的方法。你上传代码，它执行，你监控结果。当运行不符合预期且你需要深入研究并找出问题时，这非常有用。如果担心应用程序速度，一旦完成项目，你可以移除所有这些代码，从而获得更小的包和更快的执行时间。但需要注意的几点是，对于时间敏感的应用，这段代码的包含或排除可能会改变你的结果。此外，放置任何类型的调试行时都要小心，因为你可能会得到比你需要使用的更多的信息。\n\
    \n```\n pinMode(13, OUTPUT); \n```\n\n第二行代码同样是 Arduino® 平台的标准部分，将数字引脚 `13` 配置为输出。在\
    \ Arduino® 上，有一个 LED 连接到数字引脚 `13`，它可以被用作某种视觉指示器。第一个参数是即将被配置的引脚，而第二个参数是模式，在当前情况下是\
    \ `OUTPUT`。`OUTPUT` 单词是由 Arduino® 平台定义的常量值。通常情况下，创建一个常量值来指定特定引脚的作用，而不是原始数字，是一个良好的做法。在这种情况下，我在代码中保留了数字，是为了突出我正在使用的引脚并保持速图简单。在未来的示例中，我将对这些值使用更有意义的标识符。\n\
    \n### Loop\n\n`loop` 是你的速图中所有主要处理发生的地方。该方法将在 `Setup` 方法完成后立即执行，并在程序的整个生命周期内持续执行，也就是说直到你关闭\
    \ Arduino®。虽然这降低了代码的复杂度，但在编写 `loop` 代码时有几点需要注意。要记住的第一点是，`loop` 被调用的速度取决于微控制器的速度以及你的\
    \ `loop` 内部执行的工作量。另一个注意是，如果你需要从用户那里接收输入，可能需要在多次 `loop` 循环中完成，而不是等待输入到达，否则你将阻止其他活动的发生。基于上述代码，我将演示周期性开启关闭引脚\
    \ `13` LED 的基本速图，使其闪烁。\n\n```\n /*\n  * loop - 主方法，每当 Arduino\n  *        进入其主循环时就会被调用\n\
    \  *\n  * Params - 无\n  *\n  * Returns - 无\n */\n\n void loop()\n {\n   digitalWrite(13,\
    \ HIGH);\n   delay(500);\n   digitalWrite(13, LOW);\n   delay(500);\n   Serial.println(\"\
    Led 13 has been toggled on and off.\");\n } \n```\n\n再次，该方法以注释块开始，描述了方法的意图，以及方法声明，指示了没有传递参数，且方法不返回任何值。\n\
    \n```\n digitalWrite(13, HIGH); \n```\n\n这第一行代码调用了 `digitalWrite` 方法，它指示微控制器将\
    \ `13` 的输出值设置为 `HIGH`。`HIGH` 单词是另一个预定义值，你可以根据需要在整个速图中使用。由于我们正在向此引脚写入数字值，它只能是两个值之一：`LOW`\
    \ 或 `HIGH`。这些值在设置为 `LOW` 时对应 0 伏，在设置为 `HIGH` 时对应 5* 伏。这样，连接到引脚 `13` 的 LED 将开启，因为现在该引脚发出了正电压。当设置为\
    \ `LOW` 时，电压被设置为 0 伏，导致 LED 。\n\n* Arduino® UNO 运行电压为 5 伏，因此设置为 `HIGH` 时的值为 5\
    \ 伏。其他板卡，如 [Arduino Due](http://arduino.cc/en/Main/ArduinoBoardDue)，运行电压较低低（例如\
    \ 3.3v），因此设置为 `HIGH` 时的输出电压将等同于该较低电压。\n\n在使用整体电压较低的板卡时，必须小心书中推荐的电阻和其他元件已进行相应的调整。由于电压较低，产生的电流也会较小，因为电流等于电压除以电阻。虽然这在大多数情况下没有问题，但你还应该验证每个输出引脚能够提供的最大电流，因为它们在不同的微控制器设备之间可能不同。\n\
    \n```\n delay(500); \n```\n\n"
- fmt: "\nThe `delay` method is used to stop execution for a period of time. When\
    \ I say stop execution, I really mean stopping execution of your code. The micro-controller\
    \ is still processing data however your code will be paused until the `delay`\
    \ method is finished. For this example, using `delay` is fine however later on\
    \ we will explore better approaches to handle this. So why would I want a `delay`\
    \ in my code anyways? Remember that the `loop` method is executed quite frequently\
    \ and we want to be able to see the LED turn on an off. The `delay` that is specified\
    \ is 500. This value is expressed in milliseconds which is to say how many 1/1000's\
    \ (0.001) of a second the micro-controller should pause. For the above example,\
    \ we are pausing for 500 milliseconds which is 1/2 second. The end result is the\
    \ LED will turn on for 1/2 second and then back off for another 1/2 second or\
    \ so. I say so because I have an additional line of code after the second `delay`\
    \ which will take some time to execute and will skew the time. I could try and\
    \ compensate by reducing the second `delay` to 499 milliseconds however that would\
    \ be a guess unless I knew for sure how long the last line of code would take\
    \ to execute. I would also have to factor in which micro-controller was executing\
    \ the code along with the speed of that micro-controller. All in all it would\
    \ be a significant challenge to do correctly. And while were are speaking of the\
    \ last line of code, it's purpose is to just give us feedback that the `loop`\
    \ is working properly and our board is functional. Typically I wouldn't do this\
    \ as it will just fill up the communications buffer and if I didn't have the `delay()`,\
    \ we would quickly fill our monitor buffer with the same not so helpful information.\
    \ This is an example of where you would want to be careful with where you place\
    \ your debugging i.e. informational output data.\n\n```\n Serial.println(\"Led\
    \ 13 has been toggled on and off.\"); \n```\n\nThe `Serial` class has a number\
    \ of methods of which one of them is shown in the above code snippet. This particular\
    \ version is for printing out a full line of text including the line feed so the\
    \ next line will start on a new line. There is a related method `Serial.print`\
    \ that will print out text much the same way however will not include a line feed.\
    \ It is useful when you want to print out a number of items all on one line such\
    \ as:\n\n```\n Serial.print(\"Led: \");\n   Serial.print(13);\n   Serial.println(\"\
    \ has been toggled on and off.\"); \n```\n\nThe above code will result in the\
    \ same output however I could have easily replaced the number 13 with a variable\
    \ in order to use this code for any pin.\n\n### Summary\n\nSo pulling it all together,\
    \ an Arduino® sketch consists of two methods, the `setup` and `loop` methods.\
    \ The `setup` method is used to configure your Arduino® for how it should operate\
    \ while the `loop` method is where all of the work will be done for the life of\
    \ the application. In addition, there are built in constants and classes such\
    \ as the `Serial` class which can be used to assist with debugging or relaying\
    \ information to the user.\n\n![chapter end graphic](images/00001.jpeg)\n\n# Input\n\
    \n## Monitoring our surroundings\n\nNow that we have the Ardunio® setup and ready,\
    \ we can dig into more interesting topics. The first of these is the input system\
    \ that allows us to monitor our surroundings utilizing various analog and digital\
    \ devices. In the following sections we will look at analog and digital inputs\
    \ from a variety of devices which allow us to interpret our surroundings and act\
    \ upon the various events when they happen.\n\n### Analog Input\n\nThe Arduino®\
    \ has several analog pins that can be used to read in the voltage level of a particular\
    \ device to determine its value. The actual number of pins available to you will\
    \ be dependent upon which AVR micro-controller is built into the board you have\
    \ purchased. Regardless though, the basic operation will be the same. The analog\
    \ input pins have a 10 bit resolution which is to say that each pin can detect\
    \ up to 1024 levels of voltage. The values are based on ground as being the bottom\
    \ i.e. no voltage coming in and up to five (5) volts which is the maximum voltage\
    \ for the micro-controller. You can also limit the top of the voltage range to\
    \ a value less then 5 volts however for the following examples that will not be\
    \ necessary. When the analog input is read in, it is actually using a scale much\
    \ like a balance scale to determine the value. Imagine you have a basement that\
    \ is flooding and there is a staircase coming up to the first floor. One thing\
    \ you might want to know is how deep the water is and how fast is it rising? For\
    \ the depth of the water it would be very easy if you happened to know how far\
    \ apart each step on the staircase is. In this case, you could simply count how\
    \ many steps were covered in water and do some simple arithmetic to determine\
    \ the waters depth. Oddly enough the Arduino® is doing something very similar.\
    \ It has a built in scale that compares its internal value with the value coming\
    \ in on the analog pin. Each cycle, the device will increase the voltage and compare\
    \ it to the incoming voltage. It knows how many cycles it has been since it started\
    \ the comparison so once they are equal, the micro-controller knows the value\
    \ of the external voltage. The micro-controller has 10 bits of resolution which\
    \ means that it can count all the way from zero (0) to 1023 to find a value matching\
    \ that which is being read at the analog input pin. Using the above analogy, it\
    \ is like the micro-controller has a staircase with 1024 steps counting the floor\
    \ as step number one (1). In the case, step number one is equal to zero (0) volts\
    \ and step 1024 is equal to five (5) volts. As you can see, there is a fair amount\
    \ of precision when using the 10 bit analog to digital converter. The downside\
    \ to this type of converter is that it takes time to count from zero (0) up to\
    \ the value that represents the incoming voltage. Just like the rate that the\
    \ water rises in the basement, the comparison of each voltage value to the next\
    \ highest value takes time as the micro-controller determines the equivalent voltage.\
    \ This can be as much as 260 microseconds for the given device. In human time,\
    \ this is about 1/4 of a millisecond which in turn is 1/1000's (0.001) of one\
    \ second. When looked at in this way, it is plenty fast enough for what we want\
    \ to do. Speaking of what we want to do, the first thing is to determine what\
    \ the temperature in the room is.\n\n* For the Arduino UNO and MEGA, the maximum\
    \ voltage that can be read in is 5 volts however on some systems, the maximum\
    \ may be lower such as 3.3 volts or even 1.8 volts.\n\n#### Temperature Reading\n\
    \nThe first thing we will look at is how to read in a temperature value and then\
    \ be able to react to it based on its value and/or delta from it's initial value.\
    \ Luckily there are specific devices available that will increase in voltage as\
    \ the surrounding temperature rises. Knowing this, we can connect one of these\
    \ devices to our Arduino® and read in the value to determine the current temperature.\n\
    \n##### Required Components\n\n*   Arduino® Board\n\n*   4.7K Ohm Resistor\n\n\
    *   LM335 temperature sensor[[7](#part0012_split_001.html_Ref7)] or similar such\
    \ as the NTE7225[[8](#part0012_split_001.html_Ref8)]\n\n##### Tools\n\n*   breadboard\n\
    \n*   jumper wires\n\n*   voltage meter\n\n##### Schematic\n"
