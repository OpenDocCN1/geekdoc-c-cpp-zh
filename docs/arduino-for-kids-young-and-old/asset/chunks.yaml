    \ and Old ©2014 Daniel W. Milligan\n\n所有内容版权所有 2014，Daniel Milligan。保留所有权利。未经出版者明确许可，本书或其包含的文件任何部分不得以任何形式或手段进行法律上的制作、复制或传输。\n\
    \n由 Daniel Milligan 于 2014 年出版，另有说明外，所有照片和图像的版权均属于 Milligan Photography。\n\n责任限制与免责声明：出版者在准备本书时已尽最大努力确保内容的准确性，然而，此处提供的信息均按“原样”提供，且不提供任何保证。Daniel\
    \ Milligan 等人对本书内容的准确性或完整性不作任何陈述或保证，并特别否认任何关于商品销性或适用于特定用途的暗示保证，且在任何情况下不对任何利润损失或其他任何商业损害承担责任，包括但不限于特殊的、间接的、后果性的或其他损害。\n\
    \n商标：本书识别了已知或被怀疑为其各自持有者的商标、注册商标或服务标记的产品名称和服务。它们在书中仅以编辑方式使用。虽然已尽力妥善识别这些项目，但存在某些项目可能未被识别为此类，Daniel\
    \ Milligan 无法保证这些信息的准确性。书中对术语的使用不应视为影响任何商标、注册商标或服务标记的有效性。Daniel Milligan 与书中提到的任何产品或供应商均无关联，除非是\
    \ Milligan Photography 的所有者。\n\n```\n2014 年第一版\nISBN-10: 0985855630\nISBN-13:\
    \ 978-0-9858556-3-5 \n```\n\n感谢我所有的朋友和家人，特别是我的妻子 Sylvine 多年来对我的支持和爱。\n\n本电子书末尾链接的资源在编写本电子书时是有效的，包含了对入门开源硬件和业余编程/工程的人有帮助的各种工具链接。\n\
    \n![章节结束图形](img/00001.jpeg)\n\n# 引言\n\n## 开始使用 Arduino®\n\n首先，我将会有意地或无意地做出一些假设。我经常定期处理其中的许多技术，可能会无意中漏掉某些内容。这并不是因为我觉得它不重要或不需要，而是因为我可能认为它不需要解释或不需要额外的细节。话若如此，如果您有任何问题，请随时通过邮件联系\
    \ Dan 与我联系。\n\n本书旨在那些想要开始使用开源硬件和软件，以便使用随手的工具和组件构建自己的创作作品的人。虽然我会引导你查看特定的链接以了解更多关于各种软件和/或硬件模块，但我不会深入探讨过多的编程基础\
    \ 101 或硬件设计 101。我的假设是，你要么在该领域已有某些知识，要么愿意在边做边学。我将尝试涵盖足够详细的内容，让你不需要挖掘得太深就能获得额外信息，但这会因人而异。正如书名所示，本书侧重于使用\
    \ `Arduino®` 平台开发。虽然许多示例和整体概念适用于多种微控制器，但我将专注于 `Arduino®` 系列模块，特别是围绕 `Atmel® AVR`\
    \ 系列设备构建的模块。\n\n以下是我将使用的一些基础术语，你应该对此有所了解。\n\n### 原型 (Prototype)\n用于证明理论或实现想法的实验性设计（软件/硬件）。\n\
    \n### Arduino®\n用于原型制作的开源硬件/软件解决方案。\n\n### 扩展板 (Shield)\n与 `Arduino®` 配合使用的附加卡，即扩展板。也可以称为子板。\n\
    \n### 直流 (DC)\n直流电，大多数原型板所使用的电流。\n\n### 交流电 (AC)\n交流电，进入房屋并输送到房屋内每个插座的标准电流*\n\n\
    ### Java™\n一种最初由 `Sun®` 公司设计的高级编程语言环境，现在由 `Oracle®` 所有。\n\n### C\n一种在贝尔实验室设计的的高级编程语言。\n\
    \n### Sketch (程序)\n`Arduino®` 的术语，用于描述在 `Arduino®` 上执行的代码。\n\n### USB\n通用串行总线\
    \ - 鼠标、键盘、读器等外围设备的标准连接。\n\n### LED\n发光二极管。\n\n### 编译器 (Compiler)\n一种从 `sketch`\
    \ 等源文件生成可执行代码的软件应用程序。\n\n### 变量 (Variable)\n`sketch` 中的数据类型，可以赋值。`变量`可以是不同类型，以表示不同的数据类型，如整数、字符和浮点数。\n\
    \n### 有符号值 (Signed value)\n可以同时代表正数和负数的数值。\n\n### 无符号值 (Unsigned value)\n只能代表正数的数值。\n\
    \n### 参数 (Parameter)\n程序执行期间传递给方法的值。\n\n### 返回值 (Return Value)\n方法在处理完成后后返回的值。\n\
    \n### 对象 (Object)\n在 `Java™` 和 `C++` 等高级编程语言中使用的软件结构。\n\n### 波特率、波特率 (Baud, Baud\
    \ Rate)\n通信设备运行的速度。\n\n* 由于我住在美国，进入每个房屋的典型 `AC` 电流在 120V 范围内，而在欧洲，典型值则在 240V 范围内。虽然大多数购买的物品通过\
    \ 120V `AC` 运行，但实际上它们通过 `DC` 运行，内部具有将 `AC` 转换为 `DC` 的变压器。\n\n对于任何项目，拥有正确的工具是有益的。软件和硬件也是如此。在开始之前，你需要确保拥有以下物品：\n\
    \n- 一台运行良好的电脑（`Macintosh®`、`Windows®` 或 `Linux®`）\n- 一个可用的 `USB` 主机端口。该端口应该是 `A`\
    \ 类型，类似于：![USB 端口](img/00002.jpeg)\n- 一个整洁的工作区域\n- 可以访问互联网以查询信息\n- `Java 运行时环境`，可以[在此下载](http://java.com/en/download/index.jsp)\n\
    - `Arduino®` 开发环境，可以[在此下载](http://arduino.cc/en/Main/Software)\n- 一个 `Arduino®`\
    \ 套件，例如来自 [Maker](http://www.makershed.com/Getting_Started_with_Arduino_Kit_V3_0_p/msgsa.htm)\
    \ 的那一个\n- 实验板用于连接电路的各个部分和 `Arduino®`\n- 能够提供 `2 安培` 电的 `5v` 电源，例如：[5v 2A 电源](http://www.adafruit.com/products/276)。\n\
    -舒适舒适舒适\n\n电子元件对静电非常敏感。这意味着你身上积累的任何静电在接触它时可能会损坏元件（如微控制器），将能量从你身上转移到元件中。在某些情况下，这种损坏是无法检测到的，元件大多数时候可以工作，但并非总是如此。把它想象成碗上的裂缝。它大多数时候没问题，但偶尔会有液体漏出来。这时，如果液体是热的，你会被烫伤。\n\
    \n"
- fmt: '

    *   a solder sucker for removing the excess solder applied with the soldering
    iron

    *   solid strand wire in the 22 gauge (AWG) area of thickness

    *   wire strippers

    *   wire cutters

    *   small pliers

    *   a multimeter for measuring the voltage at a given point and checking continuity
    within a circuit. ![Multimeter image](images/00003.jpeg)


    Finally a list of some items that you will probably not need however knowing they
    exist is always good.


    *   a logic analyzer for debugging protocol issues such as those that might come
    up when using serial peripheral interfaces (SPI) among other things

    *   an oscilloscope for debugging issues related to communication signals or Pulse
    Width Modulation (PWM) output![Oscilloscope image](images/00004.jpeg)


    Most if these items are available at your local [Radio Shack](http://www.radioshack.com)
    , [Fry''s](http://www.frys.com), or whichever local electronics store catering
    to hobbyists in your corner of the world. In some cases, the devices used will
    only be available from on-line merchants which I will attempt to provide various
    links to companies I have dealt with successfully.


