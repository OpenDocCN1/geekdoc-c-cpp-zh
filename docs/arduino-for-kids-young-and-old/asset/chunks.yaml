    Again this isn''t rocket science by any means. I find it useful in that if I add
    or remove a state, I do not have to go back through my code changing any loops
    to reflect the added or removed state. The exception of course would be a switch
    statement where each state is declared so a removal or addition would have to
    be updated. In this sketch I transition through my states until I reach the `ActiveCommunications`
    state. Once in active communications I can read in commands from the USB serial
    port and send them to the Bluetooth® module for transmission to the OBDII connector.
    Then when a response is sent back, I can display it back on my computer. For a
    list of commands that can be used with an ELM based OBDII adapter, see the following
    link: [ELM Data Sheet](http://elmelectronics.com/DSheets/ELM327DS.pdf).


    ## SPI


    Serial Peripheral Interface, (`SPI`), is a high speed serial interface used to
    communicate between devices. This is a full duplex interface meaning that it can
    transmit and receive at the same time in a number of configurations. A nice feature
    of SPI is that it can be connected to a number of devices where a chip select
    is used to select the recipient and/or source of the data. The chip select signal
    activates the desired device allowing multiple devices to share the same bus.
    The SPI interface consists of the following connections:


    | Signal Name | Alternate Names | Purpose |

    | :--- | :--- | :--- |

    | SCLK | None | The clock signal to synchronize the SPI devices |

    | SDO | MOSI, DO, SO, etc. | Serial data out from the primary device to the subordinate
    recipients |

    | SDI | MISO, DI, SI, etc. | Serial data in to the primary device from the subordinate
    devices |

    | CS | SS, STE, etc. | Chip select from the primary device which enables i.e.
    directs the subordinate device(s) to accept the data |


    In general usage, you will find SPI referred to as a four (4) wire interface given
    all of the signals above. In some cases, SPI may be used in a three (3) wire configuration
    where the `SDO` and `SDI` lines are combined. In addition there will be the chip
    select (`CS`) line indicating the direction of data flow along with the clock
    signal to keep everything aligned. And in some cases, i.e. the three (3) wire
    mode, the two data lines are integrated together at the device and on the host
    system i.e. the Arduino® in this case, a resistor is used to connect the input
    and output pins. The data flows according to commands issued on the SPI bus. In
    this case, the host controller will issue a read or a write command and will then
    expect the data to flow back based on the command written. And finally in some
    cases, there is never any data coming back from the recipient device(s) resulting
    in only three (3) wires needed to perform communications.


    In addition to the signal names defined above, there are different modes of operation
    of the SPI bus. In particular you can set the speed of the communications, the
    polarity of the clock signal in respect to the data along with the phase of the
    clock in respect to the data. These may sound complicated however it basically
    means when to capture the data i.e. trigger the reading of the data on the rising
    edge of the clock signal or the falling edge. This is defined as the phase and
    it will be dependent upon the polarity of the clock signal which is to say trigger
    when the clock is either low or the clock is high. For complete details visit:
    [SPI Wiki](http://en.wikipedia.org/wiki/Serial_Peripheral_Interface_Bus).


    The following table details the configurations per the Arduino® documentation.


    | Mode | Clock Polarity | Clock Phase |

    | :--- | :--- | :--- |

    | 0 | with 0 indicating a low value as the base of the clock and data valid during
    its high value state | with 0 indicating data is captured when the clock transitions
    from low to high which is at the beginning of the clock high value state |

    | 1 | with 0 indicating a low value as the base of the clock and data valid during
    its high value state | with 1 indicating data is captured when the clock transitions
    from high to low which is at the end of the clock high value state |

    | 2 | with 0 indicating a high value as the base of the clock and data valid during
    its low value state | with 0 indicating data is captured when the clock transitions
    from low to high which is at the beginning of the clock low value state |

    | 3 | with 0 indicating a high value as the base of the clock and data valid during
    its low value state | with 1 indicating data is captured when the clock transitions
    from high to low which is at the end of the clock low value state |


    Note: This table is valid for Atmel® micro-controllers and some others but may
    be different depending on what micro-controller you are using.


    Another consideration to take into account is the ordering of the data bits going
    along the SPI bus. Because it is serial, the bits will have to flow in order and
    the order can be important. When looking at a byte of data, there is a significant
    bit i.e. the high bit (most significant bit) and a low bit i.e. the least significant
    bit. The SPI bus can transfer data in most significant bit order where the largest
    bit is sent first or it can send it in least significant bit order where the lowest
    significant bit is sent first. Typically you will be sending data most significant
    bit first however you will want to be aware of the order of any devices that you
    communicate with over SPI. In some cases it can be difficult to determine the
    proper order and some trial and error will have to be done to determine the proper
    settings.


    The last configurable piece of the SPI puzzle is the speed at which the clock
    transitions from low to high. This is the frequency of the device and can be as
    fast as 25 MHz and perhaps more depending on the device. The speed of the SPI
    bus in terms of the Arduino® is flexible to allow interfacing with a variety of
    devices. The following are the valid clock dividers for the SPI assuming a 16
    MHz clock.


    | Name | Value | Speed |

    | :--- | :--- | :--- |

    | SPI_CLOCK_DIV2 | 2 | 8 Mhz |

    | SPI_CLOCK_DIV4 (default value) | 4 | 4 Mhz |

    | SPI_CLOCK_DIV8 | 8 | 2 Mhz |

    | SPI_CLOCK_DIV16 | 16 | 1 Mhz |

    | SPI_CLOCK_DIV32 | 32 | 500 Khz |

    | SPI_CLOCK_DIV64 | 64 | 250 Khz |

    | SPI_CLOCK_DIV128 | 128 | 125 Khz |


    The Arduino® DUE is a little different in that you specify the slave select pin
    and the divider value which is any value between 0 and 255. The default value
    for the DUE is 21 which sets the speed to 4 Mhz which is the default of the other
    Arduino® boards.


    So SPI seems to be fairly straight forward in terms of a small number of wires
    to connect along with a ready to use library to interface with it. However, where
    would we use it? There are any number of uses for the SPI bus and any number of
    devices that support it which can be beneficial when the number of data lines
    on your micro-controller is limited. For our use case, we will be interfacing
    to a digital potentiometer which will allow us to control the intensity of light
    being displayed by our tricolor LEDs. A lot of LED''s that are available control
    brightness by using Pulse Width Modulation (PWM) however that is a simulation
    by pulsing the LED on and off real quickly to trick your eye into seeing a dimmer
    color. Using a potentiometer will limit the amount of voltage being dropped across
    the LED therefore reducing the amount of current flowing through the LED resulting
    in a lower intensity glow.


    #### Required Components


    *   Arduino® Board

    *   (2) 150 Ohm Resistor

    *   270 Ohm Resistor

    *   2N2222A Transistor

    *   Standard 5mm red light emitting diode (LED)

