    In general, if there is a task you need to accomplish, there is probably a shield
    out there ready to go to do it. From communications, to motor controls, to sensor
    reading, there are shields that will accomplish what you need. When that doesn''t
    work, the prototyping kits that are available are a nice and easy way to build
    up an interface circuit to try out your idea before developing a PCB. In addition
    to the shields that are out there, most of them come with sample code that you
    can use in your own projects as is or as a starting point for something bigger
    and better. The possibilities are really endless.


