  trans: "\n\n对于此电路，你需要从 Arduino® 输出 5 伏特电压到 `4.7K Ohm` 电阻的第一个引脚。`4.7K Ohm` 电阻的第二个引脚连接到\
    \ `LM335` 的引脚二 (2)。`LM335` 的第三个引脚通过 Arduino® 连接到地。最后一根线从 `LM335` 的引脚二 (2) 连接回\
    \ Arduino® 的模拟输入零 (0)，以便读取 `LM335` 上与温度相关的电压降。![LM335 温度传感器电路](img/00018.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 图片由：[Fritzing](http://fritzing.org/)\
    \ 创建\n\n## 软件\n\n以下是读取 `LM335` 模拟电压并将其显示在串口中以供查看的代码。一旦我们的电路运行正常并获取了温度值，我们就可以进一步增强软件和硬件以执行一些实用的功能。\n\
    \n在该程序（sketch）中，我使用了著名的公式将摄氏度转换为华氏度，以及从华氏度转换为摄氏度。这些公式如下：\n\n```\n Celsius = ((Fahrenheit\
    \ - 32) x 5) / 9\n Fahrenheit = ((Celsius x 9) / 5) + 32 \n```\n\n```cpp\n /*\n\
    \  * The temperature pin 是读取来自 LM335 输入的引脚。\n  * The base voltage 是设备 (LM335)\
    \ 在 0°C 时的测量电压\n  * The voltage reference 是模拟输入引脚上可以读取的最大电压\n  * The max sample\
    \ count 是模拟输入引脚上可以到的最高值，它等于电压参考值\n  * The c to f conversion 是著名的公式：将摄氏度温度乘以 9\
    \ 然后除以 5\n  * The f to c conversion 是著名的公式：将华氏度温度乘以 5 然后除以 9\n  * The c to f delta\
    \ 是冰点温度时摄氏度和华氏度之间的差值\n  */        \n const int temperaturePin = 0;\n const float\
    \ baseVoltage = 2.730f; /* 0°C 时为 2.730V */\n const float voltageReference = 5.0f;\n\
    \ const float maxSampleCount = 1023.0f;\n const float CtoFConversion = 9.0f /\
    \ 5.0f;\n const float FtoCConversion = 5.0f / 9.0f;\n const float CtoFDelta =\
    \ 32.0f;\n\n /*\n  * 方法声明\n  */\n\n float getTemperature(float temperatureVoltage);\n\
    \ float convertTemperatureToF(float temperatureInCelsius);\n float convertTemperatureToC(float\
    \ temperatureInFahrenheit);\n\n /*\n  * getTemperature - 根据输入的电压值确定摄氏度温度\n  *\
    \         假设 2.73v 等于 0°C\n  *\n  * Params - temperatureVoltage - 代表温度的输入电压\n\
    \  *\n  * Returns - float - 根据输入电压的实际摄氏度温度\n  */\n\n float getTemperature(float\
    \ temperatureVoltage)\n {\n   float currentTemperature = 0.0f;\n\n   // 根据数据手册，每\
    \ 10 mv 等于 1 °K - 0°C 是 273°K 等于 2.73v\n   // 温度放大了 100 倍以便从开尔度转换为摄氏度比例\n   currentTemperature\
    \ = (temperatureVoltage - baseVoltage) * 100;\n\n   return currentTemperature;\n\
    \ }\n\n /*\n  * convertTemperatureToF - 将温度从摄氏度转换为华氏度\n  *\n  * Params - temperatureInCelsius\
    \ - 输入的摄氏温度\n  *\n  * Returns - float - 以华氏度表示的温度\n  */\n\n float convertTemperatureToF(float\
    \ temperatureInCelsius)\n {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature\
    \ = (temperatureInCelsius * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n\
    \ }\n\n /*\n  * convertTemperatureToC - 将温度从华氏度转换为摄氏度\n  *\n  * Params - temperatureInFahrenheit\
    \ - 输入的华氏温度\n  *\n  * Returns - float - 以摄氏度表示的温度\n  */\n\n float convertTemperatureToC(float\
    \ temperatureInFahrenheit)\n {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature\
    \ = (temperatureInFahrenheit - CtoFDelta) * FtoCConversion;\n\n   return convertedTemperature;\n\
    \ }\n\n /*\n  * Setup - 我们程序的主配置点，用于配置\n  *         Arduino 的模拟输入\n  *\n  * Params\
    \ - 无\n  *\n  * Returns - 无\n  */\n\n void setup()\n {\n   analogReference(DEFAULT);\n\
    \   Serial.begin(9600);\n }\n\n /*\n  * loop - 每当 Arduino 运行主循环时调用的主方法\n  *  \
    \      用于读取当前的温度值\n**\n  * Params - 无\n  *\n  * Returns - 无\n  */\n\n void loop()\n\
    \ {\n   int    temperatureValue = 0;\n   float  currentTempVoltage = 0.0f;\n \
    \  float  currentTemperature = 0.0f;\n\n   // 读取温度值，其范围在 0 到 10 之间\n   temperatureValue\
    \ = analogRead(temperaturePin);\n\n   // 将我们的输入电压转换为摄氏度\n   currentTemperature\
    \ = getTemperature(currentTempVoltage);\n\n   // 打印以摄氏度和华氏度表示的当前温度\n   Serial.print(\"\
    The current temperature is \");\n   Serial.print(currentTemperature);\n   Serial.print(\"\
    °C which is \");\n   Serial.print(convertTemperatureToF(currentTemperature));\n\
    \   Serial.println(\"°F\");\n\n   delay(1000);\n }\n```\n\n## 常量\n\n在上面的代码段中，我将每个变量声明为\
    \ `const`，表示该值在程序的生命周期内将保持不变。基本上，我是在告诉编译器，我想读取存储在变量中的值，但不想在程序的生命周期内通过写入来更改它。鉴于我使用的值类型，没有理由在程序执行期间更改它们。我对这些变量的主要目标是为值分配人类可读的名称，以便我的程序更容易理解。正如第二部分所示，我可以使用\
    \ `define` 来声明这些常量，这也会使我的代码具有可读性和维护性。然而，这样做会导致我丢失每个值的类型信息，这对于作为开发者的你可能感兴趣也可能无关。相反，使用\
    \ `#define` 可以减少程序占用的 RAM 内存。\n\n"
- fmt: "\nAnother thing you may have noticed is that for every variable of type `float`,\
    \ I added an `f` to the end of the declaration. This is called a suffix which\
    \ I tend to use on any value I assign to a `float`. By default, the compiler will\
    \ consider a decimal value of type `double` and therefore convert the value from\
    \ `double` to `float` when it builds the application from the sketch. For the\
    \ Arduino® this isn't really a problem given `float`s and `double`s are the same\
    \ thing. On systems where the `double` is indeed different, the compiler may generate\
    \ a compilation error as it will appear that you are trying to assign a `double`\
    \ value to a `float` variable. That would be the best case as you will at least\
    \ get a chance to look at it and determine if there is a mistake in your code\
    \ or not. Some compilers may automatically convert the value to `float` for you\
    \ resulting in the possibility of a loss of precision.\n\n## Method Declarations\n\
    \nThe next portion of my sketch consists of the method declarations or function\
    \ prototypes as they would be named in the C language. These declarations inform\
    \ the compiler of what methods will be available for use along with what types\
    \ of variables are passed into the method when it is called along with the type\
    \ of value that is returned if any. While technically you do not have to give\
    \ the variables i.e. parameters names in the method declaration, it is good practice\
    \ to do so in order for someone looking at the code to better understand the values\
    \ being passed into the method. The only exception to this is the `setup` and\
    \ `loop` methods which are declared for you outside of your sketch.\n\n```\n float\
    \ getTemperature(float temperatureVoltage);\n float convertTemperatureToF(float\
    \ temperatureInCelsius);\n float convertTemperatureToC(float temperatureInFahrenheit);\
    \ \n```\n\nIn this sketch, I have declared three methods that I may want to use.\
    \ In the end I am only going to use two of them however I declared all three for\
    \ completeness. Because I am going to be looking at values that change in the\
    \ order of micro-volts, I will need a data type that can represent a decimal value\
    \ such as a `float`. The first will convert the raw voltage reading into a temperature\
    \ in celsius while the other two will convert temperatures between Fahrenheit\
    \ and Celsius.\n\n## User Methods\n\nThe methods are declared above now appear\
    \ in the code and this is where I will define what each method actually does.\
    \ My end goal is that this code has enough comments to make it clear as to what\
    \ its intended behavior is.\n\n```\n /*\n  * getTemperature - determines the temperature\
    \ in celsius based on the\n  *         incoming voltage value assuming 2.73v equals\
    \ 0°C\n  *\n  * Params - temperatureVoltage - the incoming voltage representing\
    \ the temperature\n  *\n  * Returns - float - the actual temperature in celsius\
    \ based on the incoming voltage\n  */\n\n float getTemperature(float temperatureVoltage)\n\
    \ {\n   float currentTemperature = 0.0f;\n\n   // From the datasheet, every 10\
    \ mv is equal to 1 °K - 0°C is 273°K equal to 2.73v\n   // Temperature is scaled\
    \ by 100 to bring it into the celsius scale from kelvin\n   currentTemperature\
    \ = (temperatureVoltage - baseVoltage) * 100;\n\n   return currentTemperature;\n\
    \ } \n```\n\nIn the above code, I have a method, `getTemperature` which takes\
    \ a temperature reading in volts and converts it to a temperature value in degrees\
    \ celsius. I could just convert the value read in directly to Fahrenheit but not\
    \ everyone is familiar with the Fahrenheit scale and Celsius is closer to the\
    \ original value making debugging easier if the values look odd from the expected\
    \ values. The raw temperature value is the value I will be reading from the analog\
    \ input pin of the Arduino®. While I could keep it as a voltage reading, it will\
    \ be easier to for me to relate to the value if it is in unit of measure that\
    \ I am familiar with. In this case having it in a temperature unit is much easier\
    \ then a raw voltage value.\n\n```\n /*\n  * convertTemperatureToF - converts\
    \ the temperature from Celsius to Fahrenheit\n  *\n  * Params - temperatureInCelsius\
    \ - the incoming temperature in Celsius\n  *\n  * Returns - float - the temperature\
    \ expressed in Fahrenheit\n  */\n\n float convertTemperatureToF(float temperatureInCelsius)\n\
    \ {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature = (temperatureInCelsius\
    \ * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n } \n```\n\
    \nThis method converts a temperature in Celsius to Fahrenheit.\n\n```\n /*\n \
    \ * convertTemperatureToC - converts the temperature from Fahrenheit to Celsius\n\
    \  *\n  * Params - temperatureInCelsius - the incoming temperature in Fahrenheit\n\
    \  *\n  * Returns - float - the temperature expressed in Celsius\n  */\n\n float\
    \ convertTemperatureToC(float temperatureInFahrenheit)\n {\n   float convertedTemperature\
    \ = 0.0f;\n\n   convertedTemperature = (temperatureInFahrenheit - CtoFDelta) *\
    \ FtoCConversion;\n\n   return convertedTemperature;\n } \n```\n\nThis method\
    \ converts a temperature in Fahrenheit to Celsius.\n\n## Setup\n\nAgain, the `setup`\
    \ method is where I will configure my Arduino® to operate as I need. In this case\
    \ I will want to set the analog reference voltage to the default which in the\
    \ case of the Arduino® UNO or the Arduino® MEGA, will be 5.0v. This informs the\
    \ micro-controller I want to measure voltages in the range of 0v to 5.0v. For\
    \ our purposes, this resolution will be fine.\n\n```\n void setup()\n {\n   analogReference(DEFAULT);\n\
    \   Serial.begin(9600);\n } \n```\n\nSo what do I mean regarding resolution? Well\
    \ the analog to digital converter in the Atmel® micro-controller has 10 bits of\
    \ data for precision. For a 5.0v voltage range, this means that there will be\
    \ 5.0v / 1024 or 0.004882825 volts per step of the analog to digital converter.\
    \ For each increment of the analog to digital converter, the voltage that it represents\
    \ increases by 0.004882825 volts. I have also configured my serial port here so\
    \ I can write sample data to my development system to verify that the data looks\
    \ appropriate.\n\n## Loop\n\nThe `loop` method once again is where all of the\
    \ real work is done. Here I am also using comments in the code to explain what\
    \ everything is doing so the next person looking at this code can understand it\
    \ without any assistance from me.\n\n```\n void loop()\n {\n   int    temperatureValue\
    \ = 0;\n   float  currentTempVoltage = 0.0f;\n   float  currentTemperature = 0.0f;\n\
    \n   // Read in the temperature value which will be in a range from 0 to 1023\n\
    \   temperatureValue = analogRead(temperaturePin);\n\n   // Convert our incoming\
    \ voltage representation to a value we can utilize\n   currentTempVoltage = ((float)temperatureValue\
    \ * voltageReference) / maxSampleCount;\n\n   // We now have the current temperature\
    \ expressed in celsius\n   currentTemperature = getTemperature(currentTempVoltage);\n\
    \n   // Print out the current temperature in both C and F\n   Serial.print(\"\
    The current temperature is: \");\n   Serial.print(currentTemperature);\n   Serial.print(\"\
    °C which is \");\n   Serial.print(convertTemperatureToF(currentTemperature));\n\
    \   Serial.println(\"°F\");\n\n   // Rest for a second and check again\n   delay(1000);\n\
    \ } \n```\n"
