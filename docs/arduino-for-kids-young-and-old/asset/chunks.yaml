    \ using: [Fritzing](http://fritzing.org/)\n\n##### Software\n\nThe following is\
    \ the code that is necessary to monitor the input signal to determine if our temperature\
    \ reading is greater than our set point, and if so, take an appropriate action\
    \ such as turning a fan on.\n\n```\n /*\n  * This circuit is designed to toggle\
    \ between a HIGH signal and a LOW\n  * based on the current temperature in the\
    \ room.  The potentiometer\n  * and the resistor are used to divide the 5v signal\
    \ into two values\n  * giving us the comparison we need to trigger the comparator\
    \ output.\n  * 2.73v is 0°C so to get the comparator to trigger we will want\n\
    \  * to ensure that there is 2.73v + X across the potentiometer where\n  * X is\
    \ the temperature we want to toggle on.\n  * The temperaturePin (now called setPointPin)\
    \ will again read in the \n  * temperature however it will actually be the voltage\
    \ across the \n  * potentiometer so we can use that as our setpoint.\n  * The\
    \ temperatureTogglePin will be used to determine if we are above\n  * or below\
    \ our target temperature.\n  */        \n const int setPointPin = 0;\n const int\
    \ temperatureTogglePin = 7;\n const float baseVoltage = 2.730f; /* 2.730V at 0°C\
