    In the main loop of our sketch, I have changed the name of a number of variables
    to better describe their function. I have also added in code to read the state
    of the temperature toggle pin to determine if we have reached our set point or
    not. This is done by calling the aptly named `digitalRead` method. This method
    takes one argument which is the value of the pin to be read. It will return either
    a `HIGH` or `LOW` value depending upon the voltage being read at the input pin
    of the device. For now I am simply displaying that I have either reached the set
    point or not. Later on we can take additional actions to do something a little
    more useful with this information. We will also look at another form of digital
    input when working with [interrupts](#part0006_split_001.html_temptrigger) later
    on.


    ## Summary


    The Arduino® provides pins to read in both analog and digital data. The analog
    data can be any signal such as a temperature reading, photo-resistor, or any other
    such item that provides a range of values based on an environmental stimulus.
    Digital inputs can be used to determine button presses, on and off states, and
    other binary types of data. Together, both of these types of inputs can be used
    to monitor the world around us and allow us to react to events when they occur.


    ![chapter end graphic](images/00001.jpeg)


    # Output


    ## what goes in must come out


    Previously we looked at some of the inputs that the Arduino® can process. Now
    we will look at the other side which is outputs. So what kind of signals can the
    Arduino® output? Here is a summary of them.


    - **Analog**: A variable value based on how the output is configured within the
    micro-controller

    - **Digital**: A signal that can be either `HIGH` or `LOW`

    - **Timer**: A signal, `HIGH` or `LOW`, is generated when a timer reaches a certain
    point


    * The Atmel® micro-controller that we are using on the Arduino® doesn''t actually
    output a true analog signal but instead uses a feature called pulse width modulation
    (PWM) to create an analog output value. For a true analog output, we would need
    to wire up a digital to analog converter [DAC](http://en.wikipedia.org/wiki/Digital-to-analog_converter)
    to do the conversion for us. Also note that while the micro-controller that we
    are using doesn''t have a DAC built into it, there are other micro-controllers
    that do have this functionality such as the micro-controller found on the Arduin®
    Due.


    ### Analog Output


    The Arduino® UNO supports analog outputs in the form of PWM. This is not a true
    analog output but more a percentage of a signal that remains `HIGH` for a portion
    of a period of time and `LOW` for the remainder. For the Atmel® chip found on
    the Arduino® UNO, there are two forms of PWM, Fast PWM and Phase correct PWM.
    In general, the fast PWM will look like a sawtooth where the output rises from
    the starting value, zero (`0`), up to the top value and then dropping abruptly
    back to zero (`0`). The phase correct PWM will rise up like the fast PWM however
    it will then count back down from the top value back to zero (`0`) opposed to
    the abrupt drop resulting in a better output waveform. This output is passed through
    a comparator circuit to make it more of a square wave on the output. For a lot
    of the devices we will encounter, this type of output will be fine however it
    is good to note that it isn''t a true analog output such as that a DAC would bring.


    The Arduino® combines the analog outputs on the some of the same pins as the digital
    outputs which is why it is a very good idea to plan your designs accordingly up
    front to minimize potential issues later on in your design. The reason behind
    this, is that the Atmel® micro-controller packs a significant amount functionality
    into a small package. The resulting package only has so many physical pins to
    the outside world resulting in overlap between certain functions. For the most
    part, if you are using your micro-controller to do a specific task, this will
    not be an issue. When you start getting into more complicated designs then you
    may find that this overlapping of features becomes an obstacle that you will have
    to overcome one way or another.


    So what good is this type of analog output? In general, this is a fine output
    which can be used to drive the brightness of LED''s, motors, servos''s and a number
    of other items. For LED''s, the length of time that the output signal remains
    `HIGH` correlates to the brightness of the LED in some implementations. The same
    would hold true for basic motors where the length of time that the output signal
    is `HIGH` translates to the speed of that the motor runs at. For servo''s, the
    length of time that the output signal remains `HIGH` may correlate to the direction
    that the servo turns. All of these are useful applications which we will look
    into in more detail as we proceed.


    ### Pulse Width Modulation - LED''s


    The first project will be to read in a temperature value and then turn on a tricolor
    LED to represent the temperature visually. To do this we will need to re-use our
    circuit from before with the LM335 to measure the current temperature and then
    will add to it a tricolor LED to represent that temperature value. For the tricolor
    LED that we are going to utilize, it doesn''t come with any PWM support so we
    will use some of our Arduino® PWM outputs to accomplish this. There are some lengthy
    strips of LED''s that can be found on the internet that have PWM support built
    into them. These can be interfaced through other means such as SPI which we will
    cover in the [Communications](#part0007_split_000.html_Communications) chapter.


    #### Required Components


    * Arduino® Board

    * (4) 4.7K Ohm Resistor

    * (3) 470 Ohm Resistors

    * (3) 2N2222(A) Transistor

    * LM335 temperature sensor[[7](#part0012_split_001.html_Ref7)] or similar such
    as the NTE7225[[8](#part0012_split_001.html_Ref8)]

    * Tricolor LED


    The part list includes those parts required for the temperature reading circuit
    along with the parts for the additional components used in this.


    ##### Tools


    * breadboard

    * jumper wires

    * voltage meter

    * Canned air

    * hair dryer or heat gun


    I added canned air and hair dryer to the tools portion of the above list as they
    can be used to quickly cool down or heat up the temperature sensor. They are not
    required, just convenient.


    ##### Schematic


    In this circuit, you will need to connect the ground and +5v signals from the
    Arduino® over to the TRI-Color LED. Each of the LED connections will utilize a
    NPN transistor in line to control current flow through the LED. Each transistor
    consists of a base, collector, and emitter. The collector for each transistor
    will be connected to the LED pin for each individual color. The base of each transistor
    will be connected to a PWM output of the Arduino® which will be used to vary the
    intensity of the LED it is connected to. A 4.7K resistor will be used inline between
    the Arduino® outputs and the base of each transistor. Finally the emitter of each
    transistor will be connected to ground through a 470 Ohm resistor. For the temperature
    input side of this we will again utilize the circuit we created in the previous
    chapter, [Temperature Reading](#part0004_split_001.html_TempReading), using an
    analog input to read the temperature.


    ![Tri-color LED circuit](images/00021.jpeg)


    ![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created
    using: [Fritzing](http://fritz.org/)


    ##### Software


    The following code incorporates the analog reading for the temperature sensor
    and adds in the code to drive the LED.

