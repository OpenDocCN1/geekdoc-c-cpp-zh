    \ 0985855630\nISBN-13: 978-0-9858556-3-5 \n```\n\nThanks go out to all of my friends\
    \ and family, and especially my wife Sylvine for all the support and love through\
    \ the years.\n\nThe resources linked to the end of this eBook were valid as of\
    \ the time of the writing of this eBook and include links to various tools helpful\
    \ to those getting started with open source hardware and hobby programming / engineering.\n\
    \n![chapter end graphic](images/00001.jpeg)\n\n# Introduction\n\n## Getting started\
    \ with Ardunio®\n\nFirst I am going to make some assumptions both knowingly and\
    \ unknowingly. I work with a lot of this technology on a regular basis and may\
    \ inadvertently leave something out. It's not that I don't feel it's important\
    \ or needed but more that I might not think it needs explaining or requires additional\
    \ detail. With that, if you should have any questions please do not hesitate to\
    \ email me at [Email Dan](mailto:books@afmsoftware.com?subject=Arduino%20Starter).\n\
    \nThis book is intended for those wanting to start working with open source hardware\
    \ and software in order to build their own creations using tools and components\
    \ readily available. While I will point you to specific links to learn more about\
    \ various software and/or hardware modules, I am not going to get into too much\
    \ of programming skills 101 or hardware design 101. My assumption is that you\
    \ either have some knowledge in this area or are willing to go and learn it as\
    \ you go. I will try to cover everything in enough detail that you won't have\
    \ to dig too far to get additional information however it will vary depending\
    \ on the individual. As the title of the book states, this book is focused on\
    \ developing with the `Arduino®` platform. While a number of the examples and\
    \ overall concepts will be applicable to a number of micro-controllers, I will\
    \ be focusing on the `Arduino®` family of modules and specifically those built\
    \ around the `Atmel® AVR` family of devices.\n\nThe following are some basic terms\
    \ I will be using that you should be aware of.\n\n### Prototype\nAn experimental\
    \ design (software/hardware) used to prove a theory or realize an idea\n\n###\
    \ Arduino®\nAn open source hardware/software solution used for prototyping\n\n\
    ### Shield\nAn add on card i.e. expander board to be used in conjunction with\
    \ an `Arduino®`. This may also be called a daughter board.\n\n### DC\nDirect Current\
    \ which is what most prototyping boards utilize\n\n### AC\nAlternating Current\
    \ which is the standard current coming into a house and delivered to each outlet\
    \ within the house *\n\n### Java™\nA high level programming language and environment\
    \ originally designed by `Sun®` Computer and now owned by `Oracle®`\n\n### C\n\
    A high level programming language designed at Bell Labs\n\n### Sketch\nAn `Arduino®`\
    \ term for describing the code to be executed on the `Arduino®`\n\n### USB\nUniversal\
    \ Serial Bus - standard connection for peripherals such as mice, keyboards, card\
    \ readers, etc.\n\n### LED\nLight Emitting Diode\n\n### Compiler\nA software application\
    \ which generates executable code from a source file such as a `sketch`.\n\n###\
    \ Variable\nA data type found in a `sketch` which can be assigned a value. `Variables`\
    \ can be of different types to represent different data types such as integers,\
    \ characters, and floating point numbers\n\n### Signed value\nA value that can\
    \ represent both positive and negative numbers\n\n### Unsigned value\nA value\
    \ that can only represent positive numbers\n\n### Parameter\nA value passed into\
    \ a method during program execution\n\n### Return Value\nA value returned by a\
    \ method once it has finished processing\n\n### Object\nA software construct utilized\
    \ in high level programming languages such as `Java™` and `C++`\n\n### Baud, Baud\
    \ Rate\nThe speed at which a communication device operates at\n\n* As I am based\
    \ in the United States, a typical `AC` current coming into each house would be\
    \ in the 120V range while in Europe, the typical value would be in the 240V range.\
    \ While most items purchased operate via 120V `AC`, in actuality they operate\
    \ on `DC` and have transformers inside or as of the power cord to convert `AC`\
    \ to `DC`.\n\nHaving the right tool is always beneficial when working on any project.\
    \ The same is true when working with both software and hardware. Before you get\
    \ started you will want to make sure you have the following items:\n\n- a functioning\
    \ computer (`Macintosh®`, `Windows®`, or `Linux®`)\n- an available `USB` host\
    \ port. The port should be of type `A` which will look something like this: ![USB\
    \ Port image](images/00002.jpeg)\n- a clean area to work in and spread out a bit\n\
    - internet access to look up information\n- the `Java Runtime Environment` which\
    \ can be downloaded: [here](http://java.com/en/download/index.jsp)\n- the `Arduino®`\
    \ development environment which can be downloaded: [here](http://arduino.cc/en/Main/Software)\n\
    - an `Arduino®` kit such as this one from [Maker](http://www.makershed.com/Getting_Started_with_Arduino_Kit_V3_0_p/msgsa.htm)\n\
    - a `breadboard` for prototyping circuits\n- `jumper wires` for connecting the\
    \ various parts of your circuits together and to the `Arduino®`\n- A `5v` power\
    \ supply able to deliver `2 Amps` of current such as: [5v 2A Supply](http://www.adafruit.com/products/276).\n\
    - and a comfortable chair\n\n** Electronic components are very susceptible to\
    \ static electricity. This means that any static electricity that builds up on\
    \ yourself could damage the component, like the `micro-controller`, when you touch\
    \ it and transfer that energy from yourself to the component. In some cases, this\
    \ damage cannot be detected and the component will work most of the time but not\
    \ always. Consider it like a crack in a bowl. It may be fine most of the time\
    \ however once in a while, some liquid may spill. And then if it happens to be\
    \ hot, you will get burned.\n\n*** If you happen to purchase the `Arduino®` kit\
    \ as specified above then there will be a `breadboard` and `jumpers` included\
    \ with it.\n\nThe following list are some additional items which are not required\
    \ however I regularly use during development.\n\n- a `soldering iron` for building\
    \ circuits\n"
