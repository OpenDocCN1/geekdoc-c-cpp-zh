  trans: "\n这段代码非常直观，红、蓝、绿的每个值都被写入对应的引脚，从而开启连接到该颜色 LED 通道的晶体管。我们写入的值是在 PWM 信号周期内信号处于高电平（HIGH）的时间，而剩余时间内信号处于低电平（LOW）。到为止我还没有提到，这段总时间有多长？根据\
    \ Arduino® 文档，我们可以看到 PWM 信号的总频率约为 490 Hz。Hz 缩写代表赫兹（hertz），它是信号的频率，即信号在一个完整秒内从低变为高电变化的次数。基本上，1\
    \ 赫兹等于 1 秒。信号的总时间为一（1）秒除以赫兹数。在我们的情况下，这是 1 除以 490，导致每个周期为 0.00204081632653 秒。在归一化术语中，PWM\
    \ 信号的周期约为 2 毫秒。如果你向模拟输出引脚写入值 127，你将从该引脚处得到一个近乎完美的方波，其高电平时间占的一半（即 1 毫秒），其余周期时间为低电平（即第二个\
    \ 1 毫秒）。值 64 是 PWM 信号总值的四分之一，它将导致 500 微秒的高电平信号，随后是 1500 微秒的低电平信号。\n\n一旦你构建好电路并准备好使用提供的程序进行测试，你就可以加热和或冷却\
    \ LM335 来观察三色 LED 的变化。由于三色 LED 每个像素之间的空间非常小，当我们把 LED 作为一个整体来看时，我们将看到每个部分的混合颜色，而不是三种然不同的颜色。这部分归因于\
    \ LED 周围不透明的外壳导致了颜色混合。代码的最后部分是 `delay()` 方法，它再次被用于在检查模拟输入的新温度读数之前让操作发生。稍后，当我们查看中断时，我们将看到如何移除延迟，并对外部刺激做出更快的反应，而不是持续地监控数值。\n\
    \n## 脉宽调制 - 风扇\n\n现在既然我们已经掌握了 PWM，我将介绍其他利用它的方法。对于这个电路，我将使用一个连接到模拟输入的电位器，用它控制连接到\
    \ PWM 输出的风扇速度。目标是根据从电位器读取的模拟输入来调整风扇的速度。对于实际用途，我可能会在模拟输入上放置一个温度传感器，以便根据当前温度调整风扇。但在这个示例中，我将简单利用电位器来更好地练习风扇从关闭到全速运行。\n\
    \n*   Arduino® 开发板\n*   10K 电位器\n*   2N2222(A) 晶体管\n*   100 欧姆电阻\n*   1K 欧姆电阻\n\
    *   150 欧姆电阻\n*   风扇，+12v， 200mA\n\n### 工具\n\n*   面包板\n*   跳线线\n*   电压表\n\n###\
    \ 电路图\n\n风扇使用四（4）针插座连接到板上。也可以使用三（3）针风扇，但除非你将此值连接到晶体管（例如下图中的 `Q1`），否则它将无法通过 PWM\
    \ 输出引脚进行控制。风扇的电压应施在板顶部的电阻上，以流入晶体管。这当然假设你正在使用的风扇是设计为在 +12v 下运行的。如果你使用的是四针风扇，你将需要将黄色线从晶体管引出连接到风扇的\
    \ +12v 电压输入，完全绕过晶体管。需要注意的是不要将风扇电源连接到 Arduino®，因为可能会导致 Arduino® 电路板过载并损坏它。你还需要考虑电流抽\
    \ `Ic`，以确保它不会使晶体管过载。对于指定的晶体管，最大电流 `Ic` 为 1.0 安培。\n\n![Fan control circuit](img/00022.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 图片创建自：[Fritzing](http://fritzing.org/)\n\
    \n### 软件\n\n以下代码用于读取电位器两的电压，并将其写入 PWM 引脚以控制风扇的速度。\n\n```cpp\n /*\n * FanPWM -\
    \ 此程序的目的是从电位器读取一个值，然后\n *          使用该值来决定风扇应该旋转多快。\n *\n * 风扇控制引脚是从电位器读取输入的地方。\n\
    \ *\n * fanTachPin 连接用于读取风扇的当前速度\n *\n * 风扇速度引脚是 Arduino 的 PWM 输出连接到\n * 接口电路的地方以驱动风扇。\n\
    \ *\n * 电压参考是可以在模拟输入\n * 引脚上读取到的最大电压\n *\n * 最大采样计数是在模拟输入\n * 引脚上可以读取到的最高值，它将等于电压参考\n\
    \ */\n\nconst int fanControlPin = 0;\nconst int fanTachPin = 7;\nconst int fanSpeedPin\
    \ = 9;\nconst float voltageReference = 5.0;\nconst int maxSampleCount = 1023;\n\
    ```\n"
- fmt: "\nIn addition to the analog reference we will also set the `fanTachPin` as\
    \ a digital input which is much like we have done before however there will be\
    \ a slight twist in how we use it. Finally the serial port is started and set\
    \ for `9600` baud. This will allow us to observe the speed of the fan that is\
    \ being read.\n\n### Loop\n\nAs before, the `loop` method is where all of the\
    \ work is done. In this case we will be reading in a value from a potentiometer\
    \ and writing out a value to the fan which represents how fast the fan should\
    \ be spinning. In addition we will be reading in the pulse width of the fan tachometer\
    \ pin and presenting that as a speed to the serial port interface.\n\n```\n void\
    \ loop()\n{\n  int fanControlValue = 0;\n  int fanSpeed = 0;\n  int fanTach =\
    \ 0;\n\n  // Read in the temperature value which will be in a range from 0 to\
    \ 1023\n  fanControlValue = analogRead(fanControlPin);\n\n  // Our range for output\
    \ for PWM is 0 to 255 so we will divide by\n  // 4 in order to get the read in\
    \ value into the proper range\n  // the output pin expects.\n  fanSpeed = fanControlValue\
    \ / 4;\n\n  analogWrite(fanSpeedPin, fanSpeed);\n\n  // Read in the fan tachometer\
    \ value which will be a high signal\n  // for a period X\n  fanTach = pulseIn(fanTachPin,\
    \ HIGH);\n\n  char buffer[256];\n  int rpm = 1000000 / fanTach; // 1 Million as\
    \ the value is in microseconds\n\n  // Target and tach shouldn't be expected to\
    \ be the same\n  sprintf(buffer, \"Target: %d, Tach: %d\", fanSpeed, rpm);\n\n\
    \  Serial.println(buffer);\n\n  // Rest for a second and check again\n  delay(1000);\n\
    } \n```\n\nThe voltage is read in from the fan control pin and converted to a\
    \ value that is proper for our PWM output. The input range is from `0` to `1023`\
    \ while the output can only be from `0` to `255`. Because of this, I will scale\
    \ the incoming value by dividing the value read by four (`4`). Once we have converted\
    \ our value, we will then write that speed out to set the fan for that speed.\
    \ Note that the actual value written will not be an actual speed but a value from\
    \ `0` to `255`. The fan most likely will turn off well before we reach the lowest\
    \ value i.e. `0` and will turn on when not zero (`0`). The reason for this is\
    \ that it takes a bit of voltage in order to actually switch on the transistor\
    \ and depending on what components that you use along with which fan and what\
    \ voltage you select. Once the value has been written to the fan speed pin, I\
    \ will read in the value from the tachometer in order to determine the speed that\
    \ the fan is rotating.\n\n```\n // Read in the fan tachometer value which will\
    \ be a high signal\n  // for a period X\n  fanTach = pulseIn(fanTachPin, HIGH);\
    \ \n```\n\nFor this sketch, I have included a new input method for digital pins.\
    \ This is the `pulseIn` method which is designed to read in the length of either\
    \ a `HIGH` or `LOW` signal. This method will return a value representing the amount\
    \ of time a pulse was either `HIGH` or `LOW`. This value will represent the number\
    \ of microseconds that the pulse endured. In the above example, I am measuring\
    \ how long the pulse is `HIGH` in order to determine the rotational speed of the\
    \ fan. The return value from the `pulseIn` method is in microseconds. So our rotations\
    \ will be one divided by the number of microseconds. I was reading around `500`\
    \ microseconds on my display which puts us at an RPM of around `2000` which is\
    \ inline with what I would expect based on the documentation for the fan.\n\n\
    Once we know what the rotational speed is of the fan, we will display the target\
    \ speed and tachometer value to the user. Following this we will sleep for one\
    \ (`1`) second before checking the potentiometer again and adjusting the fan speed\
    \ accordingly. You might notice that the fan tach is not stable and can rise and\
    \ fall quite significantly. We will rectify this in the chapter regarding [Interrupts](#part0006_split_001.html_fantach).\n\
    \nThis type of circuit would be similar to what your mother board in your computer\
    \ might do in terms of controlling the CPU temperature. Basically the system will\
    \ want to measure the current temperature of the CPU and increase the fan speed\
    \ if it is getting above a certain point and decrease it when it drops back down\
    \ to a certain threshold. If we were to take our circuit from the chapter on [Inputs](#part0004_split_002.html_temptrigger)\
    \ and add the fan interface to that circuit, we could turn the fan on whenever\
    \ the temperature reached our set point.\n\n### Pulse Width Modulation - Servos\n\
    \nThe last area we will look at is a servo which we can control to perform some\
    \ type of work. Servos are used for controlling robotic arms and can also be used\
    \ for steering remote controlled cars among other things.\n\n* Arduino® Board\n\
    * 4.7K Ohm Resistor\n* LED\n* +5v DC power supply\n* 5v servo such as this [LS-3006](http://www.frys.com/product/7027261)\n\
    \n#### Tools\n\n* breadboard\n* jumper wires\n* voltage meter\n\n### Schematic\n\
    \n![Motor circuit](images/00023.jpeg)\n\n![Creative Commons - Attribution - Share\
    \ Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \nThe above drawing shows the servo attached to the Arduino® with the control\
    \ signal connected to `11` which is a PWM output pin. The main thing to note is\
    \ that I am connecting the servo to the Arduino® `Vin` pin. It is very important\
    \ to connect the servo to this pin and NOT the `+5v` pin. This also requires that\
    \ you connect a `+5v` DC power supply to the Arduino®. The reason for this is\
    \ that the servo will draw more current then is safe for the Arduino® pins to\
    \ supply. By connecting it to the `Vin` pin, you will be using the DC power supply\
    \ to provide current to the servo and protecting your Arduino® from potential\
    \ harm. This also means that you shouldn't use just the USB port as your power\
    \ supply as it will supply around `500` milliamps maximum which will probably\
    \ not be enough for both the servo and the Arduino® board.\n\n#### Software\n\n\
    The following code is used to control the servo. The main goal is to be able to\
    \ turn the servo both forward and backward. Another thing to note is that servo's\
    \ come in a variety of formats. Some will turn full circle while others may only\
    \ turn a certain amount. The one I have, the `LS-3006`, is able to turn a full\
    \ 360 degrees.\n"
  raw: "In addition to the analog reference we will also set the fanTachPin as a digital\
    \ input which is much like we have done before however there will be a slight\
    \ twist in how we use it. Finally the serial port is started and set for 9600\
    \ baud. This will allow us to observe the speed of the fan that is being read.\n\
    \n###### Loop\n\nAs before, the loop method is where all of the work is done.\
    \ In this case we will be reading in a value from a potentiometer and writing\
    \ out a value to the fan which represents how fast the fan should be spinning.\
    \ In addition we will be reading in the pulse width of the fan tachometer pin\
    \ and presenting that as a speed to the serial port interface.\n\n```\n void loop()\n\
    {\n  int fanControlValue = 0;\n  int fanSpeed = 0;\n  int fanTach = 0;\n\n  //\
    \ Read in the temperature value which will be in a range from 0 to 1023\n  fanControlValue\
    \ = analogRead(fanControlPin);\n\n  // Our range for output for PWM is 0 to 255\
    \ so we will divide by\n  // 4 in order to get the read in value into the proper\
    \ range\n  // the output pin expects.\n  fanSpeed = fanControlValue / 4;\n\n \
    \ analogWrite(fanSpeedPin, fanSpeed);\n\n  // Read in the fan tachometer value\
    \ which will be a high signal\n  // for a period X\n  fanTach = pulseIn(fanTachPin,\
    \ HIGH);\n\n  char buffer[256];\n  int rpm = 1000000 / fanTach; // 1 Million as\
    \ the value is in microseconds\n\n  // Target and tach shouldn't be expected to\
    \ be the same\n  sprintf(buffer, \"Target: %d, Tach: %d\", fanSpeed, rpm);\n\n\
    \  Serial.println(buffer);\n\n  // Rest for a second and check again\n  delay(1000);\n\
    } \n```\n\nThe voltage is read in from the fan control pin and converted to a\
    \ value that is proper for our PWM output. The input range is from 0 to 1023 while\
    \ the output can only be from 0 to 255\\. Because of this, I will scale the incoming\
    \ value by dividing the value read by four (4). Once we have converted our value,\
    \ we will then write that speed out to set the fan for that speed. Note that the\
    \ actual value written will not be an actual speed but a value from 0 to 255\\\
    . The fan most likely will turn off well before we reach the lowest value i.e.\
    \ 0 and will turn on when not zero (0). The reason for this is that it takes a\
    \ bit of voltage in order to actually switch on the transistor and depending on\
    \ what components that you use along with which fan and what voltage you select.\
    \ Once the value has been written to the fan speed pin, I will read in the value\
    \ from the tachometer in order to determine the speed that the fan is rotating.\n\
    \n```\n // Read in the fan tachometer value which will be a high signal\n  //\
    \ for a period X\n  fanTach = pulseIn(fanTachPin, HIGH); \n```\n\nFor this sketch,\
    \ I have included a new input method for digital pins. This is the pulseIn method\
    \ which is designed to read in the length of either a HIGH or LOW signal. This\
    \ method will return a value representing the amount of time a pulse was either\
    \ HIGH or LOW. This value will represent the number of microseconds that the pulse\
    \ endured. In the above example, I am measuring how long the pulse is HIGH in\
    \ order to determine the rotational speed of the fan. The return value from the\
    \ pulseIn method is in microseconds. So our rotations will be one divided by the\
    \ number of microseconds. I was reading around 500 microseconds on my display\
    \ which puts us at an RPM of around 2000 which is inline with what I would expect\
    \ based on the documentation for the fan.\n\nOnce we know what the rotational\
    \ speed is of the fan, we will display the target speed and tachometer value to\
    \ the user. Following this we will sleep for one (1) second before checking the\
    \ potentiometer again and adjusting the fan speed accordingly. You might notice\
    \ that the fan tach is not stable and can rise and fall quite significantly. We\
    \ will rectify this in the chapter regarding [Interrupts](#part0006_split_001.html_fantach).\n\
    \nThis type of circuit would be similar to what your mother board in your computer\
    \ might do in terms of controlling the CPU temperature. Basically the system will\
    \ want to measure the current temperature of the CPU and increase the fan speed\
    \ if it is getting above a certain point and decrease it when it drops back down\
    \ to a certain threshold. If we were to take our circuit from the chapter on [Inputs](#part0004_split_002.html_temptrigger)\
    \ and add the fan interface to that circuit, we could turn the fan on whenever\
    \ the temperature reached our set point.\n\n#### Pulse Width Modulation - Servos\n\
    \nThe last area we will look at is a servo which we can control to perform some\
    \ type of work. Servos are used for controlling robotic arms and can also be used\
    \ for steering remote controlled cars among other things.\n\n*   Arduino® Board\n\
    \n*   4.7K Ohm Resistor\n\n*   LED\n\n*   +5v DC power supply\n\n*   5v servo\
    \ such as this [LS-3006](http://www.frys.com/product/7027261)\n\n##### Tools\n\
    \n*   breadboard\n\n*   jumper wires\n\n*   voltage meter\n\n##### Schematic\n\
    \n![Motor circuit](images/00023.jpeg)\n\n![Creative Commons - Attribution - Share\
    \ Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \nThe above drawing shows the servo attached to the Arduino® with the control\
    \ signal connected to pin 11 which is a PWM output pin. The main thing to note\
    \ is that I am connecting the servo to the Arduino® Vin pin. It is very important\
    \ to connect the servo to this pin and NOT the +5v pin. This also requires that\
    \ you connect a +5v DC power supply to the Arduino®. The reason for this is that\
    \ the servo will draw more current then is safe for the Arduino® pins to supply.\
    \ By connecting it to the Vin pin, you will be using the DC power supply to provide\
    \ current to the servo and protecting your Arduino® from potential harm. This\
    \ also means that you shouldn't use just the USB port as your power supply as\
    \ it will supply around 500 milliamps maximum which will probably not be enough\
    \ for both the servo and the Arduino® board.\n\n##### Software\n\nThe following\
    \ code is used to control the servo. The main goal is to be able to turn the servo\
    \ both forward and backward. Another thing to note is that servo's come in a variety\
    \ of formats. Some will turn full circle while others may only turn a certain\
    \ amount. The one I have, the LS-3006, is able to turn a full 360 degrees."
