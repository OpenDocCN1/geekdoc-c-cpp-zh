    \ code demonstrates transferring data via the SPI bus.\n\n```\n void UpdatePot(int\
    \ selectPin, struct _CommandData *pData)\n{  \n  digitalWrite(selectPin, LOW);\n\
    \n  delay(100); // required delay\n\n  SPI.transfer(pData->command.cmdByte);\n\
    \  SPI.transfer(pData->data);\n\n  digitalWrite(selectPin, HIGH);\n} \n```\n\n\
    The first thing we must do is select the proper device that will be receiving\
    \ the data that we are going to write out on the SPI bus. I have added a delay\
    \ after the selectPin has been driven to a low state i.e. selected. This delay,\
    \ while not overly necessary, just ensures that the device to receive the data\
    \ has time to prepare to receive it. Typically there will be a delay needed that\
    \ is in the 10's of nanoseconds however the delay I am using is more than sufficient\
    \ and for what we are doing here, not noticeable. If you were writing data to\
    \ a strip of LED's which had to change color very rapidly, I would reduce this\
    \ delay and would also raise the clock speed to as high as the LED strip could\
    \ handle. Each application requires different configuration settings. Once I have\
    \ the select pin in the proper state, I then transfer the command byte and the\
    \ data to the digital potentiometer. Once the data has been transferred, I then\
    \ place the select pin back to the HIGH state disabling the SPI interface of the\
    \ recipient device. One thing to note, that each transfer of data on the SPI bus\
    \ may result in data being read back in as part of the transfer. It will be up\
    \ to the programmer to determine if this is the case or not based on what is being\
    \ sent to the recipient device i.e. the digital potentiometer.\n\nAll in all,\
    \ the digital potentiometer is a decent device to control the intensity of an\
    \ LED among other things. In this particular case, the MCP4621 can also be used\
    \ to store a small amount of data that could be associated with the device itself\
    \ in order to persist values that could be used regardless of which micro-controller\
    \ the component was connected to. In addition to it being a decent device, the\
    \ fact that it can be accessed with the SPI bus makes it easy to interface with.\
    \ So what happens when you don't have an SPI bus to interface with? You make your\
    \ own! This will work with a number of SPI bus devices however if the particular\
    \ device that you are using requires a high speed bus, than this method may not\
    \ work properly. In highly technical terms, this method is fondly called Bit Banging.\
    \ This is where you programmatically simulate the SPI bus using standard I/O pins.\n\
    \n```\n /*\n * TogglePin quickly toggles a pin from low to high back to low\n\
    \ * Assumes the pin is starting off as low\n */\n\nvoid TogglePin(int pinId)\n\
    {\n\tdigitalWrite(pinId, HIGH);\n\tdigitalWrite(pinId, LOW);\n}\n\n/*\n * SendData\
    \ sends a byte of data out a specific pin.\n *\n * Params\n *  selectPin \t- the\
    \ pin to select the device to receive the data\n *  dataPin \t- the pin which\
    \ is where the data will be serialized out over\n *  clockPin \t- the pin which\
    \ we will toggle to simulate the clock\n *  data\t\t- the data to be sent out\n\
    \ *\n * Returns\n *  None\n */\n\nvoid SendData(int selectPin, int dataPin, int\
    \ clockPin, byte data)\n{\n\t// Select the device - assumes device is active low\
    \ i.e.\n\t// it is listening when this pin is at a LOW state\n\tdigitalWrite(selectPin,\
    \ LOW);\n\n\tpinMode(dataPin, OUTPUT);\n\n\t// Send MSB first\n\tfor (int index\
    \ = 7; index >= 0; index--)\n\t{\n\t\t// Shift the 1 into position to see if that\
    \ bit in the passed in data is high or low\n\t\tif (data & (1 << index))\n\t\t\
    {\n\t\t\tdigitalWrite(dataPin, HIGH);\n\t\t}\n\t\telse\n\t\t{\n\t\t\tdigitalWrite(dataPin,\
    \ LOW);\n\t\t}\n\n\t\t// Once the data pin is in the proper state, toggle the\
    \ clock pin\n\t\tTogglePin(clockPin);\n\t}\n\n\t// Once done, de-select the device\n\
    \tdigitalWrite(selectPin, HIGH);\n}\n\n/*\n * SendData sends a byte of data out\
    \ a specific pin.\n *\n * Params\n *  selectPin \t- the pin to select the device\
    \ to receive the data\n *  dataPin \t- the pin which is where the data will be\
    \ serialized out over\n *  clockPin \t- the pin which we will toggle to simulate\
    \ the clock\n *  command\t\t- the command to send for requesting data\n *\n *\
    \ Returns\n *  byte\t\t- representing the value read in from the remote device\n\
    \ */\n\nbyte ReadData(int selectPin, int dataPin, int clockPin, byte command)\n\
    {\n\tbyte response = 0;\n\tbyte bitValue = 0;\n\n\tSendData(selectPin, dataPin,\
    \ clockPin, command);\n\n\tpinMode(dataPin, INPUT);\n\n\tdigitalWrite(selectPin,\
    \ LOW);\n\n\tfor (int index = 7; index >= 0; index--)\n\t{\n\t\tTogglePin(clockPin);\n\
    \n\t\tbitValue = digitalRead(dataPin);\n\n\t\tif (bitValue == HIGH)\n\t\t{\n\t\
    \t\tresponse |= (1 << index); // set the bit if the value was high\n\t\t}\n\t\
    }\n\n\tdigitalWrite(selectPin, HIGH);\n\treturn response;\n} \n```"
