  trans: "\n在这个草图中，我包含了一个次要文件，Arduino® 将其称为“库”。这允许我利用他人提供的功能，以访问 Arduino® 的某些可能无法直接访问的特性。在传统的\
    \ C 和 C++ 中，常见的功能以库的形式提供，并由头文件进行描述。`.H` 是最常见的文件扩展名，表示这是一个头文件。头文件通常会描述特定库提供的可用功能，而不会实际显示其实现方式。这对于扩展草图的功能非常有用，并允许用户与他人共享他们的代码。为了利用\
    \ Arduino® 平台内部的库，请选择 `Sketch` 菜单项，然后选择 `Import library` 选项，这将显示你可以使用的库的列表。选择\
    \ `EEPROM` 库将其包含到你当前打开的草图中。虽然我不会详细介绍每个库，但知道它们存在那里并在你需要时随时准备使用是很有帮助的。现在，让我们回到那个\
    \ `#include` 语句。该语句是 C 语言中的一个特殊关键字，用于为应用程序添加功能。\n\n![image showing library menu\
    \ selection](img/00027.jpeg)\n\n虽然你可以重新输入文件中的所有内容以供使用，但这非常容易出错、枯燥，而且坦率地说是浪费时间。`#include`\
    \ 语句为你完成了这些工作，让你能够更快、更可靠地构建草图。注意，包含 语句开头的 `#` 字符是必要的，用于指示编译器这是一个特殊命令。一旦包含了你需要的库（在本例中为\
    \ `EEPROM` 库），你就可以在草图中使用它提供的功能。\n\n所以，我们在代码中包含了一些额外的功能。这非常酷，我们将来在创建更复杂的草图时会记住这一点，以节省时间。同样重要的是，你作为最终用户，可以为自己经常使用的例程创建自己的库，以限制你需要编写的代码量。我们之前使用的温度转换函数是库的良好候选者，因为我们可能会经常再次使用它们，而且我们可能不想再次重新输入这些信息。\n\
    \n现在我们来到 C 语言的下一个新特性：结构体（structure）。结构体允许程序员将一组变量组合到一个容器中，使得数据传递和处理变得更加容易。以下是我们的结构体声明，我们将在草图中使用它。\n\
    \n```c\n typedef struct\n{\n  long signature;\n  int brightness;\n} EE_Structure;\
    \ \n```\n\n这个结构非常简单，由签名块（signature block）和一个亮度值组成。我将其命名为 `EE_Structure`，因为这将我们将存储在\
    \ `EEPROM` 中的数据结构。需要注意的是，这是结构体定义的名称，而不是我在草图中实际使用的变量名。我将亮度和签名组合在数据中，以便在将来运行草图并查看它时，我能够判断\
    \ `EEPROM` 中是否存储了有效值。当我第一次运行草图时，我无法保证 `EEPROM` 中会有什么值。签名可以帮助我判断我的草图是否执行过。该结构体的第二部分是\
    \ LED 的亮度，范围从零（0）到二百百十五五（255）。这可以放入一个无符号字符（即一个字节）中，但我预留了额外的空间，以防以后需要。那么，结构体在编程时什么时候有用呢？嗯，现在我可以像使用普通变量类型（如整数）一样使用这个结构体。我现在可以执行以下操作：\n\
    \n```c\n volatile EE_Structure StoredData; \n```\n\n这允许我同时声明签名和亮度。它还将将它们作为一个单元保持在一起，我可以根据需要将其传递给方法。虽然我没有充分利用结构体的所有优点，但将数据保持在一个类型中仍然很有用。如果我有多个具有多个\
    \ ID 的编码器，我可以为每个 LED 创建这样的结构体之一。我还可以每个 LED 的输出引脚与亮度相关联，以保持每个数据集在一起。当你的数据需求增加、草图复杂性增加时，这非常有用。这也是面向对象设计和\
    \ C++ 的基本前提（C++ 是一种面向对象的编程语言）。将你的数据与处理这些数据的方法相结合，允许你创建在后续草图中使用这些构建块。\n\n接下来的几行代码是函数声明以及我编写的各种辅助函数，目的是使我的程序更容易理解并减小代码体积。我知道我需要向\
    \ `EEPROM` 写入数据并在以后恢复它。基于此，我创建了几个函数：`ReadInteger`、`WriteInteger`、`ReadLong` 和\
    \ `WriteLong`，它们将向 `EEPROM` 内特定位置读写整数或长整型。第一个是 `ReadInteger` 函数，如下所示：\n\n```c\n\
    \ int ReadInteger(int offset)\n{\n  int returnValue = 0;\n\n  // Read in EEPROM\n\
    \  for (int count = 0; count < sizeof(int); count++)\n  {\n    returnValue |=\
    \ EEPROM.read(offset + count) << (count * 8); // read in a byte from eeprom and\
    \ shift it x to build up an integer of data\n  }\n\n  return returnValue;\n} \n\
    ```\n\n这段代码从 `EEPROM` 读取一系列字节并将它们合并成单个整数值。当我读取每个字节时，我使用 `<<` 运算符对其进行左移位，该运算符会将提供的值中的位移动指定的位数。在这种情况下，我移动了\
    \ 8 位数据，这等同于一个字节。\n\n在移动数据时，位根据移位命令的方向向下或向上移动。例如，如果我有二进制值 `0b00000011`（它等于数值三\
    \ 3），我可以将其向左移动一位，这样就会得到值 `0b00000110`。当我向左移动该值时，最高位会丢失，并在值的末尾添加一个零，以保持组成变量的正确位数。在这个示例中，我使用了\
    \ 8 位，这代表一个字节的数据。如果我将其写在代码中，将如下所示：\n\n```c\n byte value = 0x03;\t\t\t\t// start\
    \ with a value of 3\nbyte shiftedValue = value << 1;\t// shift left by 1 bit resulting\
    \ in 0x06 i.e. 0b00000110 \n```\n\n正如你猜到的那样，向右移动将产生相反的操作，使 `0x06` 变为 `0x03`。如果你再次向右移动一位，值\
    \ `0x03` 将变为 `0x01`。另外一点需要注意的是，一位的移位等同于乘以二或除以二。当考虑速度时，移位可能比除法操作快一个级。\n\n"
- fmt: "\nOne thing you will note is that I am using the `sizeof(int)` compile time\
    \ unary operator. This is a very important operator which allows code to be more\
    \ portable opposed to hard coding a size. For the Atmel® device used on a number\
    \ of the Arduino® boards, the integer size is two (2) bytes. So when I store my\
    \ integer value to `EEPROM`, I will be storing two bytes of data which represents\
    \ that integer. On the Arduino® Due which is an ARM® based device, the size of\
    \ an integer is four (4) bytes. By writing my code to utilize the `sizeof` operator,\
    \ I am able to make it more portable then it otherwise would be. The downside\
    \ is that the data I store in the `EEPROM` will typically only be read correctly\
    \ by a device that shares the same integer size as that which wrote it. For our\
    \ purposes this is a non-issue as the `EEPROM` is internal to the device and only\
    \ this device will ever read and write to it. If this was a shared memory device\
    \ then we would have to take precautions to ensure that one device didn't interpret\
    \ the data incorrectly.\n\nFollowing the `ReadInteger` function is the aptly named\
    \ `WriteInteger` function. Basically it will do the reverse of the former function\
    \ in that it will convert the integer passed in to a series of bytes based on\
    \ the size of an integer for the platform the code is running on. This code is\
    \ as follows:\n\n```cpp\n /*\n * WriteInteger - a helper function to write in\
    \ an integer to the nonvolatile storage\n *\n * Params - offset - the offset into\
    \ the EEPROM where data is to be stored\n *        - value - the value to be stored\n\
    \ *\n * Returns - none\n */\nvoid WriteInteger(int offset, int value)\n{\n  byte\
    \ dataValue = 0;\n  byte intSize = sizeof(int);\n\n  for (int count = 0; count\
    \ < intSize; count++)\n  {\n    dataValue = value >> ((intSize - 1 - count) *\
    \ 8); // We need to shift from left to right so upper first then on down\n   \
    \ EEPROM.write(offset + count, dataValue);\n  }\n} \n```\n\nThis code writes a\
    \ series of bytes to the `EEPROM` in the same order that the `ReadInteger` function\
    \ will expect. This will allow me to store my data for future use when the micro-controller\
    \ starts again. There is not anything remarkable with this function other than\
    \ shifting the value down in order to store each part of the integer. The real\
    \ key to this routine is the manipulation of the incoming integer to create a\
    \ series of bytes.\n\n```cpp\ndataValue = value >> ((intSize - 1 - count) * 8);\
    \ // We need to shift from left to right so upper first then on down\nEEPROM.write(offset\
    \ + count, dataValue); \n```\n\nThe variable `dataValue` is of size one (1) byte.\
    \ When I assign an integer to it, the integer will be truncated to match the size\
    \ of the recipient. In this case the two byte integer will be converted to a single\
    \ byte. Because of this fact, I can simply assign the data value to the integer\
    \ and write out the first byte of data. The second time through the loop, I will\
    \ shift the incoming integer value to the right by `8` bits which will then assign\
    \ the upper byte to the variable `dataValue` and allow me to store the upper 8\
    \ bits of data associated with the integer that was passed in. This is assuming\
    \ that the integer size is equivalent to two (2) bytes. I used the `count` variable\
    \ to know how much I should shift the value in order to get the right value in\
    \ my variable `dataValue`. You may also note that I took the liberty of assigning\
    \ the `sizeof` value to a variable opposed to just using it throughout the code.\
    \ This will actually make my code a little slower because I will have to read\
    \ in the value from the memory location that I called `intSize` each time I want\
    \ to reference it. If I had simply placed the `sizeof` operator wherever I needed\
    \ to know the size of the integer, the calculation for the proper size value would\
    \ have been done at compile time resulting in a constant value being placed in\
    \ the code opposed to a variable representation. The net result is the code would\
    \ be faster if I had used the `sizeof` operator consistently throughout. Of course\
    \ if I had done that, I wouldn't have anything anything to point out at this point\
    \ in the book. The bottom line is that if you find that you need to call a particular\
    \ function a number of times in order to retrieve a value which most likely isn't\
    \ changing it is best to assign it to a variable opposed to calling the function\
    \ repeatedly. This is assuming that the function to get said value is lengthy\
    \ in nature or that the overhead to call the function based on your platform is\
    \ high. For example, I now accessing the `EEPROM` is slower than accessing regular\
    \ memory (RAM). Instead of reading in the brightness every time, I could read\
    \ it in at the beginning of my sketch and keep it in a variable which I could\
    \ access quite quickly. When the user changed the value of the brightness via\
    \ the rotary encoder, I could update my variable and than write the new value\
    \ to the `EEPROM`. However in the case of the `sizeof` operator, this is not a\
    \ function call and in fact is an operator so the time used to evaluate it is\
    \ a non-issue.\n\nIn addition to these two functions, there are two additional\
    \ functions for storing long values which utilize the `ReadInteger` and `WriteInteger`\
    \ functions we have just reviewed.\n\nThe next thing to look at is the call to\
    \ `EEPROM.read(offset + count)`. This call is part of the `EEPROM` class that\
    \ I imported as the `EEPROM` library. The `read` function is a part of the class\
    \ that knows how to read data from an `EEPROM`. In this case it is the `EEPROM`\
    \ that is integral to the micro-controller that we are using. Overall the function\
    \ isn't very difficult to understand. Pass in a valid offset between zero (0)\
    \ and the maximum size of the `EEPROM`, minus one as the index is zero (0) based,\
    \ and it will return the byte of data that is stored at the specified location.\
    \ Pretty simple overall. The main thing is being able to convert the incoming\
    \ bytes from the `EEPROM` into other data values. In this case I am converting\
    \ them into integers which is why I will shift each value read over eight (8)\
    \ bits based on how many bytes I have read. This will work for any size integer\
    \ as I am using the `sizeof` operator. Once I have finished reading the correct\
    \ number of bytes, I return the complete value to the calling routine.\n\nSo once\
    \ I am able to read and write values to my `EEPROM`, I now need to be able to\
    \ respond to an interrupt whenever the rotary encoder is turned. I do that with\
    \ the following code:\n\n```cpp\nvoid HandleDecoderTrigger(void)\n{\n  byte directionData\
    \ = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\n\
    \  if (directionData == HIGH)\n  {\n    // clockwise\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // counter clockwise\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n} \n```\n"
  raw: "One thing you will note is that I am using the sizeof(int) compile time unary\
    \ operator. This is a very important operator which allows code to be more portable\
    \ opposed to hard coding a size. For the Atmel® device used on a number of the\
    \ Arduino® boards, the integer size is two (2) bytes. So when I store my integer\
    \ value to EEPROM, I will be storing two bytes of data which represents that integer.\
    \ On the Arduino® Due which is an ARM® based device, the size of an integer is\
    \ four (4) bytes. By writing my code to utilize the sizeof operator, I am able\
    \ to make it more portable then it otherwise would be. The downside is that the\
    \ data I store in the EEPROM will typically only be read correctly by a device\
    \ that shares the same integer size as that which wrote it. For our purposes this\
    \ is a non-issue as the EEPROM is internal to the device and only this device\
    \ will ever read and write to it. If this was a shared memory device then we would\
    \ have to take precautions to ensure that one device didn't interpret the data\
    \ incorrectly.\n\nFollowing the ReadInteger function is the aptly named WriteInteger\
    \ function. Basically it will do the reverse of the former function in that it\
    \ will convert the integer passed in to a series of bytes based on the size of\
    \ an integer for the platform the code is running on. This code is as follows:\n\
    \n```\n /*\n * WriteInteger - a helper function to write in an integer to the\
    \ nonvolatile storage\n *\n * Params - offset - the offset into the EEPROM where\
    \ data is to be stored\n *        - value - the value to be stored\n *\n * Returns\
    \ - none\n */\nvoid WriteInteger(int offset, int value)\n{\n  byte dataValue =\
    \ 0;\n  byte intSize = sizeof(int);\n\n  for (int count = 0; count < intSize;\
    \ count++)\n  {\n    dataValue = value >> ((intSize - 1 - count) * 8); // We need\
    \ to shift from left to right so upper first then on down\n    EEPROM.write(offset\
    \ + count, dataValue);\n  }\n} \n```\n\nThis code writes a series of bytes to\
    \ the EEPROM in the same order that the ReadInteger function will expect. This\
    \ will allow me to store my data for future use when the micro-controller starts\
    \ again. There is not anything remarkable with this function other than shifting\
    \ the value down in order to store each part of the integer. The real key to this\
    \ routine is the manipulation of the incoming integer to create a series of bytes.\n\
    \n```\n dataValue = value >> ((intSize - 1 - count) * 8); // We need to shift\
    \ from left to right so upper first then on down\n    EEPROM.write(offset + count,\
    \ dataValue); \n```\n\nThe variable dataValue is of size one (1) byte. When I\
    \ assign an integer to it, the integer will be truncated to match the size of\
    \ the recipient. In this case the two byte integer will be converted to a single\
    \ byte. Because of this fact, I can simply assign the data value to the integer\
    \ and write out the first byte of data. The second time through the loop, I will\
    \ shift the incoming integer value to the right by 8 bits which will then assign\
    \ the upper byte to the variable dataValue and allow me to store the upper 8 bits\
    \ of data associated with the integer that was passed in. This is assuming that\
    \ the integer size is equivalent to two (2) bytes. I used the count variable to\
    \ know how much I should shift the value in order to get the right value in my\
    \ variable dataValue. You may also note that I took the liberty of assigning the\
    \ sizeof value to a variable opposed to just using it throughout the code. This\
    \ will actually make my code a little slower because I will have to read in the\
    \ value from the memory location that I called intSize each time I want to reference\
    \ it. If I had simply placed the sizeof operator wherever I needed to know the\
    \ size of the integer, the calculation for the proper size value would have been\
    \ done at compile time resulting in a constant value being placed in the code\
    \ opposed to a variable representation. The net result is the code would be faster\
    \ if I had used the sizeof operator consistently throughout. Of course if I had\
    \ done that, I wouldn't have had anything to point out at this point in the book.\
    \ The bottom line is that if you find that you need to call a particular function\
    \ a number of times in order to retrieve a value which most likely isn't changing\
    \ it is best to assign it to a variable opposed to calling the function repeatedly.\
    \ This is assuming that the function to get said value is lengthy in nature or\
    \ that the overhead to call the function based on your platform is high. For example,\
    \ I now accessing the EEPROM is slower than accessing regular memory (RAM). Instead\
    \ of reading in the brightness every time, I could read it in at the beginning\
    \ of my sketch and keep it in a variable which I could access quite quickly. When\
    \ the user changed the value of the brightness via the rotary encoder, I could\
    \ update my variable and than write the new value to the EEPROM. However in the\
    \ case of the sizeof operator, this is not a function call and in fact is an operator\
    \ so the time used to evaluate it is a non-issue.\n\nIn addition to these two\
    \ functions, there are two additional functions for storing long values which\
    \ utilize the ReadInteger and WriteInteger functions we have just reviewed.\n\n\
    The next thing to look at is the call to EEPROM.read(offset + count). This call\
    \ is part of the EEPROM class that I imported as the EEPROM library. The read\
    \ function is a part of the class that knows how to read data from an EEPROM.\
    \ In this case it is the EEPROM that is integral to the micro-controller that\
    \ we are using. Overall the function isn't very difficult to understand. Pass\
    \ in a valid offset between zero (0) and the maximum size of the EEPROM, minus\
    \ one as the index is zero (0) based, and it will return the byte of data that\
    \ is stored at the specified location. Pretty simple overall. The main thing is\
    \ being able to convert the incoming bytes from the EEPROM into other data values.\
    \ In this case I am converting them into integers which is why I will shift each\
    \ value read in over eight (8) bits based on how many bytes I have read. This\
    \ will work for any size integer as I am using the sizeof operator. Once I have\
    \ finished reading the correct number of bytes, I return the complete value to\
    \ the calling routine.\n\nSo once I am able to read and write values to my EEPROM,\
    \ I now need to be able to respond to an interrupt whenever the rotary encoder\
    \ is turned. I do that with the following code:\n\n```\n void HandleDecoderTrigger(void)\n\
    {\n  byte directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // clockwise\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // counter clockwise\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n} \n```"
