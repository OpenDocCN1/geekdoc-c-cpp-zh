- fmt: "\nI know I will need two `SN74LS595` devices to run each of the seven segment\
    \ displays. I will also need a way to drive the LED's without overpowering the\
    \ `Arduino®` output pins. The `SN74LS595`s can handle 24 milliamps. While the\
    \ Radio Shack™ 7 segment displays have limited information posted regarding them,\
    \ I found that they are similar or the same as the Everlight[[12](#part0012_split_001.html_Ref12)]\
    \ 7 segment display which indicates that each segment requires a maximum of 15\
    \ milliamps. In order to ensure I don't over power any of my devices, I will place\
    \ pull-up resistors inline with the various LED lights. This will allow me to\
    \ drive the LED's while not over powering my devices. Given the number of LED's\
    \ I will look into resistor arrays to minimize the amount of space required on\
    \ my final board. \n\nThe first thing I am going to do is create a simplified\
    \ circuit on my breadboard in order to test out what I believe will work. Right\
    \ now there has been a lot of theory however I need to verify the design before\
    \ trying to move forward. In this prototype, I will connect up one of the `SN74LS595`,\
    \ a resistor network, and a seven segment display to test out both the hardware\
    \ and the software interface.\n\n## Prototype\n\n![expansion IO breadboard prototype](images/00031.jpeg)\n\
    \nIn my prototype I only wired up one of the `SN74LS595` chips given they are\
    \ both going to be doing the same thing. I didn't hook up the headlights as of\
    \ yet as they are fairly simple to wire i.e. a voltage supply, a resistor, and\
    \ the LED. I connected the `Arduino®` to my laptop via `USB` however also used\
    \ an external six (6) volt supply to drive the circuits on the breadboard. While\
    \ none of the components on the breadboard would overload my `USB` port, if I\
    \ don't have to take chances, I won't.\n\n## Circuit\n\nNow that I have verified\
    \ my prototype, I can move forward with a full circuit for expanding my I/O and\
    \ displaying the car's number. The circuit consists of two `74LS595` shift registers\
    \ along with the 7 segment displays. I am also using a resistor network to conserve\
    \ space on my circuit board. The main circuit of the expansion board looks like\
    \ as follows.![expansion schematic](images/00032.gif)\n\n## PCB\n\nThe circuit\
    \ board I created from the schematic looks as follows:![expansion printed circuit\
    \ board](images/00033.gif) You will notice in both the schematic and the `PCB`\
    \ I have not defined the input buttons to change the number of the car. This is\
    \ because I am going to mount them outside of the `PCB` in order to prevent them\
    \ being exposed at the derby. Once I configure the car for the right number, I\
    \ don't want it to change inadvertently so having them away from sight will make\
    \ it a little easier. For the buttons, I will configure two push buttons which\
    \ will simply allow the user to increment each digit of the 7 seven segment display\
    \ individually. Because this is a fairly simple design we will only increment\
    \ the numbers. Perhaps this isn't the most user friendly design but given the\
    \ numbers won't be changing very often it will suffice.\n\n## Software\n\nFor\
    \ this sketch I need to assign two data pins, two shift clocks, two storage clocks,\
    \ and two pins to drive the LED's being used as headlights. Once they are assigned\
    \ I can then write out data to each of the shift registers in order to assign\
    \ the proper number for the car display. I will also need to configure two interrupts\
    \ to handle the increment of the 7 segment displays.\n"
  raw: 'I know I will need two SN74LS595 devices to run each of the seven segment
    displays. I will also need a way to drive the LED''s without overpowering the
    Arduino® output pins. The SN74LS595''s can handle 24 milliamps. While the Radio
    Shack™ 7 segment displays have limited information posted regarding them, I found
    that they are similar or the same as the Everlight[[12](#part0012_split_001.html_Ref12)]
    7 segment display which indicates that each segment requires a maximum of 15 milliamps.
    In order to ensure I don''t over power any of my devices, I will place pull-up
    resistors inline with the various LED lights. This will allow me to drive the
    LED''s while not over powering my devices. Given the number of LED''s I will look
    into resistor arrays to minimize the amount of space required on my final board.


    The first thing I am going to do is create a simplified circuit on my breadboard
    in order to test out what I believe will work. Right now there has been a lot
    of theory however I need to verify the design before trying to move forward. In
    this prototype, I will connect up one of the SN74LS595, a resistor network, and
    a seven segment display to test out both the hardware and the software interface.


    ##### Prototype


    ![expansion IO breadboard prototype](images/00031.jpeg)


    In my prototype I only wired up one of the SN74LS595 chips given they are both
    going to be doing the same thing. I didn''t hook up the headlights as of yet as
    they are fairly simple to wire i.e. a voltage supply, a resistor, and the LED.
    I connected the Arduino® to my laptop via USB however also used an external six
    (6) volt supply to drive the circuits on the breadboard. While none of the components
    on the breadboard would overload my USB port, if I don''t have to take chances,
    I won''t.


    ##### Circuit


    Now that I have verified my prototype, I can move forward with a full circuit
    for expanding my I/O and displaying the car''s number. The circuit consists of
    two 74LS595 shift registers along with the 7 segment displays. I am also using
    a resistor network to conserve space on my circuit board. The main circuit of
    the expansion board looks like as follows.![expansion schematic](images/00032.gif)


    ##### PCB


    The circuit board I created from the schematic looks as follows:![expansion printed
    circuit board](images/00033.gif)You will notice in both the schematic and the
    PCB I have not defined the input buttons to change the number of the car. This
    is because I am going to mount them outside of the PCB in order to prevent them
    being exposed at the derby. Once I configure the car for the right number, I don''t
    want it to change inadvertently so having them away from sight will make it a
    little easier. For the buttons, I will configure two push buttons which will simply
    allow the user to increment each digit of the 7 seven segment display individually.
    Because this is a fairly simple design we will only increment the numbers. Perhaps
    this isn''t the most user friendly design but given the numbers won''t be changing
    very often it will suffice.


    #### Software


    For this sketch I need to assign two data pins, two shift clocks, two storage
    clocks, and two pins to drive the LED''s being used as headlights. Once they are
    assigned I can then write out data to each of the shift registers in order to
    assign the proper number for the car display. I will also need to configure two
    interrupts to handle the increment of the 7 segment displays.'
