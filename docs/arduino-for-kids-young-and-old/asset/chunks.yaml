  trans: "\n\n你会注意到的一点是我正在使用 `sizeof(int)` 编译时一元操作符。这是一个非常重要的运算符，它允许代码比硬编码大小更具移植性。对于在许多\
    \ Arduino® 开发板上使用的 Atmel® 设备，整数的大小为两个（2）字节。因此，当我将整数值存储到 `EEPROM` 中时，我存储的是代表该整数的两个字节数据。在基于\
    \ ARM® 的设备 Arduino® Due 上，整数的大小为四（4）字节。通过编写代码来利用 `sizeof` 运算符，我能够使其比其他情况下更具移植性。缺点是，我存储在\
    \ `EEPROM` 中的数据通常只能由与写入设备相同整数类型的设备正确读取。对于我们的目的来说，这不是问题，因为 `EEPROM` 是设备内部的，只有这个设备会对其进行读写。如果这是一个共享内存设备，那么我们必须采取措施确保一个设备不会错误地解释数据。\n\
    \n紧随 `ReadInteger` 函数之后的是名副其实的 `WriteInteger` 函数。基本上，它的作用与前一个函数的相反，即根据传入的整数的大小将其转换为一系列字节。该代码如下：\n\
    \n```cpp\n /*\n * WriteInteger - 将整数写入非易失性存储器的辅助函数\n * Params - offset - 要存储在\
    \ EEPROM 中的偏移量\n *        - value - 要存储的值\n * Returns - 无\n */\nvoid WriteInteger(int\
    \ offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize = sizeof(int);\n\
    \n  for (int count = 0; count < intSize; count++)\n  {\n    dataValue = value\
    \ >> ((intSize - 1 - count) * 8); // 需要从左到右移位，高位在前\n    EEPROM.write(offset +\
    \ count, dataValue);\n  }\n} \n```\n\n这段代码按照 `ReadInteger` 函数预期的顺序将一系列字节写入 `EEPROM`。这允许我在微控制器重新启动时存储数据供以后使用。除了移位以存储整数的部分之外，该函数没有什么特别的。该程序的关键是将传入的整数处理成一系列字节。\n\
    \n```cpp\ndataValue = value >> ((intSize - 1 - count) * 8); // 需要从左到右移位，高位在前\n\
    EEPROM.write(offset + count, dataValue); \n```\n\n`dataValue` 变量的大小为一（1）字节。当我将整数赋值给它时，该整数将被截断以匹配接收者的大小。在这种情况下，双字节整数将转换为单字节。由于这一事实，我可以简单地赋值并写入第一个字节。在循环的第二次中，我将传入的整数右移\
    \ `8` 位，从而将高字节分配给变量 `dataValue`，允许与整数关联的数据。这是假设整数大小等于两个（2）字节。我使用 `count` 变量来确定应该移动多少位以便在\
    \ `dataValue` 中获得正确的值。你可能还会注意到我将 `sizeof` 值赋值了一个变量而不是在代码中到处使用。这实际上会让我的代码变慢一点，因为我每次引用它时都必须从内存位置读取\
    \ `intSize`。如果我在需要知道整数大小的地方直接放置 `sizeof` 运算符，那么正确的大小计算将在编译时完成，结果代码中放置的是一个常量而不是变量。当然，如果我贯穿使用\
    \ `sizeof` 运算符，代码会更快。结论是，如果你发现自己需要多次调用某个函数来获取一个可能不会改变的值，最好将其赋值给一个变量而不是反复调用函数。这是假设获取该值的函数很长，或者根据你的平台调用函数的开销很高。例如，现在访问\
    \ `EEPROM` 比访问普通内存（RAM）慢。与其每次读取亮度，我可以在程序开始时读取并将其放在可以快速访问的变量。当用户通过旋转编码器更改亮度值时，我可以更新变量并将新值写入\
    \ `EEPROM`。然而，在 `sizeof` 运算符的情况下，它不是函数调用而是一个运算符，因此评估它的花费不是问题。\n\n除了这两个函数外，还有两个存储长\
    \ 值的额外函数，它们利用了我们刚刚回顾的 `ReadInteger` 和 `WriteInteger` 函数。\n\n下一个要查看的是 `EEPROM.read(offset\
    \ + count)` 调用。此调用是我作为 `EEPROM` 库导入的 `EEPROM` 类的一部分。`read` 函数是类的一部分，知道如何从 `EEPROM`\
    \ 读取数据。在这种情况下，`EEPROM` 是我们使用的微控制器积分。整体而言，这个函数并不难理解。传入零（0）到 `EEPROM` 最大 own 减一之间的有效偏移量（因为索引是基于零（0）的），它将返回存储在指定位置的字节数据。总体来说非常简单。主要在于能够将来自\
    \ `EEPROM` 的输入字节转换为其他数据值。在这种情况下，我将它们转换为整数，这就是为什么我将根据读取的字节数将每个读取的值移位八（8）位。由于我使用了\
    \ `sizeof` 运算符，这适用于任何大小的整数。一旦我完成读取正确数量的字节，我就将完整的值返回给调用程序。\n\n所以，一旦我能够对 `EEPROM`\
    \ 读写值，我现在需要在旋转编码器每种运行时响应中断。我通过以下代码实现这一点：\n\n```cpp\nvoid HandleDecoderTrigger(void)\n\
    {\n  byte directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // 顺时针\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // 反时针\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n}\n\n  interrupts();\n} \n```\n\n"
- fmt: "This code is written with the assumption that a turn of the rotary encoder\
    \ will trigger it indicating it is time to read in the value on the secondary\
    \ pin which I am calling `directionPin`. The rotary encoder that I am using outputs\
    \ 2-bit quadrature code which consists of two (2) inputs to the `Arduino®`. The\
    \ first input is used to detect movement of the device. This is mapped to the\
    \ interrupt pin so I don't have to keep checking to see if the pin has changed.\
    \ The signal is considered on when the trigger input reaches a `LOW` value. If\
    \ the encoder is being turned clockwise, the other input will be a `HIGH` signal.\
    \ If the encoder is being turned counter-clockwise then it will be a `LOW` signal.\
    \ This allows me to both know that the encoder is being turned and to detect the\
    \ its direction of travel. Based on the direction that the encoder is being turned,\
    \ I will either increment or decrement the brightness of the LED. In order to\
    \ be safe and not have multiple overlapping calls to my interrupt routine, I disable\
    \ interrupts as I enter my decoder handler and re-enable them when I exit. The\
    \ key here is to make sure that during the time interrupts are disabled, I take\
    \ whatever necessary action there is to take, quickly. Generally it is not wise\
    \ to keep interrupts turned off for any length of time. For our setup this is\
    \ probably a moot point however it is best practice to keep interrupt routines\
    \ short and to the point. As an interesting side note, key presses on a keyboard\
    \ are typically processed as interrupts. During this time when determining which\
    \ key was pressed, you can imagine it would be good to keep the routine short\
    \ and simple. The main goal is to determine what key was pressed and pass that\
    \ on to the application to handle. Typing would be very frustrating if you had\
    \ to wait between each key press to have the computer determine what should be\
    \ done with the key value.\n\n## Fan Tachometer\n\nFor this project we will be\
    \ utilizing an interrupt to determine the speed of a fan's rotation. There are\
    \ a number of ways to detect the speed of the fan however for this project we\
    \ will be using an infrared emitter and detector much like what would be found\
    \ in a remote control device for a television or similar electronic device. In\
    \ order to do this right, we will need to have the infrared emitter on one side\
    \ of the fan and the detector on the other side such that the fan blades will\
    \ cause the detector to change state as the blades block it from receiving the\
    \ output of the transmitter. Because each fan blade will cause a pulse to occur\
    \ on the detector, we will need to know how many fan blades are on the fan and\
    \ use this number to determine how many interrupts we will be seeing for each\
    \ revolution of the fan. For the fan, we can actually use anything that will break\
    \ the connection between the emitter and the detector. A computer fan is convenient\
    \ as a number of them can accept various voltages in order to change the speed\
    \ at which it turns. However given the nature of the detection circuit, anything\
    \ that breaks the line of site between the emitter and the detector will cause\
    \ the interrupt to trigger. This can be useful in other applications such as motion\
    \ detection or obstacle detection such you might find with an automatic garage\
    \ door opener.\n\n### Required Components\n\n* `Arduino®` Board\n* Infrared Emitter\
    \ such as the [Model: 276-142](http://www.radioshack.com/product/index.jsp?productId=2049723)\n\
    * Infrared Detector such as the one included with the emitter linked above\n*\
    \ 100 Ohm resistor\n* 15K Ohm resistor\n* PC 5v fan\n\n### Tools\n\n* breadboard\n\
    * jumper wires\n* voltage meter\n\n### Schematic\n\n![Rotary encoder trigger circuit](images/00028.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created\
    \ using: [Fritzing](http://fritzing.org/)\n\n### Software\n\nFor this code, we\
    \ will configure our interrupt to trigger when the infrared detector is activated\
    \ by a fan blade moving out of the way of the infrared transmitter. In the above\
    \ image, the fan would sit between the two infrared devices. In order to see the\
    \ connections clearly, I opted to not show the fan itself on the breadboard. When\
    \ the blade of the fan stops blocking the infrared emitter, the detector is charged\
    \ which then reduces the voltage drop across the detector resulting in a transition\
    \ on the interrupt line. As the voltage across the detector drops, the voltage\
    \ into the `Arduino®` drops from a high signal to a low signal. When the next\
    \ fan blade again blocks the detector the voltage into the `Arduino®` rises triggering\
    \ our interrupt which we will configure to trigger on a `RISING` edge.\n\n```\n\
    \ /*\n * Infrared RPM - the purpose of this sketch is to configure an interrupt\
    \ to trigger\n *                when the infrared detector changes state.\n *\n\
    \ * fanBlades is the number of blades that the fan being used has.  Each fan blade\
    \ triggers\n *           the interrupt so to get an accurate reading we will need\
    \ to divide the number\n *           we obtain by the number of blades.\n *\n\
    \ * interruptId is the identifier of which interrupt we are using.  While the\
    \ interrupt itself is attached to\n *             pin two (2) of the Arduino,\
    \ the interrupt identifier is actually zero (0).\n *\n * updateFrequency is how\
    \ often we update the display with our calculated RPM's\n *\n * speedCount is\
    \ the number of times that the interrupt has been triggered since we last looked\
    \ at.\n *\n * lastCycle is the value of millis() at the last cycle so we can accurately\
    \ determine the speed based on a\n *           one second target\n */ \n```\n\n\
    ```\n const int fanBlades = 7;\nconst int interruptId = 0;\nconst int updateFrequency\
    \ = 1000;\n\nvolatile int speedCount = 0; // volatile as it will be changed by\
    \ both the interrupt and the main loop\nunsigned long lastCycle = 0; \n```\n\n\
    ```\n /*\n * Method declarations\n */ \n```\n\n```\n void infrared_trigger();\
    \ \n```\n\n```\n /*\n * infrared_trigger - this method is short as it is handled\
    \ during an interrupt\n *                    it's sole purpose is to update the\
    \ speed counter\n *\n *\n * Params - none\n *\n * Returns - nothing\n */ \n```\n\
    \n```\n void infrared_trigger()\n{\n  speedCount++;\n} \n```\n\n```\n /*\n * Setup\
    \ - main configuration point of our sketch to configure\n *         the Arduino\
    \ for serial port reporting, setting our\n *         default values, and enabling\
    \ our interrupt.\n *\n * Params - none\n *\n * Returns - nothing\n */ \n```\n\n\
    ```\n void setup()\n{\n  // Setup the serial port to report our fan RPM value\n\
    \  Serial.begin(9600);\n\n  lastCycle = millis();  // get a starting value prior\
    \ to turning the interrupt on\n\n  // We will use the rising edge which correlates\
    \ to the fan blade blocking the infrared detector\n  attachInterrupt(interruptId,\
    \ infrared_trigger, RISING);  \n} \n```\n\n```\n\n /*\n * loop - main method which\
    \ will be called each time the\n *        Arduino goes through its main loop to\
    \ check the\n *        amount of time since it last looked an if our\n *     \
    \   update frequency has been exceeded, we will then\n *        report the rotations\
    \ per minute scaled by 60\n *        since we are reporting the value every second.\n\
    \ *\n * Params - none\n *\n * Returns - nothing\n */ \n```\n\n void loop()\n{\n\
    \  // Implementation would go here\n}\n```\n"
