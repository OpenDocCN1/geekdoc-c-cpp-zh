  trans: "\n\n你可能已经注意到了一点，对于每一个 `float` 类型的变量，我都在声明末尾添加了一个 `f`。这被称为后缀，我倾向于在赋值给 `float`\
    \ 的任何值上使用它。默认情况下，编译器会将小数值视为 `double` 类型，因此在从草图（sketch）构建应用程序时，它会将值从 `double` 转换为\
    \ `float`。对于 Arduino® 来说，这并不是一个问题，因为 `float` 和 `double` 是等价的。在 `double` 确实不同的系统上，编译器可能会产生编译错误，因为看起来你正尝试将一个\
    \ `double` 值赋值给 `float` 变量。这将是最好的情况，因为你至少有机会查看它，并判断代码中是否存在错误。某些编译器可能会自动为你将值转换为\
    \ `float`，从而可能导致精度损失。\n\n## 方法声明 (Method Declarations)\n\n我的草图的下部分是方法声明或函数原型，采用类似于\
    \ C 语言中的命名方式。这些声明告知编译器可以使用哪些方法，以及在调用方法时传递了什么类型的变量，以及如果有返回值，返回的值是什么类型。虽然从技术上讲，你不需要在方法声明中给出变量（即参数）名称，但这样做是一个良好的习惯，以便查看代码的人能更好地理解传递到方法中的值。唯一的例外是\
    \ `setup` 和 `loop` 方法，它们是在你的草图之外为你声明的。\n\n```\n float getTemperature(float temperatureVoltage);\n\
    \ float convertTemperatureToF(float temperatureInCelsius);\n float convertTemperatureToC(float\
    \ temperatureInFahrenheit); \n```\n\n在这个草图中，我声明了三个可能想要使用的方法。尽管最后我并只会使用其中两个，但为了完整性，我声明了所有三个。由于我要查看的是以微伏级顺序变化的值，我需要一种能够表示像\
    \ `float` 这样的小数值的数据类型。第一个方法将原始电压读取值转换为摄氏度温度，而另外两个将在华氏度和摄氏度之间进行温度转换。\n\n## 用户方法\
    \ (User Methods)\n\n上面声明的方法现在出现在代码中，这就是我将定义每个方法实际作用的地方。我的最终目标是让这段代码有足够的注释，清晰地说明其意图行为。\n\
    \n```\n /*\n  * getTemperature - 根据输入的电压值确定摄氏温度，\n  *         假设 2.73v 等于 0°C\n\
    \  *\n  * Params - temperatureVoltage - 代表温度的输入电压\n  *\n  * Returns - float -\
    \ 根据输入电压得到的实际摄氏温度\n  */\n\n float getTemperature(float temperatureVoltage)\n {\n\
    \   float currentTemperature = 0.0f;\n\n   // 根据数据手册，每 10 mv 等于 1 °K - 0°C 是 273°K\
    \ 等于 2.73v\n   // 温度缩小了 100 倍，将其从开尔文度转换为摄氏度标\n   currentTemperature = (temperatureVoltage\
    \ - baseVoltage) * 100;\n\n   return currentTemperature;\n } \n```\n\n在上面的代码中，我有一个方法\
    \ `getTemperature`，它接受电压单位的温度读取值并将其转换为摄氏度值。我可以直接将读取的值转换为华氏度，但并不是每个人都熟悉华氏度量，而且摄氏度更接近原始值，如果数值看起来与预期值不符，调试会更容易。。原始温度值是我从\
    \ Arduino® 的模拟输入引脚读取的值。虽然我可以将其保持为电压读取值，但如果它是我所熟悉的测量单位，对我来说更容易联系到该值。在这种情况下，使用温度单位比使用原始电压值容易得多。\n\
    \n```\n /*\n  * convertTemperatureToF - 将温度从摄氏度转换为华氏度\n  *\n  * Params - temperatureInCelsius\
    \ - 输入的摄氏温度\n  *\n  * Returns - float - 以华氏度表示的温度\n  */\n\n float convertTemperatureToF(float\
    \ temperatureInCelsius)\n {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature\
    \ = (temperatureInCelsius * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n\
    \ } \n```\n\n此方法将摄氏度温度转换为华氏度。\n\n```\n /*\n  * convertTemperatureToC - 将温度从华氏度转换为摄氏度\n\
    \  *\n  * Params - temperatureInCelsius - 输入的华氏度温度（注：此处原文变量名似乎有误*）\n  *\n  * Returns\
    \ - float - 以摄氏度表示的温度\n  */\n\n float convertTemperatureToC(float temperatureInFahrenheit)\n\
    \ {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature = (temperatureInFahrenheit\
    \ - CtoFDelta) * FtoCConversion;\n\n   return convertedTemperature;\n } \n```\n\
    \n此方法将华氏度温度转换为摄氏度。\n\n## 设置 (Setup)\n\n再次，`setup` 方法是我配置 Arduino® 以按照我需要的方式运行的地方。在这种情况下，我希望将模拟参考电压设置为默认值，对于\
    \ Arduino® UNO 或 Arduino® MEGA 来说，该值为 5.0v。这告诉微控制器我想测量 0v 到 5.0v 范围内的电压。对于我们的目的，这个分辨率足够了。\n\
    \n```\n void setup()\n {\n   analogReference(DEFAULT);\n   Serial.begin(9600);\n\
    \ } \n```\n\n我说的分辨率是指什么意思？嗯，Atmel® 微控制器中的模数转换器具有 10 位数据精度。对于 5.0v 的电压范围，这意味着模数转换器的每个步长代表\
    \ 5.0v / 1024，即 0.004882825 伏。模数转换器的每次递增，其代表的电压就会增加 0.004882825 伏。我在这里还配置了串口，以便将示例数据写入我的开发系统以验证数据是否合适。\n\
    \n## 循环 (Loop)\n\n`loop` 方法再次是完成所有实际工作的地方。在这里我也在代码中使用注释来解释每项操作，以便下一个查看这段代码的人不需要我的帮助就能理解它。\n\
    \n```\n void loop()\n {\n   int    temperatureValue = 0;\n   float  currentTempVoltage\
    \ = 0.0f;\n   float  currentTemperature = 0.0f;\n\n   // 读取温度值，范围从 0 到 1023\n\
    \   temperatureValue = analogRead(temperaturePin);\n\n   // 将输入的电压表示转换为我们可以利用的值\n\
    \   currentTempVoltage = ((float)temperatureValue * voltageReference) / maxSampleCount;\n\
    \n   // 我们现在得到了以摄氏度表示的当前温度\n   currentTemperature = getTemperature(currentTempVoltage);\n\
    \n   // 以摄氏度和华氏度打印当前温度\n   Serial.print(\"The current temperature is: \");\n \
    \  Serial.print(currentTemperature);\n   Serial.print(\"°C which is \");\n   Serial.print(convertTemperatureToF(currentTemperature));\n\
    \   Serial.println(\"°F\");\n\n   // 休息一秒并再次检查\n   delay(1000);\n } \n```\n"
- fmt: "\nThe first thing that is done is to read in the current temperature value\
    \ in volts as a digital representation. Once a value has been read, it can then\
    \ be converted for display to the end user. In the above code, I first convert\
    \ the temperature from a digital representation to an actual temperature. Given\
    \ the `LM335` is designed to be sensitive to 1°Kelvin which represents 10 milli-volts\
    \ (`mV`) for each one degree Kelvin of change, I will convert from the digital\
    \ representation to a Celsius temperature value. So how did I go from Kelvin to\
    \ Celsius? Kelvin has the same scale as Celsius however it starts at absolute\
    \ zero and continues up on the same scale. With absolute zero being `-273.0°C`,\
    \ I simply use this value to convert from Kelvin to Celsius. Once I have done\
    \ that, I can then use one of my methods I declared above to convert from the\
    \ Celsius value to Fahrenheit. Once I have my values in the units of measure that\
    \ I want, I can then print them to the serial port for verification on my development\
    \ system.\n\nA sample of the output generated by this sketch is as follows:\n\n\
    ```\n The current temperature is: 26.61C which is 79.90F\n The current temperature\
    \ is: 26.12C which is 79.02F\n The current temperature is: 26.12C which is 79.02F\n\
    \ The current temperature is: 26.12C which is 79.02F\n The current temperature\
    \ is: 28.08C which is 82.54F\n The current temperature is: 29.05C which is 84.30F\n\
    \ The current temperature is: 29.54C which is 85.17F\n The current temperature\
    \ is: 28.56C which is 83.42F\n The current temperature is: 28.08C which is 82.54F\n\
    \ The current temperature is: 27.59C which is 81.66F \n```\n\nAs you can see in\
    \ the above data, my temperature readings are in the expected range i.e. room\
    \ temperature or close to it depending on the room etc. Also you should note that\
    \ I placed my finger on the device during the output display which is why the\
    \ temperature started to rise and then began to fall once I removed my finger\
    \ from the device. I did this to ensure that the circuit and code were working\
    \ as expected. The only thing I have not done is to calibrate my temperature device\
    \ to ensure it is reading the correct value. This is done by connecting the `ADJ`\
    \ pin of the temperature sensor to a potentiometer and than fine tuning the input\
    \ to the current room temperature.\n\n![LM335 Temperature sensor circuit](images/00019.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created\
    \ using: [Fritzing](http://fritzing.org/)\n\nIn the above circuit diagram you\
    \ can see where I have placed a potentiometer attached to the `ADJ` input of the\
    \ temperature sensor to allow me to calibrate it to the current room temperature.\
    \ While not overly critical for what we are doing, having the ability to do this\
    \ will be crucial when we want to use the same basic circuit to monitor temperatures\
    \ with a suitable level of accuracy.\n\nFor analog inputs, that covers it for\
    \ the most part. There are more fine details that could be discussed such as over\
    \ voltage prevention, static electricity, etc. however as an introduction, I think\
    \ we have the basics covered. One thing you may have noticed is that under tools,\
    \ I mentioned a voltage meter however did not mention when it should be used.\
    \ The voltage meter is one of those tools that I have handy whenever something\
    \ doesn't look right. For sanity sake, I can use the voltage meter to ensure that\
    \ I have wired my `LM335` correctly and it is measuring a voltage in the general\
    \ range I expect. Typical voltage meters are actually multimeters which can measure\
    \ in addition to voltage, current and resistance. One such feature on my multimeter\
    \ is the continuity check where I can ensure that I have wired things properly\
    \ by checking two points and audibly verifying that I have continuity between\
    \ them. So while I may mention that a voltage meter or multimeter is one of the\
    \ tools recommended, I may not indicate when I use it. Basically it is one of\
    \ those tools that you should have for whatever circumstances come up.\n\n###\
    \ Digital Input\n\nFor digital inputs, the Arduino® has a number of pins available\
    \ to accomplish this. When we say digital input, we are referring to the micro-controller\
    \ being able to recognize an incoming signal as either `HIGH` or `LOW`. For the\
    \ devices we are looking at, this would be equivalent to zero (`0`) volts representing\
    \ a `LOW` value and five (`5`) volts representing a `HIGH` value. The main thing\
    \ to remember with digital inputs is that the value to trigger either a `HIGH`\
    \ or `LOW` is not exact. There is a range of values that will cause the input\
    \ to be `HIGH` or `LOW`. The datasheet indicates that a `LOW` signal is anything\
    \ from `-0.5v` through `1.5v` when the micro-controller is powered by `5v`. The\
    \ datasheet also indicates that a `HIGH` signal is anything from `3.0v` through\
    \ `5.5v` when the micro-controller is powered by `5v`. The main thing to note\
    \ is that any voltage between `1.5v` and `3.0v` will be undefined and should be\
    \ avoided to prevent unexpected application execution. Using our last example,\
    \ I am now going to create a circuit and sketch that will only trigger when the\
    \ temperature reaches a certain value such as `80°F` which would be `26.67°C`.\n\
    \n* the Arduino® UNO runs on 5 volts hence the value when set to `HIGH` will be\
    \ 5 volts. Other boards, such as the [Arduino Due](http://arduino.cc/en/Main/ArduinoDue),\
    \ run at 3.3v.\n\n#### Temperature Comparison\n\nFirst we will develop a circuit\
    \ that will trigger when a temperature is reached. For this circuit, we want it\
    \ to trigger `80°F` which is `26.67°C`. Using what we know about the `LM335`,\
    \ `0°C` increases the voltage by `10mV`. If we divide `26.67` by `100` to get\
    \ it into the `10mV` range, our target voltage across the `LM335` will be `2.9967v`.\
    \ Oddly enough this is enough to trigger our digital input to the `HIGH` value\
    \ in the required range which is above `3.0v`.\n\n##### Required Components\n\n\
    *   Arduino® Board\n*   4.7K Ohm Resistor\n*   (2) 10K potentiometers\n*   `LM335`\
    \ temperature sensor\n*   `LM311` voltage comparator\n\n##### Tools\n\n*   breadboard\n\
    *   jumper wires\n*   voltage meter\n\n##### Schematic\n\nFor this schematic we\
    \ will be using the circuit from before however this time we will be using a voltage\
    \ comparator to compare our temperature voltage with our target voltage. As noted\
    \ above, our target is `2.9967v`. First we will need to wire up a voltage dividing\
    \ circuit. We will want to use a 4.7K Ohm resistor in series with a 10K potentiometer.\
    \ This will allow us to adjust the voltage across the potentiometer to our target\
    \ voltage. In order to fine tune the target voltage, we can do one of two things.\
    \ First we can use the analog pin of our Arduino® to read in the voltage drop\
    \ across our trim potentiometer. This will require a little coding but will work\
    \ fine. The other option is to use a multimeter to monitor the voltage across\
    \ the potentiometer and fine tune it using that reading. Either is fine depending\
    \ on what tools you have available. This connection will be wired into the voltage\
    \ comparator. For the second half of our circuit, will be connecting the `LM335`\
    \ temperature sensor into the other input of the voltage comparator which will\
    \ trigger an input of `HIGH` when our target voltage is reached. It will drop\
    \ back to `LOW` once the temperature cools down.\n\n![LM335 Temperature triggering\
    \ circuit](images/00020.jpeg)\n"
