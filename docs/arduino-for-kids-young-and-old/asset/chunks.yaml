  trans: "\n`delay` 方法用于停止执行一段时间。当我说停止执行时，我的真实意思是停止执行你代码的执行。然而，微控制器仍在处理数据，但你的代码将暂停，直到\
    \ `delay` 方法完成。对于这个示例，使用 `delay` 是可以的，但稍后我们将会探索处理此情况的更好方法。尽管如此，我为什么要在代码中使用 `delay`\
    \ 呢？记住，`loop` 方法执行得非常频繁，我们希望能够看到 LED 点亮和熄灭。指定的 `delay` 值为 500。这个值以毫秒为单位，也就是说微控制器应该暂停多少个\
    \ 1/1000 秒（0.001）秒。对于上面的示例，我们暂停了 500 毫秒，即 1/2 秒。结果是 LED 将开启 1/2 秒，然后再次关闭约 1/2\
    \ 秒。我之所以这么说是因为我在第二个 `delay` 之后还有另一行代码，它的执行需要一些时间并会偏斜时间。我可以尝试通过将第二个 `delay` 减少到\
    \ 499 毫秒来补偿，但除非我确切知道最后一行代码执行需要多长时间，否则这只是猜测。我还需要考虑执行代码的是哪一个微控制器，以及该微控制器的速度。总之，要正确地做到将是一个巨大的挑战。当我们谈到最后一行代码时，它的目的只是给我们提供反馈，说明\
    \ `loop` 正常工作且我们的板功能正常。通常我不会这样做，因为它会填满通信缓冲区，如果我 `delay()`，我们将很快用同样没太大帮助的信息填满监视器缓冲区。这是一个你希望谨慎放置调试（即信息输出数据）位置的典型示例。\n\
    \n```\n Serial.println(\"Led 13 has been toggled on and off.\"); \n```\n\n`Serial`\
    \ 类有许多方法，其中一个在上面的代码段所示。这个特定版本用于打印整行文本，包括换行符，因此下一行将从新行开始。有一个相关的方法 `Serial.print`，它以非常相似的方式打印文本，但不会包含换行符。当你想要在同一行中打印多个项目时，它是很有用的，例如：\n\
    \n```\n Serial.print(\"Led: \");\n   Serial.print(13);\n   Serial.println(\" has\
    \ been toggled on and off.\"); \n```\n\n上面的代码将产生相同的输出，但我可以很容易将数字 13 替换为变量，以便将此代码用于任何引脚。\n\
    \n### 总结\n\n综而言，一个 Arduino® 图程序（sketch）由两个方法组成：`setup` 方法和 `loop` 方法。`setup` 方法用于配置你的\
    \ Arduino® 如何运行，而 `loop` 方法是在应用程序生命周期内完成所有工作的地方。此外，还有内置的常量和类，例如 `Serial` 类，可以协助调试或向用户传递信息。\n\
    \n![章节结束图形](img/00001.jpeg)\n\n# 输入\n\n## 监控我们的周围环境\n\n现在 Arduino® 已经设置并准备就绪，我们可以深入研究更有趣的话题。其中之一是输入系统，它允许我们利用各种模拟和数字设备来监控周围环境。在接下来的章节中，我们将查看来自各种设备的模拟和数字输入，这允许我们解释周围环境并在各种事件发生时采取行动。\n\
    \n### 模拟输入\n\nArduino® 有几个模拟引脚，可以读取特定设备的电压电平以确定其值。可用的引脚实际数量取决于你购买的板上内置了哪种 AVR\
    \ 微控制器。尽管如此，基本操作将是相同的。模拟输入引脚具有 10 位分辨率，这意味着每个引脚可以检测到多达 1024 级电压。这些值以地为基底（即没有电压输入），最高到五（5）伏（这是微控制器的最大电压）。你也可以将电压范围的顶部限制为小于\
    \ 5 伏的值，但对于接下来的示例，这是没有必要的。当读取模拟输入时，它实际上是在使用一种类似于天平的标尺来确定该值。想象你有一个地下室正在被淹没，有一个通往一楼的楼梯。你可能想知道的是水有多深，水上升得有多快？对于水深，如果你恰好知道楼梯每个台阶之间的距离，那就太简单了。在这种情况下，你只需要数一下有多少个台阶被水覆盖，并进行一些简单的算术来确定水深。奇怪的是，Arduino®\
    \ 正在做非常相似的事情。它有一个内置标尺，将其内部值与来自模拟引脚的值进行比较。在每个周期中，设备都会增加电压并与输入电压进行比较。它知道自开始比较以来已经过了多少个周期，因此一旦它们相等，微控制器就知道了外部电压的值。微控制器具有\
    \ 10 位分辨率，这意味着它可以从零 (0) 一数到 1023，以找到与模拟输入引脚读取值匹配的值。使用上面的类比，这就像微控制器有一个有 1024 个台阶的楼梯，将地板计为第一阶（1）。在这种情况下，第一阶等于零（0）伏，而\
    \ 1024 阶等于五（5）伏。你可以看到，使用 10 位模拟数转换器具有相当的精度。这种转换器的缺点是，从零 (0) 计数到代表输入电压的值需要时间。就像地下室水上升的速度一样，每个电压值与下一个更高值的比较需要时间，微控制器确定等效电压。对于给设备，这可能高达\
    \ 260 微秒。在人类时间中，这大约是 1/4 毫秒，反过来又是一秒的 1/1000（0.001）。这样来看，对于我们要做的事来说足够快了。说到我们要做的事，第一件事是确定房间的温度。\n\
    \n* 对于 Arduino UNO 和 MEGA，读取的最大电压是 5 伏，但在某些系统上，最大电压可能较低，例如 3.3 伏甚至 1.8 伏。\n\n\
    #### 温度读取\n\n我们将首先查看如何读取温度值，然后能够根据其值或其与初始值的差对其做出反应。幸运的是，有特定的设备随着周围温度的升高而增加电压。知道这一点，我们可以将这些设备之一连接到我们的\
    \ Arduino® 并读取值以确定当前温度。\n\n##### 所需组件\n\n*   Arduino® 板\n\n*   4.7K 欧电阻\n\n* \
    \  LM335 温度传感器[7] 或类似的设备如 NTE7225[8]\n\n##### 工具\n\n*   面包板\n\n*   跳线导\n\n*  \
    \ 电压表\n\n##### 电路图\n\n"
- fmt: "\nFor this circuit, you will need to run 5 volts from the Arduino® to the\
    \ first lead of the `4.7K Ohm` resistor. The second lead of the `4.7K Ohm` resistor\
    \ is connected to pin two (2) of the `LM335`. The third pin of the `LM335` is\
    \ connected to ground from the Arduino®. The final wire is connected from pin\
    \ two (2) of the `LM335` back to analog input zero (0) of the Arduino® in order\
    \ to read the voltage drop across the `LM335` as it pertains to the current temperature.![LM335\
    \ Temperature sensor circuit](images/00018.jpeg)\n\n![Creative Commons - Attribution\
    \ - Share Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \n## Software\n\nThe following is the code that is necessary to read in the analog\
    \ voltage across the `LM335` and display it to the serial port for review. Once\
    \ we have our circuit working and the temperature values available, we will be\
    \ able to further enhance the software and hardware to perform some useful functions.\n\
    \nFor this sketch, I am using the well known formulas to convert from Celsius\
    \ to Fahrenheit and from Fahrenheit to Celsius. These formulas are as follows:\n\
    \n```\n Celsius = ((Fahrenheit - 32) x 5) / 9\n Fahrenheit = ((Celsius x 9) /\
    \ 5) + 32 \n```\n\n```cpp\n /*\n  * The temperature pin is where the input from\
    \ the LM335 will be read from.\n  * The base voltage is what the device (LM335)\
    \ will measure at 0°C\n  * The voltage reference is the max voltage that can be\
    \ read in on the\n  * analog input pin\n  * The max sample count is the highest\
    \ value that could be read in on the\n  * analog input pin which will equal the\
    \ voltage reference\n  * The c to f conversion is the well known formula of multiplying\
    \ the\n  * C temp by 9 then dividing by 5\n  * The f to c conversion is the well\
    \ known formula of multiplying the\n  * F temp by 5 then dividing by 9\n  * The\
    \ c to f delta is the difference between C and F at the freezing temperature\n\
    \  */        \n const int temperaturePin = 0;\n const float baseVoltage = 2.730f;\
    \ /* 2.730V at 0°C */\n const float voltageReference = 5.0f;\n const float maxSampleCount\
    \ = 1023.0f;\n const float CtoFConversion = 9.0f / 5.0f;\n const float FtoCConversion\
    \ = 5.0f / 9.0f;\n const float CtoFDelta = 32.0f;\n\n /*\n  * Method declarations\n\
    \  */\n\n float getTemperature(float temperatureVoltage);\n float convertTemperatureToF(float\
    \ temperatureInCelsius);\n float convertTemperatureToC(float temperatureInFahrenheit);\n\
    \n /*\n  * getTemperature - determines the temperature in celsius based on the\n\
    \  *         incoming voltage value assuming 2.73v equals 0°C\n  *\n  * Params\
    \ - temperatureVoltage - the incoming voltage representing the temperature\n \
    \ *\n  * Returns - float - the actual temperature in celsius based on the incoming\
    \ voltage\n  */\n\n float getTemperature(float temperatureVoltage)\n {\n   float\
    \ currentTemperature = 0.0f;\n\n   // From the datasheet, every 10 mv is equal\
    \ to 1 °K - 0°C is 273°K equal to 2.73v\n   // Temperature is scaled by 100 to\
    \ bring it into the celsius scale from kelvin\n   currentTemperature = (temperatureVoltage\
    \ - baseVoltage) * 100;\n\n   return currentTemperature;\n }\n\n /*\n  * convertTemperatureToF\
    \ - converts the temperature from Celsius to Fahrenheit\n  *\n  * Params - temperatureInCelsius\
    \ - the incoming temperature in Celsius\n  *\n  * Returns - float - the temperature\
    \ expressed in Fahrenheit\n  */\n\n float convertTemperatureToF(float temperatureInCelsius)\n\
    \ {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature = (temperatureInCelsius\
    \ * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n }\n\n /*\n\
    \  * convertTemperatureToC - converts the temperature from Fahrenheit to Celsius\n\
    \  *\n  * Params - temperatureInCelsius - the incoming temperature in Fahrenheit\n\
    \  *\n  * Returns - float - the temperature expressed in Celsius\n  */\n\n float\
    \ convertTemperatureToC(float temperatureInFahrenheit)\n {\n   float convertedTemperature\
    \ = 0.0f;\n\n   convertedTemperature = (temperatureInFahrenheit - CtoFDelta) *\
    \ FtoCConversion;\n\n   return convertedTemperature;\n }\n\n /*\n  * Setup - main\
    \ configuration point of our sketch to configure\n  *         the Arduino for\
    \ analog input\n  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\n void\
    \ setup()\n {\n   analogReference(DEFAULT);\n   Serial.begin(9600);\n }\n\n /*\n\
    \  * loop - main method which will be called each time the\n  *        Arduino\
    \ goes through its main loop to read the\n  *        current temperature value\n\
    \  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\n void loop()\n {\n\
    \   int    temperatureValue = 0;\n   float  currentTempVoltage = 0.0f;\n   float\
    \  currentTemperature = 0.0f;\n\n   // Read in the temperature value which will\
    \ be in a range from 0 to 10\n   temperatureValue = analogRead(temperaturePin);\n\
    \n   // Convert our incoming voltage to celsius\n   currentTemperature = getTemperature(currentTempVoltage);\n\
    \n   // Print out the current temperature in C and F\n   Serial.print(\"The current\
    \ temperature is \");\n   Serial.print(currentTemperature);\n   Serial.print(\"\
    °C which is \");\n   Serial.print(convertTemperatureToF(currentTemperature));\n\
    \   Serial.println(\"°F\");\n\n   delay(1000);\n }\n```\n\n## Constants\n\nIn\
    \ the above code snippet, I have declared each variable as `const` indicating\
    \ that the value will remain constant for the life of the application. Basically\
    \ I am telling the compiler that I want to be able to read the value stored in\
    \ the variable however I never want to change it during the lifetime of my application\
    \ by writing to it. Given the type of values I am using, there is no reason to\
    \ change them while the application is being executed. My main goal with these\
    \ variables is to have human readable names assigned to the values so that my\
    \ application is easier to understand. As shown in the second section, I could\
    \ have also declared these constants using the defines which would also make my\
    \ code readable and maintainable. In doing so, however, I lose the type information\
    \ of each of the values which may or may not be of interest to you the developer.\
    \ On the flip side, the use of `#define` could reduce the amount of RAM that is\
    \ used for your sketch.\n"
  raw: "For this circuit, you will need to run 5 volts from the Arduino® to the first\
    \ lead of the 4.7K Ohm resistor. The second lead of the 4.7K Ohm resistor is connected\
    \ to pin two (2) of the LM335\\. The third pin of the LM335 is connected to ground\
    \ from the Arduino®. The final wire is connected from pin two (2) of the LM335\
    \ back to analog input zero (0) of the Arduino® in order to read the voltage drop\
    \ across the LM335 as it pertains to the current temperature.![LM335 Temperature\
    \ sensor circuit](images/00018.jpeg)\n\n![Creative Commons - Attribution - Share\
    \ Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \n##### Software\n\nThe following is the code that is necessary to read in the\
    \ analog voltage across the LM335 and display it to the serial port for review.\
    \ Once we have our circuit working and the temperature values available, we will\
    \ be able to further enhance the software and hardware to perform some useful\
    \ functions.\n\nFor this sketch, I am using the well known formulas to convert\
    \ from Celsius to Fahrenheit and from Fahrenheit to Celsius. These formulas are\
    \ as follows:\n\n```\n Celsius = ((Fahrenheit - 32) x 5) / 9\n Fahrenheit = ((Celsius\
    \ x 9) / 5) + 32 \n```\n\n```\n /*\n  * The temperature pin is where the input\
    \ from the LM335 will be read from.\n  * The base voltage is what the device (LM335)\
    \ will measure at 0°C\n  * The voltage reference is the max voltage that can be\
    \ read in on the\n  * analog input pin\n  * The max sample count is the highest\
    \ value that could be read in on the\n  * analog input pin which will equal the\
    \ voltage reference\n  * The c to f conversion is the well known formula of multiplying\
    \ the\n  * C temp by 9 then dividing by 5\n  * The f to c conversion is the well\
    \ known formula of multiplying the\n  * F temp by 5 then dividing by 9\n  * The\
    \ c to f delta is the difference between C and F at the freezing temperature\n\
    \  */        \n const int temperaturePin = 0;\n const float baseVoltage = 2.730f;\
    \ /* 2.730V at 0°C */\n const float voltageReference = 5.0f;\n const float maxSampleCount\
    \ = 1023.0f;\n const float CtoFConversion = 9.0f / 5.0f;\n const float FtoCConversion\
    \ = 5.0f / 9.0f;\n const float CtoFDelta = 32.0f;\n\n /*\n  * Method declarations\n\
    \  */\n\n float getTemperature(float temperatureVoltage);\n float convertTemperatureToF(float\
    \ temperatureInCelsius);\n float convertTemperatureToC(float temperatureInFahrenheit);\n\
    \n /*\n  * getTemperature - determines the temperature in celsius based on the\n\
    \  *         incoming voltage value assuming 2.73v equals 0°C\n  *\n  * Params\
    \ - temperatureVoltage - the incoming voltage representing the temperature\n \
    \ *\n  * Returns - float - the actual temperature in celsius based on the incoming\
    \ voltage\n  */\n\n float getTemperature(float temperatureVoltage)\n {\n   float\
    \ currentTemperature = 0.0f;\n\n   // From the datasheet, every 10 mv is equal\
    \ to 1 °K - 0°C is 273°K equal to 2.73v\n   // Temperature is scaled by 100 to\
    \ bring it into the celsius scale from kelvin\n   currentTemperature = (temperatureVoltage\
    \ - baseVoltage) * 100;\n\n   return currentTemperature;\n }\n\n /*\n  * convertTemperatureToF\
    \ - converts the temperature from Celsius to Fahrenheit\n  *\n  * Params - temperatureInCelsius\
    \ - the incoming temperature in Celsius\n  *\n  * Returns - float - the temperature\
    \ expressed in Fahrenheit\n  */\n\n float convertTemperatureToF(float temperatureInCelsius)\n\
    \ {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature = (temperatureInCelsius\
    \ * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n }\n\n /*\n\
    \  * convertTemperatureToC - converts the temperature from Fahrenheit to Celsius\n\
    \  *\n  * Params - temperatureInCelsius - the incoming temperature in Fahrenheit\n\
    \  *\n  * Returns - float - the temperature expressed in Celsius\n  */\n\n float\
    \ convertTemperatureToC(float temperatureInFahrenheit)\n {\n   float convertedTemperature\
    \ = 0.0f;\n\n   convertedTemperature = (temperatureInFahrenheit - CtoFDelta) *\
    \ FtoCConversion;\n\n   return convertedTemperature;\n }\n\n /*\n  * Setup - main\
    \ configuration point of our sketch to configure\n  *         the Arduino for\
    \ analog input\n  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\n void\
    \ setup()\n {\n   analogReference(DEFAULT);\n   Serial.begin(9600);\n }\n\n /*\n\
    \  * loop - main method which will be called each time the\n  *        Arduino\
    \ goes through its main loop to read the\n  *        current temperature value\n\
    \  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\n void loop()\n {\n\
    \   int    temperatureValue = 0;\n   float  currentTempVoltage = 0.0f;\n   float\
    \  currentTemperature = 0.0f;\n\n   // Read in the temperature value which will\
    \ be in a range from 0 to 1023\n   temperatureValue = analogRead(temperaturePin);\n\
    \n   // Convert our incoming voltage representation to a value we can utilize\n\
    \   currentTempVoltage = ((float)temperatureValue * voltageReference) / maxSampleCount;\n\
    \n   // We now have the current temperature expressed in celsius\n   currentTemperature\
    \ = getTemperature(currentTempVoltage);\n\n   // Print out the current temperature\
    \ in both C and F\n   Serial.print(\"The current temperature is: \");\n   Serial.print(currentTemperature);\n\
    \   Serial.print(\"°C which is \");\n   Serial.print(convertTemperatureToF(currentTemperature));\n\
    \   Serial.println(\"°F\");\n\n   // Rest for a second and check again\n   delay(1000);\n\
    \ } \n```\n\n###### Constants\n\nIn the beginning of this sketch I have declared\
    \ some constant values which I will use later on in my code. As I mentioned previously,\
    \ it is better to declare these values as constant that way you get the benefit\
    \ of meaningful names in your code which helps in the overall readability of your\
    \ sketch along with the ability to change the value as needed later on without\
    \ trying to find everywhere it is used in your code. It should be noted that you\
    \ could also declare these values as defines which act as constants and are replaced\
    \ in your code by the [Pre-processor](http://en.wikipedia.org/wiki/C_preprocessor)\
    \ when you compile the code.\n\n```\n const int temperaturePin = 0;\n const float\
    \ baseVoltage = 2.730f; /* 2.730V at 0°C */\n const float voltageReference = 5.0f;\n\
    \ const float maxSampleCount = 1023.0f;\n const float CtoFConversion = 9.0f /\
    \ 5.0f;\n const float FtoCConversion = 5.0f / 9.0f;\n const float CtoFDelta =\
    \ 32.0f;\n\n #define temperaturePin \t0\n #define baseVoltage \t\t2.730f /* 2.730V\
    \ at 0°C */\n #define voltageReference \t5.0f\n #define maxSampleCount \t1023.0f\n\
    \ #define CtoFConversion \t9.0f / 5.0f\n #define FtoCConversion \t5.0f / 9.0f\n\
    \ #define CtoFDelta \t\t\t32.0f \n```\n\nIn the above code snippet, I have declared\
    \ each variable as const indicating that the value will remain constant for the\
    \ life of the application. Basically I am telling the compiler that I want to\
    \ be able to read the value stored in the variable however I never want to change\
    \ it during the lifetime of my application by writing to it. Given the type of\
    \ values I am using, there is no reason to change them while the application is\
    \ being executed. My main goal with these variables is to have human readable\
    \ names assigned to the values so that my application is easier to understand.\
    \ As shown in the second section, I could have also declared these constants using\
    \ the #define pre-processor directive which would also make my code readable and\
    \ maintainable. In doing so, however, I lose the type information of each of the\
    \ values which may or may not be of interest to you the developer. On the flip\
    \ side, the use of #define could reduce the amount of RAM that is used for your\
    \ sketch."
