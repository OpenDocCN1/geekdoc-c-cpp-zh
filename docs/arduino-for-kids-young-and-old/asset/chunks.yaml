    # D. W. Milligan


    ## 从编程到摄影


    ![D. W. Milligan - 作者](img/00038.jpeg)


    作者出生并成长于缅因州，在大自然中长大。冬天很长，夏天很短，但通常有时间度过良好的钓鱼日。作者目前与妻子孩子住在弗吉尼亚州夏洛特斯郊外。他是一位软件架构师，对风景摄影和计算机有浓厚兴趣。书中使用的设备如下：Macintosh
    Macbook Pro，用于预览的第 3 代 iPad，以及所需的咖啡和其他咖啡因饮料。


