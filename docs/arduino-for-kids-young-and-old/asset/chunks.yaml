    \n*   ** an Arduino® kit such as this one from [MakerSHED](http://www.makershed.com/Getting_Started_with_Arduino_Kit_V3_0_p/msgsa.htm)\n\
    \n*   *** a breadboard for prototyping circuits\n\n*   *** jumper wires for connecting\
    \ the various parts of your circuits together and to the Arduino®\n\n*   A +5v\
    \ power supply able to deliver 2 Amps of current such as: [5v 2A Supply](http://www.adafruit.com/products/276).\n\
    \n*   and a comfortable chair\n\n** Electronic components are very susceptible\
