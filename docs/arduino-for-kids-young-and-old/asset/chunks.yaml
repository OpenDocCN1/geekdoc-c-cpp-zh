  trans: "\n此许多代码，例如 EEPROM 库，已经在之前的章节中介绍过了。这里有两个关键点需要注意。第一个是包含了我编写的一个库，用于配合 Seeed\
    \ Studio 的蓝牙®模块工作，你可以在 [GitHub](https://github.com/milligan2296/Arduion-BT-Module)\
    \ 上找到。该库在 GitHub 上免费提供，供他人使用和改进。第二个关键点是我创建的状态机（State Machine），用于跟踪我的蓝牙® 连接状态。这允许软件开发者创建一个指令列表（即状态），让系统在处理时遵循这些状态，以完成一个完整的任务。基本上，状态机的每一步都是一个任务，在大多数情况下，在上一个任务完成之前无法进行。状态机的精妙之处在于可以从一个状态跳转到另一个状态，以便重新执行某些操作或处理错误情况等。它与\
    \ Arduino® 的 `loop()` 函数非常契合。由于 `loop` 是连续调用的，因此很容易创建一个状态机，随着循环的运行从一个状态进展到下一个状态。通常情况下，串口通信库已经通过\
    \ `Serial` 函数涵盖了，这些函数与我们在此程序中使用软件串口的保持一致。特别是，我们将使用 `begin()` 函数设置起始波特率，然后使用 `print()`\
    \ 函数发送数据。同样，我们将使用 `read()` 函数接收数据。\n\n```\n g_pBTModule = BTModule::GetInstance(BT_RX_PIN,\
    \ BT_TX_PIN); \n```\n\n上述代码行初始化了我的蓝牙®模块，并返回一个我可以在代码中使用的指针。虽然这并不是什么深奥科学，但我确实更详细地解释一下指针的概念和用法。到目前为止，我们涵盖了一些变量，例如整数（`int`）、字符（`char`）等。指针稍有不同。它与其说是一种数据类型，不如说是一个指向数据类型的链接。想象有一排给一组房屋使用的信箱，每个箱上都有一个名字。信箱本身并没有旁边的名字重要，因为你的邮件会被放在有你名字的箱子里。指针与此类似，它指向一个特定的信箱，即存放你感兴趣的数据的内存位置。信箱的妙处在于，如果另人在你和邻居之间盖了一栋房子，你只需要移动信箱上的名字，让新人的信箱处于正确的位置即可。它可能是你之前使用的那一个，但现在你的名字移动了一位，指向了一个新的信箱。这就是编程中指针背后的原理。这个变量指向内存中的一个特定位置，但你可以在内存中拥有多个包含相同类型的数据点。指针可以根据需要指向其中任何一个。继续这个例子，想象每个信箱实际上都是上面定义的蓝牙®模块。我可以拥有一个指针变量，将其分配给任何蓝牙®模块，并能够访问其所有功能。这是通过简单地更改指针指向的模块来实现的。例如，我可以执行以下操作（非运行的代码）：\n\
    \n```\n BTModule g_BTModule1(3, 4); // 我们与蓝牙模块 1 的接口\nBTModule g_BTModule2(5,\
    \ 6); // 我们与蓝牙模块 2 的接口\nBTModule g_BTModule3(7, 8); // 我们与蓝牙模块 3 的接口\nBTModule\
    \ g_BTModule4(9, 10); // 我们与蓝牙模块 4 的接口\n  ...\n\nbyte nextChar = Serial.read();\n\
    \ng_BTModule1.sendByte(nextChar);\ng_BTModule2.sendByte(nextChar);\ng_BTModule3.sendByte(nextChar);\n\
    g_BTModule4.sendByte(nextChar); \n```\n\n这种方法虽然可行，但有点繁琐，因为对于每个特定的实例，你必须直接访问它；如果你添加或删除了一个实例，就必须向下查找代码以确定它所有被使用的地方并将其移除。有一种更好的方法，那种方法就是使用指针。再次强调，这只是一个代码片段，不是完整的程序。\n\
    \n```\n#define BT_MODULE_COUNT 4\n\n// 接收和传输引脚分配\nint g_btModulePins[BT_MODULE_COUNT][2]\
    \ =\n{\n  {3, 4},\n  {5, 6},\n  {7, 8},\n  {9, 10}\n};\n\n// 指向我模块的指针数组\nBTModule\
    \ *g_pBTModules[BT_MODULE_COUNT] = {0};\n\nvoid setup()\n{\n\tfor (int index =\
    \ 0; index < BT_MODULE_COUNT; index++)\n\t{\n\t\tg_pBTModules[index] = BTModule::GetInstance(g_btModulePins[index][0],\
    \ g_btModulePins[index][1]);\n\t}\n\n\t// 验证每个实例都是有效的（即非空）。\n}\n\nvoid loop()\n\
    {\n  ...\n\n  byte nextChar = Serial.read();\n\n  // 将值发送到每个实例\n  for (int index\
    \ = 0; index < BT_MODULE_COUNT; index++)\n  {\n\tg_pBTModules[index]->sendByte(nextChar);\n\
    \  }\n\n  ...\n\n} \n```\n\n诚然，我可以在第一个例子中定义模块数量并创建模块引脚数组并利用它，但这里的重点是，在第一个例子中我有四个蓝牙模块实例，这是很僵板的，因为要添加或删除实例，我必须回到程序中找到所有使用它的地方并更改，这很耗时且容易出错。在上面的示例中，我只需要做两个更改。第一个更改是更新\
    \ `BT_MODULE_COUNT` 的定义为另一个正值（即大于零 `0` 的值）。第二个更改是添加或删除引脚分配以匹配 `BT_MODULE_COUNT`。如果引脚声明的数量不匹配，编译器会警告你，因为我将\
    \ `BT_MODULE_COUNT` 作为引脚数组的一部分。一旦定义好一切，我可以在循环中处理每个蓝牙®模块实例以进行配置。在主循环函数中，当我读取一个值时，不需要将其发送给每个单独的实例，只需要遍历我的指针数组并发送到每个实例。这减少了所需的代码量，并且使其具有非常好的扩展性，因为只需要少少数更改即可增加或减少使用的模块数量。\n\
    \n以下是我的状态机值，程序将按顺序通过它们来初始化并利用蓝牙®模块。默认情况下，我总是从 `Initialize` 状态开始，除非 `BT_CONNECTED_PIN`\
    \ 表示模块已连接。如果是那样，我可以可以直接跳转到 `ActiveCommunications` 状态。\n\n```\n enum StateMachine\n\
    {\n  Initialize = 0, // 如果我们存储了设备地址，我们可以跳转到连接\n  RestoreDeviceAddress,\n  DiscoveringDevice,\n\
    \  DeviceDiscovered, // 一旦发现，我们无需进行所有设置即可重新连接\n  ConnectingToDevice,\n  ActiveCommunications,\n\
    \  ErrorState,\n  EndStates\n}; \n```\n\n上述每个状态都应该是显而易懂的。你可能会注意到有一个我没有使用的状态，即\
    \ `EndStates`。这真的是我的一种习惯，对于每个枚举，我都会添加一个指示已定义状态结束的最终状态。主要的原因是为了让我能够执行类似下面的操作：\n\
    \n```\n for (int state = Initialize; state < EndStates; state++)\n{\n  ...\n\n\
    \  // 做一些很不起的事情\n\n  ...\n} \n```\n"
