    \ dividing circuit. We will want to use a 4.7K Ohm resistor in series with a 10K\
    \ potentiometer. This will allow us to adjust the voltage across the potentiometer\
    \ to our target voltage. In order to fine tune the target voltage, we can do one\
    \ of two things. First we can use the analog pin of our Arduino® to read in the\
    \ voltage drop across our trim potentiometer. This will require a little coding\
    \ but will work fine. The other option is to use a multimeter to monitor the voltage\
    \ across the potentiometer and fine tune it using that reading. Either is fine\
    \ depending on what tools you have available. This connection will be wired into\
    \ the voltage comparator. For the second half of our circuit, will be connecting\
    \ the LM335 temperature sensor into the other input of the voltage comparator\
    \ which will trigger an input of HIGH when our target voltage is reached. It will\
    \ drop back to LOW once the temperature cools down.![LM335 Temperature triggering\
