    \ on to green and then off blinking every\n *        half second\n *\n * Params\
    \ - none\n *\n * Returns - nothing\n */\nvoid loop()\n{\n  LightLed(POWER_ON);\n\
    \  delay(500);\n\n  LightLed(BLANK);\n  delay(500);\n} \n```\n\n###### Enumerations\n\
    \nIn this sketch I have used a new feature of the C programming language which\
    \ is called an enumeration i.e. enum. Much like a const integer or a definition\
    \ such as #define VARIABLE, an enumeration allows the developer to assign certain\
    \ values to names which makes our code easier to read. For this enumeration, I\
    \ have defined three values indicating if each of the parts of the LED are on\
    \ or off. I have assigned values for each of the enumerations such that each one\
    \ is a specific bit out of the total bytes. Consider the following:\n\n```\n const\
    \ int myValue       = 42;         // decimal representation (base 10)\nconst int\
    \ myValueHex    = 0x2A;       // hexadecimal representation (base 16)\nconst int\
    \ myValueBinary = 0b00101010; // binary representation (base 2) \n```\n\nEach\
    \ of the constants are the same value however I have shown them in various formats.\
    \ As you can see, the decimal version is probably the easiest to understand while\
    \ the binary version is cumbersome but explicit in terms of what bits are on and\
    \ off. Binary numbers are the heart of computer computation. I am using this feature\
    \ of computer numbers to indicate if an LED should be on or off. What makes this\
    \ nice is that I can use one variable to indicate which parts of the LED is on\
    \ or off opposed to a separate value for each of the colors. You may have noticed\
    \ that each value assigned in my enumeration has unique bits to represent it.\
    \ The reason is that I can combine them to create additional colors such as red\
    \ and green creating yellow.\n\n###### Constants\n\nIn the beginning of this sketch\
    \ I have declared some constant values which I will use later on in my code. As\
    \ I mentioned previously, it is better to declare these values as constant that\
    \ way you get the benefit of meaningful names in your code which helps in the\
    \ overall readability of your sketch along with the ability to change the value\
    \ as needed later on without trying to find everywhere it is used in your code.\
    \ The constants in this sketch define which pins are being used as digital outputs\
    \ and assign values to certain states such as POWER_OFF, SETUP, and POWER_ON.\n\
    \n```\n const int POWER_OFF = RED_ON;\nconst int POWER_ON = GREEN_ON;\nconst int\
    \ SETUP = GREEN_ON | RED_ON;  // Turn both red and green on to get yellow\nconst\
    \ int BLANK = 0; // no lED's lit \n```\n\nIn the above four lines I have declared\
    \ each of my color states as either a single or combination of values from my\
    \ enumeration. In the enumeration I defined the values as:\n\n```\n typedef enum\n\
    {\n  RED_ON = 0x1,\n  GREEN_ON = 0x2,\n  BLUE_ON = 0x4\n} eLedSettings; \n```\n\
    \nIn the above enumeration, I have RED_ON assigned the hexadecimal value, 0x01.\
    \ This becomes 0b0001 in binary. For the second value, GREEN_ON, I have assigned\
    \ it the hexadecimal value 0x02. This becomes 0b0010 in binary. You might notice\
    \ that each one sets a different bit to on. Finally I have assigned the third\
    \ value, BLUE_ON the hexadecimal value 0x04 which is 0b0100 in binary. If I want\
    \ to create a yellow light, I can simply combine the value for GREEN_ON with the\
    \ value for RED_ON which will equal the hexadecimal value 0x03 which will be the\
    \ binary value 0b0011. When I pass this combined value to my function LightLed\
    \ it will check each bit and turn on the proper portion of the LED corresponding\
    \ to the set bits.\n\n###### Method Declarations\n\nI declared one method in this\
    \ sketch to light up the LED based on the color passed into the method which can\
    \ be any combination of the three colors. This allows for up to eight (8) total\
    \ colors with all colors on representing WHITE and all colors off indicating BLACK.\
    \ While there isn't a true black, the lack of light i.e. the LED in the off state\
    \ will represent black.\n\n###### User Methods\n\nAs mentioned above, I have created\
    \ one method which will turn on each of the parts of the LED based on the incoming\
    \ color value. The color value is called a bit mask which indicates which colors\
    \ are on and which ones are off. The passed in color value is anded i.e. & with\
    \ each of my constants, RED_ON, GREEN_ON, and BLUE_ON, to determine if that part\
    \ of the LED should be on or off. The AND operation is a fundamental operation\
    \ of binary numbers. This will allow us to test if a color should be lit or not.\n\
    \n###### Setup\n\nThe setup method is where I will configure my Arduino® to operate\
    \ as I need. In this case I will enable each of the pins being used as digital\
    \ outputs prior to using them which is done when I call the method LightLed.\n\
    \n```\n void setup()\n{\n  pinMode(redPin, OUTPUT);\n  pinMode(greenPin, OUTPUT);\n\
    \  pinMode(bluePin, OUTPUT);\n\n  LightLed(SETUP);\n  delay(1000);\n} \n```\n\n\
    The main thing of note in this setup code is that I am delaying for one (1) second\
    \ to allow the user to see the yellow LED before changing it to green.\n\n######\
    \ Loop\n\nNormally the loop method is where all of the work is done however since\
    \ this is only a partial sketch i.e. I am showing how to use a digital output\
    \ and not much more, it is fairly limited in its functionality.\n\n```\n void\
    \ loop()\n{\n  LightLed(POWER_ON);\n  delay(500);\n\n  LightLed(BLANK);\n  delay(500);\n\
    } \n```"
