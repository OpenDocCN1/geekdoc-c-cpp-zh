    \ is how deep the water is and how fast is it rising? For the depth of the water\
    \ it would be very easy if you happened to know how far apart each step on the\
    \ staircase is. In this case, you could simply count how many steps were covered\
    \ in water and do some simple arithmetic to determine the waters depth. Oddly\
    \ enough the Arduino® is doing something very similar. It has a built in scale\
    \ that compares its internal value with the value coming in on the analog pin.\
    \ Each cycle, the device will increase the voltage and compare it to the incoming\
    \ voltage. It knows how many cycles it has been since it started the comparison\
    \ so once they are equal, the micro-controller knows the value of the external\
    \ voltage. The micro-controller has 10 bits of resolution which means that it\
    \ can count all the way from zero (0) to 1023 to find a value matching that which\
    \ is being read at the analog input pin. Using the above analogy, it is like the\
    \ micro-controller has a staircase with 1024 steps counting the floor as step\
    \ number one (1). In the case, step number one is equal to zero (0) volts and\
    \ step number 1024 is equal to five (5) volts. This corresponds to a voltage of\
    \ 0 volts being equivalent to a digital value of 0 and a voltage of 5 volts being\
    \ equivalent to a digital value of 1023\\. As you can see, there is a fair amount\
    \ of precision when using the 10 bit analog to digital converter. The downside\
    \ to this type of converter is that it takes time to count from zero (0) up to\
    \ the value that represents the incoming analog voltage. Just like the rate that\
    \ the water rises in the basement, the comparison of each voltage value to the\
    \ next highest value takes time as the micro-controller determines the equivalent\
    \ voltage to the input voltage. The worst case of course is for 5 volts which\
    \ is at the top of the range resulting in the micro-controller having to count\
    \ 1024 times to get to a comparative value. In terms of computing time, this can\
    \ be quite slow and could be as much as 260 microseconds for the given device.\
    \ In human time, this is about 1/4 of a millisecond which in turn is 1/1000's\
    \ (0.001) of one second. When looked at in this way, it is plenty fast enough\
    \ for what we want to do. Speaking of what we want to do, the first thing is to\
    \ determine what the temperature in the room is.\n\n* For the Arduino UNO and\
    \ MEGA, the maximum voltage that can be read in is 5 volts however on some systems,\
    \ the maximum may be lower such as 3.3 volts or even 1.8 volts.\n\n#### Temperature\
    \ Reading\n\nThe first thing we will look at is how to read in a temperature value\
    \ and then be able to react to it based on its value and/or delta from it's initial\
    \ value. Luckily there are specific devices available that will increase in voltage\
    \ as the surrounding temperature rises. Knowing this, we can connect one of these\
    \ devices to our Arduino® and read in the value to determine the current temperature.\n\
    \n##### Required Components\n\n*   Arduino® Board\n\n*   4.7K Ohm Resistor\n\n\
    *   LM335 temperature sensor[[7](#part0012_split_001.html_Ref7)] or similar such\
    \ as the NTE7225[[8](#part0012_split_001.html_Ref8)]\n\n##### Tools\n\n*   breadboard\n\
    \n*   jumper wires\n\n*   voltage meter\n\n##### Schematic"
