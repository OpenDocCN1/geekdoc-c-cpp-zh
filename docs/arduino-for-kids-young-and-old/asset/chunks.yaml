  trans: "\n应用程序代码区是存储所有用户应用程序代码的地方。用户可以通过 IDE 或其他手段（例如通过命令行使用类似 `avrdude` 的程序）对其进行重新编程[13]。这种内存在本质上是持久的，它保留的程序可以维持数年，远超该产品的典型寿命。一旦引导加载程序（boot\
    \ loader）确定用户不想对设备重新编程，它就会调用应用程序代码。对于我们的应用程序来说，这通常就是我们创建的 `setup` 和 `loop` 方法，以及我们可能使用的任何额外库和基础\
    \ Arduino® 代码。\n\n### SRAM\n\n静态随机访问存储器 `SRAM` 是在执行应用程序期间存储所有应用程序数据的地方。与闪存（flash\
    \ memory）不同，它的写入速度相当快，且不需要对设备进行任何特定配置即可实现。`SRAM` 的缺点是如果掉电，内存内容将会丢失，除非系统内安装了电池来保存它。这使得它非常适合运行时数据，但不太适合长期存储。关于\
    \ `SRAM` 以及通用的 `RAM` 需要注意的另外一点是，它们在上电时通常包含任意初始值。这就是为什么在第一次声明变量时初始化它们始终是一个好主意，以确保存储在该处的值根据用途是合理的。虽然这种内存被称为“静态”的，但它并不是持久的。“静态”一词表示该内存不需要定期刷新刷新即可保留其数据。与静态内存互补的是动态内存。动态内存需要内存控制器定期刷新数据以维持其状态。虽然我不会深入探讨细节，但应该注意到，动态内存\
    \ `DRAM` 电路比对应的 SRAM 电路更小，从而具有更高的密度，因此内存更便宜。通常你会在计算机系统中发现 `DRAM` 作为主内存，或与显卡或其他外围设备配合。\n\
    \n对于 Atmel® 微控制器，`SRAM` 的另一个缺点是尺寸非常有限。在开发应用程序（即 sketch）时，你希望确保保持内存使用尽可能保守。在通信章节中，我为一个\
    \ LCD 创建了一个库，它使用 1024 字节的 `SRAM` 来存储当前屏幕图像。对于 Arduino® UNO 来说，这是我的开发板所有内存的一半！\n\
    \n### EEPROM\n\n电可擦除可编程只读存储器 `EEPROM` 是闪存和 `SRAM` 之间的很好的折中方案。与闪存一样，它是持久的可以写入，尽管速度相当慢。与闪存不同，`EEPROM`\
    \ 不能存储程序代码，因为微控制器无法直接执行存储在 `EEPROM` 中的代码。你可以从 `EEPROM` 加载代码并将其放入 `SRAM` 中，但这超出了我目前想要涵盖范围。像\
    \ `SRAM` 一样，它不需要任何特殊配置，可以通过应用程序代码直接写入。这使得该名称有些名不副实，因为它不再是完全的“只读”了，但在通常用法中，会对其写入以存储配置或其他读取频率高于写入频率的持久性数据。通常，我会使用\
    \ `EEPROM` 内存区域来存储序列号、板载配置或其他某种静态数据。Arduino® UNO™ 微控制器有 1K (1024 字节) 的 `EEPROM`\
    \ 内存可用。考虑到我们已经看过的各种温度电路，我们可以使用此内存来存储给定年份内每天的最高和最低温度。随着时间的推移，我们可以看到温度范围，并将数据卸载到计算机中进一步处理。\n\
    \n如前面的章节所示，Arduino™ 拥有一套丰富的库来处理微控制器的各个方面。对于 `EEPROM`，包含了以下库：\n\n```\n#include\
    \ <EEPROM.h> \n```\n\n这允许我们使用几个提供的命令，像对待任何其他内存一样简单地对 `EEPROM` 进行读写操作。\n\n```\n\
    byte dataValue = EEPROM.read(offset);\nEEPROM.write(offset, dataValue); \n```\n\
    \n`EEPROM` 库的唯一缺点是你必须自己管理存储区域的 `offset`（偏移量）。但考虑到使用量通常很低，这不是一个主要问题，而且可以编写辅助函数，就像我在中断章节中做的那样。\n\
    \n### I/O 内存\n\n这是位于微控制器外部的内存或类内存数据，通过映射到 I/O 寄存器来访问它。这可以用于许多设备，例如 LCD 面板或其他具有数据总线的设备。由于我们正在使用\
    \ Arduino®，我不会深入探讨这一特定领域，只需说明它可以与 Arduino 一起使用，但操作它所需的 I/O 引脚数量会迅速增加，从而限制你的选择。\n\
    \n### 外部内存\n\n除了微控制器内部内存外，Arduino 还可以通过各种通信接口（如 `SPI`、`I2C` 等）利用额外的内存。一个例子是 SD\
    \ 微卡，取决于配合 Arduino 使用哪种扩展板（shield）。之前我们使用过带有持久内存的基于 `SPI` 的数字电位器。另一个例子是实时钟 `RTC`，系统具有\n\
    \n### 总结\n\n在本章中，我们查看了 Arduino 可用的各种存储类型以及它们的典型用途。通常，`FLASH`、`SRAM` 和 `EEPROM`\
    \ 是你最常使用的内存类型。在这三者中，`EEPROM` 是可能使用最少的，但在需要持久化数据时它非常方便。`SRAM` 是你希望拥有更多的，而 `FLASH`\
    \ 内存可能满足你的应用程序需求。\n\n![章节结束图形](img/00001.jpeg)\n\n# I/O 扩展\n\n## 当一个不够用时\n\n在处理微控制器时，确保你提前识别了所有需要的功能始终是一个好主意。避免因为缺少一个输出线而不得不重新设计你的整个方案，这是最轻微的说法。当然，购买比需要的更多的计算能力也是件好事，特别是当你计划制作多个相同的物品时。对于我想中的下一个项目，我想为孩子们制作的木制赛车添加两个七段显示器。为了实现这一点，我需要两个代表每个数字的七段显示器，以及一个驱动它们的\
    \ Arduino®。由于重量和尺寸是一个考虑，我希望在拥有足够 I/O 的情况下利用最小的 Arduino®。为了保险起见，我还想添加两个大灯，因为我可以。我觉得这看起来也会非常酷，就这样吧。有了这一切，我需要\
    \ 14 个数字输出来驱动显示器的每个段，外加上大灯的两个额外输出。因此，总共我 16 个数字输出来驱动我设想所有的灯。我还想让灯光闪烁，可能并在显示器上进行一些序列显示以吸引观众的目光。\n\
    \n### 需求\n\n我需要做的第一工作是确保捕获所有的需求，以便提前知道需要什么。从那里，我可以查看需要哪些硬件组件。以下是我对需求的初步草稿。\n\n\
    *   16 个数字输出\n*   更新显示器的中断\n*   触发大灯的输入\n*   设置显示值从 00 到 99 的输入\n"
