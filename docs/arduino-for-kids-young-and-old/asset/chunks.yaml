  trans: "\n\n```cpp\n /*\n * temperaturePin 是从 LM335 读取输入的引脚。\n *\n * redLedPin 是\
    \ Arduino 的 PWM 输出连接到电路的引脚。\n *\n * greenLedPin 是 Arduino 的 PWM 输出连接到电路的引脚。\n\
    \ *\n * blueLedPin 是 Arduino 的 PWM 输出连接到电路的引脚。\n *\n * baseVoltage 是设备（LM335）在\
    \ 0°C 时测量的电压。\n * voltageReference 是模拟输入引脚上可以读取的最大电压。\n * maxSampleCount 是模拟输入引脚上可以读取的最大值，该值等于参考电压。\n\
    \ * */        \nconst int temperaturePin = 0;\nconst int redLedPin = 9;\nconst\
    \ int greenLedPin = 10;\nconst int blueLedPin = 11;\nconst float baseVoltage =\
    \ 2.730f; /* 0°C 时为 2.730V */\nconst float voltageReference = 5.0f;\nconst int\
    \ maxSampleCount = 1023;\n\n/*\n * 方法声明\n */\n\n     /* 此示例中没有额外的方法 */\n\n/*\n\
    \ * Setup - 示例的主配置点，用于配置\n *         Arduino 以进行模拟输入和 PWM 输出\n *\n * 参数 - 无\n\
    \ *\n * 返回值 - 无\n */ \n\nvoid setup()\n{\n  analogReference(DEFAULT);\n\n  //\
    \ 因为我们正在使用数字引脚作为模拟输出（即 PWM），\n  // 我们不需要使用 pinMode 对它们进行配置。\n}\n\n /*\n * loop\
    \ - 主方法，每当 Arduino 执行主循环时都会被调用，\n *        用于读取当前温度值，然后根据该温度值\n *        点亮三个\
    \ LED。\n *\n * 参数 - 无\n *\n * 返回值 - 无\n */\nvoid loop()\n{\n  int temperatureValue\
    \ = 0;\n  int red = 0;\n  int green = 0;\n  int blue = 0;\n  float colorPercent\
    \ = 0.0f;\n\n  // 读取温度值，其范围范围在 0 到 1023 之间\n  temperatureValue = analogRead(temperaturePin);\n\
    \n  // 越接近 0，颜色就越蓝\n  colorPercent = 100.0f - (((float)temperatureValue / (float)maxSampleCount)\
    \ * 100.0f);\n  blue = (int)(colorPercent * 255.0f);\n\n  // 越接近 1023（即设备的最大值），颜色就越红\n\
    \  colorPercent = ((float)temperatureValue / (float)maxSampleCount) * 100.0f;\n\
    \  red = (int)(colorPercent * 255.0f);\n\n  // 绿色会相应变化，在中间点达到峰值\n  if (temperatureValue\
    \ > (maxSampleCount / 2))\n  {\n    colorPercent = (float)(maxSampleCount - temperatureValue)\
    \ * 100.0f;\n  }\n  else\n  {\n    colorPercent = ((float)temperatureValue / (float)(maxSampleCount\
    \ / 2)) * 100.0f;\n  }\n  green = (int)(colorPercent * 255.0f);\n\n  analogWrite(redLedPin,\
    \ red);\n  analogWrite(greenLedPin, green);\n  analogWrite(blueLedPin, blue);\n\
    \n  // 休息一秒并再次检查\n  delay(1000);\n} \n```\n```\n\n### 常量\n\n在示例的开头，我声明了一些稍后将在代码中使用的常量值。正如我之前提到的，将这些值声明为常量更好，这样你可以在代码中获得具有意义的名称的好处，这有助于整个示例的可读性，并且可以在以后需要时更改值，而无需在代码中到处寻找它们使用的地方。\n\
    \n### 方法声明\n\n对于此示例，我们没有任何需要声明的用户特定方法。\n\n### 用户方法\n\n鉴于我们没有任何用户方法声明，因此也没有可以查看的用户方法实现。\n\
    \n### Setup\n\n`setup()` 方法是我配置我的 Arduino® 以按照我的需要运行的地方。在这种情况下，我希望将模拟参考电压设置为默认值，对于\
    \ Arduino® UNO 或 Arduino® MEGA，该值是 5.0v。这告诉微控制器我想测量 0v 到 5.0v 范围内的电压。对于我们的目的来说，这个分辨率就足够了。\n\
    \n```cpp\n void setup()\n {\n   analogReference(DEFAULT);\n\n   // 因为我们正在使用数字引脚作为模拟输出（即\
    \ PWM），\n   // 我们不需要使用 pinMode 对它们进行配置。\n } \n```\n\n### Loop\n\n`loop()` 方法再次是完成所有实际工作的地方。在这里，我将周期性地读取温度值并更新三色\
    \ LED 的颜色以匹配读取到的温度。如上面的代码所示，我们不需要为每个模拟输出引脚调用 `pinMode`。\n\n```cpp\n void loop()\n\
    {\n  int temperatureValue = 0;\n  int red = 0;\n  int green = 0;\n  int blue =\
    \ 0;\n  float colorPercent = 0.0f;\n\n  // 读取温度值，其范围范围在 0 到 1023 之间\n  temperatureValue\
    \ = analogRead(temperaturePin);\n\n  // 越接近 0，颜色就越蓝\n  colorPercent = 100.0f -\
    \ (((float)temperatureValue / (float)maxSampleCount) * 100.0f);\n  blue = (int)(colorPercent\
    \ * 255.0f);\n\n  // 越接近 1023（即设备的最大值），颜色就越红\n  colorPercent = ((float)temperatureValue\
    \ / (float)maxSampleCount) * 100.0f;\n  red = (int)(colorPercent * 255.0f);\n\n\
    \  // 绿色会相应变化，在中间点达到峰值\n  if (temperatureValue > (maxSampleCount / 2))\n  {\n\
    \    colorPercent = (float)(maxSampleCount - temperatureValue) * 100.0f;\n  }\n\
    \  else\n  {\n    colorPercent = ((float)temperatureValue / (float)(maxSampleCount\
    \ / 2)) * 100.0f;\n  }\n  green = (int)(colorPercent * 255.0f);\n\n  analogWrite(redLedPin,\
    \ red);\n  analogWrite(greenLedPin, green);\n  analogWrite(blueLedPin, blue);\n\
    \n  // 休息一秒并再次检查\n  delay(1000);\n} \n```\n\n"
- fmt: "\nThis code is fairly straightforward in that each value for red, blue, and\
    \ green is written out to the corresponding pins which results in turning on the\
    \ transistor connected to the LED channel for that given color. The value we write\
    \ out is the amount of time during the time period of the PWM signal that it will\
    \ be HIGH with the remainder of the time with the signal being LOW. What I haven't\
    \ mentioned so far is how long is this time overall? From the Arduino® documentation,\
    \ we can see that the overall frequency of the PWM signal is approximately 490\
    \ Hz. The Hz acronym stands for hertz which is the frequency of the signal i.e.\
    \ the number of times the signal varies from low to high for one complete second.\
    \ Basically a single hertz is equal to one second. The overall time of the signal\
    \ is one (1) second divided by the number of hertz. In our case this is 1 divided\
    \ by 490, resulting in 0.00204081632653 seconds per cycle. In normalized terms,\
    \ the cycle of the PWM signal is approximately 2 milliseconds. If you were to\
    \ write a value of 127 out to the analog output pin, you would get a near perfect\
    \ square wave out of the pin with it being HIGH half the time i.e. for 1 millisecond\
    \ and then LOW for the remainder of the period i.e. the second millisecond. A\
    \ value of 64 which is one quarter of the total value for the PWM signal would\
    \ result in a HIGH signal for 500 microseconds followed by 1500 microseconds of\
    \ a LOW signal.\n\nOnce you have your circuit built and ready to test with the\
    \ provided sketch, you can heat and/or cool the LM335 to see the TriColor LED\
    \ change. Given the space between each pixel of the TriColor LED being as small\
    \ as it is, when we look at the LED as a whole, we will see the combined color\
    \ of each individual segment opposed to three distinct colors. This is also due\
    \ in part to the opaque housing around the LED causing the colors to blend. The\
    \ final part of the code is the `delay()` method which is again being utilized\
    \ to let things happen before checking the analog input for a new temperature\
    \ reading. Later on, when looking at [Interrupts](#part0006_split_000.html_Interupt),\
    \ we will see how we can remove the delay and be more reactive to outside stimuli\
    \ opposed to continuously monitoring the values.\n\n## Pulse Width Modulation\
    \ - Fans\n\nNow that we have a handle on PWM, I will look at other ways to utilize\
    \ it. For this circuit, I will use a potentiometer connected to an analog input\
    \ which will control the speed of the fan connected to a PWM output. The goal\
    \ is to adjust the speed of the fan based on the analog input read in from the\
    \ potentiometer. For practical uses, I would most likely put a temperature sensor\
    \ on the analog input in order to adjust the fan based on the current temperature.\
    \ However for this example, I will simply utilize the potentiometer to better\
    \ exercise the fan from off to full on.\n\n*   Arduino® Board\n*   10K potentiometer\n\
    *   2N2222(A) Transistor\n*   100 Ohm Resistor\n*   1K Ohm Resistor\n*   150 Ohm\
    \ Resistor\n*   Fan, +12v, 200mAmp\n\n### Tools\n\n*   breadboard\n*   jumper\
    \ wires\n*   voltage meter\n\n### Schematic\n\nThe fan connects to the board using\
    \ a four (4) pin header. A three (3) pin fan can also be used however it will\
    \ not have the ability to be controlled via a PWM output pin unless you hook this\
    \ value up to a transistor such as `Q1` in the diagram below. The voltage for\
    \ the fan should be applied to the resistor on the top of the board to flow into\
    \ the transistor. This assumes of course that the fan you are using is designed\
    \ to run off of +12v. If you are using the four (4) pin fan type then you will\
    \ want to change the yellow wire from the transistor to connect to the +12v voltage\
    \ input for the fan, bypassing the transistor all together. The main thing to\
    \ note is to not connect the fan power to the Arduino® as it may overload the\
    \ Arduino® circuit board and damage it. You will also need to consider the current\
    \ draw, `Ic`, to ensure it doesn't overload the transistor. For the transistor\
    \ specified, the maximum current, `Ic`, is 1.0 Amps.\n\n![Fan control circuit](images/00022.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created\
    \ using: [Fritzing](http://fritzing.org/)\n\n### Software\n\nThe following code\
    \ is used to read in the voltage across the potentiometer and in turn write out\
    \ to the PWM pin in order to control the speed of the fan.\n\n```cpp\n /*\n *\
    \ FanPWM - the purpose of this sketch is to read in a value from a potentiometer\
    \ and then\n *          use that value to determine how fast the fan should be\
    \ spinning.\n *\n * The fan control pin is where the input from the potentiometer\
    \ will be read from.\n *\n * fanTachPin is connected to read in the current speed\
    \ of the fan\n *\n * The fan speed pin is the where the PWM output of the Arduino\
    \ will connect to\n * the interface circuit in order to drive the fan.\n *\n *\
    \ The voltage reference is the max voltage that can be read in on the\n * analog\
    \ input pin\n *\n * The max sample count is the highest value that could be read\
    \ in on the\n * analog input pin which will equal the voltage reference\n */\n\
    \nconst int fanControlPin = 0;\nconst int fanTachPin = 7;\nconst int fanSpeedPin\
    \ = 9;\nconst float voltageReference = 5.0;\nconst int maxSampleCount = 1023;\n\
    ```\n"
  raw: "This code is fairly straight forward in that each value for red, blue, and\
    \ green is written out to the corresponding pins which results in turning on the\
    \ transistor connected to the LED channel for that given color. The value we write\
    \ out is the amount of time during the time period of the PWM signal that it will\
    \ be HIGH with the remainder of the time with the signal being LOW. What I haven't\
    \ mentioned so far is how long is this time overall? From the Arduino® documentation,\
    \ we can see that the overall frequency of the PWM signal is approximately 490\
    \ Hz. The Hz acronym stands for hertz which is the frequency of the signal i.e.\
    \ the number of times the signal varies from low to high for one complete second.\
    \ Basically a single hertz is equal to one second. The overall time of the signal\
    \ is one (1) second divided by the number of hertz. In our case this is 1 divided\
    \ by 490, resulting in 0.00204081632653 seconds per cycle. In normalized terms,\
    \ the cycle of the PWM signal is approximately 2 milliseconds. If you were to\
    \ write a value of 127 out to the analog output pin, you would get a near perfect\
    \ square wave out of the pin with it being HIGH half the time i.e. for 1 millisecond\
    \ and then LOW for the remainder of the period i.e. the second millisecond. A\
    \ value of 64 which is one quarter of the total value for the PWM signal would\
    \ result in a HIGH signal for 500 microseconds followed by 1500 microseconds of\
    \ a LOW signal.\n\nOnce you have your circuit built and ready to test with the\
    \ provided sketch, you can heat and/or cool the LM335 to see the TriColor LED\
    \ change. Given the space between each pixel of the TriColor LED being as small\
    \ as it is, when we look at the LED as a whole, we will see the combined color\
    \ of each individual segment opposed to three distinct colors. This is also due\
    \ in part to the opaque housing around the LED causing the colors to blend. The\
    \ final part of the code is the delay method which is again being utilized to\
    \ let things happen before checking the analog input for a new temperature reading.\
    \ Later on, when looking at [Interrupts](#part0006_split_000.html_Interupt), we\
    \ will see how we can remove the delay and be more reactive to outside stimuli\
    \ opposed to continuously monitoring the values.\n\n#### Pulse Width Modulation\
    \ - Fans\n\nNow that we have a handle on PWM, I will look at other ways to utilize\
    \ it. For this circuit, I will use a potentiometer connected to an analog input\
    \ which will control the speed of the fan connected to a PWM output. The goal\
    \ is to adjust the speed of the fan based on the analog input read in from the\
    \ potentiometer. For practical uses, I would most likely put a temperature sensor\
    \ on the analog input in order to adjust the fan based on the current temperature.\
    \ However for this example, I will simply utilize the potentiometer to better\
    \ exercise the fan from off to full on.\n\n*   Arduino® Board\n\n*   10K potentiometer\n\
    \n*   2N2222(A) Transistor\n\n*   100 Ohm Resistor\n\n*   1K Ohm Resistor\n\n\
    *   150 Ohm Resistor\n\n*   Fan, +12v, 200mAmp\n\n##### Tools\n\n*   breadboard\n\
    \n*   jumper wires\n\n*   voltage meter\n\n##### Schematic\n\nThe fan connects\
    \ to the board using a four (4) pin header. A three (3) pin fan can also be used\
    \ however it will not have the ability to be controlled via a PWM output pin unless\
    \ you hook this value up to a transistor such as Q1 in the diagram below. The\
    \ voltage for the fan should be applied to the resistor on the top of the board\
    \ to flow into the transistor. This assumes of course that the fan you are using\
    \ is designed to run off of +12v. If you are using the four (4) pin fan type then\
    \ you will want to change the yellow wire from the transistor to connect to the\
    \ +12v voltage input for the fan, bypassing the transistor all together. The main\
    \ thing to note is to not connect the fan power to the Arduino® as it may overload\
    \ the Arduino® circuit board and damage it. You will also need to consider the\
    \ current draw, Ic, to ensure it doesn't overload the transistor. For the transistor\
    \ specified, the maximum current, Ic, is 1.0 Amps.\n\n![Fan control circuit](images/00022.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created\
    \ using: [Fritzing](http://fritzing.org/)\n\n##### Software\n\nThe following code\
    \ is used to read in the voltage across the potentiometer and in turn write out\
    \ to the PWM pin in order to control the speed of the fan.\n\n```\n /*\n * FanPWM\
    \ - the purpose of this sketch is to read in a value from a potentiometer and\
    \ then\n *          use that value to determine how fast the fan should be spinning.\n\
    \ *\n * The fan control pin is where the input from the potentiometer will be\
    \ read from.\n *\n * fanTachPin is connected to read in the current speed of the\
    \ fan\n *\n * The fan speed pin is the where the PWM output of the Arduino will\
    \ connect to\n * the interface circuit in order to drive the fan.\n *\n * The\
    \ voltage reference is the max voltage that can be read in on the\n * analog input\
    \ pin\n *\n * The max sample count is the highest value that could be read in\
    \ on the\n * analog input pin which will equal the voltage reference\n */\n\n\
    const int fanControlPin = 0;\nconst int fanTachPin = 7;\nconst int fanSpeedPin\
    \ = 9;\nconst float voltageReference = 5.0f;\nconst int maxSampleCount = 1023;\n\
    \n/*\n * Method declarations\n */\n\n/* No additional methods in this sketch */\n\
    \n/*\n * Setup - main configuration point of our sketch to configure\n *     \
    \    the Arduino for analog input and PWM output\n *         also set up the tach\
    \ pin for input along with\n *         enabling the serial port to monitor fan\
    \ speed\n *\n * Params - none\n *\n * Returns - nothing\n */\n\nvoid setup()\n\
    {\n  analogReference(DEFAULT);\n\n  pinMode(fanTachPin, INPUT);\n\n  Serial.begin(9600);\n\
    }\n\n/*\n * loop - main method which will be called each time the\n *        Arduino\
    \ goes through its main loop to read the\n *        current fan control value\
    \ and then turn on the\n *        fan based on the voltage across the potentiometer\n\
    \ *\n * Params - none\n *\n * Returns - nothing\n */\n\nvoid loop()\n{\n  int\
    \ fanControlValue = 0;\n  int fanSpeed = 0;\n  int fanTach = 0;\n\n  // Read in\
    \ the temperature value which will be in a range from 0 to 1023\n  fanControlValue\
    \ = analogRead(fanControlPin);\n\n  // Our range for output for PWM is 0 to 255\
    \ so we will divide by\n  // 4 in order to get the read in value into the proper\
    \ range\n  // the output pin expects.\n  fanSpeed = fanControlValue / 4;\n\n \
    \ analogWrite(fanSpeedPin, fanSpeed);\n\n  // Read in the fan tachometer value\
    \ which will be a high signal\n  // for a period X\n  fanTach = pulseIn(fanTachPin,\
    \ HIGH);\n\n  char buffer[256];\n  int rpm = 1000000 / fanTach; // 1 Million as\
    \ the value is in microseconds\n\n  // Target and tach shouldn't be expected to\
    \ be the same\n  sprintf(buffer, \"Target: %d, Tach: %d\", fanSpeed, rpm);\n\n\
    \  Serial.println(buffer);\n\n  // Rest for a second and check again\n  delay(1000);\n\
    } \n```\n\n###### Constants\n\nIn the beginning of this sketch I have declared\
    \ some constant values which I will use later on in my code. As I mentioned previously,\
    \ it is better to declare these values as constant that way you get the benefit\
    \ of meaningful names in your code which helps in the overall readability of your\
    \ sketch along with the ability to change the value as needed later on without\
    \ trying to find everywhere it is used in your code. The constants in this sketch\
    \ define which pins are being used as analog and digital input, and which pin\
    \ is being used for analog out i.e. PWM output.\n\n###### Method Declarations\n\
    \nThere are not any additional methods declared for this sketch.\n\n###### Setup\n\
    \nThe setup method is where I will configure my Arduino® to operate as I need.\
    \ For this sketch we will ensure that our analog reference voltage is five (5)\
    \ volts.\n\n```\n void setup()\n{\n  analogReference(DEFAULT);\n\n  pinMode(fanTachPin,\
    \ INPUT);\n\n  Serial.begin(9600);\n} \n```"
