    \ detector changes state.\n *\n * fanBlades is the number of blades that the fan\
    \ being used has.  Each fan blade triggers\n *           the interrupt so to get\
    \ an accurate reading we will need to divide the number\n *           we obtain\
    \ by the number of blades.\n *\n * interruptId is the identifier of which interrupt\
    \ we are using.  While the interrupt itself is attached to\n *             pin\
    \ two (2) of the Arduino, the interrupt identifier is actually zero (0).\n *\n\
    \ * updateFrequency is how often we update the display with our calculated RPM's\n\
    \ *\n * speedCount is the number of times that the interrupt has been triggered\
    \ since we last looked at.\n *\n * lastCycle is the value of millis() at the last\
    \ cycle so we can accurately determine the speed based on a\n *           one\
    \ second target\n */ \n```\n\n```\n const int fanBlades = 7;\nconst int interruptId\
    \ = 0;\nconst int updateFrequency = 1000;\n\nvolatile int speedCount = 0; // volatile\
    \ as it will be changed by both the interrupt and the main loop\nunsigned long\
    \ lastCycle = 0; \n```\n\n```\n /*\n * Method declarations\n */ \n```\n\n```\n\
    \ void infrared_trigger(); \n```\n\n```\n /*\n * infrared_trigger - this method\
    \ is short as it is handled during an interrupt\n *                    it's sole\
    \ purpose is to update the speed counter\n *\n *\n * Params - none\n *\n * Returns\
    \ - nothing\n */ \n```\n\n```\n void infrared_trigger()\n{\n  speedCount++;\n\
    } \n```\n\n```\n /*\n * Setup - main configuration point of our sketch to configure\n\
    \ *         the Arduino for serial port reporting, setting our\n *         default\
    \ values, and enabling our interrupt.\n *\n * Params - none\n *\n * Returns -\
    \ nothing\n */ \n```\n\n```\n void setup()\n{\n  // Setup the serial port to report\
    \ our fan RPM value\n  Serial.begin(9600);\n\n  lastCycle = millis();  // get\
    \ a starting value prior to turning the interrupt on\n\n  // We will use the rising\
    \ edge which correlates to the fan blade blocking the infrared detector\n  attachInterrupt(interruptId,\
    \ infrared_trigger, RISING);  \n} \n```\n\n```\n /*\n * loop - main method which\
    \ will be called each time the\n *        Arduino goes through its main loop to\
    \ check the\n *        amount of time since it last looked an if our\n *     \
    \   update frequency has been exceeded, we will then\n *        report the rotations\
    \ per minute scaled by 60\n *        since we are reporting the value every second.\n\
    \ *\n * Params - none\n *\n * Returns - nothing\n */ \n```"
