  trans: '


    *   用于安装七段码显示器和大灯的扩展板


    如前所述，数字 I/O 引脚将驱动显示器的各个段，并也将用于开启和关闭大灯。我在想，也许我可以使用光电探测器来确定何时应该开启大灯。此外，如果有一种方法动态设置显示器的数值，将非常有益，因为这样无论哪辆车安装了这些电子设备，我都可以使用相同的代码。我还可以将分配的数字更改为比赛官员给每个孩子赛车指定的任何数字。考虑到实现这一目标需要的所有部件，我最好计划使用一块扩展板来放置额外的组件，因为面包板无法安装在赛车上，而且很可能会导致我超出最大重量限制。


    ### 限制条件


    在确定了所有需求后，我现在需要查看我有哪些限制条件，以便满足所有需求，同时又不超出任何现有限制。


    *   成本 - 我需要制作 4 个这样的设备

    *   尺寸 - 这需要安装在松木赛车上，该赛车的宽度为 1.75 英寸，长度为 7.0 英寸

    *   重量 - 松木赛车的重量限制为 5 盎司

    *   可复制性 - 我需要制作 4 个这样的设备，而且简单始终是一件好事


    在我所有的所有限制条件中，成本是最灵活的。尺寸和重量是赛车规则设定的硬性规定。虽然我可以考虑可复制性来做什么，但我只需要四个 (4) 个，所以从长远来看，这对我来说并不重要。


    ### 设计


    在详细说明了需求和限制之后，我现在可以开始寻找满足我需求的设计。首先要决定哪种 Arduino® 能够满足我的需求，同时不会让成本过高。常见的选择如下：


    | 板板 | 数字 I/O | 中断 | 模拟输入 | 长度（英寸） | 宽度（英寸） | 成本 * |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | NANO | 14 | 2 | 8 | 1.7 | 0.7 | $25.00 |

    | UNO | 14 | 2 | 6 | 2.95 | 2.1 | $30.00 |

    | MEGA | 54 | 6 | 16 | 4.25 | 2.1 | $60.00 |


    * 成本是变化的，取决于你何时以及何地购买。我列出我在网上看到的一些平均价格，但我预计通过货比价可以找到更好的价格。还有 Sparkfun Electronics
    的 Arduino® Pro Mini，但它需要一根 USB 转 FTDI 线，这抵消了部分成本上的节省。


    虽然 MEGA 有多足够的数字 I/O，但它的价格也比其他选项贵得多。此外，它的尺寸也比其他大得多，为 4.25 英寸 x 2.1 英寸。考虑到所有因素，Arduino®
    NANO 将是最佳选择，不仅因为它最便宜，而且因为它能很好地安装在松木赛车上。我将面临的最大问题是它只有 14 个数字 I/O，而我至少需要 16 个，还不包括中断和用于大灯的传感器。这还是假设我将对每个大灯使用简单的开启/关闭。如果我将其改为模拟输入，那么我就可以在检测到特定亮度时开启大灯。


    我能看到的处理数字 I/O 问题的最佳方法是添加几个芯片来扩展我的 I/O 引脚。我可以将这些额外的芯片放置在带有七段码显示器和大灯（即两个 LED）的扩展板上。我想中的芯片是我过去在其他设计中使用过的一些芯片，因此我对它们的工作原理以及任何可能存在的局限性有很好的了解。我想到的芯片是
    `SN74LS595` 移位寄存器。这种设备的妙之处在于它接受串行输入并将其转换为并行输出。我可以移入一个代表我的七段码显示器的值，并使用此设备驱动显示器的实际段。最少，我只需要两个数字
    I/O 线就可以运行此设备，并最终获得 8 条输出线。从 2 个数字 I/O 变为 8 个是一个不坏的权衡。当然，这是一种方法，我只能用它来扩展输出，但对于我目前的项目来说，这是完美的。对于这个特定设备，它有两个时钟信号，一个用于移位寄存器，一个用于存储寄存器。存储寄存器是一种缓冲区，允许你在发送数据到输出引脚之前构建完整的
    8 位数据值。需要选择在于你是否想让这些时钟线中的每一条都有单独输出，如果你的输出最好同时开启，那么第二条时钟线就是你需要的。我希望一次性移出整个值以减少闪烁，所以我将利用这条额外的时钟线，并为我的每个七段码显示器使用三个数字
    I/O 线。这样做是为了当我向 `SN74LS595` 写入值时，我将看到从一个数字到下一个数字的清晰过渡。我还将为大灯使用两个数字 I/O，以便我可以独立地开启和关闭它们。这样一来，我现在使用了
    8 个数字 I/O。Arduino NANO 上有足够的 I/O 来完成此操作。


    现在我已经开始设计，发现我的一些需求将是不实际的。为了调整每辆车的数字，我要么必须使用几个开关（这会增加我需要的 I/O 数量），要么将需要使用模拟输入并将模拟值转换为数字等效值。至于光电探测器，我想将放弃它。虽然灯光在需要时开启、在不需要时关闭很酷，但我追求的是一种闪炫的效果，我想让它们一直闪烁。另一件事是利用中断来触发灯光应该变化的时机。我仍然可以这样做，因为在代码中只需简单处理即可，无需任何硬件，但并不是真正必要的。我只需要让循环来完成即可，因为实际上微控制器在工作方面不会做很多。有了上述设计考虑，我的最终需求如下：


    *   8 个数字输出

    *   2 个按按钮

    *   用于设置显示数值为 00 到 99 的输入

    *   用于安装七段码显示器和大灯的扩展板


