    ## Summary


    In this chapter we looked at various ways to output data from our Arduino® to
    control the world around us. This ranges from simple visual indicators to alert
    us when an issue arises, to automated control systems that can keep a device cool
    based on the surrounding temperature. We also looked at servo''s which could be
    used for simple movement or could as part of a system to control a robotic arm
    or other sophisticated machinery. Overall, the number of possibilities are only
    limited by the imagination of the developer.


    ![chapter end graphic](images/00001.jpeg)


    # Program Interrupted


    ## Stop! Stop! Wait


    Interrupts are a very important aspect of program implementation and can be leveraged
    to provide clarity to an application. Interrupts allow you to focus on the task
    at hand while knowing that other operations are going to happen when they should.
    They can also be the source of all sorts of trouble and make it difficult to determine
    what is happening in your application. With proper planning and good coding practices
    though, you can keep them under control.


    I imagine your first question is what is an interrupt? An interrupt is a signal
    to your micro-controller indicating that an event has occurred. The reason this
    is beneficial is that it tells the micro-controller that there is something to
    be done opposed to having it waiting around checking periodically for something
    to do. Consider if you had a pet dog that you needed to take outside during the
    day to do their business. Your first option is to jump up and check every five
    (5) minutes or so to see if he/she needs to go out. While this would be a successful
    approach, it does waste a lot of time. The other option is to train your pet to
    notify you when it needs to go out. With this approach you can go about your business,
    and when needed, take your pet outside to do theirs. Your day remains productive
    while your pet gets relief when they need it. Sort of a win/win situation. An
    interrupt is the same thing overall. Instead of checking to see if something needs
    to be done, the interrupt notifies your micro-controller that something needs
    attention and then allows it to handle the distraction when needed in the way
    it should be done. Once the interrupt has been satisfied, the micro-controller
    can go back to doing whatever else it needs to do and not waste time continuously
    checking input pins.


    In one of the previous chapters we looked at various types of inputs such as analog
    signals and digital values. For one circuit we carefully set up the circuit to
    provide an input when the temperature reached a certain point. For our purposes,
    this worked well and we were able to determine when an action should be taken
    such as turning a fan on. While that did the trick and worked decent enough, we
    wasted a lot of time monitoring the input pin to see if it was time to take action.
    That was a lot of wasted effort and we can do better. Imagine having a tropical
    fish tank where the fish have to be kept at 78°F exactly. When the temperature
    gets too cold, the fish get chilled and die. When the temperature gets to warm,
    the oxygen in the water goes down and the fish die. So what do we do? We can use
    the circuit from before however we wasted a lot of effort checking to see if the
    temperature was above a certain level. Now we want to also check if it is below
    a certain level. And what happens if we check for it to be above 78°F and its
    actually below that temperature? We end up standing around the toilet in the bathroom
    saying good bye to our fish. Not good. What we need is a way to signal the micro-controller
    at anytime that there is an important action that needs to take place. This is
    where interrupts come in.


    In the example below, I will build a circuit that will trigger off of one temperature
    circuit. The second half of the circuit to detect the temperature dropping below
    a specific point can be added and wired to a second interrupt pin to be handled
    accordingly.


    The Arduino® and most importantly, the Atmel® micro-controller, is designed to
    allow external events to signal the micro-controller that there is an important
    action to be taken. The Ardunio® provides a number of pins that can be used for
    external interrupts. The following table details which pins of the Arduino® can
    be used for external interrupts.


    | Arduino® Board | Interrupt 0 | Interrupt 1 | Interrupt 2 | Interrupt 3 | Interrupt
    4 | Interrupt 5 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | NANO | Pin 2 | Pin 3 | N/A | N/A | N/A | N/A |

    | UNO | Pin 2 | Pin 3 | N/A | N/A | N/A | N/A |

    | MEGA 2560 | Pin 2 | Pin 3 | Pin 21 | Pin 20 | Pin 19 | Pin 18 |

    | Due | * | * | * | * | * | * |

    | Yun | Pin 3 | Pin 2 | Pin 0 | Pin 1 | Pin 7 | N/A |


    * The Arduino® Due can have interrupts mapped to all available pins. When using
    this particular board, you will have to specify the pin number opposed to interrupt
    number;


    For these examples, I will only be using pins two (2) and three (3) as they are
    consistent across most of the various boards I have been working with and will
    make the examples easier to follow.


    The Yun appears to have the interrupts, 0 and 1, swapped in terms of pins based
    on the documentation that I could find.


    ## Temperature Trigger


    The first thing we will do is to take our temperature circuit ([Temperature Trigger](#part0004_split_002.html_temptrigger))
    and put the input on pin 2 which will correlate with Interrupt 0. Next we will
    have to instruct the Arduino to expect an interrupt on that pin.


    ### Required Components


    *   Arduino® Board

    *   (2) 4.7K Ohm Resistor

    *   (2) 10K Trim potentiometers

    *   LM335 temperature sensor[[7](#part0012_split_001.html_Ref7)] or similar such
    as the NTE7225[[8](#part0012_split_001.html_Ref8)]

    *   LM311 voltage comparator[[9](#part0012_split_001.html_Ref9)] or similar such
    as the NTE943M[[10](#part0012_split_001.html_Ref10)]


    ### Tools


    *   breadboard

    *   jumper wires

    *   voltage meter


    ### Schematic


    ![LM335 Temperature triggering circuit](images/00025.jpeg)


    ![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created
    using: [Fritzing](http://fritzing.org/)


    ### Software


    The following code incorporates the analog reading for the temperature set point
    that we wish to trigger off of. Prior to connecting the analog pin zero (0) to
    the LM311 comparator input, you may want to place it on pin two (2) of the LM335
    to adjust the temperature sensor to the current room temperature.

