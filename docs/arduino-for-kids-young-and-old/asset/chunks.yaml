    \ on. So where does a structure come in handy when programming? Well, now I can\
    \ use this structure just like I would a regular variable type such as an integer.\
    \ I am now able to do the following:\n\n```\n volatile EE_Structure StoredData;\
    \ \n```\n\nThis allows me to declare both the signature and the brightness at\
    \ the same time. It also keeps them together as one unit which I can pass around\
    \ to methods as needed. I didn't take full advantage of all of the benefits of\
    \ a structure however it still comes in handy to keep my data contained within\
    \ one type. If I had multiple encoders with multiple ID's, I could create one\
    \ of these structures for each of the LED's. I could also associate the output\
    \ pin for each LED with the brightness to keep each data set together. This can\
    \ be very useful when your data needs increase and the complexity of your sketches\
    \ increase. This is also a fundamental premise of object oriented design and C++\
    \ which is an object oriented programming language. Keeping your data and the\
    \ methods that work with that data combined allows you to create building blocks\
    \ to work with in your later sketches.\n\nThe next few line of code are the function\
    \ declarations and the various helper functions that I wrote to make my program\
