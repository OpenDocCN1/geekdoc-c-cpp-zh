  trans: "\n这种方法是一种非常快速模拟 SPI 总线的方法，而无需实际使用 SPI。其主要缺点是速度比真实的 SPI 总线慢得多，而且灵活性也较低。特别是，它非常适合向设备发送数据，但在读回数据时并不方便。通常情况下，你必须向设备发送一个命令，让它返回响应。如果目标设备复用了\
    \ MOSI 引脚和 MISO 引脚，这并不是大问题，但你需要在发送命令时将数据引脚配置为输出，然后在从目标设备接收回数据时将其重新配置为输入。当然，你也可以始终通过\
    \ Arduino® 的另一个 I/O 引脚读回数据。这会慢得多，并且容易出现时序问题。\n\n## I2C\n\n集成电路接口（I2C）是另一种用于外围设备之间的串行数据通信接口。I2C\
    \ 利用以下两种信号：\n\n| 信号名称 | 用途 |\n| :--- | :--- |\n| SCL | 用于同步 I2C 设备的时钟信号 |\n| SDA\
    \ | 主设备与从设备之间的串行数据线 |\n\n在很多很多方面，I2C 与三（3）线模式下的 SPI 非常相似，它由一个同步时钟和一条用于传输和接收的数据线组成。主要的区别是\
    \ I2C 没有专用的片选线，而是依靠数据内部的地址来指示数据发送给哪个设备。然而，目前 I2C 的没有 SPI 快，但对于大多数应用来说，这可能不是一个问题。因为\
    \ I2C 只利用时钟和数据线（即它不包含片选线），因此发送的数据包含了接收者的地址。该地址通常在起始位之后，为 7 位。这允许控制设备选择哪一个接收设备将接收命令/数据。需要注意的是，虽然可能只有一个设备是所发送数据的预期接收者，但同一条总线上的任何设备都会看到所相同的数据。与目标设备地址不同的设备应直接忽略这些数据。还有其他寻址方案，包括\
    \ 10 位寻址和多达 16 位寻址。在所有情况下，这取决于所使用的设备，并且在在使用之前应该查阅特定设备的数据表。在 Arduino® 上，使用的地址是七（7）位。Arduino®\
    \ 网站建议将八（8）位地址右移一（1）位，以便转换为七位地址。\n\n下表识别了各种 Arduino® 模块用于 I2C 通的引脚。\n\n| Arduino®\
    \ | SDA | SCL |\n| :--- | :--- | :--- |\n| UNO R3 | A4 | A5 |\n| Leonardo | 2\
    \ | 3 |\n| DUE | 20, SDA1 | 21, SCL1 |\n| YUN | 2 | 3 |\n| MEGA 2560 | 20 | 21\
    \ |\n\n对于我们的目的，我们将与一个实现 I2C 接口的 LCD 面板接口。这将允许我们将状态信息写入连接到编程计算机串口以外的屏幕上。这将使项目调试变得更容易，并提供有关设备活动情况的反馈。我将使用的特定屏幕基于\
    \ `SH1106` 控制器芯片。\n\n### 所需组件\n\n* Arduino® 板\n* OLED LCD，基于 `SH1106` 控制器芯片的 128x64\
    \ 显示\n\n### 工具\n\n*  Bread 板\n* 跳线线\n* 电压表\n\n### 原图\n\n![I2C display](img/00030.jpeg)\n\
    \n![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 图片创建自：Fritzing\n\
    \n### 软件\n\n对于此草图，我们将利用 `Wire` 库通过 I2C 总线进行通信。我在编写此设备时发现的第一点是，该板是 128x64 像素，但我看到的很多文档都指示它支持\
    \ 132x64。在处理了一些奇怪的显示问题后，我发现它确实是 128x64。我创建了一个与显示器工作的库，可以从网上下载。主要的 Arduino® 草图非常简单，主要用于测试我的库是否正常运行。在上面的图中，你可以看到在连接方面并不多。图像底部显示\
    \ 1 到 20 引脚的底部是板载内部的。我有的这个板有四个（4）个引脚可以插入 Bread 板，并覆盖电压、地、SCL 和 SDA 引脚。\n\n对于代码，我将更多关注\
    \ `Wire` 库而不是我为了配合它而编写的代码。不过我将介绍几个与 `Wire` 库接口的例程。\n\n```\n typedef enum\n{\n\
    \    StartSend = 0,\n    MidSend,\n    FinishSend,\n    Complete\n} SendState;\n\
    \n/*\n *  发送命令 - 用于向 LCD 发送命令字节\n *\n * 参数\n *      command - 要发送的命令\n *     \
    \ state   - 传输状态\n *\n *  返回\n *      byte - 传输的返回值\n */\n\nbyte sh1106_lcd::SendCommand(byte\
    \ command, SendState state)\n{\n    if (state == StartSend || state == Complete)\
    \ {\n        Wire.beginTransmission(SH1106_ADDR);\n    }\n    Wire.write(command);\n\
    \    if (state == FinishSend || state == Complete) {\n        Wire.endTransmission();\n\
    \    }\n    return command;\n}\n\n/*\n *  发送数据 - 用于向 LCD 发送数据字节\n *\n * 参数\n *\
    \      data - 要发送的数据\n *      state   - 传输状态\n *\n *  返回\n *      byte - 传输的返回值\n\
    \ */\n\nbyte sh1106_lcd::SendData(byte data, SendState state)\n{\n    if (state\
    \ == StartSend || state == Complete) {\n        Wire.beginTransmission(SH1106_ADDR);\n\
    \    }\n    Wire.write(data);\n    if (state == FinishSend || state == Complete)\
    \ {\n        Wire.endTransmission();\n    }\n    return data;\n}\n\n/*\n *  发送字节\
    \ - 用于向 LCD 发送一个字节\n *\n * 参数\n *      data - 要发送的数据\n *      state   - 传输状态\n\
    \ *\n *  返回\n *      byte - 传输的返回值\n */\n\nbyte sh1106_lcd::SendByte(byte data,\
    \ SendState state)\n{\n    Wire.write(data);\n    byte transmissionStatus = 0;\n\
    \    if (state == FinishSend || state == Complete) {\n        transmissionStatus\
    \ = Wire.endTransmission();\n    }\n    return transmissionStatus;\n}\n```\n\n\
    在上面的代码中，我编写了两个向 LCD 发送命令和数据的主要方法，以及一个会被其他每个方法使用的第三方法。因为我们可以向控制器芯片发送数据和命令，所以我编写了两个独立的方法来处理，唯一的区别是写入\
    \ I2C 总线上的第一个值，它指示随后的字节是命令还是数据。我确定还有其他可以节省空间的方法，但我选择了这种方法，因为它在我的意图方面很清晰。代码中另一个感兴趣的项是发送状态\
    \ `SendState` 枚举，我用它来跟踪向 I2C 设备发送数据时所处的状态。`Wire` 可以在其传输队列中缓冲最多三十二（32）字节的数据以便一次性发送。如上所示，发送的开始和结束会增加开销，对于每一个字节的数据，这积可能会在\
    \ I2C 总线上产生许多不必要的活动。\n"
- fmt: "\nSo now that I have given you some of the background of how the `Wire` library\
    \ is used, lets dig a little deeper. So how did I know how big the buffer inside\
    \ of the `Wire` library was? I looked. Each of the libraries that you can import\
    \ right out of the box reside on the local machine where the Arduino® application\
    \ resides. On my Windows™ machine, I found it in `C:\\Program Files (x86)\\Arduino\\\
    libraries\\Wire`. For the Macintosh™ system it was located inside of the Arduino®\
    \ package which you can view by Control - Clicking the mouse button and selecting\
    \ the `Show Package Contents` option on the context menu that comes up. Doing\
    \ this should then show a folder `Contents` which has inside it a number of folders.\
    \ If you open the folder `Resources` you should find another folder entitled `Java`.\
    \ Inside the `Java` folder is a file structure very similar to the PC based system\
    \ including the `libraries` folder which contains the `Wire` folder. Inside of\
    \ this folder, `Wire`, there is another folder called `utility` which contains\
    \ support files for the `Wire` library. This code is the base two wire code, `TWI`\
    \ which is the closest we get to the hardware.\n\nWhile that was a lot of digging\
    \ around, it is always good to know how the libraries that you are depending on\
    \ work. In this case, one key issue I had was the amount of data I could queue\
    \ up before sending. The standard serial library can queue up around 64 bytes\
    \ however this library, `Wire` has a maximum buffer size of 32 bytes. Always a\
    \ good thing to know when trying to send 1024 bytes of screen data over a slow\
    \ bus. The 1024 bytes of data comes from my internal buffer that I use to track\
    \ the state of each pixel on the LCD. If you look within the class I created for\
    \ the `sh1106`, you will find the following:\n\n```\n // 1024 bytes 8 pages of\
    \ 128 bits\n\nbyte m_screen[MAX_PAGE_COUNT][SCREEN_WIDTH]; \n```\n\nNot one of\
    \ my longer comments for sure however it does sum things up in that there is 1024\
    \ bytes to cover the 8 pages of memory which are each 128 bits wide. This buffer\
    \ allows me to queue up a number of higher level commands such as `DrawPixel`,\
    \ `DrawLine`, etc. before sending the data down to the actual device. This saves\
    \ some time however can lead to some mysterious bugs such as a figure being hidden\
    \ by another figure due to the ordering of the drawing. In this case, user beware\
    \ given the resource constraints of the system and the limitations in general\
    \ of the environment.\n\nNow the next thing to look at is the details of the `Wire`\
    \ class. The first thing to do when using the library is to start the transmission\
    \ by calling the method:`Wire.beginTransmission(SH1106_ADDR1)`. This call includes\
    \ the address of the device I want to communicate with making my Arduino® the\
    \ master and the LCD the slave. Once I start transmission, I can then send the\
    \ byte of data representing a command or data message that will follow. This is\
    \ done with the simple `Wire.write(SH1106_COMMAND)` or `Wire.write(SH1106_DATA)`\
    \ function call. Once I have done that I can then send a number of data bytes\
    \ associated with the command or data flag. Once I have sent all of my data I\
    \ will call the `Wire.endTransmission()` to finish the transmission of the data\
    \ which will also return a status byte indicating if there were any errors. In\
    \ general that is how easy it is to use the `Wire` library. In addition to the\
    \ calls detailed above, there are a number of standard I/O style calls inherited\
    \ from the `Stream` class like `read`, `write`, `seek`, etc. The last method I\
    \ will highlight is the `requestFrom(address, quantity)` where the address which\
    \ should provide the data and the quantity being the number of bytes that we expect\
    \ to receive back from said device. This allows us to read data back from an I2C\
    \ device.\n\n### Summary\n\nAs can be seen, there are a number of ways to communicate\
    \ with external devices including additional protocols not detailed above such\
    \ as [SATA](http://en.wikipedia.org/wiki/Serial_ATA), [PCI Express](http://en.wikipedia.org/wiki/PCI_Express)\
    \ and others. Most of these are standard in a PC type setting but not always found\
    \ in an embedded micro-controller. In terms of an embedded micro-controller such\
    \ as the Atmel® device used on the Arduino® the above communication methods will\
    \ be the most common and easy to interface with. We also looked at both SPI and\
    \ I2C which are quite similar to each other but do have various pro's and con's.\n\
    \n| Protocol | Pro's | Con's |\n| :--- | :--- | :--- |\n| Serial | Simple and\
    \ quite ubiquitous. Has both standard and TTL interfaces. | Somewhat slow. Not\
    \ good for any type of broadcasting i.e. sending data to multiple devices at the\
    \ same time unless you have a special adapter. |\n| SPI | Speed. Can run very\
    \ fast and can use the same clock and data line to communicate with a number of\
    \ devices. | Requires a dedicated select pin for each device participating on\
    \ the SPI bus. |\n| I2C | Can be faster than Serial but not up there with SPI.\
    \ Only uses two wires as the target device address is part of the data that is\
    \ transmitted. | Potential for conflicts when trying to send data when another\
    \ device is already using the bus. Not as fast as SPI. |\n\n![chapter end graphic](images/00001.jpeg)\n\
    \n# Storage\n\n## Bits and Bytes\n\nStorage is another area where the Arduino®\
    \ and more importantly, the Atmel® micro-controller really shines. The main device\
    \ on each of the boards has the capability to store program code, variables, and\
    \ semi-permanent data.\n\n### Flash Memory\n\nFlash memory is where your application\
    \ code will be stored and loaded from during program execution. This memory is\
    \ persistent and can be reprogrammed numerous times. In order to program this\
    \ memory, the device has to be configured appropriately and then programmed. Programming\
    \ of the Arduino® boards is typically done directly through the Arduino® IDE using\
    \ the USB port of your development computer attached to the board being programmed.\
    \ Once programmed, the device will maintain this memory even when power is lost.\
    \ This type of memory is fairly slow compared to other types of memory. This memory\
    \ is split into two sections, a boot loader and then an application area. The\
    \ size of each is configurable to accommodate the various needs of the boot loader\
    \ and the application code. The main thing to be aware of is that the size of\
    \ your end application has to be small enough to fit into the application code\
    \ area taking into account the amount of size used by the boot loader.\n\n####\
    \ Boot Loader\n\nThe boot loader is special software that allows the micro-controller\
    \ to reprogram itself. You may see advertisements for Atmel® devices where it\
    \ states that it has the Arduino® boot loader programmed in. This boot loader\
    \ is what allows the Arduino® to be programmed from the IDE. While I wont go to\
    \ deep into the details of everything the boot loader does, the primary purpose\
    \ is to check if a reprogram cycle is being requested and if not then to launch\
    \ the application code that has been stored in the application section of the\
    \ flash memory. Because the boot loader and application code share the same flash\
    \ memory, keeping the size of the boot loader to a minimum is usually considered\
    \ best practice. For your own projects, this may not be a requirement depending\
    \ on the size of your application software. For more details of what goes into\
    \ a boot loader for an Atmel® type micro-controller, take a look at the following\
    \ [Design Note (32)](http://www.avrfreaks.net/modules/FreaksFiles/files/419/DN_032.pdf).\n\
    \n#### Application Code\n"
  raw: "So now that I have given you some of the background of how the Wire library\
    \ is used, lets dig a little deeper. So how did I know how big the buffer inside\
