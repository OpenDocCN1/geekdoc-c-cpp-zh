    In this example, the main goal was to simply be able to detect the input trigger,
    the interrupt, indicating that our set point was reached. We could go a little
    further in cleaning up the code by not doing any work unless the interrupt was
    triggered. However for testing, I wanted to monitor the values being read to ensure
    things were working as expected. As mentioned above, I didn''t build the second
    half of the circuit which would trigger when a temperature fell below a certain
    value. To do this, you could use the same circuit as shown however in this case
    you would calibrate it for the lower temperature and change the interrupt routine
    to trigger off of the `FALLING` edge. In general the input to the interrupt would
    be high and would go low once the temperature dropped below the target value.


    # Rotary Encoder


    For this project we will be looking at rotary encoders to determine the amount
    of distance a user wants to traverse in relation to a signal. For instance, I
    may want to use the rotary encoder to brighten or dim an LED. I can use a potentiometer
    for this however a rotary encoder might do the job better given its behavior.
    In addition to this I store my current setting in the onboard `EEPROM` in order
    to return to that value at start up. This also prevents any potential issues with
    the brightness changing during movement and such while the device is turned off.
    This could happen with a potentiometer as it has a fixed length of travel i.e.
    it can only go so far in either direction and can be turned while the device is
    not powered on. A rotary encoder, however, is designed to spin continuously in
    either direction so it will not matter if it is turned while the device is powered
    off. The `Arduino®` will only act upon it when it is powered on. I will configure
    my `Arduino®` to trigger off of inputs from the rotary encoder to determine how
    bright the LED should be.


    ## Required Components


    * `Arduino®` Board

    * (4) 10K Ohm Resistors

    * (2) 0.01uF capacitors

    * `ALPS STE1207` Rotary Encoder

    * Red LED


    ## Tools


    * breadboard

    * jumper wires

    * voltage meter


    ## Schematic


    ![Rotary encoder trigger circuit](images/00026.jpeg)


    ![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image created
    using: [Fritzing](http://fritzing.org/)


    ## Software


    For this code, we will configure our interrupt to trigger when one signal of the
    rotary encoder is active. When that happens we will read the value on the secondary
    pin to see which direction the encoder is being turned. The decoder is designed
    such that one signal will trigger and at the trigger time the other signal will
    be either high or low depending on the direction it is being turned. So the one
    input triggers our software to indicate movement while the other input gives us
    the direction. We will then have to determine how many signals we have received
    to determine the number of turns the user has made. Extra circuitry, resistors
    and capacitors, have been added to the rotary encoder to allow for better signal
    integrity. This information is provided by the manufacturer of the rotary encoder
    and can be found usually on their website. Typically, I will download the manufacturer''s
    data sheet when a component is unfamiliar to me as they will usually have sample
    circuits that you can utilize when creating your own circuits.

