    \ */\n\nint ReadPot(int selectPin, struct _CommandData *pData)\n{\n  int dataRead\
    \ = 0;\n\n  digitalWrite(selectPin, LOW);\n  delay(100);\n\n  dataRead = SPI.transfer(pData->command.cmdByte)\
    \ << 8;\n  dataRead |= SPI.transfer(pData->data);\n  digitalWrite(selectPin, HIGH);\n\
    \n  dataRead &= 0x1FF;\n\n  return dataRead;\n}\n\n/*\n * Enumerations for clarity\
    \ of code\n */\n\n/*\n *  This enum is a definition of each address that can\n\
    \ *  be accessed on the potentiometer\n */\n\ntypedef enum\n{\n  Wiper0 = 0,\n\
    \  Wiper1,\n  NVWiper0,\n  NVWiper1,\n  TConReg,\n  StatusReg,\n  Data0,\n  Data1,\n\
    \  Data2,\n  Data3,\n  Data4,\n  Data5,\n  Data6,\n  Data7,\n  Data8,\n  Data9,\n\
    } Addresses;\n\n/*\n *  This enum is a definition of each command that can\n *\
    \  be sent to the potentiometer\n */\n\ntypedef enum\n{\n  WriteData = 0,\n  Increment,\n\
    \  Decrement,\n  ReadData\n} Commands;\n\n/*\n * Setup - main configuration point\
