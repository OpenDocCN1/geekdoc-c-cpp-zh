  raw: "The application code area is where all of the end user's application code\
    \ is stored. It can be reprogrammed by the user via the IDE or other means such\
    \ as from the command line using a program like avrdude[[13](#part0012_split_001.html_Ref13)].\
    \ This memory is persistent in nature where it will retain the programming for\
    \ a number of years well beyond the typical life span of the product. The application\
    \ code is called by the boot loader once the boot loader determines that the user\
    \ does not want to reprogram the device. For our applications, this would be the\
    \ setup and loop methods we created along with any additional libraries we may\
    \ have used and the base Arduino® code.\n\n### SRAM\n\nThe static random access\
    \ memory, SRAM, is where all of the application data is stored during the execution\
    \ of your application. Unlike the flash memory, it can be written to fairly fast\
    \ and the device doesn't need to be configured in any specific way to do this.\
    \ The down side of SRAM is that if power is lost, the memory contents are lost\
    \ unless there is a battery installed in the system to preserve it. This makes\
    \ it good for run time data however not so good for long term storage. Another\
    \ thing to note regarding SRAM, and RAM in general, is that it will typically\
    \ power on with arbitrary values contained within it. This is why it is always\
    \ good idea to initialize your variables when they are first declared to ensure\
    \ the value stored there is something reasonable given its purpose. While this\
    \ memory is called static it is not persistent. The name static indicates that\
    \ the memory does not have to be refreshed periodically to retain its data. The\
    \ complimentary memory to static is dynamic memory. Dynamic memory requires that\
    \ a memory controller refresh the data periodically in order to maintain its state.\
    \ I won't get too deep into the details however it should be noted that dynamic\
    \ memory, DRAM, circuits are smaller then their SRAM counterparts resulting in\
    \ higher densities and thus cheaper memory. Typically you will find DRAM in computer\
    \ systems as the main memory or used in conjunction with video cards or other\
    \ peripherals.\n\nThe other downside to SRAM for the Atmel® micro-controllers\
    \ is that is very limited in size. When developing your applications i.e. sketches,\
    \ you will want to ensure that you keep your memory usage fairly conservative.\
    \ In the chapter, [Communications](#part0007_split_002.html_i2c), I created a\
    \ library for an LCD which uses 1024 bytes of SRAM to store the current screen\
    \ image. For the Arduino® UNO, this was half of all the memory my board had!\n\
    \n### EEPROM\n\nElectrically erasable programmable read only memory or EEPROM\
    \ is a good compromise between flash memory and SRAM. Like flash memory, it is\
    \ persistent and can be written to although is fairly slow. Unlike flash memory,\
    \ the EEPROM cannot store program code as the micro-controller cannot directly\
    \ execute code stored in EEPROM. You could load it from EEPROM and place it into\
    \ SRAM however that is a bit beyond what I want to cover at this time. Like SRAM,\
    \ it doesn't require any special configuration and can be directly written to\
    \ by the application code. This makes the name somewhat a misnomer in that it\
    \ isn't quite read only any longer however in general usage, it will be written\
    \ to in order store configuration or other persistent data that is read more often\
    \ then written to. Typically I would use EEPROM memory area for storing items\
    \ such as a serial number, board configuration, or other somewhat static data.\
    \ The Arduino® UNO™ micro-controller has 1K (1024 bytes) of EEPROM memory available\
    \ to it. Given the various temperature circuits we have looked at, we could use\
    \ this memory to store the high and low temperature for each day throughout a\
    \ given year. Over time we could see the range of temperatures and could offload\
    \ the data to a computer for further processing.\n\nAs seen in previous chapters,\
    \ the Arduino™ has a rich set of libraries to work with various aspects of the\
    \ micro-controller. For the EEPROM, the following library is included:\n\n```\n\
    \ #include <EEPROM.h> \n```\n\nwhich allows us to simply write and read to and\
    \ from the EEPROM like most any other memory using a couple of provided commands.\n\
    \n```\n byte dataValue = EEPROM.read(offset);\n\t\t\tEEPROM.write(offset, dataValue);\
    \ \n```\n\nThe only downside with the EEPROM library is that you must manage the\
    \ offset into the storage area yourself. This however isn't a major concern given\
    \ the amount used is typically low and helper functions can be written as I have\
    \ done in the chapter on [interrupts](#part0006_split_001.html_rotaryencoder).\n\
    \n### I/O Memory\n\nThis is memory or memory like data located external to the\
    \ micro-controller and is accessed by mapping it through the I/O registers. This\
    \ could be done for a number of devices such as an LCD panel or other device that\
    \ has a data bus. Because we are using an Arduino®, I am not going to delve into\
    \ this particular area other than to say it can be used with the Arduino® however\
    \ the number of I/O pins required to operate it quickly grows limiting your options.\n\
    \n### External Memory\n\nIn addition to the memory that is internal to the micro-controller,\
    \ additional memory can be utilized by the Arduino® using various communication\
    \ interfaces such as SPI, I2C, etc. One example of this is the SD micro-card that\
    \ can be accessed depending on what shield is being used in conjunction with the\
    \ Arduino®. Previously we have utilized an SPI based digital potentiometer which\
    \ also contained persistent memory. Another example would be a real time clock\
    \ RTC where the system has an external battery and crystal to keep the time while\
    \ the system is powered off.\n\n### Summary\n\nIn this chapter we have looked\
    \ at the various types of storage available to the Arduino® and how they are typically\
    \ used. In general, the FLASH, SRAM, and EEPROM are the main types of memory you\
    \ will use most often. Of the three, EEPROM is the one that will most likely be\
    \ used the least however it will be very convenient when you need to persist data\
    \ between application runs. SRAM will be the one that you wish you had more of\
    \ while the FLASH memory will probably be sufficient for your application needs.\n\
    \n![chapter end graphic](images/00001.jpeg)\n\n# I/O Expansion\n\n## When one\
    \ just isn't enough\n\nEnsuring that you have identified all of the functions\
    \ that you need up front is always a good idea when working with a micro-controller.\
    \ Not having to go back and rework your complete design because you need another\
    \ output line is best to say the least. Of course not having to buy more computing\
    \ power than you need is always good too, especially if you plan on building a\
    \ number of the same items. For the next project I have in mind, I want to add\
    \ two, seven segment, displays to the pinewood derby car's my children are making.\
    \ In order to do this, I will need two of the seven segment displays representing\
    \ each digit along with an Arduino® to drive them. Because weight and size is\
    \ a concern, I want to utilize the smallest Arduino® that I can while still having\
    \ enough I/O's to drive the displays. For good measure, I also want to add two\
    \ headlights because I can. I think this will also look very cool so there you\
    \ go. With all of that, I need 14 digital outputs to drive each of the segments\
    \ of the displays along with two additional outputs for the headlights. So overall\
    \ I needed 16 digital outputs to drive all of the lights I have in mind. I also\
    \ would like to flash the lights on and off and perhaps do some sequencing through\
    \ the displays in order to catch the eye of the onlookers.\n\n### Requirements\n\
    \nThe first thing I need to do is ensure I capture all of my requirements so I\
    \ know what I need up front. From there I can look at what pieces of hardware\
    \ I will need. The following is my first pass at some requirements.\n\n*   16\
    \ digital outputs\n\n*   Interrupt to update the displays\n\n*   Input to trigger\
    \ the head lights\n\n*   Input to set the display value from 00 to 99"
