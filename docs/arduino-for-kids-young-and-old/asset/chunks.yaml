  trans: "\n\n```cpp\n /*\n * ServoPWM - 此示例程序的目的是控制舵服以执行某些工作。\n *            led\
    \ 用于指示舵服运行的方向：当舵服向前移动时 LED\n *            熄灭，当向后移动时 LED 亮起。\n *\n * ledPin 用于驱动\
    \ LED 的开启或关闭。\n *\n * servoPin 用于驱动舵服电机。\n * */        \nconst int ledPin = 8;\n\
    const int servoPin = 11;\n\n/*\n *  Arduino PWM 信号的频率约为 490 Hz\n *  这意味着每个周期为\
    \ 2 毫秒。\n */\n\nconst int pwmFrequency = 490;\n\ntypedef enum\n{\n  FORWARD =\
    \ 0,\n  BACKWARD = 1\n} eDirection;\n\neDirection servoDirection = FORWARD;\n\n\
    /*\n * LS-3006 的电机速度\n * 以微秒为单位定义。\n */\n\ntypedef enum\n{\n  FORWARD_SPEED =\
    \ 128,  // (1000 微秒) 等于我们周周期的一半\n  BACKWARD_SPEED = 250, // (2000 微秒) 基本上是一个完整周期\n\
    \  NEUTRAL_SPEED = 192,  // (1500 微秒) 等于周期的三四之二，\n} eMotorSpeed;\n\neMotorSpeed\
    \ motorSpeed = FORWARD_SPEED;\n\n/*\n * 方法声明\n */\n\n/* 此示例程序中没有额外的方法 */\n\n/*\n\
    \ * Setup - 程序的主要配置点，用于配置\n *         Arduino 输出 PWM 输出\n *\n * 参数 - 无\n *\n *\
    \ 返回 - 无\n */\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);  \n}\n\n/*\n * loop\
    \ - 每当 Arduino 运行其主循环\n *        时都会调用的主方法，用于改变\n *        舵服的方向\n *\n * 参数 -\
    \ 无\n *\n * 返回 - 无\n */\n\nvoid loop()\n{\n  // 根据方向将 LED 设置为适当状态\n  if (servoDirection\
    \ == FORWARD)\n  {\n    motorSpeed = FORWARD_SPEED;\n    digitalWrite(ledPin,\
    \ LOW);\n    servoDirection = BACKWARD;  // 为下一次设置\n  }\n  else\n  {\n    motorSpeed\
    \ = BACKWARD_SPEED;\n    digitalWrite(ledPin, HIGH);\n    servoDirection = FORWARD;\
    \  // 为下一次设置\n  }\n\n  analogWrite(servoPin, motorSpeed);\n\n  // 休息一秒然后改变方向\n\
    \  delay(1000);\n} \n```\n\n## 常量\n\n常量。没有它们我们该怎么办呢？因此我再次声明了以下几个常量：\n\n```cpp\n\
    \ const int ledPin = 8;\nconst int servoPin = 11; \n```\n\n这仅定义了 LED 连接的引脚，以及驱动舵服信号（`PWM`）的引脚。\n\
    \n```cpp\n const int pwmFrequency = 490;\n\ntypedef enum\n{\n  FORWARD = 0,\n\
    \  BACKWARD = 1\n} eDirection;\n\neDirection servoDirection = FORWARD; \n```\n\
    \n在部分中，我声明了 `PWM` 信号的频率，即它从开启到关闭的循环频率。我还定义了一个[枚举](http://en.wikipedia.org/wiki/Enumerated_type)\
    \ 来指示舵服是在向前还是向后移动，即顺时针或反时针。\n\n```cpp\n typedef enum\n{\n  FORWARD_SPEED = 128,\
    \  // (1000 微秒) 等于我们周周期的一半\n  BACKWARD_SPEED = 250, // (2000 微秒) 基本上是一个完整周期\n\
    \  NEUTRAL_SPEED = 192,  // (1500 微秒) 等于周期的三四之二，\n} eMotorSpeed;\n\neMotorSpeed\
    \ motorSpeed = FORWARD_SPEED; \n```\n\n上述定义是此示例中最重要的，因为它们定义了发送到 `PWM` 控制引脚的值，代表控制舵服方向的信号。\n\
    \n## 方法声明\n\n此示例没有声明任何额外的方法。\n\n## Setup\n\n`setup()` 方法是我配置 Arduino® 按需运行的地方。对于此示例，唯一需要配置的引脚是连接板载\
    \ LED 的引脚，它将被声明为输出。\n\n```cpp\n void setup()\n{\n  pinMode(ledPin, OUTPUT);  \n\
    } \n```\n\n这段代码将将 `ledPin` 设置为输出信号。这将允许我们控制 LED 来指示舵服的方向。\n\n## Loop\n\n和之前一样，`loop()`\
    \ 方法是完成所有工作的地方。对于此示例，我们每秒将舵服的方向从向前切换到向后一次。虽然这段代码并不是真的有用，但其意图是展示如何使用它。然而，这种电路的应用是无尽的，它非常适合机械臂或可能是输送带，在这些情况下你需要更大的扭矩而不一定是速度。\n\
    \n```cpp\n void loop()\n{\n  // 根据方向将 LED 设置为适当状态\n  if (servoDirection == FORWARD)\n\
    \  {\n    motorSpeed = FORWARD_SPEED;\n    digitalWrite(ledPin, LOW);\n    servoDirection\
    \ = BACKWARD;  // 为下一次设置\n  }\n  else\n  {\n    motorSpeed = BACKWARD_SPEED;\n\
    \    digitalWrite(ledPin, HIGH);\n    servoDirection = FORWARD;  // 为下一次设置\n \
    \ }\n\n  analogWrite(servoPin, motorSpeed);\n\n  // 休息一秒然后改变方向\n  delay(1000);\n\
    } \n```\n\n在该电路中，我们使用 Arduino 的 `PWM` 信号让舵服向前和向后移动。LED 脚用于指示舵服应该移动的方向，即向前或向后。为了使其变得非常有用，我会使用一个输入来触发动作，例如当距离传感器触发时停止舵服移动。\n\
    \n### 数字输出\n\nArduino 支持多种数字输出，可以产生 `HIGH` 或 `LOW` 信号，分别代表 5 伏和 0 伏。那么数字输出用在哪里？在一种情况下，你可以将它们作为电子开关来激活外部电路，例如指示状态的电源\
    \ LED。\n\n#### 电源 LED\n\n对于数字输出的首次观察，我们将创建一个简单的电源电路，当系统达到状态时点亮 LED。我将使用三色 LED\
    \ 以获取状态信息。当板掉电时 LED 为红色，启动时为黄色，最后在正常运行时为绿色。\n\n* Arduino 板板\n* (3) 470 欧电阻\n*\
    \ (2) 4.7K 欧电阻\n* (2) 2N2222 三极管\n* 三色 LED\n* 3.0 v 电池\n\n### 工具\n\n* 面板\n* 跳线线\n\
    * 电压表\n\n### 原理图\n\n在该电路中，我将利用一个外部电池，当 Arduino 没有供电时开启三色 LED 的红色通道。一旦板开始供电，我们将\
    \ LED 设置为黄色，最后在我们进入 `LOOP` 方法后将其变为绿色。需要注意的是，我们需要将电池负极连接到 Arduino 的地引脚，以便在我们的组件之间建立公共地。\n\
    \n![电源指示三色 LED 电路](img/00024.jpeg)\n\n![知识共享 署名 - 相同许可](img/00005.jpeg) 图片创建于：[Fritzing](http://fritzing.org/)\n\
    \n## 软件\n\n以下代码用于管理电源指示电路，提供电路状态的视觉化表示。\n\n"
- fmt: "\n```cpp\n /*\n * Power Indicator - the purpose of this script/circuit is\
    \ to visually display\n *                   the health of the system via a tricolor\
    \ RGB LED.\n *\n * The redPin will be used to control the red portion of the LED.\n\
    \ *     Note: this pin will act different then the other two as\n *          \
    \ we will be turning this pin high to turn off the LED.\n *           To make\
    \ the code cleaner, this change is only\n *           handled in the LightLed\
    \ routine.\n * The greenPin will be used to control the green portion of the LED.\n\
    \ * The bluePin will be used to control the blue portion of the LED.\n *\n * For\
    \ this circuit, there will not be any additional inputs or outputs as this circuit\
    \ is\n * intended as the basis for a project opposed to a complete project.\n\
    \ */\n\n/*\n * Enumeration of values to turn on/off the 3 channels of the tricolor\
    \ LED\n */\n\ntypedef enum\n{\n  RED_ON = 0x1,\n  GREEN_ON = 0x2,\n  BLUE_ON =\
    \ 0x4\n} eLedSettings;\n\n/*\n * Constants used in this sketch\n */\n\nconst int\
    \ redPin = 9;\nconst int greenPin = 10;\nconst int bluePin = 11;\n\nconst int\
    \ POWER_OFF = RED_ON;\nconst int POWER_ON = GREEN_ON;\nconst int SETUP = GREEN_ON\
    \ | RED_ON;  // Turn both red and green on to get yellow\nconst int BLANK = 0;\
    \ // no lED's lit\n\n/*\n * Method declarations\n */\n\nvoid LightLed(int colors);\n\
    \n/*\n *  LightLed\n *\n * This method checks the passed in value to determine\
    \ which parts of the LED should be on and\n * which ones shouldn't be.  Only the\
    \ lower 3 bits are used to indicate the colors starting with\n * red as the LSB\
    \ (least significant bit) and blue the MSB (most significant bit)\n *\n * Params\
    \ - colors - a set of bits (bit mask) indicating which LED colors should be on\
    \ and\n *                   which ones should not be.\n *\n * Returns - none\n\
    \ */\n\nvoid LightLed(int colors)\n{\n  /*\n   *  Red acts differently where a\
    \ HIGH output turns off the LED and a LOW output\n   *  turns it on.\n   */\n\
    \  if (colors & RED_ON)\n  {\n    digitalWrite(redPin, LOW);\n  }\n  else\n  {\n\
    \    digitalWrite(redPin, HIGH);\n  }\n\n  if (colors & GREEN_ON)\n  {\n    digitalWrite(greenPin,\
    \ HIGH);\n  }\n  else\n  {\n    digitalWrite(greenPin, LOW);\n  }\n\n  if (colors\
    \ & BLUE_ON)\n  {\n    digitalWrite(bluePin, HIGH);\n  }\n  else\n  {\n    digitalWrite(bluePin,\
    \ LOW);\n  }\n} \n\n/*\n * Setup - main configuration point of our sketch to configure\n\
    \ *         the Arduino for writing digital values out on the defined pins\n *\n\
    \ * Params - none\n *\n * Returns - nothing\n */\n\nvoid setup()\n{\n  pinMode(redPin,\
    \ OUTPUT);\n  pinMode(greenPin, OUTPUT);\n  pinMode(bluePin, OUTPUT);\n\n  LightLed(SETUP);\n\
    \  delay(1000);\n}\n\n/*\n * loop - main method which will be called each time\
    \ the\n *        Arduino goes through its main loop to turn the\n *        LED\
    \ on to green and then off blinking every\n *        half second\n *\n * Params\
    \ - none\n *\n * Returns - nothing\n */\nvoid loop()\n{\n  LightLed(POWER_ON);\n\
    \  delay(500);\n\n  LightLed(BLANK);\n  delay(500);\n} \n```\n\n## Enumerations\n\
    \nIn this sketch I have used a new feature of the C programming language which\
    \ is called an enumeration i.e. `enum`. Much like a `const` integer or a definition\
    \ such as `#define VARIABLE`, an enumeration allows the developer to assign certain\
    \ values to names which makes our code easier to read. For this enumeration, I\
    \ have defined three values indicating if each of the parts of the LED are on\
    \ or off. I have assigned values for each of the enumerations such that each one\
    \ is a specific bit out of the total bytes. Consider the following:\n\n```cpp\n\
    \ const int myValue       = 42;         // decimal representation (base 10)\n\
    const int myValueHex    = 0x2A;       // hexadecimal representation (base 16)\n\
    const int myValueBinary = 0b00101010; // binary representation (base 2) \n```\n\
    \nEach of the constants are the same value however I have shown them in various\
    \ formats. As you can see, the decimal version is probably the easiest to understand\
    \ while the binary version is cumbersome but explicit in terms of what bits are\
    \ on and off. Binary numbers are the heart of computer computation. I am using\
    \ this feature of computer numbers to indicate if an LED should be on or off.\
    \ What makes this nice is that I can use one variable to indicate which parts\
    \ of the LED is on or off opposed to a separate value for each of the colors.\
    \ You may have noticed that each value assigned in my enumeration has unique bits\
    \ to represent it. The reason is that I can combine them to create additional\
    \ colors such as red and green creating yellow.\n\n## Constants\n\nIn the beginning\
    \ of this sketch I have declared some constant values which I will use later on\
    \ in my code. As I mentioned previously, it is better to declare these values\
    \ as constant that way you get the benefit of meaningful names. In this case I\
    \ will enable each of the pins being used as digital outputs prior to using them\
    \ which is done when I call the method `LightLed`.\n\n```cpp\nconst int POWER_OFF\
    \ = RED_ON;\nconst int POWER_ON = GREEN_ON;\nconst int SETUP = GREEN_ON | RED_ON;\
    \  // Turn both red and green on to get yellow\nconst int BLANK = 0; // no lED's\
    \ lit\n```\n\n## Method Declarations\n\nI declared one method in this sketch to\
    \ light up the LED based on the color. This allows for up to eight (8) total colors\
    \ with all colors on.\n\n## User Methods\n\nAs mentioned above, I have created\
    \ one method which will turn on each of the parts of the LED based on the incoming\
    \ color. The color value is called a bit mask which indicates which colors are\
    \ on and which ones are off. The passed in color value is anded i.e. `&` with\
    \ each of my constants, `RED_ON`, `GREEN_ON`, and `BLUE_ON`, to determine if part\
    \ of the LED should be on or off. The `&` operation is a fundamental operation\
    \ of binary numbers.\n\n## Setup\n\nThe `setup()` method is where I will configure\
    \ my Arduino® to operate as I need. In this case I will enable each of the pins\
    \ being used as digital outputs.\n\n```cpp\nvoid setup()\n{\n  pinMode(redPin,\
    \ OUTPUT);\n  pinMode(greenPin, OUTPUT);\n  pinMode(bluePin, OUTPUT);\n\n  LightLed(SETUP);\n\
    \  delay(1000);\n}\n```\n\nThe main thing of note in this setup code is that I\
    \ am delaying for one (1) second to allow the user to see the yellow LED before\
    \ changing it to green.\n\n## Loop\n\nNormally the `loop()` method is where all\
    \ of the work is done however since this is only a partial sketch i.e. I am showing\
    \ how to use a digital output and not much more, it is fairly limited in its functionality.\n\
    \n```cpp\nvoid loop()\n{\n  LightLed(POWER_ON);\n  delay(500);\n\n  LightLed(BLANK);\n\
    \  delay(500);\n} \n```\n"
