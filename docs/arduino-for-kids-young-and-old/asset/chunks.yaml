    \ POWER_OFF = RED_ON;\nconst int POWER_ON = GREEN_ON;\nconst int SETUP = GREEN_ON\
    \ | RED_ON;  // Turn both red and green on to get yellow\nconst int BLANK = 0;\
    \ // no lED's lit\n\n/*\n * Method declarations\n */\n\nvoid LightLed(int colors);\n\
    \n/*\n *  LightLed\n *\n * This method checks the passed in value to determine\
