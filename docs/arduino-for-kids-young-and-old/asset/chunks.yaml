  trans: "\n\n```cpp\n /*\n  * 此示例的设计用于建立一个蓝牙连接，以便在主机系统\n  * 和目标微控制器之间传输数据。\n  */\n\
    \n#include <stdio.h>            // `sprintf`\n#include <EEPROM.h>           //\
    \ 连接数据的存储\n#include <SoftwareSerial.h>   // 蓝牙模块与 arduino 之间的通信\n#include <btmodule.h>\
    \         // 与 SeeedStudio 蓝牙模块通信的 arduino 库\n\n// 板载 LED 状态引脚\n\n#define BT_CONNECTED_STATUS_PIN\
    \  13\n\n// 蓝牙扩展可以使用两个数字引脚进行 D0 - D7 的串口通信\n\n#define BT_COMM_SPEED 38400\n#define\
    \ BT_PIN_CODE 1234\n#define BT_RX_PIN 6\n#define BT_TX_PIN 7\n\n#define BT_CONNECTED_PIN\
    \ 1 // 模拟引脚\n\n// EEPROM 签名\n\nconst long signature = 0xACED; // 某些非任意值\n\n#define\
    \ MAX_BT_ADDRESS 32\n\n/* 此示例中使用的结构体 */\n\ntypedef struct\n{\n  long signature;\
    \                  // 只有当此处存储 0xACED 时，数据才有效\n  int valid;                   \
    \    // 0 表示无效，非零表示有效\n  byte bt_address[MAX_BT_ADDRESS]; // 之前发现的设备蓝牙地址\n} EE_Structure;\n\
    \n// 蓝牙通信的状态机\n\nenum StateMachine\n{\n  Initialize = 0, // 如果我们存储了设备地址，就可以跳转到连接\n\
    \  RestoreDeviceAddress,\n  DiscoveringDevice,\n  DeviceDiscovered, // 一旦发现，我们就可以在不进行所有设置的情况下重新连接\n\
    \  ConnectingToDevice,\n  ActiveCommunications,\n  ErrorState,\n  EndStates\n\
    };\n\n/*\n * 方法声明\n */\n\nint ReadInteger(int offset);\nvoid WriteInteger(int\
    \ offset, int value);\nlong ReadLong(int offset);\nvoid WriteLong(int offset,\
    \ long value);\nvoid ReadBytes(int offset, byte *data);\nvoid WriteBytes(int offset,\
    \ byte *data);\n\n/*\n * ReadInteger - 从非易失性存储中读取整数的辅助函数\n *\n * 参数 - offset -\
    \ 存储数据的 EEPROM 偏移量\n *\n * 返回 - int - 从指定位置读取的值\n */\n\nint ReadInteger(int offset)\n\
    {\n  int returnValue = 0;\n\n  // 从 EEPROM 中读取\n  for (int count = 0; count <\
    \ sizeof(int); count++)\n  {\n    returnValue |= EEPROM.read(offset + count) <<\
    \ (count * 8); // 从 eeprom 读取一个字节并左移 x 位以构建一个整数数据\n  }\n\n  return returnValue;\n\
    }\n\n/*\n * WriteInteger - 向非易失性存储中写入整数的辅助函数\n *\n * 参数 - offset - 要存储数据的 EEPROM\
    \ 偏移量\n *        - value - 要存储的值\n *\n * 返回 - 无\n */\n\nvoid WriteInteger(int\
    \ offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize = sizeof(int);\n\
    \n  for (int count = 0; count < intSize; count++)\n  {\n    dataValue = value\
    \ >> ((intSize - 1 - count) * 8); // 我们需要从左到右移位，高位在前\n    EEPROM.write(offset\
    \ + count, dataValue);\n  }\n}\n\n/*\n * ReadLong - 从非易失性存储中读取长整型的辅助函数\n *\n *\
    \ 参数 - offset - 存储数据的 EEPROM 偏移量\n *\n * 返回 - long - 从指定位置读取的值\n */\n\nlong ReadLong(int\
    \ offset)\n{\n  long value = 0;\n\n  int storedValue = ReadInteger(offset);\n\n\
    \  value = (storedValue << 16);\n\n  storedValue = ReadInteger(offset + 2);\n\n\
    \  value += storedValue;\n\n  return value;\n}\n\n/*\n * WriteLong - 向非易失性存储中写入长整型的辅助函数\n\
    \ *\n * 参数 - offset - 要存储数据的 EEPROM 偏移量\n *        - value - 要存储的值\n *\n * 返回\
    \ - 无\n */\n\nvoid WriteLong(int offset, long value)\n{\n  int upperValue = (value\
    \ >> 16);\n  int lowerValue = value & 0xFFFF;\n\n  WriteInteger(offset, upperValue);\n\
    \  WriteInteger(offset + 2, lowerValue);\n}\n\n/*\n * ReadBytes - 从非易失性存储中读取指定数量字节的辅助函数\n\
    \ *\n * 参数 - offset - 存储数据的 EEPROM 偏移量\n *        - data - 用于存储读取到的数据的数组\n * \
    \       - maxLength - 读取的最长长度\n *\n * 返回 - 无\n */\n\nvoid ReadBytes(int offset,\
    \ byte *data, int maxLength)\n{\n  if (data != NULL)\n  {\n    for (int index\
    \ = 0; index < maxLength; index++)\n    {\n      data[index] = EEPROM.read(offset\
    \ + index);\n    }\n  }\n}\n\n/*\n * WriteBytes - 向非易失性存储中写入指定数量字节的辅助函数\n *\n\
    \ * 参数 - offset - 要存储数据的 EEPROM 偏移量\n *        - data - 要存储的字节数组\n *        -\
    \ length - 要写入的数据长度\n * 返回 - 无\n */\n\nvoid WriteBytes(int offset, byte *data,\
    \ int length)\n{\n  if (data != NULL)\n  {\n    for (int index = 0; index < length;\
    \ index++)\n    {\n      EEPROM.write(offset + index, data[index]);\n    }\n \
    \ }\n}\n\n/*\n * 此示例中使用的变量\n */\n\nvolatile EE_Structure StoredData;\nStateMachine\
    \ connectionState;\n\n/*\n * Setup - 蓝牙模块的主设置\n */\n\nvoid setup()\n{\n  Serial.begin(9600);\n\
    \n  Serial.println(\"Starting setup...\");\n\n  BTModule::begin(BT_SPEED, true);\
    \ // 不阻塞\n\n  digitalWrite(BT_CONNECTED_STATUS_PIN, LOW); // 未连接时关闭\n\n  connectionState\
    \ = Initialize;\n}\n\n/*\n * Loop - 运行状态机并按状态逐级演进的主循环\n */\n\nvoid loop()\n{\n\
    \  char *pRemoteAddress = NULL;\n\n  switch (connectionState)\n  {\n    case Initialize:\n\
    \    {\n      Serial.println(\"Initializing device...\");\n      digitalWrite(BT_CONNECTED_STATUS_PIN,\
    \ LOW); // 未连接\n\n      connectionState = RestoreDeviceAddress;\n    }\n    break;\n\
    \n    case RestoreDeviceAddress:\n    {\n      if (StoredData.valid != 0)\n  \
    \    {\n        pRemoteAddress = (char *)StoredData.bt_address;\n        connectionState\
    \ = DeviceDiscovered;\n      }\n      else\n      {\n        pRemoteAddress =\
    \ NULL;\n        connectionState = DiscoveringDevice;\n      }\n    }\n    break;\n\
    \n    case DiscoveringDevice:\n    {\n      Serial.println(\"Discovering devices...\"\
    );\n\n      // 发现设备，不阻塞，我们将返回再次尝试\n      if (BTModule::discoverDevice(false) ==\
    \ true)\n      {\n        connectionState = DeviceDiscovered;\n      }\n    }\n\
    \    break;\n\n    case DeviceDiscovered:\n    {\n      Serial.println(\"Connecting\
    \ to device...\");\n      if (BTModule::connectToDevice(pRemoteAddress, true)\
    \ == true)\n      {\n        connectionState = ActiveCommunications;\n       \
    \ digitalWrite(BT_CONNECTED_STATUS_PIN, HIGH); // 我们建立了连接\n\n        // 更新 EEPROM\
    \ 数据\n        if (StoredData.valid == 0)\n        {\n          WriteInteger((char\
    \ *)&StoredData.valid - (char *)&StoredData.signature, 1); // 现在有效了\n        \
    \  BTModule::getRemoteAddress((char *)&StoredData.bt_address);\n          WriteBytes((char\
    \ *)&StoredData.bt_address - (char *)&StoredData.signature, (byte *)&StoredData.bt_address,\
    \ MAX_BT_ADDRESS);\n        }\n      }\n    }\n    break;\n\n    case ActiveCommunications:\n\
    \    {\n      char dataValue = 0;\n\n      if (Serial.available())\n      {\n\
    \        BTModule::sendByte(Serial.read());\n      }\n\n      if (BTModule::readByte(&dataValue)\
    \ == true)\n      {\n        Serial.print(dataValue);\n      }\n    }\n    break;\n\
    \n    case ErrorState:\n    {\n      // 重置并恢复\n      connectionState = DeviceDiscovered;\n\
    \    }\n    break;\n  }\n}\n```\n\n"
- fmt: "\nA lot of this code, such as the [EEPROM](#part0006_split_001.html_eeprom)\
    \ library, has already been covered in previous chapters. There are two key items\
    \ to look at here. The first is the inclusion of a library that I wrote to work\
    \ with the Bluetooth® module by Seeed Studio which can be found on [GitHub](https://github.com/milligan2296/Arduion-BT-Module).\
    \ This library is available for free on github for others's to use and to improve\
    \ upon. The second key item is the State Machine which I created to track the\
    \ state of my Bluetooth® connection. This allows the software developer to create\
    \ a list of instructions i.e. states to follow as the system is processing in\
    \ order to accomplish a complete task. Basically each step of the state machine\
    \ is a task which cannot be done in most cases until the previous task is done.\
    \ The beauty of the state machine is the ability to jump from one state to another\
    \ in order to redo something or handle error cases and the like. It also fits\
    \ in nicely with the Arduino® `loop()` function. Given the `loop` is called continuously,\
    \ it is quite easy to create a state machine that can progress from one state\
    \ to the next as the loop is run. In general, the serial communications library\
    \ has been covered with the `Serial` functions which stay the same for the software\
    \ serial port that we are using with this sketch. In particular we will be setting\
    \ the starting baud rate with the `begin()` function and then sending data using\
    \ the `print()` function. Likewise, we will be receiving data using the `read()`\
    \ function.\n\n```\n g_pBTModule = BTModule::GetInstance(BT_RX_PIN, BT_TX_PIN);\
    \ \n```\n\nThe above line of code initializes my Bluetooth® module and returns\
    \ a pointer that I can use in my code. While this isn't rocket science, I did\
    \ want to explain a little in more detail the pointer concept and usage. So far\
    \ we have covered a number of variables such as integers (`int`), characters (`char`),\
    \ and others. A pointer is a little different. It is not so much a data type in\
    \ itself but more a link to a data type. Imagine a row of mail boxes for a group\
    \ of houses each with a name on it. The actual mailbox isn't as important as the\
    \ name beside it since your mail will be placed in the box where your name is.\
    \ The pointer is similar in that it points to a specific mailbox i.e. memory location\
    \ that holds the data you are interested in. The beauty of the mailboxes is that\
    \ if another person builds a house between you and your neighbor, you can simply\
    \ move the names on the mailboxes around so that the new person's mailbox is in\
    \ the right spot. It may have been the one you used previously however now your\
    \ name has been moved over one and points to a new mailbox. This is the same idea\
    \ behind a pointer in programming. This variable points to a specific spot in\
    \ memory however you can have multiple spots in memory containing the same type\
    \ of data. The pointer can point to any of them as needed. To continue the example,\
    \ imagine each mailbox is actually a Bluetooth® module as defined above. I could\
    \ have the one pointer variable which could be assigned to any of the Bluetooth®\
    \ modules and be able to access all of its functionality. This is done by simply\
    \ changing which module the pointer points to. For example I could do the following\
    \ (not working code):\n\n```\n BTModule g_BTModule1(3, 4); // Our interface to\
    \ the Bluetooth module 1\nBTModule g_BTModule2(5, 6); // Our interface to the\
    \ Bluetooth module 2\nBTModule g_BTModule3(7, 8); // Our interface to the Bluetooth\
    \ module 3\nBTModule g_BTModule4(9, 10); // Our interface to the Bluetooth module\
    \ 4\n  ...\n\nbyte nextChar = Serial.read();\n\ng_BTModule1.sendByte(nextChar);\n\
    g_BTModule2.sendByte(nextChar);\ng_BTModule3.sendByte(nextChar);\ng_BTModule4.sendByte(nextChar);\
    \ \n```\n\nThis works but is a little tedious in that for every specific instance\
    \ you have to access it directly and if you add or remove an instance then you\
    \ have to go down through the code to determine everywhere it has been used and\
    \ remove it. There is a better way and that way is with a pointer. Again this\
    \ is just a code snippet and not a complete sketch.\n\n```\n#define BT_MODULE_COUNT\
    \ 4\n\n// receive and transmit pin assignments\nint g_btModulePins[BT_MODULE_COUNT][2]\
    \ =\n{\n  {3, 4},\n  {5, 6},\n  {7, 8},\n  {9, 10}\n};\n\n// Array of pointers\
    \ to my modules\nBTModule *g_pBTModules[BT_MODULE_COUNT] = {0};\n\nvoid setup()\n\
    {\n\tfor (int index = 0; index < BT_MODULE_COUNT; index++)\n\t{\n\t\tg_pBTModules[index]\
    \ = BTModule::GetInstance(g_btModulePins[index][0], g_btModulePins[index][1]);\n\
    \t}\n\n\t// Verify that each instance is valid i.e. not NULL.\n}\n\nvoid loop()\n\
    {\n  ...\n\n  byte nextChar = Serial.read();\n\n  // Blast the value out to every\
    \ instance\n  for (int index = 0; index < BT_MODULE_COUNT; index++)\n  {\n\tg_pBTModules[index]->sendByte(nextChar);\n\
    \  }\n\n  ...\n\n} \n```\n\nGranted I could still define my number of modules\
    \ and create the module pin array and utilize it in the first example however\
    \ the main thing here is that in the first example I had four instances of the\
    \ Bluetooth module which is rigid in that to add or remove an instance, I have\
    \ to go back through my sketch and locate all of the places it is used and make\
    \ the changes which takes time and is error prone. In the above example I have\
    \ to make two changes. The first change is to update the definition of `BT_MODULE_COUNT`\
    \ to another positive value i.e. something greater than zero (`0`). The second\
    \ change is to add or remove pin assignments to match the `BT_MODULE_COUNT`. The\
    \ compiler will warn you if the number of pin declarations doesn't match because\
    \ I use `BT_MODULE_COUNT` as part of my pin array. Once everything is defined,\
    \ I can process each instance of the Bluetooth® module to configure it in the\
    \ loop. In the main loop function when I read in a value, instead of having to\
    \ send it to each individual instance, I can simply walk my array of pointers\
    \ and send to each instance. This reduces the amount of code that is needed and\
    \ also makes it quite expandable as only a few changes are required in order to\
    \ increase or decrease the number of modules to use.\n\nThe following is my state\
    \ machine values which the sketch will progress through in order to initialize\
    \ and utilize the Bluetooth® module. By default I always start at the `Initialize`\
    \ state unless the `BT_CONNECTED_PIN` indicates the module is already connected.\
    \ If that is the case then I can jump right to the `ActiveCommunications` state.\n\
    \n```\n enum StateMachine\n{\n  Initialize = 0, // if we store the device addr,\
    \ we can jump to connecting\n  RestoreDeviceAddress,\n  DiscoveringDevice,\n \
    \ DeviceDiscovered, // once discovered, we can reconnect without all of the setup\n\
    \  ConnectingToDevice,\n  ActiveCommunications,\n  ErrorState,\n  EndStates\n\
    }; \n```\n\nEach of the above states should be fairly self explanatory. You might\
    \ notice there is one state which I do not use which is the `EndStates`. This\
    \ is really just a habit of mine in that for every enumeration I add a final state\
    \ indicating the end of the defined states. The main reason for this is so I can\
    \ do something like the following:\n\n```\n for (int state = Initialize; state\
    \ < EndStates; state++)\n{\n  ...\n\n  // do something fabulous\n\n  ...\n} \n\
    ```\n"
