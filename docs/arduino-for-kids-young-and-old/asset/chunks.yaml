  trans: "\n\n* 10K 数字电位器 [18]\n\n## 工具\n\n* `面包板`\n* `跳线线`\n* `电压表`\n\n## 原图\n\n\
    ![SPI 数字电位器](img/00029.jpeg)\n\n![Creative Commons - 归源 - 相同共享](img/00005.jpeg)\
    \ 使用 [Fritzing](http://fritzing.org/) 创建图片\n\n## 软件\n\n在这个示例程序中，我们将利用 `SPI` 总线与数字电位器通信，以控制\
    \ LED 的亮度。我们将使用一个晶体管来控制通过 LED 的电流，并连接数字电位器，使其根据编程的电压电平控制晶体管的饱和度。这种控制方法比使用 `PWM`\
    \ 稍微复杂，但你能够通过同一个通信总线控制多个不同的设备。\n\n```cpp\n /*\n * SpiDigitalPot - 这个示例程序的目的是通过配置数字电位器来设置亮度\n\
    \ *                 从而控制 LED 的亮度。\n *\n * potCS 引脚是我用作电位器芯片选择的引脚。\n *\n * spi\n\
    \ *    - spClk - 配置为 SPI 时钟的引脚\n *    - spiMosi - 主设备（Arduino）向从设备传输数据的引脚\n *\
    \    - spiMiso - 从设备向主设备（Arduino）发送数据的引脚\n *    - spiCS - Arduino 中用于 SPI 电路选择的芯片选择引脚\n\
    \ *            - 考虑到我目前只使用了一个 SPI 设备，我也可以将 spiCS \n *              芯片选择引脚用于我的电位器（POT）。各种扩展板\n\
    \ *              将使用特定的引脚作为芯片选择，这些引脚很可能不是 10 号引脚\n *\n * 使用来自 Microchip 的 MCP4261\
    \ 数字电位器进行测试\n */\n\n// 包含 SPI 库：\n\n#include <SPI.h>\n/* 常量定义 */\n\nconst int\
    \ potCS = 6;\nconst int spiClk = 13;\nconst int spiMosi = 11;\nconst int spiMiso\
    \ = 12;\nconst int spiCS = 10;\n\n/* 此示例程序的变量 */\n\nbyte g_potValue = 0;\n\n/*\n\
    \ * 用于向数字电位器发送 *\n * 命令的数据结构\n */\n\n /* 命令字节是发送到电位器的主地址/数据位 */\n\ntypedef struct\
    \ _CommandByte\n{\n  byte Address:4;  /* 要选择的地址 */\n  byte Command:2;  /* 要发送的实际命令\
    \ */\n  byte DataBits:2; /* 高位数据位 */\n} CommandByte;\n\n/* 带有发送数据的组合命令字节 */\n\n\
    typedef struct _CommandData\n{\n  union\n  {\n  /* 上述定义的命令字节 */\n    CommandByte\
    \ cmd;\n\n     /* 为了方便访问的标准字节格式的 cmd 字节 */\n    byte cmdByte;\n  } command;\n\n\
    \  /* 根据需要随命令一起发送的数据 */\n  byte        data;\n} CommandData;\n\n/*\n * 方法声明\n\
    \ */\n\nvoid UpdatePot(int selectPin, struct _CommandData *pData);\nint ReadPot(int\
    \ selectPin, struct _CommandData *pData);\n\n/*\n * UpdatePot - 向电位器发送命令和数据\n\
    \ *             由指定的芯片选择信号激活\n *\n * 参数\n *  selectPin - 用作选择引脚的引脚\n *  pData\
    \     - 指向的命令数据结构的指针\n *\n * 返回\n *  无\n */\n\nvoid UpdatePot(int selectPin, struct\
    \ _CommandData *pData)\n{  \n  digitalWrite(selectPin, LOW);\n\n  delay(100);\
    \ // 要求的延迟\n\n  SPI.transfer(pData->command.cmdByte);\n  SPI.transfer(pData->data);\n\
    \n  digitalWrite(selectPin, HIGH);\n}\n\n/*\n * ReadPot   - 向电位器发送命令和数据\n *  \
    \           由指定的芯片选择信号激活\n *\n * 参数\n *  selectPin - 用作选择引脚的引脚\n *  pData    \
    \ - 指向发送命令数据结构的指针\n *\n * 返回\n *  int       - 从电位器读取回的值\n */\n\nint ReadPot(int\
    \ selectPin, struct _CommandData *pData)\n{\n  int dataRead = 0;\n\n  digitalWrite(selectPin,\
    \ LOW);\n  delay(100);\n\n  dataRead = SPI.transfer(pData->command.cmdByte) <<\
    \ 8;\n  dataRead |= SPI.transfer(pData->data);\n  digitalWrite(selectPin, HIGH);\n\
    \n  dataRead &= 0x1FF;\n\n  return dataRead;\n}\n\n/*\n * 用于代码可读性的枚举\n */\n\n\
    /*\n *  此枚举定义了在电位器上可以\n *  访问的每一个地址\n */\n\ntypedef enum\n{\n  Wiper0 = 0,\n \
    \ Wiper1,\n  NVWiper0,\n  NVWiper1,\n  TConReg,\n  StatusReg,\n  Data0,\n  Data1,\n\
    \  Data2,\n  Data3,\n  Data4,\n  Data5,\n  Data6,\n  Data7,\n  Data8,\n  Data9,\n\
    } Addresses;\n\n/*\n *  此枚举定义了可以发送到电位器的\n *  每一个命令\n */\n\ntypedef enum\n{\n \
    \ WriteData = 0,\n  Increment,\n  Decrement,\n  Read\n} Commands;\n\n/*\n * Setup\
    \ - 将被调用的方法\n *        Arduino 执行设置\n *\n * 参数 - 无\n *\n * 返回 - 无\n */\n\nvoid\
    \ setup()\n{\n  Serial.begin(9600);\n\n  pinMode(spiCS, OUTPUT);\n  pinMode(potCS,\
    \ OUTPUT);\n\n  digitalWrite(spiCS, HIGH);\n\n  /* 配置 SPI */\n  SPI.begin();\n\
    \n  SPI.setBitOrder(MSBFIRST);\n  SPI.setDataMode(SPI_MODE0);\n  SPI.setClockDivider(SPI_CLOCK16);\n\
    }\n\n/*\n * loop - 将被调用的方法\n *        Arduino 执行主循环，设置\n *        电位器的值将根据写入的数值\n\
    \ *        改变 LED 的强度。写入电位器的\n *        值越大，晶体管饱和度越低，LED 越暗。\n *\n * 参数 - 无\n\
    \ *\n * 返回 - 无\n */\n\nvoid loop()\n{\n  CommandData command;\n\n  command.command.Command\
    \ = WriteData;\n  command.command.Address = Wiper0;\n  command.command.DataBits\
    \ = 0; // 清空高位\n  command.data = g_potValue;\n\n  // 向电位器发送命令更新值\n  UpdatePot(potCS,\
    \ &command);\n\n  // 输出发送到电位器的当前值\n  Serial.println(g_potValue);\n\n  // 延迟 250\
    \ 毫秒以便我们看到变化\n  delay(250);    \n\n  // 让数值增加\n  g_potValue += 25;\n  if (g_potValue\
    \ > 255) {\n    g_potValue = 0;\n  }\n}\n\n/*\n * 读取数值的示例\n */\n\n// 配置电位器以启用每个输出\n\
    UpdatePot(potCS, &command);\n\n// 读取 TCON 寄存器\nint tconValue = ReadPot(potCS,\
    \ &command);\n\nSerial.print(\"TCON: \");\nSerial.println(tconValue);\nSerial.println(\"\
    设置完成\");\n```\n"
- fmt: "\n# Data Structures and Enumerations\n\nThe first structure defines one byte\
    \ which will consist of the address we are interested in accessing on the device,\
    \ the command we are sending, and the upper two data bits of which the highest\
    \ one is not used. Although I have defined what looks like three (3) bytes of\
    \ data in this structure, `CommandByte`, I have actually only defined one (1)\
    \ byte which is made up of the three defined fields.\n\nYou will notice that the\
    \ total bits defined is equal to the same size as a byte i.e. eight (8) bits.\
    \ I could have written a macro of the like to set the value for the address and\
    \ the command however it isn't very clear to someone coming along after what is\
    \ happening. By using the power of the language and the compiler, I can write\
    \ code that is clear and easy to work with.\n\nThe second structure is basically\
    \ two bytes, the first byte is the command byte which contains the address and\
    \ the command. The second byte is the data byte to send to the device. I am also\
    \ using a `union` to allow easy access to the `CommandByte` which also allows\
    \ me to simply pass the `cmdByte` value to the SPI transfer routine. A `union`\
    \ is programming construct that allows you to declare multiple ways of accessing\
    \ the same data. In this case the command byte, `CommandByte`, can be accessed\
    \ via the individual bit fields i.e. `Address`, `Command`, and `DataBits` or it\
    \ can be accessed all at once via the `cmdByte` field. The `union` allows you,\
    \ the developer, to access the value as needed.\n\nThe enumerations are provided\
    \ for code clarity and being able to easily specify what command I want to issue\
    \ and what address I want to issue it to. I could use simple integer values however\
    \ the benefits of the enumerations are much easier to read and in some high level\
    \ programming languages provide additional benefits such as compile time type\
    \ validation.\n\n# SPI Configuration\n\nThe next thing to look at is the configuration\
    \ of the SPI bus.\n\n```cpp\n pinMode(spiCS, OUTPUT);\n  pinMode(potCS, OUTPUT);\n\
    \n  digitalWrite(potCS, HIGH);\n\n  /* Configure SPI */\n  SPI.begin();\n\n  SPI.setBitOrder(MSBFIRST);\n\
    \  SPI.setDataMode(SPI_MODE0);\n  SPI.setClockDivider(SPI_CLOCK_DIV128); \n```\n\
    \nIn the above code, the first thing we do is configure the SPI chip select line\
    \ as an output. Regardless of whether you will be using `spiCS` pin itself or\
    \ another pin, this pin must be configured as an `OUTPUT` pin otherwise the SPI\
    \ bus will not work. I am also setting the potentiometer chip select to `HIGH`\
    \ to ensure that nothing spurious on the SPI bus is transferred to the digital\
    \ potentiometer.\n\nOnce the selection pins are configured, I start the SPI communications\
    \ and then configure it for use with my device. In this case, my device, the `MCP4621`,\
    \ utilizes the most significant bit (MSB) data format. I have also configured\
    \ the SPI bus to use data mode zero (0) which was defined in the table above.\
    \ I then specify the clock divider to lower the speed of the SPI bus. In this\
    \ case I am dividing my base system clock by 128 resulting in a 125KHz clock speed.\
    \ I could push the device much faster, up to 10MHz however for what I am doing,\
    \ speed isn't a great concern.\n\n# Data Transfer\n\nFinally, once I have configured\
    \ the SPI bus, I can read and write data to it. The following code demonstrates\
    \ transferring data via the SPI bus.\n\n```cpp\n void UpdatePot(int selectPin,\
    \ struct _CommandData *pData)\n{  \n  digitalWrite(selectPin, LOW);\n\n  delay(100);\
    \ // required delay\n\n  SPI.transfer(pData->command.cmdByte);\n  SPI.transfer(pData->data);\n\
    \n  digitalWrite(selectPin, HIGH);\n} \n```\n\nThe first thing we must do is select\
    \ the proper device that will be receiving the data that we are going to write\
    \ out on the SPI bus. I have added a delay after the `selectPin` has been driven\
    \ to a low state i.e. selected. This delay, while not overly necessary, just ensures\
    \ that the device to receive the data has time to prepare to receive it. Typically\
    \ there will be a delay needed that is in the 10's of nanoseconds however the\
    \ delay I am using is more than sufficient and for what we are doing here, not\
    \ noticeable.\n\nIf you were writing data to a strip of LED's which had to change\
    \ color very rapidly, I would reduce this delay and would also raise the clock\
    \ speed to as high as the LED strip could handle. Each application requires different\
    \ configuration settings. Once I have the select pin in the proper state, I then\
    \ transfer the command byte and the data to the digital potentiometer. Once the\
    \ data has been transferred, I then place the select pin back to the `HIGH` state\
    \ disabling the SPI interface of the recipient device. One thing to note, that\
    \ each transfer of data on the SPI bus may result in data being read back in as\
    \ part of the transfer. It will be up to the programmer to determine if this is\
    \ the case or not based on what is being sent to the recipient device.\n\nThe\
    \ digital potentiometer is a decent device to control the intensity of an LED\
    \ among other things. In this particular case, the `MCP4621` can also be used\
    \ to store a small amount of data that could be associated with the device itself\
    \ in order to persist values that could be used regardless of which micro-controller\
    \ the component was connected to. In addition to it being a decent device, the\
    \ fact that it can be accessed with the SPI bus makes it easy to interface with.\n"
