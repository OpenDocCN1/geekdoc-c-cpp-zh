    \ that you should be aware of.\n\nPrototype\n\nAn experimental design (software/hardware)\
    \ used to prove a theory or realize an idea\n\nArduino®\n\nAn open source hardware/software\
    \ solution used for prototyping\n\nShield\n\nAn add on card i.e. expander board\
    \ to be used in conjunction with an Arduino®. This may also be called a daughter\
    \ board.\n\nDC\n\nDirect Current which is what most prototyping boards utilize\n\
    \nAC\n\nAlternating Current which is the standard current coming into a house\
    \ and delivered to each outlet within the house *\n\nJava™\n\nA high level programming\
    \ language and environment originally designed by Sun® Computer and now owned\
    \ by Oracle®\n\nC\n\nA high level programming language designed at Bell Labs[[1](#part0012_split_001.html_Ref1)]\n\
    \nSketch\n\nAn Arduino® term for describing the code to be executed on the Arduino®\n\
    \nUSB\n\nUniversal Serial Bus - standard connection for peripherals such as mice,\
    \ keyboards, card readers, etc.\n\nLED\n\nLight Emitting Diode\n\nCompiler\n\n\
    A software application which generates executable code from a source file such\
    \ as a sketch.\n\nVariable\n\nA data type found in a sketch which can be assigned\
    \ a value. Variables can be of different types to represent different data types\
    \ such as integers, characters, and floating point numbers\n\nSigned value\n\n\
    A value that can represent both positive and negative numbers\n\nUnsigned value\n\
    \nA value that can only represent positive numbers\n\nParameter\n\nA value passed\
    \ into a method during program execution\n\nReturn Value\n\nA value returned by\
