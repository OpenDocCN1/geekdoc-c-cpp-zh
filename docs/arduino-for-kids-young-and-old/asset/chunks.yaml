    # The Arduino® Platform


    ## What it is


    Arduino® 软件包是一种性价比、易用的原型板，可以通过扩展来完成许多任务。该板使用的微控制器具有许多通用输入输出 (`GPIO`) 引脚。这些 `GPIO`
    引脚具有许多功能，你可以利用它们创建许多设计。虽然控制器和整体设计在今天看来相当，但围绕平台开发的社区才是它真正闪光的地方。通过简单的网络搜索，你可以找到许多论坛和商店推广并销售各种增强
    Arduino® 的产品，从以太网扩展板到 LCD 扩展板以及之间的其他产品。考虑到所有扩展选项都是很容易获得的，Arduino® 变成了一个非常有用的微控制器。在书中，我将关注
    Arduino 板板之一——Arduino® UNO。它包含了我们需要的所有功能，并基于 5 特系统，可以与各种外部设备配合。这将讨论限制在一种更流行的 Atmel®
    AVR 微控制器上——`ATmega328`。4]


    ## What it isn''t


    '
- fmt: "\nThis is not a full fledged computer with monitor, keyboard, and mouse as\
    \ you have probably already noticed. While it is fast doing simple tasks, it will\
    \ not break any super computer processing speeds. With today's processors running\
    \ at 100x or 200x the speed of this little controller, it isn't surprising that\
    \ it isn't as fast as a full fledged computer. The overall Arduino® environment\
    \ is based on approachable and easy to use tools. The environment does it's best\
    \ to prevent mishaps when using it and the target devices. With this extra security\
    \ comes limitations and potential speed losses. There is also potential for conflicting\
    \ devices due to the overloading of processor pins to internal functions. However\
    \ for the kinds of projects that we will want to do, it is more than capable.\n\
    \n## Getting Started\n\nSo where do we start? Assuming you have already purchased\
    \ an Arduino® and have the development environment installed, our first order\
    \ of business is to make sure everything is working ok. If you haven't already\
    \ downloaded and configured your system, take a look at the chapter entitled [Setup](#part0002_split_000.html_Setup)\
    \ for information regarding setting up your development environment. When ready,\
    \ open up the development platform and you should see something like this:\n\n\
    ![Ardunio main view](images/00013.jpeg)\n\nNow we need to make sure your Arduino®\
    \ is properly registered with your development environment. If you have not connected\
    \ your Arduino® to your development system than you may need to load the drivers\
    \ in order for the board to communicate with your system. On the Windows™ platform,\
    \ you can find the necessary drivers in the drivers folder under the Arduino®\
    \ software folder. If you are running on the Macintosh® or Linux® then you will\
    \ want to visit the USB chip manufacturer web page to download the drivers for\
    \ your particular system. They can be found [here](http://www.ftdichip.com/Drivers/VCP.htm).\
    \ You will also find the latest Windows® drivers there.\n\nThe first thing to\
    \ notice in the previous image is the currently selected board and communication\
    \ port i.e. `COM` port. This is shown in the lower right hand side of the image.\
    \ This development board is an Arduino `UNO` connected to `COM3`. In order to\
    \ work with your Arduino® you will need to ensure the correct `COM` port is selected\
    \ along with the correct hardware board. To do this, select the tools menu item\
    \ on the menu bar.\n\nNote: the menu can take some time to actually pop up depending\
    \ upon the user's environment.\n\nFrom the tools menu, select board and then select\
    \ the type of board that you have. The following image shows the board selection\
    \ where I have selected the Arduino `UNO` as my board.\n\n![Selection of the board\
    \ from drop down tool menu](images/00016.jpeg)\n\nOnce the proper board has been\
    \ selected, the corresponding `COM` port that the operating system has assigned\
    \ to the development board can be selected. The following image shows the selection\
    \ of the `COM` port for the attached Arduino® board.\n\n![Selection of the comm\
    \ port from drop down tool menu](images/00017.jpeg)\n\nBefore we go any further,\
    \ it will be good to look at some of the different variable types that you may\
    \ find within an Arduino sketch. The following are some of the more common variable\
    \ types you may come across:\n\n- `char`: a signed value representing the values\
    \ from -128 to 127. `Char`s are stored using 8 bits of data.\n- `unsigned char`:\
    \ an unsigned value representing the values from 0 to 255. Like a `char`, an `unsigned\
    \ char` is stored using 8 bits of data.\n- `byte`: Analogous to an `unsigned char`\
    \ and used within Arduino sketches.\n- `int`: a signed integer type representing\
    \ the values from -32,768 to 32,767. `Int`s are stored using 16 bits of data*.\n\
    - `unsigned int`: an unsigned integer type representing the values from 0 to 65,535.\
    \ `Int`s are stored using 16 bits of data*.\n- `long`: a signed value representing\
    \ the values from -2,147,483,648 to 2,147,483,647. `Long`s are stored using 32\
    \ bits of data.*\n- `unsigned long`: an unsigned value representing the values\
    \ from 0 to 4,294,967,295. `Unsigned long`s are stored using 32 bits of data*.\n\
    - `float`: a float value represents a wide range of signed values in decimal notation\
    \ and is primarily used to represent fractions and other non integer values. `Float`s\
    \ are stored as 32 bits of data.**\n- `double`: For the Arduino platform, the\
    \ `double` is analogous to a `float`.\n- `void`: the `void` type typically indicates\
    \ a non-value however is dependent on its usage. For method definitions, a return\
    \ value of `void` indicates that no value will be returned by the method.\n\n\
    * the size of an `int` or `long` may be different based on the processor in use.\
    \ For the Atmel® micro-controller we are using an integer will be 16 bits i.e.\
    \ 2 bytes while the `long` will be 32 bits i.e. 4 bytes. Other micro-controllers\
    \ may have larger integer sizes. You should verify the sizes of the data types\
    \ of your target hardware to ensure you do not make any false assumptions.\n\n\
    ** floats are stored as 32 bits of data which represents the mantissa and the\
    \ exponent. Floats have about 7 decimal digits of precision which should be considered\
    \ when processing data.\n\nEvery Arduino sketch will consist of two functions\
    \ i.e., methods, `setup` and `loop`. As you can probably imagine, `setup` is where\
    \ you will configure your Arduino for operation such as specifying the direction\
    \ of data flow on a certain pin etc. The `loop` function is where all the processing\
    \ is done and will be executed as fast as the micro-controller can. Let's take\
    \ a look at each of these methods in some detail and see how they work.\n\n###\
    \ Setup\n\nAs mentioned above, this is where the configuration of the micro-controller\
    \ is performed. This isn't to say that the micro-controller configuration cannot\
    \ be changed outside of this method however for consistency it is best to do any\
    \ configuration here. So what kind of things should be configured when you start\
    \ executing code on your Arduino? Primarily it will be proper to configure your\
    \ digital pins as either input or output and start any subsystems that may need\
    \ to be started such as the serial port. The main reason is that this method is\
    \ only called once the `loop` is called every pass. Consider the following code\
    \ snippet from this [sketch](http://book.afmsoftware.com/resources/SkeletonSketch.zip):\n\
    \n```cpp\n /*\n  * Setup - main configuration point of our sketch to configure\n\
    \  *         the Arduino for operation\n  *\n  * Params - none\n  *\n  * Returns\
    \ - nothing\n  */\n\n void setup()\n {\n   Serial.begin(9600);\n\n   pinMode(13,\
    \ OUTPUT);\n }\n```\n\nThe first portion are the comments describing what the\
    \ intention of the method is. I say intention as with all things, they start as\
    \ good intentions and then veer off from there. For Arduino sketches, there are\
    \ two acceptable types of comments, the block as shown above and the single line\
    \ [[5](#part0012_split_001.html_Ref5)]. The block comment is everything between\
    \ the opening token `/*` and the closing token `*/` which indicates to the Arduino\
    \ compiler that what lies between the tokens including the tokens themselves can\
    \ be ignored. While the above example shows a block comment spanning multiple\
    \ lines, there is nothing preventing it from being a set of single line comments\
    \ such as:\n\n```cpp\n // Setup - main configuration point of our sketch to configure\
    \ the Arduino for operation \n // \n // Params - none\n // \n // Returns - nothing\n\
    \ // \n```\n\nI would be reluctant to put the whole thing on one line as I prefer\
    \ to have some whitespace i.e. blank area around the comments for readability.\
    \ You could do something like the following:\n\n```cpp\n // Setup - main configuration\
    \ point of our sketch to configure the Arduino for operation \n```\n"
  raw: "This is not a full fledged computer with monitor, keyboard, and mouse as you\
    \ have probably already noticed. While it is fast doing simple tasks, it will\
    \ not break any super computer processing speeds. With today's processors running\
    \ at 100x or 200x the speed of this little controller, it isn't surprising that\
    \ it isn't as fast as a full fledged computer. The overall Arduino® environment\
    \ is based on approachable and easy to use tools. The environment does it's best\
    \ to prevent mishaps when using it and the target devices. With this extra security\
    \ comes limitations and potential speed losses. There is also potential for conflicting\
    \ devices due to the overloading of processor pins to internal functions. However\
    \ for the kinds of projects that we will want to do, it is more than capable.\n\
    \n### Getting Started\n\nSo where do we start? Assuming you have already purchased\
    \ an Arduino® and have the development environment installed, our first order\
    \ of business is to make sure everything is working ok. If you haven't already\
    \ downloaded and configured your system, take a look at the chapter entitled [Setup](#part0002_split_000.html_Setup)\
    \ for information regarding setting up your development environment. When ready,\
    \ open up the development platform and you should see something like this:\n\n\
    ![Ardunio main view](images/00013.jpeg)\n\nNow we need to make sure your Arduino®\
    \ is properly registered with your development environment. If you have not connected\
    \ your Arduino® to your development system than you may need to load the drivers\
    \ in order for the board to communicate with your system. On the Windows™ platform,\
    \ you can find the necessary drivers in the drivers folder under the Arduino®\
    \ software folder. If you are running on the Macintosh® or Linux® then you will\
    \ want to visit the USB chip manufacturer web page to download the drivers for\
    \ your particular system. They can be found [here](http://www.ftdichip.com/Drivers/VCP.htm).\
    \ You will also find the latest Windows® drivers there.\n\nThe first thing to\
    \ notice in the previous image is the currently selected board and communication\
    \ port i.e. COM port. This is shown in the lower right hand side of the image.\
    \ This development board is an Arduino® UNO connected to COM3\\. In order to work\
    \ with your Arduino® you will need to ensure the correct COM port is selected\
    \ along with the correct hardware board. To do this, select the tools menu item\
    \ on the menu bar.\n\nNote: the menu can take some time to actually pop up depending\
    \ upon the user's environment.\n\nFrom the tools menu, select board and then select\
    \ the type of board that you have. The following image shows the board selection\
    \ where I have selected the Arduino® UNO as my board.\n\n![Selection of the board\
    \ from drop down tool menu](images/00016.jpeg)\n\nOnce the proper board has been\
    \ selected, the corresponding COM port that the operating system has assigned\
    \ to the development board can be selected. The following image shows the selection\
    \ of the COM port for the attached Arduino® board.\n\n![Selection of the comm\
    \ port from drop down tool menu](images/00017.jpeg)\n\nBefore we go any further,\
    \ it will be good to look at some of the different variable types that you may\
    \ find within an Arduino® sketch. The following are some of the more common variable\
    \ types you may come across:\n\nchar\n\na signed value representing the values\
    \ from -128 to 127\\. Char's are stored using 8 bits of data\n\nunsigned char\n\
    \nan unsigned value representing the values from 0 to 255\\. Like a char, an unsigned\
    \ char is stored using 8 bits of data\n\nbyte\n\nAnalogous to an unsigned char\
    \ and used within Arduino® sketches\n\nint\n\na signed integer type representing\
    \ the values from -32,768 to 32,767. Int's are stored using 16 bits of data*\n\
    \nunsigned int\n\nan unsigned integer type representing the values from 0 to 65,535\\\
    . Int's are stored using 16 bits of data*\n\nlong\n\na signed value representing\
    \ the values from -2,147,483,648 to 2,147,483,647\\. Long's are stored using 32\
    \ bits of data.*\n\nunsigned long\n\nan unsigned value representing the values\
    \ from 0 to 4,294,967,295. Unsigned long's are stored using 32 bits of data.*\n\
    \nfloat\n\na float value represents a wide range of signed values in decimal notation\
    \ and is primarily used to represent fractions and other non integer values. Float's\
    \ are stored as 32 bits of data.**\n\ndouble\n\nFor the Arduino® platform, the\
    \ double is analogous to a float.\n\nvoid\n\nthe void type typically indicates\
    \ a non-value however is dependent on its usage. For method definitions, a return\
    \ value of void indicates that no value will be returned by the method.\n\n* the\
    \ size of an int or long may be different based on the processor in use. For the\
    \ Atmel® micro-controller we are using an integer will be 16 bits i.e. 2 bytes\
    \ while the long will be 32 bits i.e. 4 bytes. Other micro-controller's may have\
    \ larger integer sizes. You should verify the sizes of the data types of your\
    \ target hardware to ensure you do not make any false assumptions.\n\n** floats\
    \ are stored as 32 bits of data which represents the mantissa and the exponent.\
    \ Floats have about 7 decimal digits of precision which should be considered when\
    \ processing data.\n\nEvery Arduino® sketch will consist of two functions i.e.\
    \ methods, setup and loop. As you can probably imagine, setup is where you will\
    \ configure your Arduino® for operation such as specifying the direction of data\
    \ flow on a certain pin etc. The loop function is where all of the processing\
    \ is done and will be executed basically as fast as the micro-controller can go.\
    \ Let's take a look at each of these methods in some detail and see how they work.\n\
    \n### Setup\n\nAs mentioned above, this is where the configuration of the micro-controller\
    \ is performed. This isn't to say that the micro-controller configuration cannot\
    \ be changed outside of this method however for consistency it is best to do any\
    \ configuration here. There will be exceptions to this rule but for now this will\
    \ be good advice to follow. So what kind of things should be configured when you\
    \ start executing code on your Arduino®? Primarily it will be proper to configure\
    \ your digital pins as either input or output and start any sub-systems that may\
    \ need to be started such as the serial communications port. The main reason is\
    \ that this method is only called once while the loop is called every pass through\
    \ the code. It wouldn't be very productive to keep initializing the serial communications\
    \ and the like every time through the main loop. Consider the following code snippet\
    \ from this [sketch](http://book.afmsoftware.com/resources/SkeletonSketch.zip):\n\
    \n```\n /*\n  * Setup - main configuration point of our sketch to configure\n\
    \  *         the Arduino for operation\n  *\n  * Params - none\n  *\n  * Returns\
    \ - nothing\n  */\n\n void setup()\n {\n   Serial.begin(9600);\n\n   pinMode(13,\
    \ OUTPUT);\n } \n```\n\nThe first portion are the comments describing what the\
    \ intention of the method is. I say intention as with all things, they start as\
    \ good intentions and then veer off from there. For Arduino® sketches, there are\
    \ two acceptable types of comments, the block as shown above and the single line\
    \ [[5](#part0012_split_001.html_Ref5)]. The block comment is everything between\
    \ the opening token /* and the closing token */ which indicates to the Arduino®\
    \ compiler that what lies between the tokens including the tokens themselves can\
    \ be ignored. While the above example shows a block comment spanning multiple\
    \ lines, there is nothing preventing it from being a set of single line comments\
    \ such as:\n\n```\n //\n// Setup - main configuration point of our sketch to configure\n\
    //         the Arduino for operation\n//\n// Params - none\n//\n// Returns - nothing\n\
    // \n```\n\nI would be reluctant to put the whole thing on one line as I prefer\
    \ to have some whitespace i.e. blank area around the comments for readability.\
    \ You could do something like the following:\n\n```\n // Setup - main configuration\
    \ point of our sketch to configure the Arduino for operation \n```"
