    \    {\n      Serial.println(\"Discovering devices...\");\n\n      // discover\
    \ our device, do not block, we will come back to try again\n      if (g_pBTModule->discoverDevice(false)\
    \ == true)\n      {\n        g_connectionState = DeviceDiscovered;\n      }\n\
    \    }\n    break;\n\n    case DeviceDiscovered:\n    {\n      Serial.println(\"\
    Connecting to device...\");\n      if (g_pBTModule->connectToDevice(pRemoteAddress,\
    \ true) == true)\n      {\n        g_connectionState = ActiveCommunications;\n\
    \        digitalWrite(BT_CONNECTED_STATUS_PIN, HIGH); // we have a connection\n\
    \n        // Update eeprom data\n        if (StoredData.valid == 0)\n        {\n\
    \            WriteInteger((char *)&StoredData.valid - (char *)&StoredData.signature,\
    \ 1); // it is now valid\n            g_pBTModule->getRemoteAddress((char *)&StoredData.bt_address[0]);\n\
    \            WriteBytes((char *)&StoredData.bt_address[0] - (char *)&StoredData.signature,\
    \ (byte *)&StoredData.bt_address[0], MAX_BT_ADDRESS);\n        }  \n      }\n\
    \    }\n    break;\n\n    case ActiveCommunications:\n    {\n      char dataValue\
    \ = 0;\n\n      if (Serial.available())\n      {\n        g_pBTModule->sendByte(Serial.read());\n\
    \      }\n\n      if (g_pBTModule->readByte(&dataValue) == true)\n      {\n  \
    \      Serial.print(dataValue);\n      }\n    }\n    break;\n\n    case ErrorState:\n\
    \    {\n      // Reset and come back up\n      g_connectionState = DeviceDiscovered;\n\
    \    }\n    break;\n  }\n} \n```"
