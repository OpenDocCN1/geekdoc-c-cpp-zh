  trans: "\n\n```cpp\n /*\n * 电源指示器 - 此脚本/电路的目的是通过三色 RGB LED 视觉显示\n *            \
    \       系统的健康状况。\n *\n * redPin 将用于控制 LED 的红色部分。\n *     注意：此引脚的作用与其他两个引脚不同，\n\
    \ *           因为我们将此引脚置为高电平（high）来关闭 LED。\n *           为了让代码更整洁，此更改仅在\n *   \
    \        LightLed 例程中进行处理。\n * greenPin 将用于控制 LED 的绿色部分。\n * bluePin 将用于控制 LED\
    \ 的蓝色部分。\n *\n * 对于此电路，不会有额外的输入或输出，因为该电路\n * 意在作为一个项目的基础，而不是一个完整的项目。\n */\n\n\
    /*\n * 用于开启/关闭三色 LED 三个通道的枚举值\n */\n\ntypedef enum\n{\n  RED_ON = 0x1,\n  GREEN_ON\
    \ = 0x2,\n  BLUE_ON = 0x4\n} eLedSettings;\n\n/*\n * 此草图中中使用的常量\n */\n\nconst\
    \ int redPin = 9;\nconst int greenPin = 10;\nconst int bluePin = 11;\n\nconst\
    \ int POWER_OFF = RED_ON;\nconst int POWER_ON = GREEN_ON;\nconst int SETUP = GREEN_ON\
    \ | RED_ON;  // 同时开启红色和绿色得到黄色\nconst int BLANK = 0; // 无 LED 亮起\n\n/*\n * 方法声明\n\
    \ */\n\nvoid LightLed(int colors);\n\n/*\n *  LightLed\n *\n * 此方法检查传入的值，以确定 LED\
    \ 的哪些部分应该开启，\n * 哪些部分不应该开启。仅使用低 3 位来指示颜色，其中红色\n * 为 LSB（最低有效位），蓝色为 MSB（最高有效位）。\n\
    \ *\n * 参数 - colors - 一组位（位掩码），指示哪些 LED 颜色应该开启，\n *                   哪些颜色不应该开启。\n\
    \ *\n * 返回 - 无\n */\n\nvoid LightLed(int colors)\n{\n  /*\n   *  红色的作用方式不同：高电平输出（HIGH）关闭\
    \ LED，\n   *  低电平输出（LOW）开启它。\n   */\n  if (colors & RED_ON)\n  {\n    digitalWrite(redPin,\
    \ LOW);\n  }\n  else\n  {\n    digitalWrite(redPin, HIGH);\n  }\n\n  if (colors\
    \ & GREEN_ON)\n  {\n    digitalWrite(greenPin, HIGH);\n  }\n  else\n  {\n    digitalWrite(greenPin,\
    \ LOW);\n  }\n\n  if (colors & BLUE_ON)\n  {\n    digitalWrite(bluePin, HIGH);\n\
    \  }\n  else\n  {\n    digitalWrite(bluePin, LOW);\n  }\n} \n\n/*\n * Setup -\
    \ 我们草图的主配置点，用于配置\n *         Arduino 以在定义的引脚上输出数字值。\n *\n * 参数 - 无\n *\n * 返回\
    \ - 无\n */\n\nvoid setup()\n{\n  pinMode(redPin, OUTPUT);\n  pinMode(greenPin,\
    \ OUTPUT);\n  pinMode(bluePin, OUTPUT);\n\n  LightLed(SETUP);\n  delay(1000);\n\
    }\n\n/*\n * loop - 每当 Arduino 运行主循环时都会调用的主方法，\n *        将 LED 开启为绿色，然后每半秒\n *\
    \        闪烁关闭一次。\n *\n * 参数 - 无\n *\n * 返回 - 无\n */\nvoid loop()\n{\n  LightLed(POWER_ON);\n\
    \  delay(500);\n\n  LightLed(BLANK);\n  delay(500);\n} \n```\n\n## 枚举\n\n在当前的草图中，我使用了\
    \ C 编程语言的一种新功能，称为枚举（enumeration），即 `enum`。与 `const` 整数或如 `#define VARIABLE` 的定义类似，枚举允许开发者为某些名称分配特定的值，这使得我们的代码更易读。对于这个枚举，我定义了三个值，用于指示\
    \ LED 的每个部分是开启还是关闭。我为每个枚举项分配了值，使得每个值都对应总字节中的一个特定位（bit）。请考虑以下：\n\n```cpp\n const\
    \ int myValue       = 42;         // 十进制表示（基数 10）\nconst int myValueHex    = 0x2A;\
    \       // 十六进制表示（基数 16）\nconst int myValueBinary = 0b00101010; // 二进制表示（基数 2）\
    \ \n```\n\n这些常量的值是相同的，但我以各种格式展示了它们。如你所见，十进制版本可能是最容易理解的，而二进制版本虽然繁琐，但在指示哪些位开启或关闭方面非常直观。二进制数是计算机计算的核心。我正在使用计算机数字的这一特性来指示\
    \ LED 应该是开启还是关闭。这样做的好处在于，可以使用一个变量来指示 LED 的哪些部分开启或关闭，而不是为每种颜色使用单独的值。你可能已经注意到，我在枚举中分配的每个值都有独特的位来表示。原因是我我可以将它们组合起来，创建额外的颜色，例如红色和绿色产生黄色。\n\
    \n## 常量\n\n在草图的开头，我声明了一些常量值，我稍后会在代码中使用它们。正如我之前提到的，将这些值声明为常量更好，这样就可以获得有意义名称的优势。在这种情况下，在这些这些引脚之前，我会将它们作为数字输出引脚启用。\n\
    \n```cpp\nconst int POWER_OFF = RED_ON;\nconst int POWER_ON = GREEN_ON;\nconst\
    \ int SETUP = GREEN_ON | RED_ON;  // 同时开启红色和绿色得到黄色\nconst int BLANK = 0; // 无\
    \ LED 亮起\n```\n\n## 方法声明\n\n我在草图中声明了一个方法，根据颜色来点亮 LED。这允许多达 (8) 种颜色全部开启。\n\n##\
    \ 用户方法\n\n如上述，我创建了一个方法，根据传入的颜色开启 LED 的各个部分。颜色值被称为位掩码，指示哪些颜色开启，哪些关闭。传入的颜色值与我的每个常量\
    \ `RED_ON`、`GREEN_ON` 和 `BLUE_ON` 进行与运算（i.e. `&`），以确定 LED 的部分应该是开启还是关闭。`&` 运算是二进制数的基本操作。\n\
    \n## Setup\n\n`setup()` 方法是我根据需要配置 Arduino® 的地方。在这种情况下，在使用它们之前，我会将它们作为数字输出引脚启用。\n\
    \n```cpp\nvoid setup()\n{\n  pinMode(redPin, OUTPUT);\n  pinMode(greenPin, OUTPUT);\n\
    \  pinMode(bluePin, OUTPUT);\n\n  LightLed(SETUP);\n  delay(1000);\n}\n```\n\n\
    此设置代码中需要注意的主要点是，我延迟了 (1) 秒，以便用户在将其更改为绿色之前看到黄色 LED。\n\n## Loop\n\n通常 `loop()` 方法是执行所有工作的地方，但由于这只是一个部分草图（i.e.\
    \ 我展示了如何使用数字输出，没有更多），因此它的功能相当有限。\n\n"
