  trans: "\n正如你可能已经注意到的，这并不是一台带有显示器、键盘和鼠标的完整计算机。虽然它在执行简单任务时速度很快，但无法超越超级计算机的处理速度。考虑到如今处理器的运行速度是这个小控制器的\
    \ 100 倍或 200 倍，因此它没有完整计算机那么快也并不令人意外。整个 Arduino® 环境基于易于上手且易于使用的工具。该环境会尽力防止在使用环境本身和目标设备时发生意外错误。但这种额外的安全性也带来了局限性和潜在的速度损失。此外，由于处理器引脚到内部函数的复用存在过载，还存在设备冲突的可能。然而，对于我们想要做的那些项目，它是绰绰有余的。\n\
    \n## 入门指南\n\n那么我们从哪里开始呢？假设你已经购买了 Arduino® 并安装了开发环境，我们的首要任务是确保一切运行正常。如果你还没有下载并配置你的系统，请参阅标题为设置的章节，获取有关设置开发环境的信息。准备好后，打开开发平台，你应该能看到类似下面的界面：\n\
    \n![Ardunio 主界面](img/00013.jpeg)\n\n现在，我们需要确保你的 Arduino® 已在开发环境中正确注册。如果你还没有将 Arduino®\
    \ 连接到你的开发系统，你可能需要加载驱动程序以便开发板与你的系统通信。在 Windows™ 平台上，你可以在 Arduino® 软件文件夹下的驱动 文件夹中找到必要的驱动程序。如果你在\
    \ Macintosh® 或 Linux® 上运行，则需要访问 USB 芯片制造商的网页下载适用于特定系统的驱动程序。你可以在[这里](http://www.ftdichip.com/Drivers/VCP.htm)找到它们。你也可以在那里找到最新的\
    \ Windows® 驱动程序。\n\n在上图中首先要注意的是当前选择的板和通信端口，即 `COM` 端口。这显示在图像的右下角。这个开发板是一个连接到 `COM3`\
    \ 的 Arduino `UNO`。为了使用你的 Arduino®，你需要确保选择了正确的 `COM` 端口以及硬件板。要这样做，请选择菜单栏上的“工具”(tools)菜单。\n\
    \n注意：取决于用户的环境，菜单弹出可能需要一些时间。\n\n从“工具”菜单中，选择“开发板”(board)，然后选择你拥有的板的类型。接图显示了开发板的选择，我选择了\
    \ Arduino `UNO` 作为我的板。\n\n![从工具下拉菜单中选择开发板](img/00016.jpeg)\n\n一旦选择了正确的开发板，就可以选择操作系统分配给开发板的相应\
    \ `COM` 端口。接图显示了为连接的 Arduino® 板选择的 `COM` 端口。\n\n![从工具下拉菜单中选择通信端口](img/00017.jpeg)\n\
    \n在我们继续之前，查看一下在 Arduino  sketch 程序（sketch）中可能会发现的不同变量类型将是好的。以下是你可能会遇到的一些常见变量类型：\n\
    \n- `char`：有符号值，表示从 -128 到 127 的值。`Char` 使用 8 位数据存储。\n- `unsigned char`：无符号值，表示从\
    \ 0 到 255 的值。与 `char` 一样，`unsigned char` 同样使用 8 位数据存储。\n- `byte`：类似于 `unsigned\
    \ char`，在 Arduino  sketch 程序中使用。\n- `int`：有符号整数类型，表示从 -32,768 到 32,767 的值。`Int`\
    \ 使用 16 位数据存储*。\n- `unsigned int`：无符号整数类型，表示从 0 到 65,535 的值。`Int` 使用 16 位数据存储*。\n\
    - `long`：有符号值，表示从 -2,147,483,648 到 2,147,483,647 的值。`Long` 使用 32 位数据存储*。\n- `unsigned\
    \ long`：无符号值，表示从 0 到 4,294,967,295 的值。`Unsigned long` 使用 32 位数据存储*。\n- `float`：浮点值表示十进制法中宽范围的有符号值，主要用于表示分数和其他非整数值。`Float`\
    \ 使用 32 位数据存储**。\n- `double`：对于 Arduino 平台，`double` 类似于 `float`。\n- `void`：`void`\
    \ 类型通常表示无值，但取决于其用法。对于方法定义，`void` 返回值表示该方法不会返回任何值。\n\n* `int` 或 `long` 的大小可能根据所使用的处理器而不同。对于我们使用的\
    \ Atmel® 微控制器，整数将是 16 位（即 2 字节），而 `long` 将是 32 位（即 4 字节）。其他微控制器可能有更大的整数尺寸。你应该验证目标硬件数据类型的大小，以确保你不会做出任何错误的假设。\n\
    \n** 浮点数以 32 位数据存储，表示尾数和指数。浮点数具有约 7 位小数精度，在处理数据时应考虑到这一点。\n\n每个 Arduino sketch\
    \ 程序都由两个函数组成，即方法：`setup` 和 `loop`。正如你可能想象的，`setup` 是你配置 Arduino 的地方，例如指定引脚的数据流。`loop`\
    \ 函数是执行处理的地方，并将以处理器尽可能快的速度执行。让我们详细查看这些方法并看看它们是如何工作的。\n\n### Setup\n\n如上所述，这是进行微控制器配置的地方。并不是说不能在该方法之外更改微控制器配置，但为了一致性，最好在这里进行任何配置。那么在你的\
    \ Arduino 上执行代码时应该配置哪些内容呢？主要是对数字引脚配置输入或输出，并启动可能需要启动的子系统，例如串口。主要是此方法只被调用一次，而 `loop`\
    \ 方法每次都会调用。考虑以下来自[sketch](http://book.afmsoftware.com/resources/SkeletonSketch.zip)\
    \ 的代码片段：\n\n```cpp\n /*\n  * Setup - sketch 配置的主要点，用于配置\n  *         Arduino 操作\n\
    \  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\n void setup()\n {\n\
    \   Serial.begin(9600);\n\n   pinMode(13, OUTPUT);\n }\n```\n\n开头是描述方法意图的注释。我说意图是因为像所有事情一样，它们始于良好的意图，然后偏离那里。对于\
    \ Arduino sketch 程序，有两种接受的注释类型：上所示的块注释和单行注释[5]。块注释是起始标记 `/*` 和结束标记 `*/` 之间的所有内容，告诉\
    \ Arduino 编译器标记之间的内容（包括标记本身）可以被忽略。虽然上面的示例显示了跨多行的块注释，但并没有什么阻止它成为一组单行注释，例如：\n\n\
    ```cpp\n // Setup - sketch 配置的主要点，用于配置 Arduino 操作 \n // \n // Params - none\n\
    \ // \n // Returns - nothing\n // \n```\n\n我不太愿意将将整个内容放在同一行，因为我更倾向于在注释周围留出一些空白（即空白区域）以提高可读性。你可以像下面这样做：\n\
    \n```cpp\n // Setup - sketch 配置的主要点，用于配置 Arduino 操作 \n```\n"
- fmt: "\nThe other things of note inside of the comment block is the `Params` and\
    \ `Returns` lines. The first tells the viewer of your code what parameters need\
    \ to be passed into the method. As shown above, not all methods require parameters.\
    \ The second line indicates what values one might expect to be returned from the\
    \ method when it finishes. In this case, nothing is returned. Later on we will\
    \ explore methods that take both parameters and return values to the calling application.\
    \ This convention is something I tend to use most often and part of the reason\
    \ why I don't use a single line comment at the beginning of functions i.e. methods.\
    \ Even though nothing is passed in as a parameter nor returned, have it spelled\
    \ out never hurts.\n\nFollowing the comment block is the name of the method which\
    \ declares what the return value type will be, if any, and also details any parameters\
    \ that need to be supplied when the application calls the method. In this case,\
    \ the method does not take any parameters and does not return any value. This\
    \ is indicated by the word `void`. Next comes the opening brace, `{`, which indicates\
    \ the start of the method definition. There is also a closing brace, `}` which\
    \ indicates the end of the method definition. The opening and closing braces are\
    \ not limited to method definitions and will be used in additional constructs\
    \ which will be explored later on. Now we get to the actual code. The first line\
    \ is as follows:\n\n```\n Serial.begin(9600); \n```\n\nThis code, which is part\
    \ of the standard Arduino® platform, calls the `begin` method which is part of\
    \ the `Serial` object. An object is a collection of related methods and variables\
    \ that work together to perform a task. The C++ term for an object is a `class`\
    \ which is fundamental to C++ and object oriented programming in general. We will\
    \ be looking at various objects and constructs as we progress through this book.\
    \ As you can see, the `begin` method takes a single parameter which in this case\
    \ is a value of `9600`. This value represents the speed at which the serial port\
    \ of the Arduino® will operate at. While the speed can be a number of values [[6](#part0012_split_001.html_Ref6)],\
    \ `9600` is one that I remember easily and typically use. In terms of speed, this\
    \ value is typically given as a baud rate which is the number of symbols transmitted\
    \ per second. This value happens to be the same as the bit rate resulting in `9600`\
    \ bits per second in transmission speed. The end data rate however will be somewhat\
    \ less due to some of the bits being used to indicate the start and ending of\
    \ each packet. The main thing to note is that when you open up a serial monitor\
    \ application such as the one included with the Arduino® software, you will need\
    \ to ensure that it is set for the same speed that was specified in the sketch.\
    \ So why would we want to start the serial port? In general this is the simplest\
    \ way to debug your application. You upload your code, it executes and you monitor\
    \ the results. It can be real useful when things are not working as expected and\
    \ you need to dig in and figure out what the issue is. If application speed is\
    \ a concern, than once you have completed your project, you can remove all of\
    \ this code resulting in a smaller package and faster execution time. A few things\
    \ to be careful of though is that for time sensitive applications, the inclusion\
    \ or exclusion of this code could change your results. Also care should be taken\
    \ when placing any types of debug lines as you may end up with more information\
    \ than you can use.\n\n```\n pinMode(13, OUTPUT); \n```\n\nThe second line of\
    \ code, also a standard part of the Arduino® platform, is where the digital pin,\
    \ `13`, is configured as an output. On the Arduino®, there is a LED connected\
    \ to the digital pin number `13` which can be used as a visual indicator of sorts.\
    \ The first parameter is the pin that will be configured while the second parameter\
    \ is the mode which in this case is `OUTPUT`. The word `OUTPUT` is a constant\
    \ value defined by the Arduino® platform. Typically it is good practice to create\
    \ a constant value to specify what the particular pin will be doing opposed to\
    \ a raw number. In this case, I left the number in the code to highlight what\
    \ pin I was using and to keep the sketch simple. In the future examples, I will\
    \ use more meaningful identifiers for these types of values.\n\n### Loop\n\n`loop`\
    \ is where all of the main processing of your sketch will be done. This method\
    \ will be executed soon after the `Setup` method has completed and will continue\
    \ to be executed for the life of your application that is to say until you power\
    \ down your Arduino®. While this keeps the complexity of your code down, there\
    \ are a few things to be careful of when writing code for the `loop`. The first\
    \ thing to remember is that the speed at which `loop` is called can be variable\
    \ based on the speed of the micro-controller and how much work is being done inside\
    \ of your `loop`. Another thing to note is that if you need to receive input from\
    \ the user, you may need to do that over multiple passes of the `loop` opposed\
    \ to waiting until the input arrives otherwise you will prevent other activities\
    \ from happening. Building upon the above code, I will demonstrate the basic sketch\
    \ of turning the pin `13` LED on and off periodically causing it to flash.\n\n\
    ```\n /*\n  * loop - main method which will be called each time the\n  *     \
    \   Arduino goes through its main loop\n  *\n  * Params - none\n  *\n  * Returns\
    \ - nothing\n */\n\n void loop()\n {\n   digitalWrite(13, HIGH);\n   delay(500);\n\
    \   digitalWrite(13, LOW);\n   delay(500);\n   Serial.println(\"Led 13 has been\
    \ toggled on and off.\");\n } \n```\n\nAgain the method starts with a comment\
    \ block describing what the method is intended to do along with the name of the\
    \ method declaration indicating that no parameters are passed to the method and\
    \ the method doesn't return any value.\n\n```\n digitalWrite(13, HIGH); \n```\n\
    \nThis first line of code calls the `digitalWrite` method which instructs the\
    \ micro-controller to set the output value on `13` to `HIGH`. The word `HIGH`\
    \ is another predefined value which you can use throughout your sketch as needed.\
    \ Because we are writing a digital value out to this pin, it can only be one of\
    \ two values, `LOW` or `HIGH`. These values correspond to 0 volts when set to\
    \ `LOW` and 5* volts when set to `HIGH`. With this, the LED connected to pin `13`\
    \ will turn on as there is now a positive voltage emitting from the given pin.\
    \ When set to `LOW`, the voltage is set to 0 volts resulting in the LED turning\
    \ off.\n\n* the Arduino® UNO runs on 5 volts hence the value when set to HIGH\
    \ will be 5 volts. Other boards, such as the [Arduino Due](http://arduino.cc/en/Main/ArduinoBoardDue),\
    \ run at a lower voltage such as 3.3v so the output voltage when set to HIGH will\
    \ be equivalent to that lower voltage.\n\nWhen using a board with a lower overall\
    \ voltage, care must be taken that the resistors and other components recommended\
    \ in this book are adjusted accordingly. Because of the smaller voltage, less\
    \ current will be generated as the current is equal to the voltage divided by\
    \ the resistance. While this may be alright in most cases, you should also verify\
    \ the maximum amount of current that each output pin can supply as they may differ\
    \ across micro-controller devices.\n\n```\n delay(500); \n```\n"
  raw: "The other things of note inside of the comment block is the Params and Returns\
    \ lines. The first tells the viewer of your code what parameters need to be passed\
    \ into the method. As shown above, not all methods require parameters. The second\
    \ line indicates what values one might expect to be returned from the method when\
    \ it finishes. In this case, nothing is returned. Later on we will explore methods\
    \ that take both parameters and return values to the calling application. This\
    \ convention is something I tend to use most often and part of the reason why\
    \ I don't use a single line comment at the beginning of functions i.e. methods.\
    \ Even though nothing is passed in as a parameter nor returned, have it spelled\
    \ out never hurts.\n\nFollowing the comment block is the name of the method which\
    \ declares what the return value type will be, if any, and also details any parameters\
    \ that need to be supplied when the application calls the method. In this case,\
    \ the method does not take any parameters and does not return any value. This\
    \ is indicated by the word void. Next comes the opening brace, { which indicates\
    \ the start of the method definition. There is also a closing brace, } which indicates\
    \ the end of the method definition. The opening and closing braces are not limited\
    \ to method definitions and will be used in additional constructs which will be\
    \ explored later on. Now we get to the actual code. The first line is as follows:\n\
    \n```\n Serial.begin(9600); \n```\n\nThis code, which is part of the standard\
    \ Arduino® platform, calls the begin method which is part of the Serial object.\
    \ An object is a collection of related methods and variables that work together\
    \ to perform a task. The C++ term for an object is a class which is fundamental\
    \ to C++ and object oriented programming in general. We will be looking at various\
    \ objects and constructs as we progress through this book. As you can see, the\
    \ begin method takes a single parameter which in this case is a value of 9600.\
    \ This value represents the speed at which the serial port of the Arduino® will\
    \ operate at. While the speed can be a number of values [[6](#part0012_split_001.html_Ref6)],\
    \ 9600 is one that I remember easily and typically use. In terms of speed, this\
    \ value is typically given as a baud rate which is the number of symbols transmitted\
    \ per second. This value happens to be the same as the bit rate resulting in 9600\
    \ bits per second in transmission speed. The end data rate however will be somewhat\
    \ less due to some of the bits being used to indicate the start and ending of\
    \ each packet. The main thing to note is that when you open up a serial monitor\
    \ application such as the one included with the Arduino® software, you will need\
    \ to ensure that it is set for the same speed that was specified in the sketch.\
    \ So why would we want to start the serial port? In general this is the simplest\
    \ way to debug your application. You upload your code, it executes and you monitor\
    \ the results. It can be real useful when things are not working as expected and\
    \ you need to dig in and figure out what the issue is. If application speed is\
    \ a concern, than once you have completed your project, you can remove all of\
    \ this code resulting in a smaller package and faster execution time. A few things\
    \ to be careful of though is that for time sensitive applications, the inclusion\
    \ or exclusion of this code could change your results. Also care should be taken\
    \ when placing any types of debug lines as you may end up with more information\
    \ than you can use.\n\n```\n pinMode(13, OUTPUT); \n```\n\nThe second line of\
    \ code, also a standard part of the Arduino® platform, is where the digital pin,\
    \ 13, is configured as an output. On the Arduino®, there is a LED connected to\
    \ the digital pin number 13 which can be used as a visual indicator of sorts.\
    \ The first parameter is the pin that will be configured while the second parameter\
    \ is the mode which in this case is OUTPUT. The word OUTPUT is a constant value\
    \ defined by the Arduino® platform. Typically it is good practice to create a\
    \ constant value to specify what the particular pin will be doing opposed to a\
    \ raw number. In this case, I left the number in the code to highlight what pin\
    \ I was using and to keep the sketch simple. In the future examples, I will use\
    \ more meaningful identifiers for these types of values.\n\n### Loop\n\nLoop is\
    \ where all of the main processing of your sketch will be done. This method will\
    \ be executed soon after the Setup method has completed and will continue to be\
    \ executed for the life of your application that is to say until you power down\
    \ your Arduino®. While this keeps the complexity of your code down, there are\
    \ a few things to be careful of when writing code for the loop. The first thing\
    \ to remember is that the speed at which loop is called can be variable based\
    \ on the speed of the micro-controller and how much work is being done inside\
    \ of your loop. Another thing to note is that if you need to receive input from\
    \ the user, you may need to do that over multiple passes of the loop opposed to\
    \ waiting until the input arrives otherwise you will prevent other activities\
    \ from happening. Building upon the above code, I will demonstrate the basic sketch\
    \ of turning the pin 13 LED on and off periodically causing it to flash. This\
    \ is also included in the sketch noted previously.\n\n```\n /*\n  * loop - main\
    \ method which will be called each time the\n  *        Arduino goes through its\
    \ main loop\n  *\n  * Params - none\n  *\n  * Returns - nothing\n */\n\n void\
    \ loop()\n {\n   digitalWrite(13, HIGH);\n   delay(500);\n   digitalWrite(13,\
    \ LOW);\n   delay(500);\n   Serial.println(\"Led 13 has been toggled on and off.\"\
    );\n } \n```\n\nAgain the method starts with a comment block describing what the\
    \ method is intended to do along with the name of the method declaration indicating\
    \ that no parameters are passed to the method and the method doesn't return any\
    \ value.\n\n```\n digitalWrite(13, HIGH); \n```\n\nThis first line of code calls\
    \ the method digitalWrite which instructs the micro-controller to set the output\
    \ value on pin 13 to HIGH. The word HIGH is another predefined value which you\
    \ can use throughout your sketch as needed. Because we are writing a digital value\
    \ out to this pin, it can only be one of two values, LOW or HIGH. These values\
    \ correspond to 0 volts when set to LOW and 5* volts when set to HIGH. With this,\
    \ the LED connected to pin 13 will turn on as there is now a positive voltage\
    \ emitting from the given pin. When set to LOW, the voltage is set to 0 volts\
    \ resulting in the LED turning off.\n\n* the Arduino® UNO runs on 5 volts hence\
    \ the value when set to HIGH will be 5 volts. Other boards, such as the [Arduino\
    \ Due](http://arduino.cc/en/Main/ArduinoBoardDue), run at a lower voltage such\
    \ as 3.3v so the output voltage when set to HIGH will be equivalent to that lower\
    \ voltage.\n\nWhen using a board with a lower overall voltage, care must be taken\
    \ that the resistors and other components recommended in this book are adjusted\
    \ accordingly. Because of the smaller voltage, less current will be generated\
    \ as the current is equal to the voltage divided by the resistance. While this\
    \ may be alright in most cases, you should also verify the maximum amount of current\
    \ that each output pin can supply as they may differ across micro-controller devices.\n\
    \n```\n delay(500); \n```"
