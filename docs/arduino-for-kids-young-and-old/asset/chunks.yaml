    我知道需要两个 `SN74LS595` 设备来运行每个七段码显示器。我还需要一种方法来驱动 LED，而不会让 `Arduino®` 输出引脚过载。`SN74LS595`
    能够处理 24 毫安电流。虽然关于 Radio Shack™ 七段码显示器的发布信息有限，但我发现它们与 Everlight[12] 七段码显示器相似或相同，这表明每个段码最大需要
    15 毫安电流。为了确保我不会让任何设备过载，我将在各种 LED 灯具中串联放置上拉电阻。这样我就可以在驱动 LED 的同时不让我的设备过载。考虑到 LED
    的数量，我将考虑电阻阵列，以最大限度地减少最终电路板上所需的空间。


    我要要做的第一件事是在面包板上创建一个简化的电路，以测试我认为可行的方案。尽管目前有很多理论支持，但在尝试继续进行之前，我需要先验证该设计。在这个原型中，我将连接一个
    `SN74LS595`、一个电阻网络和一个七段码显示器，以测试硬件和软件接口。


    ## 原型


    ![expansion IO breadboard prototype](img/00031.jpeg)


    在我的原型中，我只接线了一个 `SN74LS595` 芯片，因为它们要做的作用是完全相同的。我还没有连接大灯，因为它们的接线非常简单，即：一个电源、一个电阻和一个
    LED。我通过 `USB` 将 `Arduino®` 连接到笔记本电脑，但同时也使用外部六（6）伏特电源来驱动面包板上的电路。虽然面包板上的任何组件都不会让我的
    `USB` 端口过载，但如果不需要冒险，我不会去冒险。


    ## 电路


    现在我已经验证了原型，可以继续构建一个完整的电路，用于扩展我的 I/O 并显示车牌号。电路由两个 `74LS595` 移位寄存器和七段码显示器组成。我还使用了电阻网络来节省电路板空间。扩展板的主电路如下所示：![expansion
    schematic](img/00032.gif)


    ## PCB


    我根据原理图制作的电路板如下：![expansion printed circuit board](img/00033.gif) 你会在原理图和 `PCB`
    中注意到，我没有定义用于更改车号的输入按钮。这是因为我打算将它们安装在 `PCB` 之外，以防止它们在赛车中暴露。一旦我为汽车配置了正确的号码，我不希望它被无意中更改，所以让它们远离视线会方便一些。对于按钮，我将配置两个推按按钮，它们只需允许用户单独增加七段码显示器中每个数字。由于这是一个相当简单的设计，我们只会增加数字。也许这并不是最对用户友的设计，但考虑到数字不会经常改变，这就足够了。


    ## 软件


    对于这个程序（sketch），我需要分配两个数据引脚、两个移位时钟、两个存储时钟以及两个用于驱动作为大灯的 LED 的引脚。一旦分配完成，我就可以向每个移位寄存器写入数据，以便为汽车显示分配正确的数字。我还需要配置两个中断来处理七段码显示器的递加操作。


