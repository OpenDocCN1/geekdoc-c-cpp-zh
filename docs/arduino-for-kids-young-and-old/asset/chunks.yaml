    \ EEPROM. The first one is the ReadInteger function which looks like this:\n\n\
    ```\n int ReadInteger(int offset)\n{\n  int returnValue = 0;\n\n  // Read in EEPROM\n\
    \  for (int count = 0; count < sizeof(int); count++)\n  {\n    returnValue |=\
    \ EEPROM.read(offset + count) << (count * 8); // read in a byte from eeprom and\
    \ shift it x to build up an integer of data\n  }\n\n  return returnValue;\n} \n\
    ```\n\nThis code reads in a series of bytes from the EEPROM and concatenates them\
    \ into a single integer value. As I read each byte, I shift it over using the\
    \ shift (<<) operator which shifts the bits in the supplied value the number of\
