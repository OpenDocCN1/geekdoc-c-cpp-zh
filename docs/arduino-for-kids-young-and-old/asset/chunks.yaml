  trans: "\n\n```cpp\n /*\n * RotaryEncoder - 此草图的目的是处理来自\n *                  旋转编码器的输入，以调整\
    \ LED 的亮度。\n *\n * 旋转编码器的输出将连接到一个中断引脚和一个普通输入\n * 线，以便检测运动并确定运动方向。\n *\n * 其中一个输出线将连接到\
    \ LED，我们将使用 PWM\n * 根据旋转编码器旋转的程度来调整亮度。\n *\n * 我们将存储 LED 的当前亮度（0 - 255），以便在重启后\n\
    \ * 恢复它。\n */\n\nconst int ledOutput = 3;\nconst int directionPin = 4;\nconst\
    \ long signature = 0xFACE; // 某些非任意值\n\n/* 模块包含 */\n\n#include <EEPROM.h>\n\n\
    /* 此草图中使用的结构体 */\n\ntypedef struct\n{\n  long signature;\n  int brightness;\n\
    } EE_Structure;\n\n/*\n * 此草图中使用的变量\n */\n\nvolatile EE_Structure StoredData;\n\
    \n/*\n * 方法声明 \n */\n\nint ReadInteger(int offset);\nvoid WriteInteger(int offset,\
    \ int value);\nlong ReadLong(int offset);\nvoid WriteLong(int offset, long value);\n\
    void HandleDecoderTrigger();\n\n/*\n * ReadInteger - 从非易失性存储器中读取整数的辅助函数\n *\n\
    \ * 参数 - offset - 数据存储在 EEPROM 中的偏移量\n *\n * 返回 - int - 从指定位置读取的值\n */\n\nint\
    \ ReadInteger(int offset)\n{\n  int returnValue = 0;\n\n  // 从 EEPROM 中读取\n  for\
    \ (int count = 0; count < sizeof(int); count++)\n  {\n    returnValue |= EEPROM.read(offset\
    \ + count) << (count * 8); // 从 eeprom 读取一个字节并向左移 x 位以构建一个整数数据\n  }\n\n  return\
    \ returnValue;\n}\n\n/*\n * WriteInteger - 向非易失性存储器写入整数的辅助函数\n *\n * 参数 - offset\
    \ - 数据要存储在 EEPROM 中的偏移量\n *        - value - 要存储的值\n *\n * 返回 - 无\n */\n\nvoid\
    \ WriteInteger(int offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize\
    \ = sizeof(int);\n\n  for (int count = 0; count < intSize; count++)\n  {\n   \
    \ dataValue = value >> ((intSize - 1 - count) * 8); // 我们需要从左到右移动，先是高位然后是低位\n\
    \    EEPROM.write(offset + count, dataValue);\n  }\n}\n\n/*\n * ReadLong - 从非易失性存储器中读取长类型的辅助函数\n\
    \ *\n * 参数 - offset - 数据存储在 EEPROM 中的偏移量\n *\n * 返回 - long - 从指定位置读取的值\n */\n\n\
    long ReadLong(int offset)\n{\n  long value = 0;\n\n  int storedValue = ReadInteger(offset);\n\
    \n  value = (storedValue << 16);\n\n  storedValue = ReadInteger(offset + 2);\n\
    \n  value += storedValue;\n\n  return value;\n}\n\n/*\n * WriteLong - 向非易失性存储器写入长类型的辅助函数\n\
    \ *\n * 参数 - offset - 数据要存储在 EEPROM 中的偏移量\n *        - value - 要存储的值\n *\n * 返回\
    \ - 无\n */\n\nvoid WriteLong(int offset, long value\n{\n  int upperValue = (value\
    \ >> 16);\n  int lowerValue = value && 0xFFFF;\n\n  WriteInteger(offset, upperValue);\n\
    \  WriteInteger(offset + 2, lowerValue);\n}\n\n/*\n * HandleDecoderTrigger - 当编码器旋转时被调用\n\
    \ *\n * 参数 - 无\n *\n * 返回 - 无\n */\n\nvoid HandleDecoderTrigger(void)\n{\n  byte\
    \ directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // 顺时针\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // 反时针\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n}\n\n/*\n * Setup - 草图的主配置点，用于配置\n *         Arduino\
    \ 从旋转编码器读取信号，并根据\n *         旋转编码器旋转的程度和方向设置 LED 的亮度。\n *\n * 参数 - 无\n *\n * 返回\
    \ - 无\n */\n\nvoid setup()\n{\n  StoredData.signature = ReadLong(0); \n\n  if\
    \ (StoredData.signature == signature)\n  {\n    // 我们以前来过这里吗？\n    StoredData.brightness\
    \ = ReadInteger((char *)&StoredData.brightness - (char *)&StoredData.signature);\n\
    \  }\n  else\n  {\n    // 存储签名和默认亮度 0\n    WriteLong(0, signature);\n    WriteInteger((char\
    \ *)&StoredData.brightness - (char *)&StoredData.signature, StoredData.brightness);\n\
    \  }\n\n  pinMode(directionPin, INPUT);\n\n  attachInterrupt(0, HandleDecoderTrigger,\
    \ FALLING);  // 在下降沿触发\n}\n\n/*\n * loop - 每当 arduino 执行其主循环\n * 时都会调用的主方法\n *\
    \ 参数 - 无\n * 返回 - 无\n */\n\nvoid loop()\n{\n  static int lastBrightness = 0;\n\
    \  static int brightnessOffset = (char *)&StoredData.brightness - (char *)&StoredData.signature;\n\
    \n  if (lastBrightness != StoredData.brightness)\n  {\n    analogWrite(ledOutput,\
    \ StoredData.brightness);\n    WriteInteger(brightnessOffset, StoredData.brightness);\n\
    \  }\n\n  // 暂停 500 毫秒\n  delay(500);\n}\n\n# RotaryEncoder\n\n此草图的目的是处理来自旋转编码器的输入，以调整\
    \ LED 的亮度。\n旋转编码器的输出将连接到一个中断引脚和一个普通输入线，以便检测运动并确定运动方向。\n其中一个输出线将连接到 LED，我们将使用 PWM\
    \ 根据旋转编码器旋转的程度来调整亮度。\n我们将存储 LED 的当前亮度（0 - 255），以便在重启后恢复它。\n\n## 常量\n```cpp\nconst\
    \ int ledOutput = 3;\nconst int directionPin = 4;\nconst long signature = 0xFACE;\
    \ // 某些非任意值\n```\n\n## 模块包含\n```cpp\n#include <EEPROM.h>\n```\n\n## 此草图中使用的结构体\n\
    ```cpp\ntypedef struct\n{\n  long signature;\n  int brightness;\n} EE_Structure;\n\
    ```\n\n## 此草图中使用的变量\n```cpp\nvolatile EE_Structure StoredData;\n```\n\n## 方法声明\n\
    ```cpp\nint ReadInteger(int offset);\nvoid WriteInteger(int offset, int value);\n\
    long ReadLong(int offset);\nvoid WriteLong(int offset, long value);\nvoid HandleDecoderTrigger();\n\
    ```\n\n### ReadInteger\n`ReadInteger` - 从非易失性存储器中读取整数的辅助函数\n- **参数**: `offset`\
    \ - 数据存储在 EEPROM 中的偏移量\n- **返回**: `int` - 从指定位置读取的值\n\n```cpp\nint ReadInteger(int\
    \ offset)\n{\n  int returnValue = 0;\n\n  // 从 EEPROM 中读取\n  for (int count =\
    \ 0; count < sizeof(int); count++)\n  {\n    returnValue |= EEPROM.read(offset\
    \ + count) << (count * 8); // 从 eeprom 读取一个字节并向左移 x 位以构建一个整数数据\n  }\n\n  return\
    \ returnValue;\n}\n```\n\n### WriteInteger\n`WriteInteger` - 向非易失性存储器写入整数的辅助函数\n\
    - **参数**: `offset` - 数据要存储在 EEPROM 中的偏移量；`value` - 要存储的值\n- **返回**: 无\n\n```cpp\n\
    void WriteInteger(int offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize\
    \ = sizeof(int);\n\n  for (int count = 0; count < intSize; count++)\n  {\n   \
    \ dataValue = value >> ((intSize - 1 - count) * 8); // 我们需要从左到右移动，先是高位然后是低位\n\
    \    EEPROM.write(offset + count, dataValue);\n  }\n}\n```\n\n### ReadLong\n`ReadLong`\
    \ - 从非易失性存储器中读取长类型的辅助函数\n- **参数**: `offset` - 数据存储在 EEPROM 中的偏移量\n- **返回**: `long`\
    \ - 从指定位置读取的值\n\n```cpp\nlong ReadLong(int offset)\n{\n  long value = 0;\n\n \
    \ int storedValue = ReadInteger(offset);\n\n  value = (storedValue << 16);\n\n\
    \  storedValue = ReadInteger(offset + 2);\n\n  value += storedValue;\n\n  return\
    \ value;\n}\n```\n\n### WriteLong\n`WriteLong` - 向非易失性存储器写入长类型的辅助函数\n- **参数**:\
    \ `offset` - 数据要存储在 EEPROM 中的偏移量；`value` - 要存储的值\n- **返回**: 无\n\n```cpp\nvoid\
    \ WriteLong(int offset, long value)\n{\n  int upperValue = (value >> 16);\n  int\
    \ lowerValue = value && 0xFFFF;\n\n  WriteInteger(offset, upperValue);\n  WriteInteger(offset\
    \ + 2, lowerValue);\n}\n```\n\n### HandleDecoderTrigger\n`HandleDecoderTrigger`\
    \ - 当编码器旋转时被调用\n- **参数**: 无\n- **返回**: 无\n\n```cpp\nvoid HandleDecoderTrigger(void)\n\
    {\n  byte directionData = 0;\n\n  noInterrupts();\n\n  directionData = digitalRead(directionPin);\n\
    \n  if (directionData == HIGH)\n  {\n    // 顺时针\n    if (StoredData.brightness\
    \ < 256)\n    {\n      StoredData.brightness++;\n    }\n  }\n  else\n  {\n   \
    \ // 反时针\n    if (StoredData.brightness > 0)\n    {\n      StoredData.brightness--;\n\
    \    }\n  }\n\n  interrupts();\n}\n```\n\n### Setup\n`setup` - 草图的主配置点，用于配置 Arduino\
    \ 从旋转编码器读取信号，并根据旋转编码器旋转的程度和方向设置 LED 的亮度。\n- **参数**: 无\n- **返回**: 无\n\n```cpp\n\
    void setup()\n{\n  StoredData.signature = ReadLong(0); \n\n  if (StoredData.signature\
    \ == signature)\n  {\n    // 我们以前来过这里吗？\n    StoredData.brightness = ReadInteger((char\
    \ *)&StoredData.brightness - (char *)&StoredData.signature);\n  }\n  else\n  {\n\
    \    // 存储签名和默认亮度 0\n    WriteLong(0, signature);\n    WriteInteger((char *)&StoredData.brightness\
    \ - (char *)&StoredData.signature, StoredData.brightness);\n  }\n\n  pinMode(directionPin,\
    \ INPUT);\n\n  attachInterrupt(0, HandleDecoderTrigger, FALLING);  // 在下降沿触发\n\
    }\n```\n\n### Loop\n`loop` - 每当 arduino 执行其主循环时都会调用的主方法\n- **参数**: 无\n- **返回**:\
    \ 无\n\n```cpp\nvoid loop()\n{\n  static int lastBrightness = 0;\n  static int\
    \ brightnessOffset = (char *)&StoredData.brightness - (char *)&StoredData.signature;\n\
    \n  if (lastBrightness != StoredData.brightness)\n  {\n    analogWrite(ledOutput,\
    \ StoredData.brightness);\n    WriteInteger(brightnessOffset, StoredData.brightness);\n\
    \  }\n\n  // 暂停 500 毫秒\n  delay(500);\n}\n```\n\n"
- fmt: "\nIn this sketch, I am including a secondary file, which the Arduino® calls\
    \ a library. This allows me to utilize functionality that other's have provided\
    \ in order to access various features of the Arduino® that might not normally\
    \ be readily accessible. In traditional C and C++, common functionality is provided\
    \ in the form of libraries which are described in header files. `.H` is the common\
    \ file extension indicating that this is a header file. The header file will typically\
    \ describe the functionality that is made available by the particular library\
    \ without actually showing how it is done. This can be very useful to extend the\
    \ functionality of sketches and allow user's to share their code with others.\
    \ In order to take advantage of libraries inside of the Arduino® platform, select\
    \ the `Sketch` menu item and then the `Import library` option which will show\
    \ a selection of libraries that you can use. Select the `EEPROM` library to include\
    \ it with the current sketch that you have open. While I will not go into detail\
    \ regarding each of the libraries, it is good to know that they are there and\
    \ ready to be used when you need them. So now back to that `#include` statement.\
    \ This statement is a special keyword of the C language that is used to add functionality\
    \ to an application.\n\n![image showing library menu selection](images/00027.jpeg)\n\
    \nWhile you could retype everything in the file in order to make it available\
    \ for use, this can be very error prone, tedious, and quite frankly a waste of\
    \ time. The `#include` statement does this for you allowing you to build your\
    \ sketches faster and more reliably. Note that the `#` character at the beginning\
    \ of the include statement is required to indicate to the compiler that this is\
    \ a special command. Once you have included the library that you need, in this\
    \ case, the `EEPROM` library, you will be able to use the functionality that it\
    \ provides in your sketch.\n\nSo we included some additional functionality in\
    \ our code. That is pretty cool and something we will want to remember in the\
    \ future to save time when creating more complex sketches. It is also good to\
    \ note that you, as an end user, can make your own libraries of routines that\
    \ you use a lot to limit the amount of coding that you need to do. The temperature\
    \ conversion functions that we used previously would be good candidates for a\
    \ library as we will probably use them again from time to time and we probably\
    \ will not want to have to retype that information in again.\n\nNow we come to\
    \ the next new feature of the C programming language which is the structure. A\
    \ structure allows the programmer to group a set of variables together into one\
    \ container making it easier to pass around the data and to work with it. The\
    \ following is our structure declaration which we will use in this sketch.\n\n\
    ```c\n typedef struct\n{\n  long signature;\n  int brightness;\n} EE_Structure;\
    \ \n```\n\nThis structure is fairly simple and consists of the signature block\
    \ and a brightness value. I have called it `EE_Structure` as this will be the\
    \ structure of the data we will store in the `EEPROM`. It is important to note\
    \ that this is the name of the structure definition and not the actual variable\
    \ name I will use in my sketch. I am combining the brightness and a signature\
    \ in the data so that I can determine if I have a valid value stored in the `EEPROM`\
    \ when I look at it during future runs of my sketch. When I first run my sketch,\
    \ I cannot guarantee what values will be in the `EEPROM`. The signature helps\
    \ me determine if my sketch has ever been executed before. The second part of\
    \ this structure is the brightness of the LED which will range from zero (0) to\
    \ two hundred fifty five (255). This could fit into one unsigned character i.e.\
    \ a byte however I reserved extra space in case I need it later on. So where does\
    \ a structure come in handy when programming? Well, now I can use this structure\
    \ just like I would a regular variable type such as an integer. I am now able\
    \ to do the following:\n\n```c\n volatile EE_Structure StoredData; \n```\n\nThis\
    \ allows me to declare both the signature and the brightness at the same time.\
    \ It also keeps them together as one unit which I can pass around to methods as\
    \ needed. I didn't take full advantage of all of the benefits of a structure however\
    \ it still comes in handy to keep my data contained within one type. If I had\
    \ multiple encoders with multiple ID's, I could create one of these structures\
    \ for each of the LED's. I could also associate the output pin for each LED with\
    \ the brightness to keep each data set together. This can be very useful when\
    \ your data needs increase and the complexity of your sketches increase. This\
    \ is also a fundamental premise of object oriented design and C++ which is an\
    \ object oriented programming language. Keeping your data and the methods that\
    \ work with that data combined allows you to create building blocks to work with\
    \ in your later sketches.\n\nThe next few line of code are the function declarations\
    \ and the various helper functions that I wrote to make my program easier to understand\
    \ and to reduce the code size. I knew I would need to write data to the `EEPROM`\
    \ and be able to restore it at a later time. With this in mind, I created a few\
    \ functions, `ReadInteger`, `WriteInteger`, `ReadLong`, and `WriteLong` which\
    \ will read and write an integer or long to a specific location within the `EEPROM`.\
    \ The first one is the `ReadInteger` function which looks like this:\n\n```c\n\
    \ int ReadInteger(int offset)\n{\n  int returnValue = 0;\n\n  // Read in EEPROM\n\
    \  for (int count = 0; count < sizeof(int); count++)\n  {\n    returnValue |=\
    \ EEPROM.read(offset + count) << (count * 8); // read in a byte from eeprom and\
    \ shift it x to build up an integer of data\n  }\n\n  return returnValue;\n} \n\
    ```\n\nThis code reads in a series of bytes from the `EEPROM` and concatenates\
    \ them into a single integer value. As I read each byte, I shift it over using\
    \ the `<<` operator which shifts the bits in the supplied value the number of\
    \ bits. In this case I am shifting the data 8 bits which is the equivalent of\
    \ one byte.\n\nWhen shifting data, the bits are moved down or up depending on\
    \ the direction of the shift command. For instance, if I had the binary value\
    \ `0b00000011` which is equal to the value of three (3), I could shift it one\
    \ bit to the left which would then give me the value `0b00000110`. When I shift\
    \ the value left, the top most bit is lost and a zero is added to the end of the\
    \ value preserving the proper number of bits that make up the variable. In this\
    \ example, I am using 8 bits which represents one byte of data. If I was writing\
    \ this in code it would be as follows:\n\n```c\n byte value = 0x03;\t\t\t\t//\
    \ start with a value of 3\nbyte shiftedValue = value << 1;\t// shift left by 1\
    \ bit resulting in 0x06 i.e. 0b00000110 \n```\n\nAs you might have guessed, shifting\
    \ it to the right would do the opposite and with the value `0x06` becoming `0x03`.\
    \ If you were to shift it another single bit to the right, the value `0x03` would\
    \ then become `0x01`. Another thing to note, a one (1) bit shift is equivalent\
    \ to multiplying or dividing by two (2). When speed is a concern, shifting can\
    \ be an order of magnitude faster than a division operation.\n"
  raw: "In this sketch, I am including a secondary file, which the Arduino® calls\
    \ a library. This allows me to utilize functionality that other's have provided\
    \ in order to access various features of the Arduino® that might not normally\
    \ be readily accessible. In traditional C and C++, common functionality is provided\
    \ in the form of libraries which are described in header files. The .H is the\
    \ common file extension indicating that this is a header file. The header file\
    \ will typically describe the functionality that is made available by the particular\
    \ library without actually showing how it is done. This can be very useful to\
    \ extend the functionality of sketches and allow user's to share their code with\
    \ others. In order to take advantage of libraries inside of the Arduino® platform,\
    \ select the Sketch menu item and then the Import library option which will show\
    \ a selection of libraries that you can use. Select the EEPROM library to include\
    \ it with the current sketch that you have open. While I will not go into detail\
    \ regarding each of the libraries, it is good to know that they are there and\
    \ ready to be used when you need them. So now back to that #include statement.\
    \ This statement is a special keyword of the C language that is used to add functionality\
    \ to an application.\n\n![image showing library menu selection](images/00027.jpeg)\n\
