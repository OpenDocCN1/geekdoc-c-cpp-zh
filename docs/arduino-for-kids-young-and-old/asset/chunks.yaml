    \n*   Infrared Detector such as the one included with the emitter linked above\n\
    \n*   100 Ohm resistor\n\n*   15K Ohm resistor\n\n*   PC 5v fan\n\n#### Tools\n\
    \n*   breadboard\n\n*   jumper wires\n\n*   voltage meter\n\n#### Schematic\n\n\
    ![Rotary encoder trigger circuit](images/00028.jpeg)\n\n![Creative Commons - Attribution\
    \ - Share Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \n#### Software\n\nFor this code, we will configure our interrupt to trigger when\
