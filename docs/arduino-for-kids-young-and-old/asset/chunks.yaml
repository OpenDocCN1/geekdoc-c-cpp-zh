  trans: "\n\n既然我现在已经向你们介绍了一些关于 `Wire` 库如何使用的背景知识，让我们深入探讨一下。我是如何知道 `Wire` 库内部的缓冲区有多大的？我查看了。你可以开箱即用的每个每个库都位于运行\
    \ Arduino® 应用程序的本地机器上。在我的 Windows™ 机器上，我在 `C:\\Program Files (x86)\\Arduino\\\
    libraries\\Wire` 找到了它。对于 Macintosh™ 系统，它位于 Arduino® 程序包内部，你可以通过 Control - 点击鼠标按钮，并在弹出的右菜单中选择“显示包内容”（Show\
    \ Package Contents）选项来查看它。这样做后会显示一个名为 `Contents` 的文件夹，里面有许多文件夹。如果你打开 `Resources`\
    \ 文件夹，你会发现另一个名为 `Java` 的文件夹。在 `Java` 文件夹内部，文件结构与 PC 系统非常相似，包含了 `libraries` 文件夹，其中包含\
    \ `Wire` 文件夹。在 `Wire` 文件夹内部，还有一个名为 `utility` 的文件夹，它包含 `Wire` 库的支持文件。这段代码是基础的双线代码\
    \ `TWI`，这是我们最接近硬件的部分。\n\n虽然这花费了很多精力去挖掘，但了解你所依赖的库是如何运作总是好的。在这种情况下，我遇到的一个关键问题是在发送数据之前可以队列的数据量。标准串口库可以队列大约\
    \ 64 字节，但这个 `Wire` 库的最大缓冲区大小为 32 字节。在尝试通过慢总线发送 1024 字节屏幕数据时，这始终是一个需要注意的问题。1024\
    \ 字节的数据来自我的内部缓冲区，我用它来跟踪 LCD 上每个像素的状态。如果你查看我为 `sh1106` 创建的类，你会发现以下：\n\n```\n //\
    \ 1024 bytes 8 pages of 128 bits\n\nbyte m_screen[MAX_PAGE_COUNT][SCREEN_WIDTH];\
    \ \n```\n\n这绝对不是我最长的注释之一，但它确实总结了情况：即有 1024 字节来覆盖 8 页内存，每页内存位宽为 128 位。这个缓冲区允许我在将数据发送到实际设备之前，队列一些高级别的命令，如\
    \ `DrawPixel`、`DrawLine` 等。这节省了一些时间，但可能会导致一些奇怪的错误，例如由于绘图顺序导致一个图形被另一个图形遮挡。在这种情况下，考虑到系统的资源限制和环境的局限性，请用户小心。\n\
    \n现在要查看的是 `Wire` 类的细节。使用该库时的第一步是调用方法开始传输：`Wire.beginTransmission(SH1106_ADDR1)`。此调用包含了我想要通信的设备地址，使我的\
    \ Arduino® 成为主设备，LCD 成为从设备。一旦开始传输，我就可以发送代表命令或数据消息的字节数据。这是通过简单的 `Wire.write(SH1106_COMMAND)`\
    \ 或 `Wire.write(SH1106_DATA)` 函数调用完成的。完成之后，我就可以发送许多与命令或数据标志相关的数据字节。一旦我发送了所有数据，我将调用\
    \ `Wire.endTransmission()` 来完成数据传输，它还会返回一个状态字节，指示是否存在任何错误。通常情况下，使用 `Wire` 库就是这么简单。除了上述详细的调用外，还有许多继承自\
    \ `Stream` 类的标准 I/O 风格调用，如 `read`、`write`、`seek` 等。我将强调的最后一个方法是 `requestFrom(address,\
    \ quantity)`，其中地址应该是提供数据源，数量是我们期望从该设备接收回的字节数。这允许我们从 I2C 设备读回数据。\n\n### 总结\n\n\
    如所示，有许多方法与外部设备通信，包括上面未详述的额外协议，例如 [SATA](http://en.wikipedia.org/wiki/Serial_ATA)、[PCI\
    \ Express](http://en.wikipedia.org/wiki/PCI_Express) 等。这些方法大部分在 PC 类型环境中是标准的，但在嵌入式微控制器中并不总是存在。对于\
    \ Arduino® 上使用的 Atmel® 设备等嵌入式微控制器，上述通信方法将是最常见且易于接口的。我们还查看了 SPI 和 I2C，它们彼此非常相似，但各有优缺点。\n\
    \n| 协议 | 优点 | 缺点 |\n| :--- | :--- | :--- |\n| 串口 (Serial) | 简单且无处不在。具有标准和 TTL\
    \ 接口。 | 较慢。不适合任何类型的广播（即：同时向多个设备发送数据），除非你有特殊的适配器。 |\n| SPI | 速度快。运行速度非常快，并且可以使用相同的时钟和数据线与多个设备通信。\
    \ | 每个参与 SPI 总线的设备都需要一个专用的片选引脚（select pin）。 |\n| I2C | 比串口快，但无法比拟 SPI。仅使用两根线，因为目标设备地址是传输数据的一部分。\
    \ | 当另一个设备正在使用总线时尝试发送数据可能会发生冲突。速度没有 SPI 快。 |\n\n![章节结束图形](img/00001.jpeg)\n\n\
    # 存储\n\n## 位与字节\n\n存储是另一个 Arduino® 以及更重要的是 Atmel® 微控制器大放异彩的领域。每个板板上的主设备都有存储程序代码、变量和半永久数据的能力。\n\
    \n### 闪存 (Flash Memory)\n\n闪存是存储程序代码并在执行期间加载的地方。这种内存是持久的，可以多次重新编程。为了编程这种内存，必须对设备进行配置然后进行编程。Arduino®\
    \ 板板的编程通常通过连接到板板的电脑的 USB 端口完成。编程完成后，即使丢失电源，设备也会保留这些内存。与其他内存类型相比，这种内存的速度较慢。这种内存被分为两个部分：引导加载程序（boot\
    \ loader）和应用程序区域。每个部分的大小都是可配置的，以适应引导程序和应用程序的不同需求。需要注意的是，最终应用程序的大小必须足够小，能够放入应用程序区域，并考虑到引导加载程序占用的空间。\n\
    \n#### 引导加载程序 (Boot Loader)\n\n引导加载程序是允许微控制器自我重新编程的特殊软件。可能会在 Atmel® 设备的广告中看到它已内置\
    \ Arduino® 引导加载程序。这个引导加载程序允许 Arduino® 从 IDE 进行编程。虽然我不会深入介绍引导加载程序执行的所有细节，但它的主要目的是检查是否请求了重新编程，如果没有则启动存储在闪存应用程序部分的应用程序代码。由于引导加载程序和应用程序共享同一个闪存，因此将引导加载程序的大小保持到最小通常被认为是最佳实践。对于你自己的项目，取决于应用程序软件的大小，这可能并不是一个要求。关于\
    \ Atmel® 类型微控制器引导加载程序中包含的更多细节，请查看以下[设计备注 (32)](http://www.avrfreaks.net/modules/FreaksFiles/files/419/DN_032.pdf)。\n\
    \n#### 应用程序代码 (Application Code)\n\n"
- fmt: "\nThe application code area is where all of the end user's application code\
    \ is stored. It can be reprogrammed by the user via the IDE or other means such\
    \ as from the command line using a program like `avrdude`[[13](#part0012_split_001.html_Ref13)].\
    \ This memory is persistent in nature where it will retain the programming for\
    \ a number of years well beyond the typical life span of the product. The application\
    \ code is called by the boot loader once the boot loader determines that the user\
    \ does not want to reprogram the device. For our applications, this would be the\
    \ `setup` and `loop` methods we created along with any additional libraries we\
    \ may have used and the base Arduino® code.\n\n### SRAM\n\nThe static random access\
    \ memory, `SRAM`, is where all of the application data is stored during the execution\
    \ of your application. Unlike the flash memory, it can be written to fairly fast\
    \ and the device doesn't need to be configured in any specific way to do this.\
    \ The down side of `SRAM` is that if power is lost, the memory contents are lost\
    \ unless there is a battery installed in the system to preserve it. This makes\
    \ it good for run time data however not so good for long term storage. Another\
    \ thing to note regarding `SRAM`, and `RAM` in general, is that it will typically\
    \ power on with arbitrary values contained within it. This is why it is always\
    \ good idea to initialize your variables when they are first declared to ensure\
    \ the value stored there is something reasonable given its purpose. While this\
    \ memory is called static it is not persistent. The name static indicates that\
    \ the memory does not have to be refreshed periodically to retain its data. The\
    \ complimentary memory to static is dynamic memory. Dynamic memory requires that\
    \ a memory controller refresh the data periodically in order to maintain its state.\
    \ I won't get too deep into the details however it should be noted that dynamic\
    \ memory, `DRAM`, circuits are smaller then their SRAM counterparts resulting\
    \ in higher densities and thus cheaper memory. Typically you will find `DRAM`\
    \ in computer systems as the main memory or used in conjunction with video cards\
    \ or other peripherals.\n\nThe other downside to `SRAM` for the Atmel® micro-controllers\
    \ is that is very limited in size. When developing your applications i.e. sketches,\
    \ you will want to ensure that you keep your memory usage fairly conservative.\
    \ In the chapter, [Communications](#part0007_split_002.html_i2c), I created a\
    \ library for an LCD which uses 1024 bytes of `SRAM` to store the current screen\
    \ image. For the Arduino® UNO, this was half of all the memory my board had!\n\
    \n### EEPROM\n\nElectrically erasable programmable read only memory or `EEPROM`\
    \ is a good compromise between flash memory and `SRAM`. Like flash memory, it\
    \ is persistent and can be written to although is fairly slow. Unlike flash memory,\
    \ the `EEPROM` cannot store program code as the micro-controller cannot directly\
    \ execute code stored in `EEPROM`. You could load it from `EEPROM` and place it\
    \ into `SRAM` however that is a bit beyond what I want to cover at this time.\
    \ Like `SRAM`, it doesn't require any special configuration and can be directly\
    \ written to by the application code. This makes the name somewhat a misnomer\
    \ in that it isn't quite read only any longer however in general usage, it will\
    \ be written to in order store configuration or other persistent data that is\
    \ read more often then written to. Typically I would use `EEPROM` memory area\
    \ for storing items such as a serial number, board configuration, or other somewhat\
    \ static data. The Arduino® UNO™ micro-controller has 1K (1024 bytes) of `EEPROM`\
    \ memory available to it. Given the various temperature circuits we have looked\
    \ at, we could use this memory to store the high and low temperature for each\
    \ day throughout a given year. Over time we could see the range of temperatures\
    \ and could offload the data to a computer for further processing.\n\nAs seen\
    \ in previous chapters, the Arduino™ has a rich set of libraries to work with\
    \ various aspects of the micro-controller. For the `EEPROM`, the following library\
    \ is included:\n\n```\n#include <EEPROM.h> \n```\n\nwhich allows us to simply\
    \ write and read to and from the `EEPROM` like most any other memory using a couple\
    \ of provided commands.\n\n```\nbyte dataValue = EEPROM.read(offset);\nEEPROM.write(offset,\
    \ dataValue); \n```\n\nThe only downside with the `EEPROM` library is that you\
    \ must manage the `offset` into the storage area yourself. this however isn't\
    \ a major concern given the amount used is typically low and helper functions\
    \ can be written as I have done in the chapter on [interrupts](#part0006_split_001.html_rotaryencoder).\n\
    \n### I/O Memory\n\nThis is memory or memory like data located external to the\
    \ micro-controller and is accessed by mapping it through the I/O registers. This\
    \ could be done for a number of devices such as an LCD panel or other device that\
    \ has a data bus. Because we are using an Arduino®, I am not going to delve into\
    \ this particular area other than to say it can be used with the Arduino however\
    \ the number of I/O pins required to operate it quickly grows limiting your options.\n\
