- fmt: "\n* 10K digital potentiometer [[18](#part0012_split_001.html_Ref18)]\n\n##\
    \ Tools\n\n* `breadboard`\n* `jumper wires`\n* `voltage meter`\n\n## Schematic\n\
    \n![SPI Digital potentiometer](images/00029.jpeg)\n\n![Creative Commons - Attribution\
    \ - Share Alike](images/00005.jpeg) Image created using: [Fritzing](http://fritzing.org/)\n\
    \n## Software\n\nFor this sketch we will be utilizing the `SPI` bus to communicate\
    \ with a digital potentiometer in order to control the brightness of an LED. We\
    \ will use a transistor to control the current through the LED and will wire the\
    \ digital potentiometer such that it will control the saturation of the transistor\
    \ based on its voltage level which will be programmed. This method of control\
    \ is a little more complicated then using `PWM` however you have the ability of\
    \ controlling a number of different devices with the same communication bus.\n\
    \n```cpp\n /*\n * SpiDigitalPot - the purpose of this sketch is control the brightness\
    \ of an LED\n *                 by configuring a digital potentiometer to set\
    \ the brightness.\n *\n * potCS pin is the pin I am using as the chip select for\
    \ the potentiometer.\n *\n * spi\n *    - spClk - is the pin that the SPI clock\
    \ is configured for\n *    - spiMosi - is the pin that the master device (Arduino)\
    \ transmits data to the slave device\n *    - spiMiso - is the pin that the slave\
    \ device sends data to the master device (Arduino)\n *    - spiCS - is the chip\
    \ select for the SPI circuit in the Arduino\n *            - I could use the spiCS\
    \ chip select also for my POT given I only\n *              I only have one SPI\
    \ device in use at this time.  Various shields will\n *              use specific\
    \ pins as the chip select which most likely will not be pin 10\n *\n * tested\
    \ with MCP4261 digital potentiometer from Microchip\n */\n\n// include the SPI\
    \ library:\n\n#include <SPI.h>\n/* constant defines */\n\nconst int potCS = 6;\n\
    const int spiClk = 13;\nconst int spiMosi = 11;\nconst int spiMiso = 12;\nconst\
    \ int spiCS = 10;\n\n/* Variables for this sketch */\n\nbyte g_potValue = 0;\n\
    \n/*\n * Data structures to send commands to\n * the digital potentiometer\n */\n\
    \n /* The command Byte is the main address/data bits to send to the pot */\n\n\
    typedef struct _CommandByte\n{\n  byte Address:4;  /* the address to select */\n\
    \  byte Command:2;  /* the actual command to send */\n  byte DataBits:2; /* the\
    \ upper data bits */\n} CommandByte;\n\n/* The combination command byte with data\
    \ to send */\n\ntypedef struct _CommandData\n{\n  union\n  {\n  /* The command\
    \ byte as defined above */\n    CommandByte cmd;\n\n     /* The cmd byte in standard\
    \ byte format for easy access */\n    byte cmdByte;\n  } command;\n\n  /* The\
    \ data to be sent with the command as needed. */\n  byte        data;\n} CommandData;\n\
    \n/*\n * Method declarations\n */\n\nvoid UpdatePot(int selectPin, struct _CommandData\
    \ *pData);\nint ReadPot(int selectPin, struct _CommandData *pData);\n\n/*\n *\
    \ UpdatePot - sends commands and data to the potentiometer\n *             which\
    \ is activated by the specified chip select\n *\n * Params\n *  selectPin - the\
    \ pin to use as the select pin\n *  pData     - pointer to the command data stucture\
    \ to be sent\n *\n * Return\n *  none\n */\n\nvoid UpdatePot(int selectPin, struct\
    \ _CommandData *pData)\n{  \n  digitalWrite(selectPin, LOW);\n\n  delay(100);\
    \ // required delay\n\n  SPI.transfer(pData->command.cmdByte);\n  SPI.transfer(pData->data);\n\
    \n  digitalWrite(selectPin, HIGH);\n}\n\n/*\n * ReadPot   - sends commands and\
    \ data to the potentiometer\n *             which is activated by the specified\
    \ chip select\n *\n * Params\n *  selectPin - the pin to use as the select pin\n\
    \ *  pData     - pointer to the command data stucture to be sent\n *\n * Return\n\
    \ *  int       - the value read back from the pot\n */\n\nint ReadPot(int selectPin,\
    \ struct _CommandData *pData)\n{\n  int dataRead = 0;\n\n  digitalWrite(selectPin,\
    \ LOW);\n  delay(100);\n\n  dataRead = SPI.transfer(pData->command.cmdByte) <<\
    \ 8;\n  dataRead |= SPI.transfer(pData->data);\n  digitalWrite(selectPin, HIGH);\n\
    \n  dataRead &= 0x1FF;\n\n  return dataRead;\n}\n\n/*\n * Enumerations for clarity\
    \ of code\n */\n\n/*\n *  This enum is a definition of each address that can\n\
    \ *  be accessed on the potentiometer\n */\n\ntypedef enum\n{\n  Wiper0 = 0,\n\
    \  Wiper1,\n  NVWiper0,\n  NVWiper1,\n  TConReg,\n  StatusReg,\n  Data0,\n  Data1,\n\
    \  Data2,\n  Data3,\n  Data4,\n  Data5,\n  Data6,\n  Data7,\n  Data8,\n  Data9,\n\
    } Addresses;\n\n/*\n *  This enum is a definition of each command that can\n *\
    \  be sent to the potentiometer\n */\n\ntypedef enum\n{\n  WriteData = 0,\n  Increment,\n\
    \  Decrement,\n  Read\n}\n Commands;\n\n/*\n * Setup - main method which will\
    \ be called\n *        Arduino goes through its setup\n *\n * Params - none\n\
    \ *\n * Return - none\n */\n\nvoid setup()\n{\n  Serial.begin(9600);\n\n  pinMode(spiCS,\
    \ OUTPUT);\n  pinMode(potCS, OUTPUT);\n\n  digitalWrite(spiCS, HIGH);\n\n  /*\
    \ Configure SPI */\n  SPI.begin();\n\n  SPI.setBitOrder(MSBFIRST);\n  SPI.setDataMode(SPI_MODE0);\n\
    \  SPI.setClockDivider(SPI_CLOCK16);\n}\n\n/*\n * loop - main method which will\
    \ be called\n *        Arduino goes through its main loop which set\n *      \
    \  the value of the digital potentiometer will\n *        vary the intensity of\
    \ the LED based on the\n *        value written to the potentiometer. The larger\n\
    \ *        the value written to the potentiometer, the dimmer\n *        the LED\
    \ as the transistor saturation is lower.\n * Note: The pot is 9 bits but we are\
    \ only using the lower 8\n *\n * Params - none\n *\n * Return - none\n */\n\n\
    void loop()\n{\n  CommandData command;\n\n  command.command.Command = WriteData;\n\
    \  command.command.Address = Wiper0;\n  command.command.DataBits = 0; // clear\
    \ the upper bit(s)\n  command.data = g_potValue;\n\n  // Send the command to the\
    \ pot updating the value\n  UpdatePot(potCS, &command);\n\n  // Note the current\
    \ value that was sent to the pot\n  Serial.println(g_potValue);\n\n  // Delay\
    \ 250 ms so we can see the changes\n  delay(250);    \n\n  // let it roll\n  g_potValue\
    \ += 25;\n  if (g_potValue > 255) {\n    g_potValue = 0;\n  }\n}\n\n/*\n * Example\
    \ of reading the value\n */\n\n// Configure pot to enable each output\nUpdatePot(potCS,\
    \ &command);\n\n// Read back the tcon register\nint tconValue = ReadPot(potCS,\
    \ &command);\n\nSerial.print(\"TCON: \");\nSerial.println(tconValue);\nSerial.println(\"\
    Setup completed\");\n```\n"
