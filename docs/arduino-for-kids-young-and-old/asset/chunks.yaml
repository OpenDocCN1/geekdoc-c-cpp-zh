  trans: "\n首先要执行的是读取以数字形式表示的当前电压温度值。一旦读取到数值，就可以将其转换格式以供终端用户显示。在上面的代码中，我首先将温度从数字表示转换为实际温度。考虑到\
    \ `LM335` 设计为对 1°开尔文（Kelvin）敏感，即每变化 1 度开尔文就代表 10 毫伏（`mV`），我将它从数字表示转换为摄氏度值。那么，我是如何从开尔文转换为摄氏度的呢？开尔文与摄氏具有相同的刻度，但它从绝对零度开始并在同一刻度上向上延伸。由于绝对零度为\
    \ `-273.0°C`，我只需使用该值将开尔文转换为摄氏度。完成这一步后，我可以使用之前声明的方法之一将摄氏度值转换为华氏度。当我得到所需单位的数值后，就可以就可以将它们打印到串口，以便在我的开发系统上进行验证。\n\
    \n此草程序生成的输出示例如下：\n\n```\n The current temperature is: 26.61C which is 79.90F\n\
    \ The current temperature is: 26.12C which is 79.02F\n The current temperature\
    \ is: 26.12C which is 79.02F\n The current temperature is: 26.12C which is 79.02F\n\
    \ The current temperature is: 28.08C which is 82.54F\n The current temperature\
    \ is: 29.05C which is 84.30F\n The current temperature is: 29.54C which is 85.17F\n\
    \ The current temperature is: 28.56C which is 83.42F\n The current temperature\
    \ is: 28.08C which is 82.54F\n The current temperature is: 27.59C which is 81.66F\
    \ \n```\n\n如你从上述数据所示，我的温度读数在预期范围内，即室温或接近室温（取决于房间等）。此外，你应该注意，我在输出显示期间手指按在了设备上，这就是为什么温度开始上升，并在当我从设备上移开手指后开始下降。我这样做是为了确保电路和代码按预期工作。我唯一没有做的是校准我的温度设备，以确保它读出正确的值。这是通过将温度传感器的\
    \ `ADJ` 引脚连接到电位器，然后微调输入以匹配当前房间温度来实现的。\n\n![LM335 温度传感器电路](img/00019.jpeg)\n\n\
    ![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 图片创建：[Fritzing](http://fritzing.org/)\n\
    \n在上面的电路图中，你可以看到我将一个电位器连接到温度传感器的 `ADJ` 输入端，以便我将其校准到当前的房间温度。虽然这对于我们正在做的事情不是至关重要，但当我们想要使用相同的基础电路以适当的精度水平监控温度时，这种能力将是关重要的。\n\
    \n对于模拟输入，大部分内容已经涵盖了。还有更多细微的细节可以讨论，例如过电压防护、静电等，但作为介绍，我认为我们已经涵盖了基础知识。你可能注意到，在“工具”（tools）下，我提到了电压表，但没有提到何时应该使用。电压表是我在任何事情看起来不对时随手使用的工具之一。为了稳妥起见，我可以使用电压表确保我正确接线了\
    \ `LM335`，并且它测量的电压在我预期的范围内范围内。典型的电压表实际上是万用表，除了测量电压，还可以测量电流和电阻。我的万用表的其中一个功能是连续性检查，我可以通过检查两点并听声音确认它们之间具有连通性，从而确保我的接线正确。因此，虽然我可能会提到电压表或万用表是推荐的工具之一，但我可能不会指示何时使用它。基本上，它是你无论遇到什么情况都应该拥有的工具之一。\n\
    \n### 数字输入\n\n对于数字输入，Arduino® 有许多可用引脚可以实现这一点。当我们说数字输入时，指的是控制器能够将输入的信号识别为 `HIGH`（高电）或\
    \ `LOW`（低电）。对于我们正在看的设备，这等同于零伏（0 伏）代表 `LOW` 值，五伏（5 伏）代表 `HIGH` 值。数字输入需要记住的一点是，触发\
    \ `HIGH` 或 `LOW` 的值并不是精确的。存在一个数值范围，会导致输入变为 `HIGH` 或 `LOW`。数据手册表明，当微控制器由 5v 供电时，`LOW`\
    \ 信号是 `-0.5v` 到 1.5v 之间的任何值。数据手册还表明，当微控制器由 5v 供电时，`HIGH` 信号是 3.0v 到 5.5v 之间的任何值。主要的注意的是，1.5v\
    \ 到 3.0v 之间的任何电压都是未定义的，并且应该避免，以防止意外的程序执行。使用我们的上一个例子，我现在将创建一个电路和草程序，它只有在温度达到特定值（例如\
    \ `80°F`，即 `26.67°C`）时才会触发。\n\n*   Arduino® UNO 运行电压为 5v，因此 `HIGH` 时为 5 伏。其他开发板如\
    \ [Arduino Due](http://arduino.cc/en/Main/Arduino) 运行为 3.3v。\n\n#### 温度比较\n\n\
    首先我们将开发一个在达到特定温度时触发的电路。对于这个电路，我们希望它在 `80°F`（即 `26.67°C`）时触发。根据我们对 `LM335` 的了解，0°C\
    \ 会电压增加 10mV。如果我们将 26.67 除以 100 以进入 10mV 范围，我们的 `LM335` 目标电压将是 2.9967v。奇怪的是，这足以触发我们的数字输入进入\
    \ `HIGH` 值，所需的范围在 3.0v 以上。\n\n##### 所组件\n\n*   Arduino 开发板\n*   4.7K 姆电阻\n*  \
    \ (2) 10K 电位器\n*   `LM335` 温度传感器\n*   `LM311` 电压比较器\n\n##### 工具\n\n*   面包板\n*\
    \   跳线\n*   电压表\n\n##### 原理图\n\n在此原理图中，我们将使用之前的电路，但这次我们将使用电压比较器来比较我们的温度电压和目标电压。如上所述，我们的目标是\
    \ 2.9967v。首先我们需要接线电压分压电路。我们将希望使用一个 4.7K 姆电阻和一个 10K 电位器串联。这将允许我们调整电位器两端的电压到目标电压。为了微调目标电压，我们可以采取两种方法。首先，我们可以使用\
    \ Arduino® 的模拟引脚读取微调电位器上的电压降。这将需要一些代码，但运行良好。另一种选择是使用万用表监测电位器上的电压并根据该读数进行微调。取决于你有的工具，任何一种都可以。此连接将连接到电压比较器。对于电路的另一部分，我们将\
    \ `LM335` 温度传感器连接到电压比较器的另一个输入端，当达到我们的目标电压时，它将触发 `HIGH` 输入。一旦温度冷却，它将降回 `LOW`。\n"
- fmt: "\n![Creative Commons - Attribution - Share Alike](images/00005.jpeg) Image\
    \ created using: [Fritzing](http://fritzing.org/)\n\n## Software\n\nThe following\
    \ is the code that is necessary to monitor the input signal to determine if our\
    \ temperature reading is greater than our set point, and if so, take an appropriate\
    \ action such as turning a fan on.\n\n```cpp\n /*\n  * This circuit is designed\
    \ to toggle between a HIGH signal and a LOW\n  * based on the current temperature\
    \ in the room.  The potentiometer\n  * and the resistor are used to divide the\
    \ 5v signal into two values\n  * giving us the comparison we need to trigger the\
    \ comparator output.\n  * 2.73v is 0°C so to get the comparator to trigger we\
    \ will want\n  * to ensure that there is 2.73v + X across the potentiometer where\n\
    \  * X is the temperature we want to toggle on.\n  * The temperaturePin (now called\
    \ setPointPin) will again read in the \n  * temperature however it will actually\
    \ be the voltage across the \n  * potentiometer so we can use that as our setpoint.\n\
    \  * The temperatureTogglePin will be used to determine if we are above\n  * or\
    \ below our target temperature.\n  */        \n const int setPointPin = 0;\n const\
    \ int temperatureTogglePin = 7;\n const float baseVoltage = 2.730f; /* 2.730V\
    \ at 0°C */\n const float voltageReference = 5.0f;\n const float maxSampleCount\
    \ = 1023.0f;\n const float CtoFConversion = 9.0f / 5.0f;\n const float FtoCConversion\
    \ = 5.0f / 9.0f;\n const float CtoFDelta = 32.0f;\n\n /*\n  * Method declarations\n\
    \  */\n\n float getTemperature(float temperatureVoltage);\n float convertTemperatureToF(float\
    \ temperatureInCelsius);\n float convertTemperatureToC(float temperatureInFahrenheit);\n\
    \n /*\n  * getTemperature - determines the temperature in celsius based on the\n\
    \  *         incoming voltage value assuming 2.73v equals 0°C\n  *\n  * Params\
    \ - temperatureVoltage - the incoming voltage representing the temperature\n \
    \ *\n  * Returns - float - the actual temperature in celsius based on the incoming\
    \ voltage\n  */\n\n float getTemperature(float temperatureVoltage)\n {\n   float\
    \ currentTemperature = 0.0f;\n\n   // From the datasheet, every 10 mv is equal\
    \ to 1 °K - 0°C is 273°K equal to 2.73v\n   // Temperature is scaled by 100 to\
    \ bring it into the celsius scale from kelvin\n   currentTemperature = (temperatureVoltage\
    \ - baseVoltage) * 100;\n\n   return currentTemperature;\n }\n\n /*\n  * convertTemperatureToF\
    \ - converts the temperature from Celsius to Fahrenheit\n  *\n  * Params - temperatureInCelsius\
    \ - the incoming temperature in Celsius\n  *\n  * Returns - float - the temperature\
    \ expressed in Fahrenheit\n  */\n\n float convertTemperatureToF(float temperatureInCelsius)\n\
    \ {\n   float convertedTemperature = 0.0f;\n\n   convertedTemperature = (temperatureInCelsius\
    \ * CtoFConversion) + CtoFDelta;\n\n   return convertedTemperature;\n }\n\n /*\n\
    \  * convertTemperatureToC - converts the temperature from Fahrenheit to Celsius\n\
    \  *\n  * Params - temperatureInCelsius - the incoming temperature in Fahrenheit\n\
    \  *\n  * Returns - float - the temperature expressed in Celsius\n  */\n\n float\
    \ convertTemperatureToC(float temperatureInFahrenheit)\n {\n   float convertedTemperature\
    \ = 0.0f;\n\n   convertedTemperature = (temperatureInFahrenheit - CtoFDelta) *\
    \ FtoCConversion;\n\n   return convertedTemperature;\n }\n\n /*\n  * Setup - main\
    \ configuration point of our sketch to configure\n  *         the Arduino for\
    \ analog input\n  *\n  * Params - none\n  *\n  * Returns - nothing\n  */\n\n void\
    \ setup()\n {\n   pinMode(temperatureTogglePin, INPUT);\n   analogReference(DEFAULT);\n\
    \   Serial.begin(9600);\n }\n\n /*\n  * loop - main method which will be called\
    \ each time the\n  *        Arduino goes through its main loop to read the\n \
    \ *        setPoint temperature value and check our digital\n  *        input\
    \ pin to see if it is high or not.\n  *\n  * Params - none\n  *\n  * Returns -\
    \ nothing\n  */\n\n void loop()\n {\n    int    rawSetPointValue = 0;\n    float\
    \  setPointVoltage = 0.0f;\n    float  temperatureSetPoint = 0.0f;\n\n    // Read\
    \ in the temperature value which will be in a range from 0 to 1023\n    rawSetPointValue\
    \ = analogRead(setPointPin);\n\n    // Convert our incoming voltage representation\
    \ to a value we can utilize\n    setPointVoltage = ((float)rawSetPointValue *\
    \ voltageReference) / maxSampleCount;\n\n    // We now have the current temperature\
    \ expressed in celsius\n    temperatureSetPoint = getTemperature(setPointVoltage);\n\
    \n    // Print out the current temperature in both C and F\n    Serial.print(\"\
    The temperature set point is: \");\n    Serial.print(temperatureSetPoint);\n \
    \   Serial.print(\"C which is \");\n    Serial.print(convertTemperatureToF(temperatureSetPoint));\n\
    \    Serial.println(\"F\");\n\n   if (digitalRead(temperatureTogglePin) == HIGH)\n\
    \   {\n    Serial.println(\"We have reached our set point.\");\n   }\n   else\n\
    \   {\n    Serial.println(\"Set point has not been reached.\");\n   }\n   // Rest\
    \ for a second and check again\n   delay(1000);\n }\n```\n\nThe `setPointPin`\
    \ is `0`.\nThe `temperatureTogglePin` is `7`.\nThe `baseVoltage` is `2.730f`.\n\
    The `voltageReference` is `5.0f`.\nThe `maxSampleCount` is `1023.0f`.\nThe `CtoFConversion`\
    \ is `9.0f / 5.0f`.\nThe `FtoCConversion` is `5.0f / 9.0f`.\nThe `CtoFDelta` is\
    \ `32.0f`.\n\nThe method declarations are:\n- `getTemperature(float temperatureVoltage)`\n\
    - `convertTemperatureToF(float temperatureInCelsius)`\n- `convertTemperatureToC(float\
    \ temperatureInFahrenheit)`\n\nThe `getTemperature` function determines the temperature\
    \ in celsius based on the incoming voltage value assuming `2.73v` equals `0°C`.\
    \ It takes `temperatureVoltage` as a parameter and returns the actual temperature\
    \ in celsius.\n\nThe `convertTemperatureToF` function converts the temperature\
    \ from Celsius to Fahrenheit. It takes `temperatureInCelsius` as a parameter and\
    \ returns the temperature expressed in Fahrenheit.\n\nThe `convertTemperatureToC`\
    \ function converts the temperature from Fahrenheit to Celsius. It takes `temperatureInFahrenheit`\
    \ as a parameter and returns the temperature expressed in Celsius.\n\nThe `setup`\
    \ function configures the Arduino for analog input using `pinMode(temperatureTogglePin,\
    \ INPUT)`, `analogReference(DEFAULT)`, and `Serial.begin(9600)`.\n\nThe `loop`\
    \ function is the main method called each time the Arduino goes through its main\
    \ loop. It reads the `setPoint` temperature value using `analogRead(setPointPin)`,\
    \ converts it to `setPointVoltage`, calculates the `temperatureSetPoint` using\
    \ `getTemperature()`, and prints the results in both Celsius and Fahrenheit. Finally,\
    \ it checks if the `temperatureTogglePin` is `HIGH` using `digitalRead()`.\n"
