    在这个示例中，主要目标只是能够检测到输入触发器——即中断，这表示我们达到了设定值。我们可以通过进一步优化代码来做得更好，即在未触发中断的情况下，不执行任何操作。然而，为了测试，我想监控正在读取的值以确保一切运行符合预期。如上所述，我没有构建电路的后半部分（该部分应在温度下降到特定值以下时触发）。要实现这一点，你可以使用所示的电路，但在这种情况下，你需要针对较低温度对其进行校准，并将中断例程序更改为由
    `FALLING` 下降沿触发。通常情况下，中断的输入为高电平，一旦温度下降到目标值以下，就会变为低电平。


    # 旋转编码器


    在这个项目中，我们将研究如何使用旋转编码器来确定用户相对于信号移动的距离。例如，我可能想使用旋转编码器来调节 LED 的亮度。虽然我可以使用电位器来实现，但考虑到其工作特性，旋转编码器的效果可能更好。此外，我将当前设置存储在板载的
    `EEPROM` 中，以便在启动时恢复该值。这还可以防止在设备关闭期间因移动等导致亮度发生潜在变化的问题。这在电位器上可能会发生，因为它的行程是固定的，即向两个方向只能移动一段距离，并且在设备断电时可以旋转。然而，旋转编码器设计为可以向任意方向连续旋转，因此在设备断电时进行旋转没有影响。`Arduino®`
    只有在通电时对其对其响应。我将配置我的 `Arduino®` 根据来自旋转编码器的输入进行触发，以决定 LED 的亮度。


    ## 所需组件


    * `Arduino®` 开发板

    * (4) 10K 姆电阻

    * (2) 0.01uF 电容器

    * `ALPS STE1207` 旋转编码器

    * 红色 LED


    ## 工具


    * 实验板

    * 跳邦线

    * 电压表


    ## 原理图


    ![旋转编码器触发电路](img/00026.jpeg)


    ![Creative Commons - Attribution - Share Alike](img/00005.jpeg) 图像使用：[Fritzing](http://fritzing.org/)
    创建


    ## 软件


    对于这段代码，我们将配置中断在旋转编码器的一个信号处于激活状态时触发。当这种情况发生时，我们将读取辅助引脚的值，以查看编码器正在旋转的方向。解码器的设计使得其中一个信号会触发，而在触发时，另一个信号将根据旋转方向处于高电平或低电平。因此，其中一个输入触发我们的软件以指示移动，而另一个输入则为我们提供方向。然后我们必须确定接收到了多少信号，以确定用户旋转的圈数。旋转编码器上增加了额外的电路、电阻和电容器，以获得更好的信号完整性。这些信息由旋转编码器制造商提供，通常可以在他们的网站上找到。通常，当我对组件不熟悉时，我会下载制造商的数据表，因为他们通常会提供可以在创建自己的电路时利用的示例电路。

