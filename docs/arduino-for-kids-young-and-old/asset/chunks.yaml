    \ = WriteData;\n  command.command.cmd.Address = Wiper0;\n  command.command.cmd.DataBits\
    \ = 0; // clear the upper bit(s)\n  command.data = g_potValue;\n\n  // Send the\
    \ command to the pot updating the value\n  UpdatePot(potCS, &command);\n\n  //\
    \ Note the current value that was sent to the pot\n  Serial.println(g_potValue);\n\
    \n  // Delay 250 ms so we can see the changes\n  delay(250);    \n\n  // let it\
    \ roll\n  g_potValue += 25;\n} \n```\n\nIn this sketch we have introduced a few\
    \ new things, namely the SPI bus. First I have defined two structures to assist\
    \ in sending data to the potentiometer. The structures are as follows:\n\n```\n\
    \ /* The command Byte is the main address/data bits to send to the pot */\n\n\
    typedef struct _CommandByte\n{\n  byte Address:4;  /* the address to select */\n\
    \  byte Command:2;  /* the actual command to send */\n  byte DataBits:2; /* the\
    \ upper data bits */\n} CommandByte;\n\n/* The combination command byte with data\
    \ to send */\n\ntypedef struct _CommandData\n{\n  union\n  {\n      /* The command\
    \ byte as defined above */\n    CommandByte cmd;\n\n    /* The cmd byte in standard\
    \ byte format for easy access */\n    byte cmdByte;\n  } command;\n\n  /* The\
    \ data to be sent with the command as needed. */\n  byte        data;\n} CommandData;\
    \ \n```"
