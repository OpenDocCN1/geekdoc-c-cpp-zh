    \ Bluetooth to transfer\n  * data between a host system and a target microcontroller.\n\
    \  */\n\n#include <stdio.h>            // `sprintf`\n#include <EEPROM.h>     \
    \      // storage of connection data\n#include <SoftwareSerial.h>   // communication\
    \ between BT module and arduino\n#include <btmodule.h>         // arduino library\
    \ for communicating with the SeeedStudio BT module\n\n// Status pin for onboard\
    \ led\n\n#define BT_CONNECTED_STATUS_PIN  13\n\n// The BT shield can use two digital\
    \ pins for the serial communications from D0 - D7\n\n#define BT_COMM_SPEED 38400\n\
    #define BT_PIN_CODE 1234\n#define BT_RX_PIN 6\n#define BT_TX_PIN 7\n\n#define\
    \ BT_CONNECTED_PIN 1 // analog pin\n\n// EEPROM SIGNATURE\n\nconst long signature\
    \ = 0xACED; // some non-arbritary value\n\n#define MAX_BT_ADDRESS 32\n\n/* Structures\
    \ used in this sketch */\n\ntypedef struct\n{\n  long signature;             \
    \     // data is only valid when 0xACED is stored here.\n  int valid;        \
    \               // 0 if not valid, non-zero if valid\n  byte bt_address[MAX_BT_ADDRESS];\
    \ // bluetooth address of previously discovered device(s)\n} EE_Structure;\n\n\
    // State machine for bluetooth communications\n\nenum StateMachine\n{\n  Initialize\
    \ = 0, // if we store the device addr, we can jump to connecting\n  RestoreDeviceAddress,\n\
    \  DiscoveringDevice,\n  DeviceDiscovered, // once discovered, we can reconnect\
    \ without all of the setup\n  ConnectingToDevice,\n  ActiveCommunications,\n \
    \ ErrorState,\n  EndStates\n};\n\n/*\n * Method declarations\n */\n\nint ReadInteger(int\
    \ offset);\nvoid WriteInteger(int offset, int value);\nlong ReadLong(int offset);\n\
    void WriteLong(int offset, long value);\nvoid ReadBytes(int offset, byte *data);\n\
    void WriteBytes(int offset, byte *data);\n\n/*\n * ReadInteger - a helper function\
    \ to read in an integer from the nonvolatile storage\n *\n * Params - offset -\
    \ the offset into the EEPROM where data is stored\n *\n * Returns - int - the\
    \ value read from the specified location\n */\n\nint ReadInteger(int offset)\n\
    {\n  int returnValue = 0;\n\n  // Read in EEPROM\n  for (int count = 0; count\
    \ < sizeof(int); count++)\n  {\n    returnValue |= EEPROM.read(offset + count)\
    \ << (count * 8); // read in a byte from eeprom and shift it x to build up an\
    \ integer of data\n  }\n\n  return returnValue;\n}\n\n/*\n * WriteInteger - a\
    \ helper function to write in an integer to the nonvolatile storage\n *\n * Params\
    \ - offset - the offset into the EEPROM where data is to be stored\n *       \
    \ - value - the value to be stored\n *\n * Returns - none\n */\n\nvoid WriteInteger(int\
    \ offset, int value)\n{\n  byte dataValue = 0;\n  byte intSize = sizeof(int);\n\
    \n  for (int count = 0; count < intSize; count++)\n  {\n    dataValue = value\
    \ >> ((intSize - 1 - count) * 8); // We need to shift from left to right so upper\
    \ first then on down\n    EEPROM.write(offset + count, dataValue);\n  }\n}\n\n\
    /*\n * ReadLong - a helper function to read in a long from the nonvolatile storage\n\
    \ *\n * Params - offset - the offset into the EEPROM where data is stored\n *\n\
    \ * Returns - long - the value read from the specified location\n */\n\nlong ReadLong(int\
    \ offset)\n{\n  long value = 0;\n\n  int storedValue = ReadInteger(offset);\n\n\
    \  value = (storedValue << 16);\n\n  storedValue = ReadInteger(offset + 2);\n\n\
    \  value += storedValue;\n\n  return value;\n}\n\n/*\n * WriteInteger - a helper\
    \ function to write in a long to the nonvolatile storage\n *\n * Params - offset\
    \ - the offset into the EEPROM where data is to be stored\n *        - value -\
    \ the value to be stored\n *\n * Returns - none\n */\n\nvoid WriteLong(int offset,\
    \ long value)\n{\n  int upperValue = (value >> 16);\n  int lowerValue = value\
    \ & 0xFFFF;\n\n  WriteInteger(offset, upperValue);\n  WriteInteger(offset + 2,\
    \ lowerValue);\n}\n\n/*\n * ReadBytes - a helper function to read in a number\
    \ of bytes from the nonvolatile storage\n *\n * Params - offset - the offset into\
    \ the EEPROM where data is stored\n *        - data - the array to hold the data\
    \ being read in\n *        - maxLength - the maximum length to read\n *\n * Returns\
    \ - none\n */\n\nvoid ReadBytes(int offset, byte *data, int maxLength)\n{\n  if\
    \ (data != NULL)\n  {\n    for (int index = 0; index < maxLength; index++)\n \
    \   {\n      data[index] = EEPROM.read(offset + index);\n    }\n  }\n}\n\n/*\n\
    \ * WriteBytes - a helper function to write out a number of bytes to the nonvolatile\
    \ storage\n *\n * Params - offset - the offset into the EEPROM where data is to\
    \ be stored\n *        - data - the array of bytes to be stored\n *        - length\
    \ - the length of the data to write\n * Returns - none\n */\n\nvoid WriteBytes(int\
    \ offset, byte *data, int length)\n{\n  if (data != NULL)\n  {\n    for (int index\
    \ = 0; index < length; index++)\n    {\n      EEPROM.write(offset + index, data[index]);\n\
    \    }\n  }\n}\n\n/*\n * Variables used by this sketch */\n\nvolatile EE_Structure\
    \ StoredData;\nStateMachine connectionState;\n\n/*\n * Setup - main setup for\
    \ the bluetooth module\n */\n\nvoid setup()\n{\n  Serial.begin(9600);\n\n  Serial.println(\"\
    Starting setup...\");\n\n  BTModule::begin(BT_SPEED, true); // do not block\n\n\
    \  digitalWrite(BT_CONNECTED_STATUS_PIN, LOW); // turn off when not connected\n\
    \n  connectionState = Initialize;\n}\n\n/*\n * Loop - the main loop which runs\
    \ state machine and progresses\n * through state\n */\n\nvoid loop()\n{\n  char\
    \ *pRemoteAddress = NULL;\n\n  switch (connectionState)\n  {\n    case Initialize:\n\
    \    {\n      Serial.println(\"Initializing device...\");\n      digitalWrite(BT_CONNECTED_STATUS_PIN,\
    \ LOW); // we need not connected\n\n      connectionState = RestoreDeviceAddress;\n\
    \    }\n    break;\n\n    case RestoreDeviceAddress:\n    {\n      if (StoredData.valid\
    \ != 0)\n      {\n        pRemoteAddress = (char *)StoredData.bt_address;\n  \
    \      connectionState = DeviceDiscovered;\n      }\n      else\n      {\n   \
    \     pRemoteAddress = NULL;\n        connectionState = DiscoveringDevice;\n \
    \     }\n    }\n    break;\n\n    case DiscoveringDevice:\n    {\n      Serial.println(\"\
    Discovering devices...\");\n\n      // discover our device, do not block, we will\
    \ come back to try again\n      if (BTModule::discoverDevice(false) == true)\n\
    \      {\n        connectionState = DeviceDiscovered;\n      }\n    }\n    break;\n\
    \n    case DeviceDiscovered:\n    {\n      Serial.println(\"Connecting to device...\"\
    );\n      if (BTModule::connectToDevice(pRemoteAddress, true) == true)\n     \
    \ {\n        connectionState = ActiveCommunications;\n        digitalWrite(BT_CONNECTED_STATUS_PIN,\
    \ HIGH); // we have a connection\n\n        // Update eeprom data\n        if\
    \ (StoredData.valid == 0)\n        {\n          WriteInteger((char *)&StoredData.valid\
    \ - (char *)&StoredData.signature, 1); // it is now valid\n          BTModule::getRemoteAddress((char\
    \ *)&StoredData.bt_address);\n          WriteBytes((char *)&StoredData.bt_address\
    \ - (char *)&StoredData.signature, (byte *)&StoredData.bt_address, MAX_BT_ADDRESS);\n\
    \        }\n      }\n    }\n    break;\n\n    case ActiveCommunications:\n   \
    \ {\n      char dataValue = 0;\n\n      if (Serial.available())\n      {\n   \
    \     BTModule::sendByte(Serial.read());\n      }\n\n      if (BTModule::readByte(&dataValue)\
    \ == true)\n      {\n        Serial.print(dataValue);\n      }\n    }\n    break;\n\
    \n    case ErrorState:\n    {\n      // Reset and come back up\n      connectionState\
    \ = DeviceDiscovered;\n    }\n    break;\n  }\n}\n```\n"
