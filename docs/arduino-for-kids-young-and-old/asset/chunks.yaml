    # The Arduino® Platform


    ## What it is


    The Arduino® package is a cost effective, easy to use, prototyping board which
    can be enhanced to do many tasks. The micro-controller that this board utilizes
    has been created with a number of general purpose input and output (`GPIO`) pins.
    These `GPIO` pins have many functions that you can utilize to create a number
    of designs. While the controller and overall design are fairly simple in todays
    terms, the community that has developed around the platform is where it really
    shines. With a simple internet search you can find a number of forums and stores
    promoting and selling various products to enhance your Arduino®, from Ethernet
    port shields to LCD shields to a number of other''s in between. Considering all
    of these expansion options are readily available, the Arduino® becomes a very
    useful micro-controller. In this book I will focus on the abilities of one of
    the Arduino® boards, the Arduino® UNO. It does everything that we need and is
    based on a 5 volt system which can be used with a variety of external devices.
    This will also limit the discussion to one of the more popular Atmel® AVR micro-controllers,
    the `ATmega328`.[[4](#part0012_split_001.html_Ref4)]


    ## What it isn''t

