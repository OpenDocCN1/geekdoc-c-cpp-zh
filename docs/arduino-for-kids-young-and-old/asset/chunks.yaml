    \ as an end user, can make your own libraries of routines that you use a lot to\
    \ limit the amount of coding that you need to do. The temperature conversion functions\
    \ that we used previously would be good candidates for a library as we will probably\
    \ use them again from time to time and we probably will not want to have to retype\
