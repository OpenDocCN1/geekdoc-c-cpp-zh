    在我们的草图主循环中，我更改了一些变量的名称以更好地描述它们的功能。我还添加了代码来读取温度切换引脚的状态，以判断我们是否已经达到了设定点。这是通过调用命名恰当的
    `digitalRead` 方法实现的。该方法接受一个参数，即要读取的引脚值。它将根据设备输入引脚处读取到的电压返回 `HIGH` 或 `LOW` 值。目前，我只是简单地显示我们是否已经达到了设定点。以后，我们可以采取额外的行动，利用这些信息做一些更有用的事情。稍后在处理中断时，我们还会查看另一种形式的数字输入。


    ## 总结


    Arduino® 提供了用于读取模拟数据和数字数据的引脚。模拟数据可以是任何信号，例如温度读数、光敏电阻或任何根据环境刺激提供范围值的此类项目。数字输入可用于判断按钮按下、开启和关闭状态以及其他二进制类型的数据。通过结合这两种类型的输入，我们可以监控我们周围的世界，并允许我们在事件发生时做出反应。


    ![章节结束图形](img/00001.jpeg)


    # 输出


    ## 有进必有出


    之前我们查看了 Arduino® 可以处理的一些输入。现在我们将查看它的另一面，即输出。那么，Arduino® 可以输出什么样的信号呢？以下是它们的总结。


    - **模拟**：根据微控制器内部输出的配置方式而变化的变量值。

    - **数字**：可以是 `HIGH` 或 `LOW` 的信号。

    - **定时器**：当定时器达到某个特定点时，生成的信号（`HIGH` 或 `LOW`）。


    * 我们在 Arduino® 上使用的 Atmel® 微控制器实际上并不输出真正的模拟信号，而是使用一种名为脉宽调制（PWM）的特性来创建模拟输出值。对于真正的模拟输出，我们需要连接一个数字模拟转换器
    [DAC](http://en.wikipedia.org/wiki/Digital-to-analog_converter) 来为我们完成转换。还要注意，虽然我们使用的微控制器没有内置
    DAC，但其他微控制器具有此功能，例如位于 Arduin® Due 上的微控制器。


    ### 模拟输出


    Arduino® UNO 支持 PWM 形式的模拟输出。这并不是真正的模拟输出，而更像是信号的百分比，信号在一段时间内的部分时间内保持 `HIGH`，其余时间保持
    `LOW`。对于 Arduino® UNO 上的 Atmel® 芯片，有两种 PWM 形式：快速 PWM 和相位频率 PWM。通常，快速 PWM 看起来像锯齿波，输出从起始值零（`0`）上升到峰值，然后突然掉回零（`0`）。相位频率
    PWM 也会像快速 PWM 那样上升，但它会从峰值开始向下计数回到零（`0`），而不是直接下降，从而产生更好的输出波形。该输出通过比较器电路，使其在输出端更像是一个方波。对于我们将遇到的许多设备，这种输出是可以接受的，但最好注意它不是
    DAC 所提供的那种真正的模拟输出。


    Arduino® 将某些模拟输出与数字输出结合在相同的引脚上，这就是为什么在设计初期就相应进行规划是一个非常好的主意，以尽可能地减少设计后期可能出现的问题。这背后的原因是
    Atmel® 微控制器在很小的封装中集成了大量的功能。结果的封装到外部世界的物理引脚数量有限，导致某些功能之间存在重叠。在大多数情况下，如果你使用微控制器执行特定任务，这不会成为问题。当你开始涉及更复杂的设计时，你可能会发现这些功能的重叠变成一个你必须以某种方式去克服的障碍。


    那么，这种模拟输出有什么用呢？通常来说，这是一个很好的输出，可以用于驱动 LED、电机、舵机以及许多其他项目的亮度。对于 LED，在某些实现中，输出信号保持
    `HIGH` 的时间长度与 LED 的亮度相关。这对于基本电机也是同样的，输出信号保持 `HIGH` 的时间长度翻译为电机的运行速度。对于舵机，输出信号保持
    `HIGH` 的时间长度可能与舵机转动的方向相关。所有这些都是有用的应用，我们将在后续的学习中更详细地研究。


    ### 脉宽调制 - LED


    第一个项目将读取温度值，然后打开一个三色 LED，以视觉化的方式表示温度。为了做到这一点，我们需要重用之前带有 LM335 的电路来测量当前温度，然后为其添加一个三色
    LED 来表示该温度值。对于我们将要使用的三色 LED，它不带有任何 PWM 支持，因此我们将使用一些 Arduino® PWM 输出来实现这一点。在互联网上可以找到一些内置
    PWM 支持的长条 LED 灯带。这些可以通过其他方式（如 SPI）进行接口，我们将在通信 4.7K 欧姆电阻

    * (3) 470 欧姆电阻

    * (3) 2N2222(A) 三极管

    * LM335 温度传感器[7] 或类似的如 NTE7225[8]

    * 三色 LED


    零件列表包含了温度读取电路所需的零件，以及用于此项目的额外组件零件。


    ##### 工具


    * 面板

    * 跳线线

    * 电压表

    * 罐空气

    * 吹风机或热枪


    我将罐空气和吹风机添加到上述列表的部分，因为它们可以快速冷却或加热温度传感器。它们不是必须的，但很方便。


    ##### 电路图


    在这个电路中，你需要将来自 Arduino® 的地和 +5v 信号连接到三色 LED。每个 LED 连接将使用一个串联的 NPN 三极管来控制通过 LED
    的电流。每个三极管由基极、集极和发射极组成。每个三极管的集极将连接到每个颜色的 LED 引脚。每个三极管的基极将连接到 Arduino 的 PWM 输出，用于调节所连接
    LED 的强度。4.7K 电阻将串联在 Arduino 输出和三极管基极之间。最后，每个三极管的发射极将通过 470 欧姆电阻连接到地。对于这里的温度输入端，我们将再次利用上一章中创建的电路
    温度读取，使用模拟输入读取温度。


    ![三色 LED 电路图](img/00021.jpeg)


    ![知识共享 - 署名-相同共享](img/00005.jpeg) 图像创建自：[Fritzing](http://fritz.org/)


    ##### 软件


    以下代码包含了温度传感器的模拟读取，并添加了驱动 LED 的代码。


