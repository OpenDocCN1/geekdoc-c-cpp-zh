- fmt: "\n```\n void loop()\n{\n  /*\n   * Grab the current millis to see if our target\
    \ delta has been reached\n   */\n  unsigned long currentCycle = millis(); \n \
    \ unsigned long delta = currentCycle - lastCycle;\n\n  // If we have passed our\
    \ update frequency, update and start again\n  if (delta > updateFrequency)\n \
    \ {\n    //--------------------------------------------\n    // Have my seconds\
    \ (in milliseconds)\n    // convert to RPM's i.e. rotations per minute\n    //\n\
    \    // I am using floats to be more accurate\n    //--------------------------------------------\n\
    \    float variableRate = ((float)delta / 1000.0f) * 60;\n\n    unsigned long\
    \ currentSpeed = (speedCount * (variableRate)) / fanBlades;\n\n    // Reset our\
    \ speed count and make our current cycle the last cycle\n    lastCycle = currentCycle;\n\
    \    speedCount = 0;\n\n    //--------------------------------------------\n \
    \   // Write out the current speed once we have reset our values above\n    //\
    \ this is because the interrupt will be be running while we\n    // are taking\
    \ care of calculating the RPM's\n    //--------------------------------------------\n\
    \    Serial.print(\"Current speed is: \");\n    Serial.print(currentSpeed);\n\
    \    Serial.print(\"\\n\");\n  }\n} \n```\n\nThis sketch is fairly straight forward\
    \ with the primary feature being the interrupt routine. This routine is where\
    \ we keep track of the number of times the fan blades have triggered the interrupt\
    \ pin. The bulk of the work is done in the main loop where we determine the number\
    \ of times the interrupt has been triggered per second and convert the values\
    \ into an RPM value. To do this, I get the current millisecond count by calling\
    \ the function `millis()`. This returns an `unsigned long` value representing\
    \ the number of milliseconds that have elapsed since the Arduino® was powered\
    \ on. I do this so that I can compare it withe value I read the previous time\
    \ through the `loop` function. Once I reach a `delta` i.e. time span greater than\
    \ my `updateFrequency`, I will determine the speed that the fan is rotating at\
    \ by multiplying the number of times that the fan blocked the infrared emitter.\
    \ Because the fan has multiple blades, I must factor that into my equation. While\
    \ I tried to ensure that I only did this once per second, I can never be sure\
    \ how often my `loop` function will be called. Given that, I assigned the variable\
    \ `variableRate` a value representing my actual time delta divided by `1000.0f`\
    \ which is how many milliseconds in one second. I then multiplied by sixty (60)\
    \ in order to convert the value to minutes from seconds. Once done with that I\
    \ could take the total times that the fan blocked the infrared emitter and multiple\
    \ it by amount of time that passed along with dividing the value by the number\
    \ of blades on the fan to get a final rotations per minute (RPM) value. In converting\
    \ the value from floating point to `unsigned long` integer, I will be losing some\
    \ precision however for the purpose of this sketch it should be fine.\n\n### Summary\n\
    \nIn this chapter I looked at interrupts and how to be more reactive to external\
    \ events opposed to polling. Polling is very time consuming and depending on what\
    \ is going on, could result in missed events. Interrupts alleviate this by making\
    \ your design able to react when an event occurs. The downside is that you must\
    \ be careful that what you do in the interrupt doesn't conflict with what you\
    \ are doing in your main application loop. It is also wise to ensure that the\
    \ actual interrupt routine be fairly quick and not prevent the system from doing\
    \ what it needs to do.\n\n![chapter end graphic](images/00001.jpeg)\n\n# Communications\n\
    \n## Talking to the outside world one protocol at a time\n\nCommunication can\
    \ take a number of forms, from simple speech, to visual indications such as traffic\
    \ lights, to complex protocols between sophisticated devices. In this chapter\
    \ we are going to explore the protocols used to communicate between sophisticated\
    \ devices. Our Arduino® will be one end of the communication channel while various\
    \ devices and machines will be the other end communicating with the Arduino®.\n\
    \n### Serial Port (RS-232)\n\nIn past chapters, we have looked at the initial\
    \ communications between the Arduino® and a host computer using the `COMM Port`.\
    \ This port has been used for a number of different applications, from keyboards\
    \ to mice to a whole array of disparate devices. A typical RS-232 communication\
    \ port will utilize the following signals:\n\n| Signal Name | Purpose | DB-9 Pinout\
    \ | DB-25 Pinout |\n| :--- | :--- | :--- | :--- |\n| Rx | Receive data from the\
    \ sending device | 2 | 2 |\n| Tx | Transmit data to the sending device | 3 | 3\
    \ |\n| Gnd | Common ground between the two devices | 5 | 7 |\n\nWhile the standard\
    \ communications between the Arduino® and the host computer is a valid use case\
    \ and important in order for us to debug our sketches, I want to explore other\
    \ applications for which it can be used for. In this case, I happen to have a\
    \ Bluetooth® shield that uses serial communications between the Arduino® and itself.\
    \ Depending on which Arduino® module that you are using, you can use either a\
    \ hardware serial port or a software serial port. The software serial port is\
    \ designed to mimic the real hardware serial ports allowing you more flexibility\
    \ as to which pins of your Arduino® are used. The downside is that it is an emulation\
    \ and can be subject to anomalies and can be somewhat slower. Overall though,\
    \ using a software serial port should be transparent to your sketch and the micro-controller\
    \ for the most part. The shield I am using is from [Seeed Studio](http://www.seeedstudio.com/depot/Bluetooth-Shield-p-866.html?cPath=19_21)\
    \ and is flexible in that it can act as both a master device or a slave device.\
    \ The other nice feature is that it can use any digital pins to allow the system\
    \ interface.\n\nCare has to be taken when using the hardware communication port(s)\
    \ in your own projects as the first serial port is also used for the USB to your\
    \ computer. When you utilize the `Serial` class of functionality, the data sent\
    \ and received travels over this hardware port to your host system.\n\n| Arduino®\
    \ | Serial 0 | Serial 1 | Serial 2 | Serial 3 |\n| :--- | :--- | :--- | :--- |\
    \ :--- |\n| UNO R3 | 0 (RX), 1 (TX) | N/A | N/A | N/A |\n| Leonardo | USB (CDC)\
    \ | 0 (RX), 1 (TX) | N/A | N/A |\n| DUE | 0 (RX), 1 (TX) | 19 (RX), 18 (TX) |\
    \ 17 (RX), 16 (TX) | 15 (RX), 14 (TX) |\n| YUN | USB (CDC) | 0 (RX), 1 (TX) |\
    \ N/A | N/A |\n| MEGA 2560 | 0 (RX), 1 (TX) | 19 (RX), 18 (TX) | 17 (RX), 16 (TX)\
    \ | 15 (RX), 14 (TX) |\n\nThere are a number of other Arduino® or compatible boards\
    \ available not listed however most of them are based off of one of the above\
    \ listed boards and, in most cases, will have very similar features i.e. the number\
    \ of serial ports and the pins they are on.\n\nWith that all out of the way, lets\
    \ look at some code to communicate with the Bluetooth® shield. For this sketch,\
    \ I will be communicating with the shield using pins six (6) and seven (7). The\
    \ Bluetooth® shield will be acting as the master device and connecting to another\
    \ device which will be the slave. For this example, I will be communicating with\
    \ an [OBDII Interface](http://en.wikipedia.org/wiki/On-board_diagnostics) to look\
    \ at diagnostic codes on my vehicle.\n\n#### Required Components\n\n*   Arduino®\
    \ Board\n\n*   Seeed Studio Bluetooth shield[[16](#part0012_split_001.html_Ref16)]\n\
    \n*   Generic OBDII Connector[[17](#part0012_split_001.html_Ref17)]\n\n#### Tools\n\
    \nNone.\n\n#### Software\n\nThe following code demonstrates communicating with\
    \ a Bluetooth® shield and then using that device to communicate with a remote\
    \ device to send and receive data.\n"
