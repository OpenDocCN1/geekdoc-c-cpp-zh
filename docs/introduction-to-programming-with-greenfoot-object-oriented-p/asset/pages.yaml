    will open the editor, highlight the line, and display a message at the bottom
    of the editor window. This message attempts to explain the error. The messages,
    however, vary considerably in their accuracy and usefulness. Sometimes they tell
    us fairly cryptic and hard to understand. The line that is highlighted is the
    line where the problem is, but sometimes it is the line after the problem. When
    you see, for example, a "expected" message, it is possible that the semicolon
    is in fact missing on one the highlighted line.


