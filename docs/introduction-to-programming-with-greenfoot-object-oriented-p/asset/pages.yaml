  md: 'The List type, however, is different from other types we have seen before.
    The documentation shows at the top


    ```

    Interface List<E>

    ```


    Apart from the word interface in place of class, we notice another new notation:
    the <E> after the type name.


    Formally, this is called a generic type. This means that the type List needs an
    additional type specified as a parameter. This second type specifies the type
    of the elements held within the list.


    For example, if we are dealing with a list of strings, we would specify the type
    as


    ```

    List<String>

    ```


    If, instead, we are dealing with a list of actors, we can write


    ```

    List<Actor>

    ```


    In each case, the element type within the angle brackets (<>) is the type of some
    other known kind of object.


