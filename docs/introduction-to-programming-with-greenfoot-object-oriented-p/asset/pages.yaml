    # Summary


    Being able to produce sounds and images is a very valuable skill for producing
    good games, simulations, and other graphical applications. Knowing about sound
    and image file formats is important to make good choices about trade-offs between
    file size and quality.


    Sounds can be recorded directly in Greenfoot, or recorded and edited with a variety
    of sound recording programs. Various parameters determine the sound quality and
    file size. For Greenfoot scenarios, we usually use WAV format with fairly low
    quality.


    Images can also be saved in a variety of different formats. Different formats
    vary in how well they compress files, how well they preserve image quality, and
    how they handle transparency. JPEG and PNG are the formats most used for Greenfoot


    By combining images from a file with dynamic image operations, such as scaling
    and transparency changes, we can achieve attractive visual effects in our scenarios.'
