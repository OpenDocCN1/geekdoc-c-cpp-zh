  md: 'Publishing scenarios to the Greenfoot site can be a good way to get feedback
    from other users: comments on what works and doesn''t, suggestions that you could
    add to the program. The Greenfoot site is also a good place to get ideas for further
    functionality, or to learn how to do things. It includes a discussion section
    where you can ask and answer questions, and discuss programming techniques and
    ideas. Or you can look for scenarios with source code, download the source, and
    check how other programmers have implemented their classes.


    # 11.3 Export to a Web page


    The second option is to export your scenario to your own Web page (Figure 11.2).
    You can choose a location and a name for your export, and Greenfoot will create
    a folder with your chosen name. In this folder, Greenfoot creates a Web page (in
    HTML format) and converts your scenario to an applet that will run in that Web
    page. An applet is a version of your Java program that can run embedded in a Web
    browser.


    You can execute your scenario by opening the generated Web page in a Web browser.


    Initially, this Web page will be usable only on your own computer. If you want
    to include it in a Web page visible by others, you need to have access to a Web
    server somewhere to publish it.


    “Lock scenario” option disables the moving of actors in the world before starting
    the application, as well as removing the Act button and the execution speed slider.
    If you have a game, you typically want to lock the scenario, whereas for simulations
    or other experimental scenarios you may want to leave it unlocked to allow users
    to experiment more.


