  md: '# Chapter 13 ■ Additional scenario ideas


    Figure 13.1

    nThe Marbles game


    ![](img/410f5f709c4688c1903940c91e75e8ab_259_0.png)


    Marbles uses a nice-looking background image (the game board and scroll for the
    text display) and actors with semitransparent drop shadows (the marbles and the
    obstacles).


    The other interesting aspect to examine is the collision detection. The marbles
    do not use any of the built-in Greenfoot collision detection methods since these
    all work on the rectangular actor images. The marbles, on the other hand, are
    round, and we need precise collision for this.


    Likely, when the actors are round, this is not very difficult. Two marbles collide
    if their distance (measured from their center points) is less than their diameter.
    We know the diameter, and the distance is fairly easy to compute (using the Pythagoras
    theorem).


    The next interesting thing is the way the new movement direction of a colliding
    marble is computed. There is a little trigonometry involved here, but if you are
    familiar with that, it is not too hard.


    Collisions with the fixed obstacles are easier, since they are always horizontally
    or vertically oriented rectangles. Therefore, a marble hitting one of these obstacles
    reverses its direction along one of the axes (x or y).


    You could reuse the marble collision logic for all sorts of other games that involve
    round objects colliding.'
