  md: '![](img/410f5f709c4688c1903940c91e75e8ab_169_0.png)


    This tells us that the distance is the square root of $dx$ squared $dy$ squared.
    In our code (Code 8.6), we use a method called sqrt from the Math class to calculate
    the square root. (Math is a class in java.lang, and thus automatically imported.)


    **Exercise 8.27** Look up the class **Math** in the Java documentation. How many
