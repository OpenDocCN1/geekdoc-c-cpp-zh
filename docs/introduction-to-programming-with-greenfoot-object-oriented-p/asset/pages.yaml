    # Helper classes: SmoothMover and Vector


    In this scenario, we are using two purpose helper classes: SmoothMover and Vector.
    These are classes that add functionality to a given scenario, and can be used
    in different scenarios for similar purposes. (These two classes are fact used
    in a number of existing projects.)


    The SmoothMover class provides smoother movement for actors by storing the coordinates
    as decimal numbers (of type double), rather than integers. Fields of type double
    can store numbers with decimal fractions (such as 2.4567), and thus are more precise
    than integers.


    For displaying the actor on screen, the coordinates will still be rounded to integers,
    since the location for painting on screen must always be a whole pixel. Internally,
    ever, the location is held as a decimal number.'
