    # 10.6 More control: the GreenfootSound class


    So far our interaction with sound was very simple: we played a sound file. This
    is sufficient for short sound effects, and the Greenfoot sound method is an easy
    way to do this.


    Sometimes, however, we need more control over sound. When we have background music,
    or if we want to create an MP3 player, we need the ability to start and stop sounds,
    to change the volume, and so forth. Greenfoot has a separate class for this: the
    Greenfoot class.


    **Exercise 10.25** Find the documentation for the GreenfootSound class in the
    Greenfoot class documentation. Study it. What is the range of accepted values
    for setting the volume?


    **Exercise 10.26** Modify your code so that it uses a GreenfootSound object for
    the sound. This sound object should be created in your actor''s constructor, and
    stored in an instance variable. Then, when you click on the actor, it should play
    this sound.


    **Exercise 10.27** Modify your code again, so it starts playing your sound effect
    in a loop when you click on your actor, and pauses the sound when you click again.
    You can then play and pause the sound repeatedly by clicking on the actor several
    times.'
