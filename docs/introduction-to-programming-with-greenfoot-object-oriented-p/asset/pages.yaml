    image expects a parameter of type GreenfootImage. This is the method we shall
    use to create a GreenfootImage object from image file as described above and assign
    it to a variable of type GreenfootImage. Then we use the actor''s setImage method
    to it for the actor. Here is a code snippet to do this:


    To set the image back to the original image, we write:


    ```

    GreenfootImage image1 = new GreenfootImage("crab.png");

    setImage(image1);

    ```


    This creates the objects from the named image files (crab.png and crab2.png) and
    assigns them to the image1 and image2 variables. Then we use these variables to
    set our new image as the actor''s image. To create the animation effect, we have
