    # The List type


    Dealing with collections of objects is important both in Greenfoot programming
    and in programming in general. Several of the Greenfoot methods return collections
    of objects as their result, usually in the form of a list. The type of the returned
    object then is the List type from the java.util package.


    > Side Note: Interfaces


    The List type is a little different from other object types we have seen: It is
    not a class, but an interface. Interfaces are a Java construct that provides abstraction
    over possible implementation classes. The details are not important to us right
    now—it is sufficient to know that we can deal with the List type in similar ways
    as with other types: We can look it up in the Java Library Documentation, and
    we can call the methods on the object. We cannot, create objects directly of type
    List. We will come back to this later.


    ![](img/410f5f709c4688c1903940c91e75e8ab_150_1.png)


