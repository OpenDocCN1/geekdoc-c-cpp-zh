  md: '# 5.8 Variable speed


    To create more interesting looking movement (and more interesting gameplay), we
    want to make the movement speed of the bacteria variable. Currently, the speed
    is 2 (bacteria) move two cells per act cycle. We want to change this so that the
    movement speed is a random value between 1 and 3.


    To this, we will create a variable for the speed, initialize it to an appropriate
    random value, and use it in our movement statement.


    **Exercise 5.18** In your Bacteria class, add an instance variable of type **int**,
    named speed.


    **Exercise 5.19** In the Bacteria constructor, assign a random value to the speed
    variable, in the range 1 to 3.


    You may wonder how to set a random range of 1 to 3, when we have previously learned
    that random numbers coming from Greenfoot''s getRandomNumber method always start
    at 0. The answer is simple: Get a number from 0 to 2, and then add 1:


    ```

    speed = Greenfoot.getRandomNumber(3) + 1;

    ```


    Adding 1 is important, because we never want a speed of 0—the bacterium would
    never move away.


    **Exercise 5.20** Change the movement statement in your **act** method so that
    you subtract the variable **speed** from your x-coordinate, instead of subtracting
    2. Test.


    This is all that is needed. Each bacterium now gets its own speed assigned when
    it is created, between one and three, and will move at that speed. Watch carefully,
    and you will see some bacteria moving faster than others.


