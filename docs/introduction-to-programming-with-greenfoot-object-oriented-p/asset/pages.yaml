    a score counter, but it is not being used yet. The counter is defined in class
    Counter, and a counter object is being created in the Space class.


    To make the score working, you will have to do roughly the following: Add a method
    to the Space class named something like highScore. This method should add a score
    to the counter. Call this new method from the Asteroid class whenever an asteroid
