  md: '# 6.5 Using loops: the while loop


    **Exercise 6.16** How you change your code so that the keys do not all appear
    at exactly the same place? Can you change your code so that they get placed exactly
    next to each other?


    The reason the keys all appeared on top of each other is that we inserted them
    all at the fixed location 300,140 into the world. We now want to insert every
    key at a different location. This is now actually quite easy to do: we can make
    use of our loop variable *i* to achieve this.


    **Exercise 6.17** How many times does our loop body execute? What are the values
    of *i* during each of the executions?


    We now replace the fixed *x*-coordinate 300 with an expression that includes the
    variable *i*:


    ```

    addObject(newKey("g", "3a.wav"), i*63, 1460);

    ```


    (The asterisk "*" is the operator for multiplication. Appendix D lists other operators
    that you can use with integer numbers.)


    We have chosen i*63, because we know that the image of each key is 63 pixels wide.
    The values for *i*, as the loops execute, are 0, 1, 2, 3, and so on. The keys
    will be placed at *x*-coordinates 0, 63, 126, 189, and so on.


    When we try this, we notice that the left-most key is not placed very well. Since
    object placement in Greenfoot refers to the center point of an object, the center
    of the first key is placed at *x*-coordinate 0, which places the key half off
    the screen. To fix this, we just add a fixed offset to each key coordinate. The
    offset is chosen so that the keys as a whole appear in the middle of our piano:


    ```

    addObject(newKey("g", "3a.wav"), i*63 + 54, 1460);

    ```


    The *y*-coordinate can remain constant, since we want all keys at the same height.


    **Exercise 6.18** Challenge exercise (Do this exercise if you are confident about
    your programming. If you are just beginning, you may like to skip this exercise.)


    Using fixed numbers in your code, such as the 140 or 63 in the statement above,
    is usually not the best solution, because it makes your code vulnerable to breaking
    when things change. For example, if we replace the key images with nicer images
    that have a different size, our code would not place them correctly.'
