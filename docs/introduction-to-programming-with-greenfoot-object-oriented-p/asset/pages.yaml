    Greenfoot.


    Both of the sound effects we used in the previous section were recorded by simple

    speaking into the microphone. Greenfoot has a sound recorder built-in for you
    to

    do same.


    To get started, use the Show Sound Recorder function from the Controls menu.

    You will see the Greenfoot sound recorder control (Figure 3.7).


    Using this sound recorder, you can now record your own sounds by pressing the

    Record button and speaking into the microphone.¹ Press Stop Recording when we
    are

    finished. You can use the Play button to check what your recording sounds like.


    There is only one edit available: Trim to selection. The purpose is to cut off

    unwanted sections of the recording at the beginning and then end. Often you will
    have

    an bit of noise or silence at the beginning of the recording, and this will not
    sound good

    y your program: silence at the beginning will make your sound appear delayed.


    To remove the unwanted parts, select the part of the sound you want to keep with

    your mouse (Figure 3.8) and then press Trim selection.


    Finally, choose a name for your sound, type it into the filename field, and click
    Save.

    The sound will be saved in WAV format and will automatically create a .wav file-

    name suffix. So if you, for example, call your sound file "bark," it will be saved
    as

    "bark.wav." Greenfoot will automatically save it to the right location ("sounds")

    folder in your scenario folder.


    > ¹ Obviously, this only works if you have a microphone. Most recent laptops have

    microphone built-in. For some desktop computers, you will have to connect an external

    microphone. If you do not have a microphone, skip this section.'
