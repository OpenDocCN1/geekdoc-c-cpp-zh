    # Greenfoot API


    The Greenfoot API consists of five classes:


    | Actor | Actor methods are available to all actor subclasses. | MouseInfo | Provide
    information about the last mouse event. |

    |---|---|---||

    | World | World methods are available to the world. | GreenfootImage | For image
    presentation and manipulation. |

    |---|---|---||

    | Greenfoot | Used to communicate with the Greenfoot environment itself. | GreenfootSound
    | For sound playback. |

    |---|---|---||

    | | UserInfo | To save user data on a server (only when running on Greenfoot website).
    |


    The API shown here is for Greenfoot version 2.4.0. If you use a newer version
    of Greenfoot, please check the documentation online.


