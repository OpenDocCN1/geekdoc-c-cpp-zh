  md: '# Chapter 1 ■ Getting to know Greenfoot


    > Tip

    You can open an editor for a class by double-clicking the class in the class diagram.


    At this point, it is only important to understand that we can change the behavior
    of the objects by changing the class''s source code. Let us try this out.


    We have seen before that the default firing speed of the rocket was fairly slow.
    We could change this for every rocket individually by invoking a method on each
    new rocket, but we would have to do this over and again, every time we start playing.
    Instead, we can change the code of the rocket so that its initial firing speed
    is changed (say, to 5), so all rockets in the future start with this improved
    behavior.


    Open the editor for the Rocket class. About 25 lines from the top, you should
    find a line that reads


    ```

    gunReloadTime = 20;

    ```


    This is where the initial gun reloading time sets get set. Change this line so
    that it reads


    ```

    gunReloadTime = 5;

    ```


    Be sure to change nothing else. You will notice very soon that programming systems
    are very fussy. A single incorrect or missing character can lead to errors. For
    example, if you remove the semicolon at the end of the line, you would run into
    an error fairly soon.


    Close the editor window (our change is complete) and look at the class diagram
    again. It has changed: The Rocket class now appears stripped (Figure 1.10). The
    striped line indicates that a class has been edited and must be compiled. Compilation
    is a translation process: the class''s source code is translated into a machine
    code that your computer can execute.


    Classes must always be compiled after their source code has been changed, before
    new objects of the class can be created (Sometimes several classes need recompilation
    even though we have changed only a single class. This may be the case because
    classes depend on each other. When one changes, several may need to be translated
    again).


    > Concept

    Computers do not understand source code. It needs to be translated to machine
    code before it can be executed. This is called compilation.


