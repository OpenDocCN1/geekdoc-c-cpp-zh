  md: '# How to get started


    see how you compare to other people.¹ Or you could do it on your own wat just
    for the fun of it—either way, it should be an interesting challenge.


    To start with, open the greeps scenario from your scenarios. Run it.


    You will see that a spaceship lands in an area with sand and water. The Greeps
    will leave the spaceship and start searching for tomato piles (which happen to
    be found in various places in this area). Greeps are land animals—they cannot
    and will walk into the water. (In fact, they are so sensitive to water that they
    dissolve quickly in it, so don''t try.)


    When you try out the scenario, you will quickly see that the Greeps do not behave
    very intelligently. They head out in a random direction from the ship, but when
    they reach the edge of the water, they will just stay there, because they cannot
    go forward.


    Your task will be to program the Greeps to use a more intelligent strategy, so
    that you will need to find the tomatoes and bring them back to the ship.


    There are some facts about the Greeps that you need to know:


    +   - There are 20 Greeps in the spaceship. They will come out landing to start
    their work. You cannot get any more of them.

    - Greeps can carry a tomato on their back, but they cannot load tomatoes onto
    their own back. They can only load a tomato onto another Greep''s! This means
    that two of them have to be at the tomato pile at the same time to pick up a tomato.

    - Greeps cannot talk or communicate verbally in any way. They can, however, spit
    paint onto the ground. And they can spit in three different colors (Figure 1.2)!
    There are rumors that once was a tribe of Greeps who used this to convey information
    to each other.

    - Greeps are very short sighted. They can only see the ground at their immediate
    location and cannot look any further.

    - Greeps have a good memory—they never forget what they know. However, unfortunately,
    their memory is very limited. They can only remember a few things at a time.


    Armed with this extensive background knowledge, we can now get ready to program
    our Greeps.


    > If you submit the Greeps scenario to the Greenfoot website, please do not include
    source code. We want to keep this project as a challenge to future programmers
    and don''t want to make it too easy to find solutions of others.'
