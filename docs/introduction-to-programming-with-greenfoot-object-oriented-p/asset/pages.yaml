    # Ending the game


    One simple improvement is to make end execution of the game when the crab is caught
    by a lobster. Greenfoot has a method to do this—we just need to find out what
    it is called.


    To find out the available methods in Greenfoot, we can look at the documentation
    of the Greenfoot classes.


    In Greenfoot, choose `Greenfoot Class Documentation` from the `Help` menu. This
    will show the documentation for all the Greenfoot classes in a Web browser (Figure
    3,5).


    This documentation is also called the `Greenfoot API` (Application Programmers''
    Interface). The API shows all available classes and for each class, all available
    methods. You can see that Greenfoot offers seven classes: Actor, Greenfoot, GreenfootImage,
    GreenfootSound, MouseInfo, UserInfo, and World.'
