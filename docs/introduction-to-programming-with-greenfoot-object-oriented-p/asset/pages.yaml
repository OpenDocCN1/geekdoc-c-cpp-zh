    # Further development


    We are at the end of the detailed discussion of development of this scenario in
    this chapter. There are, however, a large number of further improvements possible
    to this game. Some are quite obvious, others you may like to invent yourself.


    Below are some suggestions for further work, in the form of exercises. Many of
    them are independent of each other—they do not need to be done in this particular
    order. Pick those first that interest you, and come up with some extensions of
    your own.


    # The Counter class and other helper classes


    The **Counter** class included in this scenario is one of a small collection of
    useful helper classes provided with Greenfoot. You can import any of these classes
    by using the Import Class... function from the *Edit* menu in Greenfoot''s main
    window. Try to see what other classes are there.


    We could have chosen to display the score by just writing it onto the world background,
    as we did in Chapter 5. In this case, we chose to use the Counter class for cosmetic
    effects: we wanted to make it a bit more interesting. Once you implement score
    counting in this scenario, you will see that this counter not only has a more
    interesting look, but also includes an animation effect (counting up the numbers)
    when you add to the count.


