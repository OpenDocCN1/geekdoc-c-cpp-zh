  md: "# D: Some Java details\n\n```\ndo {\n  statements;\n} while (expression);\n\
    ```\n\nExample:\n\n```\ndo {\n  System.out.print(\"Please enter filename: \");\n\
    \  input = readInput();\n} while (input == null);\n```\n\n# D.3.2.3 for for\n\n\
    The loop has two different forms. The first form is also known as a for-each loop,\
    \ and is used exclusively to iterate over elements of a collection. The loop variable\
    \ is assigned the value of successive elements of the collection on each iteration\
    \ of the loop.\n\n```\nfor (variable-declaration : collection) {\n  statements;\n\
    }\n```\n\nExample:\n\n```\nfor (String note : list) {\n  System.out.println(note);\n\
    }\n```\n\nThe second form of loop executes as long as a condition evaluates to\
    \ true. Before the loop starts, an initialization statement is executed exactly\
    \ once. The condition is evaluated before every execution of the loop body (so\
    \ the loop may execute zero times). An increment statement is executed after each\
    \ execution of the loop body.\n\n```\nfor (initialization; condition; increment)\
    \ {\n  statements;\n}\n```\n\nExample:\n\n```\nfor (int i = 0; i < text.size();\
    \ i++) {\n  System.out.println(text.get(i));\n}\n```\n\nBoth types of loop are\
    \ commonly used to execute the body of the loop a definite number of times—for\
    \ instance, once for each element in a collection. A for-each loop cannot be used\
    \ if the collection is modified while it is being iterated."
