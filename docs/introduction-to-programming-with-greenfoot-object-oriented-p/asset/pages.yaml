  md: '# A constructor without any parameters is also called a default constructor.


    The default constructor makes it easy for us to create bodies interactively without
    having to specify all the details. The second constructor allows creation of a
    body with custom size, mass, velocity, and color. This constructor is used, for
    example, in the Space class to create the sun, planet, and moon.


    The second constructor initializes the state of the actor using its parameter
    values that have been passed. The first constructor looks more mysterious. It
    has only one line of code:


    ```

    this(20, 300, new Vector(90, 1.0), defaultColor);

    ```


    The line looks almost like a method call, except that it uses the keyword instead
    of a method name. Using this call, the constructor executes the other constructor
    (the one with the four parameters), and provides default parameters for all the
    values. Using the keyword in this way (like a method name) is only possible within
    constructors to call another constructor as part of the initialization.


    There is a second use of this keyword:


    ```

    this.mass = mass;

    ```


    Here we have another example of overloading: the same name is used for two variables
    (a parameter and an instance field). When we assign these, we need to specify
    which of these variables named mass we mean on each side of the assignment.


    When we write mass without any qualification, the closest definition of a vari-
    with that name is used—in this case, the parameter. When we write this.mass, we
    specify that we mean the field of the current object. Thus, this line of code
