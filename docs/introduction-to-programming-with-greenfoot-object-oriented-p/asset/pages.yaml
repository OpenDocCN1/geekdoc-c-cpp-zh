    ```


    We can see that the method is static (it is a class method) and the return type
    is boolean. This means that the method returns true or false and can be used as
    a condition in an if-statement.


    We also see that the method expects a parameter of type String. A String is a
    piece of text (such as a word or a sentence), written in double quotes. The following
    are examples of Strings:


