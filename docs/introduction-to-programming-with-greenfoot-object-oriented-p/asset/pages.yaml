  md: "# D.3.1.2 switch\n\nThe switch statement switches on a single value to one\
    \ of an arbitrary number of cases. Two possible use patterns are:\n\n```\nswitch\
    \ (expression)\n{\n    case value: statements;\n    break;\n    case value: statements;\n\
    \    break;\n    further cases omitted\n    default: statements;\n    break;\n\
    }\nwitch (expression)\n{\n    case value1:\n    case value2:\n    case value3:\n\
    \        statements;\n        break;\n    case value4:\n    case value5:\n   \
    \     statements;\n        break;\n    further cases omitted\n    default:\n \
    \       statements;\n        break;\n}\n```\n\nNotes:\n\n+   - A switch statement\
    \ can have any number of case labels.\n- The break instruction after every case\
    \ is needed, otherwise the execution “falls through into the next label statements.\
    \ The second form makes use of this. In this case, all three of the first values\
    \ will execute the first statements section, whereas values four and five will\
    \ execute the second statements section.\n- The default case is optional. If no\
    \ default is given, it may happen that no case is executed.\n- The break instruction\
    \ after the default (or the last case, if there is no default) is not needed but\
    \ is considered good style."
