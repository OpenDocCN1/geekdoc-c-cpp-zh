  md: '# 12.6 Stick-figure: tracking users


    Compared to the simple-camera example before, we have made two changes:


    +   - We have moved the code to display the image to an actor, instead of displaying
    it as the world background. Now we place a single actor in the middle of the world,
    and the actor uses the Kinect image as its actor image. The effect is similar
    to before: The image is the same size as the world and will be displayed covering
    the whole area.

    - We replaced the call to the getThumbnailUnscaled method with a call to getCombinedUserImage.
    This method also gives us the camera image, filters out the background and provides
    us with an image of just the users.


    As we see, using the users without the background is very easy, since the Kinect
    does all the difficult work for us. Since the user image is displayed as an actor,
    we can now put our own background in.


    **Exercise 12.5** Set a background image for the world. You can do this by using
    the Set Image ... function from MyWorld pop-up menu. The scenario provides an
    image called weather-map.png that you can use.


    **Exercise 12.6** Try the scenario with various other images of your yours.


    Both these examples—simple-camera and greenscreen—used just the image of the user
    as either the world background or an actor image. This is an interesting first
    step, but if we want to interact with other objects on the screen, we need to
    go one further step: We need to analyze the user image to find out where on screen
    the user is. Luckily, the Kinect helps us with that as well.


    # Stick-figure: tracking users


    The stick-figure scenario in the book folder shows a first example of tracking
    users. This time, we will not show the camera image of the user, but use the coordinates
    of the joints of the user in the scenario to draw.


    **Exercise 12.7** Open the stick-figure scenario. Run it. Stand in front of your
    Kinect and see what happens.


    When testing this scenario, you can see that it tracks the user in front of the
    camera and draws a stick figure (Figure 12.6). You may also notice that it is
    sometimes difficult to know whether you are in view of the Kinect camera, and
    where exactly to stand so that you can be tracked. To solve this problem, we will
    first insert a thumbnail image into this scenario, before we investigate how the
    stick figure is drawn.'
