  md: '# CHAPTER

    12

    Greenfoot and the Kinect


    topics: programming with the Microsoft Kinect

    concepts: body tracking


    We have learned to use many different and useful programming constructs by now,
    and now we are ready to apply them to another context. In this chapter, we will
    not introduce new programming concepts or Java constructs, but instead use our
    programming skills to play with an exciting and interesting toy: the Microsoft
    Kinect.


    The Microsoft Kinect is a sensor board that includes a color camera, an infrared
    projector, and an infrared camera (Figure 12.1). The infrared projection and camera
    enable it to sense depth of the image in front of it, so that it can “see” in
    three dimensions.


    To do the exercises in this chapter, you need to have a Microsoft Kinect available.
    If you do not own one, you can safely skip this chapter. If you consider buying
    a Kinect for use with Greenfoot, make sure to read the notes on Purchasing a Kinect
    on the Greenfoot website.¹ Not all models of the Kinect work with Greenfoot.


    Figure 12.1

    The Microsoft Kinect²


    ![](img/410f5f709c4688c1903940c91e75e8ab_237_0.png)


    > ¹ See http://www.greenfoot.org/doc/kinect#purchase for notes on which model
    of the Microsoft Kinect to purchase for use with Greenfoot.

    ² Image source: Official Windows Magazine/Getty Images'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'In this chapter, we shall look at a sequence of scenarios that make use of
    the Kinect. We will first study some ready-made scenarios to see how things work,
    and then write some code of our own.


    # What the Kinect can do


    The Kinect can detect people and their movement in front of its camera. Through
    Greenfoot and the Kinect, we can get information about the number of people in
    front of it, their position, and their body movements. This allows us to write
    programs that are controlled by moving our body in front of our computers.


    # Camera image


    The first and most simple thing the Kinect does is give us an image from its camera.
    This is just like any other normal webcam image, and we can use this image in
    Greenfoot.


    # Depth image


    In addition to the normal color image, we can get depth information. “Depth” is
    the distance from the camera of any point in front of it. Figure 12.2 shows the
    depth as a gray-scale image: the lightness of each pixel shows its distance from
    the camera.


    ![](img/410f5f709c4688c1903940c91e75e8ab_238_0.png)'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Body outlines


    The Kinect can recognize people in its view, and reasonably reliably determine
    their outline in the camera image (Figure 12.3). It can distinguish between different
    people and give us the information about the location of a human body separately
    for every person it can see.


    ![](img/410f5f709c4688c1903940c91e75e8ab_239_0.png)


    # Skeleton tracking


    The most useful thing the Kinect can do is skeleton tracking: It can identify
    the location of, in all three dimensions, of various points of our body (Figure
    12.4). It can give us the location of our hands, shoulders, feet, hips, head,
    and so on. It makes it very easy to write programs that are controlled by body
    movements. We can, for example, write a scenario where something happens when
    we touch a Greenfoot actor with our right hand or when our left foot is raised
    above our right knee. It does not need imagination to come up with ideas how we
    can use this input to write interesting scenarios that are fun to play with.


    ![](img/410f5f709c4688c1903940c91e75e8ab_239_1.png)'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Installing the software


    Before you can use the Microsoft Kinect with Greenfoot, you have to install some
    driver software. The driver software manages the communication with the hardware
    and provides a software interface to control the device.


    When Greenfoot Kinect scenarios are running, we need the Greenfoot Kinect Server
    to run in the background to facilitate the communication between our Greenfoot
    scenario and the Kinect hardware. The Greenfoot Kinect Server, in turn, uses a
    library called OpenNI. Figure 12.5 shows the levels of communication between your
    Kinect scenario and the Kinect hardware.


    Detailed installation instructions for these software components are on the Greenfoot
    website at http://www.greenfoot.org/doc/kinect.


    Instructions are available for Windows, Linux (Ubuntu), and Mac OS X. Follow these
    instructions carefully before you start working with the following examples.


    # Running the Greenfoot Kinect server


    When we want to run our Greenfoot Kinect scenarios, we first have to start the
    Greenfoot Kinect Server. It will run continuously in the background, and we have
    to keep it running as long as we are working with Greenfoot and the Kinect.


    ![](img/410f5f709c4688c1903940c91e75e8ab_240_0.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'Chapter 12 Greenfoot and the Kinect


    Figure 12.5

    Layers of communication between Greenfoot and the Kinect



    ![](img/410f5f709c4688c1903940c91e75e8ab_241_0.png)


    The installation instructions mentioned above provide details about how to start
    this server. (If you are running it from a terminal, you will see a lot of warning
    messages printed. Do not worry about this—it is normal.)


    # 12.3 Getting started


    To get started, we will first look at a very simple example: displaying the camera
    image on screen. We will use a scenario called simple-camera, which you can find
    in the book scenarios.


    > Exercise 12.1 Connect your Kinect to your computer. Start your Greenfoot Kinect
    Server. Then start Greenfoot and open the simple-camera example. Run it.


    If your installation has worked, you should now see the image from the Kinect''s
    camera in your world.


    In the class diagram in the scenario, you see a number of classes. The KinectWorld,
    Joint, KinectClient, Point3D, and UserData classes are part of the Greenfoot infrastructure—they
    will always be present in scenarios using the Kinect. The only class specific
    to this scenario, holding our user code, is MyWorld.


    Before trying our code, let us have a quick look at the standard Greenfoot Kinect
    classes.


    # KinectWorld


    This class should be used as the superclass for all your world classes in Kinect
    scenarios. It provides the fundamental communication with the Kinect, giving you
    access to the data (camera image and user data) that we can receive from the Kinect.
    You should, at some stage, have a look at its methods. You may want to switch
    the editor to Documentation view to look at its methods—the implementation is
    not important at the moment.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# KinectClient


    This class is used internally by the KinectWorld—you should not need to use this
    directly.


    # UserData


    This is a class that defines objects which are holding information about a user
    being tracked by the Kinect. You can get one object per user that the Kinect can
    see. You can receive UserData objects by using methods from your KinectWorld.


    # Joint


    The UserData object, in turn, can give you access to information about each joint
    of the user (such as the right hand, the elbow, the knee). You receive this information
    in the form of objects of class Joint.


    # Point3D


    Lastly, part of the joint information is the joint''s location (in three dimensions).
    This is provided as a Point3D object.


    The book scenarios folder contains a scenario called *kinect-start* that contains
    just these classes, and can be used as a starting scenario for your own projects.


    # The simple camera


    The only scenario-specific code in the *simple-camera* scenario is contained in
    the MyWorld class (Code 12.1). Let us have a look at what it does.


    The constructor of MyWorld simply creates the default constructor of KinectWorld.


    The Kinect hardware gives us, by default, an image of 640 by 480 pixels, and the
    KinectWorld''s default constructor will create a world of the same size to match.
    (Using different constructors, we can also create worlds of other sizes and scale
    the Kinect input, but this is not necessary).


    The interesting code in this class is in the act method. It includes a call to
    the superclass''s act method. KinectWorld''s act method manages the communication
    with the server and you must always call it regularly. It''s not difficult—just
    do not delete this line.


    The last two lines are where things happen: we call the getUnscaled method, which
    gives us the camera image of the Kinect in its default size, as a GreenfootImage.
    The last line then sets this image as our world background.'
  merge: -1
