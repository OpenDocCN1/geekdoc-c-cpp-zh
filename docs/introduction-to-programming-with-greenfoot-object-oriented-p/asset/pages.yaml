  md: '# 5.11 Finally: adding a score


    Again, we have to call a method from the world class, as we already did earlier
    to remove an object from the world. We use the same technique as: we call getWorld()
    to access to the world object, and then chain our showText(..) method to the end
    of it:


    ```

    getWorld().showText(...);

    ```


    What is left to work out the parameters for the showText method. Its signature
    is void showText(String, int x, int y)


    The last two parameters are simple: they are the x- and y-coordinates where we
    want the text to appear. The first parameter is the text we want to show, and
    it is of a type we have seen but not really discussed before: String.


    Variables of type String can store text, such as characters, words or sentences.
    Strings are written in double quotes. For example:


    ```

    String name = "Fred";

    String message = "Game over";

    ```


    We have seen a String before we played a sound:

    Greenfoot.playSound("slurp.wav");


    The playSound method expects a String parameter, and the value "slurp.wav" is
    a String we passed into it. We can do the same with the showText method. For example:


    ```

    getWorld().showText("Hello", 80, 25);

    ```


    will show the word "Hello" on our screen at the specified location.


