  md: '# Chapter 1 Getting to know Greenfoot


    was returned by this method call. In effect, we have just asked the wombat "Can
    you move?”, and the wombat has answered by saying "Yes!" (true).


    **Exercise 1.3** Invoke the canMove() method on your wombat. Does it always return
    true? Or can you find situations in which it returns false?


    Try out another method with a return value:


    ```

    int getLeavesEaten()

    ```


    Using this method, we can get the information how many leaves this wombat has
    eaten.


    **Exercise 1.4** Using a newly created wombat, the getLeavesEaten() method will
    always return zero. Can you create a situation in which the result of this method
    is not zero? (In other words: can you make your wombat eat some leaves?)


    Methods with non-return types usually tell us something about the object (Can
    it move? How many leaves has it eaten?), but do not change the object. The wombat
    is just as it was before we asked it about the leaves. Methods with void types
    are usually commands to the objects that make it do something.


    # Parameters


    The other bit in the method menu that we have not yet discussed is the parentheses
    after the method name.


    Return type


    Parameter


    ```

    int getLeavesEaten()

    void setDirection(int direction)

    ```


    The parentheses after the method name hold the parameter list. This tells us whether
    the method requires any additional information to run, and if so, what kind of
    information.


    If we see only a pair of parentheses without anything between it (as we have in
    all methods so far), the method has an empty parameter list. In other words, it
    expects no parameters—when we invoke the method, it will just run. If there is
    anything between the parentheses, then the method expects one or more parameters—additional
    information that we need to provide.


    Let us try out the setDirection method. We can see that it has the words int direction
    written in its parameter list. When we invoke it, we see a dialog box similar
    to the one shown in Figure 1.6.'
