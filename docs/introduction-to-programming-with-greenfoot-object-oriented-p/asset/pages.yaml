    The next line in our code calculates the force of the gravitational pull by using
    Newton''s formula of gravitation given above.


    The final thing to do is to calculate the acceleration, as the actual velocity
    of our object is not only determined by the force of gravity, but also the mass
    of our object: The heavier the object, the slower it will accelerate. Acceleration
    is computed using the following formula:


    ```

    acceleration = \frac{force}{mass}

    ```


    Once we have calculated the acceleration, we can set our new vector to the correct
    length and add this vector to the velocity of our body. Doing this is easy, using
    the addToVelocity method that is provided by the SmoothMover class.


