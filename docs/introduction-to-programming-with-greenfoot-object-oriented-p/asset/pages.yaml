  md: "# 6.3 Abstraction: creating multiple keys\n\nWe will use abstraction to turn\
    \ our Key class from a class that can create objects that play a middle-a when\
    \ the \"g\" key is pressed on the keyboard into one that can create objects that\
    \ play a range of notes when different keyboard keys are pressed.\n\nThe way to\
    \ achieve this is to use a variable for the name of the keyboard key we react\
    \ to, and another variable for the name of the sound file we want to play.\n\n\
    Code 6.5 shows the start of a solution to this. Here, we use two additional fields—key\
    \ and sound—to store the name of the key and the sound file we want to use. We\
    \ also add two parameters to the constructor, so that these bits of information\
    \ can be passed in when the key object is being created, and we make sure that\
    \ we store these parameters into the fields in the constructor body.\n\n```\n\
    public class Key extends Actor {\n    private boolean isDown;\n    private String\
    \ key;\n    private String sound;\n\n    /**\n     * Create a new key linked to\
    \ a given keyboard key, and\n     * with a given sound.\n     */\n    public Key(String\
    \ keyName, String soundFile) {\n        key = keyName;\n        sound = soundFile;\n\
    \    }\n    // methods omitted\n}\n```\n\nWe have now made an abstraction of our\
    \ Key class. Now, when we create a new Key object, we can specify which keyboard\
    \ key it should react to, and which sound file it should play. Of course, we haven't\
