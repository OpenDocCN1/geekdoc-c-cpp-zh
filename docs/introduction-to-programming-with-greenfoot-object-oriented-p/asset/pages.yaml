  md: "There are several things worth noting in this code. First, it uses a construct\
    \ that we have seen before: a local variable. Our variable is called i and we\
    \ initialize it to zero. Then we repeatedly execute the body of the while loop,\
    \ counting every time we do so. We continue as long as i is less than 100. When\
    \ we reach 100, we stop the loop. Execution will then continue with the code loop\
    \ body.\n\nThere are further details worth pointing out:\n\n+   - We use the statement\
    \ i = i + 1; at the end of the loop body to increment loop variable by one every\
    \ time we have executed the loop. This is important. It is a common error to forget\
    \ to increment the loop counter. The variable would then never change, the condition\
    \ would always remain true, and the loop would continue forever. This is called\
    \ an infinite loop, and is the cause of many errors in programs.\n- Our condition\
    \ says that we execute the loop while i is less than (< 100. not less or equal\
    \ (=). The loop will not be executed when i is equal to 100. At first glance,\
    \ one might think that the loop executes only 99 times, not 100 times. But this\
    \ is not so. Because we started counting at zero, not at one, we execute 100 times\
    \ (counting from 0 to 99). It is very common to count from zero in computer programs—we\
    \ will see some advantages of doing so soon.\n\nNow that we know about a while\
    \ loop, we can use this construct to create all our piano keys.\n\nOur piano will\
    \ have 12 white keys. We can now create 12 keys by placing our statement to create\
