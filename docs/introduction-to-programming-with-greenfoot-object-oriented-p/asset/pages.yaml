  md: 'In short: we can start to make things happen by creating objects from one of
    the classes provided, and we can give commands to the objects by invoking their
    methods.


    Let us have a closer look at the object method. The move and turnLeft methods
    are listed as:


    ```

    void move()

    void turnLeft()

    ```


    We can see that the method names are not the only thing shown. There is also the
    word void at the beginning and a pair of parentheses at it. These two cryptic
    bits of information tell us what data goes into the method call, and what data
    comes back from it.


    # Return types


    The word at the beginning is called the return type. It tells us what the method
    returns when we invoke it. The word void means "nothing" in this context: methods
    with a void return type do not return any information. They carry out their action,
    and then step.


    Any word other than void tells us that the method returns some information when
    invoked, and of what type that information is. In the wombat''s menu (Figure 1.4),
    we can also see the words int and boolean. The int is short for "integer" and
    refers to numbers (numbers without a decimal point). Examples of integer numbers
    are 3, 42, -3, and 1200000.


    The type boolean has only two possible values: true and false. A method that returns
    a boolean will return either the value true or the value false to us.


    Methods with void return types are like commands for our wombat. If we invoke
    the turnLeft method, the wombat obeys and turns left. Methods with non-void return
    types are like questions. Consider the following canMove method:


    ```

    boolean canMove()

    ```


    When we invoke this method, we see a result similar to that shown in Figure 1.5,
    displayed in a dialog box. The important information here is the word "true,"


    ![](img/410f5f709c4688c1903940c91e75e8ab_28_0.png)'
