  md: '# APPENDIX


    # Installing Greenfoot


    This appendix will tell you where to find the Greenfoot software and the scenarios
    used with this book, and how to install them.


    To work with the sample projects in this book, you will need to install two things:
    the Greenfoot software and the book scenarios.


    # A.1 Installing Greenfoot


    Download Greenfoot from http://www.greenfoot.org, and follow the installation
    instructions.


    On Windows and Mac OS, the Greenfoot download includes a Java system (JDK), so
    you do not need to install it separately. On Linux, the JDK will be automatically
    downloaded as part of the installation process if not already present.


    # A.2 Installing the book scenarios


    Download the book scenarios from http://www.greenfoot.org/book. You will receive
    a file named book-scenarios.zip. This is a compressed zip file that must be extracted.
    On Windows systems, this can usually be achieved by right-clicking and selecting
    Extract All from the menu. On Mac OS and Linux systems, you can double-click the
    file to extract it.


    After extracting this file, you will have a folder named book-scenarios stored
    in your file system. Remember where you saved it—you will need to open the projects
    from this folder while you work through the book.'
