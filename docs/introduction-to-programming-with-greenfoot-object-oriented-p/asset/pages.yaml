  md: '# 10.10 Combining image files and dynamic drawing


    # Concept summary


    +   - We can use the mouseClicked method to check whether the user clicked on
    a given object.

    - Sounds can be saved in a variety of different formats and encodings. Not all
    programs can play all sound formats. For Greenfoot, we usually use WAV format.

    - The sample format, sample rate, and stereo/mono setting of a sound recording
    determine file size and sound quality.

    - The JPEG image format compresses large images very well. This is the best choice
    for backgrounds.

    - Pixels in images have a transparency value that determines whether we can see
    through them. Pixels may be partly transparent. If they are fully transparent,
    they are invisible.

    - The PNG image format is often the best choice for actor images since it can
    handle transparency and compresses fairly well.


