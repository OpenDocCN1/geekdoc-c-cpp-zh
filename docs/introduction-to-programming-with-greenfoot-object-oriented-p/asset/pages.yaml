    There are, of course, countless more possible extensions. Invent some of your
    own, implement them, and submit your results to the Greenfoot website.


    ![](img/410f5f709c4688c1903940c91e75e8ab_197_0.png)


    # Summary of programming techniques


    In this chapter we have worked on completing an asteroids game that was initially
    half-written. In doing this, we have encountered several important constructs
    again, including loops, lists, and collision detection.


    We have seen one new style of loop—the for loop—and we have used it to paint the
    stars and generate the proton wave images. We have also revisited the for-each
    loop and methods methods when we implemented the proton wave functionality.


    Two different collision detection methods were used: getOneIntersectObject and
    getObjectsInRange. Both have their advantages in certain situations. The second
    one of those returned a list of actors to us, so we had to deal with lists again.


    The more practice you get with lists and loops, the easier it becomes to use them.
    After using them for a while, you will be surprised that you found them so difficult
    at first.


    # Concept summary


    +   - The **for loop** is one of Java''s constructs. It is especially useful for
    Iterating a fixed number of times.


    +   - Greenfoot provides several methods for **collision detection**. They are
    in the **Actor** class.


    +   - The **bounding box** of an image is the enclosing rectangle of that image.


    +   - Objects can be of **more than one type**: the type of one class and the
    type of its superclass.


    +   - **Casting** is the technique of specifying a more precise type for our object
    than the one the compiler knows about.'
