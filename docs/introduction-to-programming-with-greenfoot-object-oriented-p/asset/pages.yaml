  md: '# 12.7 Painting with your hands | 229


    In general, we get information about users by starting with the getTrackedUsers
    method from the KinectWorld class (Figure 12.9). This will give us an array of
    UserData objects with an entry for every user that is being tracked. We can then
    use various methods of the UserData object (only some are shown in Figure 12.9)
    to get detailed information about each user. For us, the getJoint method is the
    most interesting at the moment.


    getJoint will give us an object of type Joint, which we can then use to retrieve
    the joint''s x- and y-coordinates.


    +   Exercise 12.19 The getJoint method expects a parameter specifying which joint
    we are interested in. We usually use constants here that are defined in the Joint
    class (Figure 12.9). Check the documentation of class Joint to see what constants
    are available to specify joints. How many different joints can we find out?


    In the method of our Canvas class, the UserData object has already been retrieved
    and stored in the field called user. We can therefore proceed directly to retrieve
    the joint for the right hand from it:


    ```

    Joint rightHand = user.getJoint(Joint.RIGHT_HAND);

    ```


    Once we have the right hand joint, we can now extract its x- and y-coordinates
    and use these to paint our circle on screen:


    ```

    getImage().fillVal(rightHand.getX(), rightHand.getY(), 20, 20);

    ```


    This is all that needs to be done in order to paint our right hand. Try it out!


    +   Exercise 12.20 Insert the code discussed above into your own Canvas act method.
    You need only those two lines as shown here. Test!


    You should see that we are now painting (continuously) at the location of the
    right hand.


    # Stop painting


    To make our painting a bit more controllable, it would be nice if we could also
    move our right hand without painting. To do this, we want to change our code so
    that it only paints when the right hand is the nearest joint to the camera. That
    way, we can paint by holding our hand forward, and stop by pulling it back.


    The UserData class has a method called getNearestJoint that we can use to achieve
    this. Try this yourself at first without reading on (we will discuss it after
    the exercise).'
