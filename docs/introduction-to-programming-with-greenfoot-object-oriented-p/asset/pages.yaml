  md: '# The this keyword


    To pass an object as a parameter, we use the Java keyword this. The “this” keyword
    refers to the current object that is executing at the moment. Thus, by saying
    that “this” should be removed from the world, the bacterium removes itself.


    # Chaining method calls


    The removeObject method belongs to the world object, but we are writing code in
    the Bacteria class. So we cannot just


    ```

    removeObject(this);

    ```


    This would try to invoke the method on the Bacteria object, but this object does
    not have such a method.


    To invoke method on another object, we must specify that object first, then use
    a dot, and then the method call:


    ```

    my-world-object.removeObject(this);

    ```


    Thus, we need to access to the world object—the world we are currently in. Luckily,
    the Actor class has a method to do just that. It is called


    ```

    getWorld()

    ```


    and returns a reference to the current world object. We can now use this method
    call in the place of the world object:


    ```

    getWorld(), removeObject(this);

    ```


    Here we chain two method calls: getWorld() and removeObject(..). First getWorld()
    is called, and it returns the world object to us. Then removeObject(..) is called
    on that object that we just received. Thus, we are telling the world to remove
    ourselves from the world.


    # Bloodstream: creating new objects


    The last class to track is our world subclass, called Bloodstream. It has the
    usual constructor, including a call to the prepare() method to place the initial
    objects (the white blood cell and lining).


    The interesting part of this class is its act method (Code 5.3). When the scenario
    runs, this method will place new Bacteria objects into the world at random intervals.
    When a random number out of 100 is less than three—that is, on average three times
    in 100 act cycles—a new bacterium will be created.


    The x-coordinate to place this new object is always 779—the right edge of the
    screen (note that the world has a size of 780 by 360 cells, so 779 is the largest
    possible x-coordinate.


    ![](img/410f5f709c4688c1903940c91e75e8ab_106_0.png)


    ![](img/410f5f709c4688c1903940c91e75e8ab_106_1.png)


    ![](img/410f5f709c4688c1903940c91e75e8ab_106_2.png)'
