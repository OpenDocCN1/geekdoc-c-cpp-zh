  md: "# 8.7 Applying gravity\n\nNewton's formula for gravitation looks like this:\n\
    \n```\nforce = \\frac{mass1 \\times mass2}{distance^2}\n```\n\nIn other words,\
    \ to calculate the force we need to apply to the current object, we need to multiply\
    \ the mass of this object with the mass of the other object, and then divide by\
    \ the square of the distance between the two objects. Finally, the value gets\
    \ multiplied by the constant G—the gravitational constant. (You may remember that\
    \ we have already defined a constant for this value in our class, named GRAVITY.)\n\
    \nIf you are ever confident or adventurous, you may like to try to implement the\
    \ applyGravity method yourself. You need to create a vector in the direction from\
    \ the current body to the other body, with a length specified by this formula.\
    \ For the rest of us, we now look at the finished implementation of that method\
    \ (Code 8.6).\n\n+   * Apply the force of gravity of a given body to this one.\n\
    * (Force is applied for one time unit; dt=1.)\n\n```\nprivate void applyGravity(Body\
    \ other) {\n    double dx = other.getExactX() - this.getExactX();\n    double\
    \ dy = other.getExactY() - this.getExactY();\n    Vector dv = new Vector(dx, dy);\
    \ //sets direction; length to be done\n    double distance = Math.sqrt(dx*dx +\
    \ dy*dy);\n    double force = GRAVITY * this.mass * other.mass / (distance * distance);\n\
    \    double acceleration = force / this.mass;\n    dv.Length(acceleration);\n\
    \    addVelocity(dv);\n}\n```\n\nThis method is not quite as complicated as it\
    \ looks. First we calculate the distances between our object and the other object\
    \ in the x- and y-coordinates (dx and dy). Then we create a new vector using these\
    \ values. This vector now has the right direction, but not the correct length.\n\
    \nNext we calculate the distance between the two objects using the Pythagoras\
    \ theorem (a² + b² = c² in right-angled triangles, see Figure 8.6)."
  merge: -1
  pgno: 168
