    Where do we get this object reference from? Well, there are several possibilities.


    In the example above, our block is talking to the world object. We can get a reference
    to the world object by using the getWorld() method that every actor possesses.


    The getWorld() method gives us a reference to the currently instantiated world,
    which is always the subclass of the World class. We can declare a variable of
    type World and store our world object into it. Doing this before calling our method
    gives us:


    ```

    world = getWorld();

    world.addLeaf(new Leaf(), 100, 100);

    ```


