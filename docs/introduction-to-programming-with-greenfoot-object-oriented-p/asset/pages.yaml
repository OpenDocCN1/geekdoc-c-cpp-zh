  md: "Exercise 9.14 Examine the addAsteroids method in class Space. What does it\
    \ do?\n\nExercise 9.15 Look at the for loop in that method. From the loop header,\
    \ write down the initialization part, the loop-condition, and the increment. (See\
    \ the definition of the for loop above.)\n\nThe initialization part of a loop\
    \ is executed exactly once before the loop starts. Then the loop condition is\
    \ checked: If it is true, the loop is executed. Finally, after the loop body has\
    \ been completely executed, the increment section from the loop header is executed.\
    \ After this, the loop starts over: the condition is evaluated again, and, if\
    \ true, the loop runs again. The initialization is never executed again.\n\nA\
    \ for loop could easily be replaced by a while loop. A while loop equivalent of\
    \ the for loop shown above is this:\n\n```\ninitialization;\nwhile (loop-condition)\n\
    {\n    loop-body;\n    increment;\n}\n```\n\nThe while loop structure shown here\
    \ and the for loop structure shown above do exactly the same thing. The main difference\
    \ is that, in the for loop, the initialization and the increment have been moved\
    \ into the loop header. This places all elements that define the loop behavior\
    \ in one place, and can make loops easier to read.\n\nThe for loop is especially\
    \ practical if we know at the beginning of the loop already how often we want\
    \ to execute the loop.\n\nThe for loop example in the addAsteroids method reads\n\
    \n```\nfor (int i = 0; i < count; i++)\n{\n    int x = Greenfoot.getRandomNumber(getWidth()/2);\n\
    \    int y = Greenfoot.getRandomNumber(getHeight()/2);\n    addObject(new Asteroid(x,\
    \ y));\n}\n```\n\nThis shows a typical example of a for loop:\n\n+   - The initialization\
    \ part declares and initializes a loop variable. This variable is often called\
    \ i, and often initialized to 0.\n\n+   - The loop condition checks whether our\
    \ loop variable is still less than a given limit (here: count). If it is, the\
    \ loop will continue.\n\n+   - The increment section increments the loop variable.\n\
    \nDifferent variations of the for loop are possible, but this example shows a\
    \ very typical format"
