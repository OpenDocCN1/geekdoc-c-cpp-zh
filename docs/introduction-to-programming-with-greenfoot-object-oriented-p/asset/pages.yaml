  md: '# 12.2 Programming your Greeps


    # 181


    ![](img/410f5f709c4688c1903940c91e75e8ab_202_0.png)


    # 12.2 Programming your Greeps


    To program your Greeps to collect as many tomatoes as possible, you should improve
    their behavior. The Greep class, which is included in the scenario, already includes
    some behavior that you can look at to get started.


    We can see that Greep is a subclass of Creature. Class Creature provides a number
    of very useful methods that you can use.


    There are, however, a number of rules that you must follow:


    +   Rule 1: Only change the class "Greep." No other classes may be modified or
    created.


    +   Rule 2: You cannot extend the Greeps'' memory. That is, you are not allowed
    to add fields (other than final fields) to the class. Some general purpose memory
    (one int and two booleans) is provided.


    +   Rule 3: You cannot move more than once per "act" round.


    +   Rule 4: Greeps do not communicate directly. They do not call each other''s
    methods or access each other''s fields.


    +   Rule 5: No long vision. You are allowed to look at the world only at the immediate
    location of the Greep. Greeps are almost blind and cannot look any further.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# 182 Interlude 2 The Greeps competition


    Rule 6: No creation of objects. You are not allowed to create any scenario (in
    instances of user-defined classes, such as Greep or Paint). Greeps have no magic
    powers—they cannot create things out of nothing.


    Rule 7: No teleporting. Methods from Actor that cheat normal movement (such as
    setLocation) may not be used.


    It is important to follow these rules. It is technically easy to break them, but
    that is considered cheating.


    To program your Greeps, you work mainly in the Greeps'' act method (and any other
    private methods you choose to create).


    Some tips to get started:


    +   - Read the documentation of class Creature. (The best way to do this is to
    open the class in the editor and switch to Documentation view.) These are some
    of the most useful methods for your work. Know what there is.


    +   - Work in small steps. Start making small improvements and see how it goes.


    +   - Some first improvements can be as follows: turn when you are at water, wait
    if you find a tomato pile (and try to load tomatoes). turn if you are at the edge
    of the world, and so on.


    You will soon figure out many more improvements you could implement. It gets especially
    interesting once you start using the paint drops on the ground to make marks for
    other Greeps to find.


    # 12.3 Running the competition


    It helps to have a judge who runs the competition. In a school, this might be
    a teacher. If you run with your friends, it could be a selected person (who then
    cannot take part as a normal contestant in the competition).


    To make the competition interesting, there should be two versions of the Greeps
    scenario. One gets handed out to all contestants. (This is the one included in
    the book scenarios.) This scenario includes three different maps. The Greeps land
    and forage on each of the three maps in turn. (So the challenge for contestants
    is to develop movement algorithms that are flexible enough to work on different
    maps, not just one known.)


    The judge should have a different scenario that includes more maps. We recommend
    running the competition with 10 different maps. Contestants do not get access
    to the last seven maps—they can only test the first three. Then they hand in their
    Greeps for scoring, and the judge then runs the contestants'' Greeps on all 10
    maps (maybe be on a large display screen) to reach the official score.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'The competition is best run over several days (or maybe a week or two), with
    repeated chances for contestants to submit their work for scoring, so that they
    can slowly improve.


    # 12.4 Technicalities


    For submission of an entry to the judge, the easiest mechanism is that contestants
    submit only the *Greeps.java* file. The judge then copies that file into his full
    (10-map) scenario, recompiles, and runs it. This ensures that no other classes
    are modified in the process.


    Some artwork (to make flyers or posters for the competition) is available at


    http://www.greenfoot.org/competition/greeps/


    Instructors can also find instructions there for obtaining a version of the Greeps
    scenario with 10 maps. Alternatively, instructors can make more maps themselves
    fairly easily. An image of an empty map is provided in the *images* folder of
    the Greeps scenario. Water can just be painted onto the map, and map data (location
    of tomato piles, etc.) can be specified in the Earth class.'
  merge: -1
