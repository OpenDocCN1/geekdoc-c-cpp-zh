  md: '10.4 External sound recording and editing


    187


    We can easily play an existing sound file. The more interesting task now is to
    make sound files ourselves.


    # 10.3 Sound recording in Greenfoot


    There are various options for obtaining sound files. We can copy sounds from other
    Greenfoot projects, or download them from free sound libraries on the Internet.
    If you copy sounds from the Internet, pay attention to copyright notices: Not
    everything that is on the Internet is free—respect other people''s copyright!
    The easiest option to obtain sound files is to record ourselves.


    To do this, we need a microphone (many laptops have microphones built in, and
    computer headsets with microphones attached). If you do not have a microphone
    available right now, you may want to skip this section.


    In Chapter 3, we have already briefly seen Greenfoot''s built-in sound recorder.
    It allows us to record a sound, trim it to remove unwanted parts at the beginning
    and end, and save it.


    **Exercise 10.13** Use Greenfoot''s sound recorder (available from the Controls
    menu) to record a new sound for your sample scenario. Make your actor play that
    new sound when clicked.


    **Exercise 10.14** Introduce a second kind of actor. Place at least one instance
    of this class into the world. Make this actor produce a different sound when clicked.


    **Exercise 10.15** Use a digital camera or webcam to take a picture of one or
    more friends of yours. Create actors representing these friends. Record your friends
    saying something, and make the actors speak these recordings when you click on
    them.


    # 10.4 External sound recording and editing


    Using Greenfoot''s recorder is quick and easy, and in many cases it will be sufficient.
    However, if we want to get more professional, we may want to record specific sound
    effects that are hard to produce with this simple recorder. If we care about the
    details of the sound, separate sound recording software may be useful.


    Many sound recording programs are available; several of them are free. We will
    use Audacity for the sample screenshots. Audacity is a good choice because it
    is powerful, runs on different operating systems, and is free and easy to use.
    There are many other sound recording programs, however, feel free to use one of
    your own choice.


    ¹ Audacity is available from http://audacity.sourceforge.org'
  merge: -1
