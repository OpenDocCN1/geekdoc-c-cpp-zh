  md: '# Setting up the world


    Before we go on to add pheromones to our scenario, let us first add some initialization
    code that creates ant hills and food for us automatically, so that we do not have
    to repeat this manually every time we wish to test.


    Exercise 11.23 Add code to class AntWorld, so that it automatically creates two
    ant hills and a few piles of food in the world. You can do that by writing the
    code manually, or by using the Save World function in Greenfoot''s interface.


    # Adding pheromones


    Now that we have a good start up, we are ready to add pheromones. Each pheromone
    is a small drop of a chemical substance that the ants leave on the ground. This
    drop will evaporate fairly quickly and then disappear.


    Ants drop pheromones while they are walking back home from a food source. When
    other ants smell the drop of pheromone, they can then turn away from their home
    hill and walk in the direction towards the food.


    Exercise 11.24 Create a class Pheromone. This class does not need an image—we
    will draw the image programmatically.


    Exercise 11.25 Implement an updateImage method in the Pheromone class. Initially,
    this method should create an image with a white circle drawn onto it and set this
    as the actor''s image. The white circle should be partly transparent. Call this
    method from the constructor.


    Exercise 11.26 Give the pheromones an intensity attribute. That is, add an intensity
    field. The intensity of a pheromone object should start out at a defined maximum
    intensity and decrease in every cycle. When the intensity reaches zero, remove
    the pheromone object from the world. A drop of pheromone should evaporate in 180
    act cycles.


    Exercise 11.27 Modify your updateImage method, so that it makes use of the pheromone''s
    intensity. As the intensity decreases, the white circle representing it on screen
    should become smaller and more transparent. Make sure updateImage is called from
    the act method that we see the image change on screen.


    Exercise 11.28 Test your pheromones by placing them into the world manually and
    running your simulation.


    Now we have a pheromone class available that our ants can use. Now we only have
    to get the ants to use it. The first half of using pheromone is placing it into
    the world. The second half is noticing it and changing direction as a result.
    Let us do the first half first.'
