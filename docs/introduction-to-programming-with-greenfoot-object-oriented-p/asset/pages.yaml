  md: '# Chapter 6 Making music: an on-screen piano


    We have now reached a point where we can create a set of keys to play a range
    of notes. (Currently, we have only white keys, but we can build half a piano with
    this.) This version of the project is in the book scenarios as piano-3.


    Constructing all the keys, however, is a bit tedious. We have to create every
    piano key by hand, typing in all the parameters. What''s worse: every time we
    make a change to the source code, we have to start all over again. It is time
    to write some code to create the keys for us.


    ![](img/410f5f709c4688c1903940c91e75e8ab_131_0.png)


    # Building the piano


    We would now like to write some code in the Piano class that creates and places
    the piano keys for us. Adding a single key (or a few keys) is quite straightforward:
    by adding the following line to the Piano''s constructor, a key is created and
    placed into the world each time we re-initialize the scenario:


    ```

    addObject(new Key("g", "3a.wav"), 300, 180);

    ```


    Remember that the expression


    ```

    new Key("g", "3a.wav")

    ```


    creates a new key object (with a specified key and sound file), while the statement


    ```

    addObject(some-object, 300, 180);

    ```


    inserts the given object into the world at the specified x- and y-coordinates.
    The exact coordinates 300 and 180 are picked somewhat arbitrarily at this stage.


    **Exercise 6.11** Add code to your piano class so that it automatically creates
    a piano key and places into the world.


    **Exercise 6.12** Change the y-coordinate at which the key is placed, so that
    the piano key appears exactly at the top of the piano (that is: the top of the
    piano key should line up with the top of the piano itself). Hint: the key image
    is 280 pixels high and 63 pixels wide.


    **Exercise 6.13** Write code to create a second piano key that plays a middle-g
    (sound file "3q.wav") when the "f" key is pressed on the keyboard. Place this
    exactly to the left of the first key (without any gap or overlap).


    Earlier in this book, we have discussed the value of using separate methods for
    separate tasks. Creating all the keys is a logically distinct task, so let us
    place the code for it into a separate method. It will do exactly the same thing,
    but the code is clearer to read.'
