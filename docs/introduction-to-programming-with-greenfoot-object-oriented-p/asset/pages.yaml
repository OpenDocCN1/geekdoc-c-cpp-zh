    \ Explosion(), getX(), getY());\n        world.removeObject(this); // error: this\
    \ will not work\n    }\n}\n```\n\nWhen trying to compile this code, we can find\
    \ an error message that reads\n\ncannot find symbol - method gameOver()\n\nThis\
    \ message is trying to tell us that the compiler cannot find a method with this\
    \ name. We know, however, that such a method exists in our Space. We also know\
    \ that the getWorld() called here gives us a reference to our Space object. So\
    \ what is the problem?\n\nThe problem lies in the fact that the compiler is not\
    \ quite clever as we would like. The getWorld() method is defined in class Actor,\
    \ and its signature is:\n\ngetWorld()\n\nWe can see that it states it will return\
    \ an object of type World. The actual world that we return in our case is of type\
    \ Space.\n\nThis is not a contradiction: our object can be of type World and of\
    \ type Space at the same time because Space is a subclass of World (Space is a\
    \ World; we also say that the type Space is a subtype of World).\n\nThe error\
    \ comes from the difference between the two: gameOver is defined in class Space,\
    \ while it gives us a result of type World. The compiler only looks at the declared\
    \ return type of the method we are calling (getWorld()). Because of this, the\
    \ compiler searches for the gameOver method and does not find it. That's why we\
    \ get the error message.\n\nTo solve this problem, we need to tell the compiler\
    \ explicitly that the world we are receiving actually of type Space. We can do\
    \ this by using the cast construct we have seen earlier.\n\nSpace space = (Space)\
    \ getWorld();"
