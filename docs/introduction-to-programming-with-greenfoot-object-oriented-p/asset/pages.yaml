    # 6.3 Abstraction: creating multiple keys


    We have reached a stage where we can create a piano key that reacts to one on
    our computer keyboard and plays a single piano note. The problem now is obvious:
    we create multiple keys, which all react to the same keyboard key, and all produce
    the same note. We need to change that.


    The current limitation comes from the fact that *hard-coded* the keyboard key
    name ("g") and the sound file name ("3.wav") into our class. That means we used
    these names without a chance to change them without changing the source code and
    recompiling.


    When writing computer programs, writing code that can do one specific task—such
    as finding the square root of 1,764 or playing a middle-a piano sound—is not very
    useful. Generally, we like to write code that can handle a *class* of problems
    (such as finding the square root of any number, or playing a range of piano sounds).
    If we do this, our program becomes much more useful. We have seen an example of
    this in the previous chapter, when we parameterized our addScore method so that
    adding 20 points every time it was able to add any number of points. We need to
    do something similar now.


    The principle we shall use is called *abstraction*. Abstraction occurs in computing
    in many different forms and contexts—this is one of them.


    Concept

    Abstraction

    occurs in

    different forms

    in programming.

    One of them is

    the technique to

    write code

    that can solve

    a whole class

    of problems,

    rather a single

    specific problem.'
