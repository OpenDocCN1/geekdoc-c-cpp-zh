  md: "# Dealing with screen edges\n\nCalling methods that have return values (where\
    \ the return type is not void) are not issuing a command, but asking a question.\
    \ If we use the `isAtEdge` method, the method will respond with `true` (Yes!)\
    \ or `false` (No!). Thus, we can use this method to check whether we are at the\
    \ edge of the world.\n\n**Exercise 2.13** Create a crab. Right-click it, and find\
    \ the `boolean isAtEdge()` method. (It is in the \"Inherited from Actor\" submenu,\
    \ since the crab inherited this method from the `Actor` class). Call this method.\
    \ What does it return?\n\n**Exercise 2.14** Let the crab run to the edge of the\
    \ screen (or move it manually), and then call the `isAtEdge()` method again. What\
    \ does it return now?\n\nWe can now combine this with an `if-statement` to write\
    \ the code shown in Code 2.3.\n\n```\nimport greenfoot.*;\n\n/**\n * This class\
    \ defines a crab. Crabs live on the beach.\n */\npublic class Crab extends Actor\
    \ {\n    public void act() {\n        if (isAtEdge()) {\n            turn(17);\n\
    \        }\n        move(5);\n    }\n}\n```\n\nThe `if-statement` is part of the\
    \ Java language that makes it possible to execute commands only if some condition\
    \ is true. For example, here we want to turn only if we are at the edge of the\
    \ world. The code we have written is:\n\n```\nif (isAtEdge()) {\n    turn(17);\n\
    }\nmove(5);\n```\n\nThe general form of an `if-statement` is this:\n\n```\nif\
    \ (condition) {\n    instruction;\n    instruction;\n    ...\n}\n```"
