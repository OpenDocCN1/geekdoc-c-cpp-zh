    The words *int direction* tell us that this method expects one parameter of type
    *int*, which specifies a *direction*. A parameter is an additional bit of data
    we must provide for this method to run. Every parameter is defined by two words:
    first the parameter type (here: *int*) and then a name, which gives us a hint
    as what this parameter is used for. If a method has a parameter, we must provide
    this additional information when we invoke the method.


    In this case, the type *int* tells us that we should now provide a whole number,
