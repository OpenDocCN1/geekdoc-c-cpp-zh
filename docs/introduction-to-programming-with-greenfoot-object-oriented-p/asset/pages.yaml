  md: '# 5.2 WhiteCell: constrained movement


    When a method call (getX()) is written as a parameter to another method call (setLocation(..)),
    the inner method call is evaluated first, and the result is used as the parameter
    for the outer method call.


    Written like this, we would first retrieve our current x-coordinate, retrieve
    the current y-coordinate, and then set our location to these coordinates. Thus,
    this statement would have no visible effect: we position us where we are already.


    However, with one modification we can create:


    ```

    setLocation(getX(), getY()-4);

    ```


    Here, we retrieve our y-coordinate, subtract 4, and set the result as our new
    y-coordinate. We leave the x-coordinate unchanged. This places us four cells higher
    than where we were before.


    We have chosen this method of movement, instead of using the move() method as
    before, because this way is independent of turning. The move() method moves in
    the direction the object is facing, whereas we want to move always up or without
    changing our rotation.


    # Note: private versus public


    You may have noticed that we used the word private in the declaration of the checkKeyPress
    method:


    ```

    private void checkKeyPress()

    ```


    This is called a private method. Previously, we have declared all methods public.


    The keywords private and public are called access modifiers, and they determine
    who can see and call a method. When a method is public, it can be called from
    other classes in our program. When a method is private, it can be called only
    from methods within the same class. It will not be visible from outside.


    The purpose of private methods is to offer functionality to other parts of the
    system, so that our object can be called to do something. The purpose of private
    methods is to improve the structure of our code by breaking tasks down into smaller
    subtasks. They are not intended to be called from outside.


    From now on, we will declare methods private if they are intended to be called
    only internally. We will declare methods public if they are to be called from
    other classes.


    Variables will always be private. (Java allows them to be made public, but this
    is considered very bad style.)'
