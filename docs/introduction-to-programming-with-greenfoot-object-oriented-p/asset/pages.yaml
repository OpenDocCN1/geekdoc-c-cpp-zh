  md: '# CHAPTER 11


    # Simulations


    topics: simulations

    concepts: emergent behavior, experimentation


    In this chapter, we will discuss one type of software application in a little
    more detail: simulations.


    Simulations are fascinating examples of computing because they are highly experimental
    and potentially allow us to predict the future. Many types of simulations can
    be (and have been) developed for computers: traffic simulations, weather forecasting
    systems, economics simulations (simulations of stock markets), simulations of
    chemical reactions, nuclear explosions, environmental simulations, and many more.


    > Concept A simulation is a computer program that simulates phenomena from the
    real world. If simulations are accurate enough, we can learn things about the
    real world from observing them.


    We have seen one simulation in Chapter 8, in which we simulated part of a solar
    system. That simulation was a little too simplistic to accurately forecast trajectories
    of real planets, but there are some aspects of astrophysics that simulation may
    help us understand.


    In general, simulations may serve two different purposes: they can be used to
    study and understand the system they are simulating, or they can be used for forecasting.


    In the first case, the modeling of a system (such as the modeling of the stars
    and planets) may help us understand some aspects of how it behaves. In the second
    case, if we have an accurate simulation, we can play through "what if" scenarios.
    For example, we might have a traffic simulation for a city, and we observe that
    every morning a traffic jam develops at a certain intersection in the real city.
    How can we improve the situation? Should we build a roundabout? Or perhaps we
    should change the traffic light signal patterns? Or perhaps we should build a
    bypass?


    The effects of any of these interventions are often hard to predict. We cannot
    try out all these options in real life to see which is best, since that would
    be too disruptive and expensive. But we can simulate them. In our traffic simulation,
    we can try out each option and see how it improves traffic.'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'If the simulation is accurate, then the result we observe in the simulation
    will also be true in real life. But this is a big “if”: Developing a simulation
    that accurate enough is not easy, and it is a lot of work. But for many systems,
    it is possible to a useful degree.


    Weather forecasting simulations are now accurate enough that a one-day forecast
    is fairly reliable. A seven-day forecast, however, is about good as rolling dice:
    the simulations are just not good enough.


    When we simulate, it is important to be aware of the limitations: Firstly, simulations
    always have a degree of inaccuracy because we are not modeling the behaviors of
    the actors completely realistically, and because we may not know the exact state
    of the starting system.


    In addition, simulations necessarily model only part of reality, and we must be
    aware that parts parts out of our simulation might actually be relevant.


    In the example of our traffic jam, for instance, maybe the best solution is neither
    of the options mentioned above, but to provide better public transport or bicycle
    lanes to get cars off the road. If our simulation does not include that aspect,
    we would never find out just by using the simulation, no matter how accurate it
    is.


    Despite these limitations, however, even very simulations are fascinating to play
    with, and good simulations are incredibly useful. They are so useful, in fact,
    that almost all of the world''s fastest computers run simulations most, or at
    least a substantial part, of time.


    # Side note: Supercomputers


    A list of the fastest supercomputers in the world is regularly published on the
    Internet at http://www top500.org. Most of these are described in some detail,
    and for many of them, the list includes links to websites that describe their
    purpose and the kind of work they are used for.


    Reading this material, you can find that many are run by large research institutions
    or the military and that almost all are used to run simulations, often physics
    simulations. The military use these, for test nuclear explosions in simulations,
    and research institutions conduct many different science experiments this way.


    Simulations also have a special place in the history of object-oriented programming:
    Object orientation was invented explicitly to run simulations.


    The very first object-oriented programming language, named Simula, was designed
    in the 1960s by Kristen Nygaard and Ole-John Dahl at the Norwegian Computer Center
    in Oslo. As the name suggests, its purpose was to build simulations. All object-oriented
    programming languages today can be traced back to that language. Dahl and Nygaard
    received the 2001 Turing Award—computer science''s equivalent of the Nobel Prize—for
    this work.'
  merge: -1
