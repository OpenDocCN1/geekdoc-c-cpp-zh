    The next challenge is to make it move forward.


    # 9.4 Flying forward


    Our Rocket class is a subclass of the SmoothMover class, which we have already
    seen in the previous chapter. This means that it holds a velocity vector that
    determines its movement, and that it has a move() method that makes it move according
    to this vector.


    Our first step is to make use of this move() method.


    Exercise 9.23 In the Rocket''s act method, add a call to the move() method (inherited
    from SmoothMover). Test. What do you observe?


    Adding the call to move() to our act method is an important first step, but does
    nothing by itself. It causes the rocket to move according to its movement vector,
    but since we have not initiated any movement, this vector has length 0, so no
    movement takes place.


    To change this, let us first introduce a small amount of automatic drift, so that
    the rocket starts off with some initial movement. This makes it much more interesting
    to play the asteroids game, because it stops players from being able to just remain
    stationary for a long time.


    Exercise 9.24 Add a small amount of initial movement to the rocket. To do this,
    create a vector with some arbitrary direction and a small length (i for your own)
    and then use the SmoothMover''s addVelocity method with this vector as a parameter
    to add this force to the rocket. You can do this in the Rocket''s constructor.
    (Make sure to use an int as your first parameter in the Vector''s constructor,
    in order to use the correct constructor.)


    Test. If all went well, the rocket should drift all by itself when the scenario
    starts. Don''t make this initial drift too fast. Experiment until you have a nice,
    slow initial movement.


    Next, we want to add movement controls for the player. The plan is that pressing
    the "up" arrow key ignites the rocket''s booster and moves us forward.'
