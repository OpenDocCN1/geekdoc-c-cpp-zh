  md: '# Summary of programming techniques


    In this chapter, we have seen two very fundamental and important concepts for
    sophisticated programming: loops and arrays. Loops allow us to write code that
    executes a sequence of statements many times over. The loop construct we have
    discussed is called a while loop. Java has other loops as well, which we will
    encounter shortly. We will use loops in many of our programs, so it is essential
    to understand them.


    Within the loop, we often use the loop counter to perform calculations or to generate
    different values in every loop iteration.


    The other major new concept we used was an array. An array can provide many variables
    (all of the same type) in one single object. Often, loops are used to process
    an array if we need to do something to each of its elements. Elements are accessed
    using square brackets.


    Another very fundamental technique we encountered was abstraction. In this case,
    it appeared through the use of constructor parameters to create code that could
    handle a whole class of problems instead of a single specific problem.


    We have also encountered a few new operators: we have seen the AND and NOT (&&
    !) operators for boolean expressions, and we have again encountered string concatenation
    using the plus operator (+) on String operands. The String class is documented
    in the Java API documentation and has many useful methods.


    # Concept summary


    +   - **Logic operators**, such as && (AND) and || (NOT) can be used to combine
    multiple boolean expressions into one boolean expression.


    +   - **Abstraction** occurs in many different forms in programming. One of them
    is the technique to write code that can solve a whole class of problems, rather
    than a single specific problem.


    +   - **Loop** is a statement in programming languages that can execute a section
    of code multiple times.


    +   - **Loop variable** is a local variable that is used for counting the number
    of iterations in a loop. For a while loop, it should be declared immediately before
    the loop.


    +   - **Array** is an object that holds multiple variables. These can be accessed
    using an **index**.


    +   - **Individual elements** in an array are accessed using square brackets ([])
    and an **index** to specify the array element.


    +   - The type **String** is defined by a normal class. It has many useful methods,
    which we can look up in the Java library documentation.'
