    # 13.8 Map


    The last scenario we present here is called maps (Figure 13.8). It displays a
    map on the world background and has buttons to zoom in and out.


    The interesting aspect of this class is that it uses live data accessed via the
    Internet (in this case, the map data). The map image is not fixed; it is not built
    into this scenario but is retrieved at runtime from the Google maps online service.
    (This also means, that this scenario will only work on a computer connected to
    the Internet.)


    In its current form, the map is centered on the University of Kent in England,
    but this is easy to change. Look into the MapViewer class and you will find in,
    comments, vari-ous examples of other locations you can try. You, in general, use
    any sufficient textual name of a location, be that the name of a country, a city,
    or a landmark, or you can use latitude and longitude coordinates.


    The implementation is quite simple because it makes use of a ready-made Map helper
    class, and this is where the hard work is hidden.


    The map helper class is one of the classes provided with Greenfoot: You can access
    it via the Import Class... function in the Edit menu of Greenfoot''s main window.


    In general, accessing live data from the Internet can make for some really interesting
    examples. From the same menu (Import Class...) you can also import another helper
    class Weather, which gives you live, real-time weather data retrieved from an
    online service.'
