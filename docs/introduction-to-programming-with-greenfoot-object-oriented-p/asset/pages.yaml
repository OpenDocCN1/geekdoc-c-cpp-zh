    # Side note: Scope coloring and indentation


    When you look at source code in Greenfoot or in the colored examples in this book
    (for instance, Code 2.3), you will notice the colored boxes used for the background.
    These are called scopes. A scope is the extent of a given Java construct. In Greenfoot,
    different kinds of construct have been different colors: a class is green, for
    example, a method is yellow, and an if-statement is a purple-grey. You see that
    these scopes can be nested: an if-statement is inside a method. a method is inside
    a class.


    Paying attention to these colored scopes over time; they can help you avoid some
    common errors. Scopes are usually defined in your code by a pair of brackets (usually
    with a header above the opening bracket that defines what kind of scope we are
    looking at). It can happen very easily to get the brackets out of balance—to have
    more opening than closing, or vice versa. If this happens, your program will not
    compile.


    Scope coloring helps you detect a problem. You will get used to what the scopes
    should look like quite quickly, and you will notice that it just looks wrong when
    a bracket is mismatched.


    Hand-in with scope colors goes indentation.


