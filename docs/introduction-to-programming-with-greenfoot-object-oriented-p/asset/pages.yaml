  md: '# Figure 13.3

    Boids: a simulation of flocking behavior


    ![](img/410f5f709c4688c1903940c91e75e8ab_261_0.png)


    The term “boids” comes from a program developed in 1986 by Craig Reynolds that
    first implemented this flocking algorithm. In it, each bird flies according to
    three rules:


    +   - Separation: steer away from other birds if getting too close.


    +   - Alignment: steer toward the average heading of other birds in the vicinity.


    +   - Cohesion: steer to move toward the average position of other birds in the
    vicinity.


    With this algorithm, the birds develop movement that is pleasant to watch. Included
    in this scenario is also obstacle avoidance: trying not to fly into trees.


    A version of this algorithm was used, for example, in Tim Burton''s 1992 film
    Batman Returns to create animation for computer-generated swarms of bats and penguin
    flocks, and in the Lord of the Rings films to create the movement of the Orcs.


    The version for this book was written by Poul Henriksen.


    You can find out much more about this by searching the Web for “boids.” And while
    this scenario currently does nothing than show the movement, one feels that there
    has to be a game in it somewhere.'
