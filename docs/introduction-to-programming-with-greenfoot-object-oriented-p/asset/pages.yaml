    **Exercise 11.16** Consult the API documentation for the standard Java class library.
    Find the documentation for class Random from the java.util package. Objects of
    this class are random number generators that are more flexible than Greenfoot''s
    getRandomNumber. The method of interest to us is the one that returns numbers
    in a Gaussian distribution (also called a “normal distribution”). What is the
    method''s name, and what does it do?


    **Exercise 11.17** In your Food, change your placement of food crumbs in the image
    to make use of a Gaussian distribution of random numbers. If you have to use a
    java.util.Random object to create the random numbers, instead of Greenfoot.getRandomNumber.


    > Side note: Random distributions

    If we need behavior in our programs, it is sometimes important to think about
    what kind of random distribution we need. Many random functions, such as the Greenfoot.randomNumber
    produce a uniform distribution. In this, the chance of every possible result occurring
    the same. The Gaussian random number function gives a normal distribution. This
    is one in which the average results are more likely to occur, and more extremes
    are rarer.

    If we, for a dice game, we need a uniform distribution. Each side of the die is
    evenly likely to come up. On the other hand, if we model the speed of cars in
    a traffic simulation, a normal distribution would be better. Most cars are driving
    somewhere close to the average speed, and few cars are very slow or very fast.


