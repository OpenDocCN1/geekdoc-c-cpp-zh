  md: "# Concept\n\nMethods that belong to classes (as opposed to objects) are marked\
    \ with the keyword static in their signature. They are also called class methods.\n\
    \n# Note: Static methods\n\nMethods may belong to objects or classes. When methods\
    \ belong to a class, we write\n\n```\nclass-name.method-name (parameters);\n```\n\
    \nto call the method. When methods belong to an object, we write\n\n```\nobject.method-name\
    \ (parameters);\n```\n\nto call it.\nBoth kinds of methods are defined in a class.\
    \ The method signature tells us whether a given method belongs to objects of that\
    \ class, or to the class itself.\n\nMethods that belong to the class itself are\
    \ marked with the keyword static at the beginning of the method signature. For\
    \ example, the signature of Greenfoot's getRandomNumber method is\n\n```\nstatic\
    \ int getRandomNumber(int limit);\n```\n\nThis tells us we must write the name\
    \ of the class itself (Greenfoot) before the dot in the method call.\nWe will\
    \ encounter calls to methods that belong to other objects in a later chapter.\n\
    \nWe let say we want to program our crab so that there is a 10 percent chance\
    \ at every step that the crab turns a little off course. We can do the main part\
    \ of this with an if-statement:\n\n```\nif (something-is-true)\n{\n    turn(5);\n\
    }\n```\n\nNow we have to find an expression to put in place of something-is-true\
    \ that returns true in exactly 10 percent of the cases.\n\nWe can do this using\
    \ a random number (using the Greenfoot.getRandomNumber method()) and the less-than\
    \ operator compares two numbers and returns true if the first is less than the\
    \ second. \"Less-than\" is written using the symbol \"<\". For example:\n\n```\n\
    2 < 33\n```\n\nis true, while\n\n```\n162 < 42\n```\n\nis false."
