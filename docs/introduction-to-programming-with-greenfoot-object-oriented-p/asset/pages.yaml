  md: "# 6.5 Using loops: the while loop\n\nExercise 6.14 In the Piano class, create\
    \ a new method named makeKeys(). Move your code that creates your keys into this\
    \ method. Call this method from the Piano’s constructor. Make sure to write a\
    \ comment for your new method.\n\nWe could now go ahead and insert a whole list\
    \ of addObject statements to create all the keys we need for our keyboard. That\
    \ is, however, not the best way of achieving what we want to do.\n\n# Using loops:\
    \ the while loop\n\nProgramming languages offer you a specific construct to do\
    \ a similar task repeatedly: a loop.\n\nA loop is a programming language construct\
    \ that allows us to express commands such as “Do this statement 20 times” or “Call\
    \ these two methods 3 million times” easily and concisely (without writing 3 million\
    \ lines of code). Java has several kinds of loop. The one we will investigate\
    \ is called a while loop.\n\nA while loop has the following form:\n\n```\nwhile\
    \ ( condition )\n{\n    statement;\n    statement;\n    ...\n}\n```\n\nThe Java\
    \ keyword while is followed by a condition in parentheses and a block (a pair\
    \ of curly brackets) containing one or more statements. These statements will\
    \ be executed over and over, as long as the condition is true.\n\nA very common\
    \ pattern is a loop that executes some statements given a number of times. To\
    \ do this, we use a loop variable as a counter. It is common practice to name\
    \ a loop variable i, so we should do this as well. Here is an example that executes\
    \ the body of the while loop 100 times:\n\n```\nint i = 0;\nwhile (i < 100)\n\
    {\n    statement;\n    statement;\n    ...\n    i = i + 1;\n}\n```"
