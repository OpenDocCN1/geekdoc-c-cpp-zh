  md: "These convenience methods work in very similar ways to the method they are\
    \ based on, but they return a single actor instead of a list of actors. In cases\
    \ where multiple other actors could be found (for example, several other actors\
    \ intersect with ours at the same time), the variant returning all the relevant\
    \ actors. The variant returning a single actor randomly picks one of the intersecting\
    \ actors and returns that.\n\nThe purpose of these convenience methods is just\
    \ to simplify code: Often we are only interested in a single intersecting actor.\
    \ In those cases, the convenience method allows us to handle the actor without\
    \ having to use a list.\n\n# C.3 Low versus high resolution\n\nAs we have seen\
    \ throughout this book, the resolution (cell size) of Greenfoot worlds can vary.\
    \ This is relevant for collision detection, where we will often use different\
    \ methods, depending on the resolution.\n\nWe distinguish two cases: low-resolution\
    \ worlds, where the entire actor image is completely contained within a single\
    \ cell (Figure C.1a) and high-resolution worlds, where the image of an actor spans\
    \ multiple cells (Figure C.1b).\n\n![](img/410f5f709c4688c1903940c91e75e8ab_277_0.png)\n\
    \na) a low-resolution world\n\nb) a high-resolution world\n\n# C.4 Intersecting\
    \ objects\n\nMethods:\n\n+   * List getIntersectingObjects(Class cls1)\n  Return\
    \ all the objects that intersect this object.\n\n+   * Actor getOneIntersectingObject(Class\
    \ cls1)\n  Return an object that intersects this object."
