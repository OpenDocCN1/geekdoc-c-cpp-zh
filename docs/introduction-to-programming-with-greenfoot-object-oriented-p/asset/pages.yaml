  md: '# Painting with your hands


    The examples we have seen so far were mostly ready when we opened them, and we
    have used them to study some basic techniques. There was not much for us to do.


    Now that we have a basic understanding of the Kinect''s interface, we can start
    by writing some code of our own. Our next goal is to write a scenario that lets
    us paint on the screen using our hands and feet (Figure 12.7).


    Exercise 12.17 Open the body-paint-start scenario. Run it. Try out what it does.


    As we begin by using a starting scenario, body-paint-start, that contains some
    rudimentary code. Trying it out, we can see that it currently behaves very similar
    to the stick-figure example.


    The first visible difference is that there is a new class: Canvas.


    The scenario is set up so that separate canvas object is created for every user
    that is currently tracked. Each canvas object has a transparent image the size
    of the full screen. Since the image is initially empty (fully transparent) it
    is invisible, but this essentially gives every user a separate layer to draw on
    (Figure 12.8).


    Code 12.3 shows how this is achieved. A new (empty) GreenfootImage is created
    and set as the actor''s image. We can see that the image''s paint color is a random
    color, so that future drawing operations start off with (probably) different colors
    for different users.


