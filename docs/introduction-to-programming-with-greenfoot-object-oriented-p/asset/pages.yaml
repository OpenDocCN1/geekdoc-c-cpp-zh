  md: 'In our constructor code above, you find the new Crab() instruction as the right
    half of the first line we inserted.


    When we create a new object, we have to do something with it. In our case, *assign
    it to a variable.*


    #  4.3 Variables


    In programming, we often need to store some information to remember and use it
    later. This is done by using *variables*.


    A variable is a bit of storage space. It always has a name to refer to it. When
    we draw diagrams of our objects or code fragments, we usually draw variables as
    white boxes with their name to the left side.


    Figure 4.2, for example, shows a variable called age. (We might want to store
    the age of the crab)


    ![](img/410f5f709c4688c1903940c91e75e8ab_76_0.png)


    Variables also have a *type*. The type of a variable states what kind of data
    can be stored in it. For example, a variable of type int can store whole numbers,
    a variable of type boolean can store true/false values, and a variable of type
    Crab can store crab objects.


    In our source code, when we need a variable, we can create one by writing a *variable
    declaration*. A variable declaration is very simple: we just write the type and
    the name of the variable we want, followed by a semicolon. For example, if we
    want an age variable as shown in Figure 4.2 to store whole numbers, we can write


    ```

    int age;

    ```


    This will create our age variable, ready to store int values.


    #  4.4 Assignment


    Once we have a variable, we are ready to store something in it. This is done using
    an *assignment statement*.


    An assignment is a Java instruction written as an equal sign: =


    For example, to store the number 12 into our age variable, we can write


    ```

    age = 12;

    ```


    It is best to read assignment statements from left to right: *The value 12 is
    stored into the age variable. After this assignment statement is executed, our
    variable will hold the value we assigned.* In our diagrams, we show this by writing
    the value into the white box (Figure 4.3).'
