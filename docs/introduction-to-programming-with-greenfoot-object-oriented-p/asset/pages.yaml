    # Summary


    In this chapter, we have connected Greenfoot to the Microsoft Kinect. Apart from
    giving us a chance to create a number of really interesting examples, we have
    seen that programming with hardware devices does not look so different from what
    we encountered before. We use the same programming techniques—method calls, variables,
    parameters, types—as in earlier chapters.


    When we program with external devices, we are usually given an API—program interface—consisting
    of a number of classes and methods to access the device. Learning to use the device
    then is a matter of studying that API and understanding what it lets us do. After
    that, all we need are our general Java and programming skills to write some programs.


    # Concept summary


    +   - tracking is the identification and tracking of some known points on a body,
    such as hands, elbows, head, feet, and so on.


    +   - Communication with hardware components is typically arranged through some
    driver software.


    +   - Tracked users are those currently recognized and analyzed by the Kinect
    hardware.


    # Drill and practice


    Here are some more exercises you can do with our last example, kinect-pong. Of
    course, you can extend any of the other examples as well, but we will leave it
    up to you to come up with ideas for those.'
