  md: '# CHAPTER


    # 5


    # Scoring


    | topics | constrained movement, displaying text messages, keeping score, object
    interaction |

    | concepts | Strings, String concatenation, abstraction (first look), casting,
    this (keword) |


    One obvious element that is missing from our crab example is keeping score. We
    have done a part of it: the crab internally keeps track of the worms it has eaten,
    using an integer variable. We have seen that variables are an important part of
    keeping a score, but this is not a complete solution. Firstly, we might want other
    actions to contribute to gaining or losing points, and secondly, we have not yet
    displayed the score on the screen. To get some variety, we shall discuss this
    with a different example. After reading this chapter, you can, if you like, go
    back to the crab game and add a scoring system there as well—you shall learn how
    to do this by the end of this chapter.


    For this discussion, we shall use a scenario called "WBC" (for "White Blood Cell,
    Figure 5.1). This is a little game where we control a white blood cell floating
    in the bloodstream of some creature, and we have the job to catch and remove bacteria.
    To make things a bit more interesting, there are viruses, and we imagine that
    our type of white blood cell can only neutralize bacteria but not viruses. The
    virus is strong for us and our cells, so it must be avoided.


    This chapter is divided into three parts: first we have a quick look at the starting
    scenario and analyze it (Sections 5.1 to 5.4), then add some more objects and
    functionality, using techniques we have already encountered in previous chapters
    (Sections 5.5 to 5.10). We shall go over these parts fairly quickly, since we
    have covered the concepts before. Lastly, we shall move on to investigate some
    new constructs with the scoring.'
