  md: "# The if/else statement\n\nBefore moving on, let us investigate the if-statement\
    \ again in some more detail. As we have just seen, an if-statement can be written\
    \ in the form both\n\n```\nif ( condition )\n{\n    statements;\n} else\n{\n \
    \   statements;\n}\n```\n\nThis if-statement contains two blocks (pairs of curly\
    \ brackets surrounding a list of statements): the if-clause and the else-clause\
    \ (in this order).\n\nWhen this if-statement is executed, the first condition\
    \ is evaluated. If the condition is true, the if-clause is executed, and then\
    \ execution continues below the else-clause. If the condition is false, the if-clause\
    \ is not executed; instead we execute the else-clause. Thus, one of the two statement\
    \ blocks is executed, but never both.\n\nThe else part with the second block is\
    \ optional—leaving it leads to the shorter version of the if-statement we have\
