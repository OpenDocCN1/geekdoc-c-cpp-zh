  md: '# 4.10


    # Greenfoot images


    Greenfoot provides a class called GreenfootImage that helps in using and manipulating
    images. We can obtain an image by constructing a new GreenfootImage object—using
    Java''s new keyword—with the file name of the image file as a parameter to the
    constructor. For example, to access the crab2.png image, we can write


    ```

    new GreenfootImage("crab2.png")

    ```


    Concept Greenfoot actors maintain their visible image by holding an object of
    type Greenfootimage


    The file name we must exist in the scenario''s folders. All Greenfoot actors have
    images. By default, actors get their image from their class We assign an image
    to the class when we create it, and every object created from that class will
    receive, upon creation, a copy of that same image. That does not mean however,
    that all objects of the same class must always keep the same image. Every individual
    actor can decide to change its image at any time.


    Exercise 4.15 Check the documentation of the Actor class. There are two methods
    that allow us to change an actor''s image. What are they called, and what are
    their parameters? What do they return?


