    # Summary


    In this chapter, we have seen what Greenfoot scenarios can look like, and how
    to interact with them. We have seen how to create objects, and how to communicate
    with these objects by invoking their methods. Some methods were commands to the
    object, while other methods returned information about the object. Parameters
    are used to provide additional information to methods, while return values pass
    information back to the caller.


    Objects were created from their classes, and source code controls the definition
    of the class (and with this, the behavior and characteristics of all the class''s
    objects).


    We have seen that we can change the source code using an editor to make changes.
    After editing the source, classes need to be recompiled.


    We will spend most of the rest of the book discussing how to write Java source
    code to create scenarios that do interesting things.


    # Concept summary


    +   - Greenfoot scenarios consist of a set of classes.


    +   - Many objects can be created from a class.


    +   - Objects have methods. Invoking these performs an action.


    +   - The return type of a method specifies what a method call will return.


    +   - A method with void return type does not return a value.


    +   - Methods with void return types represent commands, methods with non-void
    return types represent questions.'
