  md: 'Exercise 9.62 Prepare for this new functionality: In class ProtonWave, add
    a method stub for a method called checkCollision. The method has no parameters
    and does not return a value. Call this method from your act method.


    Exercise 9.63 The purpose of this new method is to check whether the wave touches
    an asteroid, and cause damage to if it does. Write the method comment.


    This time we do not want to use the getIntersectingObjects method, since the invisible
    image areas at the corners of the proton wave image (included in the bounding
    box, not part of the blueish circle) are fairly large, and asteroids would be
    destroyed long before the wave seems to reach them.


    Instead, we will use another collision detection method, called getObjectsInRange.


    The getObjectsInRange method returns a list of all objects within a given radius
    of the calling object (see Figure 9.4). Its signature is


    ```

    List getObjectsInRange(int radius, Class cls)

    ```


    When called, we can specify the class of objects we are interested in (as before),
    and we also specify a radius (in cells). The method will then return a list of
    all objects of the requested class that are found within this radius around the
    calling object.


    To determine which objects are within the range, the center points of objects
    are used. For example, an asteroid would be within range 20 of a rocket if the
    distance of its center point to the center point of the rocket is less than 20
    cell width. The size of the image is not relevant for this method.


    Using this method, we can implement our checkCollision method.


    ![](img/410f5f709c4688c1903940c91e75e8ab_194_0.png)'
