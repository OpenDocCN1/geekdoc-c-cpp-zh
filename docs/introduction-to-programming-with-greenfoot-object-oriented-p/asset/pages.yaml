  md: "The final thing to add is for ants to smell the pheromones, and change their\
    \ direction movement when they do.\n\nIf an ant smells a drop of pheromone, it\
    \ should walk away from its home hill for some limited time. If it does not find\
    \ or smell a new drop of pheromone after some time, then it should revert to random\
    \ walking. Our algorithm for searching for food might look something like this:\n\
    \n```\nif (we recently found a drop of pheromone) {\n    walk away from home;\n\
    }\nelse (we smell pheromone now) {\n    walk towards the center of the pheromone\
    \ drop;\n    if (we are at the pheromone drop center) {\n        note that we\
    \ found pheromone;\n    }\n}\nelse {\n    walk randomly;\n}\ncheck for food;\n\
    ```\n\nWhen implementing this in your own scenario, remember to create a separate\
    \ method for each distinct task. That way, your code will remain well structured,\
    \ easy to understand, and easy to modify.\n\n**Exercise 11.31** Implement the\
    \ functionality discussed above in your scenario: When ants smell pheromones,\
    \ they walk away from their home hill for the next 30 steps, before reverting\
    \ to their default behavior.\n\nIf you completed this exercise, your ant simulation\
    \ is more or less complete (as much as any software application is ever complete).\
    \ If you run your scenario now, you will see ants paths to the food sources.\n\
    \n# Path forming\n\nOne interesting aspect of this scenario is that there is no\
    \ code anywhere in the project that talks about forming paths. The behavior of\
    \ the individual ants is quite simple: \"If you have, go home; if you smell pheromones,\
    \ go away; otherwise go-where.\" However, together, the ants display some fairly\
    \ sophisticated behavior: They form stable paths, refreshing the pheromones as\
    \ they evaporate, and efficiently transport food back to their ant.\n\nThis is\
    \ known as *emergent behavior*. It is behavior that is not programmed into any\
    \ individual actor, but system behavior that emerges from the interactions of\
    \ many (fairly simple) actors."
