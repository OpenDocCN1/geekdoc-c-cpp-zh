  md: '# Java operators


    D.2.1 Arithmetic expressions


    Java has a considerable number of operators available for both arithmetic and
    logical expressions. Table D.1 shows everything that is an operator, including
    operations such as type casting and parameter passing. Most of the operators are
    either binary operators (taking a left and a right operand) or unary operators
    (taking a single operand). The main binary arithmetic operations are:


    +   + addition

    - subtraction

    * multiplication

    / division

    % modulo or remainder-after-division


    The results of division and modulo operations depend on whether their operands
    are integers or floating point values. Between two integer values, division yields
    an integer result and discards any remainder, but between floating point values
    a floating point value is the:


    +   5 / 3 gives a result of 1

    5.0 / 3 gives a result of 1.6666666666666667


    (Note that only one of the operands needs to be of a floating point type to produce
    a floating point result.)


    When more than one operator appears in an expression, rules of precedence determine
    the order of application. In Table D.1 those operators having the highest precedence
    appear at the top, so we can see that multiplication, division, and modulo take
    precedence over addition and subtraction, for instance. This means that both of
    the following examples give the result 100:


    +   51 * 3 - 53

    154 - 2 * 27


    Binary operators with the same precedence level are evaluated from left to right
    and unary operators with the same precedence level are evaluated to left.


    When it is necessary to alter the normal order of evaluation, parentheses can
    be used. So both of the following examples give the result 100:


    +   (205 - 5) / 2

    2 * (47 + 3)


    The main unary operators are -, +, !, ~, [ ] and new. You will notice that ++
    and appear in both of the two rows in Table D.1. Those in the top row take a single
    operand on their left, while those in the second row take a single operand on
    their right.'
