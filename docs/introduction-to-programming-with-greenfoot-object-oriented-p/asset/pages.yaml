    4 Finishing the crab game


    | topics | world initialization, setting images, animating images |

    | concepts | constructors, state, variables (instance variables and local variables),
    assignment, new (creating objects programmatically) |


    In this chapter, we will finish the crab game. "Finish" here means that this is
    where we stop discussing this project in this book. Of course, a game is never
    finished—you can always think of more improvements that you can add. We will suggest
    some ideas at the end of this chapter. First, however, we will discuss a number
    of improvements in detail.


    # 4.1 Adding objects automatically


    We are now getting close to having a playable little game. However, a few more
    things need to be done. The first problem that should be addressed is the fact
    that we always have to place the actors (the crab, lobsters, and worms) manually
    into the world. It would be better if that happened automatically.


    There is one thing that happens automatically every time we successfully compile:
    the world itself is created. The world object, as we see it on (the sand-colored
    square area), is an instance of the Crabworld class. World instances are treated
    in a special way in Greenfoot: while we have to create instances of our actors
    ourselves, the Greenfoot system always automatically creates one instance of our
    world class and displays that instance on screen.


    Let us have a look at the Crabworld''s source code (Code 4.1). (If you do not
    have your crab game at this stage, use little-crab-4 for this chapter.)'
