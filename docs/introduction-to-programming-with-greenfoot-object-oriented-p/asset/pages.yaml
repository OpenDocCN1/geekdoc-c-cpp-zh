  md: '# Interlude 2

    The Greeps competition


    We will take a little time out for a second interlude—a break in the chapter sequence
    to do something a little different. This time, we will look at “Greeps”—a programming
    competition.


    The Greeps are alien creatures. And they''ve come to Earth! One of the important
    things to know about Greeps is that they like tomatoes. They have landed with
    their spaceship and are swarming out to find and collect tomatoes (Figure I2.1).


    The challenge in this programming competition will be to program your Greeps so
    that they find and collect tomatoes as quickly as possible. You will have limited
    time, and every tomato you manage to bring back to the spaceship scores a point.


    You can do this project as a competition against a friend who programs their own
    Greeps, or you can do it as a contest for a whole group of programmers, such as
    a school class. If you are on your own, you could post your entry to the Greenfoot
    website and


