    At what point does something go wrong, and what is the error message?


    The reason this does not work is that we are calling the getX() and getY() methods
    after removing the rocket from the world. When an actor is removed from the world,
    it does not have any coordinates anymore—it has coordinates only while being in
    the world. Thus, the getX() and getY() methods calls fail in this example.


    This can easily be fixed by switching the last two lines of code: Insert the explosion
    first, and then remove the rocket from the world.


