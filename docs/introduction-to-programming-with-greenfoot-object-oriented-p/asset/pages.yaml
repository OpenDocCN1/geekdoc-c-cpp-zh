  md: 'In place of the condition can be any expression that is either true or false
    (such as isEdge() method call), and the instructions will only be executed if
    the condition is true. There can be one or more instructions.


    If the condition false, the instructions are just skipped, and execution continues
    under the curly bracket of the if-statement.


    Note that your move(5) method call is outside the if-statement, so it will be
    executed in any case. In other words: if we are at the edge of the world, we turn
    and then move; if we are not at the edge of the world, we just move.


