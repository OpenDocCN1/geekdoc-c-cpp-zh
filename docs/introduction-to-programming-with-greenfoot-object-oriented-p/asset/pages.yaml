  md: '# 10.6 More control: the GreenfootSound class | 191


    Sometimes the default setting for sound recording programs are even higher (for
    example 32 bit, and a higher sample rate), and this is much higher quality than
    what is needed for simple sound effects. (We want this quality for listening to
    music that we like, but we don''t need it for a short Bang! sound effect.) In
    general, you should consider saving your sounds in lower quality, unless you feel
    need more.


