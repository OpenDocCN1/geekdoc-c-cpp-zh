  md: '# Chapter 11 Simulations


    Enough introduction—let''s get our hands on the keyboard again and try out some
    things.


    In this chapter, we will look at one simulation fairly briefly and then work on
    another in more detail. We have now reached a stage where more work will be up
    to you to complete: We will discuss the outline of the tasks to implement, and
    you may have to work out the details yourself.


    # Foxes and rabbits


    The first simulation we investigate is called foxes-and-rabbits (Figure 11.1).
    It is a typical example of a class of simulations called predator-prey-simulations—a
    type of simulation in which one chases (and eats) another. In our case, the predator
    is a fox and the prey is a rabbit.


    The idea here is as follows: The scenario shows a field that contains populations
    of foxes and rabbits. Foxes are represented by blue squares, and rabbits are shown
    as yellow squares.


    Both species have fairly simple behavior: Rabbits move around and—if they are
    old enough—may produce offspring. There is a set probability at each step for
    rabbits to reproduce. There are two ways in which rabbits may die: They may die
    of old age or they may be eaten by a fox.


    Foxes move and breed in a manner similar to rabbits (although they breed less
    frequently and have fewer young ones). One additional thing, however, they do


    Figure 11.1

    The foxes-and-rabbits simulation


    ![](img/410f5f709c4688c1903940c91e75e8ab_225_0.png)'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'is hunt. If they are hungry and they see a rabbit sitting next to them, they
    will move to eat the rabbit.


    Foxes can also die in two different ways: They can die of old age and they can
    starve. If they do not find a rabbit to eat for some time, they will die. (Rabbits
    are assumed to always find sufficient amounts of food.)


    **Exercise 11.1** Open the foxes-and-rabbits scenario. Run it. Explain the patterns
    of populations and movement you see emerging in the field.


    **Exercise 11.2** You will notice that this scenario shows a second small window
    with a population graph. One curve shows the number of foxes, the other the number
    of rabbits. Explain the shape of these graphs.


    As we can see, the simulation is highly simplistic in many ways: Animals do not
    have to meet mates to reproduce (they can do all on their own), food sources for
    rabbits are not included in the simulation, other factors of death (such as diseases)
    are ignored, and so on. However, the parameters that we simulate are already fairly
    interesting, and we can do experiments with them.


    **Exercise 11.3** Are the current populations stable? That is, do they always
    continue to run without one of the species dying out? If species become extinct,
    what is the average time they survive?


    **Does the *size of the field matter*?** For example, imagine we have a national
    park with an endangered species. And someone wants to build a freeway through
    the middle of it that the animals cannot cross, essentially dividing the park
    into two parks of half the size. The proponents of the freeway might argue that
    this does not matter because the total size of parkland is about the same as before.
    The park authority might argue that this is bad because it halves the size of
    each park. Who is right?**Does the size of a park matter?** Do some experiments.


    **Exercise 11.4 The Field** class has definitions of constants to the top of its
    source code for its width and height. Modify these constants to change the size
    of the field. Does the size of the field affect the stability of the populations?
    Species die out more easily if the field is smaller or larger? Or does it make
    no difference? Try with very small and larger fields.


    Other parameters with which we can experiment are defined in constants the top
    of the Rabbit and Fox classes. Rabbits have definitions for their maximum age,
    the age from which they can breed, the frequency of breeding (defined as a probability
    for each step), and the maximum size of their litter when they breed. Foxes have'
