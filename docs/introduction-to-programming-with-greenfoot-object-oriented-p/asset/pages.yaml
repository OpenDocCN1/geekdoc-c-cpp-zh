    # Adding borders


    We will make one last cosmetic improvement before moving on to the more interesting
    new material: adding borders at the sides of the screen.


    The main reason is to deal with an annoying effect in Greenfoot, objects are positioned
    by specifying the coordinate of the center of the object''s image. Therefore,
    when we place a new object on the right edge of the screen, half of it suddenly
    appears at once, instead of moving in slowly from the side. The same problem exists
    at the other end when disappearing: Objects appear when half their image is visible
    on screen. This makes our objects look a bit jerky. It does not like.


    To deal with this problem, we use a simple trick: we place black border objects
    on the left and right sides of our screen to cover the problematic space. This
    is intended to look as if we are looking at our blood stream through a microscope
    (see Figure 5.1). The objects will now appear behind the borders, out of view,
    and then slowly move into view.


    Exercise 5.25 Create a new Actor subclass called Border. There is a prepared image
    for it.


    > There is another way we could deal with this problem: we could create an unbounded
    world, which would allow us to place actors outside of the world boundary, and
    then slowly move them in. This can be done by invoking another World1d super constructor,
    however, this gets more complicated, and we will not do this here.'
