  md: '# # CHAPTER 10 Creating images and sound


    **topics:** creating sounds, creating images, dynamic image changes, handling
    mouse input

    **concepts:** sound formats, sound quality parameters, image file formats, RGBA
    color model, transparency


    Many of the scenarios we have encountered previously were interesting not only
    because of the program code that defined their behavior, but also because they
    made effective use of sound and images. So far, we have not discussed the production
    of these media files much and have often relied on existing pictures and sounds.


    In this chapter, we will learn about some aspects of creating and managing media
    files. We will start with some background about sound in computer programs, followed
    by various techniques to create and handle images.


    As a side effect, we will also encounter dealing with mouse input.


    # ## 10.1 Preparation


    In contrast to previous chapters, we will not build a complete scenario here but
    work through smaller exercises that illustrate separate techniques that can then
    be incorporated into a wide variety of different scenarios. The first sequence
    of exercises guides us through creating a scenario that plays a sound—which we
    create ourselves—when the user clicks on an actor.


    For these exercises, we shall not use a prepared, partly implemented starting
    scenario but create a new one from scratch.


    **Exercise 10.1** As a preparation for the exercises in this chapter, create a
    new scenario. You can call it anything you like.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'You will see that the new scenario automatically includes the World and Actor
    super-classes, but no other classes.


    Exercise 10.2 Create a subclass of World. Call it HelloWorld. You can give it
    any background image you like. Compile.


    Exercise 10.3 Change the size and resolution of the world so that it has a cell
    size of one pixel, and a size of 400 cells width and 300 cells height.


    Exercise 10.4 Create an Actor subclass in your scenario. At this stage, it does
    not matter much what it is. You may like to look through the available library
    images shown in the New class dialog, and choose one that looks interesting. Name
    your class appropriately. (Remember: Class names should start with a capital letter).


    Exercise 10.5 Add code to your HelloWorld that automatically places an instance
    of your actor into the world.


    Exercise 10.6 Write code into your actor''s act method that moves the actor 10
    pixels to the right every time it acts.


    You should have a scenario with an actor that moves to the right when you run
    it. Movement, however, is not our main goal here. We added movement only to have
    an initial visual effect to experiment with.


    The next step in our preparation will be to make the actor react to mouse clicks.


    Exercise 10.7 In class Greenfoot, there are several methods that can handle mouse
    input. What are they? Look them up in the Greenfoot Class Documentation and write
    them down.


    Exercise 10.8 What is the difference between mouseClicked and mousePressed?


    When we want to react to mouse clicks, we can use the mouseClicked method from
    the Greenfoot class. This method returns a boolean and can be used as a condition
    in an if-statement.


    The parameter to the mouseClicked method can specify an object that we wish to
    check, and the method will return true if it was clicked. We can pass null as
    the parameter if we do not care where the mouse was when it was clicked—the method
    will then return true if the mouse was clicked anywhere.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Exercise 10.9 Modify the code in your Actor class so that it only moves to
    the right in reaction to a mouse click. The mouse click can be anywhere in the
    world.


    Exercise 10.10 Now modify your code so that the actor only moves when the user
    clicks on the actor. To do this, you have to pass the actor itself (instead of
    null) as a parameter to the mouseClicked method. Remember, you can use the keyword
    this to refer to the current object.


    Exercise 10.11 Test your code: place multiple instances of your actor into the
    world and make sure that only the one you click on moves.


    You should now have a scenario with an actor that can react to mouse clicks. This
    is a good starting point for our following experiments with sound and images.
    (If you had trouble creating this, there is a scenario called soundtest in the
    book scenarios for this chapter that implements this starting point.)


    # Working with sound


    As we have seen earlier, the Greenfoot class has a playSound method that we can
    use to play a sound file. To be playable, the sound file must be located in the
    sounds folder inside the scenario folder.


    As a start, let us play an existing sound file.


    Exercise 10.12 Select a sound file from one of your other Greenfoot scenarios
    and copy it into the sounds folder of your current scenario. Modify your actor
    so that it plays the sound (instead of moving) when you click on it.


    ![](img/410f5f709c4688c1903940c91e75e8ab_207_0.png)


    Some operating systems (most notably Microsoft Windows) are configured so that
    file name suffixes (extensions) are not displayed. A file that is fully named
    mysound.wav would then be displayed only as mysound. This is a problem we need
    to use the full name, including the suffix, from our Java code.


    Writing Greenfoot.playSound("mysound"); would fail, because the file would not
    be found. However, without seeing the suffix, we have no idea what it is.


    The solution is to change the operating system''s settings so that suffixes are
    always displayed. Windows, for example, has a checkbox titled Hide extensions
    for known file types, and you should make sure that this is not checked. In Windows
    8, you can find this checkbox by looking at your folder''s contents and going
    through the menu View / Options / Change and Search Options. In other Windows
    systems, the menu names may vary, but the checkbox will be there as well.'
  merge: -1
  pgno: 207
