  md: 'The same rules described for the World constructor apply to the Crab constructor:


    +   - The signature of a constructor does not include a return type.


    +   - The name of the constructor is the same as the name of the class.


    +   - The constructor is automatically executed when a crab object is created.


    The last rule—that the constructor is automatically executed—ensures that the
    image objects are automatically created and assigned when we create a crab. Thus,
    after creating the crab, the situation will be depicted in Figure 4.8.


    ![](img/410f5f709c4688c1903940c91e75e8ab_88_0.png)


    Note carefully that there is no type before the variable name in the assignment
    in the constructor.

    The variable is defined before the constructor using the statement


    ```

    private GreenfootImage image;

    ```


    and assigned in the constructor using the line


    ```

    image = new GreenfootImage("crab.png");

    ```


    If instead write in the constructor


    ```

    GreenfootImage image = new GreenfootImage("crab.png");

    ```


    then something entirely different happens: we would declare an additional local
    variable image1 in the constructor (then we have two variables called image1:
    one local, one instance) and assign our image to the local one. It would be lost
    as soon as the constructor ends, and our instance variable is still empty.


    This is a very subtle error, easy to make and difficult to find. So make sure
    you your variable declaration at the top, and only an assignment without the declaration
    in the constructor.


    The last line of the constructor sets the first of the two created images as the
    crab’s current image:


