    # D.2.2. Boolean expressions .


    In boolean expressions, operators are used to combine operands to produce a value
    of either true or false. Such expressions are usually found in the test expressions
    of if-statements and loops.


    The relational operators usually combine a pair of arithmetic operands, although
    the tests for equality and inequality are also used with object references. Java''s
    relational operators are:


    ```

    == equal-to != not-equal-to

    < less-than <= less-than-or-equal

    > greater-than >= greater-than-or-equal

    ```


    The binary logical operators combine two boolean expressions to produce another
    boolean value. The operators are:


    ```

    && and

    || or

    ^ exclusive-or

    ```


    In addition,


    ! not takes a single boolean expression and changes it from true to false, and
    vice versa.'
