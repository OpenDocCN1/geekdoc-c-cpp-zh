  md: 'Most complex systems display some sort of emergent system behavior, whether
    they are traffic systems in cities, networks of computers, or crowds of people.
    Predicting these effects is very difficult, and computer simulations can help
    in understanding such systems.


    **Exercise 11.32** How realistic is our simulation of the use of pheromones by
    ants? Do some research into the actual use of pheromones by ant colonies and write
    down which aspects of our simulation are realistic, and which we have made simplifications.


    **Exercise 11.33** Assume pollution has introduced a toxic substance into the
    ants'' environment. The effect is that their production of pheromones is reduced
    to a quarter of the previous amount. (The time between leaving drops of pheromones
    is four times as long.) Will they still be able to form paths? Test.


    **Exercise 11.34** Assume another pollutant has decreased the ants'' ability to
    remember that they recently smelled a pheromone to a threat. Instead of 30 steps,
    they can only remember the pheromone for 10 steps. What is the effect of this
    on their behavior?


    There are many more experiments you can do. The most obvious is to try out different
    placements of ant hills and food sources and different values for the attributes
    that determine the ants'' behavior.


    The scenario ants-3 in the chapter 11 folder shows an implementation of the tasks
    discussed above. It includes three different setup methods in the world class
    that can be called interactively from the world''s pop-up menu.


    # Summary


    In this chapter, we have seen two examples of simulations. This served two purposes.
    Firstly, this was a chance to practice many of the programming techniques we have
    discussed in earlier chapters and we had to use many of the Java constructs previously
    introduced. Secondly, simulations are an interesting kind of application to experiment
    with. Many simulations are used in real life for many purposes, such as weather
    forecasting, traffic planning, environmental impact studies, physics research,
    and many more.


    If you managed to solve all the exercises in this chapter, then you have understood
    a great deal of what this book tried to teach you, and you are competent at basic
    programming.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Concept summary


    +   - A **simulation** is a computer program that simulates some phenomena from
    the real world. If simulations are accurate enough, we can learn interesting things
    about the real world by observing them.


    +   - Using **short methods** with a specific purpose leads to better **code quality**


    +   - Simulations of systems often display **emergent behavior**. This is behavior
    not programmed into single actors, but emerging as a result of the sum of all
    behaviors.'
