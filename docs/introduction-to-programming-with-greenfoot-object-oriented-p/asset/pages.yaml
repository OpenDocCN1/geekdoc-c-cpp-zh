    \        super.act();\n        GreenFootImage cameraImage = getThumbnailUnscaled();\n\
    \        setBackground(cameraImage);\n    }\n}\n```\n\n![](img/410f5f709c4688c1903940c91e75e8ab_243_0.png)\n\
    \nAll methods are available for you to call in your world classes. Which of these\
