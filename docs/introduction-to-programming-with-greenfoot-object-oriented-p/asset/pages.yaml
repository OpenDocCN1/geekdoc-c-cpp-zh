  md: '# Chapter 10 Creating images and sound


    # Figure 10.1


    A sound recording and editing program (Audacity)


    ![](img/410f5f709c4688c1903940c91e75e8ab_209_0.png)


    Figure 10.1 shows a typical interface of a sound recording program. You have controls
    for recording, playback, and so on, and a wave form display of the recorded sound
    (the blue graph).


    Recording the sound is pretty straightforward—you can usually figure this out
    by playing with the program for a little while.


    Exercise 10.16 Open a sound recording program and record a sound. Play it back.
    Does it come out as you expected? If not, delete it and try again.


    As with Greenfoot''s sound recorder, we will often have a delay or noise at the
    beginning and end of our recording that we do not want. In Figure 10.1, for example,
    we can see a time of silence at the beginning and the end of the sound file (the
    straight horizontal lines on the left and right end of the graph). If we save
    the sound file as it is, the effect would be that the sound seems delayed when
    we play it (the first part of the sound that gets played is half a second of silence).


    As in the Greenfoot sound recorder, you should trim the sound file: cut the unwanted
    bits at the beginning and end. However, in good sound editing programs you can
    do much more: you can cut segments from the middle, copy and paste to repeat a
    sound effect multiple times, reorder parts of the sound, and so on.'
