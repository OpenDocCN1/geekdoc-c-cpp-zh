  md: '# Figure 11.3 Exporting a scenario to an application.


    ![](img/410f5f709c4688c1903940c91e75e8ab_99_0.png)


    # 11.4 Export to application


    The next export option is an export to an application. An application is a stand-alone
    program that users can execute locally on their computer.


    To do this, choose *Application* in the export dialog. You can then choose a location
    and a name for the executable scenario that you are about to create (Figure 11.3).


    Using this function will create an **executable jar file**. This is a file with
    a .jar suffix (short for Java Archive), which can be executed on many different
    operating systems (as long as Java has been installed on that machine). Just double-click
    the jar file to execute it.


    # Concept


    A **jar file** is a single file with the suffix that contains all Java classes
    that belong to a Java application.


    # 11.5 Export to Greenfoot archive


    The last export option is an export to a single-file Greenfoot archive (Figure
    11.4). It creates a file with the suffix “.gfar” (*Greenfoot Archive*). gfar files
    contain the entire Greenfoot scenario, including all files from the scenario folder.
    When double-clicked, they expand to a standard Greenfoot folder and start Greenfoot,
    opening the scenario.


    gfar files make it easier to transfer Greenfoot scenarios between computers, for
    example, by attaching them to an email.


    # Concept


    A **gfar file** is a single file that contains a Greenfoot scenario. It can be
    opened with Greenfoot.'
