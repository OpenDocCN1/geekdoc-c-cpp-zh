    # Summary of programming techniques


    In this chapter, we have touched on a number of new concepts. We have seen a new
    scenario—Newton’s Lab—that simulates stars and planets in space. Simulations in
    general are a very interesting topic, and we will come back to them in Chapter
    11.


    We have seen two useful helper classes. SmoothMover and Vector, both of which
    help us to create more sophisticated movement.


    Overloading of methods is another concept we have encountered, where the same
    method name may be used for more than one method. We also discovered various uses
    of the keyword this, which can be used to refer to the current object, access
    fields with names that are overloaded, and to call all one constructor from another.


    But most importantly—although not new—we have seen another use of a list of objects
    together with a for-each loop. This is the most important—and probably the most
    difficult—concept covered here, so we have to study it carefully.


    # Concept summary


    +   - Overloading is the use of the same method name for two different methods
    or constructors.


    +   - The keyword this is used to call one constructor from another, or to refer
    to the current object.


    +   - A constant is a named value that can be used in ways similar to a variable,
    but can never change.'
