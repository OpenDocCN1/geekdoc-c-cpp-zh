  md: '# 190 Chapter 10 Creating images and sound


    a program that produces it requires paying license fees, so many free sound editors
    do not support it. In Greenfoot, you can play MP3s (you could build your own MP3
    player!), but it is not a useful format for saving our self-made sound-effects.


    When saving your sound file, you also have to make sure that your Greenfoot scenario
    can find it. To be accessible to your code, the sound file must be in the sounds
    folder inside your scenario folder. The Greenfoot sound recorder knows this, and
    saves files automatically to this location. When using an external sound editor,
    you have to ensure yourself that the file is stored in the right location.


    **Exercise 10.20** Save your recorded sound in an appropriate format for Greenfoot.
    Move the sound file into the sounds folder of your scenario. Modify the code of
    your Actor class so that it plays your sound when it is clicked.


    **Exercise 10.21** Modify your code so that it plays one sound effect when clicked
    with the left mouse button, and another sound effect when clicked with the right
    mouse button. To do this, you need to get information about the mouse click that
    tells you which button was pressed. Greenfoot has methods to achieve this—study
    the Greenfoot class documentation to find out how this can be done.


    **Exercise 10.22** Modify your code so that the actor, when it is clicked, plays
    a sound effect and moves to a new location.


    ![](img/410f5f709c4688c1903940c91e75e8ab_211_0.png)


    Sound files can quickly become large. This is not a major problem as long as the
    scenario is only used locally, but if for instance, the Greenfoot website is exported,
    then the size can make a big difference. Sound and image files are usually the
    largest parts of a Greenfoot scenario, and the sound file sizes will affect the
    download time of a scenario.


    To avoid overly large sound files we should pay attention to encoding details.
    When we record and save sounds we can make trade-offs between sound quality and
    size. We can record and save the sound either in very high quality, leading to
    large files, or in lower quality, leading to smaller files. The settings we can
    vary are:


    +   - The sample format (usually 16-bit, 24-bit, or 32-bit).

    - The sample rate, measured in Hertz (Hz), varying usually from around 8,000 Hz
    to 96,000 Hz.

    - Stereo versus mono. (Stereo records two separate tracks and thus twice the amount
    of data.)


    If you look carefully at Figure 10.1, you can see that the sound in screenshot
    was recorded in 16 bit, 22,050 Hz, stereo.'
