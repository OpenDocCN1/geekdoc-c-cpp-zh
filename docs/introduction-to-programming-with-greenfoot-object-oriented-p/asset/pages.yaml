    \ sizes. This is particularly true for full color images, such as\nphotos and\
    \ backgrounds (which is why many digital cameras use this). When\nsaving JPEG\
    \ images, many graphics programs allow us to choose how much we want\nto compress\
    \ the file. The more we compress, the smaller the file, but quality is also\n\
    reduced. Gimp, for example, presents a \"Quality\" slider when we save an image\
    \ in JPEG\nReducing the quality creates smaller files. The loss in quality is\
