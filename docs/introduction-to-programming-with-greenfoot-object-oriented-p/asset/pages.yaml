    # Concept summary


    +   - When a method we wish to call is not in our own class or inherited, we need
    to specify the

    class or object that has the method before the method name, followed by a dot.
    This is called

    **dot notation.**


    +   - Methods that belong to classes (as opposed to objects) are marked with the
    keyword static

    in their signature. They are also called **class methods.**


    +   - **A method definition** defines a new action for objects of this class.
    The act is not immediately

    executed, but the method can be called with a method call later to execute it.


    +   - **Comments** are written into the source code as explanations for human
    readers. They are ignored

    by the computer.


    +   - **The API Documentation** lists all classes and methods available in Greenfoot.
    We often need to

    look up methods here.


