  md: "# 7.10 The for-each loop | 131\n\n```\nfor (ElementType variable : collection)\n\
    {\n  statements;\n}\n```\n\nIn this pattern, ElementType stands for the type of\
    \ each element in the collection, variable is a variable that is being declared\
    \ here, so we can give it any name we like, collection is the name of the collection\
    \ we wish to process, and statements is a sequence of statements we wish to carry\
    \ out. This will become clearer with an example.\n\nUsing our list named leaves,\
    \ we can write\n\n```\nfor (Leaf leaf : leaves)\n{\n  leaf.changeImage();\n}\n\
    ```\n\n(Remember that Java is case sensitive: Leaf with an uppercase \"L\" is\
    \ different from leaf with a lowercase \"I\". The uppercase name refers to the\
    \ class, the lowercase name refers to a variable holding an object. The plural\
    \ version—leaves—is another variable-name that holds the whole list.)\n\nWe can\
    \ read the for-each loop a little more easily if we read the keyword as \"for\
    \ each,\" the colon as \"in,\" and the opening curly bracket as \"do\". Then this\
    \ becomes:\n\n```\nfor each leaf in leaves do: ...\n```\n\nThis reading also gives\
    \ us a hint as to what this loop does: It will execute the statements within the\
    \ curly brackets for each element in the list ‘leaves’. If, for example, there\
    \ are ten elements in that list, the statements will be executed ten times. Every\
    \ time, before the statements are executed, the variable leaf (declared in the\
    \ loop header) will be assigned one of the list elements. Thus, the sequence of\
    \ action will be\n\n```\nleaf = first element from 'leaves';\nexecute loop statements;\n\
    leaf = second element from 'leaves';\nexecute loop statements;\nleaf = third element\
    \ from 'leaves';\nexecute loop statements;\n...\n```\n\nThe variable leaf is available\
    \ to be used in the loop statements to access the current element from the list.\
    \ We could then, for example, call a method on that object, as in the example\
    \ shown above, or pass the object on another method for further processing.\n\n\
    We are now ready to put it all together and add the for-each loop to our code.\
    \ Code 7.2 shows the complete method that implements the example we have just\
    \ discussed."
