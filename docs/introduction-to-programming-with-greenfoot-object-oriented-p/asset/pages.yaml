  md: '# D: Some Java details 261


    Notes:


    +   A number without a decimal point is generally interpreted as an int, but automatically
    converted to byte, short, or long types when assigned (if the value fits). You
    can declare a literal as long as by putting an “L” after the number. (lower-case
    L—works as well but should be avoided because it can be easily mistaken for a
    one).


    +   A number with a decimal point is of type double. You can specify a float literal
    by putting an “F” or “f” after the number.


    +   A character can be written as a single Unicode character in single quotes
    or as a four-digit Unicode value, preceded by “u”.


    +   The two boolean literals are true and false.


    Because variables of the primitive types do not refer to objects, no methods associated
    with them. However, when used in a context requiring an object type, autoboxing
    might be used to convert a primitive value to a corresponding object.


    The table below details minimum and maximum values available in the numerical
    types.


    | Type | Minimum | Maximum |

    | byte | -128 | 127 |

    | short | -32768 | 32767 |

    | int | -214783648 | 214783647 |

    | long | -922337203685477808 | 922337203685477807 |

    | Positive minimum | Positive maximum |

    | float | 1.4e-45 | 3.402835e38 |

    | double | 4.9e-324 | 1.79693134862315e308 |


    # I.1.2 Object types


    All types not listed in the Primitive section are object types. These include
    class and interface types from the standard Java library (such as String) and
    user-defined types.


    A variable of an object type holds a reference (or “pointer”) to an object. Assignment
    and parameter passing have reference semantics (that is, the reference is copied,
    not the object). After assigning a variable to another one, both variables refer
    to the same object. The two variables are said to be aliases for the same object.


    Classes are the templates for objects, defining the fields and methods that each
    instance possesses.


    Arrays behave like object types—they also have reference semantics.'
