    Exercise 9.50 Rewrite the initializeImages method to use a for loop instead of
    a while loop.


    In practice, it is not very important which loop to use in this case. (We changed
    it mainly to gain additional practice in writing for loops.) This is, however,
    a case where a for loop is a good choice, because we have a known number of iterations
    (the number of images) and we can make good use of the loop counter in calculating
    the image sizes. The advantage over the while loop is that the for loop brings
    all elements of the loop (initialization, condition, and increment) together in
    the header, so that we run less danger of forgetting one of its parts.


    The images field and the initializeImages method are static (they use the static
    keyword in their definition). As we have briefly mentioned in Chapter 3, this
    means that the images field is stored in the ProtonWave class, not the individual
    instances. As a result, all objects that we will create of this class share this
    set of images, and we do not need to create a separate set of images for each
    object. This is much more efficient than using a separate image each time.


    Copying and scaling these images takes a fairly long time (up to two-tenths of
    a second on a current average computer). This may not seem very much, but it is'
