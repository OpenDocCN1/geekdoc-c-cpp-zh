  md: '# Introduction


    Welcome to Greenfoot! In this book, we will discuss how to program graphical computer
    programs, such as simulations and games, using the Java Programming Language and
    the Greenfoot environment.


    There are several goals in doing this: one is to learn programming, another is
    to have fun along the way. While the examples we discuss in this book are specific
    to the Greenfoot environment, the concepts are general: working through this book
    will teach you general programming principles in a modern, object-oriented programming
    language. However, it will also show you how to make your own computer game, a
    biology simulation, or an on-screen piano.


    This book is very practically oriented. Chapters and exercises are structured
    around real, hands-on development tasks. First, there is a problem that we need
    to solve, then we look at language constructs and strategies that help solve the
    problem. This is quite different from many introductory programming textbooks
    that are often structured around language constructs.


    As a result, this book starts with less theory, and more practical activity than
    most programming books. This is the reason we use Greenfoot: It is the Greenfoot
    environment that allows us to play. And that does not only mean playing games;
    it means playing with programming: we can create objects, move them around screen,
    call their methods, and observe what they do, all interactively and easily. This
    leads to a more hands-on-approach to programming more than what would be possible
    without such an environment.


    A more practical approach does not mean that the book does not cover the necessary
    theory and principles as well. It''s just that the order is changed. Instead of
    introducing a concept theoretically and then doing some exercises with it, we
    often jump right in and use construct, initially explaining as much as necessary
    to solve the task at hand, then come back to the theoretical background later.
    We typically follow a spiral approach: we introduce some aspects of a concept
    when we first encounter it, then revisit it in another context, and greatly deepen
    our understanding.


    The emphasis throughout is to make the work we do interesting, relevant, and enjoyable.
    There is no reason why computer programming has to be dry, formal, or boring.
    Having fun along the way is okay. We think we can manage to make the experience
    interesting and pedagogically sound at the same time.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'This book can be used both as a self-study book or as a textbook in a programming
    course. Exercises are worked into the text throughout the book—if you do them
    all, you will come out of this as a fairly competent programmer.


    The projects discussed in this book are easy enough that they can be managed by
    high school students, but they are also open and extendable enough that even seasoned
    programmers can find interesting and challenging aspects to do. While Greenfoot
    is an educational environment, Java is not a toy language. Since Java is our language
    of choice for this book, projects discussed here (and others you may want to create
    in Greenfoot) can be made as complex and challenging as you like.


    While it is possible to create simple games quickly and easily in Greenfoot, it
    is equally possible to build highly sophisticated simulations of complex systems,
    possibly using artificial intelligence algorithms, agent technology, database
    connectivity, network communication, or anything else you can think of. Java is
    a very rich language that opens the whole world of programming, and Greenfoot
    imposes no restrictions as to which aspects of the language you can use.


    In other words: Greenfoot scales well. It allows easy entry for young beginners,
    experienced programmers can also implement interesting, sophisticated scenarios.


    Programming is a creative discipline, and Greenfoot is a tool that helps you build
    what you invent.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Getting to know Greenfoot


    topics: the Greenfoot interface, interacting with objects, invoking methods, running
    a scenario


    concepts: object, class, method call, parameter, return value


    This book will show you how to develop computer games and simulations with Greenfoot,
    a development environment. In this chapter, we shall take a look at Greenfoot
    itself and see what it can do and how to use it. We do this by trying out some
    existing programs.


    Once we are comfortable with using Greenfoot, we shall jump right into writing
    a game ourselves.


    The best way to read this chapter (and indeed the whole book) is by sitting at
    your computer with Greenfoot open on your screen and the book open on your desk.
    We will regularly ask you to do things in Greenfoot while you read. Some of the
    tasks you can skip; however, you will have to do some in order to progress in
    the chapter. In any case, you will learn most if you follow along and do them.


    At this stage, we assume that you have already installed the Greenfoot software
    and the book scenarios (described in Appendix A). If not, read through the appendix
    first.


    # 1.1 Getting started


    Start Greenfoot and open the scenario leaves-and-wombats from the Greenfoot book
    scenarios folder. You can do this by choosing Scenario-Open from the menu.


    > ¹ We use this notation to tell you to select functions from the menu. Scenario-Open
    refers to the Open item in the Scenario menu.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1 Getting to know Greenfoot


    Figure 1.1


    The Greenfoot main window


    ![](img/410f5f709c4688c1903940c91e75e8ab_25_0.png)


    World


    Class diagram


    Execution controls


    You will now see the Greenfoot main window, with the scenario open, looking similar
    to Figure 1.1.


    The main window consists of three main areas and a couple of extra buttons. The
    main areas are:


    +   - The world. The largest area covering most of the screen (a sand-colored
    grid in this case) is called the world. This is where the program will run and
    we will see see things happen.


    +   - The class diagram. The area on the right with the beige-colored boxes and
    arrows are the class diagram. We shall discuss this in more detail shortly.


