    # 12.8 Simple Kinect game: Pong


    The last project that we will discuss in this chapter is a very simple game: Pong.
    Pong is a well-known, simple game where we play a kind of tennis with paddles
    on. In our case, we will have two paddles, one controlled by each of our hands,
    and we will play against the computer which has one paddle (Figure 12.10).


    As so often, we have two versions of the scenario in our book-scenarios folder;
    one as the starting point for our exercises, and one with the finished solution.


    Exercise 12.24 Open the kinect-pong-start scenario. Run it. Find out how to play.


