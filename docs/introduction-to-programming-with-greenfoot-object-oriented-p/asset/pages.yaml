  md: '# 4.7 Adding objects to the world


    In the code fragment in the constructor shown in Section 4.1, we have seen that
    we can use the following line:


    ```

    addObject(myCrab, 250, 200);

    ```


    The addObject method is a method of the World class, and it allows us to add an
    actor object to the world. We can look it up by looking at the class documentation
    for World. We see that it has the following signature:


    ```

    void addObject(Actor object, int x, int y)

    ```


    Reading the signature from start to finish, this tells us the following:


    +   * The method does not return a result (void return type).

    * The name of the method is addObject.

    * The method has three parameters, named object, x, and y.

    * The type of the first parameter is Actor, the type of the other two is int.


    This method can be used to add a new actor into the world. Since the method belongs
    to the World class and CrabWorld (it inherits from the World class), this method
    is available in our CrabWorld class, and we can just call it.


    We have just created a crab and stored it in myCrab variable. Now we can use this
    crab (by using the variable it is stored in) as the first parameter to the addObject
    method call. The remaining two parameters specify the x and y coordinate of the
    position where we wish to add the object.


    All the constructs together (variable declaration, object creation, assignment,
    and adding the object to the world) look like this:


    ```

    Crab myCrab = new Crab();

    addObject(myCrab, 250, 200);

    ```


    We can use an object of type Crab for the Actor parameter, because a crab is an
    actor (class Crab is a subclass of class Actor).


