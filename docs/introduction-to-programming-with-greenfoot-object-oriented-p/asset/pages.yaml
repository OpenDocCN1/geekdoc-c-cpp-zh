  md: 'You will quickly see that it is very hard to configure the parameters so that
    the system remains stable for a long time. Combination of mass and gravity will
    prevent objects from crashing into each other or escaping from orbit. (Since we
    have not implemented "crashing into each other," our objects essentially fly through
    each other. However, when they get close, their forces become very large and they
    often pull each other onto strange trajectories.)


    Some of these effects are similar to nature, although our simulation is somewhat
    inaccurate due to some simplifications we have made. The fact, for example, that
    all objects act in sequence, rather than simultaneously, will have an effect on
    their behavior and not a realistic representation. It introduces small errors
    that add up and have an effect over time. To make the simulation more accurate,
    we would have to calculate all forces first (without moving) and then execute
    all moves according to the previous calculations. Also, our simulation does not
    model the forces accurately when two bodies get very close to each other, adding
    more unrealistic effects.


    We can also ask the stability question about our solar system. While the planets
    in our solar system are quite stable, precise details about their movement are
    hard to predict accurately for a long time into the future. We are certain that
    none of the planets will crash into the Sun in the next few billion years, but
    small variations in orbit may help. Simulations as ours (just much more accurate
    and detailed, but similar in principle) have been used to predict the future.
    We have seen, however, that this is very hard to simulate accurately. Simulations
    can show that minute differences in the initial conditions can make huge differences
    after a few billion years³


    Seeing how difficult it is to come up with parameters to create a system that
    is stable even for a limited time, we might be surprised that our solar system
    is as stable as it is. But there is an explanation: when the solar system formed,
    material from a gas cloud surrounding the Sun formed into lumps that slowly grew
    by colliding with other lumps of matter and combining into ever-growing objects.
    Initially, countless of these lumps in orbit. Over time, some fell into the Sun,
    some escaped into deep space. This process ends when the only chunks left are
    well separated from one another and generally stable.


    It would be possible to create a simulation that models this effect. If we correctly
    modeled the growth of planets out of billions of small, random lumps of matter,
    we would observe the same effect: some large planets form that are left in stable
    orbits. For this, however, we would need a much more detailed and complicated
    simulation and a lot of time; simulating this effect would take a very, long time,
    even on very fast computers.


    ³ If you are interested to read more, Wikipedia is a good starting point: http://en.wikipedia.org/wiki/Stability_of_the_solar_system'
