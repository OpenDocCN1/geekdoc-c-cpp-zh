  md: '# 10.5 Sound file formats and file sizes


    **Exercise 10.17** Edit your sound file so that it includes only the exact sound
    you want. Remove any noise or silence at the beginning or end, or any parts in
    the middle that are not needed.


    One of the most interesting capabilities of sound editing programs, however, is
    the use of filters or effects. Filters allow us to modify the sound or generate
    entirely new sound elements. This way, many different sound effects can be generated.


    By applying filters, such as amplification, echoes, reverting, speed changes,
    and others, to simple recorded sounds (such as speaking, clapping, whistling,
    shouting), we can create a wide variety of effects.


    **Exercise 10.18** If your sound program supports filters (sometimes called *effects*),
    apply some of them to your recorded sound. Select three of your favorite filters
    and describe, in writing, what you do. Give an example where you might use each.


    **Exercise 10.19** Produce the following sounds: a rabbit chewing a carrot; an
    explosion of two hard objects colliding; a “Game Over” sound when the player has
    lost the game; an “end of game” sound when the player won; a robot voice; and
    a “jumping” sound (used when a game character jumps).


    When the editing of sound is complete, we are ready to save it to a file.


    # Sound file formats and file sizes


    Sound files can be saved in many different formats and in different encodings,
    and this can get quite confusing very quickly.


    Greenfoot can play sounds in WAV, AIFF, AU, and MP3 formats. Some of these formats,
    however, are what is known as “envelope formats”—they can contain different encodings,
    and Greenfoot can read only some of them. As a result, Greenfoot cannot, for example,
    play WAV files.


    When you save your recorded sounds, you should save them as a “16 bit PCM WAV”
    file. This is the safest format to ensure playback. In many recording programs,
    this is achieved by using an “Export” function, rather than the standard “Save”
    function. Make sure to save in this format.


    When you come across sound files Greenfoot cannot play (maybe downloaded from
    the Internet), you can usually open them in your sound editing program and convert
    them to this format.


    WAV is a good format for short sound effects. MP3, another popular format, is
    used mainly for music and other long recordings. It is a proprietary format (writing'
