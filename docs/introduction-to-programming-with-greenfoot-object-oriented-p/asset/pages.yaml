    \ of the image.\n\nAs a result, our rocket will make “contact” with an asteroid\
    \ even though, on screen,\nseems to still be a little distance between them.\n\
    \nFor our asteroids game, we choose to ignore this. The distance is small, so\
    \ often play\ners will not notice. Second, it is easy enough to come up with a\
    \ story to explain this\neffect (“flying too close to an asteroid destroys your\
    \ ship because of the gravitational pull”).\n\nSometimes it would be nice to check\
    \ whether the actual visible (non-transparent)\\parts of an image intersect. This\
    \ is possible, but much more difficult. We will not\ndisc this here.\n\nNow that\
    \ we have decided to go with intersection, we can look at the Actor methods\n\
