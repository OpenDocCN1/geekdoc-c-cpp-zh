  md: '# 4.9 Animating images


    You will see that this code does the following:


    +   - The constructor now includes a call to a new method named prepare().

    - A method definition for this method has been added.

    - The prepare() method contains code that creates and adds all the actors that
    have just created interactively.


    So what is happening here?


    When we create objects interactively, and then select Save the World, Greenfoot
    writes code into our world class to recreate the situation just we set it up by
    hand. It does this by creating and calling a method prepare().


    The effect is that now, every time we click Compile or Reset, the actors are immediately
    created again.


    Our previous exercises to write the code manually and place the actors help us
    understand how this method works. In many cases, we do not need to write this
    code manually—and can use Save the World instead—but is important to understand
    it in detail. There are other occasions where we want a more sophisticated setup,
    where we will still write the initialization code by hand.


    # Animating images


    Now we have managed to start our game off with a good setup automatically, we
    can spend a bit of time improving some details.


    We will next work on animating the image of the crab. To make the movement of
    the crab look a little better, we plan to change the crab so that it moves its
    legs while it is walking.


    Animation is achieved with a simple trick: we have two different images of the
    crab (in our scenario, they are called crab.png and crab2.png), and we simply
    switch the crab''s image between these two versions fairly quickly. The position
    of the crab''s legs in these images is slightly different (Figure 4.6).


    The effect of this (switching back and forth between these images) will be that
    the crab looks as if it is moving its legs.


    In order to do this, we have to use some more variables and also discuss how to
    work with Greenfoot images.


