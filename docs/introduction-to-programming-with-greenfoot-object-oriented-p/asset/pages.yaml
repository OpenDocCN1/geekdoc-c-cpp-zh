  md: '# 5.14 Adding game time


    Importantly, we have seen a first example of abstraction for generalization: we
    saw adding a parameter to a method can make the method more generally useful,
    so that we can call the method from different contexts to carry out slightly different
    (but related) actions. This is better than writing separate methods for every
    case.


    We will see more of abstraction throughout the coming chapters.


    # Concept summary


    +   - The setLocation method sets an actor''s location to a position specified
    by x- and y-coordinates.

    - Access modifiers (private or public) determine who can call a method.

    - Private methods are only visible from within the class they are declared in.
    They are used to improve the structure of the code.

    - The keyword this can be used to refer to the current object.

    - The getWorld method gives access to the world from an actor object.

    - The type String is used to represent text, such as words or sentences. Strings
    are written in double quotes.

    - Variables of type String can store String objects

    - String concatenation merges two Strings into one. It is written with a plus
    symbol (+).

    - String concatenation can also be used with a String and an integer.

    - Parameterizing methods (adding parameters) can make them more flexible and more
    useful.


    # Drill and practice


    In this chapter we will not have the usual drill-and-practice section; the last
    section—adding game time—already served this purpose and gave us the chance to
    practice our new constructs and techniques.

