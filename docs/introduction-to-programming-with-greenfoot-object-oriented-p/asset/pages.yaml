  md: '# Overloading


    is the use of the same method name for two different methods or constructors.


    It is perfectly legal in Java to have two methods that have the same name, as
    long as their parameter lists are different. This is called overloading.(The name
    of the method is overloaded—it refers to more than one method.)


    When we call an overloaded method, the runtime system figures out which of the
    two methods we mean by examining the parameters we supply.


    We say that the two methods have different signatures.


    The second helper class, Vector, implements the vector itself, and is used by
    the SmoothMover. Note that Vector is not listed in the Actor group of classes.
    It is not an actor—it will never appear in the world on its own. Objects of this
    class are only ever created and used by other actor objects.


    Vectors can be represented in two different ways: either as a pair of distances
    in x- and y-coordinates (dx, dy), or as a pair of values specifying the direction
    and its length (direction, length). The direction is usually specified as the
    angle from the horizontal.


    Figure 8.5 shows the same vector with both possible specifications. We see that
    either the (dx, dy) pair, or the (direction, length) pair can describe the same
    vector.


    Figure 8.5 Two possible ways to specify a vector


    ![](img/410f5f709c4688c1903940c91e75e8ab_159_0.png)


    The first representation, using the x and y offsets, is called a Cartesian representation.
    The second, using the direction and length, is a polar representation. You will
    see these two names used in the source code of the Vector class.


    For our purposes, sometimes the Cartesian representation and sometimes the polar
    representation is easier to use. Therefore our vector class is written in a way
    that it can deal with both. It will do the necessary conversions internally automatically.


    Exercise 8.8 Familiarize yourself with the methods of the SmoothMover and Vector
    classes by opening the editor and studying their definition in Documentation view.
    (Remember: you can switch to Documentation view using the menu in the top right
    corner of the editor.) You can also read the source code, if you like, but this
    is not strictly necessary at this stage.'
