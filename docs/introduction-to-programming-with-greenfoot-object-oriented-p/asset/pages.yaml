    \ similar to field declarations, except that they have the two keywords static\
    \ final inserted after the keyword private.\n\nThis is what we call a constant.\
    \ A constant has similarities to a field, in that we can use the name in our code\
    \ to refer to its value, but the value can never change (it is constant). It is\
    \ the final keyword that makes these declarations constants.\n\nThe effect of\
    \ the static keyword is that this constant is shared between all actors of this\
    \ class, and we do not need separate copies of it in every object. We encountered\
    \ the static keyword before (Chapter 3), in the context of class methods. Just\
    \ as static methods belong to the class itself (but can be called from objects\
    \ of that class), static fields belong to the class and can be accessed from its\
    \ instances.\n\nIn this case, the constants declared are a value for gravity(to\
    \ be used later), and a default color for the bodies. This is an object of type\
