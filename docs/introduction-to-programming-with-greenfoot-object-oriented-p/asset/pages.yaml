  md: '# Explosion


    The explosion scenario (Figure 13.4) demonstrates how we can implement a spectacular
    looking effect. The object that explodes is, in this case, a simple rock that
    we have encountered in other scenarios before. (It played, for example, the role
    of the asteroid in the asteroids scenario.) But we could really explode anything
    we like.


    To achieve this effect, we have a Debris class that represents a part of the rock.
    When the rock explodes, we remove it from the world and place 40 pieces of debris
    in its place.


    Each piece of debris is randomly stretched and rotated to make it look unique
    and initially have a movement vector in a random direction. At every step, we
    add a bit of downward movement to simulate gravity, and the result is the explosion
    you see when you run this scenario.


    A tutorial video explaining this scenario in more detail is available on the Greenfoot
    YouTube channel at https://www.youtube.com/user/18km.


    # Breakout


    Breakout is a classic computer game in which the player controls a paddle at the
    bottom of the screen to bounce a ball upwards to remove some blocks. If you do
    not know the game, do a web search.


    ![](img/410f5f709c4688c1903940c91e75e8ab_262_0.png)'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'Figure 13.5

    The beginning of a

    Breakout game


    ![](img/410f5f709c4688c1903940c91e75e8ab_263_0.png)


    The breakout scenario (Figure 13.5) is a partial implementation of this game.
    It uses the ball with the smoke effect that we discussed in Chapter 10 and adds
    a paddle for the player to control the ball. It has, however, no blocks to aim
    for, so in its current form it is not very interesting.


    Many variations of Breakout have been created over time. Many use different patterns
    of layout for the blocks at different levels. Most also have some “power-ups”—goodies
    hidden behind some blocks that float down when the block is removed. Catching
    them typically makes something happen in the game (extra balls, increased speed,
    or smaller paddles, etc.)


    Completing this game in an interesting way can make a good project. It could be
    modified to have two paddles, one on either side, essentially turning it into
    the classic Pong game.


    # 13.6 Platform jumper


    A common style of game is a “platform” game. The player typically controls a game
    character that has to move from one area on the screen to another, while overcoming
    obstacles. One such obstacle may be a gap in the ground the character is walking
    on, with some means of getting across it.


    The penguin scenario implements a small segment of such a game (Figure 13.6).
    There are two pieces of ground on either side of the screen, and the penguin can
    get across by jumping onto a moving cloud.'
