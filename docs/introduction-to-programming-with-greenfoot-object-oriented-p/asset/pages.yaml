  md: '# APPENDIX

    Collision detection


    In this book, various collision detection methods are used in different situations.
    Below is a summary of the collision detection methods available for Greenfoot
    actors, and a short explanation of their purpose, and when to use them.


    # C.1 Method summary


    Greenfoot''s collision detection methods can be found in the Actor class. There
    are seven relevant methods. They are as follows:


    +   boolean isTouching(Class cls)

    Check whether this actor is touching any objects of the given class.


    +   List getIntersectingObjects(Class cls)

    Return all the objects that intersect this object.


    +   Actor getOneIntersectingObject(Class cls)

    Return an object that intersects this object.


    +   List getObjectsAtOffset(int dx, int dy, Class cls)

    Return all objects that intersect the given location (relative to this object''s
    location).


    +   Actor getOneObjectGetOffset(int dx, int dy, Class cls)

    Return one object that is located at the specified cell (relative to this object''s
    location).


    +   List getNeighbours(int distance, boolean diagonal, Class cls)

    Return the neighbours to this object within a given distance.


    +   List getObjectsInRange(int r, Class cls)

    Return all objects within range “r” around this object.


    # C.2 Convenience methods


    Two of the methods, getIntersectingObjects and getObjectsAtOffset, have associated
    convenience methods, starting with getOne...'
