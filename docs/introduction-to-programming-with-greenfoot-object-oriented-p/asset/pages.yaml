    # 7.1 Interacting objects


    Objects can interact with (“talk to”) other objects by calling methods on those
    other objects.


    We have seen several examples of this in the previous chapters, but it is time
    to gather everything we have seen so far and discuss it systematically to make
    sure we covered everything important. Object interaction is central to object-oriented
    programming that we cannot afford to miss anything here.


    # 7.2 Object references


    For one object to talk to another, it must always have a reference to that other
    object. This reference is usually stored in a variable. If, for example, our Block
    from the autumn scenario wants to talk to the MyWorld object, it must first have
    a reference to the MyWorld object. Figure 7.2 shows this situation: The object
    of type Block holds a reference to a MyWorld object in a variable world.


    ![](img/410f5f709c4688c1903940c91e75e8ab_144_0.png)


    Once the block has a reference to the MyWorld object in a variable, it can call
    methods on it. For example:


    ```

    worldId.addObject(new Leaf(), 100, 100);

    ```


    Calling a method on another object serves to “talk to” that object. Often, this
    is to give instructions to that other object (in this case saying to the world
    object: “Please add a new leaf at location 100,100.")'
