    # Summary of programming techniques


    In this chapter, we have seen a number of important new programming concepts.
    We have seen how constructors can be used to initialize objects—constructors are
    always executed when a new object is created.


    We have seen instance variables and local variables. Instance variables, also
    called fields, are used—together with assignment statements—to store information
    in objects, which can be accessed later. Local variables are used to store information
    for a short period of time—within a single method execution—and are discarded
    at the end method.


    We have the new statement to programmatically create new objects, and finally,
    we have seen the full version of the if-statement, which includes an else part
    that is executed when the condition is not true.


    With all these techniques we can now write quite a good amount of code.


    # Concept summary


    +   - A constructor of a class is a special kind of method that is executed automatically
    whenever a new instance is created.


    +   - Java objects can be created programmatically (from within your code) by
    using the new keyword.


    +   - Variables can be used to store information (objects or values) for later
    use.


    +   - Variables can be created by writing a variable declaration.


    +   - We can store values in variables by using an assignment statement (=).


    +   - Variables of primitive types store numbers, booleans, and characters; variables
    of object types store objects.


    +   - Objects are stored in variables by storing a reference to the object.


    +   - Greenfoot actors maintain their visible image by holding an object of type
    GreenfootImage. These are stored in an instance variable inherited from class
    Actor.


    +   - Instance variables (also called fields) are variables that belong to an
    object (rather than a method). Instance variables persist as long as the object
    exists that they hold them.


    +   - Lifetime of local variables: Local variables persist only during a single
    method execution.


    +   - We can test whether two things are equal by using a double equals symbol:
    ==.


    +   - The if/else statement executes a segment of code when a given condition
    is true, and a different segment of code when it is false.'
