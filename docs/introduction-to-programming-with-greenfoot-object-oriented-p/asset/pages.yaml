    Greenfoot, pangu


    ![](img/410f5f709c4688c1903940c91e75e8ab_264_0.png)


    This scenario is included here to demonstrate how an actor can move along the
    top of another (the penguin on top of the ground), and how jumping and falling
    might be implemented.


    A tutorial video discussing this in more detail is available on the Greenfoot
    YouTube channel at https://www.youtube.com/user/18km, under the name “Running,
    jumping and falling.”


    # 13.7 Wave


    The next scenario is wave (Figure 13.7). It is a simple simulation of the propagation
    of a wave on a piece of string. Play around with it for a little while, and you
    will discover what it does.


    One of the fascinating aspects of this example is how a fairly simple implementation—in
    each act round, each bead simply moves towards the middle of its two neighbors—achieves
    a quite sophisticated simulation of various aspects of wave propagation.


    This example is included here to illustrate that, with a bit of thought and preparation,
    various behaviors from other disciplines could be simulated. In this case, it
    is a simple physical effect. Equally one could simulate chemical reactions, biological
    interactions, interactions of subatomic particles, and much more. With careful
    planning, we can learn something about other application areas, as well as learning
    about programming.'
