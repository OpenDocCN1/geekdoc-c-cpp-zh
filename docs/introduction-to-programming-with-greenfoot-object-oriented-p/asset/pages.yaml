  md: '# Acknowledgments


    This book is the tip of an iceberg. It is an introduction to programming with
    Java, but this kind of approach would not be possible without the Greenfoot ecosystem.
    This book builds on many years of work by several people who have helped build
    Greenfoot.


    The book rests first and foremost on the software itself—Greenfoot—but this is
    not the whole story. Much time and effort has gone into the design of websites
    (the Greenfoot community website, the GreenRoom), development of material, building
    and supporting a user community, workshops and outreach, and a number of people
    have played very important roles in this.


    Paul Henriksen was the first person to join me in this project. He started the
    Greenfoot implementation as part of his Masters thesis and was the main contributor
    to the software for many of the early years. Davin McCall, Bruce Quig, and Neil
    Brown are the next wave of designers and developers who have worked on Greenfoot
    for years and shaped large parts of the design and implementation of the system
    as it is today. It is not easy to maintain a software system of this size with
    such few people and resources, but all are outstanding programmers and have managed
    to develop a system that has survived for almost ten years so far and runs with
    few problems on millions of computers around the world. This is an outstanding
    achievement, and I have been very lucky to have these people on my team.


    Other important contributions to the ecosystem were by Ian Utt and our more recent
    team members, Amjad Aladtadri and Fabio Dehayoglu. A wide variety of activities
    has helped to make the Greenfoot community what it is.


    The development of Greenfoot is being supported by Oracle Inc., through charitable
    donations over many years. Their consistent and ongoing support have allowed us
    to maintain our group; without this, Greenfoot would not exist. We are very grateful
    for their commitment and substantial contribution to the education community.


    The people at Pearson Education have struggled bravely in the face of the many
    delays caused by my missing of every possible deadline for sending in this manuscript.
    Tracy Johnson has worked with me on this book from the very beginning, through
    the first edition, and now the second one. She has been consistently positive,
    excited and encouraging, and her support has made a huge difference. Camille Tracentoste
    and Carole Snyder have done a lot of the important detail work to get this book
    produced, and I am grateful for their input and help.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The first edition of this book was reviewed by a number of people who have
    provided very detailed, thoughtful and useful feedback. They are Carolyn Oates,
    Damianne President, Detlef Rick, Gunnar Johannesmeyer, Josh Fishburn, Mark Hayes,
    Marla Parker, Matt Jadud, Todd O''Bryan, Lael Grant, Jason Green, Mark Lewis,
    Rodney Hoffman, and Michael Kadri. They helped spotting many errors and pointed
    out many of very useful suggestions after the publication of the first edition
    that have helped improve the examples for the second edition.


    I am very grateful to Kerstin Wachholz for her expert proofreading—and she found
    and fixed many of my errors and removed the warts of my language—, and to my good
    friend Michael Caspersen for providing encouragement very early in the project
    that was very important to me. partly because it helped improve the book, most
    importantly because it encouraged me to believe that the idea of the Greenfoot
    system might be interesting to teachers and worthwhile completing.'
  merge: -1
