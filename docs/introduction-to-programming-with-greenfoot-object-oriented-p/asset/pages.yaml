  md: "Both && and || are slightly unusual in the way they are applied. If the left\
    \ operand of && is false then the value of the right operand is irrelevant and\
    \ will not be evaluated. Similarly, if the left operand of || is true then the\
    \ right operand is not evaluated. Thus, they are known as short-circuit operators.\n\
    \n# D.3 Java control structures\n\nControl structures affect the order in which\
    \ statements are executed within the body of a method or constructor. There are\
    \ two main categories: selection statements and loops.\n\nA selection statement\
    \ provides a decision point at which a choice is made to follow one route through\
    \ the method or constructor rather than another route. An if-else statement involves\
    \ a decision between two different sets of statements, whereas a switch statement\
    \ allows the selection of a single option from among several.\n\nLoops offer the\
    \ option to repeat statements, either a definite or an indefinite number of times.\
    \ The former is typified by the for-each loop and for loop, while the latter is\
    \ typified by the while loop and do loop.\n\nIn practice, it should be borne in\
    \ mind that exceptions to the above characterizations are quite common. For instance,\
    \ an if-else statement can be used to select from among alternative sets of statements\
    \ if the else part contains a nested if-else statement; and a for loop can be\
    \ used to loop an indefinite number of times.\n\n# D.3.1 Selection statements\n\
    \n# D.3.1.1 if-else\n\nThe if-else statement has two main forms, both of which\
    \ are controlled by the evaluation of a boolean expression:\n\n```\nif (expression)\n\
    {\n    statements\n}\nif (expression)\n{\n    statements\n}\\else\n{\n    statements\n\
    }\n```"
