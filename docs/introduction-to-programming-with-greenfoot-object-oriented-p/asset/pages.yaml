    to the screen when you catch a bacterium.


    > **Exercise 5.34** Change the statement to write your name instead.


    > **Exercise 5.35** Change the text again to show the word "Score:" (including
    the colon).


    # String concatenation


    We have seen how we can display some text—all that is left is to find out how
    to display our score, which is held in an int variable. We will use String concatenation.'
