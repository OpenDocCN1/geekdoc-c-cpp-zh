    # 13.2 Lifts


    The lifts scenario shows a simple lift (or elevator) simulation (Figure 13.2).
    It shows several floors of a multistory building and three lifts moving up and
    down. People appear on the floors and press the call buttons and enter the lifts
    when they come.


    This is actually a very rudimentary, unfinished implementation. Much of what we
    see on the screen is fake: It does not properly simulate what is going on, and
    is just written for.


    For example, the people do not properly enter the lifts (they are just erased
    when a lift reaches a floor). The number of people shown in a lift is just a random
    number. Lifts do not react to call buttons—they just move up and down randomly.
    There is no control algorithm implemented for the lifts.


    So this is just a quick demo that presents the idea and the graphics. To finish
    the project, the movement of people would have to be properly modeled (in and
    out of the elevators). And then we could experiment with implementing and testing
    different lift algorithms.


