  md: '# Sharing your scenarios


    In this section, we will not introduce new programming techniques but rather go
    on a quick detour to discuss how you can share what you have created with others.
    The "others" may be your friend sitting next to you or another Greenfoot programmer
    on the other side of the world.


    # Sharing your scenario


    When you have finished writing a scenario—maybe a game or a simulation—you may
    want to enable others to use it. These users should have the opportunity to start
    (and restart) the game, but they do not need access to the class diagram or the
    source code. They should not modify the game; instead they just use it.


    For a scenario to work well when shared, it is important that it automatically
    creates all the actors you want to see on the screen at the start of the game.
    Users will not be able create objects interactively.


    In Greenfoot, this is done by sharing the scenario. You can share your scenario
    by clicking the Share button at the top right of the Greenfoot main window. This
    will let you choose from four options: Publish, Webpage, Application, and Project.


    # Publishing to the Greenfoot website


    The most common way to share your scenario is to publish it to the Greenfoot website.
    The Greenfoot site is a public website (at the address http://www.greenfoot.org
    home/) that allows Greenfoot users to upload their Greenfoot scenarios. When you
    share your scenario on the Greenfoot site, it becomes public to the world—anyone
    with Internet access can see it and run it.


    The share dialog (Figure 11.1) shows the site address at the top. Click here to
    open the website and see what is there. It is probably best if you have a look
    through the site first.'
  merge: -1
