  md: '# Chapter 10 Creating images and sound


    **Exercise 10.32** Make two new images for your actor (the actor will switch between
    these two images). Save them in PNG format. Make one of these images the default
    image for your actor class.


    **Exercise 10.33** Modify your actor code so that it toggles between your two
    images every time the actor is clicked with the mouse.


    **Exercise 10.34** Modify your actor code so that it displays the second actor
    only when the mouse is pressed. In other words, the actor starts off with a default
    image, when the mouse is pressed on the actor, it displays a different image,
    and as soon as the mouse is released, it reverts to its original image.


    # 10.9 Drawing images


    The second method to obtain images for our actors and backgrounds is to draw themmatically.
    We have seen examples of this in some of the scenarios in earlier chapters, for
    example when we painted the stars in the asteroids program.


    Every pixel in an image is defined by two values: its color value and its transparency
    value (also called the alpha value).


    The color value is split into three components: the red, green, and blue components.
    Colors represented this way are usually referred to as RGB colors.


    This means we can represent a pixel (with color and transparency) in four numbers.
    The order usually is as follows:


    +   ( R, G, B, A )


    That is, the first three values define the red, green, and blue components (in
    order), and the last is the alpha value.


    In Java, all of these values are in the range [0...255] (zero to 255 inclusive).
    A color component value of 0 indicates no color in this component, while 255 is
    full strength. An alpha value of 0 is fully transparent (invisible), while 255
    is opaque (solid).


    Figure 10.2 shows a table of some the possible colors, all with no transparency
    (alpha = 255). The table in Figure 10.2 was produced with the Greenfoot scenario
    color-chart, which is in the chapter10 folder in the book scenarios.


    **Exercise 10.35** What do pixels look like have a color/alpha value of (255,
    0, 0, 255)? What about (0, 0, 255, 128)? And what is it (255, 0, 255, 230)?


    > ³ This is just one possible model to represent color. There are others in computer
    graphics and print. However, this is the one most commonly used in Java programming,
    so we will concentrate on this model.'
