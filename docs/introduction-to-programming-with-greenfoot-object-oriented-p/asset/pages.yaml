  md: '# myCrab


    When we have an object variable, we can store objects into it. We can now put
    this together with our instruction to create a crab object, which we saw in Section
    4.2.


    Crab myCrab;


    ```

    myCrab = new Crab();

    ```


    As before, we can also write this in a single line:


    ```

    myCrab = new Crab();

    ```


    This single line of code does three things:


    +   - It creates a variable called myCrab of type Crab.

    - It creates a crab object (an object of type Crab).

    - It assigns the crab object to the myCrab variable.


    When we have an assignment statement, the right hand side of the assignment is
    always executed first (the crab object is created), and then the assignment to
    the variable on the left takes place.


    In our diagrams, we draw object variables storing objects using an arrow (Figure
    4.4). Here, the variable myCrab stores a reference to the crab object. The fact
    that object variables always store references to the objects (and not directly)
    will become important later, so we will be careful to accurately draw it like
    this.


    The type of the variable and the type of the value assigned to it must always
    match. You can assign an int value to an int variable, and you can assign a Crab
    object to a Crab variable. But you cannot assign a Crab object to an int variable
    (or any other non-matching combination).


