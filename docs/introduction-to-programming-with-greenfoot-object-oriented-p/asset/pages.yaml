  md: "# C. Collision detection\n\nsection of\\ars using their\nbounding boxes\n\n\
    ![](img/410f5f709c4688c1903940c91e75e8ab_278_0.png)\n\nThese methods return other\
    \ actors whose image intersects with the calling actor's\nimage. Images intersect\
    \ when any part of one image touches any part of another\nimage. These methods\
