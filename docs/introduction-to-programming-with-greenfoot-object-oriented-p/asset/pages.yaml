  md: "# Casting\n\nCasting is the technique of telling the compiler a more precise\
    \ type for our object than it can work out for itself. In our case, the object\
    \ returned from getWorld is of type World, and we are now telling that it is actually\
    \ of type Space. We do this by writing the class name (Space) in parentheses the\
    \ method call. Once we have done this, we can assign the result to a variable\
    \ of type Space (instead of a World variable) and then call methods defined in\
    \ Space:\n\n```\ngameOver();\n```\n\nIt is worth noting that casting does not\
    \ change the type of the object. Our world actually is of type Space all along.\
    \ The problem is just that the compiler does not know this. With this, we are\
    \ just giving additional information to the compiler.\n\nLet's get back to checkCollision\
    \ method. Once we have cast our world to Space and stored it in a variable we\
    \ call all methods on it: those defined in Space and the inherited ones defined\
    \ in World. Thus, our existing calls to addObject and removeObject should still\
    \ work, and the gameOver call should work as well. Code 9.2 shows the fixed method.\n\
    \n# Code 9.2\n\n```\n/**\n * Check whether we are colliding with an asteroid.\n\
    \ */\nprivate void checkCollision() {\n    Asteroid a = (Asteroid) getOneIntersectingObject(Asteroid.class);\n\
    \    if (a != null) {\n        Space space = (Space) getWorld();\n        space.addObject(new\
    \ Explosion(), getX(), getY());\n        space.removeObject(this);\n        space.gameOver();\n\
    \    }\n}\n```\n\n**Exercise 9.44** Implement the call to the gameOver method,\
    \ using the cast of the World to Space, as discussed here. Test. This should now\
    \ work, and the score-board should come up when the rockets explode.\n\n**Exercise\
    \ 9.45** What happens when we use a cast incorrectly? Try casting the world object\
    \ to say, **Asteroid** instead of Space. Does this work? What do you observe?\n\
    \nThis work so far achieved the display of our “Game Over” (still with an incorrect\
    \ score). We shall leave the scoring as an exercise at the end of this chapter.\
    \ If you want to fix this now, you may jump ahead to the end-of-chapter exercises\
    \ and look into this first. Here, we will look into proton waves next.\n\n# Adding\
    \ fire power: the proton wave\n\nOur game is getting pretty good. The final thing\
    \ we will discuss in detail in this chapter is the addition of a second weapon:\
    \ the proton wave. This would give the game a little more variety. The idea is:\
    \ Our proton wave, once released, outwards"
