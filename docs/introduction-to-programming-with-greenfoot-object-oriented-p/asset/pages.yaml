    > When we say "the types must match," this does not actually mean that they must
    be the same. There are situations where types match but are not the same. For
    example, we can assign a subclass to a superclass type, such as assigning a Crab
    to an Actor variable (because a crab is an actor). These are subtleties that we
    shall discuss later.'
