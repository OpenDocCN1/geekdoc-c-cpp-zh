  md: '# Chapter 4 Finishing the crab game


    Figure 4.3 A variable storing an integer value


    The general form of an assignment statement


    ```

    variable = expression;

    ```


    That is, on the left hand side is always the name of a variable, and on the right
    hand side is an expression that is evaluated, and its value is stored into the
    variable.


    Often in our programs, we want to declare a variable and store a value in it.
    So often we will find the variable declaration and assignment statements together:


    +   int age;

    age = 12;


    Because this is so common, Java allows us to write these two statements together
    in one line:


    ```

    int age = 12;

    ```


    This single line creates the integer variable age and assigns the 12 to it. It
    does exactly the same as the two-line version above.


    Assignments overwrite any value previously stored in it. Thus, if we have our
    age variable now storing the value 12, and then we write


    ```

    age = 42;

    ```


    the age variable will now store the value 42. The 12 is overwritten, and we cannot
    get it back.


    # 4.5 Object variables


    We mentioned above that variables cannot only store numbers, they can also store
    objects.


    Java distinguishes primitive types and object types. Primitive types are a limited
    set of often used data types, such as int, boolean and char. There are not many
    of them—Appendix D lists all primitive types in Java.


    Every class in Java also defines a type, and for example, we get a type Crab.
    So with our class Crab, our Lobster class defines a type Lobster, and so on. We
    can declare variables of these types:


    ```

    Crab myCrab;

    ```


    Note that again, as before, we write the type at the front (Crab), followed by
    the name which we can make up (myCrab), and a semicolon.'
