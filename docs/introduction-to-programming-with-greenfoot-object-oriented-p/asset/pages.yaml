    \ long as the object exists. They can be used over and over again across multiple\
    \ method calls and multiple methods. Thus, if we want an object to store information\
    \ for a longer time, an instance variable is what we need.\nInstance variables\
    \ are defined at the top of the class, following the class header using the keyword\
