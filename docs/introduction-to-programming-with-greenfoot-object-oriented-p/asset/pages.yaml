  md: '# Counting worms


    The final thing we want to achieve is to add functionality so that the crab counts
    how many worms it has eaten. If it has eaten eight worms, we win the game. We
    also want to play a short “winning sound” when this happens.


    To make this happen, we will need a number of additions to our crab code. We need


    +   - an instance variable to store the current count of worms eaten;

    - an assignment that initializes this variable to zero at the beginning;

    - code to increment our count each time we eat a worm;

    - code that checks whether we have eaten eight worms. and stops the game and the
    sound if we have.


    Let us do the tasks in the order in which we have listed them here.


    We can define a new instance variable by following the pattern introduced above.
    Below our two existing instance variable definitions, we add the line


    ```

    private int wormsEaten;

    ```


    Here the type int indicates that we want to store integers (whole numbers), and
    the name wormsEaten indicates what we intend to use it for.


    Next we add the following line to the end of our constructor:


    ```

    wormsEaten = 0;

    ```


    This initializes the wormsEaten variable to zero when the crab is created. Strictly
    speaking, since instance variables of type int are initialized to zero automatically.
    However, sometimes we want the initial value to be something other than zero,
    so writing our own initialization statement is good practice.


    The last bit is to count the worms and check whether we have reached eight. We
    need to do this every time we eat a worm, so we find our lookForW method where
    we have our code that does the eating of the worms. Here, we add a line of code
    to increment the count:


    ```

    wormsEaten = wormsEaten + 1;

    ```


    As in an assignment, the right hand side of the assignment symbol is evaluated
    first (wormsEaten + 1). Thus, we find the current value of wormsEaten and add
    1 to it. Then we assign the result back to the wormsEaten variable. As a result,
    the variable will be incremented by 1.


    Following this, we need an if-statement that checks whether we have eight worms
    yet, and plays the sound and stops execution if we have. Code 4.6 shows the complete
    lookForWorm method with this code. The sound file used here (fanfare.wav) is included
    in the sounds folder in your scenario, so it can just be played.'
