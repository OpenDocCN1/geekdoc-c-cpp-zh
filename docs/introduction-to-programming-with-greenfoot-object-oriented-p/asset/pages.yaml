    ![](img/410f5f709c4688c1903940c91e75e8ab_43_0.png)


    The number between the parentheses in the turn instruction—i.e., the 5 in turn(5)—is
    called a parameter. A parameter is an additional bit of information that we have
    to provide when we call some methods.


    Some methods do not expect any parameters. We write those by writing the method
    name, the parentheses, and nothing in-between, for example stop(). Other methods,
    such as turn and move, and more information: How much should I turn? How much
    should I move? In this case, we have to provide that information in the form of
    a parameter value between the parentheses, for instance turn(17).


