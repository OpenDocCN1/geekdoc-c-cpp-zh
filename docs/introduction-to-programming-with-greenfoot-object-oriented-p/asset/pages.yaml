  md: '# 9.5 Colliding with asteroids


    Exercise 9.28 Create a new method stub (a method with an empty body) in class
    Rocket for checking for collisions with asteroids. Call it checkCollision. This
    method can be private and needs no return value or parameters.


    Exercise 9.29 In the rocket''s act method, add a call to the checkCollision method.
    Ensure that your class compiles and runs.


    The first subtask is to check whether we have collided with an asteroid. Greenfoot''s
    Actor class contains a number of different methods to check for collisions, each
    with different functionality. We have seen one of them—getIntersectingObject—in
    the previous chapters. Let us now look at the rest of them as well.


    Exercise 9.30 Look at the documentation of the Actor class and write down all
    methods related to collision detection.


    Exercise 9.31 You will notice that there are also methods to tell you about objects
    nearby (even if you are not colliding). Write those methods down as well.


    Appendix C presents a summary of the different collision methods and their functionality.
    This might be a good time to have a quick look through it. At some stage, you
    should become familiar with all the collision detection methods.


    For our purpose, getIntersectingObject or getIntersectingObjects seem like a good
    fit. Two objects intersect if any of the pixels in their intersect—this is pretty
    much what we need.


    In Chapter 5 we have one surprising effect: If you look really carefully, you
    can see that a collision is detected when the objects do not actually seem to
    touch each other. This is caused by transparent pixels in the actor images.


    Images in Greenfoot are always rectangles. When we see non-rectangular images,
    such as the rocket, it is because some pixels in the image are transparent (invisible);
    they contain no color. For the purpose of our program, however, they are still
    part of the image.


    Figure 9.2 shows the rocket and asteroid images with their bounding boxes. The
    bounding box is the edge of the actual image. (The image of the rocket is a little
    bigger than what seems necessary to make it the same size as the second rocket
    image, rocket-WithThrust, which shows the flame in the currently empty area.)


    ![](img/410f5f709c4688c1903940c91e75e8ab_184_0.png)'
