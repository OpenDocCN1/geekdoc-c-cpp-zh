  md: '# 10.7 Working with images


    Some more exercises using the sound class are at the end of this chapter in the
    Drill and practice section.


    As discussed briefly in previous chapters (for example, when we produced the asteroids
    background in Chapter 9), managing images for actors and world backgrounds can
    be achieved in two different ways: We can use prepared images from files, or we
    can draw an image on the fly in our program.


    We shall discuss both methods in a little more detail here.


    # 10.8 Image files and file formats


    There are various ways to acquire images for our scenarios. The easiest is, of
    course, to use the Greenfoot image library. These are presented automatically
    when we create new classes. There are also several good libraries of free images
    and images available on the Internet. (Make sure however, that the images you
    want to use are really free for public use—not everything is free or in the public
    domain because it is on the Internet. Respect other people''s copyright and license
    terms.).


    The most interesting alternative, if we want to make our scenarios unique and
    give them their own atmosphere, is to make images ourselves.


    There are several graphics programs available that we can use to produce images.
    Photoshop is maybe the best known commercial program, and is certainly a very
    good one to use if you happen to have it. However, there are also free open source
    programs that provide similar functionality. Gimp is an excellent program with
    many sophisticated features, and it is worth installing. There are also many simpler
    programs that could be used.


    Producing good looking graphics takes some time to learn, and cannot be discussed
    in detail in this book. Play and practice, and you will figure out many techniques
    and tricks. Here we shall concentrate on the technologies of using images.


    One of the important questions is what file formats to use when saving images.
    As with sounds, there is a trade-off to be made between quality and file size.
    Image files have the potential to be very large (much larger than the code files
    in our scenarios), so they can easily dominate the overall download size of our
    project. Again, this is particularly important if we want to export our scenario
    to a web server, such as the Greenfoot website. Different image formats can lead
    to different file sizes by factor of 10 or more, meaning that the scenario will
    download 10 times as fast (because it is only a tenth of the size) if we choose
    formats well.


    > http://www.gimp.org'
  merge: -1
