  md: '# CODING IN THE ENERGY INDUSTRY


    The oil, gas, and electricity industries are eager to adopt and apply new techniques
    that improve efficiency and profitability. Many companies are just beginning the
    process of digitization, which provides many opportunities for coders. In some
    instances, the terms "programmer" and "coder" are used interchangeably to mean
    "a person who provides software that allows a computer to perform a particular
    function." In other cases, the term "programmer" is used to mean "a person who
    creates an original software program," and the term "coder" is used to refer to
    "a person who uses existing software to create an application to perform a specific
    task." For example, data mining is the process of collecting and analyzing large
    amounts of data. A coder might use data-mining software to create a unique application
    that looks for patterns of energy usage among a particular company’s customers.
    As more software has become available that can be used to create customized applications,
    the demand for coders is growing at a faster rate than the demand for programmers
    to create original software.


    The "cloud" consists of remote computers that provide space for data to individual
    companies. Some cloud providers are independent companies, but large organizations,
    such as utilities, often contract for cloud space and services with large corporations
    such as IBM, Apple, Google, or Microsoft because these companies offer very large
    data capacity.'
  merge: -1
