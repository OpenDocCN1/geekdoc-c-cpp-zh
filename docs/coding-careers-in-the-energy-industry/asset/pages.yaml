    In the late twentieth century and early twenty-first century, concerns about pollution
    from burning fossil fuels led to a search for alternate forms of energy that were
    “cleaner.” Coal production decreased from its peak in 2008 to 2016, and then increased
    slightly by about 6 percent in 2017. Although the Trump administration removed
    some environmental regulations on coal plants in 2017, this mainly eased expenses
    only on existing plants, and as of 2018 there are no plans to build more coal-fired
