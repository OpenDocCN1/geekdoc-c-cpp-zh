  md: '# GLOSSARY


    **artificial intelligence (AI)** The programming of computers to learn and make
    decisions in a manner similar to the way that human beings do.


    **big data** Vast amount of data captured from databases and direct sources such
    as sensors.


    **blackout** A complete loss of power in an area.


    **British thermal unit (Btu)** A measure of energy equivalent to the amount of
    heat needed to raise one pound of water by one degree Fahrenheit.


    **brownout** A partial loss of power in an area.


    **catastrophe** A disaster.


    **chief executive officer (CEO)** The head of a company.


    **cloud** The collection of computers housed by service providers at remote locations,
    on which companies store their data.


    **cybersecurity** The process of protecting computers and data.


    **data acquisition** In terms of computers, the process of collecting data.


    **data mining** Using software to search through very large collections of data
    to find patterns.


    **divert** To switch from one direction to another.


    **drone** A remotely controlled unmanned vehicle, most often an aircraft.


    **electronic data interchange (EDI)** The exchanging of data between computer
    systems.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'generator A machine that converts mechanical energy for fuel into electricity.


    geospatial Relating to a specific location.


    greenhouse gas A gas such as carbon dioxide that accumulates in the atmosphere
    and keeps heat from escaping, contributing to global warming.


    hacker A person who breaks into a computer system.


    haphazard Random, without a plan.


    hydroelectric The conversion of kinetic (motion) energy from running water into
    electricity.


    impedance The amount of resistance an electric component has to the flow of electricity
    through it.


    inhibit To stop.


    in-house On a company''s premises.


    integrate To join together.


    internal combustion A process by which gasoline or another fuel is burned to generate
    energy to power an engine.


    internal customer People who work at or have a closer relationship to a company,
    such as a stakeholder or employee, who also buy materials that the company sells.


    load The amount of electricity sent from a power station down a power line.


    machine learning (ML) A process by which software is used to allow a computer
    to improve its responses based on the success of its previous decisions.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'mimic To copy.


    neural network A computer system that uses connections mimic those of neurons
    in the human brain to solve problems.


    ozone layer A layer of the gas ozone about 6.2 miles (10 km) above Earth, which
    absorbs most of the ultraviolet radiation from the sun that reaches Earth, keeping
    the planet from getting too hot.


    portal A point at which customers interact with a company''s computer system,
    such as a website.


    predictive Capable of creating forecasts.


    predictive maintenance Using computer software to forecast when maintenance on
    a component is likely to be required.


    proliferation Expansion.


    query A question posed by a computer using a software language or application.


    sensor An electronic device that is placed on a component and sends information
    on its status to a computer.


    substation An assemblage of equipment through which electricity passes and reduces
    the high voltage of electrical power to a level suitable for supply to consumers.


    synchronize To adjust two or more things so that they occur at the same time.


    syntax The rules that govern usage in a human or computer language.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '**transformer** A device that increases or decreases the voltage of electricity
    that passes through it.


    **transmission line** The line down which electricity is sent from a power station
    to a home or business.


    **turbine** A machine in which a wheel or rotor, fitted with blades, is made to
    revolve by a fast-moving stream of water, steam, gas, air, or other fluid, resulting
    in the generation of electricity.


    **voice recognition** Technology that allows a computer system to interpret human
    speech.


    **yield optimization** Reducing the amount of fuel used to produce energy when
    it is likely that demand is going to be low.'
