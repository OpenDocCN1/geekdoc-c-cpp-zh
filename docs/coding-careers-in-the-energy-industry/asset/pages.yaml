  md: '# JOBS LOST and GAINED


    Automation and digitization advance in the energy industry. The number of workers
    for some traditional hands-on jobs will be reduced. Smart meters can be read remotely
    from a truck that driven past a house or business are already being implemented
    in some areas. Such technology reduces the number of workers who read meters manually.
    As part of the smart grid, meters will simply send their monthly data automatically
    to customer billing systems, without any need for meter readers. More billing
    operations will likely occur automatically as well, a result of information transmitted
    directly into the system. Automated call centers and self-service customer portals
    reduce the need for human workers too. Service scheduling may also become an automated
    process.


    At the same time that advances in technology are replacing some jobs, they are
    creating new ones. The majority of these jobs will be technical engineers, computer
    programmers, and coders. Programmers and coders will be needed to write the software
    and applications that run in-house digitized systems at energy-related companies
    and utilities, upgrade them as needed, and analyze the data produced by them.
    They will also be needed to create, test, and upgrade the software used for the
    smart grid—a process that will take many years. For those presently in high school,
    this is an excellent time to become a coder in the energy industry, as demand
    for coders is likely to be high for quite some time.


