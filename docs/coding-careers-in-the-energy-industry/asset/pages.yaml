  md: '# THE TWENTIETH CENTURY AND BEYOND


    The ability to use nuclear power to produce energy was developed—along with the
    atom bomb—during World War II. After the end of the war in 1945, the US government
    looked to nuclear energy as a way to produce large amounts of electricity. They
    built power plants that provided energy to customers in nearby towns and cities.
    However, accidents such as the partial meltdown of the Three Mile Island nuclear
    power plant near Middletown, Pennsylvania, in 1979 inhibited public acceptance
    of nuclear power, and very few new plants were built in the United States. Nuclear
    energy–based power


