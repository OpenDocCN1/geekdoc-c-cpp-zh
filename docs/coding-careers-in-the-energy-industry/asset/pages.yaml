    Edith Clarke was the first female electrical engineer in the United States. According
    to Scientific American, her innovative ideas can be considered the first steps
    toward smart grid grid technology. Clarke studied mathematics and astronomy at
    Vassar College, graduating in 1908. She went on to study civil engineering at
    Columbia University, and in 1918 she became the first woman to graduate from the
    Massachusetts Institute of Technology with a master''s degree in electrical engineering.
