    ## New Technologies in the Energy Industry


    Computer-controlled equipment, monitoring, and analysis play a key role in reliably
    providing electricity. These technologies are used in power plants, homes, and
    businesses to monitor and control energy-producing and -distributing equipment.
    Interruptions in the availability of power can cost the economy several billion
    dollars every year. However, making sure that interruptions don’t occur in the
    power supply is a difficult task. Consumers as well as companies are looking for
    ways to reduce their energy costs. Automated monitoring technology can help. New
    artificial intelligence, machine learning, and deep learning computer technologies
    will provide benefits for the energy industry and consumers.


    ## TECHNOLOGY FOR BETTER ENERGY


    The failure of a single component among thousands used in a plant can result in
    a shutdown. The utility responsible for this type of problem loses income since
    customers can’t use electricity, and it might lead to losing customers. More important,
    since many people rely on power to operate daily tasks, a power shutdown affects
    customers’ ability to perform these activities. To reduce drops in power, many
    ![](img/74d9c9c5b42a544a28394e6474d14a83_35_0.png) [32] Coding Careers in the
    Energy Industry


    plants are interconnected. Together, they form regional transmission systems.
    Such systems allow electricity to be diverted from areas of low usage to those
    with demand at any given time. However, these systems are complex and sometimes
    require generators thousands of miles apart. Software programmers must design
    programs that run such networks. The use of sensors to monitor parts and equipment
    is necessary to improve the reliability of power supply. A sensor is a device
    that monitors the state of a system and sends data about its status to a computer.
    For example, a temperature sensor in an automobile monitors the temperature of
    the engine. It sends information to the car’s computer, and if the temperature
    gets too high, it might alert the driver with a light. Sensors can detect places
    where a power failure is likely to occur and provide advance warning, improving
    the safety and reliability of the system.


    The biggest change in the way that power is distributed is the use of artificial
    intelligence and machine learning in the power system. Artificial intelligence
    is the use of software to simulate human intelligence in order to make complex
    decisions in a way that mimics human logic. Machine learning is the process by
    which computers improve their analytical and decision-making processes based on
    experience—much in the way that human beings learn. In machine learning, computers
    use a series of rules, called algorithms, to analyze vast volumes of data, detect
    patterns in it, and provide decisions or predictions according to patterns. In
    machine learning software, the results of various decisions are analyzed by the
    computer software to identify the best choices.


    Deep learning is an advanced form of machine learning. It uses a technique called
    neural networks in combination with massive sets of data to allow a program to
    train itself. Neural network systems consist of a collection of connected units,
    called nodes, often referred to as artificial neurons. The collection of artificial
    neurons mimics the neurons that make up the human brain. Neural networks are not
    programmed by given rules. Instead, they are set a goal and use trial and error
    to create possible ways to reach the goal. These solutions are ranked, and the
    best are kept. Then the analysis is run again, and the selection of the best solutions
    occurs again. This process continues with the computer “learning” more with each
    analysis.


    AI and ML are necessary to analyze vast quantities of data to find meaningful
