    requirements. Companies can use this information to create individual offers for
    additional products or services targeted at customers who might need them. In
    many locations, customers can choose from various suppliers for their oil, electricity,
    and natural gas. Developing relationships with customers in this way can help
    companies keep customers and increase their revenues.


    Programmers are needed to create programs that automate the process of responding
    to customers’ queries in call centers. The creation of virtual agents allows computerized
    responses to customers’ questions and provides instant assistance. From the accounting
    side, computer programs are used to monitor customers’ payment history and alert
    personnel to customers who are unlikely to pay their bill.


    Artificial intelligence–based systems use data obtained from households with smart
    meters—meters that send energy usage data back to the utility. Data from these
    customers can be analyzed to identify which appliances are using specific amounts
    of energy and how much of a customer’s energy bill is attributable to each type
    of usage. This type of service allows customers to reduce their costs by upgrading
    energy-hungry appliances or changing their pattern of usage. Using AI and ML to
    analyze this type of data from a large number of users allows companies to provide
    such information even to homes that don’t have smart meters.


