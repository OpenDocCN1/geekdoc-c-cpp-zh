    ## 编码对能源行业的影响


    能源的生产对于经济每个方面的运行都至关重要。地球上有七十亿人口，生产足够的能源来满足他们的需求是一项巨大的工程。能源的产生和分配方法随着时间而变化并不断演变。随着人们越来越意识到燃烧化石燃料对环境产生的影响，这些担忧在能源产生方式中发挥了越来越重要的作用。预计2040年，世界人口将增长接近九十亿。人口的增加以及发展中国家生活水平的提高，将产生更大的能源需求。然而，在满足这些需求的同时，必须解决气候变化问题，而发电正是气候变化的影响因素之一。


    ## 能源行业简史


    自远古以来，利用能源一直是推动文明进步和改善人类生活的关键。蒸汽驱动的简单机器在古埃及时期就已经了。这仅仅是能源生产的开始。随着人口的扩张以及人们寻求相互旅行和贸易，旧的能源形式得到了改进，新的技术被发明出来。


    ## 早期发电


    随着时间的推移，蒸汽机技术不断改进。18世纪中叶，托马斯·纽科门和詹姆斯·瓦特对蒸汽机的设计进行了改进，产生了第一台现代蒸汽机。现代蒸汽机使19世纪和20世纪的工业革命成为可能，实现了工厂的自动化生产。到19世纪，蒸汽机为农机、火车、船只和工厂机械提供动力。1880年，托马斯·爱迪生将一台煤驱动的蒸汽-


    连接到他在纽约市工厂的第一台发电机上，彻底改变了电力行业。


    ![](img/74d9c9c5b42a544a28394e6474d14a83_18_0.png)


    产生的电为华尔街和《纽约时报》的第一批电灯提供了动力。


    1882年，世界上第一座水电发电站在威斯康星州的阿普尔顿投入运行。到19世纪末，汽车开始上路。最初有竞争性的蒸汽动力、电力和汽油动力版本的汽车。燃烧汽油驱动汽车的内燃机胜出，因此将石油加工成汽油以供应内燃机变成了一项行业。到1908年，亨利·福特完善了在流水线上批量生产汽车的过程，


    ![](img/74d9c9c5b42a544a28394e6474d14a83_19_0.png)


    汽车变得中产阶级也负担得起。从20世纪初到现在，能源需求稳定增长。发展中国家的工业化、世界人口增长以及日益增多的电子设备推动了这种增长。可再生能源需求每十年翻一倍。发电厂规模扩大，产生了巨大的水坝和燃煤电厂。线路、变电站、变压器以及从电厂分配能源到家庭和企业的网络被称为电网，或简称“电网”。


    ## 二世纪及以后


    利用核能产生能源的能力是在二战期间开发的——原子与原子弹一起。在1945年战争结束后，美国政府开始将核能视为产生大量电力的方式。他们建造了为附近城镇和城市提供能源的电厂。然而，1979年宾夕法尼亚州附近三岛核电厂发生的局部熔事故阻碍了公众对核能的接受，美国很少新建新的核电厂。核能发电


    ![](img/74d9c9c5b42a544a28394e6474d14a83_20_0.png)


    工厂在世界其他地区更为常见，例如欧洲，特别是在难以获得化石燃料的地区。


    20世纪后期和21世纪初，对燃烧化石燃料污染的担忧导致人们寻找更“清洁”的替代能源。煤炭产量从2008年的峰值下降到2016年，并在2017年小幅增长6%。尽管特朗普政府在2017年取消了一些针对燃煤电厂的环境法规，但这主要缓解了现有电厂的成本，截至2018年，还没有建造更多燃煤电厂的计划。相反，能源行业继续建设可再生资源（如风场），并燃烧天然气，天然气在美国廉价且丰富，通常与石油一同发现。天然气不产生与煤炭相同的副产物，因此它是更清洁、更环保的能源来源。可再生能源的生产和消费也继续增长。2017年，生产和消费达到了约110万亿英热单位（Btu）的历史新高。Btu是能量输出的标准衡量标准，基于使1磅水的温度升高1度华氏所需的热量。


