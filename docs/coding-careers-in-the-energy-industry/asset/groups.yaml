    各种传统和替代能源，以及智能电网，可以自我监控和调整，以预测未来的能源和维护需求、响应需求，并在最少人工干预的情况下确保安全。


    海量数据（被称为大数据）现已可用。这些数据是在计算机系统和传感器产生或从其采集的。人工智能（AI）和机器学习（ML）可用于分析大数据，因为配备多个处理器的计算机现在能够以低成本提供海量的计算能力，而且能够存储大量数据的驱动器变得越来越便宜。这些因素使得高效地分析海量数据成为可能。使用此类巨大且多样化的数据集使得机器学习更加准确。


    ![](img/74d9c9c5b42a544a28394e6474d14a83_38_0.png)


    这是一个使用神经网络的未来电子电路板概念。


    ![](img/74d9c9c5b42a544a28394e6474d14a83_39_0.png)


    能源管理系统用于控制整个设施的能源消耗。


    谷歌、微软、亚马逊和 IBM 等公司已建立相关服务，帮助公用事业等公司应用这些新技术，这使得它们的实施更具吸引力。能源行业中的许多操作刚刚开始尝试应用这些技术，因此编码人员和程序员有大量的参与机会。


    ## 更智能的能源使用


    公用事业并不是能源行业中唯一需要编码人员的公司。私营企业也雇用编码人员帮助大型工业公司改进能源使用。其中一家公司是位于加州山景城的 Verdigris Technologies。该公司成立于
    2011 年，提供了一种基于人工智能的系统帮助客户管理能源消耗。该系统用于控制大型商业建筑和业务设施的能源消耗。


    在这种方法中，智能传感器连接到公司的电路中，提供了追踪能源消耗的能力。传感器通过无线计算机技术将收集的数据发送到 Verdigis。信息在 Verdigis
    进行处理，客户公司可以 24/7 检查其计算机上的仪表板。计算机软件允许 Verdigis 监控每台设备或机器。例如，该公司成功识别了位于旧金山的 W 酒店可以避免的能源低效率问题。


    另一公司 PowerScout 将基于 AI 的软件应用于能源行业数据，以预测可能降低能源成本的方法。PowerScout 为消费者提供了改进家居能源使用和降低成本的建议。该公司帮助客户就家庭购买可再生能源做出决策。


    这仅仅是两家使用软件解决企业和消费者能源需求的公司。未来可能会有更多公司使用数据挖掘和人工智能提供与能源相关的分析和咨询服务。这些公司将需要程序员来创建用于收集和分析数据的程序，以及用于监控和报告能源消耗并提供客户建议的软件。


    ## 人工智能在能源行业的应用


    以下是人工智能在能源行业中的一些应用。负荷预测是预测特定地点需要多少能源。预测短期内需要多少能源是确保有足够能源满足需求峰值并避免短缺的关键。它还允许公用事业在需求可能较低时减少生产能源时所使用的燃料量。更高效的燃料利用有助于控制公司的成本。由于这些成本会以更高费用的形式传递给消费者，这也有助于客户降低能源成本。在一个被称为“产出优化”的过程中，软件被用于监控风场上的风力机设备，并在每台风力机运行时优化其涡轮。这一过程使他们能够产生更多的能量。


    预测性维护需要软件。该过程利用 AI 识别的模式来信号组件何时可能需要维护。还需要软件来编写无人机程序，这些无人机可以检查


    ![](img/74d9c9c5b42a544a28394e6474d14a83_42_0.png)


    机器人能源系统检查无人机正在检查中国电厂的配电组件。


    如线路等组件。程序员创建的深度学习算法可用于训练无人机发现缺陷并预测故障。基于人工智能的检查不仅更安全、更节省时间，还可以帮助无需人工检查的操作。


    ## 可再生能源的人工智能


    可再生能源是指那些自然再生的能源，例如风能或太阳能。可再生能源的一个主要挑战是它们的产量随天气波动。基于人工智能的计算机程序可以帮助预测天气如何影响它们。这类数据利用气象站的详细报告和卫星数据，允许公司对风力场等可再生能源产生的电量提供更准确的预测。


