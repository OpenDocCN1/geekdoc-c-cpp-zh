    # 埃迪·克拉克 (EDITH CLARKE)


    ![](img/74d9c9c5b42a544a28394e6474d14a83_13_0.png)


    埃迪·克拉克是美国第一个女性电气工程师。根据《科学美国人》介绍，她的创新思想被认为是迈向智能网技术的第一步。克拉克在瓦萨学院学习数学和天文学，并于1908年毕业。随后，她在哥伦比亚大学学习土木工程，并在1918年成为第一位从马萨诸塞理工学院获得电气工程硕士学位的女性。然而，由于她是女性，


    她无法找到当工程师的工作。因此，她在通用电气（GE）担任了“计算员”主管。当时的“计算员”是指那些（大多为女性）执行数学计算的员工。在通用电气，她在1921年发明了克拉克计算器。这是一种用于求解计算输电线电流、电压和阻抗的方程的工具。这些信息对于电力输送至关重要。克拉克计算器使得此类计算比以前的方法快了十倍。


    1926年，克拉克成为第一个在美国电气工程师学会年会上发表论文的女性。1947年，她被德克萨斯大学聘用，在那里教了十年书，成为美国第一位女性电气工程教授。1948年，克拉克成为美国电气工程师学会的第一位女性会员，2015年她被追授入国家发明家荣誉堂。


