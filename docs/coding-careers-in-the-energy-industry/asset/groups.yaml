    # chapter_04


    # Coding Jobs in the Energy Field


    In the energy industry, jobs for coders and programmers include research and analysis
    interns, and junior and senior analysts and programmers. These professionals work
    for large and small organizations, and for government agencies, in both traditional
    and alternative energy. Coders will find employment not only at utilities but
    also in contract software development companies, and in government agencies such
    as the US Department of Energy.


    ## DATA AND OPERATIONS ANALYSTS


    Data and operational analysts use their knowledge of math, science, and engineering
    to create and apply computer-based analysis to extract and interpret information
    from data collected and stored in company databases. They work with advanced software
    to aid energy companies with forecasting and predicting energy requirements. The
    information they supply assists utilities in decision-making and improving energy
    generation and distribution efficiency.


    Most data analysts have a bachelor''s degree, although an associate''s degree
    or professional certification plus work experience can be acceptable for some
    entry-level jobs. Being an operations research analyst usually requires a bachelor''s
    degree, and many employers prefer candidates with a master''s degree. Operational
    analysts need to take a combination of mathematics and statistics courses, as
    well as computer science. Some candidates have dual degrees in operations research
    and computer science, which make them particularly desirable to employers.


    Junior analysts serve as part of a team, learning the different activities involved
    in the energy business. They are supervised by a senior analyst. They might also
    participate in company-sponsored workshops designed to enhance their skills. Senior
    analysts perform high-level data analytics tasks and manage project teams. They
    evaluate the requirements for an analysis project, estimate the resources and
    time required to create the code and complete the project, and track the project''s
    progress and costs. Senior analyst positions usually require a college degree
    and several years of coding experience, preferably in the energy industry.


    ## Coding Careers in the Energy Industry


    ![](img/74d9c9c5b42a544a28394e6474d14a83_50_0.png)


    A senior analyst supervises a junior analyst working on a software application.


    ## RESEARCH ANALYSTS


    Research analysts create and maintain databases that contain information used
    to answer research questions being investigated by the operations or research
    personnel at energy companies or federal or state energy research laboratories.
    Research analysts use software to create queries that pull information from the
    data collected and housed in databases. They perform computer-based analyses on
    the data and format it into tables and charts. This position requires at least
    a bachelor’s degree in computer science or a related area. Higher-level positions
    might require a master''s degree.


    Coding Jobs in the Energy Field [47]


    Research analysts must be familiar with the software used in the energy operations
    field, such as the computer language Python and specialized utility software.
    Research laboratory software will include applications such as LabVIEW and MATLAB,
    which are used to analyze measurements taken in the field, as well as Python.


    ## SOFTWARE DEVELOPERS/PROGRAMMERS


    Software developers, or programmers, create, test, and implement the applications
    that run on computers. The computer systems that control the energy generation,
    distribution, and analysis processes need industry-specific software. Software
    developers also modify existing computer programs to adapt them to specific utility
    and company needs. In addition, they integrate software applications from a variety
    of systems so that data can be shared. Programmers often work on teams with a
    lead or senior programmer as the head of the team. Therefore, programming jobs
    are available from entry level to senior level. Entry-level software programmers
    might only have job experience and a certificate showing they have mastered particular
    software languages used in the industry, or an associate’s degree. Most have a
    bachelor’s degree, and some of those in higher-level positions have a master’s
    degree. The most important element for gaining a programming job is hands-on experience.


    ## APPLICATIONS PROGRAMMERS


    Applications programmers create and modify computer application software or specialized
    utility programs. They work with users and managers to identify their requirements
    and then develop programs to meet those needs. They often work with other members
    of a programming team. They might provide solutions for partner companies or suppliers,
    as well as the company they work for. They create guides for personnel on how
    to use the software they develop, as well as document the processes they used
    to develop the programs, in case they need to be modified in the future. This
    job requires knowledge of popular applications software, such as SQL and Oracle,
    and familiarity with programming languages used in the energy and business field,
    including Python. Because applications are often developed for use by personnel
    working beyond the company’s premises—such as those collecting data at wind farms
    or solar array sites—experience with software used to create smartphone and web
    applications might be required.


    ## BIG DATA PROGRAMMER


    Big data programmers develop programs to process very large quantities of data,
    such as that collected in large databases and by smart grid remote sensors. These
    programmers create and modify software to find answers to complex operational
    and business problems. This position requires


    ## geographical information systems programmer/analyst


    ![](img/74d9c9c5b42a544a28394e6474d14a83_53_0.png)


    Geographic information systems programmers work on a mapping application.


    A geographic information system (GIS) is a system designed to capture, store,
    manipulate, analyze, manage, and present all types of geographical data. Geographical
    information systems provide visual information about the nature of the terrain
    in an area. They show the location and density of particular features, both man-made
    (such as mines) and natural (such as oil-producing shale). They also show the
    density


    50 Coding Careers in the Energy Industry


    of a population in a given area. In addition, they can project changes that might
    be produced in an area by mining, oil driving, or construction of a hydroelectric
    dam or power plant.


    GIS programmers and analysts in the energy industry develop geospatial software
    and tools to capture data about the terrain and features of a physical area. They
    analyze the data and format information to be displayed in the form of a map.
    They create GIS applications to analyze terrain for mining and oil companies and
    utilities. They might analyze land-based and aerial imagery, as well as data in
    databases, to produce specialized maps. They interpret data, identify trends,
    and note patterns in data. Most GIS programmers have at least a bachelor''s degree.
    It is also possible to obtain certification through professional organizations,
    such as the Urban and Regional Information Systems Association (URISA) and the
    American Society of Photogrammetry and Remote Sensing (ASPRSI), or GIS software
    companies, such as Esri. Certification is not mandatory, but it can be beneficial
    when seeking a job.


