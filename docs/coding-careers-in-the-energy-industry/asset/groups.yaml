    Companies such as Google, Microsoft, Amazon, and IBM have set up services to help
    companies such as utilities apply these new technologies, which makes their implementation
    more attractive. Many operations in the energy industry are just starting to venture
    into applying these technologies, so there is plenty of opportunity for coders
