    # 能源行业的编程


    石油、天然气和电力行业渴望采纳并应用提高效率和盈利能力的新技术。许多公司刚刚开始数字化进程，这为编码人员提供了许多机会。在某些情况下，“程序员（programmer）”和“编码员（coder）”这两个术语互换使用，指的是“提供软件允许计算机执行特定功能的人员”。在其他情况下，“程序员”是指“创建原始软件程序的人员”，而“编码员”则指“使用现有软件创建应用程序以执行特定任务的人员”。例如，数据挖掘是收集和分析大量数据的过程。编码员可能会使用数据挖掘软件来创建一个独特的应用程序，用于寻找特定公司客户的能源使用模式。随着越来越多可用于创建定制应用程序的软件面世，对编码员的需求增长速度超过了对程序员创建原始软件的需求。


    “云端”由远程计算机组成，为各公司提供数据存储空间。一些云服务提供商是独立公司，但大型组织（如公用事业部门）通常与 IBM、Apple、Google 或 Microsoft
    等大型公司签订云空间和服务合同，因为这些公司提供非常大的数据容量。


    # 更智能的电网


    根据美国能源部（DOE）的说法，电网“由超过 9,200 个发电单元组成，发电容量超过 100 万兆瓦，并连接了超过 30 万英里（482,800 公里）的传输线路”。电网建于
    19 世纪 90 年代，几十年来一直处于无章法的增长。为了满足现代需求，需要以结合数字技术的方式进行重建，并实现自动化，以满足 21 世纪及未来的复杂需求。美国能源部正致力于创建智能电网。


    ![](img/74d9c9c5b42a544a28394e6474d14a83_23_0.png)


    这张图显示了现在将如何通过智能电网发电和分配。


    它将利用计算机、自动化和软件创建一个系统，自动将能源从各种来源分配到需要的地方，并根据需求的波动改变其分配。智能电网将减少电压下降和停电的发生次数（即电网某些区域掉电导致这些区域陷入黑暗的时期），并使电力系统更好地应对紧急情况，包括自然灾害和人为灾难。由于系统组件将进行自动通信，系统能够立即检测到停电并将资源重新路由到这些区域。它将安排团队更快修复损坏，并为医疗中心、警察和消防部门、交通灯和电话系统维持应急电源。各级都需要编码员和程序员来实现该系统所有组件的软件。


    # 编程对能源行业的影响 [21]


    在许多情况下，他们还为客户提供创建应用程序的工具，并提供顾问帮助实施这些程序。能源行业的编码员可能会与此类云服务提供商的团队合作。


    廉价的大规模计算能力的可用性使得石油和天然气的勘探更加深入、更广泛，并使发电和分配系统的自动化程度提高。此外，能源管理和控制系统（EMACS）允许对配电的规划、控制和监控进行更好的整合，并更容易实时从低需求地区向高需求地区平衡和转移电力。


    能源公司正在对电厂、变电站以及输配电网络的数字化硬件和软件进行大量投资。编码员创建的应用程序最终构成了具有更少中断、维持更高负载且寿命更长的系统，从而降低了成本并提高了效率。因此，公用事业部门已将信息技术视为其输配电网络的关键工具。


    公用事业部门需要的应用程序包括以下任务的：


    - 管理电力流

    - 在电力供应发生后分析中断情况

    - 分析历史数据——包括配电数据和与客户相关的数据

    - 分析发电机的性能

    - 提供财务和运营分析


    能源公司正越来越多地实施运营信息系统（OISs）。OIS 提供有关业务活动的数据，例如财务、销售和采购数据。这是一个较新的领域，为程序员和编码员提供了新机会。编码员必须将这些信息转换为易于理解的报告、图表和图形，以说明发现。


    # 管理公用事业客户


    在许多地区，人们可以选择由哪家公司提供石油、天然气和电力服务。因此，如果能源公司想要成功，吸引并留住尽可能多的客户非常重要。从 20 世纪 90 年代末开始，能源行业开始采用专门为……设计的客户信息系统（CISs）。


    # 流失与增加的工作岗位


    随着能源行业自动化和数字化的进步，传统工作数量将会减少。智能电表可以远程读取，而无需开车驶过房屋或营业。作为智能电网的一部分，电表将自动向客户计费系统发送每月数据，不再需要抄表员。由于技术进步，更多的计费操作也可能自动发生。自动呼叫中心和自助门户减少了对人类员工的需求。服务调度也可能变成一个自动化过程。


    在技术进步取代某些工作的同时，它们也创造了新工作。这些工作大部分将是技术工程师、计算机程序员和编码员。需要程序员和编码员来编写运行在能源公司和公用事业部门内部数字化系统的软件和应用程序，根据需要对其进行升级，并分析由其产生的数据。他们还需要创建、测试和升级用于智能电网的软件——这是一个持续许多年的过程。对于目前的中学生来说，这是成为能源行业编码员的绝佳时机，因为对编码员的需求可能持续很一段时间。


