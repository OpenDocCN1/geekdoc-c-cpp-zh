    # chapter_01


    # The Energy Industry


    Every aspect of modern life depends on energy—driving, traveling, and using electricity.
    Energy can be created in a variety of ways, but today all energy relies on computerization.
    Since computers require software code to operate, there are a great number of
    opportunities for coders in the energy industry.


    # GENERATING POWER


    To generate power, one must convert a material or element (such as oil, gas, coal,
    wind, or sunlight) into another form. This process releases energy that can be
    used to power machinery or vehicles—or, in the case of electrical energy, distributed
    via wires to power electrical or electronic devices.'
  - '[PAGE 9]


    All energy generation and distribution systems begin with the locating and collecting
    of raw material (oil, coal, gas) or the building of apparatus to capture natural
    sources of energy (such as turbine waterwheels, windmills, or solar panels). Some
    power plants burn coal or natural gas to release heat energy, which they convert
    to electrical energy. Others convert the kinetic (motion) energy of water or wind
    to electrical energy, or do the same with heat energy from sunlight. Nuclear power
    plants use radiation from radioactive uranium to heat water. This produces steam,
    which is converted by a turbine into electricity.


    Power plants distribute power in the form of electricity to homes and businesses
    by a system of wires, called the power grid. The companies that provide energy
    are called utilities. They must ensure that an adequate supply of power is provided
    to all buildings in the area they serve and that


    ![](img/74d9c9c5b42a544a28394e6474d14a83_9_0.png)


    Photovoltaic solar panels capture sunlight and convert it to electricity.


    # [6] Coding Careers in the Energy Industry'
  - '[PAGE 10]


    the power plants are operating safely as well as efficiently. Most of the steps
    in producing and distributing power and monitoring the operations of power plants
    are computerized. Among the common types of power generation systems are the following:


    +   - Fossil fuel: These plants burn coal or natural gas. The heat is used to
    make steam, which is converted by a turbine generator into electric power. Some
    fuels such as coal and gasoline produce greenhouse gases as a by-product. These
    gases—carbon dioxide, for example—can harm the ozone layer, which protects Earth
    from damaging ultraviolet radiation from the sun. Natural gas, found in the ground,
    is clean-burning and does not produce such gases. Oil is primarily used to power
    home heating systems and is also processed into gasoline to run vehicles. When
    burned, oil and gasoline also produce greenhouse gases.


    +   - Solar energy: Solar panels are used to collect sunlight. Solar panels that
    directly convert sunlight to electricity are called photovoltaic panels.


    +   - Wind: Fields of windmills, called wind farms, capture kinetic energy from
    the motion of the wind. Solar panels and windmills do not produce harmful by-products.


    +   - Hydroelectric: Hydroelectric systems use the kinetic energy of moving water.
    Modern hydroelectric plants use large dams. Water held on one side of the dam
    is released and flows over'
  - '[PAGE 11]


    the blades of the turbines connected to a generator, which transforms the mechanical
    energy into electric energy.


    +   - Nuclear power: Nuclear energy relies on the splitting of atoms in rods of
    uranium (a process called fission) to be created. This process produces heat,
    which is used to make steam that is converted by a turbine generator into electricity.
    Because nuclear power plants do not burn fuel, they do not produce greenhouse
    gas emissions. However, if an accident were to occur, the radiation released could
    harm or kill people.


    # JOBS FOR CODERS IN THE ENERGY INDUSTRY


    Traditionally, the energy-generation industry has relied heavily on mechanical
    operations overseen by human workers. In the twenty-first century, a technology
    revolution is altering the way that operations in the energy industry are carried
    out. Energy companies are developing and implementing software to streamline operations,
    improve production, and make distribution more efficient and and cost-effective.
    They have begun to deploy smart grids, computerized control centers, wireless
    sensors for monitoring usage, predictive intelligence to prepare for changes in
    demand, and computer-based technologies that require programmers and coders. This
    transition in the energy industry has created a demand'
- md: '

    for programmers that is likely to continue to grow over the coming decades. Coders
    are needed in the energy industry for a variety of applications. They write software
    to monitor remote sensors that track demand


    ![](img/74d9c9c5b42a544a28394e6474d14a83_12_0.png)


    automatically adjust the distribution of energy from a variety of sources. Software
    and sensors are also needed to monitor and provide information on the operation
    of equipment in order to avoid power outages and ensure the safety of workers
    and the general public. The increase in exploration of new areas of the country
    for oil drilling, such as the Bakken shale in the western United States, and the
    need for more power plants, mean that there is a steady demand for programs to
    analyze the impact of oil extraction and power plant construction on the environment.
    Programmers are especially needed in the areas of artificial intelligence (AI)
    and machine learning (ML), which are key aspects of power-generation automation
    and predictive technologies that allow companies to forecast future demand and
    prepare in advance to meet it.


    # EDITH CLARKE


    ![](img/74d9c9c5b42a544a28394e6474d14a83_13_0.png)


    Edith Clarke was the first female electrical engineer in the United States. According
    to Scientific American, her innovative ideas can be considered the first steps
    toward smart grid technology. Clarke studied mathematics and astronomy at Vassar
    College, graduating in 1908. She went on to study civil engineering at Columbia
    University, and in 1918 she became the first woman to graduate from the Massachusetts
    Institute of Technology with a master''s degree in electrical engineering. However,
    because she was a woman,


    she couldn''t find work as an engineer. Therefore, she took a job as a supervisor
    of "computers," at General Electric (GE). Computers were employees, mostly women,
    who performed mathematical calculations. At GE, she invented the Clarke calculator
    in 1921. This was a tool that solved equations for calculating the electric current,
    voltage, and impedance along electric power lines. This information is necessary
    for power transmission. The Clarke calculator made it possible to perform such
    calculations ten times faster than previous methods.


    In 1926, Clarke was the first woman to present a paper at the American Institute
    of Electrical Engineers'' annual meeting. In 1947, she was hired by the University
    of Texas, where she taught for ten years, as the first female professor of electrical
    engineering in the United States. In 1948, Clarke became the first female Fellow
    of the American Institute of Electrical Engineers, and in 2015 she was inducted
    posthumously into the National Inventors Hall of Fame.


