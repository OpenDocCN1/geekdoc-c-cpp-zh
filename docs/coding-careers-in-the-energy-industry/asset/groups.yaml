    # Learning to Be a Programmer


    Programmers need both technical and personal skills. To obtain a coding job in
    the energy field, you will need to know the computer languages used in that industry,
    such as Python, as well as general software used to create database, data-mining,
    and business applications. There is no way to know exactly what type of coding
    you will do on the job. You might have to create software that analyzes data from
    sensors, or a mobile app for the company''s customers. You might work with data-mining
    applications that look for patterns in data stored in databases or acquired in
    real time from sensors in the field. Therefore, it is important to develop the
    basic skills that can allow you to learn various languages, applications, and
    statistical techniques.


