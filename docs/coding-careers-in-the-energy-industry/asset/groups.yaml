    # chapter_02


    ## Coding’s Impact on the Energy Industry


    The production of energy is crucial to the functioning of every aspect of the
    economy. Seven billion people live on Earth, and producing adequate energy to
    meet their needs is a massive undertaking. Methods of generating and distributing
    energy have changed over time and continue to evolve. As people have become more
    aware of the effects that burning fossil fuels can have on the environment, these
    concerns have come to play a bigger role in how energy is generated. By 2040,
    the population of the world is projected to grow close to nine billion people.
    This increase in population, and improvements in the standard of living of people
    in developing nations, will create a much larger demand for energy. However, that
    demand must be met while addressing issues of climate change, to which energy
    generation contributes.


    ## A BRIEF HISTORY OF THE ENERGY INDUSTRY


    Since earliest times, harnessing energy has been the key to advancing civilization
    and improving people''s lives. Basic machines run by steam were present as far
    back as ancient Egypt. This was merely the beginning of energy production. As
    populations expanded and people sought to travel and trade with one another, old
    forms of energy were improved and new technologies were invented.


    ## EARLY POWER GENERATION


    Over time, steam engine technology continually improved. In the mid-1700s, Thomas
    Newcomen and James Watt introduced adaptations into the design of steam engines,
    producing the first modern steam engine. Modern steam-powered engines made the
    Industrial Revolution of the nineteenth and twentieth centuries possible, allowing
    for automated production in factories. By the 1800s, steam engines powered farm
    equipment, trains and ships, and factory machinery. In 1880, Thomas Edison revolutionized
    the power industry when he attached a coal-powered steam-


    ![](img/74d9c9c5b42a544a28394e6474d14a83_18_0.png)


    engine to the first electric generator at his plant in New York City. The electricity
    generated powered the first electric lights for Wall Street and the New York Times.


    In 1882, the first hydroelectric electricity-generating plant in the world went
    into operation in Appleton, Wisconsin. By the late 1800s, automobiles began to
    hit the roads. Initially there were competing steam-, electric-, and gasoline-powered
    versions of cars. The internal combustion engine, which burned gasoline to power
    the car, won out, so the processing of oil into gasoline, to feed internal combustion
    engines, became an industry. By 1908, Henry Ford had perfected the process of
    mass-producing cars on an assembly


    ![](img/74d9c9c5b42a544a28394e6474d14a83_19_0.png)


    line, and automobiles became affordable for the middle class. From the early 1900s
    to the present, energy demand steadily increased. The industrialization of developing
    nations, world population growth, and an ever-increasing number of electronic—and
    later—devices have fueled this increase. Renewable energy demand doubled every
    ten years. Power plants grew in size, resulting in huge dams and coal-fired plants.
    The network of transmission lines, substations, transformers, and other components
    that distribute energy from the plant to homes and businesses is referred to as
    the electrical grid, or just “the grid.”


    ## THE TWENTETH CENTURY AND BEYOND


    The ability to use nuclear power to produce energy was developed—along with the
    atom bomb—during World II II. After the end of the war in 1945, the US government
    looked to nuclear energy as a way to produce large amounts of electricity. They
    built plants that provided energy to nearby towns and cities. However, accidents
    such as the partial meltdown of the Three Island nuclear power plant near Middletown,
    Pennsylvania, in 1979 inhibited public acceptance of nuclear power, and very few
    new plants were built in the United States. Nuclear energy–based power


    ![](img/74d9c9c5b42a544a28394e6474d14a83_20_0.png)


    plants are more common in some other parts of the world, such as Europe, especially
    in areas where fossil fuels are not easily available.


    In the late twentieth century and early twenty-first century, concerns about pollution
    from burning fossil fuels led to a search for alternate forms of energy that were
    “cleaner.” Coal production decreased from its peak in 2008 to 2016, and then increased
    slightly by about 6 percent in 2017. Although the Trump administration removed
    some environmental regulations on coal plants in 2017, this mainly eased expenses
    only on existing plants, and as of 2018 there are no plans to build more coal-fired
    plants. Instead, the energy industry is continuing to build renewable resources,
    such as wind farms, and to burn natural gas, which is cheap and abundant in the
    United States, where it is often found along with petroleum. Natural gas does
    not produce the same by-products as coal, so it is a cleaner, or more environmentally
    friendly, source of energy. Renewable energy production and consumption also continued
    to grow. In 2017, production and consumption achieved record highs of about eleven
    quadrillion British thermal units (Btu). Btu is a standard measure of energy output
    based on how much heat is required to raise 1 pound of water by 1 degree Fahrenheit.
    The growth in renewable production and consumption was mostly from increased solar
    and wind resources. Hydroelectric power production remained stable.

