    # INTERNSIPS


    Internships allow students to work with industry professionals and learn firsthand
    what it is like to be a coder in the energy field. Internships are usually unpaid
    or low-paid positions that students undertake to gain hands-on experience and
    learn the ropes in the real world. Some internships are arranged as part of a
    computer science or engineering program at a university. Others are advertised
    on job search, energy industry organization, or individual company websites. Internship
    opportunities exist in government agencies,


    ![](img/74d9c9c5b42a544a28394e6474d14a83_56_0.png)


    A programmer instructs an intern in the use of energy-industry software.


    research organizations, and private companies and utilities. Interns usually perform
    basic tasks to assist researchers or software developers in an organization. They
    might write the documentation and assist with the implementation, testing, deployment,
    and maintenance of existing and new software applications.


    Both the US Department of Energy and many state departments of energy offer internships
    for students studying coding. The DOE provides paid internships for students enrolled
    in a high school, or at least part-time in a technical, vocational, or two- or
    four-year college. It provides two types of paid internships: the Student Temporary
    Employment Program (STEP) and the Student Career Experience Program (SCEP). In
    STEP, the student works in a position that is not necessarily related to coding
    but provides the opportunity to learn about the nature and issues of the energy
    industry. In SCEP, a student works in an area directly related to their academic
    or career area of interest—in this case, coding.


    The DOE also offers the Mickey Leland Energy Fellowship at locations around the
    United States. Named after the late George Thomas “Mickey” Leland, antipoverty
    activist and congressman, this is a ten-week summer internship program specifically
    for women and minority college students whose academic major is in science, technology,
    engineering, or math. More information about these programs can be found on the
    DOE student internship web page (https://www.energy.gov/student-programs-and-internships).


    In addition to the federal government, many state departments of energy fund research
    facilities investigating research areas such as renewable energy. They offer internships
    that give students a chance to practice coding skills in the energy field by assisting
    in computer modeling, programming, or collecting and analyzing data. For example,
    the Alaska Center for Energy and Power employs interns to assist researchers in
    renewable energy with analyzing data related to energy use and consumption. To
    find internship opportunities in a particular state, one can contact the state''s
    department of energy or national laboratory, or visit its website.


    Private companies in the energy field also hire interns in programming and data
    science. Companies internships include renewable energy providers operating wind
    farms and solar panel arrays, oil and gas companies, mining companies, software
    companies that create software for the energy industry. An example of the types
    of work performed by an intern is provided by a six-month internship at Dominion
    Energy, a West Virginia utility, for a college student intending to major in computer
    science. The intern would work as part of a software team that builds, deploys,
    and maintains applications for internal customers.


    Internships not only allow students to develop coding skills related to the energy
    field, but also give them the opportunity to experience a job firsthand and decide
    whether coding and the energy industry are right for them. Undertaking multiple
    internships over the course of one’s education can help one decide which area
    of coding in the energy industry one prefers. In addition, internships allow students
    to develop relationships with professionals in the industry. These contacts can
    be valuable for referrals or references when later seeking a job. An internship
    also provides one with experience that can be included on a résumé when job hunting,
    and demonstrates to potential employers that one is capable of performing the
    tasks required of an entry-level analyst or programmer.


    # CHALLENGES AND ADVANTAGES


    Advantages of a coding job in the energy industry include the option of working
    for a large or small company. Large companies offer higher pay and many benefits.
    In addition, large companies often provide great job security. Sometimes they
    will pay for college courses taken in a field related to an employee’s job. This
    is an excellent way for a coder in an entry-level job to pursue advanced education
    while working.


    In a small or alternative energy company, one can often work in a more flexible
    and entrepreneurial environment, and have the opportunity to help build a business
    and improve the environment. As the worldwide demand for energy increases, and
    automation and data analytics play an ever-larger role in energy generation, distribution,
    and sales, the demand for coders is going to remain high. Pay in the field is
    good, and there is a steady career path from entry-level to mid-level to senior-level
    positions, with increasing pay and responsibility. The disadvantages of any coding
    career include having to work long hours when information is needed by a deadline.
    Coding projects in the energy industry are performed by teams, so one might have
    to deal with difficult coworkers and make compromises. Also, coders may have to
    travel to substations within a company’s distribution area, and in the case of
    multinational companies, travel may be substantial.


