  - '[PAGE 65]


    If your school offers a course in public speaking, taking it can help you hone
    your communications skills. Coders spend most of their time at a keyboard. You
    will be more efficient if you develop fast typing or keyboarding skills.


    # DEVELOPING YOUR CODING SKILLS


    One excellent way to prepare for a software development career is to gain experience
    while you are still in high school. In some schools it is possible to take courses
    in computers or join computer clubs in which students practice creating software
    programs. If your school offers such an option, take advantage of it. Trying out
    coding is the best way to see if a career as a programmer will interest you. Coding
    gives you firsthand knowledge of the types of problems you will encounter in the
    real world and how to solve them. You can practice creating apps yourself. Companies
    such as Apple and Microsoft offer development kits for those interested in making
    apps. You can share apps with friends, post about them on a social media site
    such as Twitter, or even offer them through a site that sells apps, such as Apple’s
    App Store or Google’s Play Store. Making your own app can be satisfying, but it
    also requires patience and hours of work. There are many ways to gain computing
    and programming skills, including courses, books, and CDs that offer training
    in specific languages such as Python.'
  - '[PAGE 66]


    Another way to gain knowledge is to join a professional organization. There are
    both computing industry organizations and energy industry organizations that can
    help in your development. Two of the largest computing industry organizations
    are the Association for Computing Machinery (ACM) and the Institute of Electrical
    and Electronics Engineers (IEEE). These organizations provide standards and information
    related to computing for the energy industry and others. Among the major energy
    industry organizations are the American Solar Energy Society (ASES), the Association
    of Energy Engineers (AEE), and the Society of Petroleum Engineers (SPE). All these
    organizations have student memberships and special resources for students.


    # EDUCATION FOR CODING


    Most programming jobs require a four-year college degree. In some cases, experienced
    programmers are hired without one, but the environment is competitive for those
    just starting out. For some junior positions, an associate’s degree in programming
    might be acceptable, especially if combined with on-the-job experience from part-time,
    summer, or internship jobs. Many colleges offer four-year bachelor’s degrees as
    well as master’s and PhD degrees in these fields. Technical institutes offer both
    four-year degree programs and two-year associate’s degree programs. It is also
    possible to'
  - '[PAGE 67]


    # WIND POWER

    DATA ANALYST


    A wind farm data analyst analyzes measured wind data and produces energy estimates
    for companies that manage wind farms. He or she analyzes the performance of existing
    wind farms and provides estimates of power generation for projects being developed.
    The analyst spends the bulk of his her time working on a computer, using wind
    assessment software and models. He or she also visits project sites and attends
    conferences. To obtain this type of job, the candidate must have at least a bachelor''s
    degree in computer science or a degree that combines computer science with engineering,
    meteorology, or mathematics. He or she must have learned to use the software required
    for the job, such as MATLAB, Microsoft Word, Microsoft Excel, and GIS, either
    in school, through separate courses, or on a previous'
  - '[PAGE 68]


    ![](img/74d9c9c5b42a544a28394e6474d14a83_68_0.png)


    In addition, the analyst must have developed the skills to work well with other
    team members and be creative in dealing with technical issues and solving problems.
    He or she must have developed strong communication skills for explaining the results
    of analyses and possible risks to senior management and nontechnical audiences.


    Learning to Be a Programmer [65]'
  - '[PAGE 69]


    study for a degree online. If you decide to pursue a degree online, you should
    check the US Department of Education database of accredited colleges. Accreditation
    of a college ensures that you can obtain a valid degree and that you can transfer
    credits to another school, if necessary.


    In college, students begin by taking general courses in computer science. Such
    courses might include Introduction to Computer Systems, programming courses in
    specific languages, and computational mathematics. In addition, students will
    take science courses in specific areas that interest them. For those interested
    in working in the energy industry, choices might include robotics, which covers
    the automating of machines; artificial intelligence and machine learning; data
    mining; and possibly cybersecurity. Students will most likely take mathematics
    courses such as advanced forms of calculus and algebra, statistics, and probability,
    which explain how to analyze the likelihood of various events occurring. Knowledge
    of engineering and physics principles are important if you are working with software
    for energy systems. So you will most likely take courses in physics and engineering,
    as well as experimental design.


    If you are interested in developing applications related to the business side
    of the energy industry, such as financial and risk analysis, taking some courses
    in finance and economics might be beneficial. For those interested in mining or
    the oil and gas industries, geology courses help, and for


    # [66] Coding Careers in the Energy Industry'
  - '[PAGE 70]


    students with an interest in alternative energy, ecology and meteorology courses
    can aid in understanding how the environment and energy systems interact. Students
    might also be required to take a course in ethical computing, which covers issues
    such as how to protect people''s privacy and maintain the confidentiality of data.


    In addition to technical courses, students will also take humanities and arts
    courses. Courses in areas such as psychology, the literature and history of other
    cultures, and foreign languages can be particularly helpful on the job. In the
    energy industry, you will work with people from diverse cultures and you might
    have to travel to other countries,


    ![](img/74d9c9c5b42a544a28394e6474d14a83_70_0.png)


    A data analyst shares information on-site with a colleague.'
  - '[PAGE 71]


    so understanding other people’s history and culture will be valuable. Because
    travel is common in energy jobs, learning a foreign language is desirable as well.


    # CONTINUING EDUCATION


    Getting a job is not the end of a coder''s education. New languages, applications,
    and devices are always being developed. Therefore, programmers in the energy industry
    have to keep learning new software development techniques, and familiarizing themselves
    with new hardware technologies. To do so, they might take courses or learn on
    their own through books, online tutorials, and participation in professional organizations.


    The energy industry is evolving and embracing exciting technological advances.
    Taking STEM courses and developing your skills while high school is the first
    step to prepare for further education and embark on a challenging and rewarding
    career as a programmer in the energy industry.'
