    ## SMARTER ENERGY USAGE


    Utilities are not the only companies within the energy industry in which coders
    are needed. Private businesses also employ coders to help big industrial companies
    improve energy usage. One such company is Verdigris Technologies, located in Mountain
    View, California. The company, founded in 2011, provides an artificial intelligence–based
    system to help clients manage their energy usage. The system is used to control
    energy consumption in large commercial buildings and business facilities.


    In this approach, smart sensors are attached to a company’s electrical circuits,
    providing the ability to track energy consumption. The sensors send the collected
    data to Verdigis via wireless computer technology. Information is processed at
    Verdigis, and the client company is able to check a dashboard on its computers
    24/7. Computer software allows Verdigis to monitor each individual appliance or
    machine. For example, the company has successfully identified preventable inefficiencies
    in energy usage for the San Francisco–based W Hotel.


    Another company, PowerScout, applies AI-based software to energy industry data
    to predict ways that energy costs can possibly be reduced. PowerScout suggests
    ways that consumers can make changes in their homes to improve their energy usage
    and reduce costs. The company helps clients form decisions regarding renewable
    energy purchases for their homes.


    These are merely two companies using software to address the energy needs of businesses
    and consumers. There is likely to be a growing number of companies using data
    mining and AI to provide energy-related analysis and advisory services in the
    future. These companies will require programmers to create both programs to collect
    and analyze data, and software to monitor and report on energy consumption and
    provide client recommendations.


    ## APPLICATIONS FOR AI IN THE ENERGY INDUSTRY


    The following are some applications for AI in the energy industry. Load forecasting
    is the prediction of how much energy is going to be needed in a given location.
    Predicting how much energy will be needed in the short term is key to making sure
    it is available to meet spikes in demand and avoid shortages. It also allows utilities
    to reduce the amount of fuel used to produce energy when it is likely that demand
    is going to be low. The more efficient use of fuel helps control the company''s
    costs. Since these costs are passed on to consumers in the form of higher charges,
    it also helps customers keep their energy costs down. In a process known as yield
    optimization, software is used to monitor devices such as windmills on wind farms
    and optimize the turbine on each windmill as it runs. This process allows them
    to generate more energy.


    Software is needed for predictive maintenance. This process uses patterns identified
    by AI to signal when maintenance is likely to be required on a component. Software
    is also needed to program drones that can be used to inspect


    ![](img/74d9c9c5b42a544a28394e6474d14a83_42_0.png)


    A robotic energy system inspection drone checks power distribution components
    at a power plant in China.


    components such as power lines. Deep learning algorithms created by programmers
    can be used to train drones to find defects and predict failures. In addition
    to being safer and less time-consuming, artificial intelligence-based inspections
    can help operations without manual inspections.


    ## ARTIFICIAL INTELLIGENCE FOR RENEWABLE ENERGY


    Renewable energy sources are those that regenerate naturally, such as wind or
    solar. A major challenge of renewable energy is that their production fluctuates
    with weather. Artificial intelligence-based computer programs can help predict
    how weather will affect them. This type of data, using detailed reports from weather
    stations and satellite data, allows companies to provide more accurate forecasts
    of how much energy will be generated from renewable sources such as wind farms.

