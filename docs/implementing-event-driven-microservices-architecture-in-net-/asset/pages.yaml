    The last resiliency act is that of persistent storage. For our example, we would
    add a volume to the docker compose file that specifies a location on disk (locally)
    to map when each broker is saving data. In some cases, persistence may not be
    as big of a deal. For instance, as part of the overall application, considerations
    may be made for data loss in the event of a regional outage. If the recovery point
    objective (RPO) is very low, such as minutes, more attention will be needed to
    ensure storage is fault-tolerant. If it is higher, as hours or days, it may not
    be necessary to use fault-tolerant storage.


    For scalability, using a docker compose file does not impact the ability to scale
    outside of adding more brokers manually to the file itself. Using technologies
