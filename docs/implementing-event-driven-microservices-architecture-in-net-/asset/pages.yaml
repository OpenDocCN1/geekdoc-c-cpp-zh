  md: '# Resiliency through cloud-native patterns


    following:


    +   - **Bulkhead isolation**: This pattern purposely restricts the number of resources
    available to a caller, as well as the number of requests that can be processed.

    - **Cache**: Using this policy will force the method executing to pull from the
    cache. If the value doesn''t exist, it will fetch the value from the data store
    and put it into the cache.

    - **Timeout**: This guarantees a maximum time to wait. For example, a timeout
    policy set with a limit of 5 seconds will fail if the operation takes longer than
    5 seconds.

    - **Fallback**: This provides a way to return an alternative value for a method
    when the method calls fails.

    - **Rate limit**: Sometimes seen as throttling, this limits the number of consecutive
    calls from a caller if the number reaches a certain threshold.

    - **PolicyWrap**: This is a lightweight wrapper that allows you to combine multiple
    policies into one and execute them as a part of a group.


    It''s possible to group multiple policy implementations together using the PolicyWrap
    object. For example, you could group retry and fallback policies together to help
    a method retry its execution and return a default message upon failure. The fallback
    policy is somewhat like the circuit breaker in that an alternative message or
    function can be used to communicate success or failure. They differ, however,
    in fallback policies could be executed many times and not halt traffic to a particular
    method call, whereas circuit breakers will halt traffic for a set period.


