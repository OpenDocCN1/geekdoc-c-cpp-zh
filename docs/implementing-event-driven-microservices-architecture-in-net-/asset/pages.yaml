  md: "# Localized Testing and Debugging of Microservices\n\n![](img/290aa6845834e57fd715912cc7e76d30_130_0.png)\n\
    \nFigure 6.8 - Visual Studio debug controls\n\nInside this file, we are going\
    \ to specify override settings for the docker-compose.yml file, which will take\
    \ precedence when orchestrating in debug mode.\n\n+   2. Add the following code\
    \ to instruct Visual Studio to target the mydebug images in each of our Dockerfiles:\n\
    \n```\nversion: '3.4'\nservices:\n  consumer:\n    build:\n      target: mydebug\n\
    \nproducer:\n    build:\n      target: mydebug\n```\n\nDebugging the docker-compose\
    \ project will now target the correct image definition in the Dockerfiles for\
