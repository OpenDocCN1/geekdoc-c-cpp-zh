    Using a standard layout for all your solutions ensures that locating specific
    projects, files, or references is easier, regardless of what solution you are
    in. The exception is that layout is the core library, which contains important
    shared objects and interfaces. The core library contains custom code, as well
    as references to external libraries, as MediatorR. MediatorR is an implementation
    of the mediator pattern, which is meant for event-driven architectures and domain-driven
    design. Let''s explore the core library components in a bit more detail.


    # Core library review


    The core library for the MTAEDA application consists of interfaces and concrete
    implementations that all domains can leverage. These fall into domain interfaces,
    infrastructure interfaces and classes, and utility classes. There are several
    domain interfaces, as illustrated in the following table:


    | Name | Description |

    | IDomainAggregateRoot | Allows aggregate objects to be identified (decorator
    only). |

    | IDomainEntity | Allows entities to be identified and requires an implementation
    of a string field for domain data. |

    | IDomainEvent | Implements INotification from the MediatR library. |

    | IDomainEventHandler | Allows domain events to be identified and requires an
    implementation of a string field for domain data. Implements INotificationHandler<T>
    from the MediatR library, where T is an INotification object.

    Allows event handlers to be identified and requires the Handle() method to be
    implemented. |

    | IDomainValueObject | Allows value objects to be identified within the domain
    (decorator only). |

    | IRepository<T> | The generic T type must be an IDomainEntity object.

    Allows a base set of methods to be enforced for any repository implementation.
    |'
