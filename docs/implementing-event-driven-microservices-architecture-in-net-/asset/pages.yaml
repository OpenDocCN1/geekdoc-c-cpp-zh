    # Standing up infrastructure using Kubernetes


    A popular deployment target within the world of cloud applications is Kubernetes.
    Kubernetes acts as an orchestration layer for multiple components and/or microservices,
    providing mechanisms for resiliency and scalability. While this is a popular means
    of running microservice workloads, it is not always easy to set up to facilitate
    the development lifecycle. Tools such as **minikube** offer a way to set up a
    lightweight Kubernetes cluster on your local machine, allowing you to test how
    deployment might work. If you are running Docker Desktop, either on Windows or
    on macOS, there is an option to enable Kubernetes Service to start when Docker
    starts. This can also give you a way to test out orchestration and deployments
    locally.'
