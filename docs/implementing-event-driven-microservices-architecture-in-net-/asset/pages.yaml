  md: 'Domain Model and Asynchronous Events


    With that, we''ve looked through the details of each domain, understanding how
    they operate as well as how they interact with each other''s events. As we have
    learned throughout this book, these events do not require immediate responses.
    Now, let''s look at asynchronous actions.


    # Using asynchronous actions


    There are plenty of uses for implementing synchronous actions within an application.
    At some point, those synchronous actions will not be able to scale out the load
    on the application increase. This is where asynchronous actions come in. These
    actions allow many executions to be made using different contexts, whereas synchronous
    actions will block other actions from executing until the invoked action is complete.
    This ability to execute without the need for a thread for response allows large-scale
    message sending without any concern of thread-blocking, which can lead to longer
    times and less desirable performance.


    The notion of asynchronous actions has been a paradigm in programming for many
    years. Using callback functions, which are meant to be executed when one method
    has completed and returned a value, has been a construct in JavaScript, as well
    as other languages. Patterns such as asynchronous JavaScript and XML (AJAX) were
    some of the building blocks of web applications using frameworks such as jQuery.
    Later on, constructs as promises also help to extend asynchronous method calls
    through inline function handlers, providing a more succinct way to define callbacks.


    In languages that utilize the .NET Framework, functions can be assigned to event
    handlers or delegates, which will execute when a method or process triggers them
    asynchronously. This is also a more structured pattern known as Asynchronous Programming
    (TAP), which leverages the Task and Task<T> objects in the system namespace to
    perform asynchronous operations. More information about TAP can be found in the
    Further reading section at the end of this chapter.


    Having covered the basics of asynchronous actions and how they can be used to
    bolster resiliency and throughput, let''s look at some of the additional benefits
    of using the asynchronous programming model.


    # Benefits of asynchronous programming


    Primarily, asynchronous programming allows you to execute a greater sum of code
    than synchronous programming. It also allows you to leverage compute resources
    differently by only using resources while a method is executing. This avoids unnecessarily
    assigning compute resources and should lead to more consistent response times
    overall. This allows you to execute more complex tasks and leverage concurrency
    without needing to worry about thread pool management.'
  merge: -1
  pgno: 92
- img_proc: true
  md: "Using asynchronous actions\n\nAsynchronous methods are more efficient in how\
    \ they utilize available resources. Longer-running operations can use the yield\
    \ construct in C# to continue executing while other operations can be invoked\
    \ as there still resources available to them. When coupled with concepts such\
    \ as parallel execution, asynchronous execution can facilitate further scaling\
    \ of the application while preserving its responsiveness.\n\n# Asynchronous parallel\
    \ processing\n\nIn .NET 6, a new construct was introduced as Parallel.ForEachAsync.\
    \ Those familiar with the notion of parallel execution will likely have some knowledge\
    \ of the Parallel.ForEach method. This new asynchronous method allows you to perform\
    \ parallel execution while enabling asynchronous execution.\n\nLet's take a look\
    \ at an example of implementing Parallel.ForEachAsync in a console app that has\
    \ multiple consumers pointed at different topics in Kafka. In this case, we will\
    \ be consuming three topics using the aforementioned method, allowing all of them\
    \ to run in parallel and consume events as they are available.\n\nWe will start\
    \ by using a top-level program to pull configuration information from an appsettings.json\
    \ file and create a consumer for each topic name listed in the configuration.\
    \ The appsettings.json file is parsed by making a call to the ConfigurationBuilder\
    \ to retrieve the information. The list of topics is stored as a pipe-delimited\
    \ string, and after splitting that string, an initial loop is executed to set\
    \ up each consumer and add it to a list of consumer objects. The code for setting\
    \ up each consumer is as follows:\n\n```\nvar consumer = new ConsumerBuilder<int,\
    \ string>{\n    new ConsumerConfig{\n        GroupId = config[\"ConsumerConfig:GroupId\"\
    ],\n        BootstrapServers = \n        config[\"ConsumerConfig:BootstrapServers\"\
    ],\n        AllowAutoCreateTopics = true,\n    }\n}).Build();\nconsumer.Subscribe(topic);\n\
    consumerList.Add(consumer);\n```\n\nWe'll also set up the body of the Parallel.ForEachAsync\
    \ loop to take in the list of consumers, an object specifying parallel options,\
    \ and a function that will run asynchronously, operating on the consumer as well\
    \ in passing CancellationToken to allow a consumer to be shut down, should a cancellation\
    \ request get in:"
  merge: -1
