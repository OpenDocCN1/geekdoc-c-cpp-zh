    # # Resiliency through cloud-native patterns


    Application resiliency can be measured by how durable and recovery prone a service
    or application is. There are different paradigms for analyzing and implementing
    resiliency in applications, including infrastructure and software design patterns.
    For the purposes of this chapter, we will be examining software patterns that
    leverage cloud-first architectural patterns to bolster resiliency.


    While we can review the architectural patterns using the Azure architecture center
    as well as various sources for software resiliency, we''re going to be looking
