    > Important note

    The links to all the white papers and other sources mentioned in the chapter are
    provided in the Further reading section towards the end of the chapter.


    # Application- versus service- versus component-level telemetry


    As covered in Chapter 7, Microservice Observability library by installing the
    Application Insights as a dependency and configuring it to an existing Application
    Insights instance in Azure. This covers us at the code level for any immediate
    metrics, logging, or tracing that Application Insights can provide out of the
    box. While this is useful, we may need to break down further and capture some
    specific baselines at various levels.


    For our sample application, we would expect to capture telemetry at three different
    levels:


    +   Application – Telemetry at the application level would include the overall
    health of the application, as well as any critical failures and the ability to
    troubleshoot distributed services. This may also include infrastructure- or cloud-platform-related
    status indicators.


    +   Service – Telemetry at the service level would include measurements related
    to performance, faults, exceptions, or domain-specific telemetry where appropriate.


    +   Component – Telemetry at the component level would be captured by the integration
    with Application Insights at the source code level or through custom code using
    the Application Insights SDK.


    Another area in which things can be complicated is that of Azure Monitor and specifically
    Container Insights. Container Insights does offer a great deal of information
    at the cluster, namespace, deployment, and pod levels. It also collects a lot
    of information and can cause ingestion and data storage costs to increase considerably
    if proper retention periods are not set. When creating a new Kubernetes cluster
    in Azure, you can specify whether you wish to install Container Insights or leave
    it turned off.'
