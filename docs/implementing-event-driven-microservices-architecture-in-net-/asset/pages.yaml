    # Fixing the Debug custom image


    When progressing from single container debugging to orchestrator debugging, we
    lost a very important feature from our previous section, Debugging individual
    microservices. The containers defined in the docker-compose file are no longer
    applying the custom debug build commands we added to the Dockerfile image definitions
    that we named mydebug.


    We modified the `csproj` file and added a setting called

    `DockerfileFastModeStage` to specify the name of the image that should be built
    and only when running in debug mode. Unfortunately, this is not honored by Visual
    Studio when using `docker-‑d-compose` to orchestrate multiple containers.


    Fortuntely, the fix is straightforward


    +   1. In the Visual Studio docker-‑d-compose project, add a new file named docker-‑dcompose.vs.debug.yml.
    There may be an existing file named very similarly to this, but please ensure
    you have a new file with this specific filename:'
