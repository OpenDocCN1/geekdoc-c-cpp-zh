  md: '# Message Brokers


    AMQP is meant to provide a translatable protocol between various brokers and components
    that implement the pattern. The intent is to avoid or eliminate vendor lock-in
    with broker technologies or with broker-specific protocols.


    # MQTT


    MQ Telemetry Transport (MQTT) is a newer protocol that is tailored towards Internet
    of Things (IoT) devices, specifically where message payloads needs to be small
    and network connectivity could be severely limited or even non-existent at times.
    It also facilitates the use of TCP/IP not only as a delivery channel, but for
    sensor networks, Bluetooth, and more. Commercial and residential use cases can
    be addressed using MQTT. For example, many home automation hubs use an broker
    on a central device, with the ability to communicate with the aforementioned channels
    or build workflows with visual tools such as Node-RED. This protocol could be
    considered for messages that are going to and from the turnstile and camera units,
    as per our example scenario.


    Many other protocols can be used to send messages aside AMQP or MQTT. Standard
    HTTP, WebSockets, and TCP socket connections can also act as conduits for transmitting
    messages from one place to another. Regardless of the method that’s to send the
    message, the content is ultimately what matters. Let’s take a moment to look at
    how a message’s content can be defined, as well as some pros and cons to approach
    each.


    # Standard and custom schemas


    Using a pre-existing schema to define the structure of your messages can bring
    benefits and drawbacks, depending on the approach that’s chosen. In some cases,
    having a format that is standardized and can be consumed by many different systems
    is possible. In others, an internally defined schema to define messages may be
    easier to manage, especially if the messages are not to be consumed outside the
    application itself. Understanding the needs of your application, as well as the
    expected interaction patterns of applications that may be dependent on yours,
    will ultimately drive your decision. Let’s take a moment and evaluate each option.


    # Using (open) schema standards


    As we mentioned in Chapter 1, The Sample Application, we chose to use the CloudEvents
    open schema standard. The reasoning behind this choice was to enable events to
    be consumed natively within logging systems that support the schema, such as Azure
    Monitor, and to define a single pattern for message and event layouts that allows
    for easier developer consumption.'
