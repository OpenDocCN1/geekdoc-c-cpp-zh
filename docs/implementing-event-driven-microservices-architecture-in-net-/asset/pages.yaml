  md: '# Exploring implementation details in code


    For every cloud service you plan to use, you should have a contingency plan for
    that cloud service not being available. This can lead to a deeper discussion around
    business continuity and disaster recovery scenarios, which are beyond the scope
    of this book. Conceptually, however, it''s generally a good practice to have a
    plan to handle cloud services, whether through geographically distributed components
    or local operations on machines or equipment that can be persisted locally until
    the services come online.


    Often, accounting for these characteristics is a daunting task for application
    developers, as many are used to working in an environment where the underlying
    infrastructure is relatively static and stable. Along with the ramp-up time needed
    to account for these operational concerns, the adoption curve for truly leveraging
    the producer-consumer pattern can be steep for some.


    # Understanding the adoption curve


    As we seen in the previous sections, having a solid understanding of the why behind
    using the producer-consumer pattern is just as important as the how, when, and
    where. From the developer experience perspective, moving toward this communication
    pattern can bring a host of challenges. Not everyone will learn and adapt to all
    patterns at the same rate. The curve can be greater if the application already
    exists and refactoring or rearchitecting it to adopt this pattern is introduced
    into the development life.


    Tackling the learning curve starts with a conceptual understanding of the pattern
    itself. This can be conveyed through the examples listed earlier in this chapter,
    or through instructor-led sessions that are specifically tailored for application
    developers. There is plenty of additional online content via free sites, such
    as Microsoft Learn, which is intended to guide you through understanding concepts
    and design patterns that are meant for cloud-native development. Remember, this
    can be fundamentally different from the development practices you or your team
    are used to, and ensuring enough time is taken to absorb, experiment, and learn
    this will help to solidify your ability to develop event-driven applications.
    Experimenting or hands-learning is often beneficial. In the next section, we will
    talk through a high-level example of how to write a producer, a consumer, and
    an event handler, and run those services to demonstrate how producer-consumer
    communication occurs.


