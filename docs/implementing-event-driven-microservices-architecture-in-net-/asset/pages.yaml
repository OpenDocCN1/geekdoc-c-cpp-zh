    in the large adoption of microservice development. That brought about challenges
    of making services discoverable, well-defined, and published. We explored how
    we can document our API services with a common standard, utilize service discovery
    for fast-moving service instances, and service publishing to share our services
    with others. Finally, we looked at the security challenges supporting a large,
    fast-paced ecosystem and tooling that is growing to tackle this challenge head-on.


