- img_proc: true
  md: '# Debugging individual microservices


    While Visual Studio did a fantastic job setting up the Dockerfile for release
    builds, it does not use this entire definition when debugging code in a container.


    The additional configurations added to the project enable exactly the kind of
    fast and dynamic environment we need. Under the project launch profiles, you should
    see a new one added by Visual Studio called Docker.


    Before we look to understand how Visual Studio manages to debug in containers,
    we first want to confirm the debug source. Select this new launch profile and
    press the Debug button (or hit F5)


    ![](img/290aa6845834e57fd715912cc7e76d30_122_0.png)


    In the container window, you will see a running container named consumer based
    on the consumer:dev image. If you explore further, as expected, you will see noticeable
    differences between the running image and the Dockerfile definition.


    Visual Studio has created a different image with a series of mapped volumes (including
    one to the local solution folder) and configured and attached a remote debugger.


    You can stop the debugging session at any point and the container will continue
    to run, even though the application process has stopped. You can add breakpoints
    and relaunch the debugging session as you would in any local debug session, knowing
    that the processes are instead running within a container.


    We want to control the development environment dependencies as code via Dockerfile,
    but we also discovered that Visual Studio does not use Dockerfile when launching
    the debugger. So, how do we customize that environment?


    Visual Studio offers flexibility to do this. If we want to add a customization
    that affects both the final image and the debugging environment, we add commands
    for the base section of Dockerfile:


    ```

    FROM mcr.microsoft.com/dotnet/aspnet:7.0 AS base

    WORKDIR /app

    EXPOSE 443

    # <add commands here to modify both the debug and release\container image>

    RUN dotnet tool install --global dotnet-ef

    ```'
  merge: -1
  pgno: 122
- img_proc: true
  md: "When we run a debug session, Visual Studio will make sure the custom container\
    \ includes everything from the base image definition.\n\nIf we want to add commands\
    \ that only apply to the debugging image, but not the final release, we need to\
    \ add another image - created from:\n\n```\nFROM mcr.microsoft.com/dotnet/aspnet:7.0\
    \ AS base\nWORKDIR /app\nEXPOSE 80\nEXPOSE 443\n# <adds commands here to modify\
    \ both the debug and release\ncontainer image>\nRUN echo \"This is my base image\"\
    \ > /tmp/image_type\n```\n\n```\nFROM base mydebug\nRUN echo \"This is my debug\
    \ image\" > /tmp/image_type\n```\n\n```\n<section omitted for brevity>\nFROM base\
    \ final\nWORKDIR /app\nCOPY --from=publish /app/publish .\nENTRYPOINT [\"dotnet\"\
    , \"consumer.dll\"]\n```\n\nYou can see that the final image is based on the base\
    \ image, so it will not include any of the commands added, to the mydebug image.\
    \ In the example commands, we expect our base image (or any image deriving from\
    \ it) to have a file /tmp/image_type with the content. This is my base image.\
    \ When running our debug container, we expect Visual Studio to have targeted the\
    \ mydebug image, which should instead have the content. This is my debug image,\
    \ in the /tmp/image_type file.\n\nThe final thing we must do is tell Visual Studio\
    \ the name of this new image to use in place when debugging. To do this, add the\
    \ following section to the .csproj file:\n\n```\n<PropertyGroup>\n  <!-- other\
    \ property settings -->\n  <DockerfileFastModeStage>mydebug\n</DockerfileFastModeStage>\n\
    </PropertyGroup>\n```"
  merge: -1
