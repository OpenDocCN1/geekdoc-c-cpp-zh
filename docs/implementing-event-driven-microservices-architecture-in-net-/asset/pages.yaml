- img_proc: true
  md: '# 10

    Modern Design Patterns for Scalability


    In years past, determining how to handle the scalability of your application depended
    primarily on capacity planning and static resources hosted in a data center. With
    the rise in popularity of the cloud, more flexible options exist for managing
    the scalability of your application. That''s not to say that capacity planning
    is not needed – it is still an important part of system architecture design.


    How you implement scalability options tends to be different in the cloud, though.
    Where static resources once were the mainstay, you can now leverage automated
    scaling options, depending on how you are hosting your application. Cloud services
    such as **Kubernetes**, app services, and managed storage can be individually
    tuned to provide minimal resource usage when not under heavy load and maximized
    resource usage when it''s needed most.


    This chapter will focus on the key metrics to monitor for potential performance
    issues, and what settings can be fine-tuned to allow for an automatic response
    to a degradation in performance.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'We''ll cover the following topics in this chapter:


    +   * Mechanisms for autoscaling

    * Implementing autoscaling for Kubernetes services

    * Implementing autoscaling for Azure App Service


    By the end of this chapter, you will understand the different types of autoscaling
    based on metrics like CPU load, **input/output (I/O)** load, request load, and
    memory-intensive operations. You will also know how to implement auto-scaling
    features for services deployed to Kubernetes and how to implement auto-scaling
    features for services deployed to Azure Web Apps or Azure API Apps.


    > **Important note**

    The links to all the white papers and other sources mentioned in this chapter
    can be found in the *Further reading* section toward the end of this chapter.


    # Mechanisms for autoscaling


    There are four primary indicators to watch during the operation of an application
    that can identify potential issues with maintaining uptime or responsiveness SLAs.
    These include CPU load, I/O load (often seen as disk pressure in Kubernetes),
    request and network load (often seen as network pressure, and memory load). Understanding
    these indicators is essential in helping to prepare you to adjust configuration
    settings, thus leading to scalable supporting infrastructure. Understanding how
    your application components affect each of these indicators is important as well.


    # Compute and CPU load


    The amount of CPU that''s utilized will vary heavily across physical machines,
    virtual machines, and hosted cloud services. With cloud services, even greater
    amounts of fine-grained adjustments can be made. For example, with **Azure App
    Service**, the amount of compute initially available to an App Service is tied
    to the App Service Plan that hosts the service. Thresholds can be set to look
    for sustained CPU activity that lasts longer than 5 to 2- minutes, anomalies in
    CPU usage (spikes), or even a point-in-time benchmark, such as a set percentage.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'Similar rules apply in the Kubernetes world – with a twist. Kubernetes allows
    you to not only set monitors on the nodes within the cluster (known as hosts in
    the Kubernetes ecosystem) also on any running pod within that cluster. What’s
    more, you are not restricted by the sum of processing power within your cluster
    – it can be overallocated, which can lead to a variety of different problems.


    We''ll look at the disk and I/O load next, which can bring your application to
    a grinding halt, quite literally in some cases.


    # Disk and I/O load


    Managing expectations around the usage of disk storage, whether through directly
    attached storage, flash storage, or managed storage offered by cloud service providers,
    is generally something that should not be overlooked. If you know that your application
    requires a high rate of disk reads or writes, you will want to spend some time
    planning how best to implement these requirements. A new feature in .NET 6 is
    the rewrite of the FileStream object, leading to improved performance and a possible
    reduction in potential I/O contention issues.


    In cases, applications may use a log file to write out information about the application’s
    execution or any errors it may have encountered. In others, there may be more
    of a reason to use disk storage to perform data manipulation or read and write
    a high volume of transactions. In financial services applications, using storage
    to read, sort, and write values is intentionally done to avoid running into bottlenecks
    with CPU or memory. If the storage being used does not meet the I/O requirements
    for the application, disk contention can occur, and could lead to more serious
    impacts on the application. Normally, disk configuration is not something that
    is set up to upscale from an I/O perspective, but it can help you to adjust other
    resources that may help compensate.


    The next indicator we’ll cover is that of network load, where requests and responses
    potentially get jammed up if there isn’t enough room for all of them to flow through
    the network.


    # Request and network load


    Another finely scoped resource is that of network bandwidth, specifically because
    there is only so much throughput a virtual or physical network can handle. Normally,
    networking considerations are considered when designing a regional footprint with
    a cloud provider, where throughput limitations can be examined, and the appropriately
    sized network pipe can be installed to allow traffic to flow as expected.'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Since tweaking network settings is not something that most developers would
    want to do, or be expected to, the main way in which network load can be monitored
    (and reacted to) is through requests per second. If one of your application''s
    components expects to receive a high volume of requests, but also needs a fair
    amount of compute and/or memory resources to process each request, system performance
    will slow to a crawl as the component processes each request. Adjusting the network
    is not an option but setting components to autoscale in anticipation of this,
    or even throttling requests to specific components, can help limit the amount
    of degradation a user might experience using your application.


    We now round out this list by diving into memory-intensive operations, which can
    impact a component within an application, an entire application, or even an entire
    hosted service.


    # Memory-intensive operations


    Managing the performance of memory during your application''s lifespan can be
    a daunting task, especially if resources are limited. Some programming languages
    put demands on memory that cause it to become depleted fast. Java, for example,
    requires that at least two gigabytes (GB) of RAM are available to a running instance
    of the Java Virtual Machine (JVM) executing your code. If you are deploying this
    into a Kubernetes environment, this can add up quickly and potentially starve
    other services of RAM.


    Understanding how your application uses memory during its execution can greatly
    assist you in not only optimizing the starting settings for your application but
    also how scaling can be implemented to help relieve memory pressure. Setting autoscale
    events to trigger when memory usage starts climbing for components that leverage
    a large amount of RAM can help spread operations to handle memory pressure and
    still give the user a desirable experience.


    Now that we have looked into the main indicators that can lead to performance
    issues, let''s talk about how to implement patterns to adjust to and even anticipate
    greater needs, starting with applications hosted in Kubernetes.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Implementing autoscaling for Kubernetes services


    Kubernetes itself is quite a powerful orchestration platform that allows you to
    control how few or many system resources a given bit of executable code can access
    to. Since the implementation of Kubernetes can be done on-premises, in the cloud
    on virtual machines, or through a managed service, there are several options for
    autoscaling configuration. These can range from patterns in Kubernetes itself
    to certain features of cloud-managed services to third-party plugins that are
    purpose-built for specific scenarios.


    # Native Kubernetes options


    As an orchestrator, Kubernetes offers a rich ecosystem that allows you to use
    as little as much of the cluster''s compute power as needed, in a variety of ways.
    Some features allow you to control how applications scale out, depending on some
    of the primary indicators we covered in the previous section. In this section,
    we will start with a couple of native options that can be used in your cluster,
    wherever it resides.


    # Horizontal Pod Autoscalers


    **Horizontal Pod Autoscalers (HPAs)** are constructs within Kubernetes that allow
    you to specify a target condition or threshold that a workload hit before the
    cluster will scale out and create a new pod or set of pods. The common parameters
    of minimum and maximum nodes are applicable here, giving you the ability to set
    up some guards around how much scaling occurs. The other parameter is the condition
    the deployment itself is experiencing – whether triggering the autoscaling is
    CPU or memory bound.


    While CPU and memory are the two out-of-the-box means for autoscaling, there are
    other ways you can add metrics to control autoscaling. Table 10.1 lists other
    common targets that can be used in tandem to determine how and when autoscaling
    should kick in:'
  merge: -1
