  md: '# Event structure and schema


    To help simplify and streamline event constructs, we have selected the CloudEvents
    open specification as the baseline for all events being transmitted. This allows
    you to capture relevant metadata about the operation while still sending over
    the event itself. Additionally, using the CloudEvents schema enables you to potentially
    leverage platform tooling as Azure Log Analytics and Azure Monitor. Of course,
    if your cloud target is different, there may be other ways the event schema could
    be useful. However, in this book, we will focus on the Azure cloud platform.


    The schema for a CloudEvents schema is rather simple. There are fields for Data,
    Subject, Type, Source, Time, and DataContentType. They do not all require values;
    however, we will be using them to better define the intent and content of each
    event we raise. It is entirely possible not to use this construct and still use
    the domains and data services. The primary reason this design decision was made
    to ensure consistency in the message format, with a capacity to understand metadata
    associated with the event itself. Table 1.1 illustrates the CloudEvent fields
    and how they will be used to contain pertinent information when an event is raised:


    | CloudEvent property | Description | Mapping |

    | --- | --- | --- |

    | Data | The content of the event being raised | Domain event; might contain information
    relevant to an aggregate or entity |

    | DataContentType | The type of data being stored in the Data field | |

    | Source | The source of the event | The domain method being invoked to raise
    the event |

    | Subject | A friendly description of the intent of the event | Phrasing relative
    to the event''s reason for being raised (Turnstile is locked) |

    | Time | The time the event was raised | A timestamp correlating to when the event
    was raised |

    | Type | The type of event being raised | DomainEvent, EventHandler, DomainCommand,
    DomainException |


    Table 1.2 - The CloudEvent schema and field mappings'
  merge: -1
