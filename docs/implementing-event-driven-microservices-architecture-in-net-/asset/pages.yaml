  md: '# 24 The Producer-Consumer Pattern


    Each of these examples helps you to illustrate how interactions between producers
    and consumers can be found in everyday life. Next, we will examine how this pattern
    enables event-driven architectures to be successful.


    # Enabling event-driven architectures


    As a reminder, many event-driven systems are designed with the understanding that
    large volumes of messages will be produced and consumed at any given point. How
    the messages are produced and consumed needs to be highly scalable, resilient,
    and fault-tolerant. Otherwise, the structural integrity of the application is
    invalidated since there is no guarantee that any messages produced will be consumed
    by the components that are waiting for them.


    Scalability can be addressed by a variety of different mechanisms. Certain services
    allow for an autoscaling feature to be leveraged, creating additional copies of
    the service to handle an increase in requests or usage. This is important because
    it ensures performance regardless of the user pattern of the service—within reason.
    If the upper limit of the autoscaling function is hit and the flow of messages
    is relatively high, there could be performance implications if additional measures
    are not put in place. With the producer-consumer pattern, there is no explicit
    expectation of a response to any message produced. As mentioned earlier, the consistency
    of the system does not have to be immediate, which allows the consumers of those
    messages to process them as per their requirement, as they are processed.


    System resiliency can be increased with the help of scalability, but other controls
    need to be in place to ensure the system is truly resilient. Software design patterns
    that are purpose-built to handle cloud architectures, as those on the Azure Architecture
    Center website, can lend additional safeguards to the system. For example, the
    circuit-breaker pattern can be implemented in code to safeguard against large
    surges of events coming in. When the breaker is "tripped" or left in an open state,
    allowing for a scaled throttling of subsequent events. Another pattern that is
    very commonly used is the retry pattern, where a specific operation can be retried
    a number of times, and at intervals, as desired. Often, technologies that support
    producer-consumer patterns have built-in retry logic. Kafka is one such technology.


    Fault tolerance is the ability of a system to continue operating in the event
    of a critical fault or failure. As mentioned earlier, software patterns can also
    help the system to guard against faults. There will be certain faults that are
    transient and wide in scope that you might not immediately anticipate. When developing
    for the cloud, there is a notion that outages can, and will, occur. Regional services,
    entire data center regions, or global services can experience outages that last
    from seconds to days.'
