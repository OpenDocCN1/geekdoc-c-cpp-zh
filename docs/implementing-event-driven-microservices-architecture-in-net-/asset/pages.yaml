  md: 'When we move to event-driven architecture, we introduce a few new challenges
    to this correlation pattern.


    While that solves the cross-service trace challenge, we should remember that an
    event could have any number of subscribers, and will all persist with the same
    correlation identifier. This means that when we query by identifier, the resulting
    logs could be a large ball of mud, lacking enough granular threads to be efficiently
    interrogated.


    To address the ball of mud, we can introduce causation identifiers. A causation
    identifier is the unique identifier of the preceding event that caused a method
    to fire. It simply chains the preceding event with the current event, so we know
    what caused it.


    Application Insights supports this pattern, which is known as distributed tracing.
    It uses slightly different names for the identifiers:


    +   * Instead of Log Item Id, we use Log Id.

    * Instead of Correlation Id, we use operation_Id.

    * Instead of Causation Id, we use operation_ParentId.


    The following is example of these identifiers in action. Multiple consumers have
    been added to illustrate how the correlation/causation pattern works:


    | Service | Action | Log Item Id (Id) | Correlation Id (operation_Id) | Causation
    Id (operation_ParentId) |

    |---|---|---|---||

    | Producer | POST/SEND | 1a | 1a | null |

    | Kafka | Message stored | 2b | 1a | 1a |

    | Consumer 1 | Message consumed | 3c | 1a | 2b |

    | Consumer 2 | Message consumed | 4d | 1a | 2b |


    Table 7.1 – Example of the correlation and causation identifier pattern


