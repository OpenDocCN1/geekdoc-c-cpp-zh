  md: '# Service publishing 275


    Our use of service discovery is only part of Consul has to offer. As a service
    mesh, Consul can facilitate communication between services by acting as a secure,
    policy-managed proxy transport. When configured, Consul DNS will return the appropriate
    address for its nearest client proxy and handle the routing and load balancing
    internally.


    We have understood how to ensure our service instances are discoverable and available.
    And our autogenerated documentation is up to standard. Next, we need to publish
    our service so that others can find it.


    # Service publishing


    Now that we have an API, an easy-to-navigate specification for it, and a service
    discovery layer that manages the distribution of requests to healthy service instances,
    developers need to know where to look for our service. This is Service Publishing
    comes into play.


    You can think of service publishing as a directory to search for, or simply browse,
    services that want to be discovered. If you are old enough to know what the pages
    use, that is a close analogy. Only, imagine that this directory not only helps
    you look up services, but manages security, advanced monitoring, and can add a
    façade that allows API requests and responses to be translated on the fly. A façade
    could even call multiple APIs on the backend with a single composite API endpoint
    to the frontend. Many even support the mocking of APIs, so you can take your design-first
    approach, build an OpenAPI specification, then have one team implement a simple
    mock service while others implement the actual code base!


    There are many tools and services out there that facilitate Service Publishing.
    You can search the web for API indices. If you are willing to spend some dollars,
    you can get access to some information sources out via published APIs.


    The NASA public APIs are nice to play around with (https://api.nasa.gov/), although
    they do not currently expose an OpenAPI specification. No doubt this is in use
    somewhere behind the scenes. The main point is that you have to go, for a given
    organization, area of interest, or community group, where you can easily look
    for API services to consume.


    # Azure API Management


    Azure API Management (or Azure APIM, as it is more commonly abbreviated) provides
    a vast amount of functionality to support any organization’s API ecosystem. Specifically,
    we will focus on the use of API Service Publishing.'
