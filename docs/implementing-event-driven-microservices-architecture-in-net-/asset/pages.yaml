    # Aggregate storage


    In the domain context, we have already identified several different possible aggregates
    that would need to be tracked. A common method for tracking changes to an aggregate
    when using a platform such as Kafka would be to have a topic for each aggregate.
    Events related to each aggregate can be handled by specific event handlers. Those
    handlers can then update the data stores as needed. Figure 2.2 illustrates an
    example of aggregate-based topics in Kafka:


    ![](img/290aa6845834e57fd715912cc7e76d30_56_0.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_1.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_2.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_3.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_4.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_5.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_6.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_7.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_8.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_9.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_10.png)


    ![](img/290aa6845834e57fd715912cc7e76d30_56_11.png)


    Figure 2.2 – An example layout by aggregate root


    This is not to say that other events in non-aggregate topics could not impact
    data in stores; having a separate aggregate allows for a centralized way to process
    events related to multiple parts of an aggregate while still allowing for other
    types to occur organically.


    Let''s look at an example using one of the domains in the example application.
    One of the aggregates within the equipment domain is the turnstile. The aggregate
    contains a few pieces of information but does not contain items such as maintenance
    records, since those records are part of the maintenance domain. However, it does
    contain a status field. In the event of the turnstile becoming locked, an event
    handler would need to update the backing data store with the new status and then
    produce an event requesting that a new maintenance record be created for the turnstile.
    Once the maintenance record has been created, the turnstile''s status can be updated
    to reflect that the maintenance staff has been alerted. Once maintenance is complete,'
