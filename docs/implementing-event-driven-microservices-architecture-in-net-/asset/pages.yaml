  md: 'By the end of this chapter, you will be able to do the following:


    +   - Explain the isolation of functionality enables further development, testing,
    and deployment.

    - Set up your local development environment to allow for building Docker images
    and running Docker containers.

    - Create a Dockerfile, identify the use of sequential execution versus multi-stage
    execution, and build applications during the image creation process.


    # Technical requirements


    You will find all the code examples for this chapter in the folder for this chapter
    on GitHub here: https://github.com/PacktPublishing/Implementing-Event-driven-Microservices-Architecture-in-.NET7/tree/main/src.


    > Important note links to all the white papers and other sources mentioned in
    the chapter are provided in the Further reading section towards the end of the
    chapter.


    # Reviewing containerization fundamentals


    While it is assumed that you have some experience with Docker already, it''s worth
    the time to quickly review some of the fundamentals of working with containers
    and some of the inherent benefits of using them. We will first cover the fundamentals
    of isolation, portability, reusability, layering, and abstraction.


    Regarding isolation, Docker allows focusing on one process within the confines
    of a container. In the world of Docker, containers are immutable and are created
    from images that can be utilized directly from the Docker registry or from a private
    registry for images that are custom built for specific needs. This notion of immutability
    allows for isolation to be confined to the process that the container needs and
    not to any outside influences or mutations. Not to say that outside influences
    cannot modify things within a Docker container. The immutability comes when a
    container is restarted, and whatever information was modified during that attachment
    or connection is deleted.


    The portability aspect of containers allows consistent execution across many different
    environments. For example, running a container on your local development machine
    versus running a container in a Docker instance or a cluster will all yield the
    same result. Some nuances at the operating system layer will drive certain decisions,
    such as programs'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Reviewing containerization fundamentals


    that are inherently dependent on an operating system. One example of a Windows-based
    dependency might be a dependency on Win32 DLLs for a specific program. For language-based
    services and executables, if the language is truly crossplatform (.NET, Python,
    Java, and so on), it will not matter what operating system the container is running
    on.


    The notion of reusability appears to intertwine with a bit of layering. The idea
    is that one image can span N of containers based on certain factors, such as the
    orchestration engine being used, resources within that orchestration engine, and
    overall system need. Therefore, one image is all that''s required in order to
    spin up multiple containers running the same executable or service. Furthermore,
    when images are built, there is no notion of reusability with how Docker will
    update the image. Docker uses a file system based layers identified by checksums,
    reducing the need to create unique file system restore points based on common
    operations. When viewed in sequence, the file system appears to have different
    layers.


    As an example, one of the ways in which Docker optimizes the system is for base
    images, using a basing system of Ubuntu, for example, all of the bare minimum
    requirements to ensure that the container will are already installed and captured
    as checksums. When you go to build a new image based on one of the preexisting
    image, those checksums will come over as part of that base image, eliminating
    the need for you to install base requirements for operation. Now, you will need
    to install any specifics for your application based on language or other features.
    Each line that added to the configuration will create a new checksum and, subsequently,
    a new file system checkpoint.


    Abstraction is another area that can fundamentally change how you write software
    components. Using containers, you can abstract a good amount of technical complexity
    from the primary concern of running the service or program you wish to run. This
    includes worrying about the underlying operating system, other items installed
    on the same host, and in fact, it''s considered best practice to limit the scope
    of the identity running the container to safeguard against potential attacks using
    elevated permissions. In many cases, Docker images will default to the root account
    for execution, which provides far too much control. Creating a service principal
    or user to use when executing the container helps safeguard against such attacks.


    These topics in and of themselves can be massive and are far beyond the scope
    of this book. However, understanding how these fundamentals can benefit you as
    a developer and enable you to focus more on the pieces you absolutely need and
    less on other ancillary operational bits you may not.'
  merge: -1
