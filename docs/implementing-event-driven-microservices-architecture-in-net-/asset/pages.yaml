- img_proc: true
  md: '# The Saga pattern


    Decoupled business transactions can be reformed into a flow, known as a Saga,
    such that they can eliminate the failure/retry pattern when dependent on eventually
    consistent data converging. They do this by changing the dependency order of transactions
    and events to trigger the next transactions when consistency is achieved. In effect,
    this is rebuilding a monolithic process, but by using events as the loose coupling,
    we avoid introducing hard dependencies or performance bottlenecks.


    The example of adding and using a new payment method is an example that can benefit
    from this pattern. A new payment method can be issued with a request increase
    the transit car balance. At this point, the top-up process can issue an event
    requesting the payment method be added to the customers'' top-up request in a
    pending state. The payment process service should (at its own time and pace) react
    to this, validate, and add the new payment method. It will issue an event to the
    customers'' payment method has been updated. The top-up process should (at its
    time and pace) react to the event that the customers'' payment method has been
    updated and look for any pending top-up activity that relies on that method.


    While this may sound a little cumbersome, it is important to notice how this decouples
    the process and allows a few set-and-forget processes that are coordinated through
    events rather than a single blocking process. Through chaining the transactions
    in this order (as a Saga), we see less polling and more event-driven activities.
    From this, we get eventual consistency and higher scalability.


    # Command query responsibility segregation (CQRS)


    Eventual consistency demands quite different behaviors between transactions that
    modify the state and those that query. The modifying state is authoritative and
    often results in a subsequent event confirming the modification and the next steps
    in a flow to be triggered. The querying state must account for the fact that responses
    may be inconsistent and divergent from preceding modifications. This has driven
    the development of the command query responsibility segregation (CQRS) pattern
    in systems. It means that code should be written in such a way that commands (modifications,
    also referred to as mutations) are segregated from queries (reads). This avoids
    writing code that may go from one state to another with the natural expectation
    that external transactions are ACID in nature.


    Having compared immediate and eventual consistency, your focus will likely be
    on embracing eventual consistency, Saga patterns, and CQRS. It is important to
    note that a well-functioning solution will use both ACID and BASE paradigms. We
    must focus on understanding the interplay between both paradigms in any given
    business transaction. Typically, you will see ACID transactions within a component
    and BASE transactions across components.'
