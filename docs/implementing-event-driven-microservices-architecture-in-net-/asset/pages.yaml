  md: "# Generating service information\n\n+   1. The autogeneration of the specification\
    \ in JSON format.\n\n+   2. The presentation service will provide a UI to navigate\
    \ the specification.\n\nThe initial step for both configurations is to add a reference\
    \ from the Swashbuckle library to the producer project. In the folder containing\
    \ the producer.csproj file, run the following command:\n\n```\ndotnet add package\
    \ Swashbuckle.AspNetCore --version 6.5.0\n```\n\nTo have the API signatures detected\
    \ for automatic documentation generation, we cannot use the inline API definitions\
    \ as they currently exist in Program.cs. Instead, we must create API controller\
    \ files and decorate them with attributes that make them discoverable to Swashbuckle.\n\
    \n# Converting API methods from inline into controllers\n\nWe create a new file\
    \ ProducerController.cs and, within that, a method called Send():\n\n```\n[Route(\"\
    controller\")]\n[ApiController]\n[ProducesResponseType(typeof(ProblemDetails),\
