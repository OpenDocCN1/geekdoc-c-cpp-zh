    # Inspecting messaging protocols, schemas, and delivery patterns


    Just as there are different types of message brokers, there are also different
    types of communication protocols that can be used, various schemes to define messages,
    and different types of message delivery. Choosing the option that best fits your
    application''s needs is not always an easy task as more than one option may be
    applicable. As we examine the options in each category, we''ll reflect on the
    choices that were made for the MTAEDA application and whether another option would
    be better suited.


    # Messaging protocols


    Protocols related to programmatic communication are not necessarily exclusive
    to sequentially processed code or traditional client-server web applications.
    Different communication patterns can be leveraged across many types of software
    components. In the case of components that rely on messaging in some way, there
    are a few protocols that make more sense than others. Let''s review these protocols
    in more detail.


    # AMQP


    Advanced Message Queue Protocol (AMQP) is an open standard that was originally
    developed by John O’Hara that builds upon the simplicity of message queueing by
    focusing on the following principles:


    +   - Message orientation

    - Queueing

    - Routing

    - Reliability

    - Security'
