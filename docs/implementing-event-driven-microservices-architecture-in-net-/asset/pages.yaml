    \ It also allows for agent-based installations on virtual machines, as well as\
    \ virtual machine scale sets and other resources, giving you more control over\
    \ where and how experiments can be run. We will start by diving into Chaos Mesh\
    \ before moving to orchestrating experiments using Azure Chaos Studio.\n\n# Starting\
    \ with Chaos Mesh\n\nFirst, we will look at installing and using Chaos Mesh to\
    \ get a feel for how the experiments can be structured to impact services, namespaces,\
    \ and even hosts within the Kubernetes cluster. It is installed in any valid Kubernetes\
    \ environment, from **minikube** to **Docker Desktop** to cloud-hosted clusters.\
    \ Each experiment is created as a **Custom Resource Definition (CRD)** within\
    \ the cluster, which allows specific .yaml files of every experiment you want\
    \ to be captured; they can then be applied during a pipeline or test run.\n\n\
    If you happen to be using a **Linux** distribution, **Windows** subsystem for\
    \ Linux, or **macOS**, the one-liner provided by Chaos Mesh home page can get\
    \ you started with the installation process:\n\n```\ncurl -SSL https://mirrors.chaos-mesh.org/v2.2.2/install.sh\
    \ | \nbash\n```\n\nDoing so will result in Chaos Mesh being created in the cluster\
    \ you have selected. If you do not wish to install this via the command line,\
    \ you can also install Chaos Mesh using the **Helm** chart by adding the Helm\
    \ repository to your cache and installing it from there. Once the installation\
    \ is complete, you should inspect the namespace and resources within it. Three\
    \ services will be installed:\n\n+   - **Chaos-daemon**: This accepts and executes\
    \ chaos experiments, including any of the supported experiment types.\n- **Chaos-dashboard**:\
    \ This allows you to manage the mesh using a web-based UI.\n- **Chaos-mesh-controller-manager**:\
    \ This is the control plane for the mesh. It sits between the Kubernetes APIs\
    \ and the `chaos-daemon` service, receiving events from the Kubernetes APIs and\
    \ sending those to the `chaos-daemon` service for execution."
