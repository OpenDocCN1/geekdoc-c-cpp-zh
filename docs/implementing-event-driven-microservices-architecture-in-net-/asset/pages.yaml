  md: '# Debugging in containers


    ![](img/290aa6845834e57fd715912cc7e76d30_121_0.png)


    Figure 6.2 – Solution structure showing a Dockerfile for each application


    Now that we have the container images, we need to focus on using these to debug
    our code inside them. When we orchestrate many containers, including the service
    containers, we will retain the ability to break into, and step through, lines
    of code in a production-like environment.


    # Debugging in containers


    The container images can be started on demand to run the microservices. However,
    producing a new Docker image that internally builds and publishes release code
    will not offer the debugging of the code we are looking for!


    To overcome this, we need to run the development code unpublished, by using a
    Debug build, quickly and dynamically inside a container with a debugger attached.
    We must understand how Visual Studio modifies the container images to support
    debugging, and how this fits into the overall orchestration of all components,
    supporting the service component.'
