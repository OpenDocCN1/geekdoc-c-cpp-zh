    standard output and error streams.


    To aggregate logs directly to an external logging system, we can use **Azure Application
    Insights**. It can natively instrument .NET applications (among many other supported
    languages) with a few code changes.


    To aggregate logs written to the standard output and error streams, we can use
    **Container Insights**, which is a capability written in **Azure Monitor**. Container
    Insights is a great utility for viewing and querying logs by multiple Kubernetes
    clusters, but it currently does not support the level of structured interrelationship
