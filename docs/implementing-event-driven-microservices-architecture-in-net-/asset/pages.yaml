  md: '# Microservice Observability


    This chapter intends to explain how to shift the mindset of observability relative
    to monolithic software development – first, by addressing the challenges through
    using microservice patterns, then by addressing the challenges introduced by event-driven
    architecture.


    We''ll cover the following topics in this chapter:


    +   - How to monitor service health and availability

    - Correlating logs across microservices

    - Using causation logging across events

    - Leveraging Azure Application Insights for observability


    By the end of this chapter, you will know how to add independent logging to event-driven
    applications services without losing the aggregated needed to support higher environments.


    # Technical requirements


    For this chapter, you will require the GitHub source code found at https://github.com/PacktPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/chapter07.


    We will also create an instance of Application Insights in Azure. Details about
    this service, which is part of the Azure Monitor service, can be found at https://microsoft.com/en-us/services/monitor/


    # Observability


    It would be prudent to start with a clear definition of observability. In other
    words, it means to be able to notice or discern something. Applied to our discern
    on software applications, we can be more specific about what we are discern and
    how we do so: to be able to measure the internal state of a system by its outputs.


    In software systems, this is achieved through the enablement of what is commonly
    referred to as the three pillars of observability:


    +   - Metrics: A series of measures over time

    - Logs: A record of messages describing noticeable events within a system

    - Traces: A set of indicators throughout logs that connect a series of related
    events'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'At this point, it is worth addressing the critical commentary you will find
    on the three pillars of observability in more recent online publications. There
    are indeed some shortcomings of these pillars at a hyper-scale, and thought leaders
    are evolving beyond to refine the quality and accuracy of observability every
    few. However, understanding and using the three pillars is a fundamental requirement
    to be able to go beyond them. They are entirely relevant and valuable to the MTAEDA
    application and implementing the basic principles of EDA is required for all microservice
    architectures.


    In the world of microservices, we have two significant complications to overcome
    that require a modified approach to implementing these pillars:


    +   1. Applications with a microservice architecture are, by definition, made
    up of many smaller separate components that run in total isolation from each other.
    They may even run on different infrastructures, developed with different languages,
    or require different CPU architectures.

    2. Event-driven architecture decouples microservices to the point that we cannot
    control how many downstream consumers react to a single produced event.


    For each of the three pillars, let us understand the specific challenges introduced
    by these complications, as compared with monolithic applications. This will provide
    the keys to answer in subsequent sections of this chapter.


    # Metrics


    An application can produce a series of metrics that make it more observable. The
    primary and most critical metric is whether the application is running. For classic
    monoliths, this is generally not a difficult thing to observe. If the application
    is not running or has internally stalled, it will not process any more work. A
    monolith may be monitored by an external service to check that it is running,
    often referred to as a health probe or availability signal.


    In the world of microservices, we cannot (and should not) think of a single availability
    signal for the entire application. The application is made up of many independently
    running services, each with its own ability to be healthy – or not. One service
    being unavailable does not mean a total failure of the overall system. Other services
    should be fault-tolerant and still function. It may be that continuing to function
    is restricted to responding with a dependency failure message, but the point is
    that it is still responsive and able to function in some way.


    Furthermore, microservices should scale horizontally. While one instance of a
    service may be unhealthy or unavailable, it should not represent a single point
    of failure for the overall system.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Microservice Observability


    Other metrics become important when we start to look at the performance, or throughput,
    of a service. Where a monolith can report CPU usage as a binding limit – 100%
    and your application is maxed out – a microservice landscape is monitored as a
    mix of CPU values, representative of the demand placed on specific chunks of the
    overall application functionality and providing a useful method to drive horizontal
    scaling. Addition to the CPU, an instance of a single service may emit its memory
    usage, storage performance, or even a custom metric that is relevant to its purpose
    (for example, how concurrent widgets it is processing).


    For this chapter, we will focus on the availability or liveness health metrics
    of a service. More specifically, these are referred to as liveness and readiness
    probes. We will explore these in a later section.


    # Logs


    An application outputs a level of verbosity about its internal state at specific
    events. This is not to be confused with the events in event-driven architecture.
    This kind of event can be any line of software code that is executed to emits
    a message. There is typically a setting to expose the application''s level of
    verbosity, typically ranging from very little output (informational) to a continuous
    stream of messages (trace). As we move from development to higher environments,
    the verbosity tends to reduce the output unless there is an explicit need to observe
    more detail for an elusive bug!


    In the world of microservices, the challenge for logging is one of aggregation
    and standardization. How do we bring all these distributed logs together so we
    can observe the system as a whole? How do we avoid the overhead of every service
    hosting its own logging system? How do we aggregate at a service level while still
    having granularity for a specific service instance?


    Later, we will answer these questions and cover the observability of logs.


    # Traces


    The use of the word trace should not be confused with the verbosity level of logs.
    In a single application, viewing the most verbose log information may indeed deliver
    a trace of events that can be tied together. However, in the most archaic-threaded
    monolith, you will often see correlation identifiers in the log messages. This
    provides the real definition of a trace. For any end-to-end system operation (input
    to output), there should be a unique identifier that links any message output
    from all the functions that execute. This is the correlation identifier.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'In the world of microservices, traces follow the same approach of using a unique
    identifier to tie together executing services and functions within them, so we
    can trace all events related to a single originating system action.


    While microservices themselves are expected to be small and relatively simple
    in implementation, the overall system is extremely large and complex, to the point
    that a single correlation identifier can return an enormous log trace. Querying
    logs by this value may return more data than we can reasonably understand, making
    it very difficult to query an internal problem. While it is possible to reduce
    footprint by querying for a specific service within the logs, this is of no use
    when we are uncertain of which service the problem may arise in.


    When we embrace event-driven architecture, the correlation scale issue becomes
    greater. A system may write many logs for a single correlation identifier spanning
    many services and produce an event in the event stream. That event stream may
    be subscribed to any number of consumers. This is unknown to the producer. Assuming
    there are, they would propagate the same correlation identifier, in which a single
    trace may explode exponentially. We will cover how to interrogate traces within
    better during this chapter.


    Now that we have a good understanding of the three pillars of observability and
    how they are complicated by highly scalable systems, such as those built with
    event-driven architectures, we can move on to implementing metrics for service
    liveness and readiness.


    # Liveness and readiness


    Every component in our application should provide liveness and readiness metrics
    as a minimum. In short, a liveness metric advertises that a service is functioning,
    and a readiness metric advertises that a service is available for requests. When
    a service is managed by an orchestrator, specifically Kubernetes, its definition
    can include references to endpoints that do not need to be exposed outside of
    pod.


    If a liveness endpoint indicates the failure of the service or doesn''t report
    anything at all, the orchestrator will terminate the pod and replace it with a
    new instance.


    If a readiness endpoint indicates the container is unavailable, the orchestrator
    will stop request traffic to.


    Note that these endpoints will not have any useful functionality in our development
    environment with docker-compose. Docker is a simplified orchestrator that focuses
    on running multiple containers on a single machine. Kubernetes is a broader functioning'
  merge: -1
