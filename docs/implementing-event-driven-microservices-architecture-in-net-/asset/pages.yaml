  md: '# # 11 Minimizing Data Loss


    In this chapter, we will look at techniques for minimizing or eliminating data
    loss. Cloud-native development architectures bring an inherent risk of data loss
    through transient failures in separate services and/or connectivity between them.
    As such, we design applications for that failure, and event-driven architecture
    uses some key techniques to mitigate this risk of loss. We will explore paradigms,
    such as eventual consistency and guaranteed delivery, and learn how to contextually
    identify data that may be susceptible to loss, along with defining how much loss,
    if any, is acceptable.


    In this chapter, we will cover the following key topics:


    +   - Learn more about typical data consistency paradigms, such as immediate consistency
    and eventual consistency

    - Learn how to identify and plan for potential data loss, including acceptable
    levels of loss and mitigation strategies

    - For situations that require zero data loss, learn how to implement techniques
    that will guarantee the delivery of information to eliminate data loss

    - Understand and account for implications of data loss, where data loss is assumed
    or expected'
  merge: -1
