  md: 'This is where frameworks such as OpenTelemetry can come in handy since it''s
    purposely built to be service- and platform-agnostic but offers a common way to
    expose the application telemetry to external systems. Let''s dig into OpenTelemetry
    a bit further through an example illustrating how to easily set up and use telemetry
    capture within a standard API project.


    # Implementing non-intrusive telemetry


    The idea of implementing baseline telemetry without the incurred overhead of adding
    custom code was not many deemed possible years ago. With the advent of platforms
    such as New Relic, DynaTrace, DataDog, and Application Insights, simply adding
    a library reference to project and configuring connection information can enable
    a good amount of service- and component-level telemetry without further configuration.
    Even with a small amount of configuration and coding, these platforms can capture
    and expose metrics, logs, and traces.


    Options exist beyond those to capture telemetry as well. A question that you might
    find yourself asking "why would we want to implement this instead of using Application
    Insights?" On the one hand, you want to gather this information and feed it to
    a tool within your Kubernetes cluster. You also need more detailed control over
    what exactly is captured to avoid issues with bloated storage accounts or other
    media. There may be certain custom metrics that are easier to implement in .NET.
    As to implementing them using an Application Performance Management (APM) system''s
    SDK and then working additionally to format that information within the APM platform
    itself. Having options for implementing telemetry and reporting on it can be beneficial
    depending on your use case.


    Features within .NET and .NET Core allow us to leverage built-in methods of measuring
    the items we really want. To get started, we''ll look at three libraries that
    can add some value to component and service telemetry. One is the System.Diagnostics.Source
    library in .NET 7, and the other two are OpenTelemetry metric SDKs for Prometheus
    and Jaeger. The OpenTelemetry framework, endorsed by the Cloud Native Computing
    Foundation (CNCF), is an open standard for producing and capturing telemetry that
    can then be exported to reporting systems for further analysis or alerting. The
    SDKs for Jaeger and Prometheus demonstrate an extensibility that allows developers
    to integrate them with common Kubernetes platform components.


    Within the System.Diagnostics.Source library, several object types can capture
    information. For our example, we''ll focus on two significant object types:'
