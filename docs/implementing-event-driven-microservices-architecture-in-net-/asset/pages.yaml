  md: '# Inspecting messaging protocols, schemas, and delivery patterns 45


    While this approach brings consistency to all the events that are raised (and
    handled), there is the underlying issue of determining the data associated with
    each event. As the content of the message''s object is serialized from domain
    events, entities, or handlers, the need to deserialize these messages may pose
    a bit of a challenge. If the target type cannot be loaded from a referenced library
    for any reason, this could cause the event handler to function properly, thus
    adversely impacting the core functionality of the system.


    # Bring-your-own schema


    It is entirely possible keeping a lean (or implied) schema for each message could
    suit your needs. Even sending a serialized JSON instance of the object is a simple
    way to record what the content of that message is. If there are no additional
    system integrations to consider, this approach may be better.


    A potential drawback to this approach would be forward compatibility. If objects
    change over time? What if a new requirement is introduced to feed all the messages
    or processed messages into an aggregator? Small changes may not seem much like
    the time can pile up, making an integration event using an aggregator more painful.
    To help alleviate issues with forward compatibility, you can leverage a pattern
    such as semantic versioning to help set clear compatibility tracks, where major
    revisions imply breaking changes. Designing schemas that are rarely updated could
    also aid in avoiding forward compatibility problems.


    Every design decision has potentials and pitfalls. Choosing the best option is
    ultimately up to you as you compose your application. How messages are delivered
    not rest solely in your hands. This is where message delivery patterns become
    relevant.


    # Message delivery patterns


    In general, when a message or event is produced, the expectation is that something,
    somewhere, will pick that up and perform an action based on its contents. Let''s
    look at these different patterns and the expected behavior of each.


    # Guaranteed delivery


    Guaranteed delivery is a concept that states that a message, once produced, will
    be delivered. Whether that''s one copy or several, the scope of that delivery
    is only relevant to the notion that it will – and must – be delivered.


    # Exactly-once


    The exactly-once pattern implies that a message or event will be sent one time
    to one recipient. This implies that a durability mechanism needs to be in place
    not only on the the'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'producer side but on the consumer side as well. Many arguments have been made
    about the viability of this pattern since the controls are needed to ensure compliance
    would need to be structured and potentially overbearing or difficult to maintain.


    # At-least-once


    The at-least-once pattern is more traditionally known as a broadcast pattern,
    where at least one message or event will be sent, but it may be processed by many
    (or no) recipients. In the scope of using the producer-consumer pattern, this
    works well as many consumers may be interested in the produced event. Being able
    to write an event to a topic would, in theory, satisfy this pattern.


    > Important note\We will discuss different cloud-native resiliency patterns in
    Chapter 4, Domain Model and Asynchronous Design, when we dive into the domain
    code. To implement these patterns, we will be using Poly.net, an open source library
    to ensure the adaption and implementation of these patterns. In situations where
    a component or a device in the field is unable to connect, employing the use of
    a resiliency pattern such as the retry pattern can help reduce the risk of messages
    not being processed, with the ultimate goal of persisting the message(s) locally
    if communication with the broker is not possible.


    # At-most-once


    The at-most-once pattern is similar to the exactly-once pattern in that it intends
    to only allow one message to be processed. The major difference, though, is that
    the at-most-once pattern does not guarantee that anything will be processed. If
    a message is received, it will consume it no more than once. There is a broad
    implication of data loss with this pattern. Choosing to use this pattern comes
    with the burden of not only understanding the risk of data loss but also the responsibility
    of mitigating that risk.


