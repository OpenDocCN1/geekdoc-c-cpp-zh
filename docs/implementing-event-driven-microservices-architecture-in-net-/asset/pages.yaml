  md: 'Before processing the event, we capture the current offset position. We can
    then increment the offset to the event being processed. After the event is processed,
    we commit the offset position to the broker and the local transaction scope, which
    will contain any saved progress.


    Should the event processing fail and the local transaction is aborted, we will
    reset the offset to the previously saved value.


    Again, we could save local consumer progress to Kafka. In that scenario, the consumer
    would also be producing its own events to track progress. The producing service
    provides access to the broker transaction scopes.


    We have covered the delivery guarantees in some practical detail. But how do they
    relate to the MTAEDA application? And what are the implications of each?


    # Data loss implications


    There are many scenarios we could evaluate to find the optimal delivery guarantee
    for a given process. As example, each we trigger a mechanical barrier increments,
    this is sent via to the maintenance tracking service. If each event contains a
    barrier ID, then we have the decision to make in the accuracy of the counter driving
    the maintenance schedule.


    At-most-once delivery will ensure we do not overcount the use of each barrier
    due to system failures that would otherwise result in duplicate events. However,
    it also means we might undercount for the same reasons. This could result in late
    maintenance, meaning a higher probability of barrier failure.


    At-least-once delivery will ensure we do not miss any in the use of a barrier.
    However, it also means we might overcount through duplicate (retry) events. This
    could result in early maintenance, meaning a higher cost to operate. It will also
    impact system scalability and throughput.


    Effectively-once delivery would ensure that the barrier usage is accurate. However,
    how does the even greater performance impact of this guarantee measure up against
    the mistiming of maintenance?


    As we have previously discussed, this design decision (and the many other event
    scenarios that require similar consideration) are deeply rooted in the real-life
    domain that our event-driven architecture supports.'
