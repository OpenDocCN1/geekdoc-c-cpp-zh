- img_proc: true
  md: "Observability Revisited instances\n\n# # Adding more service instances\n\n\
    For Consul to balance service instances of the same service, we require more than\
    \ one instance of each. We do this by simply duplicating the producer and consumer\
    \ configurations in docker-compose.yml.\n\nThey require a different section name\
    \ (producer1, producer2, and so on), unique IP addresses, and a different port\
    \ mapping to the local machine.\n\n# # Adding the Consul cluster\n\nNormally,\
    \ a Consul cluster takes the form of multiple server agents and client agents.\n\
    \nThe servers provide the peer-to-peer network, with a leader election process,\
    \ to manage the state of the registered services. This is similar, in nature,\
    \ how a Kafka cluster elects a leader, except that is controlled by an instance\
    \ of Zookeeper. Consul uses a consensus protocol, called Raft, to allow the servers\
    \ to elect a leader. There is a fantastic link to a visual explanation of the\
    \ Raft protocol in the *Further reading* section.\n\nThe clients provide the proxy\
    \ endpoints that care to the service instances. These may be in a Kubernetes cluster,\
    \ running on individual VMs, or in our case, just another Docker container.\n\n\
    We will implement a one-server, one-client configuration by adding the following\
    \ to the docker-compose.yml file:\n\n+   - The server configuration is as follows:\n\
    \n```\nconsul-server:\n  image: hashicorp/consul:1.10.0\n  container_name: consul-server\n\
    \  hostname: consul-server\n  restart: always\n  volumes:\n    - ./server.json:/consul/config/server.json:ro\n\
    \  ports:\n    - \"8500:8500\"\n    - \"8600:53/tcp\"\n    - \"8600:53/udp\"\n\
    \  networks:\n    mtaeda:\n      ipv4_address: 10.3.0.9\n  command: \"agent\"\n\
    ```"
  merge: -1
  pgno: 288
- img_proc: true
  md: "Here, we have defined consul-server as a container built on an image published\
    \ by HashiCorp. We mount the local server.json file as a read-only file inside\
    \ the container. This defines how the server should be configured when it starts,\
    \ including the fact that it will operate as a server and not a client. We don't\
    \ need to concern ourselves with the details of this configuration, which is taken\
    \ directly from HashiCorp's example for Service Discovery. This is linked in the\
    \ Further section if you wish to dig deeper\n\n+   And the client configuration\
    \ is as follows:\n\n```\nconsul-client:\nimage: hashicorp/consul:1.10.0\ncontainer_name:\
    \ consul-client\nhostname: consul-client\nrestart: always\nvolumes:\n  ./client.json:/consul/config/client.json:ro\n\
    ports:\n  - \"8601:53/tcp\"\n  - \"8601:53/udp\"\nnetworks:\n  mtaeda:\n    ipv4_address:\
    \ 10.3.0.10\ncommand: \"agent\"\n```\n\nIn the same way as the server, we have\
    \ defined consul-client as a container built on the same image published by HashiCorp.\
    \ We mount the local .json file as a read-only file inside the container. This\
    \ defines how the client should be configured when it starts.\n\nApart from the\
    \ name and IP address, they both look very similar. The difference is in the configuration\
    \ JSON files, which you will find in the consul folder.\n\n# Accessing the server\
    \ UI\n\nNow we can run docker-compose up and see both the Consul client and server\
    \ running. Visiting https://localhost:8500 in your browser will bring you to the\
    \ Consul server UI. Under the services section, you will see 1 instance of Consul\
