  md: '# 6

    Localized Testing and Debugging of Microservices


    From the previous chapters, we understand that the MTAEDA application sample code
    currently contains a mix of runtime components: two self-coded microservices (Producer
    and Consumer), and three supporting services (Zookeeper, Kafka, and Kafkadrop).
    We saw that the Kafka service is configured with a level of redundancy. However,
    to leverage the full performance potential of EDA, we must be able to scale all
    the services by adding more instances in an orchestrated pattern.


    This provides us with a configuration management challenge that is common across
    all modern application development practices today – not just for EDA:


    +   - How do we develop and test efficiently with so many components to manage?

    - Can we provide multiple developers and teams with a consistent environment?

    - Will higher environments be reliably consistent with the development environment?


    This chapter intends to walk through adding the configurations needed to orchestrate
    the development environment and using the tools that allow us to test code more
    effectively.'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'We''ll cover the following topics in this chapter:


    +   - Orchestration and containers

    - Debugging in containers

    - Testing against containers


    By the end of this chapter, you will be able to orchestrate containers all the
    components required for a complete local runtime environment, including those
    we are actively coding. You''ll also learn how to attach to, and debug, code running
    in containers and how to execute functionality and load tests against container-based
    microservices.


    # Technical requirements


    For this chapter, you will require the GitHub source code found at https://github.com/PacketPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/chapter06.


    We will also use Postman. If you have not used Postman before, but are familiar
    with making API requests using curl or Invoke-WebRequest, you should have no problem
    getting started with it. You can download the desktop version for free from http://getpostman.com/


    Another simple but effective open source tool we will use is JMeter, which the
    Apache Foundation manages and maintains. You can download it from https://jmeter.apache.org/


    # Configuring orchestration and containers


    We are already orchestrating components of the application using container technology.
    The docker-compose .yml file that we have explored in previous chapters defines
    the supporting containers we need and their configuration. When we execute docker-compose
    with this file, we are orchestrating the dependency resources by spinning up a
    specific configuration of containers in Docker.


    The next step is to add the MTAEDA microservices to this orchestration definition,
    so we can develop code efficiently and consistently.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Everything as Code (Eac)


    For a moment, let us validate why we want to continue with an orchestration approach
    to support the EDA development. I am confident you know at least the basics of
    DevOps!(I am referring to the practice, not the Microsoft service). By now, you
    may have heard of, or worked with, GitOps. If you have not – do not fear. At the
    heart of both practices, you will simply find code to describe every element of
    a running workload.


    That is exactly what we are going to do for this application development environment.

    As developers, when we clone the application, we want to ensure all configurations
    we need are in that same base. As an operations team, we want to make sure we
    can deliver the environment that a developer develops for the application to function
    and perform successfully. The quality of the configuration code becomes as important
    as the actual application code itself.


    If everything about the application, including the infrastructure requirements,
    is defined in code, we benefit in the following ways:


    +   * Faster environment configuration

    * Higher reliability

    * Consistent testing

    * Transparency of dependencies

    * Easier portability


    For this book, we will focus on the orchestration of the development environment
    so we can leverage the faster environment configuration. We must be able to efficiently
    start all application components while supporting continuous changes and debugging.


    # Creating container images


    We will create a configuration file that describes how a container should host
    the application code for the Producer and Consumer services. To achieve this,
    we will create a Dockerfile for each service and use the Docker command-line interface
    to build and then launch these images.


    Fortunately, Visual Studio can take care of most of this for us.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Localized Testing and Debugging of Microservices


    From the context menu on the consumer project, select Add... and then Docker Support...


    ![](img/290aa6845834e57fd715912cc7e76d30_118_0.png)


    Figure 6.1 – Adding Docker support to the project


    In the next popup, select Linux as Target OS. Visual Studio makes simple but effective
    changes to the project. This file is automatically created with content to build
    the code in Release mode and push it to a final container image ready for launch.
    Let us explore that in a bit more detail:


    ```

    FROM mcr.microsoft.com/dotnet/runtime:7.0 AS base

    WORKDIR /app

    ```


    ```

    FROM mcr.microsoft.com/dotnet/sdk:7.0 AS build

    WORKDIR /src

    COPY ["consumer/consumer.csproj", "consumer/"]

    RUN dotnet restore "consumer/consumer.csproj"

    ```'
