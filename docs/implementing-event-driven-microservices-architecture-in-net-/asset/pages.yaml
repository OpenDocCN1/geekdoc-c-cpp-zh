  md: 'To define the URL path used to access the method, we set the Route decorator
    attribute on the class and the HttpPost decorator attribute on the method:


    ```

    [Route("controller")]

    ...

    [HttpPost("Send")]

    ...

    ```


    The [controller] string argument in the Route attribute defines the URL path for
    this controller should be taken from the filename. This value is a special setting
    that refers to a built-in naming template. .NET will drop the word controller
    from the filename and use that as the path. In our example, ProducerController.cs
    will result in /producer/ as a path.


    The HttpPost attribute defines that the API is a POST method, and it is named
    Send. The full path to this API endpoint, as defined in the new controller, will
    be /producer/send.


    We add more attribute decorations that will run in metadata for the API signatures:


    ```

    [ProducesResponseType(typeof(ProblemDetails), 400)]

    [ProducesResponseType(typeof(string), 200)]

    ```


    Note that Microsoft.AspNetCoreCore.Mvc.ProducesResponseType is applied at the
    class level and the method level. At the class level, it acts as a default for
    all methods. We can identify that any HTTP 400 messages will return a response
    in the Microsoft.AspNetCoreCore.Mvc.ProblemDetails structure. This is a standard
    class definition given that, in cases, the HTTP 400 response format is handled
    internally. At the method level, we identify that an HTTP 200 (success) response
    will return a type of string.


    Swashbuckle uses another .NET library called ApiExplorer to extract all metadata
    that is being added to the code. To add our class that should be indexed for metadata,
    we add the ApiController attribute.


    The Microsoft.AspNetCore.Http.HttpContext is not immediately accessible with the
    inline API definitions. To access this, the controller class uses dependency injection
    to obtain a reference to an instance of the IHttpContextAccessor. In the ProducerController
    constructor, we assign this to a private read-only field for use in the method
    body.


    Now we can add the code within the Send() method. It follows the same logic as
    the inline call that we defined in Program.cs in Chapter 2, The Producer-Consumer
    Pattern, and within that, a method called Send():'
