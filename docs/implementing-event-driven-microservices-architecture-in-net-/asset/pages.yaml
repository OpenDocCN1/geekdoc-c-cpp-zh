  md: '# CI/CD Pipelines and Integrated Testing


    # Get started with GitHub Actions


    Build, test, and deploy your code. Make code reviews, branch management, and triage
    the way you want. Select a workflow to get started.

    Learn how to set up a workflow yourself


    ![](img/290aa6845834e57fd715912cc7e76d30_174_0.png)


    Figure 8.7 – Searching for and using the Deploy to AKS template


    With our CI and CD pipelines ready, we can deploy the Environment''s services.
    Our next focus will be to work out how integration testing can be added to our
    pipelines.


    # Choosing an Integration Test Suite Methodology


    Just as there are preferred methods for identifying and writing unit tests for
    your code, there are similar methods for identifying and writing integration tests.
    As a general rule, integration tests are involving real instances of services,
    components, or other dependencies as mocks or stubs, which are often found in
    unit testing.


    Several methodologies are considered standard when it comes to integration testing
    (source: https://softwaretestingfundamentals.com/integration-testing/). These
    include the following:


    +   - Big-band: All components are combined together and at the same time

    - Top-down: Top-level units are tested first, then lower-level units are tested
    (that is, testing an API route and then testing the components that it relies
    on)

    - Bottom-up: Lower-level units are tested first, then top-level units are tested
    (that is, testing component interaction before testing an API route that relies
    on those interactions)'
  merge: -1
  pgno: 174
- img_proc: true
  md: '+   • Sandwich/hybrid: An intentional mix of top-down and bottom-up methodologies


    These approaches offer specific benefits, depending on how you wish to validate
    your code''s functionality. They can also support scenarios in which the order
    of operations is a deciding factor.


    Two ways in which you can incorporate integration testing methodologies into your
    pipeline are through direct deployment or direct consumption. Let''s examine some
    characteristics of each method.


    With direct deployment, you can deploy your code, as well as the code or components
    that your code is dependent upon. For example, a domain pipeline will build a
    Docker image and publish it to GitHub Packages, making it available to others
    for consumption. You could then create a Docker Compose file that pulls the images
    of the services upon which your code depends and run them at the same time as
    your code. From there, executing a test series or scripts will cause your code
    to interact with the freshly deployed dependencies, yielding a true integration
    test.


    As for consumption, this method assumes the dependencies you have already deployed
    in some type of integration environment, where the names and locations of the
    services are well-known. You would then deploy a copy of your code and execute
    scripts with the understanding that previously deployed services would be in your
    place, only requiring you to publish and deploy your components.


    Having talked through examples of integration testing, including how best to work
    those into our pipelines, we can now look at additional ways of ensuring quality
    and system resilience.


    # Summary


    In this chapter, we covered fundamental lessons around the CI and CD of our domain
    services. We examined some common patterns, such as environment-based deployments,
    using artifact repositories to store build artifacts for later use, and more advanced
    concepts such as triggers, gating, and feature flags. We explored how to set up
    initial CI and CD pipelines using GitHub Actions, including the use of GitHub
    Packages for storing our artifacts when the builds are complete. We rounded our
    pipeline discussion by reviewing some common types of integration testing, and
    how those tests could be added to our pipelines to further automate our testing
    and ensure quality is baked into our pipelines.'
  merge: -1
