    This library is Polly. Polly.net is a library that allows you to implement different
    types of policies in either a synchronous or asynchronous manner to address specific
    issues or combat known problems with cloud service transience, as well as advanced
    error handling techniques, such as the circuit breaker pattern.


    To familiarize with Polly.net, let''s look at a simple example where we can implement
