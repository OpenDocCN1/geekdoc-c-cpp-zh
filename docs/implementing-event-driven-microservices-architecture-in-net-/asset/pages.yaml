  md: '# Domain Model and Asynchronous Events


    While it may seem that this domain is rather small, it does serve a greater purpose,
    giving a location to equipment, maintenance records, scheduling, and identifying
    potentially dangerous fugitives at large.


    # Aggregates


    The primary aggregate for this domain is the station. This aggregate tracks basic
    information about the station, including whether it is still open (operational)
    or closed. It also allows the history of work orders associated with the station
    to be pulled.


    # Entities


    There is only one domain entity associated with the station, and that is WorkOrder.
    This is a domain entity that contains information about a specific work order
    related to a maintenance schedule. It can apply to any type of equipment and captures
    when the work order was created, when it was assigned, and when it was completed.


    # Events


    There are six domain events related to stations:


    +   * Two are related to a change in station information (name or address).

    * Two events indicate a change in the station''s status.

    * Two events deal with installing or decommissioning a turnstile in a station.


    These events directly relate to the event handlers for the domain, listed in the
    next paragraph.


    # Event handlers


    The station domain has three event handlers to manage events related to the station,
    namely a name, address, or status. Status indicators for a station include active,
    closed, and offline.


    # Maintenance


    The maintenance domain deals with events related to any maintenance that''s needed
    on turnstiles and cameras at any mass transit station. While not responsible for
    scheduling maintenance, it is responsible for raising events that state that maintenance
    is needed, which, in turn, will raise events in the scheduling domain to initiate
    the creation of a work order. This is shown in the following diagram:'
