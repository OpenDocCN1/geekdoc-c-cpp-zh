    # Load testing


    Postman testing is gear to confirm whether API endpoints are behaving as expected;
    however, we need to put a heavy load on the Producer to ensure the design of the
    application will keep up and process heavy throughput. There are many tools we
    can use to this. At a more mature point in the development process, we may decide
    to use a service such as Azure Load Testing (in preview at the time of writing),
    which can bombard the application at scale and produce millions of metrics to
    help us understand performance and any unintended bottlenecks caused by anti-patterns.


    To demonstrate the technicalities of implementing load testing, we will use JMeter.


    The steps to set up a request in JMeter are similar to Postman, except we have
    a few additional configurations to add the scale of requests:


    +   1. Under the default test plan, add a thread group:


