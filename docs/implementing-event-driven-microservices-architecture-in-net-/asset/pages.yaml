  md: "# Adding startup services and middleware\n\nThe modifications we made in building\
    \ out the controller have done all the work we need\nto generate a basic OpenAPI\
    \ specification at runtime. However, there are several services\nto inject and\
    \ middleware to configure for this to be completed.\n\nIn the Program.cs file,\
    \ we add a few new services:\n\n```\nbuilder.Services.AddControllers();\nbuilder.Services.AddMvcCore().AddApiExplorer();\n\
    builder.Services.AddSwaggerGen();\nbuilder.Services.AddHttpContextAccessor();\n\
    ```\n\nThe additions should be relatively self-explanatory. We need the Controllers\n\
    service to support the use of individual controller definitions. The ApiExplorer\n\
    service metadata based on the controller class structure and various attribute\n\
    decorations. The SwaggerGen service produces the Swagger JSON file in the latest\n\
    OpenAPI format. And finally, the' service is produced so that\nwe can access HttpContext\
    \ via dependency injection.\n\nConfiguring the middleware follows a similar pattern\
    \ that should be relatively self-\nexplanatory:\n\n```\napp.UseSwagger();\napp.UseSwaggerUI();\n\
    app.UseRouting();\napp.UseEndpoints(endpoints => {\n    endpoints.MapControllers();\n\
    });\n```\n\nConfiguring the Swagger middleware will allow the Swagger JSON file\
    \ to be accessible\nto a predefined path (/swagger/v1/swagger.json). Configuring\
    \ the SwaggerUI\nmiddleware will enable a UI to be served on a predefined path\
    \ (/swagger/index.\nhtml). Routing is required for the Route attribute in the\
    \ controller definition to work.\nAnd finally, configuring the use of endpoints\
    \ with MapControllers will ensure that\nthe controllers are accessible on their\
    \ configured path (/producer/send).\n\nOne thing that took me some time to understand,\
    \ despite how obvious it feels now, is that\nSwaggerUI depends on the JSON file\
    \ generated by the Swagger middleware. If you\ndon't need an interactive UI, but\
    \ you do need the OpenAPI specification to be served in\nJSON format, you only\
    \ require the Swagger middleware and not SwaggerUI."
