  md: '# 13

    Telemetry Capture and Integration


    In modern applications, collecting and acting on the information made available
    by all layers of the application is a requirement for determining areas for improvement,
    root-cause analysis when things go wrong, and even capturing customized information
    to help drive insights into business-specific workflows and activities.


    In this chapter, we will examine the different options for capturing application-level
    and service-level telemetry, and how to ensure that relevant information is captured
    without producing unnecessary noise or overhead. You will also learn how to pinpoint
    meaningful telemetry and aggregate as opposed to aggregating everything, which
    can lead to confusion, large storage footprints, and distrust of the information
    captured.


    By the end of this chapter, you will be able to do the following:


    +   - Identify the different types and levels of telemetry at the application,
    service, and component layers.

    - Learn to implement basic telemetry capture using OpenTelemetry meter providers.

    - Learn to implement custom telemetry capture using OpenTelemetry and .NET diagnostic
    meters.

    - Determine what information is important enough to bubble up to monitoring agents
    and what level of alerting is required for each.'
