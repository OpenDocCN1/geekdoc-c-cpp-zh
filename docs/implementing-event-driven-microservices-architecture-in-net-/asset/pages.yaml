  md: '# Observability Revisited


    With a documented API following the OpenAPI specification, we need to make our
    API available for others to find. We will cover that in the Service publishing
    section. Before we reach publishing, there is another important part of service
    availability that we must cover: service discovery.


    # Service discovery


    In the current context of sharing APIs, it''s easy to think of service discovery
    as a developer finding an API service to use. For this chapter, that is more of
    a downstream event (intended) of service publishing. Instead, we are going to
    focus on service discovery in the context of seeking out and healthy endpoints
    for our API.


    When achieving the levels of scalability that event-driven architecture offers,
    we of course, have many instances of our services running across the unpredictable
    landscape of the cloud. So, when we make one of our APIs available as a single
    unified service, it is almost a certainty that this is backed with multiple instances
    of the same runtime almost any combination of infrastructure configurations. How
    do we make sure that requests to our API are directed to a healthy service instance?


    # It''s not quite load balancing...


    This might appear like a job for a load balancer. However, load balancers come
    with their ownership challenges.


    Firstly, they are not designed for fast addition and removal of backend pool endpoints.
    This is a problem when we have many different infrastructure components spinning
    up and shutting down instances of our services at a rapid pace.


    Secondly, load balancers are not traditionally designed for high availability.
    They become a choke point for service. If the load balancer fails, all services
    fail in it.


    Now cloud platform services are catching up on these problems – but only by adopting
    the same mechanics, as we will explore in service discovery. This means that the
    services are designed for service registration and deregistration, and implemented
    with a peer-to-peer network of load-balancing services.


    We will explore one of the leading solutions for service discovery: Consul by
    HashiCorp.


    # Exploring Consul


    Consul is a service mesh and discovery platform that helps abstract the availability,
    reliability, and security aspects of how one service communicates with another.
    In a complete deployment, not only does it know where all instances of a service
    are and what'
  merge: -1
  pgno: 286
- img_proc: true
  md: "their health status is, but it also handles the encrypted communication between\
    \ them and can discover new services with no application code changes required.\n\
    \nFor the scope of this chapter, we want to focus only on service discovery. Our\
    \ desired end state is a highly available Consul cluster that is aware of all\
    \ our API service instances and their health statuses provides a way to address\
    \ these abstracts that any logic away from the calling application.\n\n# Setting\
    \ up the Docker network\n\nAs we are using Docker with docker-compose, there are\
    \ some limitations to how Consul can operate. The Consul cluster will eventually\
    \ act as a DNS server so that services can be addressed using a predictable hostname.\
    \ Consul will manage the DNS responses so that traffic is balanced across service\
    \ instances and only healthy instances are addressed. In a full production configuration\
    \ DNS binding and forwarding will be used to integrate the Consul DNS into the\
    \ network setup. For the purposes of this chapter, Consul will be the only DNS\
    \ used by our service instances. To support this, we must assign static IP addresses\
    \ to all the containers within the docker-compose configuration.\n\nAt the end\
    \ of the docker-compose.yml file, we define a virtual network and address space:\n\
    \n```\nnetworks:\nmtaeda:\n  driver: bridge\nipam:\n  config:\n    subnet: 10.3.0.0/27\n\
    ```\n\nThe network driver is called bridge and will ensure that there is a bridged\
    \ route between your local host machine and the virtual network address space\
    \ inside Docker.\n\nNow we can assign each existing container in the configuration\
    \ to this network with a static IP using the following template:\n\n```\nnetworks:\n\
    mtaeda:\n  ipv4_address: 10.3.0.*\n```"
  merge: -1
