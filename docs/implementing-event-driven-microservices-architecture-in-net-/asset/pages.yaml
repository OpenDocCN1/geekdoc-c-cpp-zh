    Without adding any further identifiers, Application Insights was able to correlate
    together the original request and the downstream log message in a linked trace.


    This automatic linking of individual logs to produce a trace does not always work
    when we span multiple services and event streams. For this, we need to better
    understand what correlation and causation identifiers are and how we use them
    in our logs to produce effective traces.


    We will explore these concepts further before implementing logging in the consumer
    service.


    # Correlation and causation


    **Correlation** identifiers have been critical to monolithic application logging
    for as long as I can remember. This involves generating a **unique identifier**,
    which is then passed from function to function and included in any log outputs.
    That way, you can query lots of log entries using a single common identifier to
    correlate them. This forms a trace within the logs so that you can observe a connected
    pattern of messaging from within the application code.


    As we shift to microservices, this challenge goes beyond a single application
    process. Most commonly, correlation identifiers are propagated from one service
    to the next using **HTTP for correlation.**'
