    There are two endpoint configurations that are key to helping route turnstile
    events once the IoT Hub has received them. These endpoints are set up to forward
    specific events to topics located within Azure Service Bus instance.


    Service Bus has been selected over Storage Containers, CosmosDB, and Event Hubs
    in this instance for a couple of reasons. The cost per transaction is typically
    lower with Service Bus than with the other endpoint types. Also, using Service
    Bus allows for the potential of integrating other systems with our application
    without having to retrofit connectivity to Event Hubs.


    Finally, we can configure Kafka, as we did in Chapter 3, Message Brokers, to listen
    for events that get written to the two topics in the Service Bus instance. This
    allows for seamless integration into Kafka and allows event handlers to fire,
    depending on the needs of the domain.


    Now that we have addressed a redundancy need with event data, we can focus on
    ensuring downstream consumers make sense of what has happened. With the graceful
    degradation of services the need for succinct and graceful communication.


    # Graceful communication between services


    Everyone someone has experienced an issue with a website or application where
    an error message will pop up that means absolutely nothing to the end user. Sometimes,
    it''s no error message at all. Other times, it can be a complete trace dump that
    appears in the error message. Either of these scenarios is far from optimal, as
    the impact on the user is detrimental and could potentially share information
    about the code base if messages are adjusted.


    The same can be messages tracked in logs. If information is sent about a potential
    error or exception, finding what happened – and how to fix it – becomes very challenging.
    It''s important not only to the usability of the system but the maintenance of
    as well to have clear, meaningful messages meant for each type of audience.


    A common way to manage exception messaging is through the development of exception
    types that differ from System.Exception. For example, the NullReference, FileNotFoundException,
    and InvalidOperationException types are all derived from the base Exception class.
    A common library of Exception could be made available to all development teams
    using a shared library, or each team could create and maintain their custom types.


    In most cases, however, this might not be the preferred approach to communicating
    with end users. Often, microservice developers will make use of custom HTTP'
