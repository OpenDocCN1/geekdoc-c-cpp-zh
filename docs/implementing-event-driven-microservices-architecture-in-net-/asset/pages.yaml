  md: '# Technical requirements


    You can find the code examples for this chapter in this book''s GitHub repository
    at https://github.com/PacktPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/chapter03.


    > **Important note**

    The links to all the white papers and other sources mentioned in this chapter
    are provided in the Further reading section at the end of this chapter.


    # What is a message broker?


    Simply put, a message broker is a piece of middleware that facilitates (or brokers)
    communication between two systems. While this sounds minimalistic, this basic
    concept can be expanded on use cases such as the producer-consumer pattern, among
    others. Given the versatility of this middleware, it can be tempting to add additional
    processing features. When adding to functionality, such as data enrichment or
    transformation, is key to preventing product lock with a particular broker.


    By means of domain-driven design (DDD) standards, keeping the implementation flexible
    while staying precise on the interface functionality will yield the most consistent
    results. While you may not encounter a project that has 10 different concept implementations
    of a broker or a repository, it''s not uncommon to have a few different options
    available. Often, you will see implementation classes for not only brokers but
    at least one type of persistence store; whether that''s a cache, a database, or
    a flat file.


    Terminology aside, there is a vast array of message brokers out there. Some are
    free to use, while others are commercial software that requires licensing and
    payment. Regardless of pricing, brokers tend to fall into three main areas:


    +   - Queue-based technology

    - Cache-based technology

    - Stream-based technology


    Let''s look at each type of broker, along with some general examples that fall
    into each category.


    # Queue-based technology


    First, we will examine brokers that are queue-based, meaning there is a conceptual
    construct that defines a queue or list where the messages sit. Processing those
    queued messages (also known as dequeuing) pulls from the current queue, performs
    some sort of action on them, and yields a result that can be placed in another
    queue for continued processing.'
