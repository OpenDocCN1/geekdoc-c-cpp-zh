  md: 'Hurrah! Managing dependencies for the development environment, and any specifics
    for a debug environment, are now under source control!


    We can be sure that all developers using this same code base and the Docker launch
    profile are running a consistent container definition matched to the development
    and production needs. So, we can launch a fully working debug session on any machine
    that has Docker and Visual Studio installed, without needing any other local dependencies.
    This even extends to the latest .NET Core SDK version you may or not have installed.
    If you ever like to play around with preview releases of the SDK, you can appreciate
    how useful this is.


    The portability of the MTAEAD development environment is much simpler, and now
    reliably controlled via code. Remember the Everything as Code (EaC) section?


    But wait...we are only debugging one microservice at a time. And what about the
    Kafka cluster services?


    # Orchestrating and debugging all services


    We have the microservices individually running, and debugging, in containers.
    In order to debug them in a useful way, we must also have the Kafka services running
    for the application code to fully work. We configured Zookeeper, Kafka, and Kafdrop
    in the existing `docker-compose.yml` file. So, how do we bring this together with
    the newly created microservice Dockerfiles?


    We want Visual Studio to set up a new `docker-compose` project. In doing so, it
    will try to create a new `docker-compose.yml` definition file. To avoid conflict,
    we must back up the existing file with the Kafka services before doing.


    Simply rename `docker-compose.yml` to `docker-compose.bak`.


    Next, select **Add** and then **Container Orchestrator Support...** from the context
    menu on the consumer project:'
