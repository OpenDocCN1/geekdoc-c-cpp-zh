  md: '# Identifying acceptable data loss


    In designing systems that deal with transient failures, data loss will inevitably
    occur. Many architectural patterns can be layered together to minimize the loss
    of data, but it is extremely challenging to guarantee that no loss will ever occur.


    Later in this chapter, we will examine the implications of data loss and what
    we can compensate for. Before getting to that, we must identify what is acceptable
    and unacceptable data loss is. The benefit of this is narrowing the scope for
    unacceptable data loss, to which a high proportion of effort will go towards minimizing
    this loss.


    # Acceptable and unacceptable data loss


    Defining what acceptable and unacceptable data loss is heavily influenced by the
    context of the action being performed and the business impact within that context.
    For example, if adding a customer''s new payment method never succeeds and results
    in a data loss, it may be reasonable to recover the loss by flagging the issue
    to the customer and asking for a repeat entry. However, if the context is within
    an e-commerce application, there may be significant reputational damage to consider
    when putting the responsibility on a customer to repeat such an action. Depending
    on your business context, you may consider the loss of a new payment method acceptable
    or unacceptable.


    Another example of that may or not be acceptable data loss is navigation history.
    Knowing where a customer has browsed on an e-commerce site is important for displaying
    recently visited products and other related products. However, if parts of this
    data are lost due to a transient failure, there is no major functional failure
    introduced into the system. Another scenario where an application tracks the page
    a user is reading on an e-book. In this context, losing their last page may mean
    resuming their reading from an incorrect position, either on the same device or
    a different device. In context, it can be considered a functional failure of the
    application.


    The critical functionality of your application will dictate what is or is not
    acceptable data loss.


    # Methods of data loss


    Data can be lost in a system in many ways, from transient failures in connectivity
    and availability. We can abstract any mechanism of failure into two primary modes
    of failure:


    +   - Failure to write an event


    +   - Failure to consume an event'
