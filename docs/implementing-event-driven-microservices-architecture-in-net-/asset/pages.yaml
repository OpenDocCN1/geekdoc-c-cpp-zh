    # Liveness endpoints


    It is possible to configure a liveness probe in Kubernetes using any three different
    methods.


    +   - A command probe

    - An HTTP request probe

    - A TCP probe


    For the **Producer** service, we will focus on creating a Liveness API endpoint,
    which will be configured with an **HTTP request probe.**


    For the **Consumer** service, we will focus on creating a TCP listener service,
    which will be configured with a **TCP probe.**


