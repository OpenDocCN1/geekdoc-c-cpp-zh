  md: '# Reviewing implementation details in infrastructure 35


    Creating topics in Kafka is straightforward. You can create a topic by doing the
    following:


    +   - Using a configuration setting within your Kafka broker (`auto.create.topics.enable`).

    - Running a script to create a topic; can be done by downloading the latest release
    of Kafka from the Apache website and using the supplied scripts.


    The first option will automatically create a topic for you using the defaults
    set in the Kafka broker, which normally defaults to one partition. The second
    option, you can create topics with more fine-grained configuration. There are
    also options for setting the partition count, the retention time, the replication
    count, and more.


    > **Important note**\Here is a quick note about the retention of records in Kafka.
    By default, Kafka will retain records for seven days. This can be adjusted based
    on application or storage considerations. As any messaging platform, it should
    not be assumed that records will be retained indefinitely within Kafka. This is
    why many event-driven applications use an alternative data store to capture history
    for each domain, and event handlers will be leveraged to write these records to
    the appropriate storage medium.


    # Streams and tables


    Topics alone are not the only area in which records can be read or written. Kafka
    also has the concept of streams built in. In essence, streams are exactly what
    they sound like—a stream of information. Kafka provides a stream API that allows
    you to transform records written into input topics and place those transformed
    records into output topics. Streams can be programmatically created based on a
    specific topic.


    On the other hand, Tables construct that use data available by streams and present
    that data in a specific and intentional way. Using common techniques such as `mapreduce`
    Kafka-centric operations, you can create transformations that enrich or compact
    records with the intention of using another stream to write records to output
    topics.


    While these constructs are important and valuable as utilities within Kafka, you
    might find their use within domains as an augmentation to event handlers. Kafka
    offers a connect API that allows you to set up connections with a variety of different
    destination systems and data stores. If the plan is to only consider and use Kafka
    as a messaging platform, using streams and tables along with the connect API could
    make a lot of sense.'
