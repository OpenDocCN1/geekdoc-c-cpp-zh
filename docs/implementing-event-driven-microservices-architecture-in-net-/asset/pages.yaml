- img_proc: true
  md: '# Generating service information


    Generating service information is a critical prerequisite for exposing services
    to wider audiences. It not only serves the purpose of helping consumers understand
    and test service calls, but it also allows them to stay current with version changes
    in the service definitions.


    It did not take long for the open source community and software industry, in general,
    to standardize what service information should look like. In parallel, the tooling
    that helps generate this service information has evolved. Before looking *our*
    tooling of choice, first, let''s understand the most commonly used API standard
    developed by the OpenAPI initiative.


    # OpenAPI specification


    At the time of writing, the OpenAPI Specification v3.1.0 is the currently published
    version. The version number itself isn''t so important to our learning, but rather
    the OpenAPI specification is and what it hopes to achieve.


    The following is taken from the beginning of the OpenAPI specification, answering
    the question of What is the OpenAPI Specification?


    The OpenAPI Specification (OAS) defines a standard, programming language-agnostic
    interface for HTTP APIs, which allows both humans and computers to discover and
    understand the capabilities of a service without requiring access to source code,
    additional documentation, or inspection of network traffic. When properly defined
    via OpenAPI, a consumer can understand and interact with the remote service with
    a minimal amount of implementation logic. Similar to what interface descriptions
    have done for lowerlevel programming, the OpenAPI Specification removes guesswork
    in calling a service.


    In short, this says we should conform to describing what a service is and how
    you can call it in a very standard way, regardless of who you are, whom you work
    for, what development language you use, or the audience your services may serve.


    Thanks to this quick evolution of tooling to support this standard, we have two
    distinct approaches to conform with the OpenAPI standard:


    +   - Design an API by describing it as an OpenAPI standard, and then generate
    code stubs for new services, or compare the existing service code against it.


    +   - Code an API to meet your needs, and then generate an OpenAPI specification
    that describes it.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Observability Revisited


    There is plenty of tooling across most major development languages that support
    both approaches. The OpenAPI initiative recommends using a design-first approach
    as best practice. This would indicate that the tooling for describing an OpenAPI-compatible
    specification and then generating or testing against code is the best choice.
    However, be aware that the tooling that supports reverse engineering the specification
    from existing code is still of great value. While we might design the API first,
    and then generate new code or test code against it, it is at risk of change. So,
    having tooling that can generate the specification at runtime means we can always
    see as-definitions. In effect, we want to statically align a desired API with
    actual code, but we also want to dynamically present the as-is API to any consumer
    at any given time - regardless of its alignment with a desired design.


    Also, being honest about my concentration levels and over-eagerness to code, I
    do often write code when creating new API services. There are some exceptions
    - mostly when I am developing large-scale systems that will go into production.
    If you build a poor design because you are too head-deep in code, you are building
    libraries that will come back and hurt. But in my time and for projects, I jump
    straight to code and let the generator serve me an API specification.


    # A brief history of Swagger


    When developing in .NET Core, the most widely used OpenAPI specification generation
    tool is called Swashbuckle. This uses an object model and middleware called Swagger.


    The OpenAPI specification originates from tooling called SWAGR (pronounced Swagger),
    which was created by developers at Nordic (an online dictionary service). Its
    purpose was to provide easy documentation for developers who would use the API
    and, in doing so, accelerate the monetization of its access.


    Fast many years ago, and that specification has since been acquired and donated
    to the open source community (via the Linux Foundation) and has spun off into
    a multitude of tooling compatible with the standard. As such, you will often find
    the names Swagger and OpenAPI used interchangeably.


    When seeking out any related tooling, it is important to see what versions of
    the OpenAPI specification are supported. In general, you will find more tooling
    with Swagger in the name than OpenAPI, but these mostly support the latest OpenAPI
    specification.


    # Generating the Swagger documentation


    We will demonstrate how to autogenerate an OpenAPI specification document, at
    runtime, for our provider service. This requires two different elements to be
    configured in our services:'
