  md: '# Stream-based technology


    Stream-based brokers are, in many cases, like queue-based brokers. For example,
    there are generally places for messages to be sent (queues versus topics), some
    of computation or action to be taken, and a resulting message to be produced.
    A key difference between queue-based brokers and stream-based brokers is the mechanism
    to receive, process, and retrieve data is handled. While queue-based technologies
    can be clustered to enable concurrency, stream-based systems provide concurrency
    and near-time visibility to data out of the box. This is facilitated by the lack
    of complex routing rules that can be found in a queue-based system. Stream-based
    systems allow information to be provided and the lack of potentially complex routing
    logic keeps touch time on messages very low. The following diagram shows the difference
    between a traditional queuing system and a streaming system in terms of concurrency,
    throughput, and resiliency:


    ![](img/290aa6845834e57fd715912cc7e76d30_62_0.png)


    Figure 3.1 – Queue-based versus stream-based processing'
