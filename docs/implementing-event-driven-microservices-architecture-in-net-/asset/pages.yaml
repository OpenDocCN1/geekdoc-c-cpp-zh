  md: '# Containerization and Local Environment Setup


    So far, we have seen that our modular solution design, with services implementing
    the Single Responsibility Principle (SRP), can quickly lead to a wealth of running
    components within our application. Working on these as a single contributor could
    be overwhelming, and working on isolated domain teams may lead to hiccups when
    performing integration testing. Establishing a pattern that will address the potential
    for issues during integration, with a lower barrier to entry for developers, can
    pay huge dividends down the road. Throughout this chapter, we will be doing just—setting
    up a pattern for usage and deployment that will carry on across developer environments
    and, ultimately, to production.


    Throughout this chapter, we will be doing the following:


    +   - Reviewing containerization fundamentals

    - Setting up the local environment

    - Using Dockerfiles to build and run locally'
