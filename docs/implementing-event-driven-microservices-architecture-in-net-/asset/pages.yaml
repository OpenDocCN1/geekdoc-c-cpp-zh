- img_proc: true
  md: 'Supply chain management is already a big challenge when dealing with static
    package management: verifying sources, attesting to a baseline trust of the maintainers,
    and staying current with security patches while being on the alert for malicious
    continuions!


    Cloud security architects are popping up everywhere, and they have their work
    cut out for them. Managing basic authentication security patterns with tackling
    limitless use of an uncountable number of APIs is daunting! External APIs bring
    about serious risks such as datafiltration and malicious data inputs. But they
    also offer, innovative, and cost-effective ways to grow business capabilities.
    And you can''t be slow... as your competitors are constantly trying to move faster.


    Services as Azure API Management offer a level of control. By ensuring your organizational
    developers can only access external services via APIm, we can at least provide
    a choke point from which to monitor and observe application dependencies on these
    external services.


    This is a lot to keep track of, and API services are ever-changing, ever-moving,
    and ever-improving.


    I want to make you aware of an open source project growing under the **Cloud Native
    Computing Foundation** (CNCF), which is trying to tackle this problem, Ortelius.
    The objective of Ortelius is to create a centralized supply chain evidence store
    that helps tackle the problem of continuously evolving dependencies on API services.


    Ortelius allows API developers to register their services and track their consumers.
    In doing so, it is possible to create a dependency map across applications and
    the API services used.


    Looking at API services and consumers is just one element of Ortelius''s secret
    sauce for supply chain management. It allows lots of dependency and version information
    such as licensing, CVS, source registries, key values, and more. Applying this
    across all your organizational assets, you can ask that famous question from 2021...
    "Where am I using Log4j? Not only will you get a better answer than "everywhere",
    but you can also ask "What is dependent upon an API service that uses Log4j? so
    that you can get a real idea of what your outrages might look like as you path
    that brutal Log4Shell vulnerability. Spoiler alert: the answer is "everywhere.".
    But outside of an extreme like this, the potential power of Ortelius to secure
    your business capabilities, leaving your developers to do what they do best, can
    be an easy train to jump on.


    Who knows whether Ortelius will become the future, or shape the future, as Worknick
    did? Either way, the problem it is addressing is vital to the continued growth
    of hyperscale, highly distributed systems with event-driven architecture.'
  merge: -1
