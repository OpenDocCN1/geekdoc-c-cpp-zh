  md: '# Bubbling up meaningful information


    As we''ve seen, capturing bout-of-the-box and custom telemetry can be done with
    relatively little effort. The real effort is paring down that information to ensure
    there is not too much noise, and relevant information on the health and performance
    of an application is what gets brought to the top. This will save not only the
    patience of those who monitor the application but also result in a lowered cost
    of storage and processing by limiting the volume of information stored.


    To illustrate, we will use two examples of exporters that are compatible with
    OpenTelemetry – Prometheus and Jaeger:


    +   * Prometheus is a popular time-series database commonly used with Kubernetes
    to capture both standard and custom telemetry for applications. Information is
    typically scraped (read from an endpoint) into the Prometheus database and retained
    for a finite period. This information can be used in trend analysis to identify
    patterns around the health, performance, or stability of an application or platform.
    Visualization tools such as Grafana can use Prometheus as a data source to facilitate
    the creation of dashboards and monitors, depending on what needs to be seen for.

    * Jaeger is a distributed tracing framework that allows you to measure events
    across components (spans) and compose a view of those events in an end-to-end
    transaction flow (trace). This can be helpful, especially when troubleshooting
    a distributed application composed of many microservices. Span and trace data
    are usually stored in either Elasticsearch or Cassandra databases, although other
    sources can be used if you are inclined.


    Before starting the walkthrough for Prometheus and Jaeger exporters, please be
    sure to have a Kubernetes cluster set up in the cloud or locally using MiniKube
    Docker Desktop, or another local distribution of your choice. Please ensure you
    have the appropriate context so any commands issued using kubectl affect the right
    instance. Also be sure to have Helm installed, as it simplifies the installation
    of both components. The installation instructions are linked in the Further reading
    section.


    # Metric ingestion with the Prometheus exporter


    Enabling and leveraging metric ingestion using the Prometheus exporter for OpenTelemetry
    is not terribly complicated. To get things set up to use Helm, add the community
    repository for Prometheus by running the following commands:


    ```

    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

    helm repo update

    ```'
