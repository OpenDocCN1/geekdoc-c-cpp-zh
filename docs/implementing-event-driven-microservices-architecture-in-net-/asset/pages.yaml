  md: 'Now we''ve explored a few different options for setting up the development
    environment, let''s dive into Dockerfiles services a bit more.


    # Using Dockerfiles to build and run locally


    Earlier in this chapter, we leveraged the Docker plugin for Visual Studio to generate
    Dockerfiles for each of the three services. As noted, the generated files contain
    several FROM directives, which allow Docker to use a specific image when building
    that layer. In some cases, Docker can be very simple—sequential lines installing
    or configuring aspects of the image for optimal use. But when does it make more
    sense to use a sequential file instead of that has multiple build stages?


    # Sequential versus multi-stage files


    Chances are, if you have Docker experience, you''ve constructed a few Dockerfiles
    in your day. Starting off, you may have taken a base image and added a few programs
    to it, installed specific frameworks on it, or even configured more complex options
    for the image itself. A good rule to follow when writing a Dockerfile is to look
    at what needs to happen during the build process. For example, when building images
    that will ultimately run a compiled program, .NET as you see separated during
    multi-stage files in most cases. The reason for that is simple—it allows you to
    separate the building of the application from the packaging and configuration
    required to run the application.


    Take the command API, for example. The Dockerfile generated has four stages in
    it, where it leverages two distinct base images. The intent is to ensure an optimal
    runtime image is used to build the service. This gives each relevant stage a way
    to be separated but at the end of the process. When building an image for running
    a specific workload, you may opt to use a sequentially-ordered Dockerfile, as
    you may not need to keep things separated during the build phase. Take a moment
    and examine the three services Dockerfiles that were generated earlier.


    Now that we have a better understanding of how Dockerfiles work, we can advance
    to the next step: wiring the services into our Docker Compose file to round out
    our environment.


