- img_proc: true
  md: '# Third-party plugins


    As with any platform, native capabilities can generally be extended and ultimately
    lead to the creation of products that third-party providers offer to the community.
    There are a host of plugins for Kubernetes that are developed and maintained by
    individuals as well as companies, spanning a variety of use cases. Concerning
    scaling, we will be looking at one plugin that meshes well with our application''s
    design paradigm – KEDA.


    # KEDA


    KEDA, short for Kubernetes Event-Driven Autoscaling, is a plugin that enhances
    the autoscaling abilities of Kubernetes by allowing metrics to be set on pending
    events as proposed sampled metrics for resources or deployments. That''s not to
    say that events may not be tied back to some of those baseline metrics – but it
    gives you more options for how and when your application scales (or down). There
    are over 50 scalers available to KEDA at the time of writing, but we will be focusing
    on two in particular: Apache Kafka and Azure Acquisition Insights.


    > Important note

    Please take a moment to review the links in the Further reading section of this
    chapter about the KEDA scalers mentioned previously.


    The Apache Kafka scaler allows you to process triggers based on lag detected in
    processing messages for consumer groups and topics. This can result in an adjustment
    in the available number of replicas to reduce the lag detected. To take advantage
    of scaling using this mechanism, you will want to ensure the scaleTargetRef section
    contains a reference to the name of your Kafka deployment and at least the name
    of the consumer group associated. You may find that some groups do not require
    autoscaling to be configured since the volume of messages being consumed is relatively
    low. For other domains, such as Equipment, Notification, or Identification, a
    larger volume of messages may be consumed and autoscaling configurations for each
    consumer group would make more sense.


    The Insights scaler allows you to process triggers based on specific metrics captured,
    whether those are out-of-the-box or custom metrics. If needed, further refinement
    of the metric can be done by adjusting the metricFilter property and including
    a clause that will target a specific outcome.


    With that, we''ve seen how using various scalers for Kubernetes allow you to control
    when and how many pods are allowed to scale when required. Next, we will examine
    how to set up autoscaling for App Service.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Implementing autoscaling for Azure App Service


    Implementing autoscaling for Azure App Service 189


    Service

    While a heavy focus on Kubernetes has been present throughout this book as well
    as this chapter, you may wish to leverage less complex Platform-as-a-Service (PaaS)
    components to host your application. Azure App Service offers a much lower barrier
    to entry than Kubernetes and allows you to craft service types based on your needs.
    Autoscaling is one of the many features built into App Service and can be configured
    through different avenues. These two avenues are Azure Monitor, the platform-level
    monitoring and alerting suite, and Application Insights. We''ll also be examining
    some App Service specifics that can be applied to Web Apps, as well as API Apps.


    # Common platform options


    One of the benefits of using cloud-native platform components is that you can
    apply them to just any resource type within the cloud environment you''re using.
    With Azure Monitor, you can tap into a large ecosystem of monitors, diagnostic
    information, and alerts to help you proactively and reactively manage your application''s
    performance, availability; and reliability.


    # Azure Monitor


    There are four main types of conditions that Azure Monitor uses to signal that
    a potential problem is about. These are as follows:


    +   * Metric alerts: These are alerts based on a specific metric meeting or exceeding
    a predefined target. These would include CPU usage, memory usage, and so on. An
    added dimension with metric alerts is time. You can set a threshold that invokes
    an alert should CPU usage hits 75% over a sustained 5-minute period.

    * Log alerts: These are alerts that look for specific values or strings within
    Log Analytics that may indicate an issue or error.

    * Activity Log alerts: These are alerts that specify when an action or event occurs
    that is not allowed or may indicate a compromised system. For example, the Activity
    Log captures information about creating and deploying cloud resources, as well
    as auditing infrastructure-level failures.

    * Smart Detection alerts: These are alerts that use the power of machine learning
    to adapt to your application''s steady state, then use that information to detect
    anomalies and issue alerts based on those anomalies. Application Insights is one
    platform component that can utilize Smart Detection alerts.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Modern Design Patterns for Scalability


    While Azure Monitor is not solely about alerting, the ability to measure different
    platform aspects to determine if a resource needs to be scaled up can be helpful.
    Alerts can be autoremediated using Action Groups, which are Azure constructs allowing
    for automation to fix issues that bubble up to the platform. These conditions
    also factor into the ability to scale App Services, more specifically App Service
    Plans, to match demand. We will look at how to configure autoscaling in the two
    subsections.


    Smart Detection alerts are particularly interesting because they allow us to leverage
    machine learning to detect failures and anomalies in our application with a simple
    configuration setting. That''s not to say that other implications will not rise
    – cost, for example, may become a problem, especially if the volume of information
    that Application Insights is insight reaches to hundreds of megabytes (MB) or
    over GB per day. Regardless of volume, we can still use great insights from Application
    Insights coupled with Smart Detection.


    # Application Insights


    We have already seen how Application Insights offers a wealth of monitors, insights,
    and data points by simply creating an instance and integrating the SDK into our
    code base. The additional benefit of using Smart Detection is it gives engineers
    a proactive diagnostic report when anomalies or failures are detected. While the
    use of Smart Detection does aid in offering automated alerts, setting up rules
    to scale other resources based on these alerts may not be practical.


    One area of Smart Detection that does value is that of the Settings pane or the
    list of Smart Detection alerts offered by Application Insights. These include
    latency degradation, exception anomalies, failures memory leak detection, response
    latency degradation, and trace latency degradation. The alert rules, conditions,
    and remediations for each of these items are pre-created when Smart Detection
    is enabled. This allows you to see how those alerts are constructed, and in turn,
    use the configurations to build custom autoscaling events in your App Services.


    With more of an understanding of how integrated platform utilities such Azure
    Monitor and Application Insights can provide us with important information relative
    to the performance of App Services, we can now turn to look at some special circumstances
    that are relative to two flavors of App Services: Web Apps and API Apps.


    # Adjustments for Web Apps


    Web Apps perhaps the most well-known implementation of App Services in Azure and
    have been around since the platform’s inception. Many features and options have
    been added over the years – the ability to host and run a static web application,
    using'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Implementing autoscaling for Azure App Service 191


    Docker containers as the mechanism to run your web application, along with a variety
    of application runtimes that can host applications. All App Services require an
    App Service Plan to be present, which controls the underlying infrastructure of
    the service as well as ties-ins to platform capabilities such as Azure Monitor.


    To adjust the scaling settings for a Web App, or any App Service, you have two
    options. One is the ability to scale up, which is a manual operation and requires
    switching service plan types. The other is the ability to scale out, which can
    be done manually or automatically. This is where the logic used by Smart Detection
    alerts can come in handy, as it gives you an idea of how to construct custom operations
    on an App Service Plan based on a variety of metric categories available to the
    plan. A full list of applicable metric types can be found in the Further reading
    under Azure App Services Web Site Monitoring.


    Common metrics such as CPU load, memory load, data I/O, and page load times are
    all available to you as means of setting up alerts that drive autoscaling. Other
    complicated metrics, such as lower-level TCP information about establishing and
    closing connections, can also be used.


    # Adjustments for API Apps


    As API Apps used to be a separate type of App Service, it''s common to see them
    referred to as such. When creating a new API App Service, you''re creating a new
    Web App. Given the general construct that an API app is simply hosting a service
    or group of services that can be accessed via restful HTTP calls or path-based
    HTTP calls, there is little distinction between an API App and a Web App. Within
    the configuration of a Web App, there is a section that allows for configuring
    items such as API Management integration as well as service definition URLs that
    can load the service metadata from OpenAPI or Swagger specification.


    For autoscaling, the same App Service Plan metrics and conditions for allowing
    an API App to scale out are the same as those for a Web App. Truly the only considerations
    you may look into would be to use API Management to act as a gateway to that Web
    App. API Management has a host of features and configuration options that can
    be beneficial but are beyond the scope of this book.


    Having rounded out our look into Azure App Services and how they can be configured
    to allow autoscaling based on metrics, we can rest knowing we have covered the
    main patterns of scalability they relate to our application and our infrastructure.'
