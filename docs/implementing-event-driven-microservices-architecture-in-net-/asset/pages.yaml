    Table 10.1 - Kubernetes metric types related to HPAs


    The Kubernetes documentation recommends creating custom cluster metrics instead
    of using external metric types. This is because securing custom metrics internal
    to a cluster is easier than trying to secure metrics to an outside-hosted service.
    It also removes the dependency on platforms outside of the cluster. In some cases,
    however, creating an external metric type may apply to your application, and its
    usage should be closely examined during the design process.


    # ReplicaSets


    A technical way to control how a Kubernetes deployment remains flexible with scaling
    is to establish a ReplicaSet with a larger maximum pod value. While this approach
    takes the automation out of scaling, it does not allow for control over the number
    of pods in the ReplicaSet. For availability purposes, it is generally a good practice
    to use a ReplicaSet with your deployments to ensure a minimum number of pods is
    always available. Controlling the scaling aspect manually instead of automatically
    would be suited for low-impact workloads where detecting conditions that require
    more resources is less likely to cause an issue with the application.


    Certain elements of the Kubernetes platform allow you to control autoscaling,
    regardless of where the cluster is hosted. Next, we will take a look at options
    that are available to you for scaling concern where the cluster is hosted – in
    this case, the public cloud.


    # Cloud platform options


    With each of the cloud platforms offers Kubernetes services, there are several
    different ways in which scalability can be configured. As our example deals with
    Azure, we will'
