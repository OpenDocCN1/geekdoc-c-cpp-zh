  md: '# # 1

    The Sample Application


    Over the past several years, the emergence of high-volume, scalable, event-driven
    applications has caused an interesting shift in application development. Complimentary
    design patterns have made writing and implementing event-driven architectures
    more appealing and have helped to reduce the learning curve when it comes to fully
    leveraging the elasticity and resiliency of cloud platform components. We will
    be taking a look at an application that utilizes event-driven architectures, implemented
    using .NET 7 and leveraging cloud-native applications and data constructs.


    The purpose of this chapter is to outline the sample application we will be using
    throughout this book, along with the business drivers and goals it intends to
    satisfy. This will provide you with the baseline understanding of the application’s
    structure, source code, mechanics, and domains.


    In this chapter, we’ll cover the following main topics:


    +   - Exploring business drivers and the application

    - Architectural structures and paradigms

    - Implementation details'
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Technical requirements\n\nThere are several prerequisites you will need to\
    \ have an understanding of or have installed on your machine to use the code base\
    \ and follow along with the examples. These include\n\n+   - Git\n- Visual Studio\
    \ or Visual Studio Code\n- Docker\n- Kubernetes\n- Service-oriented architectures\n\
    - Domain-Driven Design (DDD)\n\nWe will be using an application that has been\
    \ custom-developed and is included with the source code for this book. The primary\
    \ platform we will be using to develop in be .NET 7. All examples will use Visual\
    \ Studio 2022 as the primary integrated developer environment (IDE). Either Visual\
    \ Studio 2022 or Visual Studio Code will be required to develop .NET 7 solutions.\n\
    \n| Important note\n The links to all the white papers and other sources mentioned\
    \ in this chapter are provided in the Further reading section toward the end of\
    \ the chapter. |\n\n# Exploring business drivers and the application\n\nIt's a\
    \ good idea to have a solid understanding of why an application exists, how it\
    \ came to be, and what problems or opportunities it looks to solve. This application\
    \ is a concept application that involves Internet of Things (IoT) devices, distributed\
    \ event ingestion at scale, and facial recognition features. The primary market\
    \ for this application is for turnstiles used at mass transit locations:"
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/290aa6845834e57fd715912cc7e76d30_25_0.png)


    In this scenario, the baseline events capture a simple count of customers who
    pass through the turnstiles at both the entrance and exit points of the mass transit
    system. Some drivers that contribute to the concept of the application, along
    with its need, include the following:


    +   * To increase the visibility of equipment health and the need for proactive
    maintenance

    * To allow integration for facial recognition sensors that can scan law enforcement
    databases for potential fugitives or persons of interest

    * To manage costs associated with turnstile equipment, with options for expanding
    to fare payment interfaces

    * To analyze transit usage, turnstile placement, and the need for additional units
    in high-volume areas'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# The Sample Application


    Having the ability to capture foot traffic related to the entrance and exit points
    of a transit station has several benefits. First, it can be used to understand
    how busy any one station is. Second, with extended use, the equipment can wear
    down and eventually break. With a line of sight into how many people are using
