  md: '# CI/CD Pipelines and Integrated Testing


    **Continuous integration (CI) and continuous delivery (CD)** are two concepts
    that have been at the heart of software development for many years. The notion
    that faster compilation and faster delivery of code to environments brings faster
    feedback has allowed developers to receive and iterate on positive or constructive
    feedback. The end goal of this process is to release a better software product.


    The discovery and usage of design patterns related to Agile software development
    do not have to be onerous. There are general constructs that help developers to
    build and release their products based on the workflow that melds with their team
    setup. Platforms as GitHub take things step further and can provide solutions
    to common build and release situations out of the box.


    Throughout this chapter, we will explore different patterns, build pipelines using
    GitHub Actions, and incorporate integration testing that will help safeguard against
    introducing bugs that break existing functionality.


    By the end of this chapter, you will be able to do the following:


    +   - Evaluate common CI/CD patterns based on Git configuration and popular workflow
    patterns

    - Implement CI/CD patterns using **GitHub Actions** to enable code builds, image
    builds, and deployments to various environments'
  merge: -1
  pgno: 167
- img_proc: true
  md: '+   Learn about integration test approaches and implement testing for baseline
    feature validation, as well as regression testing


    > **Important note**

    The links to all the white papers and other sources mentioned in this chapter
    can be found in the Further reading section toward the the end of this chapter.


    # Reviewing common CI/CD patterns


    As any engineering discipline, you can generally find patterns that help implement
    a specific strategy or outcome. This is also true when you are dealing with CI/CD
    pipelines. Branching strategies for your repository can be loosely or tightly
    coupled to the pattern you decide to go with but are not in themselves CI/CD patterns.


    As we are using Git as source control management system, the notion is that you
    will generally be developing in a branch, pushing those changes remotely, and
    ultimately, creating a pull request to merge your code into a branch suitable
    for building a deployable artifact.


    However, there are some patterns that, when automated, will give you an advantage,
    especially if multiple environments or artifacts are used.


    # Environment-based approach


    Using an environment-based approach to software deployment is typical of most
    development life cycles. Two patterns are commonly leveraged to facilitate multi-environment
    deployments:


    +   1. The first is to have all environments captured in one pipeline, which controls
    whether each environment can be either rolled forward or rolled back.

    2. The second is to have one pipeline that can be executed for any environment.


    As an example, you may wish to have a standardized pipeline set up for any environment
    to ensure every deployment is consistent.


    Figure 8.1 illustrates a singular pipeline for any environment approach:'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Reviewing common CI/CD patterns


    ![](img/290aa6845834e57fd715912cc7e76d30_169_0.png)


    Figure 8.1 – Singular pipeline for any environment


    Depending on your workflow, you may want to have one pipeline that will go from
    build to production. This gives a single pane of glass view into the life cycle
    of a specific artifact or set of artifacts. Figure 8.2 shows a singular pipeline
    for all environment approaches:


    ![](img/290aa6845834e57fd715912cc7e76d30_169_1.png)


    Figure 8.2 – A singular pipeline that contains all environments


    Depending on the platform, you may be able to use a consistent environment template
    and insert that into a comprehensive pipeline that would flow from environment
    to environment, using the same template for each.


    For example, GitHub allows users to create reusable workflows that can be imported
    and used by several developers. Azure Pipelines also allows for reusable templates
    in the form of nested YAML files.


    With some examples of environment-based pipelines now, we can look at the next
    pattern commonly found in CI/CD pipelines, which is **artifact management**.


    # Artifact management


    In the world of software engineering, an artifact can mean many things to many
    people. Some engineers see an artifact as an executable program, an installation
    package, or a series of libraries. Others may see an artifact as a collection
    of HTML, CSS, and JavaScript files that make up a static web application. Regardless
    of the type, an artifact in CI/CD terms is anything that can be deployed to one
    or more environments to provide functionality.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Storing artifacts can be done in several ways. In most cases, artifacts are
    stored in a location that is accessible to agents of deployment, whether those
    are other engineers, other pipelines, or even repositories for targets such as
    Docker images. GitHub has a built-in artifact repository called GitHub Packages,
    which we''ll take a closer at when we talk about setting up the CD pipeline later
    in this chapter.


    #  Triggers and gating


    To leverage the benefits of a CI/CD platform, it''s normally expected that one
    or more of the branches in a repository have been set up to automatically build
    when a commit is pushed. This CI invocation is **triggered** by a commit being
    pushed remotely. Deployments can also be triggered based on successful builds;
    however, the CD pipeline automatically moving to an environment is typically relegated
    to lower environments, where breaking changes are more tolerated and expected.
    In the majority of cases, deploying code to higher development would require some
    sort of review.


    Inevitably, there will be conditions that require sign-off before releasing the
    code to an environment. For example, there is typically some type of sign-off
    needed, especially in large organizations, whenever code is pushed to production.
    For many teams, this is a manual process that could take minutes, hours, or even
    days. A common friction point with developers is the time it takes to resolve
    manual interventions, including sign-off activities. The conditions that require
    some sort of intervention are often known as gates.


    In all modern CI/CD platforms, there are constructs to accommodate most conditions
    that would require manual intervention. While some systems may have more robust
    implementations—allowing approval-based workflows as well as automated gates based
    on work items or test results—you can find implementations to suit your needs
    in the platform of your choosing.


    # Feature flags


    Often seen as an advanced pattern, the use of feature flags helps continuous delivery
    by hiding functionality that may not be fully ready for production behind a flag,
    or rolling back features if there are issues in production. You may decide that
    a certain group of users can easily access to certain upcoming features to help
    get feedback directly from them. This practice is known as using a **canary group**,
    where a small collective of users can test new features and provide feedback,
    especially in the event of something not working as intended.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'Implementing feature flags allows you to shield users from unfinished features
    but allow the code to move to production. This sets the stage for early testing
    of new features side-by-side with existing code.


    # # Enabling GitHub Actions for CI/CD implementation


    In this section, we''ll be walking through how to set up the CI and CD pipelines
    for the Equipment domain. Once you''ve completed this example, you will be able
    to create the same pipelines for all other domain projects.


    # # GitHub Actions for continuous integration


    For the continuous integration setup, we will be starting with a basic template
