  md: "![](img/290aa6845834e57fd715912cc7e76d30_290_0.png)\n\nFigure 14.5 – Consul\
    \ server UI\n\nThe service monitoring definitions for the DNS are in the JSON\
    \ configuration files. The definition for server monitoring is created by default\
