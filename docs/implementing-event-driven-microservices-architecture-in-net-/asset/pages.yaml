  md: '# Data consistency paradigms


    So, at any given moment in time, when data is not consistent across components
    – are we waiting for data to be eventually consistent – or are we experiencing
    data loss due to an unseen transient issue?


    # Data consistency paradigms


    The two primary consistency paradigms to be aware of are referred as ACID and
    BASE. We will define these acronyms in the following sections and understand what
    they are and how they differ. To help remember these acronyms, we can use an analogy
    from chemistry, where a BASE is the opposite of ACID.


    # ACID paradigm/immediate consistency


    As previously noted, ACID stands for atomic, consistent, isolated, and durable.

    With immediate consistency, we get a guarantee that each transaction will be completed
    as a single unit of operation. Therefore, it will either succeed or entirely fail.
    A hypothetical scenario of a consumer ordering a product to a new delivery address.
    In an immediate consistency model, the typical process for this transaction would
    be to first issue the address change and wait for confirmation that it was validated
    and written to the customer''s profile. Next, the order would be created, at which
    point the new address is immediately available for read confirmation on the customer''s
    profile. This is great for ensuring accurate data exists at any given point in
    time. An order containing a customer address that is not on their profile is an
    error scenario that would fail validation and therefore fail to place the order.


    # BASE paradigm / eventual consistency


    BASE stands for basically available, soft-state, and eventually consistent.


    The concept of eventual consistency is simple. Mastering its design and implementation
    is a little challenging but empowers others a level of application scalability
    that is almost limitless.


    Take any of the major social media platforms as an example. If every posted was
    expected to be written to a single data store, the bottlenecks would be quickly
    hit in all directions: memory, compute, bandwidth, disk I/O. The first line of
    defense for social media scalability is the partitioning of data – so when you
    post content, it won''t necessarily be written to all global instances of the
    platform''s data store; however, even if we take a single region of the world,
    there is an incredible influx of new data that must be propagated around multiple
    instances of multiple services running'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Minimizing Data Loss


    in multiple locations. This propagation follows the concept of eventual consistency.
    Eventually, the data will be propagated; therefore, bringing consistency in data
    across the platform.


    Eventual consistency is a great model for event-driven architectures. As events
    are written, they are, in effect, joining a queue with strict governance on how
    that queue is processed. Subscribers to events may react immediately or at any
    point in the future. There may also be a delay depending on how many events have
    built up and what level of processing throughput the consumers can provide. So,
    working with the concept of data being eventually consistent is a natural fit
    for event-based systems.


    Let us go back to acronym of BASE:


    +   **Basically available:** This means data read and write operations are available
    but not guaranteed. This align well with transient faults that occur in a distributed
    cloud application. When interacting with a service that is basically available,
    there is no guarantee of consistency between the writes and reads.


    +   **Soft state:** This means that the state of the data could be fluctuating.
    As time passes, the expectation is that it will have a higher probability of converging
    (being consistent).


    +   **Eventually consistent:** This means that so long as the system keeps running,
    we can eventually expect any writes to be reflected in subsequent reads, and the
    state will be consistent.


    Putting that theory to practice, we can consider payments for the MTAEDA service.
    The process of adding a new payment method to a customer''s profile is an entirely
    different process from charging a customer when it comes to topping their transit
    cart balance. If a customer adds a new payment method and then wants to use that
    for a transaction in quick succession, there is no absolute guarantee that the
    validation and approval of the new payment method will have completed in time.
    Remember that this is by design. We have decoupled these processes to enable extremely
    high scalability and performance targets. Using this use case, the process for
    topping up a transit balance needs to be designed around eventual consistency.


    They are diverse ways you can build logic patterns to be tolerant of eventual
    consistency. For example, you could keep retrying a failing process until it will
    eventually work. It is cumbersome but much more commonly followed than you may
    think. A better and well-known pattern is the Saga pattern.'
  merge: -1
