  md: "# Modern Design Patterns for Scalability\n\nexamine the settings used to configure\
    \ autoscaling for Azure Kubernetes Service (AKS). Keep in mind that Amazon and\
    \ Google may have similar (or different) means of configuration.\n\n# Node pool\
    \ autoscaling\n\nIn AKS, there is a concept of node pools - groups of virtual\
    \ machines that are a part of the Kubernetes cluster, managing system workloads\
    \ as well as application workloads you deploy to. A vanilla deployment will set\
    \ up a default node pool, normally with three nodes that for those workloads to\
    \ be distributed among. As mentioned in the previous section, Kubernetes allows\
    \ you to over-allocate resources to the cluster, having a way for the node pool\
    \ to adjust based on an increase in resource demand seems like a good option to\
    \ have.\n\nYou can set up autoscaling in AKS in a few different ways. From a visual\
    \ perspective, you can use the Azure portal to configure the autoscaling settings\
    \ for the node pool. This tends to help people who are not intimately familiar\
    \ with IaC. The portal allows you to choose between manual or automatic scaling.\
    \ With automatic scaling, you are asked to enter a maximum number of nodes that\
    \ the pool can scale to. This protects you from an autoscaling event that would\
    \ create dozens of cluster nodes, which could be rather unnecessary and quite\
    \ expensive.\n\nThe preferred approach to configuring autoscaling for node pools\
    \ is with IaC. This allows the configuration to be centrally managed and repeatable,\
    \ eliminating the potential for human error. Using Terraform, for example, an\
    \ AKS configuration might look like the following snippet. Some content has been\
    \ trimmed so that we can focus on the autoscaling settings:\n\n```\nresource azureerm_kubernetes_cluster\
    \ \"aks-mtaeda-1\" {\n  name = \"aks-mtaeda-1\"\n  ...\n  default_node_pool {\n\
    \    name = \"defaultpool\"\n    enable_auto_scaling = true\n    max_pods = 100\n\
    \    min_count = 1\n    max_count = 8\n    vm_size = \"standard_b4ms\"\n  }\n\
    }\n```"
  merge: -1
  pgno: 206
- img_proc: true
  md: "# Implementing autoscaling for Kubernetes services\n\nNote that you need to\
    \ enable autoscaling as it is not a default setting for node pools. By setting\
    \ the min and max count values, you are instructing Terraform to enable a minimum\
    \ of one node and a maximum of six nodes in the default node pool. When this cluster\
    \ is created, it will start with a single node in the node pool, despite what\
    \ the node_count is set to.\n\nAKS allows you to define more than one node pool\
    \ for your cluster, which can come in handy if you have workloads that are more\
    \ resource intensive and can be isolated to different nodes without avoiding taking\
    \ resources from system workloads and processes. Next, we'll look at how to set\
    \ autoscaling for multiple node pools.\n\n# Tiered node pools with autoscaling\n\
    \nHaving separate node pools for different workloads may seem like overkill at\
    \ first glance. After all, if your application components are low-impact and fairly\
    \ lean, why even have an extra set of nodes spun up? In cases where your application\
    \ needs to scale up certain operations without impacting system processes, the\
    \ use of additional node pools can help balance load but still give you the flexibility\
    \ of autoscaling.\n\nFollowing our example of using Terraform, we can add a new\
    \ node pool that references the cluster but our application needs. The following\
    \ snippet outlines how we can create a new node pool using zero nodes as the minimum:\n\
    \n```\nresource azurerm_kubernetes_cluster_node_pool \"app-pool\" {\n  enable_auto_scaling\
    \ = true\n  name = \"appcompute\"\n  kubernetes_cluster_id = azurerm_kubernetes_cluster\n\
    \  aks-mtaead-1.id\n  vm_size = \"standard_D8ads_v5\"\n  min_count = 0\n  max_count\
    \ = 10\n  max_pods = 100\n}\n```\n\nWe are still enabling autoscaling, as well\
    \ as setting the min and max node counts for the pool. In this case, you can see\
    \ that the node SKU is a more powerful machine type than the SKU for the default\
    \ pool. During the deployment process, you can set the nodeSelector property of\
    \ the deployment to select this node pool instead of using the default pool."
  merge: -1
