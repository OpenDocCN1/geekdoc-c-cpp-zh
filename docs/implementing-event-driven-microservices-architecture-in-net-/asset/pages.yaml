  md: '# Setting up the local environment


    Having a target to deploy is only half the battle, however You still need to have
    means of creating Kubernetes-compliant deployments that allow your code to run
    in that environment. You could read through the documentation for the platform
    and write manifests from scratch. You could also use utilities such as Helm to
    create a bundled deployment using a standardized package of templates, but this
    will also require work on your part to ensure all the services you need to have
    running are accounted for. Since we already have a compose file in the solution,
    it would be nice to leverage that and not to duplicate efforts. Fortunately, there
    are utilities that exist that can convert compose files into Kubernetes deployments.


    One utility is called compose. This utility will take an existing compose file
    and transform that into the appropriate YAML templates that Kubernetes needs to
    create your containers and Services in a cluster. Once you have installed a suitable
    local cluster you will want to install compose by referencing the installation
    instructions for your operating system at https://compose.io/installation/ Running
    the utility is as simple as typing the following into a Command Prompt or console
    window:


    ```

    compose convert /path/to/docker-compose.yml

    ```


    This will create two files for each Service in your compose file—one for the Service
    itself and one for the Deployment. You can move all these YAML files into a directory
    at the solution level called compose to help track them in one place, or you could
    put the Service and Deployment manifests into a compose directory in each Service
    project directory. Take a moment to review the generated YAML files and compare
    them to the information in the compose file. You will notice that as port mappings
    will show up in the service YAML, while others will appear in the deployment YAML.


    After generating the YAML files, you''ll want to test them out to ensure they
    are functional. If you''re using Kubernetes for the first time, the system will
    select cluster as the current context. If you''ve connected to other clusters
    in the past, please make sure you set the context to the local instance (usually
    called docker-desktop) before testing the YAML files out. After the context is
    set, run the following commands to create a new namespace in your local cluster
    and apply the Deployment and files for the zookeeper and broker services:


    ```

    kubectl create namespace kafka

    kubectl apply -f /compose/zookeeper-deployment.yml -n kafka

    kubectl apply -f /compose/zookeeper-service.yml -n kafka

    kubectl apply -f /compose/broker-1-deployment.yml -n kafka

    ```'
