  md: '# Delivery guarantees 209


    This delivery guarantee is also known as **exactly once**. There are many reasons
    why the use of the term **exactly** is hotly debated (see the *Further reading
    section*). For the purposes of this book, we will continue calling it *effectively*
    once and avoid those arguments.


    One approach to achieving effectively-once delivery requires transactional scopes
    on both the producer and the broker. As these are separate processes, there is
    always a risk that one scope will successfully commit and the other will fail
    before completing its commit. We can keep this risk extremely low by keeping the
    scope commitalls side by side without any other complexities, but this dual transaction
    scope synchronization simply cannot guarantee 100% reliability (although it won''t
    be far!)


    Just like at-least-once delivery, the producer must wait for acknowledgment from
    the broker that an event was received. If the broker does not acknowledge successful
    receipt, then the producer will repeatedly try until it does.


    Any consumer that reads the event must respond with an acknowledgment. Otherwise,
    the broker will allow another instance (or restart) of the consumer to read the
    event again, and it will continue to do this until once delivery is confirmed.


    Effectively-once delivery has the greatest performance trade-off of all three
    delivery methods. This guarantee is best suited for data that is considered an
    unacceptable loss in a system where accounting for the possibility of duplicate
    events is not feasible or desirable (that is


    # Effectively once code example - producer


    To achieve effectively-once delivery from the producer, we must again ensure that
    the producer receives an acknowledgment from the broker. But, in the scenario
    where there is a failure in receiving that acknowledgment, any retry by the producer
    must not result in a duplicate event in the broker. Additionally, we must ensure
    that any saved progress against the producer''s source is atomically tied to a
    successful commit with the broker.


    To tackle the first challenge, we can enable a configuration setting in the producer
    client, `enable.idempotence`. This is disabled by default. When enabled, each
    producer requests a unique producer ID from the broker. Each event sent to the
    broker will now include that unique producer ID. It will also include an auto-generated
    sequence number. So now, when the producer sends a retry event, the broker has
    a way to identify it, effectively ignore it, and simply send back acknowledgment.


    To achieve this, all we need to do is enable idempotence in the producer client:


    ```

    var producerConfig = new ProducerConfig();

    producerConfig.EnableIdempotence = true;

    ```'
