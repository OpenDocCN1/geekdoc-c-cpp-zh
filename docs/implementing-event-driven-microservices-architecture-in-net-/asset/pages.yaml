  md: '# Technical requirements


    You can find all the code examples for this chapter in the relevant folder on
    GitHub, which is available at https://github.com/PacktPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/chapter14.


    > Important note

    The links to all the white papers and other sources mentioned in this chapter
    are provided in the Further reading section toward the end of the chapter.


    # Sharing API services


    So far, in our example TAEDA application, we have focused on various domain information
    that is closely interrelated. As a lone developer, you can probably recall most
    of the API endpoints you created in one microservice when you come to utilize
    them in another microservice. However, in practice, we don''t develop in isolation.
    One of the key benefits of microservice architecture is the ability to divide
    and conquer by assigning smaller domains to teams (or lone developers). In fact,
    we don''t want to limit the understanding of our APIs to just the teams associated
    with the main solution, but to any other teams that might be able to benefit from
    these services.


    Let''s imagine a scenario where there is an intent to conduct a study on foot
    traffic patterns and how they correlate with major sporting events around various
    cities. We already have many services designed to support the backbone of the
    transit management system. There is bound to be a level of reuse for the purposes
    of this study. Accessing those services and capabilities should not depend on
    institutional knowledge and scanning piles of documentation and code. These services
    should be easily discoverable, well-defined, and published.


    In the same way that Excel spreadsheets and local Access databases gave way to
    data lakes and warehouses, server-based monolithic applications gave way to scalable
    distributed services and business capabilities.


    The question is... how can we get our APIs out for others to understand and consume?


    Let''s start by making our services are well defined.'
  merge: -1
