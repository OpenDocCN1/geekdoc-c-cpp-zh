    # Enabling resiliency and scalability


    As Kafka will be the main integration point for the producers and consumers within
    the MTAEDA architecture, it''s important to consider resiliency and scalability.
    Resiliency, in this case, relates to the ability of Kafka to perform under stress
    – whereas a broker is offline, communication between a producer or consumer takes
    longer than anticipated due to network load, or even Zookeeper being offline.
    In this context, scalability is related to how many brokers or Zookeeper nodes
    need to be available, as well as how many can be spun up to handle the additional
    load.


    Three basic aspects of the Kafka cluster (that will enable resiliency) are the
    number of brokers that you have, the replication factor for topics you create,
    and the use of persistent storage for each broker to safeguard against data loss.
    We''ve already seen how to increase the number of brokers when using docker. When
    creating topics, you can specify the replication factor of the topic, which will
    default to the maximum'
