  md: 'There is an assumption that the event broker is not going to fail internally.
    A key element of the event-driven architecture is that events can be handled consistently
    and reliably. What this means is if an event is received, it will be recorded
    by the broker. And if a request to consume events is made, it will be served.
    These are assumptions we can build high confidence in, as we will explore later.


    However, all system components must internally function correctly and successfully
    connect with the event broker to create and consume the events. We can easily
    identify numerous methods of data loss:


    +   - Network disconnection between components

    - Network packet corruption

    - Software bugs in a component

    - Sudden termination of a running process

    - Degradation/underperformance/timeout of a process


    Many of these methods sound like they are no different from a dedicated physical
    data center hosting a scaled application. However, on a cloud platform, there
    are many continuous reconfigurations of both physical and software-defined resources.
    Some of these are driven by maintenance activities, such as hardware replacement
    or operating system patching, while others are driven by operational desires,
    such as autoscaling or canary testing release strategies.


    So, now we understand what acceptable data loss in our context is and the different
    methods that can introduce data loss, we can write code to accommodate for this.
    The failure to find a valid method can be written into the logic as a valid use
    case. In a monolithic application, it might be that this scenario can never occur!
    Designing systems that are susceptible to, and therefore consider these use cases,
    suggests that we are heading towards high scalability of overall system throughput.


    Still, we made a big assumption that if an event is received by the broker, it
