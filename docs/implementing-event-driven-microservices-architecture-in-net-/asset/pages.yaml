  md: '# 2 The Producer-Consumer Pattern


    When deciding on a communication pattern for an application, it is normal to look
    at the circumstances under which components might communicate with one another.
    Typical web applications follow a request/response pattern, where a request is
    made to the server, and a response is returned to the client and handled appropriately.
    For applications looking to handle high throughput in those communication channels,
    a standard request/response pattern is not ideal.


    With hundreds or thousands of requests being sent per second, the application
    would be slowed to a halt as every request is met with a corresponding response.
    Another example is that of a long-running process. There might be an operation
    that gets kicked off by one event but doesn''t complete until several hours later.
    Blocking the thread running that process would limit execution ability, and ultimately,
    the system only needs to know when the process completes. Scenarios such as this
    call for a more resilient and asynchronous messaging pattern. The Producer-Consumer
    pattern, this chapter introduces to cover one such pattern, illustrating the following
    areas:


    +   - Examining producers and consumers

    - Exploring implementation details in code

    - Reviewing implementation details in infrastructure'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# The Producer-Consumer Pattern


    By the end of this chapter, you will have a clear understanding of the following:


    +   - The Premise behind the producer-consumer pattern, how its use enables event-driven
    architecture (EDA), and why the pattern is so widely used

    - Reviewing and understanding the implementation of the producer-consumer pattern
    through code examples that tie back to the sample application

    - Different infrastructure mechanisms that can be leveraged to easily enable producer-consumer
    patterns


    # Technical requirements


    You will find all the code examples for this chapter available in the corresponding
    folder on GitHub at https://github.com/PacktPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/chapter02.


    > Important note

    The links to all of the white papers and other sources mentioned in this chapter
    are provided in the Further reading section toward the end of the chapter.


    # Examining producers and consumers


    The producer-consumer pattern might be more familiar under a different moniker—Publish-Subscribe
    or pub-sub. While the terminology may differ, the intent behind the messaging
    pattern is the same. There are components that produce (or publish) events, and
    there are components that consume (or subscribe to) events. As mentioned in Chapter
    1, The Sample Application, different mechanisms can support event-based messaging
    patterns. We have already established that we will be using Kafka as the primary
    mechanism for sourcing events, but if you''ve never used streaming technology
    before it might be challenging to understand how streaming is relevant to communication
    patterns. Let''s look at a couple of real-world examples, one of which happens
    to be the core case for the sample application.


    # Relating to real-world examples


    Developers understand the concept of communication patterns between components,
    as they enable those patterns while writing a particular application. An extremely
    popular pattern, which has been employed for decades, is that of request/response.
    Most people understand this pattern naturally, as it follows a similar pattern
    to how we, as humans,'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'communicate. If you are speaking with someone and ask a question, you can generally
    expect a response from them. While that response might not be exactly what you
    expect or anticipate, you will still receive a response to your query.


    For those who struggle a bit with understanding how producers and consumers work,
    a simple example can be seen in the form of an employee suggestion box. Employees
    write suggestions on a slip of paper and place in a box that is generally locked.
    The suggestions go in but are not retrievable by anyone other the person who holds
    the key to the box. These suggestions could be collected right away, at the end
    of the day, or at a specific time during the month. The important part of this
    interaction is that the person with the key to the box—typically, someone who
    is in management—collates those suggestions and brings them back to the group.
    Some might not be implemented, but the premise is that the suggestions will be
    read and potentially acted upon by those who make changes in the workplace. The
    employees writing those suggestions are the producers, wherein, produce suggestions
    to make the workplace more enjoyable or more efficient. In this case, the consumer
    would be the manager or supervisor, who collects those suggestions and acts on,
    handling the suggestions as is appropriate for the workplace.


    An additional point to note is the consistency with which those suggestions are
    collected. A common theme in applications using the producer-consumer pattern
    is that eventual consistency—meaning data will be sent and processed eventually,
    based on the configuration settings or requirements that specify how current data
    must be for a particular domain. If the suggestions are collected at the end of
    each day, this indicates a faster data consistency frequency than those suggestions
    that are collected once a month.


    Next, we come to the sample application and its primary use case, which is monitoring
    the usage of turnstile equipment during daily operations at a mass transit. The
    equipment raises events when it is used, when something goes wrong, or when the
    mechanism locks up. These events are sent to a Kafka topic (similar to a message
    queue) via a message broker, and consumers who are interested will subscribe to
    that topic. Once an event hits the topic, the consumer brings it in, and an event
    handler will be run to process that to a database, in entry in an application
    log file, or in more events being raised. This will result in a write operation.
    While more complicated than our first example, it does follow the same general
    behavior. The differentiator here is that producing, consuming, and handling

    events occur at low or high numbers and these activities are governed by the business

    logic within the domain itself.


    Important note

    Message brokers will be covered in greater detail in Chapter 4, Domain Model and
    Asynchronous Design.'
  merge: -1
