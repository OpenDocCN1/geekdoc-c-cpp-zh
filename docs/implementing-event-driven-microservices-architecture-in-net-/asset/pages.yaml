  md: '# Domain Model and Asynchronous Events


    The equipment domain is central to the application. Many events are triggered
    by events that originate from this domain.


    # Aggregates


    The equipment domain leverages two aggregate root objects to manage all interactions
    within the domain:


    +   * **Camera**: This is used to track basic device information related to the
    camera and associated maintenance events. It includes the camera ID, the equipment
    model information, and the station ID.


    +   * **Turnstile**: This is used to track basic device information related to
    the turnstile and associated maintenance events. It includes the turnstile ID,
    the equipment model information, the maximum number of turns before maintenance
    is required, the install date, and the station ID.


    You will notice the **camera** and **turnstile** aggregates appear in other domains
    as well. In some cases, they have different information associated with them.
    Since these objects are objects that are relevant across several domains, it is
    common to see this level of duplication. The events and entities they interact
    with, however, will be relegated to that particular domain.


    # Entities


    The equipment domain interacts with the station domain entity to help track equipment.
    This is a domain entity that contains minimal station information (ID and address),
    as well as a full inventory of equipment at that location.


    # Events


    There are nine core events within the equipment domain. All but one of these events
    are related to actions that can occur with a **turnstile**. The only event associated
    with a **camera** is **CameraInstalled**, which is triggered after **TurnstileCameraInstalled**
    is handled. **CameraInstalled** intends to pass the **model** information of the
    camera back to the domain and associate it with the **turnstile** and the **station**.


    # Event handlers


    There are three specific event handlers, two of which are related to the turnstiles
    located within a station (installation and decommissioning). There is also an
    event handler for closing stations, which would lead to decommissioning all the
    equipment objects related to that station.'
