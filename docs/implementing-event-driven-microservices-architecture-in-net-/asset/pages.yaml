  md: '# Service resolution


    Any developer who wishes to access our services just needs to use the Consul DNS
    resolver or a DNS server that binds or forwards to it. We have configured the
    producer and consumer instances to resolve DNS with the Consul resolver. By design,
    they should never have to care about direct communication with each other. Their
    interaction is purely through events. However, for the purposes of demonstrating
    Consul discovery, we can connect to a consumer instance and see how to reach out
    to a healthy, load-balanced instance of the producer:


    +   Using the Docker desktop, connect to a Terminal session on one of the consumers.
    Use the dig command to query the Consul DNS for the producer.service.


    ```

