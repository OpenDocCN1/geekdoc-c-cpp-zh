  md: '# Telemetry Capture and Integration


    +   - Meter – This allows you to build out a collection of different counters
    that can be using one of the meter SDKs listed previously.

    - Counter<T> – This allows you to create a counter object, which captures information
    of the T type for aggregation and reporting. The type constraint for T is that
    it must be a non-nullable value type.


    Meter objects have a factory method, which can create a variety of different counters.
    The standard syntax for creating a Meter object and an associated counter would
    look like the following:


    ```

    using OpenTelemetry.Metrics;

    using OpenTelemetry;

    using System.Diagnostics.Metrics;


    var meter = new Meter("NameMeter");

    var counter = meter.CreateCounter<int>(Name: "requests-received", Unit: "requests",
    Description: "Number of requests the service receives");

    ```


