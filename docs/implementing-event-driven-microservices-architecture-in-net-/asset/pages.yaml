- img_proc: true
  md: '# Configuring orchestration and containers


    ```

    COPY . .

    WORKDIR "/src/consumer"

    RUN dotnet build "consumer.csproj" -c Release -o /app/build

    ```


    ```

    FROM base AS final

    WORKDIR /app

    COPY --from=publish /app/publish .

    ENTRYPOINT ["dotnet", "consumer.dll"]

    ```


    The first command points to a Microsoft container image called dotnet/runtime:7.0,
    which we alias with the name base. This is a lightweight version of Linux with
    all the necessary installations to run pre-compiled .NET 7.0 applications. It
    also sets the current working directory in image to /app, which will be the destination
    for the compiled executables later in the definition.


    Before it can copy the application files to that destination, we must compile
    the code and publish it. To ensure we do not become dependent on any specific
    build requirements of our local machines, the build operation is executed in a
    container as part of the creation process too.


    The next section starts with a FROM command pointing to the dotnet/sdk:7.0 image
    with an alias creating a new separate image based upon the Microsoft image that
    has all the necessary installations to build a .NET Core 6.0 application. It is
    worth noting that this image is proportionally larger than the runtime image,
    so not ideal a base for the final release image.


    The subsequent command line copy source files, restore dependencies, and build
    and publish the code to the /app/publish directory against the build image.


    The final section with the LAST FROM command takes the published (compiled) files
    from the build image and places them on the lighter base image. It then provides
    an ENTRYPOINT or launch command for when the container image runs.


    The intermediary build image is not persisted, and therefore, does not add overhead
    to the final container image created.'
  merge: -1
