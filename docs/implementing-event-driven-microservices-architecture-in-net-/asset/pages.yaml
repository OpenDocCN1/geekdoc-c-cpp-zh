  md: '# Technical requirements


    For this chapter, you will require the GitHub source code found at https://github.com/PacktPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET7/tree/main/chapter11.


    # Preventing data loss


    Ensuring the complete integrity of data for all monolithic applications is a static
    and manageable concept. Most underlying data stores are atomic, consistent, isolated,
    and durable (ACID). Once data has been received in the form of a request, a single
    compiled application will proceed it to completion. Threats to the integrity of
    this operation are few and, more importantly, highly observable and consistent.


    For example, a failure in the data store may consistently fail the whole application
    – or part of the application – until fixed. A failure of code presents itself
    as a bug that will fail the same repeatedly for the same request. Data corruption
    and loss in monoliths to an all-or-nothing game. If data is lost – you will know
    through consistent failures to operate.


    Moving applications to the cloud bring along two new challenges:


    +   - Scalable architecture means multiple separate components are coordinated
    many microtransactions to deliver an overall successful larger capacity.


    +   - Given that microtransactions can occur at various times and take different
    durations to complete, we must understand the concept of eventually consistent
    transactions as ACID transactions.


    +   - The connection points between these components, and the component''s availability,
    are subject to transient failures.


    +   - This could be caused by network failures or a platform service failure.
    While the cloud is designed to offer elevated levels of redundancy and availability
    to avoid these failures, they can and do still fail for a multitude of reasons.
    From an application perspective, it often appears random and inconsistent.


    A dichotomy is created between these two challenges.


    On the one hand, we expect to have occasional flaws in its integrity across components.
    Data should be eventually consistent across multiple services, but not immediately.
    As a result, we must design services to allow for a level of inconsistency over
    a brief period. On the other hand, many transient failures can happen across multiple
    components. This, in turn, means that there can be a loss of transactions between
    subcomponents that may go unseen.'
