  md: '# # 9nFault Injection and Chaos Testing


    Just as software development practices have evolved over the past few decades,
    so has software testing. With the added draw of paradigms such as **Infrastructure
    as Code (IaC)** and **Configuration as Code (CaC)**, more and more pieces of an
    application are now stored in code and can be tested in a variety of ways. An
    added benefit of leveraging cloud services to host portions of an application
    is the ability to test, in isolation or production, how the application will respond
    in the event of a cloud platform failure.


    At times, anything from virtual machine services to serverless functions to authentication
    platforms can become unavailable. Having the ability to see how your application
    reacts in the face of unexpected outages is something that is often overlooked
    when dealing with applications running in an on-premises environment. Being able
    to anticipate, script, test, and resolve issues based on your understanding of
    potential issues brings more confidence in your development life cycle, as well
    as more confidence in the stability of your application.


    We''ll cover the following topics in this chapter:


    +   * Fault tolerance and fault injection

    * Chaos testing

    * Implementing fault injection and chaos tests'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Fault Injection and Chaos Testing


    By the end of this chapter, you will be able to do the following:


    +   - Understand what fault injection is and how it relates to the overall tenet
    of fault tolerance

    - Understand chaos testing and how it can augment fault injection testing

    - Implement fault injection and chaos tests in your pipelines


    # Technical requirements


    You can find the code examples for this chapter in its chapter''s folder on GitHub
    at https://github.com/PackPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/chapter9
    and https://github.com/PackPublishing/Implementing-Event-Driven-Microservices-Architecture-in-.NET-7/tree/main/src.


    > **Important

    The links to all the white papers and other sources mentioned in this chapter
    can be found in the Further reading section toward the end of this chapter.


    # Fault tolerance and fault injection


    The concept of **fault tolerance** – that is, the ability of an application, platform,
    or runtime to tolerate a systemic fault – by itself seems a simple enough concept
    to grasp. After all, you would expect an application to be able to gracefully
    recover if services were not available. In many cases, applications have been
    written with an understanding that the underlying infrastructure that hosts it
    is always unless a catastrophic event occurs. This reliability may be built on-premises
    data centers and rarely challenged, the same assumption does not hold for cloud
    platforms, services, and components.


    Though cloud platforms will offer certain **Service-Level Agreements (SLAs)**
    for uptime on some cloud services, there is always the possibility of a service-level
    or regionlevel outage that can come with no warning and widely in impact. Therefore,
    it is important to keep these types of outages in mind when you are developing
    an application for the cloud.


    Researching the status pages of cloud providers provide great insight into what
    services have been affected by outages, how frequently they are affected, and
    what remediations were taken to fix the issues. Using this information can help
    you to evaluate which faults or outages are most likely to occur, and how you
    can prepare your application to deal with them.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Anticipating and tolerating faults


    Throughout this book, we have looked at decoupled and asynchronous patterns for
    communication between components in our application. These patterns are not proof,
    but they allow us to handle unexpected interruptions in a less disruptive manner.
    As a part of application design, it''s common to look at what the application
    will be hosted on, the requirements for the application being available, and how
    the application can maintain functionality even when the unthinkable occurs –
    a total outage of a data center or cloud region. Part of that design process will
    take you through the various what-if scenarios and lead you to identify faults
    that may occur based on and where you host the application. We will discuss the
    impact resilience has on the use of design patterns for scalability in detail
    in Chapter 10, Modern Design Patterns for Scalability.


    # Using your faults against you


    One interesting paradigm has emerged from the testing community is the notion
    of purposely introducing errors, exceptions, and faults during testing to measure
    the application''s reaction. Fault injection is the practice of intentionally
    causing conditions that will result in an underlying operating system, hosted
    service, or runtime failing. This practice has long been used by engineers for
    testing physical hardware by affecting circuits, chips, wires, or power supplies
    to determine how the device will respond. This mantra eventually transitioned
    into the software world.


    Using this approach, testers can simulate different types of environmental conditions
    that may cause an application to perform poorly or stop working altogether. While
    this behavior is anticipated, the application does compensate for what is measured.


    Tests that perform fault injections can be written in various ways, from simple
    scripts to entire libraries that focus on a litany of different conditions or
    errors. One approach that has gained popularity is that of chaos engineering,
    which results in the ability to run chaos testing against your application to
    break the underlying platform and uncover areas for improvement.


    # Chaos testing


    While chaos testing involves executing tests designed to break services your application
    depends on, the overall design of chaos engineering was first established in 2010
    by engineers at Netflix. The primary purpose of this type of engineering was to
    test how your services and applications behaved under extreme circumstances. In
    2012, Netflix open'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Fault Injection and Chaos Testing


    sourced Chaos Monkey, which was their internal chaos testing platform. This opened
    the doors for other companies and engineers to be able to leverage and modify
    that suite and adapt it to their applications.


    # The order of chaos engineering


    Chaos engineering follows a simple set of principles, allowing there to be order
    within the chaos, to speak. The three main principles of chaos engineering, according
    to Gremlin, are as follows:


    +   Plan an experiment: This step starts with a hypothesis you formulate based
    on how your application would respond to a problem or outage. This can depend
    heavily on your definition of a stable or steady state – what is normal for the
    application. Understanding and documenting non-functional requirements, including
    API response times, page load times, and other Key Performance Indicators (KPIs),
    go a long way in determining what is normal what is problematic. Also, consider
    the information you gathered from your cloud provider on service outages, which
    will help you recover real-world situations.


    +   Contain the blast radius: This step involves creating a test that simulates
    the problem or outage in the smallest possible footprint possible. For example,
    if the problem is data loss, you may start by experimenting with deleting one
    row in a database table, or one document within a NoSQL data store.


    +   Scale or squash: This final step is where you determine whether the test proved
    out. If you find an underlying issue, then you have a path to improve how your
    application responds to that problem. If not, continue to scale up the test, increasing
    the blast radius until you are at full production capacity. If you uncover an
    issue when scaling your activity up, great – if not, great!


    Using these principles, you can start formulating failure scenarios that your
    application might experience, and from there put together hypotheses about how
    the application should be given the failure type.


    # Implementing fault injection and chaos tests


    Suites like Gremlin aim to make the adoption of chaos engineering easier to move
    toward the Chaos Monkey suite popularized by Netflix like having an aggressive
    learning curve. For Kubernetes-based applications, a popular framework for chaos
    testing is Chaos Mesh. It has not been around as long as such suites as as Chaos
    Monkey, Chaos Mesh is a solid choice for implementing chaos experiments in a uniform
    way'
  merge: -1
  pgno: 182
