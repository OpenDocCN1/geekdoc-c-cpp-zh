  md: '# 14

    Observability Revisited


    In Chapter 7, Microservice Observability, we looked at how to enable the internal
    observability of microservices. We examined how to aggregate metrics, logs, and
    traces so that we can efficiently observe and understand performance and problems
    across a distributed, highly scalable solution.


    In this chapter, we will look at how to make our services externally observable
    to others. You will learn about methodologies for publishing service metadata
    to your organization, cataloging and versioning microservice metadata, and how
    to promote the discovery of shared services within an organization.


    By the end of this chapter, you will be able to do the following:


    +   * Understand how to expose service information with service metadata

    * Understand how to leverage service discovery and implement it using Consul

    * Learn about service publishing and understand the supporting features of Azure
    API Management

    * Learn about the Ortelius service offering and how it can catalog, track, and
    trace dependencies for services'
