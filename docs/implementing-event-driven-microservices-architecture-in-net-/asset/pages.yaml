  md: '# Development benefits


    The portability and reusability fundamentals are rather important when it comes
    to local development. Whether using Docker Compose, minikube, or another way of
    locally running Docker containers, the process that executes within that container
    will be consistent across any of those methods. This also means that developers
    working on different operating systems can technically run the same containers,
    enabling a seamless experience regardless of the developer''s operating system
    of choice.


    One of the ways in which using containers is beneficial to the development life
    cycle is that there is now an ample number of tools that allow you to debug containers
    without leaving your desktop. Over the past few years, tooling from Docker, with
    Microsoft and other open source partners, has enabled integrated development environments
    (IDEs) to be more efficient in helping build and debug container-based applications.
    This tooling reduces friction for developers, as debugging will seem much natural
    as opposed to needing to connect two different processes or command-line utilities
    to debug a specific function or piece of code.


    Another benefit to the development life cycle can be seen in teams who are working
    with other domain teams to build a larger platform or application. To perform
    unit and integration tests locally to validate changes made in an isolated domain,
    pulling down images from other domain teams and then creating containers from
    those images allow for an easier way to leverage stable code to test.


    Having reviewed some of the principles and benefits of using containerization
    in the software development life cycle, we can now look to enabling our development
    environment to take advantage of these benefits.


    # Setting up the local environment


    The developer environment is a critical aspect of enabling numerous iterations,
    shortening the feedback loop, and encapsulating security best practices during
    the development life cycle. Traditionally, a developer may have set up all the
    dependencies, preferred libraries, and command-line utilities, as well as the
    IDE, on a physical workstation. While that can be done, advances in technology
    (also leveraging containerization principles) also enable modern developers to
    take advantage of reusable environments hosted in the cloud.


    This section will look at two scenarios aimed at a repeatable and reliable developer
    setup. We will first look at configuring a local workstation environment, then
    move on to examine the world of virtual developer environments through utilities
    such as GitHub Codespaces and Dev Containers for Visual Studio Code.'
  merge: -1
