    # Reviewing implementation details in infrastructure


    In the last section, we focused slightly on the infrastructure provisioning of
    Kafka, although there is far more setting up Kafka than simply running a script.
    To understand the producer and consumer examples, we made some assumptions about
    how to interact with Kafka and, specifically, a topic.


    # Topics


    Topics are not unique to Kafka but are a construct that producer-consumer patterns
    leverage to store and retrieve messages relevant to a specific domain or grouping
    of events within a domain. Normaly, topics are scoped to a specific subset of
    data. For example, with the domain model of the MTAEDA application, you might
    expect to find a topic for equipment, stations, and scheduling, among others.


    Events and messages (known as records in Kafka) are written in an append-only
    fashion. This means that each record is immutable upon written to a topic. Any
    changes that are required have to be appended to the end of the topic. This allows
    for the sequential reading of records, if needed, by consumers.


    Topics in Kafka are also comprised of partitions. Much like other data persistence
    technologies, partitions can be used to store events or messages that all have
    a common key. This ensures all relevant information for a particular key will
    be found within a specific partition. Enabling multiple partitions allows for
    greater distribution of datasets and, potentially, faster search capabilities
    using that common key as a search term.


    Additionally, partitions can be used as a means of load balancing across multiple
    brokers, as partitions themselves are viewed as parallel units. It can also add
    complexity to the solution—in some cases, you might not want to use multiple partitions
    because you aren’t using a key value. It is possible to write a message or event
    to a topic with null as the key value. If this approach is taken, another common
    identifier will be needed to associate events with one another if searching directly
    in a topic (if that association is required). If no key value is used, each record
    will be written to the end of a partition using a round-robin assignment.'
