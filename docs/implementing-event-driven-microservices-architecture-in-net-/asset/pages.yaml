  md: '# What is a message broker? 41


    The components that perform this processing could be executables, scripts, web
    services, microservices, or even built-in functionality with the broker itself.
    While discussing product-specific capabilities is beyond the scope of this book,
    the following products and their documentation pages discuss what is possible
    with queue-based message brokers:


    +   - RabbitMQ: An open source message queue and broker that allows you to use
    regular queue-based messaging and advanced message queuing protocol (AMQP)

    - ActiveMQ: A Java-based platform that uses AMQP message routing.

    - Azure Bus: A cloud-native message queue and relay specifically implemented in
    Microsoft Azure.

    - WebSphere Message Broker: A message broker and transformation engine authored
    by IBM. This is commonly used by IBM MQ.

    - IBM MQ: A messaging platform that heavily utilizes queues and topics for storage
    and routing, authored by IBM.


    While queue-based technologies may be more immediately familiar to some, other
    storage options are available. Next, we will discuss the concept of caching and
    some related technologies-based support it.


    # Cache-based technology


    Cache-based brokers tend to rely on underlying technologies that are used to cache
    data. Using caching mechanisms for critical messages may not be the best option.
    By nature, the assumption is that a cache can be invalidated at a predetermined
    time or at a random time. While it is possible to operate persistent storage with
    a caching mechanism, it''s not normally a requirement. A typical use case for
    caching is to store temporary data as a convenience for another consuming component.
    Relying on an inherently transient data store does not allow for patterns, such
    as guaranteed delivery, to be completely enforceable.


    Again, how the mechanism is applied will be driven by the needs of the application
    and the business specifications behind it. Some popular caching technologies are
    as follows:


    +   - Redis

    - Memcached

    - Content delivery network (CDN)'
