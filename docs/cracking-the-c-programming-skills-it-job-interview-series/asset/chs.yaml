  析构函数内部\nCaught Exception -1\n\n**答案: (b)** 抛出 true 会赋值为 1，false 会打印 0。\n\n## 18.\
  \ 我们可以使用 throw 语句抛出任何类型的异常吗？回答是或否。(L1)\n\n(a) 是\n(b) 否\n\n**答案: (b)** 否。任何类型的操作数都可以被抛出。\n\
  \n## 19. 识别以下代码的输出。(L2)\n\n```cpp\n#include <iostream>\n#include <string>\n#include<typeinfo>\n\
  using namespace std;\n\nint main( )\n{\n    try\n    {\n        string str1(“Except”);\n\
