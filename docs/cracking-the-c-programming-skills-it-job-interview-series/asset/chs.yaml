  \ 和 10.235\n(c) 4 和 4\n(d) 语法错误\n\n**答案: (c)** 任何指针都需要 4 个字节来存储。void 指针也是如此，在这里它是可以正常工作的。而且，我们打印的是指针的类型而不是指针的内容。\n\
  \n# 6\n\n## 继承\n\n本章涵盖了非常重要的面向对象概念“继承”。它阐明了继承的所有形式和技术。在本章结束时，你将能够有效地将这一概念应用于你的编程技能中。继承是从一个类获取另一个类特征的概念。数据成员和成员函数都可能被继承。\n\
  \n### 1. 代码的输出是什么？(L1)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\nclass\
  \ base\n{ public:\nint b; };\nclass dev : public base\n{ };\nint main()\n{ dev S;\n\
  S.b = 9;\ncout<<S.b; }\n```\n(a) 9\n(b) 0\n(c) 不可预测\n(d) 错误\n\n**答案: (a)** 在这里类\
  \ `dev` 以 `public` 模式继承了类 `base` 的功能。冒号是继承的运算符。`public` 模式继承意味着基类所有的 `public` 成员都成为派生类的\
  \ `public` 成员，而基类的 `protected` 成员成为成为派生类的 `protected` 成员。这是简单的继承。\n\n### 2. 代码的输出是什么？(L3)\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\nclass base\n{ protected:\n\
  int b; };\nclass dev : public base\n{ };\nint main()\n{ dev S;\nS.b = 9;\ncout<<S.b;\
  \ }\n```\n(a) 9\n(b) 0\n(c) 不可预测\n(d) 错误\n\n**答案: (d)** 在 `public` 继承中，基类的 `protected`\
  \ 成员将作为派生类的 `protected` 成员被继承。`protected` 成员不能通过对象直接访问。\n\n### 3. 代码的输出是什么？(L1)\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\nclass base\n{ protected:\n\
  int b; };\nclass dev : public base\n{ public:\nvoid play()\n{ b = 4;\ncout<<b; }\n\
  }S;\nint main()\n{ S.play(); }\n```\n(a) 4\n(b) 0\n(c) 不可预测\n(d) 错误\n\n**答案: (a)**\
  \ `protected` 成员可以被 `public` 成员调用。\n\n### 4. 代码的输出是什么？(L2)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\nclass base\n{ public:\nint b; }S;\nclass dev : public base\n\
  { }D;\nint main()\n{ D.b = 5;\ncout<<S.b; }\n```\n(a) 5\n(b) 0\n(c) 不可预测\n(d) 错误\n\
  \n**答案: (b)** 初始化继承的成员对基类成员没有任何影响。\n\n### 5. 代码的输出是什么？(L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\nclass base\n{ public:\nint b; }S;\nclass dev : public base\n\
  { public:\nint b; }D;\nint main()\n{ D.b = 5;\nD.base::b = 9;\ncout<<D.b<< “ ”<<D.base::b;\
  \ }\n```\n(a) 5 9\n(b) 5 0\n(c) 不可预测\n(d) 错误\n\n**答案: (a)** 在这里 `D.b` 指的是在 `dev`\
  \ 中声明的变量。要访问继承的变量，使用基类名配合 `::`。\n\n### 6. 代码的输出是什么？(L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\nclass base\n{ public:\nint b; }S;\nclass dev : public base\n\
  { public:\nint b;\nvoid fun()\n{ ((base *) this)->b = 2;\ncout<<b<<” “<<((base *)\
  \ this)->b; }\n}D;\nint main()\n{ D.b = 5;\nD.fun(); }\n```\n(a) 5 2\n(b) 5 0\n\
  (c) 不可预测\n(d) 错误\n\n**答案: (a)** `this` 运算符是访问继承变量的另一种方式。\n\n### 7. 代码的输出是什么？(L3)\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\nclass base\n{ public:\nint\
  \ b; }S;\nclass dev : public base\n{ public:\nint b; }D;\nint main()\n{ D.b = 5;\n\
  D.((base *) this)->b = 2;\ncout<<b<<<<D.((base *) this)->b;\n```\n(a) 5 2\n(b) 5\
  \ 0\n(c) 不可预测\n(d) 错误\n\n**答案: (d)** `this` 运算符使用无效。\n\n### 8. 代码抛出了什么错误？(L4)\n\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\nclass base\n{ public:\nint b;\
  \ }S;\nclass dev : public base\n{ public:\nint b; }D;\nint main()\n{ D.b = 5;\n\
  D.((base *) this)->b = 2;\ncout<<b<<<<D.((base *) this)->b;}\n```\n(a) 在非成员函数中无效使用\
  \ `this`\n(b) 期望未限定标识符 `D.((base *) this)->b = 2;`\n(c) 在 `main()` 中无效使用 `this`\n\
  (d) `a` 和 `b`\n(e) `b` 和 `c`\n\n**答案: (e)** `this` 只能在成员函数内部使用。因此在类外部访问继承的变量应该使用\
  \ `base ::`。\n\n## 9. 代码的输出是什么？(L3)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\nclass base\n{ public:\nint b; }S;\nclass dev :: public base\n{ }D;\nint\
  \ main()\n{ D.b = 8;\ncout<<D.b;}\n```\n(a) 8\n(b) 0\n(c) 不可预测\n(d) 错误\n\n**答案:\
  \ (d)** `::` 不能用于继承。它用于类内部定义函数和静态变量。\n\n### 10. 代码抛出了什么错误？(L5)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\nclass base\n{ public:\nint b; }S;\nclass dev :: public base\n\
  { }D;\nint main()\n{ D.b = 8;\ncout<<D.b;}\n```\n(a) `public` 之前期望标识符\n(b) `dev`\
  \ 未声明\n(c) `public` 之前期望标识符\n(d) `a` 和 `b`\n(e) `a`, `b` 和 `c`\n\n**答案: (d)** 它包含关于未声明的\
  \ `D` 的错误。此外在 `public` 之前期望未限定标识符和普通标识符。\n\n### 11. 代码的输出是什么？(L3)\n\n```cpp\n#include<iostream>\n\
