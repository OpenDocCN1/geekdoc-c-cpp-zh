  \ }\n}D;\nint main()\n{ \n    D.fun(7); \n}\n```\n(a) 垃圾值\n(b) 错误\n(c) 不可预测\n(d)\
  \ 以上都不是\n\n**Answer: (d)** 它给出了 ‘0’。当这里的 `int` 函数没有显式返回值时，编译器自动返回 0。\n\n**133. 代码的输出结果是什么？(L5)**\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\nclass stud\n{ \npublic:\n  \
  \  blo *s;\n}D;\nclass blo\n{ \npublic:\n    int b;\n    void fun(int a)\n    {\
  \ cout<<((stud *)this)->s->b; }\n}S;\nint main()\n{ \n    S.b = 2;\n    S.fun();\
  \ \n}\n```\n(a) 2\n(b) 错误\n(c) 不可预测\n(d) 以上都不是\n\n**Answer: (b)** `blo` 只在 `stud`\
  \ 之后才定义。因此编译器不知道 `blo`。\n\n**134. 代码会抛出什么错误？(L5)**\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\nclass stud\n{ \npublic:\n    blo *s;\n}D;\nclass blo\n{\
  \ \npublic:\n    int b;\n    void fun(int a)\n    { cout<<((stud *)this)->s->b;\
  \ }\n}S;\nint main()\n{ \n    S.b = 2;\n    S.fun(); \n}\n```\n(a) 未知类型 `blo`\n\
  (b) `blo` 不是一个类型\n(c) 无效的指针类型 `blo`\n(d) 以上都不是\n\n**Answer: (b)** 预期一个类型。\n\n**135.\
  \ 代码的输出结果是什么？(L5)**\n```cpp\n#include<iostream>\n\nusing namespace std;\nclass blo\n\
  { \npublic:\n    int b;\n    void fun(int a)\n    { cout<<((stud *)this)->s->b;\
  \ }\n}S;\nclass stud\n{ \npublic:\n    blo *s;\n}D;\nint main()\n{ \n    S.b = 2;\n\
  \    S.fun(); \n}\n```\n(a) 2\n(b) 错误\n(c) 不可预测\n(d) 以上都不是\n\n**Answer: (b)** 这里使用\
  \ `stud` 导致了错误，因为它还没有定义。\n\n**136. 代码会抛出什么错误？(L5)**\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\nclass blo\n{ \npublic:\n    int b;\n    void fun(int a)\n\
  \    { cout<<((stud *)this)->s->b; }\n}B;\nclass stud\n{ \npublic:\n    blo *s;\n\
  }D;\nint main()\n{ \n    S.b = 2;\n    S.fun(); \n}\n```\n(a) `((stud *)this` 中\
  \ `this` 之前预期有 `)`\n(b) `((stud *)` 中 `)` 标记之前预期主表达式\n(c) `stud` 在此作用域未声明\n(d) 以上都不是\n\
  \n**Answer: (d)** 它抛出了前三种错误。这是因为编译器将 `stud` 视为一个未定义的变量而不是函数。\n\n**137. 代码的输出结果是什么？(L5)**\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\nclass stud;\nclass blo\n{ \n\
  public:\n    int b;\n    void fun(int a)\n    { cout<<((stud *)this)->s->b; }\n\
  }S;\nclass stud\n{ \npublic:\n    blo *s;\n}D;\nint main()\n{ \n    S.b = 2;\n \
  \   S.fun(); \n}\n```\n(a) 2\n(b) 错误\n(c) 不可预测\n(d) 以上都不是\n\n**Answer: (b)** 即使\
  \ `stud` 之前声明过，但它还没有定义。`blo` 在在定义之前无法访问 `stud` 的成员。\n\n**138. 代码会抛出什么错误？(L5)**\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\nclass stud;\nclass blo\n{ \n\
  public:\n    int b;\n    void fun(int a)\n    { cout<<((stud *)this)->s->b; }\n\
  }S;\nclass stud\n{ \npublic:\n    blo *s;\n}D;\nint main()\n{ \n    S.b = 2;\n \
  \   S.fun(); \n}\n```\n(a) 不法使用不完整类型 `class stud`\n(b) `class stud` 的向前声明\n(c) `a`\
  \ 和 `b`\n(d) 以上都不是\n\n**Answer: (c)** 实际上，向前声明没有错误，但由于错误在于已声明类的定义不完整，编译器在向前声明处抛出了错误。\n\
  \n\n\n\n\n(d) 以上都不是\n\n**答案: (d)** 即使现在仍会发生段错误（Segmentation fault）。初始化 `D.s = &S`\
  \ 是针对对象 `D` 的。因此当通用调用时，指针仍然被初始化。如果指针 `stud *s` 是 `static` 并在外部赋值为 `&D`，则可以工作。初始化语句将在\
  \ main 函数外写为 `blo* stud::s = &S`。\n\n# 3. 构造函数与析构函数\n\n本章将介绍类特殊函数的概念——构造函数和析构函数。在本章结束时，你将清晰构造函数和析构函数的各种用法以及优禁忌。\n\
  \n### 1. 代码的输出是什么？(L1)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class cons\n{ \npublic:\nint m;\ncons()\n{ m=9; }\n}S;\n\nint main()\n{ cout<< “S.m”;}\n\
  ```\n(a) 9\n(b) 0\n(c) 不可预测\n(d) 错误\n\n**答案: (a)** 函数 `cons()` 是称为 `constructor`\
  \ 的特殊函数。构造函数的名称与类名相同，且应该处于公共作用域。它没有返回类型。每当在任何作用域内创建类的对象时，它都会被调用。这是一个简单的构造函数。\n\n\
  ### 2. 代码会抛出什么错误？(L4)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class cons\n{ \ncons()\n{ m=9; }\npublic:\nint m;\n}S;\n\nint main()\n{ cout<< “S.m”;}\n\
  ```\n(a) 构造函数定义为‘private’\n(b) `cons::cons()` 是私有的\n(c) 私有中的无效构造函数\n(d) 无错误\n\n\
  **答案: (b)** 构造函数不能在私有作用域内。\n\n### 3. 代码会抛出什么错误？(L2)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \nprotected:\ncons()\n{ m=9; }\npublic:\n\
  int m;\n}S;\n\nint main()\n{ cout<< “S.m”;}\n```\n(a) 构造函数定义为‘protected’\n(b) `cons::cons()`\
  \ 是保护的\n(c) 保护中的无效构造函数\n(d) 无错误\n\n**答案: (b)** 构造函数必须在‘public’作用域内。\n\n### 4. 代码会抛出什么错误？(L2)\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass cons\n{ \nprotected:\n\
  cons()\n{ m=9; }\npublic:\ncons()\n{ m=9; }\nint m;\n}S;\n\nint main()\n{ cout<<\
  \ “S.m”;}\n```\n(a) `cons::cons()` 是保护的\n(b) `cons::cons()` 不能被重载\n(c) ‘a’和‘b’ 都是\n\
  (d) 以上都不是\n\n**答案: (c)** 重载将在后续章节中详细讨论。\n\n### 5. 代码的输出是什么？(L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\nint m;\nvoid cons()\n{ m=9; }\n\
  }S;\n\nint main()\n{ cout<< “S.m”;}\n```\n(a) 9\n(b) 0\n(c) 不可预测\n(d) 错误\n\n**答案:\
  \ (d)** 在这里函数 `fun()` 被视为普通的成员函数，因为它有返回类型。编译器发现它是一个带有返回类型的构造函数，并抛出“构造函数 `void cons`\
  \ 返回类型规格”。\n\n### 6. 代码的输出是什么？(L3)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass cons\n{ \npublic:\nint m;\ncons()\n{ m=9; }\ncons()\n{ m=11; }\n\
  }S;\n\nint main()\n{ cout<< “S.m”;}\n```\n(a) 9\n(b) 11\n(c) 不可预测\n(d) 错误\n\n**答案:\
  \ (d)** `cons::cons()` 不能被重载。\n\n### 7. 代码的输出是什么？(L4)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\nint m;\ncons();\n}S;\n\ncons::cons()\n\
  { m=11; }\n\nint main()\n{ cout<< “S.m”;}\n```\n(a) 0\n(b) 11\n(c) 不可预测\n(d) 错误\n\
  \n**答案: (b)** 允许这种构造函数的定义。\n\n### 8. 代码的输出是什么？(L4)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\nint m;\n}S;\n\ncons::cons()\n\
  { m=11; }\n\nint main()\n{ cout<< “S.m”;}\n```\n(a) 0\n(b) 11\n(c) 不可预测\n(d) 错误\n\
  \n**答案: (d)** 在上一个问题中有一个构造函数的声明。它只是告诉编译器构造函数将在稍后或外部定义。因此外部的定义会恰当映射到它上。这里删除了声明。因此外部构造函数的定义与预定义的构造函数发生冲突。\n\
  \n### 9. 代码会抛出什么错误？(L5)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class cons\n{ \npublic:\nint m;\n}S;\n\ncons::cons()\n{ m=11; }\n\nint main()\n\
  { cout<< “S.m”;}\n```\n(a) `cons::cons()` 不能被重载\n(b) 遇到隐式函数 `cons` 的定义\n(c) 隐式声明\
  \ `cons::cons()` 的定义\n(d) 以上都不是\n\n**答案: (c)** 这意味着编译器将 `cons()` 视为隐式函数，但它的定义是在外部指定的。\n\
  \n### 10. 代码的输出是什么？(L4)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class cons\n{ \npublic:\nint m;\ncons()\n{ cout<< “constructor”; }\n};\n\nint main()\n\
  { cons S;\nS.cons(); }\n```\n(a) constructor\n(b) constructor constructor\n(c) 不可预测\n\
  (d) 错误\n\n**答案: (d)** 构造函数不能被显式调用。\n\n\n\n\n\n(d) 以上都不是\n\n**答案: (d)** 在函数 `cons::cons()`\
  \ 中对 `init()` 有未定义的引用。\n\n### 19. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\n    int m;\n    void init();\n\
  \    cons()\n    { init(); }\n};\n\nvoid cons::init()\n{ cout<<\"class initiated\"\
  ; }\n\nint main()\n{ cons S; }\n```\n(a) 小写形式的类\n(b) 无输出\n(c) 不可预测\n(d) 以上都不是\n\n\
  **答案: (a)** 构造函数可以轻松地调用成员函数。\n\n---\n\n### 20. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\n    class sub\n    { \n     \
  \   void init()\n        { cout<<\"class initiated\"; }\n    } d;\n\n    int m;\n\
  \    cons()\n    { d.init(); }\n};\n\nint main()\n{ cons S; }\n```\n(a) class initiated\n\
  (b) 无输出\n(c) 不可预测\n(d) 错误\n\n**答案: (a)** 构造函数也可以调用局部类的成员函数。\n\n---\n\n### 21. 代码的输出是什么？\
  \ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass cons\n{ \n\
  public:\n    int m;\n    cons()\n    { cout<< “class initiated\";\n    cons(); }\n\
  };\n\nint main()\n{ cons S; }\n```\n(a) 持续打印‘class initiated’直到栈溢出\n(b) 打印一次‘class\
  \ initiated’\n(c) 什么都不打印\n(d) 错误\n\n**答案: (a)** 构造函数可以递归的。\n\n---\n\n### 22. 代码的输出是什么？\
  \ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass cons\n{ \n\
  public:\n    int m;\n    cons()\n    { cout<< “class initiated\"; }\n    void init()\n\
  \    { cons(); }\n};\n\nint main()\n{ cons S;\n    S.init(); }\n```\n(a) 打印两次‘class\
  \ initiated’\n(b) 打印一次‘class initiated’\n(c) 什么都不打印\n(d) 错误\n\n**答案: (a)** 构造函数可以从同一类的其他成员函数中调用。\n\
  \n---\n\n### 23. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons()\n    { cout<< “class initiated\"\
  ;\n    main(); }\n};\n\nint main()\n{ cons S; }\n```\n(a) 重复打印‘class initiated’直到栈溢出\n\
  (b) 打印一次‘class initiated’\n(c) 什么都不打印\n(d) 错误\n\n**答案: (d)** 构造函数不能调用作用域之外的函数。因此它不能调用\
  \ `main`。抛出“‘main’ 在此作用域内未声明”。\n\n---\n\n### 24. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons()\n    {\
  \ int d=8; }\n};\n\nint main()\n{ cons S;\n    cout<< S.d; }\n```\n(a) 8\n(b) 0\n\
  (c) 什么都不打印\n(d) 错误\n\n**答案: (d)** `d` 的作用域是构造函数。它在构造函数执行完毕后被删除。因此无法从对象访问它。\n\n---\n\
  \n### 25. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass cons\n{ \npublic:\n    int m;\n    cons()\n    { cout<< “basic constructor\"\
  ; }\n    cons(int d)\n    { cout<< “constructor with parameters\"; }\n};\n\nint\
  \ main()\n{ cons S(3); }\n```\n(a) 带参数的构造函数\n(b) 基础构造函数\n(c) 什么都不打印\n(d) 错误\n\n\
  **答案: (a)** 这是重载构造函数的形式。它接受带参数的对象。\n\n---\n\n### 26. 代码的输出是什么？ (L3)\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass cons\n{ \npublic:\n    int m;\n\
  \    cons(int d)\n    { cout<< “constructor with parameters\"; }\n};\n\nint main()\n\
  { cons S(3); }\n```\n(a) 带参数的构造函数\n(b) 什么都不打印\n(c) 不可预测\n(d) 错误\n\n**答案: (a)** 因为对象只需要一个带参数的构造函数，所以跳过基础构造函数没有影响。\n\
  \n---\n\n### 27. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons(int d)\n    { cout<< “constructor\
  \ with parameters\"; }\n};\n\nint main()\n{ cons S; }\n```\n(a) 带参数的构造函数\n(b) 什么都不打印\n\
  (c) 不可预测\n(d) 错误\n\n**答案: (d)** 在这里对象是一个基础对象。它会寻找基础构造函数。由于存在重载构造函数，它没有映射到隐式定义的构造函数。因此产生关于缺少构造函数的错误。\n\
  \n---\n\n### 28. 代码会抛出什么错误？ (L4)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons(int d)\n    { cout<< “constructor\
  \ with parameters\"; }\n};\n\nint main()\n{ cons S; }\n```\n(a) 没有匹配的函数调用 `cons()`\n\
  (b) 函数 `cons()` 需要 1 个参数但提供了 0 个\n(c) 没有匹配的构造函数调用 `cons()`\n(d) `a` 和 `b` \n(e)\
  \ `b` 和 `c`\n\n**答案: (a)** 选项 `b` 因为缺少更多而被抛出。\n\n---\n\n### 29. 代码的输出是什么？ (L3)\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass cons\n{ \npublic:\n\
  \    int m;\n    cons(int d)\n    { cout<< d<< \" \"; }\n    cons(float d)\n   \
  \ { cout<< d<< \" \"; }\n};\n\nint main()\n{ cons S(3.34);\n    cons S(3); }\n```\n\
  (a) 3.34\n(b) 3\n(c) 不可预测\n(d) 错误\n\n**答案: (d)** 值 `3.34` 被视为 double 并产生构造函数不匹配的错误。\n\
  \n---\n\n### 30. 代码会抛出什么错误？ (L5)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons(int d)\n    { cout<< d<<\
  \ \" \"; }\n    cons(float d)\n    { cout<< d<< \" \"; }\n};\n\nint main()\n{ cons\
  \ S(3.34);\n    cons S(3); }\n```\n(a) 没有匹配的函数调用 `cons(double)`\n(b) 调用 `cons(double)`\
  \ 是二义的\n(c) `a` 和 `b`\n(d) 以上都不是\n\n**答案: (b)** 编译器尝试将函数调用与两个定义进行匹配。但在两者之间选择是二义的。因此产生错误。问题是\
  \ `3.34` 是 double 而 float。\n\n---\n\n### 31. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons(int d)\n\
  \    { cout<< d<< \" \"; }\n    cons(double d)\n    { cout<< d<< \" \"; }\n};\n\n\
  int main()\n{ cons S(3.34);\n    cons S(3); }\n```\n(a) 3.34\n(b) 3\n(c) 不可预测\n\
  (d) 错误\n\n**答案: (a)** 现在是正确的。参数被相应的匹配并调用。\n\n---\n\n### 32. 代码的输出是什么？ (L3)\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass cons\n{ \npublic:\n    int m;\n\
  \    cons(int d)\n    { cout<< d<< \" \"; }\n};\n\nint main()\n{ cons S(3.34);\n\
  \    cons S(3); }\n```\n(a) 3.34\n(b) 3\n(c) 不可预测\n(d) 错误\n\n**答案: (b)** 因为只有一个构造函数定义，各种数据类型都会映射到它并发生类型转换。这里由于只有一个定义，所以不存在二义性。\n\
  \n---\n\n### 33. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons(int d)\n    { cout<< d<<\
  \ \" \"; }\n    cons(int f)\n    { cout<< f<< \" \"; }\n};\n\nint main()\n{ cons\
  \ S(3); }\n```\n(a) 3 3\n(b) 3\n(c) 不可预测\n(d) 错误\n\n**答案: (d)** 修改参数变量名不会改变这两个定义。在内部，两个定义被视为相同的，且\
  \ `cons::cons(int)` 不能被重载。\n\n---\n\n### 34. 代码的输出是什么？ (L3)\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass cons\n{ \npublic:\n    int m;\n    cons(int d)\n\
  \    { cout<< d<< \" \"; }\n    cons(void f)\n    { cout<<\"basic constructor\"\
  ; }\n};\n\nint main()\n{ cons S; }\n```\n(a) 基础构造函数\n(b) 无输出\n(c) 不可预测\n(d) 错误\n\
