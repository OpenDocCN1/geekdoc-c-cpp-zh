  \n## 4\n\n## 存储类\n\n变量的存储特性可以在声明时通过指定存储类来改变。本章将阐明各种存储类用法和属性的细节。\n\n## 1. 代码的输出是什么？(L3)\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid fun()\n{ auto int m=9;\n\
  cout<< m; }\n\nint main()\n{ \nfun();}\n}\n```\n\n(a) 9\n(b) 0\n(c) 不可预测\n(d) 错误\n\
  \n**答案: (a)** `auto` 是一个存储类。这意味着变量在定义的块完成后会被自动删除。所有变量默认都是 `auto` 的。\n\n## 2. 代码会抛出什么错误？(L4)\n\
