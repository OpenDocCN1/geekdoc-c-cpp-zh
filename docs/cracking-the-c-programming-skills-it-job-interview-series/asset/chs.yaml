  (a) 4\n(b) 0\n(c) Unpredictable\n(d) 以上均不是\n\n**Answer: (a)** 成员在变量创建时需要分配内存。\n\n\
  ### 8. 代码的输出是什么？ (L2)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
