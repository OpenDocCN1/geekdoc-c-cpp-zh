  void echo(char* z) {\ncout << “Output: “ << z << endl;\n}\n};\n\nint main(void)\n\
  {\nfunction_echo foo;\nfoo.echo(76);\nfoo.echo(78.099);\nfoo.echo(“Hello, Polymorphism”);\n\
  return 0;\n}\n```\n\n(a) 运算符重载\n(b) 函数重载\n(c) 函数重写\n(d) 以上都不是\n\n**答案: (b)** 代码中使用了函数重载。函数名\
