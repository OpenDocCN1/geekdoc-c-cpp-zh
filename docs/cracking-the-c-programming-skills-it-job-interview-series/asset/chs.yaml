- "# 掌握 C++ 编程技巧：IT 面试系列\n\n\n\n![](img/cover.jpeg)\n\n\n\n**Shriram K Vasudevan 博士**\n\
  *教授（选拔级）*\n*计算机科学与工程系*\n*Amrita 工程学院，Amrita 大学*\n*印度泰米尔纳德邦，哥尔巴特*\n\n**Sundaram RMD**\n\
  软件架构师\nWipro Technologies\n印度班加罗尔\n\n**Abhishek S Nagarajan**\n计算机科学与工程系\nAmrita\
  \ 工程学院，Amrita 大学\n*印度泰米尔纳德邦，哥尔巴特*\n\n**Subashri V**\n高级开发人员\n某跨国公司，哥尔巴特\n\n![](img/00001.jpeg)\n\
  \n\n## 前言\n\n### 你正处于十字路口吗？\n\n你是否厌倦了参加 IT 面试却没有获得 Offer？你是否在准备不同的竞争性考试之间感到困惑？你是否对计算机市场的激烈竞争感到目晕眼花？你是否对编程世界的未来感到迷茫？你是否渴望一份更好的软件工作，但不知道那是什么，或者该如何获得？\n\
  \n如果你对上述任何一个问题都感到困扰，那么你可能已经做出了正确的决定——购买这本书并为技术面试做准备！我建议按顺序从第一章到最后阅读内容，不要尝试跳过任何章节或部分，除非你对想要跳过的主题非常有信心。这是因为本书专为指导你应对\
  \ C++ 编程语言的技术面试而设计。本书编写具有明确的目的。请务必读完前言以了解原因。读完前言后，你可能会调整你的准备策略。\n\n### IT 行业格局\n\
  \n如果你看到 IT 和 ITeS 领域存在大量的就业机会且正在不断增长，你应该宽心。目前的情况是：印度 IT-BPM 行业的顶级行业协会 NASSCOM 发布了一份新闻稿，称印度\
  \ IT-BPM 部门仍然该国最大的雇主之一——直接雇佣了近 350 万专业人士，新增了超过 23 万名员工。他们还预测未来前景光良好，因为 IT-BPM 行业正很好地应对下一阶段的挑战。数字化、颠覆性技术和创新将在未来几年内推动增长并带来新机会。他们还预计印度\
  \ IT 行业到 2020 年将增长到约 3000 亿美元，并创建不同的垂直领域，专注于国内 IT 市场、软件产品和电子商务等特定领域，这告诉我们 IT 领域现在有未来也将更多工作机会。\n\
  \n### 招聘者的视角\n\n作为一名潜在的求职者，如果你理解招聘者在看什么，你的成功几率将倍增。根据一项新的职业建设者调查，绝大多数 IT 公司表示，积极的态度等软技能与硬技能同样重要。当你对自己的知识充满自信时，积极性源自内心。雇主寻求的候选人前\
  \ 10 个特质包括：勤奋、可靠、积极、自我激励、团队导向、有组织性、压力下工作良好、有效沟通、灵活和自信。如果所有这些点可以归结为一点，那就是领域专业知识，它将帮助你获得其他所有东西。\n\
  \n### 技术面试流程\n\n招聘是指为组织吸引、选择和任命合适候选人担任工作的过程。从组织的角度来看，这包括工作分析、招聘、筛选和最后的选择。虽然每家公司选择候选人的方式各异，但每家公司都致力于为“正确”的工作找到“正确”的人。\n\
  \n在技术面试中，申请人可能会被问及问题：\n\n*   与公司技术活动所需的特定技能集相关；\n*   与解决复杂问题的学科基础知识相关；\n*   对于新手来说，将与作为学位课程一部分完成的项目有关；以及\n\
  *   要求候选人解决他们在被聘用后可能会遇到的实际技术问题。\n\n美国商业杂志《福布斯》（Forbes）的一篇文章讨论了技术面试环节后的四个极其常见的面试问题，包括“介绍一下你自己”、“你最大的优势是什么”、“我们为什么要雇用你”以及“你对我们有什么要问的吗”。虽然这些是常见常见的问题，但给出出乎意料且相关的答案会让面试官迅速集中注意力并倾听你的叙述。\n\
  \n### 你的个人 SWOT 分析\n\n既然你已经知道梦想工作正在向你召唤（你的机会），而你只需要超过 X 个竞争对手（你的威胁），并且了解了招聘者在面试时会看什么，请确保列出你的优势领域，更重要的是劣势领域。虽然你对机会和威胁的控制有限，但你可以全身投入将你的优势推向新的高度，并改进你的劣势。使用下方提供的\
  \ SWOT 网格来规划你的准备。\n\n![](img/00002.jpeg)\n\n### 为什么选择 C++？\n\n据观察，所有技术面试中 X% 的核心都是\
  \ C++ 编程语言。C++ 编程可用于网络相关、操作系统相关、嵌入式系统相关等任务。它用于开发计算机应用程序、嵌入式软件网络驱动程序、数据库、模拟器等。此外，人们认为如果你在\
  \ C++ 这样的编程语言上很扎实，你可以很容易地接受多种基于面向对象的不同语言的培训。特定技术的知识以及经验和方法论知识更为重要。持续练习 C++ 客观题将帮助你达到那种状态。\n\
  \n### 为什么买这本书？\n\n正如我在前言中所提到的，本书专为设计以帮助你进行细致且客观的准备。\n\n内容是从我们的经验和专业知识中精心挑选的，这些知识源于直接见证招聘过程、在我们的学院指导学生、与担任学校招聘组织者的同仁进行无数讨论，以及对社交媒体、博客和专业网站上相关话题讨论的数小时研究，因此，本书高度聚焦于\
  \ C++ 语言的面试准备，几乎不涉及其他内容。我们得出结论，对于有效的准备，一切归结为围绕编码问题的多选题，以及经常被问的技术、概念性问题。任何希望提高 C++\
  \ 编程语言技能或准备能力测试、竞争性考试的人都应该读读这本书，它将帮助他们实现目标。\n\n\n\n\n\n我们结合了自己的技术专长开发了多项选择题，帮助你加强薄弱环节。为此，我们认为最好的方法是将问题按难度等级（LODs）进行分级。问题的复杂度随着技术挑战的增加从\
  \ `L1` 到 `L5` 递增。`L1` 具有最低复杂度，用于测试语法等基础知识；而 `L5` 则将通过概念测试你对逻辑和代码的深度理解。每个章节的复杂度分布均匀，并重点关注了所有难度的级别。\n\
  \n1. `L1`: 测试语言的基础语法知识。\n2. `L2`: 在 `L2` 题中对读者对语言的理解进行第一级测试。在掌握了基础知识后，就可以尝试 `L2`。\n\
  3. `L3`: 题目旨在测试读者的逻辑视角。\n4. `L4`: 它主要指出错误发生点以及具体的错误语句及其原因。\n5. `L5`: 在此级别增加了一些刁钻的问题来测试你的理解能力。\n\
  \n## 本书关于什么？\n\nC++ 编程题和答案有着明确目的，旨在帮助准备多项认证考试和工作面试的学生及专家。本书提供了一份实用的面试示例题、多选择题及其答案，并附有适当解释。让我们从前言部分开始！这些\
  \ C++ 编程面试题和答案旨在让你熟悉在 C++ 编程面试和笔试中可能遇到的问题类型。\n\n本书的编写考虑了这两类读者：一类人是 C++ 初学者，希望通过客观题学习其基础知识；另一类人是想要精通面试技巧的人士。我们希望你能从中找到需要的内容。`LOD`（难度等级）将使读者能够循序渐地测试自己的理解能力。\n\
  \n本书反映了面试日益复杂的趋势，我们包含了当今顶尖公司讨论的最新话题和问题，同时继续保持对准备考试的学生和面试者的基础问题解决能力的重视。我们通过消除冗余的词汇、材料和过时的模型，提供详细描述、减少列表并使用**粗体字**来强调重要术语，使本出版物对学生更加友好。\n\
  \n## 本书涵盖范围\n\nC++ 被认为是 C 语言的增强。第 1 章完全关注 C 和 C++ 之间的区别。它涉及了语言特征的重大变化。\n\n面向对象编程完全依赖于\
  \ `classes`。第 2 章深入了 `classes` 的每一个角落。它阐明了各种类型的类、内部结构及其用法。本章还详细解释了 OOP 的核心概念——“封装”（ENCAPSULATION）。这将让你在\
  \ OOP 的适当使用上变得强大。\n\n对象或实例是具有特定属性的 `classes`。每当创建一个对象时，属于该对象的类成员都将被初始化。此外，当对象的作用域结束时，它将被清除并释放内存。分配和释放对象内存的内部任务是由构造函数和析构函数完成的。第\
  \ 3 章讨论了构造函数和析构函数的作用及其威力，详细讨论了各种形式和用法模式。\n\nC++ 有一个改变变量存储属性的特殊特性。这是通过存储类实现的。第 4\
  \ 章向你介绍了各种存储类及其用法。它还解释了在类成员中使用存储类的可能性，从而教你将存储类与 OOP 起来。\n\n一个优秀的程序员必须始终关注资源的使用。专业人士主要应关注程序使用的内存量。不应该有未使用的内存日志。因此，使用了动态内存分配（`DMA`）。它有助于动态地分配、重新分配和释放内存。第\
  \ 5 章阐述了 `DMA` 在编程中的用法，从而提升了你的专业技能。\n\n继承是一个重要且非常强大的 OOP 特性。它从基类向派生类获取特征。它强大主要是是因为其重用代码的能力。第\
  \ 6 章描述了它们的用法和继承的各种可能性。\n\n多态是 OOP 的另一个重要概念。它为属性或功能提供了多种形式。运算符重载是给现有运算符添加新功能。第 7\
  \ 章展示了运算符重载的全景，筛选了它的力量和能力。\n\n给同一个函数给出多个定义增加了功能性。这就是函数重载。同样，如果新定义在继承的类中，就是函数重写。这两个概念将有助于增加代码的实用性，使其更加专业。第\
  \ 8 章深入探讨了函数重载和重写的概念。\n\n类的私有成员只能通过它的友类和友元函数访问。第 9 章带你进入友类和友元函数的主题，从而增强了你解决相关问题的理解。\n\
  \n在多用户场景中，歧义是非常常见的。程序员经常遇到内存冲突，导致程序效率低下。`Namespace`（命名空间）是 C++ 中的一个极佳特性，它可以避免这种歧义并提高程序效率。第\
  \ 10 章是对命名空间的独特介绍，人们可以在此理解可以可以使用命名空间的场景。\n\nC++ 的另一个有趣且用户友好的特性是模板（templates）。简而言之，它是一个独立于数据类型的程序。第\
  \ 11 章带你领略模板的使用，并让你使用 C++ 中提供的最佳特性。\n\n错误始终是编程中的背景。它挑战程序员继续执行。一种处理和绕过错误以进行后续编译的方法是异常处理（Exception\
  \ Handling）。它有助于使代码更加健壮。第 12 章通过让你处理任何类型的异常，提升了你的专业技能。\n\n编码技术可以应用于文件中的外部数据。此外，可以使用外部文件跟踪输出。第\
  \ 13 章引入了文件使用，帮助你利用该特性来增加代码的健壮性。\n\n宏（Macros）是定义的表达式，增加了代码的可读性。第 14 章筛选了宏所执行的魔力，并启发你在代码中使用它。\n\
  \n作为面试过程的一部分，提问涉及 OOP 的概念和理论，以及 C++ 的代码。第 15 章旨在让你在书中解释的所有概念上变得强大。\n\n## 章节题目划分\n\
  \n| 章节 | 细节 | 题目数量 |\n| :--- | :--- | :--- |\n| 1 | C vs C++ | 55 |\n| 2 | 类 | 140\
  \ |\n| 3 | 构造函数与析构函数 | 60 |\n| 4 | 存储类 | 80 |\n| 5 | 动态内存分配 | 30 |\n| 6 | 继承 | 110\
  \ |\n| 7 | 运算符重载 | 40 |\n| 8 | 函数重载与重写 | 87 |\n| 9 | 友类与友元函数 | 14 |\n| 10 | 命名空间\
  \ | 11 |\n| 11 | 模板 | 13 |\n| 12 | 异常处理 | 40 |\n| 13 | 文件 | 35 |\n| 14 | 宏与包含指令\
  \ | 31 |\n| 15 | 概念理论 | 161 |\n| **总计** | | **907** |\n\n## C 语言的成功故事\n\n有很多编程语言可用，从极高层语言到汇编语言的底层能力，中间还有许多专门的选项。C\
  \ 语言在其中脱颖而出。而 C++ 则在 C 语言之上。这主要是因为 OOP 的能力。\n\n\n\n\n\n`C++` 编程语言拥有许多优点，同时也包含了 `C`\
  \ 语言的大部分优点。首先，`C++` 已经二十多年的历史，互联网上有大量的源代码可用，这提供了大量的学习和使用信息。它是一种非常好的语言，能够以大多数人都能理解的方式表达想法，并且可以与真实世界的环境进行比较。此外，除了面向对象（OOP）之外，`namespace`\
  \ 和 `templates` 等特殊特性使得程序更加健壮，从而使该语言受到目标群青睐。\n\n### 本书的其他优势\n\n尽管市场上有很多关于 `C++`\
  \ 编程语言的书籍，但它们大多数本质上是理论性的或编程示例。并没有多少书籍包含一系列可以用于建立编程技能的 `C++` 练习。许多人理解基础、语法和语义，但只有实题类的书籍才能帮助磨练技能。\n\
  \n令人沮丧的是，市售的书中没有哪一本书能够充分涵盖 `C++` 编程语言中的所有不同主题，并包含如此可能的客观题。我们很高兴这本书涵盖了程序员成功的各个方面，能够帮助其在面试中表现，并学习编程的细微差别。不仅是编程，还涵盖了所有的技术领域。\n\
  \n### 谁还会发现这本书有用？\n\n除了技术面试准备之外，这本书还可以被`开发者`、`软件工程师`以及 `GATE`、`IES` 等其他竞争性考试的考生有效利用。\n\
  \n一名优秀的软件工程师应该在以下语言上具有基础的编码和解决问题的熟练度——即能够理解代码并编写一些非平凡的内容：\n\n*   `C++`：为了良好熟悉系统编程以及整个软件栈如何工作原理。\n\
  *   面向对象和通用编程特性，同时提供低级内存操作的设施。\n\n现代程序员被要求精通 `C++` 编程语言，并且在以下领域最受欢迎：\n\n*   消费类电子产品和嵌入式系统行业需要用\
  \ `C++` 实现的程序，包括内核代码、设备驱动或其他低级编程。\n*   即使是开发应用程序的公司，也需要某些部分用 `C++` 实现以达到优化和性能提高。\n\
  *   固件代码使用 `C++` 编写各种电子、工业和通信产品，这些产品使用微控制器作为 `CPU`。\n*   在开发各种应用程序的验证和确认软件、模拟器、测试代码等的公司中也需要它。\n\
  *   由于它产生的代码运行速度与汇编代码一样，因此最受开发操作系统、网络驱动程序、文本编辑器、数据库和工具程序的公司的青睐。\n\n如果你在计算机科学和信息技术领域，毕业后的竞争性考试也需要\
  \ `C++` 编程。这包括但不限于：\n\n*   `GATE`：为了获得良好的排名，你必须按照每年规定的练习整个大纲，`C++` 编程和解决问题的技能在其中占比更高。\n\
  *   `IES` – 印度工程服务也包含涵盖 `C++` 基础的 `C` 语言问题；\n*   现在各种公共事业企业如：`IOCL`、`NTPC`、`CONCOR`、`GAIL`、`BPCL`、`HP`、`CL`、`BHEL`、`PGCIL`、`BEL`、`DDA`\
  \ 等在招聘时考虑 `GATE SCORE`。他们也会进行自己的笔试，包含 `C++` 编程问题。\n*   如果你在信息技术领域，许多在国内外进行的其他竞争性考试也会测试基础编程技能。\n\
  \n话此而已，我们结束了。祝你的职业生涯一切顺利！祝你有快乐的学习体验！\n\nDr Shriram K Vasudevan\nSundaram RMD\nAbhishek\
