  \nint main() {\n  std::cout<<a;\n  return 0;\n}\n```\n\n(a) 错误\n(b) Float\n(c) 不可预测\n\
  (d) 10000\n\n**答案: (d)** 10000。`##` 是标记合并运算符。该运算符会合并它两边的参数。`Floa##t` 会将 `floa` 和\
  \ `t` 合并为 `float`。因此，`type a=10000` 类似于 `float a=10000`。因此，它没有产生错误。\n\n## 25. 回是或否。同一个预处理器指令中多个标记合并运算符的执行顺序是未定义的。(L1)\n\
