  \ 异常处理 (Exception Handling)\n\n错误和 Bug 始终是专业程序员的负担。异常处理是在编程时处理各种错误并跳过它们的智能方法。本章将向你介绍异常处理的艺术，并增加你的调试技能。\n\
  \n### 1. 下面类是 C++ 程序中可能发生的任何异常的父类？(L1)\n\n(a) `Std::ParentException`\n(b) `Std::Exception`\n\
  (c) `Std::bad_Exception`\n(d) `Std::invalid_argument`\n\n**答案：(b)** `Std::Exception`\
  \ 是 C++ 中存在的所有异常类的父类。\n\n### 2. 说“是”或“否”：可以在 C++ 中定义自定义异常吗？(L1)\n\n(a) 可以\n(b) 不可以\n\
  \n**答案：(a)** 是的。我们可以通过继承 `Exception` 类来定义自定义异常。\n\n### 3. 给定 val1=10, val2=20，预测下面代码段的输出。(L2)\n\
  \n```cpp\n#include <iostream>\n#include <exception>\nusing namespace std;\n\nstruct\
  \ UserDefinedException : public exception\n{\n\nconst char * what () const throw\
  \ ()\n{\nreturn “Value 2 cannot be greater than value 1”;\n}\n};\n\nint main()\n\
  {\n\nint val1,val2;\nstd::cout<<”Please enter value1”;\nstd::cin>>val1;\nstd::cout<<”Please\
  \ enter value2”;\nstd::cin>>val2;\n\ntry\n{\nif(val2>val1)\nthrow UserDefinedException();\n\
  else\nstd::cout<<val1/val2;\n}\ncatch(UserDefinedException& e)\n{\nstd::cout <<\
  \ e.what() << std::endl;\n}\n\n}\n```\n\n(a) 无输出\n(b) Value 2 cannot be greater\
  \ than value 1\n(c) 0\n(d) 编译错误\n\n\n\n\n\n**答案: (b)** `Value2` 不能大于 `value1`。`try`\
  \ 块比较了 `value1` 和 `value2`。当 `value2` 大于 `value1` 时，我们抛出了用户自定义异常。当我们调用用户自定义异常类中的\
  \ `What()` 方法时，它会打印输出语句：`Value2` 不能大于 `value1`。\n\n### 4. 是或否：我们可以为一个 `try` 块附加多个\
  \ `catch` 块吗？(L1)\n\n(a) 是\n(b) 否\n\n**答案: (a)** 是。我们可以在程序中捕获多种类型的异常。为此，我们可以附加多个\
  \ `catch` 块，每个块捕获一种类型的异常。\n\n### 5. 当我们使用 `new` 关键字分配内存时会发生哪种异常？(L2)\n\n(a) `Std::bad_cast`\n\
  (b) `Std::length_error`\n(c) `Std::out_of_range`\n(d) `Std::bad_alloc`\n\n**答案:\
  \ (d)** `Std::bad_alloc`\n\n### 6. 预测以下程序的输出，假设数组大小为 10 且索引位置为 11。(L2)\n\n```cpp\n\
  #include <iostream>\n#include <stdexcept>\n\nusing namespace std;\n\nint main()\n\
  {\nint i,index,value;\nstd::cout<<”enter array size”;\nstd::cin>>i;\nint array[i];\n\
  try\n{\nstd::cout<<”enter the array index position”;\nstd::cin>>index;\nif(index<i)\n\
  {\ncout<<”enter value”;\ncin>>value;\narray[index]=value;\ncout<<array[index];\n\
  }\nelse\nthrow std::out_of_range(“Range Overflow”);\n}\ncatch(std::out_of_range&\
  \ e)\n{\nstd::cout<<e.what();\n}\nreturn 0;\n}\n```\n(a) – 1\n(b) Range overflow\n\
  (c) 编译时错误\n(d) 以上都不是\n\n**答案: (b)** Range overflow\n\n### 7. 当我们没有在以下程序中包含头文件 `<stdexcept>`\
  \ 时会发生什么？(L2)\n\n```cpp\n#include <iostream>\n#include <stdexcept>\n\nusing namespace\
  \ std;\n\nint main()\n{\nint i,index,value;\nstd::cout<<”enter array size”;\nstd::cin>>i;\n\
  int array[i];\ntry\n{\nstd::cout<<”enter the array index position”;\nstd::cin>>index;\n\
  if(index<i)\n{\ncout<<”enter value”;\ncin>>value;\narray[index]=value;\n}\nelse\n\
  throw std::range_error(“Range Overflow”);\n}\ncatch(std::range_error& e)\n{\nstd::cout<<e.what();\n\
  }\nreturn 0;\n}\n```\n(a) 抛出编译时错误 - ‘range_error’不是 ‘std’的成员\n(b) 打印 Range Overflow\n\
  (c) 打印 `array[index]` 的值\n(d) 以上都不是\n\n**答案: (a)** 为了使用异常类，必须包含头文件 `stdexcept`。\n\
  \n### 8. `catch` 块中使用以下哪个符号可以使 `catch` 块捕获任何类型的异常？\n\n(a) ::\n(b) ??\n(c) …\n(d)\
  \ **\n\n**答案: (c)** `catch` 块中使用省略号符号 `…` 来使其捕获任何类型的异常。\n\n### 9. 以下哪种异常类型没有派自 `logic_error`\
  \ 类？(L2)\n\n(a) `Invalid_argument`\n(b) `Domain_error`\n(c) `Out_of_range`\n(d)\
  \ `Range_error`\n\n**答案: (d)** `range_error`。它派自 `runtime_error` 类。\n\n### 10. 预测以下代码的错误。(L3)\n\
  \n```cpp\n#include <iostream>\n#include <typeinfo>\nstruct Chocolate { virtual ~Chocolate()\
  \ { } };\nstruct Biscuits { virtual ~Biscuits() { } };\nint main()\n{\nChocolate\
  \ c;\ntry {\nBiscuits& b = dynamic_cast<Biscuits&>(c);\n} catch(const std::bad_cast&\
  \ e)\n{\nstd::cout << e.what();\n}\n}\n```\n(a) 它抛出一个编译时错误\n(b) 它在没有任何异常的情况下执行\n\
  (c) 它产生 `std::bad_cast` 异常并打印消息 `std::bad_cast`\n(d) 以上都不是\n\n**答案: (c)** 它产生 `bad_Cast`\
  \ 异常，因为我们正尝试将 `Chocolate` 类实例动态类型转换为 `Biscuits` 类实例。\n\n### 11. 预测以下代码的输出，假设 `a=100`\
  \ 且 `b=100` (L2)\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass TestException\n\
  {\nint a, b;\npublic:\nTestException(int a, int b)\n{\nthis->a = a;\nthis->b = b;\n\
  }\nint divide()\n{\nstd::cout<<”a=”<<a<<”\\n”<<”b=”<<b<<”\\n”<<”a/b=”<<a/b<<”\\\
  n”;\nreturn a/b;\n}\nint main (void)\n{\ntry\n{\nint a,b;\ncout<<”Enter a = “;\n\
  cin>>a;\ncout<<”Enter b = “;\ncin>>b;\nTestException obj(a,b);\ncout<<”Trying to\
  \ divide”<<\\n”;\nint quotient = obj.divide();\nif(quotient==-1)\nthrow quotient;\n\
  else\ncout<<quotient<<quotient;\n}\ncatch(int quotient)\n{\ncout<<”caught exception”<<quotient;\n\
  }\n};\n```\n(a) Trying to divide a=100 b=100 a/b=1 quotient=1\n(b) Trying to divide\
  \ a=100 b=100 a/b=-1 caught exception\n(c) Trying to divide a=100 b=100 a/b caught\
  \ exception\n(d) 以上都不是\n\n**答案: (a)**\n\n### 12. 给定 `a=100`, `b=100`，预测以下代码的输出。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main (void)\n{\ntry\n{\n\
  int a,b;\ncout<<”Enter a = “;\ncin>>a;\ncout<<”Enter b = “;\ncin>>b;\ncout<<”Trying\
  \ to divide”<<\\n”;\nint quotient = a/b;\nif(quotient==-1)\nthrow quotient;\nelse\n\
  cout<<quotient<<quotient;\n}\ncatch(int quotient)\n{\ncout<<”after catch”<<quotient;\n\
  }\n};\n```\n(a) Trying to divide throw after catch\n(b) Trying to divide after catch\n\
  (c) after catch\n(d) after throw catch\n\n**答案: (a)** `catch` 之后的语句不会执行，它们是不可达代码。\n\
  \n### 13. 预测以下代码片段的输出。(L3)\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  class Parent {\npublic:\nParent()\n{\nstd::cout<<”Parent Constructor”<<endl;\n}\n\
  };\nclass Child: public Parent {\npublic:\nChild()\n{\nstd::cout<<”Child Constructor”<<endl;\n\
  }\n};\nint main()\n{\nChild c;\ntry {\nthrow c;\n}\ncatch(Child c) {\ncout<<”Caught\
  \ Child Exception”<<endl;\n}\ncatch(Parent p) {\ncout<<”Caught Parent Exception”<<endl;\n\
  }\nreturn 0;\n}\n```\n(a) Child Constructor Parent Constructor Caught Exception\n\
  (b) Parent Constructor Child Constructor Caught Exception\n(c) Child Constructor\
  \ Parent Constructor Caught Parent Exception\n(d) Parent Constructor Child Constructor\
  \ Caught Exception\n\n**答案: (d)**\n\n### 14. 预测以下代码的输出。(L3)\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nvoid MyFunction()\n{\ntry\n{\nthrow 1;\n}\n\
  catch (int arg)\n{\ncout << “int exception\\n”;\nthrow;\n}\ncatch (char arg)\n{\n\
  cout << “char exception!\\n”;\n}\ncatch (...)\n{\ncout << “generic exception!\\\
  n”;\n}\ncout << “After Exception”;\n}\nint main()\n{\ntry\n{\nMyFunction();\n}\n\
  catch(...)\n{\nstd::cout<<”Caught Rethrown Exception”;\n}\n}\n```\n(a) int exception\
  \ Caught Rethrown Exception After Exception\n(b) int exception Caught Rethrown Exception\n\
  (c) int exception After exception\n(d) generic exception caught Rethrown Exception\n\
  \n**答案: (b)** 在 `int` 类型的 `catch` 中有一个 `throw`。这使得在返回块中抛出异常，导致打印 `Caught Rethrown\
  \ Exception`。\n\n### 15. 预测以下代码的输出。(L3)\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nvoid MyFunction()\n{\ntry\n{\nthrow 1;\n}\ncatch (...)\n{\ncout << “generic\
  \ exception!\\n”;\n}\ncatch (int arg)\n{\ncout << “int exception\\n”;\nthrow;\n\
  }\ncatch (char arg)\n{\ncout << “char exception!\\n”;\n}\ncout << “After Exception”;\n\
  }\nint main()\n{\ntry\n{\nMyFunction();\n}\ncatch(...)\n{\nstd::cout<<”Caught Rethrown\
  \ Exception”;\n}\n}\n```\n(a) 编译失败，因为带有省略号的 catch 块应该是其他 catch 块中的最后一个\n(b) generic\
  \ exception Caught Rethrown Exception\n(c) int exception Caught Rethrown Exception\n\
  (d) 以上都不是\n\n**答案: (a)**\n\n### 16. 预测以下代码片段的输出。(L2)\n\n```cpp\n#include <iostream>\n\
