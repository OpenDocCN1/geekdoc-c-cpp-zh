  **答案: (a)** 是。我们可以从文件名数组中创建 `fstream`/`ifstream` 对象。\n\n# 14\n\n## 宏与包含指令\n\n宏是用户定义的替换符。它通过预处理器完成。本章将介绍宏在编码中的用法以及预处理器指令的使用。\n\
  \n**1.** 下列字符中，只有哪个允许出现在预处理器指令之前？(L1)\n\n(a) `;`\n(b) `:`\n(c) `?`\n(d) `<whitespace>`\n\
  \n**答案: (d)** `<whitespace>`。预处理器指令之前不允许出现任何其他字符。如果存在，将导致编译错误。\n\n**2.** 选择关于预处理器指令的正确定义。(L1)\n\
  \n(a) 这些指令旨在向编译器发出指令，在编译期间预处理信息。\n(b) 这些指令旨在向编译器发出指令，在编译之前预处理信息。\n(c) 这些指令旨在向编译器发出指令，在编译之后预处理信息。\n\
  (d) 以上都不是。\n\n**答案: (b)**\n\n**3.** 判断对错。预处理器指令是 C++ 语句。(L1)\n\n(a) 正确\n(b) 错误\n\
  \n**答案: (b)** 错误。它们不是语句；因此，它们不以分号结尾。\n\n**4.** 宏只能使用预处理器指令 `#define` 定义——正确或错误。\n\
  \n**答案:** 正确。\n\n**5.** 宏预计只会被写成大写字母，例如 `#define PI 3.14`——正确或错误。\n\n**答案:** 正确。但不是强制的。将所有宏写为大写是一种良好的编码实践。\n\
  \n**6.** 宏不能嵌套另一个宏中——正确或错误。\n\n**答案:** 错误。可以将一个宏嵌套在另一个宏中。\n\n**7.** 预测以下代码的输出。\n\
  \n```cpp#include <iostream.h>\n\nusing namespace std;\n\n#define PI 3.14\n\n#define\
  \ RADIUS 10\n\nint main ()\n\n{\n\ncout << “the area of square is”<< PI*RADIUS*RADIUS;\n\
  \nreturn 0;\n\n}\n```\n\n(a) 3.14\n(b) 10 (c) 31.4\n(d) 314\n\n**答案: (d)** 314。输出语句在编译之前将被替换为：`3.14*10*10`。因此，它产生了结果\
  \ 314。\n\n**8.** 预测以下代码的输出。\n\n```cpp\n#include <stdio.h> \n\n#define SQ(p) p*p\
