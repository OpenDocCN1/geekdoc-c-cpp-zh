  \ = {1};\n\ncout << “\\n” << a[1];\n\ngetchar ();\n\nreturn 0;\n\n}\n```\n\n(a)\
  \ 垃圾值 (Garbage)\n(b) 1\n(c) 0\n(d) 以上都不是\n\n**答案：(c)** 如果数组中的一个组件被初始化，其余部分将自动初始化为\
  \ `0`。这被称为自动数组。\n\n# 5\n## 动态内存分配\n\n代码中非常重要且复杂的技巧之一是内存分配。优秀的程序员应该对资源保持敏锐，特别是内存。动态内存分配允许我们轻松地管理内存并保持代码的健壮。本章详细阐述了\
  \ `DMA` 的术语和技术。\n\n**1.** 下面代码段的输出是什么？(L2)\n\n```cpp\n#include <iostream>\n\nusing\
  \ namespace std;\n\nint main ()\n\n{\n\nint *pointer;\n\npointer = new int;\n\n\
  cout <<”return value” <<pointer;\n\nreturn 0;\n\n}\n```\n\n(a) 无输出\n(b) 如果分配了内存，将打印一个地址\n\
  (c) 编译故障\n(d) 0\n\n**答案：(b)** 是正确的。如果有足够的内存，它将为整数分配内存并返回一个地址。\n\n**2.** 假设内存分配从\
  \ 1000 开始，下面代码的输出是什么？（假设你正在使用 Dev C++ 或 G++）(L2)\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nint main ()\n\n{\n\nint *pointer;\n\npointer = new int\
  \ [2];\n\ncout <<”return value” <<pointer+1;\n\nreturn 0;\n\n}\n```\n\n(a) 垃圾值 (Garbage)\n\
  (b) 1\n(c) 0\n(d) 以上都不是\n\n**答案：(c)** 如果数组中的一个组件被初始化，其余部分将自动初始化为 `0`。这被称为自动数组。\n\
  \n**3.** 关于内存分配，以下正确的是？(L2)\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \nint main ()\n\n{\n\nint *pointer;\n\npointer = new int;\n\ncout <<”return value”\
  \ <<pointer;\n\nreturn 0;\n\n}\n```\n\n(a) 无输出\n(b) 如果分配了内存，将打印一个地址\n(c) 编译故障\n\
  (d) 0\n\n**答案：(b)** 如果存储中有足够的内存，它将为整数分配内存并返回一个地址。\n\n\n\n\n\n(d) 将发出警告。\n\n**答案:\
  \ (c)** 运行时错误（Run time error）。这甚至可能导致代码损坏。因此最好不要这样做。\n\n### 11. 下面代码的输出是什么？(L4)\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n    int\
  \ *pointer;\n    pointer = new int;\n    cout <<”return value” <<pointer <<\"\\\
  n\";\n    delete [] pointer;\n    return 0;\n}\n```\n\n(a) 编译错误。\n(b) 无错误且将返回分配的地址。\n\
  (c) 运行时错误。\n(d) 将发出警告。\n\n**答案: (b)** 无错误。使用 `delete pointer` 或 `delete [] pointer`\
  \ 都是可以的。\n\n### 12. 下面代码的输出是什么？(L4)\n\n```cpp\n#include <iostream>\n\nusing namespace\
