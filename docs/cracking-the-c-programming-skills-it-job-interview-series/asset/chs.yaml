  \n(a) 64\n(b) 256\n(c) 24\n(d) 以上都不是\n\n**答案: (c)** 24。当编译器看到 `SQ(something)` 时，它会被替换为\
  \ `SQ(something)`* `SQ(something)`。因此，`SQ(val+4)` 变为 `val+4*val+4`，`4+4*4+4`，然后被求值为\
