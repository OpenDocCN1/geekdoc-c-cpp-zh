  (a) 9\n(b) 9festival\n(c) Error\n(d) Unpredictable\n\n**Answer: (c)** ‘class/类’是‘C++’中最具优势的新概念。它形成了面向对象编程的基础。但会导致错误，因为默认情况下所有变量和函数都被视为‘private/私有’变量。这些是关联数据的访问修饰符。接下来的章节将对此详细讨论。\n\
  \n### 54. 代码的输出是什么？ (L1)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass tea\n{\n  public:\n  int rate;\n  void bonus()\n  { cout<<”festival”; }\n\
  }t;\n\nint main()\n{\n  t.rate=9;\n  cout<<t.rate;\n  t.bonus();\n}\n```\n(a) 9\n\
  (b) 9festival\n(c) Error\n(d) Unpredictable\n\n**Answer: (b)** 正常工作。只有‘public/公有’数据可以被对象访问。\n\
  \n### 55. 代码的输出是什么？ (L2)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass tea\n{\n  public:\n  int rate;\n  void bonus()\n  { cout<<”festival”; }\n\
  }t;\n\nint main()\n{\n  t.rate=9;\n  cout<<sizeof(t);\n}\n```\n(a) 8\n(b) 4\n(c)\
  \ 12\n(d) Unpredictable\n\n**Answer: (a)** 这与结构体的大小相似。它会考虑所有访问修饰符下的变量。\n\n# 2. 类\
  \ (Classes)\n\n本章将带你了解类的各个角落。这个概念是面向对象编程的核心需求。学习完本章后，你能够轻松处理类、对象以及任何相关概念。\n\n###\
  \ 1. 代码的输出是什么？ (L1)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass\
  \ student\n{\n  public:\n  int marks;\n  void percent()\n  { cout<< marks*10; }\n\
  }S;\n\nint main()\n{\n  S.marks=9;\n  S.percent();\n}\n```\n(a) 90\n(b) 9\n(c) Error\n\
  (d) Unpredictable\n\n**Answer: (a)** ‘S’是类的对象 / 实例。它可以访问类的‘public/公有’成员。‘public’是访问修饰符。类还有两个修饰符‘private/私有’和‘protected/保护’。变量被称为‘数据成员’，函数被称为‘成员函数’。\n\
  \n### 2. 代码的输出是什么？ (L1)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class student\n{\n  private:\n  int marks;\n  void percent()\n  { cout<< marks*10;\
  \ }\n}S;\n\nint main()\n{\n  S.marks=9;\n  S.percent();\n}\n```\n(a) 90\n(b) 9\n\
  (c) Error\n(d) Unpredictable\n\n**Answer: (c)** ‘private/私有’访问修饰符意味着数据需要对其他无关信息和用户隐藏。尝试访问‘private/私有’数据和方法会产生错误。它只能通过类成员访问，甚至对象不能访问。\n\
  \n### 3. 代码会抛出什么错误？ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass student\n{\n  private:\n  int marks;\n  void percent()\n  { cout<< marks*10;\
  \ }\n}S;\n\nint main()\n{\n  S.marks=9;\n}\n```\n(a) ‘int student::marks’是私有的\n\
  (b) within this context S.marks=9;\n(c) ‘student::marks’未定义\n(d) 同时‘a’和‘b’\n(e)\
  \ 同时‘d’和‘b’\n\n**Answer: (d)** 编译器知道该成员是私有的。\n\n### 4. 代码的输出是什么？ (L1)\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass student\n{\n  protected:\n \
  \ int marks;\n  void percent()\n  { cout<< marks*10; }\n}S;\n\nint main()\n{\n \
  \ S.marks=9;\n  S.percent();\n}\n```\n(a) 90\n(b) 9\n(c) Error\n(d) Unpredictable\n\
  \n**Answer: (c)** ‘protected/保护’访问修饰符意味着数据需要对其他无关信息隐藏。尝试访问‘protected/保护’数据和方法会产生错误。它可以通过类成员和派类访问（将在后续章节讨论）。\n\
  \n### 5. 代码会抛出什么错误？ (L3)\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass student\n{\n  protected:\n  int marks;\n  void percent()\n  { cout<< marks*10;\
  \ }\n}S;\n\nint main()\n{\n  S.marks=9;\n}\n```\n(a) ‘int student::marks’是保护的\n\
  (b) within this context S.marks=9;\n(c) ‘student::marks’未定义\n(d) 同时‘a’和‘b’\n(e)\
  \ 同时‘d’和‘b’\n\n**Answer: (d)** 编译器知道该成员是保护的。\n\n### 6. 代码的输出是什么？ (L2)\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass student\n{\n  public:\n  int\
