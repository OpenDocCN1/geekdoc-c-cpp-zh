  \ 混合继承 (Hybrid)\n(b) 层级继承 (Hierarchical)\n(c) 多级继承 (Multilevel)\n(d) 多重继承 (Multiple)\n\
  \n**答案: (a)** 它也被认为是一种混合继承。\n\n## 7\n## 运算符重载\n\n运算符重载是为运算符添加新的、有用且创造性功能的艺术。它是“多态”的一部分。本章将遍历所有的运算符重载，并将让你足够强大以应对它们。\n\
  \n### 1. 识别重载（overloading）和重写（overriding）的特征。(L1)\n\n(a) 重载实体在编译时绑定，重写在运行时绑定。\n\
  (b) 重载实体在运行时绑定，重写在编译时绑定。\n(c) 两者都表现出相同的特征。\n(d) 以上都不是。\n\n**答案: (a)** 重载实体在编译时绑定，而重写在运行时绑定。\n\
  \n### 2. 使用什么种函数，可以在 C++ 中重载运算符？(L1)\n\n(a) 非静态成员函数\n(b) 友函数\n(c) 静态成员函数\n(d) a\
  \ 和 b\n(e) b 和 c\n(f) a 和 c\n\n**答案: (f)** a 和 c\n\n### 3. 判断对错——通过重载，原始值丢失了。(L1)\n\
  \n(a) 对\n(b) 错\n\n**答案: (b)** 错\n\n### 4. 选择哪些运算符不能重载？(L1)\n\n(a) .\n(b) *\n(c)\
