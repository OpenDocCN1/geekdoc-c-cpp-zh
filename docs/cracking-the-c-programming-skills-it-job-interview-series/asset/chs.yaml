  \n# 1\n\n## C 相比 C++\n\n本章将引用 `C` 和 `C++` 之间最重要的区别。还需要注意的是，`C` 语言是自顶向下的语言，而 `C++`\
  \ 是自底向上的。在本章末尾，你将了解从 `C` 语言转向到 `C++` 时需要仔细处理的重要且基础的变化。\n\n**1.** 代码的输出是什么？\n\n```cpp\n\
  if (condVar > someVal) {console.log(\"xxx\")}\n```\n\n**2.** 代码将抛出什么错误？\n\n**3.**\
  \ 代码将抛出什么错误？\n\n**4.** 代码将抛出什么错误？\n\n\n\n\n\n## 7. 代码将抛出什么错误？(L2)\n\n```cpp\n#include<iostream.h>\n\
  \nusing namespace std;\n\nint main()\n{ cout<< “hello world”;}\n```\n\n(a) `cout`\
