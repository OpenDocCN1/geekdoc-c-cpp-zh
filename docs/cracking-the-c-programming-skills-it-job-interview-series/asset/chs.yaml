  \  cout<<sizeof(S);\n}\n```\n*(注：根据上下文修正原文为 S.marks=9; sizeof(S))*\n**Answer: (a)**\
  \ 只会分配成员变量。\n\n### 7. 代码的输出是什么？ (L2)\n\n```cpp\n#include<iostream>\n\nusing namespace\
