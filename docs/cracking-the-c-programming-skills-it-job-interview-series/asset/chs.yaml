  \n## 8\n\n## 函数重载与重写\n\n函数重载是面向对象编程（OOP）最有用的特性之一，允许在不丢失可读性的情况下增加程序的功能。本章将详细介绍函数重载的细节，并引导你进入重写的世界。\n\
  \n**1.** 下面代码使用了哪种面向对象的概念？(L2)\n\n```cpp\n#include <iostream>\n\nusing namespace\
