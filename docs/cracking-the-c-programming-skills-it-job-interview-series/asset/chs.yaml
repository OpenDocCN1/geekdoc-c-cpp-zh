  \ Exceptio\n\n**答案: (d)** Exceptio 是用于输入输出的异常类。\n\n## 20. 识别以下程序的输出。(L2)\n\n```cpp\n\
  #include <iostream>\n#include <string>\n#include<typeinfo>\nusing namespace std;\n\
