  \nmultipleTPOperator\n{\n  std::cout<<”test token pasting operator”;\n}\n```\n\n\
  (a) Test token pasting operator\n(b) 编译错误，因为 ‘m’ 和 ‘ain’ 之间有空格\n(c) 运行时错误\n(d) 以上均不是\n\
  \n**答案: (a)** Test token pasting operator。标记合并运算符通常忽略空白。因此，`m` 和 `ain` 之间的空格被忽略，它们被合并为\
  \ `main`。\n\n## 27. 识别以下代码的输出。 (L3)\n\n```cpp\n#include <iostream>\n\n#define LENGTH\
  \ 10\n\n#define BREADTH 20\n\n#define AREA LENGTH*BREADTH\n\nint main()\n{\n  std::cout<<AREA;\n\
  \  return 0;\n}\n```\n\n(a) 20\n(b) 30\n(c) 2\n(d) 200\n\n**答案: (d)** 200。\n\n##\
  \ 28. 下面哪个宏用于测试头文件/预处理器指令包含中的重复。 (L3)\n\n(a) #Ifdef and #ifndef\n(b) #include\n\
  (c) #define\n(d) #elif\n\n**答案: (a)** `#ifdef` 和 `#ifndef` 用于测试预处理器指令的出现。\n\n###\
  \ 29. 识别以下代码的输出。 (L5)\n\n```cpp\n#include <iostream>\n\n#define CONVERT(Z) #Z\n\n\
  int main()\n{\n  std::cout<<CONVERT(C++ PROGRAMMING IS VERY EFFICIENT);\n  return\
  \ 0;\n}\n```\n\n(a) 错误，因为输出语句中的字符串没有被 “” 包裹\n(b) 无错误，打印 C++ PROGRAMMING IS VERY\
  \ EFFICIENT\n(c) Z\n(d) 以上均不是\n\n**答案: (b)** `#` 是字符串化运算符。它将传递给它的参数转换为字符串字面量。\n\n\
  ## 30. 识别以下代码何时失败。 (L4)\n\n```cpp\n#include <iostream>\n\n#ifdef MULTIPLY\n#error\
  \ “It is not must to define MULTIPLY”\n#endif\n\nint main()\n{\n  std::cout<<MULTIPLY(10,10);\n\
  \  return 0;\n}\n```\n\n(a) 当没有 `MULTIPLY` 的宏定义时会失败，错误为‘MULTIPLY’ 在此作用范围内未声明’。\n\
  (b) 如果存在 `MULTIPLY` 的宏定义，会失败，错误为“It is not must to define MULTIPLY”。\n(c) ‘a’ 和\
  \ ‘b’ 都是。\n(d) 它在任何情况下都不会失败。\n\n**答案: (c)** 当我们定义了 `MULTIPLY` 时，它抛出自定义错误 `It is\
  \ not must to define MULTIPLY`。当我们没有定义 `MULTIPLY` 时，`main()` 中的宏调用会失败。\n\n## 31.\
  \ 使用角括号包含头文件和用双引号包含头文件有什么区别。 (L2)\n\n(a) 没有区别\n(b) 区别在于头文件的搜索位置\n(c) 区别在于文件内容粘贴到代码的方式\n\
  (d) 以上均不是\n\n**答案: (b)** 区别在于头文件的搜索位置。当用双引号包含头文件时，将在源文件所在的地方搜索该文件。另一方面，如果使用角括号，将查找该文件。\n\
  \n## 15\n# 标记\n## 理论\n\n### 1. 什么是标记？C++ 中有多少个？\n**答案:** C++ 的最小元素是\n9 关键字\n9 标识符\n\
  9 字面量\n9 标点符号\n9 运算符\n\n### 2. 给出 C++ 运算符的优先级\n运算符列表如下所示。\n\n| 类别 | 结合性 | 符号 |\n\
  | :--- | :--- | :--- |\n| 1 | 从右向左 | `::` |\n| 2 | 从左向右 | `()` `[]` `.` `->` |\n\
  | 3 | 从右向左 | `++` `--` `+` `-` `!` `~` `sizeof` `*` `&` `=` |\n| 4 | 从左向右 | `*`\
  \ `/` `%` |\n| 5 | 从左向右 | `+` `-` |\n| 6 | 从左向右 | `<<` `>>` |\n| 7 | 从左向右 | `<=`\
  \ `>=` |\n| 8 | 从左向右 | `&` `^` `|` |\n| 9 | 从左向右 | `&&` |\n| 10 | 从左向右 | `||` |\n\
  | 11 | 从右向左 | `=` `+=` `-=` `*=` `/=` `%=` `<<=` `>>=` `==` `^=` `|=` |\n| 12 |\
  \ 从左向右 | `,` |\n\n### 3. 什么是算术运算符？按优先级列出它们\nC++ 中的算术运算符有\n9 加 `+`\n9 减 `-`\n9 乘\
  \ `*`\n9 除 `/`\n9 模 `%`\n\n| 优先级顺序 | 运算符 |\n| :--- | :--- |\n| 函数调用 | `()` |\n|\
  \ 乘除模 | `*` `/` `%` |\n| 加减 | `+` `-` |\n\n### 4. 如何进行类型定义？\n`typedef` 是一个关键字，用于通知编译器在\
  \ C++ 程序中将现有数据类型重新定义为自己的术语而不改变含义。\n\n语法：`typedef 现有类型 新类型`\n示例：`typedef int Distances`\n\
  \n### 5. 什么是用户定义数据类型？它有什么用？\n用户定义数据类型有：\n9 结构\n9 类\n9 typedef\n9 枚举\n\n*结构：收集各种其他类型的数据并整体处理。它以关键字\
  \ `struct` 开始，后面跟着用户定义的类型。\n\n*类：*这种数据类型的目的是为了可重用，程序可以带有 `class` 关键字拥有自己的类。类包含在\
  \ `{ }` 内部的数据成员和成员函数。\n\n*typedef：* `typedef` 是一个关键字，用于通知编译器在 C++ 程序中将现有数据类型重新定义为自己的术语而不改变含义。\n\
  \n*枚举：*这种数据类型通过指定标识符或变量（名称）提供整数常量，因此由变量引用的整数常量被称为枚举。默认从零开始（0）。使用的关键字是 `enum`。\n\n\
  ## 6. 对于不涉及对象概念的程序，应该首选哪种语言，C 还是 C++?\n\n\n\n\n\n这是一个非常假设性的问题。如果需要面向对象且程序员熟悉 `C++`，那么总是优先选择使用\
  \ `C++`。根据最基本的直觉，`C++` 比 `C` 更先进，因此也会被这种方式青睐。\n\n### 7. 面向对象编程的三个基本概念是什么？\n\nOOP\
  \ 的三个基本概念：\ni. 封装\nii. 继承\niii. 多态\n\n### 8. 什么是类（class）？类和对象（object）之间是什么关系？\n\n\
  `class` 是一组对齐在一起的相关对象。或者说，多个对象共同构成一个 `class`。`object` 将将是 `class` 的实例。结构体的成员默认是公共的，而\
  \ `class` 的成员保持为私有。\n\n### 9. 类和结构体有什么区别？\n\n`Class` 总是被视为 `structure`（结构体）的进。它们之间有几个主要区别。`class`\
  \ 使用构造函数和析构函数。`structure` 不使用构造函数或析构函数。`class` 作用域和访问权限，而 `structures` 缺少这些。此外，OOP\
  \ 概念仅在 `class` 中支持。\n\n### 10. 空类的大小有多大？\n\n空 `class` 的大小始终是 1 字节。即使 `class` 是空的，也可以为它创建一个\
  \ `object`。因此，为了持有该对象，所需的最小内存量为 1 字节。可以尝试运行下面的代码以获得清晰的视觉效果。\n\n```cpp\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass function_echo\n{ };\n\nint main(void)\n\
  {\n\nfunction_echo foo;\n\ncout <<”\\n” <<sizeof(foo);\n\nreturn 0;\n}\n```\n\n\
  ### 11. 列举一些面向对象的编程语言。\n\n1. `Small Talk`\n2. `C++`（并非完全面向对象）\n3. `Java`（纯面向对象语言）\n\
  4. `Python`\n5. `Lingo`\n6. `Perl`（从 5.0 版本开始）\n7. `Python`\n\n### 12. C 和 C++ 有什么不同？列出\
  \ 5 点。\n\n| C | C++ |\n| :--- | :--- |\n| `C` 是过程化语言，即它是 POP（面向过程的） | `C++` 是一种面向对象的编程语言。\
  \ |\n| 在 `C` 编程中数据不安全，而在 `C++` 中数据高度安全。 | `C++` 支持数据隐藏。 |\n| `C` 语言是完全函数驱动的。 | `C++`\
  \ 是完全对象驱动的。 |\n| `C` 编程遵循自顶向下的方法 | `C++` 遵循自底向上的方法。 |\n| `C` 不允许函数重载 | `C++` 支持函数重载\
  \ |\n\n### 13. C++ 和 Java 有什么不同？列出 3 点。\n\n| C++ | Java |\n| :--- | :--- |\n| `C++`\
  \ 支持运算符重载。 | `Java` 不支持运算符重载。 |\n| `C++` 支持指针。 | `Java` 没有指针的概念。 |\n| `C++` 不支持垃圾回收。\
  \ | `Java` 支持垃圾回收，它会自动释放内存。 |\n\n### 14. 面向对象语言支持哪些基本特征？\n\n面向对象语言支持 `Polymorphism`（多态）、`virtual\
  \ functions`（虚函数）、`inheritance`（继承）、`inline functions`（内联函数）等。\n\n### 15. 什么是对象？\n\
  \n现实世界中看到的任何东西都可以称为 `objects`。`Object` 也可以 `class` 的实例。或者，一组相似的对象构成了一个 `class`。\n\
  \n### 16. 人如何识别某个物为对象？\n\n关于 `object` 有三点基本内容需要记住。它具有：\n- 属性\n- 行为\n- 标识性\n\n通过这三点，可以识别一个\
  \ `object`。\n\n### 17. 什么是封装？\n\n将状态和行为封装到单个单元中的过程被称为封装。`Encapsulation` 可以使用 `Class`\
  \ 的关键字来实现。\n\n### 18. ‘C++’ 的旧名称是什么？\n\n`C++` 最初被称为 `C with classes`。后来改成了 `C++`。\n\
  \n### 19. 举例一些实时对象并给出它们的属性。\n\n一个实例的表格。它有一个名字叫 `Table`（桌）。它会有一个 `color`（颜色）。它会有尺寸和行为。任何对象默认都会有这些。\n\
  \n### 20. ‘printf’ 和 ‘cout’ 有什么区别？\n\n`printf()` 是一个函数，而 `cout` 不是函数。`cout` 依赖于使用\
  \ `<<` 运算符的运算符重载概念，而 `printf` 完全不是那样。`cout` 本质上始终被认为具有更强的扩展性，因为它更容易处理任何数据类型。此外，对于\
  \ `cout` 来说，格式和相关内容非常简单，而在 `printf` 中则保持复杂。\n\n### 21. 什么是 IOSTREAM？如何使用？\n\n`IOSTREAM`\
  \ 类似于 `C` 编程中的 `stdio.h`。`IOSTREAM` 定义了 `C++` 程序的标准输入输出服务。如果不包含 `iostream` 头文件，就无法使用\
  \ `cout` 或 `cin`。\n\n### 22. 结构体可以是类的成员吗？\n\n是的\n\n### 23. 结构体可以在类内部定义吗？如果是，它的作用域是什么？\n\
  \n是的，`structure` 可以在类内部定义。它的作用域是该类。\n\n### 24. 结构体可以是类的成员吗？\n\n是的\n\n### 25. C++\
  \ 可以有多个 main 函数吗？如果是，哪个先执行？\n\n不。如果有两个 `main`，编译器会抛出“重复定义 'main'”的错误。\n\n### 26.\
  \ 什么是预定义函数？它们在哪里定义？\n\n预定义函数是在头文件中定义的某些独立函数（如 `cmath` 或 `stdlib`）。预定义函数如下：\n- `sqrt`\n\
  - `pow`\n- `abs`\n- `exit`\n\n### 27. 程序没有头文件可以执行吗？\n\n不，会报错。程序应该始终头文件开始。\n\n###\
  \ 28. 可以从标准编辑头文件吗？\n\n不，我们无法编辑头文件。\n\n### 29. C++ 允许命令行参数吗？给出一个用法片段？\n\n是的，在 DOS\
  \ 模式（即命令行模式）下允许允许。DOS 不支持 GUI，因此命令行是唯一的交互方式。`argc` 和 `argv` 是关于命令行参数的两个重要点。`argc`\
  \ 告诉传递给 `main` 函数的参数总数，它是整数类型。`argv[]` 告诉传递给 `main` 函数的实际参数，它是字符类型。\n\n### 30. 类之间可以通信数据吗？如果是，如何通信？\n\
  \n是的，它们可以通过前向声明（Forward Declaration）在它们之间通信数据。即包含所需的另一个类的头文件。\n\n### 31. 如何编译每个类一个文件，以及一个带有‘main’类的独立文件？\n\
  \n在 `C++` 中，我们将类或主函数保存在单独的文件中单独编译，最后链接它们以获取可执行文件，如下：\n\n```bash\ng++ -c grace.cpp\n\
  g++ -c main.cpp\ng++ main.o grace.o -o samples\n```\n\n并执行示例文件如下：\n\n```bash\n./samples\n\
  ```\n\n### 32. C++ 有哪些修饰符？\n\nC++ 的修饰符有：\n- `Signed`\n- `Unsigned`\n- `Long`\n-\
  \ `Short`\n\n### 33. 变量声明可以只有修饰符而省略数据类型吗？\n\n是的，变量声明可以有修饰符和变量名而跳过数据类型。变量默认取 `Integer`\
  \ 数据类型。\n\n### 34. 同名的类可以在不同作用域中存在吗？\n\n不，两个同名的类即使在不同作用域也不可以。编译时会抛出“重复定义‘class name’”的错误。\n\
  \n### 35. 同名类和同名对象（来自不同作用域）可以相互交互吗？\n\n\n\n\n即使在不同的作用域中从同一个对象调用，如果具有相同的类名，它也会抛出“类‘class\
  \ name’ 重定义”的错误。\n\n### 36. 类可以有一个名为 main 的函数吗？\n\n类不能有名为 `main` 的函数。编译器会为此抛出错误。\n\
  \n### 37. 类（class）是数据类型吗？如果是，为什么它被优选？\n\n是的，`class` 是用户定义的数据类型。`Class` 确保了良好的重用性。此外，`class`\
  \ 的名称可以由程序员决定（尽管有一些限制，例如 `main` 不能作为类名）。\n\n### 38. 访问修饰符可以定义两次吗（即一个类可以有两个‘public’或‘private’或‘protected’部分吗）？\n\
  \n是的，一个类可以定义两次访问修饰符。程序执行可以正常进行，没有任何错误。但是，这样做没有任何意义，并且可以避免。\n\n### 39. C++ 标准中有多少个头文件？其中有多少是借自\
  \ C 标准的？\n\n有 33 个头文件是 C++ 特有的，18 个文件是借自 C 标准的。\n\n### 40. 用户可以创建头文件吗？如果是，如何创建？\n\
  \n是的，可以创建头文件。人们可以使用 `#include \"yourfile.h\"` 来包含创建的头文件。标准头文件如 `iostream` 将通过 `#include\
  \ <iostream>` 包含。\n\n### 41. 类的‘this’ 指针可以在另一个不相关的类中使用吗？\n\n一个类的 `this pointer`（指针）不能被另一个类使用。另一个类完全不知道这个名为\
  \ `this` 的关键字，因此是受限的。\n\n### 42. 什么是对象的指针？如何使用此指向对象的指针来访问成员？\n\n指针是一个存储任何给定对象或数据类型地址的变量。类的成员通过\
  \ `this` 指针按如下方式进行访问：\n\n```\nthis->pfun()\n(*this).pun()\n```\n\n`->` 也称为指针数组。\n\
  \n### 43. 在使用“this” 指针时对程序员施加了什么限制？\n\n`“this pointer` 无法与类的静态成员一起使用。它会触发链接器错误！！\n\
  \n### 44. 谁可以访问类的受保护（protected）成员？\n\n受保护成员可以由它们自己的类和任何派生类访问，但不能在派生类之外访问。\n\n###\
  \ 45. 什么是‘this 指针’？如何使用它？\n\n`‘this pointer` 是一个指向当前对象到自身地址空间的指针。它是通过使用名为 `this`\
  \ 的关键字使用的。假设有一个名为 `“Area_Volume` 的类有 5 个对象（`ob1`, `ob2`, `ob3`, `ob4`, `ob5`）。该类有计算圆锥体积和圆面积的方法。这五个对象会连续地访问成员函数以实现各种目的。`“Area_Volume`\
  \ 类想要跟踪当前访问成员函数的对象。这在 C++ 中通过一个名为 `this` 的指针是可以实现的。它持有了调用成员函数的对象的对象的地址。每当发生方法调用时，对象的地址就会自动传递给\
  \ `‘this pointer`。\n\n### 46. 一个类的构造函数可以出现在另一个类中吗？会产生错误吗？\n\n由于继承的特性，基类的构造函数会自动在派生类中可用，不会抛出任何错误。\n\
  \n### 47. 子类可以包含外部类的构造函数吗？\n\n子类包含外部类的构造函数，这是显而易见的。\n\n### 48. 一个类可以有多少个重载的构造函数？\n\
  \n没有这种限制。重载可以发生任意次数。人们应该确保参数在数量、类型或顺序上是不同的。\n\n### 49. 重载函数可以从另一个成员函数中显式调用吗？\n\n\
  重载函数无非就是一个成员函数。因此，一个成员函数可以调用另一个成员函数。 \n\n### 50. 构造函数可以有多少个参数？这些参数可以是不同类型吗？\n\n\
  构造函数可以有任意数量的参数。参数的类型和顺序也可以不同。\n\n### 51. 即使定义了显式的简单构造函数，是否会调用隐式构造函数然后显式定义的构造函数？\n\
  \n只有在没有定义显式构造函数时，才会调用隐式构造函数。\n\n### 52. 隐式构造函数会将所有对象变量初始化为 0 或 NULL 吗？\n\n取决于数据类型，隐式构造函数会将对象变量初始化为\
  \ 0 或 NULL。\n\n### 53. 构造函数和析构函数的主要工作是什么？\n\n当对象实例化时，编译器会调用构造函数。当对象被删除或超出作用域时，会调用析构函数。构造函数和析构函数的行为就像类的普通成员函数。正如名称所示，编译器在调用构造函数时为对象分配内存，而在调用析构函数时，内存会被刷新或清理。\n\
  \n### 54. 析构函数可以递归吗？\n\n不。这是不可能的。\n\n### 55. 对象可以显式地调用析构函数吗？\n\n是的，可以调用。但它没有意义。\n\
  \n### 56. 拥有 int 指针和 float 指针需要多少内存？\n\nC 和 C++ 中的任何指针都只需要 4 字节的内存。无论是整数、浮点数还是字符，并不重要。\n\
  \n### 57. 为什么 Java 不使用析构函数，而在 C++ 中它被大量使用？\n\n由于 Java 启用了垃圾回收功能，因此不需要使用析构函数。\n\n\
  ### 58. 为什么 C++ 被视为对象驱动的，而 C 是函数驱动的？解释这一点。\n\nC++ 始终是对象驱动的，即对象是基本单元。但在 C 的情况下，它是函数驱动的。函数充当\
  \ C 中的基本单元。\n\n### 59. 对象声明时会发生什么？\n\n当对象声明时，类中的构造函数会被调用以执行成员的初始化。\n\n### 60. 对象可以作为参数传递给函数吗？（是/否）\n\
  \n是的，非常好。（章节中有介绍。）\n\n### 61. 如何调用类的静态成员？可以使用对象这样做吗？\n\n静态成员可以使用类名本身调用。例如，假设 `fun()`\
  \ 是类 `c1` 的静态成员。然后调用函数 `c1::fun()`。永远尝试使用对象调用静态函数。这会导致编译错误。\n\n### 62. 解释从函数传递和返回对象的机制。\n\
  \n当对象被传递和返回时，对象的拷贝会被传递和返回函数。在这种情况下遵循的是值传递机制。\n\n\n\n\n如果某个函数在特定程序中被频繁调用，它必须在传递控制权、交换值等等方面花费大量时间。与其这样浪费时间，不如如果调用内联函数，编译器会在调用处插入完整的代码（函数），从而节省时间。\n\
  \n### 69. 内联函数（inline function）和宏（macro）之间有什么区别？\n内联函数被视为一种请求，编译器可能会尊重也可能不尊重该请求，所有的内联请求都由编译器处理。但宏是由预处理器处理的，它在编译之前就会被展开。\n\
  \n### 70. 构造函数在 C++ 程序中起什么作用？\n构造函数的唯一目的是初始化对象，而析构函数的作用恰恰相反。\n\n### 71. 类的其他成员函数可以以“~”运算符作为前缀吗？\n\
  不能，不能使用。如果使用了，虽然不会报错，但在调用它时会报错。它会抛出“expected class-name before ‘(’”。这会将该调用视为对析构函数的调用。\n\
  \n### 72. 子类可以包含外部类的析构函数或构造函数吗？\n不能。实际上，当尝试这样做时，它会被视为一个没有返回类型的新函数。因此会抛出相应的错误。\n\n\
  ### 73. 内部调用析构函数和显式调用析构函数有什么区别？\n没有。隐式和显式调用析构函数都会释放关联对象的内存。\n\n### 74. 变量可以有多个存储类型（storage\
  \ classes）吗？\n不能。它会报错“conflicting specifiers in declaration”（声明中的限定符冲突）。\n\n###\
  \ 75. 使用‘auto’ 存储类型的意义是什么？\n`auto` 没有特殊意义。实际上，所有局部变量默认都是 `auto`，因此它在用法上没有意义。`auto`\
  \ 的意义在于释放使用后不再需要的内存。\n\n### 76. ‘register’ 是干什么用的？\n在声明中使用 `register` 是请求编译器将变量存储在\
  \ CPU 寄存器而不是 RAM 中。这样它在程序结束后仍驻留在内存中，且访问速度更快。但分配寄存器完全取决于处理器。\n\n### 77. ‘static’\
  \ 有什么意义？\n它有助于创建一个变量，该变量作为类所有对象的公共属性。此外，它有助于实现对象的计数（count）和常量值属性。\n\n### 78. 当类拥有‘static’\
  \ 成员时，类的封装是如何实现的？\n当创建一个对象时，它获得初始的 1 字节内存。然后编译器为类的所有非静态成员分配内存，并将其链接到对象的内存。此外，剩余的\
  \ `static` 成员内存也会与特定对象关联。\n\n### 79. 静态函数可以使用非静态全局变量吗？\n可以，它可以使用类作用域外的任何变量。但在类作用域内部应仅使用静态变量。\n\
  \n### 80. ‘private’ 静态成员可以在外部调用吗？相同的语法仍然有效吗？\n考虑这段代码：\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass base\n{\nstatic int b;\n}S;\n\nint base::b = 8;\n\
  \nint main()\n\n{ cout<<base::b;}\n```\n\n它会报错 `int base::b` 是私有的（private）。私静态成员不能被访问。\n\
  \n### 81. 存储类型（storage class）和修饰符（modifiers）有什么区别？\n存储类型用于修改变量的存储特性。而修饰符仅用于修改变量的使用特性。所有带有或不带修饰符的变量具有相同的存储属性。它们默认都是\
  \ `auto`。\n\n### 82. 变量可以同时拥有存储类型和修饰符吗？\n可以。它可以同时拥有存储类型和修饰符。由于它们改变的是相互独立的属性，因此是允许的。\n\
  \n### 83. 变量声明可以只有存储类型和变量名而跳过数据类型吗？\n不能。在声明中，存储类型之后编译器期望一个类型名。在这种情况下，变量名将被视为类型名，并抛出相应的错误。\n\
  \n### 84. 在声明中可以在数据类型之后指定存储类型吗？\n可以。编译器会自动映射关键字并完成声明。这不会改变默认的声明方式。\n\n### 85. C++\
  \ 中支持哪些访问修饰符（access specifiers）？\nC++ 支持三种访问修饰符，它们是：\n\n- **Public（公共）**：声明为 public\
  \ 的成员可以通过该类的对象从类外部完全访问。\n- **Protected（保护）**：声明为 protected 的成员可以在类外部访问，但仅限于派生自该类的类中。\n\
  - **Private（私有）**：这些成员只能从类内部访问。不允许从外部访问。\n\n### 86. 区分按值调用（call by value）和按引用调用（call\
  \ by reference）。\n在按值调用中，即使函数调用后原始值也会保持不变，因为传递的是变量的副本。但在按引用调的情况下，函数调用后原始值会被改变，因为传递的是地址。\n\
  \n### 87. 在 C++ 中如何使用引用？\n引用可以用于用多个名称来引用同一个地址。例如，一个人可以有多个名字。这种特征称为别名（aliasing）。\n\
  \n### 88. 什么是友函数（friend function）？什么时候需要它？\n当一个非成员函数被声明为友元时，该函数访问私有成员将变得更容易。同样，当一个类本身被声明为友元时，该友类就可以访问创建该类的私有数据成员。\n\
  \n### 89. 如何在 C++ 中分配和释放内存？\n内存分配可以通过 `new` 运算符执行，内存释放可以通过 `delete` 运算符执行。\n\n###\
  \ 90. new 的返回值是什么？\n当使用 `new` 运算符分配内存时，它会返回指向内存的指针。\n\n### 91. 什么是继承（inheritance）？\n\
  继承是一种面向对象的特征。它是从一个类到另一个类的特征。获得的是基类的数据成员和成员函数。\n\n### 92. 举例继承的现实实例。\n- 从父亲继承技巧。\n\
  - 学生从老师/大师继承知识。\n\n### 93. 继承的模式有哪些？\n继承模式有：\n- Public（公共）\n- Private（私有）\n- Protected（保护）\n\
  \n### 94. 继承的语法是什么？\n`class derived_class : mode base_class, mode base_class`\n\n\
  ### 95. 在继承中，如果派生类有一个普通成员而另一个继承来的成员同名，派生类对象调用该成员时会调用哪一个？基类变量还是派生类变量？考虑这个程序：\n\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass base\n{\npublic:\nint\
  \ b;\n}S;\n\nclass dev : public base\n{\npublic:\nint b;\n}D;\n\nint main()\n\n\
  {\nD.b = 5;\ncout<<D.b;\n}\n```\n\n这里 `D.b` 将访问原始变量，而不是继承来的变量。要访问继承的变量，必须使用基类名。\n\
  \n### 96. ‘this’ 运算符的语法是什么？\n`((class_name *)this)->member`\n\n### 97. 在‘public’\
  \ 继承模式下，基类的私有成员出现在派生类中？\n基类的私有成员在任何继承模式下都不会派生到派生类中。\n\n### 98. 如何继承类的私有成员？\n类的私有成员永远无法被继承。\n\
  \n### 99. 如何继承类的静态成员？\n静态成员像普通变量一样被继承。但对于普通变量，在派生类中会创建一个副本，而这里会提供对原始变量的访问。它应该通过相应的类名进行访问。\n\
  \n### 100. 静态函数会被继承为静态函数吗？\n是的。静态成员将始终是静态的。\n\n### 101. 继承的静态函数可以使用“派生类 ::”这种语法调用吗？\n\
  \n\n\n\n是的。对于‘static’函数，它可以从派生类直接调用，这与‘static’数据成员不同。\n\n### 102. 在继承中未指定继承访问修饰符会发生什么？例如，`class\
  \ derived_class : base_class`？\n\n该类将以‘private’（私有）模式继承。默认继承模式是‘private’。\n\n###\
  \ 103. 类可以继承一个没有声明的未定义类吗？\n\n不可以。使用未知的类会抛出错误“invalid use of incomplete type ‘class\
  \ class_name’”。\n\n### 104. 类可以继承一个仅有声明但未定义的定义的类吗？\n\n不可以。尽管它已经声明，但它仍然是不完全类型（incomplete）。它会抛出相同的错误。\n\
  \n### 105. 可以用预定义或其他用户定义的数据类型进行继承吗？\n\n不可以。继承是一种面向对象的特性。它只允许在类之间进行。\n\n### 106.\
  \ 解释 `::` 运算符在继承中的作用。\n\n当本地成员和继承的成员具有相同的名称时，会发生冲突。要调用被继承的成员，应使用类名配合 `::`。通常情况下，它用于层级访问和高作用域中的变量。\n\
  \n### 107. 解释单继承。给出一个真实世界的示例。\n\n它是单个派生类继承自单个基类，例如，儿子从父亲那里学习商业策略。\n\n### 108. 解释多重继承。给出一个真实世界的示例。\n\
  \n它是单个派生类同时继承自多个基类，例如，学生从老师那里获取知识。\n\n### 109. 解释多级继承。给出一个真实世界的示例。\n\n它是派生类继承自一个基类，而该基类又继承自一个超基类。因此以链的方式进行继承，例如，生意从祖父传给父亲，再从父亲传给儿子。\n\
  \n### 110. 解释层次继承。给出一个真实世界的示例。\n\n它是多个派生类继承自一个公共基类，例如，家族秘密从父亲传给两个儿子。\n\n### 111.\
  \ 解释混合继承。给出一个真实世界的示例。\n\n上述继承类型的任何组合都会导致混合继承，例如，学校管理从上到下分配工作。校长下有多个老师，但有一个共同的助手。\n\
  \n### 112. 什么是虚拟继承？\n\n混合继承也被称为虚拟继承。之所以这样命名，是因为在其中使用了 `virtual` 关键字。当任何派生类中出现超基类属性重复的可能时，应该使用\
  \ `virtual`。它只保留一份属性副本，并根据属性的层级跳过其他副本。\n\n### 113. 在虚拟继承中，`virtual` 关键字是强制的吗？\n\n\
  不是的。当冲突的基类为空时，没有重复的可能性。因此可以跳过。在语法上，`virtual` 不是强制性的。但它没有意义。因此，间接来说，`virtual` 关键字变成了强制性的。\n\
  \n### 114. 如果继承遵循一种可用继承方法组合的模式，那么这是什么类型的继承？\n\n任何异常的继承模式都属于‘混合’继承的范畴。\n\n### 115.\
  \ 类可以继承的类最大数量有物理限制吗？（派生类可以拥有多少个基类？）\n\n没有。只要内存（RAM）可用，类就可以继承任意数量的类。\n\n### 116.\
  \ 什么是多态？\n\n向现有属性添加功能称为多态。多态的意思是“不同的形式”。它涉及运算符重载和函数重载。\n\n### 117. 什么是运算符重载？\n\n\
  给现有的运算符添加新功能称为运算符重载。但原始功能保持不变。\n\n### 118. 通过运算符重载可以移除运算符的默认功能吗？\n\n不可以。没有办法可以移除运算符的原始功能。\n\
  \n### 119. 重载的运算符可以被其派生类使用吗？\n\n可以。如果运算符的定义在‘public’（公有）作用范围内，它也将被其派生类继承。\n\n###\
  \ 120. 什么是函数重载？\n\n给类的成员函数提供多个定义称为函数重载。\n\n### 121. 重载的规则是什么？\n\n-  函数名不能改变。\n-\
  \ 返回值可以改变，也可以不改变。\n- 参数的数量可以改变，也可以不改变。\n- 参数的类型可以改变，也可以不改变。\n- 以下项目中必须至少有一个或多个发生变化：返回类型、参数类型、参数个数。\n\
  - 更改参数名称没有影响。\n\n### 122. 仅通过更改参数名称来重新定义函数属于函数重载吗？\n\n不属于。重命名参数不会改变函数的内部签名。\n\n\
  ### 123. 仅通过更改参数类型的顺序来重新定义函数属于函数重载吗？\n\n属于。更改参数数据类型的顺序创建了类的新签名。因此，它是一个重载函数。\n\n\
  ### 124. 重载函数有必要改变参数的数量吗？\n\n没有必要。如果函数的返回类型或参数类型有任何一种变化，那么没有必要改变参数的数量。\n\n### 125.\
  \ 我们在哪里使用运算符重载？它与函数重载有什么区别？\n\n在某些情况下，同一个运算符可能用于两种不同的情况，如下：\n\n```\n5 + 3 = 8\n\
  Shri + ram = Shriram\n```\n\n在这里，`+` 是用于相两个数字的运算符，而在第二情况下，它被用作连接。这是运算符重载的目的，函数重载允许多个函数具有相同的名称。\n\
  \n### 126. `sizeof` 运算符可以重载吗？哪些其他运算符不能重载？\n\n`sizeof` 不能重载。还有一些运算符不能重载，列如下：\n\n\
  - `.`（成员访问运算符）\n- `?:`（三元运算符）\n- `::`（域解析运算符）\n- `.*`（指针成员运算符）\n\n### 127. 使用相应的伪代码定义单继承。\n\
  \n当一个派生类继承自一个基类时，被称为单继承。\n\n伪代码：\n\n```cpp\nclass base_class // 这是基类。\n{\npublic:\n\
  \    --------- 代码。\n};\n\nclass derived_class: public base_class\n// 从基类派生在这里实现了单继承。\n\
  {\npublic:\n    --------- 代码。\n}\n```\n\n### 128. 解释多重继承。\n\n当一个派生类继承自多个基类时，被称为多重继承。\n\
  \n```cpp\nclass base_class_1 // *基类 1。基类之一。*\n{\npublic:\n    --------- 代码。\n};\n\
  \nclass base_class_2 // *基类 2。第二个基类。*\n{\npublic:\n    --------- 代码。\n};\n\nclass\
  \ derived_class: public base_class_1, public base_class_2\n// 现在使用了两个基类派生一个派生类，这被称为多重继承。\n\
  {\npublic:\n    --------- 代码。\n}\n```\n\n### 129. 解释多级继承。给出一个示例。\n\n使用一个类来创建派生类。例如\
  \ A → B → C → D，其中 A 是基类，B 是第一个派生类，C 是第二个派生类，但从 B 派生，依此类推。这被称为多级继承。\n\n```cpp\n\
  class base_class_1 // *基类 1。它将被继承。*\n{\npublic:\n    int x, y;\n};\n\nclass derived_class_1:\
  \ public base_class_1 // *从基类派生。*\n{\npublic:\n    int z;\n}\n\nclass derived_class_2:\
  \ public derived_class_1 // *从派生类 1 派生*.\n{\npublic:\n    int z;\n}\n\nclass derived_class_3:\
  \ public derived_class_2 // *从基类 2 派生。*\n{\npublic:\n    int z;\n}\n```\n\n### 130.\
  \ 什么是函数重写？\n\n\n\n\n可以在派生类中重新定义基类派的函数，使其具有相同的函数名但不同的用法。\n\n### 131. 函数重写（function\
  \ overriding）和函数重载（function overloading）的区别是什么？\n\n对于函数重写（Function overriding）：\n\
  \n1. 被重写的函数定义必须具有相同的方法名。\n2. 基类函数与重写函数必须具有相同的数据类型。\n3. 基类函数与重写函数必须具有相同的参数列表。而在函数重载（function\
  \ overloading）中，签名（参数类型和参数个数）不需要相同。事实上，它们预计在参数的类型或数量上至少是不同的。\n\n### 132. C++ 中模板（templates）的作用是什么？\n\
  \n如果要求一个程序员写一个可以相加两个整数的函数，那么同一个函数可以用于相加一个整数和一个浮点数吗？不可以。最终，程序员将不得不编写 2 个不同的函数来处理所提出的问题。模板将帮助程序员避免那个问题。它非常通用，使用模板，一个函数将能够处理上述的两种情况。\n\
  \n### 133. 什么是虚函数（virtual function）？\n\n简单来说，它被用于为同一个函数赋予不同的含义。它看起来像是在调用一个函数，但该调用可能是为了另一个函数。它应该使用\
  \ `virtual` 关键字。\n\n### 134. 为什么构造函数不能声明为虚函数？\n\n`virtual` 关键字会告诉编译器，函数调用应该在运行时进行而不是在编译时进行。因此，当涉及到构造函数时，对象的创建本身依赖于构造函数且不能等待。所以，将构造函数变为虚函数是不合适的。\n\
  \n### 135. 纯虚函数（pure virtual function）有什么用？\n\n在基类中，如果一个函数被声明为纯虚函数，编译器现在将强制派生类必须重写它们。\n\
  \n### 136. 什么是抽象类（abstract class）？\n\n换句话说，具有纯虚函数的类永远无法被用于创建对象。该类随后被称为抽象类。\n\n###\
  \ 137. 为什么要使用虚基类（virtual base class）？\n\n当一个类被派生自两个派生类时，将会有两个基类组件的拷贝。这时，在决定使用哪一个拷贝时会产生歧义。在这种情况下，必须使用虚基类概念。\n\
  \n### 138. 什么是早期绑定（early binding）？有一个可能发生的简单示例吗？\n\n在编译时解析的函数调用被称为早期绑定，任何直接的函数调用都是早期绑定的简单示例。\n\
  \n### 139. 写写关于各种类型继承的访问权限（access rights）。\n\n下面的图表足以清晰说明这一点。\n\n![](img/00006.jpeg)\n\
  \n### 140. 如何让一个函数变成纯虚函数？\n\na. 方案一，可以将函数赋值为 0，因此它就变成了纯虚函数。\n\n```cpp\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass Base_class\n{\npublic:\n    virtual\
  \ void show() = 0;\n};\n```\n\nb. 下所示示例不是大多数首选的方法。但尽管如此，它仍然像纯虚函数一样工作。\n\n```cpp\n\
  #include <iostream>\n\nusing namespace std;\n\nclass Base_class\n{\npublic:\n  \
  \  virtual void show()\n    { // 内部为空。因此，它也在执行纯虚函数的功能。\n    }\n};\n```\n\n### 141.\
  \ 当使用 { } 而不是将函数赋值为 0 时，实现纯虚函数需要理解哪些限制？\n\n当人们使用 `{ }` 而不是赋值 `0` 时，允许创建对象，而这实际上是应该避免的。抽象类不能创建对象。\n\
  \n### 142. 文件处理中涉及哪些类？\n\n文件处理涉及三个三个类是：\n\n- `ofstream`: 向文件中写入的类。\n- `ifstream`:\
  \ 从文件中读取的类。\n- `fstream`: 同时对文件进行读写写的类。\n\n### 143. C++ 中文件可以以哪些模式打开？\n\n文件可以以以下模式之一打开：\n\
  \n- `ios::app`\n- `ios::ate`\n- `ios::binary`\n- `ios::in`\n- `ios::out`\n- `ios::nocreate`\n\
  - `ios::noreplace`\n- `ios::trunk`\n\n### 144. 以下函数的作用是什么？A. seekg (), B. seekp()\
  \ C. tellg () D. tellp ()\n\n- `seekg()` 将获取指针（输入指针）移动到指定位置\n- `seekp()` 将放置指针（输出指针）移动到指定位置\n\
  - `tellg()` 获取并给出获取指针的当前位置\n- `tellp()` 获取并给出放置指针的当前位置\n\n### 145. 简述以下与文件处理相关的函数。A.\
  \ eof () B. fail () C. bad() D. good。\n\n| Function | Meaning |\n| :--- | :--- |\n\
  | `eof()` | 如果读取时遇到文件末尾，则返回非零值的 true；否则返回 false（零） |\n| `fail()` | 当输入或输出操作失败时返回\
  \ true |\n| `bad()` | 如果尝试了无效操作或发生了任何不可恢复的错误，则返回 true |\n| `good()` | 如果没有发生错误，则返回\
  \ true |\n\n### 146. 被要求列出时可以列出哪些类型的文件？\n\n- **文本文件**：它是字母数字或符号的序列。要注意文本文件的行以 EOL（行尾）字符结束。\n\
  - **流**：字节序列通常被称为流。\n- **二进制文件**：二进制文件包含以二进制形式的数据。\n\n### 147. 空指针（Void pointer）在\
  \ C++ 中有什么用？\n\n让我们拿一个瓶子；如果你往里倒水，它是水瓶。如果你往里倒果汁，它是果汁瓶。指针也是如此。如果它持有浮点或整数的地址，它被称为空指针。\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int\
  \ a = 9;\n    double b = 10.676;\n    void *p;//void 指针\n    p = &a; //在这里它是整数指针。意味着它可以持有整数地址。\n\
  \    cout <<\"\\n\" << \"Integer Pointer\" << *(int *)p;\n\n    p = &b;\n    cout\
  \ << \"\\n\" << \"Double Pointer\" << *(double *)p;\n\n    getchar();\n    return\
  \ 0;\n}\n```\n\n### 148. 空指针（Null pointer）在 C++ 中有什么用？\n\n当使用未初始指针时，可能会指向某个垃圾值。为了避免这种情况，最好将指针初始化为\
  \ 0。指针初始化为 0 时被称为空指针。它指向无处。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \nint main ()\n{\n    int *p;\n    p = NULL;//NULL 是这里的关键字。\n    cout <<p; //这个指针\
  \ p 初始化为 NULL，并将指向 0。\n\n    getchar ();\n    return 0;\n}\n```\n\n执行结果：\n\n![](img/00007.jpeg)\n\
  \n### 149. 什么是友类（friend class）？它有什么用？\n\n当一个类中有私有数据成员时，对其他类是限制的，即没有其他类可以访问它们。因此，完成此目的最好方法是将访问第一个类私有数据成员的第二个类设为友。由于两个类都是朋友，这变得变得更容易。\n\
  \n### 150. C++ 支持哪些存储限定符（storage qualifiers）？\n\nC++ 支持与 C 语言中相同的四种标准限定符。它们是：\n\n\
  - `auto`\n- `static`\n- `register` 和- `extern`\n\n### 151. auto 存储限定符在 C++ 中如何使用？列举其用法。\n\
  \n\n\n\n\n`auto` 是一个默认存储类型符，其使用范围非常有限，并且在函数完成时就会消失！人们可能想用或不想用这个关键字，因为使用该关键字与不使用它之间没有显著区别。如果有人想显式地声明为\
  \ `auto`，可以使用关键字 `auto` 来完成。\n\n```cpp\nauto int meters; // 显式定义为 auto。\nint meters;\
  \ // 隐式定义为 auto。\n```\n\n由于它是默认的，关键字 `auto` 很少被使用。\n\n### 152. 请举例说明在编程中 `static`\
  \ 的用法。\n\n所有的全局变量默认都属于 `static` 类别。`static` 变量甚至可以在代码块内部声明。`static` 和 `auto` 之间存在显著区别。当涉及到\
  \ `static` 时，变量的值会被保留而不会重新初始化。`static` 变量默认存储 0。下面是一个简单的示例，展示了 `static` 变量和全局变量存储的默认值。\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nstatic int upper;\n// 定义为\
  \ static，因此应该初始化为 0。\n\nint lower;\n// 全局变量，因此默认是 static。\n\nint main ()\n{\n  \
  \  cout <<\"\\n\" << \"Static\" << upper;\n    cout <<\"\\n\" << \"Global\" << lower;\n\
  \    getchar ();\n    return 0;\n}\n```\n\n执行结果：\n![](img/00008.jpeg)\n\n### 153.\
  \ `register` 存储类型符在代码中是如何部署的？识别可以使用 `register` 作为存储类型符的情况。\n\n每当需要在 CPU 而不是 RAM\
  \ 中存储局部变量时，可以使用 `register`。\n\n```cpp\n{register int upper;\n}\n```\n\n每当需要更快的访问时（例如嵌入式系统），使用\
  \ `register` 是受到欢迎的。人们应该理解，使用 ‘register’ 是一种建议，而不是对编译器的命令。如果没有可用的寄存器来满足请求，`register`\
  \ 请求可能会失败。\n\n### 154. `extern` 在 C++ 中如何使用？\n\n```cpp\n#include<iostream>\n\nint\
  \ count =10;\nint main()\n{\n    write\n}\n{return 0;}\n```\n\n代码：`2.cpp`\n\n```cpp\n\
  #include <iostream>\n\nusing namespace std;\n\nextern int count;\n\nint main ()\n\
  {\n    cout <<”\\n” << count;\n    return 0;\n}\n```\n\n![](img/00009.jpeg)\n\n\
  “extern”修饰符定义了一个对所有对象模块（即同一目录下的所有文件）可见的全局变量。对于实例 `a.c` 文件，它可以从同一目录下的另一个文件中获取变量值，接下来的小段代码可以帮助读者理解这一概念。此外，在文件中也可以使用\
  \ `extern`。第二个示例揭示了实现方法。\n\n### 155. 简述一下近指针（near pointer）和远指针（far pointer）。\n\n\
  近指针和远指针等术语用在过去的编程时代，那时可用内存并不充足。现在大多数地方不再使用，仅在极少数嵌入式系统中仍在使用。近指针长 16 位，具有寻址 64 KB\
  \ 范围的能力；而远指针长 32 位，具有寻址 1 MB 范围的能力。\n\n### 156. 什么是命名空间（namespace）？它们有什么用？\n\n类、对象和函数等实体都可以被归在一个名称下，这被称为命名空间。\n\
  \n### 157. 什么是宏（macro）？\n\n宏是一个为标识符定义表达式的语句。在编译之前，预处理器会将所有宏替换为它们的定义。\n\n### 158.\
  \ ‘#’ 称为什么？\n\n它被称为预处理器指令。它指示预处理器在编译之前要执行的某项命令。\n\n### 159. 什么是异常处理（exception handling）？\n\
  \n异常处理是处理错误并绕过错误以继续编译的艺术。\n\n### 160. 异常处理的语法是什么？\n\n```cpp\ntry\n{\n    __________\n\
  \    __________\n    throw()\n    __________\n}\ncatch()\n```\n\n### 161. 什么是多捕获（multi\
  \ catch）？\n\n带有多个 `catch` 块的单一 `try` 块被称为多捕获。每个 `catch` 块取决于它接收的参数。它的作用类似于 `switch\
  \ case`，异常会进入最匹配的部分。最后，不带任何参数的 `catch()` 被视为默认捕获。如果异常没有匹配项，它将进入默认捕获块。\n\n"
