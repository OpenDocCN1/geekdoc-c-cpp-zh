  \ class` —— 是/否。(L2) **答案：是。**\n2. 友元函数类似于 `friend class` —— 是/否。(L1) **答案：否。**\n\
  3. 类之间的友元关系是相互的 —— 是/否。(L3) **答案：否。**（如果 `X` 是 `Y` 的友元，并不意味着 `Y` 是 `X` 的友元。）\n4.\
  \ 友元关系是可以继承的 —— 是/否。(L4) **答案：否。**（友元关系不会继承。）\n\n5. 下面代码的输出是什么？(L4)\n\n```cpp\n\
