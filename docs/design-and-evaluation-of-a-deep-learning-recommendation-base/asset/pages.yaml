    # III. THE PROPOSED ROCK SPECIMEN


    To investigate the influence of confinement pressure, rock testing were simulated
    under 0, 2, 5 and 10 MPa of confinement with a cutting depth of 3 cm and using
    a cutting length of 96 mm by a conical cutter. The prepared specimens were created
    by mixing mixtures of cement and sand with a ratio of 3:1 to TU et al. [31]. The
    UCS, BTS and Brazilian strength (BTS) tests were performed on a synthetic rock
    sample in the laboratory. The synthetic rock used in the laboratory is a mixture
    of cement and sand with a normal ratio of 3:1.


    The variation of cutting forces on the conical specimen was recorded and its mean
    peak was measured in the laboratory test. In addition, the initiation and propagation
    of cracks were recorded to study the mechanics of the breakage.


