    # ## V. SIMULATIONS OF ROCK CUTTER UNDER CONFINING PRESSURE


    Numerical tests were conducted using the graded particle assembled under different
    confining pressures of 0, 2, 5, 10 and 15 MPa. In order to ensure the reliability
    of the result, the simulation was repeated three times under each cutting on different
    rock specimens which were generated with different random numbers. The random
    number determines the distribution of size and position of particles. Since it
    would take too much time using the real speed of 6 mm/s, a cutting distance of
    96 mm was applied.


    ![](img/4ef77ca4a13056bae875ea2106092fa0_6_2.png)


    **FIGURE 13.** The variations of the forces versus the cutting distance under
    confining pressure of 2 MPa.


    The results are summarized in Table 3 and the mean forces and the peak forces
    are versus confining pressures in Fig. 14. The result shows that as confining
    pressure increases, the mean force and peak forces increases dramatically. The
    increase of volume strain (εv) indicates that the rock specimen is denser after
    being compacted under higher confining pressure may be the reason for the increase
    of cutting force.


    ![](img/4ef77ca4a13056bae875ea2106092fa0_6_3.png)


