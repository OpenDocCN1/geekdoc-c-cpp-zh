    **ABSTRACT** The confining efficiency in underground excavations relies on the\
    \ parameters of\ncutting tool and the cutting process. However, the optimization\
    \ of the cutting tool design and the cutting\nprocess is a challenge and requires\
    \ knowledge about the rock-tool interaction. This paper aims to investigate\n\
    tool interaction using a cutting method. The confining pressure was considered\n\
    the rock model with conical cutters and the discrete element method was adopted\
    \ to\nthe dynamics of the rock breakage of this model. Graded particles were created,\
    \ calibrated, and\ncompressed in the horizontal direction with a certain confining\
    \ pressure. Afterwards, the initiation and\npropagation of cracks during the rock\
    \ cutting processes were recorded. A series of small-scale rock cutting\ntests\
    \ were also carried out to verify the numerical analysis. The results demonstrate\
