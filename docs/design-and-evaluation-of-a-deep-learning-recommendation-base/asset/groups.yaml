    观察到了水平裂纹的扩展。垂直裂纹几乎垂直于岩石样本的自由表面并扩展到一定深度。随着围压的增加，观察到垂直裂纹倾斜以及失效模式。可以得出，在围压达到 15 MPa
    之前，所有裂纹的扩展都受到限制并诱导了塑性变形，岩石破碎并产生碎屑。当围压为 15 MPa 时，失效模式从脆性转变为塑性。G 和 Cheatham [12]
    也得到了类似的结论；因此，本研究使用的人工岩石临界压力/强度比为 0.53。


    图 19。15 MPa 围压下裂纹的产生与扩展。


    ![](img/4ef77ca4a13056bae875ea2106092fa0_8_12.png)

    图 20。实验室测试与模拟测试得到的平均力和标准差的比较。


    ## VI. 模拟结果与实验室结果的比较


    图 20 显示了实验室测试与模拟测试得到的平均力和标准差的比较。结果表明，DEM 模拟对围压增加时裂纹的变化提供了良好的预测。平均力和标准差值差异的原因是
    PFC$^{2d}$ 的缺点 [37]。在二维空间中，切刀被视为具有单位厚度的锥形单元，而三维空间中的岩石是锥形的 [39]。然而，在 PFC$^{2d}$
    中观察裂纹的产生和扩展更为生动直观，对于小标的测试，通过 PFC$^{2d}$ 中的段（segments）和三维 Flow Code (PFC$^{3d}$)
    中的磁盘（disks）呈现。微裂纹的扩展可以表示为 PFC2D 中合并的段，而这些段在 PFC3D 中是孤立的。然而，为了预测切削力 [40]，未来应采用
    PFC$^{3d}$。


    ## VII. 结论


    DEM 模拟为岩石切削提供了有用信息，生成了一个 2D 分级颗粒样本并了一了一系列压力下的岩石数值模拟。在此过程中，显示了裂纹的切削力和法向力。显示了岩石切削过程中裂纹的产生与扩展。还展示了实验室测试的结果。


    结果表明，切削压力影响切削力和裂纹的扩展。在较高的切削压力下记录了较大的平均力和峰值力。随着切削压力的增加，变形受到限制，从而诱导了岩石模式从脆性为主向塑性的转变。对于本研究使用的人工岩石，通过模拟和实验发现临界压力/强度比为
    0.53。


