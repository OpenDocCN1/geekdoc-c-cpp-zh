    ## 深部开采围压下岩石破碎模式的数值模拟：实验研究


    XUFENG LI¹, SHIBO WANG¹, RE MALEKIAN², SHANGQING HAO³, AND ZHIXIONG LI¹,⁴


    ¹中国矿业科技大学机械工程学院，徐州 221000，中国

    ²南非普特托利亚大学矿业与自动化系，普特托利亚，00002，南非

    ³中国天津矿矿水务设备学院，天津，300000，中国

    ⁴澳大利亚新南威尔士大学机械与制造工程学院，悉尼，NSW 2052，澳大利亚


    通讯作者：S. Wang (swangpb@umt.cn)


    本研究受中国国家基础研究基金 (2014CB04301)、国家自然科学基金 (JS150310)、高校教育重点学术性计划 (PAPD)、中国矿业大学科学研究基金
    (2012DZ020)、中国煤矿重点计划 (MJ2014-04-05) 以及吉林省科技项目 (JB2013116097) 的支持。


    **摘要** 地下开挖的围压效率取决于刀具参数和切割过程。然而，刀具设计和切割过程的优化是一项挑战，需要关于岩石-工具作用的知识。本文旨在通过切割方法研究工具作用。以具有圆锥刀的岩石模型为对象，采用离散元法研究该模型的岩石破碎动力学。创建了校准的分级颗粒，并在特定的围压下沿水平方向进行压缩。随后，记录了岩石切割过程中裂纹的萌生和扩展。还进行了一系列小型岩石切割试验以验证数值分析。结果表明：1)
    围压诱导了比无约束情况下更大的切割力；2) 随着岩石失效模式的变化，当主要表现为延性/压缩强度比为0.53时发生了失效转变。


    **索引词** 深部开采、岩石切割过程、离散元法、围压。


    ## I. 引言


    随着经济的快速发展，对资源的需求和开发日益增加 [1]。浅层矿产储量正在减少，全球许多地方已进入“深部开采”阶段 [2]。以中国煤矿开采为例，根据第三次中国煤资源预测
    [3]，深度2000米内的煤炭总储量超过55万万吨，其中约70%已探明。根据2004年的研究，深度1000米以下的煤炭储量为29.5亿吨，1000至1500米的垂直范围内有1.2万吨。考虑到煤炭的重要性，深部开采是不可避免的趋势，实际上开采深度每年增加8米到12米
    [4]。


    影响深部开采机械设备最具特征的因素之一是复杂的作业环境，包括：高应力、温度和压力 [5]。随着开采过程的扩大，非线性力学现象（如岩石爆破、瓦突出、岩石流变和水涌）发生更加频繁
    [5]。许多研究还发现围压对岩石力学特性有显著影响 [6]。研究了不同围压影响岩石变形从脆性向延性的转变。Moeji [7] 通过对干岩进行单轴压缩试验确定了岩石的变形和断裂。发现这些岩石表现出显著的弹性，且从脆性破坏到延性失效的转变定义简单；然而，仅进行了定性描述，未给出失效模式转变的指标。研究发现裂纹受到围压的约束。


    一些研究人员还对围压下使用切削刀的岩石切割进行了研究。Bilgn等 [23] 通过数值模拟和小型岩石切割得出结论：围压降低了槽底下的拉伸应力。对于未卸压的切割，材料中等效单轴压缩强度1/5或1/4的围压会导致断裂力增加60%。对于切割，发现切割力为20或30（单位缺失）。Huang等
    [24] 使用通用非线性有限元分析程序 LS-DYNA 通过有限元法 (FEM) 对岩石切割进行了数值模拟。作者得出结论，力随压力增加而增加，且尺寸大于非平行裂纹。因此，在通过圆锥刀进行切割时，充分理解围压对岩石破碎的影响是必要的。


    全面理解深部开采（800米或地下）中围压下岩石切割的动力学至关重要；[90]，文献综述表明，关于隧道掘进机 (TCM) 中心或刀片的岩石压入已做了大量研究。关于取向、浓度和材料，Chen等
    [11] 得出在0至35 MPa的围压范围内进行了一系列压入试验，并发现了一个岩石表现出从主导向脆性模式转变的临界压力。Cham和Labz [12] 观察到最小/压缩强度为0.53的脆性失效随比例的增加而减少。在小围压下也观察到了裂纹压入。Inato等
    [13] 发现负载随压力增加而增加。相反，Yin等 [14] 通过测试得出结论，存在一个临界水平。在该水平以下，能量随切割力而增加。Ma等 [15] 对TCM部件进行了压入试验，发现压力随角度增加增加。Huang和De
    [16] 研究了压入过程中约束对失效机制的影响，发现主裂纹的萌生随水平的增加而增加。Geiring发现在相似岩石条件下，深部开采的岩石变形大于浅层开采。这是由于高围压造成的。Lu等
    [18] 利用理论和实验研究了TCM部件的岩石破碎和切屑形成。发现切屑呈矩形，高度随压力增加而减少。Ma等 [21] 通过全尺度试验研究了约束力对TCM性能的影响。发现法力随岩石强度增加而增加。Wang等
    [22] 利用岩石失效分析在围压下进行了切削搅拌过程并


    在本研究中，采用用于计算颗粒流代码 (PFC) [2] 的数值离散元法 (DEM) 分析岩石颗粒的动力学。PFC的作用是可以重构组装。进行了一系列不同围压下的岩石切割数值模拟，以研究围压对岩石破碎的影响。此外，在侧压力下进行了小型岩石切割试验以验证


    ## II. DEM理论


    DEM被用于 [25–27] 建模和分析岩石力学。DEM被离散为颗粒单元，单元间的作用仅发生在接触点。PFC通过将单元限制为刚性球面来表示DEM。DEM中的颗粒相互作用被视为问题。在接触点，利用牛顿第二定律和力-位移定律寻找运动系数关系，并利用力-位移定律


    ![](img/4ef77ca4a13056bae875ea2106092fa0_1_0.png)


    图1. DEM的计算循环。


