    \ under Confining Pressures in Deep Mining\n\nto describe the force-displacement\
    \ relationship. The force, motion and location of the particles and walls are\
    \ calculated and updated by cycle. The calculation cycle is shown in Fig. 1.\n\
    \nWith PFC$^{3D}$, particles are connected and transmit movement and force to\
    \ one another. Bonds are described as gluing particles together, resisting sliding\
    \ or rotation [29]. The linear parallel bond model is used widely in simulation\
    \ because it can retain both force and moment between particles. If the strength\
    \ of the bond is exceeded, the bond will break down. The initiation and propagation\
    \ of cracks can be recorded in DEM during the break-down of the linear bonds.\n\
    \nThe total force $\\tilde{F}_i$ and $\\tilde{M}_i$, with respect to the parallel\
    \ bond can be expressed by figure. The total force $\\tilde{F}_i$ can be divided\
    \ into normal and shear force components according to the contact plane. Equation\
    \ (1) describes their relationship:\n\n$$\\tilde{F}_i = \\tilde{F}_i^n + \\tilde{F}_i^t\
    \ \\quad (1)$$\n\nwhere, $\\tilde{F}_i^n$ and $\\tilde{F}_i^t$ are the normal\
    \ and shear force components, respectively.\n\nwhere $\\Delta$ is a symbol meaning\
    \ the increment and $\\Delta U$ is the relative displacement between the bonded\
    \ particles in one time step and superscript of $n$ and $t$ represent normal and\
    \ shear directions, $t$ is the time step, $V$ is the relative velocity between\
    \ the bonded particles, $\\Delta\\omega$ is the relative angle angle between the\
    \ bonded particles, $\\omega^n$ and $\\omega^t$ are angular velocities of the\
    \ bonded particles, A is the area of the bond, $I$ is the moment of inertia of\
    \ the bond cross-section at any point through the contact point and in direction\
    \ of $\\Delta L$, $k^n$ and $k^t$ are the normal and shear stiffness, respectively.\n\
    \n# III. THE PROPOSED ROCK SPECIMEN\n\nTo investigate the influence of confinement\
    \ pressure, rock testing were simulated under 0, 2, 5 and 10 MPa of confinement\
    \ with a cutting depth of 3 cm and using a cutting length of 96 mm by a conical\
    \ cutter. The prepared specimens were created by mixing mixtures of cement and\
    \ sand with a ratio of 3:1 to TU et al. [31]. The UCS, BTS and Brazilian strength\
    \ (BTS) tests were performed on a synthetic rock sample in the laboratory. The\
    \ synthetic rock used in the laboratory is a mixture of cement and sand with a\
    \ normal ratio of 3:1.\n\nThe variation of cutting forces on the conical specimen\
    \ was recorded and its mean peak was measured in the laboratory test. In addition,\
    \ the initiation and propagation of cracks were recorded to study the mechanics\
