    ## Numerical Simulation of Rock Breakage Modes Confining Pressures in Deep Mining:
    An Experimental Investigation


    XUFENG LI¹, SHIBO WANG¹, RE MALEKIAN², SHANGQING HAO³, AND ZHIXIONG LI¹,⁴


    ¹School of Mechanical Engineering, University of Mining and Technology, Xuzhou
    221000, China

    ²Department of Mining Engineering and Automation, University of Petrolia, Pretoria,
    00002, South Africa

    ³School of Coal Mine and Water Equipment Company, Tianjin, 300000, China

    ⁴School of Mechanical and Manufacturing Engineering, University of New South [W]ales,
    Sydney, NSW 2052, Australia


    Corresponding author: S. Wang (swangpb@umt.cn)


    This research was supported by the National Basic Research Fund of China (2014CB04301),
    the National Natural Science Fund (JS150310), the Priority Academic Program of
    Higher Education Institutions (PAPD), the China University of Mining and Technology
    Research Research Fund (2012DZ020), the Key Plan of China Coal Mine (MJ2014-04-05)
    and the Science and Technology Project of Jilin Province (JB2013116097)


    **ABSTRACT** The confining efficiency in underground excavations relies on the
    parameters of cutting tool and the cutting process. However, the optimization
    of the cutting tool design and the cutting process is a challenge and requires
    knowledge about the rock-tool interaction. This paper aims to investigate tool
    interaction using a cutting method. The confining pressure was considered the
    rock model with conical cutters and the discrete element method was adopted to
    the dynamics of the rock breakage of this model. Graded particles were created,
    calibrated, and compressed in the horizontal direction with a certain confining
    pressure. Afterwards, the initiation and propagation of cracks during the rock
    cutting processes were recorded. A series of small-scale rock cutting tests were
    also carried out to verify the numerical analysis. The results demonstrate that:
    1) the confining pressure induced larger cutting force than in the unbiased condition;
    2) with increase of the rock failure mode experienced predominantly to ductile/compressive
    strength ratio of 0.53 when the transition of failure occurred.


    **INDEX TERMS** Deep mining, rock cutting process, discrete element method, confining
    pressure.


    ## I. INTRODUCTION


    With rapid economic development, the demand and exploitation for resources increases
    rapidly [1]. The reserve of shallow mineral reserves is decreasing and many around
    the world have entered the ‘deep mining’ stage [2]. Taking coal-mining in China
    as an example, according to the third Chinese national coal resource prediction,
    [3], total reserve of coal within 2000 m of depth is over 5.5 trillion tons and
    approximately 70% of that has already been explored. According to research in
    2004, the coal reserve below 1000 m of depth is 2.95 billion tons, and there are
    1.2 trillion tons in the vertical ranging from 1000 to 1500 m. Considering the
    importance of coal, deep mining is an inevitable trend and actually the depth
    of mining is increasing by 8 m to 12 m per year [4].


    One of the most characteristic influencing deep mining machinery is the complex
    operating environment, which includes: high-stress stress, temperature, and pressure
    [5]. As the mining process expands, nonlinear mechanical phenomena, such as rock
    blasting, gas outburst, rock rheology, and water outburst, occur more frequently
    [5]. Many researchers have also found that the confining pressure has a significant
    influence on the rock mechanical characteristic. [6] Investigated various confining
    pressure affected rock deformation from brittle to ductile. Moeji [7] Identified
    the deformation and fracture of rocks by uniaxial compressive tests on dry rock.
    It was found that these rocks showed remarkable elasticity and a simple to define
    the transition from brittle fracture to ductile failure. however a qualitative
    description was made and an index was not given to the failure mode transition.
    found that the cracks were restrained by confining pressures.


    Some studies have also been conducted on rock cutting with cutters under confining
    pressures. Bilgn et al. [23] concluded by means of numerical simulations and small-scale
    rock cutting, that confining pressure decreases tensile stress under the groove.
    for unrelieved cutting, a confining pressure of 1/5 or 1/4 of a uniaxial compressive
    strength in materials caused an increase of 60 percent in the fracture force.
    for cutting a force of 20 or 30 was found. Huang et al. [24] performed numerical
    simulations of rock cutting by means of finite element method (FEM) LS-DYNA with
    a general nonlinear finite element analysis program. the authors concluded that
    the force increased with increasing pressure and size larger than non-parallel
    fractures. thus, a better understanding of the effect of confining pressure on
    rock breakage is necessary during cutting by means of a conical cutter.


    it is crucial to comprehensively understand the dynamics of rock cutting with
    confining pressures in deep mining (800 m or underground); [90], literature reviews
    indicate that much research has been done on rock indentation with tunnel boring
    machine (TCM) centers or shearer picks. with respect to orientation, concentration,
    and material, Chen et al. [11] concluded a series of indentation tests under confining
    pressures ranging from 0 to 35 MPa and found that a critical pressure where the
    rock exhibited a prismatic transition from predominantly to brittle mode. Cham
    and Labz [12] observed that brittle failure with minimal/compressive strength
    of 0.53 showed a decrease with the ratio. Indentation of the crack was also observed
    under a small confining pressure. Inato et al. [13] found that the load increased
    with increasing pressure. otherwise, Yin et al. [14] concluded, by means of tests
    that a critical level exists. below this level, the energy increased as the cutting
    force. Ma et al. [15] carried out indentation tests with TCM members and found
    that the pressure increased with the angle. Huang and De [16] investigated the
    effect of confinement on the failure mechanism during indentation and found that
    the initiation of the primary crack increased with an increasing level. Geiring
    found that in similar rock conditions the rock deformation in deep mining was
    greater than in shallow mining during tunnel excavation. this is due to the high
    confining pressure. Lu et al. [18] studied the rock breaking and chipping formation
