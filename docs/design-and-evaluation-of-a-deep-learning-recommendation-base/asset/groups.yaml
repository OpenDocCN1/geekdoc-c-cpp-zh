    从这些图中可以看出，围压对裂纹的扩展方向和长度有显著影响。在不同围压下，裂纹的产生机制和碎屑形成是类似的。首先，在切刀之前形成了剪切断裂，颗粒连接到切刀。随着切刀的推进，拉伸断裂增加并合并形成宏裂纹。宏裂纹分为垂直裂纹和水平裂纹，水平裂纹扩展到自由表面产生裂纹。不同围压条件之间的主要区别是主裂纹的扩展方向和长度。对于无约束的裂纹，


