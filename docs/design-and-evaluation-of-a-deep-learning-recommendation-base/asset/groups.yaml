    ## VI. COMPARISON OF SIMULATION AND LABORATORY RESULTS


    The comparison of mean forces and standard deviations obtained from the laboratory
    and simulation tests are shown in Fig. 20. It shows that the DEM simulation gives
    good prediction of the changes of cracks while confining pressure increases. The
    reason for the distinction in value of the mean force and standard deviation is
    the disadvantage of the PFC$^{2d}$ [37]. In two dimensions, the cutter is regarded
    as a cone-shaped unit with unit thickness, while the rock is conical-shaped in
    three dimensions [39]. However, it is more vivid and intuitive to observe the
    initiation and propagation of cracks in PFC$^{2d}$ for small-scale tests are presented
    by segments in PFC$^{2d}$ and disks in Flow Code in 3 dimensions (PFC$^{3d}$).
    The propagation of micro-caps can be represented as coalesced segments in PFC2D
    which are isolated in PFC3D. However, in order to predict the cutting force [40]
    PFC3D should be employed in future.


    ## VII. CONCLUSION


    The DEM simulation provides valuable information for rock cutting, a 2D graded
    particle sample was generated and a series of rock numerical simulations under
    different pressures were carried out. During the process, the cutting and normal
    forces of the cracks were displayed. The initialization and propagation of cracks
    during the rock cutting were displayed. The results of the laboratory tests were
    also presented.


    The results show that the cutting pressure influences the force on cutting and
    propagation of cracks. Larger means and peak forces were recorded in higher cutting
    pressures. As cutting pressure increased the deformation was restricted which
    induced the transition of the rock mode from predominantly brittle to ductile
    fracture. The critical pressure/compressive ratio of the failure mode for this
    synthetic rock was found to be 0.5. Additionally, reasonable agreement of force
    trend was observed between simulation and experimental tests which verified the
    validity of DEM cutting model. However, due to the limitation of laboratory equipment,
    tests under pressure higher than 2 MPa were not produced. Here, higher pressure
    and different types of rock were taken into consideration and the influence on
    properties at critical pressure index was investigated.


