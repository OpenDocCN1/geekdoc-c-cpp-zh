    From these figures, it is shown that the confining pressure has a significant
    influence on the propagating orientation and length of the cracks. The mechanism
    of initialization of the cracks and chip formation are similar under different
    confining pressures. Firstly, shear fractures were formed before the cutter and
    particles connected the cutter from the rock sample as powder. As the cutter advances,
    tensile fractures increase and coalesce to form macro-cracks. Macro-cracks are
