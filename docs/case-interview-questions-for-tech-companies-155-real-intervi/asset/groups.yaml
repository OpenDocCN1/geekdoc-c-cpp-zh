    name> 目前在医院处于危危状态。Uber 正在密切关注情况，并在获得家属许可后提供更新信息。


    ## 给 Uber 司机的信


    给 Uber 司机写一封信，内容可以是任何主题，例如新的促销活动或提高收入的策略。


    ### 需要考虑的因素


    - 目标受众是谁？

    - 你想沟通什么？

    - 在读者阅读信息后，你希望他们采取什么行动？


    ### 常见错误


    - 信息听起来过分推销色彩。例如使用华丽、繁复的辞藻或过度使用感叹号。


    ## 回答


    司机们，大家好：


    感恩节快要到了，我们中的许多人都在想家。对我们来说，你们都是我们家庭的一部分。我们正在推出一项新的促销活动，帮助你们在这个假期期间赚取一些额外的零花钱。


    我们针对所有的 UberX 订单为 UberPool 推出了感恩特别优惠。这意味着什么？


    - 您的收入不受促销活动的影响。每单订单的收入与现在一样。

    - 您将获得更多的乘客。折扣价格意味着更多的票费收入。


    此促销活动将从 11 月 20 日凌晨 12:00 持续到 11 月 27 日晚上 11:59。公告将出现在 Uber 应用程序中，促销价格将自动计算。您或您的乘客都不需要额外操作。如果您有任何问题，请通过
    driver-relations@ubercorpexample.com 与我们联系。


    顺颂商祺，


    Kia S. Sammons

    当地 Uber 总经理


    ## 招募 Uber 司机


    用 4 句话以内，尝试说服某人成为 Uber 司机。


    ### 需要考虑的因素


    - 这个问题测试了两个能力：你的影响人的能力和你的沟通能力。

