    # Chapter 22 Finance


    # Lower Revenue in Canada


    In the US and UK, Google receives X dollars of revenue from the US per Y searches.

    However, in Canada, Google only gets 0.5X revenue per Y searches.


    What financial analyses would you conduct to explain the revenue differential?


    Things to Consider


    +   - Consider search revenue drivers including CPC and CTR.

    - The search query mix may be different. For example, a smaller portion of Canada’s
    searches are for commercial intent. "Buy flowers" is an example of a commercial
    search query whereas "What is the longest river in the world" is an example of
    an informational search query.


    Common Mistakes


    +   - Not sharing thoughts in a structured way, making it hard to follow the candidate’s
    thoughts.


    # Answer


    CANDIDATE: Here are some analyses that I would conduct, based on the following
    hypotheses:


    +   - **Dashboard data errors.** I would start by checking if the dashboard is
    correct. Sometimes there are errors in the data warehouse’s structure, transform
    and load processes, leading to false reports.

    - **Differences in user population.** Canadians are less likely to buy online
    vs. the US and the UK. Given the lower ROI, online retailers are less likely to
    bid as much for advertising. Maybe Canadians are more aggressively using ad-blocking
    technologies like Adblock.

    - **Differences in advertiser position.** Even if consumer purchase behavior was
    similar, Canadian advertisers may differ. For instance, perhaps certain Canadian
    verticals may not be as competitive as the US or UK. This could result less competition
    for the number of ad slots, leading to lower prices.

    - **Differences in mobile vs. PC search share.** Typically, revenue per mobile
    is less than revenue per PC. If Canada’s mobile is different from the US or UK,
    it could explain country differences in revenue search.

    - **Differences in operating system or browser search.** Similar argument to the
    previous, revenue per search can differ based on operating system (Windows vs.
    Mac) or browser (Chrome vs. Firefox. Internet Explorer). If Canada’s is different
    from the US or UK, it could explain the differences.

    - **Differences in the product.** Perhaps the Canadian version is different from
    the rest of the world. Perhaps the Canadian version has a different UI. Or maybe
    it has a different algorithm for determining ad placement.


    INTERVIEWER: Which one of these would be the easiest to diagnose?'
