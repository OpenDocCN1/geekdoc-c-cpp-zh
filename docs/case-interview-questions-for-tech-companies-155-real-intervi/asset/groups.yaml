    # Facebook Advertising Product in Indonesia


    If you were to launch a new Facebook advertising product in Indonesia, how would
    you do it?


    Things to Consider


    Common Mistakes


    # Answer


    CANDIDATE: When launching a new Facebook product in Indonesia, here are the things
    I''d consider:


    +   - Customers. We''ll have to study Indonesian advertisers and the customers
    they want to influence through our advertising.

    - Culture. We will have to keep in mind Indonesian culture including ethnic and
    religious norms.

    - Regulations. There may be specific regulations on forms of advertising or what
    can be advertised.

    - Local presence. I''d establish a local office so our staff can build strong,
    close relationships with not only advertisers but also local vendors.

    - Acceptable forms of marketing. Depending on the local culture, certain forms
    of advertising may be more appropriate than others. I''d also want to research
    local or regional tradeshow that can help product adoption.

    - Market-specific payments. I''d research acceptable forms of payment. Sometimes
    credit card is acceptable; other times cash or voicing is preferred.

    - Pricing. Indonesia is very different from Western countries like the United
    States or Europe. We''ll have to research and adjust our pricing to what''s appropriate
    to advertiser''s budgets and advertising alternatives.

    - Staffing and employees. Hire local employees that can speak the language, understand
    local customs and comprehend the industry, including customer and competitive
    insight.'
