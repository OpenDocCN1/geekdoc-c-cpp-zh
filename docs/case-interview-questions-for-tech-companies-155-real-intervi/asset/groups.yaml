  - "[PAGE 264]\n\n# Providing Feedback\n\nGive me an example of when you had to provide\
    \ feedback.\n\nThings to Consider\n\n+   - Can you think of a time when you:\n\
    \  - Confronted someone when others wouldn't have courage to do so\n  - Provided\
    \ feedback in an extraordinary, elegant way?\n\nCommon Mistakes\n\n+   - Offering\
    \ an example where the feedback was ordinary. For instance, \"I suggested to my\
    \ colleague that we are starting meeting later so that we can accommodate colleagues\
    \ joining from ten time zones.\"\n- Giving an example where poorly received feedback\
    \ had limited or no consequences. For example, \"I gave feedback that we do a\
    \ cooking class, the team voted to participate in a glassblowing instead.\"\n\n\
    # Answer\n\nCANDIDATE: When I first worked at Dell, I was the newest member on\
    \ the staff. A co-worker, who had worked for Dell for 30 years, told me that he\
    \ \"knew the ropes\" and that I would have \"wait my turn in line.\"\n\nI was\
    \ taken aback by his brusque approach. Unfortunately, the drama didn net end on\
    \ the first day. He would never look me in the eye during meetings, and I found\
    \ that he routinely left me off important emails.\n\nI wanted to discuss the issue\
    \ with him, but he never gave me the chance. I imagined that he felt I was young\
    \ and naive. I didn't feel good dismissed; it hurt my sense of self-worth. Ultimately,\
    \ I decided to take the high road and prove myself. I worked hard, acted professionally,\
    \ and learned quickly.\n\nAfter about two months, he surprised me by inviting\
    \ me to have coffee. He told me that he had underestimated me and he was impressed\
    \ that I tried hard to fit and prove myself.\n\nAt that moment, I wanted to seek\
    \ revenge and tell him that he was the worst person I've ever worked with. However,\
    \ I decided to take the high road again. I told him that I appreciated how he\
    \ recognized my effort, and I told him that it was difficult adjusting to a new\
    \ environment, especially team members like him appeared to be unwelcoming.\n\n\
    He told me he was impressed by candness and willingness to give feedback. He later\
    \ told my manager he was impressed that I was willing to confront people and tell\
    \ them bad news. He thought it was remarkable. He felt others would have scuttle\
    \ the awkward feelings and choose to instead talk behind his back.\n\nMy boss\
    \ shared this feedback with me and later included this positive email in my six-month\
    \ performance review."
  - '[PAGE 265]


    # Made All Decisions


    Tell me about a time when you made all the decisions for a project or task.


    Things to Consider


    +   - This question is meant to demonstrate your leadership skills.

    - Many PM candidates would prefer to shift responsibility to someone else.


    Common Mistakes


    +   - Hesitating to answer because the phrase “making all the decisions,” feels
    dictatorial, which feels unwelcome in today''s team-oriented environment.

    - Being perceived as a “dictator” in this response, given the question phrasing.

    - Not having a happy ending. E.g. “We worked 80 hours a week for two weeks straight,
    but they decided to cut the project.


    # Answer


    CANDIDATE: At my current company, the product management director resigned due
    to illness. As a result, I was left in charge of a poor-performing project. It
    didn''t feel like we were making progress, and we were behind our deadlines. The
    executives were well aware of our issues, so they gave me and the development
    team an ultimatum: finish the project in two months or accept a severance package.


    The development team didn''t appreciate the ultimatum. After a heart-to-heart
    talk with the development team, they indicated that they would be comfortable
    with whatever decision I made.


    I felt honored to gain their trust, but I also felt a big burden on my shoulders.
    I was now responsible for the lives of our development team.


    After considering pros and cons, I ultimately decided to finish it. We worked
    on the project for four months, and I didn''t feel like we were the type of team
    that could. It wouldn''t be right if we didn''t give it one more.


    As we forward, I clarified the final deadline with my team in India. I got her
    feedback on how we best meet our target goals in the short time frame. From there,
    I prioritized all the features and cut requests that weren''t essential to meeting
    our target goals.


    I, and most of the team, worked about 80 hours a week for two months, and so did
    most of the team. I''m happy that we finished the project.


    INTERVIEWER: Why did you think the project fell behind in the first place?


    CANDIDATE: Here are the top reasons in my mind:


    +   - Unclear goals. It wasn''t clearly what the executives wanted us to do. One
    week, they wanted to increase monetization. The following week, they were preoccupied
    with acquiring new users.'
  - '[PAGE 266]


    +   Lack of vision. The departed product management director had a groundbreaking
    vision for the game, but he was overruled by the executives. The executives wanted
    us to copy our competitors who ignited a gaming fad where they used augmented
    reality.


    +   Lack of resources. We originally had 5 engineers resourced to the initiative,
    but the executives took away three to work on a different project.


    INTERVIEWER: Looking back at your decision, what would you have done if people
    panicked and had low morale?


    CANDIDATE: I positioned the decision to go for the deadline as my recommendation.
    I answered any questions they had had about it, but I wanted them to buy-in and
    own the decision.'
  - '[PAGE 267]


    # Quick Judgment


    Tell me about a time when you had to use quick judgment. What were the results?


    Things to Consider


    +   - Would most people have been indecisive if they were in your shoes?

    - Was it clear that others would have asked for more time to make a decision?

    - Was the result optimal, given the situation? Or did it merely indicate that
    you have a propensity to make rash decisions?


    Common Mistakes


    +   - Dry, boring stories.

    - Gaps in the storyline.

    - Unnecessarily adding extra details, primarily due to emotional baggage.


    # Answer


    CANDIDATE: While our first game showed some success during the soft-launch, I
    had to make a decision regarding customer service. Traditionally, our company''s
    product managers were in charge of the customer service. This was not sustainable
    in the end given our product manager''s growing set of responsibilities. Therefore,
    I had to choose:


    +   - Do I maintain the status quo?

    - Or I hire a dedicated customer service team?


    The decision-making dilemma stems from the fact that it takes at least a month
    to recruit and another two weeks for onboarding before new team members become
    productive. Furthermore, if the game was unsuccessful, the newly hired customer
    service team would not have much to do.


    After consulting with others and fairly weighing the pros and cons, I decided
    to hire a dedicated customer service team. In the worst-case scenario, if they
    do not have much to do, they can assist other team members with other tasks. In
    addition, to keep our costs low, I decided to hire part-time interns, not full-time
    employees.


    I ended up hiring three customer interns who worked 20 hours a week I mentored
    them until they could stand on their own. They performed admirably, so we converted
    them into full-time employees when our game launched successfully. Our users loved
    our high service levels and more importantly, the morale of our overworked product
    managers improved substantially during the quarterly company poll.'
  - "[PAGE 268]\n\n# Bias for Action\n\nTell me of a time when you had a bias for\
    \ action.\n\nThings to Consider\n\n+   - Hiring managers love employees who take\
    \ action without being prompted. It saves them from prodding employees or having\
    \ to worry about another thing.\n- This question tests whether or not employees\
    \ can get things done without prompting.\n- Stronger responses show not only a\
    \ candidate's initiative but also the candidate's ability to exceed expectations.\n\
    \nCommon Mistakes\n\n+   - Giving an answer that's too short. Short responses,\
    \ especially those less than 30 seconds can:\n  - Leaves the interviewer wanting.\n\
    \  - Have you come across as inexperienced inexperienced individuals (new graduates)\
    \ are more likely to not have much to say.\n\n# Answer\n\nCANDIDATE: As an Amazon\
    \ operations associate, I visited a lot of fulfillment centers. Over the years,\
    \ I've visited fulfillment centers in Arizona, Indiana, Kentucky and Pennsylvania.\n\
    \nOne day, I was observing incoming trucks at an Amazon fulfillment center in\
    \ Indiana. I discovered that employees were unloading broken merchandise that\
    \ took a lot of time to clean before the rest of the truck could be unloaded.\
    \ The broken glass and boxes stopped employees from unloading the truck fully,\
    \ causing more person-hours than budgeted.\n\nI realized that the merchandise\
    \ was broken because heavy boxes were sitting on top of lighter boxes. I took\
    \ some pictures. After observing the situation for many days, I also calculated\
    \ the cost of how much the company was losing. The fulfillment center was unloading\
    \ trucks 30 days a year, and it required 5 additional hours to clean up for a\
    \ team of 4. At $15 per hour, I found out that this was an incredible sum.\n\n\
    I submitted my pictures and calculations to the shift supervisor. I also proposed\
    \ a new method to load the trucks. The shift supervisor asked a couple of questions\
    \ and thanked me for my notes.\n\nI was surprised that during my next visit to\
    \ Seattle for the annual conference, the shift supervisor had nominated me for\
    \ the employee of the quarter award. Apparently the supervisor took my recommendations,\
    \ implemented them and saved $250,000 on labor."
