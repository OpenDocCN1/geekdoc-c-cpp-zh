  - '[PAGE 199]


    INTERVIEWER: We want to on board new drivers quickly and simply. Right now it''s
    a very time-intensive process.


    CANDIDATE: Here are a couple of ideas from the top of my head when it comes to
    boarding:


    +   - Existing driver voucher. Instead of an onerous background check, simply
    have three to five drivers we trust you for the driver.

    - Vehicle check via phone. Instead of a physical vehicle check, do the vehicle
    check via a smartphone. The user can either submit photos or do a real-time video
    inspection.

    - Vehicle check via a third-party. Rather than Uber''s general managers run their
    own vehicle check processes, outsource this to a local third-party such as an
    auto body shop.

    - Driver interview. Instead of an in-person interview, do a Skype interview. Better
    yet, do an asynchronous video interview where the candidate records video responses
    to pre-submitted questions. This saves time since the interviewer can fast-forward
    and skip candidates that are obvious bad fits.


    INTERVIEWER: Thanks for the ideas. Which one would you go with?


    CANDIDATE: Existing driver voucher sounds risky and may have potential driver
    collusion, even though it can be mitigated. Vehicle check via a third-party is
    not bad, but it still feels costly. Vehicle check via phone and the driver interview
    via asynchronous video interview sound compelling. I would recommend Uber try
    those two.'
  - '[PAGE 200]


    # Selling Azure to Uber


    How would you sell Azure to Uber?


    Things to Consider


    +   - This question is really about developing a value proposition statement for
    Azure, focused on Uber.

    - First, consider Uber''s Azure needs. If there are no immediate needs, consider
    how the Azure can develop or uncover latent needs.

    - Take your time to develop your sales pitch. Polish counts. After you''ve carefully
    considered it, then present your idea to the intervier.


    Common Mistakes


    +   - Giving an ordinary sales pitch without customizing.


    # Answer


    CANDIDATE: I need to think about what Uber does and how they might find our service
    useful. I can think of the following:


    +   - Storage. Uber can store their vast amount of data on our cloud storage.

    - Big Compute. They can utilize the compute power of our cloud servers.

    - Business Analytics. They can use our detailed monitoring tools which make it
    easy to diagnose issues and take action, with minimal effort.


    The hardest part, though, is convincing Uber to use our service. They have an
    incumbent service that’s either in-house or a competing cloud service. In fact,
    they’re probably using Google Cloud, Google’s version of Amazon Web Services,
    given that Google is a prominent Uber investor. We’ll have to work a lot harder
    to convince Uber to switch – whether it’s with a compelling discount or a significant
    subsidy of consulting services.'
  - '[PAGE 201]


    # Presenting Facebook Ads


    Let''s say you have a sales call to present Facebook''s ad products. What would
    you do?


    Things to Consider


    +   - Is there a customer need?

    - Is the contact person the right decision maker?

    - Does the contact person have budget to purchase? If so, what is their purchasing
    time frame?


    Common Mistakes


    +   - Sounding scripted.

    - Ignoring the prospect''s objections, which in the interview is being role-played
    by the interviewer.

    - Overselling the product when the candidate already says yes.


    # Answer


    CANDIDATE: I would first think about who the user is. Am I correct in assuming
    the user is a business owner thinking whether or not they should promote their
    products through Facebook Ads?


    INTERVIEWER: Yes.


    CANDIDATE: All right, they are probably using or thinking about using our competitors
    as well, pretty much traditional marketing (e.g. billboards, TV ads) and other
    networks (e.g. Google). Now let''s think about what our customers come from:


    +   - Tracking & Attribution. They want to know that their ads are attributed
    so they can track their performance and weed out the bad ones.

    - Optimized for Results. They want their ads to be optimized toward what their
    goals are, which could be CPI, conversions or something else.

    - Precise Targeting. They want to be able to see the performance of their ads,
    and figure out what their most valuable audience is. Facebook can also target
    mobile and browser.

    - Data Visualization. They want to visualize what is going on easily staring at
    rows of Excel sheets.

    - Audience Size. No other network has as many active users as Facebook in one
    platform.

    - Contextual Ads. Very few ad networks have as Facebook, so it is very possible
    they poorly on certain topics and areas. Facebook has no problem.

    - Branding. Facebook is known to be the #1 ad network in the industry. One can
    compete with us.


    I would tell them Facebook provides all of these. Not only do Facebook ads allow
    precise targeting through interests and mobile vs. browser, but can also track
    every ad''s performance and deliver them to you in a nice, visualized manner.
    Finally, Facebook allows you to optimize your ads towards certain actions.


    I would then tell them how traditional marketing would not be able to deliver
    the same result. For one, traditional marketing can''t attribute and track easily,
    and it definitely cannot give you any meaningful data for'
