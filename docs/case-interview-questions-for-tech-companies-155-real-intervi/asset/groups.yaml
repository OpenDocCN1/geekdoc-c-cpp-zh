    # Enticing Amazon Prime


    How would you advertise to entice Amazon members to upgrade to Prime?


    Things to Consider


    +   - Develop the value proposition.

    - Brainstorm several creative executions for the advertising copy to get at least
    one great idea.


    Common Mistakes


    +   - Not contemplating why Amazon members don''t currently sign up for Prime.

    - Suggesting ideas that are unlikely to convert regular Amazon customers to Prime.


    # Answer


    CANDIDATE: To answer this question, we really need to understand why people want
    Prime in the first place. What problems or inconvenience does Prime fix?


    +   - Free Shipping. It''s really nice to get your item shipped for free. Most
    customers don''t consider shipping to be part of the price of an item, and so
    anything we charge on shipping feels like we are ripping them off.

    - Fast Shipping. Most people are not very organized. They forget to buy something
    they need all the time. Two-day free shipping solves that. Want anything? Get
    it in two days.

    - Cheaper Deals. This is more of an Amazon.com advantage than anything. Since
    most of our users are buying everything on Amazon already because it''s the cheapest
    source, why not?

    - Other Perks. Amazon Prime has a lot of perks with videos, games, and the Kindle,
    among other things.


    So I would approach the customers first with their problems and how I understand
    them, such as the ones I mentioned before, then I would provide solutions. I would
    even get some sort of diagram made, where I would calculate how often someone
    forgets to buy something and needs to buy it, and how much that costs them, and
    it ends up being more expensive and less convenient (time wasted) than a year
    of Amazon Prime.'
  - '[PAGE 197]


    # Recent Marketing Campaign


    What recent Apple marketing campaign have you seen, and how are they different
    from Apple’s competitors?


    Things to Consider


    +   - The intent of this question is to show that a candidate is passionate enough
    the company to research Apple’s current ads before the interview. This is also
    a test of a candidate’s marketing and advertising prowess.

    - A pro and con analysis could work.

    - Even better: use an ad critique framework like MOB.


    Common Mistakes


    +   - Explaining the ad to the interviewer because the candidate assumed that
    the interviewer is familiar with the ad.

    - Focusing on superficial differences. E.g. "Apple’s ads are more fun than the
    competitor’s" or "Apple’s ads have music"


    # Answer


    CANDIDATE: I know Apple recently had an iPhone 6 marketing campaign about “taken
    with the iPhone 6.” I felt that was really creative and different from Apple’s
    competitors.


    One, it didn’t try to talk about the features of the iPhone 6. It didn’t tell
    me how many pixels the camera can capture or how powerful the camera is. It doesn''t
    try to convince me of anything. It just shows me the effect.


    Two, it was about us as the user. It promotes us as creators, and shows that we,
    too, can do these amazing things as long as we have the iPhone. That’s a subtle
    yet powerful message. Not to mention actual people captured pictures. It must
    have taken Apple lot of time to find. It feels genuine.


    This is different from other campaigns, where they try to sell you things based
    on how good it is or convincing how much you need it. This doesn’t do that. It
    tries to get to the core of what Apple stands for: creativity, and it puts us
    in the front seat.'
  - '[PAGE 198]


    # Attracting Uber Drivers


    How can Uber attract more effectively attract Uber drivers? And how can Uber onboard
    the drivers in a more measured way?


    Things to Consider


    +   - Points to attract Uber drivers: compensation, flexible work schedules and
    meeting new people.

    - Consider the steps in hiring Uber drivers: background check (criminal and driving),
    vehicle check and interview.

    - Consider elements of onboarding Uber drivers including training to review processes
    and procedures.


    Common Mistakes


    +   - Not clarifying the objective.

    - Not inquiring what “measured” means.

    - Not understanding what defines onboarding now and in the future.


    # Answer


    CANDIDATE: Can I brainstorm for a bit?


    Candidate takes one minute.


    CANDIDATE: I have several ideas in mind:


    +   - Increase Users. This will have a direct effect on the drivers. More demand
    means more supply. We can do this in multiple ways, such as offering credits for
    new accounts, which Uber is already doing, if I remember correctly. We can also
    offer special promotions such as 20% off for the summer.

    - Promote Drivers. Offer additional incentives for drivers. I am thinking of things
    like giving a bonus for picking up at least five passengers a day or a reward
    bonus after your first ride.

    - Expand Services. We can offer new services, like high-end car services or express
    buses. This indirectly adds new users, but also may cause existing users to use
    Uber or in a different way.


    INTERVIEWER: Which one would you recommend?


    CANDIDATE: I would increase users. It''s the most direct way to do this. More
    users means more demand which means drivers will get more (and we get more revenue),
    and would also promote new drivers if the business is lucrative. Obviously we
    can''t oversee this.


    INTERVIEWER: What do you mean by overdoing?


    CANDIDATE: The last time I checked, only 20% of smartphone users have installed
    Uber. I''m sure Travis wants to get 100% penetration. 20% is a long way from market
    saturation.


    INTERVIEWER: Got it. And how about onboarding?


    CANDIDATE: Yes, I''ve got a quick question. What do you mean by onboarding in
    a more measured way?'
