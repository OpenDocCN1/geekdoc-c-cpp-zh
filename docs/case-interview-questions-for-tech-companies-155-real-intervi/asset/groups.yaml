    # Why Should We Hire You


    You have 5 minutes to tell me why I should hire you over the other candidates.


    Things to Consider


    +   - Interviewer is looking for your assistance to explain your nomination to
    their colleagues.

    - Not only is important to have compelling reasons that tell the interviewer you
    are the best candidate for the job, but also it is necessary to convey it in a
    succinct manner, so they can easily relay it to their colleagues.


    Common Mistakes


    +   - Giving a long-winded response that is hard for the interviewer to record
    in their notes.

    - Choosing a generic trait that is not memorable "I work hard" or "I learn quickly."

    - Giving a naive response like "Well, you contacted me. I wasn''t looking for
    this opportunity."


    # Answer


    CANDIDATE: I have three reasons why.


    One, I have been a PM for 3 years. I''ve worked with in-house, partnered, and
    contracted development teams in multiple countries, sometimes all at once. I''ve
    worked on projects from conception to launch to post-launch, sometimes multiple
    projects at once. I''ve launched over 10 titles in multiple international markets
    and grew to be successful. I have a proven record of accomplishment.


    Two, am a very well rounded person. My startup work experience has given me the
    chance to wear many hats, beyond the typical set of PM responsibilities. I''ve
    worked as an engineer, QA, business development, marketing, customer service and
    HR. These roles have given me valuable perspective when working with others as
    a PM.


    Three, I have a strong technical background. I have both an undergrad and graduate
    CS degree, and I worked professionally as an engineer before. In a tech-driven
    company like Apple, working effectively with engineers starts with gaining their
    respect. Prior working experience as an engineer and speaking their language builds
    that trust and respect.


    To summarize, I am the perfect fit for this role with my proven track record,
    my well-roundedness and my technical background.'
  - '[PAGE 248]


    # Tell Me About Yourself


    Tell me about yourself.


    Things to Consider


    +   * “Tell me about yourself” is the most likely question you will receive at
    the beginning of the interview.

    * This is an open-ended question that can have several interpretations. However,
    most interviewers want you to give them a career overview.


    Common Mistakes


    +   * Using formal, business language

    * Not using specifics

    * Being specific doesn''t mean giving long-winged responses


    # Answer


    As a kid, my favorite toys were rocket kits, Legos and the Apple II computer.
    Therefore, it wasn’t a surprise that I grew up to be a computer science major
    at Stanford University.


    While I had several software engineering internships, my true love laid in business,
    and I thought it made sense to join McKinsey & Company to explore my wide-ranging
    interests. At McKinsey, my responsibilities included data analysis, corporate
    valuations, process re-engineering and first-party customer research. One of my
    biggest accomplishments was recommending $75M annual savings for a large pharmaceutical
    company for 23 manufacturing facilities in South America.


    In my 3rd year in the firm, I learned about the Bangladeshi social entrepreneur,
    Muhammad Yunus. He won the Nobel Peace Prize for founding Grame Bank as well as
    pioneering microcredit and microfinance. I became passionate about the area so
    I joined Kiva.org. At Kiva, my responsibilities included marketing strategy, managing
    a content marketing team and monitoring a $5M marketing budget. One of my biggest
    accomplishments at Kiva was leading a partner marketing campaign with the American
    Red Cross, which led to over $5M in new microloans.


    I’ve spent the last two years at the Stanford GSB, and I’m graduating in June.
    I am excited to be chatting with you about product marketing opportunities with
    Snapchat.'
  - '[PAGE 249]


    # Before School


    Tell me about yourself and what you did before school.


    Things to Consider


    +   - This is usually the first interview question, especially for soon-to-be
    or recent graduate.

    - Many candidates mistakenly believe that this is an ice breaker question for
    them, when it is in fact, an icebreaker for the interviewer.

    - Putting yourself the interviewer''s shoes. They have a busy day; conducting
    a job interview is one more thing they have to deal with. Help the interviewer
    feel at ease with a casual, easy-going narrative that emphasizes skill keywords
    and highlights results, preferably in number form.


    # Common Mistakes


    +   - Short responses, especially less than 30 seconds, are unsatisfactory.

    - Heavy usage of vague words. For example, some candidates choose to say, “I graduated
    from an Ivy League with a liberal arts degree” rather than “I graduated from Harvard
    in Economics.” The second one is much clearer and shorter.


    # Answer


    CANDIDATE: Do you mean college?


    INTERVIEWER: Yes, college.


    CANDIDATE: Other than going to school, I spent a lot of time designing games on
    my own. It was never professional or serious, but I really enjoyed it. I played
    video games in my spare time. Whenever I played video games, I thought about how
    I could improve them. I didn’t know I wanted to be a product manager, so this
    was a thing I had internally. I would write down what I wanted to improve, and
    create an experience that to rival the game and improve it in every way.


    I also read a lot of fantasy novels. Stories and character designs interest me.
    The way characters develop and events fold out are some of the reasons why people
    love fantasy novels. I enjoyed these aspects, but I also enjoyed the structure
    of the stories. As an avid reader, I devoured novel after novel. I loved intricate
    storylines and innovative plots. By favorite writers, I tried writing too. Nothing
    ever came of it, but I need to be a better writer.


    Finally, I loved playing the piano. My mother was a piano teacher, and it was
    natural that I developed a taste and interest in music. My mother never expected
    me to be a musician. But I always felt it was important to be well rounded, both
    in knowledge and individual talents. And I can''t help but think that my early
    interests from music to writing nurtured that personal philosophy.'
  - '[PAGE 250]


    # Why This Company


    Why do you want to join our company?


    Things to Consider


    +   - Use the Rule of Three.

    - Share your company research to reveal genuine interest in the role.


    Common Mistakes


    +   - Not sharing your company research in your answer.

    - Not knowing that geographic area is an acceptable explanation for wanting to
    join a company


    # Answer


    There are three main reasons why I want to join Snapchat: the Snapchat product,
    passion for the role and geographic location.


    # Product


    I have been a passionate Snapchat user for the last three years. I love a few
    things about Snapchat:


    +   - Short-lived sharing is addictive; it also brings me closer to those I cherish.

    - Photos are faster and more powerful than text.

    - Doodling, stickers and filters makes it easy and fun to express myself.

    - Stories brings me closer to my friends, minute-by-minute.


    My friends and family are a big part of my of my life. It would be an honor to
    join a company whose goal is is to bring people closer together.


    # Role


    I am excited about the product manager role, focused on monetization. I know monetization
    well from my days as a Facebook iOS monetization manager. At Facebook, I was responsible
    for:


    +   - Collecting requirements for new monetization features

    - Building the monetization roadmap

    - Working closely with engineering on feature implementation

    - Managing A/B testing for monetization features

    - Launch new features with an extended virtual team that spanned marketing, operations
    and sales


    I have extensive experience working big brands and agencies in the digital advertising
    space including Ogilvy & Mather, Fuel Online, and McCann Ericksonson.


    During my tenure at Facebook, my biggest accomplishment was shipping a new behavioral
    targeting program, which increased Facebook''s mobile revenue by 372%.'
