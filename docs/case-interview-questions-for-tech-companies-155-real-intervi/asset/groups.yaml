    \ Google 业务得以扩张。由于 Google 拥有资金支持、品牌认可度和强大的用户群，它能够进入新的领域。Google 正在多元化业务，进入 Nest、Fiber\
    \ 和自动驾驶汽车领域。\n\n## Google 的收购分析\n\n请分析 Google 进行的几次收购。\n\n### 需要考虑的事\n\n- 列出至少三个收购案例，以显示你对公司的了解。\n\
    - 一个简单的优缺点分析即可。\n\n### 常见错误\n- 仅提到收购的常见原因，如收入、专利或人才收购；忽略了其他原因，如竞争防御、战略学习或简单的理性行为\n\
    \n## 回答\n\n候选人：我想到了三次收购：Google Photos 的 Fly Labs、Tilt Brush 和 Thrive Audio。\n\n\
    Fly Labs 与 Google Photos 有协同效应。Fly Labs 全球下载量超过百万。这是一个明明的决定，因为 Flickr 正在衰落，随着\
    \ Imgur 的崛起，似乎照片是下一个社交趋势。Google+ 并不理想。通过缓慢改进和扩展 Google Photos，它可以成为下一个社交力量。\n\n\
    Tilt Brush 是一个 3D 绘画应用程序；它让你像画画布一样画房间。这是一个很酷的想法，但也是未来。Google 一直努力将 VR 引入世界。这使其成为\
    \ Google 的自然扩张。VR 的早期批评之一是应用程序有限。3D 绘画可以成为早期采用者的杀手级应用。\n\nThrive Audio 在很多方面与\
    \ Tilt Brush 的收购相似。它是专为 VR 设计的空间音频。通过此，我们也看到 Google 在准备 VR 成为大趋势方面处于领先。\n\n通过这些近期收购，Google\
    \ 似乎在证明两点：\n\n- Google 意识到自己的短板（如社交），并正在寻求新的方法来加强它们。\n- Google 正在为 VR 成为下一个计算平台做准备，紧跟其两个大主要竞争对手\
    \ Facebook 和微软的 VR 动态。\n"
