  - "[PAGE 258]\n\n# Complex Problem\n\nTell me about a time when you used data to\
    \ solve a complex problem.\n\nThings to Consider\n\n+   - Did you describe how\
    \ you obtained the data?\n- Did you summarize the top insights from your analysis?\n\
    - What decisions did you make from the data?\n\nCommon Mistakes\n\n+   - Choosing\
    \ an example with a simplistic data set like Google Analytics or AdWords data.\n\
    - Talked about how one analyzed data but did not:\n  - Share unique, remarkable\
    \ interpretations or insights\n  - Recommend business decisions or follow-up analyses\n\
    \n# Answer\n\nCANDIDATE: During one of our mobile game launches, we had users\
    \ complaining about crashes in different places of the game. At first, I asked\
    \ them what kind of devices they were using, because I figured they were probably\
    \ all on the same line of devices. After getting feedback from our users, I found\
    \ the crashes happened across multiple devices, not just one type of device. I\
    \ was stumped. Could these all be unconnected?\n\nI asked the development team\
    \ to look at each bug report. In the meantime, I went into the data. We never\
    \ tested the software across every single device; we didn't have access to thousands\
    \ of different mobile devices. Therefore, the scenario was new for me.\n\nThe\
    \ developers got back to me. They told me they could not replicate the crashes\
    \ in our lab environment, primarily because they didn't have access to the same\
    \ devices. However, they did find one interesting piece of data: the users' bug\
    \ reports were related. Every scenario called upon the UI element, a small window.\
    \ They told me we'd probably have to get the devices in the crash reports, so\
    \ they could test and debug appropriately.\n\nI didn't want to go on a wild goose.\
    \ Looking for rare mobile devices could take days, or months. In addition, it'll\
    \ cost money. So I went back to the crash reports. I discovered all of the devices\
    \ were Korean Samsung devices. Moreover, all the devices had Samsung Galaxy Apps.\n\
    \nI shared my discovery with the developers. They dug into it and saw that Samsung's\
    \ Galaxy Apps interfered with the small window UI call our app was making. We\
    \ found a device in the lab with Samsung's Galaxy Apps built it, and we quickly\
    \ replicated the bug. And the good news: our engineers fixed the bug and rolled\
    \ out an update in four hours.\n\nTo prevent this from happening again, I created\
    \ a device information reference page. We use that reference page to better pinpoint\
    \ problems. The reference page allows any engineer, product manager or support\
    \ team member to get information about devices. It can filter by country, default\
    \ apps and services."
  - '[PAGE 259]


    My boss liked how I resolved the issue, both in the short-term and long-term.
    He cited this specific example in the next promotion cycle, and the company promoted
    me from senior product manager to group product manager.'
  - '[PAGE 260]


    # Informed Decision Making with Data


    Tell me about the last time you used data to inform your decision making. How
    did you acquire the data? If you had to make that decision again, what would you
    do differently? What data would you like instead?


    Things to Consider


    +   - Most users struggle with getting access to data in the real world. Did you
    struggle too?

    - What implications did the data show, and what decisions did you make?

    - Did you regret the decision that you made?


    Common Mistakes


    +   - Not talking about the challenges of obtaining access to the data such as
    office politics.


    # Answer


    CANDIDATE: One time, I acquired data on traffic sources in Southeast Asia. With
    this data, I prioritized which ones to integrate first, so we can optimize our
    incoming traffic. I acquired this data by both researching online and talking
    with a few PMs in other game companies who shared their data sets with me.


    If I were to make the decision again, I would focus on individual country data.
    I would also prioritize based on the potential market share, CPI and payment habits
    of these countries as well.


    INTERVIEWER: Did you not research this on your first pass?


    CANDIDATE: I did. However, it was very time consuming to get the data, and we
    had a deadline. The Southeast Asian market is very fragmented with millions of
    jailbroken devices as well as third-party app stores.'
  - '[PAGE 261]


    # Influencing Your Team


    Describe a time where you had to influence the software or UI. What you were able
    to accomplish?


    Things to Consider


    +   - Take time to explain why it was so difficult to influence your stakeholders,
    so the listener can appreciate your persuasion skills.

    - Choose your example carefully. An influence story about a back-end feature or
    infrastructure improvement being boring or hard to follow. Whereas an influence
    story about a front-end feature may seem enticing, but may require more effort
    to explain.


    Common Mistakes


    +   - Blaming the other team for not seeing your way. This indicates low self-awareness.

    - Not utilizing creative tactics.

    - Glossing over the effort to influence stakeholders and making it seem that the
    other party changed their mind overnight.


    # Answer


    CANDIDATE: For one of our games, we had a lower than industry standard revenue.
    After looking at the data, I concluded the conversion rate was fine. The true
    problem: average revenue paying user.


    I drafted a plan to fix this in our next update. I convinced the team to prioritize
    this update for the next month. That''s not the end of the story though. The real
    story began after the meeting I was not completely satisfied. The fix would take
    a month to roll out. I was impatient. I did not want us to be in a suboptimal
    situation for a whole month.


    I was curious to see if there was a shorter-term fix. So I went back to the data.
    Seven percent of our users paid for a feature that was never meant for monetization.
    That gave me an idea to add a similar feature as a cross-sell tactic.


    I wanted to present this plan to the team, but I knew it would be hard to sell
    I just got their buy-in for plan A. But I decided to give it a whirl. I contacted
    Hiro, the lead designer who crunches all the numbers in the game, Our team met
    Hiro; having him as an ally might influence others.


    I presented the idea to Hiro and explained the three benefits:


    +   - Time to market. It would be quick fix, we are repurposing existing code.

    - Monetization opportunity. The feature was a cross-sell optimization, targeting
    users right after the purchasing cycle.

    - Low risk. We can test this new feature on the seven percent who are already
    paying for a similar feature. If the A/B test looked good, we can then decide
    to roll it out to our entire audience.'
  - '[PAGE 262]


    Hiro liked my thinking, and he helped me convince the development team. This feature
    took just two days to implement. We collected three weeks of positive A/B test
    data and made a decision to roll it out to the rest of the players. Thanks to
    this feature, we increased our revenue by 10 percent. Because of our work, Hiro
    and I won a special founder’s award the following quarter, an extra $2,000 bonus
    in our next paycheck.'
  - '[PAGE 263]


    # Multiple Stakeholders


    Tell me a time when you had to deal with multiple stakeholders.


    Things to Consider


    +   - Was there a sufficiently large team involved?

    - Did you accidentally leave out a key stakeholder?

    - Did you fail to communicate with a key stakeholder, which led to unintended
    consequences?


    Common Mistakes


    +   - Telling a story where the candidate is not at the center of the dilemma.

    - Failing to dramatize the drama, making the situation seem insignificant.


    # Answer


    CANDIDATE: Nine months ago, I was in charge of a new game launch where I had to
    deal with a European development team and a US marketing team. The dev and marketing
    team had different priorities for our collective group. The dev team wanted to
    delay the launch so they could add more game modes. The marketing team wanted
    to launch the new game as soon as possible; the marketing team felt that they
    had nothing to do.


    After I had an opportunity to digest the situation, I met with both teams. I told
    the marketing team the reason the development team wanted to hold back, and I
    told the development team the reason why the marketing team wanted to launch.


    Both teams were stubborn about their positions, so I made the following proposal:
    let''s soft-launch the game now, so the marketing team would have something to
    do. It would also give them an opportunity to test and refine their launch plans.
    The development team could rely on the marketing team for soft-launch feedback,
    making iterative improvement before the bigger launch in three weeks.


    The executives thought it was quirky that we would change launch schedules to
    keep the marketing team occupied. However, they liked the fact that we were getting
    customer input early and often. They had just brought an Agile development consultant
    in for training the previous week.'
