    I then weigh 1 vs. 1 on the remaining 2 balls to find it. I only weighed twice.

    - The heavier ball is in one of the 3 balls. I eliminate the other 5 balls. I
    then weigh 1 vs. 1 out of 3 balls. The heavier ball is in either of these 2, in
    which case I would know, or the heavier ball is not, which then it must be the
    3^rd ball that I didn''t weigh. I only weighed twice.'
