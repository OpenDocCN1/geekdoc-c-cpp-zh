    美元就能买到一台可靠的 Chromebook。


    面试官：等一下，你是说不通技术的人不会喜欢 Chromebook 吗？


    候选人：并不是所有人都如此，对于不通技术的人来说，很难上手 Linux 发行版。虽然它是一个轻量级系统，而且大部分基于 Chrome 浏览器（这也是它的名字），但它与传统的
