  mdcn: "\n所有这些背后的核心概念是便利性。我们希望机场站能变得更加愉悦。目前，机场是一群感到困惑、赶时间或在无尽等待的人的集合。考虑一下不同的步骤：\n\
    \n- 办理行李寄存\n- 出护照\n- 打印票务\n- 等待\n- 队队\n- 再次出票务和身份证明\n\n得益于更好的跟踪技术，这些在未来我们都不再需要做了。在亚洲乘坐火车旅行时，我曾见过这项技术的端倪；我想这项技术可以调整用于航空旅行。\n\
    \n面试官：你认为在尝试实现这些想法时，最大的问题或挑战是什么？\n\n候选人：我认为最大的问题是隐私。这在目前是一个具有争议的话题，我设想我们将在未来解决它。我不是说所有人都会放弃自己的隐私，这是一个复杂的话题。我的意思是，每个人都会允许自己的兴趣和爱好为了广告和便利而为人知，就像现在的互联网运作方式一样。我们希望投放与用户最相关的广告和体验。对某些人来说这可能很难推销，但我认为我们未来可以实现，但这也是我想法最大的挑战。\n\
    \n## 自动驾驶汽车的用途\n\n你认为自动驾驶汽车有哪些可能的用途？\n\n### 需要考虑的因素\n\n- 创意很重要，所以要尽可能多地脑风暴想法。\n\
    - 为了促进脑风暴，提示（prompts）会有帮助。考虑以下类型的提示：\n  - 用户画像：通勤者、商务旅行者和度假者。\n  - 场景：灾难救援、战争和道主义任务。\n\
    \  - 车辆类型：轿车、跑车、敞篷车和多用途汽车 (SUV)。\n\n### 常见错误\n\n- 忘记非消费类应用\n- 假设自动驾驶汽车是不安全的\n\
    - 假设自动驾驶汽车在遥远的未来才会出现\n\n## 回答\n\n候选人：这有两个分支：消费者端对比业务端。由于 Google 是一家消费者驱动的公司，我认为应该更多地关注消费者端。\n\
    \n面试官：好的。\n\n候选人：我在考虑三个场景：\n\n- 通勤者：这是一个非常显而易见的。很多人在通勤期间梦寐以求自动驾驶汽车。他们可以在车上工作，堵在交通中也不会那么糟糕了。\n\
    - 残障人士：由于明显原因，许多残障人士（如盲人）无法开车。自动驾驶汽车将立即解决这个问题。\n- 接送人员：这更像是一个用例，因为我们有这么多用户可以包含。我想到了那些喝了点酒的人，或者在父母没空时离开学校或足球训练的孩子。让这些人安全地回到家里非常有用。\n\
    \n我想说，我们可能在最后情况下遇到困难，因为我相信加利福尼亚州通过了一项法律，要求自动驾驶汽车的司机至少有一只手放在方向盘上。\n\n面试官：你提到那条法律很有趣。你如何认为\
    \ Google 会如何反应？\n\n候选人：我认为 Google 只需要更多时间来证明自动驾驶汽车的安全性。以前也认为飞机是不安全的，但随着时间的推移和足够的采用者，它现在可能是最流行的旅行方式之一。我认为它比船甚至火车更安全。\n\
    \n## 构建产品评论系统\n\n你会如何构建一个产品评论系统？你会使用什么数据？\n\n### 需要考虑的因素\n\n- MVC 框架可以帮助确保你的设计是完整的。也就是说：\n\
    \  - 你需要什么样的输入？（模型 Model）\n  - 创建什么样的输出？（视图 View）\n  - 如何处理输入以创建视图？（控制器 Controller）\n\
    \n### 常见错误\n\n- 非结构化的思维和难以理解的解释\n- 遗漏了产品评论系统的关键部分，例如检测欺假评论\n\n## 回答\n\n候选人：为了澄清一下，你指的是亚马逊上销售的商品评论系统，对吧？\n\
    \n面试官：你会如何构建那一个？\n\n候选人：我有访问所有数据的权限，还是受到限制？\n\n面试官：所有数据。\n\n候选人：好的，我建议将提高评论的准确性作为我们的主要目标。这里是我们应该考虑的数据：\n\
    \n- 用户是否真的购买过此产品？如果是，是多久以前的？\n- 该用户是否真的更改或更新了这条评论？我正在考虑的一个场景是，如果用户在 3 个月里都很满意，然后产品坏了，他更新了他的评分和评论怎么办？\n\
    - 其他用户对这条评论的赞成或反对票。同行评审总是是好的。\n- 用户是否评价过其他产品？这些产品相关吗？那些评论的得票情况又如何？\n- 该用户在产品价格不同时买过这个产品吗？\n\
    - 供应商是否联系过该用户？问题解决了吗？用户是否费心更改了他的评论？\n- 该用户在亚马逊上的时间长吗？我想到了人们创建新账号并立即对产品评分的情况。\n\
    \n面试官：这里有一些具体的案例。你认为它们真的必要吗？\n\n候选人：是的。在亚马逊上销售是一个竞争激烈的市场，我可以预见到人们会尝试使用未被检测到的策略来破坏竞争对手。我们需要不要输出假阳性，否则我们的用户将获得糟糕的体验。这对\
    \ Amazon.com 是有害的。\n\n面试官：你觉得哪三个是最重要的因素？\n\n候选人：绝对是这些：\n\n- 用户是否购买了产品。\n- 其他用户的赞成或反对票。\n\
    - 用户是否评价过其他产品。\n\n## 儿童书架\n\n为儿童设计书架\n\n### 需要考虑的因素\n\n- 给儿童的书架。\n- 使用 CIRCLES\
    \ 方法。\n- 考虑目标群体。\n\n### 常见错误\n\n- 不要太高。\n- 不要太重。\n- 不要太短。\n\n### 回答\n\n候选人：我想一下功能。\n\
    \n面试官：好的。\n\n候选人：我为儿童想了几个功能。\n\n- 太高\n- 太重\n\n面试官：是的。\n\n候选人：我们讨论的是什么年龄段？\n\n\
    面试官：6 到 12 岁。\n\n候选人：我想象一些情况，以防我在考虑普通书架时遗漏了什么。孩子们会对它做几件事：\n\n- 取出某本书：这将是一个问题，因为儿童的书非常薄。如果你取出一本书，剩下的整排就会塌掉。\n\
    - 放入某本书：儿童的书非常薄，所以很难分辨是哪本书。\n- 移动书架：书架不能太重。\n\n我想我准备好为它设计功能了。\n\n面试官：好的，请继续。\n\
    \n候选人：我想了几个功能。\n\n- 高度 4 英尺。\n- 宽度约为 2 到 3 英尺。\n- 塑料制。非常轻。\n- 有各种鲜艳的颜色。\n- 配有架子方便书籍。\n\
    - 方便添加或移除贴纸或标签。\n\n高度非常适合儿童，大人也可以使用。宽度虽然不大，但足够放置儿童书籍。它是塑料制的，所以不会变形，而且很轻。适合孩子们在周围活动，而且安全。它有鲜艳的颜色，孩子们会喜欢它。此外，我之前提到了取书和放书的问题，架子会有帮助。塑料材质也设计成容易添加或移除贴纸或标签。这也有助于解决标签问题，即书太薄导致很难分辨是哪本。\n"
