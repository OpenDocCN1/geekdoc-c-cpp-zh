    INTERVIEWER: Just regular people.


    CANDIDATE: What about pricing? Does that limit us?


    INTERVIEWER: Yeah, about the same price as the standard refrigerator.


    CANDIDATE: Okay, just to iterate, we are designing an innovative new refrigerator
