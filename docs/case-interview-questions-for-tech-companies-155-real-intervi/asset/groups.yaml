    # # How Does Google Make Money?


    How does Google make money?


    Things to Consider


    +   - What are Google''s different revenue streams?

    - Which revenue streams are inconsequential and can be ignored, for the sake of
    conserving limited time?


    Common Mistakes


    +   - Claiming that one is not familiar with Google''s revenue streams and instead
    answering how they would answer the question, instead of answering the question
    directly.

    - Discussing a few, but not all, revenue streams because one is feeling tired.

    - Forgetting to give a broad overview first and then going into details.


    # # Answer


    CANDIDATE: We need to analyze Google''s entire service suite and list their monetization
    by one:


    +   - **Search**: The bread and butter of Google. Search allows Google to search
    ads, and also power things like Analytics and AdWords.

    - **YouTube**: Google''s huge video service, now with streaming and original content.
    Monetizes through ads.

    - **Gmail**: Google''s popular email client. Monetizes through ads and enterprise
    solutions. Google Hangouts is part of this, but makes no money.

    - **Chrome**: Google''s browser is the most popular in the world. Monetizes through
    web page suggestions, and indirectly through promotion of search, YouTube, and
    Gmail.

    - **Google Maps**: Google''s GPS. Ads for companies (logos, pictures, etc.) as
    well as enterprise solutions.

    - **Google News**: Ads.

    - **Google Play**: Taking a cut from developers, and also has Google''s own apps.
    Also has ads. Google Play Music is also part of this, and makes money selling
    music (taking a cut from artists). Google Play Books is also part of this, and
    makes money selling books.

    - **Google Translate**: Sells its service to enterprises.

    - **Google Cloud Platform**: Enterprise solution.

    - **Google Shopping & Express**: Ads and selling products by Google or others,
    in which Google takes a cut.

    - **Google Drive**: Enterprise solutions.

    - **Google+**: Makes money.

    - **Google Ventures**: Invests and makes money through returns.

    - **Nexus**: Makes money by selling phones and tablets.

    - **Google Photos**: Free for consumers, but can be expanded with a monthly fee.

    - **Google Offers**: Coupons and promotions.

    - **Google Talk**: International calls cost money.

    - **Chromebooks**: Sells.'
