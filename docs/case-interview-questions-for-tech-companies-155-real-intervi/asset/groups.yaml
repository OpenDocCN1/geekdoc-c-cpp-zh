    \n## Google 的策略\n\nGoogle 的策略是什么？\n\n### 需要考虑的事\n\n- Google 如何获利？\n- Google 为了支持其业务模式发明了哪些关键资产？\n\
    - Google 如何防止其业务模式过时？\n\n### 常见错误\n- 没有遵循收入模式来发现公司的策略\n\n## 回答\n\n候选人：Google 的策略确实侧重于获取大量的用户。Google\
