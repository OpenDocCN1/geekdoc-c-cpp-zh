    # Challenges of Xbox


    Please describe the challenges of selling and marketing Xbox.


    Things to Consider


    +   - Son and Nintendo are committed to win, especially since they are based on
    the razor-and-razblade strategy.

    - Brand perception. Xbox is associated with the Microsoft brand. Microsoft is
    frequently not considered cool.

    - Technology advancements. Other technology products, such as smartphones, tablets
    and even smart TVs, by becoming gaming platforms.


    Common Mistakes


    +   - Not mentioning the challenges the competition''s 2:1 market share lead (PlayStation
    4 vs. Xbox), especially in the context of network effects.


    # Answer


    CANDIDATE: Are we talking about the franchise or a specific Xbox model?


    INTERVIEWER: The franchise.


    CANDIDATE: I think I can approach this from a few different angles.


    +   - Pricing: The pricing model must have been a challenge. Although there was
    a lot of history in console pricing, before it had to be a risk. I know the Xbox
    uses the razor and razorblade model where Microsoft takes a lot on each console
    sold, but make returns from selling games (first party or third party). This must
    have financial requirements, because you are essentially burning a lot of capital
    before you start making revenue.

    - Public Relations: Games, while profitable, is an industry often targeted by
    news such as violence in games and such. It''s a risk Microsoft had to take if
    they wanted to step into gaming.

    - Investors & Company Direction: It had to be difficult to explain to the investors
    and the rest of the company why Microsoft is jumping into the game space. It was
    a different direction than what Microsoft usually did.

    - Team: It had to build a team to make a console. This is no simple task. There
    are not a lot of people who can build consoles.

    - Business Relations: Microsoft''s strong suit is in business relations with a
    lot of enterprises and physical distributors for its OS and software. Games are
    a bit different, and must have been a challenge to establish a lot of relationships
    that way. Microsoft was never into hardware much, so those connections were also
    required.'
  - '[PAGE 183]


    +   Customers: Customers probably were confused why Microsoft is building a console.
    This was a marketing problem. Microsoft had to convince gamers that it could build
    a console that rivals the long, established competitors in the market: Sony and
    Nintendo.


    INTERVIEWER: That''s pretty thorough. Which do you think was the hardest?


    CANDIDATE: I would say business relations. It was basically every link in the
    ecosystem that Microsoft was unfamiliar with. It''s a lot of preparation and planning.
    Microsoft probably had to poach a lot of people too.'
  - '[PAGE 184]


    # Campaign for Office 365


    Create a marketing campaign for Microsoft Office 365.


    Things to Consider


    +   - Define the objective first.

    - Develop the value proposition for the campaign goal.

    - Create the appropriate marketing materials whether it''s advertising copy or
    marketing plan based on the objective.


    Common Mistakes


    +   - Assuming purchase is the correct goal when it''s usage. Just like a gym
    membership, companies may already have rights to use Office 365 but choose not
    to use it.


    # Answer


    CANDIDATE: Hmm, Office 365 is a subscription-based model, right? And if I remember
    correctly, it has a Home and Business edition. There are probably other tiers,
    but generally it''s a pay per-user, per-month pricing model.


    INTERVIEWER: Yes.


    CANDIDATE: Okay. I imagine the best market for Office 365 is the enterprise market.
    Are you okay if I focus my analysis on enterprise?


    INTERVIEWER: Sure, go for it.


    CANDIDATE: I would reach out to these channels, in priority order:


    +   - Sales Team. Microsoft has a large sales team with good relationships with
    enterprise clients. I would reach out to existing customers with an offer to upgrade
    to Office 365. Compared to new customers, existing customers are easier to convert.
    After existing clients have upgraded, we focus our sales team''s efforts on getting
    new customers to purchase Office 365.

    - Online Ads. Run online campaigns, focusing on sites where enterprise decision
    makers frequent, such as LinkedIn.

    - Events. Host online and in-person events to drum up interest in Office 365.

    - Public Relations. Starting churn out some articles on sites like Bloomberg,
    Wall Street Journal and Forbes.


    In terms of positioning, I would focus on the Office 365''s new features and how
    the new software increases productivity. Here are some examples:


    +   - Real-Time Co-Authoring. Invite others to work on the same document and see
    their changes in real-time.

    - Messaging. Chat with colleagues about editing a document together.'
  - '[PAGE 185]


    +   - **OneNote Tasks.** Turn OneNotes into-dos, including reminders.

    - **PowerMap.** Turn your data into an interactive map.

    - **PDF Editing.** Now have the ability to edit PDFs. Before Office applications
    were limited to just creating PDFs.

    - **In-line email replies.** Reply to an email based on a preview snippet. No
    need to open the email first and then reply.

    - **Offline editing.** Make changes offline on files and synchronize when one
    is back on the Internet, similar to Dropbox.

    - **Planner.** A brand new project management tool to create plans as well as
