  mdcn: "\n\n# Facebook 欺诈\n\n你认为 Facebook 面临着哪些欺诈问题？\n\n### 需要考虑的因素\n\n- 我们正在处理的是哪种欺诈？可能包括身份、支付、广告商和发布者欺诈。\n\
    - 欺诈者通过不同类型的欺诈可以获得什么利益？\n- 哪种欺诈策略最难逃避 Facebook 检测团队的发现？\n\n### 常见错误\n\n- 认为 Facebook\
    \ 因为不是一家电子商务公司，所以没有欺诈问题。\n\n# 回答\n\n候选人：我可以想到其中的几点：\n\n- 虚假用户试图冒充 Facebook 人员，试图获取人的身份信息或账户密码。\n\
    - 用户试图冒充他们不是自己的人，例如名人。\n- 用户创建虚假页面，冒充某个组织或公司。\n- 广告商使用可疑的支付凭证投放免费广告。\n- 广告商投放的广告与其实际销售的产品不符。\n\
    - 广告商投放导向钓鱼网站的广告。\n- 广告商投放推广违禁物品的广告，如假冒的奢侈品。\n- 用户试图发布不允许的内容，如仇恨言论或色情内容。\n\n#\
    \ Xbox Live 视频购买\n\n告诉我用于 Xbox Live 视频购买的所有销售成本 (COGS)。\n\n### 需要考虑的因素\n\n- Xbox\
    \ 为云托管支付了多少费用？\n- Xbox 必须向内容所有者支付多少？\n- Xbox 处理支付交易需要支付多少费用？\n\n### 常见错误\n\n-\
    \ 错误地包含了资本支出，如用于服务器的房地产。\n- 错误地包含了工程师的工资。工资应分类为运营费用。\n\n# 回答\n\n候选人：由于微软拥有 Xbox，我的代码和用户数据托管在\
    \ Azure 上，这是微软的内部云服务。\n\n我可以想到以下随视频购买增加而扩展的 COGS：\n\n- Azure 云服务：这种按单位扩展的协商成本将包括托管每部视频所需的适当处理能力、公用事业、劳动力和房地产成本。\n\
    - 特权费/许可费：销售他人的内容需要向他们支付大部分抽成。\n- 交易处理费：我们可能通过信用卡或其他购买方式收款。这些会产生成本。\n- 客户服务/呼叫中心成本：这是一项固定运营费用，但它可能计入\
    \ COGS 中，特别是对于软件服务 (SaaS) 产品而言。\n\n# Yahoo 的收入来源\n\nYahoo 是如何赚钱的？列出 4 种方式。\n\n\
    ### 需要考虑的因素\n\n- 如果你认为这是一个陷阱题，请向面试官澄清。例如：“你是想让我字面上列出 4 种方式吗？还是你希望我分析并优化 Yahoo\
    \ 的盈利潜力？”\n\n### 常见错误\n\n- 因为候选人不熟悉 Yahoo 的业务模式而放弃。\n- 假装知道，但事实错误，从而在此过程中损害了信誉。\n\
    \n# 回答\n\n候选人：我可以想到这些点：\n\n- 广告：Yahoo 拥有许多服务可以向用户出售广告。这些包括 Yahoo 搜索、Yahoo 新闻和\
    \ Yahoo 地。\n- 企业：Yahoo 有某些对消费者免费的产品，但可以作为企业解决方案购买。例如 Yahoo Mail。\n- 销售：Yahoo 卖钱出售某些产品。例如\
    \ Yahoo 的电视服务和 Yahoo Music。\n- 特权费和抽成：Yahoo 有一些门户网站出售他人的产品并获取抽成。例如 Yahoo购物和 Yahoo\
    \ 旅行。\n\n# 营业利润率下降\n\n如果营业利润率较去年下降，请列出可能发生这种情况的原因。\n\n### 需要考虑的因素\n\n这里是由 Investopedia.com\
    \ 提供的重要财务定义：\n\n- 营业利润率 = (营业收入) / (净销售额)\n- 营业收入 = 毛利 – 运营费用 – 折旧 - 摊销\n  - 毛利\
    \ = 收入 – 销售成本\n  - 运营费用可以包括租金、设备、库存成本、营销、工资和研发成本\n  - 折旧 = 将有形资产的成本在其在使用寿命内进行分配。机器和建筑是有形资产的示例。\n\
    \  - 摊销 = 将无形资产的成本在其在使用寿命内进行分配。专利、商标和版权是无形资产的示例。\n\n### 常见错误\n\n- 财务定义弄错\n- 没有向面试官索要定义\n\
    - 没有列出一份导致这种情况发生的重大原因清单\n\n# 回答\n\n候选人：我可以想到其中的几点：\n\n- 该地区的平均薪资下降了。\n- 现在可以在另一个成本更低的国家雇佣人员进行工作。\n\
    - 投资者对该市场失去兴趣，因此价格普遍下降。\n- 经济状况不佳。\n- 更多供应商进入市场，所以现在一切都更便宜了。\n- 今年引入了新技术，从而使一切更高效，因此价格更低。\n\
    - 出现了一个新市场，结果营销成本现在更便宜了。\n- 许多做同样事情的公司失去了兴趣并离开了。现在竞争更少，意味着运营成本更低。\n- 许多竞争对手留存了资金，因为他们认为今年不值得投入。\n\
    \n# 费用差异\n\n如果你预计的费用为 5 亿万美元，而实际差异为 100 万美元，产生这种情况的解释有哪些？准备好给出三个以上的场景。\n\n###\
    \ 需要考虑的因素\n\n- 是正向还是负向差异？\n- 你是否脑风暴了所有可能的原因，最重要的是，你是否脑风暴了面试官可能会说的：“我熟悉这个术语，但我不是线性回归专家，因为我使用回归不像我团队中的数据科学家那样频繁。让我试试看”。\n\
    \n### 常见错误\n\n- 给出一个缺乏自信的回答\n\n# 回答\n\n候选人：线性回归获取大量数据，并尝试寻找自变量（结果）和因变量（原因）之间的关系。\n\
    \n面试官：能给我举个例子吗？\n\n候选人：假设你想看看汽车重量与刹车时间之间是否存在关系。你可能会收集数千个观测值，当你收集这些观测值时，变量之间的关系可能并不清楚。\n\
    \n为了建立汽车重量和刹车时间之间更精确的公式关系，回归将使用“最小二法”从观测样本中推出一个方程。最小二法最小化观测值与公式之间误差的和。如果误差很大，相关性就很弱或可能不存在。\n\
    \n还有一点很有用的记忆：相关性并不意味着因果关系。它只是暗示因果关系。\n\n面试官：好的，谢谢你的说明示例。\n\n"
