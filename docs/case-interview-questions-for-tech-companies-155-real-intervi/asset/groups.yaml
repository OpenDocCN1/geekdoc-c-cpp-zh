    # Chapter 24 Technical


    # 100-Story Building and Two Eggs


    There is a building of 100 floors. If an egg drops from the Nth floor or above,
    it will break. If it''s dropped from any floor below, it will not break. You''re
    given 2 eggs. Find N, while minimizing drops for the worst case.


    Things to Consider


    +   - You have two eggs.

    - You can reuse eggs if they don''t break.

    - Knowledge of computer science concepts, such as binary search, may be helpful.


    Common Mistakes


    +   - Forgetting that there''s two eggs.

    - Forgetting that eggs can be reused.

    - Not attempting a simple base case to get started.


    # Answer


    CANDIDATE: Let''s try a naive approach. Let''s drop the first egg from every 10th
    floor, so 20th, 30th, 40th, etc. Let''s say it breaks on the 30th floor. I know
    the floor is higher than the 20th but lower than the 30th. We would then start
    on the 21st, then 22nd, then 23rd, etc. until it breaks. In the worst scenario,
    it breaks on the 99th floor, which means I have dropped the first egg 10 times
    (10th -> 100th), then the second egg 9 times (91st -> 99th). So we know 19 is
    the answer for this approach. We want to see if we can do better.


    Now I am going to solve for N, where N is the number of drops that is less than
    19. First, we want to try dropping on the Nth floor. If it doesn''t break, we
    now have one less drop to try, so we should go up by N-1 floors, which would put
    us at N+N-1 = 2N-1th floor. We go up by N-2 floors, and etc.


    We can represent this as a formula: N + N-1 + N-2 + ... + 1 >= 100. We say >=
    100 equals the total number of floors might exceed 100, but it is never be below
    100 otherwise we can''t say for our floor is the highest without trying the 100th
    floor.


    We can express this formula as a summation. Notice N+1 is N+1, N-1+2 is N+1, and
    N-2+3 is N+1. We have N numbers in total, so N/2 pairs. We can then express it
    in this formula: N(N+1)/2 >= 100.


    We can then solve for the lowest value of N which should get us this number. Remember,
    it should be lower than 19.


    Turns out 14 is the lowest number of N that satisfies this formula. Then we have
    our answer. Our strategy is:'
  - '[PAGE 243]


    +   - Nth floor: 14th

    - Go up N - 1 floors: 14 + 13 = 27th

    - Go up N - 2 floors: 27 + 12 = 39th

    - Go up N - 3 floors: 39 + 11 = 50th

    - Go up N - 4 floors: 50 + 10 = 60th

    - Go up N - 5 floors: 60 + 9 = 69th

    - Go up N - 6 floors: 69 + 8 = 77th

    - Go up N - 7 floors: 77 + 7 = 84th

    - Go up N - 8 floors: 84 + 6 = 90th

    - Go up N - 9 floors: 90 + 5 = 95th

    - Go up N - 10 floors: 95 + 4 = 99th. If the egg doesn''t break here, we won''t
    get our max number. Let''s say it.

    - Let''s try for the 95th floor all the way up to the 98th floor. It will take
    4 floors.


    We have a total of 14 drops. This is our answer.'
