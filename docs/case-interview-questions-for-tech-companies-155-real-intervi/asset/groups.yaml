  mdcn: "\n\n# 面向七年级学生的电子邮件\n\n为七年级学生设计一个电子邮件系统。\n\n需要考虑的因素\n\n- 广泛思考七年级学生的通信需求，考虑到现在许多人可能不再使用电子邮件。\n\
    - 无需使用 CIRCLES 方法的所有步骤，特别是面试官已经明确表示他她不会考虑七年级学生以外的特定人物（persona）。\n- 深入挖掘七年级学生的通信需求。\n\
    \n常见错误\n\n- 与面试官争论认为幼儿园的小学生永远不会使用电子邮件。\n- 提出的解决方案感觉像普通的电子邮件，而没有针对七年级学生这一特定画像进行定制化。\n\
    \n# 回答\n\n候选者：这个电子邮件系统是仅在学校使用，还是说对使用地点没有限制？\n\n面试官：没有限制。\n\n候选者：好的，我想先确定哪些人会使用这个系统。孩子们是一类用户，但他们的父母和老师肯定可以使用。至少他们会监督孩子使用。\n\
    \n然后我会考虑这个系统的用用例。这个系统的意义是什么？嗯，它是为了让七年级学生在学校之外互相联系，但也可以在学校内使用。他们会给同学、老师和父母发送邮件。你可以发送文本、图像和视频。你还可以在邮件中添加附件。\n\
    \n考虑到这些，我可以到了几个功能和限制：\n\n- 这个系统必须是仅限邀请的系统。你需要管理员将你加入系统。这可以防止不速之客进入。\n- 你不能邀请任何你不认识的人。人们必须先成为朋友。这是防止不速之客的第二道安全措施。\n\
    - 该系统无法接收外部邮件也无法向外部发送邮件，白名单中的邮箱除外。只有老师和父母可以与此系统交互。\n- 系统有严格的过滤，所有内容都是对儿童友好的。\n\
    - 此电子邮件有 IP 限制。孩子们只能在家里或学校登录。\n- 登录主要由父母或老师处理，因为七年级学生可能很难记住自己的密码。管理员可以轻松重置密码。\n\
    \n它的功能与现有电子邮件非常相似。这更像是一个内部的封闭系统，但记住你随时可以和你想认识的人成为朋友。也许会有“结识日本的小学生”活动，如果他们也使用类似的系统，我们可以通过这个电子邮件来实现。如果没有，我们可以把他们的邮箱加入白名单。\n\
    \n最担心的问题绝对是安全。我们不希望出现未经授权的访问，而且绝对要确保儿童安全。\n\n# 乳糜泻患者的 App\n\n为受乳糜泻影响的患者社区设计一个\
    \ App。\n\n需要考虑的因素\n\n- 乳糜泻患者对与小麦相关的食物物质产生不良反应。\n- 关注 App 技术如何帮助患者更舒适地与疾病共处。\n\n\
    常见错误\n\n- 与面试官交流感到困难，且没有提供更多关于乳糜泻症的背景信息。\n\n# 回答\n\n候选者：为了确保我们理解，乳糜泻患者不能食用含有面质的食物和其他物质。如果摄入，会触发小肠道的反应，导致腹泻、腹胀、腹痛等各种症状以及副作用。长期来看，可能会导致维生素或矿物质缺乏等严重影响。\n\
    \n面试官：是的，得对。\n\n候选者：当你提到 App 时，我假设你想要一个移动 App？\n\n面试官：是的。\n\n候选者：可以给我一点时间头脑风暴吗？\n\
    \n候选者花了一分钟。\n\n候选者：好的，我有几个想法：\n\n- **搜索数据库**。人们可以通过文字或语音查询各种食物和物品，查看它们是否安全食用。他们可以用手机拍照询问社区。如果可能的话，我们希望处理并自动识别这是什么食物。无论如何，如果某些东西不在数据库中，社区成员可以回答并将其添加到数据库。\n\
    \n- **症状查询**。与搜索数据库的思路一样，但针对的是症状。语音输入你的症状；App 将检查数据库中这是否为乳糜泻的可能症状。如果不是，社区成员可以针对这一症状提供建议。\n\
    \n- **餐厅查询**。并不是所有餐厅都对麸质友好。找到一个经过认证可以容纳无麸质饮食的餐厅目录将非常有帮助。\n\n# 销售与库存跟踪\n\n在白板上设计一个销售和库存跟踪系统。\n\
    \n需要考虑的因素\n\n- 销售和库存系统用于跟踪库存并记录产品销售情况。\n- 如果一家公司的库存超过了其销售能力，公司不仅要花费仓储成本，而且购买库存的资金无法投入到业务的其他领域。\n\
    - 关键要素之一是准确预测需求并购买最佳数量的库存。\n\n常见错误\n\n- 在宣布自己不熟悉销售和库存跟踪系统后放弃问题。\n- 不愿意在白板上画画。\n\
    - 仓于给出解决方案，认为考虑到候选人不熟悉销售和库存系统，解决方案本身并不重要。\n\n# 回答\n\n候选者：让我们思考销售和库存跟踪系统需要什么。在基础层，你应该能够添加报价和订单。屏幕大部分空间被查看特定订单占据。\n\
    \n订单应该包含公司、联系人、电话、订单日期以及发货地址和账单地址。我们还需要订单状态：已支付、处理中、已开票、已取消等。它还应该有订单和价格明细。例如，你订了\
    \ 4 个 X 和 2 个 Y，每个的价格是多少，小计是多少。\n\n让我来画一下用户界面。\n\n候选者在板上画了以下内容。\n\n| 姓名 | Awesome\
    \ Corp | 订单号 | XX002 |\n| :--- | :--- | :--- | :--- |\n| 联系人 | John Doe | 状态 |\
    \ 已支付 |\n| 电话 | 123-456-7890 | 支付方式 | 信用卡 |\n\n| 订单号 | 状态 | 项目 | 描述 | 数量 | 单价\
    \ | 折扣 | 小计 |\n| 发货地址 | 123 Happy Street Haigtown, AA 12345 United States | 01234\
    \ | 法红酒 | 2 | $5 | 0% | $30 |\n| 客户 | 123 Happy Street Haigtown, AA 12345 United\
    \ States | 23192 | 波本忌 | 1 | $10 | 0% | $10 |\n| 账单地址 | 59890 | 威士忌 | 4 | $15\
    \ | 0% | $60 |\n| 付款条件 | 15天内付款 | | | | | |\n| 开票日期 | 2010/09/01 | | | $80 |\n\
    | 付款日期 | 2010/09/02 | | | $10 |\n| 到期日期 | 2010/09/15 | | | $90 |\n\n# 建筑电梯\n\n\
    为以下情况设计电梯系统：\n\n- 100 层建筑\n- 3 个租户\n  - 租户 1 占据顶层 10 层\n  - 租户 2 占据租户 1 下方的 45\
    \ 层\n  - 租户 3 占据租户 2 下方的 45 层\n\n需要考虑的因素\n\n- 面试官正在寻找逻辑严密的电梯分配方案。\n- 澄清假设，如人口、用高峰期和平均负载。\n\
