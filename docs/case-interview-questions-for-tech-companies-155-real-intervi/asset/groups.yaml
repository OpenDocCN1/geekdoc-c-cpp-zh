  mdcn: "\n\n-   列出解决方案：针对利用技术趋势和客户行为的三个大想法进行头脑风暴。使用以下框架获取灵感：\n    1) 反转情况以发现新的可能性。\n\
    \    2) 混合产品属性以获得新的组合。\n    3) 挑战现状。\n-   评估权衡：定义你的权衡标准，并通过优缺点列表分析解决方案。\n-   总结你的建议：明确说明你推荐的产品或功能，总结其对用户的益处和/或，并解释为什么与其他方案相比你更倾向于这种方案。\n\
    \n## 群组分析\n\n随时间衡量并比较特定客户细分市场的差异。\n\n## 关键路径依赖\n\n活动序列中前置和后续任务之间的战略关系，影响项目的结束日期。前置任务必须在后续任务开始之前完成。\n\
    \n## DIGS 方法™\n\n为了获得工作录用，我认为候选人必须做两件事：平易近人并展现出他们胜任该工作的信誉。DIGS 方法™ 是一种行为面试框架，能够提高你回答中的信力和可能性。\n\
    \n- 戏剧化场景（Dramatize situation）：提供背景和细节，强调你的工作、项目或产品的重要性。\n- 指出替代方案（Indicate the\
    \ alternatives）：通过列出解决问题的三个不同方法，表现出深思熟虑和分析性。\n- 你的做法（Go through what you did）：说服听者你是推动力量。\n\
    - 总结你的影响（Summarize your impact）：提供数据和定性陈述来验证你的影响。\n\n## 5Es 框架\n\n一个用于头脑风暴客户体验不同阶段的缩写。换句话说，使用此框架可以快速地构建客户旅程图。这就是\
    \ 5Es：\n\n- 吸引（Entice）：什么触发了用户进入 UX 漏斗？\n- 进入（Enter）：UX 漏斗的前几步是什么？\n- 参与（Engage）：用户正尝试完成什么任务？\n\
    - 退出（Exit）：用户如何完成任务？\n- 延伸（Extend）：在用户完成任务后发生了哪些后续行动？\n\n客户旅程图可以帮助人们更有效地回答产品设计问题。\n\
    \n## 五 W 和 H\n\n一个用于获取某情况完整事实的问题清单。例如，在了解新产品时，听者想要知道的是：\n\n- 它是什么？\n- 它是给谁用的？\n\
    - 什么时候准备好？\n- 在哪里可以买到？\n- 我为什么应该买它？\n- 它是如何工作的？\n\n## 五问法\n\n一种确定特定情况原因的技术。它涉及连续提问“为什么？”\n\
    \n## 问题树\n\n一种问题解决图表，将“为什么”或“如何”的问题分别分解为可识别的根源或潜在解决方案。\n\n## 营销漏斗\n\n跟踪客户走向购买产品或服务的旅程的分析模型。通用四个步骤，由\
    \ AITP 缩写表示：\n\n- 意识（Awareness）：提高产品品牌的知名度。\n- 兴趣（Interest）：激发对产品的兴趣（它是做什么的，如何工作以及它提供什么利益）。\n\
    - 尝试（Trial）：迫使潜在用户尝试产品。\n- 购买（Purchase）：让客户购买产品。\n\n## 最少可行产品 (MVP)\n\n为产品概念收集用户反馈的基础功能集。它可以是一个功能完全的产品，也可以是纸上的草图。\n\
    \n## MOB\n\n一种评估产品广告或商业效果的营销框架。\n\n- 记忆点（Memorable）：它吸引了你的注意力吗？它值得与你的朋友、相识和社交媒体进行未来的讨论吗？\n\
    - 噢，产品！（Oh, Product!）：产品和品牌的推广是否清晰且明确？\n- 益处（Benefit）：它是否解释并为产品的益处提供了证据？消费者是否有明确理由选择该产品而不是竞争对手的产品？\n\
    \n## 三法则\n\n一种沟通原则，建议三成一组的回答往往更有效且更令人满意。\n\n## 人画像\n\n一组客户的代表，由他们的目标和目的定义。详细的人画像可以根据代表性人物的人口统计、心理特征和行为来描述。\n\
    \n## 优缺点分析\n\n一种沟通原则，如果演讲者提供平衡的观点（换句话说，即优点和缺点），特定的观点更容易被接受。\n\n## 波特五力\n\n由哈佛商学院教授迈克尔·波特提出的，关于影响产品或服务的竞争力量的模型。以下是波特五力的关键组成部分：\n\
    \n- 新进入者的威胁\n- 替代品的威胁\n- 买方的议价能力\n- 供应商的议价能力\n- 行业竞争\n\n## 刀刀片策略\n\n一种流行的商业策略，企业以成本或更低的价格出售平台（如剃须刀）。然后企业以丰厚的利润销售补充产品（如剃须刀），以抵消销售平台减少的利润。\n\
    \n## 根因分析树\n\n一种分级图表，用于识别问题的根源，并提供潜在的纠正措施以改善结果或防止再次发生。\n\n## SCAMPER\n\n一种用于开发想法的创意思维框架。\n\
    \n- 替代（Substitute）：什么可以被替代？\n- 结合（Combine）：什么可以结合？\n- 适应（Adapt）：什么可以被适应？\n- 修改（Modify）：什么可以被修改？\n\
    - 改造（Put to another use）：这可以用于其他用途？\n- 消除（Eliminate）：什么可以被消除？\n- 反转（Reverse）：什么可以反转或重新排列？\n\
    \n## SMART 目标\n\n一个设定目标的有用框架。\n\n- S: 具体（Specific）\n- M: 可衡量的（Measurable）\n- A:\
    \ 可实现的（Achievable）\n- R: 相关（Relevant）\n- T: 有期限（Time-bound）\n\n## SWOT 分析\n\n\
    一种用于评估因素的战略规划技术。\n\n- 优势（Strengths）：有什么优点？\n- 劣势（Weaknesses）：有什么缺点？\n- 机会（Opportunities）：有什么可能性？\n\
    - 威胁（Threats）：有什么风险？\n\n## 病毒循环\n\n一种现有用户将新用户带来产品的机制。\n\n## 瀑布式开发\n\n一种线性顺序项目管理方法。\n\
    \n## 第 4 章分析\n\n估算成本是多少。\n"
