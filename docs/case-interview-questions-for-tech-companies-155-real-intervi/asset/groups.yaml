  mdcn: "\n\n## 第 6 章 分析学：数据科学\n\n## 称八个球\n\n你有八个大小完全相同的球。其中 7 个的重量相同，有一个球略重。你如何通过使用天平并仅称重两次来找到那个较重的球？\n\
    \n 待考虑的因素\n\n- 设想一个例子。\n- 考虑不同的边界情况。\n\n### 常见错误\n\n- 假设使用的是电子秤而不是天平。\n- 针对天平的最优情况进行求解（即只称重一次）。\n\
    - 错误地假设不使用天平就能确定哪一个球较重，仅通过肉眼识别。\n\n请在下方写出你的解题步骤。根据需要做出任何假设。答案在下一页。\n\n## 回答\n\n\
    候选人：我会进行 3 对 3 的称重。我们有两种可能：\n\n- 重球不在其中球中。它在我没称重的 2 个球中的一个。然后我对剩下的 2 个球进行 1 对\
    \ 1 的称重来找到它。我只称了两次。\n- 重球在 3 个球中的一个。我排除另外 5 个球。然后我从 3 个球中取出 1 对 1 进行称重。重球在这 2\
    \ 个中的一个（这样我就知道了），或者重球不在其中，那么它一定是我没称过的那个第 3 个球。我只称了两次。\n\n## 假阳性\n\n哪种更好？10 个假阳性还是\
    \ 80 个假阳性？\n\n 待考虑的因素\n\n- 如果你不清楚定义，不要犹豫向面试官提问。\n- 如果面试官没有对你的澄清请求做出回应，请推理出可能的定义。然后向面试官确认你是否得出了正确的定义。\n\
    \n### 常见错误\n\n- 当面试官拒绝为你定义不明确的术语时闹脾气。\n\n请在下方写出你的解题步骤。根据需要做出任何假设。答案在下一页。\n\n##\
    \ 回答\n\n候选人：80 个假阳性。这意味着我们还有很大的改进空间。想一下，如果我有一个复杂的产品，但我只看到了 10 个假阳性，那么一定还有很多我们尚未发现的假阳性。有了\
    \ 80 个，我感觉更有信心。我确定还有一些我们没发现的，但我们这次发现了很多。\n\n面试官：10 个假阳性难道不是意味着你的产品更成熟吗？\n\n候选人：可能吧，也可能意味着我们的测试不够彻底。我宁愿选择稳妥的一边。\n\
    \n## 第 7 章 产品设计：用户旅程图练习\n\n## TurboTax 旅程\n\n为 Intuit TurboTax 用户创建用户旅程图。\n\n\
    \ 待考虑的因素\n\n5Es 框架\n\n## 回答\n\n| 吸引 (Entice) | 进入 (Enter) | 参与 (Engage) | 离开 (Exit)\
    \ | 延伸 (Extend) |\n| --- | --- | --- | --- | --- |\n| • 噢，报税日快到了 | • 准备购买 TurboTax<br>•\
    \ 研究 TurboTax 在线版与桌面版的区别<br>• 购买桌面版桌面 | • 获取个人信息<br>• 对输入什么感到困惑<br>• 在线研究问题<br>•\
    \ 尝试联系 Intuit 客服<br>• 获取答案并继续流程<br>• 联系公司、银行和其他第三方获取补充信息 | • 在线或通过邮件提交纳税单 | •\
    \ 检查退税状态（如果适用）<br>• 回应税务局的其他查询（如果适用）<br>• 注册明年购买 TurboTax 的提醒 |\n\n## Amazon 旅程\n\
    \n为 Amazon 客户创建用户旅程图。\n\n 待考虑的因素\n\n5Es 框架\n\n## 回答\n\n| 吸引 (Entice) | 进入 (Enter)\
    \ | 参与 (Engage) | 离开 (Exit) | 延伸 (Extend) |\n| --- | --- | --- | --- | --- |\n\
    | • 研究产品 | • 在 Amazon 或 Google 上搜索选项<br>• 阅读评论，包括 Amazon 和网络上找到的其他网站<br>• 建立考虑集\
    \ | • 选择购买的产品<br>• 价格<br>• 研究购买政策，包括销售税以及运费和退货费 | • 完成购买<br>• 检查配送状态 | • 退货<br>•\
    \ 联系客服<br>• 发布产品评论 |\n\n## 第 8 章 产品设计：痛点练习\n\n## Facebook 痛点\n\n吐槽 Facebook。\n\
    \n## 回答\n\n1. 觉得在 Facebook 上浪费时间很愧疚。\n2. 嫉妒他人推测中正在做的很棒的事情。\n3. 在 Facebook 上发布敏感信息招惹麻烦，如丢工作。\n\
    4. Facebook 消息必须在移动设备上的独立 App 中查看。\n5. 垃圾信息。\n6. 新闻动态算法的不断变化使得难以按时间顺序查看动态。\n7.\
    \ 隐私设置令人困惑；我不认识的人正在查看本应面向小众的图片和其他信息。\n8. 广告太多。\n9. 搜索在查找朋友状态消息时没用。\n10. Facebook\
    \ 是肤浅的。它给用户留下了朋友之间有强纽关系的印象。\n11. 拒绝想成为我 Facebook 好的熟人很尴尬。\n\n## 众筹网站痛点\n\n吐槽 Kickstarter\
    \ 的客户体验，而非创作者的体验。\n\n## 回答\n\n1. 发货日期不明确。\n2. 发货日期延迟。\n3. 有些产品从未发货。\n4. 不知道邀请谁。\n\
    5. 产品多到让人眼花。\n6  对项目的主张缺乏验证。\n7. 热门赞助类别有限且已售罄。\n8. 没有更新或更新有限。\n9. 不喜欢朋友要求支持某个项目时的同伴压力。\n\
    10. 关于创作者的信息有限。\n\n## 第 9 章 产品设计：头脑风暴练习\n\n## 儿童版 Netflix\n\n针对 10 岁以下儿童，脑暴至少\
    \ 10 个标记不适宜内容的解决方案。\n\n## 回答\n\n基于以下标准标记内容：\n\n1. 美国电影协会 (MPAA) 分级。\n2. 已知的包含不当内容的导演名单。\n\
    3. 已知的包含不当内容的演员名单。\n4. 已知的包含不当内容的电影和电视节目工作室名单。\n5. 内容描述。\n6. 使用人工审核员对不当内容进行视觉识别。\n\
    7. 使用人工智能对不当内容进行视觉识别。\n8. 不当语言的音频识别。\n9. 字幕中不当语言的文本识别。\n10. 众包用户举报。\n\n## Google\
