    # Corporate Income Tax


    Can you describe how corporate income tax is calculated?


    Things to Consider


    +   - Start with a definition.

    - Help illustrate the definition with an example.

    - Use the whiteboard to increase listener comprehension.


    Common Mistakes


    +   - Giving a definition without providing an example, making it hard to illustrate.


    # Answer


    CANDIDATE: The U.S. corporate tax rate is similar to personal taxes. The corporate
    tax rate varies from 15% to 35%, depending on the amount of corporate income subject
    to tax for the year. Let''s say your corporate net income is $8,000,000, so your
    tax would be:


    +   - $113,900 baseline tax for this income bracket, plus

    - 34% of income over $335,000 and under $10,000,000. The income over $335,000
    is $7,665,000.

    - 34% of $7,665,000 is $2,606,100.

    - So your total corporate tax is $113,900 plus $2,606,100 = $2,720,000.


    There is a tax rate depending on which bracket you fall in, and you pay a separate
    amount for each of those brackets you fall in. In our previous example, if we
    had made over $10,000,000, we would be paying the portion between $335,000 and
    $10,000,000 at 34% and portions over $10,000,000 to the next tier of some other
    rate.'
  - '[PAGE 231]


    # Chapter 23 Business Development


    # Car Dealer Partner Leaving


    A car dealer partner wants to stop doing business with Uber. What should you do?


    Things to Consider


    +   - Ask why they want to leave.

    * Explore whether Uber can address the situation.

    * If the issue is money, are there non-monetary ways to address the issue?


    Common Mistakes


    +   - Not offering creative ideas to save the partnership, if desired.


    # Answer


    CANDIDATE: I would begin by asking them why they are considering leaving. This
    could be due to multiple problems:


    +   - **They want more money.** They might think their share isn''t high enough,
    and they want out of the relationship.

    * **They found a competing offer by a competitor.** A competitor has approached
    them with a better offer.

    * **We''ve worried them.** Maybe they were expecting a better revenue share as
    users increased, and we didn''t do that. Maybe our services are getting a bad
    rap for some reason, and it is affecting them.


    Which one do you want to focus on?


    INTERVIEWER: These are all interesting reasons. Walk through your thoughts for
    each one.


    CANDIDATE: Okay. We need to see how much this partner is contributing. If they
    are only contributing a small amount of market share, then it''s something to
    note. Same with if they are contributing a lot. Furthermore, we need to think
    about precedent. If we give them what they want, word will get out, and we might
    have to provide the same deal to other partners. This will not only affect car
    dealerships in this territory, but also branches of this car dealership in other
    territories. Now to solve each of these problems above:


    +   - **They want more money.** If they have a large market share, can we see
    if giving them more money will affect us negatively. I mean, if we''re not making
    money with the new price, we might want to reconsider. In addition, we need to
    take account indirect revenue sources, such as branding or PR. We can also negotiate
    for things like a ladder system.

    * **They found a competing offer by a competitor.** Who is this competitor? Will
    they be a huge threat? How much market share will our competitor gain winning
    this dealership? This will set off a catalyst reaction and make our other partnerships
    leave? I would check if our contracts have any restrictions against this and see
    if I get them to change their minds. If the competitor is offering a better deal,
    then we need to be aware of what the terms for are and see if we need to consider
    those'
