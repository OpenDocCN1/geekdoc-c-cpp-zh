    # Facebook Fraud


    What problems do you think Facebook faces with fraud?


    Things to Consider


    +   - What kind of fraud are we dealing with? Some possibilities include identity,
    payment, advertiser and publisher fraud.

    - What does the fraudster have to gain by committing different types of fraud?

    - What kind of fraud tactics are least likely to evade Facebook''s detection team?


    Common Mistakes


    +   - Assuming that Facebook doesn''t have fraud issues given that it''s not an
    ecommerce company.


    # Answer


    CANDIDATE: I can think of a few:


    +   - Fake users trying to pretend they are Facebook personnel, trying to get
    people''s identity or account password.

    - Users trying to pretend to be someone they''re not like a celebrity.

    - Users making fake pages pretending to be a certain organization or company.

    - Advertisers running ads for free, using questionable payment credentials.

    - Advertisers running ads that are not advertising what they are actually selling.

    - Advertisers running ads that lead to phishing sites.

    - Advertisers running ads that promote banned items, like counterfeit luxury goods.

    - Users trying to post content that is not allowed, like hate speech or nudity.'
  - '[PAGE 224]


    # Xbox Live Video Purchase


    Tell me all the cost of goods sold (COGS) used for an Xbox Live video purchase.


    Things to Consider


    +   - How much does Xbox pay for cloud hosting?

    - How much does Xbox have to pay the content owners?

    - How much does Xbox have to pay to process payment transactions?


    Common Mistakes


    +   - Incorrectly including capital expenditures such as real estate for servers.

    - Incorrectly including engineers'' salaries. Salaries should be classified as
    operating expense.


    # Answer


    CANDIDATE: Since Microsoft owns Xbox, I code and user data to be hosted by Azure,
    Microsoft’s in-house cloud service.


    I can think of the following COGS that would scale with additional video purchases:


    +   - Azure Cloud Service: this negotiated cost that scales per unit would include
    the appropriate processing power, utilities, labor, and real estate costs needed
    to host each video purchase.

    - Royalty / Licensing Fee: Selling other people''s content requires us giving
    them a major cut.

    - Transaction Processing Fee: We may be getting payment through credit cards or
    other purchasing methods. These incur a cost.

    - Customer Service / Call Center Costs: This is a fixed operational expense, but
    it''s likely that this is accounted for in COGS, especially for Software as a
    Service products.'
