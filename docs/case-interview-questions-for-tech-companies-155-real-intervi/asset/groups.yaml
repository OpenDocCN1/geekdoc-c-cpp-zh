    # Chapter 10 Product Design: Putting it Together


    # Amazon Mayday in Gmail


    Let''s say we wanted to implement an Amazon Mayday-like feature in Gmail. How
    would that work?


    Things to Consider


    +   - Distill the key features of Amazon Mayday and map the appropriate features
    to Gmail.

    - Be prepared to defend design decisions including features left in and features
    left out.


    Common Mistakes


    +   - Making incorrect assumptions on how the feature works, especially for those
    who have never used it before.


    # Answer


    CANDIDATE: Just so we are on the same page, Amazon Mayday is a feature that is
    on the Fire tablet that is essentially a panic button that lets you connect with
    a tech support for help. You can draw on your screen where you want to go, do
    it for you, or give you instructions on how to do it.


    INTERVIEWER: That is correct.


    CANDIDATE: Okay. Can I get some time to brainstorm?


    Candid takes one minute.


    CANDIDATE: Okay, I have a few ideas, but first me point out some things. This
    needs to be displayed prominently over the Gmail page. It needs to be ever present
    no matter which page you are on. I would say somewhere in the top would be nice.
    Whenever the user hovers over it, it should display a description for what it
    is.


    When the user presses it, it should automatically connect with a tech support.
    First though, it would detect which language you need it in. Since Gmail definitely
    tracks language, this makes it easier. The user gets connected through Google
    Hangouts or Gmail (email thread). He has then three options:


    +   - Remote Desktop. The customer service representative can remote desktop to
    fix the problem. The user is warned that the customer will be able to see his
    email, which may be sensitive.

    - Audio/Text. The representative can use voice (if the user agrees and has a microphone
    and this is through Hangouts) or message the user through Hangouts or email. Instructions
    can be given this way for the user to follow.

    - Video. Hangouts can do video calling or upload videos. The user can follow through
    that.


    The biggest concern here is that the user must be the one that chooses option
    to use. If we offer too many it could confuse the users, so we need to be selective.
    Looking back, I went into too much breadth.'
