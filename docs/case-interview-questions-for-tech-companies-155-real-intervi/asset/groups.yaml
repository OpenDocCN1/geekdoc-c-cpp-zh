  mdcn: "\n\n# 本地美食\n\nEat Local 是一家位于华盛顿州西雅图的小型精品杂货连锁店。去年，它的年收入为 210 万美元，销售成本为 170\
    \ 万美元。\n\n考虑到其产品的易腐性，Eat Local 平均维持着 11 天的库存。\n\n年度库存周转率是多少？Eat Local 平均拥有多少的库存？\n\
    \n# 答案\n\n库存周转率 = 一年的天数 / 平均库存\n\n库存周转率 = 365 / 11 = 33.2\n\n平均库存 = 销售成本 / 库存周转率\
    \ = $170 万 / 33.2 = $5.1 万\n\n# 企业所得税\n\n你能描述一下如何计算企业所得税吗？\n\n### 需要考虑的因素\n\n\
    - 从定义开始。\n- 用示例帮助说明该定义。\n- 使用白板来提高听者的理解。\n\n### 常见错误\n\n- 只给出定义而不提供示例，导致难以说明。\n\
    \n# 答案\n\n应聘者：美国的企业所得税率类似于个人税。企业税率在 15% 到 35% 之间波动，取决于当年应纳税的企业收入金额。假设你的公司净利润为\
    \ 8,000,000 美元，那么你的税额为：\n\n- 该收入档位的 113,900 美元基础税，加上\n- 超过 335,000 美元且低于 10,000,000\
    \ 美元部分的 34%。超过 335,000 美元的收入为 7,665,000 美元。\n- 7,665,000 美元的 34% 是 2,606,100 美元。\n\
    - 因此，你的总企业税为 $113,900 + $2,606,100 = $2,720,000。\n\n税率取决于你所属的区间，你对你所属的每个区间都要支付一个单独的金额。在我们之前的例子中，如果我们的收入超过了\
    \ 10,000,000 美元，我们将以 34% 的税率支付 335,000 美元到 10,000,000 美元之间的部分，超过 10,000,000 美元的部分将按下一级的其他税率支付。\n\
    \n# 第 23 章业务发展\n\n## 汽车经销商合作伙伴离开\n\n一位汽车经销商合作伙伴想停止与 Uber 合作。你应该怎么办？\n\n### 需要考虑的因素\n\
    \n- 询问他们想要离开的原因。\n- 探索 Uber 是否可以解决该状况。\n- 如果问题是钱，是否有非货币的方式来解决这个问题？\n\n### 常见错误\n\
    \n- 如果对方有意，没有提供创新的想法来挽留合作伙伴关系。\n\n# 答案\n\n应聘者：我将首先询问他们为什么在考虑离开。这可能是由于多个问题导致的：\n\
    \n- **他们想要更多的钱。** 他们可能觉得自己的分成不够，想结束这段关系。\n- **他们发现了竞争对手提供的竞争报价。** 一家竞争对手带着更好的报价接触了他们。\n\
    - **我们让他们忧心了。** 也许他们期望随着用户的增加而获得份额的收入分成，但我们没有做到。也许我们的服务由于某种原因声誉变差了，这影响了他们。\n\n\
    你想关注哪一个？\n\n面试官：这些都是很有趣的原因。请说明你对每种情况的思路。\n\n应聘者：好的。我们需要看看这个合作伙伴贡献了多少。如果他们只贡献了少部分市场份额，那么这值得注意。如果他们贡献了很大也是如此。此外，我们需要考虑先例。如果我们给了他们他们想要的，风声就会传出去，我们可能不得不为其他合作伙伴提供同样的交易。这不仅会影响该地区的汽车经销商，还会影响该经销商在其他地区的分部。现在来解决上述的每一个问题：\n\
    \n- **他们想要更多的钱。** 如果他们拥有很大的市场份额，我们可以看看给他们更多钱是否会产生我们产生负面影响。我的意思是，如果按照新价格我们无法盈利，我们可能需要重新考虑。此外，我们还需要考虑间接收入来源，例如品牌建设或公关。我们还可以针对类似阶梯式系统之类的方案进行谈判。\n\
    - **他们发现了竞争对手提供的竞争报价。** 这个竞争对手是谁？他们会是一个巨大的威胁吗？我们的竞争对手赢得这家经销商将获得多少市场份额？这会引发连锁反应并导致我们的其他合作伙伴离开吗？我会检查我们的合同是否有任何针对此的限制，并看看我能否让他们改变主意。如果竞争对手提供了更好的交易，那么我们需要了解条款是什么，并看看我们是否需要与其他合作伙伴一起考虑这些条款。最重要的是，我将开始检查竞争对手是否联系了我们正在合作的其他合作伙伴。\n\
    \n- **我们可能以某种方式得罪了他们。** 那么，我们需要修复它。对困惑表示歉是一个很好的开始，但显然要先确保我们确实搞错了。弄清楚真正的问题是什么并修复它。这可能是文化问题，也可能是某些简单的误解。如果这是我们方面的严重问题，比如我们的服务声誉变差，那是我们无论如何修复的问题。\n\
    \n# 在 X 市招募司机\n\n你将如何招募司机？你认为在 X 市的主要挑战会是什么？\n\n### 需要考虑的因素\n\n- 你的目标群体是谁？\n-\
    \ 你会在哪里找到他们？\n- 你如何说服他们签约？\n\n### 常见错误\n\n- 没有提到司机留存。根据 Uber 的数据，一半的司机在一年后辞职。\n\
    \n# 答案\n\n应聘者：你脑海中是指哪座城市？\n\n面试官：让我说是，中国的一个大城市。\n\n应聘者：好的，让我谈谈第一个挑战：\n\n- **竞争对手。**\
    \ Uber 在中国有一个大竞争对手，滴滴出行。滴滴有一个独特的优势。他们与阿里巴巴和腾讯有强大的合作伙伴关系。这些合作已经获得了成效。例如，滴滴在应用内集成了支付宝和微信。\n\
    - **支付。** 我之前提到过这个，但中国大多数人使用支付宝或微信支付，所以如果我们不这样做，就很难进入市场。Uber 最近整合了支付宝，但腾讯似乎不会与我们合作。事实上，腾讯刚刚在微信（中国第一大移动社交应用）中屏蔽了支付宝。这让事情变得困难。\n\
    - **政府。** 虽然我不确定它是如何运作的，但这可能是一个问题。我们需要招募当地人才，与政府合作。\n\n现在我将为每个问题提供解决方案：\n\n- **应对竞争。**\
    \ 我们需要找到一种与滴滴竞争的方法。我们可以提供特殊优惠或积分。\n- **支付解决方案。** 我们需要与支付宝和微信合作。\n- **政府解决方案。**\
    \ 我们需要了解出租执照制度。\n\n# 激励司机\n\n你将如何激励司机在周六开车？你能想到一种不需要 Uber 花费任何钱的方法吗？\n\n### 需要考虑的因素\n\
    \n- 司机的非货币动力是什么？（提示：避免做杂事。）\n\n### 常见错误\n\n- 胡言乱语。\n- 没有框架。\n- 陷入瓶颈，尤其是关于非货币激励。\n\
    \n# 答案 \n\n应聘者：能给我一点时间头脑风暴吗？\n\n应聘者思考了一分钟\n\n应聘者：我有几个想法：\n\n- **活动促销。** 与当地活动建立联系，鼓励参与者通过\
    \ Uber 到达。需求越多供给越高。当更多乘客想打 Uber 去活动时，司机就会出现。我们甚至可以从应用内推广活动盈利。\n- **邮件营销。** 让我们向我们的乘客发送邮件来推广\
    \ Uber。我们可以谈谈去某个地方而不用担心停车有多好。我们还可以告诉他们关于豪华车的特殊优惠；当人们想要给约会对象留下印象时，这些车非常完美。\n- **接触司机。**\
    \ 我们可以通过推送通知向他们展示平均叫车人数。我们还可以向他们展示周六时薪可能更高。谁不想竞争他们所需的效率呢？\n\n在这三个中，我最喜欢活动促销。\n\
    \n面试官：你能详细说明一下吗？\n\n应聘者：好的，它是这样运作的：\n\n- 联系当地活动推广者。\n- 因为他们想在 Uber App 上推广他们的活动。向活动推广者解释广告可能花费的费用。\n\
    - 看看活动推广者是否愿意提供一个方便 Uber 司机停车接送乘客的地方。\n\n面试官：广告什么时候出现？\n\n"
