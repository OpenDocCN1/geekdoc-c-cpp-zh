  - '[PAGE 203]


    # Attracting New Businesses


    What strategies would you use to attract new business?


    Things to Consider


    +   * Who is the prospect?

    * Can you reach the prospect?

    * What are the prospect''s needs?

    * How will you attract the prospect''s attention?

    * How are you going to communicate your product''s benefit with the prospect?

    * How are you going to convey trust with the prospect?

    * Have you clearly defined the next step with the prospect?


    Common Mistakes


    +   * Assuming prospects are familiar with the category.

    * Using formal, officious language.

    * Not coming up with a compelling value proposition.


    # Answer


    CANDIDATE: I would first think about what new businesses need and what their current
    situation is. Most businesses are going to be startups, they''ll be strapped for
    cash. They are focused on customer adoption, and they believe creating amazing
    products is the best way to do so. They don''t want to be distracted with complex,
    expensive tools that don''t work.


    So here is where Facebook comes in. I would do the following:


    +   * Inexpensive starter plans. Take Facebook ads for example. Maybe startups
    don''t need more than 5-10 active campaigns at a time. So let''s create a self-serve
    system where they pay a low cost for a fixed amount of impressions. As they grow
    and scale, they can pay more to not only get more impression also get more customization
    and targeting options.

    * Easy setup. We need to make tools that are fast, fluid, and intuitive to use.
    We need to reduce the overhead so startups don''t feel like they''re wasting time.
    This means they don''t need to have a long set up with us. We also want to easily
    and quickly demo our product to them.

    * Responsive support. Stellar support is the key to happy, repeat customers. They
    should feel they can always reach out whenever they need something and get help.


    In summary, this is my three pronged approach. Between good results and stellar
    service, I''m confident this approach will generate effective word-of-mouth marketing.'
  - '[PAGE 204]


    # Product X to the Global Marketplace


    What would you do to bring product X to the global marketplace?


    Things to Consider


    +   - Is there demand in the new global market?

    - Is the new global market already familiar with the product?

    - Do you have relationships with the local market including suppliers and regulatory
    bodies?


    Common Mistakes


    +   - Not considering the partner ecosystem necessary to make product X successful.

    - Not considering differences in local culture may affect new market adoption.

    - Not factoring in government regulations and constraints.


    # Answer


    CANDIDATE: I would do the following:


    +   - Understand which countries/territories/regions are the best for us to start
    with. This can include market share, competition, ease of entry, etc. We can''t
    realistically bring our product to every country in one we go.

    - See if we need to set up offices in major regions.

    - See if we need to work with local partners and have them as affiliates.

    - See if we need to take into account the local culture or religion and modify
    our products accordingly.

    - Check the local major conventions to promote our product.

    - Check the most effective local advertising format, whether it is online or offline,
    and what shapes and forms and take that into account.

    - Make sure we are offering the most convenient way to pay, including pre-paid
    cards, carrier billing, mobile payment or other forms of online payment besides
    what we are used to.

    - See if we need to have a team of business developers, customer service, the
    team managers, product managers or operations to target that region. We can also
    consider whether to have the team here or locally.


    See if we need to change our pricing model and price to match the local business
    model.'
