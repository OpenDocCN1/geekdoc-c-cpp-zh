    Bing，我们甚至可以为特定餐厅展示广告。我们甚至可以在人们等待食物时这样做。我知道这在中国是一个新概念，人们可以查看广告、订阅优惠并获得食物折扣。

    - **Microsoft Azure。** 假设我们正在经营一家巨大的连锁餐厅。对一切进行数据追踪是非常有趣的。我们可以根据位置查看哪些菜品受欢迎，我们还可以看到其他事情，如习惯（我们可以根据位置提供不同的价格）和人流量。我们可以通过
    Azure 完成这一切，并上传到中央数据库中。

    - **Bing 推荐。** 当人们坐下点餐时，他们可以使用 Bing 推荐来查看哪些好，哪些不好。我们甚至可以鼓励用户写评论并拍照以获得折扣。这为 Bing
    推荐填充了数据并让人们认识了 Bing。


