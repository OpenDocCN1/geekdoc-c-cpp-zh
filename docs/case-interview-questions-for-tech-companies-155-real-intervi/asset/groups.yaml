    # Email for 7th Graders


    Design an email system for a 7th grader.


    Things to Consider


    +   - Think broadly about the 7th grader''s communication needs, especially since
    many might not use email today.

    - No need to use all steps of the CIRCLES method, especially since the interviewer
    has made clear that he or she won''t consider personas outside of 7th graders.

    - Dive deep into the 7th grader''s communication needs


    Common Mistakes


    +   - Arguing with the interviewer that a kindergartner would never use email.

    - Suggesting a solution that feels like regular email and not tailoring it to
    the kindergartner persona.


    # Answer


    CANDIDATE: Is this email system used in school only, or will there be no restriction
    to where they can use it?


    INTERVIEWER: There is no restriction.


    CANDIDATE: Okay, I would like to first identify the users who will use this system.
    The kids are one, but their parents and teachers will definitely be able to use
    it. At least they will monitor them.


    I would then think about the use case for this. What is the point of this system?
    Well, it''s for 7th graders to connect with each other outside of school, but
    could also be used in school. They will be emailing their classmates, teachers
    and parents. You can send text, images, and videos. You can also attach things
    to the email.


    With this in mind, I can think of a few features and restrictions:


    +   - This system must be an invite-only system. You need an administrator to
    add you to the system. This prevents unwanted people from entering.

    - You cannot invite anyone you don''t know. People must be friends first. This
    is the second fail-safe in keeping unwanted people away.

    - This system cannot receive emails from outside or send emails to the outside,
    with whitelisted emails being the exception. This only teachers and parents can
    interact with this system.

    - This has strict filtering on, everything is child-friendly.

    - This email has IP restrictions. Children would only be able to log in at home
    and from school.

    - Parents or teachers are mostly handling the login, since 7th graders probably
    have a hard time remembering their passwords. The admin can easily reset passwords.


    It has mostly similar features with existing emails. This is more of a closed
    system within, but remember you can always become friends with people you want
    to meet. So perhaps there is “meet kindergartners from Japan,” and we can do it
    through this email if they too use a similar system. If not, we can whitelist
    their emails.'
