  mdcn: "\n\n# Google Maps 在蒙古的发布\n\n你将如何在蒙古发布 Google Maps？\n\n需要考虑的因素\n\n- 你是否有公关（PR）和监管事务人员来处理相关问题？\n\
    - 你是否有运营和客户支持人员来处理接入的地图信息新增、编辑和删除请求？\n- Google Maps 是否需要根据蒙古的习俗或独特的蒙古技术基础设施进行调整？\n\
    \n常见错误\n\n- 假设蒙古与候选人最熟悉的国家完全相同。\n\n## 回答\n\n候选人：我首先会想，在这里建立 Google Maps 是否值得。我想象中它并不是一个非常热门的旅游景点，那里的人口也不多。我相信蒙古有很多未发达的地区；大多数人居住在首都乌兰巴托周边。\n\
    \n我首先会考虑我们是否有足够的良好网络接入。那里很容易迷路。智能手机和电脑的普及率高吗？虽然在很多未发达的地区很容易迷路，Google Maps 会很有用，但可能意味着很多信号不的地方。此外，我不觉得蒙古的平原对于“街景”模式有什么吸引力。\n\
    \n不太可能有我们可以合作的当地公司，但检查一下也无益处。蒙古是一个尚未开发的市场，但我不确定它的潜力是否真的很大。鉴于潜力不确定，也许我们可以将此项目交给\
    \ Google 的中国或俄罗斯办公室，以尽量减少额外投资。\n\n这两个办公室各有优势。Google 俄罗斯精通俄语，许多蒙古人都会说这种语言。然而，Google\
    \ 中国在地理位置上更接近中国。\n\n# 第 18 章策略：其他\n\n# 裁掉一个 Google 产品\n\n你会裁掉哪一个 Google 产品？为什么？\n\
    \n需要考虑的因素\n\n- 创建一套标准，判断什么产品值得被裁掉，哪些不值得。\n- 对你的裁减建议进行显而易见的详尽分析，说明为什么你的提议是合理的。\n\
    - 确保你的分析是平衡的，以使其看起来内容全面且令人信服。\n\n常见错误\n\n- 遗漏了关键因素，如收入、成本、客户、竞争对手或员工的影响。\n- 害怕面试官不同意强烈的建议，因此避免给出建议或给出一个稳妥的建议。\n\
    \n## 回答\n\n候选人：我会裁掉 Google+，原因有三点：\n\n- 什么都没有发生。在 Google+ 上从未发生突破。原因：\n    - Facebook\
    \ 已经足够好了，而 Google+ 并不被认为更好。\n    - 用户没有积极注册 Google+。相反，他们已经创建了 Facebook 账号。\n\
    \    - 抑制了其他产品。通过要求所有 Google 产品与 Google+ 集成，导致了糟糕。例如，YouTube 的访问和权限级别很别扭，Google+\
    \ 应该像 Facebook 那样登录。\n- 损害了 Google 的声誉。由于 Google+ 的失败：\n    - 努力想要赢。\n    - 不关心用户体验。\n\
    \    - 缺乏创新，主要是因为 Google+ 的界面与 Facebook 相似。\n\n面试官：那么，你认为 Google 的赢得解决方案是什么？\n\
    \n候选人：没有万能灵药。如果这很容易，Google 已经做了。以下是我将探索的一些方面：\n\n- 关注优势领域。Hangouts 是 Google 一个非常受欢迎的产物，为网页带来了良好的视频会议体验。移动端可行吗？\n\
    - 考虑新的细分市场。针对特定人群的 App 如何？例如：\n    - 针对医生：Google+ 无法诊断问题。\n    - 针对律师：Google+\
    \ 回答法律问题。\n    - 非专业场景：\n    - 针对妈妈：Google+ 提供了育儿建议。\n    - 针对运动爱好者：Google+ 帮助寻找篮球、足球或网球赛事。\n\
    - 关注新媒介。许多新的计算平台，包括虚拟现实（Oculus 和 Google Glass）、物联网（例如恒温器、安全摄像头）以及无人机。这里对社交网络的需求让\
    \ Google 能够建立先发优势。\n\n# 星巴克（Starbucks）\n\n为什么星巴克要这样扩张分店？\n\n需要考虑的因素\n\n- 留出时间思考。面试官心中可能有了一些想法。即使你没有具体的理由，面试官也可能倾向于给出五到十个理由。\n\
    - 为了激发头脑风暴，使用像波特五力模型这样的策略清单。\n\n常见错误\n\n- 陷入混乱。\n- 头脑风暴太短。\n- 遗漏了重要原因。\n\n## 回答\n\
    \n候选人：我可以头脑风暴一下吗？花点时间。\n\n候选人：我想到了几个原因：\n\n- **没有扩张空间**。也许星巴克位于繁华且理想的位置，如市中心。这使得进入周边区域是可行的。\n\
    - **品牌效应**。如果你进入城市的繁华地段看到满街都是星巴克，这是一个巨大的品牌效应。它有力地强化了“咖啡 = 星巴克”的认知，就像“在线搜索 = Google”一样。\n\
    - **防御性策略**。如果在城市的优质区域其他咖啡店会进入，如果星巴克占据了优质地段，竞争对手很难进入。\n- **买方力量降低**。如果星巴克是当地唯一的咖啡供应商，意味着客户选择很少。如果客户选择很少，星巴克更容易让客户接受涨价。\n\
    - **供应商力量降低**。同样的原因，如果当地供应商只有卖给星巴克的选择，星巴克可以与其供应商谈判更好的价格，因为那些供应商大部分收入依赖星巴克。\n\n\
    # 微软的战略分析\n\n对微软的一个业务进行战略分析。\n\n需要考虑的因素\n\n- 是否使用了 SWOT 分析或波特五力模型等策略框架来组织思路？\n\
    \n常见错误\n\n- 洞察和分析深度有限，因为候选人选择了分析多个业务而非单一业务。\n- 没有使用策略框架来组织思路，导致分析感觉不完整且不满意。\n\n\
    ## 回答\n\n候选人：微软分为两个部分，基本上一个面向客户，一个面向企业。这在几乎所有服务中都有体现：\n\n- Windows：微软的操作系统。它是微软的核心。它拥有超过\
    \ 90% 的市场主导率和源源不断的用户。消费者和企业都发挥了巨大作用。消费者获得家庭解决方案，企业可以获得专业和服务器解决方案。\n- Office：微软很大一部分是\
    \ Office 软件。它在消费者和专业环境中都是必需的。\n- Azure & Visual Studio：这两者紧密结合，提供企业解决方案。\n- Microsoft\
    \ Edge：微软自己的网页浏览器。\n- Bing & MSN：微软的网络服务，通过 Windows 和 Windows Edge 进行大力推广。使用量最高，但\
    \ Bing 拥有自己面向企业的广告，以及可以面向企业的翻译服务。\n- Skype：面向消费者和企业的通信软件。\n- Outlook / Hotmail：邮件客户端，面向消费者和企业。\n\
    - Windows Phone：主要用于手机。这还包括 Windows Store，在手机和 Windows 上均可用。这还包括 Surface 和平板电脑。\n\
    - Xbox：游戏平台。有大量的开发者支持和第一方开发者。\n- 创新：微软有很多创新团队，如 HolLens。\n\n要点是，微软拥有一支强大的业务团队，与几乎大多数企业界都有联系。Windows\
    \ 推动着消费者和企业领域的许多服务。这让用户在通过 Windows 推广时能够体验到其他产品。\n\n微软还支持向学生免费提供许多工具，这意味着他们更有可能选择使用微软服务的公司，这让企业循环保持强劲。\n\
    \n"
