  - '[PAGE 69]


    # Mobile App for Dentists


    Design a mobile app for a chain of local dentist offices.


    Things to Consider


    +   - Product design discussions can be quite lengthy. Interviewers appreciate
    if you preview where the discussion is heading. E.g. “Let’s imagine a typical
    first visit. It will help us understand gaps and how we want to improve it before
    thinking of solutions.”


    Common Mistakes


    +   - Not connecting solutions with user problems.


    # Answer


    CANDIDATE: Let’s think about users first. I can think of two different users:
    patients and office staff. The office staff includes the receptionist, nurses
    and dentists.


    Let’s imagine a typical visit to the orthodontist office. This will help us understand
    gaps and how we want to improve the experience before thinking about solutions.


    Patients convenience. First, they browse for a local dentist. They’ll look at
    reviews; it’s also important that the dentist is covered by their insurance provider.
    Patients can call the dentist and provide insurance information. After that, patients
    describe their symptoms and discuss with the dentist. The patients schedule time
    to come in. The dentist’s office reminds them before the appointment.


    Patients then comes in, show their insurance information and get dental work done.
    They pay and then leave. Sometimes patients make their next appointment, especially
    if it’s a regular cleaning or multi-appointment procedure.


    Based on the customer exploration, I notice a few things:


    +   - Insurance gets involved a lot. It would be nice if this is automated.

    - There is an inherent need for scheduling and reminders.

    - Dentist can get helpful information in advance if patients can describe their
    symptoms using pictures or text. We can add a social element to this that other
    users can see and give the patient tips. The user might not even need a trip to
    the office.

    - Payments might be a hassle, some offices might not take particular credit cards.


    Now let’s brainstorm features:


    +   - **Insurance Info.** Users can upload his insurance information. When the
    patient tries to find a dentist, the app can show only dentists that accept his
    insurance.

    - **Location Info.** Patients can look up dentists based on the patients’ shared
    location. Furthermore, patients’ location information can be shared 15 minutes
    before an appointment; the office can determine whether the patient will be on
    time or late.'
  - '[PAGE 70]


    +   **Payment Info.** Users can store their payment information in the app. Users
    can pay through the app every time. The payment history feature will make it easier
    for the user to track their expenses.


    +   **Symptoms.** Patient can select what symptoms they have via pictures or text.
    When they contact a dentist, the dentist can peruse the users'' selections and
    make a preliminary diagnosis.


    +   **Social.** Dentists and patients can talk to each other. Dentists can write
    blog articles with tips and tricks. Patients can ask questions about their symptoms
    and help each other out. Patients can also contact dentists and talk (e.g. what''s
    wrong with my teeth, I am going to need to reschedule, I''ll be late, etc.)


    +   **Scheduling.** Users can schedule through the app. Reminders will be sent
    automatically. This goes for scheduling an appointment as well as reminding users
    to come in for a biannial cleaning. The app should also store information about
    what days dentists will be available and available where (some dentists have multiple
    offices). This will save time, effort and frustration.'
  - '[PAGE 71]


    # Attracting New Customers


    Let’s pretend you''re trying to attract new customers to Amazon.com with the goal
    of turning them into recurring customers. What would you do to our website? How
    would you know if it''s effective or not?


    Things to Consider


    +   - Despite the innocent wording, this is a product design question, followed
    by a metrics question.

    - Approach this question using the CIRCLES Method.

    - Approach the metrics part of the question keeping AARM in mind.


    Common Mistakes


    +   - Not suggesting different hypotheses and explaining how they can be tested.

    - Focusing on too too many cases.


    # Answer


    CANDIDATE: Can I get some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: I can think of several ideas.


    +   - **Show competitor pricing.** For every product, we''ll show how much our
    competitors are selling them for. This is sort like how Google Shopping is doing
    this. Because Amazon is going for low profit margin anyway, I feel like we don''t
    have any problem with new users. New users will see that Amazon has the cheapest
    price and come back to us. We also see from our data that we need to lower it
    because not enough people are converting. This would show as "Competitor Pricing"
    under our product page. We''ll track these links and see which ones the users
    are going to.

    - **We''ll match your price.** This doesn''t require any website changes at all
    other than a new policy page. Basically, if you buy a product, and find a cheaper
    alternative within 7 days, we''ll refund you by using Amazon credits. Customers
    feel safe buying from Amazon because they''ll always be guaranteed the best price.
    They will also be refunded in Amazon credits, which means to use them to buy from
    us.

    - **Recurring coupons.** This is a newsletter and not a website change. Basically
    every user would have a monthly coupon (e.g. flat 20% off). This reminds them
    to come back and shop at Amazon. For new users we can give a big coupon sign up
    (e.g. 30% off). Most of the time the first conversion is the hardest, and it''s
    a lot easier for them to form a habit. By giving them a monthly coupon we can
    track your progress and "win" your next coupon based on how much you''ve spent
    already.


    Which one do you want to focus on?


    INTERVIEWER: I like the coupon idea. How would you know this is working?'
  - '[PAGE 72]


    CANDIDATE: Well, we can track a lot of data from the users right? For one, we
    don''t have to just send it through the newsletter. We could be putting them in
    different websites. As long as we track them we can know where the new users saw
    this and converted. We can also track the number of monthly coupon usage as a
    whole, and see the adoption rate. This helps us to know how effective this is.
    We can then track our monthly purchases and see if they have gone up or not. If
    a recurring user, he''ll definitely use our coupon. The question is, he buying
    more as a result or still buying the same stuff?'
  - "[PAGE 73]\n\n# Birthday Engagement\n\nBirthdays are a popular event. How would\
    \ you drive engagement on Facebook?\n\nThings to Consider\n\n+   Clarify with\
    \ the interviewer, if necessary. For instance, is the interviewer asking you to\
    \ increase the number of:\n    * Birthday event invitations via the Facebook platform\n\
    \    * Birthday greetings on Facebook\n\nCommon Mistakes\n\n+   * Suggesting marketing\
    \ promotions and not product features.\n\n# Answer\n\nCANDIDATE: When you say\
    \ engagement, do you mean more engagement toward birthdays (meaning people participating\
    \ or hosting) or more engagement during birthdays (meaning more activities)?\n\
    \nINTERVIEWER: I mean more engagement toward birthdays. We want more people to\
    \ host or join a birthday.\n\nCANDIDATE: Oh, so this is more of a marketing problem.\n\
    \nINTERVIEWER: Well, it could be as one, but I want you to approach it from the\
    \ product design point of view.\n\nCANDIDATE: Can I get some time to brainstorm?\n\
    \nCandidate takes one minute.\n\nCANDIDATE: I have a few ideas:\n\n+   * **Birthday\
    \ party feature.** We host events on a monthly basis trying to feature the best\
    \ birthdays. The community would vote on this. This is not because it provides\
    \ a really nice built up. Since birthdays are once a year, 11/12 people won't\
    \ be able to host theirs. This gives them anticipation. Also they would join local\
    \ ones (thus more engagement) to see what's up.\n* **Biggest crowd contest.**\
    \ The birthday that is the most gets a prize for everyone who shares their birthday.\
    \ This way people will try to host the biggest (increasing engagement) and people\
    \ will try to be part of the biggest (increasing engagement).\n* **Guess the birthday\
    \ person's age.** The community vote. Who are the closest get a chance to win\
    \ something. The party that had the worst answers will win something as well.\
    \ This way people will try to host birthday parties where the community have a\
    \ really hard time telling the age. People will either want to test their luck\
    \ or be part of one where they try to hide their age.\n\nINTERVIEWER: Which idea\
    \ would you recommend?"
