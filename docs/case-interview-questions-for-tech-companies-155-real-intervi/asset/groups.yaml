  - '[PAGE 186]


    # Azure Student Marketing


    How would you market Microsoft Azure to students?


    Things to Consider


    +   - Microsoft Azure is a cloud computing service. It is best suited for student
    developers who are developing cloud applications, especially ASP.NET apps.

    - Not all students have familiarity with ASP.NET applications, so aim for schools
    that include ASP.NET as part of the curriculum.

    - Consider how to drive adoption of ASP.NET at schools where students do not use
    ASP.NET including workshops, classes and hackathlons.


    Common Mistakes


    +   - Not knowing what Microsoft Azure is, especially for those without a cloud
    background.


    # Answer


    CANDIDATE: Let me first think about what students do, and then their spending
    capacity, and then I can come up with a plan.


    INTERVIEWER: Okay.


    CANDIDATE: Here are a few things students do that align with Azure:


    +   - Build websites

    - Launch cloud

    - Use cloud for storage

    - Compute large amount of data for homework or projects

    - Use tools like Visual Studio (Programmers only)

    - Distribute content


    We can''t expect students to spend money on these tools, as students tend to have
    little or no budget. Given this, I would approach from these angles:


    +   - Free tools. I would advertise free tools for students. Kind of Microsoft
    Spark. It would be free for students so they pick us over the others. The advantage
    is that they are learning everything through Microsoft tools, so when they get
    a job, they are going to carry that mentality with them. Companies that use Azure
    will be more popular. In the end, more companies will adopt Microsoft Azure.

    - Course materials. Release course materials to make the adaption easier. Teachers
    would have resources if they want to teach it, and students would have easier
    time to learn the tools.

    - Industry standard. Students have to worry about recruitment. I would market
    Microsoft Azure as industry standard tools, so knowing them would naturally up
    their chances of getting a job out of school.


    INTERVIEWER: Are you proposing that we offer the free service for students?'
  - '[PAGE 187]


    CANDIDATE: There are some pros and cons of offering a free service to students.
    Starting with the cons:


    +   1. Consumers will perceive your product as not valuable, since you are giving
    it away free.

    2. Even if consumers find it valuable, we are unnecessarily creating an anchor
    where they might be willing to pay a few dollars for the service, but they definitely
    will not pay $25 or $50 for it.

    3. We could be acquiring the wrong type of customers: the free loaders. Free loaders
    can be demanding and consume support resources.


    Onto the pros:


    +   1. Encourages students to try the product when they otherwise would not have.

    2. Demonstrate value for the product among those who have used it.

    3. Build word-of-mouth marketing from students who have actually tried the product.


    While there are are good points to be made on both the pros and cons, I feel that
    Azure should be fighting for market and mind share. Amazon Web Services is dominating
    the market, and Google is competing vigorously with Google. Cloud. It is more
    important to get users to try our service, even free, especially considering the
    switching costs involved.'
