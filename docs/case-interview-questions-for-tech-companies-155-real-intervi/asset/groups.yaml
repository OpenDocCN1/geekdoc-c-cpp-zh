    # Recruiting Drivers in City X


    How would you go about recruiting drivers? What do you think your main challenges
    would be in city X?


    Things to Consider


    +   - Who would you target?

    - Where would you find them?

    - How would you convince them to sign up?


    Common Mistakes


    +   - Not citing driver retention. According to Uber, half of its drivers quit
    after one year.


    # Answer


    CANDIDATE: Which city do you have in mind?


    INTERVIEWER: Let say, a major city in China.


    CANDIDATE: Okay, let me talk about the first challenges:


    +   - **Competitors.** Uber has a big competitor in China, Didi Kuaidi. Didi has
    a unique advantage. They have strong partnerships with Alibaba and Tencent. Those
    partnerships have paid off. For instance, Didi has Alipay and WeChat integration
    inside the app.

    - **Payment.** I mentioned this earlier, but most people in China use Alipay or
    WeChat Pay, so it''s hard to get in the market if we don''t do the same. Uber
    has integrated Alipay lately, but it doesn''t seem likely Tencent will work with
    us. In fact, Tencent just blocked Alipay from WeChat, the #1 mobile social app
    in China. This makes it hard for customers, it makes it hard for drivers.

    - **Government.** While this hasn''t been a problem yet, China does have the precedent
    of favoring local businesses over foreign ones. I am not sure how taxes work with
    Uber right now in China, but this could be a problem for us in driving genetics.
    Taxi licenses could also be another problem.


    Now I''ll have three solutions to each:


    +   - **Against Competition.** We need to offer a better service for both drivers
    and customers. I know Uber has tried this and drivers cheated the system. I know
    Uber is winning new customers with better customer service. Uber needs to keep
    this. We can also try offering Uber credits or promotions (such as winning credits
    based on miles you''ve travelled) to incentivize customers.

    - **Payment Solution.** We are in an awkward situation with Alipay not going to
    favor one or the other since backed Didi Kuaidi as well. We need to work with
    Tencent''s competitors, as Baidu, Apple and UnionPay provide similar payment services.

    - **Government Solution.** We need to make sure to recruit local talent, especially
    in the legal department, and work with the government. We also need a clear approach
    on how to co-exist the current taxi licensing system.'
  - '[PAGE 234]


    I also have other solutions in general to help us acquire more drivers such as
    driver referrals. I can go into more detail if you want.


    INTERVIEWER: That won''t be necessary.'
