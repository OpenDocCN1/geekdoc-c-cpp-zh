    # Dealing with Complex Problems


    Could you deal with complex problems?


    Things to Consider


    +   - Don''t let the awkward phrasing unnerve you.

    - Don''t take advantage of the poorly phrased question with a curt "yes.". Performing
    well at the interview is your responsibility. Good candidates know that curt responses
    are unsatisfactory and damage the chances of getting an offer.


    Common Mistakes


    +   - Responding to the odd phrasing with an inelegant response like,"That doesn''t
    make any sense. Of course I can deal with complex problems."


    # Answer


    CANDIDATE: That''s a really open-ended question. Do you have any specifics?


    INTERVIEWER: It''s open-ended of purpose.


    CANDIDATE: When I deal with a complex problem, I take a divide and conquer approach.
    That is, I would break down a complex problem into base components. Then, I analyze
    each component individually. Lastly, I check each component to arrive at the issue''s
    root cause.


    INTERVIEWER: Can you give me a personal example of a time when you used this approach?


    CANDIDATE: Yes, this happened last week. Our users complained that our game caused
    them to lose too many chips. That''s an open-ended complaint. While it doesn''t
    sound complex, the complaint forced me to think about the internal mechanics of
    the game to determine what went wrong. So I decided to divide and conquer the
    problem.


    First, I isolated the problem to a specific game mode since we had five different
    game modes. After pinpointing the correct game mode, I wanted to isolate which
    part would cause a loss of chips. I sifted through multiple issues including UX
    structure, input, labels and actions.


    Eventually I pinpointed the problem. I asked the engineers to pull log data, which
    confirmed a minor bug in our game. We fixed the bug and released a patch the following
    week.'
  - '[PAGE 137]


    # Getting up in the Morning


    If you get up in the morning and you feel really bad, what motivates you to start
    the day?


    Things to Consider


    +   - Use the Rule of Three.

    - Interviewers are looking for whether you tried to understand why you feel bad,
    how you addressed it, and did you have the resiliency to push through it.


    Common Mistakes


    +   - Not coming up with creative ways to get motivated.

    - Suffering through the pain alone and not getting others to help.


    # Answer


    CANDIDATE: I can think of three things:


    +   - **Customers.** Our product services many customers, and if I don''t get
    up and fix our problems for the day, they will be disappointed. As a PM, customers
    represent our true north. They are the lifeblood of the company. Without them,
    we have nothing.

    - **Team.** As a PM, I feel responsible for my team. They expect me to do my job
    right everyday as much as I expect them to do the same. They have my back and
    I have theirs. If I don''t get up and do my share, I am betraying camaraderie.

    - **Goal.** I keep our goal in mind whenever I feel bad. As a PM, it''s my job
    to point to the true north. I must keep our goal in mind. If I don''t get up,
    we will not progress toward that goal today.


    To conclude, if I feel really bad, I think about our customers, my team, and our
    goal.'
  - '[PAGE 138]


    # Chapter 16 Hypothetical: Problem Solving


    # CEO of Showrooms and Physical Distributors


    A lighting company CEO has a long tradition of working with showrooms and physical
    distributors, what do we say about their perception that Amazon poses a threat
    to their business?


    Things to Consider


    +   - Why do you think the lighting company CEO would be threatened?

    - What can Amazon do to that can be beneficial for the CEO? Think win-win.


    Common Mistakes


    +   - Automatically assume that the issue is about money and unilaterally offering
    discounts when the problem could have been solved differently.


    # Answer


    CANDIDATE: I would first say that Amazon naturally has a disadvantage when it
    comes to products that do better in showrooms. Take things like a kitchen counter,
    for example. People like to match big pieces like this with the rest of their
    house, and a lot of it also depends on how it would look like once it''s in place.
    Amazon can''t really showcase it well on the Internet.


    I would then talk about how Amazon probably won''t sell bigger pieces like this,
    because typically these things are purchased from brick-and-mortar stores. They
    would require installations, Amazon doesn''t usually do. Another thing is that
    Amazon usually only ship small to medium size packages. These would be huge.


    Finally, I would talk about how online buyers and people who purchase in brick-and-mortar
    stores are two separate groups. Most people who shop online don''t want to go
    out to a brick-and-mortar store in the first place, that''s why they are buying
    stuff online. So really, his business and Amazon aren''t even competing.'
  - '[PAGE 139]


    # Chapter 17 Strategy: New Market Entry


    # Google Store


    If you could open a Google store anywhere, where would it be and why?


    Things to Consider


    +   - "Google store" is an ambiguous term. What does it mean? Something equivalent
    to Microsoft or Apple stores? Or is it just a merchandising store?

    - What''s the goal of a Google store? Brand awareness? Sales? Support? All of
    the above?

    - How does your proposed location maximize the target objectives?


    Common Mistakes


    +   - Not clarifying Google store.

    - Suggesting a fancy location such as New York City''s Times Square or London''s
    Piccadilly Circus without understanding or explaining the reason behind it.


    # Answer


    CANDIDATE: Are we talking about a physical store? Like Microsoft or Apple stores?


    INTERVIEWER: Yes.


    CANDIDATE: Am I safe to assume it would showcase things like the latest Nexus,
    Chromebooks, and Google subsidiary products like Nest.


    INTERVIEWER: Yep, that sounds about right.


    CANDIDATE: I would open Google stores in China. There are three reasons:


    +   - New Market: China is a new market for Google. Its market is filled with
    a lot of different Android products. Google Nexus is not one of them. Also, Chromebooks
    and are not available in China.

    - Showrooming: China has a lot of people, and even though e-commerce is a huge
    thing (one would argue it''s more popular than there), it''s also a country with
    a huge population. Having stores would certainly attract crowds, and devices tend
    to sell better when people can play with them anyway.

    - Getting around the Ban: Google Search and Google Play are banned in China. There
    could be potential getting around that. At the very least we can increase Google''s
    branding in China.


    INTERVIEWER: If you have to pick one, what is the most important reason?


    CANDIDATE: I would say new market. China has one of the world''s largest markets,
    and Google really needs to get in on that. There are going to be a lot of difficulties,
    but I think it''s well worth it.'
  - '[PAGE 140]


    # Expanding UberPool


    We''re about to expand UberPool. What cities should we expand to?


    Things to Consider


    +   - Which cities have had the most success with UberPool? And what explains
    the success?

    - What best practices and pitfalls have been gleaned so far?

    - Which cities are most likely to duplicate the success of accomplished UberPool
    cities?


    Common Mistakes


    +   - Failed to think through what conditions contribute to UberPool''s success.


    # Answer


    CANDIDATE: I would say any cities that are crowded. Of the top of my head, cities
    like Beijing, Shanghai, Guangzhou, Mumbai, New Delhi, Tokyo, etc. I am not sure
    if any of these already have UberPool. The reasons why I picked them is:


    +   - Less Waiting. We will have a problem picking up people, since you have to
    wade through traffic, since you generally pick up people close to each other,
    it won''t be as bad. You also need to carry people who are going to destinations
    that are close to each other. This way will be less cars picking up and dropping
    off, meaning that it will be faster.

    - Less Traffic. Since few cars will go from A to point B (points being big zones),
    there are bound to be fewer cars on important highways and freeways. This means
    less traffic.

    - Lower Cost. In a city with a lot of traffic, there are bound to be a lot of
    alternatives that are cheaper and faster, like subways or buses. UberPool and
    its lower price can compete with these alternatives.


    INTERVIEWER: Wouldn''t UberPool being stuck in traffic contribute to a better
    user experience?


    CANDIDATE: This is a two-part question. On one hand, we have people who have to
    wait longer to get picked up and dropped off because carpooling. On the other,
    we have people who have to wade through heavy traffic to get somewhere. Both of
    these situations are going to happen regardless of whether or not they are using
    UberPool instead of regular Uber, so it''s unavoidable unless we come with UberBus
    or something similar, so it''s really a factor we need to consider.


    And if you think about it, UberPool will actually make pickup and drop-off faster.
    When people asked to get picked up or dropped off, there are generally locations
    that are really popular. Typically, there aren''t going to be enough cars in those
    spots (although a lot of drivers will wait around there because they know these
    are popular spots). By carpooling, cars can pick up a lot of people easily because
    you are realistically waiting for one car instead of everyone waiting multiple
    cars. This speeds up the process because having one car wade through traffic is
    better than, 3 or 4 cars because you are contributing to the traffic problem.'
