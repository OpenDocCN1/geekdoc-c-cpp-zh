    # Microsoft in a Restaurant


    How would you add any Microsoft product to a restaurant?


    Things to Consider


    +   - For newer restaurants, one of their biggest concerns is creating demand
    for their business.

    - All restaurants are concerned with yield, table turnover, upsell and labor productivity.
    They also care about minimizing food and labor costs.


    Common Mistakes


    +   - Offering solutions without mentioning the restaurant''s needs.

    - Mentioning the restaurant''s needs but no connection solutions to these needs.


    # Answer


    CANDIDATE: Can I get some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: I am thinking of a few things:


    +   - **Bing News.** Restaurants usually have a very long line, especially during
    lunch and dinner. I am thinking of having Bing News available on a big screen
    TV while people are waiting for their food. This is good because it gives them
    something to do. It''ll also promote Bing, and we can even show ads for specific
    restaurants. We can even do this while people are waiting for their food. I know
    this is a new concept in China where people can view ads, subscribe to an offer,
    and get a discount for the food.

    - **Microsoft Azure.** Let say we are running a huge chain restaurant. Data tracking
    everything is interesting. We can see what kind of menu items are popular depending
    on location, and we can see other things liking habits (we can offer different
    prices based on location) and traffic flow. We can do this all through Azure and
    have uploaded to a central database.

    - **Bing Recommendations.** When people are sitting down to offer, they can use
    our Bing Recommendations to see what is good and what is not. We can even encourage
    users to write reviews, and take pictures for a price off. This populates Bing
    Recommendations with data and introduces people to Bing.


    I think I really like the Bing Recommendations ideas.


    INTERVIEWER: That is an interesting concept. What difficulty do you think we would
    face if we try to launch such a feature?


    CANDIDATE: I am thinking we need to have a really big business team. I know Microsoft
    has a very powerful business team that works with enterprises, but restaurants
    would be a new sector. Good thing we have experience, so applying that to another
    industry wouldn''t be too hard. We would also need to work out individual points
    with the restaurants to make sure it is a win-win situation for us. As long as
    we get users'
  - '[PAGE 76]


    to use Microsoft products, not only are we promoting ourselves and increasing
    our branding, we are also getting opportunity to display ads for revenue.


    INTERVIEWER: Wouldn''t users be annoyed by being bombarded by ads when they are
    trying to enjoy their dinner?


    CANDIDATE: We really need to approach this from another angle. Why do people think
    ads are intrusive? It''s only bad when the ads aren''t relevant to you. For example,
    while you are in line, you have nothing to do so seeing interesting news and ads
    is a good experience. While you are ordering food, getting an ad for a price off
    is of value to the user. We can even promote things like local events (e.g. theaters,
    shows, clubs) to the user. If they are out for dinner, they are probably going
    to stay out that too. This would be perfect as the ads are contextual.'
