    # Favorite Technology


    What’s your favorite technology and why?


    Things to Consider


    +   - Establish your criteria for your favorite technology.

    - Explain the technology; don''t assume the listener knows what you are talking
    about.

    - Be clear, confident and detailed on why the technology meets your criteria.


    Common Mistakes


    +   - Failing to be specific about why it’s your favorite.

    - Choosing a stale, tired example like the Apple iPhone.

    - Not comparing and contrasting with existing alternatives to help listener appreciate
    why your product is remarkable.


    # Answer


    CANDIDATE: Can you give me a minute to brainstormstorm?


    Candidate takes a minute.


    CANDIDATE: The Microsoft Kinect is my favorite piece of technology because it
    satisfies my requirements.

    They:


    +   - How useful is it?

    - How innovative is it?

    - Is it easy to use and understand?


    ![](img/0d3703ff8680acec2ca39cc52072bee0_77_0.png)


    Screenshot / Microsoft'
  - '[PAGE 78]


    The Kinect is an Xbox attachment that can also be used on the PC as a motion capture
    device. It tracks your motion and can be used as an input for all sorts of applications,
    like games or software. It''s immensely useful because it''s a unique way for
    the user to control what''s happening on screen.


    It''s also very innovative. It is the first of its kind for consumer use, which
    created a new consumer gaming genre. For example, dancing games are easier to
    play because you are actually dancing as opposed to tapping buttons on a controller.


    The Kinect is also easy to use and understand. Turning it on, you see a silhouette
    of yourself on the top of the screen. Anything you do is reflected there. Depending
    on the game you are playing, the silhouette also follows your motion. The intuitive
    controls and instant feedback makes it so simple that even my grandma can use
    it.


    To conclude, the Kinect is my favorite piece of technology because it satisfies
    my requirements for a good piece of technology: useful, innovative, and easy to
    use.'
  - '[PAGE 79]


    # YouTube Tech Stack


    What do you like about the YouTube tech stack?


    Things to Consider


    +   - Use the Rule of Three.

    - It''s very likely the next question to follow, "What do you not like about the
    YouTube tech stack?


    Common Mistakes


    +   - Clarify if you are not clear on what the interviewer means by "YouTube tech
    stack." The interviewer could be referring to YouTube''s API or YouTube''s technology
    in general.


    # Answer


    CANDIDATE: Can I get some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: I can think of several ones like:


    +   - Streaming. YouTube has one of the best streaming technology in the world.
    Because YouTube serves billions of users per day, it''s important every user is
    able to see the exact videos they want without any hiccups

    - Recommendation. YouTube has billions of videos and new ones are being added
    at an alarming rate every second. It''s important to showcase the most relevant
    videos to each user, and YouTube does this through its recommendation feature.
    It''s a marvelous algorithm.

    - Server Load. YouTube has more than 1.3 billion users. A small spike in users
    could be millions of users. YouTube must take all of this into account in its
    server architecture and network design.


    INTERVIEWER: Which technology do you like the most?


    CANDIDATE: Hmm, I think I like the server load the most. It''s the most impressive.
    No other video has traffic like YouTube. Streaming is amazing, but it was really
    pioneered by a lot of other websites before. Recommendation is great, but it''s
    not unique as sites like Netflix and Hulu has them too.'
  - '[PAGE 80]


    # Airports in the Future


    How do you envision the future of airports?


    Things to Consider


    +   - Treat vision questions about the future of X no differently than product
    questions. Use the CIRCLES Method.

    - It may help to do for the CIRCLES Method in the reverse order; that is, start
    with a big idea first and then work your way toward it.


    Common Mistakes


    +   - Not having a unique, compelling vision.

    - Having a big vision, but not solving a big problem.

    - Having a big vision that addresses an important problem, but failing to provide
    details around the technical implementation.


    # Answer


    CANDIDATE: This is a very broad question. I think I would like to focus it down
    to several key ideas. Is that okay?


    INTERVIEWER: Sure.


    CANDIDATE: Let me get some time to brainstorm.


    Candidate takes one minute.


    CANDIDATE: I have a few ideas in mind. I am going to explain the key concept behind
    them and go from there.


    +   - Smooth Process. Everything is bound by your smartphone, ID or whatever fancy
    device we carry in the future. As you walk in, your device tells you where to
    go. You won''t be carrying packages because those would have been pre-shipped
    to your plane and will be waiting for you you arrive. You don''t need to passports
    or tickets your identity has been confirmed through your device already. You don''t
    need to go through security checks of your identity. You simply show 5 minutes
    before the plane starts people, and walk through. No waiting and no hassles: a
    smooth process.

    - Uninterrupted Experience. Whatever you were doing at home or at the airport
    will be interrupted. Say you were watching a movie or reading a book. This content
    will be available for you at the airport or on the plane. Going to the airport
    and riding the plane will not interrupt your everyday life.

    - Preparation. What you need, as additional items like clothes or gifts, will
    be readied for from the airport. This makes the airport journey that much smoother,
    because every preparation has been made for you.

    - Pleasant Waiting. During flight transitions you could be stuck at an airport.
    The airport will be filled with activities you want to do, as well as comfortable
    places you can wait and rest in.'
