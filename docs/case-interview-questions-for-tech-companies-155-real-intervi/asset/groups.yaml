    # Responding to Mischaracterizations


    Write a media statement to respond to Uber mischaracterizations voiced in a taxi
    leader’s newspaper op-ed.


    Things to Consider


    +   - Confront the mischaracterization head-on.

    - Systematically address and reject each mischaracterization.


    Common Mistakes


    +   - Avoiding the issue.

    - Being vague and unclear, giving the mischaracterization merit.


    # Answer


    CANDIDATE: Here''s the media response I would write:


    The taxi leader, Lane, accused us of giving poor customer service. What the taxi
    leader, Lane, said about us is a bit mischaracterized. Uber has always been about
    customer satisfaction, which is why we pride ourselves for providing the best
    service possible for the lowest price. Our entire process runs on customer ratings,
    so our riders always get the best drivers. They can also reject poor drivers.


    By cutting out the middleman, we provide a service that not only costs less, but
    also pays more to drivers. This spurs drivers to deliver a 5-star experience.
    Riders enjoy a hassle-free ride-sharing experience.


    I understand that Lane feels like Uber is taking his business away. At Uber, our
    goal is to not harm others. Instead, we want to deliver a good ride-sharing experience.
    We constantly benchmark our customer''s satisfaction with others; we want to earn
    and maintain our customers'' trust.


    If Lane and taxis'' leadership want to compete, we welcome them. Competition makes
    us stronger. But defaming us with mischaracterizations is uncalled for.'
