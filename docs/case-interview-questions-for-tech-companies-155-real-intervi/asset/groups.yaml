    ## Chapter 1 Introduction


    What are case interview questions?


    Congratulations on concentrating your job hunt on technology companies like Google,
    Amazon, Apple and Uber. If you picked up this book, you are likely interviewing
    for the roles below:


    - Product management

    - Marketing

    - Operations

    - Finance

    - Strategy

    - Business Development


    At the interview, it is very possible that you will get case interview questions.
    Case questions are different from traditional and behavioral interview questions
    like:


    - Tell me about yourself. And why do you want to join our company?

    - Tell me a time when you persuaded executives to build a product feature they
    did not want to build.


    Case questions are interview questions about a hypothetical business situation
    or case. They are meant to test how one would approach and solve that business
    problem. Here are some examples, reported by candidates:


    | Role | Company | Question |

    |---|---|---|

    | Product management | Google | Estimate how Gmail costs per user, per year. Improve
    the Disneyland user experience, relevant to a Google product. |

    | Pathways & operations management | Amazon | During the holiday season, Amazon
    customers shipped 200 orders per second. Amazon''s data science team discovered
    that the average number of orders waiting to be shipped was 20,650. How long did
    the average order wait to be shipped? |

    | Global supply management | Apple | Describe how supply chain works for Apple.
    What challenges do we face on a day-to-day basis? |

    | Business development | Coursera | As a Coursera business development executive,
    how would you manage to build relationships with school administrators? |

    | Marketing management | Microsoft | Create a marketing campaign for Microsoft
    Office 365. |

    | Marketing intelligence & business analytics | Facebook | Which is better? Having
    10 false positives or 80 false positives? |

    | Finance | Amazon | How would you reprise Amazon Prime if your goal was to increase
    profitability? |

    | Corporate strategy | Microsoft | How would you reposition Google''s offerings
    to counteract competitive threats from Microsoft? |


    Welcome to the world of case questions for the tech industry. These questions
    can stun novices and experts alike. If you are interviewing for a business role
    at a tech company, whether it''s product management, marketing, operations or
    finance, you need to be ready for case questions.


    ## Origin of case questions


    Management consulting firms, like McKinsey & Company, popularized case questions.
    Consulting questions simulate a client engagement. The interviewer would play
    the role of the client or facilitator; the candidate would play the role of a
    consultant. The aspiring consultant would answer the question by:


    - Listening to the client''s description of a business problem

    - Asking clarifying questions

    - Present a hypothesis

    - Analyzing facts and data, to confirm or deny the hypothesis

    - Brainstorming solutions

    - Making a final recommendation


    ## Why interviewers ask questions


    Consulting firms deemed traditional interview ineffective in appraising a candidate''s
    problem solving skills, so they invented the case interview. Happy with the results,
    consulting firms have made case interviews a permanent fixture in their candidate
    evaluation processes. And the tech industry, stuffed with ex-McKinsey consultants,
    have embraced consulting''s interview tradition.


    To summarize, case questions, in any industry, are meant to evaluate a candidate''s:


    - Problem solving skills

    - Communication skills

    - Business judgment

    - Courage and impact when making a recommendation


    ## Effectiveness in evaluating a candidate''s ability


    The case interview can be considered a work simulation since it simulates what
    candidates might be asked to do on the job. Work simulations (and work sample
    tests) seem to indicate a candidate''s potential. Two employment testing experts,
    Frank Schmidt and John Hunter, concluded that work sample tests are the best way
    to determine one''s candidacy. Their research shows that work sample tests outperformed
    the next best method, structured interviews, in evaluating candidates by six percent.


    ## How case questions for tech companies differ from consulting


    Case questions at consulting and tech firms have many similarities including:


    - Ask candidates to solve business problems

