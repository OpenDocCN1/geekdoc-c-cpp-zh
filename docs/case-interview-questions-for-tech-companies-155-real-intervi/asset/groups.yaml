    # Chapter 26 Traditional


    Introduction to Traditional and Behavioral Interview Questions


    Although this book is focused on case questions, traditional and behavioral interview
    questions continue to play an important part in the tech industry''s candidate
    evaluation process. For instance, Google''s human resources department has requested
    its interviewers to ask more behavioral interview questions.


    Amazon is even more fervid than Google about behavioral interview questions. Amazon
    takes a candidate''s fit with its culture seriously. Amazon''s culture is summarized
    in 14 corporate value statements called the Amazon Leadership Principles; the
    company tests a candidate''s alignment with their Leadership Principles through
    behavioral interview questions.


    In summary, traditional and behavioral interview questions aren''t becoming extinct;
    they are still very much an important piece of the interview process. The last
    two chapters, spanning about 25 pages, will give you an opportunity to practice
    and compare your performance against the sample answers.'
