    - Where will it be available?

    - Why should I get it?

    - How does it work?


    # Five Whys


    A technique to determine cause of a particular situation. It involves asking “Why?”
    in succession.


    # Issue Trees


    A problem-solving diagram that breaks down a ‘Why’ or ‘How’ question into identifiable
    root causes or potential solutions, respectively.


    # Marketing funnel


    An analytical model that tracks the customer journey towards a purchase of a product
    or service. There are four general steps, indicated by the AITP acronym:


    +   - Awareness: Bring recognition to a product brand.

    - Interest: Stir fascination with a product (what it does, how it works, and what
    benefit it delivers).

    - Trial: Compel the prospective user to try the product.

    - Purchase: Get the customer to buy the product.


    # Minimum Viable Product (MVP)


    The minimum set of features to gather user feedback for a product concept. It
    can be a fully functioning product, or it can be simply sketches on a piece of
    paper.


    # MOB


    A marketing framework that evaluates the effectiveness of a product advertisement
    or commercial.


    +   - Memorable: Does the grab your attention? Is it worthy of future discussion
    with your friends, acquaintances and social media?

    - Oh, Product! Is the product and brand promoted clearly and definitely?

    - Benefit: Does the explain and provide evidence for a product’s benefit? Is there
    a clear reason why the consumer should choose the product over a competitor’s?


    # Rule of Three


    A communication principle that suggests that responses are bundled in threes are
    more effective and satisfying.


    # Personas


    A representation of a group of customers, defined by their goals and objectives.
    Detailed personas can be described in terms of an example representative’s demographics,
    psychographics and behavior.'
  - '[PAGE 28]


    # Pro and Con Analysis


    A communication principle that a particular point of view is more readily accepted
    if the speaker provides a balanced view, in other words the advantages and disadvantages.


    # Porter''s Five Forces


    A model proposed by Harvard business school professor, Michael Porter, on the
    competitive forces affecting a product or service. Here are the key components
    of Porter''s Five Forces:


    +   - Threat of new entrants

    - Threat of substitutes

    - Bargaining power of buyers

    - Bargaining power of suppliers

    - Industry rivalry


    # Razor-and-Razorblade Strategy


    A popular business strategy where a business sells the platform, such as a razor,
    at cost or less. Then the business sells complementary products, such as razor
    blades, at a substantial profit, offsetting the reduced profit from selling the
    platform.


    # Root Cause Analysis Tree


    A hierarchical diagram that identifies the root causes of a problem and provides
    potential corrective actions to benefit the outcome or prevent recurrence.


    # SCAMPER


    A creative thinking framework used to develop innovative ideas for a topic, product
    or service.


    +   - Substitute: What components of the topic can be substituted?

    - Combine: What ideas, products or services can be added to the original topic?

    - Adjust: How can the topic be altered to be more flexible and adaptive?

    - Modify: What components can be enhanced, reduced or changed?

    - Put to other uses: How can the topic, product or service be used in different
    scenarios or situations?

    - Eliminate: What ideas or components can be removed?

    - Reverse, Rearrange: What new approaches can be formed from the original topic?


    # SMART Goals


    A helpful framework for metrics questions, especially when identifying the most
    important metric. The SMART acronym has many variations, which I have included
    here:


    +   - S: specific, significant, stretching

    - M: measurable, meaningful, motivational

    - A: agreed upon, attainable, achievable, acceptable, action-oriented

    - R: realistic, relevant, reasonable, rewarding, results-oriented'
  - '[PAGE 29]


    +   - T: time-based, time-bound, tangible, trackable


    # SWOT Analysis


    A structured planning method to evaluate the strategic elements of a business,
    industry or product to find its competitive advantage.


    +   - Strengths: Attributes that provide an advantage over other competitors.

    - Weaknesses: Attributes that provide a disadvantage relative to other competitors.

    - Opportunities: Elements that can be utilized to maximize advantages or trends.

    - Threats: Elements in the environment that can be an obstacle or risk to your
    business or product.


    # Viral Loop


    Similar to word-of-mouth marketing, getting users in the process of referring
    others to use a product or service.


    # Waterfall Development


    A product development method where all the features are specified in the beginning.
    This is the opposite of Agile development where the product development is developed
    incrementally to allow for incorporation of customer feedback.'
