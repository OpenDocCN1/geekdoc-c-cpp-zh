    * Showing your passport

    * Printing your tickets

    * Waiting

    * Getting in line

    * Showing your tickets and identification, again


    These are all things we don''t need to do in the future thanks to better tracking
    technology. I''ve seen a glimpse of this technology when traveling by train in
    Asia; I imagine the technology can be adapted for air travel.


