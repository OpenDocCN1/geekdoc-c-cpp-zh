    \ wording, this is a product design question, followed by a metrics question.\n\
    - Approach this question using the CIRCLES Method.\n- Approach the metrics part\
    \ of the question keeping AARM in mind.\n\n### Common Mistakes\n\n- Not suggesting\
    \ different hypotheses and explaining how they can be tested.\n- Focusing on too\
    \ too many cases.\n\n# Answer\n\nCANDIDATE: Can I get some time to brainstorm?\n\
    \nCandidate takes one minute.\n\nCANDIDATE: I can think of several ideas.\n\n\
    - **Show competitor pricing.** For every product, we'll show how much our competitors\
    \ are selling them for. This is sort like how Google Shopping is doing this. Because\
    \ Amazon is going for low profit margin anyway, I feel like we don't have any\
    \ problem with new users. New users will see that Amazon has the cheapest price\
    \ and come back to us. We also see from our data that we need to lower it because\
    \ not enough people are converting. This would show as \"Competitor Pricing\"\
    \ under our product page. We'll track these links and see which ones the users\
    \ are going to.\n- **We'll match your price.** This doesn't require any website\
    \ changes at all other than a new policy page. Basically, if you buy a product,\
    \ and find a cheaper alternative within 7 days, we'll refund you by using Amazon\
    \ credits. Customers feel safe buying from Amazon because they'll always be guaranteed\
    \ the best price. They will also be refunded in Amazon credits, which means to\
    \ use them to buy from us.\n- **Recurring coupons.** This is a newsletter and\
    \ not a website change. Basically every user would have a monthly coupon (e.g.\
    \ flat 20% off). This reminds them to come back and shop at Amazon. For new users\
    \ we can give a big coupon sign up (e.g. 30% off). Most of the time the first\
    \ conversion is the hardest, and it's a lot easier for them to form a habit. By\
    \ giving them a monthly coupon we can track your progress and \"win\" your next\
    \ coupon based on how much you've spent already.\n\nWhich one do you want to focus\
    \ on?\n\nINTERVIEWER: I like the coupon idea. How would you know this is working?\n\
    \nCANDIDATE: Well, we can track a lot of data from the users right? For one, we\
    \ don't have to just send it through the newsletter. We could be putting them\
    \ in different websites. As long as we track them we can know where the new users\
    \ saw this and converted. We can also track the number of monthly coupon usage\
    \ as a whole, and see the adoption rate. This helps us to know how effective this\
    \ is. We can then track our monthly purchases and see if they have gone up or\
    \ not. If a recurring user, he'll definitely use our coupon. The question is,\
    \ he buying more as a result or still buying the same stuff?\n\n# Birthday Engagement\n\
    \nBirthdays are a popular event. How would you drive engagement on Facebook?\n\
    \n### Things to Consider\n\n- Clarify with the interviewer, if necessary. For\
    \ instance, is the interviewer asking you to increase the number of:\n    * Birthday\
    \ event invitations via the Facebook platform\n    * Birthday greetings on Facebook\n\
    \n### Common Mistakes\n\n- Suggesting marketing promotions and not product features.\n\
    \n# Answer\n\nCANDIDATE: When you say engagement, do you mean more engagement\
    \ toward birthdays (meaning people participating or hosting) or more engagement\
    \ during birthdays (meaning more activities)?\n\nINTERVIEWER: I mean more engagement\
    \ toward birthdays. We want more people to host or join a birthday.\n\nCANDIDATE:\
    \ Oh, so this is more of a marketing problem.\n\nINTERVIEWER: Well, it could be\
    \ as one, but I want you to approach it from the product design point of view.\n\
    \nCANDIDATE: Can I get some time to brainstorm?\n\nCandidate takes one minute.\n\
    \nCANDIDATE: I have a few ideas:\n\n- **Birthday party feature.** We host events\
    \ on a monthly basis trying to feature the best birthdays. The community would\
    \ vote on this. This is not because it provides a really built up. Since birthdays\
    \ are once a year, 11/12 people won't be able to host theirs. This gives them\
    \ anticipation. Also they would join local ones (thus more engagement) to see\
    \ what's up.\n- **Biggest crowd contest.** The birthday that is the most gets\
    \ a prize for everyone who shares their birthday. This way people will try to\
    \ host the biggest (increasing engagement) and people will try to be part of the\
    \ biggest (increasing engagement).\n- **Guess the birthday person's age.** The\
    \ community vote. Who are the closest get a chance to win something. The party\
    \ that had the worst answers will win something as well. This way people will\
    \ try to host birthday parties where the community have a really hard time telling\
    \ the age. People will either want to test their luck or be part of one where\
    \ they try to hide their age.\n\nINTERVIEWER: Which idea would you recommend?\n"
  mdcn: "\n\n# 牙医使用的移动 App\n\n为一家连锁牙科诊所设计一款移动应用。\n\n### 需要考虑的事\n\n- 产品设计的讨论可能会非常冗长。如果面试官看到你预判讨论的方向，他们会非常感谢。例如：“让我们想象一次典型的初次就诊。这有助于我们在思考解决方案之前，先理解其中的差距以及我们想要如何改进它。”\n\
    \n### 常见错误\n\n- 没有将解决方案与用户问题联系起来。\n\n# 回答\n\n候选人：让我们先考虑用户。我可以想到两种不同的用户：患者和诊所员工。诊所员工包括前台接待、护士和牙医。\n\
    \n让我们想象一次典型的正畸诊所就诊。这有助于我们在思考解决方案之前，理解其中的差距以及我们想要如何改进体验。\n\n患者的便利性。首先，他们寻找当地的牙医。他们会查看评价；此外，牙医是否在他们的保险供应商覆盖范围内也很重要。患者可以给牙医打电话并提供保险信息。之后，患者描述症状并与牙医讨论。患者预约就诊时间。诊所在会在预约前提醒他们。\n\
    \n然后患者到达，出保险信息并进行牙科治疗。他们支付后离开。有时患者会预约下一次就，特别是如果是定期清洁或需要多次预约的程序。\n\n基于对客户的探索，我发现了几点：\n\
    \n- 保险涉及非常多。如果能自动处理就太好了。\n- 本质上需要预约和提醒。\n- 如果患者能通过图片或文字描述症状，牙医可以提前获得有用信息。我们可以对此添加一个社交元素，让其他用户看到并给患者提供建议。用户甚至不需要去一趟诊所。\n\
    - 支付可能很麻烦，有些诊所可能不接受特定的信用卡。\n\n现在让我们头脑风暴功能：\n\n- **保险信息。** 用户可以上传自己的保险信息。当患者尝试寻找牙医时，App\
    \ 可以只显示接受其保险的牙医。\n- **位置信息。** 患者可以根据共享的位置查找牙医。此外，患者的位置信息可以在预约前 15 分钟共享；诊所借此判断患者是准时到达还是迟到。\n\
    - **支付信息。** 用户可以在 App 中存储支付信息。用户每次都可以通过 App 支付。账单历史功能将使用户更容易追踪自己的支出。\n- **症状。**\
    \ 患者可以通过图片或文字选择他们拥有的症状。当他们联系牙医时，牙医可以查看用户的选择并做出初步诊断。\n- **社交。** 牙医和患者可以互相交流。牙医可以写带有技巧和窍门的博客文章。患者可以就自己的症状提问并互相帮助。患者还可以联系牙医并交流（例如：我的牙怎么了、我需要重新安排时间、我会迟到等）。\n\
    - **预约。** 用户可以通过 App 进行预约。系统会自动发送提醒。这既适用于预约挂，也适用于提醒用户来进行每两年一次的清洁。App 还应该存储牙医在哪些日期有空以及地点的信息（有些牙医有多个诊所）。这将节省时间、精力和减少挫败感。\n\
    \n# 吸引新客户\n\n假设你正试图吸引新客户访问 Amazon.com，目标是将他们转化为回头客。你会对我们的网站做些什么？你将如何知道它是否有效？\n\
    \n### 需要考虑的事\n\n- 尽管措辞很直白，但这是一个产品设计题，随后是一个指标题。\n- 使用 CIRCLES 方法来处理这个问题。\n- 在处理指标部分时，脑中要有\
    \ AARM 模型。\n\n### 常见错误\n\n- 没有提出不同的假设并解释如何测试它们。\n- 关注了过多的案例。\n\n# 回答\n\n候选人：我可以花点时间头脑风暴吗？\n\
    \n候选人花了一分钟。\n\n候选人：我可以想到几个主意。\n\n- **显示竞争对手定价。** 对于每种产品，我们都会显示竞争对手的售价。这类似于 Google\
    \ Shopping 的做法。因为 Amazon 本来追求低利润率，我觉得我们在新用户方面没有问题。新用户会看到 Amazon 的价格最便宜，然后回到我们。我们从数据中发现，我们需要降低价格，因为转化人数不足。这将在我们的产品页面下显示为“竞争定价”。我们会追踪这些链接，看看用户点击了哪些。\n\
    - **价格匹配。** 这除了需要一个新的政策页面外，完全不需要对网站进行任何更改。基本上，如果你购买了一个产品，并在 7 天内发现了更便宜的替代品，我们将使用\
    \ Amazon 额度退款给你。客户觉得从 Amazon 购买很安全，因为他们总能获得最低价。他们还将获得 Amazon 额度退款，这意味着可以使用这些额度在我们这里购买。\n\
    - **定期优惠券。** 这是一个通讯邮件，而不是网站更改。基本上每个用户都会有一张每月优惠券（例如打 8 折）。这提醒他们回到 Amazon 购物。对于新用户，我们可以给他们一个注册大额优惠券（例如打\
    \ 7 折）。大多数情况下，第一次转化是最困难的，对他们来说养成习惯要容易得多。通过给他们每月优惠券，我们可以追踪他们的进度，并根据他们已经花费的金额“赢得”他们的下张优惠券。\n\
    \n你想关注哪一个？\n\n面试官：我喜欢优惠券这个主意。你如何知道它奏了？\n\n候选人：嗯，我们可以从用户那里追踪大量数据，对吧？\n\n# 生日参与\n\
    \n生日是一个热门活动。你如何在 Facebook 上驱动参与度？\n\n### 需要考虑的事\n\n- 有时需要向面试官澄清。例如，面试官是否在让你增加：\n\
    \    * 通过 Facebook 平台的生日邀请\n    * Facebook 上的生日祝福\n\n### 常见错误\n\n- 建议了营销活动而非产品功能。\n\
    \n# 回答\n\n候选人：当你说参与时，是指针对生日的参与（意味着人们参加或举办），还是生日期间的参与（意味着更多活动）？\n\n面试官：我是针对生日的参与。我们希望有更多人举办或参加生日。\n\
    \n候选人：噢，所以这更像是一个营销问题。\n\n面试官：嗯，它可以是其中之一，但我希望你从产品设计的角度来处理。\n\n候选人：我可以花点时间头脑风暴吗？\n\
    \n候选人花了一分钟。\n\n候选人：我有几个想法：\n\n- **生日派对功能。** 我们每月举办活动，尝试展示最棒的生日。社区对此进行投票。这样做是因为它提供了一种期待感。由于生日一年只有一次，11/12\
    \ 的人无法举办自己的生日。这给了他们期待。他们还会参加当地的活动（从而增加参与度）来查看情况。\n- **最大人数竞赛。** 参加人数最多的生日将为所有分享生日的人提供奖品。这样人们会尝试举办规模最大的（增加参与度），人们也会尝试加入规模最大的（增加参与度）。\n\
    - **猜生日者的年龄。** 社区投票。最接近的人有机会赢得奖品。答案最糟糕的派对也会赢得奖品。这样人们会尝试举办让社区很难判断年龄的生日派对。人们要么想测试运气，要么想参加一个他们试图隐藏年龄的派对。\n\
    \n面试官：你会推荐哪一个主意？\n\n"
