    # Handling a Busy Situation


    Describe how you would handle a busy situation where three people are waiting
    for help from you.


    Things to Consider


    +   - Give at least three steps, so that your proposed process sounds substantial.

    - Provide an example, if time allows, demonstrating your application, mastery
    and ability to get a positive result from the process.

    - This is a test of your prioritization skills. Saying you would “do it all” does
    not illustrate your prioritization abilities.


    Common Mistakes


    +   - Claiming that you would simply to do it all.

    - Sharing an example that''s underwhelming


    # Answer


    CANDIDATE: Are we talking about people needing help in real life, through email,
    some sort of feedback system or live chat?


    INTERVIEWER: Let''s go with live chat.


    CANDIDATE: I would make sure I reply to all of them instantly with a “Hi.” Lets
    them know I am here now so they don''t feel like they are still waiting. I would
    ask them exactly what''s wrong. Based on what they tell me, I would know how to
    prioritize them. I would prioritize them based on:


    +   - Urgency

    - How long it takes to help

    - How important they are as a customer


    I would ask if anyone has spare time to help with a customer. If not, I would
    work with the person requests I can finish as soon as possible while keeping the
    others waiting by asking them more information or with the excuse, “Let me check
    with another department to confirm. Could you give me one minute?


    Then I would update them with some progress while I am trying to work through
    the current one until all of them are satisfied.


    INTERVIEWER: What if the requests require your complete attention and you cannot
    multitask?


    CANDIDATE: In that case, there isn''t much I can do, right? I would put them in
    a queue and work with them one on one. I would group them the same way as before.
    The ones who have to wait would be unhappy, but I''ll see if I can get them a
    discount or something to ease them.'
