    # Letter to an Uber Driver


    Write a letter to an Uber driver about anything, such as a new promo or strategies
    to improve their earnings.


    Things to Consider


    +   - Who is the intended audience?

    - What do you want to communicate?

    - What action do you want the audience to take, after reading the message?


    Common Mistakes


    +   - Messages that sound overly promotional. Examples include flowery, ornate
    speech or excessive use of exclamation points.


    # Answer


    Hi Drivers,


    Thanksgiving is upon us, and many of us are thinking of home. To us, you are all
    part of our family. We are introducing a new promotion to help you earn some extra
    spending cash this holiday season.


    We are introducing a Thanksgiving special to UberPool for all UberX rides. What
    does this mean?


    +   - Your earnings will be unaffected by the promotion. You''ll make as much
    per ride as you do now.

    - You''ll get more riders. The discounted price means more fares.


    This promotion will last from November 20 12:00AM to November 27 11:59PM. An announcement
    will appear in the Uber app, and the promotion pricing will be calculated automatically.
    No extra work for you or your riders. If you have any questions, please reach
    out to us at driver-relations@ubercorpexample.com.


    Yours,


    Kia S. Sammons


    Local Uber General Manager'
