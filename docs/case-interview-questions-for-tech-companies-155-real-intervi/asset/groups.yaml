  mdcn: "\n\n## 复杂问题\n\n请告诉我你曾如何使用数据解决复杂问题的经历。\n\n需要考虑的问题\n\n- 你是否描述了你是如何获取数据的？\n\
    - 你是否总结了分析得出的核心洞察？\n- 你根据数据做出了哪些决策？\n\n常见错误\n\n- 选择了一个数据集过于简单的例子，例如 Google Analytics\
    \ 或 AdWords 数据。\n- 仅谈论了如何分析数据，但没有：\n  - 分享独特、引人注目的解读或洞察\n  - 提出业务决策或后续分析建议\n\n\
    # 回答\n\n候选人：在我们其中一款手游游戏发布期间，有用户投诉游戏在不同位置会发生崩溃。起初，我询问他们使用的是什么种设备，因为我推测他们可能都使用的是同一系列的设备。在获得用户反馈后，我发现崩溃发生在多种设备上，而不仅仅是某一种类型。我我很困惑。这些情况可能互不相关吗？\n\
    \n我要求开发团队查看每一个错误报告。与此同时，我深入了数据。我们从未在每一台设备上进行过软件测试；我们无法接触成千上万种不同的移动设备。因此，这种情况对我来说是全新的。\n\
    \n开发者给了我回复。他们告诉我，他们在我们的实验室环境中无法复现这些崩溃，主要是因为他们没有相同的设备。然而，他们确实发现了一个有趣的数据：用户的错误报告之间是有关联的。每个场景都调用了\
    \ UI 元素，即一个小窗口。他们告诉我，我们可能需要获取崩溃报告中的设备，以便他们能够进行适当的测试和调试。\n\n我不想白忙活一场。寻找稀有的移动设备可能需要几天甚至几个月的时间。此外，这还会花费费用。于是，我回到了错误报告中。我发现所有设备都是韩国三星设备。而且，所有设备都安装了三星\
    \ Galaxy Apps。\n\n我与开发者分享了我的发现。他们深入研究后发现三星的 Galaxy Apps 干扰了我们应用正在调用的小窗口 UI。我们在实验室中找到了一台安装了三星\
    \ Galaxy Apps 的设备，迅速复现了该漏洞。好消息是：我们的工程师修复了该漏洞，并在四小时内发布了更新。\n\n为了防止这种情况再次发生，我创建了一个设备信息参考页面。我们使用该参考页面来更好地定位问题。该页面允许任何工程师、产品经理或支持团队成员获取设备信息。它可以按国家、默认应用程序和服务进行过滤。\n\
    \n我的老板非常喜欢我解决问题的方式，无论从短期还是长期来看。他在下一次晋升周期中引用了这个特定的案例，公司将我从高级产品经理晋升为产品经理。\n\n##\
    \ 使用数据进行明智决策\n\n请告诉我上一次使用数据辅助决策的经历。你是如何获取数据的？如果让你再次做那个决定，你会做什么不同的改变？你希望获得什么样的数据？\n\
    \n需要考虑的问题\n\n- 大多数用户在现实世界中获取数据都面临困难。你也遇到困难了吗？\n- 数据显示了什么影响，你做出了哪些决策？\n- 你对所做的决策感到后悔吗？\n\
    \n常见错误\n\n- 没有谈及获取数据面临的挑战，例如办公室政治。\n\n# 回答\n\n候选人：有一次，我获取了东南亚流量来源的数据。通过这些数据，我优先考虑了整合哪些渠道，以便优化我们的引入流量。我是通过在线研究以及与其他几家游戏公司的\
    \ PM 交流（他们与我分享了数据集）获取这些数据的。\n\n如果让我重新做一次决定，我会关注单个国家的数据。我还会根据这些国家的潜在市场份额、CPI（获客成本）和支付习惯来确定优先级。\n\
    \n面试官：你第一次调研时没有研究这些吗？\n\n候选人：研究过了。但是，获取这些数据非常耗时，而且我们有截止日期。东南亚市场非常碎片化，有数百万台越狱设备以及第三方应用商店。\n\
    \n## 影响你的团队\n\n描述一次你必须影响软件或 UI 的经历。你取得了什么成就？\n\n需要考虑的问题\n\n- 花些时间解释为什么影响利益相关者如此困难，以便让听者能够欣赏你的说服技巧。\n\
    - 仔细选择你的例子。一个关于后端功能或基础设施改进的影响故事可能很枯燥或难以理解；而一个关于前端功能的影响故事可能看起来很有吸引力，但可能需要更多精力来解释。\n\
    \n常见错误\n\n- 归罪另一个团队没有采纳你的观点。这表明了自我意识较低。\n- 没有利用创造性的策略。\n- 忽略了影响利益相关者的努力，让事情看起来像是对方一夜之间就改变了主意。\n\
    \n# 回答\n\n候选人：在我们其中一款游戏中，收入低于行业标准。在查看数据后，我得出结论：转化率是正常的。真正的问题在于：平均付费用户收入（ARPPU）。\n\
    \n我起草了一个计划，在下一次更新中修复这个问题。我说服团队在下个月优先考虑这次更新。但并不是故事的结束。真正的故事从会议之后才开始。我不满意，因为那个修复方案需要一个月才能发布。我不想让局面处于不理想的状态。我很好奇是否有更短的解决方案。于是，我回到了数据中。7%\
    \ 的用户为一项尚未变现的功能付费。这给了我一个交叉销售的想法。\n\n我想影响其他人，并解释了三个益处：\n\n- 上市时间：这让营销团队有事可做。\n\
    - 变现机会：营销团队可以以此获取反馈。\n- 低风险：我们可以针对小范围测试新功能。\n\nHiro 喜欢我的想法，并帮助我说服了开发团队。这个功能只花了两天时间实现。我们收集了三周的\
    \ A/B 测试数据，并决定推向所有用户。受益于这个功能，我们的收入增加了 10%。由于我们的工作，我们在下季度获得了一个奖励，2000 美元的奖金。\n\n\
    ## 多方利益相关者\n\n请告诉我你曾处理过多个利益相关者的经历。\n\n需要考虑的问题\n\n- 涉及的团队是否足够大？\n- 你是否意外遗漏了关键利益相关者？\n\
    - 你是否未能与关键利益相关者沟通，导致了意外之外的后果？\n\n常见错误\n\n- 讲述的故事中候选人不是困境的中心。\n- 没有对冲突进行戏剧化处理，导致情况显得微不足道。\n\
    \n# 回答\n\n候选人：九个月前，我负责一款新游戏的发布，当时我必须处理一个欧洲开发团队和一个美国营销团队。开发团队和营销团队对我们的集体小组有不同的优先级。开发团队想推迟发布以增加更多游戏模式。营销团队想尽快发布新游戏；营销团队觉得他们无事可做。\n\
    \n在我有机会消化这一情况后，我与两个团队会了面。我告诉营销团队开发团队想要推迟的原因，也告诉开发团队营销团队想要发布的原因。\n\n两个团队在立场上都非常固执，所以我提出了以下建议：让我们现在进行内测，这样营销团队就有事可做了。这给了他们一个机会来测试和完善发布计划。开发团队可以依靠营销团队的内测反馈，在三周后的正式发布前进行迭代改进。\n\
    \n高管们认为我们为了让营销团队忙起来而改变发布计划很奇特。然而，他们喜欢我们早期且频繁获取客户反馈的做法。他们上周刚请了一位敏捷开发顾问进行培训。\n\n"
