  - '[PAGE 89]


    # App for Celiac Patients


    Design an app for a patient community affected by celiac disease.


    Things to Consider


    +   - Celiac patients have an adverse reaction to gluten-related food substances.

    - Focus on how app technology can help patients live comfortably with the disease.


    Common Mistakes


    +   - Feeling uncomfortable with the interviewer is difficult and does not provide
    more context about what celiac disease is.


    # Answer


    CANDIDATE: Just so we are on the same page, someone with celiac disease cannot
    have gluten-related food and other substances. If they do, it triggers a reaction
    in their small intestines which will lead to various symptoms like diarrhea, abdominal
    bloating and pain, and other side effects. In the long term, it may have serious
    effects like vitamin or mineral deficiency.


    INTERVIEWER: Yes, that is correct.


    CANDIDATE: When you said app, I am assuming you want a mobile app?


    INTERVIEWER: Yes.


    CANDIDATE: Can I get some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: Okay, I have a few ideas:


    +   - **Search Database**. People can look up, by text or speech, various food
    and items to see if they are safe to eat. They can take a picture with their phone
    to ask the community. If possible, we would like processing and auto-detect what
    kind of food this. Regardless, if something is not already in the database, the
    community can answer and add to the database.


    +   - **Symptoms Lookup**. Same idea as the search database, except it is for
    symptoms. Type in voice your symptoms; the app will see if it is a possible symptom
    for celiac disease in the database. If it is not, the community can offer advice
    on this particular symptom.


    +   - **Restaurant Lookup**. Not all restaurants are gluten friendly. It would
    be helpful to find a directory of restaurants that are certified to accommodate
    gluten-free diets.'
  - '[PAGE 90]


    # Sales and Inventory Tracking


    Design a sales and inventory tracking system on the whiteboard.


    Things to Consider


    +   - Sales and inventory systems is used to track inventory and recording sales
    of a product.

    - If a business carries more inventory than it can sell, the company not only
    spends money on warehousing costs, but their cash that was used to purchase inventory
    cannot be invested elsewhere in the business.

    - One of the key components is to accurately forecast demand and purchase an optimal
    amount of inventory.


    Common Mistakes


    +   - Quitting on the problem after declaring that they''re not familiar with
    sales and inventory tracking systems.

    - Not wanting to draw on the whiteboard.

    - Rushing through the solution, believing that the solution doesn''t matter given
    the candidate''s lack of familiarity with sales and inventory systems.


    # Answer


    CANDIDATE: Let''s think about what a sales and inventory tracking system needs.
    On a basic level, you should be able to add quotes and orders. Most of the screen
    is taken up by viewing a specific order.


    Orders should have a company, contact, phone number, order date as well as shipping
    and billing address. We will also need order status: paid, processing, invoiced,
    canceled, etc. It should also have a breakdown of order and price. For example,
    you ordered 4 X and 2 Y, they each cost this and the subtotal is that.


    Let me draw the user interface.


    Candidate draws the following on the board.'
