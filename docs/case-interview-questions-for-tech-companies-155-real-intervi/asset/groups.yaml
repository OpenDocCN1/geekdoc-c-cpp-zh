    - 你是如何建立信任的？\n- 你是如何将你的需求与他们的需求联系起来？\n\n常见错误\n\n- 提到如果没有黄金人脉就不可能与高层管理员建立关系。\n\
    - 假设向大型组织销售时，单一联系点就足够了。\n\n# 回答\n\n应聘人：我会做几件事：\n\n- **进度更新**。我会让他们了解最新进展，特别是他们自己学校的情况。例如，如果某位教授在使用\
    \ Coursera 上特别活跃（无论是参与课程讨论还是他们的课程获得了好评），我会与管理员分享这些。\n- **活动**。如果有任何与他们相关的公关活动，我会向他们介绍。\n\
    - **公关**。如果有任何与他们的课程相关的公关稿，我会确保他们知道。\n- **叙旧**。业务发展专业人员与其联系名单中的每个人保持联系是重要的。每隔一段时间，我会和他们一起喝咖啡之类的叙叙旧。\n\
    - **特殊场合**。在节日或特殊活动期间，我会给他们发送礼物包。\n- **生日和重要日子**。在个人层面，我会确保让他们知道我记得他们的特别日子。\n\
    - **交接**。在他们的主要联系人离职的不幸情况下，我会协助实现平稳交接。没有什么比继承一个尴尬的交接更糟糕的了。\n- **开放门政策**。如果他们有任何想要讨论的问题或困难，我随时会在那里。\n\
    \n# 交易未达成\n\n当交易未达成时，主要原因是什么？\n\n需要考虑的因素\n\n- 虽然面试官要求给出一个原因，但如果候选人没有提到面试官心想的那个原因，感到失望是人性的。为了保护自己，要脑暴出许多理由，以增加正确猜中面试官原因的概率。\n\
    - 即使候选人没有准确猜中面试官的原因，一份详尽的 15-20 项的列表也会给面试官留下深刻印象。\n- 为了方便脑暴，使用提示。也就是说，考虑以下导致交易可能无法完成的原因：\n\
    \  - 客户\n  - 竞争对手\n  - 能力问题，例如网站未运行或用户界面毫无意义\n\n常见错误\n\n- 没有提到超过一个原因\n- 固执地坚持自己的观点，并拒绝考虑其他替代方案\n\
    \n# 回答\n\n应聘人：可能有多个原因：\n\n- 竞争对手提供了更优惠的。\n- 谈判没有进展。\n- 他们意识到现在并不真的需要这个。\n- 他们觉得太贵了。\n\
    - 流程太繁琐。\n- 他们觉得我们不是一家负责任的公司。\n\n他们只是为了自己的目的在询价。他们从一开始就没打算达成交易。\n\n"
