  mdcn: "\n\n应聘人：我们确实不能在活动当天发布广告。骑行者需要规划他们的行程，而且他们可能想邀请朋友。因此，我们的目标可能是至少提前一到两周投放广告。\n\
    \n面试官：这里有社交媒体元素吗？\n\n应聘人：完全有。用户可以看到活动广告，并将其分享给朋友。这样，推广活动就会形成热度，骑行者也可能会说服他们的朋友一起去。\n\
    \n我们还可以将 Uber 的促销活动与活动策划者的活动注册系统集成。也就是说，对于所有注册人员，我们可以建议他们搭乘 Uber 去活动现场并节省五美元。\n\
    \n面试官：感谢你的见解。\n\n# 识别内容来源\n\n需要考虑的因素\n\n- 哪些教授最可能为在线大学贡献学习材料？\n- 为什么他们想要贡献？\n\n\
    常见错误\n\n- 不了解创建内容的挑战，包括开发课程大纲、进行演讲以及交付用户所期待的专业水平演示。\n\n# 回答\n\n应聘人：我们公司的核心观点是寻找良好的来源来获取课程，让客户发现我们的课程既相关又有趣。因此，我们需要识别擅长教授课程的教授和讲师。这是一个非常广泛的概念，所以让我们具体定义一下它的含义：\n\
    \n- **高标准**。他们必须提供高质量的课程。这些课程在当今市场中必须是（例如，编程课程教授的是大多数公司在工作中实际使用的语言）。\n- **经验证成功**。这所学校的学生和/或该教授在完成课程后确实取得了成功。例如，从某位教授毕业的学生进入了大型科技公司。\n\
    - **课程结构**。教授不需要幽默，但课程需要吸引学生的注意力。我发现，强大且逻辑严密的课程结构可以保持学生的注意力。\n- **研究论文**。我会查看教授参与过多少研究论文和项目来衡量他的质量。\n\
    \n最后，我还会查看像 RateMyProfessors.com 这样的网站。我没有将其列为主要来源，因为该网站的评论可能带有偏见。例如，优秀但评分严厉的教授可能会获得低评。我们不想只介绍那些给\
    \ Easy A 的教授，无论课程质量如何。\n\n# 强化关系\n\n我们 Coursera 目前正在与一家机构合作，但他们一直不回复我们的电话或邮件。你会如何加强这种关系？\n\
    \n需要考虑的因素\n\n- 客户会认为你正在考虑他们的需求吗？\n- 客户会认为你是侧重于交易还是侧重于关系的？\n- 他们会说你与他们保持定期联系吗？还是他们会说你只有在有销售驱动的计划时才联系他们？\n\
    \n常见错误\n\n- 忘记了有时客户是因为忙碌而没有回复。\n- 不知道客户不回复不是因为他们没有需求，而是因为时机不对，例如缺乏预算或公司内部重组。\n\
    \n# 回答\n\n应聘人：我会首先看看他们是否发生了什么事情。也许他们正在度假或者发生了什么坏事。如果没有，我会尝试通过其他方式（如传真或短信）联系我的主要联系人。如果还是不行，我会看看能否在那里找到另一个联系点。如果有必要，而且我们离那里很近或者我们的某个办公室很近，且他们很重要，那么我们可以开车一趟那里。这将是与他们对话的良好开始。\n\
    \n然后我们可以加强这种关系。我会向他们介绍 Coursera 的益处：\n\n- 触达更广泛的受众。通过 Coursera，你可以触达到更广泛的受众，甚至是其他国家。\n\
