    - Require candidates to have a methodical approach

    - Typically call for number crunching

    - Expect candidates to make a recommendation, affecting the target goal in an
    effective and logical way


    However, unlike case questions, tech case questions are more likely to have the
    following characteristics:


    - **Involve real-world scenarios.** To maintain client privacy, consulting cases
    often use fictitious names and scenarios. Tech firms are more likely to use actual
    problems, making case questions easier to anticipate.

    - **Ambiguous.** Tech companies use questions that are less specific and more
    open-ended, similar to the broad strategic questions that CEOs face day-to-day.

    - **Require tech domain-expertise.** Consulting firms don''t expect candidates
    have industry-specific knowledge, but tech firms do.

    - **Dearth of background information.** Unlike consulting, tech cases rarely,
    if ever, have background information to share with the candidate. There is no
    interview guide, and the interviewer usually does not exhibit to reveal to the
    interviewee.

    - **Unlikely to provide help, or other assistance.** Consulting interviews often
    help candidates with unknown assumptions. Tech companies are less helpful in this
    regard. Sometimes, they don''t know or don''t want to reveal confidential information.
    Other times, they withhold assumptions so they can assess a candidate''s judgment.


    ## What the book is about and how to use it


    This book includes over 150 practice problems along with sample answers. The questions
    are organized by question type; there are different question categories including
    product design, marketing, operations, finance and business development.


    The best candidates are attempting the problems on their own and comparing their
    answers with the sample. I would strongly recommend that you do the same.


    To reinforce that concept, I created blank pages for the first 10 questions. After
    that, I hope you continue to do problems and first review the sample answer.


    And one more tip: do you research the types of questions you''re likely to encounter;
    pick and choose the sample questions that are most similar to what you think you''re
    likely to get at the actual interview.


    ## Who should read this book


    If you are interviewing for any of the following roles at tech companies, you
    should be prepared for case interviews:


    - Product management

    - Operations

    - Business Development

    - Marketing

