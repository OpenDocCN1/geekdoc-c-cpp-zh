  - '[PAGE 149]


    # Google vs. Microsoft


    How would you re-position Google''s offerings to counteract competitive threats
    from Microsoft?


    Things to Consider


    +   - Where Microsoft and Google compete

    - Which Microsoft products represent the biggest threats to Google?

    - Which perceptions are the most difficult for Google to change (e.g. privacy)


    Common Mistakes


    +   - Suggesting boring ideas with limited effectiveness such as changing price
    or doing more marketing promotion


    # Answer


    CANDIDATE: By offering, do you mean launching new products or are you talking
    more about directions?


    INTERVIEWER: What new directions would you say Google should approach?


    CANDIDATE: Hmm, I need to first think about Microsoft''s competitive threats in
    order to consider those. We have some time to brainstorm.


    Candidate takes one minute.


    CANDIDATE: I can think of three threats Microsoft has competitively over as Google:


    +   - Browser. Microsoft is able to promote Microsoft Edge because it comes bundled
    with Windows. Chrome is winning now, mostly because of Android, but Microsoft
    will always have this threat looming over our head.

    - Enterprise Solutions. I am talking about things like emails and servers. Microsoft
    has a lot of products devoted to them, and decades of enterprise relations.

    - Developer Tools. Microsoft has a lot of developer tools, and they offer them
    for students (Microsoft Spark). Visual Studio has become the facto IDE for a lot
    of people.


    Now with this, I can think of directions we should head as Google:


    +   - OS. Google is already doing this to some degree with Chromebooks, but it''s
    not enough. One of the greatest windows of Windows is its user base, which causes
    developers to develop for it which in turns more users. Google needs to focus
    on this.

    - Enterprise Solutions. Google offers a lot of similar services (e.g. Gmail, Google
    Drive, Google Cloud), but it''s the sales and business aspect that is letting
    Microsoft win. We need stronger business teams that work with enterprises.'
  - '[PAGE 150]


    +   Developer Tools. Google is sort of doing this now, but it''s not enough. Microsoft
    has been on the horizon for so many years and Microsoft Spark is so good at converting
    students into permanent Microsoft users. Google needs to focus more on schools.


    So by examining all three potential threats, we see that Google should really
    focus more on relations. Google has all the necessary tools and products, but
    because Microsoft has either already taken the market share or has an excellent
    business relations team, Microsoft is winning out in these areas.'
  - '[PAGE 151]


    # Google’s Strategy


    What is Google''s strategy?


    Things to Consider


    +   - How does Google make money?

    - What are the key assets that Google has invented to feed its business model?

    - How does Google prevent its business model from getting obsolete?


    Common Mistakes


    +   - Not following the revenue model to discover the company’s strategy


    # Answer


    CANDIDATE: Google’s strategy really focuses on getting lots and lots of users.
    Google makes products that are innovative and convenient which tends to attract
    a lot of early adopters and ends up snowballing to become a huge business on its
    own. We see this with Gmail, Google Maps, and Google Drive.


    Google Search remains its core component, of course, and was what it started all.
    By making a lot of products like this, it allows Google to build based on its
    strengths. For example, think of Gmail. It was first built because Google Search
    was already popular. A cross promotion then happened and a lot of users were introduced
    to Gmail. Gmail then made a lot of people own an account, which fed back into
    Search now data can be tracked to users. Both of these worked together to make
    advertisement better.


    This is the reason why Google seems unstoppable in making new products, because
    everything is building on its strengths, and then goes back and enhances existing
    products.


    In the beginning, most of Google’s revenue comes from advertisement, with Search,
    Gmail, and YouTube leading the way. Google then begins to diversify its business,
    venturing into other things like Nest, Fiber, and selfless driving cars. This
    goes back to the building upon its strength and huge user base I talked about
    earlier. Because Google has the financial backing, brand recognition, and huge
    user base, it’s able to expand into new businesses that tie in to previous businesses
    and grow the company.'
  - '[PAGE 152]


    # Analysis of Google Acquisitions


    Give your analysis of several recent acquisitions that Google has made.


    Things to Consider


    +   - List at least three acquisitions to indicate your passion for the company
    through your knowledge of company-related current events.

    - A simple pro and con analysis could suffice.


    Common Mistakes


    +   - Mentioning only common reasons for acquisitions including revenue, patents
    or talent acquisition; ignoring other reasons including competitive defense, strategic
    learning or simply irrational behavior.


    # Answer


    CANDIDATE: I can think of three recent acquisitions: Fly Labs for Google Photos,
    Tilt Brush and Thrive Audio.


    Fly Labs has synergies with Google Photos. Fly Labs has over 3 million downloads
    globally. This is a smart move because Flickr is slowly dwindling, and with the
    rise of Imgur, it appears that photos are the next big social thing. Google+ is
    not working out well. By slowly improving and expanding Google Photos, it could
    become the next social powerhouse, especially with the number of users Google
    already has.


    Tilt Brush is a 3-D painting application; it allows you to essentially paint a
    room like it''s your canvas. This is a cool idea, but also the future. Google
    has been trying hard to introduce VR to the world. This makes it a natural expansion
    for Google. One of the early criticisms of VR is applications are limited. 3-D
    painting can be a killer application for early adopters.


    Thrive Audio is like the Tilt Brush acquisition in many ways. It is positional
    audio designed with VR in mind. With this we are also seeing Google taking the
    lead in preparing for VR being the next big.


    With these recent acquisitions, Google appears to be proving two points:


    +   - Google is aware of its own shortcomings (e.g. social) and is seeking new
    ways to strengthen them.

    - Google is preparing for a world where VR is the next big computing platform
    by keeping up with the VR moves of its two major competitors: Facebook and Microsoft.'
