    they can carry our product. If possible, I''d like to work with websites like
    Dell, but they probably won''t carry the Chromebook.


    After launch, I want to gauge user feedback and see what needs to be improved.
    Depending on how many people send in their Chromebooks for warranty repairs, I
    will also know what tends to break down and see if I can improve it. I''ll continue
