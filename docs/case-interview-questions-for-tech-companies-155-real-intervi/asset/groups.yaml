  - "[PAGE 147]\n\n# Improving the Company\n\nIf you were the CEO of Microsoft, what\
    \ would you change to improve the company?\n\nThings to Consider\n\n+   - What\
    \ are the biggest threats to the company?\n- What are the biggest opportunities?\n\
    - What are the core competencies that the company should leverage?\n- What are\
    \ ingrained consumer perceptions that the company should avoid?\n\nCommon Mistakes\n\
    \n+   - Taking a single product view vs. a company view.\n\n# Answer\n\nCANDIDATE:\
    \ Are you talking about the company culture or product?\n\nINTERVIEWER: Anything\
    \ related to the company, like culture, direction, etc.\n\nCANDIDATE: Hmm, give\
    \ me some time to brainstorm please. \n\nCandidate takes one minute.\n\nCANDIDATE:\
    \ I think there are three things I would change about Microsoft. \n\n+   - **Cool,\
    \ Young Culture**: Microsoft currently has a bit of a traditional culture. Microsoft\
    \ is an old company (in the tech space) and gives off the vibe that it's not really\
    \ with us. Young people are a driving force behind innovation, and I think by\
    \ adapting a younger and contemporary tech culture (like Google and Facebook)\
    \ would attract more talent.\n- **Innovation**: Microsoft has its innovations,\
    \ don't get me wrong, but it's not really well known for it, and definitely not\
    \ in the league of Apple, Google or Facebook. Innovation is really the driving\
    \ force behind revenue. Most of Microsoft's revenue comes from the enterprise\
    \ sector and innovation doesn't always make the biggest bucks, but Microsoft is\
    \ losing out in a lot of emerging markets, and this is why. I mean, Google has\
    \ driverless cars, Uber is tapping into a new market, and Airbnb is using a whole\
    \ new model.\n- **Consumer Focus**: Like I said before, Microsoft is really focused\
    \ on the enterprise sector. I think we are losing out in a lot of markets precisely\
    \ because they are consumer-oriented. I am talking about mobile, browser, and\
    \ gaming consoles. These are also new markets, and they tend to attract younger\
    \ customers. Shifting Microsoft into a more consumer-focused approach would benefit\
    \ us in the long run.\n\nINTERVIEWER: To be consumer focused, you are saying Microsoft\
    \ should move away from enterprise, where we make most of our revenue, and for\
    \ the consumer space? What if this changed?\n\nCANDIDATE: I am not saying we should\
    \ move away from enterprise. Think of enterprise as a stable base. We are trying\
    \ to expand and get another base. The world of tech constantly changes and new\
    \ trends and markets"
