    # Marketing Feature X


    How would you market feature X to application developers, given you have limited
    time and resources?


    Things to Consider


    +   - The prompt already states the target customer, so no need to clarify with
    the interviewer.

    - The "limited time and resources" clause is asking for the candidate to come
    up with clever and scrappy ideas.


    Common Mistakes


    +   - Suggesting conventional marketing ideas that require significant time and
    resources like a Super Bowl ad.


    # Answer


    CANDIDATE: Did you want me to brainstorm a list of tactics? Or did you want me
    to think more holistically about a marketing strategy and then base my marketing
    tactics from that strategy?


    INTERVIEWER: I like your suggestion, but since we are short on time, just brainstorm
    a list of tactics in the next two to three minutes.


    CANDIDATE: I can think of a few ways:


    +   - Create a referral program. Then get developers we know to refer their developer
    friends.

    - Host an event, either online or in-person, to deify the feature and provide
    incentives such as free shirts when developers sign-up.

    - Host a hackathon and award a prize for the best application that uses the new
    feature.

    - Advertise the new feature on popular websites that developers frequent such
    as Stack Overflow and Reddit.

    - Promote the new feature on sites that do not have advertising such as Hacker
    News.

    - Host a developer conference to talk about the feature.

    - Help job-seeking developers build their portfolio by mentoring them to build
    new software projects (that they can include in their resume) that use the new
    feature.

    - Develop open source code, using the new feature, which other developers can
    leverage.

    - Hire a developer community evangelist to reach out to influential developers,
    hoping that these influencers will write about the new feature on their blog.'
