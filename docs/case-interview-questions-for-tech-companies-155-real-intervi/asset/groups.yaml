    # Launching the Chromebook


    How would you launch the Chromebook?


    Things to Consider


    +   * Who is the ideal target customer?

    * What is the value proposition?

    * What kind of clever and creative marketing tactics will you use?


    Common Mistakes


    +   * Giving a laundry list of items, with limited reasoning.


    # Answer


    CANDIDATE: Let''s first think about the Chromebook. First, let''s think about
    the ideal target market. The Chromebook requires a constant Internet connection.
    It is a Linux distribution, so that it limits it to fairly tech-savvy people.
    What''s good is it''s cheap; you can get a solid Chromebook for $250 the last
    time I checked.


    INTERVIEWER: Wait, are you saying non-tech-savvy people will not like the Chromebook?


    CANDIDATE: Not all of but, it''s hard for someone who isn''t tech-savvy to jump
    on a Linux distribution. While it''s a thin system and it''s mostly Chrome browser-based
    (the name), it is still different from the traditional Windows or Mac experience.
    It will be much easier to catch the tech-savvy people first.


    INTERVIEWER: Okay. Keep going.


    CANDIDATE: It''s probably better to advertise it on websites such as Stack Overflow
    and other tech heavy sites. I feel like most tech-savvy people tend to shop online,
    so Amazon and sites like Newegg could also be a good source. Obviously, our resources
    are YouTube and Search will be nice to use as well. For brick-and-mortar stores,
    we can divert some budget to it, but I can''t see it really effective.


    INTERVIEWER: How would you launch the product itself?


    CANDIDATE: Well, if it''s during development, I do some sort of exclusive beta
    signup and name a few copies to candidates. This will allow us to get feedback
    and creates an air of mystery around this whole thing. People are naturally curious,
    so this could generate some PR. I also contact PR channels and see if we can get
    some news going. Google making a laptop is a piece of interesting news in itself.


    I''ll go see if I can get some developers to work on the Chromebook. We want to
    get them ready for the launch. Since there might be a few compatible applications
    already.


    During launch, I''d ramp up marketing and definitely reach out to a lot of PR
    outlets. I want to make sure the specifications of the product are ready. I might
    want to offer a few different device and make them available on multiple stores.
    I may also want to see if we can work with major computer selling websites to
    see if'
