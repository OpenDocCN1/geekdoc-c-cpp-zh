    # Identifying Content Source


    Things to Consider


    +   - Which professors are most likely to contribute learning material to an online
    university?

    - Why would they want to contribute?


    Common Mistakes


    +   - Not knowing the challenges of creating content including developing a curriculum,
    giving the presentation and delivering a professional quality presentation that
    users expect.


    # Answer


    CANDIDATE: The whole point of our company is to identify good sources to grab
    courses from so customers find our courses both relevant and interesting. Therefore,
    we need to identify professors and lecturers who are good at teaching the course.
    This is a very broad concept, so let''s define specifically what that means:


    +   - **High Quality.** They must provide courses that are high quality. They
    must be relevant in today''s market (e.g., programming courses are teaching languages
    actually used by most companies on the job).

    - **Proven Track of Success.** Students from this school and/or professor must
    actually end being successful after the course. For example, students who graduated
    from a specific professor end up working at big tech companies.

    - **Course Structure.** The professor doesn''t need to be funny, but courses need
    to keep the students'' attention. I''ve found that strong, logical course structure
    can keep students'' attention.

    - **Research Papers.** I would see how many research papers and projects the professor
    has participated in to gauge his quality.


    Finally, I would also check out sites like RateMyProfessors.com. I didn''t list
    this as a primary source because the site''s reviews can be biased. For example,
    good but grading professors could get low reviews. We don''t want to feature only
    professors who give easy A''s, regardless of course quality.'
  - '[PAGE 238]


    # Strengthening Relationship


    We, Coursera, are working with one institution right now that is not responding
    to our calls or emails. How would you strengthen that relationship?


    Things to Consider


    +   - Would the client say that you are looking out for their needs?

    - Would the client say that you''ve been transaction or relationship-focused?

    - Would they say that you''re keeping in regular contact with them? Or would they
    say you only reach out when you have a sales-driven agenda?


    Common Mistakes


    +   - Forgetting that sometimes, clients are unresponsive because they are busy.

    - Not knowing that clients may be unresponsive not because they do not have a
    need, but the timing is not right such as lack of budget or company-wide reorganization.


    # Answer


    CANDIDATE: I would first see if something has happened to them. Maybe they are
    on a holiday or something that bad happened. If not, I would try to contact my
    primary contact through other means, like fax or text. If not, I would see if
    I could find another point of contact there. If need be, and we are close enough
    or one of our offices is close enough, and they are important, then we can make
    a drive down there. That would be a good start to get them in a conversation first.


    Then we could strengthen that relationship. I would talk about the benefits of
    Coursera to them:


    +   - Reach a Broader Audience. You can reach a bigger audience, even in other
    countries, through Coursera.

    - No Effort Required. They can just upload their courses online without any effort
    needed, since they teach their courses anyway.

    - Branding. Making yourself better know by being on Coursera. Other prestigious
    institutions like Princeton and Harvard work with us.

    - Monetization. It''s an easy way to make extra cash.


    I would then talk to them specifically about what they are looking for in this
    business relationship with Coursera and see if we can provide what they want.
    If they have any concerns or doubts, I also want to be there to answer them.'
  - '[PAGE 239]


    # Business Customers in Apple Retail Stores


    Why is it important for a business customer to purchase at an Apple retail store?


    Things to Consider


    +   - Come up with at least three reasons, preferably more.

    - Consider Apple''s cultural legacy; Steve Jobs was obsessive about controlling
    the end-to-end customer experience.


    Common Mistakes


    +   - Blurting out a single answer.

    - Rejecting the interviewer''s opinion on the matter.


    # Answer


    CANDIDATE: There are a few reasons:


    +   - Apple wants more control over the prospect''s shopping experience. For instance,
    Best Buy representatives may not be as knowledgeable or helpful as Apple''s sales
    representatives. Also, Best Buy may not showroom Apple''s products in the manner
    they would like.

    - They can see our other products there might be inclined to purchase them.

    - They can see Apple has the distribution and organization to open stores everywhere.
    It''s good for branding.

    - They can see Apple services a ton of other customers, both business and consumer.
    That''s social proof.

    - They know where they can ask for help if they run into issues in the future.'
  - '[PAGE 240]


    # Relationship with School Administrators


    As a Coursera business development executive, how would you manage to build relationships
    with school administrators?


    Things to Consider


    +   - How did you initiate contact? Warm or cold introduction?

    - How did you build trust?

    - How did you connect your needs with theirs?


    Common Mistakes


    +   - Mention that it''s impossible to build relationships with high-level administrators
    without a golden rolodex.

    - Assume that a single point of contact is sufficient when selling to a large
    organization.


    # Answer


    CANDIDATE: I do multiple things:


    +   - **Updates.** I would keep them updated with what''s going on, especially
    with their own school. For example, I would share with the administrator if a
    professor is particularly active in using Coursera whether it''s participating
    in course discussion or getting great reviews for their course.

    - **Events.** If there are any PR events relevant to them, I would give them a
    shout out.

    - **PR.** If there are any PR PR pieces related to their courses, I''ll make sure
    they are aware of it.

    - **Catching Up.** It''s important for a business development professional to
    keep up to date with everyone on his or her contact list. Every once in a while,
    I would catch up with them over coffee or something.

    - **Special Occasions.** During holidays or special events, I would send them
    a gift package.

    - **Birthdays and Important Days.** On a personal level, I would make sure they
    know I remember their special days.

    - **Transition.** In the unfortunate event that their primary contact is moving
    on, I would help facilitate a smooth transition. Nothing is worse than inheriting
    an awkward transition.

    - **Open Door Policy.** Always be there if they have any problems or issues that
    they want to talk about.'
  - "[PAGE 241]\n\n# Sale Not Going Through\n\nWhen a sale does not go through, what\
    \ is the primary reason why?\n\nThings to Consider\n\n+   - While the interviewer\
    \ is asking for a single reason, it is human nature to be disappointed if the\
    \ candidate doesn't mention the reason the interviewer had in mind. To protect\
    \ oneself, brainstorm many reasons to increase the probability that one will correctly\
    \ guess the interviewer's reason.\n- Even if a candidate does not accurately guess\
    \ the interviewer's reason, a large, comprehensive list of 15-20 items will impress\
    \ the interviewer.\n- To facilitate brainstorming, use prompts. That is, consider\
    \ the following reasons for why a sale may not complete:\n  - Customers\n  - Competitors\n\
    \  - Capabilities such as a non-operational website or nonsensical user interface\n\
    \nCommon Mistakes\n\n+   - Not mentioning more than one reason\n- Stubbornly clinging\
    \ to one's point of view and refusing to consider other alternatives\n\n# Answer\n\
    \nCANDIDATE: There could be multiple reasons:\n\n+   - A competitor offered a\
    \ better deal.\n- The negotiation wasn't getting anywhere.\n- They realized they\
    \ don't really need this right now.\n- They found it too expensive.\n- The process\
    \ is too cumbersome.\n- They don't feel like we are a responsible company.\n\n\
    They were just inquiring about the price for their own purpose. They never wanted\
    \ the sale to go through the first place."
