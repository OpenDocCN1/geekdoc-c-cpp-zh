    # Strategic Analysis of Microsoft


    Do a strategic analysis of a Microsoft business.


    Things to Consider


    +   - Did use a strategy framework such as SWOT analysis or Porter''s Five Forces
    as a checklist to organize your thoughts?


    Common Mistakes


    +   - Limited insight and analysis depth because the candidate chose to analyze
    several businesses vs. a single business.

    - Didn''t use a strategy framework to organize thoughts, which led to the analysis
    feeling incomplete and unsatisfying


    # Answer


    CANDIDATE: Microsoft is split down to two parts, basically, one customer facing
    and one enterprise facing. This is prevalent in pretty much all of its services:


    +   - Windows. Microsoft''s operating system. It''s the core of Microsoft. It
    has over 90% market domination and a stream of unending users. Consumers and enterprises
    play a huge part. Consumers get home solutions and enterprises can get professional
    and server solutions.

    - Office. Big part of Microsoft is the Office Suite. It''s pretty much required
    for both consumer and professional settings.

    - Azure & Visual Studio. These two are pretty knotted, and offer enterprise solutions.

    - Microsoft Edge. Microsoft''s own web browser.

    - Bing & MSN. Microsoft''s web services, which is promoted heavily by Windows
    through Windows Edge. Most-by. Mostly consumed, but Bing has its own ads which
    is enterprise facing, and translation services which can be enterprise facing.

    - Skype. Consumer and enterprise facing communications software.

    - Outlook / Hotmail. Email client, consumer and enterprise facing.

    - Windows Phone. For mostly. This also includes the Windows Store, which is available
    on both the phone and Windows. This also includes Surface and tablets.

    - Xbox. Platform for games. A lot of developer support and first party developers
    to.

    - Innovation. Microsoft has a lot of innovative teams, such as Hololens.


    The gist is that Microsoft has a strong business team that has connections with
    pretty much most of the enterprise world. Windows is powering a lot of services
    in both consumer and enterprise. This allows the audience to experience other
    products as Microsoft promotes them through Windows.


    Microsoft also supports providing a lot of its tools to students for free Spark,
    which means they are more likely to choose companies that work with Microsoft
    services keeps the enterprise cycle going strong.'
