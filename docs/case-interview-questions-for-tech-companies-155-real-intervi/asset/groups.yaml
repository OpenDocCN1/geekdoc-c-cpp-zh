    would say we should only keep audio/text through Hangouts as the only option.
    This will also be easier to train customer service representatives.


    At the end of the session, the user can rate the representative one to five stars;
    they can also write an optional one to line review. This will help us gauge how
    our representatives are doing and whether or not the users find this experience
    helpful.


    INTERVIEWER: Why did you mention using Gmail for help earlier instead of Hangouts?


    CANDIDATE: I figured some people may not have Hangouts enabled or have never used
    it. If a window popped up randomly it might confuse some people. In hindsight,
    it''s alright, because most programs like these do have a random popup on the
    side anyway.


    INTERVIEWER: I like the fact that you mentioned privacy earlier. What if a user
    needs help but can''t do it on his own even with audio help? He really wants the
    customer service to do it for him, but doesn''t want to expose his sensitive email.


    CANDIDATE: That could happen. Other than implementing some sort of thing to hide
    sensitive information (blur out all emails?) we can''t really do it without the
    user''s consent. That''s a lot of work for the engineers though, so I wouldn''t
    recommend it.


    INTERVIEWER: But then the user would be really unhappy if the problem isn''t resolved.


    CANDIDATE: They would, and they''ll blame Google for not helping with the problem.
    But, I still believe we should go with this solution. It''s not perfect, but I
    think most people would give consent in this case, so I don''t think engineers
    spending time to add this feature that most people won''t use is worth it.'
  - '[PAGE 65]


    # Changing Google Inbox


    How would you change Google Inbox?


    Things to Consider


    +   - Who uses Google Inbox vs. the default Gmail interface

    - What are they trying to accomplish?

    - What product improvements can Google Inbox make to better deliver on the brand
    promise?


    Common Mistakes


    +   - Spending too much time asking for context.


    # Answer


    CANDIDATE: I would undoubtedly simply start by unifying the inbox. Normally I''d
    approach this question by analyzing users and then thinking of a few solutions.
    But this is something I''ve thought of for a long time.


    Right now a lot of people have multiple email addresses. A typical user has an
    email for work and one for home. They would ideally to have both available in
    one place. Gmail is in perfect position to take this market. Before the most popular
    aggregate mail client was Thunderbird, but it is no longer being supported. Outlook
    is a class competitor, but it doesn''t actually do this inbox function well. New
    companies like Mailbird are rising up to the challenge and doing okay, so clearly
    there is a market for this.


    A unified inbox needs several functions:


    +   - Unified Inbox: The user needs to receive emails from multiple accounts.
    These all need to be in one inbox.

    - Unified Sent Box: The user needs to send emails as multiple accounts. The software
    adjusts based on which account received the mail.

    - Multiple Support: This needs to support the most popular email providers like
    Yahoo, AOL, and Outlook / Hotmail. Less popular email providers can be supported
    under POP3 and IMAP.

    - Hangouts: Users can log into Hangouts over multiple identities. If he has friend
    A on account X and friend B on account Y, he needs to talk to them as accounts.


    The reason why this is a great idea is because there is a clear need for this
    in the market. If a user is using something like Mailbird, we cannot show ads
    to the user. With ads being the major source of revenue for Google as a whole,
    it''s essentially we recapture this market.


    INTERVIEWER: It''s interesting you mentioned this. Why do you think Gmail has
    not thought of this yet?


    CANDIDATE: I am sure they, but they probably don''t see a compelling reason to
    spend time on this. Companies like Mailbird hasn''t exactly been blessed with
    skyrocketing users, and I am sure the majority of users don''t have more than
    one email. However, it''s a growing trend. I''m surprised big companies like Microsoft
    haven haven''t invented similar products.'
  - '[PAGE 66]


    # Disneyland and Google Products


    Improve the Disneyland user experience, relevant to a Google product.


    Things to Consider


    +   - Use the CIRCLES method.

    - Think of a big, moonshot idea.


    Common Mistakes


    +   - Not exploring the customer needs first.

    - Not clarifying with the interviewer on whether it is about improving the general
    Disneyland experience or improving the Disneyland experience with Google products.


    # Answer


    CANDIDATE: Can I get some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: I have a few ideas with Google Maps:


    +   - **Estimated wait time and comments.** Showcase the estimated wait time for
    each attraction. People can also leave comments as ratings. Sample comments could
    be, “This attraction is great,” “This one isn''t that fun,” and "This thing is
    over here"

    - **Directions for the place.** This one is simple. We simply have directions
    for the place. Disneyland can be huge and it would be easy to get lost. Sometimes,
    it''s also hard to find where an attraction is, or say, the bathrooms or food.

    - **Show times and important figures.** Showcase times so people will know when
    to go. Also showcase where important figures will appear at. There are a lot of
    costumed employees and it can be hard to track them.


    INTERVIEWER: Which one do you think will make the biggest impact?


    CANDIDATE: Technically the latter two would be built on direction to the place,
    so that would be the biggest impact. Sometimes a lot of people get tired trying
    to find something and leave. That''s a frustrating experience. By showing them
    where everything is, they will spend more time enjoying and less time to figure
    out where they are. They will probably find exciting attractions they didn''t
    know about and have a great time.'
  - '[PAGE 67]


    # Grocery App


    What features would you suggest for a grocery app?


    Things to Consider


    +   - Define customer segments; explore customer needs deeply.

    - Give your feature ideas memorable names, so it is easier for your interviewer
    to record and recall.


    Common Mistakes


    +   - Unimpressive, commonplace ideas such as a grocery list.

    - Not drawing out wireframes to help the audience to visualize your solution.


    # Answer


    CANDIDATE: Do you have a specific implementation in mind?


    INTERVIEWER: No, you can design anything you want, as long as it has to do with
    groceries.


    CANDIDATE: Can I get some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: I have a few users in designing the app for groceries.


    +   - Bargain Hunters. These are people who want to buy groceries on deal.

    - Cooking Enthusiasts. These are people who like cooking, but do not know a lot
    of recipes.

    - Health Conscious People. These people may be exercising or just people who want
    to be healthier.

    - The Undecided. These people come in the grocery store not knowing what to buy
    because they have no idea what they want to eat next week.


    I like buying on deals, so I would like to focus on the Bargain Hunters persona.


    INTERVIEWER: Okay.


    CANDIDATE: I am thinking of three features:


    +   - Price Comparisons. So for the Bargain Hunters, they can scan the bar code
    of the item they want to purchase and see price comparisons with nearby stores.
    This helps them save.

    - Coupon Finders. Whenever they scan the code of an item, the bargain hunters
    can automatically download coupons (if applicable) for the item. They can also
    see coupons and weekly deals so they can decide what to buy.

    - Alternatives. Whenever they scan an item, the app can give cheaper alternatives
    (e.g., you can use chicken legs instead of chicken thighs in your store it''s
    cheaper this week).


    Out of all of these, I think I like price comparisons more. It''s a natural way
    to use your phone, and it''s very useful. We can also track price points through
    this since we have data now. It also has a lot of'
  - '[PAGE 68]


    advertising opportunities. The con is scanning might take a lot of power, and
    it can be hard to hold a phone

    on one hand and your basket or cart on the other when shopping. It might also
    get tedious to scan every item

    you want to buy. On a typical trip to the grocery store, I would probably look
    at least 50-60 items.'
