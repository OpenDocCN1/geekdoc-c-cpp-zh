    # Chapter 27 Behavioral


    # Hardest Professional Relationship


    What is the hardest professional relationship you have had?


    Things to Consider


    +   * The interviewer is testing your ability to get along with others.

    * Do not dodge the question; interviewers want a genuine example.

    * Do not indicate what you have learned from that experience; do not allow the
    interviewer to conclude that you would repeat that mistake, if you were put in
    a similar situation.


    Common Mistakes


    +   * Dodging the question with a clever answer is meant to make you look good.
    For instance, “A boss once hated me for asking tough questions because he didn’t
    know the answers. However, he came to accept my stellar critical thinking skills.
    Now we are best friends, once he accepted my ability to foresee critical risks
    and dependencies.

    * Not indicating what you have done to improve your ability to handle difficult
    professional relationships (aka no improvement plan).

    * Not sharing with the interviewer how others perceive your ability to handle
    difficult professional relationships, after you have implemented your improvement
    plan.


    # Answer


    CANDIDATE: The hardest professional relationship I ever had was with an artist
    on my team. She was a great artist by all accounts, but it felt like she too critique
    badly. As you know, it''s a challenge to work with artists if you feel something
    is off about an asset they''ve got, then you need to be tactical in bringing it
    up.


    Anyway, her name is Kay, and we had a great relationship working together in the
    beginning. Her skills as an artist were unmatched, and everything she did was
    high quality. However, whenever I had some critiques for her pieces to match what
    marketing or development wanted, she didn''t take it well.


    I was concerned that I provided feedback the wrong way. I spoke with another artist
    to get his opinion about how I presented the feedback. I asked him to observe
    future interactions between Kay and me. Several days later, he concluded that
    I didn''t do anything wrong.


    With out of the picture, I tried different ways of working with her. Eventually,
    I realized she liked it better when I influenced her in a way that she came with
    the idea herself. I guess she felt more ownership that way, and from that point
    on, I''ve always talked to that that when sharing an idea or raising an issue.
    It was hard for me at first, but everyone is different. I can''t expect to work
    with everyone the same way.'
