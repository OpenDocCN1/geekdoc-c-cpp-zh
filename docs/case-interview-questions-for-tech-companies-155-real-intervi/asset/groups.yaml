    # Google 登月计划项目 (Moonshot Projects)


    你认为为什么 Google 在其登月计划项目上投入了这么多资金？


    考虑因素


    - 登月计划对公司有什么影响？

    - 对员工有什么影响？

    - 对竞争格局有什么影响？


    常见错误

    - 未提到需要吸引并参与那些渴望挑战性项目的员工。

    - 未提到需要赋予员工更大的自由感。


    # 回答


    **应聘者**：我认为这其中有几个原因。


    第一，登月计划驱动了创新。还记得那 20% 计划吗？那是大多数公司不会做的事，但 Google 做到了。这 20% 的时间产生了惊不起的项目，包括 Gmail
    和 Google News。以 Gmail 为例，它是目前全球最常用的电子邮件客户端。单是 Gmail 产生的收入可能就足以涵盖所有投入在这些 20% 时间上的成本了。我们可以看到为什么
    Google 会鼓励这样做。


    第二，登月计划实现了业务多元化。当你像 Google 这么大时，市场份额固然重要，但多元化出于几个原因原因。首先，现有业务的增长率可能会变得平缓。为了维持增长，Google
    需要向新的高增长业务进行多元化。其次，它最小化了风险。通过不把鸡蛋放在同一个篮子里，Google 可以为最坏的情况做好准备。最后，华尔街不喜欢意外惊喜；多元化的投资组合可以缓解
    Google 业务的波动。


    第三，登月计划留住了员工。一个常见的误区是，只有初创公司才能拥有大胆、创新的想法。结果是追求大胆新事业的员工往往会离开雇主去创立自己的公司。Google 与其放任这种情况发生，不如让其员工在公司内部创建初创公司。通过资金支持员工，Google
    可以反驳这一误区，留住人才，最重要的是，发现未来的增长引擎。


    总之，Google 在登月计划项目上投入这么多资金，是因为这些项目符合其创新文化，并且在经济上是合理的。它们还帮助了 Google 业务多元化。登月计划也有助于留住客户。


    # 第 19 章运营


    # 在新城市运营 Uber


    你如何在一个没有先例的城市启动 Uber 运营？


    考虑因素


    - 面试官要求你制定一个计划。

    - “没有先例”这个短语强烈暗示你需要带着自己的假设和知识来到现场。换句话说，你不应该浪费时间索要背景信息。面试官可能没有这些信息，或者可能不想向你透露。透露背景信息可能会泄露机密或让面试题变得太简单。

    - 向面试官提问过多，尤其是当面试官的回答和肢体语言强烈暗示他她不会提供额外的背景时。


    常见错误


    # 回答


    **应聘者**：这个城市的汽车使用率高吗？


    **面试官**：你会如何处理这两种情况？


    **应聘者**：嗯，好的。我等会讨论那个。出租车呢？城市出租车多吗？


    **面试官**：你为什么不针对这些场景写下解决方案呢？


    **应聘者**：好的。我会从以下几个方面考虑：


    - **高汽车使用率**：如果该城市汽车使用率很高，启动 Uber 会更容易。否则，我们去哪里找司机呢？如果汽车不多，我们可能需要与当地汽车经销商合作，看看是否可以请他们为
    Uber 司机提供价格有吸引力的车辆。

    - **交通**：交通拥堵吗？如果是，我会建议推广像 UberPool（拼车）之类的服务并减少交通。在交通拥堵的城市，体验可能很糟糕，所以我们要利用我们的预计等待时间。

    - **出租车**：如果出租车很多，我会检查它们的费率并确保我们具有竞争力。我们的核心业务始终是提供比出租车更好的用户体验，有竞争力的定价绝对有帮助。

    - **法律与法规**：我们要了解法律法规，并看看我们如何有效地与它们配合。

    - **竞争对手**：我们有任何竞争对手吗？除了类 Uber 的竞争对手外，我们还需要考虑出租车、公交和像 car2go 这样的共享汽车等替代方案。

    - **活动与本地企业**：与当地活动和企业合作推广 Uber。他们会乐于不用提供那么多停车位，而我们把自己推销为人们享受的可行交通选择。

    - **公关 (PR)**：一定要做公关，让人们知道 Uber 现在已经来这里了。

    - **数字营销**：我们需要确保我们的应用被下载。

    - **支付**：根据我们所在的位置，人们可能会使用不同的支付平台（例如移动支付）或完全不同的支付类型（例如预付卡、运营商账单）。我们需要确保适应当地的习惯。


    总结一下，首先我会确保司机的准入门槛不会太高。如果是，我们永远得不到足够的司机。然后我会根据竞争情况进行定价。接下来，我们要确保引入市场认为易于使用的服务，例如人们支付的最方便方式。最后，我想通过我们的渠道推广我们的服务。


    **面试官**：你提到了法律要求，这很好。你认为 Uber 如何留住客户吗？


    **应聘者**：是的，登登客户。。。根据竞争情况定价。。，我们要确保引入市场认为易于使用的服务，例如人们支付的最方便方式。


    最后，我想通过口碑、社交媒体和广告来推广我们的服务。


    **面试官**：你提到了广告，这对留住客户也有帮助，这很棒。如果城市要求 Uber 获得特殊认证怎么办？


    **应聘者**：特殊认证对 Uber 有害的，因为：


    1. 让公民获得 Uber 变得更困难

    2. 减少了司机供应


    结果，我会游说相关官员并开展草根活动，让客户支持我们。


    # Uber 的新服务


    你会增加什么新服务或促销以以最小的投入获得最大的回报？


    考虑因素


    - 这是一个测试你构思奇点想法的能力。

    - 为了增加面试官接受你想法的机会，至少脑思 10 个想法。

    - 为了让面试官更容易接受你的想法，通过解释必要的背景：它是什么、如何运作以及为什么对 Uber 来是独特的。


    常见错误


    - 平庸的想法。

    - 提出了 Uber 已经提供的想法。


    # 回答


    **应聘者**：嗯，我有任何限制吗？


    **面试官**：没有。


    **应聘者**：可以给我一点时间脑思吗？


    候选者花了一分钟。


    **应聘者**：好的，我有几个想法：


    - **Uber 资金 (Uber Funds)**：你可以折扣购买 Uber 积分。我们每个月会有不同的优惠，并设有上限。这让我们更早地获得他们的资金，客户最终会使用
    Uber 积分，因为其他地方不能。如果这真的火了，我们可以将其扩展为支付系统。

    - **Uber 积分 (Uber Points)**：你每次行程，根据里程数都会获得积分。积累足够的积分后可以兑换 Uber 积分。这很好，因为它会鼓励用户使用
    Uber，而 Uber 积分只能用于 Uber。

    - **Uber 活动 (Uber Events)**：每当有大型活动时，我们可以让他们允许一个指定区域供 Uber 司机接、送和等待客户。活动方可以获得抽成，我们可以在
    Uber 上推广活动，客户发现使用 Uber 活动更方便。


    这些大部分都是针对客户的，因为我并不担心司机。有了足够的客户，溢价定价会考虑到司机的因素。


    **面试官**：你为什么认为 Uber 资金会受欢迎？


    **应聘者**：很多服务都提供类似的东西，比如亚马逊或苹果。这本质上是商店积分，如果人们在任何地方偶尔使用 Uber 或者计划未来使用，购买积分对他们来说是划算的。这对我们来说也是划算的，因为我们更早地获得了他们的钱。不仅如此，用户必须使用
    Uber 来花费积分，我打赌大多数人不会将其清零到零，所以本质上是大量的免费资金。


    '
