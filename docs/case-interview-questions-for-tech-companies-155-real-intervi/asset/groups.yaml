    # Marketing Google Fiber


    How would you increase adoption of Google Fiber?


    Things to Consider


    +   - Google Fiber is broadband Internet and cable TV offering. It competes with
    Comcast, Time Warner Cable and Charter in the United States.

    - Key challenges include both awareness and limited word-of-mouth marketing.


    Common Mistakes


    +   - Giving a laundry list of marketing ideas without an accompanying strategic
    plan.

    - Suggesting marketing tactics to drive trial without introducing awareness and
    first trial.


    # Answer


    CANDIDATE: I don''t know anyone with Google Fiber, so let me sure I understand:
    Google Fiber''s broad Internet and cable TV service in the United States. Is that
    correct?


    INTERVIEWER: That''s correct.


    CANDIDATE: How many subscribers does it have?


    INTERVIEWER: That''s not relevant to the question.


    The brush off takes candidate aback.


    CANDIDATE: Okay, let me brainstorm a bit for adoption ideas.


    Candidate takes one minute.


    CANDIDATE: I would approach it from these directions:


    +   - Improve User Experience of Certain Products. Many people use the Internet
    to watch YouTube, Netflix or Hulu; they also use the Internet to play games. We
    can improve the user experience. YouTube is easy, but the others might require
    us to partner with them. I am very concerned about the news I''m hearing: Comcast
    and other Internet service providers declared they would start throttling Netflix
    and Hulu.

    - User Story. We can run ads and PR about who switched from other providers to
    Google Fiber. Comcast did the same thing vs. Dish. The majority of our market
    share will be taking it from other providers, this is a good tactic.

    - Competitive Service. Google Fiber is already magnitudes faster than other providers.
    We also need to make sure we can beat their rates as well. One of the biggest
    complaints is that Comcast and other providers have a monopoly on Internet, so
    they are allowed to charge ridiculous amount of money. If we can provide a better
    rate, the users will hop over.


    INTERVIEWER: Which idea do you think would make the biggest impact?'
  - '[PAGE 191]


    CANDIDATE: I would say competitive service. I feel like this is already a strategy
    Google Fiber is employing, and we need to keep this up.


    INTERVIEWER: It seems like a lot of your strategies are focused on grabbing market
    share from other competitors. Have you thought about converting new users?


    CANDIDATE: I have, but most users who want Internet already have Internet. Take
    me for example, I''d love to use another service, but my provider is the only
    thing available in my area. I have no choice, which is why some users have complained
    that these providers essentially have a monopoly. This is why I think by providing
    better service at a lower cost; it''s easy for Google Fiber to win out in the
    end.


    INTERVIEWER: If that''s indeed true, why do you think Google Fiber hasn''t just
    launched everywhere the country? Why launch slowly across select regions?


    CANDIDATE: I think there are multiple reasons. One, Google Fiber probably requires
    a lot of infrastructure setup, and also team support. This slows things down.
    Two, it would take some time to make back all the money spent during setup, so
    it''s unrealistic to launch everywhere at once. It''s good to launch and see how
    we can improve our services. Even just in the US, people are vastly different
    state by state. What may not be applicable elsewhere. By launching slowly, we
    can ensure our users receive the best service, which is great for us.'
  - '[PAGE 192]


    # Google and Teleporter


    Google just invented the teleporter. Give me your go-to-market plan. Also add
    three features to this teleporter.


    Things to Consider


    +   - Use the Big Picture marketing framework to build your marketing plan.

    - Trial usage will be a critical marketing goal.


    Common Mistakes


    +   - Providing marketing tactics only and neglecting marketing strategy, especially
    how the tactics tie into the strategy.

    - Suggesting marketing ideas that are bland.


    # Answer


    CANDIDATE: Can I ask some clarifying questions?


    INTERVIEWER: Sure.


    CANDIDATE: I am assuming the teleporter transports people yes?


    INTERVIEWER: Yes, it does.


    CANDIDATE: It is more for transporting one or two people at a time or are we talking
    about 5-10? How big of a group are we talking about? Also, is it practical (cost-effective)
    to transport packages? Is there any limit to size, weight or number for those?


    INTERVIEWER: It can transport 50 people at once. It can transport objects as well,
    around the same size and as 50 people. Number is not a limit, just the size. It''s
    cost-effective for both cases.


    CANDIDATE: Is there some sort of cool-down period for this machine? Do we also
    have hard requirement (e.g., lots of power, lots of space, government licenses)
    for this technology?


    INTERVIEWER: There is around a 10-minute cool-down period for the machine. There
    is no hard requirement for this.


    CANDIDATE: Can this teleports things into an empty space or does it need another
    teleporter on the other side?


    INTERVIEWER: It needs another teleporter on the other side.


    CANDIDATE: Okay, thank you for all those clarifications. Can I get some time to
    brainstorm?


    Candidate takes one minute.


    CANDIDATE: I have a few marketing plans in mind:'
