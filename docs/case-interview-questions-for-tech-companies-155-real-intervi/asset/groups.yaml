    things like Yahoo Search, Yahoo News, and Yahoo Map.

    - Enterprise. Yahoo has certain products that are free for consumers and can be
    purchased as an enterprise solution. An example of this is Yahoo Mail.

    - Sales. Yahoo sells some products for money. Examples of this include Yahoo’s
    TV service and Yahoo Music.

    - Royalty and Cuts. Yahoo has some portals that sell products owned by others
    for a cut. Examples of this include Yahoo Shopping and Yahoo Travel.'
