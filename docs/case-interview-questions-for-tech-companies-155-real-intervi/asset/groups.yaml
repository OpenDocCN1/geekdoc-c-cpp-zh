    Imagine you are a supplier considering an opportunity to sell your flagship X
    on the Amazon.com marketplace.


    What challenges would you face? And how would you overcome those challenges?


    Things to Consider


    +   * What''s the expected demand forecast?

    * What''s the best way to fulfill and ship products?

    * How would you promote the product on Amazon''s merchandising pages?

    * What additional promotion will you do outside of the Amazon.com marketplace?

    * How would you determine the price?


    Common Mistakes


    +   * Forget about setting price or assuming that determining price is easy


    # Answer


    CANDIDATE: Here are a few challenges and solutions that I can think of:


    | Challenges | Solutions |

    | --- | --- |

    | Competing products | - Make a better product<br>- Reduce prices |

    | Alternative products | - Make a better product<br>- Reduce prices |

    | Other distributors, especially when Amazon is not the exclusive distributor
    | - Reduce prices<br>- Offer better service such as better return policies or
    faster shipping |eting websites that seem similar, competing or alternative products
    that become popular because Amazon or are cheaper Customer discovery or the challenge
    of showing up to the right customers because there are too many products on Amazon''s
    site Low conversions because product price doesn''t meet Amazon''s free shipping
    threshold Items or descriptions might be misleading | - Price accordingly<br>-
