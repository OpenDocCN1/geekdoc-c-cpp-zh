    候选人：让我们尝试一种朴素的方法。我们每隔 10 层投掷一次第一个蛋，比如第 20 层、第 30 层、第 40 层等。假设它在第 30 层碎了。我知道楼层比第
    20 层高，但比第 30 层低。我们将从第 21 层开始，然后是第 22 层、第 23 层，以此类推，直到它碎为止。在最坏的情况下，它在第 99 层碎了，这意味着第一个蛋投掷了
    10 次（ 10 层到 100 层），然后第二个蛋投掷了 9 次（ 91 层到 99 层）。所以我们知道这种方法的答案是 19。我们想看看能否做得更好。


    现在我要求解 N，其中 N 是小于 19 的投掷次数。首先，我们想尝试在第 N 层投掷。如果它碎了，我们现在少了一次尝试机会，所以我们应该向上移动 N-1
    层，这将使我们处于 N+N-1 = 2N-1 层。我们再向上 N-2 层，以此类推。


    我们可以将其表示为一个公式：N + N-1 + N-2 + ... + 1 >= 100。我们说 >= 100 等于总楼层可能超过 100 层，但否则它不会低于
    100 层，否则在不尝试第 100 层的情况下，我们无法确定某个楼层是否是最高层。


    我们可以将此公式表示为求和。注意 N+1 是 N+1，N-1+2 是 N+1，N-2+3 是 N+1。我们总共有 N 个数，所以有 N/2 对。我们可以将其表示为这个公式：N(N+1)/2
    >= 100。


    然后我们可以求出得到这个数字的 N 的最小值。记住，它应该小于 19。


    事实 14 是满足该公式的 N 的最小值。我们就得到了答案。我们的策略是：


    - 第 N 层：第 14 层

    - 向上 N - 1 层：14 + 13 = 27 层

    - 向上 N - 2 层：27 + 12 = 39 层

    - 向上 N - 3 层：39 + 11 = 50 层

    - 向上 N - 4 层：50 + 10 = 60 层

    - 向上 N - 5 层：60 + 9 = 69 层

    - 向上 N - 6 层：69 + 8 = 77 层

    - 向上 N - 7 层：77 + 7 = 84 层

    - 向上 N - 8 层：84 + 6 = 90 层

    - 向上 N - 9 层：90 + 5 = 95 层

    - 向上 N - 10 层：95 + 4 = 99 层。如果蛋在这里没有碎，我们就不会得到最大次数。让我们假设如此吧。

    - 尝试从第 95 层一直到第 98 层。这将需要 4 层。


    我们总共有 14 次投掷。这就是我们的答案。


    ## 第 25 章 产品管理：通用


    ## PM 面临的挑战


    PM（产品经理）面临哪些挑战？


    ### 需要考虑的因素


    PM 最常见的挑战包括：


    - 传达产品愿景

    - 说服团队采取特定的行动方案

    - 寻找帮助团队在更短时间内内完成更多工作


    ### 常见错误


    - 抱怨不必要的任务，例如记笔记和安排会议。

    - 在产品不好、营销不力、资源有限或工程团队能力不足时抱怨由自己负责。

    - 抱怨高层优先级不明确或一天中的时间不够。


    ## 回答


    候选人：PM 有几个挑战需要解决：


    - **说服你的团队：** 作为 PM，你没有官方权力，所以如果你想让团队执行你的想法，你就需要通过证明过的成功来来说服他们。这可能会让你感到沮丧，因为你觉得你知道什么是最好的。但要明白，如果你对其他人有权力，使用这种权力是软弱的表现。让你的知识、魅力和经过证明的成就来说话吧。

    - **理解为什么：** 当有人告诉你你不能按照你想要的方式做，或者他们不理解你的想法时，你需要。


    ## 你喜欢做 PM 的哪一点？


    你喜欢 PM 的哪一点？


    ### 需要考虑的因素


    大多数 PM 喜欢这个职位的原因如下：


    - 产品设计：PM 痴迷于创造产品。

    - 领导力：PM 喜欢领导团队目标。

    - 业务管理：PM 喜欢端到端的


    ### 常见错误


    强调职位中不关键的部分：


    - 培训销售团队。

    - 定义产品定价。

    - 开发市场计划。


    ## 回答


    候选人：我最喜欢做 PM 的部分可以归纳为三点：


    - 产品设计：从零开始设计满足用户的产品是非常有感的。虽然你不是设计师，但作为 PM，你确实参与了设计。部分乐趣来自于围绕客户需求进行设计，并说服团队与你一起。

    - 产品改进：大多数产品开发都是迭代的。通过反馈和看到数据来进行改进。作为 PM，你的工作是识别缺失以及如何修复。看到进步带给我成就感。

    - 影响力：创造影响数百人的产品具有巨大的吸引力。此外，除非我做的是坏的产品，否则知道我和团队让数百人开心是很好的。


    ## 第 26 章传统类


    ## 传统与行为面试题简介


    虽然此本书侧重于案例题，但传统和行为面试题在科技行业的候选人评估过程中仍然起着重要作用。例如，谷歌的人力部门已要求其面试官多问行为面试题。


    亚马逊对行为面试题比谷歌更加狂热。亚马逊非常重视候选人与其文化的匹配度。亚马逊的文化总结在 14 项公司价值观中，被称为“亚马逊领导力原则”，公司通过行为面试题测试候选人与这些原则的契合程度。


    总之，传统和行为面试题并没有在消失；它们仍然是面试过程中非常重要的组成部分。最后两个章节共约 25 页，将为你提供练习机会，并让你自己的表现与示例答案进行对比。


    '
