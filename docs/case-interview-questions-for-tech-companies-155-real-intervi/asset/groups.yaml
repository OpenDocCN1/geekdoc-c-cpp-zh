    \ an incredible sum.\n\nI submitted my pictures and calculations to the shift\
    \ supervisor. I also proposed a new method to load the trucks. The shift supervisor\
    \ asked a couple of questions and thanked me for my notes.\n\nI was surprised\
    \ that during my next visit to Seattle for the annual conference, the shift supervisor\
    \ had nominated me for the employee of the quarter award. Apparently the supervisor\
    \ took my recommendations, implemented them and saved $250,000 on labor.\n"
  mdcn: "\n\n# 提供反馈\n\n请给我举一个你必须提供反馈的例子。\n\n### 需要考虑的因素\n\n- 你能否回想起这样一个时刻：\n  - 在别人没有勇气这样做时，你面对了某人\n\
    \  - 以一种非凡、优雅的方式提供了反馈？\n\n### 常见错误\n\n- 提供了一个反馈内容平庸的例子。例如，“我建议我的同事推迟会议开始，以便适应来自十个时区的同事加入。”\n\
    - 举了一个反馈未被良好采纳，但并未产生有限或没有后果的例子。例如，“我提议我们举办一个烹饪班，结果团队投票决定去参加玻璃吹。”\n\n# 回答\n\n**候选人：**\
    \ 当我刚在戴尔（Dell）工作时，我是员工里最年轻的成员。一位在戴尔工作了30年的同事告诉我，他“很懂这行的门道”，而我只需要“排队等着”。\n\n他那粗鲁的态度让我大吃一惊。遗憾的是，这种闹剧在第一天并没有结束。在会议期间他从不与我对视，我发现他经常性地在重要的邮件中漏掉我。\n\
    \n我想和他讨论这个问题，但他从未给我机会。我设想他觉得我年轻又天真。这种被忽视的感觉并不好；这伤害了我的自尊心。最终，我决定采取高姿态并证明自己。我努力工作，表现得专业，并且学得很快。\n\
    \n大约两个月后，他邀请我喝咖啡，这令我很惊讶。他告诉我，他低估了我，并且对我努力融入并证明自我的表现留下了深刻印象。\n\n在那一刻，我曾想要报复，告诉他他是我工作过最糟糕的人。然而，我决定再次采取高姿态。我告诉他，我很感激他认可了我的努力，并告诉他适应新环境是很困难的，尤其是当像他这样的团队成员看起来并不欢迎时。\n\
    \n他告诉我，他被这种坦率和愿意提供反馈的意愿所打。后来他告诉我的经理，他对我愿意直面冲突并告诉他们坏消息的劲感到印象深刻。他认为这非常非凡。他觉得其他人会避开这种尴尬的感觉，转而在他背后议论。\n\
    \n我的老板向我分享了这一反馈，并在后将这封积极的邮件包含了我的六个月绩效评估中。\n\n# 独立做出决策\n\n给我讲一个你为某个项目或任务做出所有决策的经历。\n\
    \n### 需要考虑的因素\n\n- 旨在展示你的领导能力。\n- 许多产品经理（PM）候选人倾向于将责任推给别人。\n\n### 常见错误\n\n- 犹豫于回答，因为“做所有决策”这个说法听起来像独裁，这在当今以团队为中心的环境中是不受欢迎的。\n\
    - 鉴于提的措辞，在回答中被视为“独裁者”。\n- 没有圆满结局。例如，“我们连续两周每周工作80小时，但他们还是决定取消项目。”\n\n# 回答\n\n\
    **候选人：** 在我现在的公司，产品管理总监因病辞职了。结果，我负责了一个表现不佳的项目。感觉我们没有取得进展，而且落后于截止日期。高管层非常清楚我们的问题，因此他们对我开发团队下了最后通牒：在两个月内完成项目，否则接受遣散费。\n\
    \n开发团队并不认可这个最后通牒。在与开发团队进行了一次诚心的长话后，他们表示无论我做什么决定他们都会感到很自在。\n\n我赢得他们的信任感到很荣幸，但也感到肩负巨大压力。我现在要为开发团队的生计负责。\n\
    \n在考虑了利弊之后，我最终决定完成它。我们针对项目工作了四个月，我觉得我们不是那种能完成它的团队。如果我们不再尝试一次，是不对的。\n\n在推进过程中，我与我的印度团队明确了最终截止日期。我听了她关于如何在短时间内最好地实现我们的目标的反馈。从那里开始，我优先考虑所有功能，并删减了对于实现目标并非至关重要的请求。\n\
    \n我和大多数团队成员在两个月里每周工作了约80小时，团队的大多数成员也是如此。我很高兴我们完成了项目。\n\n**面试官：** 你认为项目起初为什么会落后呢？\n\
    \n**候选人：** 以下是我脑海中的首要原因：\n\n- 目标不明确。高管们想让我们做什么并不明确。某一周，他们想增加变现能力；下下周，他们又忙于获取新用户。\n\
    - 缺乏愿景。离职的产品管理总监对游戏有一个开创性的愿景，但他被高管们否决了。高管们想让我们模仿竞争对手，而那些对手引发了一场使用增强现实的游戏热潮。\n\
    - 资源匮乏。我们最初为该计划配置了5名工程师，但高管们抽走了3个人去负责另一个项目。\n\n**面试官：** 回顾你的决定，如果人们陷入恐慌且士气低落，你会怎么做？\n\
    \n**候选人：** 我将赶日期的决定定位为我的建议。我回答了他们对此提的任何问题，但我希望他们认同并拥有这个决策。\n\n# 快速判断\n\n给我讲一个你必须使用快速判断的时刻。结果如何？\n\
    \n### 需要考虑的因素\n\n- 如果处在你的境地，大多数人会犹豫不决吗？\n- 是否清楚其他人会要求更多时间来做决定？\n- 考虑到这种情况，结果是最优的吗？还是这仅仅说明你倾向于做出草率的决定？\n\
    \n### 常见错误\n\n- 枯燥、无味的故事。\n- 故事情节的漏洞。\n- 无谓地添加额外细节，主要是由于情感负担。\n\n# 回答\n\n**候选人：**\
    \ 当我们的第一款游戏在软启动期间取得一些成功时，我必须就客户服务做出决定。传统上，我们公司的产品经理负责客户服务。考虑到我们产品经理日益增加的职责，这最终是不可持续的。因此，我必须做出选择：\n\
    \n- 我是维持现状？\n- 还是聘佣一个专门的客户服务团队？\n\n决策的困境源于事实：招聘至少需要一个月，入职培训还需要两周，新团队成员才能开始发挥作用。此外，如果游戏不成功，新招聘的客户服务团队将将无事可做。\n\
    \n在咨询他人并公平地权衡利弊后，我决定聘佣一个专门的客户服务团队。在最坏的情况下，如果他们没事可做，可以协助其他团队成员完成其他任务。此外，为了保持低成本，我决定聘佣兼职实习生。\n\
    \n我最终招聘了三个每周工作20小时的实习生，并指导他们直到他们能够独立。他们表现得出色，我们在游戏成功时将他们转为全职。我们的用户喜欢我们的服务水平，更重要的是，我们经理的士气在季度调查中得到了显著提高。\n\
    \n# 行动主动\n\n给我讲一个你展现行动主动的时刻。\n\n### 需要考虑的因素\n\n- 招聘经理喜欢不需要催促就采取行动的员工。这节省了他们催促或担忧的精力。\n\
    - 这个问题测试员工是否能在没有提示的情况下完成工作。\n- 有力的回答不仅展示了候选人的主动性，还展示了他们超越预期的能力。\n\n### 常见错误\n\n\
    - 回答太短。短回答（尤其是少于30秒的）会：\n  - 面试官意犹未尽\n  - 你显得缺乏经验（毕业生更容易这样）\n\n# 回答\n\n**候选人：**\
    \ 作为亚马逊的运营人员，我访问过很多配送中心。多年来，我访问过亚利桑那州、印第安州、肯塔基州和宾法州的配送中心。\n\n有一天，我在印第安州的一个亚马逊配送中心观察进货卡车。我发现员工正在卸损坏的货物，这需要大量时间清理才能卸下剩下的货物。破碎的玻璃和箱子阻止了员工完全卸下卡车，导致的人时超过了预算。\n\
    \n我意识到货物损坏是因为重箱放在了轻的箱子上。我拍了一些照片。在观察了这种情况几天后，我还计算了公司损失的成本。该配送中心每年卸30天卡车，每个4人小组需要额外花费5小时清理。按每小时15美元计算，我发现这是一个惊人的数字。\n\
    \n我将我的照片和计算结果提交给了值主管。我还提了一种新的装载方法。值主管问了几个问题并感谢了我的笔记。\n\n令我惊讶的是，当我下次访问西雅图参加年度会议时，值主管提名我获得“季度优秀员工”。显然，主管采纳了我的建议并实施了它们，节省了25万美元的人工成本。\n\
    \n"
