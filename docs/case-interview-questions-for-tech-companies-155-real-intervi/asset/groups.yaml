    # Uber Processes


    What processes do you imagine Uber has on the demand side? How about supply side?


    Things to Consider


    +   - The interviewer is testing your ability to think through key processes.

    - Drawing out a process map will help you be more thoughtful while impressing
    the interviewer with a visual.


    Common Mistakes


    +   - Not communicating demand and supply-side processes in an organized, easy-to-follow
    manner.

    - Missing critical yet less obvious processes, such as payment fraud detection.


    # Answer


    CANDIDATE: For the demand side:


    +   - Payment processes like credit cards and mobile payment.

    - Fraud processes like stolen payment credentials.

    - Monetization processes like ads and apps.

    - Geographic specific processes both on the city, county and country level.

    - Authentication processes to allow riders to easily login.

    - Promotional processes to increase rider demand.


    For the supply side:


    +   - Legal processes including and not limited to taxes and driver licenses.

    - Driver promotion and on-boarding processes to increase the number of new drivers.

    - Drive authentication processes to allow drivers to easily login.'
  - '[PAGE 164]


    # 1000 Drivers in Four Weeks


    How would you recruit 1,000 drivers in four weeks?


    Things to Consider


    +   - The interviewer is probing your ability to achieve what others believe to
    be impossible.

    - A good answer demonstrates a willingness to embrace challenges.

    - While interviewers appreciate creative ideas, feasibility of those ideas is
    equally important.


    Common Mistakes


    +   - Sigh loudly and other body signals that demonstrate a lack of confidence.


    # Answer


    CANDIDATE: Here''s what I''d do:


    +   - Post on every job website, including secondary ones like Craigslist and
    forums. I would also recruit drivers on social media channels including Uber''s
    Twitter and Facebook pages.

    - Call up every Uber driver we have on file and start a referral program. Refer
    a new driver that drives at least 5 days with at least 1 ride each would merit
    a cash bonus.

    - Run online ads on Facebook and Google, promoting the money making opportunities
    on Uber and the luxury of working on your own time.


    INTERVIEWER: Have you thought about working with local small taxi companies that
    have too many drivers and not enough rides?


    CANDIDATE: I have, and I don''t think it''s a good idea. One, they are unlikely
    to work with us since they view us as competitors. Two, they don''t provide the
    same high-quality customer experience. If we service customers using their cars
    and drivers that are unfamiliar with Uber process and standards, we could damage
    our own brand.'
  - '[PAGE 165]


    # Making Uber Successful


    How can you make Uber successful in your city?


    Things to Consider


    +   - Treat this question as a marketing plan or product design question, depending
    on the interviewer''s preference.

    - If it''s a marketing plan, use the Big Picture Framework.

    - If it''s a product design, use the CIRCLES method.

    - Resist the temptation, even if the interviewer attempts to cajole you, to answer
    the question from both a marketing and product design question. The scope is too
    large. Tackling both marketing and product elements will water down your response,
    making your answer less impressive.


    Common Mistakes


    +   - Not clarifying what successful means to Uber or to the interviewer.

    - Not asking about the magnitude or timeframe for success.


    # Answer


    CANDIDATE: I live in San Francisco, and Uber is already very popular here. Let
    me use another city as an example: Atlanta. I lived in Atlanta before. For Uber,
    surge pricing encourages drivers to sign-up and pick-up fares. What we need is
    a robust market. Since the driver incentives are in place, we just need a healthy
    supply of consumers. So all of my solutions target that:


    +   - **Uber Promotions.** Monthly promotions, such as buying Uber credits at
    a discount, to incentivize more customers.

    - **Collaborating with Events.** Local events are big in the South, especially
    football and baseball. By partnering with local events, we can promote their events.
    In turn, they can give us a place to park, drop off and pick up customers. This
    thoughtful, integrated experience will encourage users to try and use Uber.

    - **Uber Truck.** Southerners love driving trucks. We can provide a trucking service
    for buying or moving furniture.


    My purpose to accultur Uber with the city in order to provide a better experience
    for the customers, which turn will promote more drivers to come.'
  - '[PAGE 166]


    # Facebook Auto Detect


    Things to Consider


    +   - First, consider what constitutes abuse of community standards.

    - Second, think about how users would detect those abuses.

    - Third, identify which one of those abuses can be detected by a computer.


    Common Mistakes


    +   - Spewing answers, making it hard to follow

    - Not having a systematic approach, leading the candidate to miss several potential
    ways of detecting abuse


    # Answer


    CANDIDATE: I am sure Facebook does an algorithm that does this. It''s most likely
    based on machine learning methods. I am sure Facebook can detect the following
    automatically:


    +   - Users who post the contents over and again, effectively spamming everyone.

    - Users who are pretending to be someone he she is not. For example, impersonating
    Facebook personnel or a famous actor.

    - Users who are posting links or content that are not allowed by the Facebook
    agreement, such as phishing, porn or other malcontent.


    Just looking at these three, I would say the last category is the most common.


    Obviously, this is an algorithm checking the so, for more serious cases, especially
    involving banning of an account, it probably requires a human making the final
    decision. However, the algorithm can prioritize some users based on several factors:


    +   - How long has the account been active? Does it post a lot of "normal" content?
    How is the profile picture?

    - How often is the account posting on a day, per week or even month basis?

    - How long are the average posts? How many are they getting?


    This will prioritize offending users for the Facebook user operation team to look
    at. Some first round passes will be given along with the user. For example, if
    a user has been a "good" user for a long time, then suddenly started to post bad
    content, the likely user account has been hacked. In this case, the team should
    check for this scenario. If a user is new and starts posting lots of bad content
    frequently, it’s most likely a new account created just for this purpose and should
    be banned.'
  - '[PAGE 167]


    # Improving the Help Center


    Can you make suggestions how to improve the Help Center for Facebook?


    Things to Consider


    +   - Approach this as a product design.

    - Use the CIRCLES Method.

    - Think hard about pain points and frustrations with key metrics that the help
    team would like to optimize such as satisfaction and decreases in support tickets.


    Common Mistakes


    +   - Suggesting magical solutions, like the omnipotent support chat bot or the
    mindreading recommendation algorithm, without explaining the details


    # Answer


    CANDIDATE: Are we talking about the desktop version or the mobile version?


    INTERVIEWER: Let say the desktop version.


    CANDIDATE: The Help Center is when users come to Facebook for help. The whole
    point is to allow the user to be able to find help in the fastest way and not
    feel helpless. Just thinking about the Help Center, I can see three points of
    improvements:


    +   - No Live Chat or Email. While we do want users to use the FAQ and self-help
    sections first, we want to provide live chat as a last ditch effort. Both of these
    connect the user with an actual person, which could cause a lot of the frustrations
    of feeling helpless.

    - Too Many Sections. The first page shows 10+ sections on the left and a bunch
    of more on the bottom. This is a lot for a user to take in. When someone comes
    for help, they are already feeling helpless. When we make this harder by listing
    these sections, we are telling them this is complicated and you''ll have to find
    it.

    - Language Selection. The language selection right now doesn''t feel like a selection.
    It would be better to add a down arrow or some other sort of symbol to make it
    like selectable. Facebook serves a lot of users in different countries and thus
    languages. I am sure it shows your language browser as default, but this should
    still be visible.


    INTERVIEWER: Wouldn''t adding live chat or cause most users to use those instead
    of reading of the FAQ and finding help on their own? That would add a lot of pressure
    to us in terms of customer service.


    CANDIDATE: I would use testing on this, and I have a feeling Facebook might already
    have. But to me, I feel like people who are already here on the Help Center are
    already trying to self-help. They are more willing to search for an answer on
    their own first they give up and try another route. So I don''t think the impact
    will be exactly 1:1. I am sure it''ll add some pressure, but I''ll need to see
    data to make sure that is true or not.'
