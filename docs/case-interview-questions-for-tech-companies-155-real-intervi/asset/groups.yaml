    # # Google Maps in Mongolia


    How would you release Google Maps in Mongolia?


    Things to Consider


    +   - Do you have PR and regulatory staff to deal with issues?

    - Do you have operations and customer support staff to handle in coming additions,
    editions and deletions to map information?

    - Would Google Maps have to be adapted to Mongolian customs or unique Mongolian
    technology infrastructure?


    Common Mistakes


    +   - Assuming Mongolia is identical to the country that the candidate is most
    familiar with.


    # # Answer


    CANDIDATE: I would first wonder if it is worthwhile to set up Google Maps here.
    I would imagine it is not exactly a hot tourist attraction and not a lot of people
    live there either. I believe there are a lot of underdeveloped areas in Mongolia;
    most of the people live around Ulan Bator, the capital city.


    I would first consider if we have enough good Internet access. It is easy to get
    lost. Is there high smartphone and computer penetration? While a lot of underdeveloped
    areas it''s easy to get lost and Google Maps would be handy, it might also mean
    a lot of bad signals. I also don''t find appealing to “street view” the plains
    of Mongolia.


    It is unlikely there is a local company we can partner with, but it cannot hurt
    to check. Mongolia is an untapped market, I, but I am not sure its potential is
    that. Given the uncertain potential, perhaps we can assign this project to Google’s
    Chinese or Russian offices to minimize additional investment.


    Both offices have advantages. Google Russia is fluent in Russian, a language many
    Mongolians speak. However, Google China is geographically closer to China.'
