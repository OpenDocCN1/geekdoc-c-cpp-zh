    # Converting Uber Driver


    In 4 sentences or less, try to sell someone on becoming an Uber driver.


    Things to Consider


    +   - This question is testing for two things: your ability to influence others
    and your communication ability.

    - Consider the other person''s needs or pain point.

    - Be clear on how being an Uber driver addresses that pain point.


    Common Mistakes


    +   - Creating a message that''s focused on comparing Uber with the competition,
    such as being a taxi driver (e.g. "Make more when compared to being a taxi driver")

    - Limiting the marketing message to a rational dollar and cents approach only
    (e.g. "Make X% more with Uber").


    # Answer


    # Average answer


    Why don''t you become an Uber driver? You can work whenever you like, get paid
    for driving, and drive around in your neighborhood. You earn more than the average
    drivers across all spectrums (e.g. taxi, bus) and you don''t even need anything
    other than a driver''s license you already have and a car you already own.


    # Better answer


    Your loved deserve the best: an unforgettable party, a memorable trip or a gift
    of a lifetime. As an Uber driver, you can earn the extra cash to do so. Driving
    for Uber fits into your lifestyle: you choose the hours, and you choose the routes.
    Getting started is easy: use your own car and bring your driver''s license.'
  - '[PAGE 214]


    # Complaining About Advertising


    What would you say to someone who complains about advertising on Amazon.com?


    Things to Consider


    +   - Who is complaining?

    - What is the complaint about?

    - Does the complaint have merit?


    Common Mistakes


    +   - Overreacting, such as promising to take ads down, without first understanding
    the situation.


    # Answer


    CANDIDATE: It depends. Who is this person? A customer on Amazon? A client selling
    something on Amazon? An advertiser? Or maybe an internal employee of Amazon. It
    might even be an investor.


    INTERVIEWER: Let say it is a customer.


    CANDIDATE: I would ask them if they dislike ads because they just don''t like
    ads in general or do they never find ads that are relevant? If it were the former,
    I would tell them I''d bring their concerns to the relevant department. If it''s
    the latter, I''ll point out that I need to work with the relevant department to
    make sure our ad targeting is more accurate. Either way, I''ll thank him for his
    feedback and continual support for Amazon. If he''s a really high profile user
    and he seems really passionate, I would give him a $20 Amazon coupon or something
    to make him a little less upset.


    INTERVIEWER: Would you actually ask the relevant department to remove ads from
    Amazon?


    CANDIDATE: Well, no, I wouldn''t, unless an overwhelming number of customers are
    saying that. But the PM who is in charge of that would keep track of the data
    anyway. Now, did you want me to analyze whether having ads is a good or bad thing?


    INTERVIEWER: Thanks for offering, but we will conclude this question since it
    is all the time we have.'
  - '[PAGE 215]


    # Describing Dropbox


    How would you describe Dropbox to someone technically savvy? What about your grandparents?


    Things to Consider


    +   - The first part of the question is testing your ability to communicate with
    engineers. The second part of the question is testing your ability to communicate
    technical concepts with non-technical audiences.


    Common Mistakes


    +   - Not distinguishing the technical version from the non-technical version.

    - Not that is unnecessarily long-winded.


    # Answer


    CANDIDATE: For the technically savvy, I would describe Dropbox as a cloud storage
    that allows users to synchronize their files in real time. To setup the software,
    users download client software first. Then, Dropbox will create a special Dropbox
    folder on their computer. Any files in the Dropbox folder will automatically be
    synchronized with Dropbox''s servers in the cloud.


    Users install Dropbox on multiple computers or devices. Signing from separate
    devices allows them to synchronize the files to the latest version, even though
    users are accessing via different devices.


    Users should note that there is a storage limit, based on the user''s account
    plan. In addition, each Dropbox folder occupies space on both their local computer
    and mobile device as well as Dropbox''s cloud servers.


    INTERVIEWER: And how would you describe a less technically knowledgeable crowd?


    CANDIDATE: For the less technical, I would use the following analogy. Imagine
    if there''s a storage service on wheels. That, this service can store your valuables:
    jewelry, keepsakes or important legal documents. Anytime you wanted to see those
    valuables, a delivery person will bring your valuables to, anywhere in the world,
    as long as you show valid identification upon delivery. When you are finished
    accessing your valuables, the delivery person will hold your valuables and store
    them for you.


    In this case, Dropbox is a mobile storage service for electronic files: digital
    photos, music and files. By having Dropbox store those files, the files can be
    accessed on any machine, anywhere in the world. And these files are always up-to-date
    with the latest changes, since any change to the file from one computer will be
    saved.'
  - '[PAGE 216]


    # Summarizing Online Sales Operations


    How would you summarize the performance of online sales operations to a manager
    with little or no technical background?


    Things to Consider


    +   - This question is testing your ability to communicate technical concepts
    to non-technical individuals.


    Common Mistakes


    +   - Talking generically on how one would approach rather than using an example


    # Answer


    CANDIDATE: Is this a manager who has all the relevant marketing and sales knowledge?
    He or she just doesn’t know the technical side very well.


    INTERVIEWER: Yes.


    CANDIDATE: Then I would describe everything normally until we get to the technical
    part. I would use examples and analogies. Unless the specific topic or description
    doesn’t matter for him to understand, then I wouldn’t skip it because he has no
    technical background.


    INTERVIEWER: That’s really vague. Can you give me an example?


    CANDIDATE: Let say I am describing the cost of ads vs. revenue. I would relate
    to how when he uses Internet at home or on his phone, he needs to pay for bandwidth.
    We have to do the same when we display these ads. The cost comes from that.'
