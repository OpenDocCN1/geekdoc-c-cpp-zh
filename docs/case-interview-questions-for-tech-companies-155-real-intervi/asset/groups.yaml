    # Chapter 25 Product Management: General


    # Challenges for a PM


    What are some of the challenges for a PM?


    Things to Consider


    Most common challenges for PMs include:


    +   * Articulating product vision

    * Convicting team on a certain course of action

    * Figuring out ways to help the team do more in less time


    Common Mistakes


    +   * Complaining about unnecessary tasks, such as taking notes and scheduling
    meetings.

    * Complaining about being responsible when the product is bad, marketing is poor,
    resources are limited or the engineering team is incompetent.

    * Complaining about unclear executive priorities or not having enough time in
    the day.


    # Answer


    CANDIDATE: The PM has few challenges to address:


    +   * **Convincing your team:** As a PM, you have no official authority, so if
    you want the team to work on your ideas you need to convince them through proven
    success. This can feel frustrating why you feel like you know what''s best. But
    know that if you have authority over other people, using it is a sign of weakness.
    Let your knowledge, charm and proven record of accomplishment do the talking.

    * **Understanding why:** When someone tells you you can''t do the way you wanted
    it to or that they don''t understand your ideas, you need to have empathy. You
    need to see from their point of view. From there, see if you can address their
    needs. Do so and might them. Often, it''s a misunderstanding. This is why you
    need to dig at the why. If you don''t know the reason why, how can you fix it?
    Does both working with a team and designing a product.

    * **Don''t marry your ideas:** As a PM, you have a lot of ideas in your head,
