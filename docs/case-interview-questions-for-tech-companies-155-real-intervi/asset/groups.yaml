  - '[PAGE 236]


    CANDIDATE: We certainly can’t it the day of the event. Riders need to plan their
    schedules, and they might want to invite their friends. So we might target to
    run the ads one to two weeks in advance.


    INTERVIEWER: Is there a social media component to it?


    CANDIDATE: Absolutely. Users can see the event ad, and share it with friends.
    That way buzz will build around the promotion, and the riders may convince them
    to go with them.


    We can also integrate Uber promotion with the event planner’s event registration
    system. That is, for all the folks who register, we can suggest that they Uber
    to the event and save five dollars.


    INTERVIEWER: Thanks for the perspective.'
