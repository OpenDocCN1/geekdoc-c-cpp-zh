  - '[PAGE 86]


    +   * Too big.

    * Unfit design


    The bookshelf can''t be too tall, because otherwise the kids will have a hard
    time reaching for books. It can''t be too short, because adults need to use it.
    The bookshelf can''t be too heavy either, because it would be a safety issue if
    it falls on the kids, and it won''t need to be heavy because children''s books
    are lightweight. Regular bookshelves are also too big, and since kids don''t have
    many books we don''t need that way. Even if kids have lots of books, children''s
    books are thin. As for the design, kids like bright colored stuff and they probably
    put stickers everywhere where wood and metal are not good materials.


    I would also like to think of some cases in case I missed anything by just thinking
    about the regular bookshelf.


    The kids would do several things with it:


    +   * Pull out a book. This will be a problem because children''s books are really
    thin. If you pull out a book like the rest of the row will collapse.

    * Put in a book. Children''s books are really thin, so it''s hard to tell what
    book it is from the side.

    * Move the shelf. Shelf can''t be too heavy.


    I think now I am ready to design features for this bookshelf.


    INTERVIEWER: Okay, go ahead.


    CANDIDATE: I have several features in mind.


    Candidate writes the following on whiteboard.


    +   * Height is 4 feet.

    * Width is about 2 to 3 feet.

    * Made with plastic. Really lightweight.

    * Comes in various bright colors.

    * Comes with holders to help with books.

    * Easy to add or remove sticky notes or stickers.


    The height is perfect for kids and still usable by adults. The width is not big
    but enough to hold children''s books. It is made in plastic so it won''t deform,
    but it''s lightweight. Good for kids moving around it and it is safe. It comes
    in bright colors so kids will love it. Also, I mentioned the problem with pulling
    out and putting in books before, and the holders would help with that. The plastic
    is also made to be easy to add or remove sticky notes or stickers. This will also
