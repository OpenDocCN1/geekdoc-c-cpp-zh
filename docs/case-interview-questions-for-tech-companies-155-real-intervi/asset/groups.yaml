    # What do you like about being a PM?


    What do you like about being a PM?


    Things to Consider


    Most PMs like the role for the following reasons:


    +   - Product design. Product managers are obsessed with creating amazing products.

    - Leadership. Product managers like the responsibility of leading teams to achieve
    difficult goals.

    - Managing a business. Product managers like the end-to-end nature of building
    products whether it is understanding customer needs or working with engineers,
    marketing professional and other members of a large cross-functional team.


    Common Mistakes


    Emphasizing aspects that are less crucial parts of the role including:


    +   - Training the sales team.

    - Defining product pricing.

    - Developing the go-to-market plan.


    # Answer


    CANDIDATE: My favorite part of being a PM really breaks down to three points:


    +   - Product Design. Designing a product from ground up that meets your users''
    wants is fulfilling. There are a few jobs that allow for true creativity, and
    while you are not the designer, as a PM you do have a hand in the design. Part
    of the enjoyment comes from creating a design around customer needs and convincing
    your team to work on it with you. It''s also a great feeling when everyone is
    pumped about a new idea or improvement.

    - Product Improvement. Most product development is iterative. Improvements occur
    after hearing feedback and seeing customer data. Good products are never made;
    they are the results of hundreds improvements. As a PM, it''s your job to identify
    what is lacking and how to fix it. Seeing progress gives me a sense of satisfaction.

    - Impact. There is big appeal in making a product that affects millions. Moreover,
    unless I''m making a bad product, it''s good to know what the team and I do make
    millions of people happy.


    > Author''s Note: While this question was also covered in PM Interview Questions,
    I wanted to include this alternative answer.'
