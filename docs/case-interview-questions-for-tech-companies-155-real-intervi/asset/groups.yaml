    ## Chapter 21 Marketing: Communications


    ### Crisis with Press and Government


    How would you manage a crisis situation with the press and government?


    Things to Consider


    For PR disasters, refer to the following framework featured in Rise Above the
    Noise: How to Stand Out at the Marketing Interview:


    - Apologize for the mistake.

    - Contact everyone who is affected by the issue.

    - Investigate what is happening.

    - Implement long-term remedies.

    - Communicate through the process.


    Common Mistakes


    Responding in a corporate-sounding way, including:


    - Using jargon

    - Refusing to take responsibility

    - Showing lack of empathy

    - Not suggesting concrete next steps


    # Answer


    CANDIDATE: It depends. We are assuming, let''s say, a certain Uber service is
    deemed illegal?


    INTERVIEWER: Okay, let''s go with that scenario.


    CANDIDATE: Okay, then I would first get in touch with the legal team and see if
    this is actually true. I would also see if we can work out some sort of deal with
    the government to change this law (and also talk with the legal team). These would
    be all behind closed doors. What I would not respond to corruption or submit to
    mischaracterizations. That''s not something Uber does.


    Next, I''ll work with the press, giving my side of the story. I want to draw attention
    to this. This is especially important in another country. I want the world''s
    attention to be on this. If there is unfair and unjust, we need to make sure we
    tell the people. Obviously, if the government thinks something we do is illegal
    and the law is indeed like this, Uber will comply. However, we''ll work with the
    government in overturning these laws. We have a legal team who can do this and
    can ask for the support of our drivers and riders to ask their government to do
    the same.


    During all of this, I want to emphasize that Uber offers the best quality and
    we want to make it convenient for both drivers and riders. We create jobs and
    many drivers depend on us.


