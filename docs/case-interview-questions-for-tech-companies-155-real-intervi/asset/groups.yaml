    # A Time You Failed


    What is an example of a time you failed?


    Things to Consider


    +   - Use names for people, product and places to make your story easier to remember.

    - Pay attention to the question. It is asking for an example, not a general approach
    to failure.

    - Explain why the failure occurred.

    - Indicate what you have learned from that situation and if time permits, how
    you approached a subsequent similar situation.


    Common Mistakes


    +   - Blaming others for the failure including unreasonable expectations or not
    pulling their weight.

    - Not wanting to reveal failings, skipping the request for an example and instead,
    giving a general approach to failure.


    # Answer


    CANDIDATE: As a PM, I can think of a time where I failed to address problems that
    led to an implosion on my product team.


    During my previous job, we needed an artist for some urgent, last-minute work.
    So I got in contact with Paul Paul is a good friend and even a better artist.
    He didn''t want to work full-time, due to the long commute. So we hired him on
    a contract basis instead.


    I introduced Paul to the team, and he quickly became good friends with everyone.
    He put the team and me at ease. Unfortunately, a rift start to grow between Paul
    and the art team.


    Here''s what happened: Paul innocently shared his salary to the other artists
    because he didn''t think it was a big deal. Because Paul was a contractor, he
    was paid more than the full-time artists. That Upset Lisa, one of the fighters,
    felt unappreciated. She worked so hard and didn''t get the same pay as the person.


    The crisis between Lisa and Paul escalated, and Lisa eventually left. Paul felt
    guilty. He believed her departure was his fault. We now had to find one more artist,
    which was frustrating recruiting is not.


    I felt I could have addressed proactively with Paul. That is, he was being compensated
    more than others were, and he should have used discretion in sharing his salary
    information. Because I didn''t monitor the situation, it put our team in an awkward
    position.


    My lesson learned is to proactively address sensitive issues, closely monitor
    the situation and smoothly issues before they escalate. Three months later, I
    brought on a QA contractor, Venkat, to the team. This time, rather than things
    on autopilot, I proactively addressed the salary question, asking Venkat to be
    judicious on how I''m proud to announce that he''s been on the team for six months.
    Team morale is high. Venkat integrated into the team beautifully.


