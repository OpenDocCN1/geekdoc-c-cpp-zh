    30 miles per hour on a local <street name> when a drunk driver ran a red light
    and hit the car from the side, killing <victim name> instantly and injuring <driver
    name>. We always make our cars are equipped with air bags, but air bags could
    not protect <victim name> from this collision.


    We stress, again, the importance of not driving drunk and our hearts go out to
    both <victim name>''s family and <driver name>''s family. We''ve reached out to
