  - '[PAGE 153]


    # Google Moonshot Projects


    Why do you think Google is investing so much in its moonshot projects?


    Things to Consider


    +   - What is the impact of moonshot projects on the company?

    - What is the impact on employees?

    - What is the impact on competition?


    Common Mistakes

    - Not mentioning the need to attract and engage employees who desire challenging
    projects.

    - Not stating the need to empower employees with a greater sense of freedom.


    # Answer


    CANDIDATE: I think there are several reasons for this.


    One, moonshots drive innovation. Remember 20%? That was something most companies
    wouldn''t have done, Google did it. Amazing projects came out of 20% including
    Gmail and Google News. Look at Gmail, for example. it is the most used email client
    in the world right now. Gmail alone probably made enough revenue to cover every
    20% time ever spent. We can see why Google would encourage this.


    Two, moonshots diversify the business. When you are as big as Google, market share
    is important, but diversity is important for a few reasons. First, growth rates
    for existing businesses can flatten out. To sustain growth, Google needs diversity
    into new high growth businesses. Second, it minimizes risk. By not putting all
    its eggs in one basket, Google can be prepared for the worst. Lastly, Wall Street
    doesn''t like surprises; a diversified portfolio can moderate volatility in Google''s
    business.


    Three, moonshots retain employees. A common misconception is that only startups
    can have bold, innovative ideas. As a result, employees seeking to pursue a bold
    new venture often leave their employer to start their own company. Instead of
    enabling that, Google can enable its employees to create startups within the company.
    By supplementing their employees with money, Google can fight the misconception,
    retain talent and most importantly, discover future growth engines.


    To conclude, Google invests so much in moonshot projects because they fit its
    innovative culture and sense economically. They also help diversify Google''s
    business. Moonshots also help to retain customers.'
  - '[PAGE 154]


    # Chapter 19 Operations


    # Uber in a New City


    How would you start Uber operations in a city with no precedent?


    Things to Consider


    +   * The interviewer is asking you to develop a plan.

    * The phrase "with no precedent" strongly implies that you need to bring your
    own assumptions and knowledge to the table. In other words, you should not be
    wasting time asking for background information. It could be that the interviewer
    doesn''t have it or perhaps doesn''t want to reveal it to you. Revealing background
    information may divulge confidential information or make the interview question
    too easy.


    +   * Asking the interviewer an excessive number of questions, especially when
    the interviewer’s responses and body language strongly indicate that he or she
    is not going to provide additional context.


    Common Mistakes


    # Answer


    CANDIDATE: Does the city see heavy car usage?


    INTERVIEWER: How would you handle either case?


    CANDIDATE: Hmm, okay. I''ll discuss that in a bit. What about taxi? Does the city
    have a lot of taxis?


    INTERVIEWER: Why don''t you write down solutions for all of these scenarios?


    CANDIDATE: All right. I would think along these:


    +   * Heavy Car Usage. If the city has a lot of car usage, it makes it easier
    to get Uber started. Otherwise, where are we going to get drivers? If there are
    not a lot of cars, then we might need to work with a local car dealership to see
    if we can work with them so they attractively priced vehicles forwould-Uber drivers.

    * Traffic. Is there a lot of traffic? If so, I would suggest promoting things
    like UberPool and reducing traffic. The experience might be bad in a heavily trafficked
    city, so we want to use our estimated wait time.

    * Taxi. If there is a lot of taxis, I would check their rates and make sure we
    are competitive. Our core business is always to offer a better user experience
    than taxi rides, competitive pricing definitely helps.

    * Laws & Regulations. We want to be aware of the laws and regulations and see
    how we can effectively work with them.

    * Competitors. Do we have any competitors? Aside from Uber-like competitors, we
    need to consider alternatives like taxi, bus and car-sharing services like car2go.'
  - '[PAGE 155]


    +   - Events & Local Businesses. Work with local events and businesses to promote
    Uber. They will enjoy not having to provide as much parking, and we''ll putting
    ourselves out there as a viable transportation option for people to enjoy.


    +   - PR. Definitively do PR and make people know Uber is now here.


    +   - Digital Marketing. We need to make sure our app is downloaded.


    +   - Payment. Depending on where we are, people might use different payment platforms
    (e.g. mobile payments) or types of payment altogether (e.g. prepaid cards, carrier
    billing). We need to make sure we are adjusting to the local flavor.


    To summarize, first I would make sure the barrier of entry for drivers isn''t
    too high. If it is, we''ll never get enough drivers. Then I''ll price based on
    the competition. We then want to make sure we introduce services the market will
    find easy-to-use such as the most convenient ways for people to pay. Finally,
    I want to promote our service through multiple channels including word-of-mouth,
    social media ads and video ads.


    INTERVIEWER: It''s good that you mentioned legal requirements. What if the city
    says Uber drivers need special driver certification?


    CANDIDATE: Special driver certification is detrimental to Uber because:


    +   1. Makes it harder for citizens to become Uber drivers

    2. Reduces driver supply

    3. Reduces customer satisfaction as it becomes more difficult for riders to get
    paired up with drivers


    As a result, I would enlist lobbyists and conduct an aggressive grassroots outreach
    campaign. I''ll ask, would-be drivers and customers to support us and petition
    public officials.'
  - '[PAGE 156]


    # Uber’s New Service


    What new service or promo would you add that provides maximum return with minimal
    investment?


    Things to Consider


    +   - This is a test of your ability to come up with a clever idea.

    - To increase your chance of getting something clever, brainstorm at least 10
    ideas.

    - To make the interviewer more receptive to your idea, demonstrate the value by
    explaining the necessary context: what it is, how it works and why it’s unique
    and valuable, to Uber.


    Common Mistakes


    +   - Uninspired, ordinary ideas.

    - Suggesting ideas done by Uber already.


    # Answer


    CANDIDATE: Hmm, do I have any restrictions?


    INTERVIEWER: Nope.


    CANDIDATE: Can you give me some time to brainstorm?


    Candidate takes one minute.


    CANDIDATE: Okay, I have a few ideas:


    +   - Uber Funds. You can buy Uber credits at a discount. We will have a different
    deal every month, and it will be capped. This would allow us to get money from
