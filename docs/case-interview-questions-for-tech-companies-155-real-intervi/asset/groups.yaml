    - 变现。这是一个赚外的简单方法。\n\n然后我会与他们具体谈论他们对 Coursera 的这种业务关系寻求什么，并看看我们是否能提供他们想要的。如果他们有任何疑虑或怀疑，我也想在场解答这些。\n\
    \n# Apple 零售店中的企业客户\n\n为什么企业客户在 Apple 零售店购买是重要的？\n\n需要考虑的因素\n\n- 提出至少三个理由，最好更多。\n\
    - 考虑到苹果的文化遗产；史夫·乔布斯对控制端到端的客户体验非常痴迷。\n\n常见错误\n\n- 脱口说出一个答案。\n- 拒绝面试官对该问题的意见。\n\n\
    # 回答\n\n应聘人：有几个原因：\n\n- Apple 希望对潜在客户的购物体验有更多控制。例如，Best Buy 的代表可能没有 Apple 的销售代表那样专业或乐于帮助。此外，Best\
    \ Buy 可能不会按照他们的方式展示苹果的产品。\n- 他们可以在那里看到我们的其他产品，并可能倾向于购买。\n- 他们可以看到 Apple 拥有在任何地方开设商店的分销和组织能力。这对品牌建设很有处。\n\
    - 他们可以看到 Apple 服务于大量的其他客户，包括企业客户和消费者。这就是社交证明。\n- 他们知道如果将来遇到问题，可以去哪里寻求帮助。\n\n#\
