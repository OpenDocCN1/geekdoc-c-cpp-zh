    # Bookshelf for Kids


    Design a bookshelf for kids.


    Things to Consider


    +   - Use the CIRCLES design method.

    - No need to mention or explore non-kid customer segments.

    - When brainstorming is necessary, don''t hesitate to pause. Quality thinking
    cannot occur by reacting.


    Common Mistakes


    +   - Superficially articulating the target customer.

    - Not exploring customer needs deeply enough.

    - Not coming up with a big, moonshot idea.


    # Answer


    CANDIDATE: Can I ask for some clarifying questions?


    INTERVIEWER: Sure.


    CANDIDATE: Are we talking about kids in the United States or another country?
    Or are we talking about kids in general?


    INTERVIEWER: Let''s assume kids in the United States.


    CANDIDATE: What age range are we talking about?


    INTERVIEWER: Age 6 to 12.


