  - '[PAGE 130]


    # Startup Dictator


    If you were appointed dictator of your previous startup, what would you change?


    Things to Consider


    +   - Use the McKinsey situation, complication and resolution framework.


    Common Mistakes


    +   - Use this question as an opportunity to vent, blame/or point fingers. As
    a result, the negative tone makes the candidate sound bitter.

    - Getting caught up with complaining that the candidate forgets to answer the
    question “what would you change?”


    # Answer


    # Situation


    I''m not proud of the situation, but our startup had to shut down three months
    ago. It stings a lot given how I cared for the company and how much I put into
    it. Even worse, one of our top competitors was ultimately acquired for $250 million.
    It makes it hurt so much more.


    # Complications


    There are three reasons why our startup failed.


    +   - Terrible product with a long setup time. On the one hand, our solution required
    15 to 20 minutes of setup time. On the other hand, our competitor''s setup required
    just two minutes. Our competitor had a whopping 30 million customers whereas we
    had just 2 million. And to make matters worse, their product was free.

    - Poor branding. The name of our website was called SalesTreats.com. I didn''t
    like the name, but we told ourselves the name didn''t matter as long as we had
    a good product. Well, our company''s name sounded ridiculous, and it was hard
    for anyone to take us seriously.

    - Didn''t know how to filter the noise. It started to do things because our investors
    wanted to us. As a result, we strayed from our original vision, which customers
    loved. I wish we were more willing to say no to our investors.


    # Resolution


    In retrospect, there are three things I wish we had done:


    +   - Make a bigger push to acquire the domain Sales.com. We explored it initially,
    but we were scared away by the $3 million offer price. We preempted our search
    by saying it was more important to focus and prioritize product over a memorable
    name.'
  - '[PAGE 131]


    +   2. **Focus on customers.** I would spend more time researching customer needs
    and prototyping. I felt our startup was solving a big problem, but we were too
    busy building to truly understand what our customers wanted.


    +   3. **Reduce reliance on investors.** We spent a lot of money just so we could
    keep up with other Bay Area startups. We splurged on an expensive SF office location,
    employee perks and high salaries. I wish we would have forgone some of those choices
    to keep our burn rate down, reducing our dependence on investors so that we could
    maintain stronger customer focus.


    +   4. **Improve product onboarding.** Our product was too onerous. In retrospect,
    I would have gladly paid the $500k per year to have a third-party vendor integrate
    with our customer’s sales systems. It would have provided a much better onboarding
    system that would have minimized the amount of typing or our users had to do.'
  - '[PAGE 132]


    # Superpower


    What is your superpower?


    Things to Consider


    +   - This is a casual way of asking, "Why makes you stand out from other candidates?"

    - Think about your personal brand. That is, if the interview is over, how do you
    want to be remembered by the interviewers?

    - Based on that, choose a superpower that''s related and reinforces your personal
    brand.

    - Creativity counts. Clear and witty responses will be particularly noteworthy.


    Common Mistakes


    +   - Choosing a superpower that''s bland and boring.


    # Answer


    CANDIDATE: My superpower is able to multi-task really well. This is true both
    in my professional and personal life. I am always juggling multiple things at
    once.


    For my work, since I am in a startup, I am juggling multiple roles at once, and
    handling a lot of different tasks every day. For example, on a daily basis, I
    have to get in a strategy meeting with other co-founders, I have to work with
    marketing on our next CPI campaigns, I have to look at data for the ongoing projects
    (and I am handling 3 right now). I have to work with the development team on the
    next update. I then still have to talk to the customer service team, art team,
    other product managers, and business development. Realistically, I''d like to
    section my day off for each task, but that never happens as something demands
    my immediately attention so I end up juggling multiple tasks at once.


    For my personal life, I do this quite bit too. I guess it got carried over from
    my work and live my life like a PM. I end up doing a lot of things at once, like
    talking to my parents while driving to groceries or making plans with my friends
    while grocery shopping. Even when I am relaxing, I am playing games with Netflix
    playing on my right monitor and my chat going on my left monitor while being on
    TeamSpeak. This also ends up quite helping me while playing games too, since I
    can manage multiple things at once.'
  - '[PAGE 133]


    # Starting a Company


    If you could start a company with $1,000,000 right now what would it be? Why?


    Things to Consider


    The interviewer is testing your business judgment and your ability to articulate
    a business case.


    Common Mistakes


    Giving a personal entrepreneurial goal such as opening a restaurant or starting
    a band.


    # Answer


    CANDIDATE: If I started a company today, I''d start Uber for trucking. That is,
    transport heavy materials for businesses where drivers would be available on-demand.
    There''s a couple reasons why this is a compelling market:


    +   * **Big market.** In 2014, the trucking industry netted over $700 billion.


    +   * **Fragmented.** There are 1.2 million trucking companies in the US, and
    most of them have fewer than six trucks.


    +   * **Well-suited for on-demand coordination.** A fair amount of trucking comes
    from short-notice shipments.


    It''s also attractive to me personally. First, I spent my summers in Evansville,
    Indiana working at my father and uncle''s moving company. Naturally, creating
    a business that reminds me of my childhood brings back fond memories. Second,
    my father and uncle have mentioned their interest in having me take over the family
    business. I''m excited about the opportunity because it merges my passion for
    technology and a family business that I know well.'
  - '[PAGE 134]


    # Dealing with Defeat


    How do you deal with defeat?


    Things to Consider


    +   - Use the Rule of Three.

    - Offer an example to demonstrate that you behave in accordance with what you
    normally do.

    - Include emotions to make the story more humanistic, increasing your chances
    of connecting and establishing rapport.


    Common Mistakes


    +   - Not offering an example, which makes the answer sound textbook and conventional.

    - Giving an answer that’s too short, leaving the interviewer wanting more.


    # Answer


    CANDIDATE: When dealing with defeat, I usually go through three phases:


    +   - Accept failure. It could let me it for days, or I can resume my life. It’s
    not easy to be positive, but I try to be resilient and bounce back quickly.

    - Learn. Failure is an opportunity to learn. Did I make a careless mistake? Could
    I have avoided it? Could I have done differently? There’s nothing worse than repeating
    the same mistake, so I log all the insights and takeaways I can.

    - Move forward. I think about what my next goal should be and create a new challenge
    for myself.


    Would it help if I shared a story about a time when I dealt with defeat?


    INTERVIEWER: Sure, go for it.


    CANDIDATE: This past July, I joined Google’s cloud team as technical program manager.
    Two weeks into the job, I got a call from Ileana; she said, “Amber, there’s a
    production workload that you created with no billing ID. Do you know what’s going
    on?


    I immediately felt a little flush and embarrassed. I stuttered, “Uh, I’ll look
    into it.” After investigation, I realized that I didn’t attach a billing ID to
    a customer workload that I created. I did the quick math; that’s $30,000 revenue
    that Google missed out on.


    At that point, I had three options:


    +   - Deny that the mistake happened and blame it on the poorly designed software.
    Or perhaps excuse Ileana.

    - Complain to my boss that they should not have a new person take a critical task.

    - Accept the mistake and learn from it.


    In the heat of the moment, options 1 and 2 were not so unreasonable as they sound.
    I have seen my co-workers deny or complain often. And quite frankly, I was tired
    of being the “good one.”'
