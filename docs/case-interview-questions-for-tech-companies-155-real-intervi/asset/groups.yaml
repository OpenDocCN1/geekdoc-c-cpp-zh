    # Uber Ice Cream


    Let''s say we want to launch Uber ice cream for the first time. How many drivers
    do you need?


    Things to Consider


    +   - What is the demand?

    - How many cars are needed to satisfy that demand?


    Common Mistakes


    +   - Not pausing to think before starting

    - Not explaining approach to answering the question before beginning


    # Answer


    CANDIDATE: What kind of ice cream service are you thinking of?


    INTERVIEWER: What do you have in mind?


    CANDIDATE: Well, I can think of at least 3 broad categories:


    +   - Delivering ice cream to consumers, on behalf of ice cream shops like Baskin-Robbins.

    - Buying, selling and deliver Uber''s own ice cream brand.

    - Driving ice cream trucks for businesses.


    INTERVIEWER: Which one do you think is more likely?


    CANDIDATE: Delivering ice cream to consumers, on behalf of ice cream shops. I
    don''t see Uber starting the entire ice cream pipeline.


    INTERVIEWER: Yeah, let''s go with that.


    CANDIDATE: If we are launching this product for the first time, it makes sense
    that we are only working with certain ice cream shops, maybe Baskin-Robbins. Baskin-Robbins
    has a lot of flavors, and you can do some crazy combinations. Since it takes time
    to concoct, we probably need an hour to deliver them.


    INTERVIEWER: Okay.


    CANDIDATE: We are probably going to deliver within a 10-mile radius, and Uber
    charges about $1.20 per mile. We are talking an average of 5 miles, which is a
    $6 driving fee. We should probably charge an special ice cream delivery fee. And
    drivers probably expect a tip. So my best guess is around $8: a $6 driving fee
    plus a $2 ice cream delivery fee ($ is consistent with what pizza shops charge
    for delivery). We should also expect a $5 average from customers.


    In total, that''s $13 on average for Uber delivered ice cream. It''s hard for
    me to imagine significant adoption for this, so I''ll assume around 2 to 4% of
    the existing user base. I''ll be generous and go with the higher 4% number in
    my calculations.'
  - '[PAGE 159]


    To continue my estimate, I''ll assume the following:


    +   - Baskin-Robbins opens from 10 AM to 10 PM. That''s a 12 hour delivery window.

    - I live in San Francisco, so there is about 1 million people here.


    Let''s put this all in a formula:


    # Calculating Drivers Needed:


    ```

    $Drivers Needed = \frac{Population \times Adoption Rate}{Shop Hours \times Delivery
    Time}$

    ```


    ```

    $Drivers Needed = \frac{1 \text{ million} \times 4\%}{12}$

    ```


    ```

    $Drivers Needed = \sim3,300$

    ```


    I would say we need around 3,300 drivers.'
  - '[PAGE 160]


    # 100 Drivers


    100 Uber drivers show up at the office to complain. How do you manage the situation?


    Things to Consider


    +   - Listen to the complaint.

    - Demonstrate empathy.

    - Investigate the situation.

    - Implement long-term remedies.

    - Communicate throughout the process.

    - For more details, refer to the Dealing with PR Disasters chapter in Rise Above
    the Noise.


    Common Mistakes


    +   - Oversimplifying the solution by saying apologizing is the solution.


    # Answer


    CANDIDATE: What kind of complaints are they having?


    INTERVIEWER: What kind of complaints do you think they might have?


    CANDIDATE: I can think of several, let me address them and my solutions:


    +   - Pay is too low. According to research, Uber drivers actually make more per
    hour than every other type of driver, including taxi and bus.

    - Uber cut is too high. Same response as above.

    - No tipping. Same response as above. Also, it''s a cashless, seamless transaction.
    If we add this, it makes it hard for the user. Riders like to choose their tip
    amount. Some tip just $1. This is a lot for a customer to think about, especially
    if they''re trying to get to their destination. By introducing friction into the
    process, that means fewer people are willing to use Uber, which means less money.

    - Arbitrary penalties. We try to be very clear on this. Ask “What exact problem
    are you having?” and address their problem.

    - Too many drivers. Yes, but let say you are a rider and you are picking someone
    up. Would you prefer who is really good or who is not good? That''s why we have
    a rating system. If you provide a better user experience, riders will flock to
    you. I have to be a bit more tactful because I don''t want to make it seem like
    I am saying that a specific driver provides a bad experience.

    - Have to work an inhuman number of hours to make a living. I would show on how
    Uber pays more than equal jobs like working in fast food. And better yet, Uber
    drivers have the flexibility to choose when they want them.

    - Can''t keep track of fares and deductions. Everything is accounted and itemized
    in the app. Everything is done automatically, so that doesn''t require a lot of
    effort from drivers.

    - They don''t want to game pricing, but other drivers do. Our engineers are looking
    into cases like this and will ban drivers who game the system. We want to make
    sure everyone is playing fair.'
  - '[PAGE 161]


    +   Accounts stolen. We are having our engineering team work on a solution for
    this as we speak. I''ll promise them will keep them updated. I''ll also ask them
    to bring their issues with our support team and fight for issues on their behalf.


    INTERVIEWER: That''s a long list. I am interested in your arbitrary penalty problem.
    What if a driver is complaining that he was under the surge pricing zone but then
    a normal request shows up? He didn''t want the request, and it ended giving him
    a 10-minute ban.


    CANDIDATE: I''ll tell him that''s a really rare scenario. I am glad he told me
    I was not aware of this problem. I would tell him I want to escalate this issue
    and tell the engineering team to fix this. I want the engineers to add something
    that allow you to mark the pickup request as inappropriate and ask the system
    to reevaluate. If the evaluation passes, the order will be bounced back, and the
    user will be asked to pay surge pricing. I''ll personally follow up with him after
    my conversation with the development team.


    INTERVIEWER: What if the developers say no?


    CANDIDATE: Then I''ll tell him the developers do not think this feature is high
    priority, and it''ll be some time before they can work on it. I''ll promise to
    keep him updated.'
  - '[PAGE 162]


    # Reacting to Taxi Riots


    How would you react to cab drivers protesting Uber''s existence?


    Things to Consider


    +   - Why are the cab drivers protesting: wages, competition, working conditions
    or something else?

    - What do they want?

    - What solutions will actually change behavior?


    Common Mistakes


    +   - Assuming that the problem is X when it is actually not.

    - Presenting an olive branch device and being surprised that it''s not going to
    work.


    # Answer


    CANDIDATE: Hmmm, this is an interesting topic. Just so we are on the same page,
    taxi riots happen when taxi drivers feel like Uber has taken too much business,
    and they can''t fight back. So they protest to pressure the government, Uber or
    even the drivers to make it unlawful for Uber to operate. Taxi cab drivers feel
    that Uber''s use of unlicensed cars to drive others around, for a fee, is illegal.


    INTERVIEWER: Yes, that is basically the gist of it.


    CANDIDATE: Which country or city are we talking about?


    INTERVIEWER: Let''s say it''s Brazil.


    CANDIDATE: I would propose the following:


    +   - Avoid certain locations. Locations where protests are occurring may turn
    violent. To be on the safe side, let''s avoid these areas and alert both drivers
    and riders.

    - Safety first. Make sure the drivers and riders call the police if they are unsafe.
    Their safety is our #1 priority.

    - Pressure legally. Deploy our lawyers and lobbyists to address the situation.

    - Make noise. Bring the world''s attention to it. Get people talking on social
    media. Generate pressure.

    - Legally by the rules. Some jurisdictions need to resist that kind of temptation.
    Uber has had negative PR in the past due to aggressive business tactics; a bribery
    report would reinforce an unfair perception.

    - Ask for support. Ask drivers and riders for their support. Provide contact information
    so that they can contact local officials and convey their displeasure. We are
    job creators and we are abiding the rules, why they target us?

    - Provide the best service possible. Don''t let the distractions keep us from
    providing the best service possible.'
