    # Design a Windshield Wiper


    Innovate a new windshield wiper design.


    Things to Consider


    +   - Windshield wipers is not something of us think about often. Take a moment
    to understand the purpose and pain points of a windshield wiper before proceeding.

    - Decrease your probability of suggesting mediocre solutions by deeply exploring
    pain points.


    Common Mistakes


    +   - Suggesting a final recommendation that a combination of all your brainstorm
    ideas.

    - Better candidates focus on brainstorm solutions for a single problem. It increases
    the chances of getting an impressive solution. Similarly, there''s not enough
    time to come up with impressive solutions that are more than one problem to tackle.


    # Answer


    CANDIDATE: Is this a windshield wiper on a regular car or truck or something else
    altogether?


    INTERVIEWER: This is a windshield wiper on a regular car.


    CANDIDATE: Is there a cost restriction?


    INTERVIEWER: Yes, it shouldn''t cost over $50. Regular windshield wipers cost
    around $10.


    CANDIDATE: Let me list out some problems with regular windshield wipers:


    +   - Doesn''t wipe the windshield.

    - Hard time cleaning things like bird poop.

    - Doesn''t clean 100%.

    - During heavy rain, it''s not enough.

    - Definitely can''t power through snow.

    - Can''t ice on the windshield.


    I have some ideas to address these problems:


    +   - The windshield wiper needs to be redesigned in a way to not able to wipe
    most, if not all of the windshield. Not able to wipe the thing is not a big deal
    at first until you realize the dirt and things get stuck on your windshield because
    that''s as far as the wiper goes.

    - It needs have two separate modes. One for regular stuff (light dirt, rain) and
    one for stuff (bird poop). The blade needs to be designed a bit differently for
    the heavy mode.

    - It should have two things it can disperse, water and soap. This needs to be
    hooked up to the car.

    - Remember the wiper has two functions: clean and prevent rain. For the rain,
    during heavy rain it really isn''t enough. It needs a smarter design. Maybe it
    can go to the top of the windshield and cover it, causing rain to drip over to
    the side of the car.'
