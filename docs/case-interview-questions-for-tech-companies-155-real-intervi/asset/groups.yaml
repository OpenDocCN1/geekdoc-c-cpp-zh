  - '[PAGE 229]


    # Eat Local


    Eat Local is a small chain of gourmet grocery stores based in Seattle, Washington.
    Last year, its annual revenue was $2.1M with cost of sales of $1.7M.


    Eat Local keeps 11 days of inventory on average, given the perishable nature of
    its products.


    What is the annual inventory turns? And how much inventory does Eat Local have
    on average?


    # Answer


    Inventory Turns = Days in a Year / Average Inventory


    Inventory Turns = 365 / 11 = 33.2


    Average Inventory = Cost of Goods Sold / Inventory Turns = $1.7M / 33.2 = $51K'
