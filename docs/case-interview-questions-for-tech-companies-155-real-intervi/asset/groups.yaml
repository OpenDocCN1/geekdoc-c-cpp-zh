    - Uber Points. Every ride you take, depending on the miles, you get points. With
    enough points, you can redeem for Uber credits. This is good because it’ll encourage
    users to use Uber, and Uber credits can only be used toward Uber away.

    - Uber Events. Whenever there is a huge event, we can get them to allow for a
    designated spot for Uber drivers to pick, drop off, and wait for customers. The
    event can get a cut, we can promote the event on Uber and the customers find it
    easier to use Uber for event.


    Most of these are targeted toward customers because I am not really worried about
    drivers. With enough customers, surcharge pricing will call the driver''s aspect.


    INTERVIEWER: Why do you think Uber Funds will be popular?


    CANDIDATE: A lot of services offer similar things, like Amazon or Apple. It’s
    store credits, essentially, and if some people use Uber a bit anywhere or plan
    to use it in the future, buying credits is worth it for them. It’s'
  - '[PAGE 157]


    also worth it for us, because we get their money earlier. Not only do we get that,
    but the users will have to use

    Uber to spend the credits, and I bet most people won''t clear it down to 0 so
