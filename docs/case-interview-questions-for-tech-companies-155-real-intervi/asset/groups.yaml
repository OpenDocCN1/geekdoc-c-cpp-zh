  - "[PAGE 92]\n\n# Elevators in a Building\n\nDesign an elevator system for the following\
    \ building:\n\n+   * 100 floors in the building\n* 3 total occupants\n  * Occupant\
    \ 1 is a company that occupies the top 10 floors.\n  * Occupant 2 is a company\
    \ that occupies 45 floors below occupant 1.\n  * Occupant 3 is a company that\
    \ occupies 45 floors below occupant 2.\n\nThings to Consider\n\n+   * Interviewer\
    \ is looking for a logical and thoughtful elevator allocation.\n* Clarify assumptions\
    \ upfront such as population, peak hours and average load.\n* Forgetting that\
    \ some elevators should be reserved for maintenance teams or emergency responders.\n\
    \nCommon Mistakes\n\n# Answer\n\nCANDIDATE: I'm guessing you want the overall\
    \ percentage allocation, not the actual number of elevators for the building right?\n\
    \nINTERVIEWER: That's correct.\n\nCANDIDATE: Do you have information about the\
    \ number of people on each floor?\n\nINTERVIEWER: Assume that every floor has\
    \ the same number of occupants.\n\nCANDIDATE: Should I worry that the elevators\
    \ are too small or won't function properly if it's too heavy?\n\nINTERVIEWER:\
    \ Let's say that the size of the elevator and the acceptable weight load is not\
    \ part of this problem.\n\nCANDIDATE: What are the peak hours of usage?\n\nINTERVIEWER:\
    \ Since we're short on time, let's not worry about the peak hours of usage. Can\
    \ you wrap your answer in the next to two minutes?\n\nCANDIDATE: Sure, give me\
    \ a moment to digest the information I know so far, and I'll be prepared to give\
    \ you your recommendation.\n\nCandidate takes one minute.\n\nThe obvious thing\
    \ to do is allocate 10% of the elevators to occupant 1 and then 45% each to occupants\
    \ 2 and 3. However, this assumes that current occupant configuration will stay\
    \ fixed. We cannot assume this. Corporate tenants come and go."
