    \ 有自动驾驶汽车，Uber 正在开发新市场，而 Airbnb 正在使用一种全新的模式。\n- **以消费者为中心**：正如我之前提到的，微软非常关注企业部门。我认为我们在许多市场中失利，恰恰是因为这些市场是以消费者为导向的。我指的是移动、浏览器和游戏主机。这些也是新市场，而且倾向于吸引年轻客户。将微软转向更以消费者为中心的方法从长远来看将对我们有利。\n\
    \n面试官：为了以消费者为中心，你的意思是微软应该离开我们产生大部分收入的企业部门，转而进入消费者领域？如果这种情况发生了变化呢？\n\n候选人：我不是说我们应该离开企业部门。把企业部门看作一个稳定的基础。我们正在尝试扩张并获得另一个基础。科技世界不断变化，新趋势和市场不断涌现。这些都是触手可及的，但只属于最快、最具创新精神的人。许多新事物都是基于消费者的。通过观察微软做得不好的领域，我们发现它们大多是基于消费者的。所以我们应该在这方面下功夫。\n\
