    - 采取单一的产品视角而非公司视角。\n\n## 回答\n\n候选人：你指的是公司文化还是产品？\n\n面试官：任何与公司相关的方面，比如文化、方向等。\n\
    \n候选人：嗯，请给我一点时间让我头脑风暴一下。 \n\n候选人花了一分钟。\n\n候选人：我想我会在微软身上改变三方面。 \n\n- **酷炫、年轻的文化**：微软目前的文化略显传统。微软是一家（在科技领域）老牌公司，给人一种它并不真正与我们在一起的感觉。年轻人是创新的动力，我认为通过适应更年轻、更现代的科技文化（如\
    \ Google 和 Facebook），可以吸引更多人才。\n- **创新**：微软有自己的创新，别误会，但它并不是因此而闻名，也绝对无法与 Apple、Google\
