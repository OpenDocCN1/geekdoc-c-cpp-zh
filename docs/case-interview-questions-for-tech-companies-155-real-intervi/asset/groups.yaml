    \n## 回答\n\n候选人：你说的“提供”是指发布新产品，还是更多在谈论方向？\n\n面试官：你认为 Google 应该朝哪些新方向发展？\n\n候选人：嗯，我首先需要考虑微软的竞争威胁，才能考虑这些。我们有一些时间进行头脑风暴。\n\
