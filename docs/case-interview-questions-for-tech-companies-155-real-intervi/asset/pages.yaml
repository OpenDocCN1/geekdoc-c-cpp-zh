    cannot be used, which halts our entire pipeline since losing a part means the
    product is not going to work. We are basically bottlenecked. I could see several
    problems:


    +   - Technical or mechanical problem with our own parts. In other words, a faulty
    design.

    - Supplier problems, such as labor unrest, geopolitical instability or some other
    factory downtime.

    - The supplier suddenly wants a higher price. Since we should have a contract,
    this is unlikely, but it could happen.

    - Too many parts produced.

    - Too few parts produced.


    INTERVIEWER: Out of all the problems, which one do you think happens most?


    CANDIDATE: Technical problems followed by mechanical problems.


    INTERVIEWER: So how would you address these issues?


    CANDIDATE: To address each of these problems, here are some things I would consider:


    +   - Send out an engineer. If it''s a technical or mechanical problem with our
    own parts we can send out an engineer to help fix it.

    - Alternative supplier. If the problem is with the suppliers, we can look for
    alternatives. We don''t want to be bottlenecked on this part and cause a delay.'
