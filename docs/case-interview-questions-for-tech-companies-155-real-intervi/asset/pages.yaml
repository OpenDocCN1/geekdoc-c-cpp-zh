- pgno: 263
  md: '# Multiple Stakeholders


    Tell me a time when you had to deal with multiple stakeholders.


    Things to Consider


    +   - Was there a sufficiently large team involved?

    - Did you accidentally leave out a key stakeholder?

    - Did you fail to communicate with a key stakeholder, which led to unintended
    consequences?


    Common Mistakes


    +   - Telling a story where the candidate is not at the center of the dilemma.

    - Failing to dramatize the drama, making the situation seem insignificant.


    # Answer


    CANDIDATE: Nine months ago, I was in charge of a new game launch where I had to
    deal with a European development team and a US marketing team. The dev and marketing
    team had different priorities for our collective group. The dev team wanted to
    delay the launch so they could add more game modes. The marketing team wanted
    to launch the new game as soon as possible; the marketing team felt that they
    had nothing to do.


    After I had an opportunity to digest the situation, I met with both teams. I told
    the marketing team the reason the development team wanted to hold back, and I
    told the development team the reason why the marketing team wanted to launch.


    Both teams were stubborn about their positions, so I made the following proposal:
    let''s soft-launch the game now, so the marketing team would have something to
    do. It would also give them an opportunity to test and refine their launch plans.
    The development team could rely on the marketing team for soft-launch feedback,
    making iterative improvement before the bigger launch in three weeks.


    The executives thought it was quirky that we would change launch schedules to
    keep the marketing team occupied. However, they liked the fact that we were getting
    customer input early and often. They had just brought an Agile development consultant
    in for training the previous week.'
  merge: -1
  img_proc: true
