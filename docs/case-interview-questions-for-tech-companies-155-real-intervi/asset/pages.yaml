    extra taxes if you own your house. Some examples may include solar panels and
    things how likely the house is going to be flooded or it is likely to be damaged
    during an earthquake. This probably factors into your insurance too.

    * Comparable Houses. People who houses typically take a couple of months, and
    definitely look at a lot of houses. They need to know what they want, and will
    compare your house with similar houses. By logic, you can’t price it too high
    or too low compared to another house.

    * Finalized Sales Details. Just because your house is priced this way doesn’t
    mean it actually sell it, especially in places like California where the housing
    prices are crazy. It’s not uncommon to attach an extra 10-15% on the price as
    the final sale.


    Basically, these all affect price estimation. As Zillow, our job is to provide
    an accurate data to the user. By including these we do a better job at presenting
    the real possibility to a user, saving them time and providing a better user experience.


    INTERVIEWER: Could you think of examples where these data could skew the actual
    price?

    CANDIDATE: Hmm, that could definitely happen. For example, you might see a house
    that sells for quite a bit during the summer, but a less on a comparable house
    in the same neighborhood during winter. This is because more people tend to buy
    houses during summer. Also, this data need to be updated annually,'
