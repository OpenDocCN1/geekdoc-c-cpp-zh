  md: '# Multiple Starbucks


    Why does Starbucks expand the way they do having multiple stores next to each
    other?


    Things to Consider


    +   - Ask for time to pause and think. It''s likely that the interviewer has reason(s)
    in mind. You will get dinged if you do not guess his or her specific reasons.
    Even if you happen to not guess his or her reasons, the interviewer is more likely
    toกว่า you if you''ve got a long list of five to ten reasons.

    - To spur brainstorming, use a strategy checklist like Porter''s Five Forces.


    Common Mistakes


    +   - Getting flustered.

    - Brainstorming a short list.

    - Missing important reasons.


    # Answer


    CANDIDATE: Can I brainstorm a bit?


    Candidate takes one minute.


    CANDIDATE: I can think of few reasons:


    +   - **No room for expansion.** Maybe the Starbucks is located at a busy and
    desirable location, like downtown SF. It may not be feasible to knock down a wall
    and expand into a nearby room.

    - **Branding.** If you walk into a busy part of town and see multiple Starbucks
    all on the same street, there''s a huge branding effect. It more strongly reinforces
    the perception that coffee = Starbucks, just like online search = Google.

    - **Defensive Play.** If it''s a good section of town, other coffee shops move
    in. If Starbucks grabs up good real estate, their competitors will have a harder
    moving in.

    - **Lower Buyer Power.** If Starbucks is the only coffee supplier in single vicinity,
    that means customers have fewer choices. If customers have fewer choices, Starbucks
    can more easily get customers to accept increases.

    - **Lower Supplier Power.** By the same reasoning, if local suppliers have only
    the option of selling to Starbucks, Starbucks can negotiate better prices with
    their local suppliers, since those suppliers are dependent on Starbucks for a
    majority of their revenue.'
  merge: -1
  img_proc: true
