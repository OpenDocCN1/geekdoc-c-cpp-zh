- pgno: 28
  md: '# Pro and Con Analysis


    A communication principle that a particular point of view is more readily accepted
    if the speaker provides a balanced view, in other words the advantages and disadvantages.


    # Porter''s Five Forces


    A model proposed by Harvard business school professor, Michael Porter, on the
    competitive forces affecting a product or service. Here are the key components
    of Porter''s Five Forces:


    +   - Threat of new entrants

    - Threat of substitutes

    - Bargaining power of buyers

    - Bargaining power of suppliers

    - Industry rivalry


    # Razor-and-Razorblade Strategy


    A popular business strategy where a business sells the platform, such as a razor,
    at cost or less. Then the business sells complementary products, such as razor
    blades, at a substantial profit, offsetting the reduced profit from selling the
    platform.


    # Root Cause Analysis Tree


    A hierarchical diagram that identifies the root causes of a problem and provides
    potential corrective actions to benefit the outcome or prevent recurrence.


    # SCAMPER


    A creative thinking framework used to develop innovative ideas for a topic, product
    or service.


    +   - Substitute: What components of the topic can be substituted?

    - Combine: What ideas, products or services can be added to the original topic?

    - Adjust: How can the topic be altered to be more flexible and adaptive?

    - Modify: What components can be enhanced, reduced or changed?

    - Put to other uses: How can the topic, product or service be used in different
    scenarios or situations?

    - Eliminate: What ideas or components can be removed?

    - Reverse, Rearrange: What new approaches can be formed from the original topic?


    # SMART Goals


    A helpful framework for metrics questions, especially when identifying the most
    important metric. The SMART acronym has many variations, which I have included
    here:


    +   - S: specific, significant, stretching

    - M: measurable, meaningful, motivational

    - A: agreed upon, attainable, achievable, acceptable, action-oriented

    - R: realistic, relevant, reasonable, rewarding, results-oriented'
