  md: '# Chapter 15 Hypothetical: Opinion


    House Pricing

    Zillow’s price estimation tool depends on the following pieces of data: property
    tax history, comparable houses and finalized sales details from counties. How
    does this dependency price estimation?


    +   * Historical data lags the current reality.

    * Reported information may be incorrect.

    * Comparisons with neighborhood houses may be flawed, especially if those houses
    have interior upgrades or downgrades that aren’t reflected in the price.

    * Not all counties report finalized sales details.


