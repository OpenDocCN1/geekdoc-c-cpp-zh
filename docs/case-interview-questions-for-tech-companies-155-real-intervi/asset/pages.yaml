- pgno: 267
  md: '# Quick Judgment


    Tell me about a time when you had to use quick judgment. What were the results?


    Things to Consider


    +   - Would most people have been indecisive if they were in your shoes?

    - Was it clear that others would have asked for more time to make a decision?

    - Was the result optimal, given the situation? Or did it merely indicate that
    you have a propensity to make rash decisions?


    Common Mistakes


    +   - Dry, boring stories.

    - Gaps in the storyline.

    - Unnecessarily adding extra details, primarily due to emotional baggage.


    # Answer


    CANDIDATE: While our first game showed some success during the soft-launch, I
    had to make a decision regarding customer service. Traditionally, our company''s
    product managers were in charge of the customer service. This was not sustainable
    in the end given our product manager''s growing set of responsibilities. Therefore,
    I had to choose:


    +   - Do I maintain the status quo?

    - Or I hire a dedicated customer service team?


    The decision-making dilemma stems from the fact that it takes at least a month
    to recruit and another two weeks for onboarding before new team members become
    productive. Furthermore, if the game was unsuccessful, the newly hired customer
    service team would not have much to do.


    After consulting with others and fairly weighing the pros and cons, I decided
    to hire a dedicated customer service team. In the worst-case scenario, if they
    do not have much to do, they can assist other team members with other tasks. In
    addition, to keep our costs low, I decided to hire part-time interns, not full-time
    employees.


    I ended up hiring three customer interns who worked 20 hours a week I mentored
    them until they could stand on their own. They performed admirably, so we converted
    them into full-time employees when our game launched successfully. Our users loved
    our high service levels and more importantly, the morale of our overworked product
    managers improved substantially during the quarterly company poll.'
  merge: -1
  img_proc: true
