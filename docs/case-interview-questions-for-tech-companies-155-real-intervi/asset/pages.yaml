    # Cohort analysis


    Measure and compare differences of a specific customer segment, over time.


    # Critical Path Dependency


    A strategic relationship between a preceding and succeeding task in a sequence
    of activities that impacts the project end date. Predecessor tasks must be finished
    before the start of successor tasks.


    # DIGS Method™


    To get a job offer, I believe that candidates have to do two things: be likable
    and show credibility that they can do the job. DIGS Method™ is a behavioral interview
    framework that promotes credibility and likelihood in your response.


    +   - Dramatize situation: Provide context and details that emphasizes the importance
    of your job, project or product.

    - Indicate the alternatives: Be thoughtful and analytical by listing three different
    approaches to a problem.

    - Go through what you did: Conv the listener that you were the driving force.

    - Summarize your impact: Provide numbers and qualitative statements that validate
    your impact.


    # 5Es Framework


    An acronym to brainstorm different stages of the customer experience. In other
    words, use this framework to quickly and easily build a customer journey map.
    Here are the 5Es:


    +   - Entice. What triggers a user to enter into the UX funnel?

    - Enter. What are the first few steps in the UX funnel?

    - Engage. What task(s) is the user trying to accomplish?

    - Exit. How does the user complete the task?

    - Extend. What follow-up actions occur after the user completes the task?


    A customer journey map can help one more effectively answer product design questions.


    # Five W and H


    A checklist of questions to get the complete facts on a situation. For example,
    when understanding a new product, here''s what listeners want to know:


    +   - What is it?

    - Who is it for?'
