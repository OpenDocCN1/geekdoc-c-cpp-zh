  md: "# # Chapter 1 Introduction\n\nWhat are case interview questions?\n\nCongratulations\
    \ on concentrating your job hunt on technology companies like Google, Amazon,\
    \ Apple and Uber. If you picked up this book, you are likely interviewing for\
    \ the roles below:\n\n+   * Product management\n* Marketing\n* Operations\n* Finance\n\
    * Strategy\n* Business Development\n\nAt the interview, it is very possible that\
    \ you will get case interview questions. Case questions are different from traditional\
    \ and behavioral interview questions like:\n\n+   * Tell me about yourself. And\
    \ why do you want to join our company?\n* Tell me a time when you persuaded executives\
    \ to build a product feature they did not want to build.\n\nCase questions are\
    \ interview questions about a hypothetical business situation or case. They are\
    \ meant to test how one would approach and solve that business problem. Here are\
    \ some examples, reported by candidates:\n\n| Role | Company | Question |\n|---|---|--|\n\
    | Product management | Google | Estimate how Gmail costs per user, per year.\n\
    \ Improve the Disneyland user experience, relevant to a Google product. |\n| Pathways\
    \ & operations management | Amazon | During the holiday season, Amazon customers\
    \ shipped 200 orders per second. Amazon's data science team discovered that the\
    \ average number of orders waiting to be shipped was 20,650. How long did the\
    \ average order wait to be shipped? |\n| Global supply management | Apple | Describe\
    \ how supply chain works for Apple. What challenges do we face on a day-to-day\
    \ basis? |\n| Business development | Coursera | As a Coursera business development\
    \ executive, how would you manage to build relationships with school administrators?\
    \ |\n| Marketing management | Microsoft | Create a marketing campaign for Microsoft\
    \ Office 365. |\n| Marketing intelligence & business analytics | Facebook | Which\
    \ is better? Having 10 false positives or 80 false positives? |\n| Finance | Amazon\
    \ | How would you reprise Amazon Prime if your goal was to increase profitability?\
    \ |\n| Corporate strategy | Microsoft | How would you reposition Google's offerings\
    \ to counteract competitive threats from Microsoft? |"
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Welcome to the world of case questions for the tech industry. These questions
    can stun novices and experts alike. If you are interviewing for a business role
    at a tech company, whether it''s product management, marketing, operations or
    finance, you need to be ready for case questions.


    # Origin of case questions


    Management consulting firms, like McKinsey & Company, popularized case questions.
    Consulting questions simulate a client engagement. The interviewer would play
    the role of the client or facilitator; the candidate would play the role of a
    consultant. The aspiring consultant would answer the question by:


    +   - Listening to the client''s description of a business problem

    - Asking clarifying questions

    - Present a hypothesis

    - Analyzing facts and data, to confirm or deny the hypothesis

    - Brainstorming solutions

    - Making a final recommendation


    # Why interviewers ask questions


    Consulting firms deemed traditional interview ineffective in appraising a candidate''s
    problem solving skills, so they invented the case interview. Happy with the results,
    consulting firms have made case interviews a permanent fixture in their candidate
    evaluation processes. And the tech industry, stuffed with ex-McKinsey consultants,
    have embraced consulting''s interview tradition.


    To summarize, case questions, in any industry, are meant to evaluate a candidate''s:


    +   - Problem solving skills

    - Communication skills

    - Business judgment

    - Courage and impact when making a recommendation


    # Effectiveness in evaluating a candidate''s ability


    The case interview can be considered a work simulation since it simulates what
    candidates might be asked to do on the job. Work simulations (and work sample
    tests) seem to indicate a candidate''s potential. Two employment testing experts,
    Frank Schmidt and John Hunter, concluded that work sample tests are the best way
    to determine one''s candidacy. Their research shows that work sample tests outperformed
    the next best method, structured interviews, in evaluating candidates by six percent.


    # How case questions for tech companies differ from consulting


    Case questions at consulting and tech firms have many similarities including:


    +   - Ask candidates to solve business problems'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   * Require candidates to have a methodical approach

    * Typically call for number crunching

    * Expect candidates to make a recommendation, affecting the target goal in an
    effective and logical way


    However, unlike case questions, tech case questions are more likely to have the
    following characteristics:


    +   * **Involve real-world scenarios.** To maintain client privacy, consulting
    cases often use fictitious names and scenarios. Tech firms are more likely to
    use actual problems, making case questions easier to anticipate.

    * **Ambiguous.** Tech companies use questions that are less specific and more
    open-ended, similar to the broad strategic questions that CEOs face day-to-day.

    * **Require tech domain-expertise.** Consulting firms don''t expect candidates
    have industry-specific knowledge, but tech firms do.

    * **Dearth of background information.** Unlike consulting, tech cases rarely,
    if ever, have background information to share with the candidate. There is no
    interview guide, and the interviewer usually do not exhibits to reveal to the
    interviewee.

    * **Unlikely to provide help, or other assistance.** Consulting interviews often
    help candidates with unknown assumptions. Tech companies are less helpful in this
    regard. Sometimes, they don''t know or don''t want to reveal confidential information.
    Other times, they withhold assumptions so they can assess a candidate''s judgment.


    # What the book is about and how to use it


    This book includes over 150 practice problems along with sample answers. The questions
    are organized by question type; there are different question categories including
    product design, marketing, operations, finance and business development.


    The best candidates are attempting the problems on their own and comparing their
    answers with the sample. I would strongly recommend that you do the same.


    To reinforce that concept, I created blank pages for the first 10 questions. After
    that, I hope you continue to do problems and first review the sample answer.


    And one more tip: do you research the types of questions you''re likely to encounter;
    pick and choose the sample questions that are most similar to what you think you''re
    likely to get at the actual interview.


    # Who should read this book


    If you are interviewing for any of the following roles at tech companies, you
    should be prepared for case interviews:


    +   * Product management

    * Operations'
  merge: -1
  img_proc: true
- pgno: 12
  md: '+   * Business Development

    * Marketing

    * Finance

    * Strategy


    # Why I''m confident you''ll get better


    In 2015, I released a similar book called, *Interview Math: Over 50 Problems and
    Solutions for Quant Case Interview Questions*. It''s targeted at aspiring management
    consultants applying at top-tier firms like McKinsey, Bain and Boston Consulting
    Group. It included estimation, profitability, breakeven, and pricing questions.


    As readers made their way through every problem, they gained remarkable proficiency,
    including readers who believed or told they not to do math.


    With *Interview Questions*, you''ll be empowered in the same way. You may be terrified
    of product design, metrics and technical interview questions now. And that''s
    normal. We do not practice these interview questions every day. I''m positive
    that if you dedicate yourself, you''ll see a 10 to 15X improvement in your PM
    interview skills.


    # Have these books and frameworks within an arm''s reach


    Many of you have read my previous books. This book has new questions and sample
    answers. Here''s a list of books that you''ll want to have within an arm''s reach:


    +   * *Decode and Conquer* has explanations to PM-related frameworks including
    the CIRCLES™ Method, AARM™ and DIGS™.

    * *Rise Above the Noise* has explanations to marketing-related frameworks including
    the Big Picture Framework, MOB and important pricing frameworks.

    * *Interview Math* has great introductory material and provides more methods on
    how to tackle estimation, market sizing, ROI and lifetime value questions, especially
    if you find the harder analytical questions in this book so intimidating.


    Lastly, if you''re a product management candidate looking for even more practice
    questions and sample answers, grab a copy of my book *Interview Questions*, where
    you''ll find another 160+ practice questions.


    # Email me


    I''d love to hear your feedback, comments and even typos. Contact me at lewis@impactinterview.com.


    Lewis C. Lin

    October 2016'
