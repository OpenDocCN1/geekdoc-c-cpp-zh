  md: '# Chapter 2 Finding Practice Partners and Bonus Resources


    I created a community of practice partners so that you can get feedback on your
    interview responses. And to accompany your partner practice, I''ve created interview
    evaluation sheets.


    # Find Practice Partners


    Practicing with others is incredibly beneficial. It will:


    +   - Give you a fresh perspective

    - Provide moral support

    - Keep you accountable


    Finding practice partners is not easy, so I created a special Slack community
    for all of you. bit.ly/InterviewPartner into your Internet browser to join:


    Here''s what people have said about our mock interview practice partner communities:


    > “Thanks to this community, I have found partners and am getting a fair bit of
    practice in.” – M.A.


    > “Hey Lewis, you already know this, but you''ve built something amazing here.
    I''ve done a few interviews now and most folks have been welcoming and really
    helpful. You should be proud ©Congrats.” – S.G.


    > “Hey Lewis, awesome group you got going here! A few of us loved your presentation
    at Berkeley Haas past weekend and will be using your resources to get a few study
    groups together to work on cases. Looking forward to interacting with everyone
    here.” – J.Z.


    # Interview Evaluation Sheets


    We tend to improve quickly when we have clear, actionable feedback. To help you
    get that feedback, I''ve created interview evaluation sheets that your partner
    practice can fill out.


    The evaluation sheets contain criteria that hiring managers look for in top-notch
    interview responses. It is based off my research with hiring managers on how they
    evaluate product management, operations, strategy, finance and business development
    candidates.'
