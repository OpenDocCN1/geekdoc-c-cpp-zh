    have a lot of taxis?


    INTERVIEWER: Why don''t you write down solutions for all of these scenarios?


    CANDIDATE: All right. I would think along these:


    +   * Heavy Car Usage. If the city has a lot of car usage, it makes it easier
    to get Uber started. Otherwise, where are we going to get drivers? If there are
    not a lot of cars, then we might need to work with a local car dealership to see
    if we can work with them so they attractively priced vehicles forwould-Uber drivers.

    * Traffic. Is there a lot of traffic? If so, I would suggest promoting things
