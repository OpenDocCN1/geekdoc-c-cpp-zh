  md: "# Bias for Action\n\nTell me of a time when you had a bias for action.\n\n\
    Things to Consider\n\n+   - Hiring managers love employees who take action without\
    \ being prompted. It saves them from prodding employees or having to worry about\
    \ another thing.\n- This question tests whether or not employees can get things\
    \ done without prompting.\n- Stronger responses show not only a candidate's initiative\
    \ but also the candidate's ability to exceed expectations.\n\nCommon Mistakes\n\
    \n+   - Giving an answer that's too short. Short responses, especially those less\
    \ than 30 seconds can:\n  - Leaves the interviewer wanting.\n  - Have you come\
    \ across as inexperienced inexperienced individuals (new graduates) are more likely\
    \ to not have much to say.\n\n# Answer\n\nCANDIDATE: As an Amazon operations associate,\
    \ I visited a lot of fulfillment centers. Over the years, I've visited fulfillment\
    \ centers in Arizona, Indiana, Kentucky and Pennsylvania.\n\nOne day, I was observing\
    \ incoming trucks at an Amazon fulfillment center in Indiana. I discovered that\
    \ employees were unloading broken merchandise that took a lot of time to clean\
    \ before the rest of the truck could be unloaded. The broken glass and boxes stopped\
    \ employees from unloading the truck fully, causing more person-hours than budgeted.\n\
    \nI realized that the merchandise was broken because heavy boxes were sitting\
    \ on top of lighter boxes. I took some pictures. After observing the situation\
    \ for many days, I also calculated the cost of how much the company was losing.\
    \ The fulfillment center was unloading trucks 30 days a year, and it required\
    \ 5 additional hours to clean up for a team of 4. At $15 per hour, I found out\
    \ that this was an incredible sum.\n\nI submitted my pictures and calculations\
    \ to the shift supervisor. I also proposed a new method to load the trucks. The\
    \ shift supervisor asked a couple of questions and thanked me for my notes.\n\n\
    I was surprised that during my next visit to Seattle for the annual conference,\
    \ the shift supervisor had nominated me for the employee of the quarter award.\
    \ Apparently the supervisor took my recommendations, implemented them and saved\
    \ $250,000 on labor."
