    # Assumptions


    +   * Yahoo makes money through three channels: ads (Yahoo Search, News, Blogs),
    Enterprise (Yahoo Mail), and sales (Yahoo Shopping, Yahoo TV)


    +   * Ads probably make about 75% of Yahoo''s revenue. Most of Yahoo''s businesses
    offer content, so ads must be the biggest slice.


    +   * Enterprise probably makes up about 10% of Yahoo''s revenue. Yahoo doesn''t
    have that many enterprise products.


    +   * Sales probably makes up about 15% of Yahoo''s revenue. Yahoo has a lot of
    products that focus around sales.


    +   * Google has about billion users worldwide. Yahoo is behind Google, so probably
    about 1 billion users.


    +   * A typical user uses some form of Yahoo service at least 4 times a day, and
    will see about 16 ads (4 each).


    +   * CPC: $1


    +   * CTR: 0.001


    +   * CPM = CPC * CTR * 1000 = $1


    +   * Enterprise differs on pricing and types, but should charge around $10 dollars
    per user per month.


    +   * Sales really differs on pricing, but again, average. It should be around
    $200 per user.


    +   * Profit margin is around 50%.


    +   * About 60,000 employees in Yahoo.


    +   * The average salary in Yahoo is around $100,000.


    +   * Office cost and everything should be an additional 10% in salary cost.


    # Calculations


    Calculating Ad Revenue


    Ad Revenue = Users * % Ads * CPC * CTR * Ads per Day * Days in a Year


    Ad Revenue = 1 billion * 0.75 * $1 * 0.001 * 16 * 365


    Ad Revenue = $4.38 billion


    Calculating Enterprise Revenue


    Enterprise Revenue = Users * % Enterprise * Cost per Enterprise User * Months
    in a Year


    Enterprise Revenue = 1 billion * 0.1 * $10 * 12


    Enterprise Revenue = $12 billion


    Calculating Sales Revenue'
