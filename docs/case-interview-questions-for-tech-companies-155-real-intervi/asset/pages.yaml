    +   - Spending too much time asking for context.


    # Answer


    CANDIDATE: I would undoubtedly simply start by unifying the inbox. Normally I''d
    approach this question by analyzing users and then thinking of a few solutions.
    But this is something I''ve thought of for a long time.


    Right now a lot of people have multiple email addresses. A typical user has an
    email for work and one for home. They would ideally to have both available in
    one place. Gmail is in perfect position to take this market. Before the most popular
    aggregate mail client was Thunderbird, but it is no longer being supported. Outlook
    is a class competitor, but it doesn''t actually do this inbox function well. New
    companies like Mailbird are rising up to the challenge and doing okay, so clearly
    there is a market for this.


    A unified inbox needs several functions:


    +   - Unified Inbox: The user needs to receive emails from multiple accounts.
    These all need to be in one inbox.

    - Unified Sent Box: The user needs to send emails as multiple accounts. The software
    adjusts based on which account received the mail.

    - Multiple Support: This needs to support the most popular email providers like
    Yahoo, AOL, and Outlook / Hotmail. Less popular email providers can be supported
    under POP3 and IMAP.

    - Hangouts: Users can log into Hangouts over multiple identities. If he has friend
    A on account X and friend B on account Y, he needs to talk to them as accounts.


    The reason why this is a great idea is because there is a clear need for this
    in the market. If a user is using something like Mailbird, we cannot show ads
    to the user. With ads being the major source of revenue for Google as a whole,
    it''s essentially we recapture this market.


    INTERVIEWER: It''s interesting you mentioned this. Why do you think Gmail has
    not thought of this yet?


    CANDIDATE: I am sure they, but they probably don''t see a compelling reason to
    spend time on this. Companies like Mailbird hasn''t exactly been blessed with
    skyrocketing users, and I am sure the majority of users don''t have more than
    one email. However, it''s a growing trend. I''m surprised big companies like Microsoft
