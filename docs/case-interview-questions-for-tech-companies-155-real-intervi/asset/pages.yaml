    - Evaluate Tradeoffs: Define your tradeoff criteria and analyze the solution through
    a pro and cons list.

    - Summarize Your Recommendation: Specify which product or feature you would recommend,
    recap its benefits to the user and/or, and explain why you preferred this solution
