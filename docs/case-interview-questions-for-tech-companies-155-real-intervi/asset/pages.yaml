  md: '# Chapter 3 Abbreviations, Terms and Concepts


    # Abbreviations


    This book will deal with large numbers in the thousands, millions and billions.
    To save space, I will use the following abbreviations:


    +   - K = thousands

    - M = millions

    - B = billions


    For instance, 10K refers to 10,000. 10M is equivalent to 10,000,000, and 10B is
    equivalent to 10,000,000,000.


    I will also use these shorthand abbreviations:


    +   - Q = quantity

    - P = price

    - R = revenue

    - C = cost


    # Terms and Concepts


    AARM metrics™


    An analytical framework that defines the metrics for a product.


    +   - Acquisition: Tracking customer signups for a service. The bar for signing
    up for a service has gotten lower and lower, thanks to the popularity of free
    signup and pay later "freemium" models. The typical metric to track here is lazy
    registrations.

    - Activation: Getting users that have completed a lazy registration to fully register.
    For a social networking site like Google+, this may include uploading a photo
    or completing their profile page.

    - Retention: Getting users to use the service often and behave in a way that helps
    the user or business. Key metrics include adding more information to their profile
    page, checking the news feed frequently or inviting friends to try the service.

    - Monetization: Collecting revenue from users. It could include the number of
    people who are paying for the service or the average revenue per user (ARPU).


    # A/B Testing


    A product decision-making method by comparing results between two different versions
    of a web page or related user experience.


    # Agile Development


    A product development method to develop products incrementally to incorporate
    customer feedback. It''s the opposite of waterfall development where all the features
    are specified in the beginning.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Before and After Analysis


    A way to interview answers to consider the before and after impact of a change.


    # Big Picture Framework


    ![](img/0d3703ff8680acec2ca39cc52072bee0_25_0.png)


    A comprehensive model that provides an effective way to answer interview questions
    about marketing plans and campaigns. There are three parts to the framework: Goals,
    STP (segmentation, targeting, and positioning) and the 4P’s (product, place, promotion,
    and price).


    +   - Goals: The overall business objective and intermediate marketing objectives
    that contribute to.

    - Segmentation: Group buyers by attributes to identify customers that would benefit
    from the product.

    - Targeting: Choose segments that would appreciate and seek out the product''s
    benefits.

    - Positioning: Create a product image for customer segments through the 4''s.

    - Product: Develop new product ideas using the CIRCLES Method.

    - Place: Choose the distribution channel that meets the business goal(s).

    - Promotion: Match promotional tactics with your strategies.

    - Price: Use breakeven analysis for existing products, and the pricing meter for
    new products.


    # CIRCLES Method™


    A guideline that provides complete and thoughtful responses to product design
    questions.


    +   - Comprehend the Situation: Avoid miscommunication by asking clarifying questions
    (5Ws and H) and/or stating assumptions.

    - Identify the Customer: List potential customer personas, and choose one to focus
    on.

    - Report the Customer''s Needs: Provide a user story that conveys their goals,
    desires, and potential benefits. As a <role>, I want <goal/desire> so that <benefit>.

    - Cut, Through Prioritization: Showcase your ability to prioritize, assess trade-offs,
    and make decisions. Create a prioritization matrix that estimates valuable metrics
    (revenue, customer satisfaction, etc.).'
