  md: '# Linear Regression


    Can you explain me what linear regression is?


    Things to Consider


    +   - If you are not familiar with the term, it is okay to admit it to the interviewer.

    - If you are familiar with the term but not confident of your answer, take time
    to ponder. Then, before answering, you may consider caveating your response, “I
    am familiar with the term, but I’m not a linear regression expert since I don’t
    use regressions as often as the data scientist on my team. Let me give it my best
    shot...


    Common Mistakes


    +   - Giving an answer that portrays low confidence


    # Answer


    CANDIDATE: Linear regression takes a bunch of data and attempts to find a relationship
    between an independent variable (result) and dependent variables (causes).


    INTERVIEWER: Can you give me an example?


    CANDIDATE: Let us say you want to see if there is a relationship between a car’s
    weight and its braking time. You may collect thousands of observations, the relationship
    between the two variable may not be clear when you collect those observations.


    To develop a more precise formula relationship between car weight and braking
    time, a regression will derive an equation from observation samples, using a technique
    called “least squares.” Least squares minimizes the sum of the square of the errors
    between the observations and the formula. If the error is large, the correlation
    is weak or possibly non-existent.


    And one more helpful thing to remember: a correlation does not mean causation.
    It just implies causation.


    INTERVIEWER: Okay, thanks for the clarifying example.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Eat Local


    Eat Local is a small chain of gourmet grocery stores based in Seattle, Washington.
    Last year, its annual revenue was $2.1M with cost of sales of $1.7M.


    Eat Local keeps 11 days of inventory on average, given the perishable nature of
    its products.


    What is the annual inventory turns? And how much inventory does Eat Local have
    on average?


    # Answer


    Inventory Turns = Days in a Year / Average Inventory


    Inventory Turns = 365 / 11 = 33.2


    Average Inventory = Cost of Goods Sold / Inventory Turns = $1.7M / 33.2 = $51K'
