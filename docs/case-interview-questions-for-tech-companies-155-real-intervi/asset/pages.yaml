    - Where will it be available?

    - Why should I get it?

    - How does it work?


    # Five Whys


    A technique to determine cause of a particular situation. It involves asking “Why?”
    in succession.


    # Issue Trees


    A problem-solving diagram that breaks down a ‘Why’ or ‘How’ question into identifiable
    root causes or potential solutions, respectively.


    # Marketing funnel


    An analytical model that tracks the customer journey towards a purchase of a product
    or service. There are four general steps, indicated by the AITP acronym:


    +   - Awareness: Bring recognition to a product brand.

    - Interest: Stir fascination with a product (what it does, how it works, and what
    benefit it delivers).

    - Trial: Compel the prospective user to try the product.

    - Purchase: Get the customer to buy the product.


    # Minimum Viable Product (MVP)


    The minimum set of features to gather user feedback for a product concept. It
    can be a fully functioning product, or it can be simply sketches on a piece of
    paper.


    # MOB


    A marketing framework that evaluates the effectiveness of a product advertisement
    or commercial.


    +   - Memorable: Does the grab your attention? Is it worthy of future discussion
    with your friends, acquaintances and social media?

    - Oh, Product! Is the product and brand promoted clearly and definitely?

    - Benefit: Does the explain and provide evidence for a product’s benefit? Is there
    a clear reason why the consumer should choose the product over a competitor’s?


    # Rule of Three


    A communication principle that suggests that responses are bundled in threes are
    more effective and satisfying.


    # Personas


    A representation of a group of customers, defined by their goals and objectives.
    Detailed personas can be described in terms of an example representative’s demographics,
    psychographics and behavior.'
