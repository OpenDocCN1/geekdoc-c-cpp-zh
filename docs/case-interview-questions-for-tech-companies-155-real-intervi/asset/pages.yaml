  md: '# Changing Google Inbox


    How would you change Google Inbox?


    Things to Consider


    +   - Who uses Google Inbox vs. the default Gmail interface

    - What are they trying to accomplish?

    - What product improvements can Google Inbox make to better deliver on the brand
    promise?


