  md: '# Google Moonshot Projects


    Why do you think Google is investing so much in its moonshot projects?


    Things to Consider


    +   - What is the impact of moonshot projects on the company?

    - What is the impact on employees?

    - What is the impact on competition?


    Common Mistakes

    - Not mentioning the need to attract and engage employees who desire challenging
    projects.

    - Not stating the need to empower employees with a greater sense of freedom.


    # Answer


    CANDIDATE: I think there are several reasons for this.


    One, moonshots drive innovation. Remember 20%? That was something most companies
    wouldn''t have done, Google did it. Amazing projects came out of 20% including
    Gmail and Google News. Look at Gmail, for example. it is the most used email client
    in the world right now. Gmail alone probably made enough revenue to cover every
    20% time ever spent. We can see why Google would encourage this.


    Two, moonshots diversify the business. When you are as big as Google, market share
    is important, but diversity is important for a few reasons. First, growth rates
    for existing businesses can flatten out. To sustain growth, Google needs diversity
    into new high growth businesses. Second, it minimizes risk. By not putting all
    its eggs in one basket, Google can be prepared for the worst. Lastly, Wall Street
    doesn''t like surprises; a diversified portfolio can moderate volatility in Google''s
    business.


    Three, moonshots retain employees. A common misconception is that only startups
    can have bold, innovative ideas. As a result, employees seeking to pursue a bold
    new venture often leave their employer to start their own company. Instead of
    enabling that, Google can enable its employees to create startups within the company.
    By supplementing their employees with money, Google can fight the misconception,
    retain talent and most importantly, discover future growth engines.


    To conclude, Google invests so much in moonshot projects because they fit its
    innovative culture and sense economically. They also help diversify Google''s
    business. Moonshots also help to retain customers.'
  merge: -1
  img_proc: true
