  md: '# Interview Evaluation Sheet: Metrics


    Understanding Metrics

    Did the candidate have an understanding of product metrics? Did the candidate
    provide a comprehensive and relevant list?


    Evaluating Metrics

    Did the candidate articulate which metrics are better than others, backed with
    sound logic and evidence? Did the candidate provide an issue tree depicting drivers
    that affect specific metric?


    Diagnosis Metrics

    How was the candidate''s diagnosis? Did the candidate offer a plan on how to positively
    influence a metric, through product changes but perhaps through other levers,
    including marketing and business development initiatives?


    Affecting Change on a Metric


