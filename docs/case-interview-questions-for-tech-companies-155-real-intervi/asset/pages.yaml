  md: '# Dealing with Defeat


    How do you deal with defeat?


    Things to Consider


    +   - Use the Rule of Three.

    - Offer an example to demonstrate that you behave in accordance with what you
    normally do.

    - Include emotions to make the story more humanistic, increasing your chances
    of connecting and establishing rapport.


    Common Mistakes


    +   - Not offering an example, which makes the answer sound textbook and conventional.

    - Giving an answer that’s too short, leaving the interviewer wanting more.


    # Answer


    CANDIDATE: When dealing with defeat, I usually go through three phases:


    +   - Accept failure. It could let me it for days, or I can resume my life. It’s
    not easy to be positive, but I try to be resilient and bounce back quickly.

    - Learn. Failure is an opportunity to learn. Did I make a careless mistake? Could
    I have avoided it? Could I have done differently? There’s nothing worse than repeating
    the same mistake, so I log all the insights and takeaways I can.

    - Move forward. I think about what my next goal should be and create a new challenge
    for myself.


    Would it help if I shared a story about a time when I dealt with defeat?


    INTERVIEWER: Sure, go for it.


    CANDIDATE: This past July, I joined Google’s cloud team as technical program manager.
    Two weeks into the job, I got a call from Ileana; she said, “Amber, there’s a
    production workload that you created with no billing ID. Do you know what’s going
    on?


    I immediately felt a little flush and embarrassed. I stuttered, “Uh, I’ll look
    into it.” After investigation, I realized that I didn’t attach a billing ID to
    a customer workload that I created. I did the quick math; that’s $30,000 revenue
    that Google missed out on.


    At that point, I had three options:


    +   - Deny that the mistake happened and blame it on the poorly designed software.
    Or perhaps excuse Ileana.

    - Complain to my boss that they should not have a new person take a critical task.

    - Accept the mistake and learn from it.


    In the heat of the moment, options 1 and 2 were not so unreasonable as they sound.
    I have seen my co-workers deny or complain often. And quite frankly, I was tired
    of being the “good one.”'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'But I decided to accept mistake and learn from it. Within the next couple of
    days, I created a new UI wireframe that would prevent me and others from forgetting
    the billing ID again. I also made a suggestion on how to streamline the process
    so that new workloads could be created in 40% less time.


    One year later, during my one-year anniversary, I received a promotion. My boss
    teased me about my $30,000 mistake from a year ago. But he remarked that''s part
