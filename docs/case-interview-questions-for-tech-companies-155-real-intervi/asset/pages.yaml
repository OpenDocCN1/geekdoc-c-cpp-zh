  md: '+   - T: time-based, time-bound, tangible, trackable


    # SWOT Analysis


    A structured planning method to evaluate the strategic elements of a business,
    industry or product to find its competitive advantage.


    +   - Strengths: Attributes that provide an advantage over other competitors.

    - Weaknesses: Attributes that provide a disadvantage relative to other competitors.

    - Opportunities: Elements that can be utilized to maximize advantages or trends.

    - Threats: Elements in the environment that can be an obstacle or risk to your
    business or product.


    # Viral Loop


    Similar to word-of-mouth marketing, getting users in the process of referring
