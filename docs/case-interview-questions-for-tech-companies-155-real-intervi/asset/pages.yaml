  md: '# Inbound Flow


    You are in charge of the department that receives the product into the building
    and stows it to the bin it is accessible by the department. You have two options
    on how to receive and stow the product. In the first option, you receive the product
    at 250 units per labor hour and stow it at 100 units per labor hour. You must
    receive it and stow it for the unit to count for production. This process results
    in 1% of the units stowed being incorrect. You can find and fix these errors at
    a rate of 20 units per labor hour with what you believe is almost 100% accuracy.
    In the second option, you receive and stow the product in one step vs. two. The
    rate for this process is 80 units per labor hours for receive and stow. This process
    results in 1.5% of the units stowed being incorrect. You can find and fix these
    errors at a rate of 20 units per labor hour with what you believe is almost 100%
    accuracy.


    +   - Which option would you select for today''s units and why?

    - Does your answer change if you are told you must fully process 100,000 units
    today? If, why?

    - Does your answer change if you are told that you have 15 associates today and
    you must fully produce the maximum units possible? If yes, why?


    Things to Consider


    +   - Are all the associates-trained to both receive and stow?

    - Aside from processing time, is cost an issue?

    - Is it possible to do the two steps in parallel for option 1?


    # Answer


    CANDIDATE: Let''s break these numbers down:


    # Method 1


    It takes 1 hour to receive 250 units, 2.5 hours to stow away these units at 100
    units per hour. This takes 3.5 hours to receive and stow.


    ```

    $$\frac{250 \text{ units}}{3.5 \text{ hours}} = \sim71.43 \text{ units stowed
    per hour}$$

    ```


    If we have 71 units per hour, this means we have many error units per hour:


    ```

    $$\71 \times 0.01 = 0.071 \text{ error units per hour}$$

    ```


    Since we find and fix errors at 20 units per hour, it would be this many hours
    to find and fix:


    ```

    $$\frac{0.071 \text{ error units}}{20 \text{ error units per hour}} = 0.00355
    \text{ hours}$$

    ```'
