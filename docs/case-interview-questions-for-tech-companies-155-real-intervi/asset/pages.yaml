  md: '# Improving Toothpaste


    How would you improve toothpaste?


    Things to Consider


    +   - Pick a specific persona.

    - Explore customer needs.

    - Use Rule of Three.


    Common Mistakes


    +   - Afraid of suggesting inferior ideas.

    - Spending too much time asking for context.

    - Not using vivid details, such as dental plaque, halitosis, gingivitis, fluoride
    and sodium bicarbonate makes the answer more credible, engaging and memorable.


    # Answer


    CANDIDATE: There are many personas I can consider, but unless you disagree, I''m
    going to focus on the persona I know best: myself.


    INTERVIEWER: Sure, that''s fine.


    CANDIDATE: There are many reasons why I brush my teeth including:


    +   1. Health reasons

    2. Need for fresh breath

    3. Social norms


    Here are some problems specifically with toothpaste:


    +   1. I am afraid of use harmful chemicals as well as artificial sweeteners or
    colors.

    2. I never know how toothpaste is enough.

    3. It''s always hard to get the last bit of toothpaste.

    4. I don''t feel like they freshen my breath.

    5. Some toothpastes are too strong. If you get them on your tongue, it''s very
    uncomfortable.


    Now I can think of ways to improve them.


    +   - Make it freshen your breath length or stronger. This might be mutually exclusive
    with the next one.

    - Make the toothpaste tamer.

    - Make it a controlled or measured squeeze. That is, give an audible noise or
