    incoming traffic. I acquired this data by both researching online and talking
    with a few PMs in other game companies who shared their data sets with me.


    If I were to make the decision again, I would focus on individual country data.
    I would also prioritize based on the potential market share, CPI and payment habits
    of these countries as well.


    INTERVIEWER: Did you not research this on your first pass?


    CANDIDATE: I did. However, it was very time consuming to get the data, and we
    had a deadline. The Southeast Asian market is very fragmented with millions of
    jailbroken devices as well as third-party app stores.'
