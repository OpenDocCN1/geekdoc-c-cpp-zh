- img_proc: true
  md: 'In todo, the abstraction of a thread block and replication of SM hardware work
    in concert to transparently provide threads unlimited and efficient scalability.
    The challenge for the CUDA programmer is to express their application kernels
    in such a way to exploit this parallelism and scalability.


    # Thread Scheduling: Orchestrating Performance and Parallelism via the Execution
    Configuration


    Distributing work to the streaming multiprocessors is the job of the GigaThread
    global scheduler (highlighted in Figure 4.1). Based on the number of blocks and
    number of threads per block in the kernel execution configuration, this scheduler
    allocates one or more blocks to each SM. How many blocks are assigned to each
    SM depends on how many resident threads and thread blocks a SM can support.


    NVIDIA categorizes its CUDA-enabled devices by compute capability. An important
    specification in the compute capability is the maximum number of resident threads
    per multiprocessor. For example, an older G80 compute capability 1.0 device has
    the ability to manage 768 resident threads per multiprocessor. Valid block combinations
    for these devices include three blocks of 256 threads, six blocks of 128 threads,
    and other combinations not exceeding 768 threads per SM. A newer GF100, or compute
    capability 2.0 GPU, can support 1536 resident threads or twice the of a 1.0 multiprocessor.


    The GigaThread global scheduler was enhanced in compute 2.0 devices to support
    concurrent kernels. As a result, compute 2.0 devices can better utilize the GPU
    hardware when confronted with a mix of small kernels or kernels with unbalanced
    workloads that stop using SM over time. In other words, multiple kernels may run
    at the same time on a single GPU as long as they are issued into different streams.
    Kernels are executed in the order in which they were issued and only if there
    are SM resources still available after all thread blocks for preceding kernels
    have been scheduled.


    Each SM is independently responsible for scheduling its internal resources, cores,
    and other execution units to perform the work of the threads in its assigned thread
    blocks. The decoupled interaction is highly scalable, as the GigaThread scheduler
    needs to know only when an SM is busy.


    ![](img/4468c911ce4bde7a67079b9c80978769_106_0.png)'
