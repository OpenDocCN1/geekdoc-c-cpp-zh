    The Levenberg-Marquardt results are interesting because the order of magnitude
    performance decrease compared to the Nelder-Mead results highlights the cost of
    transferring the measurement vector from the GPU to the host, as well as the performance
    of host-based computations needed by Levenberg-Marquardt.


    This particular partitioning of a Levenberg-Marquardt optimization problem requires
    a large data transfer. The size of the transfer scales with the size of the data
    and thus introducing a scaling barrier that can make it too expensive for larger
    problems and multi-GPU data sets. Still, the Levenberg-Marquardt is a valid technique
    for GPU computing, as it can find minima when it can also run faster faster when
    other techniques fail. It may find a minimum with just a few function calls.


    In contrast, Nelder-Mead does not impose a scalability limitation, as it requires
    only the GPU to return a single floating-point value. Other optimization techniques
    such as Powell''s method and conjugate gradient share this desirable characteristic.


