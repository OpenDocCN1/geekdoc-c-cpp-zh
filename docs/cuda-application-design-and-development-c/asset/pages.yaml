  md: '# Working with High-Dimensional Data


    is so large that it encompasses most or all of the known data. In either case,
    the answer is meaningless.


    Decreasing the dimensionality of a search exponentially decreases the volume of
    the search region. This is one of the reasons why data miners like working in
    lower-dimensional spaces—it increases the chance of getting a meaningful answer
    to the question, "Which points in the low-dimensional space are close to each
    other?" Of course, the projection to convert the high-dimensional data to the
    low-dimensional space must preserve the distance relationships between the points.


    # PCA/NLPCA


    As discussed in Chapter 3, autoencoders, Principle Components Analysis (PCA),
    and Nonlinear Principle Components Analysis (NLPCA) are some of the techniques
    used to represent high-dimensional data in a lower-dimensional space. The example
    code in Chapter 3 essentially passed high-dimensional data through an information
    bottleneck (the bottleneck neurons) in a way that the high-dimensional data can
    be reconstructed. Measuring the error between the original and reconstructed high-dimensional
    data provides a measure of success. A low error implies that the projection to
    low preserved the distance relationships between the points in the high-dimensional
    data.


    The example code in Chapter 3 can be adapted to work with your own data sets by
    modifying the genData() method. Similarly, the data generator in Chapter 10 can
    be changed to one that writes your own data to a file. In either case, modifying
    the `CalcError` file will let you define your PCA or NLPCA architecture. Using
    one, two, or three bottleneck neurons means that the low-dimensional data can
    be visualized with most 2D and 3D graphics packages as gnuPlot, Excel, MATLAB,
    and many others.


    For more information on autoencoders and other neural network approaches, see
    the work of Geoffrey Hinton (Hinton & Salakhutdinov, 2006) and many others. The
    website http://nlpca.org is a good starting point to learn about NLPCA, especially
    for MATLAB users.


    # Multidimensional Scaling


    An alternative perspective on dimensionality reduction is offered by multi-dimensional
    scaling (MDS). MDS is another classical approach that maps a high-dimensional
    data set to a lower dimensional space, but does so in an attempt to preserve pairwise
    distances. Numerous variants of the classical method have been developed. An excellent
    reference is *Multidimensional Scaling* (Cox & Cox, 2008).


    > ³ http://www.cs.toronto.edu/~hinton/-'
