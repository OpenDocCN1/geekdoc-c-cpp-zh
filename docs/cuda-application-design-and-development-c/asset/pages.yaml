    # Mapping GPU Memory with OpenGL


    From a CUDA programmer''s point of view, OpenGL creates and manages regions of
    memory on the GPU in generic buffers called buffer objects. The CUDA/OpenGL interoperability
    happens when a CUDA kernel maps a buffer into CUDA memory space. Control of the
    buffer is returned to OpenGL when the buffer is released, or unmapped. Mapping
    is a low-overhead operation that happens quickly and provides high-speed interoperability
    with CUDA without requiring any memory copies.


    Interoperability with OpenGL requires that the CUDA device be specified by cudaGLSetDevice()
    before any runtime calls. Note that cudaSetDevice() and cudaGLSetDevice() are
    mutually exclusive.¹ Interoperability with OpenGL requires that the CUDA device
    be specified by cudaGLSetDevice() before any runtime call. Once a resource is
    registered to CUDA, it can be mapped and unmapped as many times as necessary using
    cudaGraphicsMapResources() and cudaGraphicsUnmapResources(). The method cudaGraphicsResourceSetMapFlags()
    can be called to provide hints (e.g., read-only, write-only) that the CUDA driver
    can use to optimize resource management.


    There are two primary OpenGL memory objects that CUDA programmers will manipulate:


    +   - Pixel buffer objects (PBOs): A region of memory used by OpenGL to store
    pixels. A 2D image is composed of multiple pixels, dots or clusters of color.
    CUDA applications map a PBO to create or modify images on a pixel-by-pixel basis
    and display them using OpenGL.


    +   - Vertex buffer objects (VBOs): A region of memory that OpenGL uses for 3D
    vertices. CUDA applications map a VBO to generate or modify 3D information that
    OpenGL renders as a colored surface, wireframe image, or set of 3 points.


    The following is an outline of the key OpenGL calls associated with VBO usage
    (excerpt from the OpenGL VBO wallpaper on http://spec.org):


    +   - glBind(): This function calls client-state functions to use binding buffers
    instead of working in absolute memory on the client side. Buffer object names
    are unsigned integers. The runtime value is reserved. Setting


    > ¹ Please see section 3.2.7.1 of the NVIDIA C Programming Guide'
