    The CUDA kernel, fillKernel(), is queued for execution on the GPGU using nBlocks
    and nThreadsPerBlock execution configuration. Both d_a and n are passed as parameters
    to the kernel. Host execution then proceeds to the return from the fill() subroutine.
    Note that fillKernel() must be preceded by the __global_ declaration specifier
    or a compilation error will occur.


    At this point, two things are happening:


    +   1. The CUDA driver is informed there is work for the device in a queue. Within
    a few microseconds (use or millions of a second), the driver loads the executable
    on the GPGU, defines the execution grid, passes the parameters, and because the
    GPGU does not have any other work to do—starts the kernel.

    2. Meanwhile, the host processor continues its sequential execution to call thrust:reduce()
    to perform task 3. The host performs the work defined by the Thrust templates
    and queues the GPU operations. Because reduce() is a blocking operation, the host
    has to wait for a result from the GPGU before it can proceed.


    Once fillKernel() starts running on the GPU, each thread calculates its particular
    thread ID (called tid in the code) based on the grid defined by the programmer.
    This example uses a simple 1D grid, tid is calculated using three constant variables
    that are specific to each kernel and defined by the programmer via the execution
    configuration:


    +   - blockIdx.x: This is the index of the block that the thread happens to be
    part of the grid specified by the programmer. Because this is a 1D grid, only
    the x component is used; the y and z components are ignored.

    - blockDim.x: The dimension or number of threads in each block.

    - threadIdx.x: The index within the block where this thread happens to be located.


    The value of tid is then checked to see if it is less than n, as there might be
    more than elements in the array. If tid contains a valid index into a array, the
    element at tid is set to the value of tid. If not, the thread waits at the end
    of the kernel until all the threads complete. This example was chosen to make
    it easy to see how the grid locations are converted into array indices.'
