  md: "# CHAPTER 5: CUDA Memory\n\nMemory can be dynamically allocated in the kernel\
    \ using the standard C-language malloc() and free(). It is aligned on 16-byte\
    \ boundaries.\n\nDynamic global memory allocation on the device is supported only\
    \ by devices of compute capability 2.x. Memory allocated by a given CUDA thread\
    \ remains allocated for the lifetime of the CUDA context, or until it is explicitly\
    \ released by a call to free(). Any thread can use memory allocated by any other\
    \ CUDA thread – even in later kernel launches. Be aware that any CUDA thread may\
    \ free memory allocated by another thread, which means that care must be taken\
    \ to ensure that the is freed more than once. The CUDA memory checker, cuda-memcheck,\
    \ is a useful tool to help find memory errors.\n\nThe device heap must be created\
    \ before any kernel can dynamically allocate memory. By default, CUDA creates\
    \ a heap of 8MB. Unlike the heap on a conventional processor, the heap on the\
    \ GPU does not resize dynamically. Further, the size of the heap cannot be changed\
    \ once a kernel module has loaded. Memory reserved for the device heap consumes\
    \ space just like memory allocated through host-side API calls such as cudaMalloc().\n\
    \nThe following API functions get and set the heap size:\n\n+   - Driver API:\n\
    \  - cutxGetLimit(size_t size, CU_LIMIT_MALLOC_HEAP_SIZE)\n  - cutxSetLimit(CU_LIMIT_MALLOC_HEAP_SIZE,\
    \ size, size_t)\n- Runtime API:\n  - cudaDeviceLimit(size_t * size, cudaMallocHeapSize)\n\
    \  - cudaDeviceSetLimit(cudaMallocHeapSize, size, size_t)\n\nThe heap size granted\
    \ will be at least size bytes. cutxGetLimit and cudaDeviceLimit return the currently\
    \ requested size.\n\nThe CUDA C Programming Guide Version 4.0 provides simple\
    \ examples of per-thread, per-threadblock, and allocation persistence across kernel\
    \ invocations.\n\n# Limiting Factors in the Design of Global Memory\n\nGlobal\
    \ memory does represent a scaling challenge for GPGPU architects. Although multiple\
