  md: '# PCA and NLPCA 65


    ![](img/4468c911ce4bde7a67079b9c80978769_84_0.png)


    FIGURE 3.2

    NLPCA data set.


    NLPCA has wide applicability to numerous challenging problems, including image
    and handwriting analysis (Hinton & Salakhutdinov, 2006; Schölkopf & Klaus-Robert
    Müller, 1998) as well as biological modeling (Scholz, 2007), climate (Hsieh, 2001;
    Monahan, 2000), and chemistry (Kramer, 1991). Geoffrey E. Hinton has an excellent
    set of tutorials on his website at the University of Toronto (Hinton, 2011). Chapter
    10 expands this use of MPI (Message Passing Interface) so that it can run across
    hundreds of GPUs. Chapter 12 provides a working framework for real-time vision
    analysis that can be used as a starting point to explore these and more advanced
    techniques.


    # Autoencoders


    In 1982, Erkki Oja proposed the use of a restricted number of linear hidden neurons,
    or bottleneck neurons, in a neural network to perform PCA analysis (Oja, 1982).
    Figure 3.3 illustrates a simple network with two inputs and one hidden neuron.


    Such networks were later generalized to perform NLPCA. Figure 3.1 illustrates
    an architecture recommended by Kramer (1991) that uses multiple hidden layers
    with a sigmoid nonlinear operator. The bottleneck neuron can be either linear
    or nonlinear. Hsieh extended this architecture to closed curves by using a circular
    node at the bottleneck (2001).


    During training, the ANN easily teaches itself because the input vectors are utilized
    as the known output vectors, which forces the lower half of the network to transform
    each input vector from a high- to low-dimensional space (from two dimensions to
    one in Figure 3.4) in such a way that the upper half'
