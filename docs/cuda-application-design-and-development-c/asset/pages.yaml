    and 18th of my "Supercomputing for the Masses" tutorial series on the Doctor Dobb''s
    Journal website. For implementation simplicity, fBm (Fractal Brownian Motion)
    was chosen to generate the fractal terrain, which is simply a weighted sum of
    multiple scales of an arbitrary basis function, such as noise. Better methods
    exist to create more realistic landscapes, as noted in "Fractal Landscape and
    Texture Generation" on the Max Planck Institute website (Max Planck Institute,
    2004).¹¹⁰


