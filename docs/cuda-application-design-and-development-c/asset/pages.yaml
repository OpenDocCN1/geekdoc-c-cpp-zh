  md: '2. Give the GPGPU enough work to do.


    3. Focus on data reuse within the GPGPU to avoid memory bandwidth limitations.


    At some point, it is not possible to avoid global memory, in which case it is
    essential to understand how to use global memory effectively. In particular, the
    Fermi architecture made some important changes in how CUDA programmers need to
    think about and use global memory.


    From the developer''s perspective, it cannot be stressed too strongly that all
    global memory accesses need to be perfectly coalesced. A coalesced memory access
    means that the hardware can coalesce, or combine, the memory requests from the
    threads into a single wide memory transaction. Performance occurs when:


    +   - The memory address is aligned. The NVIDIA CUDA Best Practices guides out
    that misaligned accesses can cause an 8 times reduction in global bandwidth on
    older devices. A Fermi GPU with caching enabled would see around a 15 percent
    drop (Micikevicius, 2010). The authors of the NVIDIA guide note that, "Memory
    allocated through the runtime API, such as cudaMalloc(), is guaranteed to be aligned
    to at least 256 bytes. Therefore, choosing thread block sizes, such as multiples
    of 16, facilitates memory accesses by half warps that are aligned to segments.
    In addition, the qualifiers __align__(8) and __align__(16) can be used when defining
    structures to ensure alignment to segments." (CUDA Best Practices p. 27)


    +   - A warp accesses all the data within a contiguous region, which means the
    wider memory transaction is 100 percent efficient because every byte retrieved
    is utilized.


    As discussed in Chapter 4, try to keep memory requests in flight to fully utilize
    the global memory subsystem:


    +   - From an ILP perspective, attempt to process several elements per threads
    to pipeline multiple loads. A side benefit is indexing calculations can often
    be reused.


    +   - From a TLP perspective, launch enough threads to maximize throughput.


    Analyze the memory requests in your application via the source code and profiler
    output. Experiment with the caching configurations and shared memory vs. L1 cache
    configuration to see what works best.


    From a hardware memory requests are issued in groups of 32 threads (as opposed
    to 16 in previous architectures), which matches the instruction issue width. Thus,
    the 32 addresses of a warp ideally address a contiguous, aligned region to stream
    data from global memory at the highest bandwidth.'
