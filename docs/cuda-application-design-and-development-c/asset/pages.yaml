  md: '# CHAPTER 1: First Programs and How to Think in CUDA


    Part of the beauty of CUDA lies in the natural way it encapsulates the parallelism
    of a program inside computational kernels. Applications that run well on GPGPU
    hardware tend to have a few computationally intensive sections of the code (e.g.,
    hotspots) that consume most of the runtime According to Amdahl''s law, these programs
    with kernels that can deliver good parallel speedups (P>>1-P).


    Observation also shows that refactoring an application to CUDA also tends to speed
    up performance on moderately parallel hardware such as multicore processors because
    CUDA allows developers to better see parallelism so that they can reconstruct
    the code to reduce the time spent in the serial (1-P) sections. Of course, this
    assumes observation that the overhead consumed in transferring data to and from
    the GPGPU does not significantly affect application runtime.


    # DATA AND TASK PARALLELISM


    The examples in this chapter have thus demonstrated data parallelism or loop-level
    parallelism parallelized operations inside the loops Task parallelism is another
    form of parallelization that reduces the (1-P) serial time by having multiple
    tasks executing concurrently. CUDA supports task parallelism by running concurrent
    tasks on the host and GPU. CUDA provides other ways to exploit task parallelism
    within a GPU or across multiple GPUs.


    Even the simple GPU examples, like Examples 1.5 and 1.7, can be modified to demonstrate
    task parallelism. These examples performed the following tasks:


    +   1. Create an array.

    2. Fill the array.

    3. Calculate the sum of the array.

    4. Calculate the sum of 0 .. N-1.

    5. Check that the host and device results agree.


