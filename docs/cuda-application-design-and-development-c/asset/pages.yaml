  md: '# CHAPTER 10: CUDA in a Cloud and Cluster Environments


    MPI utilizes a fixed number of processes that participate in the distributed application.
    This number is defined at application startup—generally with mpiexec. In MPI,
    the failure of any one process in a communicator affects all processes in the
    communicator, even those that are not in direct communication with the failed
    process. This factor contributes to the lack of fault tolerance in MPI applications.


    MapReduce is a fault-tolerant framework for distributed computing that has become
    very popular and is widely used (Dean & Ghemawat, 2010). Other, the failure of
    a client has no significant effect on the server. Instead, the server can continue
    to service other clients. What makes the MapReduce robust is that all communication
    occurs in a two-party context where one party (e.g., process) can easily recognize
    that the other party has failed and decide to stop communicating with it. Moreover,
    each party can easily keep track of the state held by the other party, which facilitates
    failover.


    A challenge with cloud computing is that many service providers use virtual machines
    that run on busy internal networks. As a result, communications time can increase.
    In particular, the time Reduce is very latency-dependent, as can be seen in Equation
    10.2. For tightly coupled applications (e.g., applications with frequent communication
    between processes), it is highly recommended that dedicated clusters be utilized.
    In particular, reduction operations will be rate-limited by the slowest process
    in the group. That said, papers like “Multi-GPU MapReduce on GPU Clusters” (Stuart
    & Owens, 2011) demonstrate that MapReduce is an active area of research.


