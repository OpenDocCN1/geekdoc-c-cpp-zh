    # Ocelot


    Ocelot is a popular, actively maintained package with a large user base. The website
    notes that Ocelot can run CUDA binaries on NVIDIA GPUS, AMD GPUs, and x86 processors
    at full speed without recompilation. It can be freely downloaded and is licensed
    under a BSD license. A paper by Gregory Damos, “The Design and Implementation
    of Ocelot’s x86, Dynamic Binary Translator from PTX to Multi-Core recommended
    reading (Damos, 2009), is his chapter in GPU Computing Games (Hwu, 2011).


    Ocelot’s core capabilities consist of:


    +   - An implementation of the CUDA Runtime API.

    - A complete internal representation of PTX kernels coupled to control- and data-flow
    analysis for analyses.

    - A functional emulator for PTX.

    - A PTX translator to multicore x86-based CPUs for efficient execution.

    - A backend to NVIDIA GPUs via the CUDA driver API.

    - Support for an extensible trace generation framework in which application behavior
    can be observed at instruction-level granularity.


    Ocelot has three backend execution targets:


    +   - PTX emulator.

    - A translator from PTX to multicore instructions.

    - A CUDA-enabled GPU.


    Ocelot has validated against more than 130 applications taken from the CUDA SDK,
    the UIUC Parboi benchmark, the Virginia Rodinia benchmarks (Che et al., 2009,
    2010), the GPU-VSIPL signal and image processing library, the thrust library,
    and several domain-specific applications. It is an exemplary


