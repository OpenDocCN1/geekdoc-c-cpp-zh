  md: 'There are two types of loads from global memory:


    +   - **Caching loads:** This is the default mode. A memory fetch transaction
    attempts to find the data in the L1 and then the L2 caches. Failing that, a 128-byte
    cache line load is issued.

    - **Nonaching loads:** When lots of data needs to be fetched from consecutive
    addresses, better performance might be achieved by turning off the L1 cache with
    nvcc command-line option -Xptas -dlcm-. In this case, the SM does not look to
    see whether the data is in the L1, but will invalidate the cache line if it is
    already in the L1. If it is not in the L2, a 32-byte global memory load is issued.
    This can deliver better data utilization when a 128-byte cache line fetch be wasted.


    Global memory store transactions occur by invalidating the L1 cache line and writing
    to the L2. Only when it''s evicted is the L2 data actually written to global memory.


    Most applications will benefit from the cache because it performs coalesced global
    memory loads and stores in terms of a 128-byte cache line size. Once data is inside
    the L2 cache, applications can reuse data, perform irregular memory accesses,
    and spill registers without incurring the dramatic slowdown seen in older-generation
    GPUs caused by having to rely on round trips to the much slower global memory.
    For performance and transparency reasons, the L1 and L2 caches in compute 2.0
    devices are a very good thing.


