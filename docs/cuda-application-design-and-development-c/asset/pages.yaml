    to context creation with cudaSetDevice(). The context is destroyed either by calling
    cudaDeviceReset() or when the controlling host process exits.


    Starting CUDA 2.2, a Linux administrator can select exclusive mode via the SMI
    (System Management Interface) tool. In exclusive mode, a context is no longer
    created by default on GPU 0, but rather on a GPU that does not have an active
    context. If there are no active GPUs, or if cudaSetDevice() specifies a GPU that
    already has an active context, the first CUDA call that attempts to change the
    device state will fail and return an error. This capability can be used to run
    compute or memory intensive applications on unused GPUs in a system.


    # STREAMS AND CONTEXTS


    CUDA applications manage work and concurrency by queuing operations onto a stream.
    CUDA implicitly creates a stream when it creates a context so commands can be
    queued for execution on the device. For example, calling cudaMemcpy() queues a
    blocking data transfer on the current stream. Similarly, calling a CUDA kernel
    queues the kernel invocation on the stream associated with the current device.
    If desired, the programmer can specify the stream in the execution configuration
    as shown in Example 7.1, “An Execution Configuration Including a Stream Specification":


    Example 7.1


    ```

    Kernel<<<blocks, nThreadsPerBlock, 0, stream[1]>>>(parameters)

    ```


    All operations queued on a stream execute in order, which means that each operation
    is pulled off the queue in the order it was placed on the queue. In other words,
    the queue acts as a FIFO (first-in, first-out) buffer whereby operations are sequentially
    pulled off the queue in the order they appeared for execution on the device.


    Multiple streams are required for concurrent execution across devices or to run
    multiple kernels concurrently on a single device.


