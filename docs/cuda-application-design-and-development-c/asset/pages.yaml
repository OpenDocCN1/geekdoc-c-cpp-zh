  md: '# CHAPTER 8: CUDA for All GPU and CPU Applications


    tool to use in profiling and analyzing the behavior of CUDA applications that
    can also be used as a platform for CUDA application portability.


    # Swan


    Swan is a freely available source-to-source translation tool that converts an
    existing CUDA code to use the OpenCL model. Note that the conversion process requires
    human intervention and is not automatic.


    The authors report that the performance of a CUDA application ported to OpenCl
    run about 50 percent slower (Harvey & De Fabritis, 2010). The authors attribute
    the performance reduction to the imaturity of the OpenCL compilers. They conclude
    that OpenCL is a viable platform for developing portable GPU applications but
    also that the more mature CUDA tools continue to provide best performance.


    It is not clear active the development effort is on the Swan project, the most
    recent update was in December 2010. The current version of Swan does not support:


    +   - CUDA C++ templates in kernel code.

    - OpenCL Images/Samplers (analogous to Textures)—texture interpolation done in
    software.

    - Multiple device management in a single process.

    - Compiling kernels for the CPU.

    - CUDA device-emulation mode.


    # MCUDA


    MCUDA is an academic effort by the IMPACT Research Group at the University of
    Illinois. It is available for free download. This project does not appear to be
    actively maintained.


    The paper "MCUDA: An Efficient Implementation of CUDA Kernels for Multi-Core CPUs"
    is interesting reading (Stratton, Stone, & Hwu, 2008). A related paper, "CUDA:
    Enabling Efficient Compilation of CUDA Kernels over FPGAs," discusses translating
    CUDA to FPGAs (Field Programmable Gate Arrays) (Papakostantinouou et al., 2009).


    # ACCESSING CUDA FROM OTHER LANGUAGES


    CUDA can be incorporated into any language that provides a mechanism for calling
    C or C++. To simplify this process, general-purpose interface generators have
    been created that will create most of the boilerplate code automatically. One
    of the most popular interface generators is SWIG. An alternative approach is to
    seamlessly integrate CUDA into the language, which is being investigated by the
    Copperhead Python project.


    ![](img/4468c911ce4bde7a67079b9c80978769_207_0.png)'
