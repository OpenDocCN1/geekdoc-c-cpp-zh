  md: 'to provide a package that will concurrently open multicore processors and a
    single GPU to deliver the combined performance of this hybrid environment. Later
    efforts will combine multiple GPUs with multiple cores.


    The MAGMA team has made the conclusion that dense linear algebra (DLA), “has become
    a better fit for the new GPU architectures, to the point where DLA can run more
    efficiently on GPUs than on current, high-end homogeneous multicore-based systems”
    (Nash, Stanimire, and Dongerra, 2010, p. 1). According to Volkov, the current
    MAGMA BLAS libraries achieve up to 836 GF/s (Volkov, 2010).


    The MAGMA software is freely downloadable from the University of Tennessee Innovative
    Computing Laboratory website.\16


    # phiGEMM Library


    The phiGEMM library is a freely available source library that was written by Ivan
    Girot and Filippo Spiga at ICHEC.\17 It performs matrix-matrix multiplication
    (e.g., GEMM operations) on heterogeneous systems containing multiple GPUs and
    multicore processors.


    The phiGEMM library extends the mapping of Fatica (Fatica, 2009) to support single-precision,
    double-precision, and complex matrices. The LINPACK TOP 500 benchmark HPL benchmark
    uses this mapping for a heterogeneous matrix as one of the cores to evaluate the
    fastest supercomputers in the world.\18 The phiGEMM library is able to deliver
    parallel performance to the LINPACK benchmark using a single GPU and multicore
    processor. As can be seen in Figure 8.8, even greater performance can be achieved
    using two or more GPUs.


    The phiGEMM library transparently manages memory and the asynchronous data transfers
    among all the system (i.e., multiple GPUs and multicore processors). It can process
    matrices that are much larger than the memory capacity of a single GPU by multiplying
    smaller subarrays. Again, the library makes this process transparent to the user.
    Figure 8.9 shows performance using up to four GPUs for a 15 GB matrix. The phiGEMM
    library is being considered for inclusion in the MAGMA library discussed earlier.


