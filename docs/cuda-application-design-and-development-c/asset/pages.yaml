    # FORCE-DIRECTED GRAPHS


    Many graph based problems only provide information about the relationships between
    nodes in a graph. Such problems arise when people send messages to each other,
    talk on the phone, and travel to various locations. Visualizing maps of such information
    can be challenging. Excellent surveys on drawing graphs can be found in Di Battista,
    Eades, Tamassia, and Tollis (1999), and Brandes (2001).


    In the absence of other information, force-directed placement algorithms for graph
    layout based on Hooke''s law for springs have been used to create pleasing informative
    graph layouts as described by Eades'' spring-mass equations (Eades, 1984) and
    later adapted by Fruchterman and Reingold to emulate particle physics in a simulated
    annealing algorithm (Fruchterman & Reingold, 1991).


    Graph placement and layout remains an active area of research, with Freshman and
