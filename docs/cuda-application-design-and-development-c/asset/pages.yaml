    Any program can provide the rgb24 data, but it is assumed in this example that
    ffmpeg will supply the data.


    This server is asynchronous, meaning that it uses the select() call to determine
    whether there is a client waiting to connect or if there is data to be read. If
    select() times out, then control returns to the calling routine, which can perform
    additional work such as animating images on the screen, coloring, or visual effects.
    This process is discussed in more detail in the rest of this section and is illustrated
    in Figure 12.5.


    The variable timeout defines how long select() will spend waiting for data to
    arrive on a socket. The default value is 100 microseconds, which was chosen to
    balance the amount of CPU time consumed by the application program versus the
    number of iterations of the graphic pipeline per frame of real-time data.


    More information on socket programming can be found on the Internet or in excellent
    books as Advanced Programming in the UNIX Environment (Stevens, 2005).


