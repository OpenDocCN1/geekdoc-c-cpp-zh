    This analysis applies to all programs, not just level-1 and level-2 BLAS calculations.
    Getting good performance requires keeping as much data as possible on the GPU.
    After that, attaining high performance requires performing a pipeline of many
    lower arithmetic density computations like the level-3 BLAS operations can help,
