    # 3D Effects


    The sinusoidal dome kernel from Chapter 9 is easily modified to provide 3D effects
    on live data. This kernel stores stores the color information in the color-VBO
    variable. Defining the mesh to be of the same size and shape as the image allows
    the red, green, and blue color information in each pixel of the image to be assigned
    to each vertex. Any changes in the height, specified by vertexVBO, will distort
    the image in 3D space. Figure 12.1 shows a grayscale version of how one frame
    from a live stream is distorted when mapped onto the sinusoidal surface. Images
    produced by this example code are in full color.


