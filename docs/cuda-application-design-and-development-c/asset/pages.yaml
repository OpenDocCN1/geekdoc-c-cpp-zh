  md: 'As shown in Equation 10.1 the ratios between the floating-point performance
    and the bandwidths available to keep the floating-point processors busy can be
    calculated from vendor and hardware information. This ratio makes it easy to see
    that a hardware configuration that moves data over a four-times DDR InfiniBand
    connection can cause an order of magnitude decrease in application performance
    versus the same application that moves across the PCIe bus.


    ```

    Float vs. bandwidth ratio = \frac{flop/s}{bandwidth/s} \quad (10:1)

    ```


    These observations are not new in HPC. The January 2003 Report of the National
    Science Foundation Blue-Ribbon Advisory Panel on Cyberinfrastructure, known as
    the Atkins Report, specifies some desirable metrics that are tied to floating-point
    performance:


    +   - At least 1 byte of memory per flop/s.

    - Memory bandwidth (byte/flop/s) ≥ 1.

    - Internal network aggregate link bandwidth (bytes/flop/s) ≥ 0.2.

    - Internal network bi-section bandwidth (bytes/flop/s) ≥ 0.1.

    - System sustained productive disk I/O bandwidth (byte/flop/s) ≥ 0.001.


    Keep in mind that numerical values presented in the Atkins Report are for desirable
    ratios based on their definition of a “representative workload”. Your application
    may have dramatically different needs. For this reason, it is worthwhile to evaluate
    your applications to see what ratios currently work and what ratios need to be
    improved.


    A good approach is to use benchmarks to evaluate system performance. This is the
    thought behind the Top 500 list that is used to rank the fastest computers in
    the world. The HPC Challenge (HPCC) website provides a more extensive test suite.
    It will also generate a Kiviat diagram (Kiviat diagrams are similar to radar plots
    in Microsoft Excel) to compare systems based on the standard HPC benchmarks. A
    well-balanced system looks symmetrical on these plots because it performs well
    on all tests. High-performance balanced systems visually stand out because they
    occupy the outermost rings. Out-of-balance systems are distorted, as can be seen
    in Figure 10.3.


    The HPC website is a good source for benchmarks and comparative data on different
    computational systems. Be aware that synthetic benchmarks such as those on the
    HPCC website are very good at stressing certain aspects of machine performance,
    but they represent a narrow view into machine


