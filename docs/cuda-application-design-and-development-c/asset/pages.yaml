  md: '# 296 CHAPTER 12: Application Focus on Live Streaming Video


    Many other tasks are not as easy as rules or logic in a CUDA kernel. For example,
    people can easily identify faces in a picture. In these cases, the machine-learning
    techniques presented in Chapters 2 and 3 can “learn” the algorithm for the developer
    using the GPU “supercomputer”. Examples abound in the literature on the use of
    machine learning to segment images using skin-colored pixels under general lighting
    conditions (Kakamunu, Makrogniannis, & Bourakis, 2007), faces (Mitchell, 1997),
    and other objects. Hinton notes that machine-learning techniques like transforming
    autoencoders offer a better alternative than rules-based systems (Hinton, Krizvesky,
    & Want, 2011). With a webcam, readers can collect their own images that can be
    edited and sorted into “yes” and “no” data sets to train a classifier. Both the
    literature and the Internet contain many detailed studies about how to use such
    data to address many problems in vision recognition.


    # The Connectome


    The Harvard Connectome (http://cbs.fas.harvard.edu) is a project that has GPU
    computational ability with some excellent robotic technology in an effort that
    will create 3D wiring diagrams of the brains of various animal models such as
    the cat and mouse. This project exemplifies recognition of the potential inherent
    in GPU technology. Data from this project might prove to be the base for seminal
    and disruptive scientific research. Instead of guessing, vision researchers and
    neurologists will finally have a Galilean first-opportunity to see, study, and
    model cortical networks using extraordinarily detailed data created by the Connectome
    project.


    In a 2009 paper, “The Cat Is Out of the Bag: Neurons, 10^13 Synapses,” researchers
    demonstrated that they were able to effectively model cortical networks at an
    unprecedented scale. In other words, scientists feel they demonstrated sufficient
    computational capability to model the entire cat


    The simulations, which incorporate phenomenological spiking neurons, individual
    learning synapses, axonal delays, and dynamic synaptic channels, exceed the scale
    of the cat cortex, marking the dawn of a new era in the scale of cortical simulations.
    (Anthanarayanan, Esser, Simon, & Modha, 2009, p. 1)


    It is clear that massively parallel computational technology will open the door
    to detailed vision models that will allow neural networks to unravel the mystery
    of how nature processes vision, audio, and potentially memory and thought in the
    brain. GPUs provide sufficient computational capability that even individuals
    and small research organizations have the ability to contribute to these efforts,
    if in no other aspect than to train the people who will make the discoveries.'
