  md: '# Efficiently Using GPU Memory


    The importance of efficiently using GPU memory cannot be overstated. With roughly
    three-order-of-magnitude difference in speed between the fastest on-chip register
    memory and mapped host memory that must traverse the PCIe bus, literate CUDA developers
    must understand the most efficient ways to use memory. Latency hiding through
    ILP or TLP is essential to application performance. Prefetching can keep more
    memory transactions in flight to move data to fast memory and speed even bandwidth-limited
    reduction operations. Irregular data structures are a challenge with current GPU
    technology, but some techniques can preserve performance even with random memory
    accesses. However, finding more and better ways to utilize GPU memory is an area
    of active research as new libraries become available that support irregular data
    structures such as graphs and sparse matrices.


    At the end of this chapter, the reader will have a basic understanding of


    +   - Using prefetch to utilize global memory.

    - Efficient use of registers, shared, and global memory in an ILP-based reduction
    kernel.

    - How to write generic methods that utilize functions.

    - Techniques to speed problems that have irregular and random memory accesses.

    - Generic approaches and libraries for sparse matrices.

    - Graph centrality metrics and codes that can provide 10- to 50-times speedups.

    - Performance reasons to use SoA.

    - Stencils and tiles.'
