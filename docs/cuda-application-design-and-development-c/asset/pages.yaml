    # The simpleGLmain.cpp File


    The simpleGLmain.cpp file opens a window on the screen and sets some basic viewing
    transforms. The call to gluPerspective() places a camera in a three-dimensional
    location from which to view the data generated with


    Three-dimensional rendering occurs in OpenGL when the programmer:


    +   - Specifies objects in 3D space using simple triangles, vertices, and lines.

    - Defines a virtual camera position and viewing angle.


    OpenGL can then identify and update the display pixels as the data and/or position
    changes.


    Rendering requires the following 3D transform:


    +   1. Position and point the camera at the scene (a view transformation).

    2. Arrange the scene composition (a model transform).

    3. Adjust the camera zoom (a projection transform).

    4. Choose the final size (a viewport transform).


    OpenGL view, model, projection, and viewport transforms plus specification of
    the coordinate system require very detailed thinking and explanation. Song Ho
    Ann¹² has an excellent set of tutorials, including visual aids to help understand
    the details of OpenGL transforms and the OpenGL rendering pipeline, the differences
    between pixel and geometry rendering, the OpenGL projection matrix, and much more.
    Numerous excellent sources are also available, including the online version of
    the OpenGL Red Book.


    > ¹² http://songho.ca/opengl.'
