  md: '# BUILDING AND RUNNING THE CODE


    The testLive application is built in the same fashion as the examples in Chapter
    9. Example 12.12, "A Script to Build testLive," is the bash build script under
    Linux:


    ```

    Example 12.12

    #!/bin/bash

    DIR=livestream

    SDK_PATH=~/cuda/4.0

    SDK_LIB0=$SDK_PATH/C/lib

    SDK_LIB1=-L/4.0/cudalIBRARIES/common/lib/lib

    echo $SDK_PATH

    vcc -arch=sm_20 -03 -L$SDK_LIB0 -L$SDK_LIB1 -I$SDK_PATH/common/

    inc simpleGlmain.cpp simpleVBO.cpp $DIR/

    kernelVBO.cu tcpserver.cpp -glut -1GLEW_x86_64 -1GLU -lut1_x86_64

    -o testLive

    ```


    Running the testLive application is straightforward:


    +   1. Start the testLive execution in one window. The visualization window will
    appear on your screen.

    2. In a second window, run the script that will send video data to the port 32000
    on localhost. Example scripts were provided at the beginning of this chapter for
    Unix and for Windows to convert a video file and send it to the testLive example.


    # THE FUTURE


    The three examples in this chapter demonstrate real-time image processing over
    CUDA. However, they are a starting point for further experimentation and research.


    # Machine Learning


    A challenge that remains after image segmentation is identification.


    Simple but valuable forms of identification can be coded as rules. For example,
    a game developer can look for two small flesh-colored blobs (hands) that are near
    a large flesh-colored blob (a face). Height differences between the hands can
    be used to change the angle of a simulated aircraft to make it bank and turn.
    Similarly, the distance between the hands can control action such as zooming into
    or out of an image.'
