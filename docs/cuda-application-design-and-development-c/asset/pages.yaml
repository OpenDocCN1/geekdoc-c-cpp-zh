  md: '# CUDA Memory


    High-performance GPGPU applications require reuse of data inside the SM. The reason
    is that on-board global memory is simply not fast enough to meet the needs of
    all streaming multiprocessors on the GPU. Data transfers from the host and other
    GPGPUs further exacerbate the problem as all DMA (Direct Memory Access) operations
    go through global memory, which consumes additional memory bandwidth. CUDA exposes
    the memory spaces within the SM and provides fine configurable caches to give
    the developer the greatest opportunity for data reuse. Managing the significant
    performance difference between on-board and on-chip memory to attain high-performance
    needs is of paramount important to a CUDA programmer.


    At the end of this chapter, the reader will have a basic understanding of:


    +   - Why memory bandwidth is a key gating factor for application performance.

    - The different CUDA memory types and how CUDA exposes the memory on the SM.

    - The L1 cache and importance for register spilling, global memory accesses, recursion,
    and divide-and-conquer algorithms.

    - Important memory-related profiler measurements.

    - Limitations on hardware memory design.


    # THE CUDA MEMORY HIERARCHY


    The CUDA programming model assumes that all the threads execute on a physically
    separate device from the host running the application. Implicit is the assumption
    that the host and all the devices maintain their own'
