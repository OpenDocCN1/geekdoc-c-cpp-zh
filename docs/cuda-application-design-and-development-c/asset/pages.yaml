  md: '# First Programs and How to Think in CUDA


    The purpose of this chapter is to introduce the reader to CUDA (the parallel computing
    architecture developed by NVIDIA) and differentiate CUDA from programming conventional
    single and multicore processors. Example programs and instructions will show the
    reader how to compile and run programs as well as how to adapt them to their own
    purposes. The CUDA Thrust and runtime APIs (Application Programming Interface)
    will be used and discussed. Three rules of GPU programming will be introduced
    and as Amdahl''s law, the distinction between data-parallel and task-parallel
    programming. Some basic GPU debugging tools will be introduced, but for the most
    part NVIDIA has made debugging code identical to debugging any other C or C++
    application. Where appropriate, references to introductory materials will be provided
    to help novice readers. At the end of this chapter, the reader will be able to
    write and debug simultaneously parallel programs that concurrently utilize both
    a GPU and the host processor(s) within a single application that can handle a
    massive threads of execution.


