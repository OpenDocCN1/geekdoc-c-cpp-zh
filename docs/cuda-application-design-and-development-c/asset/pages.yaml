  md: '# CHAPTER 4


    # # The CUDA Execution Model


    The heart of CUDA performance and scalability lies in the execution model and
    the simple partitioning of a computation into fixed sized blocks of threads in
    the execution configuration. CUDA was created to map naturally the parallelism
    within an application to the massive parallelism of the GPGPU hardware. From the
    high-level language expression of the kernel to the replication of the lowest-level
    hardware units, on-board GPU scalability is preserved while massive common parallel
    programming pitfalls are avoided. The result is massive thread scalability and
    high application performance across GPGPU hardware generation. Meanwhile, the
    CUDA toolkit provides the programmer with those tools needed to exploit parallelism
    at both the thread level and the instruction level within the processing cores.
    Even the first CUDA program presented in Chapter 1 has the potential to run million
    concurrent hardware threads of execution on some future generation of GPU. Meanwhile,
    the functor in Chapter 2 demonstrated high performance across multiple types and
    generations of GPUs.


    At the end of this chapter, the reader will have a basic understanding of:


    +   - How CUDA expresses massive parallelism without imposing scaling limitations.

    - The meaning and importance of a warp and half-warp.

    - Scheduling, warp divergence, and why GPUs are considered a SIMT architecture.

    - How to use both TLP and ILP in a CUDA program.

    - The advantages and disadvantages of TLP and ILP for arithmetic and memory transactions.

    - The impact of warp divergence and general rules on how to avoid it.

    - The application of Little''s law to streaming multiprocessors.

    - The nvcc compiler, SM related command-line options, and cuobidump.

    - Those profiler measurements relevant to occupancy, TLP, ILP, and the SM.'
