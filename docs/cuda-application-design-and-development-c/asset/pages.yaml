    The result when using two integers per CPU illustrates a very important characteristic
    of mapped memory: it allows multiple devices to correctly update adjacent, nonoverlapping
    locations in memory! This makes mapped memory a very valuable tool, as programmers
    need to ensure only that their codes write to nonoverlapping addresses in memory.
    Of course, concurrent writes to the same memory location are undefined. Also,
    writes will become visible across devices only after synchronization.


    # How Mapped Memory Works


    All CUDA threads operate in a virtual address space. This means that every address
    generated by a CUDA kernel is translated by the MMU (Memory Management Unit) to
    a physical address that is used by the hardware to actually read data from the
    physical memory. Virtual memory makes life simple for application programmers,
    as they can use a single virtual address to correctly access data within a kernel
    or across devices – even when that data resides at a different physical address
    on each device.


    When presented with a virtual address, the MMU consults an internal cache (called
    a TLB or Translation Buffer) to find the correct value needed to translate the
    virtual address into a physical address. The MMU views memory in terms of fixed-size
    blocks of memory called pages. If the MMU does not find the page offset for a
    given virtual address, it will load the correct offset into the TLB from a data
    structure in physical memory called a page table. No address translation is required
    for page table access by the MMU. Once the MMU has the correct offset in the TLB,
    the address translation completes, which lets the application memory transaction
    proceed at the correct location in physical memory.


    Microbenchmarks indicate that the size of a page of memory in a GPU can vary according
    to the hardware and the CUDA driver. Generally, 4 KB is the accepted size of a
    GPU page, but 64 KB pages have also been observed (Wong, Papadopoulou, Sadooghi-Alvandi,
    & Moshovsky, 2010). The lesson learned is that the page size can vary across device
    drivers.'
