    ```

    nvcc -02 -o monte_carlo monte_carlo.cu -Xcompiler -fopenmp \

    -DTHRUST_DEVICE_BACKEND=THRUST_DEVICE_BACKEND_OMP -lcudart -lgomp

    ```'
