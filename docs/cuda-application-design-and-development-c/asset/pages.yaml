    # ILP: HIGHER PERFORMANCE AT LOWER OCCUPANCY


    High occupancy does not necessarily translate into the fastest application performance.
    Instruction-level parallelism (ILP) can be equally effective in hiding arithmetic
    latency by keeping the SIMD cores busy with fewer threads that consume fewer resources
    and introduce less overhead.


    The reasoning for ILP is simple and powerful: using fewer threads means that more
    registers can be used per thread. Registers are a precious resource, as they are
    the only memory fast enough to attain peak GPU performance. The larger the bandwidth
    gap between the register store and memory, the more data that must come from registers
    to achieve high performance.


    Sometimes having a few more registers per thread can prevent register spilling
    and preserve high performance. Although necessary, register spilling relates the
    programmer''s expectation of high performance from register memory and can cause
    catastrophic performance decreases. Utilizing fewer threads use shared memory
    by reducing the number of shared memory accesses and by allowing data reuse within
    a thread (Volkov, 2010). A minor benefit includes a reduction in the work that
    the GPU must perform per thread.


    The following loop, for example, would consume 2048 bytes of register storage
    and require the loop counter, i, be incremented 512 times in a block with 512
    threads. A thread block containing only 64 threads would require only 256 bytes
    of register storage and reduce the number of integer increment in place operations
    by a factor of 4. See Example 4.4, "Simple for Loop to Demonstrate ILP Benefits:


    # Example 4.4


    ```

    for(int i=0; i<n; i++)

