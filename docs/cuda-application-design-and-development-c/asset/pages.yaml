    # MACHINE LEARNING AND NEURAL NETWORKS


    Neural Networks (ANN) is a machine-learning technique that infers a function (a
    form of parameterized model) based on observed data. Supervised learning occurs
    when a teacher associates known values that reflect a desired or outcome with
    each training example. Unsupervised learning occurs when a metric of goodness
    or fit is provided.


    Inferred by neural networks have predictive power, which can correctly forecast
    future values in a time series, respond and adapt to unforeseen stimuli; and perform
    classification tasks. A famous example is netlett, which trained a neural network
    to read English text outside (Sejnowski & Rosenberg, 1987). The network data is
    still available for download.


    Training artificial networks can be expressed as an optimization problem that
    seeks to determine the network parameters (e.g. the internal network weights and
    biases) that will minimize the error on an initial dataset. The fitting of training
    process is computationally expensive, as it requires calling an objective function
    with sets of parameters that are evaluated over every example in the training
    data. The runtime is O(N_param × N_data) for each objective evaluation. In most
    cases, the number of parameters is small relative to the size of the training
    data, which means the overall runtime is dominated by the size of the data.


    During the training process, the neural net is attempting to fit a multi-dimensional
    surface to the training data (Lapedes & Faber, 1987). Unfortunately, the curse
    of dimensionality tells us that the volume of space that must be searched, sampled,
    and modeled increases exponentially with the dimension of the data. For example,
    uniformly sampling a 1D unit between 0 and 1 at steps of 001 requires 100 samples,
    and a 10-dimensional hypercube would require (100)¹⁰ or 10²⁰ samples. Even with
    sparse sampling,


