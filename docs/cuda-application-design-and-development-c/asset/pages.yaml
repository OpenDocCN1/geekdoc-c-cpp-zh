    # Tip for Concurrent Kernel Execution on the Same GPU


    The linear speedup according to the number of kernels exhibited by asyncGPU.cu
    demonstrates that concurrent kernel execution can be an important tool to increase
    performance when running small computebound kernels. It is important to consider
    how the multiple kernels will interact with global memory. For example, a single
    kernel will access global memory in a cache friendly high-performance coalesced
    manner. Running multiple kernels may change the location of reference, increase
    L2 cache misses, and reduce or eliminate the effectiveness of this cache. Concurrently
    running different kernels can exacerbate this problem and introduce additional
    problems with bank conflicts and memory partitioning camping, as discussed in
    Chapter 5. As a result, performance will degrade. Although the overall speedup
    when running multiple kernels will likely be better than running each kernel sequentially,
    a linear speedup may not always be possible.


    The following guidelines should improve the potential for concurrent kernel execution
    on devices that support concurrent kernel execution:


    +   - All independent operations should be issued before dependent operations.

    - Synchronization of any kind should be delayed as long as possible.


    # Atomic Operations for Implicitly Concurrent Kernels


    CUDA is designed to let each SM run independently of each other. In this way,
    the CUDA model does not impose any scalability limit on the number of devices.
    The gating factor for kernel scalability in a kernel is the number of thread blocks.
    With concurrent kernel execution, the scalability of an application is limited
    by the number of blocks of all the independent tasks that can run at one time.


    The functionReduce() example from Chapter 6 demonstrates that the CUDA model does
    introduce some complexity for reduction types of operations. By definition, a
    reduction operation must provide a single value that is based on computations
    performed by all the SM on the GPU, which requires that some form of synchronization
    happen between computational units. This is antithetical to the CUDA programming
    model. The simple solution used by the functionReduce() example was to move the
    data to the host, where the final step of the reduction is performed.'
