    # SUMMARY


    CUDA makes various hardware spaces available to the programmer. It is essential
    that the CUDA programmer utilize the available memory spaces to best advantage
    given the three orders of magnitude difference in bandwidth (from 8 TB/s register
    bandwidth to 8 GB/s for PCIe-limited mapped-memory) between the various CUDA memory
    types. Failure to do so can result in poor performance.


    CUDA provides a number of excellent measured and derived profile information to
    track down memory bottlenecks. Understanding the characteristics of each memory
    type is a prerequisite to adept CUDA programming. Automated analysis by the CUDA
    profilers can point the developer in the right direction. Knowing how to read
    the profiler output is a core skill in creating high-performance applications.
    Otherwise, finding application bottlenecks becomes a matter of guesswork. Similarly,
    the CUDA memory checker can help find errors using memory.'
