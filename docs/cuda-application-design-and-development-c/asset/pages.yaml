    Thrust was used to make this code concise and easy to read. The device_pointer_cast()
    method was used to correctly cast the mapped host memory for the thrust sequence().


    The highlighted call to cudaDeviceSynchronize() ensures that the mapped data is
    synchronized between the host and devices prior to checking the'
