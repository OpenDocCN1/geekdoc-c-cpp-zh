  md: '# THE MESSAGE PASSING INTERFACE (MPI)


    MPI is a standard library based on the consensus of the MPI Forum (http://www.mpi-forum.org/),
    which has more than 40 participating organizations, including vendors, researchers,
    software library developers, and users. The goal of the forum is to establish
    a portable, efficient, and flexible standard that will be widely used in a variety
    of languages. Wide adoption has made MPI "industry standard" even though it is
    not an IEEE (Institute of Electrical and Electronics Engineers) or ISO (International
    Organization for Standardization) standard. It is safe to assume that some version
    of MPI will be available on most distributed computing platforms regardless of
    vendor or operating system.


    Reasons for using MPI:


    +   - **Standardization**: MPI is considered a standard. It is supported on virtually
    all HPC platforms.


    +   - **Portability**: MPI library calls will not need to be changed when running
    on platforms that support a version of MPI that is compliant with the standard.


    +   - **Performance**: Vendor implementations can exploit native hardware features
    to optimize performance. One example is the optimized data transport provided
    by GPUIDirect.


    +   - **Availability**: A variety of implementations are available from both vendors
    and public domain software.


    # The MPI Programming Model


    MPI is an API that was originally designed to support distributed computing for
    C and FORTRAN applications. It was first implemented in 1992, with the first standard
    appearing in 1994. Since then, language bindings and wrappers have been created
    for most application languages, including Perl, Python, Ruby, and Java. C bindings
    use the format MPI_XXX in which "XXXX" specifies the operation. Methods MPI_Send()
    and MPI_Recv() are two examples that use this binding.


    Just as with a CUDA execution configuration, MPI defines a parallel topology to
    connect groups of processes in an MPI session. It is important to note with MPI
    the session size is fixed for the lifetime of the application. This differs from
    MapReduce (discussed in this chapter), which is a popular framework for cloud
    computing that is designed for fault-tolerant distributed computing. All parallelism
    is explicit with MPI, which means that the programmer is responsible for correctly
    identifying parallelism and implementing parallel algorithms with the MPI'
