    # Mutual information


    The concept of mutual information has its origins in information theory and is
    widely used in many disciplines. For example, mutual information can be used to
    determine sites in the AIDS virus that are related for structural or functional
    reasons (Korber, Farber, Wolpert, & Lapedes, 1993). In particular, the paper by
    Korber et al. demonstrates how bootstrapping can be used to determine a confidence
    that high-pair mutual information did not arise by chance. (Bootstrapping in statistics
    can be implemented by various techniques, including by random sampling with replacement
    from the original data set.) Mutual information can also be used to improve prediction
    in machine-learning (Farber, Lapedes, & Srotkin, 1992). There are numerous texts
    on this topic (Cover & Thomas, 2006; Stanislaw, Carbonell, & Mitchell, 1985) and
    many sources of information on the Internet.


    Pairwise mutual information provides a measure of the amount of information between
    two random variables. Generally, this measure is expressed in number of bits of
    information. Mutual information is defined in terms of entropies involving the
