    # OPENGL


    OpenGL is one of the most common programming interfaces used in visual

    applications from games to HPC (high-performance computing). OpenGL is

    standards-based and gives developers the ability to create graphics and spe-

    cial effects that appear nearly identical on any operating system

    OpenGL-compliant hardware, making it possible for developers of 3D

    games and programs to port their software to multiple platforms.


    OpenGL is controlled by an Architectural Review Board (ARB) composed of

    members from many institutions, including NVIDIA, Microsoft, AMD,

    hHP, and kernels. The intention of the board is to:


    +   - Keep the API stable.

    - Ensure the standard evolves to reflect new hardware capabilities.

    - Allow for platform-specific features through extensions.


    There are two clear benefits of the separation (yet efficient interoper-

    ability) between CUDA and OpenGL:


    +   - From a programming view: When not mapped into the CUDA memory

    space, OpenGL gurus are free to exploit existing legacy code bases, their

    expertise, and the full power of all the tools available to them, as

    GLSL (the OpenGL Shading Language) and C. CUDA programmers can

    demonstrate their computational prowess when the buffer is mapped

    to the CUDA memory space.


    +   - From an investment view: The mapped approach allows efficient

    ploitation of existing legacy OpenGL software inventions. Essentially,

    CUDA code can be gradually added into existing legacy libraries and

    applications just by mapping the buffer into the CUDA memory space.

    This feature allows organizations to test CUDA code without significant

    risk and then enjoy the benefits of CUDA once they are confident of the

    performance and productivity rewards delivered by this programming

    model.


    # GLUT


    The OpenGL Utility Toolkit (GLUT) is a programming interface for writing

    window system-independent OpenGL programs. Applications that utilize

    GLUT can be compiled on many platforms. NVIDIA uses GLUT in the

    CUDA SDK examples.


