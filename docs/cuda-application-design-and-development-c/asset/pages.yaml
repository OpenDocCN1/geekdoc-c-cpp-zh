  md: '# XOR: An Important Nonlinear Machine-Learning Problem


    smooth high-dimensional surfaces can require many data points. Many interesting
    phenomena require fitting convoluted, bumpy, high-dimensional surfaces, which
    can dramatically increase the amount of training data needed to fit a model that
    can approximate the multidimensional surface with acceptable accuracy.


    Expensive objective functions tend to dominate the runtime when using popular
    optimization techniques like Nelder-Mead, Levenberg-Marquardt, Powell''s method,
    conjugate gradient, and others. Under these circumstances, it is best to focus
    on reducing the runtime of the objective function. Mapping the problem efficiently
    to a GPUCluster with hundreds of parallel threads can potentially reduce the runtime
    by two orders of magnitude over a single-threaded system, as shown by Equation
    2.2, "Parallel runtime of an ANN-based objective function." Conversely, a quad-core
    processor can reduce the runtime only by a factor of 4 at worst per iteration.


    ```

    $O(\frac{N_{data} * N_{param}}{N_{processors}}) (2.2)$

    ```


    The examples in this chapter demonstrate that CUDA can reduce the runtime by 50
    to 100 times over an implementation that runs on a conventional multicore processor
    when taking into account all of the GPU communications overhead. Although this
    is a known result for parallel systems in general (Farber, 1992: Thearing, 1995),
    it is amazing that this level of performance can be achieved even using a gaming
    GPU.


    # XOR: AN IMPORTANT NONLINEAR MACHINE-LEARNING PROBLEM


    Andreasig noted in Introduction to the Theory of Neural Computation:


    To contrast "learning" without generalization from learning with generalization,
    let us consider the widely and widely celebrated fact that neural networks can
    learn to implement exclusive OR (XOR). But what kind of learning is this? When
    four out of four cases are specified, no generalization exists! Learning a table
    is nothing but rote memorization: learning XOR is as interesting as memorizing
    the phone book. More interesting and more realistic—real-world problems, such
    as the prediction of financial data. In forecasting, nobody cares how well a model
    fits the training data—only the quality of future predictions counts, i.e., the
    performance on novel data or the generalization ability. Learning extracts regularities
    from training examples that transfer to new examples (Hertz, Krogh, & Palmer,
    1991, p. 5)


