  md: '# CHAPTER 4: The CUDA Execution Model


    On each clock tick, the SM warp schedulers decide which warp to execute next,
    choosing from those not waiting for:


    +   - Data to come from device memory.

    - Completion of earlier instances.


    As illustrated in Figure 4.2, each GF100 SM has 32 SIMD (Single Instruction Multiple
    Data) cores. The use of a SIMD execution model means that the scheduler on the
    SM dictates that all the cores will run the same instruction. Each core, however,
    may use different data. Basing the design of the streaming multiprocessors on
    a SIMD execution model is a beautiful example of "just enough and no more" in
    processor design because SIMD cores require less space and consume less power
    than non-SIMD designs. These benefits are multiplied by the replication of SM
    inside the GPU.


    GPU hardware architects have been able to capitalize on SIMD savings by devoting
    power and space by adding ALU (Arithmetic and Logic Units), floating-point, and
    Special Units for transcendental functions. As a result, GPGPU devices have a
    high flip per watt ratio compared to conventional processors (Vuduc, 2010) as
    seen in Table 4.1.


    To this point, we have correctly spoken about programming a GPU in terms of individual
    threads. From a performance perspective, it is necessary to start thinking in
    terms of SIMD threads inside a warp or a half-warp on GF100 SM with dual schedulers.
    A warp is a block of 32 SIMD threads on most GPUs. Just like a thread block for
    the GigaThread scheduler, a warp is the basic unit for scheduling within an SM.


    Each warp is by definition block of SIMD threads, the scheduler does not need
    to check for dependencies within the instruction stream. Figure 4.2 shows that
    each GF100 SM has two warps and two instruction dispatch units, which allows two
    warps to be issued and executed concurrently. Using this dual-issue model, GF100


