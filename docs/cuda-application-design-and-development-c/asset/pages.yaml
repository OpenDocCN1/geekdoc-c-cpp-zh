    +   - CUDA programs utilize kernels, which are subroutines called from the host
    that execute on the CUDA device. It is important to note that kernels are not
    functions, they cannot return a value. Most applications that perform well on
    GPGPUs spend most of their time in one or a few computational routines. Turning
    these routines into CUDA kernels is a wonderful way to accelerate the application
    and utilize the power of a GPGPU. A kernel is defined with the global declaration
    specifier, which tells the compiler the kernel is callable by the host processor.


    +   - Kernel calls are asynchronous, meaning that the host queues a kernel for
