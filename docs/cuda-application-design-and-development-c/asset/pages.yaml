    MPI_Send() and MPI_Recv() are commonly used blocking methods for messaging between
    two MPI processes. Meaning that the process will wait until the complete message
    has been correctly sent and the receiving process will block while waiting to
    correctly receive the complete message. More complex communications methods can
    be built upon these two methods.


    Message size is determined by the count of an MPI data type and the type of the
    data. For portability, MPI defines the elementary data types. Table 10.1 lists
    data types required by the standard.


    # HOW MPI COMMUNICATES


    MPI can utilize optimized data paths to send and receive messages depending on
    the network communications hardware. For example, MPI applications running within
    a computational node can communicate via fast shared memory rather than sending
    data over a physical network interface card (NIC). Minimizing data movement is
    an overarching goal for MPI vendors and those who develop the libraries because
    moving data simply wastes precious time and degrades MPI performance.'
