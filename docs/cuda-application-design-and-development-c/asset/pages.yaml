    # Mapped Memory


    Simplicity is the advantage of mapping memory among the devices in the system:


    +   - There is no need to partition data. All devices see the complete memory
    image.

    - There is no need to allocate space in device memory or to manually copy data.
    All data transfers are implicitly performed by the kernel as needed.

    - There is no need to use streams to overlap data transfers with kernel execution.
    All data transfers originate from the kernel and are asynchronous.


    Application performance is the cost associated with this simplicity. Using mapped
    memory does mean that the programmer gives control over the data movement between
    the host and devices. From the forums and experiments, it is not unusual for kernel
    performance to drop when using mapped memory because there are no guarantees when
    or how often data will need to be transferred across the PCIe bus. Other considerations
    to using mapped memory include:


    +   - If the contents of the mapped memory are modified, the application must
    synchronize memory accesses using streams or events to avoid any potential read-after-write,
    write-read-after, or write-after write hazards.

    - The host memory needs to be page aligned. The simplest and most portable way
    to enforce this is using cudaMallocHost() when allocating mapped host memory.


    The simplicity of using mapped memory is illustrated by the example (Example 7.16),
    which fills a mapped memory vector using one or more GPUs in the system. The highlighted
