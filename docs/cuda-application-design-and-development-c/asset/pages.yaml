    # An x86 core as an SM


    In CUDA-x86, thread blocks are efficiently mapped to the processor cores. Thread-level
    parallelism is mapped to the SSE (Streaming SIMD Extensions) or AVX SIMD units,
    as shown in Figure 8.2.


    CUDA programmers should note:


    +   - The size of a warp will be different from the expected 32 threads warp for
    a GPU. For x86 computing, a warp might be the size of the SIMD units on the x86
    core (either four or eight) or one thread per warp when SIMD execution is not
    utilized.

    - In many cases, the PGI CUDA compiler will remove explicit synchronization of
    the thread processors when the compiler can determine that it is safe to split
    loops where the synchronization calls occur.


