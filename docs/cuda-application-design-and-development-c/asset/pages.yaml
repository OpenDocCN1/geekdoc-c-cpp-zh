    performance. A colleague refers to these as "honest flops," as they reflect the
    performance a real production would deliver.


    The effective rate is defined for the PCA mapping in Equation 10.2, "Definition
    of effective rate for the PCA parallel mapping":


    ```

    Effective rate = \frac{TotalOpCount}{T_{broadcast} + T_{objective} + T_{reduce}}
    (10.2)

    ```


    where:


    +   * TotalOpCount is the number of floating-point operations performed in a call
    to an objective function.

    * Broadcast is the time required to broadcast the parameters to all the slave
    processes.

    * Objective is the time consumed in calculating the partial results across all
    the clients. This is generally the time taken by the slowest client.

    * Reduce is the time required by the reduction of the partial results.


    # CLOUD COMPUTING


    Cloud computing is an infrastructure paradigm that moves computation to the Web
    in the form of a web-based service. The idea is simplicity itself: institutions
    contract with Internet vendors for computational resources instead of providing
    those resources themselves through the purchase and maintenance of computational
    clusters and supercomputer hardware. As expected any utilized for high performance
    and scientific computing—performance limitations within the platform define which
    computational problems will run well.


    Unlike MPI frameworks, cloud computing requires that application be tolerant of
    both failures and high latency in point-to-point communications. Still, MPI is
    a prevalent MPI that most cloud computing services provide and support it. Be
    aware that bandwidth and latency issues may cause poor performance when running
    MPI on a cloud computing infrastructure.'
