    in their applications. NVIDIA has provided the necessary tools that UNIX, Windows,
    and Mac OS developers can examine, experiment with, and alter the instruction
    mix in their kernels to best exploit ILP and capture TLP with controlled register
    usage. Exploiting these tools can make the difference between good and great performance.
    Similarly, understanding and avoiding warp divergence can make all the difference
