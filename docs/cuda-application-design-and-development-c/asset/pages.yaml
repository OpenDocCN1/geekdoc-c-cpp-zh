  md: 'In the absolute worst case, all the warps and SM will issue memory transactions
    that fall on a single memory partition in global memory, which will decrease the
    available memory bandwidth to that of a single memory subsystem.


    The L2 cache in compute 2.0 and later devices provides the best single solution
    to accelerate algorithms that perform irregular memory accesses. Though not a
    general solution, the L2 cache will transparently speed most applications just
    because it provides a high-speed region of memory where the threads on each SM
    can request small, irregular memory accesses.


    Localizing memory accesses can make a tremendous difference in performance because
    it allows the L2 cache to work more effectively on behalf of the application threads.
    Sorting the index array is a reasonable method to use for random data assuming
    some reordering of the indices is allowed. Course, when the programmer works,
    much better performance can be achieved to exploit the locality of reference within
    the algorithm.


    The following program, testGather.cu, implements Example 6.16 in a CUDA test code.
    The thrust API was used to conveniently transfer data to and from the host as
    well as fill and sort the index array. The first part of the program—Example6.19,
    "Part 1 of testGather.cu"—defines a gather functor:


    ```

    Example 6.19

    #include <omp.h>

    #include <iostream>

    using namespace std;


    #include <thrust/host_vector.h>

    #include <thrust/device_vector.h>

    #include <thrust/sort.h>

    #include <thrust/sequence.h>

    #include <thrust/functional.h>


    struct gather_functor {

    const int* index;

    const int* data;


    gather_functor(int* _data, int* _index) : data(_data), index(_index) {

    __host__ __device_

    int operator()(int i) {

    return data[index[i]];

    }

    };

    ```'
