  md: '# L2 Cache


    many applications will suddenly run faster on compute 2.0 devices because the
    L2 cache. Two reasons are:


    +   - Without requiring any intervention by the CUDA programmer, the L2 cache
    will data in an LRU fashion that allows many CUDA kernels avoid global memory
    bottlenecks.


    +   - The L2 cache greatly speeds irregular access patterns that would otherwise
    exceed extremely poor GPU performance. For many algorithms, this characteristic
    will determine whether an application can be on compute 1.x hardware.


    Fermi GPUs provide a 768 KB L2 cache that is guaranteed to present a coherent
    view to all SMs. In other words, any thread on the GPU can read that particular
    memory address and receive, updated value. Of course, atomic operations must be
    used to guarantee the store (or write) transactions completes before other threads
    are allowed access.


    Previous GPGPU architectures had challenges with this very common read/update
    operation because two separate data paths were utilized—specifically, the read-only
    texture load path and the write-only pixel data path. To ensure correctness, older
    GPU architectures required that all participating caches along the path read be
    potentially invalidated and flushed after any thread modified the value of an
    in-cache memory location. The Fermi architecture eliminated this bottleneck with
    the unified L2 cache along with the need for the texture and Raster Output (ROP)
    caches in earlier-generation GPUs.


    All data loads and stores through the L2 cache including CPU/GPU memory, emphasized
    to stress that data transfers might unexpectedly affect cache hits and application
    performance. Similarly, asynchronous kernel execution can pollute the cache.


    # Relevant computeProfiler Values for the L2 Cache


    | Table 5.2 | |

    |---||

    | L2 cache texture memory read throughput (GB/s) | This value gives the throughput
    achieved while reading data from L2 cache when a request for data residing in
    texture memory is. This is calculated as (L2 read requests * 32)/(gpu time * 1000)
    |

    | L2 global memory read throughput (GB/s) | This value gives the throughput achieved
    while reading data from L2 cache when a request for data residing in global memory
    is made by L1. This is calculated as (L2 read requests * 32) |

    | L2 cache global memory write throughput (GB/s) | This value gives the throughput
    achieved while writing data to L2 cache when a request to store data in global
    memory is made by L1. This is calculated as (L2 write requests * 32)/(gpu time
    * 1000) |


    (continued)'
