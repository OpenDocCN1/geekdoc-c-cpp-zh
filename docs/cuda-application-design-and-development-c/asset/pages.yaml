  md: '# SWIG


    SWIG (Simplified Wrapper and Interface Generator) is a software development tool
    that connects programs written in C and C++—including CUDA C/C++ applications—with
    a variety of high-level programming languages. SWIG is actively supported and
    widely used. It can be freely downloaded from the SWIG website.^9


    As of the current 2.0.4 release, SWIG generates interfaces for the following languages:


    +   - AllegroCL

    - C# – Mono

    - C# – MS.NET

    - CFFI

    - CHICKEN

    - CLISP

    - D

    - Go language

    - Guile

    - Java

    - Lua

    - MzScheme/Racket

    - Ocaml

    - Octave

    - Perl

    - PHP

    - Python

    - R

    - Tcl/Tk


    Part 9 of my *Doctor Dobb''s Journal* "Supercomputing for the Masses" tutorial
    series^10 provides a complete working example that uses SWIG to interface a CUDA
    matrix operation with Python. This example can interface with other languages
    as well (Farber, 2008).


    # Copperhead


    Copperhead is an early-stage research project to bring data parallelism to the
    Python language. It defines a small, data-parallel subset of Python that is dynamically
    compiled to run on parallel platforms. Right now, NVIDIA GPUs are the only parallel
    backend.


    > ^9 http://swig.org.

    ^10 http://drdobobs.com/high-performance-computing/211800683.'
