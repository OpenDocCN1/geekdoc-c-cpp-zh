    # GPU MEMORY


    CUDA-enabled GPUs have both on-chip and on-board memory. The fastest and most
    stable is the highly desirable on-chip SM memory. These are limited memory stores
    measured in kilobytes (KB) of storage. The on-board global memory is a shared
    memory system accessible by all the SM across the GPU. It is measured in gigabytes
    (GB) of memory, which is by far the largest, most commonly used, and slowest memory
    store on the GPU.


    Benchmarks have shown the significant bandwidth differences between on-chip and
    off-chip memory systems (see Table 5.1). Only registers internal to the SM have
    the bandwidth needed to keep the SM fully loaded (without stalls) to achieve peak
    performance. Although the bandwidth of shared memory can greatly accelerate applications,
    it is still too slow to achieve peak performance (Volkov, 2010).


    Managing the significant performance difference between on-board and on-chip memory
    is the primary concern of a CUDA programmer. To put the performance implications
    in perspective, consider how memory bandwidth limits the performance of the following
    simple calculation when it resides in global memory, in Example 5.1, "A Simple
    Memory-Bandwidth-Limited Calculation":


    # Example 5.1


    ```

    for(i=0; i<N; i++) c[i]=a[i]*b[i];

    ```


    Each floating-point requires two memory reads and a write. Assuming that single-precision
    (32-bit or 4-byte) floating-point values are being used, a teraflop (trillion
    floating-point operations per second) GPU would require 12 terabytes per second
    (TB/s) of memory bandwidth for this calculation to run at full speed. Said another
    way, a GPU with 177 GB/s of memory bandwidth could deliver 14 Gflop, or approximately
    1.4 percent of the performance of a teraflop GPU. When the extra precision of
    64-bit (8-byte) floating-point arithmetic is required, the reader can halve the
    effective computational rate.


    > Data reuse is important on convolutional processors as well. The impact tends
    to be less dramatic when an application becomes memory-bound because conventional
    systems have fewer processing cores'
