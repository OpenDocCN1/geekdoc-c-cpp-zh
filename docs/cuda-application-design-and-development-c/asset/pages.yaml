    # Warp Divergence


    SIMD execution has drawbacks, but it affects only code running inside an SM. GPGPUs
    are not true SIMD machines because they are composed of many SMs, of which may
    be running one or more different instructions. For this reason, GPUPU devices
    are classified as SIMT (Single Instruction Multiple Thread) devices.


    Programmers must be aware that conditionals (if statements) can greatly decrease
    performance inside an SM, as each branch of each conditional must be evaluated.
    Long code paths in a conditional can cause a $2^N$ slowdown for $N$ nested loops.
    A maximum 32-time slowdown can occur when each thread in a warp executes a separate
    condition.


    Fermi architecture utilize predication to run short conditional segments efficiently
    with no branch instruction overhead. Predication removes branches from the code
    by executing both the *if* and *else* parts of a branch in parallel, which avoids
    the problem of mispredicted branches and warp divergence.


    Section 6.2 of “The CUDA C Best Practices Guide” notes:


    +   * When using branch predication, none of the instructions whose execution
    depends on the controlling condition is skipped. Instead, each instruction is
    associated with a per-thread condition code or predicate that is set to true or
    false according to the controlling. Although each of these instructions is scheduled
    for execution, the instructions with a true predicate are actually executed. Instructions
    with a false predicate do not write results, and they also do not evaluate addresses
    or read operands. (NVIDIA, CUDA C Best Practices Guide, May 2011, p. 56)


    The code in Example 4.1, “A Short Code Snippet Containing a Conditional,” contains
    a conditional that would run on all threads computing the logical predicate and
    two predicated instructions as shown in Example 4.2:


    # Example 4.1


    ```

    if (x<0.0) z = x-2.0;

    else z = sqrt(x);

    ```'
