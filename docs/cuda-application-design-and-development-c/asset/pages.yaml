    # Constant Memory


    For compute 1.x devices, constant memory is an excellent way to store and broadcast
    read-only data to all the threads on the GPU. The constant cache is limited to
    64 KB. It can broadcast 32-bits per warp per two multiprocessor and should be
    used when all the threads in a warp read the same address. Otherwise, the accesses
    will serialize on compute 1.x'
