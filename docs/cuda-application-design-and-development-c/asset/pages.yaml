  md: '# CUDA in a Cloud and Cluster Environments


    Distributed GPUs are powering the fastest supercomputers as CUDA scales to thousands
    of nodes using MPI, the de facto standard for distributed computing. NVIDIA''s
    GPUDirect has accelerated the key operations in MPI, send (MPI_Send) and receive
    (MPI_Recv), for communication over the network instead of the PCIe bus. As the
    name implies, GPUDirect moves data between GPUs without involving the processor
    on any of the host systems. This chapter focuses on the use of MPI and GPUDirect
    so that CUDA programmers can incorporate these APIs for cloud computing and computational
    clusters. The performance benefits of distributed GPU computing are very real
    but dependent on the bandwidth and latency characteristics of the distributed
    communications infrastructure. For example, the Chinese Nebulae supercomputer
    can deliver a 2.98 Pflops (or 2,980 trillion floating point per second) to run
    some of the most intensive applications ever envisioned. Meanwhile, commodity
    GPU clusters and cloud computing provide turn-key resources for users and organizations.
    To run effectively in a distributed environment, CUDA developers must develop
    applications and use algorithms that can scale given the limitations of the communications
    network. In particular, network bandwidth and latency are of paramount importance.


    At the end of this chapter, the reader will have a basic understanding of:


    +   - The Message Passing Interface (MPI).

    - NVIDIA''s GPUDirect 2.0 technology.

    - How balance ratios act as an indicator of application performance on new platforms.

    - The importance of latency and bandwidth to distributed and cloud computing.

    - Strong scaling.'
