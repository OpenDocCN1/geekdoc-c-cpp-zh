    Implicit transfers with mapped, pinned memory. This interface keeps a region of
    host memory synchronized with a region of GPU memory and does not require programmer
    intervention. For example, an application can load a data set on the host, map
    the memory to the GPU, and then use the data on the GPU as if it had been explicitly
    initialized with a copy operation. The use of mapped, pinned memory can increase
    the efficiency of a program because the transfers are asynchronous. Some low-power
    GPGPUs utilize host memory to save cost and power. On these devices, using mapped,
    pinned memory results in a zero-copy operation, as the GPU will access the data
