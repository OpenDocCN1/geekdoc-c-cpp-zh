  md: '# TYING DATA TO COMPUTATION


    Tying data to computation is essential to attaining program correctness and performance
    in a distributed multi-GPU environment. CUDA programmers have the following options
    to make data available to kernels running on multiple GPUs:


    +   - Map the memory into the memory space of all the GPUs. In this case, data
    will be transparently transferred between the host and GPUs.

    - Manually allocate and transfer the data.

    - For applications that will run in a distributed MPI (Message Passing Interface)
    environment, space can be allocated on each device and transferred directly to
    the GPU via MPI send and receive calls. This is discussed further in Chapter 10.


    # Manually Partitioning Data


    The most flexible, scalable, and highest-performance method to tie data to computation
    is manually partitioning among devices. With this technique, the programmer can
    control and optimize all aspects of the computation. Unlike mapped memory, the
    programmer assumes the responsibility of ensuring that all data is on the GPU
    when it is needed. multiGPU.cu example (starting with Example 7.4) provided a
    simple demonstration that manually partitioned data.


    Effectively partitioning data across many devices is a hard problem. The decision-making
    process of how to distribute data across devices creates a very deep and detailed
    insight into the computational problem being solved. Most important from a performance
    perspective, this design process highlights how asynchronous data transfers and
    overlapped kernel execution speed performance. The good news is that the technical
    and scientific literature contains numerous examples of excellent parallelization
    schemes that have been created by very bright people. Look to these sources early
    in your design process to see how others have addressed parallelism in problems
    similar to the one to be solved.


    The discussion in Chapter 6 concerning tiles, stencils, and quad-octrees provide
    some good starting points for research. Data-parallel APIs such as Thrust implement
    common parallel design patterns that can be used to simplify and implement many
    high-performance applications. Again, the good news is that these general libraries
    are rapidly expanding and improving.


    For all applications, the three rules of high-performance GPU programming discussed
    in this book should be used as a basic starting point in all your design efforts:'
