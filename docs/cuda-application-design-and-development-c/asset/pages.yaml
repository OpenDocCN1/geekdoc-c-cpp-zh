    # INTRODUCTION TO THE FILES IN THE FRAMEWORK


    Readers should note that care was taken in the design of the software framework
    so that it could be adapted to new applications. For example, this same framework
    was used in chapter twelve to display and modify video streams. To compartmentalize
    operations, the framework was broken into four separate files. Merely by changing
    the CUDA kernel, this example code can be used to render an animated sinusoidal
    surface or an artificial terrain that the user can explore and fly around in.
    The examples are known to compile and run on Linux and Windows.


    For clarity and flexibility, separate 3D vertex and color arrays are used within
    the example code. This helps speed understanding and makes data visualization
    as writing a new code or loading data from disk to alter the 3D vertex array,
    color array, or both. Those readers who choose to create their own CUDA kernels
    should gain a strong sense of how easy and flexible visualization can be with
    a combined CUDA/OpenGL approach.


    The relationship between the four files used in the framework discussed in this
    chapter is illustrated in Figure 9.5. Each of the files is discussed in more detail
    below.


    # The Demo and Perlin Example Kernels


    Two example kernels are provided in this chapter, demo and Perlin. Each kernel
    generates both 3D vertices and colors.'
