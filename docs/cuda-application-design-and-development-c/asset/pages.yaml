    # Using Primitive Restart for 3D Performance


    As mentioned in the introduction to this chapter, the examples utilize an OpenGL
    extension primitive restart to minimize communications across the PCIe bus and
    to speed rendering. Primitive restart gives the programmer the ability to specify
    a data value that is interpreted by the OpenGL state machine as a token indicating
    that the current graphics primitive is complete. The next data is assumed to be
    at the start of another graphics primitive of the same type. Valid primitives
    include GL_TRIANGLE_STRIP, GL_TRIANGLE_FAN, GL_LINE_STRIP, and others.


    Figure 9.1 illustrates this process for glPrimitiveRestartIndexNV() is first called
    to specify the value of TAG to be the primitive restart. The routine glEnableClientState()
    is then called to tell the OpenGL state machine to start using primitive restart.
    The lines are then drawn with glDrawElements().


    The advantages of the primitive restart approach include:


    +   - All controls tokens and data for viewing can be kept and generated on the
    GPU.


