  md: '# REDUCTION


    Reduction operations perform common tasks such as finding the minimum, maximum,
    or sum of a vector. Writing a high-performance reduction for GPU computing is
    surprisingly complex because it requires a detailed understanding of CUDA memory
    spaces and the execution model.


    The thrust API provides a simple interface that hides all the complexity of a
    reduction, making it both flexible and easy to use. Thrust uses a reduction designed
    by Mark Harris at NVIDIA. The example and code demonstrating various optimizations
    for reduction are included with the NVIDIA SDK in the reduction directory. Both
    the paper and code are recommended reading.


    This chapter provides a reduction example that ties together much of the discussion
    in previous chapters and extends the reduction by Mark Harris:


    +   - C++ templates extend the generality of the reduction code to use defined
    types as floats, doubles, integers, long integers, and others.


    +   - New features of compute 2.0 devices such as the PTX prefetch instruction
    and inline assembly code are used to increase global memory read performance.


    +   - Temporary storage is passed to the reduction method so that the programmer
    can eliminate redundant cudaMalloc() and cudaFree() operations as noted in Chapter
    3. operations that slow the thrust implementation as


    +   - The passing and use of inline functors is demonstrated to create a generic
    reduction operation that is applicable more than just finding the sum of a vector.


    +   - ILP, discussed in Chapter 4, is utilized both to make the code more understandable
    and to free SM resources for complicated reductions as the objective functions
    defined in Chapters 3 and 4.


