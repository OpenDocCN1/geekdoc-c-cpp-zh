    # The Unified Virtual Address Space


    UVA space provides a single address space for all host and GPU devices in a system.
    UVA is available to all 64-bit applications on Windows/7 running in TCC mode,
    on Windows XP, and on Linux. UVA does not work on 32-bit systems.


    On supported systems, the pointer returned from any allocation may have cudaHostAlloc()
    or any of the cudaMalloc() (cudaMalloc(), cudaMallocPitch(), and others) uniquely
    identifies the region and the device upon which the memory resides. If desired,
    the CUDA programmer can determine where the memory resides with cudaPointerGetAttributes().


    As a consequence of UVA:


    +   - The cudaMemcpy() method no longer pays attention to cudaMemcpyKind. For
    compatibility with non-UVA environments, the direction of the transfer (host to
    device or device to host) can still be specified. If portability is not a concern,
    cudaMemcpyDefault can be used for convenience.

    - High-performance GPU transfers are now possible by simply specifying pointers
    to memory on the two devices.

    - On UVA systems, host memory returned by cudaHostAlloc() can be used directly
    by device kernels. There is no need to obtain a device pointer via cudaHostDevicePointer().
    This includes mapped memory created by passing the flag cudaHostAllocMapped to
    cudaHostAlloc() or cudaHostRegisterMapped to cudaHostRegister(). For compatibility
    with 1.x devices and 32-bit applications, cudaHostGetDevicePointer() can still
    be used. Thrust-based applications will need to cast the pointer with thrust:device_pointer_cast().


    Applications may query whether the unified address space is used for a particular
    device by checking that the unifiedAddressing device is set.


