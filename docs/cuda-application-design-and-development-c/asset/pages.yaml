  md: '# CHAPTER 6: Efficiently Using GPU Memory


    FIGURE 6.3

    An example of a graph.


    ![](img/4468c911ce4bde7a67079b9c80978769_171_0.png)


    Typical higher-level operations performed on a graph include finding a path between
    two nodes via either depth-first or breadth-first search and finding the shortest
    path between two nodes. Graph similarity is an important problem in pattern recognition.
    For example, chemical compounds can be represented as a graph. In searching chemical
    databases, it is frequently necessary to compare two graphs to see if they are
    equal. This leads to interesting computational problems such as how canonically
    label a graph for exact search. With a canonical label, it is possible to find
    graph structures via a string search. Alternatively, graph isomorphism is an important
    method used to find graphs that have the same or similar structure.


    Centrality in a graph is a measure of the relative importance of a vertex within
    the graph. Examples include: how important a person is within a social network
    and how critical a road is within a traffic network. The principle centrality
    metrics are as follows (Corley, Farber, & Reynolds, 2011):


    +   - Degree centrality: A metric of the connectedness of a node. It is simple
    count of the number of edges that attach to a node. For a graph G with $n$ vertices,
    $e$ edges and vertices $v$, the degree centrality $C_D(v)$ for vertex v is is:


    $$C_D(v) = \frac{\deg(v)}{n-1}$$


    +   - Closeness centrality: A metric that counts the average distance of a node
    to all other nodes. Closeness can be productive in communicating information among
    the nodes or actors in a graph. It is defined in Equation 6.2 as the average shortest
    path or geodesic distance from node $v$ and all reachable nodes ($t$ in $V/v$)


    $$C_C(v) = \frac{\sum_{t \in V/v} d_C(v,t)}{n-1}$$'
