    # BALANCE RATIOS


    Deciding whether an application or algorithm will run effectively across a network
    is a challenge. Of course, the most accurate approach is to port the code and
    benchmark it. This may be impossible due to lack of funding and time. It may also
    result in a lot of needless work.


    Balance ratios are a commonsense approach that can provide a reasonable estimate
    about application or algorithm performance that does not require first portant
    the application. These metrics are also used to evaluate hardware systems as part
    of a procurement process (Farber, 2007).


    Balance ratios define a system balance that is quantifiable and—with the right
    choice of benchmarks—provides assurance that an existing application will run
    well on a new computer. The challenge lies in deciding what characteristics need
    to be measured to determine whether an application will run well on a GPU or network
    of GPUs.


    Most GPU applications are numerically intensive, which suggests that all GPU-based
    metrics should be tied to floating-point performance. Comparisons can then be
    made between systems and cards with different floating-point capabilities. Bandwidth
    limitations are an important metric to tie numerical performance, as global memory,
    the PCIe bus, and network connectivity are known to bottleneck GPU performance
    for most applications.


    ![](img/4468c911ce4bde7a67079b9c80978769_268_0.png)'
