  md: '# The Message Passing Interface (MPI) 243


    # The MPI Communicator


    A fundamental concept in MPI is the communicator, a distributed object that supports
    both collective and point-to-point communication. As the name implies, collective
    communications refer to those MPI functions involving all the processors within
    the defined communicator group. Point-to-point communications are used by individual
    MPI processes to send messages to each other.


    By default, MPI creates the MPI_COMM_WORLD communicator immediately after the
    call to MPI_Init(). MPI_COMM_WORLD includes all the MPI processes in the application
    An MPI application can create multiple, separate communicators to exchange messages
    associated with one set of tasks or group of processes from those another. This
    chapter uses only the default communicator. Look to the many MPI books and tutorials
    on the Internet for more information about the use of communicator groups.


    # MPI Rank


    Within a communicator, every process has its own unique, integer identifier assigned
    by the system when the process initializes. A rank is sometimes called a "task
    ID." Ranks are contiguous and begin at 0. They are often used in conditional operations
    to control execution of the MPI processes. A general paradigm in MPI applications
    is to use a master process, noted as rank 0, to control all slave process of rank
    greater than 0.


    MPI programs are generally structured as shown in Figure 10.1.


    ![](img/4468c911ce4bde7a67079b9c80978769_262_0.png)


    FIGURE 10.1

    General structure of an MPI program.'
