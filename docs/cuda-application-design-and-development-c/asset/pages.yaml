    # BIG-O CONSIDERATIONS AND DATA TRANSFERS


    Big-O notation is a convenient way to describe the size of the problem affects
    the consumption by consumption of some resource such as processor time or memory
    as a function of its input. In this way, computer scientists can describe the
    worst case (or, when specified, the average case behavior) as a function to compare
    algorithms regardless of architecture or clock rate. Some common growth rates:


    +   - O(1): These are constant time algorithms always consume the same resources
    regardless of the size of the input set. Indexing a single element in a Thrust
    host vector does not vary in time with the size of the data set and exhibits O(1)
    runtime growth.


    +   - O(N): Resource consumption with these algorithms grow linearly with the
    size of the input. This is a common runtime for algorithms that loop over a data
    set. However, the work inside the loop must require constant time.


    +   - O(N²): Performance is directly proportional to the square of the data set
    size. Algorithms that use nested loops over an input data exhibit O(N²) runtime.
    Deeper nested iterations show greater runtime (e.g. three nested results in O(N³),
    O(N⁴) when four loops are nested, and so on.


    There are many excellent texts on algorithm analysis that provide a more precise
    and comprehensive description of big-O notation. One popular text is Introduction
    to Algorithms (by Cormen, Leiserson, Rivest, and Stein: The MIT Press, 2009).
    There are also numerous resources on the Internet that discuss and teach big-O
    notation and algorithm analysis.


    Most computationally oriented scientists and programmers are familiar with the
    BLAS (Basic Linear Algebra Subprograms) library. BLAS provides a facto programming
    interface for basic linear algebra. NVIDIAPGPU version of BLAS with their CUBLAS.
    In fact GPGPU computing is creating a resurgence of interest in new high-performance
    math libraries, such as the MAGMA project at the University of Tennessee Innovative
    Computing Laboratory (http://icl.utk.edu/magma/). MAGMA in utilizes both the host
    and a GPU device to attain high performance on matrix operations. It is available
    for free download.'
