  md: 'random number generation method. This approach is not guaranteed to be independent
    and can inadvertently introduce correlations into the “random” data (Coddington,
    1997).


    The CURAND library provides a simple and efficient API to generate high-quality
    pseudorandom and quasirandom numbers. A pseudorandom sequence of numbers satisfies
    most of the statistical properties of a truly random sequence but is generated
    by a deterministic algorithm. A quasirandom sequence of n-dimensional points is
    generated by a deterministic algorithm designed to fill an n-dimensional space
    evenly.


    Application areas include:


    +   **Simulation**: Random numbers are required to make things realistic. In the
    movies, computer-generated characters start and move in slightly different ways.
    People also arrive at airports at random intervals.


    +   **Sampling**: For many interesting problems, it is impractical to examine
    all possible cases. However, random sampling can provide insight into what constitutes
    “typical” behavior.


    +   **Computer programming**: Testing an algorithm with random numbers is an effective
    way to find problems and programmer biases.


    # SUMMARY


    Commercial and research projects must have parallel applications to compete for
    customer and research dollars. This need translates into pressure on software
    development efforts to control costs while supporting a range of rapidly evolving
    parallel hardware platforms. CUDA has been rapidly evolving to meet this need.
    Unlike current programming languages, CUDA was designed to create applications
    that run on hundreds of parallel processing elements and makes CUDA an attractive
    choice over current development languages like C++ and Java. It also creates a
    demand for CUDA developers.


    Projects like Copperhead are expanding the boundaries of what can be done with
    dynamic compilation and CUDA. Solid library support makes CUDA attractive for
    numerical and signal-processing applications. General interface packages like
    SWIG create the opportunity to add massively parallel CUDA support to many existing
    languages.'
