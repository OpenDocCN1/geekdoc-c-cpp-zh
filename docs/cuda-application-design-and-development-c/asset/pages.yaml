  md: "Betweenness centrality: a metric that measures how often paths between nodes\
    \ must traverse a given node. Betweenness centrality (Equation 6.3) measures intermediate\
    \ influence. In social media analysis, for example, an individual or blog is central\
    \ if it lies between other individuals or blogs on their geodesics – the blog\
    \ is “between” many others, where $g_{jk}$ is the number of geodesics linking\
    \ blog $j$ and blog $k$ (Wasserman and Faust, 1994):\n\n```\n$C_{B_v} = \\sum_{j\
    \ \neq k} \\frac{g_{jk}(n,v,t)}{g_{jk}} (6.3)$\n```\n\nPage rank: Page rank (Example\
    \ 6.4) is an example of eigenvector centrality that measures the importance of\
    \ a node by assuming links from more central nodes contribute more to its ranking\
    \ than less central nodes (Brin & Page, 1998). Let $d$ be a damping factor (usually\
    \ 0.85), $n$ be the index of the node $p_n$, $M(p_i)$ be the set of nodes linking\
    \ to $p_n$ and $L(p_i)$ be the out-links on page $p_i$;\n\n```\n$R_{p_i} = \\\
    frac{1-d}{N} + d \\sum_{j \\in M(p_i)} \\frac{PR(p_j)}{L(p_j)} (6.4)$\n```\n\n\
    Complex metrics (e.g., eigenvector centrality) can become intractable when presented\
    \ with large volumes of data unless appropriate machines and algorithms are utilized.\
    \ Developers and users must understand the runtime performance, accuracy, and\
    \ problem size trade-offs between exact and approximate centrality algorithms\
    \ (Ediger et al., 2010).\n\nIt is possible for a GPU to deliver an order of magnitude\
    \ or more increased performance on graph centrality metrics. The gpu-fan (GPUBased\
    \ Fast Analysis of Networks) project by Vanderbilt provides a software package\
    \ that includes methods for computing four shortest-based centrality metrics.\
    \ This project reports that the GPU speeds up the application by 10 to 50 times\
    \ on real-world protein interaction and gene co-expression networks as well as\
    \ simulated scale-free networks (Shi & Zhang, 2011). The nascent thrust-graph\
    \ library that is hosted on Google Code is tempting to create a common graph API\
    \ and set of algorithms for CUDA-enabled GPUs.\n\nProgramming graph algorithms\
    \ on GPUs is in a particularly early stage of development. The paper “Exploring\
    \ the Limits of GPUs with Parallel Graph Algorithms” (Dehne & Yogaratnam, 2010)\
    \ is a current survey of the field. A more more dated but still relevant paper\
    \ is “Accelerating Large Graph Algorithms on the GPU Using CUDA” (Harish & Narayanan,\
    \ 2007)."
