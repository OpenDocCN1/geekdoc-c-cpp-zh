    # MONTE CARLO METHODS


    Monte Carlo methods rely on repeated random sampling to compute their results.
    They are often used in simulating physical and mathematical systems and are especially
    useful for simulating systems with many degrees of freedom (such as fluids) to
    model phenomena as well as systems with significant uncertainty in inputs such
    as the calculation of risk in business. Hubbard notes that Monte Carlo predictions
    of failures, cost overruns, and schedule overruns are routinely better than human
    intuition or alternative “soft” methods (Hubbard, 2009).


    Monte Carlo methods are widely used in mathematics to evaluate multidimensional
    definite integrals with complicated boundary conditions. For example, the Metropolis
    algorithm is a Monte Carlo method for obtaining a sequence of random samples from
    a probability distribution for which direct sampling is difficult. This sequence
    can be used to approximate the distribution or to compute an integral to get an
    expected value.


    I had the personal pleasure of knowing Metropolis during my career in the theoretical
    division at Los Alamos National Laboratory, which demonstrates how of parallel
    computing can indirectly enrich your life. He was a wonderful person. The Metropolis
    algorithm is considered to be among the ten algorithms that have had the greatest
    influence on the development and practice of science and engineering in the twentieth
    century (Andrieu, de Freitas, Doucet, & Jordan, 2023; Beichel & Sullivan, 2000).
    For some applications, markov Markov chain Monte Carlo (MCMC) simulation is the
    only known general approach for providing a solution within a reasonable time
    (Andrieu, de Freitas, Doucet, & Jordan, 2003; Dyer, Frieze, & Kannan, 1991; Jerrum
    & Sinclair, 1996).


    The large number of CUDA projects implementing Monte Carlo methods demonstrates
    the power of CUDA and interest in this technique. Speeds range from 100 to over
    1,000 times greater on multi-GPU implementations. A good starting reference is
    “GPU-Programming for Statistical Computation: Studies in Massively Parallel Massive
    Mixtures* (Suchard, Wang, Chang, Frelinger, Cron, & West, 2010).


    A number of Monte Carlo packages are available for free download:


    +   - The MCX (Monte Carlo Extreme) package quotes 300- to 400-times speedups
    (Eng & Bao, 2009). The code can be freely downloaded from http://mcx.sourceforge.net.'
