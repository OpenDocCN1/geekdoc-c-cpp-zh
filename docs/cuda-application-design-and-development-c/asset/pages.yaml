  md: "# LIVE STREAM APPLICATION\n\nThe live stream application queues CUDA kernels\
    \ to perform image analysis and animated effects. Which kernels get queued depends\
    \ on user input. As can be seen in Figure 12.5, new data is transferred across\
    \ the PCIe bus to the liveData buffer on the GPU only when `tcpRead()` returns\
    \ a nonzero result, indicating a new frame of data has been read. As discussed,\
    \ `tcpRead()` can return zero as a result of a timeout, in which case no new data\
    \ needs to be transferred.\n\nBecause the kernel pipeline can modify the colors\
    \ of colorVBO, the original video data is copied from liveData to colorVBO prior\
    \ to the start of the pipeline. The pipeline is very fast because data moves only\
