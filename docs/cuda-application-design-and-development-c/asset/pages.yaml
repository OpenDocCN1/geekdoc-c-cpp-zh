  md: '# Preface


    Timing is so important in technology, as well as in our academic and professional
    careers. We are an extraordinarily lucky generation of programmers who have the
    initial opportunity to capitalize on inexpensive, generally available, massively
    parallel computing hardware. The impact of GPGPU General-Purpose Graphics Processing
    Units technology spans all aspects of computation, from the smallest cell phones
    to the largest supercomputers in the world. We are changing the commercial application
    landscape, scientific computing, cloud computing, computer visualization, games,
    and robotics are even redefining how computer programming is taught. TensorFlow
    floating-point operations per second computing is now within the reach of most
    people around the world. Teenagers, students, parents, teachers, professionals,
    small research organizations, and large corporations can easily afford GPGPU hardware
    and the software development kits (SDKs) are free. NVIDIA estimates that more
    than 300 million GPU devices have already been sold.


    Programmed in CUDA (Compute Unified Device Architecture), those third of a billion
    GPUs present a tremendous market opportunity for commercial applications, and
    they provide a hardware base with which to redefine what is possible for scientific
    computing. Most importantly, CUDA and massively parallel GPGPU hardware is changing
    how we think about computation. No longer limited to performing one or few operations
    at a time, CUDA programs perform many tens of thousands of operations simultaneously!


    This book will teach you how to think in CUDA and harness those of thousands of
    threads of execution to achieve orders-of-magnitude increased performance for
    your applications, be commercial, academic, or scientific. Further, this book
    will explain how to utilize one or more GPGUs within a single application, whether
    on a single machine or across a cluster of machines.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Preface


    In addition, this book will show you how to use CUDA to develop applications that
    can run on multicore processors, making CUDA a viable choice for all development.
    No GPU required!


    Not concerned with just syntax and API, the materials in this book covers the
    thought behind the design of CUDA, the architectural reasons why GPGPU hardware
    can perform so spectacularly. Various guidelines and caveats will be covered so
    that you can write concise, readable, and maintainable code. The focus is on the
    latest CUDA 4.x release.


    Working code is provided that can be compiled and modified playing with and adapting
    code is an essential part of the learning process. The examples demonstrate how
    to get high-performance from the Fermi architecture (NVIDIA 20-series) of GPGPU
    because the intention is not just to get code working but also to show how to
    write efficient code. Those with older GPUs will benefit from this book, as examples
    will compile and run on all CUDA-enabled GPGPUs. Where appropriate, this book
    will reference text from my Doctor Dobb''s Journal of CUDA tutorials to highlight
    improvements over previous versions of CUDA and to provide insight on how to achieve
    good performance across multiple generations of GPGPU architectures.


    Teaching materials, additional examples, and reader comments are available on
    the http://gpucomputing.net wiki. Any of the following URLs will access the wiki:


    +   - My name: http://gpucomputing.net/RobFarber.

    - The title of this book as one word: http://gpucomputing.net/CUDAapplicationdesignanddevelopment.

    - The name of my series: http://gpucomputing.net/supercomputingforthemass.


    Those whose purchase book can download the source code for the examples at http://booksite.mkp/9780123884268.


    To accomplish these goals, the book is organized as follows:


    Chapter 1. Includes basic CUDA concepts and the tools to build and debug CUDA
    applications. Simple examples are provided that demonstrates the thrust C++ and
    C APIs. Three simple rules for high-performance GPU programming are introduced.
    Chapter 2. Using only techniques introduced in Chapter 1, this chapter provides
    a clear, general-purpose machine-learning and optimization framework that can
    run 341 times faster than a single core of a conventional processor. Concepts
    in machine learning'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'and numerical optimization are also covered, which will be of interest to those
    who desire the domain knowledge as well as the ability to program GPUs.


    Chapter 3. Profiling is the focus of this chapter, as it is an essential skill
    in high-performance programming. The CUDA profiling tools are introduced and applied
    to the real-world example from Chapter 2. Some surprising bottlenecks in the Thrust
    API are uncovered. Introductory data-mining techniques are discussed and data-mining
    functors for both Principle Components Analysis and Nonlinear Principle Components
    are provided, so this chapter should be of interest to users as well as programmers.


    Chapter 4. The CUDA execution model is the topic of this chapter. Anyone who wishes
    to get peak performance from a GPU must understand the concepts covered in this
    chapter. Examples and profiling output are provided to help understand what the
    GPU is doing and how to use the existing tools to see what is happening.


    Chapter 5. CUDA provides several types of memory on the GPU. Each type of memory
    is discussed, with the advantages and disadvantages. Chapter 6. With three orders-of-magnitude
    in performance difference between the fastest and slowest GPU memory, efficiently
    using memory on the GPU is the only path to high performance. This chapter discusses
    techniques and provides profiling output to help you understand and monitor how
    efficiently your applications use. A general functor-based example is provided
    to teach you how to write your own generic methods like the Thrust API.


    Chapter 7. GPUs provide multiple forms of parallelism, including multiple GPUs,
    asynchronous kernel execution, and Unified Virtual Address (UVA) space. This chapter
    provides examples and profiler output to understand and utilize all forms of GPU
    parallelism.


    Chapter 8. CUDA has matured to a viable platform for all application development
    for both GPU and multicore processors. Pathways to multiple CUDA backends are
    discussed, and examples and profiler output to effectively run in heterogeneous
    multi-GPU environments are provided. CUDA libraries and how to interface CUDA
    and GPU computing with high-level languages like Python, Java, R, and FORTRAN
    are covered.


    Chapter 9. With the focus on the use of CUDA to accelerate computational tasks,
    it is easy to forget that GPU technology is also a splendid platform for visualization.
    This chapter discusses primitive restart and how it can dramatically accelerate
    visualization and gaming applications. A complete working example is provided
    that allows the reader to create and fly'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Preface


    around in a3D world. Profiler output is yielded from framework to demonstrate
    why primitive restart is so fast. The teaching framework from this chapter is
    extended to work with live video streams in Chapter 12.


    Chapter 10. To teach scalability, as well as performance, the example from Chapter
    3 is extended to use MPI (Message Passing Interface). A variant of this example
    code has demonstrated near-linear scalability with a peak of over 500,000-single-precision
    gigaflops and delivered over-one petflop ($10^{15}$ floating-point operations
    per second) using 60,000 x86 processing cores.


    Chapter 11. No book can cover all aspects of the CUDA tidal wave. This is a survey
    chapter that points to the other projects that provide working source code for
    a variety of techniques, including Support Vector Machines (SVM), Multi-Dimensional
    Scaling (MDS), mutual information, forced-directed layout,, modeling, and others.
    Knowledge of these projects—and how to interface with other high-level languages,
    as discussed in Chapter 8—will help you mature as a CUDA developer.


    Chapter 12. A working real-time video stream recognition based on the visualization
    framework in Chapter 9 is provided. All that needed is an inexpensive webcam or
    a video file so that you can work with real-time vision recognition. This was
    designed for teaching, so it is easy to modify. Robotics, augmented reality games,
    and data fusion for heads-up displays are obvious extensions to the working example
    and technology discussion in this chapter.


    Learning to think about and program in CUDA (and GPGPUs) is a wonderful way to
    have fun and open new opportunities. However, performance is the ultimate reason
    for using GPGPU technology, and as one of my professors used to say, "The proof
    of the pudding is in the tasting." Figure 1 illustrates the performance of the
    top 10 applications as reported on the NVIDIA Showcase as of July 12, 2011. They
    demonstrate the variety of applications that GPGPU technology can accelerate by
    two or more orders of magnitude (100-times) over multi-core processors, as reported
    in the peer-reviewed scientific literature and by commercial entities. It is worth
    taking time to look over these showcased applications, as many of them freely
    downloadable source code and libraries.


    GPGPU technology is a disruptive technology that has redefined how computation
    occurs. As NVIDIA notes, "from super phones to supercomputers." This technology
    has arrived during a perfect storm of opportunities, as traditional multicore
    processors can no longer achieve significant speedups


    > * http://developer.nvidia.com/cuda-action-research-apps.'
