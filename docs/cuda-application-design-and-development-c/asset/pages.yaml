    +   - breakpoint (b): set a breakpoint to stop the program execution at selected
    locations in the code. The argument can be a method name or number.

    - run (r): run the application within the debugger.

    - continue (c): move to the next line of code. continue to the next breakpoint
    or until the program completes.

    - backtrack (bt): shows contents of the stack including calling methods.

    - thread: lists the current CPU thread.

