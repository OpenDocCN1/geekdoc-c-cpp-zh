  md: "# CONSIDERATIONS FOR LARGE MPI RUNS\n\nIn designing distributed applications,\
    \ it is important to consider the scalability of all aspects of the application—not\
    \ just of the computation!\n\n legacy MPI applications were designed at a time\
    \ when an MPI run that used 10 to 100 processing cores was considered a 'large'\
    \ run. (Such applications might be good candidates to port to CUDA so that they\
    \ can run on a single GPU). A common shortcut taken in legacy applications is\
    \ to have the master process read data from a file and distribute it to the clients\
    \ according to some partitioning scheme. This type of data load cannot scale,\
    \ the master node simply cannot transfer all the data for potentially of thousands\
    \ of other processes. Even with modern hardware, the master process will become\
    \ a bottleneck, which can cause the data to take longer than the actual calculation.\n\
    \n# Scalability of the Initial Data Load\n\nA better approach is to have each\
    \ process read its data from a file on a distributed file system. Each process\
    \ is provided with the filename of a data file that contains the data. They then\
    \ open the file and perform whatever and other I/O operations are needed to access\
    \ and load the data. All the clients then close the file to free system resources.\
    \ This simple technique can load hundreds of gigabytes of data into large supercomputers\
    \ very quickly. The process is illustrated in Figure 10.4.\n\nWith this I/O model,\
    \ which depends on the bandwidth capabilities of the file system that holds the\
    \ data. Modern parallel distributed file systems can\n\nFIGURE 10.4\nA scalable\
    \ MPI data load for massive data sets.\n\n![](img/4468c911ce4bde7a67079b9c80978769_271_0.png)"
