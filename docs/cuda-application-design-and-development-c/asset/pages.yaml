    \ illustrated in Example 7.12, \"Example Showing that the Correct Context Must\
    \ Be Used,\" taken from the NVIDIA C Programming Guide:\n\n# Example 7.12\n\n\
    ```\ncudaDevice(0); // Set device 0 as current\ncudaStreamCreate(&s0); // Create\
    \ stream s0 on device 0\nMyKernel<<<100, 64, 0, s0>>>(); // Launch kernel on device\
    \ 0 in s0\ncudaDevice(1); // Set device 1 as current\ncudaStreamCreate(&s1);\n\
    cudaStreamCreate(&s1); // Create stream s1 on device 1\nMyKernel<<<100, 64, 0,\
