  md: '# Warp Scheduling and TLP


    From a software perspective, the hardware SM scheduler is fast enough that it
    basically has no overhead. Inside the SM, the hardware can detect those warps
    whose next instruction is ready to run because all resource and data dependencies
    have been resolved. The SM scheduler selects one on an internal prioritized schedule.
    It issues the instruction from that warp to the SIMD cores. If all the warps are
    stalled, meaning they all have some unresolved dependency, then no instruction
    can be issued resulting in idle hardware and decreased performance.


    The idea behind TLP is to give the scheduler as many threads as possible to choose
    from to minimize the potential for a performance loss. Occupancy is a measure
    of TLP, which is defined by maximum number of warps concurring on a multiprocessor
    that can be resident on an SM. A high occupancy implies that the scheduler on
    the SM has many warps to choose from and hide both ALU and data latencies. Chances
    are at least one warp should be ready to run because all the dependencies are
    resolved.


    Simple in concept, occupancy is complicated in practice, as it can be limited
    by on-chip SM memory resources as registers and shared memory. NVIDIA provides
    the CUDA Occupancy calculator to help choose execution configurations.


    Common execution configuration (block per grid) heuristics include:


    +   Specify blocks than number of SM so all the multiprocessors have at least
    one lower block to execute.


    +   This is a lower bound, as specifying fewer blocks than SM will clearly utilize
    all the resources of the GPU.


    +   To exploit asynchronous kernel execution for small problems, the developer
    may purposely underutilize the GPU. GF100 and later architectures can utilize
    concurrent kernel execution to increase performance by running blocks from different
    kernels on unused SM. These GPUs accelerate those applications that have multiple
    kernels that are too small to run on all the SM of the GPU but take too much time
    to export to the host processor.


    +   Specify multiple blocks per SM to run concurrently inside an SM.


    +   Choose the number of blocks to be a multiple of the number of SM on the GPU
    to fully utilize all the SM. This approach ensures that all the SM have a balanced
    workload.


    +   Blocks that are not waiting at a __synthreads will keep the hardware busy.


    +   The numbers of blocks that can run are subject to resource availability on
    the SM including register and shared memory space.'
