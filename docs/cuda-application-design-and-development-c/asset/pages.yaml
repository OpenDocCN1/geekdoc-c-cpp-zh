  md: '# The nvcc Compiler


    The nvcc compiler provides a common compilation framework for the UNIX, Windows,
    and Mac OS X operating systems.


    ![](img/4468c911ce4bde7a67079b9c80978769_122_0.png)


    FIGURE 4.5

    vcc for UNIX.


    FIGURE 4.6

    vcc for Windows.


    As shown in Example 4.5, the nvcc compiler provides the **#pragma unroll** directive,
    which can be used to control unrolling of any given loop. It must be placed immediately
    before the loop and applies only to that loop. By default, the compiler unrolls
    small loops with a known trip count. If the loop is large or the trip count cannot
    be determined, the user can specify how many times the loop is to be unrolled.


    The **#pragma unroll 16** used in Example 4.5 tells the compiler to unroll the
    loop 16 times to prevent the control logic of the *for* loop from interfering
    with the ILP test results.


    The primary benefits gained from loop unrolling are:


    +   - Reduced dynamic instruction count due to fewer number of compare and branch
    operations for the same amount of work done.

    - Better scheduling opportunities due to the availability of additional independent
    instructions can improve ILP plus pipeline and memory access latencies.'
