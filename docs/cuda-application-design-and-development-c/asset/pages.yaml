  md: '# Techniques to Increase Parallelism


    CUDA was designed to exploit the massive parallelism inside the GPU as well as
    through the use of concurrent streams of execution to utilize multiple GPUs, asynchronous
    data transfers, and simultaneous kernel execution on a single device. By default,
    CUDA creates a single stream of execution on a one GPU, which is usually device
    $0^1$ All data transfers and kernel invocations are queued on this stream and
    processed sequentially in the order they were queued. By explicitly creating and
    using multiple streams of execution, a CUDA programmer can perform more work per
    unit time to make applications run faster. For example, multiple GPUs can be utilized
    by simply changing the device with `cudaDevice`. Work can then be queued on each
    device, which can potentially increase application performance by the number of
    GPUs in the system. CUDA programmers can overlap computation and data transfers
    to reduce application runtime plus enable real-time data processing on both single
    and multi-GPU systems. Under special circumstances, greater efficiency per device
    can be achieved when running multiple streams on a single device to exploit concurrent
    kernel execution. The addition of UVA in CUDA 4.0 simplifies data management to
    facilitate the use of these techniques to increase parallelism and application
    performance.


    At the end of this chapter, the reader will have a basic understanding of:


    +   - How to run on multiple GPUs in a system.

    - UVA and how it makes multi-GPU applications simpler.

    - How to use asynchronous data transfers to speed application performance.

    - The use and performance implications of using mapped memory.


    > $^1$ As will be discussed, the default GPU device can be changed by either the
    programmer or the systems administrator.'
