    # ILP Hides Data Latency


    It is important to note that threads don''t stall the SM on a memory access—only
    on data dependencies. From the perspective of a warp, a memory access requires
    issuing a load or store instruction to the LD/ST units. The warp can continue
    issuing other instructions until it reaches one that depends on the completion
    of a memory transaction. At that point, the warp will stall. To increase performance,
    the compiler can reorder instructions to:


    +   - Keep the largest number of memory transactions “in flight” and thus best
    utilize memory bandwidth and the LD/ST units.

    - Supply other, nondependent instructions required by the thread to keep the computational
    cores busy.

    - Minimize the time that dependent instructions must remain in the queue by positioning
    the data-dependent instruction in the queue so that it reaches the top of the
    queue close to the expected arrival time.


    As a result of this complex choreography, ILP can also hide memory latency. Vasily
    Volkov notes that ILP can achieve 84 percent of memory bandwidth while requiring
    only 4 percent occupancy when copying 14 float4 values per thread (Volkov, 2010).
    A float4 is a structure of four 32-bit floating-point variables that fits perfectly
    into a 128-bit cache line. These structures exploit the bit-level parallelism
    of a cache line memory transaction as well as ILP parallelism.


    # ILP in the Future


    The current GF100 architecture encourages the use of smaller blocks because it
    can schedule more blocks due to the additional resources per SM.


    > Although there is no difference in performing a store or load operation, the
    literature discusses ILP writes in terms of multiple outputs—meaning multiple
    write operations to memory.'
