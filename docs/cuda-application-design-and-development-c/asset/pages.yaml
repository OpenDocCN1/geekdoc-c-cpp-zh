  md: 'CUFFT utilizes a plan, which is a simple configuration mechanism that specifies
    the best "plan" of execution for a particular algorithm given a specified problem
    size, data type, and destination hardware platform. The advantage of this approach
    is that once a plan is created, it can be used for the remainder of the application
    lifetime. This is a commonly used programming pattern to perform runtime configuration
    in libraries and other high-performance portable codes. The NVIDIA library uses
    this configuration model because different sizes and types of FFTs require different
    configurations and GPU resources. The simpleCUFFT example can be downloaded from
    the NVIDIA website.²14 It covers the basics of how to use the CUFFT library.


    CUFFT also provides the method cufftPlanMany(), which creates a plan that will
    run multiple FFT operations at the same time. This can be both a boon and a memory
    hog.


    The test program demonstrates the use of CUFFT on one or more GPUs. It performs
    a 3D complex-to-complex forward and inverse in-place transform and calculates
    the error introduced by these transforms. Correct usage will result in a small
    error.


    The user can specify the following runtime characteristics via the command line:

    - The number of GPUs to use. This must be less than or equal to the number of
    GPUs in the system.

    - The size of each dimension.

    - The total number of FFTs to perform.

    - An optional value that specifies how many FFTs to perform on each call to CUFFT.


    In addition, this test code makes use of C++ type defines. To create a double-precision
    executable, simply specify -D REAL=double on the nvcc command line.


    General include files and constants defined at the beginning of the example file.
    The preprocessor variable REAL is set to default to float if otherwise defined
    during compilation. Example 8.9, "Part 1 of fft3Dtest.cu," contains a walkthrough
    of the test code:


