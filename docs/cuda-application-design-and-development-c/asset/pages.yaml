    value. For efficiency, a pipeline can be created by queuing a number of threads
    to keep the GPGPU busy for as long as possible. Further, some form of synchronization
    is required so that the host knows when the kernel or pipeline completes. Two
    commonly used synchronization mechanisms are:


    +   - Explicitly calling cudaSynchronize() acts as a barrier causing the host
