  md: '# SUMMARY


    Understanding the SM is the key to understanding GPGPU programming. The twin concepts
    of a thread block and warp of SIMD threads encompass the scalability, performance,
    and power efficiency of GPU computing. Knowing how instructions execute in parallel
    within an SM, as well as the factors that stall the instruction pipeline, is fundamental
    to understanding GPU application performance. Little''s law, and queuing theory
    in general, provide the theoretical foundation upon which GPU and application
    models can be based. Empirical studies have shown that exploiting both ILP and
    TLP provides the highest application performance. The benefits have been so significant
    that both ILP and TLP are now utilized in the CUBLAS and CUFFT libraries, which
    are the keystystone of many applications.


