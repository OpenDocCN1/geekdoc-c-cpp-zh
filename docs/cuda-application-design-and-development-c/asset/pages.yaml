    to increase performance—sometime significantly—by combining multiple low-density
    operations like BLAS level-2 and level-2 operation into a single function or kernel.


    # CUDA AND AMDAHL''S LAW


    Amdahl''s law is named after computer architect Gene Amdahl. It is not really
    a law but rather an approximation that models the ideal speedup that can happen
    when serial programs are modified to run in parallel. For this approximation to
    be valid, it is necessary for the problem size to remain the same when parallelized.
    In other words, assume that a serial program is modified to run in parallel. Further,
    assume that the amount of work performed by the program does not change significantly
    in the parallel version of the code, which is not always true. Obviously, those
    portions of the application that do not parallelize will not run any faster, much
    faster depending on the hardware capabilities. Thus, the expected speedup of the
    parallel code over the serial code when using n processors is dictated by the
    proportion of a program that can be made parallel, P, and the portion that cannot
    be parallelized, (1 – P). This relationship is shown in Equation 1.1, “Amdahl''s
    law”.


    > $S(n) = \frac{1}{(1-P) + P/n} \qquad (1.1)$


    Amdahl''s law tells us that inventive CUDA have two concerns in parallelizing
    an application:


    +   1. Express the parallel sections of code so that they run as fast as possible.
    Ideally, they should run N times faster when using N processors.

    2. Utilize whatever techniques or inventiveness they have to minimize the (1 –
    P) serial time.


    ¹Asynchronous data transfers can improve performance because PCIe bus is full
    duplex, meaning data can be transferred both to and from the host at the same
    time. At best, full-duplex asynchronous PCIe transfers double the performance
    to two Gflop.'
