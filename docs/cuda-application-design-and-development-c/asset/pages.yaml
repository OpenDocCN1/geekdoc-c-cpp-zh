  md: '# Pathways from CUDA to Multiple Hardware Backends


    # The PGI CUDA x86 Compiler


    The concept behind native x86 compilation is to give CUDA programmers the ability—with
    a single source tree—to create applications that can reach most customers with
    a computer. When released, the PGI unified binary will greatly simplify product
    support and delivery as a single application binary can be shipped to customers.
    At runtime, the PGI unified binary will query the hardware and selectively run
    on any CUDA-enabled GPUs or the host multicore processor.


    What distinguishes the PGI effort from source translators as the Swan CUDA to
    OpenCL translator; the MCCUDA CUDA to C translator; the Ocelot open source emulator
    and PTX translation project; and the ability of the NVI-nvcc compiler to generate
    both x86 and GPU code is:


    +   - Spec: The PGI CUDA/C++ is a native compiler that transparently compiles
    CUDA to run on x86 systems when a GPU is not present in the system. This gives
    the compiler the opportunity to perform x86 specific optimization to use the multiple
    cores of the x86 processor as well as the SIMD parallelism in the AVX or SSE instructions
    within each core. (AVX is an extension of SSE to 256-bit operation.)

    - Transparency: Both NVIDIA and PGI state that CUDA applications utilizing proprietary
    features of the GPU texture units will exhibit identical behavior on both x86
    and GPU hardware.

    - Convenience: In 2012, the PGI compiler will be able to create a unified binary,
    which will simplify the software distribution process tremendously as mentioned
    previously. The simplicity of shipping a single binary to customers reflects the
    completeness of the thought behind the PGI CUDA/C++ project.


    From a planning perspective, CUDA for x86 dramatically impacts the software development
    decision-making process. Rather than CUDA filling the role of a niche development
    platform for GPU-based products, CUDA is now a platform for all product development—even
    for applications that are not intended to be accelerated by GPUs!


    The motivation is clearly exemplified by the variety and number of projects on
    the NVIDIA showcase that have achieved 100 times or greater performance over commodity
    processors, as summarized in Figure 8.1.'
