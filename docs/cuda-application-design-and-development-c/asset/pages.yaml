  md: 'by a factor of six over a single partition. There is no longer a linear mapping
    between addresses and partitions, so typical access patterns are unlikely to all
    fall into the same partition. This design avoids partition camping (bottlenecking
    on a subset or even a single controller).


    The Fermi memory system supports ECC memory on high-end cards, but this feature
    is disabled on consumer cards. ECC is also used on memory internal to the SM.
    Using error correcting memory with ECC is a "must have" when deploying large numbers
    of GPUs in datacenter and supercomputer instances to ensure data-sensitive applications
    like medical imaging, financial options pricing, and scientific simulations are
    protected from memory errors. ECC can be turned off at the driver level to gain
    an additional 20 percent in memory bandwidth and added memory capacity, which
    can benefit global memory-bandwidth limited applications and can be an acceptable
    optimization for noncritical applications. The Linux nvidia-smi command added
    a -e option for controlling ECC. There is a control panel option to enable or
    disable ECC in Windows.


    There are three ways to increase the hardware bandwidth of memory in a system:


    +   1 Increase the memory clock rate. Faster memory is more expensive, it consumes
    more power (which means that heat is generated), and faster memory can be more
    error-prone.


    +   2 Increase the bus width. This option requires that the GPU chip has lots
    of pins for the memory interface. No matter how small the lithography of the manufacturing
    process, it is possible to fit only a limited number of physical pin connectors
    in a given space. More pins mean that the size of the chip must be increased,
    which leads to a vicious cycle, as manufacturing larger chips mean fewer chips
    can be made per wafer, thereby driving up the cost. In a competitive market for
    consumer products, higher costs make products unattractive to do not sell well.
    Consumer products are the market that is really driving the economics of GPU development,
    which makes cost a critical factor. Optical connectors offer the potential to
    break this vicious cycle, but this technology has not yet matured to be commonly
    used in manufacturing.


    +   3 Transmit more data per pin per clock. This is the magic behind GDDR5 (Graphics
    Double Data version 5) memory and the hope behind optical connectors. Basically,
    the channel capacity can be calculated from the physical properties of the channel.
    For example, the Nyquist sampling theorem lets us determine the maximum possible
    data rate based on the frequency of the channel in the absence of noise. Increasing
    the frequency of a channel means that'
