  md: '# REGRESSION TESTING AND ACCURACY


    As always in programming, the most important metric for success is that the application
    produces the correct output. Regression testing is a critical part of this evaluation
    process that is unfortunately left out of most computer science books. Regression
    tests act as sanity checks that allow the program to use the computer to detect
    if some error has been introduced into the code. The computer is impartial and
    does not get tired. For these reasons, small amounts of code should be written
    and tested to ensure everything is in a working state. Additional code can be
    added with more regression tests. This greatly simplifies debugging efforts as
    the errors occur in the smaller amounts of new code. The alternative is to write
    a large amount of code and hope it will work. If there is an error, it is challenging
    to trace through many lines of code to find one or more problems. Sometimes you
    can get lucky with the latter approach. If you try, track your time to see if
    there was a savings over the time to use regression testing and incremental development.


    The examples in this chapter use a simple form of regression testing, sometimes
    a golden test or smoke test, which utilizes an alternative method to doublecheck
    the parallel calculation of the sum of the integers. Such simple tests work well
    for exact calculations, but become more challenging to interpret a calculation
    when using floating-point arithmetic due to the numerical errors introduced using
    floating-point. As GPU technology can perform several trillion floating-point
    operations per second, numerical errors can build up quickly. Still, using a computer
    to double-check the results at endless lines of numbers. For complex programs
    and algorithms, the regression test suite can take as much time to plan, be as
    complex to implement, and require more lines of code than the application code
