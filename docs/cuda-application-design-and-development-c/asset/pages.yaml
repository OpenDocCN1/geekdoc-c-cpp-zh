  md: '# CHAPTER 2: CUDA for Machine Learning and Optimization


    # MODELING AND SIMULATION


    VS


    Mathematical modeling and numerical simulation are two important, distinct, and
    closely linked aspects of applied mathematics. A mathematical model is an abstraction
    of reality that can be used for analysis and prediction. Numerical simulation
    is based on applications that map mathematical models onto the computer. In combination,
    modeling and simulation are powerful techniques to advance human understanding
    of complex phenomena.


    This book does not attempt to duplicate or shed new in the tremendous volume of
    work that has already been published concerning modeling and simulation. Depending
    on your particular area of interest, there are a number of excellent texts available
    that provide both precise and detailed introductions. Our focus is to provide
    the tools to exploit massively parallel hardware with CUDA so that readers can
    make their own contributions in their field of choice.


    Two general approaches are utilized to create models:


    +   1. Human-derived models based on first-principle analysis and other techniques


    When available, these models provide deep insight into the phenomena being investigated.
    A literate CUDA programmer can contribute by efficiently mapping the calculations
    to the parallel hardware to achieve the highest performance and scale to the largest
    number of processing elements possible. The literature shows that a well-designed
    and written CUDA application can provide two orders of magnitude increased performance
    (Hwu,2011; Stone et al., 2010). Such performance is disruptive, as simulations
    that previously would have taken a year can finish in a few days. Greater simulation
    accuracy is also possible as more accurate and detailed approximations can be
    utilized. Nonlinear problems particularly benefit from the NVIDIA Special Function
    Units (SFU) that calculate transcendental functions (such as log(), exp(), sin(),
    cos(), and others) approximately 25 times faster than conventional processors.


    +   2. Parameterized models derived by fitting data (empirical)


    Computationally derived models from data are relatively simple to construct compared
    to human-derived models. Many techniques exist that can create accurate models
    that generalize well. Neural networks are one example (Lapedes & Farber, 1987b).
    In general, the process of fitting a model to data is a computationally expensive
    process, with runtimes that grow by O(N²) and higher, where N is the number of
    data items. Parallelism is what makes these methods tractable and even interactive
    by reducing the'
