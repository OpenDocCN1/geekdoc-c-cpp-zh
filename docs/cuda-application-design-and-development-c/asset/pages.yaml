    The CUSP library (Generic Parallel Algorithms for Sparse Matrix and Graph Computations)
    is a thrust-based project for running sparse matrix and graph computations on
    the GPU. It provides a flexible, high-level interface for manipulating sparse
    matrices and solving sparse linear systems. The source code for the library can
    be downloaded from Google Code, where the project is hosted (http://code.google.com/p/cusp-library/).
    This library uses a variety of common sparse matrix formats with various advantages,
    as described in the documentation.


    Results in the literature show a compute 1.x GPU can deliver an order of magnitude
    increased performance over Intel quad-core Celeron system (Bell & Garland, 2009).
    This is an active area of research where people are investigating optimal use
    of the hardware (El Zein & Rendell, 2011) and sparse matrix representations (Cao,
    Yao, Li, Wang, Wang, 2010).


    CUSP provides a straightforward interface for sparse matrix operations, as can
    be seen in Example 6.21, to determine the maximal independent set, which is an
    independent set that is not a subset of any other independent set. It is an important
    metric used in social network analysis to identify groups or cliques of people.'
