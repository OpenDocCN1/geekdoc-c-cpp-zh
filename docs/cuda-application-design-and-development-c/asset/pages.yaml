    ![](img/4468c911ce4bde7a67079b9c80978769_85_1.png)


    of the network can correctly reconstruct the original high-dimensional input vector
    at the output neurons. A least-means-squared error is commonly used to determine
    the error over all vectors. Such networks are sometimes called autoencoders. A
    perfect encoding would result in a zero error on the training set, as each vector
    would be exactly reconstructed at the output neurons. During analysis, the lower
    half of the network is used to calculate the low-dimensional encoding. Autoencoders
    have been studied extensively in the literature (Hinton & Salakhutdin, 2006; Kramer,
    1991) and are part of several common tradeoffs including MATLAB. One example is
    the nlpca toolkit on nlpca.org.


