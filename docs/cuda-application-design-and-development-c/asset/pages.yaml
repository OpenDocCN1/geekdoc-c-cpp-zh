  md: '# A roadmap for leveraging GPUs with CUDA to improve application efficiency
    and performance


    CUDA Application Design and Development is required reading for anyone who wants
    to understand and efficiently program CUDA for scientific and visual programming,
    it provides a hands-on exposure to the details in a readable and easy to understand
    form.

    — Jack Dongarra, University Distinguished Professor of Computer Science, University
    of Tennessee


    With an NVIDIA GPU device and the CUDA toolkit, you can now write "massively parallel"
    programs that run faster, performing thousands of simultaneous operations. Whether
    your field is commercial applications, scientific computing, cloud computing,
    computer visualization, games, robotics, or a variety of other industries, this
    book will teach you to think in CUDA, harness countless threads of execution,
    and improve application performance by an order of magnitude.


    Starting with an overview of CUDA concepts, the book shows how to create, analyze,
    and debug CUDA applications. It explains how to use CUDA in the context of existing
    application code, with a variety of compilers, languages, software tools, and
    industry-standard API libraries. Using an approach refined in a series of well-received
    articles at Dr. Dobb''s Journal, Rob Farber teaches you step-by-step from fundamentals
    to implementation, using language theory to practical coding.


    # Features


    +   - Multiple examples build from simple to more complex applications in key
    areas including machine learning, visualization, and vision recognition

    - Understand the thought behind CUDA and the GPU architecture, that your code
    not only works but works more efficiently

    - Learn to use CUDA on single machines, across clusters, or even on multicore
    CPUs

    - Companion website includes source code, a wiki for questions, additional examples,
    videos and links to the latest CUDA toolkit. Teaching professionals will also
    find PowerPoint slides and additional materials for lectures and classroom exercises


    # About the Author


    ROB FARBER has served as a scientist at the Irish Center for High-End Computing,
    U.S. national labs in Los Alamos, Berkeley, and the Pacific Northwest, and external
    faculty at the Santa Fe Institute. A co-founder of two successful start-ups and
    a consultant to Fortune 100 companies, his articles have appeared in Dr. Dobb''s
    Journal and Scientific Computing, among others.


    ![](img/4468c911ce4bde7a67079b9c80978769_339_0.png)


    # PARALLEL COMPUTING


