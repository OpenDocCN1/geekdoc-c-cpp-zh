- img_proc: true
  md: '# CHAPTER 7: Techniques to Increase Parallelism


    In addition to translating virtual addresses to physical memory, the MMU also
    keeps track of other information in the page table. For example, each page in
    the page table contains a bit that specifies whether the page is resident in memory.
    When the MMU is asked to translate an address that is not resident, it generates
    a page fault that informs the device driver that it needs to fetch some data on
    behalf of the GPU. Address translation resumes only once the page has been loaded
    into the GPU memory.


    When a region of memory is mapped, none of the pages are marked as resident. As
    a result, the first access to each page of mapped memory will be slow, the GPU
    must wait while the GPU and device driver interact to transfer the required page
    of memory. Later accesses will be very fast, as the page will already be resident
    on the GPU. Of course, the GPU can decide at any time to free memory for other
    purposes, in which case a follow-on page access will again be slow.


    The successful two-integer test case using the code in Example 7.16 tells us that
    the driver has implemented a mechanism that correctly modifies adjacent, nonoverlapping
    regions of mapped memory even when multiple devices modify addresses that reside
    in the same page. The implication for the CUDA programmer is that data can be
    modified in mapped memory as long as the programmer:


    +   - Takes not to modify the same memory location on different devices.

    - Synchronizes as needed to make updates visible to all devices.


    # SUMMARY


    This chapter introduced multi-GPU programming, which is one of the most exciting
    areas of research and application development in GPU computing. Current technology
    allows up to 16 GPUs to be installed in a single workstation or computational
    node. Such a workstation has a potential computational capability that is three
    times greater than the $30 million supercomputer at Pacific National Laboratory
    that was replaced in 2006.


    Data partitioning and scalability are key challenges for multi-GPU application
    development. Ideally, CUDA programmers should be able to achieve a linear speedup
    according to the number of devices in the system. This is where understanding
    the computational problem and creative thinking can really make a difference in
    application performance.'
