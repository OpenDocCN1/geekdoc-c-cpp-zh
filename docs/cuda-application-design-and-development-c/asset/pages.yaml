  md: '# Nelder-Mead Method


    The Nelder-Mead is a commonly used direct search nonlinear optimization technique
    (Nelder & Mead, 1965). The algorithm performs a search using a simplex which is
    a generalized triangle in N dimensions. The method evaluates a user-provided function
    at each of the vertices and iteratively shrinks the simplex as better points are
    found. The method terminates when a desired bound or other termination condition
    is reached.


    With some limitations (McKinnon & McKinnon, 1999; Kolda, Lewis, & Torczon, 2007),
    the Nelder-Mead method has been proven to be effective over time. The original
    FORTRAN implementation was made available through STATLIB. John Burhardt created
    a C-language implementation that he made freely available on his website. The
    C++ template adaption of his code at the end of this chapter allows easy comparison
    of both single- and double-precision host and GPU performance.


    # Levenberg-Marquardt Method


    The Levenberg-Marquardt algorithm (LMA) is a popular trust region algorithm that
    is used to find a minimum of a function (either linear or nonlinear) over a space
    of parameters. Essentially, a trusted region of the objective function is modeled
    with some function such as a quadratic. When an adequate fit is found, the trust
    region is expanded. With many numerical techniques, the Levenberg-Marquardt method
    can be sensitive to the initial starting parameters. An excellent technical overview
    of the Levenberg-Marquardt with references is on the levar website. Another excellent
    resource is Numerical Recipes.


    In traditional Levenberg-Marquardt implementations, finite differences are used
    to approximate the Jacobian. The Jacobian is a matrix of partial derivatives of
    the function being optimized. This is convenient as the user need only supply
    a single function to the library.


    The original FORTRAN public domain MINPACK routine is a reliable piece of software
    of the decades—so much that a variety of implementations have been created in
    many computer languages. Two excellent C/C++ implementations are levarmar and
    lmfit.


    For comparison purposes, the levarmar library has been used in the examples because
    it provides both single- and double-precision routines. The reader will have to
    download and install the levarmar package to run these examples. The levarmar
    website provides installation instructions for both Micro and UNIX-based systems.


    > http://people.sc.fsu.edu/~jburhardt/cpp_src/asa047/asa047.html

    h://www.ics.forth.org/~ourakis/levar/index.html#download'
