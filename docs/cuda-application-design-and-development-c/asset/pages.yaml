  md: '# Summary


    grids. In particular, these abstractions help the programmer group data accesses
    into common patterns plus define shared memory usage for interthread communications
    within a thread block.


    Matrix multiplication provides the textbook example of the use of 2D regions,
    or tiles, on GPUs. The Programming Massively Parallel Processors: A Hands-on Approach
    (Kirk & Hwu, 2010) has a detailed discussion of matrix multiplication and the
    use of tiles. However, tiles are a common design paradigm used in many problems
    aside from matrix multiplication. The CUDA N-body example is another excellent
    demonstration of the use of tiles to solve a complicated problem on the GPU with
    high performance.


    Stencils are a generalization of the concept of a tile to n-dimensional space.
    A stencil computation:


    +   * Operates on each point in a stencil n-dimensional space.

    * Uses neighboring points in computation.

    * Are often surrounded by a time loop.

    * Can have diverse boundary conditions.


    Both tiles and stencils help utilize shared memory and register in the SM as well
    as exploit parallelism across all the SM. The paper “3D Finite Difference Computation
    on GPUs using CUDA” (Micikevicius, 2010) provides a detailed discussion of stencils
    that can be freely downloaded from the NVIDIA website. Volkov demonstrates how
    to use ILP to accelerate stencilencils in “Programming Inverse Memory Hierarchy:
    Case of Stencils on GPUs” (Volkov, 2010).


    Tiles and stencils are also important in performing GPU computations with quadrees
    and octrees. A quadtree is a tree-based structure in which each internal node
    has four children. It is used to partition a two-dimensional space by recursively
    dividing it into quadrants. An octree has eight children per internal node and
    is used to recursively divide a 3D space into regions. Both of these data structures
    can exhibit irregular global memory accesses. The book GPU Computing Gems (Hwu,
    2011) contains several detailed examples of how experts in the field have used
    these and other irregular data structures in CUDA to solve complex scientific
    problems.


    # SUMMARY


    This chapter introduced techniques and examples to efficiently use GPU memory.
    The three-orders-of-magnitude performance difference between the slowest and fastest
    GPU memory systems means that GPU programmers have the opportunity to capitalize
    on the extreme performance that GPU hardware offers.'
