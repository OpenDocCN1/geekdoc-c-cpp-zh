  md: '# GPU ARCHITECTURE OVERVIEW


    The heart of CUDA performance and scalability lies in the simple partitioning
    of a computation into fixed sized blocks of threads in the execution configuration.
    These thread blocks provide the mapping between the parallelism of the application
    and the massive replication of the GPGPU hardware.


    Massive GPU parallelism is achieved through replication of a common architectural
    building called a streaming multiprocessor (SM); altering the number of SMs, GPU
    designers can create products to market needs at various price and performance
    points. The block diagram in Figure 4.1 illustrates the massive replication of
    multiprocessors on the GF100 (Fermi) GPGPU.


    The software abstraction of a thread block translates into a natural mapping of
    the kernel to an arbitrary number of SM on a GPGPU. Thread blocks also act as
    a container of thread cooperation, as only threads in a thread block share data.
    Thus a thread block becomes a natural expression of the parallelism in an application
    and of partitioning the parallelism into multiple containers that run independently
    of each other.


    The translation of the thread block abstraction is straightforward; each SM can
    be scheduled to run one or more thread blocks. Subject only to device limitations,
    this:


    +   Scales transparently to an arbitrary number of SM.


    +   Places no restriction on the location of the SM (potentially allowing CUDA
    applications to transparently scale across multiple devices in the future).


    +   Gives the hardware the ability to broadcast both kernel executable and user
    parameters to the hardware. A parallel broadcast is the most scalable and generally
    the fastest communication mechanism that can move data to a large number of processing
    elements.


    Because all the threads in a thread block execute on an SM, GPGPU designers are
    able to provide high-speed memory inside the SM called shared memory for data
    sharing. This elegant solution avoids scaling issues with maintaining coherent
    caches in multicore processors. A coherent cache is guaranteed to reflect the
    latest state of all the variables in the cache regardless of how many processing
    elements may be reading or updating a variable.


    > For some problems and with good reason, a developer may choose to use atomic
    operations to communicate between threads of different thread blocks. This approach
    breaks the assumption of independence between thread blocks and may introduce
    programming errors, scalability, and performance issues.


    ![](img/4468c911ce4bde7a67079b9c80978769_105_0.png)'
