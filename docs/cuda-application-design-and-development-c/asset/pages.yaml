    # OBTAINING BASIC GPU PROFILE INFORMATION


    The collection of low-level GPU profiling information can be enabled through use
    of the environmental variable CUDA_PROFILE. Setting this variable to 1 tells CUDA
    to collect runtime profiling information from hardware counters on the GPU. Gathering
    this information does not require special compiler flags, does not affect application
    performance. Setting CUDA_PROFILE to 0 enables the collection of the profile information.


    By default, the CUDA profiler writes information to the file cuda_profile_0.log
    in the current directory. The name of the destination file can be changed through
    the environmental variable CUDA_PROFILE_LOG. Further, the user can specify an
    options file to select the specific information that is to be gathered from the
    hardware counters with the environmental variable CUDA_PROFILE_CONFIG. The types
    and amounts of profile information can be collected different between GPU generations.
    Please consult the NVIDIA profiler documentation to see what can be gathered from
    your GPGPU.


    Examining the contents of cuda_profile_0.log after running npcaNM_GPU32 with CUDA_PROFILE=1
    shows that indeed this is the raw profile output.'
