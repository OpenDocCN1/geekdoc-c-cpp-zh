  md: '# SUMMARY


    With this accessible computational power, many past supercomputing techniques
    are now available for everyone to use—even on a laptop. In the 2006 paper "Reducing
    the Dimensionality of Data with Neural Networks," Hinton and Salakhutiddinov noted:


    It has been obvious since the 1980s that backpropagation through deep autoencoders
    would be very effective for nonlinear dimensionality reduction, provided that
    computers were fast enough, data sets were enough, and the initial weights were
    close enough to a good solution. All three conditions are satisfied. (Hinton &
    Salakhutdinov, 2006, p. 506)


    The techniques discussed in this chapter, including autoencoders, can be applied
    to a host of data fitting, data analysis, dimension reduction, vision, and classification
    problems. Conveniently, they are able to scale from laptops to the largest supercomputers
    in the world.


    As this chapter showed, achieving high performance inside a functor does not guarantee
    good performance across all problem sizes. Sometimes the bottlenecks that limit
    performance are as subtle as the dynamic memory allocation of temporary space,
    as identified in the thrust::transform_reduce method.


    Without being able to see what the GPU is doing, performance monitoring is guesswork.
    Having the right performance analysis tool is key to finding performance limitations.
    For this reason, the CUDA tool suite contains a number of common profiling and
    debugging tools that have been adapted to GPU computing. These are tools that
    Windows, UNIX, and Max developers are already comfortable with. Although each
    tool has both strengths and weaknesses, they provide a useful view into GPU performance
    while requiring only a minimal learning investment. In this way, CUDA offers a
    smooth transition to massively parallel GPU programming.'
