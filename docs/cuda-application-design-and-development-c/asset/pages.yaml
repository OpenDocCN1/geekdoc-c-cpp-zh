    # GLOBAL MEMORY


    Understanding how to efficiently use global memory is an essential requirement
    to becoming an adept CUDA programmer. Focusing on data reuse within the SM and
    caches avoids memory bandwidth limitations. This is the third most important rule
    of high-performance GPU programming, introduced in Chapter 1:


    +   1. Get the data on the GPGPU and keep it there.'
