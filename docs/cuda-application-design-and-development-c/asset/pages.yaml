    separate memory spaces, referred to as host and device memory,¹ and that some
    form of bulk data transfer is the mechanism of data transport.


    The line between the host and device memory becomes somewhat blurred when host
    memory is mapped into the address space of the GPU. In this way, modifications
    by either the device or host will be reflected in the memory of all the devices
    mapping a region of memory. Pages are transparently transferred asynchronously
    between the host and GPU(s). Experienced programmers recognize that mapped memory
    is analogous to the mmap() system call.


    Uniform Virtual Addressing (UVA) is a CUDA 4.0 feature that simplifies multi-GPU
    programming by giving the runtime to determine upon which device a region of memory
    resides purely the pointer address. Semantically, UVA gives CUDA developers the
    ability to perform direct GPU-to-GPU data transfers with cudaMemcpy(). To use
    it, just register the memory region with cudaHostRegister(). Bulk data transfers
    can occur between devices by calling cudaMemcpy(). The runtime ensures that the
    appropriate source and destination devices are used in the transfer. The method
    cudaHostUnregister() terminates the UVA data transfers for that region of memory.
    See Figure 5.1.


    > ¹ Low-end devices actually share the same memory as the host, but they do not
    change the programming model.'
