    # L1 CACHE


    Compute 2.0 devices have 64 KB of L1 memory that can be partitioned to favor shared
    memory or dynamic read/write operations. Note that the L1 cache:


    +   - Is designed for spatial and not temporal reuse. Most developers expect processor
    caches that behave as an LRU cache. On a GPU, this mistaken assumption can lead
    to unexpected cache misses, frequently accessing a cached L1 memory location does
    not guarantee that the memory location will stay in the cache.

    - Will not be affected by stores to global memory, as store operations bypass
    the L1 cache.

    - Is not coherent. The volatile keyword must be used when declaring shared memory
    that can be modified by other blocks to guarantee that the compiler will not load
    the shared memory location into a register. Private data (registers, stack, etc.)
    can be used without concern.

    - Has a latency of 10–20 cycles.


