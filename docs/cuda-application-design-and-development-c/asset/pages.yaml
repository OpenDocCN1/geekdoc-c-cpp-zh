    # WORKING WITH HIGH-DIMENSIONAL DATA


    We live in the age of data. Automatic systems collect most minute details of transactions
    and interactions in both physical and social systems. The patterns are there,
    but where?


    With a simple database query or Internet search, it is possible to extract an
    interesting data set that concatenates a number of measures (or observations)
    for each event. The events might be customer purchases or the spectral data of
    hundreds of stars. Multiple events can be represented as the rows of a matrix
    in which each row is an event and the columns of each row contain measurements
    concerning the event. A common question to ask is, “Which rows are similar to
    each other?” Phrased another way, the question becomes, “Which events, or vectors,
    are close to each other?


    For many problems, it is possible to calculate the distance between each row in
    the matrix using a metric such as Euclidean distance. Euclidean distance is a
    measure of distance that one would obtain with a ruler and the Pythagorean formula.
    Rows that are close in distance can be considered “similar” to each other and
    those that are far away are “not similar.” There are many other distance measures
    aside from Euclidean distance, but Euclidean distance is intuitively easy to understand.


    The curse of dimensionality discussed in Chapter 3 is why working in a high-dimensional
    space is not practical for many problems. For example, asking for all rows that
    are closer than some distance from a given point in high-dimensional space can
    return either no values (the sampling is very sparse) or nearly all the data (because
    the volume of the search region


