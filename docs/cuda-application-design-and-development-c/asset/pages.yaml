  md: '# CUDA for Machine Learning and Optimization


    GPGUs are powerful tools that are well-suited to unravel complex real-world problems.
    Using only the simple CUDA capabilities introduced in Chapter 1, this chapter
    demonstrates how to greatly accelerate nonlinear optimization problems using the
    derivative-free Nelder-Mead and Levenardt optimization algorithms. Single- and
    double-precision application performance will be measured and compared between
    an Intel Xeon e5630 processor and an NVIDIA C2070 GPU as an older 10-series NVIDIA
    GTX 280 gaming GPU. Working example code is provided that can train the classic
    nonlinear XOR machine-learning problem 85 times faster than a modern quad-core
    Intel Xeon processor (341 times faster than single-core performance) under Linux
    with comparable performance under Windows 7.


    At the end of the chapter, the reader will have a basic understanding of:


    +   - Two popular optimization techniques, including GPU scalability limitations
    of the Levenberg-Marquardt algorithm

    - How a CUDA-literate programmer can make significant contributions to modeling
    and data-mining efforts

    - Machine learning and why the XOR problem is important to computationally universal
    devices

    - C++ functors and how to write a single Thrust functor using _host_ and _device_
    that can run on both host and GPGPU devices

    - Some example programs that demonstrate orders-of-magnitude increased performance
    over a conventional processor on techniques that can be applied to problems in
    machine learning, signal processing, statistics, and many other fields'
