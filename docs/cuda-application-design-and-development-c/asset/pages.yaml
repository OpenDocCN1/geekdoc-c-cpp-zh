  md: '# UTILIZING IRREGULAR DATA STRUCTURES


    The preceding examples utilize very regular access patterns that tree algorithms
    stream information from global memory.


    A large body of computational problems, such as graph and tree algorithms, represents
    a worst-case scenario for coalescing parallel memory accesses on GPUs. Most of
    these algorithms exhibit irregular and even random memory access patterns.


    Graph algorithms are common in social media analysis (Corley, Farber, & Reynolds,
    2011) and Biology (Jones and Pavel, 2004), and many other fields. Tree algorithms
    are commonly used for fast data storage and retrieval. Similarly, vector gather
    and scatter operations are commonly used in sparse matrix and numerical calculations.


    A vector gather operation "gathers" data from arbitrary vector elements. See Example
    6.17, "A Vector Gather Operation":


    # Example 6.17


    ```

    for(int i = 0; i < n; i++) a[i]=b[index[i]];

    ```


    A vector scatter operation is one that "scatters" data throughout a vector in
    memory, as in Example 6.18, "A Vector Scatter Operation":


    # Example 6.18


    ```

    for(int i = 0; i < n; i++) a[index[i]]=b[i];

    ```


    Irregular memory accesses are a challenge for massively parallel computers because
    increasing memory bandwidth does not necessarily increase performance. Coalesced
    memory accesses imply that memory accesses can be grouped into a single memory
    transaction that waits on a number of consecutive bytes of information. Tables
    5.10 and 5.11 show the memory efficiencies for various use cases with caching
    enabled and disabled on compute 2.0 GPUs.


    Irregular memory accesses break the assumption that memory transactions can be
    coalesced into one or very few memory transactions. For example, the index vector
    in Example 6.16 can contain random index values that cause each thread accessing
    index[i] to generate a global memory transaction. This is a worst-case scenario
    for the SM (along with the GPU subsystem), as each warp will have wait for 32
    memory accesses to complete before the warp can issue an instruction.'
