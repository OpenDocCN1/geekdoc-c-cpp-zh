  md: '# CUDA for All GPU and CPU Applications


    Software development takes time and costs money. CUDA has evolved from a solid
    platform to accelerate numerical computation into a platform that is for all application
    development. What this means is that a single source tree of CUDA can support
    applications that run exclusively on conventional x86 processors, exclusively
    on GPU hardware, or as hybrid applications that simultaneously use all the CPU
    and GPU devices in a system to achieve maximal performance. The Portland Group,
    Inc. (PGI) native CUDA-based compiler is one realization of this maturation process
    that has CUDA/C++ a viable source platform for generic application development,
    just like C++ and Java. Unlike Java and other popular application languages, CUDA
    can efficiently support tens of thousands of concurrent threads of execution.
    CUDA also supports the conventional approach to cross-language development that
    uses language bindings to interface with existing languages. As with other languages,
    libraries simplify application development and handle commonly used methods as
    linear algebra, matrix operations, and the Fast Fourier Transform (FFT). Dynamic
    compilation is also blurring the distinction between CUDA and other languages,
    as exemplified by the Copperhead project (discussed shortly), lets Python programmers
    write their code entirely in Python. The Copperhead runtime then dynamically compiles
    the Python methods to run on CUDA-enabled hardware.


    At the end of this chapter, the reader will have a basic understanding of:


    +   - To transparently build and run CUDA applications on non-GPU systems and
    GPUs manufactured by any vendor.

    - The Copperhead project, which dynamically compiles Python for CUDA execution.


    > ¹ http://www.pgroup.com/.'
