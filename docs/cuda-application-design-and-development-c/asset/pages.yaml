    communicate through the CUDA shared memory spaces and via atomic memory operations.

    A kernel should utilize many threads to perform the work defined in the kernel
    source code. This utilization is called thread-level parallelism, which is different
    than instruction-level parallelism, where parallelization occurs over processor
    instructions. 1.2 illustrates the use of many threads in a parallel fill as opposed
    to the single-threaded fill operation illustrated in Example 1.1.


    An execution configuration defines the number of threads that will run the kernel
    plus their arrangement in a 1D, 2D, or 3D computational grid. An execution configuration
    encloses the configuration information between triple angle brackets "<<<" that
    follow after the name of the kernel and the parameter list enclosed between the
    parentheses. Aside from the execution configuration, queuing a kernel looks very
    similar to a subroutine call. Example 1.7 demonstrates this syntax with the call
    to fillKernel()


    +   The largest shared region of memory on the GPU is called global memory. Measured
    in gigabytes of RAM, most application data resides in global memory. Global coalescing
    rules combine multiple memory transactions into single large operations that can
    attain the highest transfer rate and from memory. In general, best performance
    occurs when memory accesses can be coalesced into 128 consecutive byte chunks.


    Other forms of onboard GPU-accessible memory include constant, cache, shared,
    local, texture, and register memory, as discussed in Chapter 5.


    The latency in accessing global memory can be high, up to 600 times slower than
    accessing a register variable. CUDA programmers should note that although the
    bandwidth of global memory seems high, around 160–200 GB/s, it is slow compared
    to the teraflop performance capability that a GPU can deliver. For this reason,
    data reuse within the GPU is essential to achieving high performance.


