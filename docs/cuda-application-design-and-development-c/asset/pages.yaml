  md: '# Mixing CUDA and Rendering


    With the focus on the use of CUDA to accelerate computational tasks, it is easy
    to forget that GPU technology is also a splendid platform for visualization. In
    combination with the Open Graphics Library (OpenGL), CUDA-enabled GPUs become
    visualization supercomputers. Even highly experienced OpenGL programmers will
    find this chapter both new and informative, as the examples use primitive restart—a
    feature recently added to the OpenGL 3.1 standard—to render high-performance,
    high-quality graphics when the images require irregular meshes. Example kernels
    demonstrate data sharing between CUDA and OpenGL through buffer sharing. Profiling
    shows that primitive restart is 60 times faster than the optimized OpenGL multiDraw()
    method because it avoids performance robbing transfers across the PCIe bus. This
    chapter will also discuss how primitive restart can produce images of higher quality
    than other OpenGL methods and optimize texture rendering as well. Readers note
    that this chapter is intended to teach how to mix CUDA and OpenGL in the same
    application and demonstrate the speed of the methods used. The provided software
    framework is quite general and can be used for experiment merely by changing the
    CUDA kernel. For example, Chapter 12 will use this framework with live video streams
    from webcam. Those who wish a more detailed discussion of OpenGL should look to
    the many other, far more detailed books and Internet tutorials that teach OpenGL
    and computer graphics.


    At the end of this chapter, the reader will have a basic understanding of:


    +   - Mixing OpenGL and CUDA in the same application.

    - How to use primitive restart and why it can generate images of higher quality
    than other methods.

    - The performance implications of primitive restart for CUDA and in comparison
    to other OpenGL rendering techniques.'
