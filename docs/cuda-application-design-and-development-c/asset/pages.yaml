  md: '# CHAPTER 5: CUDA Memory


    Clearly, it is necessary to reuse the data within the SM to achieve high performance.
    Only by exploiting data locality can a programmer minimize global memory transactions
    and keep data in fast memory. GPGPUs support two types of locality that accelerate
    both computational and rendering applications.


    ![](img/4468c911ce4bde7a67079b9c80978769_131_0.png)


    +   - Temporal locality: assumes that a recently accessed data is likely to be
    used in the near future. Many computational applications demonstrate this LRU
    (Least Recently Used) behavior.

    - Spatial locality: neighboring data is cached with the expectation that spatially
    adjacent memory locations will be used in the near future. Rendering operations
    tend to have high 2D spatial locality.


    As can be seen in Figure 5.2, the SM also contains constant (labeled Uniform cache
    in the figure) and texture memory caches. Though desirable, the L1 and L2 caches
    in compute 2.0 devices have subsumed much of the capability of these memory spaces.
    When programming compute 2. devices, constant memory must be used when data needs
    to be efficiently broadcast to all the threads. Texture memory can be used as
    a form of cache to avoid global memory bandwidth limitations and handle small
    irregular memory accesses (Haixiang, Schmidt, Weiguo, & Müller-Wittig, 2010).
    However, the texture cache is relatively small—on the order of 8 KB. Of course,
    visualization is the intended usage and greatest value for texture memory across
    all compute device generations.


    Compute 2.0 devices add an L1 cache to each SM and a unified L2 cache that fits
    between the SM and global memory, as shown in Figure 5.1.


    # L2 CACHE


    The unified L2 (Level 2) cache is a tremendous labor-saving device that works
    as a fast data store accessible by all the SM on the GPU. A great


