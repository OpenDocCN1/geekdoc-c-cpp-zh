    # Support Vector Machines


    Support vector machines (SVM) are a popular machine learning method to analyze
    data and recognize patterns. An SVM performs classification by constructing an
    N-dimensional hyperplane (a plane generalized into N dimensions) that optimally
    separates the data into two categories. They are used for classification and regression
    analysis, among other tasks. SVM models are closely related to neural networks.
    In fact, an SVM model using a sigmoid kernel function is equivalent to a two-layer
    perceptron neural network. Speedups of 150 times on a GPU have been reported in
    the literature (Catarano, Sundaram, & Keutzer, 2008).


    SVM can also be implemented as a factor in the optimization framework provided
    in this book. The cuSVM package can be freely downloaded from the Internet. This
    same package is accessible from the R statistical language via the gpuTrain()
    method in the gputools package. Speedups between 22 and 172 times the rate of
    state-of-the-art software are reported by the author (Carpenter, 2011). The CUDA-SVM
    package from Nanyang Technological University is available on http://sourceforge.net.
    Another SVM package-all, multivsim, can be freely downloaded from http://code.google.com.


    # Bayesian Networks


    A Bayesian belief is a directed graph, together with an associated set of probability
    tables. The nodes represent variables, which can be discrete or continuous. The
    arcs in the graph represent causal/influential relationships between variables.
    The key feature of Bayesian networks is that they can be used to reason about
    uncertainty. When used in conjunction with statistical techniques, these graphical
    models have several advantages for data analysis:


    +   - Because the model encodes dependencies among all variables, it can handle
    missing data.


    +   - A Bayesian network can be used to learn causal relationships, and hence
    can be used to gain an understanding about a problem domain and to predict the
    consequences of intervention.


    +   - Bayesian statistical methods in conjunction with Bayesian networks offer
    an efficient and principled approach for avoiding the overfitting of data.


    > ⁷ http://www.nvidia.com/object/meme_on_tesla.html.

    ⁶ http://patternasoncreen.net/cuSVM.html.'
