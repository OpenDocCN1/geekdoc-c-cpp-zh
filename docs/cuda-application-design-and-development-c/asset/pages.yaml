  md: '# CHAPTER 1: First Programs and How to Think in CUDA


    Which API to use depends on the amount of control the developer wishes to exert
    over the GPU. Higher-level APIs like the C++ Thrust API are convenient, as they
    do for the programmer, but they also make decisions on behalf of the programmer.
    In general, Thrust has been shown to deliver higher computational performance,
    generality, and convenience. It also makes code development quicker and can produce
    easier to read code that many will argue is more maintainable. Without modification,
    programs written in Thrust will mostly maintain or improve performance Thrust
    methods like reduction perform significant work, which gives the Thrust API developers
    much freedom to incorporate features in the latest hardware that can improve performance.
    Thrust is an example of a well-designed API that is simple yet general and that
    has the ability to be adapted to performance as technology evolves.


    A disadvantage of a high-level API like Thrust is that it can isolate the developer
    from the hardware and expose only a subset of the capabilities. In some circumstances,
    the C++ interface can become cumbersome or verbose. Scientific programmers in
    particular may find that the clarity of simple loops can get lost in the C syntax.


    Use a high-level interface first and choose to drop down to a lower-level API
    when you think the additional programming effort will deliver greater performance
    or to use some of lower-level capability needed to better support your application.
    The CUDA runtime in particular was designed to give the developer access to all
    the programmable features of the GPGPU with a few simple elegant and powerful
    syntactic additions to the C-language. As a result, CUDA runtime code can sometimes
    be the cleanest and easiest API to read; it can be extremely efficient. An important
    aspect of the lowest-level driver interface is that it can provide very precise
    control over both queuing and data transfers.


    Expect code size to increase when using the lower-level interfaces, as the developer
    must make more API calls and/or specify more parameters for each call. In addition,
    the developer needs to check for runtime errors and version incompatibilities.
    In many cases using low-level APIs, it is not unusual for many lines of the application
    code to be focused on the details of the API interface than on the actual work
    of the task.


    Happily, modern CUDA developers are not restricted to use just single API in an
    application, which was not the case prior to the CUDA 3.2 release in 2010. Modern
    versions of CUDA allow developers to use any of the three APIs in their applications
    whenever they choose. Thus, an initial code can be written in a high-level API
    such as Thrust and then refactored to use some special characteristic of the runtime
    or driver API.'
