  md: 'applications. MATLAB GPU support is available in the Parallel Computing Toolbox.
    It supports NVIDIA CUDA-enabled GPUs of compute 1.3 and higher. Third-party products
    such as those by Accelereyes provide both MATLAB access to GPU computing as well
    as matrix libraries for CUDA.$^{12}$


    # LIBRARIES


    The use of optimized libraries are often an easy way to improve the performance
    of an application. When porting large legacy projects, libraries may be the only
    real way to optimize for a new platform because code changes would require extensive
    validation efforts. Essentially, libraries are convenient and can accelerate code
    development as well as application performance, but they cannot be blindly utilized.
    GPU-based libraries in particular require the developer to think carefully about
    data placement and how the library is used, or poor performance and excessive
    memory consumption will result.


    # CUBLAS


    The Basic Linear Algebra Subprograms (BLAS) package is the de facto interface
    for basic linear algebra operations such as vector and matrix multiplication.
    NVIDIA supports this interface with their own library for the GPU called CUBLAS.
    The basic model by which applications use the CUBLAS library is to create and
    vector objects in GPU memory space, fill these objects with data, call a sequence
    of CUBLAS functions, and return the result(s) to host


    CUBLAS provides helper functions to create and destroy objects in GPU space and
    to utilize these objects. CUDA programmers should note that CUBLAS uses column-storage
    and 1-based indexing for maximum FORTRAN compatibility. C and C++ applications
    need to use macros or inline functions to facilitate access to CUBLAS created
    objects.


    Chapter 1 contains a discussion of the BLAS runtime levels and the importance
    of minimizing or eliminating data movement. The simpleBLAS example, which can
    be downloaded from the NVIDIA website, provides a basic demonstration of how to
    use CUBLAS.$^{13}$


    # CUFFT


    CUFFT is another NVIDIA supported library that provides a GPU based implementation
    of the FFT, a commonly used method in signal and processing applications. CUFFT
    is modeled after FFTW, a highly optimized and popular FFT package for general-purpose
    processors.


    $^{12}$ http://www.accelereyes.com/


    $^{13}$ http://www.nvidia.com/object/cuda_sample_linear_algebra.html.'
