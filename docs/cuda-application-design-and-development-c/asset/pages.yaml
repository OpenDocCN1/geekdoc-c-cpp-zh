    ```\n\nprefetch is a persistent functor that keeps a pointer to device memory.\
    \ Each call to the functor returns the vector indexed by i. Prior to returning\
    \ the vector element, the index is checked to see whether it is possible to fetch\
    \ the next grid of data values (e.g., N_BLOCKS*N_THREADS values) from global memory.\n\
    \nThe prefetch index can be tested for validity because _functionReduce() traverses\
    \ the vector in reverse order. Testing that the index is greater than equal to\
    \ zero ensures only elements in the array will be prefetched. If the index is\
    \ valid, the PTX.global.L2 assembly instruction is used to perform the prefetch.\
    \ This instruction is valid only for compute 2.0 devices. See Example 6.12, \"\
    Part 2 of testPreCu\":\n\n# Example 6.12\n\n```\ntemplate<class T1, class T2>\n\
    struct prefetch : public thrust::unary_function<T1,T2> { \nconst T1* data;\nprefetch(T1*\
    \ data) : data(data) {_\n  __device__\n // This method fetches the previous grid\
    \ of data point into the L2.\nT operator()(T1 i) {\nif((i-N_BLOCKS*N_THREADS)\
    \ > 0) (_prefetch the previous grid\n const T1* pt = &data[i - (N_BLOCKS*N_THREADS)];\n\
    \  asm volatile(\"prefetch.global.L2 [%0]:*%1\"(pt));\n}\n return data[i];\n};\n\
    ```\n\nThe memFetch() functor is similar to the prefetch() functor except that\
