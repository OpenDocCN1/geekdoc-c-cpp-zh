    for the Department of Energy (DOE) Office of Sciences that is capable of gathering
    performance information through instrumentation of functions, methods, basic blocks,
    and statements. All C++ features are supported, including templates and namespaces.
    TAU''s profile visualization tool, paraf, provides graphical displays of all the
    performance results in aggregate and single node/context/thread forms. The user
    can quickly identify sources of performance bottlenecks in the application using
    the GUI. In addition, TAU can generate event traces that can be displayed with
    the Vampir, Paraver, or Jumpshot trace tools.


    The paper "Parallel Performance Measurement of Heterogeneous Parallel Systems
    with GPUs" is the latest publication about the CUDA implementation (Malony et
    al., 2011; Maloney, Biersdorfff, Spear, & Maylangama, 2010). The software is available
    for free download from the Performance Research Laboratory (PRL).


