    # SUMMARY


    MPI and GPUDirect give CUDA programmers the ability to run high-performance applications
    that far exceed the capabilities of a single GPU or collection of GPUs inside
    a single system. Scalability and performance within a node are key metrics to
    evaluate distributions. Applications that exhibit linear or near-linear scalability
    have the ability to run on the current and future machines. For example, the parallel
    mapping discussed in this chapter, plus Chapters 2 and 3, is now nearly 30 years
    old. At the time it was designed, a teraflop of computing power was decades beyond
    the reach of even the largest government research organizations. Today, it runs
