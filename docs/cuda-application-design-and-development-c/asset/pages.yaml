    # CUDA EXTENDS PARALLELISM


    A CUDA application interacts with the GPU hardware through the device driver as
    shown in Figure 7.1.


    The driver supports multiple concurrent applications by creating a separate context
    for each GPU-based application that runs on the system. The context contains all
    of the driver state information required by as the virtual address space, streams,
    events, allocated blocks of memory, and other data necessary to run a GPU-based
    application. By switching contexts, the device driver acts like a small operating
    system that can multitask multiple GPU applications. For example, a user can run
    multiple OpenGL rendering applications multiple CUDA computational applications
    at the same time. In a similar fashion, the GPU device driver lets CUDA applications
    utilize multiple devices simply by giving the application access to multiple contexts
    in the device driver.


    Only one context can be active at a time, which is why the CUDA driver incorporates
    a timer to detect GPU applications that hang while performing some operation on
    the GPU. Mistakenly running a CUDA kernel that contains an infinite loop is one
    example of an application that will cause a timeout. The good news is that control
    eventually reverts to the user so that he or can correct the problem without rebooting
    the system.


    By default, CUDA creates a context during the first call to a function that changes
    the state of the driver. Calling cudaMalloc is one such call that changes the
    context state. Many CUDA programmers rely on this default behavior to transparently
    utilize a single GPU. Note that a context is usually created


