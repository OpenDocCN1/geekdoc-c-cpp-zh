    user. This chapter modifies the source code from Chapter 9 to process and display
    live video streams. For those who do not have a webcam, live video can be imported
    from other machines via a TCP connection, or on-disk movie files can be used.
    Aside from being just plain fun, real-time video processing with CUDA opens the
    door to new markets in augmented reality, games, heads-up displays, face, and
    other generic vision recognition tasks. The example code in this chapter teaches
    the basics of isolating faces from background clutter, edge detection with a Sobel
    filter, and morphing live video streams in three dimensions. The teraflop computing
