    **The NVIDIA NVCC Compiler**

    The NVIDIA nvcc compiler can generate host- and device-based kernels. Chapter
    2 utilized this capability for testing and performance analysis purposes. Though
    very useful, this approach requires manual effort on the part of the CUDA programmer
    to set up memory correctly and to call the functor appropriately.


    Thrust can also transparently generate code for different backends such as x86
    processors by just passing some additional command-line options to nvcc. No source
    code modification is required.


    The following nvcc command-line demonstrated building the NVIDIA SDK Monte Carlo
    example to run on the host processor:


