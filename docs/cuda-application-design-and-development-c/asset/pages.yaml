  md: '# FIGURE 2.1


    An example of a perceptron.


    In 1969, a famous book entitled Perceptrons (Minsky & Papert, 1969) showed that
    it was not possible for a single-layer neural network, at that time called a perceptron
    (Figure 2.1), to represent the fundamental XOR logical function. The impact was
    devastating, as funding and interest in the nascent field of neural networks evaporated.


    More the ten years passed until neural network research suddenly experienced a
    resurgence of interest. In the mid-1980s, a paper demonstrated that neural models
    could solve the Traveling Salesman Problem (Hopfield & Tank, 1985). Shortly thereafter,
    the backpropagation algorithm was created (Rummelhart, Hinton, & Williams, 1986;
    The PDP Research Group, 1987). A key demonstration showed it was possible to train
    a multilevel ANN to replicate an XOR truth table. In the following years, the
    field of neural network research and other related machine learning fields exploded.


    The importance of being able to learn and simulate the XOR truth table lies in
    understanding the concept of a computationally universal device. Universal Turing
    machines are an example of a computationally universal device (Hopcroft & Ullman,
    2006) because they can, in theory, be used to simulate any other computational
    device.


    Distinguishing ANN from perceptrons, Andreas Weinberg observes:


    The computational power drastically increases when an intermediate layer of nonlinear
    units is inserted between inputs and outputs. The example of XOR nicely emphasizes
    the importance of hidden units: they re-represent the input such that the problem
    becomes linearly separable. Networks without hidden units cannot learn to memorize
    XOR, whereas networks with hidden units can implement any Boolean function. (Hertz,
    Krogh, & Palmer, 1991, p. 6)


    In other words, the ability to simulate XOR is essential to making the argument
    that multilayer ANNs are universal computational devices and without any hidden
    neurons are limited computational devices. It is the extra nonlinear hidden layers
    that give ANNs the ability to simulate'
