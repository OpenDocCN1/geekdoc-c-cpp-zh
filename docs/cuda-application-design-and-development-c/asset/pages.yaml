    \n# Perlin Noise\n\nMany people use random number generators to add variation\
    \ and unpredictability to their applications. Landscapes exhibit both variation\
    \ and seeming unpredictability, but not purely at random. Instead they vary at\
    \ different scales, meaning they have various levels of detail. A mountain range\
    \ demonstrates this variation in scale:\n\n+   - Large scale: the outline of the\
    \ mountain range.\n- Medium scale: various hills, valleys, and other features.\n\
    - Small variation: boulders and rock outcroppings are common examples.\n- Tiny\
    \ variations: stones and the bumps you see when hiking on a trail.\n\nPerlin noise\
    \ is function for generating coherent noise over a space. Coherent noise means\
    \ that for any two points in the space, the value of the noise function changes\
    \ smoothly as you move from one point to the other; that is, there are no discontinuities.\
    \ Natural phenomena tend to exhibit the same pattern of large and small scales.\
    \ The Perlin function recreates this natural effect by simply adding up noisy\
    \ functions at a range of different scales.\n\nIn 1997, Ken Perlin received an\
    \ academy award for developing the Perlin noise generator. Perlin noise has a\
    \ multitude of uses ranging from the creation of natural textures to artificial\
    \ terrain and even worlds! Numerous websites discuss Perlin noise. Ken Perlin's\
    \ homepage is an excellent place to start.\n\n$^7 http://cs.nyu.edu/~perlin/."
