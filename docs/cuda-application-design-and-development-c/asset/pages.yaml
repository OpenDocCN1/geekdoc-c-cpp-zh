  md: 'OpenGL offers other optimized rendering methods aside from primitive restart,
    such as multiDraw(). However, these methods, as the primitive restart specification
    notes, "still remain more expensive than one would like" (Craighead, 2002).


    Following is a performance comparison of primitive restart against other OpenGL
    rendering methods. Primitive restart is clearly faster. These tests were performed
    using an Intel 2.3 GHz Core Duo processor running Linux with an NVIDIA GTX 280
    CUDA-enabled GPU running the Perlin kernel from this chapter to generate a virtual
    terrain


    When interpreting these numbers, it is important to understand that these frame
    rates include the time required to recreate the 3D position and color for every
    vertex and color in the image. This represents a worst-case frame-rate scenario
    that demonstrates the power and speed with hybrid CUDA/OpenGL applications. Real
    applications will undoubtedly deliver higher performance by recalculating the
    minimum data necessary to render the scene.


    Table 9.1 Approximate Performance Number on GTX 280

    | Method | Observed FPS | Rough Average (FPS) |

    |---|---|---|n| Simple one by one | 470–500 | 500 |

    | MultiDraw | 490–510 | 508 |

    | Primitive Restart | 550–590 | 560 |


    More details can be found in parts 18⁵ and 20⁶ of my freely available "Supercomputing
    for the Masses" CUDA tutorials on the Doctor Dobb''s Journal website.


    The timeline in Figure 9.4 from Parallel Nsight shows that the Perlin kernel consumes
    very little time compared to the OpenGL buffer swapping.


    The OpenGL API Call Summary in Parallel Nsight reports the following time for
    each rendering method.


    +   - Primitive restart: around 60 µs (microseconds).

    - Multidraw: around 3,900 µ.

    - Iteratively drawing each triangle fan: approximately 1,100,000 µ.'
