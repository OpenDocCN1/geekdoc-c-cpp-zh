  md: '# The CUDA Tool Suite: Profiling a PCA/NLPCA Functor


    CUDA enables efficient GPU computing with just a few simple additions to the C
    language. Simplicity of expression, however, does not equate to simplicity of
    program execution. When developing applications for any computer, identifying
    performance bottlenecks can be complicated. Following the same economy of change
    used to adapt C and C++, NVIDIA has extended several popular profiling tools to
    support GPU computing. These are tools that most Windows and UNIX developers are
    already proficient and comfortable using as gprof and Visual Studio. Additional
    tools such as hardware-level GPU profiling and a visual profiler have been added.
    Those familiar with building, debugging, and profiling software under Windows
    and UNIX should find the transition to CUDA straightforward. All CUDA tools are
    freely available on the NVIDIA website including the professional edition of Parallel
    Nsight for Microsoft Visual Studio.


    In this chapter, the Microsoft and UNIX profiling tools for CUDA will be used
    to analyze the performance and scaling of the Nelder-Mead optimization when optimizing
    a PCA and NLPCA functor.


    In the end of the chapter, the reader will have a basic understanding of:


    +   - PCA and NPLCA analysis, including the applicability of this technique to
    data mining, dimension reduction, feature extraction, and other data analysis
    and pattern recognition problems.

    - How the CUDA profiling tools can be used to identify bottlenecks and scaling
    issues in algorithms.

    - Scalability issues and how even a simple dynamic memory memory allocation can
    have dramatic performance implications on an application.'
