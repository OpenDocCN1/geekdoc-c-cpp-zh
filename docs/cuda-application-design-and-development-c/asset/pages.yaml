  md: '# CUDA MEMORY TYPES


    Table 5.4 summarizes the characteristics of the various CUDA memory spaces for
    compute 2.0 and later devices.


    | Table 5.4 CUDA Memory Types and Characteristics |

    | Memory | Location | Cached | Access | Scope |

    |---|---|---|---|---|n| Register | On-chip | No | Read/write | One thread |

    | Local | On-chip | Yes | Read/write | One thread |

    | Shared | On-chip | N/A | Read/write | All threads in a block |

    | Global | Off-chip (uncached) | Yes | Read/write | All threads + host |

    | Constant | Off-chip (uncached) | Yes | Read | All threads + host |

    | Texture | Off-chip (uncached) | Yes | Read/write | All threads + host |


    # Registers


    Registers are the fastest memory on the GPU. They are a very precious resource
    because they are the only memory on the GPU with enough bandwidth and low latency
    to deliver peak performance.


    Each GF100 SM supports 32 K 32-bit registers. The maximum number of registers
    that can be used by a CUDA kernel is 63, due to the limited number of bits available
    for indexing into the register store. The number of available registers varies
    on a Fermi SM:


    +   - If the SM is running 1,536 threads,

    - The number of available registers degrades gracefully from 63 to 21 as the workload
    (and hence resource requirements) increases by number of threads.


    Register spilling on GF100 SM increases the importance of the L1 cache because
    it can preserve high performance. Be aware that pressure register spilling and
    the stack (which can consume 1 KB of L1 storage) can increase the cache miss rate
    by forcing data to be evicted.


    # Local memory


    Local memory accesses occur for only some automatic variables. An automatic variable
    is declared in the device code without any of the __shared__ or __constant__ qualifiers.
    Generally, an automatic variable resides in a register except for the following:


    +   - Arrays that the compiler cannot determine are indexed with constant quantities.

    - Large structures or arrays that would consume too much register space.

    - Any variable the compiler decides to spill to local memory when a kernel uses
    more registers than are available on the SM.'
