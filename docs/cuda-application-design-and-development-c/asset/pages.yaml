  md: '# CHAPTER 2: CUDA for Machine Learning and Optimization


    Thrust utilizes functors to perform the work of the transform and reduction operations
    as well as generic methods. In C++, a functor overloads the function call operator
    "()" so that an object may be used in place of an ordinary function. This has
    several important implications:


    +   1. Functors can be passed to generic algorithms like thrust::transform_reduce
    like C-language programmers utilize pointers to functions.

    2. Passing and using functors is efficient, as C++ can inline the function code.
    This eliminates function call overhead and allows the compiler to perform more
    extensive optimizations.

    3. C++ functors can maintain a persistent internal state. As you will see, this
    approach can be very useful when working with different device, GPU, and thread
    memory states.


    Inlining of functors is essential to performance because common functors as thrust::plus
    perform only tiny amounts of computation. The ability to inline functions, generic
    methods like thrust::transform_reduce would not be possible because function call
    overhead would consume nearly much as (or more) time than the functor itself.


    The Thrust documentation speaks of kernel fusion, which combines functors into
    a single kernel. Our second rule of GPGPU coding, kernel fusion increases GPGPU
    utilization per kernel invocation, which can avoid kernel startup latencies. Just
    as important, many generic methods like the thrust::transform_reduce template
    avoid performance robbing storage of intermediate values to memory as the functor
    calculations are performed on the fly. The latter point meets the requirements
    of our third rule of GPGPU programming: focus on data reuse within the GPGPU to
    avoid memory bandwidth limitations. TheXPY example in the Thrust Quick Start guide
    provides a clear and lucid demonstration of the performance benefits of kernel
    fusion.


