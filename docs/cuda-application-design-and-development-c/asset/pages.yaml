    # Edge Detection


    Finding edges is a fundamental problem in image processing, as edges define object
    boundaries and represent important structural properties in an image. There are
    many ways to perform edge detection. The Sobel method, or Sobel filter, is a gradient-based
    method that looks for strong changes in the first derivative of an image.


    The Sobel edge detector uses a pair of $3\times3$ convolution masks, one estimating
    the gradient in the x-direction and the other in the y-direction. This detector
    maps maps well to CUDA, as each thread can apply the $3\times3$ convolution masks
    to its pixel and adjoining pixels in the image.


    Tables 12.1 and 12.2 contain the values for the Sobel masks in each direction.


    The approximate magnitude of the gradient, G, can be calculated using:


    ```

    |G| = |G_x| + |G_y|

    ```


    Figure 12.3 is a color inverted grayscale image created using a Sobel filter.


