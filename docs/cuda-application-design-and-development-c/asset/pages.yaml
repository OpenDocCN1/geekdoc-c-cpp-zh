    BLAS is structured according to three different levels with increasing data and
    runtime requirements:


    +   - Level-1: Vector-vector operations that require O(N) data and O(N) work Examples
    include taking the inner product of two vectors or scaling a vector by a constant
    multiplier.

    - Level-2: Matrix-vector operations that require O(N²) work Examples include matrix-vector
    multiplication or a single right-hand-side triangular solve.

    - Level-3: Matrix-matrix operations that require O(N²) and O(N³) work Examples
    include dense matrix multiplication.


    1.2 illustrates the amount of work that performed by each BLAS level, assuming
    that N floating-point values are transferred from the host to the GPU. It does
    not take into account the time to transfer the data back to the GPU.


    1.2 us that level-3 BLAS operations run efficiently on graphics processors because
    they perform O(N) work for every floating-point value transferred to the GPU.
    The same-work-per-datum analysis applies to non-BLAS-related computational problems
    as well.


    To illustrate the cost of a level-1 BLAS operation, consider the overhead involved
    in moving data across the PCIe bus to calculate cub(x) on the GPU and return the
    value to the host. The Scal(x) method scales a vector by a constant value. CUBLAS
    includes a interface for FORTRAN compatibility. By transferring data from the
    host to the GPU, performing the calculation, and then transferring the data back
    to the host. Thinking is inefficient, as it requires moving 4N bytes data (where
    N is the number of floats in the vector) twice across the bus to perform N multiplications,
    as shown in Example 1.10. The best possible performance would be the transfer
    bandwidth divided by eight (to account for two transfers of 4 bytes of data each),
    as the time to perform the multiplication would be tiny compared to the data transfers.
