  md: '# PCA AND NLPCA


    Principal Components Analysis (PCA) is extensively used in data mining and data
    analysis to (1) reduce the dimensionality of a data set and (2) extract features
    from a data set. Feature extraction refers to the identification of the salient
    aspects or properties of data to facilitate it in a subsequent task, such as regression
    or classification (Duda & Hart, 1973). Obviously, extracting the principal features
    of a data set can help with interpretation, analysis, and understanding.


    PCA analysis accounts for the maximum amount of variance in a data set using a
    set of straight lines where each line is defined by a weighted linear combination
    of the observed variables. The first line, or principle component, accounts for
    the greatest amount of variance; each succeeding component accounts for as much
    variance as possible while remaining orthogonal to (uncorrelated with) the preceding
    components. For example, a cigar-shaped distribution would require a single line
    (or principal component) to account for the variance in the data set illustrated
    in Figure 3.1.


    PCA utilizes straight lines; NLPCA can utilize continuous open or closed curves
    for variance in data (Hsieh, 2004). A circle is one example of a closed curve
    that joins itself so there are no endpoints. Figure 3.2 illustrates an open curve.
    As a result, NLPCA has the ability to represent linear problems in a lower dimensional
    space. Figure 3.2 illustrates one data set in which a single curve could account
    for most of the variance.


    ![](img/4468c911ce4bde7a67079b9c80978769_83_0.png)


    Figure 3.1

    A linear PCA data set.'
