  md: "# The Message Passing Interface (MPI) 25\n\nUsually mpiexec is used to start\
    \ an MPI application. Some legacy implementations use mpirun. Example 10.4 shows\
    \ the command and output when running the example with two MPI processes:\n\n\
    # Example 10.4\n\n```\n$ mpiexec -np 2 ./basicMPI\nNumber of tasks=2 My rank=1\n\
    Number of tasks=2 My rank=0\n```\n\n# Master-Slave\n\nA common design pattern\
    \ in MPI programs is a master-slave paradigm. Usually the process is designated\
    \ as rank 0 is defined as the master. This process then directs the activities\
    \ of all the other processes. The code snippet in Example 10.5, \"A Master-Slave\
    \ MPI Snippet,\" illustrates how to structure master-slave MPI code:\n\n# Example\
    \ 10.5\n\n```\nMPI_Comm_size(MPI_COMM_WORLD,&numtasks);\nMPI_Comm_rank(MPI_COMM_WORLD,&rank);\n\
    if(rank == 0)\n    // put master code here\nelse{\n    // put slave code here\n\
    }\n```\n\nThis chapter uses the master-slave programming pattern. MPI supports\
    \ many other design patterns. Consult the Internet or one of the MPI books for\
    \ more information. A good reference is Using MPI (Gropp, Lusk, & Skjellium, 1999).\n\
    \n# Point-to-Point Basics\n\nMPI point-to-point communication sends messages between\
    \ two different MPI processes. One process performs a operation while the other\
    \ performs a matching read. MPI guarantees that every message will arrive without\
    \ errors. Care must be exercised when using MPI, as deadlock occurs when the send\
    \ and receive operations do not match. Deadlock means that neither the sending\
    \ nor receiving process can proceed until the other completes its action, which\
    \ will never happen when the send and receive operations do not match. CUDA avoids\
    \ deadlock by sharing data between the threads of a thread block with shared memory.\
    \ This frees the CUDA"
