    | 运算符 | 用途 | 示例 | 结果 |

    |---|---|---|---|

    | + | 将两个数字相加 | i=3+2 | 5 |

    | | 用于减法 | i=3-2 | 1 |

    | * | 用于乘法 | i=3*2 | 6 |

    | / | 用于除法 | i=3/2 | 1 |

