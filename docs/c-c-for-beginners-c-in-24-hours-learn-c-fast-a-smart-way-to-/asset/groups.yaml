    # Chapter Five – Conditionals


    It''s great to have a program that does single, linear tasks, like saying ''Hello'',
    but it''s rare that you''re going to come across for the need of a program that
    does linear tasks only. Programs usually use something known as conditions, or
    statements that branch the code into different paths depending on whether a condition
    is true or not. It''s like a fork on the road, basically.


    C++ conditionals have the form of if statements. For example, if something is
    true, execute this line of code, if something is false, execute another line of
    code. Take a look at the following code piece as an example.


    ```cpp

    1 int a;

    2

    3 if (a<2)

    4 {

    5 cout<<"a is less than 2\n";6 }

    ```


    Lines one through five should be pretty obvious to you by this point, but line
    three is the one where you may need a little explanation. This is the example
    of the if statement. It operates by first taking the matter of the integer variable
    a, and checks to see if it''s less than 2. If that''s true, then it''ll run the
    code that''s in the curly brackets.


    If it''s not, then it will continue as if the piece of code didn''t exist. We
    know that 1 or the value of a is less than 2, so if you were to run this program,
    then you''d see ''a is less than 2!'' on the screen.


