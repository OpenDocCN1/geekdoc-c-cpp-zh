    你学习了如何输出文本、声明变量和获取输入，但你并没有对变量进行任何操作。当然，你可以给它们赋值，但在现实世界中这有什么用呢？你真正需要的是一种在不费力的情况下操作变量的方法。幸运的是，运算符将拯救你！


