- md: "\n# The Ultimate Beginners Guide\n\n# C++\nFOR BEGINNERS\n\n![](img/ff37a0bcb18b4a432276b7406e26478e_0_0.png)\n\
    \n# A Smart Way To Learn C++\nPlain, Fast and Easy Steps\n\n# STANLEY HOFFMAN\n\
    \n# C++\n\n# C++ for Beginners, C++ in 24 Hours,\nLearn C++ fast!\n\n# Introduction\n\
    \nC++ is an up and coming programming language that is based on objects and compiling.\
    \ If you’re someone who’s never programmed before, you might be confused by the\
    \ words object and compiling.\n\nA program that utilizes compiling is read by\
    \ the computer’s CPU rather than being interpreted by a program installed on the\
    \ computer to run that program. Therefore, the program speaks more to the computer’s\
    \ processing system rather than a program.\n\nYou may already know this, but computers\
    \ are not able to read letters and have to read binary code, so the code has to\
    \ be translated into a computer readable one. This is known as compiling. Now,\
    \ object-oriented code is just how the code is structured. You’ll understand that\
    \ tidbit a little better in the following chapters.\n\nSo what does all mean and\
    \ why do you need to know it? As a programmer using C++, you’re going to need\
    \ more than just the average text editor. There are only a few programming languages\
    \ where that’s all you need, and they are not really programming languages. One\
    \ of the things you are going to know is a compiler.\n\nAnother thing you’re going\
    \ to want is an Integrated Development Environment, also known as an IDE. This\
    \ is a programmer-oriented text editor that has syntax highlighting and is compiler\
    \ integrated. For Windows and Linux, you can use a few different options.\n\n\
    You don’t really need an IDE because a basic text editor will do, but something\
    \ like Notepad is going to make things a little more difficult. Word processors\
    \ are also a bad choice because they have autocorrect with spelling and grammar,\
    \ which will mess up your code if you’re not careful.\n\nTo begin with C++, you\
    \ should understand that it has a rigid syntax. This means the code is case sensitive,\
    \ so typing ‘Hello’ is going to be different from typing ‘hello’. In addition,\
    \ you should know that the programming language doesn’t care much about white\
    \ space, so don’t worry about it.\n\nSo that’s all you need to know about C++\
    \ when you first begin. Let’s get into some actual coding to get you started!\n\
    \nI think the next book will also be interesting for you:\n\n**Computer Hacking**\
    \ by Matt Benton\n\n![](img/ff37a0bcb18b4a432276b7406e26478e_4_0.png)\n\n# Contents\n\
    \n- Introduction\n- Chapter One – Your First Program\n- Chapter Two – Variables\n\
    \  - Using Variables\n- Chapter Three – Expanding Your Program\n  - istream Library\n\
    - Chapter Four – Operators\n- Chapter Five – Conditionals\n- Chapter Six – Loops\n\
    - Chapter Seven – Arrays\n- Chapter Eight – Functions\n- Chapter Nine – Pointers\n\
    - Chapter Ten – Dynamic Memory\n- Chapter Eleven - Classes and Objects\n- Conclusion\n\
    \n# Chapter One – Your First Program\n\n![](img/ff37a0bcb18b4a432276b7406e26478e_8_0.png)\n\
    \nDue to being this short tutorial on how to get started with C++, we're going\
    \ to start you out with a program in the first chapter. Your first program is\
    \ going to be very simple. All you're going to do is write a single phrase on\
    \ the screen, it's not as simple as writing it in a Word document. First, let's\
    \ take a look at the code and we'll go further into what it means.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    cout << \"Hello,\
    \ world!\";\n    return 0;\n}\n```\n\nThe line goes to tell the compiler it has\
    \ to link to the iostream library to the program. A library is a repository where\
    \ snippets of code are stored, known as functions. The library also stores other\
    \ things, like variables and operators.\n\nThe iostream library has code that\
    \ will let you send characters into the text stream, which is then fed onto the\
    \ screen. Think of it like a river. Whatever is put into the river goes onto the\
    \ screen.\n\nThe following line, line two, lets the compiler know you want to\
    \ use namespace known as std. Namespaces are an area where code is stored. Normally,\
    \ pieces of code are not able to share the same name, but if one is in a separate\
    \ namespace, then they can have the same name.\n\nThe third line of code is the\
    \ beginning of the code. It's the main block, as implies. Everything inside the\
    \ braces {} will be translated by the compiler. You'll need that line because\
    \ nothing happens without it.\n\nNow comes the printing of the phrase, ‘Hello\
    \ World’! To do this, you use code stored inside the iostream library. This part\
    \ of the code is known as cout, which sends information to the stream. The <<\
    \ that comes after cout is an operator. This means output.\n\nThe following stream\
    \ is ‘Hello, World!’ and is known as a string. Strings are a sequence of characters\
    \ shown by double quotation marks. This ends with a semicolon and signifies the\
    \ end of the statement. If the semicolon is not used, then the program is not\
    \ going to compile.\n\n```\n```\n\nThe last line, the closing brace, is simple\
    \ but very important. It is placed at the end of main and tells the computer that\
    \ the main block has finished. It will return a value of 0 to the CPU. A non-zero\
    \ value will create an error, so it's a necessary line.\n\nNow that you have the\
    \ source code of the program, you have to compile it. Try running it from the\
    \ terminal instead. Now that you know how to create your first program and what\
    \ it looks like, let's take a look at variables!\n\n# Chapter Two – Variables\n\
    \nIn the last chapter, variables were mentioned and it was said they would be\
    \ discussed. Now is the time to discuss them. A variable is something that stores\
    \ a value. Imagine that every variable is a box and every box is labeled with\
    \ a name.\n\nThe category is what type of item storing and its name is called.\
    \ Boxes are able to store many things, but only if that thing fits inside the\
    \ box. For example, one type of variable is the integer. If you know basic mathematics,\
    \ then you know that integers are whole numbers and their negative counterparts.\
    \ So -5, 4, and -37 are all integers. In addition, integer variables have a fixed\
    \ size.\n\nThey are only able to hold a number between two others. These are specific\
    \ to the variable and will not change yet, but a default integer range is between\
    \ -32 and 32767. You probably won't need numbers larger than that, so we'll save\
    \ the rest for another time.\n\nHere's to see the different types of variables\
    \ you can use.\n\n| C++ Type | Stores |\n| --- | --- |\n| int | Whole numbers\
    \ (integers) |\n| bool | True or False (0 or 1) |\n| float | Fractional numbers\
    \ (reals) |\n| double | Float with twice the precision |\n| char | A single ASCII\
    \ character |\n\nThere are a few different variable types. You'll probably use\
    \ them all when you program, but for now you're only going to use a few.\n\n#\
    \ Using Variables\n\nTake a look at the following program:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint variable;\nint main()\n{\n  variable =\
    \ 42;\n  cout << variable;\n  return 0;\n}\n```\n\nMost of this program is going\
    \ to look familiar, except for the fourth and sixth lines. The first unfamiliar\
    \ part declares the variable. This is telling the compiler that you're going to\
    \ use a variable. In declarations, the variable type is going to come first. In\
    \ the example, it's using the int type. Next is the variable's name, which would\
    \ be known as var.\n\nIt's easy and simple. A variable name can be anything, but\
    \ be sure it's something relevant and not something that is already reserved and\
    \ means something in C++, and it doesn't begin with a number or a special character.\
    \ You should start with a lowercase letter, and end the statement with a semicolon.\n\
    \nLine nine in the code above is known as assignment and assigns a value to the\
    \ variable. The equal sign is the assignment operator, and it is what it does\
    \ the assigning. The variable on the left is given the value on the right, and\
    \ the = is a binary operator because it has two operands: one to the left and\
    \ the other to the right. The operand on the right doesn't have to be a value;\
    \ it can be another variable. The left has to be a variable and you can't change\
    \ the meaning of the number. In the example, the integer var is a value of forty-two.\n"
  mdcn: "\n\n# 初学者终极指南\n\n# C++\n面向新手\n\n![](img/ff37a0bcb18b4a432276b7406e26478e_0_0.png)\n\
    \n# 学习 C++ 的智能方法\n简单、快速、易懂的步骤\n\n# STANLEY HOFFMAN\n\n# C++\n\n# C++入门教程，24小时精通\
    \ C++，\n快速学习 C++！\n\n# 简介\n\nC++ 是一种新兴的基于对象和编译的编程语言。如果你是一个从未编程过的人，可能会对“对象”（object）和“编译”（compiling）这两个词感到困惑。\n\
    \n利用编译的程序是由计算机的 CPU 读取的，而不是通过计算机上安装的运行程序的程序进行解释。因此，程序更多的是与计算机的处理系统对话，而不是与某个程序对话。\n\
    \n你可能已经知道，但计算机无法读取字母，必须读取二进制代码，因此代码必须翻译成计算机可读的形式。这被称为“编译”。现在，面向对象的代码只是代码的结构方式。你将在接下来的章节中更好地理解这个小知识。\n\
    \n那么，这一切意味着什么，为什么你需要知道它呢？作为一名使用 C++ 的程序员，你需要的不仅仅是一个普通的文本编辑器。只有极少数编程语言只需要这些，而它们实际上并不是真正的编程语言。你将学到的东西之一就是编译器。\n\
    \n你可能需要的另一个东西是集成开发环境，也称为 IDE。这是一种面向程序员的文本编辑器，具有语法高亮功能并集成了编译器。对于 Windows 和 Linux，你可以使用不同的选项。\n\
    \n你并不真的需要 IDE，因为一个基础文本编辑器就可以了，但像记事本（Notepad）这样的会让事情变得稍微困难。文字处理器也是一个糟糕的选择，因为它们有拼写和语法自动修正功能，如果你不小心就会弄乱你的代码。\n\
    \n在开始 C++ 之前，你应该理解它有严格的语法。这意味着代码是大小敏感的，所以输入‘Hello’和输入‘hello’是不同的。此外，你应该知道这种编程语言并不关心空白，所以不用担心它。\n\
    \n这就是你初开始学习 C++ 时需要的所有知识。让我们进入实际代码环节带你入门吧！\n\n我认为下一本书对你也会很有趣：\n\nMatt Benton 著\
    \ **计算机黑客技术** (Computer Hacking)\n\n![](img/ff37a0bcb18b4a432276b7406e26478e_4_0.png)\n\
    \n# 目录\n\n- 简介\n- 第一章 你的第一个程序\n- 第二章 变量\n  - 使用变量\n- 第三章 扩展你的程序\n  - istream 库\n\
    - 第四章 运算符\n- 第五章 条件条件语句\n- 第六章 循环\n- 第七章 数组\n- 第八章 函数\n- 第九章 指针\n- 第十章 动态内存\n\
    - 第十一章 类与对象\n- 结论\n\n# 第一章 – 你的第一个程序\n\n![](img/ff37a0bcb18b4a432276b7406e26478e_8_0.png)\n\
    \n由于这个关于如何开始 C++ 的教程非常短，我们将在第一章让你从程序开始。你的第一个程序将非常简单。你要做的只是在屏幕上写一个短语，这不像在 Word\
    \ 文档中写那么简单。首先，让我们来看代码，然后深入探讨它的含义。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    cout << \"Hello, world!\";\n    return 0;\n}\n```\n\n\
    这一行告诉编译器它必须将 iostream 库链接到程序。库是一个存储代码片段的仓库，这些片段被称为函数。库还存储了其他内容，如变量和运算符。\n\niostream\
    \ 库的代码允许你将字符发送到文本流中，然后显示在屏幕上。把它想象成一条河流。任何放入河流的东西都会显示在屏幕上。\n\n接下来的行（第二行）让编译器知道你想使用名为\
    \ std 的命名空间（namespace）。命名空间是存储代码的区域。通常，代码片段不能共享相同的名称，但如果一个在独立的命名空间中，它们就可以有相同的名称。\n\
    \n第三行代码是代码的开始。它是主块（main block），正如其名所暗示的。大括号 {} 内部的所有内容都将由编译器翻译。你需要这一行，因为没有它什么都不会发生。\n\
    \n现在开始打印短语‘Hello, World!’！为了实现这一点，你使用了存储在 iostream 库中的代码。这部分代码被称为 `cout`，它向流发送信息。`cout`\
    \ 之后的 `<<` 是一个运算符。这意味着输出。\n\n接下来的流是‘Hello, World!’，被称为字符串（string）。字符串是由双引号表示的一系列字符。它以分号结尾，并表示语句的结束。如果不使用分号，程序将无法编译。\n\
    \n```\n```\n\n最后一行，即右大括号，虽然简单但非常重要。它被放置在 `main` 的末尾，告诉计算机主块已结束。它将向 CPU 返回一个值 0。非零值将产生错误，所以这是一行不可少的代码。\n\
    \n现在你已经有了程序的源代码，你必须编译它。尝试从终端（terminal）运行它。现在你已经知道如何创建你的第一个程序以及它长什么样，让我们来看看变量吧！\n\
    \n# 第二章 – 变量\n\n在上一章中，提到了变量，并说将讨论它们。现在是讨论它们的时候了。变量是存储值的东西。想象每个变量都是一个盒子，每个盒子都贴有名字。\n\
    \n类别是指存储的物品类型，而它的名字被称为变量名。盒子可以存储很多东西，但前提是该东西必须放进盒子里。例如，一种类型的变量是整数（integer）。如果你了解基础数学，你就知道整数是整数及其负对应数。所以\
    \ -5、4 和 -37 都是整数。此外，整数变量具有固定的大小。\n\n它们只能包含两个数字之间的数字。这些是特定于变量的且目前不会改变，但默认的整数范围是\
    \ -32 到 32767 之间。你可能不需要比这更大的数字，所以我们将剩下的部分留到以后再说。\n\n这里是你可以使用的不同类型的变量。\n\n| C++\
    \ 类型 | 存储内容 |\n| --- | --- |\n| int | 整数 (integers) |\n| bool | 真或假 (0 或 1) |\n\
    | float | 小数 (reals) |\n| double | 精度是 float 的两倍的浮点数 |\n| char | 单个 ASCII 字符 |\n\
    \n有几种不同的变量类型。你在编程时可能会用到所有的类型，但现在你只需要使用几个。\n\n# 使用变量\n\n看看以下程序：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint variable;\nint main()\n{\n  variable =\
    \ 42;\n  cout << variable;\n  return 0;\n}\n```\n\n该程序的大部分看起来都很熟悉，除了第四行和第六行。第一个不熟悉的部分声明了变量。这是告诉编译器你将使用一个变量。在声明中，变量类型在前。在示例中，它使用了\
    \ `int` 类型。接下来是变量名，在这里被称为 `variable`。\n\n它简单直接。变量名可以是任何内容，但要确保它是相关的，不是 C++ 中已保留且具有含义的内容，并且不以数字或特殊字符开头。你应该以小写字母开头，并用分号结束语句。\n\
    \n上述代码的第九行被称为赋值，并将值赋予变量。等号是赋值运算符，它的功能就是执行赋值操作。`=` 是的是一个二元运算符，因为它有两个操作数：左侧和一个右侧的。右侧的操作数不必是一个值，可以是另一个变量。左侧必须是变量。\n\
    \n"
