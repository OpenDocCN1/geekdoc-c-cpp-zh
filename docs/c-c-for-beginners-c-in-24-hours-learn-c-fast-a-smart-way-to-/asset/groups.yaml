    # 第五章 – 条件判断


    拥有一个执行单一、线性任务的程序（比如说“你好”）是很棒的，但你很少会遇到一个只执行线性任务的程序。程序通常使用被称为“条件”的东西，或者说根据条件是否为真将代码分支到不同路径的语句。这基本上就像路上的叉路。


    C++ 条件判断采用 `if` 语句的形式。例如，如果某事为真，则执行这行代码；如果某事为假，则执行另一行代码。看看下面的代码段示例。


    ```cpp

    1 int a;

    2

    3 if (a<2)

    4 {

    5 cout<<"a is less than 2\n";6 }

    ```


    到目前为止，第一到五行对你来说应该很易懂，但第三行你可能需要一点解释。这是 `if` 语句的示例。它的工作原理是首先获取整数变量 `a` 的值，并检查它是否小于
    2。如果为真，它将运行大括号中的代码。


    如果不是，它将继续运行，仿佛这段代码不存在一样。我们知道 1 或 `a` 的值小于 2，所以如果你运行这个程序，你将在屏幕上看到“a is less than
    2!”。


    这里又引入了另一个运算符，小于号 `<`。如果你熟悉数学，那么这个符号的使用是非常自言自语的。如果你不熟悉，你就需要学习一下它。注意，虽然 `<` 看起来像
    `<<`，但它们根本不是一回事，而且在编程中没有没有关系。


    ![](img/ff37a0bcb18b4a432276b7406e26478e_27_0.png)


    当然，C++ 是一门强大的语言，因此它能够使用这些条件来执行更强大的操作。


    # 第六章 – 循环


    ![](img/ff37a0bcb18b4a432276b7406e26478e_30_0.png)


    现在你可以编写重复多次的代码了。循环是逐条重复的代码，直到满足某个条件。C++ 有三种类型的循环：`while` 循环、`for` 循环和 `do while`
    循环。让我们从 `while` 循环开始，因为它是简单的。


    `while` 循环看起来像语句，几乎。


    ```cpp

    1 userInput = 0;

    2

    3 while (userInput!=10)

    4 {

    5 cin >> userInput;

    6 }

    ```


    当你知道循环的作用时，“while” 的用法是显而易见的。在这里，代码的意思是当 `userInput` 的值不等于 10 时，从用户处获取某些输入。此外，记住
    `!=` 在 C++ 表示“不”，所以代码 `!=` 翻译为不等于。


    如果 `userInput` 是十，那么代码将不执行，循环将被跳过。`while` 循环可以看作是一个在执行完代码后跳回自身的 `if` 语句。


    在我们继续之前，重要的是知道以下代码段在 C++ 中是可以行的：


    ```cpp

    while (1 == 1)

    {

    cout << "a";

    }

    ```


    它有一个自己的名字。它是一个无限循环，所以会无限循环。还有其他方法创建无限循环，但你可能不想创建一个。


    第二种循环是 `do while` 循环。`do while` 循环看起来如下：


    ```cpp

    int userInput = 0;

    2

    do

    4 {

    5 cin >> userInput;

    6 } while (userInput!=10);

    ```


    虽然它看起来和你刚看到的标准 `while` 循环不同，但几乎相同，只有一个区别。`while` 循环评估条件是否为真，如果是真则运行代码；而 `do while`
    循环先执行某些代码，然后检查条件是否为真。由于这种情况，无论你将 `userInput` 初始化为什么值，大括号之间的代码都会被执行。


    第三种循环是 `for` 循环。这是三种循环中比较复杂的，但当你理解它时它是强大的。现在，我们只需涵盖它的用途即可。看看这个循环。


