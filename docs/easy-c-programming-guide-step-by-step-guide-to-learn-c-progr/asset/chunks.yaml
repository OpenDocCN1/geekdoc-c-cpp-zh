    n”,x+1);\n    return(0);\n}\n```\n\n输出显示了 1 到 10。保存代码并执行它。使用了 `for` 循环。\n\n##\
    \ 嵌套循环\n\n使用 `for` 的优势之一是你可以创建嵌套循环。本节展示了如何使用它们。看以下代码：\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <time.h>\n\nint main()\n{\n    int x, y;\n    srand(time(NULL));\n\
    \    for(x=0; x<5; x++)\n    {\n        for(y=0; y<5; y++)\n        {\n      \
    \      printf(\"%d%d \", x, y);\n        }\n        printf(\"\\n\");\n    }\n\
    \    return(0);\n}\n```\n\n上面的代码生成了一个数字网格。外层循环为每次 `x` 的迭代运行，内层循环为每个 `y` 运行。\n\n"
