    {


    using std::cout


    using std::string;


    string yell = “A dragon is coming, take cover!!!\n”; cout << yell.c_str() << “\n”


    yell.c_str() << “\n”


    yell.c_str() << “\n”


    yell.c_str() << “\n”;


    return 0;


    }


    Output:


    A dragon is coming; take cover!!!


    A dragon is coming; take cover!!!


    A dragon is coming; take cover!!!


    A dragon is coming; take cover!!!


    RECEIVING INPUT


    When writing programs, it''s common to want to be able to receive user input.


    You want to ask him things like what he wants to do next or his name.


    You''ll discover how to do precisely that in this section.


    The word can (pronounced "see-in") is the most significant part of receiving input.
    Similar to how cout displays text on the screen, cin reads input from the keyboard.
    Because cin is also a part of the C++ Standard Library, the following files must
    be present:


    #include <iostream>


    Yes, that''s right. It''s in the same file as the cout. Stream deals with both
    input and output capabilities. Of course, you also need a using-declaration: using
    std::cin;


    And then you''re finally set to begin receiving input from the user!


    ## STORING STRINGS WITH CIN


    You can save strings with cin in the same way you did previously, except that
    now you declare the name and assign the value subsequently. The cin object is
    used to assign this value. The keyboard or other input device is represented by
    the cin object, whereas the screen or other output device, such as a file, is
    represented by the cout object. In Chapter 5, "Designing Software: Object-Oriented
    Programming," you learn more about objects. An example of saving a user-input
    string is as follows: name of a string


    cin >> name;


    You''ll notice that you''re using cin in the same way you''re using out. The less-than
    signs have been replaced with greater-than signs. These indicators show that the
    computer is accepting rather than showing data.


