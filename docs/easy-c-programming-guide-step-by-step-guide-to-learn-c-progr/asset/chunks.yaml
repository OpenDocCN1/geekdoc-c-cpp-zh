  trans: "\n```c\n#include <stdio.h>\n\nint main()\n{\n    char ch, t;\n\n    printf(“Type\
    \ a letter ‘a’ to ‘z’: “);\n    scanf(“%c”,$ch);\n\n    for(t=’a’;t<=’z’;t++)\n\
    \    {\n        putchar(t);\n        if( t == ch )\n            break;\n    }\n\
    \    putchar(‘\\n’);\n\n    return(0);\n}\n```\n\n在第 13 行添加 `if( t == ch)` 然后是\
    \ `break`。如果你不包含两个等号，你将得到一个赋值。在 C 语言中，赋值始终为真。在 `break` 语句之后，不要忘记添加分号。保存、编译并执行代码。\n\
    \n在语句中，请记住双检循环条件和迭代。如果其中任何一个是错误的，循环将无限持续下去。编译器不会检查逻辑问题。那是你的责任。阅读 `for` 语句是一个极佳的提示。将\
    \ `t` 的值设置为字符 a。当 `t` 小于或等于字符 z 时，增加 `t`。\n\n如果你将条件仅更改为 `t=z`，例如，循环将永远不会结束，因为求值为真。\n\
    \n所以请密切关注你的条件和迭代。\n\n# 第 7 章\n\n## 函数的构造结构\n\nC 标准库中充满了宝贵的函数。这些函数可以处理很多事情，但它们对于你的项目来说可能还不够。因此，你可以根据需要创建自己的\
    \ C 语言函数。大多数程序员都有几十个、甚至数百个属于自己的函数。\n\n本章提供了函数的概述。你将学习如何创建函数并对其进行原型定义，以及如何调用或访问它，以及如何提前退出函数。像\
    \ C 语言中的其他一切一样，函数有自己的风格，在向代码中添加函数时有几条规则需要遵循。\n\n函数包含一个名称、一个类型以及在括号内的参数。类型是函数作为输出返回的值。名称是函数的唯一标识符。参数是作为输入提供函数的零、一个或多个值。`alpha`\
    \ 函数在 C 语言中没有输入或输出，这是正确的。因此，它是一个**空函数 (void function)**。\n\n`void alpha(void)`\n\
    \n变量类型 `Void` 意味着“我没有变量类型”。`count` 函数是一个整数函数。它返回或创建整数值。它需要更多的输入，因此缺少参数。\n\n`int\
    \ count(void)`\n\n`hangUp` 是一个空函数，因为它不返回任何值。然而，它只接受一个字符作为输入。`protagonist` 是计数参数。变量\
    \ `ch` 被指代它。在运行函数之前必须向编译器介绍它。因此，编译器可以双检它的参数以确保它们被正确使用。\n\n函数名称后跟着括号。当函数被调用时，控制权传递给函数内部的语句。当函数完成后，流将从函数调用后的语句恢复。下面的代码包含了两个函数：\n\
    \n```c\n#include <stdio.h>\n\nvoid blorf(void);\n\nint main ()\n{\n    puts(“The\
    \ main () function always runs first”);\n    blorf();\n    puts(“Thanks, blorf()”);\n\
    \n    return(0);\n}\n```\n\n每个 C 程序都必须有一个主函数。`blorf` 函数也是可见的。`blorf` 函数在第 3 行进行了原型定义。这为编译器提供了关于函数类型和参数的信息。编译器可以检查原型定义以确保函数被正确使用。原型定义也是一个语句。它最后以分号结束。\n\
    \n函数在第 8 行被调用。括号是空的，因为它没有参数。第 14 行是你找到函数本身的地方。这与原型定义本质上相同，除了分号。大括号包围着组成函数的语句。现在你可以编译并运行代码了。\n\
    \n你只需再次指定函数来再次调用它。第 8 行应该被复制到第 9 行。\n\n```c\n#include <stdio.h>\n\nvoid blorf(void);\n\
    \nint main ()\n{\n    puts(“The main () function always runs first”);\n    blorf();\n\
    \    blorf();\n    puts(“Thanks, blorf()”);\n\n    return(0);\n}\n```\n\n保存、编译并执行代码。你可以看到，输出是重复的。在函数出现在代码之前，原型定义充当它的定义，描述了如何使用它。只有在在使用它之前编写该函数，你才能避免指定原型定义。看看下面的代码示例：\n\
    \n```c\n#include <stdio.h>\n\nvoid soup(void);\n{\n    puts(“Pea green soup!”);\n\
    }\n\nint main()\n{\n    print (“For breakfast I had “);\n    soup();\n    print\
    \ (“For lunch I had “);\n    soup();\n\n    return(0);\n}\n```\n\n主函数上方是 `soup`\
    \ 函数。这没关系，因为编译器仍然在函数中识别它们，并且程序中的第一个函数总是执行。`soup` 函数的原型定义在文中缺失，但通过逻辑暗示了。复制代码并执行。主函数上方是\
    \ `soup` 函数。这没关系，因为编译器仍然在函数中识别它们，并且程序中的第一个函数总是执行。`soup` 函数的原型定义在文中缺失，但通过逻辑暗示了。复制代码并执行。\n"
