- fmt: "\nThe C programming language is a structured and general-purpose language.\
    \ It's also known as a procedural programming language.\n\nC was not created with\
    \ a specific application in mind. It was, nonetheless, ideally adapted for commercial\
    \ and scientific uses. It provides a variety of features for applications, including\
    \ control structures, looping statements, and micros. The following are some of\
    \ the characteristics of the C programming language:\n\n- Portability\n- Flexibility\n\
    - Effectiveness and Efficiency\n- Reliability\n- Interactivity\n\n# What is Programming?\n\
    \nProgramming is the process of developing software. The physical part of an electronic\
    \ gadget, such as a computer, phone, tablet, gaming console, microcontroller,\
    \ or another widget, is controlled by software. A programming language is used\
    \ to express these instructions. The C programming language, which was created\
    \ in the early 1970s, is the language used in this book.\n\nIt's pretty old. Indeed,\
    \ the C programming language has come to be known as the Latin of programming\
    \ languages. C, unlike Latin, is not extinct. Despite the introduction of newer\
    \ and more sophisticated programming languages, C programming continues to be\
    \ popular. C, like Latin, serves as the foundation for many other programming\
    \ languages. If you know C, you'll have an easier time learning the other languages.\n\
    \nThe syntax and other rules of the programming language will be discussed in\
    \ a later chapter. For now, just remember that the code you write is referred\
    \ to as source code.\n\n# What is a Source code?\n\nA source code file is a plain\
    \ text file containing the programming language, correctly formatted and written.\
    \ The `.c` filename extension is used in C to save the file. To create source\
    \ code, a text editor is utilized. Any text editor would suffice. However, several\
    \ include helpful features like color coding, line numbers, grammar checking,\
    \ and other tools.\n\nAfter that, the source code is turned into object code.\
    \ A compiler is a program that generates the object code. `CC`, which stands for\
    \ C compiler, is the conventional moniker for the C language compiler. The compiler\
    \ reads the source code and converts it to object code.\n\nThe filename extension\
    \ for object code files is `.o`, and they have the same name as the source code\
    \ file. Linking is the next step in the process. Because current compilers compile\
    \ and link, it's easy to overlook that linking is a separate procedure.\n\nThe\
    \ linker takes the object code file and mixes it with libraries written in the\
    \ C programming language. The language's workhorse is its libraries. They're made\
    \ up of routines and functions that govern whatever device you're working on.\
    \ The end product, if all goes properly, is a software file. After that, you can\
    \ run the software to ensure that it works as expected. If not, you must repeat\
    \ the process: modify, compile and link, or \"build,\" and test run.\n\nThe command\
    \ prompt or terminal gave birth to all of these tools: the editor, compiler, and\
    \ linker. You'll still be able to find them there. Because it is speedy, programmers\
    \ do a lot of coding at the command prompt. The usage of an IDE, or Integrated\
    \ Development Environment, is becoming frequent.\n\n# What is an IDE?\n\nThe tools\
    \ for editing, compiling, linking, and running are combined in an IDE or Integrated\
    \ Development Environment. It also includes debugging tools, complicated program\
    \ creation tools, graphical tools, and other features.\n\nThe modest command line\
    \ compiler and linker, on the other hand, sits beneath it all. The steps are the\
    \ same: edit, compile, link, and run. Before you get things right, you'll have\
    \ to do a lot of repeating and reworking.\n\nThe good news is that you can find\
    \ all of the tools you'll need to get started programming for free on the internet.\
    \ The bad news is that you'll have to hunt down and install the program yourself.\
    \ This will not be a problem for you because we will show you how to do it in\
    \ this book.\n\nYou'll learn how to choose a solid IDE (Integrated Development\
    \ Environment) and a C language compiler, as well as how to set up and configure\
    \ everything. On the Internet, you'll find a plethora of IDEs. Microsoft's IDE\
    \ is Visual Studio, while Apple's is Xcode.\n\nYou are free to use those tools\
    \ if you are already familiar with them. However, for this book, we've gone with\
    \ the Code Blocks IDE. The beautiful thing about Code Blocks is that it includes\
    \ everything you'll need to get started. Unlike other IDEs, you won't have to\
    \ go looking for anything once it's installed. All you have to do now is download\
    \ and install the software, and you're ready to start. Code Blocks are available\
    \ for free download from the developer's website at `http://www.codeblocks.org`.\n\
    \nNavigate to that website using your preferred browser (Chrome, Firefox, or Internet\
    \ Explorer).\n\n Look for the download link on that page. Remember that online\
    \ pages change from time to time, so the page you see below may seem different.\n\
    \n# Running Code Blocks\n\nThe primary window will like the one below:\n\n![](Image00000.jpg)\n\
    \nThis area is referred to as the workstation. The management panel is located\
    \ to the left. This is a list of the Code Blocks projects you're working on. The\
    \ editor where you will write the code is located in the center. A plethora of\
    \ tabs can be found towards the bottom of the page. Messages or other valuable\
    \ information can be shown on these.\n\nYou should now configure a few Code Blocks\
    \ settings to assist you in using the IDE in this book. To begin, select the settings\
    \ editor. Make sure that the option \"Display line numbers\" is selected. All\
    \ of the other parameters listed below should be set to their default values.\n\
    \n![](Image00001.jpg)\n\nTo change the font, click the pick button in the font\
    \ box. For clarity, it is recommended that you use a monospaced typeface. Set\
    \ your editor's font to a 12-point size to make it easier to read on your screen.\
    \ To close the general settings window, click OK.\n\nSecond, change the font size\
    \ of the build messages. Select `Environment` from the drop-down menu. After that,\
    \ select the view icon.\n\nSet the font size of the message logs to 10 or 12,\
    \ which is easier to read. When you're finished, click OK.\n\nCongratulations.\
    \ This book has been set up to work with Code Blocks.\n\nIf you want, you can\
    \ now exit Code Blocks. You may be told that the perspective has shifted if you\
    \ resign. Save the view and click the small box to avoid being troubled by the\
    \ message again.\n\nCreating programs, or \"programming,\" usually entails using\
