    ## C 语言数组


    数组本质上是许多相同类型变量的集合。例如，高分列表就是数组的形式，你每天跑步的英里也是如此，即使列表中包含很多 0。在 C 编程语言中，字符串当然是单字符变量的数组。


    本节引入了数组的概念。你将学习如何创建一个数组、如何向其填充数据以及如何访问它。我们还将揭示关于字符数组（通常称为字符串）的一些奥秘。下面的代码创建了四个不同的
    `float` 变量并填充了数据，演示了**不要**在代码中这样处理多个值：


    ```c

    1 #include <stdio.h>

    2

    3 int main()

    4 {

    5

    6

    7 temp1 = 84.9;

    8 temp2 = 83.7;

    9 temp3 = 85.8;

    10 temp4 = 88.2;

    11

    12 printf("Local temperatures:\n");

    13 printf("Station 1: %.1f\n",temp1);

    14 printf("Station 2: %.1f\n",temp2);

    15 printf("Station 3: %.1f\n",temp3);

    16 printf("Station 4: %.1f\n",temp4);

    17

    18 return(0);

    19

    20 }

    ```


    然后使用了四个不同的打印语句来显示它们。每个变量都需要自己的一组重复语句。这段代码可以构建并运行，但何必费此呢？相反，我们将教你如何更高效地处理许多相同类型的变量。数组就是这种这样排列的。看下面的代码：


    ```c

    1 #include <stdio.h>

    2

    3 int main()

    4 {

    5 float temps[4] = { 84.9, 83.7, 85.8, 88.2 };

    6 int x;

    7

    8 printf("Local temperatures:\n");

    9 for(x=0;x<4;x++)

    10 printf("Station %d: %.1f\n",x,temps[x]);

    11

    12 return(0);

    13 }

    ```


    上一个例子被重写为数组。在第 5 行，构造了 `temperatures` 数组。总共有四个。


    每个元素在随后的括号中被赋予一个名称。第 9 行的循环中使用单个 `print` 函数来显示所有四个元素的值。


