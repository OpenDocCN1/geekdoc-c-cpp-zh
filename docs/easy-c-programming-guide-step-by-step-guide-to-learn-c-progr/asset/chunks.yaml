    # Introduction

    Thank you for purchasing `Easy C++ Programming Guide`. We will offer you an outline
    of the topics you must master before beginning programming in the `C` language
    in this book. We''ll go over the various things you should be aware of before
    diving into the development of more complex applications for different operating
    systems.


    There are numerous advantages to using the `C` programming language. It does,
    however, include several minor details that can be perplexing. Being unable to
    comprehend these elements will very certainly cause you trouble in the future.


    We''re going to talk about what those elements are in this book. We''ll also go
    over what `C` is, where it comes from, and all of the core ideas you''ll need
    to know before starting programming. We''ll also demonstrate how to install and
    use the `Code Blocks` IDE, which is helpful while writing `C` code.


    We hope you enjoy this book as much as we enjoyed reading it.


    # Chapter 1

    ## Introduction to C Programming Language

    The `C` programming language has a long and illustrious history. A computer scientist
    at `AT&T`''s `Bell Laboratories` began developing several programs for his use
    in `1972`. `Robert Matthew`''s initial work has since evolved into the `C` programming
    language, which is now extensively used worldwide.


    He was attempting to make computation as straightforward as possible. `Robert
    Matthew` concluded that the assembly language he was using at the time was far
    too complicated. They intended to buck the trend by developing a small, straightforward
    programming language for a minicomputer.

