  trans: "\n\n从广义上讲，运算符是任何导致编译器执行某项操作的符号或双符号，例如 `=`，在某些情况下，甚至包括像 `sizeof()` 这样的短语。运算符用于加、减、乘、除操作。如果你指示计算机两个整数相加，它就会执行。例如，你使用加法运算符\
    \ `+`，这是很理所当然的。我们都知道 `2 + 2` 等于 `4`。在 C++ 中，你可以通过这样实现相同的操作：\n\n```cpp\ncout <<\
    \ 2 + 2;\n```\n\n这一行会在屏幕上显示数字四。\n\n这四个基础运算符是不言自明的；它们完成的任务完全如你所预期的那样，但请花一点时间回顾每个运算符的符号：\n\
    \n- 加法：`+`\n- 减法：`–`\n- 乘法：`*`\n- 除法：`/`\n\n并不是所有的运算符执行方向都与数学中相同。加法和减法运算符的执行先于乘法和除法运算符；例如，`1+3*2`，首先执行\
    \ `3 * 2`，然后加 1，得到数字 `7`。\n\n括号具有最高的优先级。这意味着括号内的公式会被优先计算。如果你在上面的公式中加上括号，如下所示，`(1+3)*2\
    \ + 3` 首先执行，结果为 4 乘以 2，得到 8。\n\n在你的句子中加入大量的括号。结果是，调试将变得容易得多。以下是一条通用的法则：如果你认为公式需要括号，就在公式中加上括号。这种方法将使你的代码易于阅读和理解。\n\
    \n## 取模运算符\n\n还记得在六年级时做长除法时，你的答案总是整数吗？因为你那时还无法处理小数，所以你开始处理余数。知道一个数字被拆分后的余数有时极其有用。取模运算符\
    \ `%` 用于获取这种信息。`x` 除以 `y` 的余数就是 `x` 和 `y` 的模。你可以这样写代码来寻找 5 除以 2 的余数：\n\n```cpp\n\
    2 % 5;\n```\n\n这一行返回 1。是另一个简单的例子。考虑以下场景：五个海盗和十六枚闪发光的金币。海盗们必须决定宝藏是否可以在他们之间平均分配，还是他们必须进行一场大醉酒斗殴，这把我们带了下一个游戏。（尽管他们最后可能都会陷入一场醉酒斗殴。）\n\
    \n# 第 3 章\n\n## 使用控制语句进行选择\n\n在早的章节中，你创建了从头到尾执行的程序。每条语句只执行一次，并且每个单词必须完成。然而，这种线性只有在基础编程中是可以接受的。\n\
    \n要创建高级的动态程序，你必须掌握使用控制语句，允许程序跳转到特定的代码段或多次执行某部分代码。本章涵盖了以下主题：\n\n- 选择语句\n- 布尔逻辑和运算符\n\
    - 迭代语句\n- 分支语句\n- 随机数\n\n## 使用选择语句选择代码\n\n人们经常根据特定情况做出决定。例如，如果一个人生病了，他可能会去看医生。是否去看医生取决于一个特定条件：判断是否生病。使用程序时也是如此。你可以设计你的计划，使其根据某些条件选择执行哪些代码。\n\
    \n布尔值用于在 C++ 中定义条件。如你所知，布尔值有两个可能的值：`true` 或 `false`。条件的关联性由构成该条件的运算符和操作数决定。\n\n\
    `if-else` 语句和 `switch` 语句是选择语句两种形式。\n\n### 使用 if 语句测试条件\n\n`if` 语句可能是最重要的选择语句。`if`\
    \ 语句的概念是：只有当指定的条件（称为控制条件，或简称为条件）准确时，才会执行特定的行代码（称为受控语句）。`if` 语句具有以下通用语法：`if (condition)`\n\
    \n```\ncontrolled statements\n控制语句\n```\n\n在这里，对条件进行测试，而受控语句是零或多个受控语句。只有当条件求值为\
    \ `true` 时，这些受控语句才会被执行。条件后面没有分号。因为这种宽泛语法的整个两行代表一个句子，因此不需要分号。此外，条件被包含在括号中，以区别于句子的其他部分。这些括号是必须的。如果受控语句只包含一条语句，语法如下：\n\
    \n```cpp\nif (condition)\n    theStatement;\n```\n\n在这种情况下，该语句是单个语句。末尾的分号表示对于编译器来说这是整个\
    \ `if` 语句。当受控语句包含多条语句时，语法看起来如下：\n\n```cpp\nif (condition)\n{\n    statementList\n\
    }\n```\n\n语句列表由零或多个 C++ 语句组成，每条都以分号结束。\n\n```cpp\n{\n    cout << \"The sword's\
    \ number is fewer than eight\";\n}\n```\n\n由于条件（控制条件）`swords < 8`（整数变量 `swords`\
    \ 的值是否小于 8?）求值为 `false`，`cout` 命令永远不会执行。数字九和数字八是一样的。你也可以展示这个例子——不带大括号，如下所示——因为你只是想让它执行一行代码：\n\
    \n```cpp\nint swords = 9;\nif(swords < 8)\n    statementList;\n```\n\n在前面，语句列表由零或多个语句组成，用分号隔开。如果受控语句只有一个语句，则不需要块：参见图\
    \ 3.1 关于 `if-else` 结构如何工作的图。\n\n### 条件运算符\n\n某些条件非常简单，编写一个完整的 `if` 语句变得非常繁琐。观察以下：\n\
    \n```cpp\nz = (x > y) ? x : y;\n```\n\n最重要的数字是十。\n\n### 使用 switch 语句\n\n`switch`\
    \ 语句是第二种选择语句。`case expr2:`\n\n```\n语句 2\nbreak;\n```\n\n`case expr3:`\n\n```\n\
    语句 3\nbreak;\n```\n\n表达式 `expr1`、`expr2` 和 `expr3` 是你想要验证的变量或表达式。当你编译时，会得到语法错误。在这种情况下\
    \ `break` 关键字不是必须的，但现在在每个句子后面都加上。\n\n现在你已经过了所有的术语，让我们来看例子：\n\n```cpp\nint choice\
    \ = 3;\nswitch (choice)\n{\n    case 1:\n    case 2:\n    case 3:\n        cout\
    \ << \"You chose 1, 2, or 3.\\n\";\n        break;\n    case 4:\n        cout\
    \ << \"You chose 4!\\n\";\n    case 5:\n        cout << \"You chose 4 or 5.\\\
    n\";\n        break;\n}\n```\n\n输出（当用户输入 1 时）：\n\n请输入数字：1\n\n你选择了 1、2 或 3。\n\n\
    输出（当用户输入 4 时）：\n\n请输入数字：4\n\n你选择了 4！\n\n你选择了 4 或 5。\n\n### 小于和大于运算符\n\n小于 `<`\
    \ 和大于 `>` 指示在计算机中的功能与在四年级数学中相同。\n\n### 与等价运算符合并\n\n你可能还记得数学中小于等于和大于等于符号的体验。在 C++\
    \ 中，它们的写法略有不同，但它们仍然存在。不是在小于或大于符号下画一条线，而是在它们后面加一个等号。因此，大于等于运算符是 `>=`，小于等于运算符是 `<=`。\n\
    \n"
- fmt: "\nThese operators work exactly as the less-than and greater-than operators\
    \ work, except that the operator also returns true if the two things being compared\
    \ are equal. Here are some examples:\n\n```\nif (5 <= 5) //true\nif (6 >= 7) //false\n\
    if (1 <= 8) //true\n```\n\n## The while Loop\n\nThe `while` loop could be used\
    \ to program the Hercules example. The `while` loop will run indefinitely until\
    \ a specific condition is met. A `while` loop has the following syntax:\n\n```\n\
    while(condition)\ncontrolled statements\n```\n\nEvery time the loop runs, the\
    \ condition will be tested. The loop will end when the condition is no longer\
    \ valid. `ControlledStatements` will be executed repeatedly until then. Remember\
    \ that the loop may never execute if the condition isn't valid, to begin with.\
    \ Keep in mind that you must ensure that your loops end after a specified amount\
    \ of time has passed. Avoid cycles that never end (loops that will never fail\
    \ their precondition).\n\nYou're now ready to program Hercules' nine duties (mentioned\
    \ in the preceding section). The `while` loop is used in the following example\
    \ to generate the program. You want the `while` loop to be limited to a specific\
    \ condition; the task number must be less than or equal to nine.\n\n```\n//3.2\
    \ - Nine Tasks of Hercules - Dirk Henkemans and Mark Lee\n#include <iostream>\n\
    \nint main( void )\n{\n    using std::cout;\n    /this is the variable that keeps\
    \ track of how many tasks you've accomplished.\n    int taskNumber = 0;\n    while(taskNumber\
    \ < 9) //until taskNumber >= 9 {\n        taskNumber++;\n        cout << ”Hercules\
    \ has now completed “ << taskNumber << “ tasks.” << “\\n”;\n    }\n    return\
    \ 0;\n}\n```\n\nOutput:\n```\nHercules has now completed 1 task.\nHercules has\
    \ now completed two tasks.\nHercules has now completed three tasks.\nHercules\
