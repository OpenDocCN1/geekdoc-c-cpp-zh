    \n## Do/While 循环\n\nDo/While 循环是另一种循环。它类似于一个倒过来的 while 循环，但它确保循环至少运行一次。请看以下代码：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    char ch;\n    ch = ‘A’;\n   \
    \ do\n    {\n        putchar(ch);\n        ch++;\n    }\n    while (ch != ‘z’);\n\
    \    putchar(‘\\n’);\n    return(0);\n}\n```\n\nDo/While 循环从第 9 行的 `do` 语句开始。它不是条件。语句逐条执行。第\
    \ 14 行包含 `while` 条件。循环的条件是变量 `ch`。第 7 行初始化了变量，该变量随后在第 12 行被更改。复制代码并执行它。\n\n由于它是退出条件，字母\
    \ 'Z' 没有被打印。如果你想显示字母 ‘z’，请将退出条件设置为‘z + 1’，如下：\n\n```c\n#include <stdio.h>\n\n\
    int main()\n{\n    char ch;\n    ch = ‘A’;\n    do \n    {\n        putchar(ch);\n\
    \        ch++;\n    }\n    while (ch != ‘z’+1);\n    putchar(‘\\n’);\n    return(0);\n\
    }\n```\n\n保存代码并执行。下面的代码演示了一个死循环。由于 `while` 循环的评估结果始终为 1，因此没有退出条件。\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    while(1)\n    {\n        printf(“I’m endlessly\
    \ looping! “);\n    }\n    return(0);\n}\n```\n\n复制代码并执行。要取消软件并结束这种疯狂，请按 `Ctrl\
    \ + C`。死循环有其用处，尽管它们通常是无意的。另一方面，`break` 语句可以跳出循环。在上述代码的第 8 行，添加如下的 `break` 语句：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    while(1)\n    {\n        printf(“I’m\
    \ endlessly looping! “);\n        break;\n    }\n    return(0);\n}\n```\n\n别忘记在\
    \ `break` 语句结束加上分号。保存、编译并执行代码。因为 `break` 语句退出循环，它只旋转了一次。`break` 甚至可以提前跳出循环。请看以下代码：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a = 0;\n    while(1)\n  \
    \  {\n        puts(“Here I go…!”);\n        a++;\n        if(a > 10)\n       \
    \     break;\n    }\n    return(0);\n}\n```\n\n`while` 循环的条件是无限的且无法更改。变量被用来跟踪循环迭代的次数。当它大于\
    \ 10 时，循环被打破。你能复制代码并执行它吗？当然，在 `while` 循环的括号中评估变量会是一个更好的选择。你可以自己尝试一下。\n\n## For\
    \ 关键字\n\n在 C 代码中，`for` 关键字用于创建循环。与 `while` 循环不同，循环设置在单行内，这使得它更加神秘。然而，它仍然是一种更流行或可能更典型的循环。\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int x;\n    for(x=0;x<10;x++)\n\
    \        printf(“%d\\n”,x);\n    return(0);\n}\n```\n\n本节将讨论 `for` 循环。我们将学习如何建立循环并解析它的组件。在第\
    \ 7 行，有一个 `for` 循环。循环语句被分为三个部分，每部分都用分号隔开。\n\n启动是第一步。`x=0` 是在循环开始时进行的赋值，是该语句。循环条件是第二个。只要这个条件是正确的，循环就会重复\
    \ 10 次。迭代语句在最后。该语句在每次循环重复时都会执行。在这种情况下，`x` 的值增加了。\n\n分号并不跟在 `for` 语句的括号后面。相反，分号被放置在单个循环短语之后（如第\
    \ 8 行所示），或者包含在大括号中的语句序列之后。你能复制代码并执行它吗？显示了数字 0 到 9。这对于 C 循环来说是相对标准的。在 C 编程中，你从\
    \ 0 开始计数，而不是 1。\n\n人类从 1 开始计数。更新第 8 行的打印语句：为了按照人类的习惯修复循环，将打印语句改为：\n\n```c\n#include\
