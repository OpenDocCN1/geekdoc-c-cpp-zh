  raw: 'The C programming language is a structured and general-purpose language. It''s
    also known as a procedural programming language.


    C was not created with a specific application in mind. It was, nonetheless, ideally
    adapted for commercial and scientific uses. It provides a variety of features
    for applications, including control structures, looping statements, and micros.
    The following are some of the characteristics of the C programming language:


    • Portability


    • Flexibility


    • Effectiveness and Efficiency


    • Reliability


    • Interactivity


    ## What is Programming?


    Programming is the process of developing software. The physical part of an electronic
    gadget, such as a computer, phone, tablet, gaming console, microcontroller, or
    another widget, is controlled by software. A programming language is used to express
    these instructions. The C programming language, which was created in the early
    1970s, is the language used in this book.


    It''s pretty old. Indeed, the C programming language has come to be known as the
    Latin of programming languages. C, unlike Latin, is not extinct. Despite the introduction
    of newer and more sophisticated programming languages, C programming continues
    to be popular. C, like Latin, serves as the foundation for many other programming
    languages. If you know C, you''ll have an easier time learning the other languages.


    The syntax and other rules of the programming language will be discussed in a
    later chapter. For now, just remember that the code you write is referred to as
    source code.


    ## What is a Source code?


    A source code file is a plain text file containing the programming language, correctly
    formatted and written. The. A c filename extension is used in C to save the file.
    To create source code, a text editor is utilized. Any text editor would suffice.
    However, several include helpful features like color coding, line numbers, grammar
    checking, and other tools.


    After that, the source code is turned into object code. A compiler is a program
    that generates the object code. CC, which stands for C compiler, is the conventional
    moniker for the C language compiler. The compiler reads the source code and converts
    it to object code.


    The filename extension for object code files is. o, and they have the same name
    as the source code file. Linking is the next step in the process. Because current
    compilers compile and link, it''s easy to overlook that linking is a separate
    procedure.


    The linker takes the object code file and mixes it with libraries written in the
    C programming language. The language''s workhorse is its libraries. They''re made
    up of routines and functions that govern whatever device you''re working on. The
    end product, if all goes properly, is a software file. After that, you can run
    the software to ensure that it works as expected. If not, you must repeat the
    process: modify, compile and link, or "build," and test run.


    The command prompt or terminal gave birth to all of these tools: the editor, compiler,
    and linker. You''ll still be able to find them there. Because it is speedy, programmers
    do a lot of coding at the command prompt. The usage of an IDE, or Integrated Development
    Environment, is becoming frequent.


    ## What is an IDE?


    The tools for editing, compiling, linking, and running are combined in an IDE
    or Integrated Development Environment. It also includes debugging tools, complicated
    program creation tools, graphical tools, and other features.


    The modest command line compiler and linker, on the other hand, sits beneath it
    all. The steps are the same: edit, compile, link, and run. Before you get things
    right, you''ll have to do a lot of repeating and reworking.


    The good news is that you can find all of the tools you''ll need to get started
    programming for free on the internet. The bad news is that you''ll have to hunt
    down and install the program yourself. This will not be a problem for you because
    we will show you how to do it in this book.


    You''ll learn how to choose a solid IDE (Integrated Development Environment) and
    a C language compiler, as well as how to set up and configure everything. On the
    Internet, you''ll find a plethora of IDEs. Microsoft''s IDE is Visual Studio,
    while Apple''s is Xcode.


    You are free to use those tools if you are already familiar with them. However,
    for this book, we''ve gone with the Code Blocks IDE. The beautiful thing about
    Code Blocks is that it includes everything you''ll need to get started. Unlike
    other IDEs, you won''t have to go looking for anything once it''s installed. All
    you have to do now is download and install the software, and you''re ready to
    start. Code Blocks are available for free download from the developer''s website
    at http://www.codeblocks.org.


    Navigate to that website using your preferred browser (Chrome, Firefox, or Internet
    Explorer). Look for the download link on that page. Remember that online pages
    change from time to time, so the page you see below may seem different.


    ## Running Code Blocks


    The primary window will like the one below:


    ![](Image00000.jpg)


    This area is referred to as the workstation. The management panel is located to
    the left. This is a list of the Code Blocks projects you''re working on. The editor
    where you will write the code is located in the center. A plethora of tabs can
    be found towards the bottom of the page. Messages or other valuable information
    can be shown on these.


    You should now configure a few Code Blocks settings to assist you in using the
    IDE in this book. To begin, select the settings editor. Make sure that the option
    "Display line numbers" is selected. All of the other parameters listed below should
    be set to their default values.


    ![](Image00001.jpg)


    To change the font, click the pick button in the font box. For clarity, it is
    recommended that you use a monospaced typeface. Set your editor''s font to a 12-point
    size to make it easier to read on your screen. To close the general settings window,
    click OK.


    Second, change the font size of the build messages. Select Environment from the
    drop-down menu. After that, select the view icon.


    Set the font size of the message logs to 10 or 12, which is easier to read. When
    you''re finished, click OK.


    Congratulations. This book has been set up to work with Code Blocks.


    If you want, you can now exit Code Blocks. You may be told that the perspective
    has shifted if you resign. Save the view and click the small box to avoid being
    troubled by the message again.


    Creating programs, or "programming," usually entails using a programming language
    to type the program''s source code—instructions—and then compiling and linking
    the source code together to form the program. The produced program is generally
    in the form of an.exe file for Windows or a.sh file for a UNIX-based operating
    system such as Linux or MAC.


    After that, you run the program to see if it accomplishes what it''s supposed
    to do. To put it another way, test it to see if it works. In the next chapter,
    we''ll teach you how to use Code Blocks to demonstrate this approach. We''ll go
    over how to write a sample computer program in the C programming language and
    run it. In addition, we''ll show you how to use the IDE to find and solve errors
    in your application.


    Start your computer when you''ve completed installing Code Blocks. The first page
    you''ll see is the Code Blocks home page. If you''re working on a computer that
    already has Code Blocks installed and has been used to write programs before,
    go to the Code Blocks menu and select View > Start page to see the start page.


    The majority of the effort done on the Code Blocks IDE is focused on projects.
    A Code Blocks C language project might be as simple as a program or as complex
    as a large online computer game. On the start page, click the Create New Project
    link to start a new Code Blocks project. Note that you do not need to perform
    this step if you are reading and working on C language project files that have
    been downloaded from somewhere other than your computer.'
