    string name = “”; // “” means empty string


    cout << ”What is your name?\n”;


    cin >> name;


    cout << “\nHello “ << name.c_str() << “\n”;


    return 0;


    }


    Output (bold text is user input):


    What is your name?


    Jackie


    Hello Jackie


    In the preceding code, the string name tells the computer that there is space
    in the computer for a name string. Remember that you must include the string component
    of the C++ Standard Library to use strings.


    The line that reads


    out << "What is your name?\n";


    The user is given a prompt.


    Following that, cout “hello“ name. C str() “n”; instructs the computer to begin
    on the following line.


    Even though the text still has a lot to teach us, you have a good grasp of it
    now to move on to numbers.


    ## WORKING WITH NUMBERS


    A computer is solely reliant on numbers. Everything that happens on a computer
    is built based on numbers. In the computer industry, having a good understanding
    of numbers is vital. You''ll learn about basic math, the modulus operator, and
    how to use integers in this part (see Chapter 2 for more on integers).


    ## INTRODUCING INTEGERS


    On computers, data can be stored in a variety of ways. We''ll only go over the
    fundamentals of integers and how to use them for the time being. All real numbers,
    including zero, as well as positive and negative numbers, are considered integers.
    5, 0, and –100, for example, are all integers, although 0.5 is not. When you try
    to store a decimal as an integer, the computer will truncate the remainder, removing
    everything following the decimal.


