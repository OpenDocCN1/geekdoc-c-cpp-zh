    }\n\nvoid repeat(int count)\n{\n    int x;\n    for(x=0;x<count;x++)\n       \
    \ puts(“Nevermore!”);\n}\n```\n\nAfter saving your changes, build and run the\
    \ code. As you can see, the result is the same. Take a look at the following code:\n\
    \n```c\n#include <stdio.h>\n\nvoid product(float a, float b, float c);\n\nint\
