  trans: '

    C 编程语言是一种结构化且通用的语言。它也被过程化编程语言。


    C 语言的创建并不是为了某个特定的应用。尽管如此，它在理想状态下非常适用于商业和科学用途。它为应用程序提供了多种功能，包括控制结构、循环语句和微程序。以下是
    C 编程语言的一些特点：


    - 可移植性

    - 灵活性

    - 有效性与效率

    - 可靠性

    - 交互性


    # 什么是编程？


    编程是开发软件的过程。电子设备（如用用电脑、手机、平板电脑、游戏主机、微控制器或其他小部件）的物理部分是由软件控制的。编程语言用于表达这些指令。C 编程语言创建于
    20 世纪 70 年代初，本书所使用的正是它。


    它非常老了。事实上，C 编程语言已经被称为编程语言中的“拉丁语”。与拉丁语不同，C 并没有灭绝。尽管出现了更现代、更复杂的编程语言，但 C 语言依然流行。C
    就像拉丁语一样，是许多其他编程语言的基础。如果你熟悉 C，学习其他语言将会变得更容易。


    编程语言的语法和其他规则将在后面的章节中讨论。现在，只需记住你编写的代码被称为“源代码”。


    # 什么是源代码？


    源代码文件是一个包含编程语言的纯文本文件，格式正确且编写良好。C 语言使用 `.c` 文件扩展名来保存文件。创建源代码需要用到文本编辑器。任何文本编辑器都可以。然而，某些编辑器包含颜色编码、行号、语法检查和其他实用功能。


    之后，源代码会被转换为对象代码。编译器是一个生成对象代码的程序。`CC` 是 C 语言编译器的惯用名称。编译器读取源代码并将其转换为对象代码。


    对象代码文件的文件名扩展名为 `.o`，它们与源代码文件名相同。链接是过程中的下一步。由于现在的编译器会同时编译和链接，很容易忽视链接是一个独立的步骤。


    链接器获取对象代码文件并将其与 C 编程语言编写的库混合。库是该语言的主力军。它们由程序和函数组成，负责管理你正在使用的任何设备。如果一切顺利，最终产物就是一个软件文件。之后，你可以运行该软件以确保它按预期工作。如果没有，你必须重复该过程：修改、编译并链接（或“构建”），然后测试运行。


    命令行提示符或终端诞生了所有这些工具：编辑器、编译器和链接器。你仍然可以在那里找到它们。因为速度快，程序员在命令行提示符处编写大量代码。IDE 或集成开发环境的使用正变得频繁。


    # 什么是 IDE？


    编辑、编译、链接和运行的工具被整合在 IDE 或集成开发环境环境中。它还包含了调试工具、复杂的程序创建工具、图形化工具和其他功能。


    另一方面，简易的命令行编译器和链接器位于这一切的底层。步骤是相同的：编辑、编译、链接和运行。在正确解决问题之前，你必须进行大量的重复和重做。


    好消息是，你可以在互联网上免费找到开始编程所需的所有工具。坏消息是，你必须自己寻找并安装这些程序。这对你来说不是问题，因为我们将在本书书中教你如何操作。


    你将学习如何选择一个可靠的 IDE（集成开发环境）和一个 C 语言编译器，以及如何设置和配置一切。在互联网上，你会发现大量的 IDE。微软的 IDE 是 Visual
    Studio，而苹果的是 Xcode。


    如果你已经熟悉了这些工具，可以自由使用它们。然而，对于本书，我们选择了 Code Blocks IDE。Code Blocks 的美好之处在于它包含了你入门所需的所有内容。与其他
    IDE 不同，一旦安装好，你就不需要去寻找任何东西了。你现在只需要下载并安装软件，就可以开始了。Code Blocks 可以从开发者网站 `http://www.codeblocks.org`
    免费下载。


    使用你偏好的浏览器（Chrome、Firefox 或 Internet Explorer）导航到该网站。


    在该页面上寻找下载链接。记住，在线页面会不时变化，所以你看到的下方页面可能有所不同。


    # 运行 Code Blocks


    主窗口将如下所示：


    ![](img/Image00000.jpg)


    该区域被称为工作站。管理面板位于左侧。这是你正在工作的 Code Blocks 项目列表。你编写代码的编辑器位于中间。在页面底部可以找到许多标签。消息或其他有用信息可以在这些标签上显示。


    现在你现在应该配置几个 Code Blocks 设置，以帮助你在本书中使用该 IDE。首先，选择设置编辑器。确保选中了“显示行号”（Display line
    numbers）选项。下面列出的所有其他参数都应设置为默认值。


    ![](img/Image00001.jpg)


    如需更改字体，点击字体框中的选择按钮。为了清晰起见，建议使用等宽字体。将编辑器的字体设置为 12 磅，以便阅读。如需关闭设置窗口，点击 OK。


    其次，更改消息的字体。从下拉菜单中选择“环境”（Environment）。之后，选择“视图”（view）。


    将日志字体设置为 10 或 12，这样更易阅读。完成后，点击 OK。


    恭喜，Code Blocks 已经配置好可以使用了。


    如果你愿意，现在可以退出 Code Blocks。如果视角发生变化，可能会提示。保存视图并点击小框以避免再次看到该消息。

    '
- fmt: '

    However, if you need to create a new C language project in the `Code Blocks` IDE,
    especially for the console programs/applications that we will be utilizing in
    this book, choose the `Console Application` option when creating a new project.


    ![](Image00002.jpg)


    Select the C language option after selecting `Console Application`. Choose a location
    to save the project file and give it a name. On the Mac, make sure the words don''t
    contain any spaces; otherwise, the application won''t execute `Code Blocks`. Select
    only `Release` and click `Finish`.


    Click the `Open` button on the toolbar to open a pre-written source code file
    in `Code Blocks`. Navigate to the folder holding the source code file that has
    already been written. Click `Open` after selecting the pre-written C file you
    want to open. The source code written in that file will then appear in the `Code
    Blocks` editor window.


    Line numbers are not included in C source code, but the `Code Block` editor will
    display them in the leftmost column. Line numbers are helpful not just for reference
    in this text but also for locating faults. On the right-hand side of the line
    numbers is the source code itself. The text is color-coded, making it easier to
    distinguish between the various components of `C` and discover problems when things
    aren''t colored appropriately.


    After developing the source code, the following step is to compile and link it.
    That step is consolidated into a single action called `Build` in `Code Blocks`.
    To start working on your project, go to this page and click the `Build` icon:


    ![](Image00003.jpg)


    The action takes place in the `Build log`, then the `Build messages` tab, at the
    bottom of the screen. `Code Blocks` will display a little red box next to the
    line number where the error occurs if your source code has errors. To review the
    specific messages linked to the error, go to the `Build log` page.


    The error messages will also tell you which line the problem is on. If you find
    a mistake in your code, fix it before clicking the `Build` button again. If there
    are no more issues, save the file and rebuild the project to ensure that everything
    is working correctly.


    ![](Image00004.jpg)


    Go to the download link to get started. Select the binary release to download.
    On the next screen, select your computer operating system from the drop-down menu:
    `Windows`, `Linux`, or `Mac OSX`. Look for the `setup.exe` file that includes
    the `MinGW` compiler on `Windows`. On the screen below, for example, it says `code
    blocks-16.01mingw-setup.exe`. Although the numbers may vary, it is the connection
    you require.


    ![](Image00005.jpg)


    Choose from 32-bit and 64-bit `Linux` distributions. Choose a `Code Blocks` version
    that isn''t testing or debugging. By selecting a download link, try to match your
    exact `Linux` distribution.


    ![](Image00006.jpg)


    There is only one option for the `MAC`. Select the appropriate link from the list
    on the right. As a download link, we recommend using `source.net`. The download
    begins right away. Wait until it''s finished.


    The next step is to locate and install `Code Blocks` from the downloaded file.
    Open the `Downloads` folder, which is usually where the file is stored. You might
    be able to access that folder from your web browser as well.


    Double-click the file on `Windows` to open it and begin the installation process.
    Follow the installation wizard''s instructions. Don''t be concerned about any
    of the possibilities. They''re all OK. `Code Blocks` will eventually be installed
    with a desktop shortcut icon. If you want to start `Code Blocks` right away, click
    the `Yes` button, but you don''t have to.


    You must unpack the archive you downloaded on `MAC` and `Linux`. To unpack the
    archive, double-click the icon in a folder window. You''ll end up with a `Code
    Blocks` app file on the `MAC`, which is a folder. That icon should be moved to
    the application''s folder.


    To open the archive on `Linux`, double-click it. Then, depending on how your `Linux`
    distribution handles whatever is in the library, you''ll have to execute the `install`
    application. If it''s an `RPM` file, for example, open it to begin the package
    installation process. You must configure `Code Blocks` after it has been installed.
    Another chapter deals with this subject.


    You may now get a warning about options `-s` on the `Macintosh`. It''s just a
    linker mistake, so disregard it. To see the program''s brilliance, press the `Run`
    button. The software runs in a command prompt window in `Windows`. A terminal
    window emerges on the `Mac` and `Linux`. You can also see any startup scripts
    you''ve written in that window. That section of the output should be ignored.
    Otherwise, you''re looking at the result of the application.


    Return to `Code Blocks` after closing the output window. Press the `Enter` key
    on your keyboard on `Windows`. In `UNIX`, type `Exit` and press the `Enter` key
    if the terminal window does not close. It is suggested that you do so. Otherwise,
    the terminal windows will stack on top of one another. You''re all set to start
    working on your first project. When you exit `Code Blocks`, it will ask if you
    want to save the current perspective. Go ahead and press the `Yes` button.


    # Chapter 2: STARTING THE JOURNEY


    Programming may appear to be a complex undertaking, but don''t be alarmed. This
    chapter was created to allow you to get your feet wet without diving into the
    more complicated aspects of programming. A talk on computers kicks off the branch.
    We''ll demonstrate how they operate in practice. The basics of constructing a
    program are covered in the next chapter. The next stage is to become familiar
    with `Visual Studio`, a `C++` compiler. Then you can experiment with text and
    numbers. With our assistance and your inventiveness, you''ll be able to write
    your simple applications.


    ## COMPUTER BASICS


    A computer is made up of many different parts. The keyboard, mouse, and monitor,
    for example, are all easily identifiable. Others are internal and inaccessible
    to the inexperienced user. The `CPU` (central processing unit) and memory are
    two examples.


    The `CPU` is the computer''s brain. It is from this circuit-laden core that all
    decisions are made. If your laptop ever went zombie on you and you wanted to know
    where to stab, this is the section to look for. As a result, the heinous beast
    would return to the underworld from which it originated!


    Memory is the next most significant component. This is where data and instructions
    are stored, and it''s also known as `RAM` (random-access memory).


    What are the data and instructions? You''ve probably heard these terms before,
    but what do they signify in this context? Data, on the other hand, can relate
    to a variety of things. The computer uses any information, such as keyboard input,
    file contents, and web server requests. Instructions are a unique type of information.
    They essentially "instruct" the `CPU` on what to do next. Add these two integers,
    move this data here, and then go to the following command.


    The computer''s primary function is to carry out these instructions. Obtain the
    following education. Put it into action. Obtain the following command. Put it
    into action. Time and time again. Except that everything happens so quickly. A
    one-gigahertz processor can process one billion instructions per second.

    '
