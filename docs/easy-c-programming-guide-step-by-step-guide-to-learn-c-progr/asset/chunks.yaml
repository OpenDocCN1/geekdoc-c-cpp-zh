    \ for you at line 8, just in case.\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    int pokey;\n    int *p;\n\n    p = &pokey;\n    printf(“The address of\
    \ ‘pokey’ is %p\\n,” &pokey);\n\n    return(0);\n}\n```\n\nThe statement assigns\
    \ the `p` pointer variable the address of variable `pokey` at line 8. You could\
    \ be perplexed at this point. “Where is the asterisk in front of the `p`?” you\
    \ might wonder. In a moment, we'll respond to that query. But, for now, keep in\
