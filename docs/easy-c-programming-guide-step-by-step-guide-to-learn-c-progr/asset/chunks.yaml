    \n下方定义了常量字符串 `AUTHOR`。必须使用双引号来封装该字符串。这是一个使用其他两个常量计算出单个常量值的示例。\n\n```c\n#define\
    \ AUTHOR “Adolf Hitler.”\n```\n\n* 常量名为 `AUTHOR`\n* 值为字符串 `\"Adolf Hitler.”`\n\
