    \ displayed. To see how this code works, build it, and execute it.\n\nThe percent\
    \ `s` placeholder's width option sets the width to twenty characters. This area\
    \ is perfect for showing tables and lists. There are many additional widths, precision,\
    \ padding, and other placeholder choices available. The `print` function's documentation\
    \ includes several options as well as a few examples.\n\n# Chapter 10\n\n## C\
    \ language Arrays\n\nAn array is essentially a collection of many variables of\
    \ the same type. A list of high scores, for example, is a form of an array, as\
    \ is the number of miles you run per day, even if the list contains a lot of zeros.\
    \ Strings in the C programming language are, of course, an array of single-character\
    \ variables.\n\nThe concept of an array is introduced in this section. You'll\
