  trans: "\n\n## C++ 的通用特性\n\n本章将向你展示如何编写、编译和运行一个简单的 C++ 程序。\n\n## main 函数\n\n每个 C++\
    \ 应用程序（完整代码）都有一个主函数，它首先被加载到内存中，然后传输到 CPU 执行。当执行结束，函数将返回一个主整数零。向后兼容是采用这种策略的原因之一。\n\
    \n以下是 main 函数的通用语法：\n\n```cpp\nint main()\n{\n    ...\nreturn 0;\n}\n```\n\n其中，`int`\
    \ 表示在任务完成后将返回一个整数。该整数在倒数第二行被设置为 `0`，表示执行成功。\n\n`main` 之后的括号括括了主函数的参数；在这种情况下，没有参数。\n\
    \n大括号表示所包含的 main 程序的开始和结束，该程序包含了若干条指令。\n\n点表示额外的代码行。\n\n分号用作分隔符，表示前面的命令返回 `0`\
    \ 并结束执行。\n\n`central` 是主程序的简化版本，当运行时 `()` 时，它不返回任何内容。\n\n```cpp\n{\n    ...\n\
    }\n```\n\n然而，我们强烈建议将包含返回语句的前述方法作为最佳实践。\n\n我们将在第 5 章学习主函数如何从操作系统发送和接收数据。在那种情况下，`int\
    \ main()` 中括号中的括号中的括号中的括号将包含命令行参数。\n\n## 问题\n\nC++ 中使用了圆括号和大括号。以你键盘上的符号为指导，你预期的还有哪些其他括号分隔符？\n\
    \n# 第 5 章\n\n## C++ 编程\n\n现在我们已经涵盖了 C++ 程序的整体结构，我们将介绍前导的运算符、指令和逻辑结构。其中大部分内容与其他语言中的内容相同或具有可比性。相比之下，C++\
    \ 支持一些不寻且有时很诡异的操作，你应该熟悉一下这些操作。\n\n在附录 C 中，你会找到 Matlab、Fortran 77 和 C++ 之间的对应关系，其形式为字典，解释了如何翻译相应的代码。\n\
    \n## 运算符\n\n为了执行数学和逻辑操作，运算符应用于一个变量或一组变量。\n\n## 赋值\n\n赋值运算符或从右到左的复制运算符由等号（`=`）表示。因此，断言（assertion）\n\
    \n表达式 `a = b` 意为“用 `b` 的值替换 `a` 的值”，而 `a = a+5` 表示“用 `a` 加上 5 的值替换 `a` 的值”。\n\n\
    其缺乏对称性区分了赋值运算符：语句 `a=b` 与语句 `b=a` 不同。\n\n## 算术运算符\n\nC++ 的基本实现支持以下算术运算符：\n\n-\
    \ 加法(`+`)：我们可以编写 `c=a+b`；\n\n复合赋值表是由复合赋值运算符调解的其他异常语句的列表。\n\n| 操作 | 含义 |\n| :---\
    \ | :--- |\n| `a +=b;` | `a=a+b;` |\n| `a -=b;` | `a=a-b;` |\n| `a *=b;` | `a=a*b;`\
    \ |\n| `a /=b;` | `a=a/b;` |\n| `a *= b+c;` | `a=a*(b+c);` |\n| `a++;` | `a=a+1;`\
    \ |\n| `++a;` | `a=a+1;` |\n| `a--;` | `a=a-1;` |\n| `--a;` | `a=a-1;` |\n\n在\
    \ C++ 中，通过复合赋值运算符使得非常语句成为可能。\n\n## 关系和逻辑运算符\n\n表 3.1.2 列出了关系和逻辑运算符。例如，为了找到数字 `a`\
    \ 和 `b` 的最大值。\n\n`maximum = (a>b)? a : b;`\n\n如果 `a > b` 为真，变量 `max` 将被赋值为 `a`；如果\
    \ `a > b` 为假，变量 `max` 将被赋值为 `b`。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` | 等于\
