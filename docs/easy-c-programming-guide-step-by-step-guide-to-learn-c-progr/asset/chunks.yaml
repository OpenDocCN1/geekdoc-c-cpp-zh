    part. `Visual Studio` is a development environment that allows you to work on
    multiple projects simultaneously (IDE). A programmer needs various tools to execute
    his job, including an editor to create code, a file browser to organize all of
    his files, a compiler to convert source code to executable code, and a debugger
    to investigate a running program. In an `IDE`, all of these tools are combined
    into a single program. Some programmers want to have everything in one place and
    integrated. Others prefer to utilize a different application for each tool, allowing
    them to create their customized work environment. Alternatives to `Visual Studio`
    are discussed in Appendix C.


    We assumed you were using `Visual C++ 2008 Express Edition` when we produced this
    book (freely available). It isn''t a big problem if you aren''t, though. Regardless
    of which compiler you choose, most of the information in this and other chapters
    will apply. Visit `HTTP://cplus.about.com/od/learnc/ss/vc2008.htm` for complete
    information on how to download and install `Visual C++ 2008 Express Edition`.


    It''s time to get started on your programming career. Try it out on your computer
    as we demonstrate how to build a project with `Visual Studio` and display the
    code. The unusual becomes more natural with practice.


