- fmt: "\nIn a broad sense, an operator is any symbol or double symbol that causes\
    \ the compiler to do an action, such as `=`, and in certain situations, even phrases\
    \ like `sizeof()`. Operators are used in the operations of addition, subtracting,\
    \ multiplying, and dividing. If you instruct a computer to add two integers, it\
    \ will do so. For example, you use the addition operator `+`, which makes sense.\
    \ We're all aware that `2 + 2` equals `4`. In C++`, here's how you can achieve\
    \ the same thing:\n\n```cpp\ncout << 2 + 2;\n```\n\nThis line displays four onscreen.\n\
    \nThese four fundamental operators are self-explanatory; they accomplish exactly\
    \ what you'd expect them to do but take a moment to review the symbol for each\
    \ one:\n\n- Addition: `+`\n- Subtraction: `–`\n- Multiplication: `*`\n- Division:\
    \ `/`\n\nNot all of these operators work in the same direction as they do in math.\
    \ The addition and subtraction operators execute before the multiplication and\
    \ division operators; for example, `1+3*2`, the `3 * 2` is executed first, then\
