    ## 语句 \n\n在 C++ 中\n\n现在已经涵盖了 C++ 程序的整体结构，我们将介绍前导的运算符、指令和逻辑结构。其中大部分内容与其他语言中的内容相同或具有可比性。相比之下，C++\
    \ 支持一些不寻且有时很诡异的操作，你应该熟悉一下这些操作。\n\n在附录 C 中，你会找到 Matlab、Fortran 77 和 C++ 之间的对应关系，其形式为字典，解释了如何翻译相应的代码。\n\
    \n## 运算符\n\n为了执行数学和逻辑操作，运算符应用于一个变量或一组变量。\n\n## 赋值\n\n赋值运算符或从右到左的复制运算符由等号（`=`）表示。因此，断言\n\
    \n表达式 `a = b` 意为“用 `b` 的值替换 `a` 的值”，而 `a = a+5` 表示“用 `a` 加上 5 的值替换 `a` 的值”。\n\n\
    其缺乏对称性区分了赋值运算符：语句 `a=b` 与语句 `b=a` 不同。\n\n## 算术运算符\n\nC++ 的基本实现支持以下算术运算符：\n\n-\
    \ 加法(`+`)：我们可以编写 `c=a+b`；\n\n复合赋值表是由复合赋值运算符调解的其他异常语句的列表。\n\n| 操作 | 含义 |\n| :---\
    \ | :--- |\n| `a +=b;` | `a=a+b;` |\n| `a -=b;` | `a=a-b;` |\n| `a *=b;` | `a=a*b;`\
    \ |\n| `a /=b;` | `a=a/b;` |\n| `a *= b+c;` | `a=a*(b+c);` |\n| `a++;` | `a=a+1;`\
    \ |\n| `++a;` | `a=a+1;` |\n| `a--;` | `a=a-1;` |\n| `--a;` | `a=a-1;` |\n\n在\
    \ C++ 中，通过复合赋值运算符使得非常语句成为可能。\n\n## 关系和逻辑运算符\n\n表 3.1.2 列出了关系和逻辑运算符。例如，为了找到数字 `a`\
    \ 和 `b` 的最大值。\n\n`maximum = (a>b)? a : b;`\n\n如果 `a > b` 为真，变量 `max` 将被赋值为 `a`；如果\
    \ `a > b` 为假，变量 `max` 将被赋值为 `b`。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` | 等于\
    \ `a == b` |\n| `!=` | 不等于 `a != b` |\n| `<` | 小于 `a<b` |\n| `<=` 小于等于 `a<=b`\
    \ |\n| `>` | 大于 `a>b` |\n| `>=` | 大于等于 `a>=b` |\n| `&&` | 与 `A&&B` |\n| `||` |\
    \ 或 `A||B` |\n| `!` | 布尔取反或真或假 `!A` |\n| `?:` | 条件运算符 `A ? a: b;` |\n\n在 C++ 中，`a`,\
    \ `b` 是变量，而 `A`, `B` 是表达式。\n\n## 向量和矩阵的初始化\n\n声明和初始化必须在行内完成。我们不能先声明再初始化向量。\n\n\
    同样，我们可以写成\n\n```cpp\nchar u[3]= {78, 34, 78};\nchar e[10]= {’’, ’b’, ’c'};\n```\n\
