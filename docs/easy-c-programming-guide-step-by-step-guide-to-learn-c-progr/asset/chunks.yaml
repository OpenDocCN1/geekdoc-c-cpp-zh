    your keyboard on Windows. In UNIX, type "Exit" and press the Enter key if the
    terminal window does not close. It is suggested that you do so. Otherwise, the
    terminal windows will stack on top of one another. You''re all set to start working
    on your first project. When you exit Code Blocks, it will ask if you want to save
    the current perspective. Go ahead and press the Yes button.


    # Chapter 2


    ## STARTING THE JOURNEY


    Programming may appear to be a complex undertaking, but don''t be alarmed. This
    chapter was created to allow you to get your feet wet without diving into the
    more complicated aspects of programming. A talk on computers kicks off the branch.
    We''ll demonstrate how they operate in practice. The basics of constructing a
    program are covered in the next chapter. The next stage is to become familiar
    with Visual Studio, a C++ compiler. Then you can experiment with text and numbers.
    With our assistance and your inventiveness, you''ll be able to write your simple
    applications in no time. We''re confident that your programs will get more complex
    in the future, but everyone has to start somewhere. Your adventure begins right
    now!


    The following items are included at the start of your adventure:


    *   How computers work


    *   How to write code


    *   How to write your first program


    *   How to use Visual Studio


    *   How the programming development cycle works


    *   How to use text


    *   How to use numbers


    ## COMPUTER BASICS


    A computer is made up of many different parts. The keyboard, mouse, and monitor,
    for example, are all easily identifiable. Others are internal and inaccessible
    to the inexperienced user. The CPU (central processing unit) and memory are two
    examples.


    The CPU is the computer''s brain. It is from this circuit-laden core that all
    decisions are made. If your laptop ever went zombie on you and you wanted to know
    where to stab, this is the section to look for. As a result, the heinous beast
    would return to the underworld from which it originated!


    Fortunately, you won''t have to worry about zombie PCs for a long time, so file
    it away. Memory is the next most significant component. This is where data and
    instructions are stored, and it''s also known as RAM (random-access memory).


    What are the data and instructions? You''ve probably heard these terms before,
    but what do they signify in this context? Data, on the other hand, can relate
    to a variety of things. The computer uses any information, such as keyboard input,
    file contents, and web server requests. Instructions are a unique type of information.
    They essentially "instruct" the CPU on what to do next. Add these two integers,
    move this data here, and then go to the following command. These are some instances
    of instructions for the CPU.


    The computer''s primary function is to carry out these instructions. Obtain the
    following education. Put it into action. Obtain the following command. Put it
    into action. Time and time again. Except that everything happens so quickly. A
    one-gigahertz processor can process one billion instructions per second! There
    is nothing to be excited about (though I''m not sure why anyone wants to get excited
    about anything... motivation appears to be lacking).


