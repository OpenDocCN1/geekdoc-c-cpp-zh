    其缺乏对称性区分了赋值运算符：语句 `a=b` 与语句 `b=a` 不同。\n\n## 算术运算符\n\nC++ 的基本实现支持以下算术运算符：\n\n-\
    \ 加法(`+`)：我们可以编写 `c=a+b`；\n\n复合赋值表是由复合赋值运算符调解的其他异常语句的列表。\n\n| 操作 | 含义 |\n| :---\
