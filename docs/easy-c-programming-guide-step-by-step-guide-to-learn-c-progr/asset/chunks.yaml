    \n有些东西是保持不变的。预处理器中的 `#define` 指令会创建它们。常量通常以全大写字母、单个单词或带有简单的下划线编写。当编译器检测到连续的标识符时，它现在会将其展开为被赋值的值。\n\
    \n在下面的示例中，形成了常量并被赋予值 `3`。在整个代码中，编译器将单词 `performance` 翻译为瞬时值 `3`。\n\n```c\n#define\
