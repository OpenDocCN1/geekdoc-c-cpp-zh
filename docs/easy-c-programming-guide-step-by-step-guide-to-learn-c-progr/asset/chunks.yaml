    ## THE TOWN CRIER PROGRAM


    You''ve learned how to store strings and how to use cout to display them onscreen.
    Now it''s time to put your newfound knowledge to the test by constructing the
    Town Crier software.


    Consider the situation: a dragon is approaching your hamlet, and you must issue
    a warning to everyone. The hamlet will be rescued if you can voice your warning
    four times in a row loud enough for everyone to hear. Only the saved string and
    cout can save the community. Therefore this is a job for our heroes. As a result,
    your goal is to write a program that repeats the text of your warning four times
    in succession.


    The following is a code listing that shows one approach to make this software,
    but we recommend that you don''t look at it until you get stuck while making your
    own:


