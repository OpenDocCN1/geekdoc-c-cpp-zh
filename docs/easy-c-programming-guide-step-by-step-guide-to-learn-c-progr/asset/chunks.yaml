    \ and run a simple C++ program.\n\n## The main function\n\nEach C++ application\
    \ (complete code) has the primary function first loaded into memory and then transferred\
    \ to the CPU for execution. When execution has been concluded, the primary integer\
    \ zero is returned by the function. Backward compatibility is one of the reasons\
    \ for this strategy.\n\nThe following is the general syntax for the main function:\n\
    \n```cpp\nint main()\n{\n    ...\nreturn 0;\n}\n```\n\nWhere `int` denotes that\
    \ an integer will be returned after the task is completed. This integer is set\
    \ to `0` on the penultimate line indicating that the execution was successful.\n\
    \nThe parentheses after primary encapsulate the main function's arguments; there\
    \ are none in this case.\n\nThe curly brackets indicate the start and finish of\
    \ the enclosing main program, which contains several instructions.\n\nThe dots\
    \ represent additional lines of code.\n\nThe semicolon serves as a delimiter,\
    \ indicating that the preceding command returns `0`, ending the execution.\n\n\
    `central` is a simplified version of the main program that returns nothing when\
    \ run `()`\n\n```cpp\n{\n    ...\n}\n```\n\nHowever, the preceding approach, which\
    \ includes a return statement, is highly encouraged as a best practice.\n\nWe'll\
    \ learn in Chapter 5 how the primary function can send and receive data from the\
    \ operating system. In that scenario, parentheses' parentheses in the parentheses\
    \ in the parenthesis in the `int main()` will enclose command line arguments.\n\
    \n## Problem\n\nParentheses and curly brackets are used in C++. Using the symbols\
    \ on your keyboard as a guide, what other bracket delimiters do you expect?\n\n\
    # Chapter 5\n\n## Programming in C++\n\nNow that we've covered the overall structure\
    \ of a C++ program, we'll go through the leading operators, instructions, and\
    \ logical constructions. The majority of these are the same as or comparable to\
    \ those found in other languages. C++, on the other hand, supports some unusual\
    \ and occasionally weird operations with which you should become acquainted.\n\
    \nIn Appendix C, you'll find correspondence is made between Matlab, Fortran 77,\
    \ and C++ in the form of a dictionary that explains how to translate corresponding\
    \ code.\n\n## Operators\n\nTo perform mathematical and logical operations, operators\
    \ apply to one variable or a set of variables.\n\n## Assignation\n\nThe assignation\
