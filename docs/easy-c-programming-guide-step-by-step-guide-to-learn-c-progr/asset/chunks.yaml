    # 文本处理


    在图像出现之前，所有的编程都是基于文本的。文本冒险游戏和公告板系统是我们的第一次编程经历。文本仍然是编程中不可或缺的一部分。在本节中，你将学习如何组合和存储文本。


    显示程序输出的最基本的媒介是文本。因为大多数程序的输出只需要文本即可显示，因此本书从文本开始。这种策略还允许我们将视觉复杂性的讨论推到后面的章节。


    字符串（string）是计算机世界中描述一段文本的术语。字符串是字符的集合；字符通常是指可以从键盘输入的符号，包括空格。例如，"Hello World" 是
    "Hello World" 程序中的一个字符串。


    # 组合字符串


    计算机将如 "For Honor!!!" 之类的字符串解释为一系列字符，每个字符都有一个字母或空格（F 是第一个字符，o 是第二个字符，以此此类推）。字符串用双引号括起来。例如，“a,”（空格）、“4,”
    和“%” 都是单字符字符串。


    尽管看起来很复杂，但创建字符串非常简单。下面提供了一些字符串示例。正如你看到的，只有几行文本被引号包裹。


    ```

    "For Honor!!!"

    "Pass me my sword."

    "Who put my staff on"

    ```


    ## 使用 COUT 显示字符串


    现在你已经知道如何构建字符串了，你可能想把它们显示在屏幕上。本节将演示如何以此方式实现。


    正如我们在分析 "Hello World" 程序时看到的，向屏幕打印内容并不是 `C++` 的内置功能。`C++ 标准库` 提供了这种能力。要使用它，你必须执行一些特定的操作。


    要开始，你必须在应用程序顶部包含一个文件。正如 Hello 程序所示，该文件在屏幕上显示文本。该文件的结构如下：


    ```

    #include <iostream>

    ```


    这提供了访问 `C++ 标准库` 主要组件的方法，但并不是结束。命名空间（namespaces）用于组织库的内容。这意味着在使用库中的任何内容之前，你必须先使用
    `std`。例如，你需要编写 `std::cout` 来使用 cout。这很耗时，直接使用 `std` 命名空间通常更容易。正如前面提到的，可以使用代码从命名空间提取术语：


    ```

    std::cout

    ```


    你可以使用 `cout` 显示任何字符串，例如：


    ```

    cout "For Valour!"


    ### 使用 cout 显示多个字符串


    你已经掌握了 `cout` 的基础，但还有很多需要学习。例如，你可以一次显示多个字符串。假设你想显示被两个字符串分隔的两段文本。如果你遵循上述指南，你的代码看起来应该是这样的：


    ```

    cout "Red"; cout "Dragon"; cout "Red"; cout "Dragon"; cout "Red"; cout << ”Red”
    " Dragon";

    ```

    输出：Red Dragon


    因为你可以使用单个较长的字符串（"Red Dragon"），这确实是一个简单的例子。


    通常情况下，你组织代码的方式应该是易读的。在每个短语的开头，应该使用新的 `cout`。为了显示一个关于龙的句子和另一个关于精灵的句子，龙句的所有内容应该出现在一个
    `cout` 之后。精灵句的所有内容应该出现在另一个 `cout` 之后。结果是你的代码将更有组织且更容易阅读。


    ## 使用转义字符


    引号（") 和换行符无法在字符串中字面表示。如果你在字符串中包含引号，编译器将将其解释为字符串的结束。例如，为了创建一个引用字符串，你可以这样写：


    ```

    "He said, "This is a quote. "

    ```

