    一样，`20` 表示输出宽度。


    `%20s` 使第 8 行的输出右对齐，根据字符串在该宽度内的长度改变其位置。`20` 前面的负号使第 9 行的字符串左对齐，这是文本通常的显示方式。要查看此代码如何工作，请构建并执行它。


    `s` 占位符的宽度选项将宽度设置为二十个字符。这个区域非常适合显示表格和列表。还有许多额外的宽度、精度、填充和其他占位符选项可用。`print` 函数的文档包含了几个选项以及一些示例。


