    # WORKING WITH TEXT


    Before the emergence of images, all programming was based on text. Text-based
    adventure games and bulletin board systems were our first programming experiences.
    Text is still an essential part of programming. In this section, you''ll learn
    how to put together and store text.


    The most basic medium for displaying program output is text. Because most programs''
    output can be displayed with only text, this book starts with just text. This
    strategy also permits us to defer discussion of visual intricacy until subsequent
    chapters.


    A string is a term used in the computer world to describe a chunk of text. A string
    is a collection of characters; a character is a symbol that may be entered from
    a keyboard, including spaces, in general. "Hello World" is a string in the "Hello
    World" program, for example.


    # ASSEMBLING STRINGS


    The computer interprets strings like "For Honor!!!" as a series of characters,
    each of which has one letter or space (F is the first character, o is the second,
    and so on). Strings are enclosed with double quote marks. "a," "(space), "4,"
    and "%" are all single-character strings, for example.


    Although it may appear complicated, creating strings is pretty simple. Some string
    examples are provided below. Only a few lines of text are surrounded by quote
    marks, as you can see.


    ```

    "For Honor!!!"

    "Pass me my sword."

    "Who put my staff on the wagon?"

    ```


    ## DISPLAYING STRINGS WITH COUT


    Now that you know how to build a strong, the first thing you''ll probably want
    to do is put it on the screen. This section will demonstrate how to achieve it
    in a variety of ways.


    As we saw in the dissection of the "Hello World" program, printing to the screen
    is not a built-in functionality of `C++`. The `C++ Standard Library` provides
    this capability. To use it, you must perform a few specific things.


    To begin, you must include a reference to the required file at the top of your
    application. As the Hello program demonstrated, this file displays text on the
    screen. The syntax (structure) of this reference is as follows:


    ```

    #include <iostream>

    ```


    This offers you access to the main components of the `C++ Standard Library`, but
    it''s not the end of the story. Namespaces are used to arrange everything in the
    library. This means that before using anything from the library, you must first
    use `std`. You''d have to write `std::cout` now to use cout, for example. This
    is time-consuming, and it''s often easier to just utilize the `std` namespace
    to get the terms. As previously stated, the following code can be used to extract
    terms from a namespace:


    ```

    std::cout is used;

    ```


    You can use `cout` to display any string, for example:


    ```

    cout "For Valour!"

    ```


    ### Displaying Multiple Strings with cout


    You''ve mastered the fundamentals of `cout`, but there''s still a lot more to
    learn about instrument its strings. You can, for example, display multiple strings
    at once. Assume you wish to display two bits of text that are separated by two
    strings. If you follow the guidelines outlined above, This is how your code should
    look:


    ```

    cout "Red"; cout "Dragon"; cout "Red"; cout "Dragon"; cout "Red"; cout << ”Red”
    " Dragon";

    ```

    Output: Red Dragon


    Because you may use a single, longer string ("Red Dragon"), this is genuinely
    a simple example.


    In general, you structure your code in such a way that it is simple to read. At
    the start of each phrase, a new `cout` should be used. To display a sentence about
    dragons and another about elves, everything in the dragon sentence should come
    after one `cout`. Everything in the elven sentence should come after a separate
    `cout`. Your code will be more organized as a result and easier to read.


    ## WORKING WITH ESCAPE CHARACTERS


    Characters like quote marks (") and line breaks cannot be expressed literally
    in a string. If you include a quote mark in a string, the compiler will interpret
    it as the string''s end. For example, to make a quotation string, you may write:


    ```

    "He said, "This is a quote. "

    ```

