- pgno: 134
  md: 'evaluate ourselves, our peers, our supervisors, and our supervisees (if applicable).
    The comprehensive reviews and weekly one-on-ones aid to ensure staff accountability
    for growth to meet our holistic, developmentally appropriate outcomes.


    # Assessment and Evaluation


    Assessment is an integral aspect of the student staff model in the Pride Center.
    Through the utilization of both formal and informal assessment techniques, strengths
    and opportunities for growth were acknowledged. Our assessment approach is multi-faceted;
    we begin with each student staff member completing a self-assessment that asks
    them to reflect on their strengths and growth edges in the context of the ETR.
    Following the completion of the rubric, bi-weekly one-on-ones are constructed
    as opportunities to discuss projects and aspects of the rubric to ensure that
    students are working to utilize their strengths and learning more about areas
    of personal growth. Last, we utilize a comprehensive review process at the end
    of each semester where all staff (professional staff included) complete an evaluation
    for each of their fellow team members. The staff may send the form to other individuals
    if they desire feedback from people in other areas of their lives.


    Anecdotally, we have witnessed our students progress in their understanding of
    intersectional praxis as they willingly embrace the process of critical reflection
    about their own social identities and how they interact with systems of power,
    privilege, and oppression. We have found that bi-weekly check-ins, and the use
    of comprehensive reviews and ETR, helped students critically reflect on growth
    areas in increasingly deeper, more intentional ways. Many of the student staff
    members hold leadership roles in student organizations that are advised by Pride
    Center staff. We have seen these student staff members encourage their executive
    boards to think about how leadership decisions may impact general members who
    may hold different identities than their own. While planning Pride Center programs,
    the staff challenge each other to think critically about how their biases may
    impact the way they plan such events. These are just two examples that demonstrate
    student progress in their development toward self-authorship and intersectional
    leaders.


    The model has only been in practice since 2015, so we have limited longitudinal
    data. However, we are hopeful of the possibilities of continuing to refine this
    model through the cumulative experiences of the'
