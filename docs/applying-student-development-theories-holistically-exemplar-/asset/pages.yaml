  md: '# Fostering Engagement With Social

    Justice Through Experiential Learning


    *B. Ashley Staples, Ben Jones, and Vanessa Perez*


    The Passion to Action program was designed using an experiential learning framework
    to develop paraprofessional student staff members’ ability to engage with social
    justice personally, and implement programs that achieve social justice learning
    outcomes. The program was implemented during a four-year period in an upper-level
    students’ residence hall at New York University (NYU). Passion to Action was a
    two-part program that built confidence, knowledge, and skills through a “Props
    for Passion” activity, and the subsequent implementation of social justice programming
    that met departmental and institutional priorities through a “Passion Projects”
    activity. This program was structured according to Kolb’s (1984) Stages of Experiential
    Learning, and facilitated across an academic year timeline; the learning outcomes
    at each stage were constructed using Bloom’s Taxonomy of Educational Objectives,
    as updated by Anderson and Krathwohl (2001).


    Passion to Action fostered engagement with social justice topics in a residence
    hall at New York University (NYU). NYU is a private research university enrolling
    nearly 60,000 students from diverse demographic backgrounds enrolled in programs
    across all degree levels (NYU at a Glance, n.d.). Residential Life and Housing
    Services (RLHS) houses more than 11,000 students and employs approximately 350
    students and 100 professional staff members. Lafayette Hall houses 1,100 residents,
    roughly 10% of NYU’s total residential population (Lafayette Hall, n.d.). Lafayette
    Hall is a microcosm of the residential campus, and'
