- pgno: 170
  md: 'While we based our practice in two well-known theories, we surmised we would
    not cultivate the undergraduate paraprofessional staff members’ buy-in by framing
    Passion to Action with student development theory or describing how departmental
    learning outcomes would be met. We believed we needed a more relatable and personal
    hook.


    While brainstorming multimedia that might inspire our undergraduate paraprofessional
    staff members to embrace our new initiative, we came across the YouTube channel
    of Kid President, a young boy who produced a series of videos on leadership, compassion,
    and relationships, among other things. The video entitled A Pep Talk from Kid
    President to You (2013) served as the kindling for introducing “Props for Passion.”
    In the video, Kid President issued a call to action for humankind to “stop being
    boring,” “do something,” and “be on the road that leads to awesome.” He delivers
    a poignant call to never quit, because quitting limits the potential for the big
    successes of life and restricts people to their comfort zones. We used these sentiments
    as the inspiration for “Props for Passion” and framed a motivating question: “What
    will you create that will make the world awesome?” This broad question allowed
    our staff members to engage with the initiative in a personal manner and across
    many levels of comfort and familiarity with diversity topics while also progressing
    through Kolb’s (1984) stages of experiential learning, and while using Bloom’s
    revised Taxonomy of Educational Objectives (Anderson & Krathwohl, 2001) to craft
    the learning outcomes for their “Passion Project” programs.


    Our second lesson was to understand the power of language. The Kid President used
    language that we hoped would cue our team to think about diversity, inclusion,
    and social justice, though he does not explicitly say any of those words. We found
    that using a popular social media platform aligned with the normal habits of our
    undergraduate paraprofessional staff members and further hooked them with programmatic
    outcomes such as honing communication skills, crafting presentations for impact,
    and incorporating “awesomeness” into their programming. It allowed us to freely
    use language that was simple and understandable, again, while creating learning
    outcomes for their programs based on Bloom’s taxonomy (Anderson & Krathwohl, 2001).
    As we developed Passion to Action, we kept this video as the constant and consistent
    inspiration and showed it during both fall and winter pre-service training.


    Our final lesson was understanding how the timing of Passion to Action would be
    reflected in short-term and long-term programmatic'
