  md: 'an end-of-semester survey, and a review of program reports revealed that they
    had challenges with discussions and programming around social justice. Issues
    that prevented them from engaging in these topics included a lack of common language
    (e.g., “inclusivity” used to describe being considerate and welcoming to others
    rather than acknowledging and validating others’ social identities), self-confidence
    (e.g., only external facilitators were secured for diversity-related programming),
    and ability to dialogue (e.g., intentionally disengaging from casual conversations
    about diversity because of discomfort).


    We created and implemented “Props for Passion” to address these challenges with
    the hope that it would lead to more face-to-face discussions and ultimately enhance
    the social justice culture in the residential community. After participating in
    the intervention, our undergraduate paraprofessional staff members reported having
    more conversations oriented toward social justice, enhanced opportunities to collaborate
    in planning programs related to social justice, and a greater confidence in engaging
    with diversity topics with their residents and colleagues. Based on these assessments
    and the returning undergraduate paraprofessional staff members’ excitement for
    the program, we restructured the initiative into *Passion to Action*, a two-part
    program with “Props for Passion” (sharing a personal story) in the fall semester
    and “Passion Projects” (social justice activity to share with and bring to the
    community) in the spring semester.


    # **Guiding Theories**


    We structured *Passion to Action* according to Kolb’s (1984) stages of experiential
    learning. The program goals of *Passion to Action* were two-fold: (a) undergraduate
    paraprofessional staff members would be able to connect to and share their own
    passions and (b) undergraduate paraprofessional staff members would be able to
    implement more interpersonal, emotional, and intellectually challenging social
    justice programming in the community. We used the outcomes language of the revised
    Bloom’s Taxonomy of Educational Objectives (Anderson & Krathwohl, 2001) to create
    learning outcomes for the program; undergraduate paraprofessional staff members
    would be able to: (a) recognize their passions and articulate those to their peers,
    (b) identify common passions on the undergraduate paraprofessional staff member
    team and/or respond to new topic areas for exploration, (c) create'
