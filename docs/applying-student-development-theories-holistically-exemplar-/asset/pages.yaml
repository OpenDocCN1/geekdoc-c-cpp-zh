  md: 'Development (nigrescence) model (Taylor & Howard-Hamilton, 1995; Harper & Quaye,
    2007).


    As active members of the Mizzou community, participants not only support the efforts
    of their peers, but also advocate for and facilitate programs that enrich both
    the Black student experience and larger campus community. Harper and Quaye (2007)
    note that active engagement enables strong Black identities that incite productive
    activism on predominantly White campuses. The students’ dedication to giving back
    to their community while pursuing their education can be reflective of a healthy
    Black identity (Internalization/Internationalization-Commitment stage). The focus
    is a long-term commitment and vested interest in Black affairs on Mizzou’s campus.


    To measure a sense of belonging, the leadership team tracks participants’ campus
    involvement, including student organization membership, community service programs,
    social activities, and attendance at events on campus. Involvement and sense of
    belonging is also considered in reflection papers and class discussions and social
    activities.


    # LESSONS FROM APPLYING THEORY ARTFULLY


    Our goal for the continuation of MBMI does not rest solely on data analysis, but
    by the needs presented in Strayhorn and Terrell’s (2010) work. Educational settings
    that are incongruent to the experiences of Black males create formidable challenges
    to their matriculation experience (Strayhorn & Terrell, 2010). The necessity to
    carve out spaces for Black males to be successful in predominantly White spaces
    with a program like MBMI is acute. However, even with the efforts and resources
    we have utilized thus far, there is recognition that additional assessment and
    reevaluation is needed to enhance and sustain the program’s success.


    This assessment could potentially resolve some of the challenges that the program
    faces and improve the experiences of participants. First, an expansion of the
    program to involve more participants could lead to a greater sense of belonging
    and identity discovery for Black males at Mizzou. The developmental opportunities
    that the MBMI program offers its participants, while impactful, only reaches a
    small percentage of the Black male community at the university. A commonly asked
    question is, “What happens to those individuals who are not involved in the program?”
    A gradual, yet sustainable growth period would be an ideal scenario to involve
    more participants. Second, an increased budget could offer more robust programming'
