    of how to be sensitive to others’ preferences.


    In the same sense, students often claim that one of the biggest values of the
    program is providing, in another student’s words, “a space for open dialogue about
    differences in cultures.” Additional examples of survey responses include the
    following:


    +   - “I never felt awkward during the buddy events because we all knew that we
    were doing something a little different than what we were used to and because
    of that I felt like I really learned what it’s like to understand someone from
    another country.”

    +   - “It creates a positive and safe space for buddies to share on a one-on-one
    basis without feeling any potential academic or social pressures.”

    +   - “I liked that we were encouraged to discuss each other’s cultures and personalities
    without using small talk. We felt comfortable enough to discuss challenges, stereotypes,
    fears, and hopes while at the University of Iowa.”

    +   - “I have learned that international students are no different than I am—I
    love that my buddy and I share the exact same morals and values, even though we
    are from opposite sides of the world.”


    # *International Students Experience Difference Within a Welcoming Support Structure*


    For international students in particular, the program appears beneficial because,
    despite the university’s efforts, it can be difficult to build meaningful friendships
    with students of different cultural backgrounds, particularly at a PWI. For many
    international students, the idea of difference is inherent from the time they
    enroll at the university, not the least of which stems from the strict regulations
    that govern their stay. However, like many domestic students, this is still a
    crucial time in their development, and we see many students with identities still
    in flux. Yet, our data suggests that the program provided support for students
