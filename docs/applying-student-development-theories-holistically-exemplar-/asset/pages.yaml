  md: '# Promoting Self-Authorship Using Individualized Accountability Plans


    Erik Sorensen and Elizabeth K. Walsh


    *Student staff members are critical to the success of student life divisions in
    higher education. Resident assistants, orientation leaders, and other student
    leaders are at the forefront of work with additional students. As such, their
    development and effectiveness in their roles are of the utmost importance. A specific
    tool and technique to foster development is the use of Individualized Accountability
    Plans (IAPs) that are grounded in the theoretical perspectives of Kegan’s (1994)
    Orders of Consciousness and Baxter Magolda’s (2004) self-authorship. IAPs help
    student staff and their supervisors co-create action plans to inform their work,
    and decide how each staff member will be held accountable. Co-creating a plan
    of this nature is a developmental practice of its own—akin to Baxter Magolda’s
    (2004) Learning Partnerships Model. This chapter describes the philosophical and
    theoretical background of IAPs, a process of implementing IAPs, possible approaches
    to assess effectiveness of IAPs, and recommendations to develop further the IAP
    process.*


    Individualized Accountability Plans (IAPs) are action plans co-created by supervisors
    and supervisees that help staff members take ownership of their positions, including
    how they approach and are held accountable for their work. This chapter describes
    how the authors have implemented IAPs with student staff at Miami University in
    Ohio. Erik serves as an Assistant Director of Residence Life at Miami University;
    he works closely with Resident Assistants (RAs) as well as supervises full-time
    and graduate hall staff. Elizabeth, who is known as "Liz," serves as the Assistant
    Director for Orientation and Transition Programs working with'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Student Orientation Undergraduate Leaders (SOULs); Liz has prior experience
    at Miami University working in Residence Life with RAs. Both Erik and Liz studied
    in the Student Affairs and Higher Education program at Miami University: Liz as
    a master’s student and Erik as a doctoral student. Both authors have implemented
    IAPs with student staff with the guidance of both our coursework and professional
    experience.


    Miami University is situated primarily in the small, Midwestern town of Oxford,
    Ohio. Founded in 1809, the charter of the institution preceded the establishment
    of Oxford. Thus, Miami University’s Oxford campus is highly residential. It is
    a four-year public university that has a large undergraduate population of approximately
    17,000 students. Approximately 40% of Miami students are in-state students. Demographically,
    51.5% of students are female, and 48.5% of students are male. Domestic students
    are 87% of the population, while international students represent 13% of the student
    population. Domestic students of color are 14.3% of the student body. Because
    of strong Miami University tradition, legacy students (e.g., sons, daughters,
    siblings of alumni) are 11.7% of students (Miami University Admissions, 2017).


    Moll (1985) referred to Miami University as a “Public Ivy,” noting schools in
    this category offer an Ivy League education at a public school financial cost.
    Its Carnegie basic classification is a doctoral university with higher research
    activity. Miami University holds strong traditions and values in academia and
    co-curricular life, making it a great place to challenge students to find their
    voices, values, and passions. This can include partnering with students in co-creating
    experiences inside and outside of the classroom.


    # DESCRIPTION OF INDIVIDUALIZED ACCOUNTABILITY PLANS


    IAPs were originated by the Office of Residence Life as a tool for Resident Directors
    to actively engage student learning and personal growth in the Resident Assistant
    (RA) position. IAPs have since been applied in multiple contexts with different
    student staff positions in order to closely align human development with student
    affairs practice. The goal of using IAPs is to help student staff members make
    meaning of their jobs and leadership roles on an individualized level that propel
    them toward the construct of self-authorship. IAPs serve as a strategy to provide
    student staff members with greater autonomy and encourage them'
