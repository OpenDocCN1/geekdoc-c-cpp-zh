  md: 'The funds are used to hire someone part time or support the fellow, as an honorarium
    for the fellow. The two staff members and fellows meet every other week.


    The Ethical Reasoning in Action program is unique in its campus-wide application
    at JMU. Educational interventions occur in the co-curriculum (e.g., student employee
    training, student leadership programs, career selection and preparation discussions,
    student-led workshops, student-conducted educational workshops, resident advisor
    training) and in the curriculum (e.g., general education courses, major and pre-professional
    courses, graduate and doctoral courses). Numerous faculty, staff, and students
    design and deliver interventions that target one or more learning outcomes.


    Bridging the gap between moral development theories and practice can be challenging.
    This is partly why the team that developed Ethical Reasoning in Action conceived
    of ethical reasoning as a *skill* that could be developed and practiced. Traditional
    lecturing on ethics codes or philosophical theory encourages complex thinking
    on an issue but does not necessarily develop skills to make ethical decisions.
    Through experiential learning activities, students connect with the content and
    process of ethical reasoning. Case scenarios serve as the primary experiential
    vehicle. Many case discussions utilize a circle process with a talking piece to
    encourage an open conversation for students to express their thoughts and challenge
    each other in a respectful way while using the 8KQ as a structure. Through these
    peer interactions, students may be challenged to look beyond the authorities that
    have dominated their worldview to see others as valid sources of information.


    Beyond the superficial connection of Gilligan (1982) to the empathy question or
    Kohlberg (1981) to the fairness question, the theories come alive when considering
    that students’ cognitive and moral development is spurred by ethical reasoning
    educational interventions. By asking the 8KQ, students’ self-focused thought processes
    are intentionally interrupted and challenged to produce “ah-ha” moments. They
    can be challenged to move forward in their moral development by bringing thoughts
    about others into their decision-making, and by being supported through fictional
    and real-life problems and ethical dilemmas. Following are five program-specific
    educational interventions.


    # ***Peer-to-Peer Workshops***


    A group of Ethical Reasoning in Action volunteer peer educators delivers interactive
    ethical reasoning workshops for other students,'
