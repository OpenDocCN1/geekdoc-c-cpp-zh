  img_proc: true
- pgno: 133
  md: 'communication to meet the needs and expectations of the intended audience.
    We define teamwork as one’s ability to interact effectively with peers and foster
    relationships with individuals and other units/offices across campus. To foster
    such relationships, communication skills must be effectively utilized. Critical
    thinking skills are developed throughout the student staff experience, and include
    making informed decisions, seeing problems from different perspectives, creating
    alternate interpretations of ideas, and identifying multiple approaches to solving
    problems. The fourth trait, intercultural competency, is deeply embedded in the
    student staff experience, and is grounded in an intersectional framework. We define
    a foundational component of intercultural competency as actively seeking opportunities
    to increase one’s personal understanding of cultures and lived experiences different
    from one’s own. We challenge student staff members to move beyond recognizing
    intercultural competency as an individual process to acknowledging institutional
    and systemic components of oppression and marginalization. We define the last
    trait, administrative and organizational management, as adhering to high standards
    of personal and professional conduct, responding positively to change, and demonstrating
    a willingness to learn new methods for organization and administrative tasks.


    ETR is intended to support the learning and development of undergraduate student
    staff in the Pride Center and Office of Multicultural Affairs and is utilized
    throughout the year as both a reflective and evaluative tool. Throughout the year,
    student staff members are challenged to strengthen these five traits through their
    work in the Pride Center, in the classroom, in other leadership capacities, and
    personally. Student staff reflect on the five traits regularly in one-on-one meetings
    with other staff members and supervisors. ETR is also incorporated into biannual
    comprehensive reviews. The reviews are grounded in the concept of multi-rater
    feedback and challenge traditional unidirectional performance review approaches
    (Bracken, Dalton, Jako, McCauley, & Pollman, 1997), as well as the principles
    of the LPM, which views learning as co-creative and non-hierarchical (Baxter Magolda,
    2004).


    While student staff are held to high standards, we recognize the need to learn
    alongside the student staff and meet our own expectations within the various traits
    outlined in the rubric. At the end of each semester, both professional and student
    staff undergo the comprehensive review process infused with language from the
    rubric, whereby we'
