  md: 'does not. The supervisor should not hesitate to encourage the student staff
    members to revisit this plan if it is not effective.


    Managing this iterative IAP process increases the ownership that student staff
    has over their work, and the IAP must be heavily dependent on, and thus the responsibility
    of, the student staff member. It is, however, important to note that depending
    on each student staff member''s developmental capacity and experiences, the student
    may need more or less support from the supervisor during this process. One should
    not expect that all student staff will have the developmental capacity to complete
    this on their own, and the supervisor should provide the appropriate level of
    support to each staff member to help build a robust and meaningful IAP.


    This appropriate level of support can take on different forms. Baxter Magolda
    and King (2007) suggest that the supervisor must offer time, space, and encouragement
    for an effective interview or conversation. If one does not allow time and silence
    for the student staff member to think and reflect, then they may curtail important
    processing time. Although there are strategies to approach these conversations
    as developmental practice, there is no simple procedure to follow to understand
    one''s developmental capacity without investing significant time to understand
    how they make meaning. Through our own learning and growth as supervisors and
    interviewers, we can become more effective, but this requires self-reflection
    and developmental work for ourselves.


    # RECOMMENDATIONS AND RESOURCES


    # IAPs Are Instrumental for a Campus-Wide Approach


    There are significant opportunities to continue to utilize IAPs to connect self-authorship
    with student staff supervision through use of the LPM. IAPs could be expanded
    to include entire departments or student life areas on college campuses. For maximum
    benefit, this requires the entire organization to commit to using this approach.


    # Create a Strong Set of Developmental Questions


    Regardless of the scope in which it is implemented, having a set of strong developmental
    questions is helpful for learning partnerships'
