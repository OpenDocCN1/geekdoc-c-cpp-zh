  md: 'FGS (WIU 2017). We suspect this percentage is probably low because of the way
    it is crafted: It does include students whose parents did not attend college,
    but it does not include students who had an older sibling attend college. Across
    the literature, a range of students are recognized as FGS because no one definition
    as to what constitutes FGS status exists (Davis, 2010).


    This chapter explores Western 1st Generation Society (W1GS), a registered student
    organization at WIU for FGS. The advising team for W1GS and authors of this chapter
    include a faculty member and graduate students from WIU''s College Student Personnel
    (advising team members are also the authors of this chapter.)


    A key component we considered during the creation of W1GS was finances. We understood
    that nationally, FGS have a lower median household income and more unmet financial
    need compared with non-FGS students (Postsecondary National Institute, 2016).
    Although research indicates that not all FGS are low-income individuals (Davis,
    2010), we considered it important to keep the cost for W1GS to a minimum. Accordingly,
    W1GS was created and implemented with little or no costs to the students.


    # DESCRIPTION OF WESTERN 1ST GENERATION SOCIETY


    The idea for W1GS originated from the lead author of this chapter. Because I had
    worked in student activities, creating a student organization was a familiar process
    for addressing an unmet need. "More than anything else, FGS need a place to go,
    a place to be themselves, when they begin their college career. Finding a place
    to go, to study, to hang out with friends, accelerates the acclimation process
    by directly addressing the transition from the home space to the college space"
    (Davis, 2010, p. 72). While some needs of FGS students may be served through resources
    such as cultural centers, FGS also have multiple identities that influence their
    success. It seemed as though an experience tailored for FGS could better aid in
    supporting their success.


    The initial implementation and continued development of W1GS are centered on five
    core values: dedication, grit, curiosity, community, and integrity. The advising
    team selected these values based on research regarding mindsets, stereotype threat,
    behaviors, and skills that FGS use to succeed in college (Davis, 2010; Steele,
    2011; Ward, Siegal, & Davenport, 2012). Each of these values are identified as
