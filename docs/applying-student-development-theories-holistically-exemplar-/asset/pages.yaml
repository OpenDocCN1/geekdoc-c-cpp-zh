  md: '# APPLYING STUDENT DEVELOPMENT THEORIES HOLISTICALLY


    This book dives into student development theory, unpacking key foundational and
    emergent theories of college student development while providing contemporary
    examples and application. Helping aspiring higher education and student affairs
    practitioners grasp and use theories holistically, this important text brings
    to life theoretical knowledge to enhance the development and learning of college
    and university students. Showcasing a diversity of programs, practices, and services
    across a variety of institutional types, *Applying Student Development Theories
    Holistically* demonstrates how professionals are intertwining the science of theory
    with the art of practice in multidimensional, holistic ways.


    **Katie Branch** is Associate Professor in the Department of Human Development
    and Family Studies at the University of Rhode Island, USA.


    **Jeanne S. Hart-Steffes** is Vice President of Student Affairs and Dean of Students
    at Western New England University, USA.


    **Christine M. Wilson** is Assistant Vice President for Student Affairs and Director
    of Student Activities at the University of Connecticut, USA.'
