    Structured touchpoints included the kickoff, the closing potluck, and five more
    social events throughout the semester, both on campus (e.g., pumpkin carving)
    and off campus (e.g., visit to local organic farm). The Assistant Director collaborated
    with popular locally owned businesses in downtown Iowa City to offer discounts
    to buddies who visited the establishments as a pair (using a Buddy sticker on
    student ID cards). A Twitter competition awarded a significant prize (e.g., Beats
    by Dre® Headphones) to the buddy pair who tweeted the most photos of meet-ups
    during the semester. This generated enthusiasm for the program and a rich stock
    of photos for marketing purposes.


    Changes to the program resulted in continued increased participation in the following
    semesters. These changes fostered more opportunities for interaction, encountering
    difference, and reflecting on one’s own ethnic identity. During the Fall 2014
    semester, 66% of survey respondents reported meeting four times or more, with
    26% meeting seven times or more. Open-ended comments included positive reflections
    about encountering difference such as, “It was a new experience and one that put
    me out of my comfort zone, which I hope was a chance for growth for both of us.”


    The structure established in Fall 2014 has remained largely intact, with further
    improvements made over the past six semesters to encourage more and meaningful
    encounters with difference. By Spring 2017, the program had become streamlined
    with regard to events and programs offered, campus and community partnerships,
    and an enhanced training protocol for the Ambassadors. Ambassadors serve as the
    liaison between the program participants and the Assistant Director. Thus, training
    includes best practices for pairing participants, as well as intentional conversations
    regarding the overall goals and aims of the program. When planning events for
    the semester, Ambassadors are tasked with presenting evidence that the events
    support program and outcome goals. At events, Ambassadors also gauge these outcome
    goals through interactions with students. Finally, Ambassadors participate in
    the debrief process after each semester and are encouraged to help shape future
    iterations through reflections themselves as well as through review of the survey
    responses.


