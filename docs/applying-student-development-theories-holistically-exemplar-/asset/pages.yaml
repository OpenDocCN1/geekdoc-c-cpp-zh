  md: 'students with positive coordinated institutional support for transfer. Wyner
    et al. (2016, pp. 29–40) also confirmed three of the strategies in The Transfer
    Playbook that tailored transfer student advising to discuss degree exploration,
    such as hosting in-house interactions, are essential to student success.


    # Transitional Programming, Advisor Training, and Resources


    Transitional programming, advisor training, and Passport resources are developed
    by Passport’s Assistant Director as a response to the needs of ITISA and IUPUI
    students, faculty, staff, and administrators. The Assistant Director oversees
    the compilation and dissemination of two resources: the newsletter (as mentioned
    previously) and the Passport Transfer Guide. Key topics of the Passport Transfer
    Guide include transfer options available to students, IUPUI admission requirements,
    application deadlines, and scholarships.


    Through student anecdotes and daily advising interactions with students, some
    students expressed frustration regarding the complexity of the transfer process.
    These anecdotes revealed students may experience mixed emotions as they navigate
    the transfer process, which may demonstrate some students are still developing
    in the managing emotions vector of Chickering and Reisser’s (1993) seven vectors.
    Passport created the Passport Transfer Guide as a succinct resource to address
    the major components of the transfer process and in turn attempt to make the transition
    for students as smooth and simple as possible, thus limiting the frustration.


    Schlossberg et al.’s (1995) identified coping variables are also addressed in
    Passport’s resources. The Passport Transfer Guide provides a gradual onset of
    the transitional journey by “setting the stage” for transfer. The overall voice
    of the guide encourages students to focus on the positive affect of transitioning
    to IUPUI, as well as re-establishes students as the internal source to direct
    their transition.


    Throughout the fall and spring semesters, Passport visits ITISA’s Student Success
    in University Transfer courses (i.e., IVYT 111) and capstone courses to share
    IUPUI transfer information with students. As these courses are offered in various
    formats across ITISA, Passport provides instructors the option of an in-person
    presentation or a voice-over infographic Microsoft PowerPoint presentation. These
    presentations may serve as a student’s first point of contact with Passport. As
    a result, a connection is established in which students seek Passport advising
    and attend supplemental events designed to aid in their transition.'
