    As is evident, student staff members are not left to create what the expectations
    of their role should be; rather, they do have the opportunity to shape what their
    particular experience looks like and feels like on a day-to-day basis within the
    context of larger parameters.


    To create an IAP, student staff members take the parameters set forth by their
    supervisors and examine the best way to go about meeting those expectations. In
    several cases at Miami University, RAs were given a list of questions they needed
