  md: 'members. Opportunities included staff meetings, one-on-one meetings, resident
    feedback (e.g., surveys, conduct meetings, hall government), and program proposals
    and assessments for "Passion Projects." During "Props for Passion," staff members
    demonstrated high levels of vulnerability as they presented their passion area
    in front of a large group of peers. That vulnerability was met with validation,
    as seen in the ways that the undergraduate paraprofessional staff members supported
    one another, and the ways in which the information shared resonated with many
    difference colleagues. Ninga shared, "The more vulnerable the topic, the more
    supportive they were! It was very cathartic." Similarly, Riya reflected, "While
    sharing my story and becoming emotional, I heard murmurs of agreement and support
    from the audience—something that emboldened me."


    During "Passion Projects," we observed that the programs were often higher quality
    (e.g., more advanced planning, better marketing, multiple stakeholders) than others
    developed in the spring semester. Hyland shared, "I was way more invested in this
    particular program because I felt that I was actually sharing a part of myself,
    and not just meeting program/event quota." Undergraduate paraprofessional staff
    members often programmed together and supported one another''s visions and the
    residents who attended their events. Bryanna shared, "Helping on other Passion
    Projects, and even thinking about my own, I made lasting connections with residents
    who were genuinely interested in the topic and gave us a ''common bond'' regarding
    the program."


    In self-assessment surveys, the undergraduate paraprofessional staff members demonstrated
    an ability to articulate how the initiatives were achieving the learning outcomes
    they intended for their residents. For example, Rolah articulated, "The goal was
    to teach residents about different disabilities that many people have to live
    with . . . people came in not taking it seriously but were the most vocal . .
    . talking about their feelings and why the activity resonated with them."


    # LESSONS FROM APPLYING THEORY ARTFULLY


    Our first lesson was determining that the diversity and social justice training,
    at the time, was not enough for our team to be effective social justice programmers.
    The undergraduate paraprofessional staff members recognized their own knowledge,
    confidence, and skill gaps in engaging and implementing these opportunities at
    Lafayette Hall.'
