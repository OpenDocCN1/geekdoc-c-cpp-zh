  md: 'changes. This new program would initially place the majority of our programming
    efforts in the spring semester, and then evolve to have returning undergraduate
    paraprofessional staff members ready to lead social justice programming in the
    fall. At various times in the year it felt as though none of the intended outcomes
    was being achieved, and it was reassuring that we had a strong theoretical framework
    and undergraduate paraprofessional staff members who were committed to being social
    justice educators.


    # RECOMMENDATIONS AND RESOURCES


    The *Passion to Action* program was created to respond to a perceived gap in comprehension
    and implementation of diversity and social justice efforts among the undergraduate
    paraprofessional staff members. To ensure that the program—or similar programs—are
    sustainable, we recommend the following:


    # Align with Departmental Objectives


    New York University’s RLHS provided five departmental program learning goals:
    Life Skills, Multiple Perspectives, Community, Diversity, and Wellness. Each hall’s
    leadership team defined how these goals would be achieved within their communities.
    Prior to *Passion to Action*, in Lafayette Hall, undergraduate paraprofessional
    staff members were submitting program proposals heavily representing Life Skills,
    Multiple Perspectives, Community, and Wellness, but few for the Diversity goal.
    One of the goals of *Passion to Action* was to enhance the alignment between the
    expectations of the department and the offerings in the building, and to facilitated
    programming that supported the Diversity goal.


    # Have a Formal Assessment Plan


    *Passion to Action* is an assessment challenge because of program outcomes at
    three levels: department, hall, and undergraduate paraprofessional staff. Initially,
    we only conducted informal assessment through one-on-one supervision conversations
    and reviewing program proposals. Our'
