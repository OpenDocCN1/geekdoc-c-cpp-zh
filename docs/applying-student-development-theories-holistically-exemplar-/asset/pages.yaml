    # Support


    Student support is partially gauged through a needs assessment administered early
    in the program and throughout the semester. Participants are asked to articulate
    what they expect to learn from the MBMI program overall and their expectations
    of the leadership team. Participants also establish community norms with their
    classmates to encourage a positive learning environment. Both the needs and expectations
    are revisited in one-on-one meetings with members of the leadership team. The
    goal is to ensure the MBMI program remains focused on the identified needs of
    its participants. While providing general resources and information is relevant
    to the students’ matriculation, the program revises the curriculum to meet the
    students’ individual needs.


    Students are required to meet with their peer mentors regularly throughout each
    semester. During the meetings, peer mentors dialogue with their assigned mentees
    to gauge their personal, social, and academic transitions. Based on what is discussed
    in the meetings, peer mentors provide recommendations on how the MBMI participants
    can adjust and improve their experiences. Peer mentors work to create group mentor
    sessions based on identified needs and obstacles. In doing so, participants can
    connect with their peers on a personal level based on the vulnerability and transparency
    of their relationship. Participants also are required to meet with the instructor
    at least once a semester to discuss academic obstacles and progress.


    After attending campus events and completing the reflection papers, participants
    engage in peer-led discussions about what they learned and wrote about for the
    assignments. These group discussions allow students to affirm one another’s experiences
    as well as challenge their perspectives in a way that contributes to a supportive
    learning environment. Reflection papers help give the leadership team insights
    into the needs of the participants. In turn, members of the leadership team can
    utilize information learned from the papers in their one-on-one meetings.


    # Development


    The development of MBMI members is facilitated through curricular and co-curricular
    activities designed to address students holistically, and specifically to address
    the development of healthy Black identities as'
