  md: 'of traditional student populations, which means emphasizing those students
    transitioning from one four-year institution to another. Schlossberg’s work also
    is rooted in adult development theory, including age 18 and up, as well as various
    life experiences. However, community colleges are adopting programs to entice
    high school student enrollment such as honors programs that may have students
    younger than 18. Further, this theory does not take into account a student’s maturity
    level being one of an adult, regardless of age. A major limitation of Schlossberg’s
    transition theory is a lack of mindfulness about how intersectional aspects of
    identity influences students’ transitions. As a result, transitional theory may
    miss out in serving practitioners with a comprehensive understanding regarding
    the various barriers and considerations we encounter as we work with a progressively
    diverse student population.


    Passport cannot entirely be confident of the extent to which transfer students
    have mastered the content shared during an appointment or transfer workshop since
    not all students who have appointments with Passport respond to the Passport survey.
    Additionally, Passport currently does not have a survey to evaluate the effectiveness
    of the transfer workshops. These are two opportunities for Passport to grow and
    potentially expand services to students.


    Passport made many connections with transfer research such as Flaga’s (2006) dimensions
    of transition and Wyner et al.’s (2016) *The Transfer Playbook*. It can be argued
    that the last two dimensions of Flaga’s (2006) research, *negotiating* and *integrating*,
    may be more strongly connected with a student’s post-transfer experiences rather
    than Passport’s involvement as a pre-transfer resource to students. There is an
    opportunity for Passport to collaborate with IUPUI’s Office of Transfer Student
    Services to explore how students may be progressing through Flaga’s (2006) dimensions
    of transition and how services may be improved to help students establish a strong
    sense of connection with IUPUI prior to transferring.


    # RECOMMENDATIONS AND RESOURCES


    # Utilize a Variety of Initiatives


    A strong commitment to transfer student support is critical. Passport has created
    numerous initiatives between Ivy Tech and IUPUI to include partnerships, the Passport
    Transfer Guide, the Passport newsletter, tailored campus visits, pre-transfer
    advising on Ivy Tech’s campus, and articulation and curricula agreements.'
