    # Guiding Theories


    The design for W1GS is guided by three theories: Davis’s (2010) content theory
    on the first-generation student experience, and two process theories: Baxter Magolda’s
    (2001) theory of self-authorship and Kolb’s (1984) theory of experiential learning.
    Davis’s (2010) theory helps us understand what the unique needs of FGS are. When
    used in tandem, self-authorship (Baxter Magolda, 2001) and experiential learning
    (Kolb, 1984) challenge us to think about how we go about creating and implementing
    an initiative to meet those needs.


    According to Davis (2010), FGS are largely underserved by colleges and universities.
    This is especially true at public, four-year institutions where students are “more
    likely allowed to stay passive about education and potentially become psychologically
    disaffected, or fall through the cracks” (p. 20). Davis also highlights specific
    issues FGS face in higher education settings that impact their success. Each issue
    informs the developmental outcomes created for W1GS and the process through which
    those outcomes are achieved.


    Davis (2010) also indicates that “FGS are unfamiliar with the culture of college
    and, to one degree or another, unfamiliar with what it means to be a college student”
    (p. 29). To introduce them to college culture, FGS need a “guide,” not “an expert”
    (p. 32). W1GS advisors serve as guides to students in the student organization.


    # Imposter Syndrome


    Research demonstrates “many FGS suffer from imposter phenomenon” both inside and
    outside of the classroom (Davis, 2010, p. 48). They suffer “when things are going
    badly and when things are going well” (p. 48). FGS often talk themselves out of
    believing they deserve positive experiences, and negative experiences affirm their
    belief that they “are taking a place at the institution that should have gone
    to a more worthy individual” (p. 49). FGS feel more acute anxiety about not fitting
    in than their non-FGS counterparts (Davis, 2010).


    A lack of a college culture guide, coupled with imposter feelings, often results
    in FGS turning to their peers to determine what to do. “FGS are always watching
    their non-FGS counterparts; it is often necessary for'
