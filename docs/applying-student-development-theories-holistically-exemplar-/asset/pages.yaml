  md: '# Theory-in-Use Core Concepts:

    Perspectives From Scholarly Practitioners


    Katie Branch with Jeanne S. Hart-Steffes


    *The examples provided in the previous chapters of student development theories
    used in programs and practices that promote student success demonstrate an array
    of holistic synergies. This chapter summarizes data from the proposals submitted
    for this book, and draws out thematic perspectives from lessons learned and recommendations
    made by contributing authors. Core concepts about applying student development
    theories in contemporary higher education contexts are highlighted, with the importance
    of scholarly practitioner engagement noted. Cautions or reminders are given about
    transferring theory use to multiple contexts and diverse student populations.
    Finally, applying theory in higher education environments is not magic; rather,
    it relies upon the knowledge, skills, and intentionality of practitioners dedicated
    to the holistic well-being of students.*


    When analyzing information provided in the proposals received for this book as
    well as the contributing chapters selected ultimately for publication, there are
    patterns and themes that emerge. We received 26 complete proposals during the
    two-month period from when we issued a Call for Proposals and began final reviews
    for selection purposes. We sorted these proposals into the clusters of theories
    outlined: psychosocial and social identity development, cognitive development,
    and influences on development. Proposal authors identified four psychosocial and
    social identity theories that were used in contemporary practices, with the most
    commonly cited theory being Chickering and Reisser''s (1993) Theory of Identity
    Development (i.e., the Seven Vectors). Proposals also cited Cross'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'and Flagen-Smith’s (2001) Model of Black Identity Development, Phinney’s (1989)
    Model of Ethnic Identity Development, and Davis’s (2010) scholarship on first-generation
    student experiences. As anticipated in the cluster of theories identified primarily
    as psychosocial in nature, some proposals also incorporated ideas from frameworks
    that emphasize *influences* on development (versus theories that describe adult
    development sequences).


    From among cognitive development theories, nine frameworks were used in practice:
    Perry’s (1970) Scheme of Intellectual and Ethical Development; Belenky, Clinchy,
    Goldberger, and Tarule’s (1986) categories from *Women’s Ways of Knowing*; Kohlberg’s
    (1981) Theory of Moral Development; Gilligan’s (1982) Theory of Women’s Moral
    Development; Kitchener and King’s (1981) Reflective Judgment Model; Kegan’s (1994)
    Theory of Evolution of Consciousness; and Baxter Magolda’s (1992) Epistemological
    Reflection Model, Theory of Self-Authorship (2001), and Learning Partnerships
    Model (2004). The cognitive cluster of developmental theories was the one in which
    proposal authors brought in frameworks not listed on our Call for Proposals (i.e.,
    Kegan’s Theory of Evolution of Consciousness and Baxter Magolda’s Learning Partnerships
    Model), making it evident that scholarly practitioners understood the links among
    these theories’ authors as well as foundational cognitive constructs. Baxter Magolda’s
    scholarship was cited frequently; scholarly practitioners embraced the direct
    connections among research, theory, and a model for using the theory in practice
    (i.e., her Learning Partnerships Model).


    In the theory cluster labeled *Influences on Development*, proposals were received
    that made pragmatic links to all seven of the frameworks listed on our Call for
    Proposals, and Astin’s (1999) Theory of Student Involvement. These were as follows:
    Bronfenbrenner (developmental ecology), Schlossberg (transitions), Kolb (experiential
    learning), Jung or Myers and Briggs (personality type), Clifton and Anderson (personality
    strengths), Sedlacek (non-cognitive variables), and Strayhorn or others (sense
    of belonging). Because of the prevalence of Schlossberg’s Transition Theory (1981,
    1984) and Kolb’s Experiential Learning Theory (1984) across the proposals, we
    selected contemporary applications that emphasized applying those two theories
    holistically.


    In addition to attending carefully to theories utilized in proposals, we examined
    the “functional areas,” or communities of practice, in which higher education
    student affairs professionals carried out their'
