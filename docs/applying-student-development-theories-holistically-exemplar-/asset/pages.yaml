  md: 'but allowing them to provide occasional supports but only after the students
    experienced struggles or interpersonal negotiations.


    Physical and Manual Competence: While the mentoring group experience provided
    opportunities for participants to develop interpersonal competence, it was the
    *content* of the challenges that focused on students’ physical and manual competency.
    Mentoring group challenges included: an introductory bulletin board decorating
    contest that was judged based on creativity and success at introducing the group
    members (the bunk cabins had eight bulletin boards); daily adventure challenges,
    including high ropes, low ropes, zip-line, and lake trampoline; planning, shopping,
    and preparing two meals for the entire *Launch* group and cleaning up after two
    different meals; and a concluding skit competition that was judged on the group’s
    creativity. Each of these challenges offered opportunity for a variety of students’
    physical and manual strengths to emerge.


    Intellectual Competence: Understandably, many *Launch* participants wondered if
    they had the intellectual competence to succeed in their first year of college.
    Three strategies were embedded to address this concern. It was important to help
    students set realistic GPA expectations for the fall semester. During one of the
    morning meetings, each student was given a piece of college letterhead with an
    envelope. The staff members facilitated a discussion about the difference in academic
    life from high school to college, and the potential impact of that change on GPA.
    Next, the participants were instructed to address the envelope to their home address
    and write a letter with their GPA goal for fall term and two messages to themselves:
    *What do you want to tell yourself if you make your goal? What do you want to
    tell yourself if you do not meet your goal?* The letters were mailed in December
    after fall grades were submitted.


    Second, by utilizing student mentors and student tutors from the Academic Center
    as *Launch* mentors, *Launch* students were intentionally connected with students
    who were highly trained to assist with academic transitions. The intention was
    that *Launch* students would already be socially connected to the staff at the
    Academic Center, thus easing any anxiety they might have about reaching out to
    the Academic Center later in the year when they knew they needed help.


    Third, *Launch* students were taught the technique of free writing to encourage
    their writing fluency. Students at RMC receive a lot of feedback on their writing.
    Students write papers in nearly every type of class, including freshman-level
    history, political science, and even biology and calculus. With an average class
    size of 16, professors are'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'able to assign many papers. The writing center director indicated that entering
    students would benefit from an introductory effort to improve their fluency (Elbow,
    1973), or the practice of getting words on paper.


    At *Launch*, each student was given a journal and pen. On the first day, they
    were instructed on the technique of free writing (Elbow, 1973; Lamott, 1994) and
    were challenged to keep their pens moving at all times. Mandatory journaling took
    place every morning as a large group. Everyone, including *Launch* staff, was
    instructed to find a spot, sit in silence, and write for 20 minutes. Sample prompts
    were provided each day if needed, but they were not required to adhere to the
    prompts. Example prompts were: *List three adjectives that describe how you’re
    feeling now, identify someone you want to get to know better and explain, and
    name three things you want to make a point to do tomorrow.*


    With the attention to all three competency considerations described in Chickering
    and Reisser’s (1993) first vector of college students’ psychosocial development,
    the aim was to address new students’ most pressing developmental needs. Through
    these design elements, *Launch* participants were able to begin the fall term
    with several friendships already in place, opportunities to discover physical
    and manual strengths, and adjustments to their expectations for academic success.


    # Student Involvement Theory


    Though the retreat was hosted off campus, the staff wanted to ensure students
    were connected to campus and one another. Several guest speakers were invited
    to expose participants to various involvement opportunities at RMC so that students
    would feel comfortable seeking out opportunities and eventually get involved in
    activities that were of interest to them. Each morning meeting featured a guest
    speaker: Associate Dean of Students, Director of Disability Support Services,
    Director of the Career Center along with two young alumni, and the campus Chaplain.


    Early in the second semester of the participants’ first year, a special *Launch*
    reunion meeting was offered to review various student leadership positions to
    which participants might want to consider applying. At RMC, applications for resident
    assistants, orientation leaders, tutors and mentors, and tour guide positions
    are due by late February. At the meeting, position descriptions were reviewed
    and discussions held about what students could expect from the selection process,
    such as the competitiveness of the positions.'
