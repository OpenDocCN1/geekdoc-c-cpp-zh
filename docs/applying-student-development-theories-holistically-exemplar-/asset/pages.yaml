  md: '# A Pre-Orientation Retreat to Increase Retention and Develop Competence


    Kelly Carter Merrill


    Launch describes a pre-orientation retreat at Randolph-Macon College, a small
    private liberal arts institution in Virginia. Launch was designed with a psychosocial
    developmental focus and the intention of improving student retention at the college.
    This overarching goal was actualized by addressing four intended developmental
    goals: ease new students’ social transition, prepare them for academic challenges,
    encourage reflection on perseverance, and create a social community of peers who
    would value and protect their diversity. Four theoretical constructs guided the
    design and curriculum of Launch: developing competence (Chickering & Reisser,
    1993), student involvement theory (Astin, 1999), mindset and perseverance (Dweck,
    2012), and microaggressions and climates for diversity (Sue, 2010).


    Randolph-Macon College (RMC) is a small (1,400 students), private, selective,
    liberal arts college in central Virginia with a largely regional draw (73% in
    state). It is a residential college, with 92% of first-year students, and 80%
    of all students, living on campus. Originally, RMC was an all men’s institution
    founded in 1830 with a Methodist mission. Today, the institution boasts 53% enrolled
    women (having gone coeducational in 1971) and is the oldest Methodist-related
    college in continuous operation (Office of Institutional Research, 2017; SCHEV,
    2017). The college’s Carnegie classification is Baccalaureate College—Arts and
    Sciences, and the athletic conference is the Old Dominion Athletic Conference
    (ODAC) within the National Collegiate Athletic Association’s Division III.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'One third of Randolph-Macon students are athletes, and nearly a third (29%)
    are in Greek Letter organizations. Seventy-eight percent of the students identify
    as White, 8% as Black, 4% as Hispanic/Latino, 4% as multiracial, 2% as Asian American,
    and 4% as other or unknown. More than half of the students (55%) receive need-based
    financial aid. The six-year graduation rate is 58% (Office of Institutional Research,
    2017; SCHEV, 2017).


    In 2010, the RMC historical average freshman-to-sophomore retention rate was approximately
    75%, and the two years prior to the 2015 *Launch* retreat, it had risen to 77%
    (2013 cohort) and 78% (2014 cohort) (SCHEV, 2017). In 2015, RMC faculty, staff,
    and administrators turned their attention to addressing new students’ developmental
    considerations, and *Launch* was conceived as an effort to continue to improve
    retention.


    # ## DESCRIPTION OF LAUNCH


    During the summers of 2015 and 2016, incoming students were invited to attend
    a four-day, pre-move-in retreat called *Launch*. Sixty-eight students participated
    (28 in 2015, 6% of the incoming class; 42 in 2016, 10% of the class). The initial
    invitation targeted students of color, community college transfer students, and
    first-generation students—students who typically have lower retention rates in
    colleges and universities (National Student Clearinghouse Research, 2017; National
    Student Clearinghouse Research, 2012; Engle & Tinto, 2008).


    The Director of Student Transitions in the Higgins Academic Center administered
    *Launch*. The Academic Center assists students through their academic and social
    transition by offering free tutoring, mentoring, and disability support services.
    The Academic Center has a robust upper-level student staff with 37 tutors and
    36 mentors, several of whom hold both positions. Both the tutoring and mentoring
    programs are certified by the College Reading and Learning Association; the staff
    members meet rigorous national selection and training requirements. *Launch* student
    mentors were selected from the tutor and mentor staff, and received additional
    training specific to *Launch*’s developmental goals.


    # ### Guiding Theories


    Until the 1970s, low retention rates were attached to students (e.g., motivations,
    skills, and attributes) (Tinto, 2006). Students who did not'
