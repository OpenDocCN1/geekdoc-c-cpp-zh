    # COLLEGE OUTCOMES


    Many years ago my dear friend Alexander ''Sandy'' Astin addressed what he called
    "the black box" between student inputs (i.e., who they are and what they bring)
    and the college outcomes they achieve. Astin''s college impact model, known as
    inputs-environment-outputs, or I-E-O (1993; see Figure 0.2), addresses the impact
    of environmental experiences, including pedagogical practices that are intentionally
    designed to interact with salient dimensions of student inputs leading to desired
    college outcomes.


    ![](img/c03cf8065037f42512bddd1febea4918_8_1.png)


    Figure 0.2 Komives'' Boarding-Magic-Flying Link With Astin''s Inputs-Environment-Outcomes
    (I-E-O) Model'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'As presented in many chapters in this book, Astin (1993) made college educators
    aware that student involvement, that is, the amount of time and energy they spent
    in developmentally powerful experiences, was critical to achieving those desired
    outcomes. Refinements to the I-E-O model, of course, also illustrate the direct
    effect of inputs on outcomes, but the focus of this book (and the metaphor of
    how the plan flies) is best understood in a linear relationship.


    Readers of this book well know the emphasis universities have adopted for establishing
    and assessing learning and developmental outcomes in the past 30 years. College
    educators are held accountable by students, families, employers, and the public
    for delivering these outcomes. Over the past several decades in intentional student
    affairs practice, educators have successfully addressed numerous complex issues
    of student success such as persistence, achievement, and developing cognitive
    complexity. Compilations such as the third edition of *How College Affects Students*
    (Mayhew et al., 2016) synthesize the many interventions and engagements that matter
    in student learning and development and the impact of individual and group differences
    on that process.


    In this book, Katie Branch, Jeanne S. Hart-Steffes, and Christine M. Wilson and
    their talented contributors illustrate how educators can shape the college environment
    through intentional application of theory and research to the experiences the
    environment offers to diverse students. Grounded in knowledge of students and
    their personal development, educators in this book have used various theories
    of student success and development and vast research on environmental factors,
    including high-impact practices (Kuh, 2008), to address desired outcomes.


    # HIGH-IMPACT EDUCATIONAL PRACTICES


    George Kuh and his colleagues’ body of research through the National Survey of
    Student Engagement study identified 10 high-impact practices (HIPs) that contribute
    to student learning and development (Kuh, Kinzie, Schuh, Whitt, & Associates,
    2005). Advanced by the Association of American Colleges and Universities (see
    www.aacu.org/resources/high-impact-practices), these developmentally powerful
    experiences include:


    +   - First-year experiences

    +   - Common intellectual experiences

    +   - Learning communities'
  merge: -1
  img_proc: true
- pgno: 10
  md: '+   - Writing-intensive courses

    +   - Collaborative assignments and projects

    +   - Undergraduate research

    +   - Diversity/global learning

    +   - Service learning, community-based learning

    +   - Internships

    +   - Capstone courses and projects


    Of importance to this book are the six behavioral themes that Kuh (2008) extrapolated
    that were undergirding those HIPs that made the impact they evidenced. These themes
    are:


    +   - Investing time and effort

    +   - Interacting with faculty and peers about substantive matters

    +   - Experiencing diversity

    +   - Responding to more frequent feedback

    +   - Reflecting and integrating learning

    +   - Discovering relevance of learning through real-world applications


    One example of the progress educators have made is evident in our own work with
    student leadership development. Colleges have incorporated student leadership
    theory (e.g., the social change model of leadership development [SCM; Higher Education
    Research Institute, 1996]) along with related theoretical input frames (e.g.,
    racial identity, leadership self-efficacy) with their data from the Multi-institutional
    Study of Leadership (MSL; see www.leadershipstudy.net) that examines the SCM and
    numerous campus engagement experiences to identify experiences that promote growth
    in leadership capacity. Numerous college environment practices such as engaging
    students in discussions with others on sociopolitical issues, mentoring, holding
    positional leader roles, and community service are high-impact practices for developing
    leadership capacity (Dugan, Kodama, Correia, & Associates, 2013). Combined with
    understandings of leadership identity development (LID: see Komives, Owen, Longerbeam,
    Mainella, & Osteen, 2005), campuses are now scaffolding their leadership programs
    to build developmental complexity using leadership HIPs identified from studies
    such as the MSL research.'
  merge: -1
  img_proc: true
