  md: 'area. This activity centered on understanding social justice work, program
    concept and flow, and implementation skills.


    This goal was a stretch for many undergraduate paraprofessional staff members,
    especially envisioning themselves as the facilitator or leader for this type of
    program. Connecting passion topics to a social justice program was usually possible,
    but was made more difficult depending on how related the initial “Props for Passion”
    (i.e., personal sharing of an important topic) topic was to social justice concepts.
    For example, some undergraduate paraprofessional staff members presented generically
