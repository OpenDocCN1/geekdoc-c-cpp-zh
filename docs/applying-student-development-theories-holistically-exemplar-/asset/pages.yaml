  md: '# An Identity Development and Support Initiative for Black Men


    Jonathan A. McElderry, Jordan Williams, Marcus Mayes, Donald D. Gilliam, and Curtis
    Taylor, Jr.


    The Mizzou Black Men''s Initiative is a program for first-year, Black male-identified
    students at the University of Missouri. The student development theories that
    informed the creation of the program are Black Identity Development (Cross & Phagen-Smith,
    2001) and Sense of Belonging (Strayhorn, 2012). With theories as guides, the program
    aids in the successful transition of these individuals into the collegiate environment,
    with a focus on support, development, and involvement. This chapter provides a
    description of the program, guiding theories, and assessment and evaluation techniques.
    Additionally, discussion is included on lessons learned from applying theory as
    well as recommendations and resources necessary to impact the identity development
    and sense of belonging for Black males in the collegiate environment


    The University of Missouri ("Mizzou" or MU) located in Columbia, Missouri, was
    established in 1839. It is a land-grant research university and was the first
    public university west of the Mississippi River. Mizzou has 19 colleges and schools
    with more than 300 degree programs and is one of five universities in the United
    States that offers law, medicine, veterinary medicine, and a nuclear research
    reactor (University of Missouri, 2014). According to the Fall 2016 Student Body
    Profile (University of Missouri, 2016), the total enrollment was 33,266. Mizzou
    is a Predominantly White Institution (PWI). A total of 20,273 of the undergraduates
    identify as White, and 9,814 as White men. A total of 2,005 students identify
    as Black/African American; 796 identify as Black men (University of Missouri,
    2016). The Mizzou Black Men''s Initiative (MBMI),'
