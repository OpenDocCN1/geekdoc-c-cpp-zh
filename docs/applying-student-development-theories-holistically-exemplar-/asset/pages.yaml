- pgno: 7
  md: '# # Foreword: It Is Not Magic


    *Susan R. Komives*


    My son is a rocket scientist—really! He grew up loving airplanes, drawing airplanes,
    visiting the Smithsonian Air and Space Museum, doing his high school senior project
    in the wind tunnel at the University of Maryland, joining the U.S. Air Force Reserve
    Officers Training Corps, and most recently earning his doctorate in aeronautical
    engineering at the University of Minnesota. He is now Major Jeffrey R. Komives,
    USAF, PhD, researching and teaching hypersonics at the Air Force Institute of
    Technology at Wright-Patterson Air Force Base, Ohio. Meanwhile, I am his mother
    who sits in my window seat in a massive airplane loaded with hundreds of people
    as we are taking off thinking, “This is just magic.” Jeff has given me many lessons
    and I basically understand lift and thrust; yet, as illustrated in Figure 0.1
    (Boyd, 2010), I still secretly think, “It just has to be magic that this massive
    plane lifts off and stays up!”


    Between boarding the plane and landing, the process of how an airplane takes off
    and stays up is the mystery box for me (i.e., the box of unknowns; Figure 0.2).
    I do not fully understand what happens in that box but trust that it works. Fortunately
    for me and other passengers, there are experts like Jeff who know both how that
    works and how to make it happen! He chastises me, “Mom, it is not magic!”'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# how planes fly


