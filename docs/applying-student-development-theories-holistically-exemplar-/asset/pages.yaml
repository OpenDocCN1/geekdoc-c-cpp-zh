- pgno: 101
  md: 'Perry’s (1970) *Scheme of Intellectual and Ethical Development* provided a
    structure to understand what we should expect from students with varying intellectual
    abilities and how students might interpret and make meaning of different ethical
    challenges (in Evans, Forney, Guido, Patton, & Renn, 2010). Kohlberg’s (1981)
    *Stages of Moral Development* added to our understanding of how moral development
    occurs and what thoughts/actions/choices would be indicative of movement among
    developmental stages, especially when the reasoner sees through the eyes of justice
    and autonomy (in Evans et al., 2010; in Gilligan, 1982). Gilligan’s (1982) relationship-based
    “ethic of care” work expanded our vision to include the voices of care (empathy)
    and responsibilities when reasoning. Important to the premise of asking 8KQ when
    reasoning, Gilligan recognized that the one voice may be predominant in one’s
    thinking, “both ‘justice’ and ‘care’ voices are inherent in the life cycle, constituting
    alternative grounds on which to evaluate the moral” (Pascarella & Terenzini, 2005,
    p. 44).


    In Perry’s (1970) cognitive development framework, many incoming traditional-aged
    college students are *dualistic* thinkers conceiving of ethical and other decisions
    in simple right or wrong terms, or considering parents/authority figures as the
    individual with answers (Pascarella & Terenzini, 2005). As students learn new
    methods of inquiry in college, they move into the *multiplicity* stage, in which
    peers become valid sources of information, they see multiple ideas and opinions
    as right or correct, and do not distinguish between those to determine which is
    most true. With continued cognitive growth, students can evaluate information
    to distinguish who is a valid authority and use that to construct arguments, termed
    *relativism*. Ultimately, Perry (1970) proposed that students would move into
    *commitment in relativism*, making decisions in the context of the world around
    them.


    Like Perry (1970), Kohlberg (1981) and Gilligan’s (1982) developmental models
    informed Ethical Reasoning in Action. Both theorists outlined how students make
    ethical decisions at different stages. In the beginning stages of both models,
    *pre-conventional* (Kohlberg, 1981) and *orientation to individual survival* (Gilligan,
    1982) students make decisions that center the self: minimizing harm to themselves,
    avoiding punishment, and fulfilling personal desires or needs (Evans et al., 2010;
    Pascarella & Terenzini, 2005). As students begin to see the role others play in
    ethical situations and consider how decisions impact others, they move to the
    next stages of the respective models, *member of society* and *goodness as self-sacrifice*.
    Others become extremely important'
