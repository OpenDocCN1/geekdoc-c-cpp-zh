    by, RAs at Miami University.


    As demonstrated in Table 7.1, IAPs can take a wide variety of formats. One difficulty
    of utilizing IAPs in supervision is that staff members will likely have a different
    way of holding themselves accountable, creating some additional work on the part
    of the supervisor to keep up with what each staff member is doing. However, the
    ownership and responsibility each student takes for their learning, thereby yielding
    personal and professional development, offers long-ranging benefits of effectiveness
    in the role that make this effort worthwhile.


    # Assessment and Evaluation


    Self-authorship and meaning-making, as complex concepts, require complex approaches
    to assessment (Baxter Magolda & King, 2007). Three approaches to measure self-authorship
    include using existing measures for cognitive change, using a scoring method to
    measure student outcomes, or using semi-structured interviews and student narratives
    (Pizzolato, 2007). Thus, to assess IAPs, we have'
