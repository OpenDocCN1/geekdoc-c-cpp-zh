  md: 'They explored their identities, even throughout the process of determining
    which affinity groups they most identify. Students indicated that having a friend
    to turn to meant opportunities to reflect on the differences that made them unique
    and provided the support and encouragement necessary to see that these unique
    differences should be celebrated and embraced rather than ignored or viewed in
    a negative context.


    # *Moving Beyond Difference to Reflection on Ethnic Identity*


    While our survey data overall suggests students have meaningful exchanges with
    students from another culture, we have asked, “Does Tippie Buddies provide a platform
    for students to reflect on their own ethnic identities?” To answer our question,
    we sought open-ended feedback from participants with at least one semester completed
    in the program, and had at least one semester to reflect on their experiences.
    We found many students believed that participation in the program led to a greater
    understanding of their own ethnic identities:


    +   - “The program was helpful in giving me a better understanding of my own ethnic
    identity by my buddy pointing out the ‘different’ and ‘strange’ things we do here.
    Our dialogue usually consisted of discussing similarities and differences among
    our cultures. Having my buddy bring certain norms and beliefs that I hold up as
    being unique to our culture gave me a better understanding of the ethnic identity
    I hold.”

    +   - “It definitely made me aware of who I am and where I belong. It made me
    compare myself with other people around me and also made me realize that I’m somewhat
    different from other people in the way of my thinking and behavior. I got to talk
    to many people and sometimes I thought ‘no, that’s not a way of thinking or to
    behave I can identify myself with,’ which doesn’t mean there is right or wrong.
    It just made me realize how accustomed I am to my home country and the way things
    are regulated there.”

    +   - “Every time I experience the cultural differences, I realize a unique part
    in my own ethnic identity. The more cultural differences I come across, I know
    my own ethnic identity better.”'
