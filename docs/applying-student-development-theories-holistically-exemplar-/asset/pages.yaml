- pgno: 91
  md: 'to be aware of our biases about various identities, where those biases come
    from, and to work through them quickly and continuously. Working through personal
    biases involves a great deal of self-reflection and self-awareness, which is not
    easy work. However, it is work that is essential in allowing us to create a safe
    space for students and to connect with them in a meaningful way.


    As challenging as the process of self-reflection is for us as advisors, experience
    has taught us that it is a more difficult task for students because self-reflection
    could surface and affirm differences in their minds between themselves and their
    peers. However, Kolb’s (1984) theory of experiential learning tells us that reflection
    is an integral component of the learning process. The act of reflecting on an
    experience is as important as having the experience, because it is through reflection
    that meaning is made. We find it important to create intentional opportunities—such
    as check-ins—for students to reflect on their experiences.


    In our role, we emphasize the need to be prepared to push back against any messages
    of shame that might surface, which often accompanies discussions involving social
    class. Reframing discussions to be inclusive of each student’s reality, without
    judgment, is critical. This might mean, for example, responding with "it does
    stink to not have money, and does seem as if everything costs too much," versus
    engaging in the awkward silence that often accompanies conversations about money.
    This might also mean being sensitive to and discussing a current event, such as
    that of the Kalief Browder story. Browder was a Black male who was accused of
    and imprisoned for a crime, despite a lack of evidence; after he was released,
    he died by suicide; advocates for prison reform point to his story as evidence
    for needed change. After discussing this tragedy, we opened the conversation to
    discuss racial bias and mental health challenges of male students and students
    of color.


    The blend between the LPM and experiential learning cycle for an organization
    dedicated to first-generation students demands that advisors focus on helping
    to make the organization "real," rather than "good looking." At times, we may
    need to stop what we are doing to engage in a conversation about the importance
    of mindfulness activities to manage stress, or to arrange study sessions during
    midterm weeks. However, we must also balance the members’ present mindset simultaneously.
    It is challenging to continually remind them to focus on the future, while focusing
    on present tasks. One downside to this learning-centered approach is efficiency,
    as transformative learning experiences require'
