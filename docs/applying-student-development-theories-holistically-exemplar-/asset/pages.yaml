  md: 'As students grow in their intellectual and moral abilities, they may engage
    with the 8KQ more broadly, and would hypothetically move progressively from a
    self-centered worldview to a more inclusive worldview, reflecting the shift from
    SLO One and Two to SLO Three. For example, a shallow, self-focused application
    of the fairness question, “*How can I act equitably and balance all interests,*”
    may consider the equal distribution of a good, preferably in the decision-maker’s
    favor. Whereas, a goodness as self-sacrifice (Gilligan) or conventional (Kohlberg)
    application of the fairness question would bring about questions of the distribution
    of justice or fair practices for everyone involved. As indicated by Gilligan (1982),
    this stage may be represented by self-sacrifice, swinging to the other end of
    the self-focused pendulum, resulting in the temporary abandonment of caring for
    oneself.


    SLO Three most closely reflects advancement in the mid-development stages of multiplicity,
    member of society, and goodness as self-sacrifice/from goodness to truth. In these
    stages, thinkers are questioning legitimacy of authority and peers may become
    relevant in decision-making. With the ability to see themselves as decision-makers,
    students can deeply understand and apply the key questions to scenarios. They
    can challenge their own thinking when answers to those questions conflict, providing
    cognitive dissonance.


    Similarly, the transition to Kohlberg’s (1981) post-conventional stage should
    reflect a further nuanced understanding of fairness, for example, perhaps demonstrated
    by a realistic balancing of multiple inequities while maintaining an empathic
    approach or aiming to create justice among multiple groups of people that may
    or may not include the self. In advanced 8KQ ethical reasoning, the thinker (decision-maker)
    would raise additional questions of rights, outcomes, character, liberty, authority,
    and responsibilities applied to all parties involved in the situation. The Ethical
    Reasoning in Action program adds additional “voices” to the important moral conversations
    and decisions in a sea of ill-structured problems that require complex, nuanced,
    and informed decisions.


    Aligning with the highest levels of intellectual and moral development, proficiency
    at SLO Four. *For a specific ethical situation or dilemma,* students will evaluate
    courses of action by applying (*weighing and, if necessary, balancing*) the considerations
    raised by KQs, and SLO Five. Students will apply SLO Four to their own personal,
    professional, and civic ethical cases, would indicate students’ ability to think
    through multiple ethical considerations, balance competing considerations in the
    decision process, and'
