- pgno: 107
  md: 'in moral development. A long-term partnership with the Orientation office makes
    *It''s Complicated* logistically possible and a repeated success.


    # ***Student Employee Hiring and Training in University Program Board***


    The hiring and training processes of the campus University Program Board include
    a focus on ethical reasoning. During an executive council group interview process,
    students are asked to use the 8KQ in a circle process to decide what to do in
    a scenario based on an incident the board faced regarding selection of a controversial
    movie to show on campus. Interviewers (staff and students currently in the role)
    observe which of the 8KQ interviewees reference in their answers, how well they
    interrogate their instincts, and how they work together to make decisions.


    Once students are hired, they engage in longer training using the 8KQ to analyze
    and make decisions about other ethical scenarios they may face in their roles,
    including organization membership issues and inappropriate performers. Throughout
    the year, the students use the 8KQ to debate a course of action when actual ethical
    scenarios arise.


    # ***Student Conduct Educational Workshops***


    As part of educational programming for minor student conduct offenses, the Office
    of Student Accountability and Restorative Practices staff members utilize the
    8KQ to help students examine their values and behaviors. In the *Values in Action*
    program, they discuss scenarios where two or more values were in conflict and
    use the 8KQ to make sense of that situation. Students are also asked to reflect
    on a personal ethical decision and how it might be different had they used the
    8KQ. Both activities support the overarching goal of helping students consider
    their own values before acting. In the *Calling the Shots* program, after students
    participate in discussions to establish the benefits and drawbacks of alcohol
    use, they ask the 8KQ to help them identify and consider the broader complexities
    in the decision whether to drink alcohol.


    The office also conducts both small- and large-scale restorative circles surrounding
    various issues of harm to the community. In reflection papers and group circle
    processes, students are asked to use the questions to consider the harms inflicted
    on others and what ways those may be effectively repaired.'
