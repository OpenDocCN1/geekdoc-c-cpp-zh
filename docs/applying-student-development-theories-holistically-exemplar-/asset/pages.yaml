    He said that it was a completely different program from anything he had ever done,
    seen, or attended. He indicated that it felt like a bigger accomplishment because
    he got people to think more about themselves and their lives and put things into
    perspective.


    Over time, we observed this outcome was often achieved in their second year as
    undergraduate paraprofessional staff members engaged in subsequent cycles of *Passion
    to Action*. First, *Passion to Action* exposed the undergraduate paraprofessional
    staff members to new ideas, concepts, and topics around diversity, inclusion,
    and social justice. Second, consistently discussing the “Passion to Action Macro-Cycle”
    gave staff a roadmap to use outside of their roles. Eventually, returning undergraduate
    paraprofessional staff members were planning social justice programs concurrent
    with “Props for Passion” in the fall and completing their “Passion Projects” on
    new topics in the spring.


    # Implementation Specifics


    We had two programmatic goals for the full-year *Passion to Action* program: (a)
    undergraduate paraprofessional staff members would be able to connect to and share
    their own passion and (b) undergraduate paraprofessional staff members would be
    able to implement more emotionally, interpersonally, and intellectually challenging
    programming in the hall. Our design targeted the first programmatic goal in the
    fall semester and the second in the spring semester. This initiative'
