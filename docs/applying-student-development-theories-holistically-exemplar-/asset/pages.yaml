  md: 'in conversation with staff co-facilitators for lunch-and-learn discussions,
    and co-creating initiatives with students in the Office of Multicultural Affairs.


    The fourth outcome is for the staff to be equipped with transferable skills that
    will prepare them for their career beyond Lehigh University. One-on-one conversations
    with the Pride Center Associate Director and Graduate Assistant provide ample
    opportunities for reflection on how Pride Center work connects with students’
    career aspirations.


    The implementation of the model’s curriculum starts with a staff retreat at the
    beginning of the school year. At the retreat, the professional staff express the
    expectation that the community regards learning as non-hierarchical, and challenge
    staff members to explore their own social identities and corresponding positionality.
    Following the retreat, all staff begin their weekly shifts. Staff members work
    one, two-hour shift per week and are assigned specific tasks and collaborative
    projects. The student staff guide the center’s programmatic efforts, which are
    grounded in our core belief that we cannot work toward liberation for LGBTQIA+
    communities unless liberation for all marginalized communities is centered. In
    addition to weekly shifts, the staff meet together on a weekly basis for one hour.
    The staff meetings follow a model that rotates between the following four elements:
    a guest speaker, a student-led professional development conversation, a self-care
    highlight, and a combined staff meeting with the Office of Multicultural Affairs
    during which staff teams engage in dialogue around a topic of inclusion and equity.


    To further foster self-authored learners through reflection and self-examination,
    the Pride Center, along with the Office of Multicultural Affairs, developed the
    ETR, inspired by tools used by the University of North Carolina, Asheville (UNC
    Asheville Student Affairs, 2018) and Grand Valley State University (GVSU, 2018).
    The rubric outlines five specific employability traits that were selected based
    on the National Association of Colleges and Employers’ (2016) list of top attributes
    desired by employers to develop skills that our student staff could discuss during
    internship and job interviews: communication, teamwork, critical thinking skills,
    intercultural competency, and administrative/organizational management.


    The five traits are deeply connected. We define communication as one’s ability
    to demonstrate active listening, clearly present ideas through written and oral
    formats, and consider specific strategies for'
