- pgno: 45
  md: 'They attended a brief *Launch* orientation meeting, then boarded a bus to a
    nearby, adventure retreat facility. No phone or internet service was available
    at the facility. On the retreat grounds, students and college staff had access
    to two bunk cabins, a full-service kitchen, two common rooms, a pool, a lake,
    and retreat facility staff who could guide students through the adventure courses
    (i.e., high ropes, low ropes, zip-line, and water trampoline). The group returned
    to campus on the day the residence halls opened for the rest of the incoming class.


    Each day began with a student-prepared breakfast. The first activity of the day
    was a guided journaling activity. A two-hour morning session that included guest
    presentations, activities, or panels followed. After a student-prepared lunch,
    small groups engaged in different adventure activities (i.e., lake day, low-ropes
    challenges, or high ropes). The late afternoon was scheduled for free time, with
    options for a grocery shopping trip, hiking, pool time, or hanging out. After
    a student-prepared dinner, a volunteer *Launch* participant would build a bonfire.
    All of the staff, student mentors, and participants came together at the bonfire
    for reflection ring time. At the reflection ring, every attendee was invited to
    respond to a sharing prompt (e.g., “What are your hopes and fears for *Launch*?”).
    After the reflection ring, participants were dismissed for evening free time,
    while the *Launch* staff and student mentors held a nightly reflection and meeting
    to prepare for the next day.


    After *Launch*, several activities were held throughout the year. For each activity,
    participants were invited to bring friends. After one month, a reunion was held.
    After two months, the participants and their guests took a field trip to the Holocaust
    Museum in Washington, DC. After four months, the students took a field trip to
    an amusement park. And after six months, in February of their first year, another
