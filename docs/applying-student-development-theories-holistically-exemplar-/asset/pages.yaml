    into a newsletter that is shared with ITISA and IUPUI faculty and staff to maintain
    communication between institutions. Highlights of the newsletter include ITISA
    and IUPUI academic departmental updates and course transfer policies by major.


    Passport discovered off-site advising is essential in its pre-transfer advising
