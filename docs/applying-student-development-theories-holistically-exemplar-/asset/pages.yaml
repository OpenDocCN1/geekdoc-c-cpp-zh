- pgno: 117
  md: 'describe the complexity of the problems in the world through two types of challenges
    when faced with change: adaptive challenges and technical problems. Technical
    problems can be solved by expert knowledge, where adaptive challenges require
    new learning to solve. Kegan and Lahey (2009) suggest that approaching adaptive
    challenges with technical solutions often does not work to the benefit of those
    involved. These solutions are ultimately not optimized as more creative, learning-centered
    solutions. Also important to note is that adaptive solutions often lead to the
    growth of developmental capacity of the learner. Student staff roles manage a
    series of adaptive challenges, which includes the unpredictable element of working
    with other human beings. Student staff members who address adaptive challenges
    through their role often do much of their work without direct supervisory oversight
    at all times, and so these staff members need to be able to make complex and mature
    decisions on their own. A self-authored form of mind helps staff members make
    legitimately internalized decisions (Baxter Magolda, 2004).


    A framework that supervisors can use to grow developmental capacity toward self-authorship
    in student staff members is through the use of the Learning Partnerships Model
    (LPM; Baxter Magolda, 2004). Three key principles of the LPM are to validate students
    as knowers, to situate learning within the learner’s experience, and to mutually
    construct meaning (Baxter Magolda, 2004). LPM allows for an environment that fosters
    challenge and support, but always in concert with the involvement of others in
    the partnership.


    A specific strategy that both authors have used to engage in a learning partnership
    with student staff members is the development of Individualized Accountability
    Plans. IAPs provide an opportunity for student staff to take additional ownership
    and responsibility for their work. Details and recommendations on the implementation
    of IAPs with student staff members are the focus of the remainder of this chapter.


    # Implementation Specifics


    At the start of each academic year, student staff members are asked to think about
    their personal goals within the context of their student staff roles. Student
    staff members then are given parameters of their roles and ground rules for what
    is required in their IAPs. Anecdotally, there can be a perception during co-creation
    that RAs or SOULs drive the'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'process however they choose. However, supervisors set parameters and appropriate
    boundaries in which the student staff members can plan. Transparency is very important
    in this part of the process because developmental growth requires understanding
    of perspectives.


    Basic job functions needed to be included in the IAP (e.g., RAs complete residence
    hall rounds, write incident reports as needed, build community; SOULS recruit,
    select, and train an orientation team). Many of these job parameters may be set
    by departmental or divisional expectations through the forms of policy or professional
    standards. RAs at Miami University have specific programmatic requirements and
    parameters but the way in which each parameter is met is the decision of each
    RA. Resident Assistants select how they would be held accountable for the timeliness
    and completion of the IAP. It is completely acceptable for each RA to have a plan
    unique to them, as noted in the “individualized” label of the accountability plan.
    The goal of IAPs is to encourage and celebrate the ways in which student staff
    members already know themselves and their strengths, challenges, and areas for
    growth. Through this approach, student staff members are more heavily invested
    in their role because they help create and drive how they will do their work.
    This allows them to identify experiences that help them make decisions using the
    knowledge and expertise that they already have as students, leaders, and campus
    staff members.


    On a fundamental level, IAPs vary in structure and content based on the supervisor’s
    as well as the student supervisee’s needs and expectations. In the example provided
    in Table 7.1, one RA supervisee decided that they would like to make meaning of
    their experience, work role, and values by writing a blog. Another student made
    meaning of their role by tracking the progress toward their goals on a spreadsheet
    and then processing or celebrating their work verbally. Each of these evaluation
    tools was co-created by the supervisor and the supervisee to best meet the needs
    of the residential community, the staff team, and the RA themselves.


    Although IAPs are co-created, it is the work of supervisors to decide on and communicate
    the parameters within which student staffs are able to be creative. For example,
    a Resident Director may plan to include some specific expectations and initiatives
    in their planning. At Miami University, some of the parameters include:


