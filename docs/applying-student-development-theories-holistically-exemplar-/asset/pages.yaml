  md: '**Christine M. Wilson** serves as Assistant Vice President for Student Affairs
    and Director of Student Activities at the University of Connecticut. She earned
    her PhD in Education from the University of Rhode Island, where her research focused
    on preparing teachers for multicultural environments. Wilson earned a Master of
    Science degree and a Bachelor of Arts degree from Indiana State University. She
    recently co-authored the ethical practice chapter in the sixth edition of *Student
    Services: A Handbook for the Profession* with Sue Saunders (2017). She has 30
    years of experience in higher education in both student affairs and academic affairs
    at Pennsylvania State University; the State University of New York, New Paltz;
    the University of Baltimore; the University of Rhode Island; New England College;
    and the University of Connecticut.'
