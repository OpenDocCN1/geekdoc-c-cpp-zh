    Lastly, inviting outside speakers to the organization requires meaningful preparation
    with the speakers so that they can engage with students from a “knowledge” perspective,
    rather than a deficit (i.e., “no knowledge”) perspective. Advisors are often the
    first to ask questions of the speakers to demonstrate to students the types of
    questions that can be asked, as well as how to go about asking them.


    WIGS (and all that it entails) is moving the WIU campus toward a more positive
    climate for FGS status. Faculty and staff are now beginning to proudly identify
    themselves as FGS, and we are beginning to see a similar trend with students.
    This increased awareness served to benefit the sustainability and longevity of
    WIGS as a student organization.


    # RECOMMENDATIONS AND RESOURCES


    # Create Support Structures for FGS


    FGS report feeling less confident and more isolated, and are more likely to work
    and live off campus than their non-FGS peers (Davis, 2010). Support for FGS spaces
    on campus validates the FGS experience, reaffirms their innate capacity to learn,
    and helps them feel their life experiences are valuable. When creating these spaces,
    remember that the FGS label exists in conjunction with other identities: race,
    gender, sexual orientation, and dis/ability to name a few. If FGS hold other marginalized
    identities in addition to their FGS status, they might be susceptible to a compounded
    effect by systems of oppression and domination. As such, understanding how FGS’s
    multiple identities (Orbe, 2008) and identity salience (Orbe, 2004) impact the
    ability to successfully navigate college campuses may prove helpful when working
    with FGS.


    # Create an Environment Allowing FGS to Access Resources More Readily


    FGS often do not seek help, and are aware of the differences in their experiences
    compared with other students (Davis, 2010). Parker (2014) found that talking about
    these differences, socioeconomic differences'
