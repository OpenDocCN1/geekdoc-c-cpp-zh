    # DESCRIPTION OF THE MIZZOU BLACK MEN’S INITIATIVE


    The MBMI is a leadership development program implemented by the Gaines/Oldham
    Black Culture Center. The staff at the center understand that leaving home and
    coming to a PWI can be challenging for students of color. The purpose of the program
    is to effectively assist first-year Black males in their transition into the Mizzou
    collegiate environment. Three pillars guide the operation of the program: support,
    development, and involvement.


    Nationally, Black men have the lowest graduation rates of racial groups and genders
    (Harper, 2006). MBMI was created in 2009 in response to low retention and graduation
    rates of Black male students at Mizzou. The first iteration of the program was
    open to all Black undergraduate men. In 2013, the scope of the program was modified
    to focus solely on incoming Black first-year males. Over time, the program leaders
    added increased structure, incorporated academic credit, and added one more goal:
    to create the next generation of student leaders on Mizzou’s campus.


    The current iteration of the program includes a two-semester, credit-bearing course
    that entails: (a) presentations by and discussions with campus leaders and successful
    Black men, (b) leadership training and participation in service programs, and
    (c) membership in student organizations on campus. Class discussions, activities,
    and assignments are intended to promote reflection and meaning-making for participants.


    # Guiding Theories


    According to *The Climate for Underrepresented Groups and Diversity on Campus*
    (Hurtado & Ruiz, 2012), one in five Black students feel some sort of exclusion
    on their college campuses. Furthermore, Black students have directly or indirectly
    targeted racial dynamics as a factor that affects their psychological well-being
    while attending a PWI (Hurtado &'
