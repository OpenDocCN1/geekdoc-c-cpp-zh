  md: '**Gordon S. Louie** earned both a bachelor’s degree and a master’s degree in
    History and a Graduate Certificate in Higher Education from the University of
    Nevada, Las Vegas. While in graduate school, he began working in higher education
    through a grant for program development/assessment, and has since gained experience
    in academic support services, admissions/financial aid, academic advising, and
    international programs. Alongside his role as the Assistant Director, Global Community
    Engagement, in the Tippie College of Business at the University of Iowa, he is
    currently a PhD student in the Educational Policy and Leadership Studies program
    at Iowa. His current research interests and projects include ethnic identity exploration
    for international students, and the points of intersection/divergence in policies
    regarding campus diversity and internationalization.


    **Marcus Mayes** graduated from the University of Missouri with his BS in Business
    Administration and a master’s degree in Education Leadership and Policy Analysis.
    He co-founded the Mizzou Black Men’s Initiative in 2009 and served as the program
    coordinator until 2013, providing guidance, support, and mentorship to program
    participants as they transitioned from high school to college. In his current
    role as the Coordinator of Student Activities at the University of Texas, Austin,
    Marcus coordinates development and recognition programs for registered student
    organizations on the 40 Acres, and co-advises Student Government, Senate of College
    Councils, and the Graduate Student Assembly.


    **Jonathan A. McElderry** serves as the Assistant Dean of Students and Director
    of the Intercultural Center at Wake Forest University. His experience in higher
    education has focused on enhancing diversity, equity, and inclusion on college
    campuses. Additionally, his research has sought to raise awareness of the experiences
    of underrepresented students at Predominantly White Institutions and provide strategies
    to increase their academic and social success. He has presented both nationally
    and internationally, has held leadership positions within the American College
    Personnel Association, and has received several awards for his work in higher
    education. Jonathan earned a PhD in Educational Leadership and Policy Analysis
    with an emphasis in Higher Education from the University of Missouri and an MEd
    in College Student Personnel from Ohio University.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '**Sharee L. Myricks** is the Assistant Director of the Indiana University-Purdue
    University Indianapolis (IUPUI) and Ivy Tech Coordinated Programs (Passport) Office.
    She completed her MEd at Texas A&M University within the Student Affairs Administration
    in Higher Education program. Within higher education, Sharee utilizes her diverse
    experiences to successfully collaborate with students, faculty, staff, and community
    partners. Sharee has authored several publications and presents regularly at National
    Association of Student Personnel Administrators conferences on topics focused
    to enhance the career development and organizational leadership of new professionals
    within higher education. Additionally, her research focuses on resiliency of women
    within higher education.


    **Christine Nguyen** is originally from Iowa and earned her undergraduate degree
    in Psychology from Cornell College. She completed her master’s degree at Western
    Illinois University in College Student Personnel, where she gained paraprofessional
    experiences in career development, leadership development, and residence life.
    In her first professional position, she worked as Director of Health and Wellness
    Services at Trine University in Angola, Indiana. She currently works as an Academic
    Advisor for the College of Arts & Sciences Honors Program at The Ohio State University.


    **Vanessa Perez** has been a higher education professional since 2012. She earned
    a Master of Public Policy degree from Rutgers and has served in student affairs
    roles at New York University (NYU), Abu Dhabi, and NYU, New York. She currently
    focuses on international initiatives and continuing education with senior leadership
    at the NYU College of Dentistry. Vanessa’s diverse experiences have afforded her
    the opportunity to apply theories to practice in a variety of professional settings,
    thus inspiring reflection, assessment, and innovation in her work. Vanessa is
    a New Jersey native who is passionate about equity and inclusion and plans to
    pursue a doctorate in the future.


    **Lori K. Pyle** earned her PhD from James Madison University, where she is currently
    the Associate Chair of the Ethical Reasoning in Action program. She has been part
    of this curricular and co-curricular program to teach ethical reasoning skills
    and elevate the campus-wide understanding and discourse on ethical reasoning since
    its inception in 2013. Lori facilitates ethical reasoning workshops on campus
    and'
  merge: -1
