  md: 'students navigate adult nigrescence (Cross, 1971). Given the students are most
    likely to be in the Encounter and Immersion-Emersion stages, the out-of-class
    and in-class activities, such as reflection papers, provide experiences and opportunities
    for students to challenge their feelings about Black identity and immerse themselves
    in Black culture. Additionally, the MAB experience allows participants to engage
    in a variety of service opportunities, fosters individual growth, and strengthens
    the cohesiveness of the group. The combination of activities on the trip prompts
    discussion, reflection, and development as students challenge themselves collectively
    and individually as Black men. These challenges are often highlighted in the nightly
    reflections and discussions throughout the trip.


    The class reflection papers encourage participants to critically examine and reflect
    on several academic and social topics, while simultaneously addressing their Black
    identity development and sense of belonging. While the students are not prompted
    to specifically identify where they are (i.e., a stage) in the Black Identity
    Development model (Cross & Phagen-Smith, 2001), the reflections help shape discussion
    for one-on-one meetings, in-class discussions, and future reflection papers. For
    example, a student who has actively engaged in curricular and co-curricular activities
    may demonstrate a commitment to change (Immersion-Emersion stage). The leadership
    team can then encourage them in transitioning to a state of embracing what it
    means to be Black and exuding self-love (Internalization/Internalization-Commitment
    stage).


    Harper and Quaye (2007) suggested that higher levels of out-of-class engagement
    directly contribute to stronger racial identity attitudes for Black male students.
    Given the MBMI program is an initiative of the Gaines/Oldham Black Culture Center,
    the participants and their families are immediately connected to the staff and
    a robust programming agenda. The GOBCC is an immediate source of support to aid
    in the participants’ development. These connections and opportunities assist participants
    in advancing from the Encounter to the Immersion-Emersion stage.


    # Involvement


    To aid in their successful transition to the MU campus, MBMI participants are
    encouraged to get involved in campus activities. Involvement refers to the investment
    of physical and psychological energy in various activities (Astin, 1984), and
    positively impacts developing a sense of belonging and a healthy Black identity
    (Strayhorn, 2008). Highly involved students also tend to be at the Immersion-Emersion
    and Internalization/Internalization-Commitment stages of the Black Identity'
