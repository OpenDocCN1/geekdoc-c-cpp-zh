  md: '# Self-Authorship and Critical

    Praxis With Student Staff


    *Chelsea Fullerton and Scott Burden*


    This chapter describes a curricular framework that incorporates elements of self-authorship
    and critical praxis into a Learning Partnership Model (LPM; Baxter Magolda, 2004)
    used with undergraduate student staff members at a Lesbian, Gay, Bisexual, Transgender,
    Queer/Questioning, Intersex, and Asexual Plus (LGBTQIA+) center. The student development
    theory utilized is Baxter Magolda’s (1999) developmental process of self-authorship.
    Additionally, the framework utilizes Crenshaw (1989) and May (2015), who define
    and describe intersectionality to support the premise of moving beyond single-axis
    thinking to a more complex way of thinking. To supplement these theories, professional
    staff developed an Employability Traits Rubric that along with self-reflection,
    supervisor assessment, and a comprehensive review process, promotes self-authorship.


    Lehigh University is a medium-sized, private, not-for-profit research institution
    in Bethlehem, Pennsylvania, with approximately 5,000 undergraduates and 2,000
    graduate students pursuing bachelor’s, master’s, and doctoral degrees. Lehigh
    is a Predominantly White Institution (PWI) with 26% domestic students of color
    and 9% international students. Students are primarily from the tristate area (i.e.,
    New Jersey, New York, and Pennsylvania); 26% hail from other areas of the United
    States (Office of Institutional Research and Strategic Analytics, 2018). The student
    culture is heavily influenced by fraternity and sorority affiliation as Greek-affiliated
    students make up 40% of the undergraduate student body (Office of Fraternity and
    Sorority Affairs, 2017). Approximately 10% to 12% of Lehigh students identify
    as LGBTQIA+ (Office of Institutional Research and Strategic Analytics, 2017).
    Lehigh students'
