  md: 'the building through the “Passion Projects.” Finally, they solidified their
    programs and implementation teams and submitted their proposals to their supervisors
    for approval.


    The activities in this stage required critical thinking, conceptualization, and
    implementation, and were informed with higher-order outcomes on Bloom’s revised
    cognitive and knowledge dimensions, including *carry out, use, integrate, design,*
    and *create* (Anderson & Krathwohl, 2001). For many undergraduate paraprofessional
    staff members, the higher-order activity of “integration” was challenging, especially
    with the two seemingly disparate concepts of “my passion” and “what I do with
    my residents.” For some, this stage required more vulnerability than presenting
    in front of the team because it required sharing with the wider audience of residents
    within the building. CK reflected, “Connecting my passion to my work with residents
    wasn’t something I expected to do before becoming an RA, but something I think
    many residence halls could benefit from.”


    Full staff (i.e., professional staff, graduate students, faculty fellows) involvement
    was key for providing support to the undergraduate paraprofessional staff members.
    A faculty fellow shared, “It was also very helpful to discover commonalities with
    other members of the staff, including undergraduate paraprofessional staff members,
    through their own passions, and it actually led me to approach some of them with
    ideas to program together.” Some undergraduate paraprofessional staff members
    quickly connected their passion to programming ideas, like Riya who reflected
    that she knew she wanted the program to “serve as a vehicle for educating others
    on the critical gaps present in the healthcare system.” For others it involved
    working through the intimacy of sharing their passion, issues conceptualizing
    the passion into a structured activity with residents, or gaining skills in program
    preparation.


    # *Stage 4: Active Experimentation*


    The final goal was for undergraduate paraprofessional staff members to design
    programs for building residents that engaged them in social justice. We asked
    each undergraduate paraprofessional staff member to engage in an active experimentation
    activity and consider the details required to engage the residents who attend
    their program event in social justice work. For this activity, we utilized outcome
    language informed by Bloom’s revised taxonomy (Anderson & Krathwohl, 2001), such
    as *generate, assemble, design,* and *create,* to structure learning in this'
