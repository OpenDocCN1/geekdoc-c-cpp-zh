- pgno: 86
  md: '# Implementation Specifics


    Initially, the advising team developed ideas for recruitment and promotion, and
    identified the organization’s values. WIGS would be open to all self-identified
    FGS. We agreed that, if the organization attracted no students, it would not be
    pursued further; we wanted WIGS to be an organization created by the students,
    for the students. Advertising involved a table display in the middle of campus,
    where we recruited the initial group of student members. On the first day, more
    than 60 students signed up to join the organization.


    Throughout the initial semester, we worked with student members to create a name,
    logo, and motto. "Western 1st Generation Society" became our name and "First in
    Line" became the motto. We also considered what the core values (i.e., dedication,
    grit, curiosity, community, and integrity) meant for the organization as a whole.
    During this process, members were able to build a general sense of community that
    was further enhanced by having different group members and advisors share personal
    FGS stories at each meeting. Our approach to creating this organization served
    as a way for everyone to connect through common experiences, which is why we decided
    to use this process each semester.


    The second semester, W1GS members and advisors worked to create governing documents
    for the organization. The students held elections for President and Treasurer
    and registered WIGS as an official student organization. One major task in this
    process was drafting a constitution, which includes the developmental outcomes.
    The constitution also defines a nontraditional meeting structure; weekly meetings
    are run as a collaborative effort among the members, rather than a positional
    effort. W1GS alternates weekly between business meetings and social meetings.
    Social meetings allow members to continue building connections with one another,
    their campus, and their community. Business meetings provide members time to discuss
    ideas and make organizational and logistical decisions.


    Today, W1GS claims more than 165 members. Approximately 10 to 15 G S consistently
    attend weekly meetings. All members of the organization receive weekly emails
    containing resources for FGS and the upcoming WIGS meeting agenda. Members are
    also invited to join the WIGS Facebook group and to communicate via the GroupMe®
    texting application. This membership structure is intentional; we know from research
    that FGS are less likely than their non-FGS peers to be involved'
