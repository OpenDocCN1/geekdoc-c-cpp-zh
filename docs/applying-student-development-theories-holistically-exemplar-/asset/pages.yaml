- pgno: 93
  md: 'in particular, helped increase GPA and use of college resources. Talking about
    the FGS experience empowers FGS to take an active role in their college education.
    While there are obstacles unique to the FGS experience, FGS possess a plethora
    of strengths. As demonstrated earlier, students became sounding boards for their
    peers with regard to problem-solving, critical thinking, and personal support.


    # Shape the Environment to Specifically Meet the Needs of FGS at Your Institution


    Feedback and involvement from FGS are essential to shaping the organizational,
    and hopefully, institutional, environments to meet their needs. It is difficult
    to predict the needs and demographics of FGS at any particular institution. The
    WIGS student organization exists at a midsize, four-year, regional state institution—thus,
    more research regarding the experience of FGS at other institutions is needed.
    Creating FGS student support systems at various institutions can help develop
    more well-rounded research about the FGS student experience and, subsequently,
    how to better support FGS.


    # Consider How Best to Support FGS at Your Institution


    Practitioners seeking to create student organizations similar to WIGS may want
    to consult with the office of student involvement about how to start a student
    organization and to learn the requirements for getting an organization recognized.


    There are many ways to support FGS in addition to creating student organizations.
    Initiatives such as *I’m First* (Center for Student Opportunity, 2017), created
    by and for FGS, provides on-line multimedia resources for institutions and FGS.
    This resource allows others to listen to student stories and learn about initiatives
    throughout the country to assist in creating FGS spaces.


