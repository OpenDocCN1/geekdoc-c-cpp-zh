    Finally, Brené Brown’s (2010) *The Gifts of Imperfection* has been an inspirational
    framework for us to develop ourselves as authentic practitioners in all interactions
    with the students.


    Though we still have much to learn, we are confident in the possibilities of the
    applicability of this model to other cross-cultural center contexts and beyond,
    and hope to continue to hone our practice to better meet the developmental needs
    of our students. Ultimately, we look forward to continuing to learn in partnership
