    # Outcome Five: Creating and Serving as a Community of Resources for WIGS Members


    Members have a community of support and resources beyond the WIGS meetings themselves.
    For example, around midterms and finals, members reach out to request support
    for upcoming exams or assignments through the GroupMe® texting application. Advisors
    participate in the texting application so they are aware of what support has been
    requested. When students note that they need assistance in specific areas, members
    work together to identify and compile available resources, which are then shared
    through the application. Similarly, when issues occur in the world (e.g., hurricanes),
    or in one’s personal life (e.g., family member passing), the texting application
    is used to help one another find personal support.


