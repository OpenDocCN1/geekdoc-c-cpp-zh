- pgno: 177
  md: 'In regard to institutional characteristics, all proposals involved four-year
    institutions of higher education—although one also linked directly to a two-year
    community college located in the Midwest region of the United States. All geographic
    regions of the contiguous United States were represented by the institutions of
    higher education identified in proposals. Institutional control included U.S.
    state-chartered (i.e., public) institutions as well as those considered private;
    no proposals were received from for-profit institutions. Among private institutions,
    most were independent—although religiously affiliated colleges also were represented.
    Institutions considered small, medium, and large—based on student enrollment figures—were
    represented. All small-size institutions were private and nearly all of the large-size
    institutions were public universities.


    When looking across all of the complete proposals received, it was evident that
    the contemporary theory-in-practice applications focused on students as staff
    members as well as other student leaders. The emphasis by higher education and
    student affairs practitioners on the academic missions of their institutions (i.e.,
    student learning support and retention) was clear. Assisting with transitions
    in, during, and out of institutions; building interpersonal relationships and
    attending to community dynamics; and making meaning of knowledge and experiences
    were hallmarks of the examples of student development theories applied holistically.


    # THEMES ACROSS CHAPTERS


    Following a thorough review of all proposals received, nine were selected for
    inclusion in this book. The selection process incorporated feedback and suggestions
    from current Master of Science degree students in the College Student Personnel
    graduate program at the University of Rhode Island; the perspectives of these
    emerging student affairs professionals helped to ensure both applicability and
    understandability of theory-in-practice examples. The exemplars of theory-in-practice
    in the preceding chapters demonstrated multiple approaches using relevant theories,
    covered a range of functional areas, and examined environments at a variety of
    institutional types. When looking across the *Lessons Learned and Recommendations*
    and *Resources* sections of chapters for patterns as well as unique perspectives,
    the following themes emerged.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Intentionality


    The deliberate and purposeful attention to using student development theories
    and models was evident, especially in design of outcomes. While not necessarily
    stated directly as programmatic goals, influencing student development and learning
    was reinforced continuously. Practitioners also demonstrated intentionality and
    discernment in monitoring for—and countering—deficit approaches grounded in negative
    stereotypes.


    # Structure


    Organization and clarity about intended outcomes as well as the components of
    programs provided structured guidance with practical significance. Informing and
    reminding those participating in (i.e., students) or linked to (e.g., staff, faculty,
    alumni, civic leaders) initiatives about intended outcomes often was a pattern.
    These outcomes, while inclusive of human development aims, were not solely developmental.


    # Reflection


    Reflection was a core component, both for students and those involved with implementation
    specifics. The powerful combination of experience and reflection influences growth,
    as noted by educational philosopher and reformist John Dewey (1933). The deep
    reflection demonstrated by those implementing programs aligned closely with intentionality
    and structure.


    # Implementation Inconsistencies


    Some practitioners noted that implementation specifics within programs or initiatives
    were not carried out consistently. This was both acceptable and, at times, helped
    to advance student learning and development. Sometimes various staff used differing
    techniques, which could be used as teachable moments for students. On other occasions,
    inconsistencies demonstrated adaptations to the uniqueness of students.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Adapting for varying developmental levels of students led to changes in how
    programs were carried out. Practitioners were mindful about human agency (i.e.,
    respecting individual decisions) and noted the lack of direct linearity in student
    development. Thus, having programs be voluntary or having flexible elements within
    programs were important


    # Challenges of Assessment and Resource Sustainability


    Because potential developmental outcomes are not only cumulative but also noticeable
    only after time has elapsed, assessment of specific developmental outcomes was
    challenging. Thus, most assessment and corresponding evaluative decisions were
    most relevant for improving implementation aspects—especially processes. In addition,
    fruitful assessment came from products or processes incorporated naturally as
    part of a program or initiative.


    Resource allocation was an ongoing challenge. Struggles to find money to support
    the personnel needed for implementation of initiatives as well as potential financial
    opportunity costs to students who participated in certain programs were noted
    (e.g., a pre-orientation program, which could result in matriculating students
    ending summer employment earlier than peers do). For the sustainability of programs,
    institutional buy-in is key; thus, practitioners commented on clear links to the
    mission (or vision) of their functional area, division, college, or institution.
    To help with financial support, practitioners suggested working with institutional
    advancement officers; for assistance with personnel needs, seeking out local community
    members was an option. Connecting with intra-institutional resources was important
    to informing invested constituencies, gaining buy in, and enhancing achievement
    of intended outcomes.


    # Holistic Elements


    The holistic elements of theory-in-practice applications were complex and required
    scholarly perspectives. Knowing and using student developments theories, while
    meaningful, often was combined with other relevant scholarship (e.g., content-related
    theories, research findings, publications from professional associations). Scanning
    for, making, and explaining connections among various ideas and components'
