  md: 'University, these resources help staff who serve international students understand
    what they expect from higher education, and how they describe their experiences,
    which can inform the design and components of mentoring programs.


    There are other institutions that have programs similar to Tippie Buddies, many
    designed to help ease the transition of new international students. Higher education
    and student affairs professionals who are considering domestic-international student
    buddy programs should consider examining Georgia State University’s International
    Exchange Student Buddy Program (https://cas.gsu.edu/international-exchange-student-buddy/)
    and the International Student Buddy Program at Columbia College Chicago (https://students.colum.edu/student-diversity-and-inclusion/international-student-scholar-services/buddy-program.php).


    In this chapter, we proposed just one of many possible methods to create environments
    and opportunities for undergraduate students to explore their ethnic identities.
    We posit that our own success with the program is contextually (and potentially
    even institutionally) bound, but the relative ease with which a buddy program
    can be created makes it a feasible option across institutional settings.


    Research suggests it is important to understand the multiple identities individuals
    hold and the holistic impact of different components of identity (e.g., Iwamoto
    & Liu, 2010). Ethnic identity exploration and development as a process may occur
    regardless of intentional programming, but our hope is that by offering the opportunity
    and structured, supportive environment which encourages students to interact and
    engage in dialogue, it allows the process to be both positive and meaningful.


