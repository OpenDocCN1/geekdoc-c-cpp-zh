  img_proc: true
- pgno: 130
  md: 'framework that brings to light the material realities of lived identities as
    they interact with systems of oppression, inequality, and subordination (Crenshaw,
    1989; May, 2015). Intersectionality is rooted in the unique subordination of Black
    women and “any analysis that does not take intersectionality into account sufficiently
    address the particular manner in which Black women are subordinated” (Crenshaw,
    1989, p. 140). As a concept, intersectionality finds its roots in critical race
    theory and black feminist thought, which predates the coining of the term. In
    *Pursuing Intersectionality, Unsettling Dominant Imaginaries*, May (2015) describes
    intersectionality as a both-and way of thinking that moves beyond single-axis
    thinking to more complex, matrix ways of thinking. We utilize intersectionality
    as a guiding framework to consider the implications of power, privilege, and oppression
    on the lived realities of our students who are pushed to the margins because of
    their various social identities. When discussing issues of privilege, social justice,
    and equity with students, it is imperative to use a critical lens; thus, our curriculum
    incorporates readings and activities that cultivate this nuanced approach.


    We see an intersectionality framework as deeply connected to the concept of self-authorship,
    another foundational theoretical concept in the work with our student staff. Self-authorship
    is an example of constructive-developmental pedagogy that, according to Baxter
    Magolda (1999), “is more than letting students talk and generate their own ideas.
    It is a matter of creating the developmental conditions that allow them to generate
    their own ideas effectively, in essence to develop their minds, their voices,
    themselves” (pp. 7–8). The matrix way of thinking emphasized in May’s (2015) description
    of intersectionality closely aligns with Baxter Magolda’s (2008) process of self-authorship,
    particularly with student reflection and examination of their closely held values
    and beliefs. Deconstructing oppressive messages is also a key part of self-authorship
    (Baxter Magolda, 2008); when working with student staff members through one-on-one
    conversations, we actively challenge students to examine ways in which internalized
    oppression has impacted their paradigms and beliefs.


    Finally, this practice is grounded in the LPM as outlined by Baxter Magolda (2004).
    The LPM asserts that programs must validate learners’ capacity to know and construct
    knowledge. Learning must also be situated in learners’ experiences, with a desire
    to mutually construct knowledge together. In an effort to create an optimal student'
