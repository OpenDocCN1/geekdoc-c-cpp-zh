  img_proc: true
- pgno: 135
  md: 'student staff members, many of whom stay in their positions for their entire
    undergraduate careers.


    # LESSONS FROM APPLYING THEORY ARTFULLY


    The incorporations of the LPM and the concept of intersectionality have truly
    transformed the work we do in the Pride Center. Since implementation in 2015,
    the Pride Center has seen markedly increased engagement in programming. This increased
    engagement can be attributed in large part to the deep learning and community
    building (and, therefore, increased investment and productivity) that has occurred
    within the student staff team. Admittedly, the development and implementation
    of this model have not been easy. Often at our institution, student staff members
    are given task-oriented roles to fill a need within a department; work-study or
    wage positions are rarely seen as developmental opportunities. Because of this,
    the office has faced the challenge of creating a unique, impactful experience
    in an institutional context where little precedent exists.


    Though our model intentionally creates and advances developmental outcomes, we
    also aspire to maintain a balance between these outcomes and the core functions
    of our space. This balance includes planning large- and small-scale programming
    for our campus community. As a result, we have been challenged to be intentional
    in the ways in which we structure our limited time with student staff members.
    For example, during the weeks leading up to the larger-scale, signature events,
    many perfunctory tasks need to be discussed and executed during the student staff
    meetings. However, we ensure time and space for self-exploration and self-care.
    During periods of the semester where programming is less demanding, we dedicate
    extended time to professional development, discussions about personal identities,
    and community building. This investment throughout the student staff experience
    ultimately makes the implementation of programming more impactful, as the ideas
    that are generated by the student staff are grounded in intersectional thinking,
    and the execution of their ideas is made more meaningful by the synergistic community
    of our team. Most important, the environment we have created allows for intentional
    reflection after implementation of each program, both individually as well as
    collectively. Depth of learning occurs as students take a critical perspective
    on their own work and the work of their peers, making meaning of what'
  merge: -1
  img_proc: true
- pgno: 136
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 137
  md: 'a broad spectrum of identities and experiences sets the stage for an environment
    where challenge and support can occur. Simply creating a diverse team, however,
    is not sufficient; it is critical to also build an environment where all students
    know that they are supported and where exclusive behaviors, whether intentional
    or unintentional, are confronted and addressed. To do this, we actively recruit
    the most marginalized populations while being mindful of how our own identities
    impact our work.


    # Clearly State the Learning Outcomes of the Model to the Students


    At the Pride Center, treating students as collaborative partners means modeling
    transparency whenever possible, and this includes with the goals. This has also
    been incredibly important given the institutional context where student staff
    positions rarely incorporate intentional learning; clearly communicating intentions
    to the staff has shown them the investment that the professional staff have in
    them as individuals and as a collective beyond their role of developing and implementing
    programming. Of course, in order to state the learning outcomes, we had to spend
    time crafting them and building them into the larger curricular plan.


    # Establish Norms of Collaborative Learning


    Collaborative, multi-directional learning is a core tenet of the LPM (Baxter Magolda,
    2004). To position ourselves as both teachers and learners within the student
    staff team, we regularly challenged student staff members to seek answers to their
    questions and to creatively problem solve rather than rely on hierarchical notions
    of an all-knowing supervisor.


    # Craft Time for Developmental Experiences, Reflective Conversations, and Self-care


    A critical lesson learned early on in developing the student staff model was that
    focusing on tasks alone is detrimental to building a developmental experience.
    Through time and intentionality, we have found creative ways to maximize our student
    staff’s time so that the team could'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'focus on reflection, education, and self-care while still ensuring that tasks
    were accomplished. Whether opening each staff meeting with a self-care activity,
    reflecting on the learning moments from implementing a signature event, or taking
    a staff meeting to delve into a racial justice topic, the prioritizing of developmental
    experiences is interwoven throughout the model.


    # Be Open to Feedback and Critique


    The Pride Center student staff model is a work in progress, and we have found
    it essential to be open to input from our student staff members to maximize the
    effectiveness of their experience. Through the comprehensive review process, one-on-one
    conversations, and periodic evaluations, we have gained valuable information that
    has allowed us to tweak and adjust the model in a way that better meets our students’
    needs; additionally, including student input ensures that they feel that they
    are co-creators of their experience.


    # Explore Resources Related to Critical Praxis and the Learning Partnership Model


    We were inspired by ETR tools used by the University of North Carolina, Asheville
    (UNC Asheville Student Affairs, 2018) and Grand Valley State University (GVSU,
    2018), as well as the top five employability traits (i.e., communication, teamwork,
    critical thinking skills, intercultural competency, and administrative/organizational
    management) as researched by the National Association of Colleges and Employers
    (2016).


    To state the learning outcomes, we had to spend time crafting them and building
    them into the larger curricular plan; the American College Personnel Association’s
    Residential Curriculum Institute was an instrumental resource for this work.


    The approach to the management of the team was inspired by the tenets of intersectional
    feminist praxis in supervision, as described by Fullerton (2017) in this NASPA
    video: www.youtube.com/watch?reload=9&v=sMB3To1LJZY. Additionally, bell hooks’
    (1994) *Teaching to Transgress* and Paolo Freire’s (1970/1996) *Pedagogy of the
    Oppressed* (1970/1996) have both been key influences on the ways we'
