    # Implementation Specifics


    # *Leadership Team*


    The MBMI program is led by a team comprised of a professional staff member, two
    teaching assistants, and six peer mentors. The staff member works in the Gaines/Oldham
    Black Culture Center (GOBCC) under the Division of Inclusion, Diversity, and Equity.
    The teaching assistants are typically undergraduate seniors who have served in
    the peer mentor role and are selected by professional staff at the GOBCC. The
    six peer mentors are chosen from previous years’ MBMI programs; they are selected
    and trained in the spring semester in preparation for the program in the fall.
    Peer mentors are to serve as role models, meet with their assigned mentees biweekly,
    and plan and implement community service events, study halls, and social activities.


    # *Recruitment and Selection*


    MBMI participants are recruited both informally (e.g., word of mouth, social media,
    emails, etc.), and formally, (e.g., summer orientation and letters to all incoming
    Black first-year males). Prospective MBMI participants are required to complete
    an application that gauges their interest in the program; strengths and weaknesses;
    how they define leadership, service, and mentorship; what they believe they can
    contribute to the program; and what their individual goals are and anticipated
    challenges they may face during their collegiate experience. After reviewing applications,
    the leadership team creates cohorts of students from various backgrounds, intended
    majors, and geographic locations. The program accepts 25 to 30 students for each
    cohort each year, which translates to approximately 10% of the incoming class
    of Black first-year males. Cohort size is constrained by staffing and funding
    resources.


    # *Structure*


    MBMI consists of a two-semester course titled, *SSC 1150: Student Success Center*.
    The course objectives are to foster a sense of belonging, promote engagement in
    the curricular and co-curricular life of the university, encourage self-responsibility,
    and facilitate understanding by the'
