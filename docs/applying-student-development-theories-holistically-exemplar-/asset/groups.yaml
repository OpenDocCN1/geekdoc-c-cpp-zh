    well as individuals attending professional development events, often ask for examples
    of current uses of theory in actual practice settings. Students want to be inspired
    by higher education professionals who are using the knowledge that they are learning;
    this book meets that need. Furthermore, professional staff development initiatives
    designed to encourage the intentional, holistic use of theoretical knowledge can
