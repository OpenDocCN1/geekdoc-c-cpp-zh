    ## 使用个性化问责计划促进自我主导


    Erik Sorensen 和 Elizabeth K. Walsh


    学生工作人员对于高等教育中大学生活部门的成功至关重要。宿管助理、迎新负责人和其他学生领袖处于与其他学生开展工作的最前沿。因此，他们在岗位上的发展和有效性至关重要。一种促进发展的具体工具和技术是使用个性化问责计划（IAPs），该计划基于Kegan（1994）的意识秩序和Baxter
    Magolda（2004）的自我主导理论视角。IAPs帮助学生工作人员及其主管共同制定行动计划，以指导他们的工作，并决定每位成员如何被问责。共同制定此类计划本身就是一种发展实践——类似于Baxter
    Magolda（2004）的学习伙伴模型。本章阐述IAPs的哲学和理论背景、实施IAPs的过程、评估IAPs有效性的可能方法，以及进一步完善IAP流程的建议。


    个性化问责计划（IAPs）是由主管和被督导者共同制定的行动计划，帮助工作人员对自己的职位负责，包括他们如何对待工作以及如何被问责。本章描述了作者如何在俄亥俄州迈阿密大学与学生工作人员实施IAPs。Erik担任迈阿密大学住宿生活助理主任；他与宿管助理（RAs）密切合作，并督导全职及研究生宿舍工作人员。Elizabeth，人称“Liz”，担任迎新与过渡项目助理主任，与学生迎新本科生领袖（SOULs）合作；Liz曾在迈阿密大学担任住宿生活部门工作，与RAs在一起。Erik和Liz都在迈阿密大学学习学生事务与高等教育项目：Liz是硕士生，Erik是博士生。两位作者都在课程学习和专业经验的指导下，与学生工作人员实施了IAPs。


    迈阿密大学主要位于俄亥俄州牛津市这个中西部小镇。该大学成立于1809年，其章程早于牛津市的建立。因此，迈阿密大学的牛津校区高度住宿化。这是一所四年制公立大学，拥有约17,000名本科生。大约40%的迈阿密学生是州内学生。从人口统计看，51.5%的学生为女性，48.5%为男性。国内学生占人口的87%，而国际学生占学生总数的13%。国内有色人种学生占学生总数的14.3%。由于迈阿密大学深厚的传统，传承学生（例如校友的子女、兄弟姐妹）占学生的11.7%（迈阿密大学招生办公室，2017年）。


    Moll（1985）将迈阿密大学称为“公立常春藤”，指出该类别中的学校以公立学校的经济成本提供常春藤联盟式教育。其卡内基基本分类为具有较高研究活动的博士大学。迈阿密大学在学术和课外生活方面拥有深厚的传统和价值观，使其成为挑战学生找到自己的声音、价值观和热情的好地方。这可以包括与学生合作，在课堂内外共同创造体验。


    ### 个性化问责计划描述


    IAPs起源于住宿生活办公室，是宿管主任在宿管助理（RA）岗位上积极参与学生学习和个人成长的工具。此后，IAPs被应用于不同学生工作人员职位的多种情境中，以使人类发展与学生事务实践紧密结合。使用IAPs的目标是帮助学生工作人员在个性化层面上理解其工作和领导角色的意义，从而推动他们走向自我主导的建构。IAPs作为一种策略，赋予学生工作人员更大的自主权，并鼓励他们在面临变化时通过两类挑战来描述世界问题的复杂性：适应性挑战和技术性问题。技术性问题可以通过专业知识解决，而适应性挑战则需要新的学习来解决。Kegan和Lahey（2009）提出，用技术解决方案应对适应性挑战往往对相关人员不利。这些解决方案最终无法像更具创造性、以学习为中心的解决方案那样得到优化。同样重要的是，适应性解决方案往往会导致学习者发展能力的成长。学生工作人员的角色需要应对一系列适应性挑战，其中包括与人共事这一不可预测的因素。通过其角色应对适应性挑战的学生工作人员，往往在没有直接监督的情况下完成大量工作，因此他们需要能够独立做出复杂而成熟的决策。自我主导的思维形式有助于工作人员做出真正内化的决策（Baxter
    Magolda, 2004）。


    主管可以用来培养学生工作人员自我主导发展能力的一个框架是通过学习伙伴模型（LPM；Baxter Magolda, 2004）。LPM的三个关键原则是：肯定学生作为认知者，将学习置于学习者的经验之中，以及共同建构意义（Baxter
    Magolda, 2004）。LPM营造了一个促进挑战和支持的环境，但始终与伙伴关系中他人的参与相一致。


    两位作者用于与学生工作人员建立学习伙伴关系的一个具体策略是制定个性化问责计划。IAPs为学生工作人员提供了对其工作承担额外所有权和责任的机会。关于学生工作人员实施IAPs的细节和建议是本章剩余部分的重点。


