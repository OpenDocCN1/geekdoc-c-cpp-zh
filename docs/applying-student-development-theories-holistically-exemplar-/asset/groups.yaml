  - '[PAGE 11]


    # STUDENT DEVELOPMENT THEORIES IN PRACTICE


    Buoyed by such supports as the policies in the standards and guidelines of the
    Council for the Advancement of Standards in Higher Education (2015), research
    evidenced by the body of work in *How College Affects Students* (Mayhew et al.,
    2016), and the theories of student development such as those presented in this
    book, today’s student affairs educators have addressed many challenges in students’
    education. And it is not magic; we understand why and how those interventions
    work particularly through the theoretical grounding they evidence.


    We remain challenged to address deep and pervasive societal issues such as acts
    of hate, racism, alcohol and drug abuse, and sexual violence. Our scholarship
    helps us understand root causes of these issues, but successful resolution still
    evades taking interventions to scale. Hopefully readers will rise to the challenge
    to address these pervasive and difficult issues. Examples in this book offer lessons
    from their programs that can be leveraged or at scale to address the complex agenda.


    Branch, Hart-Steffes, and Wilson and their authors in this book provide examples
    that explicitly link useful theories to the intentional design of programs and
    practices that achieve desired student outcomes. Every reader should pause now
    and reflect on their personal knowledge of relevant theory, knowledge of related
    research, skill at applying that scholarship to practice, and ability to learn
    from practice to redesign programs. Every professional needs a growth mindset
    (Dweck, 2008) that we can learn to be proficient in this process. It takes all
    of us sharing good praxis to advance the work of any of us.


    Each practitioner/educator must adopt a professional identity that includes some
    combination of being a scholar and practitioner. Some years ago, I wrote about
    a continuum of professional orientation (Figure 0.3; Komives, 1998).


    Many staff members are solid practitioners. They may be administratively skilled,
    operating from informal theory and strong common sense, but are largely atheoretical
    and uninformed by evidence. Practitioners who bring scholarship to their work
    seek out theory and research that informs their practice. The practitioner-scholars
    identify more with scholarship and are skilled at making applications of both
    theory and


    ![](img/c03cf8065037f42512bddd1febea4918_11_0.png)


    *Figure 0.3* Continuum of Professional Orientation


    Source: Komives (1998). Used with permission.'
