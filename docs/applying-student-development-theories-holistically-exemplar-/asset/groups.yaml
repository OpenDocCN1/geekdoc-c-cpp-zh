    这一框架揭示了实际身份与压迫、不平等和从属制度互动时的物质现实（Crenshaw, 1989; May, 2015）。交叉性植根于黑人女性独特的从属地位，并且“任何不考虑交叉性的分析都无法充分解决黑人女性受到从属的特殊方式”（Crenshaw,
    1989, p. 140）。作为一个概念，交叉性源于批判种族理论和黑人女性主义思想，这些思想早于该术语的提出。在*《追求交叉性，动摇主流想象》*中，May（2015）将交叉性描述为一种“两者兼有”的思维方式，超越单一轴思维，走向更复杂的矩阵式思维。我们利用交叉性作为指导框架，来考虑权力、特权和压迫对因各种社会身份而被推向边缘的学生的现实生活的影响。在与学生讨论特权、社会正义和公平问题时，必须使用批判性视角；因此，我们的课程融入了培养这种细致入微方法的阅读材料和活动。


    我们认为交叉性框架与自我主导的概念密切相关，这是我们在学生员工工作中的另一个基础理论概念。自我主导是建构发展教学法的一个例子，根据 Baxter Magolda（1999）的说法，“这不仅仅是让学生发言并产生自己的想法。而是要创造发展条件，使他们能够有效地产生自己的想法，本质上发展他们的思想、他们的声音、他们自己”（第7–8页）。May（2015）对交叉性的描述中强调的矩阵式思维与
    Baxter Magolda（2008）的自我主导过程密切相关，特别是在学生反思和审视自己所持有的价值观和信念方面。解构压迫性信息也是自我主导的关键部分（Baxter
    Magolda, 2008）；在与学生员工进行一对一对话时，我们积极挑战学生去审视内化压迫如何影响了他们的范式和信念。


    最后，这一实践基于 Baxter Magolda（2004）概述的 LPM。LPM 主张项目必须承认学习者知道和建构知识的能力。学习还必须置于学习者的经验中，并期望共同建构知识。为了在与员工共同促进者的午餐学习讨论中创造最佳的学生对话，并与多元文化事务办公室的学生共同创建倡议。


    第四个成果是让员工掌握可迁移技能，为他们在理海大学之后的职业生涯做好准备。与骄傲中心副主任和研究生助理的一对一对话提供了充分的机会，反思骄傲中心的工作如何与学生的职业抱负联系起来。


    该模式课程的实施始于学年开始时的员工静修会。在静修会上，专业员工表达了社区将学习视为非等级制度的期望，并挑战员工探索自己的社会身份和相应的位置性。静修之后，所有员工开始每周轮班。员工每周工作一个两小时的班次，并被分配特定任务和合作项目。学生员工指导中心的项目工作，这些工作基于我们的核心信念：除非以所有边缘化社区的解放为中心，否则我们无法为
    LGBTQIA+ 社区争取解放。除了每周轮班外，员工每周还聚集一次，进行一小时的会议。员工会议遵循一种在以下四个要素之间轮换的模式：

    - 一位客座演讲者，

    - 一场由学生主导的专业发展对话，

    - 一个自我关怀亮点，

    - 以及一次与多元文化事务办公室联合举行的员工会议，期间员工团队围绕包容和公平的主题进行对话。


    为了通过反思和自我审视进一步培养自我主导的学习者，骄傲中心与多元文化事务办公室合作，开发了 ETR，其灵感来自北卡罗来纳大学阿什维尔分校（UNC Asheville
    Student Affairs, 2018）和大峡谷州立大学（GVSU, 2018）使用的工具。该评分量表概述了五个具体的就业能力特质，这些特质是根据全国大学与雇主协会（2016）列出的雇主最希望求职者具备的顶级属性选择的，以培养学生员工在实习和工作面试中可以讨论的技能：

    - 沟通能力，

    - 团队合作能力，

    - 批判性思维能力，

    - 跨文化能力，

    - 以及行政/组织管理能力。


    这五个特质紧密相连。我们将沟通定义为一个人展示积极倾听、通过书面和口头形式清晰地表达想法，并考虑具体的沟通策略以满足目标受众的需求和期望的能力。我们将团队合作定义为一个人与同伴有效互动，并与校园内的个人和其他单位/办公室建立关系的能力。为了培养这种关系，必须有效运用沟通技能。批判性思维技能在整个学生员工经历中得以发展，包括做出明智的决定、从不同角度看待问题、创造对想法的替代解释，以及确定解决问题的多种方法。第四个特质——跨文化能力，深深植根于学生员工的经历中，并以交叉性框架为基础。我们将跨文化能力的一个基本组成部分定义为积极寻找机会，增加个人对与自己不同的文化和生活经历的理解。我们挑战学生员工，要求他们超越将跨文化能力视为个人过程的认识，承认压迫和边缘化的制度和系统性组成部分。我们将最后一个特质——行政与组织管理，定义为坚持个人和职业行为的高标准，积极应对变化，并表现出学习新方法和组织行政任务的意愿。


    ETR 旨在支持骄傲中心和多元文化事务办公室本科学生员工的学习和发展，并在全年中作为反思和评估工具使用。全年中，学生员工被要求通过他们在骄傲中心、课堂、其他领导职务以及个人方面的努力来强化这五个特质。学生员工定期在与同事和主管的一对一会议中反思这五个特质。ETR
    也被纳入每半年一次的全面评估中。这些评估基于多评价者反馈的概念，挑战传统的单向绩效评估方法（Bracken, Dalton, Jako, McCauley,
    & Pollman, 1997），以及 LPM 的原则，后者将学习视为共同创造和非等级制的（Baxter Magolda, 2004）。


    虽然学生员工被要求达到高标准，但我们认识到需要与学生员工一起学习，并在评分量表概述的各种特质中达到我们自己的期望。每学期结束时，专业员工和学生员工都要经历融入评分量表语言的全面评估过程，我们以此评估自己、同事、主管以及（如适用）被督导者。全面评估和每周一对一会议有助于确保员工对成长负责，以实现我们整体的、适合发展的成果。


    ## 评估与评价


    评估是骄傲中心学生员工模式的一个组成部分。通过使用正式和非正式的评估技术，我们确认了优势和成长机会。我们的评估方法是多层面的；我们首先让每位学生员工完成一份自我评估，要求他们在
    ETR 的背景下反思自己的优势和成长边缘。完成评分量表后，每两周一次的一对一会议成为讨论项目和评分量表各个方面的机会，以确保学生正在努力发挥自己的优势，并更多地了解个人成长领域。最后，我们在每学期结束时采用全面评估流程，所有员工（包括专业员工）都要为每位团队成员完成一份评价。如果员工希望获得生活中其他领域人士的反馈，他们可以将表格发送给其他人。


    从轶事来看，我们见证了学生在理解交叉性实践方面的进步，因为他们愿意接受对自己社会身份以及这些身份如何与权力、特权和压迫制度互动的批判性反思过程。我们发现，每两周一次的检查，以及使用全面评估和
    ETR，帮助学生以越来越深入、越来越有意识的方式批判性地反思成长领域。许多学生员工在由骄傲中心员工指导的学生组织中担任领导职务。我们看到这些学生员工鼓励他们的执行委员会思考领导决策如何影响可能持有与自己不同身份的一般成员。在规划骄傲中心项目时，员工们互相挑战，批判性地思考他们的偏见可能如何影响他们规划此类活动的方式。这些只是两个例子，展示了学生在通往自我主导和交叉性领导者的道路上取得的进步。


    该模式自2015年才开始实践，因此我们拥有的纵向数据有限。然而，我们对通过累积经验继续完善这一模式的可能性充满希望。

