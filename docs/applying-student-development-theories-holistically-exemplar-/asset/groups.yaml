    a campus tour, connecting with an IUPUI advisor in their major, attending an IUPUI
    Transfer Workshop on an ITISA campus, and immersing in IUPUI student culture by
    attending events that match involvement interests. In connection with Flaga’s
    (2006) dimension of *connecting* during the transfer process, Passport strives
    to help students feel interconnected with the IUPUI community by suggesting a
    campus visit, meeting faculty and staff, and taking part in IUPUI social programming.


    Passport advisors also maintain an office space within the ITISA academic advising
    center physically closest to the IUPUI campus where advising sessions are held
    four days a week. Wyner et al. (2016) suggest “establishing a visible presence
    on partners’ campuses is another investment with high return” (p. 9). By having
    a presence at ITISA, Passport is able to advise students at their home campus
    for transfer, offer in-house support for advisors to address inquiries on IUPUI
    curriculum or admission process, and attend weekly ITISA advising staff meetings
    for ongoing updates.


    Additionally, Passport conducts yearly meetings with IUPUI and ITISA academic
    departments to learn about curricular changes and strategies to best advise students.
    Flaga (2006) suggests summer academic unit visits at both institutions is key
    to maintaining relationships among advisors. Passport then compiles the information
    into a newsletter that is shared with ITISA and IUPUI faculty and staff to maintain
    communication between institutions. Highlights of the newsletter include ITISA
    and IUPUI academic departmental updates and course transfer policies by major.


    Passport discovered off-site advising is essential in its pre-transfer advising
    efforts to serve the mass ITISA student population interested in IUPUI. In addition
    to the North Meridian campus, which is Ivy Tech’s largest campus and located just
    three miles from IUPUI, Passport also advises at four other ITSA locations. Passport
    also expanded its offering of in-house advising days for ITISA learning communities.
    Learning communities such as TRiO, Nina/Bowen Scholars, 21st Century Scholars,
    Phi Theta Kappa Honor Society, and Male Empowerment Initiative in the ITISA allow
    Passport advisors to hold appointments within their program suites each semester.
    These collaborations actively promote a culture of transfer within their programs
    and encourage co-advising.


    To support the “characteristics of the pre- and post-transition environment” as
    noted by Schlossberg (1981), in-house advising provides IUPUI via Passport (*post-transitional
    environment*) and ITISA learning communities (*pre-transitional environment*)
    the opportunity to provide'
  - '[PAGE 150]


    students with positive coordinated institutional support for transfer. Wyner et
    al. (2016, pp. 29–40) also confirmed three of the strategies in The Transfer Playbook
    that tailored transfer student advising to discuss degree exploration, such as
    hosting in-house interactions, are essential to student success.


    # Transitional Programming, Advisor Training, and Resources


    Transitional programming, advisor training, and Passport resources are developed
    by Passport’s Assistant Director as a response to the needs of ITISA and IUPUI
    students, faculty, staff, and administrators. The Assistant Director oversees
    the compilation and dissemination of two resources: the newsletter (as mentioned
    previously) and the Passport Transfer Guide. Key topics of the Passport Transfer
    Guide include transfer options available to students, IUPUI admission requirements,
    application deadlines, and scholarships.


    Through student anecdotes and daily advising interactions with students, some
    students expressed frustration regarding the complexity of the transfer process.
    These anecdotes revealed students may experience mixed emotions as they navigate
    the transfer process, which may demonstrate some students are still developing
    in the managing emotions vector of Chickering and Reisser’s (1993) seven vectors.
    Passport created the Passport Transfer Guide as a succinct resource to address
    the major components of the transfer process and in turn attempt to make the transition
    for students as smooth and simple as possible, thus limiting the frustration.


    Schlossberg et al.’s (1995) identified coping variables are also addressed in
    Passport’s resources. The Passport Transfer Guide provides a gradual onset of
    the transitional journey by “setting the stage” for transfer. The overall voice
    of the guide encourages students to focus on the positive affect of transitioning
    to IUPUI, as well as re-establishes students as the internal source to direct
    their transition.


    Throughout the fall and spring semesters, Passport visits ITISA’s Student Success
    in University Transfer courses (i.e., IVYT 111) and capstone courses to share
    IUPUI transfer information with students. As these courses are offered in various
    formats across ITISA, Passport provides instructors the option of an in-person
    presentation or a voice-over infographic Microsoft PowerPoint presentation. These
    presentations may serve as a student’s first point of contact with Passport. As
    a result, a connection is established in which students seek Passport advising
    and attend supplemental events designed to aid in their transition.'
