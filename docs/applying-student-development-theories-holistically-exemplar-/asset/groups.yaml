    资金用于兼职聘请某人或以津贴形式支持研究员。两位工作人员和研究员每隔一周会面一次。


    《行动中的伦理推理》项目在 JMU 的校园范围内应用方面独一无二。教育干预发生在课外课程中（例如，学生员工培训、学生领导力项目、职业选择与准备讨论、学生主导的工作坊、学生开展的教育工作坊、住宿顾问培训）和课程中（例如，通识教育课程、专业及准专业课程、研究生和博士课程）。众多教职员工和学生设计并实施针对一个或多个学习成果的干预措施。


    弥合道德发展理论与实践之间的差距具有挑战性。这在一定程度上也是开发《行动中的伦理推理》的团队将伦理推理视为一种*技能*的原因，该技能可以培养和练习。对伦理准则或哲学理论的传统讲授能够鼓励对某个问题的复杂思考，但不一定能培养做出伦理决策的技能。通过体验式学习活动，学生与伦理推理的内容和过程建立联系。案例情景是主要的体验式载体。许多案例讨论利用带有发言棒的圆圈流程，以鼓励学生开放地进行对话，表达自己的想法并以尊重的方式相互挑战，同时以
    8KQ 作为结构。通过这些同伴互动，学生可能会被挑战去超越主导其世界观的权威，将他人视为有效的信息来源。


    除了吉莉根（1982）与同理心问题或科尔伯格（1981）与公平问题的表面联系之外，当考虑到学生的认知和道德发展是由伦理推理教育干预推动时，理论才变得鲜活起来。通过提问
    8KQ，学生的自我聚焦思维过程会被有意中断和挑战，从而产生“啊哈”时刻。他们可以通过将对他人的思考带入决策中，并在虚构和现实生活中的问题及伦理困境中得到支持，从而被挑战在道德发展上更进一步。以下是五个项目特定的教育干预措施。


    ### 同伴互助工作坊

    一群《行动中的伦理推理》志愿者同伴教育者为其他学生提供互动式伦理推理工作坊，以促进道德发展。与迎新办公室的长期合作使*事情很复杂*在后勤上成为可能并取得反复成功。


    ### 大学项目委员会的学生员工招聘与培训

    校园大学项目委员会的招聘和培训流程包括对伦理推理的关注。在执行委员会小组面试过程中，要求学生使用 8KQ 在圆圈流程中决定在基于委员会曾面临的关于在校园放映有争议电影的事件的情景中该怎么做。面试官（目前担任该职位的员工和学生）观察面试者在回答中引用了
    8KQ 中的哪些问题，他们质疑自己直觉的能力如何，以及他们如何共同做出决策。


    一旦学生被聘用，他们会参与更长时间的培训，使用 8KQ 分析并就他们在角色中可能面临的其他伦理情景做出决策，包括组织成员问题和不当表演者。整个学年中，学生使用
    8KQ 对实际出现的伦理情景进行辩论以确定行动方案。


    ### 学生行为教育工作坊

    作为对轻微学生行为违规的教育项目的一部分，学生问责与修复实践办公室的工作人员利用 8KQ 帮助学生审视自己的价值观和行为。在*价值观在行动*项目中，他们讨论两种或两种以上价值观冲突的情景，并使用
    8KQ 来理解该情况。学生还被要求反思个人伦理决策，以及如果使用 8KQ 会有什么不同。这两种活动都支持帮助学生在行动前考虑自身价值观的总体目标。在*掌控局面*项目中，在学生参与讨论酒精使用的利弊后，他们提问
    8KQ 以帮助他们识别并考虑是否饮酒决策中的更广泛复杂性。


    该办公室还围绕对社区造成各种伤害的问题开展小型和大型修复性圆圈。在反思论文和小组圆圈流程中，要求学生使用这些问题来考虑对他人造成的伤害以及这些伤害如何有效修复。


    理想情况下，在 8KQ 的所有项目化应用中，学生将保留 8KQ 的概念，使他们成为更有思想的社区成员，并能够将其应用于未来的情况。


    ## 评估与评价

    作为一项校园范围的项目，学生学习评估在机构层面使用纵向设计进行：第一次评估发生在第一年迎新最后一天，第二次评估在二年级二月份进行。三个评估工具是在与 JMU
    评估与研究中心合作下开发的；这些工具衡量五个学生学习成果（SLOs）。针对特定教育活动的评估由个人教师和学生事务专业人员设计，以衡量特定教育干预的有效性。


    项目评估侧重于学生广泛区分和应用 8KQ 概念的能力，而非难以捉摸的学生“伦理行为”评价。定义问题测验-2（Rest, Narvaez, Thomas, &
    Bebeau, 1999），衡量道德发展的首选工具，未被使用，因为它过于狭窄地聚焦于正义导向的道德判断，无法满足《行动中的伦理推理》评估需求。论文评估评分奖励对伦理情况的识别、对关键问题的广泛（且准确）应用、对每个
    KQ 与决策相关性或不相关性的解释，以及对伦理考量的权衡与平衡的展示。JMU 伦理推理量规©（2014）提供了针对 8KQ 熟练程度的特定评估参数。


    总体而言，自项目开始以来，伦理推理技能有所提高，如横断面分析所示，该分析将 2012 年秋季在任何伦理推理干预之前收集的基线数据与学生在后续年份中至少经历过*事情很复杂*入门项目的数据进行比较（Bashkov,
    Smith, Fulcher, & Hawk, 2014; JMU, 2016; Pyburn, Smith, & Ames, 2016; Smith, Fulcher,
    & Pyburn, 2015）。然而，纵向分数在回忆工具《伦理推理回忆测验》（衡量 SLO 一）上在第一次和第二次之间略有下降或没有显著变化，如年度评估报告所示（Bashkov
    et al., 2014; Pyburn et al., 2016; Smith et al., 2015）。我们认为这与内容、参与机会和个人生活有关。任何（在任何大学或组织）对
    8KQ 有基本了解的人都可以将其融入与学生或员工的工作中。这不需要伦理或心理学方面的专业知识，或认知或道德推理发展理论方面的知识即可帮助学生成长。然而，由于该项目的灵活性和广泛分布，实施并不总是保持一致，这可能会影响学习和评估。


    《行动中的伦理推理》源于大学的再认证流程，该流程要求构思、资助和实施一个旨在增强学生学习的新想法（JMU, 2012）。因此，我们在机构范围内实施方面具有显著优势。然而，该项目最棒之处之一是其可扩展性。规模较小且面向特定受众的项目由致力于发展学生伦理推理能力的员工创建。大型项目的规模如果没有机构支持，很难在整个校园实施，但一个办公室或专业员工完全可以围绕此内容开发一个项目。除了时间和人员配备外，项目成本很小：材料复印件和书写用具。


    8KQ 框架的一个非预期结果与以证实性（Haidt, 2001）而非探索性的方式应用 8KQ 有关，这可能会阻碍成长。问题应在做出决定之前使用，而不是用来描述一个人已经做过的事情。这导致第二个警告：8KQ
    不应用来评判或分析他人的行为，而应作为个人能动性和对决策负责的提示。虽然伦理推理可用于理解他人的行为，但它是一种前瞻性思考和行动的工具。


    从该项目的实施中获得的一个重要经验是学生认知发展随时间的局限性。作为从业者，我们将理论视为学生成长的地图，并且知道它并不总是那么直接，但实施这样的大规模项目强调并使这种局限性变得真实。我们必须问自己：我们实际上可以期望学生能够思考和做什么？毕业时，一些学生将达到伦理推理的先进水平，但许多人不会。我们的希望是，通过培养提问的习惯，该项目的“加一”特性将继续帮助他们挑战自己快速思考并提供反复的成长机会。

