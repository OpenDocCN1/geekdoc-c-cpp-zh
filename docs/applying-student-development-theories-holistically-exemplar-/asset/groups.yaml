    ## 指导理论


    Tippie Buddies 的构想与持续发展以 Phinney (1993) 的族群认同发展模型为指导。与 Phinney 的定义相似，族群认同发展与种族认同发展之间应有明确区分。这项任务可能很困难，因为两者经常被混为一谈。这种并置因美国对种族与族群持续缺乏区分，以及达到“后种族”时代的说法而进一步加剧
    (Johnston-Guerrero, 2016)。在将该模型付诸实践时，我们认为重要的是指出，族群认同是以批判性、交叉性的视角来定义的，该视角承认影响学生身份认同的权力系统以及他们如何在校园中
    navigating 大学生活。从这个意义上说，该项目旨在让来自各背景的学生，包括白人学生，参与需要反思并与他人分享作为各自族群成员的意义的活动。


    Phinney (1993) 的模型包含三个阶段：


    - 未审视的族群认同，即个人尚未探索其族群与自我认同之间的关系

    - 族群认同探索/中止期，即遭遇差异（例如，针对自己或他人、少数族群的公开歧视/种族主义、揭示特权的情境）会提高人们对族群在日常生活中的作用的认识，并将此类经历与自身认同整合

    - 族群认同达成，即对差异经历的解决与自我认同的其他方面融合，形成对其族群文化成员身份的接纳


    个人会参与引导其在每个阶段或状态下理解的过程。探索期在一个人了解自己群体和他人的积极与消极方面时出现。中止期可在探索过程中出现，当一个人对在群体中的归属感不确定，以及是否完全认同与群体成员相关联时。承诺是接纳发生的过程，通常与积极的群体态度相关联。


    Phinney (1993) 的模型常用于族群少数群体的背景下，但被采纳为 Buddies 的指导理论，因为它能增进对自我和他人的理解，同时认识到该过程没有具体的终点。


    - 建立友谊，促进学院内所有本科生的融合。具体而言，正如我们所指出的，即使不认同为种族少数群体的学生，也可能拥有使其孤立或造成障碍的族群认同。通过建立点对点网络，我们希望缓解与过渡和留存相关的问题。

    - 创建一个安全且半结构化的环境，以便进行与种族和族群相关的困难对话，既广泛地，也特别是在美国大学校园的背景下。

    - 为所有学生提供批判性自我反思的空间，并鼓励他们将项目中的见解与整个大学经历、职业抱负和个人目标联系起来。


    ## 实施细节


    如今已进入第八学期，Tippie Buddies 是一个自愿配对项目，整个学期有多样化的接触点。设计策略以之前提到的预期发展成果为指导，总体目标是创建一种结构，使学生有很大机会参与意义建构的体验。


    学生通过简单的在线申请加入项目，该申请收集诸如专业、年级、性别、爱好和个人形容词等信息（例如，“你的朋友会如何描述你？”）。在学期第二周结束的申请截止日期后，助理主任和大使根据学生的申请创建配对。配对完成后，参与者会收到其伙伴的姓名和电子邮件地址。下周，配对在启动活动中首次见面，该活动旨在兼具社交和信息性。


    在学期剩余时间里，伙伴们通过结构化活动和独立会面的激励措施与项目保持联系。伙伴们预计每学期至少见面五次。接触点包括以下内容：


    以具有指导性、积极且共享的方式体验和反思差异的机会。


    ## 评估与评价


    Tippie Buddies 的设计旨在让来自各背景的学生参与自我探索，并与他人分享作为各自族群成员的意义。在下一节中，我们描述了这些成果如何被评估。


    ### 通过参与后调查和顾问观察进行评估


    自项目启动以来，参与者的反馈和见解一直影响着项目的发展方向。Tippie Buddies 项目的评估数据主要来自匿名参与后“离场”调查，该调查在项目结束后提供给参与者。调查项目为开放式，提示学生阐述他们认为项目做得好的方面以及可以改进的方面。此外，调查还邀请参与者反思项目提供的益处（如有）。多个学期的总体反馈为积极。例如，自
    2014 年春季以来每个学期进行的历次调查的受访者中，81% 表示同意或强烈同意“该项目帮助减少了我与伙伴之间对其各自文化的误解”这一陈述。同一时间段收集的数据显示，超过
    97% 的受访者同意或强烈同意“我会向朋友推荐 Tippie Buddies 项目”这一陈述。


    评估数据通过个别咨询会议非正式收集，在这些会议中，学生经常公开讨论并披露与项目相关的积极和消极经历。助理主任及同事既是 Tippie Buddies 的协调员，也是本科生学术顾问的双重角色，在征求参与者反馈时证明很有用。这使专业人员能够在面对面会议中获得更深入的见解，以进一步说明离场调查中出现的趋势，例如。


    ### 体验差异的机会


    许多参与者明确指出，他们选择来到爱荷华大学是因为他们知道这将提供充足的机会与不同的人建立联系，正如一位学生所说，“拓展我的文化视野”。我们了解到，作为伙伴项目的一部分的日常互动可以激发学生的更深层反思。例如，一些学生回忆起个人空间问题，以及在与他人互动时其文化背景意味着什么，促使他们更批判性地审视如何对他人的偏好保持敏感。


    同样，学生们经常声称项目的最大价值之一是提供，正如另一位学生所说，“关于文化差异的开放对话空间”。调查回复的额外示例包括以下内容：


    - “在伙伴活动中我从未感到尴尬，因为我们都知道我们在做一些与我们习惯不同的事情，正因为如此，我觉得我真的学到了理解来自另一个国家的人是什么感觉。”

    - “它为伙伴们创造了一个积极且安全的空间，可以一对一分享，而不会感到任何潜在的学术或社交压力。”

    - “我喜欢我们被鼓励在不使用闲聊的情况下讨论彼此的文化和个性。我们感到足够舒适，可以在爱荷华大学期间讨论挑战、刻板印象、恐惧和希望。”

    - “我了解到国际学生与我并无不同——我喜欢我的伙伴和我拥有完全相同的道德和价值观，即使我们来自世界的两端。”


    ### 国际学生在欢迎的支持结构中体验差异


