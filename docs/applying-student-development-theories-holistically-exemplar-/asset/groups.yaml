    # Intentional Serendipity and Positionality


    *Intentional Serendipity* was one of the titles we (i.e., Branch, Hart-Steffes,
    and Wilson) considered for this book on applying theory in practice. As we reflected
    on our experiences with using college student development theories in multilayered
    and holistic ways throughout our careers, we were struck by how many “ah-ha” moments
    seemed so serendipitous. Yet, these same moments likely would not have happened
    but for our academic backgrounds that emphasized the use of theory. This paradox
    of intentionality and beneficent chance describes the art of applying holistically
    the science of college student development theories. The co-editors of this book,
    and many of the contributing authors, were socialized to be what Komives (1998)
    identifies as scholar-practitioners. While we had the knowledge and dispositions
    to apply effectively theories we learned during our graduate educations and subsequent
    professional development, we recognized the outcomes of such applications were
    dependent upon a myriad of factors—including chance. The skills needed to apply
    theories effectively were, in part, an art.


    As we advanced in our careers in higher education, there were opportunities to
    both develop further the art of applying student development theories holistically
    and to emphasize student success outcomes. Such outcomes are inclusive of student
    learning and development as well as attainment of educational goals (see Kuh,
    [Branch] Douglas, Lund, & Ramin-Gyurnek, 1994). On a spring day in 2005 in a diner
    in College Park, Maryland, Jeanne, who was the President-Elect of ACPA-College
    Student Educators International, met with ACPA Past President Susan Komives to
    talk about ideas to engage and advance the profession. Komives suggested that
    one idea would be to create a practical guide to *Learning Reconsidered: A Campus-Wide
    Focus on the Student Experience* (Keeling, 2004). According to Dungy (2006), “This
    need for practical assistance harkens back to the original working title of *Learning
    Reconsidered*, which was: *A Blueprint for Action*. Student affairs educators
    agree with the concepts; now, they want to implement the recommendations” (p.
    2). That was the impetus for the publication *Learning Reconsidered 2: A Practical
    Guide to Implementing a Campus-Wide Focus on the Student Experience* (Keeling,
    2006). Since that publication, there have been new generations of emerging professionals
    who have entered the study and practice of student affairs in higher education.


