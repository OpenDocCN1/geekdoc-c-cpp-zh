    尽管自我反思的过程对我们作为顾问来说充满挑战，但经验告诉我们，对学生来说这是一项更困难的任务，因为自我反思可能会在他们的脑海中浮现并确认自己与同龄人之间的差异。然而，Kolb（1984）的经验学习理论告诉我们，反思是学习过程中不可或缺的组成部分。反思经历的行为与拥有经历本身同样重要，因为正是通过反思才产生意义。我们认为，为学生创造有意的反思机会——例如签到——非常重要。


    在我们的角色中，我们强调需要准备好抵制任何可能出现的羞耻感信息，这种羞耻感常常伴随涉及社会阶层的讨论。重新构建讨论，使其无评判地包容每个学生的现实，这一点至关重要。例如，这可能意味着回应“没有钱确实很糟糕，而且似乎一切都太贵了”，而不是陷入围绕金钱对话时常见的尴尬沉默。这也可能意味着对诸如Kalief
    Browder事件等时事保持敏感并进行讨论。Browder是一名黑人男性，他在缺乏证据的情况下被指控犯罪并入狱；获释后自杀身亡；监狱改革倡导者将他的故事视为需要变革的证据。在讨论这一悲剧后，我们开放了对话，讨论男性学生和有色人种学生的种族偏见和心理健康挑战。


    对于一个致力于第一代学生的组织而言，LPM与经验学习周期的融合要求顾问们专注于帮助使组织变得“真实”，而非“好看”。有时，我们可能需要停下手中的事情，就正念活动对管理压力的重要性进行对话，或在期中考试周安排学习会议。然而，我们还必须同时平衡成员当前的心态。不断提醒他们关注未来，同时又要专注于当前任务，这颇具挑战性。这种以学习为中心的方法的一个缺点是效率问题，因为变革性的学习体验需要充足的时间。我们需要定期重新调整对所能完成之事的期望。


    最后，邀请外部演讲者到组织需要与演讲者进行有意义的准备，以便他们能够从“知识”的角度而非“缺失”（即“无知识”）的角度与学生互动。顾问们通常是第一个向演讲者提问的人，以此向学生示范可以提出哪些类型的问题，以及如何提出这些问题。


    WIGS（及其所包含的一切）正推动WIU校园朝着对FGS身份更加积极的气候发展。教职员工现在开始自豪地将自己认定为FGS，我们也开始看到学生中出现类似趋势。这种认识的提高有助于WIGS作为学生组织的可持续性和长久性。


    ## 建议与资源


    ### 为FGS创建支持结构


    FGS报告称，与非FGS同龄人相比，他们感觉更不自信、更孤立，并且更可能在校外工作和生活（Davis, 2010）。对校园内FGS空间的支持验证了FGS的经历，重申了他们与生俱来的学习能力，并帮助他们感到自己的生活经验是有价值的。在创建这些空间时，请记住FGS标签与其他身份共存：种族、性别、性取向和残疾（dis/ability）等。如果FGS除了其FGS身份之外还拥有其他边缘化身份，他们可能更容易受到压迫和支配体系的复合影响。因此，理解FGS的多重身份（Orbe,
    2008）和身份显著性（Orbe, 2004）如何影响他们成功驾驭大学校园的能力，可能在与FGS打交道时有所帮助。


    ### 创造让FGS更容易获取资源的环境


    FGS通常不会寻求帮助，并且意识到自己的经历与其他学生的差异（Davis, 2010）。Parker（2014）发现，谈论这些差异，尤其是社会经济差异，有助于提高GPA和大学资源的使用率。谈论FGS的经历使FGS能够在大学教育中发挥积极作用。尽管FGS的经历中存在独特的障碍，但FGS拥有众多优势。如前所述，学生们在解决问题、批判性思维和个人支持方面成为了同龄人的倾听者（sounding
    boards）。


    ### 塑造环境以具体满足贵校FGS的需求


    来自FGS的反馈和参与对于塑造组织环境，并有望塑造机构环境以满足其需求至关重要。在任何特定机构中，很难预测FGS的需求和人口统计特征。WIGS学生组织存在于一所中型、四年制、地区性公立大学中——因此，需要更多关于其他机构FGS经历的研究。在各种机构中创建FGS学生支持系统，有助于开展更全面的关于FGS学生经历的研究，进而更好地支持FGS。


    ### 考虑如何最好地支持贵校的FGS


    寻求创建类似WIGS的学生组织的实践者，不妨咨询学生参与办公室，了解如何创建学生组织以及获得组织认可的要求。


    ### 探索其他关于支持FGS的资源


    WIGS的创建主要源于Davis（2010）的*《第一代学生经历：对校园实践的意义，以及》*


