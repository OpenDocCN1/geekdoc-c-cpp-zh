    ## 密苏里大学黑人男性倡议简介


    MBMI 是由盖恩斯/奥尔德姆黑人文化中心（Gaines/Oldham Black Culture Center）实施的一项领导力发展项目。该中心的工作人员深知，离开家乡来到一所白人主导的院校（PWI）对有色人种学生而言可能充满挑战。该项目旨在有效帮助一年级黑人男性顺利过渡到密苏里大学的校园环境。支持、发展和参与是指导该项目运作的三大支柱。


    在全国范围内，黑人男性在种族群体和性别分类中的毕业率都是最低的（Harper, 2006）。MBMI 创建于 2009 年，以应对密苏里大学黑人男性学生保留率和毕业率低的问题。该项目的第一个版本面向所有黑人男性本科生开放。2013
    年，项目范围调整为仅针对即将入学的黑人一年级男性。随着时间的推移，项目负责人增加了更多结构，引入学分，并增加了一个目标：在密苏里大学校园内培养下一代学生领袖。


    当前版本的项目包括一门为期两个学期、带学分的课程，其中包括：

    -   与校园领袖和成功的黑人男性进行演讲和讨论

    -   领导力培训和参与服务项目

    -   加入校园学生组织


    课堂讨论、活动和作业旨在促进参与者的反思和意义建构。


    ## 指导理论


    根据 *校园中代表性不足群体与多样性的氛围*（Hurtado & Ruiz, 2012），有五分之一的黑人学生在大学校园中感受到某种排斥。此外，黑人学生直接或间接地将种族动态视为在
    PWI 就读期间影响其心理健康的一个因素（Hurtado & Ruiz, 2012）。一个能够实现强烈归属感的空间：该项目确保参与者与一群身份多元、背景多样且积极参与校园和社区活动的黑人男性互动。


    ## 实施细节


    ### 领导团队


    MBMI 项目由一支团队领导，包括一名专业教职员工、两名助教和六名同伴导师。该教职员工在包容、多样性与公平部门（Division of Inclusion,
    Diversity, and Equity）旗下的盖恩斯/奥尔德姆黑人文化中心（GOBCC）工作。助教通常是曾担任过同伴导师角色的本科高年级学生，由 GOBCC
    的专业教职员工选拔。六名同伴导师从往年的 MBMI 项目中挑选；他们在春季学期接受选拔和培训，为秋季的项目做准备。同伴导师需以身作则，每两周与其分配的学员会面一次，并计划实施社区服务活动、自习室和社交活动。


    ### 招募与选拔


    MBMI 参与者的招募既有非正式途径（如口碑、社交媒体、电子邮件等），也有正式途径（如夏季迎新活动以及向所有即将入学的黑人一年级男性发送信件）。有意参与 MBMI
    的学生需要完成一份申请表，该表旨在评估他们对项目的兴趣、自身优势与不足、如何定义领导力、服务和导师关系、认为自己能为项目做出哪些贡献，以及他们的个人目标和预期在大学生活中可能遇到的挑战。在审阅申请表后，领导团队会将来自不同背景、拟修专业和地理位置的学生组成小组。该项目每年每个小组招收
    25 至 30 名学生，约占当年入学黑人一年级男生的 10%。小组规模受限于人员配备和资金资源。


    ### 结构


    MBMI 包含一门为期两个学期的课程，名为 *SSC 1150：学生成功中心*。课程目标包括培养归属感、促进学生参与大学的课程和课外生活、鼓励自我责任，并通过分析每个学生的预期
    GPA 与实际 GPA 来促进理解；该分析在第一学期末完成。还会跟踪参与者的保留率和毕业率。在整个项目过程中，还使用了若干其他形成性和总结性评估方法。


    ## 支持


    对学生支持的衡量部分通过项目早期和整个学期中实施的需求评估来实现。参与者需要阐明他们总体上希望从 MBMI 项目中学到什么，以及他们对领导团队的期望。参与者还与同学共同建立社区规范，以营造积极的学习环境。在与领导团队成员的一对一会议中，会重新审视这些需求和期望。目标是确保
    MBMI 项目始终关注参与者已识别的需求。虽然提供一般性资源和信息与学生的入学过程相关，但项目会调整课程以满足学生的个人需求。


    学生每学期都需要定期与同伴导师会面。在会面期间，同伴导师会与其分配的学员进行对话，了解他们的个人、社交和学业过渡情况。根据会面中讨论的内容，同伴导师会就 MBMI
    参与者如何调整和改善他们的体验提出建议。同伴导师还根据已识别的需求和障碍组织小组导师会议。通过这种方式，参与者可以在关系脆弱性和透明度的基础上，与同伴建立个人层面的联系。参与者还被要求每学期至少与指导老师会面一次，讨论学业障碍和进展。


    在参加校园活动并完成反思论文后，参与者会参与由同伴主导的讨论，分享他们在作业中学到的内容和所写的内容。这些小组讨论让学生们能够相互肯定彼此的经历，同时以有助于营造支持性学习环境的方式挑战彼此的观点。反思论文有助于领导团队深入了解参与者的需求。反过来，领导团队成员可以在他们的一对一会议中利用从论文中获取的信息。


    ## 发展


    MBMI 成员的发展通过旨在全面关注学生的课程和课外活动来促进，特别是针对学生在经历成人黑人身份发展（adult nigrescence）过程中形成健康黑人身份的需要（Cross,
    1971）。鉴于学生很可能处于接触（Encounter）和浸入-浮现（Immersion-Emersion）阶段，课外和课内活动（如反思论文）为学生提供了体验和机会，让他们挑战自己对黑人身份的感受，并沉浸在黑人文化中。此外，MAB
    体验让参与者参与各种服务机会，促进个人成长，并增强群体的凝聚力。在旅途中，当学生作为黑人男性在集体和个人层面挑战自我时，各种活动的组合会引发讨论、反思和发展。这些挑战通常在旅途中的夜间反思和讨论中得到突出体现。


    课堂反思论文鼓励参与者批判性地审视和反思多个学术和社会话题，同时关注他们的黑人身份发展和归属感问题。虽然学生没有被要求明确指出自己在黑人身份发展模型（Cross
    & Phagen-Smith, 2001）中所处的具体阶段，但反思有助于塑造一对一会议、课堂讨论和未来反思论文的讨论方向。例如，一个积极参与课程和课外活动的学生可能表现出对改变的承诺（浸入-浮现阶段）。领导团队随后可以鼓励他们过渡到拥抱身为黑人的意义并流露自我关爱的状态（内化/内化-承诺阶段）。


    Harper 和 Quaye（2007）提出，更高水平的课外参与直接有助于黑人男性学生形成更强烈的种族认同态度。由于 MBMI 项目是盖恩斯/奥尔德姆黑人文化中心的一项倡议，参与者及其家人能够立即与工作人员建立联系，并获得丰富的活动安排。GOBCC
    是帮助参与者发展的直接支持来源。这些联系和机会有助于参与者从接触（Encounter）阶段推进到浸入-浮现（Immersion-Emersion）阶段。


    ## 参与


    为了帮助他们顺利过渡到 MU 校园，MBMI 参与者被鼓励参与校园活动。参与指的是在各种活动中投入身体和心理能量（Astin, 1984），并且对培养归属感和健康的黑人身份有积极影响（Strayhorn,
    2008）。高度参与的学生也往往处于黑人身份的浸入-浮现和内化/内化-承诺阶段

