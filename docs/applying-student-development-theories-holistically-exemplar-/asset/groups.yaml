    利用个性化问责计划（IAP）的项目。作者与学生工作人员一起使用的IAP问题示例列于表7.2。


    需要提醒的是，让学生工作人员参与IAP流程的每个部分至关重要。如果主管不愿在合作关系（工作关系）中放弃部分权力，以分担创建IAP的责任，那么学生工作人员可能难以理解如何在自己的角色中掌控自身经历。有些学生工作人员可能期望随时被明确告知该做什么和怎么做。


    ## 表7.2 面向学生工作人员的个性化问责计划示例问题


    | | |

    |---|---|

    | 反思： | 上个学期我的IAP有哪些进展顺利？我想在哪些方面做得更好？这个学期我为自己设定的目标是什么？ |

    | 你的IAP应包括： | RA（宿舍助理）工作的个人目标。项目规划要求，包括你个性化的日期。专业发展与文化能力促进。组织系统：你将如何记录日期/时间/邮件信息/口头信息？
    |

    | 我将如何管理我的时间？ | 你将如何让主管知道你已完成工作？当你没有完成任务时会发生什么？我们如何解决这个问题？注意：当存在部门期望时，有时主管无法灵活变通。你将如何了解自己的任务量并在需要帮助时表达出来？如果你需要更多时间处理一项任务，你如何与Liz或工作人员（在适当的情况下）沟通？你会提前多久沟通这一需求？当你阅读一封包含大量信息和指示的电子邮件时，你如何确保自己理解了所有信息？
    |


    ## 探索可帮助员工推进IAP流程的资源


    对于实施IAP的专业工作人员来说，通过记录日志、叙事性评估和对话来持续评估每位员工的IAP效果至关重要。以下网站提供了创建有效反思提示的建议和思路：


    - www.facultyfocus.com/articles/teaching-professor-blog/prompts-help-students-reflect-approach-learning/
    (Weimer, 2014)

    - https://ww2.kqed.org/education/2017/05/16/8-ways-for-students-to-reflect-on-their-learning/
    (Chen, 2017)

    - www.edutopia.org/discussion/scaffolding-student-reflections-sample-questions
    (Alrubail, 2015)


    有几本书对专业工作人员很有帮助，这些工作人员致力于尊重、支持并帮助来自不同背景的学生茁壮成长（尤其是在以白人为主的院校就读的学生）。两个范例是Quaye和Harper（2015）编辑的*《高等教育中的学生参与：多元群体的理论视角与实践方法》*，以及Museus和Jayakumar（2012）编辑的*《创建校园文化：促进不同种族学生群体的成功》*。Roper（2012）在“跨文化督导：应对多样性与多元文化”中分享了有用的信息，该文是专著*《支持与督导中层专业人员》*中的一章。


    IAP是一种最大化学生工作人员发展成长的策略，可以帮助他们应对其角色中的适应性挑战。通过主管与被督导者共同制定行动计划的过程，学生工作人员将有机会批判性地思考他们的成长、发展、工作风格，以及这些如何受到其身份和历史的影响。IAP的本质允许学生工作人员以适合其独特需求和背景的复杂方式思考自己的角色。在有意识地实施下，IAP可以帮助学生工作人员有效应对其复杂岗位中的适应性挑战。


