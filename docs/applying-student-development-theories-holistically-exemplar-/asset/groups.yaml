    When examining the applications of theory, the lag time among research that leads
    to theory, publication of these theories in peer-reviewed outlets, research that
    suggests revisions to the original theory, and practical applications of theory
    is often noticeable. One result of this lag time is a need to look at the socio-historical
    context of theories and when, how, and why they are used in contemporary practice.
    For example, traditionally, psychologically based developmental theories have
    understood the term *holistic* to reference individually oriented aspects of self
    as well as internal ways of making sense of the world. What this interpretation
    may underestimate, despite complementary theories that emphasize the influence
    of context, is a socio-ecological dimension that influences how humans navigate
    and interact with the world around them. We loosely define this socio-ecological
    dimension as the interaction among forces (e.g., culture, power, stereotypes,
    social norms, rules) that govern one’s positionality—which is amendable to local,
    national, and global contexts. The socio-ecological dimension adds a considerable
    degree of complexity to what is meant by holistic student development, often translated
    to supporting “the whole student” (Evans, Forney, Guido-DiBrito, Patton, & Renn,
    2010). Supporting the whole student in absence of the socio-ecological dimension
    is an incomplete, inadequate approach. True holistic student development, then,
    cannot be achieved if there is failure or refusal to acknowledge power and privilege
