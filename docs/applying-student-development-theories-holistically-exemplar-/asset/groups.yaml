  - '[PAGE 191]


    **Gordon S. Louie** earned both a bachelor’s degree and a master’s degree in History
    and a Graduate Certificate in Higher Education from the University of Nevada,
    Las Vegas. While in graduate school, he began working in higher education through
    a grant for program development/assessment, and has since gained experience in
    academic support services, admissions/financial aid, academic advising, and international
    programs. Alongside his role as the Assistant Director, Global Community Engagement,
    in the Tippie College of Business at the University of Iowa, he is currently a
    PhD student in the Educational Policy and Leadership Studies program at Iowa.
    His current research interests and projects include ethnic identity exploration
    for international students, and the points of intersection/divergence in policies
    regarding campus diversity and internationalization.


    **Marcus Mayes** graduated from the University of Missouri with his BS in Business
    Administration and a master’s degree in Education Leadership and Policy Analysis.
    He co-founded the Mizzou Black Men’s Initiative in 2009 and served as the program
    coordinator until 2013, providing guidance, support, and mentorship to program
    participants as they transitioned from high school to college. In his current
    role as the Coordinator of Student Activities at the University of Texas, Austin,
    Marcus coordinates development and recognition programs for registered student
    organizations on the 40 Acres, and co-advises Student Government, Senate of College
    Councils, and the Graduate Student Assembly.


    **Jonathan A. McElderry** serves as the Assistant Dean of Students and Director
    of the Intercultural Center at Wake Forest University. His experience in higher
    education has focused on enhancing diversity, equity, and inclusion on college
    campuses. Additionally, his research has sought to raise awareness of the experiences
    of underrepresented students at Predominantly White Institutions and provide strategies
    to increase their academic and social success. He has presented both nationally
    and internationally, has held leadership positions within the American College
    Personnel Association, and has received several awards for his work in higher
    education. Jonathan earned a PhD in Educational Leadership and Policy Analysis
    with an emphasis in Higher Education from the University of Missouri and an MEd
    in College Student Personnel from Ohio University.'
