    # Explore Resources That Help Staff Advance the IAP Process


    For professional staff members who implement IAPs, it is critical to continually
    evaluate the effectiveness of each staff member''s IAP by journaling, narrative
    evaluation, and conversation. The following websites offer suggestions and ideas
    for creating effective reflective prompts:


    +   - www.facultyfocus.com/articles/teaching-professor-blog/prompts-help-students-reflect-approach-learning/
    (Weimer, 2014)

    +   - https://ww2.kqed.org/education/2017/05/16/8-ways-for-students-to-reflect-on-their-learning/
    (Chen, 2017)

    +   - www.edutopia.org/discussion/scaffolding-student-reflections-sample-questions
    (Alrubail, 2015)


    There are several books that are helpful for professional staff who are engaged
    in honoring, supporting, and helping students from diverse backgrounds thrive
    (particularly when attending Predominantly White Institutions). Two exemplars
    are *Student Engagement in Higher Education: Theoretical Perspectives and Practical
    Approaches for Diverse Populations*, edited by Quaye and Harper (2015), and *Creating
    Campus Cultures: Fostering Success among Racially Diverse Student Populations*,
    edited by Museus and Jayakumar (2012). Roper (2012) shared helpful information
    in “Supervising across Cultures: Navigating Diversity and Multiculturalism,” which
    is a chapter in the monograph *Supporting and Supervising Mid Level Professionals*.


    IAPs are a strategy to maximize the developmental growth of student staff members,
    which can help them approach the adaptive challenges of their role. Through a
    process of co-creating an action plan with supervisor and supervisee, student
    staff members will have the opportunity to think critically about their growth,
    development, and working styles, and how that is informed by their identities
    and histories. The nature of the IAP allows student staff to think about their
    role in a complex way that suits their unique needs and contexts. Implemented
    with intention, IAPs can help student staff members approach the adaptive challenges
    of their complex positions in effective ways.


    # REFERENCES


    Alrubail, R. (2015, January 3). *Scaffolding student reflections plus sample questions*.
    Retrieved from www.edutopia.org/discussion/scaffolding-student-reflections-sample-questions'
