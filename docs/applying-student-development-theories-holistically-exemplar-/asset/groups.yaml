    的目标是鼓励并庆祝学生工作人员已经了解自己的方式，以及他们的优势、挑战和成长领域。通过这种方法，学生工作人员更投入于自己的角色，因为他们帮助创建并推动自己工作的方式。这使他们能够识别有助于他们利用作为学生、领导者和校园工作人员所已有的知识和专业知识做出决策的经历。


    从根本上说，IAP 的结构和内容会根据主管以及学生被督导者的需求和期望而有所不同。在表 7.1 提供的示例中，一名 RA 被督导者决定通过写博客来理解自己的经历、工作角色和价值观。另一名学生则通过在电子表格上跟踪实现目标的进展，然后口头处理或庆祝自己的工作来理解自己的角色。这些评估工具均由主管和被督导者共同创建，以最好地满足住宿社区、员工团队以及
    RA 本人的需求。


    尽管 IAP 是共同创建的，但决定和传达学生工作人员可以在其中发挥创造性的参数是主管的工作。例如，住宿主任可能会计划在其规划中包含一些具体的期望和举措。在迈阿密大学，一些参数包括：


    -   满足部门期望和合同义务

    -   在宿舍执行值班/巡查

    -   出席员工会议

    -   遵守学生行为准则

    -   维护并实施与项目要求相一致的项目

    -   实施与社区建设、文化胜任力、人际发展和学业成功相关的策略


    显而易见的是，学生工作人员并不被要求自行创建其角色的期望；相反，他们有机会在更大参数的背景下塑造其特定经历在日常中的样子和感受。


    为了创建 IAP，学生工作人员会接受主管设定的参数并审视实现这些期望的最佳方式。在迈阿密大学的若干案例中，RAs 被要求回答一份问题清单，以便形成其 IAP
    的样子。问题的示例列在本章建议和资源部分（见表 7.2）。这些问题可以指导与任何学生工作人员创建 IAP，或根据使用者的需求进行修改。


    从这份问题清单开始为开发 IAP 的初步对话提供了方向。表 7.1 显示了与迈阿密大学 RAs 共同设计并使用的 IAP 的摘录。


    如表 7.1 所示，IAP 可以采用多种格式。利用 IAP 进行督导的一个困难是员工很可能会有不同的自我问责方式，这给主管带来了额外的工作，以跟上每个员工正在做的事情。然而，每位学生对其学习所承担的所有权和责任，从而带来个人和职业发展，为角色的有效性提供了长远的益处，使这项努力物有所值。


    ## 评估与评价


    自我作者性和意义建构作为复杂概念，需要复杂的评估方法（Baxter Magolda & King, 2007）。衡量自我作者性的三种方法包括使用现有的认知变化测量方法、使用评分方法衡量学生成果，或使用半结构化访谈和学生叙述（Pizzolato,
    2007）。因此，为了评估 IAP，我们有决策；通过考虑最、最小、最优和最差的极端来推进思考的边缘；并以不同方式提出相同问题以获得更深入的反思和理解。


    评估自我作者性的过程本身就可以是一种发展性活动（Baxter Magolda & King, 2007）。在评估 IAP 时，我们也在评估学生的学习、发展能力和意义建构。作为主管，我们关注学生工作人员的
    intentional 反思，以提高其发展能力和作为学习者的自我理解。我们在学生工作人员在职位中的整个经历期间、在与其职位相关的学术课程中，以及他们离职时的离职访谈中评估我们的学生工作人员，包括
    RAs 和 SOULs。


    ## 精妙运用理论的经验教训


    总体而言，根据我们的经验，与学生工作人员实施 IAP 对主管和学生双方都有回报。使用 IAP 的学生工作人员获得了对其发展历程和工作的更多所有权，为这些学生创造了明确的学习环境。对于主管而言，学生工作人员承担的额外所有权和责任减少了直接的持续监督。RAs
    和 SOULs 在面对适应性挑战时在各自的角色中有效，而这些挑战在这些角色中经常出现。


    IAP 需要时间来开发和实施，并且必须是鲜活的、呼吸的计划。因为举措和计划如此个性化，主管必须愿意将 IAP 作为员工动态的焦点，保持 IAP 在工作的最前沿。如果不重新审视和优先考虑，IAP
    就变得毫无意义。主管必须在一年中对变化和修改持开放态度。这与 LPM 如何与 IAP 保持一致的关键联系。在 LPM 中，意义是共同建构的，这意味着它必须灵活且适应性强，因为新的需求出现或学生准备迎接更大的挑战。如果主管坚持认为自己是知识的分配者，其被督导者必须在交易性关系中简单接收，那么发展的机会就有限。随着学生的成长和发展，以及环境事件影响学生的生活和对所处世界的理解，调整
    IAP 在学生工作人员任期内可能是有意义的。如果 RA 或 SOUL 认为某种方式可以让他们负责但实际上不行，也很重要进行更改。主管不应犹豫鼓励学生工作人员重新审视该计划，如果它无效的话。


    管理这种迭代的 IAP 过程增加了学生工作人员对其工作的所有权，而 IAP 必须高度依赖于、因此也是学生工作人员的责任。然而，需要注意的是，根据每个学生工作人员的发展能力和经验，学生在该过程中可能需要主管更多或更少的支持。不能期望所有学生工作人员都有独立完成此项任务的发展能力，主管应为每位员工提供适当的支持水平，以帮助建立健全且有意义的
    IAP。


    这种适当的支持可以采取不同的形式。Baxter Magolda 和 King（2007）建议主管必须为有效的访谈或对话提供时间、空间和鼓励。如果不为学生工作人员思考和反思提供时间和沉默，那么他们可能会缩短重要的处理时间。虽然有策略可以把这些对话作为发展性实践来开展，但要理解某人的发展能力，没有简单程序可循，而无需投入大量时间去理解他们如何建构意义。通过我们作为主管和访谈者的自身学习和成长，我们可以变得更有效，但这需要我们自身的反思和成长工作。


    ## 建议与资源


    ### IAPs 对校园整体推进至关重要


    继续利用 IAPs 通过使用 LPM 将自我作者性与学生工作人员督导联系起来存在重大机会。IAPs 可以扩展到包括大学校园内的整个部门或学生生活领域。为了获得最大益处，这需要整个组织承诺使用这种方法。


    ### 建立一套强有力的发展性问题


    无论其实施范围如何，拥有一个强有力发展性问题集对于学习伙伴关系都是有帮助的

