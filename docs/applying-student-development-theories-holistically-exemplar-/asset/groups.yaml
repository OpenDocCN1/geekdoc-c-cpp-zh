  mdcn: "\n![](img/c03cf8065037f42512bddd1febea4918_0_0.png)\n\n## 全面应用学生发展理论\n\n\
    ### 高等教育中的典范项目\n\n由 Katie Branch、Jeanne S. Hart-Steffes 和 Christine M. Wilson\
    \ 编辑\n\n## 全面应用学生发展理论\n\n本书深入探讨学生发展理论，解析大学学生发展的关键基础性理论和新兴理论，同时提供当代案例和应用。帮助有志于高等教育和学生事务实践的从业者整体把握并运用理论，这本重要的著作将理论知识付诸实践，以提升大学和学院学生的成长与学习。展示了在多种类型的机构中多样化的项目、实践和服务，*全面应用学生发展理论*\
    \ 展示了专业人士如何以多维度、整体的方式将理论的科学性与实践的艺术性相结合。\n\n**Katie Branch** 是美国罗德岛大学人类发展与家庭研究系的副教授。\n\
    \n**Jeanne S. Hart-Steffes** 是美国西部新英格兰大学学生事务副校长兼学生院长。\n\n**Christine M. Wilson**\
    \ 是美国康涅狄格大学学生事务助理副校长兼学生活动主任。\n\n## 全面应用学生发展理论\n\n### 高等教育中的典范项目\n\n**由**\n\n**Katie\
