    ## 有意的意外发现与位置性


    *有意的意外发现*是我们（即 Branch、Hart-Steffes 和 Wilson）为这本关于将理论应用于实践的书籍所考虑的备选书名之一。当我们回顾整个职业生涯中以多层次、整体性的方式运用大学生发展理论的经验时，我们惊讶于有多少“啊哈”时刻似乎如此机缘巧合。然而，若非我们强调理论运用的学术背景，这些时刻很可能不会发生。这种有意为之与有益偶然之间的悖论，描述了整体性运用大学生发展理论这门科学的艺术。本书的共同主编及许多撰稿作者，都曾被培养成
    Komives（1998）所谓的学者型实践者。虽然我们拥有在研究生教育及后续专业发展中所学理论的有效应用知识和倾向，但我们认识到这些应用的结果取决于众多因素——包括偶然性。有效应用理论所需的技能，在某种程度上是一门艺术。


    随着我们在高等教育领域的职业发展，我们得以进一步培养整体性应用学生发展理论的艺术，并强调学生成功的成果。这些成果包括学生学习与发展以及教育目标的实现（参见
    Kuh, [Branch] Douglas, Lund, & Ramin-Gyurnek, 1994）。2005年春季的一个日子，在马里兰大学公园市的一家小餐馆里，时任
    ACPA-College Student Educators International 候任主席的 Jeanne 与 ACPA 前任主席 Susan Komives
    会面，讨论如何参与和推动该专业发展的想法。Komives 建议，其中一个想法是编写一本针对《学习再思考：全校关注学生体验》（Keeling, 2004）的实用指南。正如
    Dungy（2006）所说，“这种对实用帮助的需求可以追溯到《学习再思考》最初的工作标题：《行动蓝图》。学生事务教育工作者认同这些概念；现在，他们想要实施这些建议”（p.
    2）。这成为出版《学习再思考2：实施全校关注学生体验的实用指南》（Keeling, 2006）的推动力。自该出版物问世以来，已有新一代新兴专业人士进入高等教育学生事务的研究与实践领域。


