    The funds are used to hire someone part time or support the fellow, as an honorarium
    for the fellow. The two staff members and fellows meet every other week.


    The Ethical Reasoning in Action program is unique in its campus-wide application
    at JMU. Educational interventions occur in the co-curriculum (e.g., student employee
    training, student leadership programs, career selection and preparation discussions,
    student-led workshops, student-conducted educational workshops, resident advisor
    training) and in the curriculum (e.g., general education courses, major and pre-professional
    courses, graduate and doctoral courses). Numerous faculty, staff, and students
    design and deliver interventions that target one or more learning outcomes.


    Bridging the gap between moral development theories and practice can be challenging.
    This is partly why the team that developed Ethical Reasoning in Action conceived
    of ethical reasoning as a *skill* that could be developed and practiced. Traditional
    lecturing on ethics codes or philosophical theory encourages complex thinking
    on an issue but does not necessarily develop skills to make ethical decisions.
    Through experiential learning activities, students connect with the content and
    process of ethical reasoning. Case scenarios serve as the primary experiential
    vehicle. Many case discussions utilize a circle process with a talking piece to
    encourage an open conversation for students to express their thoughts and challenge
    each other in a respectful way while using the 8KQ as a structure. Through these
    peer interactions, students may be challenged to look beyond the authorities that
    have dominated their worldview to see others as valid sources of information.


    Beyond the superficial connection of Gilligan (1982) to the empathy question or
    Kohlberg (1981) to the fairness question, the theories come alive when considering
    that students’ cognitive and moral development is spurred by ethical reasoning
    educational interventions. By asking the 8KQ, students’ self-focused thought processes
    are intentionally interrupted and challenged to produce “ah-ha” moments. They
    can be challenged to move forward in their moral development by bringing thoughts
    about others into their decision-making, and by being supported through fictional
    and real-life problems and ethical dilemmas. Following are five program-specific
    educational interventions.


    # ***Peer-to-Peer Workshops***


    A group of Ethical Reasoning in Action volunteer peer educators delivers interactive
    ethical reasoning workshops for other students,'
  - '[PAGE 106]


    <!-- no content -->'
  - '[PAGE 107]


    in moral development. A long-term partnership with the Orientation office makes
    *It''s Complicated* logistically possible and a repeated success.


    # ***Student Employee Hiring and Training in University Program Board***


    The hiring and training processes of the campus University Program Board include
    a focus on ethical reasoning. During an executive council group interview process,
    students are asked to use the 8KQ in a circle process to decide what to do in
    a scenario based on an incident the board faced regarding selection of a controversial
    movie to show on campus. Interviewers (staff and students currently in the role)
    observe which of the 8KQ interviewees reference in their answers, how well they
    interrogate their instincts, and how they work together to make decisions.


    Once students are hired, they engage in longer training using the 8KQ to analyze
    and make decisions about other ethical scenarios they may face in their roles,
    including organization membership issues and inappropriate performers. Throughout
    the year, the students use the 8KQ to debate a course of action when actual ethical
    scenarios arise.


    # ***Student Conduct Educational Workshops***


    As part of educational programming for minor student conduct offenses, the Office
    of Student Accountability and Restorative Practices staff members utilize the
    8KQ to help students examine their values and behaviors. In the *Values in Action*
    program, they discuss scenarios where two or more values were in conflict and
    use the 8KQ to make sense of that situation. Students are also asked to reflect
    on a personal ethical decision and how it might be different had they used the
    8KQ. Both activities support the overarching goal of helping students consider
    their own values before acting. In the *Calling the Shots* program, after students
    participate in discussions to establish the benefits and drawbacks of alcohol
    use, they ask the 8KQ to help them identify and consider the broader complexities
    in the decision whether to drink alcohol.


    The office also conducts both small- and large-scale restorative circles surrounding
    various issues of harm to the community. In reflection papers and group circle
    processes, students are asked to use the questions to consider the harms inflicted
    on others and what ways those may be effectively repaired.'
  - '[PAGE 108]


    Ideally, in all programmatic applications of 8KQ, students will retain the concepts
    of the 8KQ, making them more thoughtful community members, and be able to apply
    them to future situations.


    # Assessment and Evaluation


    As a campus-wide program, student learning assessment occurs at the institutional
    level using a longitudinal design: Time 1 assessment occurs the last day of first-year
    orientation and Time 2 assessments are administered in February of the sophomore
    year. Three assessment instruments were developed in collaboration with JMU’s
    Center for Assessment and Research Studies; these measure the five Student Learning
    Outcomes (SLOs). Assessment for specific educational activities is designed by
    individual faculty and student affairs professionals to measure the effectiveness
    of the specific educational interventions.


    Program assessment is centered on students’ ability to delineate among and apply
    the 8KQ concepts broadly, rather than an elusive evaluation of student “ethical
    behavior.” The Defining Issues Test-2 (Rest, Narvaez, Thomas, & Bebeau, 1999),
    the dominant tool for measuring moral development, is not used because it focuses
    too narrowly on justice-oriented moral judgment to be a fit for Ethical Reasoning
    in Action assessment needs. Essay assessment scoring rewards the recognition of
    an ethical situation, the broad (and accurate) application of Key Questions, an
    explanation of each KQ’s relevance or irrelevance to the decision, and the demonstration
    of weighing and balancing ethical considerations. The JMU Ethical Reasoning Rubric©
    (2014) provides parameters for assessment specific to 8KQ proficiency.


    Overall, ethical reasoning skills have improved since the program began, as indicated
    by a cross-sectional analysis comparing Fall 2012 baseline data collected prior
    to any ethical reasoning interventions to data collected in subsequent years where
    students have at a minimum experienced the It’s Complicated introductory program
    (Bashkov, Smith, Fulcher, & Hawk, 2014; JMU, 2016; Pyburn, Smith, & Ames, 2016;
    Smith, Fulcher, & Pyburn, 2015). However, longitudinal scores on the recall instrument,
    the Ethical Reasoning Recall Test (measuring SLO One) decline slightly or show
    no significant change between Time 1 and Time 2 as indicated in yearly assessment
    reports (Bashkov et al., 2014; Pyburn et al., 2016; Smith et al., 2015). We consider
    this to be, at'
