    # Implementation Specifics


    Now in its eighth semester, Tippie Buddies is a voluntary pairing program with
    multiple and varied touchpoints throughout the semester. The design strategy is
    guided by the intended developmental outcomes mentioned previously, with the overarching
    goal being the creation of a structure within which students have a strong chance
    of participating in meaning-making experiences.


    Students apply to the program through a simple on-line application, which collects
    information such as major, year in school, gender, hobbies, and personal adjectives
    (e.g., “How would your friends describe you?”). Following the application deadline
    at the end of the second week of the semester, the Assistant Director and Ambassadors
    create pairings based on students’ applications. Participants are notified of
    the name and email address of their buddy once pairings are complete. The following
    week, the pairs meet for the first time at a kick-off event, which is intended
    to be both social and informational in nature.


    For the remainder of the semester, buddies are connected to the program through
    structured events and incentives for independent meetings. Buddies are expected
    to meet at least five times per semester. Touchpoints include the following:'
