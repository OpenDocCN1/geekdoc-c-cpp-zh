    # RECOMMENDATIONS AND RESOURCES


    It is important to instill a nuanced understanding of the 8KQ and to ensure that
    students understand the larger concepts of each question, not just the key words
    or phrases as they are stated in the programs. To achieve these goals, we make
    the following recommendations.


    # Allot Significant Time for Development


    Thorough and non-confirmatory usage of the questions also requires significant
    time. When students analyze a scenario, allow plenty of time for self-interrogation;
    stretching their minds is a process. We encourage students to acknowledge an immediate
    reaction, set it aside, and ask questions in each of the ethical areas to develop
    this practice.


    # Offer Repeated 8KQ Application Opportunities


    Multiple interactions with the 8KQ allow students to develop the habit of asking
    questions as part of their decision-making and to recognize when ethical dilemmas
    arise. Using the 8KQ in groups is also an important developmental tool to expose
    students to diverse viewpoints and stimulate dissonance.


    # Explore Resources About the Program


    Resources available at the program’s website include the Eight Key Question Handbook
    (The Madison Collaborative, 2013) that explains each of the 8KQ, the JMU Ethical
    Reasoning Rubric© (2014) used to rate student assessment essays and understand
    what is considered proficient in ethical reasoning at JMU, and a link to request
    8KQ educational materials.


    As partners in planning and delivering It’s Complicated to incoming students,
    the office of Orientation hosts the website for students to access their pre-move-in
    assignment related to ethical reasoning. On this site, you may read the written
    version and view the video of the current case study used for the program. The
    detailed guide or script designed yearly for It’s Complicated facilitators is
    available upon request.'
