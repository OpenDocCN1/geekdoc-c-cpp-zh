    # Assessment and Evaluation


    The *Passport Report* is annually prepared by the IUPUI Office of Institutional
    Research and Academic Support to report prior ITISA student degree completion,
    GPA, and retention rates at IUPUI. For instance, ITISA students have consistently
    brought in more credits, on average, than IUPUI transfer students have from other
    institutions. ITISA has accounted for 40.7% of the incoming transfer credits in
    the 2016–2017 academic year and 35.5% for the Fall 2017 semester (Passport Office
    & IUPUI IRDS, 2017). By being informed of credits brought in by ITISA students,
    Passport can advocate for continuous coordination between ITISA and IUPUI to increase
    course articulations and the creation of 2 + 2 articulation agreements. The report
    dismisses myths regarding ITISA students’ preparedness to IUPUI. Data for the
    2016–2017 academic year shows that 77.7% of ITISA students who transferred to
    IUPUI as a junior or senior were retained into the following fall compared with
    the average of 76.5% of all external transfers entering as a junior or senior
    (Passport Office & IUPUI IRDS, 2017, p. 10).


    To better inform the office on their services and resource offerings, as well
    as how students perceived their pre-transfer environment experiences in relation
    to Schlossberg’s (1981) theory, Passport created an Academic Advising Survey,
    which provides constructive feedback to improve Passport’s pre-transfer advising.
    In Fall 2017, Passport surveyed prior ITSA students currently enrolled in IUPUI
    to capture data on their transfer experience. Of the responses received, 56% rated
    their overall transfer experience to IUPUI as “Very Satisfied” and 24% were “Satisfied”
    (Passport Office, personal communication, October 30, 2017). These results suggest
    that the efforts of the Passport Office align with reducing Schlossberg (1981)
    concern of a deficit situation—unstable within the new environment and student
    status (p. 6)—for ITSA students transitioning to IUPUI.


    # LESSONS FROM APPLYING THEORY ARTFULLY


    By intentionally applying student development theory and recent research, Passport
    has yielded success in addressing student transition via its various services,
    support, and resources to ITISA and IUPUI'
