    # LESSONS FROM APPLYING THEORY ARTFULLY


    Overall, in our experience, implementing IAPs with student staff is rewarding
    for both supervisors and students. Student staff members using IAPs are afforded
    more ownership for their developmental journey and work, creating an explicit
    learning environment for these students. For supervisors, the additional ownership
    and responsibility on the part of student staff created less direct constant oversight.
    RAs and SOULs were effective in their roles when faced with adaptive challenges,
    which occur often in these roles.


    IAPs take time to develop and implement and must be living, breathing plans. Because
    initiatives and plans are so personalized, supervisors must be open to making
    IAPs a focal point of the staff dynamic, keeping IAPs at the forefront of the
    work. IAPs become meaningless if they are not revisited and prioritized. Supervisors
    must be open to change and edits over the course of a year. This is a critical
    connection back to how the LPM aligns with IAPs. In the LPM, meaning is mutually
    constructed, which means that it must be flexible and adaptable as new needs emerge
    or a student is prepared for greater challenge. If a supervisor is tied to the
    idea that they are a distributor of knowledge that their supervisee must simply
    receive in a transactional relationship, then opportunities for development are
    limited. As students grow and develop, and as environmental events impact students’
    lives and understanding of the world they live in, it may make sense to adjust
    IAPs throughout the student staff member’s term. It is also important to make
    changes if something that the RA or SOUL thought would work to hold them accountable
