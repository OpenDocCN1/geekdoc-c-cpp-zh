    who devote substantial amounts of time and energy. Student learning and development,
    Astin states, is "directly proportionate to the quality and quantity of student
    involvement" (p. 519).


    # Cross and Phagen-Smith''s (2001) Model of Black Identity Development (Nigrescence)


    This six-sector model details the process of determining what it means to be Black
    and developing one''s Black identity. Sector 5, Adult Nigrescence, describes the
    trajectory of individuals'' perceptions of race as unimportant to the construction
    of an entirely new worldview in the context of theirs and others'' Black identity.
    The four stages are pre-encounter, encounter, immersion/emersion, and internalization/commitment.


    # Strayhorn''s (2012) Sense of Belonging


    According to Strayhorn (2012), sense of belonging refers to "students'' perceived
    social support on campus, a feeling or sensation of connectedness, the experience
    of mattering or feeling cared about, accepted, respected, valued by, and important
    to the group or others on campus" (p. 3). Strayhorn''s conceptual model consists
    of seven core elements: sense of belonging as a basic human need, a fundamental
    motive, sufficient to drive human behavior, sense of belonging takes on heightened
    importance in certain contexts, its relation to and consequence of mattering,
    social identities intersect and affect sense of belonging, its association with
    positive outcomes, and the necessity of a perpetual sense of belonging and likelihood
    of change as circumstances, conditions, and contexts change.


    # Phinney''s (1989, 1993) Model of Ethnic Identity Development


    This three-stage model captures the process of ethnic identity achievement. In
    the first stage, unexamined ethnic identity, students are described as being in
    one of two states: diffusion or foreclosure. Both states reflect unexplored personal
    feelings or attitudes, or interactions with individuals who share similar ethnic
    identity. The next stage, moratorium references an encounter that prompts ethnic
    identity exploration, while processing various emotions and reactions to information'
  - '[PAGE 29]


    gathered. In the final stage, identity achievement, individuals develop a positive
    bicultural identity—building awareness and appreciation for other ethnicities.


    # Perry''s (1970) Scheme of Intellectual and Ethical Development


    This theory describes how students move from simplistic, binary forms of, Gilligan
    proposed a theory that centered women''s moral development and reasoning. Similar
    to Kohlberg''s theory, the theory consists of three levels (orientation to individual
    survival, goodness as self-sacrifice, and the morality of nonviolence). Progression
    through levels is achieved via two transition stages (from selfishness to responsibility
    and from goodness to truth).


    # Kegan''s (1994) Theory of Evolution of Consciousness


    Kegan''s five orders of consciousness outline the "principles of mental organization
    that affect thinking, feeling, and relating to self and others" (Love & Guthrie,
    1999, p. 67). Each order contains intrapersonal and interpersonal dimensions that
    supplement the cognitive nature of the orders. Orders 0 to 1 are specific to young
    children (ages 0–2). Orders 2 to 5 are more relevant to the adult population we
    typically'
  - '[PAGE 30]


    serve on college campuses. They are Order 2: Instrument mind; Order 3: Socialized
    mind; Order 4: Self-authoring mind; and Order 5: Self-transforming mind.


    # Baxter Magolda’s (2001) Theory of Self-Authorship


    Self-authorship is defined as “the internal capacity to define one’s beliefs,
    identity, and social relations” (Evans et al., 2010). Baxter Magolda’s theory
    describes the epistemological development of young adults in connection with one’s
    sense of self and relationships with others. Three overarching questions are explored
    via the theory: How do I know? Who am I? How do I want to construct relationships
    with others? The journey to self-authorship is depicted by four phases that explain
    how individuals shift away from externally assigned values and belief systems
    to defining one’s own: following formulas, crossroads, becoming the author of
    one’s life, and internal foundation.


    # Schlossberg’s (1984) Transition Theory


    Life can sometimes throw curve balls that result in changed relationships, routines,
    and roles, (i.e., transition) and can be anticipated, unanticipated, or a nonevent.
    Schlossberg’s theory provides insight into how individuals interpret and cope
    with transitions. Effective coping is contingent upon one’s appraisal of resources
    in four areas (situation, self, support, and strategies) to facilitate the transition
    process of moving in, moving through, and moving out.


    # Kolb’s (1984) Experiential Learning Theory


    According to Kolb (1984), learning is defined as “the process whereby knowledge
    is created through the transformation of experience” (p. 38). The theory presents
    a four-stage cyclical learning process that “combines experience, perception,
    cognition, and behavior” (p. 21). The four stages are concrete experience, observation
    and reflection, forming abstract concepts, and testing in new situations.


    # TEMPLATE FOR SUBSEQUENT CHAPTERS


    For readability and the ability to compare across examples, the next nine chapters,
    which are written by contributing authors, are presented using a consistent template.
    Each chapter is organized around a framework that highlights contemporary perspectives
    of higher education'
  - '[PAGE 31]


    and student affairs practitioners on incorporating theory, models, and additional
    scholarship into their work. The template (i.e., order of information and perspectives
    provided in Chapters 2–10) is as follows:


    +   - Abstract

    +   - Brief introduction that sets the institutional and local context for the
    theory-in-practice application

    +   - Description of [name/identifying phrase for program or initiative]

    +     - Guiding theories

    +     - Implementation specifics

    +     - Assessment and evaluation

    +   - Lessons from applying theory artfully

    +   - Recommendations and resources

    +   - References


    The final chapter of the book, Chapter 11, does not follow this template. Rather,
    it summarizes data from the proposals submitted for this book and draws out thematic
    perspectives from lessons learned and recommendations made across contributing
    authors. Conclusions about applying student development theories in contemporary
    contexts that highlight the need for engagement by scholarly higher education
    and student affairs practitioners are offered. In addition, some cautions are
    noted about transferring theory use to multiple contexts and student populations.


    # IT IS NOT MAGIC


    Applying theories holistically to encourage college student development and learning,
    as Susan R. Komives points out in the Foreword, is not magic. Instead, it involves
    a confluence of often subtle, yet ever-changing scholarly knowledge and intentional
    practices—as if looking at vibrant images through a kaleidoscope. In the subsequent
    nine chapters, scholarly practitioners share their perspectives on the complexity
    of theory-in-practice work. The kaleidoscopic reflections and angles described
    demonstrate their expertise as engaged, scholarly higher education and student
    affairs practitioners.'
