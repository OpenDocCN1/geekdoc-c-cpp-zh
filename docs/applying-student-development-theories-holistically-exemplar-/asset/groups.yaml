    身体与动手能力：虽然导师小组的经历为参与者提供了发展人际交往能力的机会，但重点培养学生们身体和动手能力的，是挑战的*内容*。导师小组的挑战包括：一场介绍性的公告栏装饰比赛，评判标准是创意和向组员进行介绍的成功程度（宿舍小屋里有八块公告栏）；每日冒险挑战，包括高空绳索、低空绳索、滑索和湖上蹦床；为整个
