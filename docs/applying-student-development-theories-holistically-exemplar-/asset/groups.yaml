    ## 学生发展理论在实践中


    在高等教育标准促进委员会（Council for the Advancement of Standards in Higher Education）标准与指南（2015）中的政策等支持的推动下，以
    *大学如何影响学生*（Mayhew et al., 2016）为代表的研究成果，以及本书中呈现的学生发展理论，今天的学生事务教育工作者已应对了学生在教育中面临的诸多挑战。而且这并非魔法；我们正是因为这些干预措施所体现的理论基础，才理解它们为何以及如何发挥作用。


    我们仍面临着应对深层次且普遍的社会问题的挑战，如仇恨行为、种族主义、酒精和药物滥用以及性暴力。我们的学术研究有助于我们理解这些问题的根源，但将干预措施推广到规模化以实现成功解决仍然难以捉摸。希望读者能够迎接挑战，应对这些普遍而困难的问题。本书中的案例提供了来自其项目的经验教训，可以被利用或规模化，以应对复杂的议程。


    Branch、Hart-Steffes 和 Wilson 以及本书中的作者提供了明确将有用理论与有意设计的项目和实践相联系的案例，这些项目和实践能够实现期望的学生成果。每位读者都应在此停顿并反思自己对相关理论的个人知识、对相关研究的了解、将该学术成果应用于实践的技能，以及从实践中学习以重新设计项目的能力。每位专业人士都需要成长型思维（Dweck,
    2008），我们才能在这个过程中变得熟练。需要我们所有人分享良好的实践，才能推进任何一个人的工作。


    每位从业者/教育工作者必须采用一种专业身份，其中包含学者和从业者的某种组合。几年前，我写过关于专业取向连续体的内容（图 0.3；Komives, 1998）。


    许多工作人员是坚实的从业者。他们可能在行政技能方面娴熟，基于非正式理论和强有力的常识运作，但很大程度上缺乏理论且不受证据指导。将学术研究带入工作的从业者会寻求指导其实践的理论和研究。从业者-学者更认同学术研究，并善于将理论和研究应用于实践。学者-从业者以相关理论和证据为基础来支持或修改其项目。在最极端的情况下，学者通过发展理论、实践模式和开展原创研究而茁壮成长，向实践提出建议但不参与实践的设计或应用。所有读者都应在该连续体上定位自己的专业身份。我衷心希望该身份包括成为学者-从业者。


    ![](img/c03cf8065037f42512bddd1febea4918_11_0.png)


    *图 0.3* 专业取向连续体


    来源：Komives (1998)。经许可使用。


    学生发展应用并非魔法。它们以理论和相关研究为基础，确保它们能够促进大学经历中期望的结果。请继续分享您自己的良好实践，以及那些成效不佳的实践的经验教训，以推进这项专业工作。学生值得拥有。


