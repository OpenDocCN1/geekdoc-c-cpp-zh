    ## 西部第一代学生协会简介


    W1GS的想法源于本章的主要作者。因为我曾在学生活动中工作过，所以创建学生组织是解决未满足需求的熟悉流程。“最重要的是，FGS在开始大学生涯时需要有一个可去的地方，一个可以做自己的地方。找到一个可以去学习、与朋友闲逛的地方，通过直接解决从家庭空间到大学空间的过渡，加速了适应过程”（Davis,
