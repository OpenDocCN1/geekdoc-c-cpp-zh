    Of total enrollment, 17.8% identify with a minority group (University of Iowa
    Registrar, 2017a, d).


    The Tippie College of Business (“Tippie”) is one of 11 colleges at the University
    of Iowa. Undergraduate student enrollment in Tippie is 2,726. Of these, 1,730
    students are declared as Pre-Business. Of the total undergraduate enrollment in
    Tippie, 12.1% identify with a minority group (University of Iowa Registrar, 2017b,
    c).


    Tippie’s undergraduate enrollment includes 365 international students (13.4%).
    A further 309 international students are Pre-Business (17.9%). Of the international
    students enrolled in Tippie, 80.5% (294) are from China, 7.9% (29) are from South
    Korea, and the remaining 11.6% are from approximately 15 other countries (University
    of Iowa Registrar, 2017a, d). While the international student population more
    than doubled at the University of Iowa between 2007 and 2014, international undergraduate
    student enrollment grew by nearly 10 times at Tippie, reflecting a national trend
    in increased enrollment from international undergraduates pursuing business degrees
    (Institute of International Education, 2014).


    # DESCRIPTION OF TIPPIE BUDDIES


    In response to the rapid growth in international student enrollment, in 2012 the
    Undergraduate Program at Tippie created the position of Assistant Director of
    Global Community Engagement, with the goal of building greater community between
    domestic and international undergraduate students. In Fall 2013, the Assistant
    Director created and convened a new student group called the Global Engagement
    Student Advisory Board (GESAB), comprised of a balance of international and domestic
    students in Tippie. GESAB’s mandate was to create programming, raise awareness,
    and serve as an advocating body for cross-cultural interaction. GESAB members’
    first priority was to create a buddy program in Tippie.


    International Buddies at Tippie (Tippie Buddies) is the pairing program conceptualized
    by GESAB. Overseen by the Assistant Director and supported with two student assistants
    or Global Ambassadors (Ambassadors), the program matches international and domestic
    business students for a semester-long program to foster friendships across cultures
    and provide opportunity for reflection on racial and ethnic identity.'
