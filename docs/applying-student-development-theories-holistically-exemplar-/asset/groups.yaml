    ## 引言：发展理论作为示范性项目指南


    *Katie Branch 和 Monique N. Golden*


    高等教育环境（尤其是课外活动环境）中的学生成功，强调潜在的人类发展成果。指导理解这类成果的理论，为复杂的大学生发展轨迹提供了洞见。二十一世纪的大学生遭遇到无数的经历和挑战，要求我们在当代实践中整体运用理论，以促进他们沿着独特的发展道路前进。本章为整体运用大学生发展理论提供了理由，并描述了本书的写作动因。接下来，我们解释了收集本书所收录的当代理论实践范例的过程，并概述了后续章节中讨论的理论和模型。此外，我们概述了各撰稿作者分享视角时所用的模板。最后，我们提醒读者，整体运用理论并非魔术，而是常常微妙但不断变化的学术知识与有意识的实践的交汇——就像透过万花筒观看鲜活的图像一样。


    你职业上的“为什么”是什么？这个问题及其变体与 Simon Sinek 在2009年发表的激励性TED [技术、教育、设计] 演讲有关（见 https://startwithwhy.com/；Challenging,
    2017）。*《学生人事观点》*（美国教育委员会，1937）被誉为帮助美国确立大学生人事这一学科的文件，它呼吁重视学生的整体发展。近期的出版物也强调需要回应多种形式的成人发展，并继续采用多维度的知识应用方法（ACPA,
    1996; Keeling, 2004）。通过将研究与实践相融合，从而对人类发展和学习产生积极影响所实现的协同效应，往往是当今学生事务从业者的*存在的理由*（即，存在的缘由）。在对1937年至1999年间发表的13份学生事务哲学文件进行深入分析后，Evans
    和 Reason（2001）指出，其标志包括对学生的整体视角，以及对学生人事工作如何开展的整体视角。“在所有被审阅的陈述中发现的最普遍、最基础的概念是：必须在每一项教育工作中考虑‘完整’的学生”（第370页）。


    本书的首要前提是推动运用人类发展理论知识，以提升学生和社会参与高等教育的积极成果。正如 Kuh、Kinzie、Schuh、Whitt 及同事（2005/2010）所解释的，大学生成功不仅包括学业坚持和学业完成率，还包括学生学习的质量维度，其中包含发展。*《整体应用学生发展理论》*的目的是提供大学生发展理论综合应用的实例，尤其是由在课外职能领域工作的高等教育专业人员进行实施和评估的项目。由于本书选用的理论应用以二十一世纪大学生为参与者，多样性与社会正义是核心概念。在进入撰稿作者提供的示例之前，本章进一步解释了促使我们产生出版这本书愿望的原因，描述了征集和遴选来稿的流程，简要总结了后续章节中使用的理论，并提供了组织后九章的模板。


    ### 本书的必要性：为何是现在？


    一本阐释高等教育环境中学生发展理论整体应用的书籍，其需求来源多种多样。一个来源是我们作为教授大学生发展学术学分课程和非学分工作坊系列课程者的个人经历。修读学术课程的学生以及参加专业发展活动的人，常常会询问理论在当前实际实践场域中的运用范例。学生希望从那些正在运用所学知识的高等教育专业工作者那里获得启发；本书满足了这一需求。此外，旨在鼓励有意识地、整体地运用理论知识的专业员工发展举措，也可以通过考察该领域其他人的工作而受益。


    本书内容在此时此地的另一个动因是，我们不仅注意到研究生对大学生发展心理社会层面的持续兴趣，还注意到强调社会认同的出版物（例如，Jones & Abes, 2013;
    Patton, Renn, Guido, & Quaye, 2016）。虽然心理社会和社会认同理论及相关举措很重要，但它们并未完整涵盖全面、有效的专业实践所需的知识和范例范围。本书有助于将理论发展和应用的学术焦点重新校准到与高等教育教育使命密切一致的多维、整体方法上。


    ### 注意事项：理论覆盖的深度与滞后时间


    我们设想，本书内容将成为其他详述人类发展理论及配套研究的出版物的补充读物。理想情况下，学术实践者会关注并阅读发表在同行评审期刊和书籍中的研究者原创著作。然而，鉴于当今世界知识产生的数量和信息流动的速度，可以合理地假设许多学术实践者通过提供理论与相关研究分析性概述的出版物来保持跟进。例如，*《大学生发展：理论、研究与实践》*（Patton
    et al., 2016）就是一本在许多研究生层面的学生发展课程中用作主要教科书的著作。我们书中使用的理论与该著作中讨论的几个理论相契合；然而，我们内容的独特之处在于，它展示了实践者如何在他们当前的工作中使用这些理论、如何开展评估，以及以多维、整体方式应用人类发展理论的复杂性给我们带来了哪些启示。此外，我们还提供了在进行理论与实践之间转化工作时可使用的建议和资源。


