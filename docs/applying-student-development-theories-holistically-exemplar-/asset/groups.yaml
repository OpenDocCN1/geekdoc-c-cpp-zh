    # Guiding Theories


    Conception and continued development of Tippie Buddies are guided by Phinney''s
    (1993) model for ethnic identity development. Similar to Phinney''s definition,
    there should be a clear distinction between ethnic identity development and racial
    identity development. This can be a difficult task as the two are often conflated.
    This juxtaposition is further exacerbated by the persistent lack of differentiation
    between race and ethnicity in the United States and the claims of reaching a "postracial"
    era (Johnston-Guerrero, 2016). In operationalizing this model, we believe it is
    important to note that ethnic identity is defined with a critical, intersectional
    lens that acknowledges systems of power that affect students'' identities and
    how they navigate college life on campuses. In this sense, the program is designed
    to engage students from all backgrounds, including White students, in activities
    that require reflecting and sharing with others what it means to be a member of
    their respective ethnic groups.


    Phinney''s (1993) model operates in three stages:


    +   - Unexamined ethnic identity, whereby individuals have not explored their
    ethnicity in relation to self-identity

    +   - Ethnic identity search/moratorium, whereby encounters with difference (e.g.,
    overt discrimination/racism either toward self or others, minoritized group(s),
    situations that reveal privilege) cause greater awareness of the role ethnicity
    plays in one''s everyday life and the integration of such experiences with one''s
    own identity

    +   - Ethnic identity achievement, where resolutions of such experiences with
    difference coalesce with other aspects of self-identity to acceptance of one''s
    membership in his/her/their ethnic culture


    Individuals engage in processes that guide their understanding through each phase
    or status. Periods of exploration emerge when one learns about both positive and
    negative aspects of one''s own group and others. Moratorium can occur during the
    exploration process when one is uncertain about sense of belonging in the group
    and whether to fully identify as being associated with group members. Commitment
    is the process by which acceptance occurs and is typically associated with positive
    group attitudes.


    Phinney''s (1993) model is often used within the context of ethnic minorities
    but was adopted as Buddies'' guiding theory because it has'
