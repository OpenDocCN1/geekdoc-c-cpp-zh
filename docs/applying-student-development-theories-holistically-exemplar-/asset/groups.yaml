    第三个项目来自爱荷华大学，这是另一所大型公立大学。Jennifer A. Blair 和 Gordon S. Louie 运用 Jean Phinney（1993）的族群认同发展模型，创建了“*蒂皮伙伴*”，这是一个面向商学院学生的相互辅导项目。国际学生与国内学生（即美国公民或授权永久居民）配对，并在结构化活动和非正式场合中使用提示语来促进学生的成长。


    本部分的第四个也是最后一个项目实际上是一个学生社团。Sarah E. Schoper、Emily N. Davidson 和 Christine Nguyen
    与学生共同创建了“西方第一代大学生”（*WIGS*），他们利用 Jeff Davis（2010）在《*第一代大学生经历*》中阐述的诠释，来确定该学生组织的结构和活动。


    这些项目都成功帮助学生回答了那个重要的问题：**我是谁？**


    ## 提高保留率与发展能力的入学前静修营


    Kelly Carter Merrill


    “Launch”是弗吉尼亚州一所小型私立文理学院——伦道夫-梅肯学院——举办的入学前静修营。Launch 的设计以心理社会发展为重点，旨在提高该学院的学生保留率。这一总体目标通过四个预期发展目标得以实现：缓解新生的社会过渡、让他们做好迎接学业挑战的准备、鼓励对毅力的反思，以及创建一个重视并保护学生多样性的同伴社交社区。四个理论构念指导了
    Launch 的设计和课程：发展能力（Chickering & Reisser, 1993）、学生参与理论（Astin, 1999）、心态与毅力（Dweck,
    2012），以及微侵犯与多样性氛围（Sue, 2010）。


    伦道夫-梅肯学院（RMC）是位于弗吉尼亚州中部的一所小型（1,400名学生）、私立、择优录取的文理学院，生源以本地区为主（州内学生占73%）。这是一所住宿制学院，92%的一年级学生和80%的全体学生住校。RMC
    最初是一所男子学院，1830年创立，带有卫理公会使命。如今，该校女学生占53%（自1971年起实行男女同校），并且是持续办学的最古老的卫理公会相关学院（院校研究办公室，2017；SCHEV，2017）。该校的卡内基分类为“学士学院——文理类”，其体育联盟是老自治领体育联盟（ODAC），隶属于全国大学体育协会（NCAA）第三分区。


    伦道夫-梅肯学院三分之一的学生是运动员，近三分之一（29%）参加希腊字母社团。78%的学生认同为白人，8%为黑人，4%为西语裔/拉丁裔，4%为多种族，2%为亚裔美国人，4%为其他或未知。超过一半（55%）的学生获得基于需求的经济资助。六年毕业率为58%（院校研究办公室，2017；SCHEV，2017）。


    2010年，RMC 历年的平均大一到大二保留率约为75%，而在2015年*Launch*静修营之前的两年，该比率已升至77%（2013届）和78%（2014届）（SCHEV，2017）。2015年，RMC
    的教师、员工和管理人员将注意力转向解决新生的发展需求，*Launch* 便是为了继续提高保留率而构思的。


    ### LAUNCH 项目简介


    2015年和2016年的夏天，新生们受邀参加一个为期四天、入住前举办的静修营，名为“*Launch*”。共有68名学生参加（2015年28人，占新生班级的6%；2016年42人，占10%）。最初的邀请对象是有色人种学生、社区学院转学生和第一代大学生——这些学生在学院和大学中的保留率通常较低（国家学生信息交换中心研究，2017；国家学生信息交换中心研究，2012；Engle
    & Tinto, 2008）。


    希金斯学术中心的学生过渡事务主任负责管理“*Launch*”。该学术中心通过提供免费的学业辅导、导师指导和无障碍支持服务，帮助学生完成学业和社会过渡。学术中心拥有强大的高年级学生工作人员队伍，包括37名辅导员和36名导师，其中一些人兼任两职。辅导和导师项目均获得大学阅读与学习协会的认证；其成员须满足严格的国家级选拔和培训要求。*Launch*
    的学生导师从辅导员和导师团队中选拔，并接受了针对 *Launch* 发展目标的额外培训。


