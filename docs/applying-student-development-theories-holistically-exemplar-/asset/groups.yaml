    ## 评估与评价


    *Passport Report* 由 IUPUI 机构研究与决策支持办公室每年编制，用于报告先前 ITISA 学生在 IUPUI 的学位完成情况、GPA
    和保留率。例如，与来自其他院校的 IUPUI 转学生相比，ITISA 学生平均带入的学分一直更多。ITISA 在 2016–2017 学年占转入学分的 40.7%，2017
    年秋季学期占 35.5%（Passport Office & IUPUI IRDS, 2017）。通过了解 ITISA 学生带入的学分，Passport 可以倡导
    ITISA 与 IUPUI 之间持续协调，以增加课程衔接并创建 2+2 衔接协议。该报告驳斥了关于 ITISA 学生准备好进入 IUPUI 的迷思。2016–2017
    学年的数据显示，77.7% 以大三或大四身份转入 IUPUI 的 ITISA 学生被保留至下一学年秋季，而所有外部转学生以大三或大四身份进入的平均保留率为
    76.5%（Passport Office & IUPUI IRDS, 2017, p. 10）。


    为了更好地让办公室了解其服务和资源提供情况，以及学生如何根据 Schlossberg（1981）的理论看待其转学前环境体验，Passport 创建了学术咨询调查，该调查为改进
    Passport 的转学前咨询提供建设性反馈。2017 年秋季，Passport 对目前在 IUPUI 注册的先前 ITISA 学生进行了调查，以收集其转学体验数据。在收到的回复中，56%
    的人将整体转学至 IUPUI 的体验评为“非常满意”，24% 为“满意”（Passport Office, personal communication,
    October 30, 2017）。这些结果表明，Passport Office 的努力与减轻 Schlossberg（1981）对 ITISA 学生过渡到
    IUPUI 时的赤字状况担忧一致——在新环境和学生身份中不稳定（p. 6）。


    ## 精妙运用理论的经验教训


    通过有意应用学生发展理论和最新研究，Passport 在通过其各种服务、支持和资源解决传统学生群体的学生过渡方面取得了成功，这意味着强调从一所四年制院校过渡到另一所的学生。Schlossberg
    的工作也植根于成人发展理论，包括 18 岁及以上以及各种生活经历。然而，社区学院正在采用吸引高中生入学的项目，例如荣誉项目，其中可能有 18 岁以下的学生。此外，该理论没有考虑到学生的成熟度，无论年龄如何，都可能是成人的。Schlossberg
    转学理论的一个主要局限性是对交叉身份方面如何影响学生过渡缺乏关注。因此，转学理论可能无法为从业者提供全面的理解，关于我们在与日益多元的学生群体合作时遇到的各种障碍和考虑。


    ## 连接体问题


    在解决连接体问题时，我们常采用整体法与隔离法进行分析。整体法适用于求解外力或系统加速度，隔离法适用于求解物体间的相互作用力。


    **例1.** 如图所示，两个质量分别为 $m_1=2\,\text{kg}$、$m_2=3\,\text{kg}$ 的物体 A、B 叠放在光滑水平面上，用水平恒力
    $F=10\,\text{N}$ 拉物体 B。求 A、B 间的摩擦力大小。（已知 A、B 间动摩擦因数 $\mu=0.5$，$g=10\,\text{m/s}^2$）


    ![](img/c03cf8065037f42512bddd1febea4918_153_0.png)


    **解析：**

    先以整体为研究对象，由牛顿第二定律：

    $$F=(m_1+m_2)a$$

    代入数据得：

    $$a=\frac{F}{m_1+m_2}=\frac{10}{2+3}=2\,\text{m/s}^2$$

    再隔离物体 A，A 在水平方向只受摩擦力 $f$，由牛顿第二定律：

    $$f=m_1 a=2\times 2=4\,\text{N}$$


    因为 $f=4\,\text{N} < \mu m_1 g=10\,\text{N}$，所以 A、B 间摩擦力大小为 $4\,\text{N}$，二者未发生相对滑动。


    > 注意：当外力超过临界值时，物体间将发生相对滑动，此时摩擦力为滑动摩擦力 $f=\mu N$，且两物体加速度不再相同。


    - 整体法：适合求解系统加速度或外部作用力，不考虑系统内物体间的相互作用。

    - 隔离法：适合求解物体间的内力（如摩擦力、弹力），需对单个物体进行受力分析。


    Passport 无法完全确信转学生在预约或转学工作坊期间所分享内容的掌握程度，因为并非所有与 Passport 预约的学生都会回复 Passport 调查。此外，Passport
    目前没有调查来评估转学工作坊的有效性。这些是 Passport 发展并可能扩展对学生服务的两个机会。


    Passport 与转学研究建立了许多联系，例如 Flaga（2006）的过渡维度以及 Wyner 等人（2016）的 *The Transfer Playbook*。可以认为，Flaga（2006）研究的最后两个维度
    *negotiating* 和 *integrating* 可能与学生的转学后体验联系更紧密，而非 Passport 作为学生转学前资源的作用。Passport
    有机会与 IUPUI 的转学生服务办公室合作，探讨学生如何通过 Flaga（2006）的过渡维度进展，以及如何改进服务以帮助学生在转学前建立与 IUPUI
    的强烈联系感。


    ## 建议与资源


