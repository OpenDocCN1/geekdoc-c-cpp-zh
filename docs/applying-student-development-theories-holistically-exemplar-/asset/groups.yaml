    对转学生支持的坚定承诺至关重要。Passport 在 Ivy Tech 与 IUPUI 之间创建了众多举措，包括合作伙伴关系、Passport 转学指南、Passport
    新闻通讯、量身定制的校园参观、Ivy Tech 校园内的转学前咨询，以及衔接和课程协议。


