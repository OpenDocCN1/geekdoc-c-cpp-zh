    # Anna Randolph Lehnen


    earned her MA in College Student Personnel at Bowling Green State University.
    She currently works with the University Program Board at James Madison University,
    where she serves as the Student Affairs Fellow for the Ethical Reasoning in Action
    program. She has experience in student activities, leadership programs, and residence
    life. Her research interests include understanding the effects of campus programming,
    leadership development, and the connections between critical thinking development
    and co-curricular involvement. She presents frequently about leadership development
    programs and trainings for college students.


    # Sarah E. Schoper


    earned a PhD from the University of Maryland, and she is a faculty member in the
    College Student Personnel Program at Western Illinois University. Dr. Schoper
    was previously a practitioner at various institutions where she worked in leadership
    development, fraternity and sorority life, student activities, student government,
    student organization conduct, commuter life, and new student programs. Sarah’s
    research areas include promoting transformative learning within and outside the
    classroom, the development of emerging professionals, the experiences of first-generation
    college students, and the experiences of student affairs professionals with disabilities.
    Sarah regularly presents at a variety of student affairs conferences and consults
    with institutions and organizations regarding how to become more learning-centered.


