  - '[PAGE 110]


    content, involvement opportunities, and personal life. Anyone (at any university
    or organization) with a basic knowledge of the 8KQ can infuse them into their
    work with students or employees. This does not require expertise in ethics or
    psychology, or in cognitive or moral reasoning development theory to be able to
    help students grow. However, because of the flexibility and broad distribution
    of this program, implementation is not always consistent, which can affect learning
    and assessment.


    Ethical Reasoning in Action evolved from the university''s reaccreditation process,
    which requires the conception, funding, and implementation of a new idea focused
    on enhancing student learning (JMU, 2012). Because of this, we are at a significant
    advantage for an institution-wide implementation. However, one of the best things
    about this program is its scalability. Smaller-scope and audience-specific programs
    are created by staff motivated to develop students'' ethical reasoning abilities.
    The large scale of a program may be difficult to implement across a campus without
    institutional support, but it is entirely possible for an office or professional
    staff member to develop a program around this content. Aside from time and staffing,
    program costs are minor: copies of materials and writing utensils.


    One unintended outcome of the 8KQ framework relates back to application of the
    8KQ in a confirmatory (Haidt, 2001) rather than exploratory way, which can block
    growth. The questions should be used prior to making decisions rather than to
    describe what one has already done. This leads to a second caution: The 8KQ should
    not be used to judge or analyze someone else''s actions, but rather as a prompt
    for personal agency and responsibility for decision-making. While ethical reasoning
    can be used to understand another''s actions, it is a tool for forward thinking
    and acting.


    One significant lesson learned from implementation of this program is the limitation
    of students'' cognitive development over time. As practitioners, we look at theories
    as a map for students'' growth and know it is not always that straightforward,
    but implementation of a large-scale program like this emphasizes and makes real
    that limitation. We must ask ourselves: What can we actually expect students to
    be able to think and do? Upon graduation, some students will reach advanced levels
    of ethical reasoning, but many will not. Our hope is that by developing the habit
    of asking questions, the "plus one" nature of the program will continue to help
    them challenge their own quick thinking and provide repeated growth opportunities.'
