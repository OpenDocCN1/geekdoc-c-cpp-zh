    # Assessment and Evaluation


    Tippie Buddies is designed to engage students from all backgrounds with the intent
    for self-exploration and sharing with others what it means to be a member of their
    respective ethnic groups. In the next section, we described how these outcomes
    are assessed.


    # Assessment Through Post-Participation Surveys and Advisor Observations


    Feedback and insight from participants have informed the direction of the program
    since its inception. Assessment data for the Tippie Buddies program has primarily
    come from an anonymous post-participation “exit” survey made available to participants
    upon conclusion of the program. Survey items are open-ended and prompt students
    to articulate aspects of the program they felt went well and aspects that could
    be improved. Additionally, the survey invites participants to reflect on the benefits,
    if any, the program has provided. The overall response through the semesters has
    been positive. For example, of respondents to past surveys, given every semester
    since Spring 2014, 81% either agreed or strongly agreed with the statement, “The
    program helped reduce misunderstandings that my buddy and I had about each other’s
    cultures.” Data collected within that same time frame indicated more than 97%
    of respondents either agreed or strongly agreed with the statement, “I would recommend
    the Tippie Buddies program to a friend.”


    Assessment data is collected informally through individual advising meetings,
    where students often discuss and disclose both positive and negative experiences
    with the program openly. The dual role of the Assistant Director and colleagues
    as both coordinators of Tippie Buddies and undergraduate academic advisors proves
    useful when soliciting participant feedback. This allows the professional staff
    to gain deeper insight in one-on-one meetings to elaborate on trends that emerge
    from the exit survey, for instance.


