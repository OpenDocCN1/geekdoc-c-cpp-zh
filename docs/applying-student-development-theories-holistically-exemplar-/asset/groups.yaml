    ## 建立关系作为通往跨文化意识之路


    珍妮弗·A·布莱尔和高登·S·卢伊


    随着全国范围内国际学生（即美国F-1签证类别）入学人数的快速增长，爱荷华大学蒂皮商学院本科项目设立了一个专门负责开发和协调相关项目的职位。该职位的目标侧重于在学院内建立社区和促进文化意识。作为这些努力的一部分，创建了一个“伙伴”项目。国际学生和本土学生被配对进行为期一个学期的友谊互动。每对伙伴都获得以下支持：有组织的活动以获取文化知识并支持大群体互动；与当地企业合作以激励伙伴之间的一对一会面；以及一个安全且半结构化的环境，在其中进行与种族和族裔相关的困难但有反思性的对话。该项目已进入第八个学期，其创建和持续发展以
    Phinney（1993）的族裔身份发展模型为指导。该项目将处于该模型各个阶段的学生置于文化差异之中，旨在提供一个支持性环境，让他们进行互动、参与对话，并鼓励批判性自我反思，将项目内外的经历与他们的整体大学经历、职业抱负和个人目标联系起来。


    爱荷华大学是一所位于爱荷华州东部爱荷华城的公立研究型大学。爱荷华大学拥有33,564名学生和200多个学术研究领域，吸引了来自114个国家和美国50个州的学生。在2017年秋季入学的24,503名本科生中，57.7%（14,160人）来自爱荷华州，26%（6,382人）来自相邻各州，7.8%（1,899人）来自其他州和美国领地。其余8.4%（2,062人）来自外国。在总入学人数中，17.8%认同自己属于少数群体（爱荷华大学注册主任，2017a,
    d）。


    蒂皮商学院（“Tippie”）是爱荷华大学的11个学院之一。蒂皮学院的本科生注册人数为2,726人。其中，1,730名学生被认定为商科预科生。在蒂皮学院的本科生总数中，12.1%认同自己属于少数群体（爱荷华大学注册主任，2017b,
    c）。


    蒂皮学院的本科生注册包括365名国际学生（13.4%）。另有309名国际学生为商科预科生（17.9%）。在蒂皮学院入学的国际学生中，80.5%（294人）来自中国，7.9%（29人）来自韩国，其余11.6%来自大约15个其他国家（爱荷华大学注册主任，2017a,
    d）。虽然2007年至2014年间，爱荷华大学的国际学生人数增长了一倍多，但蒂皮学院的国际本科生注册人数却增长了近10倍，这反映出全国范围内攻读商科学位的国际本科生入学人数增加的趋势（国际教育协会，2014）。


    ## 蒂皮伙伴项目描述


    为了应对国际学生入学人数的快速增长，2012年，蒂皮学院本科项目设立了全球社区参与助理主任一职，旨在加强本土与国际本科生之间的社区建设。2013年秋季，助理主任创建并召集了一个新的学生组织，名为全球参与学生顾问委员会（GESAB），由蒂皮学院的国际学生和本土学生均衡组成。GESAB的任务是创建项目、提高意识，并作为跨文化互动的倡导机构。GESAB成员的首要任务是在蒂皮学院创建一个伙伴项目。


    蒂皮国际伙伴项目（Tippie Buddies）是GESAB构思的结对项目。该项目由助理主任监督，并得到两名学生助理或全球大使（Ambassadors）的支持，将国际和本土商科学生配对参加为期一学期的项目，以促进跨文化友谊，并提供反思种族和族裔身份的机会。


