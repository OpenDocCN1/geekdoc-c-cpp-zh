    *Susan R. Komives*\n\n我儿子是一名火箭科学家——真的！他从小就热爱飞机，画飞机，去史密森尼国家航空航天博物馆参观，在马里兰大学的风洞里做高中毕业项目，加入美国空军预备役军官训练队，最近还在明尼苏达大学获得航空工程博士学位。他现在是美国空军少校\
    \ Jeffrey R. Komives，USAF，PhD，在俄亥俄州赖特-帕特森空军基地的空军技术学院研究和教授高超音速技术。与此同时，我是他母亲，坐在装满数百人的大型飞机靠窗座位上起飞时想着，“这只是魔法。”\
    \ Jeff 给了我很多教训，我基本上理解升力和推力；然而，正如图 0.1（Boyd，2010）所示，我仍然暗自认为，“这架庞大的飞机起飞并保持飞行一定是魔法！”\n\
    \n从登机到降落之间，飞机如何起飞并保持飞行对我来说是神秘的黑箱（即未知之箱；图 0.2）。我并不完全了解那个箱子里发生了什么，但相信它能正常工作。幸运的是，对我和其他乘客来说，有像\
    \ Jeff 这样的专家，他们既知道它如何运作，又知道如何使其发生！他责备我，“妈妈，这不是魔法！”\n\n飞机如何飞行\n\n![](img/c03cf8065037f42512bddd1febea4918_8_0.png)\n\
    \n图 0.1 飞机如何飞行\n\n来源：www.lefthandedtoons.com/874/ 版权所有 2010。经许可转载。\n\n### 大学成果\n\
    \n多年前，我亲爱的朋友 Alexander 'Sandy' Astin 提出了他所称的介于学生投入（即他们是谁以及他们带来什么）与他们取得的大学成果之间的“黑箱”。Astin\
    \ 的大学影响模型，即投入-环境-产出，或 I-E-O（1993；见图 0.2），探讨了环境体验的影响，包括有意设计的教学实践，这些实践与学生投入的相关维度相互作用，从而导致期望的大学成果。\n\
    \n![](img/c03cf8065037f42512bddd1febea4918_8_1.png)\n\n图 0.2 Komives 的登机-魔法-飞行与\
    \ Astin 的投入-环境-产出（I-E-O）模型的联系\n\n正如本书许多章节所述，Astin（1993）使大学教育者意识到学生参与，即他们在具有发展力量的体验中花费的时间和精力，对实现这些期望成果至关重要。对\
    \ I-E-O 模型的改进当然也说明了投入对产出的直接影响，但本书的重点（以及飞机如何飞行的隐喻）最好以线性关系来理解。\n\n本书的读者都清楚，过去 30\
    \ 年来大学在建立和评估学习和发展成果方面所采取的重点。大学教育者因向学生、家庭、雇主和公众提供这些成果而承担责任。在过去几十年的有意学生事务实践中，教育者成功地解决了学生成功方面的众多复杂问题，如坚持、成就和发展认知复杂性。诸如《大学如何影响学生》第三版（Mayhew\
    \ et al., 2016）之类的汇编综合了对学生学习和发展产生影响的众多干预和参与，以及个人和群体差异对该过程的影响。\n\n在本书中，Katie Branch、Jeanne\
    \ S. Hart-Steffes 和 Christine M. Wilson 及其才华横溢的撰稿人展示了教育者如何通过有意地将理论和研究应用于环境为多元化学生提供的体验，从而塑造大学环境。基于对学生及其个人发展的了解，本书中的教育者使用了各种学生成功和发展理论以及关于环境因素的广泛研究，包括高影响力实践（Kuh，2008），以应对期望的成果。\n\
    \n### 高影响力教育实践\n\nGeorge Kuh 及其同事通过国家学生参与调查研究开展的研究确定了 10 项有助于学生学习和发展的 高影响力实践（HIPs）（Kuh,\
    \ Kinzie, Schuh, Whitt, & Associates, 2005）。由美国学院与大学协会推进（见 www.aacu.org/resources/high-impact-practices），这些具有发展力量的体验包括：\n\
    \n- 第一学年体验\n- 共同智力体验\n- 学习共同体\n- 重视写作的课程\n- 协作性作业和项目\n- 本科生研究\n- 多元化/全球学习\n- 服务学习、社区为本学习\n\
    - 实习\n- 毕业设计课程和项目\n\n对本书而言重要的是 Kuh（2008）归纳出的六个行为主题，这些主题支撑着那些产生其所体现影响的 HIPs。这些主题是：\n\
    \n- 投入时间和精力\n- 就实质性问题与教师和同伴互动\n- 体验多元化\n- 对更频繁的反馈做出回应\n- 反思和整合学习\n- 通过现实世界应用发现学习的关联性\n\
    \n教育者取得的进展的一个例子体现在我们自己在学生领导力发展的工作中。大学已将学生领导力理论（如领导力发展的社会变革模型 [SCM；Higher Education\
    \ Research Institute, 1996]）与相关的理论输入框架（如种族认同、领导力自我效能）相结合，并利用多机构领导力研究（MSL；见 www.leadershipstudy.net）的数据，该研究考察\
    \ SCM 和众多校园参与体验，以确定促进领导力能力成长的体验。众多校园环境实践，如让学生参与关于社会政治问题的讨论、指导、担任职位领导角色以及社区服务，都是发展领导力能力的高影响力实践（Dugan,\
    \ Kodama, Correia, & Associates, 2013）。结合对领导力身份发展（LID：见 Komives, Owen, Longerbeam,\
    \ Mainella, & Osteen, 2005）的理解，校园现在正在利用 MSL 研究等研究中确定的领导力 HIPs，对其领导力项目进行支架式搭建，以构建发展复杂性。\n"
