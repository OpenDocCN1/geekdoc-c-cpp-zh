    (in Evans, Forney, Guido, Patton, & Renn, 2010). Kohlberg 的 (1981) *道德发展阶段* 增进了我们对道德发展如何发生以及哪些思想/行为/选择表明发展阶段间的移动的理解，尤其是当推理者以正义和自主的眼光看待时
    (in Evans et al., 2010; in Gilligan, 1982). Gilligan 的 (1982) 基于关系的“关怀伦理”工作拓宽了我们的视野，使其在推理时纳入关怀（共情）和责任的声音。重要的是，在推理时提出
    8KQ 的前提，Gilligan 认识到一种声音可能在某人的思维中占主导，“both ‘justice’ and ‘care’ voices are inherent
    in the life cycle, constituting alternative grounds on which to evaluate the moral”
    (Pascarella & Terenzini, 2005, p. 44).


    在 Perry 的 (1970) 认知发展框架中，许多入学的传统年龄大学生是 *二元论* 思维者，他们以简单的对错概念来构想伦理及其他决策，或将父母/权威人物视为拥有答案的个体
    (Pascarella & Terenzini, 2005). 随着学生在大学学习新的探究方法，他们进入 *多元性* 阶段，在此阶段同伴成为有效的信息来源，他们将多种思想和观点视为正确或对的，并且不加以区分以确定哪一个最真实。
    随着认知能力的持续增长，学生能够评估信息以区分谁是有效权威并据此构建论证，称为 *相对主义*。 最终，Perry (1970) 提出学生将进入 *相对主义中的承诺*，在周围世界的情境中做出决策。


    如同 Perry (1970)，Kohlberg (1981) 和 Gilligan 的 (1982) 发展模型为 Ethical Reasoning in
    Action 提供了依据。两位理论家概述了学生在不同阶段如何做出伦理决策。 在两个模型的初始阶段，*前习俗* (Kohlberg, 1981) 和 *个体生存取向*
    (Gilligan, 1982)，学生做出以自我为中心的决策：最大限度地减少对自身的伤害、避免惩罚以及满足个人欲望或需求 (Evans et al., 2010;
    Pascarella & Terenzini, 2005). 随着学生开始看到他人在伦理情境中扮演的角色并考虑决策如何影响他人，他们进入各自模型中的下一个阶段，*社会成员*
    和 *善良即自我牺牲*。他人变得极其重要


    随着学生在智力和道德能力上的成长，他们可能会更广泛地参与 8KQ，并假设性地从以自我为中心的世界观逐步转向更具包容性的世界观，反映了从 SLO One and
    Two 到 SLO Three 的转变。 例如，对公平问题的肤浅、以自我为中心的运用，“*How can I act equitably and balance
    all interests,*” 可能会认为对某种物品进行平等分配，最好有利于决策者。 而，善良即自我牺牲 (Gilligan) 或习俗 (Kohlberg)
    对公平问题的运用会引发关于正义分配或对所有相关人员公平实践的问题。 正如 Gilligan (1982) 所指出的，这一阶段可能以自我牺牲为代表，摆向以自我为中心钟摆的另一端，导致暂时放弃对自身的关怀。


    SLO Three 最密切地反映了多元性、社会成员以及善良即自我牺牲/从善良到真理的中期发展阶段的进步。 在这些阶段，思考者质疑权威的合法性，同伴可能在决策中变得相关。
    具备将自己视为决策者的能力，学生可以深入理解并将关键问题应用于情境。 他们可以挑战自己的思维当答案对这些问题冲突时，提供认知失调。


    同样，转向 Kohlberg 的 (1981) 后习俗阶段应反映对公平的进一步细致理解，例如，可能通过在保持共情方法的同时现实地平衡多种不平等，或旨在在可能包括或不包括自我的多个群体之间创造正义来体现。
