    likelihood to experience a “*deficit situation*” within the adaptation process,
    which is an unstable transitional state within the new environment (Schlossberg,
    1981). Transition theory research was continued and extended by introducing coping
    factors known as the *4 S’s*: situation, self, support, and strategies (Schlossberg
    et al., 1995). Passport enhanced its pre-transfer advising to address Schlossberg,
    Waters, and Goodman’s situation coping variable within the *4 S’s* framework.
    The situational factors that produce a positive outcome of transition adaptation
    include role change, affect, source, timing, onset, and duration (Schlossberg,
    1981). Passport utilizes transition theory in supporting ITISA students via pre-transfer
    advising as well as developing transfer resources and services to further assist
    these students.


    Chickering and Reisser’s (1993) initial two vectors of *developing competence*
    and *managing emotions* also have been core influences with which Passport designed
    and evolved its programming and resources. The *developing competence* vector
    can be divided into three prongs: intellectual, physical, and interpersonal competence.
    Intellectual competence involves expanding one’s skills to understand and interpret
    information as well as acquiring a thorough understanding of the content presented
    (Chickering & Reisser, 1993). Interpersonal competence involves taking in information
    and effectively communicating with others (Chickering & Reisser, 1993). The *managing
    emotions* vector involves students recognizing the triggers that may influence
    their emotions and effectively coping with such situations in suitable ways (Chickering
    & Reisser, 1993).


    To supplement the works of Schlossberg (1981, 1984; Schlossberg et al., 1995)
    and Chickering and Reisser (1993), Passport applies practical connections from
    recent research. Flaga’s (2006) study on the process of community college transfer
    guides Passport’s services and programming through the following dimensions of
    transfer transition: *Learning Resources*, *Connecting*, and *Familiarity*. *Learning
    Resources* focuses on the ways students collect information through the three
    types of learning (i.e., formal, informal, and initiative) to help them understand
    campus resources and culture (Flaga, 2006). Information and resources shared with
    students during a pre-transfer advising appointment is an example of formal learning:
    information learned from campus staff and through campus programming (Flaga, 2006).
    *Connecting* focuses on the ways students create relationships with those who
    play a role within the student’s academic, social, and physical contexts (Flaga,
    2006). *Familiarity* focuses on how at ease students feel after'
