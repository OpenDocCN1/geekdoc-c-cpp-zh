    36 mentors, several of whom hold both positions. Both the tutoring and mentoring
    programs are certified by the College Reading and Learning Association; the staff
    members meet rigorous national selection and training requirements. *Launch* student
    mentors were selected from the tutor and mentor staff, and received additional
    training specific to *Launch*’s developmental goals.


