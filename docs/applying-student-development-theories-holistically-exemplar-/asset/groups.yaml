    在适应过程中，经历“*匮乏状况*”的可能性，这是新环境中的一种不稳定过渡状态（Schlossberg, 1981）。过渡理论的研究通过引入被称为“*4S*”的应对因素而得到延续和扩展：情境、自我、支持与策略（Schlossberg
    et al., 1995）。Passport 增强了其转学前的咨询服务，以应对 Schlossberg、Waters 和 Goodman 在“*4S*”框架中提出的情境应对变量。能够促成积极过渡适应结果的情境因素包括角色变化、情感、来源、时机、发生方式和持续时间（Schlossberg,
    1981）。Passport 运用过渡理论，通过转学前的咨询服务来支持 ITISA 学生，并开发转学资源和相关服务以进一步帮助这些学生。


    Chickering 和 Reisser（1993）提出的前两个向量——“*能力发展*”和“*情绪管理*”——也是 Passport 设计和优化其项目与资源的核心影响因素。“*能力发展*”向量可分为三个分支：智力能力、身体能力和人际能力。智力能力涉及扩展个人技能以理解和解读信息，并深入掌握所呈现的内容（Chickering
    & Reisser, 1993）。人际能力涉及获取信息并有效与他人沟通（Chickering & Reisser, 1993）。“*情绪管理*”向量则涉及学生识别可能影响自身情绪的触发因素，并以恰当的方式有效应对此类情况（Chickering
    & Reisser, 1993）。


    为了补充 Schlossberg（1981，1984；Schlossberg et al., 1995）以及 Chickering 和 Reisser（1993）的研究，Passport
    将近期研究中的实际联系应用于实践。Flaga（2006）关于社区大学转学过程的研究，通过以下转学过渡维度指导了 Passport 的服务与项目：*学习资源*、*建立联系*和*熟悉感*。*学习资源*侧重于学生通过三种学习方式（即正式学习、非正式学习和主动学习）收集信息，以帮助他们理解校园资源和文化的途径（Flaga,
    2006）。在转学前的咨询预约中与学生分享的信息和资源就是正式学习的例子：即通过校园工作人员和校园项目获得的信息（Flaga, 2006）。*建立联系*侧重于学生如何与那些在学业、社交和物理环境中发挥作用的人员建立关系（Flaga,
    2006）。*熟悉感*侧重于学生在校园参观后、与本校专业相关的 IUPUI 顾问联系后、参加在 ITISA 校园举办的 IUPUI 转学工作坊后，以及通过参加符合自身兴趣参与度的活动而融入
    IUPUI 学生文化后所感受到的自在程度。结合 Flaga（2006）在转学过程中提出的“*建立联系*”维度，Passport 努力通过建议学生访问校园、与教师和工作人员会面以及参与
    IUPUI 社交活动，帮助学生感受到与 IUPUI 社区的紧密联系。


    Passport 顾问还在靠近 IUPUI 校区的 ITISA 学术咨询中心内设有办公空间，每周四天在此进行咨询。Wyner 等人（2016）建议，“在合作院校建立可见的存在是另一项高回报的投资”（第
    9 页）。通过在 ITISA 设立驻点，Passport 能够在学生的本校区为他们提供转学咨询，为顾问提供内部支持以解答有关 IUPUI 课程或招生流程的问题，并参加
    ITISA 每周的咨询人员会议以获取最新动态。


    此外，Passport 每年与 IUPUI 和 ITISA 的学术部门举行会议，以了解课程变化和最佳的学生咨询策略。Flaga（2006）建议，暑期在两个院校进行学术部门访问是维持顾问之间关系的关键。Passport
    随后将信息汇编成通讯，与 ITISA 和 IUPUI 的教职员工分享，以保持院校之间的沟通。通讯的重点内容包括 ITISA 和 IUPUI 学术部门的更新以及按专业划分的课程转学政策。


    Passport 发现，在转学前的咨询工作中，校外咨询对于服务庞大的、对 IUPUI 感兴趣的 ITISA 学生群体至关重要。除了北梅里迪安校区（这是 Ivy
    Tech 最大的校区，距离 IUPUI 仅三英里）之外，Passport 还在其他四个 ITISA 地点提供咨询服务。Passport 还扩大了其内部咨询日的覆盖面，服务于
    ITISA 的学习社区。诸如 TRiO、Nina/Bowen 学者、21 世纪学者、Phi Theta Kappa 荣誉学会以及 ITISA 中的男性赋权计划等学习社区，允许
    Passport 顾问每学期在其项目套件内安排预约。这些合作积极促进了这些项目内部的转学文化，并鼓励联合咨询。


    为了支持 Schlossberg（1981）所指出的“转学前与转学后环境的特征”，内部咨询通过 Passport 为 IUPUI（*转学后环境*）和 ITISA
    学习社区（*转学前环境*）提供了机会，使学生获得积极、协调的机构性转学支持。Wyner 等人（2016，第 29–40 页）也证实了《转学手册》中的三项策略对学生的成功至关重要，这些策略包括量身定制转学咨询以讨论专业探索，例如举办内部互动活动。


    ## 过渡性项目、顾问培训与资源


    过渡性项目、顾问培训和 Passport 资源均由 Passport 的助理主任根据 ITISA 和 IUPUI 学生、教师、工作人员及管理人员的需求而开发。助理主任负责监督两份资源的汇编与分发：通讯（如前所述）和《Passport
    转学指南》。《Passport 转学指南》的关键主题包括学生可获得的转学选项、IUPUI 录取要求、申请截止日期和奖学金。


    通过学生轶事和与学生日常咨询互动，一些学生对转学过程的复杂性表达了沮丧。这些轶事表明，学生在处理转学过程时可能会体验到复杂的情绪，这可能表明一些学生仍在发展
    Chickering 和 Reisser（1993）七向量中的“情绪管理”向量。Passport 创建了《Passport 转学指南》，作为一份简洁的资源来应对转学过程的主要组成部分，从而尽可能使学生的过渡顺利而简单，以此减轻学生的挫败感。


    Schlossberg 等人（1995）确定的应对变量也在 Passport 的资源中得到了体现。《Passport 转学指南》通过“为转学搭台”提供了转学旅程的渐进式开端。该指南的整体基调鼓励学生关注转学到
    IUPUI 的积极情感，并将学生重新确立为引导自身过渡的内在动力来源。


    在整个秋季和春季学期，Passport 会访问 ITISA 的“大学转学学生成功”课程（如 IVYT 111）和顶点课程，与学生分享 IUPUI 的转学信息。由于这些课程在
    ITISA 各处有多种授课形式，Passport 为教师提供了现场演示或带配音的信息图 Microsoft PowerPoint 演示两种选择。这些演示可能成为学生与
    Passport 的首次接触点。由此建立起的联系使学生主动寻求 Passport 的咨询服务，并参加旨在帮助其过渡的补充活动。


