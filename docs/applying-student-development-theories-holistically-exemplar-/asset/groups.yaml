    ## 学生工作人员的自我主导与批判实践


    *切尔西·富勒顿和斯科特·伯登*


    本章介绍了一个课程框架，该框架将自我主导和批判实践的要素融入学习伙伴模型（LPM；Baxter Magolda，2004）中，该模型用于一个女同性恋、男同性恋、双性恋、跨性别、酷儿/质疑、间性人、无性恋+（LGBTQIA+）中心的本科学生工作人员。所利用的学生发展理论是Baxter
    Magolda（1999）的自我主导发展过程。此外，该框架利用了Crenshaw（1989）和May（2015）对交叉性的定义和描述，以支持超越单一轴思维、转向更复杂思维方式的前提。为补充这些理论，专业工作人员开发了就业能力特质评分表，该评分表与自我反思、主管评估和全面审查过程一起，促进自我主导。


