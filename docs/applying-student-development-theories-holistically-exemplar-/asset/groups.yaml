  - '[PAGE 181]


    learners’ capacity to know, situating learning in the learner’s experience, and
    defining learning as mutually constructing meaning. For challenge, the LPM includes
    portraying knowledge as complex and socially constructed (internal belief system),
    acknowledges self as central to knowledge construction (internal identity), and
    shares authority and expertise (mutual relationships). The direct alignment of
    the LPM with self-authorship theory appeared highly useful for practitioners.


    # Some Cautions or Reminders


    While the contributing authors in this book might make applying student development
    theories seem “easy,” none used this adjective—or the adverb “easily”—to describe
    their work. Rather, practitioners shared perspectives that highlighted complex
    and contextual decisions. Applying student development theories holistically was
    a blend of science with art. Readers need to keep in mind that the examples provided
    in this book are not for wholesale or ready transfer to their own institutions
    of higher education; there are no recipes for easy replication. There are ideas,
    however, for consideration, reflection, and discussion that can jumpstart transferability.


    While the number of adult development theories used by higher education and student
    affairs professionals has grown tremendously, readers need to keep in mind that
    much of this scholarship has been conducted in the United States. With globalization
    of student affairs *practices* (see Mikk & Steglitz, 2017), it may be tempting
    to overlook the socio-historic context in which these *theories* came into existence.
    Knowing such information does not mean using these theories with students from
    other parts of the world lacks efficacy but caution needs to be exercised about
    theory relevancy in intercultural contexts.


    Additional caveats include being mindful of the changing nature of language, which
    shifts interpretations of theoretical terms (e.g., intersectionality; see Bartlett,
    2017), and the need to use theories from multiple academic disciplines (e.g.,
    counseling, management) to boost outcomes. Finally, while this book provides examples
    of theories applied at the programmatic level, it is important to remember that
    much work of higher education and student affairs professionals takes place on
    a daily basis with individual students. The application of student development
    and learning theories with each student encountered can be just as meaningful.'
