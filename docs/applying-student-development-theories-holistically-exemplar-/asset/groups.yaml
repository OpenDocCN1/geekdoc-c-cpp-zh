    在考察理论的应用时，从促成理论的研究、理论在同行评审出版物中的发表、提出修正原理论的研究，到理论的实际应用，这之间的滞后时间往往显而易见。这种滞后带来的一个结果是，有必要审视理论的社会历史背景，以及它们在当代实践中被使用的时间、方式和原因。例如，传统上，基于心理学的发展理论将*整体性*理解为自我中面向个体的方面，以及理解世界的内部方式。尽管有强调情境影响的补充理论，但这种解释可能低估了一个影响人类如何驾驭和互动其周围世界的社会生态维度。我们宽泛地将这一社会生态维度定义为各种力量（如文化、权力、刻板印象、社会规范、规则）之间的相互作用，这些力量决定了一个人的位置性，而位置性受地方、国家和全球背景的影响。社会生态维度为“整体性学生发展”的含义增加了相当大的复杂性，后者通常被表述为支持“完整的学生”（Evans,
    Forney, Guido-DiBrito, Patton, & Renn, 2010）。在缺乏社会生态维度的情况下支持完整学生，是一种不完整、不充分的做法。因此，如果未能或拒绝承认权力与特权会影响学生的自我意识以及他们对整个社会的解读，就不可能实现真正的整体性学生发展。批判种族理论（Ladson-Billings
    & Tate, 1995）和交叉性（Crenshaw, 1989；参见 Bartlett, 2017; Tefera, Powers, & Fischman,
    2018）等学术成果帮助我们审视制度体系如何将权力与特权赋予某些群体，使主流意识形态长期存在，并促成对个人、声音和经验的抹除。阿贝斯（2016）出版的*《学生发展理论中的关键问题》*旨在帮助学术型实践者理解这些复杂概念。


    最后，理论概念的某些较新方面太过新近，除了用于发表新兴理论或后续应用这些知识的研究外，尚无更多研究。例如，将神经科学方面的学术工作纳入学生事务实践的做法尚未广泛普及（参见
    Blimling, 2013; Bresciani Ludvik, 2016; Kartoshkina, 2017; Schwitzer, 2015）。正如埃夫拉尔、安内塞和布雷夏尼·卢德维克（2016）所言，“对大脑的迷恋无处不在，因此现在确实是有意将神经科学发现纳入高等教育的设计、实施和评估的时候了”（第
    27 页）。


    ## 收集理论实践案例的流程


    本书的联合编辑从不同作者群体中招募并遴选了稿件，这些作者代表了多种高等教育背景。我们收到了来自学术型实践者（scholarly practitioners）的各种投稿，所谓学术型实践者是指那些以理论和研究为基础开展工作、但不常在研究期刊上发表成果的人。撰稿人的知识和专长对于实现本书宣示的目标至关重要。在征集本书投稿提案的过程中，联合编辑特意联系了个人和各类论坛，以期发现更新的想法。在征稿过程中，我们向专业协会的邮件列表、教师以及不同类型高等教育机构中其他高等教育和学生事务领导者发送了信息，也联系了最近在两大学生事务伞式组织（即
    ACPA：学生事务教育者国际协会与 NASPA：高等教育学生事务管理者协会）年度聚会上就学生发展理论相关主题做过报告的个人。


    在我们的*征稿启事*中，联合编辑请潜在撰稿人分享其项目、实践或其他当代应用大学生发展理论的举措；机构背景，包括学生群体的社会人口构成；项目、实践或举措的具体情况；预期的发展和学习成果；评估与评价；以及关于理论与实践联系的经验教训。同时说明，被选入本书的稿件将重点涉及以下列出的一个或多个理论或模型，或者可以联系联合编辑提出其他建议。


    -   对于心理社会与社会认同：奇克林与赖瑟（认同：大学影响）、克罗斯与法根-史密斯（黑人性、黑人认同）、赫尔姆斯（白人种族身份状态）、菲尼（少数族裔认同）、金（亚裔美国人认同）、托雷斯（拉丁裔认同）、鲁特（多种族血统）、卡斯（同性恋认同——以男性为重点）、法辛格（男同性恋、女同性恋认同）、德奥杰利（女同性恋、男同性恋、双性恋认同）、沃辛顿等人（异性恋认同）、贝姆或莱夫（性别认同与角色）、吉布森或福伯-普拉特与阿拉贡（残障学生）、赫斯特或奥斯特罗夫（社会阶层）、以及戴维斯（第一代大学生身份）。

    -   对于认知发展：佩里（一般智力推理）、贝伦基等人（*女性的认知方式*）、巴克斯特·马戈尔达（认识论反思）、基奇纳与金（反思判断）、科尔伯格或雷斯特（道德——公正声音）、吉利根（道德——关怀声音）、福勒（信仰）、帕克斯（精神性、意义建构）、以及巴克斯特·马戈尔达（自我创作）。

    -   对于发展影响：布朗芬布伦纳（发展生态学）、施洛斯伯格（过渡）、科尔布（体验式学习）、荣格或迈尔斯与布里格斯（人格类型）、克利夫顿与安德森（人格优势）、塞德拉塞克（非认知变量）、以及斯特雷霍恩（归属感）。


    ## 理论集群


    为了最大限度地发挥本书的效用，我们将理论实践案例组织为三个部分或理论集群，这些集群与学生事务文献有着历史渊源：心理社会、认知和发展影响（Evans, Forney,
    & Guido-DiBrito, 1998; Mayhew, Rockenbach, Bowman, Seifert, & Wolniak, 2016）。每个集群在相关章节中代表一种发展重点，涵盖所服务的学生群体，并使用前文列出的一个或多个理论、模型或框架。例如，第一部分的章节被赋予“我是谁？：心理社会与社会认同发展”的集群标签。四个相关章节中描述的项目和举措所服务的群体包括新生、第一代大学生、国际学生、有色人种学生和黑人男性。用于指导实践的核心学术成果包括奇克林与赖瑟的认同发展理论、阿斯丁的学生参与理论、克罗斯与法根-史密斯的黑人认同发展模型、斯特雷霍恩的归属感理论以及菲尼的族裔认同发展模型。表
    1.1 总结了每个理论集群、所服务的群体和核心学术成果。随后，提供了各章撰稿人所用理论或模型的概述。


    **表 1.1** 理论集群、所服务群体与核心学术成果


    | 理论集群 | 所服务群体 | 核心学术成果 |

    |---|---|---|

    | **我是谁？：**<br>心理社会与社会认同发展 | 新生、第一代大学生、国际学生、有色人种学生和黑人男性 | • 奇克林与赖瑟的认同发展理论<br>•
    阿斯丁的学生参与理论<br>• 克罗斯与法根-史密斯的黑人认同发展模型<br>• 斯特雷霍恩的归属感理论<br>• 菲尼的族裔认同发展模型 |

    | **我如何构建意义？：**<br>认知发展 | 学生雇员及全校学生 | • 佩里的智识与道德发展图式<br>• 科尔伯格的道德发展理论<br>• 吉利根的妇女道德发展理论<br>•
    基根的意识演化理论<br>• 巴克斯特·马戈尔达的自我创作理论<br>• 施洛斯伯格的过渡理论 |

    | **发展影响** | 社区学院学生和住宿学生 | • 奇克林与赖瑟的认同发展理论<br>• 科尔布的体验式学习理论 |


    ## 理论或模型概述（按出现顺序）


    ### 奇克林与赖瑟（1993）的认同发展理论（“七向量”）


    该理论基于这样的假设：学生认同发展的过程是复杂的，本质上不一定是线性的，而且是流动的。此外，奇克林与赖瑟强调制度环境是影响认同发展的一个因素。该理论以七个向量的形式呈现，描述了学生如何在心理社会层面发展：发展能力、管理情绪、从自主走向相互依赖、建立成熟的人际关系、确立认同、发展目标、发展诚信。


    ### 阿斯丁（1999）的学生参与理论


    阿斯丁（1999）将学生参与定义为“学生投入到学业中的生理和心理能量的总量”。


