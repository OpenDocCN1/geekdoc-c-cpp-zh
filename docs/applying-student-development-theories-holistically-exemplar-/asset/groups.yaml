  mdcn: "\n\n经验\"（第518页）。根据 Astin 的观点，学生参与度可以被概念化为一个连续体，从未参与的学生（他们将最少的时间和精力投入到学术和课外活动中）到高度参与的学生（他们投入大量的时间和精力）。Astin\
    \ 指出，学生的学习和发展\"与学生参与的质量和数量成正比\"（第519页）。\n\n## Cross 和 Fhagen-Smith（2001）的黑人身份发展模型（Nigrescence）\n\
    \n这个六部分模型详细描述了确定作为黑人意味着什么以及发展个人黑人身份的过程。第5部分“成人黑人意识形成”描述了个体对种族的看法从不重要到在自身及他人黑人身份背景下构建全新世界观的轨迹。这四个阶段是：接触前、接触、沉浸/浮现和内化/承诺。\n\
    \n## Strayhorn（2012）的归属感\n\n根据 Strayhorn（2012）的说法，归属感是指“学生感知到的校园社会支持，一种联系感，一种感到自己重要、被关心、被接纳、被尊重、被重视，并对校园中的群体或他人重要的体验”（第3页）。Strayhorn\
    \ 的概念模型包含七个核心要素：归属感作为一种基本人类需求、一种基本动机，足以驱动人类行为；归属感在某些情境下具有更高的重要性；归属感与“重要感”的关系及其后果；社会身份交叉影响归属感；归属感与积极结果的关联；以及对归属感持续存在的必要性，以及随着环境、条件和情境的变化而改变的可能性。\n\
    \n## Phinney（1989, 1993）的族群身份发展模型\n\n这个三阶段模型描述了族群身份达成的过程。第一阶段是未经审视的族群身份，学生被描述为处于两种状态之一：扩散或早闭。这两种状态都反映了个人的感受或态度尚未探索，或者与具有相似族群身份的人之间的互动尚未探索。下一阶段是探索期，指促使族群身份探索的遭遇，同时处理收集到的信息所产生的各种情绪和反应。在最后阶段，身份达成，个体形成了积极的双文化身份——建立对其他族群的认识和欣赏。\n\
    \n## Perry（1970）的智力和道德发展图式\n\n该理论描述了学生如何从简单的、二元的...形式中移动。Gilligan 提出了一个以女性道德发展和推理为中心的理论。与\
    \ Kohlberg 的理论类似，该理论包含三个层次（关注个体生存、善良作为自我牺牲、非暴力道德）。通过两个过渡阶段（从自私到责任，从善良到真理）实现层次间的递进。\n\
    \n## Kegan（1994）的意识演化理论\n\nKegan 的五种意识秩序概述了“影响思维、情感以及与他人和自我关系的心理组织原则”（Love & Guthrie,\
    \ 1999, 第67页）。每一种秩序都包含补充秩序认知性质的内在个人和人际维度。秩序0到1特指幼儿（0-2岁）。秩序2到5与我们通常服务的大学校园中的成人群体更相关。它们是：秩序2：工具性思维；秩序3：社会化思维；秩序4：自我主导思维；秩序5：自我转化思维。\n\
    \n## Baxter Magolda（2001）的自我主导理论\n\n自我主导被定义为“定义个人信念、身份和社会关系的内部能力”（Evans et al.,\
    \ 2010）。Baxter Magolda 的理论描述了年轻成年人与自我意识和他人关系相关的认识论发展。该理论探讨了三个总体问题：我如何知道？我是谁？我想如何与他人建立关系？通往自我主导的旅程由四个阶段描述，这些阶段解释了个体如何从外部赋予的价值观和信念体系转向定义自己的：遵循公式、十字路口、成为自己生活的作者，以及内在基础。\n\
    \n## Schlossberg（1984）的过渡理论\n\n生活有时会抛出曲线球，导致关系、惯例和角色发生变化（即过渡），这些变化可能是预期的、意外的，或是一个非事件。Schlossberg\
    \ 的理论提供了对个体如何解读和应对过渡的见解。有效的应对取决于个人对四个方面资源（情境、自我、支持和策略）的评估，以促进进入、穿越和离开的过渡过程。\n\n\
    ## Kolb（1984）的体验学习理论\n\n根据 Kolb（1984），学习被定义为“通过经验的转化创造知识的过程”（第38页）。该理论提出了一个四阶段循环学习过程，“结合了经验、感知、认知和行为”（第21页）。这四个阶段是：具体经验、观察与反思、形成抽象概念，以及在新情境中检验。\n\
    \n## 后续章节模板\n\n为了可读性和跨示例比较的能力，接下来的九章由撰稿作者撰写，采用一致的模板呈现。每章都围绕一个框架组织，该框架强调了高等教育和学生事务从业者将理论、模型和其他学术成果融入工作的当代视角。模板（即第2至10章中提供的信息和视角的顺序）如下：\n\
    \n- 摘要\n- 简要介绍，为理论实践应用设定机构和地方背景\n- 描述[项目或倡议的名称/标识短语]\n  - 指导理论\n  - 实施细节\n  -\
    \ 评估与评价\n- 巧妙应用理论的经验教训\n- 建议与资源\n- 参考文献\n\n本书最后一章，第11章，不遵循此模板。相反，它总结了为本书提交的提案数据，并从撰稿作者的经验教训和建议中提炼出主题视角。本书提出了一些关于在当代情境中应用学生发展理论的结论，强调了学术型高等教育和学生事务从业者参与的必要性。此外，还指出了一些将理论应用迁移到多种情境和学生群体时的注意事项。\n\
    \n## 这不是魔法\n\n正如 Susan R. Komives 在前言中指出的那样，全面地应用理论来促进大学生发展和学习并不是魔法。相反，它涉及往往是微妙但不断变化的学术知识与有意识的实践的汇合——就像透过万花筒观看鲜艳的图像。在接下来的九章中，学术型从业者分享了他们对理论实践工作复杂性的看法。所描述的万花筒般的反思和角度展示了他们作为投入的、学术性的高等教育和学生事务从业者的专业知识。\n\
    \n## 参考文献\n\n- Abes, E. (编). (2016). _学生发展理论的关键问题_（学生发展理论新视角，第154期）. 旧金山，加利福尼亚州：Jossey-Bass.\n\
    - 美国大学人事协会. (1996). _学生学习要务：对学生事务的启示_. 华盛顿，哥伦比亚特区：作者.\n- 美国教育委员会. (1937). _学生人事视角_（美国教育委员会研究，系列1，第1卷，第3号）.\
    \ 华盛顿，哥伦比亚特区：作者.\n- Astin, A. W. (1999). 学生参与：高等教育的发展理论. _学院学生发展杂志，40_(5), 518–529.\n\
    - Bartlett, T. (2017, May 26). 当一个理论走红。交叉性现在无处不在。这是好事吗？ _[高等教育]纪事评论，63_(37).\n\
    - Baxter Magolda, M. B. (2001). _走自己的路：改造高等教育以促进自我发展的叙事_. 斯特灵，弗吉尼亚州：Stylus出版社.\n\
    - Bliming, G. S. (2013). 传统年龄大学生心理社会发展的新维度. _校园，18_(5), 10–16. doi:10.1002/abc.21132\n\
    - Bresciani Ludvik, M. J. (编). (2016). _学习与发展的神经科学：在高等教育中增强创造力、同理心、批判性思维与和平_.\
