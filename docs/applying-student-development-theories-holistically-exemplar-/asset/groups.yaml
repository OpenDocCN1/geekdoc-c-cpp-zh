    布朗，B.（2010）。*不完美的礼物。* 中心城，明尼苏达州：哈泽尔登出版社。


    康巴希河集体（1983）。康巴希河集体声明。载于B. 史密斯（主编），*家乡女孩：黑人女性主义文选*（第272–282页）。纽约，纽约州：厨房餐桌与有色人种女性出版社。


    克伦肖，K.（1989）。*将种族与性的交叉去边缘化：对反歧视原则、女性主义理论和反种族主义政治的黑人女性主义批判。* 检索自 http://chicagounbound.uchicago.edu/ucl/vol1989/iss1/8


