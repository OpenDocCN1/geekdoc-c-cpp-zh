    管理他们的日程。W1GS成员与同伴和顾问一起，与校园及周边社区建立联系，这是FGS成功的重要组成部分。


    ## 成果五：创建并充当W1GS成员的资源社区


    成员拥有超越W1GS会议本身的支持与资源社区。例如，在期中考试和期末考试前后，成员们通过GroupMe®短信应用程序请求对即将到来的考试或作业的支持。顾问们参与该短信应用程序，以便了解成员们请求了哪些支持。当学生们表示他们在特定领域需要帮助时，成员们共同识别和汇编可用资源，然后通过该应用程序分享。同样，当世界上发生问题（例如飓风）或个人生活中发生问题（例如家庭成员去世）时，该短信应用程序用于帮助彼此寻找个人支持。


