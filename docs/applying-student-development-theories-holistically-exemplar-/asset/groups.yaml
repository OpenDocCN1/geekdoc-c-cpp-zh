    of American Colleges and Universities.

    - Kuh, G. D., Kinzie, J., Schuh, J. H., Whitt, E. J., & Associates. (2005). *大学中的学生成功：创造重要的条件。*
    San Francisco, CA: Jossey-Bass.

    - Mayhew, M. J., Rockenbach, A. N., Bowman, N. A., Seifert, T. A., Wolniak, G.
    C., Pascarella, E. T., & Terenzini, P. T. (2016). *大学如何影响学生：高等教育有效运作的21世纪证据* (Vol.
    3). San Francisco, CA: Jossey-Bass.


    本书的主要读者是攻读学生事务和高等教育项目的研究生，他们正在修读成人发展、大学对学生的影响、学生事务领导力以及高等教育中的项目或政策发展等课程。另一类读者是当前的高等教育专业人士，他们需要更新其理论知识或寻求理论与实践联系的灵感。因此，本书既可用于学术课程，也可用于专业发展计划。


    本书的内容是其他出版物的理想伴侣，这些出版物提供了在高等教育中使用的详细的人类发展理论描述。例如，本书中许多理论家和理论建构的名称在作为主要课程教材的书籍中都有讨论（例如，Jones
    & Abes, 2013；Patton, Renn, Guido, & Quaye, 2016；Strange & Banning, 2015；Strayhorn,
    2016）。此外，由于潜在的理论重叠与先前获得的知识，本书的内容可以融入旨在鼓励有意且整体地使用理论知识和评估技术的专业员工发展计划。


    本书内容的独特之处在于展示了从业者如何将近期学术出版物和会议演讲中的理论应用于与21世纪大学生工作的实践中，评估是如何进行的，以及在多维度、整体地应用人类发展理论的复杂性方面学到了什么。作者提供了在以专业意图开展理论与实践循环时所学到的见解，提出了建议，并提供了资源建议。


    章节分为三个部分，与研究中关于大学生发展的理论分组相平行：


    - 心理社会与社会认同（即：我是谁？）

    - 认知结构过程（即：我如何建构意义？）

    - 环境影响（即：哪些外部因素影响我的发展？）


    每个部分都包含以高等教育专业人士工作中基础或新兴理论为基础的章节。在第一部分中，


    总之，这些九章连同本书的导言和结尾章节，将既激励高等教育和学生事务专业人士，又提供整体应用学生发展理论的工具。


    ## 参考文献


    - Jones, S. R., & Abes, E. S. (2013). *大学生身份发展：推进多维度身份的框架。* San Francisco, CA:
    Jossey-Bass.

