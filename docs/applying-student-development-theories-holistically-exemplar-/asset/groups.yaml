    W1GS的初步实施和持续发展以五个核心价值观为中心：奉献、坚毅、好奇、社群和诚信。顾问团队基于关于思维模式、刻板印象威胁、行为以及FGS在大学生活中取得成功所用技能的研究选择了这些价值观（Davis,
    2010; Steele, 2011; Ward, Siegal, & Davenport, 2012）。这些价值观中的每一个都被认为是FGS可以学习或已经具备的能力，但需要帮助将其转移到大学环境中（Davis,
    2010; Steele, 2011; Ward et al., 2012）。


    ## 指导理论


    W1GS的设计以三种理论为指导：戴维斯（2010）关于第一代学生经历的内容理论，以及两个过程理论：巴克斯特·马戈尔达（2001）的自我作者身份理论和科尔布（1984）的体验学习理论。戴维斯（2010）的理论帮助我们理解FGS的独特需求是什么。当同时使用时，自我作者身份（Baxter
    Magolda, 2001）和体验学习（Kolb, 1984）促使我们思考如何创建和实施一项满足这些需求的倡议。


    根据戴维斯（2010）的观点，FGS在很大程度上没有得到高校的充分服务。在公立四年制院校尤其如此，那里的学生“更可能被允许对教育保持被动，并可能变得心理上不满，或掉入裂缝”（第20页）。戴维斯还强调了FGS在高等教育环境中面临的、影响其成功的具体问题。每个问题都为W1GS制定的发展成果以及实现这些成果的过程提供了信息。


    戴维斯（2010）还指出，“FGS不熟悉大学文化，并且在某种程度上不熟悉作为大学生意味着什么”（第29页）。为了向他们介绍大学文化，FGS需要的是“向导”而不是“专家”（第32页）。W1GS顾问作为学生组织中的学生向导。


