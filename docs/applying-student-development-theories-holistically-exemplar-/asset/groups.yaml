  - '[PAGE 14]


    The primary audience for this book is graduate students in student affairs and
    higher education programs who are in courses such as adult development, the impact
    of college on students, student affairs leadership, and program or policy development
    in higher education. Another audience is current higher education professionals
    who need either updates on their theoretical knowledge or inspirations for theory-in-practice
    links. Thus, this book can be helpful in both an academic curriculum and professional
    development initiatives.


    The contents of this book are a ready companion to other publications that provide
    detailed descriptions of human development theories used in higher education.
    For example, many of the names of theorists and theoretical constructs in this
    book are discussed in books that serve as primary course texts (e.g., Jones &
    Abes, 2013; Patton, Renn, Guido, & Quaye, 2016; Strange & Banning, 2015; Strayhorn,
    2016). Furthermore, because of the potential theoretical overlap with previously
    acquired knowledge, this book’s contents can fold into professional staff development
    initiatives designed to encourage the intentional, holistic use of theoretical
    knowledge and assessment techniques.


    What is unique about the contents of this book are the demonstrations of how practitioners
    are using theories from recent scholarly publications and conference presentations
    in their work with twenty-first-century college students, how assessment is being
    carried out, and what is being learned about the complexities of applying human
    development theories in multidimensional, holistic ways. Authors provide insights
    about what they learned when approaching the theory-in-practice cycle with professional
    intentionality, make recommendations, and provide resource suggestions.


    The chapters are organized into three parts, which parallel theoretical groupings
    in the research focused on the development of college students:


    +   - Psychosocial and social identity (i.e., Who am I?)

    +   - Cognitive-structural processes (i.e., How do I make meaning?)

    +   - Environmental influences (i.e., What external elements influence my development?)


    Each part contains chapters grounded in theories that are foundational or emergent
    in the work of higher education professionals. In Part I,'
