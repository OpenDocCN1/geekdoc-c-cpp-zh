- - '#####'
  - 7.2.1 通用 MCP-模型方法 [4]
- - '#####'
  - 公式可以看出，$\Sigma$ 只需在比例上已知。
- - '#####'
  - 确定了剂量响应信号，进入 Mod 步骤，拟合剂量响应曲线并根据 MCP 步骤识别的模型目标剂量。
- - '#####'
  - 许多方法可以将剂量响应模型拟合到观测数据，包括极大似然化或受限似然化的方法。
- - '#####'
  - Pinheiro 等人了一种替代的二阶段剂量响应模型拟合方法，使用广义最小二法来拟合从 ANCOVA 模型拟合剂量响应模型，这具有某些计算上的优势 [4]。
- - '#####'
  - 这种方法依赖于渐近结果，因为它仅依赖 $\mu$ 和 $\Sigma$，所以具有通用吸引力。
- - '#####'
  - 广义 MCP 方法也可以在 SAS 中实现，如后文所示。
