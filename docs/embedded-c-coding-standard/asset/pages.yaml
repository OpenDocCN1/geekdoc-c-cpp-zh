  md: "```\n/*!\n * @brief Compute the reflection of a set of data bits around its\
    \ center.\n * @param[in] data The data bits to be reflected.\n * @param[in] num2\
    \ The number of bits.\n * @return The reflected data.\n */\nstatic uint32_t\n\
    reflect(uint32_t data, uint8_t n_bits)\n{\n    uint32_t reflection = 0x00000000;\n\
    \n    // NOTE: For efficiency sake, n_bits is not verified to be <= 32.\n\n  \
    \  // Reflect the data about the center bit.\n    //\n    for (uint8_t bit = 0;\
    \ bit < n_bits; ++bit)\n    {\n        // If the LSB bit is set, set the reflection\
    \ of it.\n        //\n        if (data & 0x01)\n        {\n            reflection\
    \ |= (1 << ((n_bits - 1) - bit));\n        }\n\n        data = (data >> 1);\n\
    \    }\n\n    return (reflection);\n}\n\n/* reflect() */\n```"
