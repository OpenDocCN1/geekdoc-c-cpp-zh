- pgno: 61
  md: "# Embedded C Coding Standard\n\n# 7.2 Initialization\n\nRules:\n\n+   a. All\
    \ variables shall be initialized before use.\nb. It is preferable to define local\
    \ variables as you need them, rather than all at the top of a function.\nc. If\
    \ project- or file-global variables are used, their definitions shall be grouped\
    \ together and placed at the top of a source code file.\nd. Any pointer variable\
    \ lacking an initial address shall be initialized to NULL.\n\nExample:\n\n```\n\
    uint32_t g_array[NUM_ROWS][NUM_COLS] = { ... };\n\nfor (int col = 0; col < NUM_COLS;\
    \ col++)\n{\n    g_array[row][col] = ...;\n}\n```\n\nReasoning: Too many programmers\
    \ assume the C run-time will watch out for them, e.g., by zeroing the value of\
    \ uninitialized variables on system startup. This is a bad assumption, which can\
    \ prove dangerous in a mission-critical system. For readability it is better to\
    \ declare local variables as close as possible to their first use,¹ which C99\
    \ makes possible by incorporating earlier feature of C++.\n\nEnforcement: An automated\
    \ tool shall scan all of the source code prior to each build, to warn about variables\
    \ used prior to initialization; static analysis tools can do this. The remainder\
    \ of these rules shall be enforced during code reviews.\n\n> ¹ [Uwano] describes\
    \ back-and-forth code review eye movements that demonstrate the value of placing\
    \ variable declarations as close as possible to the code that first references\
    \ them."
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 8 Statement Rules


    # 8.1 Variable Declarations


    Rules:


    +   a. The comma operator (,) shall not be used within variable declarations.


    Example:


    ```

    char * x, y; // Was y intended to be a pointer also? Don''t do this.

    ```


    **Reasoning:** The cost of placing each declaration on a line of its own is low.
    By contrast, the risk that either the compiler or a maintainer will misunderstand
    your intentions is high.


    **Enforcement:** This rule shall be enforced during code reviews.


