- pgno: 44
  md: "# Data Type Rules\n\n# 5.1 Naming Conventions\n\nRules:\n\n+   a. The names\
    \ of all new data types, including structures, unions, and enumerations, shall\
    \ consist only of lowercase characters and internal underscores and end with `_t`.\n\
    \n+   b. All new structures, unions, and enumerations shall be named via a `typedef`.\n\
    \n+   c. The name of all public data types shall be prefixed with their module\
    \ name and an underscore.\n\nExample:\n\n```\ntypedef struct\n{\n    uint16_t\
    \ count;\n    uint16_t max_count;\n    uint16_t unused;\n    uint16_t control;\n\
    }\n\ntimer_reg_t;\n```\n\nReasoning: Data type names and variable names are often\
    \ appropriately similar. For example, a set of control registers in a peripheral\
    \ calls out to be named `timer_reg`. To distinguish the structure definition that\
    \ defines the register layout, it is valuable to create a new type with a distinct\
    \ name, such as `timer_reg_t`. If necessary this same type could then be used\
    \ to create a shadow copy of the timer registers, say called `timer_reg_shadow`.\n\
    \nEnforcement: An automated tool shall scan new or modified source code prior\
    \ to each build to ensure that the keywords struct, union, and enum are used only\
    \ within typedef statements or in anonymous declarations. Code reviews shall be\
    \ used to enforce the naming rules for new types."
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Embedded C Coding Standard


    # 5.2 Fixed-Width Integers


    Rules:


    +   Whenever the width, in bits or bytes, of an integer value matters in the program,
    one of the fixed width data types shall be used in place of char, short, int,
    long, or long long. The signed and unsigned fixed-width integer types shall be
    shown in the table below.


    | Integer Width | Signed Type | Unsigned Type |

    | --- | --- | --- |

    | 8 bits | int8_t | uint8_t |

    | 16 bits | int16_t | uint16_t |

    | 32 bits | int32_t | uint32_t |

    | 64 bits | int64_t | uint64_t |


    +   The keywords short and long shall not be used.


    +   Use of the keyword char shall be restricted to the declaration of and operations
    concerning strings.


    Example: See Appendix D.


    **Reasoning:** The C90 standard purposefully allowed for implementation-defined
    widths for char, short, int, long, and long long types, which has resulted in
    code portability problems. The C99 standard did not resolve this but introduce
    the type names shown in the table, which are defined in the std.h header file.


    See also Portable Fixed-Width Integers in C:


    barrgroup.com/embedded-systems/how-to/c-fixed-width-integers-c99


    In the absence of a C99-compatible compiler, it is acceptable to define the set
    of fixed-width types in the table above as typedefs from underlying types. If
    this is necessary, be sure to use compile-time checking (e.g., static assertions).


    **Enforcement:** At every build an automated tool shall flag any use of keywords
    short or long. Compliance with the other rules shall be checked during code reviews.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# 5.3 Signed and Unsigned Integers\n\nRules:\n\n+   a. Bit-fields shall not\
    \ be defined within signed | ^ integer types.\n\n+   b. None of the bitwise operators\
    \ (i.e., |, ~, ^ <<, and >>) shall be used to manipulate signed integer data.\n\
    \n+   c. Signed integers shall not be combined with unsigned integers in comparisons\
    \ or expressions. In support of this, decimal constants meant to be unsigned should\
    \ be declared with a ‘u’ at the end.\n\nExample:\n\n```\nuint16_t unsigned_a =\
    \ 6u;\nint16_t signed_b = -9;\n```\n\n```\nif (unsigned_a + signed_b < 4)\n{\n\
    \    // Execution of this block appears reliably logical, as -9 + 6 is -3\n  \
    \  ...\n}\n// ... but compilers with 16-bit int may legally perform (0xFFFF) +\
    \ 6.\n```\n\nReasoning: Several details of the manipulation of binary data within\
    \ signed integer containers are implementation-defined behaviors of the ISO C\
    \ standards. Additionally, the results of mixing signed and unsigned integers\
    \ can lead to data-dependent outcomes like the one in the code above. Beware that\
    \ the use of C99's fixed-width integer types does not by itself prevent such defects.\n\
    \nEnforcement: Static analysis tools can be used to detect violations of these\
    \ rules.\n\n> [MISRA-C] describes problems that can arise from mixing C’s “essential\
    \ types” at length in its Appendix C and Appendix D."
  merge: -1
