  img_proc: true
- pgno: 78
  md: "# Embedded C Coding Standard\n\n```\n/*!\n * @brief Compute the CRC of an array\
    \ of bytes, bit-by-bit.\n * @param[in] p_message  A pointer to the array of data\
    \ bytes to be CRC'd.\\n * @param[in] n_bytes      The number of bytes in the array\
    \ of data.\n * @return The CRC of the array of data.\n */\n```\n\n```\ncrc_t\n\
    crc_slow(uint8_t const * p_message, int n_bytes)\n{\n    crc_t remainder = INITIAL_REMAINDER;\n\
    \n    // Perform modulo-2 division, one byte at a time.\n    for (int byte = 0;\
    \ byte < n_bytes; ++byte)\n    {\n        // Bring the next byte into the remainder.\n\
    \        remainder ^= (REFLECT_DATA(p_message[byte]) << (WIDTH - BITS_PER_BYTE));\n\
    \n        // Perform modulo-2 division, one bit at a time.\n        for (int bit\
    \ = BITS_PER_BYTE; bit > 0; --bit)\n        {\n            // Try to divide the\
    \ current data bit.\n            if (remainder & TOPBIT)\n            {\n    \
    \            remainder = (remainder << 1) ^ POLYNOMIAL;\n            }\n     \
    \       else\n            {\n                remainder = (remainder << 1);\n \
    \           }\n        }\n    }\n\n    // The final remainder is the CRC result.\n\
    \    return (REFLECT_REMAINDER(remainder)) ^ FINAL_XOR_VALUE;\n}\n/* crc_slow()\
    \ */\n```"
  merge: -1
  img_proc: true
- pgno: 79
  md: "# Embedded C Coding Standard\n\n```\n/**\n * @brief Compute the CRC of an array\
    \ of bytes, byte-by-byte.\n * @param[in] p_message A pointer to the array of data\
    \ bytes to be CRC.\n * @param[in] n_bytes The number of bytes in the array of\
    \ data.\n * @return The CRC of the array of data.\n */\n```\n\n```\ncrc_t\ncrc_fast(uint8_t\
    \ const * p_message, int n_bytes)\n{\n    crc_t remainder = INITIAL_REMAINDER;\n\
    \n    // Divide the message by the polynomial, a byte at a time.\n    for (int\
    \ byte = 0; byte < n_bytes; ++byte)\n    {\n        uint8_t data = REFLECT_DATA(p_message[byte])\
    \ ^\n                       (remainder >> (WIDTH - BITS_PER_BYTE));\n        remainder\
    \ = g_crc_table[data] ^ (remainder << BITS_PER_BYTE);\n    }\n\n    // The final\
    \ remainder is the CRC.\n    return {REFLECT_REMAINDER(remainder)} ^ FINAL_XOR_VALUE;\n\
    }\n/* crc_fast() */\n\n```"
  merge: -1
  img_proc: true
