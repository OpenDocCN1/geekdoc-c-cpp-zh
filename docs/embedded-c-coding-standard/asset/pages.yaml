- pgno: 31
  md: '# Embedded C Coding Standard


    **Reasoning:** Following these rules results in good comments. And good comments
    correlate with good code. It is a best practice to write the comments before writing
    the code that implements the behaviors those comments outline.


    Unfortunately, it is easy for source code and documentation to drift over time.
    The best way to prevent this is to keep the documentation as close to the code
    as possible. Likewise, anytime a question is asked about a section of the code
    that was previously thought to be clear, you should add a comment addressing that
    issue nearby.


    Doxygen is a useful tool to generate documentation describing the modules, functions,
    and parameters of an API for its users. However, comments are all still necessary
    inside the function bodies to reduce the cost of code maintenance.


    **Enforcement:** The quality of comments shall be evaluated during code reviews.
    Code reviewers should verify that comments accurately describe the code and are
    also clear, concise, and valuable. Automatically generated documentation should
    be rebuilt each time the software is built.'
