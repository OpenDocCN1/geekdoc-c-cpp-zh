- pgno: 39
  md: 'Embedded C Coding Standard


    # 3.6 Non-Printing Characters


    Rules:


    +   a. Whenever possible, all source code lines shall end only with the single
    character ''LF'' (ASCII 0x0A), not with the pair ''CR''-''LF'' (0x0D 0x0A).

    b. The only other non-printable character permitted in a source code file is the
    form feed character ''FF'' (ASCII 0x0C).


    **Example:** It''s not possible to demonstrate non-printing characters in print.


    **Reasoning:** The multi-character sequence ''CR''-''LF'' is more likely to cause
    problems in a multi-platform development environment than the single character
    ''LF''. One such problem is associated with multi-line preprocessor macros on
    Unix platforms.


    **Enforcement:** Whenever possible, programmer''s editors shall be configured
    to use LF. In addition, an automated tool shall scan all new or modified source
    code files during each build, replacing each CR-LF sequence with an LF.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Embedded C Coding Standard


    # # Module Rules


    # ## 4.1 Naming Conventions


    Rules:


    +   a. All module names shall consist entirely of lowercase letters, numbers,
    and underscores. No spaces shall appear within the module’s header and source
    file names.


    +   b. All module names shall be unique in their first 8 characters and end with
    suffixes .h and .c for the header and source file names, respectively.


    +   c. No module''s header file name shall share the name of a header file from
    the C Standard Library or C++ Standard Library. For example, modules should not
    be named “stdio” or “math”.


    +   d. Any module containing a main() function shall have the word “main” as part
    of its source file name.


    **Example:** See Appendix D.


    **Reasoning:** Multi-platform development environments (e.g., Unix and Windows)
    are the norm rather than the exception. Mixed case names can cause problems across
    operating systems and are also error prone due to the possibility of similarly-named
    but differently-capitalized files becoming confused by human programmers.


    The inclusion of “main” in a file name is an aid to code maintainers that have
    proven useful in projects with multiple software configurations.


    **Enforcement:** An automated tool shall confirm that all file names that are
    part of a build are consistent with these rules.


    29'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Embedded C Coding Standard


    # 4.2 Header Files


    Rules:


    +   There shall always be precisely one header file for each source file and they
    shall always have the root name.


    +   Each header file shall contain a preprocessor guard against multiple inclusion,
    as shown in the example below.


    +   The header file shall identify only the procedures, constants, and data types
    (via prototypes, #define, and typedefefs, respectively) about which it is strictly
    necessary for other modules to be informed.


    +   It is a preferred practice that no variable ever be declared (via extern)
    in a header file.


    +   No storage for any variable shall be allocated in a header file.


    +   No public header file shall contain a #include of any private header file.


    Example:


    ```

    #ifndef ADC_H

    #define ADC_H

    ...

    #endif /* ADC_H * /

    ```


    Reasoning: The C language standard gives all variables and functions global scope
    by default. The downside of this is unnecessary (and dangerous) coupling between
    modules. To reduce inter-module coupling, keep as many procedures, constants,
    data types, and variables as possible privately hidden within a module''s source
    file.


    See also What Belongs in a C .h Header File?


    embeddedguru.com/bar-code/2010/11/what-belongs-in-a-c-h-header-file/


    Enforcement: These rules shall be enforced during code reviews.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 4.3 Source Files


    Rules:


    +   - Each source file shall include only the behaviors appropriate to control
    one ''entity''. Examples of entities include encapsulated data types, active objects,
    peripheral drivers (e.g., for a UART), and communication protocols or layers (e.g.,
    ARP).


    +   - Each source file shall be comprised of some or all of the following sections,
    in the order listed: comment block; include statements; data type, constant, and
    macro definitions; static data declarations; private function prototypes; public
    function bodies; then private function bodies;


    +   - Each source file shall always #include the header file of the same name
    (e.g., file adc.c should include "adc.h"), to allow the compiler to confirm that
    each public function and its prototype match.


    +   - Absolute paths shall not be used in include file names.


    +   - Each source file shall be free of unused include files.


    +   - No source file shall #include another source file.


    Example: See Appendix D.


    Reasoning: The purpose and internal layout of a source file module should be clear
    to all who maintain it. For example, the public functions are generally of interest
    and thus appear ahead of the private functions they call. Of critical importance
    is that every function declaration be matched by the compiler against its prototype.


    Enforcement: Most static analysis tools can be configured to check for include
    files that are not actually used. The other rules shall be enforced during code
    reviews.


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_42_0.png)'
  merge: -1
