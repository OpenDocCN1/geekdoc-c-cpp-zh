- pgno: 34
  md: "# 3.2 Alignment\n\nRules:\n\n+   a. The names of variables within a series\
    \ of declarations shall have their first characters aligned.\nb. The names of\
    \ struct and union members shall have their first characters aligned.\nc. The\
    \ assignment operators within a block of adjacent assignment statements shall\
    \ be aligned.\nd. The # in a preprocessor directive shall always be located at\
    \ the start of a line, though the directives themselves may be indented within\
    \ a #if or #ifdef\n\nExample:\n\n```\n#ifdef USE_UNICODE_STRINGS\n# define BUFFER_BYTES\
    \ 128\n#else\n# define BUFFER_BYTES 64\n#endif\n\ntyped struct struct {\n  uint8_t\
    \ buffer[BUFFER_BYTES];\n  uint8_t checksum;\n} string_t;\n```\n\nReasoning: Visual\
    \ alignment emphasizes similarity. A series of consecutive lines containing a\
    \ variable declaration is easily seen and understood as a block of related lines\
    \ of code. Blank lines and differing alignments should be used as appropriate\
    \ to visually separate and distinguish unrelated blocks of code that happen to\
    \ be in proximity.\n\nEnforcement: These rules should be enforced during code\
    \ reviews."
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Embedded C Coding Standard


    # 3.3 Blank Lines


    Rules:


    +   a. No line of code shall contain more than one statement.

    b. There shall be a blank line before and after each natural block of code.

    Examples of natural blocks of code are loops, if...else and switch statements,
    and consecutive declarations.

    c. Each source file shall terminate with a comment marking the end of file followed
    by a blank line.


    Example: See Appendix D.


    Reasoning: Appropriate placement of white space provides visual separation and
    thus makes code easier to read and understand, just as the white space areas between
    paragraphs of this coding standard aid readability. Clearly marking the end of
    a file is important for human reviewers looking at printouts and the blank line
    following may be required by some older compilers.


    Enforcement: These rules shall be enforced during code reviews.'
  merge: -1
  img_proc: true
