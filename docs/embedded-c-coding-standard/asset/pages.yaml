- pgno: 32
  md: '# White Space Rules


    # 3.1 Spaces


    Rules:


    +   a. Each of the keywords if, while, for, switch, and return shall be followed
    by one space when there is additional program text on the same line.


    +   b. Each of the assignment operators =, +=, -=, *, /=, &=, |=, ^=, -= != shall
    always be preceded and followed by one space.


    +   c. Each of the binary operators +, -, *, %, <, <=, ==, <<, >>, |, ^, && and
    || shall be preceded and followed by one space.


    +   d. Each of the unary operators *, -, +, --, !, and ~, shall be written without
    a space on the operand.


    +   e. The pointer operators * and & shall be written with white space on each
    side within declarations or otherwise without a space on the operand.


    +   f. The ? and : characters that comprise the ternary operator shall always
    be preceded and followed by one space.


    +   g. The structure pointer and structure member operators (-> and .), respectively
    shall always be without surrounding spaces.


    +   h. The left and right brackets of the array subscript operator (( and )) shall
    be without surrounding spaces, except as required by another white space rule.


    +   i. Expressions in parentheses shall always have no spaces adjacent to the
    left and right parenthesis characters.


    +   j. The left and right parentheses of the function call shall always be without
    surrounding spaces, except that the function declaration shall feature one space
    between the function name and the left parenthesis to allow that one particular
    mention of the function name to be easily located.


    +   k. Except when at the end of a line, each comma separating function parameters
    shall always be followed by one space.'
  merge: -1
  img_proc: true
