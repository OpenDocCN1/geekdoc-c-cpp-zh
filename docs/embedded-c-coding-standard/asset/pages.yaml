- pgno: 55
  md: "Embedded C Coding Standard\n\n# 6.3 Function-Like Macros\n\nRules:\n\n+   a.\
    \ Parameterized macros shall not be used if a function can be written to accomplish\
    \ the same behavior.\n\n+   b. If parameterized macros are used for some reason,\
    \ these rules apply:\n   i. Surround the entire macro body with parentheses.\n\
    \   ii. Surround each use of a parameter with parentheses.\n   iii. Use each parameter\
    \ no more than once, to avoid unintended side effects.\n   iv. Never include a\
    \ transfer of control (e.g., return keyword).\n\nExample:\n\n```\n// Don't do\
    \ this ...\n#define MAX(A, B) ((A) > (B) ? (A) : (B))\n```\n\n```\n// ... when\
    \ you can do this instead.\ninline int max(int num1, int num2)\n```\n\nReasoning:\
    \ There are a lot of risks associated with the use of preprocessor defines, and\
    \ many of them relate to the creation of parameterized macros. The extensive use\
    \ of parentheses (as shown in the example) is important, but does not eliminate\
    \ the unintended double increment possibility of a call such as MAX(i++, j++).\
    \ Other risks of macro misuse include comparison of signed and unsigned data or\
    \ any test of floating-point data. Making matters worse, macros are invisible\
    \ at run-time and thus impossible to step into the debugger.\n\nWhere performance\
    \ is important, note that C99 added C++’s inline keyword.\n\nEnforcement: These\
    \ rules shall be enforced during code reviews."
  merge: -1
  img_proc: true
- pgno: 56
  md: "# 6.4 Threads of Execution\n\nRules:\n\n+   a. All functions that encapsulate\
    \ threads of execution (a.k.a., tasks, processes) shall be given names ending\
    \ with \"_thread\" (or \"_task\",\"_process\").\n\nExample:\n\n```\nvoid\nalarm_thread\
    \ (void * p_data)\n{\n    alarm_t alarm = ALARM_NONE;\n    int err = OS_NO_ERR;\n\
    \n    for (;;)\n{\n        alarm = OSMboxPend(alarm_mbox, &err);\n        // Process\
    \ alarm here.\n    }\n}\n```\n\n**Reasoning:** Each task in a real-time operating\
    \ system (RTOS) is like a mini-main(), typically running forever in an infinite\
    \ loop. It is valuable to easily identify these important, asynchronous functions\
    \ during code reviews and debugging sessions.\n\n**Enforcement:** This rule shall\
    \ be followed during the detailed design phase and enforced during code reviews."
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Embedded C Coding Standard


    # 6.5 Interrupt Service Routines


    Rules:


    +   a. Interrupt service routines (ISRs) are not ordinary functions. The compiler
    must be informed that the function is an ISR by way of a #pragma or compiler-specific
    keyword, such as `__interrupt`.


    +   b. All functions that implement ISRs shall be given names ending with `_isr`.


    +   c. To ensure that ISRs are not inadvertently called from other parts of the
    software (they may corrupt the CPU and call stack if this happens), each ISR function
    shall be declared static and/or be located at the end of the associated driver
    module as permitted by the target platform.


    +   d. A stub or default ISR shall be installed in the vector table at the location
    of all unexpected or otherwise unhandled interrupt sources. Each such stub could
    attempt to disable interrupts of the same type, say at the interrupt controller,
    and assert().


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_57_0.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: "Example:\n\n```\n#pragma irq_entry\nvoid\ntimer_isr (void)\n{\n    uint8_t\
    \ static prev = 0x00; // prev button states\n    uint8_t curr = *gp_button_reg;\
    \ // curr button states\n\n    // Compare current and previous button states.\n\
    \    g_debounced |= (prev & curr); // record all closes\n    g_debounced &= (prev\
    \ | curr); // record all opens\n\n    // Save current pin states for next interrupt\n\
    \    prev = curr;\n\n    // Acknowledge timer interrupt at hardware, if necessary.\n\
    }\n```\n\nReasoning: An ISR is an extension of the hardware. By definition, it\
    \ and the straight-line code are asynchronous to each other. If they share global\
    \ variables or registers, those singleton objects must be protected via interrupt\
    \ disables in the straight-line code. The ISR must not get hung up inside the\
    \ operating system or waiting for a variable or register to change value.\n\n\
    Note that platform-specific ISR installation steps may vary and may require ISR\
    \ functions to be prototypes and in other ways to be visible to at least one other\
    \ function.\n\nAlthough stub interrupt handlers don't directly prevent defects,\
    \ they can certainly make a system more robust in real-world operating conditions.\n\
    \nEnforcement: These rules shall be enforced during code reviews."
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Embedded C Coding Standard


    # 7 Variable Rules


    # 7.1 Naming Conventions


    Rules:


    +   a. No variable shall have a name that is a keyword of C, C++, or any other
    well-known extension of the C programming language, including specifically K&R
    C and C99. Restricted names include interrupt, inline, restrict, class, true,
    false, public, private, friend, and protected.


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_59_0.png)


    +   b. No variable shall have a name that overlaps with a variable name from the
    C Standard Library (e.g., errno).


    +   c. No variable name shall have a name that begins with an underscore.


    +   d. No variable name shall be longer than 31 characters.


    +   e. No variable name shall be shorter than 3 characters, including loop counters.


    +   f. No variable name shall contain any uppercase letters.


    +   g. No variable name shall contain any numeric value that is called out elsewhere,
    such as the number of elements in an array or the number of bits in the underlying
    type.


    +   h. Underscores shall be used to separate words in variable names.


    +   i. Each variable''s name shall be descriptive of its purpose.


    +   j. The names of any global variables shall begin with the letter ‘g’. For
    example, g_zero_offset.


    +   k. The names of any pointer variables shall begin with the letter ‘p’. For
    example, p_led_reg.


    +   l. The names of any pointer-to-pointer variables shall begin with the letters
    ‘pp’. For example, pp_vector_table.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   m. The names of all integer variables containing Boolean information (including
    0 vs. non-zero) shall begin with the letter ‘b’ and phrased as the question they
    answer. For example, b_done_yet or b_is_buffer_full.


    +   n. The names of any variables representing non-pointer handles for objects,
    e.g., file handles, shall begin with the letter ‘h’. For example, h_input_file.


    +   o. In the case of a variable name requiring multiple of the above prefixes,
    the order of their inclusion before the first underscore shall be [q|p|pp|b|h].


    **Example:** See Appendix D.


    **Reasoning:** The base rules are adopted to maximize portability across compilers.
    Many C compilers recognize differences only in the first 31 characters in a variable’s
    name and reserve names beginning with an underscore for internal names.


    The other rules are meant to highlight risks and ensure consistent proper use
    of variables. For example, all code relating to the use of global variables and
    other singleton objects, including peripheral registers, needs to be carefully
    considered to ensure there can be no race conditions or data corruptions via asynchronous
    writes.


    **Enforcement:** These rules shall be enforced during code reviews.'
