- pgno: 77
  md: "# Embedded C Coding Standard\n\n```\n/*!\n * @brief Initialize the lookup table\
    \ for byte-by-byte CRC acceleration.\n *\n * @par\n * This function must be run\
    \ before crc_fast() or the table stored in ROM.\n */\nvoid\nncrc_init(void)\n\
    {\n    // Compute the remainder of each possible dividend.\n    //\n    for (crc_t\
    \ dividend = 0; dividend < CRC_TABLE_SIZE; ++dividend)\n    {\n        // Start\
    \ with the dividend followed by zeros.\n        //\n        crc_t remainder =\
    \ dividend << (WIDTH - BITS_PER_BYTE);\n\n        // Perform modulo-2 division,\
    \ a bit at a time.\n        //\n        for (int bit = BITS_PER_BYTE; bit > 0;\
    \ --bit)\n        {\n            // Try to divide the current data bit.\n    \
    \        //\n            if (remainder & TOPBIT)\n            {\n            \
    \    remainder = (remainder << 1) ^ POLYNOMIAL;\n            }\n            else\n\
    \            {\n                remainder = (remainder << 1);\n            }\n\
    \        }\n\n        // Store the result into the table.\n        //\n      \
    \  g_crc_table[dividend] = remainder;\n    }\n}\n/* crc_init() */\n```"
