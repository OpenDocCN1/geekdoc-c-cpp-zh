- pgno: 63
  md: "# Embedded C Coding Standard\n\n# 8.2 Conditional Statements\n\nRules:\n\n\
    +   a. It is a preferred practice that the shortest (measured in lines of code)\
    \ of the if and else if clauses should be placed first.\n\n+   b. Nested if...else\
    \ statements shall not be deeper than two levels. Use function calls or switch\
    \ statements to reduce complexity and aid understanding.\n\n+   c. Assignments\
    \ shall not be made within an if or else test.\n\n+   d. Any statement with an\
    \ else if clause shall end with an else clause.¹¹\n\nExample:\n\n```\nif (NULL\
    \ == p_object)\n{\n    result = ERR_NULL_PTR;\n}\nelse if (p_object = malloc(sizeof(object_t)))\
    \ // No assignments\n{\n    ...\n}\nelse\n{\n    // Normal processing steps, which\
    \ require many lines of code.\n    ...\n}\n```\n\nReasoning: Long clauses can\
    \ distract the human eye from the decision-path logic. By putting the shorter\
    \ clause earlier, the decision path becomes easier to follow. (And easier to follow\
    \ is always good for reducing bugs.) Deeply nested if...else statements are a\
    \ sure sign of a complex and fragile state machine implementation; there is always\
    \ a safer and more readable way to do the same thing.\n\nEnforcement: These rules\
    \ shall be enforced during code reviews.\n\n> ¹¹ This is the equivalent of requiring\
    \ a default case in every switch statement.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_63_0.png)"
  merge: -1
  img_proc: true
- pgno: 64
  md: "# 8.3 Switch Statements\n\nRules:\n\n+   a. The break for each case shall be\
    \ indented to align with the associated case, rather than with the contents of\
    \ the case code block.\nb. All switch statements shall contain a default case.\n\
    c. Any case design designed to fall through to the next shall be commented to\
    \ clearly explain the absence of the corresponding break.\n\nExample:\n\n```\n\
    switch (err)\n{\n    case ERR_A:\n    ...\n    break;\n    case ERR_B:\n    ...\n\
    \    // Also perform the steps for ERR_C.\n    case ERR_C:\n    ...\n    break;\n\
    \    default:\n    ...\n    break;\n}\n```\n\nReasoning: C's switch statements\
    \ are powerful constructs, but prone to errors such as omitted break statements\
    \ and unhandled cases. By aligning the case labels with their break statements\
    \ it is easier to spot a missing break.\n\nEnforcement: These rules shall be enforced\
    \ during code reviews."
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Embedded C Coding Standard\n\n# 8.4 Loops\n\nRules:\n\n+   a. Magic numbers\
    \ shall not be used as the initial value or in the endpoint test of a while, do...while,\
    \ or for loop.\nb. With the exception of the initialization of a loop counter\
    \ in the first clause of a statement and the change to the same variable in the\
    \ third, no assignment shall be made in any loop’s controlling expression.\nc.\
    \ Infinite loops shall be implemented via controlling expression for (;;).\nnd.\
    \ Each loop with an empty body shall feature a set of braces enclosing a comment\
    \ to explain why nothing needs to be done until the loop terminates.\n\nExample:\n\
    \n```\n// Why would anyone bury a magic number (e.g., \"100\") in their code?\n\
    for (int row = 0; row < 100; row++)\n{\n    // Descriptively-named constants prevent\
    \ defects and aid readability.\n    for (int col = 0; col < NUM_COLS; col++)\n\
    \    {\n        ...\n    }\n}\n```\n\nReasoning: It is always important to synchronize\
    \ the number of loop iterations to the size of the underlying data structure.\
    \ Doing this via a descriptively-named constant prevents defects that result when\
    \ changes in one part of the code, such as the dimension of an array, are not\
    \ matched in other areas of the code.\n\nEnforcement: These rules should be enforced\
    \ during code reviews.\n\n> ¹² Note that the sizeof macro is a theoretically handy\
    \ way to dimension an array but that this method does not work when you pass a\
    \ pointer to the array instead of that itself.\n¹³ Kernighan & Ritchie long ago\
    \ recommended for (;; which has the additional benefit of insuring against the\
    \ visually-confusing defect of a while (l); referencing a variable ‘1’.\n\n54"
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 8.5 Jumps


    Rules:


    +   a. The use of goto statements shall be restricted as per Rule 1.7.c.


    +   b. C Standard Library functions abort(), exit(), setjmp(), and longjmp() shall
    not be used.


    Reasoning: Algorithms that utilize jumps to move the instruction pointer can and
    should be rewritten in a manner that is more readable and thus easier to maintain.


    Enforcement: These rules shall be enforced by an automated scan of all modified
    or new modules for inappropriate use of forbidden tokens. To the extent that the
    use of goto is permitted, code reviewers should investigate alternative code structures
    to improve code maintainability and readability.'
