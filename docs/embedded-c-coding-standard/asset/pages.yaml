- pgno: 67
  md: "# Embedded C Coding Standard\n\n# 8.6 Equivalence Tests\n\nRules:\n\n+   -\
    \ When evaluating the equality of a variable against a constant, the constant\
    \ shall always be placed to the left of the equal-to operator (==).\n\nExample:\n\
    \n```\nif (NULL == p_object)\n{\n    return (ERR_NULL_PTR);\n}\n```\n\nReasoning:\
    \ It is always desirable to detect possible typos and as many other coding defects\
    \ as possible at compile-time. Defect discovery in later phases is not guaranteed\
    \ and often also more costly. By following this rule, any compiler will reliably\
    \ detect erroneous attempts to assign (i.e., = instead of ==) a new value to a\
    \ constant.\n\nEnforcement: Many compilers can be configured to warn about suspicious\
    \ assignments (i.e., located where comparisons are more typical). However, ultimate\
    \ responsibility for enforcement of this rule falls to code reviewers.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_67_0.png)"
  merge: -1
  img_proc: true
