- pgno: 19
  md: "Embedded C Coding Standard\n\n# 1 General Rules\n\n# 1.1 Which C?\n\nRules:\n\
    \n+   a. All programs shall be written to comply with the C99 version of the ISO\
    \ C Programming Language Standard.\n\n+   b. Whenever a C++ compiler is used,\
    \ appropriate compiler options shall be set to restrict the language to the selected\
    \ version of ISO C.\n\n+   c. The use of proprietary compiler language keyword\
    \ extensions, #pragma, and inline assembly shall be kept to the minimum necessary\
    \ to get the job done and be localized to a small number of device driver modules\
    \ that interface directly to hardware.\n\n+   d. Preprocessor directive #define\
    \ shall not be used to alter or rename keyword or other aspect of the programming\
    \ language.\n\nExample:\n\n```\n#define begin      // Don’t do something like\
    \ this...\n#define end      } // ... nor this.\n...\nfor (int row = 0; row < MAX_ROWS;\
    \ row++)\nbegin\n  ...\nend                        // Let C be C, not some language\
    \ you once loved.\n```\n\nReasoning: To clearly define the rules in the rest of\
    \ this standard, it is important that we first agree on the baseline programming\
    \ language specification.\n\nEnforcement: These rules shall be enforced via compiler\
    \ setup and code reviews.\n\n> ¹C99-compatible compilers offer many valuable improvements\
    \ over older compilers, such as C++-style comments, Boolean and fixed-width integer\
    \ types, inline functions, and local variable declarations anywhere within a function\
    \ body."
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.2 Line Widths


    Rules:


    +   a. The width of all lines in a program shall be limited to a maximum of 80
    characters.


    Reasoning: From time-to-time, peer reviews and other code examinations are conducted
    on printed pages. To be useful, such print-outs must be free of distracting line
    wraps as well as missing (i.e., past the right margin) characters. Line width
    rules also ease on-screen side-by-side code differing.


    Enforcement: Violations of this rule shall be detected by an automated scan during
    each build.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Embedded C Coding Standard\n\n# 1.3 Braces\n\nRules:\n\n+   a. Braces shall\
    \ always surround the blocks of code (a.k.a., compound statements), following\
    \ if, else, switch, while, do, and for statements; single statements and empty\
    \ statements following these keywords shall also be surrounded by braces.\n\n\
    +   b. Each left brace (( shall appear by itself on the line below the start of\
    \ the block it opens. The corresponding right brace )) shall appear by itself\
    \ in the same position appropriate number of lines later in the file.\n\nExample:\n\
    \n```\n```\nif (depth_in_ft > 10) dive_stage = DIVE_DEEP; // This is legal...\n\
    else if (depth_in_ft > 0)\n    dive_stage = DIVE_SHALLOW; // ... as is this.\n\
    else{\n    // But using braces is always safer.\n    dive_stage = DIVE_SURFACE;\n\
    }\n```\n```\n\nReasoning: There is considerable risk associated with the presence\
    \ of empty statements and single statements that are not surrounded by braces.\
    \ Code constructs like this are often associated with bugs when nearby code is\
    \ changed or commented out. This risk is entirely eliminated by the consistent\
    \ use of braces. The placement of the left brace on the following line allows\
    \ for easy visual checking for the corresponding right brace.\n\nEnforcement:\
    \ The presence of a left brace after each if, else, switch, while, do, and for\
    \ shall be enforced by an automated tool at build time. The same tool or another\
    \ (such as a code beautifier) shall be used to enforce the alignment of braces.\n\
    \n![](img/25b91ff016aae4a7e187afd99b37dc2d_21_0.png)"
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.4 Parentheses


    Rules:


    +   - Do not rely on C’s operator precedence rules, as they may not be obvious
    to those who maintain the code. To clarity, use parentheses (and/or) break long
    statements into multiple lines of (code) to ensure proper execution order within
    a sequence of operations.


    +   - Unless it is a single identifier or constant, each operand of the logical
    AND (&&) & logical OR (||) operators shall be surrounded by parentheses.


    Example:


    ```

    if ((depth_in_cm > 0) && (depth_in_cm < MAX_DEPTH))

    {

    depth_in_ft = convert_depth_to_ft(depth_in_cm);

    }

    ```


    Reasoning: The syntax of the C programming language has many operators. The precedence
    rules that dictate which operators are evaluated before which others are complicated—with
    over a dozen priority levels—and not always obvious to all programmers. When in
    doubt it’s better to be explicit about what you hope the compiler will do with
    your calculations.


    Enforcement: These rules shall be enforced during code reviews.


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_22_0.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Embedded C Coding Standard


    # 1.5 Common Abbreviations


    Rules:


    +   a. Abbreviations and acronyms should generally be avoided unless their meanings
    are widely and consistently understood in the engineering community.


    +   b. A table of project-specific abbreviations and acronyms shall be maintained
    in a version-controlled document.


    **Example:** Appendix A contains a sample table of abbreviations and their meanings.


    **Reasoning:** Programmers too readily use cryptic abbreviations and acronyms
    in their code (and in their resumes!). Just because you know what ZYGXL means
    today doesn’t mean the programmer(s) who have to read/maintain/port your code
    will later be able to make sense of your cryptic names that reference it.


    **Enforcement:** These rules shall be enforced during code reviews.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# 1.6 Casts\n\nRules:\n\n+   a. Each cast shall feature an associated comment\
    \ describing how the code ensures proper behavior across the range of possible\
    \ values on the right side.\n\nExample:\n\n```\nint\nabs (int arg)\n{\n    return\
    \ ((arg < 0) ? -arg : arg);\n}\n...\nuint16_t sample = adc_read(ADC_CHANNEL_1);\n\
    \nresult = abs((int) sample); // WARNING: 32-bit int assumed.\n```\n\nReasoning:\
    \ Casting is dangerous. In the example above, unsigned 16-bit “sample” can hold\
    \ larger positive values than a signed 16-bit integer. In that case, the absolute\
    \ value will be incorrect as well. Thus there is a possible overflow if int is\
    \ only 16-bits, which the ISO C standard permits.\n\nEnforcement: This rule shall\
    \ be enforced during code reviews."
