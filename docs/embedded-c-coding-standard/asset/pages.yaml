- pgno: 86
  md: 'Barr Group''s Embedded C Coding Standard provided the foundation needed by
    Pole/Zero as we developed our own embedded firmware coding standard document.

    Kevin Ehlert, Digital Design Engineer, Pole/Zero


    Barr Group''s training and consulting in coding standards and MISRA C was instrumental
    in Datalight created Reliance Edge file system product for use in safety-critical
    systems.

    Tony Quest, Director of Engineering, Datalight


    The Embedded C Coding Standard saved us considerable time in developing our own
    bug-reducing coding standard.

    Ed Lukas, Electrical Engineering Manager, Chamberlain


    Barr Group''s Embedded C Coding Standard was developed to help firmware engineers
    minimize defects in embedded systems. Unlike the majority of coding standards,
    this standard stands on practical rules that keeps bugs out – including techniques
    to improve the maintainability and portability of embedded software. The rules
    in this coding standard include a set of guiding principles, as well as specific
    naming conventions and other rules for the use of data types, functions, preprocessor
    macros, variables, and other C language constructs. Individual rules that have
    been demonstrated to reduce or eliminate types of defects are highlighted.


    The BARR-standard is distinct from, yet compatible with, the MISRA Guidelines
    for Use of the C Language in Critical Systems. Programmers can combine rules from
    the two standards as needed.


    # About the Author


    Michael Barr is the CTO and co-founder of Barr Group. Mr. Barr is a former professor
    of electrical and computer engineering with hands-software design and implementation
    experience across a range of industries. Internationally recognized as an expert
    in the field of embedded software architecture and development, Barr has testified
    as an expert witness in courts in the U.S. and Canada. Barr is also the author
    of Programming Embedded Systems in C and C++, as well as over seventy articles
    and papers about the design of embedded systems. He has served as editor-in-chief
    of Embedded Systems Programming magazine as well as a member of the advisory board
    and a track chair for the Embedded Systems Conference. Barr holds B.S. and M.S.
    degrees in electrical engineering from the University of Maryland.


