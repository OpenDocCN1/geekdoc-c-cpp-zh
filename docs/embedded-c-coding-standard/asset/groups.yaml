    \ `if`、`else`、`switch`、`while`、`do` 和 `for` 语句之后，大括号应始终包围代码块（即复合语句）；这些关键字后的单语句和空语句也应用大括号包围。\n\
    - b. 每个左大括号 `{` 应单独出现在其所开启代码块起始位置的下一行。对应的右大括号 `}` 应在文件中后续适当行数之后、合适的位置单独占一行。\n\n\
    示例：\n\n```\nif (depth_in_ft > 10) dive_stage = DIVE_DEEP; // 这是合法的...\nelse if\
