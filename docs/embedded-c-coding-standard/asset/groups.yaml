    \n理由：错误使用浮点数存在大量风险。默认情况下，C 将所有浮点常量提升为双精度，这在目标机器上可能是低效或不支持的。然而，许多微控制器没有浮点的硬件支持。\n\
    \n强制：这些规则应在代码审查期间执行。\n\n## 5.5 结构体和联合体\n\n规则：\n\n- a. 对于与外设通信或通过总线或网络与另一个处理器通信的结构体或联合体类型，应采取措施防止编译器插入填充字节。\n\
