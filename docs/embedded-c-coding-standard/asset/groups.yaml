    \ subsequent lines in the most readable manner.\n\nExample:\n\n```c\nsys_error_handler(int\
    \ err)\n{\n    switch (err)\n    {\n        case ERR_THE_FIRST:\n            ...\n\
    \            break;\n\n        default:\n            ...\n            break;\n\
    \    }\n\n    // Purposefully misaligned indentation; see why?\n    if ((first_very_long_comparison_here\n\
    \        && second_very_long_comparison_here)\n        || third_very_long_comparison_here)\n\
    \    {\n        ...\n    }\n}\n```\n\n**Reasoning:** Fewer indentation spaces\
    \ increase the risk of visual confusion while more spaces increases the likelihood\
    \ of line wraps.\n\n**Enforcement:** A tool, such as a code beautifier, shall\
    \ be available to programmers to convert indentations of other sizes in an automated\
    \ manner. This tool shall be used on all new or modified files prior to each build.\n\
    \n## 3.5 Tabs\n\nRules:\n\n- a. The tab character (ASCII 0x09) shall never appear\
    \ within any source code file.\n\nExample:\n\n```c\n// When tabs are needed inside\
    \ a string, use the '\\t' character.\n#define COPYRIGHT \"Copyright (c) 2018 Barr\
    \ Group.\\tAll rights reserved.\"\n\n// When indents are needed in the source\
    \ code, align via spaces instead.\nvoid\n main()\n{\n    // If not, you can encounter\n\
    \    // all sorts\n    // of weird and\n        // uneven\n        // alignment\
    \ of code and comments... across tools.\n}\n```\n\n**Reasoning:** The width of\
    \ the tab character varies by text editor and programmer preference, making consistent\
    \ visual layout a continual source of headaches during code reviews and maintenance.\n\
    \n**Enforcement:** Each programmer should configure his or her code editing tools\
    \ to insert spaces when the TAB key is pressed. The presence of a tab character\
    \ in new or modified code shall be flagged via an automated scan at each build\
    \ or code check-in.\n\nEmbedded C Coding Standard\n\n## 3.6 Non-Printing Characters\n\
    \nRules:\n\n- a. Whenever possible, all source code lines shall end only with\
    \ the single character 'LF' (ASCII 0x0A), not with the pair 'CR'-'LF' (0x0D 0x0A).\n\
    - b. The only other non-printable character permitted in a source code file is\
    \ the form feed character 'FF' (ASCII 0x0C).\n\n**Example:** It's not possible\
    \ to demonstrate non-printing characters in print.\n\n**Reasoning:** The multi-character\
    \ sequence 'CR'-'LF' is more likely to cause problems in a multi-platform development\
    \ environment than the single character 'LF'. One such problem is associated with\
    \ multi-line preprocessor macros on Unix platforms.\n\n**Enforcement:** Whenever\
    \ possible, programmer's editors shall be configured to use LF. In addition, an\
    \ automated tool shall scan all new or modified source code files during each\
    \ build, replacing each CR-LF sequence with an LF.\n\nEmbedded C Coding Standard\n\
    \n## 4. Module Rules\n\n### 4.1 Naming Conventions\n\nRules:\n\n- a. All module\
    \ names shall consist entirely of lowercase letters, numbers, and underscores.\
    \ No spaces shall appear within the module’s header and source file names.\n-\
    \ b. All module names shall be unique in their first 8 characters and end with\
    \ suffixes .h and .c for the header and source file names, respectively.\n- c.\
    \ No module's header file name shall share the name of a header file from the\
    \ C Standard Library or C++ Standard Library. For example, modules should not\
    \ be named “stdio” or “math”.\n- d. Any module containing a main() function shall\
    \ have the word “main” as part of its source file name.\n\n**Example:** See Appendix\
    \ D.\n\n**Reasoning:** Multi-platform development environments (e.g., Unix and\
    \ Windows) are the norm rather than the exception. Mixed case names can cause\
    \ problems across operating systems and are also error prone due to the possibility\
    \ of similarly-named but differently-capitalized files becoming confused by human\
    \ programmers.\n\nThe inclusion of “main” in a file name is an aid to code maintainers\
    \ that have proven useful in projects with multiple software configurations.\n\
    \n**Enforcement:** An automated tool shall confirm that all file names that are\
    \ part of a build are consistent with these rules.\n\nEmbedded C Coding Standard\n\
    \n### 4.2 Header Files\n\nRules:\n\n- There shall always be precisely one header\
    \ file for each source file and they shall always have the root name.\n- Each\
    \ header file shall contain a preprocessor guard against multiple inclusion, as\
    \ shown in the example below.\n- The header file shall identify only the procedures,\
    \ constants, and data types (via prototypes, #define, and typedef, respectively)\
    \ about which it is strictly necessary for other modules to be informed.\n- It\
    \ is a preferred practice that no variable ever be declared (via extern) in a\
    \ header file.\n- No storage for any variable shall be allocated in a header file.\n\
    - No public header file shall contain a #include of any private header file.\n\
    \nExample:\n\n```c\n#ifndef ADC_H\n#define ADC_H\n...\n#endif /* ADC_H */\n```\n\
    \nReasoning: The C language standard gives all variables and functions global\
    \ scope by default. The downside of this is unnecessary (and dangerous) coupling\
    \ between modules. To reduce inter-module coupling, keep as many procedures, constants,\
    \ data types, and variables as possible privately hidden within a module's source\
    \ file.\n\nSee also What Belongs in a C .h Header File?\n\nembeddedguru.com/bar-code/2010/11/what-belongs-in-a-c-h-header-file/\n\
    \nEnforcement: These rules should be enforced during code reviews.\n"
  mdcn: "\n\n- 1. *for* 语句中分隔元素的每个分号后面应始终跟有一个空格。\n- m. 每个分号应紧跟在其终止的语句之后，且前面不能有空格。\n\
    \n**示例：** 参见附录 D。\n\n**理由：** 在源代码中，空白的位置与文本的位置同样重要。合理使用空白可以减轻眼部疲劳，并提高程序员和代码审查人员发现潜在漏洞的能力。\n\
    \n**强制执行：** 程序员在工作时应遵守这些规则，并通过代码格式化工具（例如 GNU Indent）进行强化。\n\n## 3.2 对齐齐\n\n规则：\n\
    \n- a. 一系列声明中的变量名其首字符应当对齐。\n- b. 结构体（struct）和联合体（union）成员名其首字符应当对齐。\n- c. 相邻赋值语句块中的赋值运算符应当对齐。\n\
    - d. 预处理器指令中的 # 应当始终位于行首，尽管指令本身可以在 #if 或 #ifdef 内部进行缩进。\n\n示例：\n\n```c\n#ifdef\
    \ USE_UNICODE_STRINGS\n# define BUFFER_BYTES 128\n#else\n# define BUFFER_BYTES\
    \ 64\n#endif\n\ntypedef struct struct {\n  uint8_t buffer[BUFFER_BYTES];\n  uint8_t\
    \ checksum;\n} string_t;\n```\n\n理由： 视觉上的对齐强调了相似性。包含变量声明的一系列连续行很容易被观察和理解为一组相关的代码块。应根据情况使用空行和不同的对齐方式，在视觉上分离并区分物理上相邻但不相关的代码块。\n\
    \n强制执行：这些规则应在代码审查期间执行。\n\n嵌入式 C 编码标准\n\n## 3.3 空行\n\n规则：\n\n- a. 每行代码不应包含多个语句。\n\
    - b. 在每个自然代码块的前后应有一个空行。自然代码块的示例包括循环、if...else 和 switch 语句以及连续的声明。\n- c. 每个源文件应以一个标记文件结束的注释结尾，并在其后跟一个空行。\n\
    \n示例： 参见附录 D。\n\n**理由：** 合适当的空白放置提供了视觉分离，从而使代码更易阅读和理解，正如本编码标准段落之间的空白区域有助于可读性一样。清晰地标记文件结束对于查看打印输出的人类审查人员很重要，且某些旧编译器可能需要随后的空行。\n\
    \n强制执行：这些规则应在代码审查期间执行。\n\n## 3.4 缩进\n\n规则：\n\n- 每个缩进层级应当相对于行首对齐 4 个字符的倍数。\n- 在\
    \ switch 语句中，case 标签应当对齐；每个 case 块的内容应在此基础上缩进一次。\n- 每当某行代码过长无法适应最大行宽时，以最可读的方式对第二行及任何后续行进行缩进。\n\
    \n示例：\n\n```c\nsys_error_handler(int err)\n{\n    switch (err)\n    {\n      \
    \  case ERR_THE_FIRST:\n            ...\n            break;\n\n        default:\n\
    \            ...\n            break;\n    }\n\n    // 故意未对齐的缩进；知道为什么吗？\n    if\
    \ ((first_very_long_comparison_here\n        && second_very_long_comparison_here)\n\
    \        || third_very_long_comparison_here)\n    {\n        ...\n    }\n}\n```\n\
    \n**理由：** 较少的缩进空间增加了视觉混乱的风险，而更多的空间会增加行换的概率。\n\n**强制执行：** 程序员应可用一种工具（如代码格式化工具），以自动方式转换其他尺寸的缩进。该工具应在每次构建之前用于所有新文件或修改的文件。\n\
    \n## 3.5 Tab 键\n\n规则：\n\n- a. 制表字符（ASCII 0x09）永远不应出现在任何源代码文件中。\n\n示例：\n\n```c\n\
    // 当字符串内部需要 tab 的时候，使用 '\\t' 字符。\n#define COPYRIGHT \"Copyright (c) 2018 Barr\
    \ Group.\\tAll rights reserved.\"\n\n// 当源代码中需要缩进时，请通过空格进行对齐。\nvoid\n main()\n\
    {\n    // 如果不是，你可能会遇到\n    // 各种\n    // 奇怪的\n        // 不均匀的\n        // 代码和注释的对齐...\
    \ 跨工具出现这种情况。\n}\n```\n\n**理由：** Tab 字符的宽度随文本编辑器和程序员的偏好而异，这导致一致的视觉布局成为代码审查和维护期间不断的头疼源。\n\
    \n**强制执行：** 每个程序员都应配置其代码编辑工具，在按下 TAB 键时插入空格。新代码或修改代码中存在 tab 字符应通过每次构建或代码提交时的自动扫描进行标记。\n\
    \n嵌入式 C 编码标准\n\n## 3.6 非打印字符\n\n规则：\n\n- a. 尽可能，所有源代码行应仅以单个字符 'LF'（ASCII 0x0A）结束，而不是以\
    \ 'CR'-'LF'（0x0D 0x0A）结束。\n- b. 源代码文件中允许的唯一其他非打印字符是换页符 'FF'（ASCII 0x0C）。\n\n**示例：**\
    \ 无法通过打印演示非打印字符。\n\n**理由：** 'CR'-'LF' 多字符序列在多平台开发环境中比单字符 'LF' 更容易引起问题。其中一个问题与\
    \ Unix 平台上的多行预处理器宏有关。\n\n**强制执行：** 尽可能，程序员的编辑器应配置为使用 LF。此外，应使用自动工具在每次构建期间扫描所有新或修改的源文件，将每个\
    \ CR-LF 序列替换为 LF。\n\n嵌入式 C 编码标准\n\n## 4. 模块规则\n\n### 4.1 命名规范\n\n规则：\n\n- a. 所有模块名应完全由小写字母、数字和下划线组成。模块头文件和源文件名内部不应空格。\n\
    - b. 所有模块名在前 8 个字符上应该是唯一的，并且头文件和源文件名分别以 .h 和 .c 结尾。\n- c. 任何模块头文件名都不应与 C 标准库或\
    \ C++ 标准库的头文件重名。例如，模块不应命名为“stdio”或“math”。\n- d. 任何包含 main() 函数的模块其源文件名应包含“main”一词。\n\
    \n**示例：** 参见附录 D。\n\n**理由：** 多平台开发环境（例如 Unix 和 Windows）是常态而非例外。混合大小写的名称在不同操作系统之间可能会导致问题，而且由于命名相似但大小写不同的文件可能被人类程序员混淆，因此容易出错。\n\
    \n在文件名中包含“main”对于具有多个软件配置的项目维护者来说是一种帮助。\n\n**强制执行：** 自动工具应确认作为构建部分的文件名称符合这些规则。\n\
    \n嵌入式 C 编码标准\n\n### 4.2 头文件\n\n规则：\n\n- 每个源文件应始终对应一个头文件，且它们应具有根名称。\n- 每个头文件应包含一个防止重复包含的预处理器保护符，如下例所示。\n\
    - 头文件应仅标识其他模块严格需要了解的程序、常量和数据类型（分别通过原型、#define 和 typedef 定义）。\n- 一种优选做法是永远不要在头文件中声明（通过\
    \ extern）任何变量。\n- 头文件中不应为任何变量分配存储。\n- 公共头文件不应包含任何私有头文件的 #include。\n\n示例：\n\n```c\n\
    #ifndef ADC_H\n#define ADC_H\n...\n#endif /* ADC_H */\n```\n\n理由： C 语言标准默认赋予所有变量和函数全局作用域。这种方法的缺点是模块之间存在不必要的（危险的）耦合。为了减少模块耦合，尽可能将许多程序、常量、数据类型和变量私有在模块的源文件中。\n\
    \n另请参见 C .h 头文件中包含什么？\n\nembeddedguru.com/bar-code/2010/11/what-belongs-in-a-c-h-header-file/\n\
    \n强制执行：这些规则应在代码审查期间执行。\n\n"
