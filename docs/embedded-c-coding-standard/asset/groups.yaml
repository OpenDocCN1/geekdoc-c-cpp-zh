  mdcn: "\n\n## 8.5 跳转 (Jumps)\n\n规则：\n\n- a. `goto` 语句的使用应根据规则 1.7.c 进行限制。\n- b.\
    \ 不应使用 C 标准库函数 `abort()`、`exit()`、`setjmp()` 和 `longjmp()`。\n\n理由：利用跳转语句移动指令指针的算法可以并且应该重写为更具可读性的方式，从而易于维护。\n\
    \n执行：这些规则应通过对所有修改或新模块进行自动扫描，检查是否存在不当使用禁止标记的情况来强制执行。在允许使用 `goto` 的范围内，代码审查人员应研究替代代码结构，以提高代码的可维护性和可读性。\n\
    \n## 嵌入式 C 规范\n\n## 8.6 等效性测试\n\n规则：\n\n- 在评估变量与常数的等效性时，常量应始终放在等号运算符 (==) 的左侧。\n\
    \n示例：\n\n```c\nif (NULL == p_object)\n{\n    return (ERR_NULL_PTR);\n}\n```\n\n\
    理由：在编译时尽可能检测可能的拼写错误以及尽可能其他代码缺陷总是理想的。在后期阶段发现缺陷是无法保证的，而且成本更高。通过遵循此规则，任何编译器都能可靠地检测到尝试给常量赋新值（即使用\
    \ `=` 而不是 `==`）的错误。\n\n执行：许多编译器可以配置为对可疑赋值发出警告（即位于通常出现比较的地方）。然而，执行此规则的最终责任在于代码审查人员。\n\
