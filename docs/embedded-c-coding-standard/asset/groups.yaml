  - '[PAGE 22]


    # 1.4 Parentheses


    Rules:


    +   - Do not rely on C’s operator precedence rules, as they may not be obvious
    to those who maintain the code. To clarity, use parentheses (and/or) break long
    statements into multiple lines of (code) to ensure proper execution order within
    a sequence of operations.


    +   - Unless it is a single identifier or constant, each operand of the logical
    AND (&&) & logical OR (||) operators shall be surrounded by parentheses.


    Example:


    ```

    if ((depth_in_cm > 0) && (depth_in_cm < MAX_DEPTH))

