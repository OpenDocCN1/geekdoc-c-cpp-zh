  md: "\n## Embedded C Coding Standard\n\n**Reasoning:** Owing to differences across\
    \ processor families and loose definitions in the ISO C language standards, there\
    \ is a tremendous amount of implementation-defined behavior in the area of structures\
    \ and unions. Bit-fields, in particular, suffer from severe portability problems,\
    \ including the lack of a standard bit ordering and no official support for the\
    \ fixed-width integer types they so often call out to be used with. The methods\
    \ available to check the layout of such data structures include static assertions\
    \ or other compile-time checks as well as the use of preprocessor directives,\
    \ e.g., to select one of two competing struct layouts based on the compiler.\n\
    \n**Enforcement:** These rules shall be enforced during code reviews.\n\n## 5.6\
    \ Booleans\n\nRules:\n\n- a. Boolean variables shall be declared as type bool.\n\
    - b. Non-Boolean values shall be converted to Boolean value via use of relational\
    \ operators (e.g., < or !=), not via casts.\n\nExample:\n\n```c\n#include <stdbool.h>\n\
    ...\n```\n\n```c\nbool b_in_motion = (0 != speed_in_mph);\n```\n\nReasoning: The\
    \ C90 standard did not define a data type for Boolean variables and programmers\
    \ have widely treated any non-zero integer value as true. The C99 language standard\
    \ is backward compatible with this old style, but also introduced a new data type\
    \ for Boolean variables along with new constants true and false in the stdbool.h\
    \ header file.\n\nEnforcement: These rules shall be enforced during code reviews.\n\
    \n## Embedded C Coding Standard\n\n## 6 Procedure Rules\n\n### 6.1 Naming Conventions\n\
    \nRules:\n\n- a. No procedure shall have a name that is a keyword of any standard\
    \ version of the C or C++ programming language. Restricted names include interrupt,\
    \ inline, class, true, false, public, private, friend, and many others.\n- b.\
    \ No procedure shall have a name that overlaps a function in the C Standard Library.\
    \ Examples of such names include strlen, atoi, and memset.\n- c. No procedure\
    \ shall have a name that begins with an underscore.\n- d. No procedure name shall\
    \ be longer than 31 characters.\n- e. No function name shall contain any uppercase\
    \ letters.\n- f. No macro name shall contain any lowercase letters.\n- g. Underscores\
    \ shall be used to separate words in procedure names.\n- h. Each procedure's name\
    \ should be descriptive of its purpose. Note that procedures benefit from the\
    \ use of verbs in their names (e.g., adc_read()); this “noun-verb” word ordering\
    \ is recommended. Alternatively, procedures may be named according to the question\
    \ they answer (e.g., led_is_on()).\n- i. The names of all public functions shall\
    \ be prefixed by their module name and an underscore (e.g., sensor_read()).\n\n\
    **Example:** Append D.\n\n**Reasoning:** Good function names make reviewing and\
    \ maintaining code easier (and thus cheaper). The data (variables) in programs\
    \ are nouns. Functions manipulate data and are thus verbs. The use of module prefixes\
    \ is in keeping with the important goal of encapsulation and helps avoid procedure\
    \ name overlaps.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_51_0.png)\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_51_1.png)\n\
    \n**Enforcement:** Compliance with these naming rules shall be established in\
    \ the detailed design phase and be enforced during code reviews.\n\n## Embedded\
    \ C Coding Standard\n\n### 6.2 Functions\n\nRules:\n\n- All reasonable effort\
    \ shall be taken to keep the length of each function limited to one printed page,\
    \ or a maximum of 100 lines.\n- Whenever possible, all functions shall be made\
    \ to start at the top of a printed page, except when several small functions fit\
    \ onto a single page.\n- It is a preferred practice that all functions shall have\
    \ just one exit point and shall be via a return at the bottom of the function.\n\
    - A prototype shall be declared for each public function in the module header\
    \ file.\n- All private functions shall be declared static.\n- Each parameter shall\
    \ be explicitly declared and meaningfully named.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_53_0.png)\n\
    \n> One way this can be accomplished is to insert a form feed character 'FF' (ASCII\
    \ 0x0C) at the beginning of the first line on the comment block that precedes\
    \ the function definition.\n\n**Example:**\n\n```c\nint\nstate_change (int event)\n\
    {\n    int result = ERROR;\n\n    if (EVENT_A == event)\n    {\n        result\
    \ = STATE_A;\n    }\n    else\n    {\n        result = STATE_B;\n        return\
    \ (result);\n    }\n}\n```\n\n**Reasoning:** Code reviews take place at the function\
    \ level and often on paper. Each function should ideally be visible on a single\
    \ printed page, so that flipping papers back and forth does not distract the reviewers.\n\
    \nMultiple return statements should be used only when it improves the readability\
    \ of the code.\n\n**Enforcement:** Compliance with these rules shall be checked\
    \ during code reviews.\n\n## Embedded C Coding Standard\n\n### 6.3 Function-Like\
    \ Macros\n\nRules:\n\n- a. Parameterized macros shall not be used if a function\
    \ can be written to accomplish the same behavior.\n- b. If parameterized macros\
    \ are used for some reason, these rules apply:\n    i. Surround the entire macro\
    \ body with parentheses.\n    ii. Surround each use of a parameter with parentheses.\n\
    \    iii. Use each parameter no more than once, to avoid unintended side effects.\n\
    \    iv. Never include a transfer of control (e.g., return keyword).\n\nExample:\n\
    \n```c\n// Don't do this ...\n#define MAX(A, B) ((A) > (B) ? (A) : (B))\n```\n\
    \n```c\n// ... when you can do this instead.\ninline int max(int num1, int num2)\n\
    ```\n\nReasoning: There are a lot of risks associated with the use of preprocessor\
    \ defines, and many of them relate to the creation of parameterized macros. The\
    \ extensive use of parentheses (as shown in the example) is important, but does\
    \ not eliminate the unintended double increment possibility of a call such as\
    \ MAX(i++, j++). Other risks of macro misuse include comparison of signed and\
    \ unsigned data or any test of floating-point data. Making matters worse, macros\
    \ are invisible at run-time and thus impossible to step into.\n\nEnforcement:\
    \ These rules shall be enforced during code reviews.\n\n## 6.4 Threads of Execution\n\
    \nRules:\n\n- a. All functions that encapsulate threads of execution (a.e., tasks,\
    \ processes) shall be given names ending with \"_thread\".\n\nExample:\n\n```c\n\
    void alarm_thread (void * p_data)\n{\n    int alarm = ALARM_NONE;\n    int err\
    \ = OS_ERR;\n\n    for (;;)\n    {\n        alarm = OSMboxPend(&err);\n    }\n\
    }\n```\n\n**Reasoning:** Each task in a real-time operating system (RTOS) is like-main(),\
    \ running forever.\n\nEnforcement: This rule shall be followed during the detailed\
    \ design and enforced during code reviews.\n\n## Embedded C Coding Standard\n\n\
    ### 6.5 Interrupt Service Routines\n\nRules:\n\n- a. Interrupt service routines\
    \ (ISRs) are not ordinary functions. The compiler must be informed that the function\
    \ is an ISR by way of a #pragma or compiler-specific keyword, such as `__interrupt`.\n\
    - b. All functions that implement ISRs shall be given names ending with `_isr`.\n\
    - c. To ensure that ISRs are not inadvertently called from other parts of the\
    \ software (they may corrupt the call stack), each ISR shall be declared static\
    \ and/or be located at the end of the driver module as permitted by the target\
    \ platform.\n- d. A stub or default ISR shall be installed in the vector table\
    \ at the location of all unexpected or otherwise unhandled interrupt sources.\
    \ Each such stub could attempt to disable interrupts of the same type, say at\
    \ the interrupt controller, and assert().\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_57_0.png)\n\
    \nExample:\n\n```c\n#pragma irq_entry\nvoid timer_isr (void)\n{\n    uint8_t static\
    \ prev = 0x00; // prev button states\n    uint8_t curr = *gp_button_reg; // curr\
    \ button states\n\n    // Compare current and previous button states.\n    g_debounced\
    \ |= (prev & curr); // record all closes\n    g_debounced &= (prev | curr); //\
    \ record all opens\n\n    // Save current pin states for next interrupt\n    prev\
    \ = curr;\n}\n```\n\nReasoning: An ISR is an extension of the hardware. By definition,\
    \ it and the straight-line code are asynchronous to each other. If they share\
    \ global variables or registers, those singleton objects must be protected via\
    \ interrupt disables in the straight-line code. The ISR must not get hung up inside\
    \ the operating system or waiting for a variable or register to change value.\n\
    \nNote that platform-specific ISR installation steps may vary and may require\
    \ ISR functions to be prototypes and in other ways to be visible to at least one\
    \ other function.\n\nAlthough stub interrupt handlers don't directly prevent defects,\
    \ they can certainly make a system more robust in real-world operating conditions.\n\
    \n**Enforcement:** These rules shall be enforced during code reviews.\n"
  mdcn: "\n\n## 嵌入式 C 编码规范\n\n**原理：** 由于于不同处理器家族之间的差异以及 ISO C 语言标准的定义松散，在结构体和联合体领域存在大量由实现定义的行为。特别是位域（Bit-fields），面临着严重的移植性问题，包括缺乏标准的位排序，并且没有对它们经常经常调用的固定宽度整数类型提供官方支持。检查此类数据结构布局的方法包括静态断言（static\
    \ assertions）或其他编译时检查，以及使用预处理器指令（例如，根据编译器在两种互为竞争的结构体布局中选择其一）。\n\n**执行：** 这些规则应在代码审查期间强制执行。\n\
    \n## 5.6 布尔值\n\n规则：\n\n-   a. 布尔变量应被声明为 `bool` 类型。\n-   b. 非布尔值应通过使用关系运算符（例如，`<`\
    \ 或 `!=`）转换为布尔值，而不是通过强制类型转换。\n\n示例：\n\n```c\n#include <stdbool.h>\n...\n```\n\n\
    ```c\nbool b_in_motion = (0 != speed_in_mph);\n```\n\n**原理：** C90 标准没有为布尔变量定义数据类型，程序员广泛将任何非零整数值视为\
    \ `true`。C99 语言标准与这种旧样式兼容，但同时也引入了布尔变量的新数据类型，以及在 `stdbool.h` 头文件中的新常量 `true` 和\
    \ `false`。\n\n**执行：** 这些规则应在代码审查期间强制执行。\n\n## 嵌入式 C 编码规范\n\n## 6 过程规则\n\n### 6.1\
    \ 命名规范\n\n规则：\n\n-   a. 任何过程名称都不应是 C 或 C++ 编程语言任何版本的关键字。受限名称包括 `interrupt`、`inline`、`class`、`true`、`false`、`public`、`private`、`friend`\
    \ 等。\n-   b. 任何过程名称不能与 C 标准库中的函数重叠。此类名称示例包括 `strlen`、`atoi` 和 `memset`。\n-   c.\
    \ 任何过程名称不能以下划线开头。\n-   d. 过程名称长度不应超过 31 个字符。\n-   e. 任何函数名不应包含任何大写字母。\n-   f.\
    \ 任何宏名不应包含任何小写字母。\n-   g. 过程名称应用下划线来分隔单词。\n-   h. 每个过程的名称应描述其用途。注意，过程受益于在名称中使用动词（例如，`adc_read()`）；推荐这种“名词-动词”的词序。或者，过程也可以根据其回答的问题进行命名（例如，`led_is_on()`）。\n\
    -   i. 所有公共函数的名称应以其模块名和下划线作为前缀（例如，`sensor_read()`）。\n\n**示例：** 附加 D。\n\n**原理：**\
    \ 良好的函数名可以让代码审查和维护变得更容易（从而使成本更低）。程序中的数据（变量）是名词。函数操作数据，因此是动词。使用模块前缀符合封装这一重要目标，有助于避免过程名称重叠。\n\
    \n![](img/25b91ff016aae4a7e187afd99b37dc2d_51_0.png)\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_51_1.png)\n\
    \n**执行：** 这些命名规则的遵守情况应在详细设计阶段确定，并在代码审查期间强制执行。\n\n## 嵌入式 C 编码规范\n\n### 6.2 函数\n\
    \n规则：\n\n-   应尽一切努力将每个函数的长度限制在一个页打印纸内，或最多 100 行。\n-   尽可能，所有函数都应设从打印页的顶部开始，除非几个小函数可以挤在单页内。\n\
    -   一种首选做法是所有函数都应只有一个出口，且应通过函数底部的 `return` 实现。\n-   在模块头文件中，应为每个公共函数声明原型。\n- \
    \  所有私有函数都应声明为 `static`。\n-   每个参数都应显式声明并赋予有意义的名称。\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_53_0.png)\n\
    \n> 实现这一目标的一种方法是在函数定义之前的注释块的第一行开头插入换页符 'FF'（ASCII 0x0C）。\n\n**示例：**\n\n```c\n\
    int\nstate_change (int event)\n{\n    int result = ERROR;\n\n    if (EVENT_A ==\
    \ event)\n    {\n        result = STATE_A;\n    }\n    else\n    {\n        result\
    \ = STATE_B;\n        return (result);\n    }\n}\n```\n\n**原理：** 代码审查是在函数级别进行的，且通常在纸上进行。每个函数理想情况下应该在单打印页上可见，这样来回纸张就不会分散审查者的注意力。\n\
    \n只有在能提高代码可读性时，才使用多个返回语句。\n\n**执行：** 这些规则的遵守情况应在代码审查期间检查。\n\n## 嵌入式 C 编码规范\n\n\
    ### 6.3 类函数宏\n\n规则：\n\n-   a. 如果可以编写函数来实现相同的行为，则不应使用参数化宏。\n-   b. 如果由于原因使用了参数化宏，则适用以下规则：\n\
    \    i. 用括号包裹整个宏体。\n    ii. 用括号包裹每个对参数的使用。\n    iii. 每个参数的使用次数不要超过一次，以避免无意的副作用。\n\
    \    iv. 使用每个参数不要超过一次。\n\n示例：\n\n```c\n#define MAX(A, B) ((A) > (B) ? (A) : (B))\n\
    ```\n\n```c\n// ...\ninline max(int num1, int num2)\n```\n\n**原理：** 存在许多与使用实现定义相关的风险，例如如所示的宏误用。使用模块前缀符合封装这一重要目标，有助于避免过程名称重叠。宏在运行时是不可进入的。\n\
    \n**执行：** 这些规则应在代码审查期间强制执行。\n\n## 6.4 执行线程\n\n规则：\n\n-   a. 所有封装执行的函数（例如任务、进程）应以\
    \ `_thread` 结尾。\n\n示例：\n\n```c\nvoid thread (void * p_data)\n{\n    int alarm\
    \ = ALARM_NONE;\n    int err = OS_ERR;\n\n    for (;;)\n    {\n        alarmPend(&err);\n\
    \    }\n}\n```\n\n**原理：** 运行。\n\n**执行：** 这一规则应在详细设计期间遵循。\n\n## 嵌入式 C 编码规范\n\n\
    ### 6.5 中断服务程序\n\n规则：\n\n-   a. 中断服务程序（ISR）不是普通函数。必须通过 #pragma 或编译器特定的关键字（如 `__interrupt`）告知编译器函数是\
    \ ISR。\n-   b. 所有实现 ISR 的函数应以 `_isr` 结尾。\n-   c. 为了确保 ISR 不会被软件的其他部分意外调用（它们可能会破坏调用栈），每个\
    \ ISR 都应声明为 `static` 并/或位于驱动模块的末尾。\n-   d. 应在所有意外或其他未处理的中断源的向量表中安装存根或默认 ISR。此类存根可以尝试禁用相同类型的中断，例如在控制器处并调用\
    \ `assert()`。\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_57_0.png)\n\n示例：\n\n\
    ```c\n#pragma irq_entry\nvoid timer_isr (void)\n{\n    uint8_t static prev = 0x00;\
    \ // 之前的按钮状态\n    uint8_t curr = *gp_button_reg; // 当前按钮状态\n\n    // 比较当前和之前的按钮状态\n\
    \    g_debounced |= (prev & curr); // 记录所有关闭\n    g_debounced &= (prev | curr);\
    \ // 记录所有开启\n\n    // 保存引脚状态供下次中断\n    prev = curr;\n}\n```\n\n**原理：** ISR 是硬件的扩展。根据定义，它与直行代码是异步的。如果它们共享全局变量或寄存器，则这些单例对象必须通过直行代码中的禁用中断来保护。ISR\
    \ 不得挂在操作系统内部或等待变量或寄存器值的改变。\n\n"
