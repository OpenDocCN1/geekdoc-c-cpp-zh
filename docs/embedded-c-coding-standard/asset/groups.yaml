    \n### 1.4 括号\n\n规则：\n\n- 不要依赖 C 语言运算符优先级规则，因为它们对于维护代码的人来说可能并不显而易见。为了清晰起见，使用括号（和/或）将长语句拆分为多行\
    \ `(code)`，以确保操作序列内正确的执行顺序。\n- 除非是单个标识符或常量，否则逻辑与 (`&&`) 运算符和逻辑或 (`||`) 运算符的每个操作数都应用括号包围。\n\
    \n示例：\n\n```\nif ((depth_in_cm > 0) && (depth_in_cm < MAX_DEPTH))\n{\ndepth_in_ft\
    \ = convert_depth_to_ft(depth_in_cm);\n}\n```\n\n理由：C 编程语言的语法有很多运算符。决定哪些运算符先于其他运算符求值的优先级规则非常复杂——有十多个优先级级别——而且对于所有程序员来说并不总是显而易见的。当不确定时，明确你希望编译器对你的计算进行什么处理会比较好。\n\
    \n执行：这些规则应在代码审查期间强制执行。\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_22_0.png)\n\
    \n嵌入式 C 编码规范\n\n### 1.5 常见缩写\n\n规则：\n\n- a. 除非其含义在工程社区中被广泛且一致地理解，否则通常应避免缩写和术语。\n\
    - b. 应在版本控制文档中维护一份项目特定的缩写和术语表。\n\n**示例：** 附录 A 包含一个缩写及其含义的示例表。\n\n**理由：** 程序员在代码中（以及简历中！）太容易使用晦涩的缩写和术语了。你今天知道\
