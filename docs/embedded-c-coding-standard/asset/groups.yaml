  - '[PAGE 49]


    Embedded C Coding Standard


    **Reasoning:** Owing to differences across processor families and loose definitions
    in the ISO C language standards, there is a tremendous amount of implementation-defined
    behavior in the area of structures and unions. Bit-fields, in particular, suffer
    from severe portability problems, including the lack of a standard bit ordering
    and no official support for the fixed-width integer types they so often call out
    to be used with. The methods available to check the layout of such data structures
    include static assertions or other compile-time checks as well as the use of preprocessor
    directives, e.g., to select one of two competing struct layouts based on the compiler.


    **Enforcement:** These rules shall be enforced during code reviews.'
  - '[PAGE 50]


    # 5.6 Booleans


    Rules:


    +   a. Boolean variables shall be declared as type bool.


    +   b. Non-Boolean values shall be converted to Boolean value via use of relational
    operators (e.g., < or !=), not via casts.


    Example:


    ```

    #include <stdbool.h>

    ...

    ```


    ```

    bool b_in_motion = (0 != speed_in_mph);

    ```


    Reasoning: The C90 standard did not define a data type for Boolean variables and
    programmers have widely treated any non-zero integer value as true. The C99 language
    standard is backward compatible with this old style, but also introduced a new
    data type for Boolean variables along with new constants true and false in the
    stdbool.h header file.


    Enforcement: These rules shall be enforced during code reviews.'
  - '[PAGE 51]


    # Embedded C Coding Standard


    # 6 Procedure Rules


    # 6.1 Naming Conventions


    Rules:


    +   a. No procedure shall have a name that is a keyword of any standard version
    of the C or C++ programming language. Restricted names include interrupt, inline,
    class, true, false, public, private, friend, and many others.


    +   b. No procedure shall have a name that overlaps a function in the C Standard
    Library. Examples of such names include strlen, atoi, and memset.


    +   c. No procedure shall have a name that begins with an underscore.


    +   d. No procedure name shall be longer than 31 characters.


    +   e. No function name shall contain any uppercase letters.


    +   f. No macro name shall contain any lowercase letters.


    +   g. Underscores shall be used to separate words in procedure names.


    +   h. Each procedure''s name should be descriptive of its purpose. Note that
    procedures benefit from the use of verbs in their names (e.g., adc_read()); this
    “noun-verb” word ordering is recommended. Alternatively, procedures may be named
    according to the question they answer (e.g., led_is_on()).


    +   i. The names of all public functions shall be prefixed by their module name
    and an underscore (e.g., sensor_read()).


    **Example:** Append D.


    **Reasoning:** Good function names make reviewing and maintaining code easier
    (and thus cheaper). The data (variables) in programs are nouns. Functions manipulate
    data and are thus verbs. The use of module prefixes is in keeping with the important
    goal of encapsulation and helps avoid procedure name overlaps.


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_51_0.png)


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_51_1.png)'
  - '[PAGE 52]


    **Enforcement:** Compliance with these naming rules shall be established in the
    detailed design phase and be enforced during code reviews.'
  - '[PAGE 53]


    Embedded C Coding Standard


    # 6.2 Functions


    Rules:


    +   - All reasonable effort shall be taken to keep the length of each function
    limited to one printed page, or a maximum of 100 lines.


    +   - Whenever possible, all functions shall be made to start at the top of a
    printed page, except when several small functions fit onto a single page.


    +   - It is a preferred practice that all functions shall have just one exit point
    and shall be via a return at the bottom of the function.


    +   - A prototype shall be declared for each public function in the module header
    file.


    +   - All private functions shall be declared static.


    +   - Each parameter shall be explicitly declared and meaningfully named.


    ![](img/25b91ff016aae4a7e187afd99b37dc2d_53_0.png)


    > One way this can be accomplished is to insert a form feed character ''FF'' (ASCII
    0x0C) at the beginning of the first line on the comment block that precedes the
    function definition.'
  - "[PAGE 54]\n\n# Example:\n\n```\nint\nstate_change (int event)\n{\n    int result\
    \ = ERROR;\n\n    if (EVENT_A == event)\n    {\n        result = STATE_A;\n  \
    \  }\n    else\n    {\n        result = STATE_B;\n        return (result);\n \
    \   }\n}\n```\n\n**Reasoning:** Code reviews take place at the function level\
    \ and often on paper. Each function should ideally be visible on a single printed\
    \ page, so that flipping papers back and forth does not distract the reviewers.\n\
    \nMultiple return statements should be used only when it improves the readability\
    \ of the code.\n\n**Enforcement:** Compliance with these rules shall be checked\
    \ during code reviews."
  - "[PAGE 55]\n\nEmbedded C Coding Standard\n\n# 6.3 Function-Like Macros\n\nRules:\n\
    \n+   a. Parameterized macros shall not be used if a function can be written to\
    \ accomplish the same behavior.\n\n+   b. If parameterized macros are used for\
    \ some reason, these rules apply:\n   i. Surround the entire macro body with parentheses.\n\
    \   ii. Surround each use of a parameter with parentheses.\n   iii. Use each parameter\
    \ no more than once, to avoid unintended side effects.\n   iv. Never include a\
    \ transfer of control (e.g., return keyword).\n\nExample:\n\n```\n// Don't do\
    \ this ...\n#define MAX(A, B) ((A) > (B) ? (A) : (B))\n```\n\n```\n// ... when\
    \ you can do this instead.\ninline int max(int num1, int num2)\n```\n\nReasoning:\
    \ There are a lot of risks associated with the use of preprocessor defines, and\
    \ many of them relate to the creation of parameterized macros. The extensive use\
    \ of parentheses (as shown in the example) is important, but does not eliminate\
    \ the unintended double increment possibility of a call such as MAX(i++, j++).\
    \ Other risks of macro misuse include comparison of signed and unsigned data or\
    \ any test of floating-point data. Making matters worse, macros are invisible\
    \ at run-time and thus impossible to step into the debugger.\n\nWhere performance\
    \ is important, note that C99 added C++’s inline keyword.\n\nEnforcement: These\
    \ rules shall be enforced during code reviews."
  - "[PAGE 56]\n\n# 6.4 Threads of Execution\n\nRules:\n\n+   a. All functions that\
    \ encapsulate threads of execution (a.k.a., tasks, processes) shall be given names\
    \ ending with \"_thread\" (or \"_task\",\"_process\").\n\nExample:\n\n```\nvoid\n\
    alarm_thread (void * p_data)\n{\n    alarm_t alarm = ALARM_NONE;\n    int err\
    \ = OS_NO_ERR;\n\n    for (;;)\n{\n        alarm = OSMboxPend(alarm_mbox, &err);\n\
    \        // Process alarm here.\n    }\n}\n```\n\n**Reasoning:** Each task in\
    \ a real-time operating system (RTOS) is like a mini-main(), typically running\
    \ forever in an infinite loop. It is valuable to easily identify these important,\
    \ asynchronous functions during code reviews and debugging sessions.\n\n**Enforcement:**\
    \ This rule shall be followed during the detailed design phase and enforced during\
    \ code reviews."
  - '[PAGE 57]


    # Embedded C Coding Standard


    # 6.5 Interrupt Service Routines


    Rules:


    +   a. Interrupt service routines (ISRs) are not ordinary functions. The compiler
    must be informed that the function is an ISR by way of a #pragma or compiler-specific
    keyword, such as `__interrupt`.


    +   b. All functions that implement ISRs shall be given names ending with `_isr`.


    +   c. To ensure that ISRs are not inadvertently called from other parts of the
    software (they may corrupt the CPU and call stack if this happens), each ISR function
    shall be declared static and/or be located at the end of the associated driver
    module as permitted by the target platform.


    +   d. A stub or default ISR shall be installed in the vector table at the location
    of all unexpected or otherwise unhandled interrupt sources. Each such stub could
    attempt to disable interrupts of the same type, say at the interrupt controller,
    and assert().


