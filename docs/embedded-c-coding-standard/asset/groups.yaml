  md: "\n## 8.5 Jumps\n\nRules:\n\n- a. The use of goto statements shall be restricted\
    \ as per Rule 1.7.c.\n- b. C Standard Library functions abort(), exit(), setjmp(),\
    \ and longjmp() shall not be used.\n\nReasoning: Algorithms that utilize jumps\
    \ to move the instruction pointer can and should be rewritten in a manner that\
    \ is more readable and thus easier to maintain.\n\nEnforcement: These rules shall\
    \ be enforced by an automated scan of all modified or new modules for inappropriate\
    \ use of forbidden tokens. To the extent that the use of goto is permitted, code\
    \ reviewers should investigate alternative code structures to improve code maintainability\
    \ and readability.\n\n## Embedded C Coding Standard\n\n## 8.6 Equivalence Tests\n\
    \nRules:\n\n- When evaluating the equality of a variable against a constant, the\
    \ constant shall always be placed to the left of the equal-to operator (==).\n\
    \nExample:\n\n```c\nif (NULL == p_object)\n{\n    return (ERR_NULL_PTR);\n}\n\
    ```\n\nReasoning: It is always desirable to detect possible typos and as many\
    \ other coding defects as possible at compile-time. Defect discovery in later\
    \ phases is not guaranteed and often also more costly. By following this rule,\
    \ any compiler will reliably detect erroneous attempts to assign (i.e., = instead\
    \ of ==) a new value to a constant.\n\nEnforcement: Many compilers can be configured\
    \ to warn about suspicious assignments (i.e., located where comparisons are more\
    \ typical). However, ultimate responsibility for enforcement of this rule falls\
    \ to code reviewers.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_67_0.png)\n\n\
