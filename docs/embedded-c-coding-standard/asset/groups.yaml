    # About Barr Group


    Barr Group, the Embedded Systems Experts*, is an independent provider of engineering
    consulting and training services for the embedded systems industry. Barr Group
    has developed and published this bug-killing coding standard as part of its mission
    to help product design engineers improve the overall reliability and security
    of their embedded systems.


