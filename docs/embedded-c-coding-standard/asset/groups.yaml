    Barr Group《嵌入式 C 编码标准》旨在帮助固件工程师尽可能减少嵌入式系统的缺陷。与大多数编码标准不同，该标准建立在防止 Bug 的实用规则之上——包括提高嵌入式软件可维护性和可移植性的技术。该编码标准中的规则包括一套指导原则，以及针对数据类型、函数、预处理器宏、变量和其他
    C 语言构造的特定命名规范和其他规则。对于证明能够减少或消除某些类型缺陷的单独规则进行了重点标记。


    BARR 标准与《关键系统中 C 语言使用的 MISRA 指南》虽有不同，但又是相互兼容的。程序设计人员可以根据需要结合这两个标准中的规则。


