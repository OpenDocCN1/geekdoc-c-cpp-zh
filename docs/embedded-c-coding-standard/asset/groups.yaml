  - '[PAGE 25]


    Embedded C Coding Standard


    # 1.7 Keywords to Avoid


    Rules:


    +   a. The auto keyword shall not be used.


    +   b. The register keyword shall not be used.


    +   c. It is a preferred practice to avoid all use of the goto keyword. If goto
    is used it shall only jump to a label declared later in the same or an enclosing
    block.


    +   d. It is a preferred practice to avoid all use of the continue keyword.


    Reasoning: The auto keyword is an unnecessary historical feature of the language.
    The register keyword presumes the programmer is smarter than the compiler. There
    is no compelling reason to use either of these keywords in modern programming
    practice.


    The keywords goto and continue still serve purposes in the language, but their
    use too often results in spaghetti code. In particular, the use of goto to make
    jumps orthogonal to the ordinary control flows of the structured programming paradigm
    is problematic. The occasional use of goto to handle an exceptional circumstance
    is acceptable if it simplifies and clarifies the code.


    Enforcement: The presence of forbidden keywords in new or modified source code
    shall be detected and reported via an automated tool at each build. To the extent
    that the use of goto or continue is permitted, code reviewers should investigate
    alternative code structures to improve code maintainability and readability.'
  - '[PAGE 26]


    # 1.8 Keywords to Frequent


    Rules:


    +   a. The static keyword shall be used to declare all functions and variables
    that do not need to be visible outside of the module in which they are declared.


    +   b. The const keyword shall be used whenever appropriate. Examples include:

    i. To declare variables that should not be changed after initialization,

    ii. To define call-by-reference function parameters that should not be modified
    (e.g., char const * param),

    iii. To define fields in a struct or union that should not be modified (e.g.,
    in a struct overlay for memory-mapped I/O peripheral registers), and

    iv. As a strongly typed alternative to #define for numerical constants.


    +   c. The volatile keyword shall be used whenever appropriate. Examples include:

    i. To declare a global variable accessible (by current use or scope) by any interrupt
    service routine,

    ii. To declare a global variable accessible (by current use or scope) by two or
    more threads,

    iii. To declare a pointer to a memory-mapped I/O peripheral register set (e.g.,
    timer_t volatile * const p_timer), and

    iv. To declare a delay loop counter.'
