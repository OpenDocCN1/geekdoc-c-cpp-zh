    {\n    return ((arg < 0) ? -arg : arg);\n}\n...\nuint16_t sample = adc_read(ADC_CHANNEL_1);\n\
    \nresult = abs((int) sample); // WARNING: 32-bit int assumed.\n```\n\nReasoning:\
    \ Casting is dangerous. In the example above, unsigned 16-bit “sample” can hold\
