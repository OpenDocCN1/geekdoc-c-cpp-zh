  mdcn: "\n\n嵌入式 C 编码规范\n\n## 7 变量规则\n\n### 7.1 命名规范\n\n规则：\n\n- a. 变量名称都不应是 C、C++\
    \ 或任何其他已知 C 编程语言扩展的关键字，特别是 K&R C 和 C99。受限名称包括 interrupt、inline、restrict、class、true、false、public、private、friend\
    \ 和 protected。\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_59_0.png)\n\n- b. 变量名称都不应与\
    \ C 标准库中的变量名（例如 errno）重叠。\n\n- c. 任何变量名都不应以下划线开头。\n\n- d. 变量名长度不能超过 31 个字符。\n\n\
    - e. 变量名长度不能少 3 个字符，包括循环计数器。\n\n- f. 变量名不应包含任何大写字母。\n\n- g. 变量名不应包含任何在其他地方指出的数值，例如数组的元素个数或底层类型的位宽。\n\
    \n- h. 应使用下划线来分隔变量名中的单词。\n\n- i. 每个变量名都应描述其用途。\n\n- j. 任何全局变量的名称应以字母 ‘g’开头。例如：g_zero_offset。\n\
    \n- k. 任何指针变量的名称应以字母 ‘p’开头。例如：p_led_reg。\n\n- l. 任何二级指针变量的名称应以字母 ‘pp’开头。例如：pp_vector_table。\n\
    \n- m. 所有包含布尔信息（包括 0 与非零）的整数变量名称应以字母 ‘b’开头，并以其回答的问题形式命名。例如：b_done_leet 或 b_is_buffer_full。\n\
    \n- n. 任何代表对象非指针句柄（例如文件句柄）的变量名称应以字母 ‘h’开头。例如：h_input_file。\n\n- o. 在变量名需要多个上述前缀的情况下，它们在第一个下划线之前的包含顺序应为\
    \ [q|p|pp|b|h]。\n\n**示例：** 参见附录 D。\n\n**理由：** 采用这些基本规则是为了最大程度地提高跨编译器的移植性。许多 C\
    \ 编译器仅识别变量名中前 31 个字符的差异，并预留以下划线开头的名称用于内部名称。\n\n其他规则旨在突出风险并确保变量的一致正确使用。例如，所有涉及全局变量和其他单例对象（包括外设寄存器）使用的代码都需要仔细考虑，以确保不会通过异步写入产生竞态条件或数据损坏。\n\
    \n**执行：** 这些规则应在代码审查期间执行。\n\n嵌入式 C 编码规范\n\n## 7.2 初始化\n\n规则：\n\n- a. 所有变量在在使用前均应进行初始化。\n\
    - b. 最好在需要时再定义局部变量，而不是全部放在函数顶部。\n- c. 如果使用了项目级或文件级全局变量，它们的定义应组合在一起并放在源文件的顶部。\n\
    - d. 任何缺少初始地址的指针变量应初始化为 NULL。\n\n示例：\n\n```\nuint32_t g_array[NUM_ROWS][NUM_COLS]\
    \ = { ... };\n\nfor (int col = 0; col < NUM_COLS; col++)\n{\n    g_array[row][col]\
    \ = ...;\n}\n```\n\n理由：太多的程序员假设 C 运行时会为他们留意，例如在系统启动时将未初始化变量的值置零。这是一个糟糕的假设，在任务关键型系统中会被证明是危险的。为了可读性，最好将局部变量声明在尽可能靠近其首次使用的地方¹，C99\
    \ 通过引入 C++ 的早期功能使得这成为可能。\n\n执行：应使用自动化工具在每次构建前前扫描所有源代码，对在初始化之前使用的变量发出告警；静态分析工具可以做到此点。其余规则应在代码审查期间执行。\n\
    \n> ¹ [Uwano] 描述了代码审查中眼睛的往复移动，这证明了将变量声明尽可能放在首次引用它们的代码周围的价值。\n\n嵌入式 C 编码规范\n\n\
    ## 8 语句规则\n\n### 8.1 变量声明\n\n规则：\n\n- a. 逗号运算符（,）不应在变量声明中使用。\n\n示例：\n\n```\nchar\
    \ * x, y; // y 是否也打算设计为指针？不要这样做。\n```\n\n**理由：** 将每个声明单独独占一行的成本很低。相比之下，编译器或维护者误解你意图的风险很高。\n\
    \n**执行：** 此规则应在代码审查期间执行。\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_62_0.png)\n\
    \n嵌入式 C 编码规范\n\n## 8.2 条件语句\n\n规则：\n\n- a. 一种优良做法是将最短（按代码行数计算）的 if 和 else if 子句放在第一个。\n\
    - b. 嵌套的 if...else 语句深度不应超过二级。使用函数调用或 switch 语句来降低复杂度并辅助理解。\n- c. 赋值不应在 if 或 else\
    \ 测试中进行。\n- d. 任何带有 else if 子句的语句都应以 else 子句结束¹¹\n\n示例：\n\n```\nif (NULL == p_object)\n\
    {\n    result = NULL_PTR;\n}\nelse if (p_object = malloc(sizeof(object))) // 赋值\n\
    {\n    ...\n}\nelse\n{\n    // 正常处理\n    ...\n}\n```\n\n理由：长长的语句会分散人们对决策路径的注意力。通过将较短的语句放在前面，决策路径变得更容易遵循。（深度嵌套的\
    \ if...else 语句是复杂的实现迹象；存在更安全、更易读的方法。）\n\n执行：这些规则应在代码审查期间执行。\n\n> ¹¹ 这等同于要求每个 switch\
    \ 都有 default 情况。\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_63_0.png)\n\n编码规范\n\
    \n## 8.3 Switch 语句\n\n规则：\n\n- a. 每个 case 的 break 应与相应的 case 对齐，而不是与 case 代码块对齐。\n\
    - b. 所有 switch 语句应包含 default case。\n- c. 任何设计为穿透到下一个 case 的 case 都应注释说明为什么缺少 break。\n\
    \n示例：\n\n```\nswitch (err)\n{\n    case ERR_A:\n    ...\n    break;\n    case\
    \ ERR_B:\n    ...\n    break;\n    // 同时执行 ERR_C 的步骤\n    case ERR_C:\n    ...\n\
    \    break;\n    default:\n    ...\n    break;\n}\n```\n\n理由：C 的 switch 是强大的构造，但容易出现遗漏\
    \ break 等错误。通过将 case 与其 break 语句对齐，更容易发现缺失的 break。\n\n执行：这些规则应在代码审查期间执行。\n\n嵌入式编码规范\n\
    \n## 8.4 循环\n\n规则：\n\n- a. 魔数不应作为 while、do...while 或 for 循环的初始值或结束测试。\n- b. 除了循环第一句中的初始化和第三句中对同一变量的更改外，任何循环表达式中都不应进行赋值。\n\
    - c. 无限循环应通过控制表达式 for(;;) 实现。\n- d. 每个空体的循环都应包含一组括号和注释，说明为什么在循环结束前不需要任何操作。\n\n\
    示例：\n\n```\n// 为什么有人会在代码里埋入魔数（例如“100”）呢？\nfor (int row = 0; row < 100; row++)\n\
    {\n    // 描述性常量防止缺陷并提高可读性。\n    for (int col = 0; col < NUM_COLS; col++)\n   \
    \ {\n        ...\n    }\n}\n```\n\n理由：将循环次数与底层数据结构的大小同步至关重要。通过描述性常量来实现这一点，可以防止当代码某处的更改（如数组维度）发生时，其他区域未同步更改而导致的缺陷。\n\
    \n执行：这些规则应在代码审查期间执行。\n\n> ¹² 注意 sizeof 宏在理论上是为数组定的方便方法，但当你传递数组指针而不是数组本身时，这种方法不起作用。\n\
    ¹³ Kernighan & Ritchie 很久就推荐使用 for(;;)，其额外的好处是防止出现 while(l) 这种视觉混淆的缺陷；引用变量 ‘1’。\n\
    \n54\n\n"
