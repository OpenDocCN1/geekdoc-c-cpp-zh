    When changing to a new coding standard, decisions must be made regarding legacy
    code. Few development teams have time to revisit the style of pre-existing source
    code libraries.


    # Embedded C Coding Standard


    With respect to legacy code we suggest that:


    - It is generally best to leave working legacy code alone. Unless, of course,
    life and limb are on the line.

    - Any decision to bring legacy source code into conformance with the rules herein
    should be made for one module (i.e., .h header file and .c source file) or library
    at a time. The best time to make such stylistic changes is often when the module
    or library also requires functional changes.


    Note that changes relating to the use and/or placement of white space (e.g., replacement
    of tabs with spaces) should be made in a version control check-in that is distinct
    from functional changes to the same code. This is to ensure the maximal utility
    of the source differing features of version control tools with respect to functional
    changes made before and after the white space changes.


    # Deviation Procedure


    All source code that is submitted for a product release shall conform to all of
    the rules herein, except if its specific deviations have been documented and approved.


    At the project level, rules that indicate a specific quantity of something (e.g.,
    the number of characters per indent or maximum lines in a function) can be changed
    to enforce a different quantity that works better in the development tools. The
    specific quantity is not typically the key property of these rules.


    At the level of source code modules, it is only acceptable to deviate from this
    coding standard with the approval of the project manager. The approver''s name
    and the reasoning supporting the deviation shall be documented as closely as possible
    to the actual deviation. For example, a single deviation in a single function
    should be documented in a comment above or within the implementation code. By
    contrast, a module-wide deviation may be better documented in the comments at
    the top of the source file.


    # Customization


    This document is © 2018 by Barr Group. It is permissible for individual project
    teams, whole companies, and others to adopt all or a subset of the rules herein
    as their coding standard. Indeed, we are happy that many readers of earlier editions
    have done this and many will. Adoption of the rules as presented herein may be
    done simply by identifying “Barr Group’s Embedded C Coding Standard” (alternatively,
    “BARR-C2018”) as the source of your rules.


    To help develop teams customize this coding standard to meet their project-company-specific
    needs, an editable version of this document is available for license and download
    at barrgroup.com/coding-standard.


    Your full legal obligations in relation to the use of this copyrighted work are
    described at the front of this book.


    # Acknowledgements


    Though my name is listed as author, the development and maintenance of this Embedded
    C Coding Standard book has been a collaborative effort that began more than a
    decade ago and involved most of the people currently at Barr Group as well as
    many other members of the embedded software community. I am specifically grateful
    to Salomon Singer and Joe Perret for helping me make the 2008 edition of the book
    a reality; to Gary Stringham for working closely with me on the more technical
    updates in this 2018 edition; and to all of the multitude commented on specific
    rules or proposed changes, reviewed drafts of any edition, or provided other types
    of feedback across the years.

