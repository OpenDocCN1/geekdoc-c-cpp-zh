    \ execution order within a sequence of operations.\n- Unless it is a single identifier\
    \ or constant, each operand of the logical AND (&&) & logical OR (||) operators\
    \ shall be surrounded by parentheses.\n\nExample:\n\n```\nif ((depth_in_cm > 0)\
    \ && (depth_in_cm < MAX_DEPTH))\n{\ndepth_in_ft = convert_depth_to_ft(depth_in_cm);\n\
    }\n```\n\nReasoning: The syntax of the C programming language has many operators.\
    \ The precedence rules that dictate which operators are evaluated before which\
    \ others are complicated—with over a dozen priority levels—and not always obvious\
    \ to all programmers. When in doubt it’s better to be explicit about what you\
    \ hope the compiler will do with your calculations.\n\nEnforcement: These rules\
    \ shall be enforced during code reviews.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_22_0.png)\n\
    \nEmbedded C Coding Standard\n\n### 1.5 Common Abbreviations\n\nRules:\n\n- a.\
    \ Abbreviations and acronyms should generally be avoided unless their meanings\
    \ are widely and consistently understood in the engineering community.\n- b. A\
    \ table of project-specific abbreviations and acronyms shall be maintained in\
    \ a version-controlled document.\n\n**Example:** Appendix A contains a sample\
    \ table of abbreviations and their meanings.\n\n**Reasoning:** Programmers too\
    \ readily use cryptic abbreviations and acronyms in their code (and in their resumes!).\
    \ Just because you know what ZYGXL means today doesn’t mean the programmer(s)\
    \ who have to read/maintain/port your code will later be able to make sense of\
    \ your cryptic names that reference it.\n\n**Enforcement:** These rules shall\
    \ be enforced during code reviews.\n\n### 1.6 Casts\n\nRules:\n\n- a. Each cast\
    \ shall feature an associated comment describing how the code ensures proper behavior\
    \ across the range of possible values on the right side.\n\nExample:\n\n```\n\
    int\nabs (int arg)\n{\n    return ((arg < 0) ? -arg : arg);\n}\n...\nuint16_t\
    \ sample = adc_read(ADC_CHANNEL_1);\n\nresult = abs((int) sample); // WARNING:\
    \ 32-bit int assumed.\n```\n\nReasoning: Casting is dangerous. In the example\
    \ above, unsigned 16-bit “sample” can hold larger positive values than a signed\
    \ 16-bit integer. In that case, the absolute value will be incorrect as well.\
    \ Thus there is a possible overflow if int is only 16-bits, which the ISO C standard\
    \ permits.\n\nEnforcement: This rule shall be enforced during code reviews.\n\n\
    Embedded C Coding Standard\n\n### 1.7 Keywords to Avoid\n\nRules:\n\n- a. The\
    \ auto keyword shall not be used.\n- b. The register keyword shall not be used.\n\
    - c. It is a preferred practice to avoid all use of the goto keyword. If goto\
    \ is used it shall only jump to a label later in the same block.\n- d. It is a\
    \ preferred practice to avoid all use of the continue keyword.\n\nReasoning: The\
    \ auto keyword is an unnecessary historical feature. The register keyword presumes\
    \ the programmer is smarter than the compiler. There is no compelling reason to\
    \ use either of these keywords.\n\nThe keywords goto and continue still serve\
    \ purposes in the language, but their use too often results in spaghetti code.\
    \ In particular, the use of goto to make jumps orthogonal to the ordinary flows\
    \ of the structured programming paradigm is problematic. The occasional use of\
    \ goto to handle an exceptional circumstance is acceptable if it simplifies and\
    \ clarifies the code.\n\nEnforcement: The presence of forbidden keywords in new\
    \ or modified source code shall be detected and reported via an automated tool\
    \ at each build. To the extent that the use of goto or continue is permitted,\
    \ code reviewers should investigate alternative code structures to improve code\
    \ maintainability.\n\n### 1.8 Keywords to Frequent\n\nRules:\n\n- a. The static\
    \ keyword shall be used to declare all functions and variables that do not need\
    \ to be visible outside of the module in which they are declared.\n- b. The const\
    \ keyword shall be used whenever appropriate. Examples include:\n    i. To declare\
    \ variables that should not be changed after initialization,\n    ii. To define\
    \ call-by-reference function parameters that should not be modified (e.g., char\
    \ const * param),\n    iii. To define fields in a struct or union that should\
    \ not be modified (e.g., in a struct overlay for memory-mapped I/O peripheral\
    \ registers), and\n    iv. As a strongly typed alternative to #define for numerical\
    \ constants.\n- c. The volatile keyword shall be used whenever appropriate. Examples\
    \ include:\n    i. To declare a global variable accessible (by current use or\
    \ scope) by any interrupt service routine,\n    ii. To declare a global variable\
    \ accessible (by current use or scope) by two or more threads,\n    iii. To declare\
    \ a pointer to a memory-mapped I/O peripheral register set (e.g., timer_t volatile\
    \ * const p_timer), and\n    iv. To declare a delay loop counter.\n"
