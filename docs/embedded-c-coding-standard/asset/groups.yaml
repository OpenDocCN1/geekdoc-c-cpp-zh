  - '[PAGE 14]


    3. For better or worse (well, mostly worse), the ISO C Programming Language “Standard”
    permits a considerable amount of variation between compilers. The ISO C Standard’s
    “implementation-defined,” “unspecified,” and “undefined” behaviors, along with
    “locale-specific options,” mean that even programs compiled from identical source
    code but via different “ISO C”-compliant compilers may behave very differently
    at run-time. Such gray areas in the C language standard greatly reduce the portability
    of source code that is not carefully crafted.


    4. The reliability, readability, efficiency, and sometimes portability of source
    code is more important than programmer convenience.


    5. There are many sources of defects in software programs. The original team of
    programmers will create some defects. Programmers who later maintain, extend,
    port, and/or reusing the source code may create additional defects—including as
    a result of misunderstandings of the original code.


    +   * The number and severity of defects introduced by the original programmer(s)
    can be reduced through disciplined conformance with certain coding practices,
    such as the placement of constants to the left side of an equivalence (==) test.


    +   * The number and severity of defects introduced by maintenance programmers
    can also be reduced by the original programmer. For example, appropriate use of
    portable fixed-width integer types (e.g., int32_t) ensures that no future port
    of the code will encounter an unexpected overflow.


    +   * The number and severity of defects introduced by maintenance programmers
    can also be reduced through the disciplined use of consistent commenting and stylistic
    practices, so that everyone in an organization can easily understand the meaning
    and proper use of variables, functions, and modules.


    > See, e.g., [C90] and [C99].'
  - '[PAGE 15]


    # Embedded C Coding Standard


    6. To be effective, coding standards must be enforceable. Thus, when it is the
    case that two or alternative rules would equally prevent defects, the more easily
    enforced rule is the better choice.


    In the absence of a needed rule herein or a conflict within the coding standard
    your team commits to follow, the spirit of the above principles should be applied
    to guide the decision.


    # MISRA C


    The MISRA C:2012 – Guidelines for the Use of the C Language in Critical Systems
    [MISRA-C]) defines a subset of the C programming language that is safer—albeit
    more restrictive—than the rules in BARR-C coding standard.


    If you are designing products that could kill or injure one more people, the MISRA
    C guidelines are important to study and should be made part of your project’s
    coding standard. The MISRA C guidelines are now in their third edition and have
    been practiced for over two decades. Chances that the authors of the MISRA C are
    more knowledgeable than you of the risks of using C in safety-critical systems.


    In the present edition, every effort has been made to ensure that BARR-C’s rules
    can be combined with some or all of MISRA-C:2012’s guidelines. Specifically:


    +   * To the extent that a collection of rules define a subset of the C programming
    language (e.g., limitations on the use of register and goto keywords), they are
    never more restrictive than the MISRA C guidelines. Put another way, MISRA-C:2012
    defines a subset of the C language that is itself a subset of the BARR-C rules.

    * To the extent that a collection of rules herein place stylistic limitations
    on programmers (e.g., restricting the format of function or variable names), these
    never contradict the MISRA C guidelines. In other words, BARR-C comprises a C
    style guide that is complementary to MISRA C, which does not make any recommendations
    related purely to style.


    A 2018 survey found that together these standards were the primary basis of the
    project-specific coding standards followed by more than 40% of firmware designers.'
  - '[PAGE 16]


    # C++ vs. C


    Though the title of this book only explicitly includes the C language, embedded
    programmers working in C++ (or a mix of the two languages) are also able to reduce
    the number of defects in their programs by following the rules herein. This is
    because the syntax of C++ follows closely from C and many lines of C++ source
    code rely only on C syntax.


    It is important to note, however, that C++ is a substantially larger and more
    complex language than C and contains a number of features that have no equivalent
    in C. If you are following the BARR-C rules in C++ you should strongly consider
    adopting other coding standard rules, perhaps choosing from those suggested by
    [MISRA-C++], [Sutter], and/or [Holub].


    As embedded developers, our focus remains primarily on C, which is the primary
    programming language for about 70% of professional firmware designers. A longitudinal
    review of industry surveys spanning 2005 to 2018 shows that C was not only reliably
    the most-used language but that it actually increased its market share from 50%
    to about 70% in those years. Within the embedded systems community, it appears
    the peak year for C++ was 2006.


    # Enforcement Guidelines


    Conformance with all of the rules in this coding standard is deemed mandatory.
    Non-conforming code should preferably be detected: primarily via automated scans
    (i.e., static analysis); secondly via peer code reviews; or, in the absence of
    those options, informal discovery. Upon detection, any non-conforming code should
    be made to meet all of the rules herein.


    There are commercial static analysis tools that can be used to automatically check
    for non-compliance with many of the rules of this and other coding standards.
    Tools pre-configured to detect violations of the enforceable subset of rules in
    this coding standard are requested to refer to it as the “BARR-C:2018” standard.


    When changing to a new coding standard, decisions must be made regarding legacy
    code. Few development teams have time to revisit the style of pre-existing source
    code libraries.'
  - '[PAGE 17]


    # Embedded C Coding Standard


    With respect to legacy code we suggest that:


    +   - It is generally best to leave working legacy code alone. Unless, of course,
    life and limb are on the line.

    - Any decision to bring legacy source code into conformance with the rules herein
    should be made for one module (i.e., .h header file and .c source file) or library
    at a time. The best time to make such stylistic changes is often when the module
    or library also requires functional changes.


    Note that changes relating to the use and/or placement of white space (e.g., replacement
    of tabs with spaces) should be made in a version control check-in that is distinct
    from functional changes to the same code. This is to ensure the maximal utility
    of the source differing features of version control tools with respect to functional
    changes made before and after the white space changes.


    # Deviation Procedure


    All source code that is submitted for a product release shall conform to all of
    the rules herein, except if its specific deviations have been documented and approved.


    At the project level, rules that indicate a specific quantity of something (e.g.,
    the number of characters per indent or maximum lines in a function) can be changed
    to enforce a different quantity that works better in the actual development tools.
    The specific quantity is not typically the key property of these types of rules.


    At the level of source code modules, it is only acceptable to deviate from this
    coding standard with the approval of the project manager. The approver''s name
    and the reasoning supporting the deviation shall be documented as closely as possible
    to the actual deviation(s). For example, a single deviation in a single function
    should be documented in a comment above or within the implementation code—whichever
    will be clearest to the next reader. By contrast, a module-wide deviation may
    be better documented in the comments at the top of the source file.'
  - '[PAGE 18]


    # Customization


    This document as well as the selection and arrangement of the rules it comprises
    is Copyright © 2018 by Barr Group. It is permissible for individual project teams,
    whole companies, and others to adopt all or a subset of the rules herein as their
