    \  指向待要计算 CRC 的数据字节数组的指针。\n * @param[in] n_bytes      数据数组中的字节数。\n * @return 数据数组的\
    \ CRC 结果。\n */\n```\n\n```c\ncrc_t\ncrc_slow(uint8_t const * p_message, int n_bytes)\n\
    {\n    crc_t remainder = INITIAL_REMAINDER;\n\n    // 执行模 2 除法，每次处理一个字节。\n   \
    \ for (int byte = 0; byte < n_bytes; ++byte)\n    {\n        // 将下一个字节带入余数中。\n\
    \        remainder ^= (REFLECT_DATA(p_message[byte]) << (WIDTH - BITS_PER_BYTE));\n\
    \n        // 执行模 2 除法，每次处理一个位。\n        for (int bit = BITS_PER_BYTE; bit > 0;\
    \ --bit)\n        {\n            // 尝试除尽当前数据位。\n            if (remainder & TOPBIT)\n\
    \            {\n                remainder = (remainder << 1) ^ POLYNOMIAL;\n \
    \           }\n            else\n            {\n                remainder = (remainder\
    \ << 1);\n            }\n        }\n    }\n\n    // 最终余数为 CRC 结果。\n    return\
    \ (REFLECT_REMAINDER(remainder)) ^ FINAL_XOR_VALUE;\n}\n/* crc_slow() */\n```\n\
    \n```c\n/**\n * @brief 逐字节计算字节数组的 CRC。\n * @param[in] p_message 指向待计算 CRC 的字节数组的指针。\n\
    \ * @param[in] n_bytes 数据数组中的字节数。\n * @return 数据数组的 CRC 结果。\n */\n```\n\n```c\n\
