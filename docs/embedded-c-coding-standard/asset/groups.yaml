  - '[PAGE 23]


    # Embedded C Coding Standard


    # 1.5 Common Abbreviations


    Rules:


    +   a. Abbreviations and acronyms should generally be avoided unless their meanings
    are widely and consistently understood in the engineering community.


    +   b. A table of project-specific abbreviations and acronyms shall be maintained
    in a version-controlled document.


    **Example:** Appendix A contains a sample table of abbreviations and their meanings.


    **Reasoning:** Programmers too readily use cryptic abbreviations and acronyms
