    规则：\n\n- 每当整数值的宽度（以位或字节）在程序中很重要时，应使用固定宽度数据类型来代替 `char`、`short`、`int`、`long` 或\
    \ `long long`。有符号和无符号固定宽度整数类型如下表所示。\n\n| 整数宽度 | 有符号类型 | 无符号类型 |\n| --- | --- |\
