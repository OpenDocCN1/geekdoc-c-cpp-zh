    reflect(uint32_t data, uint8_t n_bits)\n{\n    uint32_t reflection = 0x00000000;\n\
    \n    // 注意：为了效率考虑，未验证 n_bits 是否 <= 32。\n\n    // 关于中心位反射数据。\n    //\n    for\
    \ (uint8_t bit = 0; bit < n_bits; ++bit)\n    {\n        // 如果最低位(LSB)被设置，则设置其反射位。\n\
    \        //\n        if (data & 0x01)\n        {\n            reflection |= (1\
    \ << ((n_bits - 1) - bit));\n        }\n\n        data = (data >> 1);\n    }\n\
    \n    return (reflection);\n}\n\n/* reflect() */\n\n/**\n * @brief 为逐字节 CRC 加速初始化查找表。\n\
