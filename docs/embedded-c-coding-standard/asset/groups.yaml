    if (unsigned_a > signed_b) {\n    // ...\n}\n```\n\n理由：源文件模块的目的和内部布局对所有维护者来说应该是清晰的。例如，公共函数通常是关注重点，因此出现在它们所调用的私有函数之前。至关重要的一点是，每个函数声明都必须由编译器与其原型进行匹配。\n\
    \n强制：大多数静态分析工具都可以配置为检查未被实际使用的包含文件。其他规则应在代码审查期间执行。\n\n## 5.4 浮点数\n\n规则：\n\n- 尽可能避免使用浮点数。\n\
    - 当必要时：\n    - 为所有单精度常量加上 'f'（例如 `3.14159f`）。\n    - 使用 `isfinite()` 宏检查结果是否不是\
