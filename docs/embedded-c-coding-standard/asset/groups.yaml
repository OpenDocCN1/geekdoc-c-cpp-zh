    - c. 应在适当的情况下 `volatile` 关键字。示例包括：\n    i. 声明由任何中断服务程序访问（按当前使用或范围而言）的全局变量；\n \
    \   ii. 声明由两个或多个线程访问（按当前使用或范围而言）的全局变量；\n    iii. 声明指向内存映射 I/O 外设寄存器组的指针（例如 `timer_t\
    \ volatile * const p_timer`）；\n    iv. 声明延迟循环计数器。\n\n"
