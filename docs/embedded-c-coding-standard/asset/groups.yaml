  mdcn: '

    3. 不管好坏（嗯，主要是坏的方面更多），ISO C 编程语言“标准”允许编译器之间存在大量的差异。ISO C 标准中的“实现定义（implementation-defined）”、“未指定（unspecified）”和“未定义（undefined）”行为，以及“特定区域选项（locale-specific
    options）”，意味着即使相同的源代码通过不同的“符合 ISO C”编译器编译，其运行时的行为也可能大不相同。C语言标准中的这些灰色地带极大降低了未经设计的源码的可移植性。


    4. 源代码的可靠性、可读性、效率以及有时的可移植性比程序员的便利更重要。


    5. 软件程序中的缺陷有很多来源。原始程序员团队会产生一些缺陷。后期维护、扩展、移植和/或重用源代码的可能会可能会额外的缺陷——包括由于对原始代码的误解导致的缺陷。


    - 通过严格遵守某些编码规范，可以减少原始程序员引入的缺陷数量和严重程度，例如将常量放在等值（==）测试表达式的左侧。


    - 原始程序员也可以减少维护程序员引入的缺陷数量和严重程度。例如，恰当使用可的固定宽度整数类型（例如 int32_t）可以确保未来的代码移植时不会遇到意外的溢出。


    - 通过自律使用一致的注释和风格规范，也可以减少维护程序员引入的缺陷数量和严重程度，以便组织中的每个人都能轻松理解变量、函数和模块的含义及正确用法。


    > 参见例如 [C90] 和 [C99]。


    # 嵌入式 C 编码标准


    6. 为了有效，编码标准必须是可执行的。因此，当两个或替代规则可以同样有效地防止缺陷时，更易执行的规则是更好的选择。


    如果此处缺少所需的规则，或与你团队承诺遵守的编码标准之间存在冲突，应应用上述原则的精神来指导决策。


    # MISRA C


    《MISRA C:2012 – 关键系统中使用 C 语言指南 [MISRA-C]》定义了 C 编程语言的一个子集，该子集比 BARR-C 编码标准中的规则更安全——尽管限制性更大。


    如果你正在设计可能导致更多人员死亡或受伤的产品，那么研究 MISRA C 指南是非常重要的，并应该将其作为你项目编码标准的一部分。MISRA C 指南现在已是第三版，并实践了二十多年。MISRA
    C 作者对安全关键系统中使用 C 语言的风险了解可能比你更得多。


    在当前版本中，已尽一切努力确保 BARR-C 的规则可以与部分或全部 MISRA-C:2012 指南相结合。具体而言：


    - 在一组规则定义了 C 编程语言子集的范围内（例如对 register 和 goto 关键字使用的限制），它们的限制绝不会比 MISRA C 指南严格。换句话说，MISRA-C:2012
    定义的 C 语言子集本身就是 BARR-C 规则的子集。

    - 在此处的规则规则对程序员施加了风格限制（例如限制函数或变量名的格式），这些限制绝与 MISRA C 指南冲突。换句话说，BARR-C 包含与 MISRA
    C 互补的风格指南，而 MISRA C 不提供任何纯关于风格的建议。


    2018 年的一项调查发现，这些标准共同成为了超过 40% 的固件设计师所遵循的特定项目编码标准的主要依据。


    # C++ vs C


    尽管这本书的标题只明确包含了 C 语言，但使用 C++（或混合使用这两种语言）的嵌入式程序员也能通过遵循此处的规则来减少程序中的缺陷数量。这是因为 C++
    的语法紧随 C，且许多行 C++ 源代码仅依赖于 C 语法。


    然而，需要注意的是，C++ 是一门比 C 大得多且更复杂的语言，包含了许多在 C 中没有等效功能的特性。如果你在 C++ 中遵循 BARR-C 规则，你应该强烈考虑采用其他编码标准规则，也许从
    [MISRA-C++]、[Sutter] 和/或 [Holub] 建议的进行选择。


    作为嵌入式开发者，我们的重点仍然是 C，它是约 70% 专业固件设计师的主要编程语言。对 2005 年至 2018 年行业调查的长期回顾显示，C 不仅可靠地是最常用的语言，而且在这些年里市场份额实际上从
    50% 增加到了约 70%。在嵌入式系统社区，C++ 的巅峰年份似乎是 2006 年。


    # 执行指南


    遵守本编码标准中的所有规则被认为是强制性的。不符合规则的代码应尽可能被检测：主要通过自动扫描（即静态分析）；其次通过同行代码审查；或者在没有这些选项的情况下，通过非正式发现。一旦检测到，任何不符合规则的代码都应使其符合此处的所有规则。


    有商业静态分析工具可用于自动检查是否符合本标准和其他编码标准中许多规则的规定。要求预配置以检测本编码标准中可执行规则集违反情况的工具，将其称为“BARR-C:2018”标准。


    在切换到新的编码标准时，必须对遗留代码做出决策。很少开发团队有时间重新考虑现有源代码库的风格。


    # 嵌入式 C 编码标准


    对于遗留代码，我们建议：


    - 通常情况下，保持运行中的遗留代码不变是最好的。除非生命安全受到威胁。

    - 任何将遗留源代码符合此处规则的决策都应该一次针对一个模块（即 .h 头文件和 .c 源文件）或一个库。进行此类风格更改的最佳时机通常是该模块或库也需要功能性更改时。


    注意，与空格的使用和/或放置有关（例如将制表符替换为空格）的更改应在版本控制提交中进行，且该提交与同一代码的功能更改分开。这样做是为了确保版本控制工具的源码差异功能在处理空格更改前后的功能更改时，能够发挥最大的效用。


    # 偏差程序


    所有提交用于产品发布的源代码均应符合此处的所有规则，除非其特定偏差已记录并获得批准。


    在项目层面，指示某些特定数量的规则（例如每个缩进的字符数或函数中的最大行数）可以更改，以实施在开发工具中运行效果更好的不同数量。特定数量通常不是这些规则的关键属性。


    在源代码模块层面，只有在获得项目经理批准的情况下才允许偏离本编码标准。批准人的姓名和支持偏差的理由应尽可能在靠近实际偏差发生的地方进行记录。例如，单个函数中的单个偏差应记录在实现代码上方或内部的注释中。相比之下，整个模块的偏差在源文件顶部的注释中记录可能更好。


    # 定制化


    本文文档 © 2018 由 Barr Group 所有。允许个人项目团队、整个公司或其他人员采用此处的全部或部分规则作为他们的编码标准。事实上，我们很高兴早期版本的许多读者已经这样做了，未来也将这样做。采纳此处呈现的规则只需标识“Barr
    Group 嵌入式 C 编码标准”（或者是“BARR-C2018”）为规则的来源即可。


    为了帮助开发团队定制此编码标准以满足其项目和公司的特定需求，本文的可编辑版本可在 barrgroup.com/coding-standard 获取许可并下载。


    有关使用本版权作品的完整法律义务在书中开头说明。


    # 致谢


    尽管我的名字列为作者，但本《嵌入式 C 编码标准》的开发和维护是一项十多年前就开始的协作努力，涉及目前 Barr Group 大多数人员以及嵌入式软件社区的许多成员。我特别感谢
    Salomon Singer 和 Joe Perret 帮助我使 2008 版书籍成为现实；感谢 Gary Stringham 与我密切合作完成 2018
    版中更具技术性的更新；并感谢多年来对特定规则提出更改建议、审查任何版本的草稿或提供其他类型反馈的众多人士。


