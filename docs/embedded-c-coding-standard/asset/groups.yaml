    \ 但使用大括号总是更安全的。\n    dive_stage = DIVE_SURFACE;\n}\n```\n\n理由：存在未用括号包围的空语句和单语句存在相当风险。当附近的代码被更改或注释掉时，这种代码结构通常会关联出\
    \ bug。通过一致使用大括号可以完全消除这种风险。将左大括号放在下一行便于在视觉上检查对应的右大括号。\n\n执行：在每个 `if`、`else`、`switch`、`while`、`do`\
