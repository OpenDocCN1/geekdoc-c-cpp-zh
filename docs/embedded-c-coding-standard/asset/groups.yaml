    \ and often also more costly. By following this rule, any compiler will reliably\
    \ detect erroneous attempts to assign (i.e., = instead of ==) a new value to a\
    \ constant.\n\nEnforcement: Many compilers can be configured to warn about suspicious\
    \ assignments (i.e., located where comparisons are more typical). However, ultimate\
    \ responsibility for enforcement of this rule falls to code reviewers.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_67_0.png)"
