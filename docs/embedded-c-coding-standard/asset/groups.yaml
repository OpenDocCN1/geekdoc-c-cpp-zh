  md: "\nEmbedded C Coding Standard\n\n## 7 Variable Rules\n\n### 7.1 Naming Conventions\n\
    \nRules:\n\n- a. No variable shall have a name that is a keyword of C, C++, or\
    \ any other well-known extension of the C programming language, including specifically\
    \ K&R C and C99. Restricted names include interrupt, inline, restrict, class,\
    \ true, false, public, private, friend, and protected.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_59_0.png)\n\
    \n- b. No variable shall have a name that overlaps with a variable name from the\
    \ C Standard Library (e.g., errno).\n\n- c. No variable name shall have a name\
    \ that begins with an underscore.\n\n- d. No variable name shall be longer than\
    \ 31 characters.\n\n- e. No variable name shall be shorter than 3 characters,\
    \ including loop counters.\n\n- f. No variable name shall contain any uppercase\
    \ letters.\n\n- g. No variable name shall contain any numeric value that is called\
    \ out elsewhere, such as the number of elements in an array or the number of bits\
    \ in the underlying type.\n\n- h. Underscores shall be used to separate words\
    \ in variable names.\n\n- i. Each variable's name shall be descriptive of its\
    \ purpose.\n\n- j. The names of any global variables shall begin with the letter\
    \ ‘g’. For example, g_zero_offset.\n\n- k. The names of any pointer variables\
    \ shall begin with the letter ‘p’. For example, p_led_reg.\n\n- l. The names of\
    \ any pointer-to-pointer variables shall begin with the letters ‘pp’. For example,\
    \ pp_vector_table.\n\n- m. The names of all integer variables containing Boolean\
    \ information (including 0 vs. non-zero) shall begin with the letter ‘b’ and phrased\
    \ as the question they answer. For example, b_done_yet or b_is_buffer_full.\n\n\
    - n. The names of any variables representing non-pointer handles for objects,\
    \ e.g., file handles, shall begin with the letter ‘h’. For example, h_input_file.\n\
    \n- o. In the case of a variable name requiring multiple of the above prefixes,\
    \ the order of their inclusion before the first underscore shall be [q|p|pp|b|h].\n\
    \n**Example:** See Appendix D.\n\n**Reasoning:** The base rules are adopted to\
    \ maximize portability across compilers. Many C compilers recognize differences\
    \ only in the first 31 characters in a variable’s name and reserve names beginning\
    \ with an underscore for internal names.\n\nThe other rules are meant to highlight\
    \ risks and ensure consistent proper use of variables. For example, all code relating\
    \ to the use of global variables and other singleton objects, including peripheral\
    \ registers, needs to be carefully considered to ensure there can be no race conditions\
    \ or data corruptions via asynchronous writes.\n\n**Enforcement:** These rules\
    \ shall be enforced during code reviews.\n\nEmbedded C Coding Standard\n\n## 7.2\
    \ Initialization\n\nRules:\n\n- a. All variables shall be initialized before use.\n\
    - b. It is preferable to define local variables as you need them, rather than\
    \ all at the top of a function.\n- c. If project- or file-global variables are\
    \ used, their definitions shall be grouped together and placed at the top of a\
    \ source code file.\n- d. Any pointer variable lacking an initial address shall\
    \ be initialized to NULL.\n\nExample:\n\n```\nuint32_t g_array[NUM_ROWS][NUM_COLS]\
    \ = { ... };\n\nfor (int col = 0; col < NUM_COLS; col++)\n{\n    g_array[row][col]\
    \ = ...;\n}\n```\n\nReasoning: Too many programmers assume the C run-time will\
    \ watch out for them, e.g., by zeroing the value of uninitialized variables on\
    \ system startup. This is a bad assumption, which can prove dangerous in a mission-critical\
    \ system. For readability it is better to declare local variables as close as\
    \ possible to their first use,¹ which C99 makes possible by incorporating earlier\
    \ feature of C++.\n\nEnforcement: An automated tool shall scan all of the source\
    \ code prior to each build, to warn about variables used prior to initialization;\
    \ static analysis tools can do this. The remainder of these rules shall be enforced\
    \ during code reviews.\n\n> ¹ [Uwano] describes back-and-forth code review eye\
    \ movements that demonstrate the value of placing variable declarations as close\
    \ as possible to the code that first references them.\n\nEmbedded C Coding Standard\n\
    \n## 8 Statement Rules\n\n### 8.1 Variable Declarations\n\nRules:\n\n- a. The\
