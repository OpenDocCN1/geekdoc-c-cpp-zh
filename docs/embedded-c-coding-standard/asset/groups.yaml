    ```


    Reasoning: The syntax of the C programming language has many operators. The precedence
    rules that dictate which operators are evaluated before which others are complicated—with
    over a dozen priority levels—and not always obvious to all programmers. When in
    doubt it’s better to be explicit about what you hope the compiler will do with
    your calculations.


    Enforcement: These rules shall be enforced during code reviews.


