    \n## 4.4 文件模板\n\n规则：\n\n- a. 在项目级维护一套用于头文件和源文件的模板。\n\n示例：参见附录 B 和附录 C 中的示例文件模板。\n\
    \n理由：从模板开始创建每个新文件可以确保文件头注释块的一致性，并确保包含适当的版权声明。\n\n强制：文件格式的一致性应在代码审查期间执行。\n\n##\
