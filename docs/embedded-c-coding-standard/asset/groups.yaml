    \n### 1.6 强制类型转换\n\n规则：\n\n- a. 每一个强制类型转换都应包含一个注释，描述如何确保右侧值范围的行为正确。\n\n示例：\n\n\
    ```\nint\nabs (int arg)\n{\n    return ((arg < 0) ? -arg : arg);\n}\n...\nuint16_t\
    \ sample = adc_read(CHANNEL_1);\n\nresult = abs((int) sample); // 警告：假设 int\n\
    ```\n\n理由：类型转换是危险的。在上面的示例中，无符号 16 位 sample 可以存储更大的正值。因此，如果 `int` 只有 16 位，ISO C\
    \ 标准允许溢出。\n\n执行：此规则应在代码审查期间强制执行。\n\n嵌入式 C 编码规范\n\n### 1.7 应避免的关键字\n\n规则：\n\n-\
    \ a. 不使用 `auto` 关键字。\n- b. 不使用 `register` 关键字。\n- c. 优先避免所有使用 `goto` 关键字的情况。如果使用了\
    \ `goto`，它应仅跳转到同一块内的标签。\n- d. 优先避免所有使用 `continue` 关键字的情况。\n\n理由：`auto` 关键字是一个不历史特性。`register`\
    \ 关键字假设程序员比编译器更聪明。使用这两个关键字没有任何的理由。\n\n`goto` 和 `continue` 关键字在语言中仍有用途，但它们的使用往往会导致面条代码。特别是使用\
    \ `goto` 进行正交于普通结构化编程范式的跳转是有问题的。偶尔使用 `goto` 处理异常情况是可以接受的，如果它可以简化并清晰代码。\n\n执行：新或修改源代码中的禁用关键字应在每次构建时通过自动化工具检测。在允许使用\
    \ `goto` 或 `continue` 的范围内，代码审查人员应研究替代代码结构以提高可维护性。\n\n### 1.8 频繁使用的关键字\n\n规则：\n\
    \n- a. 应使用 `static` 关键字声明所有不需要在声明模块之外可见的函数和变量。\n- b. 应在适当的情况下 `const` 关键字。示例包括：\n\
