    \ shall be free of unused include files.\n\n- No source file shall #include another\
    \ source file.\n\nExample: See Appendix D.\n\nReasoning: The purpose and internal\
    \ layout of a source file module should be clear to all who maintain it. For example,\
    \ the public functions are generally of interest and thus appear ahead of the\
    \ private functions they call. Of critical importance is that every function declaration\
    \ be matched by the compiler against its prototype.\n\nEnforcement: Most static\
    \ analysis tools can be configured to check for include files that are not actually\
    \ used. The other rules shall be enforced during code reviews.\n\n![](img/25b91ff016aae4a7e187afd99b37dc2d_42_0.png)\n\
    \n## 4.4 File Templates\n\nRules:\n\n- a. A set of templates for header files\
    \ and source files shall be maintained at the project level.\n\nExample: See Appendix\
    \ B and Appendix C for sample file templates.\n\nReasoning: Starting each new\
    \ file from a template ensures consistency in file header comment blocks and ensures\
    \ inclusion of appropriate copyright notices.\n\nEnforcement: The consistency\
    \ of file formats shall be enforced during code reviews.\n\n## Data Type Rules\n\
    \n## 5.1 Naming Conventions\n\nRules:\n\n- a. The names of all new data types,\
    \ including structures, unions, and enumerations, shall consist only of lowercase\
    \ characters and internal underscores and end with `_t`.\n\n- b. All new structures,\
    \ unions, and enumerations shall be named via a `typedef`.\n\n- c. The name of\
    \ all public data types shall be prefixed with their module name and an underscore.\n\
    \nExample:\n\n```\ntypedef struct\n{\n    uint16_t count;\n    uint16_t max_count;\n\
    \    uint16_t unused;\n    uint16_t control;\n}\ntimer_reg_t;\n```\n\nReasoning:\
    \ Data type names and variable names are often appropriately similar. For example,\
    \ a set of control registers in a peripheral calls out to be named `timer_reg`.\
    \ To distinguish the structure definition that defines the register layout, it\
    \ is valuable to create a new type with a distinct name, such as `timer_reg_t`.\
    \ If necessary this same type could then be used to create a shadow copy of the\
    \ timer registers, say called `timer_reg_shadow`.\n\nEnforcement: An automated\
    \ tool shall scan new or modified source code prior to each build to ensure that\
    \ the keywords struct, union, and enum are used only within typedef statements\
    \ or in anonymous declarations. Code reviews shall be used to enforce the naming\
    \ rules for new types.\n\n## 5.2 Fixed-Width Integers\n\nRules:\n\n- Whenever\
    \ the width, in bits or bytes, of an integer value matters in the program, one\
    \ of the fixed width data types shall be used in place of char, short, int, long,\
    \ or long long. The signed and unsigned fixed-width integer types shall be shown\
    \ in the table below.\n\n| Integer Width | Signed Type | Unsigned Type |\n| ---\
    \ | --- | --- |\n| 8 bits | int8_t | uint8_t |\n| 16 bits | int16_t | uint16_t\
    \ |\n| 32 bits | int32_t | uint32_t |\n| 64 bits | int64_t | uint64_t |\n\n- The\
    \ keywords short and long shall not be used.\n\n- Use of the keyword char shall\
    \ be restricted to the declaration of and operations concerning strings.\n\nExample:\
    \ See Appendix D.\n\n**Reasoning:** The C90 standard purposefully allowed for\
    \ implementation-defined widths for char, short, int, long, and long long types,\
    \ which has resulted in code portability problems. The C99 standard did not resolve\
    \ this but introduce the type names shown in the table, which are defined in the\
    \ std.h header file.\n\nSee also Portable Fixed-Width Integers in C:\n\nbarrgroup.com/embedded-systems/how-to/c-fixed-width-integers-c99\n\
    \nIn the absence of a C99-compatible compiler, it is acceptable to define the\
    \ set of fixed-width types in the table above as typedefs from underlying types.\
    \ If this is necessary, be sure to use compile-time checking (e.g., static assertions).\n\
    \n**Enforcement:** At every build an automated tool shall flag any use of keywords\
    \ short or long. Compliance with the other rules shall be checked during code\
    \ reviews.\n\n## 5.3 Signed and Unsigned Integers\n\nRules:\n\n- a. Bit-fields\
    \ shall not be defined within signed | ^ integer types.\n\n- b. None of the bitwise\
    \ operators (i.e., |, ~, ^ <<, and >>) shall be used to manipulate signed integer\
    \ data.\n\n- c. Signed integers shall not be combined with unsigned integers in\
    \ comparisons or expressions. In support of this, decimal constants meant to be\
    \ unsigned should be declared with a ‘u’ at the end.\n\nExample:\n\n```\nuint16_t\
    \ unsigned_a = 6u;\nint16_t signed_b = -9;\n```\n\n```\nif (unsigned_a + signed_b\
    \ < 4)\n{\n    // Execution of this block appears reliably logical, as -9 + 6\
    \ is -3\n    ...\n}\n```\n\nReasoning: The purpose and internal layout of a source\
    \ file module should be clear to all who maintain it. For example, the public\
    \ functions are generally of interest and thus appear ahead of the private functions\
    \ they call. Of critical importance is that every function declaration be matched\
    \ by the compiler against its prototype.\n\nEnforcement: Most static analysis\
    \ tools can be configured to check for include files that are not actually used.\
    \ The other rules shall be enforced during code reviews.\n\n## 5.4 Floating Point\n\
    \nRules:\n\n- Avoid the use of floating point constants whenever possible.\n-\
    \ When floating point calculations are necessary:\n    - Append 'f' to all single-precision\
    \ constants (e.g., 3.14159f).\n    - Use isfinite() macro to check that calculations\
    \ resulted neither INFINITY nor NAN.\n    - Never test for equality or inequality\
    \ of floating point values.\n\nExample:\n\n```\n#include <limits.h>\n#if (DBL_DIG\
    \ < 10)\n# error \"Double precision is not available!\"\n#endif\n```\n\nReasoning:\
    \ A large number of risks from incorrect use of floating point. By default, C\
    \ promotes all floating-point constants to double precision, which may be inefficient\
    \ or unsupported on the target. However, many microcontrollers do not have hardware\
    \ support for floating point.\n\nEnforcement: These rules shall be enforced during\
    \ code reviews.\n\n## 5.5 Structures and Unions\n\nRules:\n\n- a. Appropriate\
    \ care shall be taken to prevent the compiler from inserting padding bytes within\
    \ struct or union types used to communicate to or from a peripheral or over a\
    \ bus or network to another processor.\n\n- b. Appropriate care shall be taken\
    \ to prevent the compiler from altering the intended order of the bits within\
    \ bit-fields.\n\nExample:\n\n```\ntypedef struct {\n    uint16_t count;      //\
    \ offset 0\n    uint16_t max_count;  // offset 2\n    uint16_t unused;     //\
    \ offset 4\n\n    uint16_t enable      : 2;   // offset 6 bits 15-14\n    uint16_t\
    \ b_interrupt : 1;   // offset 6 bit 13\n    uint16_t _unused1   : 7;   // offset\
    \ 6 bits 12-6\n    uint16_t b_complete : 1;   // offset 6 bit 5\n    uint16_t\
    \ _unused2   : 4;   // offset 6 bits 4-1\n    uint16_t b_periodic : 1;   // offset\
    \ 6 bit 0\n} timer_reg;\n```\n\n```c\n// Preprocessor check of timer register\
    \ layout byte count.\n#if (8 != sizeof(timer_reg))\n# error \"timer_reg_t struct\
    \ size incorrect (expected 8 bytes)\"\n#endif\n```\n"
  mdcn: "\n\n## 4.3 源文件\n\n规则：\n\n- 每个源文件应仅包含适用于控制一个“实体”的行为。实体的示例包括封装的数据类型、活动对象、外设驱动程序（例如用于\
    \ UART）以及通信协议或层（例如 ARP）。\n\n- 每个源文件应按列出的顺序包含以下部分或全部部分：注释块；include 语句；数据类型、常量和宏定义；静态数据声明；私有函数原型；公共函数实现体；然后是私有函数实现体；\n\
    \n- 每个源文件应始终 #include 同名的头文件（例如，文件 `adc.c` 应该包含 `\"adc.h\"`），以允许编译器确认每个公共函数及其原型相匹配。\n\
    \n- 包含文件名中不应使用绝对路径。\n\n- 每个源文件应不包含未使用的包含文件。\n\n- 任何源文件属性 #include 另一个源文件。\n\n\
