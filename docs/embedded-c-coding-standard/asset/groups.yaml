    \ the preprocessor tokens /*, //, or \\.\n- Code should never be commented out,\
    \ even temporarily.\n  - To temporarily disable a block of code, use the preprocessor's\
    \ conditional compilation feature (e.g., #if 0 ... #endif).\n  - Any line or block\
    \ of code that exists specifically to increase the level of debug output information\
    \ shall be surrounded by #ifdef NDEBUG ... #endif.\n\nExample:\n\n```\n/* The\
    \ following code was meant to be part of the build...\n...\nsafety_checker();\n\
    ...\n/* ... but an end of comment character sequence was omitted. */\n```\n\n\
    **Reasoning:** Whether intentional or not, nested comments run the risk of confusing\
    \ source code reviewers about the chunks of the code that will be compiled and\
    \ run. Our choice of negative-logic NDEBUG is deliberate, as that constant is\
    \ also associated with disabling the assert() macro. In both cases, the programmer\
    \ acts as to disable the verbose code.\n\n**Enforcement:** The use of only permitted\
    \ comment formats can be partially enforced by the compiler or static analysis.\
    \ However, only human code reviewers can tell the difference between commented-out\
    \ code and comments containing descriptive code snippets.\n\n# Embedded C Coding\
    \ Standard\n\n## 2.2 Locations and Content\n\nRules:\n\n- All comments shall be\
    \ written in clear and complete sentences, with proper spelling and grammar and\
    \ appropriate punctuation.\n\n- The most useful comments generally precede a block\
    \ of code that performs one step of a larger algorithm. A blank line shall follow\
    \ each such code block. The comments in front of the block should be at the same\
    \ indentation level.\n\n- Avoid the obvious. Assume the reader knows the C programming\
    \ language. For example, end-of-line comments should only be used where the meaning\
    \ of one line could be unclear from the variable and function names and operations\
    \ alone where a short comment makes it clear. Specifically, avoid unhelpful and\
    \ redundant comments, e.g., `number << 2; // Shift number left 2 bits.`\n\n- The\
    \ number and length of individual comment blocks shall be proportional to the\
    \ complexity of the code they describe.\n\n- Whenever an algorithm or technical\
    \ detail is defined in an external reference—e.g., a design specification, patent,\
    \ or textbook—a comment should include a sufficient reference to the original\
    \ source to allow a reader of the code to locate the document.\n\n- Whenever a\
    \ flow chart or other diagram is needed to sufficiently document the code, the\
    \ drawing should be maintained with the source code under version control and\
    \ the comments should reference the diagram by file name or title.\n\n- All assumptions\
    \ shall be spelled out in comments.³\n\n- Each module and function shall be commented\
    \ in a manner suitable for automatic documentation generation, e.g., via Doxygen.\n\
    \n![](img/25b91ff016aae4a7e187afd99b37dc2d_29_0.png)\n\n> ³ Even better than comments\
    \ is a set of design-by-contract tests or assertions. See, e.g., barrgroup.com/embedded-systems/how-to/design-by-contract-for-embedded-software.\n\
    \n# Embedded C Coding Standard\n\n- i. Use the following capitalized comment markers\
    \ to highlight important issues:\n\n- ii. \"WARNING:\" alerts a maintainer there\
    \ is risk in changing this code. For example, a delay loop counter's terminal\
    \ value was determined empirically and may need to change when the code is ported\
    \ or the optimization level tweaked.\n\n- iii. \"NOTE:\" provides descriptive\
    \ comments about the \"why\" of a chunk of code—as distinguished from the \"how\"\
    \ usually placed in comments. For example, a chunk of driver code deviates from\
    \ the datasheet because there was an errata in the chip. Or that an assumption\
    \ is being made by the original programmer.\n\n- iv. \"TODO\" indicates an area\
    \ of the code is still under construction and explains what remains to be done.\
    \ When appropriate, an all-caps programmer name or set of initials may be included\
    \ before the word TODO (e.g., \"MJB TODO:\").\n\nExample:\n\n```\n// Step 1: Batten\
    \ down hatches.\nfor (int hatch = 0; hatch < NUM_HATCHES; hatch++)\n{\n    if\
    \ (hatch_is_open(hatch[hatch]))\n    {\n        hatch_close(hatch[hatch]);\n \
    \   }\n}\n```\n\n```\n// Step 2: Raise the mizzenmast.\n// TODO: Define mizzenmast\
    \ driver API.\n```\n\n# Embedded C Coding Standard\n\n**Reasoning:** Following\
    \ these rules results in good comments. And good comments correlate with good\
    \ code. It is a best practice to write the comments before writing the code that\
    \ implements the behaviors those comments outline.\n\nUnfortunately, it is easy\
    \ for source code and documentation to drift over time. The best way to prevent\
    \ this is to keep the documentation as close to the code as possible. Likewise,\
    \ anytime a question is asked about a section of the code that was previously\
    \ thought to be clear, you should add a comment addressing that issue nearby.\n\
    \nDoxygen is a useful tool to generate documentation describing the modules, functions,\
    \ and parameters of an API for its users. However, comments are all still necessary\
    \ inside the function bodies to reduce the cost of code maintenance.\n\n**Enforcement:**\
    \ The quality of comments shall be evaluated during code reviews. Code reviewers\
    \ should verify that comments accurately describe the code and are also clear,\
    \ concise, and valuable. Automatically generated documentation should be rebuilt\
    \ each time the software is built.\n\n# White Space Rules\n\n## 3.1 Spaces\n\n\
    Rules:\n\n- a. Each of the keywords if, while, for, switch, and return shall be\
    \ followed by one space when there is additional program text on the same line.\n\
    - b. Each of the assignment operators =, +=, -=, *, /=, &=, |=, ^=, -= != shall\
    \ always be preceded and followed by one space.\n- c. Each of the binary operators\
    \ +, -, *, %, <, <=, ==, <<, >>, |, ^, && and || shall be preceded and followed\
    \ by one space.\n- d. Each of the unary operators *, -, +, --, !, and ~, shall\
    \ be written without a space on the operand.\n- e. The pointer operators * and\
    \ & shall be written with white space on each side within declarations or otherwise\
    \ without a space on the operand.\n- f. The ? and : characters that comprise the\
    \ ternary operator shall always be preceded and followed by one space.\n- g. The\
    \ structure pointer and structure member operators (-> and .), respectively shall\
    \ always be without surrounding spaces.\n- h. The left and right brackets of the\
    \ array subscript operator (( and )) shall be without surrounding spaces, except\
    \ as required by another white space rule.\n- i. Expressions in parentheses shall\
    \ always have no spaces adjacent to the left and right parenthesis characters.\n\
    - j. The left and right parentheses of the function call shall always be without\
    \ surrounding spaces, except that the function declaration shall feature one space\
    \ between the function name and the left parenthesis to allow that one particular\
    \ mention of the function name to be easily located.\n- k. Except when at the\
    \ end of a line, each comma separating function parameters shall always be followed\
    \ by one space.\n"
