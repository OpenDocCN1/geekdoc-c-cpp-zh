    \n### 1.2 行宽\n\n规则：\n\n- a. 程序中所有行的宽度应限制在最多 80 个字符。\n\n理由：偶尔会对打印的页面进行同行评审和其他代码检查。为了使其有用，这些打印输出必须没有分散注意的折行，也没有缺失（即超出右边距）的字符。行宽规则还便于在屏幕上并排对比不同的代码。\n\
