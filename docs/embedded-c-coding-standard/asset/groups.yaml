    \ 的算法参数。\n//\n#define BITS_PER_BYTE 8\n#define WIDTH (BITS_PER_BYTE * sizeof(crc_t))\n\
    #define TOPBIT (1 << (WIDTH - 1))\n\n// 为字节宽 CRC 分配存储。\n//\n#define CRC_TABLE_SIZE\
    \ 256\nstatic crc_t g_crc_table[CRC_TABLE_SIZE];\n\n// 支持所选 CRC 标准的配置。\n//\n#if\
    \ defined(CRC_CCITT)\n\n#define POLYNOMIAL (uint16_t) 0x1021\n#define INITIAL_REMAINDER\
    \ (uint16_t) 0xFFFF\n#define FINAL_XOR_VALUE (uint16_t) 0x0000\n#define REFLECT_DATA(X)\
    \ (X)\n#define REFLECT_REMAINDER(X) (X)\n\n#elif defined(CRC_16)\n\n#define POLYNOMIAL\
    \ (uint16_t) 0x8005\n#define INITIAL_REMAINDER (uint16_t) 0x0000\n#define FINAL_XOR_VALUE\
    \ (uint16_t) 0x0000\n#define REFLECT_DATA(X) ((uint16_t) reflect(X), BITS_PER_BYTE)\n\
    #define REFLECT_REMAINDER(X) ((uint16_t) reflect(X), WIDTH)\n\n#elif defined(CRC_32)\n\
    \n#define POLYNOMIAL (uint32_t) 0x04C1DB7\n#define INITIAL_REMAINDER (uint32_t)\
    \ 0xFFFFFFFFFF\n#define FINAL_XOR_VALUE (uint32_t) 0xFFFFFFFF\n#define REFLECT_DATA(X)\
    \ ((uint32_t) reflect(X), BITS_PER_BYTE)\n#define REFLECT_REMAINDER(X) ((uint32_t)\
    \ reflect(X), WIDTH)\n\n#endif\n\n/**\n * @brief 计算一组数据位围绕其中心进行反射。\n * @param[in]\
