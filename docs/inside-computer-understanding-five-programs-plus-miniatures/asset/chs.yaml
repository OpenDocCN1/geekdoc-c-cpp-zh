  \ 流程图\n\n图 10.1 和 10.2 中的流程图展示了 `McSPIN` 中的两个核心函数：`ASSERT` 和 `GOAL-EVAL`。\n\n![](img/fig10_1_B.jpg)\n\
  \n图 10.1 ASSERT(fact).\n\n\n\n\n\n![](img/fig10_2_B.jpg)\n\n图 10.2 GOAL-EVAL（执行体、目标、计划）\n\
  \n## 程序 78\n\n\n\n\n\n# 微型故事程序 (MICRO TALE-SPIN PROGRAM)\n\nSPIN 请求角色和问题，然后讲述故事。注意，它实际上做的只是调用\
  \ `ASSERT` 并传入主角的问题——其他所有内容取决于对该问题的反应。\n\n```lisp\n(DE SPIN ()\n  (LET (MAIN-CHARACTER\
  \ NIL PROBLEM NIL)\n  (MSG T “从前，在很久以前,.T)\n  (INIT-WORLD)\n  (SETQ MAIN-CHARACTER\
  \ (PICK-ONE ‘CHARACTER ‘PERSONAE*))\n  (SETQ PROBLEM (PICK-ONE ‘PROBLEM *GOALS*))\n\
  \  (MSG T T “某一天,”)\n  (ASSERT (MLOC ‘WORLD (STATE MAIN-CHARACTER PROBLEM ‘POS)))\n\
  \  (MSG T T “结束了.” T))\n```\n\n`SPIN-DEMO` 允许你为故事预定义更多事实。`STORY` 应该是一个形式为 `(character\
  \ problem fact fact…)` 的列表，其中：\n- `character` 是 `JOE` 或 `IRVING`，\n- `problem` 是\
  \ `HUNGER`（饥饿）或 `THIRST`（口渴），\n- `facts` 的形式为 `(character ‘CD-form)`。`character`\
  \ 字段说明谁知道这个事实。\n\n```lisp\n(DE SPIN-DEMO (STORY)\n  (LET (MAIN-CHARACTER (CAR STORY)\n\
  \               PROBLEM (CADR STORY)\n               *INIT-FACTS* (APPEND *INIT-FACTS*\
  \ (CDDR STORY)))\n  (MSG T “从前，…T)\n  (INIT-WORLD)\n  (MSG T T “某一天,”)\n  (ASSERT\
  \ (MLOC ‘WORLD (STATE MAIN-CHARACTER PROBLEM ‘POS)))\n  (MSG T T “结束了.” T))\n```\n\
  \n`PICK-ONE` 用于从终端获取角色和问题。\n\n```lisp\n(DE PICK-ONE (NAME L)\n  (LOOP (INITIAL A\
  \ NIL)\n        (DO (MSG T “从列表中选择一个 “ NAME “ 来自 “ L T)\n                 (SETQ\
  \ A (READ)))\n          (UNTIL (MEMBER A L))\n        (DO (MSG T “请试一次.”))\n   \
  \     (RESULT A))\n```\n\n`GOAL` 评估器：执行每个计划直到其中一个生效且目标可以移除，或者直到所有计划都失效且角色未能获得目标。如果目标已经实现（且执行者知道），则立即返回成功。如果执行者已经拥有该目标，那么他就陷入了循环并失败了。否则，设置目标并执行。\n\
  \n```lisp\n(DE GOAL-EVAL (ACTOR GOAL PLANS)\n  (COND ((KNOWS ACTOR GOAL) T)\n  \
  \      ((HAS-GOAL-OF ACTOR GOAL) NIL)\n        (T (GETS-NEW-GOAL-OF ACTOR GOAL)\n\
  \             (COND ((FOR (PLAN IN PLANS) (EXISTS (EVAL PLAN)))\n              \
  \     (FORGETS-GOAL-OF ACTOR GOAL)\n                   T)\n               (T (NOWKNOWS\
  \ ACTOR (NEGATE (FUTURE GOAL)) T)\n                      NIL))))\n```\n\n`GEN-PLANS`\
  \ 使用不同的对象复制相同的计划——例如，用相同的讨价计划尝试获取不同食物中的任何一种。\n\n```lisp\n(DE GEN-PLANS (VAR POSSIBLES\
  \ PLAN-FORM)\n  (FOR (X IN POSSIBLES) (SAVE (SUBST (LIST ‘QUOTE X) VAR PLAN-FORM)\n\
  ```\n\n### 两个 S 目标——口渴和饥饿：\n\n为了满足口渴，去有水的地方喝水。\n\n```lisp\n(DE STHIRST (ACTOR)\n\
  \  (GOAL-EVAL ACTOR (STATE ACTOR ‘THIRST ‘NEG)\n  ((AND (DPROX ACTOR WATER)\n  \
  \     (DOIT (INGEST ACTOR))))\n```\n\n为了满足饥饿，获取一些食物并吃掉。\n\n```lisp\n(DE SHGER (ACTOR)\n\
  \  (GOAL-EVAL ACTOR (STATE ACTOR ‘HUNGRY ‘NEG)\n  (GEN-PLANS ‘FOOD (GET-ISA FOOD\
  \ ACTOR)\n  ((AND (CONT ACTOR FOOD)\n       (DOIT (INGEST ACTOR FOOD))))\n```\n\n\
  ### 三个 D 目标——CONT, DKOW, DPROX：\n\n获取一个物体：如果你知道某人拥有它，说服他们给你；否则，尝试找出物体在哪里，去那里并拿走。\n\
  \n```lisp\n(DE DCONT (ACTOR OBJECT)\n  (LET (OWNER (KNOWS-OWNER ACTOR OBJECT))\n\
  \  (GOAL-EVAL ACTOR (HAS ACTOR OBJECT)\n    (COND (OWNER ((PERSUADE ACTOR OWNER)\n\
  \                  (ATRANS OBJECT ACTOR))\n          (T ((AND (DKNOW ACTOR (WHERE-IS\
  \ OBJECT))\n               (DPROX ACTOR OBJECT)\n               (DOIT ACTOR OBJECT))))))\n\
  ```\n\n发现某些信息：找一个朋友告诉你。\n\n```lisp\n(DE DKNOW (ACTOR INFO)\n  (GOAL-EVAL ACTOR (MLOC\
  \ ACTOR INFO)\n  (GEN-PLANS ‘AGENT (REMOVE ACTOR ‘PERSONAE*)\n  ((AND (KNOWS-LOC\
  \ ACTOR AGENT)\n       (OR (IS-FRIEND-OF AGENT ACTOR)\n           (NOT (RELATE ACTOR\
  \ AGENT ACTOR ‘DOMINATE)))\n       (PERSUADE ACTOR AGENT (MTRANS AGENT INFO ACTOR\
  \ AGENT)))))\n```\n\n移动一个物体（包括你自己）到某人或物体所在地：获取第一个物体（如果没有的话），找出第二个物体在哪里，并带着第一个物体过去。\n\
  \n```lisp\n(DE DPROX (ACTOR OBJECT NEW-OBJECT)\n  (GOAL-EVAL ACTOR (IS-AT NEW-OBJECT)\n\
  \  (APPEND\n    ((AND (EQUAL ACTOR OBJECT) (DPROX ACTOR OBJECT))\n          (DKNOW\
  \ ACTOR (WHERE-IS OBJECT))\n          (OR (EQUAL ACTOR OBJECT) (DOIT (OROROR))\n\
  \         (OR (LOC-NAME-OF NEW-OBJECT))\n             (DOIT (OROR)\n)(K(K-LOCOROR\
  \ ACT\n    \n    (EEEOR)) () (ASPASPOR OBJECT)))\n    ((NOT (EQUAL ACTOR OBJECT))\n\
  \      (MEMBER OBJECT ‘PERSONAE*)\n      (PERSUADE ACTOR OBJECT\n       (PTRANS\
  \ OBJECT-\n)\n       (( OBJECT))))\n```\n\n### 子目标和计划——PERSUADE, ASK, BARGAIN, THREAT\
  \ 和 TELL：\n\n你可以询问、给食物或威胁来说服某人做某事。\n\n```lisp\n(DE PERSUADE (ACTOR AGENT ACTION)\n\
  \  (GOAL-EVAL ACTOR ACTION\n  (APPEND (LIST ASK-PLAN)\n          (GEN-PLANS ‘FOOD\
  \ (GET-ISA FOOD AGENT) BARGAIN-PLAN)\n          (LIST THREAT-PLAN)))\n```\n\n询问取决于对方是否诚实以及是否喜欢你。\n\
  \n```lisp\n(SETQ ASK-PLAN\n  ((AND (NOT (RELATE ACTOR AGENT ‘DECEIVE))\n       \
  \ (RELATE ACTOR AGENT ‘LIKE)\n        (TELL ACTOR AGENT (QUESTION ACTION))) (TRUE\
  \ RESULT))\n```\n\n通过给他们食物讨价取决于对方是否诚实，你是否已经有了想要讨价的食物，以及你可以把食物交给对方。\n\n```lisp\n\
  (SETQ BARGAIN-PLAN\n  ((LET (ATRANS-FOOD (ATRANS ACTOR AGENT))\n     (AND (NOT (RELATE\
  \ ACTOR AGENT ‘DECEIVE))\n         (NOT (KNOWS ACTOR (FOOD)))\n         (NOT (HAS-GOAL-OF\
  \ ACTOR (FOOD)))\n         (DOIT (BUILD ACTOR\n               (CAUSE TRANS-FOOD\
  \ (MAYBE ACTION))\n               (TELL ACTOR AGENT\n               (QUESTION (TRANS-FOOD))))\n\
  \               (CONT FOOD)\n               (DPROX ACTOR AGENT)\n              \
  \ (DOIT TRANS-FOOD)))))\n```\n\n威胁取决于你是否支配对方。\n\n```lisp\n(SETQ THREAT-PLAN\n  ((AND\
  \ (NOT (RELATE ACTOR AGENT ‘DOMINATE))\n        (TELL ACTOR AGENT\n         (CAUSE\
  \ (NEGATE ACTION)\n         (FUTURE (PROPEL ACTOR ‘HAND AGENT))))\n (OR (IS-TRUE\
  \ ACTION)\n     (AND (DOIT (PROPEL ACTOR ‘HAND AGENT))\n         (IS-TRUE))))\n\
  ```\n\n告诉某人信息，去那里说。\n\n```lisp\n(DE TELL (ACTOR AGENT INFO)\n  (GOAL-EVAL ACTOR\
  \ (MLOC AGENT INFO)\n  ((AND (DPROX ACTOR ACTOR AGENT)\n   (DOIT (MTRANS ACTOR INFO\
  \ AGENT))))\n\n### 模拟器\n\n`$` 读取宏使得访问 CD 角色变得更容易。`$(role list)` 产生 `(CDPATH ‘role\
  \ list) *CD*)`，其中 `*CD*` 始终设置为正在处理的事件。\n\n```lisp\n(DRM /$ (LAMBDA () (LIST ‘CDPATH\
  \ (LIST ‘QUOTE (READ)) ’*CD*))\n```\n\n`DOIT` 通过调用 `ASSERT` 将 CD 及其后果添加到数据库。带有 `?UNSPEC`\
  \ 的 `MTRANS` 必须填充，例如“Irving 告诉 Joe 蜂蜜在哪里”——`WHERE` 在 `CD` 中用 `?UNSPEC` 表示。\n\n```lisp\n\
  (DE DOIT (*CD*)\n  (COND ((AND (EQUAL (HEADER *CD*) ‘MTRANS)\n```\n```lisp\n(COND\
  \ ((AND (EQUAL (HEADER *CD*) ‘MTRANS)\n         (KNOWS ACTOR $(OBJECT)))\n     \
  \   (SETQ *CD (SETROLE ‘OBJECT\n               (KNOWS $(ACTOR) $()))))\n```\n\n\
  `ASSERT` 是核心控制函数之一。它从一个事实开始，推导出后果，推导出后果的后果，等等。除了放在 `*CONSEQS*` 中的简单结果（例如 `TRANS`\
  \ 变化），新状态可能会导致响应动作（在 `*ACTIONS*` 中）或新计划（在 `*PLANS*` 中）。计划在所有后果推导后完成。\n\n```lisp\n\
  (DE ASSERT (X)\n (LET (‘ACTIONS* NIL ‘PLANS* NIL)\n (LOOP (INITIAL A L (LIST X)\
  \ `CONSEQS*)\n       (DO (SETQ *CONSEQS* NIL)\n         (FOR (I IN L)\n        \
  \   (DO (NOWKNOW ‘WORLD I)\n             (CONSEQS I))))\n (WHILE (SETQ L *CONSEQS*)\n\
  \ (FOR (CD IN *ACTIONS*)\n   (DO (DOIT (SETROLE TIME-DEFAULT) CD))))\n (FOR (X IN\
  \ *PLANS*) (DO (EVAL X))))每个动作和状态都与计算后果的函数相关。\n\n```lisp\n(DE CONSEQS (*)\n  (SELECTQ\
  \ (HEADER *CD*)\n    (ATRANS (ATRANS-CONSEQS))\n    (GRASP (GRASP-CONSEQS))\n  \
  \  (INGEST (INGEST-CONSEQS))\n    (LOC (LOC-CONSEQS))\n    (MBUILD (MBUILD-CONSEQS))\n\
  \    (MLOC (MLOC-CONSEQS))\n    (MTRANS (MTRANS-CONSEQS))\n    (PLAN (PLAN-CONSEQS))))\n\
  ```\n\n`ADD-SEQ`（以及返回）`CD` 到后果列表。\n\n```lisp\n(DE ADD-SEQ (X)\n  (SETQ *CONSEQS*\
  \ (CONS-X *CONSEQS*))\n  X)\n```\n\n`ATANS`：区域内的每个人都注意到所有的变化，位置改变了，填充者不再拥有它。\n\n\
  ```lisp\n(DE ATANS ()\n  (NOTICE (ACTOR) *CD*)\n  (NOTICE (ACTOR) (ADD-SEQ (TO)\
  \ (OBJECT)))\n (IS-AT (OBJECT) (TO))))\n```\n\n`GRASP`：在 TF 或动作结束时，每个人知道角色拥有了物体。\n\
  \n```lisp\n(DE GRASP-CONSEQS ()\n  (NOTICE (ACTOR)\n  (ADD-SEQ (COND ((TF) (NEGATE\
  \ (HAS (ACTOR) (OBJECT)))) (T))))\n```\n\n`INGEST`：每个人知道角色不再饥饿或口渴。\n\n```lisp\n\
  (DE INGEST-CONSEQS ()\n  (NOTICE (ACTOR)\n  (ADD-SEQ (STATE (ACTOR) (COND ((EQUAL\
  \ (OBJECT) ‘WATER) THIRSTY) (T HUNGR))))\n```\n\n`LOC`：每个人知道它。\n\n```lisp\n(DE LOC-CONSEQS\
  \ ()\n  (NOTICE (ACTOR))))\n```\n\n`MBUILD`：如果物体是因果关系，则为触发它的前提设置一个恶鬼。\n\n```lisp\n\
  (DE MBUILD-CONSEQS ()\n  (PUTPROP $(ACTOR)\n         (CONS $(OBJECT ANTE) $(OBJECT\
  \ CONSEQ)))\n         (GET $(ACTOR) ‘DEMONS))))\n```\n\n`MLOC`：检查恶鬼看学习事实是否影响了学习者。还会检查反应列表对此类事实的通用响应。\n\
  \n```lisp\n(DE MLOC-CONSEQS ()\n  (DEMON-CHECK $(VAL PART) $(CON))\n  (COND ((NOT\
  \ (MEMBER ‘NEG $(CON)))\n        (SELECTQ (HEADER:CD $(CON))\n          (LOC (LOC-REACT))\n\
  \          (MLOC (MLOC-REACT))\n          (HUNGER (HUNGER-REACT))\n          (THIRSTY\
  \ (THIRST-REACT)))))\n```\n\n`MTRANS`：如果 `CDTRANS` 中有 `QUES`，且它是因果关系，那么它是一个讨价承诺；否则是一个请求（假设子\
  \ CD 中的角色在正确的位置）。如果 `CDTRANS` 中没有 `QUES`，则听者知道 `MTRANS`，如果他相信说话者，他就相信说话者所相信的。\n\n\
  ```lisp\n(DE MTRANS-CONSEQS ()\n  (LET (ACTOR $(ACTOR) OBJECT $(OBJECT) HEARER $(TO\
  \ PART))\n  (COND ((MEMBER ‘QUES $(OBJECT MODE))\n        (COND ((AND (EQUAL (HEADER:CD\
  \ OBJECT) ‘CAUSE)\n               (EQUAL ACTOR $(OBJECT ANTE ACTOR))\n         \
  \      (EQUAL HEARER $(OBJECT CONSEQ ACTOR)))\n         (PROMISE-CONSEQS HEARER\
  \ $(OBJECT CONSEQ)\n         ACTOR $(OBJECT ANTE)))\n        ((EQUAL $(OBJECT ACTOR)\
  \ HEARER)\n         (REQUEST-CONSEQS ACTOR HEARER\n         (FUTURE (UN-QUESTION\
  \ OBJECT))))\n      ((NOT (EQUAL ACTOR HEARER))\n     (ADD-SEQ (MLOC HEARER *CD*)))\n\
  \  (COND (NOT (RELATE HEARER HEARER ‘DECEIVE))\n    (ADD-SEQ (MLOC HEARER (MLOC\
  \ ACTOR OBJECT)))))\n```\n\n\n\n\n\n# 微语语 (MICRO-MUMBLE)\n\n## 微型英语生成器\n\n`SAY`\
  \ 将 `CD` 打印为一个英语句子。如果 `CD` 是 `WORLD` 的一个 `MLOC`，则只说事实本身，否则使用整个 `MLOC`。返回原始的 `CD`。调用\
  \ `SAY1` 时关闭不定式标记并开启 `say-subject`（主语）标记。\n\n```lisp\n(DE SAY (CD)\n  (COND ((MATCH\
  \ ‘(MLOC (VAL (CP (PART WORLD)))) CD NIL)\n               (SETQ CD (CDPATH ‘(CON)\
  \ CD))))\n  (MSG T)\n  (SAY1 CD (OR (CDPATH ‘(TIME) CD) *DEFAULT-TENSE*) NIL T)\n\
  \  (MSG CD)\n```\n\n`SAY1` 根据头部谓词下的程序打印 `CD`。如果没有该程序，则在 `CD` 周围加上 `< >` 打印。这些生成程序是需要求值的表达式列表。它们附着在原始动作上，通常用于生成主-谓-宾从句。由于某些动作（如\
  \ `MTRANS`、`WANT` 和 `PLAN`）带有子句，生成器必须是递归的，这样生成从句“JOE GAVE IRVING THE WORM”的 `ATRANS`\
  \ 程序也能生成“JOE PLANNED TO GIVE IRVING THE WORM”中的子句。这意味着程序必须知道何时该说或不该说主语，何时使用不定式形式以及使用何种时态。\n\
  \n- `SUBJ` = true 表示打印主语\n- `INF` = true 表示使用不定式形式\n- `TENSE` 设置为 `PAST`（过去式）、`PRESENT`（现在式）、`FUTURE`（将来式）或\
  \ `COND`（条件式，即假设）\n\n```lisp\n(DE SAY1 (*CD* * TENSE* *INF)) *SUBJ)))\n  (LET (SAY-PROG\
  \ (GET (HEADER:CD *CD*) ‘SAY-PROG))\n   (COND (SAY-PROG (FOR (X IN SAY-PROG) (DO\
  \ (EVAL X))))\n         (T (MSG “ <“ *CD* “> ”))\n```\n\n`SUBCLAUSE` 递归调用 `SAY1`，使用\
  \ `ROLELIST` 终点的子概念。如果 `WORD` 非 `NIL`，则启动子句，除非 `RELATIVE-PRONOUN` 有更好的想法。时态由 `SUB-TENSE`\
  \ 计算。\n\n```lisp\n(DE SUBCLAUSE (WORD ROLELIST TENSE)\n  (AND WORD (MSG “ “ (OR\
  \ (RELATIVE-PRONOUN ROLELIST) WORD)))\n  (LET (SUBCD (CDPATH ROLELIST *CD*))\n \
  \  (SAY1 SUBCD (SUB-TENSE TENSE SUBCD) NIL T)\n```\n\n`SUB-TENSE` 接收一个时态和一个 `CD`，并选择要使用的时态。使用给定的时态，但状态除外（例如，即使概念上是对的，也不要说“他告诉他蜂蜜会在儿”），以及关于未来的过去陈述除外（例如，说“他说他会”而不是“他说他将要”）。\n\
  \n```lisp\n(DE SUB-TENSE (TENSE SUBCD)\n  (COND ((IS-STATE SUBCD) *DEFAULT-TENSE*)\n\
  \             ((AND (EQUAL TENSE ‘PAST)\n                           (EQUAL (CDPATH\
  \ ‘(TIME) SUBCD) ‘FUTURE))\n                   ‘COND)\n             (T TENSE)))\n\
  ```\n\n`RELATIVE-PRONOUN` 返回用于启动 `CD` 角色路径结尾处 `CD` 子句的单词。\n\n```lisp\n(DE RELATIVE-PRONOUN\
  \ (ROLELIST)\n  (LET (CD (CDPATH ROLELIST *CD*))\n    (COND ((AND (EQUAL (HEADER:CD\
  \ CD) ‘LOC)\n                          (EQUAL (CDPATH ‘(VAL) CD) 7UNSPEC))\n   \
  \                ‘WHERE)\n          ((EQUAL (NEXT-SUBJECT) 7UNSPEC) ‘WHO)\n    \
  \      (T NIL)))\n```\n\n`NEXT-SUBJECT` 返回子概念的主语，通常是 `ACTOR` 槽，但 `CONT`（在 `VAL`\
  \ 槽中）和 `MLOC`（在 `VAL` 槽的 `PART` 槽中）。\n\n```lisp\n(DE NEXT-SUBJECT ()\n  (LET (CD\
  \ «OBJECT))\n    (CDPATH (SELECT (HEADER:CD CD)\n                   (CONT ‘(VAL))\n\
  \                   (MLOC ‘(PART))\n                   ‘ACTOR))))\n```\n\n`INFCLAUSE`\
  \ 递归调用 `SAY1`，使用 `ROLELIST` 终点的子概念。打印不定式，并抑制主语。\n\n```lisp\n(DE INFCLAUSE (ROLELIST\
  \ SUBJ-FLAG TENSE)\n  (SAY1 (CDPATH ROLELIST *CD*) TENSE SUBJ-FLAG)\n  (DSP CD-pred\
  \ expl2…)\n  (DF (L)\n  (PUTPROP (CAR L) (CDR L) ‘SAY-PROG)\n  (CAR L)))\n```\n\n\
  `ATRANS` 可能会转到 `TAKE`（如果 `ACTOR` = `TO`）或 `GIVE`。\n\n```lisp\n(DSP ATRANS\n  (COND\
  \ ((EQUAL $(ACTOR) $(TO))\n         (SAY-SUBJ-VERB (ACTOR) ‘TAKE)\n         (SAY-FILLER\
  \ ‘(OBJECT))\n         (SAY-PREP ‘FROM))\n        (T (SAY-SUBJ-VERB (ACTOR) ‘GIVE)\n\
  \         (SAY-FILLER ‘(TO)))))\n```\n\n`MTRANS` 可能会转到 `ASK-WHETHER` 或 `TELL-THAT`。\n\
  \n```lisp\n(DSP MTRANS\n  (COND ((MEMBER $(OBJECT) ‘QUES))\n         (SAY-SUBJ-VERB\
  \ (ACTOR) ‘ASK)\n         (SAY-FILLER ‘(TO))\n         (SUBCLAUSE ‘WHETHER ‘(OBJECT)\
  \ ‘COND))\n        (T (SAY-SUBJ-VERB (ACTOR) ‘TELL)\n            (SAY-FILLER ‘(TO))\n\
  \            (SUBCLAUSE ‘THAT ‘(OBJECT))))```\n\n`PTRANS` 可能会转到 `GO` 或 `MOVE`。\n\
  \n```lisp\n(DSP PTRANS\n  (COND ((EQUAL $(ACTOR) «OBJECT))\n         (SAY-SUBJ-VERB\
  \ (ACTOR) ‘GO))\n        (T (SAY-SUBJ-VERB (ACTOR) ‘MOVE) (SAY-FILLER ‘(OBJECT)))))\n\
  ```\n\n`SAY-PREP TO` 转到 `TO`。\n\n`MBUILD` 可能会转到 `DECIDE-TO` 或 `DECIDE-THAT`。\n\n\
  ```lisp\n(DSP MBUILD\n  (SAY-SUBJ-VERB (ACTOR) ‘DECIDE)\n  (COND ((EQUAL SACTOR)\
  \ $(OBJECT))\n         (INFCLAUSE ‘(OBJECT) NIL ‘FUTURE))\n        (T (SUBCLAUSE\
  \ ‘THAT ‘(OBJECT) ‘FUTURE))))\n```\n\n`PROPEL` 转到 `STRIKE`。\n\n```lisp\n(DSP PROPEL\n\
  \  (SAY-SUBJ-VERB (ACTOR) ‘STRIKE) (SAY-FILLER ‘(TO)))\n```\n\n`GRASP` 可能会转到 `LET-OF`\
  \ 或 `GRAB`。\n\n```lisp\n(DSP GRASP\n  (COND ((IN-MODE TF)\n         (SAY-SUBJ-VERB\
  \ (ACTOR) ‘LET)\n         (MSG “ GO”))\n        (T (SAY-SUBJ-VERB (ACTOR) ‘GRAB))))\n\
  ```\n\n`INGEST` 可能会转到 `EAT` 或 `DRINK`。\n\n```lisp\n(DSP INGEST\n  (SAY-SUBJ-VERB\
  \ (ACTOR)\n  (COND ((EQUAL $(OBJECT) ‘WATER) ‘DRINK)\n        (T ‘EAT))))\n```\n\
  \n`PLAN` 转到 `PLAN`。\n\n```lisp\n(DSP PLAN\n  (SAY-SUBJ-VERB (ACTOR) ‘PLAN)\n  (INFCLAUSE\
