  [PHOTO：记录终止于 1978 年 3 月 30 日周四下午 4:34]\n```\n\n# Pam 的技术描述\n\n## 引言\n\n`PAM` 的各个组件之间存在着频繁的交互。预测组件和自下而上组件相互传递概念（conceptualizations）；这些组件认为有用的规则会被传递给整合组件（incorporation\
  \ component）以添加到表示中；整合组件会移除旧预测并添加新预测，从而影响预测组件未来的行为方式。\n\n由于它们之间深度的交互，在不描述其他模块细节的情况下，很难描述任何一个模块的细节。相反，讨论这些机制及其交互的核心内容更具启发性，即它们所使用的规则的本质以及如何操纵这些规则。本节对\
  \ `PAM` 的处理提供了一个简化的描述，以展示其所用规则的结构，并描述程序的各个组件如何使用这种结构。接下来的章节将更详细地描述处理过程。\n\n考虑以下简单的故事：\n\
  \n> (1) 约翰饿了。他在餐厅吃饭了。\n\n`PAM` 为此例生成的表示应该包含以下元素。故事有一个主题，即约翰饿了，这产生了约翰满足饥饿的目标。为了实现这个目标，约翰选择了执行“餐厅脚本”的计划。然后约翰通过在餐厅吃饭执行了这一计划。\n\
  \n`PAM` 读取第一句，该句在概念依赖（Conceptual Dependency）中的表示如下：\n\n```\n ((ACTOR HUM0 IS (*HUNGER*\
  \ VAL (–3))))\n```\n\n这个句子实际上超出了上述定义的解释算法的范围。这个句子是一个状态，而不是动作、计划或目标，而我们还没有指定如何处理状态。`PAM`\
  \ 并不试图解释状态。相反，`PAM` 确定该状态是否会产生目标，如果产生，`PAM` 将推断出该目标。虽然这不是一种解释性的推理，但它是 `PAM` 通过相同的机制和规则结构做出的推理，因此同样很好地作为了说明。\n\
  \n首先，`PAM` 的预测组件检查是否已经预测了输入。由于没有预测，控制权交给了自下而上组件。`PAM` 使用该组件来判断是否存在任何条件满足此输入的规则，并发现有这样一条规则。`PAM`\
  \ 中的规则以 `LISP` 原子的形式存储，带有条件等，并作为这些原子的属性保留。例如，找到的规则可能被称为 `HUNGER-RULE`，它具有以下条件：\n\
  \n```\n HUNGER-RULE\n Condition: CD matches “Person is hungry”\n```\n\n每个条件谓词（predicate）都是一个单参数函数，通常是一个\
  \ `CD` 形式。\n\n将此谓词应用于输入概念后返回真（true），因此 `PAM` 现在继续评估该规则的动作。`HUNGER-RULE` 的动作编写如下：\n\
  \n```\n HUNGER-RULE\n Action: ADD GOAL: S-HUNGER PLANNER ()\n SOURCE: THEME = HUNGER-DRIVE\n\
  \ PLAN: ()\n```\n\n此动作构建了一个名为“目标片段”（goal episode）的结构，并包含三个角色：目标、目标来源和计划。`GOAL` 角色由一个表示目标\
  \ `Satisfy-hunger` 的表示填充，`SOURCE` 角色由具有饥饿驱动的主题填充，而 `PLAN` 角色留空。\n\n表示中的空角色被称为 `gap`(Riesbeck,\
  \ 1975)。`gap` 是可以由后续句子填充的表示部分。`HUNGER-RULE` 构建的结构中 `plan` 角色的 `gap` 意味着目标通常会产生计划，虽然用于该目标的计划尚未知，但它在故事的后面可能会变得明确。\n\
  \n因此，`gap` 是故事中的一个位置，理解者根据应用知识的性质知道它必须存在。也就是说，`PAM` 知晓目标有产生它们的来源以及实现它们的计划。这种知识通过包含这些项目的的结构来表示。\n\
  \n在自下而上组件构建了该结构后，该结构被传回给预测组件，后者再次检查是否确认了预测。在故事理解开始时，需要有一些非常通用的预测。其中一种预测由一个活跃请求（active\
  \ request）实现，其条件是寻找一个包含主题的结构。`HUNGER-RULE` 构建的结构满足该条件，从而结束了 `PAM` 的推理循环。随后，`HUNGER-RULE`\
  \ 和该请求被传递到整合阶段。\n\n在整合阶段，再次评估 `HUNGER-RULE` 的动作，但这次其结构被添加到故事表示中。我们将在下面详细讨论如何执行。然而，除了构建结构外，`PAM`\
  \ 还必须预测这些结构中的 `gap` 如何被填充。例如，关于 `HUNGER-RULE` 构建的结构中 `plan` `gap` 的预测是由一个表示满足饥饿计划的结构填充。为了使用此预测填充\
  \ `gap`，有必要将预测以规则的形式制定：如果遇到满足饥饿的计划，那么该计划就是约翰 `Satisfy-hunger` 目标的计划。\n\n因此，我们想要建立一个在输入中寻找合适计划的预测，如果发现了这样的计划，就将其放入故事表示中已有的\
  \ `PLAN` `gap` 中。这在整合阶段通过以下方式完成：在 `PAM` 中的每条规则旁边存储了其他规则列表。这些规则用于预测如何填充原始规则创建的表示中的\
  \ `gap`。由于这些规则建议了如何填充 `gap`，它们被称为 `suggestions`（建议）。在规则上附加建议的想法归功于 Riesbeck (1975)，他在他的概念分析程序使用了这一想法。他将包含建议的规则称为\
  \ *requests*（请求），我在这里也使用了这一术语。\n\n\n\n\n每个建议都指明了它意图填充故事表示中的缺口（gap），以及它将去何处寻找填充内容。例如，`HUNGER-RULE`\
  \ 请求包含如下建议：\n\n```\n HUNGER-RULE\n Suggestions: Set TARGET = PLAN\n To FOCUS = !INPUT!\n\
  \ Using SUITABLE-PLAN-RULE\n```\n\n`TARGET` 字段指定了 `HUNGER-RULE` 构建的结构中该建议试图填充的角色，在本例中，为\
  \ `PLAN` 缺口。`FOCUS` 字段指明了请求寻找计划的地方。该建议指定焦点是特殊缺口 `!INPUT!`，它是 `PAM` 中用于放置被解析或推断出的新\
  \ `CD` 形式的地方。\n\n最后，给出了要使用的请求名称。在本例中，该请求被命名为 `SUITABLE-PLAN-RULE`。因此，该建议表示，应该使用\
  \ `SUITABLE-PLAN-RULE` 请求来尝试填充 `HUNGER-RULE` 构建的结构中的目标 `PLAN` 缺口，并且应该通过检查其焦点（即放置新概念化的特殊缺口\
  \ `!INPUT!`）来完成。`SUITABLE-PLAN-RULE` 是一个请求，当其焦点包含一个表示特定目标计划的结构时，其条件将为真。它的动作仅仅是返回该计划结构。\n\
  \n当 `PAM` 处理一个故事时，它为 `CD` 形式中的缺口创建 `nodes`（节点）。因此，当执行 `HUNGER-RULE` 时，会为空的 `PLAN`\
  \ 和 `PLANNER` 角色创建节点。`PAM` 通过复制请求来使用它们，并将像 `!INPUT!` 和 `!FOCUS!` 这样的符号名称替换为它当前正在处理的\
  \ `CD` 结构的内部节点名称。以这种方式附加到故事表示的请求实例被称为 `active request`（激活请求）。\n\n通过将请求的 `focus`\
  \ 和 `target` 字段与 `condition`（条件）和 `action`（动作）字段分离，请求可以存储在内存中，而无需指定它们构建的结构应该放在何处，或者它们应该去何处检查其条件是否已满足。同一个请求可能同时存在多个激活实例，每个实例都关注并针对不同的位置。\n\
  \n激活请求用于实现关于什么将填充缺口以及填充物可能来自何处的预测。每当有请求关注的缺口发生变化时，`PAM` 就会检查该预测是否已确认。只有当请求所关注的缺口发生变化时，才会查看该请求，这有助于减少\
  \ `PAM` 在任何时刻需要的工作量。\n\n关于请求 `HUNGER-RULE` 的处理，有几点前面的讨论忽略了。例如，`HUNGER-RULE` 的动作被给出：\n\
  \n```\n Action: ADD GOAL: S-HUNGER PLANNER ()\n SOURCE: THEME = HUNGER-DRIVE\n PLAN:\
  \ ()\n```\n\n注意，在此动作构建的结构中，`Satisfy-hunger` 目标的 `PLANNER` 角色是空的，但它应该被填充为 `JOHN`。`PAM`\
  \ 同样利用建议来实现这一目的。也就是说，`HUNGER-RULE` 给出了第二个建议：\n\n```\n Suggestions: Set TARGET =\
  \ PLANNER of GOAL\n To FOCUS = ACTOR\n USING FOCUS-REQ\n```\n\n该建议的目标是 `HUNGER-RULE`\
  \ 构建的结构中 `GOAL` 形式的 `PLANNER` 角色。焦点是输入概念化的 `ACTOR` 角色。`FOCUS-REQ` 是一个请求，如果焦点不为空，它将简单地将其焦点移动到目标处。因此，该建议激活了一个请求，将\
  \ `JOHN` 从输入概念化中的 `ACTOR` 角色填充物移动到 `HUNGER-RULE` 构建的结构中的 `PLANNER` 缺口中。由于该请求的焦点已经被填充，因此请求的条件立即为真，请求一旦激活就会填充缺口。这种使用一个请求来指定另一个请求构建的结构细节的技术在\
  \ `PAM` 中被广泛使用。\n\n故事的句子具有如下 `Conceptual Dependency`（概念依赖）表示：\n\n```\n ((< = > ($RESTAURANT\
  \ CUSTOMER HUM0 RESTAURANT ORG0)))\n```\n\n也就是说，约翰在某餐厅执行餐厅脚本时扮演了顾客角色。\n\n`PAM` 将此概念化置在输入缺口中并进入预测组件。一如既往，该组件会检查关注此缺口的请求。`SUITABLE-PLAN-RULE`\
  \ 请求的条件没有被此输入满足，因为该输入是以动作的形式给出的，而不是计划。因此，`PAM` 必须进入自下上的模式并寻找适用于此句子的规则。\n\n在这种情况下，`PAM`\
  \ 找到了一个名为 `DO-RESTAURANT-PLAN-RULE` 的规则，其条件被输入满足。再次，关于如何找到此规则的问题被推迟到以后。`DO-RESTAURANT-PLAN-RULE`\
  \ 结构如下：\n\n```\n DO-RESTAURANT-PLAN-RULE\nCondition: CD matches “Person do restaurant\
  \ script”\nAction: ADD PLANBOX: DO-$RESTAURANT-PLAN\n PLANNER 0\n RESTAURANT ()\n\
  \ ACTIONS: ()\n SUBEPISODES: ()\nSuggestions: Set TARGET = PLANNER of PLANBOX\n\
  \ To FOCUS = CUSTOMER of script\n Using FOCUS-REQ\n Set TARGET = RESTAURANT of PLANBOX\n\
  \ To FOCUS = RESTAURANT of script\n Using FOCUS-REQ\n Set TARGET = ACTIONS\n To\
  \ FOCUS = !FOCUS!\n Using FOCUS-REQ\n```\n\n该规则的动作构建了一个表示计划的结构。该结构具有以下组件：一个 `PLANBOX`、一个\
  \ `ACTIONS` 列表和一个 `SUBEPISODES` 列表。这里的 `PLANBOX` 仅仅是执行餐厅脚本。它的 `PLANNER` 和餐厅由前两个建议填充。`ACTIONS`\
  \ 角色用于指定引发该计划的实际事件。在本例中，由第三个请求将输入移动此缺口。`SUBEPISODES` 缺口用于存储对该计划起到作用的片段。这个槽在故事中是空的。\n\
  \n构建了由 `DO-PLAN-RULE` 指定的结构后，`PAM` 将此结构放入 `!INPUT!` 并重新进入该组件。该组件检查关注此缺口的请求是否预测了该结构。这一次，来自\
  \ `HUNGER-RULE` 的激活副本的条件被满足了。该条件 `SUITABLE-PLAN-RULE` 检查与目标相关的计划列表，以判断输入是否为该目标的计划。由于\
  \ `DO-$RESTAURANT-PLAN` 在目标 `S-HUNGER` 的计划列表中，谓词返回真。随后，`PAM` 评估 `HUNGER-RULE` 建议的动作，填充\
  \ `HUNGER-RULE` 构建的结构中的 `PLAN` 缺口。由于预测已满足且每个输入的结构已连接在一起，找到了输入的解释。\n\n`PAM` 现在将其找到的规则确认它的预测传递给整合组件。该组件触发规则的动作，然后是激活请求的动作，从而更改实际的故事表示。随后采用建议，即将其变为激活请求。在这种情况下，这些请求都只是为当前结构添加细节，而不是对未来事件进行预测。\n\
  \n图 7.5 显示了一个示意故事表示以及 `PAM` 生成的表示。表示中的数字指示了之间的对应关系。为了清晰起见，实际 `PAM` 表示中的节点已替换为它们的值。\n\
  \n![](img/fig7_5_B.jpg)\n\n图 7.5 示意故事表示。\n\n总而言之，这个故事的理解过程如下：`PAM` 读取一个表示故事句子的概念化，并将其放入输入缺口中；然后\
  \ `PAM` 测试关注此缺口的请求的条件，看是否任何一个请求预测了输入。在示例故事中没有找到这样的请求，因此 `PAM` 必须寻找可能适用于输入的规则。\n\n\
  \n\n\nPAM 随后找到了请求 `HUNGER-RULE`，其条件被输入所满足。`HUNGER-RULE` 构建了一个表示包含目标、主题和计划的片段的结构。该结构中的计划部分留为空，构成了一个缺口，但\
  \ `HUNGER-RULE` 对如何填充这个缺口提出了一个建议。该建议包括向此缺口附带请求 `SUITABLE-PLAN-RULE` 的副本，并将请求聚焦在输入缺口上。\n\
  \n接下来，将由 `HUNGER-RULE` 构建的结构放置在输入缺口中，以查看它是否符合任何预期。发现了一个活动请求，正在寻找一个包含主题的片段。由于该请求预测了此结构，PAM\
  \ 停止处理并继续处理下一句。\n\n下一句同样没有被 PAM 预测。PAM 必须搜索适用于该句的规则，并找到了规则 `DO-RESTAURANT-PLAN-RULE`。该规则构建了一个计划结构，然后将其放置在输入缺口中。由上句激活的\
  \ `SUITABLE-PLAN-RULE` 版本预测了这样一个计划，并将其插入到故事表示中的计划缺口中。此输入现在导致了 PAM 预测的一个推理，因此处理可以停止。\n\
  \n从规则操作的角度来看，理解过程见图 7.6。\n\n![](img/fig7_6_B.jpg)\n\n图 7.6 从规则操作角度来看的 PAM 处理算法。\n\
  \n### 请求链\n\n正如之前讨论过的，当一个请求被激活时，它会被附着在 PAM 试图填充的缺口上，并聚焦于其条件将要应用的缺口上。上面显示的大部分请求都聚焦在\
  \ PAM 放置输入的特殊缺口上，但情况并非如此。例如，在建议中使用的某些请求仅用于将表示片段从焦点移动到创建建议的请求所构建的结构中，因此它们聚焦于输入概念化中某个角色的填充物上。\n\
  \n此外，请求的设置方式通常使得一个请求的焦点是另一个请求的目标。每当一个缺口被填充时，PAM 都会检查是否有任何请求聚焦于该缺口，并测试那些聚焦于它的请求的条件。如果满足了其中一个条件，PAM\
  \ 就会构建由请求动作指定的结构，并使用它来填充请求的目标。由于这是一个刚刚被填充的缺口，PAM 会检查是否有任何请求聚焦于它，并对这些请求迭代循环。在原则上，一个请求的触发可以引发待处理请求的链反应，其中每个请求都聚焦于另一个的目标。\n\
  \n这种将请求链链的特性在许多地方有用。例如，PAM 需要的一个功能是判断目标是否已实现，以及用于实现目标的计划是否成功。通过在每个计划结构中设置一个描述计划是否生效的角色，来实现这种能力是非常方便的。这个角色被称为\
  \ `OUTCOME`（结果），可以被一个表示成功的结构或表示失败的结构填充。因此，计划结构实际上具有以下格式：\n\n```\n ((PLANBOX (…)\
  \ ACTIONS (…)\n SUBEPISODES (…) OUTCOME (…) ))\n```\n\n所有构建计划结构的请求都会针对此缺口提出一个针对性的建议，该建议可以识别该特定计划的成功与否。这些请求都聚焦在输入缺口上，并测试标记其特定计划成功的特定条件。\n\
  \n此外，每个构建的片段片段也有一个 `OUTCOME` 角色。该角色可以被表示实现、放弃或失败的结构填充。因此，目标片段结构如下：\n\n```\n ((GOAL\
  \ (…) SOURCE (…) PLAN (…) OUTCOME (…)))\n```\n\n另一个建议用于激活请求 `PLAN-SUCCESS-RULE`。`PLAN-SUCCESS-RULE`\
  \ 针对目标片段的结果缺口，并聚焦于计划结构的结果缺口。该请求具有以下简单形式：\n\n```\n PLAN-SUCCESS-RULE\nCondition:\
  \ Successful plan\nAction: ADD Goal fulfilled\n```\n\n即 也就是说，如果焦点被一个代表计划成功的结构填充，则\
  \ `PLAN-SUCCESS-RULE` 的条件成立。该请求的动作构建一个表示目标实现的结构。\n\n### 请求类型\n\n读者可能已经注意到，确定计划结果的请求并不是解释性请求。也就是说，一个确定某个事件意味着计划已成功的请求，其本身并不解释为什么发生该事件。例如，如果\
  \ John 威胁说如果 Bill 不给他钱就伤害他，那么 Bill 给 John 钱就表明这个计划已经成功了。然而，注意到计划已成功并不构成对“Bill 为什么给\
  \ John 钱”的解释；这样的解释需要推断 Bill 行为背后的目标。这是通过使用一个与确定 John 计划成功的规则不同的规则来实现。\n\n这里的问题是，确定计划结果的规则是一个预测。PAM\
  \ 理上应该在预测被确认时停止处理输入，但这种预测确认可能会在推导出解释之前就停止处理。也就是说，如果该句的解释需要自底向上的推理，而检测计划成功的规则直接从输入触发，那么\
  \ PAM 将在找到输入的解释之前就停止处理。\n\n为了防止这种情况发生，PAM 将那些提供解释的请求标记为 `WHY` 请求。例如，一个确定计划结果的请求不会被标记为\
  \ `WHY` 请求。相反，一个推断出 Bill 给 John 钱背后的目标是为了保住其生命的请求将被标记为 `WHY` 请求。因此，在听了 John 威胁 Bill\
  \ 之后，处理“Bill 给了 John 钱”这一句时，寻找计划成功的请求将首先被触发。由于这不是一个 `WHY` 请求，PAM 继续处理此句，并最终找到由某个\
  \ `WHY` 请求预测的对 Bill 行为的解释。\n\n因此，输入可以触发任意数量的非 `WHY` 请求而不停止推理循环。然而，一旦触发 `WHY` 请求，解释循环将终止，PAM\
  \ 将继续处理下一句。这种区分为在 PAM 中执行非解释功能提供了一种方法，而不会干扰解释循环中的基本控制流。\n\n与请求引发的另一个问题涉及请求与其提出的建议之间的通信。例如，`SUITABLE-PLAN-RULE`\
  \ 是一个判断输入是否可以是目标的计划的请求，早些给出如下：\n\n```\n SUITABLE-PLAN-RULE\n Condition: SUITABLE-PLAN-PREDICATE\n\
  \ Action: !FOCUS!\n```\n\n问题是 `SUITABLE-PLAN-PREDICATE` 需要某种方式来引用它正试图寻找的合适计划的目标。也就是说，这个请求针对一个包含目标的结构中的缺口，但在它尝试确定其条件是否已满足时，没有方法引用该结构中的目标。\n\
  \n为了解决这个问题，PAM 将构建某些重要结构的请求标记为 `FOUNDERS`（发现者）。在激活请求的过程中，构建的最后一个 `FOUNDER` 的名称会被保留，并可以被由该\
  \ `FOUNDER` 激活的所有请求或该 `FOUNDER` 的建议引用，以此类推。\n\n\n\n\n\n`FOUNDERS` 几乎总是目标片段（goal\
  \ episodes）。由构建目标片段的请求触发的请求可以激活另一个请求，只要没有新的 `FOUNDER` 请求被激活，所有新请求都可以使用 `!PARENT!`\
  \ 来引用之前的 `FOUNDing` 请求。此外，在本身即为 `FOUNDER` 的请求内部使用 `!PARENT!` 将引用由上一个 `FOUNDing`\
  \ 请求构建的结构。因此，通过多个层级的建议加载的请求仍然可以引用由许多层级之前的某个请求所构建的结构。\n\n## 移除请求 (Removing Requests)\n\
  \n到为止，我们主要关注请求的激活和使用。`PAM` 的另一个重要部分是其移除请求的能力。移除请求很重要，原因有二：首先，一个已经过了其价值的请求可能会在故事的后期偶然满足其条件，并在意料之外触发，从而用一个不恰的值填充某些空隙。其次，即使请求没有触发的可能性，每当它关注的空隙被填满时，程序仍可能浪费时间检查该请求的条件。\n\
  \n移除请求意味着将该请求名称从所关注空隙的 `Focused-requests` 属性下的请求列表中移除。这样，当该空隙被填满时，该请求将不再被测试。`PAM`\
  \ 在以下情况下移除请求：\n\n1. 任何已触发的请求（即其条件已确认、动作已执行且建议已激活）都会被移除。\n2. 如果一个请求填充了一个空隙，则所有针对该空隙的请求都将被移除。\n\
  3. 如果一个请求填充了一个不会被再次填充的空隙，则所有关注该空隙的请求在测试后将被移除。\n\n当空隙被填满时，针对该空隙的请求会被移除，因为它们已经没有可以做的事情了。请求最初针对该空隙是为了填满它，而现在它已经被填满，它们就没有实际用处了。例如，当遇到像\
  \ `ASK` 或 `BARGAIN` 这样需要他人回复的计划框（planbox）时，`PAM` 设置一个预测顺从的请求，以及另一个预测拒绝的请求。这两个请求都针对计划中\
  \ `RESPONSE` 角色的空隙。如果其中一个请求被确认且 `RESPONSE` 空隙被填满，那么两个请求都会被移除。因此，这种技术提供了一种方法，即使请求未被使用，也能移除其目的已不存在请求。\n\
  \n为了找到针对某个空隙的请求，`PAM` 在每个空隙的属性下维护一个此类请求的列表。当空隙被填满时，`PAM` 会遍历这个目标请求列表并逐个移除每一个。\n\n\
  关注某个空隙的请求在空隙被填满时会被移除，因为这些空隙不会再次改变。对于 `PAM` 中的所有空隙都是如此，输入空隙（input gap）除外。这个空隙在整个故事中会被多次填充，每次填满时都移除可能适用于未来句子的预测将是不利的。然而，当输入空隙以外的空隙被填满时，它是永久性的。关注它的所有请求都已经被测试，那些没有触发的请求将永远不再被测试。这些请求可以移除，因为它们不再发挥任何功能。\n\
  \n建议、请求链和请求移除都是组织规则的方法，以便在正确的时间激活正确的规则，同时避免周围有不必要的规则。用于此目的的额外机制涉及将请求附加到目标空隙。`PAM`\
  \ 有许多规则建议将请求附加到目标空隙，而不检查该空隙实际上是否已填充。这对应于一种情况：`PAM` 有若干种填充空隙的启发式方法，但不知道哪种适用于当前情况。因此，一个请求可能已经使用某种启发式方法填充了空隙，随后另一个请求可能会尝试使用另一种启发式方法再次填充该空隙。这种情况是理想的，因为在非常相似的情况下，第一个请求可能无法填充空隙，从而使\
  \ `PAM` 依赖第二个请求来完成工作。\n\n如果建议将请求附加到目标空隙，但该空隙已填充，`PAM` 只会拒绝采纳建议。因此，建议实际上只是建议——关于在哪里可以找到填充者的想法，`PAM`\
  \ 在某些情况下可能会忽略这些想法。如果请求已经填充了空隙，则该建议被忽略；如果空隙是空的，`PAM` 将激活该建议以尝试填充它。通过这种方式，许多填充空隙的启发式方法可以分散在规则集中，而不必担心重叠——尝试去做已经被之前的启发式方法完成的事情是无害的。\n\
  \n因此，`PAM` 执行了请求访问、请求激活、请求测试和请求移除。此过程中的控制流总结在图 7.7 中。\n\n![](img/fig7_7_B.jpg)\n\
  \n图 7.7 请求测试与激活序列。\n\n## 自底向上机制 (The Bottom-Up Mechanism)\n\n如果 `PAM` 没有预测输入的激活请求，它必须寻找寻找被输入满足的规则。例如，假设\
  \ `PAM` 看到一个形式如下的事件：\n\n> John 告诉 Bill，如果他把自行车给他，他就送他五美元。\n\n`PAM` 需要找到一条将此句子解释为讨价（bargaining）实例的规则。如果没有激活请求可以解释该句子，`PAM`\
  \ 必须找到一个可以解释的非激活请求。也就是说，`PAM` 必须找到一个条件被此句子满足、且动作是构建一个表示 `BARGAIN-OBJECT` 计划框的结构的规则。然后可以再次使用预测组件，查看故事表述中是否有任何空隙可以附加它。\n\
  \n这里的主要困难在于，我们需要在海量规则中找到这样一个规则。`PAM` 解决此问题的方案使用判别网络索引请求（Feigenbaum, 1961）。\n\n`PAM`\
  \ 的判别网络是一个每个非终端节点都带有谓词的二叉树。网络应用于输入的方式：将根节点的谓词应用于输入，并根据结果选择“真”子树或“假”子树。使用所选子树重复此过程，直到到达叶节点（终端节点）。然后返回该节点。\n\
  \n`PAM` 判别网络的叶节点是请求名称。树中的每个谓词都是某个请求谓词的一部分，因此当到达树的叶节点时，测试上的谓词等同于该请求的条件。\n\n例如，当上述句子的概念化通过\
  \ `PAM` 的判别网络时，会评估以下系列谓词：\n\n```\nCONCEPT is\n((ACTOR HUM0 < > > (*MTRANS*)\n MOBJECT\
  \ ((ACTOR HUM1 < = > (*ATRANS*) OBJECT0\n TO HUM0))\n LEADTO ((ACTOR HUM0 <=> (*ATRANS*)\
  \ OBJECT0\n TO HUM1))\n ))\n TO (*CP* PART HUM1)\n))\n```PREDICATE TRACE:\n (HAS\
  \ (MODE) *NEG*) FALSE\n (HAS (MODE) *CAN*) FALSE\n (EQU (< = >) NIL) FALSE\n (EQU\
  \ (< = >) *ATRANS*) FALSE\n (EQU (< = >) *MTRANS*) TRUE\n (SAMETOK (MOBJECT IS PART)\
  \ (ACTOR)) FALSE\n (EQU (MOBJECT IS) *GOAL*) FALSE\n (EQU (MOBJECT CON < = >) NIL)\
  \ FALSE\n (SAMETOK (MOBJECT CON ACTOR) (TO ACTOR)) TRUE\n (HAS (MOBJECT CON MODE)\
  \ *NEG*) FALSE\n (SAMETOK (MOBJECT CAUSAL ACTOR) (ACTOR)) TRUE\n (EQU (MOBJECT CAUSAL\
  \ <=>) NIL) FALSE\n (EQU (MOBJECT CAUSAL <=>) *ATRANS*) TRUE\nREQUEST CLUSTER :\
  \ BARGAIN-OBJECT-CLUSTER\n```\n\n\n\n\n每个谓词都测试由路径指定的概念结构的一部分。例如，路径 `(MOBJECT CON\
  \ ACTOR)` 意味着首先查看主概念化中 `MOBJECT` 槽位的概念化，然后查看其 `CON` 槽位，最后查看该概念化的 `ACTOR` 槽位。该槽位由标记\
  \ `HUM1` 填充，它指向比尔（Bill）的表示。\n\n上述示例中的谓词首先询问该概念化是否为否定性，然后询问它是否为潜能，这两者都为假。接着它询问这是否为一个动作，并在确认这一点后，询问是哪种动作。在发现它是一个\
  \ `MTRANS` 之后，程序接着询问它是否为内部 `MTRANS`（记忆就是此类事件的实例）。由于它不是，程序会尝试各种其他 `MTRANS` 的可能性，直到确定该\
  \ `MTRANS` 的对象是一个因果关系，因果关系第一部分的执行者与 `MTRANS` 指向的人是同一个人，最后，他所做的将导致说话者交给他某些东西。此时，达到了树的一个叶子节点。该叶子被称为\
  \ `BARGAIN-OBJECT-CLUSTER`，它包含一个请求列表——该请求的动作将构建一个 `BARGAIN-OBJECT` 计划框。\n\n如上所述，当使用自下而上的请求来构建结构时，该结构被放置在输入缺口（input\
  \ gap），并检查关注该缺口的请求。如果某个请求预测了该结构，`PAM` 就可以停止。否则，重复该循环。例如，假设没有请求预测了上述描述的 `BARGAIN-\
  \ OBJECT` 结构。在这种情况下，该结构将被抛回判别网络，网络将返回能够解释还价行为的请求。其中一个请求可能会构建一个表示所有权转移目标的结构。如果没有活跃的请求预测该结构，它也会被抛回网络。这一次，将返回一个请求，说明该目标是使用自行车的计划的工具性目标。如果存在一个预测改变人物位置计划的请求，那么其条件现在已经得到满足，解释循环就可以停止。\n\
  \n### 测试\n\n当 `PAM` 以自下而上的方式找到一个请求时，它在实际使用该请求之前必须经过测试阶段。`PAM` 在使用判别网络时偶尔会检索出多条规则，每条规则可能对输入提供不同的解释。最终将决定使用哪条规则，因为由一条规则产生的结构会被某个请求预测，而由另一条规则产生的结构则不会。由于这些规则中的某些建议可能会以各种方式改变故事表示，因此在规则指示的动作被采取之前，找到正确的正确规则是理想的。\n\
  \n为了测试一条规则，`PAM` 通过将通过判别网络找到的请求聚焦于输入缺口并针对一个虚拟缺口（dummy gap）来激活它们。也就是说，`PAM` 构建了请求的副本，就像它遵循建议时所做的那样。然后\
  \ `PAM` 对此规则的动作和建议执行正常评估，但有以下例外：`PAM` 不激活会改变请求构建的结构之外的故事表示的建议。因此，不会进行全局更改。此外，由这些建议激活的请求与已激活的请求保持分离。\n\
  \n当 `PAM` 找到一组可以解释输入的规则序列时，它首先移除测试阶段中激活且仍然存在的任何请求。然后它激活它在解释序列中使用的每条规则，使其中一条规则的目标成为下一条规则的焦点，以此此类推。最终，将激活一条从输入缺口开始并以故事表示中已有的预测结束的请求链。随后，再次以正常方式测试输入缺口。由于刚刚激活的请求现在聚焦于输入缺口，且其条件被输入满足，一个请求链被触发。这一次，请求所提出的所有建议都会被采纳，实际的故事表示将发生改变。\n\
  \n### 代词\n\n`PAM` 为它能够处理的故事中使用的所有代词找到正确的引用。`PAM` 在不使用任何特殊引用启发式的情况下建立这些引用。相反，这些引用的解决是\
  \ `PAM` 为了理解故事而必须执行的其他过程的副产品。\n\n当 `PAM` 处理故事时，它会评估许多谓词，包括判别网络中的谓词，以及它可能测试的请求条件中的谓词。通常，这些谓词要求将部分输入或推出的概念化与故事表示进行比较。每当比较的结构是图片生产者（PPs）时，`PAM`\
  \ 通过通过特殊的例程进行比较。该例程规定，如果新项*可能*是旧项，则正在比较的项是相同的。也就是说，如果例程正在匹配“John”的表示与“他”的表示，它将判定它们是相同的，因为“他”可以是“John”。该例程随后将这对放入关联列表中以供以后引用。当处理的句子最终被理解时，`PAM`\
  \ 会遍历构建的结构，并将代词关联列表上的每个项替换为其指称。\n\n例如，考虑以下故事：\n\n> 约翰想要一些钱。他拿了一把枪走进一家酒馆。他告诉老板主他想要一些钱。\n\
  \n在阅读这些句子后，`PAM` 做出了预测：如果老板主给约翰钱，他这样做是为了回应约翰的威胁。假设下一句是“他给了他钱。”预测顺从的请求条件必须检查该概念化的执行者是否是老板主，接收者是否是约翰。由于该条件使用了特殊的比较例程，它将把句子中第一个“他”的表示与老板主的表示进行比较，将第二个“他”与约翰的表示进行比较。这两者都匹配，并发现条件成立。因此，对第一个“他”的引用将被替换为指向老板主的引用，对第二个“他”的引用将被替换为指向约翰的引用。\n\
  \n### 总结\n\n`PAM` 处理故事时的快照显示了一个充满缺口的表示，以及附在这些缺口上等待事件触发的请求。当发生新输入时，`PAM` 测试等待输入的请求，如果其中一个请求的条件为真，它就会将其添加到故事表示中。该请求也可能提出激活其他请求的建议。\n\
  \n如果没有请求的条件因输入变为真，`PAM` 将输入丢入判别网络以寻找可以解释它的新请求。如果找到了，则执行其动作，并将它构建的解释放置在输入缺口中。等待输入的请求将再次测试其条件。循环一直持续，直到等待输入的请求最终看到其预测被确认，或者\
  \ `PAM` 无法再从输入中推导出解释为止。\n\n\n\nMcPAM 与 PAM 在许多方面都有不同之处。最重要的一点是，McPAM 的设计旨在尽可能地将关于规划的知识与关于解释的知识分离开。也就是说，McPAM\
  \ 内存中的规则是简单的声明式模式。它们编码了关于哪些计划适用于哪些目标等事实，而没有指定这些事实在故事理解中应如何使用。相比之下，PAM 的规则在本质上更具程序化——它们规定了要做哪些预测，以及如何填充故事表示。\n\
  \n### 知识表示与控制结构\n\n在 McPAM 中，关于如何使用规则理解故事的知识被构建在控制结构中。例如，在 PAM 中，预测产生于解释输入时触发的请求。这些请求显式地预测未来的输入。而在\
  \ McPAM 中，控制结构维护了已知目标、计划和主题的列表。如果一个输入或推理与这些列表中的某项相关，则认为其已经被预测。\n\n例如，如果一个计划被输入 McPAM\
  \ 或由 McPAM 推断出，McPAM 将检查其已知目标列表，以查看该计划是否适用于任何一个目标。如果是，则该计划已被该目标预测，并因此得到了解释。每当故事表示中添加新的计划、目标或主题时，相应的列表就会更新。\n\
  \n以这种方式存储 McPAM 关于意图的规则是对 PAM 的改进。在 PAM 中，每个预测都必须由某些请求显式地做出，因此 PAM 无法利用相似的案例。例如，PAM\
  \ 中每个构建目标的请求都必须预测将看到适用于该目标的合适计划。这种预测的建议被存储在每一个此类请求中。而在 McPAM 中，此类预测是自动完成的，并且不会在每条规则中重复。\n\
  \n更重要的是，由于 McPAM 中的规则是声明式的，它们可以以多种不同的方式使用。例如，一个将特定计划与特定类型目标链接的规则，既被自下而上的机制用于根据计划推断该目标，又被预测机制用于根据已知目标解释已推断出的计划。在\
  \ PAM 中，由于程序化要求不同，这两个功能需要单独的请求。\n\n### McPAM 的缺点\n\n然而，McPAM 也有许多缺点。它的自动预测机制简洁整洁，但也具有很强的限制性。PAM\
  \ 中的预测机制可以用于预测几乎任何内容。例如，很容易向 PAM 中添加一个请求，使得威胁的发生会导致一个预测，即：如果受威胁的人按照要求所做，那么他这样做是因为他选择顺从威胁。然而，McPAM\
  \ 在不更改控制结构中内置的预测类型的情况下，无法做出这种预测。\n\n解决这个问题的一种可能方案是建立一种同样基于规则的预测机制，但该规则与编码意图知识的规则分开。这些规则可以规定在特定情况下做出哪些预测。这种设计将包含一个灵活的预测机制，同时保留系统关于规划知识的声明式本质。\n\
  \nMcPAM 的另一个缺点是它的任何规则都没有建立索引。必须顺序搜索整个规则列表以找到适用于规则。添加索引方案（如判别网）将加速处理。\n\nMcPAM 还没有处理上一章中讨论的更复杂的目标关系的功能。PAM\
  \ 可以处理这些，因为它的请求可以自由为不同的情况做出适当的预测。再次，McPAM 受到其简单预测机制的限制。\n\n当从一个输入可以推断出多个合理的解释时，PAM\
  \ 会推断出所有解释，预测机制最终选择其中一个并丢弃其他的。为了简单起见，McPAM 只进行一种推理，如果证明行不通，McPAM 将回溯并尝试另一种可能性。因此，McPAM\
  \ 使用的是深度优先搜索，而 PAM 使用的是广度优先搜索。\n\n## 输出\n\n以下是 McPAM 程序的日志，该程序应用于“Willa 饿了。她抓起米其林指南。她进了她的车。”的\
  \ CD 表单。\n\n\n\n\n```\n [PH: Initiation. 8-Jan-80 2:52PM]\n…\n(PROCESS-STORY WILLA-STORY)\n\
  尝试解释\n (IS (ACTOR (PERSON (NAME (WILLA)))) (STATE (HUNGER (VAL (5.)))))\n未确认预测\n\
  从以下无无用的推理\n (IS (ACTOR (PERSON (NAME (WILLA)))) (STATE (HUNGER (VAL (5.)))))\n未找到推理链——正在添加\n\
  \ (IS (ACTOR (PERSON (NAME (WILLA)))) (STATE (HUNGER (VAL (5.)))))\n—主题\n尝试解释\n\
  \ (GRASP (ACTOR (PERSON (NAME (WILLA))))\n (OBJECT (BOOK (TYPE (RESTAURANT-GUIDE)))))\n\
  未确认预测\n假设以下可能的解释\n (TAKE-PLAN (PLANNER (PERSON (NAME (WILLA))))\n (OBJECT (BOOK\
  \ (TYPE (RESTAURANT-GUIDE)))))\n未确认预测\n假设以下可能的解释\n (GOAL (PLANNER (PERSON (NAME\
  \ (WILLA))))\n (OBJECTIVE (POSS (ACTOR (PERSON (NAME (WILLA))))\n (OBJECT (BOOK\
  \ (TYPE (RESTAURANT-GUIDE)))))))\n未确认预测\n假设以下可能的解释\n (READ-PLAN (PLANNER (PERSON\
  \ (NAME (WILLA))))\n (OBJECT (BOOK (TYPE (RESTAURANT-GUIDE)))))\n未确认预测\n假设以下可能的解释\n\
  \ (GOAL (PLANNER (PERSON (NAME (WILLA))))\n (OBJECTIVE (ENJOYMENT (ACTOR (PERSON\
  \ (NAME (WILLA)))))))\n未确认预测\n从以下无无用的推理\n (GOAL (PLANNER (PERSON (NAME (WILLA))))\n\
  \ (OBJECTIVE (ENJOYMENT (ACTOR (PERSON (NAME (WILLA)))))))\n假设以下可能的解释\n (GOAL (PLANNER\
