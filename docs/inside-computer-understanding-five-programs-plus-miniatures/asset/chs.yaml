  \n## 美国国会目录编排数据\n主条目：计算机理解内部（Inside computer understanding）。\n参考文献：P 页。\n包含索引。\n\
  1. 人工智能 2. 编程（电子计算机）I. Schank. Roger C., 1946- II. Riesbeck, Christopher K.\nQ336.155\
  \ 1981 001.64’2 80-18314\nISBN 0-89859-07l-X\nDOI: [10.4324/9780203728147](https://dx.doi.org/10.4324/9780203728147)\n\
  \n# 前言\n\n我们写这本书是为了那些想要理解一个大型自然语言理解程序是如何运作的人。这本书的起源于我们在 1978 年 6 月和 7 月在耶鲁大学举办的一个夏令学校。在那个冬天，在斯洛恩基金会认知科学项目的支持下，35\
  \ 名认知科学领域的专业人士（大多数是心理学背景）学习了如何处理人工智能中的编程细节。作为我们为他们设计的课程的一部分，我们创建了所谓的“微程序”（micro-programs）。这些微程序试图让学生体验使用大型\
  \ AI 程序的乐趣，而无需面对学习他人编写的复杂系统时通常会遇到的种种困难。因此，当我们讨论我们的解析器 `ELI` 或我们的故事理解程序 `SAM` 时，我们也给了学生这些程序的微缩版本，这些是极其简单的版本，运行方式与它们的大型版本大致相同，但去掉了所有修饰。学生被要求在这些程序图中添加组件或对其进行其他修改，以学习它们是如何运作的。\n\
  \n我们以及使用这些程序的学生的感受是，这些微程序在教学上非常有用。我们后来在人工智能的一年级研究生课程中使用了这些相同的微程序。此外，我们将它们发送到其他机构，并在那里被使用并被证明是有用的。从我们获得的积极反馈中，我们决定是时候汇总讨论和微程序了，涵盖我们过去几年完成的许多项目。\n\
  \n在之前的书中，1975 年的《概念信息处理》（Conceptual Information Processing）和 1977 年的《脚本、计划、目标与理解》（Scripts\
  \ Plans Goals and Understanding），我们概述了所谓的“耶鲁人工智能观点”。在在那里，我们展示了关于人类语言过程的理论，以及我们如何在数字计算机上模拟这一过程。但从很大程度上，对于心理学家、人工智能初学者以及其他对认知科学感兴趣的人来说，其中许多理论和体现这些理论的程序仍然难以评估。这在程度上是因为人们很难用近乎合理的英语散文来描述任何大型计算机程序。这也是因为理解\
  \ AI 程序在某种程度上类似于尝试理解棒球或橄榄球等运动。如果你没有玩过这项比赛，很难捕捉其中的细节。对于 AI 程序而言，如果不是某个时刻尝试过创建自己的程序，评估它们的意义往往是困难的。\n\
  \n我们还发现，许多读过我们工作并对此感兴趣的人仍然问我们：“但这些程序到底是如何运作的？”我们觉得，在计算机变得越来越普及的学术历史时期，回答这个问题尤为重要。详细观察我们的程序，而不是那些引人注目的输入-输出对，似乎对许多不同的读者都具有潜在价值。\n\
  \n本书旨在为 AI 学生提供一个机会，从内部观察某些自然语言理解程序是如何运作的。它由五个此类程序的详细描述组成。其中四个程序是在我们的指导下在耶鲁大学作为博士论文完成的。我们要求这些学生（此时已成为教授）针对学生读者群体为他们的程序编写新的描述，并在这些描述中包含他们程序的微缩版本。`Micro-SAM`（一个脚本应用器）已经存在，是由\
  \ Eugene Charniak 作为斯洛恩夏令课程的一部分编写的。`Micro-ELI` 是同一时间编写的，是我们三年前概念分析器的简化版。该描述由 Larry\
  \ Birbaum 和 Mallory Selfridge 编写。\n\n第 5 章至第 14 章描述的工作基于我们在之前的书中概述的理论。在人工智能研究中，任务经常落落在博士生身上，即获取一个粗糙的理论并“让它运作”。这种理论很少能立即“运作”。在任何事情运作之前，必须假设新理论并对旧理论进行改进。\n\
  \n此外，成功的博士论文具有一种令人愉快的效果，即指向了我们接下来的方向。在未来的几年里，需要更多关于目标、主题和记忆的工作。此外，依赖于能够处理大量输入的集成知识源的程序似乎具有很高的优先级。\n\
  \n作为本卷的编辑，我们试图为每个系统实施统一的描述风格。每个描述章节都是根据相同的大纲编写的，程序经过了编辑以使用相同的 LISP 方言，该方言在第 4 章中描述。LISP\
  \ 程序构成了本书的重要部分，因为动手编程经验比任何其他都能更好地传达问题以及我们如何处理它们。然而，描述章节并不依赖于 LISP 知识，我们希望每个对人工智能感兴趣的人都能更好地理解智能模型是如何运作的。\n\
  \n对于那些打算尝试微程序的人，请先阅读第 4 章，该章介绍了所使用的 LISP 版本。我们已尽可能保持函数集小，以便无论你使用什么方言的 LISP，都能使用这些程序。然而，我们首要考虑的是程序的可读性，因此我们使用了一些功能（如循环函数和格式化打印），这些功能可能需要添加到某些\
  \ LISP 版本中。第 4 章描述了需要做的工作。第 4 章还包含一个简单的模式匹配器的描述，微程序用它测试输入和检索信息。\n\n\n\n\n\n在阅读第\
  \ 4 章后，我们建议你先尝试 `Micro-SAM`。该程序详细记录了脚本的应用过程，并展示了模式匹配器如何发挥基础作用。`Micro-SAM` 的练习将引导初学者以循序渐进的方式完成一些简单的程序修改。\n\
  \n完成 `Micro-SAM` 后，尝试另一个理解类程序，即 `Micro-PAM` 或 `Micro-POLITICS`。这些程序与 `Micro-SAM`\
  \ 有许多共同点，因为某些低级函数对任何推理程序都是有用的。编写第二个微程序将帮助理解各种理解方法之间的相同之处和不同之处。\n\n在完成两个记忆类程序后，你可以尝试\
  \ `Micro-ELI`（它是一个概念分析器）或 `Micro-TALE-SPIN`（一个故事生成器）。在学习了 `Micro-ELI` 本身之后，下一步是将其与记忆程序（即\
  \ `Micro-SAM`、`Micro-PAM` 和 `Micro-POLITICS`）建立接口。在掌握分析器的输出用途之前，请不要进行 `Micro-ELI`。\n\
  \n如果你运行了 `Micro-TALE-SPIN`，你会发现它在表面与其他程序几乎没有共同点。这是因为 `Micro-TALE-SPIN` 并不是理解程序。此外，`Micro-TALE-SPIN`\
  \ 是一个非常大的程序，其大部分是描述目标和计划如何挂钩、以及如何用英语表达许多不同意义形式的数据。\n\n书中描述的所有工作都是在 1975 年至 1978\
  \ 年间于耶鲁人工智能项目完成的。该研究得到了美国国防部高级研究计划署（ARPA）的支持，并根据合同 `N000I4-75-C-1111` 由美国海军研究办公室进行监测。\n\
  \n我们想特别感谢 Robert Abelson 对此处描述的许多程序的背景思想做出的贡献。这些程序背后的理论工作描述于《概念信息处理》（Schank, 1975）和《脚本、计划、目标与理解》（Schank\
  \ and Abelson, 1977）。第 2 章和第 3 章提供了阅读后续章节所必要的理论主张和假设。为了更全面地理解涉及的理论，应该完整通读 1977 年的那本书。\n\
  \n许多人参与了此处描述的原始项目以及微程序的开发。我们作为编辑，尽了所有让编辑深受作者喜爱的努力：我们反复地进行了措辞调整、重写、删除、重组、重新编码和修订。Ann\
  \ Drinan 是我们这些“罪行”的帮凶。但思想本身来自作者，并得到了他们朋友的一点帮助。\n\nSAM 项目的核心是 Richard Cullingford。Gerald\
  \ DeJong 和 Walter Stutzman 修改了 Neil Goldman 的概念生成器以供 `SAM` 使用。Wendy Lehnert 和 Janet\
  \ Kolodner 开发了问答程序。Anatole Gershman 修改了解析器以接受报纸故事。Richard Granger 编写了一个模块，使 `SAM`\
  \ 能够推测环境中未知单词的含义。Richard Proudfoot 和 Mallory Selfridge 开发了 `SAM` 中涉及脚本角色属性的模块。`Micro-SAM`\
  \ 程序和练习由 Eugene Charniak 编写。\n\n`PAM` 的大部分部分由 Robert Wilensky 编写。用于回答问题和从不同角度讲述故事的英语生成器由\
  \ Roderick McGuire 和 Richard Granger 编写。问答程序由 Janet Kolodner 编写。Michael Lebowitz\
  \ 在后期帮助扩展了 `PAM`。`Micro-PAM` 由加州大学伯克利分校的 Robert Wilensky 和 Michael Deering 编写。练习由\
  \ Michael Lebowitz 在耶鲁大学开发。\n\nJames Meehan 负责原始的 `TALE-SPIN` 程序。`Micro-TALE-SPIN`\
  \ 的开发得到了教学开发委员会的资助以及加州大学欧文文分校信息与计算机系的支持。Dan Eilers 提供了编程协助。\n\n`POLITICS` 程序同样主要是\
  \ Jaime Carbonell 的个人项目，并得到了 Stephen Slade 的协助。\n\n`CA`（概念分析器）由 Lawrence Bimbaum\
  \ 和 Mallory Selfridge 完成。它是基于他们认为 `SAM` 系统中 `ELI` 解析器的优缺点而设计的。`ELI` 反而又是基于 `MARGIE`\
  \ 系统的概念分析器。这两个早期的程序都由 Christopher Riesbeck 编写。\n\n耶鲁人工智能项目是一个大型的高度交互性群体。Robert Abelson、Wendy\
  \ Lehnert 和 Drew McDermott 在启发和指导上述许多工作方面都发挥了重要作用。\n\nRoger C. Schank\n\nChristopher\
  \ K. Riesbeck\n\n# 深入理解计算机：五个程序加微型程序\n\n## 1 我们的人人工智能方法\n\nDOI: [10.4324/9780203728147-1](https://dx.doi.org/10.4324/9780203728147-1)\n\
  \n人工智能（AI）的目标通常被认为是让机器智能化。在开始，有两个领域主导着人工智能：国际象棋和问题求解（例如，Greene, 1959; Minsky, 1961;\
  \ Newell 等，1958; Newell and Simon, 1961）。人们认为创建智能计算机的一种方法是让计算机做一些明显表现智能的事情。自动下象棋和定理证明吸引了最大的兴趣，很大程度上是因为它们是那些特别困难的、因此表现出智能的实例。\n\
  \n人工智能的早期工作并没有心理学色彩。关于人们如何下象棋的问题并不是主要关注点。Newell 和 Simon（1961）在问题求解方面的大部分工作旨在发现人们如何完成各种任务，但让机器去做困难事情的动力在人工智能中仍然占据主导地位。目前的象棋程序非常优秀，但并不是因为它们模拟了人类专家玩家。尽管在人工智能内部已对该领域进行了一些研究（Berliner,\
  \ 1974），但大多数专家象棋程序之所以表现良好是因为它们计算快速且聪明。\n\n目前人工智能的研究很大是在机器人领域，即为计算机添加眼睛、手和脚（或轮子）。自动视觉工作（Duda\
  \ and Hart, 1973; Winston, 9975）通常没有强调让计算机像人类一样观察。事实上，问题确实很大不同。人工智能研究人员主要关注解释来自电视摄像机的噪声输入。这使得心理学家和人工智能研究人员的问题有着根本性的区别。\n\
  \n我们在人工智能方面的取向更倾向于认知模拟。我们认为，实现智能机器的基本障碍在于对人们知道什么以及他们如何使用所学知识的缺乏了解。我们相信，在先理解人类如何思考之前，实现机器智能是不可能的。\n\
  \n\n\n\n\n随着人类的发展，人工智能领域已越来越关注人们拥有什么样的知识，以及这些知识如何被存储、访问、应用和获取。这种新的关注点源于一种认知：世界知识是人们能够执行几乎任何智能活动的基础。对一个专家化学家的\
  \ AI 模拟需要找出该化学家 `knows` 了什么。同样，对一个三岁小孩语言能力的模拟也需要找出他知道什么（其他如此）。过去几年里，AI 大规模地进入知识领域，这部分归功于\
  \ `MYCIN`、`DENDRAL` 等程序的成功（Buchanan 等人，1969; Feigenbaum, 1977; Shortliffe, 1976）。\n\
  \n当自然语言处理工作开始时，研究人员意识到，如果没有理论，最初的玩具系统是无法扩展的。因此，他们开始尝试任何可用的理论。强调语法的各种语言理论实现在 AI 领域曾有过巅峰时期，但对\
  \ AI 来说，意义才是真正的问题，而长期以来，语言学家一直刻意回避意义。当语言学家开始接触意义问题时，他们并不是从过程的角度出发的。**过程**的概念，即通过具有精确起点和终点的逐步构建模型，是任何计算机程序构建的基础。因此，AI\
  \ 内部的自然语言研究人员必须面对这样一个事实：他们必须建立自己的语言过程理论。由于人们可以轻松执行 AI 希望机器执行的任务，因此对语言处理理论的追求已逐渐等同于对人类认知理论的追求。\n\
  \n那些试图在不模拟人类理解过程的情况下复制理解过程的计算机程序，在处理非常复杂的过程时注定会失败。在自然语言处理中，这一点没有比这里更清楚的了。在机械翻译（例如，参见\
  \ Oettinger, 1960; Locke and Booth, 1955）和计算语言学（例如，Hays, 1967）早期——这两个领域在 AI 自然语言处理方法之前——趋势是编写基于语法的程序，对句子进行初步的句法解析。这些语法解析器的失败有三个重要原因：\n\
  \n1.  首先，这些程序的编写极其复杂，往往为了英语中极小部分就使用数万条语法规则。\n2.  其次，它们完全忽略了对意义的考虑，试图解决句法问题就像这些问题与意义完全无关一样。\n\
  3.  第三，也是最重要的一点，它们试图创建一个与其人类对应过程没有任何共同点的过程。人们擅长预测他们将听到的内容。然而，他们并不擅长记住长长的单词序列。由于这两个因素，人们不会等句子结束才开始处理它。相反，他们尝试在听力或阅读的过程中，尽可能地理解他们听到的或读到的内容。\n\
  \n我们认为，计算机模型必须对这一过程进行建模。也就是说，在听到句子前几个词时，它们所做的工作比仅仅尝试寻找这些词之间的句法关系多得多。它们还必须像人一样，处理与这些词相关的意义、推理和通用世界知识。这种处理会显著改变任何给定句子中后续将要进行的处理。\n\
  \n语言是通过人类为了缓解沟通压力、考虑到记忆和时间的限制的努力而演化的。自然语言不像编程语言。它们是为了演讲和快速阅读而构建的，而不是为了逻辑的完整性和精确性。因为人们擅长补充所读或所听内容中的缺失信息，所以自然语言留下了大量信息。这解释了为什么省略句、指代引用和高度歧义的词如此常见。如果你知道在谈论什么，只需要几个语言线索就能帮助你理解。\n\
  \n因此，耶大学对 AI 的观点是，人类是我们所拥有的智能行为的最佳模型。在考虑改进人类算法之前，我们必须尝试模拟他们。然而，虽然这里展示的所有工作都是基于上述观点进行的，但并不意味着我们把编写的每个程序都视为一个受经验测试的、心理学上正确的模型。我们经常写一个程序是为了从中学习，而从不完全相信我们的程序从一开始在心理学上就是合理的。\n\
  \n## 我们思想的演变或（玛吉 变成什么样了？）\n\n当我们编写一个 AI 程序时，我们正试图在人类认知模型和智能机器之间的狭窄界线上行走。我们希望程序能实现两个目的：它们应该运行，从而扩展计算机的能力；并且它们应该告诉我们关于人类可能工作的某些信息。我们经常在这些目标之间进行权衡。虽然我们希望程序运行，但如果它们只使用一种缺乏通用性的方法执行某些有限的任务，那么它们将毫无价值。一个\
  \ AI 程序应该告诉我们关于认知（无论是机械的还是人类的）的根本性信息。\n\n书中描述的程序都旨在对人类认知的某个方面进行建模。当然，它们没有一个是模拟了每一个方面的，从这个意义上说，它们都是相当人工的。我们必须做的权衡之一是，决定在相当人工的情况下处理语言，通常情况下缺乏完整的背景知识和完整的上下文。我们做出这种权衡是为了继续测试我们的想法。因此，对我们来说，理论的创造是一个思考的过程，随后是编程，然后是额外的思考，相互相成。因此，AI\
  \ 实际上是在一种新颖的科学观点下运行。普通的科学方法认为首先提出理论，然后进行测试并发现其对错。但在 AI 中，我们的理论从未那样完整，因为我们所理论化的过程是如此复杂。因此，我们的测试从未是完全决定性的。我们构建程序来告诉我们在构建下一个程序时应该关注什么。我们的理论以这种方式演化。这种演化的思维方式对\
  \ AI 来说是必须的，可能对于任何领域复杂到以至于孤立测试意义不大的科学也是如此。\n\n### 玛吉\n\n\n\n\n本书中介绍的程序以及我们在这些程序出现之前的工作，所解决的根本问题是知识的表示问题。最初，我们的工作集中在句子意义表示的问题上。我们开发了概念依赖（`CD`）理论（其基础在第\
  \ 2 章中描述），作为我们意义表示的基础。我们第一个计算机程序的目的是测试 `CD` 作为一种意义表示语言的实用性。我们的理论是，一种用于计算机程序的意义表示语言，无论使用何种输入语言或用语，都必须对含义相同的不同输入提供相同的表示。例如，“约翰吻了玛丽”和“玛丽得到了约翰的吻”应该具有相同的意义表示。因此，`CD`\
  \ 必须能够允许我们对句法形式和词汇选择上存在显著差异的输入和输出，进行简单的句子改写和翻译。为了做到这一点，我们需要开发一种程序，将输入解码为 `CD`（即解析器），并将\
  \ `CD` 重新编码为自然语言（即生成器）。\n\n在我们做这项工作时，开始意识到推理在理解过程中的重要性。因此，以通用的方式考虑推理过程被加入了我们对 `CD`\
  \ 的需求中。\n\n`MARGIE` (Schank et al., 1975) 的设计旨在测试 `CD` 的实用性，并作为理解系统的原型。`MARGIE`\
  \ 试图证明语言可以映射到一个深层的、与语言无关的概念基础中，然后映射回相同或或其他语言，而不会丢失任何本质信息。\n\n`MARGIE` 系统有三个独立的模块：概念分析器或解析器，它将输入句子映射为概念依赖；生成器，它将意义结构映射回自然语言；以及记忆和推理程序，它确定新输入的指代对象并对该输入进行推理。\n\
  \n`MARGIE` 以两种模式工作：改写和推理。改写模式对输入句子产生 100 多种改写。这些并不是对原句的简单转换，而是根据分析器确定的原句意义新生成的表达式。例如，以下是\
  \ `MARGIE` 在改写模式下的示例：\n\n```\nINPUT: John killed Mary by choking Mary.\nOUTPUT 1:\
  \ John strangled Mary.\nOUTPUT 2: John choked Mary and she died because she could\
  \ not breathe.\nOUTPUT 3: Mary died because she was unable to inhale some air and\
  \ she was unable to inhale some air because John grabbed her neck.\n```\n\n在推理模式下，系统会产生并生成从输入句子可以得出的许多推理。推理机会推测对象的可能用途、执行者的可能目标以及动作的可能结果。以下是\
  \ `MARGIE` 在推理模式下的示例：\n\n```\nINPUT: John gave Mary an aspirin.\nOUTPUT 1: John\
  \ believes that Mary wants an aspirin.\nOUTPUT 2: Mary is sick.\nOUTPUT 3: Mary\
  \ wants to feel better.\nOUTPUT 4: Mary will ingest the aspirin.\n```\n\n`MARGIE`\
  \ 是我们首次在计算机上模拟自然语言理解的尝试。然而，该程序是不实际的，因为它处理的是没有上下文的孤立句子。这给分析器带来了困难，因为它无法消除多义句子的歧。更重要的是，上下文的缺失为推理器带来了严重问题；当它生成所有可能的推理时，很快产生了组合爆炸。\n\
  \n我们相信上下文是推理问题的答案。为了解决这个问题，我们开始构建 `SAM`，这是一个读取基于脚本故事的计算机程序。`SAM` 的目的是解决无关推理的问题。\n\
  \n\n\nSAM 证明了知识是理解的根本。为了理解文本，我们必须以脚本（script）的形式建立对世界的认知，以帮助“填充空白”，即故事中事件之间因果推理链的缺口。因此，表示文本需要对现实世界的认知。因此，在文本的表示和理解中，已经不再可能将语言问题与知识问题分离开。\n\
  \n基于脚本的知识虽然有用，但不能是理解者可以获得的唯一知识。特别是，一个基于脚本的理解系统并不是为了处理关于新颖情况或意外事件的故事。由于我们读的大多数有趣故事描述的新颖情况（不偏离脚本的故事通常极其枯燥无味），这是一个非常现实的局限性。显然，我们需要构建一个程序，使用其他类型的知识结构，这种结构比脚本更具灵活性。\n\
  \n在 Schank 和 Abelson (1977) 中，我们开始探索在故事理解和生成中使用目标和计划。我们假设大多数人拥有一小组目标。这些每个目标都是通过一系列动作组合来实现的，我们将这些动作称为计划。在我们看来，理解者的任务是跟踪他所听到的任何情书中每个角色的目标，以便确定特定角色的行为可能如何与其目标的达成相关。理解的很大一部分是绘制人的动机以及他们在给定情况下满足目标的方法。因此，文本的表示必须包含对每个角色的目标和计划的完整表示，以及它们如何相互影响。\n\
  \n在完成关于目标和计划的表示工作后，我们开始设计一个程序 `PAM`，它可以构建这些现在极其复杂的表示以理解故事；以及另一个程序 `TALE-SPIN`，它可以生成此类表示以讲述故事。\n\
  \n虽然基于目标的故事比基于脚本的故事有趣得多，但 `PAM` 在它能理解的故事类型上仍然受到限制，`SAM` 也是。\n\n`SAM` 和 `PAM` 的自然继者，即一个能够处理涉及多种知识结构（其中许多具有竞争需求）的极其复杂故事的程序，目前正在耶鲁大学设计。在这个程序中，我们还尝试解释各种人类记忆问题。具体来说，我们希望考虑到人们经常误解他们听到或读到的内容，经常将自己的先验知识和信念与呈现的新信息混淆。此外，我们正尝试自动构建理解中所需的知识结构，以便我们使用的记忆表示能够通过共享各种来源的知识变得更加简洁。\n\
  \n### 政治\n\n当然，除了阅读文本外还有其他人类交流的形式。由于我们的目标是创建有效的理解模型，我们也在研究其他领域。其中最重要的是对话。对话模型需要理解理解所需的一切。然而，几乎当人们开始考虑这个话题时，对话中就出现了一个额外的问题，即主观性和信念的问题。人们将他们的偏见、信念的力量以及性格带入对话情境中。（参见\
  \ Schank 和 Lehnert, 1979 对其中一些问题的讨论。）\n\n`POLITICS` (Carbonell, 1979 a)) 是一个模拟与美国参议员就政治敏感问题进行对话的程序。`POLITICS`\
  \ 在对话中采用政治视角（无论是保守派还是自由派），并基于这一观点评估任何新闻事件的影响。该程序有自己的信念系统（见 Abelson, 1973；以及 Colby,\
  \ 1973），以及一系列目标树，将政治目标（或信念）按相对重要性划分为等级制度。\n\n## 未来\n\n书中讨论的程序代表了截至 1978 年底我们在自然语言处理领域所做的工作。它们可以从三个方面进行评估：作为计算机程序，作为心理学上合理的语言理论，以及可能最重要的，作为未来工作的基础。\n\
  \n作为计算机程序，它们的价值非常有限。只有 `FRUMP` 在不久后可能有任何用途。它所理解的新闻电稿故事百分比正在快速增加，`FRUMP` 在不久后的实际可用性前景是好的。\n\
  \n这些程序试图测试的理论又是呢？事实才开始从心理学家、语言学家和其他人那里获得。然而，看起来脚本是一个重要的记忆结构（例如，参见 Bower 等，1979；Graesser\
  \ 等，1979；Nelson 和 Gruendel, 1978；Smith 等，1978）。`SAM` 向我们展示了基于脚本的处理是可能的，它教了我们许多关于构建大型理解程序的知识。`PAM`\
  \ 和 `TALE-SPIN` 向我们展示如何在故事理解和生成中表示和使用计划与目标。从某种意义上说，它们的构建教会了我们已经知道的：真正的故事理解者和故事生成器并不完全依赖任何一种知识结构，而是在需要时使用所有它们。\n\
  \n另一方面，我们从所有这些程序中学了许多关于我们开发的概念实际用途的知识。每个程序都详述并改变了我们对最初想要测试的理论的观点。例如，`POLITICS` 和\
  \ `PAM` 探索了复杂目标分析、计划和反计划的问题，这些问题我们之前几乎没有考虑，但在构建程序时必须直接面对。\n\n这些程序最大的贡献之一是打破了我们认为构建独立模块是构建大型知识程序的正确假设。正如解析被证明无法有效地拆分为语法模块和语义模块一样，理解也被证明无法拆分为解析部分和推理部分。像\
  \ `SAM` 这样的大程序因为解析器和内存之间的链接薄弱而变得笨拙。`FRUMP` 和 `POLITICS` 都使用了与其他组件部分集成的特殊解析器。因此，来自\
  \ `FRUMP` 和 `POLITICS` 最高内存层级的信息被用于帮助解析。这些程序因为这种集成方法运行得有效得多。我们现在开始以这种方式构建我们所有的程序。\n\
  \n# 2 程序背后的理论：概念依赖\n\nDOI: [10.4324/978023728147-2](https://dx.doi.org/10.4324/978023728147-2)\n\
  \n\n\n\n\n这里介绍的所有程序都基于我们在过去十二年里一直在开发的一种语言和语言处理理论。在这一期间，该理论经历了许多变化。我们在这里展示的内容旨在强调我们当前思维的要点，并对这些想法为何在那个时间以那种方式发生演变提供一些历史视角。\n\
  \n语言是一种以通信为目的的媒介。因此，任何语言研究的首要关注必须是确定哪类内容是可以被传播的。我们的重点必须放在通信的内容上，而不是形式上。\n\n在人工智能的框架内，这看起来并不是一个非常激进的立场，事实上也确实如此。但直到最近，语言学的主流思想一直倾向于相反的方向。对形式的研究重于内容的，使得句法研究变得至关重要，而意义和知识问题仅被视为次要，或者根本不被考虑。\n\
  \n当我们刚开始开发这一理论时，无论是语言学家还是计算语言学家，对关注点不是语法的理论都几乎感兴趣。在我们将我们的表征理论——概念依赖（Conceptual Dependency,\
  \ `CD`）与此类以语法为导向的观点对立时，我们经常被归类为反对语法的，或者认为可以在不使用语法的情况下理解语言。实际上，我们从未持过任何此类立场。我们的信念是意义是首要问题，句法的研究应该由理解理论的需求来引导。我们开发的所有解析器都拥有大量的语法信息可用。然而，它们中没有一个将这些信息仅作从输入中获取意义的辅助手段。我们的观点是，在理解过程中不应该有一个初始的独立语法处理。我们仍然认为，人们不能、也不想要仅使用或主要使用语法信息来处理语言的任何部分。\n\
  \n为了使一种语言理论在人工智能领域具有意义，它必须提供对意义的表征，以及进入和退出该表征的方法。由于人工智能是一门实验性科学，我们不断修改我们的表征以及进入和退出这些表征的方法。我们并不声称拥有决定性的表征。然而，通过设计使用这些表征程序的经验，我们已经学了很多关于意义表征中必须包含哪些类型的内容。\n\
  \n## 表示事件\n\n在尝试确定意义的正确表示应该是什么样时，我们必须首先理解必须表示许多不同的东西。这些包括：物理事件、心理事件、意图、物理原因、心理原因（即理由）、相关的事件和意图的簇，以及对事件结果或反响的预测。\n\
  \n任何意义表示系统的核心都是事件的表征。`CD` 使用一个简单的结构来表示事件的核心，即在不同描述中保持不变的部分。也就是说，无论描述该事件的言语采取什么形式，用于表示它的\
  \ `CD` 形式始终是相同的。其工作原理如下：\n\n```\n 每个 EVENT 包含：\n 一个 ACTOR（执行者）\n 由该执行者执行的 ACTION（动作）\n\
  \ 动作作用的 OBJECT（对象）\n 动作指向的 DIRECTION（方向）\n```\n\n这种事件的正式结构是 `CD` 的核心。它的使用迫使你假定执行者、对象等，这些可能在描述事件的句子中没有被显式提到，但它们必须存在。这是因为根据定义，一个事件包含了上述所有的元素。因此，在解析为\
  \ `CD` 时，以及从 `CD` 推断时，系统的主要动力之一是“填槽填充”。未知元素被从从正在解析的句子或广泛的世界知识中获取的项目所取代。（这种填槽填充的概念后来被\
  \ Minsky (1975) 在他的框架理论中使用过。）\n\n因此，表示一个句子很大程度上取决于我们对执行者和动作概念的定义。执行者是一个具体的对象（称为图像产生器或\
  \ `PP`），它可以决定以某种方式作用于某个具体对象（即另一个 `PP`）。动作是执行者对具体对象所做的事情。根据这些定义，岩石是一个 `PP`，但它永远不可能是执行者，因为它永远无法决定做任何事情。名词并不一定都是\
  \ `PP`。例如，“诚实”可以是句子的主语，但它不是 `PP`，因此不能成为执行者。\n\n一些例子可以说明表示问题：\n\n*   John went to\
  \ New York.（约翰去了纽约。）\n\n    在这里，`OBJECT` 是缺失的。可以使用附加在“go”的词义上的规则（rale）来填充，该规则规定对象与填充\
  \ `ACTOR` 槽的项目相同。（也就是说，在 `CD` 中，我们会得到“John went John to New York”，虽然这不符合英语语法，但是是良好的\
  \ `CD`。）\n\n*   John likes to drink.（约翰喜欢喝酒。）\n\n    在这个句子中，我们有一个由部分完成的 `CD` 引起的\
  \ John 的一种状态。（状态和因果关系将在稍后处理。）我们有一个针对 `CD` 的动作（`drink`），并需要填充其他元素。`ACTOR` 是推断出来的，因为英语动词“like”要求除非另有说明，否则执行者与动词“like”的主语相同（例如，“John\
  \ likes Mary to drink”）。`DIRECTION` 来自于“drink”的含义，类似于“朝约翰的嘴”。`OBJECT` 必须根据我们对饮酒的了解推断出来。类似于“酒精饮料”是该槽的默认填充项。\n\
  \n*   John fell.（约翰摔倒了。）\n\n    在这里，似乎“John”是 `ACTOR` 槽的填充物。但仔细的思考表明，John 并没有采取行动。是某些东西作用在他身上。John\
  \ 在这里是 `OBJECT`。`ACTION` 是施加在他身上的力。“Fell”（跌倒）有一个默认的 `DIRECTION` 是“朝地面”。缺失的执行者是“重力”或其他某种自然力。\n\
  \n*   John amazed Mary（约翰让玛丽感到惊奇）\n\n    在这里，John 是 `ACTOR`，但这里 `CD` 的其他填充项就不那么清晰了。说\
  \ John 执行了“amaze”（惊奇）这个动作完全忽略了“amaze”并不指代任何特定动作。相反，它指的是由于 John 所做的任何动作而引起的玛丽的一种状态。实际的\
  \ `ACTION` 是未知的。John 可能做了很多可能让玛丽感到惊奇的事情。也许他远距离击了一个球，又也许他表达了抱歉。因此，John 作为执行者的该 `CD`\
  \ 的 `ACTION`、`OBJECT` 和 `DIRECTION` 都是未知的。已知的是未知的 `ACTION` 导致了玛丽状态的变化。\n\n以这种方式观察语言有什么意义？考虑“John\
  \ likes to drink”（约翰喜欢喝酒）这个句子。听到这个句子的人知道很多关于 John 的信息，这些信息是根据推断 John 经常摄入酒精饮料，以及对此类重复动作的影响的其他推断得出的。要让计算机理解英语，有必要让计算机做出同样的推断。这只有通过强制机器寻求填充\
  \ `CD` 中缺失的槽，并给它一些实现这一点的方法才能。没有 `CD` 的严格格式，理解机制将不知道自己不知道什么。知道自己需要知道的信息是理解的关键部分。\n\
  \n\n\n\n\n这一通用问题可以通过“约翰跌倒了”这个例子得到进一步说明。在这里，是一个 `OBJECT`（物体）在另一个对象的 `DIRECTION`（方向）上受到了力，这导致我们推测这两个物体接触产生的影响。当这种情况发生时，“高密度物体有力接触可能会损坏其中一个物体”的规则必须被激活。在这个例子中，这条规则使我们推测约翰是否受伤了。这种推测是理解的重要部分，并受到\
  \ CD（概念依赖）的促进。\n\n如果上面的例子是“约翰向玛丽投了一块石头”，那么关于施加在物体上的力和潜在碰撞的相同规则仍然适用。然而，这次 `DIRECTION`\
  \ 槽中的项目是可能受损的那个。我们担心的是玛丽受伤，而不是石头。为了让同一条规则在每种情况下都适用（变量是涉及对象的相对密度），我们必须使用除单词以外的起点来编写此类规则。正是这种认识促使我们开始寻找“原语动作”（primitive\
  \ actions）。\n\n### 原语动作（The Primitive Actions）\n\n起初（Schank, 1969），CD 使用英语单词来填充事件表示中的槽位。那些自原语动作成为一部分以来才看到\
  \ CD 的人，倾向于认为 CD 背后的理论与原语动作背后的理论是完全相同的。但这两个理论虽然相互依赖，却涵盖了完全不同的领域。\n\nCD 的核心原则可以表述如下：事件的表示是与编码这些事件的单词分开完成的；理解者的任务是表示句子背后的事件，而不是表示句子本身；这些表示受一组关于将输入拟合预定义表示方案的规则支配；最后，填充这些表示槽位的规则是作为语言理解基础的规则。\n\
  \n对原语的需求源于一种渴望，希望规则以最通用的方式工作，且没有信息重复。当两个句子以这种方式描述同一个事件，使得这些描述具有相同的整体含义但形式完全不同时，我们期望我们的\
  \ CD 表示对这两种描述是相同的。做到这一点需要在 CD 内部使用一种能够表达意义并可以映射到非常不同的语言形式（甚至是不同的语言）的词汇。对这种跨语言词汇的搜索就是对原语的搜索，或者是对基本意义元素的搜索，这些元素可以像原子结合成分子一样结合以产生复杂的意义。\n\
  \n解释原语最简单的方法是从一个例子开始。考虑以下句子：\n\n* 约翰给了玛丽一本书。\n* 玛丽从约翰那里拿了一本书。\n* 玛丽从约翰那里收到了一本书。\n\
  * 约翰卖给玛丽一本书。\n* 约翰从玛丽那里买了一本书。\n* 约翰用雪茄换了玛丽的书。\n\n显然，在所有这些句子中都有一个共同的意义元素，它是我们看到的动词的基础。正如我们所说的，在\
  \ CD 中，事件总是通过执行者（actor）、动作（action）、物体（object）和方向（direction）的组合来描述。因此，在分析“约翰给了玛丽一本书”时，我们可以从空事件开始：\n\
  \n```\nactor:unknown\n action:unknown\n object:unknown\n:unknown\n```\n\n当然，这些角色都不是未知的。执行者显然是约翰，物体显然是书。在\
  \ CD 的早期以及大多数语言理论中，动作会被认为是“给予”。“给予”接受一个生物方向（即，我们将某物交给生物对象，通常是人类）。因此，一个简单的分析是：\n\n\
  ```\nactor:John\n action:give\n object:book\ndirection:Mary\n```\n\n现在考虑“玛丽从约翰那里拿了一本书”。这里的执行者当然是玛丽，物体再次是“书”，方向似乎是“约翰”。但方向“从”（from）和方向“向”（towards）之间有非常不同的之处。如果我们在这里把方向写为“约翰”，我们肯定会丢失信息。\n\
  \n问题是，方向必须包含两个部分才能被完全指定。如果方向是“从约翰”，那么它也必须是“给某人”。同样，在前面的句子中，仅仅我们只听到了“向玛丽”部分，并不意味着没有一个隐藏在某处的“从”部分在句子的剩余部分被发现，或者由我们自己推断。假设“拿”（take）是动作，让我们修正对方向角色的分析，以解释我们对这两个句子所说的内容。这留下了：\n\
  \n| actor | | John | actor | | Mary |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| action | | give | action | | take |\n| object | | book | object | | book\
  \ |\n| direction | TO | Mary | direction | TO | unknown |\n| FROM | FROM | unknown\
  \ | | FROM | John |\n\n尽管我们预料对这些句子含义的分析看起来会有相似之处，但这里似乎真的没有明显的相似之处。问题是，我们还没有真正处理“给予”和“拿”的含义。为了考虑它们的意义可能是什么，我们可以尝试填充方向角色中的空白槽位。我们可以确定书是从谁那里“给予”的，因为“给予”的意义规定了“约翰”是“给予者”。执行者与物体的起始方向（或赠送者）相同。同样，在后一个句子中，我们知道玛丽现在有了那本书。“拿”的执行者与物体的“向目标方向”（或接收者）相同。\n\
  \n| actor | | John | actor | | Mary |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| action | | give | action | | take |\n| object | | book | object | | book\
  \ |\n| direction | TO | Mary | direction | TO | Mary |\n| FROM | FROM | John | |\
  \ FROM | John |\n\n这些分析看起来有点像，但仍然缺少了什么。让我们考虑这两个句子之间的区别。表面上它们的执行者不同。但还有什么不同？它们都涉及一个整体结果相同的事件。该事件的影响是将书的所有权从约翰转移到玛丽。它们之间唯一的区别就是事件中被关注作为执行者的人。\n\
  \n与其谈论“给予”或“拿”之类的动作，我们应该认为这两个事件中的动作都是与事件的意图和整体效果明确相关的动作，即“所有权的转移”（transfer of possession）。一旦我们做到了，我们的分析将这些句子处理为意义仅在涉及的执行者方面不同，如下：\n\
  \n| | (1) | | (2) | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| actor |\
  \ | John | actor | | Mary |\n| action | | TRANSFER POSSESSION | action | | TRANSFER\
  \ POSSESSION |\n| object | | book | object | | book |\n| direction | TO | Mary |\
  \ direction | TO | Mary |\n| FROM | FROM | John | | FROM | John |\n\n考虑此类分析的整体净流失和净收益是重要的。显然，如果我们丢失了信息，说明我们没有有效地捕捉所有的意义。但我们真的丢失了信息吗？如果我们告诉生成器，每当它发现执行者和\
  \ TO 方向相同的“所有权转移”时，它应该使用动词“take”来表达该信息，并且当 FROM 方向和执行者相同时，它应该使用动词“give”，那么通过这种分析我们不会丢失任何东西。我们得到了什么？\n\
  \n\n\n\n\n首先，我们获得了简洁性。每当记忆看到 `TRANSFER POSSESSION`（所有权转移）时，它就可以应用相应的推理规则。如果这些推理规则是用文字编写的（例如：如果你给某人某东西，他们拥有了；如果他们拿走了，他们拥有了，等等），那么对于每个指向\
  \ `TRANSFER POSSESSION` 的动词，将涉及大量的重复。这种简洁性的损失是巨大的，因为这里不仅涉及“给”和“拿”，还涉及成百个其他涉及所有权转移的动词。\n\
  \n其次，我们捕捉了对理解至关重要的意义相似性。人们可以通过任何一个句子（或在合适的情况下使用上述其他某些句子）来表达同一个事件。在每种情况下，我们的视角略有不同，这种差异通过分析中参与者的差异来捕获。但整体含义非常接近（这本应如此，因为它们指的是同一个事件），我们的意义表示必须反映这一点。\n\
  \n在 `CD` 中，`TRANSFER POSSESSION` 被称为 `ATRANS`，这是一个原始动作。无论我们称其为什么，在理解系统中，除了其发生在该系统中产生的结果外，该名称没有实际意义。换句话说，`ATRANS`\
  \ 在系统中的实际意义就是因为它的存在而触发的推理规则集，不多不少。\n\n为了进一步考虑 `ATRANS` 的用法，让我们审一下“约翰从玛丽那里买了一本书”。动词“买（buy）”意义的恰当分析是什么？实际上发生了两个\
  \ `ATRANS`。第一个涉及书。第二个与第一个有因果关系，也涉及一个 `ATRANS`。但这次，参与者的角色交换了，金钱是对象。\n\n| actor |\
  \ | John | | actor | | Mary |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| action | | `ATRANS` | <------- | action | | `ATRANS` |\n| object | | money\
  \ | CAUSED | object | | book |\n| direction | TO | Mary | ------- > | direction\
  \ | TO | John |\n| | FROM | John | | | FROM | Mary |\n\n（这里的双箭头表示这两个事件是相互因果的。）那么，“玛丽卖一本书给约翰”的分析是什么？显而易见，它的意义与上面给出的意义相同。因此，它们每一个的分析都是相同的。（可以论证这些句子的意义略有不同。这个问题源于脱离语境看待句子。语境的作用在第\
  \ 3 章中进行了讨论。这里的观点是，无论语境如何，至少上述元素是存在的。）\n\n在论证 `ATRANS` 的用法时，也许最重要的案例是“约翰用一本书向玛丽交易了一个雪茄”。这个句子在意义上与上面两个非常相似，但在句子结构上存在显著差异。“钱”在“买”和“卖”的意义中是隐性的。因此，解析器的任务是将“钱”放在分析中适当的位置。但对于动词“交易（traded）”，两个\
  \ `ATRANS` 的对象都通过单词“for”的使用被指定了。因此，分析器将使用一条规则，说明“trade”后面的“for”填充第二个 `ATRANS`。因此，这个句子的意义分析与上述相同，只是用“雪茄”替换了“钱”。\n\
  \n### 原始动作问题\n\n我们在 `CD` 中使用的原始动作中最争议的并非它们的实用性或合理性，而是我们坚持认为，极小的原始动作集合就可以解释物理世界中需要表示的内容。之所以能够坚持这种立场，是因为原始动作是以相当复杂的方式组合的。此外，英语中许多动词根本不是指动作。像“amaze（震惊）”这样的词指的是导致状态变化的未命名动作。所以，尽管我们常说人们可以“伤害”、“安慰”、“取悦”或“打扰”他人，但这些动词中没有一个属于动作。\n\
  \n在 `CD` 中，我们目前使用了十一种原始动作。这些是：\n\n| `ATRANS` | `MTRANS` | `SPEAK` | `INGEST` |\n\
  | :--- | :--- | :--- | :--- |\n| `PTRANS` | `MBUILD` | `GRASP` | `EXPEL` |\n| `PROPEL`\
  \ | `ATTEND` | `MOVE` | |\n\n由于我们已经在其他地方详细描述过 `CD`（Schank, 1972; Schank, 1973; Schank,\
  \ 1975），这里没有必要重复对这些每一个动作的所有论点和解释。对于我们这里的目的，只需要解释这些原始动作背后的某些哲学、它们在我们编写的程序实际用途，以及它们在任何全面的语言理论中的完整性或缺失性。\n\
  \n`CD` 有许多我们在这里没有讨论过的特征——其中一个就是一个 `CD` 可能依赖另一个。这种情况有两种方式。一种是通过因果关系，我们将稍后讨论。另一种是通过工具性。在这种情况下，一个\
  \ `CD` 填充关于另一个 `CD` 实现的细节。某些原始动作几乎专门用于这种用途。由于这个原因，我们在这里不会关注它们，而是根据它们与更基础动作的关系进行描述。工具性动作是：`GRASP`、`MOVE`、`SPEAK`、`ATTEND`\
  \ 和 `EXPEL`。另外六个是计算机程序实际使用的动作。\n\n### 剩下的六个原始动作\n\n一个重要的原始动作是 `MTRANS`。`MTRANS`\
  \ 意味着将信息从一个人传递给另一个人，或从大脑的一个部分传递到另一个部分。数百个动词的主要意义元素是 `MTRANS`：“读（read）”、“告诉（tell）”、“看（see）”、“听（hear）”、“记得（remember）”、“忘记（forget）”、“教（teach）”、“建议（suggest）”、“承诺（promise）”等等。这些每个词的要点是，它们的焦点都是信息的传递。让我们考虑动词“read”和“read”。\n\
  \n“看（see）”是将信息从眼睛 MTRANS 到意识中。这通常是通过通过 `ATTEND`（关注）眼睛去看要看到的事物来实现。因此，为了分析“看”，我们需要表示两个新事物。首先，我们需要对意识进行某种表示。为此，我们不需要解释大脑是如何工作的。我们正试图表示人们如何思考他们如何思考。因此，我们只需要表示当人们听到使用“see”一词的句子时，一个单纯的人是如何思考的。我们将接收传入信息的脑部（即心理位置或\
  \ `MLOC`）称为意识处理器（`CP`）。这种东西在物理上是否真实存在完全无关。它只是一个帮助人们谈论思考的标签。\n\n我们还需要一个指定 `ATTENDING`\
  \ 的工具性动作。`ATTEND` 的对象是任何感官，它的方向是某个具体的物体。\n\n因此，“约翰看到了玛丽”的意义被表示为：\n\n```\nactor:John\n\
  \ action:MTRANS\n object:image of Mary\ndirection TO:MLOC (CP of John)\n FROM:eyes\
  \ of John\n```\n\ninstrument:\n\n```\nactor:John\n action:ATTEND\n object:eyes\n\
  direction TO:Mary\n FROM:unknown\n```\n\n也就是说，“看”是通过 `ATTEND` 眼睛信息 MTRANS 到 MLOC(CP)。现在让我们看看句子“约翰读了一本书”中的“读”。它被表示为：\n\
  \n```\nactor:John\n action:MTRANS\n object:information in a book\ndirection TO:CP\
  \ of John\n FROM:book\n```\n\ninstrument:\n\n```\nactor:John\n action:ATTEND\n object:eyes\n\
  direction TO:book\n FROM:unknown\n```\n\n\n\n注意，在这一分析中，“看”（seeing）和“读”（reading）几乎是相同的。事实上，“看到一本书”和“读一本书”完全相同，仅有一点重要不同：“看到\
  \ X”的 `MTRANS` 宾语是“X 的图像”，“而读 X”的 `MTRANS` 宾语是“X 中的信息”。\n\n现在我们考虑动词“告诉”（tell）和“承诺”（promise）。“告诉”非常简单，它是通过语言在人与之间进行的信息\
  \ `MTRANS`。\n\n现在考虑句子“John 承诺给 Mary 一本书”：\n\n```\n acton:John\n action:MTRANS\n\
  object: actor:John\n action:ATRANS\n object:book\n direction TO:Mary\n FROM:John\n\
  \ time:future\ndirection TO:unknown\n FROM:John\n```\n\n上述表示法有几个有趣的属性。首先，我们注意到没有工具（instrument）。上面的句子没有说明交流是如何发生的。“承诺”可以通过口头、信件或通过介人做出。由于“承诺”本身没有对工具说明任何内容，因此我们省略了工具这一项。\n\
  \n其次，存在一个未知的 `TO` 方向。我们可能会假设 Mary 接收了这一承诺，这确实是一个很好的推断，但句子并没有这么说，事实上其他人也可能是这个承诺的接收者。\n\
  \n“承诺”中最有趣的部分被留在了我们的表示法之外。我们在这里定义的“承诺”被表示为类似于“说你将做某事”（注意，我们在在这个例子中为事件添加了时间，以表示承诺的未来性质。时间实际上存在于所有事件中，但为了简单起见我们省略了它们）。但“承诺”实际上不仅仅是“告诉你要做某事”。“承诺”的假设是说话者相信所指事件的整体效果将是（可能对\
  \ Mary 好，但也可能对他自己）。因此，我们这里有一个新元素，即说话者的信念。它表示为：\n\n```\n state: in the mind of the\
  \ speaker\nobject: actor: John\n action: MTRANS\n object: book\ndirection TO: Mary\n\
  \ FROM: John\n time: fugure\n |\n | CAUSE\n |\n object: Mary or speaker\n state:\
  \ benefitted\n```\n\n因此，我们说“承诺”指的是说话者的一种态度，这种态度表达了他的信念，即所指事件将对自己或 Mary 有益。这种歧义性通过语境向其中一个方向倾斜。\n\
  \n三种主要的物理动作：`PTRANS`、`INGEST` 和 `PROPEL`。考虑句子“John 去了纽约”。“去”只是位置的转移。到目前为止，我们要求所有事件都具有某些槽位（slots），但这里没有明显的宾语槽候选者。什么被转移了？答案是，由于我们倾向于谈论自身移动，动词“go”不接受句法宾语。然而，所有动作都有一个概念宾语，因此虽然说：“John\
  \ 把自己走到了商店”听起来很滑稽，但在概念上这正是我们的意思。因此，“go”的概念执行者通常与其概念宾语相同。我们对上述示例的表示法如下：\n\n```\n\
  \ John went to New York.\n actor: John\n action: PTRANS\n object: John\ndirection\
  \ TO: New York\n FROM: unknown\n```\n\n现在考虑“John 乘飞机去纽约”。如果我们极其天真，可能会想象，由于“take”之前被用来表示\
  \ `ATANS`，那么这里使用的 `ATANS` 就是这里正在使用的原始动作。但是，考虑以下也使用了“take”的句子：\n\n*   John 坐了飞机。\n\
  *   John 吃了一片阿司匹林。\n*   John 带走了 Mary。\n*   John 受了一顿挨。\n*   John 接了那份工作。\n*   John\
  \ 赢了比赛。\n*   John 拿食物。\n*   John 拍了照片。\n*   John 采纳了我的建议。\n\n我们可以持续下去。显然，“take”并不总是意味着\
  \ `ATANS`。要获得像“take”这样的动词的正确含义，必须检查“take”的句法宾语并查看它的属性。如果它是一个功能是 `PTRANS` 的宾语，那么一种强可能性（尽管显然不是唯一的——语境是最终决定因素）是“take”意味着“通过……手段\
  \ PTRANS”。因此，“John 乘飞机去纽约”最可能的分析是：\n\n```\n actor: John\n action: PTRANS\n object:\
  \ John\ndirection TO: New York\n FROM: unknown\n```\n\ninstrument\n\n```\n actor:\
  \ plane\n action: PROPEL\n object: plane\ndirection TO: New York\n FROM: unknown\n\
  ```\n\n以及\n\n```\n actor: John\n action: PTRANS\n object: John\ndirection TO: plane\n\
  \ FROM: unknown\n```\n\n我们在这里给出的是非常复杂的工具，说明 John 上了飞机，而飞机在空中自我推进到达纽约。\n\n上面的分析并不完全正确。如果我们让\
  \ John 上了飞机，为什么不让他同时也坐着看本杂志呢？我们在哪里停止？这个问题将在第 3 章 关于脚本（scripts）的内容中讨论。\n\n考虑句子：“石头撞中了男孩。”\n\
  \n人们对这类句子的理解方式与它们被说出来不同。由于我们理解石头从不真正行动，所以我们不把“石头撞中了男孩”看作像“人撞中了男孩”一样。相反，我们立即意识到石头是无生命的实体物体，而无生命的实体物体通常作为动作的宾语。因此，从概念上说，这个句子中的石头必须是动作的宾语。\n\
  \n\n\n\n```\n actor: John\n action: GRASP\n object: glass of milk\ndirection TO:\
  \ hand of John\n```\n\n在这里我们看到了一个工具无限扩展的案例。分析写道：“约翰通过将手移向牛奶并抓住杯子，将牛奶送到嘴边喝了牛奶。” 人在每次听到\
  \ `drink`（喝）这个词时，真的会考虑到这一切吗？答案是“既是”也是“否”。由于这种情况几乎每次都是这样发生的，去思考这些将是浪费时间。尽管如此，如果人们由于某种原因需要这些信息，他们确实拥有获取这些信息的可能。（例如，如果已知约翰无法使用手，我们会好奇他是如何喝东西的。除非“使用手”以某种方式在句子的含义中显式地作为工具信息呈现出来，否则这种好奇无法解释的。）\n\
  \n“约翰注射了海因”这句话也为 `INGEST`（摄入）增加了一个工具，但这次是显式的。因此，我们有：\n\n```\n actor: John\n action:\
  \ INGEST\n object: heroin\ndirection TO: vein of John\n FROM: hypodermic needle\n\
  ```\n\n工具：\n\n```\n actor: John\n action: PROPEL\n object: hypodermic needle\ndirection\
  \ TO: bodypart of John\n FROM: unknown\n```\n\n我们将讨论的最后一个动作 `MBUILD`（心理构建）需要一个与其他动作不同的概念对象。`MBUILD`\
  \ 是一个从内存或外部接收输入的过程，并产生一个放置在 `CP` 中的输出。因此，`MBUILD` 的表示将包含一个 `object IN` 槽和一个 `object\
  \ OUT` 槽，用来解释待考虑的问题以及通过 `MBUILD` 过程达到的解决方案。\n\n```\n John figured out where the\
  \ money is.\n actor: John\n action: MBUILD\n object IN: LOC(money) is place?\n OUT:\
  \ LOC(money) is place X\ndirection TO: CP\n FROM: Memory\n```\n\n```\n John wondered\
  \ who ate the cheese.\n actor: John\n action: MBUILD\n object IN: actor: ?\n action:\
  \ INGEST\n object: cheese\n direction TO: mouth of?\n FROM: unknown\n OUT: none\n\
  direction TO: CP\n FROM: Memory\n```\n\n表示人类心理操作的问题，当然与弄清楚人类究竟是如何思考的同样复杂。\n\n##\
  \ CD 的范围\n\nCD 的开发既是作为一种语言理论，也是作为一种增强我们构建理解语言的计算机程序的表示语言。我们经常处于试图同时侍从两个主的境地：它最终正确吗？它好用吗？我们的哲学是不费精力在我们的表示语言中设计那些永远不会被实际使用的功能。由于这个原因，我们有时会面临更具理论倾向的语言学家的挑战，关于量化或伪分裂提升（pseudo\
  \ cleft raising）等问题。我们认为这些问题是重要的。然而，我们也认为，此类复杂问题的解决取决于对简单问题的解决。在表示简单意义或设计理解和生成简单句子的算法方面取得进展之前，将研究集中在语言的细微之处是没有意义的。\n\
  \n我们不争论所引入的任何概念的正确性或完整的理论范围。在人工智能的这种实验科学中，我们提供的计算机程序是我们在此阶段的实现。\n\n关于 CD 还有最后一点说明。CD\
  \ 对我们来说作为所有程序都可以用于相互通信的通用语言非常有用。因此，这十个原始动作和 CD 的其他各个方面为我们提供了帮助。然而，我们清楚，对于简单物理事件和人类交互之外的领域，CD\
  \ 往往是不够的，或者至少不是最优的。为了增强 CD，我们发明了脚本、计划、目标和主题作为表示信息的额外方法。\n\n在 Schank 和 Carbonell\
  \ (1978) 中，我们引入了一组“社会动作”（social ACTs），它们代表“社会含义”，如 `AUTHORIZE`（授权）或 `PETITION`（请求）。例如，警察给某人开超速单确实是一个\
  \ `ATRR`，但该事件更恰地被视为开始起诉的法律授权。\n\n我们目前认为，我们仍然处于解决语言理论面临的许多表示问题的起点。我们相信 CD 以某种形式处于所有表示形式的底部。然而，由于\
  \ CD 有时对于表示复杂思想、人类和计算机程序的完整含义来说过于底层且具体，人们必须拥有更高、更有意义的表示。尽管如此，无论使用何种表示方案，涉及英语单词的方案完全是错误的。意义是存在于英语之前、并在英语消失很久之后依然存在的实体。\n\
  \n# 3 程序背后的理论：语境理论\n\nDOI: [10.4324/9780203728147-3](https://dx.doi.org/10.4324/9780203728147-3)\n\
  \nCD 是一种关于如何根据句子所传递的关于事件和状态的信息来表示句子的理论。传统的语言理论将其范围限制在考虑脱离语境的句子。然而，任何关于事件表示以及描述这些事件句子的合理理论都必须在语境中考虑这些句子。当我们考虑语境理论的本质时，会产生两个问题：\n\
  \n> 句子是如何连接在一起的？\n\n> 人们拥有什么样的知识，使他们能够发现一个可以将句子（和事件）组合在一起的语境？\n\n然而，在我们开始考虑句子是如何组合的之前，我们必须考虑事件和状态如何在语境中组合在一起。考虑以下句子：\n\
  \n> 约翰哭了，因为玛丽说她爱比尔。\n\n这是一个有意义且结构良好的英语句子。然而，从字面上说它相当愚蠢。约翰并不是因为玛丽说话这个事件而哭。她的“说话”导致的是“思考”，而思考会导致“悲伤”，而悲伤可能是“哭”的原因。\n\
  \n为了完全理解此类句子，我们必须计算句子中事件和状态之间存在的因果关系。这需要一个世界模型，其中包含关于什么可以导致什么的知识。\n\n为了更好地看到这一点，考虑以下句子：\n\
  \n> 约翰的腿断了，因为玛丽绊了他的脚。\n\n> 约翰的腿断了，因为玛丽对他大叫。\n\n在第一个句子中，我们并不难弄清楚因果关系，因为我们知道“绊某人”可以导致骨折，这与我们在句子中显式表达的内容一致。但在第二个句子中情况并非如此。在这里我们必须弄清楚到底发生了什么。我们必须在脑海中创建一个场景，来解释“断腿”和“大叫”之间可能的联系。也许是玛丽的大叫在约翰走路时分散了他的注意力，导致他撞到了墙或掉进了洞。当然，作为理解者，我们在这里只是在猜测。重要的是，这种因果补全过程是理解不可或缺的一部分。为了证明这一点，我们只需要看一个我们无法想象合理因果关系的句子。例如，考虑：\n\
  \n> 约翰无法笑，因为玛丽吃了一个冰淇淋。\n\n> 约翰骨折了，因为玛丽在给他读书。\n\n这些句子是没有意义的，因为我们无法弄清楚因果关系。在上面的句子中，我们可以弄清楚。那么，是什么让句子变得可以理解？它们必须适用于理解者的分析，以便他能够建立正确的因果关系。\n\
  \n## 因果类型\n\n\n\n\n句子内部建立因果连接的规则与我们在描述某一事件的句子之间建立因果连接的规则相同。这些连接主要取决于确定哪些动作导致了什么状态，以及哪些状态能够触发动作。我们使用四种因果链接来连接事件和状态：结果因果（result\
  \ causation）、启用因果（enable causation）、启动因果（initiation causation）和原因因果（reason causation）。\n\
  \n### 结果因果（Result Causation）\n\n一个事件可能会产生一个改变相关对象状态的`result`。因此，“灯坏了是因为约翰撞了它”就是结果因果的一个实例。\n\
  \n### 启用因果（Enable Causation）\n\n当状态发生变化时，可能会改变世界的状态，使得某个之前无法发生的事件发生。这被称为`enable\
  \ causation`。这些状态变化仅启用潜在的事件。也就是说，它们并没有直接导致事件发生，而只是使其潜在发生成为可能。因此，“约翰吃饭了是因为桌子上上有食物”就是启用因果的一个实例。\n\
  \n### 启动因果（Initiation Causation）\n\n每当事件或状态变化发生时，或者当某个状态或潜在事件存在时，行为者都可能被察觉到它，从而开始思考它。这被称为`initiation\
  \ causation`。启动因果解释了人们对事物的思考。因此，如果有：“约翰意识到玛玛不开心是因为他看到她在哭”，我们就得到了启动因果的实例。\n\n###\
  \ 原因因果（Reason Causation）\n\n一旦人们开始思考事情，他们很可能决定做某事。（这是原始动作 `MBUILD`。）决定做某事就是做某事的`reason`。因此，当我们说“约翰吃鱼是因为他饿了”时，我们得到了原因因果的例子。\n\
  \n## 连接文本（Connecting Text）\n\n当我们开始处理比句子更大的话用单位时，注意到我们一直在开发的因果连接在文中频繁出现。事实上，许多文本在通过分析将所有隐性或显性的因果连接整合起来后，可以被视为一个由事件和状态构成的巨大因果链。此外，以这种方式看待文本具有巨大的优势。它让隐性内容显性化，通过关键事件与故事其他部分的紧密联系，将注意力集中在故事的关键事件上，并提供了一种便于对这些文本进行改写和总结的机制。这些内容在\
  \ Schank (1973) 和 Schank (1975) 中有更详细的描述。\n\n我们尝试构建以这种方式分析文本的计算机程序，但遇到了严重的问题。文本经常似乎在进行长长的“信仰跳跃”。也就是说，你通常无法确定因果关联性，因为你需要关于某特定情况的大量知识来确定涉及的因果关系。\n\
  \n例如，考虑以下故事：\n\n> 约翰饿了。他进入 Goldstein's，点了一份帕斯米熏三明治。食物很快被送给了他。他给服务生留下了大笔小费。\n> \n\
  \n> 人们能够容易且以相当肯定的程度回答以下问题：\n> * Goldstein's 是什么？\n> * 约翰吃了什么？\n> * 谁做的三明治？\n> *\
  \ 谁给约翰点的单？\n> * 谁上的三明治服务？\n> * 为什么约翰留下了大笔小费？\n\n人们拥有的能够理解上述故事的知识是围绕标准场景组织的。我们将这些标准场景称为`scripts`（脚本）。\n\
  \n脚本的作用是组织人们理解时必须具备的知识。此外，脚本指出了在特定情况下什么行为是恰当的。知道自己处于餐厅脚本中让你知道如果你向服务生要食物，她很可能会为你拿来。\n\
  \n我们利用对日常情况的知识来帮助理解关于这些情况的故事或话语。我们不需要询问进入剧院时为什么有人要看我们的票，也不需要问为什么要保持安静，或者在座位上坐多久合适。对特定场景（如剧院）的知识使能够解释人们关于剧院的言论。\n\
  \n人们在讲述故事时，通常会省略因果链中详细且无趣的部分。脚本将这些细节编码进一条因果链中，本质上，每当该脚本被激活时，这些细节就会作为一个整体进入理解过程。例如，一个引用包含十个事件脚本的故事可能只显式陈述这些事件中的第一个和最后一个。然而，一旦脚本被激活，由于完整的因果链，所有其他事件对理解过程来说都是轻松获取的。\n\
  \n理解依赖脚本的故事首先需要决定故事中指的是哪种脚本。这被称为`script instantiation`（脚本实例化）。接下来，使用该脚本来填充正在构建的因果链中的重要细节。我们称这个过程为`script\
  \ application`（脚本应用）。脚本应用填充了两个看似无关的事件之间因果链的空白。\n\n这两个理解过程在语言生成中也有对应的过程。当某人决定讲述一个引用脚本的故事时，他意识到他不需要（而且因为否则他会被认为相当无聊，所以不应该）提到他故事的每一个细节。他可以安全地假设他的听者熟悉所引用的脚本，只要提到了某些关键项，他们就能理解这个故事。\n\
  \n餐厅脚本包含了海量信息，涵盖了餐厅内可能发生的巨大变数。因此，我们在餐厅脚本中有“快餐店”轨道、“食堂”轨道等，每个轨道轨道都包含进入、点餐和支付的场景，但其可能性的集合与“高级餐厅”轨道不同。在“快餐”轨道中，支付可以在点餐之后、用餐之前立即发生；用餐可以在餐厅内或室外进行；顾客必须主动寻找点餐员，等。\n\
  \n（我们对记忆的最新研究使得脚本中的“轨道”概念变得过时了。我们目前将脚本视为更大内存结构的一部分。详细讨论请参阅 Schank (1979)。我们在这里讨论“轨道”是因为它们曾是\
  \ SAM 程序不可不可缺的一部分。）\n\n每个脚本都关联若干角色。当脚本被实例化时，故事中的人物承担了脚本中的角色。如果某个人物在使用特定脚本时没有被特别提到，则其存在是被假设的。这解释了在提到`the\
  \ waitress`时使用定冠词。由于使用了餐厅脚本，她已经被隐式地提到过了。\n\n## 脚本应用（Script Application）\n\n为了看到脚本如何在故事发挥作用，考虑以下内容：\n\
  \n> 约翰坐巴士去纽约。在纽约，他去了博物馆。然后他坐火车回家。\n\n在这个故事中，脚本的名字被提到了，并假设每个脚本都正常进行。（或者，可能发生了一些异常情况，但被故事作者认为不值得叙述。）\n\
  \n这里有三个显式脚本：`$BUS`、`$MUSEUM-GOING` 和 `$TRAIN`。如果听到上述故事，人们不太可能实际上思考这些脚本的所有细节。更有可能的是他们仅仅记得该脚本发生过。\n\
  \n\n\n但是，脚本的存在非常重要，因为这个故事的理解者能够回答诸之的问题：约翰进过博物馆的门吗？或者约翰付过公交车费吗？虽然我们对这些问题答案的准确性没有绝对的把握，但事实是我们直一直在回答这类问题。我们之所以能这样做，是因为我们有相应的脚本可用。然而，在没有被特别问及的情况下，我们通常不会有意识地考虑所有细节。\n\
  \n需要有意识推断的细节性质，取决于故事中实际上发现了哪些脚本细节（即脚本中的事件）。考虑这个故事：\n\n> 约翰去了一家餐厅。他点了鸡肉。他留下了大笔小费。\n\
  \n脚本被分为若干称为 `scenes`（场景）的部分。点点餐”这一动作实例化了餐厅脚本中的点餐场景。因为进入场景位于通点餐场景的路径上，我们假设它已经发生了。点餐与付小费之间的事件以及最后的离开场景也将假设为发生。也就是说，我们对故事的理解将就像它实际上是这样一样：\n\
  \n* 约翰去了一家餐厅。\n* 他坐了下来。\n* 他看了看菜单。\n* 他点了鸡肉。\n* 他吃掉了鸡肉。\n* 他留下了大笔小费。\n* 他付了账。\n\
  * 他离开了餐厅。\n\n我们就像真的听过一样，填补了所引用的脚本中的事件。只要我们只是在填补从“点餐”到“付小费”之间的事件，假设“坐下”、“看”和“吃”也是安全的。由于“付小费”是“付钱”和“离开”的前奏，我们也假设了这两个动作。\n\
  \n但是，当理解者被告知了脚本中相隔很远的事件时，他并不希望假设太多的步骤。因此，“约翰去了一家餐厅。他离开了。”这个故事就有点奇怪。我们想要假设他吃过了吗？约翰在这个故事中可能确实吃过了，但我们可能不想简单地假设此是如此，因为在一个非常长的脚本中，只被提到了第一个和最后一个场景。\n\
  \n所以，理解者的工作是从脚本中找出遗漏了哪些步骤。我们必须通过显式地推断并将它们视作已经说过，来填补围绕在我们被特别告知的事件周围的步骤。\n\n在理解过程中，脚本的一个重要方面是它们的推论效应。脚本发生偏离这一事实本身就可能对后续依赖脚本的理解产生影响：\n\
  \n> 约翰在火车上被抢劫了。\n> 在餐厅里，他无法付账。\n\n抢劫是火车脚本中一个未预料的事件。它不影响火车脚本的正常完成，但它会影响任何进入条件涉及金钱的后续脚本。在餐厅吃饭需要钱。理解者一看到餐厅脚本开始，立刻就意识到了这里的潜在问题，因为抢劫导致他推断出“顾客没钱了”。这种状态被认为是很重要的，因此被记录下来以备后之用。餐厅脚本违反的进入条件建立了一种预期，即餐厅脚本中处理无法付钱的人的部分将被使用。因此，如果我们问理解者上述故事接下来可能会发生什么，我们可能会预期他回答：“会叫警察”或“约翰不得不去洗碗”。这些答案是源于被违反的进入条件所激活的餐厅脚本的某部分的推论。\n\
  \n在第 5 章中，Cullingford 详细描述了脚本实例化和脚本应用的过程。在第 11 章中，Carbonell 讨论了脚本在 POLITICS 程序中的作用。\n\
  \n## 计划 (Plans)\n\n当然，人们可以适应他们以前没有经验的情况。这种适应能力源于对计划和目标的知识。这些实体对理解的贡献与脚本的贡献非常相似。人们需要大量的知识来理解。这些知识可以分为两类：特定的和通用的。脚本旨在解释人们拥有的特定知识。但我们理解的所有故事并非都是那么平凡和世俗，以至于仅通过使用脚本就能理解。当脚本无法帮助一个人理解新输入时，他必须转向我们所称的\
  \ `plans`（计划）的知识。由于人们自己可以计划在新的情况下如何行动，他们也可以依靠对规划的知识来帮助理解他人的计划。总来说，计划帮助人们解决新问题或处理意想不到的信息。但更重要的是，对于我们在这里讨论的问题来说，对计划的知识有助于理解者理解他人的计划。\n\
  \n很多故事（尤其是那些有趣的句子）关于完全全新的情况，对于这些情况我们没有可用的脚本。当我们听到这类故事时，我们依赖于如何规划一个导致实现目标的动作知识。我们利用这种知识来重构我们正在听的那个人物所使用的规划过程。这种重构帮助我们理解正在发生的事情。一旦我们弄出了故事人物的计划和目标，我们就能对不断发展的故事中的动作意图做出推测，这有助于我们理解故事。\n\
  \n让我们来看一个故事：\n\n> 约翰需要钱来付房的首付。\n> 他打了了他的姐姐。\n\n我们如何理解这样的故事？它没有利用我们一直在讨论的标准场景脚本。我们可能没有可用的“买房”脚本，因为我们大多数人并不经常做那种事。即使我们这样做过，我们有多少人用了姐姐呢？虽然这里不太可能有脚本，但这种情况并非全新。如果把“首付”换成“孩子的教育”或“还债”，理解这段话并没有什么。每种情况下都有筹资金的通用问题。为了理解这类故事，人们拥有关于目标以及实现这些目标的行动知识。这种知识比脚本更通用，但又不至于对任何个人都是完全全新的。\n\
  \n让我们来看另一个故事：\n\n> 约翰想成为主管。\n> 他去买了一些砷。\n\n当我们听到这个故事时，我们假设第二个句子是主要人物为了实现第一句提到的目标而采取的计划中的一步。我们假设这一点，并不听到“现在我要告诉你们约翰使用的计划”之类的陈述。作为理解者，我们已经认为在陈述目标之后的动作与该目标的实现有某种联系。在故事的第一句中，我们被告知约翰的目标。因此我们假设第二个句子告诉了我们计划中的一步。然而，在这个故事中许多可能的第二个句子并不是他计划中的一步。那么，理解这个故事的问题在于，首先意识到第二个句子可能是某个计划中的一步，然后弄清楚那个计划是什么。在这里，我们必须意识到买砷是某个计划中的一步，然后尝试弄清楚它是如何融入成为主管的计划的。\n\
  \n在完成那个简单的分析之前，我们并没有真正理解这个故事。理解故事涉及到理解句子与句子之间的关系。如果这种关系是基于目标和执行目标的计划，那么理解者必须具备关于人们通常拥有的目标和计划的知识。\n\
  \n\n\n目标可以是长期的重要，如上述提到的那些；也可以是极短期的目标，如下例所示：\n\n> 玛丽想切开她的牛排。\n> 她对着厨房里的约翰大声说道。\n\n\
  在上面的故事中，我们再次看到了一个目标，随后是实现该目标的计划中的第一步。问题在于要意识到我们拥有的正是这种内容。考虑另一个例子：\n\n> 约翰饿了。\n>\
  \ 他拿出了《黄页电话》。\n\n大多数读者意识到约翰正在使用 `黄页电话` 寻找一家不错的餐厅。但如果故事内容是这样的：\n\n> 约翰饿了。\n> 他拿出了一些碎肉。\n\
  \n一个适用于理解第二个故事的规则，如果应用得太泛化，就会预测在第一个故事中，约翰正准备烹饪并吃掉`黄页电话`。但实际上没有人真正考虑过这种可能性。为什么不呢？\n\
  \n为了理解第一个故事，我们必须意识到“饥饿”意味着将产生（或应该）一个计划，其目标是获得对食物的控制。获得食物的一种方法是去餐厅。这要求将你的位置从当前所在地移动到餐厅所在地。这反过来需要知道你要去哪里，这可能需要一个计划来确定你想去哪家餐厅以及它在哪里。如果我们理解了`黄页电话`\
  \ 包含一份餐厅列表，那么这里所需的推理是很容易做到的。假设我们听到的却是：\n\n> 约翰饿了。\n> 他拿出了《流行机械》杂志。\n\n我们可能会想，杂志末尾是否有某种餐厅指南，或者杂志里是否有相关的广告。我们在理解这个故事时会遇到困难，因为我们很难将陈述的目标（饥饿）与似乎是实现该目标的计划（获取`流行机械`杂志）联系起来。\n\
  \n现在，让我们考虑我们如何遵循所听到的计划和目标。考虑一下：\n\n> 约翰迷路了。他把车停在一个站在路边的农夫面前。\n\n上面的故事展示了对计划的知识（或缺乏这种知识）如何使文本的可理解性产生差异。故事的第一句确定了一个目标（不再迷路），这反过来告诉了我们一个相关的目标（我们称之为\
  \ `D-KNOW`）。这个第二个目标预测了将尝试产生导致获得新知识的行动。\n\n获取知识的标准方法之一是 `ASK`。在这个故事中，我们有第二个句子，可以被理解为为\
  \ `ASK` 的发生做准备。我们随后可以预期故事中的下一个事件应该是 `ASK` 本身，或者是一个隐含假设了 `ASK` 的事件。\n\n`ASK` 就是我们所说的\
  \ `planbox`（计划盒）。它是一种尝试实现预期目标的相当典型的方法。一个 `planbox` 拥有一组先决条件，或世界状态，必须使这些状态变为真才能使用该\
  \ `planbox`。它还关联着一个 `ACT`（行动，这里是 `MTRANS`），以及一个成功的 `planbox` 将完成的目标（这里是 `D-KNOW`\
  \ 或对新信息的获取）。\n\n考虑以下故事：\n\n> 约翰看到一个凶恶的身影向他的商店走来。他打开了存放手枪的抽屉锁。\n\n在这个故事中，我们可以想象理解者有一个可用的“抢劫反应”脚本。然而，更简单且更现实的理解是：当有人试图满足他对你财产的\
  \ `D-CONTROL` 目标时，你用来防止这种情况的可用行动之一是 `OVERPOWER`（制服）或 `THREATEN`（威胁）。这两个行动都是 `planboxes`。当我们推断一个角色在这里有一个目标（`D-CONTROL`）时，我们正尝试理解他的后续行动与我们已知的实现该目标的标准方法的\
  \ `planboxes` 有何联系。在这里，我们理解手枪是我们用来 `THREATEN` 和 `OVERPOWER` 的手段，因此我们可以合理地预测其中一个行动正在被尝试执行。这种预测就是理解的本质。\n\
  \n在选择 `planboxes` 时存在逻辑上的递进。`planboxes` 的选择取决于……例如，假设你想要某人拥有的书。`D-PROX` 的选择取决于……（注：此处原文似乎在\
  \ `D-PROX` 逻辑处存在叙述跳跃或原文不完整，此处已按原文翻译）。`D-goals`。\n\n我们现在将讨论用于实现 `D-goals` 的 `planbox`\
  \ 的细节。\n\n### `D-KNOW`\n`D-KNOW` 是一个涉及获取 `X` 的计划，其中 `X` 总是一个事实。`D-KNOW` 的执行者总是拥有该目标的人。`D-KNOW`\
  \ 的对象与执行者相同。也就是说，`D-KNOW` 目标意味着约翰想要约翰知道 `X`。\n\n如果约翰想要玛丽知道 `X`，上述任何计划将不起作用。威胁玛丽如果她不知道\
  \ `X` 是愚蠢的。如果约翰知道 `X` 并想要玛丽知道，他必须简单地将 `X` `TRANS` 给玛丽。如果有障碍，他必须绕过障碍。否则，如果约翰不知道 `X`\
  \ 但想要玛丽知道 `X`，他的可用子计划与 `D-KNOW` 相同，因为约翰必须像为自己获取知识一样行动。\n\n### D-CONT\n下一个目标是 `D-CONT`。`D-CONT`\
  \ 的 `planboxes` 围绕你可能会让拥有 `Z` 的人给你。因此，`D-CONT` 的 `planboxes` 是上述那些：`ASK`、`EXPLAIN`、`BARGAIN`\
  \ 和 `THREATEN`。另外两个 `planboxes` 源于你可能在主人不知情的情况下（`STEAL`）或者或者在主人知情但未许可的情况下（`OVERPOWER`）。\n\
  \n### D-PROX\n在所有 `D-goals` 中，`D-PROX` 是最“物理化”的。也就是说，到达某地涉及到特殊的机制。改变距离状态涉及的不仅仅是说服。`D-PROX`\
  \ 的某些 `planboxes` 包括：`RIDE ANIMAL`（骑畜）、`USE VEHICLE`（使用车辆）、`USE PUBLIC TRANSPORT`（使用公共交通）和\
  \ `USE SELF`（步行）。`D-goals` 是最简单的目标，那些为了更高级的目标。最常见的 `D-goals` 是：`D-KNOW`、`D-PROX`（改变位置）和\
  \ `D-CONTROL`。我们现在将讨论用于实现 `D-goals` 的 `planbox` 的细节。\n\n\n\n规划过程背的核心理论问题是目标问题。如果我们不充分了解人们通常追求的各种目标，就无法有效地考虑人们的行动如何被视为实现目标的计划中的步骤。在\
  \ Schank 和 Abelson (1977) 中，我们详尽地讨论了目标问题。从那时起，Wilensky、Meehan 和 Carbonell 在该主题上做了大量工作。\n\
  \n关于目标，我们可以说的首要点之一是，每人既拥有一套自己的独特目标，也与他们居住的社区共享许多目标。在尝试理解一个人的目标时，我们期望他在相同的情况下会做我们在那种情况下会做的事，但如果他没有这样做，我们并不会完全感到震惊。\n\
  \n为了开始研究目标，请考虑以下故事：\n\n> 约翰和他的心情人玛丽在公园里散步。突然，几个男孩从灌木丛后跳出来，用刀抵住玛丽的脖子。他们向约翰要所有的钱。约翰把钱给了他们，他们就逃了。\n\
  \n> 约翰和他的心情人玛丽在公园里散步。突然，几个男孩从灌木丛后跳出来，用刀抵住玛丽的脖子。他们向约翰要所有的钱。约翰笑了。男孩们杀了玛丽并逃了。约翰在公园里找了另一个女孩，然后去了马戏团。\n\
  \n第一个故事很容易理解。在阅读它时，我们甚至没有意识到自己正在做出什么假设。然而，在第二个故事中，我们的假设非常清晰，因为它们被违背了。当我们被告知约翰爱玛丽并知道她处于危险之中时，我们希望能够假设他有救玛丽的目标。当我们听到有人威胁玛丽并向他索钱时，我们知道有两个目标在冲突：保护玛丽的健康和保护他自己的财产。我们预期约翰有一套价值体系，将爱人的\
  \ `HEALTH`（健康）排在他自己的 `POSSESSIONS`（财产）之上（尽管我们无法确定约翰在多大程度上相信玛丽的健康真的处于危险之中）。这种知识使我们能够将“他转身并打了劫匪”这样的输入解释为一个决策，该决策表明保护财产对约翰非常重要（或者他认为玛丽面临的风险很微小）。当我们被问到“约翰为什么那样做？”时，我们可以回答：“可能是因为他认为自己可以通过这种方式保护自己，而且他不想丢钱包。”这个答案源于对我们假设大多数人标准目标的依赖。在上面的第二个故事中，我们作为读者感到沮丧，因为我们对人们应该如何行为（他们拥有什么目标）的所有预期都被违背了。第二个故事说明了我们在处理故事时在多大程度上使用了目标，却并没有意识到这一点。\n\
  \n以下是我们发现非常有用的某些目标类型：\n\n### 满足目标（Satisfaction Goals）\n\n存在一组我们可以安全假设所有人（以及动物）都拥有的目标。这些目标源于生物需求，并具有必须满足的特定频率。最明显的例子是\
  \ `Satisfy-Hunger`（满足饥饿）、`Satisfy-Sex`（满足性欲）和 `Satisfy-Sleep`（满足睡眠）。与每个 `Satisfaction`\
  \ 目标（睡眠除外）关联的是一组标准的目标对象，或实现目标的工具（例如：汉堡、情人等）。如果一个人正试图通过某个特定的目标对象来满足 `Satisfaction`\
  \ 目标，而该对象变得无法获得，我们预计会有新的目标对象取代第一个。\n\n### 享乐目标（Enjoyment Goals）\n\n有时，人们做某事仅仅是因为他们认为做起来会很快。我们把这种目标称为\
  \ `Enjoyment`（享乐）目标；典型的 `Enjoyment` 目标有：`Travel`（旅行）、`Entertainment`（娱乐）、`Exercise`（运动）、`Competition`（竞争）。`Satisfaction`\
  \ 目标涉及的活动也可以为了享乐而追求，如 `Enjoy-Eating`（享受美食）或 `Enjoy-Sex`（享受性）。`Enjoyment` 活动关联有各种目标对象，但规划这些目标的主要方法是安排出现在发生的现场。\n\
  \n### 成就目标（Achievement Goals）\n\n人们还有实现某些职位或拥有某些财产的目标。常见的 `Achievement` 目标有：`Possession`（拥有）、`Power\
  \ Position`（权力地位）、`Good Job`（好工作）、`Social Relationship`（社交关系）、`Skill`（技能）。当 `Achievement`\
  \ 目标满足时，它们通常能保证未来一系列 `Satisfaction` 目标和 `Enjoyment` 目标的满足。因此，如果你富有或权力，更高层次的目标会更容易满足。\n\
  \n### 保护目标（Preservation Goals）\n\n人们在保护或维持他们所有东西花费的时间实际上比尝试实现新目标的时间多得多。因此，最重要的目标类型之一是\
  \ `Preservation`（保护）目标。`Preservation` 目标是人们为了在获得某些职位或状态后，维护人、职位或财产的健康、安全或良好状态。当你获得了某种价值时，你会采取行动留住它。对于你可能一辈子都拥有的东西（如良好的视力）也是如此。\n\
  \n## 主题（Themes）\n\n如果我们问自己目标从哪里来，我们将面临一个非常困难的问题。人们为什么会做他们所做的事？人们经常采取某种行动是因为他们看不到其他选择；他们往往被自己的背景、工作、社会地位或对何为道德或什么是“正确”的观点所蒙蔽了其他可能性。我们把所有这些统称为\
  \ `themes`（主题）。\n\n一旦我们确定了一个人所遵循的主题，我们就可以预测他将追求的目标模式。此外，同样重要的是，一旦确定了主题，我们就可以停止问自己一个人为什么要这样做他所做的事了。垃圾工收垃圾是因为那是他的工作。劫匪抢劫是因为他认为这是他拿到钱最好的方法，而且他对诚实没有强烈的道德信念。名族少女“社交”是因为那是她阶层女孩要做的事。\n\
  \n当然，这些解释每一个都是肤浅的。但关键点在于，一旦识别了我们所知道的主题，理解者就可以决定不再寻求进一步的解释。理解者只需要识别一个熟悉的主题并将其作为预测的来源。`Themes`\
  \ 是未来研究的一个重要领域。这里没有任何工作是严重依赖它们，尽管所有工作都以某种方式使用了它们。更多细节请参见 Schank 和 Abelson (1977)\
  \ 以及 Schank (1979)。\n\n\n\n\n### 3. 标识符\n\n标识符（也称为字面量原子，在不会引起冲突时有时也称为原子），例如 `FOO`、`A`\
  \ 或 `TAG26`。标识符是任何字符序列（下列出的特殊字符除外），但不以数字、加号或减号开头。注意，数字和符号可以出现在标识符中。`TRY-RULE` 就是一个标识符。\n\
  \n特殊字符包括左括号（`(`）、右括号（`)`）、左括号（`[`）、右括号（`]`）、空格（` `）、波浪号（`~`）和点（`.`）。这些字符可以在斜杠（`/`）之后作为字母，但我们不在微程序中使用这一特性。\n\
  \n列表的写法是一个左括号，后面跟着任意数量的原子或列表，它们之间用一个或多个空格或行尾分隔，最后以右括号结尾。例如：\n\n| `(1 2 3)` | 是一个包含三个数字的列表。\
  \ |\n| `(PLUS 2 3)` | 是一个一个标识符和两个数字的列表。 |\n| `(JOHN GAVE MARY A BOOK)` | 是一个包含五个标识符的列表。\
  \ |\n| `(APPEND (CAR FOO) (CDR BAZ))` | 是一个一个标识符和两个列表的列表。 |\n| `(IF (SPANK PARENT\
  \ CHILD)` | 是一个标识符和一个列表的列表， |\n| `THEN (NOT (LIKE PARENT CHILD)))` | 一个标识符和一个列表。\
  \ |\n\nLISP 解释器会忽略空格和行尾，但使用它们来终止原子。因此，你可以自由地缩进，以使你的程序和数据具有可读性。\n\n注意，在 LISP 中，括号不是可选的。如果你想要列表，就必须使用括号。如果你不需要列表，就不能使用它们。唯一的例外是在列表的极末尾，你可以使用右括号（`]`）来表示任意数量的右括号。右括号会强制\
  \ LISP 解释器完成它正在构建的任何列表。\n\nLISP 中的注释用波浪号（`~`）引入。注释从波浪号开始，一直到当前行结束。注释中可以放置任何字符。\n\
  \n## 表达式与值\n\n在 LISP 中，每个表达式都有一个值。LISP 解释器是一个程序，不断重复读取表达式、求值并打印结果的循环。在 LISP 解释器中求表达式的值等同于其他语言中运行程序所的操作。理解每种表达式的值是如何计算的，是理解\
  \ LISP 的关键。\n\n数字的值就是数字本身。例如，`1` 的值是 `1`。在我们版本的 LISP 中，字符串的值就是该字符串本身。例如，`\"Go\"\
  ` 的值是 `\"Go\"`。在某些其他 LISP 版本中，字符串没有值。字符串通常只用于打印，而不用于计算，所以这种区别并不重要。\n\n标识符需要被赋值。如果没有给它们赋值，要求\
  \ LISP 解释器对它们求值将导致错误。某些特殊标识符已经分配了值。最重要的两个是 `T` 和 `NIL`，它们被赋值为自身。`NIL` 代表两个含义：第一，`NIL`\
  \ 用于表示“假”。根据定义，任何非 `NIL` 的东西都是“真”。（`T` 是真表达式的一个特例）。`NIL` 也用于表示空列表，即没有元素的列表。注意 `NIL`\
  \ 是一个原子而不是列表。空列表是原子 `NIL`。编写 `NIL` 的另一种方式是 `()`，这更清楚地显示了 `NIL` 的这种用法。\n\n大多数其他标识符必须通过几种不同方式显式赋值。赋值的一种方法是使用函数\
  \ `SETQ`。LISP 中的函数调用方式是告诉 LISP 解释器求值一个列表，其中函数名为第一个元素，函数参数随其后。因此，为了给标识符 `X` 赋值 `5`，我们让\
  \ LISP 解释器求值表达式 `(SETQ X 5)`。然后如果我们让 LISP 解释器求值标识符 `X`，我们就得到答案 `5`。如果我们在赋值之前让 LISP\
  \ 解释器求值 `X`，就会产生错误。\n\n`(SETQ X 5)` 的求值实际上涉及了两次求值。首先，LISP 解释器尝试求值该列表。`SETQ` 函数表示第一个参数\
  \ `X` 将被赋予求值第二个参数 `5` 后得到的结果。因此，LISP 解释器计算了 `5`，然后将结果 `5` 分配给 `X`。\n\n假设我们现在输入 `(SETQ\
  \ Y X)`。同样，`SETQ` 会告诉 LISP 解释器求值第二个参数，即 `X`。`X` 的值已被设置为 `5`，所以 `SETQ` 也会将 `Y` 设置为\
  \ `5`。注意，`Y` 不是被设置为标识符 `X`，而是被设置为 `X` 的值。如果我们想将 `Y` 设置为标识符 `X`，我们就写 `(SETQ Y (QUOTE\
  \ X))`。`QUOTE` 是一个特殊函数，它只返回它的参数。它被用于防止求值。单引号（`’`）可以写在任何表达式前面而而不是使用 `QUOTE`。其效果完全相同。例如，我们可以通过\
  \ `(SETQ Y ‘X)` 将 `Y` 设置为标识符 `X`。在某些 LISP 版本中，使用 符号（`@`）代替单引号。\n\n函数参数的求值允许我们在一个表达式中完成几件事。例如，如果\
  \ `X` 被设置为某个数字，那么以下表达式将返回 3 加上 $X$ 的平方：\n\n```\n(PLUS 3 (TIMES X X))\n```\n\n首先，LISP\
  \ 解释器尝试求值整个表达式。由于它是一个列表，LISP 解释器会将第一个元素 `PLUS` 应用于参数。`PLUS` 是内置的加法函数。（`SETQ` 是一个例外，还有某些将在后续章节中描述的函数。）因此，为了执行所需的加法，表达式\
  \ `TIMES X X` 必须先被求值。`TIMES` 是内置的乘法函数。如果 `X` 被赋值为 `5`，那么 `TIMES X X` 将是 `25`。\n\n\
  ## 定义函数\n\n在 LISP 中编程主要在于通过定义新函数来增强内置函数。为了定义一个新函数，我们使用一个特殊的内置函数，`DE`。例如，我们可以定义 `SQUARE`\
  \ 为一个数字平方的函数，告诉 LISP 解释器求值此：\n\n```\n(De Square (x) (Times x))\n```\n\n这定义了 `SQUARE`\
  \ 接收一个参数（其内部名为 `x`），并只做一件事：将 `x` 乘以 `x`。这个乘法的结果就是当调用 `SQUARE` 时返回的值。例如，`(SQUARE\
  \ 5)` 将返回 `25`。\n\n`x` 被称为局部变量。这意味着 `SQUARE` 内部的 `x` 与任何其他 `x` 的都是独立的。当调用 `SQUARE`\
  \ 时，`x` 被临时赋值为参数的值。当 `SQUARE` 完成时，`x` 会自动重新赋值为之前拥有的任何值（如果有）。\n\n定义函数的通用格式为：\n\n\
  ```\n(DE Name (List of Identifiers) Expression…)\n```\n\n这以 `DE` 的第一个参数作为名称定义一个函数。第二个参数是局部变量列表。该列表可以为空，使用\
  \ `()` 或 `NIL`。列表的长度决定了函数接收参数的数量。因此，如果列表有三个元素，函数接收三个参数。当函数在列表中被调用时，会将标识符设置为对应参数的值。然后从左到右求值表达式，并将最后一个表达式的值作为函数调用的值返回。注意，某些\
  \ LISP 版本不允许函数体中包含多个表达式。此类 LISP 版本使用 `PROGN` 函数（在本章的参考部分定义）来将多个表达式合并成一个。\n\n`DE`\
  \ 函数返回的值是定义的函数名称。\n\n## 条件分支\n\n\n\n\n\n所有的编程语言都必须有某种形式的条件，允许程序在不同情况下执行不同的操作。在 LISP\
  \ 中，使用 `COND` 函数来实现这一功能。例如，以下表达式定义了 `ABS` 返回一个数的绝对值。\n\n```\n (DE ABS (X)\n (COND\
  \ ((MINUSP X) (MINUS X))\n (T X)))\n```\n\n这个定义的意思是：如果 `X` 是负数，则返回它的负数（即正数），否则返回\
  \ `X`。`MINUSP` 函数是一个内置的 LISP 函数，当其参数的值为负数时返回 `T`，否则返回 `NIL`。`MINUS` 是内置函数，返回其参数的负数。`COND`\
  \ 使用 `MINUSP` 来测试 `X`，如果 `X` 为负数，则调用 `MINUS`。如果 `MINUSP` 返回 `NIL`，则 `COND` 将测试 `T`（根据定义\
  \ `T` 为真），然后 `COND` 返回 `X`。\n\n`COND` 与大多数其他函数不同之处在于，它的参数不是表达式，而是表达式的列表。`COND` 的通用格式为：\n\
  \n```\n (COND (expression expression… expression)\n (expression expression… expression)\n\
  \ …\n (expression expression … expression))\n```\n\n这些列表有时被称为条件语句的“分支”（branches）。`COND`\
  \ 求值第一个分支中的第一个表达式。如果结果为真（即非 `NIL`），则 `COND` 求值该分支中剩余的表达式，并返回最后一个求值表达式的结果。在这种情况下，它不会评估任何其他分支。\n\
  \n然而，如果第一个分支中第一个表达式的值为 `NIL`，则 `COND` 会忽略该分支的剩余部分并进入下一个分支，测试该分支的第一个表达式，以此此类推。如果没有一个分支的第一个表达式为真，则\
  \ `COND` 返回 `NIL`。我们通常将最后一个分支的第一个表达式设置为 `T`，这意味着最后一个分支会捕获之前分支没有捕获到的任何内容。\n\n某些版本的\
  \ LISP 只允许在分支的测试后紧跟一个表达式。在这些 LISP 版本中，使用 `PROGN` 将多个表达式合并为一个。\n\n## 构建与使用列表\n\n\
  我们之前的 LISP 函数示例都是算术类的，但实际上这些函数并不是 LISP 中的核心函数。更重要的是构建和使用列表数据结构的函数。我们将通过一个扩展示例来展示这些函数是如何工作的。\n\
  \n首先，让我们进行以下赋值：\n\n```\n (SETQ ANIMALS ‘(DOG CAT PIG MULE))\n(SETQ EXOTICS ‘(LLAMA\
  \ AARDVARK WARTHOG))\n(SETQ PLANTS ‘(ROSE TOMATO GRASS))\n```\n\n`ANIMALS` 是一个包含四个标识符的列表，每个都是一种常见动物的名字。`EXOTICS`\
  \ 是一个不常见动物的列表，`PLANTS` 是一个常见植物的列表。注意，LISP 解释器并不真正了解狗或羊驼。它只是拥有上述带有给定标识符的列表。\n\n我们可以使用\
  \ `MEMBER` 函数来检查某物是否在列表中。例如，如果我们输入：\n\n```\n (MEMBER ‘PIG ANIMALS)\n```\n\n解释器将返回列表\
  \ `(PIG MULE)`。也就是说，它返回了列表中从 `PIG` 开始的那部分。如果我们输入：\n\n```\n (MEMBER ‘DOG ANIMALS)\n\
  ```\n\n那么将返回整个动物列表，因为 `DOG` 是列表中的第一个元素。但如果我们输入：\n\n```\n (MEMBER ‘HORSE ANIMALS)\n\
  ```\n\n解释器将返回原子 `NIL`，用于表示 `HORSE` 不在列表中。注意，我们没有对原子 `ANIMALS` 使用 `QUOTE`，因为我们要的是\
  \ `ANIMALS` 的值，而不是原子 `ANIMALS` 本。\n\n某些版本的 LISP 在元素于列表中时只返回 `T`。在这些情况下，你可能会发现定义另一个很有用，例如\
  \ `IN-LIST`，它的功能与上述函数相同。\n\n我们可以通过多种方式向 `ANIMALS` 列表添加内容。`CONS` 函数接受一个表达式和一个列表，并返回一个新列表，该列表包含旧列表以及位于前面的添加表达式。例如，为了创建一个包含马的动物列表，我们会输入：\n\
  \n```\n (CONS ‘HORSE ANIMALS)\n```\n\n这将返回列表 `(HORSE DOG CAT PIG MULE)`。这并没有改变 `ANIMALS`\
  \ 列表。要更新 `ANIMALS`，我们需要输入：\n\n```\n (SETQ ANIMALS (CONS ‘HORSE ANIMALS))\n```\n\n\
  `(SETQ identifier (CONS expression identifier))` 是 LISP 程序中常见的表达式，等相当于列表构建中的“`X\
  \ = X + 1”。因此，我们定义了一个名为 `PUSH` 的特殊函数，它将元素添加到列表头部。通过 `PUSH`，我们可以通过以下表达式将马添加到动物列表：\n\
  \n```\n (PUSH ‘HORSE ANIMALS)\n```\n\n`PUSH` 在大多数 LISP 版本中不是内置的，因此将其定义放在本章的末尾。`PUSH`\
  \ 返回被添加的表达式，在本例中为 `HORSE`。\n\n`CONS`（以及 `PUSH`）的第二个参数应该是列表或原子 `NIL`（空列表）。如果你在 `NIL`\
  \ 上 `CONS` 一个表达式，你将得到一个包含该表达式的列表。例如：\n\n```\n (CONS ‘HORSE NIL)\n```\n\n返回列表 `(HORSE)`。\n\
  \n`APPEND` 函数用于合并两个列表。例如，将稀有动物与常见动物合并：\n\n```\n (SETQ ANIMALS (APPEND ANIMALS EXOTICS))\n\
  ```\n\n构造了列表 `(DOG CAT PIG MULE LLAMA AARDVARK WARTHOG)`。注意 `APPEND` 没有改变 `EXOTICS`\
  \ 的值。\n\n另一个函数是 `LIST`，它接受一个或多个参数并生成它们的列表。例如，我们可以制作植物：\n\n```\n (SETQ LIVING-THINGS\
  \ (LIST PLANTS))\n```\n\n这使得 `LIVING-THINGS` 变成列表 `(ROSE TOMATO GRASS)`。用于查看列表元素的两个基本函数是\
  \ `CAR` 和 `CDR`。`CAR` 返回列表的第一个元素。例如：\n\n```\n (CAR PLANTS)\n```\n\n返回 `ROSE`。\n\n\
  ```\n (CAR LIVING-THINGS)\n```\n\n返回 `(TOMATO GRASS)`。\n\n`CDR` 返回列表中第一个元素之后的部分。例如：\n\
  \n```\n (CDR PLANTS)\n```\n\n返回列表 `(TOMATO GRASS)`。\n\n```\n (CDR LIVING-THINGS)\n\
  ```\n\n返回列表 `(DOG CAT PIG MULE LLAMA AARDVARK WARTHOG)`。列表的 `CDR` 始终是一个列表（可能是空的）。一个常见的误解是认为\
  \ `CDR` 返回列表的下一个元素。它不是。要获取列表的第二个元素，请组合使用 `CAR` 和 `CDR`：\n\n```\n (CAR (CDR PLANTS))\n\
  ```\n\n返回 `TOMATO`。一个内置函数是 `CADR`，它的功能相同。也就是说，`(CADR PLANTS)` 返回 `TOMATO`。大多数版本的\
  \ LISP 都有这些函数 `CADR`（等于 `CDR` 后 `CAR`）、`CDDR`（等于两个 `CDR`）、`CADDR`（等于两个 `CDR` 后 `CAR`）以及以此此类推，直到某些解释器特定的限制，例如四个\
  \ `CAR` 和/或 `CDR`。\n\n只有一个元素的列表的 `CDR`（或两个元素的列表 `CDDR`，以此此类推）是空列表 `NIL`。也就是说：\n\n\
  ```\n (CDDDR PLANTS)\n```\n\n返回 `NIL`，因为 `PLANTS` 只有三个元素。\n\n注意 `CDR` 不会改变任何列表。要从\
  \ `ANIMALS` 中删除第一个元素，我们会输入：\n\n```\n (SETQ ANIMALS (CDR ANIMALS))\n```\n\n这种将列表设置为其\
  \ `CDR` 的形式是 `CONS` 的一种反向操作。`POP` 函数执行类似的操作。也就是说：\n\n```\n (POP ANIMALS)\n```\n\n\
  从 `ANIMALS` 中删除第一个元素。区别在于 `CDR` 返回剩余的列表，而 `POP` 返回被移除的元素。`POP` 在大多数 LISP 版本中不是内置的，因此我们将其定义放在本章的末尾。\n\
  \n\n\n\n\n`CAR`、`CDR`、`POP`、`PUSH` 等函数期望列表作为参数。要检查某个值是否为列表，我们可以使用 `ATOM` 和 `CONSP`\
  \ 函数。`ATOM` 函数接收一个参数，如果其参数是原子，则返回原子 `T`；如果其参数是列表，则返回 `NIL`。`CONSP` 几乎是 `ATOM` 的相反。如果其参数是原子，它返回\
  \ `NIL`；如果是列表，则返回参数本身。例如：\n\n```\n (ATOM ‘A) returns T\n(ATOM ‘(A)) returns NIL\n\
  (CONSP ‘A) returns NIL\n(CONSP ‘(A)) returns (A)\n```\n\n我们可以使用谓词 `EQUAL` 来判断两个表达式是否相同。`EQUAL`\
  \ 接收两个参数，如果它们的值相同则返回 `T`，否则则返回 `NIL`。例如：\n\n```\n (EQUAL 1 1) returns T\n(EQUAL\
  \ 1 2) returns NIL\n(EQUAL ‘(A B) ‘(A B)) returns T\n(EQUAL ‘(A B) ‘(B A)) returns\
  \ NIL\n```\n\n我们可以通过查看列表是否等于 `NIL` 来判断列表是否为空。例如，我们可以知道 `PLANTS` 只有三个元素，因为：\n\n```\n\
  \ (EQUAL (CDDDR PLANTS) NIL)\n```\n\n返回 `T`。由于我们经常想知道一个列表是否为空，`LISP` 有 `NULL` 函数。也就是说：\n\
  \n```\n (NULL (CDDDR PLANTS))\n```\n\n也返回 `T`。\n\n谓词 `NOT` 接收一个表达式，如果该表达式是 `NIL`\
  \ 则返回 `T`，如果不是 `NIL` 则返回 `NIL`。例如，我们可以这样定义 `CONSP`：\n\n```\n (DE CONSP (X) (NOT\
  \ (ATOM X]\n```\n\n由于 `NIL` 既是假又是空列表，事实证明 `NOT` 和 `NULL` 实际上只是同一个函数的两个名称。然而，在测试空列表时，使用\
  \ `NULL` 是更好的名称；而在测试某个谓词是否返回了假时，使用 `NOT` 是更好的名称。\n\n列表是表示事实的一种重要方式。另一种方法是将信息直接附加到标识符上。这是通过\
  \ `PUTPROP` 函数实现的。例如：\n\n```\n (PUTPROP ‘DOG 4 ‘NUMBER-OF-LEGS)\n```\n\n这为标识符 `DOG`\
  \ 保存了属性名 `NUMBER-OF-LEGS` 以及值 `4`。用 `PUTPROP` 保存的内容稍后可以用 `GET` 函数检索。例如：\n\n```\n\
  \ (GET ‘DOG ‘NUMBER-OF-LEGS)\n```\n\n如果已经执行了 `PUTPROP`，则返回数字 `4`。如果没有保存任何属性，则返回\
  \ `NIL`。属性名必须是标识符，属性只能与标识符一起保存。保存的值可以是任何表达式。属性非常方便，特别是当有很多关于许多标识符的事实需要保存时。例如，我们版本的\
  \ `LISP` 使用属性来存储函数定义和变量值。\n\n# 迭代\n\n我们已经看到了如何定义函数和放入条件分支。我们需要知道的另一个基础知识是如何进行循环，即如何导致某些表达式求值，直到某个条件变为真。\n\
  \n### 递归\n\n`LENGTH` 是一个内置函数，接收一个列表并返回其长度——即列表中包含多少元素。我们可以用以下方式定义它：\n\n```\n (DE\
  \ LENGTH (L)\n (COND ((NULL L) 0)\n (T (PLUS 1 (LENGTH (CDR L]\n```\n\n为了看到它是如何工作的，假设我们用列表\
  \ `(A B)` 调用 `LENGTH`。`L` 被设置为 `(A B)`，所以 `(NULL L)` 为假。这意味着 `LENGTH` 返回 1 加上 `L`\
  \ 的 `CDR` 的长度，即 `(B)`。为了计算这个值，再次调用 `LENGTH`，此时 `L` 被设置为 `(B)`。同样 `L` 不空，所以 `(B)`\
  \ 的长度是 1 加上 `L` 的 `CDR` 的长度，即 `NIL`。在 `L` 设置为 `NIL` 时调用 `LENGTH`，这意味着 `LENGTH` 返回零。由于\
  \ `(B)` 的长度是 1 加 0，所以 `(B)` 的长度是 1。由于 `(A B)` 的长度是 1 加上 `(B)` 的长度，所以 `(A B)` 的长度是二。\n\
  \n上面的定义被称为*递归*定义，因为 `LENGTH` 的定义引用了 `LENGTH`。递归通常被认为是一种奇特的技术，但不应如此。事实上，它通常是执行某些任务最合适的方法。然而，递归确实需要适应。如果你以前从未尝试过递归定义，请尝试一下。一些可以尝试递归定义的良好函数有\
  \ `MEMBER`、`APPEND`、`LAST` 和 `REVERSE`。它们在参考章节中都有描述。\n\n### 循环\n\n定义 `LENGTH` 函数的另一种方法是使用\
  \ `LOOP` 函数。大多数 `LISP` 版本并没有内置 `LOOP`。因此我们在本章末尾包含了它的定义。使用 `LOOP`，`LENGTH` 的定义如下：\n\
  \n```\n (DE LENGTH (L)\n (LOOP (INITIAL COUNT 0)\n (WHILE L)\n (DO (SETQ COUNT (PLUS\
  \ 1 COUNT))\n (POP L))\n (RESULT COUNT]\n```\n\n这个定义表示，当 `L` 不是 `NIL`（即不空）时，计数器加\
  \ 1 并从 `L` 中移除一个元素。计数器初始化为零，所以最后计数器设置为列表的长度。计数器作为 `LOOP` 的值返回并作为 `LENGTH` 的值。`LOOP`\
  \ 和 `COND` 一样，接收表达式列表作为参数。对于 `LOOP`，每个列表以一个关键字开头，说明 `LOOP` 对列表剩余表达式应该做什么。在上面的定义中，`INITIAL`\
  \ 表示 `COUNT` 是一个局部变量。谓词 `NOT` 接收一个表达式，如果该表达式是 `NIL` 则返回 `T`，如果不是 `NIL` 则返回 `NIL`。例如，我们可以定义\
  \ `CONSP` 为：\n\n```\n (DE CONSP (X) (NOT (ATOM X\n```\n\n由于 `NIL` 既是假又是空列表，结果 `NOT`\
  \ 和 `NULL` 真的只是同一个函数的两个名称。然而，测试空列表时使用 `NULL` 是更好的名称，而在测试某个谓词是否返回了假时，使用 `NOT` 是更好的名称。列表是表示事实的一种重要方式。另一种方法是将信息直接附加到标识符上。这是通过\
  \ `PUTPROP` 函数实现的。例如：\n\n```\n (PUTPROP ‘DOG 4 ‘NUMBER-OF-LEGS)\n```\n\n为标识符 `DOG`\
  \ 保存了属性名 `NUMBER-OF-LEGS` 以及值 `4`。用 `PUTPROP` 保存的内容稍后可以用 `GET` 函数检索。例如：\n\n```\n\
  \ (GET ‘DOG ‘NUMBER-OF-LEGS)\n```\n\n如果已经执行了 `PUTPROP`，则返回数字 `4`。如果没有保存任何属性，则返回\
  \ `NIL`。属性名必须是标识符，属性只能与标识符一起保存。保存的值可以是任何表达式。属性非常方便，特别是当有很多关于许多标识符的事实需要保存时。例如，我们版本的\
  \ `LISP` 使用属性来存储函数定义和变量值。\n\n我们已经看到了如何定义函数和放入条件分支。我们需要知道的另一个基础知识是如何进行循环，即如何导致某些表达式求值，直到某个条件变为真。\n\
  \n### 递归\n\n`LENGTH` 是一个内置函数，接收一个列表并返回其长度——即列表中包含多少元素。我们可以用以下方式定义它：\n\n```\n (DE\
  \ LENGTH (L)\n (COND ((NULL L) 0)\n (T (PLUS 1 (LENGTH (CDR L]\n```\n\n为了看到它是如何工作的，假设我们用列表\
  \ `(A B)` 调用 `LENGTH`。`L` 被设置为 `(A B)`，所以 `(NULL L)` 为假。这意味着 `LENGTH` 返回 1 加上 `L`\
  \ 的 `CDR` 的长度，即 `(B)`。为了计算这个值，再次调用 `LENGTH`，此时 `L` 被设置为 `(B)`。同样 `L` 不空，所以 `(B)`\
  \ 的长度是 1 加上 `L` 的 `CDR` 的长度，即 `NIL`。在 `L` 设置为 `NIL` 时调用 `LENGTH`，这意味着 `LENGTH` 返回零。由于\
  \ `(B)` 的长度是 1 加 0，所以 `(B)` 的长度是 1。由于 `(A B)` 的长度是 1 加上 `(B)` 的长度，所以 `(A B)` 的长度是二。\n\
  \n上面的定义被称为*递归*定义，因为 `LENGTH` 的定义引用了 `LENGTH`。递归通常被认为是一种奇特的技术，但不应如此。事实上，它通常是执行某些任务最合适的方法。然而，递归确实需要适应。如果你以前从未尝试过递归定义，请尝试一下。一些可以尝试递归定义的良好函数有\
  \ `MEMBER`、`APPEND`、`LAST` 和 `REVERSE`。它们在参考章节中都有描述。\n\n### 循环\n\n定义 `LENGTH` 函数的另一种方法是使用\
  \ `LOOP` 函数。大多数 `LISP` 版本并没有内置 `LOOP`。因此我们在本章末尾包含了它的定义。使用 `LOOP`，`LENGTH` 的定义如下：\n\
  \n```\n (DE LENGTH (L)\n (LOOP (INITIAL COUNT 0)\n (WHILE L)\n (DO (SETQ COUNT (PLUS\
  \ 1 COUNT))\n (POP L))\n (RESULT COUNT]\n```\n\n这个定义表示，当 `L` 不是 `NIL`（即不空）时，计数器加\
  \ 1 并从 `L` 中移除一个元素。计数器初始化为零，所以最后计数器设置为列表的长度。计数器作为 `LOOP` 的值返回并作为 `LENGTH` 的值。`LOOP`\
  \ 和 `COND` 一样，接收表达式列表作为参数。对于 `LOOP`，每个列表以一个关键字开头，说明 `LOOP` 对列表剩余表达式应该做什么。在上面的定义中，`INITIAL`\
  \ 表示 `COUNT` 是一个局部变量。\n\n### For\n\n虽然 `LOOP` 足够通用可以处理所有迭代，但当我们想要对每个元素做相同的事情时，它显得有些笨拙，如果我们想要保存对每个元素进行操作的结果，它就会非常笨拙。例如，假设我们有一个数字列表并并创建一个负数列表。如果我们调用函数\
  \ `SIGNUM`，那么 `LOOP` 版本将是：\n\n```\n (DE SIGNUM (L)\n (LOOP (INITIAL R NIL)) (WHILE\
  \ L)\n (DO (SETQ X (POP L))\n (PUSH (COND ((MINUSP X) −1)\n ((EQUAL X 0) 0)\n (T\
  \ 1))\n R))\n (RESULT R)))\n```\n\n然而，有一种更简单（通常也更快）的方法来实现。`FOR` 函数专门设计用于对列表中的每个元素求值，并在需要时保存选定的结果。`SIGNUM`\
  \ 的 `FOR` 版本将是：\n\n```\n (DE SIGNUM (L)\n (FOR (X IN L)\n (SAVE (COND ((MINUSP X)\
  \ −1)\n ((EQUAL X 0) 0)\n (T 1)))))\n```\n\n`COND` 表达式仍然相同，但 `FOR` 处理所有其他事情。子表达式“(X\
  \ IN L)” 告诉 `FOR` 将 `X` 设置为 `L` 的每个元素。我们不需要使用 `POP` 或 `CAR` 或 `CDR`。`(SAVE …)` 告诉\
  \ `FOR` 将结果保存到列表中。\n\n当我们想要遍历列表并在仅当某个测试为真时执行某些操作时，`FOR` 循环变得更加有用。我们通过 `WHEN` 关键字来实现。例如，假设我们想要一个接收数字列表并返回负数列表的函数。如果我们调用函数\
  \ `NEGATIVES`，那么一种编写方法是：\n\n\n\n\n\n```\n (DE NEGATIVES (L)\n (FOR (X IN L)\n (WHEN\
  \ (MINUSP X))\n (SAVE X)))\n```\n\n注意，我们不需要 `COND`。`WHEN` 关键字表示当 `X` 小于 0 时，保存 `X`。如果\
  \ `L` 没有负数元素，则结果为 `NIL`。（作为一个练习，请尝试使用 `LOOP` 编写这个函数）。\n\n除了 `SAVE` 之外，我们还可以使用关键字\
  \ `DO`。`DO` 告诉 `FOR` 忽略结果并直接返回 `NIL`。例如，为了打印数字列表中每个元素的平方，而不必去保存任何内容，我们可以写道：\n\n\
  ```\n (FOR (X IN L)\n (DO (PRINT (TIMES X X))))\n```\n\n我们可以结合 `WHEN` 与 `DO` 使用来控制求值。因此，为了只打印负数的平方，我们可以写：\n\
  \n```\n (FOR (X IN L)\n (WHEN (MINUSP X))\n (DO (PRINT (TIMES X X))))\n```\n\n`FOR`\
  \ 还有一种特殊用法。`EXISTS` 关键字不应与 `WHEN`、`DO` 或 `SAVE` 一起使用，它告诉 `FOR` 只要列表中的某个元素 `EXISTS`\
  \ 后面的表达式不是 `NIL`，就停止处理。`FOR-EXISTS` 返回从该元素开始的列表。这主要用于测试列表中是否有元素符合特定条件，而无需遍历整个列表。例如，如果列表中至少有一个元素是负数，以下表达式将返回真值：\n\
  \n```\n (FOR (X IN L)\n (EXISTS (MINUSP X)))\n```\n\n注意：在 `DO`、`WHEN`、`SAVE` 或 `EXISTS`\
  \ 之后可以有多个表达式。表达式从左到右求值，并使用最后一个表达式的值。\n\n`FOR` 循环的通用格式为：\n\n```\n (FOR (identifier\
  \ IN list)\n (WHEN expression expression…)\n (<keyword> expression expression…))\n\
  ```\n\n其中 `<keyword>` 是 `DO` 或 `SAVE`。`WHEN` 可以省略，在这种情况下另一种可能的 `<keyword>` 是 `EXISTS`。\n\
  \n`FOR` 并不是大多数版本 `LISP` 的内置函数。因此，我们在本章末尾包含了它的定义。\n\n## 参考章节\n\n现在我们来简要回顾一下更重要的 `LISP`\
  \ 函数。函数以表达式格式给出。除非另有说明，否则所有参数在调用函数时都会进行求值。参数列表三个点表示可以提供任意数量的参数。大写表示必须包含的内容，小写表示函数的参数。函数按字母顺序列出。\n\
  \n\n\n\n\n```\n(AND expression expression… )\n`AND` 从左到右评估表达式。如果其中一个返回 `NIL`，则 `AND`\
  \ 停止评估并返回 `NIL`。否则，`AND` 返回最后一个表达式的值。注意：在某些版本的 LISP 中，`AND` 只返回 `T` 或 `NIL`。\n\n\
  (APPEND list list…)\n 每个参数都应该是一个列表。`APPEND` 返回由这些列表连接而成的列表。例如\n`(APPEND ‘(A B) ‘(C\
  \ D) ‘(E F))` 返回 `(A B C D E F)`\n\n(CONS-END list expression)\n 这返回一个将表达式添加到末尾的列表副本。它在大多数\
  \ LISP 版本中并不是内置的，因此我们在本章的末尾包含了它的定义。\n\n(APPLY name list)\n 第一个参数应该是函数的名称，列表的长度应与该函数所需的参数数量相同。该函数以列表中的参数进行调用。例如\n\
  `(APPLY ‘CONS (LIST 1 ‘(2 3)))` 返回 `(1 2 3)`\n\n(ASSOC identifier list)\n 第二个参数应该是一个对的列表，例如\
  \ `((A B) (CD)…)`。`ASSOC` 返回第一个 `CAR` 等于标识符的对。如果没有找到，则返回 `NIL`。\n\n(ATOM expression)\n\
  \ 如果表达式是标识符、数字或字符串，则返回 `T`，否则返回 `NIL`。\n\n(CAR list)\n `CAR` 返回列表的第一个元素。\n\n(CDR\
  \ list)\n `CDR` 返回减其第一个元素的列表。\n\n(COND (expression expression … expression)\n (expression\
  \ expression… expression)\n …\n (expression expression… expression))\n `COND` 是分支函数。它在本章的第一部分进行了详细描述。\n\
  \n(CONS expression list)\n `CONS` 返回一个以表达式开始并以第二个参数的元素继续的列表。\n\n(CONSP expression)\n\
  \ `CONSP` 如果表达式不是原子，则返回该表达式，否则返回 `NIL`。\n\n(DE name (list of identifiers) expression\
  \ expression …)\n `DE` 定义函数。它在介绍部分进行了描述。返回 `Name`。\n\n(DEFPROP identifier expression\
  \ identifier)\n 所有参数都不被评估。表达式被存储在第一个标识符下，属性由第二个标识符命名。第一个标识符被返回。\n\n(DF name (identifier)\
  \ expression expression…)\n 这定义了一个不评估其参数的函数。注意，只给了一个标识符作为局部变量。当函数被调用时，该标识符被设置为按调用顺序出现的参数列表。函数随后可以根据意愿评估它们或不评估。例如，我们可以这样定义\
  \ `DEFPROP`：\n`(DF DEFPROP (L) (PUTPROP (CAR L) (CADR L) (CADDR L)))`\n\n(DIFFERENCE\
  \ number number…)\n `DIFFERENCE` 返回第一个数字减去其余数字的和。\n\n(DM name (identifier) expression\
  \ expression…)\n 这定义了一个名为<宏>宏>的函数。像 `DF` 一样，该函数不评估其参数。然而，有两个重要的区别。首先，标识符被设置为整个表达式，而不仅仅是参数列表。其次，该函数的结果会被\
  \ LISP 解释器评估两次。通常宏构建另一个你实际想要评估的表达式。在本章末尾，有 `FOR`、`LET`、`LOOP`、`POP` 和 `PUSH` 的宏定义。宏非常有用，尽管遗憾并不是所有的\
  \ LISP 版本都拥有它们。\n\n(DRM character (LAMBDA () expression expression…))\n 这是一个定义<读写宏>的函数。`readmacro`\
  \ 不是函数，而是一个字符，LISP 解释器在读取它时将其扩展为表达式。也就是说，该字符变成了更长表达式的简写。`readmacro` 的值是通过从左到右评估\
  \ `LAMBDA` 主体中的表达式并返回最后一个的值来构造的。例如，微程序频繁使用 `*VAR* identifier` 形式，因此它们定义 `?` 为读写宏，使得\
  \ `?X` 在读取时变为 `(*VAR* X)`。这是通过实现的：\n`(DRM ? (LAMBDA () (LIST ‘*VAR* (READ))))`\n\
  当 LISP 解释器读取 `?` 时，readmacro 再读取一个表达式并返回列表 `(*VAR* expression)`。对于 LISP 解释器来说，这就像我们输入了\
  \ `*VAR*` 形式一样。并不是 LISP 版本都有读写宏。如果你的版本没有，那么每当我们使用它们时，你必须编写等效的长格式。\n\n(EQUAL expression\
  \ expression)\n 如果两个表达式看起来相同，则返回 `T`，否则返回 `NIL`。\n\n(EVAL expression)\n 这评估该表达式。例如：\n\
  `(EVAL ‘(PLUS 1 2))` 返回 `3`。\n\n(EXPLODE expression)\n 这返回打印表达式时使用的字符列表。它主要用于获取标识符中的字母。例如\n\
  `(EXPLODE ‘ATOM)` 返回 `(A T O M)`。\n\n(FOR (identifier IN list)\n (WHEN expression\
  \ expression…)\n (<keyword> expression expression…)) 其中 `<keyword>` 是 `DO` 或 `SAVE`。`WHEN`\
  \ 可以省略，在这种情况下另一个可能的 `<keyword>` 是 `EXISTS`。这是一个迭代函数，当 `WHEN` 表达式为真时，它评估 `<keyword>`\
  \ 之后的表达式，标识符设置为列表的后续元素。这在本章的第一部分描述。\n\n(GET identifier identifier)\n `GET` 返回由第二个标识符命名的属性下的第一个标识符的值。如果没有找到，则返回\
  \ `NIL`。\n\n(LAST list)\n `LAST` 返回列表的最后一个元素。\n\n(LENGTH list)\n `LENGTH` 返回列表中的元素数量。\n\
  \n(LET (identifier expression identifier…)\n expression expression… )\n 将第一个参数中的标识符变为局部变量，并将每个赋值给随其后的表达式。然后从左到右评估第一个参数之后的表达式。返回最后一个评估的表达式的值。例如，\n\
  `(LET (X 1 Y 2) (MSG T “X is “ X “ and Y is ” Y) (LIST X Y))` 会打印“X is 1 and Y is\
  \ 2”并返回列表 `(1 2)`。\n\n(LIST expression...) 创建表达式列表。\n\n(LOOP (INITIAL identifier\
  \ expression expression…)\n (WHILE expression)\n (DO expression…)\n (UNTIL expression)\n\
  \ (RESULT expression))\n 这在介绍部分详细描述。`INITIAL` 子初始化变量。当 `WHILE` 表达式为真时，重复评估 `DO`\
  \ 表达式。循环停止时，评估并返回 `RESULT` 表达式。\n\n(MEMBER expression list)\n `MEMBER` 返回列表中以表达式开头的部分（如果有）；否则返回\
  \ `NIL`。\n\n(MINUS number)\n `MINUS` 返回数字的负数。\n\n(MINUSP number)\n `MINUSP` 如果数字为负数，则返回\
  \ `T`；否则返回 `NIL`。\n\n(MSG form…)\n `MSG` 用于格式化打印。它接受三种类型的参数。标识符 `T` 导致开始新行。直接打印字符串（不带引号）。评估其他表达式并打印值。例如，如果\
  \ `X` 被设置为 14，`Y` 被设置为 28，那么\n`(MSG T “The sum of “ X “ and Y is ” Y) (PLUS X Y))`\
  \ 会打印“The sum of 14 and 28 is 42”。`MSG` 总是返回 `NIL`。如果你的 LISP 版本没有 `MSG`，你可以用 `DF`\
  \ 定义它，或者使用一系列 `PRINT` 语句。\n\n(NOT expression)\n 如果表达式为 `NIL`，则返回 `T`；否则返回 `NIL`。这只是\
  \ `NULL` 函数。\n\n(NUMBERP expression)\n 如果表达式是数字，则返回 `T`；否则返回 `NIL`。\n\n(NULL expression)\n\
  \ 如果表达式为 `NIL`，则返回 `T`；否则返回 `NIL`。\n\n(OR expression expression…)\n `OR` 从左到右评估表达式。如果其中一个返回不是\
  \ `NIL` 的值，则 `OR` 停止评估并返回它。否则，`OR` 返回最后一个表达式的值。注意：在某些 LISP 版本中，`OR` 只返回 `T` 或 `NIL`。\n\
  \n(PLUS number number…)\n `PLUS` 返回数字的和。\n\n(POP identifier)\n 标识符的值应该是列表或 `NIL`。`POP`\
  \ 从列表中移除第一个元素，改变标识符的值。返回第一个元素。\n\n(PRINT expression)\n `PRINT` 打印表达式并返回它。\n\n(PROG1\
  \ expression expression …\n `PROG1` 接受最多五个参数，所有参数都被评估，并返回第一个的值。参见宏 `POP` 的定义。\n\n\
  (PROGN expression expression…)\n `PROGN` 接受任意数量的参数，所有参数都被评估，并返回最后一个的值。`PROGN` 特别适用于\n\
  \n(PUSH expression identifier)\n 标识符的值应该是列表或 `NIL`。`PUSH` 将表达式添加到列表头部，改变标识符的值。\n\
  \n(QUOTE expression)\n `QUOTE` 返回未评估的表达式。当输入单引号（'）时，是同一个函数。\n\n(READ)\n `READ` 不接受参数。当评估时，它导致解释器从输入设备读取一个表达式。\n\
  \n(REMOVE expression list)\n `REMOVE` 返回列表中所有等于表达式的元素。\n\n(REPROP identifier identifier)\n\
  \ 由第二个标识符命名的属性（以及存储在其下方的任何值）被移除。如果有该属性，`REPROP` 返回 `T`；否则返回 `NIL`。\n\n(REVERSE list)\n\
  \ `REVERSE` 返回一个新列表，其元素顺序与旧列表相反。\n\n(SUBST expression expression list)\n `SUBST`\
  \ 复制列表，但列表中只要出现第二个表达式，就使用第一个表达式。也就是说，第一个表达式替换列表中的第二个表达式。这种替换发生在列表的所有层级，而不仅仅是顶层。例如：`SUBST\
  \ ′Y ′X ′(DE FN (X) (CAR X)))` 返回 `(DE FN (Y) (CAR Y))`。\n\n(TIMES number number…)\n\
  \ `TIMES` 返回数字的乘积。\n\n(ZEROP number)\n 如果数字为零，则返回 `T`；否则返回 `NIL`。\n```\n\n\n\n\n\
  # Lisp 中的概念依赖（Conceptual Dependency）\n\n所有的微程序都使用了前几章节描述的概念依赖表示系统。它们在 `LISP` 中为概念依赖形式编码时都使用相同的格式，并且共享了一些用于构建和使用这些形式的函数。\n\
  \n### LISP 中的 CD 形式\n\n本文中的微程序都使用相同的语法来表示概念依赖表达式。一个 CD 表达式的格式如下：\n\n```\n (predicate\
  \ (role filler) (role filler)… )\n```\n\n其中，`predicate`（一个标识符）是核心动作、状态或原因；`roles`（也是标识符）为动作、状态或原因的槽位命名。`fillers`（可以是标识符，也可以是整个\
  \ CD 表达式）填充这些槽位。例如，“约翰给了玛丽一本书”将被表示为：\n\n```\n (ATRANS (ACTOR (PERSON (NAME (JOHN))))\
  \ (OBJECT (BOOK))\n (TO (PERSON (NAME (MARY))))\n (FROM (PERSON (NAME (JOHN)))))\n\
  ```\n\n主谓词是 `ATRANS`。第一个角色对是：\n\n```\n (ACTOR (PERSON (NAME (JOHN))))\n```\n\n角色是\
  \ `ACTOR`，填充内容是 `(PERSON (NAME (JOHN)))`。该填充内容的谓词是 `PERSON`，它拥有角色对 `(NAME (JOHN))`，依此类推。\n\
  \n当涉及心理活动或因果关系时，一个或多个填充内容将是一个 CD，例如“约翰告诉玛丽比尔去了商店”：\n\n```\n (MTRANS (ACTOR (PERSON\
  \ (NAME (JOHN»))\n (OBJECT (PTRANS (ACTOR (PERSON (NAME (BILL))))\n (OBJECT (PERSON\
  \ (NAME (BILL))))\n (TO (STORE))))\n (TO (CP (PART (PERSON (NAME (MARY)))))))\n\
  ```\n\n角色名称的顺序并不重要，角色可以省略，这等同于为这些角色拥有 `NIL` 填充内容。\n\n### CD 模式\n\n判断 `LISP` 中的两个\
  \ CD 形式是否相同非常重要。`EQUAL` 函数对于这项任务是不够的，因为它会认为以下两个 CD 是不相同的：\n\n```\n (PTRANS (ACTOR\
  \ (PERSON)) (TO (STORE)))\n(PTRANS (TO (STORE)) (ACTOR (PERSON)))\n```\n\n但实际上它们是相同的，因为在\
  \ CD 中角色的顺序并不重要。因此，我们专门为 CD 定义了另一个函数，称为 `MATCH`。将 `MATCH` 应用于上述两个 CD 将返回真。事实上，`MATCH`\
  \ 非常宽泛。它认为 `(PERSON)` 匹配 `(PERSON (NAME (JOHN)))`，因为额外的角色并不重要。然而，`(PERSON (NAME\
  \ (JOHN)))` 不匹配 `(PERSON (NAME (MARY)))`，因为如果一个角色在两个 CD 中都存在，那么它们的填充内容必须匹配。\n\n\
  `MATCH` 的定义比比仅比较两个 CD 形式更灵活。它实际上是一个`模式匹配器`（pattern matcher），它接收一个 CD `pattern`（模式）和一个普通的\
  \ CD，并判断它们是否匹配。一个 CD 模式是一个包含 `pattern variables`（模式变量）的 CD 形式。模式变量由形式为 `(*VAR* identifier)`\
  \ 的配对指示。当 `MATCH` 比较模式和普通 CD 时，它允许模式中的变量匹配 CD 中对应位置上的任何内容。例如，`MATCH` 认为以下模式和 CD\
  \ 是匹配的：\n\n```\n (PTRANS (ACTOR (*VAR* X)) (TO (STORE)))\n(PTRANS (ACTOR (PERSON))\
  \ (TO (STORE)))\n```\n\n由于模式变量被频繁使用，我们定义问号为一种 `readmacro`，使得 `\"?identifier\"` 返回\
  \ `“(*VAR* indentifier)”`。因此，我们可以这样写上面的模式：\n\n```\n (PTRANS (ACTOR ?X) (TO (STORE)))\n\
  ```\n\n必须记住，实际的变量名只是标识符，而不是 `\"?identifier\"`。问号用于告诉 `MATCH` 变量存在那里，但问号本身不是变量名的一部分。\n\
  \n当 `MATCH` 发现模式匹配 CD 时，它会返回一个格式如下的列表：\n\n```\n (T (variable value) (variable value)…)\n\
  ```\n\n这表示匹配已发生，模式中的变量已匹配到 CD 中对应的值。将 `MATCH` 应用于上述模式和 CD 的结果将是：\n\n```\n (T (X\
  \ (PERSON)))\n```\n\n这表示模式匹配了 CD，变量 `X` 匹配到了 CD 形式 `(PERSON)`。注意，如果我们用一个普通 CD 匹配另一个普通\
  \ CD，那么成功匹配的结果将只是列表 `(T)`，因为没有变量。匹配失败总是返回 `NIL`。\n\n`MATCH` 返回的形式被称为 `binding list`（绑定列表），因为它提供了模式变量的绑定。`MATCH`\
  \ 在匹配模式和 CD 期间会使用此列表来强制执行规则：\n\n> 如果模式中的变量在绑定列表中，\n> 那么它只能匹配与其绑定的值相匹配的 CD。\n\n这意味着，如果同一个变量在模式中出现两次，那么该模式将只会匹配在两个地方出现相同填充内容的\
  \ CD。例如，模式：\n\n```\n (PTRANS (ACTOR ?X) (OBJECT ?X) (TO (STORE)))\n```\n\n将匹配：\n\
  \n```\n (PTRANS (ACTOR (PERSON)) (OBJECT (PERSON)) (TO (STORE)))\n```\n\n但不匹配：\n\
  \n```\n (PTRANS (ACTOR (PERSON)) (OBJECT (KITE)) (TO (STORE)))\n```\n\n因为在第二种情况下，`X`\
  \ 不能同时匹配 `PERSON` 和 `KITE`。\n\n### CD 函数\n\n```\n (FILLER:PAIR pair)\n```\n获取形式为\
  \ `(role filler)` 的配对并返回填充内容。\n\n```\n (FILLER:ROLE role CD)\n```\n在 CD 中查找形式为 `(role\
  \ filler)` 的配对并返回填充内容。如果没有此类配对，则返回 `NIL`。\n\n```\n (ROLES:CD CD)\n```\n返回 CD 形式中配对的列表。\n\
  \n```\n (HEADER:CD CD)\n```\n返回 CD 形式的主谓词。\n\n```\n (INSTANTIATE pattern binding-list)\n\
  ```\n接收一个 CD 模式和一个变量绑定列表，并返回一个所有变量（即 `(*VAR* identifier)` 形式）已被替换的普通 CD。如果模式中的变量不在绑定列表中，则它被替换为\
  \ `NIL`。\n\n```\n (IS-VAR CD)\n```\n如果 CD 是一个模式变量，则返回真。\n\n```\n (MATCH CD binding-list)\n\
  ```\n如果模式匹配 CD，则返回绑定列表并添加任何新绑定。如果匹配失败，则返回 `NIL`。`MATCH` 在上一节中进行了详细描述。\n\n```\n (NAME:VAR\
  \ pattern-variable)\n```\n接收形式为 `(*VAR* identifier)` 的模式变量并返回标识符。\n\n```\n (ROLE:PAIR\
  \ pair)\n```\n接收形式为 `(role filler)` 的配对并返回角色。\n\n```\n (SETROLE role filler CD)\n\
  ```\n返回 `CD` 的副本，并添加 `(role filler)` 配对。如果 CD 已经有了该角色的填充内容，则删除旧的配对。\n\n\n\n\n\n\
  ## 实现备注\n\n本节提供了不属于标准 LISP 版本的函数的 LISP 定义。如果你的 LISP 解释器支持宏定义（大多数优秀的 LISP 版本都是支持的），那么这些定义应该被包含在你想要运行的任何微程序中。如果你的\
  \ LISP 解释器不支持宏，但支持带有未求值参数的函数，则可以通过“向你的 LISP 解释器添加宏”章节中的函数来模拟宏。如果即使这样也不可行，你也应该将宏定义作为指南，通过修复微程序中的代码以便能够运行它们。\n\
  \n### LISP 中的底层函数\n\n以下函数用于实现 `FOR`、`LOOP` 和 `LET`。它们在微程序中并没有被显式地使用。我们发现，如果学生不需要学习这些内容，学习\
  \ LISP 编程的速度会快得多。\n\n```\n (FUNCTION expression)\n FUNCTION 等同于 `QUOTE`，但当表达式为函数名或\
  \ `LAMBDA` 形式时使用，用于告诉 LISP 该表达式可以编译（针对那些拥有编译器的 LISP 版本）。\n((LAMBDA (identifier identifier…)\
  \ expression expression…)\n arg-expression arg-expression …)\n 这等同于\n (LET (identifier\
  \ arg-expression identifier arg-expression…)\n expression expression…)\n(MAPC (FUNCTION\
  \ (LAMBDA (identifier) expression expression…))\n list)\n 这等同于\n (FOR (identifier\
  \ IN list)\n (DO expression expression…))\n(MAPCAR (FUNCTION (LAMBDA (identifier)\
  \ expression expression…))\n list)\n 这等同于\n (FOR (identifier IN list)\n (SAVE expression\
  \ expression…))\n(MAPCAN (FUNCTION (LAMBDA (identifier) expression expression…))\n\
  \ list)\n MAPCAN 类似于 MAPCAR，但它会将结果追加到列表中。例如，\n (FOR (X IN L) (WHEN (FOO X)) (SAVE\
  \ (BAZ X)))\n 等同于\n (MAPCAN (FUNCTION (LAMBDA (X)\n (COND ((FOO X) (LIST (BA2 X))))))\n\
  \ L)\n 尽管后者并不清晰。\n(PROG (list of identifiers) expression expression …)\n 如果你熟悉 ALGOL\
  \ 或 PL/1，那么你应该将 `PROG` 视为一个块，包含局部变量、标签、GO-TO 和 RETURNS。LOOP 在执行之前会扩展为 `PROG` 形式。例如，这个\
  \ LOOP 形式：\n (LOOP (INITIAL X ‘(A B C))\n (WHILE X)\n (DO (PRINT X)\n (SETQ X (CDR\
  \ X))}\n (RESULT ‘DONE))\n 扩展为此 PROG 形式：\n (PROG (X)\n (SETQ X ‘(A B O)\n LOOP (OR\
  \ X (GO EXIT))\n (PRINT X)\n (SETQ X (CDR X))\n (GO LOOP)\n EXIT (RETURN ‘DONE))\n\
  \ `PROG` 的第一个参数是局部变量列表。当 `PROG` 开始时，它会将这些变量设置为 `NIL`。剩余参数是标识符或表达式。标识符是其后续表达式的标签。`PROG`\
  \ 按顺序评估非原子语句。如果评估了 `(GO identifier)`，`PROG` 将移动到紧随该标识符的表达式并从那里继续评估。如果评估了 `(RETURN\
  \ expression)`，`PROG` 立即停止，`PROG` 的值就是该表达式的值。如果评估了最后语句且没有 `RETURN`，则 `PROG` 的值为\
  \ `NIL`。\n(SOME (FUNCTION (LAMBDA (identifier) expression expression…))\n list)\n\
  \ 这等同于\n (FOR (identifier IN list)\n (EXISTS expression expression…))\n SOME 并不是在所有\
  \ LISP 版本都存在。如果你的 LISP 版本没有它，你应该使用 `LOOP` 函数代替。\n```\n\n### LOOP 的 LISP 定义\n\n`LOOP`\
  \ 函数的通用版本定义在 Chamiak 等人 (1980) 中。下面的版本稍简单，对于本文中的微程序来说足够。\n\n```\n `LOOP` 将来自 `LOOP`\
  \ 子句的片段组合在一起，形成一个 `PROG`\n体，形式为 (PROG (…)… LOOP… EXIT (RETURN…))\n(WHILE…) 变为 (OR…\
  \ (GO EXIT))\n(UNTIL…) 变为 (AND… (GO EXIT))\n(DM LOOP (L)\n (LOOP1 (CDR L)\n (GET-KEYWORD\
  \ ‘INITIAL L)\n (GET-KEYWORD ‘RESULT L]\n(DE L00P1 (CLAUSES l-BODY R-BODY)\n (APPEND\
  \ (LIST ‘PROG (VAR-LIST l-BODY))\n (SETQ-STEPS l-BODY)\n (CONS ‘LOOP (APPLY ‘APPEND\
  \ (MAPCAR DO-CLAUSE CLAUSES)))\n (LIST ‘(GO LOOP) ‘EXIT (CONS ‘RETURN R-BODY]\n\
  `GET-KEYWORD` 被 `LOOP` 和 `FOR` 同时使用——它返回表达式列表——注意：如果你的 LISP 版本说\n`(CDR NIL)` = `NIL`，那么\
  \ `LAMBDA` 可以替换为简单的\n`(CDR (ASSOC…))`\n(DE GET-KEYWORD (KEY L)\n ((LAMBDA (X) (CDR\
  \ X))\n (ASSOC KEY (CDR L)\n`DO-CLAUSE` 接收一个关键字子句并生成相应的代码——INITIAL Bnd RESULT 是分开处理的\n\
  (DE DO-CLAUSE (CLAUSE)\n (SELECTQ (CAR CLAUSE)\n ((INITIAL RESULT) NIL)\n(WHILE…)\
  \ 变为 (OR… (GO EXIT))\n(UNTIL…) 变为 (AND… (GO EXIT))\n(WHILE…) 变为 (OR… (GO EXIT))\n\
  (UNTIL…) 变为 (AND… (GO EXIT))\n```\n\n\n\n\n\nCD 形式在微程序中以 `(predicate role-pair role-pair…)`\
  \ 的形式表示。下面定义的函数用于从此数据结构中获取信息。函数名遵循由 Charniak 等人 (1980) 建立的规范：“x:y”形式的函数名意味着该函数应用于类型为“y”的数据结构，并返回类型为“x”的数据结构。例如，`ROLE.PAIR`\
  \ 应用于对（如 `(ACTOR JOHN)`），并返回角色，在此例中为 `ACTOR`。\n\n```\n <sup>-</sup>HEADER:CD 获取\
  \ CD 形式的头部（head）。\n<sup>-</sup>ROLES:CD 获取 CD 形式的角色对列表。\n(DE HEADER:CD (X) (CAR\
  \ X»X)\n(DE ROLES :CD (X) (CDR X))\n<sup>-</sup>角色对的格式为 (role filler)——`ROLE:PAIR`\
  \ 返回角色\n<sup>-</sup>而 `FILLER:PAIR` 返回填充符。\n(DE ROLE:PAIR (X) (CAR X))\n(DE FILLER:PAIR\
  \ (X) (CADR X))\n<sup>-</sup>某个角色的填充符通过在 CD 中查找角色名找到，\n<sup>-</sup>如果找到了该对，则返回填充符。\n\
  (DE FILLER:ROLE (ROLE CD)\n (LET (PAIR (ASSOC ROLE (ROLES:CD CD)))\n (AND PAIR (FILLER:PAIR\
  \ PAIR]\n<sup>-</sup>SETROLE 创建一个新的 CD 形式，添加或替换旧的\n<sup>-</sup>`(ROLE…)` 节点，包含 `(ROLE\
  \ FILLER)`。\n(DE SETROLE (ROLE FILLER CD)\n (CONS (HEADER :CD CD)\n (APPEND (FOR\
  \ (PAIR IN (ROLES:CD CD))\n (WHEN (NOT (EQUAL (ROLE:PAIR PAIR) ROLE)))\n (SAVE PAIR))\n\
  \ (LIST (LIST ROLE FILLER]\n<sup>-</sup>模式匹配器使用的变量以问号（“”）开头，\n<sup>-</sup>例如 `?FOO`。\n\
  <sup>-</sup>这在内部被转换为 `(*VAR* role-name)`，因此 `?FOO`\n 变为 `(*VAR* FOO)`。\n<sup>-</sup>DRM\
  \ 定义了 `?` 在读取时将其转换为 `*VAR*`。\n<sup>-</sup>在读取任何带有 `?` 的 CD 之前，必须评估此 DRM。\n<sup>-</sup>`IS-VAR`\
  \ 在 `X` 是变量时返回真。\n<sup>-</sup>`NAME:VAR` 返回变量的名称——例如，`(*VAR* FOO)` 的名称是 `FOO`。\n\
  (DRM `R` (LAMBDA (> (LIST “VAR* (READ]\n(DE IS-VAR (X) (AND (CONSP X) (EQUAL (CAR\
  \ X) “VAR*]\n(DE NAME:VAR (X) (AND (CONSP X) (CONSP (CDR X)) (CADR X]\n```\n\n###\
  \ 模式匹配器的 LISP 定义\n\n模式匹配器被除 `micro-Ell` 外的所有微程序使用。这是一个非常重要的函数，但如果你从未尝试过编写模式匹配器，它也很难理解。因此，除了\
  \ `MATCH` 的代码外，我们还包含了一个非正式流程图。你应该仔细阅读代码和注释，然后尝试在一些示例上手动执行 `MATCH`。\n\n```\n <sup>-</sup>MATCH\
  \ 取三个 `(predicate role-pair…)` 形式作为参数：\n<sup>-</sup>1) 一个可能包含变量的 CD 模式；\n<sup>-</sup>2)\
  \ 一个不包含变量的 CD 常量；\n<sup>-</sup>3) 一个绑定形式，指定模式中变量可能已经具有的绑定。\n<sup>-</sup> 绑定形式的谓词无关，因此使用了\
  \ `T`。\n<sup>-</sup> 为了方便，`MATCH` 同时也接受 `NIL` 作为绑定形式并\n<sup>-</sup>将其转换为 `(T)`，这是一个没有绑定变量的绑定形式。\n\
  `MATCH` 仅在匹配失败时返回 `NIL`。成功但未涉及变量的匹配返回 `(T)`。\n<sup>-</sup>例如，如果参数为\npattern = `(PTRANS\
  \ (ACTOR (*VAR* SHOPPER)) (TO (*VAR* STORE)))`\nconstant = `(PTRANS (ACTOR (PERSON))\
  \ (TO (STORE)))`\nbinding = `(T (SHOPPER (PERSON)) (STORE (STORE)))`\n那么模式中的变量是\
  \ `SHOPPER` 和 `STORE`，且绑定形式表明这些变量被绑定到 `PERSON` 和 `STORE`。\n如果谓词相等且模式中的所有角色都被常量中的角色匹配，则模式匹配该常量——如果变量的绑定相匹配，则视为视为匹配；\n\
  —常量中不在模式中的角色将被忽略。\n`MATCH` 在匹配失败时返回 `NIL`，或者返回一个更新后的绑定形式，\n其中包含了可能产生的任何新变量绑定。\n\
  `NIL` 常量总是匹配的——这意味着模式\n`(PERSON (NAME (JACK)))` 匹配常量 `(PERSON)`，即使 `MATCH` 返回了 `NIL`。\n\
  ```\n <sup>-</sup>MATCH (X) (AND (CONSP X) (EQUAL (CAR X) “VAR*]\n<sup>-</sup>NAME:VAR\
  \ (X) (AND (CONSP X) (CONSP (CDR X)) (CADR X]\n\n\n\n\n使用不常见的变量名是为了避免变量名冲突。上述代码意味着宏实际上是\
  \ `FEXPRs`，但其定义方式使得文中使用的所有其他函数（如 `EXPANDMACROS`）可以在不更改的情况下运行。\n\n# 5 Sam\n\nRichard\
  \ Cullingford\n\nDOI: [10.4324/9780203728147-5](https://dx.doi.org/10.4324/9780203728147-5)\n\
  \n## 引言\n\nSAM（脚本应用机制，Script Applier Mechanism）是一套用于研究如何利用上下文知识来帮助理解故事的计算机程序。SAM\
  \ 应用的基础知识源是脚本。通过使用不同复杂度的脚本，SAM 不仅阅读（通过脚本应用的过程）简单的故事，还能阅读涉及如交通事故和国事访问等不同领域的报纸文章。每一种类型的文本都涉及某些不变的组件，例如可能发生什么、事情发生的顺序以及参与的人员。这种形式和内容的一致性使得基于脚本的阅读模型得以应用。\n\
  \n构建 SAM 的原因既有实用考虑，也有理论考虑。首先，当然我们对一个功能完备的故事理解器有实际需求。在 SAM 开始开发时（1975 年中期），还没有任何能够“智能地”阅读故事的运行程序，尽管已经提出了几项理论建议（例如\
  \ Chamiak 在 1972 年的“恶魔”模型和 1978 年的故事理解“框架”模型）。然而，已经存在概念分析器 ELI（英语解释器，Riesbeck and\
  \ Schank, 1977）和 BABEL（概念依赖转英语生成器，Goldman, 1975）。这两个程序都被整合到了 SAM 中。\n\n虽然我们清楚脚本应用并不是解决故事理解问题的方案，但所得程序成功地模拟了人类阅读的某些关键方面。SAM\
  \ 以“从左到右”的方式一次处理一个句子，遍历处理英文故事，并在过程中进行许多必要的推理。随后，它可以通过生成故事的英文或其他自然语言摘要或改写，并通过回答关于故事的问题，来证明它对所读内容达到了合理的理解深度。\n\
  \nSAM 中的脚本是带有`转折点`（turning-points）的`片段`（episodes）集合。片段是连接成`因果链`（causal chains）的事件集合。每个事件导致一个或多个状态，这些状态又引发进一步的事件。转折点是脚本中可能跟随不同动作的地方。例如，在餐厅中，人们可以坐下也可以等员工带去座位。转折点还包括“干扰”和“解决”活动，在这些活动中，动作流略微偏离“常常”。例如，当有人到达餐厅时，所有桌子可能都满了（餐厅脚本中的一种干扰），但顾客可能会选择等直到桌子空出来（一种解决）。\n\
  \n在处理报纸文章中复杂的复杂的活动时，我们需要一种组织 Schank 和 Abelson 理论（Schank and Abelson, 1977）中简单脚本的方法，以便理解器根据需要访问它们。否则，理解器将面临被其拥有的大量相关脚本淹没的风险。组织简单脚本的实体被称为`情境`（situations）。每个情境以分层的方式提供对知识领域的访问，从最重要的活动到最详细的内容（DeJong\
  \ 的 1979“问题骨架”体现了类似的观点）。例如，SAM 包含了关于交通事故、国事访问和漏油泄漏的情境。人们阅读每种类型的故事是为了寻找截然不同的信息。在交通事故故事中，我们通常想先找出是否有人遇难或受伤，然后警察做了什么，最后是财产损失的程度。关于漏油泄漏的故事虽然也从“事故”开始，但它们会导致另一组不同的问题：是否有油泄漏了？如果是，漏了多少？哪些海滩、植物和动物受到了泄漏的威胁？\n\
  \n情境内部的事件排序由`工具性`（instrumentality）概念支配。某些事件或动作的执行仅是为了支持或实施更重要、更高层次的活动的手段。以一个名为“旅行”的非常普通的情境为例，这是一个非常简单的例子。启动汽车（一个非常僵化、简单的脚本）是开车（一个稍微复杂的脚本）的前决条件。开车反过来又是各种类型旅行的可能“工具”，因为人们可以使用它到达一个可以发生更重要活动的地方。“旅行”本身（非常灵活、高层的脚本）可能涉及去商店、度假或出差，或者（对于贵宾来说）进行国事访问。\n\
  \n脚本应用过程涉及几种推理。SAM 以自上而下的预测方式阅读故事。每个脚本都根据已经看到的内容，对将读的内容提供预存的预期。我们识别出三种重要的推理类型：因果链完成、角色实例化（role\
  \ instantiation）和角色合并（role merging）。因果链完成指的是推理故事中显式提到的两个事件之间必须发生的中间事件的过程，这种方式保持了`因果`和`情境`的连续性。角色实例化是指将特定的引用分配给脚本中的变量，而角色合并则是识别多个引用何时指向同一个特定的角色填充值。接下来的示例将说明这三种不同类型的推理：\n\
  \n```\nJohn walked into a subway station. He went to the express platform.\n```\n\
  \n因果链完成推理使我们能够填充所有必须发生但在故事中未显式提到的事件。在这里，我们对地铁发生情况的知识告诉我们，在去平台之前（可能先从售员那里获得了代币）经过了闸机。我们假设他使用了楼梯或扶梯（即他不是魔法般飞到平台），我们从未考虑过他可能在票务处买票，就像乘坐火车那样。角色实例化推理导致我们把“John”与地铁脚本中的“乘客”角色联系起来，并“创建”了一个让他通过的闸机。角色合并推理使我们假设第二个句子中的“He”指的是\
  \ John，因为这个“他”正在做脚本预测乘客在该这一点会做的事，而且角色实例化已经建立了 John 是乘客。\n\nSAM 是一个基于预测的理解器，试图处理用“自然”英文表达的故事。我们在处理大量各种故事时学到的点之一，就是需要各种细微、不被人察觉的推理。这些推理是为了调和因果链的预期与真实输入之间的差异，因为后者往往以“不重要”的方式与这些预期不同。例如，假设我们有这样一个故事：\n\
  \n```\nJohn entered a movie theater, went over to the ticket counter, and asked\
  \ for a ticket.\n```\n\n\n\n\n这里的问题在于要识别出输入“……走向票务处”实际上有效地实例化了由因果链引发的预期，即“顾客前往`收银员`”。实例化这一预期所需的推理非常简单：位于同一物体附近的事物彼此也相互靠近（或邻近性的传递性）。SAM\
  \ 将这种推理与关于`收银员`角色的脚本信息（即“收银员站在柜台附近”）结合起来，从而得出结论：事实上“（约翰）走向了柜台”，并因此该预期得到了满足。\n\n\
  如上述概述所示，构建和组织好的脚本（Scripts），同在脚本应用过程中涉及的推理过程，似乎是任何在真实故事输入上以预测方式运行的“理解者”所必不可的组件。然而，除了作为特定类型文本的“理解者”具有内在兴趣外，SAM\
  \ 还为未来更通用的理解者必须执行的一种处理模式提供了模型。\n\n### 输入/输出示例\n\n以下输入和输出示例说明了 SAM 所实现的故事理解水平。在每个情况下，英语输入都由概念分析器\
  \ `ELI` 映射为概念依赖表示，而自然语言输出则由生成器 `BABEL` 创建。\n\n> **输入文本**：\n\n> 约翰去了一家餐厅。他点了一个热狗。服务员说他们没有热狗了。他又点了一个汉堡。当汉堡送来时，它已经焦了。他离开了餐厅。\n\
  \n> **问答输出**：\n\n> Q1: 约翰在餐厅里坐下了吗？\n> A1: 可能吧。\n> Q2: 约翰点了热狗吗？\n> A2: 是的。\n> Q3:\
  \ 约翰吃了热狗吗？\n> A3: 没有，服务员告诉约翰管理层无法提供热狗。\n> Q4: 服务员给约翰上了什么菜？\n> A4: 服务员给约翰上了一个汉堡。\n\
  > Q5: 约翰为什么没吃汉堡？\n> A5: 因为汉堡煎过头了。\n> Q6: 约翰结账了吗？\n> A6: 没有，约翰很生气，因为汉堡煎过头了，于是他离开了餐厅。\n\
  \n这个由 SAM 早期版本处理的故事，包含了简单脚本“去餐厅”所提供的“理解”能力的几个例子。在阅读这个故事时，SAM 通过脚本构建了一个“轨迹”或场景，其中不仅包含了被明确提到的事件，还包含了那些合理推断可能发生的事件。这种因果链补全推理的例子可以在问题\
  \ 1 的回答中看到，该问题询问了一个通常发生在顾客进入餐厅和点餐之间的事件。\n\n问题 4 还显示了 SAM `在语境中分析`（analyze in context）的能力。由于故事输入“（当）汉堡来时”被识别为指向“服务”事件。注意，角色合并推理已将“服务员”识别为该事件中的活动实体，因为汉堡显然不能自己移动。\n\
  \n在阅读故事时推断发生了什么之外，SAM 还能在`问答`（question-answering）时推理。这出现在关于未发生事件的问题中。在问题 3 中，预期的“吃”事件未发生被归于一个“干扰”条件：餐厅没有热狗了。同样，在问题\
  \ 5 和 6 中，SAM 推断出第二次“吃”的未发生以及随后顾客拒绝结账的原因是第二个“干扰”条件：汉堡焦了。（在 SAM 问答子系统 `QUALM` 中体现的理论由\
  \ Wendy Lehnert 开发，并描述在 Lehnert, 1978 中。）\n\n> **输入**：\n\n> 周五晚上，一辆车从 69 号公路冲出。该车辆撞上了一棵树。乘客一名新泽西男子去世。27\
  \ 岁的大卫·霍勒被法医 Dana Blanchard 医生宣布在现场场死亡。32 岁的司机弗兰克·米勒（住在 Foxon 路 593 号）被 Flanagan\
  \ 救护车送往米尔福德医院。他接受了治疗并出院。未提出指控。巡警 Robert Onofrio 调查了这起事故。\n\n> **英语摘要**：\n\n> 四天前，一辆汽车在\
  \ 69 号公路附近撞上了一棵树。27 岁、住在新泽西的乘客大卫·霍勒去世了。32 岁、住在康涅狄格州新哈文市 Foxon 路 593 号的司机弗兰克·米勒受轻伤。警方部门未提起指控。\n\
  \n> **西班牙语摘要**：\n\n> UN AUTO CHOCO CONTRA UN ARBOL CERCA DE LA CARRETERA 69 EL VIERNES\
  \ AL ANOCHECER. DAVID HALL, DE 27 ANOS, QUE VIVIA EN NEW JERSEY, EL PASAGERO, SE\
  \ MURIO. FRANK MILLER, DE 32 ANOS, QUE VIVIA EN 593 CALLE FOXON EN NEW HAVEN, CONNECTICUT,\
  \ EL CHOFER, QUEDO UN POCO HERIDO. EL DEPARTAMENTO DE POLICIA NO ACUSO A NADIE.\n\
  \n> **英语问答输出**：\n\n> Q1: 有人死亡了吗？\n> A1: 是的，大卫·霍勒去世了。\n> Q2: 有人受伤了吗？\n> A2: 是的，弗兰克·米勒受了轻伤。\n\
  > Q3: 米勒为什么受伤了？\n> A3: 因为汽车撞了树。\n> Q4: 米勒去医院了吗？\n> A4: 是的，他在米尔福德医院。\n> Q5: 米勒是怎么去医院的？\n\
  > A5: Flanagan 救护车将他送往了米尔福德医院。\n\n这个故事是《新哈文注册报》真实报道的简化版本，是由 SAM 使用交通事故场景进行处理的，该场景包含了“车祸”、“救护车行驶”、“医院治疗”和“警方调查”等简单脚本。由于\
  \ SAM 旨在模拟普通人对这些领域的理解，与餐厅或电影院脚本相比，这些脚本较为简略。尽管如此，正如摘要和问答输出所示，它们提供了合理的“理解”水平。\n\n\
  SAM 阅读报纸故事的基本策略与处理简单故事相同。它尝试将故事提到的事件定位在场景中。场景的结构然后告诉 SAM 如何选择因果连接的事件链。例如，SAM 必须将关于事故的信息与关于人员去医院的信息连接起来。它利用对交通事故和救护车功能（救护车脚本）的知识来推断可能发生的事件：有人看到了事故并打了救护车电话、救护车到达现场、救护人员将人放在担架上等。它还建立了故事中未陈述的关键连接：去医院的人一定在车祸中`受伤`了。在填充这些因果关系时，它对涉及的脚本角色进行推理。例如，它断定撞上树的“车辆”就是冲出公路的“汽车”，而“新泽西男子”必然是“大卫·霍勒”。\n\
  \nSAM 还有有限的能力利用故事的时间/地点设置对事件发生的地点和持续时间进行推理。例如，车祸脚本中位置信息的使用导致了结论（在英语和西班牙语摘要中均有）：事故一定发生在“69\
  \ 号公路附近”。同样，车祸一定发生在“冲出”同一天，即周五晚上。\n\n注意，在某些情况下，角色实例化的过程可能会延迟，直到故事提供足够的信息。例如，故事没有给出去医院的人伤势严重程度的明确信息。SAM\
  \ 推迟了对该脚本“角色”的决定，直到读到“治疗并出院”那句，此时它才断定他只是`轻伤`。\n\n### SAM 的行为总结\n\n\n\n\n\n用于阅读报纸文章的\
  \ SAM 版本包含了描述交通事故、飞机坠毁、火车事故、原油泄漏和国家访问等的情况。在这些每一个领域中，SAM 都处理了至少一个故事，其长度从 2 到 10 个输入从句不等，完全从英文文本输入到英文摘要或问答输出输出。它还通过对文本的人工编码分析，“理解”了每个领域中至少另外四个故事。\n\
  \nSAM 处理的每个故事在某种意义上都是“独一无二”的，因为每个故事都需要一个略有不同的推理过程。例如，在一个故事中，所有的角色合并推理都与代词指代有关；在另一个故事中，多个引用的合并涉及对同一种人的完全不同的标识进行匹配（例如，“一个新泽西州人”与“27\
  \ 岁的大卫·哈尔”）。研究还涵盖了更复杂的推理，涉及判断何时累积了足够的信息以证明角色实例化。\n\n通过将输入事件与组成脚本的因果链中的 `patterns`\
  \ 进行比较，可以在脚本中定位输入事件。由于 `patterns` 是 SAM 脚本的概念依赖单元，SAM 所拥有的知识量或许可以通过它使用的模式数量来最好地描述。最简单的情况“火车事故”包含大约\
  \ 40 个模式，而最复杂的“交通事故”包含超过 100 个模式。\n\nSAM 作为一组三到六个相互通信的模块运行，模块的数量取决于任务。这些模块用 `UCILISP`\
  \ 和 `MLISP` 编写，用于 `DEC System-10` 计算机（`KA-10` 中央处理器，192K 字主内存）。它们的大小从最小模块的约 35K\
  \ 字到最大的模块 `ELI` 的 75K 字不等。在每个模块中，大约一半的内存由用于工作存储的空闲组成；其余分配给“永久”代码和数据。\n\n故事理解的处理时间每个输入从句从约\
  \ 20 秒到一分钟以上的 CPU 时间不等，其中通常有一半被概念分析器消耗。速度慢的“逻辑”原因包括系统代码的解释性处理、模块间通信产生的开销以及主机计算机的原始速度限制。在让\
  \ SAM 尽可能小或尽可能快方面并没有花费多少精力。\n\n### 问题\n\nSAM 是故事理解领域的先驱尝试，试图直接面对与阅读连贯文本（而非孤立句子）相关的混乱但真实的问题。它也是第一个将足够的知识应用于特定领域的系统，从而可以对摘要、问答和机器翻译中的某些有趣问题进行攻克。\n\
  \nSAM 体现了一个关于阅读中核心上下文组件性质和使用的理论。在开始时，我们观察简单的上下文，让 SAM 从一些关于在餐厅用餐和在地铁中乘坐等简单虚构故事开始。这些故事对于人类听者（即使是孩子）来说并不特别有趣。尽管如此，为建立因果连接、处理指代问题、使用时空背景设定以及组织预期而开发的技术，在我们最终将\
  \ SAM 应用于阅读报纸故事的任务时是无价的。这是因为，从某种意义上说，理解关于飞机坠毁或国家访问的文章比阅读乘坐公交的文章并不困难。上下文“更大”，但本质上没有区别。\n\
  \n现在，为新领域设计脚本的过程已经有了很好的理解，尽管很枯燥。SAM 管理脚本的方法似乎足够高效，允许访问基于脚本的系统可能需要的任何信息。因此，SAM 及其后续系统是可扩展的。每个新脚本都以现有脚本相同的方式构建和应用。\n\
  \n当然，SAM 从来不是一个实用系统，因为它庞大、缓慢，而且像多模块程序那样是脆弱的。然而，它很慢是因为它试图通过深度理解它阅读的每一个单词来正确完成工作，这种深度使其能够产生人类认为合理且恰当的各种输出。在针对文本理解这一如此大领域的研究工作中，唯一合理的进展方法是设计一个像\
  \ SAM 一样由专家社区组成的系统，每个专家访问其自己的专门知识库，并尝试为当前问题做出贡献（参见 Hearsay-II 语音处理系统的“知识源”，Erman\
  \ and Lesser, 1975）。\n\n自然语言处理研究已经进展到这种程度：已经提出了许多合理的建议，描述了故事理解所需的知识来源。列举几个，我们有故事语法（Rumelhart,\
  \ 1975）、基于框架的知识（Minsky, 1975；Chamiak, 1972）、因果/机械知识，例如“常识算法”（Rieger, 1975）、脚本、计划、目标和信念系统（Abelson,\
  \ 1973；Schank and Abelson, 1977）。未来几年的关键研究问题将建立一个能够利用这些化知识源的系统。\n\n为了看到这样一个集成系统可能存在哪些问题，请考虑以下虚构的侦探故事，它其中包含了基于脚本的处理元素：\n\
  \n> 斯派兰走入布达佩斯咖啡馆。当服务员正在点餐时，老板——一个臭名昭著的黑手党人物——威胁地走向他们。\n\n第一句和第二句的开头显然被餐厅脚本解释了。然而，餐厅脚本没有提供关于老板威胁性接近的信息。它仅仅解释了他是所有者。必须采用其他类型的知识结构来解释老板的意料行为。然而，脚本对于设定场景以及指示什么是异常或意外的必要的。显然需要一种整合理论来控制知识源的相互作用，以理解这个故事。这种基于名为`层次任务管理器`机制的理论正在开发中（Cullingford,\
  \ 1979），但它的描述已远出现本书的范围。\n\n## SAM 概述\n\nSAM 被配置为一组三个模块：`ELI` 将文本分析为语义表示；`PP-MEMORY`\
  \ 标记并识别对图像生产者（PPs）的引用；以及 `APPLIER` 应用脚本。\n\n控制在 SAM 的模块之间以协程方式传递。一个程序可以运行一段时间，向别处发送它继续需要的信息，并最终重新获得控制。由于\
  \ SAM 设计为大量使用脚本来阅读故事，基础理解工作由脚本执行器完成。然而，脚本知识也可以并被其他模块利用。\n\n将故事的英文文本转换为 CD 语义表示是分析器\
  \ `ELI`（英语语言解释器）的工作。这是一个极其复杂的程序，其操作在 Riesbeck (1975) 和 Riesbeck & Schank (1976)\
  \ 中描述。脚本应用使用 `ELI` 的无语言输出。尽管 ELI 是 SAM 不可或缺的一部分，但我们在这里对其进行任何详细讨论。然而，对其在故事理解器中的功能进行评论可能会有所帮助。\n\
  \n\n\n\nELI 是 `SAM` 中唯一关注语言知识的模块，它也是唯一担心英语如何通过词义选择、词序、词的形态变化等特定方式来表达意义的模块。ELI 在\
  \ `SAM` 中的工作是从英语句子中仅提取出显式存在的概念元素，*尽可能避免推断*。在 `SAM` 中，我们刻意将推断输入中遗漏内容的任务留给了“记忆”例程（`PP-Memory`\
  \ 和 `Script Applier`），而不是留给 `ELI`。这是因为这类推断依赖于世界知识的使用，而不是依赖于 `ELI` 作为其英语知识一部分所拥有的浅层语义信息。\n\
  \n![](img/fig5_1_B.jpg)\n\n图 5.1 `SAM` 理解阶段。\n\nELI 只构建输入中显式存在的概念实体。它通过填充概念结构中的槽位（这些结构通常源于表层动词）来构建其意义表示。调用特定概念结构的句子会填充该结构中的某些但不是全部槽位。为了说明可能填充也可能不填充的概念槽位，考虑\
  \ `ELI` 如何处理以下简单故事：\n\n> 约翰乘地铁去曼哈顿看戏。在剧院，他走到售票台要了一张票。服务员从他那里拿过票，并带他到了座位。戏太令人反感了，约翰决定离开。剧院拒绝退款。\n\
  \n在分析第一句时，`Analyzer` 不会对约翰从哪里来做出任何推断。同样，在解析“…要了一张票”时，它不会对通信的接收者做出任何断言，除非默认假设这是某个“高地位的实体”。最后，`ELI`\
  \ 不尝试指定指代（无论是代词或其他形式）。填充空槽位或进行指代规范所需的推断依赖于详细的世界知识，因此更适合由“记忆”例程来执行。\n\n`ELI` 将表层文本映射为概念化：一段表达句子“无推断性”意义的数据片段。从这一点开始，`SAM`\
  \ 直接处理意义表示。句子在故事中实际出现的细节就丢失了。这种操作模式与我们的主张一致，即从深层意义上来说理解是不依赖语言的。这一主张得到了许多关于文本回忆的心理学实验的支持（例如，Bartlett,\
  \ 1932; Johnson-Laird, 1974; 以及 Kintsch and Monk, 1972），这些实验表明记忆中的故事表示是“概念性的”或“命题性的”。记住的是文本中的思想，而不是实际使用的单词。`ELI`\
  \ 将其结果发送给 `PP-Memory`，它是 `SAM` 的第二个模块，是图片生产者（PPs）的记忆。\n\n概念化由两种成分组成：`PPs` 以及关于 `PPs`\
  \ 的命题，其核心元素是概念依赖中的原语 `ACTs` 和 `STATEs`。（第 2 章 介绍了意义表示。概念依赖；关于 `CD` 的详细描述，请参见 Schank\
  \ 等人,1975。）`PP-Memory` 的工作是找到概念化中的 `PPs` 并为它们分配标记。标记是 `PPs` 的标签或句柄，将被 `SAM` 的所有其他部分使用。该模块还为\
  \ `Script Applier` 在实例化脚本路径过程中遇到但在输入中未提到的角色提供标记。在上面的故事中，`Applier` 会告诉 `PP-Memory`\
  \ 为由概念化“…要了一张票”所隐式引入的售银员创建一个标记。\n\n`ELI` 概念化中的 `PP` 可能指代 `SAM` 以前见过的东西，也可能是“新”的。。因此，`PP-Memory`\
  \ 必须处理指代问题：概念化中的一个新 `PP` 是已经见过的某个的实例，是对系统已知的“永久”标记的引用，还是指向以前未见过的某人、某物、某地的指针？`PP-Memory`\
  \ 拥有的数据结构编码了关于 `PPs` 的“时间不变性”事实，例如它们所属的“概念类别”（人类、物理对象、组织等）、它们在不同脚本语境中承担的角色，以及关于它们在任何语境下都真实的某些断言。例如，`PP`\
  \ “椅子”表示人们在各种语境下坐的“物理对象”。在餐厅环境中，它被实现为“椅子”，在公交或或地铁环境中被实现为“座位”（因为它可能无法移动）。在真实人类记忆中，附加在“椅子”上的还有额外信息，如它的“视觉图像”（也许是人桌上的椅子），以及诸如“椅子通常有腿、座和靠背”等事实。`SAM`\
  \ 对 `PPs` 的记忆并没有多少后类信息，因为坦率地说，我们还不知道如何很好地表示图像和量化断言。它拥有的是关于 `PPs` 在脚本语境中如何使用的数据。`PP-Memory`\
  \ 是脚本角色和道具的记忆。\n\n因此，在理解的任何点，`SAM` 都拥有一份已识别的标记列表，以及一组来自当前概念化的新标记。某些新标记对应于表层句子中的代词，因此我们面临众为人知的代词指代问题（例如，在上面的故事中，“他”一词被多次指代约翰）。“服务员从他那里拿过它……”中“它”的出现了一个更困难的指代问题。这里需要利用剧院脚本中关于服务员职责的详细世界知识，以便将“它”正确分配给约翰从售银员那里拿的“票”。在这些案例中，指代问题都由\
  \ `Script Applier` 解决。\n\n另一类标记指代世界上众知的人和事。这些被称为“永久”标记。这个故事中永久标记的例子是“地铁”和“曼哈顿”。虽然永久标记立即被\
  \ `PP-Memory` 识别为此类，但它们在不同的故事中可能具有不同的脚本角色。例如，“毛主席”在“访问贵宾”故事中可能是发出邀请的国家元首，在“国葬”故事中可能是去世的\
  \ VIP。因此，与代词指代的情况一样，这类 `PP` 指代只能通过对语境进行详细检查来解决：`PP` 及其相关的概念化，以及之前读过。指代问题始终在 `SAM`\
  \ 中协作解决，通过 `PP-Memory` 和 `Script Applier`（即了解语境以及什么可以作为语境角色的模块）。\n\n\n\n脚本应用器（Script\
  \ Applier）通过查询其脚本集来控制理解过程。每个脚本都包含几个重要部分。首先是脚本的特征事件链，或称为情节（episodes）。由于脚本中的事件可能以许多方式在世界中实现，因此脚本情节中的事件是\
  \ `patterns`（模式）。这些模式是数据结构，包含了预期在输入中恰好出现的常数部分，以及定义了一范围备选输入的可变部分。\n\n一组特殊的模式存在于脚本的“先决条件”（preconditions）中，这些是\
  \ SAM 在第一次进入某个脚本时假设为真实的全局事实，除非它读到了相反的内容。例如，当“餐厅脚本”被激活时，脚本应用器将断言餐厅顾客是饥饿的，并且有钱吃饭。如果文本显示顾客没有钱（例如，他把钱包留在了家里），那么对先决条件的违背将触发一个预测，即顾客在付账账单时将遇到困难。\n\
  \n每个脚本的一个重要部分是始终存储在活动内存中的信息。这包括静态数据，例如激活脚本的模式初始列表、相关的情节如何组合成“块”或“场景”（scenes）、脚本的时间和地点设置数据，以及其他更简单的脚本如何作为主脚本中的单元使用。\n\
  \n脚本应用器的控制结构如图图 5.2\n\n图 5.2 脚本应用器控制结构。\n\n### SAM 中的活动脚本\n\nSAM 中的“活动”脚本定义了一个由以下部分组成的上下文：\n\
  \n1. 模式列表，用于预测在故事的给定点将看到哪些输入。\n2. 绑定列表，将由 `PP-Memory` 产生的 PP（介词短语）标记与脚本变量链接起来。\n\
  3. 当前激活的脚本场景记录。\n4. 脚本推理列表——即已经发生并干扰脚本中正常活动流的事件——这些推理目前处于待处理状态。\n5. 脚本全局“强度”指示，SAM\
  \ 用它来标记其对推理的“相信”程度有多强。\n\n脚本应用器的基本循环是逐调用这些脚本上下文，并尝试在所调用的上下文中定位输入。候选脚本按以下顺序调入活动内存：首先是那些被输入显式引用的脚本上下文，或通过输入中的\
  \ `PP` 或子概念化（sub-conceptualization）间接访问的上下文；其次是当前活动的脚本；最后是系统拥有但尚未被调用的脚本。\n\n###\
  \ 匹配过程\n\n应用器使用其 `Pattern Matcher` 来决定输入引用了哪个脚本。匹配过程有两个不同的阶段。首先，将模式的“骨干”（即 `ACTs`、`STATEs`\
  \ 和其他常数）与输入的骨干进行匹配。如果输入的骨干类型正确，则会检查输入中出现的 `PPs` 的特征是否与对应脚本变量的特征相符。\n\n输入所引用的脚本变量可能是之前已经绑定的，也可能是尚未访问过的。这两种情况下的特征检查过程略有不同。如果脚本变量是“新的”，则会通过一个名为\
  \ `Rolefit` 的过程来确定候选 `PP` 是否可以是该变量的实例。由于脚本变量实际上是由 `function` 定义的，`Rolefit` 中使用的两个主要特征是：(1)\
  \ 对象所属的概念“类”，例如人类、有动物、物理对象、组织等；以及 (2) `PP` 可能具有的任何功能指示。例如，如果 `PP` 是人，`Rolefit` 将寻找职业、头或相关的脚本。\n\
  \n如果变量是“旧的”，则已经存在一个 `PP-token` 需要与新的标记进行比较。这种比较由一个名为 `Rolemerge` 的例程执行。它像之前一样查看输入的概念类和功能，然后检查输入\
  \ `PP` 和上一个标记的次特征（例如居住地、年龄等）以寻找矛盾。`Rolemerge` 过程是 SAM 执行引用规范（reference specification）的方法。\n\
  \n### 函数调用与链接\n\n使用一种模式引导的函数调用（Hewitt, 1970）来检查 SAM 在任何给定点可能感兴趣的输入特殊特征。假设，系统正在读一个关于车祸的故事，读到了关于伤情的描述。当脚本中“有人受伤了”的模式被匹配时，脚本应用器会自动调用一个函数来检查此人的受伤程度，即此人是“轻伤”、“重伤”甚至是“死亡”。该函数调用的结果将修改对未来输入的预测，例如，随后的住院时间可能会有多久。\n\
  \n一旦在脚本中定位了输入，`instantiator` 将其与该脚本之前的内容链接，然后检查这对其他活动脚本可能产生的影响。如果是第一次引用脚本，应用器将检查脚本的\
  \ `Preconditions`（先决条件），以查看是正常进入脚本，还是因为之前的事件导致在新上下文中预期会有某些异常事件。如果有多个脚本处于活动状态，应用器可能根据脚本始终可用的静态信息来更新故事表示。例如，公交脚本包含该脚本与火车脚本是“顺序”关系的信息。也就是说，当火车脚本第一次被调用时公交脚本正处于激活状态，则必须在启动火车脚本之前完成公交脚本的实例化。另一方面，火车脚本包含信息：在现有火车脚本上下文中通过“餐车”对餐厅脚本上下文的引用定义了一种“并行嵌套”（parallel-nested）关系。后续输入可能引用任何一个脚本，但餐厅脚本应该在火车脚本之前完成。\n\
  \n### 全局上下文\n\n脚本之间的许多事务由更复杂的脚本处理，这些脚本定义了故事的“全局”上下文。例如，乘坐公交、火车、飞机等被认为是到达或离开旅行“目标”活动发生地点的“工具性”手段。全局旅行脚本可能是显式引入的，如“约翰去迈阿密出差”，也可能是通过其工具之一隐式引用的，如“约翰乘火车去迈阿密”。这些被称为全局脚本的脚本情况为解决我们所说的脚本管理问题提供了最重要的机制。\n\
  \n\n\n当链接过程完成后，`SAM` 将根据新输入和之前的内容，通过合并与脚本全局搜索列表匹配的模式相相关的特定增量预测，更新其对上下文的预测。随后，更新后的上下文被存储，并通过调用\
  \ `ELI` 开始下一轮处理。在吸收整个文本后，`Script Applier` 会构建一个故事的表示，供所有后处理程序使用。该表示是一个由因果连接的概念化网络：既包括输入显式访问的概念化，也包括可以推断为发生的概念化。系统还提供了“头部”信息，摘要和问答模块利用这些信息获取网络中的重要事件、根据涉及的脚本定义的故事全局结构，以及脚本角色绑定的细节。\n\
  \n`SAM` 的摘要和改写方法在 Schank 等人（1975）以及 Schank 和 Abelson (1977) 中有所讨论。简之，这些例程访问故事表示并挑选出其中记录的“有趣”事件。由于\
  \ `SAM` 内部处理的 `CD` 结构是跨语言的，因此可以用包含必要世界知识的任何语言生成输出。作为一个机器翻译系统，`SAM` 可以用中文和西班牙语表达摘要或改写，或者模拟英语故事到中文的“同步翻译”（Stutzman,\
  \ 1976）。`SAM` 使用的生成器是 Goldman `BABEL` 程序的修改版（Goldman, 1975）。\n\n摘要/改写任务是选择看起来合适的说的话。即使我们有手段表达记忆可能访问的任何可能的概念化，仍然存在一个先验问题，即在给定情况下决定哪些是最佳回。。也就是说，摘要/改写过程必须回答两个问题：(1)\
  \ 被 `Script Applier` 标记为重要的概念化中，哪些足够“有趣”可以表达？(2) 应该包含哪些时间或地点设置信息以便将结果形成一个连整体？\n\n\
  对读过的故事提问的能力在许多方面都是衡量故事是否被真正理解的关键测试。`SAM` 问答（`Q/A`）能力的底层理论由 Lehnert 的 `QUALM` 提供，该理论在\
  \ Lehnert (1978) 中进行了详细讨论。\n\n## 注释示例\n\n本节展示了 `SAM` 在阅读一个关于阿尔巴尼亚总理访问中国的三行故事时，其所保留的某些处理日志片段。\n\
  \n我们的示例故事被 `SAM` 理解为引用了 `VIP-visit` 脚本场景，该场景包含旅行、游行、宴会等组件脚本。第一个输出来自 `SAM` 的理解阶段。随后用英语和西班牙语表达了故事的摘要。最后，`SAM`\
  \ 回答了关于故事的几个问题。\n\n故事文本如下：\n\n> 周日早晨，阿尔巴尼亚总理恩维尔·霍克斯查和霍克斯查夫人受中国共产的邀请抵达北京。阿尔巴尼亚代表团黄外长在北京机场欢迎了阿尔巴尼亚代表团。华主席和霍克斯查先生讨论了三个小时中国与阿尔巴尼亚之间的经济关系。\n\
  \n尽管这个故事表面上很简单，但它包含了非常真实的分析、推理和生成问题，如下文所示。尽管日志包含了 `SAM` 的每个模块的输出，但重点将放在“深层记忆”模块（即\
  \ `PP-Memory` 和 `Script Applier`）的交互上，而不是其他模块的内部工作。`Conceptual Analyzer` 特别是在 `SAM`\
  \ 中承担了巨大的处理负载。除了最复杂的故事外，它是所有例程中使用 CPU 时间最长的。然而，日志仅包含输入它的句子以及它计算的 `LISP` `CD` 表示。\n\
  \n这些片段摘自一个名为 `OPSER` 的 `DEC System-10` 工具程序，该程序具有启动和控制多个作业，并将作业的任何输出发送到单个终端的功能。以\
  \ `!` 开头的行是 `OPSER` 消息，指示后续输出输出的模块。`PARSER` 是 `Conceptual Analyzer`，`TOK` 是 `PP-Memory`，而\
  \ `APPLY` 是 `Script Applier`。\n\n`SAM` 由 `Script Applier` 控制启动：\n\n```\n!(APPLY)\n\
  SCRIPT APPLIER MECHANISM … VERSION 4.1… 12 JULY 1976\nPROCESSING NEWSPAPER TEXT\
  \ (TEXT. V3)\nAVAILABLE SCRIPTS:\n($TRAINWRECK $VIPVISIT $VEHACCIDENT)\nGETTING\
  \ NEW INPUT\n```\n\n这里显示的 `Script Applier` 版本处理了关于火车事故、国家访问和汽车交通事故的报纸故事。它包含特殊的程序来处理导语，根据从从中发现的内容做出预测，并处理这些故事中常见的复杂名词组经常引起的引用问题。\n\
  \n`PARSER` 获取控制权并分析第一句。“抵达”的概念化说明，一个由总理和霍克斯查夫人组成的群体 `PTRANS` 到了北京市，且抵达发生在受中国共产的邀请的某种时间关系中。（`PTRANS`\
  \ 是用于包含物理位置变化的事件的 `CD` 动作原语。概念化上的 `MODE` 规定符表示 `PTRANS` 在北京停止（“抵达”对比“去”）。\n\n接下来，`TOK`\
  \ 将概念化中对 `PP` 的引用替换为命名记忆模块使用的属性列表结构的令牌（tokens）。如果 `PP` 是一个“永久令牌”，即世界上著名的某人或地点，`TOK`\
  \ 还会复制来自令牌的信息。\n\n\n\n\n\n此时，`Script Applier` 已经接收了带有标记的概念化，这代表了故事第一句的含义。需要注意的是\
  \ `PARSER` 和 `TOK` 做了什么，以及没有做什么。`PARSER` 没有尝试对 `Hoxhas` 从哪里来，或者他们是如何到达 `Beijing`\
  \ 的进行任何推论，尽管世界常识表明他们可能是从他们的祖国阿尔巴尼亚飞往中国的。此外，尽管我们知道邀请通常发生在被邀请者实际前往某地之前，但 `PARSER`\
  \ 仅提示邀请和到达事件之间存在某种时间关系。表面字符串或输入并没有直接说明谁被邀请了，或者邀请的原因是什么，因此 `PARSER` 将概念化中相应的槽位留空了。\n\
  \n`TOK` 为概念化中出现的 `PP` 提供了标记，例如总理和他的妻子。它还识别出总理、`Peking`、`Albania` 和 `China` 是永久标记。然而，与\
  \ `PARSER` 一样，`TOK` 并不具备推理出“到达小组就是被邀请的那个小组”所需的知识，因此它对该槽位未处理。最后，`TOK` 未能为该概念化中的 `PP`\
  \ 可能参与的脚本提供任何可能的建议。这是因为人、城市和国家关联了太多的上下文，以无法做出处理建议。\n\n`APPLY` 首先搜索嵌入的“invitation”（邀请）。\n\
  \n```\n !(APPLY)\nFINDING IMBEDDED CDS: (MEM6)\nSEARCHING FOR MEM6 IN SCRIPT $TRAINWRECK\n\
  SEARCHING FOR MEM6 IN SCRIPT $VIPVISIT\nLOCATED AT VAR1\nBOUND SCRIPT VARIABLE:\
  \ &INVGSTATE TO POLIT2\nTRACK $VIP1 of $VIPVISIT ACTIVATED\nSETTING PARSER WORD-SENSES\
  \ FOR $VIPVISIT\n```\n\n`APPLY` 在 `trainwreck` 脚本中搜索输入失败。在 `VIP-visit` 脚本中找到了“invitation”。找到的模式还说明\
  \ `China` 填充了发出邀请的国家角色。\n\n现在系统已准备好读取更多关于 `VIP-visit` 脚本领域的事件。`APPLY` 能够从“邀请者是一个国家\
  \ `China` 而非私人公民”这一事实识别出邀请的性质。由于 `SAM` 现在假设它知道哪个上下文是激活的，它会偏向 `Analyzer` 优先检查符合国事访问上下文的单词和短语。\n\
  \n`APPLY` 现在寻找输入中提到的“arrival”（到达）：\n\n```\n SEARCHING FOR MEMO IN SCRIPT $VIPVISIT\n\
  PATTERN BACKBONE MATCHED AT VAR3\nVARIABLE BINDING CONTRADICTION IN (& PTRORG. GROUP0)\n\
  TRYING INFERENCE TYPE CONVEY ON VAR3\nPATTERN BACKBONE MATCHED ON DERIVED PATTERN:\n\
  ((ACTOR & INVDGRP < = > (*PTRANS*) OBJECT & INVDGRP TO\n (*INSIDE* PART & INITDEST)))\n\
  SUCCCESSFUL MATCH ON DERIVED PATTERN\nLOCATED AT VAR3\nBOUND SCRIPT VARIABLE:\n\
  & INITDEST TO POLIT1\n& INVDGRP TO GROUP0\nGETTING NEW INPUT\n```\n\n现在第一句已经读取，对接下来将发生的事情做出了若干预测，并识别了一些脚本变量。对“到达”事件的模式匹配包含了\
  \ `SAM` 用于的的辅助推理过程的典型示例，这些过程用于调和输入与编码了对读取特定预期的模式之间的细微差异。当访问顶层概念化时，激活的预测之一是关于被邀请者的旅程，具体来说，是一个关于航空公司或客运轮等组织将此人（或包含此人的小组）移动到邀请国的模式。而\
  \ `SAM` 得到的是一个 VIP 团体自行移动到那里的概念化。在这种情况下，`SAM` 推断 VIP 是被未提到的组织移动的。如果此时实例化该模式，`APPLY`\
  \ 将假设航空公司确实是执行移动任务的组织。\n\n`SAM` 现在开始处理故事的第二句。由于激活的是 `VIP-visit` 脚本，`PARSER` 将其解释为“国家欢迎”：\n\
  \n```\n !(PARSER)\nThe Albanian party was welcomed at Peking Airport by Foreign\
  \ Minister Huang.\nCONCEPT: GN7\n((< = > ($VIPWELCOME WELCOMER (#PERSON TITLE (FOREIGN\
  \ MINISTER)\n LASTNAME (HUANG))\n WELCOMEE TMP55))\nTIME (TIM3) MODE (MOD7))\nTMP55\
  \ = (#GROUP RESIDENCE (#POLITY POLTYPE (*NATION*)\nPOLNAME (ALBANIA))\nREF (DEF))\n\
  TIM3 = ((WHEN TMP72))\nTMP72 = ((ACTOR TMP55 IS (*LOC* VAL (*PROX*\n PART (#LOCALE\
  \ LOCTYPE (*AIRPORT*)\n LOCNAME (PEKING))))))\n```\n\n与第一句一样，“welcome”（欢迎）的顶层概念化通过时间链接与另一个概念化相关。修饰概念化说明“阿尔巴尼亚一方”（一个群体代词）曾位于“北京机场”附近。在\
  \ `TOK` 处理完 `PARSER` 的输出后，`APPLY` 寻找后者事件：\n\n```\n !(APPLY)\nSEARCHING FOR MEM 15\
  \ IN SCRIPT $VIPVISIT\nTRYING INFERENCE TYPE IMRES ON VAR4\nPATTERN BACKBONE MATCHED\
  \ ON DERIVED PATTERN:\n((ACTOR & INVDGRP ... ))\nSUCCESSFUL MATCH ON DERIVED PATTERN\n\
  LOCATED AT VAR4\nROLE INSTANTIATED: &PTRORG\n!(TOK)\ncreating new token: &ORGO\n\
  !(APPLY)\nGOT TOKEN FOR OR\n```\n\n这一序列说明了 `APPLY` 与 `TOK` 之间典型的交互。`APPLY` 正在寻找小组到达的模式，`SAM`\
  \ 必须做出推论：因为小组已经在机场，他们之前已经到达了。此外，由于提到了机场，`APPLY` 现在知道了运输组织的身份。`APPLY` 寻找“欢迎”事件：\n\
  \n```\n SEARCHING FOR MEM11 IN SCRIPT $VIPVISIT\nPATTERN BACKBONE MATCHED AT WEL4\n\
  CHECKING GROUPS: (GROUP1 GROUP0)\nPOSSIBLE REFERENCE FOUND: GROUP1\nMERGING TOK\
  \ ((GROUP0))\n```\n\n这里看到了第一个需要填充的引用。当 `TOK` 将 `Hoxhas` 识别为永久标记时，它将关于他们的信息复制到为他们创建的标记中。此外，霍克斯家族小组被标记为阿尔巴尼亚，“一方”小组与原始小组合并。由于\
  \ `SAM` 每个变量只保留一个标记，它告诉 `TOK` 将第二个标记的任何可用信息复制到第一个，并丢弃第二个。\n\n`TOK` 执行了操作，`SAM` 开始处理故事的最后一句：\n\
  \n```\n !(PARSER)\nChairman Hua and Mr. Hoxha discussed economic relations between\
  \ China and Albania for three hours.\nCONCEPT: GN13\n((ACTOR TMP171 < = > (*MTRANS*)\n\
  MOBJECT (*CONCEPTS* REGARDING\n (#CONTRACT\n TYPE (*ECONOMY*)\nPARTY (#GROUP MEMBER\
  \ (#POLITY POLTYPE (*NATION*)\n POLNAME (ALBANIA))\n MEMBER (#POLITY POLTYPE (*NATION*)\n\
  \ POLNAME (CHINA)))))\nINST ((ACTOR TMP171 < = > (*SPEAK*)))\n FROM (*CP* PART TMP171)\
  \ TO (*CP* PART TMP171))\nTIME (TIM7) MODE (MOD3))\nTMP171 = (#GROUP MEMBER (#PERSON\
  \ GENDER (*MASC*)\n LASTNAME (HOXHA))\n MEMBER (#PERSON TITLE (CHAIRMAN)\n LASTNAME\
  \ (HUA)))\n```\n\n`PARSER` 将此事件解释为涉及由霍克斯和华组成小组的双重意义转换（MTRANS），关于阿尔巴尼亚和中国两国之间的“经济合同”（某种协议）。在\
  \ `TOK` 完成工作后，`APPLY` 在 `$VIPVISIT` 中搜索该事件：\n\n```\n !(APPLY)\nSEARCHING FOR MEM20\
  \ IN SCRIPT $VIPVISIT\nPATTERN BACKBONE MATCHED AT TALK2\nLOCATED AT TALK2\nBOUND\
  \ SCRIPT VARIABLE:\n& INVITOBJ TO CNTRCT0\n& GRP1 T8 GROUP2\n```\n\n\n\n\n现在所有三个句子都在\
  \ VIP 访问脚本（VIP-visit script）中被识别了。关于经济协议的最终概念化实现了该脚本的主要概念化之一（`Maincons`），因为这是国家访问的某种可能原因。其他可能的原因（在本文故事中未实例化）包括签署条约或发布官方公报。此时，`APPLY`\
  \ 已准备好处理其他正式仪式，或 VIP 离开北京返回家乡。\n\n没有更多的故事输入了，因此 `APPLY` 为故事构建了一个记忆表示：\n\n```\n BUILDING\
  \ STORY REPRESENTATION FOR (TEXT .V3)\nMAKING STORY SEGMENT FOR SUBSCENE $VARRIVE1\
  \ IN $VIPVISIT\nMAKING STORY SEGMENT FOR SUBSCENE $VWELCOME1 IN $VIPVISIT\nMAKING\
  \ STORY SEGMENT FOR SUBSCENE $VTALK1 IN $VIPVISIT\nBINDING SCRIPT VARIABLE & MTGPLC\
  \ TO POLIT1\nEVENT GRAPH:\n((EVNT1 EVNT2 EVNT3 EVNT4)\n (EVNT5 EVNT6 EVNT7)\n (EVNT8\
  \ EVNT9))\n```\n\n这个故事从 VIP 访问脚本中实例化了三个片段：(1) 一个 VIP 团体前往北京的片段；(2) 一个官方问候片段，在本例中发生在北京机场；以及(3)\
  \ “正式会谈”片段的一个实例。`APPLY` 使用它在运行的识别阶段积累的脚本变量绑定来实例化这些片段中的事件。在此过程中，它对故事未显式提到的变量进行了推理。例如，华国锋和霍贾哈进行会谈的地点并未明确说明，因此\
  \ `APPLY` 假设会谈地点是在霍贾哈派抵达的城市。实例化过程的结果是由已实例化的、相互互连的片段组成的“事件图”。事件图、脚本变量绑定的详细信息以及关于故事的其他信息都存储在永久内存中。\n\
  \n在稍后，这些信息将由 `SAM` 的总结后处理器加载，它会选择感兴趣的事件并将它们传递给 `Generator` 进行表达。在下方所示的输出中，`ENGLISH`\
  \ 是英语生成器，`SPANSH` 是西班牙语生成器。（使用的总结器 `SAM` 由 Jerry DeJong 编写。西班牙语输出是从由 Jaime G. Carbonell\
  \ 编写的 Goldman 的 `BABEL` 修改而来的。）\n\n```\n !(ENGLSH)\nCONSTRUCTING SUMMARY FROM STORY\
  \ (TEXT . V3)\nPREMIER ENVER HOXHA, THE ALBANIA GOVERNMENT HEAD, AND\nCHAIRMAN HUA\
  \ KUO-FENG, THE CHINA GOVERNMENT HEAD, DISCUSSED\nALBANIA/COMMUNIST-CHINA ECONOMIC\
  \ AFFAIRS IN PEKING, CHINA\nTWO DAYS AGO.\n```\n\n对于这个简单的故事，总结器选择只表达脚本中的 `Maincon`。`Maincon`\
  \ 通过设置脚本应用器（Script Applier）提供的信息得到了增强。例如，`APPLY` 推断出正式讨论发生在中国北京。`TOK` 作为其对永久标记“Enver\
  \ Hoxha”和“Chairman Hua”知识的一部分所拥有的信息，已体现在总结中，即 `ENGLISH` 被指示表达的关于他们姓名和职业的额外信息。\n\n\
  现在，西班牙语生成器表达了总结器的输出：\n\n```\n !(SPANSH)\nCONSTRUCTING SUMMARY FROM STORY (TEXT .\
  \ V3)\nEL JEFE DEL GOBIERNO DE CHINA, HUA, Y EL PRIMER MINISTRO\nDE ALBANIA, HOXHA,\
  \ DISCUTIERON UN TRATADO SOBRE ASUNTOS\nECONOMICOS EN PEKING.\n```\n\n最后，`SAM` 回答了一些关于它读过的故事的问题。在\
  \ `SAM` 的 Q/A 配置中，`PARSER`、`TOK` 和 `ENGLISH` 分别如之前之前的分析器、PP 内存和英语生成器。`QA` 是问答模块。`SAM`\
  \ 中包含的 Q/A 策略细节可以在 Lehnert (1978) 中找到。\n\n`PARSER` 分析第一个问题：\n\n```\n !(PARSER)\n\
  Who went to China?\nCONCEPT: GN1002\n((ACTOR TMP8 < = > (*PTRANS*) OBJECT TMP8\n\
  \ TO (*PROX* PART (#POLITY POLTYPE (*NATION*)\n POLNAME (CHINA)))\n FROM (NIL) INST\
  \ (NIL))\nMODE (MODO) TIME (TIM2))\nTMP8 = (*?*)\n!(TOK)\ntop level PARSER atom\
  \ is: GN1002\nprocessing PP:\n(#POUTY POLTYPE TMP39 POLNAME TMP40)\ncreating new\
  \ token: POLIT101\ntop level TOK atom for GN1002 is MEM 101\n```\n\n`PARSER` 将此解释为一个问题（标记为\
  \ `(*?*)`），关于一个到达中国附近的 `PTRANS` 执行者（`ACTOR`）。`TOK` 以通常的方式给中国分配了一个标记。然后 `QA` 接管控制权：\n\
  \n```\n !(QA)\nNEXT QUESTION:\n((ACTOR (*?*) < = > (*PTRANS*) OBJECT (*?*)\n TO\
  \ (*PROX* PART POLIT101)))\n(QUESTION TYPE IS CONCCOMP)\n(SEARCHING $VIPVISIT-SCRIPT\
  \ STRUCTURE)\n(FOUND AT SCRIPT STRUCTURE LEVEL)\nTHE ANSWER IS:\n(GROUP0)\n!(ENGLSH)\n\
  PREMIER ENVER HOXHA AND MRS. HOXHA\n```\n\n`QA` 处理这个概念问题，将其识别为对概念化中角色的查询，并在故事表示中搜索答案。它找到了所需的角色填充——霍贾哈总理和他的夫人，并指示\
  \ `ENGLISH` 表达这个答案。\n\n“谁去了中国？”的答案（通常情况下一样）取决于推理。首先，故事并没有显式说任何人去了中国，而是说官方代表抵达了北京。答案取决于因果链推理：到达一个国家（或其他任何地方）之前必须进入该国家。`Script\
  \ Applier` 作为其关于访问知识的一部分，将此信息构建到了故事的顶层。为什么是顶层？VIP 访问是旅行的一个特例。人们（尤其是 VIP）总是在旅行，使用标准的交通工具（即\
  \ `Maincons` 基于 `PTRANS`）往返。因此，`Script Applier` 记录了旅行“前往”部分，问答模块访问它以找到“谁去了中国？”的答案。\n\
  \n```\n !(PARSER)\nHow did they get to China?\nCONCEPT: GN1008\n((ACTOR TMP103 <\
  \ = > (*PTRANS*) OBJECT TMP103\n TO (*PROX* PART (#POLITY POLTYPE (*NATION*)\n POLNAME\
  \ (CHINA)))\n FROM (NIL) INST (*?*))\nMODE (MOD1) TIME (TIM5))\nTMP103 = (#GROUP\
  \ MEMBER (#PERSON) REF (DEF))\n!(QA)\nNEXT QUESTION:\n((ACTOR GROUP101 < = > (*PTRANS*)\
  \ OBJECT GROUP101\nTO (*PROX* PART POLIT102) INST (*?*)))\n(QUESTION TYPE IS INSTPROC)\n\
  (SEARCHING $VIPVISIT-SCRIPT STRUCTURE)\nTHE ANSWER IS:\n((ACTOR ORGO < = > (*PTRANS*)\
  \ OBJECT GROUP0\n TO (*PROX* PART POLIT2)))\n!(ENGLSH)\nMRS. HOXHA AND PREMIER ENVER\
  \ HOXHA FLEW TO COMMUNIST-CHINA\n```\n\n“他们是如何去中国的？”的答案取决于 `Script Applier` 做出的三个关键推理。首先，“他们”必须被识别为霍贾哈派。这是一个引用问题，`TOK`\
  \ 和 `QA` 使用 `Script Applier` 确定故事输入中“阿尔巴尼亚派”引用的方法来解决它。其次，`Script Applier` 根据对北京位置的知识，将“中国”识别为“中国中国”，而非“民国中国”。\n\
  \n\n\n\n```\n !(PARSER)\n为什么恩维·霍哈去了中国？\nCONCEPT: GN1015\n((CON (*?*) LEADTO\n ((ACTOR\
  \ TMP160 < = > (*PTRANS*) OBJECT TMP160\n TO (*PROX* PART\n (#POLITY POLTYPE (*NATION*)\n\
  \ POLNAME (CHINA)))\n FROM (NIL) INST (NIL))\n MODE (MOD2) TIME (TIM6))) MODE (NIL))\n\
  TMPI60 = (#PERSON GENDER (*MASC*) FIRSTNAME (ENVER)\n LASTNAME (HOXHA))\n!(QA)\n\
  NEXT QUESTION:\n((CON (*?*) LEADTO\n ((ACTOR HUM 102 < = > (*PTRANS’) OBJECT HUMI02\n\
  \ TO (*PROX* PART POLITI03)))))\n(QUESTION TYPE IS CAUSANT)\n(SEARCHING $VIPVISIT-SCRIPT\
  \ STRUCTURE)\nTHE ANSWER IS:\n(BECAUSE ((CON ((ACTOR GROUP2 < = > (*MTRANS*)\n INST\
  \ ((ACTOR GROUP2 < = > (*SPEAK*)))\n MOBJECT (*CONCEPTS* REGARDING CNTRCTO)\n FROM\
  \ (*CP* PART GROUP2)) TIME (TIME10))\n IS (*GOAL* PART (GROUP2))) TIME (TIMEI0)))\n\
  !(ENGLSH)\nBECAUSE CHAIRMAN HUA KUO-FENG AND MR. ENVER HOXHA WANTED TO DISCUSS CHINA/ALBANIA\
  \ ECONOMIC AFFAIRS.\n```\n\n这就是我们 SAM 对一篇新闻报道进行的示例性计算机运行。让我们再次强调一下 SAM 在阅读这个故事时实际起作用的一些重要推理过程。\n\
  \n在处理第一句时，一个名为 `Rolefit` 的程序会检查到达群体中是否至少有一个成员是贵宾（VIP）。这样做是为了确定该事件符合 `VIP-visit`（VIP\
  \ 访问）脚本，而不是其他脚本（例如游客脚本）。另一个关联过程 `Rolemerge` 用于第二句，以确定“阿尔巴尼亚一方”与第一句中提到的是同一组人，即总理和霍哈夫人。请注意，在第二句中，使用了一种特殊的“欢迎”含义，这通常涉及乐队、演讲等。这种“欢迎”的含义本身就是嵌入在\
  \ `VIP-visit` 脚本中的一个脚本，SAM 在访问访问的背景下将其以此进行分析。\n\nSAM 做出的其他推理可以在该故事的输出中看到。对时间和地点设置信息的需求可以在摘要中看到，摘要断言华国锋和霍哈之间的会议是在到达当天的北京的，尽管故事中并没有明确说明这一点。（SAM\
  \ 插入了“两天前”这个短语，因为按照惯例，它是在周二阅读报纸的。）“谁去了中国？”的答案取决于一个因果链推理，即去北京之前必须先进入北京所属的国家。最后，在回答“他们是如何到达中国的？”这个问题时，需要一个角色实例化（role-instantiation）推理，这假设在机场被迎接的贵宾是乘坐飞机到达的。这是一种典型的实用的、但仅是“可能”真实的自然推理，故事的理解者随地都会做这种推理。\n\
  \n## 程序本身\n\n### 脚本结构\n\n本节描述了脚本结构的一些重要特征。我们将回到地铁脚本作为说明。\n\n一次“标准”的地铁之旅是什么样子的（例如在纽约）？乘客进入车站并走向闸机。接下来，乘客投入代币，通过闸机，前往合适的站台。最后，火车来了。乘客上车并找到座位。经过几站后，到达目的地，乘客离开火车并离开车站。\n\
  \n这种刻板的事件序列是地铁脚本 `$SSUBWAY` 的“骨干”，正如纽约数百万通勤者所理解和使用的那样，在其他城市也是如此（略有不同）。在每种情况下，我们都有一个组织（地铁公司或局）向公众提供某种交通服务以换取费用。在基础地铁脚本中，有一组角色（“角色”/roles）；他们在处理事务时使用的物体（“道具”/props）；以及脚本活动发生的地点（“设置”/settings）。脚本的角色、道具和设置共同组成了脚本变量（`variables`），这些变量与故事所包含的现实世界人物、地点和事物相匹配。（带有\
  \ `$` 前缀的大写名称表示脚本，带有 `$` 前缀的名字表示脚本中的某个角色。因此，`DRIVER` 将是公交脚本 `$BUS` 中的“驾驶员”角色。）\n\
  \n以下是地铁脚本的角色列表：\n\n| `& PATGRP` | 一组地铁乘客 |\n| `& CASHIER` | 收银员 |\n| `& CONDUCTOR`\
  \ | 列车员 |\n| `& DRIVER` | 控制火车的人 |\n| `& SUBORG` | 地铁组织 |\n\n填充脚本角色的形象产生者（PPs）必须属于概念依赖（Conceptual\
  \ Dependency）中“原始的”、更高层次的 PP 类之一。例如，`$SUBWAY` 中的乘客角色必须由“人”或“群体”类的 PP 填充，因为我们希望能够接受“约翰·史密斯”（John\
  \ Smith）和“史密斯夫妇”作为角色填充物。例如，提供服务的地铁公司（如“BMT 线”）必须属于“组织”类。\n\n脚本的设置是脚本事件发生的地点。设置属于\
  \ PP 类“位置”（locale）。在 `$SUBWAY` 中，三个最重要的设置是起点站、乘客乘坐的车厢内部以及终点站。脚本的道具与脚本的角色或设置相关。前者的例子是微小物体，如代币和硬币（PP\
  \ 类“金钱”），人们处理并携带它们。后者在设置中具有家具（furniture）的功能。例如，收银台和闸机是平台上的家具。（这些 PP 是物理实体。）地铁脚本中的一个特殊道具是火车本身。这是一个结构化物理实体的例子，它的部分（车厢）是脚本活动的重要地点。`$SUBWAY`\
  \ 的道具包括：\n\n| `& TOKEN` | 代币 |\n| `& FARE` | 为代币支付的费用 |\n| `& TURNSTILE` | 闸机 |\n\
  | `& PLATSEAT` | 平台上的座位 |\n| `& SUBWAY` | 火车本身 |\n| `& SUBWAYCAR` | 其中一节车厢 |\n|\
  \ `& CARSEAT` | 车上的座位 |\n| `& STRAP` | 乘客抓手 |\n| `& EXITGATE` | 通往目的地平台的出口 |\n\n\
  `$SUBWAY` 最重要的部分是它的事件，涉及角色、道具和设置。一个例子是乘客向收银台的收银员交钱。所有脚本中的事件都基于单一的 ACT 或 STATE 原语，由相应的脚本变量填充概念结构。上述描述的事件如下：\n\
  \n```\n((ACTOR & PATGRP < = > (*ATRANS*)\n OBJECT & FARE TO & CASHIER))\n```\n\n\
  这使用了 CD 动作原语 `ATRANS`，它表示所有权或权的转移。\n\n关于脚本中的事件需要强调几点。首先，它们是不分语言的。事件的表示提供了一个规范形式，SAM\
  \ 的分析器将许多在概念上“等价”的表面字符串或输入映射到此处。无论句子是“约翰给了收银员 50 分”、“收银员从约翰那里拿了 50 分”还是“收银员从约翰那里收了\
  \ 50 分”，我们都使用相同的形式。因此，使用 CD 表示极大地缩小了脚本规模，因为只需要考虑句子的概念内容。它减少了 SAM 需要的处理量，因为需要的推理可以直接链接到概念事件，而不需要为每个“等价”的表面字符串重复编写。\n\
  \n\n\n\n关于脚本事件的另一点是，它们既包含了“常数”部分（例如上述示例中的 `ACTOR` 和 `ATRANS`），也包含了“变量”部分（例如 `& PATGRP`\
  \ 和 `& FARE`）。因此，每个事件实际上都是一个 `pattern`（模式）——用于匹配任意范围现实世界事件的数据结构。例如，公众中的任何成员都可以乘坐地铁，因此脚本事件中相应的槽位不能是固定的，而必须接受故事中出现的任何个人或群体。在“在地铁向收银员支付”这一活动中，我们需要一种方法来指定那些始终为真的事物。例如，该事件涉及一个人将某笔钱交给另一个作为地铁机构代理的人员。我们还必须考虑到那些在细节上可能变化的事物。票价可能表现为“五十分”或“半美元”，可能是“约翰”支付收银员，也可能是“约翰和玛丽”支付。\n\
  \n在模式匹配的一种常见形式中，脚本角色与故事提到的个人或组织进行比较。以下是一个以 PP-Memory 中属性列表（property-list）格式存在的典型人的定义：\n\
  \n> “Marcus Welby 博士，53 岁，纽约果园街 45 号”\n\n> ```\n HUM0:\n CLASS (#PERSON)\n TITLE\
  \ (DOCTOR)\n OCCUPATION (*MD*)\n (PERSNAME (MARCUS)\n SURNAME (WELBY)\n AGE (53)\n\
  \ GENDER (*MASC*)\n RESIDENCE (LOCO)\n LOC0:\n CLASS (#LOCALE)\n LOCTYPE (*ADDRESS*)\n\
  \ STREETNUMBER (45)\n STREETNAME (ORCHARD STREET)\n POLITY (POLO)\n POL0:\n CLASS\
  \ (#POLITY)\n POLTYPE (*MUNIC*)\n POLNAME (NEW YORK)\n ```\n```\n\n（（我们假设“Marcus\
  \ Welby”是一个 PP-Memory 已知的永久标记。这是在 `OCCUPATION` 属性下指定“医学博士”的依据。同样，“纽约”被认为是一个城市。）\n\
  \n假设 Marcus Welby 正在乘坐地铁。在某个时刻，标记 `HUM0` 可能会与脚本中乘客角色的变量 `& PATGRP` 匹配。该脚本变量有以下属性列表定义：\n\
  \n```\n & PATGRP:\n CLASS (# PERSON #GROUP)\n DUMMY T\n SFUNCTION (*NONE*)\n```\n\
  \n这意味着原子 `& PATGRP` 是一个哑元变量，绑定到属于 PP 类“人”或“群体”的 PP。由于 Welby 是一个人，所以到目前为止一切正常。`SFUNCTION`\
  \ 属性规定，在脚本中填充此角色的 PP 不能在脚本中具有其他功能（即：地铁乘客不能与地铁司机是同）。人们可能具有的功能指示可以在相应标记的 `OCCUPATION`\
  \ 和 `FUNCTION` 属性中找到。在这里，职业 `MD` 并不是 `$SUBWAY` 内部的职业，因此该 PP 检查通过。然而，如果该 PP 是“司机\
  \ Marcus Welby”，那么该标记将包含一个 `FUNCTION`（功能）标志（`*DRIVER*`），此时 Welby 作为地铁“司机”的可能角色将阻止该\
  \ PP 作为乘客角色的实例被接受。\n\n这个脚本变量与可能实例化它的真实 PP 之间关系的简单示例说明了关于脚本中角色和道具（props）的两个基本事实。首先是观察到它们是“抽象的”或“泛义的”。Welby\
  \ 是一个成年男性并不重要，因为各种人都会乘坐地铁。这引出了第二个事实，即脚本变量实际上是由 `function`（功能）定义的。专注于人们在做什么以及物体是做什么用的（这可以被称为“片段式”方法），而不是关注它们作为代表各种抽象类别的特征束的结构细节（“语义化”方法），在心理学上是有意义的。例如，当被问及服务员是什么时，人们总是根据某些功能基础回答，例如“一个在餐厅里点菜并给人们送上食物的人”。\n\
  \n定义模式的基本思想是仅包含唯一标识事件所需的最少信息。考虑以下事件的模式：\n\n> “乘客进入站站”\n\n> ```\n ((ACTOR & PATGRP\
  \ < = > (*PTRANS*)\n OBJECT & PATGRP\n TO (*INSIDE* PART & STATION1))\n ```\n```\n\
  \n该模式将由对应于输入的概念化进行匹配：\n\n1. 约翰和玛丽进入了一个地铁站。\n2. 约翰走进了一个地铁站。\n3. 约翰从一家餐厅走出来，过街进入了一个地铁站。\n\
  4. 约翰进入了 BMT。\n\n示例 (a) 会实例化该模式，因为正如我们在上面解释的，约翰和玛丽形成了一个在功能上没有区别的群体。在示例 (b) 中，模式会认为约翰“走”进地铁站是不值一道的；如果约翰是“闲逛”的、“漫步”的、“跑步”的甚至是“踩滑板进入”，它也会创建相同的概念化。在\
  \ (c) 中，约翰从哪里来对 `$SUBWAY` 来说并不重要，尽管在这种情况下，它会向 `$RESTAURANT`（假设此时处于激活状态）发出一个信号，表示在\
  \ `$SUBWAY` 开启之前应该关闭该脚本。最后， (d) 会实例化该模式，因为 PP-Memory 中包含一个代表“BMT”的永久标记，该标记被标记为地铁机构。\n\
  \n一类可以说明所有这些模式的重要模式类是脚本的*headers*（头部）。脚本头部是那些将“调用”或“启动”脚本的事件的模式集合。每个头部都有关于在特定语文中接下来会发生什么的预测集；如果脚本尚未被目前为止的概念化访问，那么这些模式（以及这些预测）就是活动内存中唯一的模式。\n\
  \n定义脚本头部的基本规则是需要一个完整的事件来引入脚本的使用。也就是说，为了让脚本实例化，必须识别出一个概念化，而不仅仅是一个 PP。例如，不能因为提到了“餐厅”就调用\
  \ `$RESTAURANT`。这并不是说与脚本相关的信息应该被完全抑制，因为它们在理解的后续阶段可能很有用。例如，在“我在餐馆遇到了一位卡车司机”中，记住此人在\
  \ `$TRUCK` 中的角色对于理解他可能会说什么或做什么至关重要。\n\n概念化不仅可以通过表面句产生，还可以通过某些类型的介词短语产生。这些短语可以通过修改主事件的时间或地点设置来作为完整的想法。考虑以下句子：\n\
  \n> 玛丽在事故中去世。\n\n上面的句子可以大致改写为“当事故发生时，玛丽去世了。”玛丽去世的顶层事件与“事故”处于某种时间关系中。因此，仅仅“在事故中”这个介词短语就足以创建一个调用整个事故脚本的概念化。\n\
  \n\n\n\n脚本头部（Script headers）共有四种，根据它们对关联上下文实例化的预测强度进行排序。第一类型被称为`前置条件头部`（precondition\
  \ header，简称 `PH`），因为它根据文本中提到的主脚本前置条件来触发脚本。（前置条件是一个重要的全局条件，`SAM` 在激活脚本时假设该条件为真，除非文中另有说明。）例如，“约翰饿了”这句话是\
  \ `$RESTAURANT` 的 `PH`，因为它是脚本主概念化（`INGEST food`，进食）的触发条件。一个同时能够访问脚本和计划的故事理解者会预测（尽管这是一个较弱的预测）$RESTAURANT`\
  \ 会出现，因为这被认为是获得食物供应的常用手段（即一种计划）。相关的 `PH` 是脚本通常被认为实现的目标的实际陈述，或者可以从该陈述中容易推出该目标。在“约翰想吃一个汉堡”或“约翰想吃一些意大利菜”中，推导到脚本前置条件的推理链相对直接。`PH`\
  \ 的模式显式地存储在脚本中，因为 `SAM` 并不具备使用计划的能力。\n\n第二种头部类型对关联上下文做出比 `PH` 更强的预测，是`工具性头部`（instrumental\
  \ header，简称 `IH`）。`IH` 通常出现在引用两个或多个脚本的输入中，其中至少一个可以解释为其他脚本的“工具”。例如，在“约翰乘地铁去餐厅”中，$SUBWAY`\
  \ 和 `$RESTAURANT` 都会被预测，因为关于其中任何一个后续输入都完全合理。在这里，对 `$RESTAURANT` 的引用是预见性的，而 `$SUBWAY`\
  \ 则是到达某些地点的认可工具手段，在这些地点可以预期完成更重要的脚本目标。\n\n脚本的时间-地点设置的概念引入了第三种也是预测性最强的头部类型：`位置头部`（locale\
  \ header，简称 `LH`）。许多组织都有一个“居住地”或“营业场所”，他们在那里特征性地开展活动。他们可能拥有独特设计的装饰或建筑（例如，当铺铺的招牌、理发店灯或麦当劳的金色拱门），向世界信号他们的脚本。当理解者读到某个演员在居住地附近，或者最好是在居住地内部时，其对脚本发生的预期会随之增强。`LH`\
  \ 的示例包括“约翰去足球场”和“约翰进入现代艺术博物馆”。\n\n最后一种头部是关于脚本已发生的平铺断言。示例包括：\n\n* 发生了一起车祸。\n* 发生了地震。\n\
  * 约翰去度假了。\n* 玛丽去乘帆海了。\n\n这样的`直接头部`（direct header，简称 `DH`）是脚本中的顶层模式。`DH` 总是上下文中首先被检查的模式，因为它们具有最大的预测能力。它们总是会被检查，因为句子（尤其是来自新闻报道的句子）可能使用它们来填充脚本的角色或其他属性。考虑一下短语，例如：“两车相撞”、“一场剧烈的飓风”、“为期三天的国访问”。\n\
  \n以下是地铁脚本的头部：\n\n```\n SBIN1: [Direct Header]\n ((< = > (SSUBWAY MAIN & PATGRP PTRORG\
  \ & SUBORG\n ORIG & ORIG DEST & DEST)))\nSBIN2: [Locale Header]\n ((ACTOR & PATGRP\
  \ < = > (*PTRANS*)\n OBJECT & PATGRP\n TO (*INSIDE* PART & STATION1)))\nSBIN3: [Instrumental\
  \ Header]\n ((ACTOR & SUBORG < = > (*PTRANS*)\n OBJECT & PATGRP\n TO (*PROX* PART\
  \ & DEST)))\nSBIN4: [Precondition Header]\n ((CON ((ACTOR & PATGRP <=> (*PTRANS*)\n\
  \ OBJECT & PATGRP\n TO (*PROX* PART & DEST)))\n IS (*GOAL* PART & PATGRP)))\n```\n\
  \n`DH` 旨在处理对应于“约翰乘地铁去康尼岛”等输入的概念化。`LH` 处理诸如“约翰走进 Boro Hall 地铁站”之类的句子。`IH` 将处理如“IRT\
  \ 公司将约翰带到了谢亚体育场”之类的概念化。最后，`PH` 将匹配如“约翰想去市中心”等句子的概念化。\n\n脚本中的活动是定型化的。事件以少数几种公认的方式之一相继发生。例如，进入地铁站后，乘客可能会直接走向闸机，也可能会停下来买票。描述其中一种广为人知的活动的事件模式链被称为`片段`（episode）。“买票”是一个由以下事件组成的片段：“进入车站”、“看到售务窗口”、“前往那里”、“索要车票”、“被票价”和“支付票价”。注意，脚本要求在交付车票*之前*支付票价。这就是该片段在地铁脚本中始终的结构，尽管在其他脚本中（例如人们买冰淇淋筒时），动作可以是反的。\n\
  \n每个片段都有一个主概念化，或称 `Maincon`，它是片段的目标或核心点。`$SUBWAY` 的片段（标记为“E”））和 `Maincons`（标记为“M”））如图\
  \ 5.3\n\n图 5.3 地铁脚本的片段。\n\n在图 5.3 中，(1) 处的分支导致了后续片段 `E2` 和 `E3`，它们描述了通过闸机的不同方式。这种类型的分支被称为`转折点`（turning\
  \ point）。(2) 和 (3) 处的“循环”是针对片段 `E5` 和 `E7` 的，即对于可能会连续发生的事件。\n\n人们可以将从进入地铁到离开目的地的所有事件合并为一个单一片段。然而，如果我们这样做，显然忽略了重要的事实。地铁行程的某些部分比其他部分更重要、更核心。例如，买票是\
  \ `$SUBWAY` 中的一项重要活动，因为没有票就无法通过闸机。相反，在站台上坐下并不重要。另一个事实是有时有不同的方法。在上前持有票、在柜台索要或向售务员出通行证都是获得乘坐机会的可能性。在这种情况下，我们有一组看似在一起的片段。\n\
  \n脚本中让我们识别出脚本已实例化的必须发生的活动被称为`场景`（scenes）。`SSUBWAY` 的场景是：\n\n| $SUBWAYENTER | 进入车站并在站台等待\
  \ |\n| $SUBWAYRIDE | 进入列车并前往目的地 |\n| $SUBWAYEXIT | 在目的地离开车站 |\n\n“进入”（包括购买和使用票）是地铁脚本的一个场景，因为获得乘坐机会是必要的。“乘坐”是一个场景，因为这是脚本所关注的运输活动。“离开”是一个场景，因为在乘客离开车站之前，我们无法确定行程已经结束。\n\
  \n脚本的每个场景由一组片段定义，这些片段（1）描述了场景中重要活动发生的不同方式，2）描述了其他不那么重要的动作，例如在站台上坐下，这些动作可以与主片段关联，但并不直接有助于于它们的完成。在场景名称前使用“$”是为了暗示每个场景（每个组件片段）都共享其所属脚本的一些特征。\n\
  \n### 应用脚本\n\n\n\n\n\n`Script Applier` 尝试通过引入其拥有的“最大的”、最具包容性的脚本来理解一个故事，该脚本由故事中的第一个概念化所启动。当每个输入的概念化在脚本中被识别时，`Script\
  \ Applier` 就会对未来的输入做出预测。这个循环一直持续，直到系统接收到一个不指向任何预测事件的输入。此时，它会再次引入由输入启动的最大的脚本，跨脚本接口匹配角色和道具，检查新脚本的任何前提条件（如果有），并开始在新语境中匹配输入。\n\
  \n为了说明 `Script Applier` 模式匹配、实例化和预测的循环，考虑 `SAM` 对这个简单故事的处理：\n\n> 约翰·史密斯（John Smith）决定去博物馆。地铁将史密斯带到了曼哈顿。他在第五大道上漫步，进入了大都会博物馆。他给了收银员五十美分钱。他看了一些雕塑。然后，他看了一些画作。稍晚些，他回了家。\n\
  \n### 初始化概念化\n理解故事的第一步是内化由 `Analyzer` 产生的概念化。这意味着 `SAM` 将为该概念化分配内存使用的内部标签（如下文中的\
  \ `GN`），并填充任何已知的令牌（tokens）。因此，分析之后，上述故事的第一句如下：\n\n```\n “John Smith decided to go\
  \ to a museum.”\nGN0:\n ((ACTOR GN1 < = > (*MBUILD*) to (*CP* PART GN1)\n MOBJECT\
  \ GN2))\nGN2:\n ((ACTOR GN1 <=> (*PTRANS*) OBJECT GN1\n TO (*PROX* PART GN3)))\n\
  GN1:\n (#PERSON PERSNAME (JOHN) SURNAME (SMITH))\nGN3:\n (#ORGANIZATION ORGOCC ($MUSEUM)\
  \ REF (INDEF))\n```\n\n`PP-Memory` 将列表结构（#PERSON…` 和 `^ORGANIZATION…`）替换为具有相应属性的令牌：\n\
  \n```\n “John Smith” HUM0:\n CLASS (#PERSON)\n PERSNAME (JOHN)\n SURNAME (SMITH)\n\
  “a museum” ORGO:\n CLASS (#ORGANIZATION)\n ORGOCC (MUSEUM)\n REF (INDEF)\n```\n\n\
  然后，`PP-Memory` 尝试将新创建令牌与与其中已存在的令牌进行匹配：对于始终存在的常用 `PP` 使用“永久”令牌；以及在目前为止阅读故事过程中创建的令牌。假设“John\
  \ Smith”不是 `SAM` 熟知的特殊人物，`PP-Memory` 此时无法识别这两个 `PP`。`REF (INDEF)` 标记由 `Analyzer`\
  \ 留存，告诉 `PP-Memory` 不要从现有实体中寻找该 `PP` 的指代对象。\n\n### 脚本匹配与分解\n接下来，`PP-Memory` 将博物馆脚本（$MUSEUM`）标记为供\
  \ `Script Applier` 测试的建议脚本。随后，令牌化的概念化被传递给 `Script Applier`。`Script Applier` 将概念化分解为仅包含单个\
  \ `CD ACT` 或 `STATE` 的子概念化。该过程的结果是一个简单概念化的列表，它保留了事件之间的时间顺序或因果顺序。\n\n为了计算连接的因果链结果，需要简单的概念化模式。例如，`PTRANS`\
  \ 的因果结果是 `PTRANSed` 的 `OBJECT` 位置发生。任何语言中的句子都会以任意复杂的方式将简单的概念化聚集在一起。例如，考虑 `Analyzer`\
  \ 为以下句子构建的 `CD` 结构：\n\n```\n Mary Jones died Tuesday of head injuries received in\
  \ a car accident on Sunday.\n ((CON GN1 LEADTO GN2))\nGN1: ((ACTOR GN5 TOWARD (*PSTATE*\
  \ VAL (*NEGVAL*))\n REL GN3))\nGN2: ((ACTOR GN6 TOWARD (*HEALTH* VAL (−10))) TIME\
  \ (TIM2))\nT1M2: ((WEEKDAY TUESDAY))\nGN3: ((CON GN4 LEADTO GN1))\nGN4: ((< = >\
  \ ($VEHACCIDENT VEHICLE GN7)) TIME (TIM4))\nTIM4: ((WEEKDAY SUNDAY))\nGN5: (#BODYPART\
  \ TYPE (*HEAD*))\nGN6: (#PERSON PERSNAME (MARY) SURNAME (JONES) GENDER (*FEM*))\n\
  GN7: (#PHYSOBJ TYPE (*CAR*))\n```\n\n这个概念化基本上表示：身体部位（根据推断属于玛丽·琼斯）物理状态的负面变化导致了她健康状况的终极变化，且这种物理变化是由\
  \ `$VEHACCIDENT` 造成的。分解过程将产生有序的简单概念化列表：“发生了一场车祸”、“发生了头部受伤”以及“玛丽·琼斯去世了”。在一个包含上述句子故事中，`SAM`\
  \ 将尝试按照指定的顺序定位每个单元事件。将简单概念化放入“叙事顺序”中利用了脚本自然的因果/时间顺序。每个新的概念化都预期将根据早先输入建立的预测被找到。\n\
  \n### 脚本数据结构\n在理解故事的过程中，`Script Applier` 维护着描述系统中存在的每个脚本状态的数据结构。这些信息形成了一个*脚本语境*（script\
  \ context），如果脚本处于激活状态，每当发现新的概念化符合该语境时，它就会更新。每个脚本语境由以下部分定义：内存中的脚本模式列表；绑定到脚本变量的令牌关联列表；脚本中最后匹配的模式名称；当前内存中的脚本剧片段（episodes）列表；该脚本实例的头部信息；以及一个\
  \ `Applier` 用来标记推断概率的脚本全局强度指示器。\n\n\n\n\n当前的故事表示为变量 `!STORY`。SAM 现在已将 `!STORY` 设置为\
  \ `$TRIP`，这是当前激活的最全局脚本，并将 `$TRIP` 添加到激活脚本列表中。`$TRIP` 的目标段（`$GOALTRIP`）被设置为 `$MUSEUM`。由于\
  \ `$MUSEUM` 是由预置条件头部（“desired”）启动的，我们可能会听到关于 `$TRIP` 的出发段 `$GOTRIP` 的信息。此时，SAM 已经准备好了适用于\
  \ `$GOTRIP` 以及 `$MUSEUM` 的模式。`$GOTRIP` 被设置为一组适合人员移动的脚本，即涉及其 `Maincons` 包含 `PTRANS`\
  \ 的人员和组织的脚本。“约翰·史密（John Smith）”在 `$MUSEUM` 和 `$TRIP` 中都被分配了主角的角色。\n\n此时，若干处理结构已经部分构建完成。在顶层，故事被假设为一个\
  \ `$TRIP`。`$TRIP` 目前处于出发段（go-segment）。出发段尚未指定，但预计将通过 `PTRANS`脚本之间的顺序连接来实例化。目标段预计将由\
  \ `$MUSEUM` 的顺序实例化，以及可能其他适合旅行“目标”活动的脚本组成。返回段（return-segment）也将从 `PTRANS`脚本中选出的顺序安排。最后，`$MUSEUM`\
  \ 的实例化可能包含 `$BATHROOM` 和 `$RESTAURANT` 的实例化。因此，全局故事表示 `!STORY` 具有以下属性列表结构：\n\n```\n\
  \ !STORY: (SEQ SCLAB1)\nSCLAB1: (SEQ SCLAB2 SCLAB3 SCLAB4)\n scriptname: $TRIP\n\
  \ scriptseg: $GOTRIP\nSCLAB2: (SEQ)\n scriptname: $GOTRIP\n scriptq: ($BUS $SUBWAY\
  \ $TRAIN $DRIVE $WALK)\nSCLAB3: (SEQ SCLAB5)\n scriptname: $GOALTRIP\n scriptq:\
  \ ($MUSEUM $RESTAURANT $MOVIE $THEATER\n $VARIETY STORE)\nSCLAB4: (SEQ)\n scriptname:\
  \ $RETURNTRIP\n scriptq: ($BUS $SUBWAY $TRAIN $DRIVE $WALK)\nSCLAB5:\n scriptname:\
  \ $MUSEUM\n scriptq: ($BATHROOM $RESTAURANT)\n```\n\n引入 `$TRIP` 的这种方法部分“隐藏”了适用于\
  \ `$MUSEUM` 的活动。当前的激活脚本列表为 (`$TRIP $GOTRIP $MUSEUM`)。由于引导上下文选择的全局搜索列表是从激活脚本全局构建的，将首先查看适用于\
  \ `$TRIP` 的模式，然后是 `$GOTRIP` 的模式，最后是 `$MUSEUM` 的模式。因此，脚本搜索列表具有如下结构：\n\n```\n $TRIP\n\
  \ $BUS $SUBWAY $TRAIN $DRIVE\n $MUSEUM\n $BATHROOM $RESTAURANT\n```\n\n匹配故事第一句底层概念化的预置条件头部模式为：\n\
  \n```\n ((ACTOR & MGRP < = > (*MBUILD*) TO (*CP* PART & MGRP)\n MOBJECT\n ((ACTOR\
  \ & MGRP <=> (*PTRANS*)\n OBJECT & MGRP\n TO (*PROX* PART & MORG)))))\nEXPLICIT\
  \ (& MORG)\n```\n\n变量 `& MGRP` 是 `$MUSEUM` 的主角，即一组在（可能只有一个人）在 `$MUSEUM` 中没有功能且将在该脚本中作为“公众”表演的人。`&\
  \ MORG` 是一个代表博物馆组织的变量，即向公众提供此类服务的“执行者”。模式上的 `EXPLICIT` 属性表示博物馆组织必须在输入概念化中显式地出现。这避免了在诸如“约翰决定去”之类的输入上产生虚假匹配。\n\
  \n匹配的第一阶段包括对句子概念化中的“常量”部分与模式的常量部分进行比较。在 `PP-Memory` 处理完该句子后，故事第一句的概念化完整形式为：\n\n\
  ```\n “John Smith decided to go to a museum.”\nMEM1:\n ((ACTOR HUM1 < = > (*MBUILD*)\n\
  \ TO (*CP* PART HUM1)\n FROM (NIL)\n INST (NIL)\n MOBJECT MEM2)\n TIME (TIM1) MODE\
  \ (NIL) MANNER (NIL))\nTIM1: ((BEFORE *NOW* X))\nMEM2:\n ((ACTOR HUM1 < = > (*PTRANS*)\
  \ OBJECT HUM1\n TO (*PROX* PART ORG1)\n FROM (NIL)\n INST (NIL))\n TIME (TIM2) MODE\
  \ (NIL) MANNER (NIL))\nTIM2: ((VAL GN0))\nHUM1: John Smith”\nORG1: “a museum”\n\
  ```\n\n注意，许多“槽位”，例如 `PTRANS` 的 `INSTrument`（约翰是如何去的）被留空了（`NIL`），因为句子没有明确提到它们。\n\n\
  骨干匹配（backbone match）中的基本规则是：(1) 模式指定的“字面”角色和填充内容必须出现在输入中；(2) 忽略输入中额外的角色和填充内容；(3)\
  \ 占位符（dummy）每次在模式中出现时都必须与同一个概念簇匹配；以及(4) 输入中的空填充槽位匹配任何内容，除非模式使用 `EXPLICIT` 属性要求填充内容必须显式存在。\n\
  \n由于模式不包含工具（instrumentals），且不在乎约翰从哪里决定，因此这些角色不会被检查。由于要作为 `PTRANS` 的 `OBJECT` 与 `MBUILD`\
  \ 的 `ACTOR` 相同，我们避免了在诸如“约翰决定向博物馆扔一个球”之类的句子上产生虚假匹配。最后，由于 `& MORG` 上的 `EXPLICIT` 标记，如果对应的槽位为\
  \ (`NIL`)，则骨干匹配将失败。如果句子是“约翰决定去”，这将中止匹配。\n\n成功的骨干匹配的结果是 PP 绑定到变量的列表。匹配过程的下一步是检查候选对象是否确实可以属于这些变量。将变量拟合到\
  \ PP 的通用过程被称为 `Rolefit`。当变量之前已通过 `Rolefit` 绑定到一个标记（token）时，拟合过程必须增加检查，以确保新的 PP 既可以是该变量的实例，也是旧标记的实例。这一过程是\
  \ SAM 中指指规范（Reference Specification）的体现，被称为 `Rolemerge`。\n\n此示例中的 `Rolefit` 涉及 PP\
  \ 和标记的概念类标记的交集，并检查变量所指定的*功能*是否可以由 PP 执行。`& MGRP` 可以是一个人也可以是一组，因为我们希望脚本能够处理如“约翰和玛丽去了博物馆”这样的情况。“博物馆”精确匹配\
  \ `& MORG` 指定的类。这种对 PP 类的初步检查的目的是快速判断候选 PP 是否显然无法填充指定的角色。\n\n功能的检查也由于 PP 类的存在而变得便利。每个类的特征之一是它可能包含的功能指示在某种程度上是该类所有的。对于人，头衔或职业标记强烈暗示了该人在语境中具有的功能。对于组织，相关的脚本（以及它指向的子脚本和父脚本）是功能的主要指示。然而，物理对象通常在多个脚本中都有功能。例如，汽车在驾驶情况下可以充当“车辆”，在汽车展厅情况下可以充当“销售对象”。对“汽车”的输入引用映射到形式为\
  \ (`#STRUCTURE TYPE (*CAR*)`) 的概念结构，其中对 `*CAR` 的引用是 `PP-Memory` 对普通汽车掌握的功能和其他信息的簇简写：\n\
  \n```\n *CAR*: CLASS (#STRUCTURE)\n SCRIPTROLES ((& VEHICLE1 . $DRIVE)\n (& SALE-OBJ\
  \ . $AUTOSHOWROOM))\n```\n\n\n\n图像生产者（Picture Producers，简称 PP）根据功能拟合脚本。因此，仅通过特征进行简单比较可能不足以确定一个\
  \ PP 是否可以作为变量的实例。例如，在 `$VEHACCIDENT` 中的“阻碍”角色，以及 `$VIPVISIT` 中的“访问贵宾小组”角色就是如此。当面对这些复杂函数时，`Script\
  \ Applier` 会采用一种模式导向的函数调用形式，检查输入以及待定变量绑定的关联列表以判断适用性。例如，在访问访问的背景下，有一个头部模式在寻找 VIP\
  \ 的到达。如果实际上有一组人到达，该模式将调用一个函数在小组成员中进行搜索，以查看他们是否有人符合 VIP 的身份。这是区分 `$VIPVISIT` 与旅行情况的其他表现形式（如\
  \ `$VACATION` 或 `$BUSINESSTRIP`）的唯一方法。在匹配时调用的函数的一个特点是它们没有真实的副作用。如果匹配失败，一切均如初。\n\n\
  将新的 PP 拟合到从之前的概念化绑定到 PP 的脚本变量的过程被称为 `Rolemerge`。请注意，`Rolemerge` 实际上可以在 SAM 的两个不同地方实现：在\
  \ `PP-Memory` 中或 `Script Applier` 内部。然而，主要的引用处理器是 `Script Applier`，因为在 PP 本身提供的信息不足以做出决策的情况下，该模块可能充当\
  \ `PP-Memory` 的“后盾”。在后的情况下，`Applier` 可以做出所需的引用，因为它拥有来自所匹配的预测模式的额外信息。\n\n当 `Analyzer`\
  \ 读取到如“他”或“那个男人”之类的确定引用时，它会产生一个带有 `(REF (DEF))` 注的 PP。这是执行 `Rolemerge` 的信号。例如，“他”被映射为\
  \ `(#PERSON GENDER (*MASC*) REF (DEF))`。\n\n这个处理标记首先被 PP-memory 看到，它会在已存在的标记、在当前概念化处理期间创建的标记、或在其永久性标记集合中寻找指代对象。如果该\
  \ PP 是永久性标记，`PP-Memory` 会建立连接并关闭处理建议。随后，`Script Applier` 将像引用是不定的一一样搜索该 PP。假设，我们故事的第二句提到的是“BMT”而不是“地铁”。那么\
  \ `BMT` 的 PP 将匹配预测的地铁 PP。\n\n每当匹配一个模式时，关联脚本上的“窗口”必须移动，以符合脚本对接下来将发生什么的预期。预测过程有两个不同的阶段：(1)\
  \ 从活动内存中清除指向当前匹配模式之前的事件的模式；(2) 引入包含当前模式所预测模式的片段（episodes）。不需要模式的移除是通过查询脚本的永久内存结构完成的，以确定内存中哪些场景先于当前活动场景。\n\
  \n在上面的故事中，在读取第一句后，$TRIP` 激活状态。`STRIP` 是由出发、目标和返回片段组成的线性序列，用相应的事件填充了这些片段。故事的“概念”结构是：\n\
  \n| | $TRIP | | | |\n| $GOTRIP | $GOALTRIP | $RETURNTRIP | |\n| $SUBWAY | $MUSEUM\
  \ | $SUBWAY | | |\n\n这个故事的处理将在多个时间点涉及其组件脚本的预测：`$SUBWAY` 和 `$MUSEUM`。但还有来自情况的预测，超出了组件脚本提供的范围。例如，`STRIP`\
  \ 情况预测了在每个片段中将只使用某些脚本。例如，它最初规定只引用个人和组织的 `PTRANS` 脚本。你必须到达某件“重要”事情发生的地方才能参与其中。此外，文本可以泛指某次旅行而不填充过多的细节。考虑一下，例如，“乘坐火车旅行”、“去度假”或“从迈阿密回来”意味着什么。\n\
  \n在 SAM 中，当借助情况读取一个故事时，它的预测是第一个被查看的。处理完故事的第一句后，`STRIP` 的 `SGOTRIP` 片段处于激活状态。\n\n\
  当一个预测模式接受了当前输入时，输入已在脚本内被“识别”，并构建了一个连接上一个输入与新一个连接的因果链。这条链包含了根据已读取的输入可以合理推断为已发生的事件。`Script\
  \ Applier` 通过检查存储在永久内存中用于活动脚本的片段结构来构建因果链。假设，我们读到：\n\n> Smith 进了 BMT。他坐火车前往市中心。\n\
  \n第一句实例化了来自进入场景（即 `$SUBWAY` 的 `$SUBWAYENTER`）中的一个事件，并激活了该脚本。第二句实现了 `$SUBWAY` 的 `Maincon`，它是\
  \ `$SUBWAYRIDE` 的一部分。如果片段位于同一个场景，则 `Applier` 搜索早期事件的因果后继者，留在片段的主路径上，直到找到后续事件。在查看任何给定的主路径事件时，`Applier`\
  \ 还会检查来自它的直接推理（前向或反向）。\n\n如果原始事件位于不同的场景，`Applier` 将较早事件连接到前一个场景的“默认” `Exitcon`，将后续事件连接到后续场景的默认\
  \ `Entrycon`，并用中间场景的默认路径连接这两个场景。由于 `$SUBWAYENTER` 和 `$SUBWAYRIDE` 是相邻场景，只需要 `Exitcon`\
  \ 和 `Entrycon`。\n\n构建的事件之间的主主路径连接是一个未实例化的模式列表。`Applier` 获取此列表，并将模式中脚本变量的出现情况替换为绑定到它们上的\
  \ PP 标记。例如，在“顾客去往收银员处”的模式中：\n\n```\n((ACTOR &PATGRP < = > (*PTRANS*) OBJECT &PATGRP\
  \ TO (*PROX* PART &CASHIER)))\n```\n\n变量 `&PATGRP` 将被替换为 Smith 的标记（例如 `HUMO`）。上述模式包含一个变量\
  \ `&CASHIER`，它没有绑定到 PP，因为没有提到该角色。当这种情况发生时，我们需要一个 `Role-Instantiation` 推理，`Applier`\
  \ 会向 `PP-Memory` 请求一个具有默认适用于该角色属性的标记。在 `$SUBWAY` 激活时，`PP-Memory` 已被告知在脚本中占位置的所有变量的属性。它利用这些信息为\
  \ `Instantiator` 提供一个“收银员”的标记，其中 PP 在脚本中的位置记录在 `SROLES` 属性下：\n\n```\nHUM1:\nCLASS\
  \ (# PERSON)\nSROLES ((SSUBWAY . &CASHIER))\n```\n\n提供该标记后，模式的实现形式为：\n\n```\n((ACTOR\
  \ HUM0 < = > (*PTRANS*) OBJECT HUM0 TO (*PROX* PART HUM1)) TIME (TIME5))\n```\n\n\
  其中 `TIME5` 定义了该概念化与因果链中其他事件之间适当的时间关系。\n\n\n\n# 6 Micro SAM\n\nDOI: [10.4324/978037281476](https://doi.org/10.4324/978037281476)\n\
  \n## 引言\n\nMcSAM 是一个非常有限的脚本应用器。McSAM 最初知道在商店购物——也就是说，McSAM 有一个描述购物期间五个重要脚本：去商店、挑选物品、给商店钱以及离开商店。\n\
  \n当给 McSAM 一个故事时，例如：\n\n* 杰克去了商店。\n* 他拿了一个风筝。\n* 他回家里了。\n\n它首先确定购物脚本是相关的，然后将故事中的各个事件与购物脚本中的模式进行匹配。通过这种方式，它填充了故事中没有明确提到的事件，例如杰克给商店钱。\n\
  \nMcSAM 以概念依赖（Conceptual Dependency）形式作为输入。它将这些形式与预定义的事件序列（即脚本）进行匹配。如果形式匹配脚本中的某个事件，则该形式被理解了，即它被置于上下文中。如果形式不匹配脚本中的任何事件（或者当前没有激活的脚本），那么\
  \ McSAM 会尝试寻找另一个脚本来激活。一次只保持一个脚本激活状态。\n\n### 脚本应用示例\n\n在 McSAM 中，`SHOPPING` 脚本是以下预定义的事件序列：\n\
  \n1. 有人去商店。\n2. 他挑选了一个物品。\n3. 商店将物品的所有权转给他。\n4. 他将一些钱交给商店。\n5. 他离开了商店。\n\n假设没有脚本处于激活，且\
  \ McSam 获取了以下故事的概念依赖表示：\n\n* 杰克去了商店。\n* 他拿了一个风筝。\n* 他回家里了。\n\n那么将发生以下处理序列：\n\n1.\
  \ “杰克去了商店”——由于没有激活的脚本，这不匹配任何预测的事件。连接到“商店”底层概念的是 `SHOPPING` 脚本。因此，McSAM 激活了 `SHOPPING`\
  \ 脚本。“杰克去了商店”匹配该脚本的第一行。\n2. “他拿了一个风筝”——这被分析为“风筝的所有权转给了他”。这匹配了激活脚本的第三行。McSAM 推断出第二行必须已经发生。\n\
  3. “他回家里了”——这匹配脚本的第五行。McSAM 推断出第四行必须已经发生。\n\nMcSAM 对故事的最终理解是：\n\n* 杰克去了商店。\n* 杰克拿了一个风筝。\n\
  * 商店将风筝的所有权转给了杰克。\n* 杰克将一些钱交给商店。\n* 杰克离开了商店。\n\nMcSAM 中的脚本是一个事件的有序序列。McSAM 假设故事将以相同的顺序引用这些事件。因此，McSAM\
  \ 会跟踪哪个脚本是激活的，以及哪个事件是之前的。\n\n### 脚本与绑定\n\n当故事的第二个句子被读取时，`SUBWAY` 在 `$TRIP` 段的控制下被激活。这意味着对于“人（们）旅行”、“交通工具”和“目的地”的绑定是从\
  \ `$GOTRIP` 拷贝到 `$SUBWAY` 的。`SUBWAY` 的实例化是由该概念化涉及的若干部分实现的。首先，`SUBWAY` 的前提条件被实现。例如，脚本应用器假设\
  \ Smith 有一个令牌通过闸机去往某处。“主角色”是“Smith”，“目的地”是“商店”，这两者都已存在，因此只有“令牌”必须由 `PP-Memory` 创建。接下来，脚本应用器构建从默认\
  \ `Entry` 到 `Maincon` 的因果链，从 `PP-Memory` 获取“收银员”、“闸机”、“平台”等令牌。当故事的第三部分执行时，实例化 `Exit`\
  \ 来自 `$SUBWAY`，并且 `$SUBWAY` 被关闭。\n\n故事的第二个句子的概念化（“……他进入了博物馆。”）激活了 `$USEUM`。在此时，情况进入了目标段\
  \ `$GOALTRIP`，因为这是故事开头预测的活动。现在主角色在博物馆内部，`MUSEUM` 预测了脚本事件。其中最重要的事件之一是去某个展览的“循环”事件，并研究那里的东西。这种模式匹配故事的下一个句子：“他给了商店五十分钱。”现在主角色在博物馆内，`MUSEUM`\
  \ 预测脚本事件。“他给了商店钱”这个形式匹配了脚本的某一项。这种模式预测了另一个可能的事件实例化。\n\n故事的最后一句未能匹配 `$GOALTRIP` 或\
  \ `$USEUM` 中的任何一个预测。然而，它与 `$TRIP` 的返回段相匹配。该模式的一个角色是主角色回到起始点的交通工具。交通工具在最后一句中没有被提到，所以\
  \ `$RETURNTRIP` 假设在 `$GOTRIP`（商店）中实例化的交通工具是 Smith 用来家的。\n\n\n\n\n当输入的 CD 表单不匹配当前激活脚本中的任何模式，且\
  \ CD 表单的某些谓词或子谓词链接到某个脚本时，脚本会被激活。`STORE` 是 `PTRANS` 中 `OBJECT` 槽位的一个子谓词，是我们初始 McSAM\
  \ 数据库中唯一链接到脚本的谓词。该链接是通过 `ASSOCIATED-SCRIPT` 属性建立的。\n\n```\n (DEFPROP STORE SHOPPING\
  \ ASSOCIATED-SCRIPT)\n```\n\n这表示 `STORE` 谓词链接到了 `SHOPPING` 脚本。随后 McSAM 会尝试将 `PTRANS`\
  \ 与该脚本中的 `CD` 模式进行匹配。\n\n## 脚本角色与模式匹配\n\n当 McSAM 获取一个输入的 CD 表单（不包含任何变量）时，它会使用`模式匹配器`将输入与脚本模式进行比较。模式匹配器有两个目的：\n\
  \n1. 判断输入是否匹配某个模式。\n2. 如果发生了匹配，则告知模式中的变量应当如何绑定。\n\n例如，输入的 CD 表单\n\n```\n (PTRANS\
  \ (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (PERSON (NAME (JACK)))) (TO (STORE)))\n\
  ```\n\n匹配模式\n\n```\n (PTRANS (ACTOR ?SHOPPER) (OBJECT ?SHOPPER) (TO\n?STORE))\n\
  ```\n\n其中角色 `SHOPPER` 绑定到 `(PERSON (NAME (JACK)))`，`STORE` 绑定到 `(STORE)`。\n\n当 McSAM\
  \ 为输入寻找匹配项时，它会使用脚本绑定形式来确定目前已经绑定了哪些角色。当首次进入脚本时，绑定形式只是 `(script-name)`。例如，在“Jack 去了商店”之后，脚本绑定形式将是\
  \ `(SHOPPING)`。这表示 `SHOPPING` 是脚本，但尚未绑定任何变量。\n\n输入必须与当前生效的任何绑定匹配。因此，在“Jack 去了商店。Janet\
  \ 拿了一个风筝……”这个故事中，对第二行的分析将*不会*匹配脚本的第 3 行，因为 `SHOPPER` 会绑定到 Jack，而 Jack 并不匹配 Janet。\n\
  \n在进行匹配时如果某个变量未绑定，则该变量将立即匹配——并绑定到输入 CD 表单中的相应元素。如果匹配在其他地方没有失败，该绑定将被保留。例如，如果 `SHOPPER`\
  \ 和 `STORE` 是未绑定的，那么将 CD 表单\n\n```\n (PTRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT\
  \ (PERSON (NAME (JACK)))) (TO (STORE)))\n```\n\n与模式\n\n```\n (PTRANS (ACTOR ?SHOPPER)\
  \ (OBJECT ?SHOPPER) (TO ?STORE))\n```\n\n会将 `SHOPPER` 和 `STORE` 分别绑定到 `(PERSON (NAME\
  \ (JACK)))` 和 `(STORE)`。\n\n模式匹配器只检查模式中给出的角色对。它忽略输入 CD 中不在模式中的角色对。此外，模式匹配器假设模式中完全没有出现在输入\
  \ CD 中的角色对将能够匹配。因此，输入的 CD 表单\n\n```\n (PTRANS (ACTOR (PERSON (NAME (JACK)))))\n\
  ```\n\n匹配模式\n\n```\n (PTRANS (OBJECT (BALL)))\n```\n\n因为输入中没有 `OBJECT` 角色对，而模式中没有\
  \ `ACTOR` 角色对（此处逻辑相反）。因此，两个 CD 表单互不矛盾，匹配成功。由于模式没有说明是谁是谁 `PTRANSed` 了球，模式匹配器实际上是在说可能是\
  \ Jack。为了避免此类意外的模式匹配，请务必在内存中存储完整的 CD，并尽可能填充更多的角色。\n\n在成功匹配期间发生的任何新绑定都会添加到脚本绑定形式中，因此后续的输入必须与累积的绑定集一致。\n\
  \n## 实例化\n\n在 McSAM 将输入的 CD 与脚本事件模式匹配成功后，它就知道了脚本进展到了什么种程度。随后，McSAM 将脚本中所有跳过的事件加上刚刚读取的那个事件添加到数据库中。\n\
  \nMcSAM 通过获取脚本事件并将脚本变量的所有出现处替换为绑定值（如果有）来实现这一点。这被称为`实例化`。然后将移除变量后生成的 CD 表单添加到数据库中。\n\
  \n例如，“Jack 拿了一个风筝”的 CD 表单为\n\n```\n (ATRANS (OBJECT (KITE)) (TO (PERSON (NAME (JACK)))))\n\
  ```\n\n它匹配脚本的第 3 行：\n\n```\n (ATRANS (ACTOR ?STORE) (OBJECT ?BOUGHT)\n (FROM ?STORE)\
  \ (TO ?SHOPPER))\n```\n\n因此 McSAM 在脚本绑定形式中将 `BOUGHT` 绑定到 `(KITE)`：\n\n```\n (SHOPPING\
  \ (SHOPPER (PERSON (NAME (JACK))))\n (STORE (STORE)) (BOUGHT (KITE)))\n```\n\n脚本的第\
  \ 2 行被跳过了（“他捡了一个风筝”）：\n\n```\n (PTRANS (ACTOR ?SHOPPER) (OBJECT ?BOUGHT) (TO ?SHOPPER))\n\
  ```\n\nMcSAM 实例化了脚本的第 2 和第 3 行，向数据库添加\n\n```\n (PTRANS (ACTOR (PERSON (NAME (JACK))))\
  \ (OBJECT (KITE))\n (TO (PERSON (NAME (JACK)))))\n```\n\n以及\n\n```\n (ATRANS (ACTOR\
  \ (STORE)) (OBJECT (KITE))\n (FROM (STORE)) (TO (PERSON (NAME (JACK)))))\n```\n\n\
  注意，输入的 CD 只说 Jack 拿了一个风筝，但添加到数据库的表单（第 3 行的实例化版本）说是*商店*给了 Jack 一个风筝。\n\n## McSAM\
  \ 与 SAM\n\nMcSAM 脚本的结构过于局限。在 SAM 中，脚本是场景的序列，而场景又由事件序列组成。脚本可以有不同的事件序列，例如自己坐而不是由领位带到座位。脚本可以有可选事件，以及不同的`轨迹`，即相似但不完全相同的场景序列，例如去小餐馆而不是去高级餐厅。\n\
  \n在 Charniak, 1977，（被称为帧）是高度模块化的。帧被分为子帧，子帧又被分为其他帧。因此，一个大帧可以与其他帧共享大量信息，消除了对轨迹的需求。帧还指示了*为什么*以这种方式执行。这允许程序判断帧的可选部分。\n\
  \nMcSAM 没有构建故事意义的任何结构化表示。也就是说，McSAM 生成的数据库包含了发生的事件，但没有给出事件之间关系的指示，没有为事件标记所属的场景，等等。\n\
  \nMcSAM 对故事讲述方式的观点也太有限。它假设故事会按照事件在脚本中出现的顺序来关联。事实并非如此。例如，报纸以非常特殊的方式讨论事故等事件。首先给出整个事件的一行总结，然后是人员细节，接着是结果——即谁去了医院以及情况如何——然后是事故发生的细节，等等。SAM\
  \ 拥有关于此类故事如何撰写的信息，用于预测可能看到的下一个脚本事件。而 McSAM 只有一个简单的列表 `POSSIBLE-NEXT-EVENTS`。McSAM\
  \ 在多处模糊了脚本绑定形式和 CD 表单之间的区别。它们的格式相同，许多程序（`INSTANTIATE`、`MATCH`）并不区分它们。Ms. Malaprop\
  \ 进一步为所有谓词定义了脚本实体，包括系统的“原语”。\n\n\n\n\n最后，应当指出，McSAM 做了许多多余的工作，它将每个脚本事件的实例化都添加到了数据库中。由于脚本绑定形式包含了构建这些\
  \ CD 表单所需的所有信息，这已经是 McSAM 真正需要添加的内容。因此，你可以移除 `ADD-SCRIPT-INFO` 中对 `INSTANTIATE`\
  \ 的调用，而不会丢失任何信息。（不过，你仍然需要更新 `POSSIBLE-NEXT-EVENTS`。）当人们争论被激活的脚本是否被复制到内存中时，他们实际上是在争论——用\
  \ McSAM 的术来说——`INSTANTIATE` 是否被应用于每一个脚本模式。Ms. Malaprop 特别不会自动填充脚本事件，而是在被要求时进行计算。从\
  \ McSAM 中移除这一实例化阶段将使其更像 Ms. Malaprop。\n\n## 示例输出\n\n以下是 McSAM 程序的日志，应用于“Jack 去了商店。他买了一个风筝。他回了家。”的\
  \ CD 表单。\n\n```\n [PH: Initiation. 14-Jan-80 10:48AM]\n(PROCESS-STORY KITE-STORY)\n\
  Input is\n (PTRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (PERSON (NAME (JACK))))\n\
  \ (TO (STORE)))\nNew script SHOPPING\nMatches\n (PTRANS (ACTOR (*VAR* SHOPPER))\n\
  \ (OBJECT (*VAR* SHOPPER))\n (TO (*VAR* STORE)))\nAdding script CO\n (PTRANS (ACTOR\
  \ (PERSON (NAME (JACK))))\n (OBJECT (PERSON (NAME (JACK))))\n (TO (STORE)))\nInput\
  \ is\n (ATRANS (OBJECT (KITE)) (TO (PERSON)))\nMatches\n (ATRANS (ACTOR (*VAR* STORE))\n\
  \ (OBJECT (*VAR* BOUGHT))\n (FROM (*VAR* STORE))\n (TO (*VAR* SHOPPER)))\nAdding\
  \ script CD\n (PTRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (KITE))\n (TO (PERSON\
  \ (NAME (JACK)))))\nAdding script CD\n (ATRANS (ACTOR (STORE))\n (OBJECT (KITE))\n\
  \ (FROM (STORE))\n (TO (PERSON (NAME (JACK)))))\nInput is\n (PTRANS (ACTOR (PERSON))\
  \ (OBJECT (PERSON)) (TO (HOUSE)))\nMatches\n (PTRANS (ACTOR (*VAR* SHOPPER))\n (OBJECT\
  \ (*VAR* SHOPPER))\n (FROM (*VAR* STORE))\n (TO (*VAR* ELSEWHERE)))\nAdding script\
  \ CD\n (ATRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (MONEY))\n (FROM (PERSON\
  \ (NAME (JACK))))\n (TO (STORE)))\nAdding script CD\n (PTRANS (ACTOR (PERSON (NAME\
  \ (JACK))))\n (OBJECT (PERSON (NAME (JACK))))\n (FROM (STORE))\n (TO (HOUSE)))\n\
  Story done—final script header\n (SHOPPING (SHOPPER (PERSON (NAME (JACK))))\n (STORE\
  \ (STORE))\n (BOUGHT (KITE))\n (ELSEWHERE (HOUSE)))\nData base contains\n((PTRANS\
  \ (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (PERSON (NAME (JACK))))\n (TO (STORE)))\n\
  (PTRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (KITE))\n (TO (PERSON (NAME (JACK)))))\n\
  (ATRANS (ACTOR (STORE))\n (OBJECT (KITE))\n (FROM (STORE))\n (TO (PERSON (NAME (JACK)))))\n\
  (ATRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (MONEY))\n (FROM (PERSON (NAME\
  \ (JACK))))\n (TO (STORE)))\n(PTRANS (ACTOR (PERSON (NAME (JACK))))\n (OBJECT (PERSON\
  \ (NAME (JACK))))\n (FROM (STORE))\n (TO (HOUSE)))\n(SHOPPING (SHOPPER (PERSON (NAME\
  \ (JACK))))\n (STORE (STORE))\n (BOUGHT (KITE))\n (ELSEWHERE (HOUSE))))\n(PH: Termination.\
  \ 14-Jan-80 10:52AM. PS:<RIESBECK>SIX.LOG.4]\n```\n\n## 流程图\n\n图 6.1 显示了 McSAM 的核心功能之一：`PROCESS-CD`。该流程图包含了两个子部分\
  \ `INTEGRATE-INTO-SCRIPT` 和 `SUGGEST-NEW-SCRIPT` 的控制流。\n\n![](img/fig6_1_B.jpg)\n\
  \n图 6.1 PROCESS-CD(event).\n\n## 程序\n\n\n\n\n```\nMICRO SAM PROGRAM\n```\n\n`PROCESS-STORY`\
  \ 接收一个 CD 列表，并将每一个 CD 交给主函数 `PROCESS-CD`。在故事结束时，当前脚本会被添加到数据库中，并对数据库进行格式化打印。\n\n\
  ```lisp\n(DE PROCESS-STORY (STORY)\n  (CLEAR-SCRIPTS)\n  (FOR (CD IN STORY)\n  \
  \     (DO (MSG T “Input is”) (PRINT-CD CD)\n           (PROCESS-CD CD)\n       \
  \    (MSG T)))\n(MSG T “Story done—final script header”)\n(PRINT-CD (ADD-CD *CURRENT-SCRIPT*))\n\
  (MSG T “Data base contains”)\n(SPRINT *DATA-BASE* 1)\n```\n\n`PROCESS-CD` 每次处理故事中的一个\
  \ `CD`。语句要么是由当前脚本预测的，要么在数据库中，要么它建议了一个新脚本。\n\n```lisp\n(DE PROCESS-CD (CD)\n  (OR\
  \ (INTEGRATE-INTO-SCRIPT CD)\n      (SUGGEST-NEW-SCRIPT CD)\n      (PROGN (MSG T\
  \ “Adding”)\n             (PRINT-CD (ADD-CD CD))\n             (MSG “—not linked\
  \ to any script” T))))\n```\n\n`*DATA-BASE*` 是指向数据库的指针。\n`*CURRENT-SCRIPT*` 是当前激活的脚本。它是一个语句，以脚本名称作为谓词，以脚本变量及其绑定作为参数。\n\
  `*POSSIBLE-NEXT-EVENTS*` 是 `*CURRENT-SCRIPT*` 中尚未出现的事件列表。\n`CLEAR-SCRIPTS` 将这些全局变量重置为\
  \ NIL。\n\n```lisp\n(DE CLEAR-SCRIPTS ()\n  (SETQ *DATA-BASE* NIL)\n  (SETQ *CURRENT-SCRIPT*\
  \ NIL)\n  (SETQ *POSSIBLE-NEXT-EVENTS* NIL))\n```\n\n数据库仅仅是我们希望记住的语句列表。新项被添加到列表末尾。\n\
  \n```lisp\n(DE ADD-CD (CD)\n  (SETQ *DATA-BASE* (CONS-END *DATA-BASE* CD))\n  CD)\n\
  ```\n\n要将一个的语句整合到当前激活的脚本中，在 `*POSSIBLE-NEXT-EVENTS*` 中找到与该语句匹配的第一个事件。如果找到了，更新数据库。\n\
  \n```lisp\n(DE INTEGRATE-INTO-SCRIPT (CD)\n  (LOOP (INITIAL NEW-BINDINGS NIL\n \
  \                        EVENT NIL\n                         EVENTS *POSSIBLE-NEXT-EVENTS*)\n\
  \        (WHILE (SETQ EVENT (POP EVENTS)))\n        (DO (COND ((SETQ NEW-BINDINGS\n\
  \                            (MATCH EVENT *CURRENT-SCRIPT*))\n                 \
  \  (SETQ *CURRENT-SCRIPT* NEW-BINDINGS)\n                   (MSG T “MATCHES”)\n\
  \                   (PRINT-CD EVENT)\n                   (ADD-SCRIPT-INFO EVENT))))\n\
  \            (UNTIL NEW-BINDINGS)\n        (RESULT NEW-BINDINGS))\n```\n\n`ADD-SCRIPT-INFO`\
  \ 接收脚本中的一个事件（在 `INTEGRATE-INTO-SCRIPT` 中匹配输入的事件）。直到 `POSITION` 的每个脚本事件都会实例化并添加到数据库中。\n\
  \n```lisp\n(DE ADD-SCRIPT-INFO (POSITION)\n  (LOOP (INITIAL EVENT NIL\n        \
  \                 EVENTS *POSSIBLE-NEXT-EVENTS*)\n        (WHILE (SETQ EVENT (POP\
  \ EVENTS)))\n        (DO (MSG T “Adding script”)\n            (PRINT-CD (ADD-CD\
  \ (INSTANTIATE EVENT *CURRENT-SCRIPT*))))\n        (UNTIL (EQUAL EVENT POSITION))\n\
  \        (RESULT (SETQ *POSSIBLE-NEXT-EVENTS* EVENTS)))\n```\n\n`SUGGEST-NEW-SCRIPT`\
  \ 接收一个 `CD` 形式，将其添加到数据库，并检查该形式及其子形式的谓词，直到找到与脚本的链接（如果有）。因此，在 `(PTRANS (ACTOR (PERSON))\
  \ (OBJECT (PERSON)) (TO (STORE)))` 中，找到的第一个是在 STORE 下。如果之前有一个脚本，在切换到另一个脚本之前将其添加到数据库，但不要实例化遗留在\
  \ `*POSSIBLE-NEXT-EVENTS*` 中的任何事件。\n\n```lisp\n(DE SUGGEST-NEW-SCRIPT (CD)\n  (LET\
  \ (NEW-SCRIPT (FIND-SCRIPT CD))\n    (COND (NEW-SCRIPT\n            (AND *CURRENT-SCRIPT*\
  \ (ADD-CD *CURRENT-SCRIPT*))\n            (MSG T “New script” NEW-SCRIPT)\n    \
  \        (SETQ *CURRENT-SCRIPT* (UST NEW-SCRIPT))\n            (SETQ *POSSIBLE-NEXT-EVENTS*\
  \ (EVENTS:SCRIPT NEW-SCRIPT))\n            (INTEGRATE-INTO-SCRIPT CD)))\n```\n\n\
  ```lisp\n(DE FIND-SCRIPT (CD)\n  (COND ((ATOM CD) (ASSOCIATED-SCRIPT CD))\n    \
  \    (T (OR (ASSOCIATED-SCRIPT (HEADER: CD))\n              (LET (SCRIPT NIL)\n\
  \                (FOR (PAIR IN (ROLES:CD))\n                  (EXISTS (SETQ SCRIPT\n\
  \                            (FIND-SCRIPT (FILLER: PAIR)))))))))\n```\n\n`PRINT-CD`\
  \ 打印一个 `CD` 形式，缩进，左边距位于第 4 列。\n\n```lisp\n(DE PRINT-CD (CD)\n  (SPRINT CD 4) (MSG\
  \ T))\n```\n\n# 数据结构与访问函数\n\n故事是一个 CD 列表。一个 `CD` 是一个谓词（`PTRANS`、`PERSON` 等）加上零或多个（角色，填充）对。这是一个由\
  \ CD 组成的故事：\n\n```lisp\n(SETQ KITE-STORY\n  ((’Jack went to the store.\n    (PTRANS\
  \ (ACTOR (PERSON (JACK)))) (OBJECT (PERSON (JACK)))) (TO (STORE)))\n   ’He got a\
  \ kite.\n    (ATRANS (OBJECT (KITE)) (TO (PERSON))))\n   ’He went home.\n    (PTRANS\
  \ (ACTOR (PERSON)) (OBJECT (PERSON)) (TO (HOUSE)))))\n```\n\n脚本名称是具有 `EVENTS` 属性的原子，该属性指向事件列表。\n\
  \n```lisp\n(DE EVENTS:SCRIPT (X) (AND X (GET X ‘EVENTS)))\n```\n\n例如，这是购物脚本：\n\n\
  ```lisp\n(DEFPROP SHOPPING\n  ((PTRANS (ACTOR ?SHOPPER) (OBJECT ?SHOPPER) (TO ?STORE))\n\
  \  (PTRANS (ACTOR ?SHOPPER) (OBJECT ?BOUGHT) (TO ?SHOPPER))\n  (ATRANS (ACTOR ?STORE)\
  \ (OBJECT ?BOUGHT)\n          (FROM ?STORE) (TO ?SHOPPER))\n  (ATRANS (ACTOR ?SHOPPER)\
  \ (OBJECT (MONEY)))))\n```\n\n## 练习\n\n1.  1. 写一个包含以下事件的餐厅脚本：\n    *   去餐厅。\n  \
  \  *   点餐。\n    *   吃东西。\n    *   付费。\n    *   离开餐厅。\n\n    2.  它应该包含 RESTAURANT、DINER\
  \ 和 MEAL 角色。\n\n3.  将变量 `RESTAURANT-STORY` 设置为“杰克去了餐厅。他吃了龙虾。他离开了。”的 CD 列表。\n\n4.\
  \  对 `RESTAURANT-STORY` 运行 McSAM。之后，数据库应该包含餐厅脚本中所有 CD 的实例化。\n\n2.  现在我们有一个数据库（`*DATA-BASE*`）和一个从中添加内容的功能（`ADD-CD`），但没有从中检索内容的功能。\n\
  \n    1.  定义函数 `FETCH`，接收一个模式作为参数并返回数据库中匹配该模式的第一个 CD，如果没有则返回 NIL。这样，\n\n       \
  \ ```\n         (FETCH ‘(PTRANS (ACTOR ?X) (OBJECT ?X)))\n        ```\n\n      \
  \  应该返回第一个去某地的 CD。\n\n    2.  定义函数 `FETCH-ALL`，接收一个模式作为参数并返回数据库中匹配该模式的所有 CD。\n\n\
  \n\n\n\n### 3. 如果 `FETCHING` 成为一个重要的操作，并且数据库变得越来越大，那么将所有内容都存储在一个巨大的列表中将非常低效。你可以通过将数据库拆分为许多较小的数据库（每个谓词一个数据库）来改进这一点。也就是说，将有一个\
  \ `PTRANS` 数据库、一个 `ATRANS` 数据库，以此类推。为了确定以下\n\n```\n(PTRANS (ACTOR (PERSON (NAME\
  \ (JACK)))) (TO (STORE)))\n```\n\n是否为真，`FETCH` 只需查看 `PTRANS` 数据库。\n\n这可以通过在每个谓词上设置一个属性——称之为\
  \ `DATA-BASE`——来实现，其值将是所有带有该谓词的 `CDs` 列表。修改 `FETCH` 和 `ADD-CD` 以包含这一改进。你可能还想要定义函数来初始化并显示这种新的数据库格式。\n\
  \n### 4. 假设句子“一个硬币滚进了商店”被分析为\n\n```\n(PTRANS (OBJECT (MONEY)) (TO (STORE)))\n```\n\
  \n1.  如果我们把这一行传给 `McSAM` 会发生什么？可以做些什么来改变结果？\n2.  假设句子是“一只狗走进了商店。”你的解决方案仍然有效吗？\n\
  \   这个通用问题在于如何为模式匹配器提供语义知识，以便它知道人在 `SHOPPING` 脚本中是合适的执行者（actors）。\n3.  为每个脚本添加一个\
  \ `VARS` 属性，其格式为列表所示：\n\n```\n((var-name property) (var-name property)…)\n```\n\n\
  例如，在 `SHOPPING` 下将是：\n\n```\n((SHOPPER (ANIMATE ?SHOPPER)) (STORE (STORE ?STORE))…)\n\
  ```\n\n4.  将 `INTEGRATE-INTO-SCRIPT` 中的 `MATCH` 替换为 `SUPERMATCH`。定义函数 `SUPER-MATCH`，使其接收一个模式、一个\
  \ `CD` 和一个脚本绑定形式。如果模式匹配了 `CD` *并且* 新绑定满足了 `VARS` 给出的约束，则它应该返回一个更新后的绑定形式。注意，像 `ANIMATE`\
  \ 和 `STORE` 这样的函数必须知道如何获取模式变量的绑定。\n\n### 5. 在理解“杰克去了商店”时，我们知道杰克在商店，但除非有人要求我们这样做，否则这个推理可能不是我们想要做的。也就是说，如果\
  \ `McSAM` 处理类似以下的内容\n\n```\n(PTRANS (ACTOR (PERSON)) (OBJECT (PERSON)) (TO (STORE)))\n\
  ```\n\n我们不希望它总是添加\n\n```\n(AT (ACTOR (PERSON)) (OBJECT (STORE)))\n```\n\n但如果 `PTRANS`\
  \ 形式在数据库中，那么\n\n```\n(FETCH ‘(AT (ACTOR (PERSON)) (OBJECT (STORE))))\n```\n\n应该执行成功。为了做到这一点，我们想要一条推理规则：“若要确定某人是否在某个地方，就找出他是否去过那个地方。”在练习中，我们将添加这种能力。\n\
  \n1.  定义 `FEXPR` `DEF-INFERENCE`，以便我们可以通过输入以下来定义推理规则：\n\n```\n(DEF-INFERENCE patteml\
  \ pattem2)\n```\n\n这会将模式对 `pattem-pair` `(patteml pattem2)` 添加到列表 `INFERENCE-RULES`\
  \ 中。该列表将用于将对 `patteml` 的搜索替换为对 `pattem2` 的搜索。例如，我们的 `AT` 规则将是：\n\n```\n(DEF-INFERENCE\n\
  (AT (ACTOR ?PERSON) (OBJECT ?LOC))\n(PTRANS (ACTOR ?PERSON) (TO ?LOC])\n```\n\n\
  2.  接下来修改 `FETCH`，如果它在数据库中没有找到任何内容，则使用推理规则。例如，如果 `FETCH` 没有找到 `CD`：\n\n```\n(AT\
  \ (ACTOR (PERSON (NAME (JACK)))) (OBJECT (STORE)))\n```\n\n那么 `FETCH` 应该尝试与 `INFERENCE-RULES`\
  \ 中每个 `pattem-pair` 的第一个元素匹配 `CD`。如果 `CD` 匹配第一个元素，则 `FETCH` 应该用匹配返回的绑定来实例化第二个元素。然后它应该搜索由此实例化形成的\
  \ `CD`。由于 `AT` `CD` 形式匹配了 `AT` 规则的第一个元素，`FETCH` 现在应该寻找通过实例化 `pattem-pair` 的第二个元素构建的\
  \ `PTRANS` `CD` 形式，其中 `PERSON` 绑定为 `(PERSON (NAME (JACK)))`，`LOC` 绑定为 `(STORE)`。\n\
  \n你的解决方案应该允许推理链，因此对 `A` 的搜索可以导致对 `B` 的搜索，而之又可以导致对 `C` 的搜索。此外，如果对 `CD` 使用一个推理规则无效，`FETCH`\
  \ 应该尝试其他推理规则。注意无限循环！\n\n### 6. McSAM 忽略未填充的脚本角色。例如，假设 `SHOPPING` 脚本有一个 `CD` 用于物理上向收银员交付一些钱：\n\
  \n```\n(PTRANS (ACTOR ?SHOPPER) (OBJECT ?PRICE)\n(FROM ?SHOPPER) (TO ?CASHIER))\n\
  ```\n\n在我们一直使用的购物故事中，价格和收银员都没有被提到，因此这些角色没有被填充，`McSAM` 将上述的 `CD` 模式实例化为相当无用的形式：\n\
  \n```\n(PTRANS (ACTOR (PERSON (NAME (JACK)))) (FROM (PERSON (NAME (JACK)))))\n```\n\
  \n显然，我们希望能够指定脚本角色的默认值，例如收银员是一个人。\n\n1.  为 `SHOPPING` 脚本添加 `DEFAULTS` 属性，其值为：\n\n\
  ```\n((CASHIER (PERSON)) (PRICE (MONEY)))\n```\n\n这表示 `CASHIER` 的默认值为 `(PERSON)`，`PRICE`\
  \ 的默认值为 `(MONEY)`。\n2.  修复 `ADD-SCRIPT-INFO` 和 `INSTANTIATE`，使用 `DEFAULTS` 中的适当谓词来填充未定义的脚本角色。例如，如果\
  \ `SHOPPER` 是 `(PERSON (NAME (JACK))` 但 `CASHIER` 或 `PRICE` 均绑定，则生成形式：\n\n```\n\
  (PTRANS (ACTOR (PERSON (NAME (JACK)))) (OBJECT (MONEY)) (TO (CASHIER)))\n```\n\n\
  7.  为 `McSAM` 程序添加 `McELI` 解析器。它已经包含了 `KITE-STORY` 需要的定义及其相关的练习。编写一个顶级函数，获取句子列表并转换为\
  \ `CD`，然后将结果传递给 `McSAM`。\n\n# 7 Pam\n\nRobert Wilensky\n\nDOI: [10.4324/978020328147-7](https://dx.doi.org/10.4324/978020328147-7)\n\
  \n## Introduction\n\n故事通常包含不符合刻板印象的元素，但这些故事对人类读者来说是完全可以理解的。之前的理解系统如 SAM (Cullingford,\
  \ 1978) 和 Ms. Malaprop (Chamiak, 1977�b)) 使用高度结构化的知识形式来引导推理过程——在 SAM 中是脚本 (Schank\
  \ and Abelson, 1977)，在 Ms. Malaprop 中是框架 (Minsky, 1975)。PAM (Wilensky, 1978) 的原始想法是由\
  \ Schank 和 Abelson (1977) 提供的。他们指出，故事理解很大程度上涉及到理解文中角色的意图。\n\n\n\n\n\n为了构建一个能够发现事件解释的系统，必须建立一套常识解释理论。该理论必须规定解释的组成部分是什么、如何从文本中推导出解释，以及理解者如何判断推断出的解释是充分的。Schank\
  \ 和 Abelson (1977) 提供了一组计划和目标，这些计划和目标最初构成了 `PAM` 中使用的解释组成部分。创建 `PAM` 的第一步是将这些计划和目标应用于解释的构建中。\n\
  \n## 理解中的预测价值\n\n故事理解者需要利用其知识来解释语境中的句子。以这种方式使用的知识被认为具有`predictive`（预测）价值。读者利用所知的和刚刚读过的内容来帮助理解接下来将读到什么。然而，非定型的故事并不是完全可预测的。由于\
  \ `PAM` 的设计理念是构建一个比以前程序更灵活的理解者，因此不能期望它主要通过预测来工作。\n\n例如，考虑以下故事：\n\n> John 想要给他的约会对象留下深刻印象。他给朋友\
  \ Bill 打了电话，问他能不能借他的凯迪拉克。\n\n这个故事的读者必须推断出 John 打算用凯迪拉克去接他的约会对象。这种推断要求读者使用关于什么能给人留印象的知识；这种知识由第一句话触发，并被预测性地用于理解第二句。然而，要求读者预测出\
  \ John 表现出的行为的确切形式（即他打电话给朋友并要求借东西）是不合理的。这里的问题在于如何存储此示例所需的知识，使其能够具有足够的预测性以实现语境理解，但又不至于过于预测化而导致理解者变得僵化。换句话说，我们需要一种能够预测少量内容的机制。\n\
  \n## 理论问题与目标交互\n\n在构建 `PAM` 的过程中也出现了更具理论性质的问题。许多故事并不符合 Schank 和 Abelson 提供的规划结构类型。问题在于，大多数故事都涉及多个目标同时出现的情况。虽然\
  \ Schank 和 Abelson 的意图结构在寻找角色追求单一目标的故事解释时很有用，但要理解目标之间的相互关系，还需要更多的理论手段。\n\n我们需要的是一种目标交互理论，以及对这些交互所产生的故事场景的理解。研究发现以下目标交互是许多常见故事场景的基础：\n\
  \n1. **目标包含（Goal Subsumption）**——一种同时计划多个相同目标出现的情况。例如，考虑以下故事：\n\n   > John 喜欢喝热咖啡。他买了一个保温杯。\n\
  \n   这里 John 有一个享受热咖啡的循环目标，而保持咖啡温度是实现这一目标的手段。使用保温杯可以是实现这一目标的计划，而要使用这个计划，必须拥有保温杯。John\
  \ 购买保温杯可以解释为一种`subsuming`这一循环目标的方式，通过建立一个状态（即对保温杯的所有权），该状态满足了前提条件并能持续一段时间。\n\n2.\
  \ **目标冲突（Goal Conflict）**——单一角色目标之间的敌对关系。例如，考虑以下情况：\n\n   > John 的朋友邀请他去打保龄。John\
  \ 曾向 Mary 承诺会带她吃晚餐，但他的朋友说服他一起去。第二天早上，Mary 告诉 John 她要和他离婚。\n\n   Mary 可能对 John 生气，因为他没有带她去吃饭。要推断出\
  \ John 没有带 Mary 出去，故事的读者必须理解 John 有两个相互`conflict`的目标，由于他追求了其中一个目标，另一个目标被忽视了。因此，读者必须能够识别出冲突的存在，并理解它是如何影响角色的行为的。\n\
  \n3. **目标竞争（Goal Competition）**——不同角色目标之间的敌对关系。例如，考虑\n\n   > John 想要看足球比赛，但 Mary\
  \ 说她要去看大卫剧院的芭蕾。John 打了 Mary 的嘴巴，然后开始看球赛。\n\n   为了理解 John 为什么击打 Mary，读者必须意识到 Mary\
  \ 有一个与 John 目标`competed`的目标。因此，John 打 Mary 被解释为一种消除对手的计划，而不是实现自己的目标。为了找到这个解释，读者必须能够识别竞争，并理解它可能产生的场景。\n\
  \n4. **目标一致（Goal Concord）**——不同角色之间目标的巧合。考虑\n\n   > John 和 Bill 是一起打高尔尔夫的伙伴。Bill\
  \ 的一杆球落在了荒草区。John 悄悄把球移到了更好的位置。\n\n   为了理解 John 为什么帮助 Bill，读者必须理解他们的目标是相互`concord`（一致）的。因此，读者必须判断角色在何时具有一致的目标，以及他们在这种情况下会如何行动。\n\
  \n这些目标关系为关于现实世界情况的规划理论提供了基础。也就是说，故事场景中描述的大部分意图行为都符合涉及目标关系的情况。理解一个人在面对此类情况时可能如何行动，是构建能够理解该人行为程序的必要步骤。\n\
  \n上述列出的目标关系产生了故事场景的分类。每种类型的情况都有一与之相关的知识和推理过程。通过为 `PAM` 配备有关如何识别这些情况以及如何对它们进行推理的知识，`PAM`\
  \ 能够理解许多关于复杂有趣的戏剧场景的故事。\n\n### 输入/输出示例\n\n以下示例是 `PAM` 的实际输入和 `PAM` 生成的输出：\n\n```\n\
  *************************************************\nINPUT TEXT:\n John wanted money.\n\
  \ He got a gun and walked into a liquor store.\n He told the owner he wanted some\
  \ money.\n The owner gave John the money and John left.\nINPUT: Why did John get\
  \ a gun?\nOUTPUT: Because John wanted to rob the liquor store.\nINPUT: Why did John\
  \ threaten the shopkeeper?\nOUTPUT: Because John needed to get some money.\nINPUT:\
  \ Why did the shopkeeper give John the money?\nOUTPUT: Because the shopkeeper didn’t\
  \ want to get hurt.\nINPUT: Why did John leave?\nOUTPUT: Because John didn’t want\
  \ to get caught.\nOUTPUT:\nSTORY FROM JOHN’S POINT VIEW:\n I needed to get some\
  \ dough. So I got myself this gun, and I walked down to the liquor store. I told\
  \ the shopkeeper that if he didn’t let me have the money then I would shoot him.\
  \ So he handed it over. Then I left.\nOUTPUT:\nSTORY FROM THE OWNER’S POINT VIEW:\n\
  \ I was minding the store when a man entered. He threatened me with a gun and demanded\
  \ all the cash receipts. Weil, I didn’t want to get hurt, so I gave him the money.\
  \ Then he escaped.\n**********************************\n```\n\n这个故事展示了 `PAM` 基于解释的理解机制。当\
  \ `PAM` 读到 John 拿到枪时，它必须推断出 John 可能要用枪去抢劫。`PAM` 通过推断构建该事件的解释：John 拿到枪是为了使用它，他计划用它来威胁或制服某人，他计划这样做从某人那里要钱。这个解释随后被用来推导出\
  \ John 告诉店主想要钱的解释——即这是一种威胁他的尝试。\n\n\n\n\n\n这些推论通过理解过程之后的改述和问答环节表现出来。PAM 为了理解这个故事必须做出的其他推论还包括：在威胁了店主后，约翰有一个安全离开的额外目标；店主因为害怕约翰会伤害他，所以给了约翰钱；约翰离开商店是为了避免被后续的捕获。\n\
  \n下面的计算机示例虽然看起来更简单，但需要更复杂的推理。这个故事展示了 PAM 对其目标关系知识的使用：\n\n```\n**************************************************\n\
  INPUT TEXT:\n John wanted to win the stockcar race.\n Bill also wanted to win the\
  \ stockcar race\n Before the race John cut Bill’s ignition wire.\nINPUT: Why did\
  \ John break an ignition wire?\nOUTPUT: Because he was trying to prevent Bill from\
  \ racing.\n**************************************************\n```\n\n这个故事包含了一个约翰和比尔之间目标竞争的实例。为了解释约翰为什么要切断比尔的点火线线，PAM\
  \ 必须首先识别出约翰和比尔具有竞争性目标，因此其中一个人可能会采取一个针对其对手的计划。这是一个`反计划`（antiplanning）情况的例子，在这种情况下，一个角色的行为不能仅从其自身的目标来解释，而必须通过其与破坏对手目标之间的关系来解释。\n\
  \n上面的问答交换反映了 PAM 对约翰行为背后动机的理解。PAM 理解这个故事还必须做出的其他推论是：约翰和比尔具有竞争目标，因为他们中都无法赢得比赛，而且损坏点火线是使汽车不适合比赛的一种方法。\n\
  \n另一个展示 PAM 对目标关系知识的计算机示例如下：\n\n```\n**************************************************************\n\
  INPUT TEXT:\n John wanted to watch the football game,\n but he had a paper due the\
  \ next day.\n John watched the football game.\n John failed Civics.\nINPUT: Why\
  \ did John fail a course in Civics?\nOUTPUT: He failed to hand in an assignment.\n\
  **************************************************************\n```\n\n在这里，PAM 必须推断出约翰有两个由于时间资源限制而相互冲突的目标。识别这种冲突对于推断出约翰没有交作业是关重要的：他追求了一个与完成作业相冲突的目标，因此约翰可能放弃了后者。理解阶段之后提出的问题表明，PAM\
  \ 已经推断出约翰不及格那门课程的原因。PAM 在此过程中做出的另一个推论是，写论文对于通过这门课程是至关重要的。\n\n## PAM 行为总结\n\nPAM\
  \ 目前理解 16 类不同的故事，长度从 2 到 9 个句子不等。一类故事的区别在于理解该类故事所需的推论过程类型。例如，一类故事涉及根据对动作的描述自底向上地推断出一个角色的目标。其他类包括更复杂的目标关系情况，例如目标包含终止和目标冲突导致目标放弃。在每种情况下，一类故事与另一类故事的区别不仅仅是计划或目标的替换。例如，故事\n\
  \n> 约翰想要一本书。他向比尔要一本。\n\n与以下故事属于同一类：\n\n> 约翰想要一本书。他告诉比尔他花一美元从那里买。\n\nPAM 的大部分知识是用一种名为\
  \ `request`（请求）的规则编码的。`request` 的具体格式稍后解释。目前，它们可以被视为条件-动作对。这种配对的一个非正式示例是：\n\n如果\n\
  \n> 一个角色拥有拥有某个功能性对象的目标，\n\n那么\n\n> 该角色可能想按照该对象的预期用途使用该对象。\n\n目前 PAM 中大约有 180 条这样的规则。\n\
  \nPAM 拥有的许多知识是关于计划及其与目标、动作以及相互的关系。PAM 目前拥有与 32 种不同 `planboxes`（计划的基本单元）相关的知识。这些包含了多样化的计划，如\
  \ `THREATEN`（威胁，一种通用的说服方法）和 `UNDO-PRECONDITION`（取消前提，一种阻止他人计划的方法）。\n\nPAM 在 `DEC\
  \ System 20/50` 上用 `UCILISP` 和 `MLISP` 编写。该程序目前占用 177 页内存（9 万字）。这包括 4 万字用于构建故事表示等的自由存储空间。问答系统和英语生成器位于该空间内，但英语语言解释器\
  \ `ELI` 则不在。\n\nPAM 处理一个句子平均需要 5.58 CPU 秒。每个句子的处理时间从 0.9 秒到 15.2 秒不等。这个数字不包括将英语句子转换为其\
  \ `Conceptual Dependency`（概念依赖）表示所需的时间。`ELI` 执行此任务平均需要 3–4 CPU 秒。\n\n目前在让 PAM 尽可能快或尽可能小方面的尝试较少。有一些直接的修改可以稍微减少上述数字。例如，PAM\
  \ 的所有代码都是解释执行的。编译这些代码可能会导致速度提高三倍。通过垃圾回收工作结构可以显著减少程序的总尺寸。PAM 目前为了调试目的保留了这些结构。\n\n\
  ### 问题\n\n构建 PAM 的主要目的是为了对自然语言理解所需的知识类型和过程获得洞解。PAM 的构建产生了许多考量。\n\n#### 解释与框架寻找\n\
  \n最近引起关注的一种理解观点通常被称为`框架假设`（frame hypothesis，Collins, 1978）。该假设声称理解输入等同于找到一个可以将输入整合其中的框架（frame）。PAM\
  \ 的构建使我们对这个想法产生了怀疑。\n\n框架假设存在两个问题：\n\n1. 通常，没有一个单一的框架可以容纳连贯的输入。\n2. 通常会有多个框架可以容纳给定的输入，但找到大部分框架并不等同于理解该输入。\n\
  \n\n\n\n因此，解释驱动的理解概念在某种程度上与框架假说（frame-hypothesis）存在竞争。读者试图通过构建解释来解释一个输入。构建解释的过程可能涉及寻找一个或多个合适的框架、将多个框架结合在一起，并决定生成的结构何时足够。寻找框架无疑是该过程的一个重要部分，但它对于理解者构建解释的终极目标来说，仅仅是工具性的。\n\
  \n#### 规划理论\n\n`PAM` 的构建证明了这种需求需要一种比以往理论复杂得多的规划理论。尽管 `PAM` 本身并不进行规划，而是使用计划来生成解释，但它对规划的知识需求仍然比大多数之前的问题求解器或机器人规划器所需要的要多。基本问题在于，现实世界中的大多数规划都涉及同时存在多个目标的情况，而大多数关于规划的工作关注的是单目标情况。因此，有必要开发一种基于目标关系的规划理论。虽然该理论目前仅应用于故事理解，但似乎如果机器人规划器若要在复杂情况下表现出智能性，它也需要具备这种知识。\n\
  \n#### 预测与识别的整合\n\n`PAM` 旨在理解的故事类型使得 `PAM` 必须同时具备识别和预测能力。之前的自然语言理解系统倾向于避免整合这两者的问题。例如，`SAM`\
  \ 和 `Ms. Malaprop` 假设理解者可以获得相应的脚本或框架——即程序不需要担心框架是什么。由于 `PAM` 的设计初衷是在没有预设特定框架的情况下理解故事，因此它必须面对如何假设合适的框架（对于\
  \ `PAM` 来说，通常是计划）并将其整合到现有结构中的问题。\n\n`PAM` 指出的一个结果是，假设框架的成本可能很小。`PAM` 寻找适用于意外输入的知识所需的时间仅占其总运行时间的一个极小部分（约占\
  \ 3%）。由于 `PAM` 使用的访问方法（实际上是一个简单的判别网络）导致访问时间随知识库的大小呈对数增长，因此识别算法的效率似乎并不是一个主要问题。\n\n\
  当然，基于什么键进行框架索引仍然是一个待解决的问题。`PAM` 的索引是基于其解释算法的。然而，寻找框架的需求也出现在其他这种索引不充分的情况下。\n\n`PAM`\
  \ 以复杂情况下的解释和规划来表述了故事理解问题。在这个框架内，`PAM` 为许多问题提供了解决方案。然而，许多空白仍然存在。\n\n#### 解释的概念\n\n\
  `PAM` 的解释思想基于其规划概念——解释实际上是一组合理的计划和目标。然而，显而易见并非所有的解释都是基于意图的。例如，考虑这些故事：\n\n> 约翰打了比尔。他哭了。\n\
  \n> 约翰打了比尔。他向后倒了。\n\n解释上述两个故事的第二个句子分别需要诉助于情感和物理知识。解释的概念应该扩展到能够处理此类情况。\n\n### 知识编码\n\
  \n`PAM` 关于规划的大部分知识是以请求的形式编码的，这些请求具有很强的过程特征。也就是说，`PAM` 关于计划和目标的知识表述形式对于理解故事和寻找解释特别有用，但对于其他用途（如生成计划或寻找问题的解决方案）并不十分用。能够以更具声明性的格式表示其中一些知识，这种格式将具有比\
  \ `PAM` 目前更强的通用性。\n\n这样做的基本点是将关于计划和目标的知识与如何使用这些知识的知识分开。后者包含了关于解释的知识或关于规划的知识。可能一个人关于计划和目标的绝知识对于这两项任务是相同的，因此统一的表示是理想的。解释过程和规划过程在多大程度上可以与计划知识分离，仍然有待观察。一个旨在整合这种模块化的\
  \ `PAM` 版本正在构建中。\n\n#### 故事知识\n\n`PAM` 的一个基本问题是它实际上并不知道故事是关于什么的。`PAM` 接受任何基于目标的句子序列作为故事。真实的故事并非如此随意。故事理解者对故事倾向于涉及的内容有一定的概念，并利用这种概念忘记无关紧要细节并对故事事件进行推理。\n\
  \n因此，`PAM` 需要一种故事内容理论。该理论应该描述构成大多数故事的事件类型，并在建议读者可能在故事中接下来听到什么方面具有预测价值。此外，这种理论对于解释我们如何总结故事和忘记无关细节将极其有用——随着处理文本数量的增加，这种能力将变得越来越重要。\n\
  \n## 程序\n\n`PAM` 的目的是寻找解释。为了做到这一点，它必须将自上而下的预测能力与自下而上的识别机制结合。`PAM` 的整体控制流总结在图 7.1\
  \ 中：\n\n![](img/fig7_1_B.jpg)\n\n图 7.1 PAM 的处理算法。\n\n图 7.1 展示了 `PAM` 处理输入的顺序。首先，它检查是否存在一个被输入确认的特定预测。如果有，那么该预测应该解释该输入。否则，必须进行推理以假设自下而上的解释。然后，必须再次咨询预测，以查看是否有任何预测满足了这些推理。当发现某个推理满足预测时，输入以及在解释过程中所做的任何推理都被添加到故事表示中。\n\
  \n通过具备相应的预测并做出正确的自下向上推理，`PAM` 最终会为输入推导出解释。这些预测的内容符合 `PAM` 中的解释理论。该理论的本质如图 7.2 所示：\n\
  \n![](img/fig7_2_B.jpg)\n\n图 7.2 为事件寻找解释的过程\n\n图 7.1 可以被看作实现图 7.2 的一种方法。例如，图 7.2\
  \ 的第一步说，如果输入是一个事件，那么确定它是已知计划的一部分就可以解释它。这在 `PAM` 中通过检查是否存在预测该事件会被遇到来实现。这是图 7.1 预测组件的一个功能示例。图\
  \ 7.2 的第二步是在没有现有计划解释事件时采取的，必须假设一个计划。这是图 7.1 自下向上组件的一个功能示例。\n\n通常情况下，寻找输入或推理与现有故事表示之间的连接是通过预测完成的；而推导出不在表示中的解释则是通过自下而上的机制完成的。\n\
  \n### 组件描述\n\n\n\n\n以下是构成图 7.1 组件的简要描述：\n\n### 预测组件 (Predictive Component)\n\nPAM\
  \ 的预测组件是尝试解释程序接收每个新输入的第一个机制。预测组件可以访问 PAM 之前做出的许多预测。PAM 中的预测实际上只是一个“条件-动作规则”中的条件部分，PAM\
  \ 假设该条件对于理解新输入至关重要。预测组件串行检查每个此类规则的条件与输入是否匹配，直到某个条件被满足。\n\n如果某个预测被确认，则该条件所属的规则将传递给整合组件（incorporation\
  \ component）。该规则的动作部分应该告诉该组件如何将输入连接到现有表示中。实际上，PAM 可能会在找到满足的预测之前循环遍历这一序列规则。在此过程中，找到了一系列解释规则。当最终满足某个预测时，整个序列被传递给整合组件。\n\
  \n如果没有预测被满足，则输入将传递给整合组件，假设假设解释。如果同时满足两个或多个预测，这表明该输入存在多种解释。也就是说，故事本身具有歧义性，人类读者可能需要要求澄清，而\
  \ PAM 目前无法要求澄清。\n\n预测组件还被 PAM 用于执行其他与解释无关的功能。例如，预测组件确定输入是否意味着目标已实现。这些细节在下文中描述。\n\
  \n### 自向上组件 (Bottom-Up Component)\n\n自向上组件为输入生成合理的解释。该组件通过寻找满足输入条件的规则来推断出合理的解释。当找到这些规则时，就会采取相应的动作。每个动作为输入推断可能的解释。\n\
  \n自向上组件可以访问一组规则，这些规则构成了 PAM 关于意图的长期记忆。这些规则使用判别网络进行索引，以减少查找匹配输入的规则所需的时间。通常只有少数规则适用于给定输入，因此推断出少数合理的解释。然而，PAM\
  \ 能够处理多个规则可能同时生效的情况。\n\n当自向上组件使用规则的动作进行推断时，其操作方式不会修改之前构建的故事表示。在此点使用的任何特定规则最终都可能是死胡同，其所做的推断将不会成为解释的一部分。因此，自向上组件在“测试模式”下进行推断，在这种模式下，推断不会添加到表示中，也不会产生无法撤销的副作用。\n\
  \n如果自向上阶段成功，它创建的推断解释将传回预测组件。预测组件会将这些推断中的每一个视为一个输入。也就是说，它将尝试寻找被这些推断之一满足的预测。如果是，组件将停止并进入整合阶段；如果不是，它会将推断传回自向上组件，为该推断假设解释。\n\
  \n如果自向上阶段找不到对应输入的规则，则 PAM 将无法理解该输入。这种情况对应于人类读者找不到某个特定事件的原因。自向上组件还负责账目记录，以跟踪哪个规则被用于每个推断，以及用于假设解释的规则顺序。当找到一组将输入与预测联系起来的规则时，整合组件就可以将推断添加到故事表示中。\n\
  \n### 整合组件 (Incorporation Component)\n\n当通过输入或通过输入产生的推断确认预测时，输入和推断必须整合到目前构建的故事表示中。这就是整合组件的功能。整合组件接收规则序列作为输入。这些规则是自向上组件用于产生一系列推断的，其中最后一个了某个预测。预测本身是某个规则的条件部分，该规则也被传递给整合阶段。\n\
  \n整合阶段获取这些规则并再次使用它们进行推断。然而，这一次，推断被添加到实际的故事表示中。这些推断的创建有时会导致改变故事表示的副作用。\n\n在使用所有这些规则将推断添加到故事表示后，整合组件必须移除连接推断链与故事表示的预测。此外，可能存在许多与被满足的预测竞争的其他预测，这些也必须被移除。例如，PAM\
  \ 可能同时拥有多个预测，每个预测预测同一个角色将执行不同的计划。当其中一个预测被确认时，必须移除所有其他，因为现在知道了正确的计划，未使用的预测全部失效。\n\
  \n除了移除预测外，整合组件还负责创建预测。与 PAM 中的规则关联的是一组可能有其他规则。这些规则在整合阶段进行测试。条件被发现为真的规则会被立即使用；这通常向表示中添加另一个断言。条件尚未为真的规则是关于未来事件的预测。这些将成为预测组件用于解释后续输入的预测。\n\
  \n### 示例 (An Example)\n\n本节包含关于 PAM 如何使用上述概述算法理解以下故事的非技术性描述：\n\n1. 约翰想要比尔的自行车。\n\
  2. 他走向比尔\n3. 并问他是否愿意把车给他。\n4. 比尔拒绝了。\n5. 然后约翰告诉比尔他会付五美元买车，\n6. 但比尔不同意。\n7. 约翰告诉比尔，如果不让他骑，他就打断他的胳。\n\
  8. 比尔让约翰拿了自行车。\n\nPAM 的输入是以概念依赖（Conceptual Dependencies, CDs）的形式存在的，由 Riesbeck 的概念分析程序产生（Riesbeck,\
  \ 1975）。因此，上面的第一行将被解析为：\n\n```\n ((CON ((ACTOR (BICYCLE REL ((ACTOR (BICYCLE)\n\
  \ IS (*POSS* PART (BILL)))))\n IS (*POSS* PART (JOHN))))\n IS (*GOAL* PART (JOHN))))\n\
  ```\n\n这个 CD 编码了如下信息：约翰的目标是拥有一辆目前比尔拥有的自行车。\n\n\n\nPAM 现在尝试为输入寻找一个解释。由于这是故事的第一句话，且尚未看到之前的目标或计划，预测组件失败了，输入被传递给自下而上的组件来假设解释。输入是一个目标陈述，而目标可以通过工具性（instrumentality）或主题（themes）来解释。因此，PAM\
  \ 必须查看是否知道任何可以产生此特定目标的主题，或者该目标作为子目标的计划。拥有任何对象的目标可能源于喜欢该对象的主题。此外，拥有具有标准功能的对象可以是使用该对象的工具。因此，PAM\
  \ 为这句话推断出两种合理的解释：一种是约翰想要拥有比尔的自行车仅仅是因为他喜欢它，另一个是约翰想要比尔的自行车是因为他想骑它。\n\n为了得出这些解释，自下而上组件搜索适用于此输入的规则，并发现了以下内容：\n\
  \n1. 如果一个人想要拥有一个对象，那么他可能持有喜欢该对象的态度。\n2. 如果一个人想要拥有一个具有功能的对象，那么他可能想要使用该对象来执行其功能。\n\
  \n自下而上组件随后这些规则产生推理。规则 (1) 生成了约翰可能喜欢这辆自行车的推理。规则 (2) 产生了约翰可能想骑这辆自行车的推理。\n\n在访问了满足输入\
  \ `CD` 条件的规则，并根据这些规则的动作完成了指定的推理后，PAM 对这句话留下了两种可选的解释。这些解释被传回给预测组件。在理解过程初期，PAM 无法确定这些解释中哪一个是正确的。然而，由于它已经确定了几个合理的解释，它不需要继续推理。相反，我们只是想让\
  \ PAM 暂时在故事表示中记录这两种合理的推理。这是通过在故事理解开始时插入一个预测来实现，该预测寻找具有多个合理解释的情况。为了让故事理解过程“启动”，有几个此类预测是必须的。\n\
  \n在找到确认预测的推理后，PAM 进入了整合阶段。之前用于做出这些推理的规则现在被用于将它们添加到故事表示中。\n\n整合阶段还做出了预测：约翰可能会尝试某些计划来实现他获取比尔自行车的目标，而且他也可能尝试实现某些对该计划具有工具性的目标。当\
  \ PAM 获知新目标时，这些是相当标准的预测。这些预测将由程序的预测组件使用，以寻找未来输入与约翰已知目标之间的联系。\n\n理解器现在读取第 (b) 行，将其转换为\
  \ `CD` 并传递给 PAM；PAM 尝试为该 `CD` 寻找解释。预测组件在这里失败了——它目前只寻找针对约翰获取比尔自行车这一目标的计划或直接子目标。也就是说，走向某人是一个改变个人位置的计划，而不是获得某个对象的计划。因此，PAM\
  \ 必须将控制权交给自下而上的组件。\n\n再次，该组件尝试访问内存中那些被输入满足的规则。在这种情况下，发现了以下规则：\n\n```\nIf\n> 一个执行者执行了一个\
  \ PTRANS，其工具是执行者移动了某个身体部位，\nthen\n> 该执行者正在使用依靠自身力量移动的计划。\n```\n\n也就是说，改变位置的一种方式是通过使用自己的身体。由于\
  \ `CD` 表示中通过工具指示了这一点，约翰一定正在使用这个计划。因此，PAM 推断约翰的动作是依靠自身力量改变位置计划的一个实例。\n\n这一推理被传回给预测组件。它再次失败了，因为没有明确的预测说明约翰将执行此类计划。现在该推理被传回给自下而上组件，以尝试为其推断一个解释。\n\
  \n根据解释理论，需要一个可以连接到该计划的目标。因此，PAM 尝试推断约翰计划背后的目标。通过上述方式访问并应用规则，PAM 推断约翰想在比尔附近。这一推理随后被传回给预测组件。\n\
  \n这一次，关于约翰将有一个与其所有所有目标具有工具性的目标的预测得到了确认。也就是说，PAM 在每个目标旁边都存储了一个通常与该目标计划具有工具性的目标列表。其中存储为改变所有权的工具性目标之一是改变位置。因此，一个预测被确认，并找到了解释。用于寻找此解释的规则现在传给整合组件。\n\
  \n该组件再次使用这些规则来做出各自的推理，但这次故事表示发生了变化。添加到表示中的推理包括：约翰有靠近比尔的目标、他通过依靠自身力量移动实现了这一目标，以及该目标对于某些获取比尔自行车的未知计划具有工具性。用于将这些推理与故事表示连接的预测在此时也被删除了。\n\
  \n现在读取了第 (c) 行——“并问他是否愿意给给他。”，将其转换为 `CD` 并传递给预测组件。该组件无法解释该输入。第 (c) 行是一个动作，唯一可用的预测期望看到一个针对目标的计划。因此，输入被传递给自下而上的组件进行考虑。该组件找到一个条件匹配此输入的规则，其动作推断该输入是向某人要某物的计划的实例。这一推理被传回给预测组件。\n\
  \n现在，PAM 会遇到约翰目标计划的预测被满足。在读取器的内存中，每个目标旁边都存储了一个与该目标通常相关的计划列表。寻找约翰目标计划的预测检查了与从某人处获得某物的目标相关的列表，发现该列表包含了“询问”。因此，这个计划可能是约翰在走向比尔时意图使用的未知计划。\n\
  \n用于推断此计划的规则，以及将此计划与故事呈现连接的预测，都被传给整合组件。这些规则被用于修改表示，用于解释输入的预测被移除。此外，还添加了几个新预测。这些预测来自与推断“询问”计划的规则相关的规则。本质上，它们预测了人被询问后可能回应询问计划的各种方式，例如同意或拒绝。做出这些预测的规则动作部分能够改变故事表示，分别显示计划是失败还是成功。\n\
  \n在整合阶段之后，故事表示看起来像图 7.3。\n\n![](img/fig7_3_B.jpg)\n\n图 7.3 第 (c) 行后的故事表示。\n\n\n\n\
  \n# 预测\n\nPAM 中使用的“预测”（Predictions）实际上是关于某些知识对于理解故事有多大可能的预测。它们并不一定是对未来事件的预测。例如，假设约翰向比尔提了一个问题。比尔回答的一种方式是回答该问题。当我说这种回答是由提问事件预测的时，我的意思是预测后续知识将是有用的：“如果比尔告诉约翰约翰想找出什么，那么比尔为了回答约翰的问题而把这些告诉约翰。”这并不是预测比尔会回答问题，甚至不是预测他很有可能回答。相反，这是一个预测：关于回答的知识对于理解故事的后续句子是有用的。这种意义上的预测与\
  \ Kuno 和 Oettinger (1962) 以及 Riesbeck (1975) 所使用的相似。\n\n预测可以被看作恶魔般的例程（参见 Charniak,\
  \ 1972, 和 Selfridge, 1959），它们会检查后续的输入和推理。PAM 中使用的特定形式的预测是模仿了 Riesbeck 概念分析程序中所使用的\
  \ `requests`（参见 Riesbeck, 1975）。请求（request）是一种规则，因为它包含一个条件部分和一个动作部分。此外，请求可以建议对后续处理有用的额外请求。请求的条件部分充当预测，动作描述了如何将输入连接到故事表示，而建议的请求则成为新的预测。\n\
  \n例如，在行 (c) 之后，比尔随后的行为可能是对约翰问题的回答。如果他把自行车给了约翰，读者应该推断出是因为约翰向他索要。如果他拒绝了，那么读者就应该假设他在拒绝执行约翰的要求。然而，在读者看到行\
  \ (d) 之前，读者无法知道比尔的反应会是什么。因此，PAM 设置了两个预测，每种可能的结果对应一个。当遇到行 (d) 时，寻找拒绝请求的预测得到了确认，并创建了一个关于比尔行为的解释。\n\
  \n预测的自上而下特性在这里非常有用，因为它让 PAM 能够将行 (d) 解释为对约翰请求的拒绝。然而，句子本身并没有提到比尔拒绝了什么，因此在严格的自下而上的系统中（即所有推理都直接来自输入的系统）中做出这种推理将非常困难。\n\
  \n预测也用于为故事中的其他句子寻找解释。例如，当约翰的计划在 (d) 中失败时，会添加一个新的预测，寻找实现相同目标的新计划。当读到行 (e) 时，它推断为讨价计划的一个实例。由于这个计划可以用于约翰的目标，新预测得以实现，事件得到了解释。随后设置了与行\
  \ (c) 之后相似的预测，寻找不同的可能结果。行 (f) 确认了比尔可能拒绝交易的预测。该预测的确认导致了另一个预测的建立，以寻找另一个计划。\n\n行 (g)\
  \ 确认了这个预测，因为自下而上的推理过程推断这是威胁计划的一个实例，这也是从某人那里获得东西的方法。再次设置了预测来寻找可能的结果。由威胁计划设置的预测之一是：如果被威胁的人执行了要求的动作，那么他这样做是为了防止威胁发生。因此，当读到行\
  \ (h) 时，确认的是这个预测。该预测通过构建如下解释解释了行 (h)：比尔必须想要维护他的健康，因此顺从了约翰的要求。故事表示现在包含了这一点（图 7.4）。\n\
  \n![](img/fig7_4_B.jpg)\n\n图 7.4 行 (h) 之后的故事表示。\n\n在这里，约翰的计划引起与比尔之前的欲望冲突，因此比尔选择通过给约翰自行车来顺从约翰的要求。这完成了约翰获得比尔自行车的原目标，该目标在表示中被标记为如此。\n\
