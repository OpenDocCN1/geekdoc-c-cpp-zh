  \ 8-Jan-SO 2:53PM. PS:<RIESBECK>EIGHT.LOG.5]\n```\n\n## 流程图\n\n图 8.1 和 8.2 中的流程图展示了\
  \ McPAM 中的两个核心函数：JUSTIFY 和 PREDICT。JUSTIFY 的流程图包含了两个部分的控制流：TRY-INFERENCE 和 TRY-RULES。\n\
  \n![](img/fig8_1_B.jpg)\n\n图 8.1 JUSTIFY(event).\n\n![](img/fig8_2_B.jpg)\n\n图 8.2\
  \ PREDICT(event).\n\n## 程序\n\n\n\n\n\n# 微型 PAM 程序\n\n`PROCESS-STORY` 获取整个故事并逐行将其输入到\
  \ `PROCESS-CD` 过程中处理。\n\n`PROCESS-CD` 每次处理故事中的一个 CD（概念单元）。每个 CD 都会被发送到 `JUSTIFY`\
  \ 进行解释。\n\n## 核心逻辑概述\n\n`JUSTIFY` 首先尝试检查此输入是否被预测。如果尚未被预测，它将尝试从输入进行自底向上的解释性推理，然后对\
  \ `JUSTIFY` 该推断出的解释。这个循环形成了一个 CD 链：`CD` → `CD1` → `CD2` → `CD3`…\n\n如果最终推断出一个与预测匹配的\
  \ CD，那么链中的 CD 就可以添加到数据库中。\n\n注意：由于链中是最新的 CD 在前，因此在将 CD 添加到数据库之前会进行反转。\n\n如果最新的 CD\
  \ 没有触发任何推理，`TRY-INFERENCE` 将回溯到链中之前的 CD 并尝试不同的推理规则。\n\n```lisp\n(DE PROCESS-STORY\
  \ (STORY)\n (CLEAR-GLOBALS)\n (FOR (CD IN STORY) (DO (PROCESS-CD CD)))\n\n(DE PROCESS-CD\
  \ (CD) (JUSTIFY CD))\n\n(DE JUSTIFY (INPUT)\n  (MSG T “Trying to explain”)\n  (SPRINT\
  \ INPUT 4)\n  (MSG T)\n  (LOOP (INITIAL *CHAIN* NIL CD INPUT)\n        (UNTIL (PREDICTED\
  \ CD))\n        (DO (MSG T “Does not confirm prediction” T)\n             (PUSH\
  \ (LIST CD *INFERENCE-RULES*) *CHAIN*))\n        (WHILE (SETQ CD (TRY-INFERENCE)))\n\
  \        (RESULT (COND (CD\n                      (MSG T “Adding inference chain\
  \ to data base”)\n                      (FOR (CD-INF IN (REVERSE *CHAIN*))\n   \
  \                         (DO (UPDATE-DB (CAR CD-INF)))\n                      \
  \      (UPDATE-DB CD))\n                      (T (MSG T “No chain found—adding”))))\n\
  \  (UNTIL CD)\n  (RESULT (CD (MSG T “Possible explanation assuming”)\n         \
  \         (SPRINT CD 4)\n                  (MSG T)\n                  CD)))\n```\n\
  \n## 函数定义\n\n### PREDICTED\n`PREDICTED` 检查 CD 是否能通过数据库直接与已知主题、目标或计划相关。\n- `*KNOWN-THEMES*`：故事中遇到或推断出的所有主题列表。\n\
  - `*KNOWN-GOALS*`：所有目标的列表。\n- `*KNOWN-PLANS*`：所有计划的列表。\n- `*PLANSFOR*`：将目标与其可能生成的计划相关的规则列表。\n\
  - `*INSTOF*`：将计划与其实例化形式相关的规则列表。\n- `*INIT-RULES*`：将主题与其引发的目标相关的规则列表。\n\n```lisp\n\
  (DE PREDICTED (CD)\n (COND ((ISA ‘GOAL CD) (OR (RELATE CD *KNOWN-THEMES*) *INIT-RULES*)\n\
  \                     (RELATE CD *KNOWN-PLANS* *SUBFOR*))\n      ((ISA ‘PLAN CD)\
  \ (RELATE CD *KNOWN-GOALS* *PLANS*))))\n```\n\n### RELATE\n`RELATE` 尝试使用 `RULE-LIST`\
  \ 中的规则将输入与 `ITEM-LIST` 中的某些项相关。嵌入的 `FOR-EXISTS` 循环等同于说“存在一个项，使得存在一条规则，该输入通过该规则与该项相关”。\n\
  \n```lisp\n(DE RELATE (CD ITEM-LIST RULE-LIST)\n  (LET (BD)\n    (FOR (ITEM IN ITEM-LIST)\n\
  \      (EXISTS\n        (FOR (RULE IN RULE-LIST)\n          (EXISTS (COND ((AND\
  \ (SETQ BD (MATCH-SIDE (RHS RULE) CD))\n                            (MATCH-SIDE\
  \ (LHS RULE) ITEM BD)))\n                      (MSG T “Confirms prediction from”)\n\
  \                      (SPRINT ITEM 4)\n                      (MSG T)\n        \
  \              T))))\n```\n\n### TRY-INFERENCE\n`TRY-INFERENCE` 尝试从链（一个对列表）中进行推理。移除第一个对并尝试对\
  \ `CD` 进行推理。如果成功，则返回新的 `CD`（`TRY-RULES` 将更新后的 `CD` 对放在链的前端）。如果失败，则从链中取下一个 `CD`。如果链耗尽，所有可能的推理都失败了。\n\
  \n```lisp\n(DE TRY-INFERENCE ()\n  (LOOP (INITIAL CD-INF NIL NIL)\n        (WHILE\
  \ *CHAIN*)\n          (DO (SETQ CD-INF (POP *CHAIN*))\n             (COND ((NULL\
  \ (SETQ CD (TRY-RULES CD-INF)))\n                   (CADR CD-INF))))\n         \
  \ (MSG T “No usable inferences from”)\n          (SPRINT (CAR CD-INF) 4)))\n```\n\
  \n### TRY-RULES\n`TRY-RULES` 将 `CD` 与每个规则的 Result 模式进行匹配，直到有一个匹配为止，此时：\n1. 将 `CD`\
  \ 和剩余未尝试的规则放入 `*CHAIN*`。\n2. 返回从规则推断出的 `CD`。\n如果没有规则匹配，则返回 `NIL`。\n\n```lisp\n(DE\
  \ TRY-RULES (CD RULES)\n  (LOOP (INITIAL RULE BD NIL)\n        (WHILE RULES)\n \
  \         (DO (SETO RULE (POP RULES)))\n          (UNTIL (SETQ BD (MATCH-SIDE (RHS\
  \ RULE) CD))))\n        (RESULT (COND (BD\n                      (PUSH (LIST CD\
  \ RULES) *CHAIN*)\n                      (INSTANTIATE (CAR (LHS RULE))))\n```\n\n\
  ## 数据库管理\n\n`UPDATE-DB` 将 `CD` 添加到数据库。它还维护主题、目标和计划的独立数据库。\n\n```lisp\n(DE UPDATE-DB\
  \ (CD)\n  (MSG T) (SPRINT CD 4) (MSG T)\n  (ADD-CD CD)\n  (COND ((ISA CD) (MSG “theme”\
  \ T) (PUSH CD *KNOWN-THEMES*))\n        ((ISA ‘GOAL CD) (PUSH CD *KNOWN-GOALS*))\n\
  \        ((ISA ‘PLAN CD) (PUSH CD *KNOWN-PLANS*))))\n```\n\n`*DATA-BASE*` 只是我们想要记住的语句列表。新项被添加到列表末尾。\n\
  \n```lisp\n(DE ADD-CD (CD)\n  (SETQ *DATA-BASE* (CONS-END *DATA-BASE* CD)))\n```\n\
  \n`MATCH-SIDE` 用于将规则的侧与输入匹配。只有当模式匹配且语义约束求值为真时，侧才会匹配。该表达式可能引用模式匹配绑定的变量。`*CURRENT-BD*`\
  \ 是规则内变量的绑定列表。通过 `*VAR*` 引用。在 `MATCH_SIDE` 之外它是 `NIL`。\n\n```lisp\n(DE MATCH-SIDE\
  \ (SIDE CONST BD)\n  (LET ((CURRENT-BD* (MATCH (PATTERN:SIDE SIDE) CONST BD))\n\
  \    (AND *CURRENT-BD*\n         (EVAL (CONSTRAINT: SIDE SIDE))\n         *CURRENT-BD*)))\n\
  ```\n\n`ISA y x` 测试 `x` 是否为一个 `y`。例如，`(ISA ‘BOOK ?Z)` 检查 `Z = BOOK` 或 `(BOOK…)`\
  \ 或 `(… (TYPE BOOK)…)` 或 `Z` 的头部具有值为 `BOOK` 的属性 `ISA`。\n\n```lisp\n(DE ISA (TYPE\
  \ CD)\n  (COND ((NUMBERP CD) NIL)\n        ((ATOM CD) (ISA-CHECK TYPE CD))\n   \
  \     (T (OR (ISA-CHECK TYPE (HEADER :CD CD))\n               (LET (X (FILLER:ROLE\
  \ TYPE CD))\n                 (COND (X (ISA-CHECK TYPE (HEADER:CD)))))))\n```\n\n\
  `ISA-CHECK` 是 `ISA` 的子函数，仅适用于原子。`POS-VAL (CD)` 在 `CD` 为正数时返回 `T`。\n\n```lisp\n(DE\
  \ POS-VAL (CD)\n  (COND ((CONSP CD) (SETQ CD (CAR CD)))\n        (AND (NUMBERP CD)\
  \ (NOT (EQUAL CD 0)))))\n```\n\n## 数据结构与 ISA 链接\n\n`PLANFOR` 将关于目标的可能计划的规则添加到推理基中。`INSTANTIATION`\
  \ 将关于计划可能实例的规则添加到推理基中。`SUBGOAL` 将关于计划的前决条件的规则添加到推理基中。`INITIATE` 添加将主题与目标相关的规则。\n\
  \n`CLEAR-GLOBALS` 清空全局数据库。\n\n```lisp\n(DE CLEAR-GLOBALS\n  (SETQ *KNOWN-THEMES*\
  \ NIL)\n  (SETQ *KNOWN-GOALS* NIL)\n  (SETQ *KNOWN-PLANS* NIL)\n  (SETQ *DATA-BASE*\
  \ NIL)\n  (SETQ *CURRENT-BD* NIL))\n```\n\n定义一些 ISA 链接：\n\n```lisp\n(DEFPROP PTRANS\
  \ ISA)\n(DEFPROP GRASP ISA)\n(DEFPROP TAKE-PLAN ISA)\n(DEFPROP READ-PLAN)\n(DEFPROP\
  \ STORE-PLAN ISA)\n(DEFPROP WALK-PLAN ISA)\n(DEFPROP USE-VEHICLE-PLAN)\n```\n\n\
  ### 示例\n\n故事是一个 `CD` 列表。每个 `CD` 是一个原子（例如 `PTRANS`）或一个带有可选谓词参数的元组。一个 3 行故事示例是：\n\n\
  ```lisp\n(SETQ STORY\n  '(Willa was hungry.\n    She picked up the Michelin guide\n\
  \    She got into her car))\n```\n\n\n\n\n\n## 练习题\n\n1. 为处理以下故事添加所需的推理规则：“约翰想要比尔的自行车。他要求比尔把自行车卖给他，价格\
