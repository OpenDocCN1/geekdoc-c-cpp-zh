  \n```\n TOP OF STACK:\n(((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE))\n (ASSIGN\
  \ *SUBJECT* (CD-FORM*)\n (NEXT-PACKET\n ((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n\
  \ (ASSIGN *CONCEPT* *CD-FORM*]\n```\n\n### McELI 与 ELI/CA\n\nMcELI 和 ELI/CA 的区别在于，几乎一切都取决于之前的内容。这是通过将正在填充的槽位、对这些槽位的约束以及在触发时寻找满足这些约束的请求分开来实现的。关于这种自顶向下控制是如何实现的，请参阅\
  \ [Riesbeck (1978)]。\n\n然而，最根本的区别是 McELI 缺乏自顶向下的控制。本章的最后一个练习只是纠正这一点的一小步。\n\nMcELI\
  \ 控制结构的限制性是刻意为之的。通过限制查看的请求数量并以后进先出的方式处理它们，减少了触发错误请求的概率。因此，对于学习目的来说，发生得少比发生多的要好。在实际的分析器中，这种简单性必须用开放请求集的强大功能来换取。\n\
  \n## 示例输出\n\n以下是 McELI 程序应用于句子“Jack went to the store. He got a kite. He went home.”的日志。\n\
  \n\n\n\n\n```\n [PH: Initiation. 7-Jan-80 4:28PM]\n…\n(PROCESS-TEXT KITE-TEXT)\n\
