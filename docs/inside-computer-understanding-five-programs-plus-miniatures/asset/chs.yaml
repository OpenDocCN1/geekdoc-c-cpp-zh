  (OBJECT (GUN))))\n<sup\nsup>He went to the liquor store\n (PTRANS (ACTOR (NAME (JOHN))))\n\
  (OBJECT (NAME (\n))))\n(TO ()))\n<sup\nsup>Hesup the owner he wanted the money\n\
  \ (MTRANS (ACTOR (NAME (JOHN))))\nJOHNTO (OWNER (\n(MOBJECT (GOAL (PLANNER (NAME\
  \ (JOHN))))\n(OBJECT (MON ( ()))\n<sup\nsup>The owner gave him the money\n (ANSANS\
  \ (ACTOR (NAME (OWNER))))\n(OBJECT (\nEY)))\nTO (NAME (JOHN)))))\n<sup\nsup>John\
  \ left\n (PTRANS (ACTOR (NAME (JOHN))))\n(OBJECT (NAME (JOHN))))\n(TO ()))))))\n\
  ```\n\n5. 在这个 `McPAM` 版本中，当你想要给计划提供多个子目标时，你必须为每个目标单独编写规则。更好的方法是在右侧允许多个模式表达式，每个表达式对应左侧的一个子目标。通过修改\
  \ `RHS`、`RELATE` 和 `TRY-RULES` 来修改 `McPAM` 实现这一点。\n\n\n\n\n对原始理论的适配并非没有差异，即使在计划层面也是如此。在他们的理论中，通信计划\
  \ `DKNOW` 包含了各种通信任务。而在 `TALE-SPIN` 中，信息的传输和获取之间有明确的区别，并且它们由独立的程序来描述。\n\n我还将解决问题的知识与关于社会关系和个人特征的信息合并在一起，主要作为说服行为的前决条件。我使用的“量表”源于\
  \ Myron Wish (1975) 的部分工作，并被扩展以描述该程序所编写的故事中更具体的要求。\n\n`TALE-SPIN` 中除问题解决组件之外的第二大部分部分是英语生成器。起初，我使用了\
  \ Goldman 的 `BABEL` 版本（`Goldman, 1975`），但匹配效果并不理想，在人工智能领域那种标准但又不幸的传统下，我从头开始写了自己的。逐渐地，它越来越地依赖记忆（时间顺序记录），使其会说“Joe\
  \ Bear 回到了他的洞穴”而不是“Joe Bear 去了洞穴”，并且知道何时该说“Irving Bird 不再饿了”而不是更简单的“Irving Bird\
  \ 不饿”。\n\n推理机制始于简单的、“无上下文”后果，这些后果是“概念依赖”（`Conceptual Dependency`）原始动作定义的一部分。它们被扩展到包含三个新领域：上述的社会状态知识；每当有人从一个地方移动到另一个地方时，“注意到”产生的影响（不幸但不可避免，这是大量简单推理的来源）；以及“反应”，即来自\
  \ `MLOC` 的推理，其数量几乎与系统其他部分的推理总数相等。\n\n在可能被研究的许多领域中，物理空间的表征似乎难以推迟，由此产生的“地图”和“蓝图”的理论与实现与\
  \ Minsky 的框架（frames）定义最为相似。这些信息在生成新角色和新设定时会被使用；例如，如果某物是一间房子，那么它就有一个前门，可能有一个二楼卧室，等等。由于\
  \ `TALE-SPIN` 中的角色是会说话的动物和人类，蓝图描述的是草地、山谷等。它们是按需创建的（当旅行发生时）。\n\n最后，`TALE-SPIN` 反映了一个易于陈述的故事理论：故事既是连贯的有趣的，并且跨越多个层次。为了解释这一陈述，让我先描述模拟器的整体控制过程。\n\
  \n当一个事件发生时，它会被“断言”（asserted），这意味着它被记录且其所有的后果都会被计算并同样被断言。一种事件被称为目标语句，例如“约翰想看玛丽”。当一个目标语句被断言时，就会调用相应的问题解决程序，即用于运输目标（`DPROX`）、用于通信目标（`DKNOW`）等的程序。这些程序调用子目标并最终产生新事件，这些事件随后被断言，继续循环。模拟开始于建立一个“设定”和一组角色。其中一个角色被赋予了一个要解决的问题。在解决该问题的过程中，该角色可能会与其他角色发生交互。如果一个角色说服另一个角色做某事，那么第二个角色就开始解决问题。模拟器跟踪所有的角色。\n\
  \n这是连贯性模型——角色的行为应该是理性的——它为问题解决理论提供了测试。但除此之外，故事必须是有趣的。在 `TALE-SPIN` 中，一个有趣的故事会设定一个特定的问题和一个被称为“兴趣领域”的核心问题领域。故事是“关于”解决那个问题的。解决方案的细节应该属于兴趣领域，且问题不应该太容易被解决。兴趣领域的层次区分了简单的冒险故事与像康拉德的《黑暗之心》这样的作品。如果让模拟器自由发展，它将创建一个关于角色受饥饿等非常基本需求驱动的低级故事，而这些故事与实际民间故事之间的相似已被注意到（de\
  \ Beaugrande and Colby, 1979）。但为了讲述更高层次的故事，模拟器需要提前建立设定，特别是角色之间的关系，以便他们的预测行为与故事的需求对应。通过这种方式，`TALE-SPIN`\
  \ 能够生成具有“观点”的故事，例如简单的伊索寓言。\n\n### 示例\n\n这是一个 `TALE-SPIN` 故事示例。在与用户进行初始对话、建立角色和物理设定后，故事在每个角色都变得口渴时开始。该故事不需要关于社会关系的信息，因为所有角色都有营救任何处于生命危险之人的动机。\n\
  \n为了简练，大部分“结果性”推理已从输出中省略。这里添加了段落以表示使用同一组角色和地点的独立故事。\n\n> 从前有一只蚂蚁 GEORGE 住在一片土地附近。一棵灰树上有一个巢。WILMA\
  \ BIRD 住在巢里。河里有一些水。WILMA 知道水在河里。GEORGE 知道水在河里。一天，WILMA 非常渴。WILMA 想靠近水。WILMA 从她的巢飞起，穿过草地，穿过山谷到达河流。WILMA\
  \ 喝了水。WILMA 不再渴了。\n\n> GEORGE 非常渴。GEORGE 想靠近水。GEORGE 从他的土地出发，穿过草地，穿过山谷到达岸边。GEORGE\
  \ 掉进了水里。GEORGE 想靠近山谷。GEORGE 无法靠近山谷。GEORGE 想靠近草地。GEORGE 无法靠近草地。WILMA 想让 GEORGE 靠近草地。WILMA\
  \ 想靠近 GEORGE。WILMA 用爪子抓住 GEORGE。WILMA 带着 GEORGE 从河流穿过山谷到达草地。GEORGE 非常感激 WILMA。GEORGE\
  \ 的一切都归于 WILMA。WILMA 放开了 GEORGE。GEORGE 掉落在草地上。结束。\n\n结尾的两个关系状态是“演示性”（demon）推理——对于任何把他拉出水的人，George\
  \ 都会做出那种反应。\n\n这是一个显示“详细模式”的示例，每个推理都会被打印。角色之间的关系通过与用户的对话建立，该部分已省略。\n\n> 从前有一只熊 JOHN\
  \ 住在洞穴里。JOHN 知道 JOHN 在他的洞穴里。一棵枫树上有一个蜂巢。TOM BEE 知道蜂巢在枫树上。TOM 在他的蜂巢里。TOM 知道 TOM 在他的他的蜂巢里。TOM\
  \ 的蜂巢里有一些蜂蜜。TOM 知道蜂蜜在 TOM 的蜂巢里。TOM 拥有蜂蜜。TOM 知道他拥有蜂蜜。樱树上有一个巢。ARTHUR BIRD 知道巢在樱树上。ARTHUR\
  \ 在他的巢里。ARTHUR 知道 ARTHUR 在他的巢里。ARTHUR 知道 JOHN 在他的洞穴里。JOHN 知道 ARTHUR 在他的巢里。JOHN 知道\
  \ TOM 在他的蜂巢里。灌丛附近有一些黑莓。花坛里有一朵莉花。ARTHUR 知道黑莓在灌丛附近。JOHN 知道莉花在花坛里。\n\n\n\n\n\n> 有一天，约翰非常饿。约翰想得到一些蜂蜜。约翰想找出哪里有蜂蜜。约翰喜欢亚瑟。约翰想让亚瑟告诉他哪里有蜂蜜。约翰对亚瑟很诚实。约翰并不和亚瑟竞争。约翰认为亚瑟也喜欢他。约翰认为亚瑟对他很诚实。约翰想问问亚瑟，亚瑟是否愿意告诉约翰哪里有蜂蜜。约翰想靠近亚瑟。约翰从一个洞穴出口，经过一个山口，穿过一个山谷，经过一片草地，到达樱树旁的地面。约翰在樱树旁的地面。约翰知道约翰自己在樱树旁的地面。约翰知道亚瑟在他的巢穴里。亚瑟知道约翰在樱树旁的地面。约翰问亚瑟是否愿意告诉约翰哪里有蜂蜜。亚瑟对约翰没有很大的影响力。亚瑟记得他爱着约翰。亚瑟对约翰很诚实。\n\
  \n此时，亚瑟已经决定告诉约翰蜂蜜在哪里。这只是故事的前三分之一。剩下的部分讲述了约翰·贝尔（John Bear）如何去汤姆·蜂（Tom Bee）的蜂巢要蜂蜜，但他被拒绝了。这一点说明\
  \ `TALE-SPIN` 并不是通过组合单词来构建故事。它拥有一个非常复杂的、多参与者的世界模型，最终打印出的句子仅显示了程序真正已知信息的一小部分。\n\n\
  ### 程序行为摘要\n\n该程序目前可以创建八种直接编码的不同类型的角色，以及四六种数据驱动的物理位置（例如草地、桥梁，由抽象描述构建）。它包含了为了（`DPROX`）、获取对象（`DCONT`）、获取信息（`DKNOW`）、信息传递（`TELL`）、说服（`PERSUADE`）、讨价（`BARGAIN`）以及请求（`ASK`）的显式问题解决程序。标准的\
  \ `CD` 原语被扩展包含了 `PLAN` 和 `WANT` 动作，并使用了十三种“社会”状态（例如诚实、情感）。共有四十一种推理程序。\n\n生成器使用了一个由五十个动词组成的词汇表，此外还有针对系统中每个对象的名词，以及针对系统每个状态的多个形容词（或形容词短语）（例如，对于“能量”等级，生成器可以选择：精疲力竭、筋疲力尽、累、休息过的、活跃的、精力充沛的、亢奋的）。它使用了过去式、现在式、将来式、否定、缩写、不定式短语（“`Joe\
  \ asked Irving to tell him …`”）、疑问（谁、什么、哪里）、条件（是否）、情态（能、可能、将）以及不可名词（例如，“一些”蜂蜜，而不是“一个”蜂蜜）。\n\
  \n除了已经描述的领域，`TALE-SPIN` 还包含一个符号算术包，其中所有的数值概念都被表示为有向图中的点，因此可以在不分配数值的情况下进行偏序比较。这被用于表示事件发生的时间；我们需要比较两个事件的相对时间，以便在英语输出中生成正确的时态。\n\
  \n`TALE-SPIN` 的一个持久的优势点是，它在概念上提供了丰富的可以被发明或扩展的“小”话题。也就是说，如果你希望通过改进对物理空间的表示来改进故事（例如将旅行距离设为规划的先决条件），要找到哪里添加该代码并不困难。生成器的词汇表和语法结构范围很容易扩展。当然，“大”话题（如重新设计顶层控制）并不容易。\n\
  \n意外的是，`TALE-SPIN` 的主要缺点是它的体积。当它 1976 年在耶尔大学的 `Stanford LISP 1.6`（Quam, 1969）下运行时，需要\
  \ 75K（PDP-10 字）来加载，额外的 25K 就能让响应变得合理。今天，`TALE-SPIN` 完全编译并在 UCI 下的 `UCI LISP`（Meehan,\
  \ 1979）下运行，大约需要 90K 加载。增长的一部分是由于 `UCI LISP` 的额外功能，但大部分仅仅是因为系统能力的扩展。两个版本的 `TALE-SPIN`\
  \ 都是用 `MLISP`（Smith, 1970）编写的，这是一种类 ALGOL 语言，通过预处理器转换为 `LISP` 代码进行执行。\n\n该系统并不特别健壮。某些错误由程序本身检测到，它会打印一条消息并等待响应。其中一些是可以忽略的。当生成器无法产生翻译时，它的“错误信息”是“Uh…\
  \ Uh… mumble”，这是一个借自 Goldman 的 `BABEL` 的词。（事实上，`TALE-SPIN` 的生成器被称为 `MUMBLE`）。但遗憾的是，其他消息对我以外的任何人都没有意义。例如，`CD`\
  \ 表达式内部语法的错误，或者时间网中的矛盾（A 在 B 之前且 B 在 A 之前）仍然会。在长故事中，人们可能会熟悉的资源限制。我喜欢的错误信息出现在生成句子的中间：`JOE\
  \ BEAR KNOWS THAT FREE STG EXHAUSTED`。\n\n### 问题\n\n`TALE-SPIN` 有三个主要的理论关注：\n\n\
  1. **计划与目标**。程序展示了 Schank-Abelson 意图理论的新侧面，该理论的主要阐述一直是关于文本的理解而非生成。例如，该理论没有规定获取或拒绝新计划和目标的规则（有时称为目标演算），而且对于某些社会关系与各种问题解决技术之间的联系也没有多多描述——这些都是我在构建系统时被迫面对的问题。\n\
  \n2. **故事的本质**。`TALE-SPIN` 通过定义追求各种目标的角色作为故事的动力，探索了叙事与问题解决之间的联系。即使从饥饿和口渴这种低级目标开始，只需少量努力就能产生一个涉及信任、情感、善意以及缺乏这些情感的故事。故事无疑不仅仅是问题解决的叙事，但它们可能并不此。\n\
  \n3. **作为认知形式的模拟**。起初，我认为管理模拟的困难主要是编程问题（例如如何模仿并行性）。但一旦我让角色自己进行模拟作为一种提前规划的技巧时，我开始相信模拟是记忆的一种形式，在这种情况下，控制它的规则变得重要得多，并且必须放弃编程技巧。\n\
  \n这三个领域仍有许多工作要做。目标演算尚未制定，而且每当目标理论发生变化（通常是通过扩展）时，旧的演算都需要进行重构。例如，你有多少“背景”目标？它们是如何组织的？如果没有这些问题的答案，听起来合理的演算启发式（如“将新目标与背景目标进行比较以决定是否追求它”）太模糊了。\n\
  \n\n\n\n我们将通过观察 `TALE-SPIN` 程序在交互式会话中的行为，开始对其内部机制进行讨论。\n\n大写字母文本来自程序。注释（小写字母）描述了程序的运行流程。我们从一段对话开始以建立角色。\n\
  \n```\n *(START)\n********** WELCOME TO TALE-SPIN **********\nCHOOSE ANY OF THE\
  \ FOLLOWING CHARACTERS FOR THE STORY:\n1: BEAR 2:BEE 3: BOY 4: GIRL 5: FOX\n6: CROW\
  \ 7 ANT 8: CANARY\n*1 2\n```\n\n通过回答 `1` 和 `2`，我们要求程序虚构一只熊和一只蜜蜂。它们的名字和性别（`3` 和 `4`\
  \ 除外）是随机选择的。当角色创建时，会包含一些本地设定：他们的家，以及可能在那里发现的一些物品。初始状态下所有角色都从家里开始。叙述使用过去时。\n\n> 从前，有一只萨萨姆熊住在洞穴里。萨姆知道萨姆在他的洞穴里。\n\
  \n所有角色都被告知了它们的初始位置。\n\n> 苹果树上有一个蜂巢。贝蒂蜜蜂知道蜂巢在苹果树上。贝蒂蜜蜂在她的蜂巢里。贝蒂知道贝蒂在她的蜂巢里。贝蒂的蜂巢里有一些蜂蜜。贝蒂知道蜂蜜在贝蒂的蜂巢里。贝蒂拥有蜂蜜。贝蒂知道贝蒂拥有蜂蜜。\n\
  \n蜜蜂的模型设定为它们住在蜂巢里并“拥有”蜂蜜。蜂巢的模型规定了它们存在于树上，因此创建者将所有这些物品添加到了模拟世界中。\n\n包含以“贝蒂知道……”开头的句子是为了展示程序正在存储这些信息，以便在日后用于解决问题和进行推理。\n\
  \n```\nDOES BETTY BEE KNOW WHERE SAM BEAR IS? *NO\nDOES SAM BEAR KNOW WHERE BETTY\
  \ BEE IS? *YES\nSAM KNEW THAT BETTY WAS IN HER BEEHIVE.\nSAM KNEW THAT BETTY HAD\
  \ THE HONEY.\n```\n\n由我们决定角色之间是否互相认识。\n\n```\n—你想要故事里出现这些东西吗？\n(BREADCRUMBS CHEESE\
  \ BASEBALL) *NO\n```\n\n这些是可以包含进去并分配给角色的道具，但在这种情况下，我们决定不使用其中的任何一个。\n\n```\n.\n—你想要故事里出现这些东西吗？\n\
  (BERRIES FLOWER WATER WORM) YES\n哪几个？\n1: BERRIES 2: FLOWER 3: WATER 4: WORM\n*2\n\
  花坛里有一朵玫瑰花。\n谁知道这朵玫瑰花？\n1: BETTY BEE 2: SAM BEAR\n*2\n萨姆熊知道这朵玫瑰花在花坛里。\n```\n\n这些道具也可以被创建，但它们不属于任何角色。相反，由我们来决定谁知道它们在哪里。\n\
  \n```\n这是一个关于……的故事\n1: BETTY BEE 2: SAM BEAR\n*2\n他的问题是……\n1: HUNGRY 2: TIRED 3:\
  \ THIRSTY 4: HORNY\n```\n\n大写字母文本来自程序。注释（小写字母）描述了程序的运行流程。我们从一段对话开始以建立角色。\n\n\n\n\
  \n\n推断机制通常用于计算结果，但它也可以计算前置条件，即“反向”推断。休息（更准确地说，达到静止状态）的前置条件是睡眠，这通过一个脚本来描述。该脚本的前置条件是位于家中。这的前置条件是有人带你回家（可能是你自己）。带你回家的前置条件是知道家在哪里，以及它位于你附近，等等，以此支持因果链。每当我们获得一个新的前置条件时，都会尝试将其与目标事件进行匹配，在这个例子中，目标事件是贝蒂离开蜂巢。通往休息的链中没有任何环节是匹配的，至少在预设的长度内不是的。然而，从“贝蒂不饿”反向推导，我们计算出“贝蒂吃了一些食物”、“贝蒂有一些食物”、“X（未指定的执行者）给贝蒂提供了食物”、“X\
  \ 在食物附近”以及“Y（未指定的）移动 X 到了食物处”。这最终匹配了“贝蒂离开蜂巢”（更准确地说，贝蒂将贝蒂自己从蜂巢移动到蜂巢以外的任何地方），因为我们可以将其扩展（类似于合一）为“贝蒂将贝蒂自己从蜂巢移动到花上”。\n\
  \n但这还不够。萨姆必须诱骗贝蒂去这样做。我们继续向上搜索因果链，直到找到一个萨姆可以满足的前置条件。在贝蒂去花之前，她必须知道花在哪里。为了让这发生，必须有人告诉她花在哪里。这最终成了萨姆可以满足的前置条件。（如果萨姆认为贝蒂已经知道花在哪里，那么这个策略就会被拒绝，并尝试其他替代方案。）\n\
  \n```\n SAM DECIDED THAT IF SAM TELLS BETTY WHERE THERE WAS A FLOWER THEN BETTY\
  \ MIGHT NOT BE NEAR HER BEEHIVE.\n```\n\n这个例子展示了模拟器所使用的推断机制如何被角色们用于他们自己的规划。在这个例子中，角色们正在计算“反向”推断（前置条件）；在考虑请求时，角色们使用“正向”推断（结果）来帮助他们决定是否遵守请求。\n\
  \n不能保证计划一定会成功。某些计划取决于特定的社会关系，尽管比尔·福克斯（Bill Fox）可能认为亨利·克劳（Henry Crow）很虚荣，但亨利可能并不虚荣，在这种情况下，比尔的计划可能会失败。\n\
  \n```\n SAM WANTED TO TELL BETTY WHERE THERE WAS A FLOWER.\n```\n\n为了让这个计策生效，萨姆必须和贝蒂说话。`TELL`\
  \ 程序现在处于激活状态。\n\n```\n SAM WANTED TO GET NEAR BETTY.\n```\n\n`TELL` 中的第一个计划框是去找贝蒂。如果失败了，萨姆会尝试使用信使。\n\
  \n```\n SAM WALKED FROM A CAVE EXIT THROUGH A PASS THROUGH THE VALLEY TO THE GROUND\
  \ BY THE APPLE TREE.\nSAM WAS NEAR THE GROUND BY THE APPLE TREE.\nSAM KNEW THAT\
  \ SAM WAS NEAR THE GROUND BY THE APPLE TREE.\nBETTY KNEW THAT SAM WAS NEAR THE GROUND\
  \ BY THE APPLE TREE.\n```\n\n负责物理布局的模块创建了所有中间的地景观，萨姆成功到达了贝蒂的树下，两人都知道了这一事实。\n\n```\n\
  \ SAM TOLD BETTY THAT THE ROSE FLOWER WAS IN THE FLOWERBED.\nBETTY KNEW THAT SAM\
  \ TOLD BETTY THAT THE ROSE FLOWER WAS IN THE FLOWERBED.\n```\n\n这就是他需要做的全部。如果计策成功了，剩下的会自动发生。\n\
  \n```\n HOW DECEITFUL DID BETTY THINK THAT SAM FELT TOWARD HER?\nNOT AT ALL\nBETTY\
  \ THOUGHT THAT SAM WAS HONEST WITH HER.\nBETTY KNEW THAT SAM KNEW THAT THE ROSE\
  \ FLOWER WAS IN THE FLOWERBED.\n```\n\n如果贝蒂认为萨姆对她是诚诚的，那么她就会相信他相信他刚刚告诉她的话。\n\n```\n\
  \ HOW MUCH DID BETTY TRUST SAM? LOTS\nBETTY TRUSTED SAM COMPLETELY.\nBETTY KNEW\
  \ THAT THE ROSE FLOWER WAS IN THE FLOWERBED.\n```\n\n为了让贝蒂接受萨姆说的话为真，她还必须信任他。虽然初看起来我们过于谨慎了，但这实际上允许角色们在欺骗彼此的尝试中失败，这比那些每个人总是相信别人的故事要有趣得多。\n\
  \n```\n HOW HUNGRY WAS BETTY? VERY\nBETTY WAS FAMISHED.\n```\n\n当贝蒂发现某些食物在哪里时（记得在这里蜜蜂吃花朵的），一个可能的结果（反应）是她将去吃它。但我们还没有确定贝蒂是否饥，所以\
  \ `TALE-SPIN` 提出了提问。如果我们回答不饿，萨姆的计划就会失败。由于我们回答了饿，`S-HUNGER` 被重新激活，这次是以贝蒂·蜂作为饥饿的角色。我们再次调用\
  \ `DCONT` 然后是 `DPROX`。\n\n```\n BETTY WANTED TO GET A FLOWER.\nBETTY WANTED TO GET\
  \ NEAR THE ROSE FLOWER.\n```\n\n未指定的花被解析为特定的玫瑰，她知道玫瑰所在的位置（因此跳过了 `DKNOW`）。\n\n```\n\
  \ BETTY FLEW FROM HER BEEHIVE THROUGH A VALLEY THROUGH A VALLEY TO THE ROSE FLOWER.\n\
  BETTY WAS NEAR THE ROSE FLOWER.\nBETTY KNEW THAT BETTY WAS NEAR THE ROSE FLOWER.\n\
  ```\n\n后两个句子是她旅程的结果。\n\n```\nBETTY TOOK THE ROSE FLOWER.\nBETTY HAD THE ROSE FLOWER.\n\
  BETTY KNEW THAT BETTY TOOK THE ROSE FLOWER.\nBETTY KNEW THAT BETTY HAD THE ROSE\
  \ FLOWER.\n```\n\n`DCONT` 被 `S-HUNGER` 调用，现在成功了。`S-HUNGER` 指定下一步要做的是吃花。\n\n```\n\
  \ BETTY ATE THE ROSE FLOWER.\nTHE ROSE FLOWER WAS GONE.\nBETTY WAS NOT HUNGRY.\n\
  BETTY THOUGHT THAT THE ROSE FLOWER WAS GONE.\n```\n\n吃东西的结果是它被毁了。此时，贝蒂没有更多目标了，所以这个部分结束了。当然，萨姆心中还有待行动。\n\
  \n```\n SAM TOOK THE HONEY.\nSAM HAD THE HONEY.\nSAM KNEW THAT SAM TOOK THE HONEY.\n\
  SAM KNEW THAT SAM HAD THE HONEY.\nSAM ATE THE HONEY.\nTHE HONEY WAS GONE.\nSAM WAS\
  \ NOT HUNGRY.\nSAM THOUGHT THAT THE HONEY WAS GONE.\nTHE END.\n```\n\n同样，他拿走了蜂蜜并吃掉。他没有更多目标了，由于这是他的顶级目标，故事结束了。\n\
  \n## 模块\n\n### 问题解决过程\n\n为了产生上面的故事，必须提供通过规划实现目标的详细知识。本部分的示例描述了角色们使用的规划方法的实现。某些特定技术的前置条件涉及角色之间的社会关系（例如喜欢、信任）或性格特质（例如善良）。这些都表示为从\
  \ -10 到 +10 的刻度。例如，如果 `X` 喜欢 `Y`，则表示 `(affection > 0)`。\n\n> `REQUEST (X, Y, Z)`\n\
  \n> X 请求 Y 执行 Z\n\n> 如果 Y 讨厌 X、不信任 X 或支配 X，则 Y 将拒绝。\n\n> 如果 Y 非常喜欢 X 或欠 X，则 Y 将同意。\n\
  \n> 如果有“正向”结果，即某些结果包含快乐度的增加（`+joy`）或者是常量目标的前置条件，则 Y 将同意。\n\n> 如果有“负向”结果，则 Y 将拒绝。\n\
  \n> 如果 Y 很善良，则 Y 将同意。否则，Y 将拒绝。\n\n> `PROMISE (X, A, Y, B)`\n\n> Y 承诺如果 X 执行 A 就执行\
  \ B\n\n> 如果 X 倾向于欺骗 Y，则 X 会同意但在得知 Y 完成 B 后实际上计划侮辱 Y。（延迟计划通过 demon 实现。）\n\n> 如果 X\
  \ 喜欢 Y，则 X 会同意并计划执行 A。否则，X 将拒绝。\n\n> `BARGAIN (X, Y, ACT)`\n\n> X 想和 Y 讨价还价以执行 ACT\n\
  \n\n\n\n\nX 考虑 Y 似乎一直拥有的目标（循环性 S 目标）。对于那些需要实体的目标（例如，`S-HUNGER` 需要的食物），X 会询问 Y，如果\
  \ X 给 Y 带来这样一个物体，Y 是否会执行 `ACT`。（如果 X 认为 Y 已经拥有该物体，或者获取该物体的计划已经在 X 的目标栈中，则放弃该计划。）在提问（通过\
  \ `TELL` 完成）之后，程序会检查 X 现在是否知道 Y 不会同意这笔交易——那部分信息将在 Y 对问题做出反应时由推理机制生成，因此在 `TELL` 返回时，答案可能已经确定。如果\
  \ Y 同意了交易，则 X 尝试获取该物体。如果失败，X 就会放弃该念头。否则，X 就把物体交给 Y。再次，一旦发生这种情况，Y 就会产生一种反应（要么执行其交易中的部分，要么不），因此如果发生了\
  \ `ACT`，则判定讨价还价成功。\n\n### `DCONT(X, Y)`\nX 想要获得 Y。\n\n与所有的目标程序一样，我们检查 X 是否已经拥有 Y——如果是这种情况，D\
  \ 目标成功——或者 X 当前是否正在获取 Y——如果是这种情况，则目标失败。如果 X 不知道 Y 在何处（或谁拥有 Y），则调用 `DKNOW` 来查找。如果查找也失败了，`DCONT`\
  \ 也会失败。\n\n第一个“计划框”（技术）是询问 Y 是否由某人拥有。如果没有，X 直接去寻找 Y（调用 `DPROX`）；如果 X 无法到达那里，`DCONT`\
  \ 失败。一旦 X 到达那里，我们再次测试 X 是否知道谁拥有 Y。这是必须的，以防“没有人拥有 Y”这个念头是错误的——在某些故事中，角色会在这类问题上互相撒谎。如果一切顺利，X\
  \ 尝试拿走 Y（`DO-ATRANS`），如果尝试成功，`DCONT` 成功。\n\n第二种技术是让 X 说服所有者将 Y 交给 X。然而，如果 X 是不诚实的，且\
  \ X 能到达所有者那里（`DPROX`），那么 X 将尝试通过欺骗所有者来达到目的：先弄清楚（通过“反向”推理）所有者可以执行什么动作能让 Y 靠近 X，然后弄清楚（通过“逻辑”推理）X\
  \ 可以做什么来激励所有者执行该动作。这方面的例子是寓言《狐狸和乌鸦》中的奉承：乌鸦叼着狐狸想要的奶酪，狐狸认为乌鸦很虚荣，于是他赞美乌鸦的歌声并请求它唱歌，知道如果乌鸦开始唱歌，奶酪就会掉。另一个例子是，一只熊挑战另一只熊（正拿着蜂蜜）赛跑。第二只熊放下蜂蜜出发了，于是第一只熊拿了蜂蜜向相反方向跑去。奉承的计划要求狐狸认为乌鸦是虚荣的，为了让计划生效，乌鸦事实上必须是虚荣的。这两个想法是独立的——狐狸可能是错的，如果是那样，计划就会失败。同样，挑战要求两个角色之间存在竞争心态。\n\
  \n如果未使用使用欺骗选项，或者欺骗失败了，则 X 尝试简单的说服。如果不起作用，且 X 是不诚实的，那么 X 会考虑直接偷窃。X 尝试让所有者离开 Y（`D-NEG-PROX`），然后\
  \ X 去尝试拿走 Y（`DO-ATRANS`）。\n\n### `DKNOW(X, Q)`\nX 想要找到问题 `Q` 的答案。\n\nX 尝试说服一个他已经知道位置的朋友告诉他\
  \ `Q` 的答案。如果不行，他请该朋友告诉他可以在哪里找到其他朋友，然后向他们询问关于 `Q`。最后，X 尝试说服他的朋友们自己找到 `Q` 的答案，然后告诉他。\n\
  \n（这里还没有检查这些朋友是谁，而且很容易陷入死循环。最近的一个真实例子：“SUE 想要问 PEGGY 是否 PEGGY 会问 BETTY 是否 BETTY\
  \ 会问 PEGGY 是否 PEGGY 会问 BETTY 是否 BETTY 会问 PEGGY 是否 PEGGY 会问 BETTY 是否 BETTY 会问 PEGGY\
  \ 是否 PEGGY 会告诉 SUE 奶酪在哪里，如果 SUE 给 PEGGY 些蜂蜜，如果 SUE 给 BETTY 些蜂蜜……（此处省略重复的大量文字）……如果\
  \ SUE 给 PEGGY 些蜂蜜，如果 SUE 给 BETTY 些蜂蜜，如果 SUE 给 PEGGY 些蜂蜜，如果 SUE 给 BETTY 些蜂蜜，如果 SUE\
  \ 给 PEGGY 些蜂蜜。”顺便提一下，答案是否定的。）\n\n### `TELL(X, A, Y)`\nX 想要向 Y 传递 `A`。\n\nA 是一个“事实”，而不是问题，所以\
  \ `TELL` 比 `DKNOW` 更简单。X 尝试直接告诉 Y（调用 `DPROX`）。如果失败了，X 尝试说服他的任何一个朋友传递信息。\n\n### `DPROX(X,\
  \ Y, Z)`\nX 想要 Y 在位置 `Z`。\n\n第一种技术是让 X 尝试将 Y 直接移动到 `Z`。（这要求 Y 是移动移动。）当 Joe Bear\
  \ 想要访问 Irving Bird 时，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n\
  ```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear,\
  \ Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe\
  \ Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\
  \n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用\
  \ `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问\
  \ Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\
  \nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear, Irving\
  \ Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear,\
  \ Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\n```\n\
  DPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\
  \n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用\
  \ `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问\
  \ Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n```\n\
  \n### `PERSUADE(X, Y, Z)`\nX 想要说服 Y 执行 `Z`。\n\n第一种技术是让 X 尝试将 Y 直接移动到 `Z`。（这要求 Y\
  \ 是可移动的。）当 Joe Bear 想要访问 Irving Bird 时，我们调用 `DPROX`：\n\n```\nDPROX(Joe Bear, Joe\
  \ Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\n```\nDPROX(Joe\
  \ Bear, Joe Bear, Irving Bird)\n```\n\nJoe Bear 想要访问 Irving Bird，我们调用 `DPROX`：\n\
  \n```\nDPROX(Joe Bear, Joe Bear, Irving Bird)\n``` （注：原文中包含了冗余重复。）\n\n### `S-HUNGER(X)`\n\
  X 饿了。\n\n这里的计划非常简单：X 应该获取食物（`DCONT`）并吃它（`DO-INGEST`）。如果 X 已经知道食物在哪里，他会先尝试。否则，我们随机挑选一种他食的食物种类作为想要的食物。\n\
  \n### `S-THIRST(X)`\nX 渴了。\n\n这里的计划是让 X 靠近水（`DPROX`）并喝掉。\n\n### `S-SEX(X)`\nX 想要性生活。\n\
  \nX 尝试说服一个朋友“混在一起”（生成器的用语）。\n\n### `S-REST(X)`\nX 累了。\n\nX 只需执行 `DPROX` 到他的床（或家）然后睡觉。\n\
  \n\n\n\n\n虽然一眼看去可能并不明显，但 TALE-SPIN 具备推理能力是很有必要的。它需要这样做来正确评估其所生成事件的影响。TALE-SPIN 对每个\
  \ CD 原语（primitives）都使用四种类型的推理。\n\n- 类型-1 推理在严格的因果意义上指定了之前的状态或动作。这些是角色本身在规划时会使用的“反向推理”。从“乔把浆果给了杰克”（`ATRANS`）中产生的类型-1\
  \ 推理是：乔有浆果（`CONT`）以及浆果在乔附近（`LOC`）。\n- 类型-2 推理是结果，它们构所有推理的大部分。仿真本质上是由类型-2 推理驱动的。这些推理中最大的子类指定了谁感知到了结果（`MLOC`），这些被称为\
  \ `reaction`（反应）。例如，当角色受到威胁、赞扬或侮辱时，他们的反应动机就源于反应推理。\n- 类型-3 推理仅适用于状态，它们根据计划框（planboxes）指定了以这些状态为前置条件的动作。\n\
  - 类型-4 推理仅适用于动作，它们指定了可能可能后续的其他动作。\n\n这些推理过程取决于内存的当前状态。例如，乔·贝尔对看到蜂蜜的反应取决于他当时有多饿。除了这一点，推理的范围是相同的。然而，还有一类单独的\
  \ `demon-inferences`（恶魔推理），它们不是恒定的。虽然结果是即时的，但恶魔推理被用于表示未来某个时刻可能变为真实的事。例如，如果欧尔文（诚实地）承诺在乔带回虫子后告诉乔蜂蜜在哪里，那么欧尔文在收到虫子后的一条“恶魔推理”就是遵守诺言并告诉乔蜂蜜在哪里，这显然不是得到虫子的正常结果之一。\n\
  \n## 关系\n\n当一个计划包含一个关于角色间关系（“乔多么喜欢玛吉？”）或单个角色性格（“欧尔文有多善良？”）的前置条件时，程序会检查内存。如果没有找到答案，程序会询问用户。程序这样做是假设存在答案的，只是尚未建立。这种处理方式与其他前置条件（“乔知道哪里有蜂蜜吗？”）大不同，在后者情况下，在内存中未找到答案等同于回答“否”。\n\
  \n问题在 CD 中表示并简单地传递给英语生成器。程序将接受若干预定义的响应，这些响应最终对应一个整数。例如，当程序询问“乔认为玛吉多么喜欢亨利？”时，响应 `VERY`、`LOTS`\
  \ 或 `A LOT` 将产生一个 `7` 的“喜好”值。响应 `A LITTLE` 或 `SOMEWHAT` 将产生值 `3`。响应 `NOT VERY MUCH`、`NOT\
  \ VERY` 或 `NOT MUCH` 将产生 `0`。响应 `NONE` 或 `NOT AT ALL` 将产生 `-3`。\n\n扩展可能的响应、使用不同的整数输入或更改前置条件本身的数字都是易手的事。上述数字仅仅是粗略的指南。\n\
  \n## 内存\n\nTALE-SPIN 中的“内存”一词指的是事实的时间顺序，这些事实根据相信它们的人进行分组。“真实”事实仅仅是仿真器相信的事实，这些包含了物理世界的细节等内容。角色有自己的信念。关于关系没有“真实”的信念：在\
  \ TALE-SPIN 中，陈“约翰喜欢亨利”意味着“约翰相信他喜欢亨利”。在 TALE-SPIN 中，说“约翰喜欢亨利是真实的”且“约翰认为他不喜欢亨利”是毫无意义的。\n\
  \n当事实被“断言”（asserted）时，它们被添加到内存中。当发生时，会检查内存的一致性。冲突和被取代的事实会被移除。内存存储在 `!TRUEFACTS`\
  \ 中，冲突事实保存在 `!OLDFACTS` 中，被取代事实直接被删除。\n\n冲突是互斥的状态。如果乔·贝尔在他的洞穴里，该事实将位于 `!TRUEFACTS`\
  \ 中。如果他去访问欧尔文·伯德，他的新位置是欧尔文居住的树。因此，“乔在枫树上”与“乔在洞穴”冲突。冲突的语句会被保存，例如，如果乔以后去洞穴，生成器将能够说“乔*回到*了他的洞穴”而不是“乔去了洞穴”。\n\
  \n被取代事实是指那些描述得更清楚的事实。如果乔正在和欧尔文说话，陈述“乔在枫树上”的 CD 表示作为欧尔文的信念之一存储在 `!TRUEFACTS` 中。如果乔离开了，陈述“乔不在枫树上”被添加到欧尔文的信念中，由于前一个语句现在发生了冲突，它被移动到\
  \ `!OLDFACTS`。但假设欧尔文后来通过第三方发现乔在河边。陈述“乔在河边”取代了但没有冲突“乔不在枫树上”，因此该信念仅被简单地删除。\n\n## 创建者与旅行代理\n\
  \n当引入角色时，一个名为“创建者”（creator）的程序为该角色构建一个物理环境。环境中的特定物品由对模拟世界的抽象描述指定，这些被称为 `blueprints`（蓝图）。这些的创建版本被称为\
  \ `maps`（地图）；它们用于表示 TALE-SPIN 中所有的物理位置。\n\n穿越这个世界的路线由一个名为“旅行代理”（travel agent）的程序计算。地图都是层级结构的一部分。核心思想是单个地图具有固定的尺寸和分辨率，你向上移动移动以寻找覆盖范围更大但细节较少的地图，向下移动则反之。当旅行代理被要求寻找从点\
  \ A 到点 B 的路线时，它会“缩小”（向上移动移动），直到找到一张在某个深度同时包含 A 和 B 的地图。它计算从 A 的“终端”（terminal，该高级地图包含\
  \ A 的点）到 B 的“终端”的路线。然后它进入 A 终端下方的地图并使用相同的程序计算 A 到该终端的路线，对 B 也是。结果是一系列底层行程段。\n\n\
  如果不存在这样的路线，旅行代理会调用创建者根据蓝图构建必要的组件。当存在多个解决方案时，创建者会询问用户问题，例如“你需要一座山吗？”\n\n## 符号算术\n\
  \nTALE-SPIN 必须能够处理数量之间的关系。例如，问题求解器需要知道 A 是发生在 B 之前还是之后，生成器在选择时态也是如此。某些计划询问诸如“乔·贝尔比杰克·贝尔高吗？”名为\
  \ `XARITH` 的程序使用有向图表示这些关系（在数学中被视为“偏序”）。它处理断言和查询，并检测冲突（A 在 B 之前，B 在 A 之前）和冗余信息（A\
  \ 在 B 之前，B 在 C 之前，A 在 C 之前）。当已知数值信息时，它使用全序。它可以推断出图中两个点实际上是一个。在 TALE-SPIN 中，它主要用于遵循传递链，以便在没有看到该显式断言的情况下回答\
  \ A 是否在 B 之前。它尚未被用于表示事件的持续时间（“开始”和“结束”时间之间的差），也没有二阶信息（持续时间之间的差异，例如“从新奥尔良飞往新纽约的时间比从\
  \ JFK 机场坐公交去曼哈顿的时间短”）。\n\n\n\n\n\n### 英语生成器\n\n该生成器作用于单个 CD 表达式。它首先确定该表达式表示的是动作、状态、状态变化还是因果关系。它根据涉及的特定\
  \ CD 表达式选择使用哪个动词（例如，对于 `MTRANS`，它使用 `ask`、`offer`、`deny`、`refuse`、`agree` 和 `tell`），并取决于记忆（例如，对于\
  \ `ATRANS`，使用 `give` 与 `give back`）。嵌入句子可以包含不定式（“Joe wanted Irving to tell him…”），并且可以省略不定式的主语（“Joe\
  \ wanted to ask Irving…”）。\n\n主语和动词由单个函数处理，这基于一个事实：在英语中，否定、语气、时态等影响可以局限于主谓对。例如，在句子“Joe\
  \ sees Irving”中，直接宾语（“Irving”）紧随主谓对之后，不仅在这种形式下如此，在以下形式中也是如此：`Joe saw`、`Joe will\
  \ see`、`Did Joe see`、`Will Joe see`、`Can Joe see`、`Was Joe able to see`、`Joe doesn’t\
  \ see`、`Wouldn’t Joe be able to see`、`Joe might be able to see` 等。\n\n社会状态根据关系的亲疏使用多种短语（例如，对于\
  \ `AFFECTION`：`hate`、`dislike`、`like`、`love`、`be devoted to`）。最后有一个后处理器，使用角色的名字、冠词（a,\
  \ an, the, any, some）和标点符号（句号或问号）。\n\n### 错误的故事\n\n了解为什么上述组件对故事生成器是必要的最好方法，就是观察我们是如何发现它们是必要的。在规划阶段，计算机程序实际上如何运行并不总是显而易见的。程序的重要部分往往会被遗漏，因为无法知道它们将来会被需要。\n\
  \n`TALE-SPIN` 在早期阶段经常讲述非常奇怪的故事。这些“错误”导致了原始程序中的许多重新定义。由于这种“错误”后跟随新理论的过程是泛指人工智能程序的特征，因此我们值得观察这些“错误”，并考虑为了修复它们必须做什么。\n\
  \n```\n****** 1 ******\n```\n\n> 有一天，Joe Bear 饿了。他问他的朋友 Irving Bird 哪里有蜂蜜。Irving\
  \ 告诉他在橡树树上有一个蜂巢。Joe 威胁说，如果 Irving 不告诉他哪里有蜂蜜，就打他。\n\nJoe 还没有理解 Irving 实际上已经回答了他的问题，尽管是间接的。教训：问题的答案可以有多种形式。你必须了解蜂巢的存在，才能理解那个答案是可以接受的。\n\
  \n```\n*** 2 ***\n```\n\n> 有一天，Joe Bear 饿了。他问他的朋友 Irving Bird 哪里有蜂蜜。Irving 告诉他在橡树树上有一个蜂巢。Joe\
  \ 走到橡树树。他吃掉了蜂巢。\n\n> 仅仅增加可答案的范围是不够的。你必须知道这些答案的真正含义。\n\n```\n*** 3 ***\n```\n\n在\
  \ `TALE-SPIN` 的早期，所有的动作都集中在一个单一角色身上。其他角色只能以非常有限的方式做出反应，例如回答直接问题。当时还没有“一个角色‘注意到’另一个角色所做的事情”的概念。因此有了下面这个故事，它是试图产生伊索寓言之一的《蚂蚁与鸽子》：\n\
  \n> Henry Ant 渴了。他走到岸边，他的好朋友 Bill Bird 坐在那里。Henry 滑倒并掉进了河里。他无法呼救。他溺水了。\n\n这本不该发生。掉进河里是故意引入的，为了导致故事的核心“问题”。如果\
  \ Henry 能够向 Bill 呼救，Bill 会救他的，但我刚刚添加了规则，即身处水水中会阻止说话，这看起来是合理的。由于 Bill 没有被问及直接问题，他没有注意到他的朋友在河里溺水。“注意到”现在是从位置变化中推理出来的，所以\
  \ Bill 看到 Henry 在河里，推断出 Henry 处于危险中，并救了他。\n\n```\n*** 4 ***\n```\n\n这里是 `TALE-SPIN`\
  \ 在发生下一次恐怖事件时的某些规则。如果 `A` 将 `B` 移动到位置 `C`，我们不仅可以推断 `B` 在位置 `C`，还可以推断 `A` 也在那里。如果你在河里，你想出来，因为否则你会溺水。如果你有腿，你可能游出来。如果你有翅膀，你可能飞走。如果有朋友，你可以寻求帮助。这些听起来很合理。然而，当我把“X\
  \ 倒”呈现为“重力移动了 X”时，我得到了这个故事：\n\n> Henry Ant 渴了。他走到岸边，他的好朋友 Bill Bird 坐在那里。Henry 滑倒并掉进了河里。重力溺水了。\n\
  \n可怜的重力既没有腿，也没有翅膀，也没有朋友。现在“X 倒”用 `PROPEL` 而不是 `PTRANS` 表示，即“重力施于 X 的力”，而来自 `PROPEL`\
  \ 的推理与 `PTRANS` 的推理是不一样的。\n\n```\n*** 5 ***\n```\n\n引入“意识”意味着我不能像以前那样设定这些故事了。\n\n\
  > 从前，有一只不诚实的狐狸和一只虚荣的乌鸦。一天，乌鸦坐在它的树上，嘴里叼着一块奶酪。它注意到自己正拿着那块奶酪。它变得饿了，然后吞下了奶酪。狐狸走到乌鸦那里。结束。\n\
  \n> 这本该是《狐狸与乌鸦》。狐狸本想骗乌鸦交出奶酪，但当它到达时，并没有奶酪了。我通过添加断言“乌鸦已经吃过了”修复了这个问题，这样当它注意到奶酪时，它就不会饿了。\n\
  \n```\n*** 6 ***\n```\n\n在程序对目标产生大量关注之前，我得到了这个故事：\n\n> Joe Bear 饿了。他问 Irving Bird\
  \ 哪里有蜂蜜。Irving 拒绝告诉他，所以 Joe 提议如果 Irving 告诉他蜂蜜在哪里，他就带给他一条虫子。Irving 同意了。但 Joe 不知道虫子在哪里，所以他问\
  \ Irving，而 Irving 拒绝了说。所以 Joe 提议如果 Irving 告诉他哪里有……他就带给他一条虫子。\n\n教训：如果一个角色已经有了某个目标，就不要再给它一个同样的目标。尝试别的。如果没有别的了，那么那个目标就无法实现。\n\
  \n```\n*** 7 ***\n```\n\n这里还有更多规则。如果你饿了并看到某些食物，你想吃它。如果你试图得到某些食物但失败了，你会生病。如果你想要某个物体，尝试与该物体的主者进行讨价。没大碍吧？\n\
  \n> 有一天，Henry Crow 坐在它的树上，嘴里叼着一块奶酪，这时 Bill Fox 来了。Bill 看到了奶酪并饿了。[Bill 刚刚被赋予了满足饥饿的目标]。他说：“Henry，我很喜欢你的歌声。你能为我唱首歌吗？”Henry\
  \ 被这番赞美迷住了，开始唱歌。奶酪掉到了地上。Bill Fox 看到地上的奶酪非常饿。[满足饥饿再次被添加到 Bill 的目标列表中]。他病了。[因为满足饥饿已经是\
  \ Bill 的目标，所以不能再次添加。因此，Bill 未能满足饥饿，所以他生了。]Henry Crow 看到地上的奶酪，他变得饿了，但他知道奶酪是他的。他对自己很诚实，所以决定不骗自己交出奶酪。他并没有试图欺骗自己，也没有和自己竞争，但他记得自己也处于自己的主导地位，所以他拒绝给自己奶酪。他想不出一个充分的理由说明为什么要给自己奶酪[如果这样做，他就会失去奶酪]，所以他提议如果他给自己奶酪，他就带给自己一条虫子。这听起来还可以，但他不知道哪里有虫子。所以他对自己说：“Henry，你\
  \ true 哪里有虫子吗？”但当然，他不知道，所以他…… [以此类推]\n\n\n\n\n程序最终因为其他原因运行崩溃了。我很惊讶它竟然能运行到那一步。我通过添加一条规则：丢掉奶酪会导致所有权丢失修复了它。\n\
  \n### Tale-Spin 的技术视角\n\n### Tale-Spin 的顶层\n\n在这一部分，我想更详细地解释 `TALE-SPIN` 是如何运行的——它的基本执行周期是什么。\n\
  \n首先会与用户进行初始对话，指定角色和一些设定细节，但在用户指定主角面临一个问题之前，循环并不会真正开始。一旦这一事实被断言（asserted），顶层循环就会自动接管。\n\
  \n事实上，甚至在初始对话期间也可以启动循环。如果你创建了一只熊和一些浆果，并告诉熊浆果在哪里，`TALE-SPIN` 会询问这只熊有多不饿。这是因为循环的推理部分想要知道熊现在是否要使用这些关于浆果的信息——这是一个自动触发器。\n\
  \n当一个事件被**断言**（asserted）时，我们会执行两件事中的之一。如果它是表示“约翰认为自己拥有 X 目标”的 `CD` 表达式，我们就把“约翰拥有\
  \ X 目标”保存到列表（`PLAN-LIST`）中。否则，我们简单地将该事件添加到内存。如果它是“约翰认为 Y”的形式，那么它将与约翰“已知”的内容存储在一起；否则，它被存储为一个“真”事实（由叙述者所知）。请注意，“约翰认为玛莉拥有\
  \ Z 目标”并**不会**进入 `PLAN-LIST`，但它会被存储在内存中。\n\n接下来，我们计算被断言事件的所有结果，这些结果也将一个 `CD` 表达式列表。如果有任何结果，我们就会对这些结果重复整个过程，将它们添加到\
  \ `PLAN-LIST` 或内存中。最后，当没有更多结果时，我们将列表中的每个计划都发送给问题求解器。也就是说，该列表中的每一项都是关于某个角色拥有某个目标的陈述，因此我们现在为该目标调用相应的问题求解器。如果目标是减轻饥饿，我们调用\
  \ `S-HUNGER`。如果目标是获取某个物体，我们调用 `DCONT`。如果目标不是一种状态而是一个直接的**动作**，如对某些信息进行 `MTRANSing`，那么我们就调用一个模拟实际事件的程序（`DO-IT`）。\n\
  \n### Do-It\n\n对于大多数动作，`DO-IT` 只是简单断言该事件，但对于其他动作，有**运行时前提条件**需要处理。这些**不是**规划过程的一部分，而是处理细节的，包括代表角色*想象*会发生什么与实际*发生*什么之间差异的障碍。\n\
  \n`DO-MTRANS` 和 `DO-PTRANS` 的账目细节部分还包括调用创建者和旅行代理。如果欧尔文·伯德（Irving Bird）决定告诉乔·熊（Joe\
  \ Bear）蜂蜜在哪里，而我们还没有创建过他已知的蜂蜜，我们现在就创建。如果欧尔文是诚实的话，那么这与初始对话中的“真实”创建完全一样。但如果欧尔文在撒谎，我们就得更花脑筋。**某些**材料会被创建，但其他材料只会被以假设性的方式创建。例如，欧尔文可能会告诉乔在某棵橡树里有一些蜂蜜。如果他在撒谎，那么那里会有一棵橡树，但里面不会有蜂窝；如果乔去那里，他就会发现真相并意识到自己被骗了。\n\
  \n`DO-PTRANS` 也有一些账目需要处理。当乔·熊去访问住在枫树巢里的欧尔文·伯德时，我们希望确保乔不会掉进巢里，而是留在枫树附近的地面上。\n\n###\
  \ 结果\n\n循环最重要的部分是结果的生成。某些结果是常数的或与上下文无关的，但许多结果取决于内存状态、人们所知的特定事实，以及他们对自己和他人的态度。\n\n\
  数据驱动的结果循环有两个主要优势。首先，你放入推理中的信息越多，就有越多的事情“自动地”发生，这样你就可以让规划过程设计得不那么显式化。这在方法论上也是很有意义，因为所有的规划程序都有同等访问推理机制的机会，你更有可能发现概念性错误。也就是说，你可能为情况\
  \ `Y` 添加了推理 `X`，但系统可能会让你惊喜（无论好坏），在情况 `Z` 中产生推理 `X`。\n\n第二个优势是，当角色**自己**在规划时，他们使用的是与模拟器相同的推理机制。也就是说，当乔·熊试图决定是否做某事（例如遵循请求）时，他会从自己的角度考虑由推理机制计算的结果。这些结果可能与实际发生的情况不同，因为他的知识（特别是关于人际关系的知识）不必与事实一致。例如，他可能推测玛莉·比（Maggie\
  \ Bee）非常友好并乐意分给他一些蜂蜜，因此在他的**假设模拟**中，他实现了目标，从而表明那个特定计划是一个好计划。当他实际上面对玛莉·比时，在**真实模拟**中，她可能极度地讨厌他并拒绝给他任何东西。从这个观点来看，假设模拟是规划过程的一个主要组成部分。\n\
  \n结果循环的缺点是事实可能会泛增（尤其是无关的事实），以及角色倾向于花费所有时间互相猜忌，永无止境。第一个问题是人工智能系统中常见的瘟疫。如果你某次需要特定的推理，那么你总是会得到它，无论是否需要。另一种方法是提前“启用”该推理，之后“禁用”它，这是公然的作弊。另一种流行的方法是以某种方式对信息进行结构，使得上下文决定应该进行哪些推理。遗憾的是，`TALE-SPIN`\
  \ 的上下文还没有那么结构化。第三种策略是使用智能垃圾回收器（也称为遗忘机制），来解决一个本质上是“系统”问题而非理论问题的问题（至少在模拟层面是如此）。\n\n\
  猜忌症实际上是推理爆炸的一个特例。通过模拟进行规划的理论弱点在于，你需要控制细节的程度。当你实际上在做某事时，一切都会发生。当你仅仅在考虑做某事时，你无法想象所有的细节。幸运的是，`TALE-SPIN`\
  \ 没有在这里陷入，因为角色拥有的信息是不完整且不完美的，所以推理会消失。此外，如上所述，推理循环**并不**追求“约翰认为玛莉拥有 X 目标”的结果。如果它这样做，并继续计算出“约翰认为玛莉拥有\
  \ Y 目标”（其中 Y 是 X 的子目标之一），我们很快就会陷入“约翰认为玛莉认为比尔认为约翰认为……”的游戏，以及所有相关的理论和实践问题中。\n\n###\
  \ 示例\n\n\n\n\n\n在之前提到的乔治·安特（George Ant）掉入河被威尔尔玛·伯德（Wilma Bird）救出的故事中，整个救援场景都是对推理机制的一次调用。它于我们断言乔治掉进了水。从这可以推导出乔治在水里。从这又可以推导出两个推理：乔治知道自己自己在水里，而且威尔尔玛也知道。她坐在附近，位置的改变为每个附近的角色产生了这样的推理。从知道某人在水里这一推理中，得出此人可能会死亡（鱼类等情况可以除外）。从知道某事件可能导致死亡这一推理中，可以产生一个避免或消除该事件的目标（乔治和威尔尔玛都推出了这些点）。而从拥有目标推导出的“推理”就是针对该目标采取行动，即调用问题求解器。在这种情况下，调用了\
  \ `D-NEG-PROX`：乔治想离开河流。`D-NEG-PROX` 调用附近区域的 `DPROX`，现在变成了“乔治想靠近草地”，这是作者对其中一个河岸的命名。乔治知道河岸在哪里（`DPROX`\
  \ 中的先决条件），但当调用 `DO-PTRANS` 时，一个运行时障碍阻止了他的离开：极其微小的生物无法通过河流 `PTRANS`。因此，乔治的 `DPROX`\
  \ 目标失败了，他的 `D-NEG-PROX` 也失败了。幸运的是，威尔玛玛相同的目标，因此再次调用了 `D-NEG-PROX`。这次是威尔尔玛想让乔治离开河流。`D-NEG-PROX`\
  \ 调用 `DPROX`，让乔治到达岸边。威尔尔玛知道乔治在哪里，由于她在飞行，`DO-PTRANS` 成功了。`DPROX` 继续执行，让她抓起乔治，把他带到岸边并放手。从放开某物（`unGRASP`）的推理是他们会落在下方的任何地方（这里再次使用了创建/旅行代理的概念），所以乔治掉到了草地上。当然，乔治意识到了发生在他身上的一切（更多的知识状态推理），当他知道自己处于危险时，建立了一个精灵推理，以便如果他被救援，他与救援者之间的关系就会发生变化（`affection\
  \ + 10`，`indebtedness + 10`）；因此，“乔治忠于威尔尔玛。乔治欠威尔尔玛一切。”这一切都发生在对断言机制的一次调用中，当我们说乔治掉进了水里时。\n\
  \n## 数据结构与控制结构\n\n`DKNOW`、`DPROX` 等被直接编码为过程。这种方法的优点是它更容易处理从一个计划框（planbox）到下一个框的控制流，并跟踪变量的绑定。另一种典型方法（由\
  \ `MICRO-PLANNER` 及其类似程序推流行）是将此类过程定义为“数据”，并为它们编写一个独立的解释器，其优势在于人现在可以“读取”计划，而不仅仅是执行它。我出于几个原因选择不使用这种方法。首先，它暗示读取计划等同于执行计划——即你拥有相同的信息，而事实并非如此。其次，角色们确实需要的规划信息更简单，可以用其他方式编码。第三，解释器需要大量的用于变量绑定和模式匹配的簿记录代码，对于一个天生就倾向于执行的模拟器来说，这似乎不值得费力。最后，许多相同的效果可以通过之前讨论的“假设性模拟”来实现。也就是说，读取计划的目的是预测未来将需要什么、可能发生什么等。通过让角色直接调用规划过程，使用“假设性”内存（最初与当前内存相同）并“观察”发生了什么，可以实现相同的效果。虽然在假设执行与实际执行计划的细节程度上仍存在严重问题，但模拟的想法在心理学层面上具有某些吸引力。\n\
  \n## 内存\n\n在 `TALE-SPIN` 的原始实现中，内存（包含每个角色知道的内容以及故事者知道的内容）是一个 `CD` 表达式列表，由“知道”所表示事件的人索引，并在角色填充者（role-fillers）下进行子索引，进一步在角色名称（role-names）下进行子索引。试图模拟一种记忆理论，即约翰（John）关于玛丽（Mary）的所有特定信息都将分在一起，而不是简单地将约翰关于任何事的所有信息分在一起。然而在实践中，`TALE-SPIN`\
  \ 从未使用过该功能，即系统中的没有任何东西取决于内存中事件的特定分组。在当前的实现中，子索引已被简单删除，虽然模式匹配器现在寻找诸如“约翰认为玛丽在哪里？”这类问题的答案时需要多做一点工作，但结构本身开销的大幅减少远比补偿了这一点。\n\
  \n## 推理机制\n\n每个 `CD` 动作和状态都有一组相应的推理函数（类型 1–4）。推理生成器使用顶层动作（例如 `PTRANS`）、状态（例如 `MLOC`）或连接词（例如\
  \ `CANCAUSE`），并调用相应的过程。\n\n每个过程都构建一个 `CD` 表达式列表，这些表达式即为推理。例如，从 `ATRANS` 事件产生的后果（类型-2\
  \ 推理）规定如下：\n\n```\nTO 填充符现在拥有 OBJECT 填充符。\nFROM 填充符不再拥有 (he OBJECT 填充符。\nTO 填充符知道\
  \ ATRANS 发生了。\n与 ACTOR 填充符在同一位置的所有其他人都知道 ATRANS 发生了。\n```\n\n假设事件是“约翰给了玛丽一本书”。它表示为\n\
  \n```\n((ACTOR JOHN) < > ATRANS FROM TO MARY))\n```\n\n那么 `ATRANS` 类型-2 推理返回推理列表：约翰不再拥有那本书，玛丽拥有了书，约翰知道\
  \ ATRANS 发生了，玛丽知道 ATRANS 发生了。如果这个事件是真实发生的（而不是某人的规划部分），那么每个推理都会被断言，每个推理的后果会被计算并断言，依此类推。“反应推理”由计算\
  \ `MLOC` 后果的过程调用，方式与推理生成器相同。\n\n## 生成器\n\n与推理机制一样，英语生成器接收 `CD` 表达式并调用与主动作、状态或连接词相关的过程。生成器的主要功能是产生正确的单词顺序和动词形式。对于五十个动词，它知道过去式、现在式和将来时的单数和复数变化。这些是预先计算好的。它在运行时构建否定、疑问等，这只需要少量关于“do”和“will”等助动词的信息。\n\
  \n`TN` 函数产生谓语。`TN` 取两个参数：动词原型和主语。使用主语的唯一原因是它可能被嵌入，例如“约翰去……了吗？”其他信息是时态和“模式列表”（mode-list）。模式列表是\
  \ CD 表达式的一部分，即它是意义的必要组成部分。顶层句子的时态是任意的。叙述通常用一般过去时讲述。但在给定顶层句子时态的情况下，嵌入表达式的时态是通过调用时间计时器计算的，例如，“约翰认为玛丽在纽约”对比“约翰认为玛丽将在纽约”。模式列表的可能元素包括：`NEG`（如果概念是否定）；`MAYBE`（例如当一个角色只能猜测另一个角色的可能反应时添加，如“乔认为艾文可能会告诉他蜂蜜在哪里”）；`CAN`\
  \ 表示能力；以及 `?` 表示疑问。\n\n\n\n\n\n例如，假设主语是 `MARY`，不定式（由 `PTRANS` 生成器过程确定）是 `WALK`，模式列表为\
  \ (`NEG` `?*` `CAN`)，且时态为将来时。该过程首先测试模式列表中是否存在 `CAN`。在这些此和将来态的情况下，不定式后面会被拼接上“BE ABLE\
  \ TO”，我们知道需要一个助动词，在这种情况下，是 `DO`。我们使用的动词要么是该助动词（如果我们已经决定需要一个），要么是不定式，因此在这种情况下，它是\
  \ `DO`，我们查找它的将来时形式。对于 `DO` 来说，它被存储为 `WILL`。接着，由于模式列表中存在 `NEG`，我们再查找该形式的否定形式；它被存储为\
  \ `WONT`。接下来，我们写出“动词”，然后是主语（因为存在 `?*`），最后，如果我们使用了助动词，我们就会打出不定式，从而产生 `WONT MARY BE\
  \ ABLE TO WALK`。当句子完成后，另一个函数会加上问号。\n\n假设主语是 `MARY`，不定式是 `WALK`，但模式列表为 (`MAYBE`)，且时态为现在时。如果\
  \ `MAYBE` 在模式列表中，我们使用助动词 `MIGHT` 作为“动词”，其现在时形式是 `MIGHT`。我们写下主语，然后是动词，最后是不定式，产生 `MARY\
  \ MIGHT WALK`。\n\n这个过程并没有特别的神圣之处。我仅仅通过处理一段时间的变位来确定测试的顺序，这种模式随之出现。它对于 `TALE-SPIN`\
  \ 能产生的所有构造体来说已经足够了。它不会产生诸如“是 John 去了纽约”这样的例子，因为在 `CD` 表示中没有可以指示那种强调的内容。\n\n名词要简单得多。创建者在它创建的每个角色的系统名称属性列表中，放入了英文名和名，例如，Joe\
  \ Bear 的系统名称是 `JOEBEAR`。他的英文名是列表 `(JOE BEAR)`，他的名被存储为 `JOE`。对于物理对象，创建者仅在属性列表列列了英文名。生成器在输出句子的单词顺序确定后会使用这些信息。它遍历单词列表，插入冠词（a,\
  \ an, the, any, some）和标点符号。生成器已经包含了所有格。也就是说，如果它正在生成 `NEST`3，它会检查是否有人拥有该对象。如果是，它会插入“IRVING’S”，例如。在说明某个对象的位置时，它将使用“THERE”加上动词\
  \ `to be` 的相应形式。\n\n生成器调用内存来在“go”和“return”、“take”和“take back”、“isn’t hungry”和“isn’t\
  \ hungry any more”之间决定。\n\n### 回顾实现\n\n`TALE-SPIN` 组件的多样性既是它的骄傲，也是它的诅咒。也就是说，在同一个系统中看到动态创建的山脉、正确的英语时态和模态、偷窃和谎言、自动推理、竞争和负债、模式匹配器、计划和目标、有向图等等，是一件很棒的事，但追踪这一切并不容易。对其进行任何重大修改都是一项极具风险的事务，因为系统是高度互连的。要询问用户\
  \ John 是否喜欢 Mary，我们需要生成器。要能说“那棵枫树”，生成器需要来自创建者的信息。创建者需要知道鸟住在哪里。`DPROX` 需要知道 Irving\
  \ Bird、他的巢、包含那个巢的树以及树周围地面之间的区别。`BARGAIN` 需要访问反应推理。作为人类知识理论的一部分，这种集成是非常理想的。但作为一个\
  \ 90K 行 `LISP` 程序的特征，这种集成使编程任务复杂化。作为一个认知模型的特性，它面临着将知识分散得过薄的风险。\n\n# 10 微 TALE-SPIN\n\
  \nDOI: [10.4324/9780203728147-10](https://dx.doi.org/10.4324/9780203728147-10)\n\
  \n## 引言\n\n故事讲述者 (`TALE-SPIN`) 和英语生成器 (`MUMBLE`) 的微版本与完整系统具有相同的断言和推理基础循环，但细节被大大简化了。\n\
  \n大部分规划过程都被保留了，但它们使用了更简单的技术，通过 `AND` 和 `OR` 连接（“做这个并且那个，或者做那个和那个”）。特别是，角色不能通过假设模拟来提前计划。饥饿和情感等量表被简单的“是”或“否”取代，表示为\
  \ `MODE (POS)` 和 `MODE (NEG)`。\n\n推理机制的顶层是相同的，但这里只出现类型 2 的推理（结果），而且是它们的更简单版本。例如，在微系统中从未推理出社会状态，因此无论\
  \ Joe 殴打 Irving 多多少次，Irving 对 Joe 的感受始终坚如初。这里使用的唯一 `S-goals` 只有 `S-HUNGER` 和 `S-THIRST`。\n\
  \n大部分社会状态都被保留了，尽管对社会前提条件的限制被放宽了，使得“成功”故事的发生变得容易。创建者和旅行代理被完全废除了。初始世界描述由 `INIT-WORLD`\
  \ 函数显式声明，该函数由顶级函数 `(SPIN)` 调用。\n\n## 输出示例\n\n以下是 `SPIN` 的示例运行，展示了两个角色满足目标的成功和失败尝试。注意：计算机输出为大写；注释为小写。\n\
  \n``` [PH: Initiation. 28–Jan–80 4:02PM]\n…\n*(SPIN)\nONCE UPON A TIME\nJOE WAS\
  \ NEAR THE CAVE.\nJOE KNEW THAT JOE WAS NEAR THE CAVE.\nIRVING WAS NEAR THE OAK-TREE.\n\
  IRVING KNEW THAT IRVING WAS NEAR THE OAK-TREE.\nJOE KNEW THAT IRVING WAS NEAR THE\
  \ OAK-TREE.\nTHE WATER WAS NEAR THE RIVER.\nJOE KNEW THAT THE WATER WAS NEAR THE\
  \ RIVER.\nTHE HONEY WAS NEAR THE ELM-TREE.\nIRVING KNEW THAT THE HONEY WAS NEAR\
  \ THE ELM-TREE.\nTHE WORM WAS NEAR THE GROUND.\nJOE KNEW THAT THE WORM WAS NEAR\
  \ THE GROUND.\nIRVING KNEW THAT JOE WAS NEAR THE CAVE.\nTHE FISH WAS NEAR THE RIVER.\n\
  IRVING KNEW THAT THE FISH WAS NEAR THE RIVER.\n```\n\n`SPIN` 首先用英语打印预存储在数据库中的事实。在这个故事和后续所有的故事中，使用了相同的核心数据库。接下来\
  \ `SPIN` 询问故事关于谁，以及问题（S-goal）是什么。\n\n```\nCHOOSE A CHARACTER FROM THIS LIST (JOE\
  \ IRVING)\n*IRVING\nCHOOSE A PROBLEM FROM THIS LIST (HUNGRY THIRSTY)\n* THIRSTY\n\
  ONE DAY,\nIRVING WAS THIRSTY.\nIRVING WANTED NOT TO BE THIRSTY.\nIRVING WANTED TO\
  \ BE NEAR THE WATER.\nIRVING WANTED TO KNOW WHERE THE WATER WAS.\nIRVING THOUGHT\
  \ THAT JOE LIKED IRVING. [Y/N]? N\n```\n\n\n\n\n\nIrving 的目标是 `DPROX` 某个水源，这意味着他有一个子目标是\
  \ `DKNOWing` 水在哪里。他知道 Joe 在哪里，所以如果 Joe 是一个朋友，那么 Irving 就可以问他水在哪里。我们回答 Joe 不是一个朋友。\n\
  \n```\n IRVING THOUGHT THAT JOE DOMINATED IRVING. [Y/N]?N\n```\n\n如果 Joe 不是朋友，询问将不起作用，但如果\
  \ Irving 认为自己和 Joe 实力相当，那么他就可以强制 Joe 告诉他。`McSPIN` 询问 Irving 是否认为 Joe 能打赢他，我们回答不认为，所以\
  \ Joe 仍然是 Irving 会去找的人，但出于不同的原因。\n\n```\n IRVING WANTED JOE TO TELL IRVING WHERE\
  \ THE WATER WAS.\nIRVING THOUGHT THAT JOE DECEIVED IRVING. [Y/N]? Y\n```\n\n当 Joe\
  \ 回答时，Irving 会相信他吗？我们回答不会。\n\n```\n IRVING WANTED JOE TO THINK THAT IF JOE WOULD\
  \ NOT TELL IRVING WHERE\nTHE WATER WAS THEN IRVING WOULD STRIKE JOE.\nIRVING WANTED\
  \ TO BE NEAR JOE.\nIRVING WENT TO THE CAVE.\nIRVING WAS NEAR THE CAVE.\nIRVING TOLD\
  \ JOE THAT IF JOE WOULD NOT TELL IRVING WHERE THE WATER\nWAS THEN IRVING WOULD STRIKE\
  \ JOE.\nJOE THOUGHT THAT IRVING DECEIVED JOE. (Y/N)? N\n```\n\nIrving 刚刚威胁了 Joe。Joe\
  \ 是否相信他并不重要，但 `McSPIN` 想要一个答案，所以我们回答是。\n\n```\n IRVING STRUCK JOE.\nJOE WAS NOT\
  \ ALIVE.\nIRVING THOUGHT THAT JOE WOULD NOT TELL IRVING WHERE THE WATER WAS.\nIRVING\
  \ THOUGHT THAT IRVING DID NOT KNOW WHERE THE WATER WAS.\nIRVING THOUGHT THAT IRVING\
  \ WAS NOT NEAR THE WATER.\nIRVING KNEW THAT IRVING WAS THIRSTY.\nTHE END.\n```\n\
  \n在这个简单的世界里，击中某人是致命的。Irving 的计划失败了，因为死人无法为你提供任何信息。由于周围没有其他人，Irving 只能忍受口渴。\n\n通过带有变量\
  \ `STORY1` 的 `SPIN-DEMO`，可以在没有 `McSPIN` 问的情况下讲述同样的故事：\n\n```\n STORY1 =\n(IRVING\
  \ THIRSTY\n (IRVING ‘(LIKE (ACTOR JOE) (TO IRVING) (MODE (NEG))))\n (IRVING ‘(DOMINATE\
  \ (ACTOR JOE) (TO IRVING) (MODE (NEG))))\n (IRVING ‘(DECEIVE (ACTOR JOE) (TO IRVING)\
  \ (MODE (POS))))\n (IRVING ‘(LIKE (ACTOR IRVING) (TO JOE) (MODE (NEG))))\n (JOE\
  \ ‘(DECEIVE (ACTOR IRVING) (TO JOE) (MODE (NEG)))))\n```\n\n我们设置的另一个故事变量是 `STORY2`：\n\
  \n```\n STORY2 =\n(JOE HUNGRY\n (JOE ‘(LIKE (ACTOR IRVING) (TO JOE) (MODE (NEG))))\n\
  \ (JOE ‘(DOMINATE (ACTOR IRVING) (TO JOE) (MODE (POS)))))\n* (SPIN-DEMO STORY2)\n\
  ONCE UPON A TIME…\n JOE WAS NEAR THE CAVE.\n JOE KNEW THAT JOE WAS NEAR THE CAVE.\n\
  \ IRVING WAS NEAR THE OAK-TREE.\n IRVING KNEW THAT IRVING WAS NEAR THE OAK-TREE.\n\
  \ JOE KNEW THAT IRVING WAS NEAR THE OAK-TREE.\n THE WATER WAS NEAR THE RIVER.\n\
  \ JOE KNEW THAT THE WATER WAS NEAR THE RIVER.\n THE HONEY WAS NEAR THE ELM-TREE.\n\
  \ IRVING KNEW THAT THE HONEY WAS NEAR THE ELM-TREE.\n THE WORM WAS NEAR THE GROUND.\n\
  \ JOE KNEW THAT THE WORM WAS NEAR THE GROUND.\n IRVING KNEW THAT JOE WAS NEAR THE\
  \ CAVE.\n THE FISH WAS NEAR THE RIVER.\n IRVING KNEW THAT THE FISH WAS NEAR THE\
  \ RIVER.\n JOE THOUGHT THAT IRVING DID NOT LIKE JOE.\n JOE THOUGHT THAT IRVING DOMINATED\
  \ JOE.\n```\n\n这些事实与之前相同，除了最后两个来自 `STORY2`。`STORY2` 还说故事将关于 Joe 的饥饿。\n\n```\n ONE\
  \ DAY,\n JOE WAS HUNGRY.\n JOE WANTED NOT TO BE HUNGRY.\n JOE WANTED TO HAVE THE\
  \ HONEY.\n JOE WANTED TO KNOW WHERE THE HONEY WAS.\n JOE THOUGHT THAT JOE DID NOT\
  \ KNOW WHERE THE HONEY WAS.\n JOE THOUGHT THAT JOE DID NOT HAVE THE HONEY.\n JOE\
  \ WANTED TO HAVE THE BERRIES.\n JOE WANTED TO KNOW WHERE THE BERRIES WERE.\n JOE\
  \ THOUGHT THAT JOE DID NOT KNOW WHERE THE BERRIES WERE.\n JOE THOUGHT THAT JOE DID\
  \ NOT HAVE THE BERRIES.\n JOE WANTED TO HAVE THE FISH.\n JOE WANTED TO KNOW WHERE\
  \ THE FISH WAS.\n JOE THOUGHT THAT JOE DID NOT KNOW WHERE THE FISH WAS.\n JOE THOUGHT\
  \ THAT JOE DID NOT HAVE THE FISH.\n JOE KNEW THAT JOE WAS HUNGRY.\nTHE END.\n```\n\
  \n这里我们有一个计划完全失败的案例。Joe 吃了蜂蜜、浆果和鱼，但由于他不知道任何一样东西在哪里，他必须询问 Irving。但 Joe 认为 Irving 不喜欢他，而且比他强，所以\
  \ Joe 既不能询问也无法强制 Irving 告诉他食物在哪里。因此，Joe 只能挨饿。\n\n```\n STORY3 = (JOE THIRSTY)\n\
  ```\n\n`STORY3` 说故事将关于 Joe 的口渴。在这个例子和上一个例子中，我省略了初始数据输出。\n\n```\n * (SPIN-DEMO STORY3)\n\
  ONE DAY,\nJOE WAS THIRSTY.\nJOE WANTED NOT TO BE THIRSTY.\nJOE WANTED TO BE NEAR\
  \ WATER.\nJOE WENT TO THE RIVER.\nJOE WAS NEAR THE RIVER.\nJOE DRANK THE WATER.\n\
  JOE WAS NOT THIRSTY.\nTHE END.\n```\n\n这里我们有一个计划成功的简单案例，不需要另一个代理。Joe 渴了，他知道水在哪里，所以他去取。\n\
  \n```\n STORY4=\n(JOE HUNGRY\n (WORLD ‘HUNGRY (ACTOR IRVING) (TO JOE) (MODE (POS))))\n\
  \ (JOE ‘(LIKE (ACTOR IRVING) (TO JOE) (MODE (NEG))))\n (JOE ‘(DECEIVE (ACTOR IRVING)\
  \ (TO JOE) (MODE (NEG))))\n (IRVING ‘(LIKE (ACTOR JOE) (TO IRVING) (MODE (POS))))\n\
  \ (IRVING ‘(DOMINATE (ACTOR JOE) (TO IRVING) (MODE (POS)))))\n```\n\n`STORY4` 说故事关于\
  \ Joe 的饥饿（Irving 也是，但他不是角色）。此外，他们互相喜欢。Irving 认为自己比 Joe 强。\n\n```\n *(SPIN-DEMO STORY4)\n\
  ONE DAY,\nJOE WAS HUNGRY.\nJOE WANTED NOT TO BE HUNGRY.\nJOE WANTED TO HAVE THE\
  \ HONEY.\nJOE WANTED TO KNOW WHERE THE HONEY WAS.\nJOE WANTED IRVING TO THINK THAT\
  \ IRVING TOLD JOE WHERE THE HONEY WAS.\n```\n\nJoe 去询问 Irving。一个自然的副作用是 Irving 会知道自己已经回答了，但事实的英文生成形式看起来很奇怪。\n\
  \n```\n JOE WANTED TO BE NEAR IRVING.\nJOE WENT TO THE OAK-TREE.\nJOE WAS NEAR THE\
  \ OAK-TREE.\n JOE ASKED IRVING WHETHER IRVING WOULD TELL JOE WHERE THE HONEY WAS.\n\
  IRVING PLANNED TO TELL JOE THAT IRVING WOULD NOT TELL THE HONEY WAS.\nIRVING TOLD\
  \ JOE THAT IRVING WOULD NOT TELL THE HONEY WAS.\n```\n\nIrving 拒绝了请求，所以 Joe 尝试了。\n\
  \n```\n JOE DECIDED THAT IF JOE WOULD GIVE IRVING THE WORM THEN IRVING MIGHT TELL\
  \ JOE WHERE THE HONEY WAS.\nJOE WANTED IRVING TO THINK THAT IRVING WOULD TELL JOE\
  \ WHERE THE HONEY WAS IF JOE GAVE IRVING THE WORM.\nJOE WANTED TO BE NEAR IRVING.\n\
  ```\n\n注意，Joe 靠近 Irving 的目标已经满足了，所以什么都没做。\n\n```\n JOE ASKED IRVING WHETHER IRVING\
  \ WOULD TELL JOE WHERE THE HONEY WAS IF JOE GAVE IRVING THE WORM.\nIRVING DECIDED\
  \ THAT IF JOE WOULD GIVE IRVING THE WORM THEN IRVING WOULD TELL JOE WHERE THE HONEY\
  \ WAS.\nIRVING TOLD JOE THAT IF JOE WOULD GIVE IRVING THE WORM THEN IRVING WOULD\
  \ TELL JOE WHERE THE HONEY WAS.\n```\n\nIrving 同意了交易，所以 Joe 现在有了获取虫子目标。他知道如何做。\n\
  \n```\nJOE WANTED TO HAVE THE WORM.\nJOE WANTED TO BE NEAR THE WORM.\nJOE WENT TO\
  \ THE GROUND.\nJOE WAS NEAR THE GROUND.\nJOE TOOK THE WORM.\nJOE HAD THE WORM.\n\
  THE WORM WAS NEAR JOE.\nJOE WANTED TO BE NEAR IRVING.\nJOE WENT TO THE OAK-TREE.\n\
  JOE WAS NEAR THE OAK-TREE.\nJOE GAVE IRVING THE WORM.\nIRVING HAD THE WORM.\nTHE\
  \ WORM WAS NEAR IRVING.\nJOE DID NOT HAVE THE WORM.\nIRVING TOLD JOE THAT THE HONEY\
  \ WAS NEAR THE ELM TREE.\n```\n\nIrving 很诚实，履行了他在交易中的部分。他也了，所以吃了虫子。\n\n```\n IRVING\
  \ WANTED NOT TO BE HUNGRY.\nIRVING ATE THE WORM.\nIRVING WAS NOT HUNGRY.\nJOE WANTED\
  \ TO BE NEAR THE HONEY.\nJOE WENT TO THE ELM-TREE.\nJOE WAS NEAR THE ELM-TREE.\n\
  JOE TOOK THE HONEY.\nJOE HAD THE HONEY.\nTHE HONEY WAS NEAR JOE.\nJOE ATE THE HONEY.\n\
  JOE WAS NOT HUNGRY.\nTHE END.\n```\n\n一旦 Joe 拥有了必要的知识，他就可以完成蜂蜜计划的 `DCONT`，大家都就开心了。\n\
