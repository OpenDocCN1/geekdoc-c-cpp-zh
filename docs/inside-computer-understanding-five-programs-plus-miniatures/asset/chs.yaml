  CD form is\n (PTRANS (ACTOR (PERSON) (OBJECT (PERSON))\n(TO (HOUSE)))\n[PH: Termination.\
  \ 7-Jan-80 4:29PM.\nPS:<RIESBECK>FOURTE.LOG.1]\n```\n\n## 流程图\n\n图 14.1 中的流程图展示了\
  \ McEli 中的核心函数：`PARSE`。\n\n![](img/fig14_1_B.jpg)\n\n14.1 `PARSE(sentence)`。\n\n\
  ## 程序\n\n```\n <sup>-</sup> **************************************************************************\n\
  <sup>-</sup>            McELI: 英语语言解释器\n<sup>-</sup> **************************************************************************\n\
  <sup>-</sup> PROCESS-TEXT 接收一个句子列表并解析每个句子，\n<sup>-</sup> 打印答案。\n(DE PROCESS-TEXT\
  \ (TEXT)\n (FOR (SENTENCE IN TEXT)\n           (DO (MSG T “Input is “ SENTENCE T)\n\
              (LET (CD (PARSE SENTENCE))\n             (MSG T “CD form is “)\n            (SPRINT\
  \ CD 2]\n<sup>-</sup> PARSE 接收列表列表中 <target target-type=\"page\" id=\"page_363\"\
  >363</target> 格式的句子——例如 (JACK WENT TO THE\n<sup>-</sup> STORE)—并返回其概念分析。它将\n<sup>-</sup>\
  \ *SENTENCE* 设置为输入句子（例如 (JACK WENT TO THE))\n<sup>-</sup> 头部带有原子 *START*。*START*\
  \ 是字典中的一个用于启动分析的伪单词。\n<sup>-</sup> PARSE 每次处理 *SENTENCE* 中的一个单词，将 *WORD* 设置为当前单词，并将该单词包（如果有）加载到\n\
  <sup>-</sup> *STACK*。然后它调用 RUN-STACK 来查找并执行\n<sup>-</sup> 被触发的请求。分析过程中，变量 *CONCEPT*\
  \ 将设置为\n<sup>-</sup> 句子的概念（通常由动词包设置）。由于 McELI 构建的 CD 包含变量，\n<sup>-</sup> McELI 在句子结束时必须\
  \ `REMOVE-VARIABLES` 函数移除这些变量。\n<sup>-</sup> 为了方便调试，*CONCEPT* 和 *STACK* 是全局变量。PARSE\
  \ 返回填充了变量的 CD，\n<sup>-</sup> 而 *CONCEPT* 持有未填充的 CD。\n(DE PARSE (SENTENCE)\n(SETQ\
  \ *CONCEPT* NIL)\n(SETQ *STACK* NIL)\n(LOOP (INITIAL *WORD* NIL\n            *SENTENCE\
  \ (CONS *START* SENTENCE))\n           (WHILE (SETQ *WORD* (POP *SENTENCE)))\n           (DO\
  \ (MSG T “Processing “ *WORD*)\n           (LOAD-DEF)\n           (RUN-STACK))\n\
  <sup>-</sup>\n RUN-STACK: 只要栈顶部的某个请求可以被触发，整个包就会从栈中移除并执行并保存该请求。当栈顶不再包含任何可触发的请求时，已执行并保存的包（如果有）会被添加到栈中。\n\
  (DE RUN-STACK ()\n(LOOP (INITIAL REQUEST NIL TRIGGERED NIL)\n           (WHILE (SETQ\
  \ REQUEST (CHECK-TOP *STACK)))\n           (DO (POP *STACK*)\n           (DO-ASSIGNS\
  \ REQUEST)\n           (PUSH REQUEST TRIGGERED))\n           (RESULT (ADD-PACKETS\
  \ TRIGGERED]\n<sup>-</sup> CHECK-TOP 获取栈顶包中具有真测试的（如果有）的第一个请求。\n(DE CHECK-TOP (STACK)\n\
  (COND (STACK\n           (LOOP (INITIAL REQUEST PACKET (TOP-OF STACK))\n           (WHILE\
  \ (SETQ REQUEST (POP PACKET)))\n    (UNTIL (IS-TRIGGERED REQUEST))\n \n           (RESULT\
  \ REQUEST)\n<sup>-</sup> IS-TRIGGERED 如果请求没有测试或者测试求值为真，则返回真。\n(DE IS-TRIGGERED (REQUEST)\n\
  (LET (TEST (REQ-CLAUSE ‘TEST REQUEST))\n(OR (NULL TEST) (EVAL (CAR TEST)\n<sup>-</sup>\
  \ DO-ASSIGNS 设置 ASSIGN 子句中给变量。第一个 POP 获取变量，第二个 POP 获取其随后的值。\n(DE DO-ASSIGNS (REQUEST)\n\
  (LOOP (INITIAL ASSIGNMENTS (REQ-CLAUSE ‘ASSIGN REQUEST))\n           (WHILE ASSIGNMENTS)\n\
              (DO (REASSIGN (POP ASSIGNMENTS) (POP ASSIGNMENTS]\nREASSIGN 将 VAR 设置为\
  \ VAL 的值并打印一条显示已执行的消息。注意如果 VAL 为 NIL，则什么都不打印。\n(DE REASSIGN (VAR VAL)\n(COND ((SET\
  \ VAR (EVAL VAL))\n            (MSG T 4 VAR = “)\n<sup>-</sup> ADD-PACKETS 接收请求列表并将\
  \ NEXT-PACKET 添加到栈中。\n(DE ADD-PACKETS (REQUESTS)\n(FOR (REQUEST IN REQUESTS)\n           (DO\
  \ (ADD-STACK (REQ-CLAUSE ‘NEXT-PACKET)\n<sup>-</sup> REMOVE-VARIABLES 获取解析后的 CD\
  \ 并返回用变量替换后的模式副本。空填充符及其角色不会被留在最终 CD 中。\n<sup>-</sup> 注意 ELI 的 REMOVE-VARIABLES 类似于\
  \ McSAM 和 McPOL 中的 INSTANTIATE，不同在于使用 LISP 值而不是绑定列表来持有变量。\n(DE REMOVE-VARIABLES\
  \ (CD-FORM)\n(COND ((ATOM CD-FORM) CD-FORM)\n            ((IS-VAR-- CD)\n�\n            (REMOVE-VARIABLES\
  \ (EVAL (NAME:VAR CD-FORM))))\n            (T\n            (LET (VAL NIL)\n            ((\
  \ (HEADER:CD CD-))\n            (FOR (PAIR IN (ROLES:CD CD-FORM)))\n```\n\n\n\n\n\
  \n# 数据结构\n\nMcELI 使用栈进行控制。栈的顶端是列表的第一个元素。\n\n```lisp\n(DE TOP-OF (STACK) (CAR STACK))\n\
  ```\n\n`ADD-STACK` 将一个数据包放在等待数据包列表的前部。\n\n```lisp\n(DE ADD-STACK (PACKET)\n  (AND\
  \ PACKET (PUSH PACKET *STACK*))\n  PACKET)\n```\n\n单词定义 364 存储在属性 `DEFINITION` 下。`LOAD-DEF`\
  \ 将单词的请求数据包添加到栈中。\n\n```lisp\n(DE LOAD-DEF ()\n  (LET (PACKET (GET *WORD* ‘DEFINITION))\n\
  \    (COND (PACKET (ADD-STACK PACKET))\n          (T (MSG “not 365 in the dictionary)))))\n\
  ```\n\n`REQ-CLAUSE` 从格式 `((TEST...) (ASSIGN...) (NEXT-PACKET...))` 中获取子句。\n\n```lisp\n\
  (DE REQ-CLAUSE (KEY L)\n  (LET (X (ASSOC KEY L)) (AND X (CDR X)))\n```\n\n用于 McELI\
  \ 测试的示例 366 句子如下：\n\n```lisp\n(SETQ KITE-TEXT\n  ‘((JACK WENT TO THE STORE)\n  \
  \  (HE GOT A KITE)\n    (HE WENT HOME)))\n```\n\n# 字典\n\n`(DEF-WORD name request1\
  \ request2 ...)` 在单词下存储一个定义，定义由列表 `(request1 request2 ...)` 组成。\n\n```lisp\n(DF\
  \ DEF-WORD (L)\n  (PUTPROP (CAR L) (CDR L) ‘DEFINITION)\n  (CAR L))\n```\n\n`HE`\
  \ 是一个指人的名词性短语。\n\n```lisp\n(DEF-WORD HE\n  ((ASSIGN *PART-OF-SPEECH* ‘NOUN-PHRASE\n\
  \                   *CD-FORM* ‘(PERSON)))\n```\n\n`JACK` 是一个名为 Jack 的人的名词性短语。\n\n\
  ```lisp\n(DEF-WORD JACK\n  ((ASSIGN *CD-FORM* ‘(PERSON (NAME (JACK)))\n        \
  \       *PART-OF-SPEECH* ‘NOUN-PHRASE)))\n```\n\n`GOT` 是一个动词，意味着某人将某物转移给主语。`GOT`\
  \ 寻找一个名词性短语来填充宾语。\n\n```lisp\n(DEF-WORD GOT\n  ((ASSIGN *PART-OF-SPEECH* ‘VERB\n\
  \               *CD-FORM* ‘(ATRANS (ACTOR ?GET-VAR3) (OBJECT ?GET-VAR2)\n      \
  \                                      (TO ?GET-VAR1) (FROM ?GET-VAR3))\n      \
  \                        GET-VAR1 *SUBJECT*\n                              GET-VAR2\
  \ NIL\n                              GET-VAR3 NIL)\n   (NEXT-PACKET\n     ((TEST\
  \ (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE))\n      (ASSIGN GET-VAR2 *CD-FORM*))))\n\
  ```\n\n`WENT` 是一个动词，意味着某人（主语）从某地到了某处。`WENT` 寻找“to 名词短语”或“home”来填充 TO 位置。\n\n```lisp\n\
  (DEF-WORD WENT\n  ((ASSIGN *PART-OF-SPEECH* ‘VERB\n               *CD-FORM* ‘(PTRANS\
  \ (ACTOR ?GO-VAR1) (OBJECT ?GO-VAR1)\n                                         \
  \   (TO ?GO-VAR2) (FROM ?GO-VAR3))\n                              GO-VAR1 *SUBJECT*\n\
  \                              GO-VAR2 NIL\n                              GO-VAR3\
  \ NIL)\n   (NEXT-PACKET\n     ((TEST (EQUAL *WORD* ‘TO))\n      (ASSIGN GO-VAR2\
  \ *CD-FORM))\n   (NEXT-PACKET\n     (((--PACK))\n     ((TEST (EQUAL *WORD* ‘HOME))\n\
  \      (ASSIGN GO-VAR2 ‘(GO-VAR1))))\n   (NEXT-PACKET\n     ((TEST (EQUAL *PART-OF-SPEECH*\
  \ ‘NOUN-PHRASE))\n      (ASSIGN GO-VAR2 *CD-FORM))))\n```\n\n`A` 寻找一个名词来构建名词性短语。\n\
  \n```lisp\n(DEF-WORD A\n  ((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN))\n   (ASSIGN *PART-OF-SPEECH*\
  \ ‘NOUN-PHRASE\n             *CD-FORM* (APPEND *CD-FORM* *PREDICATES*)\n       \
  \      *PREDICATES* NIL)))\n```\n\n`THE` 对于 McELI 来说与 `A` 是一样的。\n\n```lisp\n(DEF-WORD\
  \ THE\n  ((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN))\n   (ASSIGN *PART-OF-SPEECH* ‘NOUN-PHRASE\n\
  \             *CD-FORM* (APPEND *CD-FORM* *PREDICATES*)\n             *PREDICATES*\
  \ NIL)))\n```\n\n`KITE` 是一个构建概念 `KITE` 的名词。\n\n```lisp\n(DEF-WORD KITE\n  ((ASSIGN\
  \ *PART-OF-SPEECH* ‘NOUN\n               *CD-FORM* ‘(KITE)))\n```\n\n`STORE` 是一个构建概念\
  \ `STORE` 的名词。\n\n```lisp\n(DEF-WORD STORE\n  ((ASSIGN *PART-OF-SPEECH* ‘NOUN\n\
  \               *CD-FORM* ‘(STORE))))\n```\n\n`*START*` 在每个句子的开始时加载。它寻找一个名词性短语（主语），后面紧跟一个动词（核心概念）。以下变量是面向英语的。它们被字典使用：\n\
  \n- `*PART-OF-SPEECH*`——当前的词性\n- `*CD-FORM*`——当前的依赖形式\n- `*SUBJECT*`——句子的主语\n- `*PREDICATES*`——谓语列表\n\
  \n```lisp\n(DEF-WORD *START*\n  ((ASSIGN *PART-OF-SPEECH* NIL\n           *CD-FORM*\
  \ NIL\n           *SUBJECT* NIL\n           *PREDICATES* NIL)\n   (NEXT-PACKET\n\
  \     ((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE))\n      (ASSIGN *SUBJECT* *CD-FORM*)\n\
  \      (NEXT-PACKET\n        ((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n          (ASSIGN\
  \ *CONCEPT* *CD-FORM)))))\n```\n\n## 练习\n\n1. 添加以下：\n```lisp\n(JACK WENT TO THE\
  \ RESTAURANT)\n(HE ORDERED A LOBSTER)\n(HE LEFT)\n```\n\n2. 为字典添加 `RED`，使得 `(JACK\
  \ GOT A KITE)` 解析为：\n```lisp\n(ATRANS (ACTOR (NAME (JACK))) (OBJECT (KITE)) (FROM\
  \ (NAME (JACK))))\n```\n提示：查看 `A` 做了什么。`*PREDICATES*` 应该设置为什么\n\n3. 有时单词可以通过查看后续内容来消除歧义。例如，“John\
  \ had an apple”通常意味着他吃了苹果，而“John had a newspaper”意味着他拥有报纸。定义 `HAD`，使得 `(JACK HAD\
  \ KITE)` 解析为：\n```lisp\n(POSS (ACTOR (NAME (JACK))) (OBJECT (KITE)))\n```\n但 `(JACK\
  \ HAD LOBSTER)` 解析为：\n```lisp\n(INGEST (ACTOR (NAME (JACK))) (OBJECT (LOBSTER)))\n\
  ```\n\n4. 定义 `BILL`、`CHECK` 和 `PAID`，使得 `(JACK PAID THE BILL WITH CHECK)` 解析为：\n\
  ```lisp\n(ATRANS (ACTOR (NAME (JACK))) (OBJECT (MONEY)) (FROM (NAME (JACK))))\n\
  ```\n`PAID` 寻找“WITH”的方式就像 `WENT` 寻找“TO”。注意 `ATRANS` 的概念对象来自于“with”，而不是 `PAID` 的直接宾语。（注意：AMOUNT\
  \ 是我们虚构的角色）。\n\n5. 我们刚刚定义 `check` 来表示 `MONEY`。但在餐厅故事中，`check` 也可以指向 `COST-FORM`，如句子“Jack\
  \ paid the check with a check.”这句话同时使用了“check”的两种含义。也就是说，`CHECK` 应该是：\n```lisp\n\
  (DEF-WORD CHECK\n  ((ASSIGN *PART-OF-SPEECH* ‘NOUN)\n               *CD-FORM* ‘(COST-FORM)))\n\
  \  ((ASSIGN *PART-OF-SPEECH* ‘NOUN\n               *CD-FORM* ‘(MONEY))))\n```\n\n\
  1. 定义函数 `FEATURE`，使得 `(FEATURE CD-form predicate)` 会测试 CD 是否为 `(predicate...)` 形式。修复\
  \ `PAID`，使得寻找“paid”直接宾语的请求测试为\n\n\n\n\n\n```\n(AND (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE)\n\
  \    (FEATURE *CD-FORM* ‘COST-FORM))\n```\n\n并且“with”请求同样会对 `MONEY` 进行测试。\n\n2.\
  \ 定义一个函数 `GET-NP-PREDICTION`，它在栈顶部的数据包中查找一个请求，其测试条件与 (a) 中给出的类似——即该请求寻找一个生成特定类型\
  \ `CD` 的名词短语。如果找到了一个，`GET-NP-PREDICTION` 将返回 `FEATURE` 正在寻找的谓词。因此，`GET-NP-PREDICTION`\
  \ 应该为 (a) 中的测试返回 `‘COST-FORM`。\n\n3. 重新定义冠词“a”和“the”，使得在变量 `PREDICTED` 中，它们能够保存通过执行\
  \ `GET-NP-PREDICTION` 返回的 `CD` 形式。\n\n你可以通过解析 `(JACK PAID THE BILL)` 来检查你的定义。当处理到\
  \ `THE` 时，`McELI` 应该打印出：\n\n```\n*PREDICTION* = (QUOTE COST-FORM)\n```\n\n如果没有发生这种情况，说明你做错了。注意\
  \ `COST-FORM` 在输出中应该被引号引用。\n\n4. 定义一个函数 `GET-CD-FORM`，它接收一个请求并返回该请求执行时将分配给 `CD-FORM`\
  \ 的结构。假设此类 `ASSIGN` 子句的形式如下：\n\n```\n(ASSIGN... *CD-FORM* ‘(COST-FORM...)...)\n\
  ```\n\n5. 定义一个名为 `RESOLVE-CONFLICT` 的函数，它对请求列表应用 `GET-CD-FORM`，选取第一个为 `CD-FORM`\
  \ 分配匹配 `PREDICTED` 结构的请求。\n\n例如，如果 `PREDICTED` 被设置为 `(QUOTE COST-FORM)`，且 `CHECK`\
  \ 有两个请求，其中一个将 `COST-FORM` 分配给 `CD-FORM`，那么 `RESOLVE-CONFLICT` 应该选择这个而不是另一个。使用 `EVAL`\
  \ 来消除 `QUOTEs`。\n\n6. 重新定义函数 `CHECK-TOP`，使其遍历栈顶所有的请求并挑选出可以触发的请求。如果有多个请求可以被触发，`CHECK-TOP`\
  \ 应该使用 `RESOLVE-CONFLICT` 来挑选一个满足 `PREDICTED` 的请求。\n\n7. 给 `CHECK` 在 (a) 之前写的歧义定义并解析\
  \ `(JACK PAID THE CHECK WITH A CHECK)`。结果应该是：\n\n```\n(ATRANS (ACTOR (PERSON (NAME\
  \ (JACK)))) (OBJECT (MONEY))\n    (AMOUNT (COST-FORM))\n    (FROM (PERSON (NAME\
  \ (JACK)))))\n```\n\n# 参考文献\n\n*   Abelson, R. P. (1973). The structure of belief\
