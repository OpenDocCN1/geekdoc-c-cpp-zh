  \ (ACTOR (*VAR* GO-VAR1))\n (OBJECT (*VAR* GO-VAR1))\n (TO (*VAR* GO-VAR2))\n (FROM\
  \ (*VAR* GO-VAR3)))\n GO-VAR1 = (PERSON (NAME (JACK)))\n *CONCEPT* = (PTRANS (ACTOR\
  \ (*VAR* GO-VAR1))\n (OBJECT (*VAR* GO-VAR1))\n (TO (*VAR* GO-VAR2))\n (FROM (*VAR*\
  \ GO-VAR3)))\nProcessing TO—not in the dictionary\nProcessing THE\nProcessing STORE\n\
  \ *PART-OF-SPEECH* = NOUN\n *CD-FORM* = (STORE)\n *PART-OF-SPEECH* = NOUN-PHRASE\n\
  \ *CD-FORM* = (STORE)\n GO-VAR2 = (STORE)\nCD form is\n (PTRANS (ACTOR (PERSON (NAME\
  \ (JACK))))\n (OBJECT (PERSON (NAME (JACK))))\n (TO (STORE)))\nInput is (HE GOT\
  \ A KITE)\nProcessing *START*\nProcessing HE\n *PART-OF-SPEECH* = NOUN-PHRASE\n\
  \ *CD-FORM* = (PERSON)\n *SUBJECT* = (PERSON)\nProcessing GOT\n *PART-OF-SPEECH*\
  \ = VERB\n **CD-FORM* = (ATRANS (ACTOR (*VAR* GET-VAR3))\n (OBJECT (*VAR* GET-VAR2))\n\
  \ (TO CVAR* GET-VAR1))\n (FROM CVAR* GET-VAR3)))\n GET-VAR1 = (PERSON)\n *CONCEPT*\
  \ = (ATRANS (ACTOR (*VAR* GET-VAR3))\n (OBJECT (*VAR* GET-VAR2))\n (TO (*VAR* GET-VAR1))\n\
  \ (FROM CVAR* GET-VAR3)))\nProcessing A\nProcessing KITE\n *PART-OF-SPEECH* = NOUN\n\
  \ *CD-FORM* = (KITE)\n *PART-OF-SPEECH* = NOUN-PHRASE\n *CD-FORM* = (KITE)\n GET-VAR2\
  \ = (KITE)\nCD form is\n (ATRANS (OBJECT KITE)) (TO (PERSON)))\nInput is (HE WENT\
