  (DSP SMART\n  (SAY-SUBJ-VERB (ACTOR) ‘BE)\n  (MSG “ BRIGHT\"))\n```\n\n`HUNGRY`\
  \ 转到 `BE-HUNGRY`。\n\n```lisp\n(DSP HUNGRY\n  (SAY-SUBJ-VERB (ACTOR) ‘BE)\n  (MSG\
  \ “ HUNGRY\"))\n```\n\n`THIRSTY` 转到 `BE-THIRSTY`。\n\n```lisp\n(DSP THIRSTY\n  (SAY-SUBJ-VERB\
  \ (ACTOR) ‘BE)\n  (MSG “ THIRSTY\"))\n```\n\n`CAUSE` 可能会转到 `X-IF-Y` 或 `If-X-THEN-Y`。\n\
  \n```lisp\n(DSP CAUSE\n  (LET (ANTE $(ANTE)\n        CONSEQ $(CONSEQ))\n  (COND\
  \ ((IN-MODE ‘QUES)\n         (SUBCLAUSE NIL ‘(CONSEQ) ‘FUTURE)\n         (MSG “\
  \ IF”)\n         (SUBCLAUSE NIL ‘(ANTE) (SELECTQ *TENSE*\n                     \
  \                (FIGURE ‘PRESENT)\n                                     (DEFAULT-TENSE*)))\n\
  \        (T (SUBCLAUSE ‘(OBJECT) ‘FUTURE)\n         (MSG “ THEN)))))\n```\n\n\n\n\
  \n\n```\n ******************************************\n生成器字典\n*****************************************\n\
  设置不规则动词的过去时和/或现在时。\n每个时态的格式为 (单数 复数)\n(DEFPROP BE (WAS WERE) PAST)\n(DEFPROP BE\
  \ (IS ARE) PRESENT)\n(DEFPROP DO (DID DID) PAST)\n(DEFPROP DO (DOES DO) PRESENT)\n\
  (DEFPROP DRINK (DRANK DRANK) PAST)\n(DEFPROP EAT (ATE ATE) PAST)\n(DEFPROP GIVE\
  \ (GAVE GAVE) PAST)\n(DEFPROP GO (WENT WENT) PAST)\n(DEFPROP GO (GOES GO) PRESENT)\n\
  (DEFPROP GRAB (GRABBED GRABBED) PAST)\n(DEFPROP HAVE (HAD HAD) PAST)\n(DEFPROP HAVE\
  \ (HAS HAVE) PRESENT)\n(DEFPROP KNOW (KNEW KNEW) PAST)\n(DEFPROP LET (LET LET) PAST)\n\
  (DEFPROP MIGHT (MIGHT MIGHT) PAST)\n(DEFPROP MIGHT (MIGHT MIGHT) PRESENT)\n(DEFPROP\
  \ PLAN (PLANNED PLANNED) PAST)\n(DEFPROP STRIKE (STRUCK STRUCK) PAST)\n(DEFPROP\
  \ TAKE (TOOK TOOK) PAST)\n(DEFPROP TELL (TOLD TOLD) PAST)\n(DEFPROP THINK (THOUGHT\
  \ THOUGHT) PAST)\nBERRIES 是当前设置中的唯一复数形式\n(PUTPROP BERRIES T ‘PLURAL)\n```\n\n```\n\
  \ ******************************************\n用于示例故事的 SPIN-DEMO \n*****************************************\n\
  (SETQ STORY1\n            ‘(IRVING THIRSTY (IRVING ‘(LIKE (ACTOR JOE) (TO IRVING)\
  \ (MODE (NEG))))\n            (IRVING ‘(DOMINATE (ACTOR JOE) (TO IRVING) (MODE (NEG))))\n\
  \            (IRVING ‘(DECEIVE (ACTOR JOE) (TO IRVING) (MODE (POS))))\n        \
  \    (IRVING ‘(LIKE (ACTOR IRVING) (TO JOE) (MODE (NEG))))\n            (JOE ‘(DECEIVE\
  \ (ACTOR IRVING) (TO JOE) (MODE (NEG)\n(SETQ STORY2\n            ‘(JOE HUNGRY (JOE\
  \ ‘(LIKE (ACTOR IRVING) (TO JOE) (MODE (NEG))))\n            (JOE (DOMINATE (ACTOR\
  \ IRVING) (TO JOE) (MODE (POS]\n(SETQ STORY3 ‘(JOE THIRSTY]\n(SETQ STORY4\n    \
  \        ‘(JOE HUNGRY\n            (WORLD ‘(HUNGRY (ACTOR IRVING) (MODE (POS))))\n\
  \            (JOE ‘(LIKE (ACTOR IRVING) (TO JOE) (MODE (POS))))\n            (JOE\
  \ ‘(DECEIVE (ACTOR IRVING) (TO JOE) (MODE (NEG))))\n            (JOE ‘(LIKE ACTOR\
  \ JOE) (TO IRVING) (MODE (POS))))\n```\n\n\n\n\nGoldwater 机器也存在两个有趣的失败：它无法处理平庸现实，并且缺乏任何常识规划能力。这两个失败在下面的示例中得到了说明。从四个命题：“共产主义者对自由世界的成员做了坏事”、“南美学生向尼克松扔鸡蛋”、“卡斯特罗是共产主义者”以及“西柏林是自由世界的城市”，意识形态机器得结论卡斯特罗会向西柏林扔鸡蛋。规划能力应该关注行动的目的，并只有在这些行动对于实现某些目标具有工具性时才建议，而不是仅仅因为它们属于给定执行者可能做的事情的类别就提出建议。对平庸现实的考虑应当防止“国家元首向跨洋另一边的城市扔鸡蛋”这种念头的产生。\n\
  \n在 Goldwater 机器开发后的几年里，Schank 和 Abelson 开发了代表人类事件中平庸现实的知识结构理论（Schank and Abelson,\
  \ 1977）。`POLITICS` 最初被构想为根据新的知识表示理论来重构 Goldwater 机器。特别是，Schank 建议使用和扩展脚本（scripts）来编码刻型化的政治事件，其想法是这种机制将约束新的\
  \ Goldwater 机器仅考虑符合平庸现实的行动。虽然脚本被证明是编码政治世界中平庸、刻型行为知识的一种非常有效的机制（正如它们之前在其他领域被证明是有用的），但脚本理论留下了意识形态模拟这一更有趣的问题未解决。本质上，脚本没有解决政治执行者何时选择特定行动路线的问题，也没有解决为什么要选择某条行动路线（甚至将其视为一个可行的计划）。此外，脚本对于理解具有不同信仰体系的人对同一事件的截然不同的主观解释问题没有贡献。\n\
  \n### 一些重大进展\n\nAI 文献中没有一种编码主观知识的通用机制。因此，我需要一种方法来表示和使用政治意识形态中包含的特有知识，并开发一种计算机制，将这些知识应用于解释和制定行动计划的过程中。在研究新的知识结构和机制的过程中，我设定了两个基本要求，以衡量它们的用性，并符合对心理学合理的人类主观理解模型的直觉概念。简而言之，这些标准是：\n\
  \n1. 意识形态的表示必须包含推理机制模拟广泛不同意识形态解释所需的所有信息。任何意识形态差异都不应隐藏在控制结构中。因此，模拟系统应该能够通过用新的意识形态替换现有的信仰来模拟不同的意识形态行为。\n\
  2. 需要一个在逆境情况下常识推理的单一统一模型。至关重要的是，该模型必须是整合的，利用手头的任何信仰或信息，并且推理模型应独立于意识形态信仰。推理应该受到意识形态信仰的影响，但系统应该能够在没有意识形态信念的情况下进行推理。我的前提是，尽管政治信仰或事实知识不同，所有人都能表现出大致相同的推理过程。然而，单一统一的推理过程在给定不同信仰或不同事实信息的情况下得出不同的结论。\n\
  \n这两个标准在 `POLITICS` 系统的开发中得到了成功满足。`Goal trees` 表示政治意识形态，`counterplanning strategies`\
  \ 编码高层推理过程。这些新的知识结构将进行详细讨论，此外 Schank 和 Abelson 脚本以及其他推理机制的扩展。\n\n在`subjective understanding`理论开发过程中，另一个并行的关注点是`integrated\
  \ reasoning`原则的实现。该原则规定，所有知识都可以应用于理解过程的每个阶段。理解过程本身没有固定的算法控制结构。相反，控制取决于哪种知识源能最大程度贡献于满足理解者在过程中每一步的目标。类似的思想在\
  \ `HEARSAY-II` (Reddy, 1976) 中被开发，用于在语音理解任务中汇总不同的知识源。整合推理原则将在后续章节中详细讨论。\n\n### POLITICS\
  \ 能做什么：一个示例\n\n考虑一个由 `POLITICS` 解释的政治事件，摘自《新亥文登报》的一条标题：\n\n> 美国国会预计批准巴拿马运河条约。\n\n\
  `POLITICS` 首先从保守意识形态的角度解释标题，随后从自由主义意识形态的角度解释。同一套计算机程序可以模拟任何自洽的意识形态。自由主义和保守意识形态是编码特征每种意识形态的重要动机和评估信仰的数据结构。评估性信仰告诉理解者哪种行动路线更符合意识形态目标。`POLITICS`\
  \ 在解释事件之前会同化意识形态。故事解释（如相应的问答对话所示）在对标题的评估和对可能的未来事件的预期上存在显著差异。\n\n首先，让我们分析对巴拿马运河故事的美国保守派解释。`POLITICS`\
  \ 分析了标题并得出结论：立法机构（例如美国国会）对“的“批准”要求应用议会程序（在 `POLITICS` 中编码为脚本 `PARLIAMENT-PROC`）。更具体地说，由于输入事件表达了对结果的预期，系统得出到达结果的手段应当实例化。`SPARLIAMENT-PROC`\
  \ 脚本知道 `$VOTE` 场景通常是产生立法机构正在考虑的问题的决策或结果。当“批准”一词应用于投票机构正在考虑的项目时，它被认为对所考虑的命题产生积极结果。\n\
  \n`POLITICS` 试图推断 `$VOTE` 对世界状态的直接结果，因为 `$VOTE` 脚本说明这通常很重要。生成的推理是，巴拿马运河条约中的一切都可能变成事实。（条约的主要条款存储在\
  \ `POLITICS` 的内存中。）条约的主要结果是运河区（以及其中的任何设施，如运河本身）从从美国转移到巴拿马。\n\n标题解释的初始阶段如下：\n\n```\n\
  \ *(INTERPRET US-CONSERVATIVE)\nINCORPORATING US-CONSERVATIVE IDEOLOGY GOAL TREES…\n\
  \ GO: SOVIET-WORLDOM.\n G12: US-SAVEFREEWORLD.\n INITIALIZING PARSER… DONE.\n INPUT\
  \ STORY: +THE US CONGRESS IS EXPECTED TO APPROVE THE\n PANAMA CANAL TREATY.\nPARSING…\
  \ COMPLETED.\nINSTANTIATING SCRIPT: SPARLIAMENT-PROC\n EXPECTED TRACK:\n <=> ((SVOTE\
  \ VOTERS (#ORG NAME (CONGRESS) PARTOF (*US*))\n ISSUE (#TREATY NAME (PANAMA CANAL)\n\
  \ REF (TREATY03))\n SIGNEES (*US* *PANAMA*))\n OUTCOME (*POS*)))\n```\n\n\n\n\n\
  美国保守派政治（POLITICS）采用了脚本分析并应用了目标导向的推理，使用了美国保守派意识形态的目标和动机。巴拿马运河条约的结果并未实现美国的任何新目标；事实上，美国的一些活跃目标遭受了严重挫折。美国的一个目标是军事上保持尽可能强大的实力。由于放弃了巴拿马运河这一重要的军事前哨站，这一目标遭受了损害。军事实力目标是比共产主义国家（在军事、经济和政治上）更强的子目标，而这又是遏制共产主义的子目标，即美国保守派意识形态最高层次的目标。让共产主义者意识到美国新的弱点（即下方列出的\
  \ `MTRANS` 推理）违反了美国的军事威慑目标，这导致美国保守派政治认为，俄罗斯可能会追求其扩大对小国军事和政治控制的目标。\n\n### POLITICS\
  \ 协议推理\n\n\n\n下方的 POLITICS 协议部分说明了上述讨论的导导向推理：\n\n```\n *CANAL-ZONE* FROM (*CONTROL*\
  \ VAL (*US*))\n TOWARD (‘CONTROL* VAL (*PANAMA*))\n*US* GOAL VIOLATED:\n*US* MILITARY\
  \ STRENGTH DECREASED.\n*US* GOAL VIOLATED:\nACTOR (#COUNTRY TYPE (*COMMUNIST*))\n\
  \ <=> (*MTRANS*)\nMOBJ ((ACTOR (*US*) TOWARD (*STRENGTH* TYPE (*MILIT*))\n INC (-2)))\n\
  INTERPRETATION COMPLETED, READY TO ACCEPT QUESTIONS.\n```\n\n问答（QA）对话说明了上述推理和脚本知识对于评估局势的必要性，以便预测未来事件并为美国未来的行动提供建议。下方的问答\
  \ 对话中的第一个答案表达了对批准巴拿马运河条约后的世界状态与当前世界状态相比的相对评估。评估函数仅考虑了在之前的事件解释过程中揭示的世界状态变化。当然，得出的负面评估是从美国的角度出发的。第二个和第三个问题的答案直接来自理解阶段生成的目标导向推理得出的，即美国军事实力的预期下降以及随之而来的俄罗斯军事/政治扩张目标的激活。第四个答案重构了推理链，得出结论：俄罗斯可能会尝试接管运河。\n\
  \n问答对话所示：\n\n> INTERPRETATION COMPLETED, READY TO ACCEPT QUESTIONS.\n> > Q1: 美国应该批准该条约吗？\n\
  > > A1: 不，该条约对美国是有害的的。\n> > Q2: 为什么该条约对美国不利？\n> > A2: 美国将失去运河并交给巴拿马，美国将变得更弱。\n>\
  \ > Q3: 如果美国丢失了运河，可能会发生什么？\n> > A3: 俄罗斯将试图控制这条运河。\n> > Q4: 为什么俄罗斯会尝试接管运河？\n> > A4:\
  \ 俄罗斯想要扩大其军事控制。巴拿马运河具有很高的军事价值。\n> > Q5: 这种情况可能会发生？\n> > A5: 美国可能无法阻止任何人接管巴拿马运河。托里霍斯（Torrijos）是一个共产主义者。托里霍斯将让俄罗斯控制巴拿马。\n\
  > > Q6: 美国为什么应该担心俄罗斯接管运河？\n> > A6: 因为俄罗斯想要控制世界。\n> > Q7: 美国应该做什么来阻止俄罗斯接管运河？\n> >\
  \ A7: 国会应该反对巴拿马运河条约。\n\n### 规划与策略\n\n第五个问题要求进行规划：俄罗斯如何在其追求新激活的目标上继续进行？由于在事件解释阶段没有得出此方面的结论，因此必须重新调用推理机制，目标是确定最可能的俄罗斯计划。POLITICS\
  \ 已知有多种方法使一个国家实现对另一个国家（或人口地区）的控制，例如入侵、引发革命、经济依赖，以及当政府共享共同意识形态时所实现的直接影响。最后一种替代方案被选为俄罗斯可能的选择，因为它的成本最低。（根据美国保守派意识形态，托里霍斯，因此巴拿马被认为具有共产主义倾向。）调用反规划模块来评估所提的俄罗斯行动计划的可行性。（反规划是确定一个行动者如何阻挠另一个行动者的目标或计划的过程。）由于美国移除了对运河区的军事和政治控制，反规划模块认为没有有效的方法阻止俄罗斯在巴拿马的行动。因此，POLITICS\
  \ 认为所选俄罗斯接管巴拿马运河的方法确实是可行的。\n\n“如何”类问题涉及工具性（Lehnert, 1978）。计划的工具被认为是为了该计划成功而必须满足的先条件。因此，为第五个问题生成的答案是俄罗斯接管的先条件列表：当前控制运河的政党没有有效反对，未来控制运河的政党由于其感知的共享意识形态而产生反对。（英语生成器在表达内存结构中存在的因果关系方面稍显不足。）\n\
  \n第六个问题的答案通过检查俄罗斯的目标获得，以查看是什么驱动俄罗斯在可能的情况下扩大其军事控制。\n\n最后两个问答对反映了应用的反规划策略，这些策略建议美国在当前激活的背景下为了实现目标应该选择的行动方案。结论基本上是，美国唯一的替代方案是拒绝巴拿马运河条约。这与全国范围内大多数保守派发表的近期声明一致。\n\
  \n### 问答过程\n\nPOLITICS 的问答阶段基于 Lehnert (1978) 的问题分析过程，该过程精确确定问题在要求什么。一旦指定了所需信息，POLITICS\
  \ 在原始事件的解释中搜索答案。如果搜索失败，则尝试进一步的推理，如美国保守派 QA 对话中假设性“如果”问题所示。在调用问答过程之前，每个问题的英文文本被分析为概念依赖（CD）表示。分析过程基于\
  \ Riesbeck 和 Schank (1976) 对基于期望的解析器的描述，但该程序面向于解析为 POLITICS 系统使用的内存结构的任务。对之前讨论的对象和事件的确定引用是分析过程的一部分。问题的答案通过一个非常简单的英文生成器从\
  \ CD 翻译为英文，它只是填充句子模板的槽位。由于分析器或生成器都不是理解理论的核心关注点，在这里将不详细讨论。\n\n### 自由派解释\n\n巴拿马运河事件的自由派解释以类似的方式通过初始的脚本解释进行。然而，目标导向的推理发现，美国的行动确实有助于实现某些美国目标。在美国自由派意识形态中，重要的美国目标包括：减轻紧张局势、避免冲突并与所有国家（特别是当前背景下的拉丁美国家）改善关系。POLITICS\
  \ 得出巴拿马运河条约是实现这些目标的重要一步；因此对批准条约引发的世界状态变化给出正面评估。\n\n\n\n\n反计划策略被用于回答以下问题：如果美国不批准条约（即保留苏伊运河）会发生什么，以及俄罗斯人是否可能尝试夺取运河。在美保守主义意识形态中应用的、用于验证俄罗斯控制巴拿马（从而控制运河）的候选计划的相同反计划策略，在美自由主义意识形态中得出了不同的结果。在自由主义意识形态下，俄罗斯维持世界和平、避免政治和军事冲突的目标比扩张军事或政治控制重要得多。因此，由于《巴拿马运河条约》中有一节规定了美国将保护运河，反计划策略得出结论：如果俄罗斯人试图夺取巴拿马，他们将与美国发生冲突。根据美国自由主义意识形态，对俄罗斯来说，国际冲突比放弃对巴拿马的政治/军事控制目标不可接受。因此，自由主义解释中最后两个问题的答案与保守主义解释中对应问题的答案存在差异。\n\
  \n以下是美国自由主义的 `POLITICS` 解释以及随后的巴拿马运河标题的后续问答对话：\n\n```\n *(INTERPRET US-LIBERAL)\n\
  INCORPORATING US-LIBERAL IDEOLOGY GOAL TREES…\n GO: SOVIET-WORLDPEACE.\n G11: US-WORLDPEACE.\n\
  INITIALIZING PARSER… DONE.\nINPUT STORY: +The US Congress is expected to approve\
  \ the\n Panama Canal treaty.\nPARSING… COMPLETED.\nINSTANTIATING SCRIPT: SPARLIAMENT-PROC\n\
  EXPECTED TRACK:\n <= > ((SVOTE VOTERS (#ORG NAME (CONGRESS)\n PARTOF (*US*))\n ISSUE\
  \ (#TREATY NAME (PANAMA CANAL)\n REF (TREATY03))\n SIGNEES (*US* *PANAMA*))\n OUTCOME\
  \ (*POS*)))\n*CANAL-ZONE* FROM (*CONTROL* VAL (*US*))\n TOWARD (‘CONTROL* VAL (*PANAMA*))\n\
  (SCOLONIALISM CPOWER (*US*)\n COLONY (*CANAL-ZONE* PARTOF (‘PANAMA*))\n (*PANAMA*))\n\
  ABORTED. MAINCON NO LONGER MATCHES WORLD.\n*US* GOAL ENABLED:\n*US* AND *PANAMA*\
  \ TO END CONFLICT.\n*US* GOAL ENABLED:\n(#COUNTRY TYPE (*THIRD-WORLD*)\nPARTOF (*SOUTH-AMERICA*))\n\
  TO IMPROVE RELATIONS WITH *US*\n```\n\n> 解释完成，准备好接受提问。\n\n> > Q1: 美国应该批准该条约吗？\n\n\
  > > A1: 是的，《巴拿马运河条约》对美国有益。\n\n> > Q2: 为什么这个条约是有益的？\n\n> > A2: 《巴拿马运河条约》改善了与拉丁美国家的关系。\n\
  \n> > Q3: 如果美国保留运河会发生什么？\n\n> > A3: 这将导致巴拿马和拉丁美洲产生不满满和冲突。\n\n> > Q4: 为什么这会导致冲突？\n\
  \n> > A4: 运河区是美国的一个殖民地。拉丁美洲不喜欢殖民主义。美国将维持殖民主义。\n\n> > Q5: 如果俄罗斯人企图夺取运河会怎样？\n\n> >\
  \ A5: 俄罗斯不想与美国发生冲突。如果美国防御运河，俄罗斯将不会介入。美国防御运河是条约的一部分。\n\n巴拿马运河事件是该程序能够理解的最复杂的场景类型。`POLITICS`\
  \ 的应用领域局限于解释政治事件，但其许多机制（如反计划过程）具有更广泛的适用性。\n\n总体而言，`POLITICS` 加上 `UCI-LISP` 和 `MLISP`\
  \ 支持函数几乎需要整个 `DEC KL-10` 计算机的地址空间（256K 36 位字）。在专用的 `TOPS-20/50`（即系统上没有竞争的时间共享作业）上，`POLITICS`\
  \ 初始化一种意识形态大约需要 10 秒，解释一个事件需要 30 秒，回答一个问题需要 10 秒。当系统以时间时间共享的方式为许多用户服务时，这些时间会长得多（5\
  \ 到 20 倍）。\n\n### 问题\n\n`POLITICS` 中的核心问题是实现主观理解需要什么知识。在这里我列出了 `POLITICS` 中包含的每个知识源，说明应用信息的过程、知识编码的有效性、知识的通用性，以及\
  \ `POLITICS` 系统上一个版本实现的信息量的大致衡量。知识源根据开发和将其整合到 `POLITICS` 所花费的精力从高到低列出。\n\n### 反计划策略\n\
  \n这些编码了关于如何挫败对手以及如何在对手蓄意干扰的情况下实现自己目标的非常通用、高层次的。此类策略被计划/反计划过程用于解释和制定计划。这些策略以复杂规则的形式编码（每个规则约\
  \ 30 行 `LISP` 代码），对于计划是有效的，但对于内省则无效。（程序无法查询或更改规则的内部结构。）系统中有 40 条此类这样的规则，涵盖了大多数反计划情况。\n\
  \n### 目标树 (Goat Trees)\n\n目标树是编码意识形态的通用机制。它们是静态数据结构，允许系统中的所有过程检查。每种政治意识形态都为每个主要的政治参与者分配一个目标树。目标树代表了理解者对于意图和动机的意识形态信念。在最后的实现中，`POLITICS`\
  \ 有两种意识形态；每种意识形态平均有 9 棵树，每个目标树编码约 12 个目标。\n\n### 场景脚本 (Situational Scripts)\n\n\
  场景脚本编码了关于典型情况的特定领域的片段式知识。`POLITICS` 使用的脚本是 Schank 和 Abelson (1977) 脚本的扩展；规范性目标与脚本角色和决策点相关。`POLITICS`\
  \ 有 13 个脚本，仅涵盖了可能的政治场景的一小部分。每个脚本由约 3 页的 `LISP` 代码组成。\n\n##### 环境依赖推理规则\n\n这些规则由一个或多个脚本的激活触发。这些是处理琐碎问题的特定规则。每个脚本大约有\
  \ 10 条此类规则。\n\n##### 切换规则\n\n这些是激活或取消脚本的规则。它们的任务是通过上下文线索和相关参与者的意识形态信念来识别情况。POLPOLITICS`\
  \ 中有 50 多个切换规则。\n\n### 字典预期\n\n这些是用于分析与政治事件相关的英语句子的规则。每个单词可以索引最多 10 个预期。某些预期被不同的单词共享。字典大小约为\
  \ 200 个单词。\n\n##### 工具函数\n\n工具函数负责模式匹配、跟踪任务议程、更新和搜索内存、脚本实例化、问答对话的问题类型划分以及低级概念依赖推理。这些函数在内存中占据\
  \ 50K 36 位字。\n\n`POLITICS` 所能做的存在许多局限性。其中一些是由于底层主观整合理解理论的限制造成的。另一些局限性源于 `POLITICS`\
  \ 不是一个完整的系统，而是一个进一步研究的实验性工具。`POLITICS` 在理解复杂冲突方面存在理论问题。这些问题（在 Carbonell, 1979a 中讨论）导致了\
  \ Schank 和 Carbonell (1979a) 基本社会行为以及 TRIAD 系统 (Carbonell, 1979a)。\n\n本文中介绍的所有 `POLITICS`\
  \ 示例（除下面的示例外）都是正确处理的事件解释，说明了主观解释和整合理解的各个方面。`POLITICS` 像任何其他大型人工智能程序一样，在理解新事件时有时会出错。\n\
  \n考虑一个 `POLITICS` 犯下严重判断错误的例子：\n\n\n\n\n\n```\n*(美国自由主义者的解读）\n输入：俄罗斯在捷克边境集结了部队。\n\
  \ .\n .\n .\n```\n\n>问：对于这种情况，美国应该怎么做？\n\n> 答：美国应该祝贺勃列日涅夫。\n\n让我们简要讨论一下 `POLITICS`\
  \ 是如何得出这样一个荒谬答案的。因为自由主义意识形态反对军事冲突，反向规划过程试图找到一种停止即将发生的入侵的方法。军事手段被拒绝了，因为它们也可能导致武装冲突。外交手段没有违反美国的自由主义目标，且适用于当前局面。然而，美国外交倡议的一个先决条件被阻碍了：涉及的两个国家必须拥有良好关系，而美国和俄罗斯之间并非如此。（上一个理解的故事涉及的是俄罗斯间谍被驱逐。）一个国家如何改善与另一个国家的关系？嗯，如果领导人之间的关系得到改善，将导致整体外交关系的向好。对某人的行为表示认可会导致关系改善。因此，建议祝贺勃列日涅夫是实现某种先决条件（子目标）的手段，这使得使美国能够运用外交手段停止俄罗斯对捷克斯洛伐克的军事行动。\n\
  \n没有任何一个单一的推理会导致生成荒谬回答时出现逻辑缺陷。缺陷在于追求局部推理时忽略了全局考量。`POLITICS` 在独立追求改善美苏关系这一子目标的同时，忽略了美国结束苏联-捷克冲突这一目标。推理过程没有得到充分的整合。在考虑纠正未能达成的先决条件的计划时，不应忽略反向计划的目的。为了满足改善外交关系这一先决条件而选择的方法，排斥了与俄罗斯谈判以结束冲突的首要目的的实现。人们不能为了认可\
  \ X 做 Y 而为了处于更好的位置去要求 X 不要做 Y。`POLITICS` 需要对冲突形势以及参与者之间产生的关系有更好的理解。这种理解必须被用于指导反向规划策略应用于冲突局势。问题的产生不是\
  \ `POLITICS` 对谈判策略的选择引起的，而是由于该策略应用于特定冲突局势的方式存在错误。\n\n`POLITICS` 本质上犯了任何实现理解理论过程模型的\
  \ AI 系统典型的四类错误。我们将这些错误分为以下四类：\n\n| 1\\. 技术错误 | 理解模型实现过程中的错误。 |\n| 2\\. 不一致性 | 体现在计算机程序中的过程模型部分之间相互不一致。\
  \ |\n| 3\\. 不完整性 | 某些知识（事实、规则或通用过程）在模型中未被充分说明。 |\n| 4\\. 缺乏整合 | 模型的各个部分定义良好，但这些组件之间相互作用的方式未被规定。\
  \ |\n\n上面的例子是错误 3 和 4 结合的实例。通过让 `POLITICS` 始终检查：为了工具性目标的计划选择没有违反对活跃高级目标的任何先决条件，这一特定问题得到了纠正。这是\
  \ `POLITICS` 所执行的问题解决类型中的一个重要问题，在实际运行程序之前可能还没有注意到。（谁能预见到它呢？）因此，构建可运行的程序是制定人类推理理论的不可或缺的一部分。作为计算机程序实现的过程模型为理论提供了在其他情况下可能无法实现的完备性和内部一致性。\n\
  \n## POLITICS 概览\n\n### 整合理解理论\n\n`POLITICS` 系统是*整合理解*实验的结果，同时也是人类意识形态解读和决策过程的计算机模型。整合理解意味着系统中所包含的所有相关知识都可以在处理的每个阶段发挥作用。事实上，知识的应用没有预先确定的顺序；相反，控制结构受到主观信念组件与传入的情境信息之间相互作用的动态影响。这与更传统的\
  \ AI 系统形成显著对比，特别是自然语言理解系统如 `LUNAR`（Woods 等，1972），其中各种模块按固定的线性顺序应用。\n\n然而，如果要选择性应用知识，必须以具有计算意义的方式组织。因此，`POLITICS`\
  \ 使用了多个知识来源，并经历了理解过程的几个阶段。前者对应于知识如何被应用（例如，情节知识与个人内部驱动和动机知识的应用不同），后者则是根据系统在解释新情境时的知识状态动态决定的。\n\
  \n`POLITICS` 本质上是一个基于规则的系统，规则集根据上下文的变化而被激活或去激活。只有激活的规则才能在理解过程中应用。当然，某些规则是*上下文切换规则*，其动作包括检测上下文的变化并对其他规则执行相应的激活或去激活。上下文切换规则始终处于激活状态。\n\
  \n### POLITICS 的内部结构\n\n图 11.1 显示了 `POLITICS` 解读过程两个主要阶段，分别标记为：*初始分析阶段*和*意识形态解读阶段*。图\
  \ 11.2 显示了 `POLITICS` 的问答模式。\n\n![](img/fig11_1_B.jpg)\n\n图 11.1 POLITICS：初始解读。\n\
  \n![](img/fig11_2_B.jpg)\n\n图 11.2 POLITICS：问答。\n\n初始分析阶段包括自然语言分析、指称对象规范、情境表征以及对政治参与者可能追求的目标进行假设形成。意识形态解读阶段细化情境上下文，确认（或排除）假设的目标，识别可能的冲突，并在意识形态和潜在目标冲突值得考虑时启动反向规划过程。两个阶段都使用大部分知识源。对任何一个维度的推理都受到其他维度结论的强烈影响。\n\
  \n注意，问答涉及与理解原始故事相同的输入分析。问题并不是简单的打印内存请求。必须理解问题的意图，并选择最合适的回答形式。\n\n### 脚本在政治中的应用\n\
  \n`POLITICS` 使用脚本（Shank 和 Abelson, 1977；Cullingford, 1978; 以及 Carbonell, 1978）来编码大部分情节世界知识。考虑一个\
  \ `POLITICS` 使用的简化版脚本插图。简化仅包括将概念依赖结构翻译成英文，并消除二级信息，如每个事件的预期时间和可能的干扰情况。\n\n大部分脚本应用机制改编自\
  \ `SAM` 系统（Cullingford, 1978）。然而，`POLITICS` 拥有的比 `SAM` 多得信息；特别是 `POLITICS` 可以利用其对各种参与者目标的知识。因此，在整合知识应用的精神下，以如下描述的方式与决策点相关联。\n\
  \n\n\n\n如 `图 11.3` 所示，脚本可能包含多条轨道。在两条并行轨道之间的每个决策点，脚本都会编码由哪个行动者做出决策，以及每个备选方案可能实现的目标。例如，在第一个决策点，`&\
  \ INVADER` 必须决定他是想对 `& INVADEE` 进行军事控制（左分支），还是仅仅获得某种程度的政治控制，导致他倾向于避免武装冲突（右分支）。在解释事件时，`POLITICS`\
  \ 通过比较其对相关行动者目标的信念与与脚本决策点相关的存储规范目标，预测脚本中合适的轨道。因此，当 `& ACTOR` 是苏联时，美国保守派的`POLITICS`预测第一个备选方案的左分支，而在相同情况下，美国自由派的`POLITICS`预测右分支。通过这种方式，脚本应用算法被扩展为使用行动者目标的主观信念，从而大幅减少了可能预测的数量。因此，随后的搜索问题受到了显著限制。\n\
  \n![](img/fig11_3_B.jpg)\n\n`图 11.3 未实例化的入侵脚本。`\n\n考虑以下 `POLITICS` 运行过程，作为理解简单事件时\
  \ `$INVADE` 脚本应用过程的说明。括号中的项目为了易读性已用英语重新表述。选择此示例是因为脚本是解释过程中使用的主导知识源，正如问答对话所示。\n\n\
  ```\n (INTERPRET US-CONSERVATIVE)\nINPUT TEXT :俄罗斯在捷克边境集结部队。\nPARSING… COMPLETE\n\
  INFERENCE: (*FORCES* PARTOF (*RUSSIA*))\nINSTANTIATING SCRIPT: $INVADE\nINSTANTIATED\
  \ SCRIPT ROLES:\n & INVADER ← *RUSSIA*\n & INVADEE ← *CZECHOSLOVAKIA*\n &FORCES1\
  \ ← (*FORCES* PARTOF (*RUSSIA*))\n &FORCES2 <uninstantiated>\n &KEYPLACES <uninstantiated>\n\
  INSTANTIATED GOALS:\nGOAL OF RUSSIA: <获得捷克斯斯洛伐克的政治控制。 >\n SUBGOAL: <获得捷克斯斯洛伐克关键地点的军事控制.>\n\
  GOAL OF CZECHOSLOVAKIA: <防止俄罗斯获得政治控制.>\n SUBGOAL: <防止俄罗斯军队获得关键地点的军事控制.>\n```\n\n\
  > 解释完成，准备好接受提问。\n\n> > Q1: 俄罗斯为什么要这样做？\n\n> > A1: 因为俄罗斯认为通过派遣部队可以获得捷克斯斯洛伐克的政治控制。\n\
  \n> > Q2: 俄罗斯接下来会做什么？\n\n> > A2: 俄罗斯可能会告诉其部队开始入侵。\n\n> > Q3: 俄罗斯还能做什么？\n\n> > A3:\
  \ 俄罗斯可能会等待捷克斯斯洛伐克向俄罗斯的要求做出妥协。\n\n> > Q4: 如果捷克斯斯洛伐克不屈协会怎样？\n\n> > A4: 俄罗斯可能会决定开始入侵。\n\
  \n> > Q5: 美国应该做什么？\n\n> > A5: 美国应该进行军事干预。\n\n> > Q6: 美国还能做什么？\n\n> > A6: 美国无能为力，或者可以通过就捷克斯斯洛伐克问题与俄罗斯进行协商来进行外交干预。这些备选方案对美国不利。\n\
  \n前四个问题和答案反映了 `POLITICS` 对俄罗斯和捷克斯斯洛伐克目标的认知，以及 `$INVADE` 脚本包含的信息。在回答问题 2 时，`POLITICS`\
  \ 预测了脚本的一个分支，但正如问题 3 所示，当预测被明确反驳时，将考虑备选方案。最后两个问题说明了后续章节中讨论的反计划策略（counterplanning\
  \ strategies）。\n\n### 情境推理规则\n\n除了脚本之外，`POLITICS` 还以 `SITUATION` → `ACTION` 规则的形式编码了部分情境知识。推理规则有两种类型：依赖上下文（context\
  \ dependent）规则和上下文切换（context switching）规则。我将讨论每类规则的必要性并给出适当的示例。\n\n### 依赖上下文规则\n\
  \n依赖上下文规则与一个或多个脚本相关。只有当上下文切换规则认为这些脚本适合解释给定情境时，它们才会被激活。在 `POLITICS` 处理的任何时候，只有激活的规则会被测试。\n\
  \n考虑依赖上下文规则的两个实例，情境是政府资金：\n\n```\n RULE-FUND#5\n 如果 资金目标是军事性质的，\n 则预计一个军事机构将获得花费资金的权限\n\
  （即对资金的控制权）。\nRULE-FUND#8\n 如果 &FUND-OBJ 有物理实现\n 且 &FUNDEE 控制与 &FUND-OBJ 类型相同对象的创建，\n\
  \ 则 &FUND-CON = (&FUNDEE 将建造 &FUND-OBJ)。\n```\n\n上述两个规则在政府资金场景下都是用的，但在其他场景（如军事入侵和条约谈判）中完全不适用。此外，第二个规则直接引用了\
  \ `$FUND`（政府资金）脚本角色。显然，只有在 `$FUND` 适用的情况下激活此类规则才有意义。脚本与依赖上下文规则之间的这种耦合是 `POLITICS`\
  \ 情节记忆组织的核心。\n\n### 上下文切换规则\n\n依赖上下文规则只有在确定了上下文后才能应用。这项任务是上下文切换规则的功能，它们始终处于激活状态。上下文切换规则的测试子可以测试传入的情节信息、被提及或推断的行动者和对象的属性、政治行动者的意识形态目标，以及任何可能被激活的脚本信息。动作子会触发脚本的应用并激活其每个相关的依赖上下文规则。\n\
  \n决定哪些脚本适用于某种情境是一项艰巨的任务。原始的 `SAM` 系统解决这个问题的版本相对简单，因为它只考虑了两个或三个可能的（但内部非常详细的）脚本。`FRUMP`\
  \ 系统（DeJong, [1979](#reference.xhtml_bib23））可以应用多达 50 个（非常粗略的）脚本，脚本选择可能是其最困难的问题。目前的\
  \ `POLITICS` 实现有 13 个脚本——可以添加更多，以增加 `POLITICS` 对政治情境的认知。然而，与 `FRUMP` 或 `SAM` 不同，脚本应用并不是\
  \ `POLITICS` 推理过程的核心；它仅仅处理琐碎但相关的细节，以便目标分析和反计划能够进行。因此，`POLITICS` 通常能更好地决定应用哪种脚本（通过上下文切换规则），因为它可以利用得多的世界知识，特别是政治行动者的目标。\n\
  \n`POLITICS` 中的脚本列如下：\n\n| $SINVADE | —军事入侵 |\n| $FUND | —对项目的政府资助 |\n| $DIPLOMATIC-INIT\
  \ | —为某个目的发起外交行动 |\n| $ARMSRACE | —军事力量的同步长期扩张 |\n| $CONSTRUCT | —为了以后使用建造任何大型物体\
  \ |\n| $MILITARY-AID | —从一个政治实体到另一个实体 |\n| $ECONOMIC-AID | —从一个政治实体到任何机构 |\n| $CONFRONTATION\
  \ | —军事、外交或经济僵局（危机情境） |\n| $PARLIAMENT-PROC | —针对特定问题的立法政府行动 |\n| $VOTE | —立法批准/反对\
  \ |\n| $ARMSALE | —类似于 $MILITARY-AID，但还款是货币而非政治影响力 |\n| $NEGOTIATE | —通过相互妥协达成协议\
  \ |\n| $ESPIONAGE | —以任何形式未经许可从政治实体获取信息 |\n\n\n\n\n再次考虑上一节中的 POLITICS 示例。输入内容是：“俄罗斯在捷克边境集结了部队。”为什么\
  \ POLITICS 认为这是一个可能的 `$INVADE`（入侵）实例？为什么不是 `SMILITARY-AID`（军事援助）？如果输入是：“美国在西德意志边境集结了部队”，这会是一次入侵还是\
  \ NATO 的行动（向西欧提供军事援助的实例）？POLITICS 根据情境线索（例如，这些线索排除了 `$VOTE` 和 `$PARLIAMENTARY-PROC`）以及它对参与方**的信念来做出决策。在美国保守派模式下，POLITICS\
  \ 假设俄罗斯的首要目标是扩大对其他国家的政治控制。这可以通过入侵（对斯克斯洛伐克具有改革导向的杜杜克政府）来实现，而不是通过援助那个特立独行的政权。然而，在美国保守意识形态下，美国有一个非常重要的目标是遏制共产主义。这可以通过援助对抗共产主义的盟友来实现，而不是通过在非共产主义者之间挑起军事冲突。因此，POLITICS\
  \ 选择 `SMILITARY-AID` 作为第二种情况的恰当脚本。下方的上下文切换规则用于做出此决策。\n\n设 X 为一个小国，Y 为一个大国。\n\n```\n\
  CONTEXT-RULE# 13\n IF Y 将武装部队移动到 X 附近或内部\n AND X 参与军事冲突并需要\n \n AND 让 X 赢得冲突有助于\
  \ Y 实现\n其目标之一，\n THEN Y 将拥有军事援助 X 的目标。\nCONTEXT-RULE# 14\n IF Y 将武装部队移动到 X 附近或内部\n\
  \ AND 让 X 军事实力增强不能帮助\n Y 实现其目标之一\n AND 扩大政治控制是 Y 的一个\n 高级目标，\n THEN Y 具有对 X 进行军事夺取的目标。\n\
  ```\n\n如果一个脚本的规范性目标与事件中提到的某一个核心参与者的目标匹配，并且输入事件匹配其中一个关键脚本事件，则该脚本就会被激活。*关键事件*（key\
  \ event）可以是脚本初始序列中的事件，也可以是后期某个序列中的主要事件（在 Schank and Abelson, 1977 以及 Cullingford,\
  \ 1978 中被称为*场景的核心概念*）。因此，在捷克斯洛伐克的示例中，选择 `$INVADE` 是因为上下文规则 14 断言俄罗斯具有军事夺取的目标（`$INVADE`\
  \ 的规范性目标），而且向目标国家移动军队是 `INVADE` 初始场景中的一个事件。\n\n### 目标树：主观信念的编码\n\nPOLITICS 本质上是一个主观理解器；它通过使用其信念来聚焦并影响其理解过程，从而模拟政治意识形态。POLITICS\
  \ 中的政治意识形态由目标树集合表示。每棵目标树都编码了该意识形态所感知的政治参与者的动机。例如，在美国保守派意识形态下，苏联的目标树包含“世界主权”、“共产主义世界的领导权”、“强大的军力”等。在同种意识形态下，美国的目标树包含“遏制共产主义”、“保护自由企业”和“强大的军力”。同样，其他国家或国家集团也有其被政治意识形态所感知的目标。本质上，政治意识形态仅包含关于政治参与者动机的信息：他们的长期目标是什么，以及他们愿意使用的手段是什么。\n\
  \n政治参与者被意识形态感知的目标被表示为树，因为知道哪些目标是其他目标的手段、哪些目标对每个政治参与者在主观上更重要、以及哪些目标可能与其他目标不一致，是非常重要的。这些关系编码在树节点之间的链接中（每个目标都是目标树中的一个节点）。每棵树的根节点是该政治参与者最重要的目标。我们允许子目标成为多个更高级目标的手段，因此从数学上讲说，我们的目标树实际上是有向无环图。同样，在图中许多不同目标之间可能存在相对重要性的关系。\n\
  \n目标树规定了每个参与者哪些目标是激活的。之前的章节已经表明，在应用时，目标有助于确定哪些上下文是相关的。\n\n\n\n为了说明阻塞性反计划机制，让我们考虑一个简单的例子。狱犯\
  \ X 想要阻止囚犯 Y 逃跑。因此，“G(Y)”的状态为“Y 在监狱外自由”。我们从顶部进入图 11.5。守卫知道囚犯的逃跑计划吗？让我们假设他不知道。他的下一步是确定囚犯可能已经制定了什么计划。这种计划的确定本身可能涉及一些规划：守卫是否应该询问囚犯？是否应该威胁他？（关于社会规划单元的讨论，参见\
  \ Schank and Abelson, 1977）。让我们再次假设守卫失败了。此时，我们进入图 11.5 中的第三个框。守卫可以问自己：“如果我是为了逃跑，我会怎么做？”如果他发现了一个合理的计划，他可能会假设这就是囚犯的计划，然后应用阻塞性反计划策略来阻止该计划。例如，守卫可能会发现偷窃钥匙是一个合理的计划，在这种情况下，他可以应用`violate-necessary-precondition`策略（后文将讨论）得出结论：他应该让钥匙远离囚犯。\n\
  \n如果没有出现任何计划，守卫唯一的选择就是采取一般的预防措施（即应用互斥策略），例如用枪指向囚犯，并告诉他要么留在此地，要么就会死。因此，逃跑和生存在囚犯的脑海中变成了互斥状态。\n\
  \n反计划算法中存在退出条件。例如，如果囚犯的计划是炸掉监狱（并且他有手段），守卫可能会决定被炸掉的风险比挫败囚犯的目标成本更高。同样，如果他必须在整个刑期内一直用枪对着囚犯，守卫可能会决定这比让囚犯逃跑成本更高。反计划中的成本衡量标准在\
  \ (Carbonell, 1979b) 中进行了简要讨论。\n\n图 11.6 是构造性反计划的控制流。让我们从囚犯的角度考虑相同的情况。我们进入图 11.6\
  \ 中的第一个框：囚犯的逃跑目标是否被守卫直接阻挡了？如果是这样，囚犯唯一的退路就是针对守卫的行为采取阻塞性反计划。例如，如果守卫正用枪指着他的头，囚犯在制定任何具体的逃跑计划之前必须解决这个问题。\n\
  \n![](img/fig11_6_B.jpg)\n\n图 11.6 反计划过程——构造性阶段。\n\n如果他的目标没有被互斥状态直接阻挡，囚犯就可以处理逃跑问题。如果他能够制定一个可行的计划且守卫没有反计划，囚犯就成功了。否则，他必须应对守卫的阻塞性反计划。首先，囚犯可以分析守卫反计划的原因。例如，如果原因是守卫需要工作来赚钱，囚犯可以尝试贿赂守卫（这实际上是一种互利策略，有效地与守卫形成了临时联盟）。如果他发现了守卫追求的更重要的目标，并且他能够威胁这个目标，守卫可能会转移其反计划的努力。例如，囚犯可以说服守卫（无论真假）他即将炸掉监狱，从而诱导守卫通过逃跑来追求生存这一更高层次的目标。\n\
  \n最后，囚犯可能会追求一套不同的反计划策略。这些策略取决于他对守卫对其进行反计划方法的分析。例如，守卫可能在阻挡某个先决条件（例如，让钥匙远离囚犯），或者在限制关键资源（如时间、材料或外部援助）。对于尝试克服每种类型的阻塞动作都有相应的启发式策略。构造性反计划也有基于放弃或继续努力的相对成本的退出条件。\n\
  \n## 政治的详细视图\n\n### 字典预期\n\nPOLITICS 使用的第一个知识源是它的字典。由于最初的语言分析阶段模仿了 Riesbeck 的 ELI\
  \ 系统（Riesbeck and Schank, 1976 和 Riesbeck, 1975），我们的单词定义与 ELI 字典条目非常相似。主要区别在于，POLITICS\
  \ 的字典条目包含领域特定知识，使得语言分析更加健壮，但通用性较差。\n\n每个字典条目由给定单词的一组可能的词义组成。每个单词都是一个预期规则，其条件侧是语法、语义和上下文测试的交集。右侧是对该词义含义的断言，加上对额外预期规则的激活。这些规则的功能从将新词的含义与已建立的概念结构连接，到可能触发脚本以及对哪些目标可能是激活的假设。\n\
  \n基于预期的语言分析是一种成熟且成功的技术。在这里，我们仅通过示例说明了 POLITICS 中使用的预期规则所编码的部分知识。更多详细的阐述和讨论请参考 Riesbeck\
  \ (1975)、Gershman (1979) 以及 Birnbaum and Selfridge (1979)。\n\n下图对应于“vote”（投票）单词字典条目的的一部分：\n\
  \n```\n VOTE part-of-speech: (VERB NOUN)\n vote1: IF feature(focus) = LEGISLATIVE\n\
  \ and type(object) = STATECHANGE\n and feature(recipient) = HIGHERANIMATE\n and\
  \ feature(!context) = GOVERNMENT\n and main concept buffer is empty\n THEN assert\
  \ (!AUTH)\n also add request makereq(!AUTH)\n also add request\n IF nextword is\
  \ member of (FOR TO)\n THEN set object to the meaning of\n the next noun phrase\n\
  \ vote2: IF feature(focus) = (#HUMAN number (1))\n and…\n THEN…\n .\n .\n .\n```\n\
  \n单词 `vote` 可以有多种含义，每种含义都对应字典条目中的一个词义（`vote1`、`vote2`...）。`vote1` 指的是在其选民拥有政治权威的立法机构做出的决议（例如，“国会投票通过了全民医疗保险”）。其他词义还包括个人在投票站表达他的偏好（例如，“约翰给卡特投了票”）。区分这两种可能性非常重要，因为\
  \ `vote1` 的后续结果是以下推理：被投票的事项通过投票成为法律。对于 `vote2` 则没有类似的推理。社会行为 `!AUTH` 编码了 `vote1`\
  \ 以及类似的社会授权、法令等，并触发了相应的后续推理。（Schank and Carbonell, 1979 详细描述了如 `!AUTH` 等社会行为。）\n\
  \n“IF”子句中的测试交集决定了词义。“THEN”子句中的动作断言了词义含义，并添加了新的请求（形式与上述字典条目相同的规则）。`makereq()`过程分析内存结构（例如示例中由\
  \ `!AUTH` 键的信息）以生成进一步的请求。例如，`!AUTH` 期望看到记录，如某法案。如果“bill”一词出现在句子的后面，这种预期将消除其歧义。\n\
  \n基于预期的技术是灵活的，因为来自不同来源的信息（例如，单词定义、语法、内存结构、脚本）可以以相同的方式编码，并无需考虑其来源地统一应用。\n\n### 目标分析规则\n\
  \n\n\n\n\n下所示的目标分析规则用于决定执行者目标树中的哪一个目标将决定其未来的行为。其原理简单：在其目标树中，能够受当前情况影响的最重要目标就是他将要追求的目标。由于目标树是偏序关系，并不总是能确定一组目标中的某一个比其他目标更重要。在这种情况下，可能会多个目标决定执行者的未来行为；`POLITICS`\
  \ 将假设执行者正同时追求所有最高优先级的目标。\n\n| `GOAL-RULE# 1`: | 如果可以通过特定的行动方案实现对目标的进展，则应该追求该行动方案。\
  \ |\n\n| `GOAL-RULE#2`: | 如果一种可能的行动方案违反了某个目标，则应积极避免该方案。 |\n\n| `GOAL-RULE#3`: |\
  \ 如果一种可能的行动方案与目标树没有关联，则不应将其纳入考虑范围。 |\n\n| `GOAL-RULE#4`: | 如果某项行动方案影响了两个目标，且没有其他规则决定应该关注哪一个目标，则对较高重要目标的影响将决定是否应该追求该行动方案。\
  \ |\n\n| `GOAL-RULE#5`: | 目标树中的相对重要性链接具有传递性。 |\n\n| `GOAL-RULE#6`: | 相对重要性在子目标链接之间具有传递性。\
  \ |\n\n*   如果目标 `A` 没有目标 `B` 的某个子目标重要，那么意味着目标 `A` 也没有目标 `B` 重要。\n*   如果目标 `A` 没有目标\
  \ `B` 重要，那么目标 `A` 的每个子目标也都没有目标 `B` 重要。\n\n为了说明 `POLITICS` 中的目标树及其应用，请考虑在 `POLITICS`\
  \ 中实现的针对苏联的美国保守派目标树，以及针对美国的美国自由派目标树。保守派意识形态的发展得稍为完善，因此其目标树在这里更详细一些。在图 11.7 和 11.8\
  \ 中，实线表示子目标链接，虚线表示相对重要性链接。\n\n![](img/fig11_7_B.jpg)\n\n图 11.7 美国保守派意识形态下的苏联目标树。\n\
  \n![](img/fig11_8_B.jpg)\n\n图 11.8 美国自由派意识形态下的美国目标树。\n\n### 目标分析示例\n\n现在让我们目标树、目标激活规则、上下文切换规则和脚本信息与一个带注释的\
  \ `POLITICS` 运行结合起来。下面的示例是对之前从美国保守派观点讨论的捷克斯洛伐克事件的美国自由派解释。`POLITICS` 执行的第一件事是整合意识形态目标树。然后它解释事件并回答相关问题。下面的示例省略了语言分析和脚本应用任务的细节，以突出目标驱动的推理。\n\
  \n```\n************************************************************\nStart of POLITICS\
  \ interpretation and QA dialog.\n************************************************************\n\
  \ PTYCON LOG FILE 2-Mar-78 12:15:36\nPTYCON> CONNECT (TO SUBJOB) 1\n[CONNECTED TO\
  \ SUBJOB POL(l)]\n```\n\n| 计算机运行 | 注释 |\n| --- | --- |\n| `(INTERPRET US-LIBERAL)INCORPORATING\
  \ US-LIBERALIDEOLOGY GOAL TREES …` | |\n| `TOP GOAL: US-WORLDPEACE.INITIALIZING\
  \ PARSER … DONE.` | |\n| `INPUT STORY: +俄罗斯在捷克边境集结了部队.` | |\n| `PARSING … COMPLETED.SPECIFICATION\
  \ PHASE STARTED …` | 我们跳过了 `POLITICS` 解释的解析和初始脚本应用阶段。 |\n| `..........` | 哪些脚本需要集中军事力量？`POLITICS`\
  \ 了解军事援助、对抗和入侵。军事援助被拒绝，是因为捷克斯洛伐克没有接收援助的目标。对抗被拒绝，是因为小国（例如捷克斯洛伐克）对世界大国（例如，俄罗斯）不构成军事威胁。上下文切换规则#\
  \ 13 选择了 |\n| `INSTANTIATING SINVADE SCRIPT.` | `SINVADE` 作为唯一候选者。 |\n| `GOAL DETERMINATIONPHASE\
  \ STARTED…` | |\n| `*CZECHOSLOVAKIA* GOAL G39THREATENED` | `G39` = 与邻国保持和平。 |\n\
  | `*RUSSIA* GOAL G29 THREATENED` | `G29` = 避免武装冲突，俄罗斯维护和平目标的子目标。 |\n| `*RUSSIA*\
  \ GOAL G27 ACTIVATED` | `G27` = 增加对小国家的政治影响力。 |\n| `INTERNAL CONFLICT (G103 G29)G103\
  \ REJECTED…TRY NEW TRACK OR NEW SCRIPT.` | `G103` = 获取被入侵国家军事控制的目标。`G103` 是 `SINVADE`\
  \ 的默认脚本目标。 |\n\n根据美国自由派意识形态，俄罗斯的目标树有一个和平目标（`G29`）。然而，这个目标与军事接管目标（`G103`）冲突，后者与 `INVADE`\
  \ 脚本相关。由于任何不在国家目标树中的目标（即脚本目标）都会自动判定为比国家目标树中的所有目标都不重要，`POLITICS` 通过放弃 `G103` 并追求更高的目标\
  \ `G29` 来解决冲突。（参见 `GOAL-RULE`）。\n\n\n\n\n\n对上述事件的美国自由派解释说明，不仅建议的美国政策与前述的美国保守派解释所建议的政策不同，对俄罗斯行动的实际含义的解释也不同。保守派意识形态将俄罗斯军队集结解释为迫在眉睫的入侵，其依据是俄罗斯对控制小国家的欲望比对避免军事冲突的欲望更强烈。而自由派则将同样的行动视为一种可能不会实施的威胁。这是基于自由派意识形态下俄罗斯目标树中目标的相对重要性排序。\n\
  \n## 反制计划策略的结构\n\n政治学（POLITICS）中一些最有趣的推论并非来自对某个行动者为何做某事的解释，而是来自对当两个行动者的目标发生冲突时将发生什么的预测。预测个体行动者在冲突情况下会做什么是制计划模块的任务。\n\
  \n我们的反制计划模型本质上是一个以目标为导向的规则系统。每个策略都是规则，用于测试两个行动者之间的目标冲突状态、每个行动者的目标树以及他们正在执行的计划。如果规则测试为真，规则的动作部分建议了一种可能成功的反制计划方法。规则的动作部分可能包含额外的条件或完善。反制计划策略的结构所示：\n\
  \n```\n STRATEGY rule#k title\n TRIGGER test1 AND test2 AND… testn\n IF testn+1\
  \ AND testn+2 AND…\n THEN actionl, action2,… *\n REFINEMENT subrule#k1, subrule#k2,…\n\
  ```\n\n每个规则的测试部分分为“触发（TRIGGER）”句和一个额外的“如果（IF）”句。为了使规则生效，这两个句在反制计划情况下都必须为真。我们这样划分测试句是为了缩短过程模型搜索适用策略所需的时间。所有触发条件都是“廉价”的测试；它们可以直接应用于现状，而不需要进一步的推理或复杂的匹配。这些触发条件被编译成一个判别网络。这种组织允许添加新策略，而不会导致测试所有适用反制计划策略所需的搜索时间呈线性增长。\n\
  \n一旦满足了规则的触发条件，就会执行额外的“IF”测试。这些测试可能任意复杂，或许需要进一步的推理并调用其他的反制计划策略。然而，触发条件通常会在任何给定情况下将适用的反制计划策略范围缩小到少数（通常为三个或四个）。此外，反制计划策略反映了关于如何处理不利情况的常识推理。因此，每个策略都足够通用，可以适用于许多合理的人类冲突类型。这意味着与规则总数以及特定特定脚本中包含的信息相比，反制计划策略的总数相对较少。我们发现，大约四十种反制计划策略就足以模拟我们考虑过的情况和目标冲突中的反制行动。\n\
  \n每个策略的动作部分（在“THEN”之前）是由其中一个行动者在当前背景下应用的系列反制计划方法。如果应用了某个策略，在执行动作序列时会检查“完善（refinement）”字段。完善包含一个或多个额外的规则，通常为反制计划情况提供更多细节。这些规则是反制计划策略的子规则，因为它们只有在策略的所有测试均为真且每个子规则的测试句也为真的情况下才会被调用。我们的策略在结构上更接近专家系统（如\
  \ `MYCIN` (Shortliffe, 1976) 和 `PECOS` (Barstow, 1979)）中的规则，而不是更受限的生产系统（如 `PSG`\
  \ 系统 (Newell, 1973)）中的规则。\n\n## 转移性反制计划策略\n\n让我们转向适用于互斥目标冲突的一些更具体的反制计划策略。经常遇到的一组策略基于以下原理：转移对手在目标冲突中的精力，使其远离直接追求其目标。转移策略本质上有三类，都依赖这样一个事实：如果行动者必须将精力转移到其他事务上，他完成原始任务的可能性就会降低。我们将转移策略分为下面列出的三个类别：\n\
  \n### 转移性策略\n\n1. 威胁对手更高层级的目标。\n2. 精力分散：威胁对手的其他目标。\n3. 欺骗：让对手认为其他目标受到威胁。\n\n让我们来看一个重要的转移策略及其欺骗选项。说服对手某个反制计划策略的动作已经执行，但事实并非如此的过程，被称为该策略的`欺骗选项（deceptive\
  \ option）`。\n\n```\n STRATEGY 1: THREATEN HIGHER-LEVEL GOAL\n TRIGGER Mutual-exclusion\
  \ goal-conflict situation\nbetween G(Y) and G(X).\n IF X can find a goal G’(Y) to\
  \ block, where\n G’(Y) is a goal of higher importance to\n Y than G(Y),\n THEN X\
  \ should try to block G’(Y). X can expect\n Y to pursue G’(Y) and abandon G(Y).\n\
  \ REFINEMENT X should choose G’(Y) such that:\n 1) Y cannot pursue both G’(Y) and\
  \ G(Y)\nsimultaneously, or\n 2) Y can accomplish G’(Y) only if the\n blocking action\
  \ is abandoned.\n```\n\n`策略 1`意味着在互斥目标冲突情况下，一个行动者（X）可能会威胁另一个行动者（Y）的更高层级目标，以使 Y 转移精力保护该高层级目标。由于行动者的注意力、时间和资源是有限的，Y\
  \ 可能无法在保护其高层级目标的同时追求与 X 冲突的目标。因此，X 将更有可能赢得冲突并实现自己的目标。规则的`完善（refinement）`部分为帮助 X\
  \ 选择威胁 Y 的哪些更重要目标提供了建议。X 通过检查 Y 的目标树可以知道 Y 可能认为哪些目标更重要。（我们的主观信念模型假设各种行动者彼此了解对方的主要动机。）X\
  \ 应该威胁一个需要 Y 全注注意时间和资源才能保护的目标。或者，X 可以威胁一个 Y 无法保护的重要目标。这给了 X 一个谈判筹码，告诉 Y 只有在 Y 放弃与\
  \ X 冲突的（假设是不重要的）目标时才会停止威胁。\n\n`策略 1` 的欺骗版本基于相同的转移对手注意力的原理。然而，使用的方法不需要与现实相关。因此，预计欺骗策略成功的概率较低。\n\
  \n```\n STRATEGY 2: DECEPTION: FALSE THREAT\n Same as strategy 1 but either\n1)\
  \ X only appears to threaten the higher\n level goal G(Y), or\n2) X threatens to\
  \ block G’(Y) but has\nfalsely convinced Y that G’(Y) should\n be one of Y’s high-level\
  \ goals.\n```\n\n\n\n\n还有其他分逸策略（列在 Carbonell, 1979a 中），它们都遵循一个共同原则：行动者无法通过同时追求多条行动路径来过度消耗其注意力和资源。将这一简单原理应用于其他行动者（以及反计划者）的意识，指导了我们对分逸性反计划策略的制定。每种策略都基于一种不同的方法，使行动者在特定时刻担心比一个更多的目标。行动者一次\
  \ le 能集中注意力的不同项目存在各种限制。我们根据以下类别对同时追求多条行动路径的限制进行分类：\n\n1. 对可用时间的限制。\n2. 对可同时执行动作数量的心理和生理限制。\n\
  3. 对物质资源的限制。\n4. 对能力的限制。\n5. 避免自身行为某些后果的目标。\n6. 不同行动路径之间的相互作用。\n\n### 针对被阻塞先决条件的反计划\n\
  \n为了成功执行一个计划，通常需要满足某些先决条件。Schank and Abelson (1977) 将先决条件分为三类：可控制的、不可控制的和介导的。例如，如果约翰的计划是问玛丽银行在哪里，则必须满足以下先决条件：1)\
  \ 约翰必须与玛丽建立通信链接，例如打电话或在物理上接近；2) 玛丽必须知道银行在哪里；3) 玛丽愿意将此信息告诉约翰。\n\n第一个先决条件是可控制的先决条件，因为我们假设约翰可以随心实现它。第二个是不可控制的先决条件；约翰无法通过自己的任何行动来实现这一条件。第三个先决条件是介导的先决条件。介导意味着计划者可以尝试促成条件的实现，但最终结果取决于另一方的行动。例如，约翰可以使用说服策略来说服玛丽，让她应该告诉他银行在哪里，但不能保证约翰会成功。除了说服，还有其他方法可以绕过被阻塞的介导先决条件。这些列在下面的策略中。（关于其他类型违反先决条件的策略在\
  \ Carbonell, 1979a 和 1979b 中讨论。`P/G(X)` 表示 `X` 为追求其目标 `G(X)` 而选择的计划。）\n\n```\n STRATEGY\
  \ 3: 解除介导性先决条件的阻塞\n 如果 Y 正在阻塞 P/G(X) 的介导先决条件\n 则 X 应该从以下选项中选择成本最低的方案：\n 1) 建立目标\
  \ G1(X) = 通过独立于 Y 行动的手段\n 达成介导先决条件。\n 暂停 P/G(X) 直到实现 G1(X)。\n 2) 选择新计划 P’，使得 P’/G(X)\n\
  \ 不需要这个介导\n先决条件。\n 3) 设置互斥目标冲突 G(X) = “Y 没有阻塞\n P/G(X) 的介导先决条件。”\n 调用互斥\n反计划策略。\n\
  ```\n\n在分析下一个 POLITICS 示例时，我们将看到这一策略如何与其他四个反计划策略结合使用。然而，我们首先必须考虑应用反计划策略中的一个关键问题。\n\
  \n### 预测性推理与解释性推理\n\nPOLITICS 在合理化（即解释为什么发生某事）方面比在准确预测将发生什么方面做得更好。它的事后之明优于预见，但遗憾的是它并不总是适用。本节讨论了为什么这种被称为\
  \ `interpretive reasoning` 的弱计划形式优于 `predictive reasoning`。\n\n在生成假设情景的任务中，只能以预测的方式使用反计划策略。然而，在故事理解任务中，反计划策略被用来解释行动者的行为。在这些情况下，以解释性的方式应用策略更好。为了理解我们的意思，请考虑以下事件：\n\
  \n> 美国在 1973 年的中东战争中支持了以色列。随后，阿拉伯人对美国及其盟友实施了石油禁运。\n\n* 为什么阿拉伯人要实施石油禁运？\n\n策略 1（威胁更高层次的目标）可以用于预测性框架，也可以以解释性的方式使用。在理解上述事件时，我们需要提出并回答问题：“阿拉伯人为什么要实施石油禁运？”利用有关阿拉伯人目标以及美国帮助以色列的目标的知识，理解者可以建立阿拉伯人与美国之间的目标冲突。互斥目标冲突存在于美国援助以色列的目标与阿拉伯人阻止美国援助以色列的目标之间。\n\
  \n对目前的情况进行解释后，理解者可以以两种不同的方式进行。第一种方式是预测所有可能的阿拉伯反计划行动，以使美国停止援助以色列。如果在解释事件的剩余部分时，理解者将某个动作与之前预测的任何一个反计划行动匹配，那么理解者就可以得出结论：阿拉伯人确实对美国进行了反计划，而他们的反计划就是预测的行动路径。这样的过程需要理解者生成大量的假设，并随后测试每个假设作为对情况的可能解释。没有证据表明人们会在特定的解释中生成所有可能的推理路径，以丢弃除符合现实的一条路径以外的所有路径。看来人们只追求少数几个相关的推理路径更为合理。因此，生成所有可能的行动计划并不是人类思维的合理心理模型，它也没有为系统在生成和测试阿拉伯人所有可能的替代行动方面可能所需的计算时间提供合理的限制。\n\
  \n与“生成并测试”过程相比更合理的替代方案是：鉴于互斥目标冲突的存在，我们可以预测这两个行动者可能会相互进行反计划。此时不再产生进一步的预测推理。事件的其余部分应该根据这两个行动者可能通过反计划来解决其目标冲突的预期来解释。\n\
  \n当理解者获知阿拉伯石油禁运行时，他试图看这是否是针对美国援助以色列目标的反计划的合理行动。反计划策略 1（细化 2）匹配了阿拉伯计划与美国目标之间的交互类型。阿拉伯人通过切断石油供应来威胁更高层次的美国生存目标，而美国无法采取任何行动来直接改善局面。现在阿拉伯人可以通过谈判结束禁运，以换取美国停止对以色列的援助。因此，理解者可以通过以解释性的方式应用策略\
  \ 1 来建立阿拉伯的反计划行动。阿拉伯行动的结果与策略的动作部分相匹配。这种匹配基于我们之前对反计划行动很可能的预期，允许理解者能够推断出阿拉伯人正在调用反计划策略\
  \ 1。因此，我们可以说阿拉伯行动的原因是由策略的测试语句指定的。这种预测通用框架并随后实例化其组成部分的通用解释性技术，已成功应用于其他 AI 系统，如 SAM\
  \ (Cullingford, 1978) 和 HEARSAY-II (Hayes-Roth et al., 1978)。\n\n### 反计划执行中的示例\n\
  \n\n\n\n\n在 `POLITICS` 解释的大多数冲突事件中，许多不同的反计划策略可能适用于活动目标、目标冲突和计划干扰。正是各种策略之间的交互以及它们在不同场景中的应用，使得\
  \ `POLITICS` 成为测试我们关于主观导向推理假设的有趣工具。为了说明策略之间的交互，我们现在考虑 `POLITICS` 如何解释一个关于安哥拉内战的事件。策略\
  \ 3（之前讨论过的）在理解该事件并建议适当的美国保守派政策的过程中，与其他四个反计划策略相互作用。首先，我们介绍额外的策略（在 Carbonell, 1979a\
  \ 中进行了详细讨论）：\n\n```\n STRATEGY 4: 外部强加的冲突\n 触发 P/G(X) 和 P/G(Y) 之间的计划冲突。\n 如果 计划冲突是由\
  \ Z（一个外部机构）引起的，\n 则 X 具有以下替代方案：\n 1) 放弃 P/G(X)。\n 2) 与 Z 谈判以结束计划冲突。\n 3) 直接针对 P/G(Y)\
  \ 制定反计划，\n 而诉助于谈判策略。\n 4) 针对 Z 实施计划冲突所使用的计划\n 制定反计划。\n 完善 如果 G(X) 和 G(Y) 匹配，则 X\
  \ 应该\n 在替代方案 2 和 4 上与 Y 联手对抗 Z。\nSTRATEGY 5: 多目标策略\n 触发 P/G(X) 和 P/G(Y) 之间的计划冲突。\n\
  \ 如果 Y 的计划可以满足多个一个高\n 级目标，\n 则 X 应该：\n 1) 放弃任何目的是说服 Y 改变其计划\n 或其他做出妥协的策略，除非所有其他策略都失败。\n\
  \ 2) 预期 Y 在追求 P/G(Y) 上投入的精力比比常预期的更多。\nSTRATEGY 6: 目标阻碍选项\n 触发 P/G(X) 和 P/G(Y) 之间的计划冲突，\n\
  \ 其中 X 无法直接阻塞 P/G(Y)。\n 如果 X 无法轻易追求不同的 P’/G(X)，\n 则 X 应该制定反计划使 Y 放弃\n G(Y)。（因此，Y\
  \ 没有理由继续\n 追求 P/G(Y)。）\nSTRATEGY 6: 优先关注最重要目标\n 如果 Y 正在追求多个 X 想\n 阻塞的目标，\n 则 X 应该根据对\
  \ Y 的重要性对这些 目标进行排序，并优先阻塞\n 最重要的 G(Y)。（因此，X 在\n 谈判谈判或对抗情况下对 Y 拥有\n 最大的杠码。）\n```\n\
  \n在接下来的示例中，我们省略了处理细节，将注意力集中在对五个反计划规则如何协作的讨论上。\n\n> *(解释美国保守派观点)*\n\n> 输入故事：古巴派遣军队援助安哥拉的安哥拉解放人民运动（MPLA）派。\n\
  > > 问题 1：古巴为什么要向安哥拉派遣军队？\n> > 回答 1: 因为俄罗斯可能告诉古巴派遣军队，而古巴希望国家成为共产主义国家。\n> > 问题 2:\
  \ 美国对此应该怎么办？\n> > 回答 2: 美国应该让俄罗斯撤出古巴军队。\n\n为了解释这一事件，`POLITICS` 使用了军事援助脚本、关于安哥拉冲突的信息以及美国目标树。推断出以下计划干扰场景：美国本应该计划为非共产主义派的全国解放联盟（UNITA）赢得军事胜利。（美国希望\
  \ UNITA 控制安哥拉的目标已经通过对之前事件的解释存在 `POLITICS` 的内存中。）古巴的军事援助计划了美国计划的一个中介前提，即 UNITA 必须比\
  \ MPLA 强。因此，美国和古巴之间存在计划冲突状况。该中介前提触发了反计划策略 3，作为未来美国行动的可能解释。在建立古巴计划如何与古巴目标树相互作用时，`POLITICS`\
  \ 发现古巴可能在服务两个目标：共产主义的传播，以及作为追求苏联目标的机构。后者是古巴获得苏联援助的子目标，而这反过来又是所有古巴保全目标的子目标。古巴生存需要苏联援助。在理解了这些之后，`POLITICS`\
  \ 以解释模式工作，并对其对该事件的解释表示满意。如果事件中提到了更多行动，它们将根据计划冲突可能产生的预期反计划进行解释。\n\n问题 2 迫使 `POLITICS`\
  \ 以预测模式运行，即从美国的角度生成一个合理的反计划。由于古巴的计划服务于多个目标，策略 5 限制了 `POLITICS` 尝试与古巴直接谈判，除非是最后的手段。策略\
  \ 3 生成了三个可能的反计划：重新建立中介前提（即让 UNITA 变得强大）、选择一个新计划来实现美国目标（即让 UNITA 控制安哥拉）、或阻塞古巴的计划（即召回古巴军队）。根据以往的经验，反计划策略中最佳的替代方案被放在前面。在预测模式下，`POLITICS`\
  \ 处理每个替代方案，直到找到一种符合美国目标的行动方案。增强一个国家或政治派别的势力是军事援助脚本的目标。\n\n`POLITICS` 检查建议的行动计划的前提。正如之前讨论的，有不同类型的前提有助于关注反计划过程。美国方面军事援助的一个中介前提是国会批准。这一前提无法满足，因为有一个情境规定国会否决任何让美国卷入战争的行动。因此，放弃了这种反计划替代方案；另一个（生成新计划）也失败了；最后尝试第三种方案。\n\
  \n`POLITICS` 如何制定反计划来阻止古巴的增兵？策略 5 指出，由于古巴计划是多用途的，古巴不太可能妥协或谈判。由于没有针对古巴计划的反计划策略，因此调用了策略\
  \ 6。策略 6 建议针对古巴的目标制定反计划。这通过策略 7 进一步完善为针对古巴最重要的目标制定反计划。苏联代理目标被判断更为重要，因为它是古巴最高级保全目标的必要子目标。因此，`POLITICS`\
  \ 决定美国应该制定反计划阻止古巴作为苏联代理的目标。此时触发了策略 4（苏联被认为是美古冲突的外部原因），`POLITICS` 生成了策略 4 应用作为第二个问题的答案。也就是说，`POLITICS`\
  \ 建议将美国的反计划努力重点放在苏联，以消除古巴增兵的最主要原因。\n\n## Politics 系统的注释示例\n\n本节展示了 `POLITICS` 系统的详细注释运行。核心主题是集成集成理解范式中的不同知识源之间的协作。基本上，拥有足够数据执行其功能的知识源是在处理的每个步骤中被应用的。\n\
  \n### 详细的美国保守派解释\n\n`POLITICS` 在开始事件解释过程之前必须结合一种意识形态，而这一过程又必须在回答问题之前完成。`POLITICS`\
  \ 首先将美国保守派目标树读入内存中。\n\n\n\n\n每个目标或是维持目标（`P-goal`）或成就目标（`A-goal`）。`P-goals` 是必须维持的世界现有状态，而\
  \ `A-goals` 是对世界现状的预期改变。如果一个 `P-goal` 被事件违反，则该目标将被一个 `A-goal` 替换，以重新实现被违反的状态。美国遏制共产主义保守目标及其增加美国军力的子目标编码如下：\n\
  \n```\n (GOAL PART (*US*)\n GOALSTATE\n ((ACTOR (#POLITY GOVTYP (*COMMUNIST*))\n\
  \ IS (*PCONT* VAL (0))\n OBJECT (#GROUP NUMBER (*INDEF*)\n MEMBER (# POLITY\n GOVTYP\
  \ (*COMMUNIST*\n  MODE\n  (NEG))))))\n TOK G0\n GOALTYPE *PGOAL*\n SUPERGOALS (NIL)\n\
  \ SUBGOALS (G1 G4 G5)\n GREATER-IMPORTANCE (NIL)\n LESSER-IMPORTANCE (G2 G3)]\n\
  [GOAL PART (*US*)\n GOALSTATE\n ((ACTOR (*US*)\n TOWARD (*STRENGTH*\n TYPE (*MILIT*)\n\
  \ INC (*POSVAL*)\n VAL (*SPEC* GREATER\n (*STRENGTH* PART (*RUSSIA*)\n TYPE\n (*MILIT*))))))\n\
  \ TOK G1\n GOALTYPE *AGOAL*\n SUPERGOALS (G0)\n SUBGOALS (G8 G9)\n GREATER-IMPORTANCE\
  \ (NIL)\n LESSER-IMPORTANCE (G12 G19)]\n```\n\n意识形态中的每个目标都编码了预期的目标状态或状态转换及其与意识形态中其他目标的关系。上述第一个目标是美国的保守目标遏制共产主义。我们可以将该目标状态解读为：“美国希望所有非共产主义国家不受共产主义的统治。”由于遏制共产主义是美国最重要的目标，因此它不是其他目标的子目标（即它没有“上级目标”），它也没有更重要的目标。然而，遏制共产主义有子目标，例如军力（目标\
  \ `G1`）。在美国保守派目标树中还有其他不那么重要的目标（目标 `G2` 和 `G3`）。例如，目标 `G2` 是对美国自由企业的维持。\n\n军力目标状态解读为：“美国应该增加其军力，使其超过俄罗斯军力。”该目标与美国保守派目标树中其他目标的关系通过子目标、上级目标、更重要和较重要链接定义。\n\
  \n### 初始解释阶段\n\n```\n************************************************************\n\
  开始美国保守派 POLITICS 解释。\n************************************************************\n\
  \      PTYCON LOG FILE 1-Mar-78 2:44:20\nPTYCON> CONNECT (TO SUBJOB) 1\n[CONNECTED\
  \ TO SUBJOB POL(l)]\n```\n\n| 计算机处理 | 注释 |\n| --- | --- |\n| `(INTERPRET US-CONSERVATIVE)INCORPORATING\
  \ US-CONSERVATIVEIDEOLOGY GOAL TREES…INITIATING PARSER … DONE` | 在处理任何事件之前，`POLITICS`\
  \ 整合编码政治意识形态的目标树。 |\n| `INPUT STORY: The United States Congress voted to fund the\
  \ Trident submarine project.` | 输入事件以英文键入并输入到 `POLITICS` 解析器。`POLITICS` 中的解析是集成内存过程的一部分。关于投票和资助的推理发生在“解析”期间。\
  \ |\n| `PARSING… …` | 在解析“美国国会投票资助……”之后，发生了以下推理： |\n| `MEMORY ASSERTS SFUNDPRIMARY\
  \ ACTION. (SFUND) INSTR (SPARLIAMENT-PROC) INSTR (SVOTE) EMBEDDED (*ATRANS*) ...`\
  \ | 投票作为 `SPARUAMENTARY-PROC` 的一部分，并不有趣，因为国会总是这样做。然而，`SFUND` 是有趣的，涉及资金的 `ATRANS`。\
  \ |\n| `((ACTOR (#ORG TYPE (*GOVT*) NAME (CONGRESS) PART (*US’) REF (DEF) TOK ORGO)\
  \ < = > (*ATRANS*)OBJECT (‘MONEY* AMOUNT (SUFF)) TO (#ORG INVOLVING (# WEAPON TYPE\
  \ (*SUBMARINE*) NAME (TRIDENT))))` | （见下文逻辑） |\n\n\n\n\n\n| 解释完成，准备好提问。 | 由于未检测到活跃的目标冲突，`POLITICS`\
  \ 不会触发反向规划。 |\n\n目标导向的推理过程可能从两个知识来源触发。第一个来源是语境知识，编码为脚本（scripts）。例如，在 `SFUND` 中，`FENDER`（出资者）将钱交给\
  \ `FUNDEE`（受资者），意图是让 `FUNDEE` 实现 `FENDER` 心中的。。这个在我们完整的世界知识中通常是定义良好的，但从“三链鱼潜艇事件”的语言实现来说，它的定义非常模糊。输入事件并没有提到将建造潜艇，也没有提到为什么国会可能想要这些潜艇……。建造潜艇是美国军方的一个目标，`POLITICS`\
  \ 根据关于为何资助项目以及为何建造潜艇的知识推断出了这一事实。该目标对于美国国会的最终目的至关重要。也就是说，脚本告诉我们国会*如何*意图让三链鱼潜艇出现，而不是国会*为什么*选择这样做。引导国会行动的目标是从美国的意识形态目标树中推断出来的。因此，语境知识和意识形态知识对于建模一个人对政治事件的解释都是必要的。\n\
  \n### 问答阶段\n\n在解析过程中，问题被归分为不同的问题类型（Lehnert, 1978）。问题类型告诉我们所寻求信息的性质。使用判别网络（discrimination\
  \ network）来测试问题类型和问题主体，以确定在内存的何处搜索答案（如果在内存中未找到，则应用哪些进一步的推理或反向规划策略）。最后，执行内存搜索或应用建议的推理。下方问答对话中的前两个问题通过搜索对事件的解释来回答。第三个问题需要反向规划。\n\
  \n| *美国国会为此做了些什么？解析中……* | 解析和问题分类同时进行。“What for”（为了什么）被匹配为一个拆分习语，意味着对特定事件目的的请求。\
  \ |\n| 建议问题类型：GOAL-EVENT | |\n| 将 QSEARCH D-NET 应用于： | |\n| `((ACTOR ORGO < = >\
  \ (‘DO*))REL (‘SPEC*)TOK CON 15)…)` | |\n| 匹配到 CON 15 | |\n| 提取 (`*SELF*)` | |\n\
  | `($FUND & FUNDER ORG0& FUNDEE AF0` | `POLITICS` 发现国会资助事件是主事件，国会是行动执行者。 |\n| `&\
  \ FUND-CON CON9&MONEY MONEY0TOK SCR2)` | |\n| 提取（最后一个） | `CON 13` 是该资助事件的目的。 |\n\
  | `CON 13` | `CON 13` 是美国增加其武装力量军事力量的目标。 |\n| 答案是： | |\n| `((ACTOR (*US*) ISTOWARD(*POWER*TYPE\
  \ (*MILITARY*)VAL (N)INC (POS)))`` | |\n| `TOK CON 13)` | |\n| 美国国会希望美国军队变得更强大。\
  \ | 答案由基于模板的生成器用英文生成。 |\n| *美国为什么应该更强大？* | 下一个问题涉及对目标的搜索。 |\n| 解析中…… | |\n| `((ACTOR\
  \ (*US*) ISTOWARD (*POWER*TYPE (‘MILITARY*)VAL (N)INC (POS)))` | |\n| `TOK CON 16)`\
  \ | |\n| `CON 16 MATCHES CON 13CON 13 MATCHES G4` | `CON 16`（问题的含义）匹配了 `CON 13`，`CON\
  \ 13`是在理解阶段推断出的并识别为 `G4`——美国军事力量的目标。 |\n| 提取 G4 的超目标 (SUPERGOAL) G0 | |\n| `((ACTOR\
  \ (#POLITYTYPE (* COMMUNIST*))TOWARD(*CONTROL*TYPE (OR (*POLITICAL*)(*MILITARY*)(*ECONOMIC*))OBJECT\
  \ (#POLITY TYPE(*NONCOMMUNIST*))VAL (0))))` | |\n| 答案是：((CON CON13 ENABLE G0)) |\
  \ |\n| 美国军队应该足够强大以阻止共产主义扩张。 | 主导军事力量的目标是遏制共产主义。 |\n| *如果俄罗斯也建造核……潜艇，美国该怎么办？* | 第三个问题更有趣；答案在之前的事件解释中无法找到。需要反向规划。\
  \ |\n| 预期的假设场景 | 跟在单词“if”后面的动作查询暗示可能会有一个假设情况。 |\n| `((< = >($CONSTRUCTACTOR (*RUSSIA*)OBJECT\
  \ (#WEAPONTYPE (‘SUBMARINE*)TOK WEAPON 1))TIME ((AFTER NOW X))TOK CON 19)` | 这代表了问题中的“俄罗斯建造潜艇”的概念。\
  \ |\n| 中间结果推理。 | |\n| `((ACTOR (*RUSSIA*) ISTOWARD(*POWER*TYPE (‘MILITARY*)VAL (N)INC\
  \ (POS)))` | 通用推理得出俄罗斯将变得更强大。 |\n| `TOK CON20)` | |\n| 两个具有活跃目标的行动者 | |\n| 正在搜索目标冲突……\
  \ | `POLITICS` 发现美国军事比俄罗斯更强的目标与俄罗斯比美国更强的目标是互斥。 |\n| `(MUTUAL-EXCLUSION` | |\n| `(*US’.\
  \ G3)` | |\n| `(*RUSSIA*. G3)))` | |\n| `…` | |\n| `((< = >` | |\n| `$CONSTRUCTACTOR\
  \ (*RUSSIA*)OBJECT (# WEAPONTYPE (‘SUBMARINE*)NUMBER (*MANY*)TOK (2)))` | 反向规划通过提取得出……\
  \ |\n| `TIME ((AFTER NOW X))MODE (*INTENTIONAL*)TOK21)` | |\n| 美国应该建造更多潜艇。 | |\n\
  \n\n\n\n\nMcPOL 确实试图捕捉理解的三个阶段：对行为意图的自下而上的推理、将意图与执行者的目标层次进行自上而下的整合，以及最后，行为与其他执行者目标之间的交互。然而，McPOL\
  \ 是通过对输入事件的一次性理解来完成所有这些操作。在 `POLITICS` 中，许多推理只有在提问时才被触发。因此，McPOL 预测美国建造潜艇加强了美国的军事实力，这与俄罗斯的目标相冲突。此外，McPOL\
  \ 推断出俄罗斯可以采取的几种消除冲突的。在被问及关于可能发生什么或在发生某些新情况时应该做的假设性问题之前，`POLITICS` 不会激活这些推理。\n\n\
  最后需要说明的是 McPOL 与 `McSAM` 和 `McPAM` 的区别。虽然这三个程序的 CD 形式语法是相同的，但 McPOL 使用了扩展的谓词集。示例中使用了\
  \ `VOTE`、`FUND` 和 `BUILD`，这些都不是标准的概念依赖（Conceptual Dependency）行为。这是因为理解政治领域需要处理权力和权威关系的更复杂的知识结构。这些新谓词就像脚本一样，它们是知识块，而在真实的\
  \ `POLITICS` 系统中，它们由基本的 CD 原语表示。例如，在真实的 `POLITICS` 程序中，`FUND` 不仅仅是一个谓词，还理解为某个机构向另一个机构转移资金的\
  \ `ATRANS`。在 McPOL 中这种底层知识被省略了。适用于政治领域的谓词集在 Carbonell (1979a) 中有详细讨论。\n\n### 示例\n\
  \n以下是 McPOL 程序的日志，应用于“美国投票资助建造潜艇”的 CD 形式：\n\n```\n [PH: Initiation. 7-Feb-80 2:48PM]\n\
  (PROCESS-CD US-CD)\ninput is\n(VOTE (ACTOR US)\n (OBJECT (FUND (ACTOR US)\n (OBJECT\
  \ (BUILD (ACTOR US)\n (OBJECT SUBMARINES)))))\nInferred goal is\n (INCREASE (ACTOR\
  \ US) (OBJECT MILITARY-STRENGTH) (MODE POS))\nUS had goal\n (INCREASE (ACTOR US)\
  \ (OBJECT MIUTARY-STRENGTH) (MODE POS))\n which is a subgoal of\n (CONTROL (ACTOR\
  \ RUSSIA) (OBJECT WORLD) (MODE NEG))\nLooking for conflicts from US having goal\n\
  \ (INCREASE (ACTOR US) (OBJECT MILITARY-STRENGTH) (MODE POS))\nConflict found—RUSSIA\
  \ has goal\n (INCREASE (ACTOR US) (OBJECT MIUTARY-STRENGTH) (MODE NEG))\nRUSSIA\
  \ could resolve conflict by\n (CAUSE (ANTE (DO (ACTOR RUSSIA)))\n (CONSEQ (INCREASE\
  \ (ACTOR US)\n (OBJECT MILITARY-STRENGTH)\n (MODE NEG))))\nRUSSIA could resolve\
  \ conflict by\n (INCREASE (ACTOR RUSSIA) (OBJECT MILITARY-STRENGTH)\n (MANNER FAST)}\n\
  [PH: Termination. 7-Feb-80 2:49PM. PS:<RIESBECK>TWELVE.LOG.8]\n```\n\n## 流程图\n\n\
  图 12.1 和 12.2 中的中的流程图展示了 McPOL 中的两个核心函数：`INTERPRET` 和 `SEARCH-GOAL-TREE`。`INTERPRET`\
  \ 的流程图包含了其三个子部分的控制流：`INFER-REASON`、`INTEGRATE` 和 `COUNTER-PLAN`\n\n![](img/fig12_1_B.jpg)\n\
  \n图 12.1 INTERPRET(event).\n\n![](img/fig12_2_B.jpg)\n\n图 12.2 SEARCH-GOAL-TREE\
  \ (event, goal-node, test-predicate).\n\n## 程序\n\n\n\n\n\n# 微观政治程序\n\n```lisp\n\
  (DE PROCESS-CD (CD)\n  (MSG T “Input is”)\n  (SPRINT CD 4)\n  (MSG T)\n  (INTERPRET\
  \ CD)\n```\n\n`INTERPRET` 是主函数。给定一个 `CD`，它首先进行自底向上的推理（例如，“投票做某事意味着执行某事”），然后它在执行者的目标树中搜索与上一个推理出的项匹配的内容（例如，“美国增加实力”匹配“美国阻止俄罗斯控制世界”的子目标），最后它寻找与对手目标之间的冲突和解决办法（例如，“美国增加实力”与俄罗斯“美国不增加实力”的子目标冲突，如果俄罗斯阻止了美国或俄罗斯更快地增加了自己的实力，就可以解决冲突）。\n\
  \n```lisp\n(DE INTERPRET (CD)\n  (LET (NEW-CD (INFER-REASON CD))\n    (MSG T “Inferred\
  \ goal is”)\n    (SPRINT NEW-CD 4)\n    (MSG T)\n    (LET (ACTOR (FILLER:ROLE ACTOR\
  \ NEW-CD))\n      (COND ((CONSP ACTOR) (SETQ ACTOR (HEADER :CD ACTOR))))\n     \
  \ (COND ((NULL ACTOR) (MSG T “No actor found” T))\n              (T (INTEGRATE ACTOR\
  \ NEW-CD)\n                  (COUNTER-PLAN ACTOR NEW-CD))))\n```\n\n`INFER-REASON`\
  \ 对 `CD` 进行自底向上的推理。推理规则存储在各种谓词下（例如在 `VOTE`、`FUND` 等下）。每个推理出的新 `CD` 成为下一次推理的源。\n\n\
  ```lisp\n(DE INFER-REASON (CD)\n  (LOOP (INITIAL NEW-CD NIL)\n        (WHILE (SETQ\
  \ NEW-CD (FIND-RULE CD)))\n        (DO (SETQ CD NEW-CD!)\n        (RESULT CD))\n\
  ```\n\n`FIND-RULE` 找到第一个从 `CD` 推理出内容的规则。规则存储在 `CD` 的头部谓词下。\n\n```lisp\n(DE FIND-RULE\
  \ (CD)\n  (LET (NEW-CD NIL)\n  (FOR (RULE IN (RULES:HEADER (HEADER:CD CD)))\n  \
  \      (EXISTS (SETQ NEW-CD (APPLY-RULE CD RULE))))\n  NEW-CD)\n```\n\n`APPLY-RULE`\
  \ 将 `CD` 匹配到 `rule` 的测试模式。如果成功，则会实例化动作模式。\n\n```lisp\n(DE APPLY-RULE (CD RULE)\n\
  \  (LET (BINDINGS (COMPATIBLE (TEST:RULE RULE)) CD))\n  (COND (BINDINGS (INSTANTIATE\
  \ (ACTION:RULE RULE) BINDINGS))\n```\n\n`INTEGRATE` 在执行者的目标树中搜索与 `CD` 匹配的目标。如果找到了，它会打印一个父目标列表。\n\
  \n```lisp\n(DE INTEGRATE (ACTOR CD)\n  (LET (GOAL (GET ACTOR ‘TOP-GOAL) MATCH-GOAL\
  \ NIL)\n  (COND ((NULL GOAL) (MSG T “No goals known for” ACTOR T))\n           \
  \   ((SETQ MATCH-GOAL (SEARCH-GOAL-TREE CD GOAL ‘COMPATIBLE))\n              (PRINT-SUPER-GOALS\
  \ ACTOR MATCH-GOAL))\n              (T (MSG T ACTOR “ had no higher goals” T)))\n\
  ```\n\n`PRINT-SUPER-GOALS` 打印 `GOAL` 的父目标。\n\n```lisp\n(DE PRINT-SUPER-GOALS (ACTOR\
  \ GOAL)\n  (MSG T ACTOR “ had goal”)\n  (LOOP (DO (SPRINT (GET GOAL ‘FORM) 4) (MSG\
  \ T))\n        (WHILE (SETQ GOAL (GET GOAL ‘SUPER-GOAL)))\n        (DO (MSG T “\
  \ which is a subgoal of)))))\n```\n\n`SEARCH-GOAL-TREE` 在目标树中找到第一个满足 `TESTFN` 的目标。这是对树进行从左到右的深度搜索。\n\
  \n```lisp\n(DE SEARCH-GOAL-TREE (CD GOAL TESTFN)\n  (LET (FORM (GET GOAL ‘FORM))\n\
  \  (COND ((NULL FORM) NIL)\n        ((APPLY TESTFN (LIST FORM)) GOAL)\n        ((FOR\
  \ (SUB-GOAL IN (GET GOAL ‘SUB-GOALS)))\n          (EXISTS (SETQ GOAL (SEARCH-GOAL-TREE\
  \ CD SUB-GOAL TESTFN))))\n  GOAL)\n```\n\n`COUNTER-PLAN` 在 `X` 的对手的目标树中搜索与 `GX`\
  \ 冲突的目标。如果找到了，则寻找用于对抗 `X` 目标的方法 `Y`。\n\n```lisp\n(DE COUNTER-PLAN (X GX)\n  (MSG\
  \ T “Looking for conflicts from” X “ having goal”)\n  (SPRINT GX 4)\n  (MSG T)\n\
  \  (LET (Y (GET X ‘ADVERSARY))\n  (COND ((NULL Y) (MSG T “No adversary for” X))\n\
  \          (T (LET (GY (FIND-CONFLICT Y GX))\n              (COND (GY (MSG T “Conflict\
  \ found—” Y “ has goal”)\n                    (SPRINT GY 4)\n                  \
  \  (MSG T)\n                    (FIND-COUNTER Y GX)))))\n```\n\n`FIND-CONFLICT`\
  \ 在 `Y` 的目标树中搜索与 `GX` 的冲突。\n\n```lisp\n(DE FIND-CONFLICT (Y GX)\n  (LET (GOAL (SEARCH-GOAL-TREE\
  \ GX (GET Y ‘TOP-GOAL) ‘CONFLICT))\n  (COND (GOAL (GET GOAL ‘FORM))))\n```\n\n`FIND-COUNTER`\
  \ 打印所有适用于 `Y` 与 `GX` 冲突的冲突解决规则。\n\n```lisp\n(DE FIND-COUNTER (Y GX)\n(LET (CD NIL\
  \ PAT (LIST ‘CONFLICT (LIST ‘ACTOR Y) (LIST ‘GOAL GX)))\n  (FOR (RULE IN *COUNTER-RULES*)\n\
  \        (WHEN (SETQ CD (APPLY-RULE PAT RULE))))\n  (DO (MSG TY” could resolve conflict\
  \ by”)\n      (SPRINT CD 3)\n      (MSG T)))\n```\n\n\n\n\n\n# 数据结构与访问函数\n\n这些是“美国投票拨款建造潜艇”和“俄罗斯建造潜艇”的表示形式。\n\
  \n```lisp\n(SETQ US-CD ‘(VOTE (ACTOR US)\n                   (OBJECT (FUND (ACTOR\
  \ US)\n                             (OBJECT (BUILD (ACTOR US)\n                \
  \                 (OBJECT SUBMARINES)))))\n(SETQ RUSSIA-CD ‘(BUILD (ACTOR RUSSIA)\
  \ (OBJECT SUBMARINES))\n```\n\n所有的推理规则都采用 `(test-pattern action-pattern)` 的形式。当\
  \ `test-pattern` 匹配一个 CD 时，`action-pattern` 会（根据测试匹配的绑定）进行实例化并返回。\n\n```lisp\n(DE\
  \ TEST:RULE (RULE) (CAR RULE))\n(DE ACTION:RULE (RULE) (CADR RULE))\n```\n\nCD 谓词是具有\
  \ `RULES` 属性的原子，该属性指向一个推理规则列表。`(ADD-RULES atom rule rule...)` 向 CD 谓词添加推理规则，而 `(RULES:HEADER\
  \ atom)` 则获取这些规则。\n\n```lisp\n(DF ADD-RULES (L)\n  (PUTPROP (CAR L) (CDR L) ‘RULES)\n\
  \  (CAR L))\n(DE RULES:HEADER (X) (AND X (GET X ‘RULES)))\n```\n\n这里是投票、拨款和建造的规则。前两个规则推导出被投票或资助的对象，例如，“美国投票拨款建造潜艇”意味着\
  \ 1) 资助将发生，且 2) 建造将发生。`BUILD` 推导出军事实力正在增强。\n\n```lisp\n(ADD-RULES VOTE ((VOTE (ACTOR\
  \ ?X) (OBJECT ?Y)) ?Y)\n(ADD-RULES FUND ((FUND (ACTOR ?X) (OBJECT ?Y)) ?Y)\n(ADD-RULES\
  \ BUILD ((BUILD (ACTOR ?X) (OBJECT ?Y))\n                  (INCREASE (ACTOR ?X)\
  \ (OBJECT MILITARY-STRENGTH)\n                  (MODE POS))))\n```\n\n将美国和俄罗斯定义为相互的敌。\n\
  \n```lisp\n(DEFPROP US RUSSIA ADVERSARY)\n(DEFPROP RUSSIA US ADVERSARY)\n```\n\n\
  调用 `COUNTER-RULES` 是为了找到停止目标的方法。这里的两个规则都试图实现同一个目标：让对手变得更强。一种解决方案是阻止他们，另一种是抢先制人。冲突规则的形式为\
  \ `(test action)`，其中测试部分具有 `(CONFLICT (ACTOR…) (GOAL…))` 的形式。\n\n```lisp\n(SETQ\
  \ COUNTER-RULES\n      ‘((CONFLICT (ACTOR ?X)\n          (GOAL (INCREASE (ACTOR\
  \ ?Y))\n                (OBJECT MILITARY-STRENGTH)\n                (MODE POS)))\n\
  \         (CAUSE (DO (ACTOR ?X))\n               (SEQ (INCREASE (ACTOR ?Y))\n  \
  \             (OBJECT MILITARY-STRENGTH)\n               (MODE NEG))))\n       \
  \ ((CONFLICT (ACTOR ?X)\n          (GOAL (INCREASE (ACTOR ?Y))\n               \
  \ (OBJECT MILITARY-STRENGTH)\n                (MODE POS))\n          (INCREASE (ACTOR\
  \ ?X) (OBJECT MILITARY-STRENGTH)\n          (MANNER)))))\n```\n\n`DEFINE-GOAL-TREE`\
  \ 及其函数 `MAKE-GOAL` 允许我们通过输入以下类型来定义角色的目标树：\n`DEFINE-GOAL-TREE actor (top-goal CD-form\
  \ (sub-goal CD-form (sub-goals…)))`。\n顶层目标保存在角色下。超级目标链接与目标名称关联。CD 存储在 `FORM` 属性下。\n\
  \n```lisp\n(DF DEFINE-GOAL-TREE (L)\n  (PUTPROP (CAR L) (MAKE-GOAL (CADR L)) NIL)\
  \ ‘TOP-GOAL)\n  (CAR L)\n(DE MAKE-GOAL (L SUPER-GOAL)\n  (PUTPROP (CAR L) (CADR\
  \ L) ‘FORM)\n  (PUTPROP (CAR L) SUPER-GOAL)\n  (PUTPROP (CAR L) (FOR Y (CDDR L))\
  \ (SAVE (MAKE-GOAL Y (CAR L)))) ‘SUB-GOALS))\n```\n\n我们定义了美国的目标树，表示阻止俄罗斯控制世界是最高目标，而子目标是美国变强和俄罗斯变弱。\n\
  \n```lisp\n(DEFINE-GOAL-TREE US\n  (US-G1 (CONTROL (ACTOR RUSSIA) (OBJECT WORLD)\
  \ (MODE NEG))\n  (US-G2 (INCREASE (ACTOR US) (OBJECT MILITARY-STRENGTH) (MODE POS))\n\
  \  (US-G3 (INCREASE (ACTOR RUSSIA) (OBJECT MILITARY-STRENGTH) (MODE NEG)))\n```\n\
  \n我们定义了俄罗斯的目标树，表示控制世界是最高目标，而子目标是俄罗斯变强和美国变弱。\n\n```lisp\n(DEFINE-GOAL-TREE RUSSIA\n\
  \  (RUS-G1 (CONTROL (ACTOR RUSSIA) (OBJECT WORLD))\n  (RUS-G2 (INCREASE (ACTOR RUSSIA)\
  \ (OBJECT MILITARY-STRENGTH) (MODE POS)))\n```\n\n## 练习\n\n1. 当 McPOL 看到美国正在建造潜艇时，它在反计划阶段推导出俄罗斯可能会尝试增加自己的军事实力。原始的\
  \ POLITICS 程序更具体地推导出俄罗斯可能自己建造潜艇。然而，McPOL 无法这样做，因为当它推导出建造潜艇增加军事实力时，它丢弃了 CD。\n\n \
  \   1. 修改 `INFER-REASON`，使得所有推出的 CD 连同原始 CD 都保存在 `INFERENCES` 列表中。\n\n    2. 定义一个新函数\
  \ `MULTI-INFER`，它接收一个 CD 形式列表和一个规则列表，并将每条规则应用于每个 CD 形式。\n\n    3. 修改 `FIND-COUNTER`\
  \ 使用 `MULTI-INFER` 为 `INFERENCES` 中的不同 CD 寻找可能的反计划。这涉及到从 `INFERENCES` 中的 CD 列表中创建\
  \ `(CONFLICT…)` 形式，并更改输出消息以指定每个 CD 对应的反计划。\n\n    4. 在 `COUNTER-RULES` 中添加一条规则，表示对手建造某物的反计划是自己也建造它。\n\
  \n\n\n\n\n## 练习\n\n2. 为 `McPOL` 添加必要的自底向上推理规则，使其能够从美国保守派的观点解释“预计美国将批准巴拿马运河条约”。与其处理“预计（expect）”的意思以及巴拿马运河条约的内容，假设输入的\
  \ CD 为：\n\n```\n (VOTE (ACTOR US)\n           (OBJECT (CONTROL (ACTOR US)\n    \
  \                                (OBJECT PANAMA-CANAL)\n                       \
  \             (MODE NEG)))\n          (MODE MAYBE))\n```\n\n这代表了“美国可能会投票放弃对巴拿马运河的控制”。基于此，`McPOL`应该通过一条“放弃控制会导致军事削弱”的规则，推断出美国的军事实力将会削弱。\n\
  \n3. 在练习 `(2)` 中，`McPOL` 收到一个不符合主要主体目标树的 CD，但它仅仅是识别了这一事实。显然应该做更多工作。首先，应该识别美国所做的行为与美国应该做的行为之间的目标冲突。其次，应该识别出美国某种程度上落入了俄罗斯的下怀。例如，`POLITICS`\
  \ 程序使用保守意识形态推断出俄罗斯可能会试图接管运河本身。\n\n    1. 修改 `INTEGRATE`，使得当在主体的目标树中找不到匹配项时，`INTEGRATE`\
  \ 将改为寻找冲突。如果发现冲突，应将其打印出来，并显示消息主体做了适得其反的事。最后，`INTEGRATE` 应调用函数 `RESOLVE-CONFLICT`，并将主体和动作作为参数。\n\
  \n    2. 定义 `RESOLVE-CONFLICT`，使用 `MULTI-INFER` 和一个名为 `CONFLICT-RULES` 的冲突解决规则列表，生成并打印主体应该采取的而非正在执行的动作。\n\
  \n    3. 定义列表 `CONFLICT-RULES`，至少包含一条规则：如果一个主体可能投票做某事，那么应该采取某种行动试图使该投票结果变为负面。\n\n\
  \    4. 修改 `COUNTER-PLAN`，使得如果主体的动作与对手的目标树之间没有发现冲突，则 `COUNTER-PLAN` 将寻找匹配项。如果找到，应将其打印出来，并显示消息表示主体的动作帮了对手的。最后，`COUNTER-PLAN`\
  \ 应调用函数 `TAKE-ADVANTAGE`，并将对手和动作作为参数。\n\n    5. 定义 `TAKE-ADVANTAGE`，使用 `MULTI-INFER`\
  \ 和规则列表 `ACHIEVE-RULES` 生成并打印对手可能采取的动作，因为现在他的一个目标已经为他实现了。\n\n    6. 定义 `ACHIEVE-RULES`，至少包含一条规则：如果有人放弃了某个区域的控制，那么对手应该接管其控制权。\n\
  \n# 13 自然语言的概念分析\n\nLawrence Birnbaum, Mallory Selfridge\n\nDOI: [10.4324/9780203728147-13](https://dx.doi.org/10.4324/9780203728147-13)\n\
  \n## 引言\n\n任何自然语言理论面临的关键问题之一是将自然语言文本映射到代表该文本含义的内存结构。我们将这一过程称为概念分析（Conceptual Analysis）。本章有两个互补的目标：首先，我们希望对概念分析提供清晰的介绍；其次，我们将介绍我们对语言分析中某些未解决问题的研究结果——这类问题有很多。\n\
  \n对概念分析的研究已经进行了多年，始于 Schank 等人 (1970) 和 Riesbeck (1975) 的工作。我们在这些工作的基础上，集中于我们认为尚未得到充分研究的重要问题上：\n\
  \n1. 语法在以语义为导向的语言分析过程中起什么作用？\n2. 我们如何实现自顶向下和自底向上处理的灵活平衡？\n3. 短期记忆结构如何影响分析过程？\n4.\
  \ 表达系统拥有的处理知识的正确词汇（形式化）是什么？\n5. 我们应该努力实现的词义消歧过程的性能标准是什么？\n\n我们的工作为上述问题提供了一些答案，这反过来使我们能够构建出更灵活的算法，能够分析文本中发现各种输入。\n\
  \n## 背景\n\n概念分析的目标是将自然语言输入映射为表示。这一目标与大多数模型所假设的相同，大多数模型认为解析的目的是语法分析。换句话说，概念分析器的目标是推导出语义结构，而语法解析器的目标是句法描述。语法解析器的示例包括：Thome\
  \ 等人 (1968), Bobrow 和 Fraser (1969), Woods (1970), Winograd (1972), Kaplan (1975)\
  \ 以及 Marcus (1975, 1976)。\n\n其他以语义为导向的分析器示例是 Wilks (1973, 1975a, 以及 1976](#reference.xhtml_bib_r86))\
  \ 以及 Burton (1976)。早期的自然语言处理假设一个完全理解系统需要一个语法分析器作为前端。然而，我们并不认为这种语法分析是必要的。当然，这并不意味着我们否定语法现象或语法知识的存在；相反，我们反对设立独立语法阶段的概念。\n\
  \n由于概念分析的目标与语法解析的目标不同，所采用的机制不同也是可以的。特别是，我们的目标是让概念分析在任何有帮助的情况下使用任何所有可用知识。这类知识可能包括语法知识，但绝不仅限于此。我们理论的一个观点是，非语言知识在自然语言处理的早期阶段往往是关重要的。\n\
  \n## 预期（Expectations）\n\n语言理解者必须将从词义以及从词义得出的推理得到的概念连接成对整个输入的连贯表示。由于词义歧义或无关推理的可能性，理解者还必须能够在替代概念中进行选择。因此，概念分析主要由连接和消歧（即从中选择）表示结构组成。\n\
  \n系统用于此任务的处理知识以预期的形式存在（Schank 等人, 1970; Riesbeck, 1975; 以及 Riesbeck 和 Schank, 1976)）。当一个人听到或读到某些含义的词时，他预期或预测会有某些其他含义的词出现，或者已经出现过。人们根据目前为止阅读和理解的内容，以及对语言和世界的认知，不断预测他们接下来可能看到的内容。\n\
  \n\n\n\n为了说明在理解过程中“期望”（expectations）的作用，假设以下简单句子是某个基于期望的概念分析系统的输入：“Fred 吃了一个苹果。”从左到右读取，系统首先找到单词“Fred”。系统将其理解为对某个名为\
  \ `Fred` 的男性人类的引用，并将该引用（表示为标记 `FRED`）存储在某种短时记忆中。下一个单词是“ate”。这被理解为“吃”这一概念的实例，在概念依赖（Conceptual\
  \ Dependency）中，它由如下的 `CD` 框架表示：\n\n```\n (INGEST ACTOR (NIL) OBJECT (NIL)).\n```\n\
  \n此外，“ate”的含义提供了一些期望，为如何填充该框架的空槽提供了提示。其中一个期望表明`INGEST` 的执行者（ACTOR）作为一个生物可能已经被提到。因此，分析器检查短时记忆，在其中发现了\
  \ `FRED`，并填充了 `INGEST` 的 `ACTOR` 槽：\n\n```\n (INGEST ACTOR (FRED) OBJECT (NIL)).\n\
  ```\n\n还剩下一个未满足的期望，它暗示将提到 Fred 吃了什么，它应该是某种可食用物品或至少是一个物理对象），并且应该填充 `OBJECT` 槽。接下来，读取了单词“an”。这产生了一个期望，即将出现某个概念的实例，并指示如果找到了，则应将其标记为不定引用。（这些信息可以辅助记忆。）最后，读取了“apple”。它被理解为概念\
  \ `APPLE` 的一个实例，代表某种已知是食物的东西。读取“an”时产生的期望得到了满足，因此 `APPLE` 被标记为之前未见的对象，我们将其表示为：`(APPLE\
  \ REF (INDEF))`。读取“ate”时产生的第二个期望也得到了满足，因此 `INGEST` 的 `OBJECT` 槽被 `(APPLE REF (INDEF))`\
  \ 填充。系统对输入的当前理解表示为\n\n```\n (INGEST ACTOR (FRED) OBJECT (APPLE REF (INDEF))).\n\
  ```\n\n没有更多单词，过程停止。\n\n上面的示例展示了概念分析过程。当读取一个单词时，代表该单词含义的概念结构被添加到短时记忆中。此外，还会产生期望，这些期望提供了将这些概念结构连接成输入整体表示所需的处理知识。\n\
  \n### 概念分析的演变\n\n概念分析的基础性假设是：在语言理解过程的最早期阶段，意义是一个关键因素。最初有两个观察导致了这一观点。第一个是以语法为导向的方法在促进自然语言处理系统构建方面的失败，特别是在机器翻译研究的早期。这种失败似乎表明需要一种更基于意义的语言分析方法。\n\
  \n第二个观察是一个相当常识的观点：阅读一种略有了解的外语比口说或写它要容易得多，特别是当你对讨论的话题有所了解时。这似乎表明语言分析对语法的知识要求少于语言生成，因此基于意义的语言分析方法可以成功。\n\
  \n概念依赖的后续发展促使 Schank 等人 ([1970]) 认识，用于表示输入含义的不完全 `CD` 结构生成了可以用于语言分析的期望。Riesbeck\
  \ ([1975]) 在 `MARGIE` 解析器中证明了这种方法的可行性。他通过在系统词汇中的单词上附带小型可执行程序（称为 `requests*`，即请求）来实现来实现这些期望。然后，这些请求被用于将单词的语义表示连接成整个句子的表示。\n\
  \n随后编写的下一个解析器是 Riesbeck 的 `ELI` (Riesbeck and Schank, [1976])。`ELI` 尝试通过使分析器极度自顶向下，来展示期望如何同时用于消除歧义和连接结构。在\
  \ `ELI` 中，只有当概念结构满足先前的期望时，才会被接受处理。通过添加 Gershman 的名词组处理器（`NGP`）程序，`ELI` 的能力得到了扩展，以处理复杂的名词组和关系从句（Gershman,\
  \ [1977] 和 [1979]）。这里的动机是为了让 `ELI` 和 `NGP` 执行的处理类型统一。\n\n### 输入/输出示例\n\n以下输入输出示例代表了我们当前概念分析器的能力。该程序被称为\
  \ `CA` (Bimbaum and Self리지, 1979)：\n\n```\n *(CA ‘(MARY TOOK BILL AN APPLE.))\n\
  FINAL ANALYSIS: STM = (CON20)\nCON20 =\n(ATRANS ACTOR\n (PP PPCLASS (HUMAN) NAME\
  \ (MARY) GENDER (FEMALE))\n OBJECT\n (PP PPCLASS (FOOD) TYPE (APPLE) REF (INDEF))\n\
  \ FROM\n (PP PPCLASS (HUMAN) NAME (MARY) GENDER (FEMALE))\n TO\n (PP PPCLASS (HUMAN)\
  \ NAME (BILL) GENDER (MALE))\n INST\n (PTRANS ACTOR\n (PP PPCLASS (HUMAN) NAME (MARY)\
  \ GENDER (FEMALE))\n OBJECT\n (PP PPCLASS (FOOD) TYPE (APPLE) REF (INDEF))\n FROM\n\
  \ (NIL)\n TO\n (PP PPCLASS (HUMAN) NAME (BILL) GENDER (MALE))\n TIME\n (PAST))\n\
  ```\n上述表示大致含义如下：名叫 Mary 的女性人类通过 `ATRANS`（抽象转移）将一种类型为苹果的食物从自己那里传给了一个名叫 Bill 的男性人类。这是通过\
  \ `PTRANS`（物理转移）苹果完成的。上面的示例展示了分析器处理某类歧义的能力。在一种特殊情况下，“take”（拿）是一个高度多歧义的单词。例如，系统还必须处理如“Mary\
  \ took the train”这样的输入（其顶层概念化是 `PTRANS`），以及“John took some aspirin”这样的输入（其顶层概念化是\
  \ `INGEST`）。\n\n```\n *(CA ‘(WHERE DID VANCE GO LAST WEEK?))\nFINAL ANALYSIS: STM\
  \ = (CON11)\nCON11 =\n(PTRANS ACTOR\n (PP PPCLASS (HUMAN) LASTNAME (VANCE) FIRSTNAME\
  \ (NIL))\n OBJECT\n (PP PPCLASS (NIL) REF (DEF))\n```\n上述仅仅是程序能够的问题的问题种类的典型示例。`CD`\
  \ 表示为：一个姓 Vance 的人类在上周 `PTRANS`（物理转移）到了某个未知的地方（`**` 表示这是问题正在寻找的信息）。\n\n```\n *(CA\
  \ ‘(A SMALL PLANE STUFFED WITH 1500 POUNDS OF MARIJUANA CRASHED\n10 MILES SOUTH\
  \ OF HERE YESTERDAY AS IT APPROACHED A LANDING\nSTRIP KILLING THE PILOT.))\nFINAL\
  \ ANALYSIS: STM = (CON48 CON63)\nCON48 =\n(SAME-TIME-AS\n CON-A\n (PROPEL ACTOR\n\
  \ (PP CLASS (VEHICLE)\n TYPE (AIRPLANE)\n SIZE (SMALL)\n REF (INDEF)\n REL (PTRANS\
  \ ACTOR\n (NIL)\n OBJECT\n (PP CLASS\n (PHYSOBJ)\n TYPE\n (MARIJUANA)\n AMOUNT\n\
  \ (UNIT TYPE\n (LB)\n NUMBER\n (NUM VAL (1500))))\n TO\n (INSIDE PART (PREVIOUS))\n\
  \ FROM\n (NIL)\n TIME\n (PAST)))\n OBJECT\n (PP CLASS (PHYSOBJ) TYPE (GROUND))\n\
  \ PLACE\n (LOC PROX (HERE)\n DIR (SOUTH)\n DIST (UNIT TYPE\n (MILE)\n NUMBER\n (NUM\
  \ VAL (10))))\n TIME\n (TIME TYPE (DAY) NUMBER (−1.)))\nCON-B\n(SAPPROACH VEH\n\
  \ (PP PPCLASS (NIL) REF (DEF))\n FIELD\n (LOC TYPE (LANDING-HELD) REF (INDEF))))\n\
  CON63 =\n (LEAD-TO ANTE\n (NIL)\n CONSE\n (HEALTH ACTOR\n (PP PPCLASS (HUMAN) TYPE\
  \ (PILOT) REF (DEF))\n VAL\n (−10.)))\n```\n\n\n\n\n此示例演示了分析器解析包含多个从句的长输入的能力。该分析由两个\
  \ CD（概念描述）组成。第一个是 `CON48`，它被分为 `CON-A` 和 `CON-B`，含义大致如下：`CON-A` 表示一辆类型为飞机、尺寸较小的车辆（某人曾在过去的某个时刻向其\
  \ `PTRANSed` 了 1500 磅大麻），撞击（`PROPELled`）了距离默认变量 `HERE` 南方 10 英处的地方。`CON-B` 表示同一时间，某个车辆正在参与\
  \ `$AIRPLANE` 脚本中的 `$APPROACH` 场景。第二个 CD `CON63` 意味着某些情况导致了 `$AIRPLANE` 脚本中扮演飞行员的人员死亡。这两个\
  \ CD 尚未连接，且位置中的“这里”等引用尚未指定，因为在词法层面不存在必要的信息。完成这种表示还需要更层次的处理，例如脚本应用器（Cullingford,\
  \ 1978），该内容在第 5 章 中有所讨论。\n\n### 灵活性问题\n\n这项工作的主要关注点之一是增加分析过程的`灵活性`。为了处理大多数文本中常见的名词组和长多从句输入，分析器必须能够同样灵活地以自上而下和自底向上的模式运行。在概念分析的框架内，这意味着分析器必须在预期可用时使用它们。但如果没有可用的有用预期，系统也必须能够接受并保存中间概念和处理知识，直到它们可以被使用为止。\n\
  \n这一点对语言处理器有两个直接的推论。第一个是，为了在以自底向上的方式运行时保存中间概念结构和处理知识，分析器必须拥有足够灵活的短期记忆来存储它们。特别是，名词组和多从句输入往往会呈现这样的情况：即必须保存若干构成分概念结构，直到收集到足够的信息将它们连接起来。我们的分析器使用了一个简单的有序列表，事实证明这是足够的。\n\
  \n第二个推论与词义消歧问题有关。语言处理器并不能能在读到一个歧义词时立即在相互竞争的词义（概念和预期）之间做出决定，因为必要的信息可能尚未可用。例如，考虑以下句对：\n\
  \n*   John broke the pot.\n*   John smoked the pot.\n\n在第一句中，“broke”为某个可以被打破的东西产生了一个预期。这个预期在读到单词“pot”时可以被立即使用，以倾向于“容器”义并拒绝“大麻”义。在第二句中，“smoked”为某个可以被焚烧和吸入的东西产生了一个预期，这个预期在读到单词“pot”时可以被立即使用，以选择“大麻”义。\n\
  \n但现在考虑这些句子的被动态形式：\n\n*   The pot was broken by John.\n*   The pot was smoked by\
  \ John.\n\n与相应的主动语情况不同，单词“pot”在被动句中无法立即进行消歧，因为在可能的词义之间做出选择所需的语义信息直到输入的后部分才会出现。\n\
  \n### 结论\n\n概念分析最主要的理论假设可能是：在语言理解中不需要单独的句法分析阶段。之前的工作已经证明了这种方法的可行。我们相信，我们在产生显著改进的分析过程方面的成功为这一假设提供了进一步的证据。\n\
  \n语言分析未来工作的重要问题是，更好地理解如何在分析过程中使用更高层次的记忆结构（Schank et al., 1978）。我们认为这个问题的重要性显而易见，特别是在处理词义歧义问题时。很多时候当解析器认为一个词是有歧义的时，是因为它没有利用或拥有本应由高记忆结构提供的知识。也就是说，它并没有真正充分理解它正在阅读的内容。当然，我们在解析过程中应用记忆的优劣程度将取决于我们对记忆的理解有多有多深。这仍然是最困难但最关键的问题。\n\
  \n## 分析器概览\n\n可以使用什么机制来实现预期？基于 Riesbeck (1975) 的工作，我们选择使用被称为 `requests` 的测试-动作对来实现预期。如果对某个请求的测试通过检查并发现为真，则执行该请求相应的动作。因此，请求是产生式（production）的形式（Newell,\
  \ 1973）。\n\n再次考虑上节关于预期的示例示例：“Fred ate an apple.”我们说，会产生一个对可食用物的预期，以填充由“eat”构建的 `INGEST`\
  \ 结构的 `OBJECT` 槽位。作为请求实现时，这个预期看起来像这样：\n\n*   TEST: 能找到一个代表可食用对象的概念吗？\n*   ACTION:\
  \ 将其放入 `INGEST` 概念的 `OBJECT` 槽位。\n\n当读到或听到单词“ate”时，该请求被`activated`。在示例中，当理解单词“apple”的含义时，它的测试变为真。它的动作指定了\
  \ `APPLE` 应被视为 `INGEST` 的 `OBJECT`。（通常情况下，我们会更非正式地描述请求，类似于“如果你能找到一个可食用的东西，就把它放入\
  \ `OBJECT` 槽位”。）\n\n使用这种方法，概念分析过程可以最容易地描述为一种特殊类型的产生系统。随后出现了几个问题：\n\n1.  需要什么样的控制结构？\n\
  2.  请求可以执行什么种测试和动作？\n3.  请求存储在哪里，如何访问它们？\n\n我们现在将通过概述一种“最小”分析器，对这些问题分别给出初步回答。\n\n\
  ### 控制结构和数据结构\n\n首先，概念分析器需要某种工作短期记忆（STM），即一个存放正在处理的概念结构的地方。没有灵活的 STM，概念分析器将无法记住那些要整合到输入最终表示中的子结构。让我们假设这种短期记忆仅仅是一个列表，称为\
  \ `CONCEPT-LIST` 或 `C-LIST`。当系统的处理知识（以请求的形式）认为某些概念结构对于表示输入的含义相关时，该结构就会被添加到此列表的末尾。这种持有结构的灵活性对于解析器在自底向上的模式下有效运行是至关重要的。\n\
  \n其次，概念分析器需要一个数据结构来存放激活请求。如果没有它，系统永远无法维持任何预期。在我们的最小分析器中，这也是一个列表，称为 `REQUEST-LIST`\
  \ 或 `R-LIST`。系统检查 R-LIST 上的请求，如果请求的测试为真，则执行其动作。这个过程被称为 `request consideration`。\n\
  \n最小概念分析算法的控制结构是直接的：\n\n1.  从输入中从左到右获取下一个词法项（单词或习语短语）。如果没有，过程终止。\n2.  将与新项相关的请求加载（激活）到\
  \ R-LIST 中。\n3.  考虑 R-LIST 中的激活请求。\n4.  回到步骤 1。\n\n### 请求\n\n\n\n\n\n设计合适的词汇来表达系统所拥有的处理知识至关重要。由于我们正在使用\
  \ `requests` 来体现这些处理知识，这个问题就变成了选择一组正确的 `requests` 可能执行的测试和动作。\n\n`requests` 可能执行的测试通分为大类：\n\
  \n1.  测试特定单词或短语的出现。\n2.  测试 `C-LIST` 上概念结构的某些语义或顺序属性。\n\n执行第一类测试的请求被称为 `lexical`（词法类）请求，而执行第二类测试的请求被称为\
  \ `conceptual`（概念类）请求（或者通常直接称为请求）。\n\n如果请求的测试为真，请求可以执行以下任何操作：\n\n1.  向 `C-LIST`\
  \ 中添加一个概念结构。\n2. 用另一个结构填充概念结构中的某个槽位（slot）。\n3.  激活其他请求，即将它们添加到 `R-LIST`。\n4.  取消激活请求，包括自身。\n\
  \n这些基本动作有几种变体，我们将在提供程序详细视图的章节逐一讨论它们时对其进行分析。\n\n在实践中，让请求更像 LISP 的“条件”语句而不是传统的产生式似乎更为方便。也就是说，一个请求应该由一组有序的测试组成，这些测试控制着指向互斥动作的分支。这在允许请求感知自身何时不再适用，然后从激活状态中移除自身时特别有用。我们可以通过让请求中的其中一个测试寻找“请求不再适用”的线索来实现这一点。如果该测试变为真，关联的操作将简单地让请求取消激活自身。\n\
  \n请求通常被简单地组织在它们所有用的特定单词下。也就是说，存储在单词下的请求形成了一种字典。例如，读到“an”时创建的请求将简单存储在单词“an”下，每当读到该单词时就会被激活并使用。这是组织请求的一种方式，使得只有与当前情况相关的请求在系统中是处于激活状态的。显然，并不是所有的分析预期都应该实现为词法索引请求。关于“情境索引”的分析预期的讨论，请参阅\
  \ Gershman (1979)。\n\n### 示例\n\n现在让我们详细检查我们所描述的最小概念分析器如何在另一个简单示例上工作，即语句“Fred gave\
  \ Sally a book.”（步骤编号对应上述控制结构草图循环中的步骤。）\n\n**读取下一个单词（步骤 1）：** 在这种情况下，第一个单词是“Fred”。\n\
  \n**从字典条目中激活请求（步骤 2）：** 在“Fred”的条目中只有一个：\n\n```\n REQUEST—\n TEST: T\n ACTIONS:\
  \ Add the structure (PP CLASS (HUMAN) NAME (FRED))\n to the C-LIST\n```\n\n该请求测试中的符号\
  \ `T` 始终为真，因此应该始终执行该动作。在激活此请求时，系统为其分配了名称 `REQ0`。\n\n**考虑激活的请求（步骤 3）：** 只有一个 `REQ0`，它的测试为真，因此执行了它的动作。现在，`C-LIST\
  \ = CON1`，其中 `CON1` 是为以下结构生成的内部名称：\n\n```\n (PP CLASS (HUMAN) NAME (FRED)).\n```\n\
  \n**读取下一个单词（步骤 1）：** “gave”。\n\n**从字典条目中激活请求（步骤 2）：** 就本示例而言，在“gave”的条目中只有一个请求：\n\
  \n```\n REQUEST —\n TEST: T\n ACTIONS: Add the structure\n (ATRANS ACTOR (NIL) OBJECT\
  \ (NIL)\n TO (NIL) FROM (NIL)\n TIME (PAST))\n to the C-LIST\n Activate the request\n\
  REQUEST-\n TEST: Can you find a human on the C-LIST\n preceding the ATRANS structure?\n\
  \ ACTIONS: Put it in the ACTOR and FROM slots\n of the ATRANS\n Activate the request\n\
  REQUEST—\n TEST: Can you find a human on the C-LIST\n following the ATRANS structure?\n\
  \ ACTIONS: Put it in the TO slot of the ATRANS\n Activate the request\nREQUEST—\n\
  \ TEST: Can you find a physical object on the\n C-LIST following the ATRANS structure?\n\
  \ ACTIONS: Put it in the OBJECT slot of the ATRANS\n```\n\n在激活此请求时，系统为其分配了名称 `REQ1`（注：此处指代该请求组）。\n\
  \n**考虑激活的请求（步骤 3）：** 只有一个 `REQ1`，它的测试为真，因此执行了它的动作。首先，它在 `C-LIST` 的末尾添加了一个新结构。现在\
  \ `C-LIST = (CON1 CON2)`，其中 `CON2` 是为代表“gave”含义的 `ATRANS` 结构生成的内部名称。然后，激活了三个新请求，试图填充\
  \ `ATRANS` 结构中的空白。这些请求中的第一个试图填充 `ATRANS` 的 `ACTOR` 槽位。当它被激活时，系统为其分配名称 `REQ2`。下一个请求试图填充\
  \ `ATRANS` 的 `TO` 槽位，激活时分配名称 `REQ3`。最后一个新请求 `REQ4` 试图填充 `ATRANS` 的 `OBJECT` 槽位。\n\
  \n系统现在考虑这些新请求，发现 `REQ2` 的测试为真。执行 `REQ2` 的动作，因此代表“Fred”的 `CON1` 被置于 `CON2`（即 `ATRANS`）的\
  \ `ACTOR` 槽位，并从 `C-LIST` 中移除。另外两个请求 `REQ3` 和 `REQ4` 的测试为假。\n\n**读取下一个单词（步骤 1）：**\
  \ “Sally”。\n\n**从字典条目中激活请求（步骤 2）：** “Sally”的条目中有一个请求，与“Fred”的请求类似：\n\n```\n REQUEST—\n\
  \ TEST: T\n ACTIONS: Add the structure (PP CLASS (HUMAN) NAME (SALLY))\n```\n\n\
  在激活此请求时，系统为其分配了名称 `REQ5`。\n\n**考虑激活的请求（步骤 3）：** 发现 `REQ5` 的测试为真，因此执行了它的动作。现在 `C-LIST\
  \ = CON2 CON3`，其中 `CON3` 是代表“Sally”的结构。仍然激活的 `REQ3` 现在测试为真，因此用 `CON3` 填充 `CON2`\
  \ 的 `TO` 槽位。\n\n**读取下一个单词（步骤 1）：** “a”。\n\n**从字典条目中激活请求（步骤 2）：** “a”的条目中有一个请求：\n\
  \n```\n REQUEST—\n TEST: Has a new structure been added to the end of the C-LIST?\n\
  \ ACTIONS: Mark it as an indefinite\n```\n\n在激活此请求时，系统为其分配了名称 `REQ6`。\n\n**考虑激活的请求（步骤\
  \ 3）：** `R-LIST` 上的激活请求 `REQ4` 和 `REQ6` 的测试均为假，因此什么也没有发生。\n\n**读取下一个单词（步骤 1）：**\
  \ “book”。\n\n**从字典条目中激活请求（步骤 2）：** “book”的条目中只有一个请求：\n\n```\n REQUEST—\n TEST: T\n\
  \ ACTIONS: Add the structure (PP CLASS (PHYSICAL-OBJECT) TYPE (BOOK))\n to the C-LIST\n\
  ```\n\n在激活此请求时，系统为其分配了名称 `REQ7`。\n\n**考虑激活的请求（步骤 3）：** 发现 `REQ7` 的测试为真，因此执行了它的动作：`CON4`\
  \ 被添加到 `C-LIST`，其中 `CON4` 是代表“book”的结构。`REQ6` 现在测试为真，因此将 `CON4` 标记为不定引用，如下：\n\n\
  ```\n (PP CLASS (PHYSICAL-OBJECT) TYPE (BOOK) REF (INDEF)).\n```\n\n`REQ4` 也测试为真，因此用\
  \ `CON4` 填充 `CON2`（即 `ATRANS`）的 `OBJECT` 槽位。\n\n输入没有更多单词。分析停止，最终结果代表输入：\n\n```\n\
  \ (ATRANS ACTOR (PP CLASS (HUMAN) NAME (FRED))\n OBJECT (PP CLASS (PHYSICAL-OBJECT)\n\
  \ TYPE (BOOK) REF (INDEF))\n TO (PP CLASS (HUMAN) NAME (SALLY))\n FROM (PP CLASS\
  \ (HUMAN) NAME (FRED))\n TIME (PAST))\n```\n\n## 理论问题\n\n传统的语法概念在讨论句子结构时包含了“词性”和“短语标记”等观点。我们在这一节中想要主张的观点是，在语言理解过程中描述和利用语法知识时，这些语法概念是不恰当的。\n\
  \n\n\n\n\n首先，句法知识的目的是什么？\n\n显然，句法知识的一个主要用途是在语义信息不足或具有误导性时，引导词义的组合形成话语意义。例如，在“把杂志放在盘子上”这样的话语中，是句法知识告诉理解者哪个对象应该被放置在哪个对象之上。因此，从在概念分析器（conceptual\
  \ analyzer）中使用的角度来看：\n\n> 句法的很大一部分是关于根据词在话语中的位置来组合词义的知识。\n\n如何对这种句法知识进行特征描述？\n\n\
  我们寻求一种规范，考虑到句法的要点在于其在理解过程中的`use`（使用）。我们将理解过程视为连接表示结构的过程，其中当一个结构填充了另一个结构的槽位时，或者两者都填充了一个更大的形式时，结构之间就建立了连接。因此，句法知识是指明在话语的何处可以某个词，其意义可以（通过槽位填充）与另一个词的意义连接起来。当然，我们现在必须明确“话语中的位置”这一概念。\n\
  \n由于处理知识被编码在请求（requests）中，这个问题简化为如何在请求的测试中考虑位置信息。这可以通过让测试检查以下内容来实现：\n\n1. 短期记忆（`C-LIST`）中输入元素的相对位置。\n\
  2. 填充结构槽位的正确顺序。\n\n这些方法通过使用相对位置信息来描述话语中的位置。这两者本质上都是利用词序信息的方法。第一种方法（使用短期记忆中的相对位置）描述了概念结构相对于它可能通过槽位填充与之连接的其他结构的位置直接关系。例如，考虑上述示例中的以下请求：\n\
  \n```\n REQUEST-\n TEST: Can you find a human on the C-LIST\n preceding the ATRANS\
  \ structure?\n ACTIONS: Put it in the ACTOR and FROM slots\nof the ATRANS\n```\n\
  \n该请求的测试检查了是否存在一个特定类型的概念对象（人类），它在 `C-LIST` 上相对于 `ATRANS` 结构具有特定的位置（在……之前，前面的）。\n\
  \n第二种方法（待填充槽位的排序）以更间接的方式将结构的位置与其他结构联系起来。特别是，通过限制填充槽位的顺序，我们实际上是将这些槽位的填充者在`temporally`（时间上）联系起来。例如，一个概念化对象的\
  \ `ACTOR` 槽位在 `OBJECT` 槽位之前填充的约束，反映了在主动构型中，该概念化的 `ACTOR` 应该在 `OBJECT` 之前看到。\n\n\
  另一个重要方法是将概念结构的位置与特定词汇（即功能词）的位置相关，而不是另一个概念。功能词（包括介词、后置词和词缀）是概念语言分析中非常重要的句法线索。\n\n\
  我们在分析器中实现了自上而下和自下而上处理的灵活平衡，这导致发现了一个有趣的副作用，对我们的句法概念产生了影响。我们发现，分析器并不需要在句子开始时具有任何先验预期，例如对于初始名词短语或一个完整的句子。大多数其他解析器（无论是基于句法的还是基于语义的）在句子开始时都会使用这种先验预期。\n\
  \n然而，如果对完整句子没有先验预期，我们如何解释下面句子 (a) 与句子 (b) 之间的异常之处？\n\n1. 一架装满了 1500 磅大麻的飞机。\n2.\
  \ 一架飞机装满了 1500 磅大麻。\n\n句子 (a) 中有一种真实的“不完整感”，这似乎证明人们`确实`对完整句子有先验预期。然而，考虑这两个句子在接以下问题之后听起来是什么样的：\n\
  \n* 什么坠毁了？\n\n在问题 (c) 之后，是句子 (b) 听起来很奇怪，而句子 (a) 看起来完全合适。现在，人们可以解释这种现象：在句子开始时提供的预期是可以多变的，在问题\
  \ (c) 之后，解析器不再要求一个完整的句子。但当然，问题 (c) 同样可以后面接任何任何内容：\n\n* 一架载着 1500 磅大麻的飞机坠毁了。\n* 什么都没有坠毁。\n\
  * 你在说什么？\n* 没有发生任何坠机事故。\n* 我什么都没听到。\n\n所以显然，依赖于先验预期的解析器不能在像 (c) 这样的语境下简单地抛弃它们。如果这样做，它将无法处理诸如\
  \ (d) 到 (h) 的输入。此外，这些示例清楚，先验句法预期的存在与否并不能解释为什么 (b) 在 (c) 之后的语境是奇怪的。这只能通过参考更高层次的过程（如记忆搜索和问答）来解释。然而，如果我们有这样的过程，那么我们也可以解释为什么\
  \ (a) 在空语境中是奇怪的。因此，这种现象不能作为反对我们主点的证据——即先验句法预期（例如对完整句子的预期）是不必要的。\n\n此外，我们认为对空语境下\
  \ (a) 和 (c) 语境下 (b) 的对称情况解释应该是相同的。也就是说，这种特殊类型“语法”判断的底层逻辑完全不在于句法现象。相反，它应该通过参考记忆搜索和问答等更高层次的过程来解释。\n\
  \n### 词义消歧 (Word-Sense Disambiguation)\n\n在概念分析中，当一个词有两个或多个向 `C-LIST` 添加结构的请求时，词义歧义就会表现出来。我们如何确保可以选择表示“语境”意义的结构？当然，我们在本节中描述的内容并不是对词义歧义问题的完全回答。然而，我们至少澄清了可能性的存在。下面我们提出了一种基于此处考虑的消歧算法。\n\
  \n处理词义消歧本质上有两种方法。要么代表替代假设的结构检查语境以判断它们是否合适，要么语境以某种方式检查结构，或者这两种方法都使用。在概念分析术语中，这意味着有两种方法来完成请求选择的任务。第一种方法是让请求的测试检查线索，以判断它们要添加到\
  \ `C-LIST` 的结构是否合适。这些测试可以在词汇层面（例如检查特定的单词或短语），也可以在概念层面（例如检查 `C-LIST` 上的其他结构）。\n\n\
  \n\n\n\n执行请求选择的第二方法是使用一个函数，根据上下文中的信息以及它们构建的结构来选择合适的请求。实现此事的传统方法是选择能够与系统短期记忆中其它结构连接得最好的结构。这一思想的早期体现是使用“选择限制”（selection\
  \ restrictions）来排除某些意义的组合（Katz and Fodor, 1963）。在概念分析中，该思想最显而易的应用是选择用于填充 `C-LIST`\
  \ 上其他结构空隙的结构，或者可以使用 `C-LIST` 上的其他结构来填充自身空隙的结构，或者两者兼顾。这显然不是唯一导致我们偏向某一种意义而非另一种意义的“连通性”或“连贯性”。特别是，用于检查某些潜在结构的上下文结构不需要直接源于输入，也就是说，还应该包含由推论记忆程序派生的结构。\n\
  \n这种类的自上而下的选择会在出现“a tip”（一个小费）时，通过选择“left”的 `ATRANS` 意义来消除“left”的歧义，因为 `ATRANS`\
  \ 可以使用与“tip”相关的结构来填充其 `OBJECT` 槽。同样，当出现“the restaurant”（餐厅）时，它会选择“left”的 `PTRANS`\
  \ 意义，因为 `PTRANS` 可以使用与“restaurant”相关的结构来填充其 `FROM` 槽。\n\n当然，这两种方法都不是新的。`MARGIE`\
  \ 解析器（Riesbeck, 1975）和 `ELI`（Riesbeck and Schank, 1976）采用了第一种方法，即让请求测试上下文以确定其适用性，并取得了一些成功（参见\
  \ Small, 1978）。Wilks 的偏好语义方案（Wilks, 1975 和 1976）包含了可能最先进的连接搜索机制（参见 Hayes, 1977）。`ELI`\
  \ 也采用了这种方法的限制形式。\n\n### 智能纠错\n\n### 最近，一些注意力集中在无备份的确定性“等待并观察”句法解析的想法上（Marcus, 1975）。确定性通过限制分析过程来保证，使得任何构建的结构之后都不会被丢弃。这一概念与以增强转换网络（ATN）解析器为代表的非确定性“猜测然后备份”方法形成了对比。虽然我们完全同意将盲目备份作为分析过程的不可或缺的一部分是不理想的，但我们认为\
  \ Marcus 关于确定性的观点忽略了所谓的“智能纠错”的可能性。例如，考虑以下句对：\n\n- John 给 Mary 一了一书。\n- John 给 Mary\
  \ 了一了一个吻。\n\n在第一句中，“gave”应该向 `C-LIST` 中添加以下结构：\n\n```\n (ATRANS ACTOR (NIL) OBJECT\
  \ (NIL) TO (POSSESSION-OF (NIL))\n FROM (POSSESSION-OF (NIL)).\n```\n\n在第二句中，“gave”仅仅是一个形式动词，这个结构是完全不合适的。然而，事实证明在概念分析器有两种处理这个问题的方法。概念分析中的第一种方法类似于\
  \ Marcus 所说的“等待并观察”句法分析：在读取“book”或“kiss”之前，不要构建任何顶层结构。第二种方法是“智能纠错”。使用这种方法，两种情况下都会构建\
  \ `ATRANS` 结构，分析器继续用合适的子结构填充空隙。然而，此时会激活一个额外的请求，其本质上是：“如果你看到另一个完整的概念，即动作或状态，而不是可以填充\
  \ `ATRANS` 槽的物体，那么那才是真正的顶层结构。从 `C-LIST` 中移除 `ATRANS`，并用在 `ATRANS` 中找到子结构填充新结构中的空隙。”无论使用这两种方法中的哪一种，沿途组装的子结构（例如“John”和“Mary”的表示）仍然可用，而这毕竟是避免备份的关键。在初始假设通常正确的情况下，智能纠错是更好的方法（Gershman,\
  \ 1979）。\n\n### 程序详细视图\n\n本节提供了关于请求的更多细节。我们将描述我们发现的完成概念分析所需的测试类型和操作，并讨论为什么它们是必要的以及在什么情况下是有用的。我们还提供了关于概念分析器控制结构的更多细节，并描述了该结构背后的动机。\n\
  \n### 请求\n\n让我们重申请求可能执行的操作：\n\n1. 向 `C-LIST` 添加一个概念结构。\n2. 用其他结构填充概念结构中的空隙。\n3.\
  \ 激活其他请求。\n4. 取消请求，包括其自身。\n\n没有限制请求只能执行这些操作中的一种。然而，请求可以只向 `C-LIST` 添加一个结构的惯对于设计词义消歧算法非常重要。结构始终被添加到\
  \ `C-LIST` 的末尾。\n\n### 填充空隙请求\n\n当一个结构填充另一个结构的空隙，或者两者都填充某个更大结构的空隙时，概念结构就是连接的。填充空隙的请求会从\
  \ `C-LIST` 中移除嵌入的概念对象。\n\n我们大致通过两种方式来描述填充空隙请求。要么请求知道它想要填充哪个空隙并寻找填充物，要么它知道填充物并寻找合适的空隙。第一类请求正在寻找某种结构以将其嵌入另一个结构中。我们已经在之前的示例中看到了许多这种类型的填充空隙请求。这些请求可能以两种方式产生：\n\
  \n1. 它们可能由构建包含它们试图填充的空隙的结构的请求所激活。\n2. 它们可能由功能词（例如“to”）引入。\n\n来自功能词的填充空隙请求尤为重要，因为如果由功能词激活的请求试图用某种结构填充某些空隙，则必须允许它这样做。如果空隙已经被其他结构填充，则该结构应该返回到\
  \ `C-LIST`。例如，考虑句子“John gave Mary to the Sheik of X”（Wilks, 1975 b)）。在读取“John gave\
  \ Mary...”之后，我们的概念分析器将假设 Mary 是给予动作的接收者，并构建：\n\n```\n (ATRANS ACTOR (JOHN) OBJECT\
  \ (NIL) TO (MARY) FROM (JOHN)).\n```\n\n然而，“to the Sheik”显然标记了 Sheik 为接收者，这种显式标记具有高优先级。因此，分析器将其表示改为：\n\
  \n```\n (ATRANS ACTOR (JOHN) OBJECT (NIL) TO (SHEIK) FROM (JOHN)).\n```\n\n概念 MARY\
  \ 被返回到 `C-LIST`，然后被作为 `ATRANS` 的 `OBJECT` 选取。\n\n第二类填充空隙请求有一个填充物，并寻找可以将其嵌入的结构。这些通常出现在名词组中的词，特别是形容词。例如，单词“red”有一个关联的请求，寻找物理对象的表示，以便用结构\
  \ RED 填充该对象的 `COLOR` 槽。这种填充空隙请求也出现在描述时间和地点设置的词中。例如，在句子“Yesterday, Fred bought a\
  \ car”（昨天，Fred 买了一辆车）中，单词“yesterday”有一个关联的请求寻找一个概念，以便填充该概念的 `TIME` 槽。\n\n\n\n\n\
  一旦某个结构中的空隙被填充，所有寻求填充该空隙的请求都应该被移除。这可以通过两种方式处理。最简单的方法是让寻求某个特定空隙的请求测试该空隙是否已被填充，如果是，则将其移除自身。这就是我们目前实现的运行方式。另一种可能性是在概念结构中的空隙与试图填充这些空隙的请求之间使用双向指针，并在控制结构中放置一个能够自动移除不必要请求的程序。Riesbeck\
  \ 的 ELI 就运用了这种方法。\n\n### 激活其他请求\n\n我们使用请求来激活其他请求主要有两个目的。首先，向短期记忆中添加某些概念结构的请求，往往会激活试图填充该结构中空隙的请求。\n\
  \n其次，请求可以通过激活测试特定输入单词的请求，并向这些单词的字典条目添加请求，来改变局部上下文中某些单词的含义（Riesbeck and Schank, 1976）。功能词是这种局部改变词义概念的一个重要实例，因为在许多情况下，它们仅针对特定的结构起起作用。\n\
  \n以单词“of”为例。它所表示的关系取决于它出现的结构。其中一种结构包括如“five yards of cloth”（五码布）或“ten pounds of\
  \ sugar”（十磅糖）之类的例子。处理这种结构的好方法是让由“yards”和“pounds”等单词的“单位”含义激活请求。该请求测试下一个单词是否是“of”。如果是，该请求激活另一个请求，寻找被该单位修饰的材料，并在找到后将“five\
  \ yards”或“ten pounds”创建的描述附加其上。\n\n通常，以这种方式局部改变某些单词的词义并不涉及丢弃直接索引在单词下的任何请求，而是仅仅对它们进行增强。通过这种方式，如果新激活的请求不适用，那么与单词关联的所有常规请求仍然可用，以便继续处理。然而，需要确保特殊添加的请求优先级高于与单词关联的常规请求。\n\
  \n### 取消请求\n\n最后一种请求动作是去激活请求的能力。该动作的一个重要用途是让请求在某些情况下自动去激活。通过这种方式，注意到自己不再适用的请求可以在破坏分析之前移除自身。例如，考虑上一节中描述的局部扩展单词“of”含义的请求。如果下一个单词不是“of”，则该请求必须去激活自身。否则，如果“of”在输入后部出现，该请求将以一种不再合适的方式改变其含义。\n\
  \n该动作有用的另一种情况是当存在多个代表对单词含义竞争性假设的请求时。代表正确含义（无论如何选择）的请求必须去激活其他请求。\n\n### 请求的测试\n\n\
  请求的测试检查输入文本的实际单词或 `C-LIST` 上的对象。到目前，我们区分了后者的两种变体：\n\n1. 在 `C-LIST` 上搜索具有正确属性的某些结构的出现。\n\
  2. 测试某些结构中的特定空隙是否已填充。\n\n显然，第一类测试所涉及的属性通常是概念性的或语义的。例如，人们可能会写一个这样的测试：“`C-LIST` 上是否存在\
  \ PP（介词短语）？”或“`C-LIST` 上是否存在一个活动性更高（higher animate）的 PP？”我们在之前讨论的示例中已经见过这类测试。但是，这些测试也可能对它们应该在\
  \ `C-LIST` 的**何处**进行查找有约束，例如，指令只在 `C-LIST` 的末尾查找，或者仅在列表中其他某个对象的之前或之后搜索。这种约束是利用从词序得出的结构信息的一种方式。换句话说，这些由测试中的谓词表示的约束，体现了与句子结构而非内容的预期。\n\
  \n每当表示结构中存在多个具有相同语义要求的空隙时，这些预期都是必要的。例如，`ATRANS` 的 `ACTOR`（施者）和 `TO`（目标）槽位都可以由“活动性更高的实体”适当填充。此时必须使用语法知识来决定结构应该填充几个合适空隙中的哪一个。\n\
  \n两个谓词对于约束在 `C-LIST` 的何处查找很有用：(1) 测试一个结构是否在 `C-LIST` 上位于另一个结构之先；以及 (2) 测试一个结构是否在\
  \ `C-LIST` 上位于另一个结构之后。例如，单词“give”的 `ATRANS` 含义会激活以下请求：\n\n```\nREQUEST—\nTEST: 你能在\
  \ C-LIST 上找到一个人类（human） \n在 ATRANS 结构之前的 吗?\nACTIONS: 将其放入 ATRANS 的 ACTOR 和 FROM\
  \ 槽中\n```\n\n请求的另一种测试类型是根据填充空隙的顺序约束，确定某个候选结构应该填充多个空隙中的哪一个。这些约束通过检查某些空隙是否已填充的测试来表示。例如，假设我们写一个请求来填充由单词“give”产生的\
  \ `ATRANS` 的 `TO` 槽。由于相同的语义约束适用于 `ACTOR` 和 `TO` 槽，我们需要一个测试来区分它们。由于在主动句中，`ACTOR`\
  \ 会在接收者之前被看到，以下请求将确保 `TO` 槽位不会被本应填充 `ACTOR` 槽位的结构错误填充：\n\n```\nREQUEST—\nTEST: 你能在\
  \ C-LIST 上找到一个人类吗，且 \nACTOR 槽位已经填充了吗?\nACTIONS: 将其放入 ATRANS 的 TO 槽中。\n```\n\n###\
  \ 搜索 C-LIST\n\n当概念级请求的测试是在 `C-LIST` 上搜索具有某些属性的对象时，概念分析中会出现一个排序问题。如果 `C-LIST` 上的多个项目都满足测试，系统如何在它们之间进行选择？让我们检查以下片段：“The\
  \ girl Fred saw in the park...”（弗雷在公园看到的那个女孩……）。读取“saw”时激活的请求会激活另一个寻找活动执行者的请求。但这里有两种可能：“那个女孩”和“弗雷”。在这种情况下，我们使用新近性规则从可能性中进行选择。也就是说，在扫描\
  \ `C-LIST` 寻找满足某些谓词的对象时，系统应该先查看最近添加的对象。\n\n### 组织请求：新近性规则\n\n概念分析理论的很大一部分是请求组织问题，这与控制如何以及何时考虑请求有关。控制问题在所有产生系统中都会出现。（欲了解良好的概述，请参见\
  \ Davis and King, 1975。）\n\n\n\n\n我们之前相当简单地假设，活动请求存储在 `R-LIST` 中。现在考虑以下例句：“Saul\
  \ ate a big red apple.”（索尔吃了一个大红苹果。）我们的直觉是，单词“apple”之前的形容词在结果用于填充由“ate”添加到 `C-LIST`\
  \ 的 `INGEST` 框架之前，就已经修改了 `APPLE` 概念。看起来，由这些形容词激活的请求，在将 `INGEST` 结构添加到 `C-LIST` 时激活的请求之前被考虑。诸此类及其他示例促使我们采用了**请求新颖性**（request\
  \ recency`）规则（这类规则在生产系统中很常见）。该规则规定，请求按照其激活的反序（从最近到最久远）进行考虑。这不仅能保证分析按照我们的直觉进行，而且是一个很好的启发式原则，因为较新的请求代表了关于可能发生情况的较新、也可能更好的信息。\n\
  \n让我们看另一个例子：“Fred told John Bill hit Mary.”当读到“told”时，会激活一个请求，向 `C-LIST` 添加一个概念结构，大致如下：\n\
  \n```\n (MTRANS ACTOR (NIL) MOBJECT (NIL) TO (NIL)).\n```\n\n此外，还会激活一些尝试填充此框架中空槽的请求。其中一个请求是在寻找一个放入\
  \ `MOBJECT` 槽的概念。然后，当读到“hit”时，会激活一个请求，它将概念结构\n\n```\n (PROPEL ACTOR (NIL) OBJECT\
  \ (NIL))\n```\n\n添加到 `C-LIST`。\n\n该请求还会激活一些新的请求，以尝试填充 `PROPEL` 框架中的空槽。即使系统已经开始扫描活动请求列表，这些新请求仍然最新。因此，努力填充\
  \ `PROPEL` 框架空隙的请求会在努力填充 `MTRANS` 框架空隙的请求之前被考虑。“Bill”被用于填充 `PROPEL` 的 `ACTOR` 槽，然后生成的结构才被用于填充\
  \ `MTRANS` 的 `MOBJECT` 槽。\n\n在许多情况下，会有多个请求同时被激活，因此这些请求具有相同的新颖性。这样的集合被称为“请求池”（`request\
  \ pool`）。因此，为了实现新颖性规则，我们的程序使用有序的请求池列表，每个池包含一个或多个请求。\n\n新颖性规则的主要意义在于，如果一个概念结构 `A`\
  \ 将被用于填充另一个结构 `B` 中的空隙，那么在 `A` 被嵌入 `B` 之前，它有机会先填充自己的空隙。因此，在示例“Fred told John Bill\
  \ hit Mary”中，在 `PROPEL` 结构嵌入 `MTRANS` 之前，“Bill”被用于填充 `PROPEL` 的 `ACTOR` 槽。在处理术语中，新颖性规则的效应可以表示如下：如果组装和修改低层结构的请求与将这些子结构组装成高层结构的请求同时激活，那么者的优先级优于后者。\n\
  \n请求在池内部是如何组织的？显然需要某种程度的层次结构，因为专门添加以改变某些局部语境中单词含义的请求必须保证优先权。\n\n除了这种层次化组织外，请求还根据它们执行的操作在池内进行组织。例如，假设同一池中的几个请求都向\
  \ `C-LIST` 添加结构，并进一步假设其中多个请求具有真值测试（true test）。这就是词义歧义在概念分析器中的表现方式，问题在于选择正确的请求。控制请求考虑的算法不仅必须对请求进行排序，有时必须在它们之间进行选择，或者让它们全部等待更多信息。\n\
  \n### 名词组\n\n按照我们目前描述的思路实现的分析器，在处理包含多个名词的名词组时将面临极大困难。问题是，概念可能会错误地使用某些中间概念结构来填充空隙。例如，考虑句子“George\
  \ sat on the stairway handrail.”（乔坐在楼梯扶手上。）代表“sat”的概念似乎有一个关于执行者所坐的对象的空槽，以及一个尝试填充该槽的请求（我们同意称其为\
  \ `OBJECT` 槽）。由于楼梯是一个完美的座椅物体，到目前为止的算法将允许该请求在整个名词组分析完成之前就用“stairway”填充其槽位。因此，问题在于如何某种程度上防止任何尝试填充\
  \ `OBJECT` 槽的请求过早触发，或者在这种情况发生时纠正局面。很显然，在分析名词组时，控制结构必须以与目前描述不同的方式考虑请求。我们的问题仍然是控制请求考虑的问题。\n\
  \n为了处理这个问题，我们在名词组中使用以下程序进行请求考虑：只考虑与每个输入词相关的请求，直到名词组结束。也就是说，如果程序处于名词组中，并且输入了一个新词，则只考虑与该词相关的新激活的请求。在名词组完成之前，不考虑先前的请求。\n\
  \n有了这条在名词组期间处理请求的规则，代表“stairway handrail”的整个结构将在尝试填充坐动作的 `OBJECT` 槽的请求被考虑*之前*构建完成。\n\
  \n这条控制请求考虑的规则还具有额外效应，即确保名词组的主头名词在形容词附加之前被发现。例如，考虑该算法如何分析输入“blue car seat”。首先，与单词“blue”相关的请求会被激活。此类请求将尝试填充右侧某个物理对象的\
  \ `COLOR` 槽。接下来，与单词“car”相关的请求将向 `C-LIST` 添加一个代表汽车概念的结构。然而，由于分析器处于名词组模式，来自“blue”的先验预期在此时*不会*被考虑。最后，读到单词“seat”，另一个结构被添加到\
  \ `C-LIST`。现在，代表“car seat”的结构被建立，然后考虑与“blue”相关的请求。它会将“蓝色的”这一属性分配给座椅，而不是汽车。在某些情况下，当然这可能是错误的，例如，“red\
  \ stairway railing”可能指的是红色楼梯的扶手，而不是楼梯的红色扶手。我们认为，对这类问题的通用解决方案将取决于对内存在大解析中作用的更好理解。然而，这里描述的过程具有优点，即允许名词组在生成的分析被用于更大的结构之前完成。例如，如果短语“blue\
  \ car seat”被嵌入句子“George sat on the blue car seat,”，那么分析将确定乔坐在座椅上，而不是坐在汽车上。\n\n为了使用我们上面勾勒的过程，分析器必须首先按新颖性组织请求，其次要能够确定它何时应该进入名词组模式，何时应该进入普通模式。我们略微修改并使用了\
  \ Gershman 的 (1977) 启发式方法来确定名词组边界。这些规则中某些取决于概念知识，另一些取决于语法知识。\n\n### 消歧算法\n\n\n\n\
  \n使用 `requests` 来检查上下文以消除歧义，不需要对概念分析器的控制结构进行任何特殊添加，因为这项工作是由 `requests` 完成的。然而，使用上下文在竞争性请求之间进行选择，则需要增强控制请求考虑的机制。我们将仅利用那些当一个结构可以填补另一个结构的空隙时，产生的结构之间明显的连接。算法应该是灵活的，这意味着如果没有足够的证据来做出选择，系统必须能够等待并在稍后重试。\n\
  \n我们假设请求根据其动作组织在池（pools）中，并且我们关注那些试图为 `C-LIST` 添加某些结构的请求。在每个池中控制这些请求的机制必须在每次考虑这些请求时都应用。该机制的工作原理如下：\n\
  \n1. 收集所有通过 `true` 测试的请求。\n2. 如果有多个请求通过了 `true` 测试，则检查这些请求为 `C-LIST` 增加的结构，看它们是否能填补\
  \ `C-LIST` 上已有的其他结构的空隙，或者是否可以使用其他结构来填补它们自己的空隙。\n\n在此时，可能会发生三种情况：没有请求通过这种连接检查，只有一个请求通过，或者多个通过。第一种情况很容易处理：\n\
  \n* **3a** 如果没有请求通过连接检查（步骤 2），则不应允许任何请求触发（即推迟做出决定）。\n\n第二种情况也相对容易，尽管如果做出的选择被证明是糟糕的，就会产生复杂性：\n\
  \n* **3b** 如果只有一个请求通过了连接检查（步骤 2），则执行该成功请求的动作并停用其余请求。\n\n第三种情况相当困难：\n\n* **3c** 如果上述情况都不适用，则不执行任何请求。需要做出更复杂的决策。\n\
  \n这第三种情况需要推迟决策，直到发现其中一个结构是“连接性最强”的。在 Wilks 的系统中（`1976`）中，“连接性最强”指的是“连接最多”的，我们也使用这一衡量标准。然而，Wilks\
  \ 的分析器仅在本质上的句子边界处执行这种比较，在此之前不排除任何可能性；而我们的系统则选择第一个变得比任何其他结构都更有连接性的结构。在这一多个请求通过连接检查的第三种情况下，那些没有通过的请求似乎可以立即被停用，从而相当快速地减少可行替代方案的集合。\n\
  \n上述概述的某些歧义过程对概念分析器的控制结构提出了了新要求。特别是，我们经常依赖于某些单词的输入顺序与关联结构在 `C-LIST` 中位置之间相当一致的对应关系。但由于向\
  \ `C-LIST` 添加结构的请求可能会被歧义过程阻止立即触发，这种对应关系已不再可能发生。解决方案是稍微改变控制和数据结构，以保证输入顺序与 `C-LIST`\
  \ 上顺序之间的关系。最简单的方法如下：每当一个请求池被激活时，在 `C-LIST` 中都要添加一个新的空节点。如果该池中的某个请求向 `C-LIST` 添加了结构，它应该将其添加到对应的节点中，而不是像之前描述的那样添加到末尾。因此，`C-LIST`\
  \ 由此类节点的列表组成，其中一些节点带有结构，另一些是空的。空节点通常有相关的尝试在该位置向 `C-LIST` 添加结构的请求。\n\n## 详细示例\n\n\
  本节介绍了一个概念分析器实际如何运行的详细示例。我们将使用的输入是：“一架装载了 1500 磅大麻的小飞机在离此南 10 英里处坠毁。”展示的词典条目虽然不是通用，但说明了分析器必须执行的各种动作。该示例将追踪执行监控器，描述在分析句子时\
  \ `C-LIST` 和请求池的状态。我们假设在开始时 `C-LIST` 为 `NIL` 且没有请求池。（注意：请求名称（`REQ1`、`REQ2` 等）在解析过程中动态生成。为了清晰起见，我们已将其添加到了示例定义中。）\n\
  \n### 获取下一个项目\n句子第一个单词是“A”。程序从普通模式切换到名词组模式。（当前模式通过使用 Gershman 的（`1977`）关于名词组边界的启发式方法来确定。）\n\
  \n### 考虑寻找特定单词的请求\n（没有。）\n\n```\n 从词典条目加载请求：单词“a”的条目是：\n(DEF A\n (REQUEST REQ1\n\
  \ [TEST: ‘‘找到‘a’ 之后的概念“]\n [ACTIONS: “向它添加 (REF (INDEF))”]]\n```\n\n该请求被系统命名为 `REQ1`\
  \ 并在 `POOL-1` 中激活。此请求添加了空隙 `REF`，并用 `INDEF` 填充了它。\n\n### 考虑名词组模式下的请求\n`REQ1` 被考虑但没有触发。\n\
  \n### 获取下一个项目\n“small”。\n\n### 考虑寻找特定单词的请求\n（没有。）\n\n### 从词典条目加载请求\n“small”的条目是：\n\
  \n```\n (DEF SMALL\n (REQUEST REQ2\n [TEST: “在 C-LIST 上从 small 之后寻找 PP”]\n [ACTIONS:\
  \ “向它添加 (SIZE (SMALL))”]]\n```\n\n该请求被系统命名为 `REQ2` 并在 `POOL-2` 中激活。\n\n### 考虑名词组模式下的请求\n\
  `REQ2` 被考虑但没有触发。\n\n### 获取下一个项目\n“plane”。\n\n### 考虑寻找特定单词的请求\n（没有。）\n\n### 从词典条目加载请求\n\
  “plane”的条目是：\n\n```\n (DEF PLANE\n (REQUEST REQ3\n [TEST: T]\n [ACTIONS: “向 C-LIST\
  \ 添加 (PP CLASS (VEHICLE) TYPE (AIRPLANE))”]]\n```\n\n记得所有结构都添加到 `C-LIST` 的末尾。该请求被系统命名为\
  \ `REQ3` 并在 `POOL-3` 中激活。\n\n### 考虑普通模式下的请求\n`REQ3` 被考虑并触发。结果是 `POOL-3` 现在为空，`C-LIST\
  \ = (CON 1)`，其中 `CON1 = (PP CLASS (VEHICLE) TYPE (AIRPLANE))`。\n\n### 获取下一个项目\n\
  “stuffed”。程序从名词组切换到普通模式。记得普通模式要求执行监控器立即考虑所有请求。因此，监控器从新到旧检查所有的请求池。`REQ2` 和 `REQ1`\
  \ 都触发了，结果是所有请求池都为空，且 `CON1 = (PP CLASS (VEHICLE) TYPE (AIRPLANE) SIZE (SMALL) REF\
  \ (INDEF))`。\n\n### 考虑寻找特定单词的请求\n（没有。）\n\n### 从词典条目加载请求\n“stuffed”的条目是：\n\n```\n\
  \ (DEF STUFFED\n (REQUEST REQ4\n [TEST: T]\n [ACTIONS:\n “将 STRO 设置为 (PTRANS ACTOR\
  \ (NIL)\n OBJECT (NIL)\n TO (INSIDE PART (NIL)))\n 将 STRO 添加到 C-LIST”\n “激活\n (REQUEST\
  \ REQ5\n [TEST: “下一个单词是 WITH”]\n [ACTIONS: “在下一个池中激活，标记为高优先级：\n (REQUEST REQ6\n\
  \ [TEST: “找到 C-LIST 且 (TO PART) 槽已填充”]\n [ACTIONS: “将其放入 STR0 的 OBJECT 槽中”])\n (REQUEST\
  \ REQ7\n [TEST: “在 C-LIST 上找到 STR0 之前的 PP”]\n [ACTIONS: “向它添加 (REL (STRO)) 并\n将其放入\
  \ (TO PART) 槽中”]]]\n```\n\n当执行请求时，局部变量 `STR0`（由系统符号替换）设置为 `PTRANS`。`STRO` 用于供其他请求引用结构。该请求被系统命名为\
  \ `REQ4` 并在 `POOL-4` 中激活。\n\n### 考虑普通模式下的请求\n`REQ4` 被触发，所以现在 `C-LIST « (CON1 CON2)`，其中\
  \ `CON2` 是 `PTRANS`。\n\n\n\n\n\n### 考虑寻找特定单词的请求\n`REQ5` 被触发。由于 `REQ5` 动作的性质，执行监控继续运行，并注意到它必须向下一个请求池中添加两个新请求：`REQ6`\
  \ 和 `REQ7`。\n\n### 加载字典条目下的请求\n在此例中，“with”下方列出的请求是什么并不重要，因为由 `REQ5` 添加的请求是该词在局部语境下的正确含义。因此，在构建\
  \ `POOL-5` 时，`REQ6` 和 `REQ7` 被添加到其中。它们的优先级高于字典中在“with”下列出的标准请求。\n\n### 考虑普通模式下的请求\n\
  构建 `REL` 结构的 `REQ7` 被触发，现在 `C-LIST` = (CON1)，其中 `CON1` =：\n\n```\n (PP CLASS (VEHICLE)\n\
  \ TYPE (AIRPLANE)\n SIZE (SMALL)\n REL (PTRANS ACTOR (NIL)\n OBJECT (NIL)\n TO (INSIDE\
  \ PART (CON1))))\n```\n\n唯一剩余的激活请求是 `REQ6`，它试图填充 `PTRANS` 的 `OBJECT` 槽。\n\n### 获取下一个项目\n\
  “1500”。执行监控切换到名词组模式。\n\n### 考虑寻找特定单词的请求\n（没有。）\n\n### 从字典条目中加载请求\n程序识别出“1500”是一个数字，为了方便起见，生成了对应的字面量原子\
  \ `*1500*`，其定义如下：\n\n```\n (DEF *1500*\n (REQUEST REQ8\n [TEST: T]\n [ACTIONS: “add\
  \ (NUM VAL (1500)) to C-LIST”]]\n```\n\n该请求被系统命名为 `REQ8`，并在 `POOL-6` 中激活。\n\n###\
  \ 考虑名词组模式下的请求\n`REQ8` 被触发，`C-LIST` = (CON1 CON3)，其中 `CON3` = (NUM VAL (1500))。\n\
  \n### 获取下一个项目\n“pounds”。\n\n### 考虑寻找特定单词的请求\n（没有。）\n\n### 从字典条目中加载请求\n“pound”的条目为：\n\
  \n```\n (DEF POUND\n (REQUEST REQ9\n [TEST: T]\n [ACTIONS:\n “Set STR0 to (UNIT\
  \ TYPE (LB)\n NUMBER (NIL))\n Add STRO to C-LIST”\n “activate\n (REQUEST REQ10\n\
  \ [TEST: “find a number preceding STR0\non the C-LIST”]\n [ACTIONS: “put it in the\
  \ NUMBER slot of STR0”])\n (REQUEST REQ11\n [TEST: “next word is OF”]\n [ACTIONS:\n\
  \ “activate in the next pool, marked high priority:\n (REQUEST REQ12\n [TEST: “if\
  \ you find a PP on C-LIST following STR0”]\n [ACTIONS: “add (AMOUNT STRO) to it”]]]\n\
  ```\n\n该请求被系统命名为 `REQ9` 并在 `POOL-7` 中激活。\n\n### 考虑名词组模式下的请求\n`REQ9` 被触发，因此 `C-LIST`\
  \ = (CON1 CON3 CON4)，其中 `CON4` 是“pounds”的。此外，寻找数字的请求作为 `REQ10` 在 `POOL-8` 中激活，它应该在名词组模式下被考虑。另一个请求在测试特定单词的请求池中作为\
  \ `REQ11` 被激活。`REQ10` 触发，`C-LIST` = (CON1 CON4)，其中 `CON4` = (UNIT TYPE (LB) NUMBER\
  \ (NUM VAL (1500)))。\n\n### 获取下一个项目\n“of”。\n\n### 考虑寻找特定单词的请求\n`REQ11` 被触发，由于其动作的性质，执行监控继续运行，注意到它必须向下一个请求池中添加一个新请求\
  \ `REQ12`。\n\n### 从字典条目中加载请求\n同样，由于该词的含义在局部发生了变化，它们是什么并不重要。然而，构建了 `POOL-9`，`REQ12`\
