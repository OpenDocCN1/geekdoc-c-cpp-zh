  \ 能够处理以下较为复杂的故：\n\n```\n (SETQ LIQUOR-STORE-STORY\n ‘(\n<sup>-</sup>John wanted\
  \ money\n (GOAL (PLANNER (NAME (JOHN))))\n(OBJECTIVE (POSS (ACTOR (NAME (JOHN))))\n\
