  \ (EQUAL *WORD* ‘HOME))\n (ASSIGN GO-VAR2 ‘(HOUSE]\n```\n\n由于请求没有 `TEST`，数据包被移除，请求被执行并设置了各种变量。特别是，`PART-OF-SPEECH`\
  \ 现在是 `VERB`，`CD-FORM` 拥有 `PTRANS` CD，且 `GO-VAR1` 拥有 `SUBJECT` 的值，即 `(PERSON (NAME\
  \ (JACK)))`。注意，CD 形式中指出了变量 `GO-VAR1`、`GO-VAR2` 和 `GO-VAR3`，但在变量被设置为初始值时并未被使用。McELI\
  \ 在分析完成后会从 CD 形式中移除带有问号的项。\n\n现在栈顶看起来：\n\n```\n TOP OF STACK:\n(((TEST (EQUAL *PART-OF-SPEECH*\
  \ ‘VERB))\n (ASSIGN *CONCEPT* *CD-FORM*]\n```\n\n`TEST` 为真，因此变量 `CONCEPT` 被设置为 `CD-FORM`\
  \ 的值，即 `PTRANS` CD 形式，且栈变空。\n\n现在，被触发的（`WENT`）的请求的 `NEXT_PACKET` 子句被放在栈顶：\n\n```\n\
