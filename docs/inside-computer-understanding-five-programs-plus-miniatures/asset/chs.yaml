  \ (ASSIGN GO-VAR2 ‘(HOUSE]\n```\n\n注意这个数据包包含两个请求。现在 `WORD` 被设置为 `HOME`，`HOME` 的数据包被放在栈顶端：\n\
  \n```\n TOP OF STACK:\n (((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE))\n (ASSIGN\
  \ *SUBJECT* *CD-FORM*)\n (NEXT-PACKET\n ((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n\
