  ```lisp\n(DSP LOC\n  (SAY-SUBJ-VERB (ACTOR) ‘BE)\n  (OR (EQUAL $(VAL) ‘7UNSPEC)\n\
  \      (SAY-PREP ‘NEAR ‘VAL)))\n```\n\n`CONT` 转到 `HAVE`。\n\n```lisp\n(DSP CONT\n\
  \  (SAY-SUBJ-VERB (VAL) ‘HAVE) (SAY-FILLER ‘ACTOR))\n```\n\n`MLOC` 可能会转到 `KNOW-THAT`\
  \ 或 `THINK-THAT`。\n\n```lisp\n(DSP MLOC\n  (SAY-SUBJ-VERB (VAL PART)\n  (COND ((OR\
