  \n## 引言\n\nMcELI 是英语语言解释器 `ELI` 的微版本（Riesbeck, 1978）。因此，它也是上一章中描述的概念分析器（Conceptual\
  \ Analyzer）的微版本。McELI 负责将英语句子转换为 CD 形式。\n\nMcELI 逐词地读取句子。大多数单词都关联有小型程序，规定了这些单词在不同语境下的含义以及如何与其他单词组合。句子的分析结果取决于这些程序的执行。\n\
  \n附加到单词上的程序被称为 `packets`（包）。每个数据包都是 `requests`（请求）的列表，每个请求的形式如下：\n\n```\n ((TEST\
  \ expression)\n(ASSIGN variable expression variable expression…)\n(NEXT-PACKET request\
  \ request…))\n```\n\n其中\n\n1.  `(TEST…)` 表示请求何时可以执行。当测试表达式为真时，该请求被认为已 `triggered`（触发）。\n\
  2.  `(ASSIGN …)` 将每个变量赋值给其其后的表达式。这仅在请求被触发时才执行。变量存储了分析的结果。\n3.  `(NEXT-PACKET…)`\
  \ 在请求被触发且变量已赋值后，提供一个需要加载的请求包。\n\n在特定的请求中，这些部分的任何部分都可以省略。\n\n当 McELI 读取一个单词时，它会查找该单词的数据包，并将该数据包放在之前加载的数据包栈的顶端。然后，它查看栈顶数据包中的请求。如果栈顶数据包中的某个请求被触发，它就会被执行，整个数据包被从栈中移除，并查看栈中的下一个数据包。\n\
  \nMcELI 的控制流如下：\n\n```\n WHILE SENTENCE 中还有另一个单词\n DO 从 SENTENCE 中移除该单词\n 将该单词的包添加到\
  \ STACK\n WHILE STACK 中有一个包\n AND 栈顶包中的某个请求被触发\n DO 从 STACK 中移除该包\n 执行请求中的赋值操作\n\
  \ 将请求保存到 TRIGGERED 列表中\n END WHILE\nWHILE TRIGGERED 中有一个请求\n DO 从 TRIGGERED 中移除该请求\n\
  \ 将请求的 next-packet 添加到栈\n END WHILE\nEND WHILE\n返回由请求构建的 CD\n```\n\n注意，一旦发现包中存在测试为真的请求，它就会被触发，且不再查看该包中的其他请求。同样注意，在栈清空或栈顶包没有被触发的请求之前，触发请求的\
  \ `NEXT-PACKET` 不会被加载。这意味着在可以被移除的数据包确实被移除之前，其他内容不会被添加到栈中。\n\n### 示例定义\n\nMcELI 通过\
  \ `DEF-WORD` 函数将定义包分配给单词。具体来说，\n\n```\n (DEF-WORD word request! request2…)\n```\n\
  \n为单词附加一个包含 `request!` `request2…` 的包。\n\n从字典条目加载请求：再次，由于“of”的含义会在局部发生变化，因此字典中“of”的请求包含什么并不重要。然而，`REQ23`\
  \ 在 `POOL-18` 中被激活。\n\n在名词组模式下考虑请求：`REQ23` 被考虑但未触发。\n\n获取下一个项目：“here”。\n\n考虑寻找特定单词的请求：（没有）。\n\
  \n从字典条目加载请求：在这种情况下，条目为：\n\n```\n (DEF HERE\n (REQUEST REQ24\n [TEST: T)\n [ACTIONS:\
  \ “add (HERE) to C-LIST”]]\n```\n\n这变成了 `POOL-19` 中的 `REQ24`。（“here”的表示仅仅是一个占位符。在新闻故事理解器中，它会被日期行信息替换。）\n\
  \n在名词组模式下考虑请求：`REQ24` 被触发，并将 `C-LIST` 修改为 `(CON6 CON9 CON10)`。\n\n获取下一个项目：“period”。切换到执行监控的正常模式。这意味着检查所有请求。`REQ24`\
  \ 被触发且 `C-LIST = (CON6 CON9)`，其中 `CON9 =$\n\n```\n (LOC PROX (HERE)\n DIR (SOUTH)\n\
  \ DIST (UNIT TYPE (MILE) NUMBER (NUM VAL (10))))\n```\n\n然后考虑并触发了 `REQ17`，将 `CON6`\
  \ 的 `PLACE` 槽填充为 `CON9`。由于句号表示句子的结束，不再有活跃的请求。分析已经构建了一个完整的概念化，我们完成了。`C-LIST = (CON6)`，其中\n\
  \n```\n CON6 =\n(PROPEL ACTOR (CON1)\n OBJECT (PP CLASS (PHYSOOBJ) TYPE (GROUND))\n\
  \ PLACE (CON9))\nCON1 =\n(PP CLASS (VEHICLE)\n TYPE (AIRPLANE)\n SIZE (SMALL)\n\
  \ REF (INDEF)\n REL (PTRANS ACTOR (NIL)\n OBJECT\n (PP CLASS (PHYSOOBJ)\n TYPE (MARIJUANA)\n\
  \ AMOUNT\n (UNIT TYPE (LB)\n NUMBER (NUM VAL (1500))))\n TO (INSIDE PART (CON1))))\n\
  CON9 =\n(LOC PROX (HERE)\n DIR (SOUTH)\n DIST (UNIT TYPE (MILE)\n NUMBER (NUM VAL\
  \ (10))))\n```\n\n### 示例分析\n\n当 McELI 开始分析任何句子时，它会将栈初始化为包含以下这个包含一个请求的数据包：\n\n\n\n\
  \n\n```\n TOP OF STACK:\n((ASSIGN *PART-OF-SPEECH* NIL\n *CD-FORM* NIL\n *SUBJECT*\
  \ NIL\n *PREDICATES* NIL)\n (NEXT-PACKET\n ((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE))\n\
  \ (ASSIGN *SUBJECT* *CD-FORM*)\n (NEXT-PACKET\n ((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n\
  \ (ASSIGN *CONCEPT* *CD-FORM*]\n```\n\n这个数据包来自伪词 `START` 的定义，它在每个句子的开头被处理。该数据包中的请求清除了了一些变量，并在栈中添加了一个新数据包，其中包含一个寻找名词短语的请求。该请求被触发时，会设置\
  \ `SUBJECT` 并添加另一个包含寻找动词请求的数据包。该请求随后会设置 `CONCEPT`。\n\n让我们详细追踪对“Jack went home”的分析。首先，`START`\
  \ 的数据包被放入栈中。它包含一个没有 `TEST` 的请求。如果一个请求没有 `TEST`，它就会被立即触发。因此，该数据包从栈中移除，请求被执行。`ASSIGN`\
  \ 子句通过将 `PART-OF-SPEECH` 和 `CD-FORM` 设置为 `NIL` 来清空这些变量。\n\n在赋值完成后，再次检查栈，但现在栈是空的。因此，被触发请求的\
  \ `NEXT-PACKET` 子句被放在栈顶端：\n\n```\n TOP OF STACK:\n (((TEST (EQUAL *PART-OF-SPEECH*\
  \ ‘NOUN-PHRASE))\n (ASSIGN *SUBJECT* *CD-FORM*)\n (NEXT-PACKET\n ((TEST (EQUAL *PART-OF-SPEECH*\
  \ ‘VERB))\n (ASSIGN *CONCEPT* *CD-FORM*]\n```\n`WORD` 被设置为 `JACK`，`JACK` 的数据包被放在栈顶端：\n\
  TOP OF STACK:\n (((ASSIGN *CD-FORM* ‘(PERSON (NAME (JACK)))\n  *PART-OF-SPEECH*\
  \ ‘NOUN-PHRASE]\n```\n\n由于没有 `TEST`，该数据包被移除，请求被执行。`ASSIGN` 子句将 `CD-FORM` 设置为 `(PERSON\
  \ (NAME (JACK)))`并将 `PART-OF-SPEECH` 设置为 `NOUN-PHRASE`。现在栈顶又是初始的数据包：\n\n```\n TOP\
  \ OF STACK:\n(((TEST (EQUAL *PART-OF-SPEECH* ‘NOUN-PHRASE))\n (ASSIGN *SUBJECT*\
  \ (CD-FORM*)\n (NEXT-PACKET\n ((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n (ASSIGN *CONCEPT*\
  \ *CD-FORM*]\n```\n\n这次 `TEST` 为真，因此数据包从栈中移除，请求被执行。这把变量 `SUBJECT` 设置为 `CD-FORM`\
  \ 的值，即 `(PERSON (NAME (JACK)))`。\n\n现在栈是空的，因此被触发的（`WENT`）的 `NEXT-PACKET` 子句被放入栈中：\n\
  \n```\n TOP OF STACK:\n (((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n (ASSIGN *CONCEPT*\
  \ *CD-FORM*]\n```\n\n`WORD` 被设置为 `WENT`，`WENT` 的数据包被放在栈顶端：\n\n```\n TOP OF STACK:\n\
  \ (((ASSIGN *PART-OF-SPEECH* ‘VERB\n *CD-FORM* ‘(PTRANS (ACTOR ?GO-VAR1)\n (OBJECT\
  \ ?GO-VAR1)\n (TO ?GO-VAR2) (FROM ?GO-VAR3))\n GO-VAR1 *SUBJECT*\n GO-VAR2 NIL\n\
  \ GO-VAR3 NIL)\n(NEXT-PACKET\n ((TEST (EQUAL *WORD* ‘TO))\n (NEXT-PACKET\n ((TEST\
