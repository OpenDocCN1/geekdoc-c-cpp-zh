  \ 子句被放入栈：\n\n```\n TOP OF STACK:\n (((TEST (EQUAL *PART-OF-SPEECH* ‘VERB))\n (ASSIGN\
  \ *CONCEPT* *CD-FORM*]\n```\n\n`TEST` 为真，所以变量 `CONCEPT` 设置为 `CD-FORM` 的值，即 `PTRANS`\
