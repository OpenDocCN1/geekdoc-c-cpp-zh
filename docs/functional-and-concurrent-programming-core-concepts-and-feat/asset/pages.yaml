- pgno: 113
  md: "Even though one uses a loop and the other uses recursion, these two implementations\
    \ are fairly similar. Recursive calls to doSearch bring the computation back to\
    \ the calculation of a new midpoint, just like the loop does. Indeed, function\
    \ doSearch is tail recursive and is compiled in Scala as a loop. Thus, instead\
    \ of invoking doSearch again, the recursive calls are implemented by updating\
    \ a local variable—either from or to—and by jumping back to the beginning of the\
    \ function, just like in the loop variant. After compilation, both implementations\
    \ use bytecode that, for all practical purposes, is equivalent. Which one you\
    \ decide to write is a matter of taste.\n\nSometimes, tail recursion happens quite\
    \ naturally, without having to think too much about it, as in the binary search\
    \ example. Function last from Listing 6.4, for instance, is tail recursive too.\
    \ Of course, it is also incorrect, but that can be fixed without losing tail recursion:\n\
    \n```\n@tailrec\ndef last[A](list: List[A]): A = list match\n  case Nil      \
    \  => throw NoSuchElementException(\"last(empty)\")\n  case head :: tail => if\
    \ tail.isEmpty then head else last(tail)\n```\n\nListing 6.10: Correct tail recursive\
    \ implementation of last; fixed from Lis. 6.4.\n\nSometimes, though, a function\
    \ is not naturally tail recursive. For instance, the factorial function from Listing\
    \ 6.2 is not tail recursive. The recursive call is not in a tail position: After\
    \ control returns from it, the number still needs to be multiplied by n before\
    \ a value is returned. If you need an optimized implementation that does not grow\
    \ the execution stack, you can switch back to using a while-loop, if the programming\
    \ language supports it. Otherwise, you need to rewrite the recursive function\
    \ slightly differently. The standard trick consists of adding a second argument\
    \ that serves as an accumulator for the value being calculated:\n\n```\ndef factorial(n:\
    \ Int): Int =\n  @tailrec\n  def loop(m: Int, f: Int): Int = if m == 0 then f\
    \ else loop(m - 1, m * f)\n\n  loop(n, 1)\n```\n\nListing 6.11: Tail recursive\
    \ implementation of factorial; contrast with Lis. 6.2.\n\nThe second argument\
    \ of function loop contains the part of the factorial already calculated, ∏_{i=m+1}^{n}\
    \ i. The multiplication m * f takes place before the recursive call, which is\
    \ now in tail position. Function loop is tail recursive, and is compiled as a\
    \ loop. However, the elegance of the simple recursive implementation from Listing\
    \ 6.2 is somewhat lost.\n\nFunctions that involve multiple recursive calls are\
    \ never tail recursive—at most one recursive call can be in tail position. Can\
    \ they be made tail recursive? Yes, but at the cost of introducing additional\
    \ data structures. Consider, for instance, the case of function size on binary\
    \ trees in Listing 6.7. This function makes two recursive calls,"
