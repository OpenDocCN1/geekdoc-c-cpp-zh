  md: '# # Chapter 19


    # ## Thread-Safe Objects


    The most common way threads interact is by sharing objects. Objects that can be
    freely shared without the need for threads to coordinate accesses are said to
    be thread-safe. Immutable objects are naturally thread-safe, but mutable objects
    need to rely on internal strategies to ensure thread-safety, often by locking.
    Different locking designs allow thread-safe objects to expose more or less of
    their synchronization strategy, resulting in a trade-off between flexibility and
    risk of misuse.




    Earlier examples have shown that programs can easily behave incorrectly when data
    is shared by multiple threads. What all these examples have in common is that
    the data being shared is mutable: an integer variable declared as var, an instance
    of AtomicInteger, or a mutable list backed by an array.


    Indeed, many of the difficulties of concurrent programming stem from sharing mutable
    data. Mutable objects are not naturally thread-safe because of unpredictable write/write
    and read/write concurrent accesses. By contrast, immutable objects are readable
    but not writable and can be freely shared among threads without additional synchronization.


    The following example uses three threads to run a collection of tasks stored in
    an immutable data structure:


    ```

    ```scala

    val tasksA: List[Runnable] = ...

    val tasksB: List[Runnable] = ...


    val duties: Map[Int, List[Runnable]] = Map(1 -> tasksA, 2 -> tasksB, 3 -> tasksB)


    def runTasks(id: Int): Unit = for task <- duties(id) do task.run()


    val t1 = Thread(() => runTasks(1), "T1")

    val t2 = Thread(() => runTasks(2), "T2")

    val t3 = Thread(() => runTasks(3), "T3")


    t1.start(); t2.start(); t3.start()

    ```

    ```


    Listing 19.1: Example of threads freely sharing immutable objects.'
