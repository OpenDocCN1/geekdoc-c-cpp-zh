    # NOTE


    Given my intent to prepare developers for a variety of languages, I often use
    higher-order functions in code examples instead of for-do or for-yield, especially
    outside of case studies. This is a choice I made for pedagogical reasons, to better
    emphasize the similarities of patterns across languages, but it tends to result
    in Scala code that is not always idiomatic. Readers with Scala experience will
    forgive me.


    # 10.10 Summary


    +   - The functions presented in this chapter form a core set of higher-order
    functions commonly found in functional libraries. They are often available on
    many types, such as streams and collections, but also options and futures.

    +   - Several functions use a predicate—a Boolean function—as their argument.
    They are used to find, count, filter, or assert the existence of elements that
    satisfy this predicate.

    +   - Function map is used to apply an arbitrary transformation to elements within
    a structure and produces a new structure that contains the transformed values.
    If an operation is applied to elements for the purpose of side effects only, and
    no resulting structure is needed, function foreach can be used instead of map.

    +   - Function flatMap is similar to map but takes care of “flattening” nested
    structures, like lists of lists or options of options. This function is powerful
    and can be used to apply a computation with optional output to an optional input
    (to avoid an option of option), or to handle an event that triggers a new stream
    of events (to avoid a stream of stream), or to asynchronously transform a value
    that is itself calculated asynchronously (to avoid a future of future).

    +   - Fundamentally, foreach, map, flatMap, and filter (or withFilter) are used
    to transform the contents of a structure (e.g., list, option, future) from outside
    the structure. This common pattern is sometimes supported by syntax at the language
    level, like Scala’s for-comprehension or Python’s list comprehension.

    +   - Folding functions are used to reduce the elements of a structure into a
    single value using a combining operator. Many computations that would process
    the elements of a collection iteratively can be implemented in terms of a folding
    function.'
