- pgno: 457
  md: "the remaining strategies.¹ (See Sections 12.8 and 12.9 for an introduction\
    \ to using views and iterators in this programming style.)\n\n# 28.2 Sequential\
    \ Implementation with Timeout\n\nThe implementation just described ignores strategies\
    \ that return an empty option, but it does not handle strategies that fail by\
    \ continuing to run—a common behavior with theorem provers and other searches\
    \ based on heuristics. In particular, compute may keep running forever if it gets\
    \ stuck with a non-terminating strategy.\n\nYou can write a better implementation\
    \ that takes an additional argument as a timeout, in seconds:\n\n```\nclass Runner[A,\
    \ B](strategies: Seq[Strategy[A, B]]):\n  def compute(input: A, timeout: Double):\
    \ Option[B] =\n    val exec = Executors.newSingleThreadExecutor()\n    val tasks\
    \ = strategies.map(strategy => strategy(input))\n\n    val future: Future[Option[B]]\
    \ = exec.submit { () =>\n      tasks.view.flatMap(task => task.run()).headOption\n\
    \    }\n    exec.shutdown()\n\n    try future.get((timeout * 1E9).round, NANOSECONDS)\n\
    \    catch\n      case _: TimeoutException =>\n        for task <- tasks do task.cancel()\n\
    \        None\n```\n\nListing 28.1: A sequential runner of strategies with timeout.\n\
    \nYou cannot afford to use the thread that invokes compute to directly evaluate\
    \ strategies because it could get stuck—possibly uninterruptibly—inside a run\
    \ method that does not terminate before the timeout. Instead, you can create a\
    \ separate thread—as a single-thread executor—and use it to run all the strategies,\
    \ sequentially. This run produces a future of type java.util.concurrent.Future,\
    \ which the first thread can use to retrieve the result.\n\nYou implement the\
    \ desired timeout by using a variant of the get method that throws an exception\
    \ if the future is not completed before a specified amount of time has elapsed.\
    \ Note that the time it takes to create the tasks and to start the second thread\
    \ is assumed to be negligible and is not taken into account: The entire timeout\
    \ duration is spent on the get method. Other runner implementations in this chapter\
    \ will refine this assumption.\n\n¹You could implement this approach as a loop\
    \ with a break statement in an imperative language. I use a functional style here\
    \ because Scala has no break statement."
