  md: '# 2.10 Type Parameters


    In many typed programming languages, functions can be parameterized by types.
    What this means is that a function not only uses typed arguments, but the types
    of these arguments (and the type of the return value) are themselves arguments
    of the function. This is known as parametric polymorphism, sometimes referred
    to as generics (Java) or templates (C++). Consider function first, which returns
    the first element of a pair:


    ```

    // DON''T DO THIS!

    def first(pair: (Any, Any)): Any = pair(0)

    ```


    Argument pair has type (Any, Any), which represents pairs of any types—Any being
    the type of everything in Scala. The function can be applied to a pair of integers,
