    With a single pool of *N* threads, you could end up with *N* simultaneous connections,
    and thus *N* concurrent runs of function `handleConnection`. Each run would submit
    an ad-fetching task to the pool, with no thread to execute it. All the runs would
    then be stuck, forever waiting on `futureAd.get`.


    Avoiding these deadlock situations is typically not easy. You may have to add
    many threads to a pool to make sure that deadlocks cannot happen, but large numbers
    of threads can be detrimental to performance. It is quite possible—likely, even—that
    most runs will block only a small subset of threads, nowhere near a deadlock situation,
    and leave too many active threads that use CPU resources. Some situations are
    hopeless: In the worst case, the naive quick-sort example would need as many threads
    as there are values in the list to guarantee that a computation remains free of
    deadlock.


    Even if you find yourself in a better situation and deadlocks can be avoided with
    a pool of moderate size, waiting on futures still incurs a non-negligible cost.
    Blocking—on any kind of synchronizer, including locks—requires parking a thread,
    saving its execution stack, and later restoring the stack and restarting the thread.
    A parked thread also tends to see its data in a processor-level cache overwritten
    by other computations, resulting in cache misses when the thread resumes execution.
    This can have drastic consequences on performance.


    Avoiding deadlocks should, of course, be your primary concern, but these performance
