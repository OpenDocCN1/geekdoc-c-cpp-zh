  md: '# 3.7 Functional Lists


    The most widely used persistent data structure in functional programming is the
    functional list. Either a list is empty (no elements) or it consists of a first
    value (called the *head*), potentially followed by more values (the *tail*). Every
    list can be built from two primitives: the empty list and an operator that combines
    a head element with an existing list. Traditionally, the empty list is called
    “nil,” and the operator is called “cons.” This terminology dates back to the days
    of Lisp, with the list [1,2,3] being built as follows:


    ```

    ```lisp

    (cons 1 (cons 2 (cons 3 nil)))

    ```

    ```


    The nested expression starts with the empty list nil, uses cons to build the list
    (cons 3 nil), which is the list [3], then uses cons again to add 2, then 1, in
    front of the list. The head of the final list is 1; its tail is the list (cons
    2 (cons 3 nil)).


    Languages of the ML family popularized the use of the infix operator “::” to represent
    cons. It is also being used in more recent languages like F# and Scala. The Lisp
    code just given can be written in Scala as follows:


    ```

    ```scala

    1 :: 2 :: 3 :: Nil

    ```

    ```


    Again the head of the list is 1, and its tail is 2 :: 3 :: Nil.


    For convenience, languages define factory functions to build lists. You can build
    the list [1,2,3] in Lisp as (list 1 2 3) and in Scala as List(1, 2, 3). Scala
    also defines a function List.empty that returns Nil; I sometimes use this version
    for clarity and better type inference. However, it is essential to keep in mind
    the nil/cons structure of functional lists for at least two reasons.


    First, building a new list from an existing list does not, in general, require
    a full copy of the original list. This is because different lists can often share
    data. As an illustration, consider the three lists a, b, and c defined as follows:


    ```

    ```scala

    val a = List(1, 2, 3)   // the list [1,2,3]

    val b = 0 :: a           // the list [0,1,2,3]

    val c = a.tail           // the list [2,3]

    ```

    ```


    The memory allocation of these three lists looks something like Figure 3.1. Although
    the three lists together contain nine values, there are only four cells allocated
    in memory,'
