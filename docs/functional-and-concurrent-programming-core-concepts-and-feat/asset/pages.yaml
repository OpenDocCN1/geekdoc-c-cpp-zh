    \ book, code illustrations rely on indentation instead of curly braces when possible\
    \ and omit most end markers for the sake of compactness. I expect readers to be\
    \ able to read imperative Scala code in this form, like the preceding function.\n\
    \n# How to Read This Book\n\nI believe that the primary value of this book lies\
