  md: '# 25.2  Futures as Synchronizers


    # NOTE


    The Java standard library defines an interface Future, introduced in Java 5. The
    Scala standard library also defines a trait by the same name. The Scala type includes
    many functionalities not found in the Java interface. Various third-party libraries—most
    notably Google’s Guava—developed types of future that were closer to Scala’s Future
    trait until a class CompletableFuture was introduced in Java 8. Java’s CompletableFuture
    and Scala’s Future now offer similar mechanisms (CompletableFuture has a bit more),
    which are explored in Chapter 26. This chapter focuses on using futures as synchronizers,
    which you can do with all three types. Code illustrations in this section and
    the next use Java’s earlier Future for simplicity. Section 25.4 introduces the
    other two implementations.


    So far, we have used thread pools through a method execute, which takes an argument
    of type Runnable. In addition to Runnable, Java defines a Callable interface.
    In contrast to the run method in Runnable, the call method in Callable can return
    values.² Java thread pools define a method submit that takes a Callable argument.
    While execute returns nothing—it’s a void method—submit returns a future:


    ```

    ```scala

    val exec: ExecutorService = ...


    def makeStrings(n: Int, str: String): List[String] = List.fill(n)(str)


    val f1: Future[List[String]] = exec.submit(() => makeStrings(5, "T1"))

    val f2: Future[List[String]] = exec.submit(() => makeStrings(5, "T2"))


    val strings: List[String] = f1.get() ::: f2.get()

    assert(strings.size == 10)

    ```

    ```


    As with Runnable, you often create values of type Callable as lambda expressions.
    In this example, two tasks are handed to a thread pool for execution using method
    submit. Each task invokes function makeStrings; no assignment statement is involved.
    You can then use the futures returned by submit to retrieve the lists created
    by the tasks using method get, and concatenate the lists as before.


    > ² Another difference is that call can throw checked exceptions. This is something
    that neither run (in Runnable) nor apply (in Function) is allowed to do.'
