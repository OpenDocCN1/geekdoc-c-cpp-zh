  md: 'thread wait on the condition if the queue is empty; in put, you make it wait
    if the queue is full. After any successful element insertion or removal, you notify
    the entire set of waiting threads that the state of the queue has changed.


    This code has a few peculiarities that deserve to be discussed in detail:


    +   - The blocking method wait is called within the synchronized block of code,
    even though I stated earlier that you should never invoke a blocking method while
    holding a lock because it results in deadlocks. First, let’s understand why this
    is necessary. The issue is a non-atomic check-then-act: In take, for instance,
    a thread could see that a queue is empty and release the lock in anticipation
    to calling wait. But before this thread reaches wait and is actually added to
    the set of waiting threads, another thread invokes put and calls notifyAll. By
    the time the taking thread reaches the waiting set, notifyAll has already happened,
    and the thread gets stuck, even though the queue is now non-empty. (Listing 23.6
    does not suffer from this problem because a semaphore permit can always be safely
    created, whether a thread is waiting for it or not.) Calling method wait within
    the synchronized block avoids this problem, but what about the deadlock issue?
    Things work correctly only because wait internally releases the lock after a thread
    is added to the waiting set (and it is invalid for a thread to invoke wait on
    an object that is not locked by the thread). So, the first rule to remember is
    simple: Code should always use X.wait inside an X.synchronized block on the same
    object X.

    +   - In both take and put, the check that a queue is not empty or not full is
    performed inside a loop. This is essential, and it is a consequence of the locking
    issues discussed earlier. When a thread calls wait, it owns a lock that is automatically
    released. This lock needs to be reacquired after the thread is notified for the
    thread to continue executing the synchronized block. Several threads—notified
    from the set of waiting threads, or initiating new calls to method take or put—compete
    for this lock, and any thread that ends up acquiring the lock can modify the state
    of the queue. A taking thread, for instance, could be notified that a queue is
    non-empty, but the queue could become empty again by the time the thread manages
    to reacquire the lock. So, once the lock has been reacquired, a thread needs to
    test the state of the queue again and go back to waiting again if the state is
    not suitable. The second rule is as simple as the first: Always invoke wait in
    a loop that reevaluates the condition you are waiting for.

    +   - All the waiting threads are notified—using notifyAll—after a queue element
    is added or removed. This is wasteful: If you are adding one element in an empty
    queue, why notify ten threads to come and get it? However, method notify, which
    notifies only one of the waiting threads, cannot be used in this example. When
    multiple threads are waiting, method notify does not specify which thread is'
