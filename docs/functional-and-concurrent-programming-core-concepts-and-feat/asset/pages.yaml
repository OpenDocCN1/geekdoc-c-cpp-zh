    \ would implement this directly in terms of individual futures of pages, without\
    \ ever blocking a thread. This is a nontrivial problem.\n\n# 27.7  Non-blocking\
    \ Synchronization\n\nThis chapter and Chapter 26 present several techniques that\
    \ avoid blocking threads. In this last section, I want to clear up a misconception\
    \ I have encountered several times. It is the idea that because threads are never\
    \ blocked when using these approaches, synchronization mistakes such as deadlocks\
    \ are impossible. This is not the case. Yes, some common deadlock-prone situations\
    \ can be avoided by not blocking threads—see, for instance, the discussion of\
    \ recursive tasks in Section 26.1. But it does not follow that synchronization\
    \ mistakes—including deadlocks—cannot happen.\n\nYou need to distinguish between\
    \ a future, task, coroutine, or actor “waiting” for some event—which does not\
    \ involve blocking a thread—and a thread being parked. In particular, you can\
    \ still end up with a deadlock by having futures, tasks, coroutines, or actors\
    \ wait for each other in a cycle, independently from the status of the threads\
    \ that run them. As an illustration, this (contrived) example has two futures\
    \ waiting for each other:\n\n```\n```scala\nlazy val future1: Future[Int] = Future.delegate\
    \ {\n  println(\"future 1 starts\")\n  val future2: Future[String] = Future.delegate\
    \ {\n    println(\"future 2 starts\")\n    future1.map(n => n.toString)\n  }\n\
    \  future2.map(str => str.length)\n}\n```\n```"
