    \ (11 + 7 = 18) but target 19 is not.\n\nSubset-sum is known to be NP-complete.\
    \ However, you can solve it using a simple (but inefficient) divide-and-conquer\
    \ approach. To reach a target T, pick an element x from the set and try to reach\
    \ T − x with the remaining numbers. If this can be done, you add x to the set\
    \ that does it to make a set that adds up to T. If T − x cannot be reached, then\
    \ x cannot be used. The only possibility left is to try to reach all of T with\
    \ the remaining numbers.\n\nThis algorithm is naturally recursive: Subset-sum\
    \ is solved in terms of two subset-sum problems on a smaller set, one that tries\
