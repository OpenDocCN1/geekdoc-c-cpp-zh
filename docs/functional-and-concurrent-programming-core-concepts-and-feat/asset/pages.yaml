    \ × Digit) + Digit`, a type that could be implemented in this way:\n\n```\n```scala\n\
    enum StoogeAndDigitOrDigit:\n  case SD(stooge: Stooge, digit: Digit)\n  case D(digit:\
    \ Digit)\n```\n```\n\nConceptually, this type represents the same 40 values as\
    \ type `Option[Stooge], Digit`. For instance, `(Some(\"Moe\"), 5)` corresponds\
    \ to `SD(\"Moe\", 5)`, and `(None, 8)` is `D(8)`.\n\nFinally, sums and products\
