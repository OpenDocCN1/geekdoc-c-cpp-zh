  md: "# 12.2 By-Name Arguments\n\nSome languages offer an additional mechanism in\
    \ the form of by-name argument passing. For instance, this produces a list of\
    \ pseudo-random numbers:\n\n```\n```scala\nval rand = Random(42)\nList.fill(5)(rand.nextInt(100))\
    \ // List(30, 63, 48, 84, 70)\n```\n```\n\nIf you are coming from languages like\
    \ Java or C, this may look surprising. Indeed, method fill from java.util.Collections\
    \ behaves differently:\n\n```\n```java\nList<Integer> numbers = ...\nCollections.fill(numbers,\
    \ rand.nextInt(100)); // sets the list to 30, 30, 30, 30, ...\n```\n```\n\nIn\
    \ the Java variant, the expression rand.nextInt(100) produces the value 30, and\
    \ the list is filled with this value. In the Scala code, however, fill behaves\
    \ as if the thunk () => rand.nextInt(100) had been passed as its argument. This\
    \ is because the argument to Scala’s fill is passed by name, unevaluated. You\
    \ could implement your own fill function as follows:\n\n```\n```scala\ndef fill[A](len:\
    \ Int)(value: => A): List[A] =\n  val buffer = List.newBuilder[A]\n  var i = 0\n\
    \  while i < len do\n    buffer += value\n    i += 1\n  buffer.result()\n```\n\
    ```\n\nListing 12.1: Reimplementing List.fill.\n\nThe “magic” comes from adding\
    \ an arrow in front of the type of the argument—value: => A—which triggers by-name\
    \ argument passing. Without the arrow, the fill function would behave as in Java,\
    \ filling the list with a repetition of the same value. But because the argument\
    \ is passed by name instead, the expression rand.nextInt(100) is reevaluated with\
    \ each iteration of the while-loop, resulting in different numbers. By-name arguments\
    \ implement a form of lazy evaluation, by contrast to regular argument passing,\
    \ which is sometimes referred to as eager evaluation. They can enhance code readability\
    \ by avoiding the explicit creation of thunks.\n\nMany functions and methods in\
    \ the Scala standard library use by-name arguments. For instance, the Option type\
    \ defines methods orElse and getOrElse to replace an empty option with an alternative.\
    \ They are defined in the Option class as follows:"
