    # 27.8 Summary


    +   - When programming with synchronizers, such as locks, latches, and futures,
    threads can be temporarily blocked while other threads perform an operation, which
    often results in non-negligible performance loss. Chapter 26 presented a programming
    style that uses futures in a functional way, without blocking threads. Some other
    techniques minimize thread blocking, as discussed in this chapter.

    +   - Compare-and-set (CAS) is a hardware instruction that implements an elementary
    atomic check-then-act operation. It is also available on language-level types
    like `AtomicInteger` and `AtomicReference` as a `compareAndSet` method. It can
    be used to implement other thread-safe operations, such as `incrementAndGet` and
    `getAndSet` in class `AtomicInteger`.

    +   - In particular, class `AtomicReference` and atomic updaters make it possible
    to manipulate pointers atomically without going through locks. This is the basis
    for various lock-free algorithms that implement thread-safe data structures without
    locking, albeit at the cost of increased code complexity.

    +   - Lock-free algorithms tend to follow a similar pattern. Computation proceeds
    without locking, and thus with no guarantee that other threads will not interfere.
    Work is performed speculatively and then committed using CAS. A failed CAS is
    an indication that interference from other threads did take place, in which case
    the operation can be reattempted.

    +   - Functional-concurrent programming avoids blocking threads by using futures
    through callbacks and higher-order functions. An alternative approach is to make
    it possible for code to explicitly wait for completion of a future, but without
    blocking a thread. Many different implementations of this principle are possible.
    Java’s `ForkJoinTask`, for instance, implements a kind of future with a `join`
    method that suspends code execution until the future terminates, but does not
    block the running thread, leaving it free to execute other tasks in the pool.
    This results in a programming style that often feels more natural—resembling a
    blocking variant—than one that relies on callbacks and scheduled transformations.

    +   - This idea of waiting without blocking is sometimes extended beyond futures
    and made available in other flavors, such as *async/await* constructs and coroutines.
    In addition to waiting for a value produced by a task, these constructs offer
    non-blocking ways to wait for a message from a channel, or to acquire an exclusive
    lock, for instance.

    +   - Actors are a model of concurrent and distributed programming centered on
    messages. Actors send and receive messages, which are handled sequentially within
    an'
