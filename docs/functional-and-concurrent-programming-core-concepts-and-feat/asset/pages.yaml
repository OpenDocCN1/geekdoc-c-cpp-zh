  md: 'operation: It takes time proportional to the value of the index. Furthermore,
    to change a value at index n, you would have to discard n elements from the list,
    and allocate a new list of length n. For instance, if the index points to the
    first “a” in list [P,l,a,t,o], and you want to replace it with “u” to produce
    [P,l,u,t,o], you will need to create a new list [P,l,u]:


    ![](img/74309e2bdd93f68d2e94338a3d73517f_95_0.png)


    The zipper is a clever data structure that avoids this drawback. It is implemented
    as a pair of lists (left, right): The second list contains the elements right
    of the cursor; the first list contains the elements left of the cursor, but in
    reverse order. All the necessary operations—moving the cursor left or right, and
    querying and updating the element under the cursor—can then be implemented in
    constant time.


    To help visualize zippers, consider again the list [P,l,a,t,o] with current element
    “a”. It is represented as this zipper:


    ```

    (List(''l'', ''P''), List(''a'', ''t'', ''o''))

    ```


    Moving the cursor to the right produces the new zipper:


    ```

    (List(''a'', ''l'', ''P''), List(''t'', ''o''))

    ```


    To implement zippers, first define a Zipper type as a pair of lists. A zipper
    value is constructed from a non-empty list of elements:


    ```

    type Zipper[A] = (List[A], List[A])


    def fromList[A](list: List[A]): Zipper[A] = (Nil, list)

    ```


    Listing 5.10: List zipper definition and construction.


    When you construct a zipper from a list, the cursor is in the leftmost position
    (no elements in the left list). A zipper always contains at least one value (the
    current element), and the right list in a pair is never empty (a proper implementation
    of fromList would reject an empty list argument with an exception).


    The head of the right list is the element under the cursor. It can be queried
    and updated efficiently:'
