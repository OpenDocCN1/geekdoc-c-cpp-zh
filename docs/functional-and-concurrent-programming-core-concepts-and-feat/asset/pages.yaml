- pgno: 201
  md: "# 11.4 Building Trees\n\n```\n```scala\nDir(\"Root\")\n.mkFile(\"Dir2\", \"\
    File3\")\n.mkDir(\"Dir1\", \"Dir3\")\n.mkFile(\"Dir1\", \"File2\")\n.mkFile(\"\
    File1\")\n```\n```\n\nYou can remove files and directories from a tree by following\
    \ a similar strategy. Method rmPath follows a path to its last element and removes\
    \ it from the tree, whether it is a file or a directory. A first difference with\
    \ mkPath is that, instead of creating missing directories, rmPath can stop traversing\
    \ a branch as soon as a directory is missing (nothing to remove). Another difference\
    \ is that you need to stop following the path one level above the last element\
    \ so you can remove this element from the list of nodes of its parent. In other\
    \ words, you remove a node by replacing Dir(name, list) with Dir(name, shorterList),\
    \ not by replacing this with “nothing.” This results in a recursion that ends\
    \ with a single-element list instead of an empty list:\n\n```\n```scala\n// inside\
    \ class Dir\ndef rmPath(path: List[String]): Dir = path match\n  case node::more\
    \ =>\n    removeByName(node.name) match\n    case None => this\n    case Some((node,\
    \ otherNodes)) =>\n      if more.isEmpty then Dir(this.name, otherNodes)\n   \
    \   else Dir(this.name, node.rmPath(more) :: otherNodes)\n\ndef rm(name: String,\
    \ names: String*): Dir = rmPath(name :: names.toList)\n```\n```\n\n\n\nFirst,\
    \ split the path, which is never empty, into its first name (node name) and the\
    \ remainder of the path (more). Use helper method removeByName to extract an existing\
    \ node by that name, if any. If no node is found, there is nothing to delete from\
    \ the tree, so return this. If a node is found and is the last path element (more.isEmpty),\
    \ remove it from the list of nodes. Otherwise, proceed recursively with the rest\
    \ of the path (node.rmPath(more)) to create a replacement node. In that case,\
    \ you know that more is not empty, and therefore that rmPath is not applied to\
    \ an empty list.\n\nAs before, a path that encounters an existing file cannot\
    \ proceed. However, there is no actual node to remove in this case—the path denotes\
    \ a non-existing file or directory— and method rmPath in class File just leaves\
    \ the file unchanged instead of throwing an exception:"
