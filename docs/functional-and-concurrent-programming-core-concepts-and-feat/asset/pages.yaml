  md: 'size on the shared list, but the implementation is still unacceptable. The
    real flaw of the busy-waiting approach is that the main thread keeps running while
    the tasks are being executed. This is wasteful of computing resources—CPU cycles—and
    cannot scale to real-size applications, especially when waiting for long-running
    tasks. To make things worse, the main thread is not only wasting CPU time, it
    is also interfering with the running tasks by repeatedly acquiring the shared
    lock—about a hundred thousand times in this small illustrative program—thus potentially
    delaying the completion of the task it is waiting for!


    Sleeping and busy-waiting are sometimes combined in a mixed approach:


    ```

    // DON''T DO THIS!

    while lock.synchronized(terminated) < 2 do MILLISECONDS.sleep(5)

    ```


    While this alleviates some weaknesses of each individual approach—less CPU time
    is wasted in the main thread, and smaller sleeping times can safely be used—it
    still won’t make your code as efficient and responsive as a properly synchronized
    solution.


    These approaches—sleeping, busy-waiting, or a combination thereof—are a major
    source of bugs and poor performance in concurrent programs and should be avoided.
    Instead, you want to rely on synchronizers, which can efficiently suspend threads
    (no CPU wasted) until the exact moment a desired condition is established (no
    time wasted sleeping).


    # 22.2 Synchronizers


    Fundamentally, synchronizers are stateful objects, capable of blocking threads.
    A synchronizer has a mutable state and defines operations to modify it. Moreover,
    some of these operations may block the threads that call them until the synchronizer
    is transitioned into an acceptable state by another thread. You can think of synchronizers
    as smart traffic lights for thread coordination: They stop threads or let them
    go and use the threads’ own actions to change the lights.


    To help illustrate the concept, consider exclusive locks, which we discussed in
    Chapters 18 and 19. Locks are synchronizers. A lock has a two-valued state—free
    or owned—and defines operations to modify this state—lock, which changes the state
    from free to owned, and unlock, which changes it from owned to free. The lock
    operation can be blocking if a lock is in the owned state. The unlock operation
    never blocks: An owned lock can always be freed, and freeing a free lock is invalid.


    As another example, consider thread pools. In some of the earlier examples, they
    were used as synchronizers. A thread pool can transition from one state where
    it is active and accepting tasks, to another state where it is shut down and all
    its tasks are terminated. Method awaitTermination is used to block a thread until
    a pool is in the terminated state.


    The focus of this chapter is inter-thread synchronization via shared memory. In
    systems that communicate via messages instead, a channel is also a synchronizer.
    Sending'
