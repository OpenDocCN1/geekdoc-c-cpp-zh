- pgno: 237
  md: "If reading the file has failed, both expressions produce a failed value with\
    \ the exception that caused readFile to fail. If the file can be read, the first\
    \ expression is a success. The second expression can still be a success or a failure,\
    \ depending on what is returned by computeOrFail.\n\nIf you prefer to ignore the\
    \ cause of a failure, you can change a Try type into an option:\n\n```\nreadFile(...).toOption\
    \ // of type Option[List[String]]\n```\n\nThe Try type is heavily used in concurrent\
    \ programming to carry exceptions from one thread to another (several examples\
    \ are provided in Part II). Contrast this use of a future in Java:\n\n```\nfuture.whenComplete((value,\
    \ error) -> {\n  if (error == null) ... // use value\n  else ... // handle error\n\
    });\n```\n\nwith the same program in Scala:\n\n```\nfuture.onComplete {\n  case\
    \ Success(value) => ... // use value\n  case Failure(error) => ... // handle error\n\
    }\n```\n\nUsing Try is cleaner and safer than dealing with a pair (value,error)\
    \ of which one element is always null.\n\n# 13.4 Using Either\n\nThe Try type\
    \ is very much dedicated to handling failures, unlike Option, which you can use\
    \ for other purposes as well. Another standard, general-purpose type with two\
    \ alternatives, Either, is also sometimes used in error handling.\n\nWhile Option\
    \ is a value or nothing and Try is a value or an exception, Either is a value\
    \ or another value, possibly of a different type. A value of type Either[A,B]\
    \ is either a Left[A] or a Right[B]. Conceptually, you can think of Option[A]\
    \ as Either[None.type,A], and of Try[A] as Either[Throwable,A]. It is customary\
    \ to use Right to represent the successful path and Left for an alternative. Accordingly,\
    \ methods like contains, map, and filter work on the inside of the right part.\n\
    \n3This can be changed via a left method: either.left.map(...) will transform\
    \ the left part of the either value."
