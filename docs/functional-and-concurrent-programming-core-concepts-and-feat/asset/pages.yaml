- pgno: 206
  md: "You can replace the `map/flatten` combination with a call to `flatMap` to produce\
    \ all the files unwrapped instead of being inside options. In the end, the desired\
    \ implementations of `fileFind` and `dirFind` are as follows:\n\n```\n```scala\n\
    // inside class Dir\ndef fileFind(test: File => Boolean): Option[File] =\n  nodes.view.flatMap(_.fileFind(test)).headOption\n\
    \ndef dirFind(test: Dir => Boolean): Option[Dir] =\n  if test(this) then Some(this)\
    \ else nodes.view.flatMap(_.dirFind(test)).headOption\n\n// inside class File\n\
    def fileFind(test: File => Boolean): Option[File] =\n  if test(this) then Some(this)\
    \ else None\n\ndef dirFind(test: Dir => Boolean): Option[Dir] = None\n```\n```\n\
    \nThe expression `nodes.view.flatMap(_.fileFind(test))` produces a (lazily evaluated)\
    \ collection of files that satisfies the given test, one for each subtree. Invoking\
    \ `headOption` forces the view to be evaluated until either a file is found or\
    \ the view has been exhausted without producing a file.\n\n# 11.6 Navigation\n\
    \nA last set of methods in classes `Dir` and `File` deal with navigation inside\
    \ a file system. You can define a method `cd` to enter subdirectories, which mimics\
    \ the Unix command by the same name:\n\n```\n```scala\n// inside class Dir\ndef\
    \ cdPath(path: List[String]): Dir = path match\n  case Nil => this\n  case dirname\
    \ :: more =>\n    nodes\n      .find(_.name == dirname)\n      .getOrElse(throw\
    \ FileSystemException(dirname, \"cannot change: no such dir\"))\n      .cdPath(more)\n\
    ```\n```\n\n> ⁸Instead of `if test(this) then Some(this) else None`, the body\
    \ of `filterFind` in class `File` could be written `Some(this).filter(test)`.\
    \ There are other places in the code where `filter` could also be applied to options.\
    \ Although this would illustrate the use of higher-order method `filter`, some\
    \ code readability might be lost. I chose to stick with `if–then–else` for clarity."
  merge: -1
