  md: '# # Chapter 8 Case Study: Binary Search Trees


    smallest key in the tree, and its right child is what is left of the tree once
    this key is removed. Otherwise, the smallest key in the tree is the smallest key
    in the left child, just as before. This left child, with the smallest key removed,
    becomes the new left child of the node. The key and right child of the node are
    unchanged.


    If needed, you can build a list of all the keys in a tree. Because of the key
    ordering property of binary search trees, an in-order traversal—left child, then
    root, then right child—produces an ordered list of keys. A naive implementation
    is straightforward:


    ```

    ```scala

    // DON''T DO THIS!


    // in object Empty:

    def toList = List.empty


    // in class Node:

    def toList = left.toList ::: key :: right.toList

    ```

    ```


    Although this method does produce the right list, its performance suffers from
    the use of the list concatenation operator “:::”, which takes time proportional
    to the length of the first operand (see the discussion of function concat from
    Listing 7.9). Keep in mind that, due to the recursive nature of method toList,
    this is not a one-time cost: The concatenation operator is used within the calls
    left.toList and right.toList, and again in the recursive calls within these calls,
    and so on. To avoid this inefficiency, you can build the list in an accumulator
    argument instead:


    ```

    ```scala

    // in class BinTree:

    def toList: List[Int] = makeList(List.empty)

    def makeList(list: List[Int]): List[Int]


    // in object Empty:

    def makeList(list: List[Int]) = list


    // in class Node:

    def makeList(list: List[Int]) = left.makeList(key :: right.makeList(list))

    ```

    ```


    # Listing 8.5: Conversion from binary search trees to sorted lists.


    A helper method makeList, with an accumulator list, is added. In object Empty,
    which contains no key, the accumulator list is returned unchanged. In class Node,
    a recursive call right.makeList(list) adds all the keys of the right child to
    the list. Then, the root of the node is added, using “::”. Finally, another recursive
    call to left.makeList adds all the keys of the left child. Note how all the keys
    are added to the list using “::”, and “:::” is never used.


    When we used this technique earlier, in Section 7.9, it had the unfortunate consequence
    that a list was built in reverse order and had to be reversed once after building.
    In the case of binary search trees, you avoid this final reversal by traversing
    the tree from right to left. This way, the larger keys are added first, followed
    by the smaller keys.'
