  md: "```\nclass TrashCan[-A](log: Logger):\n  def trash(x: A): Unit = log.info(s\"\
    trashing: $x\")\n```\n\nListing 15.6: Example of a user-defined contravariant\
    \ type.\n\nBecause of the contravariance annotation, TrashCan[Publication] is\
    \ a subtype of TrashCan[Book]. This makes sense: An object of type TrashCan[Publication]\
    \ can trash any type of publication, including books, and thus implements the\
    \ functionality of a TrashCan[Book] value.\n\nConstraints on contravariant types\
    \ mimic those of covariant types: Inside class TrashCan[-A], you can use type\
    \ A for method arguments, but not for return values. Covariance and contravariance\
    \ constraints are reflected in the choice some languages made for their variance\
    \ annotations. In C# and Kotlin, for instance, the covariance annotation is named\
    \ out, and the contravariance annotation is named in (instead of “+” and “−” in\
    \ Scala).\n\nThe main use of contravariance—in some languages, the only use, as\
    \ in Rust and SML—is within function types. One-argument functions are defined\
    \ in Scala as follows:\n\n```\ntrait Function1[-A, +B] extends ...\n```\n\nThis\
    \ is the type of functions with a single argument of type A and a return value\
    \ of type B—also denoted A => B. If S is a subtype of T, type A => S is a subtype\
    \ of A => T. By returning a value of type S, a function of type A => S does indeed\
    \ implement the functionality of a function of type A => T: It consumes a value\
    \ of type A and produces a value of type T—because of type S. But because of contravariance\
    \ in the input side, type T => B is also a subtype of type S => B, by the same\
    \ argument used for class TrashCan—type TrashCan is basically A => Unit. Functions\
    \ of multiple arguments follow the same pattern:\n\n```\ntrait Function2[-T1,\
    \ -T2, +R] extends ...\ntrait Function3[-T1, -T2, -T3, +R] extends ...\n...\n\
    ```\n\nIn a functional programming style, where functions are used as arguments\
    \ to higher-order functions, you sometimes need to decide whether a function is\
    \ a subtype of another function. Figure 15.1 shows that type Publication => Magazine\
    \ is a subtype of Book => Publication because Publication is a supertype of Book—and\
    \ functions are contravariant in their input type—and because Magazine is a subtype\
    \ of Publication"
