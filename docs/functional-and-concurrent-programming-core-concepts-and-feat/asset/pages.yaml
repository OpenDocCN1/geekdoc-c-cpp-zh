  md: "# Chapter 28\n\n# Case Study: Parallel Strategies\n\nOur final case study expands\
    \ on the previous one by focusing on the parallel execution of functions—as opposed\
    \ to the actions examined in Chapter 24. It considers a scenario in which several\
    \ functions are applied to the same input, each with a different likelihood of\
    \ succeeding. The implementation leverages the concurrency constructs explored\
    \ in earlier chapters—promises, futures, higher-order functions—and uses their\
    \ features to address failure, timeout, cancellation, and caching issues.\n\n\
    # 28.1 Problem Definition\n\n# NOTE\n\nThis case study was inspired by a problem\
    \ I faced, a long time ago, while working on static analysis of programs. I was\
    \ implementing a tool that worked by generating proof obligations—that is, logical\
    \ formulas that need to be valid to show that a program satisfies a desirable\
    \ property. The formulas were typically large, numerous, and costly to verify.\
    \ My tool used automatic theorem provers to check the validity of the formulas,\
    \ but different theorem provers—and different configurations of the same theorem\
    \ prover—would often perform very differently on the same formula. With no way\
    \ to predict which prover would work best, several theorem provers were started\
    \ in parallel on each formula and stopped as soon as one prover found the formula\
    \ to be valid or invalid. Some of the assumptions made in this chapter reflect\
    \ the particulars of this theorem-proving scenario.\n\nThis last case study investigates\
    \ a scenario in which a series of problems need to be solved using a variety of\
    \ heuristics. For a given problem, you don’t know which heuristic will work, so\
    \ you would like to try several heuristics in parallel until one succeeds. In\
    \ this chapter, heuristics are represented in terms of a Strategy interface:\n\
    \n```\nScala\ntrait Strategy[A, B]:\n  trait Task:\n    def run(): Option[B]\n\
    \    def cancel(): Unit\n\n  def apply(input: A): Task\n```"
