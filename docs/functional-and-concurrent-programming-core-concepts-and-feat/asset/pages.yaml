    \ at XX:XX:29.277: end 3\nmain at XX:XX:29.277: END\n```\n\n# 24.8 Asynchronous\
    \ Task Submission Using Conditions\n\nSection 24.7 makes concurrent programming\
    \ look easy—and it sometimes is. However, you should be ready for scenarios that\
    \ do not quite fit the canned patterns as nicely.\n\nAs an illustration, consider\
