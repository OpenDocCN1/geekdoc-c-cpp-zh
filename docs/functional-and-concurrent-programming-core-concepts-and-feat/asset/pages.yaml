  md: 'After you catch a timeout exception but before compute returns None, it can
    be desirable to cancel the run that is still ongoing, since it is now wasting
    computing resources to calculate data that will never be used, as well as all
    the runs that follow. The easiest way to do so is simply to cancel all the tasks,
    including tasks that have already completed with a failure: In this case study,
    we assume that canceling a finished task is harmless. This approach to cancellation
    is used in all runner implementations throughout the chapter.


    Despite the use of a second thread, the runner implementation in Listing 28.1
    remains sequential: One thread is blocked while the other thread applies strategies
    one at a time. In particular, the (single) computing thread might potentially
    spend all the allowed time running an early strategy, even though other strategies
    further down the list could produce a result more quickly.


    With no a priori knowledge of which strategies are more likely to be successful,
    and assuming enough computing resources, a better approach is to start all the
    strategies in parallel and use the result of the first strategy that succeeds.
    It is straightforward to modify Listing 28.1 to use a multithreaded pool and to
    create multiple tasks that each evaluate a single strategy. The difficulty is
    to wait exactly until the first successful strategy terminates or the elapsed
    time has reached the timeout value.


    A “do-it-yourself” solution is certainly possible. For instance, you could use
    an approach that combines:


    +   - A shared mutable variable to store the result of the first successful strategy,
    if any.

    +   - A counter of how many strategies are actively running.

    +   - A latch to wait, with a timeout, for the first available result. The latch
    is opened by a task if it is successful or if it is the last task to finish.

    +   - A lock, to guard the variable used to store the result and the count of
    active tasks.


    Instead of a low-level programming style, which we exercised in Chapter 24, the
    remainder of this chapter uses futures—and related standard mechanisms—to derive
    simpler or richer implementations.


    # 28.3  Parallel Implementation Using invokeAny


    A first possible approach to achieving a simpler runner implementation is to rely
    on method invokeAny, available on Java thread pools. You can use this method to
    run a collection of tasks in parallel, to wait for the completion of the first
    task that terminates successfully, and then to cancel all other tasks. This pattern
    nicely fits the requirements for a parallel runner of strategies:


