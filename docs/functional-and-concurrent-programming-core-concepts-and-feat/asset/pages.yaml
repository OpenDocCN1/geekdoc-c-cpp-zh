  md: "# 26.5 Illustration: Parallel Server Revisited\n\nEquipped with standard higher-order\
    \ functions on futures, we can now go back to the server example. First, you can\
    \ replace the callback action in Listing 26.3 with a call to map to produce a\
    \ Future[Page] out of a Future[Ad]:\n\n```\nScala\nval futureAd: Future[Ad] =\
    \ Future(fetchAd(request))\nval data: Data = dbLookup(request)\nval futurePage:\
    \ Future[Page] = futureAd.map(ad => makePage(data, ad))\nfuturePage.foreach(page\
    \ => connection.write(page))\n\nListing 26.6: Ad-fetching example with map and\
    \ foreach on futures.\n```\n\nYou use map to transform an ad into a full page\
    \ by combining the ad with data already retrieved from the database. You now have\
    \ a Future[Page], which you can use wherever the page is needed. In particular,\
    \ sending the page back to the client is a no-value action, for which a callback\
    \ fits naturally. For illustration purposes, this code registers the callback\
    \ with foreach instead of onComplete. The two methods differ in that foreach does\
    \ not deal with errors: Its action is not run if the future fails.\n\nIn Listing\
    \ 26.6, the database is queried by the connection-handling thread while a customized\
    \ ad is fetched in the background. Alternatively, database lookup can be turned\
    \ over to another thread, resulting in a value of type Future[Data]. You can then\
    \ combine the two futures using flatMap/map:\n\n```\nScala\nval futureAd: Future[Ad]\
    \ = Future(fetchAd(request))\nval futureData: Future[Data] = Future(dbLookup(request))\n\
    val futurePage: Future[Page] =\n  futureData.flatMap(data => futureAd.map(ad =>\
    \ makePage(data, ad)))\nfuturePage.foreach(page => connection.write(page))\n\n\
    Listing 26.7: Ad-fetching example with flatMap and foreach on futures.\n```\n\n\
    What is interesting about this code is that the thread that executes it does not\
    \ perform any database lookup, ad fetching, or page assembling and writing. It\
    \ simply creates futures and invokes non-blocking higher-order methods on them.\
    \ If you write the remainder of the connection-handling code in the same style,\
    \ you end up with a handleConnection function that is entirely asynchronous and\
    \ non-blocking:\n\n```\nScala\ngiven exec: ExecutionContextExecutorService =\n\
    \  ExecutionContext.fromExecutorService(Executors.newFixedThreadPool(16))\n```"
