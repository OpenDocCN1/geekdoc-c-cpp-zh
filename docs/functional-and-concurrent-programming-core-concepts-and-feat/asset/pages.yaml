- pgno: 112
  md: "it will be compiled in Scala as a loop. As a more meaningful example, consider\
    \ binary search in a sorted array. It can be implemented iteratively using a loop:\n\
    \n```\nScala\ndef search(sortedSeq: IndexedSeq[String], target: String): Option[Int]\
    \ =\n  var from = 0\n  var to = sortedSeq.length - 1\n  while from <= to do\n\
    \    val middle = (from + to) / 2\n    sortedSeq(middle) match\n      case midVal\
    \ if target > midVal => from = middle + 1\n      case midVal if target < midVal\
    \ => to = middle - 1\n      case _ /* found at middle */ => return Some(middle)\n\
    \  end while\n  None\n```\n\nThis function works by searching a slice of the array\
    \ between from and to, initialized to the entire array. Each loop iteration starts\
    \ by looking at the value in the middle of the range, midVal. If the target is\
    \ larger than the midpoint value, the function keeps looking in the upper part\
    \ of the range, between middle + 1 and to, using the fact that the sequence is\
    \ sorted. If the target is less than the midpoint value, the function continues\
    \ instead with the lower part of the range, between from and middle - 1. Otherwise,\
    \ the value must be equal to the target, so the function returns the index at\
    \ which it was found. Each new iteration of the loop performs a search in a smaller\
    \ range. The search ends when the target value is found or the range becomes empty\
    \ (from > to).\n\nInstead of using a loop, you can implement these successive\
    \ searches with recursive calls instead:\n\n```\nScala\ndef search(sortedSeq:\
    \ IndexedSeq[String], target: String): Option[Int] =\n  @tailrec\n  def doSearch(from:\
    \ Int, to: Int): Option[Int] =\n    if from > to then None\n    else\n      val\
    \ middle = (from + to) / 2\n      sortedSeq(middle) match\n        case midVal\
    \ if target > midVal => doSearch(middle + 1, to)\n        case midVal if target\
    \ < midVal => doSearch(from, middle - 1)\n        case _ /* found at middle */\
    \ => Some(middle)\n  doSearch(0, sortedSeq.length - 1)\n```\n\nListing 6.9: Tail\
    \ recursive implementation of binary search in a sorted sequence.\n\nA helper\
    \ function doSearch is defined to perform a search in a given range of indices.\
    \ This function uses the same algorithm as before, but relies on recursive calls\
    \ to continue the search in the upper or lower range."
