  md: "# 21.3 Different Types of Thread Pools\n\nConceptually, a thread pool consists\
    \ of a queue of tasks and a set of worker threads. We have already seen newCachedThreadPool,\
    \ which uses an unlimited number of threads and no queue,³ and newFixedThreadPool,\
    \ with a fixed number of threads and an unbounded FIFO queue. JVM thread pools\
    \ are implemented in a class ThreadPoolExecutor, which is highly customizable.\
    \ In particular, you can specify a factory for thread creation, a minimum number\
    \ of active threads before tasks are queued, a maximum number of additional threads\
    \ created when the queue is full, how long before these extra threads are removed\
    \ from the pool when not needed, the type of queue to use (e.g., bounded or unbounded,\
    \ FIFO or priority), and how to handle resource depletion when a queue is full\
    \ of tasks and a maximum number of active threads has been reached. You can also\
    \ use various “hooks” to specify custom code to run when a task starts or ends,\
    \ or when the thread pool is shut down.\n\nAs an illustration, the next example\
    \ customizes several thread pool elements:\n\n```\nobject exec extends ThreadPoolExecutor(\n\
    \  4,\n  16,\n  3, MINUTES,\n  ArrayBlockingQueue(128),\n  ThreadPoolExecutor.CallerRunsPolicy()\n\
    ):\n  override def beforeExecute(thread: Thread, task: Runnable): Unit =\n   \
    \ logger.info(() => s\"${thread.getName} starts task $task\"\n```\n\nThe pool\
    \ maintains a minimum of four worker threads, ready to run tasks. If all four\
    \ threads are busy, tasks are queued in an array-based queue with a capacity of\
    \ 128. If this queue gets full, up to 12 additional threads are created, for a\
    \ maximum pool size of 16. Later, these extra threads are terminated after they\
    \ have been idle for 3 minutes. If all 16 threads are busy, the queue is full,\
    \ and a new task is submitted, the thread that submits the tasks runs it. (CallerRunsPolicy\
    \ is a convenient way to bring in an extra worker and reduce task creation rate\
    \ at the same time; in the server example, this would make the listening thread\
    \ run connection-handling code for a while.) Finally, information is logged every\
    \ time a task starts to run.\n\nFor convenience, a default thread pool is often\
    \ made available to task-creating code. You can access it as scala.concurrent.ExecutionContext.global\
    \ in Scala and as java.util.concurrent.ForkJoinPool.commonPool in Java. Its size\
    \ is typically based on (but not necessarily equal to) the number of available\
    \ cores in the runtime. Because\n\n³More accurately, the pool uses a zero-capacity\
    \ queue, which is always empty."
