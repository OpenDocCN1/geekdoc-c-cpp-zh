  md: '# 15.5 Type Inference


    Sometimes, what constitutes the “best” inferred type is not obvious. Given the
    expression


    ```

    ```scala

    List(book1, book2, "book")

    ```

    ```


    type List[book1.type | book2.type | "book"] is unlikely to be what you want. However,
    the choice between List[Book | String] or List[AnyRef] is more debatable—the current
    Scala compiler infers List[AnyRef].


    In their effort to please, compilers can infer complicated types:


    ```

    ```scala

    val v = if x > 0 then List(1, 2, 3) else Set(4)

    ```

    ```


    With the current Scala compiler, variable v is given the following type:


    ```

    ```scala

    scala.collection.immutable.Iterable[Int] & (Int => Int | Boolean & Equals)

    ```

    ```


    Recall that "&" is type intersection. So, variable v is assigned three types.
    First it is an iterable, immutable collection of integers, which both List[Int]
    and Set[Int] are. But lists and set are also functions: List[A] is a subtype of
    Int => A, and Set[A] is a subtype of A => Boolean. Therefore, the expression can
    also be seen as a function of type Int => Int | Boolean. Finally, both List and
    Set support equality comparison, which is not the case of all iterables and functions—hence
    the type Equals.


    Thanks to this complex type, you can use v as an iterable collection:


    ```

    ```scala

    v.iterator.next() // 1 or 4, of type Int

    ```

    ```


    or as a function:


    ```

    ```scala

    v(1) // 2 or false, of type Int | Boolean

    ```

    ```


    It also supports equality:


    ```

    ```scala

    v == List(1, 2, 3) || v == Set(4) // true

    ```

    ```'
