- pgno: 79
  md: '# 4.2 Functional Values


    Method allActive is simpler than before: You can just return a reference on field
    activeSet instead of having to copy the set. This works because activeSet is an
    immutable set, and returning a reference to it is harmless. The code for methods
    activate and deactivate looks unchanged but is actually compiled differently.
    Instead of calling methods ++ and -- on a mutable set, you are now creating a
    new immutable set and reassigning a mutable field. (The similarity in this syntax
    was discussed in Section 3.6.) Methods activateAll and deactivateAll are implemented
    without any set operation. They simply (and efficiently) reset field activeSet
    with the value elements, or with an empty set. The other methods (isActive, isPassive,
    allActive, and isAllPassive) are unchanged.


    In summary, there are two ways you can define activeSet to implement a mutable
    active–passive set:


    ```

    ```scala

    private val activeSet = mutable.Set.empty[A] // in Listing 4.1

    private var activeSet = Set.empty[A] // in Listing 4.2

    ```

    ```


    In one case, you activate/deactivate elements by modifying a mutable set. In the
    other case, you do it by building a new immutable set and reassigning a mutable
    field.


    # 4.2 Functional Values


    Let us now put on our functional programmer hat and rewrite the active–passive
    example entirely in terms of pure functions and immutable values. We need some
    type to represent ActivePassive values. A typical functional approach is to use
    pairs.


    ```

    ```scala

    opaque type ActivePassive[A] = (Set[A], Set[A])

    ```

    ```


    The first set in a pair represents the entire collection; the second set is the
    subset of active elements. Both sets are immutable. All the remaining code is
    written as functions:


    ```

    ```scala

    private def elements[A](ap: ActivePassive[A]): Set[A] = ap(0)

    private def activeSet[A](ap: ActivePassive[A]): Set[A] = ap(1)


    def createActivePassive[A](elements: Set[A]): ActivePassive[A] = (elements, Set.empty)

    ```

    ```'
