- pgno: 480
  md: "In Java, lambda expressions actually require that you use a SAM interface:\n\
    \n```\nJava\nToIntFunction<String> len = (String str) -> str.length(); // OK\n\
    Object len = (String str) -> str.length(); // rejected by the compiler\nvar len\
    \ = (String str) -> str.length();    // rejected by the compiler\n```\n\nThis\
    \ is not an issue in Scala or Kotlin:\n\n```\nScala\nval len: Any = (str: String)\
    \ => str.length // OK\nval len = (str: String) => str.length      // type String\
    \ => Int inferred\n```\n\n```\nKotlin\nval len: Any = { str: String -> str.length\
    \ } // OK\nval len = { str: String -> str.length }      // type (String) -> Int\
    \ inferred\n```\n\nRecall that, in Scala, functions can be curried, and single-argument\
    \ calls can use curly braces instead of parentheses:\n\n```\nScala\ndef existsOrEmpty[A](list:\
    \ List[A])(test: A => Boolean): Boolean =\n    list.isEmpty || list.exists(test)\n\
    \nval e = existsOrEmpty(List(1, 2, 3)) { num =>\n    num > 1\n}\n```\n\nKotlin\
    \ has no curried functions but uses a different “trick” for the same purpose.\
    \ It lets you move a lambda expression—which includes its own pair of braces—outside\
    \ the list of arguments if it is the last argument in a call:\n\n```\nKotlin\n\
    fun <A> existsOrEmpty(list: List<A>, test: (A) -> Boolean): Boolean =\n    list.isEmpty()\
    \ || list.any(test)\n\nval e = existsOrEmpty(listOf(1, 2, 3)) { num ->\n    num\
    \ > 1\n}\n```\n\nNotice how, in the last expression, the lambda expression { num\
    \ -> num > 1 } has been moved outside the list of existsOrEmpty arguments."
