  md: 'thing that comes to mind when you hear that a language has support for functional
    programming.


    In Scala, the syntax for lambda expressions is `(v1: T1, v2: T2, ...) => expr`.
    This defines a function with arguments v1, v2, … that returns the value produced
    by expr. For instance, the following expression is a function, of type `Int =>
    Int`, that adds 1 to an integer:


    ```

    ```scala

    (x: Int) => x + 1

    ```

    ```


    Function literals can be used to simplify calls to higher-order functions like
    `find`:


    ```

    ```scala

    temps.find((temp: Int) => temp > 90)

    projects.find((proj: Project) => proj.id == 12345L)

    ```

    ```


    The Boolean functions “to be greater than 90” and “to have identity 12345” are
    implemented as lambda expressions, which are passed directly as arguments to method
    `find`. You can also use function literals as return values of other functions.
    So, a third way to define functions `greaterThan` and `hasID`, besides using named
    local functions or currying, is as follows:


    ```

    ```scala

    def greaterThan(bound: Int): Int => Boolean = (x: Int) => x > bound

    def hasID(identity: Long): Project => Boolean = (p: Project) => p.id == identity

    ```

    ```


    The expression `(x: Int) => x > bound` replaces the local function `greaterThanBound`
    from Listing 9.3.


    Function literals have no name, and usually do not declare their return type.
    Compilers can sometimes infer the types of their arguments. You could omit argument
    types in all the examples written so far:


    ```

    ```scala

    temps.find(temp => temp > 90)

    projects.find(proj => proj.id == 12345L)


    def greaterThan(bound: Int): Int => Boolean = x => x > bound

    def hasID(identity: Long): Project => Boolean = p => p.id == identity

    ```

    ```


    > Lambda expressions can also be parameterized by types, though this is a more
    advanced feature not used in this book. For instance, Listing 2.7 defines a function
    first of type `(A, A) => A`, parameterized by type A. It could be written as the
    lambda expression `[A] => (p: (A, A)) => p(0)`.'
