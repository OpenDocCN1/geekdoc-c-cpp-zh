    \ Deferred<Ad> = async { fetchAd(request) }\n  val futureData: Deferred<Data>\
    \ = async { dbLookup(request) }\n  val data: Data = futureData.await()\n  val\
    \ ad: Ad = futureAd.await()\n  val page: Page = makePage(data, ad)\n}\n```\n\n\
    Listing 27.6: Example of non-blocking concurrency using Kotlin coroutines.\n\n\
    In Kotlin, the async construct is used to launch a coroutine and produces a Deferred\
    \ object. Like ForkJoinTask, this is a kind of future. It implements a method\
    \ await— similar to join on a ForkJoinTask—that you can use to wait for future\
    \ completion without blocking the current thread. The code is very similar to\
    \ that of Listings 27.4 and 27.5.\n\nOne strength of Kotlin coroutines is that\
    \ they implement other non-blocking synchronization, besides task completion.\
    \ For instance, Mutex implements an exclusive lock in which the lock method suspends\
    \ code execution without blocking the thread, and Semaphore implements a semaphore\
    \ in which the acquire method suspends code execution without blocking the thread.\n\
    \nFor message-passing applications, Channel defines methods to send and receive\
    \ messages that are conceptually waiting (if the channel is full or empty) but\
    \ do not block the current thread. Go is another popular language that emphasizes\
    \ this programming style. Its “goroutines” can wait on channels for an incoming\
    \ message, for instance, without blocking the thread that executes them. Coroutines\
    \ that communicate using channels (or other synchronizers designed not to block\
    \ threads) have become a popular means of achieving non-blocking concurrency.\n\
    \n# 27.5 Actors\n\nActors is a classic message-based model that has been revived\
    \ through languages such as Erlang and libraries such as Akka. Actors do not typically\
    \ share mutable data, but instead communicate by sending and receiving (immutable)\
