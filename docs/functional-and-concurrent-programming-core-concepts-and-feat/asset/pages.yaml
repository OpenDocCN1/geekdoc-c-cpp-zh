    \ a file, node this—which is Dir(this.name, nodes)—is replaced with a new tree\
    \ Dir(this.name, File(name) :: nodes). In the same way, you add a new subdirectory\
    \ by first creating it as a Dir(dirname).mkPath(more, filename))—and by replacing\
    \ the current tree Dir(this.name, nodes) with a new tree Dir(this.name, nodes).\n\
    \nWhen an existing node needs to change, you remove it from the current list of\
    \ children—nodes becomes otherNodes—and replace it with a new node—node becomes\
    \ mkPath(more, filename) may call mkPath on a directory node, thus continuing\
    \ the traversal/construction, or on a file node, in which case the path being\
    \ followed does not exist and cannot be created because its creation would require\
    \ replacing an existing file with a directory with the same name. Accordingly,\
    \ method mkPath in class File simply throws an exception:\n\n```\n// inside class\
