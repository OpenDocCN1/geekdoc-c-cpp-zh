- pgno: 203
  md: "```\n// inside class File\ndef fileExists(test: File => Boolean): Boolean =\
    \ test(this)\ndef dirExists(test: Dir => Boolean): Boolean  = false\n```\n\n#\
    \ Listing 11.5: Example of implementing exists on a general tree.\n\nMethod fileExists\
    \ takes a Boolean function as an argument and returns true if at least one file\
    \ in the tree satisfies the test function. This, in turn, is true if there exists\
    \ a node in which such a file exists. Thus, you implement fileExists on a directory\
    \ by relying on the method exists of lists to check all the nodes and, on each\
    \ node, on the method fileExists itself, recursively. On a file, fileExists simply\
    \ applies the test to the file.\n\nMethod dirExists is implemented similarly.\
    \ It takes a Boolean function that operates on directories instead of files and\
    \ applies it first to the current directory (test(this)) before trying the nodes\
    \ by using exists as before. On a file, this method always returns false.\n\n\
    By leveraging recursion and the exists method of lists, only two lines each are\
    \ needed to implement fileExists and dirExists on trees. In the same manner, you\
    \ can implement tree folding functions that combine recursion with list method\
    \ foldLeft (or foldRight, since the order of nodes in a directory is irrelevant):\n\
    \n```\n// inside class Dir\ndef fileFold[A](init: A)(f: (A, File) => A): A =\n\
    \    nodes.foldLeft(init)((acc, node) => node.fileFold(acc)(f))\n\ndef dirFold[A](init:\
    \ A)(f: (A, Dir) => A): A =\n    nodes.foldLeft(f(init, this))((acc, node) =>\
    \ node.dirFold(acc)(f))\n\n// inside class File\ndef fileFold[A](init: A)(f: (A,\
    \ File) => A): A = f(init, this)\ndef dirFold[A](init: A)(f: (A, Dir) => A): A\
    \ = init\n```\n\n# Listing 11.6: Example of implementing fold on a general tree.\n\
    \nYou fold a directory by folding all its children nodes, one by one. When you\
    \ fold a file processing function, the folding of children starts with init, but\
    \ when you fold a directory processing function, it starts with f(init, this)\
    \ to first process the current directory before traversing the children. (The\
    \ same principle is behind the 0 and 1 of fileCount and dirCount in Listing 11.4.)\
    \ On nodes that are files, fileFold applies the given function f to the file,\
    \ while dirFold leaves the folding accumulator unchanged.\n\nMethods fileFold\
    \ and dirFold are powerful and can be used to implement various file system queries.\
    \ For instance, if fileCount and dirCount had not already been implemented as\
    \ methods of class Dir, you could write them in terms of fileFold and dirFold\
    \ instead:"
