- pgno: 418
  md: '# 25.7 Summary


    +   - Tasks that produce values can be implemented as actions—typically, instances
    of interface `Runnable`. In that case, they need to modify shared data to store
    these values, and concurrent access to shared mutable data requires that they
    implement their own synchronization. Futures are an alternative synchronization
    mechanism specifically designed for tasks to retrieve values produced by other
    tasks.

    +   - Futures are well suited to functional tasks—that is, tasks that invoke a
    function to produce a value. If the function is pure, all the synchronization
    that is needed can be embedded into a future.

    +   - Thread pools can create a future when a task is submitted for execution.
    The future then acts as a handle on the task. It can be used to query the status
    of the task or as a synchronizer to wait for task completion. After the task finishes,
    the future also serves as a container for the value—or the error—produced by the
    task.

    +   - Different types of futures vary in the functionalities they offer. This
    chapter focused on the basic mechanisms defined by Java’s older `Future` type.
    Scala’s `Future` is richer, and Java’s `CompletableFuture` is richest. Their additional
    features are explored in Chapter 26.

    +   - Futures are created from promises. A promise is a container, initially empty,
    that can be fulfilled by setting a value or, in case of failure, an exception.
    A promise can be fulfilled by the thread that created it (as in Listing 25.7),
    or by some other thread, such as from a thread pool (as in Listings 25.4 to 25.6).

    +   - Promises and futures are tightly coupled and are often the same object,
    playing two roles. Terminology can be a bit confusing, as some sources refer to
    this object as a promise and others as a future.'
  merge: -1
