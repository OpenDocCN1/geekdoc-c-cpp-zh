- pgno: 349
  md: "Such an inlining would be harmless in the sequential server of Listing 21.3,\
    \ but it is unacceptable in the parallel server of Listing 21.4. The behavior\
    \ would fundamentally change. Because method `execute` is asynchronous—it does\
    \ not stop to execute a task—the loop now creates an unbounded number of tasks,\
    \ all listening for connections. All the calls to `accept` take place in the thread\
    \ pool. There is nothing blocking in the body of the loop, which will quickly\
    \ exhaust resources and crash the server.\n\nOn multicore or multiprocessor hardware,\
    \ the use of a thread pool improves server throughput: By handling connections\
    \ in parallel, more work is being done per unit of time. Using a thread pool can\
    \ also improve latency, even on single-processor systems. A drawback of the sequential\
    \ server is that a single lengthy request can delay multiple smaller requests.\
    \ By contrast, the thread pool makes it possible to process large and small requests\
    \ together on separate threads, even on a single processor. Of course, these benefits\
    \ don’t come for free. In particular, you now need `handleConnection` to be implemented\
    \ in a thread-safe manner, as it can end up being executed concurrently by multiple\
    \ threads from the pool.\n\nIn addition to offering better performance, the parallel\
    \ variant of the server is more robust than the sequential one. In a sequential\
    \ implementation, requests that come in while the thread is busy processing a\
    \ connection are stored in one of the internal queues managed by the operating\
    \ system and/or the networking library. These queues are typically small—up to\
    \ a dozen requests—and further attempts to connect to the server will be rejected\
    \ with a “connection refused” error. By contrast, if all the worker threads in\
    \ Listing 21.4 are busy processing connections, new requests are placed in the\
    \ queue of the thread pool, which is stored in heap memory and typically quite\
    \ large.²\n\nA parallel server based on a thread pool is also more robust than\
    \ the following variant:\n\n```\n// DON'T DO THIS!\nwhile true do\n  val socket\
    \ = server.accept()\n  Thread(() => handleConnection(socket)).start()\n```\n\n\
    This implementation also processes connections in parallel by creating and starting\
    \ a new thread with each incoming request. The main drawback of this approach—besides\
    \ the overhead of thread creation and tear-down—is that there is no upper bound\
    \ on the number of threads created. A burst of activity, with many requests coming\
    \ in at the same time, could create hundreds or thousands of threads, which may\
    \ have an adverse impact on performance and even possibly cause a crash due to\
    \ running out of resources. By contrast, the server in Listing 21.4 is limited\
    \ to 17 threads—1 listener and 16 workers—no matter how many requests come in.\n\
    \n²In the thread pool used in Listing 21.4, the queue is actually unbounded, and\
    \ could potentially fill up the entire memory. However, more tasks can normally\
    \ be stored in memory than sockets can be created. When overloaded, the server\
    \ would likely fail at the level of the listening thread calling accept."
