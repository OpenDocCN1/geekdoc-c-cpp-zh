  md: "To limit the number of threads created by a runner to a specified bound, you\
    \ can rely on a queue-based approach similar to Listing 23.9:\n\n```\n```scala\n\
    class Runner[A](bound: Int)(comp: A => Unit):\n  def run(inputs: Seq[A]): Unit\
    \ =\n    val queue = ConcurrentLinkedQueue(inputs.asJava)\n\n    val task: Runnable\
    \ = () =>\n      var input = Option(queue.poll())\n      while input.nonEmpty\
    \ do\n        comp(input.get)\n        input = Option(queue.poll())\n\n    val\
    \ threads = Seq.fill(bound min inputs.length)(Thread(task))\n    for thread <-\
    \ threads do thread.start()\n    for thread <- threads do thread.join()\n```\n\
    ```\n\nListing 24.2: Parallel execution: bounded number of threads.\n\nAll the\
    \ given inputs are placed inside a thread-safe queue. The minimum between the\
    \ desired bound on threads and the number of inputs is the number of threads created.\
    \ The threads all run the same task. This task uses a loop to extract inputs from\
    \ the queue and apply the runner’s function to them. It terminates when the queue\
    \ is empty.\n\nYou can create a runner as Runner(2)(sleepTask) to limit the number\
    \ of threads to two. A typical output, when applied to the list of inputs 2, 1,\
    \ 3, is shown here:\n\n```\n```main at XX:XX:15.696: START\nThread-1 at XX:XX:15.731:\
    \ begin 1\nThread-0 at XX:XX:15.731: begin 2\nThread-1 at XX:XX:16.733: end 1\n\
    Thread-1 at XX:XX:16.733: begin 3\nThread-0 at XX:XX:17.732: end 2\nThread-1 at\
    \ XX:XX:19.734: end 3\nmain at XX:XX:19.734: END```\n```\n\nThe runner uses two\
    \ threads; they immediately pull inputs 2 and 1 from the queue. After 1 second,\
    \ Thread-1 completes the first task and pulls input 3 from the queue. One second\
    \ later—2 seconds into the run—Thread-0 finishes task 2, finds the queue empty,\
    \ and terminates. Two seconds later, Thread-1 finishes task 3 and also terminates.\
