    def abs(x: Int): Int = if x > 0 then x else -x

    ```


    These five definitions show many similarities. For instance, the body of the function
    is exactly the same in Java and in JavaScript, and also in Kotlin and in Scala.
    However, you might also notice several differences:


    +   - A function is introduced in Java without a keyword. By contrast, JavaScript
    uses `function`, Kotlin uses `fun`, and Python and Scala use `def`.

    +   - Java, JavaScript, and Python all use the keyword `return` to return a value.
    Kotlin and Scala do not (at least in this example).

    +   - The body of the function is delimited by curly braces in Java and JavaScript.
    Python uses indentation. For a function body as simple as the absolute value,
    the Kotlin and Scala variants use nothing. (When defining more complex functions,
    Kotlin uses braces and Scala uses braces or indentation.)

    +   - Types are handled differently: Java uses a “type variable” syntax, while
    Kotlin and Scala use “variable: type.” More noticeably, JavaScript and Python
    do not mention types at all.

    +   - The languages use a different syntax to test whether input x is positive.
    Some rely on parentheses; some don’t. Some include a then keyword; others don’t.
    More importantly, the Python, Kotlin, and Scala variants use “if” as an expression,
    with a value. The Java and JavaScript variants do not.


    Some of these differences are trivial matters of syntax. Developers are expected
    to seamlessly navigate such minor variations when switching languages. You may
    write def a few times as you start programming in Kotlin, but it should not take
    long to adjust to writing fun instead. Other dissimilarities run deeper and will
    be revisited (typing strategies are discussed in Chapter 15, and the use of conditionals
    as expressions is discussed in Chapter 3). This book uses mostly Scala—with some
    Java—in its code illustrations. You may already be familiar with one or the other
    language—more often Java than Scala, I suspect—but should quickly get used to
    both as you read the code examples.


