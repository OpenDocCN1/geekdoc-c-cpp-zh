  md: "Section 2.5, we discussed extension methods, a mechanism to make a function\
    \ appear as a method. Here, what we need is a conversion in the opposite direction\
    \ so that we can use a method as a function.\n\nThe fancy name for this is η-conversion.\
    \ In λ-calculus, it states the equivalence between f and λx. f x. In plainer terms,\
    \ you can think of it as an equivalence between greaterThan90 and x => greaterThan90(x).\
    \ As units of computation, both perform the same task of asserting whether an\
    \ integer is greater than 90. Given that the argument of find must have type Int\
    \ => Boolean, and greaterThan90 is a method from Int to Boolean, the intent of\
    \ the expression temps.find(greaterThan90) is pretty clear, and the compiler is\
    \ able to insert the necessary η-conversion.\n\nOther languages offer similar\
    \ bridges to create a function out of a method, sometimes by relying on a more\
    \ explicit syntax. In Java, for instance, a lambda expression x -> target.method(x)\
    \ can be replaced with a method reference target::method. Kotlin uses a similar\
    \ syntax.\n\n# 9.5 Single-Abstract-Method Interfaces\n\nIn hybrid languages, functions\
    \ are objects, and lambda expressions are used as a convenient way to create such\
    \ objects. Indeed, the lambda expression syntax is so handy that many languages\
    \ let you use it to create instances of types other than functions.\n\nA single-abstract-method\
    \ (SAM) interface is an interface that contains exactly one abstract method. In\
    \ Scala, for instance, the type Function[A,B] (or, equivalently, A => B) is a\
    \ SAM interface with a single abstract method apply. We have used lambda expressions\
    \ in code illustrations to create instances of Function[A,B], but it turns out\
    \ that all SAM types can be instantiated using lambda expressions, even types\
    \ that are not related to Function:\n\n```\nScala\nabstract class Formatter:\n\
    \  def format(str: String): String\n  def println(any: Any): Unit = Predef.println(format(any.toString))\n\
    ```\n\nClass Formatter defines only one abstract method format and is therefore\
    \ a SAM interface. It can be implemented using lambda expressions:\n\n```\nScala\n\
    val f: Formatter = str => str.toUpperCase\nf.println(someValue)\n```\n\nNote how\
    \ method println is called on object f, which was defined as a lambda expression.\
    \ This is possible only because f was declared with type Formatter; the expression\
    \ (str => str.toUpperCase).println(\"foo\") would make no sense."
