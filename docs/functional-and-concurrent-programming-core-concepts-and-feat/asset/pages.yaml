  md: "order function map. Instead of focusing on the special case of string multiplication,\
    \ you could write a generic map function on futures:\n\n```\ndef map[A, B](future:\
    \ Future[A], f: A => B): Future[B] =\n  val promise = Promise[B]()\n  future.onComplete\
    \ {\n    case Success(value) => promise.complete(Try(f(value)))\n    case Failure(e)\
    \     => promise.failure(e)\n  }\n  promise.future\n```\n\nThis function is defined\
    \ for generic types A and B instead of strings. The only meaningful difference\
    \ with function multiply is that f might fail and is invoked inside Try. Consequently,\
    \ the promise could be failed for one of two reasons: No value of type A is produced\
    \ on which to apply f, or the invocation of function f itself fails.\n\nThe beauty\
    \ of bringing up map is that it takes us to a familiar world, that of higher-order\
    \ functions, as discussed in Chapters 9 and 10 and throughout Part I. Indeed,\
    \ the Try type itself has a method map, which you can use to simplify the implementation\
    \ of map on futures:\n\n```\ndef map[A, B](future: Future[A], f: A => B): Future[B]\
    \ =\n  val promise = Promise[B]()\n  future.onComplete(tryValue => promise.complete(tryValue.map(f)))\n\
    \  promise.future\n```\n\nListing 26.4: Reimplementing higher-order function map\
    \ on futures.\n\nNote how error cases are handled transparently, thanks to the\
    \ Try type (see Section 13.3 for the behavior of map on Try).\n\nFunctions as\
    \ values and higher-order functions constitute a fundamental aspect of functional\
    \ programming. Chapter 25 introduced futures as a way to start making concurrent\
    \ programming more functional by relying on a mechanism adapted to value-producing\
    \ tasks. Once you choose to be functional, you should not be surprised to see\
    \ higher-order patterns begin to emerge. But the story doesn’t end with map. Various\
    \ higher-order functions on futures give rise to a powerful concurrent programming\
    \ style that is both functional and non-blocking.\n\nYou don’t need to reimplement\
    \ map on futures: Scala futures already have a map method. You can simply write\
    \ function multiply as follows:\n\n```\ndef multiply(futureString: Future[String],\
