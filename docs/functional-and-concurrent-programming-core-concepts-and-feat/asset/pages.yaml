    \ can use it. Otherwise, you need to make sure that an ad will be available quickly.\
    \ For this purpose, you create a promise, and you use the timer to fulfill this\
    \ promise with a default ad after 0.5 second. You also add a callback action to\
    \ `adF`, which tries to fulfill the same promise. Whichever runs first—the timer\
    \ task or the customized ad task—will set the promise with its value.² The call\
    \ `timerF.cancel` is not strictly necessary, but it is used to avoid creating\
    \ an unnecessary default ad if the customized ad is available in time.\n\nAs part\
    \ of the last case study, Listing 28.4 uses a similar strategy to extend Scala\
    \ futures with a `completeOnTimeout` method.\n\n# 26.6 Functional-Concurrent Programming\
    \ Patterns\n\nBoth futures, on the one hand, and higher-order functions, on the\
    \ other hand, are powerful abstractions. Together, they form a potent combination,\
    \ though one that can take some effort to master. Even so, it is a worthwhile\
    \ effort. This section illustrates a few guidelines you should keep in mind as\
    \ you venture into functional-concurrent programming.\n\n# flatMap as an Alternative\
    \ to Blocking\n\nHigher-order functions are abstractions for code you don’t have\
    \ to write. They are convenient but could often be replaced with handwritten implementations.\
    \ If `opt` is an option, for instance, `opt.map(f)` could also be written:\n\n\
    ```\nScala -\nopt match\n  case Some(value) => Some(f(value))\n  case None   \
    \     => None\n```\n\nIn the case of futures, however, higher-order functions\
    \ are an alternative to computations that would be hard to implement directly.\
    \ If `fut` is a future, what can you replace `fut.map(f)` with? A future cannot\
    \ simply be “opened” to access its value, since the value may not yet exist. Short\
    \ of creating—and blocking—additional threads, there is no alternative to using\
    \ higher-order functions to act inside a future.\n\nYou can leverage your functional\
    \ programming skills with higher-order functions when working with futures. Earlier,\
    \ for instance, we used `flatMap` on options to chain computations that may or\
    \ may not produce a value. You can use `flatMap` in a similar way on futures to\
    \ chain computations that may or may not be asynchronous. Instead of “optional”\
    \ stages, from A to `Option[B]`, you define asynchronous stages, as functions\
    \ from A to `Future[B]`."
