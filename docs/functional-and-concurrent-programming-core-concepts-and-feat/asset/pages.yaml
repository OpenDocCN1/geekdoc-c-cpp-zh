  md: "Keep this principle in mind to help catch mistakes quickly. For instance, consider\
    \ this incorrect attempt to define a function to extract the last element of a\
    \ list:\n\n```\n// DON'T DO THIS!\ndef last[A](list: List[A]): A = list match\n\
