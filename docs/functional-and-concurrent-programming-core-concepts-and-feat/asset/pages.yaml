  md: "Other list functions could be reimplemented using pattern matching—for instance,\
    \ isEmpty:\n\n```\ndef isEmpty[A](list: List[A]): Boolean = list match\n  case\
    \ Nil => true\n  case _ => false\n\ndef isEmpty[A](list: List[A]): Boolean = list\
    \ match\n  case _ :: _ => false\n  case _ => true\n```\n\nListing 5.7: Reimplementing\
    \ isEmpty using pattern matching.\n\nThe first variant uses Nil to match the empty\
    \ list, and “_” to match every other—and therefore non-empty—list. The second\
    \ variant matches non-empty lists first, using pattern “_ :: _”, which matches\
    \ any list with a head and a tail. The next pattern matches only the list without\
    \ a head and tail—the empty list—and could have used Nil instead of “_” for clarity.\
    \ Either approach is correct.\n\nIn the implementation of function isEmpty, patterns\
    \ are used only to distinguish between empty and non-empty lists, while in head\
    \ and tail they also extract a component from a non-empty list. Depending on your\
    \ needs, you can match a non-empty list with any of the following patterns:\n\n\
    ```\n_ :: _            // nothing captured\nhead :: _          // capture head\
    \ only\n_ :: tail          // capture tail only\nhead :: tail       // capture\
    \ head and tail\nall @ head :: tail // capture head, tail, and the entire list\n\
    all @ head :: _    // capture head and the entire list\nall @ _ :: tail    //\
    \ capture tail and the entire list\nall @ _ :: _       // capture the entire list\n\
    ```\n\nPatterns can be nested arbitrarily. In particular, you can use “@” to capture\
    \ a component of a composite type while breaking it into its own components at\
    \ the same time. For instance, if an expression is a list of options of pairs,\
    \ pattern matching can be applied to the list, and to an option inside the list,\
    \ and to a pair inside an option, all within the same pattern:\n\n```\nList(Some((\"\
    foo\", 42)), None) match\n  case (head @ Some(str, n)) :: tail => <expr>\n```\n\
    \nInside expression <expr>, variables head, str, n, and tail denote the following\
    \ values:"
