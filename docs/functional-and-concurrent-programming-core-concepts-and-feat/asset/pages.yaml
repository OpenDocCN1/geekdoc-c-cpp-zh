  md: '# # Chapter 10

    ## Standard Higher-Order Functions


    Functional programming libraries typically define a common collection of higher-order
    functions that implement a core set of patterns. Developers can also implement
    their own higher-order functions to provide users with these standard patterns.
    Of particular interest are `filter`, `map`, and `flatMap`, which have deep theoretical
    underpinnings and are supported with a dedicated syntax in some languages. Most
    code examples in this chapter focus on lists and options for simplicity, but higher-order
    functions are typically available on many other types.


    # ### 10.1   Functions with Predicate Arguments


    The theme of higher-order functions was motivated in Chapter 9 using a function
    `find`, which takes as an argument a test function and searches for an element
    that satisfies the test. The functional argument of `find` is a Boolean function,
    also called a predicate. This section explores other standard higher-order functions
    that use a predicate argument. As was done for `find`, functions are discussed
    in terms of the corresponding methods available in Scala.


    Function `find` searches for an element that satisfies a Boolean test and returns
    it as an option. Sometimes, you only need to know whether such an element exists,
    without getting the element itself. Function `exists` does just that:


    ```

    ```scala

    val temps = List(88, 91, 78, 69, 100, 98, 70)


    temps.exists(_ > 90)  // true

    temps.exists(_ > 100) // false

    ```

    ```


    Function `exists` corresponds to the existential quantifier in logic (∃). The
    dual universal quantifier (∀) is available as a function `forall`:


    ```

    ```scala

    temps.forall(temp => 32 <= temp && temp <= 100) // true

    ```

    ```'
