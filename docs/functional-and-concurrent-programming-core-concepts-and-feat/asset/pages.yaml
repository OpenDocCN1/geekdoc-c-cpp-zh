- pgno: 243
  md: '# Chapter 14


    # Case Study: Trampolines


    The Scala compiler optimizes (most) tail recursive functions and generates code
    that implements them as loops. Other languages, like Java, do no such thing. In
    Scala, tail-calls outside tail recursive functions are not optimized. This case
    study implements trampolines, a classic strategy used for tail-call optimization.
    It shows how trampolines can be used to implement tail recursive calls without
    growing the execution stack, even in Java. The strategy is then refined to handle
    non-tail-calls.




    Recall our earlier discussion of tail recursive functions in Section 6.5. Some
    compilers, including Scala’s, optimize the implementation of functions that make
    a single recursive call as their very last operation:¹


    ```

    @tailrec

    def zero(x: Int): Int = if x == 0 then 0 else zero(x - 1)


    zero(1_000_000) // 0

    ```


    Function zero is implemented as a loop and can handle large input values.


    The current Scala compiler, however, does not optimize all tail-calls. In particular,
    tail-calls in mutually recursive functions grow the execution stack:


    ```

    def isEven(n: Int): Boolean = if n == 0 then true else isOdd(n - 1)


    def isOdd(n: Int): Boolean = if n == 0 then false else isEven(n - 1)


    isEven(42) // true

    isOdd(42) // false

    isEven(1_000_000) // throws StackOverflowError

    ```


    Listing 14.1: Example of non-optimized tail-calls; contrast with Lis. 14.3'
  merge: -1
  img_proc: true
- pgno: 244
  md: "Even though the call to isOdd is the very last expression inside function isEven\
    \ (and vice versa), no optimization takes place and a call to isEven on a large\
    \ enough number causes a stack overflow.\n\n# 14.2 Trampolines for Tail-Calls\n\
    \nTrampolines² were mentioned briefly at the end of Chapter 6 as a possible technique\
    \ to optimize tail-calls. You can implement trampolines in terms of thunks, the\
    \ no-argument functions already discussed in the context of lazy evaluation. The\
    \ central idea is to replace a function call with a thunk that delays this call.\
    \ When evaluated, this thunk produces another thunk that contains the next function\
    \ call, and so on. This chain of thunks is lazily built and requires little memory.\
    \ Furthermore, the thunks can be evaluated one by one in a tail recursive function\
    \ (or in a loop), irrespective of stack size limitations.\n\nTrampolines can be\
    \ implemented as a type Computation, parameterized by the return type of the computation.\
    \ As in earlier case studies, access modifiers are omitted, and all classes in\
    \ this chapter are left public:³\n\n```\ntrait Computation[A]:\n  @tailrec\n \
    \ final def result: A = this match\n    case Done(value) => value\n    case Call(thunk)\
    \ => thunk().result\n\ncase class Done[A](value: A) extends Computation[A]\ncase\
    \ class Call[A](thunk: () => Computation[A]) extends Computation[A]\n```\n\nListing\
    \ 14.2: Trampoline for tail-call optimization in Scala.\n\nA computation takes\
    \ two forms: Done represents a completed computation with a final value, and Call\
    \ represents an ongoing computation as an unevaluated thunk. Method result evaluates\
    \ a computation by running all the thunks, one by one. It is tail recursive and\
    \ optimized by the Scala compiler into a loop.\n\n²The name trampoline comes from\
    \ the fact that an execution “bounces” from computation to computation instead\
    \ of relying on nested function calls. Trampolines can be described in terms of\
    \ continuations, but continuations are not covered in this book, and introducing\
    \ trampolines and continuations together in this case study would be confusing.\
    \ Instead, in this chapter, trampolines are viewed as a form of delayed evaluation.\n\
    \n³The Computation trait should be sealed to prevent subtypes other than Done\
    \ and Call from being added."
  merge: -1
  img_proc: true
