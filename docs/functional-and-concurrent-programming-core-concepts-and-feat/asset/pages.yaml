  md: "```\n```scala\nelse if k > key then right.contains(k)\nelse true\n```\n```\n\
    \nListing 8.2: Querying methods on binary search trees.\n\nMethod `size` is implemented\
    \ as in Listing 6.7, except that it uses `Empty` and `Node` methods instead of\
    \ functions. Method `height` is almost the same, but since the height of a tree\
    \ is the length of its longest branch, the heights of children are combined using\
    \ `max` instead of “+”. To find the smallest value in a tree, you only need to\
    \ follow the leftmost branch: If a tree has no left child, its smallest value\
    \ is its root; otherwise, it is the smallest value of the left child. Queries\
    \ for the largest value are symmetric.¹\n\nMethod `contains` follows the search\
    \ algorithm outlined earlier. If the target of the search (`k`) is smaller than\
    \ the key of the node (`key`), you search for it in the left child (it cannot\
    \ possibly be in the right child). If the target is larger, you search for it\
    \ in the right child. If it is neither smaller nor larger, it must be equal to\
    \ the node key and therefore has been found. Recursion operates through a call\
    \ to method `contains` on left or right. Note that these can be nodes (the search\
    \ continues) or empty trees (terminal case).\n\nThe next method to implement is\
    \ “+”, used to insert a key into a tree:\n\n```\n```scala\ndef + (k: Int): Node\
    \ =\n  if k < key then Node(key, left + k, right)\n  else if k > key then Node(key,\
    \ left, right + k)\n  else this\n```\n```\n\nListing 8.3: Key insertion in binary\
    \ search trees.\n\nThe structure of this method is similar to that of the lookup\
    \ method `contains`. If the key to be added, k, is less than the key of the node,\
    \ it needs to be added inside the left child. The call `left + k` produces a new\
    \ left child in which key k has been added. This new tree is combined with the\
    \ existing right child, unchanged, to build a new node. Inserting a key greater\
    \ than the key of the node works similarly on the right child. If the key to be\
    \ added is already present, the tree is returned unchanged.\n\nAdding a key to\
    \ a tree is a functional operation in which no tree is modified. Its input is\
    \ the tree before the insertion—`Node(key, left, right)`—and its output is a new\
    \ tree after the insertion—for example, `Node(key, left + k, right)`. Note that\
    \ the old tree and the new tree share data in memory: They refer to the same right\
    \ tree.\n\n¹In Scala, no-argument methods can be implemented as fields: `def size\
    \ = ...` could be replaced with `val size = ...`. The memory footprint of nodes\
    \ would increase, but size would become a constant-time operation. The same memory/speed\
    \ trade-off is possible for `height`, `min`, or `max`. The self-balancing trees\
    \ implemented in Section 8.4 rely heavily on height calculations and would benefit\
