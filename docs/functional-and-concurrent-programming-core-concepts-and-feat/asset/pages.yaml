  md: "# 12.5 Streams as Lazily Evaluated Lists\n\n```\n```scala\ndef searchData(data:\
    \ LazyList[Data]): Option[Data] =\n  if data.isEmpty then None\n  else if data.head.value\
    \ > 10 then Some(data.head)\n  else searchData(data.tail)\n```\n```\n\nExcept\
    \ for the method’s signature, this code is identical to a variant that uses lists.\
    \ Note that, due to memoization, the head of the stream is evaluated only once,\
    \ even though data.head is used twice in the code. Furthermore, if this first\
    \ piece of data has a value greater than 10, no other stream element is evaluated.\n\
    \nLazyList supports pattern matching, and you can also write the recursive searching\
    \ function as follows:\n\n```\n```scala\ndef searchData(data: LazyList[Data]):\
    \ Option[Data] = data match\n  case LazyList() => None\n  case head #:: tail =>\
    \ if head.value > 10 then Some(head) else searchData(tail)\n```\n```\n\nThis implementation\
    \ is similar to pattern matching and recursion on lists. The only differences\
    \ are the empty stream pattern—LazyList() instead of Nil—and the “cons” operator—named\
    \ “#::” on streams instead of “::” on lists. For this simple searching task, though,\
    \ your best strategy is to rely on the standard higher-order methods defined on\
    \ the LazyList type:\n\n```\n```scala\ndef searchData(data: LazyList[Data]): Option[Data]\
    \ = data.find(_.value > 10)\n```\n```\n\nUsually, list-creating code can be easily\
    \ modified to produce streams instead. For instance, the hanoi function, written\
    \ in Chapter 6 to illustrate recursion, simply prints each move as a string. To\
    \ display moves graphically, it could be inconvenient to incorporate graphics\
    \ code directly inside the solving function. Instead, you can separate the creation\
    \ of moves from their display by having a solving function create a list of moves\
    \ and a displaying function consume it:\n\n```\n```scala\ndef hanoi[A](n: Int,\
    \ from: A, mid: A, to: A): List[(A, A)] =\n  if n == 0 then List.empty\n  else\
    \ hanoi(n - 1, from, to, mid) :: (from, to) :: hanoi(n - 1, mid, from, to)\n```\n\
    ```\n\nListing 12.6: Tower of Hanoi moves as a list: contrast with Listing 12.7.\n\
    \nInstead of printing them, this function returns the moves as a list of pairs\
    \ (from, to). If you want a stream instead of a list, the necessary changes to\
    \ the code are trivial:"
