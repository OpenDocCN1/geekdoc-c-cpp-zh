  md: '# Chapter 12


    # Lazy Evaluation


    By using functions as values, it becomes possible to replace data with a function
    that computes this data. With this approach, the evaluation of arguments can be
    delayed until they are needed, making it possible to pass unevaluated code to
    methods and functions. Combined with syntactic help from the language, it becomes
    possible to define additional control structures from within a programming language,
    leading potentially to the definition of an internal domain-specific language.
    Functions can also be stored within data structures to delay the evaluation of
    parts of that structure. Streams are a classic functional programming structure
    that implements lazily evaluated sequences. Besides un evaluated arguments and
    lazy data structures, lazy evaluation can take a few other forms, such as views
    that delay the evaluation of higher-order functions and mechanisms for the lazy
    initialization of variables.




    We have seen that higher-order functions can take in arguments that are themselves
    functions. By replacing an explicit argument, such as a string, with a function
    that computes this argument, you can delay the computation of the string until
    its value is needed.


    ```

    ```scala

    val logger: Logger = ...


    logger.info("incoming request from ${ip.getHostName} (${ip.getAddress})")

    ```

    ```


    A drawback of this method is that the string argument is always built, even when
    logging at the INFO level is disabled. In this example, if logging is set at the
    WARNING level, a potentially costly hostname lookup still takes place to create
    a string that is immediately discarded.


    Java 8 introduced a second info method to the Logger class. It replaces the string
    argument with a function that returns a string:


    ```

    ```scala

    logger.info(() => "incoming request from ${ip.getHostName} (${ip.getAddress})")

    ```

    ```'
