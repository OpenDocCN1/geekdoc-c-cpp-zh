    # NOTE


    At this point, you may expect the obligatory discussion of concurrency versus
    parallelism to take place. In books and Internet blogs, this is often considered
    to be a fundamental point to be addressed early on. I disagree. As definitive
    as the many explanations aim to be, they tend to be inconsistent with one another.
    If you corner me, as students have, and insist that I make a distinction, my view—inspired
    by the Association for Computing Machinery (ACM) Computer Science Curricula 2013—is
    that parallelism is the concurrency I want (for speed!), and concurrency is the
    parallelism I need to deal with (all those things happening at the same time in
    my program). However, my argument here is that it doesn’t matter much. By and
    large, you face the same programming challenges whether you attribute them to
    parallelism or to concurrency. For the purposes of this book, it is enough to
    stick with basic dictionary definitions and to think of parallelism and concurrency
    as synonymous, both representing the idea of several actions taking place at (about)
    the same time. In the following chapters, I use both terms interchangeably.


