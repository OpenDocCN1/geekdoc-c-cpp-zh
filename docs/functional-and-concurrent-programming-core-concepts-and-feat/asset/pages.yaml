  md: "As an illustration, consider again the problem of searching files in parallel.\
    \ Each task consists of two stages: Find targeted data in files and store the\
    \ search results. An implementation could proceed as follows:\n\n```\nScala\n\
    val exec: ExecutorService = ...\ndef isMatch(line: String): Boolean = ...\nval\
    \ files: ConcurrentLinkedQueue[Path] = ...\nval out: Writer = ...\n\ndef searchFile(path:\
    \ Path): Unit =\n  Using.resource(Source.fromFile(path.toFile)(UTF8)) { in =>\n\
    \    for line <- in.getLines() do\n      if isMatch(line) then out.synchronized\
    \ { out.write(line); out.write('\\n') }\n  }\n\nval searchTask: Runnable = ()\
    \ =>\n  var file = Option(files.poll())\n  while file.nonEmpty do\n    searchFile(file.get)\n\
    \    file = Option(files.poll())\n\nN times exec.execute(searchTask)\n```\n\n\
    In this code, the files to search are stored in a concurrent queue. The queue\
    \ needs to be thread-safe because all the searching tasks obtain files from it\
    \ in parallel. Each searching task keeps taking files from the queue until the\
    \ queue is empty, at which point the task terminates. The queue does not need\
    \ to be blocking: It is filled with files initially and is not used after it is\
    \ empty. You need to use poll—which returns null³ on an empty queue—to extract\
    \ a file from the queue: if !files.isEmpty then file = files.take() would not\
    \ work because of a non-atomic check-then-act. Each file is searched sequentially,\
    \ and matching lines are added to a shared output file. You need to lock accesses\
    \ to this file because, even though instances of type Writer tend to be thread-safe\
    \ in Java, line contents and newline separators could be improperly interleaved\
    \ otherwise.⁴\n\nInstead of making all the searching tasks add their results to\
    \ a shared output, you could refactor the code into a producer–consumer pattern\
    \ in which producers create matching lines from files, and a single consumer stores\
    \ these lines into the output file:\n\n³To deal with null, values are wrapped\
    \ into options, as was done in Section 12.2.\n\n⁴Class PrintWriter defines an\
    \ atomic println method, which I could have used here. However, it is implemented\
    \ as two calls to method write in a synchronized block, just as in my searchFile\
    \ method."
