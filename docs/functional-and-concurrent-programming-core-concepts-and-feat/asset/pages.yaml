- pgno: 249
  md: "```\ntrait Computation[A]:\n  @tailrec\n  final def result: A = this match\n\
    \    case Done(value) => value\n    case Call(thunk) => thunk().result\n    case\
    \ FlatMap(f, arg) => arg match\n      case Done(v) => f(v).result\n      case\
    \ Call(thunk) => thunk().flatMap(f).result\n      case FlatMap(g, arg2) => arg2.flatMap(x\
    \ => g(x).flatMap(f)).result\n\ndef flatMap[B](f: A => Computation[B]): Computation[B]\
    \ = FlatMap(f, this)\n\ndef map[B](f: A => B): Computation[B] = flatMap(x => Done(f(x)))\n\
    \ncase class Done[A](value: A) extends Computation[A]\ncase class Call[A](thunk:\
    \ () => Computation[A]) extends Computation[A]\n\ncase class FlatMap[A, B](f:\
    \ A => Computation[B], arg: Computation[A])\n  extends Computation[B]\n```\n\n\
    Listing 14.6: Trampoline extended with map and flatMap.\n\nListing 14.6 introduces\
    \ a third class, FlatMap. Invocations of flatMap do nothing but create an instance\
    \ of this class.\n\nThe implementation of result is trickier. You can deal with\
    \ the first two cases, Done and Call, as before. However, when you need to evaluate\
    \ an instance FlatMap(f, arg), you need special handling for the case where arg\
    \ is itself a FlatMap to deal with chains of calls to flatMap. The evaluation\
    \ of FlatMap(f, arg), which is arg.flatMap(f), proceeds according to the nature\
    \ of arg:\n\n+   - Done(v).flatMap(f) is f(v).\n+   - Call(thunk).flatMap(f) evaluates\
    \ to thunk().flatMap(f), which is processed recursively.\n+   - The last case\
    \ represents chained calls to flatMap. The expression to evaluate is FlatMap(g,\
    \ arg2).flatMap(f), which is arg2.flatMap(g).flatMap(f). It is replaced with the\
    \ equivalent expression arg2.flatMap(x => g(x).flatMap(f)), which reduces a two-flatMap\
    \ chain to a single flatMap and is evaluated recursively. This avoids any nested\
    \ invocation of result, which was the source of our troubles in the previous implementation.\n\
    \nOnce flatMap is implemented, map can be written in terms of it: comp.map(f)\
    \ is equivalent to comp.flatMap(x => Done(f(x))). With this implementation of\n\
    \n5This equivalence is one of the fundamental properties of flatMap, discussed\
    \ in an aside on monads at the end of Section 10.3."
