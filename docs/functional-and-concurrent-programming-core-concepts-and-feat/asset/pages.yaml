  md: 'actor, making it possible to use non-thread-safe code during message processing.
    Passive actors, with no pending messages, use no computing resources. They do
    not block threads, which remain available to run active actors.


    +   - Frameworks also exist to process streams of data in parallel while avoiding
    thread blocking when data is not available. Reactive streams complement futures—which
    eventually either produce a single value or fail—by being able to produce zero
    or more values before they terminate. A generic reactive streams specification
    (www.reactive-streams.org) has been implemented in a variety of programming languages.

    +   - When code does not block threads, performance often improves, and many synchronization
    mistakes common to programming with locks are avoided. Non-blocking approaches,
    however, are not fool-proof. Concurrent entities still need to correctly coordinate
    to achieve overall computational objectives. In particular, synchronization mistakes
    can still result in deadlocks—of futures, coroutines, or actors—even if the underlying
    threads are not blocked.'
