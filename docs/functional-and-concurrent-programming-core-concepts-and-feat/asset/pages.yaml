- pgno: 439
  md: "The role of `updater` in Listing 27.1 is to provide a CAS operation on the\
    \ `value` field of the class.⁵ This gives you an atomic check-then-act that is\
    \ sufficient to safely implement `incrementAndGet`. First, you read the number\
    \ in `value` into a local variable `current`. Then, you use CAS to update `value`:\
    \ If it is still equal to `current`, it is replaced with `next`, which is `current\
    \ + 1`. If the CAS fails and returns false, it is an indication that another thread\
    \ has modified `value` after it was read. In that case, you use a loop to read\
    \ the new contents of `value`, and you attempt the increment operation again.\n\
    \nOne way to think about this implementation is that, instead of using locks to\
    \ guard against interference, a thread proceeds under an optimistic assumption\
    \ that no other thread will interfere with its operation. If, however, interference\
    \ does take place, it is detected from the failure of CAS, and the operation is\
    \ restarted.\n\nWhen two threads modify an atomic integer at the same time, it\
    \ is possible that a thread ends up computing `next = current + 1` twice, but\
    \ the cost of the additional increment is negligible compared to the time it takes\
    \ to park and unpark a thread. Even if more than two operations are involved and\
    \ some threads end up repeating the loop multiple times before a CAS is successful,\
    \ this non-locking strategy tends to outperform a lock-based one, unless the number\
    \ of threads is extreme.\n\nThe Java standard library defines other types with\
    \ atomic operations, such as `AtomicLong` and `AtomicBoolean`. As an illustration\
    \ of the latter, you can rewrite the thread-safe box from Listing 22.4 without\
    \ using any lock:\n\n```\nclass SafeBox[A]:\n  private var contents: A = uninitialized\n\
    \  private val filled      = CountDownLatch(1)\n  private val isSet       = AtomicBoolean(false)\n\
    \n  def get: A =\n    filled.await()\n    contents\n\n  def set(value: A): Boolean\
    \ =\n    if isSet.get || isSet.getAndSet(true) then false\n    else\n      contents\
    \ = value\n      filled.countDown()\n      true\n```\n\nListing 27.2: Thread-safe\
    \ box with a latch and no lock.\n\nMethod `get` is implemented by simply reading\
    \ `contents` after the latch has been opened (as in Listing 22.8). Inside `set`,\
    \ you can use an atomic Boolean to make sure that the box is successfully set\
    \ by only one thread. The Boolean is false initially and can be flipped from false\
    \ to true only once using `getAndSet`. The implementation of `AtomicBoolean`\n\
    \n⁵The actual `AtomicInteger` class from `java.util.concurrent` uses a different\
    \ updater, but the principle is the same."
