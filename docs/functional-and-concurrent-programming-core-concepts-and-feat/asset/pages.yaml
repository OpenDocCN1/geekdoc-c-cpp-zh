  md: 'values—as opposed to acting in some way on the state of an application, they
    need to be composed differently. Let’s supplement the absolute value function
    with a second function, dots, for the purpose of an illustration:


    ```

    def dots(length: Int): String = "." * length

    ```


    This function creates a string of dots of a specified length. It can be combined
    with the absolute value function to produce the string "..." from the number -3:


    ```

    dots(abs(-3)) // the string "..."

    ```


    Functions are composed by using the output of a function as the input to another
    function. Note that I did not use sequential composition and did not write:


    ```

    abs(-3);

    dots(-3);

    ```


    which would not have the desired effect. For sequential composition to work, function
    abs would need to change a number (into its absolute value) before dots uses it
    to build a string. This would work:


    ```

    num = -3;

    num = abs(num);

    dots(num); // the string "..."

    ```


    However, this pattern cannot be expressed without introducing a variable num.
    You need to store the effects of the first part of the sequence somewhere and
    tell the second part where to find them.


    Functions can be composed more easily because their effects are local. Ideally,
    a function only needs to know its input and does nothing more than produce an
    output (see the discussion of pure functions in Chapter 3). This makes it possible
    to compose functions into larger functions, for which functional programming languages
    define specific operators:


    ```

    (dots compose abs)(-3) // the string "..."

    (abs andThen dots)(-3) // the string "..."

    ```


    Functions abs and dots are composed, and the composed function is then applied
    to the argument -3. By contrast, you cannot compose two sequential code fragments
    into one without tying them together by mentioning explicitly what is being transformed
    by the'
