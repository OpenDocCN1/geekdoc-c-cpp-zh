  md: '# 7.8 Illustration: Sorting


    +   • Quick-sort: Split a list into low and high values, sort both parts recursively,
    then concatenate the two sorted lists into one.


    Merge-sort uses a simple strategy to split a list in two, but has more work to
    do to merge the lists after they have been sorted. Quick-sort relies on a more
    complicated splitting strategy, but once sorted, lists only need to be concatenated.


    ```

    def merge(sortedA: List[Int], sortedB: List[Int]): List[Int] = (sortedA, sortedB)
    match

    case (Nil, _) => sortedB

    case (_, Nil) => sortedA

    case (hA :: tA, hB :: tB) =>

    if hA <= hB then hA :: merge(tA, sortedB) else hB :: merge(sortedA, tB)

    ```




    The merging of sorted lists starts with two patterns to deal with empty lists—merging
    a list with an empty list results in the list itself. The last pattern then compares
    the heads of two non-empty lists. Whichever is smaller needs to come first in
    the merged list. Once this value is selected, the remainder of the two lists are
    merged recursively. With the merging function thus written, you implement the
    merge-sort by using functions length and splitAt to split a list in the middle.


    An easy mistake would be to forget the case List(_) in the first pattern in mergeSort.
    As mentioned earlier, in the discussion of Listing 6.5, this would result in a
    non-terminating function. As a variant, you can apply pattern matching to the
    length of the list, which is needed for the split, and write the merge-sort function
