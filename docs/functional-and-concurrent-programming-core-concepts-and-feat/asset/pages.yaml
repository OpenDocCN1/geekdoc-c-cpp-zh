  md: 'Method “−” starts like method “+”, by removing the target key k from either
    the left or the right child. However, the case k == key, which is trivial in the
    insertion method, is more challenging in the removal method. After removing the
    root of the tree, you are left with two separate child trees. If either child
    is empty, you can simply return the other tree, which contains all the keys in
    the set.


    The complicated case is the final else: You are removing the root of a tree, and
    both the left and right children are non-empty. In that case, you need to extract
    a key from a child, and use it as the new root key. To maintain the ordering property
    of binary search trees, a common strategy is to focus on the smallest key of the
    right child (or, alternatively, the largest key of the left child). The smallest
    key of the right child is greater than all the keys in the left child (all the
    right child keys are). It is also smaller than all the other keys in the right
    child. Therefore, you can use this key as a new root, and use the remaining keys
    of the right child to create a new right child. This way, the new root is larger
    than all the keys in the left child and smaller than all the keys in the new right
    child.


    Extracting this key is the task of method minRemoved, which returns a pair: the
    smallest key of a tree and the tree without this key. To remove key 57—the root—from
    the example tree in Figure 8.1, you apply minRemoved to the right child. This
    produces a pair (minRight, othersRight), where minRight is 60 and othersRight
    is the tree:


    ![](img/74309e2bdd93f68d2e94338a3d73517f_143_0.png)


    You then use minRight as the root of a new node whose right child is othersRight.
    The left child is unchanged. Figure 8.2 shows the resulting tree.


