- pgno: 32
  md: 'Given the book’s objectives, there are several benefits to using Scala for
    code illustrations. First, this language is feature-rich, making it possible to
    illustrate many concepts without switching languages. Many of the standard features
    of functional and concurrent programming exist in Scala, which also has a powerful
    type system. Second, Scala was introduced fairly recently and was carefully (and
    often beautifully) designed. Compared to some older languages, there is less historical
    baggage in Scala that can get in the way when discussing underlying concepts.
    Finally, Scala syntax is quite conventional and easy to follow for most programmers
    without prior exposure to the language.


    Nevertheless, it is important to keep in mind that programming language features,
    rather than Scala per se, are the focus of this book. Although I personally like
    it as a teaching language, I am not selling Scala, and this is not a Scala book.
    It just happens that I need a programming language that is clean and simple in
    all areas of interest, and I believe Scala meets these requirements.


    # Target Audience


    The target audience is programmers with enough experience to not be distracted
    by simple matters of syntax. I assume prior Java experience, or enough overall
    programming experience to read and understand simple Java code. Concepts such
    as classes, methods, objects, types, variables, loops, and conditionals are assumed
    to be familiar. A rudimentary understanding of program execution—execution stack,
    garbage collection, exceptions—is also assumed, as well as basic exposure to data
    structures and algorithms. For other key terms covered in depth in the book, the
    glossary provides a basic definition and indicates the appropriate chapter or
    chapters where the concept is presented.


    *No prior knowledge of functional or concurrent programming is assumed. No prior
    knowledge of Scala is assumed.* Presumably, many readers will have some understanding
    of functional or concurrent concepts, such as recursion or locks, but no such
    knowledge is required. For instance, I do not expect you to necessarily understand
    the functional Python and Java programs discussed earlier, or the two Java concurrent
    programs, or the last two Scala functions. Indeed, I would argue that if these
    programs feel strange and mysterious, this book is for you! By comparison, the
    imperative variant of the number-shifting program should be easy to follow, and
    I expect you to understand the corresponding code, whether it is written in Java,
    Python, or Scala. You are expected to understand simple Scala syntax when it is
    similar to that of other languages and to pick up new elements as they are introduced.


    The syntax of Scala was inspired by Java’s syntax—and that of Java by C’s syntax—which
    should make the transition fairly straightforward for most programmers. Scala
    departs from Java in ways that will be explained as code examples are introduced.
    For now, I’ll highlight just three differences:


    +   - *Semicolon inference.* In Scala, terminating semicolons are inferred by
    the compiler and rarely used explicitly. They may still appear occasionally—for
    instance, as a way to place two statements on the same line.'
