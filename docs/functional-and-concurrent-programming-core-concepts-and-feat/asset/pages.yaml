- pgno: 437
  md: "# Chapter 27\n\n# Minimizing Thread Blocking\n\nChapter 26 advocates the functional\
    \ use of futures in a programming style that minimizes thread blocking. Over the\
    \ years, much effort has been spent trying to avoid unnecessary thread blocking,\
    \ often for performance reasons.¹ This chapter provides a quick overview of some\
    \ popular techniques that strive not to block threads and often abstain from using\
    \ locks and other synchronizers.\n\n# 27.1 Atomic Operations\n\nAs a first illustration,\
    \ consider the case of class java.util.concurrent.AtomicInteger, used in some\
    \ earlier examples. It is straightforward to implement a thread-safe mutable integer\
    \ in Java² using locks:\n\n```\n// THIS IS NOT java.util.concurrent.AtomicInteger!\n\
    private int value = 0;\n\npublic synchronized int get() {\n    return value;\n\
    }\n\npublic synchronized int incrementAndGet() {\n    value += 1;\n    return\
    \ value;\n}\n```\n\nThis code is correct and thread-safe, but not necessarily\
    \ efficient. If two threads share such an integer, and both invoke incrementAndGet\
    \ at the same time, one thread successfully acquires the object’s intrinsic lock\
    \ and the other thread is blocked. This is undesirable because it will take a\
    \ lot more time to park and unpark this thread than is needed for the other thread\
    \ to execute value += 1. When the lock is not available, it\n\n¹This process is\
    \ still ongoing. On the JVM, in particular, see https://openjdk.org/jeps/425,\
    \ known as Project Loom.\n\n²The first code examples are in Java because the standard\
    \ AtomicInteger is a Java class, and also because it uses constructs—atomic updaters—that\
    \ are not available in Scala."
  merge: -1
  img_proc: true
- pgno: 438
  md: "would be better for a thread to waste a few CPU cycles spinning instead of\
    \ blocking, until another thread is done incrementing the integer.\n\nThe actual\
    \ class `AtomicInteger` does not use a lock. Conceptually, it is implemented as\
    \ follows:\n\n```\n```java\npublic class AtomicInteger {\n\n    private static\
    \ final AtomicIntegerFieldUpdater<AtomicInteger> updater\n        = newUpdater(AtomicInteger.class,\
    \ \"value\");\n\n    private volatile int value;\n\n    public int get() {\n \
    \       return value;\n    }\n\n    public int incrementAndGet() {\n        while\
    \ (true) {\n            int current = value;\n            int next = current +\
    \ 1;\n            if (updater.compareAndSet(this, current, next))\n          \
    \      return next;\n        }\n    }\n    ...\n}\n```\n```\n\nListing 27.1: Conceptual\
    \ implementation of class `AtomicInteger` in Java.\n\nNo method is synchronized,\
    \ and the implementation does not rely on any locking mechanism. Instead, variable\
    \ value is volatile and accessed without locking.\n\nReading the integer is not\
    \ a problem: Method `get` simply reads and returns value. Method `incrementAndGet`,\
    \ however, presents an atomicity challenge. You need to avoid the scenario in\
    \ which two threads that enter the method concurrently overwrite each other’s\
    \ updates (see the discussion in Section 18.1).\n\nThe implementation relies on\
    \ a compare-and-set (CAS) operation:\n\n```\n`compare-and-set(target, expectedValue,\
    \ newValue)`\n```\n\nThis expression sets a target to a new value, but only if\
    \ the target equals an expected value. If the target is different from the expected\
    \ value, the CAS operation does not modify it. Semantically, this is equivalent\
    \ to if (target == expected) target = newValue, except that the check-then-act\
    \ is performed atomically. A CAS returns true if the target is successfully updated,\
    \ and false otherwise.\n\n> For this reason, modern JVM implementations often\
    \ do not park a thread right away when a lock is not available, but instead spin\
    \ for a while first, in case the lock becomes available quickly.\n> \n> Compare-and-set\
    \ is sometimes also called *compare-and-swap*. The difference is that compare-and-swap\
    \ returns the value of a variable before the swap, while compare-and-set returns\
    \ a Boolean."
