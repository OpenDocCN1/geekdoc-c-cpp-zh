  md: 'thanks to data sharing between a, b, and c. Because lists are immutable, this
    sharing is harmless. The same is true, to some degree, of other persistent data
    structures. The method “+” used earlier on an immutable set does not make a full
    copy of the set. If largeSet contains 1 million elements, largeSet + x is a new
    set that contains 1 million and one elements, but the two sets share the vast
    majority of the memory allocated to implement them.


    ![](img/74309e2bdd93f68d2e94338a3d73517f_70_0.png)


    Figure 3.1 Functional lists memory sharing.


    Another consequence of this data sharing is that, on functional lists, both the
    head and the tail methods are efficient, constant-time operations—typically, a
    single pointer dereference. As long as you can express an algorithm in terms of
    head and tail, lists make a reasonable implementation choice. Be aware, however,
    that other list operations may not be as fast. Methods such as last and length,
    for instance, require a computing time that is proportional to the length of the
    list, and methods such as appended or concat need to copy the entire list.


    The second reason the head/tail structure of functional lists is important is
    that the tail of a non-empty list is itself a list. In consequence, many computations
    on lists can be implemented efficiently using recursion. Chapter 7 is dedicated
    to recursive programming with lists.


    # 3.8 Hybrid Designs


    In a purely functional programming approach, all functions are pure, and all values
    are immutable. There is nothing wrong with that—and plenty that is good—but sometimes
    programmers prefer a more hybrid approach that combines pure functions and values
    with actions and mutable objects. If you are used to an imperative programming
    style, you can start using some functional programming features without committing
    to a fully functional design. In particular, there are some benefits from relying
    on immutable values when building mutable objects, and vice versa.'
