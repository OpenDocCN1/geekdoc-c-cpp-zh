    # 6.2 Recursive Algorithms


    In textbooks and tutorials, factorial is the most widely used example of a recursive
    function. Since no book that discusses recursive programming would be complete
    without it, here it is, in Scala:


    ```

    def factorial(n: Int): Int = if n == 0 then 1 else n * factorial(n - 1)

    ```


    Listing 6.2: Recursive implementation of factorial; contrast with Lis. 6.11.


    This code is certainly elegant. It is shorter and uses fewer variables than a
    loop-based alternative. However, I do not believe it makes a very good motivation
    for the use of recursion. You can easily implement a factorial function with a
    loop, and the resulting code is likely to be more efficient. The same can be said
    of many other typical textbook illustrations of recursion, such as the greatest
    common divisor.² So, if you have seen the factorial example in the past, and it
    has left you unimpressed, no worries. This book contains dozens of examples of
    recursive functions, and ideally you will find later illustrations more persuasive.


    The Tower of Hanoi is another classic teaching example, which is a more effective
    example than the factorial or greatest common divisor problem. It represents a
    puzzle, in which discs of assorted sizes are stacked on three pegs. Initially,
    all the discs are stacked on the leftmost peg, in decreasing order of size. The
    objective of the game is to move all the discs to the rightmost peg, using the
    middle peg for intermediate storage, and while adhering to the following rules:


    +   - You can move only one disc at a time.

    +   - Only the topmost discs can be moved.

    +   - No disc can rest on top of a smaller disc.


    Figure 6.1 shows the seven steps required to move a three-disc tower from left
    to right.


    You can solve the Tower of Hanoi problem with a recursive algorithm: To move n
    discs from peg L to peg R using peg M, if n > 0, first move n − 1 discs from L
    to M'
