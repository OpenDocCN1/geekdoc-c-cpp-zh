  md: "Here, you use the whole switch expression as the value returned by the function.\
    \ Later, Java added type testing and logical guards:\n\n```\n<A> String listInfo(List<A>\
    \ list) {\n    return switch (list) {\n        case null -> \"no list\";\n   \
    \     case List<A> empty when empty.isEmpty() -> \"an empty list\";\n        case\
    \ RandomAccess seq -> \"a random access list\";\n        default -> \"some other\
    \ list\";\n    };\n}\n```\n\nJava also recently introduced pattern matching of\
    \ records, which are similar to Scala’s case classes (see Section 5.2):¹\n\n```\n\
    record TempRecord(String city, int temperature) {}\n\nTempRecord rec = ...\n\n\
    String str = switch (rec) {\n    case TempRecord(String city, int temp) -> \"\
    %d in %s\".formatted(temp, city);\n};\n```\n\nSome of Scala’s fancier patterns,\
    \ such as case TempRecord(\"Phoenix\", temp) and case TempRecord(city, temp) if\
    \ temp >= 100, are not possible in Java.\n\nKotlin’s when construct offers similar\
    \ but different capabilities:\n\n```\nval str: String = when (obj) {\n    1 ->\
    \ \"One\"\n    2, \"2\" -> \"Two\"\n    is List<*> -> \"A list\"\n    !is String\
    \ -> \"Not a string\"\n    else -> \"Unknown\"\n}\n```\n\nThe when construct neither\
    \ supports arbitrary guards nor the deconstruction of records as in Java and Scala.\n\
    \n> ¹The last two Java examples in this section and the Java code in Section A.4\
    \ use a pattern matching syntax that is available only as a preview in Java 19."
