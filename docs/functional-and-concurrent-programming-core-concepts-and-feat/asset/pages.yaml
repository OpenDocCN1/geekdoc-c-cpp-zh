    two\", \"three\", \"four\")\nbetween(words, \"four\", \"two\") // List(\"two\"\
    , \"three\", \"four\")\n```\n\nBut if either target is missing, the function falls\
    \ apart:\n\n```\nbetween(words, \"two\", \"five\") // List(\"one\", \"two\")\n\
    between(words, \"ten\", \"four\") // List(\"one\", \"two\", \"three\", \"four\"\
    )\n```\n\nNo error is reported, but the outputs make no sense. Of course, the\
