- pgno: 179
  md: 'A string is a sequence of characters, but a sequence of integers is no longer
    a string, and a different type of (indexed) sequence must be used. Similarly,
    a bit-set makes sense only for integers, and a different type of (sorted) set
    must be chosen to contain floating-point numbers.


    If you want to apply a function for side-effect purposes, and the values it returns
    are irrelevant, use foreach instead of map:


    ```

    val out: DataOutputStream = ...

    temps.foreach(temp => out.writeInt(temp))

    ```


    Function foreach applies the given function to all the elements in a structure,
    just like map. The difference is that foreach does not return anything—its return
    type is Unit. Note that temps.map(temp => out.writeInt(temp)) would write all
    the temperatures to the output stream but would also produce a list of unit values—returned
    by method writeInt, which is void in Java—one per temperature written. This list
    is useless but, short of a compiler optimization, would have to be created and
    garbage collected.


    You can also use foreach to apply functions that return meaningful values, but
    the values are still ignored:


    ```

    val writer: Writer = ...

    temps.foreach(temp => writer.append(temp.toString).append(''\n''))

    ```


    Even though method append returns the writer itself, the call to foreach returns
    unit. Using map instead of foreach would produce a useless list of references
    to the writer.


    # 10.3 flatMap


    Function flatMap is a variation of map that “flattens” the values being produced:


    ```

    List(1, 2, 3).map(x => List(x, x, x))

    // List(List(1, 1, 1), List(2, 2, 2), List(3, 3, 3))


    List(1, 2, 3).flatMap(x => List(x, x, x))

    // List(1, 1, 1, 2, 2, 2, 3, 3, 3)

    ```


    What flatMap does is easy to understand. What can be harder to grasp is how useful
    this behavior can be. With experience, you will come to realize that flatMap is
    probably the most powerful and most useful of the standard higher-order functions.
    Function flatMap is a fundamental operation. In particular, by using one-to-one
    and one-to-zero mappings, you can express map and filter in terms of flatMap:'
