    \ binary trees:⁵\n\n```\nenum BinTree[+A]:\n  case Empty\n  case Node(value: A,\
    \ left: BinTree[A], right: BinTree[A])\n```\n\nOn such a tree, you can compute\
    \ the number of values recursively:\n\n```\ndef size[A](tree: BinTree[A]): Int\
    \ = tree match\n  case Empty          => 0\n  case Node(_, left, right) => 1 +\
    \ size(left) + size(right)\n```\n\nListing 6.7: Recursive implementation of size\
    \ on binary trees.\n\nThe empty tree contains no value, and a non-empty tree contains\
    \ as many values as in its combined children, plus one for the root. Many other\
    \ computations on binary trees can proceed recursively, using the empty tree as\
    \ a terminal, non-recursive case. Binary trees are the focus of a case study in\
    \ Chapter 8.\n\nRecursive structures are also sometimes defined in terms of mutually\
    \ recursive types: Type A depends on type B, which depends on type A, for instance.\
    \ This leads to code that uses mutually recursive functions, also called co-recursive\
    \ functions. For instance, you can define N-ary trees, in which nodes have zero,\
    \ one, or more children, in terms of two types: Tree and Forest. On the one hand,\
    \ a forest is a list of non-empty trees; on the other hand, a non-empty tree consists\
    \ of a root value and a forest of children:\n\n```\nenum Tree[+A]:\n  case Empty\n\
    \  case Node(value: A, trees: Forest[A])\n\ntype Forest[A] = List[Tree.Node[A]]\n\
    ```\n\nYou can then calculate the size of a tree by relying on the size of its\
    \ forest, and the size of a forest by relying on the sizes of its trees:\n\n```\n\
    def treeSize[A](tree: Tree[A]): Int = tree match\n  case Empty      => 0\n  case\
    \ Node(_, trees) => 1 + forestSize(trees)\n```"
