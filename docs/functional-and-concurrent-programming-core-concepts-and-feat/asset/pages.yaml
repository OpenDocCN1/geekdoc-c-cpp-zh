  md: "and receiving messages are operations that modify the state of a channel, and\
    \ that can be blocking if a channel is full or empty. Synchronization of non-thread\
    \ entities, such as actors and coroutines, and the use of messages are briefly\
    \ discussed in Chapter 27.\n\nLocks are primarily used for non-interference, but\
    \ other synchronizers are better suited to cooperation. Chapter 23 gives an overview\
    \ of the most common synchronizers. For now, let’s solve the list-sharing problem\
    \ with a simple but useful synchronizer: the countdown latch. It is implemented\
    \ in the java.util.concurrent library as a CountDownLatch:\n\n```\nval shared\
    \ = SafeStringList()\nval latch  = CountDownLatch(2)\n\ndef addStrings(n: Int,\
    \ str: String): Unit =\n    n times shared.add(str)\n    latch.countDown()\n\n\
    exec.execute(() => addStrings(5, \"T1\"))\nexec.execute(() => addStrings(5, \"\
    T2\"))\n\nlatch.await()\n\nassert(shared.size == 10)\n```\n\nListing 22.2: Waiting\
    \ for task completion using a countdown latch synchronizer.\n\nThe state of a\
    \ countdown latch is a counter. Method countDown decrements this counter if it\
    \ is positive, and method await blocks any calling thread until the latch’s counter\
    \ is 0. In this example, a latch is created with a state equal to 2. The main\
    \ thread waits for the latch state to be 0 before querying the size of the list.\
    \ The other two threads each decrement the state by 1 as they finish, thus bringing\
    \ it to 0 when they are both done. By calling latch.await, you avoid the drawbacks\
    \ of sleeping or busy-waiting: The main thread is blocked efficiently and does\
    \ not use CPU time while waiting, and it is notified to resume execution as soon\
    \ as the latch opens, without additional sleeping delay.\n\n# 22.3 Deadlocks\n\
    \nWhen a program uses synchronizers, threads are blocked until the synchronizer\
    \ reaches a desired state. Synchronization carries a danger—namely, it makes threads\
    \ wait for a condition that may never be satisfied. Some errors are easy to catch.\
    \ For instance, a thread calls await on a latch, but nowhere is countDown ever\
    \ called in the code. Other mistakes can be trickier, such as waiting for more\
    \ countdowns than can possibly happen in a program.²\n\n²Though not the focus\
    \ of this section, waiting for fewer countdowns is also a synchronization mistake,\
    \ resulting in a thread that uses data too early."
