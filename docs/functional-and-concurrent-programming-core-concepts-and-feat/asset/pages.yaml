  md: "The calls futureData.join() and futureAd.join() do not block the thread, even\
    \ if the ad or the data is not yet available. Contrast this implementation with\
    \ Listing 25.2, in which method get of a regular future is used to retrieve the\
    \ ad, possibly causing a worker thread to block if the ad-fetching task is still\
    \ running.\n\nFor all practical purposes, the implementation in Listing 27.4 is\
    \ equivalent to Listing 26.7, which uses flatMap and map to combine the ad with\
    \ database data in a non-blocking way. Its main benefit is that it is closer in\
    \ style to familiar (but blocking) variants like that seen in Listing 25.2.\n\n\
    With fork and join, you have a mechanism for a task to wait for another task without\
    \ blocking a thread. However, if you use a lock, or a semaphore, or a blocking\
    \ queue, you can still block a thread. To truly leverage the advantages of ForkJoinPool,\
    \ you need to refrain from using synchronizers. If you absolutely need to block\
    \ a thread, the framework defines a ManagedBlocker interface, which you can use\
    \ to indicate that a thread is about to block. This makes it possible for the\
    \ pool to create additional threads appropriately to maintain a desired level\
    \ of parallelism.\n\n# 27.4 Asynchronous Programming\n\nThe idea of waiting without\
    \ blocking, as in Listing 27.4, is also found in other programming models. These\
    \ tend to focus on making code asynchronous—as opposed to concurrent—but can also\
    \ typically be configured to support concurrency. In Scala, for instance, you\
    \ can use an experimental asynchronous framework to implement the parallel ad-fetching\
    \ and database lookup example in a standard-looking style:\n\n```\nimport cps.compat.sip22.{\
    \ async, await }\n\nasync {\n  val futureAd: Future[Ad]      = Future(fetchAd(request))\n\
    \  val futureData: Future[Data] = Future(dbLookup(request))\n  val ad: Ad    \
    \                = await(futureAd)\n  val data: Data                = await(futureData)\n\
    \  val page: Page                = makePage(data, ad)\n}\n```\n\nListing 27.5:\
    \ Example of non-blocking concurrency with an async/await construct.\n\nMethod\
    \ await suspends the execution of the async block until its target future is completed,\
    \ but it does not block the thread, which continues to run code elsewhere. The\
