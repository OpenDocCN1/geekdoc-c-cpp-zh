  md: '+   - *Threads of execution*, or threads for short, are a common source of
    concurrency in programs, but they are not the only one: Processes tend to run
    concurrently as well, and external events such as user clicks or incoming server
    connections also introduce concurrency. Furthermore, programmers often handle
    concurrency at non-thread levels—for instance, in terms of tasks, or futures,
    or actors, or coroutines.

    +   - *Atomicity* defines elementary program units, the “parts” that can be executed
    out of order, or “at the same time.” In the examples in Section 16.1, for instance,
    decrementing a BigInt by one is an atomic operation, but counting down from 1,000,000,000
    to zero is not. Similarly, a letter is printed on the terminal, or it is not;
    it cannot be “partially printed.” In contrast, printing multiple letters is not
    necessarily atomic. The single-threaded JavaScript program guarantees that the
    A and C lines form an atomic unit, with no possible B in between, while the Scala
    and Kotlin programs—when configured to use multiple threads—do not. As a programmer,
    you must be aware of what needs to be atomic in your program and of the atomicity
    guarantees of the languages and libraries with which you are programming.

    +   - *Synchronization* is often needed to coordinate concurrent activities. You
    can use *synchronizers*, such as locks and semaphores, to reduce the concurrency
    of a program to a level that does not jeopardize the program’s correctness. When
    synchronizers are misused—as I did earlier with Scala’s Await and Kotlin’s join—they
    can turn a concurrent program into a sequential one, or even prevent the program
