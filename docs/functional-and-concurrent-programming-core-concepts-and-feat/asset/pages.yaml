  md: "Indeed, with one tree being shared at each level of the recursion, the trees\
    \ before and after insertion share all their nodes except for the one branch that\
    \ is being traversed. This is a fundamental property of persistent data structures,\
    \ which was discussed earlier in the context of functional lists in Section 3.7\
    \ (see, in particular, Figure 3.1).\n\nIf you are used to mutable types, beware\
    \ of a common beginner mistake:\n\n```\n// DON'T DO THIS!\ndef + (k: Int): Node\
    \ =\n    if k < key then\n        left + k\n        Node(key, left, right)\n \
    \   else if k > key then\n        right + k\n        Node(key, left, right)\n\
    \    else this\n```\n\nTrying to implement method “+” like this is indicative\
    \ of an imperative programming mindset, which assumes that left + k modifies the\
    \ tree left. But left + k has no side effect. Instead, it builds a new tree, to\
    \ be used in a larger expression. In this incorrect variant, the new tree is built\
    \ but not used. Note also that Node(key, left, right) is the same thing as this,\
    \ and that there is no value in constructing a node identical to an existing node.\n\
    \nAs you are probably aware, key deletion in a tree tends to be trickier than\
    \ key insertion. The difficulty stems from the fact that, after the root of a\
    \ tree is removed, a new tree has to be built by somehow merging the left and\
    \ right children, while maintaining the fundamental property of key ordering:\n\
    \n```\ndef - (k: Int): BinTree =\n    if k < key then Node(key, left - k, right)\n\
    \    else if k > key then Node(key, left, right - k)\n    else if left.isEmpty\
    \ then right\n    else if right.isEmpty then left\n    else\n        val (minRight,\
    \ othersRight) = right.minRemoved\n        Node(minRight, left, othersRight)\n\
    \ndef minRemoved: (Int, BinTree) =\n    if left.isEmpty then (key, right)\n  \
    \  else\n        val (min, othersLeft) = left.minRemoved\n        (min, Node(key,\
    \ othersLeft, right))\n```\n\nListing 8.4: Key deletion in binary search trees."
