- pgno: 31
  md: "Scala is a programming language that aims to combine object-oriented and functional\
    \ programming, with good support for concurrency as well.² It is a hybrid language—also\
    \ called a multi-paradigm language. In fact, all three versions of the random\
    \ shifting program already written in Java and in Python can be written in Scala:\n\
    \n```\ndef randShift(nums: List[Int], rand: Random): List[Int] = {\n  val shiftedNums\
    \ = List.newBuilder[Int]\n  for (num <- nums) {\n    val shifted = num + rand.between(-10,\
    \ 11)\n    if (shifted > 0) {\n      shiftedNums += shifted\n    }\n  }\n  shiftedNums.result()\n\
    }\n\ndef randShift(nums: List[Int], rand: Random): List[Int] =\n  nums.view\n\
    \    .map(num => num + rand.between(-10, 11))\n    .filter(shifted => shifted\
    \ > 0)\n    .toList\n\ndef randShift(nums: List[Int], rand: Random): List[Int]\
    \ =\n  for {\n    num <- nums\n    shifted = num + rand.between(-10, 11)\n   \
    \ if shifted > 0\n  } yield shifted\n```\n\nThe first function is imperative,\
    \ based on an iteration and a mutable list. The next variant is functional and\
    \ uses map and filter explicitly. The last variant relies on Scala’s for-comprehension,\
    \ a mechanism similar to (but more powerful than) Python’s list comprehension.\n\
    \nYou can also use Scala to write a concise solution to the concurrency problem.\
    \ It uses futures and thread pools, like the earlier Java program:\n\n```\ndef\
    \ firstOf(comp1: StringComputation, comp2: StringComputation)\n          (using\
    \ ExecutionContext): String = {\n  val future1 = Future(comp1.compute())\n  val\
    \ future2 = Future(comp2.compute())\n  Await.result(Future.firstCompletedOf(Set(future1,\
    \ future2)), timeout)\n}\n```\n\n²Different incarnations of Scala exist. This\
    \ book uses the most common flavor of Scala, namely, the one that runs on the\
    \ JVM and leverages the JVM’s support for concurrency."
