  md: '# 25.4 Future Variants


    The code examples in Sections 25.2 and 25.3 rely on java.util.concurrent.Future,
    the oldest of Java’s two Future types. Java 8 introduced java.util.concurrent.CompletableFuture,
    which is created slightly differently. For instance, the future f1 in Listing
    25.1 could be created as a CompletableFuture as


    ```

    val f1 = CompletableFuture.supplyAsync(() => makeStrings(5, "T1"), exec)

    ```


    or


    ```

    val f1 = CompletableFuture.supplyAsync(() => makeStrings(5, "T1"))

    ```


    The second form uses a common thread pool instead of a user-specified thread pool.
    Scala uses its own futures and specifies the thread pool to use as an implicit
    argument. This allows you to write


    ```

    given ExecutionContext = exec


    val f1 = Future(makeStrings(5, "T1")) // uses exec

    ```


    or


    ```

    val f1 = Future(makeStrings(5, "T1")) // uses the default thread pool in scope

    ```


    Note that Scala relies on an unevaluated, by-name argument, thereby avoiding the
    use of a lambda expression as an explicit thunk (see the discussion in Section
    12.2). With both Scala’s Future and Java’s CompletableFuture, the future that
    is returned implements a richer interface that supports a form of functional-concurrent
    programming, as discussed in Chapter 26.


    # 25.5 Promises


    Promises are the internal mechanism by which futures are created. A promise represents
    the (yet-to-come) value of a future. In some sense, it is the data part of the
    data/synchronizer combination that constitutes a future.


    A promise can be fulfilled with either a value or an error, at which point the
    future is complete. Promises are often—but not always—created by one thread and
    completed'
