- pgno: 41
  md: '# Chapter 1


    # Concepts of

    Functional Programming


    There is no universally accepted definition of functional programming, but all
    can agree that it involves programming with functions. This chapter is an overview
    of some of the characteristics of a functional programming style. It argues that
    these characteristics all are, with varying degrees, a consequence of choosing
    to program in terms of functions.


    # 1.1 What Is Functional Programming?


    The idea of programming with functions is not new. The concepts behind functional
    programming have been around since at least the programming language Lisp (late
    1950s), or even since λ-calculus (1930s) at a more theoretical level. In recent
    years, concepts of functional programming have seeped from truly functional programming
    languages, like Haskell and ML, into mainstream, general-purpose languages like
    Java, Python, and Kotlin. You may use these added functional programming features
    in various ways, depending on the application domain and your personal preferences.
    Developers who discuss the pros and cons of functional programming often focus
    on the characteristics that are the most advantageous or disadvantageous to them.
    As with other aspects of programming and programming languages, people can become
    very opinionated, and arguments are often heated as to what functional programming
    is and is not.


    You may hear that functional programming is centered around higher-order functions
    and lambda expressions. Or you might read an introduction to functional programming
    that talks at length about recursion. Or an opinion that functional programming
    is all about immutability. Or lazy evaluation.


    This chapter is a brief exposition of my own view, which could be summarized as:
    *all of the above*. At the core of functional programming is the idea of programming
    with functions, and I hope to convince you that many of the programming characteristics
    often associated with a functional programming style, like those just mentioned,
    follow more or less directly from this use of functions. Apparent conflicts in
    definitions are often only choices of which facets to emphasize, and in what order.


    This book does not assume prior knowledge of functional programming. The chapters
    that follow will define the terminology that is only briefly mentioned here (higher-order
    and recursive functions, lambda expressions, immutability, lazy evaluation), alongside
    a few other terms like tail recursion, pattern matching, and algebraic data types.
    You'
