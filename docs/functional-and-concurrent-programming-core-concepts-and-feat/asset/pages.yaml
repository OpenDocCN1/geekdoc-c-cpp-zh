    +   - Typing strategies vary from programming language to programming language.
    They are often compared in terms of static (compile time) versus dynamic (run-time),
    and/or strong (fussier) versus weak (looser). The terminology is somewhat ambiguous
    and not universally agreed upon.

    +   - A more important characteristic of type systems is that they vary in terms
    of safety (how effective they are at catching mistakes), flexibility (the degree
    to which they enable rather than prevent a preferred design), and simplicity (how
    easy they are to understand and exercise). Languages typically favor two of these
    attributes at the expense of the third.

    +   - One possible view of types is that they are sets of values. Some sets, such
    as String and List[Int], are large. Others, such as Unit and Boolean, are small.
    If a variable has a given type, its value always belongs to the corresponding
    set. The smaller the type, the more valuable this information will be.

    +   - The dual view seeks to identify types with the services—for example, methods
    and attributes—that they define. When defining a type as an interface in an object-oriented
    language, for instance, the focus is not so much on the set of values this interface
    can contain, but rather on the operations that can be applied to these values.

    +   - Abstract data types (ADTs) are a formal model of types that is based on
    the dual view of sets and operations. ADTs define the semantics of all the operations
    available on a type, typically in the form of axioms. Programming language types
    are only an approximation of ADTs, as they usually specify the signatures of their
    operations, but not their semantics.'
