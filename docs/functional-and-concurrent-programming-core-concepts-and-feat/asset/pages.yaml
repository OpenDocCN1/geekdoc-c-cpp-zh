- pgno: 392
  md: 'lock that is not free can either have a single exclusive-mode owner or one
    or more shared-mode owners. Concurrency can be increased by replacing a regular
    exclusive lock with a read-write lock and having multiple threads work in parallel
    with the lock acquired in shared mode.


    +   - Latches are simple synchronizers that block threads until the latch is open.
    Java implements countdown latches, which open after their `countDown` method is
    called a specific number of times.

    +   - Latches cannot be reused because once open, they cannot be closed again.
    By contrast, cyclic barriers open and close repeatedly and automatically. Barriers
    are set up for a fixed number of participating threads. They open—and close again
    immediately—every time all the threads reach the barrier. (In other words, the
    arrival of the last thread is the event that triggers opening.) Barriers are often
    used in iterative algorithms to guarantee that no thread can begin its k-th iteration
    until all threads have completed k − 1 iterations.

    +   - Semaphores are a classic type of synchronizer, defined in terms of virtual
    permits. Permits can be acquired (or consumed) by threads and released (or created)
    by other threads. When a semaphore runs out of permits, its acquiring method becomes
    blocking. Semaphores are versatile, and they have been used historically to implement
    other synchronizers.

    +   - Conditions maintain a set of waiting threads and offer methods to block
    threads (add them to the set) or notify threads (remove them from the set). Conditions
    are always used within locked sections of code. Threads that block on a condition
    automatically—and atomically—release the corresponding lock. Threads that are
    notified reacquire the necessary lock automatically, but this is not atomic—other
    threads may run code with the lock after a thread has been notified and before
    it can itself reacquire the lock. The JVM’s intrinsic locks supports only a single
    condition; the later class `ReentrantLock` permits multiple conditions to be created
    on the same lock.

    +   - Blocking queues are both (thread-safe) data structures and synchronizers.
    In addition to standard queue semantics, they define methods to synchronize threads
    based on the state of the queue: Taking from an empty queue is blocking and, if
    the queue is bounded, adding to a full queue is also blocking. Blocking queues
    are often used in producer–consumer patterns to decouple data-producing activities
    from data-consuming activities. Useful patterns can be defined by using a single
    producer (scattering data), a single consumer (gathering data), or multiple producers
    and consumers on the same blocking queue.'
