    \ can combine the choice of immutable values (as in the functional implementation)\
    \ with the use of methods instead of functions (as in the object-oriented implementations).\
    \ In this functional-object-oriented approach, active-passive values are immutable\
    \ objects:\n\n```\nScala\nclass ActivePassive[A] private (elements: Set[A], activeSet:\
    \ Set[A]):\n  def this(elements: Set[A]) = this(elements, Set.empty[A])\n\n  def\
    \ isActive(elem: A): Boolean = activeSet.contains(elem)\n\n  def isPassive(elem:\
    \ A): Boolean = !isActive(elem)\n\n  def allActive: Set[A] = activeSet\n\n  def\
    \ allPassive: Set[A] = elements diff activeSet\n\n  def isAllActive: Boolean =\
    \ activeSet.size == elements.size\n\n  def isAllPassive: Boolean = activeSet.isEmpty\n\
    \n  def activate(elem: A): ActivePassive[A] = ActivePassive(elements, activeSet\
    \ + elem)\n\n  def deactivate(elem: A): ActivePassive[A] = ActivePassive(elements,\
    \ activeSet - elem)\n\n  def activateAll(): ActivePassive[A] = ActivePassive(elements,\
    \ elements)\n\n  def deactivateAll(): ActivePassive[A] = ActivePassive(elements,\
    \ Set.empty)\n\nListing 4.4: Functional-object-oriented active-passive sets.\n\
    ```"
