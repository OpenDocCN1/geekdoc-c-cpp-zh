  md: '# 3.3 Expressions Versus Statements


    While imperative programming is characterized by the use of statements, functional
    programming relies instead on expressions. Statements do things for the purpose
    of updating a mutable state. In contrast, expressions are things: They are values.
    In the code examples in Section 3.1, prompt = "% " and lastID += 1 are statements;
    prompt + msg and prefix + lastID are expressions.


    Expressions are used in every programming style, including imperative. Languages
    that aim to support functional programming, however, typically give expressions
    a preeminence they do not have in imperative languages. In particular, functional
    programming languages tend to include additional mechanisms that are well suited
    to expressions. For instance, we have already seen that a code block in Scala
    is also an expression, equal to the value of the last expression in the block.
    In C or Java, a code block has no value and cannot be used as an expression.


    As another example, consider conditionals. If you are used to imperative programming,
    you are familiar with if-then-else as a construct used to select statements based
    on a Boolean condition:


    ```

    if (num > 100) println("large"); else println("small");

    ```


    Listing 3.2: Example of if-then-else as a statement; contrast with Lis. 3.3.


    This code is a statement that prints large for large numbers and small for small
    numbers. It is not an expression. Java’s if-then-else is ill suited to combine
    expressions. If f and g are pure functions, the code


    ```

    if (condition) f(x); else g(y);

    ```


    is silly: It evaluates either f or g depending on a condition, but since these
    functions have no side effect, it might as well do nothing. To be effective, a
    Java if-then-else must involve statements, for instance via assignments or actions:


    ```

    if (condition) r = f(x); else someAction(g(y));

    ```'
