    \ change more substantially. They now need to create a new value: a new active–passive\
    \ pair that differs from the previous one by having some elements activated or\
    \ deactivated. Notice that the signatures are different from before: Instead of\
    \ Unit, they now have ActivePassive[A] as their return type. For instance, to\
    \ activate a single element elem in function activate, you create a new active\
    \ set, activeSet(ap) + elem, and use it to make a new active–passive pair. Two\
    \ private functions are added to access pair elements so as to avoid writing all\
    \ the code in terms of ap(0) and ap(1), which would be error-prone. Finally, the\
    \ class constructor from the object-oriented variants is replaced with a createActivePassive\
    \ function."
