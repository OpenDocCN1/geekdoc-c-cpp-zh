  md: 'example, to modify variables prompt and lastID) or indirectly (for example,
    inside the implementation of list method remove). A functional programming style
    aims at eliminating side effects so as to write programs in terms of pure functions.
    Not surprisingly, this means targeting the assignment statement for elimination
    (or at least much reduced usage).


    If you look closely at the Scala examples so far, you''ll notice that I have introduced
    some local variables with the keyword val, and others with the keyword var. You
    may also notice that the var variables were used as the targets of assignment
    statements, but the val variables were not. Indeed, the distinctive difference
    between the two is that val is used to proscribe assignments:


    ```

    val two = 2

    val three = two + 1

    two = two + 1 // rejected by the compiler

    ```


    What val really does is give a name to an expression. Despite similarities in
    the syntax, you are better off thinking of val two = 2 as giving the name two
    to the value 2, rather than as assigning 2 to variable two. Because of its val
    definition, two is not an ordinary variable in the C or Java sense. In particular,
    it cannot be reassigned with a different value. If you attempt to write this kind
    of assignment, such as two = two + 1 or two = 3, the compiler will reject it as
    a “reassignment to val” error.


    As a consequence of this restriction, two and 2 are now equivalent expressions;
    wherever the name two appears (within the scope of the val declaration), it means
    2. This property is known as referential transparency: The expressions two and
    2 are interchangeable, and one can always be substituted for the other. You do
    not need to carefully parse code to see if two is being modified somewhere, because
    it cannot be changed. This would not be true if two was introduced as a reassignable
    variable, using var. Then it could be initialized with 2 at the beginning of the
    program but have another value by the time it is used inside a later expression.


    Names introduced using val are often said to be functional variables. You might
    also see them being referred to as immutable, non-reassignable, or assign-once
    variables. Functional programming languages rely heavily on this notion of variables.
    Hybrid languages might complement functional variables with old-fashioned, reassignable
    variables. In Scala, the declaration var two = 2 assigns the value 2 to the name
    two, but the variable can later be updated via assignment statements like two
    = 3 or two += 1, and the referential transparency property is lost.


    If you are new to functional programming, you may find the idea of programming
    without assignments quite puzzling. Still, if you want to practice with a functional
    programming style in a language that supports both types of variables, you should
    strive to maximize your use of functional variables. Purists might even consider
