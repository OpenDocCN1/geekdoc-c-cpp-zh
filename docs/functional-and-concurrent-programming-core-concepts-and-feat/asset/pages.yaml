- pgno: 119
  md: "Note how the code practically reads itself: “A list contains a target if it\
    \ is non-empty and either the first element of the list is the target, or the\
    \ target is somewhere else in the list.”¹ The function is tail recursive because\
    \ the logical operator “||” uses shortcut evaluation in Scala (as in C or Java)\
    \ and thus is equivalent to the following expression:\n\n```\nScala\n(if head(list)\
    \ == target then true else contains(tail(list), target))\n```\n\nWith “||” expanded\
    \ as if-then-else, the tail recursion appears more clearly.\n\nInstead of relying\
    \ on head and tail functions, you can use pattern matching:\n\n```\nScala\n@tailrec\n\
    def contains[A](list: List[A], target: A): Boolean = list match\n  case Nil  \
    \      => false\n  case head :: tail => head == target || contains(tail, target)\n\
    \nListing 7.2: Simple list lookup, using tail recursion and pattern matching.\n\
    ```\n\nIn the remainder of this chapter—and throughout the book—code illustrations\
    \ mostly follow this pattern-matching style, which I often find easier to read.\n\
    \nThe next example is a recursive function to calculate the length of a list.\
    \ A non-empty list contains as many elements as its tail, plus one for the head\
    \ of the list:\n\nlength(list) = 1 + length(tail(list))\n\nAfter the empty list,\
    \ of length zero, is handled as a special case, the implementation has the following\
    \ form:\n\n```\nScala\ndef length[A](list: List[A]): Int = list match\n  case\
    \ Nil      => 0\n  case _ :: tail => 1 + length(tail)\n\nListing 7.3: List length,\
    \ not tail recursive; contrast with Lis. 7.4.\n```\n\nA drawback of this implementation\
    \ is that the function is not tail recursive. Its evaluation requires as many\
    \ stack frames as there are values in the list and is likely to fail on large\
    \ lists by running out of space.\n\nYou can derive a tail recursive variant by\
    \ applying the same transformation used to write a tail recursive factorial function:\
    \ Add a second argument for the length, and update it before the recursive call.\
    \ Helper function addLength adds the length of a list to a given accumulator.\
    \ The length function is then implemented by using addLength to add the length\
    \ of a list to zero:"
