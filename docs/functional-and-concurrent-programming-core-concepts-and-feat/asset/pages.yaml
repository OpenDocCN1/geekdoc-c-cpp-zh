  md: 'its current use of a processor." While testing, you can insert calls to `yield`
    in a program in an attempt to increase the number of ways actions are interleaved
    in a run. (Section 18.3 on atomicity discusses examples of suitable uses of `yield`.)
    Because threads can always be suspended at any time by the scheduler, using `yield`
    does not produce scenarios that were not already possible, and therefore added
    calls to `yield` should never cause a fault in a correct program.


    +   - *Name threads and log fine-grain activities.* It is hard enough to cause
    an incorrect concurrent program to fail using tests. It is even harder to figure
    out the sequence of steps that caused the failure, especially when many threads
    are involved. Detailed logging information—which unfortunately grows with the
    number of threads—is often necessary to pinpoint a synchronization mistake. When
    logging, you can access information on the thread that is executing a code fragment
    by using the Java static method `Thread.currentThread`.

    +   - *Complement testing with static analysis tools.* Static analysis techniques
    can be applied at the design, source code, or compiled code level, and many such
    techniques are primarily focused on concurrency issues. Because they do not rely
    on the nondeterministic occurrence of a particular series of runtime steps, they
    can often discover bugs that have escaped other forms of testing. (See the aside
    on model checking at the end of Section 23.4.)


    # 17.6 Summary


    +   - By default, many programs are single-threaded. Concurrency/parallelism is
    introduced by creating additional threads of execution. Threads can then run concurrently
    within the same program and interact with each others.

    +   - JVM languages rely on Java''s `Thread` class to create threads. An instance
    of this class is a regular object, with methods and fields. However, when its
    `start` method is invoked, a new (real) thread of execution is created. This thread
    is typically implemented as a lightweight process of the operating system, but
    could also be handled directly by a JVM.

    +   - The behavior of a new thread is specified by an object with a no-argument
    `run` method, which contains the code to be executed by the thread. This object
    can often be implemented as a function, using a lambda expression syntax.

    +   - Threads terminate when they reach the end of their code, either normally
    or abruptly through an exception. Threads can wait for the termination of other
    threads via a method `join`, which is often used by a supervisor thread to wait
    for completion of worker threads. A JVM terminates when all its application threads
    are finished.'
