  md: 'Like `sortBy` and `maxBy`, it takes a mapping function as its argument and
    groups together all the elements that map to the same value:


    ```

    List(2, 5, 4, 10, 7, 1, 20).groupBy(n => n % 2)

    ```


    This expression maps even numbers to 0 and odd numbers to 1, resulting in an expression
    of type `Map[Int,List[Int]]` with two keys:


    ```text

    0 -> List(2, 4, 10, 20)

    1 -> List(5, 7, 1)

    ```


    You can group dated temperatures by date:


    ```

    val tempsOn = datedTemps.groupBy((date, _) => date)

    ```


    Value `tempsOn` has type `Map[LocalDate, List[(LocalDate, Int)]]`; the expression
    `tempsOn(someDate)` produces the list of all (dated) temperatures for the given
    date. Alternatively, dated temperatures can be grouped by temperatures:


    ```

    val daysWith = datedTemps.groupBy((_, temp) => temp)

    ```


    Then, `daysWith(temp)` is a list of dates (and temperatures) with a temperature
    of `temp`.


    Given that all the pairs in `tempsOn(d)` have the same date `d`, and all the pairs
    in `daysWith(t)` have the same temperature `t`, you can reduce pairs to their
    relevant component via a suitable application of higher-order function `map`:


    ```

    datedTemps.groupBy((d, _) => d).map((d, list) => (d, list.map((_, t) => t)))

    ```


    This expression is a little hard to parse, but the first call to `map` is used
    to transform each list of dated temperatures into a list of plain temperatures;
    the second map is the transformation of a dated temperature into an integer. If
    you are lucky, your language offers `groupMap`, which combines `groupBy` and `map`
    into a single function:


    ```

    datedTemps.groupMap((d, _) => d)((_, t) => t) // of type Map[LocalDate, List[Int]]

    ```


    Function `groupMap` takes two mapping functions as arguments (in curried style),
    one for grouping (as in `groupBy`) and one for transforming (as in `map`).


    ²If there are no temperatures recorded on that date, the lookup in the map will
    fail with an exception. This can be avoided by using the map method `withDefaultValue`
    to create a map that returns an empty list instead.'
