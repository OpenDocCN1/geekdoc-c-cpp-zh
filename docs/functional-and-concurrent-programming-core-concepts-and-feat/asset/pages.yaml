    \ 555-1234\")\nformatNumber(\"6035551234\")      // None\n```\n\nListing 5.15:\
    \ Example pattern matching on a regular expression.\n\n# 5.8 Summary\n\n+   -\
    \ Pattern matching is a common feature of functional programming languages. In\
    \ its simplest form, you can think of it as a powerful form of a switch expression.\
    \ It can be used to test Boolean conditions, compare values to constants, or check\
    \ runtime types.\n+   - The real power of pattern matching, however, comes from\
    \ being used to process algebraic data types. What characterizes these types is\
    \ that they are defined in terms of alternatives (also called sums) and aggregations\
    \ (also called products) of other types. Pattern matching can be used to switch\
    \ between alternatives, and to extract components in aggregated types.\n\n> 3In\
