  md: "# 7.9 Building Lists Efficiently\n\n```\n```scala\ndef takeAndAdd(list: List[A],\
    \ n: Int, added: List[A]): List[A] = (list, n) match\n  case (_, 0) | (Nil, _)\
    \ => added\n  case (head :: tail, _) => takeAndAdd(tail, n - 1, head :: added)\n\
    \nreverse(takeAndAdd(list, n, Nil))\n```\n```\n\nListing 7.21: Tail recursive\
    \ implementation of take; contrast with Lis. 7.8.\n\nNote how values are added\
    \ to the accumulator using “::”, not append, for performance reasons. As a result,\
    \ function `takeAndAdd` accumulates the elements in reverse order, and the accumulated\
    \ list is reversed before it is returned.\n\nAnother approach, which is frequently\
    \ used in libraries, is to implement pure functions by using non-functional elements\
    \ internally. You can implement `take` with an intermediate `ListBuffer`, a mutable\
    \ accumulator designed to build immutable lists:\n\n```\n```scala\ndef take[A](list:\
    \ List[A], n: Int): List[A] =\n  @tailrec\n  def takeAndAdd(list: List[A], n:\
    \ Int, added: mutable.ListBuffer[A]): List[A] =\n    (list, n) match\n      case\
    \ (_, 0) | (Nil, _) => added.result()\n      case (head :: tail, _) => takeAndAdd(tail,\
    \ n - 1, added += head)\n\n  takeAndAdd(list, n, mutable.ListBuffer.empty[A])\n\
    ```\n```\n\nListing 7.22: Buffer-based implementation of take; contrast with Lis.\
    \ 7.21.\n\nTo add elements to the accumulator, a list buffer is mutated by its\
    \ method “+=”. Once building is complete, method `result` is used to produce an\
    \ immutable list from the mutable buffer, thus bringing us back into the realm\
    \ of functional programming. Because the buffer supports a constant-time append\
    \ operation, no reversal is needed at the end.\n\nFinally, if your language supports\
    \ it, you can always use loops instead of recursion to update the mutable buffer:\n\
    \n```\n```scala\ndef take[A](list: List[A], n: Int): List[A] =\n  val added =\
    \ mutable.ListBuffer.empty[A]\n  val elems = list\n  var rem = n\n  while rem\
    \ > 0 && elems.nonEmpty do\n    added += head(elems)\n    elems = tail(elems)\n\
    \    rem -= 1\n  added.result()\n```\n```\n\nListing 7.23: Loop-based implementation\
    \ of take; contrast with Lis. 7.22."
