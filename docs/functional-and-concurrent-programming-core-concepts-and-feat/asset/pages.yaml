    enum IntList:\n  case Nil\n  case Cons(head: Int, tail: IntList)\n```\n```\n\n\
    # 5.6  Illustration: List Zipper\n\nAs a simple illustration of the power of pattern\
    \ matching, this section implements a data type known as a *zipper*. This zipper\
    \ is defined in terms of a pair of lists, making it possible to rely on various\
    \ patterns in the code.\n\nConsider the problem of maintaining a non-empty sequence\
    \ of values with a cursor that points to the current element. You want to be able\
    \ to move the cursor left or right, and to query or update the value under the\
    \ cursor. A mutable implementation can simply store an index alongside an array\
    \ of values. All the required operations can easily be achieved in constant time.\
    \ The drawback of using a mutable type is that you may need defensive copies when\
    \ passing values to and from functions (see our earlier discussion in Section\
    \ 3.8). Even moving the cursor could require cloning the entire array.\n\nWhat\
    \ would be nice instead is an immutable implementation. A naive approach could\
    \ store an index alongside a functional list. However, this would be inefficient.\
    \ Recall that accessing an element at a specified index in a functional list is\
    \ not a constant-time"
