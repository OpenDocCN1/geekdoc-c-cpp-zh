    Consider sets as an example. The Scala standard library implements both mutable
    and immutable sets. If you come from a Java or Python background, mutable sets
    feel completely natural:


    ```

    val set = Set("A", "B") // a mutable set

    set += "C"

    // set is now {A,B,C}

    ```


    The action set += "C" modifies the set by adding "C" to it. Alternatively, you
    can rewrite the example using an immutable set, stored in a mutable variable:


    ```

    var set = Set("A", "B") // an immutable set

    set = set + "C"

    // set is now {A,B,C}

    ```


    Instead of a "+=" method that modifies the set, immutable sets define a "+" method
    that creates a new set from an existing set. The set on which method "+" is applied
    is not modified—it is immutable.


    Avoid the common mistake of using persistent structures with a mind frame that
    expects mutability:


    ```

    // DON''T DO THIS!

    var set = Set("A", "B") // an immutable set

    set + "C"

    // set is still {A,B}

    ```


    Here, method "+" is used as if its effect was to modify a set by adding an element.
    But that is not what the method does. Instead, a new set is created—and not used—and
    variable set is unchanged, so it is still equal to the set {A,B}.


