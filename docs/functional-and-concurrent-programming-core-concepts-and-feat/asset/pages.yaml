    Monads can be defined in terms of a function unit and a method flatMap. The unit
    function has type A => M[A] and is used to build a monad—for example, from x to
    List(x) or from x to Some(x). Method flatMap on M[A] has the following signature:


    ```

    def flatMap[B](f: A => M[B]): M[B] = ...

    ```


    Monads have their own conditions to satisfy. First, the unit function maintains
    two properties with respect to flatMap:


    ```

    struct.flatMap(unit) == struct

    unit(x).flatMap(f) == f(x)

    ```


    The first property states that “flat-mapping” unit does nothing (as mapping the
    identity does nothing). The second property corresponds to the fundamental intuition
    behind flatMap: Function unit places x into a container, and flatMap(f) applies
    f to the contents of the container (see Section 10.9). Finally, flatMap must satisfy
    a form of composition similar to map:


    ```

    struct.flatMap(f).flatMap(g) == struct.flatMap(x => f(x).flatMap(g))

    ```


    As mentioned earlier, map can be implemented in terms of flatMap (Listing 10.3).
    Indeed, a monad M[A] is also a functor, in which map is defined as follows:


    ```

    def map[B](f: A => B): M[B] = flatMap(x => unit(f(x)))

    ```


    There is a lot more to functors and monads than is covered in this short note.
    Indeed, entire books have been dedicated to the subject. You are likely to see
    functors and monads (and other similar abstractions) explicitly in genuine functional
    programming languages (like Haskell) and libraries (like Scala’s Cats). Even if
    you intend to stay away from those, keep in mind that the various map and flatMap
    functions you encounter share some fundamental properties and lead to similar
    programming patterns.'
