  md: "# 24.5 Shared Thread Pool\n\nOne of the motivations for using thread pools\
    \ is to keep a bound on the number of threads, as in the preceding example. Another\
    \ is thread reuse, as applications often benefit from sharing pools across multiple\
    \ components.\n\nListing 24.3 creates a new thread pool, with fresh new threads,\
    \ for each run of a runner; thus, thread reuse is limited in that example. As\
    \ an alternative, you could implement a runner that uses an existing thread pool\
    \ instead of creating its own. This change impacts the design because you cannot\
    \ shut down a shared thread pool. Instead, the thread that calls method run needs\
    \ to wait for all the tasks to finish, whether the threads from the pool are still\
    \ running or not. This is a problem that we already faced in Listing 22.2, and\
    \ the same approach—a countdown latch—can be applied to solve it:\n\n```\nclass\
    \ Runner[A](exec: Executor)(comp: A => Unit):\n    def run(inputs: Seq[A]): Unit\
    \ =\n        val done = CountDownLatch(inputs.length)\n\n        for input <-\
    \ inputs do\n            val task: Runnable = () =>\n                try comp(input)\n\
    \                finally done.countDown()\n            exec.execute(task)\n\n\
    \        done.await()\n```\n\nListing 24.4: Parallel execution: shared thread\
    \ pool.\n\nA latch is created with a count equal to the number of input values.\
    \ The tasks submitted to the thread pool are extended to count down the latch\
    \ at the end of each computation. The try-finally construct ensures that the latch\
    \ is counted down even if the execution of the function fails. The thread that\
    \ calls run does not shut down the pool but simply waits on the latch.\n\nUsing\
    \ a pool with two threads produces the same 4-second run as before. Note, however,\
    \ that multiple, concurrent runs of the same runner execute tasks on the same\
    \ pool, whereas they would run on separate, independent pools with the Listing\
    \ 24.3 implementation.\n\nOther synchronizers could be used to wait for task completion.\
    \ For instance, you can create a semaphore with no permits, have each completing\
    \ task create a permit, and make the waiting thread block until it can acquire\
    \ a number of permits equal to the length of the sequence of inputs. Also, the\
    \ thread pool may already implement methods for this purpose. If argument exec\
    \ is given as a value of type ExecutorService instead of Executor—all the standard\
    \ Java thread pools implement this type—its method invokeAll can also be used\
    \ directly to wait for completion of a list of tasks."
