    # 26.2 Callbacks


    NOTE


    The code illustrations in this chapter rely mostly on Scala’s futures for the
    same reason the book uses Scala in the first place: They tend to be cleaner than
    (though not always as rich as) Java’s CompletableFuture. Listings 26.10 and 27.9
    and some of the code in Chapter 28 make use of CompletableFuture, with more examples
    in Appendix A. Note also that callback mechanisms and other higher-order functions
    on futures often require an execution context—typically a thread pool in concurrent
    applications. How this context is specified varies from language to language.
    It can also become a distraction when presenting more important concepts. Most
    functions in this chapter assume a global execution context, which is left unspecified.
    One exception is Listing 26.5 (for consistency with Listing 26.1); other functions
    could use a similar pattern—that is, add a "(using ExecutionContext)" argument
    instead of assuming a global context.


    A callback is a piece of code that is registered for execution, often later (asynchronous
    callback). Modern implementations of futures—including Scala’s Future and Java’s
    CompletableFuture—offer a callback-registration mechanism. On a Scala future,
    you register a callback using method onComplete, which takes as its argument an
    action to apply to the result of the future. Because a future can end up with
    an exception instead of a value, the input of a callback action is of type Try
    (see Section 13.3).


    On a future whose task is still ongoing, a call to onComplete returns immediately.
    The action will run when the future finishes, typically on a thread pool specified
    as execution context:


    ```

    Scala

    println("START")

    given ExecutionContext = ... // a thread pool


    val future1: Future[Int] = ... // a future that succeeds with 42 after 1 second

    val future2: Future[String] = ... // a future that fails with NPE after 2 seconds

    future1.onComplete(println)

    future2.onComplete(println)


    println("END")

    ```'
