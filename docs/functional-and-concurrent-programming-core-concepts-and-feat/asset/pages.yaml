- pgno: 239
  md: "# 13.5 Higher-Order Functions and Pipelines\n\nIn addition to the issue of\
    \ code that leaves out necessary handling, exceptions present another difficulty\
    \ in a functional programming style: higher-order functions. Throwing and catching\
    \ exceptions is a form of flow of control: By throwing an exception, you “jump”\
    \ to code that can handle the situation. Higher-order functions, in contrast,\
    \ tend to embed their own control flow and cannot afford to see it being disrupted\
    \ by exceptions.\n\nAs an illustration, consider files of city names and Fahrenheit\
    \ temperatures formatted as follows:\n\n```\nAustin: 101\nChicago: 88\nBig Spring:\
    \ 92\n```\n\nAn application needs to read locations and temperatures from a file,\
    \ focus on temperatures recorded in Texas, convert the Fahrenheit temperatures\
    \ to Celsius, and produce a list of strings formatted like the input file. You\
    \ can implement it as a pipeline of higher-order functions:\n\n```\n```scala\n\
    @throws[IOException]\ndef readFile(file: Path): List[String] = ...\n\n@throws[ParseException]\
    \ @throws[NumberFormatException]\ndef parse(line: String): (String, Int) = ...\n\
    \n@throws[NoSuchElementException]\ndef stateOf(city: String): String = ...\n\n\
    def convert(input: Path): List[String] =\n  readFile(input).view\n    .map(parse)\n\
    \    .filter((city, _) => stateOf(city) == \"TX\")\n    .map((city, temp) => (city,\
    \ ((temp - 32) / 1.8f).round))\n    .map((city, temp) => s\"$city: $temp\")\n\
    \    .toList\n```\n```\n\nListing 13.1: Pipeline example with no handling of failures;\
    \ contrast with Lis. 13.2.\n\nYou use map to parse lines into pairs, filter to\
    \ eliminate cities outside of Texas, map again to convert the temperatures to\
    \ Celsius, and map one more time to generate the final strings. The bracketing\
    \ pair view/toList is not strictly necessary but is used to avoid the creation\
    \ of intermediate lists. On the sample file, function convert produces the list\
    \ [\"Austin: 38\", \"Big Spring: 33\"].\n\nA number of things can go wrong in\
    \ this computation: A file cannot be read, a city is not found in the database,\
    \ or a line cannot be parsed into a city name and a number."
