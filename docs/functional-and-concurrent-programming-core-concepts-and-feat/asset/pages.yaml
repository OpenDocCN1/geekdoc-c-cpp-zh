  md: "the function is applied recursively to a sorting problem that is not smaller.\
    \ This `mergeSort` function is incorrect: It does not terminate when called on\
    \ a non-empty list.\n\nWhen a problem has multiple parameters, it is sometimes\
    \ enough that one of them, or a combination of them, becomes smaller. For example,\
    \ a pair that consists of a positive number and a list can become smaller by the\
    \ number getting smaller, the list getting shorter, or the sum of the number plus\
    \ the length of the list getting smaller, among other ways.\n\nSome cases are\
    \ more complicated and necessitate more refined notions of “smaller.” For instance,\
    \ in this classic example (sometimes known as the *Ackermann function*),⁴ the\
    \ computation is guaranteed to terminate because the pair (x,y) decreases in lexicographic\
    \ ordering: Either x decreases, or x stays unchanged and y decreases:\n\n```\n\
    def a(x: BigInt, y: BigInt): BigInt = (x, y) match\n  case (0, _) => y + 1\n \
    \ case (_, 0) => a(x - 1, 1)\n  case _      => a(x - 1, a(x, y - 1))\n```\n\n\
    Listing 6.6: Ackermann function.\n\n+   - *Your focus as a programmer should be\
    \ on using the solutions to the smaller problems, not on how these smaller problems\
    \ are themselves solved by the recursive calls.* This point is crucial and is\
    \ key to effective recursive thinking. One common beginner’s mistake is to try\
    \ to unfold recursive calls to follow their computations. Except for the simplest\
    \ functions, diving into the recursive calls quickly becomes intractable. (Try\
    \ it on `hanoi`.) Instead, you must take the solutions to the smaller problems\
    \ for granted—given to you by the “magic” of recursion—and focus on using these\
    \ values to build a solution to the original problem.\n\n# 6.4 Recursive Structures\n\
    \nAs mentioned in Chapter 5, some algebraic data types present recursive structures,\
    \ which can be handled quite naturally by recursive functions. Indeed, the processing\
    \ of recursive structures is one of the major uses of recursive programming.\n\
    \nTrees are one of the most common recursive structures used in programming. Listing\
    \ 5.9 used trees to represent expressions and a recursive function to evaluate\
    \ a tree. As another example, consider binary trees. A non-empty binary tree consists\
    \ of a root\n\n⁴Although the function is guaranteed to terminate in theory, its\
    \ complexity is huge, and its recursive evaluation will run out of stack space\
    \ on most inputs. The Ackermann function was defined for the theoretical study\
    \ of recursive functions and has no practical purpose."
