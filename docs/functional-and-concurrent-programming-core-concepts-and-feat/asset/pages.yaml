  md: 'The next idea is to keep track of how many searching tasks are still active.
    The count of active tasks has to be thread-safe—it is decremented by the searching
    tasks themselves and queried by the file writing task. If N searching tasks are
    used, you could be tempted to modify the code as follows:


    ```

    Scala

    val active = AtomicInteger(N)

    ...

    active.decrementAndGet() // at the end of each searching task


    // DON''T DO THIS!

    while active.get() > 0 do ...

    ```


    However, this could still result in early termination of the loop: All the searching
    tasks have terminated, the active count reaches zero, and the file writing task
    is allowed to terminate without processing the lines that might possibly remain
    in the queue. This would result again in matches missing from the output file.


    Now you might think: No problem, let’s combine both termination conditions—no
    active searching tasks, empty queue of matches—to make sure that the writing task
    drains the queue after all searching tasks are done:


    ```

    Scala

    // DON''T DO THIS!

    while active.get() > 0 || !queue.isEmpty do ...

    ```


    This still doesn’t work, but the issue here is more subtle. Suppose you take the
    last matching line from the queue but searching tasks are still running. At this
    point, the queue is empty, but the condition active.get() > 0 is true, so the
    file writing task does not terminate. Instead, it reenters its loop, calls queue.take,
    and blocks. However, if no further matches are found, the searching tasks terminate
    without adding any more lines to the queue. The active count becomes zero, and
    the termination condition is established—the count is zero and the queue is empty.
    But the consuming thread remains blocked on take indefinitely, with no opportunity
    to evaluate this condition again.


    A common technique to properly terminate producer–consumer applications is to
    insert special values—called poison pills—into the queue as a way for producers
    to indicate that consumers should terminate. There are two ways you can apply
    a poison pill strategy to the file searching example. First, you can keep a thread-safe
    count of running producers, as before, and make the last producer to terminate
    insert a single poison pill into the queue. Alternatively, you can make each producer
    insert a special value upon termination and have the consuming thread count these
    values until they are all received. The first approach still requires a thread-safe
    count of active tasks; the second approach, used in the following code, does not:'
