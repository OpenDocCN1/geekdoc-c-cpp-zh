  md: 'After compilation, the last two variants of function `take` should be more
    or less equivalent. While Listings 7.22 and 7.23 are the “right” way to implement
    `take`, we will continue to rely mostly on “:`:” and immutable accumulators (or
    the execution stack) to build lists in Part I of this book. This is done for clarity.
    Using mutable builders, even hidden ones, would unnecessarily muddle the presentation
    of functional programming concepts.


    # 7.10 Summary


    +   - Behind every recursive function lies a recursive equality: The solution
    to a given problem *equals* a combination of solutions to smaller problems, solved
    recursively. Having these equalities in mind can help you design recursive algorithms
    correctly. This approach emphasizes the declarative side of functional programming
    by focusing attention on what the desired value *is*, instead of what the code
    must *do* to compute it.

    +   - A recursive equality is often well defined only on a subset of input data.
    Values for which the equality does not hold need to be treated separately. They
    usually result in one or more non-recursive cases in a recursive function.

    +   - Functional lists form a recursive data structure: A non-empty list consists
    of a head value, followed by another list (the tail). As such, lists are naturally
    amenable to recursive programming. Many operations can be implemented on lists
    as functions that perform a recursive call on the tail of the list. Recursion
    on one or more sublists other than the tail is possible as well.

    +   - Some list functions end up being naturally tail recursive. Others may need
    to be rewritten from their natural form to achieve tail recursion. This rewrite
    usually involves including an accumulator as an additional argument to the function.
    There is often a trade-off between the simplicity of a recursive function in its
    natural form and the robustness of a tail recursive variant.

    +   - Functions that need to build lists can sometimes rely on the execution stack
    to store list elements until the list is built. If, instead, tail recursion is
    needed, an accumulator should always build a list from the front, using a constant-time
    prepend operation. Building lists from the other end typically results in code
    that is quadratic in its runtime.

    +   - If, as a consequence of building from the front, a list is constructed in
    reverse order, it can be reversed back after construction. List reversal takes
    time proportional to the length of the list. An additional reversal at the end
    is usually a better option than constructing a list in the right order if the
    cost of this construction is quadratic.'
