  md: 'ant, a current value acc is combined with a list element x through the expression
    3.0 * acc + x + 1.0.


    Folding functions are versatile, and you can use them to implement many collection-processing
    computations. For example:


    ```

    def sum(list: List[Int]): Int = list.foldLeft(0)(_ + _)


    def product(list: List[Int]): Int = list.foldLeft(1)(_ * _)


    def reverse[A](list: List[A]): List[A] = list.foldLeft(List.empty[A])((l, x) =>
    x :: l)


    def filter[A](list: List[A], test: A => Boolean): List[A] = list.foldRight(List.empty[A])((x,
    l) => if test(x) then x :: l else l)

    ```


    Listing 10.7: sum, product, reverse, and filter implemented using fold.


    Functional libraries often implement a simplified version of fold named reduce.
    The difference with fold is that reduce uses an element from the collection as
    the starting point of the computation. If abc is the list A, B, C as before, abc.reduceLeft(f)
    is f(f(A,B),C). The sum and product functions in Listing 10.7 can be written in
    terms of reduce:


    ```

    def sum(list: List[Int]): Int = list.reduce(_ + _)

    def product(list: List[Int]): Int = list.reduce(_ * _)

    ```


    Note that reduce is not defined on empty collections and is limited to a return
    type that is the same as (or a supertype of) the collection''s elements. To reduce
    elements into a value of a different type, you can sometimes apply map to first
    convert types, and then reduce. Assume, for instance, a text file with one number
    per line and a task that consists of adding the logarithms of all the absolute
    values of the numbers, ignoring zeros. You can implement that with a combination
    of map, filter, and reduce:


    ```

    lines.map(_.toDouble.abs).filter(_ != 0.0).map(math.log).reduce(_ + _)

    ```


    This expression uses map to change strings into non-negative numbers, then filter
    to ignore zeros, map again to apply the logarithm function, and finally reduce
    to calculate the sum. A drawback of this approach is that it requires the creation
    of three intermediate lists, one with all the absolute values (the output of the
    first map), one with the zeros removed (the output of filter), and one with all
    the logarithms (the output of the second map). This could lead to performance
    issues if the file is large.'
