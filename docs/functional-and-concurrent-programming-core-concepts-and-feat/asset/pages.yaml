  md: '# Chapter 22


    # Synchronization


    Thread cooperation requires coordination, typically via synchronization. Waiting
    for a thread or a thread pool to terminate is an example of such synchronization.
    More generally, different types of synchronizers can be used to block one or more
    threads until the state of an application allows them to make progress. When misused,
    synchronization that unnecessarily blocks threads may cause a program to slow
    down, or even to come to a halt in the case of a deadlock. Snapshots of the states
    of threads—whether they are blocked, and on which synchronizer—can be used to
    debug these situations. Synchronization is also leveraged by runtime systems to
    optimize the memory usage of parallel tasks. These optimizations are specified
    in a memory model.


    # 22.1 Illustration of the Need for Synchronization


    In an earlier example of a concurrent program, two threads were adding strings
    into an unsafe list, causing the program to break. The list was then made safe
    through locking, and thread pools were introduced as a way to manage and reuse
    threads. Putting everything together, we can now write the list-sharing example
    as follows:


    ```

    Scala

    val exec = Executors.newCachedThreadPool()

    val shared = SafeStringList()


    def addStrings(n: Int, str: String): Unit = n times shared.add(str)


    exec.execute(() => addStrings(5, "T1"))

    exec.execute(() => addStrings(5, "T2"))


    exec.shutdown()

    exec.awaitTermination(5, MINUTES)


    assert(shared.size == 10)

    ```


    Listing 22.1: Threads from a pool share a safe list.


    For the assertion at the end of the program to be valid, you need to wait until
    both string-adding tasks are completed before querying the size of the list. This
    is achieved here by shutting down the thread pool and by waiting for termination
    of all its activities.'
