  md: "> In the next step, a producer—p1 or p2—adds to the queue, and (mistakenly)\
    \ notifies p3. At this point, in state 21, the situation is hopeless: The queue\
    \ is full and all the consumers are blocked. The two remaining producers then\
    \ invoke method put and are added to the waiting set. In state 24, a deadlock\
    \ is reached: All the threads are blocked inside the set.\n> \n> Figure 23.1 shows\
    \ an actual output from the model-checker—slightly edited to refer to the Put\
    \ and Take method names. The power of model checking is this capacity to produce\
    \ traces that describe the states leading to a problem. A deadlock of the incorrect\
    \ blocking queue may or may not be observed while running tests, but even when\
    \ it happens, looking at a thread dump shows only the final deadlock state, not\
    \ the steps that the threads took to get there. It should be noted that the model-checker\
    \ used here explores states in a breadth-first manner. As a consequence, a deadlock\
    \ scenario is guaranteed to have minimal length.\n> \n> The main limitation of\
    \ model-checking techniques is the rapid growth of the number of states that need\
    \ to be explored, a phenomenon known as the *combinatorial state space explosion*.\
    \ For instance, a queue of capacity 10 requires at least 21 threads to reach a\
    \ deadlock. The shortest scenario takes 431 steps, and has the model-checker explore\
    \ 23,011,357 distinct states to discover it.\n\n# 23.5  Blocking Queues\n\nThe\
    \ bounded queues implemented in Listings 23.6 to 23.8 are not just data structures:\
    \ They are themselves synchronizers. Their methods can block threads based on\
    \ the state of the queue, empty or full. Concurrency libraries often implement\
    \ two types of queues: concurrent queues, which are thread-safe data structures,\
    \ but may not have blocking methods, and blocking queues, which are synchronizers.\
    \ Blocking queues are always concurrent queues because they need to be thread-safe,\
    \ but not all concurrent queues are blocking queues. The queues implemented in\
    \ Chapter 20, for instance, are concurrent, non-blocking queues. Within each type,\
    \ several variants exist. Queues can be bounded or not; they can be backed by\
    \ an array or a list or some other structure; they can rely on locks or lock-free\
    \ algorithms; they are often first-in-first-out but can also use other orderings,\
    \ based on priorities or on time; and so on.\n\nBlocking queues are typically\
    \ used in a *producer–consumer* pattern: Producing activities add to a shared\
    \ queue while consuming activities concurrently take from the queue. This pattern,\
    \ which is widely used, offers multiple benefits. First, it decouples data creation\
    \ from data use, in a pattern similar to the application of streams in Section\
    \ 12.5. Second, you can sometimes use a single-producer or single-consumer pattern\
    \ to mix concurrent and sequential activities, as in 23.9. Third, producer–consumer\
    \ patterns are somewhat naturally self-balancing: When a queue is full, producing\
    \ tasks are blocked, freeing resources for consuming tasks to catch up, and vice\
    \ versa when a queue is empty."
