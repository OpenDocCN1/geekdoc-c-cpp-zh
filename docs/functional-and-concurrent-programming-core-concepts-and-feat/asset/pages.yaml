  md: "Lists can contain elements that are themselves lists. A list of lists can be\
    \ flattened by repeated concatenation:\n\n```\nflatten(List(List(1, 2, 3), Nil,\
    \ List(4, 5), List(6))) // List(1, 2, 3, 4, 5, 6)\nList(1, 2, 3) ::: Nil ::: List(4,\
    \ 5) ::: List(6)      // List(1, 2, 3, 4, 5, 6)\n```\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_125_0.png)\n\
    \n# Figure 7.5 Recursive strategy for function flatten.\n\nThe list returned by\
    \ function flatten begins with the elements of the first inner list and continues\
    \ by concatenation with the result of flattening the tail (Figure 7.5):\n\n```\n\
    flatten(list) = concat(head(list), flatten(tail(list))\n```\n\nThe actual implementation\
    \ mimics the equality, adding only a special consideration for the empty list:\n\
    \n```\ndef flatten[A](list: List[List[A]]): List[A] = list match\n  case Nil \
    \         => Nil\n  case head :: tail => concat(head, flatten(tail))\n```\n\n\
    # Listing 7.11: Recursive implementation of list flattening.\n\nNote the signature\
    \ of the function, from List[List[A]] to List[A], since it makes sense only for\
    \ nested lists.\n\nAs a final example in this section, let us implement function\
    \ zip, which traverses two lists simultaneously to build a list of pairs:\n\n\
    ```\nzip(List(A, B, C), List(1, 2, 3)) // List((A,1), (B,2), (C,3))\n```"
