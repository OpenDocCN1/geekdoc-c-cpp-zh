  md: "strategies that involve combinations of polling and blocking. Note that the\
    \ server in Listing 25.2 uses two thread pools. Using the same executor to run\
    \ handleConnection and fetchAd would run a risk of deadlock. This topic is discussed\
    \ in detail in Section 26.1.\n\n# 25.3 Timeouts, Failures, and Cancellation\n\n\
    A future carries the result of a functional task after the task has completed.\
    \ But what happens if the task fails? In this case, the future must still be completed—there\
    \ is no point in waiting on get for a result that will never come. Instead of\
    \ the task’s result, the future then contains the cause of the failure. In Java,\
    \ method get rethrows the exception that caused a task to fail but wraps it first\
    \ inside an ExecutionException.\n\nAs with almost all synchronizers, you can set\
    \ an upper limit on the amount of time a thread might be blocked. Java’s method\
    \ get accepts an optional timeout argument. If the timeout is reached before a\
    \ task produces a value, this variant of get throws a TimeoutException.\n\nAs\
    \ an illustration, you can modify the server from Listing 25.2 to use a fallback\
    \ ad if loading a customized ad fails and to replace a customized ad with a default\
    \ ad if loading takes more than 0.5 second after database lookup and logging have\
    \ been completed:\n\n```\nval futureAd = exec.submit(() => fetchAd(request))\n\
    ... // DB lookup and logging\nval ad =\n  try futureAd.get(500, MILLISECONDS)\n\
    \  catch\n    case _: ExecutionException => failedAd\n    case _: TimeoutException\
    \ => futureAd.cancel(true); timeoutAd\nval page = makePage(data, ad)\n...\n```\n\
    \nListing 25.3: Dealing with a future’s timeout and failure.\n\nVariable ad is\
    \ set with one of three values: (1) a customized ad, if loading finishes within\
    \ the 0.5-second timeout; (2) a failed ad if loading fails within 0.5 second;\
    \ or (3) a default ad if loading is still running after 0.5 second. In this last\
    \ case, the ad that is still being loaded will never be used, and loading can\
    \ be interrupted. This is the purpose of the call cancel(true).⁴\n\n⁴The Boolean\
    \ argument in cancel affects tasks that have already started to run. If it is\
    \ true, there is an attempt to terminate the execution. This is often implemented\
    \ by interrupting the running thread, which may or may not stop the task. If the\
    \ Boolean is false, no attempt is made to stop a running task, but the future\
    \ is still marked as canceled. Java’s newer futures implement only cancel(false)\
    \ semantics, and Scala’s futures have no cancellation mechanism. (The rationale\
    \ is that, as a cancellation mechanism, interruption works adequately only with\
    \ tasks designed to respond to it. Tasks that perform non-interruptible I/O, for\
    \ instance, will not react to cancel(true).) Canceling running tasks is difficult\
    \ in general. The case study in Chapter 28 requires the need to cancel tasks after\
    \ they have begun to run and implements an ad hoc cancellation strategy independent\
    \ of futures."
