  md: '# Chapter 25


    # Futures and Promises


    One of the major themes of Part I was that functional programming involves a shift
    from actions and mutability to functions and immutability, a major benefit of
    which is easier sharing of data across program components. In Part II, we have
    already seen in Chapters 22 to 24 that sharing mutable data among threads—and
    the resulting need for synchronization—is a great source of complexity in concurrent
    programming. This chapter and the next aim to show that concurrent code can be
    greatly simplified by leveraging functional programming principles. As before,
    it all begins with the use of pure functions as units of computation but is now
    executed by separate threads. Futures are a standard programming language construct
    used to manipulate concurrently executed functions. At a basic level, a future
    combines the characteristics of a function and a synchronizer. Chapter 26 considers
    futures in an even more functional way.


    # 25.1 Functional Tasks


    Most of the tasks used so far to illustrate concurrent programming have been instances
    of the Runnable interface. Its run method returns nothing and is used to apply
    modifications to some shared data. For instance, Listing 22.1, reproduced here,
    uses two tasks to add strings to a shared list:


    ```

    Scala -

    val exec = Executors.newCachedThreadPool()

    val shared = SafeStringList()


    def addStrings(n: Int, str: String): Unit = n times shared.add(str)


    exec.execute(() => addStrings(5, "T1"))

    exec.execute(() => addStrings(5, "T2"))


    exec.shutdown()

    exec.awaitTermination(5, MINUTES)


    assert(shared.size == 10)

    ```


    To ensure this approach would work, the shared list was designed to be thread-safe—in
    this case, by relying on locks. Note, however, that this thread-safety gives us
    more than we need: The list remains in a valid state after each call to its add
    method'
