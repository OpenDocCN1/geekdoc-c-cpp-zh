- pgno: 290
  md: '+   - Typically, immutable data structures can safely be made covariant, while
    mutable structures are only type-safe when they are non-variant. In languages
    that support functional programming, function types are often covariant in their
    output types and contravariant in their input type. For simplicity, languages
    may deliberately introduce type unsoundness by making some mutable structures
    covariant, as is the case with arrays in Java and C#.

    +   - To increase flexibility, code that uses non-variant types can rely on type
    bounds—also called use-site variance annotations—instead of specifying exact types.
    An upper bound is used to constrain a type argument to be a subtype of another
    type; a lower bound is used to require it to be a supertype of another type.

    +   - Ad hoc and parametric polymorphism are sometimes packaged into the notion
    of type class, especially in languages that have no support for subtype polymorphism.
    Type classes can be used to uniformly access services on values of different types,
    even when those services are not related by a common supertype. In particular,
    types developed independently from a function that uses a type class can be adapted
    and used as arguments to this function.'
