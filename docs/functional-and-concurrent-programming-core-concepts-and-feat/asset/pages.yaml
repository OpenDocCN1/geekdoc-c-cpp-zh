  md: "For example, in Listing 17.3, we saw a pattern for thread termination that\
    \ uses a volatile Boolean variable to request termination of another thread. It\
    \ is reproduced here:\n\n```\n@volatile private var continue = true\n\ndef terminate()\
    \ = continue = false\n\ndef run() =\n  while continue do\n    // perform task\n\
    \  end while\n  // cleanup\n```\n\nThe defining property of volatile variables\
    \ is that writing a volatile variable happens-before the next read of that variable.\
    \ From this, you know that the first time a thread in run reads the shared variable\
    \ continue after method terminate has been called, it will read the value false\
    \ written in terminate. If the shared Boolean flag is not volatile, there is no\
    \ happens-before connection between its writing and subsequent reading, and the\
    \ runner thread is at risk of still reading true after false was written, and\
    \ thus of continuing to run.\n\nAs another illustration, consider a three-thread\
    \ program:\n\n```\ndef run1() = // behavior of thread t1\n  SECONDS.sleep(4)\n\
    \  println(x)\n  SECONDS.sleep(5)\n  y.synchronized {\n    SECONDS.sleep(1)\n\
    \    println(x)\n    SECONDS.sleep(2)\n  }\n\ndef run2() = // behavior of thread\
    \ t2\n  x = v1\n  SECONDS.sleep(2)\n  t3.start()\n  SECONDS.sleep(3)\n  y.synchronized\
    \ {\n    SECONDS.sleep(2)\n    x = v2\n    SECONDS.sleep(1)\n  }\n```"
