  md: "# 15.3 Types as Services\n\nIn Scala, every variable x defines a small type\
    \ x.type that contains only x—the singleton {x} in terms of sets. For instance,\
    \ the function\n\n```\n```scala\ndef doSomethingWithBook(book: Book): book.type\
    \ = ...\n```\n```\n\ndoes something with a book before returning it. Using Book\
    \ as the return type would allow the function to return a different book, possibly\
    \ a copy of the input. The very specific type book.type guarantees that the function\
    \ returns the same book object used as input.\n\nThis approach is often used in\
    \ “builder” classes to chain method calls. For instance, you can define a buffer\
    \ with an append method:\n\n```\n```scala\nclass Buffer[A]:\n  def append(value:\
    \ A): Buffer[A] = ...\n...\n// used as:\nval buffer = Buffer[String]()\nbuffer.append(\"\
    foo\").append(\"bar\");\n```\n```\n\nThe intent is for method append to add an\
    \ element to the buffer and to return the buffer itself so further operations\
    \ can be applied. However, the Buffer[A] return type allows an implementation\
    \ to return a different buffer. You can use a more specific type to make it clear\
    \ that the buffer itself if being returned:\n\n```\n```scala\nclass Buffer[A]:\n\
    \  def append(value: A): this.type = ...\n...\n```\n```\n\nFinally, some languages\
    \ define a type Nothing that contains no value—the empty set. In Scala, for instance,\
    \ the empty list, Nil, has type List[Nothing]. A function that specifies Nothing\
    \ as its return type, such as Nil.head, cannot possibly return a value, since\
    \ type Nothing is empty. All it can do is keep running forever or throw an exception.\
    \ Because the empty set is a subset of every set, Nothing is a subtype of every\
    \ type.\n\n# 15.3 Types as Services\n\nAnother way you can look at types is to\
    \ focus on how typed values can be used. In this view, a type is a collection\
    \ of operations, or services, that you can utilize. A book is an object with a\
    \ title, an author, and a page count. You can create a Book type to"
