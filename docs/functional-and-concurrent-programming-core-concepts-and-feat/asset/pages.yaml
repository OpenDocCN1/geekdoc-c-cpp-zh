    assert((time2 - time1) / 1E9 <= 0.01)\n```\n\nListing 23.3: Add latches to Lis.\
    \ 21.2 for increased concurrency and precise timing.\n\nThe purpose of the start\
    \ latch, which is initialized with N + 1, is to make sure that all the pool threads\
    \ start adding to the list and the main thread starts recording time at the same\
    \ instant. First, this makes it more likely that threads will attempt to call\
    \ method add on the list at the same time, thus increasing your chances of finding\
    \ a bug if the list is not thread-safe. Second, it’s a way to measure how long\
    \ it takes for all the add operations to complete. By waiting on the start latch\
    \ before you start keeping time, you can ignore the time needed to activate threads.\
    \ The second latch, finish, opens when all the list insertions have taken place,\
    \ at which point you can record the end time. In addition to checking the final\
    \ state of the shared list, the test asserts that all the list operations were\
    \ completed in less than 1/100th of a second.\n\nLatches can transition from “closed”\
    \ to “open” one time, and one time only. They cannot transition from “open” to\
    \ “close” and so are not reusable—countdown and await have no effect on an open\
    \ latch. When threads need to use a synchronization point repeatedly, they can\
    \ use a cyclic barrier instead. A cyclic barrier automatically opens when the\
    \ last thread reaches the barrier, and it closes again immediately. Instead of\
    \ two latches, you could write the list testing example with a single reusable\
    \ barrier:\n\n```\nScala\nval exec    = Executors.newCachedThreadPool()\nval shared\
