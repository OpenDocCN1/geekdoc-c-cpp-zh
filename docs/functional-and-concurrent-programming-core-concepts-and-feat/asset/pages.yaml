- pgno: 115
  md: '# 6.7 Summary


    +   - Loops are a programming language mechanism that implements repetition. A
    loop is only useful if its body implements some form of state change, either by
    mutating objects or by reassigning variables.

    +   - Instead of mutation, a strict functional programming style relies on composition
    of pure functions, making loops useless. What is needed to replace loops is a
    mechanism that can arbitrarily nest function calls. Recursion is such a mechanism.

    +   - Recursive functions are functions that trigger calls to themselves, either
    directly or via an intermediate function (possibly leading to mutual recursion).
    They can be used as an alternative to loops to structure programs.

    +   - More importantly, recursive functions fit algorithms that recursively decompose
    a given problem into smaller problems of the same type. A recursive algorithm
    combines a strategy for using solutions to smaller instances of the same problem
    with one or more trivial (non-recursive) cases.

    +   - Recursive functions must always include at least one trivial case that does
    not require recursion, and they must make sure that all recursive calls are applied
    to instances of the problem that are smaller—closer to one of the trivial cases.
    These two conditions are necessary to ensure that the function terminates.

    +   - Recursive functions are well suited to processing recursive data types like
    trees and functional lists. Tasks on trees and lists can often be decomposed into
    similar tasks on subtrees and sublists, which are achieved recursively.

    +   - Function calls that take place at the very end of another function—as in
    return f(x)—can sometimes be optimized to reduce usage of the execution stack.
    As a special case, a function that calls itself exactly once at the very end of
    its execution is said to be tail recursive. Tail recursive functions are commonly
    optimized in functional programming languages.

    +   - When tail recursion is optimized by a compiler, it can safely be used to
    mimic repetition. Indeed, the code generated for an optimized tail recursive function
    will often be identical to code that is compiled from a loop.'
