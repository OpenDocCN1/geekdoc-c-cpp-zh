- pgno: 77
  md: "# Chapter 4\n\n# Case Study: Active–Passive Sets\n\nTo help cement the ideas\
    \ explored in Chapters 1 to 3, this first case study develops several variants\
    \ of a small program. The functionality to be implemented is a structure that\
    \ keeps track of the states of a collection of objects. Each element from the\
    \ collection can be in an active or passive state. States can be queried, and\
    \ changed from passive to active, or from active to passive. The state of the\
    \ entire collection can also be queried and modified by global operations that\
    \ activate or deactivate all the elements. The service is implemented in a classic\
    \ object-oriented style, a purely functional style, and a hybrid style that uses\
    \ functional objects.\n\n# 4.1 Object-Oriented Design\n\nConsider first a standard,\
    \ object-oriented implementation—nothing functional here. An ActivePassive class\
    \ is parameterized by the type of active/passive elements. It is implemented in\
    \ terms of a mutable set, activeSet, used to represent the subset of elements\
    \ that are active—elements outside the set are passive. Initially, all the elements\
    \ are passive, and this set is empty.\n\n```\nclass ActivePassive[A](elements:\
    \ Set[A]):\n  private val activeSet = mutable.Set.empty[A]\n\n  def isActive(elem:\
    \ A): Boolean = activeSet.contains(elem)\n\n  def isPassive(elem: A): Boolean\
    \ = !isActive(elem)\n\n  def allActive: Set[A] = activeSet.toSet\n\n  def allPassive:\
    \ Set[A] = elements diff activeSet\n\n  def isAllActive: Boolean = activeSet.size\
    \ == elements.size\n\n  def isAllPassive: Boolean = activeSet.isEmpty\n\n  def\
    \ activate(elem: A): Unit = activeSet += elem\n\n  def deactivate(elem: A): Unit\
    \ = activeSet -= elem\n```"
