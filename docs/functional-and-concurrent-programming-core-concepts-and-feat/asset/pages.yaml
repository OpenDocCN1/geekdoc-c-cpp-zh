  md: "# 28.6 Asynchronous Implementation with CompletableFuture\n\nInstead of Scala\
    \ futures, you can base a parallel asynchronous implementation on Java’s CompletableFuture.\
    \ This class already implements a completeOnTimeout method, so no additional code\
    \ is needed to deal with timeouts. However, you still need a findFirst function\
    \ to retrieve the result of the earliest successful strategy.\n\nJava defines\
    \ a function anyOf that returns (a future equivalent to) the first finished CompletableFuture\
    \ from an array. It is similar in purpose to Scala’s firstCompletedOf, but differs\
    \ in the fact that the input array can contain futures of different types, and\
    \ the resulting future loses all type information—it is a CompletableFuture[Object].\
    \ To avoid the awkwardness of working without types, and as an excuse to illustrate\
    \ a different approach, the following implementation bypasses anyOf and uses a\
    \ promise instead:\n\n```\ndef findFirst[A](futures: Seq[CompletableFuture[A]],\n\
    \        test: A => Boolean): CompletableFuture[Option[A]] =\n  if futures.isEmpty\
    \ then CompletableFuture.completedFuture(None)\n  else\n    val promise = CompletableFuture[Option[A]]()\n\
    \    val active  = AtomicInteger(futures.length)\n\n    for future <- futures\
    \ do\n      future.handle { (value, ex) =>\n        if !promise.isDone then\n\
    \          if (ex eq null) && test(value) then promise.complete(Some(value))\n\
    \          else if active.decrementAndGet() == 0 then promise.complete(None)\n\
    \      }\n    promise\n```\n\nListing 28.7: Earliest CompletableFuture that satisfies\
    \ a condition.\n\nUnless the list of futures is empty, a promise is created as\
    \ an incomplete instance of CompletableFuture. The idea is to fulfill this promise\
    \ with the first future from the list that produces a value that satisfies the\
    \ given test. However, if no future produces such a value, the promise still needs\
    \ to be finished. Therefore, a counter active is introduced to keep track of how\
    \ many futures are still running. This way, the last future that terminates can\
    \ still complete the promise with None if no suitable value was found. This counter\
    \ is shared among threads and needs to be thread-safe—an instance of AtomicInteger\
    \ is used here. With this counter in place, you then add a callback to each future,\
    \ using method handle, which is CompletableFuture’s equivalent of Scala’s onComplete.\
    \ If the promise is still open and a future produces a value that satisfies the\
    \ test, this value is used to fulfill the promise. Otherwise, the active counter\
    \ is decremented, and if the future is the last to terminate, it fulfills the\
    \ promise with None."
