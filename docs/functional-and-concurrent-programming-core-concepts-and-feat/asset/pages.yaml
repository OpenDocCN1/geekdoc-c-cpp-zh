  md: '# 22.5 **The Java Memory Model**


    A memory model defines the semantics of operations that utilize memory—in particular,
    reading and writing variables. You may be thinking that what happens when writing
    and reading variables is pretty clear and does not need to be explained in a four-page
    section. If so, it is only because you have in mind the simple memory model used
    in single-threaded programs. When multiple threads are involved, the story becomes
    more complicated.


    As an illustration, Figure 22.2 displays reading and writing operations on two
    variables, x and y, in a single-threaded program as they occur over time. The
    notation Wx(v) represents the action of writing variable x with value v, and Rx
    is a reading of variable x. In this scenario, reading x produces the value v3,
    and both reads of y produce the value v4. Nothing surprising there: Reading a
    variable produces the last value written to this variable, a property known as
    sequential consistency.


    ![](img/74309e2bdd93f68d2e94338a3d73517f_368_0.png)


    **Figure 22.2**  Single-threaded executions are sequentially consistent.


    In the presence of multiple threads, however, memory models are often *not* sequentially
    consistent—in other words, reading a variable may not produce the last value written
    into it. The reason is that sequential consistency is typically not needed in
    multithreaded applications, and hardware can be more efficient by not implementing
    it. In particular, weaker consistency models facilitate hardware optimizations
    such as core-level caching, instruction reordering, and speculative execution.
    To improve performance, hardware manufacturers make consistency commitments that
    are not sequential, and programmers need to be aware of them (especially when
    implementing compilers and operating systems). To ensure portability across different
    hardware and operating systems, Java defines its own memory model, the Java Memory
    Model (JMM), common to all languages running on the JVM. And to better leverage
    hardware performance, the JMM is not sequentially consistent.


    Figure 22.3 shows the same operations as Figure 22.2, but executed by two different
    threads, T1 and T2. While sequential consistency would ensure that when variable
    x is read by T1 its value is v3, there is no such guarantee under the JMM, even
    though v3


    > The memory model of .NET languages is very similar to the JMM; the C/C++ model
    is more complex.'
