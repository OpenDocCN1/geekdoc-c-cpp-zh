  md: '# 19.3 Avoiding Reference Escape


    The encapsulation of synchronization in SafeStringList works because there is
    a corresponding encapsulation of data. You can ensure that all accesses to contents
    use the proper lock because there is no way to reach the data other than to go
    through method add or method size.


    If a reference to contents were to escape encapsulation, threads could start reading
    and writing the list without locking:


    ```

    Scala

    // DON''T DO THIS!

    def getAll: List[String] = synchronized(contents)

    ```


    With this method added, SafeStringList ceases to be thread-safe:


    ```

    Scala

    shared.getAll.add(...) // adds to the list without locking!

    ```


    A thread that executes this code acquires the lock to obtain a reference to the
    inner list contents. However, the lock is released at the end of method getAll,
    before the thread calls add. In other words, the thread is now adding to the array-based
    list without the lock.


    Of course, reference escape is often harmful in object-oriented designs and needs
    to be avoided even in single-threaded programs. However, multithreading tends
    to complicate the issue. This next variant of method getAll shares the contents
    list in a way that would be harmless in a single-threaded context but will still
    cause problems when multiple threads are involved:


    ```

    Scala

    // DON''T DO THIS!

    def getAll: List[String] = Collections.unmodifiableList(synchronized(contents))

    ```


    The Java function Collections.unmodifiableList creates a wrapper that disables
    all the mutating methods of a list. It is often used to provide external code
    with read-only access to an internal list without breaking data encapsulation:
    User code can use the wrapper to query the list but cannot modify it. However,
    a thread that calls shared.getAll.get(...) would still be reading the list without
    locking. As discussed at the end of Section 19.2, this is unsafe because other
    threads might lock the list and modify it at the same time, causing concurrent
    read/write conflicts (in addition to memory model issues).'
