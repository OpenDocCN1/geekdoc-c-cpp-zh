    All the higher-order functions discussed in Section 10.1 use a predicate argument.
    Other standard higher-order functions use non-Boolean functions as arguments.
    Functions map and foreach take a function with an arbitrary return type and apply
    it to all the elements in a structure. The difference between the two is that
    map produces a structure with the results of applying the function, while foreach
    applies the function for the purpose of side effects and ignores return values.


    For instance, you can convert a list of Fahrenheit temperatures to Celsius values
    using map:


    ```

    temps.map(temp => ((temp - 32) / 1.8f).round) // List(31, 33, 26, 21, 38, 37,
    21)

    ```


    The return type of the function being applied determines the type of the elements
    in the collection that is returned:


    ```

    temps.map(temp => if temp > 72 then "high" else "low")

    // List("high", "high", "high", "low", "high", "high", "low")

    ```


    ```

    temps.map(temp => (72, temp - 72))

    // List((72,16), (72,19), (72,6), (72,-3), (72,28), (72,26), (72,-2))

    ```


    The strings and pairs in this example are returned as a list because temps is
    a list. If instead the temperatures were stored in an array, temps.map would produce
    an array. A method map is available on many types in Scala:


    ```

    Set(0.12, 0.35, 0.6).map(1.0 - _) // Set(0.88, 0.65, 0.4)

    ```


    ```

    Some("foo").map(_.toUpperCase) // Some("FOO")

    ```


    Because some collections make no sense for some types, map may return a structure
    of a different type:


    ```

    "foo".map(_.toInt) // IndexedSeq(102, 111, 111)

    ```


    ```

    BitSet(12, 35, 60).map(_ / 100.0) // SortedSet(0.12, 0.35, 0.6)

    ```'
