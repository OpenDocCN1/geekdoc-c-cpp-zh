- pgno: 121
  md: "```\ncase Nil        => Nil\ncase _ :: tail => drop(tail, n - 1)\n```\n\n#\
    \ Listing 7.5: Recursive implementation of drop on lists; see also Lis. 7.6.\n\
    \nFunction drop takes two arguments: a list and a number n of elements to drop.\
    \ The special case n = 0 (no elements removed) is handled by returning the list\
    \ unchanged. You can handle the other special case (empty list) in two different\
    \ ways, depending on the desired semantics of removing elements from an empty\
    \ list:\n\n+   - There are no elements to remove in an empty list: Throw an exception.\n\
    +   - Whatever is removed, an empty list remains empty: Return an empty list.\n\
    \nSome programming languages, like ML, follow the first interpretation. The Scala\
    \ standard library uses the second interpretation, which I also chose here. Function\
    \ drop is tail recursive and does not incur stack space usage at runtime.\n\n\
    As an alternative to if-then-else followed by pattern matching, you can use pattern\
    \ matching directly on both the number and the list by joining them as a pair:\n\
    \n```\n@tailrec\ndef drop[A](list: List[A], n: Int): List[A] = (list, n) match\n\
    \  case (_, 0) | (Nil, _) => list\n  case (_ :: tail, _)    => drop(tail, n -\
    \ 1)\n```\n\n# Listing 7.6: Recursive implementation of drop on lists; see also\
    \ Lis. 7.5.\n\nPattern (_, 0) is the case n = 0, and pattern (Nil, _) is the empty\
    \ list case. In both cases, the function returns the list unchanged.\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_121_0.png)\n\
    \n# Figure 7.2 Data sharing between list and drop(list, n).\n\nThere is an important\
    \ aspect of function drop—with either implementation—that needs to be emphasized:\
    \ Even though the function returns a new list, it does not allocate any new list\
    \ data in memory. The list that is returned shares all its storage with the argument\
    \ list (Figure 7.2). Given that the function is tail recursive and does not create\
    \ new data, it will be compiled into a loop that moves a pointer n times along\
    \ a linked list until it reaches the desired position. As a consequence, you can\
    \ use drop as a basis for the implementation of a function getAt that fetches\
    \ an element at a specified index:"
