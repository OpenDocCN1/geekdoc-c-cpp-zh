- pgno: 442
  md: 'Method peek is not much different from before: It reads the top node and, if
    it is not null, returns its value. No atomicity is needed, and top is used as
    if it were a plain volatile variable. The other two methods are more involved.


    In push, you start by creating a new node that refers to the current value of
    top as its own next pointer. You then need to update top to point to this new
    node (move top pointer up in Figure 27.2). You do this with a CAS, in case another
    thread is modifying top concurrently (inside push or pop). If the CAS fails, you
    update the node’s next pointer to refer to the new value of top and attempt to
    update top again. Similarly, pop uses a CAS to try to update top to top.get.next
    (move the top pointer down in Figure 27.2) and retries the pop operation if the
    CAS fails.⁶


    ![](img/74309e2bdd93f68d2e94338a3d73517f_442_0.png)


    # Figure 27.2 Compare-and-set to push/pop a lock-free stack.


    In this stack example, you can see that the lock-free algorithm is noticeably
    more complex than one that uses locks. Many thread-safe data structures in java.util.concurrent
    rely on lock-free algorithms, including structures used internally to implement
    synchronizers, such as queues of waiting threads. Some of them are quite tricky
    due to the fact that an operation needs to update multiple references, which is
    not an atomic operation, even when using compareAndSet on instances of AtomicReference.


    A limitation of CAS is that it can be successful, even if the target value has
    been modified concurrently, as long as it was modified back to its expected value—a
    scenario known as the ABA problem. For instance, compareAndSet(false, true) on
    an AtomicBoolean can fail to notice concurrent interactions that changed the Boolean
    from false to true, then back to false. If it is necessary for an algorithm to
    detect such a change, class AtomicStampedReference can be used. This class adds
    an integer counter to references as a way to distinguish between identical values.⁷


    ⁶Method pop uses tail recursion for retries; method push uses a loop because it
    makes it easier to reuse the same node across CAS attempts—using recursion would
    require introducing an additional method.


    ⁷Modern processors offer an alternative to CAS known as load-linked/store-conditional
    (LL/SC), a pair of bracketed instructions that detect interference between a load
    and a store independently from the values being loaded and stored, and, therefore,
    are not sensitive to the ABA problem.'
