    ```


    Listing 4.1: Object-oriented active-passive sets, using underlying mutable sets.


    This class uses two fields: elements, an immutable set (initialized in the constructor),
    and activeSet, a mutable set, initially empty. Methods isActive and isPassive
    are implemented in terms of lookups in activeSet: An element is active if it is
    found, and inactive if it is not found.¹ A user can retrieve the set of all currently
    active elements by calling method allActive. This method makes a copy of the mutable
    activeSet using method toSet, which returns an immutable set.² To produce a set
    of all inactive elements, you need to calculate the set difference between elements
    and activeSet, which is done with method diff in Scala. Method isAllActive must
    return true exactly when all the elements are active—in other words, when elements
    == activeSet. Since activeSet is always a subset of elements, this is equivalent
    to the faster test activeSet.size == elements.size. Implementing isAllPassive
    is simpler: Just test if allActive is empty. To activate an element, you add it
    to the (mutable) set activeSet. To deactivate an element, you remove it from the
    set. To activate all the elements, you add the entire elements set to activeSet.
    To deactivate all the elements, you simply clear the activeSet.


    Instances of class ActivePassive are mutable: They change when elements are activated
    or deactivated. The implementation in Listing 4.1 relies on a mutable set, but
    you could implement a mutable ActivePassive class using immutable sets instead.
    Listing 4.2 shows this version.


    ```

    private var activeSet = Set.empty[A]


    def allActive: Set[A] = activeSet


    def activate(elem: A): Unit = activeSet += elem


    def deactivate(elem: A): Unit = activeSet -= elem


    def activateAll(): Unit = activeSet = elements


    def deactivateAll(): Unit = activeSet = Set.empty

    ...

    ```


    Listing 4.2: Object-oriented active-passive sets, using underlying immutable sets.


    ¹ As always, argument checking is omitted. It is assumed that isActive, isPassive,
    activate, etc., are always called on members of the elements set.


    ² In Java, you could avoid the copy by returning an immutable wrapper on the mutable
    set—Collections.unmodifiableSet(activeSet)—but Scala has no such mechanism in
    its standard library.'
