  md: '# Acknowledgments


    I want to thank past and present colleagues for the encouragements that got me
    started and for their feedback on the early stages of this project. Some were
    confident I had something to say (and could say it) before I realized it myself.


    A special thanks to my students, who went through various iterations of the material
    that ended up in this book. They were my guinea pigs. More times than I care to
    admit, I subjected them to frantic improvisation because a feature suddenly needed
    for that day’s lecture was only going to be introduced as part of the following
    week’s discussion. (To arrange hundreds of code examples in a consistent order
    is harder than it looks.) With last minute changes before every class, students
    got used to, in their own words, “handouts and slides on which the ink is not
    quite yet dry.”


    Some of the ideas for code illustrations in this book were gathered over a period
    of thirty years, during which time I refined them by writing and rewriting many
    implementations in a variety of programming languages. As much as I’d like to
    specifically thank the original authors of these examples, I can’t remember all
    the sources I’ve used, I don’t know which of them were original, and I feel it
    wouldn’t be fair to mention some names but not the others. Nevertheless, I don’t
    claim to have invented all the examples used in this book. The code is mine (including
    bugs), but credit for program ideas that originated elsewhere should go to their
    creators, whoever they are.


    It is truly scary to think what this book would have been if I had been left on
    my own. Whatever its current flaws, it was made astronomically better with the
    help of my editor, Gregory Doench, and his production team. They were very patient
    with a first-time author who clearly didn’t always know what he was doing.


    My feelings toward anonymous and non-anonymous reviewers is mixed. Without a doubt,
    they helped improve the book but at the cost of extending my prison sentence every
    time I was hoping to get paroled. I am thankful for their help—feedback from Cay
    Horstmann, Jeff Langr, and Philippe Quéinnec, and long email discussions with
    Brian Goetz, in particular, come to mind—but I cannot say I always welcomed their
    input as unmitigated good news. I had been warned that writing a book like this
    was a major undertaking but not that I would have to write it four times.


    Which brings me to my deepest gratitude. It goes to my family, who showed angelic
    patience as I kept promising to be done “by next month” for more than a year.
    They must have grown tired of “the book” repeatedly getting in the way of our
    family life. Indeed, I’m amazed that my wife didn’t pick up the phone one day,
    call my editor, and notify him: “That’s it. The book is finished. Done. Today.
    Now.”'
