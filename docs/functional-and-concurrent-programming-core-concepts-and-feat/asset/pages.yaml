    for developers:


    +   - *Testing:* You can test a program successfully a million times, only to
    have it fail on the next run of the tests—or even in production—because of an
    unfortunate timing of the executions of threads. It can even be that the circumstances
    needed for such an unfortunate timing exist only in the environment in which the
    application is deployed, perhaps due to specific data (which impact running times)
    or the presence of other activities running on the same hardware.

    +   - *Debugging:* After you observe a failure (in testing or in production),
    it can be difficult to reproduce it: The next execution of the exact same run
    may now appear to be working. This complicates debugging tremendously. Even when
    you can reproduce a failure, it is often the case that the faulty scenario involves
    high levels of concurrency (e.g., hundreds of threads), which makes it very difficult
    to track bugs. Even worse, any step you apply in the debugging process (breakpoints,
    logging, etc.) impacts the synchronization and the timing of threads and can make
    the bug undetectable (see the aside on “Heisenbugs” at the end of Section 18.3).


    While there is no silver bullet for testing and debugging multithreaded programs,
    it helps to keep a few basic principles in mind:


    +   - *Avoid premature optimization.* This advice is usually valid for single-threaded
    code, but in the case of multithreaded programs, it is even more important that
    you start with safe, straightforward strategies that are easy to understand. This
    will make it less challenging to reason about, maintain, and modify code. One
    thing to keep in mind is that concurrent programs are harder to test than sequential
    programs, and you cannot rely as much on a safety net of tests to catch breaking
    changes.

    +   - *Maximize concurrency when testing.* It is not enough to try “reasonable”
    scenarios when testing a concurrent application. Bugs are likely to be triggered
    by unusual or even extreme timing—for instance, due to tasks that are uncommonly
    short or uncommonly long. To generate a broad variety of interleaving of actions,
    you should strive to test programs with high levels of concurrency. It is not
    uncommon for a test to run successfully with a dozen threads and to start failing
    when a hundred threads are used.⁴ It is equally important to make sure that larger
    thread counts do, in fact, increase concurrency. A common mistake is to introduce
    an artificial bottleneck (e.g., a logging data structure, a pseudo-random generator)
    that serializes operations and prevents threads from running as concurrently as
    they should.

