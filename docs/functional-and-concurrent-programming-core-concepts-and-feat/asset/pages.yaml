  md: "actually remove anything from an immutable collection, you would need to replace\
    \ the action processOne with a function¹ that processes an element and returns\
    \ a new collection with that element removed:\n\n```\n// processes one element,\
    \ and returns a collection with this element removed\ndef processOne[A](collection:\
    \ ImmutableCollection[A]): ImmutableCollection[A] = ...\n```\n\nSo far, so good.\
    \ Now, you need a way to use this function to process an entire collection, one\
    \ element at a time. The same approach as before will not do: If collection.nonEmpty\
    \ is true, processOne(collection) will not change that—the collection is immutable.\
    \ Therefore, collection.nonEmpty will remain true, and the loop will never terminate.\
    \ Can a loop be used at all? Yes, and this program would work:\n\n```\ndef processCollection[A](collection:\
    \ ImmutableCollection[A]): Unit =\n  var remaining = collection\n  while remaining.nonEmpty\
    \ do\n    remaining = processOne(remaining)\n```\n\nThis gets the job done, but\
    \ at the cost of reintroducing mutation through an assignment statement: Something\
    \ in the body of the loop must have some side effect, and since collection cannot\
    \ change, a mutable variable remaining is introduced. (The same approach was used\
    \ in Section 3.6 to implement a mutable state in terms of an immutable data structure.)\
    \ The loop-based solution works only because there is mutation. To achieve a fully\
    \ immutable style—no var—you need to take a different route.\n\nIf a function\
    \ f is free of side effects, the repetition f(x); f(x); f(x) is pointless. Think\
    \ of code that executes Math.sqrt(4.0); Math.sqrt(4.0); Math.sqrt(4.0). What is\
    \ the point? Instead, the output of f must be used, typically as the input to\
    \ further computing. Instead of loops, what you need is a mechanism that can arbitrarily\
    \ nest function calls. This mechanism is recursion.\n\nLet’s go back to the problem\
    \ of processing an entire immutable collection. A function needs to process one\
    \ element from the collection and then process, in the same fashion, a new collection\
    \ with that one element removed. In other words, you need to invoke processOne\
    \ on the value produced by a previous call to processOne. Since processCollection\
    \ is designed to invoke processOne, all you need to do is to call processCollection\
    \ again on the output of processOne:\n\n```\ndef processCollection[A](collection:\
    \ ImmutableCollection[A]): Unit =\n  if collection.nonEmpty then processCollection(processOne(collection))\n\
    ```\n\nListing 6.1: Nesting function calls through recursion.\n\nAn initial call\
    \ to processCollection processes the first element of a collection, and produces\
    \ a new, reduced collection. This collection is then processed in the same way\n\
    \n¹This function is not pure because processing an element must have some side\
    \ effect. However, it has no side effect on the collection itself, which is all\
    \ that matters for the purpose of this illustration."
