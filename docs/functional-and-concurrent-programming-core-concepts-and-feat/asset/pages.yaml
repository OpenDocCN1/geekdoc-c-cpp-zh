  md: "# Chapter 9\n\n# Higher-Order Functions\n\nIt is natural for a programming\
    \ paradigm that centers on functions to treat them as first-class citizens. In\
    \ functional programming, functions are values and can be stored in variables\
    \ and passed as arguments. Functions that consume or produce other functions are\
    \ said to be higher-order functions. Using higher-order functions, computations\
    \ can be parameterized by other computations in powerful ways.\n\n# 9.1 Functions\
    \ as Values\n\nPrevious chapters have shown how pure functions from immutable\
    \ values to immutable values can be used as building programming blocks, and how\
    \ complex computations can be achieved by composing functions, including composing\
    \ a function with itself through recursion. Although pure functions, immutability,\
    \ and recursion are essential concepts, many would argue that the distinctive\
    \ characteristic of a functional programming style is the use of functions as\
    \ values.\n\nTo help motivate the benefits of functions as values, consider this\
    \ first illustration. Suppose you need to search for a value in a list. You can\
    \ implement such a lookup in a recursive function, similar to function contains\
    \ from Chapter 7:\n\n```\nScala\ndef find[A](list: List[A], target: A): Option[A]\
    \ = list match\n  case Nil => None\n  case h :: t => if h == target then Some(h)\
    \ else find(t, target)\n```\n\nListing 9.1: List lookup for a specific target.\n\
    \nThis function checks whether the head of a non-empty list equals the target\
    \ and, if not, keeps searching in the tail of the list. It returns an option to\
    \ allow for cases where the target value is not found. You can use find to look\
    \ for specific values in a list, like a list of temperatures:\n\n```\nScala\n\
    val temps = List(88, 91, 78, 69, 100, 98, 70)\nfind(temps, 78) // Some(78)\nfind(temps,\
    \ 79) // None\n```"
