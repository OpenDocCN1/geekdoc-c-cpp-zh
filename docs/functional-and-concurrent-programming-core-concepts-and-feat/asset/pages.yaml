  md: 'Java printTitlesAndAddMagazine function.⁹ Indeed, Scala’s mutable types face
    the same difficulty encountered in Java:


    ```

    def printTitles(pubs: Array[Publication]) = for pub <- pubs do println(pub.title)


    val books: Array[Book] = Array(book1, book2)

    printTitles(books) // rejected by the compiler

    ```


    A magazine could be inserted into an Array[Publication] value but not into an
    Array[Book] value, and thus the compiler is justified in rejecting the call: Array[Book]
    is not a subtype of Array[Publication].


    In Scala, List is said to be covariant: If S is a subtype of T, and C is covariant,
    then C[S] is a subtype of C[T]. By contrast, Java’s lists and Scala’s arrays are
    non-variant (also called invariant): If C is non-variant, any subtyping relationship
    between types S and T is not carried over to C[S] and C[T].


    In Java, all data structures are non-variant—except arrays, as discussed later.
    In Scala, mutable structures are non-variant, but most immutable structures are
    covariant. Variance is specified when defining a type, using annotations. For
    instance, arrays are defined as


    ```

    class Array[A] extends ...

    ```


    while lists use


    ```

    class List[+A] extends ...

    ```


    The relevant difference here is between [A], which specifies non-variance, and
    [+A], which indicates covariance. Many immutable types in Scala use a covariant
    annotation:


    ```

    class Tuple2[+T1, +T2] ...

    class Option[+A] ...

    class Vector[+A] ...

    class HashMap[K, +V] ... // inside package immutable

    class HashMap[K, V] ... // inside package mutable

    class LazyList[+A] ...

    ```'
