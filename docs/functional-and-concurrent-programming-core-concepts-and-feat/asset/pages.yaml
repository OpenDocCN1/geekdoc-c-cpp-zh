  md: "```\ndef factorial(n: Int): Computation[BigInt] =\n  if n == 0 then BigInt(1)\
    \ else for f <- call(factorial(n - 1)) yield f * n\n\ndef size[A](tree: BinTree[A]):\
    \ Computation[Int] = tree match\n  case Empty => 0\n  case Node(_, left, right)\
    \ =>\n    for\n      ls <- call(size(left))\n      rs <- call(size(right))\n \
    \   yield 1 + ls + rs\n\ndef hanoi[A](n: Int, from: A, middle: A, to: A): Computation[List[(A,\
    \ A)]] =\n  if n == 0 then List.empty\n  else\n    for\n      moves1 <- call(hanoi(n\
    \ - 1, from, to, middle))\n      moves2 <- call(hanoi(n - 1, middle, from, to))\n\
    \    yield moves1 ::: (from, to) :: moves2\n```\n\nListing 14.10: For-yield on\
    \ trampolines; contrast with Lis. 14.7 to 14.9.\n\nThese functions are compiled\
    \ into the same map and flatMap combinations used earlier.\n\n# 14.5 Summary\n\
    \nThe idea of using thunks to delay argument evaluation, which was explored in\
    \ Chapter 12, can also be used to delay the evaluation of recursive tail-calls,\
    \ a technique sometimes known as a trampoline. Each call is represented as a thunk,\
    \ and the execution stack is replaced with a lazily built series of thunks, which\
    \ requires very little memory. These thunks can be evaluated one by one using\
    \ a loop (or a tail recursive function in a language that optimizes it into a\
    \ loop). When a recursive call is not in tail position, its value is used for\
    \ further computation after the call. To maintain lazy evaluation, the computation\
    \ that uses this value needs to be embedded into the trampoline as a transformation\
    \ using either map (for a regular function call, using the execution stack) or\
    \ flatMap (for a transformation that requires further recursive calls). The implementation\
    \ of flatMap is delicate because it must ensure that the evaluation of long chains\
    \ of calls proceeds without growing the execution stack. Once method flatMap is\
    \ implemented efficiently, map can be derived from it."
