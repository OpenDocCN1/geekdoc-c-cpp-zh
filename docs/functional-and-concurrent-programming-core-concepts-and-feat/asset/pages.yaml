    \ tail => last(tail)\n```\n\nListing 6.4: Incorrect implementation of last; fixed\
    \ in Lis. 6.10.\n\nThe algorithm is based on the idea that the empty list has\
    \ no last element and that the last element of a non-empty list is the last element\
    \ of its tail. However, the function cannot possibly work as written because it\
    \ does not have a value-returning, non-recursive branch: The function either throws\
    \ an exception or continues to run. Indeed, the intuition that the last element\
    \ of a non-empty list is the last element of its tail is not valid on a list of\
    \ size 1.\n\n+   - All the subproblems solved recursively must be smaller than\
    \ the original problem in some way. This is again necessary to guarantee termination.\
    \ Common patterns include a list function applied to a shorter list; a number\
    \ function applied to a smaller positive number (as in the case of hanoi); a tree\
    \ function applied to a subtree; and so on.\n\nAs an illustration of a failure\
    \ to adhere to this principle, consider this incorrect implementation of merge-sort\
    \ (function merge is omitted):\n\n```\n// DON'T DO THIS!\ndef mergeSort[A](list:\
    \ List[A]): List[A] =\n  if list.isEmpty then list\n  else\n    val (left, right)\
    \ = list.splitAt(list.length / 2) // split in the middle\n    merge(mergeSort(left),\
    \ mergeSort(right))\n```\n\nListing 6.5: Incorrect merge sort; fixed in Lis. 7.18.\n\
    \nMethod splitAt splits a list as a given point: List(A,B,C,D).splitAt(2) is the\
    \ pair (List(A,B), List(C,D)). This method is used to split a non-empty list into\
    \ two halves. Each half is sorted recursively, and the two sorted halves are merged\
    \ into a sorted list.\n\nThe issue here is that mergeSort(right) is not guaranteed\
    \ to be a recursive call on a smaller list. If you split a list that contains\
    \ exactly one element, you get two lists: One is empty, and the other is the original\
    \ list unchanged. In the case of function mergeSort, this means that right could\
