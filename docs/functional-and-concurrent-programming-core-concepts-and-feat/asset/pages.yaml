  md: "# 20.2 Single Public Lock Implementation\n\nThe simplest way to make the traditional\
    \ two-list queue thread-safe is to use the queue itself as an exclusive lock and\
    \ to only access either list with the lock owned:\n\n```\nclass ConcurrentQueue[A]:\n\
    \  private var in, out = List.empty[A]\n\n  def isEmpty: Boolean = synchronized(out.isEmpty\
    \ && in.isEmpty)\n\n  def put(value: A): Unit = synchronized(in ::= value)\n\n\
    \  def take(): Option[A] = synchronized {\n    if isEmpty then None\n    else\n\
    \      if out.isEmpty then\n        out = in.reverse\n        in = List.empty\n\
    \      val first = out.head\n      out = out.tail\n      Some(first)\n  }\n```\n\
    \nListing 20.1: Thread-safe queue (single public lock); see also Lis. 20.5 and\
    \ 20.7.\n\nA queue is empty when both lists are empty. You add a value to the\
    \ queue by prepending it to the in list—in ::= value is the same as in = value\
    \ :: in. You remove a value from the queue by reducing list out to its tail and\
    \ returning its head. An empty list out needs to be handled as a special case:\
    \ Reverse list in, make it the new out, and reset in to an empty list. The resulting\
    \ code is basically a standard two-list queue implementation, except that the\
    \ entire body of each method is executed with a lock.\n\nNote that isEmpty is\
    \ called from within take with the lock already owned. There is no harm in that,\
    \ as intrinsic locks are reentrant. However, the following variant, which calls\
    \ isEmpty before acquiring the lock, is incorrect:\n\n```\n// DON'T DO THIS!\n\
    def take(): Option[A] =\n  if isEmpty then None\n  else\n    synchronized {\n\
    \      if out.isEmpty then\n        out = in.reverse\n        in = List.empty\n\
    \      val first = out.head\n```"
