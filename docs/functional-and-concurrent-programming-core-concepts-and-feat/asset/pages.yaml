- pgno: 43
  md: 'As this Java example illustrates, functions that modify some object and functions
    that do not are often indistinguishable from their signatures: `firstString1`
    and `firstString2` both take a `List<String>` argument and return a value of type
    `String`. Instead, programmers are expected to rely on good naming and documentation—including
    possibly annotations—to help emphasize that a function-like construct also modifies
    the state of a system. For instance, the two functions in the preceding example
    could be named `getFirstString` and `getAndRemoveFirstString`, respectively.


    The starting point of functional programming is to rely, as fundamental organizational
    blocks of code, on functions that produce new values but do not modify existing
    data in any way. State modifications, when necessary, are performed elsewhere
    in ways that are unambiguous—that is, not through constructs that look like functions.


    # Aside on λ-Calculus


    When discussing functions, notations from a typical algebra class are somewhat
    ambiguous. One might write $f(x) = x^2 - 1$ as a way to define function $f$. Then,
    $f(2)$ is used to represent the value obtained by applying function $f$ to the
    number 2. In the same way, $f(y)$ is $f$ applied to variable $y$. However, by
    itself, $f(x) = (x - 1)(x + 1)$ is far from clear. Is this a (re)definition of
    $f$? Or is it a theorem about an existing function $f$, one stating that $f(x)$
    is always equal to $(x - 1)(x + 1)$?


    $\lambda$-Calculus (where $\lambda$ is the Greek letter *lambda*) is a theory
    of functions developed in the 1930s and serves as one of the mathematical foundations
    of functional programming. In $\lambda$-calculus, the definition of $f$ and the
    corresponding theorem would be stated unambiguously. The definition of $f$ could
    be written as $f = \lambda x. (x^2 - 1)$; the application of $f$ to number 2 would
    be $f 2$; and the general theorem would be $f x = (x - 1)(x + 1)$ (assuming a
    standard notation for arithmetic operations).


    This book focuses on practical programming, so it does not discuss $\lambda$-calculus
    in any depth. It should be said, though, that many core ideas of functional programming
    find their roots there. For instance, in $\lambda$-calculus, functions and data
    are terms of the same algebra. This naturally leads to the notion of functions
    as values, which is explored in Chapter 9. *Currying* (Section 9.2) is tied to
    the fact that all functions in $\lambda$-calculus are single-argument functions.
    Addition, for instance, would be defined as $\lambda x. \lambda y. (x + y)$, which
    is a function of a single argument $(x)$ that returns another function $\lambda
    y. (x + y)$ of a single argument $(y)$. Other aspects of functional programming
    are often discussed in terms of $\lambda$-calculus. Hybrid programming languages,
    for example, sometimes discuss the relationship between *methods* and *functions*
    (Section 9.6) in terms of the $\eta$-conversion, which states that $\lambda x.
    f x$ and $f$ are equivalent. (In programming language terms, you can think of
    it as the equivalence between the function that applies method `f` and method
    `f` itself.)


    The debt of functional programming to $\lambda$-calculus is nowhere more evident
    than in the terminology used for *function literals* (Section 9.3): They are often
    expressed as “*lambda expressions*,” and `lambda` is actually a keyword used to
    define such functions in languages like Ruby and Python.'
