    hostname\", () => InetAddress.getLocalHost.getHostName)\n```\n\nwithout incurring\
    \ any additional cost if the hostname property is already defined.\n\n# 12.2 By-Name\
    \ Arguments\n\nIn any programming language with higher-order functions—which includes\
    \ all functional programming languages—you can achieve delayed evaluation of arguments\
    \ by replacing values with functions that produce those values. Those no-argument\
    \ functions, used to delay evaluation, are sometimes called thunks. If your language\
    \ has support for lambda expressions, they are usually the most convenient way\
