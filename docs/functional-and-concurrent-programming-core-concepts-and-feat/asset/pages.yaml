- pgno: 96
  md: "```\ndef get[A](zipper: Zipper[A]): A = zipper match\n  case (_, x :: _) =>\
    \ x\n\ndef set[A](zipper: Zipper[A], value: A): Zipper[A] = zipper match\n  case\
    \ (left, _ :: right) => (left, value :: right)\n```\n\nListing 5.11: List zipper\
    \ getting and setting.\n\nFunction get uses a pattern that matches pairs in which\
    \ the second element is a non-empty list, with head x. This head is the value\
    \ under the cursor and is returned. Since zippers are immutable, function set\
    \ updates the value under the cursor by producing a new zipper. The pattern _\
    \ :: right matches a non-empty right list with an unspecified head. A new zipper\
    \ is built by using a new right list with the value argument as its head. Thanks\
    \ to data sharing in functional lists, both set and get are constant-time operations.\
    \ Furthermore, the new zipper produced by function set also shares data with the\
    \ zipper used as the argument—all of the first list and most of the second list.\n\
    \nTo move the cursor to the left, you need function moveLeft to move the rightmost\
    \ element left of the cursor from the first list to the second list. Because the\
    \ elements left of the cursor are stored in reverse order, the element to move\
    \ is the head of the first list, which needs to become the head of the second\
    \ list: x :: left becomes left, and right becomes x :: right. In the preceding\
    \ example, (List('a','l','P'), List('t','o')) becomes (List('l','P'), List('a','t','o')).\
    \ If the cursor is already in the leftmost position, the zipper is returned unchanged.\
    \ This case is captured by the underscore pattern:\n\n```\ndef moveLeft[A](zipper:\
    \ Zipper[A]): Zipper[A] = zipper match\n  case (x :: left, right) => (left, x\
    \ :: right)\n  case _                 => zipper\n\ndef moveRight[A](zipper: Zipper[A]):\
    \ Zipper[A] = zipper match\n  case (left, x :: right) if right.nonEmpty => (x\
    \ :: left, right)\n  case _                                    => zipper\n```\n\
    \nListing 5.12: List zipper navigation.\n\nMoving the cursor to the right is similar:\
    \ Take the head of the second list and move it to the head of the first list.\
    \ However, you also need to avoid moving the cursor past the rightmost element,\
    \ since this would leave a zipper with no current value. The condition in the\
    \ first pattern of function moveRight guarantees that the second list in the new\
    \ zipper is non-empty. Both cursor movements are implemented as constant-time\
    \ operations.\n\nInstead of a condition, you could use the pattern \"_ :: _\"\
    \ to ensure that right is non-empty:"
