  md: 'You cannot invoke runInParallel on a List<BookPublisher>. Adding a type bound
    can make the function more flexible:


    ```

    public <A> List<A> runInParallel(List<? extends Function0<A>> tasks) {...}

    ```


    You can now call this function on a List<BookPublisher>. However, it then returns
    a value of type List<Book> specifically:


    ```

    List<BookPublisher> bookPublishers = ...

    List<Book> books = runInParallel(bookPublishers); // OK

    List<Publication> pubs = runInParallel(bookPublishers); // rejected by the compiler

    ```


    For the last line to work, type A would have to be Publication. But BookPublisher
    is a subtype of Function0<Book>, not a subtype of Function0<Publication>, and
    function types are not covariant in Java: Function0<Book> is not a subtype of
    Function0<Publication>.


    You can further improve the runInParallel function by using a second type bound,
    inside the function type:


    ```

    public <A> List<A> runInParallel(List<? extends Function0<? extends A>> tasks)
    {...}

    ```


    Listing 15.11: Using type bounds on non-variant types for increased flexibility.


    This second bound makes it possible to call runInParallel(bookPublishers) and
    have the return value be of type List<Publication> because BookPublisher is a
    subtype of Function0<? extends Publication>. You can define a similar function
    in Scala:¹²


    ```

    def runInParallel[A](tasks: List[() => A]): List[A] = ...


    val bookPublishers: List[BookPublisher] = ...

    val pubs: List[Publication] = runInParallel(bookPublishers) // OK

    ```


    The definition is simpler and needs no type bounds because, in Scala, lists are
    covariant and functions are also covariant in their return type. Type A can be
    Publication because BookPublisher is a subtype of () => Book, and () => Book is
    a subtype of () => Publication.


    ¹²An even more flexible function would use kinds (higher-order types) so a list
    is returned from a list, a set from a set, etc.'
