  md: "# Preface\n\nBefore you start reading this book, it is important to think about\
    \ the distinction between programming languages and programming language features.\
    \ I believe that developers benefit from being able to rely on an extensive set\
    \ of programming language features, and that a solid understanding of these features\
    \ in any language—will help them be productive in a variety of programming languages,\
    \ present or future.\n\nThe world of programming languages is varied and continues\
    \ to evolve all the time. As a developer, you are expected to adapt and to repeatedly\
    \ transfer your programming skills from one language to another. Learning new\
    \ programming languages is made easier by mastering a set of core features that\
    \ today’s programming languages often share, and that many of tomorrow’s languages\
    \ are likely to use as well.\n\nProgramming language features are illustrated\
    \ in this book with numerous code examples, primarily in Scala (for reasons that\
    \ are detailed later). The concepts, however, are relevant—with various degrees—to\
    \ other popular languages like Java, C++, Kotlin, Python, C#, Swift, Rust, Go,\
    \ JavaScript, and whatever languages might pop up in the future to support strong\
    \ typing as well as functional and/or concurrent programming.\n\nAs an illustration\
    \ of the distinction between languages and features, consider the following programming\
    \ task:\n\n> *Shift every number from a given list by a random amount between\
    \ -10 and 10. Return a list of shifted numbers, omitting all values that are not\
    \ positive.*\n\nA Java programmer might implement the desired function as follows:\n\
    \n```\n```java\nList<Integer> randShift(List<Integer> nums, Random rand) {\n \
    \   var shiftedNums = new java.util.ArrayList<Integer>(nums.size());\n    for\
    \ (int num : nums) {\n        int shifted = num + rand.nextInt(-10, 11);\n   \
    \     if (shifted > 0) shiftedNums.add(shifted);\n    }\n    return shiftedNums;\n\
    }\n```\n```"
