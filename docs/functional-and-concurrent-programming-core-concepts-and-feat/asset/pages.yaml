  md: "# Chapter 7 Recursion on Lists\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_124_0.png)\n\
    \nAs for the underlying equality, the concatenation of list1 and list2 produces,\
    \ in general, a list that starts with the head of list1 and continues with the\
    \ concatenation of the tail of list1 with list2 (Figure 7.4):\n\nconcat(list1,\
    \ list2) = head(list1) :: concat(tail(list1), list2)\n\nFor this equality to make\
    \ sense, the first list needs to have a head and a tail (the second list can be\
    \ empty). You handle the special case where the first list is empty by observing\
    \ that the concatenation of an empty list and another list is the other list itself.\n\
    \n```\ndef concat[A](list1: List[A], list2: List[A]): List[A] = list1 match\n\
    \  case Nil => list2\n  case head1 :: tail1 => head1 :: concat(tail1, list2)\n\
    ```\n\nListing 7.9: Recursive implementation of list concatenation.\n\nNote how\
    \ recursion proceeds on the first list only: The second list is unchanged in the\
    \ recursive calls. This means that the computation time of a call to concat is\
    \ proportional to the length of the first list independently from the size of\
    \ the second list. In particular, you can append an element at the end of a list\
    \ by concatenating a single-element list, but that takes time proportional to\
    \ the length of the list. The fact that the second list is short does not help\
    \ in any way:\n\n```\ndef append[A](list: List[A], value: A): List[A] = concat(list,\
    \ List(value))\n```\n\nListing 7.10: Appending at the end of a list using concatenation.\n\
    \nContrast this with prepending to a list, which you can achieve in constant time\
    \ with a single call to \"::\". This difference greatly impacts how you should\
    \ implement algorithms expressed in terms of functional lists. Good performance\
    \ is contingent on building lists by prepending instead of appending. In particular,\
    \ never use a list as a first-in-first-out queue."
