- pgno: 122
  md: "```\ndef getAt[A](list: List[A], i: Int): A = drop(list, i) match\n  case Nil\
    \        => throw NoSuchElementException(\"getAt(empty)\")\n  case value :: _\
    \ => value\n```\n\nListing 7.7: Implementation of getAt on lists, using drop.\n\
    \nAfter i elements have been removed, the head of the remaining list, if any,\
    \ is the element at position i in the original list (indexing is zero-based).\n\
    \nAn easy mistake you want to avoid is to start using lists as if they were arrays\
    \ with fast indexing.² Always remember that accessing the ith element of a functional\
    \ list takes time proportional to i, as can be seen clearly from the implementation\
    \ of functions drop and getAt in Listings 7.6 and 7.7.\n\n# 7.4 Building Lists\
    \ from the Execution Stack\n\nYou can think of drop as a generalization of the\
    \ tail function: drop(list, 1) is almost³ the same thing as tail(list). Function\
    \ head is similarly generalized into a function take that extracts the first n\
    \ elements of a list. Function take is based on an equality similar to that of\
    \ drop. That is, to take the first n elements from a list, take the head of the\
    \ list, followed by n − 1 elements from the tail:\n\n```\ntake(list, n) = head(list)\
    \ :: take(tail(list), n - 1)\n```\n\nThe corresponding code is straightforward:\n\
    \n```\ndef take[A](list: List[A], n: Int): List[A] = (list, n) match\n  case (_,\
    \ 0) | (Nil, _) => Nil\n  case (head :: tail, _) => head :: take(tail, n - 1)\n\
    ```\n\nListing 7.8: Recursive implementation of take; contrast with Listings 7.21\
    \ to 7.23.\n\nA key difference between functions take and drop is that in the\
    \ case of drop, the input and output lists can share data in memory, but function\
    \ take needs to allocate a new list to store the elements being extracted (Figure\
    \ 7.3). Note also that, unlike drop,\n\n²This is especially true in Scala, which\
    \ uses the tempting syntax list(i) and array(i) to access the ith element of a\
    \ list or an array.\n\n³The only difference is that, given my choice of semantics,\
    \ drop(Nil, 1) is the empty list, while tail(Nil) would throw an exception."
