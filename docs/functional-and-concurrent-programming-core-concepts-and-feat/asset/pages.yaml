    \ a single argument, bound, which returns a function of type Int => Boolean, as\
    \ before; x is actually an argument of the function being returned.\n\nFunctions\
    \ written in this style are said to be curried.1 A curried function is a function\
    \ that consumes its first list of arguments, returns another function that uses\
    \ the next argument list, and so on. You can read the definition of greaterThan\
    \ as implementing a function that takes an integer argument bound and returns\
    \ another function, which takes an integer argument x and returns the Boolean\
    \ x > bound. In other words, the return value of greaterThan is the function that\
    \ maps x to x > bound.\n\nFunctional programming languages rely heavily on currying.\
    \ In particular, currying can be used as a device to implement all functions as\
    \ single-argument functions, as in\n\n> 1The concept is named after the logician\
    \ Haskell Curry, and the words curried and currying are sometimes capitalized."
