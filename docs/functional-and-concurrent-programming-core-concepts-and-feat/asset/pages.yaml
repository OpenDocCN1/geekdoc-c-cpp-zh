    \ registrations from taking place during an iteration over all the keys and values,\
    \ the map is locked exclusively, using wlock. By contrast, method register uses\
    \ rlock to allow multiple threads to call putIfAbsent concurrently, since the\
    \ method is thread-safe. Note how the lock is acquired in “write” mode to read\
    \ the map, and in “read” mode to write the map.\n\n# 23.2 Latches and Barriers\n\
    \nLatches are simple synchronizers, which were used in earlier examples for termination\
    \ detection (Listing 22.2) and to implement a thread-safe box (Listing 22.4).\
    \ Latches are versatile. They are often used to implement fork-join (scatter-gather)\
    \ patterns, such as in Listing 22.2 but also have other purposes. I often use\
    \ latches in writing tests of concurrent programs. For instance, a latch can represent\
    \ a simulated activity—the latch opens when the activity terminates. Another use\
    \ of latches in testing is to synchronize activities to maximize concurrent accesses\
    \ to a shared structure, and thus better assess its thread-safety.\n\nAs an illustration,\
    \ let’s revisit the test of a thread-safe list in Listing 21.2. As written, this\
    \ code suffers from the fact that N tasks begin to access the shared list in a\
    \ staggered manner: Task k might already be using the list while a thread is still\
    \ being started to run task k + 1 (starting a thread takes time). This reduces\
    \ the amount of actual concurrency applied to the list. You can add a latch to\
    \ make all tasks start accessing the list at about the same time, after all the\
    \ threads have been created and started:\n\n```\nval exec   = Executors.newCachedThreadPool()\n\
    val shared = SafeStringList()\nval start  = CountDownLatch(N + 1)\nval finish\
