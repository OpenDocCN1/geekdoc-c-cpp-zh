  md: 'Two threads are started by the main thread. Each thread increments a shared
    integer five times. The main thread waits for completion of all the increment
    operations and then prints the value of the shared integer.


    On its first run, the program’s output was


    ```

    main at XX:XX:19.251: 10

    ```


    In my experiment, the output was similar on the next run and, using a loop to
    repeat execution, in the next 3189 runs. The 3190th run, however, produced this
    output:


    ```

    main at XX:XX:26.180: 7

    ```


    The remaining 96,810 runs all produced the value 10. In other words, two threads
    performing five increments each increase the value of a shared integer by 10 most
    of the time, but not always.


    Looking at the bytecode² resulting from the compilation of shared += 1 can be
    informative:


    ```

    bytecode

    0: aload 1

    1: getfield      #92      // Field scala/runtime/IntRef.elem:I

    4: iconst_1

    5: iadd

    6: istore 2

    7: aload 1

    8: iload 2

    9: putfield      #92      // Field scala/runtime/IntRef.elem:I

    ```


    Field 92 corresponds to variable shared in Listing 18.1. The bytecode shows that
    the field is read from memory (getfield), incremented by one (iconst_1/iadd),
    and the new value stored in memory (putfield).


    When threads T1 and T2 execute this code concurrently, the scenario depicted in
    Figure 18.1 is possible. In this scenario, T2 reads the same value of shared read
    by T1 (say, 3), also increments it to 4 (as T1 did), and writes 4 back into shared.
    After both threads have completed their execution of shared += 1, the value has
    changed from 3 to 4, and an increment has been lost. Because of overlapping read/write
    sequences by separate threads during a run, you can end up with a final value
    of shared that is less than 10, like the value 7 observed in the 3190th run.


    This example illustrates that incrementing an integer variable is not an atomic
    operation. It is implemented using multiple instructions—at least reading, incrementing,
    and writing back—and those steps can end up being interleaved among multiple threads
    in arbitrary ways.


    ²Of course, the bytecode could be different with another compiler and is often
    recompiled into machine code by the JVM''s just-in-time compilers anyway. Nonetheless,
    looking at it helps emphasize the non-atomicity of an integer increment.'
