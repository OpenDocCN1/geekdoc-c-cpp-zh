    \ variants.\n\nFirst is the notion of ad hoc polymorphism, implemented by overloading\
    \ method or function names:\n\n```\ndef displayBook(book: Book)      = println(s\"\
    ${book.title} by ${book.author}\")\ndef displayMagazine(mag: Magazine) = println(s\"\
