- pgno: 482
  md: "You can also implement in Java the more complex transformation shown earlier,\
    \ from a list of lines into a list of Celsius temperatures. There is no standard\
    \ Java function to parse a string into an optional integer (or even into a nullable\
    \ integer), so you need to write one first:\n\n```\nOptional<Integer> parse(String\
    \ str) {\n    try {\n        return Optional.of(Integer.valueOf(str));\n    }\
    \ catch (NumberFormatException ex) {\n        return Optional.empty();\n    }\n\
    }\n```\n\nUsing this function, the code for the transformation is similar to what\
    \ it would be in Scala. The key difference is that an option needs to be converted\
    \ into a stream explicitly in the second call to flatMap (Scala uses an implicit\
    \ conversion there):\n\n```\nPattern SPACES = Pattern.compile(\"\\\\s+\");\nList<String>\
    \ strings = ...\n\nList<Integer> celsius = strings.stream()\n    .flatMap(str\
    \ -> Arrays.stream(SPACES.split(str)))\n    .flatMap(str -> parse(str).stream())\n\
    \    .map(temp -> round((temp - 32) / 1.8f))\n    .toList();\n```\n\nYou could\
    \ also write a variant that processes an array of strings String[] into an array\
    \ of integers int[] by using OptionalInt instead of Optional and IntStream instead\
    \ of Stream.\n\nWhen higher-order functions return functions, closures are created\
    \ in both Java and Kotlin. The memoization example of Listing 12.2 can be written\
    \ in either language:\n\n```\n<A, B> Function<A, B> memo(Function<A, B> f) {\n\
    \    Map<A, B> store = new HashMap<>();\n    return x -> store.computeIfAbsent(x,\
    \ f);\n}\n```\n\n```\nfun <A, B> memo(f: (A) -> B): (A) -> B {\n    val store\
    \ = mutableMapOf<A, B>()\n    return { x -> store.computeIfAbsent(x, f) }\n}\n\
    ```"
