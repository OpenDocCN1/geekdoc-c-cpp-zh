  md: "As an illustration, the three optional functions used in Section 10.3 can be\
    \ changed to represent asynchronous steps:\n\n```\ndef parseRequest(request: Request):\
    \ Future[User] = ...\ndef getAccount(user: User): Future[Account] = ...\ndef applyOperation(account:\
    \ Account, op: Operation): Future[Int] = ...\n```\n\nThe steps can then be chained\
    \ using flatMap:\n\n```\nparseRequest(request)\n  .flatMap(user => getAccount(user))\n\
    \  .flatMap(account => applyOperation(account, op))\n```\n\nListing 26.9: A pipeline\
    \ of futures using flatMap.\n\nThe expression in Listing 26.9 is exactly the same\
    \ as that in Listing 10.5, except that it produces a value of type Future[Int]\
    \ instead of Option[Int].\n\n# Uniform Treatment of Synchronous and Asynchronous\
    \ Computations\n\nYou could mix synchronous and asynchronous operations by combining\
    \ steps of type A => B—using map—and steps of type A => Future[B]—using flatMap.\
    \ Instead, it is often more convenient to use only steps of the form A => Future[B]\
    \ combined with flatMap. When needed, synchronous steps can be implemented as\
    \ already completed futures. This design increases flexibility: It makes it easier\
    \ to replace synchronous steps with asynchronous steps, and vice versa.\n\nFor\
    \ instance, if accounts are simply stored in a map, the getAccount function from\
    \ the earlier example can be implemented synchronously, within the calling thread:\n\
    \n```\nval allAccounts: Map[User, Account] = ...\ndef getAccount(user: User):\
    \ Future[Account] = Future.successful(allAccounts(user))\n```\n\nThis function\
    \ returns an already completed future and does not involve any additional thread.\
    \ If a need to fetch accounts asynchronously then arises, you can reimplement\
    \ the function without modifying its signature, and leave all the code that uses\
    \ it—such as Listing 26.9—unchanged.\n\n# Functional Handling of Failures\n\n\
    Exceptions are typically thrown and caught within a thread. They don’t naturally\
    \ travel from thread to thread, and they are ill suited for multithreaded programming.\
    \ Instead, you are better off following the functional approach to error handling\
    \ discussed in Chapter 13."
