- pgno: 478
  md: "The main difference with the Scala variant in Listing 6.7 is that Kotlin’s\
    \ when is more limited than pattern matching: You cannot use a pattern of the\
    \ form Node(...) to extract the left and right children of a node, as you would\
    \ in Java or Scala.\n\n# A.5 Higher-Order Functions\n\nYou can use functions as\
    \ values in both Java and Kotlin. Kotlin denotes with (A) -> B the type of functions\
    \ from inputs of type A to outputs of type B—that is, A => B in Scala. The story\
    \ is more complicated in Java: Function<T,R> represents functions from a type\
    \ T to a type R, but both T and R must refer to objects and cannot be primitive\
    \ types. A function that uses an object to produce a primitive int value, for\
    \ instance, has type ToIntFunction<T>, and a function that consumes an int to\
    \ create an object has type IntFunction<R>. Similarly, a function that produces\
    \ a bool value from an object has type Predicate<T>, while a function from int\
    \ to bool has type IntPredicate, and a function from int to int has type IntBinaryOperator.\
    \ Corresponding types are defined for the other primitive types.\n\nJava does\
    \ not have a Unit type like Scala and Kotlin but uses void methods instead. It\
    \ also needs to accommodate functions that take no arguments. So, a function that\
    \ consumes an object but does not return a value has type Consumer<T>, while a\
    \ no-argument function that returns an object has type Supplier<R>. Of course,\
    \ primitive types make it necessary to define types such as IntConsumer and LongSupplier.\
    \ Java also lacks a pair type and instead defines specific interfaces for two-argument\
    \ functions, such as BiFunction<T,U,R>, BiConsumer<T,U>, ObjIntConsumer<T>, and\
    \ IntBinaryOperator. In total, the java.util.function package defines 43 functional\
    \ interfaces.\n\nBoth Java and Kotlin have a lambda expression syntax for anonymous\
    \ functions. As an example, you can use either language to define a function negate\
    \ that negates a predicate:\n\n```\nJava\n<A> Predicate<A> negate(Predicate<A>\
    \ f) {\n    return x -> !f.test(x);\n}\n```\n\n```\nKotlin\nfun <A> negate(f:\
    \ (A) -> Boolean): (A) -> Boolean = { x -> !f(x) }\n```\n\nFunction negate takes\
    \ a predicate—a Boolean-valued function—as its argument and returns a predicate,\
    \ defined as a lambda expression. On function f, Kotlin’s invoke method is called\
    \ implicitly, while Java requires method test to be called explicitly. The body\
    \ of a lambda expression can be a simple expression, as in the preceding examples.\
    \ If the body is a full block of code, both languages require the use of a return\
    \ keyword."
