    # 2.3 Functions Defined as Methods


    As a programming language, Scala is said to be hybrid, or multi-paradigm, because
    it aims to combine concepts from object-oriented and functional programming. This
    makes it well suited for the purpose of this book but also slightly complicates
    the discussion of function definition.


    As a functional language, Scala offers various mechanisms to define functions.
    But, because it is also an object-oriented language, it uses the notion of methods
    as well. The same can be said of other hybrid languages, such as Kotlin. Technically,
    the Scala implementations of abs and dots in Section 2.2 are methods, not functions.
    Both functions and methods can be used as code structuring devices, but they are
    not always equivalent.


    There is no need to get sidetracked here by a lengthy discussion of the differences
    between functions and methods—I have heard that even the Scala language specification
    does not use these terms in a consistent way. As we delve more deeply into our
    exploration of functional programming, some differences will be discussed (see,
    in particular, Sections 2.5 and 9.4). For now, I loosely use “function” as a term
    for a programming language construct with input arguments and an output value,
    which includes Scala methods.


    # 2.4 Operators Defined as Methods


    Programming languages not only have functions (and methods) but also tend to use
    operators when building expressions. For instance, all five absolute value implementations
    use a binary operator “>” in the expression x > 0, and a unary operator “−” in
    the expression −x.'
