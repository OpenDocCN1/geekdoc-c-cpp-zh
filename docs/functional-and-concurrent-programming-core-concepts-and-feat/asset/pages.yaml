  md: "Java and Kotlin offer bridges between methods and functions via method references.\
    \ Kotlin also defines a shorter form for anonymous functions, where x -> f(x)\
    \ is replaced with f(it), similar to Scala’s use of “_” for partial application:\n\
    \n```\nKotlin\nfun pos(x: Int): Boolean = x > 0\n\nval neg: (Int) -> Boolean =\
    \ negate { x -> pos(x) }\nval neg: (Int) -> Boolean = negate { pos(it) }\nval\
    \ neg: (Int) -> Boolean = negate(::pos)\n```\n\nIf pos were a method of an object\
    \ ref, you would replace ::pos with ref::pos in the last expression. In Java,\
    \ methods are always defined within a class, so the “::” operator used for method\
    \ reference always has a left-hand-side argument:\n\n```\nJava\nclass Math {\n\
    \    public boolean pos(int x) {\n        return x > 0;\n    }\n}\nMath m = new\
    \ Math();\n\nPredicate<Integer> neg = negate(x -> m.pos(x));\nPredicate<Integer>\
    \ neg = negate(m::pos);\n```\n\nIn the other direction, lambda expressions can\
    \ be used to implement methods. In Java, like in Scala, lambda expressions can\
    \ implement SAM interfaces directly:\n\n```\nScala\nval byLength: Comparator[String]\
    \ = (a, b) => a.length.compareTo(b.length)\n```\n\n```\nJava\nComparator<String>\
    \ byLength = (a, b) -> Integer.compare(a.length(), b.length());\n```\n\nBy contrast,\
    \ in Kotlin, you often need to mention an interface’s name explicitly for a lambda\
    \ expression to implement it:\n\n```\nKotlin\n// rejected by the compiler:\nval\
    \ byLength: Comparator<String> = { a, b -> a.length.compareTo(b.length) }\n\n\
    val byLength = Comparator<String> { a, b -> a.length.compareTo(b.length) } //\
    \ OK\n```"
