  md: '# Glossary


    *action* An impure subroutine that relies on **side effects** to modify the state
    of an application but does not return a (meaningful) value; sometimes also called
    a procedure. See also **pure**. Discussed in Chapter 3.


    *algebraic data type* A **type** that combines existing types through a combination
    of alternatives (sum) and aggregation (product). Many standard types, including
    **tuples**, **options**, **lists**, and **trees**, can be defined as algebraic
    data types. Discussed in Chapter 5.


    *anonymous function* See **function literal**.


    *argument* An input to a **function** or **method**, such as a **value** or a
    **type**. Also called *parameter*.


    *asynchronous, asynchronously* The opposite of **synchronous**, **synchronously**.


    *callback* 1. A piece of code registered for (single, multiple, or optional) execution.
    Callbacks may run **synchronously** (as in Chapter 9) or **asynchronously** (as
    in Chapter 26). 2. The action of running such code.


    *CAS* Compare-and-set.


    *class* In object-oriented programming, a template for the creation of **objects**.


    *concurrent* Said of multiple code executions that happen at the same time (“concurrently”).
    In this book, synonymous with *parallel*. Discussed in Chapter 16.


    *curried, currying* A curried **function** consumes its first **argument** (or
    argument list) and returns another function that will use the remaining arguments
    (or argument lists). By currying, a function that uses a list of multiple arguments
    can be transformed into a function that uses multiple lists of fewer arguments.
    See also **higher-order**. Discussed in Section 9.2.


    *deadlock* A situation is which several entities perpetually wait for each other
    in a cycle due to faulty **synchronization**. Discussed in Sections 22.3 and 27.7.


    *exception* A disruption in the flow of program execution, typically caused by
    a failure and possibly handled by an exception handler. Exceptions are said to
    be thrown (or raised) and caught (or handled). Uncaught exceptions can cause a
    **thread** to terminate its execution.


    *execution stack* A **stack** that keeps track of the current nesting of subroutines
    executed by a **thread**: Entering a subroutine adds to the stack, exiting it
    removes from the stack. Also called *call stack*.'
