  md: "```\ndef hanoi[A](n: Int, from: A, mid: A, to: A): LazyList[(A, A)] =\n  if\
    \ n == 0 then LazyList.empty\n  else hanoi(n - 1, from, to, mid) #::: (from, to)\
    \ #:: hanoi(n - 1, mid, from, to)\n```\n\nListing 12.7: Tower of Hanoi moves as\
    \ a stream.\n\nThis function looks almost the same, but it does not compute any\
    \ actual move. It returns a stream, and moves will be created on demand when the\
    \ stream is queried:\n\n```\nval allMoves    = hanoi(100, 'L', 'M', 'R')\nval\
    \ oneMove     = allMoves(999) // ('M', 'L')\nval anotherMove = allMoves(49)  //\
    \ ('L', 'R')\n```\n\nNote that allMoves is a stream of 2^100 − 1 elements, a number\
    \ on the order of 10^30. Obviously, such a collection would not fit in memory\
    \ with a list-based implementation. The computation of oneMove triggers the evaluation\
    \ of the first 1000 elements of the stream. The evaluation of anotherMove does\
    \ not involve any additional calculation: The 50th move, already in the stream,\
    \ is retrieved.\n\n# 12.6 Streams as Pipelines\n\nBecause they are lazily evaluated,\
    \ streams are a great structure for pipelined transformations. Consider, for instance,\
    \ the problem of searching a file for long words. Function longWords(lines, min)\
    \ takes in a list of lines and a minimum word length. It proceeds by splitting\
    \ the lines into words, removing characters that are not letters, and selecting\
    \ all the words with a length at least equal to the specified minimum. You can\
    \ do this functionally with the following code:\n\n```\ndef clean(str: String):\
    \ String = str.filter(_.isLetter) // remove non-letters\n\ndef longWords(lines:\
    \ List[String], min: Int): List[String] =\n  lines\n  .flatMap(_.split(' '))\n\
    \  .map(clean)\n  .filter(_.length >= min)\n```\n\nSince the function's first\
    \ argument is a list of lines, and each line is a list of words, flatMap is used\
    \ to avoid nested lists. Words are then cleaned, and only the long words are included\
    \ in the final result.\n\nThis code produces the desired output, but suffers from\
    \ a minor inefficiency: Each stage of the computation produces a list—first a\
    \ list of words, then a list of clean words,"
  merge: -1
