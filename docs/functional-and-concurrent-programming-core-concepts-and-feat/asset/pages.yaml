- pgno: 366
  md: "# # Chapter 22 Synchronization\n\n```\n```scala\ndef set(value: A): Boolean\
    \ = synchronized {\n if contents.nonEmpty then false\n else\n  filled.countDown()\n\
    \  contents = Some(value)\n true\n}\n```\n```\n\nThis variant opens the latch\
    \ before variable contents is set, while the box is still empty. It might seem\
    \ like a mistake, but thanks to locking, this latch opening is harmless: A thread\
    \ inside get might go through the latch at this point, but it will still be blocked\
    \ by the lock until the box contents are actually set. If you want to access the\
    \ latch outside the locked section, as in get, you can write the set method slightly\
    \ differently:\n\n```\n```scala\ndef set(value: A): Boolean = {\n  val setter\
    \ = synchronized {\n    if contents.nonEmpty then false\n    else\n      contents\
    \ = Some(value)\n    true\n  }\n  if setter then filled.countDown()\n  setter\n\
    }\n```\n```\n\nIn this variant, you first lock the box to check that it is still\
    \ empty. If so, the box contents are set, and setter is true. You can then release\
    \ the lock before opening the latch. Releasing the lock is harmless: It simply\
    \ lets another thread call set and find the box already filled.\n\n\n\nProgramming\
    \ with synchronizers is error-prone, and deadlocks are a common problem. Deadlocks\
    \ can be devastating—threads hang and the system halts—but they are not the worst\
    \ kind of concurrency bug. What makes deadlocks somewhat easier to investigate\
    \ compared to other situations is the fact that the threads involved in a waiting\
    \ cycle are not running, and you can examine them at your leisure."
