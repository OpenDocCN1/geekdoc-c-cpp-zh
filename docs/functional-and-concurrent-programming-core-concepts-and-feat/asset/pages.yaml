    A thread that calls execute with a task typically does not run the task but only
    submits it for execution. Method execute returns immediately, and the task is
    executed later, asynchronously. The task is actually run when one of the available
    workers grabs it and starts its execution. If all the workers are busy, the task
    might be queued or rejected, depending on the thread pool configuration.


    Method execute does not return anything useful—it is a void method in Java. Using
    it leads to a “fire-and-forget” programming style: Submit a task and let in run.
    You can also use thread pools in more controlled ways by creating handles on running
    tasks, known as futures. Futures are discussed in Chapter 25.


    In the preceding run, notice that the main thread terminates before all the tasks
    are finished. Earlier examples relied on the thread method join to force the main
    thread to wait for the other threads to be done before terminating. When using
    thread pools, you can achieve a similar behavior by waiting for all the worker
    threads to be done:


    ```

    ...

    exec.shutdown()

    exec.awaitTermination(5, MINUTES)


    println("END")

    ```


    Method shutdown is used to indicate to the pool that no new task will be submitted
    (it disables method execute). Once a pool is shut down, you can wait for its termination.'
