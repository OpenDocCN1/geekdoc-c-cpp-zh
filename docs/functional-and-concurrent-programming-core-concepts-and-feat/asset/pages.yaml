- pgno: 322
  md: '+   - These failures are the result of an unpredictable interleaving of instructions
    in the executing code. Even conceptually simple operations, such as an integer
    increment, are implemented in terms of several smaller instructions. To prevent
    undesirable interleaving, a group of instructions can be made atomic. When an
    atomic operation is executed by a thread, either all of its effects or none at
    all are visible to other threads.

    +   - Different data types offer different atomicity commitments. Writing an `Int`,
    incrementing an `AtomicInteger`, and calling `putIfAbsent` on a `ConcurrentHashMap`,
    for instance, are all guaranteed to be atomic in the presence of multiple threads.
    However, compound actions that use atomic operations may still involve unpredictable
    interleaving of elementary steps—incrementing an `Int`, incrementing an `AtomicInteger`
    only if less than a bound, and adding multiple key–value pairs to a `ConcurrentHashMap`
    are not atomic operations.

    +   - The most common way to create atomic units of code is by locking. Exclusive
    locks, which are available to only one thread at a time, can be used to guarantee
    that blocks of code are mutually exclusive. Threads that need to execute code
    guarded by a lock need to acquire the lock first and may be blocked waiting for
    it to become available before they can proceed.

    +   - Inside the JVM, any object can be used as an exclusive lock. These intrinsic
    locks are available at the language level, either as a function (Scala, Kotlin,
    Clojure), an annotation (Groovy), or a keyword (Java). Intrinsic locks are reentrant:
    A thread that owns a lock is not blocked when trying to acquire it again.

    +   - Locked sections of code must be chosen carefully to ensure enough atomicity,
    as necessary for correctness, while not overly limiting parallelism. Large locked
    sections of code result in big atomic operations, which are easier to reason about,
    but concurrency is reduced because each locked section is executed sequentially.

    +   - Locking targets—the locks themselves—must also be selected wisely. Code
    sections guarded by different locks can be executed in parallel, which may or
    may not be desirable depending on the details of an application. On the one hand,
    the same lock used for multiple purposes can prevent threads from making progress
    on independent tasks and can create a synchronization bottleneck. On the other
    hand, threads that synchronize on different locks can still interfere with each
    other when accessing shared data, with potentially undesirable outcomes.'
