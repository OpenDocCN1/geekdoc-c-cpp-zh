    Of particular interest is the fact that the three letters are printed in CAB order
    in the first run, but in ABC and BAC order in the next two. This is an illustration
    of the nondeterminism of multithreaded programs.


    When the start method is called on a Thread object, the runtime needs to create
    an actual thread—often a lightweight process managed by the OS—and schedule it
    for execution. How the runtime schedules threads is not under a programmer’s control.
    A scheduler allocates runtime quorums to threads in ways that are unknown at the
    level of an application. When I ran the demo program, my computer reported 2985
    active threads—most of them outside the JVM—sharing eight processor cores. All
    the running threads are constantly swapped in and out of execution at times you
    don’t know and can’t choose. As a consequence, you cannot know exactly when your
    threads execute their instructions and for how long before they are suspended
    by the OS to let other threads run. The exact order in which the letters are printed
    by the example program is unpredictable and typically varies from run to run.


    Notice also that in the last two runs, the main thread terminates before the printing
    is complete. After the main thread invokes start on another thread, it continues
    its own run, and the runnable target is executed later, inside a separate thread.
    Because there are other active threads, the JVM keeps running after the main thread
    is finished. It stops only after all the threads are terminated.³


    # 17.4 Thread Termination


    Once started, a thread keeps running until the end of the run method specified
    in its runnable task. For a thread to terminate, the run method must be completed,
    either normally or abruptly through an exception. There is no way to forcibly
    terminate a thread from another thread. Instead, you need to signal a thread that
    it should end its run, giving it a chance to clean up resources and shared data
    before terminating. Keep in mind, however, that a thread that chooses to ignore
    such signals will keep running, possibly preventing termination of the JVM.


    ³Java also has a notion of daemon threads that do not prevent JVM termination,
    but they are seldom used.'
