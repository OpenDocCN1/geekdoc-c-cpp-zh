  md: "As an example, the current Scala compiler focuses on *tail recursive functions*—functions\
    \ with a single recursive call, in tail position. It does not optimize other tail\
    \ calls, including those inside mutually recursive functions. Furthermore, because\
    \ functions are implemented as methods, and methods can be overridden, code that\
    \ appears to be tail recursive may not be optimized. You can use a `tailrec` annotation\
    \ to confirm that the optimization is indeed taking place: A function annotated\
    \ with `tailrec` is guaranteed to be optimized by the compiler, or compilation\
    \ will fail.\n\n# Aside on Optimized Bytecode for Tail Recursive Functions\n\n\
    As an experiment, consider the small class shown here, with a single recursive\
    \ method:\n\n```\nclass TailRecursionTest:\n  def zero(x: Int): 0 = if x == 0\
    \ then 0 else zero(x - 1)\n```\n\nThe useless method always returns zero (hence\
    \ its name and return type). The bytecode generated for it by the Scala compiler\
    \ looks something like this:\n\n```\npublic int zero(int);\nCode:\n  0: iload\
    \ 1\n  1: iconst_0\n  2: if_icmpne 9\n  5: iconst_0\n  6: goto 16\n  9: aload\
    \ 0\n 10: iload 1\n 11: iconst_1\n 12: isub\n 13: invokevirtual #16    // Method\
    \ zero:(I)I\n 16: ireturn\n```\n\nThe details are unimportant. Line 2 is a comparison\
    \ of variable x with 0. If x is non-zero, execution jumps to line 9. Lines 9–12\
    \ calculate x − 1, and line 13 invokes method zero again, on x − 1. No optimization\
    \ is taking place. If the method is annotated with tailrec, compilation will fail.\n\
    \nWhat prevents the compiler from optimizing is the fact that method zero could\
    \ be overridden in a class that extends TailRecursionTest. If overriding is"
