- pgno: 212
  md: "You can invoke this info method just as easily as the previous one by using\
    \ a lambda expression for the function argument. The preceding expression does\
    \ not perform a hostname lookup. A lookup will happen only within the logger and\
    \ only if logging has been set to a level that includes INFO messages.\n\nYou\
    \ can define your own methods that use function arguments to replace explicit\
    \ values that may not be needed. For instance, the Java Properties class defines\
    \ a method for property lookup with a second argument that specifies a default\
    \ value if a key is not found:\n\n```\nval properties: Properties = System.getProperties\n\
    \nproperties.getProperty(\"hostname\", \"unknown\")\n```\n\nThis is sufficient\
    \ when the default value is a constant, like \"unknown\". However, if calculating\
    \ the default value is expensive, this computation is wasted if a property key\
    \ is already associated with a value. There is no getProperty method that takes\
    \ a function as its second argument. However, you can easily add one as as an\
    \ extension by relying on a single-argument getProperty method that returns null\
    \ when a key is not found:\n\n```\nextension (properties: Properties)\n  def getProperty(key:\
    \ String, fallback: () => String): String =\n    val prop = properties.getProperty(key)\n\
    \    if prop ne null then prop else fallback()\n```\n\nThe default value is specified\
    \ as a fallback function, which is invoked only if the property is not found.\
