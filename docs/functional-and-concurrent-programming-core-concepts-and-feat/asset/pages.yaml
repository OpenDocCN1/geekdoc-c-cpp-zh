- pgno: 483
  md: "In Kotlin, closures can write the captured data, as they do in Scala:\n\n```\n\
    fun <A, B> single(f: (A) -> B): (A) -> B {\n    var called = false\n    return\
    \ { x ->\n        if (called) throw IllegalStateException()\n        called =\
    \ true\n        f(x)\n    }\n}\n```\n\nThis example creates a variant of a function\
    \ f that can be invoked only once before it throws an exception—for instance,\
    \ for the purpose of testing. This requires writing the Boolean variable called\
    \ from the closure. By contrast, Java does not allow closures to reassign variables.\
    \ This code is rejected by the compiler:\n\n```\n<A, B> Function<A, B> single(Function<A,\
    \ B> f) {\n    var called = false;\n    return x -> {\n        if (called) throw\
    \ new IllegalStateException();\n        called = true; // rejected at compile\
    \ time\n        return f.apply(x);\n    };\n}\n```\n\nInstead, you can replace\
    \ the lambda expression with an anonymous class that defines a reassignable Boolean\
    \ field:\n\n```\n<A, B> Function<A, B> single(Function<A, B> f) {\n    return\
    \ new Function<>() {\n        private boolean called = false;\n\n        public\
    \ B apply(A x) {\n            if (called) throw new IllegalStateException();\n\
    \            called = true;\n            return f.apply(x);\n        }\n    };\n\
    }\n```\n\nThe argument f is still captured in a closure, but it is only read and\
    \ not reassigned."
