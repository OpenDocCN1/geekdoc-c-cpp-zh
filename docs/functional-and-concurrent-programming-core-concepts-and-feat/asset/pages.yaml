  md: '# 22.6 Summary


    +   - When parallel tasks are not fully independent, threads need to coordinate
    with other threads. A common need is for a thread to pause its computation and
    wait until other threads have made the state of a system suitable to continue.

    +   - When facing this problem, two courses of actions are as tempting as they
    are unsuitable in general. No matter how careful you are in the selection of a
    sleeping time value, there is no correct choice when the activities of other threads
    have unpredictable duration. Too short, and the state of an application may not
    be ready by the time a thread resumes after sleeping. Too long, and time is wasted
    sleeping while a thread could make progress instead, thus hurting an application’s
    performance and responsiveness.

    +   - The other misguided strategy is for a thread constantly to poll the state
    of the system until it is suitable for that thread to continue, a programming
    style known as spinning or busy-waiting. This approach is wasteful in several
    ways and does not scale with large numbers of threads and/or lengthy activities.
    First, polling threads continually use computing resources and need to be repeatedly
    be scheduled for execution, thus using CPU time away from the threads they are
    waiting on. Second, repeatedly querying the state of an application while other
    threads are updating it necessitates thread-safe mechanisms—such as locks—which
    tend to be costly when used frequently, as in a continuously checking loop.

    +   - Instead of sleeping and busy-waiting, concurrent programs should rely on
    proper synchronization. Synchronizers are designed to block threads efficiently
    (no busy-waiting) until other threads establish a desired condition (no guessing
    of a suitable sleeping duration). In shared memory systems, synchronizers maintain
    a state and offer methods to block one or more threads until other threads set
    the synchronizer to the required state.

    +   - The best known synchronizer is the exclusive lock, which blocks acquiring
    threads until the lock is freed by another thread and becomes available. Concurrency
    libraries typically implement many other types of synchronizers, some of which
    are discussed in Chapter 23.

    +   - Using synchronizers is error-prone. Threads can be made to wait indefinitely
    for conditions that will never be established, possibly causing an entire application
    to halt. Deadlocks are a common cause of indefinite waiting. They are the result
    of threads waiting for each other in a cyclical way. Invoking blocking methods
    on synchronizers while holding locks is a sure way to cause a deadlock.'
