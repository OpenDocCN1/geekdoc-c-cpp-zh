  md: "# 5.3 Options\n\nTuples aggregate values but offer no choice: A pair is always\
    \ made of two values. Other types are defined to take one of multiple forms as\
    \ alternatives. Options are a simple and widely used type with two alternatives:\
    \ An option can contain a value or it can be empty. Consider the following example:\n\
    \n```\nval someNum: Option[Int] = Some(42)\nval noNum: Option[Int] = None\n```\n\
    \nA value of type Option[Int]² represents either a single integer or nothing.\
    \ You can use it as the return type of a function that is not guaranteed to produce\
    \ a result, such as a search that may or may not find what it is looking for.\
    \ Returning options is much preferable to using null for this purpose, a topic\
    \ we will explore in Chapter 13.\n\nYou can use pattern matching on options:\n\
    \n```\noptNum match\n  case Some(x) => if x > 0 then x else 0\n  case None =>\
    \ 0\n```\n\nListing 5.5: Example of pattern matching to both switch and extract.\n\
    \nIn this example, optNum is an optional number, of type Option[Int]. If it contains\
    \ a positive number, Listing 5.5 produces that number. Otherwise—if the option\
    \ is empty or the number is not positive—it produces zero. In this example, pattern\
    \ matching is powerful because it serves two purposes: It lets you decide whether\
    \ an option is empty, and it is used to extract the value out of a non-empty option.\
    \ You could achieve the same computation using a pattern with a condition:\n\n\
    ```\noptNum match\n  case Some(x) if x > 0 => x\n  case _ => 0\n```\n\nThe underscore\
    \ pattern handles any value that did not match the first pattern, in this case\
    \ an option with a non-positive number or an empty option. Note that you can flip\
    \ the patterns in the first variant, but not the second:"
