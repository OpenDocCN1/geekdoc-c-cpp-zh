  md: "Deadlocks are a rather common situation in which threads end up waiting for\
    \ a condition that is never established. In a deadlock, multiple threads wait\
    \ for each other in a cycle. As an illustration, consider the following implementation\
    \ of a thread-safe box:\n\n```\nScala\nclass SafeBox[A]:\n  private var contents\
    \ = Option.empty[A]\n  private val filled   = CountDownLatch(1)\n\n  // DON'T\
    \ DO THIS!\n  def get: A = synchronized {\n    filled.await()\n    contents.get\n\
    \  }\n\n  def set(value: A): Boolean = synchronized {\n    if contents.nonEmpty\
    \ then false\n    else\n      contents = Some(value)\n      filled.countDown()\n\
    \      true\n  }\n```\n\nListing 22.3: Deadlock-prone implementation of a box;\
    \ fixed in Lis. 22.4.\n\nA box is created empty, and can be filled only once,\
    \ using method set. Further attempts to invoke set simply return false. A latch\
    \ is open when the box is filled. Threads that need access to the contents of\
    \ a box are blocked on this latch until set is called. A box is designed so that\
    \ set and get can be called by different threads concurrently. All accesses to\
    \ variable contents go through a lock, the box itself.³\n\nThis all sounds very\
    \ reasonable, but the implementation of get is incorrect. It starts by locking\
    \ the box. Then, if the box is still empty, the calling thread is blocked on the\
    \ latch. This thread, however, still owns the lock on the box, making it impossible\
    \ for any other thread to run set to fill the box. This is a deadlock situation,\
    \ as shown in Figure 22.1. Thread T1 owns the lock on the box and waits for T2\
    \ to fill the box. Thread T2 waits for T1 to release the lock so T2 can set the\
    \ contents of the box. The two threads are waiting for each other, permanently.\n\
    \n³Such a box is typically made available in concurrency libraries as a future\
    \ or a promise and does not need to be reimplemented. Futures and promises are\
    \ discussed in Chapter 25."
