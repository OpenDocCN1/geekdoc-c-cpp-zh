  md: "```\nvar n = 3\nrepeat {\n  println(\"Beetlejuice!\")\n  n -= 1\n} until (n\
    \ == 0)\n```\n\nIn this example, println(\"Beetlejuice!\"); n -= 1 is passed (unevaluated)\
    \ to the function repeat, then to the constructor of class Repeat. Finally, method\
    \ until is invoked on the resulting object, with the (unevaluated) argument n\
    \ == 0.\n\n# 12.4 Internal Domain-Specific Languages\n\nAs the earlier examples\
    \ show, clever use of by-name arguments can produce abstractions that look very\
    \ much like programming language constructs. You can apply this technique to define\
    \ domain-specific languages (DSL), which are small languages, often used for modeling\
    \ or architecting in a specific domain. Instead of being implemented as a stand-alone\
    \ language, an internal DSL is embedded into a general-purpose programming language\
    \ like Scala. For instance, the testing framework Scalatest defines a DSL for\
    \ writing unit tests:\n\n```\nclass ExampleSpec extends AnyFlatSpec with should.Matchers:\n\
    \n  \"A Stack\" should \"pop values in last-in-first-out order\" in {\n    val\
    \ stack = Stack[Int]()\n    stack.push(1)\n    stack.push(2)\n    stack.pop()\
    \ should be (2)\n    stack.pop() should be (1)\n  }\n\n  it should \"throw NoSuchElementException\
    \ if an empty stack is popped\" in {\n    val emptyStack = Stack[Int]()\n    a\
    \ [NoSuchElementException] should be thrownBy {\n      emptyStack.pop()\n    }\n\
    \  }\n```\n\nMethods and objects are carefully named it, should, in, a, be, and\
    \ thrownBy so that testing code flows naturally, and suitable error messages are\
    \ produced when a test fails."
