  md: "A Java virtual machine (JVM) can usually provide information on its threads,\
    \ typically in the form of a thread dump. How you trigger a thread dump depends\
    \ on the JVM—the HotSpot JVM used in this book reacts to a SIGQUIT signal—and\
    \ the exact format of the output may vary.\n\nAs an illustration, you can cause\
    \ the incorrect box implementation from Listing 22.3 to deadlock by using the\
    \ following two-thread program:\n\n```\nval exec = Executors.newCachedThreadPool()\n\
    val box  = SafeBox[Int]()\nexec.execute(() => box.set(0))\nprintln(box.get)\n\
    ```\n\nA secondary thread attempts to set a box with zero while the main thread\
    \ invokes get. On some runs, this program terminates properly. On others, it gets\
    \ stuck. A thread dump reveals the following information (slightly edited for\
    \ clarity):\n\n```\n\"pool-1-thread-1\" #15 prio=5 os_prio=31 cpu=3.79ms elapsed=121.29s\n\
    \  java.lang.Thread.State: BLOCKED (on object monitor)\n    at chap22.Box1$SafeBox.set\n\
    \  - waiting to lock <0x000000061f1f6a68> (a chap22.Box1$SafeBox)\n\n\"main\"\
    \ #1 prio=5 os_prio=31 cpu=223.28ms elapsed=121.51s\n  java.lang.Thread.State:\
    \ WAITING (parking)\n    at jdk.internal.misc.Unsafe.park\n  - parking to wait\
    \ for <0x000000061f99e8>\n    (a java.util.concurrent.CountDownLatch$Sync)\n \
    \ at java.util.concurrent.locks.LockSupport.park\n  at java.util.concurrent.locks.AbstractQueuedSynchronizer.acquire\n\
    \  at java.util.concurrent.CountDownLatch.await\n  at chap22.Box1$SafeBox.get\n\
    \    - locked <0x000000061f1f6a68> (a chap22.Box1$SafeBox)\n```\n\n(The dump includes\
    \ many more threads not displayed here. These are internal to the JVM and are\
    \ used for just-in-time compilation, garbage collection, and other operations.)\n\
    \nThe output shows that the two threads of interest are not running. The worker\
    \ thread from the pool, pool-1-thread-1, is blocked on an object monitor—JVM's\
    \ terminology for its intrinsic locks—at the beginning of method set. It is trying\
    \ to lock object 0x000000061f1f6a68, an instance of SafeBox. Meanwhile, the main\
    \ thread is blocked on method await from CountDownLatch. (All the synchronizers\
    \ in java.util.concurrent are implemented in terms of an AbstractQueuedSynchronizer\
    \ class and use a low-level operation park to suspend threads.) You can see on\
    \ the last line that the main thread owns the lock on the same SafeBox instance\
    \ that the worker thread is waiting for, object 0x000000061f1f6a68. The deadlock\
    \ state is exactly that shown in Figure 22.1 (main is T1 and pool-1-thread-1 is\
    \ T2)."
