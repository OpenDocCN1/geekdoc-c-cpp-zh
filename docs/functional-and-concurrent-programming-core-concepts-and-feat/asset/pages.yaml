    | fn temp: int => temp > 90 | // ML |

    | fn temp -> temp > 90 end | // Elixir |

    | function (temp) { return temp > 90 } | // JavaScript |

    | temp => temp > 90 | // also JavaScript |

    | lambda { |temp| temp > 90 } | // Ruby |

    | -> temp { temp > 90 } | // also Ruby |

    | (lambda (temp) (> temp 90)) | // Lisp |

    | (fn [temp] (> temp 90)) | // Clojure |

    | lambda temp: temp > 90 | // Python |


    The argument (or arguments) of a lambda expression can be composite types. For
    example, assume you have a list of pairs (date, temperature), and you need to
    find a temperature greater than 90 in January, February, or March. You can use
    find with a lambda expression on pairs:


    ```

    Scala

    val datedTemps: List[(LocalDate, Int)] = ...

    datedTemps.find(dt => dt(0).getMonthValue <= 3 && dt(1) > 90)

    ```


    The test checks that the first element of a pair (a date) is in the first three
    months of the year, and that the second element of the pair (a temperature) is
    greater than 90.


    Languages that support pattern matching often let you use it within a lambda expression.
    In the preceding example, you can use pattern matching to extract the date and
    temperature from a pair, instead of dt(0) and dt(1):


    ```

    Scala

    datedTemps.find((date, temp) => date.getMonthValue <= 3 && temp > 90)

    ```


    This is a lot more readable than the variant that uses dt(0) and dt(1).


    More complex patterns can be used. In Scala, a series of case patterns, enclosed
    in curly braces, also define an anonymous function. For instance, if a list contains
    temperatures with an optional date, and temperatures without a date are not eligible,
    you can search for a temperature greater than 90 in the first three months with
