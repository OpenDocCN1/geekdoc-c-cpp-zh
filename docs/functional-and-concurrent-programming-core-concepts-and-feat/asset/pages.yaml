- pgno: 207
  md: "```\ndef cd(name: String, names: String*): Dir = cdPath(name :: names.toList)\n\
    \n// inside class File\ndef cdPath(path: List[String]): Dir =\n    throw FileSystemException(name,\
    \ \"cannot change: not a directory\")\n```\n\nAs was done earlier with mkFile,\
    \ mkDir, and rm, method cd is implemented in terms of a helper method cdPath that\
    \ traverses a list of directories, specified by name. If the list of names is\
    \ empty, return the current directory. Otherwise, use find to find a subdirectory\
    \ with the specified name, if any. Using getOrElse, extract the directory from\
    \ the resulting option or throw an exception if the option is empty. The remainder\
    \ of the path is then applied to the subdirectory, recursively. If, at any point,\
    \ the path encounters a file instead of a directory, an exception is thrown.\n\
    \n# 11.7 Tree Zipper\n\nMethod cd can be used to go down a tree. How about going\
    \ back up? It is crucial to realize that the problem is not to somehow keep references\
    \ to enclosing trees as they are traversed. The reason is that trees are immutable,\
    \ and adding or removing files or subdirectories produces a new tree. After such\
    \ a modification, going back to a tree that contains a subtree as it was before\
    \ the modifications does not make sense. What you need to implement are methods\
    \ up and down so that the following code produces the same file system as the\
    \ one in Figure 11.1:\n\n```\nScala -\nDir(\"Root\").nav\n.mkDir(\"Dir2\")\n.down(\"\
    Dir2\")\n.mkFile(\"File3\")\n.up\n.mkDir(\"Dir1\")\n.down(\"Dir1\")\n.mkDir(\"\
    Dir3\")\n.mkFile(\"File2\")\n.up\n.mkFile(\"File1\")\n.dir\n```\n\nNotice that\
    \ the first call to method up, for instance, cannot simply go back to the tree\
    \ on which down(\"Dir2\") was invoked, because this tree does not contain File3.\
    \ In other words, up does not necessarily bring you back to a previous tree, but\
    \ also needs, in some cases, to create a new tree."
  merge: -1
  img_proc: true
- pgno: 208
  md: 'A viable approach is to modify the tree type into a zipper. Section 5.6 implemented
    a zipper to navigate lists leftward and rightward. The same idea can be used to
    move up and down a tree.⁹ Zippers are immutable. A tree zipper combines a subtree
    with the sequence of steps that led to that subtree. Those steps can be reapplied,
    in reverse order, to go up. In contrast to returning to an existing tree, applying
    a step builds a new tree, which contains updated subtrees that reflect modifications
    to the file system. In the preceding code, the call to nav changes the type of
    the file system from a tree to a tree zipper, which implements navigation via
    its up and down methods. The final call to dir brings you back to a regular tree.


    To go down a subdirectory, you create a step that contains the name of the parent
    directory, as well as a list of all the other nodes in that directory. For instance,
    going down into Dir1 in the file system from Figure 11.1 returns the subtree rooted
    at Dir1 but also creates a step that contains the name Root and a list of subtrees
    other than Dir1:


    ![](img/74309e2bdd93f68d2e94338a3d73517f_208_0.png)


    You can see that from the subtree (labeled 3), the step name (labeled 1), and
    the step trees (labeled 2a and 2b), the previous tree can be reconstructed to
    go up. If the subtree has been changed—that is, replaced with a different tree—going
    up by reassembling will produce a different tree (same 1 and 2 parts, but a different
    subtree 3).


    The zipper is implemented in a class DirNav:


    ```

    Scala

    final class DirNav (val dir: Dir, steps: List[(String, List[Node])]):

    ...

    ```


    A zipper consists of a current directory (dir) and a list of down steps that led
    to it (steps). Each step is a pair that contains the name of the parent node as
    a String, and a list of the siblings of the current directory, of type List[Node].
    The list of steps is empty when the current directory is the root of the file
    system.


    The zipper implements two methods up and down. To move down to a subdirectory,
    method down produces the same subdirectory as the earlier cd method, but adds
    a step to the list of steps so the downward move can be reversed by method up
    to go back up:


    ⁹This section considers only up and down movements. A more complex zipper can
    be written to move left and right among siblings.'
  merge: -1
  img_proc: true
- pgno: 209
  md: "# 11.7 Tree Zipper\n\n```\n```scala\n// inside class DirNav\ndef down(dirname:\
    \ String): DirNav =\n    dir.removeByName(dirname) match\n    case None =>\n \
    \       throw FileSystemException(dirname, \"cannot change: no such directory\"\
    )\n    case Some(file: File, _) =>\n        throw FileSystemException(dirname,\
    \ \"cannot change: not a directory\")\n    case Some(subdir: Dir, otherNodes)\
    \ =>\n        DirNav(subdir, (dir.name, otherNodes) :: steps)\n\ndef up: DirNav\
    \ = steps match\n    case Nil => this\n    case (name, nodes) :: more => DirNav(Dir(name,\
    \ dir :: nodes), more)\n```\n```\n\n# Listing 11.8: Navigation methods in a tree\
    \ zipper (1).\n\nTo go down, search the target subdirectory by name and remove\
    \ it from the list of nodes. If it is not found, or if a file is found by that\
    \ name instead, throw an exception. Otherwise, if the subdirectory exists (subdirir),\
    \ create a zipper with it by adding a new step. This step contains the name of\
    \ the parent directory (dir.name) and all the siblings of subdir (otherNodes).\
    \ The new step is added at the front of the list of steps, which is used like\
    \ a stack. To go back up, method up pops the first step from the stack and uses\
    \ its name and list of nodes to construct a new tree Dir(name, dir :: nodes),\
    \ which is wrapped in a zipper with the remaining steps.\n\nFor convenience, you\
    \ can also implement a method to go down multiple times and a method to go back\
    \ to the root of the tree:\n\n```\n```scala\n// inside class DirNav\ndef down(dirname1:\
    \ String, dirname2: String, dirnames: String*): DirNav =\n    (dirname1 :: dirname2\
    \ :: dirnames.toList).foldLeft(this)(_down(_))\n@tailrec\ndef top: DirNav = if\
    \ steps.isEmpty then this else up.top\n```\n```\n\n# Listing 11.9: Navigation\
    \ methods in a tree zipper (2).\n\nTo go down a path made of multiple subdirectories,\
    \ you use foldLeft with the current directory as the initial value to invoke the\
    \ single-name variant of method down on all the names in the path, one by one.\
    \ To move all the way to the top, method top repeatedly applies up until the root\
    \ of the tree is reached."
  merge: -1
  img_proc: true
- pgno: 210
  md: "All the other methods of class DirNav are implemented by forwarding calls to\
    \ the corresponding method in class Dir, except that creation methods (adding\
    \ and removing files and subdirectories) need to return a navigable directory\
    \ instead of a plain directory:\n\n```\n// inside class DirNav\noverride def toString\
    \ = dir.toString\n\ndef mkFile(name: String, names: String*): DirNav =\n    DirNav(dir.mkFile(name,\
    \ names*), steps)\n\ndef mkDir(name: String, names: String*): DirNav =\n    DirNav(dir.mkDir(name,\
    \ names*), steps)\n\ndef rm(name: String, names: String*): DirNav =\n    DirNav(dir.rm(name,\
    \ names*), steps)\n\nexport dir.{\n    mkString, ls, lsFiles,\n    dirCount, dirExists,\
    \ dirFold, dirFind, fileCount, fileExists, fileFold, fileFind\n}\n```\n\nFinally,\
    \ a method nav is added to class Dir to make a plain directory navigable:\n\n\
    ```\n// inside class Dir\ndef nav: DirNav = DirNav(this, List.empty)\n```\n\n\
    # 11.8 Summary\n\nIn this chapter, a file system is represented as a tree of files\
    \ and directories. The contents of a directory are stored as a list of nodes,\
    \ and the higher-order methods of lists are used to process these nodes effectively.\
    \ The tree also defines its own higher-order methods. They are implemented recursively,\
    \ and recursive calls on subdirectories are performed using the higher-order methods\
    \ of lists on a directory's contents. Finally, trees are extended into zippers\
    \ to become navigable, with methods to go down a subdirectory and back up to the\
    \ parent directory. In all (including the many footnotes), this file system case\
    \ study uses and/or reimplements standard higher-order methods exists, find, flatMap,\
    \ foldLeft, foreach, filter, map, maxBy, and partition."
