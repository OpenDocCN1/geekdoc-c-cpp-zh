  md: '# 10.9 foreach, map, flatMap, and for-Comprehensions


    A useful way to think of functions foreach, map, and flatMap is that they implement
    a mechanism that acts inside a container. Think of a structure as a “box” and
    of these higher-order functions as ways to act on the contents of the box without
    opening it. In Listing 10.5, for instance, parsing a request produces a box that
    (possibly) contains a user. Function flatMap is used to process this user, if
    any, and returns a box that (possibly) contains an account, which is itself processed
    with another use of flatMap.


    This pattern is common enough—functional programming is all about transforming
    values through functions—that languages sometimes define a special syntax for
    it. In Scala, it is called for-comprehension. You could write the request parsing
    example as follows:3


    ```

    for

    user <- parseRequest(request)

    account <- getAccount(user)

    result <- applyOperation(account, op)

    yield result

    ```


    Listing 10.9: Rewritten pipeline from Lis. 10.5 using for-comprehension.


    This code is transformed by the compiler into an expression that uses flatMap,
    equivalent to Listing 10.5. Both for-do and for-yield are syntactic sugar for
    a combination of calls to higher-order functions. For instance,


    ```

    for load <- loads yield load.reduced

    ```


    was used in Chapter 3 to create a list of updated load objects. It is compiled
    into


    ```

    loads.map(load => load.reduced)

    ```'
