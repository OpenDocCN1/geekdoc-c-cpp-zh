  md: '# # Chapter 13


    # ## Handling Failures


    Functional programming is centered on the use of values, produced and consumed
    by functions. It is therefore natural, when programming functionally, to treat
    failures as special values instead of using exceptions. A few standard types are
    commonly used to represent failures, most notably `Option`, `Try` (also called
    `Result`), and `Either`. These types can be manipulated by higher-order functions
    to process valid values and to propagate errors or to recover from them. This
    approach to error handling is particularly well suited to pipelined computations
    in which catching exceptions is unwieldy because of higher-order functions that
    embed their own control flow.


    # ### 13.1  Exceptions and Special Values


    A component of a software application that faces unexpected circumstances is often
    unable to fully react to them, typically because the data and logic needed to
    address the situation are only present in another component. Failure information
    then needs to be propagated elsewhere in the system where the problem can be properly
    handled.


    One way is to use “special” values that represent failures, but this is notoriously
    error-prone. A famous and most widely used special value is null. It is also the
    source of innumerable bugs. Another common error value is -1, used to represent
    a missing integer. In Section 5.3, I briefly mentioned that using options is preferable
    to relying on null. This chapter develops this argument and introduces other types,
    beside options, suitable for error handling.


    In languages that support them, you can use exceptions as alternatives to special
    values. A major benefit of exceptions is that there is no risk of using them as
    if they were valid outputs, like null or -1. The danger of exceptions, however,
    is that they can disrupt an application in major ways when they are not handled,
    up to forcing an abrupt termination.


    To contrast these various approaches, consider the following illustration. A function
    searches for a given element in a list, and returns, as an index, the position
    at which it is found. It has the following signature:


    ```

    ```scala

    def search[A](values: List[A], target: A): Int = ... // returns -1 when not found

    ```

    ```


    This function needs to return an integer, even when a target is not found in the
    list. A common convention—used, for instance, by Scala’s `indexWhere` function—is
    to return -1 as a special value to represent a failed search.'
