  md: "# A.7 Handling Failures\n\nError handling in Java and Kotlin is still very\
    \ much centered on throwing and catching exceptions. Kotlin recently introduced\
    \ a `Result` type, similar to Scala’s `Try`. You could rewrite in Kotlin some\
    \ of Scala’s `Try`-based code from Section 13.3:\n\n```\n```kotlin\nval lines:\
    \ Result<List<String>> = runCatching {\n    ... // a list-producing computation\n\
    }\n\nval linesOrNull: List<String>? = lines.getOrNull()\nval linesOrEmpty: List<String>\
    \ = lines.getOrDefault(listOf())\nval linesOrOther: List<String> = lines.getOrElse\
    \ { someListComputation() }\n```\n```\n\nValue `lines` is a successful result\
    \ if the computation inside `runCatching` produces a list. If instead it throws\
    \ an exception, the exception is caught and wrapped into a failed result. The\
    \ value inside `Result` can be extracted and replaced with a default value or\
    \ with null if it is missing. (In Kotlin, a type A does not contain null, which\
    \ is added in type A?; see the later discussion.)\n\nAs with `Try`, `Result` values\
    \ can be transformed using higher-order functions:\n\n```\n```kotlin\nfun compute(list:\
    \ List<String>): Int = ...\nfun computeOrFail(list: List<String>): Result<Int>\
    \ = ...\n\nlines.map { compute(it) }                         // of type Result<Int>\n\
    lines.mapCatching { computeOrFail(it).getOrThrow() } // of type Result<Int>\n\
    ```\n```\n\nThe second expression is simpler in Scala, but Kotlin’s `Result` type\
    \ does not (yet) implement a `flatMap` method.\n\nJava only has its `Optional`\
    \ type to offer, but at least it defines a `flatMap` method:\n\n```\n```java\n\
    List<String> someListComputation() { ... }\nint compute(List<String> list) { ...\
    \ }\nOptional<Integer> computeOrFail(List<String> list) { ... }\n\nOptional<List<String>>\
    \ lines = ...\n\nList<String> linesOrEmpty = lines.orElse(Collections.emptyList());\n\
    List<String> linesOrOther = lines.orElseGet(() -> someListComputation());\n```\n\
    ```"
