    val maybeString: String? = ...

    val optStr: String? = maybeString?.uppercase()

    val optInt: Int? = maybeString?.toIntOrNull()

    ```


    Kotlin types Int and String do not contain null, but types Int? and String? do.
    Therefore, maybeString could be either a string or null. The call maybeString.uppercase()
    is rejected at compile time, requiring that you add a check for null in your code.
