    is that function hanoi makes two recursive calls to itself, compared to the single
    call needed in the factorial or greatest common divisor examples.


    # 6.3 Key Principles of Recursive Algorithms


    The core idea behind recursive algorithms is to reduce a problem to one or more
    smaller instances of the same problem and to use the solutions to these subproblems
    to derive a solution to the original problem. The Tower of Hanoi function in Section
    6.2 solves the problem of moving n discs by combining the solutions to two subproblems
    of moving n – 1 discs. Think of this strategy as a special case of the divide
    and conquer approach in which the subtasks are homologous with the original task.


    When writing a recursive function, you need to pay attention to three major concerns:


    +   - At least one branch of the computation should not be recursive. If the evaluation
    of your function always triggers a recursive call, the function keeps re-executing
    itself and cannot possibly terminate. In the Tower of Hanoi example, the case
    n = 0 does not require a recursive call.


    > There are iterative solutions to the Tower of Hanoi that can be easily implemented
    in terms of loops, but their correctness is harder to justify, and even the simplest
    loop-based program is still more complex than the recursive function presented
    here.'
