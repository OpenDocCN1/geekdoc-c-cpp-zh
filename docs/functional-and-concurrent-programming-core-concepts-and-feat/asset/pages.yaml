  md: '# 27.3 Fork/Join Pools


    # NOTE


    Sections 27.3 to 27.6 rely on the ad-fetching example from Chapter 26 to illustrate
    various frameworks. This example is not necessarily the best illustration of the
    strengths of these frameworks. Instead, the goal here is to make it easier to
    compare approaches and to emphasize that they can all be used to achieve the same
    non-blocking computation.


    In Chapter 26, I started my discussion on the dangers of blocking with an example
    of a recursive task: A quick-sort task starts another quick-sort task and waits
    for its completion (Listing 26.1). This results in threads waiting on tasks, while
    tasks wait for threads for execution, leading to possible deadlocks.


    To better handle the common pattern of tasks that create other tasks, the Java
    concurrency library defines a special form of thread pool called ForkJoinPool.
    This pool implements the same functionalities as regular pools but also has a
    dedicated mechanism that enables tasks to create tasks (fork) and to wait for
    their completion (join) without blocking a worker thread. Method join is implemented
    in such a way that if the task being joined is not finished, a worker thread instead
    retrieves and starts another one of the tasks scheduled for execution.⁸ This keeps
    the thread active, and progress keeps being made on the tasks as a whole, thus
    avoiding deadlocks—as long as tasks are not set up to wait for each other in a
    cycle.


    To illustrate the use of this non-blocking join, let’s use ForkJoinPool to rewrite
    our solution to the example of fetching a customized ad in parallel with a database
    lookup:


    ```

    import java.util.concurrent.ForkJoinTask


    val futureAd: ForkJoinTask[Ad]      = ForkJoinTask.adapt(() => fetchAd(request)).fork()

    val futureData: ForkJoinTask[Data]  = ForkJoinTask.adapt(() => dbLookup(request)).fork()

    val data: Data                      = futureData.join()

    val ad: Ad                          = futureAd.join()

    val page: Page                      = makePage(data, ad)

    ```


    Listing 27.4: Example of non-blocking concurrency using ForkJoinPool.


    > ⁸The ForkJoinPool class implements a work-stealing pattern in which each worker
    thread maintains its own queue of tasks and "steals" from other workers when it
    runs out of work. In contrast to a single queue model, this approach has the benefit
    that newly created tasks can be added to the queue of the current worker for later
    processing without interfering with other threads. This became such a popular
    feature that Java later introduced a newWorkStealingPool method that makes this
    pattern available independently from the fork/join mechanism.'
