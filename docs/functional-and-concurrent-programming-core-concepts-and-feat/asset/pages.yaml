  md: '# 15.10 Type Classes


    Earlier, a distinction was made between nominal subtyping, which is typically
    used in statically typed languages, and structural subtyping, which is less safe
    but more flexible and popular in dynamically typed languages. At times, programmers
    who would otherwise benefit from static typing decide they cannot use a particular
    language because they need more flexibility. Before you run to Python or JavaScript
    because you absolutely need structural subtyping, be aware that some statically
    typed languages offer mechanisms that achieve much of the same flexibility, possibly
    in a safer way.


    ```

    case class Report(title: String, number: Int) // does not refer to Publication

    ```


    Even though reports have titles, you cannot use a function printTitle defined
    as


    ```

    def printTitle(pub: Publication): Unit = println(pub.title)

    ```


    to display the title of a report because Report is not a subtype of Publication.


    As we have seen, this is not an issue in languages that rely on structural subtyping
    (duck typing): In these languages, a call is valid as long as the runtime argument
    has a title method, no matter its nominal type. Although Scala uses nominal subtyping
    at its core, the language lets you define structural types as well:


    ```

    type Titled = { def title: String }


    def printTitle(doc: Titled): Unit = println(doc.title)

    ```


    Listing 15.12: Example of a structural type in Scala.


    Type Titled represents objects that have a string-valued title method. You can
    use this printTitle function on anything with a title, including a report:


    ```

    val report = Report("Count to count: from Monte-Cristo to Mathias Sandorf, 123")

    printTitle(report) // prints "Count to count: from Monte-Cristo to Mathias Sandorf"

    ```'
