  md: '+   - Deadlocks are made easier to investigate by the fact that the threads
    involved are blocked, so they can be examined at the programmer’s convenience.
    A JVM can produce a snapshot of information on its threads, known as a thread
    dump. This information typically includes whether threads are blocked or running,
    which synchronizers they are blocked on, which locks they currently own, and so
    forth.

    +   - Single-threaded programs are sequentially consistent: Reading a memory location
    produces the last value written into that location. For performance reasons, processors,
    operating systems, and virtual machines are often not sequentially consistent
    in the presence of multiple threads. Though not sequentially consistent in general,
    the Java Memory Model is defined in such a way that properly synchronized programs
    can expect sequential consistency.'
