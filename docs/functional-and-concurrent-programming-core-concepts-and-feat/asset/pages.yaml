    \ as a function:\n\n```\n```scala\ndef greaterThan90(x: Int): Boolean = x > 90\n\
    find(temps, greaterThan90) // Some(91)\n```\n```\n\nIn this last expression, you\
    \ do not invoke function `greaterThan90` on an integer argument. Instead, you\
    \ use the function itself as an argument to `find`. To search for a project with\
    \ identity 12345, simply define a different search criterion:\n\n```\n```scala\n\
    def hasID12345(project: Project): Boolean = project.id == 12345L\nfind(projects,\
    \ hasID12345) // project with identity 12345\n```\n```\n\nBecause it takes a function\
    \ as an argument, `find` is said to be a *higher-order function*. Functional programming\
    \ libraries define many standard higher-order functions, some of which are discussed\
    \ in Chapter 10. In particular, a method `find` is already defined on Scala’s\
    \ `List` type. The two searches in the preceding examples can be written as follows:\n\
    \n```\n```scala\ntemps.find(greaterThan90)\nprojects.find(hasID12345)\n```\n```\n\
    \nFrom now on, code examples in this chapter use the standard method `find` instead\
    \ of the earlier user-defined function.\n\nMethod `find` is a higher-order function\
    \ because it takes another function as an argument. A function can also be higher-order\
    \ by returning a value that is a function. For example, instead of implementing\
    \ `greaterThan90`, you can define a function that builds a search criterion to\
    \ look for temperatures greater than a given bound:\n\n```\n```scala\ndef greaterThan(bound:\
    \ Int): Int => Boolean =\n  def greaterThanBound(x: Int): Boolean = x > bound\n\
    \  greaterThanBound\n```\n```\n\nListing 9.3: Example of a function that returns\
    \ a function; see also Lis. 9.4 and 9.5.\n\nFunction `greaterThan` works by first\
    \ defining a function `greaterThanBound`. This function is not applied to anything\
    \ but simply returned as a value. Note that `greaterThan` has return type `Int\
    \ => Boolean`, which denotes functions from integers to Booleans. Given a lower\
    \ bound b, the expression `greaterThan(b)` is a function, which tests whether\
    \ an integer is greater than b. It can be used as an argument to higher-order\
    \ method `find`:"
