  md: "As a side note, actors have the interesting property that they can switch behaviors,\
    \ and thus process subsequent incoming messages differently. This can be leveraged\
    \ to implement state machines in terms of actors:\n\n```\ntrait Command\ncase\
    \ class Start(replyTo: ActorRef[Number]) extends Command\ncase class Number(value:\
    \ Int) extends Command\ncase object Stop extends Command\n\ndef reset(): Behavior[Command]\
    \ =\n  Behaviors.receiveMessagePartial {\n    case Start(replyTo) => add(replyTo,\
    \ Behaviors.same)\n  }\n\ndef add(replyTo: ActorRef[Number], reset: Behavior[Command]):\
    \ Behavior[Command] =\n  var sum = 0\n  Behaviors.receiveMessagePartial {\n  \
    \  case Number(value) =>\n      sum += value\n      Behaviors.same\n    case Stop\
    \ =>\n      replyTo ! Number(sum)\n      reset\n  }\n```\n\nListing 27.8: Example\
    \ of a state machine as an actor that switches behavior.\n\nThis example implements\
    \ a counter by starting an actor with a reset behavior. This actor waits for the\
    \ Start command. When Start is received, the actor changes its behavior to add,\
    \ passing its current behavior as an argument so it can be used later to switch\
    \ back. Messages are then processed according to the new behavior. When a message\
    \ of type Number is received, its value is added into an accumulator sum, and\
    \ the behavior of the actor remains the same. When the Stop message is received,\
    \ the actor replies with the accumulated sum and reverts to its initial behavior,\
    \ waiting for another Start message. As a state machine, the actor transitions\
    \ between states as follows:\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_448_0.png)\n\
    \nMethod add is implemented in an imperative style, with a mutable variable sum.\
    \ This is done on purpose, to emphasize the fact that, within an actor, messages\
    \ are processed sequentially. The actor may receive numbers concurrently and still\
    \ add them correctly, even though no lock is used and the assignment sum += value\
    \ is not thread-safe."
