  md: '# 12.5 Streams as Lazily Evaluated Lists


    Consider a scenario in which data, somehow produced by a component of an application,
    is being searched for specific values by another component. A possible design
    could rely on a searching method with the following signature:


    ```

    def searchData(data: List[Data]): Option[Data] = ...

    ```


    A drawback of this approach is that the entire list of data has to be produced
    before it can be searched, possibly resulting in situations where the list is
    large and only the first few elements are needed for the search. As an alternative,
    you could use a lazily evaluated argument:


    ```

    def searchData(data: => List[Data]): Option[Data] = ...

    ```


    But that does not help at all, because the entire list still has to be evaluated
    before the search starts. What you want instead is to delay the evaluation of
    each list element. You could do it with thunks:


    ```

    def searchData(data: List[() => Data]): Option[Data] = ...

    ```


    However, this is far from ideal because all the thunks need to be created before
    the search starts. With this approach, you may not have to produce all the actual
    data, but you still need to create as many thunk functions as there are potential
    pieces of data.


    What you really want is to avoid creating anything beyond the data elements needed
    for the search to complete. In Scala, you achieve this with a searching method
    with the following signature:


    ```

    def searchData(data: LazyList[Data]): Option[Data] = ...

    ```


    LazyList is a type of linear sequence—like a list—in which elements are lazily
    evaluated. Such sequences are often called streams. Scala streams are immutable.
    They are also memoized:³ Once computed, each element is stored in the stream.


    You can often use streams like regular lists. For instance, to search for the
    first piece of data with a value greater than 10, you can define a tail recursive
    function:


    > ³This means that mutation actually occurs within streams, to replace unevaluated
    elements with actual values. As a sequence, though, streams are conceptually immutable
    and a stream always represents the same sequence.'
