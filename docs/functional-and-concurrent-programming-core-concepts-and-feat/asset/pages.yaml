    Beside the Result type, Kotlin implements a form of compile-time null-safety.
    It forces you to test for nullity, provide alternative values, or propagate null.
    It is one of the most popular features of Kotlin, as it helps programmers avoid
    many occurrences of the dreaded NullPointerException. As a consequence, Kotlin
    tends to rely on null values where other languages would use options. For instance,
    Scala’s


    ```

    val maybeString: Option[String] = ...

    val optStr: Option[String] = maybeString.map(_.toUpperCase)

    val optInt: Option[Int] = maybeString.flatMap(_.toIntOption)

