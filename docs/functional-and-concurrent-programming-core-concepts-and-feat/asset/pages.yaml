  md: "# 10.4 fold and reduce\n\nAs mentioned earlier, iterations are not a good fit\
    \ for functional programming, and recursion is instead needed to arbitrarily nest\
    \ function composition. When processing a collection, a family of higher-order\
    \ functions exists that is specifically designed to implement the necessary nesting\
    \ of function calls, without additional need for loops or recursion. Internally,\
    \ these higher-order functions might be implemented using iteration or recursion.\n\
    \nAs an illustration, let abc be a list that contains values A, B, and C, in that\
    \ order. Then, abc.foldLeft(X)(f) is equivalent to the expression f(f(f(X,A),B),C).\
    \ The given function f is used to combine an initial value X with the first element\
    \ of the list: f(X,A). This new value is then combined with the next element in\
    \ the list, still using f: f(f(X,A),B). The computation proceeds in this fashion\
    \ on the entire list, and the value produced by the final invocation of f is returned.\
    \ When using foldLeft, elements are processed from left to right. A similar function\
    \ foldRight processes the elements from right to left instead: abc.foldRight(X)(f)\
    \ is f(A,f(B,f(C,X))). Unordered collections, like sets, tend to offer a single\
    \ function fold, which does not specify the order in which the elements are processed\
    \ and thus typically requires that you use it with an argument function that is\
    \ symmetric and associative.\n\nYou can use fold variants to replace computations\
    \ that would otherwise be done iteratively or recursively:\n\n```\nScala\ndef\
    \ calculate(numbers: List[Int]): Double =\n  var acc = 10.0\n  for x <- numbers\
    \ do acc = 3.0 * acc + x + 1.0\n  acc\n\ndef calculate(numbers: List[Int]): Double\
    \ =\n  @tailrec\n  def loop(nums: List[Int], acc: Double): Double = nums match\n\
    \    case Nil => acc\n    case x :: r => loop(r, 3.0 * acc + x + 1.0)\n  loop(numbers,\
    \ 10.0)\n\ndef calculate(numbers: List[Int]): Double =\n  numbers.foldLeft(10.0)((acc,\
    \ x) => 3.0 * acc + x + 1.0)\n```\n\nListing 10.6: Example of iteration, recursion,\
    \ and fold for the same computation.\n\nIn Listing 10.6, all three calculate functions\
    \ perform the same computation: one iteratively, one with a tail recursive function,\
    \ and one using foldLeft. In each vari-"
