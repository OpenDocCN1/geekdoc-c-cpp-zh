  md: "like Scala’s views and iterators; they provide delayed evaluation without memoization.\
    \ The iterator-based function from Listing 12.9 can be written in Java or in Kotlin:²\n\
    \n```\nint collatz(BigInteger start) {\n    return (int) Stream.iterate(start,\
    \ n ->\n        n.mod(BigInteger.TWO).equals(BigInteger.ZERO) ? n.divide(BigInteger.TWO)\n\
    \        : n.multiply(BigInteger.valueOf(3)).add(BigInteger.ONE))\n        .takeWhile(n\
    \ -> !n.equals(BigInteger.ONE))\n        .count();\n}\n```\n\n```\nfun collatz(start:\
    \ BigInteger): Int =\n    generateSequence(start) { n ->\n        if (n % BigInteger.TWO\
    \ == BigInteger.ZERO) n / BigInteger.TWO\n        else n * 3.toBigInteger() +\
    \ BigInteger.ONE\n    }\n    .takeWhile { n -> n != BigInteger.ONE }\n    .count()\n\
    ```\n\nLike Scala’s iterators and views, Stream and Sequence stack and delay transformations\
    \ until the sequence is consumed, avoiding the creation of intermediate structures.\
    \ The two functions shown here do not allocate the list of numbers from start\
    \ to ONE.\n\nFinally, Kotlin—but not Java—offers a mechanism similar to Scala’s\
    \ lazy for lazy initialization of variables. Scala’s\n\n```\nlazy val variable:\
    \ Int = someComputation()\n```\n\ncan be written in Kotlin as\n\n```\nval variable:\
    \ Int by lazy {\n    someComputation()\n}\n```\n\nIn both cases, someComputation\
    \ is triggered only the first time variable is accessed, if it is accessed at\
    \ all. As in Scala, lazy is thread-safe by default, but thread-safety can be turned\
    \ off when it is not needed.\n\n²Both implementations could be written more simply\
    \ without a takeWhile step. In Java, you could use a predefined “iterate while”\
    \ function; in Kotlin, you could rely on the fact that generateSequence stops\
    \ when its function argument returns null. The code here is written to mimic the\
    \ Scala variant."
