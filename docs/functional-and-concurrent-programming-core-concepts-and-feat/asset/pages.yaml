  md: "# A.2 Immutability\n\nJava and Kotlin functions can be either pure or impure.\
    \ For actions—functions with no return value, applied for side effects—Java has\
    \ a keyword void, whereas Kotlin uses a Unit return type, like Scala. Kotlin uses\
    \ var and val to define reassignable and non-reassignable variables, like Scala.\
    \ In Java, variables are reassignable by default but become non-reassignable when\
    \ the keyword final is used.\n\nKotlin lets you defer the initialization of a\
    \ val variable, a feature Scala does not have:\n\n```\nKotlin\nfun parseVerbosity(arg:\
    \ String): Int {\n  val verbosity: Int\n  if (arg == \"-v\") verbosity = 1\n \
    \ else if (arg == \"-vv\") verbosity = 2\n  else verbosity = 0\n  return verbosity\n\
    }\n```\n\nMost Java collections are mutable. Kotlin defines immutable collection\
    \ types, but they are mostly read-only views of underlying mutable implementations:\n\
    \n```\nKotlin\nval readOnly: List<Int> = listOf(1, 2, 3)\nval cheating = readOnly\
    \ as MutableList<Int>\ncheating[1] = 20\nval x = readOnly[1] // 20\n```\n\nIn\
    \ this example, variable readOnly is of type List, an immutable type in Kotlin.\
    \ Internally, however, it is implemented (on the JVM) as an old-fashioned array-based\
    \ list. It can even be type cast to a mutable type, and modified: The second element\
    \ of list readOnly is changed from 2 to 20.\n\nThis makes Kotlin lists fundamentally\
    \ different from lists in Scala (or in any functional programming language). In\
    \ particular, Kotlin lists have no constant-time head and tail operations:\n\n\
    ```\nScala\nval a: List[String] = List(\"A\",\"B\",\"C\")\nval b = a.tail // constant\
    \ time, lists a and b share all their data\n```"
