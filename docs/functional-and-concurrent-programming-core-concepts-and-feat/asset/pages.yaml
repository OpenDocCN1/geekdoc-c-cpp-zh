  md: "# # Chapter 8 Case Study: Binary Search Trees\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_148_0.png)\n\
    \nThe right child is “left-heavy” (its own imbalance is –1). In that case, two\
    \ rotations are needed: first a left-to-right rotation of the right child, to\
    \ get back to the previous case, and then a right-to-left rotation as before:\n\
    \n![](img/74309e2bdd93f68d2e94338a3d73517f_148_1.png)\n\nThe case of a tree with\
