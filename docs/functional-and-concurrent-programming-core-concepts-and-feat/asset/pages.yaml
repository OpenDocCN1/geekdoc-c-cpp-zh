  md: 'by any thread. In this particular example, these intermediate states, while
    valid, are not needed. The list is used only after the tasks that added to it
    are finished—when it already contains all ten strings.


    If all you need is to build a collection of all the strings produced together
    by the two tasks, you don’t care about the state of the list as it evolves during
    this computation. Instead, you can have each task produce its own collection of
    strings, and then put the two collections together at the end:


    ```

    val exec = Executors.newCachedThreadPool()


    def makeStrings(n: Int, str: String): List[String] = List.fill(n)(str)


    var strings1: List[String] = null

    var strings2: List[String] = null


    exec.execute(() => strings1 = makeStrings(5, "T1"))

    exec.execute(() => strings2 = makeStrings(5, "T2"))


    exec.shutdown()

    exec.awaitTermination(5, MINUTES)


    val strings: List[String] = strings1 ::: strings2

    assert(strings.size == 10)

    ```


    This variant of the program proceeds differently from before. Instead of sharing
    a single list, each task creates its own list. These per-task lists are not shared
    and do not need to be thread-safe.¹ No locks are involved. After the tasks have
    terminated, the main thread puts the two lists together, again without a need
    for synchronization.


    The program works but lacks elegance. It uses two mutable variables, initialized
    with arbitrary values, and runs the risk that these values may be used by mistake,
    resulting in a NullPointerException. What brings about this convoluted structure
    is a discrepancy between the purpose of each task—to create a list—and the fact
    that the tasks are still implemented as actions—instances of Runnable that modify
    mutable data. It would be more sensible for the tasks to be functions—value-producing
    tasks, or functional tasks—instead of actions that set external variables.


    All of the mechanisms used so far to create concurrent activities—the Runnable
    interface, the constructor of Thread class, the execute method of a thread pool—focus
    on actions. They are inadequate to handle functional tasks. This chapter and the
    next discuss futures, an established device tailored to value-producing tasks.


    ¹As immutable lists, they are thread-safe in this example, but they don’t need
    to be.'
