    # 10.6 sortWith, sortBy, maxBy, and minBy


    To sort sequences, you need to have a way to compare elements. In Java, for instance,
    subtypes of the Comparable interface implement an ordering, and sequences of these
    types can be sorted using the java.util.Collections.sort method. Alternatively,
    the method can take an explicit Comparator argument to sort values that are not
    naturally comparable (or to override a default ordering). Scala offers a similar
    method sorted, which takes an optional argument of type Ordering, much like Java’s
    Comparator.


    In this section, we want to focus on higher-order alternatives to method sorted.
    First is sortWith, which takes a comparison function, instead of a comparator
    object:


    ```

    temps.sortWith(_ < _) // List(69, 70, 78, 88, 91, 98, 100)

    temps.sortWith(_ > _) // List(100, 98, 91, 88, 78, 70, 69)

    ```


    You could use sortWith to sort a list of strings by length:


    ```

    val strings: List[String] = ...


    strings.sortWith(_.length < _.length)

    ```


    A better alternative in this scenario is to use sortBy. This function takes as
    its argument a function that maps the elements to be sorted to arbitrary ordered
    values:


    ```

    strings.sortBy(_.length)

    ```


    In the preceding expression, strings are also sorted in increasing order of their
    lengths. This is achieved by mapping strings to their lengths, and then relying
    on the default ordering of integers. Note that the result is a list of strings,
    not a list of integers (as strings.map(_.length).sorted would be). If 2D points
    are represented as pairs, you can use sortBy to sort them in increasing order
    of Euclidean distance to origin:'
