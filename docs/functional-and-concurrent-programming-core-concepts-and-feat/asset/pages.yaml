- pgno: 260
  md: 'safe types are—that is, how effective they are at catching mistakes before
    these mistakes trigger runtime bugs. Second, convenience is contingent on how
    flexible a type system is: A flexible type system does not get in the way of the
    developer’s design. And third is simplicity: Some type systems are easier to understand,
    while others are more complex.


    Of safety, flexibility, and simplicity, a programming language typically favors
    two at the expense of the third. How languages handle type variance, discussed
    in Section 15.8, is a perfect example. A language could make all data structures
    covariant; it would be simple and flexible, but unsafe. Or it can have them all
    be invariant, which is simple and safe, but lacks flexibility. Or it can define
    mechanisms for users to specify variance through annotations, which is safe and
    flexible, but more complex. In the case of variance, older languages (Java, C++)
    have favored simplicity and rigidity, but more modern languages (C#, Scala, Kotlin)
    have improved flexibility at the cost of increased complexity. The remainder of
    this chapter discusses several concepts that contribute to type safety, flexibility,
    and complexity.


    # 15.2 Types as Sets


    One simple way you can look at types is to think of them as sets of values.² The
    type String, for instance, is the set of all string values, and the type Int,
    the set of all (32-bit) integers. In terms of sets, "foo" ∈ String and 42 ∈ Int.³
    If a program declares variable x to have type S, then x ∈ S should be true at
    all times during the execution of the program; otherwise, the type system is unsound.
    Similarly, if a function f specifies that its argument is of type T, a call f(x)
    is only valid if x ∈ T. Most importantly, if type S is a subtype of T, then S
    ⊆ T. Subtypes are discussed in Section 15.6.


    As sets, types can be combined using standard set union and set intersection.
    Type S | T is the union of types S and T—in other words, the set of values that
    belong to S or to T. Type S & T is the intersection of types S and T. As an example,
    type Book & Serializable contains those book objects that can be serialized.


    Some types are very small sets. For instance, Scala defines a type 42 that contains
    only the integer 42, and a type "foo" that contains only the string "foo". Type
    Unit also has a single element, value unit—denoted as "()"—and type Null contains
    only null. Type Boolean contains just two values, and so does type 0 | 1. This
    function flips 0 into 1 and 1 into 0, and can be invoked on only these two values:


    ```

    def flip(x: 0 | 1): 0 | 1 = if x == 0 then 1 else 0

    Scala

    ```


    Smaller types are more precise and convey more information. The List(1,2,3) value
    is in type List[Int], but also in types Seq[Int], List[Any], and Any. Type List[Int]
    is the most informative: Seq[Int] includes non-list sequences, List[Any] includes
    lists of non-integer values, and Any includes objects that are not lists at all.


    ²Some languages, including Scala, also define kinds as sets of types. For instance,
    List is a kind that contains the types List[String] and List[Int], among others.
    This chapter does not cover kinds.


    ³"x ∈ S" denotes the fact that value x is an element of set S. "S ⊆ T" means that
    S is a subset of T: All the elements of S are also in T.'
