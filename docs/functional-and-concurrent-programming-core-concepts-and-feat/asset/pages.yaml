  md: "Accordingly, in Scala, `Option[Book]` is a subtype of `Option[Publication]`,\
    \ and `LazyList[Magazine]` is a subtype of `LazyList[Publication]`. In contrast,\
    \ in Java, `Optional<Book>` is not a subtype of `Optional<Publication>`, and `Stream<Magazine>`\
    \ is not a subtype of `Stream<Publication>`.\n\nIn languages that support variance\
    \ annotations, you can define your own covariant types:\n\n```\n```scala\nclass\
    \ Ref[+A](contents: A):\n  private var count = 0\n\n  def get(): A =\n    count\
    \ += 1\n    contents\n\n  def accessCount: Int = count\n\n  def reset(): Unit\
    \ = count = 0\n```\n```\n\nListing 15.5: Example of a user-defined covariant type.\n\
    \nClass `Ref` implements a wrapper that keeps track of how many times a value\
    \ is accessed. Thanks to the variance annotation, `Ref[Book]` is a subtype of\
    \ `Ref[Publication]`. Note that instances of class `Ref` are mutable—both methods\
    \ `get` and `reset` can modify the state of the object. However, the contents\
    \ of a reference cannot be changed. An attempt to change `contents` into a `var`\
    \ and to add a setter method are rejected by the compiler:\n\n```\n```scala\n\
    // rejected by the compiler\nclass Ref[+A](private var contents: A):\n  private\
    \ var count = 0\n\n  def set(value: A): Unit =\n    contents = value\n    count\
    \ = 0\n  ...\n```\n```\n\nMethods in class `Ref[+A]` can return values of type\
    \ A, but any method that declares an argument of type A—like method `set`—will\
    \ be rejected. If you want a resettable reference, you will need to declare it\
    \ as `class Ref[A]` and make it non-variant.\n\nCovariance has a dual concept\
    \ called *contravariance*: If C is contravariant and S is a subtype of T, then\
    \ C[T] is a subtype of C[S]. The contravariance annotation in Scala is a minus\
    \ sign:"
