  md: '# # Chapter 16


    # ## Concepts of Concurrent Programming


    Part I started with the observation that there is no single definition of functional
    programming. Unfortunately, there is no universally agreed-upon definition of
    concurrent programming either, and defining concurrent programming is at least
    as difficult a task as defining functional programming was in Part I of the book.
    The issue is similar: The terminology is ambiguous, and different people choose
    to emphasize different aspects. Nevertheless, from the indisputable premise that
    concurrent programs do not execute in a purely sequential manner, several key
    concepts of concurrent programming emerge, including synchronicity, atomicity,
    threads, synchronization, and nondeterminism.




    A possible starting point is to think of concurrent programs as programs that
    are not sequential. A sequential program executes its instructions, one at a time,
    from beginning to end. Most programmers learned how to program by first writing
    sequential programs. A “main” function starts with its first programming statement
    and continues through conditional, loops, and function calls, until it executes
    its very last statement, then terminates.


    Can a program execution not be sequential? A common answer is that a program may
    involve multiple threads of execution. Each thread executes the program sequentially,
    but several threads do it at the same time. Another answer is that a program stops
    being sequential by having some of its parts executed out of order, due to the
    presence of asynchronous operations. Quite often, asynchronous operations involve
    threads, and threads are used mostly through asynchronous operations, so both
    answers coincide. However, asynchronous code need not be multithreaded, and threads
    do not necessarily make code asynchronous.


    As an illustration, consider the following program:


    ```

    println(''A'')

    println(''B'')

    println(''C'')

    ```


