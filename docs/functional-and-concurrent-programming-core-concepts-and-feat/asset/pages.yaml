    \ also define backdoors to their own type system, inviting weakness where the\
    \ language is strong. The Python function\n\n```\n```python\ndef print_title(book):\n\
    \    print(book.title)\n```\n```\n\ndisplays book titles but can also be called\
    \ on an integer, in which case it will fail from not finding a suitable title\
    \ attribute (as described earlier). To better handle the mistake, the function\
    \ can be rewritten to test the type of its argument explicitly:\n\n```\n```python\n\
    def print_title(book):\n    if isinstance(book, Book):\n        print(book.title)\n\
    \    else:\n        raise TypeError(\"not a book\")\n```\n```\n\nThis added code\
    \ is not needed in Scala, since the compiler can be trusted to check that the\
    \ argument has the desired type. However, you can still write an equivalent to\
    \ the Python function:\n\n```\n```scala\n// DON'T DO THIS!\ndef printTitle(item:\
    \ Any) =\n    if item.isInstanceOf[Book] then\n        val book = item.asInstanceOf[Book]\n\
    \        println(book.title)\n    else throw IllegalArgumentException(\"not a\
    \ book\")\n```\n```\n\nType checking by the compiler is bypassed, and replaced\
    \ with a form of dynamic checking at runtime, thus weakening the overall type\
    \ safety of the language.\n\nMethods like isInstanceOf/asInstanceOf constitute\
    \ a backdoor to the type system. They are sometimes necessary, but should not\
    \ be abused. Some languages have no such loopholes. For example, the runtime type\
    \ checking and casting used in function printTitle is not possible in—more static?\
    \ more strongly typed?—languages like SML.\n\nAlthough compilers can sometimes\
    \ use type information to improve performance, the main motivation for types is\
    \ to help programmers catch—and fix—mistakes. From a developer's standpoint, a\
    \ useful type system is one that contributes to this goal, whether it does so\
    \ by being “strong” or by being “static.”\n\nThree characteristics of types often\
    \ matter more to you as a programmer than the static/dynamic or strong/weak opposition.\
    \ First, typing utility is determined by how"
