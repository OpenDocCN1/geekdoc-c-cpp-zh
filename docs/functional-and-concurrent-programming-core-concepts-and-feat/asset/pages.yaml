  md: "# # Chapter 5\n## Pattern Matching and\n## Algebraic Data Types\n\nMost functional\
    \ programming languages—as well as many of the hybrid languages that aspire to\
    \ support functional programming—define a form of *pattern matching*. Pattern\
    \ matching has many uses, from a simple switch-like construct to runtime type\
    \ checking and casting, but it is most effective when applied to algebraic data\
    \ types, which combine alternatives and aggregation.\n\n# ### 5.1  Functional\
    \ Switch\n\nAs a starting point, you can think of pattern matching as a form of\
    \ functional `switch`. For instance, the earlier example using `if-then-else`\n\
    \n```\n```scala\nval verbosity = if arg == \"-v\" then 1 else if arg == \"--vv\"\
    \ then 2 else 0\n```\n```\n\ncould be rewritten to use pattern matching instead:\n\
    \n```\n```scala\nval verbosity = arg match\n  case \"-v\"  => 1\n  case \"--vv\"\
    \ => 2\n  case _      => 0\n```\n```\n\n*Listing 5.1: Example of pattern matching\
    \ used as a* `switch` *expression.*\n\nThe whole `match-case` is an expression,\
    \ used to set `verbosity`. Cases are considered in order, and the value of the\
    \ whole pattern matching expression is the value associated with the first pattern\
    \ that matches. The underscore represents a default case, which matches anything.\
    \ There is no fall-through. The same expression can be associated with multiple\
    \ patterns, as in `case \"-v\" | \"--verbose\" => 1`.\n\nThis is only the tip\
    \ of the iceberg, though. Pattern-matching is much more than a simple switch expression\
    \ and is used in more ways. For one thing, conditions—sometimes called *guards*—can\
    \ be added to patterns:"
