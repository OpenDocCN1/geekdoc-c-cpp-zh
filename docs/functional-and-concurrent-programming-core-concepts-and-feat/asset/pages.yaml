  md: "An added benefit of relying on computations of type A => Future[B] instead\
    \ of A => B is that futures can also carry failures—in Scala, you can think of\
    \ Future as an asynchronous Try. For example, you can improve the getAccount function\
    \ by making sure it always produces a future, even when a user is not found:\n\
    \n```\ndef getAccount(user: User): Future[Account] = Future.fromTry(Try(allAccounts(user)))\n\
    ```\n\nThis way, an expression like getAccount(user).onComplete(...) still executes\
    \ a callback action, which is not true if getAccount throws an exception. Failed\
    \ futures can be handled functionally, using dedicated functions such as recover\
    \ in Scala or exceptionally in Java.\n\nFor simplicity, the connection-handling\
    \ function from Listing 26.8 does not deal with errors. You could use standard\
    \ future functions to add robustness to the server. For instance, failure to create\
    \ a page could be handled by transforming the pageF future:\n\n```\nval safePageF:\
    \ Future[Page] = pageF.recover { case ex: PageException => errorPage(ex) }\n```\n\
    \nor by adding a failure callback:\n\n```\npageF.failed.foreach { ex =>\n  connection.write(errorPage(ex))\n\
    \  connection.close()\n}\n```\n\nEither the callback actions specified using pageF.foreach\
    \ or those specified using pageF.failed.foreach will run, but not both.\n\n# Non-Blocking\
    \ “Join” Pattern\n\nIn the server example, pageF is created by combining two futures,\
    \ dataF and adF, using flatMap. You can use the same approach to combine three\
    \ or more futures:\n\n```\nval f1: Future[Int] = ...\nval f2: Future[String] =\
    \ ...\nval f3: Future[Double] = ...\n\nval f: Future[(Int, String, Double)] =\n\
    \  f1.flatMap(n => f2.flatMap(s => f3.map(d => (n, s, d))))\n```\n\nThis won’t\
    \ scale to larger numbers of futures, though. An interesting and not uncommon\
    \ case is to combine N futures of the same type into a single one, for an arbitrary"
