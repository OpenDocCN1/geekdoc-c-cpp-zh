  md: "with an if-then-else before freeing the lock. You can also use tryLock without\
    \ a timeout to acquire a lock if it is available, or give up immediately without\
    \ blocking the thread.\n\nReentrantLock is typically used within a try-finally\
    \ block to ensure that the lock is properly released, even in the presence of\
    \ exceptions. In this particular example, not much could go wrong between tryLock\
    \ and unlock, but a try-finally construct makes it easier to release the lock\
    \ when a value is returned, without having to store this value in a local variable.\n\
    \nWhen acquiring a lock without a timeout, you can use lock to wait uninterruptibly,\
    \ or use lockInterruptibly to make the blocked thread responsive to interrupts.\
    \ The behavior of lock is the same as synchronized: Interrupting a thread does\
    \ not make the thread give up trying to acquire a lock. By contrast, lockInterruptibly\
    \ throws an InterruptedException when a thread is interrupted while waiting for\
    \ a lock. Using lockInterruptibly makes it easier to write lock-using tasks that\
    \ can be canceled.\n\nBesides its more flexible locking methods, the other major\
    \ benefit of ReentrantLock over intrinsic locks is that you can create multiple\
    \ conditions on the same lock. Conditions are discussed in Section 23.4, and Listing\
    \ 23.8 uses a lock with two conditions.\n\nIn addition to this reimplementation\
    \ of exclusive locks, a second class from the standard library, ReentrantReadWriteLock,\
    \ implements non-exclusive locks. The defining characteristic of these locks is\
    \ that you can acquire them in two separate modes: write (exclusive) and read\
    \ (shared). When acquired in write mode, a lock is owned by a single thread, as\
    \ with exclusive locks. By contrast, a lock acquired in read mode can be shared\
    \ among multiple threads in that mode.\n\nYou can use read-write locks to guard\
    \ structures that are frequently read but rarely modified. Threads can read concurrently\
    \ by acquiring the lock in read mode, whereas writing the structure requires exclusive\
    \ access and necessitates that threads acquire the lock in write mode. Note, however,\
    \ that the name read-write is historical and can be somewhat misleading. A read-write\
    \ lock is really a shared-exclusive lock, whether the shared mode is used while\
    \ writing or while reading.\n\nSuppose, for instance, that an application relies\
    \ on a thread-safe structure, with no additional synchronization necessary to\
    \ read or write, but also occasionally needs to read the entire state of the structure\
    \ to get a snapshot:\n\n```\n```scala\nimport scala.collection.concurrent.TrieMap\
    \ // thread-safe\n\nprivate val users = TrieMap.empty[String, UserInfo]\n\nprivate\
    \ val (rlock, wlock) =\n  val lock = ReentrantReadWriteLock()\n  (lock.readLock,\
    \ lock.writeLock)\n\ndef register(username: String): Option[UserInfo] =\n  val\
    \ info = UserInfo(username)\n```\n```"
