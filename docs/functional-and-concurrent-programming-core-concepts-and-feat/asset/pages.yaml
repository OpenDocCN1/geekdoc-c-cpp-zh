- pgno: 71
  md: "In a hybrid application that combines pure functions, impure functions, and\
    \ actions, you need to worry about possible side effects when calling functions\
    \ that are not under your control. The beauty of immutable values is that they\
    \ can be shared safely, knowing that no unexpected side effect can modify them.\n\
    \nAs an illustration, consider an application that keeps track of registered users\
    \ in a mutable set:\n\n```\ntype Directory = mutable.Set[String]\n\ndef register(dir:\
    \ Directory, user: String): Unit = dir += user\n```\n\nListing 3.4: A directory\
    \ as a mutable set; contrast with Lis. 3.5.\n\nUsers are added via a register\
    \ action, which modifies the set.\n\nNow suppose that you need to call a function\
    \ that is not under your control—say, newRegistrations, which calculates the set\
    \ of newly registered users, given an earlier directory:\n\n```\nval yesterdayDir:\
    \ Directory = ...\nval todayDir: Directory = ...\nregister(todayDir, \"new user\
    \ 1\")\nregister(todayDir, \"new user 2\")\nval todayReg = newRegistrations(todayDir,\
    \ yesterdayDir)\n```\n\nThe problem here is that function newRegistrations is\
    \ not necessarily pure. It could be implemented as follows:\n\n```\ndef newRegistrations(newDir:\
    \ Directory, oldDir: Directory): Directory =\n    newDir.subtractAll(oldDir)\n\
    ```\n\nThis implementation removes from the set newDir every user already in the\
    \ set oldDir, and returns newDir. The return value is correct, but the set newDir\
    \ has been modified.\n\nBecause you worry that newRegistrations could be implemented\
    \ like this, you need to make sure that the directories you pass as arguments\
    \ will not be modified. So, you end up calling newRegistrations on copies of your\
    \ directories:\n\n```\nval todayReg = newRegistrations(toDayDir.clone(), yesterdayDir.clone())\n\
    ```"
