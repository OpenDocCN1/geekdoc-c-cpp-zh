  md: 'By contrast, **if-then-else** in a functional programming language is used
    to select *expressions* based on a Boolean condition, and it is itself an expression:


    ```

    if num > 100 then "large" else "small"

    ```


    Listing 3.3: Example of **if-then-else** as an expression; contrast with Lis.
    3.2.


    This line is a value, of type **String**, that is equal to either "large" or "small"
    depending on the condition. You can use this value anywhere a string might be
    used:


    ```

    (if num > 100 then "large" else "small").toUpperCase

    "the number is " + (if num > 100 then "large" else "small")

    println(if num > 100 then "large" else "small")

    ```


    In the last line of this example, the **if-then-else** expression is used as the
    input to action **println**. This has the same effect as the Java program in Listing
    3.2, but proceeds differently: Instead of selecting between two print statements,
    **if-then-else** is used to select between two strings, and the selected string
    is printed. Of course, nothing prevents you from using **if-then-else** to combine
    expressions with side effects. The behavior of Listing 3.2 can also be achieved
    in Scala as follows:


    ```

    if num > 100 then println("large") else println("small")

    ```


