  md: "![](img/74309e2bdd93f68d2e94338a3d73517f_441_0.png)\n\n# Figure 27.1 Possible\
    \ loss of value from concurrent calls to push on a stack.\n\nTo avoid locking,\
    \ you can change top to be an atomic reference and update it using CAS. This way,\
    \ a failed CAS can be used to detect attempts to modify the stack concurrently:\n\
    \n```\nimport java.util.concurrent.atomic.AtomicReference\n\nprivate class Node[A](val\
    \ value: A, var next: Node[A])\n\nfinal class Stack[A]:\n  private val top = AtomicReference[Node[A]]()\n\
    \n  def peek: Option[A] = top.get match\n    case null => None\n    case node\
    \ => Some(node.value)\n\n  def push(value: A): Unit =\n    val node = Node(value,\
    \ top.get)\n    while !top.compareAndSet(node.next, node) do node.next = top.get\n\
    \n@tailrec\ndef pop(): Option[A] = top.get match\n  case null => None\n  case\
    \ node => if top.compareAndSet(node, node.next)\n    then Some(node.value) else\
    \ pop()\n```\n\nListing 27.3: Lock-free implementation of a thread-safe stack\
    \ (Treiber's algorithm)."
