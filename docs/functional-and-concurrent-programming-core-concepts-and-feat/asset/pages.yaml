    \ are accepted.\n\nYou can easily make this server multithreaded to handle multiple\
    \ clients in parallel:\n\n```\nval server = ServerSocket(port)\nval exec   = Executors.newFixedThreadPool(16)\n\
    \nwhile true do\n  val socket = server.accept()\n  exec.execute(() => handleConnection(socket))\n\
    ```\n\nListing 21.4: A server that processes requests concurrently; contrast with\
    \ Lis. 21.3.\n\nIn this variant, when a request comes in, the thread that was\
    \ blocked on method accept does not process it. Instead, it creates a task—as\
    \ a lambda expression—and hands it over to a thread pool. The call to method execute\
    \ is instantaneous, and the thread immediately goes back to method accept to listen\
    \ for more incoming connections, possibly starting new handling tasks in the thread\
    \ pool, which can run in parallel. Listening and accepting connections is all\
    \ the thread does, which is why it is commonly called the listening thread. All\
    \ the actual work of processing requests from clients is done in the thread pool.\n\
    \nAn easy mistake you need to avoid is the temptation to “inline” the socket variable:\n\
    \n```\n// DON'T DO THIS!\nwhile true do\n  exec.execute(() => handleConnection(server.accept()))\n\
    ```"
