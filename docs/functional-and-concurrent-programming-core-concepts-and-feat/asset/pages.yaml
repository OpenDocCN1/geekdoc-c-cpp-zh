    # A.8 Types


    Types in Scala, Java, and Kotlin are similar in many ways. All three languages
    are statically typed but allow for type testing and casting at runtime. They rely
    on interfaces (or traits) and classes as the primary mechanism to introduce user-defined
    types. You can rely on type inference to various degrees—Java does not infer the
    return type of methods, for instance. Function names can be overloaded for ad
    hoc polymorphism, classes and functions can be parameterized by types for parametric
    polymorphism, and dynamic binding of methods implements subtype polymorphism.


    Both Scala and Kotlin let you define type aliases—the same type under different
    names. Java does not. Scala can define opaque types—separate types with identical
    implementations:


    ```

    Scala

    // inside a package

    opaque type Length = Double


    def fromMeters(meters: Double): Length = meters

    def wholeMeters(len: Length): Length = len.ceil


    // outside the package

    val oneInch: Length = fromMeters(0.0254)

    val len: Length = wholeMeters(oneInch)


    wholeMeters(2.3) // rejected at compile time

    ```'
