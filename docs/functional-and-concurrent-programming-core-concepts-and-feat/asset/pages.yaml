- pgno: 194
  md: '+   - Conversely, higher-order functions can be used to generate a collection
    of elements. Functions iterate and unfold, for instance, rely on an initial seed
    and the repeated application of a function to generate a sequence of values.

    +   - Calculations such as minimum, maximum, and sorting, which require element
    comparison, need to be parameterized by the criterion used to compare values.
    Higher-order variants often use a comparison function (e.g., `sortWith`) or a
    mapping into an existing ordered type (e.g., `sortBy`, `maxBy`).

    +   - As an alternative to a comparison criterion for sorting or for minimum/maximum
    calculation, a grouping criterion is sometimes used to collect related elements
    (e.g., `groupBy`).

    +   - Many other higher-order functions exist beside this fundamental core group.
    For instance, the `Observable` class of the RxJava reactive library has more than
    a hundred higher-order methods, some of which deal with error handling, threading,
    or real time, in addition to the core functional transformations discussed in
    this chapter.'
