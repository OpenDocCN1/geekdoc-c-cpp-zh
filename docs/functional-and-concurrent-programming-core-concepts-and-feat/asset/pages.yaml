  md: '# Chapter 12 Lazy Evaluation


    ```

    val iter1 = List(1, 2, 3).iterator

    iter1.find(_ > 1) // Some(2)

    iter1.next() // invalid call

    ```


    A call to find invalidates the iterator. You cannot invoke any method on the iterator
    after that. Similarly, after you use method map, you need to rely on the new iterator
    that is returned; the old iterator on which map was applied is no longer valid.


    In consequence, iterators are well suited to pipelined computations, such as in
    functions collatz and searchFiles. For other uses, you should exercise extreme
    caution. If you want to avoid wasted memory due to memoization, other types are
    sometimes available. In Scala, for instance, views behave like non-memoized streams,
    without the drawbacks of iterators.


    ```

    val iter2 = List(1, 2, 3).iterator

    iter2.map(_ + 1) // a new iterator

    iter2.next() // invalid call

    ```


    Let''s illustrate the differences between lists, streams, and views with a simple
    example. Assume a function times10 that multiplies its input by 10, but also prints
    multiplying on the terminal each time it is invoked—keep track of which operations
    are performed lazily. First, consider the case of plain lists:


    ```

    val list = List(1, 2, 3).map(times10)

    printIn(list)

    printIn(list.head)

    printIn(list.last)

    printIn(list.head)

    ```


    ```

    multiplying

    multiplying

    multiplying

    List(10, 20, 30)

    10

    30

    10

    ```


    The call to method map eagerly applies function times10 on all the list elements
    before the list is even displayed. As the list is queried, there is no further
    computation.'
