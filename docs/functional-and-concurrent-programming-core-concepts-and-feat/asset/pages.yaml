    in a major failure if two threads call take and drain concurrently.


    Consider the scenario from Figure 20.3. A thread T1 invokes method take at the
    same time a thread T2 enters method drain. T1 acquires lock outLock and T2 acquires
    lock inLock. If list out is empty, thread T1 now needs inLock—held by T2—and thread
    T2 needs outLock—held by T1. However, T1 will not release outLock until it locks
    inLock, and T2 will not release inLock until it locks outLock. Both threads are
    stuck waiting for a lock that will never be available. This situation is known
    as a deadlock—a set of threads waiting for each other in a cyclical way. Multiple
    threads acquiring the same set of locks in different orders is a common cause
    of deadlock. Deadlocks are discussed in Section 22.3.


