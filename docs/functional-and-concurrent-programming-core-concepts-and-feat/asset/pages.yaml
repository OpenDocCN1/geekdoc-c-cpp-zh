  md: "```\n```scala\n// inside class File\ndef rmPath(path: List[String]) = this\n\
    ```\n```\n\n# 11.5 Querying\n\nSection 11.4 focused on building and modifying\
    \ trees that represent file systems. Once a tree is built, you can define additional\
    \ methods to query it. Because directories are implemented in terms of lists of\
    \ nodes. For instance, many querying methods can rely on standard higher-order\
    \ functions on lists. For instance, you can calculate the total number of files\
    \ and directories in a system by folding:\n\n```\n```scala\n// inside class Dir\n\
    def fileCount: Int = nodes.foldLeft(0)(_ + _.fileCount)\ndef dirCount: Int = nodes.foldLeft(1)(_\
    \ + _.dirCount)\n// inside class File\ndef fileCount: Int = 1\ndef dirCount: Int\
    \ = 0\n```\n```\n\nListing 11.4: Example of using fold to count nodes in a general\
    \ tree.\n\nIn a directory, the total number of files is obtained by folding the\
    \ list of nodes with a function that adds the number of files of each node to\
    \ an accumulator, initially 0. In a file, the total number of files is 1—the file\
    \ itself. The total number of directories is calculated using a similar approach,\
    \ except that folding a directory starts with 1—the directory itself—and files\
    \ are counted as 0 instead of 1.\n\nYou can also define your own higher-order\
    \ methods on file systems for easier querying. For instance, fileExists and dirExists\
    \ are used to assert the existence of files or directories that satisfy a given\
    \ criterion.\n\n```\n```scala\n// inside class Dir\ndef fileExists(test: File\
    \ => Boolean): Boolean =\n  nodes.exists(_.fileExists(test))\ndef dirExists(test:\
    \ Dir => Boolean): Boolean =\n  test(this) || nodes.exists(_.dirExists(test))\n\
    ```\n```\n\n> A nodeExists method is also possible but would imply that type Node\
    \ is public. The code presented in this chapter is predicated on the assumption\
    \ that the Node trait remains private."
