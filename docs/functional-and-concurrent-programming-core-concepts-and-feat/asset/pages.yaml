    # 20.5 Summary


    First-in-first-out queues can be implemented in terms of two lists and the implementation
    made thread-safe by locking. The simplest approach is to use a single lock to
    guard both lists. The lock can be public—enabling client-side locking—or private.
    A possible mistake is to release and then reacquire the lock in the middle of
    a compound operation, like check-then-act, thus breaking atomicity. Instead, you
    want to hold the lock for the duration of the entire operation.


    However, unnecessarily holding locks that are not needed can prevent other threads
    from performing operations that could potentially be done in parallel. In general,
    code should strive to release locks as soon as they are not needed, especially
    before starting lengthy operations.


    Querying methods like isEmpty are of limited use on concurrent data structures
    without client-side locking: By the time the value they return is used, the lock
    has been'
