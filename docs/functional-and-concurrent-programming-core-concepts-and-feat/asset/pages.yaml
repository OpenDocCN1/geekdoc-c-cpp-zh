- pgno: 204
  md: "```\ndef fileCount(dir: Dir): Int = dir.fileFold(0)((acc, _) => acc + 1)\n\
    def dirCount(dir: Dir): Int = dir.dirFold(0)((acc, _) => acc + 1)\n```\n\nYou\
    \ can also use fileFold to find the longest file name in a tree:⁵\n\n```\ndef\
    \ longestFilename(dir: Dir): String = dir.fileFold(\"\") { (longest, file) =>\n\
    \  if file.name.length > longest.length then file.name else longest\n}\n```\n\n\
    Likewise, you can use dirFold to build a list of all the file names in a file\
    \ system:\n\n```\ndef allFileNames(dir: Dir): List[String] =\n  dir.dirFold(List.empty[String])((list,\
    \ subdir) => subdir.lsFiles ::: list)\n```\n\nBe careful, however: Folding functions\
    \ are not well suited to implementing searches because they always traverse the\
    \ entire tree,⁶ even after an element has been found. For instance, this implementation\
    \ of a fileFind method is undesirable:\n\n```\n// DON'T DO THIS!\n\n// inside\
    \ class Dir\ndef fileFind(test: File => Boolean): Option[File] =\n  fileFold(Option.empty[File])\
    \ { (found, file) =>\n    found.orElse(if test(file) then Some(file) else None)\n\
    \  }\n```\n\nThe drawback of this method is that it continues to traverse the\
    \ tree after a suitable file has been found.⁷\n\nTo make fileFind stop once a\
    \ file has been found, while keeping a functional programming style, is not completely\
    \ straightforward. Given that we implemented fileExists by using exists on a list\
    \ and fileFold by using foldLeft on a list, you might be tempted to implement\
    \ fileFind by using find on a list. The problem is that applying find to a list\
    \ of subtrees will produce a tree (if any) in which the desired file can be found,\
    \ but not the file itself. You would need to search this tree again, using fileFind,\
    \ to extract the file:\n\n⁵The body of the function could also be written as Seq(file.name,\
    \ longest).maxBy(_.length).\n\n⁶Short of throwing an exception. Throwing (and\
    \ catching) an exception is sometimes used as a technique to prematurely terminate\
    \ a folding computation.\n\n⁷Even though all the files are visited, this implementation\
    \ stops applying the test function after a file has been found. This is because,\
    \ when orElse is applied to a non-empty option, the expression used as its argument\
    \ is not evaluated. This phenomenon is known as lazy or delayed evaluation, and\
    \ is explored in Chapter 12."
  merge: -1
  img_proc: true
- pgno: 205
  md: "```\n// DON'T DO THIS!\n\n// inside class Dir\ndef fileFind(test: File => Boolean):\
    \ Option[File] =\n  nodes.find(_.fileExists(test)).map(_.fileFind(test).get)\n\
    ```\n\nThis implementation uses find to search for a node that contains the desired\
    \ file. If found, map is invoked on the option to apply fileFind on this node\
    \ to get the actual file. This is undesirable because the node inside the option\
    \ has already been searched for the file and indeed contains it (the call to fileFind\
    \ is guaranteed to succeed, hence the use of get to get the actual file). The\
    \ node is thus searched twice and, because of the recursive nature of findFile,\
    \ inner nodes end up being searched multiple times (the deeper the node, the more\
    \ times it is searched).\n\nInstead of using find to locate a subtree that contains\
    \ a suitable file, a better strategy is to extract the desired file from each\
    \ subtree by using the method map of lists. The expression nodes.map(_.fileFind(test))\
    \ has type List[Option[File]] and contains an acceptable file (if any) for each\
    \ subtree. Method find can then be used to find a non-empty option from the list.\
    \ The expression nodes.map(_.fileFind(test)).find(_.nonEmpty) produces the desired\
    \ file, but as an Option[Option[File]], which can be flattened:\n\n```\n// DON'T\
    \ DO THIS!\n\n// inside class Dir\ndef fileFind(test: File => Boolean): Option[File]\
    \ =\n  nodes.map(_.fileFind(test)).find(_.nonEmpty).flatten\n```\n\nThe problem\
    \ with this approach is that map will process the entire list of nodes no matter\
    \ what, and all the nodes inside a directory are searched, even after a file has\
    \ been found. The standard technique to avoid this issue is to introduce a form\
    \ of lazy evaluation:\n\n```\n// OK, but can be improved\n\n// inside class Dir\n\
    def fileFind(test: File => Boolean): Option[File] =\n  nodes.view.map(_.fileFind(test)).find(_.nonEmpty).flatten\n\
    ```\n\nBy calling higher-order method map on nodes.view instead of nodes, you\
    \ prevent nodes from being explored after a file has been found. Lazy evaluation\
    \ is discussed in detail in Chapter 12. For now, it is enough to know that the\
    \ implementation in the example stops when the first file is found (or traverses\
    \ the entire tree if no file can be found)."
  merge: -1
