- pgno: 468
  md: 'This is the very last code illustration of the book, but certainly not its
    simplest. You can follow it step by step. A cache is allocated as a thread-safe
    mapping from inputs to pairs. Each pair contains a future and the timeout associated
    with it. Method `compute` simply returns the future produced by `searchCache`,
    which proceeds with the cases outlined earlier, in the same order.


    In the first case, no future is found in the cache. Therefore, you must initiate
    a new computation. You create a promise and try to add it to the cache. If the
    promise is added, you use `doCompute` to start the computation. The `else` branch
    deals with the case where another thread added a promise to the cache before you
    could (see discussion of Listing 25.7 in Section 25.6), in which case you need
    to consider it with a recursive call to `searchCache` [the same thing happens
    in case 3(b)].


    The next case in `searchCache` finds a successful completed future and returns
    it unchanged. (Function `hasResult` is hard to read: It returns true if a future
    is finished, its computation didn’t throw an exception, and the option it produced
    is non-empty.)


    The third case deals with a future that is either failed or incomplete. If the
    future is associated with a timeout value larger than what the current invocation
    of `compute` is allowed [case 3(a)], you use it without starting a new computation.
    You simply add a timeout to the existing future in case its remaining run is longer
    than the timeout argument used in the call to `compute`.


    This leaves case 3(b): You find a future—failed or incomplete, it doesn’t matter—but
    its timeout is smaller than what you can afford to spend in the current call to
    `compute`. In this case, you create a promise for a new computation, as in case
    1, and use it to replace the existing cached future. Once the new future is in
    the cache, you initiate its computation. The only difference from case 1 is that,
    to the list of futures created from the strategies, you add the older future that
    you found in the cache (this is done with `++ future` at the beginning of function
    `doCompute`).


    To implement function `doCompute`, used in cases 1 and 3(b), you proceed as in
    Listing 28.6: Use `findFirst`, flatten, add a timeout, and cancel all remaining
    tasks upon completion. However, instead of returning the future produced by `findFirst`
    directly, you use it to complete the promise that is already in the cache.


    In summary, this caching runner treats existing futures in the cache in one of
    two ways. If a future cannot possibly be improved—it is finished with a successful
    value or it is based on a larger timeout—it is used. Otherwise, it is replaced
    by a future that cannot possibly be worse.⁸ This new future is completed as soon
    as the existing future terminates successfully or later based on new strategy
    calls. It is no worse than the previous future, because it produces a successful
    outcome at the same time if the original future is successful or keeps running
    and may still produce a successful value after the original future has failed.


    ⁸Ignoring the possibility that starting new computations slows down existing ones
    given limited computing resources.'
