  md: '# 15.1 Typing Strategies


    This behavior is noteworthy in two ways:


    +   - Compilation is successful, and code is being generated. Parts of the program
    do run. The program even displays the titles of book1 and book2 before failing.
    The error takes place at runtime. If the faulty code resides in a branch of the
    program that is not executed, the mistake remains undetected.

    +   - The error is not so much about number 42 having the wrong type—not being
    a book—but more that it is missing a title attribute—somewhat like in the second
    Scala program. This suggests that the runtime system would be satisfied with a
    non-book value, as long as it has a title (see the discussion of structural typing
    in Section 15.6).


    The difference between static and dynamic typing is pretty clear: One checks types
    (mostly) at compile time; the other (mostly) at runtime. The distinction between
    strong and weak typing, however, is less clear. It usually revolves around how
    strict or loose a compiler is with types, but unequivocally placing a language
    in the “strong” or “weak” camp can be hard. For instance, many consider Python
    to be a strongly—albeit dynamically—typed language. However, consider this valid
    Python code:


    ```

    book_or_string = book

    ... # use variable book_or_string as a book

    book_or_string = "Le Comte de Monte-Cristo"

    ... # use variable book_or_string as a string

    ```


    The Scala equivalent does not work:


    ```

    var bookOrString = book

    bookOrString = "Le Comte de Monte-Cristo" // rejected by the compiler

    ... // use variable bookOrString as a book

    ```


    In Scala, variable bookOrString is given type Book by the compiler, and the second
    assignment is rejected. Python, by contrast, does not assign a type to variable
    book_or_string, and allows it to be assigned with values of different types at
    different times. Accordingly, you could argue that Scala’s typing is stronger
    than Python’s. However, if price is defined as a number, the expression book.title
    + ": " + price is accepted by Scala, but rejected by Python:


    ```

    TypeError: can only concatenate str (not "float") to str

    ```'
