  md: "# # Chapter 3\n\n# Immutability\n\nFunctional programming is inspired by mathematical\
    \ functions, which are not contingent on any notion of mutation, or state change,\
    \ or variable assignment. A functional programming style favors immutable data.\
    \ Imperative code based on mutation is replaced with programs that combine immutable\
    \ values into expressions. In particular, series of immutable values are used\
    \ as a substitute for the mutable data structures typical of imperative programs.\n\
    \n# ## 3.1  Pure and Impure Functions\n\nMathematical functions were characterized\
    \ earlier as mappings of values from an input set to values in an output set.\
    \ For instance, an absolute value function maps integers (of any sign) to non-negative\
    \ natural numbers. Programming language functions are constructs that can represent\
    \ mathematical functions, but they are not limited to this purpose. You can implement\
    \ the mathematical absolute value function as a function of your favorite language—as\
    \ we did earlier in Java, JavaScript, Python, Kotlin, and Scala¹—but you can also\
    \ write “functions” that perform I/O, interact with users and devices, block threads,\
    \ or modify the state of an application in some arbitrary way.\n\nAt this point,\
    \ I need to introduce some terminology to avoid writing about functions and “functions”\
    \ for the remainder of the book. A standard way to refer to a programming function\
    \ that represents a mathematical function is to say that the function is pure.\
    \ Pure functions are characterized by two properties. First, their output is entirely\
    \ determined by their input. In particular, when invoked multiple times on the\
    \ same input, a pure function always produces the same output.² Second, pure functions\
    \ do not modify the state of a system (or the state of its environment). These\
    \ modifications are known as side effects: In addition to producing an output\
    \ value, as is proper for a function, code with side effects modifies existing\
    \ data. Functions that do not satisfy these two properties are said to be impure.\
    \ Most programming languages let you write both pure and impure functions.\n\n\
    > ¹ The functions from Chapter 2 do not implement the mathematical absolute value\
    \ function because their domain is not the infinite set of integers with the usual\
    \ addition and subtraction operations, but rather a different set of 32-bit values\
    \ with 2’s complement arithmetic. Still, they implement a mathematical function,\
    \ just not the standard absolute value.\n> \n> ² Input here is to be understood\
    \ as an input value. When invoked multiple times on the same mutable object, a\
    \ pure function could still produce different outputs because the object—and thus\
    \ the input—has changed."
