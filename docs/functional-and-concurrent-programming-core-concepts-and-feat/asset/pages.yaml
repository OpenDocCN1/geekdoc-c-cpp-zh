- pgno: 221
  md: "and finally the desired list of long words. These intermediate lists have to\
    \ be allocated in memory, then garbage-collected, which is not free.\n\nIn Section\
    \ 10.4, we discussed a possible approach to avoid this problem: Replace a pipeline\
    \ of higher-order functions with a single fold. You might recall that this change\
    \ did not improve code readability. In the case of longWords, it is even worse:\n\
    \n```\ndef longWords(lines: List[String], min: Int): List[String] =\n  lines.foldRight(List.empty[String])\
    \ { (line, words) =>\n    line.split(' ').foldRight(words) { (word, moreWords)\
    \ =>\n      val cleanWord = clean(word)\n      if cleanWord.length >= min then\
    \ cleanWord :: moreWords else moreWords\n    }\n  }\n```\n\nDon't bother trying\
    \ to understand this function. It is here to show you that the problem can indeed\
    \ be solved by using foldRight, but the resulting code is difficult to read—certainly\
    \ much harder than the flatMap/map/filter variant.\n\nA better strategy that avoids\
    \ the intermediate lists is to keep using flatMap, map, and filter, but on streams\
    \ instead of lists:\n\n```\ndef longWords(lines: List[String], min: Int): List[String]\
    \ =\n  lines.to(LazyList)\n    .flatMap(_.split(' '))\n    .map(clean)\n    .filter(_.length\
    \ >= min)\n    .toList\n```\n\nThe initial list of lines is converted into a stream.\
    \ Because streams are lazily evaluated, calls to flatMap, map, and filter do not\
    \ trigger any computation, and in particular, do not create intermediate lists.\
    \ The final call to toList forces an evaluation of the last stream and produces\
    \ the desired list without allocating any intermediate list.\n\nThis approach\
    \ is particularly popular in Java, where the Stream class implements all the necessary\
    \ higher-order methods but collections like List do not. You would write the longWords\
    \ function in Java as follows:\n\n```\nList<String> longWords(List<String> lines,\
    \ int min) {\n  return lines.stream()\n    .flatMap(line -> line.replace(' ',\
    \ '\\n').lines())\n    .map(word -> clean(word))\n    .filter(word -> word.length()\
    \ >= min)\n    .toList();\n}\n```"
