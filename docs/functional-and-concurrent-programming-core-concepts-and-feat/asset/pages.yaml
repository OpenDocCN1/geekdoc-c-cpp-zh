- pgno: 72
  md: 'Unless you know for sure that **newRegistrations** does not modify its arguments,⁶
    you cannot dispense with the calls to **clone**, sometimes known as *defensive
    copies*. The sad part of this story is that it also possible—likely, even—that
    **newRegistrations** is implemented as a pure function. In that case, the defensive
    copies are entirely wasted.


    Wasted defensive copies are actually quite common⁷ in large applications that
    depend on a multitudes of libraries. You can avoid them by using immutable directories
    instead:


    ```

    ```scala

    type Directory = Set[String]


    def register(dir: Directory, user: String): Directory = dir + user

    ```

    Listing 3.5: A directory as an immutable set; contrast with Lis. 3.4.

    ```


    Registration relies on a pure function that produces a new set of registered users,
    but does not modify its input. You can use an immutable directory in an application
    as follows:


    ```

    ```scala

    val yesterdayDir: Directory = ...

    var todayDir: Directory      = ...

    todayDir = register(todayDir, "new user 1")

    todayDir = register(todayDir, "new user 2")

    val todayReg = newRegistrations(todayDir, yesterdayDir)

    ```

    ```


    Function **newRegistrations** can be called on directories directly, without cloning—immutable
    sets do not even have a public **clone** method in Scala. There is no danger of
    a side effect inside **newRegistrations** modifying them: They are immutable!


    Note that the application is not written in a functional style: It uses assignment
    statements as side effects and sequential composition to chain modifications.
    Still, the imperative code benefits from using immutable directories by avoiding
    unnecessary defensive copies.


    You might argue that no one in their right mind would implement the function **newRegistrations**
    by modifying the input set. Maybe. But can you rely on a stance that all libraries
    should use reasonable code? In an ideal world, you would depend on documentation
    to confirm that **newRegistrations** has no side effects. But how often have you
    found library documentation to be deficient?


    ⁶This includes tomorrow’s implementation of the function. So, if the function
    is not under your control, checking the source code is not enough. You need some
    guarantees, typically in the documentation, that the function not only *is* but
    *will remain* pure.


    ⁷It can also be the case that you are calling a method that stores its arguments
    and makes its own defensive copies because it worries that the arguments might
    be modified after the call. In the worst case, you may end up cloning objects
    both on the calling side and inside the code that is called. Paradoxically, sharing
    immutable objects often results is less memory allocation, not more.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "# 3.9 Updating Collections of Mutable/Immutable Objects\n\nAs noted earlier,\
    \ a non-reassignable variable can refer to an immutable object or a mutable object.\
    \ In the same way, an immutable structure, like a functional list or a persistent\
    \ set, can contain mutable or immutable objects. This has an impact on how you\
    \ update a state that uses those structures.\n\nConsider the following scenario\
    \ as an illustration. Data is represented as immutable lists of Load objects.\
    \ Each Load object has a weight, which can be reduced by one. A mutable variant\
    \ of Load implements two methods:\n\n```\ntrait Load:\n  def weight: Int    //\
    \ current weight\n  def reduce(): Unit // reduce load weight by one\n```\n\nListing\
    \ 3.6: Example of a mutable type; contrast with Lis. 3.7.\n\nAn application needs\
    \ to perform an operation that reduces the weight of all the loads in a list by\
    \ one. You can implement it as follows:\n\n```\ndef reduceAll(loads: List[Load]):\
    \ List[Load] =\n  for load <- loads do load.reduce()\n  loads\n```\n\nEven though\
    \ the list is immutable, its contents are being modified. However, the same list,\
    \ containing the same objects, is returned.\n\nAlternatively, you could implement\
    \ loads as an immutable type:\n\n```\ntrait Load:\n  def weight: Int    // current\
    \ weight\n  def reduced: Load // a reduced load, with a weight reduced by one\n\
    ```\n\nListing 3.7: Example of an immutable type; contrast with Lis. 3.6.\n\n\
    The weight method is unchanged from before. However, since loads are now immutable,\
    \ the reduce action is replaced with a reduced function without side effects,\
    \ which produces a new load with a reduced weight. You can no longer implement\
    \ the function reduceAll by modifying the loads. Instead, new load objects must\
    \ be created and then"
