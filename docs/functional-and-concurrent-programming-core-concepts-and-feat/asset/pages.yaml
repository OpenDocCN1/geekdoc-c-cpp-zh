- pgno: 385
  md: 'Methods wait, notify, and notifyAll can also be modeled according to their
    Java semantics:


    Wait(t) ≜ waitSet′ = waitSet ∪ {t}

    Notify ≜ IF waitSet = {} THEN UNCHANGED waitSet

    ELSE ∃t ∈ waitSet : waitSet′ = waitSet \ {t}

    NotifyAll ≜ waitSet′ = {}


    Again, the details are beyond the scope of this note, but you can see that wait
    adds a thread t to the set of waiting threads—in TLA⁺, the notation waitSet′ =
    … means “the new value of waitSet is ….” Similarly, notifyAll removes all the
    threads from the waiting set, making the set empty. The representation of method
    notify is a little more complex. It basically says that if the set of waiting
    threads is empty, nothing happens and the set is unchanged. Otherwise, a thread
    t is removed from the set. The existential quantifier is used to represent the
    fact that method notify does not specify which thread is being removed—some thread
    is taken out of the set.


    Given these mathematical definitions—and a few other elements omitted here—a model-checker
    can be run. A basic model-checker simply tries to enumerate all possible ways
    threads might interleave their actions until all possibilities have been checked
    or an error is found.


    On the blocking queue, a model-checker can produce the deadlock scenario shown
    Figure 23.1. In this scenario, a queue has a capacity of two and is shared among
    three producing threads—p1, p2, and p3—and two consuming threads c1 and c2. Initially,
    the queue is empty and all the threads are running. The producers start calling
    method put until the queue is full (state 3). The next three calls to put result
    in producers calling wait and being added to the set of waiting threads (state
    6). Consumers start calling method take, notifying a producer each time, until
    the queue is empty (state 8). They keep calling take until they are all added
    to the waiting set (state 10). Interestingly, at this point, the set contains
    both producing and consuming threads.


    In state 11, a producer—p2 or p3—adds an element into the queue, and as a result
    calls notify. The intent of this call to notify is to let a consumer know that
    a value has been added to the queue. However, thread p1—a producer—is taken out
    of the set instead. The queue is again filled (state 12), resulting in the producers
    being blocked in the waiting set (state 15). At this point, thread c1 is the only
    running thread. It consumes a first element from the queue and notifies p1 (state
    16). It then takes the second element from the queue but notifies consumer c2
    instead of a producer (state 17). Both consumers then block on the empty queue,
    leaving only thread p1 to run (state 19). This thread puts a value in the queue
    but notifies p2 instead of a consumer.'
