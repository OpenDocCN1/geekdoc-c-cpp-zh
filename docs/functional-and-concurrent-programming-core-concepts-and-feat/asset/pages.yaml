- pgno: 262
  md: "specify which operations are available on a book. In object-oriented languages,\
    \ this is often done by defining a class (or a trait/interface):\n\n```\ncase\
    \ class Book(title: String, author: String, pageCount: Int)\n```\n\nThis defines\
    \ a Book type with three functionalities: title, author, and page count. This\
    \ class implements books as simple records⁴ of two strings and an integer, but\
    \ of course other implementations are possible:\n\n```\nclass Book(pages: Seq[String]):\n\
    \  def title: String = pages(0)\n  def author: String = pages(1)\n  def pageCount:\
    \ Int = pages.length\n```\n\nIn this variant, a book is implemented as a sequence\
    \ of pages, with the assumption that the first page is the title and the second\
    \ page is the author. The implementation has changed, but the type is the same\
    \ as before. You can also define a Book type independently from how books are\
    \ implemented:\n\n```\ntrait Book:\n  def title: String\n  def author: String\n\
    \  def pageCount: Int\n```\n\nThe functionalities offered by the Book type are\
    \ specified, but not implemented.\n\nWhen viewed as collections of services, undesirable\
    \ types are not so much large sets—like Any—but rather interfaces that fail to\
    \ include necessary information, or, contrariwise, bloated interfaces with too\
    \ many methods, or even interfaces that leak irrelevant implementation-specific\
    \ details.\n\n# 15.4 Abstract Data Types\n\nThese two views—sets and services—form\
    \ the basis of a formal definition of types known as abstract data types (ADT).\
    \ An abstract data type is defined as a set of values, together with operations\
    \ on those values.⁵ The behavior of these operations is specified, but no implementation\
    \ is given (hence the name abstract).\n\n⁴In Scala, the constructor arguments\
    \ of a case class are all available as public services. This chapter uses case\
    \ classes for the sake of compactness, but regular classes could be used instead.\n\
    ⁵Similarly, in mathematics, sets are augmented with laws, which are obeyed by\
    \ their elements, to become algebraic structures, like groups and fields. The\
    \ sets of integers, for instance, must satisfy laws that state x + y = y + x,\
    \ x + (y + z) = (x + y) + z, x + 0 = x, and x + (−x) = 0, for all x, y, and z,\
    \ making it an abelian group."
