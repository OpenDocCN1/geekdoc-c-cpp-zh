  md: "# Figure 22.1 Possible deadlock of the incorrect box implementation in Lis.\
    \ 22.3.\n\nThis problem is easy to fix. There is no need for a thread inside method\
    \ get to access the contents of the box until the latch is open. Therefore, the\
    \ thread should wait on the latch first. (As a synchronizer, a latch is obviously\
    \ thread-safe and can be accessed without locking.) Then, after the latch is open,\
    \ the thread can lock the box to access its contents:\n\n```\nScala\nclass SafeBox[A]:\n\
    \  private var contents = Option.empty[A]\n  private val filled   = CountDownLatch(1)\n\
    \n  def get: A =\n    filled.await()\n    synchronized(contents.get)\n\n  def\
    \ set(value: A): Boolean = synchronized {\n    if contents.nonEmpty then false\n\
    \    else\n      contents = Some(value)\n      filled.countDown()\n      true\n\
    \  }\n```\n\n# Listing 22.4: Thread-safe box with a latch; fixed from Lis. 22.3;\
    \ see also Lis. 27.2.\n\nThe implementation of set is left unchanged. Since countDown\
    \ is a fast, non-blocking operation, you can call it while holding the lock.\n\
    \nDevelopers who are new to concurrent programming might think it strange, but\
    \ you can also implement method set in this way:"
