- pgno: 502
  md: '**expression** A code fragment that, through computation, evaluates to a value.
    In addition to expressions, programming languages may involve code without a value,
    evaluated for the purpose of side effects.


    **extension method** A mechanism by which additional methods can be grafted onto
    an existing type. Discussed in Section 2.5.


    **FIFO** First-in, first-out.


    **function** 1. A mathematical abstraction that maps each value from a set to
    a unique value from another set. 2. A programming language subroutine parameterized
    by zero or more arguments and which produces a value. For disambiguation, see
    pure, side effect. Discussed in Chapter 2.


    **function literal** An expression that denotes an unnamed function; also called
    *anonymous function*. **Lambda expressions** are a common syntax for function
    literals. Discussed in Section 9.3.


    **functional** Variously defined by different authors, but often said of a programming
    style that emphasizes the use of **pure functions, immutability, recursion, algebraic
    data types, higher-order** functions, and/or **lazy** evaluation. Discussed in
    Chapter 1.


    **future** A handle on an asynchronous computation. Futures vary in capabilities,
    and terminology is ambiguous. Futures are sometimes referred to as *promises*.
    Discussed in Chapters 25 and 26.


    **garbage collection** A form of automatic memory management used to reclaim unused
    memory. The Java Virtual Machine implements a garbage collector, available to
    all languages that run on this platform.


    **happens-before** The partial order that defines the Java Memory Model. Note
    that “happens before” and “happens-before” have a different meaning in the book.
    Discussed in Section 22.5.


    **higher-order** Said of a **function** that consumes or produces other functions
    as values. Discussed in Chapters 9 and 10.


    **immutable** That which cannot be changed. This term can apply to an **object**
    state (immutable object) or a non-reassignable **variable**. See also **mutable**.
    Discussed in Chapter 3.


    **imperative** Said of a programming style centered on **actions** that modify
    a state, such as assignment statements. By contrast, **functional** programming
    is said to be more declarative. See also **pure, side effect**.


    **infix** Said of a notation in which an **operator** appears between its two
    arguments, as in `x + y`. See also **prefix, postfix**.'
