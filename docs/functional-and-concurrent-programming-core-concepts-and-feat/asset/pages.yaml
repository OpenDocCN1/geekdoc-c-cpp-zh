- pgno: 118
  md: "last—case Nil and if isEmpty(tail)—and the recursive call then simply follows\
    \ the equality.\n\nEvery recursive algorithm is founded on such an equality. For\
    \ instance, the size of a tree equals the sum of the sizes of the children, plus\
    \ one; and the good old factorial implementation discussed earlier is based on\
    \ the equality n! = n × (n − 1)!. To become fluent in recursive programming, you\
    \ need to learn to identify these equalities.\n\nA frequent list pattern involves\
    \ calculating a function f on a list by using a single recursive call on the tail\
    \ of the list:\n\n```\nf(list) = g(f(tail(list)))\n```\n\nYour goal is to calculate\
    \ f(list), and you have the value f(tail(list)) to work with. You get this value\
    \ for free by the “magic” of recursion. Your job is to formulate and implement\
    \ function g.\n\nIn the case of function last, g is the identity function, and\
    \ f(list) is simply f(tail(list)). Many of the examples that follow rely on a\
    \ function g, which may or may not be written explicitly. For instance, function\
    \ contains in Listing 7.1, which searches for a target in a list, uses g(x) =\
    \ (head(list)==target) || x. Function length in Listing 7.3, which calculates\
    \ the length of a list, uses g(x) = x + 1.\n\nOnce you figure out the general\
    \ equality, the recursive function usually follows straightforwardly. All you\
    \ need is to take care of the special cases where the equality does not hold.\
    \ They become the non-recursive cases of the computation, like short lists in\
    \ function last, or zero in factorial. The equality itself defines the recursion.\
    \ The next several sections illustrate this principle by looking at typical list\
    \ calculations and by deriving for each a recursive function from an equality\
    \ and one or more special cases.\n\n# 7.2 Traversing Lists\n\nInstead of traversing\
    \ an entire list to reach its last element, you could have a specific target in\
    \ mind and traverse a list until you find the element you are looking for. Function\
    \ contains tests whether a target value is in a list: The target is in the list\
    \ if it is at the head of the list or else if it is somewhere inside the tail.\
    \ This suggests the following recursive equality:\n\n```\ncontains(list, target)\
    \ = head(list) == target || contains(tail(list), target)\n```\n\nThe equality\
    \ is ill defined for the empty list, which has neither head nor tail, and which\
    \ needs to be treated as an easy special case (the empty list contains nothing):\n\
    \n```\n@tailrec\ndef contains[A](list: List[A], target: A): Boolean =\n  !isEmpty(list)\
    \ && (head(list) == target || contains(tail(list), target))\n```\n\nListing 7.1:\
    \ Simple list lookup, using tail recursion; see also Lis. 7.2."
