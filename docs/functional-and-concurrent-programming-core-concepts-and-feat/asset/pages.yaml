  md: "The other common—but mistaken—strategy you want to avoid is busy-waiting. In\
    \ this pattern, a thread continuously polls the state of the activity it is waiting\
    \ on. For instance, a counter could be introduced to keep track of tasks as they\
    \ terminate:\n\n```\nval shared      = SafeStringList()\nvar terminated = 0\n\n\
    def addStrings(n: Int, str: String): Unit =\n  n times shared.add(str)\n  terminated\
    \ += 1\n\nexec.execute(() => addStrings(5, \"T1\"))\nexec.execute(() => addStrings(5,\
    \ \"T2\"))\n\n// DON'T DO THIS!\nwhile terminated < 2 do ()\n\nassert(shared.size\
    \ == 10)\n```\n\nBased on our earlier discussion of shared accesses and locks,\
    \ we already know that this program is flawed: Mutable variable terminated is\
    \ shared by multiple threads without locking. In particular, both threads could\
    \ finish their task at the same time and execute terminated += 1 concurrently,\
    \ which we know to be unsafe.\n\nHowever, adding the necessary locking is not\
    \ the solution:\n\n```\nval shared      = SafeStringList()\nvar terminated = 0\n\
    val lock        = Object()\n\ndef addStrings(n: Int, str: String): Unit =\n  n\
    \ times shared.add(str)\n  lock.synchronized(terminated += 1)\n\nexec.execute(()\
    \ => addStrings(5, \"T1\"))\nexec.execute(() => addStrings(5, \"T2\"))\n\n// DON'T\
    \ DO THIS!\nwhile lock.synchronized(terminated) < 2 do ()\n\nassert(shared.size\
    \ == 10)\n```\n\nVariable terminated is now always accessed with a lock. As written,\
    \ the program does guarantee that the main thread waits for both tasks to finish\
    \ before calling method"
