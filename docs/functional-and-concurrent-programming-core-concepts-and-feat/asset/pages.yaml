    it easier to handle null values. The operator "?" applies a method to a non-null
    reference, or returns null, but does not throw NullPointerException. It replaces
    the use of map and flatMap on options in Scala. On its Option type, Scala also
    define methods like orElse and getOrElse that take an unevaluated argument, to
