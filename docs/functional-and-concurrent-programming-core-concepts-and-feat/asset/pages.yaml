  md: 'are described in detail in Chapter 27. For now, we will focus on a functional-concurrent
    programming style that uses futures through higher-order functions without blocking.
    It departs from the more familiar reliance on synchronizers and as such takes
    some getting used to. Once mastered, it is a powerful way to arrange concurrent
