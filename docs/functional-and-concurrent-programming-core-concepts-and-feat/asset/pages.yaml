  md: "You can use “<:” to specify an upper bound, meaning that you require a type\
    \ variable to be a subtype of another type. You can use the opposite operator\
    \ “>:” to specify a lower bound, requiring a type variable to be a supertype of\
    \ another type:\n\n```\n```scala\ndef addMagazine[A >: Magazine](pubs: Set[A]):\
    \ Unit = pubs += Magazine(...)\n```\n```\n\nListing 15.8: Example of a lower type\
    \ bound for use-site variance.\n\nFunction `addMagazine` adds a magazine to a\
    \ mutable set, requiring type `A` to be a supertype of `Magazine`. The function\
    \ is flexible, and you can call it on values of type `Set[Magazine]`, `Set[Publication]`,\
    \ or `Set[AnyRef]`.\n\nWhen you use type bounds, you face constraints similar\
    \ to what we saw earlier with covariant and contravariant types. For instance,\
    \ these functions are rejected by the compiler:\n\n```\n```scala\ndef printTitlesAndAddMagazine[A\
    \ <: Publication](pubs: Set[A]): Unit =\n  for pub <- pubs do println(pub.title)\n\
    \  pubs += Magazine(...) // rejected by the compiler\n\ndef printTitlesAndAddMagazine[A\
    \ >: Magazine](pubs: Set[A]): Unit =\n  for pub <- pubs do println(pub.title)\
    \ // rejected by the compiler\n  pubs += Magazine(...)\n```\n```\n\nThe first\
    \ function is rejected because it attempts to add a magazine to a `Set[A]` value,\
    \ but all you know is that type `A` is a subtype of `Publication`. There is no\
    \ guarantee that type `A` is a supertype of type `Magazine`—it could be `Book`,\
    \ for instance. The second function fails because it tries to invoke a `title`\
    \ method on a value of type `A`, but `A` is only known to be a supertype of `Magazine`,\
    \ not necessarily a subtype of `Publication`—type `A` could be `AnyRef`, for instance.\
    \ To make it work, `printTitlesAndAddMagazine` needs `A` to be both a subtype\
    \ of `Publication` and a supertype of `Magazine`. You implement it by specifying\
    \ both a lower bound and an upper bound:\n\n```\n```scala\ndef printTitlesAndAddMagazine[A\
    \ >: Magazine <: Publication](pubs: Set[A]): Unit =\n  for pub <- pubs do println(pub.title)\n\
    \  pubs += Magazine(...)\n```\n```\n\nListing 15.9: Example of a type parameter\
    \ with both lower and upper bounds.\n\nIn more complex scenarios, you can combine\
    \ type bounds with type intersections to specify multiple upper or lower bounds:"
