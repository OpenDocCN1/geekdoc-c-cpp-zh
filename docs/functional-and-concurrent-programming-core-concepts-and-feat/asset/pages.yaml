  md: "number *N*. In the server example, a client might obtain data from *N* database\
    \ queries, which are executed in parallel:\n\n```\n```scala\ndef queryDB(requests:\
    \ List[Request]): Future[Page] =\n  val futures: List[Future[Data]] = requests.map(request\
    \ => Future(dbLookup(request)))\n  val dataListF: Future[List[Data]] = Future.sequence(futures)\n\
    \  dataListF.map(makeBigPage)\n```\n```\n\nThe first line uses `map` to create\
    \ a list of database-querying tasks, one for each request. These tasks, which\
    \ run in parallel, form a list of futures. The key step in `queryDB` is the call\
    \ to `Future.sequence`. This function uses an input of type `List[Future[A]]`\
    \ to produce an output of type `Future[List[A]]`. The future it returns is completed\
    \ when all the input futures are completed, and it contains all their values as\
    \ a list (assuming no errors). Invoking `Future.sequence` serves the same purpose\
    \ as the “join” part of a fork-join pattern, but does so without blocking. The\
    \ last step uses a function `makeBigPage` from `List[Data]` to `Page` to build\
    \ the final page.\n\nAs of this writing, there is no standard sequence function\
    \ for `CompletableFuture`, but you can implement your own using `thenCompose`\
    \ (equivalent to `flatMap`) and `thenApply` (equivalent to `map`):\n\n```\n```scala\n\
    def sequence[A](futures: List[CompletableFuture[A]]): CompletableFuture[List[A]]\
    \ =\n  futures match\n    case Nil => CompletableFuture.completedFuture(List.empty)\n\
    \    case future :: more =>\n      future.thenCompose(first => sequence(more).thenApply(others\
    \ => first :: others))\n```\n```\n\nListing 26.10: Joining a list of CompletableFutures\
    \ into one without blocking.\n\nThis function uses recursion to nest calls to\
    \ `thenCompose` (`flatMap`). In the recursive branch, `sequence(more)` is a future\
    \ that will contain the values of all the input futures, except the first. This\
    \ future and the first input future are then combined using `thenCompose` and\
    \ `thenApply` (`flatMap` and `map`), according to the pattern used earlier to\
    \ merge two futures (as in Listings 26.5, 26.7, and 26.8).\n\n# Non-Blocking “Fork-Join”\
    \ Pattern\n\nFunction `queryDB` uses a fork-join pattern in which `sequence` implements\
    \ the “join” part without blocking. Fork-join is a common enough pattern that\
    \ Scala defines a function `traverse` that implements both the “fork” and “join”\
    \ parts of a computation. You can use it for a simpler implementation of `queryDB`:\n\
    \n```\n```scala\ndef queryDB(requests: List[Request]): Future[Page] =\n  Future.traverse(requests)(request\
    \ => Future(dbLookup(request))).map(makeBigPage)\n```\n```"
