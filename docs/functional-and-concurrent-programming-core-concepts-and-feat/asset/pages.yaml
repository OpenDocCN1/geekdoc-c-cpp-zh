    \  val pageF    = dataF.flatMap(data => adF.map(ad => makePage(data, ad)))\n \
    \ dataF.foreach(data => addToLog(data))\n  pageF.foreach(page => updateStats(page))\n\
    \  pageF.foreach(page => { connection.write(page); connection.close() })\n\nwhile\
    \ true do handleConnection(Connection(server.accept()))\n```\n\n# Listing 26.8:\
    \ A fully non-blocking parallel server.\n\nThe handleConnection function starts\
    \ by submitting to the thread pool a task that reads a request from a socket and\
    \ produces a future, requestF. From then on, the code proceeds by calling higher-order\
    \ functions on futures. First, using map, an ad-fetching task is scheduled to\
    \ run once the request has been read. This call produces a future adF. A database\
    \ lookup future, dataF, is created in the same way. The two futures dataF and\
    \ adF are combined into a future pageF using flatMap and map, as before. Finally,\
    \ three callback actions are registered: one on dataF for logging, and two on\
    \ pageF for statistics recording and to reply to the client.\n\nNo actual connection-handling\
    \ work is performed by the thread that runs function handleConnection. The thread\
    \ simply creates futures and invokes non-blocking functions on them. The time\
    \ it takes to run the entire body of handleConnection is negligible. In particular,\
    \ you could make the listening thread itself do it, in contrast to Listing 25.2,\
    \ where a separate task is created for this purpose.\n\nThe various computations\
    \ that need to happen when handling a request depend on each other, as depicted\
    \ in Figure 26.2. The server implemented in Listing 26.8 executes a task as soon\
    \ as its dependencies have been completed, unless all 16 threads in the pool are\
    \ busy. Indeed, the 16 threads jump from computation to computation—fetching ads,\
    \ logging, building pages, and so on—as the tasks become eligible to run, across\
    \ request boundaries. They never block, unless there is no task at all to run.\
    \ This implementation maximizes parallelism and is deadlock-free.\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_429_0.png)\n\
