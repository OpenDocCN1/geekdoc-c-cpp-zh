  md: "# 8.3 Implementation Without Rebalancing\n\nThe implementation of object Empty\
    \ is straightforward:\n\n```\ncase object Empty extends BinTree:\n  def isEmpty\
    \ = true\n  def contains(k: Int) = false\n\n  def size = 0\n  def height = 0\n\
    \n  def min = throw NoSuchElementException(\"Empty.min\")\n  def max = throw NoSuchElementException(\"\
    Empty.max\")\n\n  def +(k: Int): BinTree = Node(k, Empty, Empty)\n  def -(k: Int):\
    \ BinTree = this\n\n  def toList = List.empty\n```\n\nListing 8.1: Empty binary\
    \ search tree.\n\nThe empty tree contains nothing. In particular, it has no minimum\
    \ and maximum values. Its size and depth are zero. Method “+” (insertion) adds\
    \ a key into an empty tree by creating a single node that contains this key. Method\
    \ “−” (deletion) returns the empty tree unchanged. The fact that trees are immutable\
    \ is reflected in the signatures of methods “+” and “−”, which produce a new tree.\n\
    \nThe implementation of class Node is more interesting, due in particular to the\
    \ use of recursion:\n\n```\ncase class Node(key: Int, left: BinTree, right: BinTree)\
    \ extends BinTree:\n  def isEmpty = false\n\n  def size = 1 + left.size + right.size\n\
    \  def height = 1 + (left.height max right.height)\n\n  def min = if left.isEmpty\
    \ then key else left.min\n  def max = if right.isEmpty then key else right.max\n\
    \n  def contains(k: Int) =\n    if k < key then left.contains(k)\n```"
