- pgno: 475
  md: "```\nval a: List<String> = listOf(\"A\",\"B\",\"C\")\nval b = a.drop(1) //\
    \ requires a full copy, no data sharing\n```\n\nImmutable structures in Kotlin\
    \ do not implement the data sharing scheme described in Section 3.7 (and shown\
    \ in Figure 3.1 with Scala lists). They are more like the unmodifiable views available\
    \ in Java. One difference is that they define their own types, without methods\
    \ for mutation. In contrast, in Java, calling a mutating method on an unmodifiable\
    \ structure throws an exception:\n\n```\nList<Integer> nums = List.of(1, 2, 3);\n\
    nums.add(4); // throws UnsupportedOperationException\n```\n\n```\nval nums = listOf(1,\
    \ 2, 3)\nnums.add(4) // rejected at compile time\n```\n\nIn both Java and Kotlin,\
    \ there is only one list implementation internally. In Kotlin, you can view it\
    \ as mutable or immutable, under two different types—List and MutableList. In\
    \ Java, there is only one type—List, mutable—but, on some lists, mutating methods\
    \ are not available at runtime.\n\n# A.3 Pattern Matching and Algebraic Data Types\n\
    \nAs yet, neither Java nor Kotlin offers the full power of pattern matching, as\
    \ found in functional languages. In particular, there is little support for algebraic\
    \ data types. Nevertheless, Java is steadily catching up—pattern matching of records,\
    \ which are similar to Scala’s case classes, is coming as a preview in Java 19.\
    \ The switch construct became an expression in Java 14:\n\n```\nint parseVerbosity(String\
    \ arg) {\n    return switch(arg) {\n        case \"-v\" -> 1;\n        case \"\
    -vv\" -> 2;\n        default -> 0;\n    };\n}\n```"
