- pgno: 126
  md: "The intuition is straightforward:\n\n```\nzip(list1, list2) = (head(list1),\
    \ head(list2)) :: zip(tail(list1), tail(list2))\n```\n\nThe equality presumes\
    \ that neither list is empty, and emptiness needs to be handled as a special case:\n\
    \n```\nScala\ndef zip[A, B](list1: List[A], list2: List[B]): List[(A, B)] = (list1,\
    \ list2) match\n  case (Nil, _) | (_, Nil)          => Nil\n  case (head1 :: tail1,\
    \ head2 :: tail2) => (head1, head2) :: zip(tail1, tail2)\n```\n\nListing 7.12:\
    \ Recursive implementation of list zipping.\n\nFunction zip is parameterized by\
    \ two types A and B to allow for two different types of list elements. In contrast\
    \ to concat, function zip digs into both lists at the same time. It stops as soon\
    \ as one of the lists is empty. As a result, if the two lists have unequal lengths,\
    \ the remaining elements from the longer list are not included in the output.\n\
    \n# 7.6 Recursion on Sublists Other Than the Tail\n\nRecursive functions on lists\
    \ need smaller lists on which to apply recursion. So far in this chapter, the\
    \ smaller lists have been the tails of one or more of the input lists. While this\
    \ is a very common pattern, you can also process a list recursively using sublists\
    \ that are not the tail of the list.\n\nAs an illustration, consider the problem\
    \ of grouping list elements. Given a list and a positive number k, the objective\
    \ is to produce a list of k-element lists:\n\n```\nScala\ngroup(List(A, B, C,\
    \ D, E), 2) // List(List(A,B), List(C,D), List(E))\n```\n\nAll the inner lists\
    \ have length k, except possibly the last list, which may contain fewer than k\
    \ elements. The corresponding recursive equality is based on the following idea.\
    \ First, use function take to take the first k elements of the main list—they\
    \ form the first inner list. Then use function drop to remove these first k elements\
    \ from the main list and process the remaining elements recursively:\n\n```\n\
    group(list, k) = take(list, k) :: group(drop(list, k), k)\n```\n\nFunctions group,\
    \ take, and drop are all well defined on the empty list, leaving no special cases\
    \ to consider:"
