    \ Note that, because compilers tend to infer types as small as possible, the point\
    \ of an explicit type declaration is always to widen a type to a larger set, not\
    \ to specify a smaller type.⁷\n\n# 15.6 Subtypes\n\nThinking of types in terms\
    \ of sets helps us understand the notion of subtype. If types are sets, subtypes\
    \ are basically subsets. If a type S is a subtype of a type T, all the values\
    \ in type S are also in type T and therefore implement (at least) the functionalities\
    \ defined by type T. When type S is a subtype of T, type T is called a supertype\
    \ of S. Like subsets, subtyping is a transitive relation: If S is a subtype of\
    \ T, and T is a subtype of U, then S is a subtype of U.\n\nAs an illustration,\
    \ the Book type can be part of a type hierarchy:\n\n```\ntrait Publication:\n\
    \  def title: String\n  def pageCount: Int\n\ncase class Book(title: String, author:\
    \ String, pageCount: Int) extends Publication\ncase class Magazine(title: String,\
    \ number: Int, pageCount: Int) extends Publication\n```\n\nType Publication has\
    \ two functionalities, title and pageCount. Types Book and Magazine are both subtypes\
    \ of Publication. They are therefore subsets: Every book is a publication and\
    \ every magazine is a publication. As a consequence, books and magazines must\
    \ implement the publication functionalities: title and pageCount. In addition\
    \ to these, books have an author (but magazines do not), and magazines have a\
    \ number (but books do not). Types Book and Magazine are not related to each other:\
    \ Book is not a subtype of Magazine, and Magazine is not a subtype of Book.\n\n\
    The most fundamental property of subtypes is that their values can be substituted\
    \ for values of a supertype. Thinking again in terms of sets, they are values\
    \ of the supertype. This is sometimes referred to as the Liskov substitution principle\
    \ or as behavioral subtyping. For instance, you can define a function to print\
    \ the title of a publication:\n\n```\ndef printTitle(publication: Publication):\
    \ Unit = println(publication.title)\n```\n\nBecause types Book and Magazine are\
    \ subtypes of Publication, a book or a magazine is guaranteed to have a title\
    \ and can be used as argument to function printTitle. This is enforced by the\
    \ type system at the programming language level:"
