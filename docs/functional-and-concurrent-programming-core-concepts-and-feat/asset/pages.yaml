  md: '# Chapter 15


    # Types (and Related Concepts)


    Much of the power—but also much of the learning curve—associated with modern languages
    like Scala or Rust—or newer incarnations of earlier languages, like Java—revolves
    around types. As an interlude between our exploration of functional and concurrent
    programming language features, this chapter discusses several type-related concepts
    from a developer’s perspective—no type theory here. Readers are likely to be familiar
    with common features, such as static and dynamic type checking, abstract data
    types, subtyping, and polymorphism, but maybe less comfortable with others—for
    example, type inference, type variance, type bounds, and type classes—that not
    all programming languages support.


    # 15.1 Typing Strategies


    It is a major understatement to observe that different programming languages tend
    to treat types differently. To thoroughly discuss every type-related concept would
    take as much space as all the other chapters in the book combined, even without
    getting into implementation issues, like type inference algorithms. This is not
    the intent of this interlude. Rather, the aim here is to briefly introduce a few
    basic ideas that will help you navigate the programming languages landscape and
    transition to new languages.


    Although type theory is rigorously based on sound mathematical foundations, less
    formal, user-focused discussions of types are often more vague and ambiguous.
    The difficulty is caused in part by the lack of agreement on the precise meaning
    of routine terminology. For instance, type systems are often discussed in terms
    of dynamic versus static, and of strong versus weak. What is meant by that is
    actually far from clear. Some authors regard the dichotomies static/dynamic and
    strong/weak as equivalent, while others treat them as orthogonal. Furthermore,
    while the differences between static and dynamic type checking are mostly agreed
    upon, there is no such agreement as to the exact meaning of strong and weak in
    the context of types. This is not a debate that I care to enter: Enough key ideas
    can be introduced through code examples without having to settle the question
    of terminology first.


