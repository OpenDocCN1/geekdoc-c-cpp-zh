  md: "# A.4 Recursive Programming\n\nFunctions can be recursive in both Java and\
    \ Kotlin. Tail recursion optimization is available in Kotlin but not in Java:\n\
    \n```\nKotlin\nfun factorial(n: Int): Int {\n    tailrec fun loop(m: Int, f: Int):\
    \ Int = if (m == 0) f else loop(m - 1, f * m)\n    return loop(n, 1)\n}\n```\n\
    \nThe tailrec keyword works differently from the @tailrec annotation in Scala.\
    \ In Kotlin, optimization takes place only if tailrec is specified (and the function\
    \ is indeed tail recursive).\n\nYou can define and process recursive structures\
    \ in both languages, as shown here:\n\n```\nJava\nsealed public interface BinTree\
    \ {\n    BinTree Empty = new Empty(); // empty tree singleton\n}\nrecord Empty()\
    \ implements BinTree {}\nrecord Node(int key, BinTree left, BinTree right) implements\
    \ BinTree {}\n\nint size(BinTree tree) {\n    return switch (tree) {\n       \
    \ case Empty() -> 0;\n        case Node(int _, BinTree left, BinTree right) ->\
    \ 1 + size(left) + size(right);\n    };\n}\n```\n\n```\nKotlin\nsealed interface\
    \ BinTree\nobject Empty : BinTree\ndata class Node(val key: Int, val left: BinTree,\
    \ val right: BinTree) : BinTree\n\nfun size(tree: BinTree): Int = when (tree)\
    \ {\n    is Empty -> 0\n    is Node -> 1 + size(tree.left) + size(tree.right)\n\
    }\n```"
