  md: "```\nval pair: (String, Int) = (\"foo\", 42)\n\npair match\n  case (str, 0)\
    \ => ... // no match because the number in pair is not zero\n  case (str, n) =>\
    \ ... // str is the string \"foo\", n is the integer 42\n```\n\n# Listing 5.4:\
    \ Example of pattern matching to extract tuple elements.\n\nIf you only care about\
    \ extracting the values, you can use a tuple pattern outside the match construct:\n\
    \n```\nval (str, n) = pair // str is the string \"foo\", n is the integer 42\n\
    ```\n\nThis is equivalent to\n\n```\nval str = pair(0)\nval n   = pair(1)\n```\n\
    \nFunctional programming languages rely heavily on tuples as a mechanism to aggregate\
    \ values. In an object-oriented language, you can use classes for this purpose.\
    \ As a hybrid language, Scala implements tuples, but it also defines a notion\
    \ of case classes, which you can often use to aggregate data. A noteworthy benefit\
    \ of case classes is that they enable pattern matching.\n\n```\ncase class TempRecord(city:\
    \ String, temperature: Int)\n\nval rec = TempRecord(\"Phoenix\", 122)\n\nrec.city\
    \        // \"Phoenix\"\nrec.temperature // 122\n\nval TempRecord(name, temp)\
    \ = rec // name is \"Phoenix\", temp is 122\n```\n\nBy using a case class instead\
    \ of a tuple, you can sometimes improve code legibility—rec.city instead of rec(0)—while\
    \ keeping the convenience of pattern matching. In particular, you can define separate,\
    \ distinct types that all contain the same type components, like a city and a\
    \ temperature, or a label and a count, or a unit of time and a duration, instead\
    \ of the more generic (String, Int). Case classes are used for convenience in\
    \ several of this book’s case studies and illustrations.\n\n1 Case classes also\
    \ differ from regular classes in a few other ways (they redefine equality and\
    \ string representation, and their constructor arguments are implicitly public\
    \ val variables), but they are mostly used in this book for the purpose of pattern\
    \ matching."
