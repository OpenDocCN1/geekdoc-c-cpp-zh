  md: "# 27.6 Reactive Streams\n\nListings 27.4 to 27.7 all end with a single page\
    \ having been constructed. In an actual application, you would then need to operate\
    \ on the page in some fashion. This pattern works well if all the pages are used\
    \ independently from each other, as in the server example: Each page is sent back\
    \ to a client via a socket. But if you need to handle all the pages, as a whole,\
    \ within a larger component, a scattering of asynchronously created pages—a collection\
    \ of Future[Page] values, for instance—becomes inadequate. As an alternative,\
    \ you can use a stream of asynchronous pages.\n\nReactive streams are an abstraction\
    \ that combines the asynchronous characteristics of futures with the manifold\
    \ nature of iterators. Several implementations exist, in a variety of languages—for\
    \ example, RxJava, RxSwift, RxAndroid, Akka Streams, and Vert.x—including a bare-bones\
    \ variant as java.util.concurrent.Flow. The next example uses Reactor, a popular\
    \ Java implementation:\n\n```\nimport reactor.core.publisher.{ Flux, Mono }\n\n\
    def makePages(requests: Flux[Request]): Flux[Page] =\n  requests.flatMap { request\
    \ =>\n    val adF = CompletableFuture.supplyAsync(() => fetchAd(request), exec)\n\
    \    val dataF = CompletableFuture.supplyAsync(() => dbLookup(request), exec)\n\
    \    val pageF = dataF.thenCombine(adF, makePage)\n    Mono.fromFuture(pageF)\n\
    \  }\n```\n\nListing 27.9: Example of non-blocking transformation using reactive\
    \ streams.\n\nInstead of creating a single page from a single request, this variant\
    \ transforms a stream (called Flux in Reactor) of requests into a stream of pages.\
    \ The code is asynchronous: A call to method makePages on a stream of requests\
    \ completes immediately and returns a stream of pages. Later, as requests are\
    \ added to the input stream, corresponding pages appear in the output stream.\
    \ As before, ad fetching and database lookup are executed in parallel on a thread\
    \ pool.10 The two futures are combined into a future page asynchronously (thenCombine\
    \ is CompletableFuture’s version of zipWith, which was used in Section 26.4).\
    \ The future page is transformed into a short stream of one value, called Mono\
    \ in Reactor.\n\nThe power of reactive streams lies in their mechanisms for managing\
    \ back pressure (slowing upstream computations until downstream can catch up),\
    \ error handling, and time-based processing. These mechanisms are beyond the scope\
    \ of this book, but as a brief illustration of time-based processing, consider\
    \ this example:"
