- pgno: 29
  md: "+   - It uses methods `wait` and `notifyAll`, which implement a basic synchronization\
    \ scheme on the JVM.\n+   - It starts its own two threads to run the two tasks\
    \ in parallel.\n\nFast forward to today’s Java, and reimplement the program:\n\
    \n```\n```java\nString firstOf(StringComputation comp1, StringComputation comp2,\
    \ Executor threads)\n    throws InterruptedException, ExecutionException {\n \
    \ var result = new CompletableFuture<String>();\n  result.completeAsync(comp1::compute,\
    \ threads);\n  result.completeAsync(comp2::compute, threads);\n  return result.get();\n\
    }\n```\n```\n\nAgain, ignore the details and observe these points:\n\n+   - The\
    \ code is much shorter.\n+   - Class `Result` is gone. It implemented a poor man’s\
    \ form of a `future`, but futures are now available is many languages, including\
    \ Java.\n+   - Synchronized methods are gone. The code does not rely on locks\
    \ anywhere.\n+   - Methods `wait` and `notifyAll` are gone. Instead, `CompletableFuture`\
    \ implements its own synchronization, correctly and efficiently.\n+   - No thread\
    \ is created explicitly. Instead, threads are passed as an argument in the form\
    \ of an `Executor` and can be shared with the rest of the application.\n\nThere\
    \ is one more difference between the two variants that I want to emphasize. In\
    \ the newer code, the two Runnable classes have disappeared. They have been replaced\
    \ with an odd-looking syntax that did not exist in Java 1.4: `comp1::compute`.\
    \ You may find this syntax puzzling because method `compute` seems to be missing\
    \ its parentheses. Indeed, this code does not invoke `compute`, but rather uses\
    \ the method itself as an argument to `completeAsync`. It could be written as\
    \ a lambda expression instead: `comp1::compute` is the same as `() -> comp1.compute()`.\
    \ Passing functions as arguments to functions is a fundamental concept of functional\
    \ programming, which is explored at length in Part I, but finds frequent uses\
    \ in writing concurrent code as well.\n\nHere’s the point of this illustration:\
    \ You can still write the first version of the program in today’s Java, but you\
    \ shouldn’t. It is notoriously difficult to get multithreaded code correct, and\
    \ it is even more difficult to get it correct and make it efficient. Instead,\
    \ you should leverage what is available in the language and use it effectively.\
    \ Are you making the most of the programming languages you are using today?\n\n\
    As a trend, programming languages have become more abstract and richer in features,\
    \ a shift that makes many programming tasks less demanding. There are more concepts\
    \ to understand in Java 19 than there were in Java 1, but it is easier to write\
    \ correct"
