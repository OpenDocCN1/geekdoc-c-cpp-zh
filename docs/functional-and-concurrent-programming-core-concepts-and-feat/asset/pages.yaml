- pgno: 456
  md: "Strategies are parameterized by an input type A and an output type B. (In the\
    \ program verification problem, type A would represent logical formulas, and type\
    \ B would be Boolean.) When applied to a given input, a strategy produces a task,\
    \ which can be run in an attempt to calculate the corresponding output. A task\
    \ may succeed or fail, and thus returns an option. A task can also be canceled—for\
    \ instance, because it has exceeded its time quota, or because another strategy\
    \ has already solved the problem. The code developed in this chapter hinges on\
    \ several assumptions:\n\n+   - A strategy can only succeed with a value, fail\
    \ by returning an empty option, or keep running forever. In particular, we assume\
    \ that strategies do not fail with exceptions. This is not a significant limitation.\
    \ You can always replace a function f of type A => Option[B] that might throw\
    \ an exception with the function x => Try(f(x)).getOrElse(None), which returns\
    \ None instead.\n+   - For a given input, all the strategies that produce a successful\
    \ value produce the same value. (In my original context, if a theorem prover can\
    \ show that a formula is valid, other provers cannot show that it is not, and\
    \ vice versa.) There is no notion of “better” value. This makes it possible—and\
    \ even desirable—to ignore the output of all the other strategies once a strategy\
    \ has terminated successfully.\n+   - Tasks are canceled by invoking their cancel\
    \ method, which is customized for each strategy. This makes it easier for strategies\
    \ to use code that is not responsive to thread interrupts—the default cancellation\
    \ mechanism used by Java thread pools—such as socket I/O. (My verification tool\
    \ ran theorem provers on remote computers.)\n+   - Cancellation may be implemented\
    \ on a “best effort” basis: A task may continue to run for some time after it\
    \ has been canceled. Calling cancel on a task does not guarantee that a thread\
    \ inside its run method completes this call immediately.\n+   - Canceling a task\
    \ before it runs prevents this task from ever running; if invoked, its run method\
    \ returns None immediately. Canceling a task that is already finished has no effect.\n\
    \nFor reference, a simple sequential implementation would try all the strategies\
    \ in turn until either one produces a non-empty option or all the strategies have\
    \ been exhausted:\n\n```\n{runner-seq}\nclass Runner[A, B](strategies: Seq[Strategy[A,\
    \ B]]):\n  def compute(input: A): Option[B] =\n    strategies.view.flatMap(strategy\
    \ => strategy(input).run()).headOption\n```\n\nA runner is created from a collection\
    \ of strategies. Its compute method iterates over all the strategies, using a\
    \ view. For each strategy, it creates and runs a task, until either one task produces\
    \ a non-empty option or all the strategies fail. The use of a view guarantees\
    \ that compute terminates as soon as a strategy is successful, without needlessly\
    \ evaluating"
