    3 times {\nprintln(\"Beetlejuice!\")\n}\n```\n```\n\nAlthough times looks like\
    \ a keyword and a language construct, it is actually defined as a regular function.\
    \ You could implement it as an extension method:\n\n```\n```scala\nextension (count:\
    \ Int)\ninfix def times[U](code: => U): Unit =\n  var n = count\n  while n > 0\
    \ do\n    code\n    n -= 1\n```\n```\n\n> Listing 12.4: Control abstraction example:\
    \ function times.\n\nThis method is defined as an extension so it can be called\
    \ on regular integers. It uses a by-name argument for the code to be repeated:\
    \ The code is passed unevaluated, and is evaluated by the times method as many\
    \ times as needed.\n\nAs a more elaborate example, let’s define a new looping\
    \ construct repeat–until:\n\n```\n```scala\nclass Repeat[U](code: => U):\n  infix\
    \ def until(test: => Boolean): Unit =\n    code\n    while !test do code\ndef\
    \ repeat[U](code: => U) = Repeat(code)\n```\n```\n\n> Listing 12.5: Control abstraction\
    \ example: repeat–until.\n\nClass Repeat uses a by-name argument in its constructor.\
    \ The constructor produces an object that implements the repetition in its until\
    \ method, using a termination test that is also passed by name. You can use this\
    \ new construct as follows:"
