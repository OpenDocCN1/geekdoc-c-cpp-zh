    # NOTE


    Section 7.9 briefly discusses building lists with limited use of the execution
    stack, and possible scalable implementations of function take are discussed. However,
    many code examples throughout this book continue to build lists using the execution
    stack, as in Listing 7.8. My motivation for using this approach is to avoid unnecessary
    distractions and to keep code illustrations focused on the concepts at hand. In
    this section, which focuses on the equalities at the core of recursive algorithms,
    I am willing to sacrifice library-level performance and robustness for the benefit
    of code that draws more clearly from the corresponding equality. In the implementation
    of take, for instance, the code head :: take(tail, n - 1) and the equality head(list)
    :: take(tail(list), n - 1) are almost identical. Within the context of this book,
    it is not worth losing this clarity to improve the code''s performance.


    # 7.5 Recursion on Multiple/Nested Lists


    Let us continue the illustration of recursion with several examples of recursive
    functions that involve multiple lists, including lists nested inside lists.


    First, consider the case of a concat function that concatenates two lists (this
    functionality is available as a “:::” method in the standard Scala library):


    ```

    val abc = List(A, B, C)

    concat(abc, abc) // List(A, B, C, A, B, C); standard in Scala as abc ::: abc

    ```'
