  md: "# 20.4 Applying Lock Splitting\n\nA drawback of the queue implementations of\
    \ Listings 20.1 and 20.5 is that threads that add to the queue and threads that\
    \ take from the queue are competing for the same lock, even though, most of the\
    \ time, they end up accessing different lists—in when adding and out when taking.\
    \ This is undesirable, as contention for exclusive locks can be a major cause\
    \ of performance loss in concurrent applications.\n\nYou can improve the thread-safe\
    \ queue by applying lock splitting: Split the single lock into two locks, and\
    \ use one to guard list in and the other to guard list out. This results in the\
    \ following implementation of ConcurrentQueue:\n\n```\nclass ConcurrentQueue[A]:\n\
    \  private var in, out = List.empty[A]\n  private val inLock, outLock = Object()\n\
    \n  def put(value: A): Unit = inLock.synchronized(in ::= value)\n\n  def take():\
    \ Option[A] =\n    outLock.synchronized {\n      out match\n        case first\
    \ :: others => out = others; Some(first)\n        case Nil =>\n          val in\
    \ = inLock.synchronized {\n            val i = this.in\n            this.in =\
    \ List.empty\n            i\n          }\n          in.reverse match\n       \
    \     case first :: others => out = others; Some(first)\n            case Nil\
    \ => None\n    }\n```\n\nListing 20.7: Thread-safe queue (two private locks);\
    \ see also Lis. 20.1 and 20.5.\n\nTwo private objects, inLock and outLock, are\
    \ created to serve as locks.³ Inside method put, which is based solely on list\
    \ in, you acquire inLock, but leave outLock free for threads that call method\
    \ take. Method take is a little more intricate. You start by using outLock to\
    \ access list out. If the list is non-empty, this is enough: outLock is the only\
    \ lock you need, and the call to take proceeds without any interference with concurrent\
    \ calls to put. If, however, list out is empty, you have to acquire the second\
    \ lock, inLock,\n\n> ³In Scala, val x, y = expr evaluates expr twice, once to\
    \ initialize x and once to initialize y."
