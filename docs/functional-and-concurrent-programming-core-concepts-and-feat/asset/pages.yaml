  md: '# Chapter 16 Concepts of Concurrent Programming


    This program is sequential and prints A, B, and C, in that order. You can break
    sequentiality by letting the second print statement execute out of order. In Scala,
    it could be written as follows:


    ```

    ```scala

    printIn(''A'')

    Future(printIn(''B''))

    printIn(''C'')

    ```

    ```


    The second print statement is scheduled to be executed out of order, and the program
    output is no longer guaranteed to be A followed by B followed by C. Out-of-order
    execution can also be triggered in other languages like Kotlin:


    ```

    ```kotlin

    printIn(''A'')

    launch { printIn(''B'') }

    printIn(''C'')

    ```

    ```


    or JavaScript:


    ```

    ```javascript

    console.log(''A'');

    Promise.resolve().then(() => console.log(''B''));

    console.log(''C'');

    ```

    ```


    In the initial pseudocode, printIn(''B'') is a synchronous call: It takes place
    here and now, within the current run, between the printing of A and the printing
    of C. By contrast, the Scala line Future(printIn(''B'')), the Kotlin line launch
    { printIn(''B'') }, and the JavaScript line Promise.resolve().then(() => console.log(''B''))
    have the similar effect of invoking the printing of B asynchronously, not here
    and/or not now, out of the current flow of operations.


    As a noncomputing analogy, if I order a sandwich and stand at the counter while
    the sandwich is being prepared in front of me, that’s synchronous. If instead
    I place my order, get a number, and don’t wait for the sandwich to be ready before
    leaving the counter, that’s asynchronous.¹


    So, the three programs just shown are no longer sequential. Are they concurrent?


    The JavaScript program uses a single thread and guarantees that B will be printed
    after A and C, in an ACB order. The printing of B is not happening “now,” but
    in a way it is still happening “here,” within the same thread of execution. Given
    that the program is single-threaded, and that the ACB order is guaranteed, you
    can even argue that the execution is still sequential, only in a different order.


    > In this case, it is also multithreaded, only in a different order. unless I’m
    being asked to make the sandwich myself when I come back to the counter to pick
    it up.'
