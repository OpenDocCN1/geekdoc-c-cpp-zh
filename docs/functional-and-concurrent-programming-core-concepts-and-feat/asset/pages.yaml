  md: '# # Chapter 10 Standard Higher-Order Functions


    Similarly,


    ```

    for load <- loads do load.reduce()

    ```


    was used to update a list of mutable objects. It is compiled into


    ```

    loads.foreach(load => load.reduce())

    ```


    When for-do and for-yield use conditions, a filtering step is inserted by the
    compiler. The expression


    ```

    for load <- loads if load.weight != 0 yield load.reduced

    ```


    is compiled into


    ```

    loads.withFilter(load => load.weight != 0).map(load => load.reduced)

    ```


    Listing 10.8 added a method foreach to binary trees. As a result, you can now
    process trees using for-do:


    ```

    val tree: BinTree = ...

    ```


    ```

    for x <- tree do println(x) // prints all the values in the tree, in order

    ```


    The for-do expression is compiled into tree.foreach(println).


    Many libraries implement foreach, map, flatMap, and filter functions, but few
    programming languages define a for-comprehension syntax identical to Scala’s.
    Some constructs, though, are similar, like Python’s list comprehensions. The Python
    code


    ```

    [round((temp - 32) / 1.8) for temp in temps if temp > 75]

    ```


    corresponds to the following Scala code:


    ```

    for temp <- temps if temp > 75 yield ((temp - 32) / 1.8f).round

    ```


    Method withFilter is semantically equivalent to filter, but uses a form of delayed
    evaluation to avoid the creation of an intermediate list (see the discussion of
    views and lazy evaluation in Section 12.9).'
