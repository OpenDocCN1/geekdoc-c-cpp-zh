- pgno: 246
  md: "As an illustration, let’s reimplement the trampoline in Java, a language with\
    \ no tail-call optimization at all (yet):⁴\n\n```\ninterface Computation<A> {\n\
    \  A result();\n\n  static <T> Computation<T> done(T value) {\n    return new\
    \ Done<>(value);\n  }\n\n  static <T> Computation<T> call(Supplier<Computation<T>>\
    \ thunk) {\n    return new Call<>(thunk);\n  }\n}\n\nrecord Done<A>(A value) implements\
    \ Computation<A> {\n  public A result() {\n    return value;\n  }\n}\n\nrecord\
    \ Call<A>(Supplier<Computation<A>> thunk) implements Computation<A> {\n  public\
    \ A result() {\n    Computation<A> calc = this;\n    while (calc instanceof Call<A>\
    \ call)\n      calc = call.thunk().get();\n    return calc.result();\n  }\n}\n\
    ```\n\nListing 14.4: Trampoline for tail-call optimization in Java.\n\nThe approach\
    \ is the same as Listing 14.2. The Java type Supplier<T> corresponds to a function\
    \ with no argument and return type T. To help build trampolines, two helper functions,\
    \ done and call, are defined as before. Because Java does not support any tail\
    \ recursion optimization, the evaluation of the trampoline in method result uses\
    \ a regular while-loop. It performs the same computation as the Scala variant.\n\
    \nThe even–odd example can now be rewritten in Java:\n\n```\nComputation<Boolean>\
    \ isEven(int n) {\n  if (n == 0) return done(true);\n  else return call(() ->\
    \ isOdd(n - 1));\n}\n```"
