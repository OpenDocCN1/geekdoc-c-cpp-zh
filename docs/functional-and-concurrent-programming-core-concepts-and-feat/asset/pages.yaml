- pgno: 23
  md: '# Foreword by Cay Horstmann


    In my book Scala for the Impatient, I provide a rapid-fire introduction into the
    many features of the Scala language and API. If you need to know how a particular
    feature works, you will find a concise explanation and a minimal code example
    (with real code, not fruits or animals). I assume that the reader is familiar
    with Java or a similar object-oriented programming language and organize the material
    to maximize the experience and intuition of such readers. In fact, I wrote the
    book because I was put off by the learning materials at the time, which were disdainful
    of object-oriented programming and biased toward functional programming as the
    superior paradigm.


    That was more than a decade ago. Nowadays, functional techniques have become much
    more mainstream, and it is widely recognized that the object-oriented and functional
    paradigms complement each other. In this book, Michel Charpentier provides an
    accessible introduction to functional and concurrent programming. Unlike my Scala
    book, the material here is organized around concepts and techniques rather than
    language features. Those concepts are developed quite a bit more deeply than they
    would be in a book that is focused on a programming language. You will learn about
    nontrivial and elegant techniques such as zippers and trampolines.


    This book uses Scala 3 for most of its examples, which is a great choice. The
    concise and elegant Scala syntax makes the concepts stand out without being obscured
    by a thicket of notation. You will particularly notice that when the same concept
    is expressed in Scala and in Java. You don’t need to know any Scala to get started,
    and only a modest part of Scala is used in the code examples. Again, the focus
    of the book is concepts, not programming language minutiae. Mastering these concepts
    will make you a better programmer in any language, even if you never end up using
    Scala in your career.


    I encourage you to actively work with the sample programs. Execute them, observe
    their behavior, and experiment by making changes. I suggest that you use a programming
    environment that supports Scala worksheets, such as Visual Studio Code, IntelliJ,
    or the online Scastie service. With a worksheet, turnaround is quick and exploratory
    programming is enjoyable.


    Seven out of the 28 chapters are complete case studies that illustrate the material
    that preceded them. They are chosen to be interesting without being overwhelming.
    I am sure you will profit from working through them in detail.


    The book is divided into two parts. The first part covers functional programming
    with immutable data, algebraic data types, recursion, higher-order functions,
    and lazy evaluation. Even if you are at first unexcited about reimplementing lists
    and trees, give it a chance. Observe the contrast with traditional mutable data
    structures, and you will find the journey rewarding. The book is blessedly free
    of complex category theory that in my opinion—evidently shared by the author—requires
    a large amount of jargon before yielding paltry gains.'
  merge: -1
