- pgno: 83
  md: 'both implementations are the same. They both represent active–passive sets
    as pairs of immutable sets, either using a built-in pair type, or our own, two-field
    `ActivePassive` class as a wrapper. Both implementations share the same fundamental
    property that active–passive sets are immutable, and activation/deactivation always
    creates a new set.


    When using a true functional programming language, you are likely to write this
    immutable variant directly in terms of functions. However, with a hybrid object-oriented/functional
    language, using functional objects is an attractive option that arguably results
    in cleaner code than a purely functional implementation.


    You may wonder about the relative performance of each implementation—the question
    of performance always comes up when discussing immutability. Immutable active–passive
    sets incur two performance costs:


    +   - Activation and deactivation of elements require the allocation of a new
    wrapping container for the two sets—either a pair or an instance of class `ActivePassive`.
    Discarded pairs, sets, and wrappers also create additional work for the garbage
    collector.

    +   - Methods `+=` and `-=` on mutable sets are likely to be slightly more efficient
    than `+` and `-` on immutable sets, though not necessarily by much.


    Overall, these disadvantages are likely to be minor compared to the benefit of
    simpler and safer data sharing and should not stop you from going the immutable
    route if that’s what makes sense for your application. As always, there is no
    need to worry about minor differences in performance until profiling has established
    that they contribute to a bottleneck in your application.'
