  md: "```\ndef length[A](list: List[A]): Int =\n  @tailrec\n  def addLength(theList:\
    \ List[A], len: Int): Int = theList match\n    case Nil => len\n    case _ ::\
    \ tail => addLength(tail, len + 1)\n\n  addLength(list, 0)\n```\n\nListing 7.4:\
    \ List length, using tail recursion; contrast with Lis. 7.3.\n\nFunction addLength\
    \ is tail recursive. The whole length function can now be compiled as a loop,\
    \ which will avoid stack overflow issues.\n\n# 7.3 Returning Lists\n\nSo far,\
    \ we have considered only functions that extract information from a list: last\
    \ returns an element, contains returns a Boolean value, and length returns an\
    \ integer. Some functions, however, process lists by building and returning other\
    \ lists.\n\n![](img/74309e2bdd93f68d2e94338a3d73517f_120_0.png)\n\nFigure 7.1\
    \ Recursive strategy for function drop.\n\nAs a first example, consider the standard\
    \ function drop, which is used to remove the first n elements from a list: drop(List(A,B,C,D),\
    \ 2) is List(C,D). Its recursive equality follows from the fact that, to remove\
    \ n elements from a list, you need to first remove the head of the list, and then\
    \ remove n − 1 elements from the tail (Figure 7.1):\n\n```\ndrop(list, n) = drop(tail(list),\
    \ n - 1)\n```\n\nFor the equality to be valid, the list needs to have a tail,\
    \ and n − 1 cannot be a negative number, since negative numbers make no sense\
    \ in this context. From this observation, two special cases follow, one for the\
    \ empty list and one for n = 0:\n\n```\n@tailrec\ndef drop[A](list: List[A], n:\
    \ Int): List[A] =\n  if n == 0 then list\n  else list match\n```"
  merge: -1
