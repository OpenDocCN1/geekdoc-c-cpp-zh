- pgno: 128
  md: "# 7.7 Building Lists in Reverse Order\n\nAs mentioned in the discussion of\
    \ function append, appending to a list takes time proportional to the length of\
    \ the list, while prepending is a constant-time operation. This point is essential\
    \ to keep in mind if you want to avoid writing list-based code that is grossly\
    \ inefficient.\n\nConsider the case of list reversal. To implement the function\
    \ recursively, you could be tempted to use a recursive call to reverse the tail\
    \ of a list and then append the head of the list at the end of the reversed tail:\n\
    \n```\nreverse(list) = append(reverse(tail(list)), head(list))\n```\n\nWhile this\
    \ equality is indeed valid on a non-empty list, using it results in an unacceptable\
    \ reverse function:\n\n```\nScala\n// DON'T DO THIS!\ndef reverse[A](list: List[A]):\
    \ List[A] = list match\n  case Nil          => list\n  case head :: tail => append(reverse(tail),\
    \ head)\n```\n\nAlthough this function correctly produces a list in reverse order,\
    \ it suffers from two major flaws. First, it is not tail recursive and will run\
    \ out of stack space when applied to large lists. Second, and most importantly,\
    \ its performance is unsatisfactory, even for those lists that fit in the execution\
    \ stack.\n\nIf the list being reversed contains n elements, the length of reverse(tail)\
    \ is n − 1, and the evaluation of append necessitates n − 1 operations. But inside\
    \ the reverse(tail) computation, there is another call to append on a list with\
    \ n − 2 elements; and inside the next nested computation is another call to append\
    \ on a list of length n − 3; and so forth. Overall, (n − 1) + (n − 2) + ⋯ + 1\
    \ = (n × (n − 1))/2 operations are needed. As a result, the computing time of\
    \ this reverse function is proportional to the square of the length of the list\
    \ being reversed.\n\nTo avoid this, introduce a second list argument:\n\n```\n\
    Scala\ndef reverse[A](list: List[A]): List[A] =\n  @tailrec\n  def addToStack(rem:\
    \ List[A], rev: List[A]): List[A] = rem match\n    case Nil          => rev\n\
    \    case top :: bottom => addToStack(bottom, top :: rev)\n\n  addToStack(list,\
    \ Nil)\n\nListing 7.15: Linear, tail recursive implementation of list reversal.\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 129
  md: "This function proceeds by repeatedly adding the head of the list being reversed\
    \ to the front of an accumulator list `rev`. You can think of it as peeling cards\
    \ from a deck and putting them onto the table: In the end, the resulting deck\
    \ of cards is the reverse of the original deck.\n\nContrary to the previous attempt,\
    \ this implementation only uses “::” directly to build the resulting list, and\
    \ is linear in complexity. As a simple experiment on the desktop computer used\
    \ to typeset this book, it took approximately 75 milliseconds to reverse a list\
    \ of 5000 numbers using the first implementation. This time decreased to 0.027\
    \ millisecond when the improved variant was used, a more than 1/2000 reduction.\
    \ Incidentally, this implementation has also become tail recursive, and can handle\
    \ lists of arbitrary length.\n\nThere may be situations where you are tempted\
    \ to append to a list because prepending would not produce a list in the right\
    \ order. Don’t do it. Instead, build the list in the wrong order, efficiently,\
    \ and then reverse it. For instance, to extract space-separated tokens from a\
    \ stream of characters, it would feel natural to use append to add a character\
    \ to the current token, then append again to add a token to a list of tokens.\
    \ Instead, you can use a combination of prepending and reversing:\n\n```\n```scala\n\
    def tokenize(stream: List[Char]): List[String] =\n  def addToken(token: List[Char],\
    \ tokens: List[String]): List[String] =\n    if isEmpty(token) then tokens else\
    \ reverse(token).mkString :: tokens\n\n  @tailrec\n  def loop(stream: List[Char],\
    \ token: List[Char], tokens: List[String]): List[String]=\n    stream match\n\
    \      case w :: chars if w.isWhitespace => loop(chars, Nil, addToken(token, tokens))\n\
    \      case c :: chars                  => loop(chars, c :: token, tokens)\n \
    \     case Nil                          => addToken(token, tokens)\n\n  reverse(loop(stream,\
    \ Nil, Nil))\n```\n```\n\nCharacters are processed one at a time in function `loop`.\
    \ A non-whitespace character (c) is added to the current token, and the computation\
    \ proceeds recursively. Upon encountering a whitespace character (w), the current\
    \ token is added to a list of tokens, and a new token (Nil) is started. The last\
    \ token, which is not necessarily followed by whitespace, is added at the end.\n\
    \nNote how characters are added to tokens using constant-time operation “::”.\
    \ As a result, tokens are built in reverse order. In function `addToken`, each\
    \ token is reversed one time when it is added to the list. (The function skips\
    \ empty tokens and uses standard method `mkString` to convert a list of characters\
    \ into a string.) Similarly, tokens are added to a list of tokens using “::”,\
    \ and the list is reversed at the end. Since reversal was implemented in linear\
    \ time, the entire tokenization time remains proportional to the lengths and number\
    \ of tokens."
  merge: -1
  img_proc: true
- pgno: 130
  md: "# 7.8 Illustration: Sorting\n\n# NOTE\n\nEfficient sorting is typically not\
    \ performed directly on lists. Instead, list values can be stored in a temporary\
    \ array, the array sorted, and the list reconstructed. Furthermore, practical\
    \ sorting functions should be parameterized by the type of the elements being\
    \ sorted and the criterion used to order them. This section focuses on direct\
    \ sorting of lists of integers because it offers a good illustration of recursive\
    \ patterns. The resulting functions suffer from limitations and inefficiencies\
    \ that would likely be unacceptable in production code.\n\nConsider the problem\
    \ of sorting a list of integers in increasing order. You can decompose a non-empty\
    \ list into a head and a tail and apply recursion to sort the tail. You are then\
    \ left with a single value (the head) and a sorted list (the sorted tail). All\
    \ that is needed to complete the sorting function is to insert this value at the\
    \ right place into the sorted list. This strategy results in a form of insert-sort:\n\
    \n```\ndef insertInSorted(x: Int, sorted: List[Int]): List[Int] = sorted match\n\
    \  case Nil => List(x)\n  case min :: others =>\n    if x < min then x :: sorted\
    \ else min :: insertInSorted(x, others)\n\ndef insertSort(list: List[Int]): List[Int]\
    \ = list match\n  case Nil => list\n  case h :: t => insertInSorted(h, insertSort(t))\n\
    ```\n\nListing 7.17: Insertion sort.\n\nThe sorting function uses a function insertInSorted\
    \ to insert the head of a list into its sorted tail. In this auxiliary function,\
    \ you insert an element x into an empty list by creating a one-element list List(x).\
    \ Otherwise, x is compared to the head of the sorted list, min, which is its smallest\
    \ element. If x is smaller than the minimum, it is also smaller than all the other\
    \ values and therefore belongs at the front of the list. Otherwise, the smallest\
    \ value in the list is still min, and you need to insert x somewhere in the tail\
    \ of the list, which is achieved through a recursive call.\n\nInsert-sort is known\
    \ to have poor performance—computation time proportional to the square of the\
    \ length of the list—and better strategies have been devised based on splitting\
    \ a list into two halves instead of a head and tail. There are two classic variants\
    \ of this pattern, with which you are probably familiar:\n\n+   - *Merge-sort*:\
    \ Split a list in the middle, sort both halves recursively, then merge the two\
    \ sorted lists into one."
