  md: "```\n<A> void writeToFile(Path file, Iterable<A> values) throws IOException\
    \ {\n    try (var out = new ObjectOutputStream(Files.newOutputStream(file))) {\n\
    \        for (var item : values) out.writeObject(item);\n    }\n}\n```\n\nThis\
    \ function writes a collection of objects into a file. The try construct guarantees\
    \ that the file is closed after writing, even in the presence of exceptions. You\
    \ can write a similar method in Scala:\n\n```\ndef writeToFile[A](file: Path,\
    \ values: Iterable[A]): Unit =\n    Using.resource(ObjectOutputStream(Files.newOutputStream(file)))\
    \ { out =>\n        for item <- values do out.writeObject(item)\n    }\n```\n\n\
    A key difference, however, is that Java’s try-with-resources is a construct of\
    \ the language, while Scala’s Using.resource is a regular function, defined in\
    \ the standard library. In its simplest form, you could implement it yourself\
    \ as follows:\n\n```\ndef resource[R <: AutoCloseable, A](res: R)(use: R => A):\
    \ A =\n    try use(res) finally res.close()\n```\n\nFunction resource is curried\
    \ and higher-order. It is parameterized by the type of the resource, R, which\
    \ must be a subtype of Java’s AutoCloseable,¹ and by the type A of the value produced\
    \ from the resource, using a given function use. The implementation invokes this\
    \ function use within a try-finally construct to guarantee that the resource is\
    \ closed: resource(r)(f) is the value f(r), and r is closed after f is applied.\n\
    \nFunction resource needs to tie the given resource to the code that uses it,\
    \ so it makes sense to pass the code as a function of the resource. When no such\
    \ tie is necessary, the code to execute becomes a no-argument function, which\
    \ you can replace with a by-name value. The result is a control abstraction that\
    \ hides the fact that an argument is actually a function. For instance, you can\
    \ write a construct that calculates the duration of the execution of an arbitrary\
    \ code fragment:\n\n```\ndef timeOf[U](code: => U): Double =\n    val startTime\
    \ = System.nanoTime()\n    code\n    val endTime = System.nanoTime()\n    (endTime\
    \ - startTime) / 1E9\n```\n\nListing 12.3: Control abstraction example: function\
    \ timeOf."
