  md: 'A second type of polymorphism is *parametric polymorphism*, which relies on
    functions and methods parameterized by one or more types, like generics in Java
    or templates in C++:


    ```

    def withHash[T](value: T): (T, Int) = (value, value.##)

    ```


    Listing 15.2: Example of parametric polymorphism.


    This function combines a value with its hash code, as a pair. It is parameterized
    by a type T and is polymorphic in the sense that it exists in multiple forms,
    one for each possible type argument. This single parameterized function represents
    a collection of type-specific functions—for instance:


    ```

    def bookWithHash(book: Book): (Book, Int) = (book, book.##)

    def magazineWithHash(magazine: Magazine): (Magazine, Int) = (magazine, magazine.##)

    ```


    Instead of defining multiple functions, you invoke the same `withHash` on books
    and magazines to obtain values of type (Book,Int) or (Magazine,Int) as necessary:


    ```

    val hashedBook: (Book, Int) = withHash(book)

    val hashedMagazine: (Magazine, Int) = withHash(magazine)

    ```


    The third and most interesting kind of polymorphism is *subtype polymorphism*.
    It is based on the idea that a service in a type can have multiple forms, one
    for each subtype. For instance, you can define a function to print the titles
    of a list of publications:


    ```

    def printTitles(pubs: List[Publication]) = for pub <- pubs do println(pub.title)

    ```


    Listing 15.3: Example of subtype polymorphism; see also Lis. 15.4.


    A list of publications may contain books or magazines. When a book is processed,
    method `title` from the Book class is invoked, and when a magazine is processed,
    method `title` from the magazine class is invoked. In other words, the code fragment
    pub.title takes multiple forms, depending on the type of the object inside variable
    pub.


    You may know this phenomenon under the name *dynamic dispatch* or *dynamic binding*
    or *late binding*. These terms all reflect the fact that which code is executed
    by `pub.title` is not decided at compile time, but dynamically at runtime, once
    the type of the object inside pub is known. Compilers typically rely on a structure
    called *Virtual Method Table* to store references to different implementations
    of a given method, and subtype polymorphism is sometimes known as using *virtual
    methods*.


    In languages like Java and Scala, the power of subtype polymorphism derives from
    the fact that a method invocation x.m(y) can execute different implementations
    of'
