    \ scenario:\n\n```\nif book.pagecount:\n    print(book.title)\n```\n\nIn this\
    \ program, the number of pages in a book—ostensibly an integer—is being used as\
    \ a Boolean value in a test. This works in Python, but would trigger a type error\
    \ in both Scala and Java.\n\nYou might argue that using numbers in tests is convenient—pagecount\
    \ in the preceding test stands for pagecount != 0—but being loose with the Boolean\
    \ type can also be dangerous. Consider first this Java program:\n\n```\nSet<Book>\
