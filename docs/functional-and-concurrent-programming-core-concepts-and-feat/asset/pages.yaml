- pgno: 481
  md: "Kotlin's any, used in the preceding example, is equivalent to the Scala method\
    \ exists. Kotlin collections define most standard higher-order functions, including\
    \ forEach, filter, map, and flatMap. For instance, you can convert Fahrenheit\
    \ temperatures into Celsius using map:\n\n```\ntemps.map { temp -> ((temp - 32)\
    \ / 1.8f).roundToInt() }\n```\n\nAs a more complex combination of higher-order\
    \ functions, you could start from a list of strings, parse each string as a space-separated\
    \ list of temperatures, ignore non-numerical values, and convert numerical values\
    \ to Celsius:\n\n```\nval SPACES = Regex(\"\\\\s+\")\nval strings: List<String>\
    \ = ...\n\nval celsius: List<Int> = strings\n    .flatMap { SPACES.split(it) }\n\
    \    .mapNotNull { it.toIntOrNull() }\n    .map { ((it - 32) / 1.8f).roundToInt()\
    \ }\n```\n\nThis example uses the shorter syntax based on it. Kotlin tends to\
    \ use null where Scala would use options—for instance, toIntOrNull instead of\
    \ toIntOption. Method mapNotNull combines a mapping and filtering steps, ignoring\
    \ null outputs of the mapped function.\n\nIn Java, the standard collections implement\
    \ very few higher-order functions. Instead, collections are bridged into streams,\
    \ which implement all the higher-order functions. A simple conversion into Celsius\
    \ could be written as follows:\n\n```\nList<Integer> temps = ...\n\nList<Integer>\
    \ celsius = temps.stream().map(temp -> round((temp - 32) / 1.8f)).toList();\n\
    ```\n\nThis calculation forces boxing and unboxing of primitive int values to\
    \ and from Integer values. To avoid it, Java also defines specialized stream classes\
    \ for its primitive types:\n\n```\nint[] temps = ...\n\nint[] celsius = Arrays.stream(temps).map(temp\
    \ -> round((temp - 32) / 1.8f)).toArray();\n```\n\nIn this computation, map is\
    \ invoked on an object of type IntStream instead of Stream."
