    \ toTry to change the Either into a Try. You can also ignore the left part entirely\
    \ with toOption. Conversely, an option can be turned into a value of type Either\
    \ by specifying an additional left or right part, which, in Scala, is lazily evaluated:\n\
    \n```\nSome(42).toRight(\"no number\") // Right(42)\nNone.toRight(\"no number\"\
    )     // Left(\"no number\")\n```\n\nYou can also use fold to extract the contents\
    \ of a value of type Either[A,B] into a value of type C by providing two functions,\
    \ one for the left, of type A => C, and one for the right, of type B => C:\n\n\
    ```\ndef mkString(stringOrNumber: Either[String, Int]): String =\n    stringOrNumber.fold(identity,\
    \ n => if n < 0 then s\"($n)\" else s\"$n\")\n\nmkString(Right(-42))         \
    \ // \"(-42)\"\nmkString(Left(\"no number\")) // \"no number\"\n```\n\nWhen you\
    \ need to return a special value of the same type as a regular value—say, an error\
    \ message in a string function—you can use Either with the same type on the left\
    \ and right. For instance, Java’s library function binarySearch searches a sorted\
    \ array. If the element is found, the corresponding index is returned. Otherwise,\
    \ the function returns a negative number n such that −n − 1 is the index where\
    \ the element would be if it were in the array. This way, you can easily access\
    \ the element just before or just after the missing element.\n\nTo eliminate the\
    \ risk of using this negative value as an index, you could make binarySearch return\
    \ a value of type Either[Int,Int], using Right when the element is found and Left\
    \ to return useful information when it is not found. For a given number x, the\
    \ values Left(x) and Right(x) are distinct, and the calling code can handle them\
    \ in different ways."
