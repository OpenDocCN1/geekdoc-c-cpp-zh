  md: '# 24.8 Asynchronous Task Submission Using Conditions


    +   • The thread that initiates a computation is stuck inside method run for the
    duration of the run. Adding tasks can happen only in other threads. Accordingly,
    runner instances now need to be safe when shared by multiple threads.

    +   • There is an inherent race condition between a finishing run and an attempt
    to add inputs to this run. A method to test the state of a runner—is it running?—would
    be useless because of a non-atomic check-then-act: A runner could become passive
    right after it is checked for being active. Instead, method addInput should be
    expected to fail to add an input to the current run if it comes too late, and
    it needs a way to indicate such a failure to its caller.

    +   • Waiting for run completion is harder because new tasks can be added after
    waiting has begun. In particular, the simple approach used earlier, based on a
    countdown latch created from a known number of tasks, becomes insufficient.

    +   • If runs are allowed to overlap—a new run can be started by another thread
    before the previous run is finished—and further inputs are added while multiple
    runs are ongoing, to which run should they be added?

    +   • Alternatively, overlapping runs can be prohibited by making sure method
    run is not allowed to start until the previous run is completed. This choice requires
    that the method behaves differently depending on the state of a runner—active
    versus passive. All the runners implemented so far have been stateless—not counting
    the thread pool, which is obviously thread-safe. A stateful runner must be designed
    more carefully when shared among threads.


    This section focuses on implementations that share two design choices. First,
    runs cannot overlap. Method run blocks until the previous run is terminated, then
    submits a new set of inputs (and blocks again until this new computation is finished).
    Second, addInput indicates success or failure by returning a Boolean value. (Some
    of Java’s concurrent collections use the same approach, such as method offer on
    queues.)


    ```

    class Runner[A](exec: Executor)(comp: A => Unit):

    private var active = 0

    private var runs = 0

    def run(inputs: Seq[A]): Unit = synchronized {

    while active != 0 do wait()

    val myRun = runs + 1

    runs = myRun

    active = inputs.length

    }

    ```'
