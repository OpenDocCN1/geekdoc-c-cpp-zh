  md: '# Chapter 8


    # Case Study: Binary Search Trees


    Ordered mappings can be implemented as binary search trees. In this case study,
    trees are immutable, and values are added or removed by building new trees. Trees
    are recursive—the children of a tree are themselves trees—and most tree operations
    are implemented recursively. Binary search trees are only efficient to the extent
    that they are well balanced—not too deep in height. This case study refines the
    initial code to implement AVL trees, a classic self-balancing strategy.


    # 8.1 Binary Search Trees


    Binary search trees are a form of rooted trees sometimes used to implement mappings
    from keys to values. Key–value pairs are stored in the nodes of the tree. Each
    node has up to two children, the left child and the right child, which are themselves
    binary trees.


    Binary search trees assume a total order on keys and maintain an invariant property:
    The key in any node is greater than all the keys in its left child, and less than
    all the keys in its right child. Using this property, you can search for a key
    k in a tree with the following algorithm: If k equals the key of the root, it
    is found, and the corresponding value can be retrieved; otherwise, if k is less
    than the key of the root, it is searched in the left tree, if any, using the same
    algorithm; otherwise, k is greater than the key of the root, and it is searched
    in the right tree, if any, using the same algorithm.


    This algorithm is naturally recursive: A tree search proceeds by searching inside
    subtrees, recursively. A search ends either when it finds an equal key in a node
    (success) or when it reaches a point where a child is missing (failure). Many
    other tree operations are defined recursively, and to implement them is a good
    illustration of the recursive patterns discussed in earlier chapters.


    The fundamental property of key lookup in a binary search tree is that you explore
    at most one of the children of any node. As a consequence, the worst-case time
    complexity of a search is bounded by the length of the longest branch in a tree,
    called the height of the tree. If a tree is well balanced, its height is no more
    than the binary logarithm of the number of nodes. This means that lookup in a
    balanced binary search tree that contains n keys takes time proportional to log₂(n).


    Figure 8.1 depicts a binary search tree that contains the keys 6, 20, 32, 43,
    51, 52, 57, 60, 71, 78, and 83. The values associated with the keys are omitted.
    As an illustration, to search for key 51, you would compare 51 to 57, follow the
    left branch, compare 51 to 43, follow the right branch, and find the node with
    the 51 key. A search for key 79 would'
