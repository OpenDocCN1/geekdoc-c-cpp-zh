  md: "# A.6 Lazy Evaluation\n\nBy replacing values with no-argument functions (thunks),\
    \ you can delay the evaluation of function arguments in both Java and Kotlin.\
    \ The fancier by-name arguments of Scala do not exist in either language.\n\n\
    Kotlin, however, makes the arrow of a lambda expression optional when the lambda\
    \ takes no arguments or its arguments are ignored. The following Scala expressions\n\
    \n```\nScala\nList.tabulate(5)(i => \"X\" * (i + 1)) // [X, XX, XXX, XXXX, XXXXX]\n\
    List.fill(5)(Random.between(1, 11)) // 5 numbers, possibly different\n```\n\n\
    can be written in Kotlin as\n\n```\nKotlin\nList(5) { i -> \"X\".repeat(i + 1)\
    \ }\nList(5) { Random.nextInt(1, 11) }\n```\n\nYou can use the same function List\
    \ where you need two functions, tabulate and fill, in Scala. The Kotlin function\
    \ used in this example is equivalent to tabulate. You could write the last line\
    \ in the preceding example as\n\n```\nKotlin\nList(5) { _ -> Random.nextInt(1,\
    \ 11) }\n```\n\nbut the unused argument and arrow are optional.\n\nThis makes\
    \ it possible to achieve in Kotlin a form of control abstraction similar to Scala’s,\
    \ despite the lack of by-name arguments. For instance, you can rewrite function\
    \ timeOf from Listing 12.3 in this way:\n\n```\nKotlin\nfun <U> timeOf(code: ()\
    \ -> U): Double {\n    val start = System.nanoTime()\n    code()\n    val end\
    \ = System.nanoTime()\n    return (end - start) / 1E9\n}\n```\n\nIt is used in\
    \ exactly the same way as the Scala variant, with no explicit thunk visible:"
