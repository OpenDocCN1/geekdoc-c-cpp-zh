    \ Option[B] =\n    if isEmpty then alternative else this\n\ndef getOrElse[B >:\
    \ A](default: => B): B =\n    if isEmpty then default else this.get\n```\n\nThe\
    \ alternative and default arguments are passed by name and are evaluated only\
    \ if the option is empty.\n\nThe getProperty extension could rely on getOrElse\
    \ for its implementation:\n\n```\ndef getProperty(key: String, fallback: () =>\
    \ String): String =\n    Option(properties.getProperty(key)).getOrElse(fallback())\n\
    ```\n\nThe predefined function Option wraps values inside options, mapping null\
    \ to None. (For an illustration of orElse in a branching algorithm, see Section\
    \ 12.11.)\n\nSimilar to orElse and getOrElse, mutable maps have getOrElseUpdate(k,v),\
    \ a method that retrieves the value associated with key k or, if the key is not\
    \ present, updates the map with a new pair (k,v). The argument v is passed by\
    \ name: If the key is present, v is not needed and will not be evaluated. You\
    \ can use getOrElseUpdate to simplify the implementation of the higher-order function\
    \ memo from Listing 9.6:\n\n```\ndef memo[A, B](f: A => B): A => B =\n    val\
    \ store = mutable.Map.empty[A, B]\n    x => store.getOrElseUpdate(x, f(x))\n```\n\
    \nListing 12.2: Memoization using a by-name argument, improved from Lis. 9.6.\n\
    \nAs before, the function starts with a lookup in the map. If x is found in the\
    \ map, getOrElseUpdate does not evaluate its second argument. Only if the key\
    \ is not found will function f be called on x.\n\n# 12.3 Control Abstraction\n\
    \nThe fill function embeds a while-loop; getOrElseUpdate embeds a conditional.\
    \ Many of the higher-order functions discussed in Chapter 10 also implement a\
    \ form of control abstraction: Somewhere in the implementation of map, filter,\
    \ and find, there is a loop—or a recursive function—that performs the necessary\
    \ iteration. Using delayed evaluation, various forms of flow control—such as loops,\
    \ conditional, and exception handling—can be abstracted away in user-defined,\
    \ higher-order constructs.\n\nConsider, for instance, Java’s try-with-resources,\
    \ used to ensure that resources are released at the end of a computation:"
