- pgno: 151
  md: '# 8.5 Summary


    Binary trees form a typical recursive structure on which recursive programming
    can be demonstrated. Many operations, such as lookups and insertions, are implemented
    in terms of applying the same operation to subtrees. Functional trees are defined
    in terms of a terminal case, the empty tree Empty, and a constructor Node that
    creates a new tree from two children and the contents of the root. This is reminiscent
    of functional lists, which are built from the empty list Nil and a cons operator
    “:.”. The fundamental difference is that a tree node can have two children, while
    a non-empty list has only one tail.


    In languages that support pattern matching, trees can be processed by treating
    the empty tree as a special case, and deconstructing a non-empty tree into a node
    value and two children, in the same way a non-empty list is broken into its head
    and tail. Although tree operations could be implemented entirely in terms of functions
    using pattern matching, a functional-object-oriented style is often preferred
    in hybrid languages.


    Functional trees cannot be mutated, and insertion and deletion operations produce
    new trees instead. However, many subtrees can be shared between the tree before
    and the tree after an insertion or deletion. This is again reminiscent of the
    data sharing already discussed in the context of lists.


    Some tree operations, such as deletion, are more complex than their list counterparts.
    While removing the head of a list leaves a tail that is itself a list, the remaining
    children of a tree after the root is removed do not form a tree and need to somehow
    be merged.


    Binary search trees extend binary trees by maintaining a key ordering property
    that can speed up lookups. This property needs to be preserved by all tree operations,
    including the merging of children after a tree root has been removed.


    Binary search trees offer efficient lookup only to the extent that a tree is well
    balanced. While a balanced tree can easily be built from a list, further insertions
    and deletions can result in unbalanced trees. Algorithms have been devised for
    trees that remain balanced after every insertion and deletion. As an example,
    this case study extends basic binary search trees into self-balancing AVL trees.
    The implementation of rebalancing operations relies heavily on recursion and pattern
    matching.'
  merge: -1
