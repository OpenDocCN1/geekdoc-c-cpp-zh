- pgno: 334
  md: 'single-threaded techniques—such as sharing a read-only view on internal data—cease
    to be valid when multiple threads are involved.


    +   - Users of an object can sometimes participate in its synchronization policy.
    This can be achieved by sharing the locks used internally, a technique known as
    client-side locking. A benefit of this approach is that external code can lock
    the state of an object to implement multistep atomic operations, like iterations.
    A drawback is that code may also misuse the synchronization policy, such as by
    unnecessarily holding locks and thus creating synchronization bottlenecks. A safer—but
    more limiting—strategy keeps the synchronization fully encapsulated, such as by
    only using private instances as locks.

    +   - Mutable objects can rely on immutable types internally. A major benefit
    of this approach is that references to internal immutable data can safely be shared
    among threads. This is often a viable alternative to read-only views (which are
    unsafe with multiple threads) or defensive copies (which are expensive).

    +   - When immutable types are used to implement a mutable object, they are stored
    in reassignable variables. To guarantee thread-safety, these variables must be
    read and assigned using proper synchronization. It is crucial never to use a reassignable
    field itself as a lock: The object in the field would have to be read without
    locks first—and thus possibly concurrently with other threads writing the field—before
    the necessary locking can take place.

    +   - When designing a concurrent program, you must first decide which operations
    on mutable objects should be perceived externally as atomic. You then achieve
    thread-safety by making sure that atomic actions executed in parallel by multiple
    threads always have the same effect as some sequential ordering of the same actions.'
  merge: -1
