  md: "This is a mixed blessing. On the one hand, the risk of continuing the computation\
    \ with an incorrect list is eliminated. On the other hand, the exception, if it\
    \ is not handled, has the potential to cause a lot of damage—for instance, by\
    \ stopping a server entirely instead of only failing one transaction.\n\nInstead\
    \ of using special values, function search could rely on an exception to indicate\
    \ that an element is missing:\n\n```\n// throws NoSuchElementException when not\
    \ found\ndef search[A](values: List[A], target: A): Int = ...\n```\n\nBut there\
    \ is still nothing that forces function between to handle the exception. An implementation\
    \ without checks for missing targets now throws NoSuchElementException instead\
    \ of NullPointerException, with the same potential for widespread damage.²\n\n\
    # 13.2 Using Option\n\nOptions are a primary mechanism to deal with computations\
    \ that may not produce a value. We have already discussed options in the context\
    \ of searching functions like find (Section 9.1) and findSum (Section 12.11).\
    \ Indeed, our own binary search function in Listing 6.9 uses an option to return\
    \ an index.\n\nInstead of returning -1 or null, search could produce a value of\
    \ type Option[Int], and use None to indicate that a search was unsuccessful:\n\
    \n```\ndef search[A](values: List[A], target: A): Option[Int] = ...\n```\n\nThe\
    \ benefit of this definition is that the previous implementation of function between,\
    \ which is missing error-handling code, can no longer be compiled. Instead, you\
    \ need to handle failed searches explicitly:\n\n```\ndef between[A](values: List[A],\
    \ from: A, to: A): List[A] =\n  (search(values, from), search(values, to)) match\n\
    \    case (Some(i), Some(j)) => values.slice(i min j, (i max j) + 1)\n    case\
    \ _                 => List.empty\n```\n\n²Java uses the notion of a checked exception,\
    \ which forces the calling code to either handle an exception or declare it explicitly\
    \ as being rethrown. The mechanism is intended to prevent developers from ignoring\
    \ possible exceptions, but it is unwieldy, especially when using lambda expressions.\
    \ It would not help in this illustration because you may prefer to ignore the\
    \ exception if you know for sure that the targets are in the list. Indeed, NoSuchElementException\
    \ is an unchecked exception in Java. I am not aware of another language today\
    \ that uses checked exceptions."
