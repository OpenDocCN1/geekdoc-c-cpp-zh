- pgno: 289
  md: '+   - In addition to explicit type declarations in the source code, many programming
    languages rely on inference algorithms to calculate types that have not been specified.
    An overarching principle of type inference is to calculate the smallest type—typically
    a least upper bound—that fits the constraints expressed in a program. Occasionally,
    an inferred type might be too narrow for a programmer''s purpose and needs to
    be widened using an explicit declaration or a type ascription. (Cases where an
    inferred type is too broad and needs to be narrowed are possible, but much more
    unusual.)

    +   - When types are viewed as sets, subtyping corresponds to a subset relationship:
    S (as a type) is a subtype of T if S (as a set) is a subset of T. Accordingly,
    all the values in subtype S are also in supertype T and implement (at least) the
    same functionalities. Subtypes satisfy a substitution property: Values of a subtype
    can be used wherever values of a supertype are expected.

    +   - Some programming languages use a notion of nominal subtyping, by which subtypes
    are linked to their supertypes by name. Other languages use structural subtyping,
    in which a subtype only needs to implement the functionalities of the supertype
    and does not need to refer to the supertype explicitly. Structural subtyping tends
    to be more flexible but less safe: Semantically independent values that happen
    to share a method name can become related by a subtyping relationship that was
    not intended.

    +   - Polymorphism relies on the idea of a single service that takes several forms.
    Programming languages typically implement some or all of three kinds of polymorphism:
    ad hoc (separate methods or functions by the same name), parametric (methods or
    functions parameterized by one or more types), and subtype (methods implemented
    differently in different subtypes).

    +   - A heterogeneous collection of values from different subtypes of a common
    supertype can often be processed uniformly using subtype polymorphism. The resulting
    code is concise, robust, and flexible. In particular, it requires no modification
    if new subtypes of the supertype are created at a later time.

    +   - A parameterized type may either preserve a subtyping relationship of its
    type parameter (covariance), reverse it (contravariance), or ignore it (non-variance,
    also called invariance). In other words, when S is a subtype of T, it is possible
    that C[S] is a subtype of C[T] (C is covariant), C[T] is a subtype of C[S] (C
    is contravariant), or there is no subtype relationship between C[S] and C[T] (C
    is non-variant).

    +   - Support for type variance varies from one programming language to another.
    Some languages implement fixed rules—for instance, all types except arrays are
    non-variant in Java. Others offer mechanisms for user-defined variance—for instance,
    C#, Scala, and Kotlin use similar variance annotations.'
