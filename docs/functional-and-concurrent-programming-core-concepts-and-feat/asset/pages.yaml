    \ f(x))\n```\n\nClass TrieMap, which was used in Chapter 23 in a read-write lock\
    \ example, implements a thread-safe map. As a result, memo(f) is now thread-safe\
    \ if function f is. However, the implementation suffers from a major drawback.\n\
    \nConsider the following scenario: Suppose function f is such that it takes 10\
    \ seconds to compute f(x0) for some value x0. Function g is created as memo(f).\
    \ A thread T1 calls g(x0) and starts to calculate f(x0). Nine seconds later, a\
    \ thread T2 also calls g(x0). At that time, thread T1 is still inside its computation\
    \ of f(x0), and the store map is still empty. Accordingly, method getOrElseUpdate\
    \ triggers a second computation of f(x0) within thread T2. It will take 10 seconds\
    \ from this moment for thread T2 to obtain the value f(x0), which is 9 seconds\
