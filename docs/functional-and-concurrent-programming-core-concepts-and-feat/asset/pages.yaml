  md: "A common strategy for graceful termination is as follows:\n\n```\nobject task\
    \ extends Runnable:\n  @volatile private var continue = true\n\n  def terminate()\
    \ = continue = false\n\n  def run() =\n    while continue do\n      // perform\
    \ task\n    end while\n    // cleanup\nend task\n\nval runner = Thread(task, \"\
    Runner\")\nrunner.start()\n// other code while runner is running\ntask.terminate()\n\
    ```\n\nListing 17.3: Requesting thread termination using a volatile flag.\n\n\
    The runner thread keeps executing code from its task while regularly checking\
    \ a flag, named continue here. Thread termination is requested by setting this\
    \ flag to false.\n\nThis pattern for thread termination is adequate as long as\
    \ there is no danger of the thread getting “stuck” somewhere in the loop, unable\
    \ to test the termination flag. This can happen because of synchronization (e.g.,\
    \ a thread blocked on a lock or some other synchronizer) or I/O (e.g., a thread\
    \ blocked reading data from an empty socket). Dealing with termination in the\
    \ presence of blocking operations can be quite tricky and is a topic left for\
    \ a more advanced discussion.\n\nVariable continue must be made volatile because\
    \ it is shared among threads without any form of synchronization (see Section\
    \ 22.5 on the Java Memory Model). Volatile variables are an advanced concept that\
    \ you can safely ignore until you decide to dive more deeply into concurrent programming.\
    \ A termination flag like continue is the most common use of a volatile variable\
    \ outside advanced programming patterns.\n\nThe call task.terminate() is a request\
    \ for termination, but the thread running the task will continue to run until\
    \ (and unless) it checks the continue flag, executes its cleanup code, and completes\
    \ the run method, at which point the task can be considered done and its state\
    \ usable by the main thread. There is a frequent need for a thread to wait until\
    \ another thread is finished—for instance, a supervisor thread waiting for a worker\
    \ thread to complete its task. You can use thread method join for this purpose."
