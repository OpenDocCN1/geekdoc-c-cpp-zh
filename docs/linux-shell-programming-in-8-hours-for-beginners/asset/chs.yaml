  \n## Shell 脚本\nShell 脚本是一个包含一系列命令的文件，由 Shell 执行。Shell 脚本用于自动化任务和执行复杂操作。\n\n### 第一个\
  \ Shell 脚本\n创建一个 Shell 脚本，请遵循以下步骤：\n1. 创建一个扩展名为 `.sh` 的文件。\n2. 添加 shebang 行，例如 `#!/bin/bash`。\n\
  3. 在文件中编写你的命令。\n4. 使用 `chmod +x script.sh` 使可执行。\n5. 使用 `./script.sh` 运行脚本。\n\n\
  ### Shell 释\n注释用于解释代码并被 Shell 忽略。它们以 `#` 符号开头。\n\n```bash\n# 这是一个注释\n```\n\n###\
  \ 多行注释\n对于多行注释，你可以使用 `<<EOF` 语法：\n\n```bash\n<< 'EOF'\n这是一个多行注释。\n它跨越多行。\nEOF\n\
  ```\n\n### 变量\n变量用于在 Shell 脚本中存储数据。你可以通过赋值值来定义变量。\n\n```bash\nname=\"John Doe\"\n\
  ```\n\n### 变量名\n变量名必须以字母或下划线开头，可以包含字母、数字和下划线。它们是对大小敏感的。\n\n### 只读变量\n只读变量在定义后无法更改。\n\
  \n```bash\nreadonly constant_var=\"value\"\n```\n\n## 删除变量\n使用 `unset` 命令删除变量。\n\
  \n```bash\nunset name\n```\n\n字体 变量输入\n你可以使用 `read` 命令从用户那里获取输入。\n\n```bash\nread\
  \ -p \"Enter your name: \" name\necho \"Hello, $name\"\n```\n\n# 第 2 小时\n\n## Shell\
  \ 字符串 (1)\n字符串是字符序列。可以用单引号或双引号括起来。\n\n## Shell 字符串 (2)\n将它们放在一起来拼接字符串。\n\n## 连接字符串\n\
  ```bash\nstr1=\"Hello\"\nstr2=\"World\"\ncombined=\"$str1 $str2\"\necho $combined\n\
  ```\n\n## 字符串长度\n要找到字符串的长度，使用 `${#variable}` 语法。\n\n```bash\necho ${#str}\n```\n\
  \n## 提取子字符串\n你可以使用参数扩展从字符串中提取子字符串。\n\n```bash\nstr=\"Hello World\"\necho ${str:0:5}\
  \ # 输出: Hello\n```\n\n## 关于 `expr…`\n`expr` 命令可以用于字符串操作，例如查找长度。\n\n```bash\nexpr\
  \ length \"Hello World\"\n```\n\n## 搜索索引\n要找到字符串子字符串的位置，使用模式。\n\n## Shell 参数\nShell\
  \ 参数是提供环境和参数信息的特殊变量。\n\n### 内置参数\n- `$0`: 脚本名称。\n- `$1`, `$2`, ...: 位置参数。\n- `$#`:\
  \ 参数数量。\n- `$*`: 所有参数。\n- `$@`: 所有参数。\n\n# 第 3 小时\n\n## Shell 数组\n数组用于在一个变量中存储多个值。\n\
  \n```bash\narr=(\"apple\" \"banana\" \"cherry\")\n```\n\n### 访问元素\n使用索引访问单个数组元素。\n\
  \n```bash\necho ${arr[0]}\n```\n\n### 获取所有元素\n要获取数组的所有元素，使用 `${arr[@]}`。\n\n```bash\n\
  echo \"${arr[@]}\"\n```\n\n### 数组长度\n要找到数组中的元素数量，使用 `${#arr[@]}`。\n\n```bash\necho\
  \ ${#arr[@]}\n```\n\n## Printf 命令\n`printf` 命令用于格式化输出。\n\n```bash\nprintf \"Hello,\
  \ %s!\\n\" \"World\"\n```\n\n## 转义序列\n转义序列用于表示字符串中的特殊字符。\n\n# 第 4 小时\n\n## 运算符\n\
  运算符用于计算和比较。\n\n### if…then…else…fi\n`if` 语句用于条件执行。\n\n```bash\nif [ $a -gt 5 ];\
  \ then\n  echo \"Greater than 5\"\nelse\n  echo \"Less or equal to 5\"\nfi\n```\n\
  \n## 算术运算符\n`+`, `-`, `*`, `/`, `%`\n\n## 比较运算符\n`-eq`, `-ne`, `-gt`, `-lt`, `-ge`,\
  \ `-le`\n\n## 逻辑运算符\n`&&` (与), `||` (或), `!` (非)\n\n# 第 5\n\n## 字符串运算符\n用于比较字符串的运算符。\n\
  \n## 文件运算符\n用于检查文件属性的运算符。\n\n### “echo” 命令\n`echo` 命令用于将文本打印到终端。\n\n# 第 6 小时\n\n\
  ## Test 命令\n`test` 命令用于各种测试。\n\n### [[ ]] 符号\n`[[ ]]` 语法用于表达式。\n\n### 测试相等性\n###\
