  trans: "\n\n# 数组操作\n\n## `array_name[@]` 或 `array_name[*]`\n\n### 示例 3.2\n```bash\n\
    #!/bin/bash\nmy_array[0]=Java\nmy_array[1]=Ruby\nmy_array[2]=Html\nmy_array[3]=Rust\n\
    echo \"All elements are: ${my_array[@] }\"\necho \"All elements are: ${my_array[*]\
    \ }\"\n```\n**输出：**\n```\nAll elements are: Java  Ruby  Html  Rust\nAll elements\
    \ are: Java  Ruby  Html  Rust\n```\n**解释：** `my_array[@]` 或 `my_array[*]` 可以获取数组的所有元素。\n\
    \n### 数组长度\n`#array_name[@]` 或 `#array_name[*]` 可以获取数组的长度。\n\n## `#array_name[@]`\
    \ 或 `#array_name[*]` \n\n### 示例 3.3\n```bash\n#!/bin/bash\nmy_array=(PHP MySQL\
    \ in 8 Hours)\nlength1=${#my_array[@] }\nlength2=${#my_array[*] }\necho $length1\n\
    echo $length2\n```\n**输出：**\n```\n5\n5\n```\n**解释：** `#my_array[@]` 或 `#my_array[*]`\
    \ 可以获取数组的长度。\n\n# printf 命令\n\n`printf` 是在 Shell 中格式化输出的命令。\n\n## `printf \"type\"\
    ` 变量\n\n`\"type\"` 是用于格式化输出的参数。\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `%b` | 打印二进制值\
    \ |\n| `%d` | 打印整数 |\n| `%f` | 打印浮点数 |\n| `%o` | 打印八进制值 |\n| `%s` | 打印字符串值 |\n\
    | `%x` | 打印十六进制值 |\n\n例如：\n- `%10s` 表示格式化为最大宽度为 10 个字符的字符串\n- `%-10s` 表示格式化为最大宽度为\
    \ 10 个字符的字符串（`-` 符号表示左对齐，不加 `-` 表示右对齐）\n- `%8. 2f` 表示格式化为浮点数，`8` 表示 8 位整数部分，`2`\
    \ 表示 2 位小数。\n- `%-8. 2f` 表示格式化为浮点数，`8` 表示 8 位整数部分，`2` 表示 2 位小数。（`-` 符号表示左对齐，不加\
    \ `-` 符号表示右对齐）\n\n### 示例 3.4\n```bash\nprintf \"%-10s %-7s %-8s\\n\" Name Age\
    \ Weight\n```\n**输出：**\n```\nName      Age      Weight\n```\n**解释：**\n- `\"%-10s\"\
    ` 被 `\"Name\"` 替换，`\"Name\"` 被格式化为最大 10 个字符的字符串，左对齐。\n- `\"%-7s\"` 被 `\"Age\"\
    ` 替换，`\"Age\"` 被格式化为最大 7 个字符的字符串，左对齐。\n- `\"%-8s\"` 被 `\"Weight\"` 替换，`\"Weight\"\
    ` 被格式化为最大 8 个字符的字符串，左对齐。\n- `\"\\n\"` 用于换行。\n\n### 示例 3.5\n```bash\n#!/bin/bash\n\
    printf \"%-10s %-7s %-8s\\n\" Name Age Weight\nprintf \"%-10s %-7d %-5. 2f\\n\"\
    \ Andy 18 91.8843\nprintf \"%-10s %-7d %-5. 2f\\n\" Tomy 19 95.4675\nprintf \"\
    %-10s %-7d %-5. 2f\\n\" Rosy 17 80.8563\n```\n**输出：**\n```\nName      Age    \
    \  Weight\nAndy      18       91.88\nTomy      19       95.47\nRosy      17  \
    \     80.86\n```\n**解释：**\n- `\"printf \"%-10s %-7d %-5. 2f\\n\" Andy 18 91.8843\"\
    ` 格式化了三个参数 `\"Andy\"`、`\"18\"`、`\"91.8843\"`。\n- `\"%-10s\"` 被 `\"Andy\"` 替换，`\"\
    Andy\"` 被格式化为最大 10 个字符的字符串，左对齐。\n- `\"%-7d\"` 被 `\"18\"` 替换，`\"18\"` 被格式化为最大 7\
    \ 位数字的整数，左对齐。\n- `\"%-5. 2f\"` 被 `\"91.88\"` 替换，`\"91.88\"` 被格式化为最大 5 位整数、2 位小数的浮点数类型，左对齐。\n\
    - `\"\\n\"` 用于换行。\n\n# 转义序列\n\n`\\` 反斜字符可用于转义字符。\n- `\\a` 输出警报声\n- `\\n` 将内容输出到下一行。\n\
    - `\\r` 产生回车\n- `\\t` 产生制表符\n- `\\f` 将内容输出到下一页。\n- `\\'` 输出单引号。\n- `\\\"\\\"`\
    \ 输出双引号。\n\n### 示例 3.6\n```bash\n#!/bin/bash\nprintf \"%s %s \\'%s\\' \\n\" He\
    \ said OK\nprintf \"%d\\t %d\\n\" 10 100\nprintf \"%s\\n %s\\n\" C\n```\n**输出：**\n\
    ```\nHe said 'OK' \n10\t100\nC\n```\n**解释：**\n- `'%s\\'` 输出引号。\n- `%d\\t` 输出两个数字并带有制表符。\n\
    - `%s\\n` 输出字符串。\n\n# 运算符\n\nShell 像其他语言一样支持多种运算符，包括：算术运算符、关系运算符、布尔运算符、字符串运算符、文件运算符。\n\
    \n## `expr…`\n\n`expr…` 是一个求值工具。使用反引号而不是单引号。\n\n### 示例 4.1\n```bash\n#!/bin/bash\n\
    sum=`expr 100 +20`\necho \"The sum is: $sum\"\n```\n**输出：**\n```\nThe sum is:\
    \ 120\n```\n**解释：**\n使用反引号，而不是单引号。完整的表达式必须包含在反引号中。运算符之间必须有空格。例如，`\"10+20\"` 是错误的。\n\
    \n## `if…then…else…fi`\n\n`if` 语句如果条件为真则执行代码，如果为假则执行 `else`。\n\n### 示例 4.2\n```bash\n\
    a=10\nb=20\nif [ $a == $b ]; then\n  echo \"a is equal to b\"\nelse\n  echo \"\
    a is not equal to b\"\nfi\n```\n**输出：**\n```\na is not equal to b\n```\n**解释：**\n\
    `[$a == $b]` 比较 `a` 和 `b` 是否相等。注意：对于 `==`，括号内应该留空格。例如：`[$a==b]` 是错误的，`[$a == $b\
    \ ]` 是正确的。`==` 是比较运算符。如果 `a` 等于 `b`，返回真；`a` 不等于 `b`，返回假。在上面的 `if` 语句中，因为测试条件返回假，执行了\
    \ `else`。因此，`echo \"a is not equal to b\"` 被执行。\n\n# 算术运算符\n\n| 运算符 | 执行 |\n|\
    \ :--- | :--- |\n| `+` | 加 |\n| `-` | 减 |\n| `*` | 乘（注意：`*`） |\n| `/` | 除 |\n\
    | `%` | 取模 |\n| `=` | 赋值 |\n| `==` | 检查相等性 |\n\n### 示例 4.3\n```bash\n#!/bin/bash\n\
    a=100\nb=2\nresult=`expr $a + $b`\necho \"a + b : $result\"\nresult=`expr $a -\
    \ $b`\necho \"a - b : $result\"\nresult=`expr $a * $b`\necho \"a * b : $result\"\
    \nresult=`expr $a / $b`\necho \"a / b : $result\"\nresult=`expr $a % $b`\necho\
    \ \"a % b : $result\"\n```\n**输出：**\n```\na + b : 102\na - b : 98\na * b : 200\n\
    a / b : 50\na % b : 0\n```\n\n### 示例 4.4\n```bash\na=100\nb=200\nif [ $a == $b\
    \ ]; then\n  echo \"a is equal to b\"\nfi\nif [ $a != $b ]; then\n  echo \"a is\
    \ not equal to b\"\nfi\n```\n**输出：**\n```\na is not equal to b\n```\n**解释：**\n\
    `[$a != $b]` 检查 `a` 是否不等于 `b`。注意：`]` 和 `!=` 之间应该有空格。`[$a=$b]` 是错误的。`[$a != $b\
    \ ]` 是正确的。\n\n# 比较运算符\n\nLinux Shell 有以下运算符：\n\n| 运算符 | 检查 |\n| :--- | :--- |\n\
    | `-eq` | 等于 |\n| `-ne` | 不等于 |\n| `-gt` | 大于 |\n| `-ge` | 大于 |\n| `-lt` | 小于\
    \ |\n| `-le` | 小于 |\n\n比较表达式返回真或假。\n\n### 示例 4.5\n```bash\n#!/bin/bash\na=100\n\
    b=200\nif [ $a -eq $b ]; then\n  echo \"$a -eq $b ? a is equal to b\"\nelse\n\
    \  echo \"$a -eq $b ? a is not equal to b\"\nfi\nif [ $a -ne $b ]; then\n  echo\
    \ \"$a -ne $b ? a is not equal to b\"\nelse\n  echo \"$a -ne $b ? a is equal to\
    \ b\"\nfi\nif [ $a -gt $b ]; then\n  echo \"$a -gt $b ? a is greater than b\"\n\
    else\n  echo \"$a -gt $b ? a is not greater than b\"\nfi\nif [ $a -lt $b ]; then\n\
    \  echo \"$a -lt $b ? a is less than b\"\nelse\n  echo \"$a -lt $b ? a is not\
    \ less than b\"\nfi\nif [ $a -ge $b ]; then\n  echo \"$a -ge $b ? a is greater\
    \ or equal to b\"\nelse\n  echo \"$a -ge $b ? a is less than b\"\nfi\nif [ $a\
    \ -le $b ]; then\n  echo \"$a -le $b ? a is less or equal to b\"\nelse\n  echo\
    \ \"$a -le $b ? a is greater than b\"\nfi\n```\n**输出：**\n```\n100 -eq 200 ? a\
    \ is not equal to b\n100 -ne 200 ? a is not equal to b\n100 -gt 200 ? a is not\
    \ greater than b\n100 -lt 200 ? a is less than b\n100 -ge 200 ? a is less than\
    \ b\n100 -le 200 ? a is greater than b\n```\n\n"
- fmt: "\n# Example 4.6\n\n```bash\n#!/bin/bash\nx=true\ny=false\nif [ $x -a $y ]\
    \      # -a means “and”\nthen\n    echo flase\nfi\nif [ $x -o $y ]      # -o means\
    \ “or”\nthen\n    echo true\nfi\nif [ !$x ]         # ! means “not”\nthen\n  \
    \  echo flase\nfi\n```\n\nOutput:\n```\nflase\ntrue\nflase\n```\n\nExplanation:\n\
    \n| true -a true;returns true; | true -a false;returns false; | false -a false;returns\
    \ false; |\n| true -o true;returns true; | true -o false;returns true; | false\
    \ -o false;return false; |\n| ! false;returns true; | ! true;returns false; |\
    \  |\n\n# Hour 5: String Operators\n\n| Operators | Checks |\n| :--- | :--- |\n\
    | `=` | If two strings are equal, returns true . |\n| `!=` | If two strings are\
    \ not equal, returns true . |\n| `-z` | If the length of a string is equal to\
    \ zero, returns true . |\n| `-n` | If the length of a string is not equal to zero,\
    \ returns true |\n| `$` | If the string is not empty, returns true . |\n\n# Example\
    \ 5.1\n\n```bash\n#!/bin/bash\na=\"Java\"\nb=\"Ruby\"\nif [ $a = $b ]      # check\
    \ if a is equal to b\nthen\n    echo \"$a = $b ?  a is equal to b\"\nelse\n  \
    \  echo \"$a = $b ?  a isn't equal to b\"\nfi\nif [ $a != $b ]      # check if\
    \ a isn’t equal to b\nthen\n    echo \"$a ! = $b ?  a isn't equal to b\"\nelse\n\
    \    echo \"$a ! = $b ?  a is equal to b\"\nfi\nif [ -z $a ]      # check if the\
    \ string length is 0\nthen\n    echo \"-z $a ?  The string length is 0\"\nelse\n\
    \    echo \"-z $a ?  The string length isn't 0\"\nfi\nif [ -n \"$a\" ]       \
    \ # check if the string length isn’t 0\nthen\n    echo \"-n $a ?  The string length\
    \ isn't 0\"\nelse\n    echo \"-n $a ?  The string length is 0\"\nfi\nif [ $a ]\
    \        # check if the string isn’t empty\nthen\n    echo \"$a ?  The string\
    \ isn't empty\"\nelse\n    echo \"$a ?  The string is empty\"\nfi\n```\n\nOutput:\n\
    ```\nJava = Ruby ?  a isn't equal to b\nJava ! = Ruby ?  a isn't equal to b\n\
    -z Java ?  The string length isn't 0\n-n Java ?  The string length isn't 0\nJava\
    \ ?  The string isn't empty.\n```\n\nExplanation:\n\n| `=` | If two strings are\
    \ equal, returns true . |\n| `!=` | If two strings are not equal, returns true\
    \ . |\n| `-z` | If the length of a string is equal to zero, returns true . |\n\
    | `-n` | If the length of a string is not equal to zero, returns true |\n| `$`\
    \ | If the string is not empty, returns true . |\n\n# File Operators\n\nFile operators\
    \ are used to detect various properties of Linux files.\n\n| Operator | Checks\
    \ |\n| :--- | :--- |\n| `-d file` | If the object is a directory, return true\
    \ . |\n| `-f file` | If the object is a file, return true . |\n| `-p file` | If\
    \ the object is a pipe, return true . |\n| `-r file` | If the object is a readable\
    \ file, return true . |\n| `-w file` | If the object is a writable file, return\
    \ true . |\n| `-x file` | If the object is an executable file, return true . |\n\
    | `-e file` | If the object is an empty file, return true . |\n| `-s file` | If\
    \ the object isn’t an empty file, return true . |\n| `-b file` | If the object\
    \ is a block device file, return true . |\n| `-c file` | If the object is a character\
    \ device file, return true . |\n\n# Example 5.2\n\nAssume that the file “myFile.sh”\
    \ does not exist, but we still check the property of this file.\n\n```bash\n#!/bin/bash\n\
    file=\"/root/myFile.sh\"\nif [ -r $file ]      # check if the object is readable\n\
    then\n    echo \"The object is readable\"\nelse\n    echo \"The object isn't readable\"\
    \nfi\nif [ -w $file ]      # check if the object is writable\nthen\n    echo \"\
    The object is writable\"\nelse\n    echo \"The object isn't writable\"\nfi\nif\
    \ [ -x $file ]      # check if the object is executable\nthen\n    echo \"The\
    \ object is executable\"\nelse\n    echo \"The object isn't executable\"\nfi\n\
    if [ -f $file ]      # check if the object is a file\nthen\n    echo \"The object\
    \ is a file\"\nelse\n    echo \"The object isn't a file\"\nfi\nif [ -d $file ]\
    \      # check if the object is a directory\nthen\n    echo \"The object is a\
    \ directory\"\nelse\n    echo \"The object isn't a directory\"\nfi\nif [ -s $file\
    \ ]      # check if the object isn’t empty\nthen\n    echo \"The object isn't\
    \ empty\"\nelse\n    echo \"The object is empty\"\nfi\nif [ -e $file ]      #\
    \ check if the file is existing\nthen\n    echo \"The file is existing\"\nelse\n\
    \    echo \"The file isn't existing\"\nfi\n```\n\nOutput:\n```\nThe object isn't\
    \ readable\nThe object isn't writable\nThe object isn't executable\nThe object\
    \ isn't a file\nThe object isn't a directory\nThe object is empty\nThe file isn't\
    \ existing\n```\n\nExplanation: Assume that there is no file “myFile.sh” in directory\
    \ “root”, but we still check the property of this file. Let’s review the following\
    \ file operators:\n\n| `-d file` | If the object is a directory, return true |\n\
    | `-f file` | If the object is a file, return true |\n| `-r file` | If the object\
    \ is a readable file, return true . |\n| `-w file` | If the object is a writable\
    \ file, return true . |\n| `-x file` | If the object is an executable file, return\
    \ true . |\n| `-e file` | If the object is an empty file, return true . |\n| `-s\
    \ file` | If the object isn’t an empty file, return true . |\n\n# `echo` Command\n\
    \n`echo` command is used to output contents. Here, let’s talk about its special\
    \ usages.\n\n### Escape Characters\n```bash\n#!/bin/bash\necho \"\\\"C in 8 Hours\\\
    \"\n```\nOutput:\n```\nC in 8 Hours\n```\n\n### Variable Value\n```bash\n#!/bin/bash\n\
    book=\"C in 8 Hours\"\necho \"$book is a great book\"\n```\nOutput:\n```\nC in\
    \ 8 Hours is a great book\n```\n\n### Contents in the Same Line\n```bash\n#!/bin/bash\n\
    echo -e \"Go\\n\" # turn on the escape switch\necho \"in 8 Hours\" # output in\
    \ the same line\n```\nOutput:\n```\nGo\nin 8 Hours\n```\n\n### To a File\n```bash\n\
    #!/bin/bash\necho \"PHP in 8 Hours\" > myFile # redirect to\n```\n\n### Original\
    \ Format\n```bash\n#!/bin/bash\necho 'He said: \"OK!\" ' # using single quotes\n\
    ```\nOutput:\n```\nHe said: \"OK!\"\n```\n\n### Executed Result\n```bash\n#!/bin/bash\n\
    echo Today is `date` # using back quotes rather than single quotes\n```\nOutput:\n\
    ```\nToday is Thu Aug 22 09:01:19 DST 2019\n```\n\n### Input by Users\n```bash\n\
    #!/bin/bash\necho \"Please type your name: \"\nread name # “read” accepts the\
    \ input by users\necho \"My name is $name\"\n```\nOutput:\n```\nPlease type your\
    \ name:Ray Yao\nMy name is Ray Yao\n```\n\n# Hour 6: Test Command\n\nThe `test`\
    \ command checks to see if a condition is true. It can be used to test three aspects:\
    \ numerics, characters and files. `[]` is used to execute the calculation.\n\n\
    ## Example 6.1\n```bash\n#!/bin/bash\nnum1=10\nnum2=20\nif test $[num1] -eq $[num2]\n\
    then\n    echo 'Two numbers are equal. '\nelse\n    echo 'Two numbers are not\
    \ equal. '\nfi\n```\nOutput:\n```\nTwo numbers are not equal.\n```\nExplanation:\
    \ `test $[num1] -eq $[num2]` tests the equality of two numbers. In an expression,\
    \ the two sides of `=` cannot have spaces.\n\n## Example 6.2\n```bash\n#!/bin/bash\n\
    x=100\ny=200\nz=$[x + y]\necho \"The result is： $z\"\n```\nOutput:\n```\nThe result\
    \ is: 300\n```\nExplanation: `[x + y]` executes an arithmetical calculation. Note:\
    \ the two sides of `=` cannot have spaces.\n\n## Example 6.3\n```bash\n#!/bin/bash\n\
    str1=\"Java\"\nstr2=\"JavaScript\"\nif test $str1 = $str2\nthen\n    echo 'Two\
    \ strings are equal! '\nelse\n    echo 'Two strings are not equal! '\nfi\n```\n\
    Output:\n```\nTwo strings are not equal!\n```\nExplanation: `test $str1 = $str2`\
    \ tests the equality of two strings.\n\n## Example 6.4\n```bash\n#!/bin/bash\n\
    # assume that theFile.sh is not existing .\nif test -e /root/theFile.sh      #\
    \ -e checks existence\nthen\n    echo 'The file exists! '\nelse\n    echo ' The\
    \ file doesn't exist! '\nfi\n```\nOutput:\n```\nThe file doesn't exist!\n```\n\
    Explanation: Assume that the `File.sh` is not existing. `test -e /root/theFile.sh`\
    \ tests whether the file is existing.\n\n## Example 6.5\n```bash\n#!/bin/bash\n\
    # assume \"$myString\" has not been assigned a value yet .\nif test -n \"$myString\"\
    \      # -n checks empty string\nthen\n    echo \"It's not an empty string. \"\
    \nelse\n    echo \"It's an empty string. \"\nfi\n```\nOutput:\n```\nIt's an empty\
    \ string.\n```\nExplanation: Because `$myString` has not been assigned any value,\
    \ it is an empty string.\n\n# Shell Function\n\nA function is a code block that\
    \ can repeat to run many times. The syntax to define a function is as follows:\n\
    \n| `function_name(){}` |\n\nTo call a function, use `function_name;`\n\n| `function_name`\
    \ |\n"
