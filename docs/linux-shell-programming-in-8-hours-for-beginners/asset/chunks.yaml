  trans: "\n\n# 示例 6.6\n```bash\n#! /bin/bash\nmyFunction() {\n    # define a function\n\
    \    echo \"jQuery in 8 Hours\"\n}\necho \"Before calling the function. \"\nmyFunction\
    \     # call the function\necho \"After calling the function. \"\n```\n**输出：**\n\
    ```\nBefore calling the function.\njQuery in 8 Hours\nAfter calling the function.\n\
    ```\n**解释：** `myFunction(){ }` 定义了一个函数；`myFunction` 调用该函数。\n\n## 带参数的函数\n在调用函数时，你可以将参数传递给函数体。例如，将第一个参数传递给\
    \ `${1}`，将第二个参数传递给 `${2}` ...\n\n### 示例 6.7\n```bash\n#! /bin/bash\nmyFunction(){\n\
    \    echo \"The first parameter is: ${1} ! \"\n    echo \"The second parameter\
    \ is: ${2} ! \"\n    echo \"The third parameter is: ${3} ! \"\n    echo \"The\
    \ fourth parameter is: ${4} ! \"\n    echo \"All parameters are: $* ! \"\n}\n\
    myFunction Kotlin in 8 Hour     # pass four parameters\n```\n**输出：**\n```\nThe\
    \ first parameter is: Kotlin !\nThe second parameter is: in !\nThe third parameter\
    \ is: 8 !\nThe fourth parameter is: Hours !\nAll parameters are: Kotlin in 8 Hours\
    \ !\n```\n**解释：** `${1}` 接收第一个参数；`${2}` 接收第二个参数；`*` 显示所有参数；`myFunction Kotlin\
    \ in 8 Hour ` 调用函数并传递了四个参数。\n\n## 返回值\n`return` 可以向 `$?` 返回一个值。`$?` 显示返回值。（在某些机器上，`$?`\
    \ 只显示 0 到 255 之间的值。）\n\n| function_name { return value } |\n| `$?` # 显示返回值 |\n\
    \n### 示例 6.8\n```bash\n#! /bin/bash\nadd(){\n    # define a function\n    x=100\n\
    \    y=155\n    z=`expr $x + $y`\n    return $z    # returns the value to $ ?\n\
    }\nadd      # call the function\necho \"The sum of two numbers is $? \"\n```\n\
    **输出：**\n```\nThe sum of two numbers is 255\n```\n**解释：** `return $z` 将值返回给 `$?`。（在某些机器上，`$?`\
    \ 只显示 0 到 255 之间的值。）\n\n### 示例 6.9\n```bash\n#! /bin/bash\nmyFunction(){\n   \
    \ echo \"Please enter the first number:\"\n    read x          # assume entering\
    \ 80\n    echo \"Please enter the second number:\"\n    read y          # assume\
    \ entering 90\n    z=`expr $x + $y`\n    return $z       # returns a value to\
    \ \"$? ?\"\n}\nmyFunction\necho \"The return value is $? \"\n```\n**输出：**\n```\n\
    Please enter the first number:80\nPlease enter the second number:90\nThe return\
    \ value is 170\n```\n**解释：** `return $z` 将值返回给 `$?`；`$?` 显示返回值。\n\n# 第 7 小\n##\
    \ `if .. then .. elif .. then .. else`\n`if...then...elif...then...else` 当条件为真时执行此代码，当条件为假时执行该代码。\n\
    \n| if condition1 then code1 | elif condition2 then code2 | else code3 |\n`elif`\
    \ 意味着 `else...if...`\n\n### 示例 7.1\n```bash\n#! /bin/bash\nx=100\ny=80\nif [ $x\
    \ == $y ]\nthen\n    echo \"x is equal to y\"\nelif [ $x -gt $y ]\nthen\n    echo\
    \ \"x is greater than y\"\nelif [ $x -lt $y ]\nthen\n    echo \"x is less than\
    \ y\"\nelse\n    echo \"n\"\nfi\n```\n**输出：**\n```\nx is greater than y\n```\n\
    **解释：** `elif` 意味着 `else...if...`；`elif [ $x -gt $y ]` 测试 `$x` 是否大于 `$y`。\n\n\
    ## For 循环\n`for loop 通过指定的项目重复执行代码块。\n\n| for var in item1 item2 item3… do code1\
    \ code2… |\n\n### 示例 7.2\n```bash\n#! /bin/bash\nfor var in 1 2 3\ndo\n    echo\
    \ \"The number is: $var\"\ndone\n```\n**输出：**\n```\nThe number is: 1\nThe number\
    \ is: 2\nThe number is: 3\n```\n**解释：** `for var in 1 2 3` 在 `var=1`、`var=2`、`var=3`\
    \ 时重复执行代码。\n\n### 示例 7.3\n```bash\n#! /bin/bash\nfor str in 8 Hours\ndo\n    echo\
    \ $str\ndone\n```\n**输出：**\n```\n8\nHours\n```\n**解释：** `for str in 8 Hours` 在\
    \ `str=8`, `str=Hours` 时重复执行代码。\n\n## While 循环\n`while loop 当条件为真时循环代码块。\n\n|\
    \ while condition do code |\n\n### 示例 7.4\n```bash\n#! /bin/bash\ncounter=1\n\
    while(( $counter<=4 ))\ndo\n    echo $counter\n    counter=`expr $counter + 1`\n\
    done\n```\n**输出：**\n```\n1\n2\n3\n4\n```\n**解释：** `($counter<=4)` 是测试条件，如果条件为真，将最多循环四次。`While\
    \ Loop` 用于连续输入数据，但如果你想完成输入，按 `<ctrl + d>` 退出。\n\n### 示例 7.5\n```bash\n#! /bin/bash\n\
    echo 'Please enter a name: '\nwhile read # accepts the input from user\ndo\n \
    \   echo \"OK!\"\n    echo \"If quit, please press <ctrl + d>.\"\ndone\n```\n\
    **输出：**\n```\nPlease enter a name: \nOK!\n```\n**解释：** `while read` 接受来自用户的连续输入。你可以多次输入。\n\
    \n## Until 循环\n`until loop 当条件为假时循环代码块，当条件为真时退出循环。\n\n| until condition do code\
    \ |\n\n### 示例 7.6\n```bash\n#! /bin/bash\nn=0\nuntil [ $n -ge 4 ]\ndo\n    echo\
    \ $n\n    n=`expr $n + 1`\ndone\n```\n**输出：**\n```\n0\n1\n2\n3\n```\n**解释：** `until\
    \ [ $n -ge 4 ]` 当 `$n` 等于 4 时退出循环。\n\n## Case 语句\n`case statement` 是多选择。`case`\
    \ 匹配一个值。如果匹配成功，执行相应的命令。\n\n| case value in pattern1) code1;; pattern2) code2;;\
    \ pattern3) code3;; pattern4) code4;; pattern*) # match nothing, run this . |\n\
    \n### 示例 7.7\n```bash\n#! /bin/bash\necho 'Please input a number between 1 to\
    \ 4:'\nread num\ncase $num in\n    1) echo 'You have input 1';;\n    2) echo 'You\
    \ have input 2';;\n    3) echo 'You have input 3';;\n    4) echo 'You have input\
    \ 4';;\n    *) echo 'Your number is not between 1 to 4';;\nesac\n```\n**输出：**\n\
    ```\nPlease input a number between 1 to 4:2\nYou have input 2\n```\n**解释：** 假设我们输入了\
    \ 2，匹配第二个 case，因此执行第二个代码。\n\n## Break 命令\n`break` 关键字用于根据条件停止循环运行。\n\n| break\
    \ |\n\n### 示例 7.8\n```bash\n#! /bin/bash\nnum=0\nwhile(( $num<=8))\ndo\n    if\
    \ [ $num == 3 ]\n    then\n        break # quit the while loop\n    fi\n    num=`expr\
    \ $num + 1`\ndone\necho $num\n```\n**输出：**\n```\n3\n```\n**解释：** 如果 `$num` 是 3，程序将运行\
    \ `break` 命令并退出 while 循环。\n\n## Continue 命令\n`continue` 命令用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\
    \n| continue |\n\n### 示例 7.9\n```bash\n#! /bin/sh\nnums=\"1 2 3 4 5 \"\nfor n\
    \ in $nums\ndo\n    if [ $n -eq 3 ]\n    then\n        continue # run the next\
    \ for loop\n    fi\n    echo $n\ndone\n```\n**输出：**\n```\n1\n2\n4\n5\n```\n**解释：**\
    \ 注意：输出中没有 3。如果 `$n = 3`，程序将运行 `continue` 命令，忽略下一个命令 `echo $n`，然后运行下一个 `for loop`。\n\
    \n# 第 8 小\n## Select 语句\n`Select` 语句允许用户选择一个符合条件的项目并运行相关代码。`Select` 语句通常与 `Case`\
    \ 语句配合使用。\n\n| select var in item1 item2 item3... case done\n\n### 示例 8.1\n```bash\n\
    #! /bin/bash\necho \"Please input a number between 1 to 4. \"\necho \"If you input\
    \ 4, the program will exit. \"\nselect choice in 1 2 3 4 ; # select one number\n\
    case $choice in\n    1) echo \"You choose 1\";;\n    2) echo \"You choose 2\"\
    ;;\n    3) echo \"You choose 3\";;\n    4) echo \"You choose 4 to exit\"\n   \
    \     break;;\n    *) echo \"Enter error! \"\n        break;;\nesac\ndone\n```\n\
    **输出：**\n```\nPlease input a number between 1 to 4.\nIf you input 4, the program\
    \ will exit.\n1) 1\n2) 2\n3) 3\n4) 4\n? 2\nYou choose 2\n? 4\nYou choose 4 to\
    \ exit\n```\n**解释：** 假设我们第一次输入 2，第二次输入 4。`select choice in 1 2 3 4 ;` 选择 4 个数字之一。`Select`\
    \ 语句通常与 `Case` 语句配合使用。`#` 是输入提示符，你可以输入一个数字。\n\n"
- fmt: "\n“File n”, “File m” means the file with file descriptor `0`, `1` or `2`.\
    \ `0` means Standard Input (`STDIN`), `1` means Standard Output (`STDOUT`), and\
    \ `2` means Standard Error (`STDERR`).\n\n## Output Redirection\nOutput redirection:\
    \ Execute the command and store the output into the file by using `>`.\n\n| `command\
    \ > file` |\n\n**Example 8.2**\n```bash\necho \"R in 8 Hours\" > myFile\ncat myFile\
    \ # \"cat\" views the content of myfile\n```\n**Output:**\n`R in 8 Hours`\n**Explanation:**\
    \ `echo \"R in 8 Hours\" > myFile` redirects the output to `myFile`. You need\
    \ to use `cat` command to view the contents of `myFile`.\n![](rsrc3M2.jpg)\n\n\
    ## Append Redirection\nIf you don't want the file content to be overwritten, please\
    \ append the contents to the end of the file by using `>>`.\n\n| `command >> file`\
    \ |\n\n**Example 8.3**\n```bash\necho \"R in 8 Hours\" > myFile\necho \"It is\
    \ good! \" >> myFile\ncat myFile # \"cat\" views the content of myfile\n```\n\
    **Output:**\n`R in 8 Hours`\n`It is good!`\n**Explanation:** `echo \"It is good!\
    \ \" >> myFile` append the contents to `myFile`.\n![](rsrc3M3.jpg)\n\n## Input\
    \ Redirection\nInput redirection: Get input from a file by using `<`.\n\n| `command\
    \ < file` |\n\n**Example 8.4**\n```bash\nwc < myFile # myFile is created on the\
    \ previous page .\n```\n**Output:**\n`2 7 25`\n**Explanation:** `wc < myFile`\
    \ gets the input from `myFile`. `wc` counts how many lines, words, characters\
    \ in the file.\n- `2`: there are two lines.\n- `7`: there are seven words.\n-\
    \ `25`: there are characters. (including spaces)\n`myFile` is the file created\
    \ on the previous page.\n\n## File Descriptor\nWhen each Linux command executes,\
    \ they will open three files:\n\n1. **Standard input file (stdin):** the file\
    \ descriptor of `stdin` is `0`, and the Shell program reads data from `stdin`\
    \ by default.\n2. **Standard output file (stdout):** the file descriptor of `stdout`\
    \ is `1`, and Shell program writes data to `stdout` by default.\n3. **Standard\
    \ error file (stderr):** the file descriptor of `stderr` is `2`, and the Shell\
    \ program writes error messages to the `stderr` stream.\n\n**Example:**\n- `command\
    \ < file` redirects stdin to file:\n  | `$ command < file` |\n- `command > file`\
    \ redirects stdout to file:\n  | `$ command > file` |\n- Read the input from the\
    \ infile file, write the output to the outfile:\n  | `$ command < infile > outfile`\
    \ |\n\n## Here Document\nHere Document is used to redirect the file contents to\
    \ a command.\n\n| `command << delimiter delimiter` |\n\nThe second delimiter must\
    \ be on the most left, no characters in front, and no characters in the back.\n\
    \n**Example 8.5**\n```bash\n#! /bin/bash\ncat << DOC # DOC defines a Here Document\n\
    AngularJS in 8 Hours\nJavaScript in 8 Hours\nVisual Basics in 8 Hours\nDOC\n```\n\
    **Output:**\n`AngularJS in 8 Hours`\n`JavaScript in 8 Hours`\n`Visual Basics in\
    \ 8 Hours`\n**Explanation:** `cat << DOC……DOC` is a special redirecting mode,\
    \ redirect the file contents to a command. `cat` shows the contents of the file.\
    \ `DOC` is a delimiter. You can specify other characters as a delimiter. `DOC……DOC`\
    \ defines a Here Document.\n\n**Example 8.6**\n```bash\n#! /bin/bash\nwc << EOF\
    \ # wc counts the number of lines, word, characters\nAngularJS in 8 Hours\nJavaScript\
    \ in 8 Hours\nVisual Basics in 8 Hours\nEOF\n```\n**Output:**\n`3 13 68`\n**Explanation:**\
    \ `wc << EOF……EOF` redirects the document contents to `wc`. `wc` is used to count\
    \ the numbers of lines, words and characters. `EOF` is a delimiter, defines a\
    \ Here Document.\n- `3`: means 3 lines.\n- `13`: means 13 words.\n- `68`: means\
    \ 68 characters, including spaces.\n\n## File Included\nThe Shell can include\
    \ an external script file into the current file.\n\n| `source ./ external_file`\
    \ |\n\n`./` locates the external file. We will create two files as examples.\n\
    \n**(1) The file `file1.sh` is as follows:**\n**Example 8.7**\n```bash\n#! /bin/bash\n\
    url =\"http://www.lulu.com/spotlight/Ray_Yao\"\n```\n**(2) The file `file2.sh`\
    \ is as follows:**\n**Example 8.8**\n```bash\n#! /bin/bash\nsource ./file1.sh\
    \ # include an external file\necho \"The website of Ray Yao is： $url \"\n```\n\
    **Output:**\n`The website of Ray Yao is ：http://www.lulu.com/spotlight/Ray_Yao`\n\
    **Explanation:** `source ./file1.sh` includes an external file.\n\n## Printf Command\n\
    `printf` is used to format the output.\n\n| Format | Description |\n| :--- | :---\
    \ |\n| `%b` | Print as binary |\n| `%d` | Print as digital |\n| `%f` | Print as\
    \ float-point |\n| `%o` | Print as octal |\n| `%s` | Print as string |\n| `%x`\
    \ | Print as hexadecimal |\n\n## Escape Sequences\n- `\\a`: outputs an alert\n\
    - `\\n`: outputs the next line\n- `\\r`: outputs a return\n- `\\t`: outputs a\
    \ tab\n- `\\f`: outputs the next page\n- `\\\"`: outputs a double quote\n\n##\
    \ Comparison Operators\nLinux Shell has comparison operators:\n\n| Operators |\
    \ Checks |\n| :--- | :--- |\n| `-eq` | equal |\n| `-ne` | not equal |\n| `-gt`\
    \ | greater than |\n| `-ge` | greater or equal |\n| `-lt` | less than |\n| `-le`\
    \ | less or equal |\nThe comparison expression returns true or false.\n\n## Boolean\
    \ Operators\n| Operators | |\n| :--- | :--- |\n| `-a` | AND |\n| `-o` | OR |\n\
    | `!` | NOT |\nAfter using logical operators, the result will be true or false.\n\
    \n## String Operators\n| Operators | Checks |\n| :--- | :--- |\n| `=` | If two\
    \ strings are equal |\n| `!=` | If two strings are not equal |\n| `-z` | If the\
    \ length of a string is equal to zero |\n| `-n` | If the length of a string is\
    \ not equal to zero |\n| `$` | If the string is not empty\n\n## File Operators\n\
    File operators are used to detect various properties of Linux files.\n\n| Operator\
    \ | Checks |\n| :--- | :--- |\n| `-d` | If the object is a directory, return true\
    \ |\n| `-f` | If the object is a file, return true |\n| `-p` | If the object is\
    \ a pipe, return true |\n| `-r` | If the object is a readable file, return true\
    \ |\n| `-w` | If the object is a writable file, return true |\n| `-x` | If the\
    \ object is an executable file, return true |\n| `-e` | If the object is a file,\
    \ return true |\n| `-s` | If the object isn’t an empty file, return true |\n|\
    \ `-b` | If the object is a block device file, return true |\n| `-c` | If the\
    \ object is a character device file, return true |\n\n## I/O Redirection Chart\n\
    Linux Shell system commands take input from your terminal and send the resulting\
    \ output back to your terminal. A command usually reads data from standard input,\
    \ and writes data to standard output. The commands of the redirection are as follows:\n\
    \n| Commands | Descriptions |\n| :--- | :--- |\n| `command > file` | redirect\
    \ output to the file. |\n| `command < file` | redirect input to the file. |\n\
    | `command >> file` | append output to the file. |\n| `n > file` | redirect File\
    \ `n` to the file |\n| `n >> file` | append File `n` to the file |\n| `n >& m`\
    \ | combine the output file `m` and File `n` |\n| `n <& m` | combine the input\
    \ file `m` and File `n` |\n| `<< tag` | take the content between tags as input.\
    \ |\n"
