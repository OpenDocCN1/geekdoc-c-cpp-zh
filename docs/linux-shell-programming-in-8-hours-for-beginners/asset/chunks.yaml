  trans: "\n\n# 示例 1.5\n```bash\n#!/bin/bash\nmyVar=\"C# in 8 Hours\"\nreadonly myVar\n\
    myVar=\"Scala in 8 Hours\"      # 修改变量值\n```\n输出：\n(如下所示错误信息:)\n```bash\ntest.\
    \ sh: line 4: myVar: readonly variable\n```\n解释：\n`readonly myVar` 将 `myVar` 设置为只读。输出是一个错误信息。`myVar`\
    \ 变成只读变量后，对 `myVar` 值的任何更改都会导致错误。\n\n## 删除变量\n`unset` 命令可以删除变量。\n\n| `unset 变量`\
    \ |\n\n# 示例 1.6\n```bash\n#! /bin/sh\nmyVar=\"C++ in 8 Hours\"\nunset myVar  \
    \      # 移除变量\necho $myVar\n```\n输出：\n(无输出)\n解释：\n变量被移除后，该变量不再存在，其值也不再存在。因此你看不到任何输出。\n\
    \n## 变量的输入\n变量的值可以由用户从键盘输入。\n\n| `read 变量` |\n\n# 示例 1.7\n```bash\n#! /bin/sh\n\
    echo \"Please input your name. \"\nread myInput        # 输入值将存储在 myInput 中\necho\
    \ \"Hi! Your name is: $myInput\"  # 假设我输入我的名字：Ray Yao\n```\n输出：\nPlease input\
    \ your name.\nRay Yao\nHi! Your name is Ray Yao\n解释：\n假设我输入了名字：Ray Yao。`read myInput`\
    \ 将输入值存储到 `myInput` 中。`echo \"Hi! Your name is: $myInput\"` 显示了输入值。\n\n# 第 2 小\n\
    ## Shell 字符串 (1)\n字符串被单引号包围。\n\n| `str='This is a string'` |\n\n*   单引号内的任何字符将按其原始格式打印。\n\
    *   单引号内的字符串变量是无效的。\n\n# 示例 2.1\n```bash\n#! /bin/sh\nvar=Andy\nstr='Hello, $var'\
    \         # 单引号字符串\necho $str\n```\n输出：\nHello, $var\n解释：\n'Hello, $var' 是一个单引号字符串。单引号内的任何字符将按其原始格式打印。\n\
    \n## Shell 字符串 (2)\n字符串被双引号包围。\n\n| `str=\"This is a string\"` |\n\n*   双引号内的任何字符将通过其返回值打印。\
    \ \n*   双引号内的字符串变量是有效的。\n\n# 示例 2.2\n```bash\n#! /bin/sh\nvar=Andy\nstr=\"Hello,\
    \ $var\"          # 双引号字符串\necho $str\n```\n输出：\nHello, Andy\n解释：\n'Hello, $var'\
    \ 是一个双引号字符串。双引号内的任何字符将通过其返回值打印。\n\n## 连接字符串\n我们可以使用双引号连接两个字符串。\n\n# 示例 2.3\n```bash\n\
    #! /bin/sh\nstr1=\"Kotlin\"\nstr2=\"in 8 Hours\"\nmyString=\"$str1 $str2\"   \
    \   # 连接两个字符串\necho $myString\n```\n输出：\nKotlin in 8 Hours\n解释：\n\"$str1 $str2\"\
    \ 使用双引号将两个字符串连接成一个字符串。\n\n## 字符串长度\n我们可以通过 `#` 符号获取字符串的长度。\n\n| `#string` |\n\n\
    # 示例 2.4\n```bash\n#! /bin/sh\nstr=\"jQuery in 8 Hours\"\necho ${#str }      \
    \ # 获取字符串的长度\n```\n输出：\n17\n解释：\n`#str` 可以获取字符串的长度。字符串长度为 17 个字符（包括空格）。 \n\n##\
    \ 提取子字符串\n我们可以从字符串中提取子字符串。\n\n| `string : 起 : 长度` |\n\n*   `start`: 提取从此索引开始。\n\
    *   `length`: 提取的大小。\n\n# 示例 2.5\n```bash\n#! /bin/sh\nstr=\"DjanGo in 8 Hours\"\
    \necho ${str:4:16 }      # 提取子字符串\n```\n输出：\nGo in 8 Hours\n解释：\n`str: 4: 16`\
    \ 提取从索引 4 开始的子字符串，提取长度为 16。\n\n## 关于 `expr…`\n`` expr…` `` 是一个表达式，用于计算。\n\n| ``\
    \ ` expr…` `` |\n\n注意：` ` 是反引号，而不是单引号。` ` 键位于键盘的最左侧。\n\n# 示例 2.6\n```bash\n#!\
    \ /bin/sh\nx=100\ny=200\nz=`expr $x + $y`       # 一个表达式\necho \"The sum is $z\"\
    \n```\n输出：\nThe sum is 300\n解释：\n`expr $x + $y` 是一个表达式，计算结果将赋值给 `z`。注意：` ` 是反引号，而不是单引号。`\
    \ ` 键位于键盘的最左侧。\n\n## 搜索索引\n我们可以找到字符串中字符首次出现的索引。\n\n| `` ` expr index \"string\"\
    \ 字符` `` |\n\n注意：` ` 是反引号，而不是单引号。`\"index\"` 是参数，用于搜索字符的索引。`\"character\"` 是参数，表示你指定的字符。\n\
    \n# 示例 2.7\n```bash\n#! /bin/sh\nstr=\"Kotlin in 8 Hours\"\necho `expr index \"\
    $str\" K`\n```\n输出：\n0\n解释：\n`expr index \"$str\" K` 查找字符串中字符 K 的索引。索引从 0 开始。\n\
    \n## 变量的赋值\n```bash\n#! /bin/sh\nstr=\"Hello\"\nstr=\"World\"      # 修改变量值\necho\
    \ $str\n```\n输出：\nWorld\n解释：\n变量可以被重新赋值。\n\n"
- fmt: "\n# Array Operations\n\n## `array_name[@]` or `array_name[*]`\n\n### Example\
    \ 3.2\n```bash\n#!/bin/bash\nmy_array[0]=Java\nmy_array[1]=Ruby\nmy_array[2]=Html\n\
    my_array[3]=Rust\necho \"All elements are: ${my_array[@] }\"\necho \"All elements\
    \ are: ${my_array[*] }\"\n```\n**Output:**\n```\nAll elements are: Java  Ruby\
    \  Html  Rust\nAll elements are: Java  Ruby  Html  Rust\n```\n**Explanation:**\
    \ `my_array[@]` or `my_array[*]` can get all elements of the array.\n\n### Array\
    \ Length\n`#array_name[@]` or `#array_name[*]` can get the length of an array.\n\
    \n## `#array_name[@]` or `#array_name[*]` \n\n### Example 3.3\n```bash\n#!/bin/bash\n\
    my_array=(PHP MySQL in 8 Hours)\nlength1=${#my_array[@] }\nlength2=${#my_array[*]\
    \ }\necho $length1\necho $length2\n```\n**Output:**\n```\n5\n5\n```\n**Explanation:**\
    \ `#my_array[@]` or `#my_array[*]` can get the length of an array.\n\n# Printf\
    \ Command\n\n`printf` is a command to format the output in the Shell.\n\n## `printf\
    \ \"type\"` variables\n\n`\"type\"` is a parameter used to format the output.\n\
    \n| Type | Description |\n| :--- | :--- |\n| `%b` | Print it as a binary value\
    \ |\n| `%d` | Print it as a digital value |\n| `%f` | Print it as a float-point\
    \ value |\n| `%o` | Print it as an octal value |\n| `%s` | Print it as a string\
    \ value |\n| `%x` | Print it as a hexadecimal value |\n\nFor example:\n- `%10s`\
    \ means formatting as a string with a maximum width of 10 characters\n- `%-10s`\
    \ means formatting as a string with a maximum width of 10 characters (`-` sign\
    \ means left aligned, no `-` sign means right aligned)\n- `%8. 2f` means formatting\
    \ as float-point value, `8` means 8 integers, `2` means 2 decimal places.\n- `%-8.\
    \ 2f` means formatting as float-point value, `8` means 8 integers, `2` means 2\
    \ decimal places. (`-` sign means left aligned, no –` sign means right aligned)\n\
    \n### Example 3.4\n```bash\nprintf \"%-10s %-7s %-8s\\n\" Name Age Weight\n```\n\
    **Output:**\n```\nName      Age      Weight\n```\n**Explanation:**\n- `\"%-10s\"\
    ` is replaced by `\"Name\"`, `\"Name\"` is formatted as a string with maximum\
    \ 10 characters, left aligned.\n- `\"%-7s\"` is replaced by `\"Age\"`, `\"Age\"\
    ` is formatted as a string with maximum 7 characters, left aligned.\n- `\"%-8s\"\
    ` is replaced by `\"Weight\"`, `\"Weight\"` is formatted as a string with maximum\
    \ 8 characters, left aligned.\n- `\"\\n\"` is used to go to the next line.\n\n\
    ### Example 3.5\n```bash\n#!/bin/bash\nprintf \"%-10s %-7s %-8s\\n\" Name Age\
    \ Weight\nprintf \"%-10s %-7d %-5. 2f\\n\" Andy 18 91.8843\nprintf \"%-10s %-7d\
    \ %-5. 2f\\n\" Tomy 19 95.4675\nprintf \"%-10s %-7d %-5. 2f\\n\" Rosy 17 80.8563\n\
    ```\n**Output:**\n```\nName      Age      Weight\nAndy      18       91.88\nTomy\
    \      19       95.47\nRosy      17       80.86\n```\n**Explanation:**\n- `\"\
    printf \"%-10s %-7d %-5. 2f\\n\" Andy 18 91.8843\"` formatted three parameters\
    \ `\"Andy\"`, `\"18\"`, `\"91.8843\"`.\n- `\"%-10s\"` is replaced by `\"Andy\"\
    `, `\"Andy\"` is formatted as a string with maximum 10 characters, left aligned.\n\
    - `\"%-7d\"` is replaced by `\"18\"`, `\"18\"` is formatted as a digital type\
    \ with maximum 7 numbers, left aligned.\n- `\"%-5. 2f\"` is replaced by `\"91.88\"\
    `, `\"91.88\"` is formatted as a float-point type with maximum 5 integers, 2 decimal\
    \ places, left aligned.\n- `\"\\n\"` is used to go to the next line.\n\n# Escape\
    \ Sequences\n\nThe `\\` backslash character can be used to escape characters.\n\
    - `\\a` outputs an alert\n- `\\n` outputs the content to the next new line.\n\
    - `\\r` makes a return\n- `\\t` makes a tab\n- `\\f` outputs the content to the\
    \ next page.\n- `\\'` outputs a single quotation mark.\n- `\\\"` outputs a double\
    \ quotation mark.\n\n### Example 3.6\n```bash\n#!/bin/bash\nprintf \"%s %s \\\
    '%s\\' \\n\" He said OK\nprintf \"%d\\t %d\\n\" 10 100\nprintf \"%s\\n %s %d %s\\\
    n\" C# in 8 Hours\n```\n**Output:**\n```\nHe said 'OK' \n10\t100\nC# in 8 Hours\n\
    ```\n**Explanation:**\n- `'%s\\'` outputs the quotation marks and a formatted\
    \ string.\n- `%d\\t` outputs a tab between two numbers.\n- `%s\\n` outputs following\
    \ in the next line.\n\n# Operators\n\nThe Shell, like other languages, supports\
    \ a variety of operators, including: Arithmetic operator, Relational operator,\
    \ Boolean operator, String operator, File operator.\n\n## `expr…`\n\n`expr…` is\
    \ an evaluation tool. The `` `` key is backtick, rather than single quote.\n\n\
    ### Example 4.1\n```bash\n#!/bin/bash\nsum=`expr 100 +200`\necho \"The sum is:\
    \ $sum\"\n```\n**Output:**\n```\nThe sum is: 300\n```\n**Explanation:**\nThe ``\
    \ `` key is backtick, rather than single quote. The complete expression must be\
    \ included by backticks. \nThere must be a space between the expression and the\
    \ operator. For example, `\"10+20\"` is wrong, `\"10 +20\"` is correct.\n\n##\
    \ `if…then…else…fi`\n\n`if` statement executes code if a specified condition is\
    \ true, `else` if false.\n\n### Example 4.2\n```bash\na=10\nb=20\nif [ $a == $b\
    \ ]; then\n  echo \"a is equal to b\"\nelse\n  echo \"a is not equal to b\"\n\
    fi\n```\n**Output:**\n```\na is not equal to b\n```\n**Explanation:**\n`[$a ==\
    \ $b]` compares `a` and `b`, check if they are equal or not.\nNote: About `==`,\
    \ it should be put between brackets with spaces. For example: `[$a==b]` is wrong,\
    \ `[$a == $b ]` is correct. `==` is a comparison operator. If a is equal to b,\
    \ return true. If a is not equal to b, return false. In above `if statement`,\
    \ because the test condition returns false, the `else code` is executed. Therefore,\
    \ `echo \"a is not equal to b\"` is executed.\n\n# Arithmetical Operators\n\n\
    | Operators | Running |\n| :--- | :--- |\n| `+` | add |\n| `-` | subtract |\n\
    | `*` | multiply (note: `*`) |\n| `/` | divide |\n| `%` | get modulus |\n| `=`\
    \ | assignment |\n| `==` | check equality |\n| `!=` | inequality |\n\n### Example\
    \ 4.3\n```bash\n#!/bin/bash\na=100\nb=2\nresult=`expr $a + $b`\necho \"a + b :\
    \ $result\"\nresult=`expr $a - $b`\necho \"a - b : $result\"\nresult=`expr $a\
    \ * $b`\necho \"a * b : $result\"\nresult=`expr $a / $b`\necho \"a / b : $result\"\
    \nresult=`expr $a % $b`\necho \"a % b : $result\"\n```\n**Output:**\n```\na +\
    \ b : 102\na - b : 98\na * b : 200\na / b : 50\na % b : 0\n```\n\n### Example\
    \ 4.4\n```bash\na=100\nb=200\nif [ $a == $b ]; then\n  echo \"a is equal to b\"\
    \nfi\nif [ $a != $b ]; then\n  echo \"a is not equal to b\"\nfi\n```\n**Output:**\n\
    ```\na is not equal to b\n```\n**Explanation:**\n`[$a != $b]` checks if `a` is\
    \ not equal to b. Note: There should be spaces between `]` and `!=`. `[$a=$b]`\
    \ is wrong. `[$a != $b ]` is correct.\n\n# Comparison Operators\n\nLinux Shell\
    \ has comparison operators as follows:\n\n| Operators | Checks |\n| :--- | :---\
    \ |\n| `-eq` | equal |\n| `-ne` | not equal |\n| `-gt` | greater than |\n| `-ge`\
    \ | greater or equal |\n| `-lt` | less than |\n| `-le` | less or equal |\n\nThe\
    \ comparison expression returns true or false.\n\n### Example 4.5\n```bash\n#!/bin/bash\n\
    a=100\nb=200\nif [ $a -eq $b ]; then\n  echo \"$a -eq $b ? a is equal to b\"\n\
    else\n  echo \"$a -eq $b ? a is not equal to b\"\nfi\nif [ $a -ne $b ]; then\n\
    \  echo \"$a -ne $b ? a is not equal to b\"\nelse\n  echo \"$a -ne $b ? a is equal\
    \ to b\"\nfi\nif [ $a -gt $b ]; then\n  echo \"$a -gt $b ? a is greater than b\"\
    \nelse\n  echo \"$a -gt $b ? a is not greater than\"\nfi\nif [ $a -lt $b ]; then\n\
    \  echo \"$a -lt $b ? a is less than b\"\nelse\n  echo \"$a -lt $b ? a is not\
    \ less than\"\nfi\nif [ $a -ge $b ]; then\n  echo \"$a -ge $b ? a is greater or\
    \ equal to b\"\nelse\n  echo \"$a -ge $b ? a is less than\"\nfi\nif [ $a -le $b\
    \ ]; then\n  echo \"$a -le $b ? a is less or equal to b\"\nelse\n  echo \"$a -le\
    \ $b ? a is greater than b\"\nfi\n```\n**Output:**\n```\n100 -eq 200 ? a is not\
    \ equal to b\n100 -ne 200 ? a is equal to b\n100 -gt 200 ? a is not greater than\n\
    100 -lt 200 ? a is not less than\n100 -ge 200 ? a is less than\n100 -le 200 ?\
    \ a is greater than b\n```\n\n# Logical Operators\n\n| Operators | Logic |\n|\
    \ :--- | :--- |\n| `-a` | AND |\n| `-o` | OR |\n| `!` | NOT |\n\nAfter using logical\
    \ operators, the result will be true or false.\n\n- `true -a true;returns true;`\n\
    - `true -a false;returns false;`\n- `false -a false;returns false;`\n- `true -o\
    \ true;returns true;`\n- `true -o false;returns true;`\n- `false -o false;return\
    \ false;`\n- `! false;returns true;`\n- `! true;returns false;`\n"
