    \n## Shell 脚本\nShell 脚本是一个包含一系列命令的文件，由 Shell 执行。Shell 脚本用于自动化任务和执行复杂操作。\n\n###\
    \ 第一个 Shell 脚本\n创建一个 Shell 脚本，请遵循以下步骤：\n1. 创建一个扩展名为 `.sh` 的文件。\n2. 添加 shebang\
    \ 行，例如 `#!/bin/bash`。\n3. 在文件中编写你的命令。\n4. 使用 `chmod +x script.sh` 使可执行。\n5. 使用\
    \ `./script.sh` 运行脚本。\n\n### Shell 释\n注释用于解释代码并被 Shell 忽略。它们以 `#` 符号开头。\n\n```bash\n\
    # 这是一个注释\n```\n\n### 多行注释\n对于多行注释，你可以使用 `<<EOF` 语法：\n\n```bash\n<< 'EOF'\n这是一个多行注释。\n\
    它跨越多行。\nEOF\n```\n\n### 变量\n变量用于在 Shell 脚本中存储数据。你可以通过赋值值来定义变量。\n\n```bash\nname=\"\
    John Doe\"\n```\n\n### 变量名\n变量名必须以字母或下划线开头，可以包含字母、数字和下划线。它们是对大小敏感的。\n\n### 只读变量\n\
    只读变量在定义后无法更改。\n\n```bash\nreadonly constant_var=\"value\"\n```\n\n### 删除变量\n使用\
    \ `unset` 命令删除变量。\n\n```bash\nunset name\n```\n\n字体 变量输入\n你可以使用 `read` 命令从用户那里获取输入。\n\
    \n```bash\nread -p \"Enter your name: \" name\necho \"Hello, $name\"\n```\n\n\
    # 第 2 小时\n\n## Shell 字符串 (1)\n字符串是字符序列。可以用单引号或双引号括起来。\n\n### Shell 字符串 (2)\n将它们放在一起来拼接字符串。\n\
    \n### 连接字符串\n```bash\nstr1=\"Hello\"\nstr2=\"World\"\ncombined=\"$str1 $str2\"\
    \necho $combined\n```\n\n### 字符串长度\n要找到字符串的长度，使用 `${#variable}` 语法。\n\n```bash\n\
    echo ${#str}\n```\n\n### 提取子字符串\n你可以使用参数扩展从字符串中提取子字符串。\n\n```bash\nstr=\"Hello\
    \ World\"\necho ${str:0:5} # 输出: Hello\n```\n\n### 关于 `expr…`\n`expr` 命令可以用于字符串操作，例如查找长度。\n\
    \n```bash\nexpr length \"Hello World\"\n```\n\n### 搜索索引\n要找到字符串子字符串的位置，使用模式。\n\
    \n## Shell 参数\nShell 参数是提供环境和参数信息的特殊变量。\n\n### 内置参数\n- `$0`: 脚本名称。\n- `$1`, `$2`,\
    \ ...: 位置参数。\n- `$#`: 参数数量。\n- `$*`: 所有参数。\n- `$@`: 所有参数。\n\n# 第 3 小时\n\n## Shell\
    \ 数组\n数组用于在一个变量中存储多个值。\n\n```bash\narr=(\"apple\" \"banana\" \"cherry\")\n```\n\
    \n### 访问元素\n使用索引访问单个数组元素。\n\n```bash\necho ${arr[0]}\n```\n\n### 获取所有元素\n要获取数组的所有元素，使用\
    \ `${arr[@]}`。\n\n```bash\necho \"${arr[@]}\"\n```\n\n### 数组长度\n要找到数组中的元素数量，使用\
    \ `${#arr[@]}`。\n\n```bash\necho ${#arr[@]}\n```\n\n### Printf 命令\n`printf` 命令用于格式化输出。\n\
    \n```bash\nprintf \"Hello, %s!\\n\" \"World\"\n```\n\n### 转义序列\n转义序列用于表示字符串中的特殊字符。\n\
    \n# 第 4 小时\n\n## 运算符\n运算符用于计算和比较。\n\n### if…then…else…fi\n`if` 语句用于条件执行。\n\n```bash\n\
    if [ $a -gt 5 ]; then\n  echo \"Greater than 5\"\nelse\n  echo \"Less or equal\
    \ to 5\"\nfi\n```\n\n### 算术运算符\n`+`, `-`, `*`, `/`, `%`\n\n### 比较运算符\n`-eq`, `-ne`,\
    \ `-gt`, `-lt`, `-ge`, `-le`\n\n### 逻辑运算符\n`&&` (与), `||` (或), `!` (非)\n\n# 第\
    \ 5\n\n## 字符串运算符\n用于比较字符串的运算符。\n\n### 文件运算符\n用于检查文件属性的运算符。\n\n### “echo” 命令\n\
    `echo` 命令用于将文本打印到终端。\n\n# 第 6 小时\n\n## Test 命令\n`test` 命令用于各种测试。\n\n### [[ ]]\
    \ 符号\n`[[ ]]` 语法用于表达式。\n\n### 测试相等性\n### 测试存在性\n### 测试空字符串\n\n### Shell 函数\n函数是可复用的代码块。\n\
    \n### 带参数的函数\n### 返回值\n\n# 第 7 小时\n\n## if..then ..elif..then..else\n### For 循环\n\
    ### While 循环\n### Until 循环\n### Case 语句\n### Break 命令\n### Continue 命令\n\n# 第\
    \ 8 小时\n\n## Select 语句\n### I/O 重定向\n### 输出重定向\n### 追加重定向\n### 输入重定向\n### 文件描述符\n\
    ### Here Document\n### 包含文件\n"
- fmt: "\n# Example 1.5\n```bash\n#!/bin/bash\nmyVar=\"C# in 8 Hours\"\nreadonly myVar\n\
    myVar=\"Scala in 8 Hours\"      # change the variable value\n```\nOutput:\n( an\
    \ error message as follows:)\n```bash\ntest. sh: line 4: myVar: readonly variable\n\
    ```\nExplanation:\n`readonly myVar` sets `myVar` as read only. The output is an\
    \ error message. After `myVar` becomes a read-only variable, any change in the\
    \ value of `myVar` will cause an error.\n\n## Remove Variable\nThe `unset` command\
    \ can delete variables.\n\n| `unset variable` |\n\n# Example 1.6\n```bash\n#!\
    \ /bin/sh\nmyVar=\"C++ in 8 Hours\"\nunset myVar        # remove a variable\n\
    echo $myVar\n```\nOutput:\n(nothing)\nExplanation:\nAfter a variable is removed,\
    \ the variable no longer exists, and its value no longer exists. So you don't\
    \ see any output.\n\n## Input to Variable\nThe value of a variable can be input\
    \ from keyboard by a user.\n\n| `read variable` |\n\n# Example 1.7\n```bash\n\
    #! /bin/sh\necho \"Please input your name. \"\nread myInput        # the input\
    \ value will be stored in myInput\necho \"Hi! Your name is: $myInput\"  # Assume\
    \ that I will input my name:  Ray Yao\n```\nOutput:\nPlease input your name.\n\
    Ray Yao\nHi! Your name is Ray Yao\nExplanation:\nAssume that I input my name:\
    \ Ray Yao. `read myInput` stores the input value to `myInput`. `echo \"Hi! Your\
    \ name is: $myInput\"` shows the input value.\n\n# Hour 2\n## Shell String (1)\n\
    The string is enclosed in single quotes.\n\n| `str='This is a string'` |\n\n*\
    \   Any characters in the single quotes will be printed in its original format.\n\
    *   The string variables in the single quotes are invalid.\n\n# Example 2.1\n\
    ```bash\n#! /bin/sh\nvar=Andy\nstr='Hello, $var'         # single-quote string\n\
    echo $str\n```\nOutput:\nHello, $var\nExplanation:\n'Hello, $var' is a single-quote\
    \ string. Any character in the single quotes will be printed in its original format.\n\
    \n## Shell String (2)\nThe string is enclosed in double quotes.\n\n| `str=\"This\
    \ is a string\"` |\n\n*   Any characters in the double quotes will be printed\
    \ by its returned value. \n*   The string variables in the double quotes are valid.\n\
    \n# Example 2.2\n```bash\n#! /bin/sh\nvar=Andy\nstr=\"Hello, $var\"          #\
    \ double-quote string\necho $str\n```\nOutput:\nHello, Andy\nExplanation:\n'Hello,\
    \ $var' is a double-quote string. Any character in the double quotes will be printed\
    \ by its returned value.\n\n## Connect Strings\nWe can use double quotes to connect\
    \ two strings.\n\n# Example 2.3\n```bash\n#! /bin/sh\nstr1=\"Kotlin\"\nstr2=\"\
    in 8 Hours\"\nmyString=\"$str1 $str2\"      # connect two strings\necho $myString\n\
    ```\nOutput:\nKotlin in 8 Hours\nExplanation:\n\"$str1 $str2\" connects two strings\
    \ into one string by using double quotes.\n\n## String Length\nWe can get the\
    \ length of the string by using `#` symbol.\n\n| `#string` |\n\n# Example 2.4\n\
    ```bash\n#! /bin/sh\nstr=\"jQuery in 8 Hours\"\necho ${#str }       # get the\
    \ length of the string\n```\nOutput:\n17\nExplanation:\n`#str` can get the length\
    \ of the string. The string length is 17 characters and spaces. \n\n## Extract\
    \ Substring\nWe can extract a substring from a string.\n\n| `string : start :\
    \ length` |\n\n*   `start`: the extraction starts at this index.\n*   `length`:\
    \ the extraction size\n\n# Example 2.5\n```bash\n#! /bin/sh\nstr=\"DjanGo in 8\
    \ Hours\"\necho ${str:4:16 }      # extract the substring\n```\nOutput:\nGo in\
    \ 8 Hours\nExplanation:\n`str: 4: 16` extracts a substring starting at the index\
    \ 4, the extracting length is 16.\n\n## About `expr…`\n`` expr…` `` is an expression,\
    \ which is used for calculation.\n\n| `` ` expr…` `` |\n\nNote: ` ` is a back\
    \ quote, rather than a single quote. The ` ` key is on the most left side of the\
    \ keyboard.\n\n# Example 2.6\n```bash\n#! /bin/sh\nx=100\ny=200\nz=`expr $x +\
    \ $y`       # an expression\necho \"The sum is $z\"\n```\nOutput:\nThe sum is\
    \ 300\nExplanation:\n`expr $x + $y` is an expression, the calculated result will\
    \ be assigned to the `z`. Note: ` ` is a back quote, rather than a single quote.\
    \ The ` ` key is on the most left side of the keyboard.\n\n## Search Index\nWe\
    \ can find the index of the first occurrence of a character in a string.\n\n|\
    \ `` ` expr index \"string\" character` `` |\n\nNote: ` ` is a back quote, rather\
    \ than a single quote. `\"index\"` is a parameter, for searching the index of\
    \ a character. `\"character\"` is a parameter, indicating the character you specify.\n\
    \n# Example 2.7\n```bash\nstr=\"Kotlin in 8 Hours\"\necho `expr index \"$str\"\
    \ n`\n```\nOutput:\n6\nExplanation:\n`expr index \"$str\" n` finds the index of\
    \ the character \"n\" in the string. Note: ` ` is a back quote, rather than a\
    \ single quote.\n\n## Shell Parameters\nWe can pass parameters to a script. The\
    \ syntax is as follows:\n\n| `$n` |\n\n*   `$0` represents the filename.\n*  \
    \ `$1` represents the first parameter.\n*   `$2` represents the second parameter.\n\
    \n# Example 2.8\n```bash\n#! /bin/sh\necho \"My name is: $0\"\necho \"$1\"\necho\
    \ \"$2\"\necho \"$3\"\n```\nOutput:\n(depends on input arguments)\nExplanation:\n\
    `$0` represents the filename. `$1` represents the first parameter. `$2` represents\
    \ the second parameter. `$3` represents the third parameter.\n\n## Built-in Parameters\n\
    There are built-in parameters in Shell as follows:\n\n| Parameter | Description\
    \ |\n| :--- | :--- |\n| `$0` | Return the filename |\n| `$1` | Return the first\
    \ parameter |\n| `$2` | Return the second parameter |\n| `$3` | Return the third\
    \ parameter |\n| `$#` | Return the number of parameters |\n| `$*` | Return all\
    \ parameters as one string |\n| `$@` | Return all parameters as separate words\
    \ |\n| `$$` | Return the process ID of the shell |\n| `$?` | Return the exit status\
    \ of the last command |\n| `$!` | Return the PID of the last background job |\n\
    | `$LIN` | Return the line number |\n| `|` | Return the last pipe in the pipeline\
    \ |\n| `!` | Return the length of the last command's arguments |\n\n# Example\
    \ 2.9\n```bash\n#! /bin/sh\necho \"My name is: $0\"\necho \"$1\"\necho \"$2\"\n\
    echo \"$3\"\n```\nOutput:\n(depends on input arguments)\nExplanation:\n`$0` represents\
    \ the filename. `$1` represents the first parameter. `$2` represents the second\
    \ parameter. `$3` represents the third parameter.\n\n# Hour 3\n## Shell Array\n\
    An array is a particular variable, which can contain one or more values at a time.\
    \ Bash supports one-dimensional arrays, does not support multidimensional arrays,\
    \ and does not limit the size of arrays.\n\n1. The syntax to create an array:\n\
    \n| `array_name = (value0 value1 value2...)` |\n\n# Example\n```bash\nmyArray=(100\
    \ 101 102 103)\n```\nExplanation:\nThe above code creates an array, the array\
    \ name is `myArray`, it has four elements, its index is 0, 1, 2, 3, its value\
    \ is 100, 101, 102, 103. Note that index begins with zero.\n\n2. Another syntax\
    \ to create an array:\n\n| `array_name[0]=value0 array_name[1]=value1 array_name[2]=value2`\
    \ |\n\n# Example\n```bash\ncolor[0] = \"red\"\ncolor[1] = \"blue\"\ncolor[2] =\
    \ \"green\"\n```\nExplanation:\nAbove code creates an array, the array name is\
    \ `color`, and it has three elements: color [0], color [1], color [2]. Its indexes\
    \ are 0, 1, 2. Its values are red, blue, and green. Note that index begins with\
    \ zero.\n\n## Accessing the Elements\nThe syntax to access the elements of an\
    \ array is as follows:\n\n| `${array_name[index]}` |\n\n# Example 3.1\n```bash\n\
    #!/bin/bash\nmy_array=(Rust in 8 Hours)\necho \"The first element is: ${my_array[0]}\"\
    \necho \"The second element is: ${my_array[1]}\"\necho \"The third element is:\
    \ ${my_array[2]}\"\necho \"The fourth element is: ${my_array[3]}\"\n```\nOutput:\n\
    The first element is: Rust\nThe second element is: in\nThe third element is: 8\n\
    The fourth element is: Hours\nExplanation:\n`my_array=(Rust in 8 Hours)` creates\
    \ an array. `${my_array[0]}` accesses the element at index 0. `${my_array[1]}`\
    \ accesses the element at index 1. `${my_array[2]}` accesses the element at index\
    \ 2. `${my_array[3]}` accesses the element at index 3.\n\n## Get All Elements\n\
    `array_name[@]` or `array_name[*]` can get all elements of an array.\n"
