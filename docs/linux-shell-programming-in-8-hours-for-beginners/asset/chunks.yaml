  trans: "\n\n“File n”，“File m” 意味着文件描述符为 `0`、`1` 或 `2` 的文件。`0` 代表标准输入 (STDIN)，`1`\
    \ 代表标准输出 (STDOUT)，`2` 代表标准错误 (STDERR)。\n\n## 输出重定向\n输出重定向：使用 `>` 执行命令并将输出存储到文件中。\n\
    \n| `command > file` |\n\n**示例 8.2**\n```bash\necho \"R in 8 Hours\" > myFile\n\
    cat myFile # \"cat\" 查看 myfile 的内容\n```\n**输出：**\n`R in 8 Hours`\n**解释：** `echo\
    \ \"R in 8 Hours\" > myFile` 将输出重定向到 `myFile`。你需要使用 `cat` 命令来查看 `myFile` 的内容。\n\
    ![](img/rsrc3M2.jpg)\n\n## 追加重定向\n如果你不想让文件内容被重写，请使用 `>>` 将内容追加到文件末尾。\n\n| `command\
    \ >> file` |\n\n**示例 8.3**\n```bash\necho \"R in 8 Hours\" > myFile\necho \"It\
    \ is good! \" >> myFile\ncat myFile # \"cat\" 查看 myfile 的内容\n```\n**输出：**\n`R\
    \ in 8 Hours`\n`It is good!`\n**解释：** `echo \"It is good! \" >> myFile` 将内容追加到\
    \ `myFile`。\n![](img/rsrc3M3.jpg)\n\n## 输入重定向\n输入重定向：使用 `<` 从文件获取输入。\n\n| `command\
    \ < file` |\n\n**示例 8.4**\n```bash\nwc < myFile # myFile 在上一页创建。\n```\n**输出：**\n\
    `2 7 25`\n**解释：** `wc < myFile` 从 `myFile` 获取输入。`wc` 统计文件的行数、单词数字符数。\n- `2`:两行。\n\
    - `7`:七个单词。\n- `25`:字符（包括空格）。\n`myFile` 是上一页创建的文件。\n\n## 文件描述符\n当每个 Linux 命令执行时，它们会打开三个文件：\n\
    \n1. **标准输入文件 (stdin)：** `stdin` 的文件描述符为 `0`，Shell 程序默认从 `stdin` 读取数据。\n2. **标准输出文件\
    \ (stdout)：** `stdout` 的文件描述符为 `1`，Shell 程序默认向 `stdout` 写入数据。\n3. **标准错误文件 (stderr)：**\
    \ `stderr` 的文件描述符为 `2`，Shell 程序将错误信息写入 `stderr` 流。\n\n**示例：**\n- `command < file`\
    \ 将 stdin 重定向到文件：\n  | `$ command < file` |\n- `command > file` 将 stdout 重定向到文件：\n\
    \  | `$ command > file` |\n- 从 infile 文件读取输入，将输出写入 outfile：\n  | `$ command <\
    \ infile > outfile` |\n\n## Here Document（在此文档/在此）\nHere Document 用于将文件内容重定向到命令。\n\
    \n| `command << delimiter delimiter` |\n\n第二个定界符必须位于最左侧，前面没有字符，后面也没有字符。\n\n**示例\
    \ 8.5**\n```bash\n#! /bin/bash\ncat << DOC # DOC 定义了一个 Here Document\nAngularJS\
    \ in 8 Hours\nJavaScript in 8 Hours\nVisual Basics in 8 Hours\nDOC\n```\n**输出：**\n\
    `AngularJS in 8 Hours`\n`JavaScript in 8 Hours`\n`Visual Basics in 8 Hours`\n\
    **解释：** `cat << DOC……DOC` 是一种特殊的重定向模式，将文件内容重定向到命令。`cat` 显示文件内容。`DOC` 是定界符。你可以指定其他字符作为定界符。`DOC……DOC`\
    \ 定义了一个 Here Document。\n\n**示例 8.6**\n```bash\n#! /bin/bash\nwc << EOF # wc 统计行、单词、字符数\n\
    AngularJS in 8 Hours\nJavaScript in 8 Hours\nVisual Basics in 8 Hours\nEOF\n```\n\
    **输出：**\n`3 13 68`\n**解释：** `wc << EOF……EOF` 将文档内容重定向到 `wc`。`wc` 用于统计行、单词和字符数。`EOF`\
    \ 是定界符，定义了一个 Here Document。\n- `3`: 表示 3 行。\n- `13`: 表示 13 个单词。\n- `68`: 表示 68\
    \ 个字符（包括空格）。\n\n## 包含文件\nShell 可以将外部脚本文件包含到当前文件中。\n\n| `source ./ external_file`\
    \ |\n\n`./` 定位外部文件。我们将创建两个文件作为示例。\n\n**(1) 文件 `file1.sh` 如下：**\n**示例 8.7**\n```bash\n\
    #! /bin/bash\nurl =\"http://www.lulu.com/spotlight/Ray_Yao\"\n```\n**(2) 文件 `file2.sh`\
    \ 如下：**\n**示例 8.8**\n```bash\n#! /bin/bash\nsource ./file1.sh # 包含外部文件\necho \"\
    The website of Ray Yao is： $url \"\n```\n**输出：**\n`The website of Ray Yao is ：http://www.lulu.com/spotlight/Ray_Yao`\n\
    **解释：** `source ./file1.sh` 包含了一个外部文件。\n\n## Printf 命令\n`printf` 用于格式化输出。\n\n\
    | 格式 | 描述 |\n| :--- | :--- |\n| `%b` | 以二进制形式打印 |\n| `%d` | 以数字打印 |\n| `%f` |\
    \ 以浮点数打印 |\n| `%o` | 以八进制打印 |\n| `%s` | 以字符串打印 |\n| `%x` | 以十六进制打印 |\n\n## 转义序列\n\
    - `\\a`: 输出警报\n- `\\n`: 输出换行\n- `\\r`: 输出回车\n- `\\t`: 输出制表符\n- `\\f`: 输出分页\n-\
    \ `\\\"`: 输出双引号\n\n## 比较运算符\nLinux Shell 有比较运算符：\n\n| 运算符 | 检查 |\n| :--- | :---\
    \ |\n| `-eq` 等于 |\n| `-ne` 不等于 |\n| `-gt` 大于 |\n| `-ge` 大于 |\n| `-lt` 小于 |\n|\
    \ `-le` 小于 |\n比较表达式返回真或假。\n\n## 逻辑运算符\n| 运算符 | |\n| :--- | :--- |\n| `-a` | 与\
    \ (AND) |\n| `-o` | 或 (OR) |\n| `!` | 使用逻辑运算符后，结果为真或假。\n\n## 字符串运算符\n| 运算符 | 检查\
    \ |\n| :--- | :--- |\n| `=` | 如果两个字符串相等 |\n| `!=` | 如果两个字符串不相等 |\n| `-z` | 如果字符串长度为零\
    \ |\n| `-n` | 如果字符串长度不为零 |\n| `$` | 如果字符串为空\n\n## 文件运算符\n文件运算符用于检测 Linux 文件的各种属性。\n\
    \n| 运算符 | 检查 |\n| :--- | :--- |\n| `-d` | 如果目录，返回真 |\n| `-f` | 如果文件，返回真 |\n| `-p`\
    \ | 如果管道，返回真 |\n| `-r` | 如果可读文件，返回真 |\n| `-w` | 如果可写文件，返回真 |\n| `-x` | 如果可执行文件，返回真\
    \ |\n| `-e` | 如果存在存在，返回真 |\n| `-s` | 如果不是空文件，返回真 |\n| `-b` | 如果块设备文件，返回真 |\n|\
    \ `-c` | 如果字符设备文件，返回真 |\n\n## I/O 重定向图\nLinux Shell 系统命令从终端接收输入并将生成的输出传回终端。命令通常从标准输入读取数据，并向标准输出写入数据。重定向命令如下：\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| `command > file` | 将输出重定向到文件。 |\n| `command\
    \ < file` | 将输入重定向到文件。 |\n| `command >> file` | 将输出追加到文件。 |\n| `n > file` | 将文件\
    \ `n` 重定向到文件 |\n| `n >> file` | 将文件 `n` 追加到文件 |\n| `n >& m` | 合并输出文件 `m` 和文件 `n`\
    \ |\n| `n <& m` | 合并输入文件 `m` 和文件 `n` |\n| `<< tag` | 将标签之间的内容作为输入。 |\n\n"
