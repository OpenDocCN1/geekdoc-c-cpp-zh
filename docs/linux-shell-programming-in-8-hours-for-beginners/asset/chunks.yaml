    After using logical operators, the result will be true or false.


    | true -a true;returns true; | true -a false;returns false; | false -a false;returns
    false; |


    | true -o true;returns true; | true -o false;returns true; | false -o false;return
    false; |


    | ! false;returns true; | ! true;returns false; |  |'
