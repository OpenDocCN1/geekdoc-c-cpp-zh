    Books](#part0082.xhtml)Hour 1What is Linux Shell?The shell is the interface between
    the user and Linux; every command you type at the prompt is interpreted by the
    shell and passed to the Linux kernel.The shell is a command-language interpreter
    with its own built-in shell command collection. In addition, the shell can be
    called by any other valid Linux utilities and application programs in the system.Whenever
    you type a command, it is interpreted by the Linux shell.For example:The command
    of printing current working directory (PWD) is contained within Linux bash.The
    copy commands (cp) and the move commands (rm) are two single programs that exist
    in a directory on the file system.The shell first checks to see if the command
    is an internal command, and then checks to see if it is an application, either
    of Linux''s own utilities, such as ls and rm, or of a purchased commercial program,
    such as xv and ghostview.Another important feature of the shell is that it is
    an interpreted programming language that supports most data structures, such as
    loops, functions, variables, and arrays.Shell ScriptingA Shell script is a scripting
    program written for the Shell.Shell Working EnvironmentShell scripting, like Java,
    C++ programming, requires only a text editor to write code and a script interpreter
    to interpret executionVarious Linux ShellLinux has different types of shells,
    such as:


    *   Bourne Shell（ /bin/sh ）


    *   Bourne Again Shell（ /bin/bash ）


    *   C Shell（ /usr/bin/csh ）


    *   K Shell（ /usr/bin/ksh ）


    *   Shell for Root（ /sbin/sh ）


    This book talks about Bash (Bourne Again Sell). Bash is the default Shell on most
    Linux systems.The First Shell ScriptingExample 1.1


    1.  Open the Vi text editor with a “vi ” command.


    ![](rsrc3KX.jpg)


    2.  Press “i ” key, enter the Insert Mode.


    3.  Type the following code in the Vi editor:


    | #! /bin/bashecho "Hello World ! " |


    ![](rsrc3KY.jpg)


    4.  Press the “Esc ” key to quit the Insert Mode.


    5.  Type “:wq study.sh ” to save the file. The file name is “study. sh”, the extension
    name is “. sh”.


    6.  Run this Shell program with the following commands:


    bash  study.shOutput:Hello World !![](rsrc3KZ.jpg)Explanation:“vi” is a command
    to open the Vi editor.“i” key is used to enter the Insert Mode in Vi editor.Insert
    Mode can be used for writing and editing Shell Scripts.“#! /bin/bash” let Shell
    system know that using Bash to interpret the scripting.“echo "Hello World ! "”
    shows the content “Hello World! ”“Esc” key is used to quit the Insert Mode in
    Vi editor.“: wq  file_name” saves the Shell file, and quit from Vi.“bash  study.
    sh” executes the Shell file “study. sh”.“bash  myFile.sh” executes the Shell file
    “myFile.sh”.Shell Comment


    | # |


    “#” symbol is used for the Shell comments.Shell interpreter always ignores the
    Shell commentsExample 1.2#! /bin/bashecho "Hello World! "     # output Hello World!echo
    "Hi, Friends! "      # output Hi, Friends!Output:Hello World!Hi, Friends!Explanation:“#
    output Hello World ! ” is a comment of Shell scripting.“# output Hi, Friends !
    ” is a comment of Shell scripting.Multi-Line Comments


    | : <<EOFcomment 1comment 2comment 3...EOF |


    “: <<EOF……EOF” is used for multi-line comments.Example 1.3#! /bin/bashecho "Hello
    World! "    :<<EOFThis is a "Hello World" program.This is a Shell scripting.This
    is a sample of multi-line comment.......EOFecho "This is a sample of multi-line
    comment. "Output:Hello World!This is a sample of multi-line comment.Explanation:“:<<EOF……EOF
    ” is used for multi-line comments.Shell Variables


    1.  The syntax to define a variable is as follows:


    | var=“value” |


    Note: There must be no Spaces before and after the equal sign!


    2.  To use a variable, you need to use “$” before a variable.


    | $var |


    Example 1.4#! /bin/bashbook ="Scala in 8 Hours"     #  define a variableecho  $book
               # use the variableOutput:Scala in 8 HoursExplanation:When defining
    a variable, make sure that no spaces before or after the equal sign.Variable NameThe
    rule of the variable name is as follows:


    *   Only English letters, numbers, and underscores can be used for variable naming.


    *   The first character of the variable name cannot begin with a number.


    *   There can be no spaces in the middle of a variable name.


    *   Variable names cannot be punctuated.


    *   Bash keywords cannot be used for variable names.


    The Valid Variable Name:_myVariablemyVariable001my_VarialbeThe Invalid Variable
    Name:001Variableechomy*VarialbeRead-Only VariableThe “readonly” command can define
    a variable as a read-only variable, whose value cannot be changed.


    | readonly  variable |'
