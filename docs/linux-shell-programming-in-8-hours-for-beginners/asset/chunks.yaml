    [ $a -eq $b ]         # check if a is equal to bthenecho "$a -eq $b ?   a is equal
    to b"elseecho "$a -eq $b ?   a is not equal to b"fiif [ $a -ne $b ]         #
    check if a is not equal to bthenecho "$a -ne $b ?   a is not equal to b"elseecho
    "$a -ne $b ?   a is equal to b"fiif [ $a -gt $b ]      # check if a is greater
    than bthenecho "$a -gt $b ?   a is greater than b"elseecho "$a -gt $b ?   a is
    not greater than"fiif [ $a -lt $b ]      # check if a is less to bthenecho "$a
    -lt $b ?   a is less than b"elseecho "$a -lt $b ?   a is not less than b"fiif
    [ $a -ge $b ]    # check if a is greater than or equal to bthenecho "$a -ge $b
    ?   a is greater than or equal to b"elseecho "$a -ge $b ?   a is less than b"fiif
    [ $a -le $b ]      # check if a is less than or equal to bthenecho "$a -le $b
    ?   a is less than or equal to b"elseecho "$a -le $b ?   a is greater than b"fiOutput:100
    -eq 200 ?    a is not equal to b100 -ne 200 ?    a is not equal to b100 -gt 200
    ?    a is not greater than100 -lt 200 ?    a is less than b100 -ge 200 ?    a
    is less than b100 -le 200 ?    a is less than or equal to bExplanation:


    | Operators | Checks |


    | -eq | equal |


    | -ne | not equal |


    | -gt | greater than |


    | -ge | greater or equal |


    | -lt | less than |


    | -le | less or equal |


    Boolean Operators


    | Operators |


