  trans: "\n\n# 示例 4.6\n\n```bash\n#!/bin/bash\nx=true\ny=false\nif [ $x -a $y ] \
    \     # -a 表示“与”\nthen\n    echo flase\nfi\nif [ $x -o $y ]      # -o 表示“或”\n\
    then\n    echo true\nfi\nif [ !$x ]         # ! 表示“非”\nthen\n    echo flase\n\
    fi\n```\n\n输出：\n```\nflase\ntrue\nflase\n```\n\n解释：\n\n| true -a true;返回 true;\
    \ | true -a false;返回 false; | false -a false;返回 false; |\n| true -o true;返回 true;\
    \ | true -o false;返回 true; | false -o false;return false; |\n| ! false;返回 true;\
    \ | ! true;返回 false; |  |\n\n# 第 5 小时：字符串运算符\n\n| 运算符 | 检查 |\n| :--- | :--- |\n\
    | `=` | 如果两个字符串相等，则返回 true . |\n| `!=` | 如果两个字符串不相等，则返回 true . |\n| `-z` | 如果字符串的长度为零，则返回\
    \ true . |\n| `-n` | 如果字符串的长度不为零，则返回 true |\n| `$` | 如果字符串为空，则返回 true . |\n\n\
    # 示例 5.1\n\n```bash\n#!/bin/bash\na=\"Java\"\nb=\"Ruby\"\nif [ $a = $b ]     \
    \ # 检查 a 是否等于 b\nthen\n    echo \"$a = $b ?  a 等于 b\"\nelse\n    echo \"$a = $b\
    \ ?  a 不等于 b\"\nfi\nif [ $a != $b ]      # 检查 a 是否等于 b\nthen\n    echo \"$a !\
    \ = $b ?  a 不等于 b\"\nelse\n    echo \"$a ! = $b ?  a 等于 b\"\nfi\nif [ -z $a ]\
    \      # 检查字符串长度是否为 0\nthen\n    echo \"-z $a ?  字符串长度为 0\"\nelse\n    echo \"\
    -z $a ?  字符串长度不为 0\"\nfi\nif [ -n \"$a\" ]        # 检查字符串长度是否不为 0\nthen\n    echo\
    \ \"-n $a ?  字符串长度不为 0\"\nelse\n    echo \"-n $a ?  字符串长度为 0\"\nfi\nif [ $a ]\
    \        # 检查字符串是否为空\nthen\n    echo \"$a ?  字符串不为空\"\nelse\n    echo \"$a ? \
    \ 字符串为空\"\nfi\n```\n\n输出：\n```\nJava = Ruby ?  a 不等于 b\nJava ! = Ruby ?  a 不等于\
    \ b\n-z Java ?  字符串长度不为 0\n-n Java ?  字符串长度不为 0\nJava ?  字符串不为空。\n```\n\n解释：\n\
    \n| `=` | 如果两个字符串相等，则返回 true . |\n| `!=` | 如果两个字符串不相等，则返回 true . |\n| `-z` | 如果字符串的长度为零，则返回\
    \ true . |\n| `-n` | 如果字符串的长度不为零，则返回 true |\n| `$` | 如果字符串为空，则返回 true . |\n\n\
    # 文件运算符\n\n文件运算符用于检测 Linux 文件的各种属性。\n\n| 运算符 | 检查 |\n| :--- | :--- |\n| `-d file`\
    \ | 如果对象是目录，则返回 true . |\n| `-f file` | 如果对象是文件，则返回 true . |\n| `-p file` | 如果对象是管道，则返回\
    \ true . |\n| `-r file` | 如果对象是可读文件，则返回 true . |\n| `-w file` | 如果对象是可写文件，则返回\
    \ true . |\n| `-x file` | 如果对象是可执行文件，则返回 true . |\n| `-e file` | 如果对象是空文件，则返回\
    \ true . |\n| `-s file` | 如果对象不是空文件，则返回 true . |\n| `-b file` | 如果对象是块设备文件，则返回\
    \ true . |\n| `-c file` | 如果对象是字符设备文件，则返回 true . |\n\n# 示例 5.2\n\n假设文件“myFile.sh”不存在，但我们仍然检查该文件的属性。\n\
    \n```bash\n#!/bin/bash\nfile=\"/root/myFile.sh\"\nif [ -r $file ]      # 检查对象是否可读\n\
    then\n    echo \"对象是可读的\"\nelse\n    echo \"对象是不可读的\"\nfi\nif [ -w $file ]   \
    \   # 检查对象是否可写\nthen\n    echo \"对象是可写的\"\nelse\n    echo \"对象是不可写的\"\nfi\nif\
    \ [ -x $file ]      # 检查对象是否可执行\nthen\n    echo \"对象是可执行的\"\nelse\n    echo \"\
    对象是不可执行的\"\nfi\nif [ -f $file ]      # 检查对象是否是文件\nthen\n    echo \"对象是文件\"\nelse\n\
    \    echo \"对象不是文件\"\nfi\nif [ -d $file ]      # 检查对象是否是目录\nthen\n    echo \"\
    对象是目录\"\nelse\n    echo \"对象不是目录\"\nfi\nif [ -s $file ]      # 检查对象是否非空\nthen\n\
    \    echo \"对象不是空的\"\nelse\n    echo \"对象是空的\"\nfi\nif [ -e $file ]      # 检查文件是否存在\n\
    then\n    echo \"文件存在\"\nelse\n    echo \"文件不存在\"\nfi\n```\n\n输出：\n```\n对象是不可读的\n\
    对象是不可写的\n对象是不可执行的\n对象不是文件\n对象不是目录\n对象是空的\n文件不存在\n```\n\n解释：假设目录“root”中没有文件“myFile.sh”，但我们仍然检查该文件的属性。让我们复习以下文件运算符：\n\
    \n| `-d file` | 如果对象是目录，则返回 true |\n| `-f file` | 如果对象是文件，则返回 true |\n| `-r file`\
    \ | 如果对象是可读文件，则返回 true . |\n| `-w file` | 如果对象是可写文件，则返回 true . |\n| `-x file`\
    \ | 如果对象是可执行文件，则返回 true . |\n| `-e file` | 如果对象是空文件，则返回 true . |\n| `-s file`\
    \ | 如果对象不是空文件，则返回 true . |\n\n# `echo` 命令\n\n`echo` 命令用于输出内容。在这里，我们来聊聊它的特殊用法。\n\
    \n### 转义字符\n```bash\n#!/bin/bash\necho \"\\\"C in 8 Hours\\\"\n```\n输出：\n```\n\
    C in 8 Hours\n```\n\n### 变量值\n```bash\n#!/bin/bash\nbook=\"C in 8 Hours\"\necho\
    \ \"$book is a great book\"\n```\n输出：\n```\nC in 8 Hours is a great book\n```\n\
    \n### 同一行的内容\n```bash\n#!/bin/bash\necho -e \"Go\\n\" # 开启转义开关\necho \"in 8 Hours\"\
    \ # 在同一行输出\n```\n输出：\n```\nGo\nin 8 Hours\n```\n\n### 输出到文件\n```bash\n#!/bin/bash\n\
    echo \"PHP in 8 Hours\" # 重定向到\n\n### 格式\n```bash\n#!/bin/bash\necho 'OK' # 使用单引号\n\
    ```\n输出：\n```\nOK\n```\n\n### 执行结果\n```bash\n#!/bin/bash\necho `date` # 使用反引号\n\
    ```\n输出：\n```\n当前日期\n```\n\n### 用户输入\n```bash\n#!/bin/bash\nread name\necho \"\
    Hello $name\"\n```\n输出：\n```\nHello [输入的名字]\n```\n\n# test 命令\n\n`test` 命令用于检查条件是否为真。它可以测试三个方面：数字、字符和文件。\n\
    \n## 数字比较\n\n`test` 命令可以使用以下运算符对数字进行比较：\n\n```bash\n#!/bin/bash\nnum1=10\nnum2=20\n\
    if [ $num1 -eq $num2 ];      # -eq 表示等于\nthen\n    echo \"Equal\"\nfi\nif [ $num1\
    \ -ne $num2 ];      # -ne 表示不相等\nthen\n    echo \"Not Equal\"\nfi\nif [ $num1\
    \ -gt $num2 ];      # -gt 表示大于\nthen\n    echo \"Greater\"\nfi\nif [ $num1 -lt\
    \ $num2 ];      # -lt 表示小于\nthen\n    echo \"Less\"\nfi\nif [ $num1 -ge $num2\
    \ ];      # -ge 表示大于或等于\nthen\n    echo \"Greater or equal\"\nfi\nif [ $num1 -le\
    \ $num2 ];      # -le 表示小于或等于\nthen\n    echo \"Less or equal\"\nfi\n```\n\n##\
    \ 字符串比较\n\n`test` 命令可以使用以下运算符对字符串进行比较：\n\n```bash\n#!/bin/bash\nstr1=\"apple\"\
    \nstr2=\"orange\"\nif [ $str1 = $str2 ];      # = 表示相等\nthen\n    echo \"Equal\"\
    \nfi\nif [ $str1 != $str2 ];      # != 表示不相等\nthen\n    echo \"Not Equal\"\nfi\n\
    if [ \"$str1\" > \"$str2\" ];    # > 表示字典序大于\nthen\n    echo \"Greater in order\"\
    \nfi\nif [ \"$str1\" < \"$str2\" ];    # < 表示字典序小于\nthen\n    echo \"Less in order\"\
    \nfi\n```\n\n## 文件比较\n\n`test` 命令可以使用以下运算符来检查文件的属性：\n\n```bash\n#!/bin/bash\n\
    file=\"test.txt\"\nif [ -f $file ];      # 检查是否为普通文件\nthen\n    echo \"Is a file\"\
    \nfi\nif [ -d $file ];      # 检查是否为目录\nthen\n    echo \"Is a directory\"\nfi\n\
    if [ -r $file ];      # 检查文件是否可读\nthen\n    echo \"Is readable\"\nfi\nif [ -w\
    \ $file ];      # 检查文件是否可写\nthen\n    echo \"Is writable\"\nfi\nif [ -x $file\
    \ ];      # 检查文件是否可执行\nthen\n    echo \"Is executable\"\nfi\nif [ -s $file ];\
    \      # 检查文件是否非空\nthen\n    echo \"Is not empty\"\nfi\n```\n\n"
- fmt: "\n# Example 6.6\n```bash\n#! /bin/bash\nmyFunction() {\n    # define a function\n\
    \    echo \"jQuery in 8 Hours\"\n}\necho \"Before calling the function. \"\nmyFunction\
    \     # call the function\necho \"After calling the function. \"\n```\n**Output:**\n\
    ```\nBefore calling the function.\njQuery in 8 Hours\nAfter calling the function.\n\
    ```\n**Explanation:** `myFunction(){ }` defines a function; `myFunction` calls\
    \ the function.\n\n## Function with Arguments\nWhen calling a function, you can\
    \ pass parameters to the function body. For example, pass the first parameter\
    \ to `${1}`, pass the second parameter to `${2}` ...\n\n### Example 6.7\n```bash\n\
    #! /bin/bash\nmyFunction(){\n    echo \"The first parameter is: ${1} ! \"\n  \
    \  echo \"The second parameter is: ${2} ! \"\n    echo \"The third parameter is:\
    \ ${3} ! \"\n    echo \"The fourth parameter is: ${4} ! \"\n    echo \"All parameters\
    \ are: $* ! \"\n}\nmyFunction Kotlin in 8 Hour     # pass four parameters\n```\n\
    **Output:**\n```\nThe first parameter is: Kotlin !\nThe second parameter is: in\
    \ !\nThe third parameter is: 8 !\nThe fourth parameter is: Hours !\nAll parameters\
    \ are: Kotlin in 8 Hours !\n```\n**Explanation:** `${1}` accepts the first parameter;\
    \ `${2}` accepts the second parameter; `$*` shows all parameters; `myFunction\
    \ Kotlin in 8 Hour ` calls the function and pass four parameters.\n\n## Return\
    \ Values\n`return` can return a value to the `$?` . `$?` shows the return value.\
    \ (In some machine, `$?` only shows the value from 0 to 255.)\n\n| function_name\
    \ { return value } |\n| `$?` # shows the return value |\n\n### Example 6.8\n```bash\n\
    #! /bin/bash\nadd(){\n    # define a function\n    x=100\n    y=155\n    z=`expr\
    \ $x + $y`\n    return $z    # returns the value to $ ?\n}\nadd      # call the\
    \ function\necho \"The sum of two numbers is $? \"\n```\n**Output:**\n```\nThe\
    \ sum of two numbers is 255\n```\n**Explanation:** `return $z` returns the value\
    \ to `$?`. (In some machine, `$?` only shows the value from 0 to 255.)\n\n###\
    \ Example 6.9\n```bash\n#! /bin/bash\nmyFunction(){\n    echo \"Please enter the\
    \ first number:\"\n    read x          # assume entering 80\n    echo \"Please\
    \ enter the second number:\"\n    read y          # assume entering 90\n    z=`expr\
    \ $x + $y`\n    return $z       # returns a value to \"$? ?\"\n}\nmyFunction\n\
    echo \"The return value is $? \"\n```\n**Output:**\n```\nPlease enter the first\
    \ number:80\nPlease enter the second number:90\nThe return value is 170\n```\n\
    **Explanation:** `return $z` returns a value to `$?`; `$?` shows the return value.\n\
    \n# Hour 7\n## `if .. then .. elif .. then .. else`\n`if...then…elif…then…else\
    \ ` runs this code if a condition is true and runs that code if the condition\
    \ is false.\n\n| if condition1 then code1 | elif condition2 then code2 | else\
    \ code3 fi |\n`elif` means `else…if…`\n\n### Example 7.1\n```bash\n#! /bin/bash\n\
    x=100\ny=80\nif [ $x == $y ]\nthen\n    echo \"x is equal to y\"\nelif [ $x -gt\
    \ $y ]      # meet this condition\nthen\n    echo \"x is greater than y\"\nelif\
    \ [ $x -lt $y ]\nthen\n    echo \"x is less than y\"\nelse\n    echo \"n/a\"\n\
    fi\n```\n**Output:**\n```\nx is greater than y\n```\n**Explanation:** `elif` means\
    \ `else…if…`; `elif [ $x -gt $y ]` tests if `$x` is greater than `$y`.\n\n## For\
    \ Loop\n`For loop` runs a block of code repeatedly by the specified items.\n\n\
    | for var in item1 item2 item3… do code1 code2… done |\n\n### Example 7.2\n```bash\n\
    #! /bin/bash\nfo r var in 1 2 3\ndo\n    echo \"The number is: $var\"\ndone\n\
    ```\n**Output:**\n```\nThe number is: 1\nThe number is: 2\nThe number is: 3\n\
    ```\n**Explanation:** `fo r var in 1 2 3` repeatedly run the next code when `var=1`,\
    \ `var= 2`, `var=3`.\n\n### Example 7.3\n```bash\n#! /bin/bash\nfor str in Rust\
    \ in 8 Hours\ndo\n    echo $str\ndone\n```\n**Output:**\n```\nRustin8Hours\n```\n\
    **Explanation:** `for str in Rust in 8 Hours` repeatedly run the next code when\
    \ `str=Rust`, `var=in`, `var=8`, `var=Hours`.\n\n## While Loop\n`while loop` loops\
    \ through a block of code if the specified condition is true.\n\n| while condition\
    \ do code done |\n\n### Example 7.4\n```bash\n#! /bin/bash\ncounter=1\nwhile((\
    \ $counter<=4 ))      # run 4 times\ndo\n    echo $counter\n    counter=`expr\
    \ $counter + 1`\ndone\n```\n**Output:**\n```\n1\n2\n3\n4\n```\n**Explanation:**\
    \ `($counter<=4)` is a test condition, if the condition is true, the code will\
    \ loop at most four times. `While Loop` statement can be used to input data continuously,\
    \ but if you want to finish the input, please press `<ctrl + d>` to quit the program.\n\
    \n### Example 7.5\n```bash\n#! /bin/bash\necho 'Please enter a name: '\nwhile\
    \ read book # accepts the input from user\ndo\n    echo \"OK! $book is a good\
    \ book!\"\n    echo \"If quit, please press <ctrl + d>. \"\ndone\n```\n**Output:**\n\
    ```\nPlease enter a name:PHP in 8 Hours\nOK! PHP in 8 Hours is a good book!\n\
    If quit, please press <ctrl + d>.\n```\n**Explanation:** `while read book` accepts\
    \ the continuous input from the user. You can input data more than one time you\
    \ want.\n\n## Until Loop\n`until loop` loops through a block of code if the specified\
    \ condition is false, will quit the loop if the condition is true.\n\n| until\
    \ condition do code done |\n\n### Example 7.6\n```bash\n#! /bin/bash\nn=0\nuntil\
    \ [ $n -ge 4 ] # will quit the loop if true\ndo\n    echo $n\n    n=`expr $n +\
    \ 1`\ndone\n```\n**Output:**\n```\n0\n1\n2\n3\n```\n**Explanation:** `until [\
    \ $n -ge 4 ]` will quit the loop if `$n` is equal to 4.\n\n## Case Statement\n\
    `case statement` is a multi-select. The `case` statement matches a value to a\
    \ pattern. If the match succeeds, executes the matching command.\n\n| case value\
    \ in pattern1) code1;; pattern2) code2;; pattern3) code3;; pattern4) code4;; pattern*)\
    \ # match nothing, run this .ac |\n\n### Example 7.7\n```bash\n#! /bin/bash\n\
    echo 'Please input a number between 1 to 4:'\nread num\ncase $num in\n    1) echo\
    \ 'You have input 1';;\n    2) echo 'You have input 2';;\n    3) echo 'You have\
    \ input 3';;\n    4) echo 'You have input 4';;\n    *) echo 'Your number is not\
    \ between 1 to 4';;\nesac\n```\n**Output:**\n```\nPlease input a number between\
    \ 1 to 4:2\nYou have input 2\n```\n**Explanation:** Assume we input a number 2,\
    \ which matches the second case, therefore the second code is executed.\n\n##\
    \ Break Command\n`break` keyword is used to stop the running of a loop according\
    \ to the condition.\n\n| break |\n\n### Example 7.8\n```bash\n#! /bin/bash\nnum=0\n\
    while(( $num<=8))\ndo\n    if [ $num == 3 ]\n    then\n        break # quit the\
    \ while loop\n    fi\n    num=`expr $num + 1`\ndone\necho $num\n```\n**Output:**\n\
    ```\n1\n2\n3\n```\n**Explanation:** If `$num` is 3, the program will run the `break`\
    \ command, and quit the loop.\n\n## Continue Command\n`continue` command is used\
    \ to stop the current iteration, ignoring the following code, and then continue\
    \ the next loop.\n\n| continue |\n\n### Example 7.9\n```bash\n#! /bin/sh\nnums=\"\
    1 2 3 4 5 \"\nfor n in $nums\ndo\n    if [ $n -eq 3 ]\n    then\n        continue\
    \ # run the next for loop\n    fi\n    echo $n\ndone\n```\n**Output:**\n```\n\
    1\n2\n4\n5\n```\n**Explanation:** Note: The output has no 3 number. If `$n = 3`,\
    \ the program will run `continue` command, ignore the next command `echo $n`,\
    \ and then run the next `for loop`.\n\n# Hour 8\n## Select Statement\n`Select`\
    \ statement allows the user to select one item to meet the condition, and run\
    \ the related code. `Select` statement usually works with `Case` statement.\n\n\
    | select var in item1 item2 item3... case done |\n\n### Example 8.1\n```bash\n\
    #! /bin/bash\necho \"Please input a number between 1 to 4. \"\necho \"If you input\
    \ 4, the program will exit. \"\nselect choice in 1 2 3 4 ; # select one number\n\
    case $choice in\n    1) echo \"You choose 1\";;\n    2) echo \"You choose 2\"\
    ;;\n    3) echo \"You choose 3\";;\n    4) echo \"You choose 4 to exit\"\n   \
    \     break;;\n    *) echo \"Enter error! \"\n        break;;\nesac\ndone\n```\n\
    **Output:**\n```\nPlease input a number between 1 to 4.\nIf you input 4, the program\
    \ will exit.\n1) 1\n2) 2\n3) 3\n4) 4\n? 2\nYou choose 2\n? 4\nYou choose 4 to\
    \ exit\n```\n**Explanation:** Assume that we input 2 at the first time, input\
    \ 4 at the second time. `select choice in 1 2 3 4 ;` choose one of the 4 numbers.\
    \ `Select` statement usually works with `Case` statement. `#` is an input prompt,\
    \ you can input one number.\n\n## I/O Redirection\nLinux Shell system commands\
    \ take input from your terminal and send the resulting output back to your terminal.\
    \ A command usually reads data from standard input, and writes data to standard\
    \ output. The commands of the redirection are as follows:\n\n| Commands | Descriptions\
    \ |\n| command > file | redirect output to the file. |\n| command < file | redirect\
    \ input to the file. |\n| command >> file | append output to the file. |\n| n\
    \ > file | redirect File n to the file |\n| n >> file | append File n to the file\
    \ |\n| n >& m | combine the output file m and File n |\n| n <& m | combine the\
    \ input file m and File n |\n| << tag | take the content between tags as input.\
    \ |\n"
