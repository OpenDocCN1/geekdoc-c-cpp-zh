  \ 3 章：ADT 无序列表\n\n© Repina Valeriya/Shutterstock\n\n在第 2 章中，我们定义了一个抽象数据类型，并展示了所有数据如何从三个视角来看：逻辑视角、实现视角和应用视角。逻辑视角是\
  \ ADT 功能的抽象视图。实现视角提供了逻辑操作如何执行的图景。应用视角展示了为什么 ADT 会有这种行为——即这种行为在现实世界问题中如何有用。\n\n在本章中，我们来看一个我们所有人应该熟悉的\
  \ ADT：列表。我们都直观地知道“列表”是什么；在日常生活中，我们不断使用列表——购物清单、待办事项列表、地址列表、派对宾名单。列表是我们记录下想要记住的事情的地方。\n\
  \n### 3.1 列表\n\n在计算机程序中，列表是非常用的抽象数据类型。它们是称为容器（containers）的通用抽象数据类型类型的成员，其目的是存放其他对象。在某些语言中，列表是内置结构。在\
  \ C++ 中，虽然标准模板库（STL）提供了列表，但构建列表和其他抽象数据类型的技术如此重要，以至于我们将向你展示如何设计和编写自己的列表。\n\n从理论角度来说，列表是元素的同质集合，元素之间存在线性关系。线性意味着在逻辑层面上，列表中除第一个元素之外的每个元素都有一个唯一的前驱，除最后一个元素之外的每个元素都有一个唯一的后继。（在实现层面，元素之间也存在关系，但物理关系可能与逻辑关系不同。）项目的数量。\n\
  \n\n\n\n# 转换器 (Transformers)\n转换器是以某种方式改变结构的操作：它们可能会使结构变空、将一个项放入结构中，或从结构中移除一个特定的项。对于我们的无序列表（Unsorted\
  \ List） ADT，我们将这些转换器称为 `MakeEmpty`、`PutItem` 和 `DeleteItem`。\n\n`MakeEmpty` 只需要列表，不需要其他参数。由于我们将操作实现为成员函数，因此列表是该函数所作用的对象。`PutItem`\
  \ 和 `DeleteItem` 需要一个额外的参数：即要插入或删除的项。对于这个无序列表 ADT，我们假设要插入的项当前不在列表中，而要删除的项在列表中。\n\
  \n接收两个列表并通过将一个列表附加到另一个列表来创建第三个列表的转换器被称为二进制转换器。\n\n### 观察者 (Observers)\n观察者有多种形式。它们对数据类型提问真/假问题（结构是否为空？）、选择或访问特定项（给我一个最后一个项的副本。），或返回结构的某个属性（结构中有多少个项？）。无序列表\
  \ ADT 至少需要两个观察者：`IsFull` 和 `GetLength`。如果列表已满，`IsFull` 返回 true；`GetLength` 告诉我们列表中出现了多少项。另一个实用的观察者搜索列表中具有特定键（key）的项，如果找到则返回关联信息的副本；我们称其为\
  \ `GetItem`。\n\n如果 ADT 对组件类型有限制，我们可以定义其他观察者。例如，如果我们知道 ADT 是一个数值列表，我们可以定义统计类观察者，如\
  \ `Minimum`（最小值）、`Maximum`（最大值）和 `Average`（平均值）。在这里，我们关注的是通用性；我们对列表中项的类型一无所知，因此在\
  \ ADT 中只使用通用观察者。\n\n在目前关于错误检查的讨论中，我们通过使用前提条件（preconditions）在这些错误条件存在时禁止调用操作，从而将检查错误状况的责任交给了用户。然而，在让客户端负责检查错误状况时，我们必须确保\
  \ ADT 为用户提供了检查这些状况的工具。另一种方法是，我们可以在列表中保留一个错误变量，让每个操作记录是否发生了错误，并提供测试该变量的操作。检查是否发生错误的操作就是观察者。但在我们所指定的无序列表\
  \ ADT 中，让我们用户通过遵守 ADT 操作的前提条件来防止错误状况吧。\n\n### 迭代器 (Iterators)\n迭代器与复合类型配合使用，允许用户逐组件地处理整个结构。为了让用户按顺序访问每个项，我们提供了两个操作：一个用于初始化迭代过程（类似于文件的\
  \ `Reset` 或 `Open`），另一个在每次被调用时返回“下一个组件”的副本。用户随后可以设置一个循环来处理每个组件。我们将这些操作称为 `ResetList`\
  \ 和 `GetNextItem`。注意，`ResetList` 本身并不是迭代器，而是一个支持迭代的辅助操作。另一种类型的迭代器接收一个操作并将其应用于列表中的每个元素。\n\
  \n### 泛型数据类型 (Generic Data Types)\n[泛型数据类型]是指操作已定义、但所处理的项的类型未定义的类型。某些编程语言具有定义泛型数据类型的内置机制；而其他语言则缺乏这一功能。虽然\
  \ C++ 确实有这种机制（称为模板），但我们将描述推迟到第 6 章。在这里，我们展示了一种简单、通用的模拟泛型的方法，它适用于任何编程语言。我们让用户在名为\
  \ `ItemType` 的类中定义列表项的类型，并让我们的无序列表 ADT 该类的定义。\n\n两个列表操作（`DeleteItem` 和 `GetItem`）将涉及两个列表组件键的比较（如果列表按键值排序，则\
  \ `PutItem` 也是如此）。我们可以要求用户将键数据成员命名为“key”，并使用 C++ 关系运算符比较键数据成员。然而，这种方法并不是一个非常满意的解决方案，原因有两点：“key”在应用程序程序中并不总是有意义的标识符，而且键将局限于简单类型的值。C++\
  \ 确实有一种改变关系运算符含义的方法（称为重载），但目前我们提供一种通用的解决方案，而不是依赖语言的解决方案。\n\n我们让用户在 `ItemType` 类中定义一个成员函数\
  \ `ComparedTo`。该函数比较两个项，并根据一个项的键是否在另一个项的键之前、第一个键是否在其之后或两个项的键是否相等，分别返回 `LESS`（小于）、`GREATER`（大于）或\
  \ `EQUAL`（相等）。如果键是简单类型（如标识符），`ComparedTo` 将使用关系运算符实现。如果键是字符串，函数 `ComparedTo` 将使用\
  \ `<string>` 提供的字符串比较运算符。如果键是人的姓名，则姓和名都将被比较。因此，我们的规范假设 `ComparedTo` 是 `ItemType`\
  \ 的成员。\n\n我们的 ADT 还需要从客户端获取另一条信息：列表上的最大项数。由于此信息随应用程序而异，让客户端提供它是符合逻辑的。\n\n让我们在两张\
  \ CRC 卡片中总结我们的观察结果：一张用于 `ItemType`，另一张用于 `UnsortedType`。注意 `UnsortedType` 与 `ItemType`\
  \ 协作。\n\n![](img/f0138-01.jpg)\n\n现在我们可以形式化定义无序列表 ADT 的规范了。\n\n由于我们不知道 `ItemType`\
  \ 中键成员的组成，我们必须将整个 `ItemType` 对象作为参数传递给 `GetItem` 和 `DeleteItem`。注意，这两个操作的前提条件都说明参数\
  \ `item` 的键成员已初始化。如果找到了相同键的列表组件，`GetItem` 将填充 `item` 的其余成员，而 `DeleteItem` 将从列表中移除键与\
  \ `item` 匹配的组件。\n\n操作的规范具有某种任意性。例如，我们在 `DeleteItem` 的前提条件中规定了要删除的元素必须在列表中且是唯一的。我们也可以规定一种不要求元素在列表中的操作，如果项不存在，则保持列表不变。这个决策是一个设计选择。如果我们是为特定的应用程序设计规范，那么设计选择将基于问题的需求。在这种情况下，我们做了一个任意的决定。在练习中，你被要求检查不同设计选择的影响。\n\
  \n本规范中定义的操作是创建和维护无序列表的充分集合。注意没有任何操作依赖于结构中项的类型。这种数据独立性使得无序列表 ADT 真正抽象。每个使用无序列表 ADT\
  \ 的程序都在应用程序上下文中定义 `ItemType`，并提供一个在两个 `ItemType` 类型项上的比较成员函数。\n\n#### 应用级 (Application\
  \ Level)\n\n\n\n\n\n无序列表（Unsorted List）ADT 提供的操作 set 可能看起来非常小且且原始。事实上，这组操作为我们创建其他需要了解\
  \ `ItemType` 的特殊用途例程提供了所需的工具。例如，我们没有包含打印操作。为什么？因为要编写打印例程，我们必须知道数据成员的样子。用户（他们确实知道数据成员的样子）可以使用\
  \ `GetLength`、`ResetList` 和 `GetNextItem` 操作来遍历列表，并依次打印每个数据成员。在接下来的代码中，我们假设用户为 `ItemType`\
  \ 定义了一个成员函数，用于打印一个项目的数据成员。我们还假设无序列表 ADT 本身被实现为一个类，并将操作实现为成员函数。\n\n```\nvoid PrintList(std::ofstream&\
  \ dataFile, UnsortedType list)\n\n// Pre:  list 已初始化。\n\n//       dataFile 已打开用于写入。\n\
  \n// Post: list 中的每个组件都已写入 dataFile。\n\n//       dataFile 仍然处于打开状态。\n\n{\n  int\
  \ length;\n  ItemType item;\n  list.ResetList();\n  length = list.GetLength();\n\
  \  for (int counter = 1; counter <= length; counter++)\n  {\n    item = list.GetNextItem();\n\
  \    item.Print(dataFile);\n  }\n}\n```\n\n注意，我们定义了一个局部变量 `length`，将 `list.GetLength()`\
  \ 的结果存储其中，并在循环中使用该局部变量。我们这样做是出于效率考虑：该函数只被调用一次，节省了额外函数调用的开销。\n\n另一个依赖于应用程序的操作是从文件读取（类型为\
  \ `ItemType`）数据，并创建一个包含这些元素的列表。在不知道列表如何实现的情况下，用户可以使用无序列表 ADT 中指定的操作编写一个函数 `CreateListFromFile`。我们假设有一个函数\
  \ `GetData`，它可以从文件中访问单个数据成员并将它们返回到 `item` 中。\n\n```\nvoid CreateListFromFile(std::ifstream&\
  \ dataFile, UnsortedType& list)\n\n// Pre:  dataFile 且已打开。\n\n// Post: list 包含来自\
  \ dataFile 的项目。\n\n//       dataFile 因为文件末尾而处于失败状态。\n\n//       在列表满之后读取的项将被丢弃。\n\
  \n{\n  ItemType item;\n  list.MakeEmpty();\n  GetData(dataFile, item); // 从 dataFile\
  \ 读取一个项目。\n  while (dataFile)\n  {\n    if (!list.IsFull())\n      list.PutItem(item);\n\
  \    GetData(dataFile, item);\n  }\n}\n```\n\n在这两个函数中，我们调用了无序列表 ADT 指定列表操作，在不知道列表如何实现的情况下创建并打印了列表。在应用层，这些任务是对列表执行的逻辑操作。在更低层级，这些操作被实现为\
  \ C++ 函数，用于操纵数组或其他持有列表元素的数据存储介质。实现 ADT 有多种在功能上正确的方法。在用户视角和计算机内存中的最终表示之间，可能存在中间层级的抽象和设计决策。例如，列表元素的逻辑顺序是如何反映在它们的物理顺序中的？当我们现在转向\
  \ ADT 的实现级时，我们来解决这类问题。\n\n## 实现级\n\n列表元素的逻辑顺序可能反映、也可能不反映我们实际存储数据的方式。如果我们在数组中实现列表，组件的排列方式使得一个组件的前驱和后继在物理上恰好位于它的之前之后。在本章的后半部分，我们将介绍一种实现列表的方法，其中组件在逻辑上而非物理上进行排序的。然而，列表元素的物理排列方式无疑会影响我们访问列表元素的方式。这种安排可能会对列表操作的效率产生影响。例如，无序列表\
  \ ADT 的规范中并没有规定要求我们以随机顺序存储元素的列表来实现列表。如果我们将元素存储在数组中并完全排序，我们仍然可以实现所有的无序列表操作。项目以无序或排序方式存储是否有区别？我们将在第\
  \ 4 章中回答这个问题。\n\n实现列表的方法有两种，它们可以保持列表项的顺序，即以这样的物理方式存储元素，使得我们可以从一个列表元素直接访问其逻辑后继。我们将在章中查看这两种方法。第一种是基于数组的顺序列表表示。这种实现的独特特征是元素顺序存储在数组的相邻槽位中。元素的顺序隐含在它们在数组中的位置中。\n\
  \n第二种方法是链表表示。在链式实现中，数据元素并不限于存储在物理连续的顺序中；相反，单个元素存储在“内存的某处”，并通过它们之间的显式链接来维护顺序。图 3.1\n\
  \n图 3.1 数组与链结构的比较\n\n### 列表设计术语\n\n假设 `location` “访问”某个特定的列表元素，\n\n| 术语 | 说明 |\n\
  | :--- | :--- |\n| `Node(location)` | 指 `location` 处的所有数据，包括特定实现的数据。 |\n| `Info(location)`\
  \ | 指 `location` 处的用户数据。 |\n| `Info(last)` | 指最后一个位置的用户数据。 |\n| `Next(location)`\
  \ | 给出跟随 `Node(location)` 的节点的位置。 |\n\n那么，`location` 是什么？对于基于数组的实现，`location` 是索引，因为我们通过索引访问数组槽位。例如，设计语句\
  \ `Print Info(location)` 意味着“打印 `location` 处数组槽位中的用户数据”；最终它在 C++ 中可能被编码为：\n\n```\n\
  list.info[location].Print(dataFile);\n```\n\n当我们在本章稍后查看链式实现时，翻译将完全不同，但算法保持不变。也就是说，我们实现操作的代码变了，但算法没有变。因此，使用这种设计符号，我们为无序列表\
  \ ADT 定义了与实现无关的算法。\n\n但在基于数组的顺序实现中，`Next(location)` 是什么意思？为了回答这个问题，考虑我们如何在数组中访问下一个列表元素：我们增加位置，即索引。因此，设计语句\
  \ `Set location to Next(location)` 可能在 C++ 中被编码为\n\n```\nlocation++; // location\
  \ 是数组索引。\n```\n\n我们引入这种设计术语并不是为了强迫你学习另一种计算机“语言”的语法。相反，我们希望鼓励你将列表以及元素的部分视为抽象。我们刻意让设计符号与函数调用语法相似，以强调在设计阶段可以隐藏实现细节。更底层的细节封装在\
  \ `Node`、`Info` 和 `Next` 这些“函数”中。使用这种设计术语，我们希望记录可以用于数组实现和链式实现的算法。\n\n#### 数据结构\n\
  \n在我们的实现中，列表元素存储在类对象的数组中。\n\n```\nItemType info[MAX_ITEMS];\n```\n\n\n\n\n我们需要一个\
  \ `length` 数据成员来跟踪存储在数组中的项数，以及上一个项存储的位置。由于列表项是无序的，我们将第一个放入列表的项放在第一个槽位，第二个项放在第二个槽位，以此此类推。因为我们使用的语言是\
  \ C++，我们必须记住，第一个槽位的索引为 0，第二个槽位的索引为 1，最后一个槽位的索引为 `MAX_ITEMS - 1`。现在我们知道了列表从哪里开始——在第一个数组槽位。列表又在哪里结束呢？数组结束在索引为\
  \ `MAX_ITEMS - 1` 的槽位，但列表结束在索引为 `length - 1` 的槽位。\n\n关于列表，还有其他我们必须包含的信息吗？`ResetList`\
  \ 和 `GetNextItem` 两个操作都提到了“当前位置”。这个当前位置是什么？它是在遍历列表时最后访问的元素的索引。我们称其为 `currentPos`。`ResetList`\
  \ 将 `currentPos` 初始化为 `-1`。`GetNextItem` 增加 `currentPos` 并返回 `info[currentPos]`\
  \ 中的值。ADT 规范规定，只有 `ResetList` 和 `GetNextItem` 会影响当前位置。图 3.2 展示了我们的类 `UnsortedType`\
  \ 的数据成员。\n\n```\n#include \"ItemType.h\"\n\n// File ItemType.h 必须由该类的用户提供。\n\n//\
  \ ItemType.h 必须包含以下定义：\n\n// MAX_ITEMS:     列表上的最大项数\n\n// ItemType:      列表上对象的定义\n\
  \n// RelationType:  {LESS, GREATER, EQUAL}\n\n// Member 函数 ComparedTo(ItemType item)\
  \ 返回\n\n//      LESS, 如果自身“在 item 之前”\n\n//      GREATER, 如果自身“在 item 之后”\n\n//\
  \      EQUAL, 如果自身和 item 相同\n```\n\n![](img/f03-02.jpg)\n\n图 3.2 UnsortedType 类的数据成员\n\
  \n```cpp\nclass UnsortedType\n{\n\npublic:\n\n  UnsortedType();\n\n  void MakeEmpty();\n\
  \n  bool IsFull() const;\n\n  int GetLength() const;\n\n  ItemType GetItem(ItemType\
  \ item, bool& found);\n\n  void PutItem(ItemType item);\n\n  void DeleteItem(ItemType\
  \ item);\n\n  void ResetList();\n\n  ItemType GetNextItem();\n\nprivate:\n\n  int\
  \ length;\n\n  ItemType info[MAX_ITEMS];\n\n  int currentPos;\n\n};\n```\n\n现在让我们看看为无序列表\
  \ ADT 指定的操作。\n\n### 构造函数操作\n\n我们的 CRC 卡上没有构造函数，但我们知道一个类应该有一个构造函数。我们之前说过，构造函数通常是语言级别的操作。C++\
  \ 提供了一种语言级别的构造结构，称为类构造函数，它在声明类变量时自动完成这种初始化。类构造函数是一个与类名同名但没有返回类型的成员函数。构造函数的目的是初始化类成员，并在必要时为正在构造的对象分配资源（通常是内存）。与任何其他成员函数一样，构造函数可以访问所有\
  \ `public` 和 `private` 成员，包括数据成员和函数成员。与所有成员函数一样，类构造函数可以有一个空参数列表（称为默认类构造函数），或具有一个或多个参数。\n\
  \n我们在之前的类声明中包含了一个类构造函数。现在，`UnsortedType` 类构造函数必须做什么什么？后置条件规定列表是空的。任何数组都不可能是“空”的；槽位是存在的。然而，列表仅包含我们存储在数组中的值，即从位置\
  \ 0 到位置 `length - 1` 的值。因此，一个空列表就是长度为 0 的列表。\n\n```cpp\nUnsortedType::UnsortedType()\n\
  {\n  length = 0;\n}\n```\n\n注意，我们不需要对存储列表项的数组进行任何操作来使列表为空。如果 `length` 为零，列表就是空的。如果\
  \ `length` 不为零，我们一定已经在数组中通过 `length – 1` 位置存储了项，覆盖了原来那里的内容。数组中从 `length` 位置到末尾的内容对我们来说没有意义。这种区别非常重要：列表位于位置\
  \ 0 和 `length – 1` 之间；数组位于位置 0 和 `MAX_ITEMS – 1` 之间。\n\n### 观察者操作\n\n观察函数 `IsFull`\
  \ 检查 `length` 是否等于 `MAX_ITEMS`。\n\n```cpp\nbool UnsortedType::IsFull() const\n{\n\
  \  return (length == MAX_ITEMS);\n}\n```\n\n观察者成员函数 `GetLength` 的体也只有一条语句。\n\n```cpp\n\
  int UnsortedType::GetLength() const\n{\n  return length;\n}\n```\n\n到目前为止，我们还没有使用我们的特殊设计术语。算法都只有一条（显而易见的）语句长。下一个操作\
  \ `GetItem` 更加复杂。`GetItem` 操作允许列表用户根据指定的键访问列表项，如果该元素存在于列表中）。`item`（带有初始化的键）是此操作的输入；返回\
  \ `item` 和一个标志（`found`）。如果 `item` 的键与列表中的某个键匹配，则 `found` 为 `true`，并返回一个具有匹配键的项的副本。\n\
  \n\n\n请注意，返回的是列表元素的拷贝。调用者无法直接访问列表中的任何数据。\n\n### 转换操作\n\n我们在哪里插入新项？由于列表元素没有按键值排序，我们可以将新项放在任何地方。一个直接的策略是将项放置在\
  \ `length` 位置，然后递增 `length`。\n\n该算法可以很容易翻译为 C++。\n\n```cpp\nvoid UnsortedType::PutItem(ItemType\
  \ item)\n\n// Post: item is in the list.\n\n{\n  info[length] = item;\n  length++;\n\
  }\n```\n\n`DeleteItem` 函数接收一个带有键成员的项，用指示要删除哪个项。该操作显然包含两个部分：找到要删除的元素并将其移除。我们可以使用\
  \ `GetItem` 算法来搜索列表：当 `ComparedTo` 返回 `GREATER` 或 `LESS` 时，我们递增 `location`；当它返回\
  \ `EQUAL` 时，我们退出循环并移除元素。\n\n我们如何“从列表中移除元素”？让我们看看图 3.4 中的示例。从列表中移除 Judy 是很容易的，因为她是列表中的最后一个元素（参见图\
  \ 3.4a 和 3.4b）。然而，如果从列表中删除 Bobby，我们需要移动后续的所有元素以填补空间——或者真的如此吗？如果列表按值排序，我们必须移动所有元素，如图\
  \ 3.4c 所示。但由于列表是无序的，我们只需要将 `length – 1` 位置上的项与被删除的项进行交换（参见图 3.4d）。在基于数组的实现中，我们并没有真正移除元素；相反，我们用之前在其后的元素（如果列表是有序的）或最后一个位置的元素（如果列表是无序的）覆盖它。最后，我们递减\
  \ `length`。\n\n![](img/f03-04.jpg)\n\n图 3.4 在无序列表中删除项\n\n由于 `DeleteItem` 的先决条件规定列表中一定存在相同键的项，因此我们不需要测试列表的末尾。这种选择极地简化了算法，以至于我们直接给出代码而不再进行进一步讨论。\n\
  \n```cpp\nvoid UnsortedType::DeleteItem(ItemType item)\n\n// Pre:  item's key has\
  \ been initialized.\n//       An element in the list has a key that matches item's.\n\
  // Post: No element in the list has a key that matches item's.\n\n{\n  int location\
  \ = 0;\n\n  while (item.ComparedTo(info[location]) != EQUAL)\n    location++;\n\n\
  \  info[location] = info[length – 1];\n  length--;\n}\n```\n\n我们如何让列表为空？我们只需要将 `length`\
  \ 设置为 0。\n\n```cpp\nvoid UnsortedType::MakeEmpty()\n\n// Post: List is empty.\n\n\
  {\n   length = 0;\n}\n```\n\n### 迭代器操作\n\n`ResetList` 函数类似于文件的打开操作，其中文件指针被置于文件开头，以便首次输入操作访问文件的第一个组件。随后的每次输入操作调用将获取文件中的下一个项。因此，`ResetList`\
  \ 必须初始化 `currentPos`，使其指向列表中第一个项的前驱节点。\n\n`GetNextItem` 操作类似于输入操作；它通过递增 `currentPos`\
  \ 并返回 `Info(currentPos)` 来访问下一个项。\n\n`currentPos` 在 `ResetList` 初始化之前之前保持未定义状态。在首次调用\
  \ `GetNextItem` 后，`currentPos` 是 `GetNextItem` 访问的最后一个项的位置。因此，在 C++ 的基于数组的列表中实现此算法时，`currentPos`\
  \ 必须初始化为 `-1`。这些操作编码如下：\n\n```cpp\nvoid UnsortedType::ResetList()\n\n// Post: currentPos\
  \ has been initialized.\n\n{\n  currentPos = –1;\n}\n```\n\n如果在调用 `GetNextItem`\
  \ 之间执行转换操作会发生什么？迭代将是非法的。我们应该添加一个先决条件来防止这种情况发生。\n\n```cpp\nItemType UnsortedType::GetNextItem()\n\
  \n// Pre:  ResetList was called to initialized iteration.\n//       No transformer\
  \ has been executed since last call.\n//       currentPos is defined.\n// Post:\
  \ item is current item.\n//       Current position has been updated.\n\n{\n  currentPos++;\n\
  \  return info[currentPos];\n}\n```\n\n`ResetList` 和 `GetNextItem` 设计用于客户端程序中的循环，通过该循环遍历列表中的所有项。`GetNextItem`\
  \ 规范中的先决条件防止了尝试访问列表中不存在的数组元素。该先决条件要求，在调用 `GetNextItem` 之前，当前位置的元素不能是列表中的最后一项。注意，此先决条件将仅访问已定义项的责任交给了客户端，而不是\
  \ `GetNextItem`。\n\n这里是精简了文档的 `UnsortedType` 类基于数组版本的完整规范文件和实现文件。\n\n```cpp\n//\
  \ File \"UnsortedType.h\" 包含了 UnsortedType \n// 类的规范。\n\n#include \"ItemType.h\"\
  \n\n// File ItemType.h 必须由该类的用户提供。\n// ItemType.h 必须包含以下定义：\n// MAX_ITEMS:     列表上的项的最大数量\n\
  // ItemType:      列表上对象的定义\n// RelationType:  {LESS, GREATER, EQUAL}\n// 成员函数 ComparedTo(ItemType\
  \ item) 返回：\n//      如果 self \"在\" item 之前，返回 LESS\n//      如果 self \"在\" item 之后，返回\
  \ GREATER\n//      如果 self 和 item 相同，返回 EQUAL\n\nclass UnsortedType\n{\npublic:\n\
  \  UnsortedType();\n  void MakeEmpty();\n  bool IsFull() const;\n  int GetLength()\
  \ const;\n  ItemType GetItem(ItemType item, bool& found);\n  void PutItem(ItemType\
  \ item);\n  void DeleteItem(ItemType item);\n  void ResetList();\n  ItemType GetNextItem();\n\
  \nprivate:\n  int length;\n  ItemType info[MAX_ITEMS];\n  int currentPos;\n};\n\n\
  // Unsorted.h 的实现文件\n\n#include \"unsorted.h\"\n\nUnsortedType::UnsortedType()\n\
  {\n  length = 0;\n}\n\nbool UnsortedType::IsFull() const\n{\n  return (length ==\
  \ MAX_ITEMS);\n}\n\nint UnsortedType::GetLength() const\n{\n  return length;\n}\n\
  \nItemType UnsortedType::GetItem(ItemType item, bool& found)\n// Pre:  item 的键成员已初始化。\n\
  // Post: 如果列表中存在与 item 匹配的键，则返回该元素的拷贝；\n//       否则，返回 item。\n{\n  bool moreToSearch;\n\
  \  int location = 0;\n  found = false;\n  moreToSearch = (location < length);\n\
  \  while (moreToSearch && !found)\n  {\n    switch (item.ComparedTo(info[location]))\n\
  \    {\n      case LESS:\n      case GREATER:\n        location++;\n        moreToSearch\
  \ = (location < length);\n        break;\n      case EQUAL:\n        found = true;\n\
  \        item = info[location];\n        break;\n    }\n  }\n  return item;\n}\n\
  \nvoid UnsortedType::PutItem(ItemType item)\n// Post: item 在列表中。\n{\n  info[length]\
  \ = item;\n  length++;\n}\n\nvoid UnsortedType::DeleteItem(ItemType item)\n// Pre:\
  \  列表中一定存在一个与 item 键相同的项。\n// Post: 列表中没有项与 item 的键匹配。\n{\n  int location = 0;\n\
  \  while (item.ComparedTo(info[location]) != EQUAL)\n    location++;\n  \n  info[location]\
  \ = info[length – 1];\n  length--;\n}\n\nvoid UnsortedType::MakeEmpty()\n// Post:\
  \ 列表为空。\n{\n  length = 0;\n}\n\nvoid UnsortedType::ResetList()\n// Post: currentPos\
  \ 已初始化。\n{\n  currentPos = -1;\n}\n```\n\n\n\n\n在我们的几个列表操作中，我们声明了局部变量 `location`，它包含了正在处理的列表项的数组索引。数组索引的值永远不会在列表操作之外暴露；这些信息保持在无序列表抽象数据类型（ADT）的实现内部。如果列表用户想要列表中的某个项，`GetItem`\
  \ 操作不会给用户提供该项的索引，而是返回该项的副本。如果用户想更改项中数据成员的值，这些更改不会反映在列表中，除非用户删除了原始值并插入修改后的版本。列表用户永远无法看到或操纵存储列表的物理结构。这些列表实现的细节被\
  \ ADT 封装起来。\n\n#### 测试计划\n\n`UnsortedType` 类带有一个构造函数和另外七个成员函数：`PutItem` 和 `DeleteItem`（转换器）；`IsFull`、`GetLength`\
  \ 和 `GetItem`（观察者）；以及 `ResetList` 和 `GetNextItem`（迭代器）。由于我们的操作独立于列表中对象的类型，因此我们可以将\
  \ `ItemType` 定义为 `int`，并知道如果我们的操作对这些数据有效，那么它们也适用于任何其他 `ItemType`。这里是我们在测试计划中使用的\
  \ `ItemType` 的定义。我们将最大项数设为 5。我们包含一个成员函数，将 `ItemType` 类的项打印到 `ofstream` 对象（文件）。我们需要在驱动程序中使用此函数来查看列表项中的值。\n\
  \n```\n// 以下的声明和定义放入文件 ItemType.h 中。\n\n#include <fstream>\n\nconst int MAX_ITEMS\
  \ = 5;\n\nenum RelationType {LESS, GREATER, EQUAL};\n\nclass ItemType\n\n{\n\npublic:\n\
  \n  ItemType();\n\n  RelationType ComparedTo(ItemType) const;\n\n  void Print(std::ofstream&)\
  \ const;\n\n  void Initialize(int number);\n\nprivate:\n\n  int value;\n\n};\n\n\
  // 以下的定义放入文件 ItemType.cpp 中。\n\n#include <fstream>\n\n#include \"ItemType.h\"\n\n\
  ItemType::ItemType()\n\n{\n\n  value = 0;\n\n}\n\nRelationType ItemType::ComparedTo(ItemType\
  \ otherItem) const\n\n{\n\n  if (value < otherItem.value)\n    return LESS;\n\n\
  \  else if (value > otherItem.value)\n    return GREATER;\n\n  else return EQUAL;\n\
  \n}\n\nvoid ItemType::Initialize(int number)\n\n{\n\n  value = number;\n\n}\n\n\
  void ItemType::Print(std::ofstream& out) const\n// Pre:  out 已打开。\n// Post: value\
  \ 已被发送到流 out。\n\n{\n\n  out << value << \" \";\n\n}\n```\n\n规范中的先置条件和后置条件决定了黑盒测试策略所需的测试。函数的代码决定了白盒测试策略。为了测试无序列表\
  \ ADT 的实现，我们结合了这两种策略。由于所有其他操作的先置条件是列表已初始化，因此我们通过检查列表初始是否为空（调用 `GetLength` 返回 0）来测试构造函数。\n\
  \n`GetLength`、`PutItem` 和 `DeleteItem` 必须一起测试。也就是说，我们插入几个项并检查长度；我们删除几个项并检查长度。我们如何知道\
  \ `PutItem` 和 `DeleteItem` 能够正常工作呢？我们编写了一个辅助函数 `PrintList`，它使用 `GetLength`、`ResetList`\
  \ 和 `GetNextItem` 遍历列表并打印出值。我们调用 `PrintList` 来检查在系列插入和删除之后的列表状态。为了测试 `IsFull` 操作，我们插入四个项并打印测试结果，然后插入第五个项并打印测试结果。为了测试\
  \ `GetItem`，我们搜索已知在列表中的项以及已知不在列表中的项。\n\n我们如何选择测试计划中使用的值呢？我们查看边界情况。列表中的边界情况有哪些？项在列表的首个位置、项在列表的最后一个位置，以及项是列表中唯一的项。我们必须确保\
  \ `DeleteItem` 能够正确删除这些位置的项。我们还必须确认 `GetItem` 能够在这些相同位置找到项，并正确判断出小于第一个位置的值或大于最后一个位置的值为未找到。请注意，该测试计划涉及黑盒策略。也就是说，我们按照接口描述的方式来看列表，而不是看代码。\n\
  \n这些观察结果总结在下面的测试计划中。测试按照应该执行的顺序显示。\n\n| 要测试的操作及操作描述 | 输入值 | 预期输出 |\n| --- | ---\
  \ | --- |\n| 构造函数 | | 打印 `GetLength` | 0 |\n| `PutItem` | | 插入四个项并打印 | 5, 7, 6,\
  \ 9 | 5 7 6 9 |\n| | 插入项并打印 | 1 | 5 7 6 9 1 |\n| `GetItem` | | 获取 4 并打印是否找到 | |\
  \ 未找到项 |\n| | 获取 5 并打印是否找到 | | 找到了项 |\n| 获取 9 并打印是否找到 | | 找到了项 | |\n| | 获取 10 并打印是否找到\
  \ | | 未找到项 |\n| `IsFull` | | 调用（是否满） | | 列表满 |\n| | 删除项 | | 列表未满 |\n| `DeleteItem`\
  \ | | 删除项 | | 已删除 |\n| `GetLength` | | 打印 `GetLength` | 0 |\n| `ResetList` | | 调用\
  \ `ResetList` | | 列表重置 |\n| `GetNextItem` | | 调用 `GetNextItem` | | 返回项\n\n### 3.3\
  \ 指针类型\n\n#### 逻辑层面\n\n指针是简单的（非复合）类型，但它们允许我们在运行时创建复合类型。本章将描述指针的创建、访问和使用。\n\n指针变量并不包含通常意义上的数据值；相反，它包含另一个变量的内存地址。要声明一个指向整数的指针，使用以下语法：\n\
  \n```\nint* intPointer;\n```\n\n星号 (`*`) 作为类型的后缀符号表示所定义的变量是指向该类型的指针：`intPointer`\
  \ 可以指向一个包含 `int` 值的内存。（或者，星号也可以作为变量名的的前缀。）与新定义的变量一样，`intPointer` 的内容是未。下图显示了执行该语句后的内存。（为了说明，我们假设编译器为\
  \ `intPointer` 分配了位置 10。）\n\n(Images/f160-01.jpg)\n\n我们如何让 `intPointer` 有指向的对象？一种方法是使用前缀\
  \ `&` 运算符，它被称为地址运算符。给定声明\n\n```\nint alpha;\n\nint* intPointer;\n```\n\n赋值语句\n\n\
  ```\nintPointer = &alpha;\n```\n\n获取 `alpha` 的地址并将其存入 `intPointer`。如果 `alpha` 在地址\
  \ 33，内存所示：\n\n(Images/f161-01.jpg)\n\n我们有一个指针，也有指针所指向的地方，但我们如何访问该地方呢？星号 (`*`) 作为指针名称的前缀可以访问指针指向的地方。星号被称为解引用运算符。让我们在\
  \ `intPointer` 指向的地方存储 25。\n\n```\n*intPointer = 25;\n```\n\n内存现在所示：\n\n\n\n\n\n\
  ![](img/f0162-01.jpg)\n\n因为 `intPointer` 指向 `alpha`，语句\n\n```\n*intPointer = 25;\n\
  ```\n\n代表对 `alpha` 的间接寻址；机器首先访问 `intPointer`，然后使用其内容找到 `alpha`。相比之下，语句\n\n```\n\
  alpha = 10;\n```\n\n涉及对 `alpha` 的直接寻址。直接寻址好比打开邮政邮箱（例如 15 号邮信箱）并找到一个包裹，而间接寻址则好比打开\
  \ 15 号邮信箱并发现一张纸条，告诉你的包裹存放在 23 号邮信箱里。\n\n让 `intPointer` 指向某个内容的第二种方法被称为动态分配。在之前的示例中，`intPointer`\
  \ 和 `alpha` 的内存空间都是静态分配的（在编译时分配）。或者，我们的程序可以动态地分配内存（在运行时）。\n\n为了实现变量的动态分配，我们使用 C++\
  \ 运算符 `new`，后面跟上数据类型的名称：\n\n```\nintPointer = new int;\n```\n\n在运行时，`new` 运算符分配一个能够存储\
  \ `int` 值的变量并返回其内存地址，该地址随后存储在 `intPointer` 中。如果执行上述语句后 `new` 运算符返回地址 90，则内存情况如下：\n\
  \n![](img/f0163-01.jpg)\n\n由 `new` 创建的变量位于空闲（或堆）上，这是一块为动态分配留出的内存区域。动态分配的变量没有名称，无法被直接寻址。它必须通过\
  \ `new` 返回的指针进行间接寻址。\n\n有时我们希望指针指向空。根据 C++ 的定义，值为 `0` 的指针值被称为空指针；它指向任何地方。为了将空指针与整数值\
  \ 0 区分开，`<cstddef>` 包含了命名常量 `NULL` 的定义，我们用它代替直接引用 0。让我们再看几个例子。\n\n```\nbool* truth\
  \ = NULL;\n\nfloat* money = NULL;\n```\n\n在绘制指针图时，我们使用一条从右上到左下角的对角线表示该值为 `NULL`。\n\
  \n![](img/f0164-01.jpg)\n\n让我们观察经过几次指针操作后的内存情况。\n\n```\ntruth = new bool;\n\n*truth\
  \ = true;\n\nmoney = new float;\n\n*money = 33.46;\n\nfloat* myMoney = new float;\n\
  ```\n\n在绘制指针及其指向的对象的图时，我们使用方框和箭头。\n\n![](img/f0164-02.jpg)\n\n任何可以应用于 `int` 类型常量或变量的操作都可以应用于\
  \ `*intPointer`。任何可以应用于 `float` 类型常量或变量的操作都可以应用于 `*money`。任何可以应用于 `bool` 类型常量或变量的操作都可以应用于\
  \ `*truth`。例如，我们可以通过以下语句将一个值读入 `*myMoney`：\n\n```\nstd::cin >> *myMoney;\n```\n\n\
  如果输入流中的当前值为 99.86，那么在执行上述语句后，`*myMoney` 包含 99.86。\n\n只要指针指向相同数据类型的变量，就可以对指针进行相等比较并相互赋值。考虑以下两个语句：\n\
  \n```\n*myMoney = *money;\n\nmyMoney = money;\n```\n\n第一个语句将 `money` 指向的位置的值拷贝到\
  \ `myMoney` 指向的位置。\n\n![](img/f0165-01.jpg)\n\n第二条语句将 `money` 中的值拷贝到 `myMoney` 中，产生如下配置：\n\
  \n![](img/f0165-02.jpg)\n\n此时，持有第二个 33.46 副本的位置无法被访问；因为没有指针指向它。这种现象被称为内存泄漏，而再也无法访问的内存单元被称为垃圾。某些编程语言（如\
  \ Java）提供了垃圾回收；也就是说，运行时支持系统会定期遍历内存，并回收那些不存在访问路径的内存位置。\n\n为了避免内存泄漏，C++ 提供了 `delete`\
  \ 运算符，它将之前由 `new` 运算符分配的内存位置返回到空闲存储。如有必要，该内存可以再次被分配。以下代码段防止了我们的内存泄漏：\n\n```\ndelete\
  \ myMoney;\n\nmyMoney = money;\n```\n\n`myMoney` 原本指向的位置不再被分配。注意，`delete` 并没有删除指针变量，而是删除指针指向的变量。\n\
  \n![](img/f0166-01.jpg)\n\n注意将一个指针赋值给另一个指针 (`myMoney = money`) 与为指向的位置赋值 (`*myMoney\
  \ = *money`) 之间的区别。务必小心区分指针和它指向的对象！\n\n### 应用级别\n\n你是否曾将数组作为参数传递过？如果是，你就使用了一个指针常量。不带任何索引括号的数组名称是一个常量指针表达式——即数组的基地址。看下面的代码：\n\
  \n```\nchar alpha[20];\n\nchar* alphaPtr;\n\nchar* letterPtr;\n\nvoid Process(char[]);\n\
  \nalphaPtr = alpha;\n\nletterPtr = &alpha[0];\n```\n\n在这里，`alphaPtr` 被赋值为 `alpha`；`letterPtr`\
  \ 被赋值为 `&alpha[0]`。当 `Process` 的原型声明它接受 `char` 数组作为参数时，意味着它期望一个指针表达式作为实际参数。因此，调用语句发送的是数组的名称。\n\
  \n指针也可以用于其他复合类型。\n\n```\nstruct MoneyType\n{\n\n  int dollars;\n\n  int cents;\n\
  };\n\nMoneyType* moneyPtr = new MoneyType;\n\nmoneyPtr->dollars = 3245;\n\nmoneyPtr->cents\
  \ = 33;\n```\n\n箭头运算符 (`->`) 为解引用指针并访问结构体成员提供了一种快捷方式。即 `moneyPtr->cents` 是 `(*moneyPtr).cents`\
  \ 的简写。（解引用运算符的优先级低于点运算符，所以括号是必要的。）\n\n### 3.4 使用链式结构实现 `UnsortedType` 类\n\n我们的第一次实现使用了数组。数组的组件通过其在结构中的位置来访问。数组是学生通常学习的第一种组织结构，正如在本章之前所示，它们被用于实现其他结构。它们在大多数高级编程语言中作为基础语言构造可用。\n\
  \n正如我们之前提到的，链式结构是分离元素的集合，每个元素都与列表中的下一个元素相连。我们可以将链表比为元素的链。链表是一种多功能、强大的基础实现结构，和数组一样，它是构建更复杂结构的主要组件之一。教你如何处理链接和链表是本书的一个重要目标。链接不仅可以用于实现更复杂的经典结构，还可以用于创建你自己的结构。\n\
  \n#### 实现级别\n\n指针变量仅包含一个内存地址。操作系统控制内存分配，并在请求时向你的程序授予内存。\n\n\n\n\n现在，让我们来看看如何使用动态存储分配的概念来实现链表表。\n\
  \n#### 链式结构\n\n在我们观察实现链式结构时，让我们用 `UnsortedType` 的 `PutItem` 函数作为示例。我们可以修改函数 `PutItem`来动态地为每个新元素分配空间。\n\
  \n实现此操作的第一部分非常简单。我们使用 C++ 内置运算符 `new` 来动态分配空间：\n\n```cpp\n// 为新条目分配空间。\nitemPtr\
  \ = new ItemType;\n```\n\n`new` 运算符分配一个足够容纳 `ItemType` 类型（列表包含的数据类型）值的内存块，并返回该内存块的地址，该地址被复制到变量\
  \ `itemPtr` 中。暂假设 `itemPtr` 已经声明为 `ItemType*` 类型。现在我们可以使用解引用运算符（`*`）将 `newItem`\
  \ 放入分配的空间中：`*itemPtr = newItem`。此时的情况如图图 3.5 所示，其中 `newItem` 为‘E’。\n\n`PutItem`\
  \ 操作的第三部分是“将分配的空间放入列表”。我们如何做到这一点？让我们思考一下在插入几个字符后会发生什么。为每个新元素分配了空间，并且每个字符都被放入了空间中。图\
  \ 3.6 显示了调用 `PutItem` 向列表添加字符‘D’‘A’、‘L’和‘E’的结果。\n\n![](img/f03-05.jpg)\n\n图 3.5\
  \ 将新元素放入分配的空间\n\n![](img/f03-06.jpg)\n\n### 图 3.6 调用四次 `PutItem` 后\n\n哎——我们在动态分配的空间中看到了数据，但它并不是一个列表！没有顺序。更糟糕的是，因为我们没有从\
  \ `PutItem` 函数返回指向动态分配空间的指针，我们再也无法访问任何元素。显然，`PutItem` 操作的第三部分需要做些处理来修复这种情况。我们可以在哪里存储指向数据的指针？\n\
  \n脑到的一个可能性是将列表声明为指针数组，并将每个新条目的指针放入此数组中，如图图 3.7 所示。这种解决方案将按正确顺序跟踪所有元素的指针，但它并没有解决我们最初的问题：我们仍然需要声明特定大小的数组。我们还可以把指针放在哪里呢？如果我们可以以某种方式将所有元素连接起来就太好了，如图图\
  \ 3.8 所示。我们将这种“链式”列表中的每个元素称为节点（node）。\n\n这个解决方案看起来很有前景。让我们看看如何使用这个想法来实现列表。首先，我们插入字符‘D’。`PutItem`\
  \ 使用运算符 `new` 为新节点分配空间，并将‘D’放入该空间。现在列表中有一个元素。我们不希望丢失指向该元素的指针，因此我们需要在列表类中设置一个数据成员来存储指向列表顶部的指针（`listData`）。图\
  \ 3.9 描述了第一次 `PutItem` 操作。\n\n![](img/f03-07.jpg)\n\n图 3.7 跟踪指针的一种方法\n\n![](img/f03-08.jpg)\n\
  \n图 3.8 将列表元素链在一起\n\n![](img/f03-09.jpg)\n\n图 3.9 放入第一个元素\n\n现在我们调用 `PutItem` 将字符‘A’添加到列表。`PutItem`\
  \ 应用 `new` 为新元素分配空间并将‘A’放入该空间。接下来，我们想将‘A’链到旧的列表顶部元素‘D’。我们可以通过让一个元素“指向”下一个元素来在两个元素之间建立联系；也就是说，我们可以在每个列表元素中存储下一个元素的地址。为了做到这一点，我们需要修改节点类型。让列表中的每个节点包含两个部分：`info`\
  \ 和 `next`。`info` 成员包含列表用户的数据——例如，一个字符。`next` 成员包含列表中下一个元素的地址。单个节点如图图 3.10 所示。\n\
  \n如如图所示，每个节点的 `next` 成员指向列表中的下一个节点。最后一个节点的 `next` 成员呢？我们不能让它保持未赋值。列表最后一个节点的 `next`\
  \ 成员必须包含一个不是有效地址的特殊值。`<cstddef>` 中提供的特殊指针常量 `NULL` 表示“此指针不指向任何内容”。我们可以将 `NULL` 放在最后一个节点的\
  \ `next` 成员中，以标记列表的结束。在图中，我们使用跨越 `next` 成员的斜杠来表示 `NULL` 指针。\n\n在章的前面我们引入了一种包含节点抽象的列表设计术语（参见图\
  \ 3.11）。\n\n![](img/f03-10.jpg)\n\n图 3.10 单个节点\n\n基于数组的实现中 `location` 是索引；在我们基于指针的实现中，它必须是一个指针。`listData`\
  \ 指向的节点有两个部分，`info` 和 `next`，这暗示了一个 C++ 结构或类。我们选择将 `NodeType` 结构结构而不是类，因为结构中的节点是被动的。它们由\
  \ `UnsortedType` 的成员函数处理。\n\n![](img/f03-11.jpg)\n\n图 3.11 术语\n\n现在我们调用 `PutItem`\
