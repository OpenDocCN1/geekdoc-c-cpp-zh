  \ C++ 运算符优先级。在表中，运算符按优先级分组（从高到低），水平线将每个优先级级别与下一个低级别分开。通常，二元运算符从左到右分组；一元运算符从右到左分组；`?:`\
  \ 运算符从右到左。例外：赋值运算符从右到左分组。\n\n### 优先级（从高到低）\n\n| 运算符 | 结合性 | 备注 |\n| --- | --- |\
  \ --- |\n| :: | 左到右 | 作用域解析（二元） |\n| :: | 右到左 | 全局访问（一元） |\n| () | 左到右 | 函数调用和函数式类型转换\
  \ |\n| [] -> . | 左到右 |  |\n\n\n\n\n| 运算符 | 方向 | 说明 |\n| :--- | :--- | :--- |\n|\
  \ `++` `--` | 从右向左 | `++` 和 `--` 为后置运算符 |\n| `typeid` `dynamic_cast` | 从右向左 | |\n\
  | `static_cast` `const_cast` | 从右向左 | |\n| `reinterpret_cast` | 从右向左 | |\n| `++`\
  \ `--` `!` 一元运算符 `+` 一元运算符 `–` | 从右向左 | `++` 和 `--` 为前置运算符 |\n| `~` 一元运算符 `*` 一元运算符\
  \ `&` | 从右向左 | |\n| `(cast)` `sizeof` `new` `delete` | 从右向左 | |\n| `->*` `.*` |\
  \ 从左向右 | |\n| `*` `/` `%` | 从左向右 | |\n| `+` `–` | 从左向右 | |\n| `<<` `>>` | 从左向右 |\
  \ |\n| `<` `<=` `>` `>=` | 从左向右 | |\n| `==` `!=` | 从左向右 | |\n| `&` | 从左向右 | |\n\
  | `^` | 从左向右 | |\n| `|` | 从左向右 | |\n| `&&` | 从左向右 | |\n| `||` | 从左向右 | |\n| `?:`\
  \ | 从右向左 | |\n| `=` `+=` `-=` `*=` `/=` `%==` | 从右向左 | |\n| `<<=` `>>=` `&=` `\\\
  |=` `^=` | 从右向左 | |\n| `throw` | 从右向左 | |\n| `,` | 从左向右 | 顺序运算符，而非分隔符 |\n\n# 附录\
