  \n向为这本书工作的人们献上一束虚拟的玫瑰：Laura Pagluica, Taylor Ferracane, Amanda Clerkin 和 Escaline\
  \ Charlette Aarthi。\n\nN. D.\nC. W.\nT. R.\n\n# 第 1 章：软件工程原理\n\n© Repina Valeriya/Shutterstock\n\
  \n在你计算机生涯的这个阶段，你已经完成了至少一门科学课程。你可以处理中等复杂度的问题，编写一个算法来解决它，用 `C++` 该算法，并证明你的解决方案的正确性。现在你开始上一门新课，是时候停下来回顾那些能够确保你确实能做到大纲所声称内容的原则了。\n\
  \n在本章中，我们将回顾软件设计过程和软件正确性的验证。在第 2 章中，我们将回顾数据设计和实现。\n\n### 1.1 软件过程\n\n当我们考虑计算机编程时，会立即想到为计算机编写可执行的程序——即在某种计算机语言中生成代码。作为计算机科学初学者，你编写了解决简单问题的程序。你最初的大部分精力放在学习\
  \ C++ 等编程语言的语法上：语言的关键字、数据类型、选择结构（`if-else` 和 `switch`）、循环结构（`while`、`do while` 和\
  \ `for`）以及输入/输出机制（`cin` 和 `cout`）。\n\n\n\n随着你的程序变得越来越大且复杂，除了编码之外，你必须关注其他软件问题。如果你成为一名软件专业人员，你可能会作为一个团队的一部分工作，开发包含数万甚至数百万行代码的系统。复杂程序的成功创建需要有组织的方法。我们使用`软件工程`（software\
  \ engineering）一词来指代关注开发高质量软件系统所有方面的学科。它涵盖了软件生命周期期间使用的各种技术，以及文档编制和团队协作等辅助活动。`软件过程`（software\
  \ process）是一组特定的相互相关的软件工程技术，供个人或组织使用以创建一个系统。\n\n软件工程是一个广阔的领域。大多数计算机教育计划都会安排一或多门高级课程介绍这一主题。事实上，有几所学校提供该学科的学位。本节对这一重要领域进行简要介绍。\n\
  \n#### 软件生命周期\n\n“软件工程”一词产生于 20 世纪 60 年代，旨在强调在创建软件时需要类似于工程的纪律。当时，软件开发的特点是方法杂乱无章，缺乏组织。这种严谨方法早期的主要贡献是识别和研究开发成功系统所涉及的各种活动。这些活动构成了软件项目的“生命周期”，包括：\n\
  \n*   **问题分析**：理解要解决的问题的本质\n*   **需求性取**：准确确定程序必须做什么\n*   **需求规范**：规定程序必须做什么（功能性需求）以及解决方案的约束条件（非功能性需求，例如使用什么语言）\n\
  *   **高层设计和低层设计**：记录程序如何满足需求，从“大局”概述到详细设计\n*   **设计的实现**：用计算机语言编写程序\n*   **测试与验证**：检测并修复错误，并证明程序的正确性\n\
  *   **交付**：将测试过的程序交付给客户或用户（或老师！）\n*   **运行**：实际使用该程序\n*   **维护**：进行更改以修复运行错误，并添加或修改程序的功能\n\
  \n经典情况下，这些活动是按照上述顺序执行的。每个阶段都会以创建结构化文档作为结束，这些文档为构建后续阶段提供基础。这被称为“瀑布型”生命周期，因为它的图形描述像级联的瀑布，如图\
  \ 1.1a 所示。每个阶段的文档输出都会像水流过河流一样输入到下一个阶段。\n\n瀑布法被广泛使用了多年，并在组织软件开发方面起了重要作用。然而，软件项目在许多重要方面不相同，例如规模、持续时间、范围、所需的可靠性和应用领域。期望一种生命周期方法适用于所有项目是不现实的。瀑布法将项目划分为独立阶段的划分缺乏灵活性，且对文档的过度强调导致了它失去了流行。在需求被充分理解且不太发生变化时，它仍然有用，但现代软件开发往往并非如此。\n\
  \n![](img/f01-01.jpg)\n\n图 1.1 生命周期模型\n\n对于不完全符合瀑布周期的项目，演化出了替代的生命周期方法。例如，图 1.1b\
  \ 所示的螺旋模型直接解决了软件开发中固有的主要风险，例如创建不需要产品的风险、包含不必要功能的风险以及创建混淆界面的风险。重要的活动（如目标设定、风险评估、开发和验证）随着项目从原始概念变为最终形式，以螺旋方式反复进行。与瀑布模型不同（瀑布模型盲目进行开发直到测试阶段），螺旋模型强调对目标进行持续评估和调整。\n\
  \n还定义了许多其他软件过程模型。有强调原型设计的模型、用于实时系统开发的模型，以及强调创造性解决问题的模型。在某种意义上，模型的数量与开发软件的组织数量一样。所有组织如果管理得当，都会从各种标准方法中汲取最符合其目标的想法，并创建属于他们自己的生命周期版本，即最适合他们的版本。顶尖组织不断衡量其方法的效果，并尝试不断改进其流程。现实世界中的软件开发并非易事，需要良好的组织、灵活性和警觉的管理。\n\
  \n#### 程序员的工具箱\n\n让我们作为程序员或软件工程师的工作面临挑战的是，软件规模和复杂性倾向于不断增长，并在开发的每个阶段发生变化。良好的软件过程的一部分是使用工具来管理这种规模和复杂性。通常程序员有几个工具箱，每个工具箱包含有助于构建和塑造软件产品的工具。\n\
  \n### 硬件\n\n一个工具箱包含硬件本身：计算机及其外设备（如显示器、键盘、触控板和网络接口），我们在这些设备上为这些开发软件。\n\n### 软件\n\n\
  第二个工具箱包含各种软件工具：控制计算机资源的操作系统、帮助我们输入程序的开发环境、将 `C++` 等高级语言翻译成计算机可以执行内容的编译器、交互式调试程序、测试数据生成器等。你已经使用过这些工具中的一些。\n\
  \n### 知识库 (Ideaware)\n\n第三个工具箱充满了程序员随时间推移收集的共享知识。这个箱包含了我们用于解决常见编程问题的算法，以及用于对程序处理的信息建模的数据结构。记住，`algorithm`（算法）是对问题解决方案的逐步描述。我们如何在执行相同任务的两个算法之间做出选择，通常取决于特定应用程序的需求。如果没有相关的需求，选择可能基于程序员自己的风格。\n\
  \n“知识库”包含了编程方法论，如自顶向下设计和面向对象的设计，以及软件概念，包括信息隐藏、数据封装和抽象。它包含了创建设计的辅助工具，如类、责任和协作 (`CRC`)\
  \ 卡片，以及描述设计的方法（如统一建模语言 (`UML`)）。它还包含了一些用于衡量、评估和证明程序正确性的工具。我们书的大部分内容致力于探索第三个工具箱的内容。\n\
  \n有些人认为使用这些工具会剥夺编程的创造力，但我们并不认为事实如此。艺术家和作曲家具有创造力，但他们的创新植根于工艺的基本原理。同样，最有创造力的程序员通过对基本编程工具的规范使用来构建高质量软件。\n\
  \n#### 质量软件的目标\n\n质量软件意味着不仅仅是一个能够完成当前任务的程序。一个良好的程序实现以下目标：\n\n1.  它可以正常工作。\n2.  它可以在不需要过多精力的情况下进行修改。\n\
  3.  它是可复用的。\n\n\n\n\n\n## 4. 按时且预算内完成。\n\n实现这些目标并非易事，但它们都非常重要。\n\n### 目标 1：高质量的软件能够运行\n\
  \n程序必须完成其设计的任务，并且必须正确、完整地完成。因此，开发过程的第一步是准确确定程序被要求做什么。要编写一个运行良好的程序，你首先需要对程序需求有一个定义。对于学生来说，需求通常包含在导师的题目描述中：“编写一个计算\
  \ . . . 的程序。”对于从事政府合同工作的程序员来说，需求文档可能有数百页之长。\n\n我们使用软件规范（software specifications）来开发满足用户需求的程序。规范指出了输入格式和预期输出、处理细节、性能指标（多快？多大？多准？）、发生错误时该怎么办等。规范准确地告诉了程序要做什么，但没有说明它是如何实现的。有时，你的导师会提供详细的规范；其他时候，你可能需要根据需求定义、与导师的对话或推测来自己编写规范。（我们将在本章稍后的部分详细讨论这个问题。）\n\
  \n你如何知道程序是正确的？程序必须是**完整**的（它应该“执行所有”指定的任务）且**正确**的（它应该“做对”）才能满足需求。此外，它还应该是**易用**的。例如，如果程序需要直接从人员接收数据，它必须指示它何时期待输入。程序的输出对用户来说应该是可读且易懂的。事实上，在今天的软件工程中，创建一个良好的用户界面是一项重要的课题。\n\
  \n最后，目标 1 意味着程序应该具有所需的效率。我们绝不会故意编写浪费时间或内存程序，但并非所有程序都要求极效率。然而，当需要时，我们必须满足这些要求，否则程序将无法满足需求。例如，太空发射控制程序必须“实时”执行；也就是说，软件必须与其控制的活动协调，处理命令、执行计算并显示结果。回到生活中，如果一个文字处理程序更新屏幕的速度赶不上用户输入的速度，那么程序的效率就没有达到要求。在这种情况下，如果软件效率不够，它就没有满足需求；因此，根据我们的定义，它没有正确运行。在第\
  \ 2 章中，我们将介绍一种比较不同算法效率的方法。\n\n总结来说，一个典型的程序需要：\n\n*   **完整 (complete)**：它应该完成“所有”需要的任务。\n\
  *   **正确 (correct)**：它应该“做对”。\n*   **易用 (usable)**：它的用户界面应该“易于操作”。\n*   **高效 (efficient)**：考虑到任务的复杂性和大小，它应该在“合理的时间内”完成。\n\
  \n### 目标 2：高质量的软件是可以修改的\n\n软件何时需要修改？变化在它存在的每个阶段都会发生。\n\n软件在**设计阶段**发生变化。当你的导师或雇主给你一个编程作业时，你开始思考如何解决这个问题。然而，当下次见面时，你可能会被通知题目描述发生了细微的变化。\n\
  \n软件在**编码阶段**发生变化。你会因为编译错误而对程序进行更改。有时在程序编写完成后，你突然发现问题的某部分有了更好的解决方案，于是你做了更改。\n\n\
  软件在**测试阶段**发生变化。如果程序崩溃或产生错误结果，你必须进行纠正。\n\n在学术环境中，软件的生命周期通常在提交纠正后的程序评分时结束。然而，当为现实世界的使用开发软件时，大多数变化发生在“维护”阶段。有人可能发现一个测试中未发现的错误，另一个人可能想包含额外的功能，第三方可能想更改输入格式，而第四个人可能想在另一个系统上运行程序。\n\
  \n如你所见，软件在其生命周期的所有阶段都会频繁变化。由于这一事实，软件工程师试图开发易于修改的程序。如果你认为修改程序是一件简单的事，请试着在你最后编写的程序上做一个“小更改”。在时间过一段时间后，要记住程序的所有细节是很困难的，不是吗？程序的修改往往不是由原作者完成，而是由随后的维护程序员完成的。（有一天你可能就是那个对他人程序进行修改的人。）\n\
  \n什么让一个程序易于修改？首先，它对人类来说应该是可读且易懂的。在被更改之前，它必须被理解。一个设计良好、编写清晰、文档完备程序显然更容易让人类读者理解。“现实世界”程序所需的文档页数通常超过代码页数。几乎每个组织都有自己的文档策略。阅读编写得良好的程序可以教你一些有助于编写良好程序的技巧。事实上，很难想象一个人如果不阅读良好的程序，如何成为一名出色的程序员。\n\
  \n其次，程序应该能够抵受细小的变化。核心思想是将你的程序分成易于管理的各个，这些部分共同工作解决问题，但又保持相对独立。本章稍后回顾的设计方法应该帮助你编写出满足这一目标的程序。\n\
  \n### 目标 3：高质量的软件是可复用的\n\n创建高质量的软件需要时间和精力。因此，尽可能地从软件中提取价值是重要的。\n\n在构建软件解决方案时，节省时间和精力的一种方法是复用以前项目的程序、类、函数和其他组件。通过使用以前设计和测试过的代码，你可以更早、更省力地获得你的解决方案。或者，当你创建软件来解决问题时，有时可以对该软件进行结构化，使其帮助解决未来的相关问题。通过这样做，你可以从创建的软件中获得更多价值。\n\
  \n创建可复用的软件不会自动发生。它在规范和设计阶段需要额外的精力。为了可复用，软件必须有完备的文档且易于阅读，以便程序员能够快速判断是否可以用于新项目。它通常具有简单的接口，以便能够方便地插入另一个系统。它还应该是可修改的（目标\
  \ 2），以防在需要适应新系统时进行细微更改。\n\n\n\n\n\n面向对象的方法兴起的主要原因之一是它们易于重用。之前的重用方法受限于不恰的重用单元。如果重用单元太小，那么节省的工作量就不值得付出精力；如果重用单元太大，则很难将其与其他系统元素结合。面向对象的类如果设计得当，可以是非常合适的重用单元。一个类封装了数据以及对数据的操作，这使其成为重用的理想选择。\n\
  \n#### 目标 4：在预算内按时完成高质量的软件\n\n你很知道在学校里推迟交程序会发生什么。你可能曾为一个本近乎完美的程序感到难过——仅仅因为你晚交了一天，它只得到了了一半的分，或者完全没有分数。\n\
  \n尽管迟到的后果在学术界看起来似乎是随意的，但在商业世界，它们是重大的。控制太空发射的软件必须在发射发生之前完成开发和测试。新医院的患者数据库系统必须在医院开业之前安装。在这种情况下，如果程序在需要时没有准备好，它就无法满足需求。\n\
  \n“时间就是金钱”听起来可能很陈调，但未能满足截止日期代价是高昂的。公司通常会为某个软件的开发预算一定的时间和资金。作为程序员，你拿的是工资或时薪。如果截止日期到达时，你的项目部分只完成了\
  \ 80%，公司必须付给你（或另一个程序员）薪水来完成工作。然而，工资上的额外支出并不是唯一成本。其他工作人员可能正在等待将你的程序部分集成到系统中进行测试。如果该程序是与客户合同的一部分，错过截止日期可能会被处以罚金。如果是为了商业销售而开发，公司可能会被竞争对手抢占市场，并被迫倒闭。\n\
  \n一旦你确定了目标，你可以做什么来满足它们呢？应该从哪里开始？软件工程师使用许多工具和技术。在本章的接几节中，我们将回顾其中一些技术，帮助你理解、设计和编写程序。\n\
  \n#### 规范：理解问题\n\n无论你使用哪种编程设计技术，第一步总是相同的。想象一下这个再熟悉不过的情况：在课程的第三天，你收到了一份 12 页的 `Programming\
  \ Assignment 1` 说明，该作业必须在从昨天起的一周后的中午之前完美运行并提交。你阅读了作业，发现这个程序比你写过的任何程序都要大三倍。你的第一步是什么？\n\
  \n这里列出的反应是计算机科学学生在这种情况下给出的典型反应：\n\n1. 恐慌 39%\n2. 坐在电脑前开始打字 30%\n3. 退门课 27%\n4. 停下来思考\
  \ 4%\n\n反应 1 是没有学习过良好编程技术的学生的意料之反应。采取反应 3 的学生会发现他们的教育进展非常缓慢。反应 2 看起来可能是一个好主意，特别是截止日期迫在眉睫。但请抵制诱惑——第一步是思考。在想出程序解决方案之前，你必须理解问题。阅读作业，然后再读一遍。向你的老师（或经理、客户）提问。早点开始可以给你提供很多提问的机会；而在程序截止前一晚才开始会让你完全没有机会。\n\
  \n先写代码的问题在于，它往往会让你陷入想到的第一个解决方案，而这可能不是最好的方法。我们有一种自然的倾向，认为一旦我们把东西写下来，我们已经在这个想法上投入了太多精力，不至于将其扔掉重新开始。\n\
  \n另一方面，不要等到截止日期前一天才纠结所有的可能性。（很有可能磁盘、网络或你的整台电脑会在那一天故障！）当你认为自己理解了问题时，就应该开始编写你的设计。\n\
  \n#### 编写详细规范\n\n许多写作者在面对空白页时会经历瞬间的恐惧——从哪里开始？然而，作为程序员，你不必苦结从哪里开始。使用作业说明（你的“需求”），首先对问题写出一个完整的定义，包括预期输入和输出的细节、必要的处理和错误处理，以及对问题的所有假设。当你完成这项任务时，你就有了一份详细的规范——你的程序必须解决的问题的正式定义，它准确地告诉程序应该做什么。此外，编写规范的过程会将需求中的任何漏洞显现出来。例如，输入中的嵌入空格是否重要，还是可以忽略？你需要检查输入中的错误吗？你的程序将在哪些计算机系统（系统）上运行？如果你在这个阶段获得了这些问题的答案，你就可以从一开始正确地设计和编写你的程序。\n\
  \n许多软件工程师通过用户/操作场景来理解需求。在软件设计中，场景是程序某一次执行时的事件序列。例如，设计师在开发银行自动取款机（ATM）的软件时，可能会考虑以下场景：\n\
  \n1. 客户插入银行卡。\n2. ATM 读取卡上的账户号。\n3. ATM 向客户请求个人识别码（`PIN`）。\n4. 客户输入 `5683`。\n5.\
  \ ATM 成功验证账户号/`PIN` 组合。\n6. ATM 要求客户选择交易类型（存款、显示余额、取款或退出）。\n7. 客户选择显示余额选项。\n8. ATM\
  \ 获取当前账户余额（`1204.35`）并显示。\n9. ATM 请求客户选择交易类型（存款、显示余额、取款或退出）。\n10. 客户选择退出。\n11. ATM\
  \ 退还客户银行卡。\n\n场景让我们对预期的行为产生感觉。当然，单个场景不能显示所有可能的行为。由于如此，软件工程师通常准备许多不同的场景，以全面理解系统的需求。\n\
  \n你必须了解某些细节才能编写和运行程序。其他细节如果没有在需求明确说明，可以根据程序员的偏好进行处理。对于未说明或模糊规范的假设应始终明确写在程序的文档中。\n\
  \n详细规范澄清了要解决的问题。但它不仅于此：它还是关于程序的重要书面文档。根据问题的性质，规范有多种表达方式，并可以包含许多不同的部分。我们推荐的程序规范包含以下部分：\n\
  \n*   处理需求\n*   带有预期输出的样本输入\n*   假设\n\n如果对异常或错误情况需要特殊处理，也应该予以规定。有时，包含一个包含用术语定义的章节将有所帮助。同样，列出任何测试需求可能会是很有用的，以便在开发过程早期就考虑验证程序。\n\
  \n\n\n\n请记住，程序的规范说明了程序必须做什么，而不是它是如何做到的。一旦你完全明确了程序的目标，就可以开始开发并记录实现这些目标的策略；换句话说，你就可以开始软件生命周期中的设计阶段了。在本节中，我们将回顾一些用于软件设计的理念工具，包括抽象、信息隐藏、逐步细化和可视化工具。\n\
  \n#### 抽象\n\n宇宙中充满了各种复杂的系统。我们通过模型来学习这些系统。模型可以是数学模型，例如描述卫星绕地球运动的方程。物理对象也是模的一种另一种形式，例如用于风洞测试的飞机模型（`model\
  \ airplane`）。在一种理解复杂系统的方法中，重要的概念是我们只考虑系统的本质特征；我们忽略次要的或无关的细节。例如，虽然地球是一个扁圆椭球，但地球仪（地球的模型）是球体。地球赤道直径与极地直径之间的微小差异，对于我们研究地球上的政治区域划分和物理地标来说并不重要。同样，用于研究空气动力学的模型飞机并不包含车载电影。\n\
  \n`abstraction`（抽象）是复杂系统的模型，仅包含本质细节。抽象是我们管理复杂性的根本方式。不同的观察者对特定系统使用不同的抽象。因此，虽然我们可能将汽车视为我们和朋友的交通工具，但汽车制动工程师可能将其视为一个与道路之间接触面积很小的巨大质量块（图\
  \ 1.2）。\n\n抽象与软件开发有什么关系？我们编写程序程序抽象。会计师使用的电子表格程序模拟了曾经用于记录借贷双方的账本。一个关于野生动物的教育计算机游戏模拟了一个生态系统。编写软件是困难的，因为我们建模的系统以及我们用于开发软件的过程都是复杂的。我们的主要目标之一是说服你使用抽象来管理软件开发的复杂性。在几乎每一章中，我们都利用抽象来简化工作。\n\
  \n![](img/f01-02.jpg)\n\n图 1.2 抽象包含了相对于观察者视角的本质细节\n\n#### 信息隐藏\n\n许多设计方法都基于将问题的解决方案分解为模块。`module`（模块）是一个高内聚的系统单元，负责执行部分工作。将系统分解为模块有助于我们管理复杂性。此外，模块可以作为独立工作于大型系统的不同编程团队的任务分配的基础。任何设计方法的一个重要特征是：程序设计中低层指定的细节对高层保持隐藏状态。程序员只看到与设计特定层级相关的细节。这种`information\
  \ hiding`（信息隐藏）使得某些细节对高层的程序员是不可见的。\n\n模块充当抽象工具。因为其内部结构的复杂性可以对系统的其他部分隐藏，实现模块涉及的细节与系统其他部分的细节保持隔离。\n\
  \n为什么隐藏细节是理想的？程序员不应该知道一切吗？不！在这种情况下，某种程度的无知确实是有益的。信息隐藏防止了设计的高层依赖于更有可能变化的低层设计细节。例如，你可以停止汽车而不需要知道它是盘式刹车还是鼓式刹车。你不需要知道汽车制动子系统的这些低层细节来让它停止。\n\
  \n此外，你不希望在设计高层例程时要求对低层例程序的复杂细节有完全理解。这种要求会给整个程序带来更大的混乱和错误风险。例如，如果我们每次想停车时都必须想：“刹车踏板是一个机械优势为\
  \ 10.6 的杠杆，连接到一个机械优势为 7.3 的液压系统，该系统将半金属闸片压在钢盘上。闸片/盘接触面的摩擦系数是……” 结果将是灾难性的。\n\n信息隐藏不仅限于驾驶汽车和编写程序。尝试列出制作一个花生酱果酱三明治所需的所有操作和信息。我们通常不把种植、生长和收获花生、葡萄和小麦的细节看作制作三明治的一部分。信息隐藏让我们只处理解决问题时在特定层级所需的操作和信息。\n\
  \n抽象和信息隐藏的概念是软件工程的基本原则。我们将在全书中反复提到它们。除了帮助我们管理大型系统的复杂性外，抽象和信息隐藏还支持了我们关于可修改性和可重用性的质量相关目标。在一个设计良好的系统中，大多数修改可以局限于少数几个模块。这种变化比渗透整个系统的变化要容易得多。此外，良好的系统设计会产生可以在其他系统中使用的通用模块。\n\
  \n为了实现这些目标，模块应该是具有强内聚性的良好抽象；也就是说，每个模块应该有一个单一的目的或身份，并且模块之间结合紧密。一个内聚的模块通常可以用一个句子描述。如果你必须使用几个句子或一个非常复杂的句子来描述你的模块，那么它可能没有内聚性。每个模块还应该表现出信息隐藏，以便其内部的变化不会导致使用它的模块发生。模块的这种独立质量被称为松耦合（loose\
  \ coupling）。如果你的模块依赖于其他模块的内部细节，它就不是松耦合的。\n\n#### 逐步细化\n\n除了抽象和信息隐藏等概念外，软件开发人员还需要实用的方法来克服复杂性。逐步细化（Stepwise\
  \ refinement）是一种广泛应用的方法。它有很多变体，例如自上而下、自下而上、功能分解，甚至是“往返完备设计”（round-trip gestalt design）。无疑你在学习过程中接触过逐步细化的变体，因为它是组织和编写文章、论文和书籍的标准方法。例如，写一本书时，作者首先确定主主题和主要子主题。接下来可以确定章节主题，然后是节和子节主题。可以为每个子节制作并进一步完善大纲。在某一点，作者准备好添加细节——即实际开始写句子。\n\
  \n通常情况下，逐步细化分阶段处理问题。每个阶段遵循类似的步骤，唯一的区别在于涉及的细节程度。每个阶段的完成都让我们更接近解决问题。让我们看看逐步细化的某些变体：\n\
  \n*   自上而下（Top-down）：通过这种方法，首先将问题分解为几个大部分。每个部分又被分为若干节，节再细分，以此类推。重要的特征是，当我们从通用方案转向具体方案时，尽可能长地推迟细节。写书的大纲方法涉及一种自上而下的逐步细化形式。\n\
  \n\n\n\n\n- **自底而上**：正如你可能猜想的，这种方法先考虑细节。自底而上的开发与自顶向下的方法相反。在识别并设计出详细组件后，将它们组合成逐渐提高层级的组件。这种技术可以用于菜谱作者，例如，他先写下所有的食谱，然后决定如何将它们组织成章节和部分。\n\
  \n- **功能分解**：这种程序设计方法鼓励按逻辑动作单元进行编程，这些单元被称为 `functions`（函数）。设计的主模块成为主程序（也称为主函数），子部分发展为\
  \ `functions`。这种任务的层级结构构成了功能分解的基础，由主程序或函数控制处理过程。`method`的通用功能不断被分为子函数，直到细节水平被认为足够细致可以编写代码。功能分解是以功能为重点的自顶向下的逐步细化。\n\
  \n- **环溯完态设计 (Round-trip gestalt design)**：这个困惑的术语用于定义格雷迪·布奇（Grady Booch）¹\n\n软件工程师使用不同类型的图表和表格，例如\
  \ `UML` 和 `CRC` 卡。`UML` 用于规范、可视化、构建和文档化软件系统的组件。它结合了过去几十年演变出来的系统建模最佳实践，特别适用于面向对象设计的建模。`UML`\
  \ 图代表了另一种形式的抽象。它们隐藏了实现细节，允许系统设计人员仅关注主要的设计组件。`UML` 包含了大量相互关联的图表类型，每种类型都有自己的图标和连接器。作为一种非常强大的开发和建模工具，它对于开发后的设计建模和文档非常有帮助。参见图\
  \ 1.3a。\n\n![](img/f01-03.jpg)\n\n图 1.3 UML 类图和 CRC 卡\n\n相比之下，`CRC` 卡是一种帮助我们确定初始设计的符号工具。`CRC`\
  \ 卡最早由 Beck 和 Cunningham 在 1989 年描述，作为一种让面向对象的程序员能够识别一组协作合作的 `classes` 来解决问题的方法。\n\
  \n程序员使用一张物理的 4 英 × 6 英的索引卡来代表每个被识别为问题解决方案部分的 `class`。图 1.3b 显示了一张空白的 `CRC` 卡。如果该\
  \ `class` 是通用的，`CRC` 卡可以有一个地方记录该 `class` 的主要职责。它始终留有关于 `class` 的以下信息空间：\n\n1. 类名\n\
  2. `class` 的职责——通常用动词表示，并由 `public functions`（在面向对象术语中称为 `methods`）实现\n3. 协作——履行职责时使用的其他\
  \ `classes` 或 `objects`\n\n`CRC` 卡是精炼面向对象设计的伟大工具，特别是在团队编程环境中。它们提供了系统构建块的物理体现，允许程序员遍历用户场景，识别并分配职责和协作。我们将在第\
  \ 3 章中讨论使用 `CRC` 卡的解决问题方法论。\n\n涵盖所有的 `UML` 超出了本文的范围。然而，我们将使用如图 1.3a 所示的 `UML` 类图来记录我们的\
  \ `classes`。我们将全程使用 `CRC` 卡作为设计工具。\n\n### 1.3 设计方法\n\n我们已经定义了 `module`（模块）的概念，描述了良好\
  \ `module` 的特征，并介绍了将逐步细化作为定义 `modules` 的策略。但这些 `modules` 应该是什么？我们如何定义它们呢？一种方法是将问题分解为功能性子问题（做这个，然后做那个，再做这个）。另一种方法是将问题分解为解决问题的交互“事物”或对象。在本节中，我们将探索这两种方法。\n\
  \n#### 自顶向下设计\n\n设计软件的一种方法是基于功能分解和自顶向下策略的。首先将问题分解为几个大任务。这些任务中的每一个又被分为若干部分，部分进一步细分，以此此类推。正如我们之前所说的，关键特征是当我们从通用解决方案转向特定解决方案时，尽可能地推迟细节。\n\
  \n要通过这种方法开发计算机程序，我们从对规格说明中定义的问题的“大局”解决方案开始。然后，我们设计一个通用的解决问题策略，将问题分解为可管理的功能性 `modules`。接下来，每个大型功能性\
  \ `modules` 都被细分为若干任务。我们不需要用源代码（如 `C++`）编写功能设计的顶层；相反，可以用英语或“伪代码”来编写。（某些软件开发项目甚至使用可以编译的特殊语言。）这种分治活动将持续进行，直到达到可以轻松转换为代码的水平。\n\
  \n一旦被分解为 `modules`，将其编码为结构良好的程序就会变得更简单。功能分解方法鼓励使用 `functions` 按逻辑单元进行编程。设计的主模块成为主程序（也称为主函数），子部分发展为函数。这种任务的层级结构构成了功能分解的基础，由主程序或函数控制处理过程。\n\
  \n作为一个例子，让我们开始制作蛋糕的功能设计。\n\n现在问题被分为五个逻辑单元，每个单元都可能被进一步分解为更详细的功能性 `modules`。图 1.4\
  \ 展示了这种功能分解的层级结构。\n\n![](img/f01-04.jpg)\n\n图 1.4 制作蛋糕的功能设计部分\n\n#### 面向对象设计\n\n\
  在面向对象设计中，第一步是识别分解中最简单且常用的对象和过程，并忠实地实现它们。一旦完成此阶段，通常就可以重用这些对象和过程来实现更复杂的对象和过程。这种对象的层级结构构成了面向对象设计的基础。\n\
  \n面向对象设计和自顶向下设计一样采用了分治方法。然而，我们不是将问题分解为功能性 `modules`，而是将其分解为解决问题背景下有意义的实体或事物。这些实体被称为\
  \ `objects`，它们协作并交互以解决问题。允许这些对象交互的代码被称为驱动程序。\n\n\n\n\n\n让我们列举一下烘焙问题中的一些对象。当然，还有各种配料：鸡蛋、牛奶、面粉、黄油等等。我们还需要某些设备，如烤盘、碗、量勺和烤箱。烘焙师是另一个重要的实体。所有这些实体都必须协作来制作一个蛋糕。例如，勺子测量单个配料，碗盛放配料的混合物。\n\
  \n具有相似属性和行为的对象组被称为对象类（通常简写为类）。世界上上的每个烤箱都是一个独特的对象。我们不能指望描述每一台烤箱，但可以将烤箱对象分组到一个名为 `oven`\
  \ 的类中，该类具有特定的属性和行为。\n\n对象类类似于 C++ 中的 `class`（请参见第 20 页关于类语法的侧边栏，以及第 2 章中的讨论）。C++\
  \ 类型是变量的模板；而类是对象的模板。正像类型一样，对象类也有与其相关的属性和操作。例如，一个烤箱类可能有一个属性来指定它是气体的还是电气的，以及用于开启、关闭或设置以保持所需温度的操作。\n\
  \n通过面向对象的设计，我们根据问题说明中描述的问题来确定类。我们使用 CRC 卡记录每个对象类。通过这项工作，我们为每个类确定了一组属性（成员变量）和一组责任（操作）。在面向对象的设计中，程序的功能分布在一组协作的对象之间。表\
  \ 1.1 展示了参与制作蛋糕的一些对象类。\n\n一旦我们定义了烤箱类，就可以在其他的烹饪问题中重用它，例如烤烤火鸡。类的重用是现代软件开发的一个重要方面。本书的的一个主要目标是向你介绍一些在软件开发中特别重要的类——抽象数据类型。我们将在第\
  \ 2 章中详细讨论抽象数据类型的概念。在整本书中，我们充分开发了许多抽象数据类型，并描述了其他类型，留给你自己开发。由于这些类是计算机科学的基石，我们通常可以从公共或私有仓库获取它们的\
  \ C++ 代码，或者从销售 C++ 组件的供应商处购买。事实上，C++ 语言标准包含了标准模板库（STL）中的组件。你可能会想，既然它们已经可用了，我们为什么还要花这么多时间进行开发呢？我们的目标是教你如何开发软件。与任何技能一样，在成为大师之前，你需要先练习基础知识。\n\
  \n### 表 1.1 参与制作蛋糕的对象类示例\n\n| 类 | 属性 | 责任（操作） |\n| --- | --- | --- |\n| `Oven` |\
  \ 能量源 | 开启 |\n| | 尺寸 | 关闭 |\n| | 温度 | 设置所需温度 |\n| | 烤架数量 | |\n| `Bowl` | 容量 | 添加\
  \ |\n| | 当前量 | 倾倒 |\n| `Egg` | 大小 | 打碎 |\n| | | 分离（蛋白与蛋黄分离） |\n\n总结来说，自顶向下的设计方法侧重于将输入转换为输出的过程，产生任务的层次结构。面向对象的设计侧重于要转换的数据对象，产生对象的层次结构。格拉迪·布奇（Grady\
  \ Booch）是这样说的：“阅读你想构建的软件说明书。如果你追求过程化代码，请划线动词；如果你目标是编写面向对象程序，请划线名词。”[²\n\n我们建议你圈出名词并划线动词。名词变成对象；动词变成操作。在功能性设计中，动词是重点；在面向对象的设计中，名词是重点。\n\
  \n### 1.4 软件的正确性验证\n\n在本章的开始，我们讨论了良好程序的某些特征。其中第一点是良好的程序是可以运行的——它完成了预期的功能。你如何知道你的程序何时达到了该目标呢？简单的答案是：测试它。\n\
  \n让我们看看测试与软件开发其余部分的关系。作为程序员，我们首先确保理解需求。然后提出一个通用的解决方案。接下来，使用良好的设计原则以计算机程序的形式设计解决方案。最后，使用良好的结构化代码，通过类、函数、自文档代码等实现解决方案。\n\
  \n一旦写完代码，我们就反复编译它，直到不再出现语法错误。然后我们使用精心挑选的测试数据运行程序。如果程序无法运行，我们就说它内部有一个“bug”（错误）。我们试图定位错误并修复它，这个过程被称为调试。注意测试和调试的区别。测试是使用设计的测试集运行程序以发现任何错误；而调试是在发现错误后将其消除。\n\
  \n调试完成后，软件将投入使用。在最终交付之前，软件有时会被安装在一个或多个客户站点，以便在真实环境中使用真实数据进行测试。在通过这一验收测试阶段后，软件就可以安装在所有客户站点。验证过程现在结束了吗？几乎没有！通常总生命周期成本和努力的一半以上发生在程序运行后的维护阶段。某些更改是为了纠正原始程序中的错误；另一些更改则是为软件系统增加了新功能。无论何种情况，修改程序后都进行测试。这一阶段被称为回归测试](#bm01.xhtml_gloss116)。\n\
  \n测试有助于发现程序中错误的存在，但它不能证明错误的不存在。我们只能确定程序在所测试的用例上是运行正确的。这种方法似乎有些随机。我们如何知道运行哪些测试或运行多少测试？一次性调试整个程序并不是容易的。而且，修复测试期间发现的错误有时是一项繁杂的任务。遗憾我们不能更早地检测到错误——例如在设计程序时。那时修复它们会容易得多。\n\
  \n我们知道通过良好的设计方法可以改进程序设计。我们能用类似的方法改进我们的程序验证活动吗？是的，可以。程序验证活动不需要在程序完全完成后才开始；它们可以从需求阶段就开始融入整个软件开发过程中。程序验证不仅仅是测试。\n\
  \n除了履行需求规格的程序验证外，软件工程师还有另一项重要任务——确保指定的需求实际上解决了底层问题。无数次程序员完成了一个大项目并交付了验证过的软件，却被告知：“嗯，那确实是我要求的，但不是我需要的。”\n\
  \n确定软件完成了其预定任务的过程被称为程序验证](#bm01.xhtml_gloss106)。程序验证问的是“我们把事情做对了吗？”；程序验证问的是“我们做的是对的事吗？”[³\n\
  \n我们真的能在程序运行之前——或在编写之前就对其“调试”吗？在本节中，我们回顾了许多与满足“高质量软件可用”这一标准相关的主题。这些主题包括\n\n*   为正确性进行设计\n\
  *   执行代码和设计评审与检查\n*   使用调试方法\n*   选择测试目标和数据\n\n\n\n\n\n*   编写测试计划\n*   结构化集成测试\n\
  \n## Bug 的起源\n\n当夏尔洛·霍尔斯去破案时，他并不是每次都从零开始；他根据经验知道许多可以帮助他找到解决方案的事物。假设霍尔斯在泥泞的田野里发现了一个受害者。他立即在泥地中寻找脚印，因为他能从脚印判断出是什么种鞋留下的。他发现的第一个脚印与受害者的鞋匹配，于是他继续寻找。现在，他发现了另一个脚印，根据他对脚印的博学知识，他判断出那是某种特定靴子留下的。他推断这种靴子由特定的劳动者穿着，并根据脚印的大小和深度推测嫌疑人的身高和体重。现在，由于对小镇劳动者的习惯有所了解，他推测下午\
  \ 6:30 可以在克兰西酒吧（Clancy’s Pub）发现该嫌疑人。\n\n在软件验证中，我们经常被要求扮演侦探。给定某些线索，我们必须找到程序中的 Bug。如果我们知道什么情况会导致程序错误，我们更有可能检测并纠正问题。我们甚至可能能够介入并完全防止许多错误，就像夏尔洛·霍尔斯有时及时干预以防止犯罪发生一样。\n\
  \n让我们来看看在程序开发和测试的不同阶段出现的某些软件错误类型，并看看如何避免它们。\n\n## 规范与设计错误\n\n如果在你准备提交一项重大期末作业之前不久，你发现教授的程序描述中的某些细节是错误的，会发生什么呢？糟糕的是，你还发现这些修正意见是在你迟到的那天的课程开始时讨论过的，而由于某种原因，直到你对课程数据集进行测试得出错误答案之前，你都完全不知道这个问题的存在。现在你该怎么办？\n\
  \n按照错误的规范编写程序可能是最糟糕的软件错误。它会有多糟糕？让我们来看一个真实故事。不久前，一家计算机公司受约要用新的硬件和软件替换某个政府机构的过时系统。根据客户提供的规范和算法，编写了一个大型且复杂的程序。新系统在开发的每一个点上都经过了检查，以确保其功能符合规范文档中的要求。当系统完成并执行新软件时，用户发现其计算结果与旧系统不匹配。对两个系统进行仔细对比后，新软件的规范是错误的，因为它们是基于旧系统不准确文档中提取的算法。新程序是“正确”的，因为它完成了指定的函数，但该程序对客户来说是没用的，因为它没有完成其预期的功能——它无法工作。纠正这些错误的成本高达数百万美元。\n\
  \n为什么纠正错误会如此昂贵？首先，大量的概念和设计工作以及编码都白费了。花费了大量时间来确定规范的哪些部分是错误的，并在程序重新设计之前纠正了这份文档。然后，大部分软件开发活动（设计、编码和测试）必须重复。这个案例是一个极端情况，但它说明了规范对于软件过程是多么关键。通常情况下，程序员在软件开发技术方面比在他们程序的“应用”领域（如银行、城市规划、卫星控制或医学研究）要更专业。因此，正确的程序规范对于程序开发的成功至关重要。\n\
  \n![](img/f0024-01.jpg)\n\n大多数研究表明，在软件交付后发现错误的修复成本，是软件生命周期早期发现问题成本的 100 倍。图 1.5\
  \ 显示了成本在软件开发后续阶段增长得有多快。纵轴表示修复错误的相对成本；这种成本可以用小时、数百美元或“程序员月”（一名程序员在一个月内能完成的工作量）为单位衡量。横轴代表软件产品的开发阶段。正如你所看到的，当你最初开始设计时只需要一个单位就能修复的错误，当产品实际运行时，可能需要\
  \ 100 个单位才能纠正！\n\n![](img/f01-05.jpg)\n\n图 1.5 此图证明了早期检测软件错误的重要性\n\n程序员（即你）与产生问题的一方（教授、经理或客户）之间的良好沟通可以防止许多规范错误。通常情况下，当你理解程序规范中的某些内容时，提问是有回报的。而且越早提问越好。\n\
  \n当你第一次阅读编程作业时，脑海中应该浮现出很多问题。哪些错误检查是必要的？解决方案中应该使用什么算法或数据结构？哪些假设是合理的？如果你在开始做作业时就能获得这些问题的答案，你就可以将它们整合到程序的设计和实现中。在程序开发的后期，这些问题的意料之外的答案可能会花费你大量的精力。简而言之，要写出一个正确的程序，你必须精确了解你的程序应该做什么。\n\
  \n有时规范会在程序的设计或实现过程中发生变化。在这种情况下，良好的设计可以帮助你确定程序的哪些部分必须重做。例如，如果一个程序定义并使用类型 `StringType`\
  \ 来实现字符串，那么更改 `StringType` 的实现不需要重写整个程序。我们应该能从设计（无论是功能性的还是面向对象的）看出冲突代码被限制在定义 `StringType`\
  \ 的模块中。程序中需要更改的部分通常从设计中比代码本身更容易找到。\n\n## 编译时错误\n\n在学习第一种编程语言的过程中，你可能犯过许多语法错误。当你尝试编译程序时，这些错误会导致错误信息（例如，“类型不匹配”、“非法赋值”、“缺少分号”等）。\n\
  \n\n\n\n\n随着你大学生涯的进步或进入职业计算工作领域，学习一种新的编程语言通常是新软件作业中最简单的部分。然而，这并不意味着该语言是最不重要的部分。在书中，我们讨论了抽象数据类型和算法，我们认为这些内容与语言无关的。也就是说，它们可以在几乎任何通用编程语言中实现。实际上，实现的成功取决于对编程语言特性的透彻理解。在一种语言中被认为是可以接受的编程实践，在另一种语言中可能是不足的，而类似的语法结构可能由于细微的差异而导致严重问题。\n\
  \n因此，对你正在编程的语言的控制结构、数据结构以及语法建立专家级的知识是值得的。\n\n总的来说，如果你对你使用的编程语言有良好的了解——并且足够仔细——你就可以避免语法错误。那些你可能会忽略的错误相对容易定位和修正。大多数错误都会由编辑器或编译器通过错误消息标记出来。一旦你完成了“干净”的编译，就可以执行你的程序。\n\
  \n### 运行时错误\n\n在程序执行过程中发生的错误通常比语法错误更难检测。某些运行时错误会停止程序的执行。当这种情况发生时，我们称程序“崩溃”（crashed）或“异常终止”（terminated\
  \ abnormally）。\n\n运行时错误通常发生在程序员做了过多假设的情况下。例如，\n\n```\nresult = dividend / divisor;\n\
  ```\n\n如果我们能假设 `divisor` 永远为 0，那么这就是一个合法的赋值语句。然而，如果 `divisor` 为 0，就会导致运行时错误。\n\n\
  有时，运行时错误是因为程序员没有完全理解编程语言。例如，在 `C++` 中，赋值运算符是 `=`，而等性测试运算符是 `==`。因为它们看起来非常相似，经常会被误写。你可能认为这会是一个编译器捕获的语法错误，但它实际上是一个逻辑错误。从技术上说，`C++`\
  \ 中的赋值由一个包含部分的表达式组成：赋值运算符（`=`）右侧的表达式被求值，结果被返回并存储在左侧命名的位置。这里的关键词是“返回”；右侧求值的结果就是表达式的结果。因此，如果将赋值运算符误写为等性测试运算符，或者反之亦然，代码的执行将产生令人惊讶的结果。\n\
  \n让我们来看一个例子。考虑以下两个语句：\n\n```\ncount == count + 1;\n\nif (count = 10)\n\n.\n\n.\n\
  \n.\n```\n\n第一条语句返回假；`count` 永远不会等于 `count + 1`。分号结束了语句，所以返回的值没有发生任何变化；`count` 没有发生改变。在下一个语句中，表达式\
  \ `(count = 10)` 被求值，`10` 返回并存储在 `count` 中。因为返回了一个非零值（`10`），所以 if 表达式始终求值为真。\n\n\
  运行时错误还会由于不可预料的用户错误而发生。例如，如果 `newValue` 被声明为 `int` 类型，语句\n\n```\ncin >> newValue;\n\
  ```\n\n如果用户输入非数字字符，该语句会导致流失败。无效的文件名也会导致流失败。在某些语言中，系统会报告运行时错误并停止。在 `C++` 中，程序不会停止；程序只是会带有错误数据继续运行。\n\
  \n良好的程序不应该意外停止（崩溃）或带有错误数据继续运行。它们应该捕获此类错误并保持控制，直到用户准备好退出。\n\n程序在发生错误时恢复的能力被称为健壮性。如果一个商业程序是不健壮的，人们就不会购买它。谁想要一个在磁盘空间不足、用户说“保存”时就崩溃的文字处理器呢？我们希望程序告诉我们：“删除磁盘上的其他文件以腾出空间，然后重试。”对于某些类型的软件，健壮性是一项关键需求。飞机的自动驾驶系统或重监护室的患者监测程序无法承受直接崩溃。在这种情况下，采取防御姿态会产生良好的结果。\n\
  \n总的来说，你应该主动检查产生错误的条件，而不是让它们终止你的程序。例如，对输入的正确性（尤其是来自键盘的输入）做出过多假设通常是不明智的。更好的方法是显式检查此类输入的正确类型和边界。程序员随后可以决定如何处理错误（请求新输入、显示消息或继续处理下一个数据），而不是将决定交给系统。即使是退出的决定也应该由控制自身执行的程序来做出。如果情况变得糟糕，让你的程序优雅地退出。\n\
  \n当然，程序输入的所有内容并不都必须检查错误。有时输入被认为是是正确的——例如来自已验证过的文件的输入。包含错误检查的决定必须基于程序的需求。\n\n某些运行时错误不会停止执行，但会产生错误的结果。你可能错误地实现了算法，或者在变量被赋值之前就使用了它。你可能在无意中交换了函数调用中两个相同类型的参数，或者忘记将函数的输出数据指定为引用参数。（参见参数传递。这些“逻辑”错误最难防止和定位。稍后我们将讨论调试技术以帮助确定运行时错误。我们还将讨论隔离被测试程序部分的结构化测试方法。但既然知道越早发现错误修复就越容易，我们现在转向在运行之前捕捉运行时错误的方法。\n\
  \n### 为了正确性进行设计\n\n如果某种工具可以在不运行程序的情况下定位我们设计或代码中的错误，那就太好了。这听起来可能不可能，但考虑一个几何学中的类比。我们不会通过证明在每个三角形中都有效来证明勾股定理；那样的结果只能证明该定理在我们过的每个三角形中有效。我们在几何学中证明定理。为什么我们不能对计算机程序这样做呢？\n\
  \n独立于数据测试的程序正确验证是理论计算机科学研究的一个领域。此类研究寻求建立一种类似于几何学定理证明方法的程序证明方法。必要的技术已经存在，但证明往往比程序本身复杂。因此，验证研究的一个主要焦点是尝试构建自动程序证明器——验证其他程序的验证程序。在此期间，形式化验证技术可以手工完成。\n\
  \n#### 断言\n\n断言](#bm01.xhtml_gloss009)是一个可以为真为假的逻辑命题。我们可以对程序的状态做出断言。例如，对于赋值语句\n\n\
  ```\nsum = part + 1 ;    // sum 和 part 是整数。\n```\n\n我们可能会断言：“`sum` 的值大于 `part` 的值。”这个断言本身可能并不十分有用或有趣，但让我们看看可以用它做什么。我们可以通过逻辑论证来证明这个断言是真实的：无论\
  \ `part` 的值是多少（负数、零或正数），增加 1 后，结果都是更大的值。现在注意我们没有做什么。我们没有需要运行包含此赋值语句的程序来验证该断言是正确的。\n\
  \n\n\n\n形式化程序验证的核心概念是：我们可以根据程序的规范，对程序意图的功能做出断言（assertions），然后通过逻辑论证（而不是通过执行程序）来证明某个设计或实现了这些断言。因此，这一过程可以分为两个步骤：\n\
  \n1. 正确地断言待验证程序部分的预期意图功能。\n2. 证明实际的设计或实现确实实现了所断言的功能。\n\n第一步，即做出断言，听起来似乎在我们设计正确程序的过程中可能很有用。毕竟，我们已经知道，除非知道程序应该做什么，否则我们就无法写出正确的程序。\n\
  \n## 前置条件与后置条件 (Preconditions and Postconditions)\n\n让我们在设计过程中将这种断言的思想进一步深一层。假设我们想要设计一个模块（程序的逻辑分块）来执行特定操作。为了确保该模块能够融入整个程序，我们必须明确其边界处发生的情况——即在进入模块时必须满足什么，以及退出模块时必须满足什么。\n\
  \n为了使任务更具体，请将设计模块想象成最终代码的形式，即程序内部被调用的函数。要调用该函数，我们必须知道其确切的接口：名称和参数列表，这指示了它的输入和输出。但这些信息是不够的：我们还必须知道为了操作正常运行必须满足的任何假设。我们将进入函数时必须满足的断言称为`前置条件`。前置条件的作用就像产品免责声明：\n\
  \n![](img/f0032-01.jpg)\n\n例如，当我们说执行以下代码后：\n\n```\nsum = part + 1;\n```\n\n我们可以断言\
  \ `sum` 大于 `part`，我们做了一个假设——一个前置条件——即 `part` 不等于 `INT_MAX`。如果这个前置条件被违反，我们的断言将不再成立。\n\
  \n我们还必须知道操作完成后哪些条件是成立的。`后置条件` 是描述操作结果的断言。后置条件并没有告诉我们是如何实现这些结果的；相反，它们只是告诉我们结果应该是什么。\n\
  \n让我们考虑一个简单操作的前置和后置条件，该操作是删除列表的最后一个元素并将其值作为输出返回。（我们在这里从直觉上使用“列表”一词；我们在第 3 章中对其进行了正式定义。）`GetLast`\
  \ 的规范如下：\n\n这些前置条件和后置条件与程序验证有什么关系？通过对模块间接口的预期做出显式断言，我们可以避免因误解而产生逻辑错误。例如，从前置条件中我们知道，必须在该操作外部检查空状态；该模块假设列表中至少存在一个元素。后置条件告诉我们，当获取列表最后一个元素的值时，该元素会被从列表中删除。这一事实对于列表用户来说是至关重要的信息。如果我们只是想看一眼最后一个值而不影响列表，就不能使用\
  \ `GetLast`。\n\n经验丰富的软件开发者知道，对他人模块接口的误解是程序问题的主要来源之一。我们在书中的模块或函数层级使用前置条件和后置条件，是因为它们提供的信息能帮助我们以真正的模块化方式设计程序。然后，我们就可以放心地在程序中使用设计好的模块，而不担心因为对假设以及模块实际功能的判断失误而引入错误。\n\
  \n## 设计评审活动 (Design Review Activities)\n\n当一个程序员在设计和实现程序时，他或她可以用纸笔发现许多软件错误。`纸上检查`设计方案是手动验证程序的一种非常常见的方法。程序员写下关键数据（变量、输入值、子程序参数等），并演练设计，在纸上标记数据的变化。设计或代码中已知的问题点应该双重检查。典型错误清单（例如不终止的循环、在初始化之前使用的变量、以及函数调用中参数顺序错误）可以使纸上检查更有效。一个\
  \ C++ 程序的纸上检查示例出现在图 1.6 中。\n\n你曾在尝试调试程序时真的卡住了，结果把程序展示给同学或同事看，他们立刻发现了 bug？通常人们认为，其他人比原作者更容易发现程序中的错误。作为纸上检查的扩展，两个程序员可以交换代码列表并互相检查程序。然而，大学往往往往不鼓励学生检查彼此的程序，担心这种交换会导致作弊。因此，许多学生在编写程序方面变得富有经验，但没有机会练习阅读程序。\n\
  \n### 设计 (The Design)\n\n1. 设计中的每个模块是否有清晰的功能或目的？\n2. 大型模块可以拆分成更小的部分吗？（一个常用的经验法是\
  \ C++ 函数应该适合一页纸。）\n3. 所有假设是否都有效？它们是否有良好的文档记录？\n4. 前置条件和后置条件是否是对它们所指定的模块中应该发生的情况的准确断言？\n\
  5. 根据程序规范衡量，设计是否正确且完整？是否存在遗漏的情况？是否存在错误的逻辑？\n6. 程序设计是否考虑了可理解性和可维护性？\n\n### 代码 (The\
  \ Code)\n\n7. 设计是否已在编程语言中清晰正确地实现？编程语言特性使用是否恰当？\n8. 函数的所有输出参数是否都已赋值？\n9. 返回值的参数是否标记为引用参数（如果参数不是数组，则在类型右侧加上\
  \ `&`）？\n10. 代码是否与设计所示接口一致？\n11. 函数调用中的实际参数是否与函数声明和定义中的参数一致？\n12. 每个需要初始化的数据对象是否在正确的时间正确设置？每个数据对象在使用之前是否已设置？\n\
  13. 所有循环是否都能终止？\n14. 设计是否消除了“魔数”？（魔数是指其含义对读者而言并非显而易见的数字。）\n15. 每个常量、类型、变量和函数是否有意义的名字？声明处是否有注释以澄清数据对象的使用？\n\
  \n图 1.6 C++ 程序的纸上检查清单\n\n大多数大型程序由团队开发。纸上检查的两种被编程团队有效使用的扩展是设计或代码的`走演``和`审查``。这些正式团队活动的意图是将发现\
  \ bug 的责任从个人程序员转移给小组。由于测试非常耗时，且错误越晚发现成本越高，因此目标是在测试开始之前识别错误。\n\n\n\n在评审（inspection）过程中，由一名读者（而非程序的作者）逐行审阅设计或代码。评审参与者指出错误，这些错误会被记录在评审报告中。某些错误仅通过大声朗读的过程就能发现。另一些错误可能团队成员在评审前的准备阶段已经注意到。与走检（walk-through）一样，团队会议的主要优点是团队成员之间进行的讨论。程序员、测试人员和其他团队成员之间的这种互动可以在测试阶段开始很久以前发现许多程序错误。\n\
  \n在上级设计阶段，应将设计与程序需求进行比较，以确保已包含所有所需功能，并确保该程序或模块能够正确地与系统的其他软件进行“接口交互”。在低级设计阶段，当设计中填充了更多细节后，在实现之前应对其进行重新评审。编码完成后，应再次对编译后的列表进行检查。这种评审（或走检）确保了实现与需求和设计保持一致。成功完成此评审意味着程序的测试可以开始了。\n\
  \n30 多年来，卡内基基卡梅隆大学的软件工程学院（SEI）在支持大型软件项目评审过程形式化研究方面发挥了重要作用，包括赞助研讨会和会议。在 SEI 软件工程过程小组（SEPG）会议上发表的一篇报告提到一个项目通过使用小组走检和正式评审的双层评审过程，将产品缺陷减少了\
  \ 86.6%。该过程被应用于生命周期每个阶段的各种包、设计包或代码包。表 1.2 显示了在一个维护项目中，软件生命周期各个阶段发现的每 1000 行源代码（KSLOC）缺陷数量。该项目为一个拥有\
  \ 50 万行代码的软件程序增加了 4 万行源代码。除了测试活动外，该项目在所有阶段都使用了正式评审过程。\n\n| 阶段 | KSLOC |\n| --- |\
  \ --- |\n| 系统设计 | 2 |\n| 软件需求 | 8 |\n| 设计 | 12 |\n| 代码评审 | 34 |\n| 测试活动 | 3 |\n\n\
  表 1.2 不同阶段发现的缺陷*Dennis Beeson，海军航空战术中心武器部 F-18 软件开发团队经理。\n\n这些设计评审活动应尽可能以非威胁性的方式进行。目标不是批评设计或设计者，而是消除产品中的缺陷。有时很难从这一过程中消除人类天生的自豪情感，但最好的团队会采用“无自我中心编程”的策略。\n\
  \n异常结束介绍这些语句。\n\n#### 程序测试\n\n最终，在完成所有设计验证、手工检查（deskchecking）和评审后，是执行代码的时候了。最后，我们准备好开始测试，旨在发现可能仍然存在的任何错误。\n\
  \n测试过程由一组测试用例组成。我们说“断言”（assert）而不是“证明”，因为测试并没有提供程序正确性的证明。\n\n每个测试用例的目标是验证特定功能。例如，我们可能会设计多个测试用例来证明程序能够正确处理各种输入错误。或者，我们可能会设计用例来检查数据结构（如数组）为空或包含最大数量元素时的处理情况。\n\
  \n在每个测试用例内部，我们执行一系列组件任务：\n\n*   确定演示测试用例目标的输入。\n*   确定程序给定输入的预期行为（此任务通常是最困难的。对于数学函数，我们可能会使用数值表或计算器来计算预期结果。对于具有复杂处理的函数，我们可能会使用模拟或相同问题的替代方案。）\n\
  *   运行程序并观察产生的结果。\n*   比较预期行为和程序的实际行为。如果匹配，则测试用例成功。如果不匹配，则存在错误。在后者的情况下，我们开始调试。\n\
  \n目前我们讨论的是模块或函数层面的测试用例。逐个测试和调试程序模块比尝试一次性让整个程序方案工作要容易得多。这种层面的测试被称为单元测试。\n\n#####\
  \ 数据覆盖率\n\n\n\n\n\n在那些少数的、有效输入集（或功能域）极小的特殊情况下，我们可以通过对每一个可能的输入元素进行测试来验证子程序。\n\n这种方法被称为“穷举式”测试，可以确定性地证明软件符合其规范。例如，以下函数的功能域由\
  \ `true` 和 `false` 两个值组成：\n\n```\nvoid PrintBoolean(bool error)\n\n// 在屏幕上打印布尔值。\n\
  \n{\n  if (error)\n    cout << \"true\";\n  else\n    cout << \"false\";\n\n  cout\
  \ << endl;\n}\n```\n\n对此函数应用穷举式测试是有意义的，因为只有两个可能的输入值。然而，在大多数情况下，功能域是非常巨大的，因此穷举式测试几乎总是不可或无法实现的。以下函数的功能域是什么？\n\
  \n```\nvoid PrintInteger(int intValue)\n\n// 在屏幕上打印整数值 intValue。\n\n{\n  cout <<\
  \ intValue;\n}\n```\n\n通过运行每种可能的数据输入来测试这个函数是不现实的；因为 `int` 取值集合中的元素数量显然太大了。在这种情况下，我们不尝试穷举式测试，而是选择其他衡量标准作为测试目标。\n\
  \n你可以尝试以随意的方式进行程序测试，随机输入数据直到导致程序失败。猜测并无害（除了可能会浪费时间之外），但它可能无法产生太大帮助。这种方法可能会发现程序中的某些错误，但极不可能找到所有错误。幸运的是，人们已经开发出了以系统化方式检测错误的策略。\n\
  \n一种以目标为导向的方法是覆盖通用数据类别。你应该对每一类别的输入至少测试一个示例，以及边界情况和其他特例用例。例如，在 `PrintInteger` 函数中，有三类基本的\
  \ `int` 数据：负值、零和正值。你应该计划三个测试用例，每个类一个。当然，你也可以尝试比三个更多的测试。例如，你可能想尝试 `INT_MAX` 和 `INT_MIN`；然而，由于程序仅仅是打印输入的值，这些额外的测试用例并不起太大作用。\n\
  \n![](img/f01-07.jpg)\n\n图 1.7 测试方法\n\n其他其他数据覆盖方法。例如，如果输入由命令组成，你必须测试每条命令。如果输入是一个包含可变数量值的固定大小数组，你应该测试最大数量的值——即边界条件。尝试一个没有存储任何值的数组或一个只包含单个元素的数组也是一个好主意。基于数据覆盖的测试被称为黑盒测试。测试人员必须了解模块的外部接口——其输入和预期输出——但不需要考虑模块内部正在发生什么（黑盒内部）。（参见图\
  \ 1.7。）\n\n### 代码覆盖\n\n许多测试策略基于代码覆盖的概念，即程序中语句或语句组的执行。这种测试方法被称为透明-（clear-（或白- 盒测试）。测试人员必须查看模块内部（通过透明盒）以看到正在被测试的代码。\n\
  \n一种被称为语句覆盖的方法要求程序中的每条语句至少执行一次。另一种方法要求测试用例能够导致程序中的每个分支或代码段被执行。单个测试用例就可以实现 if-then\
  \ 语句的语句覆盖，但需要两个测试用例来测试该语句的两个分支。\n\n类似的代码覆盖目标是测试程序路径。路径是程序执行时可能经过的分支组合。在路径测试中，我们\
  \ 尝试在不同的测试用例中执行所有可能的程序路径。\n\n代码覆盖方法类似于森林护林员在徒步季节开始之前检查森林小径的方式。如果护林员想确保所有小径都有清晰的标记且没有被倒木阻挡，他们将检查小径的每个分支（参见图\
  \ 1.8a）。或者，如果他们想根据从起点到终点的长度和难度对各种路径（可能是交织的）进行分类，他们将使用路径测试（参见图 1.8b）。\n\n为了创建基于代码覆盖目标的测试用例，我们选择驱动执行进入各种程序路径的输入。我们如何判断一个分支或路径是否被执行了？跟踪执行的一种方法是在每个分支的开头放置调试输出语句，指示进入了这个特定的分支。软件项目通常使用工具来帮助程序员自动跟踪程序执行。\n\
  \n这些策略适用于测试过程的衡量。例如，我们可以统计程序中的路径数量，并跟踪在测试用例中覆盖了多少条路径。这些数字提供了关于当前测试状态的统计数据；例如，我们可以说程序\
  \ 75% 的分支已经执行，或者 50% 的路径已经过过测试。当一个程序员编写一个程序时，这些数字可能是多余的。但在有许多程序员的软件开发环境中，此类统计数据对于跟踪进度非常有用。\n\
  \n![](img/f01-08a.jpg)\n\n图 1.8a 检查分支\n\n![](img/f01-08b.jpg)\n\n图 1.8b 检查路径\n\n\
  这些衡量结果还可以指示何时完成了特定水平的测试。实现 100% 的路径覆盖通常不是可行的目标。软件项目可能会设定一个较低的标准（例如 80% 的分支覆盖），要求程序员在将模块交给项目测试团队之前达到该标准。基于可衡量因素的测试被称为基于指标的测试。\n\
  \n#### 测试计划\n\n确定测试方法的目标——数据覆盖、代码覆盖或（通常是）两者的混合——是在开发测试计划之前。某些测试计划非常非正式——目标以及一份手写在纸上的测试用例列表。即使是这种类型的测试计划也可能比你在课程作业中被要求的多。实施测试计划涉及使用计划中列出的输入值运行程序并观察结果。如果答案错误，则对程序进行调试并重新运行，直到观察到的输出与预期输出匹配。当计划列出的所有测试用例都给出所需的输出时，过程完成。\n\
  \n让我们为一个名为 `Divide` 的函数开发测试计划，该函数是根据以下规范编写的：\n\n对于此测试计划，我们应该使用代码覆盖还是数据覆盖？由于代码如此简单直接，让我们从代码覆盖开始。代码覆盖测试计划基于对代码本身的检查。以下是待测试的代码：\n\
  \n```\nvoid Divide(int dividend, int divisor, bool& error, float& result)\n\n//\
  \ 设置 error 以指示除数是否为零。\n// 如果没有错误，将 result 设置为 dividend 除以 divisor。\n\n{\n  if (divisor\
  \ = 0)\n    error = true;\n  else\n    result = float(dividend) / float(divisor);\n\
  }\n```\n\n\n\n\n\n该代码包含一个带有两个分支的 `if` 语句；因此，我们可以进行全路径测试。存在一种 `divisor` 为 0 并进入真分支的情况，以及\
  \ `divisor` 不为 0 并进入 `else` 分支的情况。\n\n| 测试用例原因 | 输入值 | 预期输出 |\n| --- | --- | ---\
  \ |\n| `divisor` 为 0（`dividend` 为任意值） | `divisor` 为 0 `dividend` 为 8 | `error` 为\
  \ true `result` 未定义 |\n| `divisor` 不为 0（`dividend` 为任意值） | `divisor` 为 2 `dividend`\
  \ 为 8 | `error` 为 false `result` 为 4.0 |\n\n为了实施此测试计划，我们使用列出的输入值运行程序，并将结果与预期输出进行比较。该函数由测试驱动程序\
  \ 调用，测试驱动程序负责设置参数值并调用被测试的函数。下面列出了简单的测试驱动程序。它设计用于执行两个测试用例：它为测试 1 分配参数值，调用 `Divide()`\
  \ 并打印结果；然后它用新的测试输入重复该过程进行测试 2。我们运行测试并将测试驱动程序输出的值与预期值进行比较。\n\n```\n#include <iostream>\n\
  \nvoid Divide(int, int, bool&, float&);\n\n// 被测试的函数。\n\nvoid Print(int, int, bool,\
  \ float);\n\n// 打印测试用例的结果。\n\nint main()\n{\n\n using namespace std;\n\n bool error;\n\
  \n float result;\n\n int dividend = 8;                                         \
  \                    // 测试 1\n int divisor = 0;\n\n Divide(dividend, divisor, error,\
  \ result);\n\n cout << \"Test 1: \" << endl;\n\n Print(dividend, divisor, error,\
  \ result);\n\n divisor = 2;                                                    \
  \              // 测试 2\n\n Divide(dividend, divisor, error, result);\n\n cout <<\
  \ \"Test 2: \" << endl;\n\n Print(dividend, divisor, error, result);\n\n return\
  \ 0;\n\n}\n```\n\n对于测试 1，`error` 的预期值是 `true`，`result` 的预期值未定义，但除法运算仍然执行了！当 `divisor`\
  \ 为 0 时，这怎么可能呢？如果 `if` 语句的结果不符合预期，首先要检查的是关系运算符：我们是否使用了单等 `=` 而不是 `==`？是的，我们确实这么用了。在修复此错误后，我们再次运行程序。\n\
  \n对于测试 2，`error` 的预期值是 `false`，但打印出的值却是 `true`！我们的测试发现了另一个错误，因此我们开始调试。我们发现，测试 1\
  \ 中被设为 `true` 的 `error` 值在测试 2 中从未被重置为 `false`。我们将此函数的最终正确版本的开发留给读者作为练习。\n\n现在，让我们为同一个函数设计一个数据覆盖测试计划。在数据覆盖计划中，我们对函数的内部工作一无所知；我们只知道在函数标题文档中表示的接口。\n\
  \n```\nvoid Divide(int dividend, int divisor, bool& error, float& result)\n// 设置\
  \ error 以指示 divisor 是否为零。\n\n// 如果没有错误，将 result 设置为 dividend / divisor。\n```\n\n\
  这里有两个输入参数，类型均为 `int`。一个完整的数据覆盖计划将要求我们为每个参数使用 `int` 类型的所有可能值来调用函数——这显然是过度了。接口告诉我们，如果\
  \ `divisor` 为 0 会发生一种情况，如果 `divisor` 不为 0 则会发生另一种情况。显然，我们至少要有两个用例：一个 `divisor` 为\
  \ 0，另一个 `divisor` 不为 0。当 `divisor` 为 0 时，`error` 被设置为 `true` 且不发生其他情况，因此一个测试用例应该验证这一结果。当\
  \ `divisor` 不为 0 时，会进行除法。需要多少个测试用例才能验证除法是正确的？边界情况有哪些？共有五种可能：\n\n* `divisor` 和 `dividend`\
  \ 均为正数\n* `divisor` 和 `dividend` 均为负数\n* `divisor` 为正数且 `dividend` 为负数\n* `divisor`\
  \ 为负数且 `dividend` 为正数\n* `dividend` 为 0\n\n完整的测试计划所示。\n\n在这种情况下，数据覆盖测试计划比代码覆盖计划更复杂：有七种情况（其中两个是组合的），而不是只有两个。一个用例涵盖了除数为零的情况，另外六个用例检查在除数不为零且符号异异时除法是否正常工作。如果我们知道函数使用了内置的除法运算符，我们就不需要检查这些情况了——但我们不知道。通过数据覆盖计划，我们无法看到函数体。\n\
  \n| 测试用例原因 | 输入值 | 预期输出 |\n| --- | --- | --- |\n| `divisor` 为 0（`dividend` 为任意值）\
  \ | `divisor` 为 0 `dividend` 为 8 | `error` 为 true `result` 未定义 |\n| `divisor` 不为\
  \ 0（`dividend` 为任意值）组合 `divisor` 为正数 `dividend` 为正数 | `divisor` 为 2 `dividend` 为\
  \ 8 | `error` 为 false `result` 为 4.0 |\n| `divisor` 不为 0 `divisor` 为负数 `dividend`\
  \ 为负数 | `divisor` 为 2 `dividend` 为 8 | `error` 为 false `result` 为 4.0 |\n| `divisor`\
  \ 不为 0 `divisor` 为正数 `dividend` 为负数 | `divisor` 为 2 `dividend` 为 8 | `error` 为 false\
  \ `result` 为 4.0 |\n| `divisor` 不为 0 `divisor` 为负数 `dividend` 为正数 | `divisor` 为\
  \ 2 `dividend` 为 8 | `error` 为 false `result` 为 4.0 |\n| `dividend` 为 0（`divisor`\
  \ 为任意值） | `divisor` 为 0 `dividend` 为 8 | `error` 为 true `result` 未定义 |\n\n为了使程序测试有效，必须进行计划。你必须以组织化的方式设计测试并将你的设计写成文档。你应该在测试开始之前确定所需的或所需的测试水平，并规划策略和测试用例。事实上，在编写代码代码之前就应该开始计划测试。\n\
  \n### 调试计划\n\n在上节中，我们讨论了检查测试输出并在发现错误时进行调试。我们可以在出现问题时通过添加输出语句进行“现场”调试。但为了尽早预测并防止问题，我们是否可以在运行程序之前就对调试进行计划？\n\
  \n到目前你应该知道答案是肯定的。在编写设计时，你应该识别潜在的问题点。然后你可以在可能发生错误的地方插入临时的调试输出语句。例如，为了跟踪程序通过复杂的函数调用序列的执行情况，你可能会添加指示进入和离开每个函数的输出语句。如果调试输出还能指示关键变量的值（特别是函数的参数），将更加有用。下面的示例显示了在\
  \ `Divide()` 函数开始和结束时执行的一系列调试语句：\n\n```\nvoid Divide(int dividend, int divisor,\
  \ bool& error, float& result)\n// 设置 error 以指示 divisor 是否为零。\n\n// 如果没有错误，将 result\
  \ 设置为 dividend / divisor。\n\n{\n\n using namespace std;\n\n // 调试\n cout << \"Function\
  \ Divide entered.\" << endl;\n cout << \"Dividend = \" << dividend << endl;\n cout\
  \ << \"Divisor = \" << divisor << endl;\n\n //*************************\n // 剩余代码在此处。\n\
  \n //*************************\n\n // 调试\n if (error)\n   cout << \"Error = true\
  \ \";\n else\n   cout << \"Error = false \";\n\n cout << \"and Result = \" << result\
  \ << endl;\n cout << \"Function Divide terminated.\" << endl;\n\n}\n```\n\n\n\n\n\
  \n如果在运行程序之前，手动测试没有发现所有错误，那么放置恰当的调试语句至少可以帮助你在执行期间定位剩余的错误。请注意，这些输出仅用于调试；这些输出行旨在仅供测试人员查看，而不是供程序的用户查看。当然，如果调试输出与应用程序的真实输出混合在一起会非常令人困扰，而且如果调试输出没有收集在一个地方，调试起来也会变得很困难。将调试输出与“真实”程序输出分离的一种方法是声明一个单独的文件来接收这些调试语句，如下如下例所示：\n\
  \n```cpp\n#include <fstream>\n\nstd::ofstream debugFile;\n\ndebugFile << \"This\
  \ is the debug output from Test 1.\" << endl;\n```\n\n通常，在程序交付给客户或交给教授之前，会从程序中移除调试语句或对其进行“注释掉”。（“注释掉”意味着通过在语句前加上\
  \ `//` 或将其封装在 `/*` 和 `*/` 之间将语句转换为注释。）将调试语句转换为注释的优点是，你可以方便且有选择地为随后的测试重新开启它们。但这种技术的缺点是，需要对整个程序进行编辑，才能从测试模式（带调试）切换到运行模式（无调试）。\n\
  \n另一种流行的技术是让调试输出语句依赖于布尔标志（Boolean flag），可以根据需要开启或关闭。例如，对于一段已知的容易出错的代码，可以使用布尔值 `debugFlag`\
  \ 在多个处标记以进行跟踪输出：\n\n```cpp\n// 设置 debugFlag 以控制调试模式。\n\nconst bool debugFlag = true;\n\
  \nif (debugFlag)\n  debugFile << \"Function Divide entered.\" << endl;\n```\n\n\
  该标志可以根据程序员的需要通过赋值来开启或关闭。切换到运行模式（无调试输出）仅需将 `debugFlag` 重新定义为 `false` 然后重新编译程序。如果使用了标志，调试语句可以保留在程序中；在程序的运行运行中，仅会执行\
  \ `if` 检查。这种技术的缺点是调试代码始终存在，导致编译后的程序体积更大。如果存在大量的调试语句，它们可能会浪费大型程序中所需的空间。调试语句还会弄乱程序，使其变得更难以阅读。（这种情况情况说明了我们在开发软件时面临的另一个权衡。）\n\
  \n某些系统拥有在线调试程序，可以提供跟踪输出，从而使得调试过程变得简单得多。如果你正在使用的系统具有运行时调试器，请使用它！任何能让任务变得简单的工具都应该欢迎，但请记住没有任何工具可以替代思考。\n\
  \n**关于调试的警告：** 警惕快速修复！程序错误往往成群出现，因此当你发现一个错误时，不要太急于修复它并再次运行程序。通常情况下，修复一个错误会产生另一个。对程序错误原因的浅层推测通常无法产生完整的解决方案。通常，花时间考虑你所做的更改产生的所有影响是非常值得的。\n\
  \n如果你不断需要调试，说明你的设计过程存在缺陷。考虑你所做的设计产生的所有影响是最价值的时间。\n\n## 集成测试\n\n在最后两个节中，我们讨论了单元测试和计划调试。在本节中，我们将探索许多概念和工具，它们可以帮助将各个单元的测试用例结合起来，对整个程序进行结构化测试。这种测试的目标是整合单独测试的部分，因此它被称为集成测试。\n\
  \n你可以使用与自顶向下程序设计方法非常相似的方法，以结构化的方式测试大型复杂的程序。核心思想是分而治之：独立地测试程序部分，然后将已验证的部分作为下一次测试的基础。测试可以使用自顶向下或自底向上的方法，也可以两者的结合。\n\
  \n使用自顶向下的方法，我们从顶层开始测试。测试的目的是确保整体逻辑设计有效，并且模块之间的接口是正确的。在测试的每个层级，自顶向下的方法都基于低层工作正常的假设。我们通过将低层子程序替换为称为\
  \ `stubs`（存根）的“占位”模块来实现这一假设。存根可能由单个跟踪输出语句组成（指示我们已到达该函数），或一组调试输出语句组成（显示参数的当前值）。如果调用函数（即被测试的函数）需要值，存根也可以为输出参数赋值。\n\
  \n另一种测试方法是从底向上进行测试。通过这种方法，我们首先对最底层的子程序进行单元测试。自底向上的方法在测试和调试关键模块时非常有用，即该模块的错误会对其他模块产生重大影响。“工具”子程序（例如数学函数）也可以用测试驱动程序（test\
  \ drivers）进行测试，而与最终调用它们的程序分离。此外，自底向上的集成测试方法在小组编程环境中可能是有效的，在那种环境中，每个程序员编写并测试独立的模块。程序较小的、已测试的部分随后会在整个程序的测试中被一起验证。\n\
  \n### 测试 C++ 数据结构\n\n本书的主要议题是数据结构：它们是什么，我们如何使用它们，以及如何使用 C++ 实现它们。本章提供了软件工程的概述；在第\
  \ 2 章中，我们开始关注数据以及结构化数据的方法。通过查看我们如何测试在 C++ 中实现的数据结构来结束关于验证的章节似乎是合适的。\n\n在整本书中，我们使用\
  \ C++ 类来实现数据结构，以便许多不同的程序可以使用生成的结构。当我们首次创建一个建模数据结构的类时，并不一定有任何应用程序可以使用它。我们需要先对类本身进行测试，然后再创建应用程序。由于由于原因，我们使用了利用测试驱动程序的自底向上测试方法。\n\
  \n我们实现的每个数据结构支持一组操作。对于每种结构，我们都希望创建一个测试驱动程序，允许以各种顺序测试这些操作。我们如何编写一个测试驱动程序来测试多种操作序列？解决方案是将想要测试的特定操作集与测试驱动程序本身分离。我们将操作和必要的参数列在文本文件中。测试驱动程序逐行从文本文件中读取操作，通过调用被测试数据结构的成员函数执行指定的操作，并将结果报告到输出文件中。测试程序也会在屏幕上报告其总体结果。\n\
  \n这里描述的测试方法允许我们轻松更改测试用例——只需更改输入文件的内容。如果我们能够在运行程序时动态更改输入文件的文件名，测试将变得更加容易。这样我们需要时就可以运行另一个测试用例或重新运行之前的测试用例。因此，我们构建测试驱动程序从控制台读取输入文件名；对输出文件也是如此。\n\
  \n\n\n\n\n我们的测试驱动程序（test drivers）都遵循相同的基本算法。首先，我们提示并读取文件名，并为输入输出准备文件。接下来，从输入文件中读取要执行的函数名。由于函数名驱动了控制流，我们将其命名为\
  \ `command`。只要 `command` 不为“quit”，我们就执行该名称的函数，打印结果，并读取下一个函数名。然后，我们关闭文件并退出。我们遗漏了什么吗？输出文件应该有某种标签。让我们提示用户为输出文件输入标签。我们还应该通过跟踪命令数量和打印结束消息来让用户了解当前进度。以下是我们的测试驱动程序程序的算法：\n\
  \n![](img/f01-09.jpg)\n\n图 1.9 测试架构模型\n\n当我们在测试数据结构时，这种算法能让我们在投入最少的情况下（最少的额外工作）获得最大的灵活性。一旦我们通过为特定数据结构创建测试驱动程序来实现该算法，我们只需更改循环中的前两个步骤，就可以轻松地为不同的数据结构创建测试驱动程序。这里是测试驱动程序的代码，其中预留了待填充的特定数据结构代码。我们在案例研究中演示了如何编写这些代码。必须填充的语句已被阴影标记。\n\
  \n![](img/f0050-01.jpg)\n\n注意，测试驱动程序获取测试数据并调用待测试的成员函数。它还提供了关于成员函数调用效果的文字输出，以便测试人员可以目视检查结果。有时，测试驱动程序用于测试成百上千个测试用例。在这种情况下，测试驱动程序应该自动验证测试用例是否处理成功。我们将扩展此测试驱动程序以包含自动测试用例验证留作编程作业。\n\
  \n此测试驱动程序没有进行任何确认输入有效的错误检查。例如，它没有验证输入的命令代码是否真的是合法命令。记住，测试驱动程序的目标是作为真实程序的骨架，而不是程序本身。因此，测试驱动程序不需要像它模拟的程序那样健壮。\n\
  \n到此时，你可能在抗议这些测试方法非常麻烦，你几乎没有时间写程序，更不用说编写存根（stubs）和驱动程序这样的“一次性代码”了。结构化测试方法确实需要额外工作。测试驱动和存根是软件项目；它们本身必须被编写和调试，尽管它们很少交给教授或交付给客户。这些程序属于软件开发工具的一类，创建它们需要时间，但在简化测试工作方面是无价的。\n\
  \n此类程序类似于承包商在建筑周围搭建的脚手架。建造脚手架需要时间和金钱，它不是最终产品的一部分；然而，没有它，建筑就无法建成。在大型程序中，验证在软件开发过程中起着主要作用，创建这些额外工具可能是测试程序的唯一方法。\n\
  \n#### 实际考虑因素\n\n从本章可以明显看出，程序验证技术是非常耗时的，而且在工作环境中是昂贵的。完成本章中讨论的所有内容需要很长时间，而程序员处理任何特定程序的时间是有限的。显然并不是每个程序都值得这样的成本和精力。你如何判断需要多少以及什么种验证工作呢？\n\
  \n程序的需求可能提供所需验证水平的指示。在教室里，你的教授可能会将验证要求作为编程作业的一部分。例如，你可能被要求提交一份书面的、已实现的测试计划。你的成绩可能部分取决于该计划的完整性。在工作环境中，验证要求通常由客户在特定编程任务的合同中规定。例如，与军事客户签订的合同可能规定在开发过程的不同阶段对软件产品进行正式评审或检查。\n\
  \n对于程序中特别复杂或易出错的部分，可能需要更高水平的验证工作。在这种情况下，在程序开发的早期开始验证过程是明智的，以避免设计阶段出现昂贵的错误。\n\n正确执行对人类生命至关重要的程序显然是高水平验证的候选对象。例如，一个控制宇航员从太空任务返回的程序，所需的验证水平比一个生成购物清单的程序高。一个更接地气的例子是，如果医院的患者数据库系统存在漏洞，导致丢失患者对药物过敏的信息，可能会酿成灾难。然而，在管理圣诞卡片邮寄列表的数据库程序中出现类似的错误，其后果将小得多。\n\
  \n各行业的错误率证实了这种区别。对人类关键性越高，错误率就越低（表 1.3）。\n\n| 应用领域 | 项目数量 | 错误范围 (错误/KESLOC²) |\
