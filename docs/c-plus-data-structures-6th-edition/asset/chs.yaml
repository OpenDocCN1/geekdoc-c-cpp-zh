  \ 是指对结构中存储的项目数量有逻辑限制的 ADT。无界 ADT 是指没有逻辑限制的 ADT。我们倾向于将基于数组的结构看是有界的，将链表结构看是非无界的。然而，这是实现上的解释，而不是逻辑上的解释。\n\
  \n例如，客户端可能有理由知道列表的最大项目数量是限制的。我们倾向于将基于数组的结构看是有界的，将链表结构看是非无界的。然而，这是实现上的解释，而不是逻辑上的解释。\n\
  \n例如，客户端可能有理由知道列表的最大项目数量是限制的。我们倾向于将基于数组的结构看是有界的，将链表结构看是非无界的。然而，这是实现上的解释，而不是逻辑上的解释。\n\
  \n### 4.6 面向对象的设计方法论\n\n我们介绍的面向对象的设计分为四个阶段。脑风暴（Brainstorming）是初步确定类的阶段。过滤（Filtering）是重新检查所提类的阶段，查看哪些可以合并、哪些需要、哪些缺失。通过过滤阶段的每个类记录在\
  \ CRC 卡上。\n\n场景（Scenarios）是确定每个类行为的阶段。由于每个类都负责自己的行为，我们把这些行为称为职责（Responsibilities）。在这个阶段，会探索“如果……怎么办”的问题以确保检查所有情况。当确定了类的所有职责后，它们被记录在类的\
  \ CRC 卡上，并列出完成该职责所需的与之协作（交互）的其他类的名称。\n\n在最后一个阶段——职责算法（Responsibility Algorithms），我们为\
  \ CRC 卡上列出的每个职责编写算法。\n\n#### 脑风暴\n\n脑风暴到底是什么？字典将其定义为一种涉及小组所有成员自发贡献想法的小组问题解决技术。¹\n\
  \n\n\n\nBelin 和 Simone 列出了成功脑风暴的四项原则。首先，所有的想法都是潜在的好主意。小组成员必须不要审查自己的想法，也不要对他人的想法做出草率判断。下一个原则与速度有关：首先要快速、狂热地思考，以后再考虑。初阶段速度越快，创造力就流动得越顺畅。第三，让每个人都有发言的机会。为了放慢那些倾向于垄断对话的人并鼓励那些不愿说话的人，可以使用轮流制。持续这种模式，直到团队成员真的因为没有主意而被迫“跳过”为止。最后，一点幽默是一种强大的力量。幽默有助于将一个随机小组转化为一个凝聚力强的团队。\n\
  \n在面向对象的问题解决背景下，脑风暴是一种小组活动，旨在产生候选类列表，用于解决特定问题。Belin 和 Simone 指出，尽管每个项目不同，每个团队的性格也不同，但以下四个步骤是一个很好的通用方法。\n\
  \n- **步骤 1** 是在会议开始时回顾脑风暴原则，提醒每个人这是一个小组活动，应该抛开个人风格。\n- **步骤 2** 是说明具体的会话目标，例如：“今天我们想为学生项目列出一个候选类列表。”或“今天我们想确定注册阶段期间活跃的类。”\n\
  - **步骤 3** 是使用轮流制技术让小组以均匀的节奏进行，同时给人们留足够的思考时间。每个人都应该为列表贡献一个可能的对象类。协调员应保持讨论不偏离，记录员应负责记录。当小组中的每个人都因为无法想起另一个建议的类而不得不“跳过”时，脑风暴停止。\n\
  - **步骤 4** 是 Belin 和 Simone 流程的最后一步，讨论这些类并选择属于最终列表的类。我们倾向于将这一阶段与脑风暴分开，并在下一节中讨论。\n\
  \n正如为广告口号进行脑风暴的人在会议前对产品有所了解一样，为类进行脑风暴要求参与者对问题有所了解。每位参与者都应该熟悉需求文档以及任何与项目技术相关的通信内容。如果存在歧义，参与者应该在脑风暴会议之前进行采访以澄清这些点。每个团队成员在进入脑风暴会议时都应该对要解决的问题有清晰的理解。毫无疑问在准备过程中，每位团队成员都会生成自己的初步类列表。\n\
  \n#### 过滤\n\n脑风暴会议产生了一个初步的类列表。下一阶段是获取这个初步类列表并确定哪些是问题解决方案中的核心类。列表中可能有两个类实际上是同一个东西。这些重复的类通常由于组织内不同部门的人对同一个概念或实体使用了不同的名称。列表中可能有两个类具有许多共同的属性和行为。应该将共同部分汇集到一个超类中，让这两个类派生共同属性，并添加不同的属性。\n\
  \n可能存在某些并不真正属于问题解决方案的类。例如，如果我们模拟一个计算器，我们可能会将“用户”列为一个可能的类。然而，用户并不是作为一个类类存在于模拟内部；用户是问题外部的为模拟提供输入的实体。另一个可能的类可能是“开启”按钮。然而，稍微思考一下发现，开启按钮并不是模拟的一部分；它是启动模拟程序运行的东西。\n\
  \n过滤完成后，应为生存到这一阶段的每个类编写 CRC 卡。\n\n#### 场景\n\n此阶段的目标是为每个类分配责任。什么是责任？它们是每个类必须执行的任务。责任最终被实现为子程序。在这个阶段，我们只关心任务是什么，而不关心它们可能如何执行。\n\
  \n责任有两种类型：类必须了解自身的信息（知识）以及类必须能做的事。\n\n类必须了解自身的信息（知识）以及类必须能执行的事（行为）。类封装了数据（知识）；一个类无法直接访问另一个类的数据。封装是抽象的关键。然而，每个类都有责任将数据（知识）提供给需要它的类。因此，每个类都有责任知道他人所需要的信息。\n\
  \n例如，学生类应该“知道”或“获取”它的名称和地址。虽然这些信息的责任可能被称为 `get name` 和 `get address`，但在这一阶段，地址是否留在类类中是不重要的。重要的是学生类能够访问并返回（get）它自己的地址。\n\
  \n行为的责任更像我们在自顶设计中描述的任务。例如，一个责任可能是学生类计算 GPA（平均绩点）。在自顶设计中，我们会说任务是给定数据计算 GPA。在面向对象设计中，我们说学生类负责计算自己的\
  \ GPA。这种区别既微妙又深远。计算的最终代码可能相同，但执行方式不同。在命令式程序中，程序调用计算 GPA 的子程序并将学生作为参数传递。在面向对象的程序中，向类对象发送消息来计算\
  \ GPA。这里没有参数，因为接收消息的对象知道自己的数据。\n\n#### 责任算法\n\n\n\n\n最终，必须为各项职责（responsibilities）编写算法。由于在面向对象的设计视图中关注的是数据而非动作，因此执行职责的算法通常非常短。例如，知识类职责通常返回对象中某个变量的内容，或向另一个对象发送消息以获取该内容。动作类职责则要稍微复杂一些，通常涉及计算。因此，自顶而下的算法设计方法通常适用于设计许多职责算法。\n\
  \n#### 结语\n\n总而言之，自顶而下的设计方法关注从输入到输出转换的过程，从而产生一个任务的层级结构。面向对象的设计关注的是待转换的数据对象，从而产生一个对象的层级结构。问题描述中的名词变成对象；动词变成操作。在自顶而下的设计中，动词是关注的核心；在面向对象的设计中，名词是关注的核心。\n\
  \n我们描述的方法论利用了 `CRC` 卡。这种卡片仅仅是一种帮助你组织类的记记工具；它的使用本身并不是一种方法论。\n\n#### 总结\n\n在本章中，我们为表示有序列表的\
  \ ADT 创建了两种实现——基于数组的和基于链表的实现。`Sorted List` ADT 假设列表元素已按键排序。我们从三个维度查看了这一 ADT：逻辑层面、应用层面和实现层面。\n\
  \n文中描述了一种四阶段的面向对象设计方法论。脑风暴（Brainstorming）是在问题解决方案中产生可能的对象类的过程。过滤（Filtering）是重新检查暂定类、消除不合适的类、合并某些类并在必要时创建额外类的过程。场景（Scenarios）是过程中的一部分，你检查每个建议类的职责并进行角色扮演以查看是否涵盖了所有情况。职责算法（Responsibility\
  \ algorithms）是推导出执行职责算法的阶段。`CRC` 卡被用作记录类及其职责的视觉手段。相比之下，`UML` 图用于记录类并显示数据字段及其类型。\n\
  \n扩展案例使用了这种方法论和 `Sorted List` ADT。\n\n#### 练习题\n\n1. 需要扩展 `Sorted List` ADT 添加一个布尔型成员函数\
