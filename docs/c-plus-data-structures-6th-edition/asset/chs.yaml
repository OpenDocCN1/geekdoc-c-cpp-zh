  \ `otherTree` 右子树的副本存储在 `copy` 的右孩子中。我们从哪里获取子树的副本？当然，我们递归地使用 `CopyTree`：\n\n```\n\
  void CopyTree(TreeNode*& copy,\n       const TreeNode* originalTree)\n// 后: copy\
  \ 是一棵与 originalTree 相同的\n//       树的根节点。\n{\n  if (originalTree == NULL)\n    copy\
  \ = NULL;\n  else\n  {\n    copy = new TreeNode;\n    copy->info = originalTree->info;\n\
  \    CopyTree(copy->left, originalTree->left); \n    CopyTree(copy->right, originalTree->right);\n\
  \  }\n}\n```\n\n在进入下一节之前，确保你理解这段代码是如何工作的。正如许多递归算法一样，这个短函数虽然优雅但并不直观。事实上，让我们在以下树上追踪\
  \ `CopyTree`：\n\n![](img/f0537-01.jpg)\n\n正如第 7 章所示，R0 代表非递归调用，R1 代表第一次递归调用（`copy->left`），R2\
  \ 代表第二次递归调用（`copy->right`）。在追踪过程中，指向节点内容的箭头代表该节点的指针。表格中的“注释”列显示了追踪过程。\n\n| 调用 |\
  \ copy | originalTree | 返回 | 注释 |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | 指向新树的外部指针\
  \ | →`L` | R0 | 给 `copy` 分配了一个节点；L 被复制到 `info` 成员中；执行 R1 |\n| 2 | 调用 1 分配的节点的左侧\
  \ | →`D` | R1 | 给 `copy` 分配了一个节点；D 被复制到 `info` 成员中；执行 R1 |\n| 3 | 调用 2 分配的节点的左侧\
  \ | `NULL` | R1 | 将 `NULL` 复制到 `copy` 中（即调用 2 分配的节点的左侧）并完成调用 3 |\n\n此时，第三次调用完成，`copy`\
  \ 如下所示：\n\n![](img/f0537-02.jpg)\n\n\n\n要生成前序遍历，请遵循循环并在每个节点第一次被访问时访问（在访问左子树之前）。要生成中序遍历，请遵循循环并在每个节点第二次被访问时访问（在访问两个子树之间）。要生成后序遍历，请遵循循环并在每个节点第三次被访问时访问（在访问右子树之后）。将此方法应用于图\
  \ 8.17 中的树，并看看你是否同意列出的遍历顺序。\n\n中序遍历允许我们按升序打印值；后序遍历允许我们更高效地销毁树。前序遍历在何种情况下有用？在处理二叉搜索树时，这种遍历并不特别有用；但在二叉树的其他应用中非常有用。\n\
  \n#### 函数 `ResetTree` 和 `GetNextItem`\n\n`ResetTree` 为遍历准备好当前位置；`GetNextItem` 将当前位置移动到下一个节点并返回存储在该处的值。我们已经看了三种遍历，那么这里的“下一个节点”意味着什么呢？`ResetTree`\
  \ 和 `GetNextItem` 都有一个类型为 `OrderType` 的参数，允许用户指定要使用哪种遍历。\n\n![](img/f08-17.jpg)\n\
  \n图 8.17 三种树遍历\n\n在遍历线性结构时，从一个项目移动到下一个项目是显式指定的。我们的树遍历是递归的，因此下一个项目的位置是当前项目和运行时栈的函数。我们可以使用辅助栈来实现遍历，从而保存我们找到下一个项目所需的历史。然而，还有一种更简单的方法：我们让\
  \ `ResetTree` 按正确的顺序生成节点内容的队列，并让 `GetNextItem` 处理队列来自节点内容。回想 `OrderType` 的定义如下：\n\
  \n```\nenum OrderType {PRE_ORDER, IN_ORDER, POST_ORDER};\n```\n\n我们让 `ResetTree`\
  \ 根据参数 `order` 的值调用三个递归函数之一。每个函数实现一个递归遍历并将节点内容存储到队列中。因此，我们必须在 `TreeType` 的私有部分声明三个队列：\n\
  \n```\nenum OrderType {PRE_ORDER, IN_ORDER, POST_ORDER};\n\nclass TreeType\n{\n\n\
  public:\n  // 函数原型写在这里。\n\nprivate:\n  TreeNode* root; QueType preQue; QueType inQue;\n\
  \n  QueType postQue;\n\n}\n\n// 辅助函数的函数原型。\n\nvoid PreOrder(TreeNode*, QueType&);\n\
  \n// 按前序将树项入队列。\n\nvoid InOrder(TreeNode*, QueType&);\n\n// 按中序将树项入队列。\n\nvoid PostOrder(TreeNode*,\
  \ QueType&);\n\n// 按后序将树项入队列。\n\nvoid TreeType::ResetTree(OrderType order)\n// 调用函数以以所需的顺序创建树元素的队列。\n\
  {\n  switch (order)\n  {\n    case PRE_ORDER : PreOrder(root, preQue);\n       \
  \              break;\n    case IN_ORDER  : InOrder(root, inQue);\n            \
  \         break;\n    case POST_ORDER: PostOrder(root, postQue);\n             \
  \        break;\n  }\n}\n\nvoid PreOrder(TreeNode* tree, QueType& preQue)\n// 后：preQue\
  \ 包含前序的树项。\n{\n  if (tree != NULL)\n  {\n    preQue.Enqueue(tree->info);\n    PreOrder(tree->left,\
  \ preQue); PreOrder(tree->right, preQue);\n  }\n}\n\nvoid InOrder(TreeNode* tree,\
  \ QueType& inQue)\n// 后：inQue 包含中序的树项。\n{\n  if (tree != NULL)\n  {\n    InOrder(tree->left,\
  \ inQue);\n    inQue.Enqueue(tree->info);\n    InOrder(tree->right, inQue);\n  }\n\
  }\n\nvoid PostOrder(TreeNode* tree, QueType& postQue)\n// 后：postQue 包含后序的树项。\n{\n\
  \  if (tree != NULL)\n  {\n    PostOrder(tree->left, postQue);\n    PostOrder(tree->right,\
  \ postQue);\n    postQue.Enqueue(tree->info);\n  }\n}\n\nItemType TreeType::GetNextItem(OrderType\
  \ order, bool& finished)\n// 返回所需顺序的下一个项。\n// 后：对于所需的顺序，item 是队列中的下一个项。\n//    \
  \   如果 item 是队列中的最后一个，则 finished 为 true；\n//       否则，finished 为 false。\n{\n  ItemType\
  \ item; finished = false; switch (order)\n  {\n    case PRE_ORDER : preQue.Dequeue(item);\n\
  \                     if (preQue.IsEmpty())\n                       finished = true;\n\
  \                     break;\n    case IN_ORDER : inQue.Dequeue(item);\n       \
  \             if (inQue.IsEmpty())\n                      finished = true;\n   \
  \                 break;\n   case POST_ORDER : postQue.Dequeue(item);\n        \
  \             if (postQue.IsEmpty())\n                       finished = true;\n\
  \                     break;\n  }\n  return item;\n}\n```\n\n### 8.7 迭代插入与删除\n\n\
  #### 搜索二叉搜索树\n\n在树操作的递归版本中，我们将搜索任务嵌入到需要它的函数中。另一种方案是拥有一个通用的搜索函数；让我们在这里采用这种方法。`FindNode`\
  \ 函数将搜索任务嵌入到需要它的函数中。\n\n\n\n2. 因为 `parentPtr` 指向我们在离开树之前访问的最后一个节点，键值为 7 的新节点必须附加到\
  \ `parentPtr` 所指向的节点上。当我们开发迭代的 `PutItem` 操作时，这一信息将证明是非常有用的。\n\n#### 函数 `PutItem`\n\
  \n迭代 `PutItem` 操作的算法必须执行与任何插入操作执行相同的三个任务：\n\n创建节点的方法与递归版本相同。然而，寻找插入点和插入节点的方法是不同的。让我们看看\
  \ `FindNode` 函数如何为我们执行搜索。我们调用 `FindNode`，要求它找到与 `item` 键值相同的节点：\n\n```\nFindNode(tree,\
  \ item, nodePtr, parentPtr);\n```\n\n假设我们想将键值为 13 的元素插入到图 8.18 所示的二叉搜索树中。在 `FindNode`\
  \ 函数中，`nodePtr` 初始化指向树的根，`parentPtr` 初始化为 `NULL`（图 8.18a）。因为 `item` 的键 (13) 大于根节点的键\
  \ (7)，我们将 `nodePtr` 向右移动，并将 `parentPtr` 跟在它后面（图 8.18b）。现在 `item` 的键小于 `nodePtr->info`，我们将\
  \ `nodePtr` 向左移动，`parentPtr` 跟随其后（图 8.18c）。因为 `item` 的键大于 `nodePtr->info`，`parentPtr`\
  \ 追上，`nodePtr` 向右移动（图 8.18d）。此时，`nodePtr` 为 `NULL`，因此我们退出 `FindNode`，指针位置如图 8.18d\
  \ 所示。\n\n![](img/f08-18.jpg)\n\n图 8.18 使用 `FindNode` 函数寻找插入点\n\n当然，不应该找到具有 `item`\
  \ 键值的节点，因为我们现在正要插入它。好消息是 `nodePtr` 恰好在新节点应该插入的位置离开了树。因为 `parentPtr` 紧随 `nodePtr`\
  \ 之后，我们可以简单地将新节点附加到 `parentPtr` 指向的节点上（图 8.18e）。\n\n现在我们准备执行第三个任务：修复 `parentPtr`\
  \ 指向节点的指针以附加新节点。通常情况下，我们将新元素的键与 `parentPtr->info` 的键进行比较。`parentPtr->left` 或 `parentPtr->right`\
  \ 必须设置为指向新节点：\n\n然而，当我们向空树插入第一个节点时，`parentPtr` 仍然等于 `NULL`，且对 `parentPtr` 进行解引用是非法的。我们需要将向树中插入第一个节点变成一个特殊情况。我们可以通过测试\
  \ `parentPtr` = `NULL` 来判断 `tree` 是否为空；如果是，我们更改 `tree` 指向新节点：\n\n综上所述，插入操作设计的各个部分可以编码为函数\
  \ `PutItem`，其接口在二叉搜索树 ADT 规范中描述：\n\n```\nvoid TreeType::PutItem(ItemType item)\n\
  \n// Post: item is in tree.\n\n{\n\n  TreeNode* newNode; \n\n  TreeNode* nodePtr;\n\
  \n  TreeNode* parentPtr;\n\n  newNode = new TreeNode; \n\n  newNode->info = item;\n\
  \n  newNode->left = NULL;\n\n  newNode->right = NULL;\n\n  FindNode(root, item,\
  \ nodePtr, parentPtr);\n\n  if (parentPtr == NULL)          // Insert as root.\n\
  \    root = newNode;\n\n  else if (item < parentPtr->info)\n    parentPtr->left\
  \ = newNode;\n\n  else parentPtr->right = newNode;\n}\n```\n\n#### 函数 `DeleteItem`\n\
  \n迭代 `DeleteItem` 操作与递归 `Delete` 存在相同的三个情况：删除没有子节点、一个节点或两个节点的节点。我们可以使用 `FindNode`\
  \ 定位 `nodePtr` 指向的节点并删除其父节点（`parentPtr` 指向的节点）。\n\n要删除 `nodePtr` 指向的节点？在递归版本中实际删除发生在\
  \ `DeleteNode` 中。`DeleteNode` 只需要一个参数：要删除的节点在树中的位置。给定 `nodePtr` 和 `parentPtr`，我们需要确定\
  \ `nodePtr` 指向的节点是 `parentPtr` 指向节点的左子还是右子。如果 `nodePtr` 的值与 `parentPtr->left` 的值相同，我们将\
  \ `parentPtr->left` 传递给 `DeleteNode`；否则，我们将 `parentPtr->right` 传递给 `DeleteNode`：\n\
  \n```\nvoid TreeType::DeleteItem(ItemType item)\n\n// Post: There is no node in\
  \ the tree whose\nmatches item.\n\n{\n  TreeNode* nodePtr;\n\n  TreeNode* parentPtr;\n\
  \n  FindNode(root, item, nodePtr, parentPtr);\n\n  if (parentPtr == NULL)      \
  \    // Insert as root.\n    root = newNode;\n\n  else if (item < parentPtr->info)\n\
  \    parentPtr->left = newNode;\n\n  else parentPtr->right = newNode;\n}\n```\n\
  *(注：提供的 `DeleteItem` 代码块文本是混乱/交错的。我根据提供的逻辑片段清理了结构。）*\n\n\n\n\n\n不。在树平衡良好的情况下，递归和非递归版本的插入和删除操作均为\
  \ `O(log[2]N)`。唯一关注的效率问题与空间有关。`item` 是一个值参数；我们的函数在每次递归调用时传递它的拷贝。如果 `item` 是一个大型结构体或类对象，这些拷贝可能会导致运行时栈溢出。（如果\
  \ `ItemType` 很大且树的深度很高，将 `item` 设为 `const` 引用参数会更好。）\n\n我们给递归版本的函数评了“A”；它们代表了对递归的优秀运用。\n\
  \n## 8.8 比较二分搜索树与线性列表\n\n二分搜索树是之前讨论过的、并与其他排序列表结构结合讨论的许多应用程序的合适结构。使用二分搜索树的特殊优势是它便于搜索，同时又赋予了元素链接的优点。它兼具了基于数组的排序列表和链表的最佳特性。像基于数组的排序列表一样，它可以使用二分查找进行快速搜索。像链表一样，它允许插入和删除而无需移动数据。因此，这种结构特别适用于必须最小化搜索时间或节点处理不一定按顺序进行的应用程序。\n\
  \n与往常一样，存在权衡。二分搜索树每个节点都有一个额外的指针，占用的内存空间比单链表多。此外，操作树的算法要稍微复杂一些。如果列表的所有用途都涉及元素的顺序处理而非随机处理，那么树可能不是链表那么好的选择。\n\
  \n假设我们在列表中有 10 亿条客户记录。如果我们的主要活动是向客户发送更新的月度账单，且账单的准备顺序与记录在列表中出现的顺序相匹配，那么链表是合适的。但假设我们决定提供一个\
  \ Web 应用程序，让客户能够随地查询他们的账户信息。如果数据存储在链表中，列表上的第一个客户几乎可以立即获得信息，但最后一个客户则必须等待，因为应用程序需要检查其他\
  \ 999,999,999 条记录。当直接访问记录是一项需求时，二分搜索树代表了一种更合适的结构。\n\n### Big-O 比较\n\n正如我们在一个专门用于搜索的结构中预期的那样，找到要处理的节点（`FindNode`）是最有趣的分析操作。在最好的情况下——如果元素的插入顺序导致了一棵短而茂密的树——我们最多只需\
  \ `log[2]N + 1` 次比较即可找到树中的任何节点。我们预计在这样一棵树中定位随机元素的速度比在排序链表中找到该元素快得多。在最坏的情况下——如果元素按从小到大的顺序（或反之）插入——这棵树根本不是真正的树；它是一个线性列表，通过\
  \ `left` 或 `right` 数据成员链接。这种结构被称为退化树。在这种情况下，树的操作执行情况与链表的操作非常相似。因此，在最坏情况分析中，树操作的复杂度与相应的链表操作相同。然而，在接下来的分析中，我们假设项目按随机顺序插入树中以产生一棵平衡树。\n\
  \n`PutItem`、`DeleteItem` 和 `GetItem` 操作基本上涉及找到节点 `[O(log[2]N)]` 加上 `O(1)` 的任务——例如，创建节点、重置指针或拷贝数据。这些操作都被描述为\
  \ `O(log[2]N)`。`DeleteItem` 操作由找到节点加上 `DeleteNode` 组成。在最坏的情况下（删除具有两个子节点的节点），`DeleteNode`\
  \ 必须找到替换值，这是一个 `O(log[2]N)` 操作。（实际上，这两个任务加起来是 `log[2]N` 次比较，因为如果被删除的节点在树中较高，找到它所需的比较较少，而找到替换节点可能需要更多比较。）否则，如果被删除的节点没有或只有一个孩子，`DeleteNode`\
  \ 是一个 `O(1)` 操作。因此，`DeleteItem` 也可以描述为 `O(log[2]N)`。\n\n观察操作 `IsFull` 和 `IsEmpty`\
  \ 复杂度为 `O(1)`，因为项目数量不受这些操作的影响。然而，`GetLength` 则不同。正如我们在第五章 中提到的，`length` 数据成员在基于数组的实现中必须存在，但在链实现中这是一个设计选择。在第五章\
  \ 的实现中，我们选择在调用 `GetLength` 成员函数时保留 `length` 字段而不是计算项目数量。在我们的树实现中，有相同的选择；我们选择在调用\
  \ `GetLength` 时统计列表上的项目数量。因此，树实现的顺序是 `O(N)`。\n\n`MakeEmpty`、`Print` 和析构函数操作需要遍历树并处理每个元素一次。因此，它们具有\
  \ `O(N)` 复杂度。表 8.2 比较了我们编写的树操作和列表操作的数量级。二分搜索树操作基于项目的随机插入顺序；基于数组的实现中的查找操作基于二分查找。\n\
  \n| | 二分搜索树 | 基于数组的线性列表 | 链表 |\n| --- | --- | --- | --- |\n| 类构造函数 | O(1) | O(1)\
  \ | O(1) |\n| 析构函数 | O(N) | O(1) | O(N) 如果基于数组的列表可能包含指针，必须释放内存，这是一个 O(N) 操作。 |\n\
  | `MakeEmpty` | O(N) | O(1) | O(N) |\n| `GetLength` | O(N) | O(1) | O(1) |\n| `IsFull`\
  \ | O(1) | O(1) | O(1) |\n| `IsEmpty` | O(1) | O(1) | O(1) |\n| `GetItem` | 查找 O(log[2]N)\
  \ | O(log[2]N) | O(N) |\n| | 处理 O(1) | O(1) | O(1) |\n| | 总计 O(log[2]N) | O(log[2]N)\
  \ | O(N) |\n| `PutItem` | 查找 O(log[2]N) | O(log[2]N) | O(N) |\n| | 处理 O(1) | O(1)\
  \ | O(1) |\n| | 总计 O(log[2]N) | O(log[2]N) | O(N) |\n| `DeleteItem` | 查找 O(log[2]N)\
  \ | O(log[2]N) | O(N) |\n| | 处理 O(1) | O(1) | O(1) |\n| | 总计 O(log[2]N) | O(log[2]N)\
  \ | O(N) |\n\n表 8.2 操作的 Big-O 比较\n\n#### 案例研究\n\n建立索引\n\n问题 出版商要求我们为这本书编写索引。这个过程的第一步是决定哪些单词应该出现在索引中；第二步是生成每个单词出现的页列表。讨论\
  \ 与其从我们脑子里（凭空）挑选单词，我们决定让计算机生成一份手稿中使用的所有唯一单词及其频率列表。然后我们可以查看该列表并选择包含在索引中的单词。\n\n显然，这个问题中的主要对象是带有频率的单词。因此，我们必须完成的第一件事是定义“单词”。\n\
  \n回顾之前的段落，在这种背景下，“单词”的初步定义是什么？是“两个空格之间的东西”还是更好一点，“两个空格之间的字符字符串”？这个定义适用于索引中的大多数单词。\n\
  \n以下定义能解决问题吗？\n\n单词是标记之间的字母数字字符字符串，其中标记是空白字符和所有标点符号。\n\n\n\n\n是的，对于索引词候选词的类型，这是一个很好的工作定义。我们可以使用\
  \ `<cctype>` 中的可用函数 `isalnum` 来判断一个字符是否为字母数字字符。我们可以跳过开头的非数字字符，并存储和读取字符，直到遇到非字母数字字符（`isalnum`\
  \ 返回假）或 `inFile` 进入失败状态。如果我们没有遇到任何字母数字字符，则返回空字符串。\n\n这个过程忽略了引号，但将缩写留作了一个问题。让我们检查几个例子，并看看是否能找到解决方案。常见的缩写如“let’s”、“couldn’t”、“can’t”和“that’s”在单引号后都只有一个字母。算法会将单引号之前的之前的字符视为一个单词，并将单引号后的字符视为另一个单词。我们真正想做的是忽略单引号之后的字符。通过规定单词必须至少有三个字符长才能被考虑在索引中，我们解决了这个问题。忽略少于三个字母的单词也从考虑中剔除了诸如“a”、“is”、“to”、“do”和“by”等不属于索引的词。\n\
  \n#### 头脑风暴\n如往常，我们的第一步是列出可能对解决问题用的对象。扫描问题描述，我们识别出以下名词：出版商、索引、文本、单词、列表、页、头、计算机、手稿、频率和出现。显然，其中一些名词为问题奠定了舞台，它们不是解决方案的一部分。移除这些名词后，我们剩下手稿、单词、列表和频率。\n\
  \n#### 场景\n对于这个问题实际上只有一个场景：读取一个文件（手稿），将其拆分为单词，处理单词并输出结果。为了处理每个单词，我们检查它的长度。如果长度是三个字符或更多，我们就检查它是否是我们之前处理过的单词。如果是，我们就增加它的频率；如果不是，我们就将其添加到列表中，频率为\
  \ 1。然而，三个字符的限制是相当任意的。让用户输入最小字符数。\n\n虽然频率是一个名词，但在这种情况下它是单词的一个属性。让我们将单词和频率合并为一个 `WordType`\
  \ 对象。我们需要一个容器对象（列表）来存储 `WordType` 项。我们可以使用我们已经编写的任何列表 ADT。为了让输出文件按字母顺序列出单词，我们应该使用\
  \ `Sorted List` ADT。这里是 `WordType` 和 `ListType` 的 CRC 卡：\n\n![](img/f0557-01.jpg)\n\
  \n我们现在准备好在主驱动函数中总结我们的讨论：\n\n### 驱动程序 (Main)\n\n```\n 打开输入文件 打开输出文件 获取文件标签\n\n  在输出文件上打印文件标签\n\
  \n  获取最小单词长度\n\n  通过 GetString(input file) 设置 letters\n\n  while 更多数据\n\n    if\
  \ letters.GetLength( ) >= minimum word length\n\n      用 letters 初始化 WordType 对象\n\
  \n      list.GetItem(wordObject, found)\n\n      if found\n\n         增加 wordObject\
  \ 的计数\n      else\n         list.PutItem(wordObject)\n\n     通过 GetString (input\
  \ file) 设置 letters\n\nlist.Print(output file)\n```\n\n哎！我们的设计有一个巨大的缺陷。无论我们使用哪种列表\
  \ ADT，`GetItem` 返回列表中项的拷贝。增加返回的项目仅仅是增加了列表中项的拷贝。因此，所有的频率最终都将是 1。事实上，这个问题确实不适合使用我们的某一个列表\
  \ ADT。如果我们编写一个单一函数，在列表中搜索字符串并在找到时增加计数，如果找不到则插入一个带有该字符串的节点，处理效率会高得多。当搜索发现字符串不在时，它已经处于节点应该所在的位置了。\n\
  \n这次讨论提出了一个非常重要的一点：有时使用现成的容器类并不恰当。使用库类——无论是 C++ 提供的还是你自己自定义的类——都能让你在更短时间内编写出更可靠的软件。这些类已经过测试和调试。如果它们符合你问题的需求，就使用它们。如果不符合，就编写一个特殊用途的函数来完成工作。在这种情况下，我们需要编写我们自己的。容器对象的修订版\
  \ CRC 卡如下：\n\n![](img/f0559-01.jpg)\n\n这里是修订后的主函数：\n\n```\n打开输入文件\n\n打开输出文件\n\n\
  获取文件标签\n\n在输出文件上打印文件标签\n\n获取最小单词长度\n\n通过 GetString (input file) 设置 letters\n\nwhile\
  \ 更多数据\n\n  if letters.GetLength( ) >= minimum word length\n\n      list.InsertOrIncrement(tree,\
  \ letters)\n\n  通过 GetString (input file) 设置 letters\n\nlist.Print(output file)\n\
  ```\n\n`GetString(inFile)` 返回字符串\n\n```\n 将 letters 设置为空字符串\n\n 获取一个字母\n\nwhile\
  \ (NOT isalnum(letter) AND inFile)\n\n       获取一个字母\n\nif (NOT inFile)\n\n     \
  \  return letters\n\nelse\n\n   do\n\n     将 letter 设置为 tolower(letter);\n     将\
  \ letters 设置为 letters + letter;\n     获取一个字母\n  while (isalnum(letter) AND inFile);\n\
  ```\n\n在继续之前，我们必须决定 `ListType` 的实现结构。列表中的项数没有限制，因此链式实现是合适的。对于每个单词，都必须搜索列表，以插入新单词或增加已识别单词的频率。基于树的列表将是最有效的，因为它的搜索复杂度为\
  \ O(log[2]N)。\n\n在我们原始的设计中，我们将 `Word` 设计为一个类，具有初始化自身、比较自身和增加频率的成员函数。由于容器类是专门为这个问题设计的，让我们让\
  \ `WordType` 一个结构体而不是类，并让列表负责处理：\n\n`PutOrIncrement`\n\n```\nif tree is 空\n\n  \
  \  为 tree 获取一个新节点\n\n    将 Info(tree) 的 word 成员设置为 letters\n\n    将 Info(tree) 的\
  \ count 成员设置为 1\n\n    将 Left(tree) 设置为 NULL\n\n    将 Right(tree) 设置为 NULL\n\nelse\
  \ if Info(tree) 的 word 成员等于 letters\n\n    增加 Info(tree) 的 count 成员\n\nelse if letters\
  \ 小于 Info(tree) 的 word 成员\n\n    PutOrIncrement(Left(tree), letters)\n\nelse\n\n\
  \    PutOrIncrement(Right(tree), letters)\n```\n\n`Print`\n\n```\nif tree is 非空\n\
  \n    Print(tree, outFile)\n\n    Info(tree) 的 word 成员.PrintToFile(TRUE, outFile)\n\
  \n    outFile << word\n\n    Print(tree, outFile)\n```\n\n我们现在准备好编写我们的算法了：\n\n\n\
  \n\n\n```cpp\n#include <fstream>\n\n#include <cstddef>\n\n#include <iostream>\n\n\
  #include <string>\n\nusing namespace std;\n\nstruct WordType\n{\n\npublic:\n  string\
  \ word;\n  int count;\n};\n\nstruct TreeNode\n{\n  WordType info;\n  TreeNode* left;\n\
  \  TreeNode* right;\n};\n\nclass ListType\n{\npublic:\n  ListType();\n  void PutOrIncrement(string\
  \ letters);\n  void PrintList(ofstream&);\n\nprivate:\n  TreeNode* root;\n};\n\n\
  string GetString(ifstream&);\n\nconst int MAX_LETTERS = 20;\n\nint main()\n{\n \
  \ ListType list;\n  string inFileName;\n  string outFileName;\n  string outputLabel;\n\
  \  ifstream inFile;\n  ofstream outFile;\n  string letters;\n  int minimumLength;\n\
  \  // 输入文件名，读取文件名并准备文件\n  cout << \"Enter name of input command file; press return.\"\
  \ << endl;\n  cin >> inFileName;\n  inFile.open(inFileName.c_str());\n  if (!inFile)\n\
  \     cout << \"file not found\";\n  cout << \"Enter name of output file; press\
  \ return.\" << endl;\n  cin >> outFileName;\n  outFile.open(outFileName.c_str());\n\
  \  cout << \"Enter name of test run; press return.\" << endl;\n  cin >> outputLabel;\n\
  \  outFile << outputLabel << endl;\n  cout << \"Enter the minimum size word to be\
  \ considered.\" << endl;\n  cin >> minimumLength;\n  // 读取文本、剥离单词并将其插入\n  // 列表。如果单词已存在，则其计数加\
  \ 1。\n  letters = GetString(inFile);\n  while (inFile)\n  {\n    if (letters.length()\
  \ >= minimumLength)\n      list.PutOrIncrement(letters);\n    letters = GetString(inFile);\n\
  \  }\n  list.PrintList(outFile);\n  outFile.close();\n  inFile.close();\n  return\
  \ 0;\n}\n\nstring GetString(ifstream& inFile)\n// 后置：跳过非字母数字字符。字母数字字符\n//      \
  \ 被读取并拼接到字符串中，直到读取到非字母数字\n//       字符或到达文件末尾。所有字母\n//       转换为小写。\n{\n  char letter;\n\
  \  string letters = \"\";\n  inFile.get(letter);\n  while (inFile && !isalnum(letter))\n\
  \    inFile.get(letter);\n  if (!inFile)\n    // 未找到合法字符；返回空字符串。\n    return letters;\n\
  \  else\n  {// 读取并收集字符。\n    do\n    {\n      letter = tolower(letter);\n      letters\
  \ = letters + letter;\n      inFile.get(letter);\n    } while (isalnum(letter) &&\
  \ inFile);\n  }\n  return letters;\n}\n\nListType::ListType()\n{\n  root = NULL;\n\
  }\n\nvoid Process(TreeNode*& tree, std::string letters)\n{\n  if (tree == NULL)\n\
  \  {\n    tree = new TreeNode;\n    tree->info.word = letters;\n    tree->info.count\
  \ = 1;\n    tree->left = NULL;\n    tree->right = NULL;\n }}\n else if (tree->info.word\
  \ == letters)\n   tree->info.count++;\n else if (tree->info.word > letters)\n  \
  \ Process(tree->left, letters);\n else\n   Process(tree->right, letters);\n}\n\n\
  void ListType::PutOrIncrement(string letters)\n{\n  Process(root, letters);\n}\n\
  \nvoid Print(TreeNode*& tree, ofstream& outFile)\n{\n  if (tree != NULL)\n  {\n\
  \    Print(tree->left, outFile);\n    outFile << tree->info.word;\n    outFile <<\
  \ \" \" << tree->info.count;\n    outFile << endl;\n    Print(tree->right, outFile);\n\
  \  }\n}\n\nvoid ListType::PrintList(ofstream& outFile)\n{\n  Print(root, outFile);\n\
  }\n```\n\n我们将创建索引的剩余问题留作一项编程作业。作为该程序的测试计划，我们可以取一个文本文件，手动计算单词和频率，并运行程序以检查答案。在网络上，`Frequency.out`\
  \ 文件包含了在 `Words.cpp` 文件上运行程序的结果，该程序使用 `History.in` 文件作为输入数据。\n\n#### 总结\n\n在本章中，我们看到了如何使用二叉树来结构化排序信息，以减少对任何特定元素的搜索时间。对于需要直接访问排序结构中元素的应用程序来说，二叉搜索树是一种非常有用的数据类型。如果树是平衡的，我们可以通过\
  \ `O(log[2]N)` 操作访问树中的任何节点。二叉搜索树结合了快速随机访问（类似于对线性列表进行二分查找）与链式结构的灵活性。\n\n我们还看到可以使用递归非常优雅且简洁地实现树操作。这一结果是合理的，因为二叉树本身就是一种递归结构：树中的任何节点都是另一个二叉树的根。每当我们树中向下移动一层（从一个节点向右或向左路径）时，我们将当前树的大小减半，这是一个典型的“规模缩小”案例。我们还看到了迭代替代递归的情况（`PutItem`\
  \ 和 `DeleteItem`）。\n\n#### 练习题\n\n1. 二叉搜索树的深度对于搜索效率意味着什么？\n2. 拥有 100 个节点的二叉搜索树最多有多少层？\n\
