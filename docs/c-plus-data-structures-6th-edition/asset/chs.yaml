  \ 应用 `new` 为新元素分配空间并将‘A’放入该空间。接下来，我们想将‘A’链到旧的列表顶部元素‘D’。我们可以通过让一个元素“指向”下一个元素来在两个元素之间建立联系；也就是说，我们可以在每个列表元素中存储下一个元素的地址。为了做到这一点，我们需要修改节点类型。让列表中的每个节点包含两个部分：`info`\
  \ 和 `next`。`info` 成员包含列表用户的数据——例如，一个字符。`next` 成员包含列表中下一个元素的地址。单个节点如图图 3.10 所示。\n\
  \n如你所示，每个节点的 `next` 成员指向列表中的下一个节点。最后一个节点的 `next` 成员呢？我们不能让它保持未赋值。列表最后一个节点的 `next`\
  \ 成员必须包含一个不是有效地址的特殊值。<cstddef>` 中提供的特殊指针常量 `NULL` 表示“此指针不指向任何内容”。我们可以将 `NULL` 放在最后一个节点的\
  \ `next` 成员中，以标记列表的结束。在图中，我们使用跨越 `next` 成员的斜杠来表示 `NULL` 指针。\n\n在章的前面我们引入了一种包含节点抽象的列表设计术语（参见图\
  \ 3.11）。\n\n![](img/f03-13.jpg)\n\n图 3.13 修改指针时要小心\n\n将新节点连接到列表中的（之前的）第一个节点是一个步过程：\n\
  \n注意这些任务的顺序至关重要。如果我们在让 `Next` 指向列表开头之前更改了 `listData` 指针，我们将丢失对列表节点的访问！（参见图 3.13）。当我们处理链式结构时，这种情况通常是真实的：你必须非常小心地按照正确的顺序更改指针，以免丢失对任何数据的访问。\n\
  \n在编写此算法之前，让我们看看列表数据是如何声明的。记住，从 `UnsortedType` 用户的视角来看，什么都没有改变；成员函数 `PutItem` 的原型与基于数组的实现相同。\n\
  \n```cpp\nvoid PutItem(ItemType newItem);\n```\n\n`ItemType` 仍然是用户想要放入列表的数据类型。然而，`Unsorted\
  \ Type` 类需要新的定义。它不再是一个带有数组成员来存放项的类；它的成员是 `listData`，指向单个节点（列表顶部）的指针。`listData` 指向的节点有两个部分，`info`\
  \ 和 `next`，这暗示了一个 C++ 结构或类。我们选择将 `NodeType` 结构结构而不是类，因为结构中的节点是被动的。它们由 `UnsortedType`\
  \ 的成员函数处理。\n\n![](img/f03-14.jpg)\n\n图 3.14 带有两个元素的荣誉榜列表（尚未调用 `ResetList`）\n\n\n\
  \n\n为了实现无序列表（Unsorted List）ADT，除了项目项列表外，我们还需要记录关于该结构的两个信息。`GetLength` 操作返回列表中项目项的个数。在基于数组的实现中，`length`\
  \ 成员定义了列表在数组中的范围。因此，`length` 成员是必须存在的。在基于链表的列表中，我们有两种选择：既可以保留一个 `length` 成员，也可以在每次调用\
  \ `GetLength` 操作时重新计算元素个数。保留 `length` 成员意味着在每次调用 `PutItem` 时需要执行一次加法操作，在每次调用 `DeleteItem`\
  \ 时需要执行一次减法操作。哪种方式更好呢？我们无法在抽象层面确定；这取决于 `GetLength`、`PutItem` 和 `DeleteItem` 操作的相对使用频率。在这里，让我们通过在\
  \ `UnsortedType` 类中包含 `length` 成员来显式地跟踪列表的长度。\n\n`ResetList` 和 `GetNextItem` 要求我们在迭代期间跟踪当前位置，因此我们需要一个\
  \ `currentPos` 成员。在基于数组的实现中，`currentPos` 是数组索引。在链表中的逻辑等价物是什么？是一个指针。图 3.14 描述了这种结构。\n\
  \n```cpp\nstruct NodeType;\n\nclass UnsortedType\n{\npublic:\n  UnsortedType();\n\
  \  void MakeEmpty();\n  bool IsFull() const;\n  int GetLength() const;\n  ItemType\
  \ GetItem(ItemType item, bool& found);\n  void PutItem(ItemType item);\n  void DeleteItem(ItemType\
  \ item);\n  void ResetList();\n  ItemType GetNextItem();\n\nprivate:\n  NodeType*\
  \ listData;\n  int length;\n  NodeType* currentPos;\n};\n```\n\n完成规格的函数头（原型）与基于数组的实现完全相同。请记住，类的规格是用户看到的接口。接口文档告诉用户这些操作的作用，这不会随着实现方式而改变。然而，在链式实现中，我们的私有数据字段是不同的：`currentPos`\
  \ 和 `listData` 是指向节点的指针。\n\n`NodeType` 是一个结构体，包含用户的数据以及指向下一个节点的指针。在定义 `NodeType`\
  \ 之前，我们通过以下语句告知编译器我们将使用指向 `NodeType` 的指针：\n\n```cpp\nstruct NodeType;\n```\n\n在类之前使用。\n\
  \n这条语句被称为前向声明（forward declaration），类似于函数原型：在标识符被完全定义之前，告知编译器该标识符的。`NodeType` 的定义（所示）后出现在头文件或实现文件中。\n\
  \n```cpp\nstruct NodeType\n{\n  ItemType info;\n  NodeType* next;\n};\n```\n\n在查看其他操作之前，让我们先完成\
  \ `PutItem` 的实现。\n\n#### 函数 `PutItem`\n\n这里是收集在一起的详细算法片段。表 3.1 总结了设计与代码术语之间的关系。使用此表，我们可以编写函数\
  \ `PutItem` 的代码。\n\n| 设计符号 | C++ 代码 |\n| --- | --- |\n| Node(location) Info(location)<br>Next(location)<br>Set\
  \ location to Next(location)<br>Set Info(location) to value | |\n\n```cpp\n*location\n\
  location->info\nlocation->next\nlocation = location->next\nlocation->info = value\n\
  ```\n\n表 3.1 比较节点设计符号与 `C++ 代码`\n\n我们使用一个类型为 `NodeType*` 的局部变量 `location`。前两个任务非常简单：\n\
  \n```cpp\n// 为新项分配空间。\nlocation = new NodeType;\n\n// 将新项放入分配的空间中。\nlocation->info\
  \ = newItem;\n```\n\n图 3.15(a) 中的阴影区域对应于 `location`，(b) 中的阴影区域对应于 `*location`，(c)\
  \ 中的阴影区域对应于 `location->info`。`location->info` 与用户类型相同，因此我们可以将 `newItem` 赋值给它。到目前为止顺利。\n\
  \n现在是链接任务：\n\n`Next(location)` 是 `location` 所指向的节点的 `next` 成员。我们可以像访问 `info` 成员一样访问它：`location->next`。我们可以向这个字段中放入什么呢？它被声明为指针，因此我们可以给它分配另一个相同指针类型的值。我们希望此成员指向列表的顶端节点。由于我们有一个指向列表第一个节点的指针（`listData`），此赋值非常简单。\n\
  \n![](img/f03-15.jpg)\n\n图 3.15 指针解引用与成员选择\n\n```cpp\nlocation->next = listData;\n\
  ```\n\n最后，我们需要通过让 `listData` 指向新节点来完成链接。`listData` 被声明为指针，我们可以给它分配另一个相同指针类型的值。由于我们有一个指向新节点的指针（局部变量\
  \ `location`），可以进行赋值：\n\n```cpp\nlistData = location;\n```\n\n这是完整的 `PutItem` 函数。\n\
  \n```cpp\nvoid UnsortedType::PutItem(ItemType item)\n// item 在列表中；长度已经增加。\n{\n \
  \ NodeType* location;              // 声明一个指向节点的指针\n  location = new NodeType;  \
  \       // 获取新节点\n  location->info = item;           // 在节点中存储\n  location->next\
  \ = listData;       // 保存第一个节点的地址\n  listData = location;             // 进入外部指针\n\
  \  length++;                        // 长度加 1\n}\n```\n\n这种这种算法适用于包含至少一个元素的列表。从无序列表\
  \ ADT 实现者的角度来看，其余操作的算法与顺序（基于数组的）实现非常相似。\n\n#### 构造函数\n\n为了初始化空列表，我们只需将 `listData`（指向列表的外部指针）设置为\
  \ `NULL` 并 `length` 设置为 0。这是实现该操作的类构造函数：\n\n```cpp\nUnsortedType::UnsortedType()\
  \ // 类构造函数\n{\n  length = 0;\n  listData = NULL;\n}\n```\n\n![](img/f03-16.jpg)\n\
  \n图 3.16 向空列表插入项\n\n#### 观察操作\n\n`IsFull` 函数如何？使用动态分配节点而非数组，我们不再对列表的大小限制。我们可以继续获取更多节点，直到耗尽内存。ISO\
  \ C++ 标准规定，当没有更多可用空间时，C++ 中的 `new` 运算符会抛出 `bad_alloc` 异常。`bad_alloc` 异常定义在 `<new>`\
  \ 头文件中。异常需要被处理，因为未处理的异常会导致程序崩溃。\n\n```cpp\nbool UnsortedType::IsFull() const\n//\
  \ 如果堆上没有空间容纳另一个 ItemType 则返回 true；否则返回 false。\n{\n  NodeType* location;\n  try\n\
  \  {\n    location = new NodeType;\n    delete location;\n    return false;\n  }\n\
  \  catch(std::bad_alloc exception)\n  {\n    return true;\n  }\n}\n```\n\n与基于数组的实现一样，`GetLength`\
  \ 操作直接返回 `length` 数据成员。\n\n```cpp\nint UnsortedType::GetLength() const\n// 后置：返回列表中的项目项个数。\n\
  {\n  return length;\n}\n```\n\n\n\n\n链表的 `MakeEmpty` 操作比其对应的顺序列表实现要更复杂，因为元素所使用的动态分配空间必须逐个节点地释放。数据成员\
  \ `listData` 在列表离开作用域时会被释放，但由 `listData` 指向的节点不会。我们必须遍历列表，使用 `delete` 运算符将节点返回空闲存储区。最简单的方法是断开列表中的每个连续节点并释放它。我们如何知道链列表中是否还有“更多节点”呢？只要\
  \ `listData` 不为 `NULL`，列表就不为空。因此，循环的终止条件是 `while(listData != NULL)`。我们还必须将 `length`\
  \ 设置为零。\n\n```cpp\nvoid UnsortedType::MakeEmpty()\n\n// Post: 列表为空；所有项均已释放。\n\n\
  {\n  NodeType* tempPtr;\n  while (listData != NULL)\n  {\n    tempPtr = listData;\n\
  \    listData = listData->next;\n    delete tempPtr;\n  }\n  length = 0;\n}\n```\n\
  \n### Function GetItem\n\n链表实现的算法与基于数组的实现相同。给定参数 `item`，我们遍历列表以寻找 `item.ComparedTo(Info(location))`\
  \ 返回 `EQUAL` 的位置。区别在于我们遍历列表的方式以及如何访问 `Info(location)` 并将其作为参数传递给 `ComparedTo` 的。\n\
  \n当我们编写基于数组的函数时，我们直接用索引表示法替换了列表表示法。我们可以在链表中直接用指针表示法替换列表表示法吗？让我们尝试一下。算法如下；替换部分已用**粗体**标记以示强调。\n\
  \n让我们看看这个算法，并通过检查结束时 `location` 的值来确保替换符合我们的意图。有两种情况：\n\n1. `location = NULL`。如果在到达列表末尾时没有找到键（key）与\
  \ `item` 之键相等的项，则说明该项不在列表中。`location` 正确地拥有了空指针值（参见 图 3.17a ）。\n\n2. `item.ComparedTo(location->info)\
  \ = EQUAL`。在这种情况下，我们已经在列表中找到了该元素并将其复制到 `item` 中（参见 图 3.17b ）。\n\n![](img/f03-17.jpg)\n\
  \n图 3.17 在无序链表中检索项\n\n我们现在可以编写该算法了，并且有理由相信它是正确的。\n\n```cpp\nItemType UnsortedType::GetItem(ItemType\
  \ item, bool& found)\n\n// Pre:  item 的键成员（s）已初始化。\n// Post: 如果 found 为真，则 item\
  \ 的键与列表中某个元素的键匹配\n//       并返回该元素的副本；\n//       否则，返回 item。\n{\n  bool moreToSearch;\n\
  \  NodeType* location;\n  location = listData;\n  found = false;\n  moreToSearch\
  \ = (location != NULL);\n  while (moreToSearch && !found)\n  {\n    switch (item.ComparedTo(info[location]))\n\
  \    {\n      case LESS    :\n      case GREATER : location = location->next;\n\
  \                     moreToSearch = (location != NULL);\n                     break;\n\
  \      case EQUAL   : found = true;\n                     item = location->info;\n\
  \                     break;\n    }\n  }\n  return item;\n}\n```\n\n### Function\
  \ DeleteItem\n\n为了删除一个项，我们必须首先找到它。在图 3.18 中，我们看到 `location` 仍然指向我们正在搜索的项所在的节点（即要移除的节点）。为了移除它，我们必须更改前一个节点中的指针。也就是说，前一个节点的\
  \ `next` 数据成员必须被更改为被删除节点的 `next` 数据成员。\n\n`location` 现在指向一个不再需要的节点，因此我们必须使用 `delete`\
  \ 运算符将其释放空间。\n\n由于我们从规范中知道要删除的项在列表中，我们可以稍微修改搜索算法。与其将我们正在搜索的项与 `Info(location)` 中的信息进行比较，我们不如将其与\
  \ `Info(location->next)` 进行比较。当我们找到匹配项时，我们同时拥有指向前一个节点（`location`）和包含待删除项节点（`location->next`）的指针。注意，删除第一个节点必须是一个特殊情况，因为指向列表的外部指针（`listData`）必须更改。删除最后一个节点是特殊情况吗？不是。被删除节点的\
  \ `next` 数据成员是 `NULL`，它存储在 `Node(location)` 的 `next` 数据成员中，这正是它所属的地方。\n\n![](img/f03-18.jpg)\n\
  \n图 3.18 删除中间节点和删除第一个节点\n\n```cpp\nvoid UnsortedType::DeleteItem(ItemType item)\n\
  \n// Pre:  item 的键已初始化。\n//       列表中的某个元素其键与 item 的键匹配。\n// Post: 列表中没有任何元素的键与\
  \ item 的键匹配。\n{\n  NodeType* location = listData;\n  NodeType* tempLocation;\n \
  \ // 定位要删除的节点。\n  if (item == listData->info)\n  {\n    tempLocation = location;\
  \      // 保存指针\n    listData = listData->next;    // 删除第一个节点\n  }\n  else\n  {\n\
  \    while ((item.ComparedTo(location->next)->info) != EQUAL)\n      location =\
  \ location->next;\n    tempLocation = location->next; // 保存节点\n    location->next\
  \ = location->next->next;\n  }\n  delete tempLocation;     // 删除节点\n}\n```\n\n注意，我们必须保存指针以便返回可用空间。\n\
  \n### Functions ResetList and GetItem\n\n无序列表 ADT 规范定义“当前位置”为遍历列表期间访问的项的位置。在基于数组的实现中，`ResetList`\
  \ 将 `currentPos` 初始化为 -1，而 `GetItem` 增加 `currentPos` 并返回 `info[currentPos]`。对于 `currentPos`，我们使用特殊值\
  \ -1 表示“第一个项之前”。在链表实现中，我们可以用什么特殊指针值表示“第一个项之前”？我们可以使用空指针值 `NULL`。因此`ResetList` 将\
  \ `currentPos` 成员设置为 `NULL`，而 `GetItem` 将 `currentPos` 设置为 `listData`（如果 `currentPos`\
  \ 为 `NULL`）或 `currentPos->next`（如果它不为 `NULL`），然后返回 `currentPos->info`。\n\n```cpp\n\
  void UnsortedType::ResetList()\n\n// Post: 当前位置已初始化。\n{\n  currentPos = NULL;\n\
  }\n\nItemType UnsortedType::GetNextItem()\n\n// Pre:   自上次调用后没有执行转换器。\n// Post:\
  \  返回列表下一项的副本。\n//        当到达列表末尾时，currentPos\n//        将重置。\n{\n  if (currentPos\
  \ == NULL)\n    currentPos = listData;\n  else\n    currentPos = currentPos->next;\n\
  \n  return currentPos->info;\n}\n```\n\n回顾规范，`GetNextItem` 的体不需要检查是否越了列表末尾。那是调用者的责任。`GetNextItem`\
  \ 的预条件是当前位置的项不是列表中的最后一个。然而，在处理链表时，错误可能会导致程序在没有任何警告的情况下崩溃。因此，我们更改了后条件，显示如果访问了最后一项，列表将重新开始。\n\
  \n这是 `UnsortedType` 类链表版本的实现文件。\n\n\n\n\n```cpp\n// 此文件包含类 UnsortedType \n// 的链表实现。\n\
  \n#include \"UnsortedType.h\"\n\nUnsortedType::UnsortedType()  // 类构造函数\n{\n  length\
  \ = 0;\n  listData = NULL;\n}\n\nbool UnsortedType::IsFull() const\n// 如果空闲中没有空间容纳另一个\
  \ ItemType\n// 则返回 true；否则返回 false。\n{\n  NodeType* location;\n  try\n  {\n    location\
  \ = new NodeType;\n    delete location;\n    return false;\n  }\n  catch(std::bad_alloc\
  \ exception)\n  {\n    return true;\n  }\n}\n\nint UnsortedType::GetLength() const\n\
  // 后置条件：返回列表中项的数量。\n{\n  return length;\n}\n\nvoid UnsortedType::MakeEmpty()\n//\
  \ 后置条件：列表为空；所有项均已释放内存。\n{\n  NodeType* tempPtr;\n  while (listData != NULL)\n  {\n\
  \    tempPtr = listData;\n    listData = listData->next;\n    delete tempPtr;\n\
  \  }\n  length = 0;\n}\n\nvoid UnsortedType::PutItem(ItemType item)\n// item 已在列表中；length\
  \ 已增加。\n{\n  NodeType* location;              // 声明一个指向节点的指针\n  location = new NodeType;\
  \         // 获取一个新节点\n  location->info = item;           // 将项存储在节点中\n  location->next\
  \ = listData;       // 将第一个节点的地址存储在// 新节点的 next 字段中\n  listData = location;    \
  \         // 将新节点的地址存储在// 外部指针中\n  length++;                        // 增加列表长度\n\
  }\n\nItemType UnsortedType::GetItem(ItemType item, bool& found)\n// 前置条件：item 的键成员已初始化。\n\
  // 后置条件：如果找到，则 item 的键与列表中某个元素的键 \n//       匹配，并返回该元素的副本；\n//       否则，返回 item 本。\n\
  {\n  bool moreToSearch;\n  NodeType<ItemType>* location;\n  location = listData;\n\
  \  found = false;\n  moreToSearch = (location != NULL);\n  while (moreToSearch &&\
  \ !found)\n  {\n    switch (item.ComparedTo(info[location]))\n     {\n      case\
  \ LESS    :\n      case GREATER : location = location->next;\n                 \
  \    moreToSearch = (location != NULL);\n                     break;\n      case\
  \ EQUAL   : found = true;\n                     item = location->info;\n       \
  \              break;\n     }\n  }\n  return item;\n}\n\nvoid UnsortedType::DeleteItem(ItemType\
  \ item)\n// 前置条件：item 的键已初始化。\n//       列表中有一个元素的键与 item 的键匹配。\n// 后置条件：列表中不再有任何键与\
  \ item 的键匹配的元素。\n{\n  NodeType<ItemType>* location = listData;\n  NodeType<ItemType>*\
  \ tempLocation;\n  // 定位要删除的节点。\n  if (item == listData->info)\n  {\n    tempLocation\
  \ = location;\n    listData = listData->next;            // 删除第一个节点。\n  }\n  else\n\
  \  {\n    while (item.ComparaedTo(location->next)->info) != EQUAL)\n      location\
  \ = location->next;\n    // 删除 location->next 节点\n     tempLocation = location->next;\n\
  \    location->next = (location->next)->next;\n  }\n  delete tempLocation;\n  length--;\n\
  }\n\nvoid UnsortedType::ResetList()\n// 后置条件：当前位置已初始化。\n{\n  currentPos = NULL;\n\
  }\n\nItemType UnsortedType::GetNextItem()\n// 后置条件：返回列表中下一个项的副本。\n//        当到达列表末尾时，currentPos\
  \ 将\n//        重置并重新开始。\n{\n  if (currentPos == NULL)\n    currentPos = listData;\n\
  \  else\n     currentPos = currentPos->next;\n  return currentPos->info;\n}\n```\n\
  \n这里是链表类 `UnsortedList` 的 UML 图。\n\n![](img/f0187-01.jpg)\n\n注意，`UnsortedType` 的\
  \ CRC 卡没有变化，因为它不包含实现信息。然而，用于维护文档的 UML 图发生了变化。它显示了数据字段。同样注意，`ItemType` 的 UML 图不再包含对\
  \ `MAX_ITEMS` 的引用。为数组版本开发的测试计划对于链表版本同样有效。\n\n#### 类析构函数\n\n我们在设计链表实现中的 `MakeEmpty`\
  \ 函数时指出，当列表超出作用域时，`listData` 会被释放，但 `listData` 指向的节点不会。因此，我们必须包含一个类析构函数（destructor）。类析构函数是一个与类构造函数同名的成员函数，区别是在类型名前前带有一个波浪号（`~`）。当类对象超出作用域时，析构函数会被隐式调用——例如，当控制离开声明对象的块时。我们在类定义的\
  \ `public` 部分包含了以下析构函数的原型声明：\n\n```\n~UnsortedType(); // 析构函数。\n```\n\n并按如下实现该函数：\n\
  \n```cpp\nUnsortedType::~UnsortedType()\n\n// 后置条件：列表为空；所有项均已释放内存。\n{\n  NodeType*\
  \ tempPtr;\n  while (listData != NULL)\n  {\n    tempPtr = listData;\n    listData\
  \ = listData->next;\n    delete tempPtr;\n  }\n  length = 0;\n}\n```\n\n看到这个析构函数与清空列表的区别了吗？不使用分配空间的实现通常不需要析构函数。\n\
  \n### 3.5 比较排序实现\n\n现在我们来比较排序 ADT 的顺序和链表实现。为了确定这些函数的大 O 表示法，我们必须首先确定规模因子（size factor）。在这里我们考虑的是操作列表的算法。因此，规模因子是列表项：`length`。\n\
  \n我们考虑两个不同的因素：存储结构所需的内存以及解决方案执行的工作量。最大尺寸的数组无论使用了多少插槽，所需的内存都是相同的，因为我们需要为 `MAX_ITEMS`\
  \ 留空间。使用动态分配空间的链表实现只需要运行时实际元素的空间。然而，每个节点元素更大，因为我们必须存储链接（`next`）以及用户的数据。\n\n我们可以使用大\
  \ O 表示法来比较两种实现的效率。大多数操作在两种实现中几乎相同。类构造函数、`IsFull`、`Reset` 和 `GetNextItem` 函数在两种实现中显然具有\
  \ O(1) 复杂度，因为它们不依赖于列表中的数量。`MakeEmpty` 对于顺序列表是 O(1) 操作，但对于链表则变为 O(N) 操作。顺序实现仅仅将列表标记为空，而链表实现必须访问每个列表元素以释放其动态分配的空间。\n\
  \n`GetLength` 在数组实现中始终是 O(1)，但在链表版本中我们有选择。通过维护插入和删除元素的计数，我们使其变为 O(1)。如果我们选择在每次调用函数时计算元素来实现\
  \ `GetLength`，那么该操作将是 O(N)。这里的教训是，你必须知道 `GetLength` 在链表实现是如何实现的，才能指定其大 O 度量。\n\n\
  `GetItem` 操作在两种实现中虚拟相同。从第一个元素开始，算法一个接一个检查元素，直到找到正确的元素。由于它们必须遍历列表中的所有元素，两种实现中的循环都是\
  \ O(N)。\n\n\n\n\n\n由于列表是无序的，我们可以选择将新项放入一个可以直接访问的位置：基于数组的实现中的末尾，或者链表版本中的头部。因此，`PutItem`\
  \ 在两种实现中的复杂度是相同的：均为 `O(1)`。在这两种实现中，`DeleteItem` 的复杂度均为 `O(N)`，因为必须在列表中查找要删除的项，尽管在链表版本实际删除操作是\
  \ `O(1)`，而在基于数组的版本中是 `O(N)`。\n\n表 3.2 总结了这些复杂度。我们将 `length` 替换为 `N`，这是尺寸因子的通用名称。对于那些需要初始搜索的操作，我们将\
  \ Big-O 分为两部分：搜索和搜索之后的操作。\n\n| | | 数组实现 | 链表实现 |\n| --- | --- | --- | --- |\n| 类构造函数\
  \ | `O(1)` | `O(1)` |\n| `MakeEmpty` | `O(1)` | `O(N)` |\n| `IsFull` | `O(1)` |\
  \ `O(1)` |\n| `GetLength` | `O(1)` | `O(1)` |\n| `ResetList` | `O(1)` | `O(1)` |\n\
  | `GetNextItem` | `O(1)` | `O(1)` |\n| `GetItem` | `O(N)` | `O(N)` |\n| `PutItem`\
  \ | | | |\n| | 查找 | `O(1)` | `O(1)` |\n| | 插入 | `O(1)` | `O(1)` |\n| | 组合 | `O(1)`\
  \ | `O(1)` |\n| `DeleteItem` | | | |\n| | 查找 | `O(N)` | `O(N)` |\n| | 删除 | `O(1)`\
  \ | `O(1)` |\n| | 组合 | `O(N)` | `O(N)` |\n\n表 3.2 有序列表操作的 Big-O 比较\n\n#### 总结\n\n\
  在本章中，我们创建了一个表示列表的 ADT（抽象数据类型）。无序列表 ADT 假设列表元素不是按键排序的。我们从三个维度对其进行了研究：逻辑层面、应用层面和实现层面。\n\
  \n我们展示了封装无序列表 ADT 的类的两种截然不同的实现。第一种是基于数组的实现，列表中的项存储在数组中；第二种是链表实现，项存储在相互连接的节点中。我们研究了\
  \ C++ 指针数据类型，它允许链表中的节点进行链联。\n\n为了使软件具有尽可能的可重用性，每个 ADT 的规范规定 ADT 的用户必须准备一个类，用于定义位于每个容器类中的对象。定义中必须包含一个比较该类两个对象的成员函数\
  \ `ComparedTo`。该函数返回 `RelationType` 中的一个常量之一：`LESS`（小于）、`EQUAL`（相等）、`GREATER`（大于）。通过要求用户提供关于列表中列表中对象的这些信息，ADT\
  \ 的代码变得是非常通用的。\n\n使用 Big-O 记法对两个 ADT 的操作进行了比较。在无序列表中插入项在两种实现中的复杂度均为 `O(1)`。两者的删除操作复杂度均为\
  \ `O(N)`。在无序列表中搜索的复杂度为 `O(N)`；在有序列表中搜索，如果使用二分查找，则复杂度为 `O(log[2]N)`。\n\n案例研究模拟了一副扑牌。通过比较两张扑牌，展示了抽象在\
  \ `RelationType` 枚举类型中的应用。扑牌使用 `UnsortedType` 的派生类来实现，论证了继承的价值。\n\n图 3.19 显示了案例研究中列表数据三种视图之间的关系。\n\
