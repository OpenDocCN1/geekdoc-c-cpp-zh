  \ |\n\n表 A.17 `string` 的 I/O 操作\n\n### `list<T>` 类\n\n`list` 是 STL 三种序列容器中的第二种。`list`\
  \ 是一种顺序访问容器，它针对列表内任意位置的插入和删除进行了优化。尽管 C++ 标准没有规定任何特定的实现，但对快速插入和删除的需求，以及对双向迭代器的支持，加上不要求随机访问，这暗示了其实现应为双向链表。\n\
  \n要创建一个类型为 `list<T>`的对象，数据类型 `T` 必须是可赋值和可拷贝的。也就是说，如果 `T` 是一个类或结构体类型，则必须为 `T` 定义\
  \ `operator=` 和拷贝构造函数。\n\n以下是 `list` 容器的一些属性：\n\n*   `list` 提供顺序访问，因此没有索引访问，也没有\
  \ `at()` 成员函数。\n*   迭代器是双向的。\n*   在列表的任何位置都可以在 0(1) 时间内完成插入和删除。\n*   插入和删除不会使指向未参与删除项目的迭代器失效。\n\
  *   有许多成员函数可以完成与外部 STL 算法相同的任务，但它们对于 `list` 来说更快，因为它们改变的是内部指针而不是移动数据。\n*   `list`\
  \ 提供了最佳异常安全性，因为与其他容器相比，它有更多的操作要么成功，要么不产生影响。\n\n正如我们在处理 `vector` 和 `string` 时所的那样，我们现在给出一系列表格（表\
  \ A.18−A.24），详细列出了许多（但并非全部）`list` 成员函数。\n\n提醒：迭代器范围 `first`, `pastLast)` 指从由 `first`\
  \ 指定的容器位置开始，但不包括由 `pastLast` 指定的位置。\n\n| `list<T> lst;` | 默认构造函数。将 `lst` 创建为空空列表。\
  \ |\n| `list<T> lst(oldList);` | 拷贝构造函数。将 `lst` 创建为 `oldList` 的拷贝。 |\n| `list<T>\
  \ lst(count);` | 创建一个包含 `count` 个元素的列表，每个元素都通过类型 `T` 的默认构造函数进行构造。 |\n| `list<T>\
  \ lst(count, typeTobj);` | 创建一个包含 `count` 个元素的列表，每个元素都是 `typeTobj`（类型为 `T` 的对象）的拷贝。\
  \ |\n| `list<T> lst(first, pastLast);` | 使用另一个容器中范围 [`first`, `pastLast)` 内的类型 `T`\
  \ 对象初始化一个列表。 |\n| `lst.~list<T>();` | 析构函数。释放分配给 `lst` 的内存。 |\n\n表 A.18 list 构造函数和析构函数\n\
  \n`list` 不提供随机访问。除了解引用迭代器外，列表元素通过成员函数 `front()` 和 `back()` 进行访问。\n\n| `lst.front()`\
  \ | 返回列表中的第一个元素。 |\n| `lst.back()` | 返回列表中的最后一个元素。 |\n\n表 A.19 `list` 元素访问\n\n[表\
  \ A.20 描述了 `list` 的插入和删除操作。注意，类 `list<T>` 提供了删除的成员函数，但也存在用于此目的通用 STL 算法。然而，成员函数优于算法，因为它改变的是内部指针而不是移动数据，因此可能更快。\
  \ |\n\n| `lst.insert(iter, item)` | 在 `iter` 指定的位置之前将 `item` 插入列表。返回一个指向插入元素的迭代器值。\
  \ |\n| `lst.insert(iter, count, item);` | 在 `iter` 指定的位置之前向列表插入 `count` 个 `item`\
  \ 的拷贝。返回类型为 `void`。 |\n| `lst.push_front(item);` | 在列表的头部插入 `item`。 |\n| `lst.push_back(item);`\
  \ | 在列表的末尾追加 `item`。 |\n| `lst.pop_back();` | 移除末尾的元素。 |\n| `lst.pop_front();` |\
  \ 移除开头的元素。 |\n| `lst.remove(item);` | 所有等于 `item` 的列表元素。 |\n| `lst.remove_if(pred);`\
  \ | 所有谓词 `pred` 返回 `true` 的项。参数 `pred` 可以是布尔函数的名称，也可以是函数对象（在本录稍后定义）。 |\n| `lst.erase(iter)`\
  \ |  `iter` 指定位置的元素。返回一个指向下一个元素的迭代器值。 |\n| `lst.erase(first, pastLast)` | 范围 [`first`,\
  \ `pastLast)` 内的所有项。返回一个指向下一个元素的迭代器值。 |\n| `lst.clear();` | 移除列表中的所有项。 |\n\n表 A.20\
  \ `list` 用于插入和删除的成员函数\n\n| `lst1 = lst2;` | 在移除 `lst1` 中的所有项后，将 `lst2` 的项拷贝到 `lst1`。\
  \ |\n| `lst.assign(first, pastLast);` | 在移除 `lst1` 中的所有项后，将范围 [`first`, `pastLast)`\
  \ 中的类型 `T` 项。 |\n| `lst1.swap(lst2);` | 交换列表 `lst1` 和 `lst2` 的内容。 |\n\n表 A.21 list\
  \ 赋值和交换\n\n| `list<T>::iterator itr;` | 为 `list<T>` 创建双向迭代器。 |\n| `list<T>::reverse_iterator\
  \ itr;` | 为 `list<T>` 创建反向迭代器。 |\n| `lst.begin()` | 返回指向第一个元素的双向迭代器。 |\n| `lst.end()`\
  \ | 返回指向最后一个位置的双向迭代器。 |\n| `lst.rbegin()` | 返回指向最后一个元素的反向迭代器。 |\n| `lst.rend()`\
  \ | 返回指向容器第一个位置的反向迭代器。 |\n\n表 A.22 `list` 与迭代器相关的成员函数\n\n| `lst.empty()` | 如果 `lst`\
  \ 不包含项则返回 `true`。结果与 `lst.size() == 0` 相同，但 `lst.empty()` 可能更快。 |\n| `lst.size()`\
  \ | 返回列表中项的数量。 |\n| `lst.resize(newSize);` | 如果 `newSize > lst.size()`，则在末尾追加 `newSize\
  \ - lst.size()` 个默认构造的类型 `T` 实例。 |\n| | 否则，如果 `newSize < lst.size()`，则移除最后 `lst.size()\
  \ - newSize` 个项，否则不操作。 |\n| `lst.resize(newSize, typeTobj);` | 如果 `newSize > lst.size()`，则在末尾追加\
  \ `newSize - lst.size()` 个 `typeTobj` 拷贝。 |\n| | 否则，如果 `newSize < lst.size()`，则移除最后\
  \ `lst.size() - newSize` 个项，否则不操作。 |\n| `lst1 == lst2` | 如果两个列表项的数量相同且按顺序相同的项，则返回\
  \ `true`，否则返回 `false`。 |\n| `lst1 < lst2` `lst1 > lst2` `lst1 <= lst2` `lst1 >=\
  \ lst2` | 比较按字典序进行。（对相邻项进行比较。第一对不等的项决定了哪些顺序关系返回 `true`。） |\n\n表 A.23 `list` 与大小和比较相关的成员函数\n\
  \n| `lst1.splice(iter, lst2);` | 要求：`&lst1 != &lst2`。 |\n| | ：将 `lst2` 的内容插入到 `lst1`\
  \ 中 `iter` 指定的位置之前，`lst2` 变为空。 |\n| `lst1.splice(position, lst2, iter);` | 移除 `lst2`\
  \ 中 `iter` 指定的元素，并将其插入到 `lst1` 中 `position` 指定的位置之前。 |\n| `lst1.splice(position,\
  \ lst2, first, pastLast);` | 要求：如果 `&lst1 == &lst2`，`position` 不能在 [`first`, `pastLast)`\
  \ 内。 |\n| | ：移除 `lst2` 中范围 [`first`, `pastLast)` 内的所有项，并将它们插入到 `lst1` 中 `position`\
  \ 指定的位置之前。 |\n\n\n\n\n\n| `lst.sort();` | 使用 `<` 运算符比较项，将列表项按升序排序 |\n| `lst.sort(cmp);`\
  \ | 使用比较函数 `cmp` 对列表项进行排序，`cmp` 可以是布尔函数的名称，也可以是一个函数对象（在附录后后部分定义） |\n| `lst1.merge(lst2);`\
  \ | 要求：两个列表中的项均为已排序状态（通过 `<` 运算符排序）。 |\n|   | 效果：从 `lst2` 中移除所有项，并将它们合并到 `lst1`\
  \ 中，使 `lst1` 仍保持有序 |\n| `lst1.merge(lst2, cmp);` | 要求：两个列表中的项均为已排序状态（通过 `cmp` 函数排序）。比较函数\
  \ `cmp` 可以是布尔函数的名称，也可以是一个函数对象（在附录后文部分定义）。 |\n|   | 效果：从 `lst2` 中移除所有项，并将它们合并到 `lst1`\
  \ 中，使 `lst1` 仍保持有序 |\n| `lst.unique();` | 在任何连续的相等项序列中，移除第一个以外的所有项（满足 `==` 关系） |\n\
  | `lst.unique(cmp);` | 在任何连续且满足比较函数 `cmp` 的项序列中，移除第一个以外的所有项，`cmp` 可以是布尔函数的名称，也可以是一个函数对象（在附录后文部分定义）\
  \ |\n| `lst.reverse();` | 反转 `lst` 中项的顺序 |\n\n表 A.24 修改 `lists` 的操作\n\n### `deque<T>`\
  \ 类\n\nSTL 三种序列容器中的第三种是 `deque`。deque 一词（读作“deck”、“deek”或“dee queue”）是双端队列（double-ended\
  \ queue）的缩写。`deque` 容器像 `vector` 一样，提供了对不同长度序列的快速随机访问。与 `vector` 不同，`deque` 在集合的两端都提供了快速的插入和删除。这是通过不仅在\
  \ `deque` 的开头提供预留空间（像 `vector` 那样），还在容器末尾提供预留空间来实现。\n\n以下是 `deque` 和 `vector` 之间的主要区别：\n\
  \n- 在 `deque` 的头部和尾部插入都是快速的（摊均时间 O(1)）。`vector` 仅在尾部快速。\n- 分配给 `vector` 的内存通常是连续的（即内置数组），因此\
  \ `vector` 迭代器通常是 C++ 指针。分配给 `deque` 的内存不保证是连续的，因此迭代器通常被实现为模拟指针的类对象。因此，访问 `deque`\
  \ 中的项往往比访问 `vector` 中的项要慢。\n- 与 `vector` 不同，`deque` 未提供控制重新分配或容量的成员函数，因此除两端以外的任何插入或删除操作都会使\
  \ `deque` 的所有迭代器失效。\n\n在什么时候应该选择 `deque` 而不是 `vector`？如果你需要随机访问以及在头部和尾部频繁插入，那么 `deque`\
  \ 是更好的结构。\n\n表 A.25 显示了 `deque` 成员函数的代表性示例。\n\n| 构造函数、赋值和交换操作 |\n| --- |\n| `deque<T>\
  \ d;` | 默认构造函数。创建一个空的 `deque` 对象 `d`。 |\n| `deque<T> d(otherDeque);` | 拷贝构造函数。创建一个新的\
  \ deque `d` 作为 `otherDeque` 的拷贝。 |\n| `deque<T> d(count);` | 创建包含 `count` 个项的 `deque`，每个项都通过类型\
  \ `T` 的默认构造函数构造 |\n| `deque<T> d(count, typeTobj);` | 创建包含 `count` 个项的 `deque`，每个项都是\
  \ `typeTobj`（类型 `T` 的一个对象）的拷贝 |\n| `d = otherDeque;` | 在移除 deque `d` 中的所有项后，将 `otherDeque`\
  \ 中的所有项拷贝到 `d` |\n| `d.swap(otherDeque);` | 交换 `d` 和 `otherDeque` 的内容 |\n| 元素访问和插入操作\
  \ |\n| `d[index]` | 不带范围检查的索引访问。可以获取或存储索引 `index` 处的元素。 |\n| `d.at(index)` | 带有范围检查的索引访问。如果\
  \ `index` ≥ `d.size()`，则抛出 `out_of_range` 异常。 |\n| `d.front()` | 返回容器中的第一个项。等于 `d[0]`。\
  \ |\n| `d.back()` | 返回容器中的最后一个项。等于 `d[d.size() — 1]`。 |\n| `d.insert(iter, item);`\
  \ | 在 `iter` 指定的位置之前插入 `item`。返回一个指向所插入项的迭代器值。 |\n| `d.insert(iter, first, pastLast);`\
  \ | 在 `iter` 指定的位置之前，从另一个持有类型 T 对象的容器插入 `first` , pastLast)` 范围内的所有项 |\n| `d.push_front(item);`\
  \ | 在 `deque` 的头部插入 `item` |\n| `d.push_back(item);` | 在 `deque` 的尾部插入 `item` |\n\
  | 删除操作 |\n| `d.pop_front();` | 移除 deque 头部的项 |\n| `d.pop_back();` | 移除 deque 尾部的项\
  \ |\n| `d.erase(iter)` | 移除 `iter` 指定位置的项 |\n| `d.erase(first, pastLast)` | 移除 [`first`\
  \ , pastLast)` 范围内的项 |\n| `d.clear();` | 清除 `deque` 中的所有项 |\n| 大小相关操作 |\n| `d.size()`\
  \ | 返回 `deque` 中项的数量 |\n| `d.empty()` | 如果 deque 不包含项则返回 `true` |\n| `d.resize(number);`\
  \ | 将大小更改为 `number` |\n| 迭代器相关操作 |\n| `deque<T>::iterator itr;` | `deque` 的迭代器 |\n\
  | `deque<T>::reverse_iterator itr;` | `deque` 的反向迭代器 |\n| `d.begin()` | 返回 `deque`\
  \ 第一个元素的迭代器 |\n| `d.end()` | 返回最后一个元素之后的迭代器 |\n| `d.rbegin()` | 返回 `deque` 最后一个元素的反向迭代器\
  \ |\n| `d.rend()` | 返回第一个元素之前的反向迭代器 |\n\n表 A.25 `deque` 成员函数\n\n### 容器适配器 `stack`、`queue`\
  \ 和 `priority_queue`\n\n适配器并不直接实现数据的结构。相反，它在用户和现有容器之间提供了一个新的接口。它“适配”一个序列容器的接口以提供适用于栈或队列的操作。\n\
  \n#### `stack` 适配器\n\n任何提供 `empty()`、`size()`、`push_back()`、`pop_back()` 和 `back()`\
  \ 的序列容器都适合作为 `stack` 适配器的容器。所有序列容器——`vector<T>`、`deque<T>` 和 `list<T>` 都满足这些要求。默认情况下，`deque<T>`\
  \ 是 `stack<T>` 适配器使用的容器\n\n[表 A.26 所示的 `stack` 操作对任何学习过本书的人都是熟悉的。\n\n| `stack<int>\
  \ stck;` | 默认构造函数。默认使用 `deque<int>` 存储 `int` 类型项。 |\n| `stack<float, vector<float>\
  \ > stck;` | 默认构造函数。使用 `vector<float>` 存储 `float` 类型项。 |\n| `stack<string, list<string>\
  \ > stck;` | 默认构造函数。使用 `list<string>` 存储 `string` 类型项。 |\n| `stack<char, vector<char>\
  \ > stck(otherStck);` | 拷贝构造函数。将 `stck` 初始化为 `otherStck` 的拷贝，另一个相同类型的栈（即 `stack<char,\
  \ vector<char> >`）。 |\n| `stack<char, vector<char> > stck(charVec);` | 拷贝构造函数。将\
  \ `stck` 初始化为 `charVec` 的拷贝，底层容器类型 `vector<char>` 的对象。 |\n| `stck.empty()` | 如果栈不包含项则返回\
  \ `true`。等同于 `stck.size() == 0` 但可能更快。 |\n| `stck.size()` | 返回容器中项的数量 |\n| `stck.push(item);`\
  \ | 在栈尾部插入 `item` |\n| `stck.pop();` | 移除栈尾部的项 |\n| `stck.top()` | 返回栈顶部的项 |\n\n\
  \n\n\n\n| `stck.push(item);` | 将 `item` 的拷贝推入栈顶 |\n| `stck.pop();` | 要求：`stck.size()`\
  \ > 0 |\n| | 效果：移除并丢弃栈顶元素。返回类型为 `void`。 |\n| `stck.top()` | 要求：`stck.size()` > 0\
  \ |\n| | 效果：返回栈顶元素，但不将其移除 |\n| `stck1 < stck2` `stck1 > stck2` | |\n| `stck1 <=\
  \ stck2` | |\n| `stck1 >= stck2` | |\n| `stck1 == stck2` | |\n| `stck1 != stck2`\
  \ | 如果两个栈的大小相同且所有对应的元素都相等，则它们是相等的。比较按字典序进行。第一对不相等的元素决定了哪个关系运算符返回 `true`。 |\n\n表\
  \ A.26 一 `stack` 成员函数\n\n### `queue` 适配器\n\n任何具有 `back()`、`front()`、`push_back()`、`pop_front()`、`empty()`\
  \ 和 `size()` 成员的序列容器都可以用于存储 `queue<T>` 项目。特别是 `list<T>` 和 `deque<T>` 可以可以使用。默认情况下，`deque<T>`\
  \ 是 `queue<T>` 适配器使用的容器。\n\n注意表 A.27，STL 使用 `push()` 而不是 `enqueue()`，使用 `pop()`\
  \ 而不是 `dequeue()`。无论我们如何称呼该操作，我们处理的都是队列——一种先进先出（FIFO）数据结构——`push()` 和 `pop()` 意味着插入和移除。该结构仍然返回结构中最旧的项目，正如队列应该的那样。\n\
  \n| `queue<int> q;` | 默认构造函数。使用 `deque<int>` 来存储 `int` 类型的项目。`queue<T>` 类支持与表 A.26\
  \ 中所示 `stack<T>` 类相同的构造函数（但 `vector<T>` 不能作为底层容器）。 |\n| `q.empty()` | 如果队列为空则返回\
  \ `true` |\n| `q.size()` | 返回队列中的元素数量 |\n| `q.front()` | 要求：`q.size()` > 0 |\n|\
  \ | 效果：返回队列中的第一个元素 |\n| `q.back()` | 要求：`q.size()` > 0 |\n| | 效果：返回队列中的最后一个元素 |\n\
  | `q.push(item);` | 在队列末尾插入 `item` |\n| `q.pop();` | 要求：`q.size()` > 0 |\n| | 效果：移除并丢弃队列中的第一个元素。返回类型为\
  \ `void`。 |\n| `q1 < q2` `q1 > q2` | |\n| `q1 <= q2` | |\n| `q1 >= q2` | |\n| `q1\
  \ == q2` | |\n| `q1 != q2` | 如果两个队列的大小相同且所有对应的元素都相等，则它们是相等的。比较按字典序进行。第一对不相等的元素决定了哪个关系运算符返回\
  \ `true`。 |\n\n表 A.27 一 `queue` 成员函数\n\n以下程序演示了如何声明和使用 `string` 对象的 `queue`，使用默认底层容器\
  \ `deque<string>` 来存储字符串。\n\n```\n// 使用默认 (deque) 底层容器的队列示例\n\n#include <iostream>\n\
  #include <queue>       // 用于 queue<T> 类\n\n#include <string>      // 用于 string 类\n\
  #include <deque>       // 用于 deque<T> 类\n\nint main()\n{\n  using namespace std;\n\
  \  deque<string> deq;\n  string str;\n  // 构建一个单词列表\n  cout << \"Type some words;\
  \ 'quit' quits:\" << endl << endl;\n  cin >> str;\n  while ( string(\"quit\") !=\
  \  str )\n  {\n    deq.push_back(str);\n    cin >> str;\n  }\n  // 通过拷贝 deque 实例（底层容器）创建\
  \ que1\n  queue<string> que1(deq);\n  // 将 que2 创建为 que1 的拷贝\n  queue<string> que2(que1);\n\
  \  cout << \"The number of strings entered is \" << que1.size() << endl;\n  cout\
  \ << \"que1.front() yields: \" << que1.front() << endl;\n  cout << \"que2.back()\
  \  yields: \" << que2.back()  << endl;\n  cout << \"The strings from que1 are: \
  \ \";\n  while ( !que1.empty())\n  {\n    cout << que1.front() << \" \";\n    que1.pop();\n\
  \  }\n  cout << endl;\n  cout << \"The strings from que2 are:  \";\n  while ( !que2.empty())\n\
  \  {\n    cout << que2.front() << \" \";\n    que2.pop();\n  }\n  cout << endl;\n\
  }\n```\n\n执行此程序的输出：\n\n```\nType some words; 'quit' quits:\nnow is the time quit\n\
  The number of strings entered is 4\nque1.front() yields: now\nque2.back()  yields:\
  \ time\nThe strings from que1 are:  now is the time\nThe strings from que2 are:\
  \  \n```\n\n\n\n\nSTL 提供了一个签名如下的 `sort` 算法（包含所需的头文件和函数原型）：\n\n```cpp\n#include <algorithm>\n\
  \ntemplate <class RandomAccessIterator>\n\nvoid sort( RandomAccessIterator first,\n\
  \n           RandomAccessIterator pastLast );\n```\n\n对于任何支持随机访问迭代器的容器，`sort` 算法都会使用\
  \ `<` 运算符将容器元素元素按升序排序。我们知道 STL 的 `vector` 容器支持随机访问迭代器，因此我们可以这样使用 `sort`：\n\n```cpp\n\
  #include <vector>       // 用于 vector<T> 类\n\n#include <algorithm>    // 用于 sort()\
  \ 函数\n\n   ⋮\n\nvector<int> v;\n\n   ⋮\n\nsort(v.begin(), v.end());  // 对整个 vector\
  \ 进行排序\n```\n\n由于 `sort` 适用于任何迭代器满足其要求的容器，我们可以如下所示对内置数组进行排序。（记住，指向内置数组的指针满足随机访问迭代器的要求。）\n\
  \n```cpp\nint arr[100];\n\n  ⋮\n\nsort(&arr[0], &arr[100]);  // 或者 sort(arr, arr+100);\n\
  ```\n\n在此段代码中，对 `sort` 的调用传递的参数是第一个数组元素的位置以及虚拟的末尾之后的位置（因为 `arr[99]` 是最后一个有效的数组元素）。\n\
  \n### 函数对象\n\n考虑到 STL `sort` 算法，如果我们想将容器按降序而不是升序排序怎么办？STL 提供了另一个版本的 `sort`，其签名如下：\n\
  \n```cpp\n#include <algorithm>\n\ntemplate <class RandomAccessIterator, class Compare>\n\
  \nvoid sort( RandomAccessIterator first,\n\n           RandomAccessIterator pastLast,\
  \ Compare cmp );\n```\n\n在这里，`sort` 调用的第三个参数是用户提供的比较操作，排序是基于该操作完成的。该参数可以是一个函数名，也可以是一个函数对象。为了演示第一种情况，我们可以如下编写一个\
  \ `greater_than` 函数：\n\n```cpp\nbool greater_than( int m, int n)\n\n{\n  return\
  \ m > n;\n}\n```\n\n然后将它的名称作为 `sort` 函数的参数，这样我们就可以对 `vector<int>` 容器进行降序排序：\n\n\
  ```cpp\nsort(v.begin(), v.end(), greater_than);\n```\n\n为了处理第二种情况，我们引入了函数对象的通用概念。简单来说，函数对象是一个行为像函数的类对象。更准确地说，函数对象是一个重载了函数调用运算符（即\
  \ `()`）的类的对象。这里是一个示例：\n\n```cpp\nclass Double\n{\npublic:\n  int operator() ( int\
  \ i )\n  {\n    return 2 * i;\n  }\n};\n```\n\n给定类 `Double`，我们可以如下创建并使用函数对象 `f`：\n\
  \n```cpp\nDouble f;\n\nint n;\n\nn = f(65);\n```\n\n函数调用 `f(65)` 等同于 `f.operator()(65)`\
  \ 并返回结果 130。因此，尽管 `f` 的使用方式像函数名一样，但实际上它是一个类对象的名称。\n\n现在回到我们的排序问题。为了将 `vector<int>`\
  \ 按降序排序，我们可以先写以下类：\n\n```cpp\nclass Greater\n{\npublic:\n  bool operator() ( int\
  \ m, int n )\n  {\n    return m > n;\n  }\n};\n```\n\n然后按照如下方式操作：\n\n```cpp\nGreater\
  \ greater_than;        // 创建一个名为 greater_than\n                             // 的函数对象\n\
  \nsort(v.begin(), v.end(), greater_than);\n```\n\n当然，如果我们想要一个类似于 `Greater` 的类来比较\
  \ `float` 值，另一个来比较 `char` 值等等，我们就必须将所有这些类写成不同名称的不同类。幸运的是，STL 提供了一个模板类 `greater<T>`，让我们可以将基本类型作为模板参数提供，从而避免了我们编写自己的比较类：\n\
  \n```cpp\n#include <functional>   // 用于 greater<T>\n\n  ⋮\n\ngreater<int> greater_than;\
  \   // 创建一个名为 greater_than\n                             // 的函数对象\n\nsort(v.begin(),\
  \ v.end(), greater_than);\n```\n\n注意 `greater<T>` 中的模板参数必须是一个定义了 `>` 运算符的类型 `T`。\n\
  \n除了 `greater<T>`，`<functional>` 头文件还定义了以下模板类：`less<T>`、`less_equal<T>`、`greater_equal<T>`、`equal_to<T>`\
  \ 和 `not_equal_to<T>`。在所有情况下，类型 `T` 必须是一个定义了相应运算符（`<`、`<=` 等）的类型。\n\n### 算法分类\n\n\
  某些 STL 算法是只读的（它们检查但不修改容器中的元素），另一些改变元素的值，而另一些改变元素的顺序。C++ 标准将泛型算法分为根据用途区分的类别。\n\n\
  *   非修改序列操作\n*   变异序列操作\n*   排序及相关操作\n*   合并\n*   集合操作\n*   堆操作\n*   数值操作\n*   复数和数值数组\n\
  \n在接下来的章节中，我们重点关注这些类别中的前三类，并仅展示可用算法的一小部分。在这些算法的描述中，形式参数列表包含以下含义（其中 `T` 是元素的类型）：\n\
  \n*   `Predicate`: 接受一个 `T` 参数并返回 `bool` 值\n*   `Compare`: 接受两个 `T` 参数（以进行比较）并返回\
  \ `bool` 值\n*   `UnaryOperation`: 接受一个 `T` 参数并返回 `T` 类型的值\n*   `BinaryOperation`:\
  \ 接受两个 `T` 参数并返回 `T` 类型的值\n*   `UnaryFunction`: 接受一个 `T` 参数……无返回值\n\n注意：在后续描述中，使用迭代器算术描述位置和范围仅用于描述。我们并不意味着迭代器支持算术。\n\
  \n#### 非修改序列操作\n\n该类的算法被称为非修改，是因为它们不修改容器元素。\n\n*   算法：`count`, `count_if`\n*   摘要：统计容器中匹配特定值或满足谓词的项目数量\n\
  *   签名：\n    ```cpp\n    #include <algorithm>\n\n    template<class InputIterator,\
  \ class T>\n    typename iterator_traits<InputIterator>::difference_type\n    count(\
  \ InputIterator first,\n           InputIterator pastLast,\n           const T&\
  \ value);\n\n    #include <algorithm>\n\n    template <class InputIterator, class\
  \ Predicate>\n    typename iterator_traits<InputIterator>::difference_type\n   \
  \ count_if( InputIterator first,\n              InputIterator pastLast,\n      \
  \        Predicate pred);\n    ```\n*   语法备注：概念上，这两个函数返回整数值，但 `int` 类型可能无法容纳结果。因此，返回类型根据两个迭代器值的差来定义。`typename`\
  \ 关键字告诉编译器后面跟着的是类型名称。`iterator_traits` 是一个包含 `difference_type` 和其他标识符的结构体。`difference_type`\
  \ 类型最终被 `typedef` 为 `ptrdiff_t`，它是两个指针值差的整数类型。\n*   要求：对于 `count` 算法，`T` 必须是一个定义了\
  \ `==` 运算符的类型。\n*   描述：每个算法遍历迭代器范围 [`first`, `pastLast`)。`count` 算法返回范围内匹配参数 `value`\
  \ 的项目数量。`count_if` 算法返回范围内满足谓词 `pred` 的项目数量。\n*   复杂度：每个算法的运行时间与长度成线性，并且具有常数空间复杂度。\n\
  \n*   算法：`find`, `find_if`\n\n\n\n\n\n## find\n\n### 概述\n在容器的子范围内查找匹配特定值的第一个项。谓词版本\
  \ `find_if` 则查找第一个满足算法传递的谓词的项。\n\n### 签名\n```cpp\n#include <algorithm>\n\ntemplate\
  \ <class InputIterator, class T>\n\nInputIterator find( InputIterator first,\n \
  \                   InputIterator pastLast,\n                    const T& value);\n\
  \n#include <algorithm>\n\ntemplate <class InputIterator, class Predicate>\n\nInputIterator\
  \ find_if( InputIterator first,\n                       InputIterator pastLast,\n\
  \                       Predicate pred);\n```\n\n### 节点\n对于 `find` 算法，`T` 必须是一个定义了\
  \ `==` 运算符的类型。\n\n### 描述\n`find` 在范围 [`first`, `pastLast)` 中搜索第一个匹配 `value` 的项。`find_if`\
  \ 在该范围内搜索第一个满足谓词 `pred` 的项。这两个算法如果找到了该项，则返回指向该项的迭代器值。如果没有找到该项，它们返回值 `pastLast`。\n\
  \n#### 复杂度\n每个算法的运行时间与范围长度成线性关系，并且需要常数空间。\n\n## for_each\n\n### 概述\n对范围内的每一个项应用函数\n\
  \n### 签名\n```cpp\n#include <algorithm>\n\ntemplate <class InputIterator, class UnaryFunction>\n\
  \nUnaryFunction for_each( InputIterator first,\n                        InputIterator\
  \ pastLast,\n                        UnaryFunction f);\n```\n\n### 描述\n该算法将函数 `f`\
  \ 应用于范围 [`first`, `pastLast)` 中的每一个项。`f` 的返回值（如果有）会被忽略。算法的返回值是 `f` 在应用于每个容器项后的值。（如果\
  \ `f` 是一个具有其用于跟踪跟踪的成员数据的函数对象，则此返回值是有用的——例如，`f` 被调用的次数。如果 `f` 没有此类成员数据，或者引用的是函数而非函数对象，则调用者通常会忽略该返回值。）\n\
  \n#### 复杂度\n算法的运行时间与迭代器范围的长度成线性关系。它具有常数空间复杂度。\n\n## 变异序列操作\n\n此类类别的算法被描述为变异，因为它们可以更改参数列表中的迭代器所指向的对象。\n\
  \n### copy\n\n### 概述\n将项从一个范围复制到另一个范围\n\n### 签名\n```cpp\n#include <algorithm>\n\n\
  template <class InputIterator, class OutputIterator>\n\nOutputIterator copy( InputIterator\
  \ first,\n                     InputIterator pastLast,\n                     OutputIterator\
  \ result);\n```\n\n### 节点\n`result`（目标范围的起点）不能在范围 [`first`, `pastLast)` 内。此外，目标位置必须有足够的空间来存放复制的项。\n\
  \n### 描述\n该算法从范围 [`first`, `pastLast)` 将项复制到范围 [`result`, `result` `+` (`pastLast`\
  \ − `first`))，从 `first` 开始进行到 `pastLast`。函数返回一个迭代器值，表示目标范围中最后一个之后的位置——即由 (`result`\
  \ + (`pastLast` − `first`)) 所标识的位置。\n\n#### 复杂度\n该算法是线性的，执行了 `pastLast` − `first`\
  \ 次赋值。\n\n### fill \n\n### 概述\n将范围内的每一个项设置为指定的值\n\n### 签名\n```cpp\n#include <algorithm>\n\
  \ntemplate <class ForwardIterator, class T>\n\nvoid fill ( ForwardIterator first,\n\
  \            ForwardIterator pastLast,\n            const T& value );\n```\n\n###\
  \ 描述\n`fill` 遍历范围 [`first`, `pastLast)`，并为每个项赋值 `value`。\n\n#### 复杂度\n该算法与范围长度成线性关系。\n\
  \n### replace, replace_if\n\n### 概述\n`replace` 遍历序列，将每个指定的值替换为另一个值。`replace_if`\
  \ 替换满足谓词的值。\n\n### 签名\n```cpp\n#include <algorithm>\n\ntemplate <class ForwardIterator,\
  \ class T>\n\nvoid replace( ForwardIterator first,\n              ForwardIterator\
  \ pastLast,\n              const T& old_value,\n              const T& new_value\
  \ );\n\n#include <algorithm>\n\ntemplate <class ForwardIterator, class Predicate,\
  \ class T>\n\nvoid replace_if( ForwardIterator first,\n                 ForwardIterator\
  \ pastLast,\n                 Predicate pred,\n                 const T& new_value\
  \ );\n```\n\n### 节点\n对于 `replace` 算法，`T` 必须是一个定义了 `==` 运算符的类型。\n\n### 描述\n`replace`\
  \ 将范围 [`first`, `pastLast)` 中 `old_value` 的所有出现处替换为 `new_value`。算法 `replace_if`\
  \ 将范围 [`first`, `pastLast)` 中所有满足 `pred` 的项替换为 `new_value`。\n\n#### 复杂度\n这些算法与范围长度成线性关系。\n\
  \n### reverse\n\n### 概述\n原地反转范围内项的相对顺序\n\n### 签名\n```cpp\n#include <algorithm>\n\
  \ntemplate <class BidirectionalIterator>\n\nvoid reverse( BidirectionalIterator\
  \ first,\n              BidirectionalIterator pastLast );\n```\n\n### 描述\n`reverse`\
  \ 的效果是交换范围 [`first`, `pastLast)` 中的第一个项和最后一个项，然后是第二个和倒数第二个项，依此类推，直到检测到中间，此时过程停止。\n\
  \n#### 复杂度\n`reverse` 处理所有项，因此时间复杂度与范围长度成线性关系。\n\n### transform\n\n### 概述\n对一个或两个范围的项应用操作，并将结果放在另一个范围内\n\
  \n### 签名\n```cpp\n#include <algorithm>\n\ntemplate <class InputIterator, class OutputIterator,\n\
  \          class UnaryOperation>\n\nOutputIterator transform( InputIterator first,\n\
  \                          InputIterator pastLast,\n                          OutputIterator\
  \ result,\n                          UnaryOperation op );\n\n#include <algorithm>\n\
  \ntemplate <class InputIterator1, class InputIterator2,\n          class OutputIterator,\
  \ class BinaryOperation>\n\nOutputIterator transform ( InputIterator1 first1,\n\
  \                           InputIterator1 pastLast1,\n                        \
  \   InputIterator2 first2,\n                           OutputIterator result,\n\
  \                           BinaryOperation binary_op );\n```\n\n### 节点\n一元操作 `op`\
  \ 和二元操作 `binary_op` 不能有副作用。\n\n### 描述\n对范围 [`first`, `pastLast)` 中的每一个项应用一元操作 `op`，对两个范围\
  \ [`first1`, `pastLast1)` 和 [`first2`, `pastLast2)` 中的对应项对应用二元操作 `binary_op`，并将结果存储在从\
  \ `result` 位置开始的另一个序列中。对于每个版本，返回值是一个表示目标范围最后一个之后位置的迭代器值。\n\n#### 复杂度\n每个算法都是线性的。应用了\
  \ `pastLast` − `first` 次（对于第二个版本为 `pastLast1` − `first1` 次）`op` 或 `binary_op`。\n\
  \n## 排序及相关操作\n\n### max_element\n\n### 概述\n在范围内查找最大的项\n\n### 签名\n```cpp\n#include\
  \ <algorithm>\n\ntemplate <class ForwardIterator>\n\nForwardIterator max_element(ForwardIterator\
  \ first,\n                            ForwardIterator pastLast);\n\n#include <algorithm>\n\
  \n            template <class ForwardIterator, class Compare>\n\n            ForwardIterator\
  \ max_element(ForwardIterator first,\n                                        ForwardIterator\
  \ pastLast,\n                                        Compare cmp);\n```\n\n\n\n\n\
  \n## max_element\n\n- **Requirement**: 对于第一个版本，容器中的项必须是定义了 `<` 运算符的类型。对于第二个版本，`cmp`\
  \ 必须是一个布尔函数或函数对象，其语义应为“小于”。\n- **Description**: `max_element` 返回一个迭代器值，表示范围 `[`first`,\
  \ `pastLast)` 内最大项的位置。如果存在多个相同的最大项，则返回第一个出现的最大项的位置。如果范围 `[`first`, `pastLast)` 为空，则该函数返回\
  \ `pastLast`。\n\n`max_element` 的第一个版本使用 `<` 运算符比较项，第二个版本使用函数或函数对象 `cmp` 比较项。\n-\
  \ **Complexity**: 每个算法的时间复杂度都与范围的长度成线性关系。\n\n## min_element\n\n- **Synopsis**: 在范围内查找最小的项\n\
  - **Signatures**:\n\n```cpp\n#include <algorithm>\n\ntemplate <class ForwardIterator>\n\
  \nForwardIterator min_element(ForwardIterator first,\n                         \
  \   ForwardIterator pastLast);\n\n#include <algorithm>\n\ntemplate <class ForwardIterator,\
  \ class Compare>\n\nForwardIterator min_element(ForwardIterator first,\n       \
  \                     ForwardIterator pastLast,\n                            Compare\
  \ cmp);\n```\n\n- **Requirement**: 对于第一个版本，容器中的项必须是定义了 `<` 运算符的类型。对于第二个版本，`cmp`\
  \ 必须是一个布尔函数或函数对象，其语义应为“小于”。\n- **Description**: `min_element` 返回一个迭代器值，表示范围 `[`first`,\
  \ `pastLast)` 内最小项的位置。如果存在多个相同的最小项，则返回第一个出现的最大最小项的位置。如果范围 `[`first`, `pastLast)`\
  \ 为空，则该函数返回 `pastLast`。\n\n`min_element` 的第一个版本使用 `<` 运算符比较项，第二个版本使用函数或函数对象 `cmp`\
  \ 比较项。\n- **Complexity**: 每个算法的时间复杂度都与范围的长度成线性关系。\n\n## sort\n\n- **Synopsis**:\
  \ 使用快速排序对范围内的项。一个版本使用 `<` 运算符排序，另一个版本使用用户提供的比较函数排序。\n- **Signatures**:\n\n```cpp\n\
  #include <algorithm>\n\ntemplate <class RandomAccessIterator>\n\nvoid sort( RandomAccessIterator\
  \ first,\n           RandomAccessIterator pastLast );\n\n#include <algorithm>\n\n\
  template <class RandomAccessIterator, class Compare>\n\nvoid sort( RandomAccessIterator\
  \ first,\n           RandomAccessIterator pastLast, Compare cmp );\n```\n\n- **Requirement**:\
  \ 对于第一个版本，容器中的项必须是定义了 `<` 运算符的类型。对于第二个版本，`cmp` 必须是一个布尔函数或函数对象，其语义应为“严格小于”或“严格大于”。\n\
  - **Description**: 两个版本都使用递归快速排序对范围 `[`first`, `pastLast)` 内的项进行排序。第一个版本将项按升序排列。第二个版本根据比较函数\
  \ `cmp` 将项按升序或降序排列。\n- **Complexity**: 平均时间复杂度为 `O(N*log(N))`，由于例程是递归的，空间复杂度为 `O(log(N\
  \ ))`。最坏情况下的时间复杂度为 `O(N² )`。如果最坏情况很重要，另外两个名为 `stable_sort` 和 `partial_sort` 的 STL\
  \ 算法提供了更好的最坏情况保证，但平均性能略差。\n\n我们希望这个附录能激发你对 STL 备套功能的兴趣。我们鼓励你参考以下参考文献以获取更多信息。\n\n\
  ### References\n\n1. ISO/ANSI Standard 14882: 编程语言—C++, 美国国家标准协会, 1998.\n2. Niccolai\
  \ Josuttis, The C++ Standard Library, Addison Wesley Longman, 1999.\n3. P. J. Plauger\
  \ 是标准委员会的主要成员。他的公司有一个网站 `http://plauger.com`，其中有关于 C++ 标准库的大量资源。\n4. Silicon Graphics\
  \ 网站 `www.sgi.com/tech/stl/`（或 `www.sgi.com/`）提供了许多关于 STL 信息的资源。\n\n## Glossary\n\
  \n<dfn>抽象数据类型 (ADT)</dfn>\n其属性（域和操作）独立于任何特定实现的数据类型\n\n<dfn>抽象 (Abstraction)</dfn>\n\
  复杂系统的模型，仅包含对系统视角至关重要的细节\n\n<dfn>验收测试 (Acceptance test)</dfn>\n在真实环境中使用真实数据对系统进行测试的过程\n\
  \n<dfn>激活记录 (栈帧)</dfn>\n运行时用于存储函数调用信息的记录，包括参数、局部变量、寄存器值和返回地址\n\n<dfn>邻接列表 (Adjacency\
  \ list)</dfn>\n标识与特定顶点连接的所有顶点的链表；每个顶点都有自己的邻接列表\n\n<dfn>邻接矩阵 (Adjacency matrix)</dfn>\n\
  对于一个具有 N 个节点的图，一个 N  N 的表格，显示图中所有边的存在性（及权重）\n\n<dfn>邻接顶点 (Adjacent vertices)</dfn>\n\
  图中由边连接的两个顶点\n\n<dfn>算法 (Algorithm)</dfn>\n描述给定问题完整解决方案的离散步骤逻辑序列，可在有限时间内完成计算\n\n\
  <dfn>断言 (Assertion)</dfn>\n一个可以为真也可以为假的逻辑命题\n\n<dfn>平均情况复杂度 (Average case complexity)</dfn>\n\
  与算法所需的平均步数有关，跨所有可能的输入集进行计算\n\n<dfn>AVL 树 (AVL tree)</dfn>\n一种当子树高度差超过 1 时会自动重新平衡的二叉搜索树\n\
  \n<dfn>平衡因子 (Balance factor)</dfn>\n与树节点关联的值，是其子树之间的高度差\n\n<dfn>平衡节点 (Balanced node)</dfn>\n\
  平衡因子不大于 1 的节点\n\n<dfn>基本情况 (Base case)</dfn>\n可以用非递归方式描述解决方案的情况\n\n<dfn>基类 (Base\
  \ class)</dfn>\n被继承的类\n\n<dfn>最优情况复杂度 (Best case complexity)</dfn>\n与算法所需的最小步数有关，在效率方面给定理想输入集\n\
  \n<dfn>大 O 表示法（数量级） (Big-O notation)</dfn>\n一种将计算时间（复杂度）表示为相对于问题规模增长快的函数项的符号\n\n\
  <dfn>二叉搜索树 (Binary search tree)</dfn>\n一种二叉树，其中任何节点的键值都大于其左节点及其任何子节点（左子树中的节点），且小于其右节点及其任何子节点（右子树中的节点）\n\
  \n<dfn>二叉树 (Binary tree)</dfn>\n一种具有唯一起始节点（根）的结构，其中每个节点都可以有两个子节点，且从根到每个其他节点都存在唯一路径\n\
  \n<dfn>绑定时间 (Binding time)</dfn>\n名称或符号绑定到相应代码的时间\n\n<dfn>位向量 (Bit vector)</dfn>\n\
  一种将组件类型的每个项映射到布尔标志的表示\n\n<dfn>黑盒测试 (Black-box testing)</dfn>\n基于可能的输入值对程序或函数进行测试，将代码视为“黑盒”\n\
  \n<dfn>黑色高度 (Black-height)</dfn>\n红黑树的一种属性，规定从给定节点到空节点的路径必须具有相同数量的黑色节点\n\n<dfn>边界\
  \ ADT (Bounded ADT)</dfn>\n对结构中项的数量有逻辑限制的 ADT\n\n<dfn>分支 (Branch)</dfn>\n不总是执行的代码段；例如，switch\
  \ 语句的分支数等于 标签的数量\n\n<dfn>桶 (Bucket)</dfn>\n与特定哈希位置关联的元素集合\n\n<dfn>基数 (Cardinality)</dfn>\n\
  集合中项的数量\n\n<dfn>链 (Chain)</dfn>\n共享相同哈希位置的元素链表\n\n<dfn>循环链表 (Circular linked list)</dfn>\n\
  每个节点都有后继者的链表；“最后一个”元素被“第一个”元素后继\n\n\n\n\n\n### `Class`\n一种非结构化类型，封装了固定数量的数据组件以及操作这些组件的函数；对类实例的定义操作包括整体赋值和组件访问\n\
  \n### `Class constructor`\n类的一种特殊成员函数，在定义类对象时被隐式调用\n\n### `Clear- (white-) box testing`\n\
  白盒测试，基于覆盖代码的所有语句、分支或路径对程序或函数进行测试\n\n### `Client`\n(i) 声明并操作特定类对象（实例）的软件 (ii) 软件的用户\n\
  \n### `Clustering`\n聚集，元素在哈希表中分布不均匀的倾向，许多元素聚集在单个哈希位置周围\n\n### `Collision`\n冲突，当两个或多个键产生相同的哈希位置时形成的情况\n\
  \n### `Complete binary tree`\n完全二叉树，一种可以是满的，或者直到倒数第二层满的，且最后一层的叶子节点尽可能向左排列\n\n###\
  \ `Complete graph`\n完全图，图中每个顶点都与其他所有顶点直接相连\n\n### `Component (base) type`\n集合中组件或项的数据类型\n\
  \n### `Composite data type`\n复合数据类型，允许一组值与该类型的对象关联的数据类型\n\n### `Composition (containment)`\n\
  组合（包含），一种机制，将一个类的内部数据成员定义另一个类类型的对象\n\n### `Constructor`\n创建类的新实例的操作\n\n### `Copy\
  \ constructor`\n拷贝构造函数，类的一种特殊成员函数，在值传递参数、在声明中初始化变量以及将对象作为函数的返回值时被隐式调用\n\n### `Data\
  \ abstraction`\n数据抽象，将数据类型的逻辑属性与其实现分离\n\n### `Data encapsulation`\n数据封装，在逻辑层面将数据表示与使用该数据的应用程序分离；一种强制信息隐藏的编程语言特性\n\
  \n### `Data structure`\n数据元素集合，其组织特征是用于存储和检索单个数据元素的访问操作；抽象数据类型中复合数据成员的实现\n\n###\
  \ `Debugging`\n调试，移除错误的过程\n\n### `Deep copy`\n深拷贝，一种操作不仅将一个类对象复制到另一个对象，还会对任何所指向的数据进行复制\n\
  \n### `Dereference operator`\n解引用操作符，应用于指针变量时，表示指针所指向的变量\n\n### `Derived class`\n\
  派生类，被继承的类\n\n### `Deskchecking`\n纸检，在纸上跟踪设计或程序的执行过程\n\n### `Difference`\n差集，一种二进制集合运算，返回一个包含第一个集合中但不在第二个集合中的所有项\n\
  \n### `Direct recursion`\n直接递归，函数直接调用自己\n\n### `Directed graph (digraph)`\n有向图，图中每条边都从一个顶点\n\
  \n### `Doubly linked list`\n双向链表，每个节点都与其后继节点和前驱节点链接的链表\n\n### `Dynamic allocation`\n\
  动态分配，在运行时分配空间\n\n### `Dynamic binding`\n动态绑定，在运行时确定哪种实现\n\n### `Edge (arc)`\n表示连接的顶点对\n\
  \n### `Empty set`\n没有成员的集合\n\n### `Exception`\n异常，一种异常、不可预测的事件\n\n### `Folding`\n\
  折叠，一种将键拆碎的方法\n\n### `Free store`\n内存位置\n\n### `Full binary tree`\n满二叉树，每个节点都有两个子节点的二叉树\n\
  \n### `General (recursive) case`\n自身的情况\n\n### `Generic data type`\n定义了操作的类型\n\n\
  ### `Graph`\n由节点和边组成的数据结构\n\n### `Hash function`\n用于识别列表中位置的函数\n\n### `Hashing`\n\
  哈希查找，用于查找值的技术\n\n### `Header node`\n列表开头的节点\n\n### `Heap`\n一种其元素大于或等于某值的完全二叉树\n\n\
  ### `Height`\n最大层级\n\n### `Implementing a test`\n使用测试用例运行程序\n\n### `Indirect recursion`\n\
  间接递归，函数调用链返回时\n\n### `Information hiding`\n信息隐藏，隐藏结构细节的做法\n\n### `Inheritance`\n\
  类的层次结构，其中每个后代都继承其祖先类的属性和操作\n\n### `Inorder traversal`\n中序遍历，一种访问二叉树中所有节点的系统方法，访问顺序为访问节点左子树的节点，然后访问该节点，最后访问右子树的节点\n\
  \n### `Inspection`\n一种验证方法，团队中的一名成员逐行阅读程序，其他成员指出错误\n\n### `Integration testing`\n\
  为了集成已独立单元测试的程序模块而执行的测试\n\n### `Intersection`\n交集，一种二进制集合运算，返回一个包含两个输入集合中所有项的集合\n\
  \n### `Iterator`\n一种允许按顺序处理数据结构中组件的操作\n\n### `Key`\n(i) 记录（结构体或类）的成员，其值用于确定列表中项的逻辑或物理顺序；(ii)\
  \ 映射基类型中的值，用于查找其关联值\n\n### `Key-value pair`\n映射中的项，由两个值组成：取自基类型的键，以及通过查找键检索的关联值\n\
  \n### `Leaf node`\n没有子节点的树节点\n\n### `Left-right rotation`\n双重旋转的一种类型，即先进行左旋转后进行右旋转\n\
  \n### `Left rotation`\n一种旋转类型，看起来节点正围绕右子树的根进行旋转\n\n### `Length`\n列表中的项数；长度可以随时间变化\n\
  \n### `Level`\n节点到根的距离；根为第 0\n\n### `Linear probing`\n通过从哈希函数返回的位置开始顺序搜索哈希表，来解决哈希冲突\n\
  \n### `Linear relationship`\n除了第一个元素外，每个元素都有唯一的前驱；除了最后一个元素外，每个元素都有唯一的后继\n\n### `Map`\n\
  \n\n\n\n\n一个无序的特定组件集合，每个组件由一个键值对组成，其中键是从单一数据类型（称为基类型）的可能值中选出的唯一值；可以通过查找关联键来检索值。\n\
  \n### `内存泄漏`\n当动态分配内存但从不释放时发生的可用内存空间丢失。\n\n### `基于指标的测试`\n基于可测量因素的测试。\n\n### `模块`\n\
  一个执行部分工作的内聚性系统子单元。\n\n### `对象类（类）`\n对一组具有相似属性和行为的对象的描述；一种创建单个对象的模式。\n\n### `观察者模式`\n\
  一种允许我们在不改变对象状态的情况下观察其状态的操作。\n\n### `重载`\n给多个函数赋予相同的名称，或为多个操作使用相同的运算符符号；通常与静态绑定相关。\n\
  \n### `并行处理`\n同时执行多个操作的计算。\n\n### `路径`\n(i) 当程序或函数执行时，执行中可能被遍历的分支组合；(ii) 连接图中两个节点的顶点序列。\n\
  \n### `路径测试`\n一种测试技术，测试人员试图尝试执行程序或函数中所有可能的路径。\n\n### `多态`\n确定多个同名操作中哪一个合适的能力；静态和动态绑定的结合。\n\
  \n### `后置条件`\n断言，说明在假设前置条件的情况下，操作或函数退出时预期的结果。\n\n### `后序遍历`\n一种访问二叉树中所有节点的系统方法，它先访问节点左子树的节点，然后访问节点右子树的节点，最后访问节点本身。\n\
  \n### `前置条件`\n在进入操作或函数时必须为断言，以保证后置条件的得以实现。\n\n### `前序遍历`\n一种访问二叉树中所有节点的系统方法，它先访问节点本身，然后访问节点左子树的节点，最后访问节点右子树的节点。\n\
  \n### `程序验证`\n确定软件在多大程度上符合其预期用途的过程。\n\n### `程序校验`\n确定软件产品在多大程度上符合其规格的过程。\n\n###\
  \ `二次探测`\n通过重哈公式 `(HashValue ± I²) % array-size` 解决哈希冲突，其中 `I` 是重哈函数被应用的次数。\n\n\
  ### `队列`\n一种抽象数据类型，元素在尾部添加并从头部删除；一种“先进先出”（FIFO）结构。\n\n### `基数`\n每个位置的可能值数量；数系统中的数字。\n\
  \n### `随机探测`\n通过在连续应用重哈函数时生成伪随机哈希值来解决哈希冲突。\n\n### `递归算法`\n一种用 (1) 自身的较小实例和 (2) 基础情况表示的解决方案。\n\
  \n### `递归调用`\n一种函数调用，被调用的函数与调用它的是同一个。\n\n### `递归定义`\n一种根据自身的较小版本来定义的定义。\n\n### `重构`\n\
  重写现有代码以反映需求的变化和设计决策。\n\n### `回归测试`\n在进行修改后重新执行程序测试，以确保程序仍然正常工作。\n\n### `重哈`\n通过从哈希函数计算新的哈希位置来解决冲突，该函数操纵的是原始位置而不是元素的键。\n\
  \n### `需求`\n对计算机系统或软件产品应提供的内容的描述。\n\n### `右左旋转`\n双旋转的一种类型，先进行右旋转后进行左旋转。\n\n### `右旋转`\n\
  一种旋转类型，看起来节点正在围绕左子树的根节点进行旋转。\n\n### `健壮性`\n程序在出错后恢复的能力；程序在其环境中继续运行的能力。\n\n### `根`\n\
  树结构中的顶端节点；一个没有父节点的节点。\n\n### `运行时栈`\n一种在程序执行期间跟踪激活记录的数据结构。\n\n### `场景`\n描述客户端与应用程序或程序之间交互的步骤序列。\n\
  \n### `self`\n应用成员函数的对象。\n\n### `串行（顺序）处理`\n一次执行一步的计算。\n\n### `集合（Set）`\n一个独特的、无序的特定值（项或组件）集合，从单一数据类型（称为组件（基）类型）的可能值中选出。\n\
  \n### `浅拷贝`\n一种将一个类对象复制到另一个对象中但不复制任何所指向的数据的操作。\n\n### `软件工程`\n门致力于设计、生产和维护计算机程序的学科，这些程序在规定的时间内和成本预算内开发，并使用工具帮助管理结果软件的规模和复杂性。\n\
  \n### `软件过程`\n在项目或组织中使用的标准、集成软件工程工具和技术集合。\n\n### `软件规格`\n对软件产品的功能、输入、输出和特殊要求的详细描述；它提供了设计和实现程序所需的信息。\n\
  \n### `排序列表`\n一种按值排序的列表；列表中的键之间存在语义关系。\n\n### `稳定排序`\n一种保持重复元素顺序的排序算法。\n\n### `栈`\n\
  一种抽象数据类型，元素仅在末端添加和删除；一种“后进先出”（LIFO）结构。\n\n### `栈溢出`\n尝试向满栈推入元素时发生的条件。\n\n### `栈下溢`\n\
  尝试从空栈中弹出元素时发生的条件。\n\n### `语句覆盖`\n程序中的每条语句至少执行一次。\n\n### `静态绑定`\n在编译时确定哪个操作实现合适的。\n\
  \n### `存桩（Stub）`\n一种用于自顶测试的特殊函数，用于代表低级函数。\n\n### `子集`\n如果集合 X 的每个元素都是 Y 的元素，则 X\
  \ 是 Y 的子集；如果 Y 中至少有一个元素不在 X 中，则 X 是 Y 的真子集。\n\n### 语法糖\n使程序更容易表达和阅读的替代形式或语法；通常被翻译成基础语言支持的编程结构。\n\
  \n### `尾递归`\n函数仅包含一次递归调用且该调用是函数中执行的最后语句的情况。\n\n### `模板`\n一种 C++ 语言结构，通过允许参数化类型允许编译器生成多个版本的类型或函数。\n\
  \n### `测试驱动程序`\n通过声明和为变量分配初始值来设置测试环境，然后调用被测试的程序。\n\n### `测试计划`\n一份显示计划用于程序或模块的测试用例、目的、输入、预期输出和成功标准的文档。\n\
  \n### `测试`\n使用设计用于发现错误的数据集执行程序的过程。\n\n### `尾随节点`\n列表末尾的占位符节点；用于简化列表处理。\n\n### `转换器`\n\
  一种改变对象内部状态的操作。\n\n### `不平衡节点`\n平衡因子大于 1 的节点。\n\n### `无界 ADT`\n\n\n\n\n\n对结构中项数没有逻辑限制的\
