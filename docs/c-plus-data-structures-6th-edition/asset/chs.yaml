  \    SetType Intersection(SetType setB);\n    SetType Difference(SetType setB);\n\
  \    void Print(std::ofstream& outFile);\n\nprivate:\n    ListType items;\n};\n\
  ```\n\n\n\n\n`SetType` 构造函数调用了 `ListType` 构造函数。`MakeEmpty`、`IsEmpty`、`IsFull` 和\
  \ `CardinalityIs` 只是调用对应的列表操作。`Store` 操作的限制只存在一个副本。因此，在调用 `Store` 之前必须调用列表操作 `RetrieveItem`。如果项已经在集合中，函数将直接返回而不进行任何操作。如果项不在集合中，则调用\
  \ `InsertItem`。`Delete` 的限制规定如果项在集合中，则将其删除。同样，会调用 `RetrieveItem`。如果项在集合中，则将其删除；如果不在，函数将直接返回而不进行任何后续操作。\n\
  \n让我们考虑如何实现 `Intersection`，这是使用 `ListType` 的二元操作之一。到目前，我们还没有决定应该使用哪一个列表。在我们的算法中，我们称为\
  \ `setA`，但实际上指的是 `setA` 的 `items` 成员，它是一个列表。\n\n回想两个集合的交集是由同时存在另外两个集合中的项组成的集合。如果我们手动执行此操作，一种算法可能是从第一个集合中取一个项，然后扫描第二个集合查看它是否存在。如果存在，则该项进入结果。我们对第一个集合中的每个项重复此算法。这使用我们的列表操作很容易表达：\n\
  \n该算法的 Big-O 复杂度为 O(N * N) 或 O(N logN)，取决于 `RetrieveItem` 的实现方式。通过稍加思考和对我们 `ItemType`\
  \ 假设的微小调整，就可以产生一个复杂度为 O(N) 的算法。假设 `ItemType` 也重载了 `<` 关系运算符，使我们能够使用排序后的列表。与其查看第一个列表（集合）中的一个项并检查它是否在第二个列表中，不如查看每个列表的第一个项。可能会发生三种情况：\n\
  \n* 来自 `setA` 的项在来自 `setB` 的项之前。\n* 来自 `setB` 的项在来自 `setA` 的项之前。\n* 项相等。\n\n如果项相等，则来自其中一个集合的项进入结果，我们从\
  \ `setA` 和 `setB` 中都获得一个新的项。如果来自 `setA` 的项在来自 `setB` 的项之前，我们知道来自 `setA` 的项不在结果中，因此我们从\
  \ `setA` 中获取另一个项。如果来自 `setB` 的项在来自 `setA` 的项之前，我们知道来自 `setB` 的项不在结果中，因此我们从 `setB`\
  \ 中获取另一个项。\n\n以下是基于容器内项已排序的假设的修订算法：\n\n要非常小心：集合是无序集合，但如果集合中的值可以使用 `<` 关系运算符进行比较，那么包含集合的实现结构就可以是有序的——我们可以利用这种顺序为交集操作产生一个\
  \ O(N) 的算法。在许多情况下，集合项确实满足这种序数属性。\n\n并行向下移动两个有序列表的过程被称为合并（merge）。这个非常有用的算法可以在 O(N)\
  \ 时间内实现其他二元操作。我们将这些算法的设计留作练习题。\n\n两种实现都留作编程作业。\n\n### 11.2 Maps（映射）\n\n集合包含来自基础类型的项。对于任何给定的值，它记录该值是否在集合中。因此，基础类型中的每个值都可以被认为具有一个表示存在或缺失的关联值。这实际上就是我们显式实现的工作方式。\n\
  \n如果我们允许关联值为任何类型，并提供一个检索它的操作，结果是一个名为 map（映射）的新抽象数据类型（ADT）。给定一个基础类型的值，如果它存在映射中，我们就可以检索对应的值。基础类型的值通常称为\
  \ `key`（键），对应的值直接称为 `value`（值）。映射中的每个条目被描述为键-值对（key-value pair）。\n\n#### 逻辑层面\n\n\
  映射在概念上与集合相似。两者在逻辑上都是无序的，因为它们包含的元素之间没有显式关系。这使我们能够使用广泛的实现结构。然而，正如我们在集合中看到的，如果映射中的项支持允许它们进行比较的序数属性，那么我们就可以为某些操作使用更快的算法。因此，我们需要\
  \ `ItemType` 同时支持 `==` 和 `<` 运算符。`ItemType` 必须包含两个值：键和其对应的值。\n\n由于我们预先不知道用户会为键或值类型指定什么，`Find`\
  \ 操作将简单地取一个 `ItemType` 值作为参数来提供要搜索的键，它将返回整个匹配项，使用使用户能够检索对应的值。如果没有找到匹配项，则可以返回 `ItemType`\
  \ 参数的值。与其他搜索操作一样，我们将包含一个布尔引用参数 `found&`，用以指示返回值是否有效。\n\n当然，映射不需要支持集合的并集（Union）、交集（Intersection）和差（Difference）。否则，它的职责是相同的。以下是这些职责的规范：\n\
  \n与集合一样，从概念上说，映射永远不会满满。然而，为了实现 Map ADT，我们必须考虑这种可能性。\n\n#### 应用层面\n\n与集合一样，将一个已经在映射中的项放入映射不会改变映射。同样，删除一个不存在的项也会保持映射不变。当应用程序需要使用一个值来查找另一个值（且键无法轻松转换为数组索引）时，映射是非常用的。这种例子包括键名为值为数字的电话录，或者根据颜料名称查找颜料混合配方。我们甚至可以使用映射作为集合显式实现的映射函数，其中集合项是键，值提供数组索引。\n\
  \n#### 实现层面\n\n由于映射中的项彼此是无序的，我们可以自由选择许多实现结构。由于内部安排并不重要，我们下一步考虑哪些映射操作最频繁，然后寻找最有效实现它们的\
  \ ADT。映射最常用的操作是 `Store` 和 `Find`。通常，映射在应用程序执行早期建立，然后作为查找函数大量使用。因此，对于我们的实现，我们需要一个可以快速搜索的\
  \ ADT。这听起来非常像二叉搜索树，它确实是实现映射的自然手段。这里是 `MapType` 的类定义：\n\n```\nclass MapType\n{\n\
  public:\n  MapType();                          // 默认构造函数\n  ~MapType();        \
  \                 // 析构函数\n  MapType(const MapType anotherMap); // 拷贝构造函数\n  void\
  \ MakeEmpty();\n  void Store(ItemType item);\n  void Delete(ItemType item);\n  bool\
  \ IsEmpty();\n  bool IsFull();\n  ItemType Find(ItemType item, bool found&);\n \
  \ void Print(std::ofstream& outFile);\n\nprivate:\n  TreeType items;\n};\n```\n\n\
  `MapType` 的默认构造函数可以简单地调用 `TreeType` 构造函数，拷贝构造函数和析构函数也是如此。`MakeEmpty`、`IsEmpty`、`IsFull`\
  \ 和 `Print` 可以调用 `TreeType` 中的对应函数。`Find` 将调用 `GetItem`，而 `Delete` 将调用 `TreeType`\
  \ 中的 `DeleteItem`。我们唯一的新算法是用于 `Store`。回想 `TreeType` 和 `MapType` 一样不允许重复项，但它依赖客户端代码在调用\
  \ `PutItem` 之前先检查项是否已在树中。因此，这里是 `Store` 的算法：\n\n\n\n\n\n由于这些算法非常简单，我们把它们的实现留在了练习题中。我们定义\
  \ `MapType` 的方式与我们其他的 ADT 实现保持一致，这使得我们能够直接使用现有的二叉搜索树来实现它。\n\n我们本可以采用其他方法。例如，与其返回原始值，我们本可以将\
  \ `find` 写成一个 `void` 函数，并将 `item` 写成一个引用参数。用户将负责在调用之前将 `item` 的 `value` 成员设置为某个空值，而我们将在找到键时向其中返回对应的值，或者在未找到键时保持其不变。或者，我们也可以通过让函数返回一个\
  \ `bool` 值来指示是否找到了键，从而消除对空值的要求。\n\n另一种方法是 C++ STL 采用的方案，它提供了一种 `map` 类型，该类型重载了数组访问和赋值运算符（`[]`\
  \ 和 `=`），因此 `map` 可以被视为一个以键值作为索引的数组。虽然这非常方便，但深入研究 STL 的实现可以发现多层复杂的抽象，包括对通用容器的支持，并使用被称为“迭代器”（iterators）的\
  \ get 来访问这些容器。仅仅解释 STL 容器的工作原理就可能占据大部分章节的大幅，而展示如何实现它们可能就会单独占据一个章节。\n\n实现容器类的挑战在于如何处理在搜索某个项时该项不在容器中的情况。在这种情况下，搜索应该做什么？STL\
  \ 在每个容器后面添加一个额外的项，并使用它的迭代器对象进行对容器的所有访问。搜索返回一个指向容器中匹配项的迭代器对象。如果搜索失败，则迭代器指向那个额外的项。客户端代码可以在访问其所指向的项之前检查迭代器的值。这样，既没有产生异常，也不需要辅助的\
  \ `found` 参数。\n\nSTL 方法的优点是，当容器以一种确保搜索总是成功的方式使用时，客户端代码可以写得非常简单。缺点是容器的实现更加复杂，要求用户对该方法的细微差别有理解。\n\
  \n### 11.3 哈希\n\n到目前为止，我们通过保持列表中的项按键值排序，成功地将搜索复杂度从 $O(N)$ 降低到了 $O(\\log_2 N)$。我们还能做得更好吗？是否可能设计出一个复杂度为\
  \ $O(1)$ 的搜索——也就是说，无论元素位于列表的哪个位置，其搜索时间都是恒定的？\n\n在理论上，这个目标并非不可实现的梦想。让我们来看一个例子：一个规模较小公司的员工列表。100\
  \ 名员工中的每位员工都有一个 0–99 范围内的 ID 编号，我们想要使用键 `idNum` 访问员工记录。如果我们将元素存储在一个从 0–99 索引的数组中，我们就可以通过数组索引直接访问任何员工的记录。元素键与数组索引之间存在一一对应的关系；实际上，数组索引充当了每个元素的键。\n\
  \n然而，在实践中，键值与元素位置之间的这种完美关系并不容易建立或维护。考虑另一家的小公司，它使用员工的五位 ID 编号作为主键。现在键值的范围从 00000\
  \ 到 99999。显然，设置一个包含 100,000 个元素的数组（而我们只需要 100 个）是不切实际的，仅仅为了确保每个员工的元素都位于一个完全唯一且可预测的位置。\n\
  \n我们将数组大小缩小到实际需要的大小（一个包含 100 个元素的数组），并仅使用键的最后两位来识别每个员工会如何？例如，员工 53374 的元素位于 `employeeList.info[74]`\
  \ 中，员工 81235 的元素位于 `employeeList.info[35]` 中。注意，元素并没有根据键的值进行排序（正如我们在之前的讨论中提到过的那样）；在数组中，员工\
  \ 81235 记录的位置在员工 53374 记录之前，尽管它的键值更大。相反，元素是根据键值的某个函数进行排序的。\n\n这个函数被称为哈希函数 (hash\
  \ function，我们正在使用的搜索技术被称为哈希 (hashing)。在员工列表的情况下，哈希函数是 `(Key % 100)`。将键 (`idNum`)\
  \ 除以 100，并将余数用作员工元素数组的索引，如图图 11.1 所示。该函数假设数组从 0 到 99 索引（`MAX_ITEMS = 100`）。执行键值到索引转换的函数非常简单：\n\
  \n![](img/f11-01.jpg)\n\n图 11.1 使用哈希函数确定元素在数组中的位置\n\n```cpp\nint ItemType::Hash()\
  \ const\n\n// Post: 返回 0 到 MAX_ITEMS - 1 之间的整数。\n\n{\n  return (idNum % MAX_ITEMS);\n\
  }\n```\n\n在这里，我们假设 `Hash` 是 `ItemType`（列表中项的类型）的成员函数，并且 `idNum` 是 `ItemType` 的数据成员。\n\
  \n这个哈希函数有两个用途。首先，它被用作访问列表的方法。哈希的结果告诉我们去哪里查找需要检索、修改或删除的特定元素。这里例如是 `RetrieveItem`\
  \ 的简单版本，它假设元素存在于：\n\n```cpp\ntemplate<class ItemType>\nvoid ListType<ItemType>::RetrieveItem(ItemType&\
  \ item)\n\n// Post: 返回数组中位于\n//       item.Hash() 位置的元素。\n\n{\n  int location;\n\
  \  location = item.Hash();\n  item = info[location];\n}\n```\n\n其次，哈希函数确定了在数组的何存储元素。如果员工列表元素是使用第三章中的插入操作插入列表——进入顺序槽位或按键值顺序进入槽位——我们就无法使用哈希函数来找到它们。我们必须创建一个将新元素放入正确槽位的插入操作。这里是\
  \ `InsertItem` 的简单版本，它假设哈希函数返回的数组槽未使用：\n\n```cpp\ntemplate<class ItemType>\nvoid\
  \ ListType<ItemType>::InsertItem(ItemType item)\n\n// Post: item 存储在数组的 item.Hash()\
  \ 位置。\n\n{\n  int location;\n  location = item.Hash();\n  info[location] = item;\n\
  \  length++;\n}\n```\n\n图 11.2a 显示了一个数组，其元素——键（唯一 ID 编号）为 12704、31300、49001、52202\
  \ 和 65606 的员工记录——是通过 `InsertItem` 添加的。注意，该函数并没有顺序填充数组位置。由于我们还没有插入任何产生哈希值 3 和 5 的元素，数组槽\
  \ [3] 和 [5] 在逻辑上是“空的”。在图 11.2b 中，相同的员工记录是使用第三章中的 `InsertItem` 操作插入到排序列表中的。注意，除非使用哈希函数来确定插入元素的位置，否则哈希函数对于查找元素是毫无用处的。\n\
  \n图 11.2 相同元素的哈希列表与顺序列表的对比\n\n\n\n\n\n到这里，你可能会对这种方案提出异议，因为它并没有保证哈希位置是唯一的。例如，ID 号\
  \ 01234 和 ID 号 91234 都会“哈希”到同一个位置：`list.info[34]`。避免这些冲突是设计良好的哈希函数最大的挑战。良好的哈希函数通过将元素均匀地分布在整个数组中来最小化冲突。我们之所以说是“最小化”冲突，是因为完全避免冲突是非常困难的。\n\
  \n假设会发生某些冲突，你应该将导致冲突的元素存储在哪里？我们将在本章的后续章节中简要介绍几种流行的冲突处理算法。请注意，寻找存储元素位置的方案决定了随后用于检索元素的方法。\n\
  \n### 线性探测 (#bm01.xhtml_gloss089)\n解决冲突的一种简单方法是将冲突的元素存储在下一个可用空间。这种技术被称为线性探测。在图 11.3\
  \ 所示的情况下，我们想要添加键 ID 号为 77003 的员工元素。哈希函数返回 3。但该数组槽位已经存储了一个元素，即员工 50003 的记录。我们将 `location`\
  \ 增到 4 并检查下一个数组槽位。`list.info[4]` 条目已被占用，因此我们再次增加 `location`。这次我们找到了一个空槽，因此将新元素存储在\
  \ `list.info[5]` 中。\n\n如果键哈希到数组的最后一个索引且该空间被占用会发生什么？我们可以将数组视为一个循环结构，并继续在数组开头寻找空槽。这种情况与我们在第\
  \ 4 章中开发的基于数组的循环队列相似。在那里，我们在增加索引时使用了 `%` 运算符。我们在这里可以使用类似的逻辑。\n\n![](img/f11-03.jpg)\n\
  \n图 11.3 使用线性探测处理冲突\n\n我们如何知道一个数组槽位是“空”的？我们可以初始化数组槽位以包含一个特殊的 `emptyItem` 值。该值（类构造函数的参数）必须在语法上是合法的，但在语义上是非合法的。例如，如果所有员工的\
  \ `idNum` 键都是非负整数，我们可以使用 -1 作为“空”槽位的键值。现在很容易判断该槽位是否空闲：我们只需要将该位置的值与 `emptyItem` 进行比较即可。\n\
  \n以下版本的 `InsertItem` 使用线性探测来寻找存储新元素的位置。它假设数组有足够的空间容纳另一个元素；也就是说，客户端在调用函数之前会检查 `IsFull`。（我们保留了\
  \ `ListType` 的 `length` 成员。尽管它不再告诉我们从何处找到列表末尾，但它在判断列表是否已满方面仍然有用。）\n\n```cpp\ntemplate<class\
  \ ItemType>\n\nvoid ListType<ItemType>::InsertItem(ItemType item)\n\n// Post: item\
  \ 存储在数组的 item.Hash() 位置，\n//       或下一个空位置。\n{\n   int location;\n   location =\
  \ item.Hash();\n   while (info[location] != emptyItem)\n     location = (location\
  \ + 1) % MAX_ITEMS;\n   info[location] = item;\n   length++;\n}\n```\n\n要使用这种冲突处理技术搜索元素，我们对键执行哈希函数，然后将期望的键与指定位置元素中的实际键进行比较。如果键不匹配，我们使用线性探测，从数组中的下一个槽位开始。以下是使用这种方法的\
  \ `RetrieveItem` 函数版本。如果不在列表中找到该元素，则输出参数 `found` 为 `false`，且 `item` 为未定义：\n\n```cpp\n\
  template<class ItemType>\n\nvoid ListType<ItemType>::RetrieveItem(ItemType& item,\
  \ bool& found)\n{\n  int location;\n  int startLoc;\n  bool moreToSearch = true;\n\
  \  startLoc = item.Hash();\n  location = startLoc;\n  do\n  {\n    if (info[location]\
  \ == item || info[location] == emptyItem)\n      moreToSearch = false;\n    else\n\
  \      location = (location + 1) % MAX_ITEMS;\n  } while (location != startLoc &&\
  \ moreToSearch);\n\n  found = (info[location] == item);\n  if (found)\n    item\
  \ = info[location];\n}\n```\n\n目前为止，我们已经讨论了哈希表中元素的插入和检索，但还没有提到如何从表中删除元素。如果我们不需要担心冲突，那么删除算法将非常简单：\n\
  \n然而，冲突使得问题变得复杂。我们可以使用与 `RetrieveItem` 相同的搜索方法找到元素。但当我们在哈希表中定位元素时，不能简单地将项替换为 `emptyItem`。对\
  \ `RetrieveItem` 的回顾显示了这个问题。在循环中，检测到空槽会结束搜索。如果 `DeleteItem` “清空”了被删除元素占据的槽位，我们可能会过早终止后续搜索。\n\
  \n让我们来看来看。在图 11.4 中，假设我们通过将数组槽 [5] 设置为 `emptyItem` 来删除键为 77003 的元素。随后对元素 2504 的搜索将从哈希位置\
  \ [4] 开始。\n\n![](img/f11-04.jpg)\n\n图 11.4 使用线性探测的哈希程序\n\n解决此问题的方法之一是创建一个第三常量值 `deletedItem`，用于被删除记录占据的槽位。如果槽位包含\
  \ `deletedItem`，意味着该槽位是空闲的但曾被占用。\n\n有了这种变化，我们必须修改插入和检索操作以正确处理槽位。插入算法对待 `deletedItem`\
  \ 和 `emptyItem` 的方式相同；新元素可用槽位的搜索会结束。\n\n这种解决方案解决了搜索问题，但引入了另一个困境：在多次删除后，指向记录的路径可能会经过许多包含\
  \ `deletedItem` 的槽位。这种游荡会导致检索元素的效率下降。这些问题表明，对于我们目前所学的形式，哈希表并不是实现可删除列表的最有效数据结构。\n\
  \n### 聚类\n\n线性探测的一个问题是它会导致所谓的聚类现象。良好的哈希函数会在整个数组索引范围内产生均匀的索引分布。因此，最初记录分布在整个数组中，每个槽被填充的概率相等。随着时间的推移，在解决了若干冲突后，数组中记录的分布变得越来越不均匀。由于多个键开始竞争同一个哈希位置，记录往往聚集在一起。\n\
  \n\n\n\n此处讨论的线性探测技术是通过重哈希解决冲突的一个示例。如果哈希函数产生了冲突，则哈希值将作为重哈函数的输入，以计算新的哈希值。在上一节中，我们对哈希值加了\
  \ 1 来创建一个新的哈希值；也就是说，我们使用了重哈函数：\n\n```\n(HashValue + 1) % 100\n```\n\n对于线性探测的重哈希，你可以使用任何函数：\n\
  \n```\n(HashValue + constant) % array-size\n```\n\n只要 `constant` 和 `array-size`\
  \ 是互质的——也就是说，能够整除它们两者的最大数字是 1。例如，对于图 11.3 所示的 100 个槽位的数组，我们可以在重哈函数中使用常数 `3`：\n\n\
  ```\n(HashValue + 3) % 100\n```\n\n（尽管 100 不是质数，但 3 和 100 是互质的；它们没有大于 1 的公因子。）\n\
  \n假设我们想向图 11.3 中的哈希表添加一个键为 `14001` 的记录。原始哈希函数 `Key % 100` 返回哈希值 `1`，但这个数组槽位已被占用；它包含键为\
  \ `44001` 的记录。为了确定下一个尝试的数组槽位，我们将第一个哈希函数的结果作为输入应用重哈函数：`(1 + 3) % 100 = 4`。索引 [4]\
  \ 处的数组槽位也被占用，因此我们反复应用重哈函数，直到找到一个可用槽位。每次，我们都使用上一次重哈计算的值作为重哈函数的输入。第二次重哈给我们 `(4 + 3)\
  \ % 100 = 7`；这个槽位也被占用。第三次重哈给我们 `(7 + 3) % 100 = 10`；索引 [10] 处的数组槽位是空的，因此新元素插入到那里。\n\
  \n为了理解为什么常数和数组槽位数量必须互质，请考虑重哈函数：\n\n```\n(HashValue + 2) % 100\n```\n\n我们想向图 11.5\
  \ 所示的哈希表添加键为 `14001` 的记录。原始哈希函数 `Key % 100` 返回哈希值 `1`。该数组槽位已被占用。我们通过应用上述重哈函数来解决冲突，连续检查奇数索引，直到找到空闲槽位。如果所有奇数索引的槽位都被占用会发生什么？搜索将失败——尽管哈希表包含偶数索引的空槽位。这个重哈函数没有覆盖数组的全索引范围。然而，如果常数和数组槽位数量是互质的（例如\
  \ 3 和 100），该函数产生的连续重哈最终将覆盖数组中的每一个索引。\n\n![](img/f11-05.jpg)\n\n图 11.5 使用重哈希处理冲突\n\
  \n使用线性探测的重哈函数并不能消除聚类（尽管聚类在图中并不总是视觉可见的）。例如，在图 11.5 中，任何产生哈希值 1、4、7 或 10 键的记录将被插入到索引为\
  \ [10] 的槽位中。\n\n在线性探测中，我们每次连续应用重哈函数时都会加上一个常数（通常为 1）。另一种方法称为二次探测，它使得重哈的结果取决于重哈函数被应用的次数。在第\
  \ $I$ 次重哈中，该函数为：\n\n```\n(HashValue ± I2) % array-size\n```\n\n第一次重哈给 `HashValue`\
  \ 加 1，第二次重哈从 `HashValue` 减去 1，第三次重哈加 4，第四次减去 4，依此类推。二次探测减少了聚类，但它并不一定检查数组中的每个槽位。例如，如果\
  \ `array-size` 是 2 的幂（例如 512 或 1,024），被检查的数组槽位相对较少。然而，如果 `array-size` 是形式为 (4 *\
  \ 某个整数 + 3) 的质数，二次探测确实会检查数组中的每个槽位。\n\n第三种方法使用伪随机数生成器在每次应用重哈函数时确定 `HashValue` 的增量。随机探测\
  \ 是消除聚类的一种极佳技术，但它往往比我们讨论的其他技术要慢。\n\n![](img/f11-06.jpg)\n\n图 11.6 通过桶哈处理冲突\n\n###\
  \ 桶与链地址\n\n处理冲突的另一种方案是允许多个元素键哈希到同一个位置。解决方案是让每个计算出的哈希位置包含多个元素的槽位，而不仅仅是一个元素。这些多元素位置中的每一个都被称为桶。图\
  \ 11.6 显示了一个带有桶的哈希表，桶可以容纳多个元素。\n\n\n\n\n更重要的是，你可以设计自己的哈希函数来尽量减少冲突。目标是将元素尽可能均匀地分布在整个数组中。因此，你希望你的哈希函数尽可能地产生唯一的值。一旦承认存在冲突，你就必须引入某种搜索机制，可以通过数组搜索、链表搜索或者通过重新哈希（rehashing）。对每个元素的访问不再是直接的，搜索也不再是\
  \ `O(1)`。事实上，如果冲突导致了极不均衡的链，最坏情况可能接近 `O(N)`！\n\n为了避免这种情况，你需要了解一些关于键统计分布的知识。假设有一公司，其员工记录是根据六位公司\
  \ ID 排序的。该公司有 500 名员工，我们决定使用链地址法来处理冲突。我们设置了 100 条链（预计每链平均有五个元素），并使用哈希函数：\n\n```\n\
  idNum % 100\n```\n\n也就是说，我们使用六位 ID 数字的最后两位作为索引。计划的哈希方案如图 11.9a 所示。图 11.9b 显示了实现该哈希方案时发生的情况。元素的分布怎么会如此倾斜呢？事实证明，公司的\
  \ ID 号是由三个字段拼接而成的：\n\n![](img/f0665-01.gif)\n\n该哈希方案完全取决于入职年份来产生哈希值。由于公司成立于 1987\
  \ 年，所有元素都极不成比例地挤在一个很小的哈希位置子集内。在这种情况下，对员工元素的搜索是 `O(N)`。虽然这是一个夸张的例子，但它说明了尽可能完全地理解哈希方案中键的域和预测值的必要性。\n\
  \n### 除法法\n\n最常用的哈希函数使用除法法（`%`）来计算哈希值。我们在前面的示例中使用了这种类型的函数。通用函数为：\n\n![](img/f11-09.jpg)\n\
  \n图 11.9 处理员工记录的哈希方案\n\n```\nKey % TableSize\n```\n\n我们已经提到过将表设计得比所需的元素数量大一些的想法，以增加哈希值的范围。此外，当表的大小为质数时，除法法会产生更好的结果。\n\
  \n除法哈希函数的优点是简单性。然而，有时有必要使用更复杂（甚至是奇特的）哈希函数来获得哈希值的良好分布。\n\n#### 其他哈希方法\n\n如果元素键是字符串而不是整数，我们如何使用哈希呢？一种方法是使用字符串字符的内部表示创建一个可以作为索引的数字（记住每个\
  \ ASCII 字符在内存中都表示为 0–127 范围内的整数）。例如，下面这个简单的哈希函数接受一个五元素的 `char` 数组，并产生一个 0 到 `MAX_ITEMS\
  \ - 1` 范围内的哈希值：\n\n```\nint Hash(char letters[])\n\nPost: 返回一个 0 到 MAX_ITEMS - 1\
  \ 之间的整数。\n\n{\n\n  int sum = 0;\n\n  for (int index = 0; index < 5; index++)\n \
  \   sum = sum + int(letters[index]);\n\n  return sum % MAX_ITEMS;\n\n}\n```\n\n\
  一种称为折叠（folding）的哈希方法涉及将键拆分为几部分，并将某些部分进行拼接或异或（XOR）形成哈希值。另一种方法是将键平方，然后使用键的某些数字（或位）作为哈希值。还有许多其他技术，它们的都是为了让哈希位置在允许的范围内尽可能地唯一和随机。\n\
  \n让我们来看一个折叠的例子。假设我们想设计一个哈希函数，产生一个 0 到 255 之间的索引，而 `int` 键的内部表示是一个 32 位的位字符串。我们知道需要\
  \ 8 位来表示 256 个索引值（$2⁸ = 256$）。一个用于创建哈希函数的折叠算法可能会执行以下所有操作：\n\n1. 将键拆分为四个每个 8 位的位字符串\n\
  2. 将第一个和最后一个位字符串进行异或\n3. 将中间两个位字符串进行异或\n4. 将步骤 2 和步骤 3 的结果进行异或，产生进入数组的 8 位索引\n\n\
  我们使用键 `618403` 来说明这种方案。该键的二进制表示为：\n\n```\n00000000000010010110111110100011\n```\n\
  \n我们将这个位字符串拆分为四个 8 位字符串：\n\n```\n00000000       (左侧 8 位)\n00001001       (下一个 8\
  \ 位)\n01101111       (下一个 8 位)\n10100011       (最右侧 8 位)\n```\n\n下一步是对第一个和最后一个位字符串进行异或。两个位的异或结果是：如果两个位相同则为\
  \ 0，如果不同则为 1。要对位字符串进行异或（记为 `XOR`），我们对相邻的位应用此规则：\n\n![](img/f068-01.gif)\n\n接下来，我们对两个位字符串进行异或：\n\
  \n![](img/f068-02.gif)\n\n最后，我们对前面步骤的结果进行异或：\n\n![](img/f068-03.gif)\n\n这个二进制数等于十进制\
  \ 197，因此键 `618403` 哈希到索引 `197`。我们将该哈希函数的实现留作一项练习。\n\n\n\n\n我们可以使用哈希来来实现一个支持快速搜索的容器\
  \ ADT。当 `ItemType` 具有适合哈希的特征时，这种数据结构是实现集合（sets）和映射（maps）的极佳选择。例如，如果我们想使用集合来根据索书号表示图书馆当前在架上或已借出的书籍，我们很可能为该键开发出一个近乎完美的哈希函数。另一方面，如果我们想使用映射来表示一个拥有数千名员工的公司的电话录，名称字符串作为键的本质可能会创建一个如此复杂的哈希函数，以至于二叉搜索树会更有效。\n\
  \n前面的讨论是我们一直以来所说观点的另一个例子。我们设计 ADT 是为了为客户服务，并且尽可能保持设计与实现的解耦。然后，对于特定的应用，我们可以从多种实现方法中进行选择，以满足特定的目标（例如效率）。\n\
  \n#### 总结\n\n在本章中，我们介绍了两种关联容器 ADT：`Set` 和 `Map`。通过 `map`，我们能够将任何信息与一个键值关联起来。而 `set`\
  \ 则是最简单的关联，仅指示键是否存在。集合适用于清单等应用，而映射在我们需要查找函数的情况下则表现更好。\n\n我们已经看到如何用 `list` 实现 `set`，以及如何用二叉搜索树实现\
  \ `map`。然而，实现方法有很多，且选择取决于全集的大小或键的类型，以及我们预计可能值中被使用的比例。\n\n例如对于 `Set` ADT，我们看到两种实现方法是可行的：(i)\
  \ 显式（explicit），即基本类型的每个项都与一个存储在数组中的 `Boolean` 标志相关联；(ii) 隐式（implicit），即集合中的项保存在一个\
  \ `list` 中。当全集较小且集合可能包含其大部分内容时，显式方法是合适的。另一方面，如果全集很大，或者集合可能包含其中的少数元素，那么隐式方法是更好的选择。\n\
  \n此外，我们还看到了如何将哈希作为传统搜索算法的替代方案。当搜索键可以映射到数组中的某个位置使得冲突很少时，哈希将使我们能够以平均常数时间找到键。哈希的挑战在于找到一个合适的映射函数。如果函数的开销太大，就会违背哈希的初衷。例如，使用在使用二叉搜索树的\
  \ `Map` ADT 之上构建的哈希函数进行搜索，速度不会比直接使用树更快。另一方面，快速的哈希方案可以作为 `map` 的替代实现。\n\n除非我们足够幸运找到完美的哈希函数，否则哈希会遇到冲突。我们看到这些冲突可以通过线性探测、重哈希（rehashing）或使用链表数组的链链（chaining）来解决。可以通过增大数组以提供更多的哈希位置来减少冲突，但这可能会浪费空间。读完本章后，你将更深刻地理解，即使是看起来根据键查找值的简单\
  \ ADT，也可以也可以有许多不同的实现方式。\n\n#### 练习题\n\n1. 区分隐式集合表示和显式集合表示。\n2. 完成显式集合表示的算法设计。\n\
