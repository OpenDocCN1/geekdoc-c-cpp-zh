  \     const TreeNode* originalTree);\n\nTreeType::TreeType(const TreeType& originalTree)\n\
  // 调用递归函数 CopyTree 将 originalTree\n// 复制到 root 中。\n{\n  CopyTree(root, originalTree.root);\n\
  }\n\nvoid TreeType::operator=\n     (const TreeType& originalTree)\n// 调用递归函数 CopyTree\
  \ 将 originalTree\n// 复制到 root 中。\n{\n  if (&originalTree == this)\n    return; //\
  \ 忽略赋值给自身。\n  Destroy(root); // 释放现有的树节点。\n  CopyTree(root, originalTree.root);\n\
  }\n```\n\n递归函数 `CopyTree` 有两个参数，都是指向树节点的指针。我们称它们为 `copy` 和 `otherTree`。基本情况是什么？如果\
  \ `otherTree` 为 `NULL`，则 `copy` 为 `NULL`。如果 `otherTree` 非 `NULL`，`copy` 是什么？我们为\
