  //       如果 item 是列表第一个项，则 finished 为 true；\n//       否则为 false。\n{\n  if (currentBackPos\
  \ == NULL)\n    currentBackPos = list;\n  else\n    currentBackPos = currentBackPos->back;\n\
  \  item = currentBackPos->info;\n  finished = (currentBackPos == list->next);\n\
  }\n\nint SpecializedList::GetLength()\n{ return length; }\n```\n\n`PutFront` 将新项作为列表的第一项插入（参见图\
  \ 6.22a）。`PutEnd` 将新项作为列表最后一项插入（参见图 6.22b）。图中的结果看起来非常不同，但仔细检查发现，除了外部指针 `list` 之外它们是相同的。在开头插入项不会改变\
  \ `list`；在末尾插入项则会。我们可以对两者使用相同的插入程序，但让 `PutEnd` 移动 `list:`：\n\n![](img/f06-22.jpg)\n\
  \n图 6.22 在头部和尾部插入\n\n```cpp\nvoid SpecializedList::PutFront(int item)\n// Post:\
  \ item 已插入到列表头部。\n{\n  NodeType* newNode;\n  newNode = new NodeType;\n  newNode->info\
  \ = item;\n  if (list == NULL)\n  { // 列表为空。\n    newNode->back = newNode;\n   \
  \ newNode->next = newNode;\n    list = newNode;\n  }\n  else\n  {\n    newNode->back\
  \ = list;\n    newNode->next = list->next;\n    list->next->back = newNode;\n  \
  \  list->next = newNode;\n  }\n  length++;\n}\n\nvoid SpecializedList::PutEnd(int\
  \ item)\n// Post: item 已插入到列表尾部。\n{\n  PutFront(item);\n  list = list->next;\n}\n\
  ```\n\n我们将类析构函数、拷贝构造函数、重载赋值运算符，以及函数 `LengthIs` 和 `MakeEmpty` 的实现留作编程作业。\n\n####\
  \ 测试计划\n\n项必须在列表的两端插入，且遍历必须既正向又反向进行。注意某些操作尚未实现。例如，我们无法通过打印长度来测试构造函数。但我们如何测试它呢？嗯，如果其他操作运行正常，就可以假设构造函数是正确的。与其测试所有的头部插入后再测试所有的尾部插入，让我们稍微改变一下模式并将它们混合：\n\
  \n| 待测试的操作及动作描述 | 输入值 | 预期输出 |\n| --- | --- | --- |\n| `PutFront` | | |\n| | 插入五个项\
  \ | 1, 2, 3, 4, 5 | |\n| `PutEnd` | | |\n| | 插入两个项 | 0, –1 | |\n| `PutFront` | |\
  \ |\n| | 插入一个项 | 6 | |\n| `PutEnd` | | |\n| | 插入一个项 | –2 | |\n| `ResetForward` |\
  \ | |\n| `GetNextItem` | | | |\n| | 调用九次，每次打印 | | 6, 5, 4, 3, 2, 1, 0, –1, –2 |\n\
  | `ResetBackward` | | | |\n| `GetPriorItem` | | | |\n| | 调用九次，每次打印 | –2, –1, 0,\
  \ 1 | |\n\n\n\n\n\nC++ 在标准库中包含了许多 ADT（抽象数据类型），包括 `list`、`vector`、`stack`、`map` 等等。所有包含的数据结构都支持基于范围的迭代（range-based\
  \ iteration），这允许程序员编写更健壮的代码。例如，`list` ADT 可以直接使用，并支持与我们的 list ADT 相似的操作（以及更多）。以下是遍历\
  \ C++ `list` ADT 的示例：\n\n```cpp\n#include <list>\n\nusing namespace std;\n\nint\
  \ main()\n{\n  list<int> numbers(10, 50);\n\n  for (int n : numbers) {\n    cout\
  \ << n << endl;\n  }\n}\n```\n\n通过包含 list 头文件，可以使用 C++ 标准库中的 `list` ADT。创建新列表有多种方法。在这个程序中，我们创建了一个包含十个整数的列表，每个整数都初始化为值\
  \ 50。正如你所见到的，基于范围的 for 循环对于数组和列表看起来是一样的。事实上，对于所有的 C++ 集合，我们都可以使用相同的迭代模式。使用基于范围的迭代不需要知道长度、应该使用哪个观察方法（例如\
  \ `GetNextItem`）、特殊要求（例如 `ResetList`）或 ADT 的任何底层实现细节。这样做可以保持逻辑层与实现层的完全分离，并减少程序员出错的可能性。我们如何使用基于范围的\
  \ for 循环来遍历手工实现的 ADT 呢？\n\n事实证明，基于范围的 for 循环是传统 for 循环的语法糖，它要求集合实现某些方法。编译器会将使用基于范围的\
  \ for 循环的代码扩展为使用传统 for 循环的 C++ 代码。在此，编译器可以进行检查以确保生成的代码格式正确。\n\n为了为我们的 ADT 提供基于范围的迭代支持，我们必须将以下方法作为\
  \ ADT 实现的一部分：\n\n1. `Iterator` `begin()`：返回一个表示 ADT 起点的 `Iterator` 对象。\n2. `Iterator`\
  \ `end()`：返回一个表示 ADT 终点的 `Iterator` 对象。\n\n`Iterator` 对象是一个类的实例，它“知道”如何遍历特定的 ADT，并且需要重载三个运算符：解引用运算符\
  \ (`*`）、自增运算符 (`++`）和不等于运算符 (`!=`)）。编译器使用 ADT 的 `begin` 和 `end` 方法以及这三个运算符将基于范围的\
  \ for 循环翻译为传统的 for 循环风格。\n\n我们可以重构（重写）第 4 章中 `SortedList` 的链表实现以支持基于范围的迭代。\n\n除了支持基于范围的迭代外，我们通过元素类型\
  \ `T` 进行参数化，允许我们实例化任何类型 `T` 的元素列表。以下是排序列表类的新逻辑定义：\n\n```cpp\ntemplate<class T>\n\
  class SortedType\n{\npublic:\n  SortedType();\n  ~SortedType();\n  bool IsFull()\
  \ const;\n  int GetLength() const;\n  void MakeEmpty();\n  T GetItem(T item, bool&\
  \ found);\n  void PutItem(T item);\n  void DeleteItem(T item);\n  SortedTypeIterator<T>\
  \ begin();\n  SortedTypeIterator<T> end();\n\nprivate:\n  NodeType<T>* listData;\n\
  \  Int length;\n};\n```\n\n正如你所见，我们扩展了排序列表的定义，包含了 `begin` 和 `end` 方法，每个方法都返回一个迭代器对象实例\
  \ (`SortedTypeIterator<T>`)，该实例必须支持解引用、自增和不等于运算符。注意，我们从原始迭代实现中删除了 `ResetList` 和\
  \ `GetNextItem` 方法，转而使用基于范围的迭代。在查看 `begin` 和 `end` 的实现之前，我们必须考虑如何实现排序类型迭代器。\n\n\
  排序类型迭代器负责从列表的开始到结束进行遍历。由于我们实现的是链式结构，我们必须遍历 `NodeType<T>` 对象的链表。因此，排序类型迭代器的实现必须能够排序列表\
  \ ADT 的内部实现。特别是，排序列表 ADT 和迭代器通过共同的头文件 (`NodeType.h`) 共享 `NodeType<T>` 结构体的定义。以下是\
  \ `SortedTypeIterator` 的定义：\n\n```cpp\ntemplate<class T>\nclass SortedTypeIterator\n\
  {\npublic:\n  SortedTypeIterator(NodeType<T>* start);\n  T& operator*();\n  SortedTypeIterator<T>&\
  \ operator++();\n  bool operator!=(const SortedTypeIterator<T>& it) const;\n\nprivate:\n\
  \  NodeType<T>* item;\n};\n```\n\n`SortedTypeIterator` 包含一个单参数构造函数，指示迭代应从何处开始。它定义了为了支持基于范围的迭代而要求实现的每个运算符。解引用运算符返回迭代中当前元素的引用。自增运算符返回一个排序类型迭代器的引用，该迭代器捕获迭代中的当前元素。不等于运算符用于比较两个排序类型迭代器以判断它们是否等效。查看这些运算符的实现有助于澄清方法签名以及迭代器及其运算符用法：\n\
  \n```cpp\ntemplate<class T>\nSortedTypeIterator<T>SortedTypeIterator(NodeType<T>*\
  \ start)\n{\n  this->item = start;\n}\n```\n\n`SortedTypeIterator` 维护一个指向迭代中当前元素的指针：\n\
  \n```cpp\ntemplate<class T>\nT& SortedTypeIterator<T>::operator*()\n{\n    return\
  \ item->info;\n}\n```\n\n`SortedTypeIterator` 的工作是在我们检查当前项并希望继续移动时，简单将迭代推进到链表中的下一个元素。为了正确处理迭代，我们必须考虑边界情况：列表为空或我们到达列表末尾。\n\
  \n```cpp\ntemplate<class T>\nSortedTypeIterator<T>& SortedTypeIterator<T>::operator++()\n\
  {\n  if (item == NULL || item->next == NULL)\n    item = NULL;\n  else\n    item\
  \ = item->next;\n\n  return *this;\n}\n```\n\n最后，不等于运算符简单比较 `SortedTypeIterator`\
  \ 的项与另一个 `SortedTypeIterator` 的项：\n\n```cpp\ntemplate<class T>\nbool SortedTypeIterator<T>::operator!=(const\
  \ SortedTypeIterator<T>& it) const\n{\n  return item != it.item;\n}\n```\n\n\n\n\
  \n\n```cpp\ntemplate<class T>\n\nSortedTypeIterator<T> SortedType<T>::begin()\n\
  {\n  SortedTypeIterator<T> it(listData);\n  return it;\n}\n```\n\n`begin` 方法的实现非常直观。我们返回一个新构造的\
  \ `SortedTypeIterator`，其起始点为排序列表（由 `listData` 存储）链表中的第一个节点。注意，模板类型 `T` 对于排序列表 ADT\
  \ 及其配套的排序类型迭代器来说是同一种类型。这意味着，创建一个 `int`、`float`、`double` 等类型的排序列表，将确保返回的排序类型迭代器也具有相同的参数类型。\n\
  \n`end` 的实现同样简单：\n\n```cpp\ntemplate<class T>\n\nSortedTypeIterator<T> SortedType<T>::end()\n\
  {\n  SortedTypeIterator<T> it(NULL);\n  return it;\n}\n```\n\n我们将排序列表 ADT 的末尾表示为初始化为\
  \ `NULL` 的排序类型迭代器。当基于范围的 for 循环（range-based for loop）递增迭代器到下一个元素且该元素为 `NULL` 时，将使用重载的不等于运算符来比较排序类型迭代器的值与\
  \ `end` 返回的值，从而检测到终止条件。\n\n尽管我们刚刚演示了一个支持基于范围迭代的 ADT 的特定实现，但相同的模式可以应用于任何可以定义起始和结束迭代点的数据结构。例如，基于数组的列表实现可能会使用索引\
  \ `0` 作为其起始迭代点，使用索引 `length-1` 作为其结束迭代点。`begin` 和 `end` 的通用方法签名如下：\n\n```cpp\nIterator\
  \ begin();\n\nIterator end();\n```\n\n其中 `Iterator` 类型包含以下方法：\n\n```cpp\nT& operator*();\n\
  \nIterator& operator++();\n\nbool operator!==(const Iterator& it) const;\n```\n\n\
  并且类型 `T` 是 ADT 中包含的并由 `Iterator` 遍历的值的数据类型。`const` 的使用确保了迭代器不会被修改。\n\n基于范围的 for\
  \ 循环为遍历 ADT 提供了一种抽象。它通过将迭代的内部实现（例如，索引、链表遍历）隔离在迭代器对象内部，有助于减少程序员的错误。此外，它简化了代码，并使程序员更容易理解意图。尽管使用基于范围迭代有明显的优势，但它目前只支持正向迭代。也就是说，没有直接的方法可以反转起始和结束迭代点以允许对\
  \ ADT 进行反向迭代。\n\n#### 总结\n\n本章是理论材料和实现技巧的。C++ 并不是要求用户提供一个包含结构项信息的文件，而是提供了一种在程序中声明结构时提供这些信息的方法。模板是\
  \ C++ 的一种构造，允许客户端在声明语句中类型名旁边的角括号中指定结构中项的类型。\n\n链接列表中元素的思想已经扩展到包含头节点（header nodes）和尾部节点（trailer\
  \ nodes）的列表、循环列表以及双向链表。链接元素的思想是许多类型数据结构设计中可以考虑的可能性。\n\n浅拷贝（shallow copy）是指复制项，但没有复制它们可能指向的项目。深拷贝（deep\
  \ copy）是指复制项以及它们可能指向的项目。C++ 提供了一种名为拷贝构造函数的构造，可以用它来强制执行深拷贝。关系运算符可以被重载，以便可以使用标准符号比较不同类型的值。赋值运算符也可以被重载。\n\
  \n除了使用动态分配的节点来实现链式结构外，我们还研究了一种在记录数组中实现链式结构的技术。在这种技术中，链接不是指向空存储（free store）的指针，而是指向记录数组的索引。这种链接在系统软件中被广泛使用。\n\
  \n本章回顾了多态，并通过示例如何使用 C++ 虚函数构造来实现动态绑定。我们还检查了深拷贝与浅拷贝以及赋值运算符重载的概念。\n\n引入了基于范围的迭代并与传统的基于索引的\
  \ for 循环进行了比较。我们展示了数组和 C++ `list` ADT 上基于范围迭代的示例。来自第四章的排序列表 ADT 使用模板参数进行了泛化，并重构为使用迭代器对象支持基于范围的迭代。\n\
  \n章节末的案例研究设计了一个大整数 ADT。数字位数仅受内存大小。几个关系运算符和算术运算符被重载，以处理这种类型的对象。\n\n#### 练习题\n\n1.\
