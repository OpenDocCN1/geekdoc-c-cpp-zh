  \n# 第 5 章：ADT 栈（Stack）与队列\n\n© Repina Valeriya/Shutterstock\n\n在第 2 章中，我们从逻辑视图、应用视图和实现视图的角度查看了\
  \ C++ 的内置结构。我们看到，在语言层面，逻辑视图是构造体本身的语法，而实现视图则隐藏在编译器内部。在第 3 章和第 4 章中，我们定义了抽象数据类型（ADT）无序列表（Unsorted\
  \ List）和有序列表（Sorted List）。对于这些用户定义的 ADT，逻辑视图是类定义，其中成员函数原型上的文档说明构成了客户端程序与 ADT 之间的接口。在本章中，我们扩展了你的\
  \ ADT 工具箱，包含了两个重要的新类型：栈和队列。\n\n## 5.1 栈（Stacks）\n\n### 逻辑层面\n\n考虑图 5.1 所示的项目。尽管这些对象各不相同，但每个都说明了同一个概念——栈。在逻辑层面，栈是一组有序的同构项目或元素。现有元素的移除和新元素的添加只能在栈顶进行。例如，如果你在一叠衬衫中，你喜欢的蓝色衬衫在一条褪色的旧红色衬衫下面，你必须先从栈中取出红色衬衫（顶端元素）。只有这样，你才能取出所需的蓝色衬衫，它现在是栈的顶部元素。然后可以将红色衬衫重新放在栈顶或将其丢弃。\n\
  \n栈可以被视为一组“有序”的项目，因为元素根据它们在栈中存放的长短按特定顺序出现。在栈中存在久的元素位于底部；最近的位于顶部。在任何时候，给定栈中的任意两个元素，其中一个比另一个高。（例如，红色衬衫在栈的位置比蓝色衬衫高。）\n\
  \n由于元素只从栈顶添加和移除，因此最后一个添加的元素是第一个被移除的元素。一个实用的助记词可以帮你记住栈的行为规则：栈是一个 LIFO（后进先出）结构。\n\n\
  ![](img/f05-01.jpg)\n\n图 5.1 生活中的栈\n\n栈的访问协议总结如下：无论是检索元素还是存储新元素，都只访问栈顶。\n\n####\
  \ 栈的操作\n\n该结构的逻辑图仅提供了 ADT 定义的一半。另一部分由一组操作组成，这些操作允许用户访问和处理存储在结构中的元素。给定栈的逻辑视图，我们需要哪些类型的操作来使用栈呢？\n\
  \n将元素添加到栈顶的操作通常称为 `Push`（推栈），而从栈中移除顶端元素的操作称为 `Pop`（弹出）。因为我们可能需要检查栈顶的元素，我们可以让 `Pop`\
  \ 返回顶部元素，或者使用一个独立的操作 `Top`（查看）来返回顶部元素的副本而不将其移除。我们必须在弹出元素之前能够判断栈中是否包含任何元素，因此我们需要一个布尔操作\
  \ `IsEmpty`（判空）。作为逻辑数据结构，栈在概念上永远不会“满”的，但对于特定的实现，你可能需要在推栈之前测试栈是否已满。我们称这个布尔操作为 `IsFull`（判满）。图\
  \ 5.2 展示了被想象成积木栈的栈是如何通过多次 `Push` 和 `Pop` 操作被修改的。\n\n我们现在有了栈的逻辑图，并几乎准备好在程序中使用它。当然，程序中使用栈的部分不会关心栈实际上是如何实现的——我们希望实现层是隐藏或封装的。如\
  \ `Push`、`Pop` 和 `Top` 等访问操作充当了栈封装的窗口，通过这些窗口传递栈的数据。访问操作的接口在以下关于 `Stack` ADT 的规范中描述。\n\
  \n![](img/f05-02.jpg)\n\n图 5.2 Push 和 Pop 操作的影响\n\n此栈规范中的 `Pop` 操作，它会移除顶部元素但不返回它。因此，必须使用\
  \ `Top/Pop` 组合来检查并移除元素。另一种设计是让 `Pop` 操作返回顶部元素。在这种情况下，如果你想检查但不移除元素，则必须使用 `Pop/Push`\
  \ 对。在章节末尾的案例研究中，第二种替代方案更为合适。\n\n### 应用层面\n\n现在让我们来看一个我们如何在程序中使用栈操作的示例。栈是非常有用的 ADT，通常用于必须处理嵌套组件的情况。\n\
  \n例如，编程语言系统通常使用栈来跟踪操作调用。主程序调用操作 A，A 接着调用操作 B，B 又调用操作 C。当 C 完成时，控制返回到 B；当 B 完成时，控制返回到\
  \ A；以此此类推。调用和返回序列本质上是一个 LIFO 序列，因此栈是跟踪该序列的完美结构。当抛出异常时，在寻找适当的 catch 语句会遵循这一系列操作调用。\n\
  \n编译器经常使用栈来对语言语句进行句法分析。语言的定义通常由嵌套组件组成——例如，for 循环可以包含 if-then 语句，while 语句又包含 for\
  \ 循环。当编译器处理此类嵌套结构时，它会在栈中“保存”当前正在处理的信息。当它完成内部结构的工作时，编译器可以从栈中“检索”之前的状态并从断处继续。同样，操作系统有时会将当前执行进程的信息保存在栈中，以便处理更高优先的中断进程。如果该进程被更高优先的进程中断，其信息也可以推入进程栈。当操作系统完成最高优先级进程的工作时，它弹出最近入栈的进程信息并继续处理它。\n\
  \n让我们来看一个与嵌套组件相关的简单问题——判断一组括号是否为“良好”（well formed）。对于这个经典问题，栈是一个合适的数据结构。通用问题可以表述为：确定一组成对符号是否恰当。具体问题是：给定一组不同类型的成对符号，判断每个类型的开启和关闭版本是否正确。对于我们的示例，我们考虑括号对\
  \ `()`、`[ ]` 和 `{}`。¹ 输入中可以出现任意字符，但右括号符号必须匹配最后一个未匹配的左括号符号，且在输入结束时所有括号符号都必须匹配。图 5.3\
  \ 展示了良好和不良好表达式的示例。\n\n![](img/f05-03.jpg)\n\n图 5.3 良好和不良好的表达式\n\n\n\n\n程序逐个字符地读取表达式。对于每个字符，它会执行三个任务中的一个，取决于该字符是起始特殊符号、结束特殊符号还是非特殊符号。如果字符不是特殊符号，则它被丢弃并读取另一个字符。如果该字符是起始特殊符号，则它被保存到栈中。如果该字符是结束特殊符号，则必须将其与栈顶的上一个起始特殊符号进行比对。如果它们匹配，则该字符和上一个起始特殊符号都被丢弃，程序处理下一个字符。如果结束特殊符号与栈顶符号不匹配，或者栈为空，则该表达式的格式不正确。当程序处理完所有字符后，栈应该是空的——否则，说明存在额外的起始特殊符号。\n\
  \n现在我们准备好编写主算法，其中 `stack` 是 `StackType` 的一个实例，`symbol` 是正在检查的字符。\n\n该算法遵循这一基本模式：\n\
  \n它对表达式行（如果有多行）以及每行中的字符都使用这种处理模式。随着你识别出此类模式并在适当的时候“复用”它们，你的编程水平将会提高。\n\n算法中在进入编码阶段之前可能需要扩展的部分唯一是“处理符号”命令。此前，我们描述了如何处理每类型的字符。这里是算法形式的这些步骤：\n\
  \n我们现在准备好将此算法编码为程序 `Balanced`。我们利用了 `StackType` 类的 `stack`。我们可以编写一个带有成员函数 `IsOpen`、`IsClosed`\
  \ 和 `Matches` 以及一个 `char` 类型数据项的类 `SymbolType`。然而，由于符号只是内置数据类型，使用过程化的解决方案更为简单。\n\
  \n```\n#include \"StackType.h\"\n\n#include <iostream>\n\nbool IsOpen(char symbol);\n\
  \nbool IsClosed(char symbol);\n\nbool Matches(char symbol, char openSymbol);\n\n\
  typedef char ItemType;\n\nint main()\n\n{\n\n  using namespace std;\n\n  char symbol;\n\
  \n  StackType stack;\n\n  bool balanced = true;\n\n  char openSymbol;\n\n  cout\
  \ << \"Enter an expression and press return.\" << endl;\n\n  cin.get(symbol);\n\n\
  \  while (symbol != '\\n' && balanced)\n\n  {\n\n    if (IsOpen(symbol))\n     \
  \ stack.Push(symbol);\n\n    else if (IsClosed(symbol))\n\n    {\n\n      if (stack.IsEmpty())\n\
  \        balanced = false;\n\n      else\n\n      {\n\n        openSymbol = stack.Top();\n\
  \n        stack.Pop();\n\n        balanced = Matches(symbol, openSymbol);\n\n  \
  \    }\n\n    }\n\n    cin.get(symbol);\n\n  }\n\n  if (!stack.IsEmpty())\n    balanced\
  \ = false;\n\n  if (balanced)\n\n    cout << \"Expression is well formed.\" << endl;\n\
  \n  else\n\n    cout << \"Expression is not well formed.\"  << endl;\n\n  return\
  \ 0;\n\n}\n\nbool IsOpen(char symbol)\n\n{\n\n  if ((symbol == '(') || (symbol ==\
  \ '{') || (symbol == '['))\n    return true;\n\n  else\n    return false;\n\n}\n\
  \nbool IsClosed(char symbol)\n\n{\n\n  if ((symbol == ')') || (symbol == '}') ||\
  \ (symbol == ']'))\n    return true;\n\n  else\n    return false;\n}\n\nbool Matches(char\
  \ symbol, char openSymbol)\n\n{\n\n  return  (((openSymbol == '(') && symbol ==\
  \ ')')\n        || ((openSymbol == '{') && symbol == '}')\n        || ((openSymbol\
  \ == '[') && symbol == ']'));\n\n}\n```\n\n![](img/f0285-01.jpg)\n\n在这个表达式检查器中，我们充当了栈的使用者。我们编写了一个有趣的栈应用，甚至没有考虑栈是如何实现的。栈用户不需要知道实现细节！实现的细节仍然隐藏在\
  \ `StackType` 类内部。然而，作为用户，我们并没有严格地遵守规范。我们本应该结合 `try/catch` 语句来包含 `Push`、`Pop` 和\
  \ `Top`。我们将这一纠正留作练习。\n\n#### 实现层次\n\n接下来，我们考虑我们的栈 ADT 的实现。毕竟，我们的函数 `Push`、`Pop`\
  \ 和 `Top` 并不是魔法般地出现在 C++ 程序员面前的。我们需要编写这些例程将它们包含在程序中。\n\n由于栈的所有元素都是同一种类型，数组似乎是存储这些元素的合理结构。我们可以将元素放入数组的顺序槽中，将第一个入栈的元素放在数组第一个位置，第二个入栈的元素放在数组第二个位置，依此类推。浮动的“水位”标记是栈的顶端元素。为什么，这种方法听起来正就像我们的无序列表\
  \ ADT 实现一样！在这里 `info[length - 1]` 是栈顶。\n\n注意：我们并不是在说栈是一个无序列表。栈和无序列表是两个完全不同的 ADT。然而，我们说的是我们可以对两者使用相同的实现策略。\n\
  \n### 栈类的定义\n\n我们用 C++ 类来实现我们的栈 ADT。就像我们为不同版本的列表 ADT 一样，我们要求用户为我们提供一个名为 `ItemType`\
  \ 的类，它定义了栈上的元素。然而，我们不需要比较函数，因为没有哪个操作需要比较栈上的两个元素。\n\n我们的栈 ADT 需要哪些数据成员？我们需要栈元素本身以及一个指示栈顶的变量（它的行为与\
  \ `length` 相同）。\n\n```\n#include ItemType.h\n\n// ItemType 由用户提供。\n\n//   MAX_ITEMS:\
  \      栈上的最大元素数量。\n\n//   ItemType:       栈上对象的定义。\n\nclass FullStack\n\n// 当栈满时\
  \ Push 使用的异常类。\n\n{};\n\nclass EmptyStack\n\n// 当栈空时 Pop 和 Top 使用的异常类。\n\n{};\n\n\
  class StackType\n\n{\n\npublic:\n\n  StackType();\n\n  bool IsEmpty() const;\n\n\
  \  bool IsFull() const;\n\n  void Push(ItemType item);\n\n  void Pop();\n\n  ItemType\
  \ Top() const;\n\nprivate:\n\n  int top;\n\n  ItemType items[MAX_ITEMS];\n\n};\n\
  ```\n\n### 栈操作的定义\n\n在列表 ADT 中，`length` 表示列表中存在多少元素。在栈 ADT 中，`top` 指明哪个元素在顶端。因此，我们与列表\
  \ ADT 的类比偏移了一个。类构造函数将 `top` 设置为 -1 而不是 0。`IsEmpty` 应该比较 `top` 与 -1，而 `IsFull` 应该比较\
  \ `top` 与 `MAX_ITEMS -1`。\n\n```\nStackType::StackType()\n\n{\n\n  top = -1;\n\n\
  }\n\nbool StackType::IsEmpty() const\n\n{\n\n  return (top == -1);\n\n}\n\nbool\
  \ StackType::IsFull() const\n\n{\n\n  return (top == MAX_ITEMS-1);\n\n}\n```\n\n\
  现在我们必须编写在栈顶 `Push` 一个元素、从栈顶 `Pop` 元素元素并返回栈顶元素拷贝的算法。`Push` 必须增加 `top` 并将新元素存入 `items[top]`。如果在调用\
  \ `Push` 时栈已经满，产生的情况被称为栈溢出。我们可以通过多种方式处理溢出条件的错误检查。我们的规范规定溢出会导致抛出异常；因此，客户端负责通过在 `try/catch`\
  \ 语句中包含操作来处理溢出。或者，我们可以传递一个错误标志作为参数，当溢出发生时 `Push` 将其设置为 true。\n\n```\n void StackType::Push(ItemType\
  \ newItem)\n\n{\n  if (IsFull())\n    throw FullStack();\n\n  top++;\n\n  items[top]\
  \ = newItem;\n}\n```\n\n\n\n\n异常类 异常类的构造函数在 `throw` 语句中被调用，因为 C++ 要求我们抛出一个异常类型的对象。由于文档说明\
  \ `Push`、`Pop` 和 `Top` 函数可能会抛出异常，因此对这些函数的调用必须封装在 `try` 块中。以下示例显示了客户端代码如何处理异常：\n\n\
  ```\ntry\n{\n  // Code\n  stack.Push(item);\n  stack.Pop();\n  // More code\n}\n\
  catch (FullStack exceptionObject)\n{\n  cerr << \"FullStack exception thrown\" \
  \  << endl;\n}\ncatch (EmptyStack exceptionObject)\n{\n  cerr << \"EmptyStack exception\
  \ thrown\"  << endl;\n}\n```\n\n在这种情况下，抛出的 `FullStack` 或 `EmptyStack` 对象没有被访问。如果异常类有成员函数，可以将这些函数应用于\
  \ `exceptionObject`。如果异常严重到程序应该停止运行，可以使用 `exit` 函数。\n\n```cpp\ncatch (EmptyStack\
  \ exceptionObject)\n{\n  cerr << \"EmptyStack exception thrown\"  << endl\n    \
  \ << \"Exiting with error code 2\" << endl;\n}\n```\n\n`Pop` 本质上是 `Push` 的逆操作：我们递减\
  \ `top`。当我们调用 `Pop` 或 `Top` 时，如果栈为空，则会导致栈下溢。与 `Push` 函数一样，操作规范说明在此情况下应抛出一个异常。\n\n\
  以下是 `Pop` 和 `Top` 的代码：\n\n```cpp\nvoid StackType::Pop()\n{\n  if(IsEmpty())\n  \
  \  throw EmptyStack();\n  top--;\n}\n\nItemType StackType::Top() const\n{\n  if\
  \ (IsEmpty())\n    throw EmptyStack();\n  return items[top];\n}\n```\n\n图 5.4 显示了当栈项为字符时，入栈和弹出操作的结果。\n\
  \n#### 测试计划\n\nStack ADT 的测试计划与 List ADT 的测试计划非常相似。由于我们正在测试刚刚编写的抽象数据类型的实现，我们使用了白盒测试策略，检查每个操作。然而，与\
  \ List ADT 不同，我们没有允许我们循环遍历并打印项的迭代器。相反，我们必须结合使用 `Top` 和 `Pop` 来打印栈中的内容，并在过程中将其销毁。\n\
  \n![](img/f05-04.jpg)\n\n图 5.4 一系列 `Push` 操作后执行 `Pop` 的影响\n\n由于存储在栈中的数据类型对操作栈的操作没有影响，我们可以定义\
  \ `ItemType` 来表示 `int` 值并将 `MAX_ITEMS` 设置为 5，知道无论 `MAX_ITEMS` 是 5 还是 1000，代码的运行方式都是相同的。\n\
  \n在 Web 上，程序 `StackDr.cpp` 是测试驱动程序，输入文件为 `Stack-Type.in`，输出文件为 `StackType.out` 和\
  \ `StackType.screen`。检查 `StackDr.cpp` 查看如何使用 `try/catch` 语句。\n\n### 基于数组的替代实现\n\n\
  在最后一章中，我们介绍了一种使用数组实现数组列表的方法，其存储在运行时分配。我们可以使用相同的技术在动态分配的数组中实现栈。我们可以让最大项数作为类构造函数的参数。此更改需要在类定义中进行以下更改：\n\
  \n| 需要测试的操作及动作描述 | 输入值 | 期望输出或程序行为 |\n| :--- | :--- | :--- |\n| 类构造函数 | | |\n| |\
  \ 立即应用 `IsEmpty` | 栈为空 |\n| `Push`, `Pop`, 和 `Top` | | |\n| | 推入 4 个项 | | |\n| |\
  \ top, pop, 和打印 | 5, 7, 6, 9 | 9, 6, 7, 5 |\n| | 推入重复项 | | |\n| | 并 pop, top, 和打印\
  \ | 2, 3, 3, 4 | 4, 3, 3, 2 |\n| `Push`, `Pop`, 和 `Top` | | |\n| | 交替操作 | | |\n\
  | | Push | 5 | |\n| | Pop | | |\n| | Push | 3 | |\n| | Push | 7 | |\n| | Pop | |\
  \ |\n| | Top 和打印 | | 3 |\n| `IsEmpty` | | |\n| | 在空时调用 | 栈为空 |\n| | Push 并调用 | 栈不为空\
  \ |\n| | Pop 并调用 | 栈为空 |\n| `IsFull` | | |\n| | 推入 4 个项并调用 | 1, 2, 3, 4 | 栈未满 |\n\
  | | 推入另一个项并调用 | 5 | 栈已满 |\n| 抛出 `FullStack` | | 被驱动程序捕获 |\n\n\n\n\n\n```\nvoid StackType::Push(ItemType\
  \ newItem)\n\n// 将 newItem 添加到栈顶。\n\n// 栈的大小受内存大小限制。\n\n// 前提：栈已初始化。\n\n// 后置： 如果栈满了，则抛出\
  \ FullStack 异常；\n//       否则 newItem 位于栈顶。\n\n{\n  if (IsFull())\n    throw FullStack();\n\
  \  else\n  {\n    NodeType* location;\n    location = new NodeType;\n    location->info\
  \ = newItem;\n    location->next = topPtr;\n    topPtr = location;\n  }\n}\n```\n\
  \n### 函数 `Pop`\n\n现在让我们来看 `Pop` 操作。`Pop` 的算法如下：\n\n```cpp\nvoid StackType::Pop()\n\
  \n// 从栈中移除栈顶项并将其返回到 item。\n\n// 前提：栈已初始化。\n\n// 后置： 如果栈为空，则抛出 EmptyStack 异常；\n//\
  \       否则栈顶元素已被移除。\n\n{\n  if (IsEmpty())\n    throw EmptyStack();\n  else\n  {\n\
  \    NodeType* tempPtr;\n    tempPtr = topPtr;\n    topPtr = topPtr->next;\n   \
  \ delete tempPtr;\n  }\n}\n```\n\n让我们结合图 5.5 中的栈来走一遍这个函数。我们保存指向第一个节点的指针，以便稍后访问并删除它（图\
  \ 5.5a）。然后，指向栈的外部指针向前移动以跳过第一个节点，使第二个节点成为新的栈顶项。我们如何知道第二个节点的地址呢？我们从第一个节点的 `next` 成员（`topPtr->next`）获取它。将此值赋值给\
  \ `topPtr` 以完成取消链的任务（图 5.5b）。最后，我们使用 `delete` 释放旧栈顶节点所占用的空间，即我们保存存在 `tempPtr` 中的地址（图\
  \ 5.5c）。\n\n当调用 `Pop` 时栈中只有一个节点，这个函数能正常工作吗？让我们来看看：我们从栈中取消第一个/最后一个节点。我们保存该节点的指针，像之前一样尝试将\
  \ `topPtr->next` 赋值给 `topPtr`（图 5.6）。`topPtr->next` 的值是什么？因为这是最后一个节点，它的 `next` 成员应该包含\
  \ `NULL`。这个值被赋值给 `topPtr` 正如我们需要的，因为 `NULL` 指针意味着栈是空的。所以它对于只有一个元素的栈是有效的。\n\n![](img/05-05.jpg)\
  \ 图 5.5 弹出栈\n\n如果 `Pop` 不检查栈空会发生什么？如果 `topPtr` 包含 `NULL`，那么语句\n\n```cpp\ntopPtr\
  \ = topPtr->next;\n```\n\n会导致运行时错误。在某些系统中你会得到“尝试引用空指针”的消息；在其他系统中程序会死机。但代码在操作之前检查了栈空。\n\
  \n![](img/05-06.jpg) 图 5.6 弹出栈中的最后一个元素\n\n### 函数 `Top`\n\n一眼可以看出，栈顶的信息位于第一个节点的 `info`\
  \ 字段中。\n\n```cpp\nItemType StackType::Top()\n\n// 返回栈顶项的副本。\n\n// 前提：栈已初始化。\n\n\
  // 后置： 如果栈为空，则抛出 EmptyStack 异常；\n//       否则返回栈顶元素的副本。\n\n{\n  if (IsEmpty())\n\
  \    throw EmptyStack();\n  else\n    return topPtr->info;\n}\n```\n\n#### 其他栈函数\n\
  \n在推送元素的解释中提到空栈由 `NULL` 指针表示。这一事实对其他栈操作有影响。要将栈初始化为空状态，我们只需要将 `topPtr` 设置为 `NULL`：\n\
  \n```cpp\nStackType::StackType()    // 类构造函数\n\n{\n  topPtr = NULL;\n}\n```\n\n\
  这很简单；`IsEmpty` 函数同样简单。如果我们通过将 `topPtr` 设置为 `NULL` 来初始化空栈，那么可以通过检查指针来检测空栈。\n\n```cpp\n\
  bool StackType::IsEmpty() const\n\n// 如果栈没有元素，返回 true；否则返回 false。\n\n{\n  return\
  \ (topPtr == NULL);\n}\n```\n\n`IsFull` 函数呢？我们可以从其他链类借用代码，因为在所有情况下，请求和查找节点是否存在的算法都是相同的。\n\
  \n```cpp\nbool StackType::IsFull() const\n\n// 如果空存储中没有空间容纳另一个 ItemType，返回 true；否则返回\
  \ false。\n\n{\n  NodeType* location;\n  try\n  {\n    location = new NodeType;\n\
  \    delete location;\n    return false;\n  }\n  catch(std::bad_alloc)\n  {\n  \
  \  return true;\n  }\n}\n```\n\n我们的类定义还提供了一个析构函数。我们需要一个吗？需要的。任何使用动态数据的类都需要。\n\n\
  ```cpp\nStackType::~StackType()\n\n// 后置：栈为空；所有项都已释放。\n\n{\n  NodeType* tempPtr;\n\
  \  while (topPtr != NULL)\n  {\n    tempPtr = topPtr;\n    topPtr = topPtr->next;\n\
  \    delete tempPtr;\n  }\n}\n```\n\n栈 ADT 的链式实现可以使用为数组版本编写相同的测试计划进行测试。\n\n### 实现比较\n\
  \n我们查看了三种不同的栈实现。前两种相似，因为它们使用数组来存储项；一个使用静态数组，另一个使用动态数组。第三种实现非常不同，为每个项都使用动态分配。我们可以从存储需求和效率方面比较这些实现。最大大小的数组无论数组槽如何使用都会占用相同的内存；我们需要为最大情况预留空间。使用动态存储的链式实现只需要栈中元素数量所需的空间。然而注意，元素更大，因为我们不仅要存储数据，还要存储链接。\n\
  \n我们用大 O 表示法比较这三种实现的相对“效率”。在所有三种实现中，类构造函数、`IsFull` 和 `IsEmpty` 显然都是 $O(1)$。它们总是花费常数的工作。`Push`、`Top`\
  \ 和 `Pop` 呢？栈中元素的数量会影响这些操作所执行的工作量吗？不影响。在三种实现中，我们都直接访问栈顶，因此这些操作也花费常数的工作。它们也具有 $O(1)$\
  \ 复杂度。\n\n类析构函数在实现之间有所不同。静态存储中的数组实现不需要析构函数，但动态存储中的数组实现需要一个。动态分配数组的析构函数返回单个存储块；单元块的大小不会改变工作量。因此，复杂度是\
  \ $O(1)$。链式实现必须处理栈中的每个节点以释放节点空间。因此，该操作具有 $O(N)$ 复杂度，其中 $N$ 是栈中的节点数量。\n\n总体而言，三种栈实现在工作量方面大致相当，仅在五个操作之一以及类析构函数上不同。注意，如果差异出现在\
  \ `Push`、`Top` 或 `Pop` 操作而不是不频繁调用的析构函数中，它将更有意义。表 5.1 总结了栈操作的大 O 比较。在三种实现之间不同的操作用粗体表示。\n\
  \n\n\n\n那么哪种更好呢？答案一如既往是：这取决于情况。链表实现无疑提供了更大的灵活性，在栈项数量变化很大的应用中，当栈较小时，它浪费的空间更少。在栈的大小完全不可预测的情况下，链表实现更为优优，因为大小在很大程度上并不重要。那么，我们为什么想要使用基于数组的实现呢？因为它短小、简单且高效。如果频繁发生入栈和弹出操作，基于数组的实现执行速度更快，因为它没有产生\
  \ `new` 和 `delete` 操作的运行时开销。当 `maxStack`（ADT 规范中的 `MAX_ITEMS`）较小，且我们能确定不需要超过声明的栈大小时，基于数组的实现是一个很好的选择。此外，如果你使用的编程语言不支持动态存储器分配，那么数组实现可能是唯一的良好选择。\n\
  \n| | 静态数组实现 | 动态数组实现 | 链表实现 |\n| --- | --- | --- | --- |\n| 类构造函数 | 0(1) | 0(1)\
  \ | 0(1) |\n| IsFull | 0(1) | 0(1) | 0(1) |\n| IsEmpty | 0(1) | 0(1) | 0(1) |\n\
  | Push | 0(1) | 0(1) | 0(1) |\n| Pop | 0(1) | 0(1) | 0(1) |\n| 析构函数 | NA | 0(1)\
  \ | 0(N) |\n\n表 5.1 栈操作的 Big O 对\n\n### 5.3 队列\n\n#### 逻辑层面\n\n栈是一种抽象数据结构，其特殊属性是元素总是从栈顶添加和从栈顶移除。根据经验我们知道，许多数据元素集合以相反的方式运行：元素从一端添加，从另一端移除。这种结构被称为\
  \ FIFO（先入先出）队列，在计算机程序中有许多用途。我们从逻辑、实现和应用三个层面来考虑 FIFO 队列数据结构。在本章的剩余部分，“队列”指的是 FIFO\
  \ 队列。（第 9 章 讨论了另一种队列类型的 ADT，即优先级队列。优先级队列的访问协议与 FIFO 队列不同。）\n\n`queue`（读音类似于字母 Q）是一个有序的、同类的元素组，新元素从一端（“尾部”）添加，元素从另一端（“头部”）移除。作为队列的一个例子，考虑在大学书店排队购买教科书的学生队伍（参见图\
  \ 5.7）。在理论上（尽管在实践中并非如此），每个学生都从尾部排队。当收银员准备好帮助新客户时，队头的学生得到服务。\n\n要向队列添加元素，我们访问队列的尾部；要移除元素，我们访问队列的头部。即使我们在物理上将队列元素存储在随机访问结构中，中间元素在逻辑上也是无法访问的。将队列想象成一端为头部另一端为尾部的线性结构是方便的。然而，我们必须强调，队列的“端”是抽象的；它们可能对应于队列实现的任何物理特征。队列的本质属性是其\
  \ FIFO 访问。\n\n![](img/f05-07.jpg)\n\n图 5.7 FIFO 队列\n\n像栈一样，队列是我们以后稍后使用的数据持有结构。我们将一个数据项放入队列中；当我们以后需要它时，将其从队列中取出。如果我们想更改一个元素的值，必须将该元素从队列中取出，更改其值，然后返回队列。我们不直接操作当前在队列中的项的值。\n\
  \n##### 队列操作\n\n书店的示例提示了两个我们可以应用于队列的操作。首先，新元素可以添加到队列的尾部，我们称这种操作为 `Enqueue`。我们也可以从队列的头部移除元素，我们将这种操作称为\
  \ `Dequeue`。与栈操作 `Push` 和 `Pop` 不同，队列的添加和移除操作没有标准名称。`Enqueue` 有时被称为 `Enq`、`Enqueue`、`Add`\
  \ 和 `Insert`；`Dequeue` 也被称为 `Deq`、`Deque`、`Remove` 和 `Serve`。\n\n另一个有队列操作是检查队列是否为空。`IsEmpty`\
  \ 函数在队列为空时返回 true，否则返回 false。我们只有在队列不时不才能应用 `Dequeue`。从理论上讲，我们可以一直应用 `Enqueue`，因为原则上队列的大小没有限制。然而根据根据对栈的经验，某些实现（例如数组表示）要求我们在添加另一个元素之前测试结构是否已满。这种现实考虑也适用于队列，因此我们定义了\
  \ `IsFull` 操作。我们还需要一个操作将队列恢复到空状态，我们称之为 `MakeEmpty`。图 5.8 显示了这一系列操作如何影响队列。\n\n![](img/f05-08.jpg)\n\
  \n图 5.8 队列操作的影响\n\n我们简要描述了一组队列的访问操作。在讨论该结构的使用和实现之前，让我们先定义 `Queue` 的规范。\n\n#### 应用层面\n\
  \n我们讨论了操作系统和编译器如何使用栈。队列通常用于系统编程。例如，操作系统经常维护一个就绪或等待特定事件的进程列表。创建操作系统的程序员可以使用 `Queue`\
  \ 来实现这些列表。\n\n计算机系统经常必须为进程、程序甚至系统之间的消息提供“持有区域”。这个区域通常被称为“缓冲区”，通常实现为 FIFO 队列。例如，如果大量邮件同时到达邮件服务器，它们将留在缓冲区中，直到邮件服务器可以处理它们。它按照到达的顺序处理消息——即先入先出顺序。\n\
  \n为了演示队列的使用，我们首先看一个简单的问题：识别回文。回文是与其正读和反读都相同的字符串。虽然我们不确定它们的通用用途，但识别这些字符串为我们使用队列和栈提供了一个很好的例子。此外，回文很有趣。一些著名的回文有：\n\
  \n*   向策划巴拿马运河的西西·罗斯福致：“A man, a plan, a canal—Panama!”\n*   据传拿破·波拿巴在被流到埃尔巴岛时说的话（尽管这很难相信，因为拿破主要说法语！）：Able\
  \ was I ere, I saw Elba.”\n*   在餐馆听到：“Won ton? Not now!”\n*   可能是世界上第一个回文：“Madam,\
  \ I’m Adam.”\n*   紧随其后的是世界上最短的回文之一：“Eve.”\n\n如所见，回文的规则相对松散。通常，我们不担心标点符号、空格或字母的大小写。判断字符串是否为回文有两种显而易见的算法。第一个算法从两端开始向内移动比较字符。可能会有情况：\n\
  \n1.  有两个不匹配的字符。\n2.  所有字符都匹配，包括两个中间字符。\n3.  字符数量是奇数，且中间字符左右两侧的字符匹配。\n\n\n\n\n第二种算法按反序复制字符串，并逐个字符地匹配这两个副本。由于我们已经有了一个可以返回反序字符串的结构，让我们就使用第二种算法吧。\n\
  \n字符被逐个读取并存储在一个队列和一个栈中。当该行行中的所有字符都处理完毕后，程序会反复地从栈中弹出一个字母，从队列中出出一个字母。只要这些字母在整个过程中都是相互匹配的，那么整个字符串就是一个回文。你能看出为什么吗？因为队列是一个先进先出的列表，字母从队列返回的顺序与它们在字符串中出现的顺序相同。然而，从栈中取出的字母返回顺序与它们在字符串中出现的顺序相反。因此，该算法比较的是字符串的正向视图字符与字符串的反向视图字符。\n\
  \n现在，我们准备好编写主算法了，假设我们有一个 `Stack` ADT 实例和一个 `Queue` ADT 实例。该算法的基本流程是连续读取并处理字符，直到到达行尾。\n\
  \n算法中的所有语句都可以使用 `StackType` 和 `QueType` 对象立即编写代码。程序位于 `palindrome.cpp` 文件中。\n\n\
  ```\n#include \"QueType.h\"\n\n#include \"StackType.h\"\n\n#include <iostream>\n\
  \nint main()\n{\n  using namespace std;\n  bool palindrome = true;\n  char character;\n\
  \  StackType stack(40);\n  QueType queue(40);\n  char stackChar;\n  char queChar;\n\
  \  cout << \"Enter a string; press return.\" << endl;\n  cin.get(character);\n\n\
  \  while (character != '\\n')\n  {\n    stack.Push(character);\n    queue.Enqueue(character);\n\
  \    cin.get(character);\n  }\n\n  while (palindrome && !queue.IsEmpty())\n  {\n\
  \    stackChar = stack.Top();\n    stack.Pop();\n    queue.Dequeue(queChar);\n\n\
  \    if (stackChar != queChar)\n      palindrome = false;\n  }\n\n  if (palindrome)\n\
  \    cout << \"String is a palindrome\" << endl;\n  else\n    cout << \"String is\
  \ not a palindrome\" << endl;\n\n  return 0;\n}\n```\n\n这两张截图说明了该算法的正确性和局限性。大写字母和小写字母不被认为是相同的。该算法还有其他问题吗？你需要在练习中检查这个问题并改进该算法。\n\
  \n![](img/f0306-01.jpg)\n\n## 实现层次 (Implementation Level)\n\n既然我们已经有机会成为队列的使用者，让我们来看看如何在\
  \ C++ 中实现一个队列。像栈一样，队列可以存储在静态数组中，其大小在编译时固定；也可以存储在动态分配的数组中，其大小在运行时确定。我们在这里查看动态实现。\n\
  \n### 队列类的定义\n\n为了专注于 ADT 队列本身，我们将其实现为存储 `char` 类型元素的队列。让我们让数组变为动态分配。与栈类一样，我们不需要比较函数，因为没有一个操作需要比较队列中的元素。\n\
  \n我们的 `Queue` ADT 需要哪些数据成员？我们需要元素本身，但在现阶段我们还不知道还需要什么。我们允许用户通过参数化构造函数来确定最大尺寸。另外注意，我们还实现了一个\
  \ `MakeEmpty` 函数以及一个类构造函数。\n\n```\ntypedef char ItemType;\n\nclass QueType\n{\n\
  public:\n  QueType(int max);  // max 是队列的大小。\n  QueType();         // 默认大小为 500。\n\
  \  ~QueType();\n  void MakeEmpty();\n  bool IsEmpty() const;\n  bool IsFull() const;\n\
  \  void Enqueue(ItemType item);\n  void Dequeue(ItemType& item);\n\nprivate:\n \
  \ ItemType* items;\n  int maxQue;\n  // 我们需要的其他内容。\n};\n```\n\n### 队列操作实现\n\n第一个要考虑的问题是在如何在数组中排列元素。在实现栈时，我们首先将元素插入到数组第一个位置，然后让栈顶随着随后的\
  \ `Push` 和 `Pop` 操作浮动。然而，栈底固定在数组的第一个槽位。我们是否可以对队列使用类似的解决方案，让队列的头部固定在数组第一个槽位，并在添加新元素时让队尾向下移动？\n\
  \n让我们看看如果将第一个元素插入数组第一个位置，第二个元素插入第二个位置，依此类推，在几次 `Enqueue` 和 `Dequeue` 操作后会发生什么。在四次调用参数为‘A’、‘B’、‘C’和‘D’的\
  \ `Enqueue` 后，队列看起来如下：\n\n![](img/f0308-01.jpg)\n\n记住，队列的头部固定在数组的第一个槽位，而队列的队尾在每次\
  \ `Enqueue` 时都会向下移动。\n\n![](img/f0308-02.jpg) 该操作删除了第一个槽位的元素并留下了空位。为了让队列的头部固定在数组的顶部，我们需要将队列中的所有元素向上移动：\n\
  \n![](img/f0308-03.jpg) 总结一下此设计的队列操作。`Enqueue` 操作将与 `Push` 相同。`Dequeue` 操作将比 `Pop`\
  \ 更复杂，因为队列的所有剩余元素必须向上移动，以便将新的队列头部移动第一个槽位。构造函数、`IsEmpty` 和 `IsFull` 操作与栈的操作相同。\n\n\
  在继续之前，我们想强调这种设计是可行的。它可能不是最好的设计，但它是正确的。实现相同的数据结构有多种功能正确的方法。某种设计可能比另一种差（因为它占用更多空间或执行时间更长），但仍然有效。虽然我们不提倡在程序或数据结构中使用糟糕的设计，但首要要求始终是正确性。\n\
  \n现在让我们评估这个特定的设计。它的优点是简单易于编码；它非常像栈的实现。虽然队列是从两端访问的，而不是单端，我们只需要跟踪队尾，因为头部是固定的。只有 `Dequeue`\
  \ 操作更复杂。该设计的弱点有多严重？为了做出这种判断，我们必须了解队列是如何被使用的。如果此队列被用于存储大量元素，或者队列中的元素很大（例如具有许多数据成员的类对象），那么在移除头部元素后移动所有元素所需的处理使得这种方案很糟糕。另一方面，如果队列通常只包含少量元素且它们很小（例如整数），那么数据移动可能不需要多少处理。此外，我们还需要考虑性能——程序执行的快慢——对于使用队列的应用程序是否重要。因此，对设计的完整评估取决于客户端程序的需求。\n\
  \n### 另一种队列设计\n\n\n\n\n\n移动数组中的元素源于我们决定将队列的头部固定在数组的第一个槽位。如果我们同时跟踪队首和尾尾索引，就可以让队列的两端在数组中浮动。\n\
  \n`Figure 5.9` 显示了多次 `Enqueue` 和 `Dequeue` 操作如何影响队列。（为了简单起见，该图仅显示了队列中的元素。其他槽位包含逻辑垃圾，包括出队的值。）`Enqueue`\
  \ 操作的效果与之前相同；它们将元素添加到数组的后续槽位，并增加 `rear` 指示的索引。然而，`Dequeue` 操作要简单得多。它不需要将元素移动到数组开头，只需将\
  \ `front` 指示指向下一个槽位。\n\n让队列元素在数组中浮动时，当 `rear` 指示到达数组末尾就会产生一个新问题。在我们第一个设计中，这种情况告诉我们队列已满。但现在，当（逻辑）队列尚未满时，队列的\
  \ `rear` 可能已经达到了（物理）数组的末尾（`Figure 5.10a`）。\n\n![](img/f05-09.jpg)\n图 5.9 `Enqueue`\
  \ 和 `Dequeue` 的影响\n\n![](img/f05-10.jpg)\n图 5.10 队列元素的环绕\n\n由于数组开头可能仍有空间，显而易见的解决方案是让队列元素绕过数组末尾“环绕”。换句话说，我们可以将数组视为一个循环结构，其中最后一个槽位之后紧跟第一个槽位（`Figure\
  \ 5.10b`）。例如，为了获取 `rear` 指示的下一个位置，我们可以使用 `if` 语句：\n\n```cpp\nif (rear == maxQue\
  \ - 1)\n  rear = 0;\nelse\n  rear = rear + 1\n```\n\n![](img/f05-11.jpg)\n图 5.11\
  \ 空队列\n\n![](img/f05-12.jpg)\n图 5.12 满队列\n\n我们也可以通过使用取模运算符（`%`）来重置 `rear`：\n\n```cpp\n\
  rear = (rear + 1) % maxQue;\n```\n\n这个解决方案引出了我们一个新问题：我们如何知道队列是空的还是满的？在 `Figure 5.11`\
  \ 中，我们移除了最后一个元素，使队列为空。在 `Figure 5.12` 中，我们在队列的最后一个空槽位添加了一个元素，使队列变满。然而，`front` 和\
  \ `rear` 的值在两种情况下是相同的。我们无法区分满队列和空队列。\n\n我们想到的第一个解决方案是在队列类中除 `front` 和 `rear` 之外添加另一个数据成员——队列中元素的计数。当\
  \ `count` 成员为 0 时，队列为空；当 `count` 等于数组槽位的最大数量时，队列为空。注意，保持此计数会给 `Enqueue` 和 `Dequeue`\
  \ 程序增加工作量。但是，如果用户频繁需要知道队列中的元素数量，这个解决方案无疑是一个很好的选择。我们将该解决方案的实现留作练习。\n\n另一种常见但不那么直观的方法是让\
  \ `front` 指向队列头部元素之前的数组槽位索引，而不是指向头部元素本身的索引。如果 `rear` 仍然指示队列尾元素的索引，那么当 `front` 等于\
  \ `rear` 时，队列为空。要出队一个元素，我们增加 `front` 以指示队列头部元素的真实位置，并将该数组槽位中的值赋值给 `item`。（在此设计中，更新\
  \ `front` 先于赋值，因为在 `Dequeue` 开始时，`front` 并没有指向真正的头部元素。）在此 `Dequeue` 操作之后，`IsEmpty`\
  \ 发现 `front` 等于 `rear`，表示队列为空（见 `Figure 5.13`）。\n\n![](img/f05-13.jpg)\n图 5.13 测试空队列\n\
  \n![](img/f05-14.jpg)\n图 5.14 测试满队列\n\n为了实现此方案，我们必须建立的额外约定是：`front` 指示的槽位（真实头部之前的槽位）是预留的。它不能包含队列元素。因此，如果有\
  \ 100 个数组位置，队列的最大容量为 99 个元素。要测试队列是否满，我们需要检查下一个空间（`rear` 之后）是否是 `front` 指示的特殊预留槽位（见\
  \ `Figure 5.14`）。\n\n要入队一个元素，我们必须先增加 `rear`，使其包含数组中下一个空槽位的索引。然后我们可以将新元素插入到该空间中。\n\
  \n\n\n\n\n注意，`Dequeue` 与栈的 `Pop` 操作一样，并不会真正从数组中移除项的值。出队的值在物理上仍然存在于数组中。然而，它不再存在于队列中，并且由于\
  \ `front` 的改变而无法被访问。也就是说，出队的数据元素存在于实现中，但不存在于抽象。\n\n#### 测试计划\n\n为了确保你已经测试了所有必要的用例，请制定一个测试计划，列出各种队列操作以及每个操作所需的测试，就像我们对栈所做的那样。（例如，为了测试\
  \ `IsEmpty` 函数，你必须至少调用两次——一次在队列为空时，另一次在不为空时。）\n\n我们想要不断 `Enqueue` 元素直到队列满，然后调用 `IsEmpty`\
  \ 和 `IsFull` 函数，查看它们是否正确判断了队列的状态。然后我们可以 `Dequeue` 队列中的所有元素，并在此过程中打印它们，以确认它们被正确移除。此时，我们可以再次调用队列状态函数，查看是否正确检测到了空状态。我们还想测试基于数组的算法中“棘手”的部分：不断\
  \ `Enqueue` 直到队列满，`Dequeue` 一个元素，然后再次 `Enqueue`，强制操作循环回到数组的开头。\n\n在 Web 上，测试驱动位于\
  \ `QueDr.cpp`，输入文件为 `QueType.in`，输出文件为 `QueType.out` 和 `QueType.screen`。\n\n###\
  \ 比较数组实现\n\n循环数组解决方案远没有我们的第一个队列设计那么简单或直观。通过给设计增加一些复杂度，我们获得了什么？通过使用更高效的 `Dequeue`\
  \ 算法，我们获得了更好的性能。为了找出好多少，让我们分析第一个设计。因为移动所有剩余元素的工作量与元素数量成正比，这个版本的 `Dequeue` 是一个 O(N)\
  \ 操作。第二个基于数组的队列设计只需要让 `Dequeue` 修改头部指示的值并将值放入 `item` 返回。无论队列中有多少元素，工作量都不会超过某个固定常数，因此该算法具有\
  \ O(1) 复杂度。\n\n其他操作都具有 O(1) 复杂度。无论队列中有多少项，它们（本质上）都执行常数的工作量。\n\n#### 计数队列\n\n我们的\
  \ Queue ADT 没有一个确定队列中项数的操作。让我们定义一个名为 `CountedQueType` 的新类，它派自类 `QueType`，并有一个数据成员\
  \ `length` 来记录队列中的项数。\n\n```cpp\ntypedef char ItemType;\n\nclass CountedQueType\
  \ : public QueType\n{\npublic:\n  CountedQueType(int max);\n  void Enqueue(ItemType\
  \ newItem);\n  void Dequeue(ItemType& item);\n  int GetLength() const;\n  // 返回队列中的项数。\n\
  private:\n  int length;\n};\n```\n\n虽然我们在上一个章节的案例研究使用了继承，但我们在这里更详细地复习它。这一行\n\n```cpp\n\
  class CountedQueType : public QueType\n```\n\n表示 `CountedQueType` 派生自 `QueType`；也就是说，`CountedQueType`\
  \ 是派生类而 `QueType` 是基类。关键字 `public` 声明 `QueType` 是 `CountedQueType` 的公共基类。因此，`QueType`\
  \ 的所有公共成员也是 `CountedQueType` 的公共成员。换句话说，`QueType` 的成员函数 `Enqueue`、`Dequeue`、`IsEmpty`\
  \ 和 `IsFull` 也可以用于类型为 `CountedQueType` 的对象。类 `CountedQueType` 的公共部分通过重新定义继承的函数 `Enqueue`\
  \ 和 `Dequeue`，添加数据成员 `length`、一个返回 `length` 值的操作以及它自己的类构造函数，进一步对基类进行了特化。\n\n每个类型为\
  \ `CountedQueType` 的对象都有一个类型为 `QueType` 的对象作为子对象。也就是说，类型为 `CountedQueType` 的对象是一个\
  \ `QueType` 对象并且更多。图 5.15 显示了 `CountedQueType` 类的接口图。公共接口显示为大圆侧侧的椭圆，由客户端代码可用的操作组成。内部所示的私有数据项对客户端是不可见的。椭圆之间的虚线表示两个操作是相同的。例如，应用于\
  \ `CountedQueType` 对象的 `IsEmpty` 是在类型 `QueType` 中定义的 `IsEmpty` 成员函数。然而，应用于 `CountedQueType`\
  \ 对象的 `Enqueue` 不是在 `QueType` 中定义的 `Enqueue`，而是定义在 `CountedQueType` 中的那个。\n\nC++\
  \ 使用基类（base class）和派生类（derived class）术语；文献中也使用了超类（superclass）和子类（subclass）。然而，使用“超类”和“子类”可能会引起混惑，因为前缀\
  \ sub 通常意味着比原始的要（例如，数学集合的子集）。实际上，子类通常比它的超类“大”——它包含了更多的数据和/或函数。\n\n![](img/f05-15.jpg)\n\
  \n图 5.15 `CountedQueType` 类的接口图\n\n### 派生类的实现\n\n`CountedQueType` 类的实现只需要处理与 `QueType`\
  \ 不同的功能。具体来说，我们必须编写 `Enqueue` 和 `Dequeue` 函数来增加或减少 `length` 数据成员，并调用同名的 `QueType`\
  \ 函数。由于 `Enqueue` 和 `Dequeue` 可以抛出异常，这些调用必须封装在 try/catch 语句中。这里是代码。随后将进行讨论。\n\n\
  ```cpp\n#include \"CountedQueType.h\"\n\nvoid CountedQueType::Enqueue(ItemType newItem)\n\
  {\n  try\n  {\n    QueType::Enqueue(newItem);\n    length++;\n  }\n  catch(FullQueue)\n\
  \  {\n    throw FullQueue();\n  }\n}\n\nvoid CountedQueType::Dequeue(ItemType& item)\n\
  {\n  try\n  {\n    QueType::Dequeue(item);\n    length--;\n  }\n  catch(EmptyQueue)\n\
  \  {\n    throw EmptyQueue();\n  }\n}\n\nint CountedQueType::GetLength() const\n\
  {\n  return length;\n}\n\nCountedQueType::CountedQueType(int max) : QueType(max)\n\
  {\n  length = 0;\n}\n```\n\n注意这里的两点语法。为了让 `Enqueue` 调用 `QueType` 中定义的 `Enqueue`，类名必须在函数名之前，作用域运算符（`::`）出现在两个名称之间。`Dequeue`\
  \ 也是如此。在类构造中，`length` 被设置为零，但 `front` 和 `rear` 是如何设置的呢？派生类构造函数参数列表后面的结构（冒号跟随对基类构造函数的调用）被称为构造函数初始化。\n\
  \n像 `QueType` 这样的类可以原封不动地在许多不同的上下文中，也可以通过继承来适应特定的上下文。继承允许我们创建可扩展的数据抽象——派生类通常通过包含额外的私有数据或公共操作或两者来扩展基类。\n\
  \n`CountedQueType` 实例的项是字符，因为我们扩展了之前过的 `QueType`。\n\n##### `CountedQueType` 类的应用\n\
  \n\n\n\nFIFO 队列通常被用作“等待队列”。这种等待队列在多用户计算机系统和网络化工作站系统中非常常见。如果你使用多用户或网络化计算机系统，你可能与其他用户共用一台打印机。当你请求打印一个文件时，你的请求会被添加到打印队列中。当你的请求到达打印队列的前端时，你的文件就会被打印。打印队列确保了同一时间只有一个人可以访问打印机，并且这种访问是按照先来后服务的原则进行的。同样，队列也用于调度其他资源（如磁盘）的使用。\n\
  \n队列作为数据结构突出显示的另一个应用领域是对现实情况进行计算机模拟。例如，考虑一家计划安装更多柜台的银行。银行应该雇用足够的柜员来在“合理”的时间内服务每个客户，但不至于柜员太多。模拟可以使用柜员、车辆和时钟等对象来运行典型的客户交易。排队模拟通常涉及服务人员（银行柜员）、队列中的项目（等待服务的客户或车辆）以及每个项目所需的时间。通过改变这些参数并跟踪队列长度，管理层可以确定需要多少服务员才能让客户满意。因此在使用队列的模拟中，队列中的项目数量是一个重要信息。当然，客户端程序可以通过出队并重新入队来计算此信息，但使用计数队列是更好的选择。\n\
  \n## 继承与访问性\n\n继承是一个逻辑问题，而不是实现问题。一个类继承另一个类的行为并以某种方式对其增强。继承并不意味着继承另一个类的私有变量。某些语言允许访问私有成员，但这违背了封装和信息隐藏的目的。`C++`\
  \ 不允许访问基类的私有成员。外部客户端代码或派生类代码都无法直接访问基类的私有成员。\n\n## 使用链表结构实现队列\n\n### Enqueue 函数\n\
  \n在基于数组的队列实现中，我们决定跟踪指向队列数据边界的索引。在链表表示中，我们可以使用两个指针 `front` 和 `rear`来标记队列的前端和后端。（现在你可能已经意识到，链表结构中的动态分配节点存在于存储器的“某处”，而不是像数组槽那样连续，但为了清晰起见，我们将节点线性排列。）\n\
  \n我们可以使用类似于栈的 `Pop` 算法从队列中 `Dequeue` 元素，其中 `front` 指向队列中的第一个节点。由于我们通过在最后一个节点之后插入新元素来向队列添加元素，因此我们需要一个新的的\
  \ `Enqueue` 算法（见图 5.17）。\n\n这些任务中的第一个在栈的 `Push` 操作中很常见。我们使用 `C++` 的 `new` 操作符获取空间，并将新项存储到节点的\
  \ `info` 成员中。新节点插入在队列末尾，因此还需要将节点的 `next` 成员设置为 `NULL`。\n\n![](img/f05-16.jpg)\n\
  图 5.16 队列表示\n\n![](img/f05-17.jpg)\n图 5.17 Enqueue 操作\n\n`Enqueue` 算法的第二部分涉及更新 `Node(rear)`\
  \ 的 `next` 成员以指向新节点。这个任务很简单：如果在入队时队列为空怎样？在这种情况下，不存在 `Node(rear)`；我们必须将 `front` 指向新节点。我们修改算法以考虑这种情况：\n\
  \n`Enqueue` 算法的最后一个任务是更新 `rear` 指针，只需涉及赋值 `rear = newNode`。如果该节点是队列中的第一个，这种方法有效吗？是的——我们希望无论队列中有多少项，`Enqueue`\
  \ 调用后 `rear` 始终指向尾节点。\n\n注意 `front` 和 `rear` 的相对位置。如果它们反过了（如图 5.18 所示），我们可以使用栈的\
  \ `Push` 算法来实现 `Enqueue` 操作。\n\n![](img/f05-18.jpg)\n图 5.18 糟糕的队列设计\n\n但我们如何 `Dequeue`\
  \ 呢？为了删除链队列的最后一个节点，我们需要重置 `front` 指向被删除节点的前一个节点。由于我们的指针都是向前的，无法返回上一个节点。为了完成这项任务，我们要遍历整个列表（一个\
  \ O(N)解决方案——非常无效，特别是当队列很长），或者保留一个具有双向指针的列表。如果我们从一开始就正确设置队列指针，这种双向链结构并不是必要的。\n\n\
  ### Dequeue 函数\n\n在编写 `Enqueue` 算法时，我们注意到向空队列插入是一个特殊情况，因为我们需要让 `front` 指向新节点。同样，在我们的\
  \ `Dequeue` 算法中，我们需要考虑删除队列中最后一个节点并导致队列为空的情况。如果删除前端节点后 `front` 为 `NULL`，我们就知道队列是空的。在这种情况下，我们还需要将\
  \ `rear` 设置为 `NULL`。图 5.19 阐了从链队列中移除前端元素的算法。该算法假设已经执行了空队列测试，因此我们知道队列至少包含一个节点。（我们可以做出此假设，因为如果不满足则会抛出异常。）与\
  \ `Pop` 一样，我们需要保留一个局部指针指向被移除的节点，以便在 `delete` 操作中访问它。\n\n我们如何知道队列是空的？此时 `front` 和\
  \ `rear` 都应该是 `NULL` 指针。这一事实使得类构造函数和 `IsEmpty` 变得非常简单。`IsFull` 函数呢？可以使用我们为栈 ADT\
  \ 写的 `IsFull`。\n\n![](img/f05-19.jpg)\n图 5.19 Dequeue 操作\n\n\n\n\n\n```cpp\n// 队列\
  \ ADT 的头文件\n\nclass FullQueue\n\n{};\n\nclass EmptyQueue\n\n{};\n\ntypedef char\
  \ ItemType\n\nstruct NodeType;\nclass QueType\n{\n\npublic:\n  QueType();\n  ~QueType();\n\
  \  void MakeEmpty();\n  void Enqueue(ItemType);\n  void Dequeue(ItemType&);\n  bool\
  \ IsEmpty() const;\n  bool IsFull() const;\n\nprivate:\n  NodeType* front;\n  NodeType*\
  \ rear;\n};\n\n#include <cstddef>                 // 用于 NULL.\n#include <new>  \
  \                   // 用于 bad_alloc.\nstruct NodeType\n{\n  ItemType info;\n  NodeType*\
  \ next;\n};\n\nQueType::QueType()          // 类构造函数。\n// 后置条件：front 和 rear 被设置为\
  \ NULL。\n{\n  front = NULL;\n  rear = NULL;\n}\n\nvoid QueType::MakeEmpty()\n//\
  \ 后置：队列为空；所有元素均已释放。\n{\n  NodeType* tempPtr;\n  while (front != NULL)\n  {\n   \
  \ tempPtr = front;\n    front = front->next;\n    delete tempPtr;\n  }\n  rear =\
  \ NULL;\n}\n\n// 类析构函数。\nQueType::~QueType()\n{\n  MakeEmpty();\n}\n\nbool QueType::IsFull()\
  \ const\n// 如果自由存储区没有空间容纳另一个 NodeType 对象，则返回 true，否则否则返回 false。\n{\n  NodeType*\
  \ location;\n  try\n  {\n    location = new NodeType;\n    delete location;\n  \
  \  return false;\n  }\n  catch(std::bad_alloc exception)\n  {\n    return true;\n\
  \  }\n}\n\nbool QueType::IsEmpty() const\n// 如果队列中没有元素，返回 true，否则返回 false。\n{\n\
  \  return (front == NULL);\n}\n\nvoid QueType::Enqueue(ItemType newItem)\n// 将 newItem\
  \ 添加到队列尾部。\n// 前置：队列已初始化。\n// 后置：如果（队列未满），newItem 位于队列尾部；\n//       否则抛出 FullQueue\
  \ 异常。\n{\n  if (IsFull())\n    throw FullQueue();\n  else\n  {\n    NodeType* newNode;\n\
  \    newNode = new NodeType;\n    newNode->info = newItem;\n    newNode->next =\
  \ NULL;\n    if (rear == NULL)\n      front = newNode;\n    else\n      rear->next\
  \ = newNode;\n    rear = newNode;\n  }\n}\n\nvoid QueType::Dequeue(ItemType& item)\n\
  // 从队列移除头部元素并将其返回到 item 中。\n// 前置：队列已初始化\n// 后置：如果（队列不为空），队列头部被移除并将其副本返回到 item 中；\n\
  //       否则，抛出 EmptyQueue 异常。\n{\n  if (IsEmpty())\n    throw EmptyQueue();\n  else\n\
  \  {\n    NodeType* tempPtr;\n    tempPtr = front;\n    item = front->info;\n  \
  \  front = front->next;\n    if (front == NULL)\n      rear = NULL;\n    delete\
  \ tempPtr;\n  }\n}\n```\n\n### 循环链表队列的设计\n\n我们的 `QueType` 类包含两个指针，分别指向队列的两个端点。这种设计基于链表队列的线性结构。如果只有一个指向队列头部的指针，我们可以顺着指针到达尾部，但这种策略会将访问尾部（为了\
  \ `Enqueue` 元素）变成一个 O(N) 操作。如果只有一个指向队列尾部的指针，我们无法访问头部，因为指针只从头部指向尾部。\n\n如果我们将队列设计为循环链表，就可以通过单个指针访问队列的两个端。这意味着尾节点的\
  \ `next` 成员将指向队列的头部节点（参见图 5.20）。现在 `QueType` 只有一个数据成员，而不是两个。关于这种队列实现的一个有趣点是，它与队列作为双端线性结构的逻辑图不同。这种队列是一个没有端点的循环结构。使其成为队列的特性它支持\
  \ FIFO（先进先出）访问。\n\n要 `Enqueue` 一个元素，我们直接通过指针 `rear` 访问“尾部”节点。要 `Dequeue` 一个元素，我们访问队列的“头部”节点。我们没有指向该节点的指针，但我们有一个指向它前一个节点的指针——`rear`。指向队列“头部”节点的指针位于\
  \ `Next(rear)` 中。空队列由 `rear = NULL` 表示。使用循环链表实现设计并编码队列操作被留作一项编程作业。\n\n![](img/f05-20.jpg)\n\
  \n图 5.20 循环链表队列\n\n我们可以使用为数组版本编写的相同测试计划，对队列 ADT 的两种链表实现进行测试。\n\n### 比较队列实现\n\n我们现在已经看了队列\
  \ ADT 的几种不同实现。它们之间如何比较？就像我们比较栈的实现一样，我们考虑两个不同的因素：存储该结构所需的内存量以及解决方案所需的“工作”量（用大 O 表示法表示）。让我们比较已经完整编码的两种实现：基于数组的实现和动态链表实现。\n\
  \n最大队列大小的数组变量无论实际使用了多少个数组槽，所占内存都是相同的；我们需要为可能的最大元素数量留空间。然而，链表实现仅为队列中的元素使用内存。\n\n\
  如果元素类型很小，例如字符或整数，指针成员可能会比数据成员大。考虑一个可能包含 100 个整数（每个 2 字节）的队列。数组队列的存储需求为（2 字节/元素 *\
  \ 101 个槽）+（2 字节 * 2 个索引）= 206 字节，无论队列中何时有多少个元素。链表实现每个节点需要 2 字节（`info` 成员）+ 4 字节（`next`\
  \ 成员）= 6 字节，再加上两个外部指针的 8 字节。该队列的存储需求如图图 5.21 所示。当队列元素数量超过 33 时，链表队列需要更多内存，因为需要存储比\
  \ `ItemType` 大一倍的指针。\n\n我们还可以从大 O 表示法的角度比较实现的相对“效率”。类构造函数、`IsFull` 和 `IsEmpty` 操作显然是\
  \ O(1)；无论队列中有多少元素，它们的工作量始终是相同的。那么 `Enqueue` 和 `Dequeue` 呢？队列中元素的数量会影响这些操作的工作量吗？不，不会；在在这两种实现中，我们都可以直接访问队列的头部和尾部。这些操作的工作量与队列的大小无关，因此这些操作具有\
  \ O(1) 复杂度。\n\n| | 动态数组实现 | 链表实现 |\n| --- | --- | --- |\n| 类构造函数 | 0(1) | 0(1) |\n\
  | `MakeEmpty` | 0(1) | 0(N) |\n\n\n\n\n\n| `IsFull` | 0(1) | 0(1) |\n| `IsEmpty`\
  \ | 0(1) | 0(1) |\n| `Enqueue` | 0(1) | 0(1) |\n| `Dequeue` | 0(1) | 0(1) |\n| Destructor\
  \ | 0(1) | 0(N) |\n\n表 5.2 队列操作的 Big-O 比较\n\n只有 `MakeEmpty` 操作在不同实现之间存在差异。基于数组的实现仅设置了\
  \ `front` 和 `rear` 索引，因此显然是一个 O(1) 操作。链表实现必须处理队列中的每一个节点以释放节点空间。因此，该操作具有 O(N) 复杂度，其中\
  \ `N` 是队列中的节点数。动态存储中基于数组实现的类析构函数只有一条语句，因此它具有 O(1) 复杂度。动态分配链式结构中的类析构函数包含一个循环，其执行次数与队列中的项目数量相同。因此，动态链版本具有\
  \ O(N) 复杂度。与栈的基于数组和链表的实现一样，这两个队列实现在工作量上大致等同，仅区别于六个操作中的一个以及类析构函数。表 5.2 总结了队列操作的 Big-O\
  \ 比较。\n\n#### 总结\n\n我们在逻辑层面将栈定义为一种抽象数据类型（ADT），并讨论了它在应用中的用法，还展示了封装在类中的实现。尽管我们对栈的逻辑描述是一个数据元素的线性集合，最新的元素（栈顶）位于一端，最旧的元素位于另一端，栈类的物理表示并不需要重建我们的心理模型。栈类的实现必须支持\
  \ LIFO（后进先出）属性；然而，如何支持这一属性是另一回事。例如，`Push` 操作可以为栈元素“时间戳”，并以任何顺序将它们放入数组中。要弹出，我们需要搜索数组寻找最新的时间戳。这种表示与我们在本章开发的栈实现非常不同，但对于栈类的用户来说，它们在功能上是等价的。实现对于栈栈程序是透明的，因为栈被周围的类操作所封装。\n\
  \n我们还检查了队列的定义和操作。我们讨论了当使用数组包含队列元素时会遇到的一些设计考量。尽管数组本身是随机访问结构，但我们将队列视为结构的逻辑视图限制了我们只能访问存储在数组头部和尾部位置元素。对于链表实现，我们使用了两个指针，一个指向头部，一个指向尾部。\n\
  \n对于同一个数据结构，通常会有多个功能上正确的设计。当存在多个正确解决方案时，问题的需求和规范可能会决定哪种方案是最佳设计。\n\n在数据结构和算法的设计中，你会发现通常存在权衡。更复杂的算法可能导致更高效的执行；执行时间较长的解决方案可能会节省内存空间。一如既往，我们必须根据对问题需求的了解来做出设计决策。\n\
