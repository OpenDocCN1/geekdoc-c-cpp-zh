  \ `Boolean`。\n7. 正确或错误？隐式表示使用了二叉搜索树。\n8. 正确或错误？`SortedList` 的 Big-O 复杂度与 `UnsortedList`\
  \ 相同。\n9. 为什么我们定义 `Map` ADT 不允许重复键？\n10. 当项已存在时，`Map` 返回什么？\n11. 对于 `Map` ADT，`ItemType`\
  \ 包含一个键和一个值。\n12. `ItemType` 对象的值字段应该包含什么？\n13. 正确或错误？在 map 上执行 `Find` 操作时，如果找到了该项，则\
  \ `ItemType` 对象与传入函数的对象是相同的。\n14. 正确或错误？在 map 上执行 `Find` 操作时，如果项不存在，则 `ItemType`\
