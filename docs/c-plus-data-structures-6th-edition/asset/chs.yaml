  \n### 44. 定义并实现一个计数栈（counted stack），它继承自 `StackType`。\n\n### 45. 为本章实现的抽象数据类型（ADT）创建\
  \ UML 图。\n\n# 第 6 章：列表进阶\n\n本章结合了列表的两种替代实现以及伴随这些结构出现的新理论材料。本章开始描述 C++ 模板机制，该机制允许在运行时定义数据结构内部对象的类型。接下来，讨论了列表的三种新实现：循环链表、双向链表以及带有头部和尾部的列表。\n\
  \n我们随后引入了浅拷贝（shallow copying）和深拷贝（deep copying）的概念，并演示了如何通过使用类的构造函数和重载赋值运算符来强制 C++\
  \ 使用深拷贝。最后，我们展示了大多数其余 C++ 运算符都可以被重载。\n\n我们的最后一个列表实现使用了数组而不是指针。类似的实现在操作系统软件中被广泛。\n\
  \n最后，我们探索了 C++11 的范围 for 循环（range-based for loop），用于遍历内置数据结构，并利用运算符重载在我们自己的基于列表的数据结构中支持范围迭代。\n\
  \n### 6.1 关于泛型的更多：C++ 模板\n\n在第 3 章 中，我们定义了一种泛数据类型，该类型定义了操作，但未定义所处理项的类型。我们演示了如何通过在名为\
  \ `ItemType.h` 的单独文件中定义项的类型，并让容器规范文件包含该文件来使容器类型泛化。这种技术适用于任何允许包含或访问其他文件的语言。\n\n然而，某些语言具有特殊的语言构造允许你定义泛数据类型。C++\
  \ 就是其中之一。这种构造被称为模板。模板允许你编写一个类类型的描述，并在描述中留出“空白”，由客户端代码来填充。就像变量是函数的参数一样，类型是模板的参数。\n\
  \n\n\n\n```cpp\ntemplate<class ItemType>\n\nclass StackType\n{\n\npublic:\n  StackType();\n\
  \  bool IsEmpty() const;\n  bool IsFull() const;\n  void Push(ItemType item);\n\
  \  void Pop();\n  ItemType Top() const;\n\nprivate:\n  int top;\n  ItemType items<MAX_ITEMS>;\n\
  };\n```\n\n这段代码被称为类模板（class template）。`StackType` 的定义从 `template<class ItemType>`\
  \ 开始，其中 `ItemType` 被称为模板的形式参数。（你可以使用任何标识符作为形式参数参数；我们在示例中使用了 `ItemType`）。客户端程序使用如下代码来创建几个组件具有不同数据类型的栈：\n\
  \n```cpp\n// 客户端代码\n\nStackType<int> myStack;\n\nStackType<float> yourStack;\n\n\
  StackType<char> anotherStack;\n\nmyStack.Push(35);\n\nyourStack.Push(584.39);\n\n\
  anotherStack.Push('A');\n```\n\n在 `myStack`、`yourStack` 和 `anotherStack` 的定义中，尖括号内的数据类型名称是模板的实际参数（或参数）。在编译时，编译器会生成（实例化）三个不同的类类型，并为每个类型赋予它自己的内部名称。你可以想象这些定义在内部转换成了类似的内容：\n\
  \n```cpp\nStackType_int myStack;\n\nStackType_flo yourStack;\n\nStackType_char anotherStack;\n\
  ```\n\n在 C++ 术语中，这三个新的类类型被称为模板类（与创建它们的类模板相对而言）。\n\n当编译器实例化一个模板时，它会字面上地在整个类模板中用实际参数替换形式参数，就像你在文字处理程序或文本编辑器中执行查找并替换操作一样。例如，当编译器在客户端代码中遇到\
  \ `StackType<float>` 时，它通过将类模板中每个 `ItemType` 出现的地方替换为 `float` 来生成一个新类。结果与我们写了以下代码是一样的：\n\
  \n```cpp\nclass StackType_float\n{\n  void Push(float item);\n  void Pop();\n  float\
  \ Top() const;\n\nprivate:\n  int top;\n  float items<MAX_ITEMS>;\n};\n```\n\n关于模板有一个非常有用的视角：普通的类定义是用于创建单个变量或对象的模式，而类模板是用于创建单个数据类型的模式。\n\
  \n关于模板的参数，有两点需要注意。第一，类模板在它的形式参数列表中使用了 `class` 词：`template<class ItemType>`。然而，`class`\
  \ 的使用仅仅是语法要求；它并不意味着客户端的实际参数必须是类的名称。实际参数可以由任何数据类型的名称组成，无论是内置的还是用户定义的。在刚才展示的客户端代码中，我们使用了\
  \ `int`、`float` 和 `char` 作为实际参数。第二，请观察当客户端向 `StackType` 模板传递参数时（如 `StackType<int>`），该参数是一个数据类型名称，而不是变量名。这种用法起初看起来很很异，因为当我们向函数传递参数时，我们总是传递变量名或表达式，而不是数据类型名。此外，请注意，向模板传递参数的影响在编译时产生，而向函数传递参数的影响在运行时产生。\n\
  \n既然我们已经看到了如何编写类模板的定义，那么我们如何处理成员函数的定义呢？我们需要将它们写成函数模板，以便编译器可以将每个函数与适当的模板类关联起来。例如，我们将如下函数模板编写\
  \ `Push` 函数：\n\n```cpp\ntemplate<class ItemType>\nvoid StackType<ItemType>::Push(ItemType\
  \ newItem)\n{\n  if (IsFull())\n    throw FullStack();\n\n  top++;\n  items<top>\
  \ = newItem;\n}\n```\n\n与类模板一样，我们从 `template<class ItemType>` 开始函数定义。接下来，每个 `StackType`\
  \ 单词的出现处都必须加上 `<ItemType>`。如果客户端声明了一个类型 `StackType<float>`，编译器将生成类似下面的函数定义：\n\n\
  ```cpp\nvoid StackType<float>::Push(float newItem)\n{\n  if (IsFull())\n    throw\
  \ FullStack();\n\n  top++;\n  items<top> = newItem;\n}\n```\n\n最后，在使用模板时，我们改变了关于存放源代码的文件的规则。在此之前，我们将类定义放在头文件\
  \ `StackType.h` 中，将成员函数定义放在 `StackType.cpp` 中。结果是，我们可以独立于任何客户端代码将 `StackType.cpp`\
  \ 编译成目标代码。这种策略对于模板将不起作用。除非编译器知道模板的实际参数且该实际参数出现在客户端代码中，否则它无法实例化函数模板。不同的编译器使用不同的机制来解决这个问题。一种通用的解决方案是同时编译客户端代码和成员函数。一种流行的技术是将类定义和成员函数定义都放在同一个文件中：`StackType.h`。另一种技术是在头文件的末尾提供实现文件的包含\
  \ Directstring。无论采用哪种方式，当客户端代码指定 `#include` `\"StackType.h\"` 时，编译器就同时拥有了所有的源代码——包括成员函数和客户端代码。以下代码列出了类定义和函数实现的内容；请密切关注成员函数定义的语法：\n\
  \n```cpp\n// 使用模板的 StackType 类定义\nclass FullStack\n// 栈满时 Push 使用的异常类\n{};\n\nclass\
  \ EmptyStack\n// 栈空时 Pop 和 Top 使用的异常类\n{};\n\n#include \"MaxItems.h\"\n// MaxItems.h\
  \ 必须由类的用户提供\n// 该文件必须包含 MAX_ITEMS 的定义\n// 栈的最大数量。\n\ntemplate<class ItemType>\n\
  class StackType\n{\n  public:\n  StackType();\n  bool IsEmpty() const;\n  bool IsFull()\
  \ const;\n  void Push(ItemType item);\n  void Pop();\n  ItemType Top() const;\n\n\
  private:\n  int top;\n  ItemType items<MAX_ITEMS>;\n};\n\n// StackType 的函数定义\ntemplate<class\
  \ ItemType>\nStackType<ItemType>::StackType()\n{\n  top = -1;\n}\n\ntemplate<class\
  \ ItemType>\nbool StackType<ItemType>::IsEmpty()\n{\n  return (top == -1);\n}\n\n\
  template<class ItemType>\nbool StackType<ItemType>::IsFull()\n{\n  return (top ==\
  \ MAX_ITEMS-1);\n}\n\ntemplate<class ItemType>\nvoid StackType<ItemType>::Push(ItemType\
  \ newItem)\n{\n  if (IsFull())\n    throw FullStack();\n\n  top++;\n  items<top>\
  \ = newItem;\n}\n\ntemplate<class ItemType>\nvoid StackType<ItemType>::Pop()\n{\n\
  \  if (IsEmpty())\n    throw EmptyStack();\n\n  top--;\n}\n\ntemplate<class ItemType>\n\
  ItemType StackType<ItemType>::Top()\n{\n  if (IsEmpty())\n     throw EmptyStack();\n\
  \n  return items<top>;\n}\n```\n\n### 6.2 循环链表\n\n我们在第 3 到 5 章中实现的链表数据结构，其特征是元素之间存在线性（类线状）的关系：每个元素（除第一个外）都有一个唯一的前驱节点，每个元素（除最后一个外）都有一个唯一的后继节点。使用线性链表确实带来了一个问题：给定列表中任意位置节点的指针，我们可以访问其在其之后的所有节点，但无法访问其在之前的任何节点。对于单向线性链表结构（即所有指针都指向相同方向的列表），我们必须始终拥有指向列表开头的指针，才能访问列表中的所有节点。\n\
  \n\n\n\n\n此外，我们想要添加到排序列表中的数据可能已经是有序的。有时，人们在将原始数据交给数据录入员之前，会手动对数据进行排序。同样，其他程序产生的数据通常也以某种顺序排列。给定一个排序列表\
  \ ADT（Sorted List ADT）和有序的输入数据，我们总是将新项插入到列表末尾。讽刺的是，为了提前对数据进行排序而做的额外手动工作，实际上增加了按序插入数据的时间。\n\
  \n然而，我们可以对线性列表进行细微修改，使最后一个节点的 `next` 成员的指针指向第一个节点，而不是包含 `NULL`（图 6.1）。现在，我们的列表变成了一个环形链表而不是线性链表。我们可以从列表中的任何节点开始并遍历整个列表。如果我们让外部指针指向列表中的最后一个项而不是第一个项，那么我们就可以直接访问列表中的第一个和最后一个元素（图\
  \ 6.2）。`listData->info` 引用最后一个节点中的项，而 `listData->next->info` 引用第一个节点中的项。我们在第 5 章中讨论环形链队列时提到过这种列表结构。\n\
  \n我们不需要更改 `SortedType` 类中的任何声明就可以使列表变为环形而非线性。毕竟，节点中的成员是相同的；只有最后一个节点的 `next` 成员的值发生了变化。列表的环形结构如何改变列表的实现？因为一个空环形列表有一个\
  \ `NULL` 指针，所以 `IsEmpty` 操作完全没有变化。然而，使用环形列表需要遍历列表的算法发生明显的变化。我们不再在遍历指针变为 `NULL` 时停止。事实上，除非列表为空，否则指针永远不会变成\
  \ `NULL`。相反，我们必须将外部指针本身作为停止标志。让我们检查排序列表中的这些变化。\n\n`GetItem`、`PutItem` 和 `DeleteItem`\
  \ 操作都需要对列表进行搜索。与其对这些每一个操作进行带有细微差异的重写，不如写一个通用的 `FindItem` 例程，它以 `item` 为参数并返回 `location`、`predLoc`\
  \ 和 `found`。`PutItem` 和 `DeleteItem` 需要前驱节点的位置（`predLoc`）；`GetItem` 可以忽略它。\n\n在线性列表实现中，我们使用一对指针\
  \ `location` 和 `predLoc` 搜索列表（记得第 4 章 中的那个毛毛虫吗？）。我们为环形列表稍微修改了这种方法。在线性列表版本中，我们将 `location`\
  \ 指向列表中的第一个节点，并将 `predLoc` 设置为 `NULL`（[图 6.3a]）。对于环形列表搜索，我们初始化 `location` 指向第一个节点，并将\
  \ `predLoc` 指向其“前驱”——列表中的最后一个节点（[图 6.3b]）。\n\n搜索循环一直执行，直到 (1) 遇到一个大于或等于 `item` 键值的键，或者\
  \ (2) 我们到达了列表的末尾。在线性列表中，当 `location` 等于 `NULL` 时检测到列表末尾。由于列表的外部指针指向最后一个元素，当 `location`\
  \ 再次指向第一个元素时，我们知道已经处理了所有项但没有找到匹配项：`location = listData->next`。因为搜索空列表没有意义，让我们把列表不为空作为一个先决条件。\n\
  \n循环执行后，如果找到了匹配的键，`location` 指向带有该键的列表节点，`predLoc` 指向它在列表中的前驱（[图 6.4a]）。注意，如果 `item`\
  \ 的键是列表中的最小键，那么 `predLoc` 就会指向它的前驱——环形列表中的最后一个节点（[图 6.4b]）。如果 `item` 的键不在列表中，那么\
  \ `predLoc` 指向它的逻辑前驱，而 `location` 指向它的逻辑后继节点（[图 6.4c]）。注意，即使 `item` 的键大于列表中的任何元素，`predLoc`\
  \ 也是正确的（[图 6.4d]）。因此，对于插入一个键值比当前列表中任何键值都大的元素，`predLoc` 也会被正确设置。\n\n接接的 C++ 代码作为函数模板实现了我们的\
  \ `FindItem` 算法。注意函数头中的两点。第一，`NodeType` 在第 5 章中被定义为 `struct`；在这里，它必须是一个 `struct`\
  \ 模板。因此，每个使用 `NodeType` 的声明必须在角括号中包含一个实际参数（数据类型的名称）。例如，代码中 `listData` 被声明为类型 `NodeType<ItemType>*`\
  \ 而不是简单的 `NodeType*`。第二，观察 `location` 和 `predLoc` 声明的语法。你看到星号（`*`）和符号 `&` 挨在一起。虽然这种语法初看起来很奇怪，但它与我们指示引用传递的常用方式是一的：在参数的数据类型之后放置\
  \ `&`。在这里，我们在数据类型 `NodeType<ItemType>*` 之后放置 `&`，这是一个指向节点的指针：\n\n```\ntemplate<class\
  \ ItemType>\nvoid FindItem(NodeType<ItemType>* listData, ItemType item,\n      \
  \                 NodeType<ItemType>*& location,\n                       NodeType<ItemType>*&\
  \ predLoc, bool& found)\n// 假设：ItemType 是具有 ComparedTo 函数的类型。\n// 前：列表为空。\n// 后：如果存在键值匹配\
  \ item 的元素的元素，则 found = true；否则，found = false。\n// 如果找到，location 包含该元素的地址，predLoc\
  \ 包含该元素\n// 前驱的地址；否则，location 包含 item 逻辑后继的地址，\n// predLoc 包含其逻辑前驱的地址。\n{\n  bool\
  \ moreToSearch = true;\n  location = listData->next;\n  predLoc = listData;\n  found\
  \ = false;\n  while (moreToSearch && !found)\n  {\n    if (item.ComparedTo(location->info)\
  \ == LESS)\n      moreToSearch = false;\n    else if (item.ComparedTo(location->info)\
  \ == EQUAL)\n      found = true;\n    else\n    {\n      predLoc = location;\n \
  \     location = location->next;\n      moreToSearch = (location != listData->next);\n\
  \    }\n  }\n}\n```\n\n#### 在环形列表中插入项\n\n向环形链表插入元素的算法与线性列表插入相似：\n\n分配空间的任务与线性列表的操作相同。我们使用\
  \ `new` 运算符为节点分配空间，然后将 `item` 存储在 `newNode->info` 中。下一个任务同样简单；我们只需调用 `FindItem`：\n\
  \n```\nFindItem(listData, item, location, predLoc, found);\n```\n\n当然，我们没有找到元素是因为它并不在那里；我们感兴趣的是\
  \ `predLoc` 指针。新节点被链接到 Node(`predLoc`) 之后。为了将新元素插入列表，我们将 `predLoc->next` 存储在 `newNode->next`\
  \ 中，并将 `newNode` 存储在 `predLoc->next` 中。\n\n\n\n\n\n图 6.5 展示了一般情况。特殊情况有哪些呢？首先，我们有向空列表插入第一个元素的情况。在这种情况下，我们希望让\
  \ `listData` 指向新节点，并让新节点指向自己（图 6.5b）。在线性链表的插入算法中，当新元素的键值（key）比列表中的任何其他键值都小时，我们也有一个特殊情况。因为新节点变成了列表中的第一个节点，我们必须更改外部指针以指向新节点。然而，循环链表的外部指针并不指向列表的第一个节点——它指向最后一个节点。因此，对于循环链表来说，插入最小的列表元素并不是特殊情况（图\
  \ 6.5c）。然而，将最大的列表元素插入到列表末尾是一个特殊情况。除了将节点与它的前驱节点（之前是列表最后一个节点）和后继节点（列表第一个节点）连接外，我们还必须修改外部指针以指向\
  \ Node(`newNode`)——即循环链表中新的最后一个节点（图 6.5d）。\n\n![](img/f06-05.jpg)\n\n图 6.5 插入循环链表\n\
  \n将新节点链接到列表末尾的语句与一般情况的语句相同，外加上对外部指针 `listData` 的赋值。与其在搜索之前检查这种特殊情况，我们可以将其与一般情况一起处理：搜索插入位置并链接新节点。然后，如果我们检测到我们已经将新节点添加到了列表末尾，我们就重新分配\
  \ `listData` 使其指向新节点。为了检测这种情况，我们将 `item` 与 `listData->info` 进行比较。\n\n`PutItem` 的最终实现如所示：\n\
  \n```\ntemplate<class ItemType>\n\nvoid SortedType<ItemType>::PutItem(ItemType item)\n\
  {\n  NodeType<ItemType>* newNode; NodeType<ItemType>* predLoc;\n\n  NodeType<ItemType>*\
  \ location; bool found;\n\n  newNode = new NodeType<ItemType>;\n\n  newNode->info\
  \ = item;\n\n  if ((listData->info.ComparedTo(item)==LESS\n  {\n    FindItem(listData,\
  \ item, location, predLoc, found);\n\n    newNode->next = predLoc->next;\n\n   \
  \ predLoc->next = newNode;\n\n    // 如果这是列表中的最后一个节点，重新分配 listData。\n\n    if (listData->info.ComparedTo(item)==LESS\n\
  \      listData = newNode;\n  }\n  else  // 插入到空列表。\n  {\n    listData = newNode;\n\
  \n    newNode->next = newNode;\n  }\n\n  length++;\n}\n```\n\n#### 从循环链表中删除元素\n\n\
  要从循环链表中删除一个元素，我们使用为线性链表开发的相同通用算法：\n\n对于第一个任务，我们使用 `FindItem`。在 `FindItem` 返回后，`location`\
  \ 指向我们想要删除的节点，而 `predLoc` 指向它在列表中的前驱。要从列表中删除 Node(`location`)，我们只需重置 `predLoc->next`\
  \ 以跳过我们正在删除的节点。这在一般情况下是有效的，至少如此（参见 图 6.6a）。\n\n我们需要考虑哪种特殊情况？在线性链表版本中，我们必须检查删除第一个（或第一个且唯一的）元素。根据我们对插入操作的经验，我们可以推测删除循环链表的最小元素（第一个节点）并不是特殊情况；图\
  \ 6.6b 证明这个猜想是正确的。然而，删除循环链表中的唯一节点是一个特殊情况，正如我们在 图 6.6c 中所示。列表的外部指针必须设置为 `NULL`，以表示列表现在为空。我们可以通过检查在执行\
  \ `FindItem` 之后 `predLoc` 是否等于 `location` 来检测这种情况；如果是，则我们要删除的节点是列表中唯一的节点。\n\n我们可能还会推测从循环链表中删除最大的列表元素（最后一个节点）也是一个特殊情况。如\
  \ 图 6.6d 所示，当我们删除最后一个节点时，首先进行一般情况的处理，将 Node(`location`) 从列表中取消链接，然后我们重置 `listData`\
  \ 指向它的前驱节点 Node(`predLoc`)。我们可以通过检查在搜索后 `location` 是否等于 `listData` 来检测这种情况：\n\n\
  ```\ntemplate<class ItemType>\n\nvoid SortedType<ItemType>::DeleteItem(ItemType\
  \ item)\n{\n  NodeType<ItemType>* location;\n\n  NodeType<ItemType>* predLoc;\n\n\
  \  bool found;\n\n  FindItem(listData, item, location, predLoc, found);\n\n  if\
  \ (predLoc == location)  // 列表中只有一个节点吗？\n    listData = NULL;\n  else\n```\n\n![](img/f06-06.jpg)\n\
  \n图 6.6 从循环链表中删除\n\n```\n {\n    predLoc->next = location->next;\n\n    if (location\
  \ == listData)  // 删除最后一个节点？\n      listData = predLoc;\n  }\n\n  delete location;\n\
  \n  length--;\n}\n```\n\n在详细研究了许多操作后，改为循环链表后没有任何操作变得更短或更简单。那么，我们为什么想要使用循环而不是线性呢？\n\
  \n### 6.3 双向链表\n\n正如之前提到的，可以使用循环链表从任何起点到达任何节点。虽然这种结构相比线性链表具有优势，但对于某些应用类型仍然太有限。假设我们在仅给定该节点指针的情况下删除一个特定节点。线性链表难以执行的另一个任务是反向遍历列表。例如，假设我们有一个按平均绩点（GPA）从低到高排序的学生列表。院长可能想要一份从高到低排序的学生打印列表，用于制作名单。\n\
  \n在需要访问给定节点的前驱的情况下，双向链表很有用。在双向链表中，节点是双向链接的。双向链表的每个节点包含三个部分：\n\nInfo：存储在节点中的数据\n\n\
  Next：指向后续节点的指针\n\nBack：指向前驱节点的指针\n\n图 6.7 描述了一个线性双向链表。注意第一个节点的 `back` 成员以及最后一个节点的\
  \ `next` 成员包含 `NULL`。以下定义可能用于声明此类列表的节点：\n\n```\ntemplate<class ItemType>\n\nstruct\
  \ NodeType\n{\n  ItemType info;\n\n  NodeType<ItemType>* next;\n\n  NodeType<ItemType>*\
  \ back;\n};\n```\n\n#### 在双向链表中查找元素\n\n使用这个定义，让我们使用辅助函数 `FindItem` 编写成员函数 `PutItem`\
  \ 和 `DeleteItem`。\n\n在 `FindItem` 函数中，我们不再需要使用虫行搜索；相反，我们可以通过 `back` 成员获取任何节点的前驱。我们稍微修改了\
  \ `FindItem` 的接口。也就是说，因为我们不再需要 `predLoc`，我们返回一个指针 `location`。如果 `found` 为真，`location`\
  \ 指向与 `item` 键相同的节点；否则，`location` 指向 `item` 的逻辑后继节点。（记得 `FindItem` 是一个函数模板。）\n\n\
  \n\n\n\n```cpp\ntemplate<class ItemType>\n\nvoid FindItem(NodeType<ItemType>* listData,\
  \ ItemType item,\n\n     NodeType<ItemType>*& location, bool& found)\n\n// 假设：ItemType\
  \ 是一个具有 ComparedTo 函数的类型。\n// 前提：列表不为空。\n// 后置：如果某个元素 someItem 的 key 与 item 的 key\
  \ 匹配，\n//       则 found = true；否则 found = false。\n//       如果 found 为真，location\
  \ 包含 someItem 的地址；\n//       否则，location 包含 item 逻辑后续节点的地址。\n{\n  bool moreToSearch\
  \ = true;\n  location = listData;\n  found = false;\n  while (moreToSearch && !found)\n\
  \  {\n    if (item.ComparedTo(location->info) == LESS)\n      moreToSearch = false;\n\
  \    else if (item.ComparedTo(location->info) == EQUAL)\n      found = true;\n \
  \   else\n    {\n      location = location->next;\n      moreToSearch = (location\
  \ != NULL);\n    }\n  }\n}\n```\n\n## 双向链表的操作\n\n双向链表插入和删除操作的算法比单链表对应的操作要复杂一些。原因显而易见：双向链表中维护的指针更多。\n\
  \n例如，考虑 `PutItem` 操作。在单链表中，为了将新节点 `Node(newNode)` 链接到给定节点 `Node(location)` 之后，我们需要修改两个指针：`newNode->next`\
  \ 和 `location->next`（参见图 6.8a）。双向链表的相同的操作需要修改四个指针（参见图 6.8b）。\n\n我们为新节点分配空间并调用 `FindItem`\
  \ 来寻找插入点：\n\n```\nFindItem(listData, item, location, found);\n```\n\n从 `FindItem`\
  \ 返回后，`location` 指向应该位于新节点之后的节点。现在我们准备好将 `Node(newNode)` 链接到列表中。由于该操作的复杂性，你必须小心修改指针的顺序。例如，在\
  \ `Node(location)` 之前插入 `Node(newNode)` 时，如果我们先修改 `location->back` 中的指针，就会丢失指向 `Node(location)`\
  \ 前驱节点的指针。图 6.9 显示了指针修改的正确顺序。\n\n我们确实需要小心处理向空列表插入元素的情况，因为这是一个特殊情况。\n\n双双向链表的一个有用特性是，它消除了删除节点时对节点前驱节点指针的需求。通过\
  \ `back` 成员，我们可以修改前驱节点的 `next` 成员，使其跳过不需要的节点。然后我们让后继节点的 `back` 指针指向前驱节点：\n\n![](img/f06-08.jpg)\n\
  \n图 6.8 插入到单链表和双向链表\n\n![](img/f06-09.jpg)\n\n图 6.9 将新节点链接到列表中\n\n![](img/f06-10.jpg)\n\
  \n图 6.10 从双向链表中删除\n\n我们确实需要小心处理向空列表插入元素的情况，因为这是一个特殊情况。\n\n双向链表的一个有用特性是，它消除了删除节点时对节点前驱节点指针的需求。通过\
  \ `back` 成员，我们可以修改前驱节点的 `next` 成员，使其跳过不需要的节点。然后我们让后继节点的 `back` 指针指向前驱节点。\n\n## 带有头部和尾尾的链表\n\
  \n双向链表的一个有用特性是，它消除了删除节点时对节点前驱节点指针的需求。通过 `back` 成员，我们可以修改前驱节点的 `next` 成员，使其跳过不需要的节点。然后我们让后继节点的\
  \ `back` 指针指向前驱节点。\n\n## 结构复制\n\n在本节中，我们将研究复制栈的问题。我们将展示 `CopyStack` 操作的示例：\n\n```cpp\n\
  template<class ItemType>\nvoid CopyStack(StackType<ItemType> oldStack, StackType<ItemType>&\
  \ copy)\n{\n  StackType<ItemType> tempStack;\n  ItemType item;\n  while (!oldStack.IsEmpty())\n\
  \  {\n    item = oldStack.Top();\n    oldStack.Pop();\n    tempStack.Push(item);\n\
  \  }\n  while (!tempStack.IsEmpty())\n  {\n    item = tempStack.Top();\n    tempStack.Pop();\n\
  \    copy.Push(item);\n  }\n}\n```\n\n这种情况看起来很直观。我们意识到 `oldStack` 是空的，因为所有元素都弹出了，但由于\
  \ `oldStack` 是一个值参数，原始栈不会受到影响——对吧？错了！如果使用了 `StackType` 的基于数组的静态实现，该函数可以正常工作。数组物理上位于类对象内部。类对象被复制到值参数\
  \ `oldStack` 中，原始对象受到了保护不受改变。但如果我们使用动态链接实现会怎样？指向栈的外部指针被复制到 `oldStack` 中且没有改变，但它所指向的元素并没有受到保护。参见图\
  \ 6.12。\n\n![](img/f06-12.jpg)\n\n图 6.12 栈是值参数\n\n\n\n\n\n解决此问题有两种方案：我们可以将第一个参数改为引用参数并重新创建栈，或者像下一节描述的那样，提供一个拷贝构造函数。\n\
  \n#### 浅拷贝与深拷贝\n\n上一节描述的问题之所以发生，是因为当一个类对象按值传递时，会对该参数进行浅拷贝。在浅拷贝中，只有参数中的数据成员被复制。在\
  \ `CopyStack` 的情况下，作为参数传递的仅有 `指向栈的外部指针的拷贝`。当涉及到指针时，我们需要进行深拷贝——即参数中的数据成员以及这些数据成员所指向的所有内容都被被复制。`图\
  \ 6.13` 显示了这种差异。\n\n如果调用代码将实际参数 `callerStack` 传递给 `CopyStack` 函数，浅拷贝会导致数据成员 `callerStack.topPtr`\
  \ 被复制到 `oldStack.topPtr` 中。现在这两个指针都指向同一个链式结构（图 6.13a）。当 `CopyStack` 函数从栈中移除项时，它破坏了调用者的栈！我们想要的是栈的深拷贝，以便\
  \ `CopyStack` 能够在一个与调用者栈相同但独立的拷贝上进行工作（图 6.13b）。在这种情况下，调用者的栈在函数内部的任何操作中都能保持不变。\n\n\
  #### 类拷贝构造函数\n\nC++ 在以下情况中使用浅拷贝：按值传递参数、在声明中初始化变量（`StackType` `myStack` = `yourStack;`）、将对象作为函数的返回值返回（`return\
  \ thisStack;`）以及实现赋值操作（`stack1` = `stack2;`）。同样，由于类对象的活跃状态，C++ 支持另一种名为拷贝构造函数的特殊类操作，我们稍后会描述它。如果存在拷贝构造函数，当类对象按值传递、在声明中初始化类对象以及对象作为函数返回值时，就会隐式地使用拷贝构造函数。\n\
  \n![](img/f06-13.jpg)\n\n图 6.13 栈的浅拷贝与深拷贝\n\n赋值操作又是怎样的？如果你想使用深拷贝将一个对象赋值给另一个，你必须编写一个成员函数来执行深拷贝并显式地调用它，而不是使用赋值运算符，或者重载赋值运算符。我们将在本节讨论第一种替代方案，在下一节讨论第二种方案。\n\
  \n拷贝构造函数有特殊的语法。像类构造函数和析构函数一样，它没有返回值，只有类名：\n\n```cpp\ntemplate <class ItemType>\n\
  \nclass StackType\n{\n\npublic:\n  .\n  .\n  // 拷贝构造函数。\n  StackType(const StackType<ItemType>&\
  \ anotherStack);\n  .\n  .\n};\n```\n\n标识拷贝构造函数的模式是类类型的单个引用参数。关键字 `const` 保护参数不被修改，尽管它是按引用传递的。由于拷贝构造函数是类的成员函数，因此其实现部分可以直接访问类数据。要拷贝一个链式结构，我们必须一个节点一个节点地遍历该结构，并在处理过程中复制节点的内容。因此，我们需要两个运行指针：一个指向被复制结构中的后续节点，另一个指向新结构的最后一个节点。记住，在链式结构的深拷贝中，`info`\
  \ 成员是相同的，但 `next` 成员不是。在编写算法时，我们必须确保处理被复制的栈为空的情况：\n\n注意，我们的算法避免了使用指向新插入新节点的额外指针，而是直接将其地址存储在新节点将要所在的结构中。`ptr1`\
  \ 指向要拷贝的节点，`ptr2` 指向已拷贝的最后一个节点。见图 6.14。\n\n```cpp\ntemplate <class ItemType>\n\n\
  StackType<ItemType>::StackType(const StackType<ItemType>& anotherStack)\n{\n  NodeType<ItemType>*\
  \ ptr1;\n  NodeType<ItemType>* ptr2;\n  if (anotherStack.topPtr == NULL)\n    topPtr\
  \ = NULL;\n```\n\n![](img/f06-14.jpg)\n\n图 6.14 每次迭代开始时指针的相对位置\n\n```cpp\n else\n\
  \  {\n    topPtr = new NodeType<ItemType>;\n    topPtr->info = anotherStack.topPtr->info;\n\
  \    ptr1 = anotherStack.topPtr->next;\n    ptr2 = topPtr;\n    while (ptr1 != NULL)\n\
  \    {\n      ptr2->next = new NodeType<ItemType>;\n      ptr2 = ptr2->next;\n \
  \     ptr2->info = ptr1->info;\n      ptr1 = ptr1->next;\n    }\n    ptr2->next\
  \ = NULL;\n  }\n}\n```\n\n`StackType oneStack = anotherStack` 创建了 `anotherStack`\
  \ 的拷贝并将其存储在 `oneStack` 中。\n\n#### 拷贝函数\n\n我们看到了客户端程序如何编写 `CopyStack` 函数将一个栈拷贝到另一个栈，前提是定义了类拷贝构造函数以维护按值参数传递的原始栈的完整性。或者，我们是否可以包含成员函数将一个栈拷贝到另一个栈，并让客户端显式地调用它？可以，但首先我们必须决定是将\
  \ self（调用成员函数的对象）拷贝到另一个对象，还是将另一个对象拷贝到 self。即成员函数总是应用于类类型的对象。一个栈是函数应用的对象，另一个栈是参数。\n\
  \n`myStack` 是拷贝到 `yourStack` 还是反过来？当然，在看到函数声明之前我们无法回答这个问题。如果 `yourStack` 被拷贝到 `myStack`，那么\
  \ `Copy` 的代码与拷贝构造函数几乎相同。区别在于 `myStack` 指向一个动态结构，并且在拷贝开始之前通过 `MakeEmpty` 释放该结构的所有节点。另一方面，如果\
  \ `myStack` 被拷贝到 `yourStack`，我们需要重新思考算法。我们将这一变化留作练习题。\n\n实现拷贝函数的第三种方法。假设我们想写一个两个栈都是参数的函数：\n\
  \n```cpp\nCopy(myStack, yourStack);\n```与点表示法相比，这种语法对某些程序员来说更熟悉。但我们刚刚说成员函数应用于类类型的对象。我们如何做到这一点？C++\
  \ 提供了一种名为友元函数的语法设备，允许这种构造。友元函数不是类的成员，但它允许直接访问私有成员。友元函数的声明和实现如下：\n\n```cpp\ntemplate<class\
  \ ItemType>\nclass StackType\n{\npublic:\n  friend void Copy(StackType<ItemType>,\
  \ StackType<ItemType>&);\n};\n\ntemplate<class ItemType>\nvoid Copy(StackType<ItemType>\
  \ original, StackType<ItemType>& copy)\n{\n  if (original.topPtr == NULL)\n    copy.topPtr\
  \ = NULL;\n  else\n  {\n    NodeType<ItemType>* ptr1;\n    NodeType<ItemType>* ptr2;\n\
  \    copy.topPtr = new NodeType<ItemType>;\n    copy.topPtr->info = original.topPtr->info;\n\
  \    ptr1 = original.topPtr->next;\n    ptr2 = copy.topPtr;\n    while (ptr1 !=\
  \ NULL)\n    {\n      ptr2->next = new NodeType<ItemType>;\n      ptr2 = ptr2->next;\n\
  \      ptr2->info = ptr1->info;\n      ptr1 = ptr1->next;\n    }\n    ptr2->next\
  \ = NULL;\n  }\n}\n```\n\n注意，我们没有在函数名前加上类名。`Copy` 是一个友元函数，而不是成员函数。`Copy` 确实可以访问参数的私有数据成员，但对它们的访问必须通过参数名和点来限定。友元函数中没有隐式的\
  \ self。\n\n\n\n\n\n# 运算符重载\n\n在上一节中，我们指出赋值运算符（`=`）通常会导致浅拷贝。如果我们能写这样的代码，那就太好了：\n\n\
  ```\nmyStack = yourStack;\n```\n\n当然，如果栈被实现为动态链式结构，这段代码将导致两个指针指向同一个栈，而不是两个独立的的栈。我们可以通过重载赋值运算符的含义来解决浅拷贝问题：\n\
  \n```\ntemplate<class ItemType>\n\nclass StackType\n\n{\n\npublic:\n   ⋮\n\n  void\
  \ operator=(StackType<ItemType>);\n\n   ⋮\n\n};\n```\n\n函数的定义如下：\n\n```\ntemplate<class\
  \ ItemType>\n\nvoid StackType<ItemType>::operator= (StackType<ItemType> anotherStack)\n\
  \n{\n\n   ⋮\n}\n```\n\n函数体与我们之前讨论过（但留作练习题）的 `Copy` 成员函数完全相同。因此，如果我们已经写好了 `Copy`\
  \ 成员函数，那么为了重载赋值运算符，我们只需要做一个微小的改动：将函数名从 `Copy` 改为 `operator=`。\n\n通过 `StackType`\
  \ 类提供的 `operator=` 函数，客户端代码可以使用类似下面的语句：\n\n```\nmyStack = yourStack;\n```\n\n编译器会隐地将此语句翻译为函数调用：\n\
  \n```\nmyStack.operator= (yourStack);\n```\n\n因此，客户端代码中等号左侧的类对象是应用 `operator=` 函数的对象，而等号右侧的对象成为函数的参数。\n\
  \n我们可以为任意数量的类重载赋值运算符。当编译器看到赋值运算符时，它会查看操作数的类型并使用相应的代码。如果操作数是没有重载赋值运算符的类对象，则使用赋值的默认含义——即只拷贝数据成员，产生浅拷贝。\n\
  \n如果我们能重载赋值运算符，是否也能重载其他运算符呢？是的——所有的 C++ 运算符都可以重载，但 `:`、`.`、`sizeof` 和 `?:` 除外。在第一章中，我们引入了一个\
  \ `DateType` 类。让我们通过重载关系运算符 `<`、`>` 和 `==` 来扩展这个类。我们还用一个构造函数代替 `Initialize` 方法来更新它。重载运算符的函数已阴影显示。\n\
  \n![](img/f0384-01.jpg)\n\n重载符号的语法是单词 `operator` 后面紧跟要重载的符号。第一个操作数是应用该运算符的对象，第二个操作数是参数。这些函数是成员函数，在\
  \ C++ 中被称为运算符函数。它们的它们的实现如下：\n\n```\nbool DateType::operator<(DateType other) const\n\
  \n{\n  if (year < other.year)\n    return true;\n  else if (year > other.year)\n\
  \    return false;\n  else if (month < other.month)\n    return true;\n  else if\
  \ (month > other.month)\n    return false;\n  else if (day < other.day)\n    return\
  \ true;\n\n  else return false;\n}\n\nbool DateType::operator>(DateType other) const\n\
  \n{\n  if (year > other.year)\n    return true;\n  else if (year < other.year)\n\
  \    return false;\n  else if (month > other.month)\n    return true;\n  else if\
  \ (month < other.month)\n    return false;\n  else if (day > other.day)\n    return\
  \ true;\n\n  else return false;\n}\n\nbool DateType::operator==(DateType other)\
  \ const\n\n{\n  if (year == other.year && month == other.month && day == other.day)\n\
  \    return true;\n  else\n    return false;\n}\n```\n\n如果 `myBirthday` 和 `yourBirthday`\
  \ 已经初始化，并且客户端代码包含\n\n```\nif (myBirthday < yourBirthday)\n```\n\n或者\n\n```\nif (myBirthday\
  \ > yourBirthday)\n```\n\n或者\n\n```\nif (myBirthday == yourBirthday)\n```\n\n则会调用\
  \ `DateType` 类中相应的成员函数。\n\n对于我们的无序 ADT，要求 `ItemType` 必须是一个具有 `ComparedTo` 成员函数的类。现在我们已经知道如何重载关系运算符，我们可以在\
  \ `ItemType` 类中重载 `<` 和 `==`，然后使用关系运算符重写 `PutItem`、`GetItem` 和 `DeleteItem` 的代码。我们可以这样做，但应该这样做吗？我们不能将关系运算符作为\
  \ `switch` 语句的标签，因此代码必须是一系列的 `if-else` 子句。有些程序员认为 `switch` 语句更具自文档性，而另一些人则喜欢使用关系运算符。这是一个个人风格问题。\n\
  \n在离开与至少一个数据成员为指针类型的类的相关问题之前，最后一个注释是：如果这三者——类析构函数、拷贝构造函数或重载赋值运算符之一是必要的，那么很有可能这三个都是必要的。这有时被称为“三规则”（Rule\
  \ of the Big 3）。\n\n### 6.6 作为记录数组的链表\n\n我们在基于数组的实现中同时使用了静态分配数组和动态分配数组。我们使用动态内存分配来获取在本章之前的章节中构建链式结构所需的内存。\n\
  \n基于数组的表示与链表表示之间的选择与静态与动态存储分配之间的选择不同。它们是独立的问题。我们通常将数组存储在静态声明的变量中，如图 6.15a 所示，但基于数组的实现并不使用静态存储。整个数组可以存在动态分配的内存区域；也就是说，我们可以使用\
  \ `new` 运算符一次性获取整个结构的空间，如图 6.15b 所示。\n\n![](img/f06-15.jpg)\n\n图 6.15 静态和动态存储中的基于数组的列表\n\
  \n#### 为什么要使用数组？\n\n动态分配节点具有许多优势，那么我们为什么还要讨论使用记录数组呢？我们已经注意到，动态分配只是选择链式实现获得的一个优势；另一个优势与插入和删除算法的效率有关。我们讨论的用于链式结构操作的大多数算法都可以用于基于数组的实现或动态实现。主要的区别在于，在基于数组的实现中我们需要自己管理空闲空间。自己管理空闲空间给了我们更大的灵活性。\n\
  \n![](img/f06-16.jpg)\n\n图 6.16 静态和动态存储中的链表\n\n使用记录数组的另一个原因是，许多编程语言不支持动态分配或指针类型。在这些语言之一中编程时，你仍然可以使用链式结构，但你必须将指针值表示为数组索引。\n\
  \n\n\n\n当我们在程序运行之间需要保存数据结构中的信息时，使用指针变量会带来问题。假设我们想将列表中的所有节点写入文件，并在下次运行程序时使用该文件作为输入。如果链接是指针值——包含内存地址——那么它们在程序的下一次运行中是无意义的，因为程序在下次运行时可能会被放置在内存的另一个其他位置。我们必须将每个节点的用户数据部分保存到文件中，然后在下次运行程序时重建链式结构。然而，数组索引在程序的下一次运行中仍然有效的。我们可以存储整个数组，包括\
  \ `next` 数据成员（索引），然后在下次运行程序时将其读回。\n\n最重要的是，有时动态分配是不可能或不可行的，或者一个接一个地对每个节点进行动态分配在时间上成本太高——特别是在像操作系统代码这样的系统软件中。\n\
  \n#### 如何使用数组？\n\n让我们回到关于如何在数组中实现链表的讨论。正如之前提到的，每个节点的 `next` 成员告诉我们后继节点的数组索引。列表的开头通过一个“指针”访问，该“指针”包含列表中第一个元素的数组索引。图\
  \ 6.17 显示了包含 David、Miriam、Joshua、Robert 和 Leah 元素的排序列表可能如何存储在一个名为 `nodes` 的记录数组中。你看到列表中元素的顺序是如何通过\
  \ `next` 索引链被显式指示的了吗？\n\n列表最后一个元素的 `next` 成员中存了什么？它的“空”值必须是一个对于真实列表元素的无效地址。由于 `nodes`\
  \ 数组的索引从 0 开始，值 -1 不是数组中的有效索引——也就是说，不存在 `nodes<-1>`。因此，-1 是用作“空”地址的理想值。让我们使用常量标识符\
  \ `NUL` 而不是 `NULL`，以保持清晰的区分。我们可以像下面所示在程序中使用字面量值 -1：\n\n```\nwhile (location != -1)\n\
  ```\n\n[/content] \n\n但声明一个命名常量是更好的编程风格。事实上，我们可以将 `NUL` 定义为 -1：\n\n```\nconst int\
  \ NUL = -1;\n```\n\n当使用记录数组实现来表示链表时，程序员必须编写例程来管理用于新列表元素的空闲空间。这些空闲空间在哪里？再次查看 图 6.17。所有不包含列表中值的数组元素都成了空闲空间。我们不再使用动态分配内存的内置分配器\
  \ `new`，而是必须编写自己的函数从空闲空间中分配节点。我们称此函数为 `GetNode`。\n\n![](img/f06-17.jpg)\n\n图 6.17\
  \ 存储在记录数组中的排序列表\n\n当元素从列表中删除时，我们需要释放节点空间。然而，我们不能使用 `delete`，因为它只对动态分配的空间有效。因此，我们编写自己的函数\
  \ `FreeNode`，将节点返回到空闲空间池。\n\n这些未使用的数组元素集合可以连接成第二个列表，即一个空闲节点链表。图 6.18 显示了数组 `nodes`，其中取值列表和空闲空间列表都通过它们的\
  \ `next` 成员连接起来。在这里，`list` 是指向从索引 0 开始的列表（包含值 David）的外部指针。通过跟进 `next` 成员中的链接，我们看到列表继续是索引为\
  \ 4 (Joshua)、7 (Leah)、2 (Miriam) 和 6 (Robert) 的数组槽，按顺序排列。空闲列表从索引 1 的 `free` 开始。通过跟进\
  \ `next` 成员中的链接，我们看到空闲列表还包括索引为 5、3、8 和 9 的数组槽。`next` 列中两个 `NUL` 值，因为 `nodes` 数组包含两个链表。\n\
  \n使用记录数组实现链式结构有两种方法。第一种是模拟动态内存。一个数组存储许多不同的链表，就像空闲存储上的节点可以为不同的列表动态分配一样。在这种方法中，指向列表的外部指针不是存储结构的一部分，但指向空闲节点列表的外部指针是结构的一部分。图\
  \ 6.19 显示了一个包含两个不同列表的数组。由 `list1` 指示的列表包含 John、Nell、Susan 和 Susanne 的值，由 `list2`\
  \ 指示的列表包含 Mark、Naomi 和 Robert 的值。图 6.19 中剩余的三个数组槽在空闲列表中连接在一起。\n\n![](img/f06-18.jpg)\n\
  \n图 6.18 带有取值链表和空闲空间的数组\n\n第二种方法是每个列表一个记录数组。在这种方法中，外部指针是存储结构本身的一部分（参见 图 6.20）。列表构造函数接受一个参数，指定列表上的最大项目数。该参数用于动态分配适当大小的数组。注意，数组本身位于动态存储中，但链式结构使用数组索引作为“指针”。如果列表将在程序运行之间被保存，索引（链接）保持有效。\n\
  \n让我们实现这种方法方法。在实现我们的类时，我们需要记住数组内部有两个不同的过程：与记录相关的维护（如初始化数组、获取新节点和释放节点）以及对列表的操作。维护操作对用户是透明的。成员函数的原型保持不变，但私有数据成员发生了变化。我们需要包含数组。我们将数组命名为\
  \ `nodes` 并将其放在动态存储中。那么 `MemoryType` 就是一个包含两个项目的结构体：指向第一个空闲节点的整数“指针”和一个指向动态分配数组的真指针。\n\
  \n![](img/f06-19.jpg)\n\n图 6.19 带有三个列表（包括空闲列表）的数组\n\n为了简化后续讨论和代码，我们假设列表的项目是整数而不是使用模板类：\n\
  \n```\nstruct MemoryType;\n\nclass ListType\n\n{\n\npublic:\n\n// 成员函数原型在这里。\n\n\
  private:\n\n  int listData;\n```\n\n![](img/f06-20.jpg)\n\n图 6.20 列表和链式结构在一起\n\n\
  ```\n int currentPos;\n\n  int length;\n\n  int maxItems;\n\n  MemoryType storage;\n\
  \n};\n```\n\n执行维护的是辅助（帮助）函数，而不是类成员函数。成员函数是用户调用的函数；辅助函数是帮助实现成员函数的函数。让我们先看看这些维护函数。节点最初都是空闲的，因此它们必须连接在一起并存\
  \ `free`。`GetNode` 必须返回下一个空闲节点的索引并更新 `free`。`FreeNode` 必须接受接收到的节点索引作为参数并将其插入空闲节点列表中。由于列表的第一个项可以直接访问的，我们让\
  \ `GetNode` 返回第一个空闲项并让 `FreeNode` 将返回的节点插入到空闲列表的开头。（是的，我们保持空闲列表为栈——不是因为我们需要 LIFO\
  \ 属性，而是因为这样代码对于我们的需求最简单。）\n\n以下代码定义了 `MemoryType` 并实现了这些辅助函数：\n\n\n\n\n\n```cpp\n\
  // 辅助函数的原型。\n\nvoid GetNode(int& nodeIndex, MemoryType& storage);\n\n// 返回 nodeIndex\
  \ 中空闲节点的索引。\n\nvoid FreeNode(int nodeIndex, MemoryType& storage);\n\n// 将 nodeIndex\
  \ 返回到存储器。\n\nvoid InitializeMemory(int maxItems, MemoryType&);\n\n// 将所有内存初始化为空闲列表。\n\
  \n// 定义列表结束符号。\n\nconst int NUL = -1;\n\nstruct NodeType\n{\n  int info;\n  int\
  \ next;\n};\n\nstruct MemoryType\n{\n  int free; NodeType* nodes;\n};\n\nvoid InitializeMemory(int\
  \ maxItems, MemoryType& storage)\n{\n  for (int index = 1; index < maxItems; index++)\n\
  \    storage.nodes<index-1>.next = index;\n\n  storage.nodes<maxItems-1> = NUL;\n\
  \  storage.free = 0;\n}\n\nvoid GetNode(int& nodeIndex, MemoryType& storage)\n{\n\
  \  nodeIndex = storage.free;\n  storage.free = storage.nodes<free>.next;\n}\n\n\
  void FreeNode(int nodeIndex, MemoryType& storage)\n{\n  storage.nodes<nodeIndex>.next\
  \ = storage.free;\n  storage.free = nodeIndex;\n}\n```\n\n类 `ListType` 的构造函数必须为记录数组分配存储空间并调用\
  \ `InitializeMemory`。对于默认构造函数，我们任意选择大小为 500 的数组：\n\n```cpp\nListType::ListType(int\
  \ max)\n{\n  length = 0;\n  maxItems = max;\n  storage.nodes = new NodeType<max>;\n\
  \  InitializeMemory(maxItems, storage);\n  listData = NUL;\n}\n\nListType::ListType()\n\
  {\n  length = 0;\n  maxItems = 500;\n  storage.nodes = new NodeType<500>;\n  InitializeMemory(500,\
  \ storage);\n  listData = NUL;\n}\n\nListType::~ListType()\n{\n  delete <> storage.nodes;\n\
  }\n```\n\n让我们来看我们的设计符号、动态指针的等价实现以及记录数组的等价实现。我们还需要检查动态指针操作和记录数组版本的账记等等价实现。一旦理解了所有这些关系，编写\
  \ `ListType` 的成员函数就会非常简单。事实上，它是如此简单，以至于我们将代码留作了一个编程作业。\n\n| 设计符号/算法 | 动态指针 | 记录数组“指针”\
  \ |\n| --- | --- | --- |\n| Node(location) | `*location` | `storage.nodes<location>`\
  \ |\n| Info(location) | `location->info` | `storage.nodes<location>.info` |\n| Next(location)\
  \ | `location->next` | `storage.nodes<location>.next` |\n| 将 location 设置为 Next(location)\
  \ | `location` = `location->next` | `location = storage.nodes<location>.next` |\n\
  | 为 Info(location) 赋值 | `location->info` = `value` | `storage.nodes<location>.info`\
  \ = `value` |\n| 分配节点 | `nodePtr` = `new` `NodeType` | `GetNode(nodePtr)` |\n| 释放节点\
  \ | `delete` `nodePtr` | `FreeNode(nodePtr)` |\n\n### 6.7 使用虚函数的多态性\n\n除了封装和继承，面向对象编程语言必须具备的第三种能力是多态。在第\
  \ 2 章中，我们将多态定义为确定特定对象应用哪个函数的能力。这种确定可以在编译时（静态绑定）或运行时（动态绑定）进行。一种语言要是真正的面向对象，它必须支持静态和动态绑定；也就是说它必须支持多态。C++\
  \ 使用虚函数来实现运行时绑定。\n\nC++ 传递参数的基本规则是实际参数与其对应的形式参数必须具有相同类型。通过继承，C++ 在一定程度上放了这一规则。实际参数的类型可以是形式参数派生类的对象。(1)\
  \ 为了强制编译器生成保证成员函数到类对象动态绑定的代码，在函数声明中使用 `virtual` 关键字。\n\n虚函数的工作如下：\n\n1. 如果函数没有标记为\
  \ `virtual`，则形式参数的类型决定调用哪个函数（静态绑定）。\n2. 如果函数被标记为 `virtual`，则实际参数的类型决定调用哪个函数（动态绑定）。\n\
  \n```cpp\n// 静态绑定示例\nclass Base {\npublic:\n    void func() { cout << \"Base\\n\"\
  ; }\n};\nclass Derived : public Base {\npublic:\n    void func() { cout << \"Derived\\\
  n\"; }\n};\nvoid call(Base& b) { b.func(); } // 调用 Base::func()\n```\n\n```cpp\n\
  // 动态绑定示例\nclass Base {\npublic:\n    virtual void func() { cout << \"Base\\n\"\
  ; }\n};\nclass Derived : public Base {\npublic:\n    void func() override { cout\
  \ << \"Derived\\n\"; }\n};\nvoid call(Base& b) { b.func(); } // 调用 Derived::func()\n\
  ```\n\n这个示例展示了动态绑定的一个重要益处。客户端不需要为 `ListType` 的每种实现准备不同版本的 `PrintResult` 函数。如果从 `ItemType`\
  \ 派生了新类（甚至派生自 `NewItemType`），这些类的对象也可以传递给 `PrintResult`，而无需修改 `PrintResult`。\n\n\
  如果你定义了一个指向基类的指针，并使用基类类型动态分配存储，则该指针指向一个基类对象。如果你使用派生类型动态分配存储，则该指针指向一个派生类对象。以以下这个包含基类\
  \ `One` 和派生类 `Two` 的短程序为例：\n\n\n\n\n\n```cpp\n#include <iostream>\n\nclass One\n\
  \n{\n\npublic:\n  virtual void Print() const;\n};\n\nclass Two : public One\n{\n\
  public:\n  void Print() const;\n};\n\nvoid PrintTest(One*);\n\nint main()\n{\n \
  \ using namespace std;\n  One* onePtr;\n  onePtr = new One;\n  cout << \"Result\
  \ of passing an object of class One: \";\n  PrintTest(onePtr);\n\n  onePtr = new\
  \ Two;\n  cout << \"Result of passing an object of class Two: \";\n  PrintTest(onePtr);\n\
  \n  return 0;\n}\n\nvoid PrintTest(One* ptr)\n{\n  ptr->Print();\n}\n\nvoid One::Print()\
  \ const\n{\n  std::cout << \"Print member function of class One\" << endl;\n}\n\n\
  void Two::Print() const\n{\n  std::cout << \"Print member function of class Two\
  \ \" << endl;\n}\n```\n\n`onePtr` 最初指向一个 `One` 类的对象，然后指向一个 `Two` 类的对象。当 `PrintTest`\
  \ 的参数指向 `One` 类的对象时，应用 `One` 类的成员函数。当参数指向 `Two` 类的对象时，应用 `Two` 类的成员函数。运行时对象的类型决定了执行哪个成员函数，这一事实通过以下输出得到了验证：\n\
  \n![](img/f0400-01.jpg)\n\n对于向任何形式参数为基类的函数传递派生类型的参数，我们必须给出一个警告。如果你通过引用传递参数，则不会出现问题。然而，如果你按值传递参数，则实际上只有基类类型的子对象被传递了。例如，如果基类有两个数据成员，而派生类有两个额外的数据成员，那么如果形式参数是基类而实际参数是派生类，则只有基类的两个数据成员会被传递给函数。这种切片问题（派生类声明的任何额外数据成员都会被“切掉”）在我们把派生类对象赋值给基类对象时也可能发生。\n\
  \n回看第 5 章 中的图 5.15，它展示了 `QueType` 和 `CountedQueType` 对象之间的关系。如果一个 `CountedQueType`\
  \ 对象作为值参数传递给形式参数为 `QueType` 类型的函数，则只会拷贝 `QueType` 的那些数据成员；`CountedQueType` 的成员 `length`\
  \ 则不会被拷贝。尽管这种切片在这种情况下没有引起问题，但在设计你的类层次结构时，请注意这种情况。\n\n### 6.8 特殊化列表 ADT\n\n我们已经定义了无序列表和排序列表\
  \ ADT，并为每种列表提供了几种实现。我们的列表可以用于许多应用。然而，某些应用总是需要特殊用途的列表。也许它们需要我们的 List ADT 未定义的特定列表操作，又也许我们列表的特定特性（唯一元素）与应用程序的要求不契合。在这些情况下，我们可能能够扩展其中一个列表类来创建一个满足应用程序需求的新列表。或者，我们也可以为针对的问题创建一个创建一个自定义的新列表类。\n\
  \n在本章稍后将的案例研究中，我们需要一组具有独特属性和操作的列表。列表必须持有 `int` 类型的元素；允许存在重复元素。列表不需要支持 `IsFull`、`GetItem`\
  \ 或 `DeleteItem`。事实上，我们一直在使用的、这种新列表构造所需的列表操作只有 `GetLength` 操作以及使我们能够遍历列表项的操作。\n\n\
  以规则顺序步进数据结构中项的操作通常被称为迭代器。正如我们将在本章稍后的部分第 6.9 节 中看到的，C++ 提供了一种构造，使我们能够定义迭代器操作，以便我们在\
  \ `for` 循环中使用它们。对于案例研究，我们需要从左到右和从右到左处理元素，因此我们需要支持两个迭代器。此外，我们计划在列表的头部和尾插入项。这些需求的原因在案例研究中解释得很清楚；目前，我们只需接受陈述的需求并考虑如何实现这个新列表。\n\
  \n让我们在 CRC 卡片中总结这些规范：\n\n![](img/f0401-01.jpg)\n\n鉴于这一系列独特的需求，我们决定从零开始构建我们的新的 List\
  \ ADT。当然，我们可以复用关于列表的知识，甚至可能复用（剪切粘贴）之前列表实现中的部分代码。由于新列表构造为特定应用创建了特殊化列表，我们将该列表类命名为\
  \ `SpecializedList`。为了满足能够双向遍历列表的要求，`SpecializedList` 类列表没有我们标准的“当前位置”属性，而是具有“当前向前位置”和“当前向后位置”属性，并提供用于任一方向遍历列表的迭代器操作。注意，这句话并不意味着迭代可以改变方向——而是可以同时进行两个独立的列表遍历，一个向前一个向后，使用两个不同的迭代器操作。\n\
  \n双链结构的一个优势是它支持以两个方向遍历结构的能力。当结构只以一个方向链接时，在另一个方向遍历它并不简单。因为双向链表是在两个方向上链接的，所以正向或反向遍历列表同样容易。另一方面，外部指针指向最后一个元素的环形结构可以直接访问头部和尾元素。双链形结构将是理想的（见图\
  \ 6.21）：\n\n```cpp\nstruct NodeType;\n\nclass SpecializedList\n{\npublic:\n  SpecializedList();\
  \                 // 类构造函数\n  ~SpecializedList();                // 类析构函数\n  SpecializedList(const\
  \ SpecializedList& someList); // 拷贝构造函数\n  void ResetForward();\n\n  // 初始化当前位置，\n\
  \  // 从第一个项到最后一个项遍历列表。\n  void GetNextItem(int& item, bool& finished);\n\n  // 获取结构中的下一个项。\n\
  \  // true 表示所有项都已访问。\n  void ResetBackward();\n\n  // 初始化当前位置，\n  // 从最后一个项到第一个项遍历列表。\n\
  \  void GetPriorItem(int& item, bool& finished);\n\n  // 获取结构中的上一个项。\n  // true\
  \ 表示所有项都已访问。\n  void PutFront(int item);\n\n  // 将项作为第一个项插入结构。\n  void PutEnd(int\
  \ item);\n\n  // 将项作为最后一个项插入结构。\n  int GetLength();\n\n  // 返回结构中项的数量。\n\nprivate:\n\
  \  NodeType* list;\n  NodeType* currentNextPos;\n  NodeType* currentBackPos;\n \
  \ int length;\n};\n\n      ⋮\n\nstruct NodeType\n{\n  NodeType* next; NodeType*\
  \ back;\n  int info;\n};\n```\n\n图 6.21 双向链表\n\n构造函数必须将列表指针设置为 `NULL` 并将长度设置为 `0`：\n\
  \n```cpp\nSpecializedList::SpecializedList()\n{\n  length = 0;\n  list = NULL;\n\
  }\n```\n\n\n\n\n\n尽管我们提供了长度操作，但我们为用户提供了另一种确定何时访问到最后一个项的方法。`GetNextItem` 和 `GetPriorItem`\
  \ 都有两个参数：一个返回的项和一个布尔标志。当返回了最后一个项时，该标志被设置为 `true`。`ResetForward` 将 `currentNextPos`\
  \ 设置为 `NULL`，`GetNextItem` 返回结构中的下一个项，当 `currentNextPos` 等于 `list` 时，将 `finished`\
  \ 设置为 `true`。`ResetBackward` 将 `currentBackPos` 设置为 `NULL`，`GetPriorItem` 返回结构中的上一个项，当\
  \ `current-BackPos` 等于 `list->next` 时，将 `finished` 设置为 `true`：\n\n```cpp\nvoid SpecializedList::ResetForward()\n\
  // Post: currentNextPos 已为正向遍历\n//       初始化。\n{\n  currentNextPos = NULL;\n}\n\n\
  void SpecializedList::GetNextItem(int& item,\n     bool& finished)\n// Pre:  在第一次调用此函数之前已调用了\
  \ ResetForward。\n// Post: item 是列表中下一个项的拷贝。\n//       如果 item 是列表最后一个项，则 finished\
  \ 为 true；\n//       否则为 false。\n{\n  if (currentNextPos == NULL)\n    currentNextPos\
  \ = list->next;\n  else\n    currentNextPos = currentNextPos->next;\n  item = currentNextPos->info;\n\
  \  finished = (currentNextPos == list);\n}\n\nvoid SpecializedList::ResetBackward()\n\
  // Post: currentBackPos 已为反向遍历\n//       初始化。\n{\n  currentBackPos = NULL;\n}\n\n\
  void SpecializedList::GetPriorItem(int& item, bool& finished)\n// Post: item 是列表中上一个项的拷贝。\n\
  //       如果 item 是列表第一个项，则 finished 为 true；\n//       否则为 false。\n{\n  if (currentBackPos\
  \ == NULL)\n    currentBackPos = list;\n  else\n    currentBackPos = currentBackPos->back;\n\
  \  item = currentBackPos->info;\n  finished = (currentBackPos == list->next);\n\
  }\n\nint SpecializedList::GetLength()\n{ return length; }\n```\n\n`PutFront` 将新项作为列表的第一项插入（参见图\
  \ 6.22a）。`PutEnd` 将新项作为列表最后一项插入（参见图 6.22b）。图中的结果看起来非常不同，但仔细检查发现，除了外部指针 `list` 之外它们是相同的。在开头插入项不会改变\
  \ `list`；在末尾插入项则会。我们可以对两者使用相同的插入程序，但让 `PutEnd` 移动 `list:`：\n\n![](img/f06-22.jpg)\n\
  \n图 6.22 在头部和尾部插入\n\n```cpp\nvoid SpecializedList::PutFront(int item)\n// Post:\
  \ item 已插入到列表头部。\n{\n  NodeType* newNode;\n  newNode = new NodeType;\n  newNode->info\
  \ = item;\n  if (list == NULL)\n  { // 列表为空。\n    newNode->back = newNode;\n   \
  \ newNode->next = newNode;\n    list = newNode;\n  }\n  else\n  {\n    newNode->back\
  \ = list;\n    newNode->next = list->next;\n    list->next->back = newNode;\n  \
  \  list->next = newNode;\n  }\n  length++;\n}\n\nvoid SpecializedList::PutEnd(int\
  \ item)\n// Post: item 已插入到列表尾部。\n{\n  PutFront(item);\n  list = list->next;\n}\n\
  ```\n\n我们将类析构函数、拷贝构造函数、重载赋值运算符，以及函数 `LengthIs` 和 `MakeEmpty` 的实现留作编程作业。\n\n####\
