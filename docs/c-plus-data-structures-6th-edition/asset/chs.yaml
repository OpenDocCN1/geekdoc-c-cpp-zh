  © Repina Valeriya/Shutterstock\n\n到目前为止，我们深入研究了几个基本数据类型，讨论了它们的用途和操作，并研究了每种类型的一种或多种实现。当我们使用\
  \ C++ 内置类型构建这些自定义数据结构时，我们注意了适应不同应用程序需求的变体。在第 8 章中，我们看到了二叉搜索树这种树结构如何便于存储在链接结构中的数据。在本章中，我们考虑另一种非常有用的二叉树形式——堆，它可以用于实现一种重要的\
  \ ADT——优先级队列，也是另一种快速排序算法（合理地称为堆排序）的基础。直到为止，我们的树实现一直使用父与子节点之间的显式链接。但如果树具有某些属性，它也可以用数组轻松实现，这被证明是存储堆的一种自然且高效的方法。\n\
  \n### 9.1 ADT 优先级队列\n\n\n\n\n优先队列（priority queue）是一种具有有趣访问协议的抽象数据类型（ADT）：只有最高优先元素可以被访问。“最高优先级”的含义取决于具体的应用场景。例如，考虑一家只有一名秘书的小公司。当其他员工把工作留在秘书办公桌上时，哪些工作会被先处理？工作将按照员工在公司中的重要性顺序进行处理；秘书在开始处理总经理的工作之前会先完成总裁的工作，在处理助理程序员的任务之前会完成营销总监的工作。每项工作的优先级与发起该任务的员工级别有关。\n\
  \n在电话接听系统中，电话是按照接收顺序接听的；也就是说，优先级最高的电话是等待时间最长的那个。因此，FIFO（先入先出）队列可以看作是一个优先队列，其最高优先级元素就是队列时间最长的那个。\n\
  \n## 逻辑层次 (Logical Level)\n\n正如你所预期的，优先队列 ADT 的操作与 FIFO 队列完全相同。唯一的区别在于 `Dequeue`\
  \ 操作的后条件。因此，我们不需要使用 CRC 卡，可以直接进入规格说明。\n\n## 应用层次 (Application Level)\n\n在第 5 章中讨论\
  \ FIFO 队列的应用时，我们提到操作系统使用队列来维护就绪执行或正在等待特定事件发生的进程列表。此类请求可能会根据事件的优先级进行处理。例如，在断电情况下保存关键数据是一个极高优先级的事件。典型的计算机在其电源中存储的能量仅够在断电后运行一小会儿。相比之下，响应用户按下键盘上的音量调节按钮是一个低优先级的事件。为了恰当处理处理这些请求，操作系统可以使用优先队列。\n\
  \n医院急诊室按照优先队列顺序看病人；伤势最严重的患者先看医生。毕业年级的学生在尝试注册已满的课程时会排在等待列表（优先队列）的最顶端。参见图 9.1。\n\n\
  优先队列在排序也非常有用。给定一组需要排序的元素，我们可以将元素入队优先队列，然后按照排序后的顺序（例如从大到小）出队。我们将在本书稍后部分讨论如何将优先队列用于排序。\n\
  \n![](img/f09-01.jpg)\n\n图 9.1 生活中的优先队列\n\n## 实现层次 (Implementation Level)\n\n实现优先队列有许多方法。在任何实现中，我们都希望快速、方便地访问最高优先级的元素。让我们简要考虑一些可能的方法：\n\
  \n### 无序列表 (Unsorted List)\n\n使用无序列表入队项非常简单——只需将其插入到列表末尾即可。出队则需要遍历整个列表以找到优先级最高的元素。\n\
  \n### 基于数组的有序列表 (Array-Based Sorted List)\n\n使用基于数组的有序列表出队非常简单——只需返回优先级最高的元素，该元素位于\
  \ `length` `-` `1` 位置（前提是数组按优先级的递增顺序保持有序）。因此，出队是一个 `O(1)` 操作。然而，入队的代价会更高。我们必须找到入队的位置——如果使用二分查找，则是\
  \ `O(log[2]N)`——并在插入新元素后重新排列列表元素——`O(N)`。\n\n### 链式有序列表 (Linked Sorted List)\n\n\
  对于链式有序列表，假设链表保持从大到小的排序。出队只需要移除并返回第一个列表元素，该操作仅需几步。但入队又是 `O(N)`，因为我们必须一个元素一个地搜索列表以找到插入位置。\n\
  \n### 二叉搜索树 (Binary Search Tree)\n\n对于二叉搜索树方法，`Enqueue` 操作将实现为标准的二叉搜索树 `Insert`\
  \ 操作。我们知道它平均需要 `O(log[2]N)` 步。假设我们可以访问树的底层数据结构，可以通过返回最右侧的树元素来实现 `Dequeue` 操作。我们沿着右子树向下，并维护一个追踪指针，直到到达右子树为空的节点。追踪引用允许我们将节点从树中“取消链接”。然后返回该节点。这平均也是\
  \ `O(log[2]N)` 操作。\n\n二叉搜索树作为优先队列的实现结构看起来是一个赢家。然而，请注意，我们说操作平均是 `O(log[2]N)`。实际时间取决于树的深度，我们假设深度约为\
  \ `log[2]N`。但优先队列入队和出队操作的可能会将二叉搜索树变成一个非常窄且层数很多的结构，导致操作退化为 `O(N)`。\n\n二叉搜索树维持其内容的完美排序，以便快速查找任意元素。但在优先队列中，我们只关心找到最高优先级的元素。通过放宽父子节点之间的关系属性，并施加形状属性，我们可以创建一种名为“堆”（heap）的结构，它仍然能够在\
  \ `O(log[2]N)` 时间内完成入队和平队，同时保持层数不超过 `log[2]N`。\n\n作为辅助收益，形状属性还允许我们高效地将树存储在数组中，而不需要显链接。让我们先看看数组表示的工作原理，这也让我们说明必要的形状属性。\n\
  \n## 9.2 二叉树的非链式表示 (A Nonlinked Representation of Binary Trees)\n\n我们目前对二叉树实现的讨论局限于父到子指针是显式的方案。即在每个节点中都声明了指向左孩子和右子节点的指针。\n\
  \n二叉树可以以这种方式存储在数组中，树中的关系不是通过链接物理表示，而是隐含在操作树的算法中。这种代码的可读性较低，但我们节省了内存空间。\n\n让我们一个二叉树并以这种方式存储在数组中，且不会丢失父子关系。我们按层、从左到右将树元素存储在数组中。如果树的节点数量为\
  \ `numElements`，我们可以将数组和 `numElements` 封装在一个结构体中，如图 9.2\n\n图 9.2 二叉树及其数组表示\n\n规律了吗？对于任何节点\
  \ `tree.nodes[index]`，其左孩子位于 `tree.nodes[index` `*` `2` `+` `1]`，右孩子位于 `tree.nodes[index`\
  \ `*` `2` `+` `2]`（前提这些孩子节点存在）。注意数组中从 `tree.nodes[tree.numElements/2]` 到 `tree.nodes[tree.numElements`\
  \ `-` `1]` 的节点都是叶子节点，因此通过将节点索引与该范围进行简单比较，就能判断它是否为叶子节点。\n\n\n\n我们不仅可以轻松地计算子节点的位置，还能确定其父节点的位置。在只有从父节点到子节点链接的二叉树中，寻找节点的父节点是挑战性的，但在我们的隐式链接实现中，这轻而易举：使用整数除法，`tree.nodes[index]`\
  \ 的父节点位于 `tree.nodes[(index - 1)/2]`。\n\n由于整数除法会截弃任何余数，因此`(index - 1)/2` 对于左孩子或右孩子都是正确的父索引。因此，这种二叉树实现是双向链接的——从父节点到子节点以及从子节点到父节点。\n\
  \n我们的隐式表示对于任何满或完全的二叉树都有效。满二叉树是指所有叶子节点都位于同一层，且每个非叶节点都有两个子节点的二叉树。满二叉树的基本形状是三角形的：\n\
  \n![](img/f0578-01.jpg)\n\n完全二叉树是指一个满的、或者直到倒数第二层是满的二叉树，其最后一层的叶子节点尽可能靠左分布。完全二叉树的形状可以是三角形（如果树是满的），或者如下所示所示：\n\
  \n![](img/f0579-01.jpg)\n\n图 9.3 展示了与这些属性相关的二叉树示例。\n\n对于满或完全的树，基于数组的表示实现非常简单，因为元素占据了连续的数组槽位。然而，如果树不是满的或完全的，我们必须考虑由缺失节点造成的空隙。为了使用数组表示，我们必须在数组的这些位置上存储一个虚拟值，以保持正确的父子关系。虚拟值的选择取决于树中存储了什么信息。例如，如果树中的元素是非负整数，我们可以在虚拟节点中存储一个负值。\n\
  \n图 9.4 说明了一棵不完全的树及其对应的数组。数组的一些槽位不包含实际的树元素，而是持有虚拟值。操作树的算法必须反映这种情况。例如，要确定 `tree.nodes[index]`\
  \ 中的节点是否有左孩子，你必须检查 `index * 2 + 1 < tree.numElements`，然后检查 `tree.nodes[index * 2\
  \ + 1]` 中的值是否为虚拟值。\n\n![](img/f09-03.jpg)\n\n图 9.3 二叉树示例：(a) 满且完全；(b) 既不满也不完全；(c)\
  \ 完全；(d) 满且完全；(e) 既不满也不完全；(f) 完全\n\n![](img/f09-04.jpg)\n\n图 9.4 带有虚拟值的数组二叉搜索树\n\
  \n我们已经看到如何使用数组来表示二叉树。我们也可以反转这个过程，从数组中的元素创建一个二叉树。事实上，我们可以将任何一维数组看作是树节点的表示，尽管存储在其中的数据值可能在意义上与这种结构不匹配。我们可以使用这种二叉树表示来实现堆（heap），这是我们接下来要考虑的新型\
  \ ADT。\n\n### 9.3 堆 (Heaps)\n\n#### 逻辑层\n\n像二叉搜索树一样，堆也是一种二叉树。此外，它满足两个属性，一个关于形状，另一个关于元素的顺序。形状属性是简单的：堆必须是一棵完全二叉树。顺序属性说，对于堆中的每个节点，该节点中存储的值大于或等于其每个子节点中的值。（作为数据结构的堆不与同名的另一个无关概念混淆。堆也是自由存储（free\
  \ store）的同义词——用于动态分配数据的可用内存区域。）\n\n![](img/f09-05.jpg)\n\n图 9.5 包含字母 A 到 J 的两个堆\n\
  \n图 9.5 显示了两个包含字母“A”到“J”的堆。注意两棵树中值的放置不同，但形状保持相同：一个拥有十个元素的完全二叉树。同样注意，两个堆具有相同的根节点。一组值可以以许多方式存储在二叉树中，并仍然满足堆的顺序属性。由于形状属性，我们知道所有具有给定数量元素的堆的形状都是相同的。由于顺序属性，我们知道根节点始终包含堆中的最大值。这一事实为我们可能如何使用这种数据结构提供了提示。堆的特殊特征是，我们总是知道最大值的位置：它在根节点中。\n\
  \n当我们在此节提到“堆”时，指的是之前定义的结构。它也可以被称为“大顶堆”，因为根节点包含了结构中的最大值。我们也可以创建一个“最小顶堆”，其每个元素包含的值都小于或等于其每个子节点的值。\n\
  \n假设我们想从堆中删除值最大的元素。最大元素位于根节点，因此我们可以轻松地将其删除，如图 9.6a 所示。当然，它的删除会在根位置留下一个空洞。因为堆的树必须是完全的，我们决定用最右侧的元素填充空洞；现在结构满足形状属性（图\
  \ 9.6b）。然而，替换值来自树的底部，那里值较小；树不再满足顺序属性。\n\n![](img/f09-06.jpg)\n\n图 9.6 ReheapDown\
  \ 操作\n\n这种情况暗示了堆的基本操作：给定一个除了根位置外满足顺序属性的完全二叉树，修复该结构使其再次成为堆。这种操作被称为 `ReheapDown`，涉及到将元素从根位置向下移动，直到它处于满足属性的位置（参见图\
  \ 9.6c）。`ReheapDown` 具有如下规范：\n\n我们通过告诉它如何找到根和最右侧元素来尝试使此操作相当通用。将根作为一个参数而不是仅仅假设我们从整个堆的根开始，使得该程序泛化，允许我们对任何子树执行堆操作。\n\
  \n现在假设我们要向堆中添加一个元素。我们把它放在哪里？形状属性告诉我们树必须是完全的，因此我们将新元素放在树的下一个最右侧位置，如图 9.7a 所示。现在形状属性满足，但顺序属性可能被违反。这种情况说明了另一个堆操作的需求：给定一个包含\
  \ N 个元素的完全二叉树，其前 N—1 个元素满足堆的顺序属性，修复该结构使其再次成为堆。为了修复这种结构，我们需要让第 N 个元素在树中向上浮，直到它处于正确的位置（参见图\
  \ 9.7b）。这种操作被称为 `ReheapUp`。这是它的规范：\n\n![](img/f09-07.jpg)\n\n图 9.7 ReheapUp 操作：(a)\
  \ 添加 K；(b) ReheapUp\n\n#### 应用层\n\n堆是特殊的结构。像数组一样，它们只作为高层类的实现结构使用。堆的主要应用是作为优先级队列的实现结构。\n\
  \n#### 实现层\n\n\n\n\n虽然我们已经在图中将堆描绘为带有节点和链接的二叉树，但如果使用普通的链树表示法来实现堆操作将是非常不实际的。堆的属性（shape\
  \ property）告诉我们该二叉树是完全的，因此我们知道它绝不会有空隙。因此，正如之前讨论的那样，我们可以很容易地使用带有隐式链接的数组来存储树。图 9.8\
  \ 显示了堆中的值如何在这种表示法中存储。如果一个包含 `numElements` 个元素的堆以这种方式实现，形状属性规定堆元素存储在数组中连续的 `numElements`\
  \ 个槽位中，根元素放在第一个槽位（索引 0），最后一个叶子节点放在索引为 `numElements` - `1` 的槽位中。序属性（order property）规定，对于每一个非叶子节点\
  \ `heap.elements[index]`，\n\n![](img/f09-08.jpg)\n\n图 9.8 数组表示法中的堆值\n\n```\nheap.elements[index]\
  \ >= heap.elements[index * 2 + 1]\n```\n\n并且，如果存在右孩子，\n\n```\nheap.elements[index]\
  \ >= heap.elements[index * 2 + 2]\n```\n\n我们使用以下声明来支持这种堆的实现：\n\n```\ntemplate<class\
  \ ItemType>\n\n// 假设 ItemType 是内置简单类型或重载了\n// 关系运算符的类。\nstruct HeapType\n{\n  void\
  \ ReheapDown(int root, int bottom);\n  void ReheapUp(int root, int bottom);\n  ItemType*\
  \ elements; // 要动态分配的数组\n  int numElements;\n};\n```\n\n这个声明与我们目前使用的任何内容都有些不同。我们将\
  \ `HeapType` 定义为一个带有成员函数的结构体（struct）。为什么不把它写成类（class）呢？因为堆很少单独使用。它们是由其他结构操作的，而不是主动的。回想一下，在\
  \ C++ 中，结构体就像一个类，但它的成员自动默认是公开的。我们将恢复堆属性的函数定义为结构体的一部分，但也允许访问数据成员。我们的算法非常通用，根元素和底部元素的位置都作为参数传递。此外，我们还选择包含数据成员\
  \ `numElements` 来记录堆上的元素数量，尽管我们的示例算法并没有使用它。\n\n我们指定了工具操作 `ReheapDown` 和 `ReheapUp`\
  \ 来修复在某一端或另一端“损坏”的堆。现在让我们详细详细查看这些操作。\n\n当第一次调用 `ReheapDown` 时，会出现两种可能。如果根节点（`heap.elements[0]`）中的值大于或等于其子节点的值，则序属性保持完整，我们不需要做任何事情。否则，我们知道树的最大值位于根节点的左孩子（`heap.elements[1]`）或右孩子（`heap.elements[2]`）中。我们必须将这些值之一与根节点中的较小值交换。现在，以交换的节点为根的子树是一个堆——可能它的根节点除外。我们再次应用相同的过程，询问该节点的值是否大于或等于子节点的值。我们继续测试原始堆中越来越小的子树，移动我们的原始根节点向下，直到\
  \ (1) 当前子树的根是一个叶子节点，或 (2) 当前子树根的值大于或等于其两个子节点的值。\n\n![](img/f09-09.jpg)\n\n图 9.9\
  \ `ReheapDown` 操作\n\n该函数的算法在此给出，并在图 9.9 中的示例进行了说明。开始时，`root` 是（可能）违反堆序属性的节点索引：\n\
  \n此算法是递归的。在一般情况下，我们将根节点的值与其较大的孩子进行交换，然后重复该过程。在递归调用中，我们将 `maxChild` 指定为堆的根；这缩小了待处理树的大小，满足了“较小调用者问题”（Smaller-Caller\
  \ Question）。存在两个基本情况：(1) 如果 `heap.elements[root]` 是叶子，以及 (2) 如果堆序属性已经是完整的。在这两种情况下，我们什么都不做。\n\
  \n我们如何能判断 `heap.elements[root]` 是否为叶子节点呢？我们知道非叶子节点必须至少有一个左孩子，因此如果计算出的左孩子的位置大于 `bottom`，那么它就是叶子节点。回看图\
  \ 9.8。带有 F 的节点是第一个叶子节点。F 节点的索引是 5，所以如果存在，它的左孩子将在索引位置 11。因为 11 大于 9（bottom），F 的左孩子不在堆中，所以\
  \ F 是一个叶子节点。\n\n为了确定 `maxChild`，我们首先检查当前根节点是否只有一个孩子。如果是，它就是左孩子（因为树是完全的），我们将 `maxChild`\
  \ 设置为它的索引。否则，我们比较两个子节点的值，并将 `maxChild` 设置为具有较大值的节点的索引。\n\n下面的代码给整个函数。它使用了一个工具函数\
  \ `Swap`，该函数交换其两个参数的值。（因为这个函数显而易见，我们不显示它的实现。）\n\n```cpp\ntemplate<class ItemType>\n\
  void HeapType<ItemType>::ReheapDown(int root, int bottom)\n{\n  int maxChild;\n\
  \  int rightChild;\n  int leftChild;\n  leftChild = root*2+1;\n  rightChild = root*2+2;\n\
  \  if (leftChild <= bottom)\n  {\n    if (leftChild == bottom)\n      maxChild =\
  \ leftChild;\n    else\n    {\n      if (elements[leftChild] <= elements[rightChild])\n\
  \        maxChild = rightChild;\n      else\n        maxChild = leftChild;\n   \
  \ }\n    if (elements[root] < elements[maxChild])\n    {\n      Swap(elements[root],\
  \ elements[maxChild]);\n      ReheapDown(maxChild, bottom);\n    }\n  }\n}\n```\n\
  \n互补的操作 `ReheapUp` 接收一个违反堆属性的叶子节点并将其向上移动，直到找到正确的位置。我们将底部节点的值与其父节点比较。如果父节点的值较小，序属性被违反了，因此交换这两个节点。然后我们检查父节点，重复该过程，直到如图\
  \ 9.10\n\n图 9.10 `ReheapUp` 操作：(a) 添加 K，(b) 交换 K 和 G，(c) 交换 K 和 G，(d) 交换 K 和 J\n\
  \n此算法也是递归的。在一般情况下，我们将当前的“底部”节点与其父节点交换，然后重新调用函数。在递归调用中，我们将 `parent` 指定为底部节点；这缩小了待处理树的大小，因此“较小调用者问题”可以得到肯定的回答。存在两个基本情况：(1)\
  \ 我们到达了根节点或 (2) 堆序属性已满足。在任何一种情况下，我们退出函数而不执行任何操作。\n\n我们如何找到父节点？在仅从父节点链接到孩子的二叉树中，这项任务并不容易。然而，正如我们之前看到的，在我们的隐式链接实现中，这是极其简单的：\n\
  \n```cpp\nparent = (index - 1) / 2;\n```\n\n我们现在可以编写整个函数了：\n\n```cpp\ntemplate<class\
  \ ItemType>\nvoid HeapType<ItemType>::ReheapUp(int root, int bottom)\n// 后置：堆属性恢复。\n\
  {\n  int parent;\n  if (bottom > root)\n  {\n    parent = (bottom-1) / 2;\n    if\
  \ (elements[parent] < elements[bottom])\n    {\n      Swap(elements[parent], elements[bottom]);\
  \ \n      ReheapUp(root, parent);\n    }\n  }\n}\n```\n\n#### 重新审视应用层\n\n堆是实现优先级队列的极佳方法。下面的代码展示了我们如何声明\
  \ `PQType` 类。为了简洁起见，我们省略了拷贝构造函数并将其编码留作练习练习：\n\n\n\n\n\n```cpp\nclass FullPQ()\n\n\
  {};\n\nclass EmptyPQ()\n\n{};\n\ntemplate<class ItemType>\n\nclass PQType\n\n{\n\
  \npublic:\n  PQType(int);\n  ~PQType();\n  void MakeEmpty();\n  bool IsEmpty() const;\n\
  \  bool IsFull() const;\n  void Enqueue(ItemType newItem);\n  void Dequeue(ItemType&\
  \ item);\n\n  private:\n    int length;\n    HeapType<ItemType> items;\n    int\
  \ maxItems;\n\n  };\n\n  template<class ItemType>\n  PQType<ItemType>::PQType(int\
  \ max)\n  {\n    maxItems = max;\n    items.elements = new ItemType[max];\n    length\
  \ = 0;\n  }\n\n  template<class ItemType>\n  void PQType<ItemType>::MakeEmpty()\n\
  \  {\n    length = 0;\n  }\n\n  template<class ItemType>\n  PQType<ItemType>::~PQType()\n\
  \  {\n    delete [] items.elements;\n  }\n```\n\n我们使用数据成员 `length` 来维护优先队列中的元素数量。使用之前描述的堆实现，元素存储在数组\
  \ `items.elements` 的前 `length` 个槽位中。由于顺序属性，我们知道最大的元素位于根节点——即数组的第一个槽位（索引为 0）。\n\n\
  让我们先看看 `Dequeue` 操作。根元素被返回给调用者。在我们移除根节点后，留下了两个子树，每个子树都满足堆属性。当然，我们不能在根位置留下空洞，因为这会违反形状属性。由于我们删除了一个元素，优先队列中现在剩余\
  \ `length – 1` 个元素，存储在数组的 1 到 `length – 1` 槽位中。如果我们用最后一个元素填充根位置的空洞，数组 0 到 `length\
  \ - 2` 槽位就包含了堆元素。此时堆的形状属性是完好的，但顺序属性可能会被破坏。生成的结构不是堆，但它几乎是一个堆——除了根节点外，所有节点都满足顺序属性。这个问题很容易修正，因为我们已经有一个可以执行此项任务的堆操作：`ReheapDown`。这里是我们的\
  \ `Dequeue` 算法：\n\n`Enqueue` 操作涉及将元素添加到堆中“适当”的位置。这个位置在哪里呢？如果新元素的优先级大于当前根元素的优先级，我们知道新元素属于根节点。但那不是典型情况；我们想要一个更通用的解决方案。首先，我们可以将新元素放在堆底部的下一个可用叶子节点位置（复习\
  \ 图 9.4）。现在数组包含前 `length + 1` 个槽位中的元素，保留了堆的形状属性。生成的结构可能不是堆，但它几乎是一个堆——顺序属性在最后一个叶子位置被破坏了。这个问题使用\
  \ `ReheapUp` 操作很容易解决。这里是我们的 `Enqueue` 算法：\n\n以下是实现我们优先队列操作的代码：\n\n```cpp\ntemplate<class\
  \ ItemType>\nvoid PQType<ItemType>::Dequeue(ItemType& item)\n// 后置：优先级最高的元素已从队列中移除\n\
  //       ；副本返回在 item 中。\n{\n  if (length == 0)\n    throw EmptyPQ();\n  else\n \
  \ {\n    item = items.elements[0];\n    items.elements[0] = items.elements[length-1];\n\
  \    length--;\n    items.ReheapDown(0, length-1);\n  }\n}\n\ntemplate<class ItemType>\n\
  void PQType<ItemType>::Enqueue(ItemType newItem)\n// 后置：newItem 在队列中。\n{\n  if (length\
  \ == maxItems)\n    throw FullPQ();\n  else\n  {\n    length++;\n    items.elements[length-1]\
  \ = newItem;\n    items.ReheapUp(0, length-1);\n  }\n}\n\ntemplate<class ItemType>\n\
  bool PQType<ItemType>::IsFull() const\n// 后置：如果队列满了则返回 true，否则返回 false。\n{\n  return\
  \ length == maxItems;\n}\n\ntemplate<class ItemType>\nbool PQType<ItemType>::IsEmpty()\
  \ const\n// 后置：如果队列为空则返回 true，否则返回 false。\n{\n  return length == 0;\n}\n```\n\n\
  #### 堆与其他优先队列表示法的对比\n\n堆实现的优先队列效率如何？`MakeEmpty`、`IsEmpty` 和 `IsFull` 操作是显而易见的，因此我们只检查添加和移除元素的操作。\n\
  \n`Enqueue` 将新元素放入堆中的下一个空闲叶子节点。该数组位置可以直接访问，因此操作的这部分的复杂度为 O(1)。接下，我们调用 `ReheapUp`\
  \ 来修正顺序。该操作将新元素逐层向上移动树移动；因为完全树的高度是最小的，新元素上方最多存在 `log[2]N` 层（`N` = `length`）。因此，`Enqueue`\
  \ 是一个 O(log[2]N) 操作。\n\n`Dequeue` 移除根节点中的元素，并用最右侧的最后一个叶子节点替换它。数组中的这两个元素都可以直接访问，因此操作的这部分的复杂度为\
  \ O(1)。接下，我们调用 `ReheapDown` 来修正顺序。\n\n### 9.4 堆排序\n\n大多数入门编程课程都涵盖了某种形式的选择排序。编写选择排序的一种方法是找到数组中的最大值并将其与最后一个元素交换，然后找到次大元素并将其放在它的位置，依此类推（我们在第\
  \ 12 章中更详细地讨论选择排序）。\n\n正如我们刚刚看到的，堆是一种具有非常特殊特征的数据结构：我们总是知道在哪里找到它的最大元素。我们可以利用这种情况来帮助我们排序。堆排序的一般方法如下：\n\
  \n1.  从堆中取出根（最大）元素，并将其放在它的位置。\n2.  对剩余元素重新堆堆。（此操作会将次大元素放入根位置。）\n3.  重复此过程直到没有元素剩余。\n\
  \n\n\n\n\n该算法的第一部分听起来非常像直接选择排序。堆排序之所以快，在于第二步：寻找下一个最大的元素。因为堆的形状属性保证了二叉树具有最小高度，在每次迭代中，我们只需要进行\
  \ `O(log[2]N)` 次比较，而选择排序在每次迭代中需要 `O(N)` 次比较。\n\n## 构建堆\n\n此时，你可能在抗议说，我们处理的是一个无序元素数组，而不是一个堆。原始堆是从哪里来的呢？在继续之前，我们必须将无序数组\
  \ `values` 转换为堆。\n\n让我们看看堆是如何与我们的无序元素数组相关的。我们已经见过堆是如何通过带有隐式链接的数组来表示的。由于形状属性，我们知道堆元素占据了数组中连续的位置。事实上，数据元素的无序数组已经满足了堆的形状属性。图\
  \ 9.11 显示了一个无序数组及其等效树结构。\n\n![](img/f09-11.jpg)\n\n图 9.11 无序数组及其树\n\n我们还需要让无序数组元素满足堆的顺序属性。首先，让我们看看树的某部分是否已经满足了顺序属性。所有的叶子节点（只有一个节点的子树）都是堆。在图\
  \ 9.12a 中，根节点包含值 19、7、3、100 和 1 的子树都是堆，因为它们是根节点。\n\n接下来，看看第一个非叶节点，即包含值 2 的节点（图 9.12b）。以该节点为根的子树不是堆，但它几乎是一个堆——该子树根节点以外的所有节点都满足顺序属性。我们已经见过如何解决这个问题了。我们使用\
  \ `ReheapDown` 来纠正这种这种情况。给定一个元素满足堆顺序属性（但可能在根节点除外）的树，`ReheapDown` 会重新排列节点，使子树成为一个堆。\n\
  \n我们将此函数应用于该层的所有子树，然后在树中向上移动一层并继续重新堆，直到到达根节点。在对根节点调用 `ReheapDown` 后，整棵树都应该满足堆的顺序属性。图\
  \ 9.12 阐述了这一构建堆的过程；图 9.13 显示了数组内容的变化。\n\n早些时候，我们将 `ReheapDown` 定义为 `HeapType`（一种结构类型）的成员函数。在那里，函数有两个参数：根节点和底部节点的索引。在这里，我们假设了一种轻微的变化：`ReheapDown`\
  \ 是一个全局函数，接受第三个参数——一个被堆的数组。\n\n构建堆的算法总结如下：\n\n![](img/f09-12.jpg)\n\n图 9.12 堆堆的过程\n\
  \n![](img/f09-13.jpg)\n\n图 9.13 数组内容的变化\n\n我们知道根节点在堆的数组表示中存储在哪里——在 `values[0]` 中。第一个非叶节点在哪里？因为完全二叉树的一半节点是叶子节点（自己证明这一点吧），第一个非叶节点可以在位置\
  \ `numValues/2` - `1` 找到。\n\n## 使用堆进行排序\n\n既然我们已经确定可以将无序元素数组转换为堆，让我们再次看看这个排序算法。\n\
  \n我们可以轻松地从原始堆中获取最大元素——它在根节点中。在堆的数组表示中，该位置是 `values[0]`。这个值应该属于最后使用的数组位置 `values[numValues\
  \ - 1]`，所以我们只需要交换这两个位置的值。因为 `values[numValues - 1]` 包含数组中的最大值（其正确的排序后值），我们希望保持这个位置不变。现在我们处理的是一组从\
  \ `values[0]` 到 `values[numValues - 2]` 的元素，它们几乎是一个堆。我们知道所有这些元素都满足堆的顺序属性，根节点（可能）除外。为了纠正这种状态，我们调用\
  \ `ReheapDown`。\n\n此时，我们知道数组中下一个最大的元素位于堆的根节点。为了将此元素放在其正确位置，我们将其与 `values[numValues\
  \ - 2]` 中的元素交换。现在两个最大的元素都处于它们最终的正确位置，而 `values[0]` 到 `values[numValues - 3]` 中的元素几乎是一个堆。我们再次调用\
  \ `ReheapDown`，现在第三大的元素被放置在堆的根部。\n\n我们重复这个过程，直到所有元素都处于它们的正确位置——直到堆只包含一个元素，该元素必须是数组中的最小项\
  \ `values[0]`。这个位置是它的正确位置，所以数组现在已经从最小到最大完全排序了。注意在每次迭代中，无序部分（表示为堆）的大小都会变小，排序部分的大小都会变大。\n\
  \n```\ntemplate<class ItemType>\nvoid HeapSort(ItemType values[], int numValues)\n\
  // Assumption: Function ReheapDown 是可用的。\n// Post: 数组中的元素是排序的。\n{\n   int index;\n\
  \   // 将值数组转换为堆。\n   for (index = numValues/2 - 1; index >= 0; index--)\n     ReheapDown(values,\
  \ index, numValues-1);\n\n   // 排序数组。\n   for (index = numValues-1; index >= 1;\
  \ index--)\n   {\n     Swap(values[0], values[index]);\n     ReheapDown(values,\
  \ 0, index-1);\n   }\n}\n```\n\n注意 `HeapSort` 并没有实际使用 `HeapType` 结构体。相反，它使用将数组作为参数的\
  \ `ReheapDown` 函数。如果我们尝试直接使用 `HeapType`，通过迭代将数组元素存入结构体（这需要一个等大小的数组），然后顺序将它们取出回数组，我们将使用两倍的内存。\n\
  \n图 9.14 显示了排序循环（第二个 `for` 循环）的每次迭代是如何改变图 9.13 中创建的堆的。每一行代表操作后的数组。已排序的部分被阴影标记。我们将在第十二十二章](#ch12.xhtml_ch12)中分析堆排序的性能，在该章中我们将对比多种排序算法。但直观地说，你可以看到构建堆需要\
  \ N 次 `ReheapDown`，再需要 N 次来生成排序后的数组。由于每次执行 `ReheapDown` 需要 `O(log[2]N)` 时间，整个排序的工作量与\
  \ `O(Nlog[2]N)` 成比例。\n\n![](img/f09-14.jpg)\n\n图 9.14 `HeapSort` 对数组的影响\n\n我们带着一个简单的无序值数组进入\
  \ `HeapSort` 程序，并向调用者返回一个升序排列相同相同数组。堆去哪儿了？`HeapSort` 中的堆只是排序算法内部的一个临时结构。它在函数开始时创建以辅助排序过程，然后随着数组排序部分的增长而逐个减少。在函数结束时，排序部分填充了数组，堆已经完全消失。当我们使用堆来实现优先级队列时，堆结构在整个队列的使用期间一直存在。相比之下，`HeapSort`\
  \ 中的堆并不是一个保留的数据结构。它只在 `HeapSort` 函数内部存在一会。\n\n\n\n\n\n![](img/f0598-01.jpg)\n\n\
  #### 总结\n\n在本章中，我们看到了二叉树的一种新变体。通过放宽二叉搜索树顺序属性并引入额外的形状属性，我们得到了堆。与二叉搜索树不同（二叉搜索树可能会通过添加和删除退化为层数远大于最小数量），而堆始终保持为一棵完全树。因此，我们得到了一种可以在\
  \ `O(log[2]N)` 时间内插入元素的结构，同时能够让我们始终在 `O(1)` 时间内访问其最大值，并能以与 `O(log[2]N)` 成比例的时间删除该元素。\n\
  \n我们证明了堆是优先级队列的自然实现结构，优先级队列有许多应用。然后我们看到了如何将一个堆临时地叠加在数组上，以便我们在 `O(Nlog[2]N)` 时间内对其进行排序，这等同于我们在第\
  \ 7 章中看到的快速排序的时间。\n\n任何二叉树（更广义地说，任何节点具有固定数量子节点的树）都可以使用从节点索引计算出的隐式链接通过数组来表示。如果树有许多空节点，那么与显式链接实现相比，数组表示会浪费空间。然而，当树是完全的，数组表示具有极高的空间效率。它还提供了可以直接确定哪些节点是叶子节点的优势，并且像访问子节点一样容易访问节点的父节点。因此，它是实现堆的极佳手段，因为堆的定义就是完全二叉树。\n\
