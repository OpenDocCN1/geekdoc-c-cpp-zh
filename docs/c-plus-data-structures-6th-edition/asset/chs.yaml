  \n### 7.11 跟踪递归函数 `Insert` 的执行\n\n在本章前面的部分，我们写了一个递归的 `Insert` 函数，用于将新节点插入到动态分配的链表中。为了跟踪\
  \ `Insert` 的执行，让我们给列表中的节点加上地址。在下面的图中，节点上方的数字是该节点的基地址。`next` 成员下方的数字仅仅 `next` 数据成员的地址。指向列表的外部指针存储在位置\
  \ 010 处：\n\n![](img/f0465-02.jpg)\n\n我们将跟踪的函数模板如下：\n\n\n\n\n```cpp\ntemplate<class\
  \ ItemType>\n\nvoid Insert(NodeType<ItemType>*& listPtr, ItemType item)\n\n{\n \
  \ if (listPtr == NULL || item < listPtr->info)\n  {\n    // 保存当前指针。\n    NodeType<ItemType>*\
  \ tempPtr = listPtr;\n    // 获取新节点。\n    listPtr = new NodeType<ItemType>;\n   \
  \ listPtr->info = item;\n    listPtr->next = tempPtr;\n  }\n  else Insert(listPtr->next,\
  \ item);\n}\n```\n\n我们的追踪必须记录 `listPtr`、`item` 和返回地址。局部变量 `tempPtr` 在在激活记录（activation\
  \ record）中占有一位置。然而，我们没有给出一个特定的返回地址，而是使用约定：`R0` 是非递归调用的返回地址，而 `R1` 是递归调用的返回地址。我们追踪\
  \ `Insert(listData, item)`，其中 `item` 为 11。回想起形式参数 `listPtr` 是引用传递的，而 `item` 是按值传递的。以下是非递归调用后激活记录的样式：\n\
  \n![](img/f0466-01.jpg)\n\n当代码开始执行时，名为 `listPtr` 的位置（地址 010）中存储的值会被检查（因为 `listPtr`\
  \ 是一个引用参数）。该值不是 `NULL`，因此将 `item` 与位置 010 所指向的节点的 `info` 数据成员进行比较。数字 11 大于 7，因此再次递归调用函数：\n\
  \n![](img/f0466-02.jpg)\n\n名为 `listPtr` 的位置（即地址 014）中存储的值不是 `NULL`，且 11 大于 9，因此再次递归调用该函数。\n\
  \n![](img/f0466-03.jpg)\n\n名为 `listPtr` 的位置中存储的值不是 `NULL`，但 11 小于 13，因此执行 `then`\
  \ 子句并执行以下步骤。名为 `listPtr` 的位置的值被复制到 `tempPtr` 中。执行 `new` 运算符，并将一个 `NodeType` 类型节点的地址存储在名为\
  \ `listPtr` 的位置中。假设新节点的地址为 028，现在栈的情况如下：\n\n![](img/f0467-01.jpg)\n\n注意 `listPtr`\
  \ 并没有改变。我们刚才不是把地址 028 存储在那里吗？不——我们是将 028 存储在了名为 `listPtr` 的位置中：在位置 018，即上一个节点的 `next`\
  \ 成员中。我们的列表现在看起来是：\n\n![](img/f0467-02.jpg)\n\n接下来的两个语句将 `item` 存储在 `listPtr->info`\
  \ 中，将 `tempPtr` 存储在 `listPtr->next` 中，完成插入。\n\n如果我们错误地将 `listPtr` 作为值参数传递，看看此时的激活记录会是什么样子：\n\
  \n![](img/f0467-03.jpg)\n\n当执行 `new` 运算符时，一个 `NodeType` 类型节点的地址存储在 `listPtr` 中，而不是名为\
  \ `listPtr` 的位置中。因此，028 被存储在激活记录的成员 `listPtr` 中，而不是存储在前一个节点的 `next` 数据成员中（当 `listPtr`\
  \ 是引用参数时的情况是如此）。新节点的 `next` 数据成员被正确设置了，但指向新节点的指针存储在函数退出时会被移除的激活记录中。因此，列表的其余部分丢失了。事实上，如果你使用这个错误的版本来构建列表，列表将是空的。（你能解释为什么吗？）\n\
  \n我们的递归 `Insert` 函数工作正常。\n\n\n\n\n\n### 2. 每次递归调用是否涉及问题的更小规模实例？\n是的。`Split` 将段划分为两个不一定相等的部分，然后对这些每个较小的部分进行快速排序。请注意，即使\
  \ `splitVal` 是该段中的最大值或最小值，这两个部分仍然比原始部分小。如果 `splitVal` 小于段中的所有其他值，那么 `QuickSort(values,\
  \ first, splitPoint - 1)` 将立即终止，因为 `first > splitPoint - 1`。`QuickSort(values, splitPoint\
  \ + 1, last)` 排序的是一个比原始段少一个元素的段。\n\n### 3. 假设递归调用成功，整个函数能工作吗？\n是的。我们假设 `QuickSort(values,\
  \ first, splitPoint - 1)` 实际上排序了前 `splitPoint - 1` 个元素，这些元素的值小于或等于 `splitVal`。包含\
  \ `splitVal` 的 `values[splitPoint]` 处于其正确的位置。我们还假设 `QuickSort(values, splitPoint\
  \ + 1, last)` 正确排序了列表的其余部分，其值都大于 `splitVal`。通过这种方式，我们确定了整个列表都是排序的。\n\n通过良好的自顶向下方法，我们已经证明了如果函数\
  \ `Split`有效，我们的算法就能工作。现在我们必须开发划分算法。我们必须找到一种方法，将所有等于或小于 `splitVal` 的元素放在 `splitVal`\
  \ 的一侧，所有大于 `splitVal` 的元素放在另一侧。\n\n我们通过将索引 `first` 和 `last` 向数组中间移动，寻找位于划分点错误一侧的项目（图\
  \ 7.7）来实现这一目标。我们将 `first` 和 `last` 设置为值参数，这样就可以改变它们的值而不影响调用者函数。我们将 `first` 的原始值保存在局部变量\
  \ `saveFirst` 中。（参见图 7.7a）。\n\n我们首先将 `first` 向右中间移动，将 `values[first]` 与 `splitVal`\
  \ 进行比较^(2)。如果 `values[first]` 小于等于 `splitVal`，我们继续增加 `first`；否则，保持 `first` 位置不变，并开始将\
  \ `last` 向中间移动。（参见图 7.7b）。\n\n现在我们将 `values[last]` 与 `splitVal` 进行比较。如果它大于，我们继续减小\
  \ `last`；否则，将 `last` 留在原地。（参见图 7.7c）。此时，显然 `values[last]` 和 `values[first]` 都在数组的错误一侧。请注意，`values[first]`\
  \ 左侧和 `values[last]` 右侧的元素并不一定是排序的；它们只是相对于 `splitVal` 位于正确的一侧。为了将 `values[first]`\
  \ 和 `values[last]` 放在它们正确的位置，我们只需交换它们，然后增加 `first` 并减小 `last`。（参见图 7.7d）。\n\n现在我们重复整个循环，增加\
  \ `first` 直到遇到大于 `splitVal` 的值，然后减小 `last` 直到遇到小于或等于 `splitVal` 的值。（参见图 7.7e）。\n\
  \n过程何时停止？当 `first` 和 `last` 相遇时，不再需要进一步交换。它们在 `splitPoint` 处相遇，即 `splitVal` 所的位置。我们将包含\
  \ `splitVal` 的 `values[saveFirst]` 与 `values[splitPoint]` 处的元素进行交换。（参见图 7.7f）。函数返回索引\
  \ `splitPoint`，供 `QuickSort` 用于设置下一次递归调用：\n\n![](img/f07-07.jpg)\n\n图 7.7 函数 split；(a)\
  \ 初始化；(b) 增加 first 直到 values[first]>splitVal；(c) 减小 last 直到 values[last]<= splitVal；(d)\
  \ 交换 values[first] 和 values[last]；将 first 和 last 向彼此移动；(e) 增加 first 直到 values[first]>splitVal;\n\
  \n```\nvoid Split(ItemType values[], int first, int last, int& splitPoint)\n{\n\
  \  ItemType splitVal = values[first];\n  int saveFirst = first;\n  do\n  {\n   \
  \ while (first <= last && values[first] <= splitVal)\n    {\n      first++;\n  \
  \  }\n    while (first <= last && values[last] > splitVal)\n    {\n      last--;\n\
  \    }\n    if (first <= last)\n    {\n      Swap(values[first], values[last]);\n\
  \      first++;\n      last--;\n    }\n  } while (first <= last);\n\n  Swap(values[saveFirst],\
  \ values[last]);\n  splitPoint = last;\n}\n```\n\n```\n\n如果我们的划分值是段中的最大值或最小值会发生什么？算法仍然有效，但由于划分不平衡，它并不快。这种情况会发生吗？取决于对划分值的选择以及数据的原始顺序。如果我们使用\
  \ `values[first]` 作为划分值且数组已经排序，那么每次划分都是不平衡的。一边包含一个元素，而另一侧包含剩余元素。因此，我们的 `QuickSort`\
  \ 并不快。然而，想要排序一个接近排序的数组并不常见。在这种情况下，更好的划分值将中间值：\n\n```\nvalues[(first + last) / 2]\n\
  ```\n\n该值可以在函数开始时与 `values[first]` 交换。\n\n存在可能的划分算法。一种代表我们开发的变体如下。它使用数组中间的值作为划分值，而不将其移动到第一个位置。\n\
  \n```\nvoid Split2(ItemType values[], int first, int last, int& splitPt1, int& splitPt2)\n\
  {\n  ItemType splitVal = values[(first+last)/2];\n  do\n  {\n    while (first <=\
  \ last && values[first] <= splitVal)\n    {\n      first++;\n    }\n    while (first\
  \ <= last && values[last] > splitVal)\n    {\n      last--;\n    }\n    if (first\
  \ <= last)\n    {\n      Swap(values[first], values[last]);\n      first++;\n  \
  \    last--;\n    }\n  } while (first <= last);\n\n  splitPt1 = first;\n  splitPt2\
  \ = last;\n}\n```\n\n如果我们使用这种算法，`QuickSort` 必须稍微微调：\n\n```\nvoid QuickSort2(ItemType\
  \ values[], int first, int last)\n{\n  if (first < last)\n  {\n    int splitPt1;\n\
  \    int splitPt2;\n    Split2(values, first, last, splitPt1, splitPt2);\n\n   \
  \ // values[first]..values[splitPt2] <= splitVal\n    // values[splitPt1+1]..values[last]\
  \ > splitVal\n    if (splitPt1 < last) QuickSort2(values, splitPt1, last);\n   \
  \ if (first < splitPt2) QuickSort2(values, first, splitPt2);\n  }\n}\n```\n\n###\
  \ 7.13 调试递归例程\n\n\n\n\n由于递归程序会对自身进行嵌套调用，其调试过程可能会非常混乱。最严重的问题与程序可能无限递归有关。该问题的典型症状是错误信息，指出由于递归调用的深度，系统运行栈空间已耗尽。使用`三问句法`（Three-Question\
  \ Method）来验证递归函数应该帮助我们避免这种永不结束的问题。如果我们对`基准情况`（Base-Case）和`更小调用者问题`（Smaller-Caller\
  \ Questions）的回答都是“是”，那么我们应该能够保证程序最终会结束——至少在理论上是这样。\n\n然而，这并不能保证程序不会因为空间不足而失败。在上一节中，我们看到函数调用需要一定的开销来保存参数、返回地址和局部数据。对递归函数的调用可能会产生许多、非常许多层对自身的函数调用——事实上，这可能超过系统能够处理的范围。\n\
  \n程序员在初开始编写递归程序时经常犯的一个错误是使用循环结构而不是分支结构。因为他们倾向于从重复动作的角度来考虑问题，所以不无意中使用了 `while` 语句而不是\
  \ `if` 语句。递归程序的主体应该始终分解为基准情况和递归情况。因此，我们使用分支语句而不是循环语句。双检你的递归函数是一个好主意，确保你使用了 `if`\
  \ 或 `switch` 语句来实现分支效果。\n\n递归程序是测试期间放置调试输出语句的好地方。在函数的开始和结束处，打印参数和局部变量（如果有的话）。务必在递归调用时打印参数的值，以验证每次调用是否正试图解决一个比上一次更小的问题。\n\
  \n### 7.14 消除递归\n\n在不需要递归解决方案的情况下，可能是因为语言不支持递归，或者是认为递归解决方案在空间或时间上成本太高，你可以将递归算法实现为非递归函数。通常使用两种通用技术来替代递归：迭代（iteration）和栈（stacking）。\n\
  \n#### 迭代\n当递归调用是递归函数中执行的最后一个动作时，就会发生一种有趣的情况。递归调用会导致一个激活记录被放入运行栈中，以保存函数的参数和局部变量。当这个递归调用执行完毕时，运行栈会被弹出，变量的先前值会被恢复。但由于递归调用是函数中的最后一个语句，函数在不使用这些值的情况下终止了。因此，激活记录的推入和弹出是多余的活动。我们真正需要做的改变递归调用参数列表上的“更小调用者”变量，然后跳回函数的开头。换句话说，我们真的需要循环。\n\
  \n例如，正如本章后面解释的那样，`ValueInList` 函数是对递归的糟糕使用。从这个函数消除递归是件简单的事。在一般情况下，执行的最后一个语句是对自身的递归调用，所以让我们用循环替换这个递归吧。\n\
  \n递归解决方案有两个基准情况：(1) 我们找到了该值，以及 (2) 我们到达了列表末尾但没有找到该值。基准情况在不进一步执行函数的情况下解决了问题。在迭代解决方案中，基准情况变成了循环的终止条件：\n\
  \n```\nwhile (!found && moreToSearch)\n```\n\n当满足终止条件时，问题在不进一步执行循环体的情况下得到了解决。\n\n\
  在递归解决方案的般情况下，`ValueInList` 被调用来搜索列表剩余的未搜索部分。函数的每次递归执行都在处理一个更小版本的问题。“更小调用者问题”得到了肯定的回答，因为\
  \ `startIndex` 递增了，在每次递归调用时缩小了列表中未搜索部分。同样，在迭代解决方案中，循环体的每次后续执行都在处理一个更小版本的问题。由于 `startIndex`\
  \ 递增，列表未搜索部分随着循环体的执行而缩小：\n\n```\nif value = list.info[startIndex]\n\n  Set found\
  \ to true\n\nelse\n\n  Increment startIndex\n```\n\n这里是该函数的迭代版本：\n\n```\nbool ValueInList(ListType\
  \ list, int value, int startIndex)\n\n{\n  bool found = false;\n\n  while (!found\
  \ && startIndex < list.length)\n    if (value == list.info[startIndex])\n      found\
  \ = true;\n\n    else startIndex++;\n\n      return found;\n}\n```\n\n递归调用是执行的最后一个语句的情况被称为尾递归。注意，递归调用并不一定是函数中的最后一个语句。例如，在以下\
  \ `ValueInList` 的版本中，递归调用仍然是尾递归，尽管它不是函数中的最后一个语句：\n\n```\nbool ValueInList(ListType\
  \ list, int value, int startIndex)\n\n{\n  if (list.info[startIndex] == value)\n\
  \    return true;\n\n  else if (startIndex != list.length-1)\n    return ValueInList(list,\
  \ value, startIndex+1);\n\n  else return false;\n}\n```\n\n递归调用是般情况下执行的最后一个语句——因此，它涉及尾递归。为了从解决方案中消除递归，尾递归通常被迭代替换。事实上，许多编译器会捕捉尾递归并自动将其替换为迭代。\n\
  \n#### 栈\n当递归调用不是递归函数中执行的最后一个动作时，我们不能简单地用循环代替递归。例如，在 `RevPrint` 函数中，我们进行递归调用，然后打印当前节点的值。在这种情况下，我们必须将系统执行的栈操作替换为程序员执行的栈操作。\n\
  \n我们如何非递归地编写 `RevPrint`？当我们遍历列表时，必须跟踪每个节点的指针，直到到达列表末尾（当我们的遍历指针等于 `NULL`）。然后我们打印最后一个节点的\
  \ `info` 成员。接下来，我们回溯并打印，回溯并打印，直到打印完列表第一个元素。\n\n我们已经知道一种可以存储指针并反向检索它们的数据结构：栈。`RevPrint`\
  \ 的般任务如下：非递归的 `RevPrint` 函数可以像所示编码。注意，我们现在将 `RevPrint` 设为 `ListType` 类的成员函数，而不是辅助函数。因为\
  \ `RevPrint` 不再有参数，所以我们不需要处理客户端传递链表开头的不可访问指针的问题：\n\n```\n#include \"StackType.h\"\
  \ \nvoid ListType::RevPrint()\n\n{\n  StackType<NodeType*> stack; \n  NodeType*\
  \ listPtr;\n\n  listPtr = listData;\n\n  while (listPtr != NULL) // 将指针推入栈。\n  {\n\
  \    stack.Push(listPtr);\n    listPtr = listPtr->next;\n  }\n\n  // 反向检索指针并打印元素。\n\
  \  while (!stack.IsEmpty())\n  {\n    listPtr = stack.Top();\n    stack.Pop();\n\
  \    std::cout << listPtr->info;\n  }\n}\n```\n\n注意 `RevPrint` 的非递归版本比递归版本长得多，特别是加上栈例程\
  \ `Push`、`Pop`、`Top` 和 `IsEmpty` 代码后。这种冗长反映了我们显式进行进出栈操作的需求。在递归版本中，我们只需递归调用 `RevPrint`\
  \ 并让运行栈来跟踪指针。\n\n\n\n\n在决定是否对某个问题使用递归解决方案时，你必须考虑几个因素。主要问题是解决方案的清晰度和效率。让我们先关注效率。\n\
  \n## 效率\n\n通常情况下，递归解决方案在计算机时间和空间上的成本都更高。（这并非绝对的结论；它实际上取决于计算机和编译器。）由于嵌套的递归函数调用，递归解决方案通常在时间（每次递归调用都需要运行函数序言\
  \ prologues 和结尾 epilogues）和空间（必须创建一个激活栈记录 activation record）方面需要更多的开销。对递归例程的调用可能会隐藏许多层级的内部递归调用。例如，调用\
  \ `Factorial` 的迭代解决方案涉及单次函数调用，这会在运行时栈上压入一个激活栈记录。然而，调用 `Factorial` 的递归版本则需要 `N +\
  \ 1` 次函数调用和 `N + 1` 个激活栈记录被推入运行时栈中，其中 `N` 代表形式参数 `number`。也就是说，递归深度为 `O(N)`。对于某些问题，系统在运行时栈中可能没有足够的空间来运行递归解决方案。\n\
  \n作为一个极端例子，考虑递归函数 `ValueInList` 的原始版本。每当它被调用时，它都会保存参数的副本，包括整个列表（列表是作为值参数传递的）。随着我们在列表中搜索得越深，嵌套的递归调用层级越多，运行时栈所需的内存变得非常可观。如果列表包含\
  \ 100 个元素，而我们要寻找的项不在列表中，我们最终会保存 100 份 100 元素列表的副本。最终，我们将消耗大量的内存，以至于可能完全耗尽空间。\n\n\
  这种情况是递归调用相关开销问题之一的极端例子。在特定情况下，我们可以将列表设为引用参数（这通常在返回值的函数中是不这么做的），这样 `ValueInList`\
  \ 的每次调用都不会生成基于数组的列表的新副本。（相反，传递的是唯一一份 `list` 拷贝的地址。）尽管如此，递归层级仍然是 `O(N)`，而迭代解决方案的长度大相相同，且同样清晰。因此，`ValueInList`\
  \ 是递归的糟糕用法。\n\n另一个潜在问题是，特定的递归解决方案可能从本质上就是低效的。这种低效并不是反映我们如何选择实现算法；而是对算法本身的指责。例如，回想我们在本章之前讨论过的函数\
  \ `Combinations`。在图 7.2 中所示的函数示例 `Combinations(4,3)` 似乎足够简单。但考虑图 7.8 中所示的 `Combinations(6,4)`\
  \ 的执行。该函数固有的问题是它重复计算相同的值。`Combinations(4,3)` 在两个地方被计算，`Combinations(3,2)` 在三个地方被计算，`Combinations(2,1)`\
  \ 和 `Combinations(2,2)` 也是如此。我们可能使用这个函数解决任何大规模的组合问题。问题在于程序会“永远”运行——直到它耗尽计算机的能力；它是对一个线性时间\
  \ `O(N)` 问题所给出的指数级时间 `O(2^N)` 解决方案。虽然我们的递归函数非常容易理解，但它并不是一个实用的解决方案。在这种情况下，你应该寻求迭代解决方案。\n\
  \n![](img/f07-08.jpg)\n\n图 7.8 计算 `Combinations(6,4)`\n\n## 清晰度\n\n然而，解决方案的清晰度问题仍然是一个重要因素。对于许多问题，递归解决方案对程序员来说更简单、更自然。解决一个问题所需的总工作量可以被想象成冰冰山。通过使用递归编程，应用程序程序员可以将视野限制在冰山一角。系统会处理水面下的大部分工作。例如，比较函数\
  \ `RevPrint` 的递归和非递归版本。在递归版本中，系统处理了我们在非递归函数中必须显式执行堆栈操作。因此，递归可以作为一种工具，通过隐藏某些实现细节来帮助降低程序的复杂度。随着计算机时间和内存成本的降低以及程序员时间成本的增加，对此类问题使用递归解决方案是值得的。\n\
  \n#### 总结\n\n总结来说，在以下情况下使用递归是好的：\n\n*   递归调用的深度相对“浅”，仅为问题规模的一部分。例如，`BinarySearch`\
  \ 函数中的递归调用深度为 `O(log[2]N)`；它是递归的良好候选者。然而，`Factorial` 和 `ValueInList` 例程中的递归调用深度为\
  \ `O(N)`。\n*   递归版本的工作量与非递归版本大致相同。你可以比较 Big-O 近似值来确定这种关系。例如，我们已经确定，与 `O(N)` 的迭代版本相比，`Combinations`\
  \ 的 `O(2^N)` 递归版本是递归的糟糕用法。然而，`BinarySearch` 的递归和迭代版本都是 `O(log[2]N)`。`BinarySearch`\
  \ 是递归函数的良好示例。\n*   递归版本比非递归解决方案更短更简单。根据这一规则，`Factorial` 和 `ValueInList` 代表了递归编程的糟糕用法。它们说明了如何理解和编写递归函数，但可以使用迭代方式更有效地编写，而不会丢失解决方案的清晰度。`RevPrint`\
  \ 是递归更好的用法。它的递归解决方案非常容易理解，而非递归等效实现要糟糕得多。\n\n递归是一种非常强大的计算工具。使用得当，它可以简化问题的解决，通常产生更短、更易理解的代码。正如计算中常见的，权衡是必要的：由于多层函数调用的开销，递归函数在时间和空间上通常效率较低。这种成本的大小取决于计算机系统和编译器。\n\
  \n\n\n相比之下，使用静态存储分配时会在编译时为函数的每个参数和局部变量留出一个单一位置。没有提供空间来存储通过重复嵌套调用同一函数计算出的任何中间值。因此，仅支持静态存储分配的系统和语言不支持递归。\n\
  \n当递归不可行或不合适，可以使用循环结构通过非递归的方式实现递归算法，在某些情况下，通过将相关值推入和从栈中弹出来实现。这种由程序员控制的栈显式地替换了系统的运行时栈。虽然此类非递归解决方案在时间和空间上通常更有效，但它们在解决方案的优雅性上通常需要权衡。\n\
