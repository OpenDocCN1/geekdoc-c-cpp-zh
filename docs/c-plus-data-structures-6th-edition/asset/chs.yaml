  \n应用于动态分配数组的方法的行为与应用于静态分配数组的方法完全相同，因此在接后的讨论中我们将它们归为一类。\n\n我们为基于数组的列表中的 `GetItem`\
  \ 开发了三种算法：顺序搜索、在跳过元素可能所在（如果存在）的位置时退出的顺序搜索，以及二分查找。前两者的复杂度均为 `O(N)`。二分查找算法又是怎样的？我们展示了一个表格，比较了在特定规模列表下线性搜索与二分查找所搜索的项数。我们如何用大\
