  \ 4、高度为 3 且元素最少的 B 树。\n\n\n\n\n\n我们为集合抽象数据类型（ADT）定义了两个转换器：`Store` 用于将一个项放入集合，而 `Delete`\
  \ 用于从集合中移除一个项。集合上定义了三种数学操作：`union`并集）、`intersection`交集）和`difference`差集）。并集操作接受两个集合并创建一个第三集合，其中包含任一输入集合中的所有元素。交集接受两个集合并创建一个第三集合，其中仅包含两个集合共同拥元素。差集接受两个集合并创建一个第三集合，其中包含第一个集合中存在但不在第二个集合中的所有项。在集合术语中，集合中项的数量被称为集合的基数。\n\
  \n现在，让我们通过几个具体的例子来复习这些集合操作。`SetA` 和 `SetB` 如下：\n\n* `SetA = {A, B, D, Q, G, S}`\n\
  * `SetB = {A, D, S, P, Z}`\n\n`SetA ∪ SetB`（并集）返回一个包含位于 `SetA` 或 `SetB` 中的项（在此例中为字母）的集合。如果一个字母在两个集合中都，则结果集中只保留一个。\n\
  \n* `ResultSet = {A, B, D, Q, G, S, P, Z}`\n\n`SetA ∩ SetB`（交集）返回一个包含两个集合中都存在的字母的集合。\n\
  \n* `ResultSet = {A, D, S}`\n\n`SetA – SetB`（差集）返回一个包含 `SetA` 中不在 `SetB` 中的字母的集合。\n\
  \n* `ResultSet = {B, Q, G}`\n\n注意，集合并集和集合交集具有交换律，但集合差集没有。也就是说，`SetA ∪ SetB` 等于 `SetB\
  \ ∪ SetA`，`SetA ∩ SetB` 等于 `SetB ∩ SetA`，但 `SetA – SetB` 不等于 `SetB – SetA`。\n\n\
