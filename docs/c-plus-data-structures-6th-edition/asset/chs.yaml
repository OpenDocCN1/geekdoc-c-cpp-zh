  \ | 表 1.3 按应用领域的交付错误率 |\n\n#### 总结\n\n抽象和信息隐藏的策略如何满足我们的质量软件目标？当细节在每个层被隐藏时，代码变得更简单易读，这使得程序更容易编写和修改。功能分解和面向对象的设计过程都能产生模块化的单元，这些单元也更容易进行测试、调试和维护。\n\
  \n模块化设计的一个积极副作用是修改倾向于局限于一小部分模块，从而降低了修改成本。记住，每当修改模块时，都必须重新测试以确保它在程序中仍然正常工作。通过将受程序更改影响的模块局部化，我们限制了重新测试的范围。\n\
  \n\n\n\n我们通过使设计符合我们的逻辑蓝图，并将复杂的细节委托给更低层次的抽象来提高可靠性。对软件开发中涉及的广泛活动（从需求分析到结果生成程序的维护）有良好的理解，将使人们对严谨的软件工程方法产生认同。每个人都认识某些编程大牛，他们可以坐下来，在一个晚上内独立工作，在没有正式设计的情况下通过代码写出一个程序。但我们不能依靠这种“魔术”来控制涉及许多程序员努力的大型、复杂软件项目的设计、实现、验证和维护。随着计算机变得越来越强大，人们想要在上面解决的问题也变得越来越大、越来越复杂。有些人将这种现象称为“软件危机”，而我们希望你将其视为一种“软件挑战”。\n\
  \n现在应该显而易见，程序验证并不是在你程序提交截止前一个晚上才开始的。设计验证和程序测试贯穿于整个软件生命周期。\n\n验证活动从软件规范制定时开始。此时，确定了总的测试方法和目标。然后，随着程序设计工作的开始，这些目标就会被应用。程序的某些部分可以使用形式化验证技术，进行设计检查，并规划测试用例。在实现阶段，开发测试用例并生成支持它们的测试数据。代码检查可以在程序运行之前为程序员调试程序提供额外支持。当代码编译完成并准备好运行时，会进行单元（模块级）测试，并使用存根（stubs）和驱动程序（drivers）作为支持。这些单元经过完全测试后，它们会被集成在一起。一旦发现并修复了错误，就会重新运行之前的一些测试，以确保修复没有引入任何新问题。最后，对整个系统进行验收测试。图\
  \ 1.10 展示了各种类型的验证活动如何融入软件开发生命周期。在整个生命周期中，有一点是恒定的：在这个周期中越早检测到程序错误，消除就越容易（花费的时间、精力和资金也越少）。程序验证是一个严谨的主题；一个无法运行的程序不值得存储它的磁盘空间。\n\
  \n| 阶段 | 活动 |\n| :--- | :--- |\n| 分析 | 确保完全理解规范。理解测试需求。 |\n| 规范 | 验证已识别的需求。与客户一起进行需求检查。\
  \ |\n| 设计 | 为了正确性进行设计（使用断言如前置条件和后条件）。进行设计检查。规划测试方法。 |\n| 代码 | 良好理解编程语言。进行代码检查。在程序中添加调试输出语句。编写测试计划。构建测试驱动和/或存根。\
  \ |\n| 测试 | 根据测试计划进行单元测试。根据需要进行调试。集成已测试模块。修复后重测。 |\n| 交付 | 对完成的产品执行验收测试。 |\n| 维护\
  \ | 每当交付的产品发生更改以添加新功能或修复检测到的问题时，执行回归测试。 |\n\n图 1.10 生命周期验证活动\n\n### 习题\n\n1. 解释一下我们所说的“软件工程”。\n\
