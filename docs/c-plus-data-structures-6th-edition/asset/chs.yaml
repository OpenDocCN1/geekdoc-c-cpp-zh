  \n### 4.2 动态分配数组\n\n如果我们能找到一种技术，让客户端能够在运行时指定列表中元素的最大数量，那不是太好了吗？当然，如果 C++ 没有提供这种方法，我们也就不会问这个问题了。我们可以让最大元素数量成为类构造函数的参数。但实现结构是一个数组，编译器难道不需要在编译时知道数组的大小吗？如果数组在静态存储中，那么确实需要，但如果我们允许它位于动态存储（空闲存储或堆）中，数组的内存可以在运行时分配。这种更改需要对类定义进行以下调整：\n\
  \n```\n{\npublic:\n\n  SortedType(int max);      // max 是列表最大大小\n\n  SortedType();\
  \             // 默认大小为 500\n\n  // 其他原型定义放在这里。\n\nprivate:\n\n  int length;\n\n\
  \  int maxList;              // 元素最大数量\n\n  ItemType* info;           // 指向动态分配内存的指针\n\
  \n  int currentPos;\n\n};\n```\n\n声明类对象时，客户端可以使用参数化构造函数指定列表元素的最大数量：\n\n```\nSortedType\
  \ myList(100);\n\n// 最多包含 100 个元素的列表。\n```\n\n或者，客户端可以使用默认构造函数接受 500 的默认大小：\n\n\
  ```\nSortedType yourList;\n```\n\n在每个构造函数的函数定义内部，其思想是使用 `new` 运算符来分配一个恰好所需大小的数组。之前我们看到\
  \ `new SomeType` 表达式在空闲存储上分配了一个 `SomeType` 类型的单个变量，并返回指向它的指针。要分配数组，我们在数据类型名称后加上方括号中的数组大小：`new\
  \ AnotherType[size]`。在这种情况下，`new` 运算符返回新分配数组的基地址。以下是 `SortedType` 构造函数的实现代码：\n\n\
  ```\nSortedType::SortedType(int max)\n{\n  maxList = max;\n\n  length = 0;\n\n \
  \ info = new ItemType[maxList];\n}\n\nSortedType::SortedType()\n{\n  maxList = 500;\n\
  \n  length = 0;\n\n  info = new ItemType[maxList];\n}\n```\n\n注意，`info` 现在是一个指针变量，而不是数组名。它指向动态分配数组的第一个元素。然而，C++\
  \ 的一个基本事实是，只要指针指向数组，你就可以为任何指针附加索引表达式——而不仅仅是数组名。因此，`info` 的索引方式与它被定义为 `ItemType`\
  \ 类型数组时完全一样（参见图 4.5）。因此，只需要更改一个成员函数：`IsFull`。\n\n```\nbool SortedType::IsFull()\n\
  {\n  return (lenth == maxList);\n}\n```\n\n我们需要使用类的析构函数。当列表离开范围时，分配给 `top`、`maxList`\
  \ 和 `items` 的内存会被释放，但 `items` 指向的数组不会释放。要释放数组，需要在 `delete` 关键字和指针名称之间插入方括号。\n\n\
  ```\nSortedType::~SortedType()\n{\n  delete [] info;\n}\n```\n\n在离开这个 `SortedType`\
  \ 实现之前，让我们问问是否有必要同时提供参数化构造函数和默认构造函数。参数化构造函数不是足够了吗？在大多数情况下，是的。然而，用户可能想要声明一个列表对象数组，在这种情况下无法使用参数化构造函数。（记住规则：如果一个类具有任何构造函数，并且声明了类对象数组，那么其中一个构造函数必须是默认构造函数，并且它会被用于数组中的每个元素。）因此，在\
  \ `SortedType` 类中包含默认构造函数是最智的，允许如下所示客户端代码：\n\n![](img/f04-05.jpg)\n\n图 4.5 数组位于动态存储中的列表\n\
  \n```\nSortedType SortedGroup[10];\n\n// 10 个排序列表，每个大小为 500。\n```\n\n### 4.3 使用链式结构实现排序列表\n\
  \n在编写基于数组的排序列表实现时，我们发现必须从无序列表（Unsorted List）的版本修改 `PutItem` 和 `DeleteItem`，但 `GetItem`\
  \ 可以高效。由于 `PutItem` 和 `DeleteItem` 都必须搜索列表，让我们先看 `GetItem`。\n\n#### 函数 `GetItem`\n\
  \n对于无序版本，我们将基于数组的算法改为链表表示法。让我们再次尝试这种方法并检查 `location` 值。这里有三种情况，而不是两种：\n\n1. `location\
  \ = NULL`。如果我们到达列表末尾没有找到与 `item` 相等的项，则该元素不在列表中（参见图 4.6a）。\n2. `item.ComparedTo(location->info)\
  \ = EQUAL`。在这种情况下，我们在列表中找到了元素并将其复制到 `item` 中（参见图 4.6b）。\n3. `item.ComparedTo(location->info)\
  \ = LESS`。在这种情况下，我们已经过了项所在的位置，因此它不在列表中（参见图 4.7）。\n\n查看了所有情况后，我们可以再次编写该算法，并确信它是正确的。在这里在这里使用了关系运算符。\n\
  \n```\nItemType SortedType::GetItem(ItemType item,\n     bool& found)\n{\n  bool\
  \ moreToSearch;\n  NodeType* location;\n  location = listData;\n  found = false;\n\
  \  moreToSearch = (location != NULL);\n\n  while (moreToSearch && !found)\n  {\n\
  \    switch(item.ComparedTo(location->info))\n     {\n      case GREATER: location\
  \ = location->next;\n                    moreToSearch = (location != NULL);\n  \
  \                  break;\n      case EQUAL:   found = true;\n                 \
  \   item = location->info;\n                    break;\n      case LESS:    moreToSearch\
  \ = false;\n                    break;\n     }\n  }\n\n  return item;\n}\n```\n\n\
  #### 函数 `PutItem`\n\n我们只需要用指针表达式替换 `GetItem` 中相应的索引表达式即可。这种技术适用于 `PutItem` 吗？嗯，我们知道不需要像在数组中那样移动任何元素，所以让我们替换到这一步并看看吧。\n\
  \n\n\n\n\n当我们退出循环时，`location` 指向 `item` 所在的位置。这是正确的。（参见图 4.7）。我们只需要获取一个新节点，将 `item`\
  \ 放入 `info` 成员中，将 `location` 放入 `next` 成员中，并将新节点的地址放入其前一个节点（包含 John 的节点）的 `next`\
  \ 成员中。哎呀！我们没有指向该前一个节点的指针。我们必须同时跟踪前一个指针和当前指针。当在无序列表的 `DeleteItem` 中出现类似问题时，我们通过向前比较一个项目（`(location->next)->info`）。我们在这里也可以这样做吗？不能。我们本可以使用那种技术，是因为我们知道要查找的项存在于列表中。而在这里，我们知道要查找的项不在列表中。如果新项本应该放在列表末尾，该算法将会崩溃，因为\
  \ `location->next` 将是 `NULL`。（参见图 4.8）\n\n我们可以更改确定 `moreToSearch` 的方法，但存在一种更简单的方法来处理这种情况。我们使用两个指针来搜索列表，其中一个指针始终后一个节点。我们将前一个指针称为\
  \ `predLoc`，并让它在 `location` 后一个节点。当 `ComparedTo` 返回 `GREATER` 时，两个指针都向前移动。如图 4.9\
  \ 所示，这个过程类似于尺虫的移动。`predLoc`（尺虫的尾）追上 `location`（头），然后 `location` 进。由于第一个节点之前没有其他节点，我们将\
  \ `predLoc` 初始化为 `NULL`。现在让我们在算法中总结一下这些思想：\n\n![](img/f04-08.jpg)\n\n图 4.8 插入到列表末尾\n\
  \n![](img/f04-09.jpg)\n\n图 4.9 尺虫效应\n\n在编写代码之前，让我们先过一遍算法。有四种情况：新项位于第一个元素之前、两个其他元素之间、最后一个元素之后，或者插入到空列表。（参见图\
  \ 4.10）。如果如果我们在第一个元素处插入（图 4.10a），Alex 与 Becca 返回 `LESS`，我们退出循环。我们将 `location` 存储到\
  \ `newNode->next`，`newNode` 存储到 `predLoc->next`。糟糕！程序崩溃了，因为 `predLoc` 是 `NULL`。我们必须检查\
  \ `predLoc` 是否为 `NULL`，如果是，我们必须将 `newNode` 存储在 `listData` 中而不是 `predLoc->next`。\n\
  \n中间的情况呢？插入 Kit（图 4.10b）会让 `location` 指向 Lila ，`predLoc` 指向 Kate 节点。`newNode->next`\
  \ 指向 Lila 节点；Kate 节点指向新节点。这没问题。\n\n在末尾插入时又是怎样的？插入 Kate（图 4.10c）会让 `location` 等于\
  \ `NULL`，`predLoc` 指向 Chris 节点。`NULL` 存储在 `newNode->next` 中；`newNode` 存储在包含 Chris\
  \ 的节点的 `next` 成员中。\n\n当列表为空时算法有效吗？让我们看看。`location` 和 `predLoc` 都是 `NULL`，但当 `predLoc`\
  \ 为 `NULL` 时我们将 `newNode` 存储在 `listData` 中，所以没有问题。（参见图 4.10d）。现在我们可以编写函数 `PutItem`\
  \ 了。\n\n```cpp\nvoid SortedType::PutItem(ItemType item)\n{\n  NodeType* newNode;\
  \  // 指向插入节点的指针。\n  NodeType* predLoc;  // 后随指针。\n  NodeType* location; // 遍历指针。\n\
  \  bool moreToSearch;\n\n  location = listData;\n  predLoc = NULL;\n  moreToSearch\
  \ = (location != NULL);\n\n  // 找到插入点。\n  while (moreToSearch)\n  {\n    switch(item.ComparedTo(location->info))\n\
  \    {\n      case GREATER: predLoc = location;\n                    location =\
  \ location->next;\n                    moreToSearch = (location != NULL);\n    \
  \                break;\n      case LESS:    moreToSearch = false;\n           \
  \         break;\n    }\n  }\n\n  // 准备插入节点。\n  newNode = new NodeType;\n  newNode->info\
  \ = item;\n```\n\n![](img/f04-10.jpg)\n\n图 4.10 四种插入情况\n\n```cpp\n // 将节点插入列表。\n\
  \  if (predLoc == NULL)         // 作为第一个插入。\n  {\n    newNode->next = listData;\n\
  \    listData = newNode;\n  }\n  else\n  {\n    newNode->next = location;\n    predLoc->next\
  \ = newNode;\n  }\n  length++;\n}\n```\n\n#### 函数 `DeleteItem`\n\n与 `GetItem` 和\
  \ `PutItem` 情况一样，`DeleteItem` 算法从搜索开始。在这里，当 `item.ComparedTo(location->info)` 返回\
  \ `EQUAL` 时，我们退出搜索循环。一旦找到了该项，就删除它。由于我们的前提条件说明要删除的项存在于列表中，我们有一个选择。我们可以完全按照样使用无序列表算法，或者编写一个与插入算法镜像的算法。我们将编写新算法的任务留给您作为练习题。图\
