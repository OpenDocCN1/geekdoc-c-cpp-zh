  \ 相同 |\n\n| `s.substr(pos, len)` | |\n| :--- | :--- |\n| 参数: | 两个无符号整数 `pos` 和 `len`，表示位置和长度。`pos`\
  \ 的值必须小于 `s.length()`。 |\n| 函数返回值: | 一个临时的 `string` 对象，包含从 `s` 的位置 `pos` 开始的最多 `len`\
  \ 个字符的子字符串。如果 `len` 过大，则表示到 `s` 字符串的“末”。 |\n| 注意： | 字符串中字符的位置从 0 开始计数。 |\n\n## 附录\
