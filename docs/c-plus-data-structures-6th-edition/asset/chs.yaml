  \ `StackType`（链式）。\n\n## 21. 使用模板重写 `QueType`（链式）。\n\n## 22. 假设 `ItemType` 类重载了关系运算符，重写基于数组的\
  \ `UnsortedList` 中的 `ComparedTo` 函数。\n\n## 23. 为 `LargeInt` 创建统一建模语言 (UML) 图。\n\n\
  24. 对或错？双向链表的节点有两个指针。\n25. 对或错？头节点是列表开头的占位节点，用于简化列表处理。\n26. 对或错？尾节点在语法上与列表其他节点不同。\n\
  27. 对或错？尾节点在逻辑上与列表其他节点不同。\n28. 对或错？尾节点是列表结尾的占位节点，用于简化列表处理。\n29. 对或错？使用继承来特化类 X 的程序员需要访问\
  \ X 的实现代码。\n30. 对或错？在 C++ 中，派生类的构造函数在基类构造函数之后执行。\n31. 对或错？为了让 C++ 派生类覆盖继承的成员函数，基类需要声明该函数为虚。\n\
  \n# 第章：递归编程\n\n本章介绍了递归主题——这是许多语言支持的一种独特方法。在递归中，你通过反复将问题分解为更小的版本，直到达到可以解决的平凡尺寸。然后你组合子问题的解决方案，直到得出原始问题的解决方案。\n\
  \n尽管递归初看起来可能很笨拙，但只要应用得，它代表了一种强大且有效的工具。\n\n### 7.1 什么是递归？\n\n你可能见过一组可以互相放入的俄罗斯娃娃。大娃娃里面有一个小娃娃，小娃娃里面又有一个更小的娃娃，以此此类推。递归定义就像这些俄罗斯娃娃。它不断产生自身的副本版本，直到达到一个无法再划分的版本——即达到最小的娃娃。递归算法通过使用一个调用自身的函数来实现，这比比于一个一个地拆解娃娃。\n\
  \n![](img/f0436-01.jpg)\n\n在 C++ 中，任何函数都可以调用另一个函数。一个函数甚至可以调用自己。当一个函数调用自己时，它就了一个递归调用。“递归”（recursive）一词意味着“再次出现”或“重复”。在这种情况下，函数调用被自身重复执行。这种递归有时被称为直接递归，因为函数直接调用自身。间接递归发生在函数\
  \ A 调用函数 B，而函数 B 调用函数 A；函数调用链可能更长，但如果它最终回到函数 A，那么就涉及间接递归。\n\n### 7.2 递归的经典示例\n\n\
  [/content]\n\n\n\n数学家通常根据生成这些概念的过程来定义概念。例如，`n!`（读作“n 的阶乘”）被用于计算 `n` 个元素的排列数。关于 `n!`\
  \ 的一种数学描述如下：\n\n![](img/f0437-01.gif)\n\n考虑 `4!` 的情况。由于 `n > 0`，我们使用定义定义的后半部分：\n\
  \n> `4! = 4 * 3 * 2 * 1 = 24`\n\n这种对 `n!` 的描述为每个 `n` 的值提供了一个不同的定义，因为三个点代表了中间因子。也就是说，`2!`\
  \ 的定义是 `2 * 1`，`3!` 的定义是 `3 * 2 * 1`，依此类推。\n\n我们也可以用适用于任何非负 `n` 值的单一定义来表示 `n!`：\n\
  \n![](img/f0437-02.gif)\n\n这个定义是一个递归定义，因为我们用阶乘函数本身来表示该函数。\n\n让我们直观地考虑 `4!` 的递归计算。因为\
  \ `4` 不等于 `0`，我们使用定义的后半部分：\n\n> `4! = 4 * (4 – 1)! = 4 * 3!`\n\n当然，我们还不能进行乘法运算，因为我们不知道\
  \ `3!` 的值。所以我们拨通了好朋友 Sue Ann，她拥有数学博士学位，让她来找到 `3!` 的值。\n\n![](img/f0438-01.jpg)\n\
  \nSue Ann 拥有与我们计算阶乘函数相同的公式，所以她知道：\n\n> `3! = 3 * (3 — 1)! = 3 * 2!`\n\n然而，她不知道 `2!`\
  \ 的值，所以她让我们等一下，然后打给了她的朋友 Max，他拥有数学硕士学位。\n\n![](img/f0438-02.jpg)\n\nMax 和 Sue Ann\
  \ 有相同的公式，所以他很快计算出：\n\n> `2! = 2 * (2 — 1)! = 2 * 1!`\n\n但 Max 无法完成乘法，因为他不知道 `1!`\
  \ 的值。他让 Sue Ann 等一下，然后打给了他的母亲，他的母亲拥有数学教育学士学位。\n\n![](img/f0439-01.jpg)\n\nMax 的母亲和\
  \ Max 有相同的公式，所以她很快算出了：\n\n> `1! = 1 * (1 — 1)! = 1 * 0!`\n\n当然，她无法执行乘法运算，因为她没有 `0!`\
  \ 的值。于是妈妈让 Max 等一下，然后打给了她的同事 Bernie，他拥有英语文学学士学位。\n\n![](img/f0439-02.jpg)\n\nBernie\
  \ 不需要任何数学知识就能看出 `0! = 1`，因为他可以在公式的第一个从句读到这个信息（`n! = 1, if n = 0`）。他立即向 Max 的母亲报告了答案。她现在可以完成她的计算了：\n\
  \n> `1! = 1 * 0! = 1 * 1 = 1`\n\n她将结果反馈给了 Max，Max 现在在他的公式中进行乘法运算并得知：\n\n> `2! =\
  \ 2 * 1! = 2 * 1 = 2`\n\n他将其反馈给了 Sue Ann，Sue Ann 现在可以完成她的计算了：\n\n![](img/f0440-01.jpg)\n\
  \n`3! = 3 * 2! = 3 * 2 = 6`\n\nSue Ann 带着这个令人兴奋的消息打给了你。你现在可以完成你的计算了：\n\n`4! = 4\
  \ * 3! = 4 * 6 = 24`\n\n注意，当我们到达一个无需借助递归定义就能知道答案的情况时，递归调用就会停止。在这个例子中，Bernie 直接从定义中知道\
  \ `0! = 1`，而不需要递归。这种显式已知答案的情况被称为基准情况。这种用其自身的较小版本来表示解决方案的情况被称为递归情况或通用情况。递归算法 通过对它自身的调用来表示解决方案——即递归调用。递归算法必须终止；也就是说，它必须有一个基准情况。\n\
  \n### 7.3 递归编程\n\n当然，递归的使用不仅限于拥有电话的数学家。支持递归的计算机语言（如 C++）为程序员提供了一个强大的工具，通过降低复杂性或隐藏问题的细节来解决某些类型的问题。\n\
  \n在本章中，我们将考虑几个简单问题的递归解决方案。在最初的讨论中，你可能会疑惑，为什么递归解决方案会比迭代（非递归）解决方案更好，因为迭代解决方案似乎更简单、更高效。别担心。正如你后面将看到的，在某些情况下，使用递归会产生一个简单得多且更优雅的程序。\n\
  \n#### 编写阶乘函数\n\n如之前提到的，递归函数是调用自身的函数。在上一节中，Sue Ann、Max、Max 的母亲以及 Bernie 都有求解阶乘函数的相同公式。当我们构建一个求解该问题的递归\
  \ C++ 函数 `Factorial` 时，我们用阶乘函数本身表示它：\n\n```\nint Factorial(int number) {\n  if (number\
  \ == 0) {\n    return 1;\n  } else {\n    return number * Factorial(number - 1);\n\
  \  }\n}\n```\n\n注意，当我们到达一个无需借助递归定义就能知道答案的情况时，递归调用就会停止。在这个例子中，Bernie 直接从定义中知道 `0!\
  \ = 1`，而不需要递归。这种显式已知答案的情况被称为基准情况。这种用其自身的较小版本来表示解决方案的情况被称为递归情况或通用情况。递归算法 通过对它自身的调用来表示解决方案——即递归调用。递归算法必须终止；也就是说，它必须有一个基准情况。\n\
  \n为了对比，让我们并排查看递归和迭代解决方案：\n\n```cpp\nint Factorial(int number) {\n  int fact = 1;\n\
  \  for (int count = 2; count <= number; count++) {\n    fact = fact * count;\n \
  \ }\n  return fact;\n}\n```\n\n正如前面所的，这两个 `Factorial` 版本展示了递归函数和迭代函数之间的一些区别。首先，迭代算法使用循环结构（如\
  \ for 循环或 while 或 do . . while 循环）来控制执行。相比之下，递归解决方案使用分支结构（if 或 switch 语句）。迭代版本需要几个局部变量，而递归版本使用函数的参数来提供所有信息。有时，正如我们稍后在讨论中看到的，递归解决方案比相应的迭代解决方案需要更多的参数。迭代解决方案中的数据值通常在程序内部、循环上方初始化。递归解决方案中的类似数据值通常在初始调用程序时通过选择参数值来初始化。\n\
  \n\n\n\n\n让我们总结一下递归解决方案的词汇。递归定义是指根据自身更小的版本来定义某个对象的定义。阶乘函数的定义显然符合这一描述。递归调用是在函数内部对该函数本身进行的调用。`Factorial`\
  \ 函数中的第 3 行就是递归调用的一个示例。\n\n在递归算法中，至少有一个情况的答案是已知的；该解决方案不是用其自身更小的版本来描述的。在阶乘的情况下，如果数字为\
  \ `0`，答案是已知的。答案已知的这种情况称为基例（base case）。以递归方式描述的情况称为一般情况或递归情况。\n\n### 7.4 验证递归函数\n\
  \n我们在上一节中完成的这种检查递归函数有效性的推演方法是耗费时的、枯燥且往往令人困惑的。此外，模拟 `Factorial(4)` 的执行只能告诉我们函数在 `number`\
  \ = 4 时可以工作，但它不能告诉我们该函数对于 `number` 的所有非负值都有效。如果有一种技术能帮助我们归纳地判断递归算法是否有效，将非常有用。\n\n\
  #### 三问法\n\n我们使用称为“三问法”的技术来验证递归函数。要确认递归解决方案是有效的，你必须能够对以下三个问题都回答“是”：\n\n1.  基例问题：函数是否存在一种非递归的退出方式？该程序对于这个基例是否能正常工作？\n\
  2.  更小调用者问题：对函数的每次递归调用是否涉及原始问题的更小情况，并不可避免地导向基例？\n3.  一般情况问题：假设递归调用工作正常，整个函数是否也能够正常工作？\n\
  \n让我们将这三个问题应用到 `Factorial` 函数。（我们这里使用数学符号 `N` 而不是变量 `number`。）\n\n1.  基例问题：基例发生在\
  \ `N = 0` 时。此时 `Factorial` 被赋值为 `1`，这是 `0!` 的正确值，并且不再对 `Factorial` 产生进一步的（递归）调用。答案是“是”。\n\
  2.  更小调用者问题：为了回答这个问题，我们必须查看递归调用传递的参数。在 `Factorial` 函数中，递归调用传递了 `N – 1`。随后的每次递归调用都会发送参数递减值，直到最后发送的值为\
  \ `0`。此时，正如我们通过基例问题验证的那样，我们已经达到了最小情况，且不再产生递归调用。答案是“是”。\n3.  一般情况问题：对于像 `Factorial`\
  \ 这样的函数，我们需要验证我们正在使用的公式实际上得出了正确解。假设递归调用 `Factorial(N – 1)` 给了我们正确的 `(n – 1)!` 值，`return`\
  \ 语句计算 `N * (N – 1)!`。这是阶乘的定义，因此我们知道函数对于所有正整数都是有效的。在回答第一个问题时，我们已经确定了函数在 `N = 0`\
  \ 时是有效的。（该函数仅定义于负整数。）因此，答案是“是”。\n\n如果你熟悉归纳法证明，你应该能识别出我们所做的。在假设函数对于某个基例 `(n – 1)`\
  \ 有效的情况下，我们现在可以证明，将函数应用于下一个值 `(n – 1) + 1` 或 `n`，将得到计算 `n!` 的正确公式。\n\n### 7.5 编写递归函数\n\
  \n用于验证递归函数的问题也可以作为编写递归函数的指导。你可以使用以下方法来编写任何递归程序：\n\n1.  获取要解决问题的确切定义。（当然，这是解决任何编程问题的第一步。）\n\
  2.  确定在本次函数调用中要解决的问题规模。在对函数的初始调用中，整个问题的规模通过参数的值表示。\n3.  识别并解决基例，即问题可以用非递归方式表示的情况。这确保了基例问题的答案为“是”。\n\
  4.  根据相同问题的更小情况——即递归调用——正确地识别并解决一般情况。这确保了“更小调用者问题”和“一般情况问题”的答案为“是”。\n\n在 `Factorial`的情况下，问题的定义总结在阶乘函数的定义中。问题的规模是要相数的个数：`N`。基例发生在\
  \ `N = 0` 时，此时我们采取非递归路径。最后，一般情况发生在 `N > 0` 时，导致对 `Factorial` 进行更小情况的递归调用：`Factorial(N\
  \ – 1)`。\n\n#### 编写布尔函数\n\n让我们这种方法应用于编写布尔函数 `ValueInList`，该函数在整数列表中搜索一个值，并返回 `true`\
  \ 或 `false` 以表示是否找到该值。列表声明如下，并作为参数传递给 `ValueInList`：\n\n```\nstruct ListType\n{\n\
  \  int length;\n  int info[MAX_ITEMS];\n};\n\nListType list;\n```\n\n该问题的递归解决方案如下：\n\
  \n> 返回（值是否在第一个位置？）或（值是否在列表的其余部分？）\n\n我们只需要通过将值与 `list.info[0]` 比较就可以回答第一个问题。但我们如何知道该值是否在列表的其余部分中？如果我们有一个函数可以搜索列表的其余部分就好了。但我们确实有这样一个函数。`ValueInList`\
  \ 函数搜索一个值。我们只需要从零位置开始搜索。因此，为了搜索整个列表，我们将调用函数\n\n```\nif (ValueInList(list, value,\
  \ 0))\n```\n\n算法的一般情况是列表的其余部分。这涉及到对 `ValueInList` 的递归调用，指定较小的数组部分：\n\n```\nreturn\
  \ ValueInList(list, value, startIndex+1);\n```\n\n通过使用 `startIndex + 1` 作为参数，我们有效地缩小了要解决的问题规模。也就是说，从\
  \ `startIndex + 1` 到 `list.length - 1` 的搜索比从 `startIndex` 到 `list.length - 1` 的搜索任务要小。图\
  \ 7.1 显示了 `ValueInList` 函数在执行中的状态。\n\n![](img/f07-01.jpg)\n\n图 7.1 执行中的 ValueInList\
  \ 函数\n\n最后，我们需要知道何时停止搜索。这个问题涉及两个基例：（1）找到了值（返回 `true`），以及（2）到达了列表末尾但未找到值（返回 `false`）。在任何情况下，我们都可以停止对\
  \ `ValueInList` 的递归调用。\n\n让我们总结一下目前为止讨论的内容，然后编写 `ValueInList` 函数：\n\n`ValueInList`\
  \ 函数的代码如下：\n\n```\nbool ValueInList(ListType list, int value, int startIndex)\n\
  {\n  if (list.info[startIndex] == value)\n    return true; // 基例 1\n  else if (startIndex\
  \ == list.length-1)\n    return false; // 基例 2\n  else return ValueInList(list,\
  \ value, startIndex+1);\n}\n```\n\n`startIndex` 参数充当数组的索引；它在 `ValueInList` 的原始调用中初始化，并在每次递归调用中递增。等效的迭代解决方案将使用局部计数器，该计数器在函数内部循环上方初始化并在循环内部递增。\n\
  \n让我们使用三问法来验证这个函数：\n\n\n\n\n\n1. 基础情况问题：一种基础情况发生在此调用找到值且函数退出，且不再对自身的进一步调用时。第二种基础情况发生在我们到达列表末尾但未找到该值，且函数退出且不再进一步的递归调用时。答案是肯定的。\n\
  \n2. 较小调用者问题：在通用情况下，递归调用增加了 `StartIndex` 的值，使得待搜索的列表部分变小。答案是肯定的。\n\n3. 通用情况问题：假设通用情况下的递归调用正确地告诉我们该值是否存在于列表中第二个到最后一个元素中。那么，如果该值存在于第一个元素中，基础情况\
  \ 1 将给出正确的答案（`true`）；如果该值不在第一个元素中且第一个元素是列表中唯一的元素，基础情况 2 将给出正确的答案（`false`）。唯一的另一种可能性是该值存在于列表的其他某处。假设通用情况工作正常，那么整个函数就能工作，因此这个问题的答案也是肯定的。\n\
  \n### 7.6 使用递归简化解决方案\n\n到目前为止，我们看了一些示例，这些示例可以同样容易（或更容易）地写成迭代程序。在章节末尾，我们将更多地讨论在迭代和递归解决方案之间进行选择。然而，对于许多问题，使用递归可以简化解决方案。\n\
  \n这里考虑第一个问题是一个函数 `Combinations`，它告诉我们从一组元素中可以组成多少种特定大小的组合。例如，如果有 20 本不同的书分给 4 个学生，我们可以很容易看到——为了公平——我们应该给每个学生\
  \ 5 本书。但从 20 本书中可以组合出多少种 5 本书的组合呢？\n\n可以使用数学公式来解决这个问题。假设 `C` 是组合的总数，`group` 是从中选取组的总大小，`members`\
  \ 是每个子组的大小，且 `group >= members`：\n\n![](img/f0447-01.jpg)\n\n由于 `C` 的这个定义是递归的，很容易看出如何使用递归函数来解决这个问题。\n\
  \n让我们总结一下这个问题。\n\n生成的递归函数 `Combinations` 列在下方：\n\n```cpp\nint Combinations(int group,\
  \ int members)\n\n// Pre: group 和 members 是正数。\n\n// Post: 函数值 = 从总组大小中可以构建的\n//\
  \           members 大小的组合数量。\n\n{\n  if (members == 1)\n    return group;      \
  \        // Base case 1\n  else if (members == group)\n    return 1;           \
  \       // Base case 2\n  else\n    return (Combinations(group-1, members-1) +\n\
  \            Combinations(group-1, members));\n}\n```\n\n图 7.2 显示了该函数的处理过程，用于计算从\
  \ 4 个元素的集中可以组成 3 个元素的组合数。\n\n回到我们原始的问题，我们现在可以通过语句找到从原始 20 本书中可以组成多少种 5 本书的组合：\n\n\
  ```cpp\nstd::cout << \"Number of combinations = \" << Combinations(20, 5)\n    \
  \      << std::endl;\n```\n\n为具有递归定义特征的问题（如 `Combinations` 或 `Factorial`）编写递归解决方案是相当直接的。\n\
  \n### 7.7 递归链表处理\n\n让我们接下来来看另一种类型的问题——一个打印动态分配链表元素的函数。该列表使用以下声明实现。在这个示例中，`ListType`\
  \ 是一个类而不是类模板。`NodeType` 是一个结构体而不是结构体模板，类型为 `NodeType` 的成员 `info` 类型为 `int`：\n\n\
  ![](img/f07-02.jpg)\n\n图 7.2 计算 `Combinations(4,3)`\n\n```cpp\nstruct NodeType;\n\
  \nclass ListType\n{\npublic:\n  // 成员函数的原型\n\nprivate:\n  NodeType* listData;\n\
  };\n```\n\n到这里，你可能在反对说这项任务通过迭代完成是如此简单（`while (ptr != NULL)`），以至于用递归编写它没有任何意义。那么，让我们让任务变得更有趣：倒序打印列表中的元素。这个问题用递归解决要容易得多，也更优雅得多。\n\
  \n要执行的任务是什么？算法如下所示并在图 7.3 中进行了插图。\n\n![](img/f07-03.jpg)\n\n图 7.3 递归 RevPrint\n\n\
  任务的第二部分很简单。如果 `listPtr` 指向列表中的第一个节点，我们可以通过语句 `cout << listPtr->info` 打印它的内容。任务的第一部分——倒序打印列表中所有其他节点——也是简单的，因为我们有一个倒序打印列表的程序：我们只需要递归地调用函数\
  \ `RevPrint`。当然地，我们必须稍微调整参数，变为 `RevPrint(listPtr->next)`。这个调用意思是“倒序打印由 `listPtr->next`\
  \ 指向的链表”。这项任务反过来通过两个步骤递归完成：\n\n当然，这项任务的第一部分是通过递归完成的。它会在哪里结束呢？我们需要一个基础情况。当我们完成一个列表时，可以停止调用\
  \ `RevPrint`。让我们总结这个问题：\n\n```cpp\nvoid RevPrint(NodeType* listPtr)\n{\n  if (listPtr\
  \ != NULL)\n  {\n    RevPrint(listPtr->next);\n    std::cout << listPtr->info <<\
  \ std::endl;\n  }\n}\n```\n\n对于我们的 `ListType` 类，我们可以把 `RevPrint` 为公共成员函数吗？答案是否定的，原因如下：为了打印整个列表，客户端的\
  \ `RevPrint` 调用必须传递第一个节点作为参数。在 `ListType` 类中，该指针是私有成员，因此以下客户端代码是不允许的：\n\n```cpp\n\
  list.RevPrint(list.listData); // 不允许；listData 是私有的\n```\n\n因此，我们将 `RevPrint` 作为辅助非成员函数，并定义一个成员函数（例如\
  \ `PrintReversed`）来调用 `RevPrint`：\n\n```cpp\nvoid PrintReversed(); // ListType 类中的原型\n\
  \n  .\n  .\n  .\n\nvoid ListType::PrintReversed()\n{\n  RevPrint(listData);\n}\n\
  ```\n\n给定这种设计，客户端可以通过以下函数调用打印整个列表：\n\n```cpp\nlist.PrintReversed();\n```\n\n让我们使用三问题法验证\
  \ `RevPrint`：\n\n1. 基础情况问题：基础式的。当 `listPtr` 等于 `NULL` 时，我们返回到最后一个递归调用之后的语句，且不再进行进一步的递归调用。答案是肯定的。\n\
  2. 较小调用者问题：递归调用传递了 `listPtr->next` 指向的列表，它比 `listPtr` 指向的列表少一个节点。答案是肯定的。\n3. 通用情况问题：假设\
  \ `RevPrint(listPtr->next)` 正确地倒序打印了列表的其余部分；此调用后紧跟打印第一个元素值的语句，就给了我们整个列表的倒序打印结果。答案是肯定的。\n\
  \n你会如何修改 `RevPrint` 函数（除了更改其名称外），使其能够正序而非倒序打印列表？我们将此修改留作练习。\n\n### 7.8 二分查找的递归版本\n\
  \n在排序列表章节（第 4 章）中，我们为我们的排序列表 ADT 中的成员函数 `RetrieveItem` 开发了一个二分查找算法。让我们回顾一下算法：\n\n\
  \n\n\n虽然我们在第 4 章中编写的函数是迭代的，但它实际上是一个递归算法。该解决方案被表示为原始问题的更小版本：如果在中间位置没有找到答案，则执行 `BinarySearch`（递归调用）来搜索列表的适当半部分（一个较小的问题）。让我们用一个\
  \ `Boolean` 函数来总结这个问题，该函数简单地返回 true 或 false，以指示是否找到了所需的项。我们假设它不是 `ListType` 类的公共成员函数，而是该类的一个辅助函数，并接收数组\
  \ `info` 作为参数：\n\n该函数的递归版本如下。由于 `switch` 语句的每个分支只包含一条语句，因此我们使用了关系运算符。请注意，我们必须将 `fromLocation`\
  \ 和 `toLocation` 改为函数的参数，而不是局部索引变量。对函数的初始调用形式为 `BinarySearch(info, item, 0, length\
  \ - 1)`。\n\n```\ntemplate<class ItemType>\n\nbool BinarySearch(ItemType info[],\
  \ ItemType item,\n\n                  int fromLocation, int toLocation)\n\n{\n\n\
  \  if (fromLocation > toLocation)   // Base case 1\n\n    return false;\n\n  else\n\
  \  {\n\n    int midPoint;\n\n    midPoint = (fromLocation + toLocation) / 2;\n\n\
  \    if (item < info[midPoint])\n      return BinarySearch(info, item, fromLocation,\
  \ midPoint - 1);\n\n    else if (item == info[midPoint])\n      return true;\n\n\
  \    else                           // Base case 2\n      return BinarySearch(info,\
  \ item, midPoint + 1, toLocation);\n\n  }\n\n}\n```\n\n### 7.9 `PutItem` 和 `DeleteItem`\
  \ 的递归版本\n\n#### 函数 `PutItem`\n\n在排序列表的链式实现中插入项需要两个指针：一个指向正在检查的节点，另一个指向该节点的前一个节点。我们需要这个后继指针，因为当我们发现要插入节点的位置时，已经越过了需要修改的节点。递归版本实际上更简单，因为我们让递归过程处理后继指针。我们在这里开发该算法；在下一节中，我们将演示它为什么有效。\n\
  \n让我们从一个项的类型为 `int` 的示例开始：\n\n![](img/f0454-01.jpg)\n\n如果我们插入 11，首先将 11 与列表第一个节点的值\
  \ 7 进行比较。数字 11 大于 7，因此我们在第一个节点的 `next` 成员所指的列表中查找插入点。这个新列表比原始列表少一个节点。我们将 11 与该列表第一个第一个节点的值\
  \ 9 进行比较。因为 11 大于 9，所以我们在该列表第一个节点的 `next` 成员所指的列表中查找插入点。这个新列表比当前列表少一个节点。我们将 11 与该新列表第一个节点的值\
  \ 13 进行比较。数字 11 小于 13，因此我们找到了插入点。我们在正在检查的列表的第一个节点处插入一个取值为 11 的新节点。\n\n如果我们要插入的值大于列表最后一个节点的值会怎样？在这种情况下，列表为空，我们将该值插入到空列表中。`Insert`\
  \ 并不是 `ListType` 的成员函数；它是一个由 `PutItem` 调用的辅助函数，并以列表指针作为参数。我们将其定义为模板函数：\n\n该函数的代码在这里。请注意，指向列表的指针是一个引用参数；也就是说，函数接收的是指向当前节点指针的实际地址，而不仅仅是指针的拷贝。我们将在接下来的章节中说明为什么必须这样。\n\
  \n```\ntemplate<class ItemType>\n\nvoid Insert(NodeType<ItemType>*& listPtr, ItemType\
  \ item)\n\n{\n\n  if (listPtr == NULL || item < listPtr->info)\n  {\n\n    // 保存当前指针。\n\
  \    NodeType<ItemType>* tempPtr = listPtr;\n\n    // 获取新节点。\n    listPtr = new\
  \ NodeType<ItemType>;\n\n    listPtr->info = item;\n\n    listPtr->next = tempPtr;\n\
  \  }\n  else Insert(listPtr->next, item);\n\n}\n```\n\n#### 函数 `DeleteItem`\n\n\
  `Delete` 函数是 `Insert` 函数的镜像。在迭代版本中，只有在通过包含指向它的指针的节点之后我们才能找到要删除的节点。我们在递归的 `Insert`\
  \ 中通过传递列表指针的地址解决了这个问题。同样的方法适用于删除操作吗？让我们从同一个列表中删除 13。\n\n![](img/f0455-01.jpg)\n\n\
  该操作的前置条件是该项在列表中，因此我们将 13 与列表中第一个节点的值 7 进行比较。它们不相等，所以我们在这个较小列表第一个节点的 `next` 成员所指的列表中查找\
  \ 13。我们将 13 与 9 比较；它们不相等，所以我们在第一个节点的 `next` 成员所指的列表中查找 13。我们将 13 与该列表第一个节点的值比较，它们是相等的。我们保存包含\
  \ 13 的节点指针（以便释放该节点）。\n\n```\ntemplate<class ItemType>\n\nvoid Delete(NodeType<ItemType>*&\
  \ listPtr, ItemType item)\n\n{\n\n  if (item == listPtr->info)\n  {\n    NodeType<ItemType>*\
  \ tempPtr = listPtr;\n\n    listPtr = listPtr->next;\n\n    delete tempPtr;\n  }\n\
  \  else Delete(listPtr->next, item)\n\n}\n```\n\n### 7.10 递归原理\n\n为了理解递归如何工作以及为什么某些语言允许而某些语言不允许，我们需要观察语言如何将内存与变量关联。内存与变量名的关联称为绑定（binding）。在编译/执行周期中发生绑定的时间称为绑定时间（binding\
  \ time）。我们要强调的是，绑定时间指的是一个时间点，而不是绑定变量所需的时间。\n\n静态存储分配在编译时将变量名与内存位置关联；动态存储分配在执行时进行关联。当我们观察静态和动态存储分配的工作方式时，请考虑以下问题：函数的参数何时绑定到特定地址？这个答案将告诉我们语言是否支持递归。\n\
  \n#### 静态存储分配\n\n在翻译程序时，编译器创建一个符号表。当声明变量时，它会被输入符号表，并分配一个内存位置——地址。作为一个示例，让我们看看编译器如何翻译以下全局声明：\n\
  \n```\nint girlCount, boyCount, totalKids;\n```\n\n为了简化讨论，我们假设整数只占用一个内存位置。这条语句会在符号表中产生三个条目。（使用的地址是任意的。）\n\
  \n| 符号 | 地址 |\n| :--- | :--- |\n| `girlCount` | `0000` |\n| `boyCount` | `0001`\
  \ |\n| `totalKids` | `0002` |\n\n也就是说，在编译时：\n\n*   `girlCount` 绑定到地址 `0000`。\n*\
  \   `boyCount` 绑定到地址 `0001`。\n*   `totalKids` 绑定到地址 `0002`。\n\n每当程序稍后使用变量时，编译器都会搜索符号表查找其实际地址并用该地址替换变量名。毕竟，有意义的变量名是为了人类用户的方便；而地址对计算机来说是有意义的。例如，赋值语句\n\
  \n```\ntotalKids = girlCount + boyCount;\n```\n\n被翻译成执行以下操作的机器指令：\n\n*   获取存储地址\
  \ `0000` 中的值。\n*   获取存储地址 `0001` 中的值。\n*   将两个值之和放在地址 `0002` 中。\n\n\n\n\n目标代码本身被存储在内存的另一个部分。假设翻译后的指令从地址\
  \ `1000` 开始。在执行开始时，控制权转移到地址 `1000`。执行存储在该地址的指令，然后执行地址 `1001` 处的指令，依此类推。\n\n函数的参数存储在何处？在静态存储分配中，函数的形式参数被认为存在于特定位置；例如，编译器可能会为每个函数的代码之前的空间留出用于存放参数值空间。考虑一个具有两个\
  \ `int` 参数 `girlCount` 和 `boyCount` 以及一个局部变量 `totalKids` 的函数。假设该函数的代码从名为 `CountKids`\
  \ 的地址开始。编译器在 `CountKids – 1`、`CountKids – 2` 和 `CountKids – 3` 处分别为两个形式参数和局部变量留出空间。给定函数定义：\n\
  \n```\nvoid CountKids(int girlCount, int boyCount)\n{\n  int totalKids;\n  .\n \
  \ .\n}\n```\n\n函数体中的语句\n\n```\ntotalKids = girlCount + boyCount;\n```\n\n将生成以下操作：\n\
  \n* 获取地址 `CountKids – 1` 的内容。\n* 将其与地址 `CountKids – 2` 的内容相加。\n* 将结果存储在地址 `CountKids\
  \ – 3` 中。\n\n图 7.4 显示三个函数的程序如何在内存中安排。这种讨论经过了某种简化，因为编译器实际上不仅为参数和局部变量留出空间，还为返回地址（函数执行完成后调用代码中要处理的下一条指令的位置）以及计算机当前的寄存器值留出空间。然而，它指出了核心点：函数的的形式参数和局部变量在编译时就绑定到了内存中的实际地址。\n\
  \n我们可以将静态分配方案与讲座厅中安排座席的一种方式进行比较。该活动发放了有限数量的邀请函，所需的精确椅子数量在讲座之前就已经设定。每个受邀客人都有预留座位。然而，如果有人带了朋友来，受邀的朋友就没有地方坐。\n\
  \n![](img/f07-04.jpg)\n\n图 7.4 带有三个函数的程序的空间静态分配\n\n在程序执行之前将变量名绑定到内存位置意味着什么？每个参数和局部变量在编译时仅分配了一个单一的位置。（它们就像留有座位的受邀客人。）如果每次函数调用都是一个独立事件，那么就不会出现问题。但在递归的情况下，每次递归调用都依赖于上一次调用中值的状态。递归调用生成的多个版本的参数和局部变量的存储在何处？因为必须保留参数和局部变量的中间值，递归调用无法在编译时设置的固定数量位置上存储其参数（实际参数）。上一次递归调的值将被覆盖并丢失。因此，只使用静态存储分配的语言无法支持递归。\n\
  \n#### 动态存储分配\n\n这里描述的情况也类似于一班级必须共享一份练习簿的学生。乔在练习簿提供的空间内写下练习答案，然后玛丽擦掉他的答案并在同一空间写下自己的答案。这个过程一直持续，直到班上的每个学生都在练习簿上写下了自己的答案，从而抹去了之前所有的答案。显然，这种情况是不切实际的。真正需要的是每个学生从这份唯一的练习簿中阅读，然后在单独的纸上写下自己的答案。在计算机术语中，函数的每次调用都需要自己的工作空间。动态存储分配提供了这种解决方案。\n\
  \n通过动态存储分配，变量名在运行时不会绑定到内存中的实际地址。编译器不是通过变量的实际地址引用变量，而是通过相对地址引用。我们特别感兴趣的是，编译器对函数的参数和局部变量是相对于运行时已知的某个地址进行引用的，而不是相对于函数代码的位置。\n\
  \n让我们看看这种情况在 C++ 中可能如何运作的的简化版本。（实际实现取决于特定的机器和编译器。）当函数被调用时，它需要空间来保存其形式参数、局部变量和返回地址（函数完成执行后计算机返回的调用代码中的地址）。就像共享一份练习簿的学生一样，函数的每次调用都需要它自己的工作空间。这个工作空间被称为激活记录或栈帧。函数\
  \ `Factorial` 激活记录的简化版本可能包含以下“声明”：\n\n```\nstruct ActivationRecordType\n{\n  AddressType\
  \ returnAddr;    // 返回地址\n  int result;                // 返回值\n  int number;   \
  \             // 形式参数\n  .\n  .\n  .\n};\n```\n\n每次对函数的调用（包括递归调用）都会生成一个新的激活记录。在函数内部，对参数和局部变量的引用使用激活记录中的值。当函数结束时，激活记录会被释放。这是如何实现的？你的源代码不需要分配和释放激活记录；相反，编译器会在每个函数的开头添加“序言”（prologue），并在每个函数的结尾添加一个“结语”（epilogue）。表\
  \ 7.2 将 `Factorial` 的源代码与运行时执行的简化“代码”进行了比较。（当然，运行时执行的是目标代码，但我们列出源代码以便读者理解。）\n\n\
  | 你的源代码说 | 运行时执行 |\n| --- | --- |\n| ```cpp\nint Factorial(int number)\n{\n``` |\
  \ ```cpp\n// 函数序言\nactRec = new ActivationRecordType;\nactRec->returnAddr = retAddr;\n\
  actRec->number = number;\n\n// actRec->result 未定义\n``` |\n| ```cpp\nif (number ==\
  \ 0)\n  return 1;\nelse\n  return number *\n    Factorial(number - 1);\n\n}\n```\
  \ | ```cpp\nif (actRec->number == 0)\n  actRec->result = 1;\nelse\n  actRec->result\
  \ =\n    actRec->number *\n    Factorial(actRec->number-1);\n\n// 函数结语\nreturnValue\
  \ = actRec->result;\nretAddr = actRec->returnAddr;\ndelete actRec;\n\nJump (goto)\
  \ retAddr;\n``` |\n\n表 7.2 `Factorial` 的运行时版本（简化）\n\n\n\n\n当 `Proc2` 执行完毕时，它的激活记录会被释放。但另外两个激活记录中的哪一个将变为激活状态——是\
  \ `Proc1` 的还是 `main` 的？当然，现在应该是 `Proc1` 的激活记录处于激活状态。激活顺序遵循后进先出（LIFO）规则。我们知道一种支持\
  \ LIFO 访问的结构——栈——因此，在运行时跟踪激活记录的结构被称为运行时栈（run-time stack](#bm01.xhtml_gloss123)），这并不令人意外。\n\
  \n当一个函数被调用时，它的激活记录会被推入运行时栈中。函数调用的每一个嵌套层都会向栈中添加另一个激活记录。当每个函数完成其执行时，它的激活记录会从栈中弹出。递归函数调用与任何其他函数调用一样，都会生成一个新的激活记录。程序中递归调用的深度决定了在任何特定时刻该函数的多少激活记录被推入运行时栈。\n\
  \n使用动态分配可以类比为在安排好讲座的阶堂里分配座位的另一种方式。发放了有限数量的邀请函，但要求每位客人都自带椅子。此外，每位客人都可以邀请无限数量的朋友，只要他们都自带椅子即可。当然，如果额外客人的数量超出控制，阶梯堂的空间就会耗尽，可能没有足够的空间容纳更多朋友或椅子了。同样，程序中的递归深度最终受到运行时栈可用内存数量的限制。\n\
  \n让我们再次遍历 `Factorial` 函数，看看它的执行如何影响运行时栈。以下是该函数：\n\n```c\nint Factorial(int number)\n\
  {\n  if (number == 0)\n    return 1;\n  else\n    return number * Factorial(number\
  \ - 1);\n}\n```\n\n假设 `main` 函数从内存位置 5000 开始加载到内存中，且 `Factorial` 的初始调用是在内存位置 5200\
  \ 处的语句中进行的。同样假设 `Factorial` 函数加载在内存位置 1000 处，递归调用是在位置 1010 处的语句中进行的。图 7.5 显示了示例程序加载到内存中的简化版本。（位置编号是随机选择的，以便我们在激活记录的返回地址字段中显示实际数字。）\n\
