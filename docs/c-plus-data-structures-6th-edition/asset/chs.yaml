  \ 错误。堆可以是满二叉树。\n\n\n\n\n\n© Repina Valeriya/Shutterstock\n\n在第 8 章中，我们探索了二叉搜索树 ADT\
  \ 的实现，以及它的搜索操作（`FindNode`）如何可能达到与排序列表应用二分查找相同的 `O(log[2]N)` 搜索效率。要注意，二叉搜索树必须保持平衡才能达到这种性能表现。\n\
  \n我们假设二叉搜索树中的项是随机顺序插入的。在实践中，这通常会导致产生短且“茂密”的树，从而最小化到根节点的距离，这便有助于减少比较次数并最大程度地提高效率。然而，我们可以通过按顺序插入元素来轻松达到最坏情况，导致产生退化树，这种树本质上是一个链表，其搜索性能为\
  \ `O(N)`。通常情况下，从二叉搜索树中添加和删除节点不能保证树保持平衡，并可能导致树不再高效。\n\n在本章中，我们探索二叉搜索树 ADT 的扩展，使其在节点插入时能够实现自平衡。这意味着，修改二叉搜索树的操作将执行一些额外的工作来维持平衡，从而保留预期的性能特性。\n\
  \n### 10.1 AVL 树\n\n回想一下，如果二叉搜索树 `T` 的左子树节点数与右子树节点数之差不超过 1，则该树是平衡的。这种差异通常被称为树的平衡因子。取决于元素插入二叉搜索树的方式，某些树是平衡的，而另一些不是。正如我们在第\
  \ 9 章中实现堆时看到的，二叉搜索树中的节点可以重新排列以产生平衡的二叉搜索。遗憾的是，对于频繁变化的树，尚不清楚应该多久进行一次重平衡。如果我们频繁地重平衡树，可能会对已经基本平衡的树造成工作浪费。\n\
  \n你可能会想是否有一种方法可以轻松检测在插入或删除元素时树是否变得不平衡。如果是，那么可能存在一种高效的重平衡操作，我们可以在插入或删除上下文中使用。在插入和删除操作的背景下重平衡树的概念最早由两位苏联数学家\
  \ Georgii Adelson-Velskii 和 Evgenii Landis 于 1962 年提出，并以其发明者命名的自平衡二叉搜索树称为 AVL 树。\n\
  \nAVL 树在查找、插入和删除节点的平均和最坏情况下的时间复杂度均为 `O(log[2]N)`。为了维持这种效率，AVL 树必须在任何可能导致不平衡形状的操作后进行重平衡。\n\
  \n由于插入和删除操作通过添加和删除节点破坏二叉搜索树的平衡，因此 AVL 树实现对这些操作进行了扩展，在树发生任何变化时进行重平衡。特别是，在执行常规插入或删除后，会应用一个或多个称为“树旋转”的操作，如果任何节点的两个子树的高度差超过\
  \ 1，则恢复平衡。在这种情况下，该树就不再是 AVL 树。\n\n如果树不平衡，我们必须考虑四种旋转情况来修复 AVL 树。前两种情况涉及向左或向右“旋转”节点。这种旋转操作简单意味着我们让一个子节点成为其当前父节点的节点。旋转的方向取决于树的结构。在某些情况下，单次左旋或右旋不足以纠正不平衡。幸运的是，只有两个需要两次旋转操作的额外情况需要考虑。树的结构和插入（或删除）节点的位置将告诉我们是否需要先执行左旋后右旋，或先执行右旋后左旋。接下来我们将总结每种情况，以指导你完成我们关于何时以及如何应用它们的详细讨论。\n\
  \nAVL 树中不平衡节点 `T` 的不平衡可以通过以下方式解决：\n\n1. 如果节点插入到节点 `T` 的左孩子 `S` 的左子树中，则应用右旋。\n2.\
  \ 如果节点插入到 `T` 的右孩子 `S` 的右子树中，则应用左旋。\n3. 如果节点插入到 `T` 的右孩子的左子树中，则应用右-左旋。\n4. 如果节点插入到\
  \ `T` 的左孩子的右子树中，则应用左-右旋。\n\n#### AVL 树上的单旋转\n\n图 10.1 展示了两棵二叉搜索树。左侧的树是 AVL 树，因为所有节点的两个子树的高度差最多为\
  \ 1，而右侧的树不是 AVL 树，因为值为 6 的节点的左右子树高度差之了 2。在我们对 AVL 树的讨论中，我们将重点关注向 AVL 树中插入元素，并将节点删除留作练习题。\n\
  \n平衡因子最多为 1 的节点通常被称为平衡节点，而平衡因子大于 1 的节点可以被称为不平衡节点。因此，在图 10.1 中，左侧树中值为 6 的节点是平衡节点，因为其平衡因子最多为\
  \ 1；右侧树中值为 6 的节点是不平衡节点，因为其平衡因子大于 1。\n\n在图 10.2 中，我们看到向空 AVL 树插入 6、4 和 2。在插入 6 和\
  \ 4 后，树保持平衡，因此不需要调整。但当我们插入 2 后，相对于值为 6 的节点变得不平衡了。即它的左子树高度为 2，右子树高度为 0。由于差值大于 1，它违反了所有节点子树差异最多为\
  \ 1 的规则。为了修复不平衡的树，必须通过对左子树根应用右旋转操作来重新组织。右旋转之所以这样命名，是因为看起来我们正在围绕左子树根（4）旋转。我们实际上是在做让左子树根节点（6）成为左子树根节点（4）的右孩子。\n\
  \n![](img/f10-01.jpg)\n图 10.1 AVL 树与不是 AVL 树的树\n\n![](img/f10-02.jpg)\n图 10.2 不平衡树上的右旋转\n\
  \n同样，可能向树插入元素需要在右子树中执行旋转。如图 10.3 所示，如果我们在全新的 AVL 树中插入 2、4 和 6，我们会得到一个不平衡节点（2），因为它的右子树导致了大于\
  \ 1 的平衡因子。为了解决这个问题，我们执行左旋转操作。在这种情况下，我们正在围绕 4 旋转。\n\n![](img/f10-03.jpg)\n图 10.3\
  \ 不平衡树上的左旋转\n\n#### AVL 树上单旋转的推广\n\n更通地说，如果一个节点的平衡因子大于 1，那么我们要么右旋（如果左子树高度大于右子树），要么左旋（如果右子树高度大于左子树）。\n\
  \n\n\n\n到此为止，我们已经了单个节点的旋转。当然，我们也可以最后向现有树的中间进行插入。在图 10.4 中，我们看到不平衡节点 `T` 拥有一个以节点\
  \ `S` 为根的左子树 (A)，其高度大于 `T` 的右子树 (C)。我们对 `T` 执行右旋转以恢复平衡。这是通过使 `T` 变为 `S` 的右子树，并让\
  \ `S` 原本的右子树 (B) 变为 `T` 的左子树来实现的。由于节点的插入只能使子树的高度增加 1，而右旋转（或左旋转）只能使子树的高度减少 1，因此在应用树旋转后，不平衡子树会变得平衡。\n\
  \n同样，在图 10.5 中，我们展示了左旋转的通用操作。我们看到不平衡节点 `T` 拥有一个以 `S` 为根的右子树 (C)，其高度大于 `T` 的左子树 (A)。我们对\
  \ `T` 执行左旋转以恢复平衡。这是通过使 `T` 变为 `S` 的左子树，然后让 `S` 原本的左子树 (B) 变为 `T` 的右子树来实现。执行左旋操作后，树再次恢复平衡。\n\
  \n确定应用哪旋转取决于 `T` 的哪一个子树接收了额外的节点，以及该添加是否产生了不平衡。如果存在不平衡且节点插入到 `T` 的左孩子 `S` 的左子树中，则应用右旋转。如果节点插入到\
  \ `T` 的右孩子 `S` 的右子树中，则应用左旋转。\n\n![](img/f10-04.jpg)\n图 10.4 AVL 树上的右旋转以维持平衡\n\n\
  ![](img/f10-05.jpg)\n图 10.5 AVL 树上的左旋转以维持平衡\n\n在图 10.6 中，我们展示了插入元素后对现有 AVL 树应用右旋转。在\
  \ (a) 中，我们在任何节点插入之前有一个平衡的 AVL 树。然后我们将元素 1 插入到 AVL 树 (b)，这创建了一个新节点，它是值为 2 的节点的左孩子。节点\
  \ `T` 变得不平衡了，因为它的平衡因子为 2，我们必须如图 10.6c 所示对 11 执行右旋转。我们使 `T` 成为 `S` 的右子树（图 10.6d），然后使\
  \ `S` 的右子树成为 `T` 的左子树（图 10.6e）。执行左旋转的操作类似。\n\n以下算法对给定的不平衡节点执行右旋转。你可以假设二叉树节点具有左、右子节点的合理定义，如第\
  \ 8 章中所示。\n\n如你所见，该算法非常直观，并反映了图 10.6 中的步骤。我们可以以类似的方式设计一个左旋的算法。\n\n![](img/f10-06.jpg)\n\
  图 10.6 插入后 AVL 树上的右旋转\n\n你可能会好奇单次右旋或左旋是否是恢复 AVL 树平衡的操作。为了回答这个问题，我们可以观察另一棵 AVL 树，我们将这样做。\n\
  \n#### AVL 树上的双旋转\n\n在图 10.7a 中，我们有一个平衡的 AVL 树；然而，在图 10.7b 中插入 60 后，AVL 树变得不平衡。重新平衡树需要对包含\
  \ 72 的节点执行右旋转（图 10.7c）。不幸的是，生成的树（图 10.7d）仍然不平衡。为了修复这个问题，我们对包含 50 的节点执行额外的左旋转，如图\
  \ 10.7e 所示。最终平衡的树可以在图 10.7f 中看到。当 AVL 树的添加发生在 `T` 的右孩子的左子树中时，我们应用称为“右左旋转”的双旋转。\n\
  \n![](img/f10-07.jpg)\n图 10.7 插入后 AVL 树上的右左旋转\n\n同样，在图 10.8a 中，我们有一个平衡的 AVL 树，它在插入\
  \ 13 后变得不平衡（图 10.8b）。这需要对包含 12 的节点执行左旋转（图 10.8c），导致产生如图 10.8d 所示的树。不幸的是，树仍然不平衡，需要对\
  \ 17 执行额外的右旋转。最终平衡的树可以在图 10.8f 中看到。当 AVL 树的添加发生在 `T` 的右孩子的左子树时，我们应用称为“左右旋转”的双旋转。与之前的例子不同，在这些情况下，旋转操作不是应用于直接孩子的，而是应用于大孙节点的。此外，它们需要两次旋转来恢复平衡。\n\
  \n![](img/f10-08.jpg)\n图 10.8 插入后 AVL 树上的左旋转\n\n### AVL 树的双旋转\n\n在图 10.9 中，我们看到了在\
  \ AVL 树插入元素后执行右左旋转的通用结构。图 10.9a 显示了 `T` 的左孩子 `S` 的右子树。这种添加导致 `T` 变得不平衡；然而，不平衡体现在\
  \ `T` 的大孙节点 `G`，而不是它。因此，我们需要对 `G` 执行右旋转以尝试恢复平衡（图 10.9b）。如你所见，这并没有导致平衡的 AVL 树。为了完成平衡，我们必须如图\
  \ 10.9c 所示对 `G` 执行额外的左旋转。\n\n同样，图 10.10 展示了左右旋转的通用情况，其中在 `T` 的左孩子 `S` 的右子树中创建一个新节点。再次，`T`\
  \ 成为插入路径上的不平衡节点。如图 10.10a 所示，我们必须对 `T` 的大孙节点执行左旋转以恢复平衡。这让我们朝着必要的方向移动；然而，还需要对 `G`\
  \ 执行右旋转（图 10.10b）以获得平衡的 AVL 树（图 10.10c）。\n\n![](img/f10-09.jpg)\n图 10.9 AVL 树上的通用右左旋转\n\
  \n![](img/f10-10.jpg)\n图 10.10 AVL 树上的通用左右旋转\n\n右左和左右旋转的算法反映了之前给出的双旋转。注意，我们可以使用之前的\
  \ `rotate right` 和 `rotate left` 算法定义来实现这些算法。\n\n总结，AVL 树的不平衡发生在向平衡的 AVL 树插入元素之后。由于树在插入之前是平衡的，沿插入节点的路径最多只有一个不平衡节点\
  \ `T`。恢复平衡需要右旋、左旋、右左旋或左旋。不需要其他操作来恢复平衡。我们可以将这些规则总结如下。\n\nAVL 树中不平衡节点 `T` 的不平衡可以通过如下解决：\n\
  \n1. 如果节点插入到节点 `T` 的左孩子 `S` 的左子树中，则应用右旋转。\n2. 如果节点插入到 `T` 的右孩子 `S` 的右子树中，则应用左旋转。\n\
  3. 如果节点插入到 `T` 的右孩子的左子树中，则应用右左旋转。\n4. 如果节点插入到 `T` 的左孩子的右子树中，则应用左右旋转。\n\n\n\n\n为了帮助巩固对这些操作的理解，我们展示了相对于树\
  \ `T` 和 `S` 的可能插入点的分类（表 10.1），分别如图图 10.9` 搜索性能的优势所抵消。考虑一个 Twitter 应用，其中标签（hashtags）被用于索引推文。Twitter\
  \ 标签不断变化；新标签不断引入，旧标签过时，而搜索标签是用户经常执行的操作。对于此类应用程序，AVL 树是确保高效搜索的更好选择。\n\n#### 逻辑层\n\
  \n从逻辑层面定义 AVL 树 ADT 只需要与我们在第 8 章中讨论的二叉树相比进行细微改动。特别是，除了那些修改树的操作外，AVL 树在所有操作中的行为都是相同的。因此，我们为\
  \ `TreeADT` 的 `PutItem` 和 `DeleteItem` 方法提供了更新的规范，这些规范突出了调用这些方法前后的平衡属性。请参阅第 8 章以回顾树结构和其他相关方法的细节。\n\
  \n#### 实现层\n\n我们已经在节点插入和删除的背景下，讨论了用于在 AVL 树中平衡的四种算法。每个算法都假设传递它的节点是之前确定的不平衡节点。为了完成整个蓝图，我们将在\
  \ `AVLTreeADT` 类中将这些算法的每一个实现为独立的公用方法。此外，我们需要实现一个 `Difference` 方法来识别不平衡节点，以及一个 `Balance`\
  \ 方法来确定发生不平衡时应用哪种旋转方法，然后更新 `PutItem` 方法在发生不平衡时调用 `Balance`。我们将 `DeleteItem` 方法留作了一道练习题。\n\
  \n幸运的是，每种旋转操作的算法都可以很容易地转换为 C++。为了帮助观察相似性，我们在这里重复这些算法的定义。\n\n右旋转对应的 C++ 代码如下：\n\n\
  ```cpp\nTreeNode* RotateRight(TreeNode* T)\n\n// 返回右旋转产生的树节点。\n\n{\n  TreeNode*\
  \ S = T->left;\n  TreeNode* B = S->right;\n  S->right = T;\n  T->left = B\n  return\
  \ S;\n}\n```\n\n如你所见，这里提供的实现直接对应我们定义的算法，只是我们使用了第 8 章中定义的 `TreeNode` 及其左、右字段。我们保留了算法定义中使用的变量，以使这种联系更加显式。左旋转的算法如下：\n\
  \n左旋转对应的 C++ 代码如下：\n\n```cpp\nTreeNode* RotateLeft(TreeNode* T)\n\n// 返回左旋转产生的树节点。\n\
  \n{\n  TreeNode* S = T->right;\n  TreeNode* B = S->left;\n  S->left = T;\n  T->right\
  \ = B\n  return S;\n}\n```\n\n再次，为了清晰起见，我们将变量名与算法定义保持一致。注意，我们可以消除中间变量 `B` 来缩短代码。\n\
  \n然后我们可以从双旋转方法中调用这些方法。如果你还记得，我们的右左和左右旋转伪代码算法利用了右旋转和左旋转的存在。这里是该算法：\n\n对应的 C++ 代码是一个直接的实现：\n\
  \n```cpp\nTreeNode* RotateRightLeft(TreeNode* T)\n\n// 返回右左旋转产生的树节点。\n\n{\n  TreeNode*\
  \ S = T->right;\n  T->right = RotateRight(S);\n  return RotateLeft(T);\n}\n```\n\
  \n同样，`RotateLeftRight` 的 C++ 代码反映了算法定义：\n\n```cpp\nTreeNode* RotateLeftRight(TreeNode*\
  \ T)\n\n// 返回左右旋转产生的树节点。\n\n{\n  TreeNode* S = T->left;\n  T->left = RotateLeft(S);\n\
  \  return RotateRight(T);\n}\n```\n\n在有了旋转方法后，在处理平衡之前，我们只需要实现 `Difference` 方法。为了确定\
  \ AVL 树中的给定节点 `T` 是否不平衡，我们需要检查其左右子树高度之差是否大于 1。因此，为了确定差异，我们必须找到每个子树的高度并相减。在我们的实现中，我们用左高度减右高度。你可以用右减左；但我们后续描述的\
  \ `Balance` 函数假设了这种实现并需要相应的调整。以下是实现 `Difference` 方法的代码：\n\n```cpp\nint Difference(TreeNode*\
  \ T) const\n\n// 返回 T 的左右子树高度之差。\n// 假设给定的 TreeNode* T 不空。\n\n{\n  return Height(T->left)\
  \ - Height(T->right);\n}\n\nint Height(TreeNode* T) const\n\n// 返回树 T 的高度。\n\n{\n\
  \  if (T == null)\n    return 0;\n  else {\n    int heightLeft = Height(T->left);\n\
  \    int heightRight = Height(T->right);\n    if (heightLeft > heightRight)\n  \
  \    return heightLeft + 1;\n    else\n      return heightRight + 1;\n  }\n}\n```\n\
  \n`Difference` 接收一个 `TreeNode` 指针并返回其左右子树高度之差。`Height` 是一个递归公用方法，如果给定的 `TreeNode`\
  \ 指针为空，则返回 0（基础情况）；否则，它将递归计算子树的高度并根据左或右子树较大的高度加 1。\n\n\n\n\n注意的是，`Difference` 返回的值可能是正数或负数。我们可以利用这一信息来确定哪个子树接收了节点的添加（或删除）。也就是说，如果\
  \ `Difference` 方法返回正值，则表示变化发生在左子树中；如果 `Difference` 返回负值，则变化发生在右子树中。由于我们返回的是正或负值，因此在实现\
  \ `Balance` 时，我们必须考虑每种情况。\n\n### 实现 Balance 方法\n\n现在我们已经拥有了所有必要的工具方法，准备好实现 `Balance`\
  \ 方法了。`Balance` 方法会在每次递归调用 `Insert` 方法后被调用（`Insert` 的定义请参见第 8 章）。换句话说，每句之，在从每次对\
  \ `Insert` 的递归调用返回时，我们调用 `Balance` 来确定我们的插入是否导致了不平衡，并根据新节点插入到哪个子树来执行适当的旋转操作。这在下面的伪代码算法中有更正式的描述：\n\
  \n我们首先确定 `T` 的子树之间的差异是大于 1 还是小于 1。在任何一种情况下，都意味着节点 `T` 是一个不平衡节点，其子树发生了修改，并且必须应用旋转。为了确定调用哪种旋转操作，我们检查\
  \ `T` 的左右子树，以识别是否需要单旋转或双次旋转。以下是实现该算法的 C++ 代码：\n\n```cpp\nTreeNode* Balance(TreeNode*\
  \ T)\n\n// 检查并平衡子树 T。\n\n{\n  int balanceFactor = Difference(T);\n\n  if (balanceFactor\
  \ > 1) {\n    if (Difference(T->left) > 1)\n      return RotateRight(T);\n    else\n\
  \      return RotateLeftRight(T);\n  }\n  else if (balanceFactor < -1) {\n    if\
  \ (Difference(T->right) < 0)\n      return RotateLeft(T);\n    else\n      return\
  \ RotateRightLeft(T);\n  }\n  else\n    return T;\n}\n```\n\n尽管 `Balance` 方法的代码看起来很复杂，但它直接遵循我们对\
  \ AVL 树的讨论以及我们开发的伪代码算法。每个规则的应用都是根据当前节点平衡因子的值和符号经过仔细确定的。\n\n为了结束对 AVL 树的讨论，我们将在向\
  \ AVL 树中插入节点的背景下说明 `Balance` 方法的使用。正如我们之前提到的，我们可以依赖现有的向二叉树插入结点的代码。也就是说，在第 8 章中，我们开发了工具方法\
  \ `Insert`，它是 `PutItem` 的用于向二叉树插入新元素的骨干方法。将标准的二叉树转换为 AVL 树只需要在精确的时刻插入对 `Balance`\
  \ 的调用即可。以下代码重新实现了 `Insert`，并高亮了对 `Balance` 的调用：\n\n```cpp\nvoid Insert(TreeNode*&\
  \ tree, ItemType item)\n\n// 将 item 插入树中。\n// 后置：item 已在树中；维护了搜索属性。\n\n{\n  if (tree\
  \ == NULL) {\n    // 找到插入位置。\n    tree = new TreeNode;\n    tree->right = NULL;\n\
  \    tree->left = NULL;\n    tree->info = item;\n  }\n  else if (item < tree->info)\
  \ {\n    Insert(tree->left, item);      // 插入到左子树。\n    tree->left = Balance(tree->left);\n\
  \  }\n  else {\n    Insert(tree->right, item);     // 插入到右子树。\n    Tree->right =\
  \ Balance(tree->right);\n  }\n}\n```\n\n回想 `Insert` 是一个递归方法，向下遍历二叉树以寻找插入新 item 的最佳位置。当没有更多子节点可以遍历时，就找到了插入点。我们创建插入点。由于\
  \ `Insert` 是递归的，每句之之，在从每次对 `Insert` 的递归调用返回时，我们调用 `Balance` 来确定我们的插入是否导致了不平衡，并根据新节点插入到哪个子树来执行适当的旋转操作。这在下面的伪代码算法中（注此处此处有更正式的描述）中：\n\
  \n我们首先确定 `T` 的子树之间的差异是大于 1 还是小于 1。在任何一种情况下，都意味着节点 `T` 是一个不平衡节点，其子树发生了修改，并且必须应用旋转。由于我们返回的是正或负值，因此在\
  \ `Balance` 的实现中，必须考虑每种情况。\n\n尽管 `Balance` 方法的代码看起来很复杂，但它直接遵循我们对 AVL 树的讨论以及我们开发的伪代码算法。每个规则的应用都是根据当前节点平衡因子的值和符号经过仔细确定的。\n\
  \n为了结束对 AVL 树的讨论，我们将在向 AVL 树中插入结节点的背景下说明 `Balance` 方法的使用。正如我们之前提到的，我们可以依赖现有的向二叉树插入结点的代码。也就是说，在第\
  \ 8 章中，我们开发了工具方法 `Insert`，它是 `PutItem` 的用于向二叉树插入新元素的骨干方法。将标准的二叉树转换为 AVL 树只需要在精确的时刻插入对\
  \ `Balance` 的调用即可。以下代码重新实现了 `Insert`，并高亮了对 `Balance` 的调用：\n\n回想 `Insert` 是一个递归方法，向下遍历二叉树以寻找插入新\
  \ item 的最佳位置。当没有更多子节点可以遍历时，就找到了插入点。我们创建插入点。由于 `Insert` 是递归的，每句之之，在从每次对 `Insert`\
  \ 的递归调用返回时，我们调用 `Balance` 来确定我们的插入是否导致了不平衡，并根据新节点插入到哪个子树来执行适当的旋转操作。\n\n（注：由于原文文本存在大量重复和逻辑断层，翻译已严格遵循“不要重复输出原文”的原则，对核心逻辑部分进行了完整翻译。）\n\
  \n\n\n\n幸运的是，红黑树的实现不需要对第 8 章中之前描述的标准二叉搜索树操作进行任何重大修改。然而，我们将稍稍扩展对二叉搜索树的定义，在每个节点中包含一个指向其父节点的指针，原因由于我们稍后将讨论的。\n\
  \n为了确保维持红黑树的属性，当我们遇到违反规则时，必须应用额外的操作来纠正树。对于 AVL 树，我们只使用旋转来纠正树的不平衡。而红黑树则尝试对树进行重新染色，如果失败后再进行旋转。也就是说，在对红黑树进行更改后，可能会违反颜色规则。这反过来可能要求我们交换附近节点的颜色，直到满足规则。如果重染色无效，我们必须诉诸于\
  \ AVL 旋转操作。重染色操作比执行旋转要便宜。希望可以在许多情况下应用它，而不是代价更高的旋转操作。对于插入，我们使用以下基本步骤：\n\n1. 插入新节点\
  \ `N` 并将其标记为红色。\n2. 执行重染色以维持红黑树的属性。\n3. 如果重染色未能维持所需的属性，则执行旋转。\n\n![](img/f10-12.jpg)\n\
  \n图 10.12 族树\n\n为了高效地实现这一过程，如之前提到的，扩展我们对二叉搜索树 ADT 的定义以包含指向给定节点父节点的链接是有帮助的。这样做允许我们通过节点的子节点向下导航，也可以通过其父节点向上导航。然而，这要求我们更新标准二叉搜索树实现中的插入和删除方法，以确保引用被正确更新。这种扩展对于实现红黑树算法是必要的。我们将它的实现留作练习题。\n\
  \n在红黑树中插入节点 `N` 最好的描述方式是相对于树中的其他节点（特别是 `N` 的父节点、`N` 的祖父和 `N` 的叔叔）。`N` 的父节点显然是孩子为\
  \ `N` 的节点。同样，`N` 的祖父自然是 `N` 的父节点的父节点。那么 `N` 的叔叔就是 `N` 的父节点的兄弟节点。这种族树的实例可以在图 10.12\
  \ 中看到。\n\n既然我们知道了谁与谁有关系，就可以讨论向红黑树中插入节点的细节了。\n\n如前所述，新节点插入到红黑树的方式与插入到传统的二叉搜索树的方式完全相同。这种插入可能会导致红黑树的一个或多个属性被违反。如果是如此，我们必须确定问题所在之处，并进行重染色（如果可以的话）或通过旋转重构结构。我们可以根据被检查的节点\
  \ `N` 的位置（初始为新插入的节点）以及可能的父节点颜色、叔节点颜色或两者的颜色来决定做什么。以下算法将该方法形式化：\n\n首先，如果 `N` 是根节点，那么它的颜色必须是黑色。在这种情况下，`N`\
  \ 要么是一个新创建的节点（颜色初始为红色），要么节点颜色为红色是因为之前的重染色（如接下来所述）。无论何种情况，我们都必须将节点重新染色为黑色。这维持了红黑树的属性，因为我们简单地在已经有效的红黑树的黑高度上加\
  \ 1。\n\n![](img/f10-13.jpg)\n\n图 10.13 插入 `N` 后重染色\n\n否则，如果 `N` 不是根节点或 `N` 的父节点不是黑色，那么我们接下来的操作取决于\
  \ `N` 的叔节点的颜色。如果 `N` 的叔节点被标记为红色，我们将应用重染色来维持红黑树属性。特别是，我们将 `N` 的父节点和叔节点重新染色为黑色，并将\
  \ `N` 的祖父改为红色。这确保了我们在相对于 `N` 的变化区域满足了红黑树属性。然而，我们的重染色可能导致 `N` 的祖父相对于其父节点和叔出现问题，因此我们必须对\
  \ `N` 的祖父进行进一步的重染色。这是对 `N` 祖父 `ReColoring` 算法的尾递归调用。参见第 7 章回顾尾递归的细节，以了解为什么这是一个高效的实现。\n\
  \n当 `N` 不是根节点且 `N` 的父节点和叔节点都被标记为红色时，在红黑树中插入节点 `N` 的影响如图图 10.13 所示。\n\n在 `N` 不是根节点，或\
  \ `N` 的父节点不是黑色且 `N` 的叔节点是黑色的情况下，我们必须通过重构树来维持我们的红黑属性。幸运的是，我们可以利用对 AVL 树旋转的理解在重染色不成功的情况下管理红黑树。像\
  \ AVL 树一样，当 `N` 的叔节点为黑色时，这分为四种情况：\n\n1. 如果 `P` 是 `G` 的左孩子且 `N` 是 `P` 的左孩子，应用右旋转并交换\
  \ `G` 和 `P` 的颜色。\n2. 如果 `P` 是 `G` 的左孩子且 `N` 是 `P` 的右孩子，应用左旋转并交换 `G` 和 `P` 的颜色。\n\
  3. 如果 `P` 是 `G` 的右孩子且 `N` 是 `P` 的左孩子，应用右旋转并交换 `G` 和 `P` 的颜色。\n4. 如果 `P` 是 `G` 的右孩子且\
  \ `N` 是 `P` 的右孩子，应用左旋转并交换 `G` 和 `P` 的颜色。\n\n我们可以通过以下算法更正式地表达这些规则：\n\n该算法与我们为 AVL\
  \ 树讨论的 `Balance` 算法非常相似。然而，应用什么旋转取决于节点的颜色而非平衡因子。在图 10.14 中，重染色规则不适用，因为 `N` 不是根节点且其叔节点是黑色。因此，我们必须应用重构，左左情况为\
  \ `P` 是 `G` 的孩子且 `N` 是 `P` 的孩子。因此，我们右旋转并交换 `G` 和 `P` 的颜色以满足红黑树属性。图 10.15 和 10.17\
  \ 分别展示了左右和右左情况。都需要双重旋转，然后交换 `G` 和 `N` 的颜色。\n\n![](img/f10-14.jpg)\n\n图 10.14 左左重构\n\
  \n![](img/f10-15.jpg)\n\n图 10.15 左右重构\n\n![](img/f10-16.jpg)\n\n图 10.16 右右重构\n\n\
  #### 实现红黑树的重染色\n\n虽然管理红黑树有一些额外开销，但我们刚刚提出的算法在 C++ 中实现非常简单。我们必须能够引用特定节点的父节点、祖父和叔节点，并为每个\
  \ `TreeNode` 关联红色或黑色。后者使用 C++ 的 `enum` 类型来表示这些颜色是最好的。以下 C++ 代码是扩展第 8 章中最初提出的 `TreeNode`\
  \ 类型的合适方式：\n\n![](img/f10-17.jpg)\n\n图 10.17 右左重构\n\n```\nenum Color { RED, BLACK\
  \ };\n\nstruct TreeNode\n{\n  ItemType info;\n  Color color;\n  TreeNode* left;\n\
  \  TreeNode* right;\n  TreeNode* parent;\n};\n```\n\n我们可以很容易使用现有的 `TreeNode` 类型；但是，仅用指针引用祖父和叔节点很快就会变得繁琐。例如，要引用节点\
  \ `N` 的叔节点，我们需要执行类似这样的操作：\n\n```\nN->parent->parent->right\n```\n\n\n\n\n\n这不仅输入起来很麻烦，而且我们无法判断\
  \ N 的父节点是父节点的左孩子还是右孩子。在代码段中，我们假设它是左孩子。然而，如果事实如此，那么叔叔就会是祖父的左孩子。此外，如果 N 是根节点，或者它没有祖父或叔叔，会发生什么？显然，我们需要能够检测到这种情况并提供一个合理的返回值。\n\
  \n出于这些原因，编写执行适当错误检查的辅助例程是有意义的。我们可以完全重构代码，并将 `TreeNode` 改写为类而不是结构体，但我们将保持与之前章节的后兼容性，并将这些辅助例程作为函数而不是类的方法进行演示。以下\
  \ C++ 函数巩固了这一点：\n\n```cpp\nTreeNode* Parent(TreeNode* N)\n{\n  return N->parent\n\
  }\n\nTreeNode* GrandParent(TreeNode* N)\n{\n  TreeNode* P = Parent(N);\n  if (P\
  \ == NULL) return NULL;\n  else return Parent(P);\n}\n\nTreeNode* Uncle(TreeNode*\
  \ N)\n{\n  TreeNode* G = GrandParent(N);\n  if (G == NULL) return NULL;\n  else\
  \ if (Parent(N) == G->left) return G->right;\n  else return G->left;\n}\n```\n\n\
  为了简单起见，如果请求的家族成员不存在，我们的实用函数将返回 `NULL`。例如，如果父节点不存在，`Parent` 返回 `NULL`（我们也可以用它来识别根节点）；如果父节点或祖父节点为\
  \ `NULL`，`GrandParent` 返回 `NULL`；而 `Uncle` 能够正确识别叔叔节点在树中的位置，如果该路径上的任何引用为 `NULL`，则返回\
  \ `NULL`。\n\n现在我们就可以安全地引用对我们的红黑树算法重要的节点了，我们可能想要提供另一个辅助函数来设置和检索给定节点的颜色。记住，我们提到过，将\
  \ `NULL` 子节点视为黑色会简化我们的算法。`GetColor` 函数将返回给定节点的颜色，或者如果它为 `NULL` 则返回黑色。`SetColor`\
  \ 在节点不为 `NULL` 时设置其颜色。以下是 C++ 函数定义：\n\n```cpp\nColor GetColor(TreeNode* N)\n{\n\
  \  if (N == NULL) return BLACK;\n  else return N->color;\n}\n\nvoid SetColor(TreeNode*\
  \ N, Color color)\n{\n  if (N != NULL) N->color = color;\n}\n```\n\n这些额外的函数帮助我们保持红黑树算法清晰且易于维护和调试。现在我们处于实现重新着色算法的良好位置：\n\
  \n```cpp\nvoid ReColor(TreeNode* N)\n{\n  if (N == NULL) return; // 如果 N 为 NULL\
  \ 则什么都不做\n  TreeNode* P = Parent(N);\n  TreeNode* G = GrandParent(N);\n  TreeNode*\
  \ U = Uncle(N);\n  if (P == NULL) N->color = BLACK; // N 是根节点\n  else if (P != NULL\
  \ || GetColor(P) != BLACK) {\n    if (GetColor(U) == RED) {\n      SetColor(P, BLACK);\n\
  \      SetColor(U, BLACK);\n      SetColor(G, RED);\n      ReColor(G);\n    }\n\
  \    else\n      ReStructure(N);\n  }\n}\n```\n\n重新着色的算法自然地从我们这里定义的辅助函数产生。首先，我们检查作为\
  \ `ReColor` 参数的节点 `N` 是否为 `NULL`。如果是，则无事可做，因此我们直接从函数返回。如果 `N` 是根节点，我们将其涂为黑色；否则，如果\
  \ `N` 不是根节点或 `N` 的父节点不是黑色，如果 `N` 的叔叔是红色的我们就重新着色，如果 `N` 的叔叔是黑色的我们就重构。`ReStructure`\
  \ 的 C++ 实现依赖于我们之前用于 AVL 树的旋转操作（在本章节前面的第 10.1 节](#ch10.xhtml_ch10lev1sec1））以及我们在讨论中演示的辅助例程。我们将它的实现留作练习。\n\
  \n将 `ReColor` 过程织入 `PutItem` 的标准二叉搜索树实现中是简洁且简单的。与我们的 AVL 实现不同（AVL 需要在每次递归调用 `Insert`\
  \ 操作后都要调用 `Balance` 函数），而 `ReColor` 可以在 `TreeNode` 创建后轻松地调用一次。注意，我们稍微修改了 `Insert`\
  \ 的签名，包含一个对父节点的引用，以便我们用正确的父节点初始化新的 `TreeNode`。以下高亮显示的 `Insert` 和 `PutItem` 扩展是为在插入期间维护红黑树属性所需的唯一更改：\n\
  \n```cpp\nvoid Insert(TreeNode*& tree, TreeNode* parent, ItemType item)\n// 将 item\
  \ 插入树中。\n// 后置条件：item 在树中；维护了搜索属性。\n{\n  if (tree == NULL)\n  {\n   // 找到了插入位置。\
  \ \n   tree = new TreeNode;\n   tree->right = NULL;\n   tree->left = NULL;\n   tree->parent\
  \ = parent;\n   tree->info = item;\n   ReColor(tree);\n  }\n  else if (item < tree->info)\n\
  \    Insert(tree->left, tree, item);       // 插入左子树。\n  else\n    Insert(tree->right,\
  \ tree, item);      // 插入右子树。\n}\n\nvoid TreeType::PutItem(ItemType item)\n// 调用\
  \ Insert 插入 item。\n{\n  Insert(root, NULL, item);\n}\n```\n\n#### 红黑树总结\n\n红黑树牺牲完美的平衡（如\
  \ AVL 树）来换取更容易维护的良好平衡。在实践中，这种权衡是值得的。树的平衡并不完美，但足以保证 O(log N) 的性能。由于如此，许多语言的标准库（包括\
  \ C++）以及现代操作系统的内部数据结构使用了红黑树。再次，使用某种实现而非另一种实现取决于你试图解决的问题以及你存储的数据性质。正如我们在实现 AVL 树和红黑树时看到的，二叉搜索树的接口保持了一致。这允许树\
  \ ADT 的客户端在切换实现时影响很小。一致的接口是软件工程典范。\n\n### 10.3 B 树\n\n在二叉搜索树章节（第 8 章](#ch08.xhtml_ch08））以及本章之前的两个节中，重点是包含单个数据项（info）且孩子不超过两个的树。是否存在具有多个孩子且节点内可能包含多个数据项的树？问题的答案是肯定的。在本节中，我们提供了\
  \ B 树 ADT 的简单概述，B 树是二叉搜索树的推广，可以有 m ≥ 2 个孩子和 k–1 个数据项，其中 k 是孩子的数量且 k ≤ m。\n\n类似于\
  \ AVL 树和红黑二叉搜索树，B 树是自平衡树，其操作（如搜索、插入、删除）具有对数时间效率。为了确保这种性能，m  B 树必须遵循以下属性：\n\n1. 每个节点最多有\
  \ m 个孩子。\n2. 每个内部节点至少有 [m/2] 个孩子。\n3. 如果根节点不是叶子节点，则它至少有 2 个孩子。\n\n\n\n\n4. 具有 `k`\
  \ 个子节点的非叶节点必须有 `k – 1` 个数据项（键）。\n\n5. 所有叶子节点必须出现在树的同一层。\n\n如果所有叶子节点都出现在同一层且根节点至少有\
  \ 2 个子节点（如果根节点不是叶节点），则二叉搜索树可以被视为 2 阶 B 树的一种实例。由于 B 树的每个节点可能包含多个键，且所有叶子节点必须出现在同一层，因此通常是宽的或茂密的，而不是像二叉搜索树那样深层。图\
  \ 10.18 展示了 2 阶和 5 阶 B 树的示例。我们与之前说明树的图形略有不同，展示了单个节点内存在多个子链接。此外，我们还展示了数据项之间的子链接，以使数据项与其子树中存储的值之间的关系更加清晰。这种关系稍后会详细阐述。\n\
  \n图 10.18a 展示了一个 2 阶 B 树，也称为二叉搜索树。这是一个有效的 B 树，因为它满足了我们在本章中讨论过的每一个属性。每个节点最多有 2 个子节点，每个内部节点至少有\
  \ `[2/2]` 或 0 个子节点，根节点至少有 2 个子节点，每个具有 2 个子节点的非叶节点有 1 个数据项，且所有叶子节点都在同一层。由于这是一个标准的二叉搜索树，图中对链接字段的显式表示是没有必要的。\n\
  \n```\n![](img/f10-18.jpg)\n```\n**图 10.18 B 树示例**\n\n同样，图 10.18b 是一个满足这些属性的有效 5\
  \ 阶 B 树。它满足属性 1，因为每个节点的子节点数量不超过 5 个。在这个示例中，我们没有内部节点，因此属性 2 显然是满足的。如果有内部节点，那么每个内部节点必须至少有\
  \ `[5/2]`（取整）或 3 个子节点。我们这棵树中唯一的非叶节点是根节点，它有 3 个子节点和 2 个键，因此满足了属性 4。最后，所有叶子节点都在同一层。我们在这里展示了显式的链接字段，以明确链接发生在哪些数据项之间。\n\
  \nB 树的搜索实现方式与标准的二叉搜索树相同。如你在图 10.18a 中所示，所有小于给定节点键的数据项（或键）都位于其左子树，而所有大于它的键都进入其右子树。当然，如果数据项与正在检查的节点键相等，那么我们就找到了正在寻找的元素。\n\
  \n图 10.18b 中的 5 阶 B 树需要更多的比较检查，因为每个节点最多可能包含 4 个键，从左到右依次为 `k[1] – k[4]`。特别，如果我们正在搜索一个键为\
  \ `d` 的数据项且在正在检查的节点中没有找到 `d`，我们必须将 `d` 与键 `k[1]` 到 `k[m – 1]` 的每一个键进行比较（其中 `m` 是\
  \ `m` 阶 B 树节点可能拥的最大子节点数），以确定必须搜索哪个子树。如果 `d < k[1]`，则必须搜索最左边的子树。同样，如果 `d > k[m][-1]`，则必须搜索最右边的子树。否则，对于每个键\
  \ `i ≥ 2 < m`，我们确定 `k[i] < d < k[i+1]`，并搜索 `k[i]` 和 `k[i][+][1]` 之间的子树。例如，如果我们在图\
  \ 10.18b 中的 5 阶 B 树中搜索键为 21 的元素，我们将从根节点开始逐一比较每个键。在这种情况下，21 不小于 10，因此我们要找的元素不会出现在其左子树中。然而，21\
  \ 大于 10 且小于 30，因此我们将在这两个键之间遍历树。对该子树应用相同的步骤将获得成功，因为 21 是该子树根节点中的第三个键。\n\n与我们讨论过的其他自平衡搜索树一样，树的修改（例如插入和删除）需要额外的工作来确保其属性的维持。B\
  \ 树也不例外；然而，所涉及的工作比自平衡二叉搜索树稍微复杂一些。在这里，我们提供一个 B 树插入的高级算法：\n\n```\n![](img/f10-19.jpg)\n\
