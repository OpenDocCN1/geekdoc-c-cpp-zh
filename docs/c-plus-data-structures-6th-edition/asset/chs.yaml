  \n\n\n\n排序列表（Sorted List） ADT 的应用层与无序列表（Unsorted List） ADT 相同。对于用户而言，它们的接口是相同的。唯一的区别在于，当在排序列表\
  \ ADT 中调用 `GetNextItem` 时，返回的元素是按键值排序的下一个元素。如果用户需要该属性，客户端代码应包含包含 `SortedType` 类的文件，而不是\
  \ `UnsortedType`。\n\n#### 实现层次\n\n### `PutItem` 函数\n\n要向排序列表添加元素，我们必须首先找到新元素所在的位置，这取决于其键值的值。让我们用一个例子来说明插入操作。假设\
  \ Becca 入选了荣誉榜。为了在保持字母顺序的同时，向如图 4.1a 所示的排序列表中添加贝贝卡（Becca）这一元素，我们必须完成三个任务：\n\n1.\
  \ 找到新元素所在的位置。\n2. 为新元素创建空间。\n3. 将新元素放入列表。\n\n![](img/f04-01.jpg)\n\n图 4.1 将项目插入排序列表\n\
  \n第一个任务涉及遍历列表并将新项目与列表中的每个项目进行比较，直到找到一个新项目小于该的项目（在本例中，为 Becca）。当我们到达 `item.ComparedTo(Info(location))`\
  \ 为 `LESS` 的点时，我们将 `moreToSearch` 设置为 `false`。此时，`location` 指明新项目应该去的位置（参见图 4.1b）。如果我们没有找到\
  \ `item.ComparedTo(Info(location))` 为 `LESS` 的地方，则该项目应该放在列表末尾。在这种情况下，`location`\
  \ 等于 `length`。\n\n现在我们知道了元素所在的位置，需要为它创建空间。由于列表是排序的，Becca 必须被放入 `Info(location)`\
  \ 处。当然，这个位置可能已经被占用。为了“为新元素创建空间”，我们必须将其后的所有列表元素（从 `location` 到 `length – 1`）向下移动。然后，只需将\
  \ `item` 赋值给 `Info(location)` 并增加 `length`。图 4.1c 显示了结果列表。\n\n在编写代码之前，让我们先用算法的形式总结这些观察结果：\n\
  \n回 `PutItem` 的前提条件是 `item` 不已存在列表中，因此我们不需要在 `switch` 语句中 `EQUAL` 作为标签。将列表表示法转换为基于数组的实现，我们得到了如下函数：\n\
  \n```\nvoid SortedType::PutItem(ItemType item)\n{\n  bool moreToSearch;\n\n  int\
  \ location = 0;\n\n  moreToSearch = (location < length);\n\n  while (moreToSearch)\n\
  \  {\n    switch (item.ComparedTo(info[location]))\n  {\n    case LESS   : moreToSearch\
  \ = false;\n                  break;\n    case GREATER : location++;\n         \
  \         moreToSearch = (location < length);\n                  break;\n\n  }\n\
  \ }\n\n for (int index = length; index > location; index--)\n   info[index] = info[index\
  \ – 1];\n\n info[location] = item;\n\n length++;\n\n}\n```\n\n如果新元素属于列表的开头或结尾，这个函数能工作吗？画幅图来自己确认函数在每种情况下是如何工作的。\n\
  \n### `DeleteItem` 函数\n\n在讨论无序列表 ADT 的 `DeleteItem` 函数时，我们提到过如果列表是排序的，我们必须将元素向上移动一位以覆盖被删除的元素。元素向上移动一位是元素向下移动一位的镜像。寻找要删除项的循环控制与无序版本相同。\n\
  \n仔细检查此算法并确信它是正确的。尝试删除第一个项目和最后一个项目的情况。\n\n```\nvoid SortedType::DeleteItem(ItemType\
  \ item)\n{\n  int location = 0;\n\n  while (item.ComparedTo(info[location]) != EQUAL)\n\
  \    location++;\n\n  for (int index = location + 1; index < length; index++)\n\
  \    info[index - 1] = info[index];\n\n  length--;\n}\n```\n\n### 改进 `GetItem` 函数\n\
  \n如果列表没有排序，搜索某个值的唯一方法是从开头开始并查看列表中的每个项目，将我们正在搜索的项目的键成员与列表每个项目的键成员轮流进行比较。我们在无序列表 ADT\
  \ 的 `GetItem` 操作中使用过这种算法。\n\n如果列表按键值排序，有两种改进搜索算法的方法。第一种方法是当我们通过如果项目存在则应该被找到的位置时停止。查看图\
  \ 4.2a。如果你正在搜索 Chris，与 Judy 的比较将显示 Chris 是 `LESS`。因此，你已经通过了 Chris 如果存在则应该被找到的位置。此时，你可以停止并返回\
  \ `found` 为 `false`。图 4.2b 显示了当你搜索 Susy 时发生的情况：`location` 等于 `4`，`moreToSearch`\
  \ 为 `false`，且 `found` 为 `false`。\n\n（注：原文后续部分存在大量重复段落，此处已根据逻辑要求去重并翻译）\n\n\n\n\n\
  ```\nSet first to 0\nSet last to length – 1\nSet found to false\nSet moreToSearch\
  \ to (first <= last)\nwhile moreToSearch AND NOT found\n    Set midPoint to (first\
  \ + last) / 2\n    switch (item.ComparedTo(Info[midPoint]))\n        case LESS \
  \     :        Set last to midPoint – 1\n                                Set moreToSearch\
  \ to (first <= last)\n        case GREATER   :        Set first to midPoint + 1\n\
  \                                Set moreToSearch to (first <= last)\n        case\
  \ EQUAL     :        Set found to true\nreturn item\n```\n\n注意，当我们查看搜索区域的半部分或上半部分时，我们可以忽略中间点，因为我们知道它不在那里。因此，`last`\
  \ 被设置为 `midPoint – 1`，或者 `first` 被设置为 `midPoint + 1`。我们算法的代码版本如下：\n\n```cpp\nItemType\
  \ SortedType::GetItem(ItemType item, bool& found)\n{\n  int midPoint;\n  int first\
  \ = 0;\n  int last = length – 1;\n  bool moreToSearch = first <= last;\n  found\
  \ = false;\n  while (moreToSearch && !found)\n  {\n    midPoint = (first + last)\
  \ / 2;\n    switch (item.ComparedTo(info[midPoint]))\n    {\n      case LESS   \
  \ : last = midPoint – 1;\n                     moreToSearch = first <= last;\n \
