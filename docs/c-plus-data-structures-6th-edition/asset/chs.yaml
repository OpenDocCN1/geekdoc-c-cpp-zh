  \n以下是这些职责的规范：\n\n注意，数学集合的定义并没有提到集合为“满”的情况。然而，为了实现集合 ADT，我们必须考虑这种可能性。`Store` 和 `Delete`\
  \ 实际上并不是必须的。我们可以创建一个空集合和一个包含一个项的集合，通过对两者执行 `union` 操作来实现 To `Store`。我们可以创建一个包含要删除项的集合，通过对该集合与包含该单项的集合执行\
  \ `difference` 操作来实现 `Delete`。然而，拥有 `Store` 和 `Delete` 会使处理变得更容易。\n\n### 应用级\n\n\
  集合的一个属性是，将一个已经存在的项放入集合中不会改变集合。（你发现规范中写的正是这个意思了吗？）同样，删除一个不存在的项也不会改变集合。这些属性在判断项是否出现在文本段中非常有用，例如。文本中的所有字符都可以放入一个集合中。当处理完成后，集合将包含文本中出现的每个项的恰好一个。\n\
  \n### 实现级\n\n实现集合有两种基本方法。第一种方法是在集合变量的表示中显式记录基类型（`ItemType`）中每个项的存在或缺失。第二种仅记录特定时刻集合变量中的项。如果一个项没有列出在集合中，那么它不在集合中。也就是说，每个项在集合中的存在是显式记录的；项的缺失是隐式的。\n\
  \n#### 显式表示\n\n在每个集合变量中对基类型的每个项进行显式表示被称为位向量表示。通过一一映射将基类型（`ItemType`）中的每个项与一个布尔标志位匹配。如果该项在集合变量中，标志位为\
  \ `true`；如果该项不在集合变量中，标志位为 `false`。具有内置集合数据类型的语言使用这种技术，其中布尔标志位由位（bit）表示——因此名为“位向量”。\n\
  \n我们可以使用基于数组的实现来实现位向量，因为基类型的基数告诉了我们数组的大小。当然，这种技术对于无限基类型，甚至是相当大的基类型并不行的。但是对于有限的基类型，它的效果非常好。例如，如果我们想实现一个基类型为大写字母的集合类型，我们可以用一个从\
  \ 0 到 25 索引的布尔数组表示每个集合实例。位置 0 的标志代表字母 A 的存在或缺失，位置 1 的标志代表字母 B 的存在或缺失，依此类推。空集合将是一个全为\
  \ `false` 值的数组；全集将是一个全为 `true` 值的数组。构造函数创建一个数组并将每个位置设置为 `false`。所有的二进制操作都可以使用布尔操作符完成。\n\
