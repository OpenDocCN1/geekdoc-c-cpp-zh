  \ | 文件分隔 |\n| `GS` | 组分隔 |\n\n## 附录 E：标准模板库 (STL)\n\n### 概述\n\nSTL 是 C++ 的子集为 C++\
  \ 程序员提供了三类设施：容器、迭代器和算法。容器有：\n\n| `list` | 可以正向和反向遍历的顺序访问列表 |\n| `vector` | 一维数组抽象，具有随机访问能力\
  \ |\n| `stack` | 栈，具有 LIFO 访问特性 |\n| `queue` | 队列，具有 FIFO 访问特性 |\n| `deque` | 双端队列（可以在两端插入和删除），具有随机访问能力\
  \ |\n| `set` | 数学集合的抽象 |\n\n容器类是模板类，因此例如我们可以声明 `list<int>`、`stack<float>` 等。\n\n\
  ### 迭代器与算法\n\n为了引入 STL 迭代器和算法的概念，我们从以下代码段开始，它输入若干值并反序输出。代码行有编号，以便我们在后的讨论中引用。\n\n\
  ```cpp\n1  #include <iostream>\n2  #include <list>        // 用于 list<T> 类\n3  #include\
  \ <algorithm>   // 用于 reverse() 函数\n4  using namespace std;\n5  list<int> nums;\n\
  6  list<int>::iterator iter;\n7  int number;\n8  cin >> number;\n9  while (number\
  \ != -9999)\n10 {\n11   nums.push_back(number);\n12    cin >> number;\n13 }\n14\
  \ for (iter = nums.begin(); iter != nums.end(); iter++)\n15   cout << *iter << endl;\n\
  16 reverse(nums.begin(), nums.end());\n17 for (iter = nums.begin(); iter != nums.end();\
  \ iter++)\n18   cout << *iter << endl;\n```\n\n在这段代码中，第 2 行和第 3 行导致头文件 `list` 和\
  \ `algorithm` 的插入，允许我们使用模板类和名为 `reverse` 的函数。第 5 行创建一个名为 `nums` 的列表，其组件类型为 `int`。第\
  \ 6 行声明 `iter` 的类型为 `list<int>::iterator`，这是定义在 `list<int>` 类内部的数据类型。我们稍后会讨论它的用法。\n\
  \n\n\n\n接下来，第 14 和 15 行的循环从头到尾遍历 `nums` 列表，依次打印列表中的每个项。在第 6 行定义的变量 `iter` 是一个 STL\
  \ 迭代器。从某种意义上说，STL 迭代器与本文介绍过的迭代器概念相似（一个命名类似于 `GetNext` 的类成员函数）。STL 迭代器和 `GetNext`\
  \ 操作都允许在容器中进行循环，一次处理一个项目。另一方面，STL 迭代器是一个比 `GetNext` 操作更底层的概念：它仅仅代表了项目在容器中的位置。因此，STL\
  \ 迭代器是指针概念的泛化。迭代器允许 C++ 程序访问容器存储的项，而无需获知容器的内部结构。操纵迭代器的语法与指针几乎相同。要访问由迭代器 `iter` 指向的项，编写\
  \ `*iter`。要使迭代器向前移动以指向容器中的下一个项，编写 `iter++`。迭代器的内部工作机制（例如在容器中移动位置的细节）对用户是隐藏的，并且取决于所使用的容器。每个\
  \ STL 容器类都定义了一个或多个迭代器类型，例如 `list<int>::iterator`。迭代器可以根据特定的容器实现为普通指针或类对象。\n\n现在回到第\
  \ 14 和 15 行。在第 14 行中，变量 `iter` 初始化为函数调用 `nums.begin()` 返回的值。名为 `begin` 的函数是 `list`\
  \ 类的成员，它返回列表第一个项的位置。（在 C++ 文献中——甚至在本附录的某些地方——使用了“返回指向第一个项的迭代器”这种表述。真实意思是“返回……的位置”。你甚至可以说“返回指向……的指针”或“返回……的地址”，尽管无法保证特定的迭代器一定实现为\
  \ C++ 指针变量。）在第 14 行 `for` 语句的头部中，循环条件是 `iter != nums.end()`。名为 `end` 的函数是 `list`\
  \ 类的成员，它返回一个虚拟列表项的位置，该位置位于最后一个实际列表项之后。（这个位置通常被称为尾位置 past-the-end position）。`for`\
  \ 语句头部的第三部分 `iter++` 表示将迭代器移动以指向下一个列表项。因此，每次循环时，我们都会获得下一个列表项的位置，并持续循环直到越过列表末尾。在每次循环迭代中，我们执行第\
  \ 15 行所示的循环体：我们输出迭代器 `iter` 所引用（或“指向”）的值。请注意，输出语句使用的是表达式 `*iter` 而不是 `iter`。也就是说，我们想要打印列表项，而不是它的位置。\n\
  \n接下来，看程序的第 16 行。通过 `algorithm` 头文件提供的 `reverse` 函数接受两个迭代器作为参数——容器中的起始位置和结束位置——并将从起始位置到结束位置（但不包括结束位置）的所有项按反向顺序排列。因此，在第\
  \ 16 行中，`nums` 列表中的所有项都得到了处理，因为第二个参数 `nums.end()` 指定了尾位置。最后，第 17 和第 18 行遍历 `nums`\
  \ 列表，打印列表的新内容。\n\n`reverse` 函数是 STL 算法的一个示例。在计算机科学术语中，算法是一个抽象的过程性概念，是解决问题的配方。在编程语言中实现的算法是一个程序。每个程序都实现一个或多个算法。相比之下，STL\
  \ 在一个狭窄的意义上定义了算法术语。STL 算法（或简单称为算法）是一个其参数类型为迭代器的模板函数。每个算法的描述都指定了它作为参数时所需的迭代器类型。在附录的后后部分，我们将描述\
  \ STL 提供的各种算法。\n\n让我们来看另一个 STL 容器类的示例：`vector`。`vector` 对象是一维数组的抽象，可以像内置数组一样被使用：\n\
  \n```cpp\n#include <vector>          // 用于 vector<T> 类\n\n  ⋮\n\nvector<float> arr(100);\
  \    // 一个拥有 100 个元素的数组\n\n  ⋮\n\narr[24] = 9.86;            // 允许通过下标随机访问\n\narr[i+j]\
  \ = arr[k];         // 下标（索引）表达式\n```\n\n然而，`vector` 类比内置数组通用得多。内置数组的一个主要局限性是数组大小在编译时是固定的，在程序运行时不能增长或缩小。相比之下，`vector`\
  \ 的大小可以在运行时变化。假设我们要在运行时输入未知数量的整数值并存储在数组中。使用内置数组，我们必须预估其大小，我们的估计可能太大（浪费内存）或太小（程序会出错）。使用\
  \ `vector`，我们不需要指定它的大小，可以让它可以根据需要增长：\n\n```cpp\nvector<int> vec;               \
  \      // 初始大小为 0\n\nint inputVal;\n\ncin >> inputVal;\n\nwhile (cin)          \
  \                // 假设在发生 EOF 之前\n\n{                                    // 输入了\
  \ 50 个数字\n\n  vec.push_back(inputVal);\n\n  cin >> inputVal;\n\n}\n\ncout << vec.size()\
  \ << endl;          // 输出 50\n\nfor (int i = 0; i < vec.size(); i++) // 我们仍然可以使用\n\
  \n  cout << vec[i] << endl;            //下标\n```\n\n在前面的代码中，`vec` 的大小随需要不断增加，内存是动态分配的。注意代码中的\
  \ `push_back` 既是 `vector<int>` 的成员，也是 `list<int>` 的成员。由于这种统一性，将代码从一个上下文复用到另一个上下文非常容易。例如，我们如何向\
  \ vector 输入多个整数并以反序输出它们？答案是：回到我们第一个 1 到 18 行的示例，只需修改第 2、5 和 6 行：\n\n```cpp\n2 #include\
  \ <vector>        // 用于 vector<T> 类\n\n5 vector<int> nums;\n\n6 vector<int>::iterator\
  \ iter;\n```\n\n程序的所有其他行保持完全相同，因为\n\n*   `list` 和 `vector` 具有 `push_back`、`begin`\
  \ 和 `end` 成员函数且语义相同。\n*   `reverse` 算法不在乎处理的是什么类型的容器，只要它接收的是容器的起始位置和尾位置。第一次深入学习\
  \ STL 时，可能不知道从哪里开始。在 STL 中，容器是库的核心，但如果不了解 STL 算法和迭代器要求，很难理解容器，反之亦然。在 STL 中，算法扩展了容器的功能，而迭代器使容器和算法能够工作。事实上，如果用户想要构建带有迭代器的容器或创建符合\
  \ STL 要求的算法，这些结构将与 STL 组件正确交互。\n\n初学者学习 STL 时遇到的一个问题是，那里使用的一些术语（如迭代器和算法）与计算机科学中的常用用法不同。正如计算机科学中的每个新学科一样，必须学习新的词汇。STL\
  \ 非常值得学习，因为它是一个快速、灵活且实库。\n\nISO/ANSI C++ 标准要求每个合规编译器都提供完整的 STL。STL 组件的设计良好，可以很好地工作。它们的性能快于熟练程序员在学习使用该库的时间内能创建的任何东西。\n\
  \n\n\n\n我们必须指出，在 `STL` 的设计中，标准委员会做出了有意决定，提供速度而非安全性，因此大多数 `STL` 组件都不会抛出异常。大多数 `STL`\
  \ 成员函数要么成功，要么什么都不做。除了随机访问容器支持的 `at()` 成员函数外，我们不再对 `STL` 容器和算法中的异常进行进一步讨论。关于该主题的进一步讨论，请参阅\
  \ 1998 ISO/ANSI C++ 标准 14882 以及 Josuttis 的《C++ 标准库》（The C++ Standard Library）。（请参见本附录末尾的参考文献。）\n\
  \n现在我们按照以下顺序详细检查 `STL` 组件：迭代器、容器和算法。\n\n### 迭代器 (Iterators)\n\n在许多数据结构和容器中，我们需要了解项目在结构中的位置或位置。在\
  \ `C` 以及 `STL` 出现之前的 `C++` 中，指针满足了这一需求。指针的优点是速度快，但需要非常小心以避免陷阱。`STL` 提供了 `iterator`\
  \ 作为指针的替代，它与指针一样高效，但安全得多。每个 `STL` 容器都提供一个或多个适用于其容器内部结构的迭代器类型。\n\n我们已经看到，迭代器是指定 `STL`\
  \ 容器中位置的对象，并允许 `STL` 算法遍历容器中的项目。这是通过一个操作 `iterator` 的通用接口来实现的。具体来说，每种迭代器类型必须至少支持以下操作：\n\
  \n| 前缀 `*` | 解引用（访问当前指向的项） |\n| --- | : --- |\n| `++` | 递增（指向下一个项目） |\n\n不同类别的迭代器需要额外的操作。\n\
  \n一个关键点是，行为定义了迭代器。任何表现得像迭代器的东西都是迭代器。事实证明，类型为 `int*`（指向 `int` 的指针）变量可以作为内置 `int`\
  \ 数组的迭代器。这一事实使得许多泛型 `STL` 算法可以直接用于内置数组。相比之下，指针不能作为 `list` 容器的迭代器。如果 `list` 对象恰好是用动态分配节点的链表实现的，那么指针操作\
  \ `p++` 几乎不会指向链表中的下一个节点（因为列表节点不太可能位于连续的内存位置中）。因此，像 `list<int>` 这样的类提供了一个数据类型 `list<int>::iterator`，它以自己的方式重载了\
  \ `++` 运算符，将迭代器移动到列表中的下一个项目。\n\n总结来说，迭代器可以是普通指针（如果容器是内置数组），也可以定义了符合 `STL` 要求的指针操作的类对象。\n\
  \n### 迭代器分类 (Iterator Categories)\n\n不同的 `STL` 容器具有不同的属性，因此各种容器的迭代器也具有不同的属性。同样，不同的\
  \ `STL` 算法对其使用的迭代器有不同的属性要求。例如，对容器需要随机访问；否则性能会受到影响。因此，迭代器按属性强度的增加分类为输入迭代器、输出迭代器、前向迭代器、双向迭代器和随机访问迭代器。图\
  \ A.1 显示了迭代器类别之间的关系。正如我们之后看到的，如果一个 `STL` 算法需要特定类别的迭代器，程序员可以使用该类别或任何更强类别的迭代器，但不能使用较弱类别的迭代器。\n\
  \n![](img/f0a-01.jpg)\n\n图 A.1 迭代器类别之间的关系\n\n一些额外的迭代器类型是反向迭代器、流迭代器、插入迭代器和原始存储迭代器。反向迭代器允许从后到向前遍历容器。流迭代器允许你通过\
  \ `STL` 算法读写文件。插入迭代器允许向容器添加新项目，而不是覆盖迭代器指向的位置。我们这个附录的空间内只能讨论其中的第一种。然而，附录末尾的参考文献允许你探索其他以及更多内容。\n\
  \n### 输入迭代器 (Input Iterators)\n\n输入迭代器每次只能向前移动一个项目。此外，它们只能通过解引用来从集合中获取（而不是存储到）一个项目。表\
  \ A.1 显示了输入迭代器上允许的操作。\n\n输入迭代器的一个示例是流迭代器，它将键盘输入流视为“容器”并遍历流，一个接一个地获取输入字符。（`iostream`\
  \ 头文件提供了此类迭代器）。我们在此附录中不探讨输入流迭代器。\n\n| 下方的 `r` 和 `r2` 是输入迭代器 |\n| --- | : --- |\n\
  | `*r` | 提供对 `r` 所指位置项的读取访问 |\n| `r++` | 将 `r` 在容器中向前移动一个位置；返回旧位置 |\n| `++r` | 将\
  \ `r` 在容器中向前移动一个位置；返回新位置 |\n| `r == r2` | 如果 `r` 和 `r2` 表示相同位置则返回 `true`，否则返回 `false`\
  \ |\n| `r != r2` | 如果 `r` 和 `r2` 表示不同位置则返回 `true`，否则返回 `false` |\n\n表 A.1 输入迭代器上的操作\n\
  \n### 输出迭代器 (Output Iterators)\n\n与输入迭代器一样，输出迭代器每次只能向前移动一个项目。然而，输出迭代器只能通过解引用向指定位置存储值（而不是从该位置获取值）。表\
  \ A.2](#app05.xhtml_app05table2) 显示了输出迭代器上允许的操作。\n\n初看起来，我们可以修改东西但不能获取它似乎很奇怪，但如果你考虑到输出迭代器通常用于向输出流发送数据（如\
  \ `cout`），这就更有意义了。（`iostream` 头文件提供了此类迭代器。）其思想是将输出流视为字符的“容器”，并使用迭代器逐个写入字符。我们在此附录中不进一步讨论流迭代器。\n\
  \n### 前向迭代器 (Forward Iterators)\n\n我们已经看了两类遍历容器的迭代器，一种只允许获取，另一种只允许存储。通常我们希望在遍历容器时在特定位置获取并存储值。前向迭代器允许我们这样做。具体来说，前向迭代器的有效操作与输入迭代器相同，增加了存储引用项的能力（参见表\
  \ A.3](#app05.xhtml_app05table3）。\n\n| 下方的 `r` 是输出迭代器 |\n| --- | : --- |\n| `*r\
  \ = value` | 在 `r` 指定的位置存储 `value` |\n| `r++` | 将 `r` 在容器中向前移动一个位置；返回旧位置 |\n| `++r`\
  \ | 将 `r` 在容器中向前移动一个位置；返回新位置 |\n\n表 A.2 输出迭代器上的操作\n\n表 A.3 前向迭代器上的操作\n\n| 下方的 `r`\
  \ 和 `r2` 是前向迭代器 |\n| --- | : --- |\n| `*r` | 提供对 `r` 所指位置项的读取访问 |\n| `*r = value`\
  \ | 在 `r` 指定的位置存储 `value` |\n| `r++` | 将 `r` 在容器中向前移动一个位置；返回旧位置 |\n| `++r` | 将 `r`\
  \ 在容器中向前移动一个位置；返回新位置 |\n| `r == r2` | 如果 `r` 和 `r2` 表示相同位置则返回 `true`，否则返回 `false`\
  \ |\n| `r != r2` | 如果 `r` 和 `r2` 表示不同位置则返回 `true`，否则返回 `false` |\n\n以下是一个演示使用前向迭代器的泛型算法：\n\
  ```\n\n\n\n\n\n```\n// 在任何支持前向迭代器的容器中，\n\n// 将每个出现的 x 值替换为 y 值。\n\ntemplate <class\
  \ ForwardIterator, class T>\nvoid replace(ForwardIterator first, ForwardIterator\
  \ pastLast, const T& x,\n             const T& y)\n{\n  while (first != pastLast)\n\
  \  {\n    if (*first == x)\n      *first = y;\n\n    ++first;\n  }\n} \n```\n\n\
  请注意，第二个参数 `pastLast` 必须表示指向最后一个待考虑元素的后一个位置。换句话说，`replace` 函数替换从 `first` 所指位置开始、一直到但不包括\
  \ `pastLast` 所指位置的容器中的项。或者，我们也可以这样说：该算法处理范围在 `first`, `pastLast`)` 内的元素，这是一种数学符号，表示一个左端闭（包含左端点）但右端开（不包含右端点）的区间。\n\
  \n对 `replace` 函数调用可能如下：\n\n```\nlist<int> lst;\n  ⋮\nreplace(lst.begin(), lst.end(),\
  \ 25, 125);\n```\n\n回想本附录前面的内容，`lst.begin()` 返回列表第一个项的位置，`lst.end()` 返回末尾之后的位置。\n\
  \nSTL 在实现 `replace` 等算法时，使用的是能够完成当前任务的最弱迭代器。在 `replace` 中，前向迭代器就足够了。在指定使用前向迭代器的地方，可以使用任何更强大的迭代器。\n\
  \n### 双向迭代器\n\n双向迭代器具有前向迭代器的所有属性，但允许在容器中进行反向和正向的移动（参见[表 A.4）。\n\n| 在双向迭代器操作的基础上，增加以下操作\
  \ |\n| :--- | :--- |\n| `r--` | 在容器中向后移动 `r` 个位置；返回旧位置 |\n| `--r` | 在容器中向后移动 `r`\
  \ 个位置；返回新位置 |\n\n表 A.4 双向迭代器上的操作\n\n添加递减运算符使得某些算法的实现变得简单。我们将看到，所有的 STL 容器都支持双向迭代器或随机访问迭代器。`list`\
  \ 容器提供了双向迭代器。（因此，有些人喜欢将 `list` 视为双向链表的抽象，因为它允许在两个方向上进行高效遍历。）\n\n### 随机访问迭代器\n\n\
  随机访问迭代器具有双向迭代器的所有属性，但支持额外的操作，允许对容器中的任何项进行随机（直接）访问（参见表 A.5）。\n\n`vector` 容器提供了随机访问迭代器，这是很有意义，因为\
  \ `vector` 是一维数组的抽象。\n\n我们还没有提到反向迭代器，它们具有相当性。我们将推迟到讨论 `vector` 容器时再介绍这些迭代器，因为 `vector`\
  \ 既支持反向迭代器，也支持随机访问迭代器。\n\n### 容器\n\nSTL 提供了三种容器：序列容器、容器适配器和关联性容器。\n\n在序列容器中，容器中的每个项都有一个位置，该位置取决于插入的时间和地点，而不取决于项的值。序列容器有\
  \ `vector`、`list` 和 `deque`。这些容器有时被称为“一等容器”。每个 STL 容器都提供一组不同的操作，这些操作在时间和空间复杂度上有不同的权衡。应根据情况选择容器。`vector`\
  \ 对其元素提供随机访问，并且在末尾（但不是中间）的插入和删除非常高效。C++ 标准建议 `vector` 是应该默认使用的序列类型。如果你的程序需要在序列中间频繁地插入和删除，则应该使用\
  \ `list`。如果需要在序列的开头和结尾频繁插入和删除，则应该使用 `deque`。\n\n| 在双向迭代器操作的基础上，增加以下操作 |\n| :---\
  \ | :--- |\n| `r[i]` | 为 `r` 所指位置的项提供索引读取或存储访问 |\n| `r += i` | 在容器中向前移动 `i` 个位置\
  \ |\n| `r -= i` | 在容器中向后移动 `i` 个位置 |\n| `r + i` | 返回在容器中 `r` 之后 `i` 个位置的迭代器值 |\n\
  | `r − i` | 返回在容器中 `r` 之前 `i` 个位置的迭代器值 |\n| `r − r2` | 返回 `r` 和 `r2` 所指位置之间的项的数量\
  \ |\n| `r < r2` | 仅当 `r` 所指的位置在 `r2` 所指位置之前时，返回 `true` |\n| `r > r2` | 仅当 `r` 所指的位置在\
  \ `r2` 所指位置之后时，返回 `true` |\n| `r <= r2` | 仅当 `r` 所指的位置不在 `r2` 所指位置之后时，返回 `true`\
  \ |\n| `r >= r2` | 仅当 `r` 所指的位置不在 `r2` 之前时，返回 `true` |\n\n表 A.5 随机访问迭代器上的操作\n\n\
  关联性容器有 `map`、`multimap`、`set` 和 `multiset`。这些容器基于关联数组的概念，这是一种存储值对的数据结构：键和一个与键关联的值。我们稍后会讨论关联容器，但在附录中不深入探讨它们。\n\
  \n容器适配器有 `queue`、`stack` 和 `priority_queue`。这些被称为适配器，是因为它们使用一种序列容器（`vector`、`list`\
  \ 或 `deque`）来实际存储项，并仅向程序员呈现不同的接口（栈、队列或优先级队列）。\n\n我们首先查看序列容器 `vector`、`list` 和 `deque`，以及标准库提供的另一个类：`string`。\n\
  \n### `vector<T>` 类\n\n`vector` 容器提供了对变长序列的快速随机访问，以及在 vector 末尾的高效插入和删除。`vector<T>`\
  \ 是用动态分配数组实现的模板类，可以用于任何可赋值和可拷贝的类型 `T`。这意味着如果 `T` 是类或结构体类型，则必须为 `T` 定义 `operator=`\
  \ 和拷贝构造函数。\n\n`vector` 的行为类似于 C++ 数组，主要区别在于内置数组的大小是固定的，必须在编译时确定，而 `vector` 会自动扩展以容纳新元素。与第\
  \ 3 章 中的 List ADT 一样，`vector` 将存储分为包含插入项的初始段和一个称为预留（reserve）的未使用项段。与 List ADT 不同，当预留耗尽时，`vector`\
  \ 会分配当前分配两倍的新内存空间，将数据拷贝到新内存中，然后释放旧内存空间。此操作被称为调整大小（resize）。有一个可用的成员函数执行此操作，但大多数情况下它是隐式发生的。这种分配更多内存的过程有时被称为重新分配（reallocation）。\n\
  \n\n\n\n\n我们将 `vector` 的第一个位置称为 `front`，将最后一个使用的位置称为 `back`。`vector` 容器支持在 `O(1)`\
  \ 的均摊时间内在容器末尾进行插入和删除。执行某项任务的“均摊时间”是两个因素的加权平均值：执行主任务的时间（通常耗时短且发生频率高）以及执行另一个关联任务所需的额外时间（通常耗时长得多但发生频率低）。对于\
  \ `vector` 而言，插入操作耗时很短但概率很高；额外任务是在保留空间耗尽时重新分配内存并复制数据，这需要很长时间，但概率非常低。\n\n以下是 `vector`\
  \ 容器的一些属性：\n\n*   `vector` 提供随机访问，可以通过不检查范围的索引（`[]`或带有范围检查的 `at()` 成员函数实现。\n\n*\
  \   `vector` 迭代器是随机访问迭代器。因此，其行为本质上类似于 C++ 指针。迭代器可以被索引，并应用指针算术。迭代器的类型定义在类 `vector<T>`\
  \ 内部，并可以通过以下方式声明：\n\n    ```\n    vector<T>::iterator vIter;\n    ```\n\n*   在 `vector`\
  \ 的末尾进行插入和删除可以在 `O(1)` 时间内完成，在其他位置则需要 `O(N)` 时间。\n\n*   插入和删除会导致任何指向删除位置之后元素的迭代器失效。\n\
  \n与 `vector` `v` 相关的有两个大小。一个是由 `v.size()` 返回的值，表示插入到 `vector` 中的元素数量；另一个由 `v.capacity()`\
  \ 返回的值，表示已插入元素数量加上保留空间中的位置数量。在图 A.2 中，容量为 9，大小为 4。\n\n函数调用 `v.front()` 返回 `vector`\
  \ 中的第一个元素，`v.back()` 返回最后一个元素。存储在保留区域中的值是无法访问的。`v.begin()` 指向的位置是索引 0 的位置，这也是 `v.front()`\
  \ 函数获取元素的位置。`v.end()` 指向的是末尾之后的位置（one-past-the-end）。它是 `v.back()` 获取元素位置的下一个。\n\n\
  为了描述 `vector<T>` 类的成员函数，我们现在提供了一系列表格以及示例（表 A.6）。请注意，我们仅包含了可用成员函数的代表性样本。要查看完整列表，您应该咨询附录末后的参考文献。\n\
  \n![](img/f0a-02.jpg)\n\n图 A.2 `vector` 内存分配\n\n| `vector<T> v;` | 默认构造函数。创建一个创建的\
  \ `vector` 对象 `v`。 |\n\n| `vector<T> vNew(vOld);` | 拷贝构造函数。创建一个与相同类型的 `vector` `vOld`\
  \ 拷贝的 vector `vNew`。所有成员均被复制。 |\n\n| `vector<T> v(n);` | 创建一个大小为 `n` 的 `vector`，每个元素都通过类型\
  \ `T` 的默认构造函数构造。 |\n\n| `vector<T> v(n, value);` | 创建一个大小为 `n` 的 `vector`，每个元素都初始化为类型\
  \ `T` 的值 `value`。 |\n\n| `vector<T> v(first, pastLast);` | 创建一个 `vector`，其元素是另一个具有相同基础类型\
  \ `T` 的任意容器子范围的拷贝。该子范围为 `[first, pastLast)`——即从迭代器 `first` 指向的位置开始，到但不包含迭代器 `pastLast`\
  \ 指向的位置。 |\n\n| `v.~vector<T>()` | 析构函数。释放 `v` 的存储空间并调用其类型为 `T` 的元素的析构函数（如果有）。通常不会显式调用；当\
  \ `v` 超出作用域时，会自动调用析构函数。 |\n\n表 A.6 `vector` 构造函数和析构函数\n\n这是一个短程序，说明了其中几个构造函数的用法。\n\
  \n```cpp\n// 代码演示使用基本类型和用户定义类型作为基础类型使用 vector 构造函数。\n\n#include <vector>    // 用于\
  \ vector<T> 类\n\n#include <cassert>   // 用于 assert() 函数\n\nstruct node\n{\n  node()\n\
  \  {\n    iValue = 0;\n    dValue = 0.0;\n  }\n  int iValue;\n  double dValue;\n\
  };\n\nint main()\n```\n\n| `v[index]` | 无范围检查的索引访问。索引范围为 0 到 `v.size() − 1`。表达式\
  \ `v[index]` 可能会返回一个值或被赋值一个值。 |\n\n| `v.at(index)` | 带有范围检查的索引访问。索引范围为 `0` 到 `v.size()\
  \ − 1`。如果 `index` ≥ `v.size()`，则抛出 `out_of_range` 异常。表达式 `v.at(index)` 可能会返回一个值或被赋值一个值。\
  \ |\n\n| `v.front()` | 返回 vector 中的第一个元素。与 `v[0]` 或 `v.at(0)` 相同。 |\n\n| `v.back()`\
  \ | 返回 vector 中的最后一个元素。与 `v[v.size()]` 相同。 |\n\n表 A.7 `vector` 元素访问\n\n```cpp\n\
  // 演示元素访问\n// 详情表格\n```\n\n| `v.push_back(item)` | 将 `item` 插入到 vector 的末尾。 |\n\n\
  | `v.insert(iter, item)` | 在迭代器 `iter` 指向的位置之前插入 `item`。 |\n\n| `v.insert(iter,\
  \ n, item)` | 在迭代器 `iter` 指向的位置插入 `n` 个 `item` 的拷贝。 |\n\n| `v.swap(vOther)` | 交换\
  \ vector `v` 和 `vOther` 的内容。两个 必须类型相同。 |\n\n表 A.8 `vector` 插入成员函数\n\n```cpp\n//\
  \ 演示插入成员函数\n#include <vector>     // 用于 vector<T> 类\n#include <iostream>\n\nint\
  \ main()\n{\n  using namespace std;\n  const int SIZE = 12;\n  int array[SIZE] =\
  \ {1, 2, 3, 5, 8, 13, 21, 25, 16, 9, 4, 1};\n\n  vector<int> v(12);\n  vector<int>\
  \ w(12);\n\n  // 使用 push_back 将 array 中的元素赋予 v\n  for (int i = 0; i < SIZE; i++)\n\
  \    v.push_back(array[i]);\n\n  // 将 0 到 SIZE – 1 的值赋予 w\n  for (int i = 0; i <\
  \ SIZE; i++)\n    w.push_back(i);\n\n  // 显示 v\n  for (int i = 0; i < SIZE; i++)\n\
  \    cout << v[i] << endl;\n\n  // 交换 v 和 w 的身份\n  v.swap(w);\n\n  // 然后显示 v，再 w\n\
  \  for (int i = 0; i < SIZE; i++)\n    cout << v[i] << endl;\n\n  for (int i = 0;\
  \ i < SIZE; i++)\n    cout << v[i] << endl;\n}\n```\n\n| `v.pop_back();` | 从 `v`\
  \ 中删除最后一个元素。（这仅更改内部指针。） |\n\n| `v.erase(iter)`` | 删除迭代器 `iter` 指向的元素。（将 `iter` 指向的位置之后的数据复制到\
  \ `iter` 指向的位置，然后连续复制直到最后一个元素被复制。调整内部指针。） |\n\n\n\n\n\n## 表 A.9 用于删除元素的 `vector`\
  \ 成员函数\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `v.erase(first, pastLast);` | 删除范围 `[first`,\
  \ pastLast)` 内的所有元素 |\n| `v.empty()` | 如果 `v` 不包含元素则返回 `true`，否则返回 `false` |\n|\
  \ `v.size()` | 返回 `v` 中现有的元素数量 |\n| `v.capacity()` | 返回容器中的元素数量 + 预留内存中的可用位置 |\n\
  | `v.reserve(n);` | 将容器容量增加到 `n` |\n| `v.resize(n, value);` | |\n\n```\nif (n >\
  \ v.size())\n  v.insert(v.end(), n – v.size(), value);\nelse if (n < v.size())\n\
  \  v.erase(v.begin() + n, v.end());\n```\n\n## 表 A.10 与大小相关的 `vector` 成员函数\n\n|\
  \ 函数 | 描述 |\n| :--- | :--- |\n| `vector<T>::iterator itr;` | 为 `vector<T>` 创建一个随机访问迭代器\
  \ |\n| `vector<T>:: reverse_iterator itr;` | 为 `vector<T>` 创建一个（随机访问）反向迭代器 |\n|\
  \ `v.begin()` | 返回指向第一个元素位置的随机访问迭代器 |\n| `v.end()` | 返回指向末尾之后虚拟虚拟元素的随机访问迭代器 |\n\
  | `v.rbegin()` | 返回指向反向迭代中第一个元素（即容器中最后一个元素）位置的反向迭代器 |\n| `v.rend()` | 返回指向反向迭代中末尾之后虚拟元素位置的反向迭代器（即容器中第一个元素之前的虚拟元素）\
  \ |\n\n## 表 A.11 与迭代器相关的 `vector` 成员函数\n\n重新分配会使所有在重新分配之前指向 vector 的引用、指针和迭代器失效，因为这些迭代器值都指向旧的（之前分配的）内存。可以保证，在调用\
  \ `reserve()` 之后发生的插入，在 vector 达到 `reserve()` 调用中指定的尺寸之前，不会发生重新分配。\n\n在查看下一个序列容器\
  \ `list` 之前，我们先检查 `string` 类，它与 `vector<char>` 相似，但具有更适合字符字符串的成员函数和优化。\n\n### `string`\
  \ 类\n\n本节介绍了 C++ 标准库中的 `string` 类。虽然 `string` 不是 STL 的一部分，但它是标准库不可或缺的一部分。掌握 `string`\
  \ 类对于程序员的工具箱来说是关重要的。\n\n标准库定义了一个 `char_traits` 类，定义了普通字符（类型 `char`）和宽字符（类型 `wchar_t`，编码\
  \ Unicode 字符集的宽[16 位]字符类型）的属性。虽然 C++ 标准处理了字符特征，但我们在本录中不涉及。我们只处理字符类型为 `char` 的这种简单情况。\n\
  \nstring 这个词在标准 C++ 中可能会引起混淆。我们说的 string 是指从 C 语言继承而来的字符串——即空字符终止的 `char` 数组？还是指标准\
  \ C++ 的 `string` 类对象？为了帮助消除这种歧义，我们将统一使用 string 来指代 `string` 类。相比之下，我们使用术 cstring\
  \ 来指代 C++ 继承自 C 的种字符串（空字符终止的 `char` 数组）。我们这样做部分是因为提供操作 C 风格字符串函数的头文件是 `<cstring>`，部分是因为\
  \ cstrings 继承自 C 语言。\n\n标准 C++ 提供了两种字符串类型：`string` 和 `wstring`。这些名称通过两个特化模板类 `basic_string`\
  \ 的 `typedef` 语句创建：\n\n```cpp\ntypedef basic_string<char> string;     // 使用 ASCII\
  \ 字符的普通字符串\n                                       \ntypedef basic_string<wchar_t>\
  \ wstring; // 宽字符字符串\n```\n\n我们提到这一点是为了让你能更好地理解提到 `basic_string.` 的编译器错误信息。此外，你在未来的某个时刻可能需要处理宽字符串（类型\
  \ `wstring`）。在本录中我们不再进一步讨论 `wstring`。\n\n我们通过展示一个同时使用 `vector` 和 `string` 的程序开始讨论\
  \ `string` 类。该程序从标准输入读取一行，将该行拆分成单词，然后按照它们在输入中出现的相反顺序输出单词。我们首先给出程序，然后解释细节。\n\n```cpp\n\
  #include <iostream>\n#include <string>     // 用于 string 类\n#include <vector>   \
  \  // 用于 vector<T> 类\n\nusing std::string;\nusing std::vector;\n\nvoid parse(string&\
  \ line, string& delimiters, vector<string>& strVec)\n// 操作: 使用分隔符将行拆分为单词，\n//  \
  \       在 strVec 中返回单词\n// 前提: line 和 delimiters 已初始化，\n//         且 strVec 为空\n\
  // 后置: strVec 包含单词\n{\n  using namespace std;\n  int lineLength = line.length();\n\
  \  int wordPastEnd;\n  int wordStart = line.find_first_not_of(delimiters, 0);\n\
  \  while ( wordStart >= 0 && wordStart < lineLength )\n  {\n    wordPastEnd = line.find_first_of(delimiters,\
  \ wordStart);\n    if (wordPastEnd < 0 || wordPastEnd > lineLength)\n      wordPastEnd\
  \ = lineLength;\n    strVec.push_back(line.substr(wordStart, wordPastEnd – wordStart));\
  \ // 查找第一个不在分隔符中的字符\n    wordStart = line.find_first_not_of(delimiters, wordPastEnd\
  \ + 1);\n  }\n}\n\nint main()\n{\n  using namespace std;\n  string line;\n  string\
  \ delimiters(\" ,.?!:\");\n  vector<string> wordVec;\n  getline(cin, line, '\\n');\n\
  \  parse(line, delimiters, wordVec);\n\n  vector<string>::iterator itr;\n  // 按照单词在\
  \ wordVec 中出现的顺序输出单词\n  for (itr = wordVec.begin(); itr < wordVec.end(); itr++)\n\
  \    cout << *itr << endl;\n\n  // 按照单词在 wordVec 中出现的相反顺序输出\n  vector<string>::reverse_iterator\
  \ revItr;\n  for (revItr = wordVec.rbegin(); revItr < wordVec.rend(); revItr++)\n\
  \    cout << *revItr << endl;\n}\n```\n\n给定输入\n```\nNow is the time for\n```\n程序产生如下输出：\n\
  ```\nNow\nis\nthe\ntime\nfor\nfor\ntime\nthe\nis\nNow\n```\n\n\n\n\n回到 `main` 函数，当控制权从\
  \ `parse` 函数返回时，参数 `wordVec` 包含了 `line` 的连续子串。这些连续字符串通过使用 `vector<string>` 迭代器从第一个到最后一个提取。首先声明一个\
  \ vector 迭代器，然后在 `for` 语句中将其初始化为 `begin()` 成员函数返回的 `wordVec` 中第一个元素的位置。输出迭代器的所引内容，通过\
  \ `++` 运算符使迭代器向前移动，并与从 `end()` 成员函数获取的末尾值进行比较。结果是按从头部的顺序显示 `line` 中的子串。\n\n接下来，`strVec`\
  \ 中的字符串按从尾部的顺序输出。声明类型为 `vector<string>::reverse_iterator` 的迭代器，然后在第二个 `for` 语句中初始化为一个反向迭代器值，该迭代器通过\
  \ `rbegin()` 成员函数指向 `wordVec` 中的最后一个元素。输出迭代器的所引内容。然后通过 `++` 运算符使迭代器向前移动（注：`++` 运算符被重载，以使迭代器的位置向列表的前部移动）。然后将迭代器与从\
  \ `rend()` 成员函数获取的迭代器值进行比较。该值的表现类似于“第一个元素之前”的位置，使得从尾到头的迭代能够终止。结果是 `line` 中的子串以反序显示。\n\
  \n在这个示例中，我们使用了 `string` 和 `vector` 的以下特性：\n\n* 使用以 `string` 为基础类型的 `vector`\n* 用于字符串的\
