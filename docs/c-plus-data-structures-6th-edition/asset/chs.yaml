  \ `MAX_ITEMS` 来确定能产生等数量线程的最大块大小。如果计算出的块大小大于用户指定的，则使用用户指定的大小。这是获取可用线程数的方法：\n```cpp\n\
  unsigned int maxthreads = thread::hardware_concurrency();\n```\n\n33. 将你在练习 31 题中的实验结果与通过练习\
  \ 32 题方法获得的性能进行比较，使用大于硬件可用数量的线程数是否会产生更快的性能？是否可以在平均上持续获得更好的性能，还是这仅仅处于正常波动范围内？\n\n\
  34. 在基数排序中使用并行性的一种方法是将数组分成若干部分，并让每个独立的线程检查每个部分，依次取每个值并调用 `enqueue` 将其放置在适当的队列中。你能看出这种方法存在的问题吗？\n\
  \n35. 为基数排序添加并行性的另一种方法是反过来操作，为每个队列设置一个线程。每个线程读取整个数组，寻找应该入队到其队列的值。这样，所有队列都是并行填充的。然而，如果你实现了这种方法，你会发现它的运行速度并没有变快。为什么呢？\n\
  \n# 第 13 章：图\n\n© Repina Valeriya/Shutterstock\n\n到为止，我们已经考虑了栈、队列、链表、各种形式的树、堆、优先级队列、集合和映射。你会使用这些中的哪一个来表示互联网上设备和链路的布局？或者城市和连接道路的网络？答案是，要用我们目前为止检查的任何抽象数据类型（ADT）来完成这些任务都是挑战性的。我们之前所有的\
  \ ADT 都有非常规则的结构。但现实世界中有很多不规则结构和关系。在本章中，我们将观察完全放链结构的形状属性会发生什么。结果就是计算机科学家所说的“图”。\n\
  \n### 13.1 图\n\n#### 逻辑层次\n\n二叉树提供了一种表示存在层次关系非常有有用的方法。也就是说，一个节点最多被另一个节点（其父节点）指向，且每个节点最多指向两个其他节点（其子节点）。如果我们去掉“每个节点最多有两个孩子”的限制，我们就得到了一种普通树，如图所示：\n\
  \n![](img/f0722-01.jpg)\n\n如果我们也去掉“每个节点只能有一个父节点”的形状限制，我们就得到了一种名为图的数据结构。图由称为顶点的节点集合和一组连接节点的称为边（或弧）的线组成。不要将这个词的用法与其另一个常用含义混淆：坐标系中数据值的图表或数学函数的图像。\n\
  \n边集描述了顶点之间的关系。例如，如果顶点是城市的名称，那么连接顶点的边可以代表城市之间的道路。因为连接休斯顿和奥斯汀的道路也连接在奥斯汀和休斯顿之间，因此该图中的边没有方向。这种结构被称为无向图。然而，如果连接顶点的边代表从一个城市到另一个城市的航班，那么每条边的方向就很重要。从休斯顿到奥斯汀的航班（边）的存在并不能保证奥斯汀到休斯顿的航班的存在。边从一个顶点指向另一个顶点的图被称为有向图，或直图。\n\
  \n从程序员的角度来看，顶点代表任何研究主体：人、房子、城市、课程等。从数学上讲，顶点是图论赖以存在的未定义概念。事实上，大量的形式数学都与图有关。在其他的计算课程中，你可能会分析图并证明关于它们的定理。本教科将图作为一种\
  \ ADT 引入，解释了一些基本术语，讨论了你如何实现图，并描述了操作图的算法如何利用栈、队列和优先级队列。\n\n形式上，图 `G` 的定义如下：\n\n>\
  \ `G = (V, E)`\n\n其中\n\n> `V(G)` 是有限的、非空的顶点集\n\n> `E(G)` 是边集（写为顶点对）\n\n要指定顶点集，请用集合表示法将它们列在\
  \ `{ }` 大括号内。以下集合定义了图 13.1a 中图中四个顶点：\n\n> `V(Graph1) = {A, B, C, D}`\n\n边集通过列出边边序列来指定。要表示每条边，将它连接的两个顶点的名称写在括号中，中间用逗号隔开。例如，图\
  \ 13.1a](#ch13.xhtml_ch13fig1)中 Graph1 的顶点由此处的四条边连接：\n\n> `E(Graph1) = {(A, B),\
  \ (A, D), (B, C), (B, D)}`\n\n因为 Graph1 是无向图，所以每条边中顶点的顺序是不重要的。Graph1 中的边集也可以描述为：\n\
  \n> `E(Graph1) = {(B, A), (D, A), (C, B), (D, B)}`\n\n如果图是有向图，边的方向由先列出哪个顶点指示。例如，在图\
  \ 13.1b 中，边 `(5, 7)` 表示从顶点 5 到顶点 7 的链路。然而，Graph2 不包含相应的边 `(7, 5)`。注意在有向图中，箭头指示了方向。\n\
  \n如果图中的两个顶点由一条边连接，则它们被称为相邻。在 Graph1 (图 13.1a) 中，顶点 A 和 B 相邻，但 A 和 C 不相邻。如果顶点由有向边连接，则第一个顶点与第二个顶点相邻，第二个顶点相对于第一个顶点相邻。例如，在\
  \ Graph2 中（在图 13.1b 中），顶点 5 与顶点 7 和 9 相邻，而顶点 1 来自顶点 3 和 11。\n\n![](img/f13-01.jpg)\n\
  \n图 13.1 图的一些示例\n\n图 13.1c 中的 Graph3 看起来很熟悉——是一棵树。树是有向图的一种特殊情况，其中每个顶点可能只从一个其他顶点（其父节点）相邻，且有一个顶点（根）不从任何其他顶点相邻。\n\
  \n从一个顶点到另一个顶点的路径由连接它们的顶点序列组成。路径的存在意味着必须有一条连续的边序列从第一个顶点经过任意数量的顶点到达第二个顶点。例如，在 Graph2\
  \ 中，存在从顶点 5 到顶点 3 的路径，但没有从顶点 3 到顶点 5 的路径。注意在树中，如 Graph3 (图 13.1c)，从根到树中每个其他节点都有唯一的路径。\n\
  \n在完全图中，每个顶点都与其他顶点相邻。13.2 显示两个完全图。如果有 N 个顶点，完全有向图将有 `N * (N – 1)` 条边，完全无向图将有 `N\
  \ * (N – 1) / 2` 条边。\n\n\n\n\n\n在加权图中，每条边都带有一个值。加权图可以表示顶点之间连接的值很重要的情况，而不仅仅是连接是否存在。边的权重通常是遍历该边时相关的成本之一。例如，在图\
  \ 13.3 所示加权图中，顶点代表城市，边表示连接这些城市的 Air Busters 航空公司航班。附加在边上的权重代表成对城市之间的空中距离。\n\n为了查看我们是否能从丹佛到达华盛顿，我们需要寻找这两个城市之间的一条路径。如果总旅行距离由沿途每对城市之间距离之和决定，我们就可以通过相加构成路径的边上的权重来计算旅行距离。请注意，多个路径可能连接两个顶点。在本章的稍后部分中，我们将讨论一种寻找两个顶点之间最短路径的方法。\n\
  \n到为止，我们已经在抽象层面上描述了图，它是一个顶点集合和一组连接部分或所有顶点的边集合。在图上定义了哪些操作？在本章中，我们将指定并实现一小部分有用的图操作。图上还有许多其他操作可以定义；我们选择了在章节后面描述的图应用中有用的操作。然而，首先我们必须定义构建和处理图所需的操作。\n\
  \n![](img/f13-02.jpg)\n\n图 13.2 两个完全图\n\n![](img/f13-03.jpg)\n\n图 13.3 一个加权图\n\n\
  我们需要添加顶点和边，确定边的权重，并访问与顶点相邻的顶点。让我们在 CRC 卡片中收集关于创建图的观察结果：\n\n![](img/f0726-01.jpg)\n\
  \n这里是图 ADT 的规范：\n\n#### 应用层\n\n我们的图 ADT 规范仅包含最基础的操作。它不提供遍历操作。正如你想象的，我们可以按照许多不同的顺序遍历图。因此，我们认为遍历是图的一种应用，而不是一种内在操作。我们在规范中提供的基本操作允许我们不依赖于图本身的实现方式而独立地实现不同的遍历。\n\
  \n在第 8 章中，我们讨论了后序树遍历，它会到达树的最深层并向上回。这种进入分支到最深点并向上的策略被称为深度优先策略。另一种访问树中每个顶点的系统方法是先访问第\
  \ 0 层（根）的顶点，然后是第 1 层的顶点，然后是第 2 层的顶点，依此类推。这种这样按层访问每个顶点的方法被称为广度优先策略。对于图来说，深度优先和广度优先策略都是用的。我们在航空公司示例的背景下概述了这两种算法。\n\
  \n### 深度优先搜索\n\n我们可以通过图 13.3 中的图回答的一个问题是：“我能乘坐我最喜欢的航空公司从 X 城市飞到 Y 城市吗？”这等同于问：“图中是否存在从顶点\
  \ X 到顶点 Y 的路径？”使用深度优先策略，让我们开发一个寻找从 `startVertex` 到 `endVertex` 路径的算法。\n\n我们需要一种系统的方法，在调查城市时跟踪它们。在深度优先搜索中，我们检查与\
  \ `startVertex`相邻的第一个顶点；如果它是 `endVertex`，则搜索结束。否则，我们检查从该顶点一步之内可以到达（即与该顶点相邻）的所有顶点。同时，我们需要存储其他与\
  \ `startVertex`相邻的顶点。如果从第一个顶点不存在路径，我们返回并尝试第二个顶点、第三个顶点，依此类推。由于我们想尽可能沿着某条路径走得远，如果在没有找到\
  \ `endVertex` 时回溯，栈（stack）是存储顶点的良好结构。\n\n这里是我们使用的算法：\n\n让我们将此算法应用于图 13.3 所示的航空公司路线图。假设我们想从奥斯汀飞往华盛顿。我们通过将起始城市推入栈中来初始化搜索（图\
  \ 13.4a）。在循环开始时，我们从栈中弹出当前城市奥斯汀。我们能从奥斯汀直接到达的地方是达拉斯和休斯顿；我们将这两个顶点都推入栈中（图 13.4b）。在第二次迭代的开始时，我们从栈中弹出顶部顶点——休斯顿。休斯顿不是我们的终点，所以我们从那里继续搜索。从休斯顿飞往亚特兰大的只有一个一个航班；我们将亚特兰大推入栈中（图\
  \ 13.4c）。我们再次从栈中弹出顶部顶点。亚特兰大不是我们的终点，所以我们从那里继续搜索。亚特兰大有去两个城市的航班：休斯顿和华盛顿。\n\n但我们刚从休斯顿过来！我们不想回到已经访问过的城市；这可能会导致无限循环。我们的算法必须处理循环。也就是说，我们必须将一个城市标记为已访问，这样它就不会被再次调查。假设我们已经标记了尝试过的城市，然后继续我们的示例。休斯顿已经访问过了，所以我们忽略了它。第二个相邻顶点华盛顿尚未访问，所以我们将其推入栈中（图\
  \ 13.4d）。我们再次从栈中弹出顶部顶点。华盛顿是我们的终点，所以搜索完成。从奥斯汀到华盛顿的深度优先搜索路径如图 13.5 所示。\n\n![](img/f13-04.jpg)\n\
  \n图 13.4 使用栈存储路线\n\n![](img/f13-05.jpg)\n\n图 13.5 深度优先搜索\n\n这种搜索被称为深度优先搜索，因为在返回搜索达拉斯之前，我们进入了最深的分支。当你必须回溯时，你采取的是靠近死胡同的分支。也就是说，在早期分支采取替代选择之前，你尽可能沿着某条路径走得远。\n\
  \n在查看深度优先搜索算法的源码之前，让我们进一步讨论一下图上的“标记”。在开始搜索之前，我们必须清除顶点中的任何标记，以指示它们尚未访问。我们将此命名为 `ClearMarks`。在搜索过程中访问每个顶点时，对其标记。我们将此命名为\
  \ `MarkVertex`。在处理每个顶点之前，我们可以问：“我们以前访问过这个顶点吗？”这个问题的答案由函数 `IsMarked` 返回。如果我们访问了这个顶点，就忽略它。我们必须将这三个函数添加到图\
  \ ADT 的规范中：\n\n`DepthFirstSearch` 函数接收一个图对象、一个起始顶点和一个顶点。它使用深度优先策略确定是否存在路径连接起始城市和结束城市，显示搜索过程中访问的所有城市名称。注意，函数中的没有任何内容依赖于图的实现。该函数作为一个图应用实现的；它使用图\
  \ ADT 操作（包括标记操作）而不知道图是如何表示的。\n\n在以下函数中，我们假设已经包含了 `StackType` 和 `QueType` 的头文件。我们还假设\
  \ `VertexType` 是一个定义了“`==`”和“`<<`”运算符的类型：\n\n\n\n\n\n```cpp\ntemplate<class VertexType>\n\
  \nvoid DepthFirstSearch(GraphType<VertexType> graph,\n\n     VertexType startVertex,\
  \ VertexType endVertex)\n\n// Assumes VertexType is a type for which the \"==\"\
  \ and \"<<\"\n\n// operators are defined.\n{\n  using namespace std;\n  StackType<VertexType>\
  \ stack;\n  QueType<VertexType> vertexQ;\n  bool found = false;\n  VertexType vertex;\n\
  \  VertexType item;\n  graph.ClearMarks();\n  stack.Push(startVertex);\n  do\n \
  \ {\n    stack.Pop(vertex);\n    if (vertex == endVertex)\n    {\n      cout <<\
  \ vertex;\n      found = true;\n    }\n    else\n    {\n      if (!graph.IsMarked(vertex))\n\
  \      {\n        graph.MarkVertex(vertex);\n        cout << vertex;\n        graph.GetToVertices(vertex,\
  \ vertexQ);\n        while (!vertexQ.IsEmpty())\n        {\n          vertexQ.Dequeue(item);\n\
  \          if (!graph.IsMarked(item))\n            stack.Push(item);\n        }\n\
  \      }\n    }\n  } while (!stack.IsEmpty() && !found);\n  if (!found)\n    cout\
  \ << \"Path not found.\" << endl;\n}\n```\n\n### 广度优先搜索\n\n广度优先搜索在进入更深层次之前会查看相同深度的所有路径。在我们的飞行示例中，广度优先搜索在检查任何两转连接之前，会先检查所有可能的单转连接。对于大多数旅客来说，这是预订机票的首选方法。\n\
  \n当我们在深度优先搜索中遇到胡胡同时，我们会尽可能少地回溯。我们会从最近的顶点尝试另一条路线——即栈顶的路线。在广度优先搜索中，我们希望尽可能远地回溯，以找到源自早期顶点的路线。栈并不是寻找早期路线的合适结构，因为它记录事项的顺序与它们发生的顺序相反——也就是说，最近的路线在栈顶。为了按照事件发生的顺序记录事项，我们使用\
  \ FIFO 队列（先入先出队列）。队列头的路线是来自较早顶点的路线；队列尾的路线是来自较晚顶点的路线。\n\n为了修改搜索以使用广度优先策略，我们将所有对栈的操作调用更改为类似的\
  \ FIFO 队列操作。搜索从奥斯汀到华盛顿的路径，我们首先将所有可以直接从奥斯汀到达的城市入队：达拉斯和休斯顿（图 13.6a）。然后我们出队头部元素。达拉斯不是我们寻找的目标，因此我们将所有尚未被访问的相邻城市入队：芝加哥和丹佛（图\
  \ 13.6b。（奥斯汀已经访问过了，因此不再入队）。再次从队列中取出头部元素。该元素是另一个“单转”城市，休斯顿。休斯顿不是理想的目标，因此我们继续搜索。从休斯顿只有一条航班飞出，往亚特兰大。由于我们之前没有访问过亚特兰大，将其入队（图\
  \ 13.6c）。\n\n现在我们知道无法通过单转到达华盛顿，因此我们开始检查两转连接。我们出队芝加哥；这不是我们的目标，所以我们将它的相邻城市丹佛放入队列（图\
  \ 13.6d）。现在出现了一个有趣的情况：丹佛在队列中出现了两次。我们应该在城市入队列时将其标记为已访问，还是在它出队、当我们检查其出发航班时标记？如果我们只在它出队后才标记它，队列可能会包含多个相同顶点的副本（因此我们需要在城市出队后检查它是否已被标记）。\n\
  \n![](img/f13-06.jpg)\n\n图 13.6 使用队列存储路线\n\n另一种方法是在城市放入队列之前将其标记为已访问。哪种技术更好？这取决于处理过程。你可能想知道是否存在替代路线，在这种情况下，你可能希望将一个城市放入队列多次。\n\
  \n回到我们的示例。我们在一步中将丹佛放入队列，并在下一步中删除了它之前的条目。丹佛不是我们的目标，因此我们将尚未标记的相邻城市（只有亚特兰大）放入队列（图 13.6e）。这种处理一直持续，直到华盛顿（从亚特兰大）被放入队列并最终出队。我们找到了理想的城市，搜索完成。这种搜索如图图\
  \ 13.7 所示。\n\n![](img/f13-07.jpg)\n\n图 13.7 广度优先搜索\n\n`BreadthFirstSearch` 函数的源代码与深度优先搜索相同，除了将栈替换为\
  \ FIFO 队列之外：\n\n```cpp\ntemplate<class VertexType>\n\nvoid BreadthFirstSearch(GraphType<VertexType>\
  \ graph,\n\n     VertexType startVertex, VertexType endVertex)\n\n// Assumption：VertexType\
  \ 是定义了 \"==\" 和\n//             \"<<\" 运算符的类型。\n{\n  using namespace std;\n  QueType<VertexType>\
  \ queue;\n  QueType<VertexType> vertexQ;\n  bool found = false;\n  VertexType vertex;\n\
  \  VertexType item;\n  graph.ClearMarks();\n  queue.Enqueue(startVertex);\n  do\n\
  \  {\n    queue.Dequeue(vertex);\n    if (vertex == endVertex)\n    {\n      cout\
  \ << vertex;\n      found = true;\n    }\n    else\n    {\n      if (!graph.IsMarked(vertex))\n\
  \      {\n        graph.MarkVertex(vertex);\n        cout << vertex;\n        graph.GetToVertices(vertex,\
  \ vertexQ);\n        while (!vertexQ.IsEmpty())\n        {\n          vertexQ.Dequeue(item);\n\
  \          if (!graph.IsMarked(item))\n            queue.Enqueue(item);\n      \
  \  }\n      }\n    }\n  } while (!queue.IsEmpty() && !found);\n  if (!found)\n \
  \   cout << \"Path not found.\" << endl;\n}\n```\n\n### 单源最短路径问题\n\n我们从刚才讨论的两种搜索操作知道，多个路径可以连接一个顶点。假设我们要找到从奥斯汀到\
  \ B 航空公司服务的其他城市的最短路径。这里的“最短路径”是指边权值之和最小的路径。考虑从奥斯汀到华盛顿的以下两条路径：\n\n显然，第一条路径更优——除非你想收集频繁飞行里程。\n\
  \n让我们开发一个从指定起始城市到每个其他城市的最短路径算法——这一次我们不是在起始城市和结束城市之间搜索路径。正如本章前面的两次图搜索一样，我们需要一个辅助结构来存储稍后处理的城市。通过检索最近被放入结构中的城市，深度优先搜索尝试继续“前进”。它尝试单转解决方案、双转解决方案、然后三转解决方案，以此类推。只有在遇到死胡同时才会回溯到次数较少的解决方案。相反，通过检索在结构中停留最长的城市，广度优先搜索尝试所有的单转解决方案，然后所有的双转解决方案，以此类推。广度优先搜索找到飞行次数最少的路径。\n\
  \n但飞行次数最少并不意味着总距离最短。与深度优先和广度优先搜索不同，最短路径遍历必须使用城市之间的英里数（权重）。我们希望检索距离当前顶点最近的顶点——即具有最小边连接的顶点。如果我们认为最小距离具有最高优先级，那么我们就知道一个完美的结构——优先级队列。我们的算法可以使用优先级队列，其元素是航班（边），以到起始城市的距离作为优先级。也就是说，优先级队列中的项是带有三个数据成员的结构体变量：`fromVertex`、`toVertex`\
  \ 和 `distance`：\n\n\n\n\n最短路径遍历的算法与我们用于深度优先搜索和广度搜索的算法相似，尽管有两个主要区别：\n\n1. 我们使用优先级队列而不是先进先出（FIFO）队列或栈栈。\n\
  2. 只有当没有更多城市需要处理时我们才停止；我们没有特定的目的地。\n\n这里是最短路径算法的源代码。此代码假设已经包含了 `QueType` 和 `PQType`\
  \ 的头文件。注意，`ItemType`（放入优先级队列的项类型）必须重载关系操作符，使得较小的距离表示更高的优先级。因此，优先级队列是用最小堆实现的。也就是说，对于堆中的每一个项，`item.distance`\
  \ 均小于或等于其每个子项的 `distance` 成员：\n\n```\ntemplate<class VertexType>\n\nstruct ItemType\n\
  {\n  bool operator<(ItemType otherItem);\n\n  // \"<\"意味着距离更短。\n\n  bool operator==(ItemType\
  \ otherItem);\n\n  bool operator<=(ItemType otherItem);\n\n  VertexType fromVertex;\n\
  \n  VertexType toVertex;\n\n  int distance;\n};\n\ntemplate<class VertexType>\n\
  void ShortestPath(GraphType<VertexType> graph,\n\n     VertexType startVertex)\n\
  {\n  using namespace std;\n  ItemType item;\n  int minDistance;\n  PQType<VertexType>\
  \ pq(10);         // 假设最多 10 个顶点。\n  QueType<VertexType> vertexQ;\n  VertexType\
  \ vertex;\n  graph.ClearMarks();\n  item.fromVertex = startVertex;\n  item.toVertex\
  \ = startVertex;\n  item.distance = 0;\n  pq.Enqueue(item);\n  cout << \"Last Vertex\
  \   Destination   Distance\" << endl;\n  cout << \"-----------------------------------\"\
  \  << endl;\n  do\n  {\n    pq.Dequeue(item);\n    if (!graph.IsMarked(item.toVertex))\n\
  \    {\n      graph.MarkVertex(item.toVertex);\n      cout << item.fromVertex;\n\
  \      cout << \" \";\n      cout << item.toVertex;\n      cout << \" \" << item.distance\
  \ << endl;\n      item.fromVertex = item.toVertex;\n      minDistance = item.distance;\n\
  \      graph.GetToVertices(item.fromVertex, vertexQ);\n      while (!vertexQ.IsEmpty())\n\
  \      {\n        vertexQ.Dequeue(vertex);\n        if (!graph.IsMarked(vertex))\n\
  \        {\n          item.toVertex = vertex;\n          item.distance = minDistance\
  \ +\n            graph.GetWeight(item.fromVertex, vertex);\n          pq.Enqueue(item);\n\
  \        }\n      }\n    }\n  } while (!pq.IsEmpty());\n}\n```\n\n该函数的输出是一个城市对（边）的表格，显示了从\
  \ `startVertex` 到图中每个其他顶点的总距离，以及在到达目的地之前访问的最后一个顶点。如果 `graph` 包含图 13.3 所示的信息，函数调用\n\
  \n```\nShortestPath(graph, startVertex);\n```\n\n其中 `startVertex` 对应华盛顿（Washington），将打印如下表：\n\
  \n| 上一个顶点 | 目的地 | 距离 |\n| --- | --- | --- |\n| Washington | Washington | 0 |\n|\
  \ Washington | Atlanta | 600 |\n| Washington | Dallas | 1300 |\n| Atlanta | Houston\
  \ | 1400 |\n| Dallas | Austin | 1500 |\n| Dallas | Denver | 2080 |\n| Dallas | Chicago\
  \ | 2200 |\n\n从华盛顿到每个目的地的最短路径距离出现在第二和第三列。例如，我们从华盛顿到芝加哥的航班总行程为 2200 英里。第一列显示了在遍历中紧邻目的地之前的城市。\n\
  \n让我们计算从华盛顿到芝加哥的最短路径。我们从第一列看到路径中的倒数第二个顶点是达拉斯（Dallas）。现在我们在“目的地”列中查找达拉斯：达拉斯之前的顶点是华盛顿。整个路径是：华盛顿–达拉斯–芝加哥。（我们可能想考虑另一家航空公司以获得更直接的路线！）\n\
  \n#### 实现层次\n\n### 基于数组的实现\n\n表示图中顶点 `V(graph)` 的简单方法是使用数组，其元素类型为顶点类型（`VertexType`）。例如，如果顶点代表城市，`VertexType`\
  \ 将是字符串的某种表示。表示图中边 `E(graph)` 的简单方法是使用邻接矩阵，这是一个存储边值（权重）的二维数组。因此，图由一个数据成员 `numVertices`、一个一维数组\
  \ `vertices` 和一个二维数组 `edges` 组成。图 13.8 描述了七个城市之间 Air Busters 航班图实现。为了简单起见，我们省略了遍历期间标记顶点为“已访问”所需的额外布尔型数据。虽然图\
  \ 13.7 中的城市名称按字母顺序排列，但并没有要求此数组中的元素必须排序。\n\n![](img/f13-08.jpg)\n\n图 13.8 城市之间的航班连接图\n\
  \n在图的这种表示法的任何时刻：\n\n* `numVertices` 是图中顶点的数量。\n* `V(graph)` 包含在 `vertices[0]`..`vertices[numVertices\
  \ - 1]` 中。\n* `E(graph)` 包含在二维数组 `edges[0][0]`..`edges[numVertices - 1][numVertices\
  \ - 1]` 中。\n\n城市名称包含在 `graph.vertices` 中。`graph.edges` 中每条边的权重代表由航班连接的两个城市之间的空中距离。例如，`graph.edges[1][3]`\
  \ 中的值告诉我们奥斯汀和达拉斯之间有直飞，空中距离为 200 英里。`graph.edges[1][6]` 中的 `NULL_EDGE` 值 (0) 告诉我们航空公司在奥斯汀和华盛顿之间没有直飞。因为这是一个加权图，权重由空中距离组成，我们使用\
  \ `int` 类型作为 `EdgeValueType`。如果这不是加权图，`EdgeValueType` 将是 `bool`，如果顶点对之间边，则邻接矩阵中的每个位置为真，否则为假。\n\
  \n这里是 `GraphType` 类的定义。为了简单起见，我们假设 `EdgeValueType` 是 `int`：\n\n```\ntemplate<class\
  \ VertexType>\n// 假设 VertexType 是一个定义了\n// \"=\" 和 << 运算符的类型\nclass GraphType\n\
  {\npublic:\n  GraphType();                   // 默认 50 个顶点\n  GraphType(int maxV);\
  \           // maxV <= 50\n  ~GraphType();\n  void MakeEmpty();\n  bool IsEmpty()\
  \ const;\n  bool IsFull() const;\n  void AddVertex(VertexType);\n  void AddEdge(VertexType,\
  \ VertexType, int);\n  int GetWeight(VertexType, VertexType);\n  void GetToVertices(VertexType,\
  \ QueType<VertexType>&);\n  void ClearMarks();\n  void MarkVertex(VertexType);\n\
  \  bool IsMarked(VertexType);\nprivate:\n  int numVertices;\n  int maxVertices;\n\
  \  VertexType* vertices;\n  int edges[50][50];\n  bool* marks;      // marks[i]\
  \ 是 vertices[i] 的标记\n};\n```\n\n类构造函数通常是最容易编写的操作，但 `GraphType` 例。我们必须为 `vertices`\
  \ 和 `marks`（指示顶点已标记的布尔数组）分配空间。默认构造函数为 50 个 `vertices` 和 `marks` 准备空间。参数构造函数允许用户指定最大顶点数。我们为什么不把\
  \ `edges` 放在动态存储中呢？我们可以这样做，但为二维数组分配存储相当复杂，我们不希望将注意力转移到主要问题上：图 ADT：\n\n\n\n\n```]\n\
  cpp\ntemplate<class VertexType>\n\nGraphType<VertexType>::GraphType()\n\n// Post:\
  \ 动态分配了大小为 50 的数组用于\n//       标记和顶点。numVertices 设置为 0；\n//       maxVertices 设置为\
  \ 50。\n{\n   numVertices = 0;\n   maxVertices = 50;\n   vertices = new VertexType[50];\n\
  \   marks = new bool[50];\n}\n\ntemplate<class VertexType>\n\nGraphType<VertexType>::GraphType(int\
  \ maxV)\n\n// Post: 动态分配了大小为 maxV 的数组用于\n//       标记和顶点。\n//       numVertices 设置为\
  \ 0；maxVertices 设置为 maxV。\n{\n   numVertices = 0;\n   maxVertices = maxV;\n   vertices\
  \ = new VertexType[maxV];\n   marks = new bool[maxV];\n}\n\ntemplate<class VertexType>\n\
  \nGraphType<VertexType>::~GraphType()\n\n// Post: 顶点和标记的数组已释放。\n{\n  delete [] vertices;\n\
  \  delete [] marks;\n}\n```\n```\n\n`AddVertex` 操作将 `vertex` 放入 `vertices` 数组中的下一个空位置。由于新顶点还没有定义任何边，我们还需要初始化\
  \ `edges` 相应的行和列，使其包含 `NULL_EDGE`（在此情况下为 0）：\n\n```cpp\nconst int NULL_EDGE = 0;\n\
  \ntemplate<class VertexType>\n\nvoid GraphType<VertexType>::AddVertex(VertexType\
  \ vertex)\n\n// Post: vertex 已存储在 vertices 中。\n//       edges 对应的行和列已设置为\n//   \
  \    NULL_EDGE。\n//       numVertices 已递增。\n{\n  vertices[numVertices] = vertex;\n\
  \  for (int index = 0; index < numVertices; index++)\n  {\n    edges[numVertices][index]\
  \ = NULL_EDGE;\n    edges[index][numVertices] = NULL_EDGE;\n  }\n  numVertices++;\n\
  }\n```\n\n要向图中添加边，我们必须首先定位定义要添加的边的 `fromVertex` 和 `toVertex`。`AddEdge` 的这些参数类型为\
  \ `Vertex-Type`。为了索引到正确的矩阵槽，我们需要 `vertices` 数组中对应每个顶点的索引。一旦知道了索引，设置矩阵中边的权重就是件易的事。以下是该算法：\n\
  \n为了找到每个顶点的索引，让我们写一个搜索函数，该函数接收顶点名称并返回其在 `vertices` 中的位置（索引）。由于 `AddEdge` 的前提条件规定\
  \ `fromVertex` 和 `toVertex` 都在 `V(graph)` 中，因此搜索函数非常简单。我们将其实现为辅助函数 `IndexIs`：\n\n\
  ```cpp\ntemplate<class VertexType>\n\nint IndexIs(VertexType* vertices, VertexType\
  \ vertex)\n\n// Post: 返回顶点在 vertices 中的索引。\n{\n  int index = 0;\n  while (!(vertex\
  \ == vertices[index]))\n    index++;\n  return index;\n}\n\ntemplate<class VertexType>\n\
  \nvoid GraphType<VertexType>::AddEdge(VertexType fromVertex,\n     VertexType toVertex,\
  \ int weight)\n\n// Post: 边 (fromVertex, toVertex) 存储在 edges 中。\n{\n  int row;\n\
  \  int col;\n  row = IndexIs(vertices, fromVertex);\n  col = IndexIs(vertices, toVertex);\n\
  \  edges[row][col] = weight;\n}\n```\n\n`GetWeight` 操作是 `AddEdge` 的镜像操作：\n\n```cpp\n\
  template<class VertexType>\n\nint GraphType<VertexType>::GetWeight\n(VertexType\
  \ fromVertex, VertexType toVertex)\n\n// Post: 返回与边\n//       (fromVertex, toVertex)\
  \ 相关的权重。\n{\n  int row;\n  int col;\n  row = IndexIs(vertices, fromVertex);\n  col\
  \ = IndexIs(vertices, toVertex);\n  return edges[row][col];\n}\n```\n\n我们指定的最后一个图操作是\
  \ `GetToVertices`。该函数接受一个顶点作为参数，并返回一个与指定顶点相邻的顶点队列。也就是说，它返回从该顶点一步可以到达的所有顶点队列。使用邻接矩阵来表示边，确定\
  \ `vertex` 相邻的节点是易举的。我们只需要遍历 `edges` 中相应的行；每当发现非 `NULL_EDGE` 的值，就将另一个顶点添加到队列中：\n\
  \n```cpp\ntemplate<class VertexType>\n\nvoid GraphType<VertexType>::GetToVertices(VertexType\
  \ vertex,\n     QueType<VertexType>& adjVertices)\n\n// Post: 返回与顶点相邻的顶点队列。\n{\n\
  \  int fromIndex;\n  int toIndex;\n  fromIndex = IndexIs(vertices, vertex);\n  for\
  \ (toIndex = 0; toIndex < numVertices; toIndex++)\n    if (edges[fromIndex][toIndex]\
  \ != NULL_EDGE)\n      adjVertices.Enqueue(vertices[toIndex]);\n}\n```\n\n我们将此实现的完成和测试留给学生作为编程作业。\n\
  \n### 链式实现\n\n用邻接矩阵表示图中边的优势在于其速度和简单性性。给定两个顶点的索引，确定它们之间是否存在边（或边的权重）是一个 O(1) 操作。邻接矩阵的问题在于它们对空间的占用是\
  \ O(N²)，其中 N 是顶点的最大数量。\n\n\n\n\n我们也看到了如何通过邻接矩阵来方便地表示图。然而，当一个图具有许多顶点和很少的边时，邻接矩阵大部分将填充为空值，因此在存储空间方面非常低效。链式表示法在空间上可能更有效，但在管理邻接列表中顶点的添加和删除方面，涉及到更复杂的算法复杂度。\n\
  \n图中存在各种变体和泛化形式。例如，在更通用的图中，顶点类型可以是一个带有成员函数的对象，每当遍历到达该顶点时，就可以对其数据执行某些操作。边也可以被泛化，允许顶点之间相互传递信息。变体可以包括额外的形状属性，使图呈现出更规则的几何形状（例如正方形网格），从而可以更高效地执行某些操作。\n\
  \n我们刚刚开始探索 `Graph` ADT 的潜力。对图和图算法的深入研究足以写成单独的一本书。\n\n#### 练习题\n\n使用以下无向图的描述完成练习题\
