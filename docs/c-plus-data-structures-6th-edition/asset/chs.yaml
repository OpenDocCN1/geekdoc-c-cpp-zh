  \n22. 在以下情况下应使用二分查找算法：\n    1. 计算时间非常关键。\n    2. 解决方案会更长且更复杂。\n    3. 计算空间非常关键。\n\
  \    4. 列表是有序的。\n\n23. 二分查找算法需要一个有序列表。\n\n24. 二分查找算法需要一个有序列表。\n\n25. 二分查找算法需要一个有序列表。\n\
  \n26. 二分查找算法需要一个有序列表。\n\n27. 二分查找算法需要一个有序列表。\n\n28. 二分查找算法需要一个有序列表。\n\n29. 二分查找算法需要一个有序列表。\n\
  \n30. 二分查找算法需要一个有序列表。\n\n31. 二分查找算法需要一个有序列表。\n\n32. 二分查找算法需要一个有序列表。\n\n33. 二分查找算法需要一个有序列表。\n\
  \n\n\n\n如果不考虑元素是如何插入到列表中的，我们就无法讨论在列表中查找元素的有效方法。因此，我们对搜索算法的讨论必须处理列表的 `InsertItem`\
  \ 操作问题。假设我们想要尽可能地插入元素，而不太关乎找到这些元素所需的时间。我们将元素放在基于数组的列表最后一个槽位中，放在链表的第一个槽位中。这些都是 `O(1)`\
  \ 插入算法。生成的列表是根据插入时间排序的，而不是根据键值（key value）排序的。\n\n要在此列表中查找具有给定键值的元素，我们必须使用简单的线性（或顺序）搜索。从列表的第一个元素开始，我们通过检查每个后续项的键值来查找所需的元素，直到搜索成功或列表耗尽为止：\n\
  \n根据比较的次数，显而易见，这种搜索的复杂度是 `O(N)`，其中 `N` 代表元素的数量。在最坏的情况下，即我们正在查找列表中的最后一个元素或一个不存在的元素，我们需要进行\
  \ `N` 次键值比较。平均而言，假设搜索列表中任何项目的概率相等，我们在成功搜索时需要进行 `N/2` 次比较；也就是说，我们搜索了列表的一半。\n\n####\
  \ 高概率排序\n\n列表每个元素具有相等概率的假设并不总是有效的。有时某些列表元素的需求远大于其他元素。这种观察提供了一种改进搜索的方法：将最常需要的元素放在列表开头。使用这种方案，你更有可能在前几次尝试中命中，而且很少需要搜索整个列表。\n\
  \n如果列表中的元素不是静态的，或者你无法预测它们的相对需求，那么你需要一些方案来将最频繁使用的元素保持在列表前端。实现这一目标的方法之一是将每个被访问的元素移动到列表前端。当然，这种方案不能保证该元素以后还会被频繁使用。然而，如果该元素没有再次被检索，随着其他元素移动到前端，它会向列表末尾漂移。这种方案对于链表来说易于实现，只需要更改几个指针，但对于在数组中按顺序存储的列表来说，这种方案是不理想的，因为需要移动所有其他元素向下移动为开头留出空间。\n\
  \n另一种方法使元素逐渐向列表前端移动，这种方法适用于链表或顺序列表表示。当找到一个元素时，将它与它之前的元素进行交换。在经过多次列表检索后，最频繁需要的元素倾向于聚集在列表前端。要实现这种方法，我们只需要修改算法的末尾，将找到的元素与列表中的前一个元素交换（除非它是第一个元素）。如果搜索操作被实现为一个\
  \ `const` 函数且我们进行了了这种修改，那么我们必须移除 `const` 声明，因为搜索操作实际上更改了列表。这种修改应该被记录；它是搜索列表时意想不到的副作用。\n\
  \n将最活跃的元素保持在列表前端不会影响最坏的情况；如果搜索值是最后一个元素或根本不在列表中，搜索仍然需要 `N` 次比较。它仍然是一个 `O(N)` 搜索。然而，成功搜索的平均性能应该会提高。这两种算法都取决于这样一个假设：列表中的某些元素比其他元素频率高得多。如果这个假设不成立，则需要不同的排序策略来提高搜索技术的效率。\n\
  \n通过尝试改变元素相对位置来提高搜索效率的列表被称为自组织（self-organizing）或自调整（self-adjusting）列表。\n\n#### 键排序\n\
  \n如果列表根据键值进行排序，我们可以编写更高效的搜索程序。为了支持排序列表，我们必须按顺序插入元素，或者在搜索之前对列表进行排序。[按顺序插入元素是一个 `O(N²)`\
  \ 过程，因为每次插入都是 `O(N)`。如果我们将每个元素插入下一个空槽位，然后用“良好的”排序算法排序列表，该过程具有 `O(Nlog[2]N)` 的复杂度。]\n\
  \n如果列表是有序的，顺序搜索就不再需要搜索整个列表来发现元素不存在。相反，它只需要搜索到通过该元素在列表中的逻辑位置为止——也就是说，直到遇到一个键值更大的元素。第\
  \ 3 章 和第 5 章](#ch05.xhtml_ch05) 中的排序列表 ADT 版本实现了这种搜索技术。\n\n对排序列表进行线性搜索的优势在于，如果元素不存在，可以在列表耗尽之前停止搜索。再次，搜索是\
  \ `O(N)` —— 最坏情况查找最大元素元素仍然需要 `N` 次比较。然而，失败搜索的平均比较次数现在是 `N/2`，而不是固定的 `N`。\n\n线性搜索的优势在于其简单性。缺点在于其性能：在最坏的情况下，你将进行\
  \ `N` 次比较。然而，如果列表是排序并存储在数组中的，你可以通过二分搜索将搜索时间改进到最坏情况的 `O(log[2]N)`。在这种情况下，是以简单性为代价提高了效率。\n\
  \n#### 二分搜索\n\n我们已经看到将搜索效率从 `O(N)` 提高到 `O(log[2]N)` 的方法。如果数据元素排序并顺序存储在数组中，我们可以使用二分搜索。二分搜索算法通过限制搜索到元素可能所在的区域来提高搜索效率。它采用分治法的方法，不断缩小搜索区域，直到找到元素或搜索区域消失（即元素不在列表中）。我们在第\
  \ 3 章](#ch03.xhtml_ch03) 中开发了 `BinarySearch` 函数，并在第 7 章](#ch07.xhtml_ch07) 中将其转换为递归函数。\n\
  \n我们看到，对于搜索很小的列表，二分搜索并不保证更快。尽管二分通常需要更少的比较，但每次比较涉及的计算更多。当 `N` 非常小时，这些额外工作（我们在确定大\
  \ O 近似时忽略的常数和较小项）可能会主导时间。例如，在一个汇编程序中，线性搜索每次比较需要 5 个时间单位，而二分搜索需要 35 个。因此，对于包含 16\
  \ 个元素的列表，最坏情况下的线性搜索将需要 5 * 16 = 80 个时间单位。最坏情况下的二分搜索只需要 4 次比较，但每次 35 个时间单位，比较就需要\
  \ 140 个时间单位。在列表元素数量较少的情况下，线性搜索显然是足够的（有时更快）。\n\n### 8.2 树\n\n二叉搜索树是一种具有两个属性的结构：形状属性和一个关联结构元素键的属性。我们首先查看形状属性。\n\
  \n\n\n\n单链表中的每个节点都可能指向另一个节点：紧随其后的那个节点。因此，单链表是一种线性结构；列表中的每个节点（最后一个除外）都有一个唯一的后继节点。相比之下，二叉树\
  \ 是一种结构，其中每个节点都可以拥有两个后继节点，称为子节点。每个孩子作为二叉树中的节点，也可以拥有两个子节点，而这些孩子又可以有两个子节点，依此类推，从而赋予了树分支结构。树的起始是一个唯一的起始节点，被称为根节点。\n\
  \n图 8.1 展示了一棵二叉树。这棵二叉树的根节点包含值 A。树中的每个节点可能有 0、1 或 2 个孩子。一个节点左侧的节点（如果存在）称为它的左孩子。例如，根节点的左孩子包含值\
  \ B。一个节点右侧的节点（如果存在）即是它的右孩子。根节点的右孩子包含值 C。根节点是包含 B 和 C 的节点的父节点。如果树中的节点没有孩子，它被称为叶子节点。例如，包含\
  \ G、H、E、I 和 J 的节点就是叶子节点。\n\n除了规定节点最多可以有两个孩子外，二叉树的定义还规定从根到每个其他节点都存在一条唯一的路径。因此，每个节点（根节点除外）都有一个唯一的父节点。在下一页所示的图中，节点具有正确的数量数量，但违反了唯一路径规则：从根到包含\
  \ D 的节点存在两条路径。因此，这种结构根本不是树，更不用说二叉树了。\n\n![](img/f0508-01.jpg)\n\n在图 8.1 中，根节点的每个孩子本身都是更小的二叉树（或子树）的根节点。包含\
  \ B 的左孩子是其左子树的根，包含 C 的右孩子是其右子树的根。事实上，树中的任何节点都可以被视为某个子树的根节点。根节点值为 B 的子树还包含值为 D、G、H\
  \ 和 E 的节点。这些节点是包含 B 的节点的后代。包含 C 的节点的后代是值为 F、I 和 J 的节点。如果一个节点是另一个节点的父节点，或者是该节点某个祖先的父节点，那么这个节点就是另一个节点的祖先。（是的，这是一个递归定义。）在图\
  \ 8.1 中，节点 G 的祖先是包含 D、B 和 A 的节点。显然，树根是树中所有其他节点的祖先。\n\n![](img/f08-01.jpg)\n\n图 8.1\
  \ 二叉树\n\n节点的层次是指它距离根节点的距离。如果我们设定根节点的为为 0，那么包含 B 和 C 的节点是第 1 层节点；包含 D、E 和 F 的节点是第\
  \ 2 层节点；包含 G、H、I 和 J 的节点是第 3 层节点。\n\n树的最大层次决定了它的高度。任何层 `N` 上的节点最大数量为 `2^N`。然而，通常每一层并不包含最大数量的节点。例如，在图\
  \ 8.1 中，第 2 层可以包含四个节点，但因为第 1 层中包含 C 的节点只有一个孩子，所以第 2 层只有三个节点。可以包含八个节点的第 3 层只有四个。我们可以利用该树中的十个节点构建出许多形状不同的二叉树。图\
  \ 8.2 展示了几个变体。你可以很容易看出，具有 `N` 个节点的二叉树的最大层次数为 `N`。最小层次数是多少？如果我们通过给每层的每个节点提供两个孩子来填满树，直到节点用尽，树就有\
  \ `log[2]N + 1` 层（图 8.2a）。通过绘制具有 8 个 `log2 = 3` 和 16 个 `log2 = 4` 节点的“满”树来亲自验证这一事实。如果有\
  \ 7、12 或 18 个节点又怎样？\n\n树的高度是决定我们搜索元素效率的关键因素。考虑图 8.2c 中的最大高度树。如果我们从根节点开始搜索并顺着指针从一个节点找到下一个，访问值为\
  \ J 的节点（离根最远的）是一个 `O(N)` 操作——并不比搜索线性列表更好！相反，给定图 8.2a 所示的最小高度树，为了访问包含 J 的节点，我们只需要查看其他三个节点——包含\
  \ E、A 和 G 的节点。\n\n![](img/f08-02.jpg)\n\n图 8.2 具有十个节点的二叉树：(a) 4 层树；(b) 5 层树；(c)\
  \ 10 层树\n\n树的高度是决定我们搜索元素效率的关键因素。如果我们从根节点开始搜索并顺着指针从一个节点找到下一个，访问值为 J 的节点（离根最远的）是一个\
  \ `O(N)` 操作——并不比搜索线性列表更好！相反，给定图 8.2a 所示的最小高度树，为了访问包含 J 的节点，我们只需要查看其他三个节点——包含 E、A\
  \ 和 G 的节点。\n\n为了支持 `O(log[2]N)` 搜索，我们根据项目键值之间的关系添加了一个特殊属性。`图 8.2a](#ch08.xhtml_ch8fig2)`图中值的排列实际上并不利于快速搜索。假设我们想找到\
  \ G。我们从根节点开始搜索。该节点包含 E 而不是 G，所以我们需要继续搜索。但我们应该检查哪个孩子，右边还是左边？节点没有按任何顺序组织，所以我们必须检查两个子树。我们可以按层搜索树，直到找到所需的值。这是一个\
  \ `O(N)` 操作。\n\n具有这种特殊属性的二叉树被称为二叉搜索树。像任何二叉树一样，它通过允许每个节点最多拥有两个子节点来实现其分支结构。它通过维护二叉搜索属性来实现易于搜索的结构：任何节点的左孩子（如果存在）是包含所有小于该节点值的子树的根。任何节点的右孩子（如果存在）是包含所有大于该节点值的子树的根。\n\
  \n\n\n\n\n四次比较而不是十次比较听起来没什么大，但随着结构中元素数量的增加，这种差异会变得非常显著。在最坏的情况下——在线性链表中查找最后一个节点——你必须查看列表中的每一个节点；平均而言，你需要搜索列表的一半。如果列表包含\
  \ 1,000 个节点，你必须进行 1,000 次比较才能找到最后一个节点。如果这 1,000 个节点被排列在一个最小高度的二叉搜索树中，无论你寻找哪个节点，你的比较次数都不会超过\
  \ 10 次 `log2 < 10`。\n\n我们为二叉树提供的定义可以扩展到节点可以拥有任意数量子节点的树。树是一种具有唯一起始节点（根）的结构，其中每个节点都可以拥有许多子节点，并且从根节点到每个其他节点都存在一条唯一的路径。在书中，我们将范围限制在二叉搜索树和堆。我们在本章中深入探讨了二叉搜索树，并在第\
  \ 9 章中介绍了堆。\n\n### 8.3 逻辑层\n\n到现在，我们应该是从逻辑层查看 ADT（抽象数据类型）的老手了。我们知道我们需要一个操作将项放入结构中（`PutItem`）。我们需要能够从结构中删除一个项（`DeleteItem`）。我们需要通常的观察函数（`GetItem`、`IsEmpty`、`IsFull`\
  \ 和 `GetLength`）。让我们也包含一个 `Print` 操作和一个 `MakeEmpty` 操作。\n\n二叉搜索树的遍历要复杂得多。在我们目前为止检查的\
  \ `List` ADT 中，我们只以两种方式遍历结构：从前到后或从后向前。除 `SpecializedList` 类外的所有类，我们都是从列表的开始开始并一直持续到访问所有项为止。事实上，遍历树中的项有许多方法。我们通过将遍历名称作为参数传递给\
  \ `ResetTree` 和 `GetNextItem` 操作，让客户端决定以何种方式遍历树。我们将在本章稍后的部分更详细地讨论遍历。\n\n### 8.4\
  \ 应用层\n\n尽管我们的实现结构与我们之前使用的任何结构都非常不同，但我们只更改了一个列表操作名称：`ResetTree` 替换了 `ResetList`。当然，我们为实现这些操作而开发的算法与用于列表操作的算法不同。\n\
  \n在我们为其他 `List` ADT 编写的任何应用程序中将列表操作替换为相应的树操作，你就得到了二叉搜索树 ADT 的应用。尽管二叉搜索树是有趣的数学对象，但它们在计算中主要用作列表的实现结构。\n\
  \n### 8.5 实现层\n\n我们为二叉搜索树 ADT 指定的操作开发算法，并将树表示为一种节点动态分配的链式结构。由于二叉搜索树本质上是递归结构，因此我们首先使用递归解决方案来实现算法。然后我们获取\
  \ `PutItem` 和 `DeleteItem` 函数，并展示如何用迭代方式实现它们。这里是 `TreeType` 类的初步实现。如果我们需要更多数据成员，可以在稍后添加它们。\n\
  \n与我们第一次接触链表一样，我们选择不使该类泛型化。让这个实现成为一个 `char` 值的树。在练习中，你需要将该类转换为模板类。\n\n```cpp\n#include\
  \ <iostream> struct TreeNode; typedef char ItemType;\n\n// 假设：ItemType 是一个定义了运算符\
  \ \"<\"\n// 和 \"==\" 的类型——要么是适当的内置类型\n// 要么是重载了这些运算符的类。\n\nenum OrderType {PRE_ORDER,\
  \ IN_ORDER, POST_ORDER};\n```\n\n![](img/f08-04.jpg)\n\n图 8.4 节点术语\n\n```cpp\nclass\
  \ TreeType\n{\npublic:\n  TreeType();                     // 构造函数。\n  ~TreeType();\
  \                    // 析构函数。\n  TreeType(const TreeType& originalTree);  // 拷贝构造函数。\n\
  \  void operator=(TreeType& originalTree);\n  void MakeEmpty();\n  bool IsEmpty()\
  \ const;\n  bool IsFull() const;\n  int GetLength() const;\n  ItemType GetItem(ItemType\
  \ item, bool& found);\n  void PutItem(ItemType item); \n  void DeleteItem(ItemType\
  \ item); \n  void ResetTree(OrderType order);\n  ItemType GetNextItem (OrderType\
  \ order, bool& finished);\n  void Print(std::ofstream& outFile) const;\n\nprivate:\n\
  \  TreeNode* root;\n};\n```\n\n在继续之前，我们需要决定树中的节点具体是什么样子的。在本章之前对树的讨论中，我们谈到了右孩子和左孩子。这些结构指针将树连接在一起。我们还需要在节点中存储用户数据的地方，我们将继续称其\
  \ `info`。图 8.4 显示了节点的图片。\n\n以下是对应图 8.4 的 `TreeNode` 定义：\n\n```cpp\nstruct TreeNode\n\
  {\n  ItemType info; \n  TreeNode* left; \n  TreeNode* right;\n};\n```\n\n## 8.6\
  \ 递归二叉搜索树操作\n\n`TreeType` 类包含一个指向节点列表的数据成员（`root`）。树操作的递归实现应该对节点进行递归。因此，成员函数调用一个以\
  \ `root` 为参数的辅助函数。辅助函数的名称清楚地说明了它们帮助实现哪些操作。由于我们必须在使用函数之前对其声明它，所以我们必须列出它的原型。由于很容易忘记将它们放在看似反向的顺序中，因此在实现的开头列出原型是一个好主意。我们现在开发这些递归函数。\n\
  \n#### 函数 `IsFull` 和 `IsEmpty`\n\n观察函数与线性链式实现中使用的相同。我们可以直接借用代码，使用适当的变量名：\n\n```cpp\n\
  bool TreeType::IsFull() const\n// 如果空闲存储没有容纳另一个节点则返回 true\n// 否则返回 false。\n{\n \
  \ TreeNode* location;\n  try\n  {\n    location = new TreeNode;\n    delete location;\n\
  \    return false;\n  }\n  catch(std::bad_alloc exception)\n  {\n    return true;\n\
  \  }\n}\n\nbool TreeType::IsEmpty() const\n// 如果树为空则返回 true，否则返回 false。\n{\n  return\
  \ root == NULL;\n}\n```\n\n#### 函数 `GetLength`\n\n在 `Factorial` 函数中，如果我们知道 N-1 的阶乘，就可以确定\
  \ N。这里类似的说法是，如果我们知道左子树和右子树的节点数，就可以确定树的节点数。也就是说，树的节点数为\n\n> 左子树节点数 + 右子树节点数 + 1\n\
  \n这很容易。给定一个函数 `CountNodes` 和一个指向树节点的指针，我们知道如何计算子树的节点数；我们递归调用 `CountNodes` 并将子树指针作为参数。因此，我们知道如何编写通用情况。那么基础情况是什么？叶子节点没有子树，所以节点数为\
  \ 1。我们如何确定一个节点没有子树？指向子节点的指针是 `NULL`。让我们尝试将这些观察结果总结为算法，其中 `tree` 是指向节点的指针：\n\n（注：此处原文应有算法代码块，但提供的文本中未给出具体代码，仅有描述，故保持逻辑连贯）\n\
  \n让我们在几个示例上尝试此算法以确保它有效（请参见图 8.5）。\n\n\n\n\n我们对图 8.5a 中的树调用了 `CountNodes`。根节点 (M)\
  \ 的左、右孩子不是 `NULL`，因此我们以包含 A 的节点作为根节点调用 `CountNodes`。由于在这次调用中，左右孩子均为 `NULL`，所以我们返回答案\
  \ 1。现在，我们以包含 Q 的树作为根节点调用 `CountNodes`。它的两个子节点都是 `NULL`，因此我们返回答案 1。现在我们可以计算以 M 为根节点的树的节点数了：\n\
  \n> 1 + 1 + 1 = 3\n\n这看起来运行得正常。\n\n图 8.5b 中的树不是平衡的；让我们看看这种情况是否会产生问题。根节点 (L) 的两个孩子均为\
  \ `NULL` 这一说法是不成立的，因此以左孩子作为参数调用了 `CountNodes`。哎——我们确实遇到了问题。第一个语句检查根节点的节点是否为 `NULL`，但根节点本身是\
  \ `NULL`。当我们尝试在 tree 为 `NULL` 时访问 `tree->left`，函数就会崩溃。嗯，我们可以检查左或右孩子是否为 `NULL`，如果是，则不调用\
  \ `CountNodes`。\n\n![](img/f08-05.jpg)\n\n图 8.5 两个二叉搜索树\n\n如果函数 `CountNodes` 有树不为空的前提条件，那么版本\
  \ 2 就能正常工作。然而，初始为空的树会导致崩溃。我们必须在算法的第一条语句检查树是否为空，如果是，则返回零。\n\n这个算法看起来确实很复杂。一定有更简单的解决方案——而且确实有。我们可以将两个基础情况合并为一个。没有必要将叶子节点处理成特殊情况。我们只需要设置一个基础情况即可：空树返回零。以下是修改后的算法：\n\
  \n我们专门花时间推演了包含错误的版本，因为它们说明了关于树递归的两个重要点：(1) 始终先检查树是否为空，以及 (2) 叶子节点不需要被视为单独的情况。表 8.1\
  \ 回顾了设计符号和对应的 C++ 代码。\n\n| 设计符号 | C++ 代码 |\n| --- | --- |\n| Node(location) | `*location`\
  \ |\n| Info(location) | `location ->info` |\n| Right(location) | `location ->right`\
  \ |\n| Left(location) | `location ->left` |\n| Set Info(location) to value | `location\
  \ ->info = value` |\n\n表 8.1 设计符号与 C++ 代码的对比\n\n这里是函数规范：\n\n```\nint CountNodes(TreeNode*\
  \ tree);\n\nint TreeType::GetLength() const\n// 调用递归函数 CountNodes 来统计\n// 树中的节点。\n\
  {\n  return CountNodes(root);\n}\n\nint CountNodes(TreeNode* tree)\n// 后置：返回树中的节点数。\n\
  {\n if (tree == NULL)\n   return 0;\n else\n   return CountNodes(tree->left) + CountNodes(tree->right)\
  \ + 1;\n}\n```\n\n#### 函数 `GetItem`\n\n在本章的开头，我们演示了如何在二叉搜索树中搜索元素。也就是说，我们首先检查项目是否在根节点中。如果不在，我们将该元素与根节点进行比较，并在左子树或右子树中查找。这条语句看起来是递归的。让我们应用确定递归解的通用指南。\n\
  \n对于问题的规模，我们有两种选择：树中的节点数，或者从根节点到我们要搜索的节点路径上的节点数（或直到到达空树）。这哪种都是可以接受的。前者更容易描述，但后者更精确。当我们找到具有相同相同的元素时，产生一个基础情况；当我们确定树中不存在相同键的元素时，产生另一个基础情况。通用情况要么是从左子树检索该元素，要么是从右子树检索。由于左子树或右子树比原始树至少少一个节点且深度增加一层，规模随着每次调用而减小。\n\
  \n只剩下一个问题了：我们如何知道树中没有具有相同键的项目？如果树为空，那么它就不可能包含与 `item` 键相同的项目。让我们总结一下这些观察。我们定义了一个递归程序\
  \ `Retrieve`，它由 `GetItem` 成员函数调用。\n\n```\nvoid Retrieve(TreeNode* tree, \n     ItemType&\
  \ item, bool& found);\n\nItemType TreeType::GetItem(ItemType item, bool& found)\
  \ const\n// 调用递归函数 Retrieve 在树中搜索 item。\n{\n  Retrieve(root, item, found);\n  return\
  \ item;\n}\n\nvoid Retrieve(TreeNode* tree, \n     ItemType& item, bool& found)\n\
  // 递归地在树中搜索 item。\n// 后置：如果存在键与 item 匹配的 someItem，\n//       found 为 true 且 item\
  \ 设置为 someItem 的拷贝；\n//       否则，found 为 false 且 item 保持不变。\n{\n if (tree == NULL)\n\
  \   found = false;                        // 未找到 item。\n else if (item < tree->info)\n\
  \   Retrieve(tree->left, item, found);    // 搜索左子树。\n else if (item > tree->info)\n\
  \   Retrieve(tree->right, item, found);   // 搜索右子树。\n else {\n   found = true; \
  \                        // 找到。\n   item = tree->info;                    // item\
  \ 拷贝。\n}\n```\n\n让我们使用图 8.6 中的树来追踪此操作。我们要找到键为 7 的元素。非递归调用是：\n\n```\nRetrieve(root,\
  \ found)\n```\n\n`tree` 不是 `NULL`，且 `7 < tree->info`，所以第一次递归调用是：\n\n```\nRetrieve(tree->left,\
  \ found)\n```\n\n![](img/f08-06.jpg)\n\n图 8.6 追踪 `Retrieve` 操作\n\n`tree` 指向包含 9\
  \ 的节点。`tree` 不是 `NULL`，且 `7 < tree->info`，所以第二次递归调用是：\n\n```\nRetrieve(tree->left,\
  \ found)\n```\n\n现在 `tree` 为 `NULL`；我们将 `found` 设置为 `false`，`item` 保持不变。\n\n####\
  \ 函数 `PutItem`\n\n为了创建和维护存储在二叉搜索树中的信息，我们需要一个向树插入新节点的操作。我们使用以下方法。新节点始终作为叶子插入到树的适当位置。图\
  \ 8.7 显示了一系列向二叉树的插入。\n\n![](img/f08-07.jpg)\n\n图 8.7 向二叉搜索树插入：(a) 树；(b) 插入 5；(c)\
  \ 插入 9；(d) 插入 7；(e) 插入 3；(f) 插入 12；(g) 插入 6；(h) 插入 4；(j) 插入 20\n\n![](img/f08-08.jpg)\n\
  \n图 8.8 递归 `Insert` 操作：(a) 初始调用；(b) 第一次递归调用；(c) 第二次递归调用；(d) 基础情况\n\n```\nvoid Insert(TreeNode*\
  \ tree, ItemType item);\n\n我们要写一个函数 `Insert`，在给定整个树根指针的情况下将项目插入树中：\n\n```\nInsert(tree,\
  \ item);\n```\n\n在开发算法之前，我们再次强调二叉搜索树中的每个节点都是二叉搜索树的根节点。在图 8.8a 中，我们想要在包含 7 的节点的树中插入一个键值为\
  \ 13 的节点。因为 13 大于 7，我们知道新节点属于根节点的右子树。现在我们重新定义了原始问题的较小版本：我们要在以 `tree->right` 为根节点的树中插入一个键值为\
  \ 13 的节点（图 8.8b）。当然，我们已经有一个向二叉搜索树插入元素的函数：`Insert`。`Insert` 被递归地调用：\n\n```\nInsert(tree->right,\
  \ item);\n```\n\n\n\n\n`Insert` 开始执行，在根节点键值为 15 的树中查找插入 `item` 的位置。我们将 `item` 的键值（13）与根节点的\
  \ 键值 进行比较；13 小于 15，因此我们知道新的 `item` 属于树的左子树。我们再次定义了一个更小规模的问题：我们想要将一个键值为 13 的节点插入到根节点为\
  \ `tree->left` 的树中（图 8.8c）。我们递归调用 `Insert` 来执行此任务。记住，在这次（递归）执行 `Insert` 时，`tree`\
  \ 指向键值为 15 的节点，而不是原始的 `tree` 根节点：\n\n```\nInsert(tree->left, item);\n```\n\n再次，我们递归执行\
  \ `Insert`。我们将 `item` 的键值与（当前）根节点的键值比较，然后调用 `Insert` 将 `item` 插入到正确的子树中——如果 `item`\
  \ 的键值小于根节点的键值，则插入左子树；如果 `item` 的键值大于根节点的键值，则插入右子树。\n\n这一切何时结束呢？必须有一个基准情况，在该情况中，将为新元素分配空间并将\
  \ `item` 的值拷贝到其中。这种情况发生在 `tree` 为 `NULL` 时，即我们想要插入的子树为空时。（记住——我们将把 `item` 作为叶子节点添加。）图\
  \ 8.8d 展示了该基准情况。我们可以通过以下语句创建新节点并将其链接到其逻辑父节点的正确成员上：\n\n```\ntree = new TreeNode;\n\
  ```\n\n等一下！`new` 的这次执行是如何将新节点链接到现有树的？为了理解这一点，我们必须考虑函数在递归执行时 `tree` 的含义。最后一次递归调用（图\
  \ 8.9a）是 `Insert(tree-> right, item)`。因为 `tree` 是一个引用参数，在 `Insert` 的最后一次递归执行中，`tree`\
  \ 指向包含 10 的节点的 `right` 数据成员（该新节点的逻辑父节点）。执行 `new` 的语句获取新节点的地址并将其存储在 `tree` 中，通过包含\
  \ 10 的节点的 `right` 数据成员，从而将新节点链接到树结构中（图 8.9b）。`tree` 成为引用参数至关重要。如果不是，传递给 `Insert`\
  \ 的指针将是子树根的副本，而不是根本身的位置。\n\n这种技术听起来应该熟悉。我们在第 7 章 中用过它，当时我们递归地向排序列表的链实现插入元素。需要记住的重要点是：按值传递指针允许函数更改调用者指针指向的内容；按引用传递指针则允许函数更改调用者的指针，并更改指针指向的内容。递归函数总结如下：\n\
  \n![](img/f08-09.jpg)\n\n# 图 8.9 树参数是树内部的指针：(a) 最后一次调用 `Insert`；(b) 在 `Insert` 的最后一次执行中\n\
  \n这里是实现该递归算法的代码：\n\n```\nvoid Insert(TreeNode*& tree, ItemType item);\n\nvoid TreeType::PutItem(ItemType\
  \ item)\n// 调用递归函数 Insert 将 item 插入树中。\n{\n  Insert(root, item);\n}\n\nvoid Insert(TreeNode*&\
  \ tree, ItemType item)\n// 将 item 插入树中。\n// 后置：item 在树中；维护了搜索属性。\n{\n  if (tree\
  \ == NULL)\n  { // 找到插入位置。\n    tree = new TreeNode;\n    tree->right = NULL;\n\
  \    tree->left = NULL;\n    tree->info = item;\n  }\n  else if (item < tree->info)\n\
  \    Insert(tree->left, item);            // 插入左子树。\n  else\n    Insert(tree->right,\
  \ item);           // 插入右子树。\n}\n```\n\n## 插入顺序与树的形状\n\n由于我们总是将节点作为叶子添加，我们插入节点的顺序决定了树的形状。图\
  \ 8.10 展示了相同的数据以不同顺序插入如何产生形状完全不同的树。如果值按顺序（或逆序）插入，树将变得非常倾斜。元素的随机混合会产生一个较短的、“茂盛的”树。因为树的高度决定了搜索时的最大比较次数，所以树的形状具有非常重要的意义。显然，最小化树的高度可以最大化搜索效率。某些算法会调整树以使其形状更符合理想；这些方案是更高级课程的主题。\n\
  \n#### 函数 `DeleteItem`\n\n`Delete`（`DeleteItem` 的递归辅助函数）接收指向二叉搜索树的外部指针和一个一个 item，然后从树中找到并删除与\
  \ item 键值匹配的节点。根据操作规范，树中存在一个具有相同键值的 item。这些规范建议将操作分为两个部分：\n\n我们知道如何找到节点；我们在 `Retrieve`\
  \ 中已经做过了。操作的第二部分——从树中删除该节点——更为复杂。这项任务取决于节点的位置。显然，删除一个叶子节点比删除根节点要简单。事实上，我们可以根据子节点的数量将删除分为三种情况：\n\
  \n![](img/f08-10.jpg)\n图 8.10 输入决定了形状：(a) 输入 D C；(b) 输入 B D；(c) 输入 A E\n\n1. **删除叶子（无子节点）：**\
  \ 如图 8.11 所示，删除叶子只需将其父节点的相应链接设置为 `NULL` 然后处理该不需要的节点。\n2. **删除只有一个节点的节点：** 删除叶子的简单方案对于删除带子节点的节点并不适用，因为我们不想丢失其所有的后代节点。相反，我们希望父节点的指针跳过被删除的节点并指向它的孩子（见图\
  \ 8.12）。\n3. **删除有两个子节点的节点：** 这种情况最复杂，因为我们无法让被删除节点的父同时指向被删除节点的两个孩子。\n\n![](img/f08-11.jpg)\n\
  图 8.11 删除叶子\n\n![](img/f08-12.jpg)\n图 8.12 删除只有一个节点的节点\n\n树必须保持为二叉树，搜索属性必须保持完整。我们有几种方法完成这种删除。我们使用的方法不是删除节点，而是将其\
  \ `info` 数据成员替换为树中另一个节点的 `info` 数据成员，该节点维护了搜索属性。然后我们删除另一个节点。\n\n我们可以使用哪个元素来替换被删除的\
  \ `item` 以维护搜索属性？答案是“紧邻 `item` 键值的元素——即 `item` 的逻辑前驱或逻辑后继。”我们将要删除的节点的 `info` 数据成员替换为其逻辑前驱的键值最接近的\
  \ `info` 数据成员。查看图 8.7j 并定位节点 5、9 和 7 的逻辑前驱。你发现这种模式了吗？5 的逻辑前驱是 5 左子树中的最大值。9 的逻辑前驱是\
  \ 9 左子树中的最大值。7 的逻辑前驱是 6，即 7 左子树中的最大值。这个替换值位于一个没有孩子或只有一个孩子的节点中。然后我们通过更改其父节点的一个指针来删除原始包含该替换值的节点（见图\
  \ 8.13](#ch08.xhtml_ch8fig13)）。图 8.14 展示了所有这些类型删除的示例。\n\n\n\n\n显然，删除任务涉及更改被删除节点的父节点的指针。如果我们的递归算法将\
  \ `tree` 作为引用参数传递，那么 `tree` 本身本身就是我们必须更改的父节点。让我们从程序实现的角度来看这三种情况。\n\n如果两个子指针都为 `NULL`，则该节点是叶子节点，我们只需将\
  \ `tree` 设置为 `NULL`。如果其中一个子指针为 `NULL`，我们把 `tree` 设置为另一个子指针。如果两个子指针都不为 `NULL`，我们把\
  \ `tree` 的 `info` 数据成员替换为该节点逻辑前驱节点的 `info` 数据成员，并删除包含该逻辑前驱的节点。我们将该算法总结为 `DeleteNode`。\n\
  \n![](img/f08-14.jpg)\n\n图 8.14 从二叉搜索树中删除：(a) 初始树；(b) 删除 J；(c) 删除 C；(d) 删除 L；(e)\
  \ 删除 D；(f) 删除 A\n\n现在我们可以为 `Delete` 编写递归定义和代码。\n\n```\nvoid DeleteNode(TreeNode*&\
  \ tree);\n\nvoid Delete(TreeNode*& tree, ItemType item);\n\nvoid TreeType::DeleteItem(ItemType\
  \ item)\n\n// 调用递归函数 Delete 从树中删除 item。\n\n{\n  Delete(root, item);\n}\n\nvoid Delete(TreeNode*&\
  \ tree, ItemType item)\n\n// 从树中删除 item。\n// 后置：item 不在树中。\n\n{\n  if (item < tree->info)\n\
  \    Delete(tree->left, item);            // 在左子树查找。\n  else if (item > tree->info)\n\
  \    Delete(tree->right, item);           // 在右子树查找。\n  else\n    DeleteNode(tree);\
  \                    // 找到节点；调用 DeleteNode。\n}\n```\n\n在编写 `DeleteNode` 之前，让我们再次查看。如果我们发现左子指针为\
  \ `NULL` 时执行的操作也处理了两个子指针都为 `NULL` 的情况，我们就可以省略其中一个测试。当左子指针为 `NULL` 时，右子指针存储在 `tree`\
  \ 中。如果右子指针也为 `NULL`，那么 `NULL` 被存储在 `tree` 中，这正是当两者都为 `NULL` 时我们想要的结果。\n\n按照良好的自顶向下写法，现在我们编写\
  \ `DeleteNode` 的代码，使用 `GetPredecessor` 作为操作名称，它返回具有两个子节点的前驱节点 `info` 数据成员的拷贝：\n\n\
  ```\nvoid GetPredecessor(TreeNode* tree, ItemType& data);\n```\n\n```cpp\nvoid DeleteNode(TreeNode*&\
  \ tree)\n\n// 删除 tree 指向的节点。\n// 后置：tree 指向的节点中的用户数据不再\n// 在于树中。如果 tree 是叶子节点或只有一个\n\
  // 非 NULL 子指针，则 tree 指向的节点被\n// 删除；否则，用户数据将被其逻辑\n// 前驱替换，并且该逻辑前驱节点被删除。\n{\n  ItemType\
  \ data;\n  TreeNode* tempPtr;\n  tempPtr = tree;\n  if (tree->left == NULL)\n  {\n\
  \    tree = tree->right;\n    delete tempPtr;\n  }\n  else if (tree->right == NULL)\n\
  \  {\n    tree = tree->left;\n    delete tempPtr;\n  }\n  else\n  {\n    GetPredecessor(tree->left,\
  \ data);\n    tree->info = data;\n    Delete(tree->left, data);  // 删除前驱节点。\n  }\n\
  }\n```\n\n接下来，我们查看查找逻辑前驱的操作。我们知道逻辑前驱是 `tree` 左子树中的最大值。这个节点是在哪里找到的？二叉搜索树中的最大值位于最右侧节点。因此，给定\
  \ `tree` 的左子树，我们只需一直向右移动直到右孩子为 `NULL`。当这种情况发生时，我们将 `data` 设置为该节点的 `info` 成员。在这种情况下，我们没有理由递归地寻找前驱。简单的迭代直到\
  \ `tree->right` 为 `NULL` 即可：\n\n```cpp\nvoid GetPredecessor(TreeNode* tree, ItemType&\
  \ data)\n\n// 将 data 设置为 tree 中最右节点的 info 成员。\n{ \n  while (tree->right != NULL)\n\
  \    tree = tree->right;\n  data = tree->info;\n}\n```\n\n#### 函数 `Print`\n\n要遍历一个线性链表，我们设置一个临时指针等于链的开头，然后从一个节点到另一个节点跟随链接，直到到达一个指针值为\
  \ `NULL` 的节点。同样，要遍历二叉树，我们将指针初始化为树的根。但从那里我们要去哪里呢——向左还是向右？我们是先访问根还是叶子节点？答案是“所有这些”。遍历列表只有两种方法：正向和反向。相比之下，遍历树有许多方法。\n\
  \n中序遍历访问节点的方式使得节点中的值按照从小到大的顺序被访问。这种技术正是我们 `Print` 函数所需要的。\n\n首先，我们打印根的左子树——即树中所有小于根节点值的所有值。接着，我们打印根节点中的值。最后，我们打印根的右子树中的值——即所有大于根节点值的所有值。\n\
  \n让我们再次描述这个问题，采用递归思考（并编写一个名为 `Print` 的递归函数）。我们想要按顺序打印；即首先调用 `Print` 打印左子树，然后打印根，最后打印右子树。\n\
  \n如果其中一次递归调用的输入参数为 `NULL` 会发生什么？这种情况标志着参数是一个空树的根。在这种情况下，我们只需要退出函数——显然，没有必要打印空子树：\n\
  \n![](img/f08-15.jpg)\n\n图 8.15 有序打印所有节点\n\n这种描述可以通过以下递归函数实现。为了简单起见，我们假设 `tree->info`\
  \ 可以直接使用流输出。这里是执行打印的辅助函数：\n\n```cpp\nvoid PrintTree(TreeNode* tree, std::ofstream&\
  \ outFile)\n\n// 按顺序输出 tree 中项的 info 成员。\n{\n  if (tree != NULL)\n  {\n    PrintTree(tree->left,\
  \ outFile);  // 打印左子树。\n    outFile << tree->info;\n    PrintTree(tree->right, outFile);\
  \ // 打印右子树。\n  }\n}\n```\n\n我们之所以称之为中序遍历，是因为我们在处理（打印）节点本身的信息之前访问了节点的左子树，然后访问右子树。\n\
  \n最后，`TreeType` 类的 `Print` 成员函数如下调用 `PrintTree`：\n\n```cpp\nvoid TreeType::Print(std::ofstream&\
  \ outFile) const\n\n// 调用递归函数 Print 打印树中的项。\n{\n  PrintTree(root, outFile);\n}\n\
  ```\n\n### 类构造函数和析构函数\n\n默认类构造函数通过将 `root` 设置为 `NULL` 来创建一个空树。由于没有其他逻辑上的构建空树的方法，我们不提供带参数构造函数：\n\
  \n```cpp\nTreeType::TreeType()\n{\n  root = NULL;\n}\n```\n\n\n\n就像类构造函数负责每个类对象的初始化一样，类析构函数负责在类对象超出作用域时释放动态节点。该操作调用了一个递归程序，以二叉搜索树的指针作为参数，并销毁所有节点，使树为空。为了删除元素，我们必须遍历这棵树。我们没有像上一节中那样打印每个元素，而是从树中移除该节点。我们提到过遍历二叉树的方法有多种。是否有首选的销毁树的方法？\n\
  \n虽然任何遍历方式都能让函数正常工作，但其中一种遍历顺序比其他的更高效。由于 `DeleteNode` 操作删除叶子节点的工作量比删除有子节点的节点少，我们希望先删除叶子节点。允许我们优先访问叶子节点的被称为**后序遍历**：在处理节点本身之前，我们先访问每个节点的左子树和右子树。如果你按照后序删除节点，那么当轮到删除某个节点时，它已经是一个叶子节点。析构函数的代码如下：\n\
  \n```\nvoid Destroy(TreeNode*& tree); TreeType::~TreeType()\n\n// 调用递归函数 Destroy\
  \ 来销毁树。\n{\n  Destroy(root);\n}\n\nvoid Destroy(TreeNode*& tree)\n// 后: tree 为空；节点已释放。\n\
  {\n  if (tree != NULL)\n  {\n    Destroy(tree->left); Destroy(tree->right); delete\
  \ tree;\n  }\n}\n```\n\n`MakeEmpty` 成员函数的体与类析构函数相同，唯一的区别是：在调用 `Destroy` 之后，它必须将\
  \ `root` 设置为 `NULL`。\n\n### 复制树\n\n拷贝构造函数和赋值运算符的重载都涉及创建树的副本。复制树可能是与树相关的最有趣且最复杂的算法。显然，它涉及一个递归算法。我们必须像处理其他所有成员函数那样：：以\
  \ `root` 为参数调用一个辅助递归函数。拷贝构造函数和赋值运算符都调用此函数：\n\n```\nvoid CopyTree(TreeNode*& copy,\n\
  \     const TreeNode* originalTree);\n\nTreeType::TreeType(const TreeType& originalTree)\n\
  // 调用递归函数 CopyTree 将 originalTree\n// 复制到 root 中。\n{\n  CopyTree(root, originalTree.root);\n\
  }\n\nvoid TreeType::operator=\n     (const TreeType& originalTree)\n// 调用递归函数 CopyTree\
  \ 将 originalTree\n// 复制到 root 中。\n{\n  if (&originalTree == this)\n    return; //\
  \ 忽略赋值给自身。\n  Destroy(root); // 释放现有的树节点。\n  CopyTree(root, originalTree.root);\n\
  }\n```\n\n递归函数 `CopyTree` 有两个参数，都是指向树节点的指针。我们称它们为 `copy` 和 `otherTree`。基本情况是什么？如果\
  \ `otherTree` 为 `NULL`，则 `copy` 为 `NULL`。如果 `otherTree` 非 `NULL`，`copy` 是什么？我们为\
  \ `copy` 获取一个指向的节点并将 `otherTree->info` 放入其中。然后我们将 `otherTree` 左子树的副本存储在 `copy` 的左孩子中，并将\
  \ `otherTree` 右子树的副本存储在 `copy` 的右孩子中。我们从哪里获取子树的副本？当然，我们递归地使用 `CopyTree`：\n\n```\n\
  void CopyTree(TreeNode*& copy,\n       const TreeNode* originalTree)\n// 后: copy\
  \ 是一棵与 originalTree 相同的\n//       树的根节点。\n{\n  if (originalTree == NULL)\n    copy\
  \ = NULL;\n  else\n  {\n    copy = new TreeNode;\n    copy->info = originalTree->info;\n\
  \    CopyTree(copy->left, originalTree->left); \n    CopyTree(copy->right, originalTree->right);\n\
  \  }\n}\n```\n\n在进入下一节之前，确保你理解这段代码是如何工作的。和许多递归算法一样，这个短函数虽然优雅但并不直观。事实上，让我们在以下树上追踪\
