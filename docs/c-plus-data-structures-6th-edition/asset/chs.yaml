  \ 10.19 中，我们演示了向图 10.18b 所示的 B 树插入值 6。\n\n#### 总结\n\n在本章中，我们引入了三种自平衡树抽象数据类型（ADT），以确保\
  \ O(log[2]N) 的搜索效率。我们解释了根据你的应用程序及其数据的性质，何时以及为什么要使用这些树。我们涵盖了 AVL 树，它通过四种旋转操作在插入和删除操作中维护平衡。这些旋转操作是根据修改后树的结构应用的。AVL\
  \ 树通过旋转操作，以在插入和删除期间修复树的代价提供了对数搜索性能。\n\n我们还讨论了红黑树，它引入了重染色程序以及四种 AVL 旋转操作，以减少确保 O(log[2]N)\
  \ 搜索性能所需的工作。尽管重染色算法并不总是产生平衡树，但它足以提供我们所需的保证性能。\n\n最后，我们探索了 B 树，它是二叉搜索树的推广，每个节点最多有\
  \ m 个子节点。B 树最显著的特征是分裂操作，它用于确保所有叶子节点都处于树的同一层。\n\n#### 练习题\n\n\n\n\n\n1. 按照插入顺序提供十个元素的列表，构建一个二叉树，该二叉树在所有元素插入后是一个搜索性能为\
