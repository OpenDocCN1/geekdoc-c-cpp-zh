  - 索引\n\n#### 前言\n\n在本版中，两位新作者的加入将延续《C++ Plus Data Structures》追求卓越的传统，而 Nell Dale\
  \ 将退出出本书未来开发的领导工作。Chip Weems 在过去的 30 年里一直是 Nell 许多其他书目的的合著者，包括 `Java Plus Data Structures`，并为本书早期版本及其前身所奠定的教学方法做出了重大贡献。Tim\
  \ Richards 则深度参与了 Chip 和 Nell 的最新版 `Progamming and Problem Solving in C++` 的开发。他们共同致力于全球各地学生的成功，而这种承诺自然也是激励我们所有人每天走进教室、并怀有教学之爱的基石。\n\
  \n在过去的二十十年里，传统的数据结构课程已经扩展到涵盖更广泛的主题，如抽象数据类型（ADTs）、软件工程和算法基础分析。\n\n“数据结构”一术是指研究如何以组织化的关系表示数据集合，以及如何编写操作这些集合的算法。“抽象数据类型（ADT）”一术是指根据一组定义属性对数据进行描述，以及可以应用于这些数据的操作。这种重点的转移代表了计算机科学教育向更高抽象性的迈进。我们现在不仅研究数据对象类的抽象属性，还研究这些对象在程序中如何被表示。Johannes\
  \ J. Martin 简洁地指出：“取决于观点，一个数据对象的特征可以通过其类型（对于用户而言）或其结构（对于实现者而言）来描述。”¹\n\n抽象的设计和实现都与软件工程紧密相关，软件工程寻求将工程方法应用于开发可靠、健壮且正确的软件。糟糕的抽象会导致一组臃肿的用例，迫使应用程序程序员要么编写编写不必要的复杂代码，要么忽略重要的有效性检查。糟糕的实现可能导致效率低下或易于错误。设计高效实现的一个方面是能够分析给定算法所完成的工作。因此，在全书中，我们根据应用需求区分了抽象的工程与实现的工程，并花时间分析我们所引入的算法。\n\
  \n### 抽象的三个层次\n\n《C++ Plus Data Structures》的重点在于从三个不同的视角来看 ADT：它们的规范、应用和实现。规范描述的是逻辑或抽象层面，关注数据类型代表了什么。应用层面关注在解决问题中使用数据。这一层次关注为什么该数据类型具有特定的属性和操作。实现层面则是实际编写代码的地方；它关注“如何实现”的问题。\n\
  \n在这一范围内，我们强调计算机科学理论和软件工程原则，包括模块化、数据封装、信息隐藏、数据抽象、面向对象分解、函数分解、算法分析以及软件生命周期验证方法。我们坚信，应该在学生接受计算机科学教育早期就引入这些原则，让他们从一开始就学会实践良好的软件技术。\n\
  \n为了向可能尚未完成许多大学级数学课程的学生教授这些概念，我们始终使用直观的解释，即使对于具有数学基础的主题（如算法分析）。在任何情况下，我们的最高目标都是让我们的解释尽可能易读且易于理解。\n\
  \n### 前提假设\n\n在书中，我们假设学生熟悉以下 C++ 构造：\n\n* 内置简单数据类型\n* 流输入/输出（I/O），由`<iostream>`\
  \ 提供\n* 流 I/O，由`<fstream>` 提供\n* 控制结构 `while`、`do...while`、`for`、`if` 和 `switch`\n\
  * 具有值参数和引用参数的用户定义函数\n* 内置数组类型\n* 类构造\n\n我们在文中加入了侧边栏，以回顾这些主题的某些细节。\n\n### 六版的更新\n\
  \n通用变更与重组 本版六版的关键变化主要集中在书的后半部分。在之前的修订中，所有的排序算法都被移动到了一个章节中以便于统一分析。但我们发现快速排序是递归的一个非常自然的演示，因此我们选择将其移回\
  \ 第 7 章，现在排序章节 第 12 章 仅将其作为复杂度分析的基础进行回顾。\n\n第 9 章 曾一度成为某种 ADT 的杂烩，现在完全专注于堆和与密切相关的\
  \ `Priority Queue`（优先级队列）ADT。我们还将堆排序算法的涵盖范围移动到了这一章，第 12 章 对其进行了充分回顾，以激发对其分析以及与其他排序方法的比较。根据用户反馈，我们增加了一个完全全新的\
  \ 第 10 章，命名为“树 Plus”，用于处理 AVL 树、红黑树和 B 树。第 11 章 则汇集了关联容器的涵盖范围，在现有 `Set` ADT 的基础上新增了\
  \ `Map` ADT 节，以及哈希表。\n\n排序在 第 12 章 中介绍。但我们没有引入广泛的算法，而是将新的排序算法限制在归并排序和基数排序，并强调在选择排序算法时对排序复杂度以及其他效率考虑的分析。本章新增了关于缓存及其对性能影响的讨论，以及\
  \ C++ 线程库和并行归并排序。后者是 2013 ACM 课程更新的关键元素，该更新部分基于 IEEE 并行处理技术委员会的课程建议，Chip 是该委员会的主要贡献者。\n\
  \n我们认为书中对图的广泛涵盖值得拥有自己的章节——第 13 章，而不是与几个不相关的 ADT 混在一起。这也反映了我们的理念：综合数据结构教材的后半部分必须更具模块化，以便教师能够根据特定课程的情况调整不同\
  \ ADT 的涵盖范围。\n\n#### C++ 11\n\n自五版发布以来，C++ 11 标准已变得广泛普及。因此，我们开始在书中引入它的新特性。特别是，我们现在涵盖了基于范围的\
  \ for 循环（在 第 6 章）和新的线程库（在 第 12 章）。\n\n### 内容与组织\n\n\n\n\n\n# 第一章\n第一章 概述了高质量软件的基本目标，以及为了设计和实现满足这些目标的程序所需的软件工程基本原理。文中讨论了抽象、函数化分解和面向对象的设计。本章还探讨了我们认为软件教育中一项关键的需求：设计和实现正确程序并验证它们确实正确的能力。所涵盖的主题包括：生命周期验证的概念；使用前置条件和后置条件进行正确性设计；使用台检检查（deskchecking）以及设计/代码走查和审查在测试前识别错误；调试技术、数据覆盖（黑盒）和代码覆盖（清晰盒或白盒）方法；以及测试计划、单元测试和使用存根程序（stubs）和驱动程序（drivers）的结构化集成测试。文中介绍了通用测试驱动程序的概念，并在开发\
  \ `ADT Fraction` 的案例研究中对其执行了操作。\n\n# 第二章\n第二章 介绍了数据抽象和封装，这些与程序中使用的数据结构设计相关的软件工程概念。文中讨论了数据的三个视角：抽象、实现和应用。通过一个真实世界的示例（图书馆）来说明了这些视角，然后将其应用于\
  \ C++ 支持的内置数据结构——即 `structs` 和 `arrays`。`C++` 类类型被引入为我们在后续章节中检查的 `ADTs` 的表示方式。在这里介绍了面向对象编程的原则——封装、继承和多态，以及配套的\
  \ `C++` 实现构造结构。本章末尾的案例研究通过设计和实现一个表示日期的用户定义数据类型，强化了数据抽象和封装的思想。该类使用了一个版本的通用测试驱动程序进行测试。\n\
  \n第二章 包含了对两种有助于用户编写更好软件的 C++ 构造的讨论：命名空间（namespace）和使用 `try/catch` 语句的异常处理。随后的章节将演示了处理错误的各种方法。\n\
  \n由于解决问题的方法不止一种，我们讨论了如何通过使用 `Big-O` 表示法对算法分析来比较竞争性的解决方案。在书的其余部分，将一直使用 `Big-O` 表示法对\
  \ `ADT` 实现进行比较。案例研究定义了 `ADT Date`，实现了该类，定义了测试计划并实施了该计划。\n\n我们希望认为第一章和第二章中的材料对大多数学生来说是复习。然而，这两章中的概念对任何学生的未来都至关重要，因此我们认为不能依赖他们之前已经见过这些材料。\n\
  \n# 第三章\n第三章 介绍了所有 `ADT` 中最基础的无序列表。本章从对 `ADTs` 操作的般讨论开始，然后介绍了检查所有其他数据类型的框架：规范的介绍与讨论、使用操作的简单应用，以及操作的设计与编码。规范针对\
  \ `ADT Unsorted List`。文中开发了该规范的基于 `array` 的实现。\n\n文中介绍了动态分配的概念，以及使用 `C++` 指针变量的语法。文中详细地介绍了链接节点以形成列表的概念，并配有许多图表。然后使用该技术重新实现了无序列表。使用\
  \ `Big-O` 表示法比较了基于 `array` 的实现和链链的实现。案例研究设计了 `ADTs Card` 和 `Deck` 来表示一副扑克牌。它们被实现为类并进行了测试。\n\
  \n# 第四章\n第四章 引入了 `ADT Sorted List` 并开发了基于 `array` 的实现。引入了二分查找作为提高排序列表搜索操作性能的方法。随后使用链式实现实现了该\
  \ `ADT`。使用 `Big-O` 表示法对这些实现进行了比较。\n\n文中讨论了边界结构和无边界结构之间的逻辑与物理区别。在案例研究中介绍并演示了四阶段面向对象方法论，该研究根据德州拉斯维斯扑克牌的规则评估手牌。\n\
  \n# 第五章\n第五章 介绍了 `ADTs Stack` 和 `Queue`。每个 `ADT` 首先从其抽象角度进行考虑，并强调了在 `ADT` 规范中记录逻辑抽象的想法。这些操作被应用于程序中；然后使用基于\
  \ `array` 的现在 `C++` 中实现了操作集，随后是链式实现。案例研究使用本章创建的类模拟了纸牌游戏。\n\n# 第六章\n第六章 是高级概念和技术的集合。引入了\
  \ `Templates` 作为实现泛型类的方法。讨论了循环链表和双向链表。为每种变体开发并实现了插入、删除和列表遍历算法。设计了一种使用静态分配（`structs`\
  \ 数组 `array`）的链式结构的替代表示法。详细涵盖了类拷贝构造函数、运算符重载和动态绑定。引入了 `iterator`（迭代器）的概念，我们看到了如何使用基于范围的\
  \ `for` 循环来实现列表的迭代。案例研究使用双向链表来实现大整数。\n\n# 第七章\n第七章 介绍了递归，让学生对该概念有直观理解，然后展示了如何使用递归解决编程问题。通过许多示例说明了编写递归函数的指南。在证明了手动模拟递归程序非常麻烦后，引入了一种简单的三问法来验证递归函数的正确性。由于许多学生畏递归，因此对该材料的介绍特意直观且非数学化。对递归如何工作的更详细讨论有助于理解如何用迭代和栈来替换它。作为通过递归简化重要算法的具体示例，我们引入了快速排序。案例研究开发并实现了逃离迷宫的过程。\n\
  \n# 第八章\n第八章 引入了 `ADT Binary Search Tree` 作为排列数据的方法，提供了链式结构的灵活性以及 O(log2N) 的插入删除时间。为了在前章的基础上并利用二叉树固有的递归性质，算法首先递归给出。在递归实现所有操作后，我们迭代地实现了插入和删除操作。最后比较了线性列表与二叉搜索树的操作复杂度。案例研究讨论了构建手稿索引的过程并实施了第一阶段。\n\
  \n# 第九章\n第九章 由 `Priority Queue ADT` 启发，可以通过 `Heap ADT` 轻松实现。而堆又可以通过 `Binary Tree\
  \ ADT` 的数组实现来高效构建。因此，我们首先从抽象层面概述优先级队列，然后考虑如何使用非链接的数组表示来实现完全二叉树。在引入堆的形状属性（要求其为完全二叉树）时，显然先前的树实现是堆实现的完美基础。我们随后回到应用堆作为实现优先级队列的方法。为了进一步演示堆的效用，我们引入了堆排序算法。\n\
  \n\n\n\n\n第 10 章 是全新的。它将二叉搜索树的思想扩展到了更高级的自平衡形式。通过 `AVL Tree` ADT 引入了基本概念，它维持了严格的平衡。然后我们通过\
  \ `红黑树` ADT 放宽了平衡约束。最后，通过对 `B 树` ADT 的层次探索，将平衡树的概念从二叉形式扩展到更高阶的树结构。虽然本章确实提到了堆，但如果讲师有强烈意愿，可以在第\
  \ 8 章之后立即引入它。\n\n第 11 章 汇集了 `Set` 和 `Map` 这两个 ADT，它们是常用于查找操作的关联结构。在集合的情况下，查找决定一个元素是否存在于结构中；而在映射中，我们还感兴趣检索与指定键配对的值。鉴于查找是这些结构的初衷之一，在这里引入哈希（Hashing）的概念也是理所当然的，因为它用于高效实现关联结构。由于映射的实现是基于二叉搜索树的，因此本章可以在第\
  \ 8 章之后的任何时间讲解。\n\n第 12 章 介绍了若干排序和搜索算法，并提出了问题：哪一个更好？图中所示的基于比较的排序算法包括直接选择排序、两个版本的冒泡排序、快速排序、堆排序和合并排序。合并排序是本节唯一的新算法。然后我们使用\
  \ `Big-O` 记法对排序算法进行比较。接着，我们讨论了排序中的其他实际效率考虑，包括数据集的大小、函数调用开销、程序员时间、内存空间、键的稳定性、排序指针数组以及缓存。基数排序被作为直接比较值进行排序的示例引入并对其进行了分析。最后，我们回到合并排序，将其作为一个易使用\
  \ `C++` 线程库进行并行化的算法示例。排序部分的讨论仅依赖于之前对递归、快速排序和堆排序的涵盖，因此可以在第 9 章之后的任何时间使用。\n\n第 13\
  \ 章 通过引入 `Graph` ADT 概念，打破了早期 ADT 结构中存在的规则性，并探索了邻接矩阵实现以及创建邻接表的两种方法。书中还引入并比较了广度优先和深度优先搜索。本章的内容仅依赖于栈和队列，因此可以在第\
  \ 5 章之后的任何时间讲解。\n\n### 附加功能\n\n#### 章节目标 每章开头的一组目标有助于学生评估他们的学习情况。这些目标将在每章末尾的练习中进行测试。\n\
  \n#### 章节练习 练习题难度程度不一，包括短程序题、算法分析以及测试学生对概念理解的问题。练习题答案可以在教师手册中找到。\n\n#### 案例研究共有八个案例研究。每个案例都包含问题描述、问题输入和所需输出的分析，以及对适用数据类型的讨论。大多数案例研究已经过完全编码和测试。留下了两个部分完整的案例，需要学生完成并测试最终版本。\n\
  \n#### 学生和教师资源 书中所有程序、部分程序和案例研究的源代码供学生和教师在 `go.jblearning.com/cplusds6e` 下载。此外，教师可以访问以下资源：\n\
  \n*   教师手册，包含目标、教学笔记、练习（课堂活动建议）、每章的编程作业以及章末练习的答案\n*   PowerPoint 格式的幻灯片\n*   测试题库\n\
  \n### 致谢\n\n首先，我们要感谢那些回复了我们关于这个新版本调查的人们。受访者包括旧版教材的用户和非用户：\n\nBarbara Bracken, 博士，威尔克斯大学数学与计算机科学系副教授\n\
  \nLionel L. Craddock，布鲁菲尔德州立学院\n\nJohn Dean，计算机科学教授，帕克大学计算机科学与信息系统系主任\n\nMuhammad\
  \ Ghanbari，加利福尼亚州立大学\n\nCarolyn Golden, 博士，哈斯顿-蒂洛特森大学计算机科学系副教授\n\nTerry R. Hostetler，科伊学院计算机科学教授\n\
  \nAmitava Karmaker，威斯康星州大学斯劳特分校副教授\n\nFred L. Strickland, 博士，特洛大学蒙特马利分校计算机科学系兼职教师\n\
  \nRajendran Swamidurai 博士，阿拉巴马州立大学计算机科学系副教授\n\n中效飞 (Jiaofei Zhong), 博士，加利福尼亚州立大学东分校\n\
