    \ that one must make it scurry along a surface. As you move the mouse, the pointer\
    \ on the display screen moves in the same direction. Mouse contains at least one\
    \ button and sometimes as many as three, which have different functions depending\
    \ on what program is running. Some newer mice also include a scroll wheel for\
    \ scrolling through long documents.\n\nInvented by Douglas Engelbart of Stanford\
    \ Research Center in 1963, and pioneered by Xerox in the 1970s, the mouse is one\
    \ of the great breakthroughs in computer ergonomics because it frees the user\
    \ to a large extent from using the keyboard. In particular, the mouse is important\
    \ for graphical user interfaces because you can simply point to options and objects\
