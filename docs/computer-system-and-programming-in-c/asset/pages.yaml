    # Language Using Microsoft Windows Environment


    If we want to use Microsoft Windows/DOS environment then we have to follow the
    following steps for execute any C program:


    **Edit Stage**

    The direct executable file of C language is TC.exe then firstly we have to find
    tc.exe file and then double click on it then automatically the editor of Turbo
    C environment is open and we have to write the program on this environment:


    **Compile and Link**

    For the Turbo C environment, firstly we have to save the program with filename.c
    and then compile it with the help of ALT+F9 and if any errors are occurred then
    that particular errors are reported to the user and then we link the program with
    the help of CTRL+F9 then automatically the direct executable file is created.


    **Execute**

    When the source file is compiled and then the .obj file is created then we have
    to link it then automatically the direct executable file is created and the program
    is automatically executed.


    **Errors**

    First error highlighted. Use **Next Error** from **Search** menu for advance errors
    if applicable.

    If you get an error message, or you find that the program does not work when you
    finally run it (at least not in the way you anticipated) you will have to go back
    to the source file, the .c file, to make alters and go through the whole development
    process again!


    # C Language Using UNIX Environment


    on all UNIX systems further help on the C compiler can be obtained from the on-line
    manual. Type


    **Man CC**

    on your local UNIX system for more information.


    Please note that UNIX is a case sensitive operating system and files named firstprog.c
    and FIRSTPROG.c are handled as two separate files on these system. By default
    the UNIX system compiles and links a program in one step, as follows:


    ```

    cc firstprog.c

    ```


    This command creates an executable file called a.out that overwrites any existing
    file called a.out. Executable files on UNIX are run by typing their name. In this
    case the program is executed as follows:


    ```

    a.out

    ```


    To change the name of the executable file type:


    ```

    cc -o firstprog firstprog.c

    ```


    This produces an executable file called firstprog which is run as follows:


    ```

    Firstprog

    ```


    # GENERAL INSTRUCTIONS FOR WRITING A PROGRAM IN TURBO C ENVIRONMENT


    The following are the general instructions for writing a program in TURBO C environment.


    +   1. Firstly we have to write a program using TURBO C environment and then save
    it as first.c where first is the primary name of the file and .c is the extension
    of that file.

    +   2. Then we have to compile it with the help of ALT+F9 then automatically the
    object file is created, i.e. First.obj that is written in machine language.

    +   3. Then we have to LINK it with the help of CTRL+F9 then automatically the
    direct executable file is created i.e. First.exe and the program is automatically
    executed.


    # ADD COMMENTS TO A PROGRAM


    A comment is a note to yourself (or others) that you put into your source code.
    All comments are dismissed by the compiler. They exist solely for your benefit.
    Comments are used mainly to document the intending and purpose of your source
    code, so that you can remember later how your functions and how'
