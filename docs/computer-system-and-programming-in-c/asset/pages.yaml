    \ establishes a link between node1 and node2. Similarly, we can combine the process\
    \ to create a special pointer value called null that can be stored in the next\
    \ field of the last node.\n\n# **Advantages of Linked List**\n\nA linked list\
    \ is a dynamic data structure and therefore the size of the linked list can grow\
    \ or shrink in size during execution of the program. A linked list does not require\
    \ any extra space therefore it does not waste extra memory. It provides flexibility\
    \ in rearranging the items efficiently.\n\nThe limitation of linked list is that\
    \ it consumes extra space when compared to an array since each node must also\
    \ contain the address of the next item in the list to search for a single item\
    \ in a linked list is cumbersome and time consuming.\n\n# *Types of Linked List*\n\
    \nThere are different kinds of linked lists they are as follows:\n\n+   - Linear\
    \ singly linked list\n+   - Circular singly linked list\n+   - Two way or doubly\
    \ linked list\n+   - Circular doubly linked list.\n\n# **Applications of Linked\
    \ Lists**\n\nLinked lists concepts are useful to model many different abstract\
    \ data types such as queues stacks and trees. If we restrict the process of insertions\
