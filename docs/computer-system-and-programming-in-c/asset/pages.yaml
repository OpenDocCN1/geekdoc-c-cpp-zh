    # The Nested Loop


    These loops are the loops which contain another looping statement in a single
    loop. These types of loops are used to create matrix. Any loop can contain a number
    of loop statements in itself. If we are using loop within loop that is called
    nested loop. In this the outer loop is used for counting rows and the internal
    loop is used for counting columns.


    The general syntax of Nested Loop is as follows:


    ```

    for (initializing ; test condition ; increment / decrement) //Outer Loop

    {

    statement;

    for (initializing ; test condition ; increment / decrement) // Inner Loop

    {

    body of inner loop;

    }

    statement;

    }

    ```


    The execution of the nested loop is as follows:


    Firstly the outer loop is executed and according to the outer loop the inner loop
    is executed and according to the inner loop the statements are executed. When
    the inner loop is terminated then the pointer is automatically goes to outer loop
    and when the outer loop is terminated then the complete loop is terminated.


    Here, an *inner for loop* is written inside the *outer for loop*. For every value
    of *i*, *j* takes the value from 1 to i and then value of i is incremented and
    next iteration of outer loop starts ranging j value from 1 to i.


    # Programming Problems


