    #include<stdio.h>

    #include<conio.h>

    void main()

    {

    int i,j;

    clrscr();

    for(i=2;i<=10;i++)

    {

    for(j=1;j<=10;j++)

    printf("\\n%d",i*j);

    }

    getch();

    }

    ```'
