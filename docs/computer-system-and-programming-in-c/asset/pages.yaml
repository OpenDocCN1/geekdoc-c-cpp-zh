- pgno: 283
  md: '# Preprocessor Directives


    Preprocessors in C as name signifies is something which is done before processing.
    Before your compiler compiles your code you can give your compiler various instruction
    on how to handle the source code and its compilation. Major aim of C preprocessor
    is to expand the scope of the programming environment and to make your code more
    portable and manageable. Also code developed using preprocessor directives tends
    to be more maintainable than normal because changes can be introduced with minimum
    fuss and side effects.


    Theoretically, the “preprocessor” is a translation phase that is applied to the
    source code before the compiler gets its hands on it. The C preprocessor is not
    part of the compiler, but is a separate step in the compilation process. C preprocessor
    is just a text substitution tool, which filters your source code before it is
    compiled. The preprocessor more or less provides its own language, which can be
    a very powerful tool for the programmer. All preprocessor directives or commands
    begin with the symbol #.


    The preprocessor makes programs easier to develop, read and modify. The preprocessor
    makes C code portable between different machine architectures and customizes the
    language.


    The preprocessor performs textual substitutions on your source code in three ways:


    +   1. *File inclusion:* Inserting the contents of another file into your source
    file, as if you had typed it all in there.

    +   2. *Macro substitution:* Replacing instances of one piece of text with another.


    +   3. *Conditional compilation:* Arranging that, depending on various circumstances,
    certain parts of your source code are seen or not seen by the compiler at all.


    # TYPES OF PREPROCESSORS


    There are only handful of preprocessor defined in Standard C and few of them work
    together in combination yet they allow you to achieve much more without much less
    effort. In addition, your compiler must be providing many more preprocessor to
    exploit your programming environment and programming potential to maximum but
    keep in mind they produce very specific targeted code when used which is not very
    portable.


    Preprocessor can be broadly classified into following groups on the basis of functionality
    they provide.


    +   1. **#define and #undef** — Used for defining and undefining MACROS.

    +   2. **#error** — Used for debugging.

    +   3. **#include** — Used for combining source code files.

    +   4. **#if, #else, #else if, and #endif** — Used for conditional compilation
    similar to if-else statement.

    +   5. **#ifdef and #ifndef** — Conditional Compilation on basis of #define and
    #undef.

    +   6. **#line** — Controls the program line and file macros.

    +   7. **#pragma** — Used for giving compiler instruction. Highly specific to
    the compiler being used.'
