    # Voice Data Entry


    This system accepts the spoken word as input data or commands. Human speech is
    very complex, involving emphasis and facial expressions, so complete voice recognition
    will not get developed for some more time. However, simple commands from one user
    can be used to control machines. In this way a paralysed person can operate a
    wheelchair or control heating and lighting. A microphone used for data input is
    shown in Fig. 1.22.


    # Sound Capture


    With the addition of a sound card in one of the expansion slots of the computer
    you can “record” voice or music. The sound card (Fig. 1.23) digitizes the information
    into a form that the computer can understand.


    # Video Capture


    With a video capture board (Fig. 1.24) in one of the computer’s expansion slots,
    you can


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_26_2.png)


    Fig. 1.24: A video capture card


    capture video (photographic) images through a video camera. The video capture
    board digitizes the image.


    # Processing Unit


    Processing unit of a computer system holds the central processing unit which is
    like the mind of a computer system.


    # Central Processing Unit (CPU)


    The CPU is the brain of the computer. Sometimes referred to simply as the processor
    or central processor, the CPU is where most calculations take place. In terms
    of computing power, the CPU is the most important element of a computer system.


    It carries out all the processing in the computer. It itself consists of three
    main subsystems. The first one is control unit, the second is registers, and the
    third is arithmetic and logic unit (ALU).


    A CPU works in a fetch execute cycle. On power on, the CPU fetches the first instruction
    from a location specified by the program


