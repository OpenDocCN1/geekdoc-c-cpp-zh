    # Hard Disk


    The hard disk is direct-access storage medium with a rigid hard magnetic disk.
    The data is stored as magnetized spots arranged in concentric circles (tracks)
    on the disk. Each track is divided into sectors. The number of tracks and sectors
    on a disk is known as its ‘format’.


    High data rates demand that the disk rotates at a high speed (about 3,600 rpm).
    As the disk rotates, read/write heads move to the correct track. The disk is sealed
    and lubricated and the head hovers on a cushion of air just above the disk to
    avoid damage. These are therefore called floating heads. The storage capacity
    of a hard disk can be several gigabytes (GB), i.e. thousands of megabytes (1000
    MB), of information.


    A single hard disk usually consists of several platters. Each platter requires
    two read/write heads, one for each side. All the read/write heads are attached
    to a single access arm


    so that they cannot move independently. Each platter has the same number of tracks,
    and a track location that cuts across all platters is called a cylinder. For example,
    a typical 84 megabyte hard disk for a PC might have two platters (four sides)
    and 1,053 cylinders. The picture of a hard disk showing internal mechanism is
    given in Fig. 1.39.


    **Magnetic tape:** This recording medium consisting of a thin tape with a coating
    of a fine magnetic material, used for recording analogue or digital data. Data
    is stored in frames across the width of the tape. The frames are grouped into
    blocks or records which are separated from other blocks by gaps. Magnetic tape
    is a serial access medium, and so data cannot be quickly located. Like videotape,
    computer tape is made of flexible plastic with one side coated with a ferromagnetic
    material. Tapes were originally on reels, but were superseded by cartridges (Fig.
    1.40) and cassettes of many sizes and shapes.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_34_2.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_34_3.png)'
