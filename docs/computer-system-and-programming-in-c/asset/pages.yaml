    \ system of Android is licensed under GNU General Public License Version 2 (GPLv2),\
    \ a strong\n\nAndroid application developers have the ability to distribute their\
    \ applications under whatever licensing scheme they prefer. Developers can write\
    \ open source freeware or traditional licensed applications for profit and everything\
    \ in between.\n\n+   b. *Familiar and Inexpensive Development Tools*\n+   \n+\
    \   Unlike some proprietary platforms that require developer registration fees,\
    \ vetting, and expensive compilers, there are no upfront costs to developing Android\
    \ applications.\n+   \n+   c. *Freely Available Software Development Kit*\n+ \
    \  \n+   The Android SDK and tools are freely available. Developers can download\
    \ the Android SDK from the Android Web site after agreeing to the terms of the\
    \ Android Software Development Kit License Agreement.\n+   \n+   d. *Familiar\
    \ Language, Familiar Development Environments*\n+   \n+   Developers have several\
    \ choices when it comes to integrated development environments (IDEs). Many developers\
    \ choose the popular and freely available Eclipse IDE to design and develop Android\
    \ applications. Eclipse is the most popular IDE for Android development, and there\
    \ is an Android plug-in available for facilitating Android development.\n\nAndroid\
    \ applications can be developed on the following operating systems:\n\n+   - Windows\
    \ XP or Vista\n+   - Mac OS X • 10.4.8 or later (x86 only)"
