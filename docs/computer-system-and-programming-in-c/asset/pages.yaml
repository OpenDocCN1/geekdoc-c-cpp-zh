- pgno: 48
  md: '# # 2 Introduction to Operating System


    Computer software can be divided into two main categories: application software
    and system software. According to Brookshear (1997), “application software consists
    of the programs for performing tasks particular to the machine’s utilization.
    Examples of application software include spreadsheets, database systems, desktop
    publishing systems, program development software, and games.” Application software
    is generally what we think of when someone speaks of computer programs. This software
    is designed to solve a particular problem for users.


    On the other hand, system software is more transparent and less noticed by the
    typical computer user. This software “provides a general programming environment
    in which programmers can create specific applications to suit their needs. This
    environment provides new functions that are not available at the hardware level
    and performs tasks related to executing the application program” (Nutt 1997).
    System software acts as an interface between the hardware of the computer and
    the application software that users need to run on the computer.


    Figure 2.1 illustrates the relationship between application software and system
    software.


    # ## OPERATING SYSTEM


    Operating system is the most important program that runs on a computer. Every
    general-purpose computer must have an operating system to run other programs.
    Operating systems perform basic tasks, such


    as recognizing input from the keyboard, sending output to the display screen,
    keeping track of files and directories on the disk, and controlling peripheral
    devices such as disk drives and printers.


    For large systems, the operating system has even greater responsibilities and
    powers. It is like a traffic cop—it makes sure that different program and users
    running at the same time do not interfere with each other. The operating system
    is also responsible for security, ensuring that unauthorized users do not access
    the system.


    Operating systems provide a software platform on top of which other programs,
    called application programs, can run. The application programs must be written
    to run on top of a particular operating system.


    We know that an operating system is a collection of programs and it is the interface
    between user and the computer. An operating system is a program which connects
    the user and the electronic hardware in a computer. It is a set of programs which
    supervises the activities of a computer and activates the


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_48_0.png)


    **Fig. 2.1:** Relationship between application software and system software'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'operations of the hardware components such as CPU, main memory, disk drives,
    keyboard, monitor and printer and so on. Some of the startup programs initially
    loaded to RAM are stored in ROM, mainly the BIOS programs which are recorded by
    the manufacturers of the computer system. Service programs available in operating
    system for operations like copying a file, deleting a file, formatting a disk,
    printing a file and so on are usually stored in the disk. Error messages are displayed
    on the screen if there is any malfunctioning of hardware.


    Figure 2.2 represents the relationship between the operating system and the other
    parts of the computer system.


    # FUNCTIONS OF OPERATING SYSTEM


    In any computer, the operating system:


    +   - Controls peripherals such as disk drives and printers

    +   - Controls the loading and running of programs

    +   - Organizes the use of memory between programs

    +   - Organizes the processing time between programs and users

    +   - Organizes priorities between program and users

    +   - Maintains security and access rights of users

    +   - Deals with errors and user instructions.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_49_0.png)


    On a personal computer the **operating system** will:


    +   - Deal with the transfer of programs in and out of memory

    +   - Allow the user to save files to a backing store

    +   - Control the transfer of data to peripherals such as printers

    +   - Provide the interface between the user and the computer, for example, Windows
    XP and OSX.

    +   - Issue simple error messages.


    # ROLES OF OPERATING SYSTEM


    The operating system performs various roles as follows:


    # Management of the Processor


    The operating system is responsible for managing the allocation of the processor
    between the different programmes using a **scheduling algorithm**. The type of
    scheduler is totally dependent on the operating system according to the desired
    objective.


    # Management of the Random Access Memory


    The operating system is responsible for managing the memory space allocated to
    each application and, where relevant, to each user. If there is insufficient physical
    memory, the operating system can create a memory zone on the hard drive, known
    as “virtual memory”. The virtual memory lets you run applications requiring more
    memory than that available in RAM on the system. However, this memory is a great
    deal slower.


    # Management of Input/Output


    The operating system allows the unification and control of access of programs
    to material resources via drivers (also known as peripheral administrators or
    input/output administrators).


    # Management of Execution of Applications


    The operating system is responsible for the smooth execution of applications by
    allocating'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'the resources required for them to operate. This means that an application
    which is not responding correctly can be “killed”.


    # Management of Authorizations


    The operating system is responsible for security relating to execution of programs
    by guaranteeing that the resources are used only by programs and users with the
    relevant authorizations.


    # File Management


    The operating system manages reading and writing in the file system and the user
    and application file access authorizations.


    # Information Management


    The operating system provides a certain number of indicators that can be used
    to diagnose the correct operation of the machine.


    # COMPONENTS OF THE OPERATING SYSTEM


    The operating system comprises a set of software packages that can be used to
    manage interactions with the hardware. The following elements are generally included
    in this set of software:


    +   - The **kernel**, which represents the operating system’s basic functions
    such as management of memory, processes, files, main inputs/outputs and communication
    functionalities.

    +   - The **shell**, allowing communication with the operating system via a control
    language, letting the user control the peripherals without knowing the characteristics
    of the hardware used, management of physical addresses, etc.

    +   - The **file system**, allowing files to be recorded in a tree structure.


    # CLASSIFICATION OF OPERATING SYSTEM


    Operating system can be classified into single user and multi-user categories.


    # Single User Operating System


    A single user operating system allows one single user to login at a time. There
    is no user account database which makes the level of security low and so users
    cannot protect their files from being viewed, copied or deleted.


    **Examples of this type of operating system are DOS and Windows vista.**


    # Multi-user Operating System


    The multi-user operating system has a user database account which states the right
    that users have on certain resources. It is more secure than the single user operating
    system since the access is limited.


    **An example of this type of operating system is UNIX.**


    # TYPES OF OPERATING SYSTEM


    Several different types of operating system are described below.


    # Multi-threaded Operating System


    An operating system is known as **multi-threaded** when several **“tasks”** (also
    known as *processes*) may be run at the same time. The applications consist of
    a sequence of instructions known as **“threads”**. These threads will be alternately
    active, on standby, suspended or destroyed, according to the priority accorded
    to them or may be run simultaneously.


    A system is known as **pre-emptive** when it has a **scheduler** (also called
    *planner*), which, according to priority criteria, allocates the machine time
    between the various processes requesting it.


    The system is called a **shared time** system when a time quota is allocated to
    each process by the scheduler. This is the case of multi-user systems which allow
    several users to use different or similar applications on the same machine at
    the same time. The system is then referred to as a **“transactional system”**.
    To do this, the system allocates a period of time to each user.


    # Multiprocessor Operating System


    **Multiprocessing** is a technique that involves operating several processors
    in parallel to obtain a higher calculation power than that obtained using a high-end
    processor or to increase the availability of the system (in the event of processor
    breakdown).'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The term SMP (*symmetric multiprocessing* or *symmetric multiprocessor*) refers
    to an architecture in which all processors access the same shared memory.


    A multiprocessor system must not only be able to manage memory sharing between
    several processors but also be able to distribute the workload.


    # Embedded System


    Embedded systems are operating systems designed to operate on small machines,
    such as PDAs (*personal digital assistants*) or autonomous electronic devices
    (spatial probes, robot, on-board vehicle computer, etc.) with reduced autonomy.
    Thus, an essential feature of embedded systems is their advanced energy management
    and ability to operate with limited resources.


    The main “general use” embedded systems for PDAs are as follows:


    +   - PalmOS

    +   - Windows CE/Windows Mobile/Window Smartphone


    # Realtime Systems


    Realtime systems, used mainly in industry, are the systems designed to operate
    in a time-constrained environment. A realtime system must also operate reliably
    according to specific time constraints; in other words, it must be able to properly
    process information received at clearly-defined intervals (regular or otherwise).
    Here are some examples of the realtime operating systems:


    +   - OS-9

    +   - RTLinux (Real Time Linux)

    +   - QNX

    +   - VxWorks.


    # Batch Processing Operating System


    In batch processing operating systems, the tasks are performed in batches, the
    operating system waits for a batch of tasks to arrive and then performs the operation
    on that batch.


    # Time Sharing Operating System


    A time sharing operating system shares the time between the tasks, i.e. if job
    A takes 6 minutes to complete and the predefined time to the operating system
    is 2 minutes it first performs the job A for 2 minutes, then takes up the job
    B (the next one) and this way shares its time between all the jobs arriving.


    # Distributed Operating System


    In distributed operating systems, different processors that are loosely coupled
    operate on different jobs and communicate with each other.


    # DISK OPERATING SYSTEM (DOS)


    MS-DOS is a single user operating system developed by Microsoft Corporation. An
    operating system has a collection of program. When the computer is switched on,
    the file COMMAND.COM is loaded to the RAM and after the successful start of the
    computer, the DOS prompt or command prompt will be displayed. The DOS prompt displays
    the letter associated with the disk drive followed by a > symbol. For floppy disk
    drive, A> or A:> is displayed and for hard disk drive C> or C:\> is displayed.
    It indicates the operating system is ready to take commands from the user. DOS
    operating system consists of three parts, namely, the resident part, the initialization
    part and the transient part. Most of the command programs are located in the resident
    part. While booting, the number of files and buffers to open is contained in the
    initialization part and the transient part is the flexible part of the operating
    system. The commands are not case sensitive.


    # Specific Features of DOS


    The following are the specific features of the disk operating system.


    # File


    A file is a collection of related information. For example, like the contents
    of a file folder in a desk drawer. Files on the disk can contain letters, memos
    and executable programs.


    # Program


    Programs are special types of files. These are series of instructions written
    in computer languages. These programs instruct the computer to perform the task.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Directory


    DOS uses a filing system to store its files. The filing system uses storage areas
    called directories. A directory is nothing more than an expandable file folder
    that can hold other expandable file folders. These file folders hold the data
    files. A directory is a table of contents for a disk. It contains the names of
    files, their sizes, and the dates they were last modified. All of the different
    directories are stored under one master directory. This directory is called the
    root directory.


    In addition to directories, DOS uses an area on a disk called the file allocation
    table (FAT). The FAT is similar to our contents page in our book. It holds the
    information as to where the file is stored in the disk.


    # Multiple Directories


    When there are two or more users who share a computer, when you are working on
    several different projects, the number of files in the directory can become a
    large and unwieldy. Using directories is one way of dividing our files into convenient
    groups. Any one directory can contain many files. This directory may also contain
    other directories or sub directories. This organized file structure is called
    a hierarchical directory system.


    # Preliminary Commands of DOS


    The preliminary commands of the disk operating system are described below.


    # DIR Command


    DIR command is an internal command which is used to display the contents in disk
    directory. To locate data files and programs on a specific disk, DOS uses the
    directory along with a file allocation table (FAT).


    # Examples


    `C:\>DIR`


    This command will display the disk directory in the default drive.


    `C:\>DIR/W`


    This command will display the disk directory in the default drive in a wide format.


    `C:\>DIR/P`


    This command will display the disk directory in the default drive but page wise.
    This command is useful when the disk contains numerous files.


    `C:\>DIR A:`


    This command will display the disk contents in A drive.


    `C:\>DIR *.C`


    This command will display the disk contents in the default drive with only the
    files having the extension .C. Here * is known as wild card character. It means
    all matching characters are represented by *.


    # CLS Command


    CLS command is used to clear the screen. When this command is entered, all the
    previously displayed text or messages are removed from the screen.


    The general syntax of cls command is as follows:


    `C:\>CLS`


    # REN or RENAME Command


    REN or RENAME command is used to rename an existing file. Consider the following
    example to rename a file in the current directory.


    # Example


    `C:\>REN A.BAK A.C`


    Or


    `C:\>RENAME A.BAK A.C`


    When this command is entered, the file A.BAK is renamed as A.C.


    # DEL Command


    DEL command is used to delete files in a directory.


    Consider the following example to delete files in the current directory.


    `C:\>DEL A.BAK`


    This command will delete all the files in the directory. The message “Bad command
    or file name” is displayed when the file is not as available in the directory.


    `C:\>DEL *.BAK`


    This command will delete all the files in the directory with the extension. BAK
    The message “Bad command or file name” is displayed when the file is not available
    in the directory.'
  merge: -1
  img_proc: true
- pgno: 53
