  md: '# # Modular Programming


    # 10


    Structured programming (sometimes known as *modular programming*) is a subset
    of procedural programming that enforces a logical structure on the program being
    written to make it more efficient and easier to understand and modify. Certain
    languages such as Ada, Pascal, and dBase are designed with features that encourage
    or enforce a logical program structure.


    Structured programming frequently employs a top-down design model, in which developers
    map out the overall program structure into separate subsections. A defined function
    or set of similar functions is coded in a separate module or sub-module, which
    means that code can be loaded into memory more efficiently and that modules can
    be reused in other programs. After a module has been tested individually, it is
    then integrated with other modules into the overall program structure.


    Program flow follows a simple hierarchical model that employs looping constructs
    such as “for,” “repeat,” and “while.” Use of the “Go To” statement is discouraged.


    Structured programming was first suggested by Corrado Bohm and Giuseppe Jacopini.
    The two mathematicians demonstrated that any computer program can be rewritten
    with just three structures: decisions, sequences, and loops. Edsger Dijkstra’s
    subsequent article, *Go To Statement Considered Harmful*, was instrumental in
    the trend towards structured programming. The most common methodology employed
    was developed by Dijkstra. In this model (which is often considered to be synonymous
    with structured programming,


    although other models exist) the developer separates programs into subsections
    that each has only one point of access and one point of exit.


    In the modular programming concept we will discuss the concept of functions in
    C Language.


    # ## USE OF FUNCTIONS IN MODULAR PROGRAMMING


    Almost any language can use structured programming techniques to avoid common
    pitfalls of unstructured languages. Unstructured programming must rely upon the
    discipline of the developer to avoid structural problems, and as a consequence
    may result in poorly organized programs. Most modern procedural languages include
    features that encourage structured programming. Object-oriented programming (OOP)
    can be thought of as a type of structured programming, uses structured programming
    techniques for program flow, and adds more structure for data to the model.


    To make the programming simple and easy to debug, we break a larger program into
    smaller subprograms which perform ‘well-defined tasks’. These subprograms are
    called functions. So far we have defined a single function main ( ). After reading
    this unit you will be able to define many other functions and the main ( ) function
    can call up these functions from several different places within the program,
    to carry out the required processing. Functions are very important tools for *Modular
    Programming*, where we break large programs into small subprograms or modules'
