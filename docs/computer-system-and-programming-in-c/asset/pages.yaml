    # Bitwise Shift Operators


    In the bitwise shift operators we have two Operators (i) << (Bitwise Left-Shift)
    and (ii) >> (Bitwise Right-Shift)


    # (a) << - Bitwise Left-Shift


    Bitwise Left-Shift is useful when we want to multiply an integer (not floating
    point numbers) by a power of 2.


    The operator, like many others, takes 2 operands like this:


    `a << b`


    This expression returns the value of $a$ multiplied by 2 to the power of $b$.


    Why is it named a left-shift?


    **Answer:** Take the binary internal representation of $a$, and add $b$ number
    of zeros to the right, consequently “shifting” all the bits $b$ places to the
    left.


    # Example: 4 << 2.


    4 is 100 in binary number system. Adding 2 zeros to the end gives 10000, which
    is 16, i.e. $4*2^2 = 4*4 = 16$.


    What is 4 << 3? Simply add 3 zeros to get 100000, which is $4*2^3 = 4*8 = 32$.


    Notice that shifting once to the left multiplies the total by 2. Multiple shifts
    of 1 to the left, ensures its multiplying the number by 2 over and over again.
    In other words, reproducing by a power of 2.


    # Examples


    +   - $5 << 3 = 5*2^3 = 5*8 = 40$

    +   - $8 << 4 = 8*2^4 = 8*16 = 128$

    +   - $1 << 2 = 1*2^2 = 1*4 = 4$


    Bitwise shifts are said to be more efficient than the normal arithmetic operations,
    but I am still yet to write a computer game :)


    Bitwise shifting of negative numbers requires knowledge of the binary representation
    of negative numbers.


    # Examples


    +   - $8 << 6$ returns 512

    +   - $1 << 5$ returns 32

    +   - $5 << 4$ returns 80

    +   - $4 << 3$ returns 32

    +   - $4 << 8$ returns 1024

    +   - $3 << 7$ returns 384

    +   - $6 << 5$ returns 192

    +   - $0 << 3$ returns 0

    +   - $2 << 8$ returns 512

    +   - $4 << 8$ returns 1024


    # (b) >> - Bitwise Right-Shift


    Bitwise Right-Shift does the opposite, and takes away bits on the right.


    Suppose we had:


    `a >> b`


    This expression returns the value of $a$ divided by 2 to the power of $b$.


    # Example: 8 >> 2.


    8 is 1000 in binary. Performing a right shift of 2 involves knocking the last
    2 bits off: 1000, which leaves us with 10, i.e. 2.


    8 >> 2 is as doing $8 / 2^2 = 8 / 4 = 2$.


    But what happens if we had a left operand that is not a power of 2? Let us try
    $9 >> 2$.


    9 is 1001. Now take off the last 2 bits, allowing for us with 10, which is 2.
    But this does make sense, since $9 / 4 = 2.25$, which rounds down to 2.'
