- pgno: 297
  md: '# *Text Files*


    A text file can be a stream of characters that a computer can process sequentially.
    It is not only treated sequentially but only in forward direction. For this reason
    a text file is normally opened for only one kind of operation (reading, writing,
    or appending) at any given time.


    Likewise, since text files only process characters, they can only read or write
    data one character at a time. (In C Programming Language, functions are allowed
    to deal with lines of text, but these still essentially process data one character
    at a time.) A text stream in C is a particular kind of file. Depending on the
    demands of the operating system, newline characters may be converted to or from
    carriage-return/linefeed combinations depending on whether data is being written
    to, or read from, the file. Other character transitions may also occur to satisfy
    the storage requirements of the operating system. These translations occur transparently
    and they occur because the programmer has indicated the intention to process a
    text file.


    # *Binary Files*


    A binary file is no different to a text file. It is a *accumulation* of bytes.
    In C Programming Language a byte and a character are same. Hence a binary file
    is also mentioned to as a character stream, but there are two crucial differences.


    +   1. No special processing of the data occurs and each byte of data is changed
    to or from the disk unprocessed.

    +   2. C Programming Language places no constructs on the file, and it may be
    read from, or written to, in any manner chosen by the computer programmer.


    Binary files can be either treated sequentially or, depending on the needs of
    the application, they can be processed using random access techniques. In C Programming
    Language, processing a file using random access techniques needs moving the current
    file position to an appropriate place in the file before reading or writing data.
    This indicates a second characteristic of binary files—they are a


    generally processed using read and write operations simultaneously.


    For example, a database file will be produced and treated as a binary file. A
    record update operation will involve locating the appropriate record, reading
    the record into memory, changing it in some way, and finally writing the record
    back to disk at its appropriate location in the file. These kinds of operations
    are usual to many binary files, but are rarely found in applications that process
    text files.


    # FILE HANDLING IN C USING FILE POINTERS


    We know that a sequential stream of bytes ending with an *end-of-file* marker
    is what is called a *file*. When the file is opened the stream is associated with
    the file. By default, three files and their streams are automatically opened when
    program execution begins—the *standard input*, *standard output*, and the *standard
    error*. Streams provide communication channels between files and programs.


    For example, the standard input stream enables a program to read data from the
    keyboard, and the standard output stream enables to write data on the screen.
    Opening a file returns a pointer to a FILE structure (defined in <stdio.h>) that
    contains information, such as size, current file pointer position, type of file,
    etc. to execute operations on the file.


    This structure also contains an integer called a *file descriptor* which is an
    index into the table maintained by the operating system namely, the *open file
    table*. Each element of this table contains a block called *file control block*
    (FCB) used by the operating system to administer a particular file.


    The standard input, standard output and the standard error are manipulated using
    file pointers *stdin*, *stdout* and *stderr*. The set of functions which we are
    now going to discuss come under the category of buffered file system. This file
    system is referred to as buffered because, the routines retain in all the disk
    buffers required for reading/writing automatically.'
