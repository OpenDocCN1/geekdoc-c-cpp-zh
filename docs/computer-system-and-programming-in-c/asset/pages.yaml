    # EXPONENTIAL AND LOGARITHMIC FUNCTIONS


    | Exp | Compute exponential function |

    |---|---|

    | log | Compute natural logarithm |

    | log10 | Compute base-10 logarithm |

    | Modf | Break into fractional and integral parts |


    (a) exp()


    exp() function is used to compute exponential function.

    The general syntax of exp() function is as follows:


    ```

    double exp (double x );

    float exp (float x );

    long double exp ( long double x );

    ```


    The above function returns the exponential function of x, which is the e number
    raised to the power x.


    # Parameters


    x-floating point value.


    # Return value


    The above function returns exponential value of x.

    If the magnitude of the result is so large that it cannot be represented in an
    object of the return type, the function returns HUGE_VAL, and the value of the
    global variable errno is set to the ERANGE value.


    # Portability


    In C, only the double version of this function exists with this name.


    # Example


    ```

    #include <stdio.h>

    ```


    (b) log()


    log() function is used to compute natural logarithm.

    The general syntax of log() function is as follows


    ```

    double log (double x );

    float log (float x );

    long double log ( long double x );

    ```


    The above function returns the natural logarithm of x.

    The natural logarithm is the base-e logarithm, the opposite of the natural exponential
    function (exp). For base-10 logarithms, a specific function log10 exists.


    # Parameters


    x-floating point value.

    If the argument is negative, a domain error comes, setting the global variable
    errno to the value EDOM.

    If it is zero, the function returns a negative HUGE_VAL and adjusts the value
    of the global variable errno to the ERANGE value.


    # Return value


    Natural logarithm of x.


    # Portability


    In C, only the double version of this function exists with this name.


    # Example


    ```

    #include <stdio.h>

    #include <math.h>

    #include<conio.h>

    ```'
