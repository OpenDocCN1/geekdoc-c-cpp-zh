    \ in which a function calls within itself.\n\nprogrammers know that a program\
    \ written with numerous functions is easier to maintain, update and debug than\
    \ one very long program. By programming in a modular (functional) fashion, several\
    \ programmers can work independently on separate functions which can be assembled\
    \ at a later date to create the entire project.\n\nIdeally, your `main()` function\
    \ should be very short and should consist primarily of function calls. Each function\
    \ has its own name. When that name is encountered in a program, the execution\
    \ of the program branches to the body of that function. When the function is finished,\
    \ execution returns to the area of the program code from which it was called,\
    \ and the program continues on to the next line of code.\n\n# DEFINITION OF A\
    \ FUNCTION\n\nA *function* is a self-contained block of executable code that can\
    \ be called from any other function. In many programs, a set of statements are\
    \ to be executed repeatedly at various places in the program and with different\
    \ sets of data, the idea of functions comes in mind. You keep those repeating\
    \ statements in a function and call them as and when required. When a function\
    \ is called, the control transfers to the called function, which will be executed,\
    \ and then transfers the control back to the calling function (to the statement\
    \ following the function call).\n\nWhen we divide a complex program into various\
    \ modules then that particular various modules are called as functions. We have\
    \ mentioned earlier that one of the strengths of C language is that C functions\
    \ are easy to define and use. C functions can be classified into two categories,\
    \ namely, library functions and user-defined functions. main is an example of\
    \ user defined function. printf and scanf belong to the category of library functions.\
    \ The main distinction between user-defined functions and library functions is\
    \ that the former are not required to be written by user while the latter have\
    \ to be developed by the user at the time of writing a program. However, the user\
    \ defined function can become a part of the C program library.\n\nA *function*\
    \ is a subprogram that acts on data and often returns a value. You are already\
    \ familiar with the one function that every C program possesses: `int main(void)`.\
    \ Good C programmers write programs that consist of many of these small functions.\
