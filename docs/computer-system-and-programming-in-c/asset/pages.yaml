  md: '+   - Ready access to the hardware when needed

    +   - And the ease with which applications can be optimized by hand-coding isolated
    procedures.


    C is often called a “Middle Level” programming language. This is not a reflection
    on its lack of programming power but more a reflection on its capability to access
    the system’s low-level functions. Most high-level languages (e.g. FORTRAN) supplies
    everything the programmer might want to do already built into the language. A
    low-level language (e.g. assembler) supplies nothing other than access to the
    machines basic instruction set. A middle level language, such as C, probably does
    not supply all the constructs found in high-languages but it provides you with
    all the building blocks that you will need to produce the results you want!


    # HISTORY OF C


    C is a programming language developed at AT&T’s Bell Laboratory of USA in 1972.
    It was designed and written by Dennis Ritchie. As compared to other programming
    languages such as Pascal, C allows a precise control of input and output.


    Now let us see its historical development. The late 1960s were a churning era
    for computing system research at Bell Telephone Laboratories. By 1960, many programming
    languages came into existence, almost each for a specific purpose.


    For example COBOL was being used for commercial or business applications, FORTRAN
    for Scientific applications and so on. So, people started thinking why could not
    there be a one general purpose language. Therefore, an International Committee
    was set up to develop such a language, which came out with the invention of ALGOL60.
    But this language never became popular because it was too abstract and too general.
    To improve, this, a new language called combined programming language (CPL) was
    developed at Cambridge University. But this language was very complex in the sense
    that it had too many


    features and it was very difficult to learn. Martin Richards at Cambridge University
    reduced the features of CPL and developed a new language called basic combined
    programming language (BCPL). But unfortunately it turned out to be much less powerful
    and too specific. Ken Thompson at AT & T’s Bell Labs, developed a language called
    B at the same time as a further simplification of CPL. But like BCPL this was
    also too specific. Ritchie inherited the features of B and BCPL and added some
    features on his own and developed a language called C. C proved to be quite compact
    and coherent. Ritchie first implemented C on a DEC PDP-11 that used the UNIX operating
    system. For many years the de facto standard for C was the version furnished with
    the UNIX version 5 operating system. The growing popularity of microcomputers
    led to the creation of large number of C implementations. At the source code level
    most of these implementations were highly compatible. However, since no standard
    existed there were discrepancies. To overcome this situation, ANSI established
    a committee in 1983 that defined an ANSI standard for the C language.


    # USES OF C


    C was initially used for system development work, in particular the programs that
    make-up the operating system. Why use C? Mainly because it develops code that
    runs nearly as fast as code written in assembly language. Some examples of the
    use of C might be:


    +   - Operating systems

    +   - Language compilers

    +   - Assemblers

    +   - Text editors

    +   - Print spoolers

    +   - Network drivers

    +   - Modern programs

    +   - Data bases

    +   - Language interpreters

    +   - Utilities'
