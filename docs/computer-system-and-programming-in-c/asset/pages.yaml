  md: "classified as the entry-controlled loop or as the exit-controlled loop. In\
    \ the entry-controlled loop, first the conditions are tried out and if satisfied\
    \ then only body of loop is executed. In the exit-controlled, the test is made\
    \ at the end of the body, so the body is executed unconditionally first time.\n\
    \nexecuted. After execution of instruction of the body, the test-condition is\
    \ once again evaluated and if it is true, the body is executed once again. This\
    \ process of repeated execution of the body continues until the test-condition\
    \ finally becomes false and the control is transferred out of the loop. On exit,\
    \ the program extends with the statement immediately after the body of the loop.\
    \ The body contains only one statement it is not necessary to put the braces,\
    \ but placing them is a good programming practice.\n\nA looping process, in general,\
    \ would involve the following four steps:\n\n+   1. Setting and initialization\
    \ of a counter.\n+   2. Executing of the statements in the loop.\n+   3. Test\
    \ for a defined condition for execution of the loop.\n+   4. Incrementing the\
    \ counter.\n\nThe C language supplies three loop constructs for performing loop\
    \ operations. They are:\n\n+   1. The while statement.\n+   2. The do statement.\n\
    +   3. The for statement.\n\n# Nested Loops\n\n+   - The while loop keeps repeating\
    \ an action until an action condition returns **false**. This is useful where\
    \ the programmer does not acknowledge in advance how many times the loop will\
    \ be traversed.\n+   - The do while loop is similar, but the condition is checked\
    \ after the loop body is executed. This ensures that the loop body is run at least\
    \ once.\n+   - The for loop is often used, usually where the loop will be traversed\
    \ a fixed number of times.\n\n# The While Loop\n\nWhen in a program a single statement\
    \ or a certain group of statements are to be executed repeatedly depending upon\
    \ certain test condition, then *while statement* is used. The general syntax of\
    \ while loop is as follows:\n\n```\nwhile (test condition)\n{\n    body of the\
    \ loop\n}\n```\n\nThe while is an entry-controlled loop statement. The test condition\
    \ is measured and only if the condition is true the body is\n\nThe flow chart\
    \ of while loop is as follows:\n\n# Example\n\n```\n.......\n.......\nx = 10;\
    \ -------- Initialization\nwhile (x < 16) -------- Test condition\n{\nprintf(\"\
