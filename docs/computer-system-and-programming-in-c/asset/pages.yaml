  md: '**#include <stdio.h>** is a reference to a special file called stdio.h which
    contains information that must be included in the program when it is compiled.
    The inclusion of this required information will be handled automatically by the
    compiler. You will find it at the commencement of almost every C program. Basically,
    all the statements starting with **#** in a C program are called preprocessor
    directives. These will be considered in the later units. Just remember, that this
    statement allows you to use some predefined functions such as, **printf()**, in
    this case.


    **main()** declares the start of the function, while the two curly brackets {
    } shows the start and finish of the function. Curly brackets in C are used to
    group statements together as a function, or in the body of a loop. Such a grouping
    is acknowledged as a compound statement or a block. Every statement within a function
    ends with a terminator semicolon (;). **printf (“This is my First Program\n”);**
    prints the words on the screen. The text to be printed is put in double quotes.
    The \n at the end of the text tells the program to print a new line as part of
    the output. That means now if we give a second printf statement, it will be printed
    in the next line.


    Comments may appear anywhere within a program, as long as they are placed within
    the delimiters /* and */. Such comments are helpful in identifying the program’s
    principal features or in explaining the underlying logic of various program features.
    While useful for teaching, such a simple computer program has few practical uses.
    Let us think something rather more practical. Let us look into the example given
    below, the complete program development life cycle.


    # **RUNNING C PROGRAMS**


    If we want to run the C programs then we have to use the concept of The Edit-Compile-Link-Execute
    Process.


    *The Edit-Compile-Link-Execute Process*


    Developing a program in a compiled language such as C requires at least four steps:


    +   1. **Editing** (or writing) the program

    +   2. **Compiling** it


    +   3. **Linking** it

    +   4. **Executing** it


    We will now cover each step separately.


    # *Editing*


    You write a computer program with words and symbols that are understandable to
    human beings. This is the *editing* part of the development phase. You type the
    program immediately into a window on the screen and save the resulting text as
    a separate file. This is often concerned to as the *source file* you can read
    it with the TYPE command in DOS or the **cat** command in UNIX). The tradition
    is that the text of a C program is stored in a file with the extension .c for
    C programming language.


    # *Compiling*


    You cannot directly execute the source file. To run on any computer system, the
    source file must be translated into binary numbers understandable to the computer’s
    Central processing unit (for example, the 80*87 microprocessor). This process
    develops an intermediate object file with the extension .obj, the .obj represents
    Object.


    # *Linking*


    The first question that comes to most peoples minds is *why is linking necessary?*
    The main cause is that many compiled languages come with library routines which
    can be added to your program. These functions are written by the manufacturer
    of the compiler to perform a variety of tasks, from input/output to complicated
    mathematical functions. In the case of C the standard input and output routines
    are contained in a library (stdio.h) so even the most basic program will require
    a library function. After linking the file extension .exe which is denoted as
    executable files.


    # *Executing*


    Thus the text editor produces .c source files, which go to the compiler, which
    produces .obj object files, which go to the linker, which produces .exe executable
    file. You can then run .exe files as you can other applications, simply by typing
    their names at the DOS prompt or run utilizing windows menu.'
  merge: -1
  img_proc: true
