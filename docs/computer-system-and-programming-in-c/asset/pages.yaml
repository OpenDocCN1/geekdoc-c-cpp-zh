    # Opening Files and Folders


    After you have located the file you want, you can double-click to open it.


    Now we have to follow the following steps to open any file or folder:


    +   1. On the desktop, double-click **My Computer**. The My Computer window opens.

    +   2. Double-click the drive that contains the file or folder you want to open.

    +   3. Double-click the file or folder.


    # Working with Frequently Used Files


    You can quickly open documents and programs that you use often. The Start menu
    lists the documents used most recently, so that you can quickly reopen them. The
    My Documents folder on your desktop is a convenient place for you to store frequently
    used files and folders and for easy access to a file that you use frequently,
    you can also create a shortcut to it. A shortcut does not change the location
    of a file—the shortcut is just a pointer that lets you open the file quickly.
    If you delete the shortcut, the original file is not deleted.


    To open recently used documents we have to follow the following steps:


    +   1. Click the **Start** button, and then point to **Documents**. A list of
    your recently opened documents appears.

    +   2. Click a document on the list. The document opens.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_73_0.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Create A Shortcut


    The following steps are to be followed for creating a shortcut:


    +   1. While in Explorer, **Right-click** the file you wish to make into a shortcut.

    +   2. Choose **Send To** from the popup menu and then select **Desktop (create
    shortcut)**.

    +   3. Click **OK** to confirm.

    +   4. Minimize the Explorer window to verify that the shortcut has been created.


    **Another method for creating a shortcut is as follows:**


    +   1. **Right-click** anywhere on the desktop

    +   2. Select **New**, then **Shortcut**

    +   3. Click the **Browse** button

    +   4. In the Browse Window, find the **Windows folder** and **double-click**
    it. Then find the **tour.exe** file and click once to select it.

    +   5. Click the **Open** button

    +   6. Click the **Next** button then click **Finish**.


    # Delete A Shortcut


    The following steps are to be followed for creating a shortcut:


    +   1. **Right-click** the shortcut you wish to delete.

    +   2. Choose **Delete** from the popup menu and click **Yes** to confirm.


    # Basic Window Accessories


    The windows operating system comes equipped with basic accessories like calculator,
    paint, notepad, WordPad, etc. Let us learn something more about using these accessories.


    # *Notepad*


    Notepad is a basic text editor you can use for simple documents or for creating
    Web pages. To create or edit files that require formatting, use WordPad.


    # *Opening Notepad*


    To open Notepad, click **Start**, point to **All Programs**, point to **Accessories**,
    and then click **Notepad**. Graphically the process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_74_0.png)


    # *Paint*


    Paint is a drawing tool you can use to create simple or elaborate drawings. These
    drawings can be either black-and-white or color, and can be saved as bitmap files.
    You can print your drawing, use it for your desktop background, or paste it into
    another document. You can even use Paint to view and edit scanned photos.


    You can also use Paint to work with pictures, such as .jpg, .gif, or .bmp files.
    You can paste a Paint picture into another document you have created, or use it
    as your desktop background.


    # *Opening Paint*


    To open Paint, click **Start**, point to **All Programs**, point to **Accessories**,
    and then click **Paint**. Graphically the process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_74_1.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Calculator


    You can use Calculator in Standard view to do simple calculations, or in Scientific
    view to do advanced scientific and statistical calculations.


    # Opening Calculator


    To open Calculator, click **Start**, point to **All Programs**, point to **Accessories**,
    and then click **Calculator**. Graphically this process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_75_0.png)


    # Wordpad


    You can use Wordpad to create or edit text files that contain formatting or graphics.
    Use Notepad for basic text editing or for creating Web pages.


    # Opening Wordpad


    To open Wordpad, click **Start**, point to **All Programs**, point to **Accessories**,
    and then click **WordPad**. Graphically this process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_75_1.png)


    # Clipboard


    The Clipboard is the storage area for items that have been cut or copied. Each
    time you execute Cut or Copy, you replace the old information on the Clipboard
    with whatever you just cut or copied. You can paste Clipboard information as often
    as you like, until you replace it with something else.


    # SHUTTING DOWN THE COMPUTER


    The following are the steps that we have to follow to shut down the computer:


    +   1. Click on the Start

    +   2. Click on **Shut Down** (A Shut Down Windows dialog box will appear)

    +   3. Click on **Shut Down**

    +   4. Click on **OK**


    Graphically the process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_75_2.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_75_3.png)


    # SUMMARY


    +   - An operating system is the system software which is used to operate the
    computer system.

    +   - Operating systems can be classified into the two categories: (a) Single
    user operating system, and (b) Multiple user operating system.

    +   - Single user Operating system means that only one user can work at the one
    time.

    +   - A multiple user operating system means that more than one user can work
    simultaneously at the same time.

    +   - DOS, Windows 95 are the examples of single user operating systems.

    +   - UNIX, LINUX, WINDOWS NT are the examples of multiple user operating system.'
  merge: -1
  img_proc: true
