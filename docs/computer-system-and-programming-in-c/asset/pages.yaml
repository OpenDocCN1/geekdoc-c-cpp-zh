    # Block Input/Output Functions


    Block Input/Output functions read/write a block (specific number of bytes from/to
    a file. A block can be a record, a set of records or an array. These functions
    are also defined in standard library and are described as follows:


    +   - fread()\n- fwrite()


    These two functions allow reading and writing of blocks of data. Their syntax
    is as follows:


    ```

    int fread(void *buf, int num_bytes, int count, FILE *fp);\nint fwrite(void *buf,
    int num_bytes, int count, FILE *fp);

