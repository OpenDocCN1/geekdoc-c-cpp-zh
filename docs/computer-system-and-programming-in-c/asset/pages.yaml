    # COPY Command


    COPY command is used to copy a file to a new location or directory in the disk.
    A file cannot be copied to itself in the same directory in the same name.

    Consider the following example:


    (I) C:\>COPY AB.TXT AB.BAK

    This command will copy the file AB.TXT in the same directory as AB.BAK. The first
    file name in the command AB.TXT is the source file and the file AB.BAK is the
    target file which is a copy of AB.TXT.


    (II) C:\>COPY AB.TXT A:

    This command will copy the file AB.TXT from the C drive to A drive and is copied
    in the same name.


    (III) C:\>COPY AB.TXT A: AB.BAK

    This command will copy the file AB.TXT from the C: drive to A: drive but the target
    file is named as AB.BAK.


    (IV) C:\>COPY *.* A:

    This command will copy all the files in the current directory of C: drive to A:
    drive in the respective file names


    (V) C:\>COPY *.* A:

    This command will copy all the C program files in the current directory of C:
    drive to A: drive in the respective file names.

    The COPY command can also be used to create a file in the console using the keyword
    CON along with COPY command.


    (VI) C:\>COPY CON sample.txt

    This command is used to create a simple.txt file and write the matter and press
    F6 then file is automatically saved.


    # TYPE Command


    This command is used to display the contents of a file on the monitor screen.
    TYPE command can also be used to send the contents of the file to the printer
    in the console using the keyword PRN.

    Consider the following examples:


    (I) C:\>TYPE AB.TXT:

    This command will display the contents of the file AB.TXT on the screen.


    (II) C:\>TYPE AB.TXT >PRN

    This command will print the contents of the file AB.TXT


    # FORMAT Command


    FORMAT command is used to format a new disk. It is a utility program that is available
    on hard disk. Only the formatted disks can be used by the operating system to
    store files or programs. Consider the following example to format a new floppy
    disk, Insert the new floppy disk in A drive and give the following command.

    C:\>FORMAT A:

    Nowadays new formatted floppies are available in packs which need not be for-
    matted again. If any old floppy is formatted then the contents will be erased
    automatically.


    # DISKCOPY Command


    DISKCOPY command is used to copy all the contents of various directories of a
    disk in another disk. It is faster and useful to take backup copies.

    Consider the following example:

    C:\>DISKCOPY A: C:

    Now the contents of floppy disk in A drive is copied to the hard disk drive C.


    # CHKDSK Command


    CHKDSK command is used to get the report about a disk such as disk directories,
    files, storage space available, etc. Consider the following example to check the
    floppy disk in drive A.'
