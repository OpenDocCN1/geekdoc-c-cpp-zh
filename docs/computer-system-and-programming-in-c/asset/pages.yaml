    # *The Memory*


    Memory is the internal storage areas in the computer. The term memory identifies
    data storage that comes in the form of chips, and the word storage is used for
    memory that exists on tapes or disks. Moreover, the term memory is usually used
    as shorthand for physical memory, which refers to the actual chips capable of
    holding data. Some computers also use virtual memory, which expands physical memory
    onto a hard disk. Every computer comes with a certain amount of physical memory,
    usually referred to as main memory or RAM. You can think of main memory as an
    array of boxes, each of which can hold a single byte of information. A computer
    that has 1 megabyte of memory, therefore, can hold about 1 million bytes (or characters)
    of information.


    The memory of computer is often called main memory or primary memory. It is generally
    called the third component of CPU.


    # *Electrostatic plotters*


    An electrostatic plotter produces a raster image by charging the paper with a
    high voltage. This voltage attracts toner which is then melted into the paper
    with heat. This type of plotter is fast, but the quality is generally considered
    to be poor when compared to pen plotters.


    # **Storage Unit**


    Since the computer is an electronic device can understand only the electricity
    signals whatever input is given to it, is firstly converted into electric signals.
    An electric signal has just two states: ON or OFF. That means a computer can understand
    just two symbols: On (signified by 1) and Off (signified by 0). Therefore, computer’s
    language is made up of just 1’s and 0’s and this language is also known as binary
    language? Why binary language? Well bi means two; so a language that has just
    two symbols is known as binary language.


    The two binary digits 0 and 1 are known as bits. The bit is the smallest unit
    of storage. Bigger units are listed as follows:


    +   - 1 byte = 8 bits

    +   - 1 kilobyte (K/KB) = 2^10 bytes = 1,024 bytes

    +   - 1 megabyte (M/MB) = 2^10 kilobytes = 1,048,576 bytes

    +   - 1 gigabyte (G/GB) = 2^10 megabytes = 1,073,741,824 bytes

    +   - 1 terabyte (T/TB) = 2^10 gigabytes = 1,099,511,627,776 bytes


    # *Types of Memory*


    The computer makes use of two types of memories:


    +   1. Internal memory (also known as main memory or primary memory).

    +   2. External memory (also known as auxiliary memory or secondary memory).


    # *Internal memory*


    In a computer, all of the storage spaces that are accessible by a processor without
    the use of the computer input-output channels is known as internal memory. Internal
    memory usually includes several types of storage, such as main storage, cache
    memory, and special registers, all of which can be directly accessed by the processor.'
