  md: "+   - Declaration for external variable is as follows:\n+     ```c\n+     extern\
    \ int var;\n+     ```\n+   - External variables may be declared outside any function\
    \ block in a source code file the same way any other variable is declared; by\
    \ specifying its type and name (extern keyword may be omitted).\n+   - Typically\
    \ if declared and defined at the beginning of a source file, the extern keyword\
    \ can be omitted. If the program is in several source files, and a variable is\
    \ defined in say file1.c and used in file2.c and file3.c then the extern keyword\
    \ must be used in file2.c and file3.c.\n+   - But, usual practice is to collect\
    \ extern declarations of variables and functions in a separate header file (.h\
    \ file) then include by using #include directive.\n+   - Memory for such variables\
    \ is allocated when the program begins execution, and remains allocated until\
    \ the program terminates. For most C implementations, every byte of memory allocated\
    \ for an external variable is initialized to zero.\n+   - The scope of external\
    \ variables is global, i.e. the entire source code in the file following the declarations.\
    \ All functions following the declaration may access the external variable by\
    \ using its name. However, if a local variable having the same name is declared\
    \ within a function, references to the name will access the local variable.\n\
    +   - External variables may be initialized in declarations just as automatic\
    \ variables; however, the initializers must be **constant expressions**. The initialization\
    \ is done only once at compile time, i.e. when memory is allocated for the variables.\n\
    +   - In general, it is a good programming practice to avoid using external variables\
    \ as they destroy the concept of a function as a ‘black box’ or independent module.\n\
    +   - The black box concept is essential to the development of a modular program\
    \ with modules. With an external variable, any function in the program can access\
    \ and alter the variable, thus making debugging more difficult as well. This is\
    \ not to say that external variables should never be used.\n\n+   - There may\
    \ be occasions when the use of an external variable significantly simplifies the\
    \ implementation of an algorithm. Suffice it to say that external variables should\
    \ be used rarely and with caution.\n\nThe features of a variable whose storage\
    \ class has been defined as external are as follows:\n\n| Storage | Memory |\n\
    |---|---|\n| Default initial value | Zero |\n| Scope | Global |\n| Life | As long\
    \ as the program’s execution does not come to an end |\n\nExternal variables differ\
    \ from those we have already discussed in that their scope is global, not local.\
    \ External variables are declared outside all functions, yet are available to\
    \ all functions that care to use them. The following example illustrates this\
    \ fact\n\n```\nint i=0;\nvoid main( )\n{\n    printf (\"\\ni = %d\", i );\n  \
    \  incre( );\n    incre( );\n    decre( );\n    decre( );\n}\nvoid incre( )\n\
    {\n    i = i + 1 ;\n    printf ( \"\\non incrementing i = %d\", i );\n}\nvoid\
    \ decre( )\n{\n    i = i - 1 ;\n    printf ( \"\\non decrementing i = %d\", i\
    \ );\n}\n```\n\nThe output of the above code is as follows\n\non incrementing\
    \ i = 1\non incrementing i = 2"
