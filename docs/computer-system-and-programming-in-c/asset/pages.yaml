    # POINTER RULES


    One of the nice things about pointers is that the rules that govern how they work
    are pretty simple. The rules can be layered together to get complex results, but
    the individual rules remain simple.


    # Pointers and Pointees


    A pointer stores a reference to something. Unfortunately there is no fixed term
    for the thing that the pointer points to, and across different computer languages
    there is a wide variety of things that pointers point to.

    We use the term pointee for the thing that the pointer points to, and we stick
    to the basic properties of the pointer/pointee relationship which are true in
    all languages.

    The term “reference” means pretty much the same thing as “pointer”—“reference”
    implies a more high-level discussion, while “pointer” implies the traditional
    compiled language implementation of pointers as addresses. For the basic pointer/pointee
    rules covered here, the terms are effectively equivalent.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_249_0.png)


    The above drawing shows a pointer named x pointing to a pointee which is storing
    the value 42. A pointer is usually drawn as a box, and the reference it stores
    is drawn as an arrow starting in the box and leading to its pointee.

    Allocating a pointer and allocating a pointee for it to point to are two separate
    steps. You can think of the pointer/pointee structure as operating at two levels.
    Both the levels must be set up for things to work. The most common error is concentrating
    on writing code which manipulates the pointer level, but forgetting to set up
    the pointee level. Sometimes pointer operations that do not touch the pointees
    are called “shallow” while operations on the pointees are called “deep”.


    # Dereferencing


    The dereference operation starts at the pointer and follows its arrow over to
    access its pointee. The goal may be to look at the pointee state or to change
    the pointee state.

    The dereference operation on a pointer only works if the pointer has a pointee—the
    pointee must be allocated and the pointer must be set to point to it. The most
    common error in pointer code is forgetting to set up the pointee. The most common
    runtime crash because of that error in the code is a failed dereference operation.'
