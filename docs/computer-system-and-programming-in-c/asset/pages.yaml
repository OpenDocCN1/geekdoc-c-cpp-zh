    \ programs. The mouse is also useful for graphics program that allow you to draw\
    \ pictures by using the mouse like a pen, pencil, or paintbrush.\n\n# Working\
    \ of a mouse\n\nThe working of a mouse is as follows:\n\n+   1. There is a ball\
    \ on the underside of the mouse that spins as you move the mouse around.\n\n+\
    \   2. Inside the mouse there are two rollers. In most mice, these rollers look\
    \ like black bars. If you open up the disk on the bottom of the mouse and take\
    \ the ball out, you will be able to see these rollers. One of the rollers detects\
    \ the horizontal movement of the mouse, while the other detects the mouse’s vertical\
    \ movement. Working together, the two rollers can determine which direction the\
    \ mouse is moving!\n+   \n+   3. When the ball rolls, it causes the rollers to\
    \ roll. When the rollers roll, they cause a special disk to spin. The disk is\
    \ circular with rectangular holes spaced out along its outer edge.\n+   \n+  \
    \ 4. On one side of the disk there is an infrared LED, while on the other side\
    \ of the disk, opposite the LED, there is an infrared sensor. When the disk spins,\
    \ the light from the LED can go through the rectangular holes periodically.\n\
    +   \n+   5. The sensor is able to sense these pulses of light.\n+   \n+   6.\
    \ A processor directly built into the mouse converts these pulses into binary\
    \ digits that the computer can understand, and the information is transferred\
    \ to the central processing unit through the mouse’s cord.\n\nThe working of a\
    \ mouse is graphically represented in Fig. 1.6.\n\nThere are three basic types\
    \ of mouse:\n\n+   1. **Mechanical:** It has a rubber or metal ball on its underside\
    \ that can roll in all directions. Mechanical sensors within the mouse detect\
    \ the direction the ball is rolling and move the screen pointer accordingly.\n\
    +   \n+   2. **Optomechanical:** It is same as a mechanical mouse, but uses optical\
    \ sensors to detect the motion of the ball.\n+   \n+   3. **Optical:** It uses\
    \ a laser to detect the mouse’s movement. You must move the mouse along a special\
    \ mat with a grid so that the optical mechanism has a frame of reference. Optical\
    \ mice have no"
