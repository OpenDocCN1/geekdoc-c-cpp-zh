    modern computer. In the early 1800s, a French inventor named Joseph-Marie Jacquard
    produced a loom that could weave complex patterns into cloth. The loom was controlled
    automatically by reading instructions punched as holes in cards.


    An American named Herman Hollerith invented machines using punch cards that were
    used to tabulate statistics for the 1890 US census. Hollerith eventually sold
    out to a company named CTR (Computer Tabulating Recording), which later became
    IBM (International Business Machines).


    More interesting from a theoretical standpoint was the work in the 1800s by Englishman
    Charles Babbage. Babbage designed a mechanical computing device called the Analytical
    Engine in 1834. Although he was never able to build the device (he could not get
    funding to develop the precisely-machined gears, wheels, and lever systems of
    the machine), his ideas included many concepts that were later incorporated in
    modern computers.


    # ABC: The First Digital Electronic Computer


    The first digital electronic computer was built by John Vincent Atanasoff and
    his assistant Clifford Berry at Iowa State University between 1937 and 1942. The
    Atanasoff Berry Computer (ABC) used punched cards for input and output, vacuum
    tube electronics to process data in binary format, and rotating drums of capacitors
    to store data.


    The ABC, however, only performed one task: it was built to solve large systems
    of simultaneous equations (up to 29 equations with 29 unknowns), oneurous computing
    task commonly found in science and engineering. So, the ABC was not a general-purpose
    computer.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_38_1.png)


    Fig. 1.46: A mainframe computer


    Similarly, another special-purpose electronic computer named Colossus was built
    in England starting in 1943 for the purpose of breaking German codes. The project
    was worked on by Alan Turing and Max Newman. The existence of this computer was
    kept secret until the 1970s.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_38_2.png)


    Fig. 1.47: A supercomputer'
