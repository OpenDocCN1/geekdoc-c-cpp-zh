    true.

    +   - Not operator is used to converse the result of the given condition.

    +   - `++` and `--` operator are used to increase and decrease the values.

    +   - Comma operator is used to separate the value of the variables with in loop.

    +   - Bitwise operator is used to perform the low level programming in C language.'
