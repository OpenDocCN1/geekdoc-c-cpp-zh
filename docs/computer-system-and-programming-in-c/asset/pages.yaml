    \nusing the break statement.\n\n# *Switch with break*\n\n```\n```c\nswitch(c)\n\
    {\ncase 1:printf(\"\\n hello world\");\n    break;\ncase 2: printf(\"\\n Hi\"\
    );\n    break;\ncase 3: printf(\"OOPs\");\n    break;\n}\n```\n```\n\nIf we define\
