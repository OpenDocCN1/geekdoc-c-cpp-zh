    # *Third Generation Languages (3GLs): High-level Language*


    A third generation language (3GL) is a programming language designed to be easier
    for a human to understand, including things like named variables, abstract data
    types, and algebraic expression syntax. Another crucial difference compared to
    second generation programming languages was abstraction away from the underlying
    processor. A fragment might be:


    ```

    Let                 b = c + 2 * d

    ```


    First introduced in the late 1950s, FORTRAN, ALGOL and COBOL are early examples
    of this sort of language. Most “modern” languages (BASIC, C, C++, Delphi, and
    Java) are also third-generation languages. Most 3GLs support structured programming.


    A programming language such as C, FORTRAN, or Pascal that enables a programmer
    to write programs that is more or less independent of a particular type of computer.
    Such languages are considered high-level because they are closer to human languages
    and farther from machine languages. In contrast, assembly languages are considered
    low-level because they are very close to machine languages.


    The main advantage of high-level languages over low-level languages is that they
    are easier to read, write, and maintain. Ultimately, programs written in a high-level
    language must be translated into machine language by a compiler or interpreter.


    The first high-level programming languages were designed in the 1950s. Now there
