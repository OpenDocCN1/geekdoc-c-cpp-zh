    \n# TYPES OF FUNCTION\n\nFunctions are classified into the following two categories:\n\
    \n+   (A) User defined functions  \n+   (B) Predefined functions\n\nIn this chapter\
    \ we will discuss the concept of user-defined functions.\n\n# ADVANTAGES OF USING\
    \ FUNCTIONS\n\nThe use of functions in C serves many advantages:\n\n+   1. It\
    \ facilitates top-down modular programming. In this programming style,"
