    # SUMMARY


    +   - Strings are sequence of characters.

    +   - Strings are to be null-terminated if you want to use them properly.

    +   - Remember to take into account null-terminators when using dynamic memory
    allocation.

    +   - The string.h library has many useful functions.

    +   - strlen () is a predefined function in string.h which is used to calculate
    the length of the string.

    +   - strcmp () is a predefined function in string.h which is used to compare
    two strings.

    +   - strcat () is a predefined function in string.h which is used to concatenated
    two strings.

    +   - strrev () is a predefined function which is used to reverse the string.

    +   - A string is nothing but an array of characters terminated by ‘\0’.

    +   - Being an array, all the characters of a string are stored in contiguous
    memory locations.

    +   - Though scanf () can be used to receive multi-word strings, gets () can do
    the same job in a cleaner way.

    +   - Both printf () and puts () can handle multi-word strings.

    +   - Strings can be operated upon using several standard library functions like
    strlen (), strcpy (), strcat () and strcmp () which can manipulate strings. More
    importantly we imitated some of these functions to learn how these standard library
    functions are written.

    +   - Though in principle a 2-D array can be used to deal several strings, in
    practice an array of pointers to strings is preferred since it takes less space
    and is effective in processing strings.

    +   - malloc () function can be used to allocate space in memory on the fly throughout
    execution of the program.'
