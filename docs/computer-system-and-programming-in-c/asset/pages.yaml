  md: '# ## 9  Conditional Statements and Looping


    A program consists of a number of statements to be executed by the computer. Not
    many of the programs execute all their statements in sequential order from beginning
    to end as they appear within the program. A C program may require that a logical
    test be carried out at some particular point within the program. One of the several
    possible actions will be carried out, depending on the outcome of the logical
    test. This is predicted as **Branching**. In the Selection process, a set of statements
    will be selected for execution, among the several sets available. Suppose, if
    there is a need of a group of statements to be executed repeatedly until some
    logical condition is satisfied, then **looping** is required in the program. These
    can be carried out using various control statements.


    These **Control statements** determine the “flow of control” in a program and
    enable us to specify the order in which the various instructions in a program
    are to be executed by the computer. Normally, high-level procedural programming
    languages require three basic control statements:


    +   - Sequence instruction

    +   - Selection/decision instruction

    +   - Repetition or loop instruction


    **Sequence** instruction means executing one instruction after another, in the
    order in which they occur in the source file. This is usually built into the language
    as a default action, as it is with C. If an instruction is not a control statement,
    then the next instruction to be executed will simply be the next one in sequence.


    **Selection** means executing different sections of code depending on a specific
    condition or the value of a variable. This allows a program to take different
    courses of action depending on different conditions. C provides the following
    selection structures:


    +   - if

    +   - if else

    +   - nested if

    +   - if else if else

    +   - switch case


    **Repetition/Looping** means executing the same section of code more than once.
    A section of code may either be executed a fixed number of times, or while some
    condition is true. C provides three looping statements:


    +   - while

    +   - do...while

    +   - for

    +   - Nested Loops


    This chapter introduces you the decision and loop control statements that are
    available in C programming language along with some of the example programs.


    # ### DECISION CONTROL STATEMENTS


    In a C program, a decision causes a one-time jump to a different part of the program,
    depending on the value of an expression. Decisions in C can be made in several
    ways. The most significant is with the **if...else** statement, which prefers
    between two alternatives. This statement can be employed without the **else**,
    as a simple if statement. Another decision control statement, **switch**, creates
    branches for multiple alternative sections of code, depending on the value of
    a single variable.'
