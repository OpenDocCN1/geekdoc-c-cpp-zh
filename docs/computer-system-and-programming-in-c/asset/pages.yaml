    # Menu Bar


    A menu bar is present in merely every application window directly below the title
    bar. Each word on the bar is a separate menu. If you click on the word, the corresponding
    menu will appear, like so:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_64_1.png)


    Some programs have cascading menus, which means that an item inside the menu will
    bring you to another related menu. A very common example in Windows 95 is the
    Start menu (which, by the way, is not part of a menu bar but rather a button on
    the Taskbar):


    Note that you can identify a cascading menu by the right-pointing arrow at the
    side.


    # Popup Menu


    Another type of menu is the popup menu. Unlike other menus, the popup does not
    have


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_64_2.png)'
