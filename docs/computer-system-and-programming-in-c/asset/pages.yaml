  md: 'the high level of the overall problem is solved first while the details of
    each lower-level function are addressed later.


    +   2. The length of a source program can be reduced by using functions at a appropriate
    places.

    +   3. It is easy to locate and isolate a faulty function for further investigations.

    +   4. A function may be used by many other programs. This means that a C programmer
    can build on what others have already done, instead of starting from scratch.


    # ELEMENTS OF USER-DEFINED FUNCTION


    In C language user-defined function has three stages and which are as follows:


    +   1. Declaration of a function or function prototype

    +   2. Calling of a function

    +   3. Body of a function


    _Declaration of a Function or Function Prototype_


    Declaration of a function or function prototype means what the function is, i.e.
    how many arguments it receives and what is the return data type of the function.


    The general syntax for defining a function is as follows:

    <return data type> functionname(arguments)


    According to the declaration the function declaration is divided into four categories:


    +   a. With arguments and with return type

    +   b. With arguments and no return type

    +   c. No arguments but return type

    +   d. No arguments and no return type


    # Note


    +   • If a function accepts the arguments then the inputting is done within main
    function and if the function does not accept the arguments then the inputting
    is done within the body of the function

    +   • If a function returns the value then the printing is done within main function
    and if the function does not return the value then the printing is done within
    the body of the function.


    value then the printing is done within the body of the function.


    _Calling of a Function_


    We have to call the function according to the arguments and return value and if
    the function does not return any value then we does not store that function in
    any variable.


    # Example


    If we define int add(int,int) as a prototype then at the time of calling we have
    to call this function as follows:

    c=add(a,b);

    If we define void add(int,int) as a prototype then at the time of calling we have
    to call this function as follows:

    add(a,b);

    If we define int add() as a prototype then at the time of calling we have to call
    this function as follows:

    c=add();

    If we define void add() as a prototype then at the time of calling we have to
    call this function as follows:

    add();


    _Body of a Function_


    Finally we have to write the body of the function outside of the main program,
    i.e. either the upper side of the main or the lower side of the main function.


    # WITH ARGUMENTS AND WITH RETURN TYPE


    In this type of declaration we have to pass the arguments as well as we have to
    return the value to the main function.


    # For example


    If we define int add (int,int). The meaning of this line is that add is a function
    which defines two integer arguments and according to that arguments it returns
    an integer type of value.


    _Programming Problems_


    # Problem 1


    Write a program to define two numbers and print the addition of both the numbers
    with the help of function and use the case of with arguments and with return value.'
