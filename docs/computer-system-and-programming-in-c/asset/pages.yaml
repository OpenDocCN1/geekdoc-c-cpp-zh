    }\nprintf(\"\\n the minimum number is %d\", min);\ngetch();\n}\n```\n\n# Problem\
    \ 3\n\nWrite a program to input how many numbers and then input the numbers and\
    \ then print the sum of all the numbers with the help of calloc function.\n\n\
    # Solution\n\n```\n#include<stdio.h>\n#include<conio.h>\n#include<stdlib.h>\n\
    void main()\n{\n    int *p, n, i, sum=0;\n    clrscr();\n    printf(\"\\n enter\
    \ how many elements\");\n    scanf (\"%d\", &n);\n    p=(int *) calloc(n, sizeof(int));\n\
    \    for(i=0;i<n;i++)\n    {\n        printf(\"\\n enter the element\");\n   \
    \     scanf(\"%d\",&p[i]);\n    }\n    for(i=0;i<n;i++)\n    {\n        sum=sum+p[i];\n\
    \    }\n    printf(\"\\n the Sum is %d\",sum);\n    getch();\n}\n```\n\n# *Difference\
    \ between malloc () and calloc () Function*\n\nBoth the malloc() and the calloc()\
    \ functions are used to allocate dynamic memory. Each operates slightly different\
    \ from the other. malloc() takes a size and returns a pointer to a chunk of memory\
    \ that is at least that big: void *malloc( size_t size ); calloc() takes a number\
    \ of elements, and the\n\nsize of each, and returns a pointer to a chunk of memory\
    \ at least big enough to hold them all:\n\nvoid *calloc( size_t numElements, size_t\
    \ sizeOfElement );\n\nThere is one major difference and one minor difference between\
    \ the two functions. The major difference is that malloc() does not initialize\
    \ the allocated memory. The first time malloc() gives you a particular chunk of\
    \ memory, the memory might be full of zeros. If memory has been allocated, freed,\
    \ and reallocated, it probably hasn't been left in it. That means, unfortunately,\
    \ that a program might run in simple cases (when memory is never reallocated)\
    \ but break when used harder (and when memory is reused). calloc() fills the allocated\
    \ memory with all zero bits. That means that anything you're going to use as a\
    \ char or an int of any length, signed or unsigned, is guaranteed to be zero.\
    \ Anything you're going to use as a pointer is set to all zero bits. That is usually\
    \ a null pointer, but it is not guaranteed. Anything you are going to use as a\
    \ float or double is set to all zero bits; that is a floating-point zero on some\
    \ types of machines, but not on all.\n\nThe minor difference between the two is\
    \ that calloc() returns an array of objects; malloc() returns one object. Some\
    \ people use calloc() to make clear that they want an array.\n\n# (c) *free()\
    \ Function*\n\nWhen you allocate memory with either malloc() or calloc(), it is\
    \ taken from the dynamic memory pool that is available to your program. This pool\
    \ is sometimes called the heap, and it is finite. When your program finishes using\
    \ a particular block of dynamically allocated memory, you should deallocate, or\
    \ free, the memory to make it available for future use. To free memory that was\
    \ allocated dynamically, use free(). Its prototype is\n\nvoid free(void *ptr);\n\
    \nThe free() function releases the memory pointed to by ptr. This memory must\
    \ have been allocated with malloc(), calloc(), or realloc(). If ptr is NULL, free()\
    \ does nothing."
