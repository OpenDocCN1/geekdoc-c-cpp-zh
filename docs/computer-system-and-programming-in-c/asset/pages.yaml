    # The Switch Statement


    While if is good for choosing between two alternatives, it quickly becomes cumbersome
    when several alternatives are needed. Cs solution to this problem is the switch
    statement. The switch statement is Cs multiple selection statement. It is used
    to select one of several alternative paths in program execution and works like
    this: A variable is successively tested against a list of integer or character
    constants. When a match is found, the statement sequence associated with the match
    is executed.


    When we want the check the various cases based on a given condition then we have
    to use the concept of switch case statement. There are times when you will find
    yourself writing a vast if block that consists of many else if statements.


    The switch statement can help simplify things a bit. It permits you to test the
    value returned by a single expression and then execute the relevant bit of code.


    You can have as many cases as you want, including a default case which is measured
    if all the cases fail.


    The general syntax of switch case is as follows:


    ```

    ```c

    switch (expression)

    ```

