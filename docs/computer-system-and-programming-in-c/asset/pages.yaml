  md: '# The if Statement


    It is used to execute an instruction or sequence/ block of instructions only if
    a condition is fulfilled. In if statements, expression is evaluated first and
    then, depending on whether the value of the expression (relation or condition)
    is “true” or “false”, it transfers the control to a particular statement or a
    group of statements.


    Different forms of implementation if-statement are as follows:


    +   - Simple if statement

    +   - If-else statement

    +   - Nested if-else statement

    +   - Else if statement


    # Simple if statement


    It is used to execute an instruction or block of instructions only if a given
    condition is true.


    The syntax of simple if statement is as follows (if condition)

    **statement;**

    Where condition is the expression that is to be evaluated. If this condition is
    **true**, statement is performed. If it is **false**, statement is ignored (not
    executed) and the program continues on the next instruction after the conditional
    statement.


    The flow chart of the simple if statement is as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_169_0.png)


    If we want more than one statement to be executed, then we can specify a block
    of statements within the curly brackets { }.


    The syntax is as follows:


    ```

    if (condition)

    {

    block of statements;

    }

    ```


