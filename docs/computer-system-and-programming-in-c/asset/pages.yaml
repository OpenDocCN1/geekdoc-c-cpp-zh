    \  friday\n} workday;\n```\n\n# ENUMERATED TYPE DECLARATION\n\nAn enumeration\
    \ consists of a set of named integer constants. An enumeration type declaration\
    \ gives the name of the (optional) enumeration tag and defines the set of named\
    \ integer identifiers (called the “enumeration set”/“enumerator constants,” “enumerators,”\
    \ or “members”). A variable with enumeration type stores one of the values of\
    \ the enumeration set defined by that type.\n\nVariables of enum type can be used\
    \ in indexing expressions and as operands of all arithmetic and relational operators.\
    \ Enumerations provide an alternative to the #define preprocessor directive with\
    \ the advantages that the values can be generated for you and obey normal scoping\
    \ rules.\n\nIn ANSI C, the expressions that define the value of an enumerator\
    \ constant always have int type; thus, the storage associated with an enumeration\
    \ variable is the storage required for a single int value. An enumeration constant\
    \ or a value of enumerated type can be used anywhere the C language permits an\
    \ integer expression.\n\nThe general syntax for defining an enumerated data type\
    \ is as follows:\n\nenum identifier {value1, value2 .... value n};\n\nThe identifier\
    \ is a user defined enumerated data type which can be used to declare variables\
    \ that have one of the values enclosed within the braces. After the definition\
    \ we can declare variables to be of this ‘new’ type as below.\n\nenum identifier\
    \ V1, V2, V3, ........ Vn\n\nThe enumerated variables V1, V2, ........ Vn can\
    \ have only one of the values value1, value2 ..... value n\n\n# Example\n\n```\n\
    enum DAY /* Defines an enumeration type */\n```\n\nThe value 0 is associated with\
    \ Saturday by default. The identifier Sunday is explicitly set to 0. The remaining\
    \ identifiers are given the values 1 through 5 by default.\n\n# STORAGE CLASSES\n\
    \nThe variables can be characterized by their data type and by their storage class.\
    \ One way to classify a variable is according to its data type and the other can\
    \ be through its storage class. Data type refers to the type of value represented\
    \ by a variable whereas storage class refers to the permanence of a variable and\
    \ its scope within the program, i.e. portion of the program over which variable\
    \ is recognized.\n\nThe storage class associated with a variable can sometimes\
    \ be established by the location of the variable declaration within the program\
    \ or by prefixing keywords to variables declarations.\n\nMoreover, a variable’s\
    \ storage class tells us:\n\n+   - Where the variable would be stored.\n+   -\
    \ What will be the initial value of the variable, if initial value is not specifically\
