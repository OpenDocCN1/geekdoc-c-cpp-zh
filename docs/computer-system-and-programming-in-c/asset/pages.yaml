  md: 'as char and place the number of characters in the array in square brackets
    after the string name.


    The general syntax of defining a string is as follows:


    ```

    char string-name[size];

    ```


    # Example


    ```

    char name[25];

    char address[30];

    char city[20];

    ```


    # Initializing Strings


    Following the discussion on characters arrays, the initialization of a string
    must be as form which is simpler to one dimension array.


    char month[] = {''j'',''a'',''n'',''u'',''a'',''r'',''y'',''\\0''};


    Then the string month is initializing to January. This is absolutely valid but
    C offers a special way to initialize strings. The above string can be initialized
    char month[1] = "January"; The characters of the string are enclosed within a
    pair of double quotes. The compiler takes care of string closed in within a pair
    of a double quotes. The compiler takes care of putting the ASCII codes of characters
    of the string in the memory and also stores the null terminator in the end.


    ```

    /*String.c string variable*/

    #include <stdio.h>

    main()

    {

    char month[15];

    printf ("Enter the string");

    gets (month);

    printf ("The string entered is %s", month);

    }

    ```


    In this example, string is stored in the character variable month the string is
    displayed in the statement.


    ```

    printf("The string entered is %s", month);

    ```


    It is one dimension array. Each character takes a byte. A null character (\\0)
    that has the ASCII value 0 ends the string. The figure shows the computer storage
    of string January in the memory recall that \\0 determines a single character
    whose ASCII value is zero.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_222_0.png)


    Character string terminated by a null character ‘\\0’.


    A string variable is any valid C variable name & is forever declared as an array.
    The general form of declaration of a string variable is


    ```

    char string_name[size];

    ```


    The size determines the number of characters in the string name.


    # Example


    If we define the following character type arrays


    ```

    char month[10];

    char address[100];

    ```


    The size of the array should be one byte more than the actual space occupied by
    the string since the compiler appends a null character at the end of the string.


    # STRING CONSTANTS


    String constants have double quote marks around them, and can be assigned to char
    pointers. In lieu, you can assign a string constant to a char array—either with
    no size defined, or you can specify a size, but do not forget to leave a space
    for the null character!


    Let us explain it with the help of following code fragments


    ```

    /* Code Fragment 1 */

    {

    char *s;

    s="Manish";

    printf("%s \\n",s);

    }

    ```


    ```

    /* Code Fragment 2 */

    {

    char s[100];

    strcpy(s, "Manish");

    printf("%s \\n",s);

    }

    ```'
