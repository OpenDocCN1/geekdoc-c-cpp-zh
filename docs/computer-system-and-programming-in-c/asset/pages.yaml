- pgno: 57
  md: '*CAI Command*

    The “cat” command lets you view text files. “cat” is short for concatenate. Note
    that the cat command echoes each line as soon as it has been typed in.


    # Examples


    **(I) cat /etc/passwd**

    This command displays the “/etc/passwd” file on your screen.


    **(II) cat /etc/profile**

    This command displays the “/etc/profile” file on your screen. Notice that some
    of the contents of this file may scroll off of your screen.


    **(III) cat file1 file2 file3 > file4**

    This command combines the contents of the first three files into the fourth file.


    *SORT Command*

    SORT command is used to sort the contents of a file and name it students_list.


    # Example


    ```

    $cat > students_list

    Abhi       20101

    Revathi    20125

    Preethi    20104

    Ravi       20121

    ctrl -d

    $

    ```


    Using sort command, the above list may be sorted alphabetically as shown below:


    ```

    $sort students_list

    Abhi       20101

    Preethi    20104

    ravi       20121

    Revathi    20125

    ```


    *WC Command*

    WC command is used to count the number of lines, words and characters in a file.


    # Example


    ```

    $wc students_list

    5 10 53 students_list

    ```


    Note that there are 5 lines, 10 words and 53 characters in the file. Also note
    that every line is terminated by pressing Enter key which is represented by an
    invisible new line character. These characters are also accounted to get the number
    of characters as 53 instead of the actual number of characters as 48.


    The WC command has the following options:

    (I) $wc –l will display the number of lines in a file.


    # Example


    ```

    $wc–l students_list

    ```


    The output of the above command is the number of lines in student_list file.


    (II) $wc–w will display the number of words in a file.


    # Example


    ```

    $wc–w students_list

    ```


    The output of the above command is the number of words in student_list file.


    (III) $wc–c will display the number of characters in a file.


    # Example


    ```

    $wc–c students_list

    ```


    The output of the above command is the number of characters in student_list file.


    *GREP Command*

    GREP command is used to search and display a line for a given word or pattern
    in a given file name.


    Consider the following example to display the register number of a student.


    ```

    $grep Abhi students_list

    Abhi 20101

    ```


    *Filters*

    These refer to any command that can take input from standard input, perform some
    operations and write the results to standard output.


    Consider the following example:


    ```

    $who

    cseabhi tty1 sep 29 13:01

    itreva tty2 sep 29 14:15

    ituser1 tty3 sep 29 15:45

    $

    ```


    The above list can be short listed to specific users and display the list in alphabetical
    order as shown below:


    ```

    $who | grep it | sort

    itreva tty2 sep 29 14:15

    ituser1 tty3 sep 29 15:45

    ```'
  merge: -1
  img_proc: true
