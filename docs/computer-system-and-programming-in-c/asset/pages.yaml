    # OTHER OPERATORS


    Now we will discuss some other operators used in C Programming Language.


    # (a) Comma operator (,)


    The comma operator (,) is used to separate two or more expressions that are included
    where only one expression is expected. When the set of formulas has to be measured
    for a value, only the rightmost expression is considered.


    # Example


    ```

    a = (b=3, b+2);

    ```


    Would first assign the value 3 to b, and then assign b+2 to variable a. So, at
    the end, variable a would hold the value 5 while variable b would contain value
    3.


    Generally, comma operator (,) is used in the for loop (will be introduced in the
    next Chapter)


    ```

    for (i = 0,j = n;i<j; i++,j--)

    {

    printf ( “A”);

    }

    ```


    In this example for is the looping construct (discussed in the next chapter).
    In this loop, i = 0 and j = n are separated by comma (,) and i++ and j-- are separated
    by comma (,).


    # (b) sizeof () operator


    This operator accepts one parameter, which can be either a type or a variable
    itself and returns the size in bytes of that type or object:


    ```

    a = sizeof(char);

    ```


    In the above declaration a holds 1 byte because a character variable holds one
    byte memory.


    ```

    a=sizeof(int);

    ```


    In the above declaration a holds 2 bytes because an integer variable holds 2 bytes
    memory.


    The value returned by sizeof is a constant, so it is always determined before
    program execution.


    # (c) Increase and decrease (++ , --)


    The increment operator increases the variable by one and decrement operator decreases
    the variable by one. These operators can be written in two forms i.e. before a
    variable or after a variable. If an increment/decrement operator is written before
    a variable, it is referred to as preincrement/predecrement operators and if it
    is written after a variable, it is referred to as postincrement/postdecrement
    operator.


    # Example


    a++ or ++a is equivalent to a = a+1 and a— or -a is equivalent to a = a −1'
