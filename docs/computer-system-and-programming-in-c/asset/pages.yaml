- pgno: 12
  md: '# # Syllabus


    # NCS-101/NCS-201 Computer System and Programming in C—LTP 310


    # **Unit 1 (10 Lectures)**


    *Basics of computer:* Introduction to digital computer, basic operations of computer,
    functional components of computer, classification of computers.


    *Introduction to operating system:* [DOS, Windows, Linux and Android] purpose,
    function, services and types.


    *Number system:* Binary, octal and hexadecimal number systems, their mutual conversions,
    Binary arithmetic.


    *Basics of programming:* Approaches to problem solving, concept of algorithm and
    flow charts.


    *Types of computer languages:* Machine Language, Assembly Language and High Level
    Language, Concept of Assembler, Compiler, Loader and Linker.


    # **Unit 2 (8 Lectures)**


    *Standard I/O in C:* Fundamental data types—character type, integer, short, long,
    unsigned, single and double floating point, storage classes—automatic, register,
    static and external, operators and expression using numeric and relational operators,
    mixed operands, type conversion, logical operators, bit operations, assignment
    operator, operator precedence and associativity.


    *Fundamentals of C programming:* Structure of C program, writing and executing
    the first C program, components of C language. Standard I/O in C.


    # **Unit 3 (10 Lectures)**


    *Conditional program execution:* Applying if and switch statements, nesting of
    if and else, use of break and default with switch, program loops and iterations:
    use of while, do while and for loops, multiple loop variables, use of break and
    continue statements. Functions: Introduction, types of functions, functions with
    array, passing values to functions, recursive functions.


    # **Unit 4 (6 Lectures)**


    *Arrays:* Array notation and representation, manipulating array elements, using
    multi-dimensional arrays. Structure, union, enumerated data types.


    # **Unit 5 (8 Lectures)**


    *Pointers:* Introduction, declaration, applications


    File handling, standard C preprocessors, defining and calling macros, conditional
    compilation, passing values to the compiler.'
  merge: -1
  img_proc: true
