  md: 'letters, the data must be sent to a computer so that a software application
    can make sense of the data. Barcode scanners are connected to a computer through
    a serial port, keyboard port, or an interface device called a wedge. A barcode
    reader works by detecting a beam of light across the bar code and measuring the
    amount of light that is reflected back. (The dark bars on a barcode reflect less
    light than the white spaces between them.) The scanner converts the light energy
    into electrical energy, which is then converted into data by the decoder and forwarded
    to a computer. The picture of a barcode reader is shown in Fig. 1.14.


