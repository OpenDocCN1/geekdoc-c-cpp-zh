    \ i.e. in which functions the value of the variable would be available.\n+   -\
    \ What is the life of the variable, i.e. how long would the variable exist.\n\n\
    C programming language consists four storage classes which are as follows:\n\n\
    +   (a) Automatic storage class\n+   (b) Register storage class\n+   (c) Static\
    \ storage class\n+   (d) External storage class\n\nNow we will discuss these storage\
