    # The First Microcomputers


    The first commercially available micro-computer of note was the Altair 8800 computer
    sold by MITS (Micro Instrumentation and Telemetry Systems), a company founded
    by Dr. Ed Roberts that was based in Albuquerque, New Mexico. The computer was
    featured on the cover of the January 1975 issue of Popular Electronics, and was
    sold as a kit for $397 or assembled for $439. It used a 2 MHz Intel 8080 processor
    and had 256 bytes of RAM.


    Remember that a computer cannot do anything without software, and some companies
    sprang into existence to fill this need. One small company of note was formed
    in Albuquerque by a Harvard dropout to provide software (a BASIC language) for
    the Altair computer. The founder’s name was Bill Gates, and the company he form
    (along with his partner Paul Allen) was Microsoft.


    Dozens of companies (most of which have long since vanished) began offering micro-computers
    for sale, most of them based on the Intel 8080 processor and running the CP/M
    operating system. Other companies had proprietary operating systems, such as Radio
    Shack, Atari, and Commodore. Of particular note is a company named Apple founded
    by Steve Jobs and Steve Wozniak on April 1, 1976. Their Apple II computer was
    a hit, especially in the home and education markets.


    Two things caused the microcomputer market to really take off in the late 1970s
    and early 1980s: spreadsheet software, and the IBM PC. Spreadsheet software (the
    first was Visicalc for the Apple II, written by Dan Bricklin) finally convinced
    business people that there was a serious use for microcomputers. The IBM PC, released
    in 1981, gave a legitimacy to the microcomputer by virtue of the IBM name (remember,
    IBM was the maker of big mainframe computers; and it was said “Nobody ever gets
    fired for buying IBM”). It used a 4.77 MHz Intel 8088 processor.


    Microsoft went to IBM about an operating system (OS) for their new PC. Bill Gates
    told them, “We have an OS that will run on this new machine you are planning,”
    and made a deal. Microsoft did not, in fact, have such an OS, but they quickly
    bought one from a third party and converted it into PC-DOS. But what Gates did
    that was really clever was to make'
