  md: '# *Screen Resolution of a VDU*


    The standard user interface on the PC was originally a text-only mode. With the
    increased resolution of VDUs applications are now written in graphics mode using
    individual pixels. A recent standard has been 640 × 480 pixels on the screen (this
    is called VGA) and the present standard is 800 × 600 (called SVGA). This has enabled
    the use of an increasingly sophisticated visual interface, utilizing graphical
    user interfaces (GUIs) such as Microsoft Windows and MAC OS as well as more highly
    developed user friendly software. Figure 1.29 depicts the different screen resolution.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_29_0.png)


    **Fig. 1.29:** Diagram of different screen resolutions


    # *Printer*


    You can print out information that is in the computer onto paper. By printing
    you create what is known as a ‘hard copy’. There are different kinds of printers
    which vary in their speed and print quality. A most convenient and useful method
    by which the computer can deliver information is by means of printed characters.


    # *Types of Printer*


    The two main types of printer are:


    +   1. Impact printer

    +   2. Non-impact printer


    # *Impact printer*


    Impact printers (Fig. 1.30) use a print head containing a number of metal pins
    which strike an inked ribbon placed between the print head and the paper. Some
    print heads have only 9 pins to make the dots to build up a character; some have
    24 pins which produce a better resolution.

    Graphically it is represented as follows:

    In this category we will discuss the dot matrix printer and daisywheel printer.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_29_1.png)


    **Fig. 1.30:** An impact printer


    **Dot matrix printer:** In dot matrix printer characters are formed from a matrix
    of dot (Fig. 1.31). The speed is usually 30–550 characters per second (cps). This
    is the cheapest and noisiest of the printer family. The standard of print obtained
    is poor. These printers are cheap to run and relatively fast. They are useful
    for low quality carbon copy printing.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_29_2.png)


    **Fig. 1.31:** A dot matrix printer'
  merge: -1
  img_proc: true
