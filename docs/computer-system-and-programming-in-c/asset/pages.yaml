- pgno: 66
  md: 'The middle part of the Taskbar holds buttons for each application window which
    you currently have open. This makes it really easy to do many things at once.
    To switch from one program to another, just click on its button on the taskbar.
    This is also, of course, a way to tell you what programs you have open and what
    they are.


    At the other end of the taskbar is the “System Tray”. This tray holds the clock,
    plus miniature icons for miscellaneous mini-applications. Simply pointing to one
    of these icons will pop up a brief description of the mini-app or its status.
    For example, the yellow speaker at the far left of the system tray lets you control
    the volume. If you point to the clock, it will briefly show you the date.


    The taskbar is also a window. Like application windows, you can change its size;
    however, the border is only available on one side of the taskbar (the side that
    is not against the edge of the display). You can only enlarge the taskbar to half
    the size of the Desktop, but windows will happily let you shrink it down to nothing
    but the border!


    You can also move the taskbar, but unlike other windows, it must be stuck to one
    side of the display and run the entire length of that side. To move the taskbar,
    just hold the mouse button down on a part of the Taskbar that is not covered by
    buttons and drag it to whichever side of the screen you want it to be.


    # Icon


    An icon is “an image; a representation.” It is used to represent a window, a program,
    a file, or any other object. Icons behave differently depending on what they represent,
    but usually you need to double-click on the icon to activate it. In Windows 95,
    clicking the right mouse button on most icons will display a menu that gives additional
    tools you can do with that icon.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_66_0.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_66_1.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_66_2.png)


    # EXPLORE YOUR COMPUTER


    Once your computer is booted up, you are ready to explore your computer, i.e.
    you can now see what all things (files, application, etc.) are there on your computer.


    There are several ways that let you navigate around your computer. But the commonly
    used one are as follows:


    +   1. Start Button and Taskbar

    +   2. My Computer

    +   3. Windows Explorer


    Now we will discuss these issues one by one.


    # The Start Button and Taskbar


    You can use the taskbar and Start button to easily navigate through Windows 98.
    Both features are always available on your desktop, no matter how many open windows
    you have.


    *The Start button*


    The start menu is the main navigational tool for launching programs. It also provides
    access to some system settings. The start menu is located in the bottom left hand
    corner of the screen.


    +   - **Programs:** A submenu where all of the programs installed on a computer
    are located.

    +   - **Documents:** A submenu of the recently opened documents.

    +   - **Settings:** A submenu of system settings and control panels.

    +   - **Search:** A submenu for different types of searches. A particular search
    is to find files and folders.

    +   - **Help:** A help wizard with answers to common questions on particular areas
    of Windows 2000.

    +   - **Run:** A command line interface for advanced users.

    +   - **Shutdown:** Gives a user the option to turn off the computer (shutdown),
    restart or logoff.


    Graphically the start menu is represented in the graphic (p. 54 top).


    Most beginners have no idea how many programs they have, or what the names of
    those programs are. If you fall into that category, you may want to take a minute
    now to look around. That is, click the Start button then click on All Programs.
    Then, any time you see a menu option with a % on it, point to'
