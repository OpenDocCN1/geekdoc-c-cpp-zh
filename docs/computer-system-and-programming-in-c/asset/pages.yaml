  md: "# # 5 Fundamental of C\n\nIn the earlier chapter, we introduced you to the\
    \ concepts of problem-solving, especially as they pertain to computer programming.\
    \ In this chapter, we present C language — a standardized, industrial-strength\
    \ programming language known for its power and portability as an implementation\
    \ vehicle for these problem-solving techniques using computer.\n\nA language is\
    \ a mode of communication between two people. It is necessary for those two people\
    \ to understand the language in order to communicate. But even if the two people\
    \ do not understand the same language, a translator can help to convert one language\
    \ to the other, understood by the second person. Similar to a translator is the\
    \ mode of communication between a user and a computer in a computer language.\
    \ One form of the computer language is understood by the user, while in the other\
    \ form it is understood by the computer. A translator (or compiler) is needed\
    \ to convert from user’s form to computer’s form. Like other languages, a computer\
    \ language also follows a particular grammar known as the syntax.\n\n# ## PROGRAM\
    \ AND PROGRAMMING LANGUAGES\n\nWe have seen in the previous chapter that a computer\
    \ has to be fed with a detailed set of instructions and data for solving a problem.\
    \ Such a procedure which we call an algorithm is a series of steps arranged in\
    \ a logical sequence. Also we have seen that a flow chart is a pictorial representation\
    \ of a sequence of instructions given to the computer. It also\n\nserves as a\
    \ document explaining the procedure used to solve a problem. In practice it is\
    \ necessary to express an algorithm using a programming language.\n\n**A procedure\
    \ expressed in a programming language is known as a computer program.**\n\nComputer\
    \ programming languages are developed with the primary objective of facilitating\
    \ a large number of people to use computers without the need for them to know\
    \ in detail the internal structure of the computer. Languages are designed to\
    \ be machine-independent. Most of the programming languages ideally designed,\
    \ to execute a program on any computer regardless of who manufactured it or what\
    \ model it is.\n\nProgramming languages can be divided into two categories:\n\n\
    +   i. **Low-level Language or Machine Oriented Languages:**\n+   \n+   The language\
    \ whose design is governed by the circuitry and the structure of the machine is\
    \ known as the **machine language**. This language is difficult to learn and use.\
    \ It is specific to a given computer and is different for different computers,\
    \ i.e. these programming languages are **machine-dependent**. These languages\
    \ have been designed to give a better machine efficiency, i.e. faster program\
    \ execution. Such languages are also known as low-level languages. Another type\
    \ of low-level language is the assembly language. We will code the assembly language\
    \ program in the form of mnemonics. Every machine provides a different set of\
    \ mnemonics to be used"
