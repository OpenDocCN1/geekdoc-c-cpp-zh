  md: '# # Dynamic Memory Allocation


    Memory allocation means reserving memory for specific purposes. Operating systems
    and applications generally reserve fixed amounts of memory at start up and allocate
    more when the processing requires it. If there is not enough free memory to load
    the core kernel of an application, it cannot be launched. Although a virtual memory
    function will simulate an almost unlimited amount of memory, there is always a
    certain amount of “real” memory that is needed.


    In C language memory allocation is divided into two parts:


    +   (a) Static memory allocation

    +   (b) Dynamic memory allocation


    (a) *Static Memory Allocation*


    Static memory allocation means the memory is allocated at the time of compilation.
    The compiler allocates the required memory space for a declared variable. By using
    the address of operator, the reserved address is obtained and this address may
    be assigned to a pointer variable. Since most of the declared variable has static
    memory, this way of assigning pointer value to a pointer variable is known as
    static memory allocation. Memory is assigned during compilation time. In C language
    the static memory allocation is done with the help of array and simple variables.


    # For example


    If we define int a[100]. The meaning of this line is that a is an array which
    holds 100 integer elements and 200 bytes memory is allocated for this array.


    # (b) *Dynamic Memory Allocation*


    Dynamic memory allocation means the memory is allocated at the time of running
    of the program. It uses functions such as malloc( ) or calloc( ) to get memory
    dynamically. If these functions are used to get memory dynamically and the values
    returned by these functions are assigned to pointer variables, such assignments
    are known as dynamic memory allocation. Memory is assigned during run time.


    # FUNCTIONS FOR DYNAMIC MEMORY ALLOCATION


    In C language the following are the functions which are used for dynamic memory
    allocation and deallocation. We will discuss the following function


    +   - malloc() function

    +   - calloc() function

    +   - realloc() function

    +   - free() function


    All these functions are predefined in stdlib.h or alloc.h header file.


    (d) *malloc() Function*


    The malloc function is one of the functions in standard C to allocate memory dynamically.
    Its function prototype is as follows:


    void *malloc(size_t size);


    We can also write the following syntax for the malloc function.


    <Pointer Variable>=<datatype *> malloc(No of elements * sizeof(data type);


    malloc requires one argument—the number of bytes you want to allocate dynamically.
    If the memory allocation was successful, malloc will return a void pointer—you
    can assign this'
