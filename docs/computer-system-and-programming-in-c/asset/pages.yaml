  md: "In Java the incorrect dereference will be flagged politely by the runtime system.\
    \ In compiled languages such as C, C++, and Pascal, the incorrect dereference\
    \ will sometimes crash, and other times corrupt memory in some subtle, random\
    \ way. Pointer bugs in compiled languages can be difficult to track down for this\
    \ reason.\n\n# *Pointer Assignment*\n\n**Pointer assignment** between two pointers\
    \ makes them point to the same pointee. So the assignment `y = x;` makes `y` point\
    \ to the same pointee as `x`.\n\nPointer assignment does not touch the pointees.\
    \ It just changes one pointer to have the same reference as another pointer. After\
    \ pointer assignment, the two pointers are said to be “sharing” the pointee.\n\
    \n# **POINTER ARITHMETIC**\n\nPointer variables can also be used in arithmetic\
    \ expressions. The following operations can be performed on pointers.\n\n+   1.\
    \ Pointers can be incremented or decremented to point to different locations like\n\
    +   \n+      ```\n+      ptr1 = ptr2 + 4;\n+      ptr ++;\n+      -- ptr;\n+ \
    \     ```\n+   \n+      However, `ptr++` will cause the pointer `ptr` to point\
    \ the next address value of its type.\n+   \n+      For example, if `ptr` is a\
    \ pointer to float with an initial value of 65526, then after the operation `ptr\
    \ ++` or `ptr = ptr+1`, the value of `ptr` would be 65530. Therefore, if we increment\
    \ or decrement a pointer, its value is increased or decreased by the length of\
    \ the data type that it points to.\n+   \n+   2. If `ptr1` and `ptr2` are properly\
    \ declared and initialized pointers, the following operations are valid:\n+  \
    \ \n+      ```\n+      res = res + *ptr1;\n+      *ptr1 = *ptr2 + 5;\n+      prod\
    \ = *ptr1 * *ptr2;\n+      quo = *ptr1 / *ptr2;\n+      ```\n+   \n+      Note\
    \ that there is a blank space between `/` and `*` in the last statement because\
    \ if you write `/*` together, then it will be considered as the beginning of a\
    \ comment and the statement will fail.\n\n+   3. Expressions like `ptr1 = ptr2`,\
    \ `ptr1 < ptr2`, and `ptr2 != ptr1` are permissible provided the pointers `ptr1`\
    \ and `ptr2` refer to same and related variables. These comparisons are common\
    \ in handling arrays.\n\n# **Operations that cannot be used with respect to pointers**\n\
    \nSuppose `p1` and `p2` are pointers to related variables. The following operations\
    \ cannot work with respect to pointers:\n\n+   1. Pointer variables cannot be\
    \ added. For example, `p1 = p1 + p2` is not valid.\n+   2. Multiplication or division\
    \ of a pointer with a constant is not allowed.\n+   \n+      For example, `p1\
    \ * p2` or `p2 / 5` are invalid.\n+   3. An invalid pointer reference occurs when\
    \ a pointer’s value is referenced even though the pointer does not point to a\
    \ valid block. Suppose `p` and `q` are two pointers. If we say, `p = q`; when\
    \ `q` is uninitialized. The pointer `p` will then become uninitialized as well,\
    \ and any reference to `*p` is an invalid pointer reference.\n\n**Note:** Once\
    \ we have created a pointer that points to a certain variable, we can either reassign\
    \ it another variable’s address, or we can move it around by performing **Pointer\
    \ Arithmetic**.\n\nSuppose we had an int pointer, ptr. If we say `ptr++`, `++ptr`\
    \ or `ptr+=1`, we are actually moving the pointer forward by 2 bytes (i.e. the\
    \ size of its data type). So it will point somewhere else in the computer’s memory.\n\
    \nSimilarly, `ptr—`, `—ptr` and `ptr-=1` will move the int pointer “back” 2 bytes.\n\
    \nAnd you are not restricted to move in steps of 1 either: `ptr+=n` will move\
    \ it “forward” by `n*2` bytes, (assuming ptr is an int pointer). The larger the\
    \ data type, the larger the step size. So if ptr was a double pointer, `ptr-=3`\
    \ will move it “back” by `3*8 = 24` bytes.\n\nThe arithmetic assignment operators\
    \ you can use with pointers are `+=` and `-=`. `ptr*=2` and `ptr/=2` cannot be\
    \ used!"
