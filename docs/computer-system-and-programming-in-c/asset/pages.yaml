- pgno: 100
  md: 'sequence in which the program statements are to be executed.


    # Consecutive


    Statements within a structured program are normally executed in the same sequence
    as they are listed within source code. If a code fragment consists of three statements
    following one another then statement one will execute first, statement two second,
    and statement three last. To change from this straight consecutive execution sequence
    requires the use of one of the other structured programming constructs which are
    described below.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_100_0.png)


    The pseudocode of the above construct is as follows:


    ```

    Statement-1

    Statement-2

    Statement-3

    ```


    # Example


    ```

    Input a

    b = 5 + 2 * a

    print b

    ```


    # Block


    Statements may be blocked together. A block of statements may be substituted wherever
    a single statement is allowed. The symbol or keyword used to indicate the start
    and end of each block differs depending on the programming language used.


    The pseudocode of the above construct is as follows:


    ```

    {

    Statement-1

    Statement-2

    Statement-3

    }

    ```


    # Subroutine


    A subroutine is a code segment that has been separated from the preceding and
    following code. A subroutine usually consists of a series of statements that perform
    a particular task. The task performed is usually identified by the name given
    to the subroutine. Once a subroutine has been defined it can then be called from
    one or more places within the program. This allows a program to perform the same
    task a number of times without having to repeat the same code. A single call statement
    replaces (stands in for) all of the statements contained within the subroutine.
    Parameters can be passed to a subroutine which will supply the data required to
    perform the task and perhaps to return values for use by the subsequent processing.
    A subroutine can either be compiled with (internal to) the calling program or
    separately (external). Graphically it is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_100_1.png)


    The pseudocode of the above construct is as follows:


    ```

    Call subroutine-1 (var1, var2)

    subroutine-1 (var1, var2)

    {

    statement-1

    statement-2

    }

    ```


    # Example


    ```

    call output (a, b)

    output (a, b)

    {

    print a

    print b

    }

    ```'
  merge: -1
  img_proc: true
