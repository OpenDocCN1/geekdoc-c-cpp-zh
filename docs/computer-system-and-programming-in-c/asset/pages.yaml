  md: 'areas of the printed document. Toner is attracted to parts of the drum with
    a high charge. The drum rotates and transfers the toner to the paper which has
    an even greater electrical charge. Finally a heater fixes the toner onto the paper.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_31_0.png)


    The working of a laser printer is graphically represented in Fig. 1.35.


    **Inkjet printer:** In inkjet printer (Fig. 1.36), characters are formed as a
    result of electrically charged or heated ink being sprayed in fine jets onto the
    paper. Individual nozzles in the printing head produce high resolution (up to
    400 dots per inch or 400 dpi) dot matrix characters. Ink jet printers use colour
    cartridges which combine magenta, yellow and cyan inks to create color tones.
    A black cartridge is also used for crisp monochrome output. This method of printing
    can generate up to 200 cps and allows for good quality, cheap color printing (Fig.
    1.36).


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_31_1.png)


    # Plotters


    Many applications require a graphical output apart from printed output. Plotters
    are used to produce graphs or diagrams. Plotters are the output devices that produce
    good quality drawings and graphs. Plotters are classified into two types as follows:


    +   1. Pen plotters

    +   2. Electrostatic plotters


    # Pen plotters


    Pen plotters have an ink pen attached to draw the images and pen plotters are
    classified into two categories as follows:


    +   (a) Flatbed plotter

    +   (b) Drum plotters


    **(a) Flatbed plotter:** This is a plotter (Fig. 1.37) where the paper is fixed
    on a flat surface and pens are moved to draw the image. This plotter can use several
    different color pens to draw with. The size of the plot is limited only by the
    size of the plotter’s bed.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_31_2.png)


    **(b) Drum plotters:** In drum plotters (Fig. 1.38), the pen is moved in a single
    axis track and the paper itself moves on a cylindrical drum to add the other axis
    or dimension. The size


    of the graph is therefore limited only by the width of the drum and can be of
    any length.'
