    # Limitations of Switch Case Statement


    Switch statement is a powerful statement used to handle many alternatives and
    provides good presentation for C program. But there are some restrictions with
    switch statement which are given as follows:


    Logical operators cannot be used with switch statement. For instance case k>=20:
    is not allowed.


    Switch case variables can have only int and char data type. So float or no data
    type is allowed.


    For instance in the switch syntax given below:


    ```

    ```c

    switch(ch)

    {

    case1:statement-1;

    break;

    case2:statement-2;

    ```

    ```


    ```

    ```c

    break;

    ```

    ```


    In this can be integer or char and cannot be float or any other data type.


    # Use of Break with Switch


    break statement is used to terminate the switch statement and to terminate any
    loop according to the user’s requirement.


    Here, we will discuss the use of break with switch statement.


    # Example


    The following example shows the use of break with switch statement


    If we write the following code:


    ```

    ```c

    switch(a)

    {

    case 1: printf("\\n You Pressed 1");

    case 2: printf("\\n You Pressed 2");

    case 3: printf("\\n You Pressed 3");

    }

    ```

    ```


    In the above example, if we input 1 to a then the output will be You Pressed 1
    You Pressed 2 You Pressed 3 because here we are not using the break statement.


    But if we write the following code:


    ```

    ```c

    switch(a)

    {

    case 1: printf("\\n You Pressed 1");

    break;

    case 2: printf("\\n You Pressed 2");

    break;

    case 3: printf("\\n You Pressed 3");

    break;

    }

    ```

    ```


    In the above example, if we input 1 to a then the output will be you pressed 1
    and switch is automatically terminated and if we input 2 then the output will
    be you pressed 2 and switch is automatically terminated and if we input 3 to a
    then the output will be you pressed 3 and switch is automatically terminated i.e.
    break is used to distinguish the cases in the switch statement.


    # Use of Default with Switch


    If we impose the default statement with the switch statement the statements of
    default is executed when none of the conditions are satisfied.'
