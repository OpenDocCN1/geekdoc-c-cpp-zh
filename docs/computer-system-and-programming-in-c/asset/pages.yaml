- pgno: 14
  md: '# # 1 Fundamentals of Computer


    With the fast growing pace of development in the computer hardware field, it is
    important to learn the basics and keep up-to-date with the latest information.
    This chapter will enable the students to understand the basic concepts of computer
    systems and their components. These days computers are being put to use for all
    sorts of applications in every field of science and technology. The word computer
    refers to a system composed of many components. A computer system has both *hardware*
    and *software* components.


    # ## DEFINITION OF COMPUTER


    Technically, a computer is a programmable machine. This means it can execute a
    programmed list of instructions and respond to new instructions that it is given.
    Today, however, the term is most often used to refer to the desktop and laptop
    computers that most people use. When referring to a desktop model, the term “computer”
    technically only refers to the computer itself not the monitor, keyboard, and
    mouse. Still, it is acceptable to refer to everything together as the computer.
    If you want to be really technical, the box that holds the computer is called
    the “system unit.”


    Some of the major parts of a personal computer (or PC) include the motherboard,
    CPU, memory (or RAM), hard drive, and video card. While personal computers are
    by far the most common type of computers today, there are several other types
    of computers too. For example, a “minicomputer” is a powerful computer that can
    support many users at once. A “mainframe” is a large, high-powered


    computer that can perform billions of calculations from multiple sources at one
    time. Finally, a “supercomputer” is a machine that can process billions of instructions
    a second and is used to make extremely complex calculations.


    Graphically a computer system may be represented as shown in Fig. 1.1.


    # ## OVERVIEW OF A COMPUTER SYSTEM


    All physical parts of the computer (or everything that we can touch) are known
    as hardware. All of the components of a computer system can be summarized with
    the simple equations below:


    Computer System # Hardware + Software


    Software gives “intelligence” to the computer.


    Hardware # Internal devices + Peripheral devices


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Basically all computers, regardless of their size, have the same general design
    which consists of the following units: the central processing unit (CPU), memory,
    and the input/output circuitry which are situated on the **printed circuit board**,
    also called the **system board or motherboard**.


    Figure 1.2 describes the relationships between the components of the computer
    system. Pictorially the computer system may be represented as shown in Fig. 1.3.
    The block diagram of the computer system is represented as shown in Fig. 1.4.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_15_0.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_15_1.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_15_2.png)


    # Data


    Data in computer terminology means raw facts and figures. In computing, data is
    information that has been translated into a form that is more convenient to move
    or process. Relative to today''s computers and transmission media, data is information
    converted into binary digital form.


    For example, Manish, 1978, ‘B’, −163.89, +75.2 are data because here the format
    is not given.


    # Information


    After processing data we get meaningful information, therefore information is
    the result of processing, manipulating and organizing data in a way that adds
    to the knowledge of the receiver. In other words, it is the context in which data
    is interpreted.


    # BASIC APPLICATIONS OF A COMPUTER SYSTEM


    In the 1950s, computers were giant, special-purpose machines that were used by
    huge institutions like government and universities and they were used for performing
    complex numerical tasks such as calculating the precise orbit of Mars or planning
    the trajectories of missiles, etc. In the 1960s, business world started using
    computers for commercial purposes. In the 1970s, the invention of personal computer
    revolutionized the world and today computers are being used in nearly every field
    of life.


    # IMPORTANT TERMS RELATED TO COMPUTER


    A computer is used essentially as a data processor. The terms data and information
    are very commonly used. You must clearly understand the difference between the
    two.


    The following are the basic areas of computer’s applications:


    +   - Business and corporate computing

    +   - Weather forecasting

    +   - Medicines and health care'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   - Communications

    +   - Education and reference

    +   - Entertainment

    +   - Computer-aided manufacturing

    +   - Computer-aided design

    +   - Accounting


    Today computers are capable of exchanging information over the Internet. You can
    send a message from your computer to the computer of a neighbour or that of a
    friend on the other side of the planet. Students can use computers to communicate
    with their classmates to perform homework assignments, group projects, or other
    school-related activities. They may also use them to submit homework assignments
    and presentations to their teachers.


    # ## Computers in Business and Corporate Computing


    Corporate computing has revolutionized the business environment with the assistance
    of the computer that perform many time-consuming, complex tasks such as accounting,
    inventory control, customer databases, shipping control, and financial analysis.
    Today''s desktop computers are versatile and relatively inexpensive. Networking
    of all the company''s desktop computers allows access to and storage of the full
    range of company resources and information, reducing paper-work and increasing
    the productive flow of information.


    # ## Weather Forecasting


    Before a forecast can be made of what the weather is likely to be in the future,
    knowledge of the present situation is essential. Therefore, regular, reliable
    and accurate measurements are required. These have to be rapidly sent around the
    world using a telecommunications system dedicated to weather information. The
    observations are fed into the computer and used to analyze the weather patterns
    at a particular time. Once the analysis has been carried out, the computer produces
    a forecast of the weather for specified times in the future. The forecaster uses
    the output from the computer to produce weather forecasts that are tailored to
    a wide range of customers.


    # ## Education and Reference


    Computers are effectively used in classrooms as an interactive learning pool.
    In libraries, people can directly read magazines and journals directly from a
    computer terminal. They do not need to search the shelves for paper originals.
    Nowadays, online learning and training is possible through networks. A student
    sitting at home can speak to his/her teacher and get response for his/her queries.
    Virtual classrooms are a reality these days.


    # ## Medicine and Health Care


    The role of computers in medicine, use of computers in health care and importance
    of computers in medicine fields. Computers are being used today to diagnose diseases.


    # ## Communications


    Computers can be effectively used for communicating to different parts of the
    world.


    # ## Entertainment


    In today''s electronic era, computers have a hand in almost everything. Entertainment
    is no exception in fact, with the coming of digital information entertainment
    has made one of its greatest leaps. Movies, games, music, even books have been
    impacted greatly by computers. With the coming of DVDs (Digital video disks),
    computers have moved into a big portion of the video industry. But with it has
    come the ability to take a movie off of the disk and distribute it over user sharing
    programs. Many companies have tried to solve this problem by adding programs and
    such to the disks so that the information cannot be stolen.


    # ## Computer-aided Manufacturing


    Computer-aided manufacturing (CAM) is the use of computer-based software tools
    that assist engineers and machinists in manufacturing or prototyping product components.
    CAM is a programming tool that allows you to make 3D models using computer-aided
    design (CAD). CAM was first used in 1971 for car body design and tooling.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Computer-aided Design


    Computer-aided design (CAD) is the use of computer technology to aid in the design
    of a product. Current packages range from 2D vector base drafting systems to 3D
    solid and surface modelers.


    # Accounting


    Computers play an important part in the recording of financial information. There
    are many accounting packages available and so businesses are able to use computerized
    accounting systems. A computerized accounting system provides the same functions
    as a manual accounting system. Most businesses therefore use computer systems
    instead of manual systems to record financial information, because a lot faster
    files can be shared more easily and changes made more conveniently.


    # CHARACTERISTICS OF COMPUTER


    Let us now identify the major characteristics of the computer. These can be discussed
    under the headings of speed, accuracy, diligence, versatility and memory.


    # Speed


    As you know computer can work very fast. It takes only a few seconds for calculations
    that we take hours to complete. Suppose you are asked to calculate the average
    monthly income of one thousand persons. For this you have to add income from all
    sources for all persons on a day to day basis and find out the monthly average
    for each one of them. How long will it take for you to do this? One day, two days
    or one week? But your small computer can finish this work in a few seconds? The
    weather forecasting that you see everyday on the TV is the result of compilation
    and analysis of huge amount of data on temperature, humidity, pressure, etc. of
    various places. It takes only a few minutes for the computer to process this huge
    amount of data and give the result.


    You will be surprised to know that the computer can perform millions (1,000,000)
    of instructions and even more per second.


    Therefore, we determine the speed of computer in terms of microsecond (10⁻⁶ part
    of a second) or nano-second (10⁻⁹ part of a second). From this you can imagine
    how fast the computer performs work.


    # Accuracy


    Suppose someone calculates faster but commits a lot of errors in computing. Such
    result is useless. There is another aspect. Suppose you want to divide 15 by 7.
    You may work out up to 2 decimal places and say the dividend is 2.14. Another
    person may calculate up to 4 decimal places and say that the result is 2.1428.
    Someone else may go up to 9 decimal places and say the result is 2.142857143.
    Hence, in addition to speed, the computer should have accuracy or correctness
    in computing.


    The degree of accuracy of computer is very high and every calculation is performed
    with the same accuracy. The accuracy level is determined on the basis of design
    of computer. The errors in computer occur only due to human mistake and inaccurate
    data.


    # Diligence


    A computer is free from tiredness, lack of concentration, fatigue, etc. It can
    work for hours without committing any error. If millions of calculations are to
    be performed, a computer will perform every calculation with the same accuracy.
    Due to this capability it overpowers human beings in routine type of work.


    # Versatility


    It means the capacity to perform completely different types of work. You may use
    your computer to prepare payroll slips. Next moment it may be used for inventory
    management or to prepare electricity bills.


    # Power of Remembering


    Computer has the power of storing any amount of information or data. Any information
    can be stored and recalled as long as you require it, for any numbers of years.
    It depends entirely upon you how much data you want to store in a computer and
    when to lose or retrieve these data.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# No IQ


    Computer is a dumb machine and it cannot do any work without instructions from
    the user. It performs the instructions at tremendous speed and with accuracy.
    It is for you to decide what you want to do and in what sequence. So a computer
    cannot take its own decisions as you can.


    # Feeling


    Computer does not have feelings or emotions, taste, knowledge and experience.
    Thus, it does not get tired even after long hours of work. It does not distinguish
    between users.


    # Storage


    The computer has an in-built memory where it can store a large amount of data.
    You can also store data in secondary storage devices such as disks, which can
    be kept outside your computer and can be carried to other computers.


    # FUNCTIONAL COMPONENTS OF A COMPUTER SYSTEM


    Computer systems ranging from a controller in a microwave oven to a large supercomputer
    contain components providing five functions. A typical personal computer has hard,
    and CD-ROM disks for storage, memory and CPU chips inside the system unit, a keyboard
    and mouse for input, and a display, printer and speakers for output. The arrows
    in Fig. 1.5 represent the direction of information flows between the functional
    units.


    Graphically it is represented as follows:


    The components of a computer system can be divided into three different units:


    +   - Input unit

    +   - Processing unit

    +   - Output unit


    The input unit of a computer system is responsible for input phase, CPU for process
    phase and output unit for output phase.


    Now let us discuss the functioning of each unit one by one.


    # The Input Unit


    The input unit deals with how to take the input from the user. Any machine that
    feeds data into a computer, for example, a keyboard is an input device, whereas
    a display monitor is an output device. Input devices other than the keyboard are
    sometimes called *alternate input devices*. Mouse, trackballs, and light pens
    are all alternate input devices. Input devices are the devices that connect you
    to your computer. Input devices let you input data and other information into
    your computer and they also let you give your computer special instructions so
    that it will know what to do. For example, you can type in data by using a keyboard,
    or you can input data in picture form by using a scanner.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_18_0.png)


    # *Keyboard*


    Keyboard is one of the most important input devices for a computer. They serve
    as your primary means of communication with your computer. Keyboards are a type
    of keypad similar to a typewriter with a set of keys that you press to input data
    into your computer.


    Most keyboards have an ASCII (American Standard Code for Information Interchange)
    layout. This layout includes a numeric keypad, special function keys, special
    control keys, as well as typing keys.


    # *Typing keys*


    The typing keys are just the keys containing the twenty-six letters of the alphabet.
    These keys have a QWERTY setup. QWERTY stands for the first six letters in the
    top row of the standard letter keys, and was first designed by American Christopher
    Sholes in 1890. It was designed so that the most commonly used letters would not
    be near each other. This is to prevent people to type too fast, because fast typing
    often results in keyboard jamming. Of course, jamming is no longer a problem today,'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'but as most people are already accustomed to the QWERTY keyboard, there has
    been no necessity to change it.


    # Numeric keypad


    The numeric keypad is the group of 17 keys on the very right of your keyboard.
    It includes all of the numbers from 0–9, a plus sign, a minus sign, and a few
    other keys. If you look closely, you will realize that the arrangement of the
    keys on a numeric keypad on your keyboard is quite similar to the arrangement
    of the keys on a calculator! Because many computers are used for business purposes
    and to input numbers into a computer, the numeric keypad was designed. This made
    it easier and faster to input numbers.


    # Function keys


    The function keys can be found in a row at the very top of your keyboard. They
    are labeled “F1,” “F2,” “F3,” all the way up to “F12.” These function keys are
    mainly used to simplify the use of applications. They perform special commands,
    depending on which application is open. For example, pressing F7 in a word document
    opens the spell check. In almost all applications, pressing F1 opens a help menu.
    Also, the function keys can be combined with other keys, like the control keys
    to perform different tasks!


    # Control keys


    The control keys are special keys like del (delete), ctrl (control), alt (alternate),
    shift, and enter. The delete (or backspace) key is used to erase characters in
    a word document. The esc (escape) key is generally used to exit out of a program
    or application, while when you strike the enter key, a function or command is
    carried out. The tab key is primarily used to indent in a word document. The shift
    key is often used in conjunction with other keys. For example, pressing shift
    and then a letter will make that letter capital, while pressing shift and a number
    will display the character shown right above that number. Finally, there are the
    ctrl and alt keys. Like the shift key, these are also used in conjunction with
    other keys, and they usually perform functions similar to those of the function
    keys. There


    are also the cursor movement keys. These are the arrows, shaped like an inverted
    T located between the typing keys and the numeric keypad. These keys are used
    to move the cursor around on your screen. For example, if you were in a word document,
    the blinking cursor will move up and down to different lines if you press the
    up and down cursor movement keys.


    # Working of a keyboard


    The following steps explain how the keyboard works when we press any key on the
    keyboard.


    +   1. You press the “a” key on the keyboard.

    +   2. The keyboard sends an electrical signal to the central processing unit
    (CPU) telling it that a key was pressed.

    +   3. The CPU is almost ALWAYS busy. Thus the letter “a” is temporarily stored
    in a special memory cell until the CPU is ready to work with it.

    +   4. The keyboard controller tells the central processing unit that there is
    information waiting to be processed.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_19_0.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_19_1.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_19_2.png)'
