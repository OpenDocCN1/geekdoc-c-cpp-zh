    # FORMATTED CONSOLE I/O FUNCTIONS


    From the above figure we know that printf() and scanf() are the functions which
    exists in the category of Formatted Console I/O functions.


    These functions permit us to supply the input in a fixed format and let us obtain
    the output in the specified form.


    Now we will discuss these predefined functions one by one.


    # The printf() Function


    The standard library function *printf* is expended for formatted output. It builds
    the user input a string and an optional list of values or strings to output. The
    variables and strings are output grating to the specifications in the printf()
    function.


    The following are the important work that is done by printf() function.


    +   - Printf shows information on screen.

    +   - Printf gives the number of characters printed.


    +   - Printf shows the text you put inside the double quotes.

    +   - Printf needs the backslash character, an escape sequence, to display some
    special characters.

    +   - Printf can show variables by using the % conversion character.

    +   - Printf formats a string argument followed by any extra arguments.


    The general syntax of printf() function is as follows:

    printf ("format string", list of variables);


    Where the format string can contain:


    +   - Characters that are simply printed as they are

    +   - Conversion specifications that begin with a % sign

    +   - Escape sequences that begin with a \ sign


    The following table represents the format specifiers for the basic data types
    in C language.


    | Data type |  | Format specifier |

    |---|---|---|

    | Integer | short signed | %d or %i |

    |  | short unsigned | %u |

    |  | long signed | %1d |

    |  | long unsigned | %1u |

    |  | unsigned hexadecimal | %x |

    |  | unsigned octal | %o |

    | Real | float | %f |

    |  | double | %1f |

    | Character | signed character | %c |

    |  | unsigned character | %c |

    | String |  | %s |


    We can also provide following optional specifiers in the format specifications:


    - Minus sign for left excusing the output in the specified field width


    | Specifier | Description |

    |---|---|

    | dd | Digits specifying field width |

    | . | Decimal point breaking field width from precision (precision stands for
    the number of places after the decimal point) |

    | dd | Digits specifying precision |


    The explanations of these optional specifiers are as follows:


    The field width specifier assures printf() how many columns on screen should be
    used while printing a value.'
