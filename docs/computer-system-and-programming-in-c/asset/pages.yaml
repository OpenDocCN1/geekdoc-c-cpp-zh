  md: '![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_21_0.png)


    mechanical moving parts. They respond more quickly and precisely than mechanical
    and optomechanical mice, but they are also more expensive.


    Mouse connects to PCs in one of several ways:


    +   1. Serial mice connect directly to an RS-232C serial port or a PS/2 port.
    This is the simplest type of connection.

    +   2. PS/2 mice connect to a PS/2 port.

    +   3. USB mice.


    **Cordless mice** are not physically connected at all. Instead they rely on infrared
    or radio waves to communicate with the computer. Cordless mice are more expensive
    than both serial and bus mice, but they do eliminate the cord, which can sometimes
    get in the way.


    The picture of a mouse is depicted in Fig. 1.7.


