    # THE CONTINUE STATEMENT


    The **continue** statement is somewhat the opposite of the break statement. It
    forces the next iteration of the loop to take place, skipping any code in between
    itself and the test condition of the loop. In while and do-while loops, a continue
    statement will cause control to go directly to the test condition and then continue
    the looping process. In the case of the for loop, the increment part of the loop
    continues. One good use of continue is to


    restart a statement sequence when an error occurs.

    The *continue* statement ends the present iteration of a loop. Program control
    is agreed from the continue statement to the end of the loop body.

    The general syntax of continue statement is as follows:


    ```

    continue;

    ```


    The **continue** statement can only appear within the body of an iterative statement.

    The **continue** statement ends the dispensation of the action part of an iterative
    (*do, for,* or *while*) statement and moves control to the loop continuation portion
    of the statement. For example, if the iterative declaration is a *for* statement,
    control moves to the third expression in the condition part of the statement,
    then to the second expression (the test) in the condition part of the statement.

    Within nested statements, the **continue** instruction ends only the current iteration
    of the *do, for,* or *while* statement immediately enclosing it.


