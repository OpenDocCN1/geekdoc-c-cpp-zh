    # LOGICAL OPERATORS


    Logical operators in C, as with other computer languages, are used to evaluate
    expressions which may be true or false. Expressions which involve logical operations
    are evaluated and found to be one of two values: true or false. So far we have
    studied simple conditions. If we want to test multiple conditions in the process
    of making a decision, we have to perform simple tests in separate If statements
    (will be introduced in detail in the next chapter). C provides logical operators
    that may be used to form more complex conditions by combining simple conditions.


    In C language the following logical operators exists.


    | Operator | Meaning |

    |---|---|

    | `&&` | Logical AND |

    | `\|\|` | Logical OR |

    | `!` | Logical NOT |


    # NOT Operator !


    The Operator ! is the C operator to perform the Boolean operation NOT, it has
    only one operand, located at its right, and the only thing that it does is to
    inverse the value of it, producing


    false if its operand is true and true if its operand is false. Basically, it gives
    the opposite Boolean value of evaluating its operand.


    In C language NOT operator is represented by `!` Sign.


    The truth table of NOT operator is as follows:


    | $a$ | $!a$ |

    |---|---|

    | True | False |

    | False | True |


    The above table shows that NOT operator is used to converse the result.


    # Example


    ```

    ```text

    !(5 == 5) // measures to false because the expression (at its right (5 == 5) is
    true.

    !(6 < 4) // measures to true because (6 <= 4) would be false.

    !true // measures to false

    !false // measures to true.

    ```

    ```


    # AND Operator &&


    The logical operators `&&` and `||` are used when evaluating two expressions to
    obtain a single relational result. The operator `&&` corresponds with Boolean
    logical operation AND. This operation results true if both its two operands are
    true and false otherwise.


    The Truth table of AND operator is as follows:


    | $a$ | $b$ | $a \&\& b$ |

    |---|---|---|

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |


    The above table shows that if we impose the AND operator between two conditions
    then the result of the final condition is true when both the conditions are true.


