  md: 'Some of the examples of algebraic expressions and their C notation are given
    below.


    | Expression | C notation |

    |---|---|

    | $(a^3+bc)$ | $((a*a*a)+(b*c))$ |

    | $(a^2+cd)$ | $((a*a)+(c*d))$ |


    The arithmetic operators are all binary operators i.e. all the operators have
    two operands. The integer division yields the integer result. For example, the
    expression 10/3 evaluates to 3 and the expression 15/4 evaluates to 3. C provides
    the modulus operator, %, which yields the remainder after integer division. The
    modulus operator is an integer operator that can be used only with integer operands.
    The expression x%y yields the remainder after x is divided by y. Therefore, 10%3
    yields 1 and 15%4 yields 3. An attempt to divide by zero is undefined on computer
    system and generally results in a run-time error. Normally, arithmetic expressions
    in C are written in straight-line form. Thus ‘a divided by b’ is written as a/b.


    The operands in arithmetic expression can be of integer, float, double type. In
    order to effectively develop C programs, it will be necessary for you to understand
    the rules that are used for implicit conversation of floating point and integer
    values in C language.


    The rules are as follows:


    +   - An arithmetic operator between an integer and integer always yields an integer
    result.

    +   - Operator between float and float yields a float result.

    +   - Operator between integer and float yields a float result.


    If the data type is double instead of float, then we get a result of double data
    type.


    # Example


    | Operation | Result |

    |---|---:|

    | 7/3 | 2 |

    | 7.0/3 | 2.33 |

    | 7/3.0 | 2.33 |

    | 7.0/3.0 | 2.33 |


    Parentheses can be used in C expression in the same manner as algebraic expression.


    # Example


    b * (c + d).

    It may so happen that the type of the expression and the type of the variable
    on the left hand side of the assignment operator may not be same. In such a case
    the value for the expression is promoted or demoted depending on the type of the
    variable on left hand.

    side of = (assignment operator).


    # Example


    Consider the following assignment statements:

    int i;

    float b;

    i = 5.6;

    b = 30;

    In the first assignment in the first assignment statement, float (5.6) is demoted
    to int. Hence i gets the value 5. In the second statement int (30) is promoted
    to float, b gets 30.0.


    If we have a Complex expression like:

    float a, b, c;

    int s;

    s = a * b / 6.0 * c;

    Where the operands are integers and some are float, then it will be promoted or
    demoted depending on left hand side operator. In this case, type conversion will
    take place since s is an integer.


    # Rules of Arithmetic Precedence


    The rules of arithmetic precedence are as follows:


    +   1. Parentheses are at the “highest level of precedence”. In case of nested
    parentheses, the innermost parentheses are evaluated first.


    # Example


    If we have the following arithmetic expression

    ((4+5)*6)/7)

    The order of evaluation is given below

    ( ( (4+5) * 6) / 7 )


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_148_0.png)'
