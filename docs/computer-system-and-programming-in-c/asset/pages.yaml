    # #IFDEF AND #IFNDEF


    #ifdef and #ifndef are also a type of conditional compilation preprocessor but
    with a little twist. They work on #ifdef and #ifndef preprocessors and can be
    used in combination with #else and #elif preprocessor.


    #ifdef stands for if defined and #ifndef for if not defined. The condition they
    work on is whether a MACRO is defined or not defined. Code specified by #ifdef
    compiles if the following MACRO is defined while code specified by the #ifndef
    compiles if the following MACRO is not defined. Both the preprocessors use the
    preprocessor #endif to mark the end of the conditional compilation code.


    Both #ifdef and #ifndef can be nested similar to if-else statments. It is specified
    by standard C that any compiler conforming to standard C must provide a minimum
    of at least 8 levels of minimum nesting while C99 specifies that a maximum of
    63 levels of nesting must be supported.


    #ifdef can also be written as #if defined and both forms are equivalent.


