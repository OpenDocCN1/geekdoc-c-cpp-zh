  md: "on decrementing i = 1  \non decrementing i = 0\n\nThe explanation of the above\
    \ output is as follows:\n\nThe value of i is available to the functions `incre()`\
    \ and `decre()` since i has been declared outside all functions.\n\nLet us take\
    \ a look of the following program segment\n\n```\nint x = 120 ;\nvoid main( )\n\
    {\nextern int y;\nprintf ( \"\\n%d %d\", x, y ) ;\n}\nint y = 130 ;\n```\n\nHere,\
    \ x and y both are global variables. Since both of them have been defined outside\
    \ all the functions both enjoy external storage class.\n\nNote the difference\
    \ between the following:\n\n```\nextern int y ;\nint y = 130 ;\n```\n\nHere, the\
    \ first statement is a declaration, whereas the second is the definition. When\
    \ we declare a variable no space is reserved for it, whereas, when we define it\
    \ space gets reserved for it in memory. We had to declare y since it is being\
    \ used in `printf( )` before it’s definition is encountered. There was no need\
    \ to declare x since its definition is done before its usage. Also remember that\
    \ a variable can be declared several times but can be defined only once.\n\nNow\
    \ let us take a look of the following program segment and what is the output of\
    \ the following code segment\n\n```\nint x = 100;\nvoid main( )\n{\n    int x\
    \ = 200 ;\n    printf ( \"\\n%d\", x ) ;\n    display( ) ;\n}\nvoid display( )\n\
    {\n    printf ( \"\\n%d\", x ) ;\n}\n```\n\nThe output of the above code is as\
    \ follows:\n\n200\n100\n\nThe explanation of the above code segment is as follows:\n\
    \nHere x is defined at two places, once outside `main( )` and once inside it.\
    \ When the control reaches the `printf( )` in `main( )` which x gets printed?\
    \ Whenever such a conflict arises, it’s the local variable that gets preference\
    \ over the global variable. Hence the `printf( )` outputs 200. When `display(\
    \ )` is called and control reaches the `printf( )` there is no such conflict.\
    \ Hence this time the value of the global x, i.e. 100 gets printed.\n\n**A static\
    \ variable can also be declared outside all the functions.** For all practical\
    \ purposes it will be treated as an extern variable. However, **the scope of this\
    \ variable is limited to the same file in which it is declared.** This means that\
    \ the variable would not be available to any function that is defined in a file\
    \ other than the file in which the variable is defined.\n\n# *Static Storage Class*\n\
    \nThe following are the key points for the static storage class\n\n+   - As we\
    \ have seen, external variables have global scope across the entire program (provided\
    \ extern declarations are used in files other than where the variable is defined),\
    \ and have a lifetime over the entire program run.\n+   - Similarly, static storage\
    \ class provides a lifetime over the entire program; however, it provides a way\
    \ to limit the scope of such variables, and static storage class is declared with\
    \ the keyword static as the class specifier when the variable is defined.\n+ \
    \  - These variables are **automatically initialized to zero** upon memory allocation\
    \ just as external variables are. Static storage class can be specified for automatic\
    \ as well as external variables such as:\n+   \n+     `static extern var;`\n+\
    \   - Static automatic variables continue to exist even after the block in which\
    \ they are defined terminates. Thus, the value of a static variable in a function\
    \ is retained between repeated function calls to the same function."
