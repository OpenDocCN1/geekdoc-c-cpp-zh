- pgno: 6
  md: '# Preface


    Technological advancements have shown a substantial growth concerned with each
    and every field. This has aroused the need to learn computer concepts with the
    use of programming methodologies. Personal computers, once predicted to be owned
    by only a few individuals, are now everywhere. Practical advances in computer
    technology revolve around the increased ability of computers to manage specific
    tasks. This is achieved through the increased processing power of computer. Concepts
    of computer programming help in understanding the problem and finding the suitable
    solution.


    Efforts are made in order to introduce the students with computer programming
    concepts, taking C language as the medium. The book lays emphasis on foundations
    and basic principles and concepts of computer programming. Beginning with very
    elementary concepts related to computer fundamentals and operating system, students
    will be presented with detailed discussions on a variety of programming constructs
    and features of the C language.


    The various concepts are arranged in different chapters providing detailed description
    of the topic. This book constitutes 17 chapters, each revealing the basic and
    fundamental concept. No prior knowledge of computers and the programming language
    is needed.


    *Chapter 1* describes the various internal functional components like memory,
    CPU and other peripheral devices of computer along with the evolution and generation
    of computers.


    *Chapter 2* defines the term operating system and its functionality describing
    the various categories of it. It also gives a brief overview of DOS, Windows and
    UNIX operating system along with its commands.


    *Chapter 3* gives a brief overview about the fundamentals of programming methodologies
    like algorithm, flowchart, their complexities and various programming constructs
    along with programming languages like COBOL, Pascal, Java,etc.


    *Chapter 4* reveals the logic behind the various number system conversions, paying
    emphasis on binary numeration system which in turn describes the representation
    of numbers in computer memory.


    *Chapter 5* provides a brief introduction of the programming language C elaborating
    its history, features, various constructs, program structure and its uses.


    *Chapter 6* elaborates the concepts of variables, keywords and basic data types
    used in C language. Data types define the initial memory requirements of C variable.
    The chapter also explains the storage classes in C which determines the existence
    of a variable in memory.


    *Chapter 7* explains the syntax involved in constructing expressions using operators
    in C. This chapter discusses different types of operators required for performing
    various arithmetic and logical operations.


    *Chapter 8* defines the functions used in various input/output operations. The
    chapter focuses on some predefined functions involved in these operations.


    *Chapter 9* describes the way by which iterations/looping and decision control
    statements are used in C. It explains the basic control statements that are required
    by any procedural language.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '*Chapter 10* defines the term modular programming and explains the approach
    through which they are implemented. The concept of Functions lies at the center
    of this programming.


    *Chapter 11* gives an overview about an arrays and its classification. Arrays
    are entities that allocate memory non-dynamically.


    *Chapter 12* deals with the concept of string handling in C. The chapter focuses
    on their declarations and the various operations that can be done using some predefined
    string functions.


    *Chapter 13* describes the logic to declare user-defined data types such as structures
    and union. The chapter also elaborates the way they are declared and used in programming
    with help of various examples.


    *Chapter 14* focuses on the concept of pointers and how they can be used efficiently.
    The various peculiarities of the pointers are discussed in this chapter.


    *Chapter 15* deals with the allocation of memory dynamically. The chapter discusses
    various data structures and algorithms that are used in dynamic memory allocation.


    *Chapter 16* discusses some basic peculiarities involved with programming. The
    preprocessor directives are responsible for making the code manageable and maintainable
    so that they can be easily altered.


    *Chapter 17* elaborates the concepts of file handling using C programming.


    **Manish Varshney**

    **Neha Singh**'
  merge: -1
  img_proc: true
