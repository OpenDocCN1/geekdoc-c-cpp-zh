  md: '# 8


    # Input and Output

    Functions


    One of the essential operations performed in a C language programs is to provide
    input values to the program and output the data produced by the program to a standard
    output device. We can allot values to variable through assignment statements such
    as x = 5 a = 0 ; and so on. Another method acting is to use the input then scanf
    which can be used to read data from a keyboard. For outputting outcomes we have
    used extensive the function printf which sends out results out to a terminal.
    There exists several functions in ‘C’ language that can carry out input/output
    operations. These functions are conjointly known as standard input/output library.
    Each program that applies standard input/output function must contain the statement.
    # include < stdio.h > at the beginning.


    # TYPES OF INPUT/OUTPUT


    In C language input/output (I/O) functions can be classified into two major categories.


    # *Console I/O Function*


    With the help of Console I/O function we take the input from keyboard and write
    output to VDU (visual display unit).


    # *FILE I/O Function*


    With the help of FILE I/O function we take the input from the files and write
    output to VDU (visual display unit).


    In this chapter we only discuss the Console I/O Function and FILE I/O function
    was discussed in FILE HANDLING chapter.


    # CONSOLE I/O FUNCTION


    The screen and keyboard together are called a console. Console I/O functions can
    be further separated into two categories— formatted and unformatted console I/O
    functions. The basic difference between them is that the formatted functions allow
    the input read from keyboard or the output exposed on the VDU to be formatted
    as per our necessities. For example, if values of average marks and percentage
    marks are to be displayed on the screen, then the details like where this output
    would appear on the screen, how many spaces would be present between the two values,
    the number of places after the decimal points, etc. can be assured using formatted
    functions.


    Console I/O function can be classified in the following figure:


