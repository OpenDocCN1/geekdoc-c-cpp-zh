  md: "resources of the system such as memory and processor’s time. Algorithm is a\
    \ language independent, well structured and detailed. Algorithm enables the programmer\
    \ to translate the problem into a computer program using any high-level language.\n\
    \n# Criteria to be Followed by an Algorithm\n\nCriteria need to be satisfied by\
    \ an algorithm:\n\n+   (a) **Input:** There should be zero or more values which\
    \ are to be supplied.\n+   \n+   (b) **Output:** At least one result is to be\
    \ produced.\n+   \n+   (c) **Definiteness:** Each step must be clear and unambiguous.\n\
    +   \n+   (d) **Finiteness:** If we trace the steps of an algorithm, then for\
    \ all cases, the algorithm must terminate after a finite number of steps.\n+ \
    \  \n+   (e) **Effectiveness:** Each step must be sufficiently basic that a person\
    \ using only paper and pencil can in principle carry it out. Each step should\
    \ not only be definite, but also be feasible.\n\n# Features of Algorithm\n\nThe\
    \ following features must be present in any algorithm:\n\n# *Proper Understanding\
    \ of a Problem*\n\nProper understanding of a problem is a must for designing an\
    \ efficient algorithm. This is normally the outcome of the problem definition\
    \ phase.\n\n# *Use of Procedures/Functions to Emphasize Modularity*\n\nTo assist\
    \ the development, implementation and readability of the program, it is usually\
    \ helpful to modularize (section) the program. Independent functions perform specific\
    \ and well-defined tasks. In applying modularization, it is important to watch\
    \ that the process is not taken so far to a point at which the implementation\
    \ becomes difficult to read because of fragmentation. The program then can be\
    \ implemented as calls to the various procedures that will be needed in the final\
    \ implementations.\n\n# Choice of Variable Names\n\nProper variable names and\
    \ constant names can make the program more meaningful and easier to understand.\
    \ This practice tends to make the program more self documenting. A clear definition\
    \ of all variables and constants at the start of the procedure/algorithm can also\
    \ be helpful. For example, it is better to use variable day for the day of the\
    \ weeks, instead of the variable a or something else.\n\n# *Documentation of a\
    \ Program*\n\nBrief information about the segment of the code can be included\
    \ in the program to facilitate debugging and provide information. A related part\
    \ of the documentation is the information that the programmer presents to the\
    \ user during the execution of the program. Since the program is often used by\
    \ persons who are unfamiliar with the working and input requirements of the program,\
    \ proper documentation must be provided. That is, the program must specify what\
    \ responses are required from the user. Care should also be taken to avoid ambiguities\
    \ in these specifications. Also the program should “catch” incorrect responses\
    \ to its requests and inform the user in an appropriate manner.\n\n# Writing Algorithms\
    \ to Depict Logic\n\nWe have now understood what an algorithm is and what its\
    \ characteristics are. So write some algorithms for the following problems:\n\n\
    # Problem 1\n\nDesign an algorithm to input two numbers and then print the sum\
    \ of both the numbers.\n\n# Algorithm\n\n+   1. Start\n+   2. Input a and b\n\
    +   3. Set c = a + b\n+   4. Print c\n+   5. End\n\n# Problem 2\n\nDesign an algorithm\
    \ to input two numbers and then print the greater of the two numbers."
