    # ASCII CODE


    It is a very well-known fact that computers can manage internally only 0s (zeros)
    and 1s (ones). This is true, and by intends of sequences of 0s and 1s the computer
    can express any numerical value as its binary translation, which is a very simple
    mathematical operation.


    However, there'' is no such evident way to represent letters and other non-numeric
    characters with 0s and 1s. Hence, in order to do that, computing device use *ASCII
    tables*, which are tables or lists that comprise all the letters in the roman
    alphabet plus some additional characters. In these tables each character is ever
    constituted by the same order number. For example, the ASCII code for the capital
    letter “A” is always represented by the order number 65, which is easily representable
    using 0s and 1s in binary: 65 expressed as a binary number is 1000001.


    The standard ASCII table defines 128 character codes (from 0 to 127), of which,
    the first 32 are control codes (non-printable), and the remaining 96 character
    codes are representable characters.


    Because most systems nowadays work with 8 bit bytes, which can represent 256 different
    values, in addition to the 128 standard ASCII codes there are other 128 that are
    known as *extended ASCII*, which are platform- and locale-dependent. So there
    is more than one extended ASCII character set.


    # EBCDIC


    EBCDIC (Extended Binary Coded Decimal Interchange Code) is a binary code for alphabetic
    and numeric characters that IBM developed for its larger operating systems. It
    is the code for text files that is used in IBM’s OS/390 operating system for its
    S/390 servers and that thousands of corporations use for


