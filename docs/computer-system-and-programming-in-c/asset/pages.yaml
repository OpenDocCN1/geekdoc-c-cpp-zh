    # SCOPE RULES


    The scope of a variable refers to that part of the program where the variable
    is accessible. There are two scope rules governing the scope of variables (and
    symbols):


    +   - *The scope of a variable is the codeblock in which it is defined*, i.e.
    a variable is only valid within the block in which it is defined.

    +   - *If two variables by the same name are defined in a block, then the closest
    declaration counts and hides the original variable.*


    # Global variables


    Global variables are variables whose scope is the entire program. That means that
    they must be defined outside any function, typically at the top of the program.
    *Every function can access and change a global variable. Avoid using global variables
    without good reason.*


    If we define the variable outside of the main program then that variable is known
    as global variable and this variable can be access any where in the program.


    # Example


    ```

    int a=34;

    void main()

