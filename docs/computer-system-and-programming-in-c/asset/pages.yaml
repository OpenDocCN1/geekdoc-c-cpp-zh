    Fig. 1.15: Joystick


    # Joystick


    The joystick is a rotary lever. Similar to an aircraft’s control stick, it enables
    you to move within the screen’s environment, and is widely used in the computer
    games industry. The picture of a joystick is shown in Fig. 1.15.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_24_2.png)


    Fig. 1.16: Digitizing tablet


    # Digitizing Tablet


    A digitizing tablet is a pointing device that facilitates the accurate input of
    drawings and designs. A drawing can be placed directly on the tablet, and the
    user traces outlines or inputs coordinate positions with a hand-held stylus. The
    picture of a digitizing tablet is shown in Fig. 1.16.


    computer by touching the screen. There are three forms of touch screen: pressure-sensitive,
    capacitive surface and light beam. The picture of a touch sensitive screen is
    shown in Fig. 1.17.


    # Space Mouse


    The space mouse is different from a normal mouse as it has an X axis, a Y axis
    and a Z axis. It can be used for developing and moving around 3-D environments.
    The picture of a space mouse is shown in Fig. 1.18.'
