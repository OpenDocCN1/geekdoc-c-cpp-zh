- pgno: 68
  md: '+   - **Removable Disk:** A removable disk can be any number of portable media
    from ZIP disks to USB thumb drives.


    # Search for Files and Folders


    This utility allows a user to search for files on the computer. To open the search
    window, go to start, then search, then files and folders.


    +   - **Search For:** The name of the file a user is trying to locate goes here.

    +   - **Look In:** The location the file may be in. The utility will also search
    all subfolders in a given location.

    +   - **Start Over:** Clears the search results.

    +   - **Search Now:** Begins the search.

    +   - **Also Search By:** Adds more filtering to the search results. For example,
    if the date when the file was created or last modified is known, then a user can
    check the date box and input a date or date range.


    There are some wildcard characters available to help narrow a search down.


    +   - **The asterisk (*)** can be included in a file name as a substitution for
    zero or more characters. For example, if a user typed `tax_return_*` then the
    results would be `tax_return_1998`, `tax_return_1999`, `tax_return_2000`, and
    so on.

    +   - **The Question Mark (?)** can be included in a file name as a substitution
    for a single character. For example, the search `tax_return_200?` would return
    the files `tax_return_2000`, `tax_return_2001`, `tax_return_2002`, and so on.


    # System tray


    The system tray is located in the bottom right hand corner of the screen. The
    system tray holds a clock and other icons for programs currently running on the
    system. Typically right or left clicking on these icons displays some options
    for interacting with the given program.


    Graphically the system tray is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_68_0.png)


    # The System Tray


    # Control Panel


    The control panel is the main configuration of settings for a computer. To get
    to the control panel, go to start, then settings, then control panels. There are
    a number of icons for each control. Some of the controls adjust sensitive settings
    in the system and others adjust how input devices like the mouse and keyboard
    work. Here is a list of some of the basic settings.


    +   - **Add/Remove Programs:** This is the control panel to use in order to properly
    remove software from a computer. It is important not to just delete a program
    because there are other system entries that are made when a program is installed
    and do not get removed when a program is simply deleted.

    +   - **Date/Time:** The control panel to set the date and time of the computer.

    +   - **Keyboard:** The control panel for keyboard settings such as the rate the
    cursor blinks when typing.

    +   - **Mouse:** The control panel for mouse settings such as double click speed.
    This control panel may be different for each machine depending on the type of
    mouse.

    +   - **Regional Options:** This control panel has settings such as what type
    of currency to use, or how numbers should be displayed.


    Graphically the control panel is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_68_1.png)'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# ## Windows Explorer


    Windows Explorer is a file management tool available in Microsoft Windows. You
    can use Windows Explorer to see all the resources available on your computer.


    # *To Start Explorer*


    Click the **Start** button, point to **Programs** then **Accessories**, and then
    click **Windows Explorer**.


    # *Other Methods of Starting Explorer*


    The following are the other methods to start the Explorer:


    +   - Right-click the Start button and then click Explorer.

    +   - Right-click the My Computer icon, then click Explorer.

    +   - Hold the “windows” key + e


    # *Windows Management Tools and Helpful Hints*


    The Explorer Windows is graphically represented as follows:


    # ## The Menu Bar


    The **Menu Bar** of the Explorer window gives access to all the commands available
    with Explorer. To see a description of what each menu command does, point and
    click on a command then rest your mouse pointer over it. Information about the
    command appears in the status bar at the bottom of the window. (Note: If the status
    bar is not displayed, click the **View** menu, and then click the **Status Bar**
    command.) Slide the pointer over other commands and sub-commands to see more descriptions.


    The main area of the Explorer window is divided into two panes.


    +   - The left pane is labeled *All Folders*. You will see all drives available
    to you, and the folders within the drives.

    +   - The right pane of Windows Explorer shows the *Contents* of the drive or
    folder that is selected in the left pane. Your documents and programs are stored
    in


    # ### The Explorer Window


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_69_0.png)'
