  md: '# Double Word


    A double word is exactly what its name implies, a pair of words. Therefore, a
    double word quantity is 32 bits long.


    # Kilo Byte


    In decimal systems, kilo stands for 1,000, but in binary systems, a kilo is 1,024
    (2¹⁰). Technically, so a kilobyte is 1,024 bytes, but it is often used loosely
    as a synonym for 1,000 bytes. For example, a computer that has 256 K main memory
    can store about 256,000 bytes (or characters) in memory at one time.


    A megabyte is 2²⁰ (approximately 1 million) and a gigabyte is 2³⁰ power (approximately
    1 billion).


    In computer literature, kilobyte is usually shortened as K or Kb. To distinguish
    between a decimal K (1,000) and a binary K (1,024), the IEEE has proposed following
    the convention of using a small k for a decimal kilo and a capital K for a binary
    kilo, but this convention is by no means strictly followed.


    # Mega Byte


    In decimal systems, the prefix mega means one million, but in binary systems,
    mega stands for 2²⁰ or 1,048,576. One megabyte, therefore, is either 1,000,000
    or 1,048,576 bytes (this is equivalent to 1,024 K), depending on the context.


    # Giga Byte


    1024 megabyte contains one gigabyte.


    # Tera Byte


    A terabyte is 2⁴⁰ or 1,099,511,627,776 bytes. It can be guessed as 10 to the 12th
    power, or 1,000,000,000,000 bytes. A terabyte is 1,024 gigabytes and comes before
    the petabyte unit of measurement. While today’s consumer hard drives are typically
    measured in gigabytes, Web servers and file servers may have several terabytes
    of space. A single 500 GB hard drive can also be predicted a half-terabyte drive.


    # INTRODUCTION TO PROGRAMMING


