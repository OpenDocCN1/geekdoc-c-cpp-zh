  md: '# # 17 File Handling in C


    The examples we have seen so far in the previous chapters deal with standard input
    and output. When data is stored using variables, the data is lost when the program
    exits unless something is done to save it. This chapter discusses methods of working
    with files, and a data structure to store data. C views file simply as a sequential
    stream of bytes. Each file ends either with an end-of-file marker or at a specified
    byte number recorded in a system maintained, administrative data structure. C
    supports two types of files called *binary files* and text files.


    The difference between these two files is in terms of storage. In text files,
    everything is stored in terms of text, i.e. even if we store an integer 54; it
    will be stored as a 3-byte string—"54\\0". In a text file certain character translations
    may occur. For example a *new line* (\n) character may be converted to a carriage
    return, linefeed pair. This is what Turbo C does. Therefore, there may not be
    one to one relationship between the characters that are read or written and those
    in the external device. A *binary file* contains data that was written in the
    same format used to store internally in the main memory.


    For example, the integer value 1245 will be stored in 2 bytes depending on the
    machine while it will require 5 bytes in a text file. The fact that a numeric
    value is in a standard length makes binary files easier to handle. No special
    string to numeric conversions is necessary.


    The disk I/O in C is accomplished through the use of library functions. The ANSI
    standard, which is followed by Turbo C, defines one complete set of I/O functions.


    But since originally C was written for the UNIX operating system, UNIX standard
    defines a second system of routines that handles I/O operations. The first method,
    defined by both standards, is called a buffered file system. The second is the
    unbuffered file system.


    In this chapter, we will first discuss buffered file functions and then the unbuffered
    file functions in the following sections.


    # ## FILE


    Abstractly, a file is a collection of bytes stored on a secondary storage device,
    which is generally a disk of some kind. The collection of bytes may be translated,
    for example, as characters, words, lines, paragraphs and pages from a textual
    document; fields and records belonging to a database; or pixels from a graphical
    image. The meaning accompanying a particular file is determined entirely by the
    data structures and operations used by a program to process the file. It is conceivable
    (and it sometimes happens) that a graphics file will be read and displayed by
    a program designed to process textual data. The result is that no significant
    output occurs (probably) and this is to be expected. A file is simply a machine
    readable storage media where programs and data are stored for machine usage.


    # ## CLASSIFICATION OF FILE


    Essentially there are two kinds of files that programmers deal with text files
    and binary files.'
