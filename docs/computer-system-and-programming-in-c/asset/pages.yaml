    +   2. Now write down the remainder (in hexadecimal).

    +   3. Divide the result once again by 16. Handle the division as an integer division.

    +   4. Repeat step 2 and 3 until the result is 0.

    +   5. The hex value is the digit sequence of the remainders from the top to bottom.


