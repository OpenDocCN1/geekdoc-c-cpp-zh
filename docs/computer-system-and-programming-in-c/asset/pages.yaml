    # WAYS TO SORT ARRAYS


    There are literally hundreds of different ways to sort arrays. The basic goal
    of each of these methods is the same: to compare each array element to another
    array element and swap them if they are in the wrong position. The bubble sort
    is one of the easiest algorithms to understand and we will begin our investigation
    with this sort.


    # Bubble Sort


    **Bubble sort** is a simple sorting algorithm. It works by repeatedly stepping
    through the list to be sorted, comparing two items at a time and swapping them
    if they are in the wrong order. The pass through the list is repeated until no
    swaps are needed, which indicates that the list is sorted. The algorithm gets
    its name from the way smaller elements “bubble” to the top of the list. Because
    it only uses comparisons to operate on elements, it is a comparison sort.


    string values, alphabetical order may be needed (which is actually ascending order
    using ASCII values).


    The process of sorting an array requires the exchanging of values. While this
    seems to be a simple process, a computer must be careful that no values are lost
    during this exchange. Consider the following dilemma:


    Suppose that grade[1] = 10 and grade[2] = 8 and you want to exchange their values
    so that grade[1] = 8 and grade[2] = 10. You could NOT just do this:


    `grade[1] = grade[2];`

    `grade[2] = grade[1]; // DOES NOT WORK!!!`


    In the first step, the value stored in grade[1] is erased and replaced with grade[2].
    The result is that both grade[1] and grade[2] now have the same value. Oops! Then
    what happened to the value in grade[1]? It is lost!!!


    In order to swap two values, you must use a **third variable**, (a “temporary
    holding variable”), to temporarily hold the value you do not want to lose:


    **// swapping variables**

    `temp = grade[1]; // holding variable`

    `grade[1] = grade[2];`

    `grade[2] = temp;`


    Bubble sorting is a simple sorting technique in sorting algorithm. In bubble sorting
    algorithm, we arrange the elements of the list by forming pairs of adjacent elements.
    It means we repeatedly step through the list which we want to sort, compare two
    items at a time and swap them if they are not in the right order. Another way
    to visualize the bubble sort algorithm is as its name, the smaller element bubble
    to the top. Here is the source code implements bubble sorting algorithm in C which
    sorts an unordered list of integer.


    The following program implements the concept of bubble sort for an array.


    ```

    #include <stdio.h>

    #include <stdlib.h>

    void swap(int *x,int *y)

    {

    int temp;

    temp = *x;

    *x = *y;

    *y = temp;

    }

    ```'
