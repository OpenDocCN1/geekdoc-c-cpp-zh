    # PROBLEM-SOLVING TECHNIQUES


    Problem-solving is a creative process which defines systematization and mechanization.
    There are a number of steps that can be taken to raise the level of one’s performance
    in problem solving.


    # Steps for Problem-Solving


    A problem-solving technique usually comprises the following steps to find the
    solution.


    # *Problem Definition Phase*


    The success in solving any problem lies in first fully understanding the problem.
    We cannot hope to solve a problem which we do not understand. So, the problem
    understanding is the first step towards the solution of the problem. It is *what
    must be done* rather than *how is it to be done*. We have to define the set of
    task required to be performed to solve the problem.


    # *Getting Started on a Problem*


    There are many ways of solving a problem and there may be several solutions. So,
    it is


    difficult to recognize immediately which path could be more productive. Sometimes
    you do not have any idea where to begin solving a problem, even if the problem
    has been defined. Such block sometimes occurs because you are overly concerned
    with the details of the implementation even before you have completely understood
    or worked out a solution. The best advice is not to get concerned with the details.
    Those can come later when the intricacies of the problem have been understood.


    # *The Use of Specific Examples*


    To get started on a problem, we can make use of heuristics i.e., the guidelines.
    This approach will allow us to start on the problem by picking a specific problem
    we wish to solve and try to work out the mechanism that will allow solving this
    particular problem. It is usually much easier to work out the details of a solution
    to a specific problem because the relationship between the mechanism and the problem
    is more clearly defined. This approach of focusing on a particular problem'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'can give us the foothold we need for making a start on the solution to the
    general problem.


    # *Similarities among Problems*


    One way to make a start is by considering a specific example. Another approach
    is to bring the experience to bear on the current problem. So, it is important
    to see if there are any similarities between the current problem and the past
    problems which we have solved. The more experience one has the more tools and
    techniques one can bring to bear in tackling the given problem. But sometimes,
    it blocks us from discovering a desirable or better solution to the problem. A
    skill that is important to try to develop in problem-solving is the ability to
    view a problem from a variety of angles. One must be able to metaphorically turn
    a problem upside down, inside out, sideways, backwards, forwards and so on. Once
    one has developed this skill it should be possible to get started on any problem.


    # *Working Backwards from the Solution*


    In some cases we can assume that we already have the solution to the problem and
    then try to work backwards to the starting point. Even a guess at the solution
    to the problem may be enough to give us a foothold to start on the problem. We
    can systematize the investigations and avoid duplicate efforts by writing down
    the various steps taken and explorations made. Another practice that helps to
    develop the problem solving skills is, once we have solved a problem, to consciously
    reflect back on the way we went about discovering the solution.


    # Using Computer as a Problem-Solving Tool


    The computer is a resource—a versatile tool—that can help you solve some of the
    problems that you encounter. A computer is a very commanding general-purpose tool.
    Computers can solve or help to solve many types of problems. There are also many
    ways in which a computing device can enhance the effectiveness of the time and
    effort that you are willing to devote to solving a problem. Thus, it will prove
    to be well worth the time and cause you spend to learn how to make effective use
    of this tool. In this section, we


    discuss the steps involved in developing a program. Program development is a multi-step
    process that requires you to understand the problem, develop a solution, write
    the program, and then test it. This critical process determines the overall quality
    and success of your program. If you carefully design each program using good structured
    development techniques, your programs will be efficient, error free, and easy
    to maintain.


    The following are the steps by which we can solve any problem with the help of
    a computer system.


    +   1. Develop an algorithmic program and a flow chart

    +   2. Write the program in a computer language (for example, say C programming
    language)

    +   3. Enter the program using some editor

    +   4. Test and correct the computer program

    +   5. Run the program, input data, and get the outcomes.


    # DESIGN OF ALGORITHM


    The first step in the program development is to devise and describe a precise
    plan of what you want the computer to do. This plan, showed as a sequence of operations,
    is called an algorithm. An algorithm is just an outline or idea behind a program
    something resembling C, but with some statements in english rather than the programming
    language. It is then expected that each pseudo code ( ) statement would be translated
    to a small number of lines of actual code, easily and mechanically.


    # Algorithm Definition


    An algorithm is a finite set of steps defining the solution of a particular problem.
    An algorithm is expressed in pseudo code—something resembling C language, but
    with some statements in english rather than in the programming language. Developing
    an efficient algorithm needs a lot of practice and skill. It must be noted that
    an efficient algorithm is one which is capable of giving the solution to the problem
    by using minimum'
