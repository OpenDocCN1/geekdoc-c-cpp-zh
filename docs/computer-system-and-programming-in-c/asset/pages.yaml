  md: "# Daisywheel printer\n\nMolded metal characters like those in a typewriter\
    \ (Fig. 1.32) are mounted on extensions attached to a rotating wheel and are printed\
    \ onto the paper by means of a hammer and print ribbon. This results in a great\
    \ deal of movement and noise during the printing of documents, so printing is\
    \ slow (less than 90 cps). The standard of print is similar to that produced by\
    \ an electric typewriter. As the characters on the wheel are fixed, the size and\
    \ font can only be changed by using a different wheel. However, this is very rarely\
    \ done.\n\n![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_30_0.png)\n\n# *Non-impact\
    \ printer*\n\nNon-impact printers are much quieter than impact printers as their\
    \ printing heads do not strike the paper. Most non-impact printers produce dot-matrix\
    \ patterns. Several different technologies have been used to provide a variety\
    \ of printers. The main types of non-impact printer are as follows:\n\n+   (a)\
    \ Thermal printer  \n+   (b) Laser printer  \n+   (c) Inkjet printer\n\n**Thermal\
    \ printer:** In thermal printer, characters are formed by heated elements being\
    \ placed in contact with special heat sensitive paper forming darkened dots when\
    \ the elements reach a critical temperature. Thermal paper tends to darken over\
    \ time due to exposure to sunlight and heat. The standard of print produced is\
    \ poor. Thermal printers (Fig. 1.33) are widely used in battery powered equipment\
    \ such as portable calculators.\n\n![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_30_1.png)\n\
    \n**Laser printer:** Laser printers (Fig. 1.34) use a laser beam and dry powdered\
    \ ink to produce a fine dot matrix pattern. This method of printing can generate\
    \ about 4 pages of A4 paper per minute. The standard of print is very good and\
    \ laser printers can produce very good quality printed graphic images too. A photoconductive\
    \ drum is initially charged and then a high intensity laser beam is used to discharge\
    \ selected areas on the drum. These discharged areas correspond to the white\n\
    \n![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_30_2.png)"
