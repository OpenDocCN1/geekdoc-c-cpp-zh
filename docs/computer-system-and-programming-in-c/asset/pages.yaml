  md: '2. Multiplication, division and modulus operators are evaluated next. If an
    expression contains several multiplication, division and modulus operators, evaluation
    proceeds from left to right. These three are at the same level of precedence.


    # Example


    If we have the following arithmetic expression:


    `6*5+7*7`


    The order of evaluation is given below.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_149_0.png)


    Firstly 6*5 is evaluated then 7*7 is evaluated and then the result of 6*5 and
    7*7 is added.


    3. Addition, subtraction are evaluated last. If an expression contains several
    addition and subtraction operators, evaluation proceeds from left to right. Or
    the associativity is from left to right.


    # Example


    If we have the following arithmetic expression


    `9/5-7+5/2`


    The order of evaluation is as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_149_1.png)


    `9/5-7+5/2`


    **Example:** Determine the hierarchy of operations and evaluate the following
    expression:


    `k = 3 * 3 / 4 + 5 / 5 + 8 - 2 + 5 / 8`


    # Solution


    ```

    k = 9 / 4 + 5 / 5 + 8 − 2 + 5 / 8    operation: *

    k = 2 + 5 / 5 + 8 − 2 + 5 / 8    operation: /

    k = 2 + 1 + 8 − 2 + 5 / 8    operation: /

    k = 2 + 1 + 8 − 2 + 5        operation: /

    k = 2 + 1 + 8 − 2 + 0        operation: +

    k = 3 + 8 − 2 + 0            operation: +

    k = 11 − 2 + 0               operation: +

    k = 9 + 0                    operation: +

    k = 9                        operation: +

    ```


    # RELATIONAL OPERATORS


    In order to evaluate a comparison between two expressions we can use the relational
    and equality operators. The outcome of a relational operation is a Boolean value
    that can only be true or false, according to its Boolean result. We may want to
    equate two expressions, for example, to know if they are equal or if one is greater
    than the other. Here is a list of the relational and equality operators that can
    be used in C.


    The following are the relational operators:


    | Operator | Meaning |

    |---|---|

    | `==` | Equal to |

    | `!=` | Not equal to |

    | `>` | Greater than |

    | `<` | Less than |

    | `>=` | Greater than or equal to |

    | `<=` | Less than or equal to |


    The following table represents the relational operator, condition and the meaning
    of that operator.


    | Relational operator | Condition | Meaning |

    |---|---|---|

    | `==` | `x==y` | x is equal to y |

    | `!=` | `x!=y` | x is not equal to y |

    | `<` | `x<y` | x is less than y |

    | `<=` | `x<=y` | x is less than or equal to y |

    | `>` | `x>y` | x is greater than y |

    | `>=` | `x>=y` | x is greater than or equal to y |


    # Examples


    ```

    (7 == 5) // measures to false.

    (5 > 4)  // measures to true.

    (3 != 2) // measures to true.

    (6 >= 6) // measures to true.

    (5 < 5)  // measures to false.

    ```'
