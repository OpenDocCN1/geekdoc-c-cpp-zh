    # Usage of Programming Language


    Programming languages differ from most other forms of human expression in that
    they require a greater degree of precision and completeness. When using a natural
    language to communicate with other people, people can be ambiguous and make small
    errors, and still expect their intent to be understood. However, figuratively
    speaking, computers “do exactly what they are told to do”, and cannot “understand”
    what code the programmer intended to write. The combination of the language definition,
    a program, and the programmer’s inputs must fully specify the external behavior
    that occurs when the program is executed, within the domain of control of that
    program.


    Programs for a computer can be executed in a batch process without human interaction,
    or the programmer can use the programming language to write commands in an interactive
    session of an interpreter. “Commands” are simply single-line programs, whose execution
    may be chained together. When a language is used to give commands to a software
    application (such as a shell) it is called a scripting language.


    # Quality Requirements of Programming Language


    Whatever the approach to software development may be, the final program must satisfy
    some important fundamental properties such as.


    +   - **Efficiency:** The amount of system resources a program consumes (processor
    time, memory space, slow devices, network bandwidth and to some extent even user
    interaction), the more efficient it is.

    +   - **Reliability:** How often are the results of a program are correct? This
    depends on prevention of error propagation resulting from data conversion and
    prevention of errors resulting from buffer overflows, underflows, and zero division.

    +   - **Robustness:** How well does a program anticipates situations of data type
    conflict and other incompatibilities that result in run time errors and program
    halts? The focus is mainly on user interaction and the handling of exceptions.

    +   - **Usability:** The clarity and intuitiveness of a programs output can make
    or break its success. This involves a wide range of textual and graphical elements
    that makes a program easy and comfortable to use.

    +   - **Portability:** The range of hardware and OS platforms on which the source
    code of a program can be compiled and run. This depends mainly on the range of
    platform specific compilers for the language of the source code rather than anything
    having to do with the program directly.


