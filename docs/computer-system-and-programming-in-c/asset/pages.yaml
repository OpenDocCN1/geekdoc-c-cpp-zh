- pgno: 22
  md: '![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_22_0.png)


    user to move the unit across the paper. Trays are available that keep the scanner
    moving in a straight line. These scanners operate like flatbed scanners except
    that user has to move the scanner head (the part of a scanner responsible for
    scanning the image) in the place of some motorized machine. The images produced
    by these handheld scanners are not of very good quality. The picture of a handheld
    scanner is shown in Fig. 1.10.


    # Drum scanner


    A type of scanner used to capture the highest resolution from an image. Photographs
    and transparencies are taped, clamped or fitted into a clear cylinder (drum) that
    is spun at speeds exceeding 1000 rpm during the scanning operation. A light source
    that focuses on one pixel is beamed onto the drum and moves down the drum a line
    at a time. For transparencies, light is directed from the center of the cylinder.
    For opaque items, a reflective light source is used. Mirrors filter out the RGB
    values and send them to the drum scanner’s photomultiplier tube (PMT), which is
    more sensitive than the CCDs (charged-couple devices) used in flatbed and sheet-fed
    scanners and can produce resolutions exceeding 10,000 dpi. If one PMT is used,
    three passes across the image are required. When three PMTs are used, a faster
    single-pass scan is performed. Drum scanners can be used to produce very detailed
    graphics. The picture of a drum scanner is shown in Fig. 1.11.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_22_1.png)


    # Optical Character Recognition


    Optical character recognition (OCR) is the recognition of printed or written text
    characters by a computer. This involves photo scanning of the text character-by-character,
    analysis of the scanned-in image, and then translation of the character image
    into character codes, such as ASCII, commonly used in data processing. In OCR
    processing, the scanned-in image or bitmap is analyzed for light and dark areas
    in order to identify each alphabetic letter or numeric digit. When a character
    is recognized, it is converted into an ASCII code. Special circuit boards and
    computer chips designed expressly for OCR are used to speed up the


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_22_2.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'recognition process. OCR is being used by libraries to digitize and preserve
    their holdings. OCR is also used to process cheques and credit card slips and
    sort the mail. Billions of magazines and letters are sorted every day by OCR machines,
    considerably speeding up mail delivery. The picture of a OCR is shown in Fig.
    1.12.


    # Magnetic Ink Character Recognition


    Magnetic ink character recognition (MICR) is a character recognition system that
    uses special ink and characters. When a document that contains this ink needs
    to be read, it passes through a machine, which magnetizes the ink and then translates
    the magnetic information into characters.


    MICR technology is used by banks. Numbers and characters found at the bottom of
    cheques (usually containing the cheque number, sort number, and account number)
    are printed using magnetic ink. To print magnetic ink, you need a laser printer
    that accepts MICR toner. MICR provides a secure, high-speed method of scanning
    and processing information.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_23_0.png)


    An example of the E-13B MICR font. Shown are the 14 characters of the E-13B font.
    The control characters bracketing each numeral block are (from left to right)
    *transit*, *on-us*, *amount*, and *dash*.


    # Light Pen


    A light pen is an input device that utilizes a light-sensitive detector to select
    objects on a display screen. A light pen is similar to a mouse, except that with
    a light pen you can move the pointer and select objects on the display screen
    by directly pointing to the objects with the pen.


    A light-sensitive stylus is wired to a video terminal used to draw pictures or
    select menu options. The user brings the pen to the desired point on screen and
    presses the pen button to make contact. Contrary to what it looks like, the pen
    does not shine light onto the screen; rather, the screen beams into the pen. Screen
    pixels are constantly being refreshed. When the user presses the button, the pen
    senses light, and the pixel being illuminated at that instant identifies the screen
    location.


    The picture of a light pen is shown in Fig. 1.13.


    # Barcode Reader


    A barcode reader also called a price scanner or point-of-sale (POS) scanner is
    a handheld or stationary input device used to capture and read information contained
    in a bar code. A barcode reader consists of a scanner, a decoder (either built-in
    or external), and a cable is used to connect the reader with a computer. Because
    a barcode reader merely captures and translates the barcode into numbers and/or


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_23_1.png)


    Fig. 1.12: OCR reader


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_23_2.png)


    Fig. 1.13: Light pen'
