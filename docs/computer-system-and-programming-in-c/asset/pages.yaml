    # Register Storage Class


    The following are the key points for the register storage class:


    +   - Automatic variables are allocated storage in the main memory of the computer;
    however, for most computers, accessing data in memory is considerably slower than
    processing directly in the CPU.

    +   - Registers are memory located within the CPU itself where data can be stored
    and accessed quickly. Normally, the compiler determines what data is to be stored
    in the registers of the CPU at what times.

    +   - However, the C language provides the storage class register so that the
    programmer can suggest to the compiler that particular automatic variables should
    be allocated to CPU registers, if possible and it is not an obligation for the
    CPU to do this.

    +   - Thus, register variables provide a certain control over efficiency of program
    execution.

    +   - Variables which are used repeatedly or whose access times are critical may
    be declared to be of storage class register.

    +   - Variables can be declared as a register as follows:


    ```

    register int var;

    ```


    The features of a variable defined to be of register storage class are as follows:


    | Storage | CPU registers |

    |---|---|

    | Default initial value | Garbage value |

    | Scope | Local to the block in which the variable is defined |

    | Life | Till the control remains within the block in which the variable is defined
    |


    A value stored in a CPU register can always be accessed faster than the one that
    is stored in memory. Therefore, if a variable is used at many places in a program
    it is better to declare its storage class as register. A good example of frequently
    used variables is loop counters. We can name their storage class as register.


    # Example


    ```

    void main()

    {

    register int i ;

    for (i = 1; i <= 100 ; i++)

    printf("%d", i);

    }

    ```


    Here, even though we have declared the storage class of i as register, we cannot
    say for sure that the value of i would be stored in a CPU register. Why? Because
    the number of CPU registers are limited, and they may be busy doing some other
    task. What happens in such an event... the variable works as if its storage class
    is auto. Not every type of variable can be stored in a CPU register.


    For example, if the microprocessor has 16-bit registers then they cannot hold
    a float value or a double value, which require 4 and 8 bytes respectively. However,
    if you use the register storage class for a float or a double variable you will
    not get any error messages. All that would happen is the compiler would treat
    the variables to be of auto storage class.


    # External Storage Class


    The following are the key points for the external storage class:


    +   - All variables we have seen so far have had limited scope (the block in which
    they are declared) and limited lifetimes (as for automatic variables).

    +   - However, in some applications it may be useful to have data which is accessible
    from within any block and/or which remains in existence for the entire execution
    of the program. Such variables are called global variables, and the C language
    provides storage classes which can meet these requirements; namely, the `external`
    (extern) and `static` (static) classes.'
