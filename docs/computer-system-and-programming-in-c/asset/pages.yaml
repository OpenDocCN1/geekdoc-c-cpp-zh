    # ## Problem 4


    Design an algorithm to calculate the factorial of a given number.


    # ### Algorithm


    +   1. Start

    +   2. Read the number n

    +   3. [Initialize] i ← 1, fact ← 1

    +   4. Repeat steps 4 through 6 until i = n

    +   5. Fact ← fact * i

    +   6. i ← i + 1

    +   7. Print fact

    +   8. Stop


    # ## Problem 5


    Design an algorithm to check whether the given number is prime or not.


    # ### Algorithm


    +   1. Start

    +   2. Read the number num


    +   3. [Initialize] i ← 2, flag ← 1

    +   4. Repeat steps 4 through 6 until i < num or flag = 0

    +   5. Rem ← num mod i

    +   6. If rem = 0 then

    +      flag ← 0

    +      else

    +      i ← i + 1

    +   7. If flag = 0 then

    +      Print Number is not prime

    +      Else

    +      Print Number is prime

    +   8. Stop


    # ## ALGORITHM CORRECTNESS AND TERMINATION


    We say that an algorithm is correct if for every input data that satisfies some
    condition, which is called the precondition of the algorithm, the output data
    satisfies a certain predefined condition, which is called the postcondition of
    the algorithm.


    # ### Example


    +   **DIV (A, B)**

    +   1. R ← A/B

    +   2. return R


    For this algorithm we have:

    Precondition: A, B are real numbers and B<>0.

    Postcondition: R = A/B.


    The proof of correctness of an algorithm has two parts:


    +   1. Partial correctness. If the algorithm terminates then it will give the
    right result (the result will satisfy the post condition).

    +   2. Termination. Proof that the algorithm terminates.


    # *Termination of an Algorithm*


    Termination of an algorithm means at what condition the algorithm terminates.
    This concept is very useful in the case of iteration and recursion.


    # ## FLOW CHART


    The next step after the algorithm development is the flow charting. Flow charts
    are used in'
