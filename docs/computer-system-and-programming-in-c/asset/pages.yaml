  md: '+   - The scope of static automatic variables is identical to that of automatic
    variables, i.e. it is local to the block in which it is defined; however, the
    storage allocated becomes permanent for the duration of the program.

    +   - Static variables may be initialized in their declarations; however, the
    initializers must be **constant expressions**, and initialization is done only
    once at compile time when memory is allocated for the static variable.


    The features of a variable defined to have a **static** storage class are as follows:


    | Storage | Memory |

    |---|---|

    | Default initial value | Zero |

    | Scope | Local to the block in which the variable is defined |

    | Life | Value of the variable persists between different function calls |


    Compare the two programs and their output given in the following figure to understand
    the difference between **automatic** and **static** storage classes.


    | Program using automatic storage | Program using static storage |

    |---|---|

    | `void main()`<br>`{`<br>`increment();`<br>`increment();`<br>`increment();`<br>`}`<br>`void
    increment()`<br>`{`<br>`auto int i = 1;`<br>`printf("%d\\n", i);`<br>`i = i +
    10;`<br>`}` | `void main()`<br>`{`<br>`increment();`<br>`increment();`<br>`increment();`<br>`}`<br>`void
    increment()`<br>`{`<br>`static int i = 1;`<br>`printf("%d\\n", i);`<br>`i = i
    + 10;`<br>`}` |

    | The output of the above program segment is as follows | The output of the above
    program segment is as follows |

    | 1<br>1<br>1 | 1<br>11<br>21 |


    The explanation of the above program segment is as follows:


    The above programs consist of two functions **main()** and **increment()**. The
    function **increment()** gets called from **main()** thrice.


    Each time it increments the value of i and prints it. The only difference in the
    two programs is that one uses an **auto** storage class for variable i, whereas
    the other uses **static** storage class.


    Like **auto** variables, **static** variables are also local to the block in which
    they are declared. The difference between them is that **static** variables do
    not disappear when the function is no longer active. Their values persist. If
    the control comes back to the same function again the **static** variables have
    the same values they had last time around.


    In the above example, when variable i is **auto**, each time **increment()** is
    called it is reinitialized to one. When the function terminates, i vanishes and
    its new value of 10 is lost. The result: no matter how many times we call **increment()**,
    i is initialized to 1 every time.


    On the other hand, if i is **static**, it is initialized to 1 only once. It is
    never initialized again. During the first call to **increment()**, i is incremented
    to 10. Because i is static, this value persists. The next time **increment()**
    is called, i is not re-initialized to 1; on the contrary its old value 10 is still
    available. This current value of i (i.e. 10) gets printed and then i = i + 10
    adds 1 to it to get a value of 11. When **increment()** is called the third time,
    the current value of i (i.e. 21) gets printed and once again i is incremented.
    In short, if the storage class is **static** then the statement **static int i
    = 1** is executed only once, irrespective of how many times the same function
    is called.


    # When to Use Which Storage Class


    Dennis Ritchie has made available to the C programmer a number of storage classes
    with varying features, believing that the programmer is in a best position to
    decide which one of these storage classes is to be used when. We can make a few
    ground rules for usage of different storage classes in different programming situations
    with a view to:


    +   (a) Economize the memory space consumed by the variables

    +   (b) Improve the speed of execution of the program'
