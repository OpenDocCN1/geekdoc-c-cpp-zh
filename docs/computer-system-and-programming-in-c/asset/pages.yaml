    **Note:** We can also refer to as SP.


    # ## OPERATIONS OF STACK


    There are two operations applied on stack, they are


    +   1. Push

    +   2. Pop


    # ### 1. Push


    Push operation is used to insert a new element in to the stack. At the time of
    insertion first check the stack is full or not. If the stack is full it generates
    an error message “stack overflow”.


    # ### 2. Pop


    Pop operation is used to delete an element from the stack. At the time of deletion
    first check the stack is empty or not. If the stack is empty it generates an error
    message “stack underflow”.


    # ### Algorithms for Push and Pop Function


    # #### Assumptions


    +   - `sp` stack pointer whose initial value is -1

    +   - `max_stack` is the size of the queue

    +   - `stack[]` is an array

    +   - Element is the element to be added or deleted


    # ### Algorithm to push an element into the stack


    Step: 1) start

    Step: 2) take the element to push into stack

    step: 3) If (Sp == max_stack)

    display “The stack is full”

    {Sp = Sp+1

    stack [Sp] = item}

    step: 4) return to main program


    # ### Algorithm to pop an element from the stack


    Step: 1) start

    Step: 2) if (Sp == -1)

    display ”stack is empty”

    else

    {element = stack[Sp]

    Sp = Sp -1}

    Step: 3) return element


    # ### Programming Problems


    # #### Problem 1


    The program given below implements the stack data structure using an array. In
    this program the elements are pushed into array stack [ ] through push ( ) function.
    The parameters passed to push ( ) are the base address of the array, the position
    in the stack at which the element is to be placed and the element itself. Care
    is taken by the push ( ) function that the user does not try to place the element
    beyond the bounds of the stack. This is done by checking the value stored in pos.
    pop ( ) function pops out the last element stored in the stack [ ]. Because, top
    holds the position which has the last element in the stack.


    This problem is also called as static implementation of stack or array implementation
    of stack.


