    instructions of the CPU. On PCs, the assembly language looks like this


    ```

    mov ebx, eax

    mov esi, 66

    mov [edx+ebx*4+4], ecx

    mov [ebx], ah

    ```


    To compile this into machine code, you need an assembler. It is just a compiler
    for assembly language.


    Many compilers can output the assembly language equivalent of code in C or C++.


    The problem with assembly language is that it requires a high level of technical
    knowledge, and it is slow to write. In the same time that you take to write ten
    lines of assembly language – that is ten instructions, you could write ten lines
    of C, perhaps the equivalent of 500 instructions!


