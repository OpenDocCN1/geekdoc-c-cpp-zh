    # Uses of Bitwise Operations


    Occasionally, you may want to implement a large number of Boolean variables, without
    using a lot of space.


    A 32-bit int can be used to store 32 Boolean variables. Normally, the minimum
    size for one Boolean variable quantity is one byte. All types in C must have sizes
    that are products of bytes. However, only one bit is essential to represent a
    Boolean value.


    You can also use bits to present elements of a (small) set. If a bit is 1, then
    element i is in the set, otherwise it is not.


    You can use bitwise AND to implement set intersection, bitwise OR to implement
    set union.


    # Facts about Bitwise Operators


    Consider the expression x + y. Do either x or y get changed? The answer is no.


    Most built-in binary manipulators do not modify the values of the arguments. This
    uses to logical operators too. They do not modify their arguments.


    There are operators that do assignment such as +=, -=, *=, and so on. They utilize
    to logical operators too. For example, !=, &=, ^=. Nearly all binary operators
    have a version with = after it.


    # Example


    The following example shows the use of bitwise operators in C language.


    ```

    #include <stdio.h>

    /* a demonstration of C bitwise operators */

    void main()

    {

    int d1 = 4,/* 101 */

    d2 = 6,/* 110 */

    d3;

    printf("\nd1=%d",d1);

    printf("\nd2=%d",d2);

    d3 = d1 & d2; /* 0101 & 0110 = 0100 (=4) */

    printf("\n Bitwise AND d1 & d2 = %d",d3);

    d3 = d1 | d2; /* 0101 | 0110 = 0110 (=6) */

    printf("\n Bitwise OR d1 | d2 = %d",d3);

    d3 = d1 ^ d2; /* 0101 ^ 0110 = 0011 (=2) */

    printf("\n Bitwise XOR d1 ^ d2 = %d",d3);

    d3 = ~d1; /* one''s complement of 0000 0101 is 1111 1010 (-5) */

    printf("\n Ones complement of d1 = %d",d3);

    d3 = d1<<2;/* 0000 0101 left shift by 2 bits is 0001 0100 */

    printf("\n Left shift by 2 bits d1 << 2 = %d",d3);

    d3 = d1>>2;/* 0000 0101 right shift by 2 bits is 0000 0001 */

    printf("\n Right shift by 2 bits d1 >> 2 = %d",d3);

    getch();

    }

    ```


    The output of the above program is as follows:

    d1=4

    d2=6

    Bitwise AND d1 & d2 = 4

    Bitwise OR d1 | d2 = 6

    Bitwise XOR d1 ^ d2 = 2

    Ones complement of d1 = -5

    Left shift by 2 bits d1 << 2 = 16

    Right shift by 2 bits d1 >> 2 = 1


    # C SHORTHAND OPERATORS


    C has a special shorthand that simplifies coding of certain type of assignment
    statements.


    # Example


    a = a+2; can be written as: a += 2;

    The += operator +=tells the compiler that a is assigned the value of a + 2;


    This shorthand works for all binary operators in C.'
