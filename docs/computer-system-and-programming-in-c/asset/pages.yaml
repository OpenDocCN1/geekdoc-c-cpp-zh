    # CHARACTERISTIC FEATURES OF POINTERS


    The following are the features of pointers


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_245_0.png)


    +   - With the use of pointers in programming, the program execution time will
    be faster as the data is manipulated with the help of addresses directly.

    +   - With the use of pointers in programming, will save the memory space.

    +   - With the use of pointers in programming, the memory access will be very
    efficient.

    +   - With the use of pointers in programming, dynamic memory is allocated.


    An ordinary variable is a location in memory that can hold a value. For example,
    when you declare a variable `num` as an integer, the compiler sets aside 2 bytes
    of memory (depends on the PC) to hold the value of the integer. In your program,
    you refer to that location in memory by the name `num`. At the machine level that
    location has a memory address.


    int num = 100;

    We can access the value 100 either by the name `num` or by its memory address.
    Since, addresses are simply digits, they can be stored in any other variable.


    # Such variables that hold addresses of other variables are called Pointers.


    The general syntax of defining a pointer is as follows:


    `<datatype> * <pointername>;`


    In other words, a pointer is simply a variable that contains an address, which
    is a location of another variable in memory. A pointer variable “points to” another
    variable by holding its address. Since a pointer holds an address rather than
    a value, it has two parts. The pointer itself holds the address. That address
    points to a value. There is a pointer and the value pointed to. This fact can
    be a little confusing until you get comfortable with it, but once you get familiar
    with it, then it is extremely easy and very powerful.


    One good way to visualize this concept is to examine in the following figure.


    # THE ADDRESS AND INDIRECTION OPERATORS


    Now we will consider how to determine the address of a variable. The operator
    that is available in C for this purpose is “&” (address of) operator. The operator
    & and the immediately preceding variable returns the address of the variable associated
    with it. C’s other unary pointer operator is the “*”, also called as value at
    address or indirection operator. It returns a value stored at that address.


    This can be illustrated with the help of following examples.


    # Example


    Write a program to print the address associated with a variable and value stored
    at that address.'
