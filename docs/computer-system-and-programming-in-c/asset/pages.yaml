    \ the variable causes the current value of the variable is used in the expression\
    \ in which it appears, then the variable is incremented (decremented) by 1.\n\n\
    The explanation is given below\n\n+   1. **If we write `b=a++`**\n+   \n+   The\
    \ meaning of this line is that the initial value of `a` is initialized in `b`\
    \ and then the value of `a` is incremented.\n\n**Example**\n\n```c\nint a=10;\n\
    int b;\nb=a++;\n```\n\nIn this case the value of b is 10 and the value of a is\
    \ 11.\n\n+   2. **If we write `b=++a`**\n+   \n+   The meaning of this line is\
    \ that firstly the value of `a` is incremented and then the incremented value\
    \ is stored in `b`.\n\n**Example**\n\n```c\nint a=10;\nint b;\nb=++a;\n```\n\n\
    In this case the value of b is 11 and the value of a is 11.\n\n+   3. **If we\
    \ write `b=a--`**\n+   \n+   The meaning of this line is that firstly the initial\
    \ value of `a` is initialized in `b` and then the value of `a` is decremented.\n\
    \n**Example**\n\n```c\nint a=10;\nint b;\nb=a--;\n```\n\nIn this case the value\
    \ of b is 10 and the value of a is 9.\n\n+   4. **If we write `b=--a`**\n+   \n\
    +   The meaning of this line is that firstly the value of `a` is decremented and\
    \ then the decremented value is stored in `b`.\n\n**Example**\n\n```c\nint a=10;\n\
    int b;\nb=--a;\n```\n\nIn this case the value of b is 9 and the value of a is\
    \ 9.\n\nThe precedence of these operators is right to left.\n\n**Example 1**\n\
    \n```c\nint a = 2, b=3;\nint c;\nc = ++a -- b--;\nprintf (\"a=%d, b=%d,c=%d \\\
    n\", a,b,c);\n```\n\n**OUTPUT**\n```\na = 3, b = 2, c = 0.\n```\n\nThe explanation\
    \ is as follows:\n\nSince the precedence of the operators is right to left, first\
