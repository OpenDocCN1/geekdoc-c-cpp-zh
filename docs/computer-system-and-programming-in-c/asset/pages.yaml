  md: "# ## Solution\n\n| Program | Output |\n|---|---|\n| `// function example` |\
    \ The result is 8 |\n\n```\n```c\n#include <stdio.h>\n#include<conio.h>\nint addition\
    \ (int,int)//function prototype\nvoid main ()\n{\n    int z;\n    z = addition\
    \ (5,3);//calling of the function\n    printf(\"\\n The Addition is %d\",z);\n\
    }\n\nint addition (int a, int b)\n{\n    int r;\n    r=a+b;\n    return (r);\n\
    }\n```\n```\n\nWe can see how the main function begins by declaring the variable\
    \ z of type int. Right after that, we see a call to a function called addition.\
    \ Paying attention we will be able to see the similarity between the structure\
    \ of the call to the function and the declaration of the function itself some\
    \ code lines above:\n\n![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_196_0.png)\n\n\
    The parameters and arguments have a clear correspondence. With the main function\
    \ we called to addition passing two values: 5 and 3, that correspond to the int\
    \ a and int b parameters declared for function addition.\n\nAt the point at which\
    \ the function is called from within main, the control is lost by main and passed\
    \ to function addition. The value of both arguments passed in the call (5 and\
    \ 3) are copied to the local variables int a and int b within the function.\n\n\
    Function addition declares another local variable (int r), and by means of the\
    \ expression r=a+b, it assigns r to the result of a plus b. Because the actual\
    \ parameters passed for a and b are 5 and 3 respectively, the result is 8.\n\n\
    The following line of code:\n\n`return (r);`\n\nFinalizes function addition, and\
    \ returns the control back to the function that called it in\n\nthe first place\
    \ (in this case, main). At this moment the program follows it regular course from\
    \ the same point at which it was interrupted by the call to addition. But additionally,\
    \ because the return statement in function addition specified a value: the content\
    \ of variable r (return (r);), which at that moment had a value of 8. This value\
    \ becomes the value of evaluating the function call.\n\n![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_196_1.png)\n\
    \nSo being the value returned by a function the value given to the function call\
    \ itself when it is evaluated, the variable z will be set to the value returned\
    \ by addition (5, 3), that is 8. To explain it another way, you can imagine that\
    \ the call to a function (addition (5,3)) is literally replaced by the value it\
    \ returns (8).\n\nThe following line of code in main is:\n\n`printf(\"\\n The\
    \ result is %d\",z);`\n\nThat, as you may already expect, produces the printing\
