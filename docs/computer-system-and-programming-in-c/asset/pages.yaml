  md: '# Taskbar


    In the bottom section of the screen, there is (or there may be) a long object.
    It is called the Taskbar. On the left side of the taskbar, there is an area with
    the word Start [Start button image] or [Start button image]. The appearance of
    this depends on the version of Windows you are using but it plays exactly the
    same role in any version.


    On the right side of the Start, there is a wide area that is empty when the computer
    starts. This is actually referred to as the taskbar. As you keep using the computer,
    this area would be filled with some objects. In some versions (Windows 95, 98,
    Windows Server 2003), the color of the taskbar may be gray (or Silver). In some
    other versions (Windows Millennium), the taskbar may be yellowish. In Windows
    XP, it may be blue.


    On the far right side of the taskbar is a section called the tray area. One of
    the things that this area displays is the current time (as set on your computer).


    Graphically the task bar is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_62_0.png)


    # Window


    A window is a (usually) rectangular portion of the display on a computer monitor
    that presents its contents (e.g. the contents of a directory, a text file or an
    image) seemingly independently of the rest of the screen. Windows are one of the
    elements that comprise a graphical user interface (GUI).


    A GUI is a type of human-computer interface (i.e. a system for people to interact
    with a computer) that uses windows, icons, pull-down menus and a pointer and that
    can be manipulated by a mouse (and usually to some extent by a keyboard as well).
    An icon is a small picture or symbol that represents a program (or command), file,
    directory (also called a folder) or device (such as a hard disk or floppy disk).


    The GUI represents a major advantage over the command line interface (CLI) of
    the console, which displays only text (i.e. no


    images) and is accessed solely by a keyboard. It has made computers much easier
    to learn and work with, and it has also led to the development of major new applications
    for them, including desktop publishing and CAD (computer-aided design).


    # Windows Elements


    The following are the basic elements of the window:


    # *The Application Window*


    Application windows are the main part of almost all programs. Common elements
    of application windows include the control menu, menu bar, and border. Graphically
    it is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_62_1.png)


    # *Dialog Box*


    It is also, technically, a window. Dialogs are usually tied to an application
    and help perform a specific task or give details for the application. Most dialog
    boxes lack several of the control buttons and a border, and will have other buttons
    inside the window to complete a request such as “OK” and “CANCEL”.


    Graphically it is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_62_2.png)'
