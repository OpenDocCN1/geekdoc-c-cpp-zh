  md: "The internal memory is the built-in memory where CPU holds the programs and\
    \ data being manipulated. There are two types of internal memory\n\n+   (a) RAM\
    \ (Random Access Memory)  \n+   (b) ROM (Read-Only Memory).\n\n**(a) RAM (Random\
    \ Access Memory):** RAM is acronym for random access memory, a type of computer\
    \ memory that can be accessed randomly; that is, any byte of memory can be accessed\
    \ without touching the preceding bytes. RAM is the most common type of memory\
    \ found in computers and other devices, such as printers. There are two basic\
    \ types of RAM:\n\n+   1. Dynamic RAM (DRAM)  \n+   2. Static RAM (SRAM)\n\nThese\
    \ two types differ in the technology they use to hold data, dynamic RAM being\
    \ the more common type. Dynamic RAM needs to be refreshed thousands of times per\
    \ second. Static RAM does not need to be refreshed, which makes it faster; but\
    \ it is also more expensive than dynamic RAM. Both types of RAM are *volatile*,\
    \ meaning that they lose their contents when the power is turned off.\n\nIn common\
    \ usage, the term RAM is synonymous with *main memory*, the memory available to\
    \ programs. For example, a computer with 8M RAM has approximately 8 million bytes\
    \ of memory that programs can use. In contrast, ROM (read-only memory) refers\
    \ to special memory used to store programs that boot the computer and perform\
    \ diagnostics. Most personal computers have a small amount of ROM (a few thousand\
    \ bytes). In fact, both types of memory (ROM and RAM) allow random access. To\
    \ be precise, therefore, RAM should be referred to as *read/write RAM* and ROM\
    \ as *read-only RAM*. The limitations of RAM are:\n\n+   • Limited storage capacity\
    \  \n+   • Volatile in nature, i.e. its contents get erased when power is turned\
    \ off.\n\n**(b) ROM (Read-Only Memory):** ROM is acronym for read-only memory,\
    \ computer memory on which data has been prerecorded.\n\nOnce data has been written\
    \ onto a ROM chip, it cannot be removed and can only be read. Unlike main memory\
    \ (RAM), ROM retains its contents even when the computer is turned off. ROM is\
    \ referred to as being nonvolatile, whereas RAM is volatile. Most personal computers\
    \ contain a small amount of ROM that stores critical programs such as the program\
    \ that boots the computer. In addition, ROMs are used extensively in calculators\
    \ and peripheral devices such as laser printers, whose fonts are often stored\
    \ in ROMs. A variation of a ROM is a PROM (programmable read-only memory). PROMs\
    \ are manufactured as blank chips on which data can be written with a special\
    \ device called a PROM programmer.\n\n# *External Memory*\n\nExternal memory which\
    \ is sometimes called *backing store or secondary memory*, allows the permanent\
    \ storage of large quantities of data. Some method of magnetic recording on magnetic\
    \ disks or tapes is most commonly used. More recently optical methods which rely\
    \ upon marks etched by a laser beam on the surface of a disc (CD-ROM) have become\
    \ popular, although they remain more expensive than magnetic media. The capacity\
    \ of external memory is high, usually measured in hundreds of megabytes or even\
    \ in gigabytes (thousand million bytes) at present. External memory has the important\
    \ property that the information stored is not lost when the computer is switched\
    \ off.\n\nMost common external storage devices are: hard drives, floppy disks,\
    \ magnetic tapes, CD ROM, video disks, etc.\n\nNow we will discuss some external\
    \ storage devices.\n\n**Floppy disk:** A floppy disk is a thin magnetic-coated\
    \ disk contained in a flexible or semi-rigid protective jacket. Data is stored\
    \ in tracks and sectors. The floppy disks are usually 3.5” in size. However, older\
    \ floppy disks may be in use; these would be 5.25” in size. Double sided high\
    \ density 3.5” disks can hold 1.44 MB of data. Once data is stored on a floppy\
    \ disk it can be ‘write protected’ by clicking a tab on"
