  md: "all effects from previous calls to ungetc are dropped.\n\nWhen using fseek\
    \ on text files with offset values other than zero or values retrieved with ftell,\
    \ bear in mind that on some platforms some format transformations occur with text\
    \ files which can lead to unexpected re-positioning.\n\nOn streams open for update\
    \ (read+write), a call to fseek allows to switch between reading and writing.\n\
    \n# Parameters\n\nThe following are the parameters that are passed in the fseek()\
    \ function.\n\n+   (i) *stream*  \n+   Pointer to a FILE object that identifies\
    \ the stream.\n+   \n+   (ii) *offset*  \n+   Number of bytes to offset from *origin*.\n\
    +   \n+   (iii) *origin*  \n+   Position from where *offset* is added. It is specified\
    \ by one of the following constants defined in <stdio.h>:\n\n| Constant | Meaning\
    \ |\n|---|---|\n| SEEK_SET | Beginning of file |\n| SEEK_CUR | Current position\
    \ of the file pointer |\n| SEEK_END | End of file |\n\n# Return value\n\nIf successful,\
    \ the function returns a zero value. Otherwise, it returns nonzero value.\n\n\
    # Example\n\nThe following example demonstrates the concept of fseek() function.\n\
    \n```\n```c\n#include <stdio.h>\n#include <conio.h>\nvoid main ()\n{\n    FILE\
    \ * pFile;\n    clrscr();\n    pFile = fopen ( \"myfile.txt\", \"w\" );\n    fputs\
    \ ( \"I am an apple\", pFile );\n    fseek ( pFile, 9, SEEK_SET );\n    fputs\
    \ ( \" sam\", pFile );\n    fclose ( pFile );\n    getch();\n}\n```\n```\n\n#\
    \ After this code is successfully executed, the file example.txt contains:\n\n\
    This is a sample.\n\n# (b) *ftell Function*\n\nftell function is used to get current\
    \ position in file stream.\n\nThe general syntax of ftell() function is as follows:\n\
    \nlong int ftell ( FILE * stream );\n\nThe above function returns the current\
    \ value of the position indicator of the stream. For binary streams, the value\
    \ returned corresponds to the number of bytes from the beginning of the file.\
    \ For text streams, the value is not guaranteed to be the exact number of bytes\
    \ from the beginning of the file, but the value returned can still be used to\
    \ restore the position indicator to this position using fseek.\n\n# Parameters\n\
    \nThe following is the parameter that can be passed in ftell() function.\n\n#\
    \ Stream\n\nPointer to a FILE object that identifies the stream.\n\n# Return value\n\
    \nOn success, the current value of the position indicator is returned.\n\nIf an\
    \ error occurs, -1L is returned, and the global variable errno is set to a positive\
    \ value. This value can be interpreted by perror.\n\n# Example\n\n```\n```c\n\
    #include <stdio.h>\n#include <conio.h>\nvoid main ()\n{\n    FILE * pFile;\n \
    \   long size;\n    pFile = fopen (\"myfile.txt\",\"rb\");\n    if (pFile==NULL)\
    \ perror (\"Error opening file\");\n    else\n    {\n        fseek (pFile, 0,\
    \ SEEK_END);\n        size=ftell (pFile);\n        fclose (pFile);\n        printf\
    \ (\"Size of myfile.txt: %ld bytes.\\n\", size);\n    }\n}\n```\n```"
