    +   ii. **High-level Languages or Problem Oriented Languages:** These languages
    are particularly oriented towards describing the procedures for solving the problem
    in a concise, precise and unambiguous manner. Every high level language follows
    a precise set of rules. They are developed to allow application programs to be
    run on a variety of computers. These programming languages are *machine independent*.
    Languages falling in this category are FORTRAN, BASIC, and PASCAL, etc. They are
    easy to learn and programs may be written in these languages with much less effort.
    However, the computer cannot understand them and they need to be translated into
    machine language with the help of other programs known as compilers or translators.


    # C LANGUAGE—INTRODUCTION


    C is a programming language formulated at AT & T’s Bell Laboratories of USA in
    1972. It was projected and written by a man named Dennis Ritchie. In the late
    70s, C began to replace the more intimate languages of that time like PL/I, ALGOL,
    etc. No one forced C. It was not made the ‘official’ Bell Laboratories programming
    language. Thus, without any ad C’s reputation spread and its pool of users grew.
    Ritchie seems to have been rather surprised that so many programmers favoured
    C to older languages like FORTRAN or PL/I, or the newer ones like Pascal and APL.
    But, that is what happened.


    The programming language C was primitively developed by Dennis Ritchie of Bell
    Laboratories and was planned to run on a PDP-11 with a UNIX operating system.
    Although it was earlier designated to run under UNIX, there has been a great interest
    in running it under the MS-DOS operating system on the IBM PC and compatibles.
    It is an first-class language for this surroundings because of the simplicity
    of expression, the compactness of the code, and the wide range


    of applicability. Also, due to the simplicity and ease of writing a C compiler,
    it is usually the first high level language available on any new computer, including
    microcomputers, minicomputers, and mainframe computer.


    C is not the best beginning language because it is somewhat cryptical in nature.
    It allows the programmer a wide range of procedures from high level down to a
    very low level, approaching the level of assembly language. There seems to be
    no limit to the tractability available. One experienced C programmer made the
    statement, “You can program anything in C”, and the statement is well supported
    by my own feel with the language. Along with the resulting freedom however, you
    take on a great deal of duty because it is very easy to write a program that destroys
    itself due to the silly little errors that a good Pascal compiler will flag and
    call a fatal error. In C, you are a lot on your own as you will soon find. In
    1972, C programming language was developed at Bell Laboratories by Dennis Ritchie.
    C is a simple programming language with a comparatively simple to understand syntax
    and few keywords. C is useless. C itself has no input/output commands, does not
    have support for strings as a key data type. There is no predefined useful math
    functions. C demands the use of libraries as C is useless by itself. This increases
    the complexity of the C programming language. The use of ANSI libraries and other
    methods, the issue of standard libraries is settled.


    # *Why Use C?*


    C has been used successful for every type of programming problem conceivable from
    operating systems to spreadsheets to expert systems and efficient compilers are
    available for machines ranging in power from the Apple Macintosh to the Cray supercomputers.
    The largest measure of C’s success seems to be based on purely practical considerations:


    +   - The portability of the compiler

    +   - The standard library concept

    +   - A powerful and varied repertoire of operators

    +   - An elegant syntax'
