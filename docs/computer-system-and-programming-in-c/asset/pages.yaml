    The strcmp function in the string library function which compares two strings,
    character by character and stops comparison when there is a difference in the
    ASCII value or the end of any one string and returns ASCII difference of the characters
    that is integer. If the return value *zero* means the two strings are equal, a
    negative value means that first is less than second, and a positive value means
    first is greater than second.


    The general syntax of strcmp () function is as follows:

    n = strcmp (str1, str2);

    Where str1 and str2 are two strings to be compared and n is returned value of
    differed characters.


