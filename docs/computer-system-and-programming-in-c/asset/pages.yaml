  md: 'The explanation of the above code is as follows:


    Note that the compiler treats the three i’s as totally different variables, since
    they are defined in different blocks. Once the control comes out of the innermost
    block the variable i with value 6 is lost, and hence i in the second `printf()`
    refers to i with value 5. Similarly, when the control comes out of the next innermost
