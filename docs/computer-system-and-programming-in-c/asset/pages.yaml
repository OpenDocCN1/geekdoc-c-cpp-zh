- pgno: 44
  md: '# Application Software


    Application software is developed for application of the computer to common problems
    and tasks. They are available for business applications, science and engineering
    applications and so on. Personal productivity programs are categorized based on
    the nature of their use in word processing, generating spreadsheet, presenting
    graphics and maintaining databases. Application software is also available as
    packages and usually with a user manual. Some of the application software’s are
    described below:


    # Word Processors


    A word processor is used to prepare a report, a personal or business letter, in
    desktop publishing and so on. These offer formatting features such as using different
    character styles, line spacing, and page numbering and so on. Documents prepared
    using a word processor can be easily printed in any type of printer.


    # Electronic Spreadsheets


    An electronic spreadsheet software is used to prepare documents containing information
    or data in the form of numbers or characters. The information is arranged in rows
    and columns for further processing and analysis, preparing reports and generating
    charts. It is also capable of performing arithmetic operations and using functions.


    # Database Software


    Databases are records related to a person or an organization. Database software
    has capability to edit and update data in a file. The data are processed to prepare
    and print salary details of employees, annual sales details and so on. One of
    the major applications of a computer is database management.


    # System Software


    System software is designed for a specific type of hardware. For example, the
    disk operating system is used to co-ordinate the peripherals of a computer. The
    system software controls the activities of a computer, application programs, flow
    of data in and out of memory and disk storage. Our operating system,


    compilers, assemblers, linker and loaders are the example of system software.


    System software also handles data in communication applications and within the
    communication system in a computer network. The communication software transfers
    data from one computer to another. These programs also provide data security and
    error checking along with the transfer of data between the computer systems.


    Examples of system software include operating system, compiler, interpreter and
    assembler that we will discuss later in this book.


    # SUMMARY


    +   - A computer is an electronic device which takes information and process information
    according to the program and produces the output.

    +   - A computer system has five basic functional units.

    +   - The central processing unit (CPU) is the brain of the computer.

    +   - The arithmetic logic unit (ALU) is the unit of the computer that performs
    arithmetic and logical operations on the data.

    +   - The control unit controls the overall activities of the components of the
    computer.

    +   - The memory unit is the unit where all the input data and results are stored.

    +   - Stored program concept uses the memory unit to store both instruction or
    operation code and data or operands.

    +   - Random access memory (RAM) is a temporary storage medium in a computer.
    All data to be processed by the computer are transferred from a storage device
    or keyboard to RAM.

    +   - Read-only memory (ROM) is a permanent storage medium which stores the start
    up programs.

    +   - A floppy disk is used to store data permanently.

    +   - Hard disk is a reliable and permanent storage disk. It has a set of metal
    disks'
  merge: -1
  img_proc: true
