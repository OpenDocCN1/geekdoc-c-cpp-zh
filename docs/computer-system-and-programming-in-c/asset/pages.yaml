    # TIME Command


    TIME command is used to display the current system time. The computer also maintains
    a clock. This command will display the current system time in (hours: minutes:
    seconds) format and the user may enter the new time. Consider the following example
    to display the current time.\n**C:\\>TIME**\nCurrent time is 11:37:25.34p\nEnter
    new time:


    # CD Command


    CD (change directory) command is used to change the directory to another specified
    directory/location in the disk. A message “invalid directory” is displayed if
    the directory mentioned is not available.


    Consider the following examples:


    +   1. **C:\\>CD ABC:**  \n   This command will change the current directory to
    the specified directory ABC in the disk. Now the prompt is displayed as follows.\n   `C:\\ABC>`\n\n2.
    **C:\\>CD TC**  \n   `C:\\TC>CD ABCP`\n   These commands will change the current
    directory to the specified directory TC and then to the directory ABCP in the
    disk. Now the prompt is displayed as follows.\n   `C:\\TC\\ABCP>`\n\n3. **C:\\>CD
    TC\\ABCP**  \n   This command will also change the directory to the specified
    directory TC and then to the directory ABCP in the disk. Now the prompt is displayed
    as follows.\n   `C:\\TC\\ABCP>`\n\n4. **C> cd furniture:**  \n   Moves you to
    the directory called ‘FURNITURE’\n\n5. **C> cd \\furniture\\chairs:**  \n   Moves
    you to the directory called ‘CHAIRS’ under the directory called ‘FURNITURE’.\n\n6.
    **C> cd.. :**  \n   Moves you up one level in the path.\n\n7. **C> cd \\**  \n   Takes
    you back to the root directory (c: in this case).


    # MD Command


    MD (make directory) command is used to create a new directory in the storage device
    to store programs. Consider the following example to create a new directory:\n**C:\\>MD
    ABCP**\nThis command will create a new directory in the current directory. To
    transfer the control to the new directory a CD command is used.\n**C:\\>CD ABCP**\n**CD:\\ABCP>**


    # RD Command


    RD (remove directory) command is used to remove a directory permanently from the
    disk. Note that all the files in that directory should be removed before the RD
    command is used. Also know that you should quit from the directory being removed.'
