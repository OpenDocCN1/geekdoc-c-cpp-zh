    # *Taskbar*


    If you think of your computer’s hard disk as a filing cabinet where all your programs
    and documents (files) are stored, then you can think of your Windows desktop as
    being like your real “wooden” desktop. Only the things you are working with right
    now are on your Windows desktop, as well as your real desktop.


    At any given time, you might have several programs, folders, and documents open
    on your desktop. The short name for “anything that is currently open on your desktop”
    is *task*. That is, we can refer to each open item on your desktop—no matter what
    that item is, as a “task”, short for “task-in-progress”. The Windows taskbar,
    which is roughly centered across the bottom of your screen, as in following figure:


    # **My Computer**


    When the My computer icon on the desktop is double clicked, the my computer explorer
    window opens and displays a list of storage media on the current computer. These
    can include floppy disk drives, CD-ROM, DVD-ROM, removable disks such as ZIP disks,
    and hard disk drives.


    +   - **3½ Floppy:** The floppy disk drive. To access files on a floppy disk,
    double click the floppy disk icon.

    +   - **Local Disk:** The hard disk drive. Typically the C: drive is the main
    drive where the files for Windows 2000 are stored. It is possible to have multiple
    local disks. To access the files and folders, double click the local disk icon.

    +   - **Compact Disk:** The CD-ROM drive. Double clicking on the compact disk
    icon will give access to the files and folders on the CD. CDs are read only if
    a **CDR/RW** drive is present.


    Each taskbar button represents an open program (a “task in progress”)


