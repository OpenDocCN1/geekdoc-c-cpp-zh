    # Graphical User Interface


    Computers were traditionally very difficult to use, requiring the user to memorize
    and type in the necessary commands (this is called a command line interface).
    To make computers more accessible, the **graphical user interface (GUI)** was
    developed. In a GUI, the user interacts with a graphical display on the screen
    containing icons and windows and controls. Commands are chosen from menus rather
    than typed in.


    The GUI was developed at the Xerox Palo Alto Research Center, but the management
    at Xerox failed to see the usefulness of it. When Steve Jobs of Apple saw the
    GUI, however, he recognized its value. Apple licensed the concepts from Xerox,
    developed them further, and released the first successful GUI computer, the **Macintosh**,
    in 1984. Macintosh computers used the Motorola 68000 series of micro-processors
    (and later the PowerPC series of microprocessors).


    Microsoft was also quick to realize the worth of a GUI, but its graphical user
    interface, **Windows**, was slow in displacing DOS on PCs (the first versions
    of Windows left much to be desired).


    # GENERATION OF COMPUTERS


    The history of computer development is often referred to in reference to the different


    generations of computing devices. Each generation of computer is characterized
    by a major technological development that fundamentally changed the way computers
    operate, resulting in increasingly smaller, cheaper, and more powerful and more
    efficient and reliable devices.


    # First Generation (1940–1956):

    Vacuum Tubes


    The first computers used vacuum tubes for circuitry and magnetic drums for memory,
    and were often enormous, taking up entire rooms. They were very expensive to operate
    and in addition to using a great deal of electricity, generated a lot of heat,
    which was often the cause of malfunctions. First generation computers relied on
    machine language to perform operations, and they could only solve one problem
    at a time. Input was based on punched cards and paper tape, and output was displayed
    on printouts.


    The UNIVAC and ENIAC computers are examples of first generation computing devices.
    The UNIVAC was the first commercial computer delivered to a business client, the
    US Census Bureau in 1951.


    # Second Generation (1956–1963):

    Transistors


    Transistors replaced vacuum tubes and ushered in the second generation of computers.
    The transistor was invented in 1947 but did not see widespread use in computers
    until the late 1950s. The transistor was far superior to the vacuum tube, allowing
    computers to become smaller, faster, cheaper, more energy-efficient and more reliable
    than their first generation predecessors. Though the transistor still generated
    a great deal of heat that subjected the computer to damage, it was a vast improvement
    over the vacuum tube. The second-generation computers still relied on punched
    cards for input and printouts for output.


    The second generation computers moved from cryptic binary machine language to
    symbolic, or assembly, languages, which allowed programmers to specify instructions'
