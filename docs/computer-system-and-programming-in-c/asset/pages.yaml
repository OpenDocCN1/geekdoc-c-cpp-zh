- pgno: 71
  md: '# Managing File and Folders


    In Windows 98, you can organize your documents and programs to suit your preferences.
    You can store these files in folders, and you can move, copy, and even search
    for files and folders.


    # Creating Folders


    The following are the steps which we have to follow for creating a New Folder
    in Windows 98.


    +   1. Select the Drive or Folder you want to create your Folder in

    +   2. Right click in the right pane in the white area

    +   3. Select **New**

    +   4. Select **Folder**

    +   5. Type in name for that Folder


    Graphically the process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_71_0.png)


    File names in Windows 98 can be up to 255 characters including spaces. However,
    file names cannot contain any of these characters: \\ / : * ? " < > |.


    # Deleting a File or Folder


    The following are the steps which we have to follow for deleting a file in Windows
    98.


    +   1. Select the File/Folder you want to delete

    +   2. Hit the Delete Key on the keyboard

    +   3. Confirm Deletion


    When you delete any file or folder then it is automatically stores in the Recycle
    Bin.


    # To Restore a File from Recycle Bin


    When we want to delete any file then the file automatically goes to Recycle Bin
    and if we want to restore a file from Recycle Bin then we have to follow the following
    steps:


    +   1. Double click Recycle Bin icon on the Desktop.

    +   2. Select the desired file in recycle Bin

    +   3. Click Restore command in the file menu.


    If you delete a file at the command prompt from a floppy disk (A: or B: drive),
    it does not go into the Recycle Bin.


    # Moving/Copying Files to Different Folders


    The following are the steps which we have to follow for Moving/Copying files to
    different folders.


    +   1. Select the Folder you want to move or copy

    +   2. **To Move File**—Simply drag it to the destination you want it to go to

    +   3. **To Copy File**—Click on Edit → Copy from the top of the screen. Then
    go to the destination folder and click Edit → Paste


    # Copying a File/Folder to a Floppy Disk


    The following are the steps which we have to follow for copying a file/folder
    to a floppy disk.


    +   1. Select the Folder you want to move or copy

    +   2. Right click on the file or folder in the right pane

    +   3. Select **Send To** →

    +   4. Select **3.5 Floppy (A)**

    +   5. You can also drag the file to 3.5” Floppy (A:\) in the left pane


    Graphically the process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Copying a File/Folder from a Floppy Disk to Other Drive


    The following are the steps which we have to follow for copying a file/folder
    from a floppy disk to other drive:


    +   1. Select 3.5 Floppy (A:) in the left pane

    +   2. Select the File/Folder you want to copy from the floppy drive

    +   3. Drag it to your destination


    # Renaming a File or Folder


    The following are the steps which we have to follow for renaming a file or folder.


    +   1. Select the file or Folder you want to rename

    +   2. Right click on it

    +   3. Select **Rename**

    +   4. Rename File


    Graphically the process is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_72_0.png)


    # Finding Files on Your Computer


    The following are the steps which we have to follow for finding files on our computer
    system.


    +   1. Click on the **Start**

    +   2. Click on **Find**

    +   3. Select the **Find Files or Folders**

    +   4. Enter your search criteria. You do not need to complete every field. Only
    enter the criteria you want to use for your search. Switch through the different
    tabs (Date, Advanced, Name and Location) to further your search

    +   5. Click the **Find Now** button


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_72_1.png)


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_72_2.png)


    # Searching Using Wildcard Characters


    A wildcard character is a keyboard character such as an asterisk (*) or a question
    mark (?) that is used to represent one or more characters when you are searching
    for files, folders, printers, computers, or people. Wildcard characters are often
    used in place of one or more characters when you do not know what the real character
    is or you do not want to type the entire name.


    The following table shows the working of (*) and (?) Wildcard characters:


    | Wildcard character | Uses |

    |---|---|

    | **Asterisk (*)** | Use the asterisk as a substitute for zero or more characters.
    If you are looking for a file that you know starts with “gloss” but you cannot
    remember the rest of the file name, type the following: **gloss*** This locates
    all files of any file type that begin with “gloss” including Glossary.txt, Glossary.doc,
    and Glossy.doc. To narrow the search to a specific type of file, type: **gloss*.doc**
    This locates all files that begin with “gloss” |'
