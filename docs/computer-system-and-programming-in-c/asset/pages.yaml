- pgno: 325
  md: "+   - Linux (tested on Linux Ubuntu 6.06 LTS, Dapper Drake)\n\n**e. _Reasonable\
    \ Learning Curve for Developers_**  \nAndroid applications are written in a well-respected\
    \ programming language: Java. The Android application framework includes traditional\
    \ programming constructs, such as threads and processes and specially designed\
    \ data structures to encapsulate objects commonly used in mobile applications.\
    \ Developers can rely on familiar class libraries, such as java.net and java.text.\
    \ Specialty libraries for tasks like graphics and database management are implemented\
    \ using well-defined open standards like OpenGL Embedded Systems (OpenGL ES) or\
    \ SQLite.\n\n**f. _Enabling Development of Powerful Applications_**  \nIn the\
    \ past, handset manufacturers often established special relationships with trusted\
    \ third-party software developers (OEM/ODM relationships). This elite group of\
    \ software developers wrote native applications, such as messaging and Web browsing,\
    \ which shipped on the handset as part of the phone’s core feature set. To design\
    \ these applications, the manufacturer would grant the developer a privileged\
    \ inside access and knowledge of a handset’s internal software framework and firmware.\n\
    \nOn the Android platform, there is no distinction between native and third-party\
    \ applications, enabling healthy competition among application developers. All\
    \ Android applications use the same libraries. Android applications have unprecedented\
    \ access to the underlying hardware, allowing developers to write much more powerful\
    \ applications.\n\nApplications can be extended or replaced altogether. For example,\
    \ Android developers are now free to design email clients tailored to specific\
    \ email servers such as Microsoft Exchange or Lotus Notes.\n\n**g. _Rich, Secure\
    \ Application Integration_**  \nIf you recall the story I previously shared, you\
    \ will note that I accessed a wide variety of phone applications in the course\
    \ of a few moments: text messaging, phone dialer,\n\ncamera, email, picture messaging,\
    \ and the browser. Each was a separate application running on the phone—some built-in\
    \ and some purchased. Each had its own unique user interface. None were truly\
    \ integrated. Not so with Android. One of the Android platform’s most compelling\
    \ and innovative features is well-designed application integration. Android provides\
    \ all the tools necessary to build a better “bat trap,” if you will, by allowing\
    \ developers to write applications that leverage core functionality such as Web\
    \ browsing, mapping, contact management, and messaging seamlessly. Applications\
    \ can also become content providers and share their data among each other in a\
    \ secure fashion.\n\nPlatform like Sygma have suffered from setbacks due to malware.\
    \ Android’s vigorous application security model helps protect the user and the\
    \ system from malicious software.\n\n**h. _No Costly Obstacles to Publication_**\
    \  \nAndroid applications have none of the costly and time-intensive testing and\
    \ certification programs required by other platforms such as BREW and Symbian.\n\
    \n**i. _A “Free Market” for Applications_**  \nAndroid developers are free to\
    \ choose any kind of revenue model they want. They can develop freeware, shareware,\
    \ or trial-ware applications, ad-driven, and paid applications. Android was designed\
    \ to fundamentally change the rules about what kind of wireless applications could\
    \ be developed. In the past, developers faced many restrictions that had little\
    \ to do with the application functionality or features:\n\n+   - Store limitations\
    \ on the number of competing applications of a given type.\n+   - Store limitations\
    \ on pricing, revenue models, and royalties.\n+   - Operator unwillingness to\
    \ provide applications for smaller demographics.\n\nWith Android, developers can\
    \ write and successfully publish any kind of application they want. Developers\
    \ can tailor applications to small demographics, instead of just large-scale money-making\
    \ ones often insisted upon by mobile operators. Vertical market applica-"
