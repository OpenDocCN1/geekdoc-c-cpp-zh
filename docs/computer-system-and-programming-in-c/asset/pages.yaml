  md: '# 最高人民法院

    关于办理减刑、假释案件具体应用法律的规定


    （2016年9月26日最高人民法院审判委员会第1691次会议通过，自2017年1月1日起施行）


    法释〔2016〕23号


    根据《中华人民共和国刑法》《中华人民共和国刑事诉讼法》的有关规定，结合审判实践，现就办理减刑、假释案件具体应用法律的若干问题规定如下：


    第一条 减刑、假释是激励罪犯改造的刑罚执行制度，减刑、假释的适用应当贯彻宽严相济刑事政策，最大限度地发挥刑罚的功能，实现刑罚的目的。


    第二条 对于罪犯符合刑法第七十八条第一款规定“可以减刑”条件的案件，在人民法院作出减刑裁定前，应当征求人民检察院的意见。人民检察院对人民法院作出的假释裁定或者假释建议书，认为不当的，应当在法定期限内提出书面意见。


    第三条 确有悔改表现是指同时具备以下条件：


    +   （一）认罪悔罪；

    +   （二）遵守法律法规及监规，接受教育改造；

    +   （三）积极参加思想、文化、职业技术教育；

    +   （四）积极参加劳动，努力完成劳动任务。


    对职务犯罪、破坏金融管理秩序和金融诈骗犯罪、组织（领导、参加、包庇、纵容）黑社会性质组织犯罪等罪犯，不积极退赃、协助追缴赃款赃物、赔偿损失，或者服刑期间利用个人影响力和社会关系等不正当手段意图获得减刑、假释的，不认定其“确有悔改表现”。'
