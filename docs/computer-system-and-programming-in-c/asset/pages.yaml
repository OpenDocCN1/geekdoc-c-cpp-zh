  md: 'Here, the braces around the definition force the expression to be evaluated
    before any surrounding operators are applied. This should make the macro more
    reliable.


    # #UNDEF


    This preprocessor is used to undefine a preprocessor previously defined preprocessor
    to prevent bugs and misuse. Also they are necessary for proper use of #ifdef and
    #ifndef preprocessor. This preprocessor in other word is used for localization
    of MACROs only to the section of code which requires them. Once undefined the
    macro cannot be no longer referenced in code after #undef statement.


    General form of #undef preprocessor is as follows:


    ```

    #undef MACRO_NAME

    The following example shows the working of #undef.

    #include <stdio.h>

    #include<iostream.h>

    #define PIE 3.14

    #define AREA (PIE)*(x)*(x)

    #undefine PIE //PIE cannot be longer used but Area can be.

    void main ()

    {

    clrscr();

    printf ("%f", AREA (10)); //Prints 314.159265 ... as answer.

    getch();

    }

    ```


    # #ERROR


    The use of this preprocessor is in debugging. Whenever this preprocessor is encountered
    during compilation the compiler would stop compilation and display the error message
    associated with the preprocessor in compilation output/result Window. Depending
    upon compiler any other debugging information will also accompany your error message.
    The general syntax of #error is as follows:


    ```

    #error message

    Also note that message does not need to be in double quotes.

    ```


    The following example shows the working of #error.

    #include <stdio.h>

    #include<iostream.h>

    void main ()

    {

    clrscr();

    #error i am error and while i am here i will not let this program compile

    getch();

    }


    # READING FROM OTHER FILES USING # INCLUDE


    The preprocessor directive #include is an instruction to read in the entire contents
    of another file at that point. This is generally used to read in header files
    for library functions. Header files contain details of functions and types used
    within the library. They must be included before the program can make use of the
    library functions. The general syntax of #include is as follows:


    ```

    #include <filename.h>

    Or

    #include “filename.h”

    ```


    The above instruction causes the contents of the file “filename.h” to be read,
    parsed, and compiled at that point. The difference between the using of # and
    “ ” is that, where the preprocessor searches for the filename.h. For the files
    enclosed in < > (less than and greater than symbols) the search will be done in
    standard directories (include directory) where the libraries are stored. And in
    case of files enclosed in “ ” (double quotes) search will be done in “current
    directory” or the directory containing the source file. Therefore, “ ” is normally
    used for header files you have written, and # is normally used for headers which
    are provided for you (which someone else has written). Library header file names
    are enclosed in angle brackets, < >. These tell the preprocessor to look for the
    header file in the standard location for library definitions.


    This is /usr/include for most UNIX systems. And c:/tcl/include for turbo compilers
    on DOS/WINDOWS based systems. Use of #include for the programmer in multi-file
    programs,'
