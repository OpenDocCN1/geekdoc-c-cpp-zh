  md: "# Automatic Storage Class\n\nThe following are the key points for the automatic\
    \ storage class\n\n+   - They are declared at the start of a program’s block such\
    \ as in the curly braces ({ }). Memory is allocated automatically upon entry to\
    \ a block and freed automatically upon exit from the block.\n+   - The scope of\
    \ automatic variables is local to the block in which they are declared, including\
    \ any blocks nested within that block. For these reasons, they are also called\
    \ **local variables**.\n+   - No block outside the defining block may have direct\
    \ access to automatic variables (by variable name), but they may be accessed indirectly\
    \ by other blocks and/or functions using pointers.\n+   - Automatic variables\
    \ may be specified upon declaration to be of storage class auto. However, it is\
    \ not required to use the keyword auto because by default, storage class within\
    \ a block is auto.\n+   - Automatic variables declared with initializers are initialized\
    \ every time the block in which they are declared is entered or accessed.\n\n\
    The features of a variable defined to have an automatic storage class are as follows:\n\
    \n| Storage | Memory |\n|---|---|\n| Default initial value | An unpredictable\
    \ value, which is often called a garbage value |\n| Scope | Local to the block\
    \ in which the variable is defined |\n| Life | Till the control remains within\
    \ the block in which the variable is defined |\n\nThe following program shows\
    \ how an automatic storage class variable is declared, and the fact that if the\
    \ variable is not initialized it contains a garbage value.\n\n```\n```c\nvoid\
    \ main( )\n{\nauto int i, j;\nprintf ( “\\n%d %d”, i, j );\n}\n```\n```\n\nThe\
    \ output of the above program could be...\n1223 1224\n\nWhere, 1223 and 1224 are\
    \ garbage values of i and j. When you run this program you may get different values,\
    \ since garbage values are unpredictable. So always make it a point that you initialize\
    \ the automatic variables properly, otherwise you are likely to get unexpected\
    \ results. Note that the keyword for this storage class is **auto**, and not automatic.\n\
    \nScope and life of an automatic variable is illustrated in the following program.\n\
    \n```\n```c\nvoid main( )\n{\n    auto int i = 2;\n    {\n        printf ( “\\\
    n%d”, i );\n    }\n    printf ( “%d”, i );\n}\n```\n```\n\nThe output of the above\
    \ program is:\n2 2 2\n\nThis is because, all **printf ( )** statements occur within\
    \ the outermost block (a block is all statements enclosed within a pair of braces)\
    \ in which i has been defined. It means the scope of i is local to the block in\
    \ which it is defined. The moment the control comes out of the block in which\
    \ the variable is defined, the variable and its value is irretrievably lost.\n\
    \nTo understand this go through the following program segment\n\n```\n```c\nvoid\
    \ main ( )\n{\n    auto int i = 4;\n    {\n        auto int i = 5;\n        {\n\
    \            auto int i = 6;\n            printf ( “\\n%d”, i );\n        }\n\
    \        printf ( “%d”, i );\n    }\n    printf ( “%d”, i );\n}\n```\n```\n\n\
    The output of the above program would be:\n6 5 4"
