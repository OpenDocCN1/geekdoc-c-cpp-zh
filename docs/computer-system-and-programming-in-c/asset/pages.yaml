    # CLASSIFICATION OF ARRAYS


    Arrays can be classified in the following categories:


    +   1. Single dimensional array

    +   2. Multidimensional array (2-Dimensional array, 3-Dimensional array)


    # SINGLE DIMENSIONAL ARRAY


    If we want to store the data linearly, i.e. we want to store more than one data
    items of the same type then we have to use the concept of single dimensional array.


    The general syntax for defining a single dimensional array is as follows:

    <Data type> <array name> [size];

    Where data type is a valid type (like int, float...), array name is a valid identifier
    and the elements field (which is always enclosed in square brackets []), specifies
    how many of these elements the array has to contain.


    The following are some of declarations for arrays:


    ```

    int ar[100];

    float b[50];

    char cr[45];

    ```


    There are two restrictions for using arrays in C language.


    +   • The amount of storage for a declared array has to be specified at compile
    time before execution. This means that an array has a fixed size.


    +   • The datatype of an array applies uniformly to all the elements; for this
    reason, an array is called a homogeneous data structure.


    For example, an array to contain 5 integer values of type int called billy could
    be represented like this:


    Where each blank panel represents an element of the array, in this case are integer
    values of type int. These elements are numerated from 0 to 4 since in arrays the
    first index is ever 0, independently of its length.


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_208_1.png)


    Therefore, in order to declare an array called billy as the one shown in the above
    diagram it is as simple as:

    int billy [5];


    **Note:** The elements field within brackets [] which represents the number of
    elements the array is going to hold, must be a constant value, since arrays are
    blocks of non-dynamic memory whose size must be determined before execution.


    # Size Specification of Single Dimensional Array


    The size of an array should be declared using symbolic constant rather a fixed
    integer quantity (the subscript used for the individual element is integer quantity).
    The use of a symbolic constant makes it easier to modify a program that uses an
    array. All reference to minimize the array size can be altered simply by changing
    the value of the symbolic constant.


    To declare size as 50 use the following symbolic constant, SIZE, defined:


    ```

    #define SIZE 50

    ```


