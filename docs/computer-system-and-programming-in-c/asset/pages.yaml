    # *Floating Point Constants or Real Constants*


    Real constants are also named floating point constants. The real constants could
    be written in two forms—Fractional form and Exponential form.


    # Rules for Constructing Floating Point Constants


    The following rules are observed while constructing real constants expressed in
    fractional form:


    +   - A real constant must have at least one digit.

    +   - It must accept a decimal point

    +   - It could be either positive or negative

    +   - Default sign is positive

    +   - No commas or blanks are allowed within a real constant


    Example of valid floating point constants

    +325.38      42.56      −32.78      −48.589


    Examples of invalid floating point numbers are as follows:


    The exponential form of representation of real constants is usually used if the
    value of the constant is either too small or too large.


    In the exponential form of representation, the real constant is represented in
    two parts. The part appearing before ‘e’ is called mantissa, whereas the part
    following ‘e’ is called exponent.


    # Rules for constructing floating point constants when it is treated as an exponent
    form


    The following rules must be observed while constructing real constants expressed
    in exponential form:


    +   - The mantissa part and the exponential part should be separated by a letter
    e.

    +   - The mantissa part may have a positive or negative sign.

    +   - Default sign of mantissa part is positive.

    +   - The exponent must have at least one digit, which must be a positive or negative
    integer. Default sign is positive.

    +   - Range of real constants expressed in exponential form is −3.4e38 to 3.4e38.


    # Examples


    3.2e−5      4.1e8      −0.2e+3      3.2...e−5


    # *Character Constants*


    This constant is a single character enclosed in apostrophes ‘ ’. For example,
    some of the character constants are shown below:

    ‘B’, ‘X’, ‘4’, ‘$’


    ‘\0’ is a null character having value zero. Character constants have integer values
    associated depending on the character set adopted for the computer. ASCII character
    set is in use which uses 7-bit code with 2⁷ = 128 different characters. The digits
    0–9 are having ASCII value of 48–56 and ‘A’ having ASCII value from 65 and ‘a’
