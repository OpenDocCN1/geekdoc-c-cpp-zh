  md: '# Rules for Constructing Character Constants


    The following rules must be observed while constructing character constants:


    +   - A character constant is a single alphabet, a single digit or a single special
    symbol enclosed within single inverted commas. Both the inverted commas should
    point to the left. For example, ‘A’ is a valid character constant whereas ‘A’
    is not.

    +   - The maximum length of a character constant can be 1 character. Ex.: ‘C’


    # Escape Sequence


    There are some non-printable characters that can be printed by preceding them
    with ‘\\’ backslash character. Within character constants and string literals,
    you can write a variety of **escape sequences**. Each escape sequence determines
    the code value for a single character.


    You can use escape sequences to represent character codes which are as follows:


    +   - You cannot otherwise write (such as \\n)

    +   - That can be difficult to read properly (such as \\t)

    +   - That might change value in different target character sets (such as \\a)

    +   - That must not change in value among different target environments (such
    as \\0)


    The following is the list of the escape sequences:


    | Escape sequence | Character |

    |---|---|

    | `\\n` | New line |

    | `\\r` | Carriage return |

    | `\\t` | Tab |

    | `\\v` | Vertical tab |

    | `\\b` | Backspace |

    | `\\f` | Form feed (page feed) |

    | `\\a` | Alert (beep) |

    | `\\''` | Single quote (‘) |

    | `\\"` | Double quote (”) |

    | `\\?` | Question mark (?) |

    | `\\\\` | Backslash (\\) |


    # String Constants


    String constants consist of collection of characters enclosed within double quotes.


    **Example**


    ”Red light”  ”Blue Sea hundred”  ”hello world”.


    # Symbolic Constants


    Symbolic constant is a name that substitutes for a sequence of characters or a
    numeric constant, a character constant or a string constant. When program is compiled
    each occurrence of a symbolic constant is replaced by its corresponding character
    sequence.


    The syntax is as follows:

    `#define name text`

    Where name implies symbolic name in caps, text implies value or the text.


    **Example**


    ```

    #define Q 100

    #define MAX1 100

    #define TRUE 1

    #define FALSE 0

    #define SIZE 10

    ```


    The # character is used for preprocessor commands. A *preprocessor* is a system
    program, which comes into action prior to Compiler, and it replaces the replacement
    text by the actual text.


    *Advantages of using symbolic constants*

    The advantages of using symbolic constants are as follows:


    +   - They can be used to assign names to values

    +   - Replacement of value has to be done at one place and wherever the name appears
    in the text it gets the value by execution of the preprocessor. This saves time.
    If the symbolic constant appears 20 times in the program; it needs to be changed
    at one place only.


    # USER DEFINED TYPE DECLARATION


    In C language a user can define an identifier that represents an existing data
    type. The user defined data type identifier can later be used to declare variables.


    The general syntax of defining a user defined type is as follows:


    ```

    typedef type identifier;

    where type represents existing data type and ‘identifier’ refers to the name given
    to the data type.

    ```


    **Example**


    ```

    typedef int salary;

    typedef float average;

    ```'
