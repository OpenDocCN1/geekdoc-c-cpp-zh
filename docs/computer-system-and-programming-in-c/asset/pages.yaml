  md: 'Grouping defines the precedence order in which operators are evaluated in the
    case that there are several operators of the same level in an expression.


    All these precedence levels for operators can be manipulated or become more legible
    by removing possible ambiguities using parentheses signs ( and ), as in this example:


    `a = 5 + 7 % 2;`


    might be written either as:


    `a = 5 + (7 % 2);`


    or


    `a = (5 + 7) % 2;`


    Depending on the operation that we want to perform.


    So if you want to write complicated expressions and you are not entirely sure
    of the precedence levels, always admit parentheses. It will also become a code
    lighter to read.


