  md: '# ENIAC: The First General-purpose Electronic Computer


    The first general-purpose digital electronic computer, one that could be programmed
    to perform a variety of calculational tasks, was the ENIAC (Electronic Numerical
    Integrator and Calculator). It was designed and built in the fall of 1945 by John
    Mauchly and J. Presper Eckert. ENIAC was originally built to calculate ballistic
    tables for the US military to aim their big guns.


    ENIAC was a monster of a machine, filling a large room and weighing 30 tons. It
    included 18,000 vacuum tubes and used 200 kilowatts of electrical power (the lights
    dimmed in its Philadelphia neighborhood when it was first turned on). ENIAC was
    the first general-purpose computer because it could be programmed (given different
    sets of instructions to follow) by the cumbersome procedure of reconnecting cables
    and flipping switches.


    Later computers were much more flexible because they incorporated the idea of
    stored programs, conceived in 1945 by mathematician John Von Neumann (who worked
    on the Manhattan Project in Los Alamos). In this scheme, both the data being manipulated
    and the program of instructions for the computer are stored in memory. Modern
    computers use this same method.


    Mauchly and Eckert later went on to work for the Univac division of Remington
    Rand corporation. The UNIVAC I (Universal Automatic Computer) was the first commercial
    computer, coming out in 1951.


    IBM (International Business Machines) entered the computer market in 1953 with
    its 701 computer (Fig. 1.48). By 1960, IBM was the dominant force in the market
    of large mainframe computers. Smaller players in the mainframe market included
    Burroughs, Control Data, General Electric, Honeywell, NCR, RCA, and UNIVAC.


    # Transistors and Integrated Circuits


    Vacuum tubes consume lots of electrical power and are prone to burning out, which
    caused problems for early computers that used thousands of them. By 1960, the
    transistor replaced the vacuum tube as the electrical switching device in computers.
    The transistor (developed at Bell Labs by William Shockley and others in the 1950s)
    is a solid-state semiconductor device typically made of silicon or germanium.
    It is much smaller, much more reliable, and consumes much less energy than a vacuum
    tube. A vacuum tube computer that previously filled a sizable portion of a room
    could be replaced by a transistorized computer system that filled a few cabinets.
    A good example of an early computer using transistors is the IBM 360, which dominated
    the mainframe computer market in the mid to late 1960s.


    The early 1960s also saw the development of the microchip, or integrated circuit
    (IC), invented by Jack Kirby and Robert Noyce (Fig. 1.49). An integrated circuit
    incorporates many transistors and other electrical components, all formed into
    a miniature circuit onto a single chip of silicon.


    The invention of the integrated circuit allowed computers to become even smaller,
    with the whole central processing unit (CPU) of the computer fitting onto one
    circuit board. These minicomputers were cheaper and smaller than a mainframe (the
    computer was roughly the size of a drawer in a large filing cabinet) allowing
    many more businesses and universities to afford their own computer systems.


    The most successful minicomputers were the PDP and Vax series made by Digital
    Equipment Corporation (DEC). Mini-computers were multi-user systems, in much the
    same way as mainframe computers, but on a smaller scale.


    Minicomputers are now a mainly obsolete class of computer, having been largely
    replaced by high-end microprocessor workstations.


    # Microprocessors


    As IC technology progressed, chip manufacturers could fit more and more circuitry
    onto the tiny silicon chips. By 1971, a company named Intel developed the first
    microprocessor (also called MPU) that could fit a whole CPU'
