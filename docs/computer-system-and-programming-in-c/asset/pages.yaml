  md: '# Branching in Structured Programming


    There are two types of branching statements. The if statement is used for conditional
    execution of a single statement or to select which of two statements is to be
    executed. The case statement (sometimes referred to as the select statement) allows
    for selection of one statement out of three or more that should be executed.


    # If Statement


    Statements can be executed conditionally by using an if statement. The if statement
    specifies a condition which gets tested when the if statement is executed. If
    the condition is true then the following statement is executed otherwise processing
    skips that statement.


    Optionally a second statement can be attached to the if statement that will be
    executed if the condition is false.


    Graphically an if statement is represented as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_101_0.png)


    The pseudocode of the above construct is as follows:


    ```

    ```text

    if condition

    true-statement

    else

    false-statement

    ```

    ```


    # Example


    ```

    ```text

    if x > y

    print “x is bigger than y”

    else

    print “x is not bigger than y”

    ```

    ```


    # Case Statement


    A case or select statement allows for one of a number of statements to be executed
    depending on the value of a field. There is usually also an additional statement
    which is executed if none of the specified values is matched. The graphical representation
    of case statement is as follows:


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_101_1.png)


    The pseudocode of the above construct is as follows:


    ```

    ```text

    case fieldname

    value1: statement-1

    value2: statement-2

    value3: statement-3

    otherwise: other-statement

    ```

    ```


    # Example


    ```

    ```text

    case size

    1: print “small”

    2: print “medium”

    3: print “large”

    otherwise: print “unknown”

    ```

    ```


    # Loops in Structured Programming


    Loops allow for the same statement to be executed a number of times in succession.
    There are three different loop constructs that can be used depending on whether
    the number of repetitions is known and also (where the number of repetitions is
    not known and is dependent on a condition) whether the loop is allowed to be bypassed
    if the termination condition is met before the loop is first executed.


    # For Loop


    A for loop allows a statement to be executed a specified number of times. Graphically
    a for loop statement is represented as follows:'
