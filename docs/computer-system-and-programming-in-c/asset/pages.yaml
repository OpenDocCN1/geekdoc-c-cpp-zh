- pgno: 78
  md: '# Fundamental of Programming


    Computer programming is the procedure of writing, testing, debugging/troubleshooting,
    and maintaining the source code of programs. This source code is written in a
    programming language. The code may be a change of an existent source or something
    completely new. The purpose of programming is to produce a program that exhibits
    a certain desired behavior (customization). The process of writing source code
    needs expertise in many different subjects, including knowledge of the application
    domain, specialized algorithms and formal logic.


    In the context of programming environment we will discuss the following terms:


    +   - Assembler

    +   - Compiler

    +   - Interpreter

    +   - Linker

    +   - Loader


    # PROGRAMMING ENVIRONMENT


    A programming environment incorporated into a software application that furnishes
    a GUI builder, a text or code editor, a compiler and/or interpreter and a debugger.


    Graphically the programming environment may be represented as shown in Fig. 3.1.


    # Assembler


    Assembler is a program that translates programs from assembly language to machine
    language.


    # Compiler


    A program that transforms *source code* into *object code*. The compiler gains
    its name from the way it works, looking at the entire piece of source code and
    collecting and reorganizing the instructions. Thus, a compiler differs from an
    *interpreter*, which examines and fulfills each line of source code in succession,
    without looking at the entire program. The advantage of interpreters is that they
    can accomplish a program immediately. Compilers need some time before an executable
    program emerges. However, programs produced by compilers run much quicker than
    the same programs executed by an interpreter.


    Every high-level programming language (except strictly interpretive languages)
    accompanies a compiler. In effect, the compiler is the language, because it defines
    which instructions are satisfactory.


    Because compilers transform source code into object code, which is unique for
    each type of computer, many compilers are usable for the same language. For example,
    there is a


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_78_0.png)


    Fig. 3.1: Programming environment'
