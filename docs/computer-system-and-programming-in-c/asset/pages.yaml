    for a desktop computer system is as follows:


    +   1. Processor: Intel® Pentium® 4 processor, 3 GHz, with 800 MHz front side
    bus, 512 KB Level 2 Cache.

    +   2. Microsoft® Windows® XP Professional.

    +   3. Memory: 512 MB DDR SDRAM at 400 MHz (expandable to 4 GB).

    +   4. Hard drive: 250 GB Serial ATA, 7 ms seek time, 7200 RPM, 512 Kb cache.

    +   5. Floppy drive: 3.5” 1.44 MB.

    +   6. Optical drive: 12× DVD-ROM / 48× CD-RW combo drive.

    +   7. Expansion slots: 1 AGP and 5 PCI.

    +   8. External ports: Six USB 2.0 (two on front panel), one Parallel, one Serial,
    two PS/2, and one IEEE 1394.

    +   9. Modem: 56 K PCI FAX/modem.

    +   10. Video card: 256 MB RADEON™ 9800 AGP graphics card.


    +   11. Monitor: 17” CRT (16” viewable), 1,024 × 768, 27 dp.

    +   12. Sound card: Sound Blaster® Audigy™2 card w/Dolby® 5.1 stereo.

    +   13. Speakers: Bose® B775 surrounds sound speaker system with subwoofer.

    +   14. Networking: Ethernet 10/100.

    +   15. Keyboard: 101-key multifunction keyboard.

    +   16. Mouse: Logitech® MX™ 500 optical mouse with scroll wheel.

    +   17. Case: Tower case with 6 expansion bays (two for internal-only drives).

    +   18. Application Software: Microsoft® Office Professional 2003.


    # COMPUTER SOFTWARE


    Computer software means computer instructions or data. Anything that can be stored
    electronically is software. The storage devices and display devices are hardware.


    The terms **software** and **hardware** are used as both nouns and adjectives.
    For example, you can say: “The problem lies in the software,” meaning that there
    is a problem with the program or data, not with the computer itself. You can also
    say: “It is a software problem.”


    The distinction between software and hardware is sometimes confusing because they
    are so integrally linked. Clearly, when you purchase a program, you are buying
    software. But to buy that software, you need to buy the disk (hardware) on which
    the software is recorded.


    We know software is a set of instructions that are used to carry out a task. Software
    can be grouped into two categories namely application software and system software.
    The application software is one, which is application oriented, for example inventory
    program and payroll program. Similarly, system software is used for system oriented
    tasks. Examples are compilers, assemblers and loaders.


    # Classification of Software


    +   Softwares are classified into two major categories:

    +   (a) Application software

    +   (b) System software'
