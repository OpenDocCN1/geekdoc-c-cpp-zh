    # (c) *log10*


    log10 function is used to compute base-10 logarithm

    The general syntax of log10 is as follows:


    ```

    double log10 (double x );

    float log10 (float x );

    long double log10 (long double x );

    ```


    The above function returns the base-10 logarithm of *x*.


    # Parameters


    x-floating point value.

    If the argument is negative, a domain error comes, setting the global variable
    errno to the value EDOM.

    If it is zero, the function returns a negative HUGE_VAL and determines the value
    of the global variable errno to the ERANGE value.


    # Return value


    Base-10 logarithm of *x*, for values of *x* greater than zero.


    # Portability


    In C, only the double version of this function exists with this name.


    # Example


    ```

    #include <stdio.h>

    #include <math.h>

    #include<conio.h>

    void main ()

    {

    double param, result;

    param = 1000.0;

    clrscr();

    result = log10 (param);

    printf ("log10(%lf) = %lf\n", param, result );

    getch();

    }

    ```


    The output of the above program is as follows:

    log10(1000.000000) = 3.000000


    # (d) *modf*


    modf is a function which is used to break into fractional and integral parts.

    The general syntax of modf function is as follows


    ```

    double modf ( long double x, long double * intpart );

    long double modf ( long double x, long double * intpart );

    float modf ( float x, float * intpart );

    ```


    The above function Breaks x into two parts: the integer part (stored in the object
    pointed by intpart) and the fractional part (returned by the function). Each component
    has the same sign as x.


    # Parameters


    The following are the parameters which we have to pass in the modf() function.


    # x-floating point value


    intpart

    Pointer to an object where the integral part is to be stored.


    # Return value


    The above function returns the fractional part of x, with the same sign.


    # Portability


    In C, only the double version of this function exists with this name.


    # Example


    ```

    #include <stdio.h>

    #include <math.h>

    #include<conio.h>

    void main ()

    {

    double param, fracpart, intpart;

    clrscr();

    param = 3.14159265;

    fracpart = modf (param, &intpart);

    printf ("%lf = %lf + %lf \n", param, intpart, fracpart);

    ```'
