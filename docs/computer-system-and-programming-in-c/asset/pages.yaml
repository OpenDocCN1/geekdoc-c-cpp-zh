- pgno: 86
  md: 'programming to diagram the path in which information is treated through a computer
    to obtain the desired results. Flow chart is a pictorial illustration of an algorithm.
    It makes use of symbols which are connected among them to indicate the flow of
    information and processing. It will show the general outline of how to solve a
    problem or perform a task. It is prepared for better understanding of the algorithm.


    # Basic Symbols Used in Flow Chart Design


    The following basic symbols are used in the design of flow charts


    | Symbol | Meaning |

    |---|---|

    | Rounded rectangle | Start/End |

    | Diamond | Question, decision (use in branching) |

    | Parallelogram | Input/output |

    | Arrows | Lines or arrows represent the direction of the flow of control |

    | Circle | Connector (connect one part of the flow chart to another) |

    | Rectangle | Process, instruction |

    | Annotation symbol | Comments, explanations, definitions |


    The following are the additional symbols followed for advanced programming.


    | Symbol | Meaning |

    |---|---|

    | Hexagon | Preparation (may be used with “do Loops”) |

    | Predefined-process symbol | Refers to a separate flowchart |


    # Example of Flow Chart


    # Problem 1


