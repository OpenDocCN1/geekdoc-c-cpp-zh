    # Scanner


    Scanners have slowly made their way into the everyday lives of the general public.
    They are ways in which graphical images can be inputted into the computer for
    touch-ups or to be distributed via the World Wide Web.


    # Types of Scanner


    There are four types of scanners:


    # Flatbed scanners


    This scanner provides a flat, glass surface to hold pages of paper, books and
    other objects for scanning. The scan head is moved under the glass across the
    page. Sheet feeders are usually optionally available that allow multiple sheets
    to be fed automatically. These are the most commonly used and most versatile scanners.
    The picture of a flatbed scanner is shown in Fig. 1.8


    # Sheet-fed scanners


    A scanner that allows only paper to be scanned rather than books or other thick
    objects. It moves the paper across a stationary scan head. Sheet-fed scanners
    are similar to flatbed scanners. The only difference is that in flatbed scanners
    the image you wish to scan does not move, in sheet-fed scanners the document moves,
    like how the piece of paper moves in a printer. The picture of a Sheet-fed scanner
    is shown in Fig. 1.9.


    # Handheld scanners


    A scanner that is moved across the image to be scanned by hand. Handheld scanners
    are small and less expensive than their desktop counterparts, but rely on the
    dexterity of the


    ![](img/7792ede0bb69d5dc5a8d6bd4f54bd008_21_2.png)'
