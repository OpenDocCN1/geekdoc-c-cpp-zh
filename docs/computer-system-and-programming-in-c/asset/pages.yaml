  md: 'if one of the two operands is a **long double**, the other operand is converted
    to **long double**,

    else if one operand is **double**, the other is converted to **double**,

    else if one operand is **long**, the other is converted to **long**,

    else if one operand is **unsigned**, the other is converted to **unsigned**.


    C converts all operands “up” to the type of largest operand (largest in terms
    of memory requirement, e.g. **float** requires 4 bytes of storage and **int**
    requires 2 bytes of storage so if one operand is int and the other is float, int
    is converted to float).


    All the above mentioned conversions are automatic conversions or implicit conversions.


    Now we also convert one data type to another data type that is known as explicit
    conversion.


    The general syntax is as follows:

    (type) expression

    Where *type* is the standard C data type.


    For example, if you want to make sure that the expression a/5 would evaluate to
    type **float** you would write it as

    `(float) a/5`

    **cast** is an unary operator and has the same precedence as any other unary operator.


    # OPERATORS PRECEDENCE AND ASSOCIATIVITY


    When writing complex expressions with several operands, we may have some doubts
    about which operand is evaluated first and which later. For example, in this expression:


    `a = 5 + 7 % 2`


    we may doubt if it really means:


    `a = 5 + (7 % 2) // with a result of 6, or a = (5 + 7) % 2 // with a result of
    0`


    The correct answer is the first of the two expressions, with a result of 6. There
    is an established order with the priority of each operator, and not only the arithmetic
    ones (those whose preference come from mathematics) but for all the operators
    which can appear in C. From greatest to lowest priority, the priority order is
    as follows:


    | Level | Operator | Description | Associativity |

    |---:|---|---|---|

    | 1 | `::` | Scope | Left-to-right |

    | 2 | `() [] . -> ++ --` | Postfix | Left-to-right |

    | 3 | `reinterpret_cast const_cast static_cast`<br>`++ -- ! ~ sizeof new delete`<br>`&
    * (pointers)` | Unary (prefix)<br>Indirection and reference | Right-to-left |

    | 4 | `+ -`<br>`(type)` | Unary sign operator<br>Type casting | Right-to-left
    |

    | 5 | `* / ->*` | Pointer-to-member | Left-to-right |

    | 6 | `* / %` | Multiplicative | Left-to-right |

    | 7 | `+ -` | Additive | Left-to-right |

    | 8 | `<< >>` | Shift | Left-to-right |

    | 9 | `< <= > >=` | Relational | Left-to-right |

    | 10 | `== !=` | Equality | Left-to-right |

    | 11 | `&` | Bitwise AND | Left-to-right |

    | 12 | `^` | Bitwise XOR | Left-to-right |

    | 13 | `|` | Bitwise OR | Left-to-right |

    | 14 | `&&` | Logical AND | Left-to-right |

    | 15 | `||` | Logical OR | Left-to-right |

    | 16 | `?:` | Conditional | Right-to-left |

    | 17 | `= += -= *= /= %= <<= >>= &= ^= |=` | Assignment | Right-to-left |

    | 18 | `,` | Comma | Left-to-right |'
