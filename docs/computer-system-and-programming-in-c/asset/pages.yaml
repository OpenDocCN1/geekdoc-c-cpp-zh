  md: 'properties of big-O that allow bounds to be simplified. The most important
    property is that big-O gives an upper bound only. If an algorithm is O (N²), it
    does not have to take N² steps (or a constant multiple of N²). But it cannot take
    more than N². So any algorithm that is O (N) is also an O (N²) algorithm. If this
    seems confusing, think of big-O as being like “<”. Any number that is < N is also
    <N².


    +   1. Ignoring constant factors: O (c f (N)) = O (f (N)), where c is a constant;
    for example O (20 N³) = O (N³)

    +   2. Ignoring smaller terms: If a<b then O (a+b) = O (b), for example, O (N²+N)
    = O (N²)

    +   3. Upper bound only: If a<b then an O (a) algorithm is also an O (b) algorithm.
    For example, an O (N) algorithm is also an O (N²) algorithm (but not vice versa).

    +   4. N and log N are bigger than any constant, from an asymptotic view (that
    means for large enough N). So if k is a constant, an O (N + k) algorithm is also
    O (N), by ignoring smaller terms. Similarly, an O (log N + k) algorithm is also
    O (log N).

    +   5. Another consequence of the last item is that an O (N log N + N) algorithm,
    which is O (N (log N + 1)), can be simplified to O (N log N).


    # Worst and Average Case Behavior of an Algorithm


    Worst and average case behaviors of the algorithm are the two measures of performance
    that are usually considered. These two measures can be applied to both space and
    time complexity of an algorithm. The worst case complexity for a given problem
    of size n corresponds to the maximum complexity encountered among all problems
    of size n. For determination of the worst case complexity of an algorithm, we
    choose a set of input conditions that force the algorithm to make the least possible
    progress at each step towards its final goal. In many practical applications it
    is very important to have a measure of the expected complexity of an


    algorithm rather than the worst case behavior. The expected complexity gives a
    measure of the behavior of the algorithm averaged over all possible problems of
    size n.


    As a simple example: Suppose we wish to characterize the behavior of an algorithm
    that linearly searches an ordered list of elements for some value x.


    1 2 3 4 5 ··· N


    In the worst case, the algorithm examines all n values in the list before terminating.


    In the average case, we hypothesize that x will be found at position 1 is 1/n,
    at position 2 is 2/n and so on.


    Therefore, average search cost = 1/n (1 + 2 + 3 + ······ + n) = 1/n (n/2 (n +
    1))


    # STRUCTURED PROGRAMMING


    Structured programming is one of the several different ways in which a programming
    language can be constructed. It was originally introduced as a means of getting
    away from the ‘spaghetti’ code that was used in the early days and to provide
    some means by which programmers could more easily follow the code written by other
    programmers. Structured programming is a procedure oriented method of designing
    and coding a program.


    A structured programming language does not allow just things to happen in any
    order within the code. There are a limited number of constructs that can be used
    within the code to define the execution flow. These additional constructs are
    to be avoided if a true structured program is to be produced.


    A structured program may be written out using pseudocode prior to being translated
    into whatever programming language that the program is to be written in. This
    pseudocode forms part of the program specification and is readable by anyone who
    understands structured programming regardless of whether or not they know the
    specific language in which the program has been written.


    # Constructs in Structured Programming


    Structured programming provides a number of constructs that are used to define
