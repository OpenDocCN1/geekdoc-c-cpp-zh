  md: '# C:\>CHKDSK A:


    Now the details of a floppy disk in A drive is displayed. It is also possible
    to display details using the SCANDISK command.


    # UNIX OPERATING SYSTEM


    UNIX is an operating system which was first developed in the 1960s, and has been
    under constant development ever since. By operating system, we mean the suite
    of programs which make the computer work. It is a stable, multi-user, multi-tasking
    system for servers, desktops and laptops.


    UNIX systems also have a graphical user interface (GUI) similar to Microsoft Windows
    which provides an easy to use environment. However, knowledge of UNIX is required
    for operations which are not covered by a graphical program, or for when there
    is no windows interface available, for example, in a telnet session.


    # Types of UNIX


    There are many different versions of UNIX, although they share common similarities.
    The most popular varieties of UNIX are Sun Solaris, GNU/Linux, and MacOSX.


    # Parts of UNIX


    The UNIX operating system is made up of three parts; the kernel, the shell and
    the files and processes.


    # *The Kernel*


    The kernel of UNIX is the hub of the operating system: it allocates time and memory
    to programs and handles the filesystem and communications in response to system
    calls.


    As an illustration of the way that the shell and the kernel work together, suppose
    a user types `rm myfile` (which has the effect of removing the file). The shell
    searches the filesystem for the file containing the program `rm`, and then requests
    the kernel, through system calls, to execute the program `rm` on `myfile`. When
    the process `rm myfile` has finished running, the shell then returns the UNIX
    prompt `%` to the user, indicating that it is waiting for further commands.


    # *The Shell*


    The shell acts as an interface between the user and the kernel. When a user logs
    in, the login program checks the username and password, and then starts another
    program called the shell. The shell is a command line interpreter (CLI). It interprets
    the commands the user types in and arranges for them to be carried out. The commands
    are themselves programs: when they terminate, the shell gives the user another
    prompt (% on our systems).


    The adept user can customize his/her own shell, and users can use different shells
    on the same machine.


    History — The shell keeps a list of the commands you have typed in. If you need
    to repeat a command, use the cursor keys to scroll up and down the list or type
    history for a list of previous commands.


    # *Files and Processes*


    Everything in UNIX is either a file or a process. A process is an executing program
    identified by a unique PID (process identifier). A file is a collection of data.
    They are created by users using text editors, running compilers, etc.


    Examples of files:


    +   - A document (report, essay, etc.)

    +   - The text of a program written in some high-level programming language

    +   - Instructions comprehensible directly to the machine and incomprehensible
    to a casual user, for example, a collection of binary digits (an executable or
    binary file)

    +   - A directory, containing information about its contents, which may be a mixture
    of other directories (sub-directories) and ordinary files.


    # Specific Features of the UNIX


    The following are the specific features of the UNIX operating system:


    # *Case Sensitiveness*


    The commands in UNIX are case sensitive. It means that, lower case a and uppercase
    A are considered differently.'
  merge: -1
  img_proc: true
