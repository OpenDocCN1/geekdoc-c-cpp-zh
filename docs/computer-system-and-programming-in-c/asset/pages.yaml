  md: '-32768 to +32767. You can think of it as a largest positive or negative whole
    number: no fractional part is allowed. To declare an `int` you use the instruction:


    ```

    int variable name;

    ```


    For example:


    ```

    int a;

    ```


    declares that you want to create an int variable called a.


    To assign a value to our integer variable we would use the following C statement:


    ```

    a=10;

    ```


    The C programming language uses the “=” character for assignment. A statement
    of the form `a=10;` should be interpreted as take the numerical value 10 and store
    it in a memory location associated with the integer variable a. The “=” character
    should not be seen as equality otherwise writing statements of the form:


    ```

    a=a+10;

    ```


    will get mathematicians blowing fuses! This statement should be interpreted as
    *take the current value stored in a memory location associated with the integer
    variable a; add the numerical value 10 to it and then replace this value in the
    memory location associated with a.*


    # Decimal Number Variables


    As described above, an integer variable has no fractional part. Integer variables
    tend to be used for counting, whereas *real* numbers are used in arithmetic. C
    uses one of two keywords to declare a variable that is to be associated with a
    decimal number: `float` and `double`. They are each offer a different level of
    precision as outlined below.


    # Float


    A float, or floating point, number has about seven digits of precision and a range
    of about 1.E−36 to 1.E+36. A float takes four bytes to store.


    # Double


    A double, or double precision, number has about 13 digits of precision and a range
    of about 1.E−303 to 1.E+303. A double takes eight bytes to store.


    # Example


    If we want to define a variable total of float type then we can define it as follows.


    ```

    float total;

    ```


    if we want to define a variable total of double type then we can define it as
    follows:


    ```

    double sum;

    ```


    To assign a numerical value to our floating point and double precision variables
    we would use the following C statement:


    ```

    total=0;

    sum=12.50;

    ```


    # Character Variables


    C only has a concept of numbers and characters. It very often comes as a surprise
    to some programmers who learnt a beginner’s language such as BASIC that C has
    no understanding of strings but a string is only an array of characters and C
    does have a concept of arrays which we shall be meeting later in this course.


    To declare a variable of type character we use the keyword `char`.—A single character
    stored in one byte.


    # Example


    ```

    char c;

    ```


    To assign, or store, a character value in a `char` data type is easy—a character
    variable is just a symbol enclosed by single quotes. For example, if c is a char
    variable you can store the letter A in it using the following C statement:


    ```

    c=''A''

    ```


    Notice that you can only store a single character in a `char` variable. Later
    we will be discussing using character strings, which has a very real potential
    for confusion because a string constant is written between double quotes. But
    for the moment remember that a char variable is ‘A’ and not “A”.


    # INITIALIZING VARIABLES


    When variables are declared initial, values can be assigned to them in two ways:


    # Within a Type Declaration


    The value is assigned at the time of declaration


    # Example


    ```

    int a = 100;

    float b = 0.4e−5;

    char c = ''a'';

    ```'
