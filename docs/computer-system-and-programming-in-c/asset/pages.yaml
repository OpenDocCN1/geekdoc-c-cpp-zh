  md: '# Fourth Generation Languages (4GLs)


    The fourth generation languages, or 4GL, are languages that consist of statements
    similar to statements in a human language. Fourth generation languages are commonly
    used in database programming and scripts. The term “application specific” language
    was coined by Jim Martin to refer to non-procedural high-level languages built
    around particular systems. The first three generations were developed fairly quickly,
    but it was still frustrating, slow, and error prone to program computers, leading
    to the first “programming crisis”, in which the amount of work that might be assigned
    to a programmer greatly exceeded the amount of programmer time available to do
    it. Meanwhile, a lot of experience was gathered in certain areas, and it became
    clear that certain applications could be generalized by adding limited programming
    languages to them. Thus were born the report-generator languages, which were fed
    a description of data format and the report to be generated and turned that into
    a COBOL (or other language) program which actually contained the commands to read
    and process the data and place the results on the page.


    Some other successful fourth generation languages are: database query languages,
    example SQL; Focus, Metafont, PostScript, RPG-II, S, IDL-PV/WAVE, Gauss, Mathematica
    and data-stream languages such as AVS, APE, and Iris Explorer.


    # Advantages of fourth generation language


    The advantages of fourth generation language are:


    +   1. They possess friendly interfaces.

    +   2. They are easier to use than the previously used high level languages.

    +   3. The programming language contained within a 4GL is closely linked to the
    English language structure.


    # Disadvantages of Fourth Generation Language


    The disadvantages of fourth generation language are:


    +   1. The programs run slower than those of the earlier language generations
    because


    +   1. their machine code equivalent is considerably longer and more complicated
    to execute

    +   2. The recent popularity of 4GLs is closely linked to the development of fast
    microprocessors


    # Fifth Generation Languages (5GLs)


    The fifth generation languages, or 5GL, are the programming languages that contain
    visual tools to help develop a program. A good example of a fifth generation language
    is Visual Basic. The Fifth generation languages are normally associated with the
    field of artificial intelligence. Artificial intelligence, built up through logic
    programming, models a real world environment or situation. Artificial intelligence
    aims to support flexible and informed patterns of behavior within a computer.


    The main contenders within the fifth generation language category are as follows:


    +   - Prolog 2

    +   - Expert systems

    +   - Knowledge based systems


    # Objective of Programming Language


    Besides the main purpose of programming languages to provide instructions to a
    computer, there have been attempts to design one “universal” computer language
    that serves all purposes, although all of them have failed to be accepted in this
    role. The need for diverse computer languages arises from the diversity of contexts
    in which languages are used:


    +   - Programs range from tiny scripts written by individual hobbyists to huge
    systems written by hundreds of programmers.

    +   - Programmers range in expertise from novices who need simplicity above all
    else, to experts who may be comfortable with considerable complexity.

    +   - Programs must balance speed, size, and simplicity on systems ranging from
    microcontrollers to supercomputers.

    +   - Programs may be written once and not changed for generations, or they may
    undergo nearly constant modifications.'
