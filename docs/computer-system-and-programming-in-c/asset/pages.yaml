  md: '# # Operators and Expression


    We have already learnt variables, constants, data types and how to declare them
    in C programming. The next step is to use those variables in expressions. For
    writing an expression we need operators along with variables.


    +   An **expression** is a sequence of operators and operands that does one or
    a combination of the following:

    +   - Specifies the computation of a value

    +   - Designates an object or function

    +   - Generates side effects.


    An **operator** performs an operation (evaluation) on one or more operands. An
    **operand** is a sub expression on which an operator acts. This unit focuses on
    different types of operators available in C including the syntax and use of each
    operator and how they are used in C.


    # ## ASSIGNMENT STATEMENT


    We know that variables are basically memory locations and they can hold certain
    values. But, how to assign values to the variables? C provides an assignment operator
    for this purpose. The function of this operator is to assign the values or values
    in variables on the right hand side of an expression to variables on the left
    hand side.


    The syntax of the assignment expression is as follows:


    ```

    Variable = constant / variable/ expression;

    ```


    The data type of the variable on left hand side should match the data type of
    constant/variable/expression on right hand side with a few exceptions where automatic
    type conversions are possible. Some examples of assignment statements are as follows:


    ```

    b = c; /* b is assigned the value of c */

    b = 10; /* b is assigned the value 10*/

    b = c+5; /* b is assigned the value of expr c+5 */

    ```


    The expression on the right hand side of the assignment statement can be:


    +   - An arithmetic expression

    +   - A relational expression

    +   - A logical expression

    +   - A mixed expression.


    The above mentioned expressions are different in terms of the type of operators.
    Connecting the variables and constants on the right hand side of the variable.


    Arithmetic operators, relational operators and logical operators are discussed
    in the following sections.


    # ### Example


    ```

    int a;

    float b,c, avg, t;

    avg = (b+c) / 2; /*arithmetic expression */

    a = b && c; /*logical expression*/

    a = (b+c) && (b<c); /* mixed expression*/

    ```


    # ## ARITHMETIC OPERATORS


    The basic arithmetic operators in C are the same as in most other computer languages,
    and correspond to our usual mathematical/algebraic symbolism.


    The following arithmetic operators are present in C language.


    | Operator | Meaning |

    |---|---|

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modular division (for taking the remainder) |'
