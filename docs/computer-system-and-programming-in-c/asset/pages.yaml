  md: "# Example\n\n```\nfor (i = 0; i<10; i = i+1)\n{\nprintf(\"%d\",i);\n}\n```\n\
    \nThe for loop will be executed 10 times. Each time a value equal to the current\
    \ value of i will be printed out.\n\nVarious forms of loop statements can be as\
    \ follows\n\n+   (a) `for(condition;increment/decrement)`\n+   \n+       `body;`\n\
    +   \n+   A blank first statement will mean no initialization.\n+   \n+   (b)\
    \ `for(initialization;condition;)`\n+   \n+       `body;`\n+   \n+   A blank last\
    \ statement will mean no running increment/decrement.\n+   \n+   (c) `for(initialization;increment/decrement)`\n\
    +   \n+       `body;`\n+   \n+   A blank second conditional statement means no\
    \ test condition to control the exit from the loop. So, in the absence of second\
    \ statement, it is required to test the condition inside the loop otherwise it\
    \ results in an infinite loop where the control never exits from the loop.\n+\
    \   \n+   (d) `for(;;increment/decrement)`\n+   \n+       `body;`\n+   \n+   Initialization\
    \ is required to be done before the loop and test condition is checked inside\
    \ the loop.\n+   \n+   (e) `for(initialization;;)`\n+   \n+       `body;`\n+ \
    \  \n+   Test condition and control variable increment/decrement is to be done\
    \ inside the body of the loop.\n+   \n+   (f) `for(;condition;)`\n+   \n+    \
    \   `body;`\n+   \n+   Initialization is required to be done before the loop and\
    \ control variable increment/decrement is to be done inside the body of the loop.\n\
    +   \n+   (g) `for(;;)`\n+   \n+       `body;`\n+   \n+   Initialization is required\
    \ to be done before the loop, test condition and control variable increment/decrement\
    \ is to be done inside the body of the loop.\n\n# Additional Features of for loop\n\
    \n+   1. More than one variable can be initialized at a time in the for statement.\n\
    +      For example:\n+      `for (p=1,q=0; n<18; ++n)`\n+   \n+   2. Like the\
    \ initialization section, the increment section may also have more than one part.\n\
    +      For example,\n+      `for (a=2,b=30; n <= m; n=n+1,m=m-1)`\n+      ```\n\
    +      {\n+      p = b/a;\n+      printf(\"%d\",p);\n+      }\n+      ```\n+ \
    \  \n+   3. It is also permissible to use expressions in the assignment statements\
    \ of initialization and increment sections.\n+      For example\n+      `for (w\
    \ = (a+b); w>0; w=w/2) is valid.`\n+   \n+   4. One or more sections in the for\
    \ statement can be omitted, if necessary.\n+      For example,\n+      `e = 2;`\n\
    +      `for (; e != 10 ;)`\n+      ```\n+      {\n+      printf(\"%d\",e);\n+\
    \      e = e + 2;\n+      }\n+      ```\n\nBoth the initialization and increment\
    \ sections are omitted in the for statement. In such cases, the sections are left\
    \ blank. However, the semicolons separating the sections must remain. If the test-condition\
    \ is not present, the for statement sets up an infinite loop.\n\n# Programming\
