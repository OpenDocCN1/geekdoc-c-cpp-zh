  md: 'However, large amounts of information can be stored within magnetic tape. This
    characteristic has prompted its use in the regular backing up of hard disks.


    # Compact disks (CDs).


    A compact disk (CD) is a small, portable, round medium made of molded polymer
    (close in size to the floppy disk) for electronically recording, storing, and
    playing back audio, video, text, and other information in digital form (Fig. 1.41).


    Initially, CDs were read-only, but newer technology allows users to record as
    well. CDs will probably continue to be popular for music recording and playback.
    A newer technology, the digital versatile disk (DVD), stores much more in the
    same space and is used for playing back movies.


    Some variations of the CD include:


    +   - CD-ROM

    +   - CD-i

    +   - CD-RW

    +   - CD-ROM XA

    +   - CD-W

    +   - Photo CD

    +   - Video CD


    # Digital Video Disk or Digital Versatile Disk (DVD)


    DVD is a type of optical disk technology similar to the CD-ROM (Fig. 1.42). A
    DVD holds a minimum of 4.7 GB of data, enough for a full-length movie. DVDs are
    commonly used as a medium for digital representation of movies and other multimedia
    presentations that combine sound with graphics.


    The DVD specification supports disks with capacities of from 4.7 GB to 17 GB and
    access rates of 600 kbps to 1.3 Mbps. One of the best features of DVD drives is
    that they are backward-compatible with CD-ROMs, meaning they can play old CD-ROMs,
    CD-I disks, and video CDs, as well as new DVD-ROMs. Newer DVD players can also
    read CDR disks. DVD uses MPEG-2 to compress video data.


    # DVD-Video format: DVD-video


    is the most well-known DVD format, used to distribute movies on DVD for set-top
    DVD players. DVD-Video is not a different physical disc format, it is instead
    a specification for the layout and format of video, audio, and ancillary material
    on the disc. Like the CD-Audio format for music, DVD-Video was designed for distributing
    professionally produced material (movies and albums) so that they could be manufactured
    in mass quantity for retail sale.


    The DVD-Video format supports a wide range of features, beyond what is used for
    typical movies. For video, it supports widescreen and letterbox aspect ratio,
    and up to 9 user-selected camera angles. For audio, it supports


