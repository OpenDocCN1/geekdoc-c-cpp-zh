    # STRUCTURE OF A ‘C’ PROGRAM


    As we have already seen, to solve a problem there are three main things to be
    considered. Firstly, what should be the output? Secondly, what should be the inputs
    that will be required to produce this output and thirdly, the steps of instructions
    which use these inputs to produce the required output. As stated earlier, every
    programming language follows a set of rules; therefore, a program written in C
    also follows predefined rules known as syntax. C is a case sensitive programming
    language. All C programs comprise one or more functions. One function that must
    be present in every C program is main ( ). This is the first function called up
    when the program execution begins. Basically, main ( ) outlines what a program
    does. Although main is not given in the keyword list, it cannot be used for naming
    a variable. The structure of a C program is illustrated in the following where
    functions func1 ( ) through funcn ( ) represent user defined functions.


    ```

    Preprocessor directives

    Global data declarations

    main ( ) /* main function*/

    {

    Declaration part;

    Program statements;

    }

    /*User defined functions*/

    func1 ( )

    {

    ***********

    }

    func2 ( )

    {

    ```


    ```

    ***********

    {

    funcn ( )

    }

    ***********

    ```


    Structure of a C Program.


    # A SIMPLE C PROGRAM


    From the above sections, you have become familiar with, a programming language
    and the structure of a C program. It is now time to write a simple C program.


    This program will illustrate how to print out the message “This is my First Program”.


    # Example


    **Write a program to print a message on the screen.**


    ```

    /*Program to print a message*/

    #include <stdio.h> /* header file*/

    void main ( ) /* main function*/

    {

    printf (“This is my First Program\n”) ; /* output statement*/

    }

    ```


    The explanation of the above program is as follows:

    Every C program contains a function called **main ( )**. This is the starting
