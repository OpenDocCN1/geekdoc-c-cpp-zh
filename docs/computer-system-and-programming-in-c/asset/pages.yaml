    vice versa. There are also quite simple programming techniques and ‘avoidance
    strategies’ that can actually improve both at the same time, usually irrespective
    of hardware, software or language. Hence the re-ordering of nested conditional
    statements to put least frequently occurring condition first (example: test patients
    for blood type = ‘AB-’, before testing age > 18, since this type of blood occurs
    in only about 1 in 100 of the population—thereby eliminating


    the second test at run-time in 99% of instances), can reduce actual instruction
    path length, something an optimizing compiler would almost certainly not be aware
    of but which a programmer can research relatively easily even without specialist
    medical knowledge.


    # Analysis of Algorithm Efficiency


    Every algorithm uses some of the computer’s resources like central processing
    time and internal memory to complete its task. Because of high cost of computing
    resources, it is desirable to design algorithms that are economical in the use
    of CPU time and memory. Efficiency considerations for algorithms are tied in with
    the design, implementation and analysis of the algorithm. Analysis of algorithms
    is less obviously necessary, but has several purposes:


    +   - Analysis can be more reliable than experimentation. If we experiment, we
    only know the behavior of a program on certain specific test cases, while analysis
    can give us guarantees about the performance on all inputs.

    +   - It helps one choose among different solutions to problems. As we will see,
    there can be many different solutions to the same problem. A careful analysis
    and comparison can help us decide which one would be the best for our purpose,
    without requiring that all be implemented and tested.

    +   - We can predict the performance of a program before we take the time to write
    code. In a large project, if we waited until after all the code was written to
    discover that something runs very slowly, it would be a major disaster, but if
    we do the analysis first we have time to discover speed problems and work around
    them.

    +   - By analyzing an algorithm, we gain a better understanding of where the fast
    and slow parts are, and what to work on or work around in order to speed it up.
    There is no simpler way of designing an efficient algorithm, but a few suggestions
    as shown below can sometimes be useful in designing an efficient algorithm.'
  merge: -1
