  md: 'These two fragments produce the same output, but their internal behavior is
    quite different. In fragment 2, you cannot say s = “Manish”;. To realize the differences,
    you have to understand how the string constant table works in C. When your program
    is compiled, the compiler fleshes the object code file, which contains your machine
    code and a table of all the string constants declared in a program. In fragment
    1, the statement s = “Manish”; causes s to point to the address of the string
    Manish in the string constant table. Since this string is in the string constant
    table, and therefore technically a part of the feasible code, you cannot modify
    it. You can only point to it and apply it in a read-only manner. In fragment 2,
    the string Manish also exists in the constant table, so you can copy it into the
    array of characters named s. Since s is not an address, the statement s = “Manish”;
    will not work in fragment 2. It will not even compile.


    At the keyboard into array until enter is pressed. The scanf() places ''\0'' into
    array at the end of the input. The printf() function prints the characters from
    the array on to monitor, leaving the end of the string ''\0''. %s used in the
    scanf() and printf() functions is a format specification for strings.


    # Example


    Write a program to read a name from the keyboard and display message Hello onto
    the monitor.


    # Solution


    ```

    /*Program that reads the name and display

    the hello along with your name*/

    #include <stdio.h>

    #include<conio.h>

    void main()

    {

    char name[10];

    clrscr();

    printf("\n enter your name : ");

    scanf("%s", name);

