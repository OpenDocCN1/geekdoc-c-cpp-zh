  md: 'where certain information is required at the beginning of each program file.
    This can be put into a file by name “globals.h” and included in each program file
    by the following line:


    ```

    #include “globals.h”

    ```


    If we want to make use of inbuilt functions related to input and output operations,
    no need to write the prototype and definition of the functions. We can simply
    include the file by writing


    ```

    #include <stdio.h>

    ```


    And call the functions by the function calls. The standard header file stdio.h
    is a collection of function prototypes (declarations) and definition related to
    input and output operations.


    The extension “.h”, simply stands for “header” and reflects the fact that #include
    directives usually sit at the top (head) of your source files. “.h” extension
    is not compulsory—you can name your own header files anything you wish to, but
    .h is traditional, and recommended. Placing common declarations and definitions
    into header files means that if they always change, they only have to be changed
    in one place, which is a much more feasible system.


    You can put the following in the header files


    +   - External declarations of global variables and functions.

    +   - Structure definitions.

    +   - Typedef declarations.


    However, there are a few things not to put in header files:


    +   - Defining instances of global variables. If you put these in a header file,
    and include the header file in more than one source file, the variable will end
    up multiply defined.

    +   - Function bodies (which are also defining instances), may not be put in header
    files. Since the headers may end up with multiple copies of the function and hence
    “multiply defined” errors. People sometimes put commonly-used functions in header
    files and then use #include to bring them (once) into each program where they
    use that function, or use #include to bring together the several source files
    making


    up a program, but both of these are not good practice. It is much better to learn
    how to use your compiler or linker to combine together separately compiled object
    files.


    # #IF, #ELSE, #ELIF AND #ENDIF


    #if, #else, #elif and #endif are discussed here together because they are almost
    always used together. They are called conditional compilation preprocessor because
    they allow you to selectively compile your code on basis of a bool condition.
    Condition here must be an constant expression because the condition is evaluate
    at compile and not runtime so all values in expression should be properly defined
    before compilation as result variables cannot be used in the expression.


    Now we evaluate the function these preprocessors one by one in detail.

    The general form of using #if statement


    ```

    #if condition

    statement1

    statement2

    .

    .

    .

    Statement N.

    #endif

    ```


    If condition specified in first statement evaluates to be true then the statements
    between #if and #endif are compiled. Here #endif is used to mark the end of if
    block.


    C source code below shows the use of #if preprocessor compiler.


    ```

    #include <stdio.h>

    #include<conio.h>

    #define MACRO 0

    void main ()

    {

    clrscr();

    #if MACRO == 0

    printf (”MACRO is false”);

    #endif

    getch();

    }

    ```


    #else preprocessor directive is counterpart of #if preprocessor similar to else
    keyword is'
