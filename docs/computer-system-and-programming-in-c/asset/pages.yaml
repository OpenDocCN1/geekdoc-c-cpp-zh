- pgno: 80
  md: 'facilities to computer programmers for software development. An IDE normally
    comprises a source code editor, a compiler and/or interpreter, build automation
    tools, and (usually) a debugger. Sometimes a version control system and various
    tools are incorporated to simplify the construction of a GUI. Many modern IDEs
    also have a class browser, an object inspector, and a class hierarchy diagram
    for use with object oriented software development.


    IDEs are designed to maximize programmer productivity by providing tightly-knit
    components with similar user interfaces. This should mean that the computer programmer
    has much less mode changing to do than when using discrete development programs.


    Typically an IDE is committed to a specific programming language, so as to provide
    a feature set which most closely matches the programming paradigms of the language.
    However, some multiple-language IDEs are in use, such as Eclipse, Active State
    Komodo, recent versions of Net Beans, and Microsoft Visual Studio.


    # **SOFTWARE (PROGRAM) DEVELOPMENT LIFE CYCLE**


    Software development life cycle or SDLC is a model of a detailed plan on how to
    create, develop, implement and eventually fold the software. It is a complete
    plan outlining how the software will be born, raised and eventually be retired
    from its function. Although some of the models do not explicitly say how the program
    will be folded, it is already common knowledge that software will eventually have
    it is ending in a never ending world of changing web, software and programming
    technology.


    # **Stages in SDLC**


    There are several ways of developing a software. Almost each technology based
    company has its own way of developing software. Although different companies to


    follow different theories of development, they certainly follow the following
    general stages:


    # *Planning*


    Before a program is created, a programmer has to know what to create. Software
    development companies therefore use this stage to determine the need of the present
    market. Surveys and project proposal are usual in this stage. Management is often
    involved in this stage to determine what the developers need to do and how their
    work will impact the market.


    # *Design*


    After the management has approved the plan and the budget allocated, the next
    step is to create the architecture of the program. Developers work together and
    discuss the ways of developing the program. The workflow of the software is outlined
    in this stage. Some of the software development models approach this stage in
    a rather simple manner for example the iterative development model often treats
    this stage as the beginning of a software’s actual creation. The initial programs
    are created in this part of development model.


    # *Testing*


    It is necessary to make sure that the created programs work well in different
    environments. The normal way of testing requires testers to exploit the program
    under different conditions. The other way of testing get normal and intended users
    to test programs is to in a restricted manner under actual conditions so that
    the necessary modification can be made before the software is released for general
    use. The testing stage may include implementing the software in beta testing just
    to make sure that it can withstand multiple users at the same time.


    # *Implementation*


    Once testing is completed and the software declare fit for implementation, it
    is released for sell to the public or removed from beta'
