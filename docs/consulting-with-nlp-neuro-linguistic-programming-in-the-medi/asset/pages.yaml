  md: '# # Stage 2: Choosing areas for improvement


    # ## Introduction


    This stage introduces the next three elements of the PPDP process as highlighted
    in the framework diagram. It often involves a process of negotiation and choice.
    There are many demands on practices but it is essential that the team is realistic
    in what it chooses to take on. Issues of high importance or great impact on the
    life of the practice are likely to command wide support from team members and
    success with these can help them gain confidence in the process. Once again a
    real life story from the Maples Practice illustrates how other staff teams have
    approached these key tasks.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_40_0.png)'
