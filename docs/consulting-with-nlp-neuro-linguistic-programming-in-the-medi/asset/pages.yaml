- pgno: 38
  md: '# # Discovering priority needs


    ### 1 Purpose

    To improve the way we meet the health needs of individuals, groups and the local
    community.


    ### Purpose

    The three complementary steps required are to establish the needs at a population
    level and to consider the needs of individuals and groups. They will have been
    built on the records of meeting needs and from a thorough and continuous analysis
    of events in the past and present. The process of gathering and analysing information
    can be relatively slow, but it is essential for improving care for patients.


    ### 2 Community needs

    What do we know about the health needs of the local population?


    - What do we need to know and how do we know?

    - What are the national/SHA/PCT priorities?


    ### Community needs

    You may discover that not all groups have the same healthcare needs that you think
    they should. There are large variations in health between groups and you may have
    difficulty identifying gaps in the provision of health care. The following are
    the main categories of practice:


    - population health

    - professional practice

    - national priorities, such as government targets and local priorities

    - teamwork and virtual accountability agreements


    ### 3 Practice needs

    What do we know about:


    - how well we meet our patients’ needs?

    - how we work together in the process?

    - what we need to know and how can we find out?


    ### Practice needs

    Check the group’s knowledge about the population and the local focus of the practice,
    especially those groups who may have difficulty accessing care. Identify and address
    any gaps in:


    - access to care

    - practice activity

    - results of self-assessment

    - outcome reports

    - performance indicators

    - patient and users’ views


    ### 4 Personal development

    Related to own professional development.


    ### Personal development needs

    Relevant sections of staff appraisal and personal development planning help identify
    areas for improvement and gaps in practical work.'
  merge: -1
  img_proc: true
