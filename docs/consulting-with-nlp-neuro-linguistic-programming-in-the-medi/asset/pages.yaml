  md: '# # Stage 1: Discovering priority needs


    # ## Introduction


    This first stage is concerned with the initial aspect of the PPDP process as represented
    by the first four boxes of the PPDP diagram, as highlighted. It will include how
    a practice builds knowledge about the needs of its local community and patients
    as well as highlighting the directives from government, the strategic health authority
    and the PCT to which it has to respond.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_37_0.png)'
