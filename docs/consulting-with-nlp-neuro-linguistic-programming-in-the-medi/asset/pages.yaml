- pgno: 42
  md: '# The Maples Practice story


    5  Identifying priority groups


    7  Agreeing a shortlist of priority areas


    6  Identifying practice priorities


    **Evidence for the portfolio**


    Representatives from each discipline, nominated by their peers, were invited to
    a two-hour workshop to discuss and agree priorities for improvement over the next
    12 months. A summary of the PCT''s priorities, NSF''s and the National Primary
    Care Collaborative (community needs, see Box 5), together with the outcome of
    the SWOT analysis (practice needs, see Box 6), was presented to the team. Emerging
    from this data was a long list of potential areas for improvement. Armed with
    this information and with the help of a facilitator, the team split into two smaller
    groups to choose three areas we considered to be a priority for the practice and
    its population.


    +   - To improve and increase the use of IT (in particular data input for chronic
    disease management). Chosen because we were aware data were being input in a variety
    of ways for chronic disease management and each surgery results unreliable. We
    also had a problem storing increasing amounts of paper and had just had a system
    upgrade. Our aim would be for 100% of computerised patient records to be complete,
    accurate and up to date.

    +   - To improve patient access. Chosen because we were already actively participating
    in the National Primary Care Collaborative and ‘access’ had been identified as
    a priority for improvement by the PCT. Our aim would be to offer patients a routine
    appointment with GP or nurse within 48 hours of request. (Urgent appointment requests
    were already met on the same day).

    +   - To address the NSF for mental health. Chosen because we were experiencing
    an increasing number of patients with acute episodes of mental illness requiring
    medication and who did not come under the care of the community mental health
    team. These patients require frequent monitoring and support, and the counselling
    service we provided, with a waiting time of 15 weeks, was inadequate. Our aim
    would be to provide practice-based support for patients experiencing an acute
    episode of mental illness.'
