- pgno: 71
  md: '# Establishing a palliative care register and regular review meetings


    +   * **Aim** To work as an effective and supportive interprofessional clinical
    team.

    +   * **What are we trying to achieve?** To improve patient care, interprofessional
    communication and teamworking and support in a practice-based team delivering
    palliative care.

    +   * **Can we plan a change that we think will lead to improvement?** To establish
    a practice palliative care register and conduct a fortnightly interprofessional
    review of the patients on it.

    +   * **Can we make measurements to see if the change has resulted in improvement?**
    Review after four months. Did the meetings occur? Are there instances where care
    improved as a result? Did staff members value the meetings?

    +   * **How can we plan to implement the change as a trial?** Clinical team to
    meet regularly to review those on the register. Agreed criteria for entry to the
    register, agreed computer coding to record entry.

    +   * **What are the learning needs and actions required?** Review of different
    criteria defining ''palliative care''. Dissemination to whole team of understanding
    of special needs of patients receiving palliative care and their families. Review
    of criteria for assessing care as a basis for regular review. Development of skills
    of membership and leadership of interprofessional team. Review of procedures used
    to ensure continuity of care out of hours. Specific clinical and communication
    issues identified for future learning as they arise.


    # *Results*


    +   * Benefits to patients

    +       - review of their care and needs

    +       - team members more aware of their situation

    +       - criteria-based review of their care should lead to less unmet need

    +       - regular proactive review should lessen the chance of patients becoming
    ''lost''.

    +   * Benefits to team

    +       - team members feel better supported in their work

    +       - there is a forum for discussing difficult clinical or interpersonal
    issues

    +       - there is an opportunity for specific learning in response to clinical
    problems.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# **Introducing nurse telephone consulting – learning actions**


    The whole practice team had been working together to improve access in line with
    the PCT and National Primary Care Collaborative targets. The team had considered
    a variety of ways in which to improve access including the introduction of some
    sort of triage system. For this to be effective it was decided that the introduction
    of nurse telephone consultations with patients requesting same day appointments
    or home visits would be appropriate.


    A number of specific learning needs and actions were identified.


    Two practice nurses with an interest in expanding their role were keen to join
    a locally-provided university course on nurse consulting. They also acknowledged
    that much of their learning would occur once they started to use the skills they
    had learned on the course and so protected time for routine review of all their
    telephone consultations by one of the partners was scheduled in.


    The nurses were able to put this taught course and the subsequent reflection on
    this new aspect of their practice into their PDPs and portfolios.


    The practice also recognised that nurse telephone consulting needed to be fully
    integrated into the work of the practice and the key role of the reception team
    in this. There was specific learning for the reception team on the role and benefits
    of nurse consulting and a chance to discuss and rehearse how the service would
    be offered to patients as an additional service rather than as a barrier to seeing
    the doctor.


    # **The links between the PPDP and PDPs**


    *Individual learning needs arising from the practice PPDP*


    The PPDP generated learning needs and actions. These were met in different ways:


    +   - by the whole team working together

    +   - by the team working individually on the same topic (e.g. everyone needing
    to update and maintain their resuscitation skills to the appropriate level)

    +   - by individuals seeking specific training.'
  merge: -1
  img_proc: true
