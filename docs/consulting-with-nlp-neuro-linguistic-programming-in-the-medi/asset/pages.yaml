- pgno: 16
  md: '# # Introduction to the guide


    Welcome to *Practice Professional Development Planning (PPDP): a guide for primary
    care.* The guide is the outcome of a development project on PPDP, supported by
    the South West Region NHS Executive, and undertaken during the period 1998–2001
    by the authors. It has been designed to help practice staff in planning and undertaking
    the tasks and activities involved in PPDP. In particular, the guide should prove
    helpful to those staff with special responsibility for leading and/or facilitating
    the PPDP process within their work setting.


    # ## What does the guide contain?


    The guide contains a number of information and learning resources:


    +   - background information and context of PPDP

    +   - information about key elements, structures and processes in PPDP and related
    concepts

    +   - points between each stage designed to help you reflect about progress and
    identify activities still to be undertaken, or things that might be better done
    differently

    +   - a case example of PPDP in action, the Maples Practice, which is a composite
    based on the experience of the different practices involved in the early work

    +   - references to recommended and suggested further reading listed in Part Four.'
  merge: -1
  img_proc: true
- pgno: 17
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 18
  md: '# ## How should the guide be used?


    The guide is intended primarily to help team or group-based learning. However,
    it is highly likely that in busy practices there will be times when it is difficult,
    if not impossible, for all staff to work together simultaneously on developmental
    tasks. In this case the guide can provide a useful framework for absent staff
    to keep abreast of colleagues'' learning activities, and a means of support in
    catching up with recent developments.


    However the process we describe is a logical progression. It has been most successful
    when followed in a stepwise manner, with work to discover and understand the needs
    of the patients, the local community and the practice as the foundation for the
    later stages. Our experience has been that it is worthwhile resisting the urge
    to rush to answers and action. Spending time reflecting on what you know about
    the current situation before agreeing team aims is essential.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# The PPDP as a learning process


    We see the PPDP process as the practice team learning together and believe that
    reflecting on the experience of undertaking it is a vital part of its development
    within the practice. It is important that the team proceeds with its PPDP on the
    basis of common understanding of key issues. Therefore if your team is new to
    PPDP we suggest you all briefly review your understanding of the information and
    concepts presented.


    It is also well worthwhile allocating 15 minutes at the end of each workshop to
    reflect back on its content and process. This will be most beneficial if it is
    both a team and individual process and will help to identify any gaps in current
    understanding and enable the team to proceed with confidence. Some key questions
    to help are included in Part Four of the guide. It is worth noting that records
    of such reflections may well make a useful contribution to the PPDP and individual
    staff learning portfolios.


    # Preparing to use the guide


    We suggest it’s worth you spending some time becoming familiar with the guide’s
    contents and approach to PPDP development. This will enhance both your own understanding
    of key ideas and concepts in PPDP, and your ability to facilitate the development
    and learning of others.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # PART ONE: Some underlying thoughts


    # ## What is practice professional development planning (PPDP)?


    For the purposes of this guide, the following definition of PPDP is used:²


    > A Practice Professional Development Plan describes the developments planned,
    and the specific educational actions for individuals, groups and the whole team
    to enable the Practice to improve care, and which is reviewed annually.


    Although PPDPs may sound terrifying they only describe activities that are already
    happening in the majority of practices. The PPDP simply brings the activities
    together in a systemic way and, by linking them to meeting the needs of individuals
    and communities, enables a more coherent overview to emerge.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Whilst these requirements present real opportunities to re-examine policy and
    practice, they also generate additional work for already busy teams. Therefore,
    there is an imperative to use time for learning effectively in order to satisfy
    the requirements of governance, educational accreditation and preparation for
    revalidation. It is in this context that the guide seeks to support and guide
    staff through PPDP.


    # ## Our approach to PPDP


    As those responsible for leading the change process within the project, we found
    ourselves moving from a traditional teaching and telling role to a facilitating
    one, offering strategies and ‘tools’ to help practice teams make the most effective
    use of the wealth of expertise which they already possessed. Some of these tools
    are listed in Part Four.


    We also found that a patient-focused approach encourages teams to work interprofessionally.
    When they do so their depth of knowledge and understanding of patients and systems
    of care is striking. The contribution of all team members is valuable within this
    approach, and we have found real team development and improved relationships to
    be a consistent outcome of this way of working.^6


    The lessons which we learned from our work with teams during the PPDP project
    have been reviewed and distilled into the ideas, concepts, principles and practice
    recommendations that you will find in this guide.


    # ## Linking with the practice’s decision-making processes


    The aim is not to create yet another time-consuming process that adds burden.
    Professional development planning must'
  merge: -1
  img_proc: true
- pgno: 23
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Within the primary care trust (PCT)


    The PCT will have, or will be developing, systems for approving and collating
    professional development plans. These will be influenced increasingly by national
    policies and practices such as professional re-accreditation. The approach to
    PPDPs set out in Part Three must link into PCT and national planning processes.
    It should enable all parties to achieve their objectives of the process and to
    do so within the timescales laid down each year. It follows that there will be
    no one way of doing it. Formats for PPDPs and timetables for their production
    will vary across the country. What is important is that increasingly PPDPs, whatever
    their precise format, will be based upon a careful team consideration of how better
    to meet the needs of patients and the local community.


    # How will this guide help you and your team?


    We believe that it is important that the whole primary healthcare team (PHCT),
    both clinical and administrative, is involved with the process of drafting the
    plan. We have found it is only when the whole team comes together that the full
    extent of the knowledge and understanding about the activities of a practice becomes
    apparent.


    In what follows here we describe the process that allows a practice to select
    important areas for development, and to identify the education and training activities
    and resources required for the whole team and/or individuals.


    Freeing up time and resources to dedicate to your PPDP can be difficult. In the
    pilot stage of our work, teams met on several occasions tackling just one stage
    of the PPDP process at a time. Feedback suggested that this created problems in
    attendance'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/aaf273c74157227c19ea0efc2dd3eabf_25_0.png)


    for some members due to work pressures and led to poor continuity. Over time and
    learning from our experiences we were able to condense the work into two workshops
    of approximately two and a half to three hours, covering Stages 1–7 of the framework
    in the first and Stages 8–11 in the second workshop. As long as work is undertaken
    between meetings to provide the information necessary for the questions being
    addressed we do not feel that the quality of the work is compromised in any way.
    Practice teams have found this more realistic and manageable in terms of their
    time and other work pressures. However the process is flexible enough to allow
    teams to work at their own pace and to meet as many times as they feel necessary.


    # The PPDP


    The really important part of this approach to PPDPs is the work the team engage
    in as they progress through the different'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'stages, including the actions they take to bring about improvement. It has
    been shown time and again that this is usually a major learning experience, and
    one that frequently transforms team relationships.


    Even though this is the most important aspect of the approach, practices will
    have to produce one or several documents that set out their proposals for professional
    development. Some primary care trusts (PCTs) will prescribe their format. Others
    will be content to receive the portfolio of evidence produced as a result of following
    the stages in Part Three. It is likely that the majority of PCTs will not wish
    to receive large documents and will opt for a summary of proposals from each practice.


    # ## Personal development plans (PDPs)

    and PPDPs


    One of the most frequently asked questions has been about where PDPs fit in with
    PPDPs in this approach. The simple answer is that they are an integral part.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The aim is that an individual’s professional development should increasingly
    be directly related to what they, and other members of the multiprofessional team,
    have concluded is needed to bring about the improvements in patient care that
    they have identified as most important. This is what the process set out in Part
    Three of this guide is designed to achieve.


    However, a sense of realism is important here. We recognise that practices can
    only work on very few areas for improvement in any one year. An individual’s learning
    needs will arise both from the PPDP and from his or her personal practice interests
    and career aspirations. Similarly learning undertaken as part of the PPDP may
    well be recorded in an individual’s portfolio in preparation for appraisal and
    revalidation. A framework for PDPs that is congruent with the thinking underpinning
    this guide is included in Part Four.


    # Summary


    Part One of this guide has covered a number of important issues concerned with
    the PPDP process including development and learning within the practice. It has
    introduced key areas and concepts, including:


    +   - the purpose and function of this guide

    +   - the original thinking behind PPDP

    +   - a working definition of PPDP

    +   - the relationship between PPDPs and PDPs.


    Part Two of the guide introduces a framework for preparing PPDPs, and outlines
    stages of the PPDP process and portfolio.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# **PART TWO:**


    # # Introduction to the PPDP framework and the portfolio


    # ## Introduction


    This part of the guide has five elements:


    +   1. a description of the PPDP framework developed by the authors as the basis
    for work with practice staff groups and teams

    +   2. a brief overview of important points to consider when holding interprofessional
    meetings within the practice

    +   3. an introduction to the PPDP portfolio, which is a suggested way of building
    up the record of your work

    +   4. an introduction to stages of the PPDP process

    +   5. reviewing progress during the year.


    # ## The PPDP framework


    At first glance the framework may look quite complex, but in reality it simply
    links a number of activities and processes which are probably already happening
    in most practices. Advice about working through each stage of the framework is
    included in Part Three. There are three main elements, explained in the sections
    immediately below.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '1 Purpose

    To improve the way we meet the health needs of individuals and local community


    2 Community needs

    What do we know about the health needs of our local population?

    What do we need to know and why?

    What are the national/SHA/PCT priorities?


    5 Identify priority groups using agreed criteria


    7 Agree a shortlist of priority areas for improvement for the practice.


    +   3 Practice needs

    +   What do we know about:

