    # PDSA 1


    Plan: Reception staff will record and monitor the third* available appointment
    for each appointment nurse, in order to assess the practice''s capability of accord
    and nurse appointments.


    Do: When a patient requests an appointment the receptionist will record on a form,
    the appointment date the patient required and the date of the next available appointment.
    The receptionist will analyse the data weekly and monitor the length of wait for
    an appointment for each doctor and nurse.


    Study: Results showed that although the monitoring exercise created additional
    pressure on reception staff, at times it was possible to identify peaks in demand.
    LA Monday and Friday afternoons.


    Act: To consult about the benefits of introducing one session of nurse triage
    on Monday mornings.


    # PDSA 2


    Plan: To carry out a survey to seek patient views and assess potential use of
    nurse triage and to distribute a small patient questionnaire to patients attending
    the surgery.


    The third available appointment is a measure of access used by the National Primary
    Care Collaborative.


    # Evidence for the portfolio


    Project groups were set up across all clinical staff groups and included ''expert''
    nurses who were involved in the PDSA process. The aim of the project group was
    to improve access to appointments within 48 hours, and included a GP and nurse
    practitioner. They agreed that a change would be:


    +   - The number of patients ringing for routine appointments

    +   - The ''how to'' appointment

    +   - The time of routine appointments

    +   - The skill mix of the nursing team'
