- pgno: 54
  md: '# Stage 6: Planning next year’s PPDP


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_54_0.png)


    **Purpose:** To continue to improve the way that we meet the health needs of individuals,
    groups and the local community.


    We suggest that a review be carried out nine to ten months into the plan (e.g.
    perhaps to coincide with the health authority or PCT planning timetable). Reviewing
    progress on your current plan will enable you to discuss and agree priorities
    for improvement for the next 12 months. You will also need to take into account
    the external agenda arising from national, SHA and PCT priorities including NSFs.
    For the purpose of reviewing the current plan it will be helpful to address the
    following questions for each priority area.


    +   - **With respect to the improvement priorities:**

    +     - Did the planned improvement actions take place? If not, do you understand
    why?

    +     - If so what have been the outcomes? How do you know?

    +     - What has been learned from your PDSA feedback measures?

    +     - What has been the benefits – for patients and for staff?

    +   - **With respect to the educational actions:**

    +     - Did the planned actions take place?

    +     - If so what have been the results? How do you know?

    +     - If the planned actions did not take place what were the barriers and difficulties?
    What has been learned from these and what further action has been, and needs to
    be, taken?

    +     - What have been the benefits – for patients and the staff involved?


    Have any other internal or external priorities arisen, or been imposed, during
    the year which have led to revision of the plan? What are the implications of
    these for next year’s PPDP?


    **Remember** – this is a continuous process and the team will need to continually
    re-visit the framework, at least annually.'
  merge: -1
  img_proc: true
