- pgno: 85
  md: '# ## Facilitating PPDP meetings: learning from our experience


    The PPDP process enables:


    +   - team members to learn both individually and as a team through a formally
    structured event and more informally through the daily course of their work

    +   - practices to develop a positive attitude towards learning and to experience
    the value of learning together in an informal setting

    +   - the team to create a learning culture and to plan strategically for the
    learning needs of individuals and for the needs of the team as a whole.


    Facilitating your own practice team can be difficult – as a member of the team
    you have a contribution to make; as a facilitator you do not. To perform the role
    of facilitator and participant is to ‘break the rules’; facilitators should remain
    totally impartial.²¹ Practices may consider a reciprocal arrangement with a neighbouring
    practice based on trust and impartiality. Our experience has been that team learning
    is enhanced when the facilitator comes from outside the organisation and is able
    to focus entirely on the teams’ needs, raising the feeling of safety in the group
    and allowing for more disclosure and risk taking.²²


    Practice teams are well known for status hierarchies – GP and employer can be
    perceived as dominant and powerful, nurses may be perceived as subservient and
    administrative staff can often be ignored. Each team member’s contribution to
    the workshops will be determined by their job role and previous experiences. This
    requires the facilitator to be flexible in their approach and to be able to work
    with the emerging material – in other words to go with the flow.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Management of group dynamics is dependent on the skills of the facilitator
    who has the responsibility to create a comfortable and safe environment where
    all contributions are equally valued.


    # Initial meeting between facilitator and practice


    The facilitator meets with the practice manager and sometimes one of the GPs to:


    +   - discuss the PPDP process and agree dates and venues for the workshops

    +   - ensure ‘dedicated time out’ to avoid people coming in late or leaving early

    +   - encourage the practice to invite at least one representative from each discipline
    to attend (practice teams have varied in size from six to 26).


    # Preparation for the first meeting


    It is important that people come to the first meeting with a clear idea of what
    it is about and we suggest some preparatory work to help them focus on the purpose
    of the meeting.


    +   - It helps if each person attending is given a copy of the PPDP framework,
    together with a brief explanation of what the team is trying to achieve at the
    workshops.

    +   - Check out everyone’s understanding of ‘community needs’ – you may need to
    explain this beforehand.

    +   - To establish ‘practice needs’ you could ask each member of the practice
    team to express an opinion on the current performance of the practice by using
    the SWOT (see pp 88–90) exercise or other similar tool. The results can be summarised
    and shared at the first meeting. There may be issues arising from the SWOT which
    may be important,'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'but not necessarily significant – these should be noted and addressed separately.


    # The first workshop


    When the team comes together for the first workshop it is important to spend some
    time establishing an environment in which people can share views openly.<sup>23,24</sup>


    +   - It is useful to ask the team to state their hopes, expectations and concerns
    about the whole process and record these on a flipchart. They will be surprised
    by how many feelings they share.

    +   - The team can then work together to draw up some group agreements or ground
    rules about how they want the meeting to be conducted. It is vital that the group
    creates its own rules. Doing this exercise together is the first step to working/learning
    together. However, it is useful for the facilitator to have a checklist in case
    important items are forgotten, such as timekeeping, breaks and finish times.

    +   - Congratulate the team on their first shared learning experience.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Starting the process


    Begin by briefly explaining the PPDP framework diagram; it is always useful to
    reinforce the message and check out understanding. The team is then ready to work
    through the process.


    +   - Check out the team’s perception of ‘community needs’. What are the issues
    for this practice? Note these on a flipchart.

    +   - Present the outcome of the co-ordinated SWOT analysis and allow discussion,
    again making notes on the flipchart.

    +   - Ask the team to split into small, mixed professional groups (of no more
    than four to five; if the practice is a small team this can be done as one group).

    +   - Based on what they have heard/learned so far, ask the small groups to agree
    a list of priority areas for improvement.

    +   - Bring the groups back together and ask them to present their lists. Note
    these on the flipchart.

    +   - Working with the whole team, and with their agreement, narrow the list to
    a manageable number – usually two to three priority areas for improvement.

    +   - Ask for volunteers to form small project groups to work on producing action
    plans (PDSA cycles) for each of the areas for improvement. Ensure these are mixed
    professional groups. Don’t forget to ask the team to include people who may not
    be present at the workshop.

    +   - Agree a date for the team to reconvene (usually four to six weeks later)
    to share their action plans and to work through the second part of the framework.


    # The second workshop


    Begin by ‘re-forming’ the group.


    +   - Check for newcomers and absentees.

    +   - Reconfirm the team’s agreed ground rules.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - Agree a finish time.

    +   - Ask the project groups to present their action plans and allow discussion
    from the team.

    +   - Ensure the action plans follow the PDSA cycle and in particular include
    ways of measuring that the actions, once taken, have brought about improvement.

    +   - Ask the team to split into small, mixed professional groups to discuss and
    agree what learning needs to take place in order to bring about the improvement
    and how this learning can be achieved.

    +   - Remind the groups at this stage that they should also consider what may
    be appropriate for inclusion in individual learning plans.

    +   - Bring the small groups back together and ask them to share their findings.

    +   - Reach agreement on the learning plan for the practice and for individuals.

    +   - Ask the group to consider how they plan to disseminate the PPDP to other
    members of the PHCT and to produce a timetable for regular review of progress.

    +   - Set a date for annual review and planning of next year''s PPDP.


    # ## SWOT analysis


    SWOT is a tool for scrutinising an organisation and its environment,^23,26^ It
    is the first step to helping teams focus on key issues. Once key issues have been
    identified they feed into the organisation''s plan.


    SWOT stands for strengths, weaknesses, opportunities and threats. Strengths and
    weaknesses are internal factors. For example, a strength could be your new purpose-built
    surgery. A weakness could be high staff turnover. Opportunities and'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'threats are external factors. For example, an opportunity could be a new housing
    estate in your catchment area. A threat could be increased workload.


    A word of caution – SWOT analysis can be very subjective. If you are presenting
    a summary of SWOT analyses as a foundation for your first workshop take care to
    present these as common issues, which have been identified by several members
    of the team.


    The purpose of the SWOT exercise is to seek the views of each member of the PHCT
    on their perceptions of the practice. This can be undertaken as a practice team,
    as individuals or in undisciplinary groups. The important issue is to ensure that
    everyone’s views are sought.


    Below are a few questions to guide you through the SWOT process.


    # Strengths


    +   - What do we do well? (You will get an indication from patient surveys, prescribing
    data, performance indicators, audits, significant events.)

    +   - How well do we work together as a team (not just get along)?

    +   - Do we have special skills and expertise?

    +   - Acknowledge the good things in your practice.


    # Weaknesses


    +   - What don’t we do well? (Use the indicators above to identify areas for improvement.)

    +   - How good is teamworking and communication?

    +   - Do we lack certain skills or expertise?

    +   - Recognise the not-so-good things in your practice.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# ## Opportunities


    +   - Do we have an opportunity to change things?

    +   - What can we do to meet national and local priorities?

    +   - What opportunity do we have to improve our care for patients and our team?


    # ## Threats


    +   - What gets in the way?


    For further information about SWOT analysis there are a number of useful websites.
    For example try www.buzgate.com/vt_bft_swot.html.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# # Significant event analysis (SEA):

    a summary*


    SEA is defined as occurring when:


    > > ... individual episodes in which there has been a significant occurrence (either
    beneficial or deleterious) are analysed in a systematic and detailed way to ascertain
    what can be learnt about the overall quality of care and to indicate changes that
    might lead to future improvements.


    (after Pringle)²⁸


    It is an interprofessional team activity. There will be regular meetings to discuss
    events (both good and not-so-good). The focus is on system improvement rather
    than individual improvement. The development of a ‘no blame’ culture is essential.


    SEA is part of the culture of clinical governance, risk management and the determination
    of learning needs. It promotes a positive approach to complaints, identifies audit
    and research topics, helps develop understanding of others’ roles, and builds
    and develops the skills of teams.


    # ## Outcomes of SEA


    There are five principal outcomes.


    +   - Congratulation.

    +   - Immediate action It is clear during the discussion at the meeting what needs
    to be done.

    +   - Conventional audit To answer ‘how often is this happening?’.


    * We are grateful to Drs Richard Westcott, Grace Sweeney and Jonathan Stead, colleagues
    at Exeter University, for sharing their experience with introducing significant
    event analysis to primary care teams. Much of what follows is based on their work.²⁷'
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   - **Small group task** Discussion identifies a piece of work which needs
    to be done by two or three members of the team. The work will take place before
    the next meeting, but tackling the task during the SEA meeting would not be a
    good use of the team’s time. The task may be a quality improvement project, production
    (or adaptation) of guidelines etc.

    +   - **No action – ‘Life is like that’** It is sometimes necessary to accept
    that such an event will sometimes happen and there is not much we can do about
    it.


    # ## Please don’t forget the congratulations


    There is not enough of it about. There is little history of praise in the NHS
    – just individual blame. There is usually some part of even an adverse event that
    is well managed and should be acknowledged.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Managing the process


    Management of the SEA process with good facilitation and leadership is essential.
    There must be commitment and ownership by the whole team, whose initial reservations
    should be expressed and heard. Reassurance, engendering a feeling of safety and
    assuring all that everyone will be able to participate in decision making is important.
    Agreement of rules and guidelines for the meetings may be important for this.
    The aim is to create small but important changes.


    When the process works well it helps the team reach solutions and actions, and
    engenders a feeling of working together.


    Topics should usually be presented by those involved with the significant event.
    Facilitated team discussion should start with praise for what went well before
    any criticism follows. Key points and actions should be recorded for future review.


    The sensitive selection of topics, with some censoring and vetting of those not
    best dealt with in an open forum, is essential.


    # Examples of significant events


    +   - Successful management of a crisis.

    +   - Sudden unexpected death of a practice patient.

    +   - Under-age pregnancy.

    +   - Violence to staff.

    +   - Drug errors and drug reactions.

    +   - Complaints.

    +   - Breaches of confidentiality.

    +   - Buildings problems, security or health and safety issues.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Benefits of SEA


    +   - Leads to change rapidly.

    +   - Built into the fabric of the organisation.

    +   - Systematic approach.

    +   - Encourages a user/patient focus.

    +   - Includes successes as well as problems.

    +   - Fits well with the discovery of learning needs for a PPDP and individual
    PDPs.


    # Getting started


    At least one member of the team should have skills and training in the facilitation
    of small group work.


    +   - Initial meeting: invite and involve all stakeholders.

    +   - Identify the chairman/manager.

    +   - Meet monthly – instead of existing meetings, not as well.

    +   - Collect events as they occur. Ensure all in the team know they can nominate
    events.

    +   - Record events using forms or books kept in strategic places.

    +   - If an event is described in a letter from another organisation, record the
    details.


    # Before the meeting


    +   - Collect events a week prior to the meeting.

    +   - Create agenda, recognising:

    +     - priority of topics

    +     - availability of personnel

    +     - involvement of team members

    +     - sensitivity of topic

    +     - flexibility to add ''hot topics''.

    +   - Circulate agenda 48 hours before meeting.'
  merge: -1
  img_proc: true
