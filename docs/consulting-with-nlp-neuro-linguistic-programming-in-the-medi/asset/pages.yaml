  md: '![](img/aaf273c74157227c19ea0efc2dd3eabf_59_0.png)


    Figure 1: The model for providing care that underpins our work.<sup>9</sup>


    develop outcome measures that reflect these needs. However this is beyond the
    scope of this guide. Our focus is on the use of CQI principles and methods to
    provide a very pragmatic approach to PPDP.


    # ## Improving processes of care


    Much of the emphasis of published CQI studies to date has been on the middle part
    of the model, with professional teams working together to redesign the processes
    underpinning their practice.<sup>10–12</sup> This is critically important since
    it is impossible to improve care without improving the processes by which it is
    delivered. Teams discover, for example, that when they try to draw simple flowcharts
    describing the way they currently do things it stimulates much discussion about
    the assumptions on which they all operate. It is usually the first time that they
    have pooled their separate knowledge and used it to make joint decisions about
    where and how to improve the care they provide. This very patient-focused discussion
    seems to serve an important purpose in creating new ways of doing things that
    strengthens interprofessional teamworking.


    However, there is also a need to look at each end of the care model.'
  merge: -1
  img_proc: true
