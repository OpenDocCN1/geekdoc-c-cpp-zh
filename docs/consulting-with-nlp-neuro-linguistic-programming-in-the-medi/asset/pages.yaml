    ![](img/aaf273c74157227c19ea0efc2dd3eabf_29_0.png)


    # Identifying key developmental priorities for the practice team


    These need to be informed by knowledge of the local community,

    awareness of externally determined and/or driven agendas,'
  merge: -1
