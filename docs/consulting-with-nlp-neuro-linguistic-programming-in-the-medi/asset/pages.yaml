- pgno: 31
  md: '# ## Holding interprofessional meetings within the practice


    For interprofessional meetings to be useful and productive it is important to
    pay attention to the process – how people are going to work and learn together.
    Setting up a meeting of the whole team needs planning. It is really important
    that people have a clear idea of the aim of the meeting. Telling them the start
    and finish times and being explicit about what food and refreshments are available
    allows people to plan.


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_31_0.png)


    Often the meeting will be more fruitful if people have been asked to consider
    one or two things in advance. It is important to emphasise the contribution all
    team members have to make and to acknowledge that for at least some of the participants
    their prior experience of group working may not have been good. It is very helpful
    to have a facilitator from outside the practice, particularly for the initial
    meetings. However one person within the practice will also have to take a leading
    role in the practicalities of setting the meeting up.


    Part of the facilitator''s role will be to help the team agree some ground rules
    about the process of the meetings. The hopes and anxieties of participants, together
    with previous experience of'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'group work, good and bad, can be used as a starting point for this exercise
    (*see Part Four*). On pages 84–90 we give some more specific ideas for the facilitation
    of these meetings.


    # ## The PPDP portfolio


    By ‘portfolio’ we just mean a collection of evidence from the learning process
    the practice team has been going through. It is a suggested way to maintain a
    record of the information gathered as you move through the steps in the framework
    and of the decisions the practice team makes about its improvement and learning
    priorities. In addition it includes evidence which clearly demonstrates what the
    practice team has learned from drafting its PPDP and from taking the actions required
    to bring about change and improvement. It is not simply a record of actions, activities
    or experiences which the team has undertaken but an account of how much value
    each member of the team feels about having the opportunity to contribute to the
    direction of the practice. Team members in some practices have valued this aspect
    of producing the PPDP above all else and have experienced a real improvement in
    their working relationships. This evidence is certainly worthy of inclusion in
    the final PPDP document as well as in staff’s own personal portfolios.


    We have found that a useful format for the portfolio is a loose-leaf ring binder.
    In it dividers can be used to create sections for each key stage of the PPDP process
    as shown below.


    # ## Stages of the PPDP process


    The steps of the PPDP process can usefully be divided into a number of stages
    which build on each other and which each'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'have a different part to play as they strengthen the practice’s ability to
    improve the way it meets the needs of its patients and local community.


    +   - Stage 1 Discovering priority needs (see Boxes 1–4 on the framework diagram).

    +   - Stage 2 Choosing areas for improvement (see Boxes 5–7).

    +   - Stage 3 Agreeing specific actions for improvement (see Boxes 8–9).

    +   - Stage 4 Agreeing learning and development needed to achieve improvement
    (see Boxes 10–11).

    +   - Stage 5 Planning for reviewing progress of the PPDP during the year (see
    Box 12).

    +   - Stage 6 Planning next year’s PPDP.


    You will see from the above list that the earlier sections of your portfolio will
    contain details about how you discovered the needs of your practice. It would
    also be appropriate to include brief accounts of your PPDP meetings. Later sections
    will include accounts of how you negotiated and chose areas for action and which
    team members were involved in these discussions. These sections describe the specific
    educational and learning activities undertaken by the whole team or by individuals.
    Some of this material may also be copied and held in individuals’ PDPs.


    Over time you will find it helpful to gather evidence to show what benefits for
    patients and/or staff have resulted from the planned changes.


    By following the process explained below, your portfolio will establish a body
    of evidence of your working step by step through the framework. For example, in
    the section titled ‘Discovering priority needs’ your evidence could be notes of
    your first PPDP meeting, listing those present, and a record of what took place.
    It may also include information about the needs of your local community, externally-determined
    priorities and the outcome of a SWOT analysis or other evidence identifying the
    ‘current state’ with regard to your own internal practice needs.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Reviewing progress during the year


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_34_0.png)


    The portfolio approach allows the PDP and related personal plans to be updated
    flexibly during the year as circumstances change. It is important that regular
    reviews of progress are made in order to allow this to happen and opportunities
    should be planned in at the beginning of each PDP cycle. It is also often only
    when a team stops and reflects that they realise just how much they have achieved.


    Reviews are also a chance to check that all members of the team are clear about
    what the purpose of the PDP is. It is important that while working on a specific
    topic, team members remember the high level aim of improving the service to the
    patients and local community. Reconnecting with this and seeing that the specific
    improvement being worked on is indeed consistent with the high level aim can be
    encouraging and energising.'
  merge: -1
  img_proc: true
