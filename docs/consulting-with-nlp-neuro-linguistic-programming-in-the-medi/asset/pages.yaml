  md: '+   - Specific features of the practice and its population.

    +   - An assessment of any areas you are less confident in because of no prior
    teaching or experience.

    +   - Reflection on your everyday practice and review of patient contacts.

    +   - Areas of uncertainty in consultations, significant events or meetings with
    an appraiser may all highlight areas where you feel unable to meet the patients''
    needs or where you feel uncomfortable or ill at ease. For example, are there some
    types of patient you find it more difficult to relate to or deal with? It may
    be useful to divide these areas to consider into:

    +     - Knowledge

    +     - Know how, i.e. who provides this service, where to get this information,
    how to contact this agency

    +     - Skills which may be:

    +       - technical, e.g. how to inject a shoulder, how to do an excision biopsy,
    resuscitation training

    +       - interpersonal, e.g. how to give bad news, make a visit after bereavement,
    challenge an unreasonable patient''s expectations, or give feedback after unhelpful
    action by a colleague or member of staff

    +     - Attitudes, e.g. being aware that a particular situation or patient gives
    you feelings of annoyance, anger, discomfort, uncertainty or ''heartsink''.

    +   - Results of audits or surveys of aspects of your practice such as timekeeping,
    casemix or prescribing.

    +   - Issues that arise from regular appraisal and feedback from peers, partners
