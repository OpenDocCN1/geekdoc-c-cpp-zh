- pgno: 30
  md: 'requirements (e.g. PCT, health improvement programmes (HImPs), national service
    frameworks (NSFs) etc.) and inside knowledge of the practice''s current working
    arrangements, and internal/self-assessments (see Boxes 1–3 on the framework diagram).


    # ## Translating priority areas into planned improvement projects


    Continuous quality improvement (CQI)° principles and methods have been used to
    create an approach to project planning that:


    +   - provides a clear focus for the work to be undertaken

    +   - clarifies who needs to do what and when

    +   - allows the practice team to learn flexibly as they go (see Boxes 4–9).


    # ## Identifying practice team and individual staff learning needs


    The practice''s improvement priorities will provide pointers to important team
    learning needs and in addition new personal and professional development needs
    will almost certainly arise. A central aim of this approach is to place PDPs firmly
    in the context of practice improvement priorities. Team members will understand
    how their PDP fits in with the practice''s overall plan to improve the services
    that it provides. However, there may be parts of some staff members'' PDPs which
    fall outside the PDPP. For example, these aspects of PDPs may relate to professional
    career plans, or arise from staff appraisal processes, so making them confidential
    to the individual (see Boxes 4 and 10–11).'
