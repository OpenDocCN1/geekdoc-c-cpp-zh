- pgno: 81
  md: '# Learning styles


    You may be aware of your preferred and most effective learning style – there is
    wide variation. Be aware of the strengths and limitations of a single style and
    try to develop a range to suit different learning needs. You may decide that work
    on this is one of your early learning objectives. Questionnaires to help with
    this are available and your local GP Tutor will be able to guide you.


    Use this section of your portfolio to record your choices for learning actions
    and why you made them.


    # Stage 3: Specific actions for improvement


    (see Boxes 6 and 7) (The ‘how’)


    What are you going to do to meet the learning need in the areas you have identified?


    +   - What are you hoping to achieve? Have a specific aim/outcome for successful
    learning. It may be possible to identify this, for example, ‘I will understand
    better how to manage a patient presenting with diabetes’ or ‘I will be more comfortable
    discussing psychosocial problems’. The more specific the aim, the easier it will
    be to focus on what you need to do to achieve it.

    +   - Identify measures that will tell you if you have achieved the goal – it
    could be a mini audit or a case review of one or more patients. How will you know
    that any changes you make are an improvement?

    +   - Use the PDSA cycle to help you plan the changes, take the necessary action,
    evaluate the outcome and act upon the results.


    Use this section of your portfolio to set out a plan of action: what learning;
    when you will do it; who or what will be the resources for this; when you will
    review the learning plan and with whom?'
