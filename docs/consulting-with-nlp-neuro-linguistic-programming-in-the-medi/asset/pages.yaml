- pgno: 49
  md: '# Agreeing learning and development needed to achieve improvements


    # 4 Personal development needs


    This refers to individual learning needs that may be unique to an individual,
    or may be a shared need. The needs identified should relate to the personal needs
    and the needs of the practice, team and organisation. Examples of personal learning
    needs may be identified from appraisals or performance review, and include recognition
    and understanding of own needs, opportunities to learn new skills and knowledge,
    and other development needs.


    # 11 What specific educational action can we take? How can we measure the effect
    of each action?


    This refers to specific educational actions taken to meet the improvement needs
    identified. In addition to formally accredited opportunities, you may want to
    consider:


    +   - Processes for facilitating learning and setting up the appropriate opportunities.

    +   - Learning opportunities, including the use of different resources.

    +   - Specific training sessions, for instance communication skills or computer
    skills.

    +   - Peer support and discussion groups.

    +   - Individual education to attain a specific skill or knowledge.

    +   - Personal learning may come out of an individual reflection or a particular
    incident, event, or need for personal development.


    You may also want to report any benefits you feel have resulted from the educational
    actions. Providing evidence of this is not easy, especially when the benefits
    relate to the practice culture. However, an appraisal may be worthwhile. This
    may be worthwhile to the rest of the team with implications for the practice.


    # 10 Learning and development needs of practice and individuals


    This will be a list of learning and development needs with respect to the individual.
    It may include the different professional opportunities available, opportunities
    for learning and development, and the needs of the organisation and practice.'
  merge: -1
  img_proc: true
