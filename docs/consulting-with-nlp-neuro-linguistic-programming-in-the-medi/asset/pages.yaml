- pgno: 61
  md: 'its greatest impact when it is being used to drive improvement since it can
    translate into operational measures which can become the focus for team efforts.


    The four elements of the clinical value compass are as follows.


    +   - **Clinical outcomes** These may be considered to be direct consequences
    of interventions, e.g. signs, symptoms, complications etc.

    +   - **Functional status** Measures of health status that provide insight into
    the impact of clinical outcomes on, for example, quality of life.

    +   - **Satisfaction against need** The important factor here is the integration
    of need with the concept of satisfaction, thus making it patient-referenced as
    well as service-focused. Thus measures may relate to processes of care or the
    personal benefits realised by patients/clients and their families.

    +   - **Costs** Where costs are recognised to be an outcome of care. They may
    be direct service costs or indirect social costs.


    # Building knowledge for improvement


    Continuous improvement depends upon continuous learning and stories of successful
    improvement are inevitably stories of people learning together. This may be learning
    about the needs of their patients/clients, about the outcomes of the care they
    provide to these people or about the processes by which they provide this care.
    Reflecting on what they learn will provide clues to areas where improvements are
    necessary. Implementing changes and establishing key feedback measures creates
    another tier of learning and is at the heart of continuous improvement.


    At this point it is worth noting what seem to be the two most important paradigms.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - Focusing on patient/client needs, which is close to the hearts of all
    professionals.

    +   - Creating opportunities for adults to learn. Learning is a natural human
    ability and is fun despite any adverse experiences of education encountered during
    school and college careers.


    When these two paradigms merge in practice settings, very powerful conditions
    for real and sustainable improvement exist. The PPDP guide is underpinned by these
    paradigms.


    # Having a framework for learning


    Experience with improvement teams suggests that they benefit from having simple
    frameworks to guide them through their efforts. The framework that has received
    most attention recently is based on the work of Tom Nolan and his colleagues.⁷
    *See Figure 2 for a diagrammatic representation.*


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_62_0.png)


    Figure 2: Model for improvement.⁷'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The Nolan framework consists of three questions that offer a systematic way
    to turn ideas into action and increase the chances that it will lead to real improvements
    in practice. Addressing these questions leads to the PDSA cycle used as the guide
    to the implementation of, and learning from, the changes. As Berwick has noted,
    all improvement is change but not all change is improvement.¹⁹ The Nolan questions
    are built into the PDPD framework and influenced the work of the different practice
    teams who tested it out. The PDSA cycle is congruent with the concept of action
    learning that underpins the PDPD process as described in Part Three of this guide.


    As far as possible the idea is to choose small changes that can be implemented
    quickly. This is highly motivating for staff and the learning begins quickly thus
    maintaining their interest. Larger improvements are realised by the cumulative
    effects of rapid improvement (PDSA) cycles underpinned by serial learning (see
    Figure 3).⁷


    ![](img/aaf273c74157227c19ea0efc2dd3eabf_63_0.png)


    Figure 3: Serial learning and rapid improvement cycles.⁷'
  merge: -1
  img_proc: true
- pgno: 64
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - Teams value structure and guidance to ensure that time spent is an investment.

    +   - Improvement teams have fun.


    # ## Summary


    Maintaining improvement teams is difficult due to very heavy workloads but progress
    will not be made unless protected time can be secured. It is critical therefore
    that time spent is an investment rather than a burden. This demands a clear focus
    on topics of importance to patients and the practice, and the use of frameworks
    that will guide activities to success. Combining the PPDP framework and process
    with the principles and methods of CQI described above seems to be very helpful
    in this respect. There is a crucial need for support and commitment to protected
    time from high levels within practices. In addition there is a need to ensure
    that this activity informs and complements PDPs. It would be well worthwhile considering
    how to offer academic recognition for time spent in PPDP activity so that learning
    improvement skills becomes a crucial part of professional education alongside
    the learning of professional and technical skills.<sup>8</sup>


    For more detailed information about aspects of continuous quality improvement,
    see the NHS Modernisation Agency Improvement Leaders'' Guides, [www.modern.nhs.uk/improvementguides](http://www.modern.nhs.uk/improvementguides).'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # One practice’s story of team learning with PPDP*


    A market town practice (five principals, three whole time equivalents, 5700 patients)
    has been able to embrace the PPDP concept leading to significant patient benefits.
    The concept was launched at a multidisciplinary meeting. Ideas and information
    from this meeting were documented and circulated to all participants. The practice
    committed two hours of protected meeting time each month, replacing an unproductive
    previous meeting.


    The process is led by the practice clinical governance lead who is a GP partner.
    Simple work sheets are produced for each team member and distributed seven days
    before meetings. These sheets advertise meeting time and location, advise on group
    work and have space for each person to log their notes from this working time.
    They are collated in PDPs and in a practice PPDP portfolio, providing an essential
    link between personal and group learning.


    Meetings generally consist of work in small groups for the first hour, followed
    by lunch and feedback on work to the whole group. Significant event analysis or
    a short talk from a visiting speaker makes up the second part of the meeting.


    The practice followed the PPDP framework described earlier in this guide. Their
    journey through the different stages is outlined below.


    # ## Agreeing the purpose *(see Box 1 in the framework diagram)*


    There was agreement across the team that the purpose was to provide a high quality
    primary care service that meets patients’


    * Much of this material was first published in the *British Journal of General
    Practice* and is used with permission of the editors.^20'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'needs, both for care when they are unwell and to enable people to do all they
    can to remain healthy. Secondary aims of remaining a financially secure organisation
    and providing a good workplace for all staff were also agreed.


    # Assessing the needs (see Boxes 2, 3 and 4)


    A number of needs were identified by staff at the initial meeting. Other imperatives
    have either arisen from audits or significant events (''internal''), or have come
    from government policy, health authority or PCT directives (''external''). It
    is also accepted that individuals within the team will have personal learning
    needs arising from questions in their own practice, reflection on their work or
    appraisal.


    # Negotiating the actions to take and sharing the work (see Boxes 5, 6 and 7)


    The practice accepted that negotiation and choice was important – it would have
    been easy to take on too much and complete little. They looked for areas where
    there was congruence between the practice''s aims and those things that ''had
    to be done'' to satisfy the external agenda. They were also able to ensure the
    work was consistent with the practice''s membership of the National Primary Care
    Collaborative.


    # Planning the actions (see Boxes 8 and 9)


    For each action planned the practice team followed the CQI model and agreed:


    +   - the high-level aim'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   - what specifically we are trying to accomplish

    +   - the change that we think will lead to improvement

    +   - the measurements to see if the change has resulted in improvement

    +   - the plan to implement the change as a trial.


    The practice team or sub group then entered the PDSA process.^9


    # **Identifying the learning needs** *(see Box 10)*


    For each change planned they looked to see what the learning needs were for the
    improvement to come about. These included:


    +   - the acquisition of specific skills or knowledge by one or two team members,
    e.g. a practice nurse’s learning about how to carry out spirometry and the interpretation
    of the results

    +   - more general knowledge for a greater number of the team, e.g. all of the
    clinical team needed to know which patients it is appropriate to refer to spirometry,
    what the patient should expect and what the likely outcomes might be

    +   - systems with which it was essential the whole team were confident, e.g.
    the use of a paperless internal communication and message system.


    # **Planning learning actions** *(see Box 11)*


    Once these learning needs were identified, ways to meet them were decided upon.
    These included attendance at external courses, bringing a resource to a practice
    education meeting or just a learning activity within the team.'
  merge: -1
  img_proc: true
