- pgno: 8
  md: '![](img/aaf273c74157227c19ea0efc2dd3eabf_8_0.png)


    # # Foreword


    Professions have a number of characteristics in common, amongst which two are
    of particular interest to the notion of practice development plans. The first
    is a special relationship with those whom they serve – patients, in the case of
    health professionals. The second is the concept of self regulation and the ability
    to assure the public that the doctor, nurse, physiotherapist etc. are fit to practise.
    Both of these characteristics are captured in the concept of practice development
    plans. These plans are first of all directed at improving the quality of care
    to patients and the health of the public. Second, they are about ensuring that
    all professionals are up to date and aware of new developments in practice.


    Over the years, self regulation has been practised in many different ways. Individual
    professional groups have meetings, case conferences, audit, clinical reviews,
    and many other activities, all of which were designed to question existing practice
    and to improve it. With the increasing development of team-based practice it was
    an obvious step to use the team as the focus for learning and improving patient
    care. Hence the development of the practice-based planning process, a potentially
    very powerful way of ensuring change and improvement.


    Such a process is not new and is already happening in many places. However, the
    more systematic approach adopted in this guide allows its wider application, and
    for those not already involved, it provides a very useful way to start the process.


    The guide begins by defining the problems or tasks to be undertaken. Such methods
    are particularly useful in that they identify real issues which are relevant to
    a wide group of health professionals and to which everyone can contribute. The
    learning is therefore both about the problem itself, but also from'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'each other, as the different professional expertise is brought to

    bear on a particular problem. It is outcome focused on the needs

    of patients and the community, and thus on overall improvement

    in care. If several topics are chosen each year and acted upon,

    then over a period of several years there will be a significant

    improvement in patient care across the practice. Indeed, the

    mere fact that such a process exists stimulates a regular review

    of practice in other areas.


    A major constraint put forward is that of time. How can we

    find the time to do this? Experience shows that such a process

    may even save time as new methods of working may make the

    practice more efficient as well as more effective. There is also the

    concern that such practice-based planning might get in the way

    of personal development plans. Again, experience suggests that

    the two are not incompatible and indeed support each other.


    Any remaining doubts should be expelled by a look at the

    examples given in this guide. They bring the whole process to

    life and show how learning in teams and sharing of experience

    can add to the quality of care provided. This must be one of the

    objectives of all professional groups and if, at the same time, it

    enhances professional roles and is associated with personal

    development then it is of all-round benefit. This guide shows how

    it can be done, and how such benefits can be achieved. The

    objective, after all, is to serve our patients and the community

    more effectively.


    Professor Kenneth Calman

    Vice Chancellor and Warden

    University of Durham

    Former Chief Medical Officer, England

    *March 2003*'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# # Preface


    We are very pleased to welcome you to this guide, which has grown out of our work
    at the Institute of Health and Community Studies, Bournemouth University with
    general practices, mainly in Dorset, over a period of several years. In the early
    days our focus was on the use of the principles and methods of continuous quality
    improvement within primary care and this then broadened more explicitly into the
    use of these methods by interprofessional teams within practice.¹


    One of the questions that surfaced regularly was how we could move our work from
    special projects with external funding to mainstream activity that is part of
    everyday practice, and which involves everybody within the practice. We were aware
    that unless both of these were achievable the goal of continuous improvement itself
    could not be achieved.


    We were excited therefore when Dr Sir Kenneth Calman proposed the idea of practice
    professional development plans (PPDPs) in 1998.² Not only were the underlying
    principles of his idea congruent with the work we had been undertaking but we
    felt that the methods we had been exploring would lend themselves well to supporting
    the implementation of PPDPs, as well as giving them a clear ‘needs’-based focus.
    One of our early lessons, quite appropriately, had been that if you want busy
    staff to devote time to activities it had to be clear that this would be an investment
    that would provide benefits for patients.


    We experimented with the ideas for a while, influenced by Deming’s ideas about
    organisations as systems, and developed an initial framework for preparing PPDPs
    (*see* Deming, WE (1993) *The New Economics*. MIT Press, Cambridge, MA). We were
    looking for a way to connect patient and community needs, continuous quality improvement
    methods and adult learning'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'principles. Our goal was to establish a process that would allow

    individual and practice development plans to be linked to the

    practice’s agreed improvement priorities, which in turn could

    clearly be traced back to an exploration of the needs of the

    practice’s patients and local community. In addition these days

    it is crucial to take into account externally-imposed government,

    strategic health authority (SHA) and primary care trust (PCT)

    targets.


    We were fortunate to obtain funding to test the framework

    out with a small cohort of practices within Dorset. We learned a

    lot and the feedback was positive enough to test things out fur-

    ther with a second small group, this time from different parts of

    the region. The feedback remained positive and the framework

    helped create PPDPs that produced benefits for practices and

    those that depended on them. At the same time the framework

    was introduced more broadly across Dorset where approximately

    half the practices now use it to guide their practice professional

    development planning.


    One regular request has been to provide structured guidance

    for those wishing to use the approach. This guide has been

    prepared in response to such requests. It is neither a cookbook

    nor a textbook but contains the distillation of our learning

    from the practices with which we have worked. In many ways

    it is a celebration of their work and we are very grateful to

    them for having been prepared to act as test beds for the future.


    Peter Wilcock

    Charles Campion-Smith

    Sue Elston

    *March 2003*'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # About the authors


    **Peter Wilcock** BSc, Dip Psych, MSc, PGCert (THE), C Psychol, FBPsS, ILTM is
    a Chartered Clinical Psychologist with over 20 years of clinical and managerial
    experience in the NHS. Since 1993, he has been a member of the academic staff
    at the Institute of Health and Community Studies at Bournemouth University, where
    he is Visiting Fellow in Healthcare Improvement. His special interest is linking
    the principles and methods of continuous quality improvement with interprofessional
    learning in practice settings. He is an advisor to the NHS Modernisation Agency
    on using patient narratives to drive improvement in care.


    He publishes regularly in the field of healthcare improvement and interprofessional
    learning and is a member of the Editorial Board of the *Journal of Interprofessional
    Care*, being joint Guest Editor of a special edition about continuous quality
    improvement in May 2000.


    **Charles Campion-Smith** MB ChB, DCH, FRCGP has been a General Practitioner in
    Dorchester, Dorset for 23 years. He is Associate Lecturer in Primary Care Education
    and Development at the Institute of Health and Community Studies at Bournemouth
    University.


    He has been involved in education for more than 10 years, initially as GP Tutor
    and more recently working with interprofessional primary care teams, using a continuous
    quality improvement approach to help teams design and bring about improvement
    in the services they offer their patients.


    He has published papers on general practitioner education, interprofessional learning
    and continuous quality improvement in primary care.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Sue Elston MA, MIMgt, FAETC, AMSPAR Dip is a Practice Manager for a five-doctor
    partnership in Bournemouth and is seconded to the Institute of Health and Community
    Studies, Bournemouth University, as an Educational Facilitator in primary care.
    She has been involved in education in general practice for the past 10 years and
    since completing her MA in Interprofessional Health and Community Care has developed
    a keen interest in interprofessional education and development.


    She presented her MA dissertation at the 4th International Qualitative Research
    Conference in Canada in 2000 and the work was published in the *Journal of Interprofessional
    Care*. Over the past two years her work has included facilitating the process
    of practice professional development planning for around 60 practices across Dorset
    and the surrounding area.'
