  mdcn: "\n## 梅普尔斯诊所的故事\n\n- 1. 诊所与个人的学习和发展需求\n- 1. 我们可以采取哪些具体的教育行动？如何衡量每项行动的效果？\n\
    - 4. 个人发展需求\n\n### 档案的证据\n\n诊所经理很想了解PHCT和PPDP流程是否有用。对第一次研讨会的评估表明，由于PHCT会议已被放弃，这对团队来说是一个审查诊所工作的好机会。团队有机会讨论并为诊所的未来做出贡献，这是该项活动最积极、最有价值的成果。\n\
    \n- 改善患者就医可及性\n- 电话咨询技能\n- 有效使用计算机\n- PHCT成员使用慢性病管理（CDM）模板、NHS电子学习和其他资源进行患者照护\n\
    - 年度评估（非严重事件）产生的培训需求\n- 复苏技能更新\n- 风险评估/风险管理更新\n- 投诉处理更新\n- 应对难缠人员\n- 流感疫苗接种技能\n\
    \n## 第5阶段：规划年度内PPDP进展审查\n\n### 引言\n\n本阶段强调在PPDP中每个年度周期内定期审查进展的重要性。随附的诊所故事说明了开展此类审查的一种方法。\n\
    \n![](img/aaf273c74157227c19ea0efc2dd3eabf_51_0.png)\n\n## 规划年度内PPDP进展审查\n\n![](img/aaf273c74157227c19ea0efc2dd3eabf_52_0.png)\n\
    \n## 梅普尔斯诊所的故事\n\n### 12 定期“年内”进展审查\n\n梅普尔斯医疗中心PPDP团队同意以下会议安排，以开展工作、向PHCT反馈并审查PPDP流程：\n\
    \n- 项目小组最初每月开会（一旦改进工作启动，频率可能降低）\n- PPDP团队每两个月开会一小时，审查进展\n- 将按季度向整个PHCT提供反馈。\n\n\
    ## 第6阶段：规划下一年度PPDP\n\n![](img/aaf273c74157227c19ea0efc2dd3eabf_54_0.png)\n\n**目的：**\
    \ 继续改进我们满足个人、群体和当地社区健康需求的方式。\n\n我们建议在计划实施九至十个月时进行审查（例如，或许与卫生局或PCT的规划时间表一致）。审查当前计划的进展将使您能够讨论并商定未来12个月的改进优先事项。您还需要考虑由国家级、SHA和PCT优先事项（包括NSFs）产生的外部议程。为审查当前计划，针对每个优先领域回答以下问题将有所帮助。\n\
    \n- **关于改进优先事项：**\n  - 计划中的改进行动是否发生？如果没有，您了解原因吗？\n  - 如果是，结果是什么？您如何得知？\n  - 从您的PDSA反馈指标中学到了什么？\n\
    \  - 对患者和员工而言，获益是什么？\n- **关于教育行动：**\n  - 计划中的行动是否发生？\n  - 如果是，结果是什么？您如何得知？\n \
    \ - 如果计划中的行动未发生，障碍和困难是什么？从这些中学到了什么，已经采取并需要采取哪些进一步行动？\n  - 对患者和涉及员工而言，获益是什么？\n\n\
    在这一年中，是否出现或被施加了其他内部或外部优先事项，从而导致计划修订？这些对下一年度PPDP有何影响？\n\n**记住**——这是一个持续的过程，团队需要持续重新审视该框架，至少每年一次。\n\
    \n## 第四部分：一些有用的提示和资源\n\n### 反思PPDP流程指南\n\n检查团队对PPDP流程的理解，对于使团队自信地推进各个阶段至关重要。非常值得在每个研讨会结束时花10到15分钟，向团队询问几个关于他们在研讨会中的体验以及对PPDP不断发展的理解的问题。\n\
    \n重要的是要认识到每个诊所都将按自己的节奏推进。我们的经验表明，在有经验的引导者协助下，PPDP流程的大部分内容可以在两次两个半小时的研讨会中完成，尽管这需要如前所述在会议之间开展工作。一些诊所团队可能选择花更长时间，将流程分散到三次或更多研讨会中。以下是几个有助于检查团队对流程理解的问题。\n\
    \n在每个研讨会结束时，通过询问以下问题来了解参与者对讨论进展的感受：\n\n- 哪些方面进展顺利\n- 哪些方面可以做得更好\n- 您觉得自己能够为讨论做出贡献吗\n\
    - 您觉得自己被倾听了吗？\n\n![](img/aaf273c74157227c19ea0efc2dd3eabf_59_0.png)\n\n图1：支撑我们工作的照护提供模型。<sup>9</sup>\n\
    \n开发反映这些需求的结果指标。然而，这超出了本指南的范围。我们的重点是利用CQI原则和方法，为PPDP提供一种非常务实的方法。\n\n### 改进照护流程\n\
    \n迄今为止发表的CQI研究大多强调模型的中部，即专业团队共同重新设计支撑其执业的流程。<sup>10–12</sup> 这一点至关重要，因为不改进提供照护的流程就不可能改善照护。例如，团队发现，当他们尝试绘制描述当前工作方式的简单流程图时，这会引发大量关于他们共同运作所依据的假设的讨论。这通常是他们第一次汇集各自的知识，并利用这些知识共同决定在何处以及如何改进他们提供的照护。这种非常以患者为中心的讨论似乎发挥重要作用，有助于创造新的工作方式，从而加强跨专业团队合作。\n\
    \n然而，也需要关注照护模型的两端。\n\n当它被用于推动改进时，其影响最大，因为它可以转化为可操作的措施，这些措施可以成为团队工作的重点。\n\n临床价值罗盘的四个要素如下。\n\
    \n- **临床结果** 这些可被视为干预的直接结果，例如体征、症状、并发症等。\n- **功能状态** 健康状态测量指标，可深入揭示临床结果对例如生活质量的影响。\n\
    - **需求满足度** 这里的重要因素是将需求与满意度概念整合，从而使其既以患者为参照又以服务为重点。因此，测量指标可能涉及照护流程，或患者/服务对象及其家庭所实现的个人获益。\n\
    - **成本** 此处成本被认定为照护的一种结果。它们可以是直接服务成本或间接社会成本。\n\n### 为改进积累知识\n\n持续改进依赖于持续学习，而成功改进的故事必然是人们共同学习的故事。这可能是学习了解患者/服务对象的需求、了解他们为这些人提供照护的结果，或了解他们提供这种照护的流程。反思所学内容将为需要改进的领域提供线索。实施变革并建立关键反馈指标创造了另一层学习，并且是持续改进的核心。\n\
    \n在这一点上，值得注意似乎是两个最重要的范式。\n"
