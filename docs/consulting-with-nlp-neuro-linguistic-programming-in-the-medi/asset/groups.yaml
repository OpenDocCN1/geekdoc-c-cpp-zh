    - 工作坊\n  - 第一次 86\n  - 第二次 87–8\n\n伴有 down\n\n## 实践专业发展规划：初级保健指南\n\n本实用指南提供信息与有用的学习资源，概述制定实践专业发展计划（PPDPs）的步骤、关键要素和关键学习原则。它将鼓励团队或小组学习，并包含实用框架，适用于繁忙的诊所中无法同时以小组形式开展发展任务的情形。\n\
    \n本书面向所有负责领导和促进实践专业发展计划的全科医生和诊所员工。\n\n> “本指南给出的示例让整个基于诊所的规划过程生动起来，并展示了团队学习和经验分享如何提升所提供的照护质量。这必定是所有专业群体的目标之一；如果与此同时它还能增强专业角色并与个人发展相联系，那么就会带来全面的益处。本指南展示了如何做到这一点，以及如何实现这些益处。”\n\
