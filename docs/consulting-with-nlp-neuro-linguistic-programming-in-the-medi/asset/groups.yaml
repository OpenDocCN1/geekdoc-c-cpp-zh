    # PART FOUR:


    # Some useful tips and resources


    # A guide to reflecting on the PPDP process


    Checking out the team’s understanding of the PPDP process is vital to enabling
    the group to progress confidently through the various stages. It is well worth
    taking 10 to 15 minutes at the end of each workshop to ask the group a few questions
    about their experience of the workshop and their developing understanding of PPDPs.


    It is important to acknowledge that each practice will work at its own pace. Our
    experience has shown that with the assistance of an experienced facilitator much
    of the PPDP process can be completed in two two-and-a-half-hour workshops although
    this requires work to be undertaken between meetings as mentioned earlier. Some
    practice teams may choose to take longer and to spread the process over three
    or more workshops. The following are a few questions to help check out the team’s
    understanding of the process.


    At the end of each workshop check with participants how they felt the discussion
    had gone by asking:


    +   - what went well

    +   - what could have been better

    +   - did you feel able to contribute to the discussion

    +   - did you feel you were heard?'
