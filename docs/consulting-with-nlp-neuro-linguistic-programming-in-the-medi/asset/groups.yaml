  mdcn: "\n\n## 前言\n\n我们非常高兴地向您推荐本指南。它源于我们多年来在伯恩茅斯大学健康与社区研究所与全科诊所（主要在多塞特郡）合作开展的工作。早期，我们的重点是初级保健中持续质量改进原则和方法的运用，之后更明确地拓展为诊所内跨专业团队对这些方法的运用。¹\n\
    \n经常出现的一个问题是，我们如何将工作从有外部资金支持的特别项目转变为日常执业中涉及诊所内每个人的主流活动。我们意识到，除非这两点都能实现，否则持续改进本身的目标就无法达成。\n\
    \n因此，当肯尼思·卡尔曼爵士博士于1998年提出诊所专业发展规划（PPDPs）的想法时，我们非常兴奋。² 他的想法所依据的基本原则不仅与我们一直在进行的工作一致，而且我们觉得，我们一直探索的方法将非常有助于支持PPDPs的实施，并为其提供一个明确的以“需求”为基础的焦点。我们早期的一个教训，恰如其分，就是：如果你想让忙碌的员工投入时间参与活动，就必须清楚地表明这是一项能为患者带来益处的投资。\n\
    \n我们在一段时间内尝试了这些想法，受到戴明关于组织即系统的思想影响，并开发了一个初步的PPDP制定框架（*参见* Deming, WE (1993) *《新经济学》*。MIT\
    \ Press, Cambridge, MA）。我们一直在寻找一种方法，将患者和社区需求、持续质量改进方法与成人学习原则联系起来。我们的目标是建立一个流程，使个人和诊所的发展计划能够与诊所商定的改进优先事项挂钩，而这些优先事项又可以清晰地追溯到对诊所患者和当地社区需求的探索。此外，如今还必须考虑外部强加的政府目标、战略卫生局（SHA）目标和初级保健信托机构（PCT）目标。\n\
    \n我们有幸获得了资金，在多塞特郡的一小部分诊所中对该框架进行了测试。我们学到了很多，反馈也足够积极，于是又用第二批小组进行了进一步测试，这次他们来自该地区的不同地方。反馈依然积极，该框架帮助制定的PPDPs为诊所及其所服务的人群带来了益处。与此同时，该框架在多塞特郡得到了更广泛的推广，如今大约一半的诊所使用它来指导其诊所专业发展规划。\n\
    \n一个经常出现的请求是，为那些希望采用该方法的人提供结构化的指导。本指南就是为了回应这些请求而编写的。它既不是操作手册，也不是教科书，而是我们与所合作诊所的经验结晶。在许多方面，它是对他们工作的礼赞，我们非常感谢他们愿意充当未来的试验田。\n\
    \nPeter Wilcock  \nCharles Campion-Smith  \nSue Elston  \n*2003年3月*\n\n## 关于作者\n\
    \n**Peter Wilcock**，BSc、Dip Psych、MSc、PGCert（THE）、C.Psychol.、FBPsS、ILTM，拥有20多年NHS临床和管理经验的特许临床心理学家。自1993年起，他一直是伯恩茅斯大学健康与社区研究所的学术人员，现任医疗改进客座研究员。他特别感兴趣的是将持续质量改进的原则和方法与执业环境中的跨专业学习联系起来。他是NHS现代化局关于使用患者叙述推动护理改进的顾问。\n\
    \n他定期在医疗改进和跨专业学习领域发表文章，并且是*《跨专业照护杂志》*编委会成员，在2000年5月担任了关于持续质量改进的特刊联合客座编辑。\n\n**Charles\
    \ Campion-Smith**，MB ChB、DCH、FRCGP，在多塞特郡多切斯特担任全科医生已有23年。他是伯恩茅斯大学健康与社区研究所初级保健教育与发展副讲师。\n\
    \n他从事教育工作已超过10年，最初担任全科导师，最近与跨专业初级保健团队合作，使用持续质量改进方法帮助团队设计并实现为其患者提供的服务改进。\n\n他发表过关于全科医生教育、跨专业学习和初级保健持续质量改进的论文。\n\
    \n**Sue Elston**，MA、MIMgt、FAETC、AMSPAR Dip，是伯恩茅斯一家五名全科医生合伙的诊所的诊所经理，并被借调到伯恩茅斯大学健康与社区研究所担任初级保健教育促进员。她过去10年一直参与全科教育，并在完成跨专业健康与社区关怀硕士学位后，对跨专业教育和发展产生了浓厚兴趣。\n\
    \n她于2000年在加拿大举行的第四届国际质性研究会议上展示了她的硕士论文，该论文发表在*《跨专业照护杂志》*上。过去两年中，她的工作包括为多塞特郡及周边地区约60家诊所的诊所专业发展规划流程提供引导支持。\n\
    \n## 致谢\n\n本指南所基于的工作在伯恩茅斯大学健康与社区研究所开展了数年，并得到了多塞特卫生局、韦塞克斯地区毕业后医学教育委员会和NHS西南地区执行局的资金支持。\n\
    \nSue Elston在诊所专业发展规划（PPDP）方面为诊所提供的促进工作，作为教育促进员项目得到了韦塞克斯地区毕业后医学教育委员会和伯恩茅斯大学的支持。\n\
    \n我们感谢以下人员的支持：\n\n- David Percy博士，前韦塞克斯全科医学研究生教育主任\n- Howard Nattrass，前健康与社区研究所所长\n\
    - Steve Annandale和Sheila McCann，NHS西南地区执行局\n\n特别感谢多塞特郡和英格兰西南部各地的诊所，他们与我们合作，尝试并完善了这些想法。也感谢多塞特全科导师和副顾问团队的支持。\n\
    \nTom Hopkins帮助我们将这项工作转化为可读且易于理解的格式；Natasha Young多年来提供了文书协助和技术支持；我们感谢他们两位。\n\n\
    我们感谢健康与社区研究所的同事以及更远方的同行，他们对这项工作提出了质疑和评论，帮助我们澄清了表述，并且，我们希望，改进我们的描述方式。\n\n我们感谢肯尼思·卡尔曼爵士教授，他既为这项工作提供了最初的灵感，又为指南撰写了前言。\n\
    \n“一家诊所运用PPDP进行团队学习的故事”一章最初发表于*《英国全科医学杂志》*质量增刊（2002年10月），此处经编辑许可使用。关于持续质量改进的章节改编自Wilcock和Campion-Smith³，并经编辑许可使用。关于重大事件分析的章节基于埃克塞特的Jonathan\
