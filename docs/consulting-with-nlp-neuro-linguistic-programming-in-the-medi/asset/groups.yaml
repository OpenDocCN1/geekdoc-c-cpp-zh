    ## Introduction to the guide


    Welcome to *Practice Professional Development Planning (PPDP): a guide for primary
    care.* The guide is the outcome of a development project on PPDP, supported by
    the South West Region NHS Executive, and undertaken during the period 1998–2001
    by the authors. It has been designed to help practice staff in planning and undertaking
    the tasks and activities involved in PPDP. In particular, the guide should prove
    helpful to those staff with special responsibility for leading and/or facilitating
    the PPDP process within their work setting.


    ### What does the guide contain?


    The guide contains a number of information and learning resources:


    - background information and context of PPDP

    - information about key elements, structures and processes in PPDP and related
    concepts

    - points between each stage designed to help you reflect about progress and identify
    activities still to be undertaken, or things that might be better done differently

    - a case example of PPDP in action, the Maples Practice, which is a composite
    based on the experience of the different practices involved in the early work

    - references to recommended and suggested further reading listed in Part Four.


    ### How should the guide be used?


    The guide is intended primarily to help team or group-based learning. However,
    it is highly likely that in busy practices there will be times when it is difficult,
    if not impossible, for all staff to work together simultaneously on developmental
    tasks. In this case the guide can provide a useful framework for absent staff
    to keep abreast of colleagues'' learning activities, and a means of support in
    catching up with recent developments.


