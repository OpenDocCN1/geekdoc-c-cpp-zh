    # Establishing a palliative care register and regular review meetings


    +   * **Aim** To work as an effective and supportive interprofessional clinical
    team.

    +   * **What are we trying to achieve?** To improve patient care, interprofessional
    communication and teamworking and support in a practice-based team delivering
    palliative care.

    +   * **Can we plan a change that we think will lead to improvement?** To establish
    a practice palliative care register and conduct a fortnightly interprofessional
    review of the patients on it.

    +   * **Can we make measurements to see if the change has resulted in improvement?**
    Review after four months. Did the meetings occur? Are there instances where care
    improved as a result? Did staff members value the meetings?

    +   * **How can we plan to implement the change as a trial?** Clinical team to
    meet regularly to review those on the register. Agreed criteria for entry to the
    register, agreed computer coding to record entry.

    +   * **What are the learning needs and actions required?** Review of different
    criteria defining ''palliative care''. Dissemination to whole team of understanding
    of special needs of patients receiving palliative care and their families. Review
    of criteria for assessing care as a basis for regular review. Development of skills
    of membership and leadership of interprofessional team. Review of procedures used
    to ensure continuity of care out of hours. Specific clinical and communication
    issues identified for future learning as they arise.


    # *Results*


    +   * Benefits to patients

    +       - review of their care and needs

    +       - team members more aware of their situation

    +       - criteria-based review of their care should lead to less unmet need

    +       - regular proactive review should lessen the chance of patients becoming
    ''lost''.

    +   * Benefits to team

    +       - team members feel better supported in their work

    +       - there is a forum for discussing difficult clinical or interpersonal
    issues

    +       - there is an opportunity for specific learning in response to clinical
    problems.'
