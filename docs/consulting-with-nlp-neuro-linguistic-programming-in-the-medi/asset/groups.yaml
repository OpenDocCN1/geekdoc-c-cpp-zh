  - '[PAGE 61]


    its greatest impact when it is being used to drive improvement since it can translate
    into operational measures which can become the focus for team efforts.


    The four elements of the clinical value compass are as follows.


    +   - **Clinical outcomes** These may be considered to be direct consequences
    of interventions, e.g. signs, symptoms, complications etc.

    +   - **Functional status** Measures of health status that provide insight into
    the impact of clinical outcomes on, for example, quality of life.

    +   - **Satisfaction against need** The important factor here is the integration
    of need with the concept of satisfaction, thus making it patient-referenced as
    well as service-focused. Thus measures may relate to processes of care or the
    personal benefits realised by patients/clients and their families.

    +   - **Costs** Where costs are recognised to be an outcome of care. They may
    be direct service costs or indirect social costs.


    # Building knowledge for improvement


    Continuous improvement depends upon continuous learning and stories of successful
    improvement are inevitably stories of people learning together. This may be learning
    about the needs of their patients/clients, about the outcomes of the care they
    provide to these people or about the processes by which they provide this care.
    Reflecting on what they learn will provide clues to areas where improvements are
    necessary. Implementing changes and establishing key feedback measures creates
    another tier of learning and is at the heart of continuous improvement.


    At this point it is worth noting what seem to be the two most important paradigms.'
