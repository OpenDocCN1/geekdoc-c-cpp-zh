    C: clinical course, investigation, treatment, infectivity. |

    | **Learning plan**<br>How shall I do this?<br>What will I do with whom, who?
    | Internet search, journal reading, ask colleagues. |

    | **The learning done**<br>What did I do? | • Web page of Canadian Association
