  mdcn: "\n\n## 个人发展计划（PDPs）\n\n我们已说明，PDPs 与 PPDP 密切相关，团队在实施 PPDP 过程中可能会确定个人学习与发展主题。不过，我们也承认，团队成员个体可能有自己的兴趣、职业规划和抱负，这些都会影响其学习计划。我们相信，个人发展计划的过程可以遵循我们为\
    \ PPDP 提出的类似框架。\n\n正如 PDP 所要求的，需要在响应外部需求、反思个人实践以及兼顾个人兴趣与抱负之间取得平衡。与 PDP 相同，一旦个人确定了学习需求，就需要计划学习行动来满足该需求，并明确目标和衡量标准，以判断每个学习行动是否达到了预期目标。\n\
    \n这里给出的框架适用于诊所中各类工作人员，我们相信，无论是高级合伙人、诊所护士还是全科住院医师，都同样适用。通过遵循这一框架并收集有关所遵循过程和所取得学习的证据，我们相信您将为注册后教育与执业（PREP）、评估和再认证准备奠定良好的材料基础。\n\
    \n- 诊所及其服务人群的具体特征。\n- 对因缺乏先前教学或经验而不太有信心的领域进行的评估。\n- 对日常实践的反思和对患者接触情况的回顾。\n- 诊疗中的不确定领域、重大事件或与评估者的会面，都可能突显出您觉得无法满足患者需求、或感到不适或不自在的领域。例如，是否有某些类型的患者让您觉得更难与之相处或应对？将这些需要考虑的领域进行分类可能会有所帮助：\n\
    \  - 知识\n  - 知道如何做，即谁提供这项服务、从哪里获得这些信息、如何联系该机构\n  - 技能，可能包括：\n    - 技术性技能，例如如何向肩关节进行注射、如何进行切除活检、复苏培训\n\
    \    - 人际交往技能，例如如何告知坏消息、在丧亲后进行家访、应对患者的不合理期望，或在同事或员工采取无益行动后给予反馈\n  - 态度，例如意识到某种情况或患者让您产生烦恼、愤怒、不适、不确定或“令人沮丧”的感觉。\n\
    - 对您的执业中诸如守时、病例组合或处方等方面的审计或调查结果。\n- 定期评估以及来自同行、合伙人或员工的反馈所产生的问题。\n\n使用学习档案的这一部分来记录您的学习需求。\n\
    \n### 学习风格\n\n您可能知道自己偏好的、最有效的学习风格——不同人之间差异很大。要注意单一风格的优势和局限，并尝试发展多种风格以适应不同的学习需求。您可能会决定将这方面的工作作为早期学习目标之一。有相关问卷可帮助您，您当地的全科导师将能够为您提供指导。\n\
    \n使用学习档案的这一部分来记录您对学习行动的选择以及选择原因。\n\n### 第三阶段：具体的改进行动\n\n（参见框6和框7）（“如何做”）\n\n在您已确定的领域，您打算如何满足学习需求？\n\
    \n- 您希望实现什么？为成功学习设定一个明确的目标/结果。例如，可以这样确定：“我将更好地理解如何管理糖尿病就诊患者”或“我在讨论社会心理问题时会更自如”。目标越具体，就越容易聚焦于实现目标所需做的事情。\n\
    - 确定能够告诉您是否已达到目标的衡量标准——可以是小型审计或对一名或多名患者的病例回顾。您如何知道所做的任何改变都是一种改进？\n- 使用PDSA循环来帮助您计划变革、采取必要行动、评估结果并根据结果采取行动。\n\
    \n使用学习档案的这一部分来制定行动计划：学习什么；何时进行；谁或什么作为资源；何时以及和谁一起审查学习计划？\n\n个人学习档案的摘录示例如下：\n\n\
    |  |  |\n|---|---|\n| 触发事件或不确定领域 | 心力衰竭（HF）中的β受体阻滞剂。<br>患者出院时使用了β受体阻滞剂。我原以为它们在心力衰竭中属于禁忌，但在某处看到过相关论文。\
    \ |\n| 学习需求<br>我需要了解/学习什么？ | 很多方面，包括：<br>• 证据是什么？<br>• 哪些人受益？<br>• 哪些药物和什么剂量？\
    \ |\n| 学习计划<br>我该怎么做？<br>我将与谁、在何时做什么？ | 在线期刊检索，留意临床会议，咨询同事。 |\n| 学习日期和所用时间 | 一小时的网络检索和两小时的期刊阅读：2001年2月22日。\
    \ |\n| 反思<br>我学到了什么？ | 我现在了解了心力衰竭的NYHA分级。我知道β受体阻滞剂对部分心力衰竭患者有效，且获益在三个月内逐渐增加。 |\n\
    | 回顾<br>我是否完成了计划的学习？<br>我是否找到了想要的？ | 是的，但仍需进一步学习。 |\n| 它是否以任何方式改变了我的实践？ | 已开始对一位患者（FK先生）使用，目前尚无明确获益。可能需要做一次审计，考虑还应纳入多少患者。将NYHA编码添加到计算机中。\
    \ |\n| 我的学习档案中是否有相关证据？<br>下一步是什么？ | 与诊所团队讨论。 |\n\n## 用于记录不确定领域以促进未来学习的简易记录表\n\n\
    | 问题或不确定之处 | 我需要知道什么？ | 我将如何查明？ | 我做了吗？（日期和人员） | 我学到了什么？ |\n|---|---|---|---|---|\n\
    |  |  |  |  |  |\n|  |  |  |  |  |\n|  |  |  |  |  |\n\n## 促进PPDP会议：来自我们经验的学习\n\
    \nPPDP过程能够：\n\n- 让团队成员通过正式结构化的活动以及每日工作过程中更非正式的方式，进行个人和团队学习\n- 让诊所培养积极的学习态度，并在非正式环境中体验共同学习的价值\n\
    - 让团队创建学习文化，并从战略上规划个体学习需求以及整个团队的需求。\n\n促进自己的诊所团队可能很困难——作为团队的一员，您需要做出贡献；而作为促进者则不需要。同时扮演促进者和参与者的角色就是“打破规则”；促进者应完全保持公正。²¹\
    \ 诊所可以考虑与邻近诊所建立基于信任和公正的互惠安排。我们的经验是，当促进者来自组织外部，并能完全专注于团队需求时，团队学习会得到增强，这能提高小组的安全感，并允许更多的坦诚分享和冒险。²²\n\
    \n诊所团队以地位等级制度著称——全科医生和雇主可能被视为支配者和有权势者，护士可能被视为顺从者，行政人员则常常被忽视。每位团队成员对工作坊的贡献将由他们的工作角色和以往经验决定。这要求促进者在方法上保持灵活，并能处理不断涌现的材料——换句话说，要顺其自然。\n\
    \n群体动态的管理取决于促进者的技能，促进者有责任创造一个舒适、安全的环境，让所有贡献都得到同等重视。\n\n### 促进者与诊所之间的初次会议\n\n促进者与诊所经理（有时还有一位全科医生）会面，目的是：\n\
