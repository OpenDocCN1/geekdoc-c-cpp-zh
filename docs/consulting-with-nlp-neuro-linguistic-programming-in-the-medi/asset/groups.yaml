    # ## PRACTICE PROFESSIONAL DEVELOPMENT PLANNING:

    a guide for primary care


    This practical guide provides information and useful learning resources outlining
    the steps, key elements and key learning principles for developing Practice Professional
    Development Plans (PPDPs). It will encourage team or group-based learning, and
    includes useful frameworks for times when it is not possible to work simultaneously
    as a group on development tasks within busy practices.


    This book is for all general practitioners and practice staff who are responsible
    for leading and facilitating PPDPs.


    > > ''The examples given in this guide bring the whole practice-based planning
    process to life and show how learning in teams and sharing of experience can add
    to the quality of care provided. This must be one of the objectives of all professional
    groups and if, at the same time, it enhances professional roles and is associated
    with personal development then it is of all-round benefit. This guide shows how
    it can be done, and how such benefits can be achieved.''

    > >

    > > **Sir Kenneth Calman, Former Chief Medical Officer**


    # ## Other Radcliffe books of related interest


    +   - **The Challenge for Primary Care**

    +     *Nigel Starey*

    +   - **Primary Care Training and Development**

    +     *the tool kit*

    +     *Lynn Talbot and Denise Pora*

    +   - **Work Based Learning in Primary Care**

    +     *Edited by Jonathan Burton and Neil Jackson*

    +   - **The GP''s Guide to Personal Development Plans**

    +     *Second Edition*

    +     *Amar Rughani*

    +   - **PUNs and DENs**

    +     *discovering learning needs in general practice*

    +     *Richard Eve*

    +   - **Continuing Professional Development in Primary Care**

    +     *making it happen*

    +     *Gill Wakley, Ruth Chambers and Steve Field*

    +   - **The Toolbox for Portfolio Development**

    +     *a practical guide for the primary healthcare team*

    +     *Roger Pietroni*'
