    Has it altered my practice in any way? Is there any evidence of this for my portfolio?<br>What
    next? | • I did the learning.<br>• I found answers to the immediate question and
    now feel I know more about Hepatitis B and C.<br>• I have reflected on the process
    and shared it with others as an example of informal ''just in time learning''.<br>•
    I have questioned some of my judgemental decision making and have asked my partners
    to consider a practice-wide policy on routinely wearing gloves for venepuncture.<br>•
    The written account of this learning journey is in my portfolio and has value
    for both process and content.<br>• The initial patient has been referred to a
    specialist clinic. |'
