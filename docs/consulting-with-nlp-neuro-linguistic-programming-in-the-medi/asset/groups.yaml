  mdcn: "\n## 管理流程\n\n对SEA流程的管理，配以良好的促进和领导，至关重要。整个团队必须投入并具有主人翁意识，其最初的保留意见应被表达和倾听。给予安抚、营造安全感，并确保所有人都能参与决策，这一点很重要。为此，就会议规则和指南达成一致可能很重要。目标是创造微小但重要的改变。\n\
    \n当流程运行良好时，它有助于团队达成解决方案和行动，并营造出共同工作的感觉。\n\n议题通常应由与重大事件相关的人员提出。有引导的团队讨论应先赞扬做得好的地方，然后再提出批评。关键要点和行动应记录下来，以供未来回顾。\n\
    \n敏感地选择议题至关重要，需要对那些不适合在公开论坛中处理的事项进行一定的审查和筛选。\n\n## 重大事件示例\n\n- 成功管理危机。\n- 诊所患者突然意外死亡。\n\
    - 未成年怀孕。\n- 针对员工的暴力。\n- 用药错误和药物反应。\n- 投诉。\n- 违反保密规定。\n- 建筑问题、安保或健康与安全问题。\n\n##\
    \ SEA的益处\n\n- 迅速带来改变。\n- 融入组织架构。\n- 系统性方法。\n- 鼓励以用户/患者为中心。\n- 既包括问题也包括成功。\n- 与发现PPDP和个人PDP的学习需求很好地契合。\n\
    \n## 开始实施\n\n团队中至少有一名成员应具备引导小组工作的技能和培训。\n\n- 初次会议：邀请并让所有利益相关者参与。\n- 确定主席/管理者。\n\
    - 每月开会——代替现有会议，而不是额外增加。\n- 事件发生时收集。确保团队所有人都知道他们可以提名事件。\n- 使用存放在关键位置的表格或记录本记录事件。\n\
    - 如果另一组织的来信中描述了一个事件，记录详细信息。\n\n## 会议前\n\n- 会议前一周收集事件。\n- 创建议程，需认识到：\n  - 议题优先级\n\
    \  - 人员可用性\n  - 团队成员参与\n  - 议题敏感性\n  - 添加“热点议题”的灵活性。\n- 会议前48小时分发议程。\n\n## 参考文献\n\
    \n- 1. Wilcock PM, Campion-Smith C and Head M (2002) 多塞特种子玉米项目：初级保健中的跨专业学习与持续质量改进。*Br\
    \ J Gen Pract.* 52: S39–44.\n- 2. 卫生部（1998）*全科医学继续职业发展回顾：首席医疗官报告。* 伦敦：DoH。\n-\
    \ 3. Wilcock PM and Campion-Smith C (2002) 在RIPE项目中运用持续质量改进的原则和方法。见：L Todres and\
    \ K Macdonald (eds) *做得更好：通过跨专业学习和实践发展改善健康与社会照护。* 伯恩茅斯：伯恩茅斯大学。\n- 4. Campion-Smith\
    \ C, Smith H, White P *et al.* (1998) 学习者对继续医学教育活动的体验：对多塞特郡全科医师负责人的定性研究。*Br J\
    \ Gen Pract.* 48: 1590–3.\n- 5. 卫生部（2000）*人尽其才的卫生服务：发展NHS劳动力：劳动力规划审查咨询文件。* 伦敦：DoH。\n\
    - 6. Wilcock P and Headrick L (2000) 通过跨专业学习改善卫生保健：为何费心？*J Interprofessional Care.*\
    \ 14: 2.\n- 7. Langley GJ, Nolan KM, Nolan TW *et al.* (1996) *改进指南。* 加利福尼亚州旧金山：Jossey\
    \ Bass 出版社。\n- 8. Batalden PB and Stoltz PK (1993) 持续改进医疗保健的框架：构建并应用专业知识和改进知识来检验日常工作变革。*Joint\
    \ Commission J Quality Improvement.* 十月：424–52。\n- 9. Nelson EC, Batalden PB and\
    \ Ryer J (eds) (1998) *临床改进行动指南。* 伊利诺伊州芝加哥：医疗机构认证联合委员会。\n- 10. Cox S, Wilcock\
