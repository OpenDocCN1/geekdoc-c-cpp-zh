  - '[PAGE 77]


    # # Personal development plans (PDPs)


    We have said that PDPs are closely connected with PPDP and topics for personal
    learning and development may be identified as the team undertakes the PPDP process.
    However we have also acknowledged that individual team members may have interests,
    career plans and aspirations that will influence their learning plans. We believe
    the process of personal development planning can follow a similar framework to
    that which we propose for PPDPs.


    As in PDPPs there needs to be a balance between responding to the external demands,
    reflection on personal practice and individual interests and aspirations. As with
    the PDPP, once an individual has identified the learning need, he or she will
    need to plan learning actions to meet that need with clear aims and measures to
    tell if each learning action has brought about the intended goal.


    The framework given here is relevant for a variety of people working in the practice
    and is, we believe, as appropriate for a senior partner as for a practice nurse
    or GP registrar. By following the framework and gathering evidence of both the
    process followed and the learning achieved, we believe you will start an excellent
    foundation of materials on which to base Post Registration Education and Practice
    (PREP), appraisal and preparation for revalidation.'
