    \ 序言\n\n各专业有许多共同特征，其中两点与诊所发展计划这一概念尤为相关。第一是与服务对象之间的特殊关系——对卫生专业人员而言，就是与患者的关系。第二是自我监管的概念，以及向公众保证医生、护士、物理治疗师等能够胜任执业的能力。这两个特征都体现在诊所发展计划的概念中。这些计划首先旨在提高患者照护质量和公众健康。其次，它们旨在确保所有专业人员与时俱进，了解实践中的新发展。\n\
    \n多年来，自我监管以许多不同方式实施。各个专业团体召开会议、病例讨论会、审计、临床审查以及许多其他活动，所有这些都旨在质疑并改进现有实践。随着团队化实践的不断发展，以团队作为学习和改善患者照护的焦点成为显而易见的一步。因此，基于诊所的规划流程得以发展，这是一种确保变革和改进的潜在非常有力的方式。\n\
    \n这样的流程并不新鲜，许多地方已经在实施。然而，本指南采用的更系统化方法使其能够更广泛地应用；对于尚未参与其中的人，它也提供了一种非常有用的启动方式。\n\
    \n本指南首先界定要解决的问题或要完成的任务。这类方法尤其有用，因为它们能识别与广大卫生专业人员相关、且人人都能贡献力量的现实问题。因此，学习既围绕问题本身，也来自彼此，因为不同的专业专长被用于应对某一特定问题。它以患者和社区的需求为结果导向，因而也以照护的整体改善为导向。如果每年选择若干主题并付诸行动，那么经过数年，整个诊所的患者照护将取得显著改善。事实上，仅是这样一种流程的存在，就会促进对其他领域实践的定期审查。\n\
    \n有人提出的一个主要限制是时间。我们怎样才能找到时间来做这件事？经验表明，这样的流程甚至可能节省时间，因为新的工作方法可能使诊所既更高效又更有效。还有人担心，这种基于诊所的规划可能会妨碍个人发展计划。经验再次表明，二者并不冲突，而且确实相互支持。\n\
    \n任何仍存的疑虑都应通过查看本指南提供的示例来消除。这些示例让整个流程栩栩如生，并展示了团队学习和经验分享如何提升所提供的照护质量。这必定是所有专业团体的目标之一；如果与此同时它还能强化专业角色并与个人发展相关联，那么就会带来全面的益处。本指南展示了如何做到这一点，以及如何实现这些益处。归根结底，目标是更有效地服务我们的患者和社区。\n\
    \n肯尼斯·卡尔曼教授  \n副校长兼校监  \n杜伦大学  \n英格兰前首席医疗官  \n*2003年3月*\n\n"
