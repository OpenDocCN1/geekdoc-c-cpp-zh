  mdcn: "\n- 关注患者/服务对象的需求，这一点贴近所有专业人员的心。\n- 为成年人创造学习机会。学习是人类与生俱来的能力，而且充满乐趣，即便在学校和大学期间遇到过任何不良的教育经历也是如此。\n\
    \n当这两种范式在实践中融合时，就为真实且可持续的改进创造了非常强大的条件。PPDP指南正是以这些范式为基础。\n\n# 拥有一个学习框架\n\n改进团队的经验表明，拥有简单的框架来指导他们的工作会使他们受益。最近最受关注的框架基于汤姆·诺兰及其同事的工作。⁷\
    \ *见图2的图示表示。*\n\n![](img/aaf273c74157227c19ea0efc2dd3eabf_62_0.png)\n\n图2：改进模型。⁷\n\
    \n诺兰框架由三个问题组成，提供了一种系统化的方法，将想法转化为行动，并提高其在实践中带来真正改进的可能性。处理这些问题会引出PDSA循环，该循环被用作实施变革并从中学习的指南。正如伯威克所指出的，所有改进都是变革，但并非所有变革都是改进。¹⁹\
    \ 诺兰的问题已被纳入PPDP框架，并影响了对其进行了测试的不同实践团队的工作。PDSA循环与行动学习的概念相一致，而行动学习是PPDP过程的基础，本指南第三部分对此进行了描述。\n\
    \n其理念是尽可能选择可以快速实施的小变革。这对员工极具激励作用，学习也会迅速开始，从而保持他们的兴趣。更大的改进则通过以系列学习为基础的快速改进（PDSA）循环的累积效应来实现（见图3）。⁷\n\
    \n![](img/aaf273c74157227c19ea0efc2dd3eabf_63_0.png)\n\n图3：系列学习和快速改进循环。⁷\n\n-\
    \ 团队重视结构与指导，以确保所花时间是投资。\n- 改进团队乐在其中。\n\n## 总结\n\n由于工作量非常繁重，维持改进团队很困难，但除非能够确保专门保障的时间，否则不会取得进展。因此，关键在于所花时间是投资而不是负担。这要求明确聚焦于对患者和诊所都重要的主题，并使用能够引导活动走向成功的框架。将PPDP框架和过程与上文所述的CQI原则和方法结合起来，在这方面似乎非常有益。非常需要诊所高层对专门保障时间给予支持和承诺。此外，还需要确保这项活动为PDP提供信息并对其形成补充。值得考虑如何对花在PPDP活动上的时间给予学术认可，从而使学习改进技能与学习专业和技术技能一样，成为专业教育的关键组成部分。<sup>8</sup>\n\
    \n有关持续质量改进各方面的更详细信息，请参见NHS现代化署的《改进领导者指南》，[www.modern.nhs.uk/improvementguides](http://www.modern.nhs.uk/improvementguides)。\n\
    \n# 一个诊所借助PPDP开展团队学习的故事*\n\n一家集镇诊所（五名合伙人、三个全职等效人员、5700名患者）能够采纳PPDP理念，从而为患者带来了显著益处。该理念是在一次多学科会议上启动的。这次会议的想法和信息被记录下来并分发给所有参与者。该诊所每月投入两小时的受保护会议时间，取代之前效率不高的会议。\n\
    \n该过程由诊所临床治理负责人领导，他是一名全科医生合伙人。为每位团队成员制作了简单的工作表，并在会议前七天分发。这些工作表注明了会议时间和地点，提供小组工作指导，并为每个人留有空间记录这段时间的笔记。这些笔记汇总到PDP和诊所PPDP作品集中，为个人学习和小组学习之间提供了重要联系。\n\
    \n会议通常包括第一个小时的小组工作，随后是午餐和向全体组员反馈工作。第二部分的会议内容由重大事件分析或来访演讲者的简短演讲组成。\n\n该诊所遵循了本指南前面描述的PPDP框架。下文概述了他们在不同阶段中的历程。\n\
    \n## 就目的达成一致 *（见框架图中的框1）*\n\n团队一致同意，其目的是提供高质量的初级保健服务，满足患者的需求，既包括患者不适时的照护，也包括使人们能够尽其所能保持健康。次要目标也得到了同意：保持组织财务稳健，并为所有员工提供良好的工作场所。\n\
    \n\\* 本材料的大部分内容最初发表于*《英国全科医学杂志》*，并经编辑许可使用。^20\n\n## 评估需求（见框2、3和4）\n\n在初次会议上，员工识别出了若干需求。其他必须处理的事项要么来自审计或重大事件（“内部”），要么来自政府政策、卫生当局或PCT的指令（“外部”）。团队也认可，团队中的个人会有个人学习需求，这些需求源于他们自己实践中的问题、对工作的反思或评估。\n\
    \n## 协商要采取的行动并分担工作（见框5、6和7）\n\n该诊所认可协商和选择很重要——很容易承担过多任务却完成甚少。他们寻找诊所目标与为满足外部议程而“必须完成”的事项之间存在一致性的领域。他们还确保工作与诊所作为国家初级保健协作组织成员的身份相一致。\n\
    \n## 规划行动（见框8和9）\n\n对于计划采取的每项行动，诊所团队遵循CQI模型并同意：\n\n- 高层级目标\n- 我们具体试图完成什么\n- 我们认为会带来改进的变革\n\
    - 用于判断变革是否带来改进的测量指标\n- 将变革作为试验实施的计划。\n\n随后，诊所团队或小组进入PDSA过程。⁹\n\n## 识别学习需求 *（见框10）*\n\
    \n对于计划的每项变革，他们都会审视需要哪些学习需求才能实现改进。这些包括：\n\n- 一两名团队成员获得特定技能或知识，例如，执业护士学习如何进行肺量测定以及解读结果\n\
    - 为更多团队成员提供更通用的知识，例如，所有临床团队成员都需要知道哪些患者适合转诊进行肺量测定、患者应有何预期以及可能的结果是什么\n- 整个团队必须熟练掌握的系统，例如，使用无纸化内部沟通和消息系统。\n\
    \n## 规划学习行动 *（见框11）*\n\n一旦识别出这些学习需求，就决定了满足需求的方式。这些方式包括参加外部课程、将资源引入诊所教育会议，或仅在团队内开展学习活动。\n\
    \n# 建立姑息治疗登记册和定期评审会议\n\n- **目标** 作为一个有效且支持性的跨专业临床团队开展工作。\n- **我们试图实现什么？** 改善诊所团队提供姑息治疗时的患者照护、跨专业沟通以及团队合作与支持。\n\
    - **我们能否规划一项我们认为会带来改进的变革？** 建立诊所姑息治疗登记册，并每两周对登记册上的患者进行一次跨专业评审。\n- **我们能否进行测量以判断变革是否带来了改进？**\
    \ 四个月后进行评审。会议是否举行？是否有因此改善照护的实例？员工是否重视这些会议？\n- **我们如何规划将变革作为试验实施？** 临床团队定期开会评审登记册上的患者。商定进入登记册的标准，商定用于记录入册的计算机编码。\n\
    - **需要哪些学习需求和行动？** 评审界定“姑息治疗”的不同标准。向整个团队传播对接受姑息治疗的患者及其家庭特殊需求的理解。评审用于评估照护的标准，作为定期评审的基础。培养跨专业团队的成员技能和领导技能。评审用于确保非工作时间照护连续性的程序。随着具体临床和沟通问题的出现，将其识别为未来学习的内容。\n\
    \n## 结果\n\n- 对患者的益处\n  - 评审他们的照护和需求\n  - 团队成员更了解他们的情况\n  - 基于标准对其照护进行评审应能减少未满足的需求\n\
    \  - 定期的主动评审应能降低患者“失联”的可能性。\n- 对团队的益处\n  - 团队成员感到在工作中得到更好的支持\n  - 有一个讨论棘手临床或人际问题的论坛\n\
    \  - 有机会针对临床问题进行特定学习。\n\n"
