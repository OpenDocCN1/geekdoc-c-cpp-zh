    # ## How should the guide be used?


    The guide is intended primarily to help team or group-based learning. However,
    it is highly likely that in busy practices there will be times when it is difficult,
    if not impossible, for all staff to work together simultaneously on developmental
    tasks. In this case the guide can provide a useful framework for absent staff
    to keep abreast of colleagues'' learning activities, and a means of support in
    catching up with recent developments.


    However the process we describe is a logical progression. It has been most successful
    when followed in a stepwise manner, with work to discover and understand the needs
    of the patients, the local community and the practice as the foundation for the
    later stages. Our experience has been that it is worthwhile resisting the urge
    to rush to answers and action. Spending time reflecting on what you know about
    the current situation before agreeing team aims is essential.


