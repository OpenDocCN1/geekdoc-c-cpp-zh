    # Practicalities of drafting and implementing the PPDP: difficulties, barriers
    and solutions


    Introducing a new task to an already beleaguered primary care team was not easy.
    The difficulty of finding a time when all the key people could meet, and the concern
    about the work building up while they were away from their usual work, was considerable.
    There was also a commonly held view that the PPDP meetings did not constitute
    ‘real work’ – only direct work with patients seems to fulfil this definition.
    There was a worry, arising from previous experiences, that the meeting would be
    a ‘talking shop’ and that nothing would be different for patients or staff as
    a result. There was some suspicion about the terminology or jargon used and concerns
    that the team was being expected to respond to someone else’s agenda.


    However the initial meetings were led in a way that ensured the staff felt a sense
    of ownership and control from the start. The initial issues chosen for action
    came from the internal agenda and some rapid improvement cycles with clear benefit
    for patients and staff helped overcome reservations. Once the staff had gained
    confidence in the process they felt happier to use it to respond to the external
    demands of the SHA and PCT priorities and NSFs.


    Time remains a problem but it was emphasised that most of what the group dealt
    with was work that had to be done anyway and that the PPDP meetings provided an
    appropriate and efficient forum for getting the ‘must do’ tasks dealt with. Time
    was created by abandoning another regular meeting that had become protracted and
    of limited use. Nevertheless initial funding allowing payment of a locum to ensure
    the presence of key people has been important in establishing and sustaining the
    process. The lunchtime setting on a day when the reception team already meet and
    the provision of sandwiches has also helped.


    However we believe the most important thing is that team members have felt involved
    in the selection of areas for improvement'
  - '[PAGE 76]


    and in the planning and implementation of practical changes that they believe
    have improved the services for patients of the practice.


    # Key factors for success


    +   - A process framework that made sense to all involved.

    +   - Wholehearted willingness of the whole team (including attached and reception
    staff) to be involved and give it a try.

    +   - A sense that this was helping do something they wanted to do anyway – meet
    their patients’ needs better.

    +   - Protected time initially to get the process going.

    +   - An awareness of the need to manage the group process effectively.

    +   - A practice member (the lead GP) who was willing to show great leadership
    and act as a champion for the initiative, both to start it off and maintain the
    momentum.

    +   - Periodic review to make all aware of what has been achieved.


    Enthusiasm for the process remains. The practice has decided not to run on a rigid
    annual cycle as different improvements and external imperatives to which it has
    to respond have differing timescales. Rather they view the PPDP process as a continually
    running mill of improvement that can be used to help the practice respond to a
    number of demands for change, be they externally imposed or arising from within.


    The practice has linked the educational activities of individuals, small working
    groups and the whole team to meeting the needs of patients using a CQI approach.


    They have found that their experience of shared learning to improve patient services
    is an effective use of time in a hard pressed practice team. Recognising the skills
    and potential of team members is consistent with current NHS policy. It also brings
    improvements in teamworking and relationships within the practice.'
