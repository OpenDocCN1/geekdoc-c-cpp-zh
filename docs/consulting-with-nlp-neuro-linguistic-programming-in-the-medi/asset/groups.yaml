  mdcn: "\n阶段，包括他们为促成改进所采取的行动。事实一再表明，这通常是一次重要的学习经历，而且往往能改变团队关系。\n\n尽管这是该方法最重要的方面，但各执业机构仍须编制一份或数份文件，列明其专业发展建议。一些初级保健信托（PCTs）会规定其格式。另一些则愿意接收按照第三部分各阶段开展后形成的证据档案。多数PCTs很可能不希望收到冗长文件，而会选择接收各执业机构提交的建议摘要。\n\
    \n### 个人发展计划（PDPs）与PPDP\n\n最常被问到的问题之一是，在这一方法中PDP与PPDP如何衔接。简单的答案是：它们是其中不可分割的组成部分。\n\
    \n![](img/aaf273c74157227c19ea0efc2dd3eabf_26_0.png)\n\n目标是，个人的专业发展应日益直接关联到他们及其他多专业团队成员所认定的、为实现他们已确认最为重要的患者护理改进所需的内容。这正是本指南第三部分所述流程旨在实现的目标。\n\
    \n然而，在这里保持现实感很重要。我们认识到，执业机构在任何一年中都只能处理极少数需要改进的领域。个人的学习需求既会来自PPDP，也会来自其个人执业兴趣和职业抱负。同样，作为PPDP一部分开展的学习也很可能记录在个人档案中，以备考评和再认证之用。第四部分包含了一个与支撑本指南的思路相一致的个人发展计划框架。\n\
    \n## 小结\n\n本指南第一部分涵盖了与PPDP流程相关的若干重要问题，包括执业机构内部的发展与学习。它介绍了关键领域和概念，包括：\n\n- 本指南的目的和功能\n\
    - PPDP背后的最初思路\n- PPDP的实用定义\n- PPDP与PDP之间的关系。\n\n本指南第二部分介绍了编制PPDP的框架，并概述了PPDP流程的各个阶段和档案。\n\
    \n## 第二部分：PPDP框架与档案简介\n\n### 引言\n\n本部分包含五个要素：\n\n- 1. 对作者开发的PPDP框架进行说明，该框架是与执业机构员工群体和团队合作的基础\n\
    - 2. 简要概述在执业机构内举行跨专业会议时需要考虑的要点\n- 3. 介绍PPDP档案，这是一种建议用于建立工作记录的方式\n- 4. 介绍PPDP流程的各个阶段\n\
    - 5. 回顾年度内的进展。\n\n### PPDP框架\n\n乍看之下，该框架可能显得相当复杂，但实际上它只是把大多数执业机构中可能已经在开展的若干活动和流程联系起来。关于如何逐步完成框架各阶段的建议包含在第三部分中。该框架有三个主要要素，将在紧接其下的各节中说明。\n\
    \n- **1. 目的**：改善我们满足个人和当地社区健康需求的方式\n- **2. 社区需求**：我们对当地人群的健康需求了解什么？我们需要了解什么，以及为什么需要了解？国家/SHA/PCT的优先事项是什么？\n\
    - **3. 执业机构需求**：我们对以下方面了解什么：\n  - 我们满足患者需求的程度如何？\n  - 我们在执业机构中如何协作？\n  - 我们如何应对外部压力？\n\
    \n  我们还需要了解什么，如何查明？\n- **4. 个人发展需求**：与自身专业发展相关。\n- **5. 使用商定的标准确定优先群体**\n- **6.\
    \ 使用商定的标准确定执业机构的优先事项**\n- **7. 就执业机构需要改进的优先领域入围清单达成一致。**\n- **8. 对每个优先事项询问：**\n\
    \  - 我们试图实现什么？\n  - 我们如何知道某项变革就是改进？\n- **9. 我们可以做出哪些能带来改进的变革？**\n- **10. 执业机构和个人的学习与发展需求是什么？**\n\
    - **11. 对每项学习与发展需求，我们可以采取哪些具体的教育行动？如何衡量每项行动的效果？**\n- **12. 定期开展年度内的进展回顾。**\n\n\
    ![](img/aaf273c74157227c19ea0efc2dd3eabf_29_0.png)\n\n#### 确定执业团队的关键发展优先事项\n\n\
    这需要以对当地社区的了解、对外部确定和/或推动的议程与要求的认识（如PCT、健康改善计划（HImPs）、国家服务框架（NSFs）等），以及对执业机构当前工作安排的内情了解和内部/自我评估为依据（见框架图中的方框1—3）。\n\
    \n#### 将优先领域转化为计划中的改进项目\n\n持续质量改进（CQI）的原则和方法已被用于构建一种项目规划方法，该方法：\n\n- 为将要开展的工作提供明确焦点\n\
    - 明确谁需要做什么以及何时做\n- 使执业团队能够在推进过程中灵活学习（见方框4—9）。\n\n#### 确定执业团队和员工个人的学习需求\n\n执业机构的改进优先事项将为重要的团队学习需求提供线索，此外几乎肯定会出现新的个人与专业发展需求。该方法的一个核心目标是将PDP牢固地置于执业机构改进优先事项的背景中。团队成员将理解自己的PDP如何与执业机构改善其所提供服务的总体计划相衔接。然而，某些员工的PDP中可能有些部分不属于PPDP。例如，PDP的这些方面可能涉及职业发展计划，或源于员工考评流程，因此应对个人保密（见方框4和10—11）。\n\
    \n### 在执业机构内举行跨专业会议\n\n要使跨专业会议有用且富有成效，重要的是关注过程——人们将如何一起工作和学习。组织全体团队会议需要规划。让人们对会议目标有清晰认识非常重要。告知他们开始和结束时间，并明确说明提供哪些食物和茶点，可以让人们做好安排。\n\
    \n![](img/aaf273c74157227c19ea0efc2dd3eabf_31_0.png)\n\n如果请人们事先考虑一两个问题，会议往往会更富有成果。重要的是强调所有团队成员都必须作出的贡献，并承认至少对部分参与者而言，他们以往的团队合作经历可能并不愉快。由执业机构外部的引导者来主持非常有帮助，尤其是在初次会议时。不过，执业机构内也需要有一人在会议组织的具体事务中发挥主导作用。\n\
    \n引导者的部分职责是帮助团队就会议过程商定一些基本规则。参与者的期望与焦虑，连同他们以往团队工作的经历（无论好坏），都可以作为这项练习的起点（*参见第四部分*）。在第84—90页，我们给出了一些关于引导这些会议更具体的想法。\n\
    \n### PPDP档案\n\n所谓“档案”，我们只是指汇集执业团队在学习过程中产生的证据。这是一种建议采用的方式，用于记录你在逐步完成框架各步骤时收集的信息，以及执业团队就其改进和学习优先事项所作的决定。此外，它还包括证据，清楚展示执业团队从起草PPDP以及从采取实现变革和改进所需行动中学到了什么。它不只是记录团队所采取的行动、活动或经历，而是说明每位团队成员对有机会为执业机构的发展方向作出贡献有多重视。在一些执业机构中，团队成员尤其重视编制PPDP的这一方面，并感到彼此的工作关系得到了切实改善。这些证据当然值得纳入最终的PPDP文件，也值得纳入员工自己的个人档案。\n\
    \n我们发现，档案的一种有用格式是活页环夹。在其中可以使用分隔页，为PPDP流程的每个关键阶段建立分区，如下所示。\n\n### PPDP流程的各个阶段\n\
