  md: '# Fundamental Functionality


    +   - regex_match: Does the RE match the complete string?

    - regex_search: Does the RE occur in the string?

    - regex_replace: Replace text matching RE with other text.

    - Replacement isn''t in-place: new text is returned.


    Matches are held in match_results objects. Iteration is supported:


    +   - regex_iterator: Iterate over matches for a string.

    - regex_token_iterator: Iterate over matches and match subfields.


    These are normally used instantiations:


    +   - For strings: smatch/sregex_iterator/sregex_token_iterator

    - For wstrings: wmatch/wsregex_iterator/wsregex_token_iterator

    - For char*: cmatch/creg_iterator/creg_token_iterator

    - For wchar_t*: wcmatch/wregex_iterator/wregex_token_iterator


    regex_replace can be configured with flags to (1) replace only the first match
    andor (2) not write over unmatched text, but by default, 얘가 as summarized in these
    slides.

    I''m not familiar with use cases for these options.


    Regex iterators iterate only over nonoverlapping matches. Iteration over overlapping
    matches must be done manually and must take into account the issues described
    in Becker''s book (mentioned on a subsequent slide).


