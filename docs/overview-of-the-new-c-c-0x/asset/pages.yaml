  md: "# std::forward\n\nConsider again:\n\n```\ntemplate<typename T>\nvoid setName(T&\
    \ newName)\n{ name = std::forward<T>(newName); }\n```\n\n+   - A reference (i.E.,\
    \ T is T&) ⇒ lvalue was passed to newName\n  - std::forward<T>(newName) should\
    \ return lvalue.\n- A non-reference (i.E., T is T) ⇒ rvalue was passed to newName\n\
    \  - std::forward<T>(newName) should return rvalue.\n\nReference-collapsing rules\
    \ make implementation easy:\n\n```\ntemplate<typename T>               // For\
    \ lvalues\nT& std::forward(T& param)      // take/return lvalue refs.\n{     \
    \                              // For rvalues (T is T),\n  return static_cast<T&&>(param);\
    \ // take/return rvalue refs.\n```\n\nReal implementations get more sophisticated;\
    \ see Further Information.\n\nProduction implementations of std::forward prevent\
    \ misuse by disabling implicit\nargument deduction, forcing specification of T\
    \ at the call site. That forces clients to\nwrite\n\n```\nstd::forward<T>(param)\n\
    ```\n\ninstead of\n\n```\nstd::forward(param)\n```\n\nThe latter expression would\
    \ always return an lvalue, because param has a name.\n\nThe usual std::forward\
    \ implementation is:\n\n```\ntemplate<typename T>\nstruct identity {\n  typedef\
    \ T type;\n};\ntemplate<typename T>\nT&& forward(typename T::type&&& param)\n\
    { return static_cast<identity<T>::type&&>(param); }\n```"
  merge: -1
