  md: "# # Sketch of std::tuple\n\n```\ntemplate <class... Types> // declare primary\
    \ template\nclass tuple:\ntemplate<> class tuple<>; // for empty tuples\ntemplate<typename\
    \ T, typename... TRest> // class with data member\nclass tuple<T, TRest...> {\
    \ // for 1st T in pack // inherits from class // rest of pack\nprivate:\n    tuple<TRest...\
    \ > > { // data member of type T\n    T data;\npublic:\n    tuple() : data() {};\
    \ // default ctor; all types must be default-constructible // non-default ctors.\n\
    ...\n};\n```\n\nDoing “data()” on the member initialization line ensure that built-in\
    \ types are initialized to zero (and pointers to null).\n\nThe implementation\
    \ published by Douglas Gregor and Jaakko Järvi (see Further Information section)\
    \ declares data protected, but no justification is given, and real implementations\
    \ (e.g., in VC 10, gcc 4.5) declare private. Hence my use of private."
