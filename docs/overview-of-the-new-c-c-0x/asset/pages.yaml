  md: "# Default Member Initialization\n\nDefault initializers for non-static data\
    \ members may now be given:\n\n```\nclass Widget {\nprivate:\n    int x = 5;\n\
    \    std::string id = defaultID();\n}\nWidget w1; // w1.x initialized to 5,\n\
    \           // w1.id initialized per defaultID.\n```\n\nUniform initialization\
    \ syntax is also allowed:\n\n```\nclass Widget {\\ // semantically identical to\
    \ above\nprivate:\n    int x { 5 }; // \"=\" is not required,\n    std::string\
    \ id = {defaultID()}; // but is allowed\n}\nWidget w2; // same as above\n```\n\
    \nDirect initialization syntax (using parentheses) is not permitted for default\
    \ member initialization.\nDefault member initialization values may depend on one\
    \ another:\n\n```\nclass Widget {\nprivate:\n    int x { 15 };\n    int y { 2\
    \ * x };\n}\n```\n\nN2756, everything valid as an initializer in a member initialization\
    \ list should be valid as a default initializer. In particular, non-static member\
    \ function calls are valid, e.g., in the initialization of Widget::id, defaultID\
    \ may be a static or a non-static member function. If a non-static member function\
    \ is used, there could be issues of referring to data members that have not been\
    \ initialized.\n\nIn-class initialization of static data members continues to\
    \ be valid only for const objects with static initializers (i.e., in-class dynamic\
    \ initialization is not valid). However, “literal” – not just integral types –\
    \ may be so initialized in C++0x. (Literal types are defined in [basic.types]\
    \ (3.9/10 in N3290)."
