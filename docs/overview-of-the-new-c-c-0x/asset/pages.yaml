  md: "# Implementing Move Semantics\n\nMove operations take source's value, but leave\
    \ source in valid state:\n\n```\nclass Widget {\npublic:\n    Widget(Widget& rhs)\
    \ // take source's value\n        : pds(rhs.pds) { rhs.pds = nullptr; } // leave\
    \ source in valid state\n    Widget& operator=(Widget& rhs) {\n        delete\
    \ pds; // get rid of current value\n        pds = rhs.pds; // take source's value\n\
    \        rhs.pds = nullptr; // leave source in valid state\n        return *this;\n\
    \    }\nprivate:\n    struct DataStructure;\n    DataStructure *pds;\n};\n```\n\
    \n![](img/68a90f505054116271758fb914871a74_249_0.png)\n\n![](img/68a90f505054116271758fb914871a74_249_1.png)\n\
    \nEasy to build in types (e.g., pointers). Trickier for UDTs...\n\nA move operation\
    \ needs to do three things: get rid of the destination's value, move the source's\
    \ value to the destination, and leave the source in a valid state. For UDTs, memberwise\
    \ move is the way to achieve all. For types managing primitives (e.g., pointers,\
    \ \"clever\", semaphores), their move operations have to do these manually.\n\n\
    A generic, \"clever\" (i.e., suspicious) way to implement move assignment for\
    \ a type T is T& operator=(T& rhs) { T(rhs).swap(*this); return *this; }\n\nThis\
    \ has the effect of swapping the contents of *this and rhs. The idea is that rhs\
    \ is an rvalue reference, it's bound to an rvalue, and that value will be destroyed\
    \ at the end of the statement containing it. When it is, the data associated with\
    \ *this be destroyed (e.g., resources are released). The problem is that rhs may\
    \ actually correspond to an lvalue that is explicitly std::move, and in that case,\
    \ the lvalue may not be destroyed until later than expected. This can be problematic.\
    \ Details can be found at http://thbecker-net.com/article/rvalue_references/section_04.html\
    \ and http://cpp-next.com/archive/2009/09/your-next-assignment.\n\n\"UDT\" = \"\
