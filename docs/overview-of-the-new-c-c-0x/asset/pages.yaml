  md: "# From TR1: Generalized Functors\n\nMotivation:\n\n+   - Function pointers\
    \ and member function pointers are rigid:\n  - Exact parameter/return types and\
    \ ex. specs, must be specified.\n  - Can't point to nonstatic member functions.\n\
    \  - Can't point to function objects.\n- Useful to be able to refer to any callable\
    \ entity compatible with a given calling interface.\n  - Convenient for developers\
    \ (especially for callbacks).\n  - Can help limit code bloat from template instantiations.\n\
    \nRegarding code bloat, instead of instantiating a template for many types with\
    \ the same calling interface, the template can be instantiated only once for the\
    \ function type that specifies that interface. (Under the hood, the implementation\
    \ machinery for `std::function` will be instantiated once for each actual type,\
    \ but the template taking a `std::function parameter will be instantiated only\
    \ once for all types compatible with the std::function type)."
