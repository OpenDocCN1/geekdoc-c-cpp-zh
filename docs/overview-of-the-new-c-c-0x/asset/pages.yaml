  md: "# Perfect Forwarding Redux\n\nA correct version of mult:\n\n```\ntemplate<typename\
    \ T1, typename T2>\nauto mult(T1&& a, T2&& b) ->\n    decltype(std::forward<T1>(a)\
    \ * std::forward<T2>(b))\n{\n    return std::forward<T1>(a) * std::forward<T2>(b);\n\
    }\n```\n\n![](img/68a90f505054116271758fb914871a74_329_0.png)"
