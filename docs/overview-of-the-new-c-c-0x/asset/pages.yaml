    \ types prefixed with u/U, are UCS-encoded:\n\n+   - `u'x'` // as `char16_t` using\
    \ UCS-2\n- `U'x'` // as `char32_t` using UCS-4/UTF-32\n\nC++98 character types\
    \ still exist, of course:\n\n+   - `'x'` // as a char\n- `'L'x'` // as a wchar_t\n\
    \nFrom C++00 ([basic.fundamental], 3.9/5 in N3290): \"Types char16_t and char32_t\
    \ denote types with the same size, signedness, and alignment as uint_least16_t\
    \ and uint_least32_t respectively, in <stdint.h>, called the underlying types.\"\
    \n\nUCS-2 is a 16-bit encoding that matches the entries in the Basic Multilingual\
    \ Plane (BMP) of UTF-16. UTF-16 can use surrogate pairs to represent code points\
    \ outside the BMP; UCS-2 cannot. UCS-4 and UTF-32 are essentially identical.\n\
    \nchar16_t character literals can only use UCS-2, because it's not possible to\
    \ fit a UTF-16 surrogate pair (i.e., two 16-bit values) in a single char16_t object.\
    \ Notes [lex.cpp](2.14.3/2 in N3290), \"A character literal that begins with the\
    \ letter u, such as u'Y', is a character literal of type char16_t ... If the value\
    \ is not representable within 16 bits, the program is ill-formed."
