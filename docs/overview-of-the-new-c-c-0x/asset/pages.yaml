  md: "# Data Lifetime Considerations\n\nConclusions:\n\n+   - Data lifetime issues\
    \ is critical in multi-threading (MT) design.\n  - A special aspect of synchronization/race\
    \ issues.\n    - Even shared immutable data subject to lifetime issues.\n- By-reference/by-by-pointer\
    \ parameters in asynch calls always risky.\n  - Prefer pass-by-value.\n    - Including\
    \ via lambdas!\n\n```\nvoid f(int xParam); // function to call asynchronously\n\
    \n{\n  int x;\n  std::thread t1[&{f(x)}]; // risky! closure holds a ref to x\n\
    \  std::thread t2[=f(x)}]; // okay, closure holds a copy of x\n} // x destroyed\n\
    ```\n\nIn case of t1, the lambda's closure object is created before the calling\
    \ thread can continue, but the calling thread may continue before f starts executing.\
    \ By the time f xParam is initialized, the closure may hold a dangling reference\
    \ to x, because x has already been destroyed."
