  md: "# delete Functions\n\ndeleted functions are declared, but can't be used.\n\n\
    +   Most common application: prevent object copying:\nclass Widget {\n    Widget(const\
    \ Widget&) = delete; // declare and\n    Widget&operator=(const Widget&) = delete;\
    \ // make uncallable\n...};\nNote that Widget isn't movable, either.\n* Declaring\
    \ copy operations suppresses implicit move operations!\n* It works both ways:\n\
    class Gadget {\n    Gadget(Gadget&) = delete; // these also\n    Gadget&operator=(const\
    \ Gadget&) = delete; // suppress copy\n...\n}\n\n\"delete\" functions can't be\
    \ used in any way: they can't be called, can't have their address taken, can't\
    \ be used in a sizeof expression, etc.\n\nTemplate functions may be deleted. For\
    \ example, this is how construction from rvalues is prevented by std::reference_wrappers\
    \ (e.g., as returned from std::ref).\n\nA virtual function may be deleted, but\
    \ if it is, all base and derived versions of that virtual must also be deleted.\
    \ That is, either all declarations of a virtual in a hierarchy are deleted or\
    \ none are."
