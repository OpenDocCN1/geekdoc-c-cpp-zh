  md: "# Unpacking Patterns\n\nUnpacking uses the pattern of the expression being\
    \ unpacked:\n\n```\ntemplate<class T, class... Args>\nshared_ptr<T> // add \"\
    &&\" to each\n    make_shared(Args&&... params);    // unpacked elem.\ntemplate<typename\
    \ T, typename... TRest> // add \"const\" and\n    void print(const T& obj, const\
    \ TRest&... rest) // add \"&&\" to each\n{\n    std::cout << obj << \" \"\",\n\
    \    print(rest...);\n}\n// add nothing to\neach elem's name\n```\n\nCall to print\
    \ expands to:\nprint(rest1, rest2, ..., restn);\n\nThe ellipsis is always at the\
    \ end of the pattern."
  merge: -1
