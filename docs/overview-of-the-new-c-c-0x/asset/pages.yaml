  md: '# # Copying vs. Moving


    Temporary objects are prime candidates for moving:

    typeded std::vector<T> TVec;

    TVec createTVec();

    TVec vt;

    ...

    vt = createTVec();


    // factory function

    // in C++98, copy return value to

    // vt, then destroy return value


    ![](img/68a90f505054116271758fb914871a74_8_0.png)


    The diagrams on this slide make up a PowerPoint animation.


    In this discussion, I use a container of T, rather than specifying a particular
    type, e.g.,ncontainer of string or container of int. The motivation for move semantics
    is largely independent of the types involved, although the larger and more expensive
    the types to copy, the stronger the case for moving over copying.'
