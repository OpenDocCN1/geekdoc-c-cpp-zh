  md: '# Variadic Class Templates


    Foundational for TMP (template metaprogramming). Examples:


    +   - Type computations:

    - <type_traits> has template <class... T> struct common_type;


    +   - Object structure generation:

    - std::tuple<T1, T2, ..., Tn> needs n fields, each of correct type.

    - std::tuple<T1, T2, ..., Tn> inherits from std::tuple<T2, T3, ..., Tn>


    Given a list of types, std::common_type returns the type in the list to which
    all types in the list can be converted. If there is no such type, or if there
    is more than one such type, the code won''t compile. For built-in types, the usual
    promotion and conversion rules apply in their usual order, e.g., std::common_type<int,
    double>::type is double, because int->double is preferable to double->int, although
    both are possible.'
