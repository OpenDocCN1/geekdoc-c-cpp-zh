    | TR1 Functionality | C++0x Functionality Changes |

    |---|--|

    | Reference Wrapper | None. |

    | Smart Pointers | Support for allocators and unique_ptr. Minor new functionality
    (details shortly). |

    | Return Type Determination | Inherent C++98 restrictions lifted. |

    | Enhanced Member Pointer Adapter | None. |

    | Enhanced Binder | Inherent C++98 restrictions lifted. |

    | Generalized Functors | Support for allocators. Added assign. |

    | Type Traits | Inherent C++98 restrictions lifted. Some additions/renamings.
    |

    | Random Numbers | Revised engines/distributions. Removal of variate_generator.
    |

    | Mathematical Special Functions | Not in C++0x. (To be a separate standard.)
    |

    | Tuples | Added tuple_cat. |

    | Fixed Size Array | Renamed assign -> fill. |

    | Hash Tables | Support for operators == and !=. |

    | Regular Expressions | String literals often (not just std::strings). |

    | C99 Compatibility | fabs(complex<T>) -> abs(complex<T>).


    Of the 23 proposed mathematical functions in TR1, 21 are preserved in the separate
    draft standard, "Extensions to the C++ Library to Support Mathematical Special
    Functions." The two missing functions are confluent hypergeometric functions and
    hypergeometric functions.


    "Inherent C++98 restrictions lifted" means that restrictions inherent in library
    functionality based on C++98 were removed from the C++0x specification. From Stephen
    T. Lavave: "In C++0x, result_of is powered by decylpe and thus always gets the
    right answer without TR1''s cumbersome and incomplete library machinery. Similarly,
    bind is powered by rvalue references, lifting its restriction on rvalues. Type
    traits are guaranteed to use compiler hooks and always gets the right answers."
    Practically speaking, that many TR1 edge cases are no longer edge cases.'
