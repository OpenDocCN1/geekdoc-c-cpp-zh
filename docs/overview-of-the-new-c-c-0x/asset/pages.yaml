    \ call.\n\n```\nauto f = std::async(std::launch::deferred,\n  [](){ returnValue(10,\
    \ 20); }});\n```\n\n```\nauto val = f.get(); // run asynchronously here\n```\n\
    \nBy default, implementation chooses, presumably with goals:\n\n+   * Take advantage\
    \ of all hardware concurrency, i.e., scale.\n* Avoid oversubscription.\n\nThreads\
    \ used by std::async may (but not need) be drawn from a thread pool the as-if\
    \ rule, but implementations would have to, e.g., destroy and reinitialize thread-local\
    \ variables before using a reusing thread.\n\nUntil November 2010, std::launch::deferred\
    \ was named std::launch::sync.\n\nWhen multiple async policies are launched (e.g.,\
    \ by specifying std::launch::async | std::launch::deferred), the decision between\
