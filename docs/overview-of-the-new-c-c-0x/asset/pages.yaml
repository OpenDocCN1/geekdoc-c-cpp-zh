    | New Functionality | Summary |

    | --- | --- |

    | Reference Wrapper | Objects that act like references |

    | Smart Pointers | Reference-counting smart pointers |

    | Return Type Determination | Useful for template programming |

    | Enhanced Member Pointer Adapter | 2nd-generation mem_fun/mem_fun_ref |

    | Enhanced Binder | 2nd-generation bind1st/bind2nd |

    | Generalized Functors | Generalization of function pointers |

    | Type Traits | Compile-time type reflection |

    | Random Numbers | Supports customizable distributions |

    | Mathematical Special Functions | Laguerre polynomials, beta function, etc. |

    | Tuples | Generalization of pair |

    | Fixed Size Array | Like vector, but no dynamic allocation |

    | Hash Tables | Hash table-based/multiset/map/multimap |

    | Regular Expressions | Generalized regex searches/replacements |

    | C99 Compatibility | 64-bit ints, <cintdef>, new format specs, etc. |


    Libraries in blue are also in C++0x. Libraries in bold are covered in this course
    (to least some degree).


    Regarding random numbers, C supports only *rand*, which is expected to produce
    a uniform distribution. C++0x supports both *engines* and *distributions*. An
    engine produces a uniform distribution, while a distribution takes the result
    of an engine and produces an arbitrary distribution from it. C++0x specifies default
    versions for the engine and distributions, but it also allows for customized versions
    of both.'
