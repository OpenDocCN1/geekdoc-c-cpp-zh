  md: '# Lvalues and Rvalues


    Lvalues are generally things you can take the address of:


    +   - Named objects.

    - Lvalue references.

    - More on this term in a moment.


    Rvalues are generally things you can''t take the address of.


    +   - Typically unnamed temporary objects.


    Examples:


    ```

    int x, *plint; // x, plint, *plint are lvalues

    std::size_t f(std::string str); // str is lvalue, f''s return is rvalue

    f("Hello"); // temp string created for call

    // is rvalue

    std::vector<int> vi; // vi is lvalue

    vi[5] = 0; // vi[5] is lvalue

    ```


    > Recall that return vector<T>::operator[] returns T&.


    This pointer is a named object, but it''s defined by a rvalue expression.


    Per [expr.prim.general] (5.1.1/1 in N3290) literals (other than string literals)
    are rvalues, but those types don''t define move operations, which are not relevant
    for purposes of this discussion. User-defined literals yield calls to literal
    operator functions, and the temporaries returned from such functions are rvalues,
    user-defined literals are rvalues, but not rvalues differ from any other temporary
    returned from a function, they don''t require any special consideration.


    Because f takes std::string by value, a copy or move constructor should be called
    to initialize it. The call f(\Hello") is supposed to generate a temporary, which
    is used to initialize the parameter str. In practice, the copy or move operation
    will almost certainly be optimized away, and str will be initialized via std::string''s
    constructor taking a const char*, but that does not change the analysis: f("Hello")
    generates a temporary std::string object, at least conceptually.'
