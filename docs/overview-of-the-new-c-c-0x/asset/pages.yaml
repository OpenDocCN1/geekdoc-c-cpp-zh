  md: '# More C++0x Features


    +   - Enum enhancements:

    - Forward declaration

    - Specification of underlying type

    - Enumerant scoped to the enum

    - No implicit conversion to int

    - Unrestricted unions (members may be any non-reference type).

    - Time library supportings clocks, durations, points in time.

    - Local types allowed as template arguments.

    - C99 compatibility, e.g., long long, __func__, etc.

    - Inline namespaces facilitate library versioning.

    - Scoped allocators allow containers and their elements to use different allocators,
    e.g., vector<string>.


    The primary motivation for the time library was to be able to specify timeouts
    for the concurrency API (e.g., sleep durations, timeouts for lock acquisition,
    etc.).'
