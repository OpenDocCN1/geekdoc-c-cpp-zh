  md: "# Parameter Packs\n\nTwo kinds:\n\n+   - Template: hold variadic template parameters.\n\
    \n+   - Function: hold corresponding function parameters.\n```cpp\ntemplate <class...\
    \ Types> // template param. pack\nclass tuple { ... };\n\ntemplate<class T, class...\
    \ Args> // template param. pack\nshared_ptr<T>(Args&&... params); // function\
    \ param. pack\n\nstd::tuple<int, std::string> t1; // Types = int, int, std::string\n\
    auto p1 = std::make_shared<Widget>(10); // Args/params = int/&\n x;\nconst std::string\
    \ s(\"Variadic Fun\");\n...\nauto p2 = std::make_shared<Widget>(x, s); // Args/params\
    \ = string/\n int&, const std::string&\n// int&, const std::string&\n```\n\nScott\
    \ Meyers, Software Development Consultant\nh://www.arista.com/\n© 2011 Scott Meyers,\
    \ all rights reserved.\nSlide 314\n\nA function parameter pack declaration is\
    \ a function parameter containing a template parameter pack expansion. It must\
    \ be the last parameter in the function parameter list.\n\nClass templates may\
    \ have at most one parameter pack, which must be at the end of the template parameter\
    \ list, but function templates, to template argument type deduction, may have\
    \ multiple parameter packs, e.g. (from draft C++0x),\n\n```\ntemplate<class...\
    \ class..., UTypes>\nbool operator==(const tuple<TTypes...>&& t, const tuple<UTypes...>&&\
    \ u);\n```\n\nScott Meyers, Software Development Consultant\nh://www.arista.com/\n\
    © 2011 Scott Meyers, all rights reserved.\nDownload from Wow! eBook <www.wowebook.com>"
  merge: -1
