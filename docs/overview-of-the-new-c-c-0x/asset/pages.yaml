    std::tuple<int, char, std::string> t;


    ![](img/68a90f505054116271758fb914871a74_323_0.png)


    The fact that data is private raises the question of how std::get is implemented.
    Among tuple member functions not listed in this example is public one returning
    a reference to data. Among Gregor and Järvi’s implementation, this function is
    called head. std::get<n> on a tuple<T, TRest...> recursively walks up TRest, decreasing
    n at leach level until it’s 0. It then returns the result of head for that class.'
