    - Goal: zero time/space overhead compared to hand-written C.\n- STL container\
    \ conventions sacrificed to achieve goal:\n  - insert_after/emplace_after/erase_after\
    \ instead of insert/erase.\n  - Normal “insert/emplace/erase before” behavior\
    \ costly.\n\n![](img/68a90f505054116271758fb914871a74_159_0.png)\n\n+   - before_begin\
    \ returns iterator preceding *begin.\n  - Needed to insert/emplace/erase at front\
    \ of list.\n- Store size or end (footprint) or run in O(n) time (surprising!)\n\
    - Offers only forward iterators.\n\nHaving iterators point to the node prior to\
    \ the one reference allow for an interface that was more like the rest of the\
    \ STL, but at the cost of additional indirection dereference, something contrary\
    \ to the goal of as-good-as-hand-written-C performance.\n\nIterator invalidation\
    \ rules for forward_list are essentially the same as for list: insertions invalidate\
    \ nothing, erasures invalidate only iterators to erased elements."
