- img_proc: true
  md: "# decltype\n\nPrimary use: template return types that depend on parameter types.\n\
    \n+   - Common for forwarding templates:\n  template<typename F, typename... Ts>\
    \ // logAndInvoke\n  auto logAndInvoke(std::ostream& os, // returns what\n  F&\
    \ func, Ts&... args) -> // func(args...) does.\n  decltype(func(args...)) // not\
    \ quite right\n  os << std::chrono::system_clock::now(); // from new time lib\n\
    \  return func(args...); // not quite right\n\n+   - Also in math-related libraries:\n\
    \  template<typename T1, typename T2> // mult's return type\n  auto mult(T1& a,\
    \ T2&& b) -> // is same as a*b's.\n  decltype(a * b) // not quite right\n  return\
    \ a * b;\n\n\nFor the code on this page to be correct, we need to add uses of\
    \ std::forward in various places. Hence the comments that say \"not quite right\"\
    . The code is shown shortly.\n\n\nThere is no operator<< for std::chrono::time_point\
    \ objects (the return type from std::chrono::system_clock::now) in the standard\
    \ library, so the statement involving std::chrono::system_clock::now will not\
    \ compile unless such an operator<< has been explicitly declared."
  merge: -1
