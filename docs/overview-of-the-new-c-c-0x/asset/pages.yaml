    \ like SSNs:\n\n```\nvoid possibleSSNs1(const std::string& text, std::list<std::string>&\
    \ results) {\n  auto b(text.cbegin()), e(text.end());\n  std::smatch match;\n\
    \  while (std::regex_search(b, e, match, SSNRegex)) {\n    results.push_back(match[0].str());\n\
