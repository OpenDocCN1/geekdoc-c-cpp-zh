  md: '# Cost of shared_ptr


    Sample implementation (Boost 1.41):


    +   2 words in size (pointer to object, pointer to RC).


    ![](img/68a90f505054116271758fb914871a74_148_0.png)


    +   Uses dynamically allocated memory for the RC.


    +   Resource release (i.e., deletion) via a virtual function call -> vbtls.


    +   Incur cost for weak_ptr count even if no weak_ptrs are used.


    "RC" = "Reference Count".


    The Boost implementaton allocates space for a custom deleter or a custom allocator
    if the smart pointer is constructed with them. If the default deleter/allocator
    is used, no memory is used to store pointers to them.


    The weak count keeps track of how many weak pointers exist for the object. When
