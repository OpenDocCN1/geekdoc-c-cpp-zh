- img_proc: true
  md: '# Reference Binding Rules


    Important for overloading resolution.


    As follows:


    +   - Lvalues may bind to lvalue references.

    - Rvalues may bind to lvalue references to const.


    In addition:


    +   - Rvalues may bind to rvalue references to non-const.

    - Lvalues may not bind to rvalue references.

    - Otherwise lvalues could be accidentally modified.


    General rules governing reference binding are in [dcl.init.ref] (8.5.3 in N3290),
    and rules governing the interaction of reference binding and overloading resolution
    in [over.ics.ref] (13.3.1.4 in N3290) and [over.ics.rank] (13.3.2 in N3290), especially
    13.3.3.2 which states that there is a tie of binding between an lvalue or an rvalue
    reference, rvalues preferably take a parameter of const T& and the other type
    of const T&&, because rvalues can''t bind to all non-const T parameters, and a
    non-const rvalue would prefer to bind to a T& parameter over a const T parameter,
    because the former would require the addition of const.


    There was a time in C++00 when lvalues were permitted to bind to rvalue references,
    and some compilers (e.g., gcc 4.3 and 4.4 (but not 4.5), VC10 beta (but not beta
    2 or subsequent releases)) implemented this behavior. This is sometimes known
    as "version 1 of rvalue references." Motivated by N2818, the rules were changed
    such that lvalues may not bind to rvalue references, sometimes called "version
    2 of rvalue references." Developers need to be aware that some older compilers
    supporting rvalue references may implement the "version 1" instead of the version
    2 rules.'
  merge: -1
