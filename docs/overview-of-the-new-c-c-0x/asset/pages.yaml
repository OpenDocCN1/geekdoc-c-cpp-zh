  md: '# # Move is Optimization of Copy


    Implications:


    +   - Giving classes move support can improve performance even for move-unaware
    code.

    - Copy requests for rvalues may silently becomes.


    +   - Move requests safe for types w/o explicit move support.

    - Such types perform copies instead.

    - E.g., all built-in types.


    In short:


    +   - Give classes move support.

    - Use std::move for lvalues that may safely be moved from.


    ![](img/68a90f505054116271758fb914871a74_270_0.png)


    Both move and copy operations may throw, and the issues associated with exceptions
    in move functions are essentially the same as those associated with copy functions.
    E.g., both must implement at least the basic guarantee, but should document the
    guarantee they offer, clients must take into account how such functions may throw,
    etc.


    N2983 recommends that generic (i.e., template-based) coding wishing to offer the
    strong guarantee that uses a move operation on an unknown type T offer a conditional
    guarantee: the generic offers the strong guarantee only if T''s version of the
    move operation offers the strong (or notthrow) approach is viable for generic
    code using any unknown operation, however; there is nothing-specific about it.


    N2983 also explains how std::move_noexcept can be used in the tiny corner case
    of (1) legacy code offering the strong guarantee (2) that is being revised to
    replace copy operations with move operations not known to offer that guarantee.
    std::move_noexcept on an object of type T is like std::move on object, except
    it performs a copy instead of a move unless the relevant T operation is known
    to throw.'
