  md: "# Condition Variables\n\nwait parameters:\n\n+   - Mutex for shared data (required).\n\
    - Timeout (optional).\n- Predicate that must be true for thread to continue (optional)\n\
    \  - Allows library to handle spurious pickups.\n  - Often specified via lambda.\n\
    \nNotification options:\n\n+   - notify_one waiting thread.\n  - When all waiting\
    \ threads will do and only one needed.\n  - No guarantee that only one will be\
    \ awakened.\n- notify_all waiting threads.\n\nAll threads waiting on a condition\
    \ variable must specify the same mutex. In general, violations of this constraint\
    \ can not be statically detected, so programs violating it will compile (and have\
    \ undefined behavior).\n\nThe most common use case for notify_all seems to be\
    \ after a producer adds multiple elements to a work queue, at which point multiple\
    \ consumers can be awakened."
