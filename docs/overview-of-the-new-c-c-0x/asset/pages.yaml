- img_proc: true
  md: "# The Forwarding Problem\n\n```\ntemplate<typename F, typename... Ts> // as\
    \ before\nauto logAndInvoke(std::ostream& os, F&& func, Ts&&... args) -> // not\
    \ quite right\n    decltype(func(args...))\n{\n    os << std::chrono::system_clock::now();\
    \             // not quite right\n    return func(args...);\n}\n```\n\nargs...\
    \ are lvalues, but logAndInvoke's caller may have passed rvalues:\n\n+   - Templates\
    \ can distinguish rvalues from lvalues.\n- logAndInvoke might call the wrong overload\
    \ of func."
  merge: -1
  pgno: 326
- img_proc: true
  md: "# The Forwarding Problem\n\nExample:\n\n```\nclass FontProcessor {\npublic:\n\
    \    void operator()(const Font&); // takes lvalue\n    void operator()(Font&&);\
    \ // takes rvalue\n};\n```\n\n```\nFont getFont(); // function returning rvalue\n\
    logAndInvoke(std::cout, // caller passes rvalue, but\n    FontProcessor(), //\
    \ logAndInvoke calls\n    getFont()); // FontProcessor::operator()\n```"
  merge: -1
  pgno: 327
- img_proc: true
  md: "# Perfect Forwarding Redux\n\nSolution is perfect forwarding:\n\n```\ntemplate<typename\
    \ F, typename... Ts> // return type is\nauto logAndInvoke(std::ostream& os, F&&\
    \ func, Ts&&... args) -> // same as func's\ndecltype(func(std::forward<Ts>(args...))\n\
    {\n    os << std::chrono::system_clock::now();\n    return func(std::forward<Ts>(args...));\n\
    }\n```\n\nIn an expression \"std::forward<Ts>(args)...\", the pattern is being\
    \ unpacked is\n\"std::forward<Ts>(args)\", so \"std::forward<Ts>(args)...\" is\
    \ equivalent to\n\"std::forward<Ts1>(args1), std::forward<Ts2>(args2), ..., std::forward<Tn>(args)\"\
    . This is a pack pack pattern that involves the simultaneous unpacking of two\
    \ parameter\npacks: one from the template parameter list (Ts) and one from the\
    \ function parameter list\n(args)."
  merge: -1
  pgno: 328
