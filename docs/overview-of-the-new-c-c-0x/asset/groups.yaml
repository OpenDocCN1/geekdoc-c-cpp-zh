    \n## 函数回调示例\n\n支持点击事件回调的 Button 类：\n\n-   回调参数表示按下或松起点击。\n\n```cpp\nclass Button:\
    \ public SomeGUIFrameworkBaseClass {\npublic:\n    using CallbackType = std::function<void(short)>;\n\
    \    void setColor(const CallbackType& cb) {\n        clickHandler = cb;\n   \
    \ }\n    virtual void onClick(short upOrDown) // 由基类调用 {\n        clickHandler(upOrDown);\
    \ // 调用函数对象\n    }\nprivate:\n    CallbackType clickHandler;\n};\n```\n\n## 函数回调示例\n\
    \n```cpp\nvoid buttonClickHandler(int eventType); // 非成员函数\nclass ButtonHandler\
    \ {\npublic:\n    static int clicked(short upOrDown); // 静态成员函数\n};\nvoid (*clicker)(int)\
    \ = buttonClickHandler; // 函数指针\nButton b;\n\nb.setCallback(buttonClickHandler);\
    \ // 传递非成员函数\nb.setCallback(ButtonHandler::clicked); // 传递静态成员函数\nb.setCallback(clicker);\
    \ // 传递函数指针\n```\n\n注意（兼容的）类型不匹配：\n\n-   buttonClickHandler 和 clicker 接收 int，而不是\
    \ short\n-   ButtonHandler::clicked 返回 int，而不是 void\n\n| Scott Meyers, 开发顾问 |\
    \ © 2011 Scott Meyers, 版权所有。 |\n| http://www.aristeia.com/ | 幻灯片 207 |\n\n对于静态成员函数，在获取它们的地址时（即作为非成员函数使用时），在名称前使用\
    \ \"&\" 是可选的。\n\n## 函数回调示例\n\n```cpp\nclass ButtonClickCallback {\npublic:\n \
    \   void operator()(short upOrDown) const;\n};\nButton b;\n...\nButtonClickCallback\
    \ bccb;\nb.setCallback(bccb);\nvoid logClick(short upOrDown);\n..b.setCallback([&](int\
    \ v) { logClick(v); });\n```\n\n## 函数回调示例\n\n```cpp\nclass ButtonHandler {\npublic:\n\
    \    int clicked(short upOrDown) const; // 同前，但是非静态的\n};\nButton b;\nButtonHandler\
    \ bh;\n...\nb.setCallback(std::bind(&ButtonHandler::clicked, bh, _1)); // 传递非静态成员函数；\
    \ // 即将提供 std::bind 的信息\n```\n\nButtonHandler::clicked 是 const，因为 _1 实际上在 std::placeholders\
    \ 中，所以本页提到的 bind 涉及 lambda。\n\n## From TR1: bind\n\nMotivation:\n\n- bind1st 和\
    \ bind2nd 受限：\n  - 只能绑定第一个或第二个参数。\n  - 每次只能绑定一个。\n  - 不能绑定引用参数的函数。\n  - 需要适配器函数对象。\n\
    \  - 通常需要 ptr_fun, mem_fun 和 mem_fun_ref。\n\nbind1st 和 bind2nd 在 C++0x 中被废弃。\n\
    \n## bind\n\n- 定义在 <functional> 中。\n- 从以下内容产生函数对象：\n  - 一个可调用实体。\n  - 绑定参数的指定。\n\
    \    `functionObject std::bind(callableEntity, 1stArgBinding, 2ndArgBinding, ...\
    \ nthArgBinding);`\n- 占位符允许将 bind 的返回值映射到可调用对象。\n  - _n 指定传递给 bind 对象的第 n 个参数。\n\
    \n## bind Basics\n\n```cpp\nint f(int x, int y);\nauto bf = std::bind(f, 10, _1);\
    \ // 等于 std::bind1st(f, _1);\n```\n\n![](img/68a90f505054116271758fb914871a74_215_0.png)\n\
    \n```\nint val = bf(99); // 调用绑定函数\n```\n\n![](img/68a90f505054116271758fb914871a74_215_1.png)\n\
    \n占位符或形式参数名显示在表示它们所属实体的框内部。因此，外框（表示 std::bind 返回的函数）的占位符名称为 _1。\n\n_1 实际上在 namespace\
    \ std::placeholders 中，所以除非通过 using 声明使 std::placeholders::_1 可，否则本页的 bind 调用无法编译。\n\
    \nbf 不是从 bind 返回的对象相同，但极有可能，它是从 bind 返回的值移动构造而来的。\n\n"
