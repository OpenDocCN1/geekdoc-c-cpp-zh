- md: "\n# Explicit Move Requests\n\nTo request a move on an lvalue, use `std::move`:\n\
    \n`std::move` turns lvalues into rvalues.\n\n- The overloading rules do the rest.\n\
    \nThe move assignment operator on this page fails to worry about move-to-self.\n\
    \n# Why move Rather Than Cast?\n\n`std::move` uses implicit type deduction. Consider:\n\
    \n```cpp\ntemplate<typename It>\nvoid someAlgorithm(It begin, It end)\n{\n   \
    \ // permit move from *begin to temp, static_cast version\n    auto temp1 = static_cast<typename\
    \ std::iterator_traits<It>::value_type&>(*begin);\n    // same thing, C-style\
    \ cast version\n    auto temp2 = (typename std::iterator_traits<It>::value_type&)**begin;\n\
    \    // same thing, std::move version\n    auto temp3 = std::move(*begin);\n \
    \   ...\n}\n```\n\nWhat would you rather type?\n\n# Implementing std::move\n\n\
    `std::move` is simple – in concept:\n\n```cpp\ntemplate<typename T> // return\
    \ as an rvalue whatever\nT&                         // is passed in; must work\
    \ with\nmove(MagicReferenceType obj) // both lvalue/rvalues\n{\n    return obj;\n\
    }\n```\n\nBetween concept and implementation lie arcane language rules.\n\n# Reference\
    \ Collapsing in Templates\n\nIn C++98, given:\n```cpp\ntemplate<typename T>\n\
    void f(T& param);\nint x;\nf<int&>(x); // T is int&\n```\n\nf is initially instantiated\
    \ as:\n```cpp\nvoid f(int& param); // reference to reference\n```\n\nC++98's reference-collapsing\
    \ rule says\n\n- T & ⇒ T&\n\nso f's instantiation is actually:\n```cpp\nvoid f(int&\
    \ param); // after reference collapsing\n```\n\n# Reference Collapsing in Templates\n\
    \nC++0x's rules take rvalue references into account:\n\n- T& -> T& // from C++98\n\
    - T&& -> T& // new for C++0x\n- T& -> T&& // new for C++0x\n- T&& -> T&& // new\
    \ for C++0x\n\nSummary:\n\n- Reference collapsing involving a & is always T&.\n\
    - Reference collapsing involving only && is T&.\n\nThese rules are defined by\
    \ [dcl.ref] (8.3.2/6 in N3290).\n\n# std::move’s Return Type\n\nTo guarantee rvalue\
    \ return type, `std::move` does this:\n\n```cpp\ntemplate<typename T>\ntypename\
    \ std::remove_reference<T>::type&\nmove(MagicReferenceType obj)\n{\n  return obj;\n\
    }\n```\n\n- Recall that a T& return type would be an lvalue!\n\nHence:\n\n```cpp\n\
    int x;\nstd::move<int>(x); // calls remove_reference<int>::&& std::move(/*...*/)\n\
    // => int&& && std::move(/*...**/)\n```\n\n- Without remove_reference, move<int>\
    \ would return int.\n\n`std::remove_reference` is part of the type traits functionality\
    \ in C++0x. It turns both T and T& types into T.\n\n# std::move’s Parameter Type\n\
    \nMust be a non-const reference, because we want to move its value.\nAn lvalue\
    \ reference doesn't work.\n\n- Rvalues can't bind to them:\n\n```cpp\nTVec createTVec();\
    \           // as before\nTVec&&& std::move(TVec& obj); // possible move\n   \
    \                             // instantiation\nstd::move(createTVec());     //\
    \ error!\n```\n\n![](img/68a90f505054116271758fb914871a74_259_0.png)\n\nNote that\
    \ this page shows move as a function, not a template.\n\n# std::move’s Parameter\
    \ Type\n\nAn rvalue reference doesn't, either.\n\n- Lvalues can't bind to them.\n\
    \n```cpp\nTVec&&& std::move(TVec&&& obj); // possible move\n// instantiation\n\
    \nTVec& vt;\nstd::move(vt); // error!\n```\n\nWhat std::move needs:\n\n- For lvalue\
    \ arguments, a parameter type of T&.\n- For rvalue arguments, a parameter type\
    \ of T&&.\n\nNote that this page shows move as a function, not a template.\n\n\
    # Why Not Just Overload?\n\nOverloading could solve the problem:\n\n```cpp\ntemplate<typename\
    \ T>\ntypename std::remove_reference<T>::type& move(T&& lvalue)\n{ return static_cast<T&&>(lvalue);\
    \ }\n\ntemplate<typename T>\ntypename std::remove_reference<T>::type& move(T&&\
    \ rvalue)\n{ return static_cast<T&&>(rvalue); }\n```\n\nBut the perfect forwarding\
    \ problem would remain:\n\n- How forward n arguments to another function?\n- We'd\
    \ need 2 overloads!\n\nRvalue references aimed at both std::move and perfect forwarding.\n\
    \nThis slide assumes the C++98/C++03 rules for template argument deduction, i.e.,\
    \ that no distinction is drawn between lvalue and rvalue arguments for purposes\
    \ of determining T.\n\n# T&& Parameter Deduction in Templates\n\nGiven:\n```cpp\n\
    template<typename T>\nvoid f(T& param);      // note non-const rvalue reference\n\
    ```\n\nT’s deduced type depends on what’s passed to param:\n\n- Lvalue ⇒ T is\
    \ an lvalue reference (T)\n- Rvalue ⇒ T is a non-reference (T)\n\nIn conjunction\
    \ with reference collapsing:\n\n```cpp\nint x;\nf(x);                        \
    \  // lvalue: generates f<int&>(int&&) // calls f<int&)\nf(10);              \
    \           // rvalue: generates f<int&>(int&)  // calls f<int&)\nTVec vt;\nf(vt);\
    \                         // lvalue: generates f<TVec&>(TVec&&) // calls f<TVec&)\n\
    f(createTVec());               // rvalue: generates f<TVec&>(TVec&) // calls f<TVec&)\n\
    ```\n\n# Implementing std::move\n\nstd::move’s parameter is thus T&:\n\n```cpp\n\
    template<typename T>\ntypename std::remove_reference<T>::type&&\nmove(T& obj)\n\
    {\n  return obj;\n}\n```\n\nThis is almost correct. Problem:\n\n- obj is an lvalue\
    \ (It has a name)\n- move’s return type is rvalue reference.\n- Lvalues can’t\
    \ bind to rvalue references.\n\n# Implementing std::move\n\nA cast eliminates\
    \ the problem:\n\n```cpp\ntemplate<typename T>\ntypename std::remove_reference<T>::type&&\n\
    move(T& obj)\n{\n    using ReturnType = typename std::remove_reference<T>::type&&;\n\
    \    return static_cast<ReturnType>(obj);\n}\n```\n\nThis is a correct implementation.\
    \ I believe (but not confirmed) that it’s possible to avoid repeating std::move’s\
    \ return type in the body by applying `decltype` to itself:\n\n```cpp\ntemplate<typename\
    \ T>\ntypename std::remove_reference<T>::type&&\nmove(T& obj)\n{\n    using ReturnType\
    \ = decltype(move(obj));\n    return static_cast<ReturnType>(obj);\n}\n```\n\n\
    # T& Parameters in Templates\n\nNote that function templates with a T& parameter\
    \ need to generate functions taking a T&:\n\n```cpp\ntemplate<typename T>\nvoid\
    \ f(T& param);    // as before\nint x;\nf(x);                        // still\
    \ calls f<int>(int&), i.e., f(int&)\nf(10);                   // still calls f<int>(int&),\
    \ i.e., f(int&)\nTVec vt;\nf(vt);                    // still calls f<TVec&>(TVec&),\
    \ i.e., f(TVec&)\nf(createTVec());      // still calls f<TVec&>(TVec&), i.e.,\
    \ f(TVec&)\n```\n\n# T& Parameters in Templates\n\n```cpp\ntemplate<typename T>\n\
    void f(T& param);    // takes anything: lvalue or rvalue, const or non-const\n\
    ```\n\n- Lvalues can't bind to rvalue references, but param may bind to an lvalue.\n\
    - After instantiation, param's type may be T&\n- Important for perfect forwarding\
    \ (described shortly).\n\nT& as a “takes anything” parameter applies only to templates!\n\
    - For functions, a && parameter binds only to non-const rvalues:\n\n```cpp\nvoid\
    \ f(Widget&& param); // takes only non-const rvalues\n```\n\n# auto&& ≡ T&&\n\n\
    auto type deduction = template deduction, so an auto&& variable's type may be\
    \ an lvalue reference:\n\n```cpp\nint calcVal();\nint x;\nauto&& v1 = calcVal();\
    \ // deduce type from rvalue -> v1's type is int&&\nauto&& v2 = x; // deduce type\
    \ from lvalue -> v2's type is int&\n```\n\n![](img/68a90f505054116271758fb914871a74_267_0.png)\n\
    \n# Move is an Optimization of Copy\n\nMove requests for copyable types w/ move\
    \ support yield copies:\n\n```cpp\nclass Widget { // class w/o move support\n\
    public:\n    Widget(const Widget&); // copy ctor\n};\nclass Gadget { // class\
    \ with move support\npublic:\n    Gadget(Gadget& rhs) // move ctor\n    : w(std::move(rhs.w))\
    \ // request to move w's value\n    { ... }\nprivate:\n    Widget w; // lacks\
    \ move support\n};\n```\n\nrhs.w is copied to w:\n* std::move(rhs.w) returns an\
    \ rvalue of type Widget.\n* That value is passed to Widget's copy constructor.\n\
    \nMove requests on types that are not copyable but also lack move support will\
    \ fail to compile.\n\n# Move is an Optimization of Copy\n\nIf Widget adds move\
    \ support:\n\n```cpp\nclass Widget {\npublic:\n    Widget(const Widget&); // copy\
    \ ctor\n    Widget(Widget&&); // move ctor\n}\n\nclass Gadget {\npublic:\n   \
    \ Gadget(Gadget&& rhs) // as before\n    : w(std::move(rhs.w)) { ... } // as before\n\
    private:\n    Widget w;\n};\n```\n\nrhs.w is now moved to w:\nstd::move(rhs.w)\
    \ still returns an rvalue of type Widget.\n\n- - That value now passed to Widget's\
    \ move constructor.\n- Via normal overloading resolution.\n"
  mdcn: "\n\n# 显式移动请求\n\n要对左值（lvalue）请求移动，请使用 `std::move`：\n\n`std::move` 将左值转换为右值（rvalues）。\n\
    \n- 重载规则会完成剩余工作。\n\n本页面的移动赋值运算符没有考虑移动到自身（move-to-self）。\n\n# 为什么用移动而不是转换？\n\n\
    `std::move` 使用隐式类型推导。考虑：\n\n```cpp\ntemplate<typename It>\nvoid someAlgorithm(It\
    \ begin, It end)\n{\n    // 允许从 *begin 移动到 temp，使用 static_cast 版本\n    auto temp1\
    \ = static_cast<typename std::iterator_traits<It>::value_type&>(*begin);\n   \
    \ // 相同，C语言风格转换版本\n    auto temp2 = (typename std::iterator_traits<It>::value_type&)**begin;\n\
    \    // 相同，std::move 版本\n    auto temp3 = std::move(*begin);\n    ...\n}\n```\n\
    \n你更倾向于输入哪一个？\n\n# 实现 std::move\n\n`std::move` 在概念上非常简单：\n\n```cpp\ntemplate<typename\
    \ T> // 无论传入什么都返回右值\nT&                         // 传入的；必须兼容\nmove(MagicReferenceType\
    \ obj) // 同时左值/右值\n{\n    return obj;\n}\n```\n\n在概念与实现之间存在着奥的语言规则。\n\n# 模板中的引用折叠（Reference\
    \ Collapsing）\n\n在 C++98 中，给定：\n```cpp\ntemplate<typename T>\nvoid f(T& param);\n\
    int x;\nf<int&>(x); // T 是 int&\n```\n\nf 初始实例化为：\n```cpp\nvoid f(int& param);\
    \ // 引用的引用\n```\n\nC++98 的引用折叠规则规定\n\n- T & ⇒ T&\n\n所以 f 的实例化实际上是：\n```cpp\nvoid\
    \ f(int& param); // 引用折叠后\n```\n\n# 模板中的引用折叠\n\nC++0x 的规则考虑了右值引用：\n\n- T& -> T&\
    \ // 来自 C++98\n- T&& -> T& // C++0x 新增\n- T& -> T&& // C++0x 新增\n- T&& -> T&&\
    \ // C++0x 新增\n\n总结：\n\n- 涉及 & 的引用折叠始终是 T&。\n- 仅涉及 && 的引用折叠是 T&。\n\n这些规则由 [dcl.ref]\
    \ (8.3.2/6 in N3290) 定义。\n\n# std::move 的返回值\n\n为了保证返回值为右值，`std::move` 执行了如下操作：\n\
    \n```cpp\ntemplate<typename T>\ntypename std::remove_reference<T>::type&\nmove(MagicReferenceType\
    \ obj)\n{\n  return obj;\n}\n```\n\n- 记住，T& 返回类型将是一个左值！\n\n因此：\n\n```cpp\nint\
    \ x;\nstd::move<int>(x); // 调用 remove_reference<int>::&& std::move(/*...*/)\n\
    // => int&& && std::move(/*...**)\n```\n\n- 如果没有 remove_reference，move<int> 将返回\
    \ int。\n\n`std::remove_reference` 是 C++0x 类型特质（type traits）功能的一部分。它将 T 和 T& 类型都转换为\
    \ T。\n\n# std::move 的参数类型\n\n必须是非 const 引用，因为我们想要移动它的值。\n左值引用是不行的。\n\n- 右值无法绑定到它们：\n\
    \n```cpp\nTVec createTVec();           // 如前所示\nTVec&&& std::move(TVec& obj);\
    \ // 可能移动\n                                // 实例化\nstd::move(createTVec());  \
    \   // 错误！\n```\n\n![](img/68a90f505054116271758fb914871a74_259_0.png)\n\n注意本页展示的移动是一个函数，而不是模板。\n\
    \n# std::move 的参数类型\n\n右值引用也不行。\n\n- 左值无法绑定到它们。\n\n```cpp\nTVec&&& move(TVec&&);\
    \ // 可能移动\nTVec& vt;\nmove(vt); // \n```\n\nstd::move 需要：\n\n- 对于左值参数，参数类型为 T&。\n\
    - 对于右值参数，参数类型为 T&&。\n\n注意本页显示移动是一个函数，而不是模板。\n\n# 为什么不直接重载？\n\n重载可以解决问题：\n\n```cpp\n\
    template<typename T>\ntypename std::remove_reference<T>::type& move(T& lvalue)\
    \ { return static_cast<T&&>(lvalue); }\n\ntemplate<typename T>\ntypename std::remove_reference<T>::type&\
    \ move(T&& rvalue) { return static_cast<T&&>(rvalue); }\n```\n\n但完美转发问题仍然存在：\n\
    \n- 如何将参数转发到另一个函数？\n- 我们需要重载！\n\n针对 std::move 和完美转发的右值引用幻灯片假设 C++98/C++03 的模板参数推导不区分左值和右值参数。\n\
    \n# 模板中的 T&& 参数推导\n\n给定：\n```cpp\ntemplate<typename T>\nvoid f(T& param); // 注意是非\
    \ const 右值引用\n```\n\nT 的推导类型取决于传入 param 的内容：\n\n- 左值 ⇒ T 是左值引用\n- 右值 ⇒ T 是非引用\n\
    \n结合引用折叠：\n\n```cpp\nint x;\nf(x);                          // 左值：生成 f<int&>(int&)\n\
    f(10);                         // 右值：生成 f<int&>(int&)\nTVec vt;\nf(vt);      \
    \                   // 左值：生成 f<TVec&>(TVec&)\nf(createTVec());               //\
