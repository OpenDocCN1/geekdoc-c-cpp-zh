    - Use http://www.stdthread.co.uk/sm20/ for a 20% discount.\n\nParticipants in\
    \ comp.std.c++ provided invaluable information and illuminating discussions.\n\
    \n# Licensing Information\n\nScott Meyers licenses materials for this and other\
