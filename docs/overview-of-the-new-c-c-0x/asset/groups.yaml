    - <type_traits> 拥有模板结构体 <class... T> struct common_type;\n\n- - 对象结构生成：\n- std::tuple<T1,\
    \ T2, ..., Tn> 需要 n 个字段，每个字段的类型都正确。\n- std::tuple<T1, T2, ..., Tn> 继承自 std::tuple<T2,\
    \ T3, ..., Tn>\n\n给定一个类型列表，std::common_type 返回列表中的类型，列表中的所有类型都可以转换为该类型。如果没有这样的类型，或者存在多个这样的类型，代码将无法编译。对于内建类型，按照其通常顺序应用标准的提升和转换规则，例如\
    \ `std::common_type<int, double>::type` 是 `double`，因为 int->double 优于 double->int，尽管二者都是可能的。\n\
    \n# std::tuple 的草图\n\n```cpp\ntemplate <class... Types> // 声明主模板\nclass tuple:\n\
    template<> class tuple<>; // 用于空元组\ntemplate<typename T, typename... TRest> //\
    \ 带有数据成员的类\nclass tuple<T, TRest...> { // 用于包中的第一个 T // 继承自 // 包的剩余部分\nprivate:\n\
    \    tuple<TRest... > { // 类型为 T 的数据成员\n    T data;\npublic:\n    tuple() : data()\
    \ {}; // 默认构造函数；所有类型必须是可以默认构造的 // 非默认构造函数。\n...\n};\n```\n\n在成员初始化行上执行“data()`可以确保内建类型初始化为零（指针为空）。\n\
    \nDouglas Gregor 和 Jaakko Järvi 发表的实现（见更多信息部分）将其声明为 `protected` 但没有给出理由，而真实的实现（例如\
    \ VC 10, gcc 4.5）将其声明为 `private`。因此我使用了 `private`。\n\n# 生成的层次结构\n\nstd::tuple<int,\
    \ char, std::string> t;\n\n![](img/68a90f505054116271758fb914871a74_323_0.png)\n\
    \ndata 是 `private` 的这一事实引发了关于 std::get 如何实现的问题。在示例未列出的 tuple 成员函数中，有一个返回 data\
    \ 引用的公共函数。在 Gregor 和 Järvi 的实现中，该函数被称为 `head`。对 `tuple<T, TRest...>` 使用 `std::get<n>`\
    \ 会递归地向上遍历 TRest，每层减少 n 直到 0。然后它返回该类的 `head` 结果。\n\n# decltype\n\n产生表达式的类型而不对其值。\n\
    \n```cpp\nint x, *ptr;\ndecltype(x) i1;               // i1 的类型是 int\ndecltype(ptr)\
    \ p1;             // p1 的类型是 int*\nstd::size_t sz = sizeof(decltype(ptr[44]));\
    \ // sz = sizeof(\n```\n\n这非常直观，但某些奇怪的情况，例如括号可能会产生影响：\n\n```cpp\nstruct S { double\
    \ d; };\nconst S* p;\n...\ndecltype(p->d) x1;         // double\ndecltype((p->d))\
    \ x2;        // const&\n```\n\n# 解包模式\n\n```cpp\ntemplate<typename T> // 返回一个归一化的\n\
    T normalize(T& obj); // obj 的拷贝\ntemplate<typename F, typename... PTypes>\nvoid\
    \ normalizedCall(F func,\n    PTypes&... params) // 同上\n{\n    func(normalize(params...));\
    \   // 对每个解包\n// 元素调用 normalize\n}\n```\n\n对 func 的调用展开为：\n\n```\nfunc(normalize(params₁),\
    \ normalize(params₂), ..., normalize(paramsₙ));\n```\n\n# 变参数类模板\n\nTMP（模板元编程）的基础。示例包括：\n\
    \n- - 类型计算：\n- <type_traits> 拥有模板结构体 <class... T> struct common_type;\n\n- - 对象结构生成：\n\
