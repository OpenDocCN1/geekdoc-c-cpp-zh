  mdcn: "\n\n## 可调用实体\n\n可以像函数一样调用的东西：\n\n-   函数、函数指针、函数引用：\n\n```\nvoid f(int x);\
    \               // 函数\nvoid (*fp)(int) = f;      // 函数指针\nint val;\n...\nf(val);\
    \                   // 调用 f\nfp(val);                  // 调用 *fp\n```\n\n“可调用实体”（callable\
    \ entity）这个术语是我自的，它比 C++0x 的“可调用对象”（callable object）的概念稍微受限一些，因为可调用对象包含了成员数据指针。可调用对象还包括指向非静态成员函数的指针，而我在讨论\
    \ `std::function` 时没有提到它们。（不过我在结合 `std::bind` 和 lambda 表达式时讨论过它们，这两者都会产生可以存储在\
    \ `std::function` 对象中的函数对象。）\n\n## 可调用实体\n\n-   可以隐式转换为其中一种的对象：\n\n```cpp\nclass\
    \ Widget {\npublic:\n    using FuncPtr = void (*)(int);\n    operator FuncPtr()\
    \ const; // 转换为函数指针\n    ...\n};\nWidget w;                 // 具有转换为函数指针转换的对象\n\
    int val;\n...\nw(val);                   // “调用” w，即：\n                      \
    \    // 调用 (w.operator FuncPtr())\n```\n\n## 可调用实体\n\n-   函数对象（包括闭包）：\n\n```\n\
    class Gadget {\npublic:\n    void operator()(int); // 函数调用运算符\n    ...\n};\nGadget\
    \ g; // 支持 operator()) 的对象\nint val;\n\ng(val); // “调用” g，即：调用 w.operator())\n\
    \nauto f = [](int x) { return x < currentThreshold(); };\nif (f(val)) ... // “调用”闭包\n\
    ```\n\n## std::function 基础\n\n-   定义在 <functional> 中。\n\n-   `std::function` 是可调用实体的类型安全封装器：\n\
    \n```\nstd::function<int(std::string&)> f; // f 指向可调用实体\n// 与给定的签名兼容\n```\n\n\
    ```\nint someFunc(std::string&); // 某个函数\nf = someFunc; // f 指向 someFunc\n```\n\
    \n```\nf = [][](std::string s)->unsigned\n    { s = \"!\"; return s.size(); };\
    \ // f 指向 \\lambda 的闭包\n```\n\n```\nclass Gadget {\npublic:\n    int operator()(std::string&);\n\
    \    ...\n}; // 函数调用运算符\n```\n\n```\nf = g; // f 指向 g\n```\n\n## 新 C++ (C++0x)\
    \ 概述\n\n### 基础行为\n\n![](img/68a90f505054116271758fb914871a74_205_0.png)\n\n```\n\
    int someFunc(std::string); // 某个函数\nf = someFunc;\nstd::string str;\n...\nint\
    \ result = f(str); // 调用 someFunc\nf = |(std::string& s)|->unsigned { s += \"\
    !\"; return s.size(); };\n...\nresult = f(str); // 调用 λ 的闭包\n```\n\nScott Meyers,\
    \ 开发顾问 http://www.aristeia.com/ 2011 Scott Meyers, 版权所有。\n幻灯片 204\n\n外框表示 `std::function`\
    \ 对象，内框表示它封装的可调用实体（即转发调用的地方）。\n\nScott Meyers, 开发顾问\nhttp://www.aristeia.com/\
