    # Unicode Support


    There are corresponding string literals:


    +   - u"UCS-2 string literal // ⇒ char16_ts in UTF-16

    - u"UCS-4 string literal // ⇒ char32_ts in UCS-4/UTF-32

    - "Ordinary/narrow string literal // ⇒ "ordinary/narrow" ⇒ chars

    - L"Wide string literal // ⇒ "wide" ⇒ wchar_ts


    UTF-8 string literals are also supported:


    +   - u8"UTF-8 string literal // ⇒ chars in UTF-8


    Code points can be specified via \unnnn and \Unnnn:


    +   - u8"clef: \U0001D1EE // )

    - u"Thai character Khomut: \u0E5B // ~

    - u"Skull and crossbones: \u2620 // ☠


    A code point is a specific character/glyph, i.e., a specific member of the Unicode
    set. UTF-8 and UTF-16 are byte encodings, UCS-n and UTF-32 are fixed-size encodings.
    All UCS-2 can represent every code point of the full Unicode character set. UTF-8,
    and UCS-4/UTF-32 are all defined by ISO 10646 as the Unicode Standard. Per the
    Unicode (http://unicode.org/faq/unicode_iso.html), "Although the character and
    encoding formats are synchronized between Unicode and ISO/IEC 10646, the Standard
    imposes additional constraints on implementations to ensure that they treat characters
    uniformly across platforms and applications. This ends, it supplies an extensive
    set of functional character specifications, character data, algorithms and substantial
    background material that is not in ISO/IEC 10646."


    Although u-qualified literals are not permitted to yield UTF-16 surrogate pairs,
    characters in u-qualified string literals appear to be. Per [lex.string](2.1.4/9
    in N3290), "A char16_t string literal — initialized with the given character.
    A c-char may produce more than one char16_t character in the form of surrogate
    pairs."


    The results of appending string literals of different types (if supported) are
    implementation-defined:


    +   - u8"abc" "def" u" // implementation-defined results'
