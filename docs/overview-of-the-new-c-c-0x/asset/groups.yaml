    # Storing Closures


    auto more efficient than std::function, but not always applicable.


    +   Not allowed for function parameters or return types:

    void uselt(auto func); // error!

    void uselt(std::function<bool>(long)> func); // fine

    template<typename Func>

    void uselt(Func func); // fine, but generates

    multiple functions


    +   auto makeFunc(); // error!

    std::function<bool>(long)> makeFunc(); // fine

    template<typename Func>

    Func makeFunc(); // fine, but generates

    multiple functions,

    and callers must

    specify Func


    Regarding efficiency of auto vs. std::function, Stefan T. Lavavej says, “A compiler
    have to perform extreme heroics to get function to be as efficient as auto.”'
