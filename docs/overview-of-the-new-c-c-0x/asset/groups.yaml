- md: "\n## Callable Entities\n\nSomething that can be called like a function:\n\n\
    - Functions, function pointers, function references:\n\n```\nvoid f(int x);  \
    \             // function\nvoid (*fp)(int) = f;      // function pointer\nint\
    \ val;\n...\nf(val);                   // call f\nfp(val);                  //\
    \ call *fp\n```\n\nThe term “callable entity” is mine and slightly more restricted\
    \ than the C++0x notion of a “callable object,” because callable objects include\
    \ member data pointers. Callable objects also include pointers to non-static member\
    \ functions, which I don’t discuss in conjunction with std::function. (I do discuss\
    \ them in conjunction with std::bind and lambdas, both of which produce function\
    \ objects that can be stored in std::function objects.)\n\n## Callable Entities\n\
    \n- Objects implicitly convertible to one of those:\n\n```cpp\nclass Widget {\n\
    public:\n    using FuncPtr = void (*)(int);\n    operator FuncPtr() const; //\
    \ conversion to function ptr\n    ...\n};\nWidget w;                 // object\
    \ with conversion to func ptr\nint val;\n...\nw(val);                   // \"\
    call\" w, i.e.,\n                          // invoke (w.operator FuncPtr())\n\
    ```\n\n## Callable Entities\n\n- Function objects (including closures):\n\n```\n\
    class Gadget {\npublic:\n    void operator()(int); // function call operator\n\
    \    ...\n};\nGadget g; // object supporting operator())\nint val;\n\ng(val);\
    \ // \"call\" g, i.e., invoke w.operator())\n\nauto f = [](int x) { return x <\
    \ currentThreshold(); };\nif (f(val)) ... // \"call\" closure\n```\n\n## std::function\
    \ Basics\n\n- Declared in <functional>.\n\n- std::functions are type-safe wrappers\
    \ for callable entities:\n\n```\nstd::function<int(std::string&)> f; // f refers\
    \ to callable entity\n// compatible with given sig.\n```\n\n```\nint someFunc(std::string&);\
    \ // some function\nf = someFunc; // f refers to someFunc\n```\n\n```\nf = [][](std::string\
    \ s)->unsigned\n    { s = \"!\"; return s.size(); }; // f refers to \\lambda's\
    \ closure\n```\n\n```\nclass Gadget {\npublic:\n    int operator()(std::string&);\n\
    \    ...\n}; // function call operator\n```\n\n```\nf = g; // f refers to g\n\
    ```\n\n## Overview of the New C++ (C++0x)\n\n### Fundamental Behavior\n\n![](img/68a90f505054116271758fb914871a74_205_0.png)\n\
    \n```\nint someFunc(std::string); // some function\nf = someFunc;\nstd::string\
    \ str;\n...\nint result = f(str); // calls someFunc\nf = |(std::string& s)|->unsigned\
    \ { s += \"!\"; return s.size(); };\n...\nresult = f(str); // calls λ's closure\n\
    ```\n\nScott Meyers, Software Development Consultant http://www.aristeia.com/\
    \ 2011 Scott Meyers, all rights reserved.\nSlide 204\n\nThe outer box represents\
    \ std::function object, the inner box callable entity it wraps (i.e., forwards\
    \ calls to).\n\nScott Meyers, Software Development Consultant\nhttp://www.aristeia.com/\
    \ 2011 Scott Meyers, all rights reserved.\nDownload from Wow! eBook: www.wowebook.com\
    \ *\n\n## Compatible Signatures\n\nA callable entity is compatible with a function\
    \ object if:\n\n- The function object’s parameter types can be converted to the\
    \ entity’s parameter types.\n- The entity’s return type can be converted to the\
    \ function object’s.\n\n![](img/68a90f505054116271758fb914871a74_206_0.png)\n\n\
    All entity return types are compatible with void-returning function objects.\n\
    \n## function Callback Example\n\nA Button class supporting click-event callbacks:\n\
    \n- The callback parameter indicates a down- or up-click.\n\n```\nclass Button:\
    \ public SomeGUIFrameworkBaseClass {\npublic:\n    using CallbackType = std::function<void(short)>;\n\
    \    void setColor(const CallbackType& cb) {\n        clickHandler = cb;\n   \
    \ }\n    virtual void onClick(short upOrDown) // invoked by base class {\n   \
    \     clickHandler(upOrDown); // invoke function object\n    }\nprivate:\n   \
    \ CallbackType clickHandler;\n};\n```\n\n## function Callback Example\n\n```cpp\n\
    void buttonClickHandler(int eventType); // non-member function\nclass ButtonHandler\
    \ {\npublic:\n    static int clicked(short upOrDown); // static member function\n\
    };\nvoid (*clicker)(int) = buttonClickHandler; // function pointer\nButton b;\n\
    \nb.setCallback(buttonClickHandler); // pass non-member func\nb.setCallback(ButtonHandler::clicked);\
    \ // pass static member func\nb.setCallback(clicker); // pass function ptr\n```\n\
    \nNote the (compatible) type mismatches:\n\n- buttonClickHandler and clicker take\
    \ int, not short\n- ButtonHandler::clicked returns int, not void\n\n| Scott Meyers,\
    \ Software Development Consultant | © 2011 Scott Meyers, all rights reserved.\
    \ |\n| http://www.aristeia.com/ | Slide 207 |\n\nFor static member functions,\
    \ the use of \"&\" before the name is optional when taking their address (i.e.,\
    \ as non-member functions).\n\n## function Callback Example\n\n```cpp\nclass ButtonClickCallback\
    \ {\npublic:\n    void operator()(short upOrDown) const;\n};\nButton b;\n...\n\
    ButtonClickCallback bccb;\nb.setCallback(bccb);\nvoid logClick(short upOrDown);\n\
    ..b.setCallback([&](int v) { logClick(v); });\n```\n\n## function Callback Example\n\
    \n```cpp\nclass ButtonHandler {\npublic:\n    int clicked(short upOrDown) const;\
    \ // as before, but non-static\n};\nButton b;\nButtonHandler bh;\n...\nb.setCallback(std::bind(&ButtonHandler::clicked,\
    \ bh, _1)); // pass non-static member func; // info on std::bind coming soon\n\
    ```\n\nButtonHandler::clicked is const, because _1 is actually in std::placeholders,\
    \ so bind on this page mention lambdas.\n\n## Overview of the New C++ (C++0x)\n\
    \n### Other Characteristics\n\n- Declared in <functional>.\n\n- std::functions\
    \ are type-safe wrappers for callable entities:\n\n```\nstd::function<int(std::string&)>\
    \ f; // f refers to callable entity\n// compatible with given sig.\n```\n\n```\n\
    int someFunc(std::string&); // some function\nf = someFunc; // f refers to someFunc\n\
    ```\n\n```\nf = [][](std::string s)->unsigned\n    { s = \"!\"; return s.size();\
