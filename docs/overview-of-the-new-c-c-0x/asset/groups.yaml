  - "[PAGE 119]\n\n# Condition Variables\n\nAllow threads to communicate about changes\
    \ to shared data.\n\n+   - Consumers wait until producers notify about changed\
    \ state.\n\nRules:\n\n+   - Call wait while holding locked mutex.\n\n+   - wait\
    \ unlocks mutex, blocks thread, enqueues it for notification.\n\n+   - At notification,\
    \ thread is unblocked and moved to mutex queue.\n  “Notified threads awake and\
    \ run with the mutex locked.”\n\nCondition variable types:\n\n+   - condition_variable:\
    \ wait on std::unique_lock<std::mutex>.\n  Most efficient, appropriate in most\
    \ cases.\n\n+   - condition_variable_any: wait on any mutex type.\n  Possibly\
    \ less efficient, more flexible.\n\nIn concept, condition variables simply make\
    \ it possible for one thread to notify another when some event occurs, the fact\
    \ that condition variables are inherently tied to mutexes suggests that shared\
    \ data is always involved. Pure notification could be achieved via semaphores,\
    \ but there are no semaphores in C++0x.\n\nThere are no examples of condition_variable_any\
    \ in this course.\n\nAs noted in the mutex discussion, condition variables are\
    \ neither copyable nor movable."
  - "[PAGE 120]\n\n# Condition Variables\n\nwait parameters:\n\n+   - Mutex for shared\
    \ data (required).\n- Timeout (optional).\n- Predicate that must be true for thread\
    \ to continue (optional)\n  - Allows library to handle spurious pickups.\n  -\
    \ Often specified via lambda.\n\nNotification options:\n\n+   - notify_one waiting\
    \ thread.\n  - When all waiting threads will do and only one needed.\n  - No guarantee\
    \ that only one will be awakened.\n- notify_all waiting threads.\n\nAll threads\
    \ waiting on a condition variable must specify the same mutex. In general, violations\
    \ of this constraint can not be statically detected, so programs violating it\
    \ will compile (and have undefined behavior).\n\nThe most common use case for\
    \ notify_all seems to be after a producer adds multiple elements to a work queue,\
    \ at which point multiple consumers can be awakened."
  - "[PAGE 121]\n\n# waiting Examples\n\n```\nstd::atomic<bool> readyFlag(false);\n\
    std::mutex m;\nstd::condition_variable cv;\n{\n    std::unique_lock<std::mutex>\
    \ lock(m); // loop for spurious wakeups\n    while (readyFlag) // wait for notification\n\
    \        cv.wait(lock, []{ return readyFlag; }); // ditto, but library loops\n\
    \    if (cv.wait_for(lock, std::chrono::seconds(1), // if (notification rcv'd\
    \ or timeout)\n            []{ return readyFlag; })) { // predicate is true.\n\
    \            // critical section\n        }\n    else {\n        // timed out\
    \ w/o getting\n        // into critical section\n    }\n}\n```\n\n[std::atomic<bool>]\
    \ has not yet been introduced.\n\nThe copy constructor in std::atomic<bool> is\
    \ deleted, so direct initialization syntax or brace initialization syntax must\
    \ be used; copy initialization won't compile.\n\nAtomic types (e.g., std::atomic<bool>)\
    \ are defined in <atomic>.\n\nThe waiting functions are wait, wait_for, and wait_until.\
    \ The only difference between wait_for and wait_until is that the former takes\
    \ a duration (how long to wait), while the latter takes an absolute time (when\
    \ to wait until). Waiting times are absolute (e.g., the example above will wait\
    \ for a total of 1 second, regardless of how many spurious wakeups occur).\n\n\
    The examples on this page assume that readyFlag, m, and cv are nonlocal variables,\
    \ e.g., at global or namespace scope. That's why the lambdas can refer to readyFlag\
    \ without capturing it."
  - "[PAGE 122]\n\n# Notification Examples\n\n```\nstd::atomic<bool> readyFlag(false);\
    \ // as before\nstd::condition_variable cv;\n{\n    readyFlag = true; // make\
    \ things \"ready\"\n    cv.notify_one(); // wake ~1 thread\n    // blocked on\
    \ cv\n}\n{\n    readyFlag = true; // make things \"ready\"\n    cv.notify_all();\
    \ // wake all threads\n    // blocked on cv (all but\n    // 1 will then block\
    \ on m)\n}\n```\n\nnotify_all moves all blocked threads from the condition variable\
    \ queue to the corresponding mutex queue.\n\nThe examples make no mention of a\
    \ mutex, because notifiers need not hold a mutex in order to signal a condition."
- md: "\n## Thread-Local Data\n\nVariables eligible for static storage duration may\
    \ be thread_local.\n\n- I.e., global/file/namespace-scoped vars; class-statics,\
    \ file.\n- thread_local std::string threadName; // e.g., at global or namespace\
    \ scope\nstatic thread_local std::chrono::microseconds timeUsed(0); // e.g., at\
    \ file scope\n\n```cpp\nvoid f(int x)\n{\n  static thread_local unsigned timesCalled;\n\
    \  ...\n}\nclass Widget {\nprivate:\n  thread_local static std::unordered_map<u::string,\
    \ int> cache;\n  ...\n};\n```\n\nThe threadName variable, for example, could be\
    \ set by the function that the thread is started running in (i.e., that's passed\
    \ to the std::thread constructor). \n\nThe standard does not require that unused\
    \ thread-locals be constructed, so under good implementations, threads should\
    \ provide for construction/destruction of only those thread-locals they use. This\
    \ is a difference from global objects, which must be constructed/destructed unless\
    \ the implementation can establish that they have no side effects.\n\n## Thread-Local\
    \ Data\n\nSome details:\n\n- thread_locals may be dynamically initialized.\n-\
    \ Their constructors may be arbitrarily complex.\n- thread_local may be combined\
    \ with extern.\n\n## Other Concurrency Features\n\n- Thread-safe initialization\
    \ of objects of static storage duration.\n- Thread-safe one-time function invocation\
    \ via std::call_once and std::once_flag.\n- Thread detachment when no join is\
    \ needed.\n- Separation of task setup and invocation via std::packaged_task.\n\
    - Support for mutex and lock UDTs via standard interfaces.\n- Atomic types (e.g.,\
    \ std::atomic<int>) with memory ordering operations.\n- Operations on current,\
    \ e.g., yield and sleep.\n- Query number of hardware-supported threads.\n- Library\
    \ thread safety guarantees (e.g., for std::cin/std::cout, STL containers, std::shared_ptr,\
    \ etc.)\n- Many other features for threads, locks, condition variables, etc.\n\
    - This is an overview.\n\nThere is also a standard API for getting at the platform-specific\
    \ handles behind threads.\n\n\"UDT\" = \"User Defined Type\".\n\nThe best way\
    \ to find C++'s library thread safety guarantees is to search draft standard chapters\
    \ 17pp for \"data race\". Relevant sections of N3290 are 17.6.5/9 (general rules),\
    \ 18.6.1/4 (memory allocators), 23.2.2 and 21.4/3 (STL containers and string),\
    \ and 27.4.1/4 (stacks). Sometimes have to read between the lines, e.g., 17.6.5/7\
    \ of N3290 is, I believe, the standard's way of stating reference count operations\
    \ (e.g., in shared_ptr, promise, shared_future, etc.) must be threadsafe.\n\n\
    ## Concurrency Support Summary\n\n- Threads run callable objects, support joining\
    \ and detaching.\n- Callers must avoid argument lifetime problems.\n- std::async\
    \ and futures support asynchronous calls.\n- Mutexes may de timeouts or recursion;\
    \ typical use is via locks.\n- std::lock_guard often suffices, std::unique_lock\
