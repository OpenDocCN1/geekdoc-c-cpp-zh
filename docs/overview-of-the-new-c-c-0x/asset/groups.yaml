- md: "\n## weak_ptr\n\n- Also to facilitate cyclic structures that would otherwise\
    \ foil RC:\n  ➡ reassigning the red pointer, then later the blue one.\n\n![](img/68a90f505054116271758fb914871a74_146_0.png)\n\
    \nUsing *shared_ptrs*, we have an uncollectable cycle after both pointers are\
    \ reassigned.\nUsing a raw back pointer, ObjectB has no way to tell its raw pointer\
    \ dangles after the red pointer is assigned. (The blue pointer keeps ObjectB alive\
    \ and referenceable.) Using *weak_ptr* as a back pointer, ObjectB can detect if\
    \ its back pointer dangles.\n\n“RC” = “Reference Count”.\n\n## weak_ptr\n\nweak_ptrs\
