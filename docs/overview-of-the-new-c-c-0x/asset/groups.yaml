  - '[PAGE 33]


    # # nullptr


    A new keyword. Indicates a null pointer.


    +   - Convertible to any pointer type and to bool, but nothing else.

    - Can''t be used as an integral value.


    ```

    const char *p = nullptr;      // p is null

    if (p) ...                               // code compiles, test fails

    int i = nullptr;               // error!

    ```


    Traditional uses of 0 and NULL remain valid:


    ```

    int *p1 = nullptr;      // p1 is null

    int *p2 = 0;                   // p2 is null

    int *p3 = NULL;                // p3 is null

    if (p1 == p2 && p1 == p3)      // code compiles, test succeeds

    ```


    The term “keyword” is stronger than “reserved word.” Keywords are unconditionally
    reserved (except as attribute names, sigh), while, e.g., “main” is reserved only
    when used as the name of a function at global scope.


    The type of nullptr is std::null_t. Other pointer types may be cast to this type
    via static_cast (or C-style cast). The result is always a null pointer.'
