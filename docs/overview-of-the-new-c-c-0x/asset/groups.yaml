- md: "\n# Overview of The New C++ (C++0x)\n\n![](img/68a90f505054116271758fb914871a74_0_0.png)\n\
    \n# Overview of the New C++ (C++0x)\n\nArtima Press is an imprint of Artima, Inc.\n\
    P.O. Box 305, Walnut Creek, California 94597\n\nCopyright © 2010 Scott Meyers.\
    \ All rights reserved.\n\nFirst version published April 5, 2010\nThis version\
    \ published April 30, 2011\nProduced in the United States of America\n\nCover\
    \ photo by Stephan Jockel. Used with permission.\n\nNo part of this publication\
