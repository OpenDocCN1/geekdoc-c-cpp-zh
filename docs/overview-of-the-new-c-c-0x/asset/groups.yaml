    \ be called, can't have their address taken, can't be used in a sizeof expression,\
    \ etc.\n\nTemplate functions may be deleted. For example, this is how construction\
    \ from rvalues is prevented by std::reference_wrapper (e.g., as returned from\
    \ std::ref).\n\nA virtual function may be deleted, but if it is, all base and\
    \ derived versions of that virtual must also be deleted. That is, either all declarations\
    \ of a virtual in a hierarchy are deleted or none are.\n\n## delete Functions\n\
    \nNot limited to member functions.\n\n- Another common application: control argument\
