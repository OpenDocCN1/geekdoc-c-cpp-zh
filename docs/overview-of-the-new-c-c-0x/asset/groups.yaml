    \ Copy operations (copy constructor, copy assignment)\n  - Only if move operations\
    \ not-declared.\n\n- Move operations (move constructor, move assignment)\n  -\
    \ Only if copy operations not-declared.\n\n## default Functions\n\nGenerated versions\
    \ are:\n\n- Public\n- Inline\n- Non-explicit\n\ndefaulted member functions have:\n\
    \n- User-specified declarations with the usual compiler-generated implementations.\n\
    \n## default Functions\n\nTypical use: “unsuppress” implicitly-generated functions:\n\
    \n```cpp\nclass Widget {\npublic:\n    Widget(const Widget&);    // copy ctor\
    \ prevents implicitly-\n                                declared default ctor\
    \ and\n                               // move ops\n\n    Widget() = default; \
    \        // declare default ctor, use\n                               // default\
    \ impl.\n\n    Widget(Widget&&) = default;  // declare move ctor, use\n      \
    \                           // default impl.\n\n    ...\n};\n```\n\n## default\
    \ Functions\n\nOr change “normal” accessibility, explicitness, virtualness:\n\n\
    ```cpp\nclass Widget {\npublic:\n    virtual ~Widget() = default; // declare as\
    \ virtual\n    explicit Widget(const Widget&) = default; // declare as explicit\n\
    private:\n    Widget& operator=(Widget&&) = default; // declare as private\n```\n"
  mdcn: "\n\n## 构造与完美转发\n\n构造函数通常将参数拷贝到数据成员：\n\n```cpp\nclass Widget {\npublic:\n\
    \    Widget(const std::string& n, const std::vector<int>& c)\n        : name(n),\
    \ // 将 n 拷贝到 name\n          coordinates(c) // 将 c 拷贝到 coordinates\n    ...\n\
    private:\n    std::string name;\n    std::vector<int> coordinates;\n};\n```\n\n\
    ## 构造与完美转发\n\n对于右值参数，移动语义会更优：\n\n```cpp\nstd::string lookupName(int id);\nint\
    \ widgetID;\n..\n```\n\n```cpp\nstd::vector<int> tempVec; // 仅用于 Widget 构造函数\n\
    ...\n```\n\n```cpp\nWidget w(lookupName(widgetID), // 右值参数，但 Widget\nstd::move(tempVec));\
    \ // 将拷贝到成员\n```\n\n为为左值/右值组合重载 Widget 构造函数 → 需要 4 个函数。\n\n- 通常情况下，n 个参数需要 2ⁿ\
    \ 种重载。\n- 对于较大的 n 来说是不切行的。\n- 对于较小的 n 来说是枯燥/重复/容易出错。\n\n## 构造与完美转发\n\n目标：一个能“做正确的事”的函数；\n\
    \n- 拷贝左值参数，移动右值参数。\n\n解决方案是使用完美转发构造函数：\n\n- 模板构造函数，将 T&&& 参数转发给成员：\n\n```cpp\n\
    class Widget {\npublic:\n    template<typename T1, typename T2>\n    Widget(T1&&\
    \ n, T2& c)\n        : name(std::forward<T1>(n)), // 将 n 转发到 string 构造函数\n   \
    \       coordinates(std::forward<T2>(c)) // 将 c 转发到 vector 构造函数\n    ...\nprivate:\n\
    \    std::string name;\n    std::vector<int> coordinates;\n};\n```\n\n> © 2011\
    \ Scott Meyers，保留所有权利。\n\n正如后面的幻灯片所示，它的行为与非模板构造函数并不完全，因为完美转发并不完美。\n\n## 构造之外的完美转发\n\
    \n再次：\n\n- 一个将 T&& 参数转发给成员的模板构造函数：\n```cpp\nclass Widget {\npublic:\n    template<typename\
    \ T1, typename T2>\n    Widget(T1&& n, T2&& c)\n        : name(std::forward<T1>(n)),\
    \      // 将 n 转发到 string 构造函数\n          coordinates(std::forward<T2>(c)) // 将\
    \ c 转发到 vector 构造函数\n{}\n\nprivate:\n    std::string name;\n    std::vector<int>\
    \ coordinates;\n};\n```\n\n效果：\n\n- 传递给 n 的左值 -> std::string 构造函数接收左值。\n- 传递给\
    \ n 的右值 -> std::string 构造函数接收右值。\n- c 和 std::vector 构造函数同样如此。\n\n## 构造之外的完美转发\n\
    \n不仅用于构造，例如 setter：\n\n```cpp\nclass Widget {\npublic:\n  // 修改后的\n  // 示例\n \
    \ template<typename T>\n  void setName(T&& name) // 转发\n  { name = std::forward<T>(name);\
    \ } // 新\n  template<typename T>\n  void setCoords(T&& newCoords) // 转发\n  { coordinates\
    \ = std::forward<T>(newCoords); } // newCoords\n\nprivate:\n  std::string name;\n\
    \  std::vector<int> coordinates;\n};\n```\n\n正如后面的幻灯片所示，它的行为与非模板 setter并不完全，因为完美转发并不完美。\n\
    \n## 构造之外的完美转发\n\n尽管使用了 T&&& 参数，代码仍然是完全类型安全的：\n\n- 类型兼容性在实例化时进行验证。\n  - 例如，在 setName\
    \ 中只有与 std::string 兼容的类型是有效的。\n\n比带类型的参数更灵活。\n\n- 接受/转发所有兼容的参数类型。\n  - 例如，setName\
    \ 接受 std::string, char*, const char*。\n\n## 新 C++ (C++0x) 概览\n\n## 构造之外的完美转发\n\
    \n可以通过 `static_assert` 移除灵活性（稍后描述）：\n\n```cpp\ntemplate<typename T>\nvoid setName(T&\
    \ newName)\n{\n    static_assert(std::is_same<std::decay<T>::type, std::string>::value,\n\
    \"T 必须是 [const] std::string\");\n    name = std::forward<T>(newName);\n}\n```\n\
    \n对于非数组和非函数类型，`std::decay<T>::type` 等于 `std::remove_cv<std::remove_reference<T>>::type::type`。\n\
    \n`static_assert` 尚未引入。\n\n也可以使用 `std::enable_if`，但在这种情况下 `static_assert` 似乎更简单更清晰。`std::enable_if`\
    \ 会将 setName 从重载集合移除，而 `static_assert` 只有在 setName 被选中为调用的重载后才会求值。\n\n## std::forward\n\
    \n再次考虑：\n\n```cpp\ntemplate<typename T>\nvoid setName(T& newName)\n{ name = std::forward<T>(newName);\
    \ }\n```\n\n- 引用（即 T 是 T&）⇒ 传递了左值给 setName\n  - std::forward<T>(newName) 应该返回左值。\n\
    - 非引用（即 T 是 T）⇒ 传递了右值给 setName\n  - std::forward<T>(newName) 应该返回右值。\n\n## 完美转发\n\
    \n- 仅适用于函数模板。\n- 在转发时保留左值/右值属性。\n完美转发并不真的完美。有几种类型的参数无法被完美转发，包括但不限于：\n\n- 指针常量\
    \ 0。\n- 函数模板名（例如 std::endl 和其他操纵符）。\n- 初始化列表。\n- 类内初始化的静态成员。\n- 位域。\n\n## 默认函数\n\
    \n如果使用，将隐含生成“特殊”成员函数：\n\n- 默认构造函数\n  - 仅当没有用户声明的构造函数时。\n\n- 析构函数\n  - 拷贝操作（拷贝构造函数、拷贝赋值）\n\
    \  - 仅当未声明移动操作时。\n\n- 移动操作（移动构造函数、移动赋值）\n  - 仅当未声明拷贝操作时。\n\n## 默认函数\n\n生成的版本为：\n\
    \n- 公\n- Inline\n- 非显式\n\n默认函数具有：\n\n- 用户指定的声明以及由编译器生成的实现。\n\n## 默认函数\n\n典型用法：“取消”隐式生成的函数：\n\
    \n```cpp\nclass Widget {\npublic:\n    Widget(const Widget&);    // 拷贝构造函数阻止了隐式\n\
    \                                声明的默认构造函数和\n                                移动操作\n\
    \n    Widget() = default;         // 默认构造函数，使用\n                             \
    \   默认实现。\n\n    Widget(Widget&&) = default;  // 移动构造函数，使用\n                 \
    \                 默认实现。\n\n    ...\n};\n```\n\n## 默认函数\n\n或者更改“正常的”访问权限、显式或虚属性：\n\
    \n```cpp\nclass Widget {\npublic:\n    virtual ~Widget() = default; // 声明为虚\n\
    \    explicit Widget(const Widget&) = default; // 声明为显式\nprivate:\n    Widget&\
    \ operator=(Widget&&) = default; // 声明为私有\n```\n\n"
