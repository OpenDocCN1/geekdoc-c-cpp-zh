    \ of the inherited constructor. If the Derived object is of static or thread storage\
    \ duration, its x and y data members would be initialized to zero.\n\n# Inheriting\
    \ Constructors\n\nDefault member initializers can mitigate the risk:\n\n```cpp\n\
    class Base { ... }; // as before\nclass Derived: public Base {\npublic:\n    using\
    \ Base::Base;\nprivate:\n    std::string name = \"Uninitialized\";\n    int x\
    \ = 0, y = 0;\n};\nDerived d(10); // d.name == \"Uninitialized\",\n// d.x == d.y\
    \ == 0\n```\n\n# Summary of Features for Class Authors\n\n- Rvalue references\
    \ facilitate move semantics and perfect forwarding.\n- `default` yields default\
    \ body for user-declared special functions.\n- `delete` makes declared functions\
    \ unusable.\n- All data members may have default initialization values.\n- Delegating\
    \ constructors call other constructors.\n- Inherited constructors come from base\
    \ classes.\n\n# Overview\n\n- Introduction\n- Features for Everybody\n- Library\
    \ Enhancements\n- Features for Class Authors\n- Features for Library Authors\n\
    - Yet More Features\n- Further Information\n\n# Static Assertions\n\nGenerate\
    \ user-defined diagnostics when compile-time tests fail:\n\n```cpp\nstatic_assert(sizeof(void)==sizeof(long),\n\
    \    \"Pointers and longs are different sizes\");\n```\n\nValid anywhere a declaration\
    \ is:\n\n- Global/namespace scope.\n- Class scope.\n- Function/block scope.\n\n\
    # Static Assertions\n\nEspecially useful with templates:\n\n```cpp\ntemplate<typename\
    \ T>\nvoid f(const T& obj)\n{\n    static_assert(std::is_base_of<Widget,T>::value,\n\
    \                  \"T doesn't inherit from Widget\");\n    ...\n}\ntemplate<short\
    \ val>\nclass Gadget {\n    static_assert(1 <= val && val <= 10,\n           \
    \       \"val out of range (must be 1-10)\");\n    ...\n};\n```\n\n# Static Assertions\n\
    \nDiagnostics may be any kind of string literal:\n\n```cpp\nstatic_assert(CHAR_BIT\
    \ == 8,                 // ordinary\n                \"chars don't have 8 bits\
    \ \\u2620\"); // string\n```\n\n```cpp\nstatic_assert(CHAR_BIT == 8,         \
    \        // wide string\n                L\"chars don't have 8 bits \\u2620\"\
    );\n```\n\n```cpp\nstatic_assert(CHAR_BIT == 8,                 // UTF-8\n   \
    \             u8\"chars don't have 8 bits \\u2620\");\n```\n\n```cpp\nstatic_assert(CHAR_BIT\
    \ == 8,                 // UTF-16\n                u16\"chars don't have 8 bits\
    \ \\u2620\");\n```\n\n```cpp\nstatic_assert(CHAR_BIT == 8,                 //\
    \ UTF-32\n                u32\"chars don't have 8 bits \\u2620\");\n```\n\nRaw\
    \ string literals are also valid.\n\nCode point 2620 is the skull and crossbones\
    \ symbol (\\u2620).\n\nWhen a code point specified via an escape sequence is part\
    \ of a narrow string literal (e.g., the first example on this page), the resulting\
    \ string contains as many bytes as is needed for that code point. So representing\
    \ \\u2620 requires 2 bytes, then 2 bytes will be included as part of the narrow\
    \ string literal.\n\nSome static_assert conditions are self-explanatory, it may\
    \ be desirable to use them as the diagnostic message, i.e., to default the being\
    \ of the condition. Such behavior can be offered via a suitable macro:\n#define\
    \ STATIC_ASSERT(condition) static_assert(condition, #condition)\n\n# explicit\
    \ Conversion Functions\n\nexplicit now applicable to conversion functions:\n\n\
    ```cpp\nclass Widget {\npublic:\n    explicit Widget(int i); // C++98 and C++0x\n\
    \    ...\n    explicit operator std::string() const; // C++0x only\n};\n```\n\n\
    Behavior analogous to that of constructors:\n\n```cpp\nvoid fw(const Widget& w);\n\
    int i;\n\nfw(i); // error!\nfw(static_cast<Widget>(i)); // okay\nvoid fs(const\
    \ std::string& s);\nWidget w;\n...\nfs(w); // error!\nfs(static_cast<std::string>(w));\
    \ // okay\n```\n\nThis slide shows uses of static_cast, but other cast syntaxes\
    \ (i.e, C-style and functions-style) would behave the same way.\n\n# explicit\
    \ Conversion Functions\n\nexplicit operator bool functions treated specially.\n\
    \n- Implicit use okay when \"safe\" (i.e., in \"safe\")\n```cpp\ntemplate<typename\
    \ T>\nclass SmartPtr {\npublic:\n    ...\n    explicit operator bool() const;\n\
    };\nSmartPtr<int> p;\nif (p) // error\n```\n\nThis slide shows uses of static_cast,\
    \ but other cast syntaxes (i.e, C-style and functions-style) would behave the\
    \ same way.\n\n# Variadic Templates\n\nTwo kinds:\n- Template: hold variadic parameters.\n\
    - Function: hold corresponding parameters.\n\n```cpp\ntemplate<typename... Types>\
    \ // template parameter\nclass tuple;\n\ntemplate<class T, class... Args> // function\
    \ parameter\nshared_ptr<T>(Args... params);\n```\n\n# Parameter Packs\n\nManipulation\
    \ based on \"first\"“rest\" manipulation:\n\n- Primary operation is unpack via\
    \ ...\n\n```cpp\ntemplate<typename... Types>\nstruct Count;\ntemplate<typename\
    \ T, typename... Rest>\n...\n```\n\nCount purely an exercise; C++0x's sizeof...\
    \ does the same thing:\n\n```cpp\ntemplate<typename... Types>\nstruct VerifyCount{\n\
    \    static_assert(Count<Types...>::value == sizeof...(Types),\n    \"Count<T>::value\
    \ != sizeof...(T)\");\n};\n```\n"
  mdcn: "\n\n# 继承构造函数\n\n将构造函数继承到带有数据成员的类是有风险的：\n\n```cpp\nclass Base {\n  public:\n\
    \    explicit Base(int);\n};\nclass Derived : public Base {\n  public:\n    using\
    \ Base::Base;\n  private:\n    std::u16string name;\n    int x, y;\n};\n```\n\n\
    ```cpp\nDerived d(10);\n// 可以编译，但 d.name 被\n// 默认初始化，且\n// d.x 和 d.y 未初始化\n```\n\
    \n说 `Derived::x` 和 `Derived::y` 未初始化并不完全准确。相反，它们被处理为未在继承构造函数的成员初始化列表中提及。如果 `Derived`\
    \ 对象具有静态或线程存储生存期，则其 x 和 y 数据成员将被初始化为零。\n\n# 继承构造函数\n\n默认成员初始化可以缓解这种风险：\n\n```cpp\n\
    class Base { ... }; // 如前所示\nclass Derived: public Base {\npublic:\n    using\
    \ Base::Base;\nprivate:\n    std::string name = \"Uninitialized\";\n    int x\
    \ = 0, y = 0;\n};\nDerived d(10); // d.name == \"Uninitialized\",\n// d.x == d.y\
    \ == 0\n```\n\n# 类作者特性总结\n\n- 右值引用促进了移动语义和完美转发。\n- `default` 为用户声明的特殊函数产生默认函数体。\n\
    - `delete` 使声明的函数不可用。\n- 所有数据成员都可以有默认初始化值。\n- 委托构造函数调用其他构造函数。\n- 继承的构造函数来自基类。\n\
    \n# 概述\n\n- 引言\n- 适用于所有人的特性\n- 库增强\n- 类作者特性\n- 库作者特性\n- 更多特性\n- 进一步信息\n\n# 静态断言\
    \ (Static Assertions)\n\n当编译时测试失败时生成用户定义的诊断：\n\n```cpp\nstatic_assert(sizeof(void)==sizeof(long),\n\
    \    \"指针和长整型的大小不同\");\n```\n\n在任何声明的地方均有效：\n\n- 全局/命名空间作用域。\n- 类作用域。\n- 函数/块作用域。\n\
    \n# 静态断言\n\n在模板中特别有用：\n\n```cpp\ntemplate<typename T>\nvoid f(const T& obj)\n\
    {\n    static_assert(std::is_base_of<Widget,T>::value,\n                  \"T\
    \ 没有继承自 Widget\");\n    ...\n}\ntemplate<short val>\nclass Gadget {\n    static_assert(1\
    \ <= val && val <= 10,\n                  \"val 超出范围（必须是1-10)\");\n    ...\n};\n\
    ```\n\n# 静态断言\n\n诊断信息可以是任何类型的字符串字面量：\n\n```cpp\nstatic_assert(CHAR_BIT == 8, \
    \                // 普通字符\n                \"chars没有8位比特 \\u2620\"); // 字符串\n```\n\
    \n```cpp\nstatic_assert(CHAR_BIT == 8,                 // 宽字符串\n             \
    \   L\"chars没有8位比特 \\u2620\");\n```\n\n```cpp\nstatic_assert(CHAR_BIT == 8,  \
    \               // UTF-8\n                u8\"chars没有8位比特 \\u2620\");\n```\n\n\
    ```cpp\nstatic_assert(CHAR_BIT == 8,                 // UTF-16\n             \
    \   u16\"chars没有8位比特 \\u2620\");\n```\n\n```cpp\nstatic_assert(CHAR_BIT == 8,\
    \                 // UTF-32\n                u32\"chars没有8位比特 \\u2620\");\n```\n\
    \n原始字符串字面量也是有效的。\n\n代码点 2620 是骷髅交叉骨头符号 (\\u2620)。\n\n当通过转义序列指定的代码点是窄字符串字面量的一部分（例如本页上的第一个示例）时，生成的字符串包含该代码点所需的字节数。因此，表示\
    \ \\u2620 需要 2 个字节，那么 2 个字节将作为窄字符串字面量的一部分包含。\n\n某些 `static_assert` 条件是自言自语的，可能希望将其作为诊断信息，即将条件本身作为默认信息。这种行为可以通过合适的宏提供：\n\
    #define STATIC_ASSERT(condition) static_assert(condition, #condition)\n\n# 显式转换函数\n\
    \n`explicit` 现在适用于转换函数：\n\n```cpp\nclass Widget {\npublic:\n    explicit Widget(int\
    \ i); // C++98 和 C++0x\n    ...\n    explicit operator std::string() const; //\
    \ 仅限 C++0x\n};\n```\n\n行为类似于构造函数：\n\n```cpp\nvoid fw(const Widget& w);\nint i;\n\
    \nfw(i); // 错误！\nfw(static_cast<Widget>(i)); // 可以\nvoid fs(const std::string&\
    \ s);\nWidget w;\n...\nfs(w); // 错误！\nfs(static_cast<std::string>(w)); // 可以\n\
    ```\n\n此幻灯片展示了 `static_cast` 的用法，但其他转换语法（即 C 风格和函数风格）的行为将相同。\n\n# 显式转换函数\n\n`explicit\
    \ operator bool` 函数被特殊对待。\n\n- 当“安全”时允许隐式使用（即在“安全”的环境文中）\n```cpp\ntemplate<typename\
    \ T>\nclass SmartPtr {\npublic:\n    ...\n    explicit operator bool() const;\n\
    };\nSmartPtr<int> p;\nif (p) // 错误\n```\n\n此幻灯片展示了 `static_cast` 的用法，但其他转换语法（即\
    \ C 风格和函数风格）的行为将相同。\n\n# 可变模板\n\n两种类型：\n- 模板：持有可变参数。\n- 函数：持有对应的参数。\n\n```cpp\n\
    template<typename... Types> // 模板参数\nclass tuple;\n\ntemplate<class T, class...\
    \ Args> // 函数参数\nshared_ptr<T>(Args... params);\n```\n\n# 参数包\n\n基于“第一个”“剩余”的操作：\n\
    \n- 主要操作是通过 ... 进行解包\n\n```cpp\ntemplate<typename... Types>\nstruct Count;\ntemplate<typename\
    \ T, typename... Rest>\n...\n```\n\n`Count` 纯粹是一个练习；C++0x 的 `sizeof...` 执行相同的操作：\n\
    \n```cpp\ntemplate<typename... Types>\nstruct VerifyCount{\n    static_assert(Count<Types...>::value\
    \ == sizeof...(Types),\n    \"Count<T>::value != sizeof...(T)\");\n};\n```\n\n"
