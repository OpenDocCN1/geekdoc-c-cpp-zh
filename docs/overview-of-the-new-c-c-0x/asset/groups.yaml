- md: "\n## forward_list\n\nA singly-linked list.\n\n- Declared in <forward_list>\n\
    - Goal: zero time/space overhead compared to hand-written C.\n- STL container\
    \ conventions sacrificed to achieve goal:\n  - insert_after/emplace_after/erase_after\
    \ instead of insert/erase.\n  - Normal “insert/emplace/erase before” behavior\
    \ costly.\n\n![](img/68a90f505054116271758fb914871a74_159_0.png)\n\n- before_begin\
    \ returns iterator preceding *begin.\n  - Needed to insert/emplace/erase at front\
    \ of list.\n- Does not store size or end (footprint) or run in O(n) time (surprising!)\n\
    - Offers only forward iterators.\n\nHaving iterators point to the node prior to\
    \ the one referenced allow for an interface that was more like the rest of the\
    \ STL, but at the cost of additional indirection dereference, something contrary\
    \ to the goal of as-good-as-hand-written-C performance.\n\nIterator invalidation\
    \ rules for forward_list are essentially the same as for list: insertions invalidate\
    \ nothing, erasures invalidate only iterators to erased elements.\n\n## forward_list\n\
    \nExample:\n\n```cpp\n#include <forward_list>\n#include <algorithm>\nstd::forward_list<int>\
    \ fli { 1, 2, 3, 4, 5 };\nauto it = std::find(fli.begin(), fli.end(), 3);\nfli.erase(it);\
    \ // error! no erase\n--it; // error! forward iterator\nfli.erase_after(it); //\
    \ fli = 1, 2, 3, 5\nfli.push_back(10); // error! no push back\nfli.push_front(0);\
    \ // fli = 0, 1, 2, 3, 5\nfli.erase_after(fli.before_begin()); // fli = 1, 2,\
    \ 3, 5\n```\n\n## From TR1: Hash Tables\n\n- Declared in <unordered_set> and <unordered_map>.\n\
    - Default hashing functionality declared in <functional>.\n- Designed not to conflict\
    \ with pre-TR1/C++0x implementations.\n- I.e., hash_set, hash_map, hash_multiset,\
    \ hash_multimap.\n- Interfaces vary – hence the need for standardization.\n- Standard\
    \ names are unordered_set, unordered_map, etc.\n- Compatible with hash_* interfaces\
    \ where possible.\n- Each bucket has its own chain of elements:\n\n![](img/68a90f505054116271758fb914871a74_161_0.png)\n\
    \n- Bucket count can change dynamically.\n\n## Containers’ Characteristics\n\n\
    - Usual members exist:\n  - iterator/const_iterator and other typedefs.\n  - begin/end/cbegin/cend,\
    \ insert/erase, size, swap, etc.\n- Also 3 associative container functions: find,\
    \ count, equal_range.\n  - lower_bound/upper_bound are absent.\n- unordered_map/unordered_multimap\
    \ offer operator[] and at.\n- Most relationals not supported: <, <=, >=, >\n \
    \ - Indeterminate ordering makes these too expensive.\n  - == and != do exist:\
    \ result based on content, not ordering.\n    - Expected complexity O(n); worse-case\
    \ is O(n²).\n- Only forward iteration is provided.\n  - No reverse_iterators,\
    \ no begin/rend/crbegin/crend.\n\nWhen equal_range finds no elements, it returns\
    \ (container.end(), container.end()). This makes it a bit easier to swallow the\
    \ failure to include upper_ and lower_bound in the containers’ interfaces.\n\n\
    ## Hash Table Parameters\n\nHashing and equality-checking types are template parameters:\n\
    \n```cpp\ntemplate<class Value,\n  class Hash = std::hash<Value>,\n  class Pred\
    \ = std::equal_to<Value>,\n  class Alloc = std::allocator<Value>>\nclass unordered_set\
    \ { ... };\n\ntemplate<class Key,\n  class T,\n  class Hash = std::hash<Key>,\n\
    \  class Pred = std::equal_to<Key>,\n  class Alloc = std::allocator<std::pair<const\
    \ Key, T>>>\nclass unordered_map { ... };\n```\n\n## Hashing Functions\n\nDefaults\
    \ are provided for built-in, string, and smart pointer types:\n\n```cpp\nclass\
    \ Widget { ... };\nstd::unordered_set<int> si; // all use default hash\nstd::unordered_multiset<double>\
    \ md; // func for custom types\nstd::unordered_map<std::string, int> mwi;\nstd::unordered_multimap<Widget*,\
    \ std::string> mm1;\nstd::unordered_multimap<std::unique_ptr<Widget>, std::string>\
    \ mm2;\n```\n\nAlso for these less commonly used types:\n\n- std::set<bool>\n\
    - std::bitset\n- std::thread::id\n- std::error_code\n- std::type_index\n\nKeys\
    \ in associative containers (both ordered and unordered) are immutable; modifying\
    \ elements in an associative container yields undefined behavior. Changing a key\
    \ could affect the sort order (for sorted containers) or the hashed location (for\
    \ unordered containers).\n\nIn syserr.code.overview (19.5.2.1/N3290), C++0x describes\
    \ std::error_code this way: \"The error_code describes an object used to hold\
    \ error code values, such as those originating from the operating system or other\
    \ low-level application interfaces. ... Class error_code is an adjunct to error\
    \ reporting by exception.\"\n\nstd::type_index is a wrapper for std::type_info\
    \ objects that's designed for storage in associative containers (ordered or unordered).\n\
    \n## Hashing Functions\n\nTo override a default or hash a UDT, specialize hash<T>\
    \ or create a custom functor:\n\n```cpp\ntemplate<>\nstruct std::hash<Widget>:\
    \ public std::unary_function<Widget, std::size_t> {\n  std::size_t operator()(const\
    \ Widget& w) const { ... };\n};\nstd::unordered_set<Widget> sw;\n```\n\n```cpp\n\
    struct IntHasher: public std::unary_function<int, std::size_t> {\n  std::size_t\
    \ operator()(int i) const { ... };\n};\n```\n\n```cpp\nstd::unordered_map<int,\
    \ std::string, IntHasher> mis;\n```\n\nstd::unordered_map<int, std::string, IntHasher>\
    \ mis;\n\nUDT = \"User Defined Type\".\n\nFunction pointers can be used.\n\n##\
    \ Operations for Bucket Count and Load Factor\n\nConstructors allow for specifying\
    \ the bucket count and load factor:\nstd::unordered_set<int> s1(53); // B=53\n\
    \nA table's load factor (z) is the average number of elements/bucket:\n- z = container.size()/B.\n\
    - z can be queried:\n  float z = s1.load_factor(); // get load factor\nfloat z_max\
    \ = s1.max_load_factor(); // get max_factor (defaults to 1)\n\ns1.max_load_factor(0.75f);\
    \ // request z;\n\nEmpty buckets are included in an unordered container's load\
    \ calculation.\n\n## Rehashing\n\nExplicit rehashing can also change the bucket\
    \ count and load factor.\n\n- Specify number of desired buckets by rehash.\n-\
    \ Specify number of expected elements by reserve.\n\n```cpp\nstd::unordered_set<int>\
    \ s;\n...\nauto newB = computeNewB();\ns.rehash(newB); // reorganize s so that\
    \ B >= newB\n// and as s.size()/B <= z_max\n```\n\n```cpp\nauto expElems = computeExpectedElements();\n\
    s.reserve(expElems); // reorganize s so that expElems/B <= z_max\n```\n\nRehashing\
    \ (implicitly or explicitly) invalidates iterators.\n\n- But not pointers or references.\n\
    \nFrom what I can tell from the iterator invalidation rules, rehashing can happen\
    \ when insert or rehash is called.\n\nFor multi containers, rehashing preserves\
    \ the relative order of equivalent elements.\n\n## Iterating Over Bucket Contents\n\
    \nUseful for e.g., monitoring performance of hashing functions.\n\n```cpp\nstd::unordered_set<std::string>\
    \ s;\n...\n```\n\n```cpp\nauto numBuckets = s.bucket_count(); // buckets\nfor\
    \ (std::size_t b = 0; b < numBuckets; ++b) {\n    std::cout << \"Bucket \" <<\
    \ b << \" \" << s.bucket_size(b); // elems in b\n    std::copy(s.cbegin(b), s.cend(),\
    \ // iters for bucket b\n              std::ostream_iterator<std::string>(std::cout,\
    \ \" \"));\n\n    std::cout << '\\n';\n}\n```\n\n## Hash Tables Summary\n\n* Unordered\
    \ containers based on hash tables with open hashing.\n* Only forward iteration\
    \ is supported.\n* Maximum load factor can be dynamically altered.\n* There is\
    \ support for iterating over individual buckets.\n\n## From TR1: Tuples\n\nMotivation:\n\
    \n- pair should be generalized.\n- Tuple utility demonstrated by other languages.\n"
  mdcn: "\n\n## forward_list\n\n单向链表。\n\n- 声明在 <forward_list> 中\n- 目标：与手写的 C 语言相比，零时间/空间开销。\n\
    - 为了实现这一目标，牺牲了 STL 容器规范：\n  - 使用 insert_after/emplace_after/erase_after 代替 insert/erase。\n\
    \  - 正常的 “insert/emplace/erase before” 行为代价高昂。\n\n![](img/68a90f505054116271758fb914871a74_159_0.png)\n\
    \n- before_begin 返回指向 *begin* 之前的迭代器。\n  - 用于在列表头部进行插入/构造/删除操作。\n- 不存储大小（size）或末尾节点（end）（内存占用），且运行时间为\
    \ O(n)（这令人惊讶！）。\n- 仅提供前向迭代器。\n\n让迭代器指向所引用节点之前的节点，可以提供一种更像 STL 其他部分的接口，但其代价是增加了额外的间接解引用，这与达到等同手写\
    \ C 语言性能的目标相悖。\n\nforward_list 的迭代器失效规则与 list 基本相同：插入不会使任何迭代器失效，删除只会使指向被删除元素的迭代器失效。\n\
    \n## forward_list\n\n示例：\n\n```cpp\n#include <forward_list>\n#include <algorithm>\n\
    std::forward_list<int> fli { 1, 2, 3, 4, 5 };\nauto it = std::find(fli.begin(),\
    \ fli.end(), 3);\nfli.erase(it); // ！没有 erase\n--it; // 错误！前向迭代器\nfli.erase_after(it);\
    \ // fli = 1, 2, 3, 5\nfli.push_back(10); // ！没有 push back\nfli.push_front(0);\
    \ // fli = 0, 1, 2, 3, 5\nfli.erase_after(fli.before_begin()); // fli = 1, 2,\
    \ 3, 5\n```\n\n## 来自 TR1: 哈希表\n\n- 声明在 <unordered_set> 和 <unordered_map> 中。\n\
    - 默认哈希功能声明在 <functional> 中。\n- 设计为不与预-TR1/C++0x 实现冲突。\n- 即 hash_set, hash_map,\
    \ hash_multiset, hash_multimap。\n- 接口各异——因此需要标准化的。\n- 标准名称为 unordered_set, unordered_map\
    \ 等。\n- 尽可能与 hash_* 接口兼容。\n- 每个桶（bucket）都有自己的元素链：\n\n![](img/68a90f505054116271758fb914871a74_161_0.png)\n\
    \n- 桶的数量可以动态变化。\n\n## 容器的特性\n\n- 存在常规成员：\n  - iterator/const_iterator 以及其他类型定义（typedef）。\n\
    \  - begin/end/cbegin/cend, insert/erase, size, swap 等。\n- 还有 3 个关联容器函数：find,\
    \ count, equal_range。\n  - 缺少 lower_bound/upper_bound。\n- unordered_map/unordered_multimap\
    \ 提供了 operator[] 和 at。\n- 大多数关系运算符不支持：<, <=, >=, >\n  - 不定的排序使得这些操作代价过高。\n  -\
    \ 存在 == 和 !=：结果基于内容而非排序。\n    - 预期复杂度为 O(n)；最坏情况为 O(n²)。\n- 仅提供前向迭代。\n  - 没有反向迭代器（reverse_iterators），没有\
    \ begin/rend/crbegin/crend。\n\n当 equal_range 未找到任何元素时，它返回 (container.end(), container.end())。这使得无法将\
    \ upper_bound 和 lower_bound 纳入容器接口的情况变得稍微容易接受。\n\n## 哈希表参数\n\n哈希和等性检查类型是模板参数：\n\
    \n```cpp\ntemplate<class Value, class Hash = std::hash<Value>, class Pred = std::equal_to<Value>,\
    \ class Alloc = std::allocator<Value>>\nclass unordered_set;\n\ntemplate<class\
    \ Key, class T, class Hash = std::hash<Key>, class Pred = std::equal_to<Key>,\
    \ class Alloc = std::allocator<std::pair<const Key, T>>>\nclass unordered_map;\n\
    ```\n\n哈希和等性检查类型是模板参数：\n\n```cpp\ntemplate<class Value, class Hash = std::hash<Value>,\
    \ class Pred = std::equal_to<Value>, class Alloc = std::allocator<Value>>\nclass\
    \ unordered_set;\n```\n。这使得无法将 upper_bound 和 lower_bound 纳入容器接口的情况变得稍微容易接受。\n\n\
    当 equal_range 未找到任何元素时，它返回 (container.end(), container.end())。这使得无法将 upper_bound\
    \ 和 lower_bound 纳入容器接口的情况变得稍微容易接受。\n\n哈希和等性检查类型是模板参数：\n\n"
