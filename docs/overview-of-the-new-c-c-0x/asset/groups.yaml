- md: "\n## TR1 Tuples\n\n- tuple declared in <tuple>, helper templates in <utility>.\n\
    - Offers fixed-size heterogeneous “containers\":\n  - Fixed-size ⇒ no dynamic\
    \ memory ⇒ no allocator.\n\n```cpp\nclass Name { ... };\nclass Address { ... };\n\
    class Date { ... };\n\nstd::tuple<Name, Address, Date> // function to return\n\
    employeeInfo(unsigned employeeID); // employee name,\n...\\ // address, hire date\n\
    \nunsigned eid;\n...\n\nstd::tuple<Name, Address, Date> // initialize tuple with\n\
    info(employeeInfo(eid)); // value from\nemployeeInfo\n```\n\n\"Containers\" is\
    \ in quotes, because tuple doesn’t, in general, adhere to the container interface.\n\
    \n## get\n\nTuple elements are accessed via get:\n\n- Takes a compile-time index;\
    \ indices start at 0:\n  - Name empName(std::get<0>(info));\n  - Address empAddr(std::get<1>(info));\n\
    \  - Date empHDate(std::get<2>(info));\n\n- A compile-time index!\n  - get is\
    \ a template, and the index is a template argument.\n  - int nameIdx = 0;\n  -\
    \ Name empName(std::get<nameIdx>(info)); // error;\n  - for/do/while loops over\
    \ tuple contents aren’t possible.\n\nTMP can be used to generate code to iterate\
    \ over the contents of a tuple.\n\n## get\n\nUsing named indices makes for more\
    \ readable code:\n\n```cpp\nenum { EmpName, EmpAddr, EmpHireDate };\nName empName(std::get<EmpName>(info));\n\
    Address empAddr(std::get<EmpAddr>(info));\nDate empHireDate(std::get<EmpHireDate>(info));\n\
    ```\n\n## tie\n\ntie can perform the work of multiple gets:\n\n```cpp\nstd::tie(empName,\
    \ empAddr, empHDate) = // assign to all 3\n               employeeInfo(eid); \
    \     // variables\n```\n\nignore can be used within tie to get only selected\
    \ elements:\n\n```cpp\nstd::tie(empName, empAddr, std::ignore) = // assign only\
    \ name\n               employeeInfo(eid);      // and address\n```\n\n```cpp\n\
    std::tie(std::ignore,\n           empAddr,\\                // assign address\
    \ only.\n           std::ignore) = employeeInfo(eid); // (Here, using get would\
    \ be easier.)\n```\n\nstd::tie can be used with std::pair objects, because std::tie\
    \ returns a tuple, and std::tuple has\na constructor that takes a std::pair:\n\
    \n```cpp\nstd::pair<Name, Address> empNameAddr(unsigned employeeID);\n```\n\n\
    ```cpp\nstd::tie(empName, empAddr) = empNameAddr(eid);\n```\n\n## make_tuple\n\
    \nA generalization of make_pair:\n\n```cpp\nclass Employee {\npublic:\n    Name\
    \ name() const;\n    Address address() const;\n    Date hireDate() const;\n  \
    \  ...\n};\n```\n\nEmployee findByID(unsigned eid);\n\n```cpp\nstd::tuple<Name,\
    \ Address, Date>\nemployeeInfo(unsigned employeeID)\n{\n    Employee e(findByID(employeeID));\n\
    \    return std::make_tuple(e.name(), e.address(), e.hireDate());\n}\n```\n\n\
    The final return statement in the example can't be written as\n`return { e.name(),\
    \ e.address(), e.hireDate() };`\n\nbecause the relevant tuple constructors are\
    \ either explicit (hence not usable here) or templates (also not usable here,\
    \ because templates can't deduce a type for brace initialization lists).\n\n##\
    \ Reflection\n\nThere's the support for compile-time reflection:\n\n```cpp\ntemplate<typename\
    \ Tuple>\nvoid someFunc(Tuple t)\n{\n    std::size_t numElems = // # elems\n \
    \   std::tuple_size<Tuple>::value; // in Tuple\n    typedef\n    typename std::tuple_element<0,\
    \ Tuple>::type // type of\n    FirstType; // 1st elem\n...}\n```\n\n## Other tuple\
    \ Functionality\n\nThe usual STL container relationals (<, <=, !=, >= >):\n\n\
    - == and != tests use elementwise ==\n\n- Other relational tests are lexicographical\
    \ using only <:\n- Values are considered equal if they're equivalent (based on\
    \ <)\n- pair<T1, T2> can often be used as tuple<T1, T2>:\n  - A 2-element tuple\
    \ can be created or assigned from compatible pair.\n  - get<0> and get<1> work\
    \ on pairs.\n  - So tuple_size and tuple_element.\n\n## Tuples Summary\n\n- Tuples\
    \ are a generalization of std::pair.\n- Element access via compile-time index\
    \ using get or tie.\n- Compile-time reflection is supported. It works on std::pairs,\
    \ too.\n\n## From Fixed-Size Arrays\n\nMotivation:\n\n- Built-in arrays aren't\
    \ STL containers:\n  - No begin, end, etc.\n  - They don't know their size.\n\
    \  - They decay into pointers.\n- vector imposes overhead:\n  - Dynamic memory\
    \ allocation.\n- STL container with performance of built-in arrays.\n\n## Fixed-Size\
    \ Arrays\n\n- Declared in <array>.\n- Offers conventional members: iterator/const_iterator/reverse_iterator\
    \ and begin/end/cbegin/cend, swap, relational operators.\n- Swap runs in linear\
    \ (not constant) time.\n- Also members: operator[], at, front, back layout-compatible\
    \ with C arrays (and vector).\n- Get a pointer to elements via data:\n\n```cpp\n\
    std::array<int, 5> arr; // create array\nint *p = arr.data(); // get pointer to\
    \ elements\n```\n\nFor std::array objects with a size of 0, results of invoking\
    \ data are “unspecified.”\n\n## Fixed-Size Arrays\n\nBecause arrays are fixed-size,\n\
    \n- No insert, push_back, erase, clear, etc.\n- No memory allocation. Hence no\
    \ allocator.\n\n## Aggregates\n\nA array is an aggregate, so:\n\n- No initializer\
    \ for built-in types ⇒ default initialization: stack or heap arrays ⇒ random values\n\
    std::array<int, 5> arr1; // if arr1 on stack or heap, element values undefined\n\
    For arrays with static duration ⇒ zeros:\nstd::array<int, 5> arr2; // if arr2\
    \ in static storage, element values are zero\n\n## Aggregates\n\n- Too few initializers\
    \ ⇒ remaining objects are value-initialized\n- UDTs with types initialized to\
    \ 0.\n- UDTs with constructors are default-constructed. members are value-initialized.\n\
    - UDTs without constructors: members are value-initialized.\n\n```cpp\nstd::array<short,\
    \ 5> arr3 { 1, 2, 3, 4, 5 };\nstd::array<int, 5> arr4{10, arr1[3], 30 }; // last\
    \ 2 values init'd to 0\nstd::array<float, 1> arr5 { 1, 2, 3, 4, 5 }; // error!\
    \ won't compile\n```\n\n- Too many initializers ⇒ error.\n\nValue initialization\
    \ is defined in [dcl.init] (8.5/7 of N3290).\n\n“UDT” = “User Defined Type”.\n\
    \n## Aggregates\n\nFor built-in types, no initializer ≠ few initializer values:\n\
    \n```cpp\nstd::array<int, 5> arr1; // no initializer:\n// - non on stack or heap\
    \ ⇒ random values\n// - static storage ⇒ all zeros\n\nstd::array<int, 5> arr2\
    \ {}; // too few initializers ⇒ use zeros\nstd::array<int, 5> arr3 = {}; // too\
    \ few initializers ⇒ use zeros\n```\n\nTypes with constructors always have constructors\
    \ called:\n\n```cpp\nclass Widget {\npublic:\n    explicit Widget(int = -1);\n\
    };\n```\n\n```cpp\nstd::array<Widget, 5> arr4; // construct all joints from -1\n\
    std::array<Widget, 5> arr5 {}; // construct all joints from 0\n```\n\nAll behavior\
    \ above is same as for built-in arrays.\n\nThe aggregate initialization rules\
    \ for std::arrays are the same as for built-in arrays.\n\n## Overview of the New\
    \ C++ (C++0x)\n\n## Aggregates\n\nBecause array is an aggregate:\n\n- All members\
    \ are public!\n- Only default, copy, and move construction is supported.\n- These\
    \ constructors are compiler-generated.\n- Range construction is unavailable:\n\
    \n```cpp\nstd::vector<int> v;\n...\nstd::array<int, 10> // error! array supports\
    \ only\narr(v.begin(), v.begin()+10); // default and copy construction\n```\n\n\
    Technically, aggregates may have non-public members that are static.\n\n## arrays\
    \ as Tuples\n\narray<T, n> can sometimes be treated like tuple<T, T, ..., T>:\n\
    \n```cpp\nclass Widget { ... };\nconst std::size_t arraySz = 10;\ntypedef std::array<Widget,\
    \ arraySz> WidgetArray;\nWidgetArray arr;                    // 10 Widgets default-constructed\n\
    ...\nstd::size_t numElements = std::tuple_size<WidgetArray>::value;\nstd::size_t\
    \ elemSize =\nsizeof(std::tuple_element<0, WidgetArray>::type);\nconst auto& value\
    \ = std::get<0>(arr);\nstd::cout << \"arr has \" << numElements\n          <<\
    \ \" elements, each of size \" << elemSize\n          << \". The first element's\
    \ value is \" << value\n          << \"\\n\";\n```\n"
  mdcn: "\n\n## TR1 元组 (Tuples)\n\n- 元组在 `<tuple>` 中声明，辅助模板在 `<utility>` 中。\n- 提供了固定大小的异构“容器”：\n\
    \  - 固定大小 ⇒ 无动态内存 ⇒ 无分配器。\n\n```cpp\nclass Name { ... };\nclass Address { ...\
    \ };\nclass Date { ... };\n\nstd::tuple<Name, Address, Date> // 用于返回的函数\nemployeeInfo(unsigned\
    \ employeeID); // 员工姓名，\n...\\ // 地址, 入职日期\n\nunsigned eid;\n...\n\nstd::tuple<Name,\
    \ Address, Date> // 初始化元组\ninfo(employeeInfo(eid)); // 使用来自\nemployeeInfo 的值\n\
    ```\n\n“容器”一词加了引号，是因为元组通常并不遵循容器接口。\n\n## get\n\n通过 `get` 访问元组元素：\n\n- 接受一个编译时索引；索引从\
    \ 0 开始：\n  - Name empName(std::get<0>(info));\n  - Address empAddr(std::get<1>(info));\n\
    \  - Date empHDate(std::get<2>(info));\n\n- 必须是编译时索引！\n  - `get` 是模板，且索引是模板参数。\n\
    \  - int nameIdx = 0;\n  - Name empName(std::get<nameIdx>(info)); // 错误；\n  -\
    \ 不支持对元组内容进行 for/do/while 循环。\n\n可以使用 TMP（模板元编程）生成遍历元组内容的代码。\n\n## get\n\n使用命名索引使代码更可读性：\n\
    \n```cpp\nenum { EmpName, EmpAddr, EmpHireDate };\nName empName(std::get<EmpName>(info));\n\
    Address empAddr(std::get<EmpAddr>(info));\nDate empHireDate(std::get<EmpHireDate>(info));\n\
    ```\n\n## tie\n\n`tie` 可以完成多个 `get` 的工作：\n\n```cpp\nstd::tie(empName, empAddr,\
    \ empHDate) = // 赋值给所有3个\n               employeeInfo(eid);      // 变量\n```\n\n\
    `ignore` 可以在 `tie` 中使用以仅获取选定的元素：\n\n```cpp\nstd::tie(empName, empAddr, std::ignore)\
    \ = // 仅赋值姓名\n               employeeInfo(eid);      // 和地址\n```\n\n```cpp\nstd::tie(std::ignore,\n\
    \           empAddr,\\                // 仅赋值地址。\n           std::ignore) = employeeInfo(eid);\
    \ // (这里使用 get 会更简单。)\n```\n\n`std::tie` 可以与 `std::pair` 对象一起，因为 `std::tie` 返回一个元组，而\
    \ `std::tuple` 有一个接受 `std::pair` 的构造函数：\n\n```cpp\nstd::pair<Name, Address> empNameAddr(unsigned\
    \ employeeID);\n```\n\n```cpp\nstd::tie(empName, empAddr) = empNameAddr(eid);\n\
    ```\n\n## make_tuple\n\n`make_pair` 的泛化：\n\n```cpp\nclass Employee {\npublic:\n\
    \    Name name() const;\n    Address address() const;\n    Date hireDate() const;\n\
    \    ...\n};\n```\n\nEmployee findByID(unsigned eid);\n\n```cpp\nstd::tuple<Name,\
    \ Address, Date>\nemployeeInfo(unsigned employeeID)\n{\n    Employee e(findByID(employeeID));\n\
    \    return std::make_tuple(e.name(), e.address(), e.hireDate());\n}\n```\n\n\
    示例中的最后一个返回语句不能写成：\n`return { e.name(), e.address(), e.hireDate() };`\n\n因为相关的元组构造函数要么是显式的（因此在此不可用），要么是模板（同样不可用，因为模板无法为大括号初始化列表推导出类型）。\n\
    \n## 反射 (Reflection)\n\n支持编译反射：\n\n```cpp\ntemplate<typename Tuple>\nvoid someFunc(Tuple\
    \ t)\n{\n    std::size_t numElems = // Tuple 中的\n    std::tuple_size<Tuple>::value;\
    \ // 元素数量\n    typedef\n    typename std::tuple_element<0, Tuple>::type // 第 1\
    \ 个元素的\n    FirstType; // 类型\n...}\n```\n\n## 其他元组功能\n\n通常的 STL 容器关系运算符 (<, <=,\
    \ !=, >= >)：\n\n- `==` 和 `!=` 使用逐元素的 `==`\n\n- 其他关系测试仅使用 `<` 进行字典序比较\n- 如果值是价的（基于\
    \ `<`），则被视为相等\n- `pair<T1, T2>` 经常可以当作 `tuple<T1, T2>` 使用：\n  - 可以从兼容的 pair 创建或赋值\
    \ 2元素元组。\n  - `get<0>` 和 `get<1>` 可作用于 pair。\n  - 同样适用于 `tuple_size` 和 `tuple_element`。\n\
    \n## 元组总结\n\n- 元组是 `std::pair` 的泛化。\n- 通过 `get` 或 `tie` 使用编译时索引访问元素。\n- 支持编译时反射。它也适用于\
    \ `std::pair`。\n\n## 来自固定大小数组\n\n动机：\n\n- 内置数组不是 STL 容器：\n  - 没有 `begin`、`end`\
    \ 等。\n  - 它们不知道自己的大小。\n  -它们会退化为指针。\n- `vector` 带来了开销：\n  - 动态内存分配。\n- 具有内置数组性能的\
    \ STL 容器。\n\n## 固定大小数组\n\n- 定义在 `<array>` 中。\n- 提供常规成员：iterator/const_iterator/reverse_iterator\
    \ 以及 `begin/end/cbegin/cend`、`swap`、关系运算符。\n- `swap` 以线性（而非常数）时间运行。\n- 其他成员：`operator[]`、`at`、`front`、`back`，布局与\
    \ C 数组（以及 vector）兼容。\n- 通过 `data` 获取元素的指针：\n\n```cpp\nstd::array<int, 5> arr;\
    \ // 创建数组\nint *p = arr.data(); // 获取元素指针\n```\n\n固定大小数组\n\n- 定义在 `<array>` 中。\n\
    - 提供常规成员：iterator/const_iterator/reverse_iterator 以及 `begin/end/cbegin/cend`、`swap`、关系运算符。\n\
    - `swap` 以线性（而非常数）时间运行。\n- 其他成员：`operator[]`、`at`、`front`、`back`，布局与 C 数组（以及 vector）兼容。\n\
    - 通过 `data` 获取元素的指针：\n\n```cpp\nstd::array<int, 5> arr; // 创建数组\nint *p = arr.data();\
    \ // 获取元素指针\n```\n\n固定大小数组\n\n由于是固定大小的：\n\n- 没有 `insert`、`push_back`、`clear`。\n\
    - STL 容器具有内置数组的性能。\n\n## 聚合体 (Aggregates)\n\n`std::array` 是聚合体，所以：\n\n- `==` 和\
    \ `!=` 测试使用逐元素的 `==`\n- 其他关系测试仅使用 `<` 进行字典序比较\n- 如果值是价的（基于 `<`），则被视为相等\n- `pair<T1,\
    \ T2>` 经常可以当作 `tuple<T1, T2>` 使用：\n  - 可以从兼容的 pair 创建或赋值 2元素元组。\n  - `get<0>`\
    \ 和 `get<1>` 可作用于 pair。\n  - 同样适用于 `tuple_size` 和 `tuple_element`。\n\n固定大小的数组。\n\
    \n## 聚合体 (Aggregates)\n\n对于内置类型，没有初始化器：\n\n```cpp\nstd::array<int, 5> arr1; //\
    \ 无初始化：\n// - 栈或堆上为随机值\n// - 静态存储 ⇒ 全零\n\nstd::array<int, 5> arr2 {}; // 初始化元素太少\
    \ ⇒ 全零\nstd::array<int, 5> arr3 = {}; // 初始化元素太少 ⇒ 全零\n```\n\n带有构造函数的类型总是会被构造：\n\
    \n```cpp\nclass Widget {\npublic:\n    explicit Widget(int = -1);\n};\n```\n\n\
    ```cpp\nstd::array<Widget, 5> arr4; // 全部构造为 -1\nstd::array<Widget, 5> arr5 {};\
    \ // 全部构造为 0\n```\n\n上述行为与内置数组相同。\n\n`std::array` 的聚合初始化规则与内置数组相同。\n\n## 新 C++\
    \ (C++0x) 概述\n\n## 聚合体 (Aggregates)\n\n因为数组是聚合体：\n\n- 所有成员都是公共的！\n- 只支持默认、拷贝和移动构造。\n\
    - 这些构造函数是编译器生成的。\n- 不支持范围构造：\n\n```cpp\nstd::vector<int> v;\n...\nstd::array<int,\
    \ 10> // 错误！数组仅支持\narr(v.begin(), v.begin()+10); // 默认和拷贝构造\n```\n\n技术上，聚合体可能有非公共静态成员。\n\
    \n## 作为元组的数组 (arrays as Tuples)\n\n`array<T, n>` 有时可以被视为 `tuple<T, T, ..., T>`：\n\
    \n```cpp\nclass Widget { ... };\nconst std::size_t arraySz = 10;\ntypedef std::array<Widget,\
    \ arraySz> WidgetArray;\nWidgetArray arr; // 10 个 Widget 默认构造\n...\nstd::size_t\
    \ numElements = std::tuple_size<WidgetArray>::value;\nstd::size_t elemSize =\n\
    sizeof(std::tuple_element<0, WidgetArray>::type);\nconst auto& value = std::get<0>(arr);\n\
    std::cout << \"arr 有 \" << numElements\n          << \" 个元素，每个大小为 \" << elemSize\n\
    \          << \". 第一个元素的值是 \" << value\n          << \"\\n\";\n```\n\n"
