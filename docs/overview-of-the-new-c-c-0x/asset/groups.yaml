  - '[PAGE 229]


    # Summary of Library Enhancements


    +   - Initializer lists, emplacement, and move semantics added to C++98 containers.

    - TR1 functionality except mathematical functions adopted.

    - forward_list is a singly-linked list.

    - unique_ptr replaces auto_ptr.

    - 18 new algorithms.


    There are more subtle library changes in moving from C++03 to C++0x, e.g., function
    objects used with STL algorithms in C++03 are generally prohibited from having
    side effects, while in C++0x, some effects are allowed. For example, in C++03,
    the specification for *accumulate* says that “binary_op shall not cause side effects,”
    but in [accumulate] (26.7.2/2 of N3290), the corresponding wording is “In the
    range [first,last], binary_op shall neither modify elements nor invalidate iterators
    or subranges.'
