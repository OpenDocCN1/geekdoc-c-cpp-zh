    \nCourses currently available for personal use include:\n\n![](img/68a90f505054116271758fb914871a74_360_0.png)\n\
    \n# About Scott Meyers\n\nScott is a trainer and consultant on the design and\
    \ implementation of C++ software systems. His website,\n\nhttp://www.aristeia.com/\n\
    \nprovides information on:\n\n- Training and consulting services\n- Books, articles,\
    \ other publications\n- Upcoming presentations\n- Professional activities blog\n\
    \n![](img/68a90f505054116271758fb914871a74_361_0.png)\n\n# Overview of the New\
    \ C++ (C++)\n\nItem 14: Think carefully about copying behavior in resource-management\
    \ classes.\nItem 15: Provide access to resources in resource-management classes.\n\
    Item 16: Use the same form in using copies of new and old.\nItem 17: Store newed\
    \ objects in smart pointers in standalone structures.\n\n# Contents\n\nPreface\n\
    \nAcknowledgements\n\nIntroduction\n\nChapter 1: Accumulating Yourself to C++\n\
    \nItem 1: View C++ as a federation of languages.\nItem 2: Prefer const, enums,\
    \ and inline to de.\nItem 3: Use const wherever possible.\nItem 4: Make sure objects\
    \ are initialized before they are used.\n\nChapter 2: Constructors, Destructors,\
    \ and Assignment Operators\n\nItem 5: Know what functions writes and calls you\
    \ do not.\nItem 6: Avoid the use of compiler-generated functions.\nItem 7: Declare\
    \ virtual in polymorphic base classes.\nItem 8: Prevent exceptions from destructors.\n\
    Item 9: Have assignment operators return a reference to \"this\".\nItem 10: Use\
    \ inline assignments to avoid.\nItem 11: Copy all parts of an object.\n\nChapter\
    \ 3: Resource Management\n\nItem 13: Use objects to manage resources.\nItem 22:\
    \ Declare data members private.\nItem 23: Prefer non-const functions to mutable\
    \ functions.\nItem 24: Declare non-const functions when all should apply to all\
    \ parameters.\nItem 25: Consider use for a non-throwing swap.\n\nChapter 5: Implementations\n\
    \nItem 26: Postpone virtual definitions as long as possible.\nItem 27: Minimize\
    \ casting.\nItem 28: Avoid overusing \"base\" to objects.\nItem 29: Understand\
    \ the it costs of inline.\nItem 30: Avoid compilation dependencies between files.\n\
    \nChapter 6: Inheritance and Object-Oriented Design\n\nItem 32: Make public inheritance\
    \ models \"is-a\".\nItem 33: Avoid hiding inherited names.\nItem 34: Differentiate\
    \ between inheritance of interface and implementation.\nItem 35: Consider alternatives\
    \ to virtual functions.\nItem 36: Never redefine an inherited non-virtual function.\n"
