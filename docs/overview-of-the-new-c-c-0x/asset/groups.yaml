    # auto for Type Declarations


    Both direct and copy initialization syntaxes are permitted.


    ```

    auto v1(expr); // direct initialization syntax

    ```


    ```

    auto v2 = expr; // copy initialization syntax

    ```


    For auto, both syntaxes have the same meaning.


    The fact that in ordinary initializations, direct initialization syntax can call
    explicit constructors and copy initialization syntax cannot is irrelevant, because
    no conversion is at issue here: the type of the initializing expression will determine
    what type auto deduces.


    Technically, if the type of the initializing expression has an explicit copy constructor,
    only direct initialization is permitted. From Daniel Krüler:


    ```

    struct Explicit {

    Explicit(){}

    explicit Explicit(const Explicit&)

    } ex:

    auto ex2 = ex; // Error

    auto ex3(ex); // OK

    ```'
