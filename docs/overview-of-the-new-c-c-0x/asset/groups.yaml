    ```\n\n## Lambda/Closure Summary\n\n- Lambda expressions generate closures.\n\
    - Calling state can be captured by value or by reference.\n- Return types, when\
    \ specified, use trailing return type syntax.\n- Closures can be stored using\
    \ auto or std::function.\n- Be alert for dangling references/pointers in stored\
    \ closures.\n- Short, clear, context-derived lambdas are best.\n\n## Template\
    \ Aliases\n\nusing declarations can now be used for \"partially bound\" templates:\n\
    \n```cpp\ntemplate<typename T>\nusing MyAllocVec = std::vector<T, MyAllocator>;\n\
    MyAllocVec<int> v; // std::vector<int, MyAllocator>\n\ntemplate<std::size_t N>\n\
    using StringArray = std::array<std::string, N>;\nStringArray<15> sa; // std::array<std::string,\
    \ 15>\n\ntemplate<typename K, typename V>\nusing MapGT = std::map<K, V, std::greater<K>>;\n\
    MapGT<long long, std::shared_ptr<std::string>> myMap; // std::map<long long, std::shared_ptr<std::string>,\
    \ std::greater<long long>>\n```\n\n## Template Aliases\n\nTemplate aliases may\
    \ not be specialized:\n\n```cpp\ntemplate<typename T> // from prior\nusing MyAllocVec\
    \ = std::vector<T, Allocator>; // page\ntemplate<typename T>\nusing MyAllocVec\
    \ = std::vector<T*, MyPtrAllocator>; // error!\n```\n\nTo achieve this effect,\
    \ use a traits class:\n\n```cpp\ntemplate<typename T> // primary\nstruct VecAllocator\
    \ {\n  typedef MyAllocator type;\n};\n```\n\n```cpp\ntemplate<typename T> // specialized\n\
    struct VecAllocator<T*> // template\n  typedef MyPtrAllocator type;\n};\n```\n\
    \n```cpp\ntemplate<typename T>\nusing MyAllocVec = std::vector<T, typename VecAllocator<T>>::type;\n\
    ```\n\n## using as typedef\n\nWithout templatization, usings can be equivalent\
    \ to typedefs:\n\n```cpp\ntypedef std::unordered_set<int> IntHash; // these 2\
    \ lines do\nusing IntHash = std::unordered_set<int>; // the same thing\n```\n\n\
    using declarations can be more comprehensible:\n\n```cpp\ntypedef void (*CallbackPtr)(int);\
    \ // func. ptr. typedef\nusing CallbackPtr = void (*)(int); // equivalent using\
    \ decl.\n```\n\nThis course is about C++0x, not concurrency, so I assume that\
    \ attendees are familiar with the basic issues in threading, including when it\
    \ should and shouldn't be used, races, synchronization, deadlock, testing, etc.\
    \ The feature list on this page is not exhaustive, and near the end of the concurrency\
    \ discussion is a bullet list of “other features.”\n\n## Threads\n\nstd::thread\
    \ takes any \"callable object\" and runs it asynchronously:\n\n```cpp\nvoid doThis();\n\
    class Widget {\n  public:\n    void operator()() const;\n    void normalize(long\
    \ double, int, std::vector<float>);\n};\n\nstd::thread t1(doThis); // run function\
    \ asynch.\nWidget w;\nstd::thread t2(w); // \"run\" function object asynch.\n\
    ```\n\nTo pass arguments, a lambda can be used:\n\n```cpp\nlong double id;\nint\
    \ x;\nstd::thread t3([&]{w.normalize(id, x, {1, 2, 3});}); // \"run\" closure\
    \ asynch.\n```\n\nBehavior with multiple threads is largely the same as classic\
    \ single-threaded C/C++ behavior, with generalizations as needed. Objects of static\
    \ storage continue to have only one representation in a program, and although\
    \ they are guaranteed de-free, unsynchronized access may cause races. If main\
    \ exits and other threads are still running, Anthony Williams' words, \"terminated\
    \ abruptly,\" which means you get undefined behavior. Threads cannot be started\
    \ in suspended state, but std::thread::native_handle should be available via platform-specific\
    \ way. (Posix has no functionality; pthread_cancel is cooperative.). Threads cannot\
    \ be forcibly killed.\n\n## Data Lifetime\n\nFunctions called in ST know that\
    \ outside data are “frozen”:\n- They won’t be destroyed during the call.\n- Only\
    \ the called function can change their value.\n\n```cpp\nint x, y, z;\nWidget\
    \ *pw;\n...\nf(x, y); // call in ST\n```\n\nDuring f’s execution:\n- x, y, z,\
    \ and pw will continue to exist.\n- pw will continue unless f causes pw to be\
    \ deleted.\n- Their values change only through f’s actions, regardless of how\
    \ f declares its parameters:\n\n```cpp\nvoid f(int xParam, int yParam);      //\
    \ pass by value:\nvoid f(int&xParam, int&yParam);             // pass by ref:\n\
    void f(const int&xParam, const int&yParam); \n```\n\nNo data is inherently frozen\
    \ in an asynchronous call.\nint x, y, z;\nWidget *pw;\ncall f(x, y) asynchronously\
    \ (i.e., on a new thread);\n\n- During f’s execution:\n- x, y, z, and pw might\
    \ go of scope.\n- *pw might be deleted.\n- The values of x, y, z and *pw might\
    \ change.\n\n## Data Lifetime\n\nDetails depend on how f declares its parameters:\n\
    \n```cpp\nvoid f(int xParam, int yParam);      // pass by value:\n// f unaffected\
    \ by changes to x, y\nvoid f(int&xParam, int&yParam);             // pass by ref:\n\
    // f affected by changes to x, y\nvoid f(const int&xParam, const int&yParam);\
    \ \n```\n\nint x, y, z;\nWidget *pw;\n...\ncall f(x, y) asynchronously;\n\ninsulates\
    \ f from changes to z, pw, and *pw.\n\n## Data Lifetime\n\nConclusions:\n\n- Data\
    \ lifetime issues is critical in multi-threading (MT) design.\n- A special aspect\
    \ of synchronization/race issues.\n- Even shared data subject to lifetime issues.\n\
    - By-reference/by-pointer parameters in async calls always risky.\n- Prefer pass-by-value.\n\
    - Including via lambdas!\n\n```cpp\nvoid f(int xParam); // function to call asynchronously\n\
    \n{\n  int x;\n  std::thread t1([&]{f(x)}); // risky! closure holds a ref to x\n\
    \  std::thread t2([=]{f(x)}); // okay, closure holds a copy of x\n} // x destroyed\n\
    ```\n\nIn case of t1, the lambda's closure object is created before the calling\
    \ thread can continue, but the calling thread may continue before f starts executing.\
    \ By the time xParam is initialized, the closure may hold a dangling reference\
    \ to x, because x has already been destroyed.\n\n## Avoiding Lifetime Problems\n\
    \nTwo basic strategies:\n\n- Copy data for use by the asynchronous call.\n- Ensure\
    \ referenced objects live enough.\n\n## Copying Arguments for Asynchronous Calls\n\
    \nstd::thread’s variadic constructor (conceptually) copies everything:\n```cpp\n\
    void f(int xVal, const Widget& wVal);\nint x;\nWidget w;\nstd::thread t(f, x,\
    \ w);      // invoke copy of f on copies of x, w\n```\n\n- Copies of f, x, w,\
    \ guaranteed to exist until async call returns.\n- Inside f, wVal refers to a\
    \ copy of w, not itself.\n- Details when we do move semantics.\n\nCopying optimized\
    \ to moving whenever possible.\n\nIn this example, \"copying\" really means copying\
    \ a pointer to it, and \"optimizing\" this copy to a move makes no sense, because\
    \ copying a pointer is cheap. The general rule is that the thread constructor\
    \ copies/moves its first parameter, i.e., the function to be executed asynchronously.\n\
    \n## Copying Arguments\n\nUsing by-value captures in closures works, too:\n\n\
    ```cpp\nvoid f(int xVal, const Widget& wVal);\nint x;\nWidget w;\n...\nstd::thread\
    \ t([&]{ f(x, w); }); // invoke copy of f on copies of x, w\n```\n\n- Closure\
    \ contains copies of x and w.\n- Closure copied by thread ctor; copy exists until\
    \ f returns.\n- Copying optimized to moving whenever possible.\n- Inside f, wVal\
    \ refers to a copy of w, not w itself.\n\n## Copying Arguments\n\nAnother approach\
    \ is based on std::bind:\n\n```cpp\nvoid f(int xVal, const Widget& wVal);\nint\
    \ x;\nWidget w;\n...\nstd::thread t(std::bind(f, x, w)); // invoke f with copies\
    \ of x, w\n```\n\n- Object returned by bind contains copies of x and w.\n- That\
    \ object copied by thread ctor; copy exists until f returns.\n- Inside f, wVal\
    \ refers to a copy of w, not w itself.\n\nWe'll examine std::bind later.\n\n-\
    \ Lambdas are usually a better choice than bind.\n- Easier for readers to understand.\n\
    - More efficient.\n\n[std::bind has not been introduced yet.\n"
  mdcn: "\n\n## 将 Lambda 作为容器比较函数\n\n将闭包传递给容器构造函数：\n\n```cpp\nauto cmpFnc = [](int\
