    template<typename T>\ntypename std::remove_reference<T>::type&&\nmove(T& obj)\n\
    {\n  return obj;\n}\n```\n\n这几乎是正确的。问题在于：\n\n- obj 是左值（它有一个名字）。\n- move 的返回值是右值引用。\n\
    - 左值无法绑定到右值引用。\n\n# 实现 std::move\n\n转换消除了问题：\n\n```cpp\ntemplate<typename T>\n\
