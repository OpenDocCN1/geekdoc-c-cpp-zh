  - '[PAGE 333]


    # More C++0x Features


    +   - Enum enhancements:

    - Forward declaration

    - Specification of underlying type

    - Enumerant scoped to the enum

    - No implicit conversion to int

    - Unrestricted unions (members may be any non-reference type).

    - Time library supportings clocks, durations, points in time.

    - Local types allowed as template arguments.

    - C99 compatibility, e.g., long long, __func__, etc.

    - Inline namespaces facilitate library versioning.

    - Scoped allocators allow containers and their elements to use different allocators,
    e.g., vector<string>.


    The primary motivation for the time library was to be able to specify timeouts
    for the concurrency API (e.g., sleep durations, timeouts for lock acquisition,
    etc.).'
  - '[PAGE 334]


    # Still More C++0x Features


    +   - Generalized constant expressions (constexpr).

    - User-defined literals (e.g., 10_km, 30_sec).

    - Relaxed POD type definition; new standard layout types.

    - extern templates for control of implicit template instantiation.

    - sizeof applicable to class data members alone (e.g., sizeof(C::m)).

    - & and && member functions.

    - Relaxed rules for in-class initialization of static data members.

    - Contextual keywords for alignment control and constraining virtual function
    overloads.

    - Attributes express special optimization opportunities and provide a standard
    syntax for platform-specific extensions.'
  - '[PAGE 335]


    # Removed and Deprecated Features


    +   - auto as a storage class has been removed.

    - export as a language feature has been removed.

    -> export remains a keyword (with no semantics).

    - register as a storage class has been deprecated.

    - Exception specifications have been deprecated.

    -> noexcept conceptually replaces the "throw()" specification.

    - auto_ptr is deprecated. (Use unique_ptr instead.)

    - bind1st/bind2nd are deprecated. (Use bind or lambdas instead.)


    If an exception attempts to propagate beyond a noexcept(true) function, terminate
    is called. This is different from what happens in C++03 if a "throw()" specifier
    is violated. In that case, unexpected is invoked after the stack has been unbound.


    From Herb Sutter''s 8 December 2010 blog post, "Trip Report: November 2010 C++
    Standards Meeting; "Destructor and delete operators [are] noexcept by default
    ... Briefly, every destructor will be noexcept by default unless member or base
    destructor is noexcept(false); you of course still explicitly override the default
    and noexcept(false) on any destructor."


    Herb Sutter argues that the primary advantage of noexcept over throw() is that
    noexcept offers compilers additional optimization opportunities. From a 30 March
    2010 comp.std.cpp posting: "noexcept enables optimizations not only in the caller
    but also in the callees, so that the optimizer can assume functions called in
    a noexcept function and not wrapped in a try/catch are themselves noexcept without
    being declared (e.g., C standard library functions are not so annotated)."'
