  - '[PAGE 112]


    # void Futures


    Useful when callers want to know only when a callee finishes.


    +   - Callable objects returning void.


    +   - Callers uninterested in return value.

    - But possibly interested in exceptions.


    ```

    void initDataStructs(int defValue);

    void initGUI();

    ```


    ```

    std::future<void> f1 = std::async([]{ initDataStructs(-1); } });

    std::future<void> f2 = std::async([]{ initGUI(); } });


    // init everything

    // wait for asynch. inits. to

    // finish (and get exceptions)

    // if any

    // proceed with the program

    ```


    ```

    f1.get();

    f2.get();

    ```


    The choice between waiting to join with a thread or a future depends on several
    things. First, if you have only a thread or only a future, you have no choice.
    If a thread that returns a future throws an exception, that exception is available
    to the caller via the future, but it is silently discarded if you simply join
    with the thread (because the future is not read). A caller can poll if a future
    is available (via future::wait_for with a timeout of 0), but there is no way to
    poll if a thread is ready to be joined.


    The choice using wait or get on a future depends on whether you need a timeout
    (only wait offers) and whether you need to know if an exception was thrown (only
    get offers). wait can also be used as a signaling mechanism, i.e., to indicate
    to other threads that an operation has completed side effects they are waiting
    for. And wait can allow you to force execution of a deferred function at a point
    other than where you want to retrieve the result.


    The example on this uses get, because it seems likely if an exception is thrown
    during asynchronous initialization, the main thread would want to know that.'
- md: "\n# Mutexes\n\nFour types:\n\n- std::mutex: non-recursive, no timeout support\n\
    - std::timed_mutex: non-recursive, timeout support\n- std::recursive_mutex: recursive,\
    \ no timeout support\n- std::recursive_timed_mutex: recursive, timeout support\n\
    \nRecursively locking non-recursive mutexes ⇒ undefined behavior.\n\nMutex objects\
    \ are neither copyable nor movable. Copying a mutex doesn't really make any sense\
    \ (you'd end up with multiple mutexes for the same data). Anthony Williams\n\n\
    # RAII Classes for Mutexes\n\nMutex typically managed by RAII classes:\n\n- **std::lock_guard**:\
    \ lock mutex ctor, unlock it in dtor.\n- std::mutex m; // mutex object\n- std::lock_guard<std::mutex>\
    \ L(m); // lock m\n- ... // critical section\n- } // unlock m\n- No operations.\n\
    - No copying/moving, no assignment, no manual unlock.\n\nRAII = \"Resource Acquisition\
    \ is Initialization.\"\nIn general, the terminology \"lock\" seems to mean an\
    \ RAII or RAII-like class for managing the locking/unlocking of a mutex.\nstd::lock_guard\
    \ is neither copyable nor movable. Again, copying makes no sense. Movability is\
    \ precluded, because, as Daniel Krüger puts in a 6 April 2010 comp.std.c++ posting,\
    \ lock_guard is supposed to provide the minimum necessary functionality with minimum\
    \ overhead. If you need a movable lock, you should use unique_lock.\n\n- std::unique_lock:\
    \ much more flexible.\n- May lock mutex after construction, unlock before destruction.\n\
    - Moveable, but not copyable.\n- Supports timed mutex operations:\n  - Typically\
    \ the best choice for timed mutexes.\n\n```\nusing RCM = std::recursive_timed_mutex;\
    \ // typedef\nRCM m; // mutex object\n{\n    std::unique_lock<RCM> L(m); // lock\
    \ m\n    ... // critical section\n    L.unlock(); // unlock m\n    ... // nothing\
    \ happens\n}\n```\n\nThe name unique_lock is by analogy to unique_ptr. Originally,\
    \ a \"shared_lock\" type was proposed (to be a reader/writer lock), but it was\
    \ not adopted for C++0x.\n\n# Additional unique_lock Functionality\n\n```\nusing\
    \ TM = std::timed_mutex; // typedef\nTM m; // mutex object\n{\n    std::unique_lock<TM>\
    \ L(m, std::defer_lock); // associate m with\n    // w/o locking it\n    \n  \
    \  if (L.try_lock_for(std::chrono::microseconds(10))) {\n        // critical section\n\
    \        ...\n    } else {\n        // timeout w/o\n        // locking m\n   \
    \     ...\n    }\n    if (L) {\n        // convert to bool\n        // critical\
    \ section\n        ...\n    } else {\n        // m isn't locked\n        ...\n\
    \    }\n}\n// if m locked, unlock\n```\n\n# Multiple Mutex Acquisition\n\nAcquiring\
    \ mutexes in different orders leads to deadlock:\n\n```\nint weight, value;\n\
    std::mutex wt_mutex, val_mutex;\n\n{\n    std::lock_guard<std::mutex> wt_lock(wt_mutex);\
    \ // Thread 1 // wt 1st\n    std::lock_guard<std::mutex> val_lock(val_mutex);\
    \ // val 2nd\n    work with weight and value // critical section\n}\n\n{\n   \
    \ std::lock_guard<std::mutex> val_lock(val_mutex); // Thread 2 // val 1st\n  \
    \  std::lock_guard<std::mutex> wt_lock(wt_mutex); // wt 2nd\n    work with weight\
    \ and value // critical section\n}\n```\n\nstd::lock solves this problem:\n\n\
    ```\n{ // Thread 1\n  std::unique_lock<std::mutex> wt_lock(wt_mutex, std::defer_lock);\n\
    \  std::unique_lock<std::mutex> val_lock(val_mutex, std::defer_lock);\n  std::lock(wt_lock,\
    \ val_lock); // get mutexes w/o\n                                // deadlock\n\
    \  work with weight and value // critical section\n}\n // Thread 2\n  std::unique_lock<std::mutex>\
    \ val_lock(val_mutex, std::defer_lock);\n  std::unique_lock<std::mutex> wt_lock(wt_mutex,\
    \ std::defer_lock);\n  std::lock(val_lock, wt_lock); // get mutexes w/o\n    \
    \                            // deadlock\n  work with weight and value // critical\
    \ section\n}\n```\n\nstd::lock avoids deadlock is unspecified. It could canonically\
    \ order the locks, use a back-off algorithm, etc.\n\nIf std::lock is called with\
    \ a lock object that is already locked, an exception is thrown. If std::lock is\
    \ called with mutex objects and one of the mutex objects is already locked, behavior\
    \ may be undefined. (It depends on the details of the mutex type.)\n\n# Condition\
    \ Variables\n\nAllow threads to communicate about changes to shared data.\n\n\
    - Consumers wait until producers notify about changed state.\n\nRules:\n\n- Call\
    \ wait while holding locked mutex.\n- wait unlocks mutex, blocks thread, enqueues\
    \ it for notification.\n\nCondition variable types:\n\n- condition_variable: wait\
    \ on std::unique_lock<mutex>. Most efficient, appropriate in most cases.\n- condition_variable_any:\
    \ wait on any lock type.\n\n# Condition Variables\n\nwait parameters:\n\n- Mutex\
    \ for shared data (required).\n- Timeout (optional).\n- Predicate that must be\
    \ true for thread to continue (optional).\n\nNotification options:\n\n- notify_one:\
    \ waiting thread.\n- notify_all: waiting threads.\n\n# waiting Examples\n\n```\n\
    std::atomic<bool> readyFlag(false);\nstd::mutex m;\nstd::condition_variable cv;\n\
    {\n    std::unique_lock<std::mutex> lock(m); // loop for spurious wakeups\n  \
    \  while (readyFlag) // wait for notification\n        cv.wait(lock, []{ return\
    \ readyFlag; });\n    if (cv.wait_for(lock, std::chrono::seconds(1), // (\n  \
    \          []{ return readyFlag; })) { // predicate is true.\n            // critical\
    \ section\n        }\n    else {\n        // timed out w/o getting\n        //\
    \ critical section\n    }\n}\n```\n\nThe copy constructor in std::atomic<bool>\
    \ is deleted, so direct initialization syntax or brace initialization syntax must\
    \ be used; copy initialization won't compile.\n\nAtomic types are defined in <atomic>.\n\
    \nThe waiting functions are wait, wait_for, and wait_until. The only difference\
    \ between wait_for and wait_until is that the former takes a duration (how long\
    \ to wait), while the latter takes an absolute time (when to wait until). Waiting\
    \ times are absolute (e.g., the example above will wait for a total of 1 second,\
    \ regardless of how many spurious wakeups occur).\n\nThe examples on this page\
    \ assume that readyFlag, m, and cv are nonlocal variables, e.g., at global or\
    \ namespace scope. That's why the lambdas can refer to readyFlag without capturing\
    \ it.\n\n# Notification Examples\n\n```\nstd::atomic<bool> readyFlag(false); //\
    \ as before\nstd::condition_variable cv;\n{\n    readyFlag = true; // make things\
    \ \"ready\"\n    cv.notify_one(); // wake ~1 thread\n    // blocked on cv\n}\n\
    {\n    readyFlag = true; // make things \"ready\"\n    cv.notify_all(); // wake\
    \ all threads\n    // blocked on cv (all but\n    // 1 will then block on m)\n\
    }\n```\n\nnotify_all moves all blocked threads from the condition variable queue\
    \ to the corresponding mutex queue.\n\nThe examples make no mention of a mutex,\
    \ because notifiers need not hold a mutex in order to signal a condition.\n"
