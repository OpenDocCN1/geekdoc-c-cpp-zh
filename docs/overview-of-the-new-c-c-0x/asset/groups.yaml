    ```

    void f(int xVal, const Widget& wVal);

    ```


    ```

    int x;

    Widget w;

    ```


    ```

    ...

    std::thread t(std::bind(f, x, w)); // invoke f with copies of x, w

    ```


    +   Object returned by bind contains copies of x and w.


    +   That object copied by thread ctor; copy exists until f returns.


    +   Inside f, wVal refers to a copy of w, not w itself.


    We''ll examine std::bind later.


    +   Lambdas are usually a better choice than bind.


    +   Easier for readers to understand.


    +   More efficient.


    [std::bind has not been introduced yet.'
- md: "\n## Overview of the New C++ (C++0x)\n\n# Copying Arguments\n\nSummary:\n\n\
    - Options for creating argument copies with sufficient lifetimes:\n- Use variadic\
    \ thread constructor.\n- Use lambda with by-value capture.\n- Use bind.\n\nScott\
    \ Meyers, Software Development Consultant\nhttp://www.aristeia.com/\n\n© 2011\
    \ Scott Meyers, all rights reserved.\n\nSlide 101\n\nScott Meyers, Software Development\
    \ Consultant\nhttp://www.aristeia.com/\n© 2011 Scott Meyers, all rights reserved.\n\
    Download from Wow! eBook <www.wowebook.com>\n\n# Ensuring Sufficient Argument\
    \ Lifetimes\n\nOne way is to delay locals’ destruction until async call is complete:\n\
    \n```cpp\nvoid f(int xVal, const Widget& wVal);    // as before\n\n{\n    int\
    \ x;\n    Widget w;\n    ...\n    std::thread t([&]{ f(x, w); });      // wVal\
    \ really refers to w\n    ...\n    t.join();                          // destroy\
    \ w only after t\n                                     // finishes\n}\n```\n\n\
    # Mixing By-Value and By-Reference Arguments\n\nGiven\n\n```cpp\nvoid f(int xVal,\
    \ int yVal, int zVal, Widget& wVal);\n```\n\nwhat if you really want to pass w\
    \ by reference?\n\n- Lambdas: use by-reference capture:\n\n```cpp\n{\n  Widget\
    \ w;\n  int x, y, z;\n  ...\n  std::thread t([=, &]{f(x, y, z, w);}); // pass\
    \ copies of x, y, z;\n  ... // pass w by reference\n}\n```\n\n- You’re responsible\
    \ for avoiding data races on w.\n\n## Mixing By-Value and By-Reference Arguments\n\
    \n- Variadic thread constructor or bind: Use C++0x's std::ref:\n- Creates objects\
    \ that act like references.\n- Copies of a std::ref-generated object refer to\
    \ the same object.\n\n```cpp\nvoid f(int xVal, int yVal, int zVal, Widget& wVal);\
    \ // as before\n{\n    static Widget w;\n    int x, y, z;\n\n    std::thread t1(f,\
    \ x, y, z, std::ref(w)); // pass copies of\n    std::thread t2(std::bind(f, x,\
    \ y, z, std::ref(w))); // x, y, z; pass w\n    ... // by reference\n}\n```\n\n\
    - std::ref also exists (for ref-to-consts), but implicit ref(T) -> const T& means\
    \ std::ref often suffices.\n\n# Asynchronous Calls\n\nBuilding blocks:\n\n- std::async:\
    \ Request asynchronous execution of a function.\n- Future: token representing\
    \ function’s result.\n\nUnlike raw std::thread objects:\n\n- Allows values or\
    \ exceptions to be returned.\n- Just like “normal” function calls.\n\nThis course\
    \ neither shows nor discusses std::packaged_task or std::promise.\n\n# async\n\
    \n```cpp\ndouble bestValue(int x, int y); // something callable\nstd::future<double>\
    \ f = // run λ async;\nstd::async([](){{ return bestValue(10, 20); }); // get\
    \ future for it\n... // do other work\ndouble val = f.get(); // get result (or\n\
    // exception) from λ\n```\n\nAs usual, auto reduces verbiage:\n\n```cpp\nauto\
    \ f = std::async([]{ return bestValue(10, 20); });\n...\nauto val = f.get();\n\
    ```\n\nThe idea behind bestValue is that it computes the optimal value for something\
    \ given parameters x and y. Presumably, such computation takes a while, hence\
    \ makes a natural separate task.\n\nInstead of passing only a lambda, std::async\
    \ may also be passed a function and its arguments (like std::thread), but I don't\
    \ show any such examples.\n\n# async Launch Policies\n\n- **std::launch::async**:\
    \ function runs on a new thread.\n- Maintains calling thread's responsiveness\
    \ (e.g., GUI threads).\n\n```cpp\nauto f = std::async(std::launch::async, doBackgroundWork);\n\
    ```\n\n- **std::launch::deferred**: function runs on calling thread.\n- Useful\
    \ for debugging, performance tuning.\n- Invocation occurs upon get or a waiting\
    \ call.\n\n```cpp\nauto f = std::async(std::launch::deferred,\n  [](){ returnValue(10,\
    \ 20); }});\nauto val = f.get(); // run asynchronously here\n```\n\nBy default,\
    \ implementation chooses, presumably with goals:\n\n- Take advantage of all hardware\
    \ concurrency, i.e., scale.\n- Avoid oversubscription.\n\nThreads used by std::async\
    \ may (but not need) be drawn from a thread pool the as-if rule, but implementations\
    \ would have to, e.g., destroy and reinitialize thread-local variables before\
    \ using a reusing thread.\n\nUntil November 2010, std::launch::deferred was named\
    \ std::launch::sync.\n\nWhen multiple async policies are launched (e.g., by specifying\
    \ std::launch::async | std::launch::deferred), the decision between synchronous\
    \ and asynchronous execution need not be made before std::async returns.\n\nMotivation\
    \ for async calls using std::launch::deferred execution only when get/wait is\
    \ called in N273 \"Eager and Lazy Evaluation.\" Invoking wait_for or wait_until\
    \ on a future deferred Williams notes that tasks running synchronously may not\
    \ use promises or conventional futures: \"std::async-deferred task that ends up\
    \ on the calling thread will modify the calling thread's thread-local data. This\
    \ is a problem with std::launch::async.\"\n\n# Futures\n\nTwo kinds:\n\n- **std::future<T>**:\
    \ result may be accessed only once.\n- Suitable for most use cases.\n- Moveable,\
    \ not copyable.\n- Exactly one future has right to access result.\n\n- **std::shared_future<T>**:\
    \ result may be accessed multiple times.\n- Appropriate when threads access a\
    \ single result.\n- Both copyable and moveable.\n- Multiple shared_futures for\
    \ the same result may exist.\n- Creatable from std::future.\n- Such creation transfers\
    \ ownership.\n\nBoth std::async and promise return std::future objects, so the\
    \ only way to create a non-null std::future is to do it from shared_future. Until\
    \ November 2009, std::future was named unique_future.\n\nRegarding implementation\
    \ of futures, Anthony Williams writes, \"Implementations of std::future<T> must\
    \ provide space for storing T or exception_ptr, and a means of counting references\
    \ to shared state. Additional storage may be required for managing the state,\
    \ as mutex and some flags. In the case of futures arising from use of std::async,\
    \ the state must also include storage for the callable object and its arguments\
    \ (for policy of std::launch::deferred), or a handle to the new thread (for policy\
    \ of std::launch::async).\"\n\n# Futures\n\nResult retrieval via get:\n\n- Blocks\
    \ until a return is available, then grabs it.\n- For future<T>, \"grabs\" = \"\
    moves (if possible) or copies.\"\n- For shared_future<T>, \"grabs\" = \"gets reference\
    \ to.\"\n- \"Return\" may be an exception (which is then propagated).\n\nInvoking\
    \ get more than once on std::future yields undefined behavior. Invoking get more\
    \ than once on shared_future yields the same result (return value or exception)\
    \ each time. There is no need to copy such results or exceptions because (1) non-exceptions\
    \ are accessed by reference and (2) a copy of an exception is made only if catching\
    \ by value.\n\n# Futures\n\nAn alternative is wait:\n\n- Blocks until a return\
    \ is available.\n\n```cpp\nstd::future<double> f = std::async([]{ return bestValue(10,\
    \ 20); });\nf.wait(); // block until lambda is done\n```\n\n- A timeout may be\
    \ specified.\n- Most useful when std::launch::async specified.\n\n```cpp\nstd::future<double>\
    \ f = std::async([](){ return bestValue(10, 20); });\nwhile (f.wait_for(std::chrono::seconds(0))\
    \ != std::future_status::ready) { // isn't ready,\n    // do more work\n}\ndouble\
    \ val = f.get(); // grab result\n```\n\nFor unique futures, wait_for is most useful\
    \ when the task is running asynchronously, because if it's a deferred task (i.e.,\
    \ slated to run synchronously), calling wait_for will never timeout (It will invoke\
    \ the deferred task synchronously, and you'll have to wait for it to finish.).\n\
    \nThe enum future::ready must be qualified with future::status; because std::future_status\
    \ is an enum class, not just an enum. There is similarly support akin to Unix's\
    \ select, but select applies only to asynchronous IO (it waits on files), and\
    \ it is not part of C++ concurrency support.\n\n# void Futures\n\nUseful when\
    \ callers want to know only when a callee finishes.\n\n- Callable objects returning\
    \ void.\n- Callers uninterested in return value.\n- But possibly interested in\
    \ exceptions.\n\n```cpp\nvoid initDataStructs(int defValue);\nvoid initGUI();\n\
    ```\n\n```cpp\nstd::future<void> f1 = std::async([]{ initDataStructs(-1); });\n\
    std::future<void> f2 = std::async([]{ initGUI(); } });\n\n// init everything\n\
    // wait for asynch. inits. to\n// finish (and get exceptions)\n// if any\n// proceed\
    \ with the program\n```\n\n```cpp\nf1.get();\nf2.get();\n```\n\nThe choice between\
    \ waiting to join with a thread or a future depends on several things. First,\
    \ if you have only a thread or only a future, you have no choice. If a thread\
    \ that returns a future throws an exception, that exception is available to the\
    \ caller via the future, but it is silently discarded if you simply join with\
    \ the thread (because the future is not read). A caller can poll if a future is\
    \ available (via future::wait_for with a timeout of 0), but there is no way to\
    \ poll if a thread is ready to be joined.\n\nThe choice using wait or get on a\
    \ future depends on whether you need a timeout (only wait offers) and whether\
    \ you need to know if an exception was thrown (only get offers). wait can also\
    \ be used as a signaling mechanism, i.e., to indicate to other threads that an\
    \ operation has completed side effects they are waiting for.\n"
  mdcn: "\n\n## 新 C++ (C++0x) 概述\n\n# 拷贝参数\n\n摘要：\n\n- 创建具有足够生命期的参数拷贝的选项：\n- 使用变长线程构造函数。\n\
    - 使用按值捕获的 lambda。\n- 使用 bind。\n\nScott Meyers，软件开发顾问\nhttp://www.aristeia.com/\n\
    \n© 2011 Scott Meyers, 保留所有权利\n\n幻灯片 101\n\nScott Meyers，软件开发顾问\nhttp://www.aristeia.com/\n\
    © 2011 Scott Meyers, 保留所有权利\n从 Wow! eBook 下载 <www.wowebook.com>\n\n# 确保参数有足够的生命周期\n\
    \n一种方法是推迟局部变量的析构直到异步调用完成：\n\n```cpp\nvoid f(int xVal, const Widget& wVal);   \
    \ // 与之前\n\n{\n    int x;\n    Widget w;\n    ...\n    std::thread t([&]{ f(x,\
    \ w); });      // wVal 实际上引用 w\n    ...\n    t.join();                       \
    \   // 只有在 t\n                                     // 结束后才析构 w\n}\n```\n\n# 混合按值和按引用参数\n\
    \n给定\n\n```cpp\nvoid f(int xVal, int yVal, int zVal, Widget& wVal);\n```\n\n如果你真的想通过引用传递\
    \ w 怎么办？\n\n- Lambdas：使用按引用捕获：\n\n```cpp\n{\n  Widget w;\n  int x, y, z;\n  ...\n\
    \  std::thread t([=, &]{f(x, y, z, w);}); // 传递 x, y, z 的拷贝\n  ... // 按引用传递 w\n\
    }\n```\n\n- 你负责避免在 w 上发生数据竞态。\n\n## 混合按值和按引用参数\n\n- 变长线程构造函数或 bind：使用 C++0x 的\
    \ std::ref：\n- 创建行为引用的对象。\n- std::ref 生成的对象的拷贝引用同一个对象。\n\n```cpp\nvoid f(int xVal,\
    \ int yVal, int zVal, Widget& wVal); // 与之前\n{\n    static Widget w;\n    int\
    \ x, y, z;\n\n    std::thread t1(f, x, y, z, std::ref(w)); // 传递\n    std::thread\
    \ t2(std::bind(f, x, y, z, std::ref(w))); // x, y, z; 传递 w\n    ... // 按引用\n}\n\
    ```\n\n- std::ref 也存在（用于常量的引用），但隐式的 ref(T) -> const T& 意味着 std::ref 往往足够。\n\n\
    # 异步调用\n\n构建块：\n\n- std::async：请求异步执行一个函数。\n- Future：代表函数结果的令牌。\n\n与原始的 std::thread\
    \ 对象不同：\n\n- 允许返回值或异常。\n- 就像“普通”函数调用一样。\n\n本课程既不也不讨论 std::packaged_task 或 std::promise。\n\
    \n# async\n\n```cpp\ndouble bestValue(int x, int y); // 某些可用的\nstd::future<double>\
    \ f = // 异步运行 λ;\nstd::async([](){{ return bestValue(10, 20); }); // 获取其对应的 future\n\
    ... // 执行其他工作\ndouble val = f.get(); // 获取 λ 的结果（或\n// 异常）\n```\n\n一如既往，auto 减少了冗余：\n\
    \n```cpp\nauto f = std::async([]{ return bestValue(10, 20); });\n...\nauto val\
    \ = f.get();\n```\n\nbestValue 背后的想法是它根据参数 x 和 y 计算某项的最优值。推测这种计算需要一些时间，因此使其成为自然的独立任务。\n\
    \nstd::async 不仅可以传递 lambda，还可以传递一个函数及其参数（类似于 std::thread），但我没有展示任何此类示例。\n\n# async\
    \ 启动策略\n\n- **std::launch::async**：在新线程上运行函数。\n- 保持调用线程的响应性（例如 GUI 线程）。\n```cpp\n\
    auto f = std::async(std::launch::async, doWork);\n```\n\n- **std::launch::deferred**：在调用线程上运行函数。\n\
    - 用于调试、性能调优。\n- 调用在调用 get 或 wait 时发生。\n```cpp\nauto f = std::async(std::launch::deferred,\n\
    \  [](){ returnValue(10, 20); }});\nauto val = f.get(); // 在此处异步运行\n```\n\n默认情况下，实现选择，目标是：\n\
    - 利用所有硬件并发性。\n- 避免过度订阅。\n\nstd::async 使用的线程可能（但不需要）从线程池提取，并在重用线程之前销毁并初始化线程局部变量。直到\
    \ 2010 年，std::launch::deferred 被命名为 launch::sync。\n\n当启动多个异步策略（例如通过指定 std::launch::async\
    \ | std::launch::deferred）时，同步和异步执行的决策需要在 std::async 返回之前做出。\n\n# Futures\n\n\
    两种类型：\n\n- **std::future<T>**：结果只能访问一次。\n- 适用于大多数场景。\n- 可移动，不可拷贝。\n- 只有一个 future\
    \ 有权访问结果。\n\n- **std::shared_future<T>**：结果可以被多次访问。\n- 当访问单个结果时适用。\n- 可拷贝且可移动。\n\
    - 同一个结果可能存在多个 shared_futures。\n- 可从 future 创建。\n- 这种创建转移了所有权。\n\nstd::async 和\
    \ promise 都返回 future 对象，因此创建非空 future 的唯一方法是来自 shared_future。直到 2009 年，std::future\
    \ 被命名为 unique_future。\n\n关于 futures 的实现，Anthony Williams 写道：“std::future<T> 的实现必须提供存储\
    \ T 或 exception_ptr 的空间，以及计数共享引用的方法。可能需要额外的存储来管理状态以及某些标志。在来自 std::async 的情况下，状态必须包含可调用对象及其参数（对于\
    \ std::launch::deferred 策略），或新线程的句柄（对于 std::launch::async 策略）。”\n\n# Futures\n\
    \n通过 get 获取结果：\n\n- 阻塞直到可用，然后获取。\n- 对于 future<T>，“获取” = “移动（如果可能）或 拷贝”。\n- 对于\
    \ shared_future<T>，“获取” = “获取引用”。\n- “返回”可能是异常（随后被传播）。\n\n在 std::future 上多次调用\
    \ get 会导致未定义行为。在 shared_future 上多次调用 get 会产生相同的结果（返回值或异常）。不需要拷贝此类结果或异常，因为 (1)\
    \ 非异常是通过引用访问的，(2) 只有在按值捕获时才会创建异常的拷贝。\n\n# Futures\n\n另一种选择是 wait：\n\n- 阻塞直到结果可用。\n\
    \n```cpp\nstd::future<double> f = std::async([]{ return bestValue(10, 20); });\n\
    f.wait(); // 阻塞直到 lambda 完成\n```\n\n- 可以指定超时。\n- 在指定 std::launch::async 时最有用。\n\
    \n```cpp\nstd::future<double> f = std::async([](){ return bestValue(10, 20); });\n\
    while (f.wait_for(std::chrono::seconds(0)) != std::future_status::ready) { //\
    \ 未就绪，\n    // 执行更多工作\n}\ndouble val = f.get(); // 获取结果\n```\n\n对于 unique futures，当任务异步运行时，wait_for\
    \ 最有用，因为如果它是延迟任务（即计划同步运行），调用 wait_for 将永远不会超时（它将同步调用延迟任务，你必须等待它完成）。\n\n枚举 future::ready\
    \ 必须用 future::status 限定，因为 std::future_status 是一个枚举类，而不仅仅是一个枚举。类似的有类似于 Unix select\
    \ 的支持，但 select 仅适用于异步 IO（它等待文件），并且不是 C++ 并发支持的一部分。\n\n# void Futures\n\n当调用者只想知道被调用者何时结束时有用。\n\
    \n- 返回 void 的调用对象。\n- 调用者对返回值感兴趣。\n- 但可能对异常感兴趣。\n\n```cpp\nvoid initDataStructs(int\
    \ defValue);\nvoid initGUI();\n```\n\n```cpp\nstd::future<void> f1 = std::async([]{\
    \ initDataStructs(-1); });\nstd::future<void> f2 = std::async([]{ initGUI(); }\
    \ });\n\n// 初始化一切\n// 等待异步初始化\n// 完成（并获取异常）\n// 如果有\n// 继续程序\n```\n\n```cpp\n\
    f1.get();\nf2.get();\n```\n\n在等待 join 线程或 future 之间进行选择取决于几点。首先，如果你只有线程或只有 future，你没有选择。如果一个返回\
    \ future 的线程抛出异常，调用者可以通过 future 获取该异常，但如果你只是简单的 join，异常就会被静静地丢弃。调用者可以轮询 future\
    \ 是否可用（通过超时时间为 0 的 wait_for），但没有方法可以轮询线程是否就绪。\n\n"
