    \ displayed, or performed, for commercial or noncommercial purposes or for compensation\
    \ of any kind without prior written permission from Artima, Inc.\n\nThis PDF eBook\
    \ is prepared exclusively for its purchaser, who may use it for personal purposes\
    \ only, as described by the Artima eBook license (http://www.artima.com/ebook_license.html).\
    \ In addition, the purchaser may modify this PDF eBook to light sections, add\
    \ comments and annotations, etc., except that “For the exclusive use of ” text\
    \ that identifies the purchaser may not be modified in any way.\n\nAll information\
    \ and materials in this eBook are provided “as is” and without warranty of any\
    \ kind.\n\nThe term “Artima” and the Artima logo are trademarks or registered\
    \ trademarks of Artima, Inc. All other company and/or product names may be trademarks\
    \ or registered trademarks of their owners.\n\n# Overview of the New C++ (C++0x)\n\
    \nScott Meyers, Ph.D.\nSoftware Development Consultant\n\nsmeyers@aristeia.com\n\
    http://www.aristeia.com/\nVoice: 503/638-6028\nFax: 503/974-1888\n\nThese are\
    \ the official notes for Scott Meyers' training course, “Overview of the New C++\
    \ (C++0x)”. The course description is at http://www.aristeia.com/C++0x.html. Licensing\
    \ information is at http://aristeia.com/Licensing/licensing.html.\n\nPlease send\
    \ bug reports and improvement suggestions to smeyers@aristeia.com.\n\nIn these\
    \ notes, references to numbered documents preceded by N (e.g., N3290) are references\
    \ to C++ standardization documents. All such documents are available via http://www.open-std.org/jtc/1sc22/wg21/docs/papers.\n\
    \nReferences to sections of draft C++0x are of the form [chapter.section]. Such\
    \ symbolic names don't change from draft to draft. References give section numbers\
    \ and (following a slash) paragraphs of specific drafts; those numbers may vary\
    \ across drafts. Hence [basic.fundamental](3.9.1 in N3290) refers to the section\
    \ with (permanent) symbolic name [basic.fundamental]—in particular 3.9.1 paragraph\
    \ 5 in N3290.\n\nIn comments, such as this, are for instructors presenting the\
    \ course. All comments should be helpful for both instructors and people reading\
    \ the notes on their own.\n\nDay 1 usually ends somewhere in the discussion of\
    \ the C++0x concurrency API. Day 2 usually goes to the end of the library material.\n\
    \n## Overview\n\n- Introduction\n  - History, vocabulary, quick C++98/C++0x comparison\n\
    - Features for Everybody\n  - auto, range-based for, lambdas, threads, etc.\n\
    - Library Enhancements\n  - Really more features for everybody\n  - TRI-base,\
    \ perfect forwarding, forward_list, unique_ptr, etc.\n- Features for Class Authors\n\
    \  - Move semantics, perfect forwarding, delegating/inheriting ctors, etc.\n-\
    \ Features for Library Authors\n  - Variadic templates, decltype, etc.\n- Yet\
    \ More Features\n- Removed and Deprecated Features\n- Further Information\n\n\
    This course is an overview, so there isn't time to cover the details on most features.\
    \ In general, the features earlier in the course (the ones applicable to more\
    \ programmers) get more thorough treatments than the features later in the course.\n\
    \nRvalue references aren't listed on this page, because it's part of move semantics.\n\
    \n# History and Vocabulary\n\n1998: ISO C++ Standard officially adopted (“C++98”).\n\
    - 776 pages.\n\n2003: TC1 (“Technical Corrigendum 1”) published (“C++03”).\n-\
    \ Bug fixes for C++98.\n- 786 pages.\n\n2005: TR1 (“Technical Report 1”) published.\n\
    - 149 new components for the standard library.\n\n2008: Draft for new C++ standard\
    \ (“C++0x”) achieves CD status.\n- TR1-derived components plus much more.\n- 1265\
    \ pages.\n\n2009: (Limited) C++ feature availability becomes common.\n\n2011:\
    \ Ratification of new standard expected.\n- Final Draft International Standard\
    \ (“FDIS”) approved in March.\n- 1353 pages.\n-C++11” now effectively a code name.\n\
    \n2012: TR2\n- Additional likely future library components.\n\nAn overview of\
    \ support for C++0x features in various compilers is available http://www.aristeia.com/C++0x/FeatureAvailability.htm.\
    \ Boost was the only thing incorporated into TR2 before work on it was paused.\n\
    \n# Sample Caveat\n\nSome of the code in this course is untested. I believe the\
    \ code is correct, but I offer no guarantee.\n\n© 2011 Scott Meyers, all rights\
    \ reserved. Download from Wow! ebook.com\n\n# Copying vs. Moving\n\nTemporary\
    \ objects are prime candidates for moving:\n```cpp\nstd::vector<T> v;\n...\nv\
    \ = create(); // factory function\n// in C++98, copy return value to v, then destroy\
    \ return value\n```\n![](img/68a90f505054116271758fb914871a74_8_0.png)\n\nThe\
    \ diagrams on this slide make up a PowerPoint animation. In this discussion, I\
    \ use a container of T, rather than specifying a particular type, e.g., string\
    \ or int. The motivation for move semantics is largely independent of the types\
    \ involved, although the larger and more expensive the types to copy, the stronger\
    \ the case for moving over copying.\n\n# Copying vs. Moving\n\nC++x turns such\
    \ copy operations into move requests:\n\n```cpp\nstd::vector<T> v;\n...\nv = create();\
    \ // implicit move request in C++0x\n```\n![](img/68a90f505054116271758fb914871a74_9_0.png)\n\
    \nThe diagrams on this slide make up a PowerPoint animation.\n\n# Copying vs.\
    \ Moving\n\nMove semantics examined in detail later, but:\n\n- Moving a key C++0x\
    \ idea.\n  - Usually an optimization of copying.\n- Most standard types in C++0x\
    \ are move-enabled.\n  - They support move requests.\n  - E.g., STL containers.\n\
    - Some types are move-only:\n  - Copying prohibited, but moving is allowed.\n\
    \  - E.g., stream objects, std::thread objects, std::unique_ptr, etc.\n\n# Sample\
    \ C++98 vs. C++0x Program\n\nList the 20 most common words in a set of text files.\n\
    \n```\nAlice_in_Wonderland.txt War_and_Peace.txt\nDracula.txt The_Kama_Sutra.txt\
    \ The_Iliad.txt\n70544 words found. Most common:\nthe 58272\nand 34111\nof 27066\n\
    to 26992\na 16937\nin 14711\nhis 12615\nhe 11261\nthat 11059\nwas 9861\nwith 9780\n\
    I 8663\nhad 6737\nas 6714\nnot 6608\nher 6446\nis 6277\nat 6202\nnon 5981\nfor\
    \ 5801\n```\n\nThe data shown is from the plain text versions of the listed books\
    \ as downloaded from Project Gutenberg (http://www.gutenberg.org/).\n\n# Counting\
    \ Words Across Files: C++98\n\n```cpp\n#include <stdio>                      \
    \ // easier than iostream for formatted output\n#include <iostream>\n#include\
    \ <iterator>\n#include <string>\n#include <fstream>\n#include <algorithm>\n#include\
    \ <vector>\n#include <map>\n\ntypedef std::map<std::string, size_t> WordCountMapType;\n\
    \nWordCountMap wordsInFile(const char * const fileName) // for each word\n{\n\
    \    std::ifstream file;                                // in file, return\n \
    \   WordCountMapType wordCounts;                            // of\n    for (std::string\
    \ word; file >> word; ) {           // occurrences\n        ++wordCounts[word];\n\
    \    }\n    return wordCounts;\n}\n```\n\nIt would be better software engineering\
    \ to have wordsInFile check the file name for validity and then call another function\
    \ (e.g., \"wordsInStream\") to do the actual counting, but the resulting code\
    \ gets a bit duplicated in the serial case (C++98) and yet more complicated in\
    \ the concurrent case (C++0x), to keep this example program simple and focused\
    \ on C++0x features, we assume that every passed file name is legitimate, i.e.,\
    \ we embrace the \"nothing could possibly go wrong\" assumption.\n"
  mdcn: "\n\n# 新 C++ (C++0x) 概述\n\n![](img/68a90f505054116271758fb914871a74_0_0.png)\n\
    \n# 新 C++ (C++0x) 概述\n\nArtima Press 是 Artima, Inc. 旗下的出版社。\nP.O. Box 305, Walnut\
    \ Creek, California 94597\n\nCopyright © 2010 Scott Meyers. 版权所有。\n\n第一版发布于 2010年4月5日\n\
    本版本发布于 2011年4月30日\n美国制造制造\n\n封面照片由 Stephan Jockel 拍摄。经许可使用。\n\n未经 Artima, Inc.\
    \ 事先书面许可，本出版物的任何部分不得复制、修改、分发、存储在检索系统中、重新出版、展示或表演，无论是用于商业还是非商业目的，或任何形式的补偿。\n\n\
    本 PDF 电子书专为购买者准备，购买者仅可按照 Artima 电子书许可（http://www.artima.com/ebook_license.html）所述用于个人用途。此外，购买者对此\
