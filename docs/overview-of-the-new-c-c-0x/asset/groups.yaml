    \ |\n| 通用泛函数 (Generalized Functors) | 支持分配器。新增 `assign`。 |\n| 类型特质 (Type Traits)\
    \ | 消除了固有的 C++98 限制。一些新增/重命名。 |\n| 随机数 (Random Numbers) | 修改了引擎/分布器。删除了 `variate_generator`。\
    \ |\n| 数学特殊函数 (Mathematical Special Functions) | C++0x 未包含。（将作为一个独立标准。） |\n| 元组\
    \ (Tuples) | 添加了 `tuple_cat`。 |\n| 固定尺寸数组 (Fixed Size Array) | 将 `assign` 重命名为\
    \ `fill`。 |\n| 哈希表 (Hash Tables) | 支持运算符 `==` 和 `!=`。 |\n| 正则表达式 (Regular Expressions)\
    \ | 支持字符串字面量（不仅是 `std::strings`）。 |\n| C99 兼容 | `fabs(complex<T>) -> abs(complex<T>)`。\
    \ |\n\n在 TR1 提出的 23 个数学函数中，有21 个保留在独立的草案标准《支持数学特殊函数的 C++ 库扩展》中。缺失的两个函数是合流超几何函数和超几何函数。\n\
    \n“消除固有的 C++98 限制”意味着 C++0x 规范中移除了基于 C++98 库功能固有的限制。正如 Stephen T. Lavave 所述：“在\
    \ C++0x 中，`result_of` 由 `decltype` 驱动，因此始终能获得正确答案，而无需 TR1 繁琐且不完整的库机制。同样，`bind`\
    \ 由右值引用驱动，消除了它对右值的限制。类型特质保证使用编译器钩子并始终获得正确答案。”从实践上讲说，TR1 的许多边缘情况已不再是边缘情况了。\n\n\
    # 从 TR1：shared_ptr 和 weak_ptr\n\n动机：\n\n- 智能指针简化了资源管理。\n- 例如，在抛出异常时防止内存泄漏。\n\n\
    标题中的“From TR1”表示这是基于 TR1 功能的 C++00x 特性。\n\n# shared_ptr\n\n- 定义在 `<memory>` 中。\n\
    - 一种引用计数的智能指针。\n- 当引用计数 (RC) -> 0 时，指向的资源会被释放。\n\n```cpp\n{\n  std::shared_ptr<Widget>\
    \ p1(new Widget);\n\n  std::shared_ptr<Widget> p2(p1);\n\n  p1->doThis();\n  if\
    \ (p2) p2->doThat();\n  ...\n  p2 = nullptr;\n  ...\n\n  // RC = 0; Widget\n \
    \ // deleted\n}\n```\n\n`p2 = nullptr;` 本质上等同于 `p2.reset();`\n\n\"RC\" = \"Reference\
    \ Count”（引用计数）。\n\n# shared_ptr 构造函数\n\n- 默认、拷贝、原始指针。\nstd::shared_ptr<Widget>\
    \ pw1;\nstd::shared_ptr<Widget> pw2(pw1);\nstd::shared_ptr<Widget> pw3(new Widget);\
    \ // 典型情况\n- 后者是显式的：\n\n- std::shared_ptr<Widget> pw4 = new Widget; // 错误！\n-\
    \ 兼容 `unique_ptr`、`auto_ptr`、`shared_ptr` 或 `weak_ptr`。\nstd::unique_ptr<Widget>\
    \ makeUP(); // 工厂函数\nstd::auto_ptr<Widget> makeAP();\nstd::shared_ptr<Widget>\
    \ pw5(makeUP()); // 来自 unique_ptr\nstd::shared_ptr<Widget> pw6(makeAP()); // 来自\
    \ auto_ptr\nstd::shared_ptr<const Widget> pw7(pw3); // 添加 const\n\n[std::unique_ptr\
    \ 尚未引入。]\n\n“兼容”指针类型考虑了派生类到基类的转换（例如，从 `shared_ptr<derived>` 生成 `shared_ptr<base>`）。\n\
    \n从 `unique_ptr` 和 `auto_ptr` 的转换仅支持非 const 源（如示例所示）。使用左值或 `unique_ptr` 初始化 `shared_ptr`\
    \ 需要使用 `std::move`。\n\n# shared_ptr 构造函数（进阶）\n\n- 来自 `this` 指：\n\n-> 这是一个原始指针，但可能已经存在其他的\
    \ `shared_ptr`！\n\n```cpp\nstd::shared_ptr<ISomething>\nWidget::getSomething()\n\
    {\n    return std::shared_ptr<ISomething>(this); // 危险！\n} // 可能会创建一个引用计数！\n```\n\
    \n```cpp\nstd::shared_ptr<ISomething>\nWidget::getSomething()\n{\n    return shared_from_this();\n\
    } // 安全，没有产生新 RC 的可能\n```\n\n-> 需要继承 `enable_shared_from_this`：\n\n```cpp\nclass\
    \ Widget : public ISomething,\n    public std::enable_shared_from_this<Widget>\
    \ {\n    ...\n};\n```\n\n\"RC\" = \"Reference Count\"。\n\n`shared_from_this` 不能用于创建对象的第一个\
    \ `shared_ptr`。\n\n在构造函数中使用 `shared_from_this`（例如在构造期间注册对象）是不可靠的。关于该问题的简短讨论可见：http://www.boost.org/libs/smart_ptr/sp_techniques.html#in_constructor。\n\
    \n# 部分 shared_ptr 特性\n\n- 访问原始指针：用于遗留 API。\nstd::shared_ptr<Widget> spw(new Widget);\n\
    - 访问引用计数：\nsize_t refs = spw.use_count(); \n\n# 其他 shared_ptr 特性\n\n- `static_pointer_cast`、`dynamic_pointer_cast`、`const_pointer_cast`\n\
    - 关系运算符：`==`、`!=`\n- 输出：`std::cout << spw;`\n\n# weak_ptr\n\nweak pointers 类似于原始指针，但它们知道自己可能悬空：\n\
    \n- 当资源的 RC -> 0 时，其 `weak_ptr` 失效。\n- 释放资源的 `shared_ptr` 会让所有的 `weak_ptr` 失效：\n\
    \n```cpp\nstd::shared_ptr<Widget> spw(new Widget); // RC = 1\nstd::weak_ptr<Widget>\
    \ wpw(spw); // RC 保持为 1\nif (!wpw.expired()) ... // 如果 RC >= 1 ...\n```\n\n- 用于“观察”他人管理的数据结构。\n\
    \n![](img/68a90f505054116271758fb914871a74_145_0.png)\n\n调用 `expired()` 可能比调用\
    \ `use_count()` 快，因为 `use_count` 可能不是数时间复杂度。\n\n"
