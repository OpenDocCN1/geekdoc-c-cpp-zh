  - '[PAGE 54]


    # Brace Initialization and Implicit Narrowing


    Sole exception: implicit narrowing.


    +   C++98 allows it via brace initialization, C++0x doesn’t:


    ```

    struct Point { int x, y; };

    Point p1 { 1, 2.5 };

    // fine in C++98:

    // implicit double -> int

    // conversion;

    // error in C++0x

    Point p2 { 1, static_cast<int>(2.5) };

    // fine in both C++98

    // and C++0x

    ```


    Narrowing conversions are defined in [decl.init.list] (8.5.4/7 in N3290). Basically,
    a conversion is narrowing if (1) the target type can’t represent all values of
    the source type and (2) the compiler can’t guarantee that the source value will
    be within the range of the target type, e.g.


    ```

    int x { 2.5 };

    double d { x };

    unsigned u { x };

    unsigned u { 25 };

    // error: all conversions from floating point

    // to integer type are narrowing

    // error: double can’t represent all ints

    // error: unsigned can’t represent all ints

    // okay: compiler knows that unsigned can represent 25

    ```'
