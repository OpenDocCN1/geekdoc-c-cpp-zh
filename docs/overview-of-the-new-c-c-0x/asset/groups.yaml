  - '[PAGE 231]


    # Move Support


    C++ sometimes performs unnecessary copying:

    typedef std::vector<T> TVec;

    TVec createTVec(); // factory function

    TVec vt;

    ...

    vt = createTVec(); // copy return value object to vt,

    // then destroy return value


    ![](img/68a90f505054116271758fb914871a74_231_0.png)


    The diagrams on this slide make up a PowerPoint animation.


    Throughout this discussion, I use a container of T, rather than specifying a particular
    type,

    e.g., container of string or container of int. The motivation for move semantics
    is largely

    independent of the types involved, although the larger and more expensive the
    types are

    to copy, the stronger the case for moving over copying.'
