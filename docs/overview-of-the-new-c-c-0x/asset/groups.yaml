  - '[PAGE 113]


    # Mutexes


    Four types:


    +   - std::mutex: non-recursive, no timeout support

    - std::timed_mutex: non-recursive, timeout support

    - std::recursive_mutex: recursive, no timeout support

    - std::recursive_timed_mutex: recursive, timeout support


    Recursively locking non-recursive mutexes ⇒ undefined behavior.


    Mutex objects are neither copyable nor movable. Copying a mutex doesn''t really
    make any sense (you''d end up with multiple mutexes for the same data). Anthony
    Williams'
  - '[PAGE 114]


    # RAII Classes for Mutexes


    Mutex typically managed by RAII classes:


    +   **std::lock_guard**: lock mutex ctor, unlock it in dtor.

    - std::mutex m; // mutex object

    - std::lock_guard<std::mutex> L(m); // lock m

    - ... // critical section

    - } // unlock m

    - No operations.

    - No copying/moving, no assignment, no manual unlock.


    RAII = "Resource Acquisition is Initialization."

    In general, the terminology "lock" seems to mean an RAII or RAII-like class for
    managing the locking/unlocking of a mutex.

    std::lock_guard is neither copyable nor movable. Again, copying makes no sense.
    Movability is precluded, because, as Daniel Krüger puts in a 6 April 2010 comp.std.c++
    posting, lock_guard is supposed to provide the minimum necessary functionality
    with minimum overhead. If you need a movable lock, you should use unique_lock.'
  - "[PAGE 115]\n\n# RAII Classes for Mutexes\n\n+   - std::unique_lock: much more\
    \ flexible.\n- May lock mutex after construction, unlock before destruction.\n\
    - Moveable, but not copyable.\n- Supports timed mutex operations:\n  - Typically\
    \ the best choice for timed mutexes.\n\n```\nusing RCM = std::recursive_timed_mutex;\
    \ // typedef\nRCM m; // mutex object\n{\n    std::unique_lock<RCM> L(m); // lock\
    \ m\n    ... // critical section\n    L.unlock(); // unlock m\n    ... // nothing\
    \ happens\n}\n```\n\nThe name unique_lock is by analogy to unique_ptr. Originally,\
    \ a \"shared_lock\" type was proposed (to be a reader/writer lock), but it was\
    \ not adopted for C++0x."
  - "[PAGE 116]\n\n# Additional unique_lock Functionality\n\n```\nusing TM = std::timed_mutex;\
    \ // typedef\nTM m; // mutex object\n{\n    std::unique_lock<TM> L(m, std::defer_lock);\
    \ // associate m with\n    // w/o locking it\n    \n    if (L.try_lock_for(std::chrono::microseconds(10)))\
    \ {\n        // critical section\n        ...\n    } else {\n        // timeout\
    \ w/o\n        // locking m\n        ...\n    }\n    if (L) {\n        // convert\
    \ to bool\n        // critical section\n        ...\n    } else {\n        //\
    \ m isn't locked\n        ...\n    }\n}\n// if m locked, unlock\n```"
  - "[PAGE 117]\n\n# Multiple Mutex Acquisition\n\nAcquiring mutexes in different\
    \ orders leads to deadlock:\n\n```\nint weight, value;\nstd::mutex wt_mutex, val_mutex;\n\
    \n{\n    std::lock_guard<std::mutex> wt_lock(wt_mutex); // Thread 1 // wt 1st\n\
    \    std::lock_guard<std::mutex> val_lock(val_mutex); // val 2nd\n    work with\
    \ weight and value // critical section\n}\n\n{\n    std::lock_guard<std::mutex>\
    \ val_lock(val_mutex); // Thread 2 // val 1st\n    std::lock_guard<std::mutex>\
    \ wt_lock(wt_mutex); // wt 2nd\n    work with weight and value // critical section\n\
    }\n```"
  - "[PAGE 118]\n\n# Multiple Mutex Acquisition\n\nstd::lock solves this problem:\n\
    \n```\n{ // Thread 1\n  std::unique_lock<std::mutex> wt_lock(wt_mutex, std::defer_lock);\n\
    \  std::unique_lock<std::mutex> val_lock(val_mutex, std::defer_lock);\n  std::lock(wt_lock,\
    \ val_lock); // get mutexes w/o\n                                // deadlock\n\
    \  work with weight and value // critical section\n}\n // Thread 2\n  std::unique_lock<std::mutex>\
    \ val_lock(val_mutex, std::defer_lock);\n  std::unique_lock<std::mutex> wt_lock(wt_mutex,\
    \ std::defer_lock);\n  std::lock(val_lock, wt_lock); // get mutexes w/o\n    \
    \                            // deadlock\n  work with weight and value // critical\
    \ section\n}\n```\n\nstd::lock avoids deadlock is unspecified. It could canonically\
    \ order the locks, use a back-off algorithm, etc.\n\nIf std::lock is called with\
    \ a lock object that is already locked, an exception is thrown. If std::lock is\
    \ called with mutex objects and one of the mutex objects is already locked, behavior\
