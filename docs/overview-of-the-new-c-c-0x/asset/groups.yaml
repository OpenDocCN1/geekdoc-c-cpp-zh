    \ lookupName(int id);\nint widgetID;\n..\n```\n\n```cpp\nstd::vector<int> tempVec;\
    \ // used only for Widget ctor\n...\n```\n\n```cpp\nWidget w(lookupName(widgetID),\
    \ // rvalues args, but Widget\nstd::move(tempVec)); // copies copies to members\n\
    ```\n\nOverloading Widget ctor for lvalue/rvalue combos → 4 functions.\n\n- Generally,\
    \ n parameters requires 2ⁿ overlaps.\n- Impractical for large n.\n- Boring/repetitive/error-prone\
    \ for smaller n.\n\n## Construction and Perfect Forwarding\n\nGoal: one function\
    \ that “does the right thing;\n\n- Copies lvalue args, moves rvalue args.\n\n\
    Solution is a perfect forwarding ctor:\n\n- Templated ctor forwarding T&&& params\
    \ to members:\n\n```cpp\nclass Widget {\npublic:\n    template<typename T1, typename\
    \ T2>\n    Widget(T1&& n, T2& c)\n        : name(std::forward<T1>(n)), // forward\
    \ n to string ctor\n          coordinates(std::forward<T2>(c)) // forward c to\
    \ vector ctor\n    ...\nprivate:\n    std::string name;\n    std::vector<int>\
    \ coordinates;\n};\n```\n\n> © 2011 Scott Meyers, all rights reserved.\n\nAs noted\
    \ on a later slide, this doesn't behave precisely like the non-template constructor,\
    \ because perfect forwarding isn’t perfect.\n\n## Construction and Perfect Forwarding\n\
    \nOnce again:\n\n- A templated ctor forwarding T&& params to members:\n```cpp\n\
    class Widget {\npublic:\n    template<typename T1, typename T2>\n    Widget(T1&&\
    \ n, T2&& c)\n        : name(std::forward<T1>(n)),      // forward n to string\
    \ ctor\n          coordinates(std::forward<T2>(c)) // forward c to vector ctor\n\
    {}\n\nprivate:\n    std::string name;\n    std::vector<int> coordinates;\n};\n\
    ```\n\nEffect:\n\n- Lvalue passed to n -> std::string ctor receives lvalue.\n\
    - Rvalue passed to n -> std::string ctor receives rvalue.\n- Similarly for c and\
    \ std::vector ctor.\n\n## Perfect Forwarding Beyond Construction\n\nUseful for\
    \ more than just construction, e.g., for setters:\n\n```cpp\nclass Widget {\n\
    public:\n  // revised\n  // example\n  template<typename T>\n  void setName(T&&\
    \ name) // forward\n  { name = std::forward<T>(name); } // new\n  template<typename\
    \ T>\n  void setCoords(T&& newCoords) // forward\n  { coordinates = std::forward<T>(newCoords);\
    \ } // newCoords\n\nprivate:\n  std::string name;\n  std::vector<int> coordinates;\n\
    };\n```\n\nAs noted on a later slide, this doesn't behave precisely like the non-template\
    \ setters, because perfect forwarding isn't perfect.\n\n## Perfect Forwarding\
    \ Beyond Construction\n\nDespite T&&& parameter, code fully type-safe:\n\n- Type\
    \ compatibility verified upon instantiation.\n  - E.g., only std::string-compatible\
    \ types valid in setName.\n\nMore flexible than a typed parameter.\n\n- Accepts/forwards\
    \ all compatible parameter types.\n  - E.g., std::string, char*, const char* for\
    \ setName.\n\n## Overview of the New C++ (C++0x)\n\n## Perfect Forwarding Beyond\
    \ Construction\n\nFlexibility can be removed via static_assert (described soon):\n\
    \n```cpp\ntemplate<typename T>\nvoid setName(T& newName)\n{\n    static_assert(std::is_same<std::decay<T>::type,\
    \ std::string>::value,\n\"T must be a [const] std::string\");\n    name = std::forward<T>(newName);\n\
    }\n```\n\nstd::decay<T>::type is, for non-array and non-function types, equivalent\
    \ to std::remove_cv<std::remove_reference<T>>::type::type.\n\nstatic_assert has\
    \ not been introduced yet.\n\nstd::enable_if could also be used, static_assert\
    \ seems simpler and clearer in this case. std::enable_if would remove setName\
    \ from the overload set, while static_assert would be evaluated only after setName\
    \ had been selected as the overload to be called.\n\n## std::forward\n\nConsider\
    \ again:\n\n```cpp\ntemplate<typename T>\nvoid setName(T& newName)\n{ name = std::forward<T>(newName);\
    \ }\n```\n\n- A reference (i.E., T is T&) ⇒ lvalue was passed to newName\n  -\
    \ std::forward<T>(newName) should return lvalue.\n- A non-reference (i.E., T is\
    \ T) ⇒ rvalue was passed to newName\n  - std::forward<T>(newName) should return\
    \ rvalue.\n\n## Perfect Forwarding\n\n- Applicable only to function templates.\n\
    - Preserves lvalue/rvalue when forwarding them.\nPerfect forwarding isn’t really\
    \ perfect. There are several kinds of arguments that cannot be perfectly forwarded,\
    \ including (but not limited to):\n\n- 0 as a pointer constant.\n- Names of function\
    \ templates (e.g., std::endl and other manipulators).\n- Braced initializer lists.\n\
    - In-class initialized static data members.\n- Bit fields.\n\n## default Functions\n\
    \nThe “special” member functions are implicitly generated if used:\n\n- Default\
