    # unique_ptr vs. shared_ptr


    Already noted:


    +   - Deleter part of unique_ptr type, not shared_ptr doesn''t.

    - unique_ptr supports arrays, shared_ptr doesn''t.

    - Both support for incomplete types.


    In addition:


    +   - shared_ptr supports static_pointer_cast, const_pointer_cast, dynamic_pointer_cast;
    unique_ptr doesn''t.

    - No unique_ptr analogue to make_shared/allocate_shared.


    unique_ptr''s support for incomplete types has one caveat. Given a std::unique_ptr<T>
    p, the type T must be complete at the point where p''s destructor is invoked.
    Violation of this constraint requires a diagnostic, i.e., code failing to fulfill
    it typically not compile. This constraint applies only to unique_ptrs using the
    default deleter; unique_ptrs using custom deleters are not so constrained.'
