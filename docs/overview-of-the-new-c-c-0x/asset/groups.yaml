- md: "\n## Capturing Local Variables\n\nDifferent locals may be captured differently:\n\
    \n```cpp\n{\n  int minVal;\n  double maxVal;\n  ...\n  auto it = std::find_if(v.cbegin(),\
    \ v.cend(),\n    [minVal, &maxVal](int i)\n    { return i > minVal && i < maxVal;\
    \ });\n}\n```\n\nCorresponds to:\n\n```cpp\nclass MagicType{\npublic:\n  MagicType(int\
    \ v1, double& v2): _minVal(v1), _maxVal(v2) {}\n  bool operator()(int i) const\
    \ { return i > _minVal && i < _maxVal; }\nprivate:\n  int _minVal;\n  double&\
    \ _maxVal;\n}\n```\n\n```cpp\nauto it = std::find_if(v.cbegin(), v.cend(), //\
    \ same as\n  MagicType(minVal, maxVal)); // before\n```\n\n## Capturing Local\
    \ Variables\n\nCapture mode defaults may be specified:\n\n```cpp\nauto it = std::find_if(v.cbegin(),\
    \ v.rend(), // default is\n    [](int i) // by value\n    { return i > minVal\
    \ && i < maxVal; });\nauto it = std::find_if(v.cbegin(), v.rend(), // default\
    \ is\n    [&](int i) // by ref\n    { return i > minVal && i < maxVal; });\n```\n\
    \nWith a default capture mode, captured variables need not be listed.\n\n- As\
    \ in examples above.\n\n## Capturing Local Variables\n\nDefault overridable on\
    \ a per-variable basis:\n\n```cpp\nauto it = std::find_if(v.cbegin(), v.cend(),\
    \ // default capture is\n                                 [=, &maxVal](int i //\
    \ by value, but maxVal\n                               { return i > minVal &&\
    \ // is by reference\n                                 i < maxVal; });\n```\n\n\
    Corresponds to:\n\n```cpp\nclass MagicType {\npublic:\n    MagicType(int v1, double&\
    \ v2): _minVal(v1), _maxVal(v2)\n    bool operator()(int i) const { return i >\
    \ _minVal && i < _maxVal; }\nprivate:\n    int _minVal;\n    double& _maxVal;\n\
    };\nauto it = std::find_if(v.cbegin(), v.cend(), MagicType(minVal, maxVal));\n\
    ```\n\n## Capturing Class Members\n\nTo access class members within a member function,\
    \ capture this:\n\n```cpp\nclass Widget {\npublic:\n    void doSomething();\n\
    private:\n    std::list<int> li;\n    int minVal;\n};\n\nvoid Widget::doSomething()\
    \ {\n    auto it = std::find_if(li.begin(), li.end(),\n        [minVal](int i)\
    \ { return i > minVal; } // error!\n    ...\n}\n\nvoid Widget::doSomething() {\n\
    \    auto it = std::find_if(li.begin(), li.end(),\n        [this](int i) { return\
    \ i > minVal; } // fine\n    );\n}\n```\n\nLambdas used in a member function yield\
    \ closure types defined in member function, hence within the closure containing\
    \ the member function. That makes it possible for the closure's operator() to\
    \ refer to all members of the class, e.g., to minVal in the lambda on this page.\
    \ There's no need for friendship, because the closure type is within (i.e., part\
    \ of) the class.\n\n## Capturing Class Members\n\nA default capture mode also\
    \ makes this available:\n\n```cpp\nclass Widget {\npublic:\n  void doSomething();\n\
    private:\n  std::list<int> li;\n  int minVal;\n};\n\nvoid Widget::doSomething()\
    \ {\n  auto it = std::find_if(li.begin(), li.end(),\n    [-](int i) { return i\
    \ > minVal; } // fine\n  );\n}\n\nvoid Widget::doSomething() {\n  auto it = std::find_if(li.begin(),\
    \ li.end(),\n    [&](int i) { return i > minVal; } // also fine, same\n    //\
    \ effect (for \"this\")\n  );\n}\n```\n\nCapturing this by reference may be less\
    \ efficient than capturing it by value, because going through the reference requires\
    \ double indirection (modulo compiler optimizations).\n\n## Lambda Return Types\n\
    \nOptional when:\n\n- Return type is void.\n- Lambda body is “return expr,”\n\
    - Return type is that of expr.\n\nOtherwise must be specified via trailing return\
    \ type syntax:\n\n```cpp\nstd::vector<double> v;\nstd::transform(v.begin(), v.end(),\
    \ v.begin(),\n[](double d)->double\n{\n  makeLogEntry(\"std::transform\", d);\n\
    \  return std::sqrt(std::abs(d));\n});\n```\n\n## Trailing Return Types\n\n- Must\
    \ be used with lambdas (when a return type is given).\n- Often useful with decltype\
    \ (described later).\n- Permitted for any function (with a leading auto):\n\n\
    ```cpp\nvoid f(int x);                          // traditional syntax\nauto f(int\
    \ x)->void;                   // same declaration with trailing\n            \
    \                             // return type\n\nclass Widget {\npublic:\n    void\
    \ mf1(int x);                     // traditional\n    auto mf2() const;      \
    \         // trailing return type\n};\n```\n\nNon-lambda non-decltype uses not\
    \ expected to be common.\n\n## Lambdas without Parameter Lists\n\nLambdas without\
    \ parameters especially omit the parameter list.\n\n- Such functions especially\
    \ useful with threads:\n- void doWork(int x, int y);\n- void doMoreWork();\n-\
    \ std::thread t1([] { doWork(10, 20); doMoreWork(); }); // w/empty\n  // param\
    \ list\n- std::thread t2([] { doWork(10, 20); doMoreWork(); }); // w/o empty\n\
    \  // param list\n\nOmitting the optional parentheses seems to be common.\n\n\
    [std::thread] has not been introduced.\n\nmutable lambdas may not omit the parameter\
    \ list, but this course does not discuss mutable lambdas.\n\n## Lambda Expression\
    \ Complexity\n\nLambdas may be arbitrarily complex:\n\n- Multiple statements,\
    \ multiple returns.\n- Throw/catch exceptions.\n- Essentially anything allowed\
    \ in a “normal” function.\n\nMaintainability considerations suggest:\n\n- Short,\
    \ clear, context-derived lambdas are best.\n\nNot absolutely everything allowed\
    \ in a normal function is allowed in a lambda expression, e.g., there is no way\
    \ to refer to this pointer of the operator() function generated from the lambda.\n\
    \n## Storing Closures\n\nClosure types not specified, but two easy ways to store\
    \ closures:\n\n- auto\n- auto multipleOf5 = [](long x) { return x % 5 == 0; }\n\
    - std::vector<long> vl;\n- ...\n- vl.erase(std::remove_if(vl.begin(), vl.end(),\
    \ multipleOf5), vl.end());\n- std::function\n- std::function<bool(long)> multipleOf5\
    \ = // see next page for syntax\n  [](long x) { return x % 5 == 0; }\n- ...\n\
    - vl.erase(std::remove_if(vl.begin(), vl.end(), multipleOf5), vl.end());\n\nEvery\
    \ lambda expression yields a unique closure type. VC10 names these types\nanonymous-namespace:<lambda0>,\
    \ anonymous-namespace:<lambda1>, etc. gcc 4.5\nis naming less obvious (e.g., <lambda0>,\
    \ <lambda1>, etc.).\n\nClosure types are created in block scope, class scope,\
    \ or namespace scope.\n\nLambdas can't be directly recursive, but that can be\
    \ achieved by having a std::function object initialized with the closure. For\
    \ example:\n\n```cpp\nstd::function<int(int)> factorial = [&](int x) { return\
    \ (x==1) ? 1 : x * factorial(x-1); };\n```\n\n## Specifying Function Types\n\n\
    A function's type is its declaration w/o names:\n\n```cpp\nvoid f1(int x);   \
    \           // type is void(int)\ndouble f2(int x, std::string& s); // type is\
    \ double(int, std::string&)\n```\n\nC++ uses function types for e.g., std::function:\n\
    \nTrailing return type syntax is equivalent:\n\n```cpp\nstd::function<auto (long)->bool>\
    \ multipleOf5 = // equivalent to above\n[](long x) { return x % 5 == 0; };\n```\n\
    \nVC10, despite support for trailing return syntax in general, does not compile\
    \ the second declaration of multipleOf5 on this page. gcc 4.5 accepts it.\n\n\
    ## Storing Closures\n\nauto more efficient than std::function, but not always\
    \ applicable.\n\n- Not allowed for function parameters or return types:\nvoid\
    \ uselt(auto func); // error!\nvoid uselt(std::function<bool(long)> func); //\
    \ fine\ntemplate<typename Func>\nvoid uselt(Func func); // fine, but generates\
    \ multiple functions\n\n- auto makeFunc(); // error!\nstd::function<bool(long)>\
    \ makeFunc(); // fine\ntemplate<typename Func>\nFunc makeFunc(); // fine, but\
    \ generates multiple functions, and callers must specify Func\n\nRegarding efficiency\
    \ of auto vs. std::function, Stefan T. Lavavej says, “A compiler have to perform\
    \ extreme heroics to get function be as efficient as auto.”\n\n## Storing Closures\n\
    \n- Not allowed for class data members:\n\n```cpp\nclass Widget {\nprivate:\n\
    \    auto func; // error!\n    ...\n};\nclass Widget {\nprivate:\n    std::function<bool(long)>\
    \ f; // fine\n    ...\n}\n```\n\n## Stored Closures and Dangling References\n\n\
    Stored closures can hold dangling members.\n\n- E.g., pointers to deleted heap\
    \ objects.\n- E.g., references to beyond-scope locals:\n\n```cpp\nstd::vector<long>\
    \ vl;\nstd::function<bool(long)> f;\n{\n    int divisor;\n    f = [&](long x)\
    \ { return x % divisor == 0; }; // closure refers to local var\n             \
    \                                  // scope ends\n}\nvl.erase(std::remove_if(vl.begin(),\
    \ vl.end(), f), // calls to f use dangling ref!\n        vl.end());\n```\n\nIt's\
    \ your responsibility to avoid such problems.\n"
